# Commit processing steps for the WinGet publish pipeline, sparse checkout.

steps:

# Blobless clone. Only fetch the specified sparse checkout directories.
- checkout: self
  clean: true
  persistCredentials: true
  fetchDepth: 0
  fetchTags: false
  fetchFilter: blob:none
  sparseCheckoutDirectories: DevOpsPipelineDefinitions

- template: /DevOpsPipelineDefinitions/templates/winget-setup.yaml@self
  parameters:
    type: Publish

- template: /DevOpsPipelineDefinitions/templates/initialize-commits.yaml@self

- template: /DevOpsPipelineDefinitions/templates/validate-commits.yaml@self
