ShortDescription: DEX to Java decompiler with a CLI, HTTP API and MCP server
Description: |-
  ddc decompiles Android DEX bytecode to readable Java. One binary exposes a
  CLI, an HTTP API and an MCP server for AI agents. It reads APK, XAPK, APKS,
  JAR and ZIP containers, handles multi-dex apps, and keeps large decompiles
  browsable through progressive-disclosure views.
