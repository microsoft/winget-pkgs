id: scheduledSearch.noRecentActivity
name: GitOps.PullRequestIssueManagement
description: Mark and close stale issues and pull requests requiring author feedback
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
      - description: >-
          Search for PR where -
          * Pull Request is Open
          * Pull request has the label Needs-Author-Feedback
          * Pull request does not have the label No-Recent-Activity
          * Pull request does not have the label Blocking-Issue
          * Has not had activity in the last 5 days

          Then -
          * Add No-Recent-Activity label
          * Add the PR specific reply notifying the issue author of pending closure
        frequencies:
          - hourly:
              hour: 6
        filters:
          - isPullRequest
          - isOpen
          - hasLabel:
              label: Needs-Author-Feedback
          - isNotLabeledWith:
              label: No-Recent-Activity
          - isNotLabeledWith:
              label: Blocking-Issue
          - noActivitySince:
              days: 5
        actions:
          # Guard retries with the label before posting the warning
          - addLabel:
              label: No-Recent-Activity
          - addReply:
              reply: >-
                Hello ${issueAuthor},


                This pull request has been automatically marked as stale because it has been marked as requiring author feedback but has not had any recent activity. It will be closed if no further activity occurs **within 3 days of this comment**.


                ###### Template: msftbot/noRecentActivity
      - description: >-
          Search for issues where -
          * Issue is Open
          * Issue has the label Needs-Author-Feedback
          * Issue does not have the label No-Recent-Activity
          * Issue does not have the label Blocking-Issue
          * Has not had activity in the last 5 days

          Then -
          * Add No-Recent-Activity label
          * Add the issue specific reply notifying the issue author of pending closure
        frequencies:
          - daily:
              time: 12:00
        filters:
          - isIssue
          - isOpen
          - hasLabel:
              label: Needs-Author-Feedback
          - isNotLabeledWith:
              label: No-Recent-Activity
          - isNotLabeledWith:
              label: Blocking-Issue
          - noActivitySince:
              days: 5
        actions:
          # Guard retries with the label before posting the warning
          - addLabel:
              label: No-Recent-Activity
          - addReply:
              reply: >-
                Hello ${issueAuthor},


                This issue has been automatically marked as stale because it has been marked as requiring author feedback but has not had any recent activity. It will be closed if no further activity occurs **within 3 days of this comment**.


                ###### Template: msftbot/noRecentActivity
      - description: >-
          Search for PR where -
          * Pull Request is Open
          * Pull request has the label Needs-Author-Feedback
          * Pull request has the label No-Recent-Activity
          * Pull request does not have the label Blocking-Issue
          * Has not had activity in the last 3 days

          Then -
          * Close the PR
          * Add the PR specific closure reply
        frequencies:
          - hourly:
              hour: 6
        filters:
          - isPullRequest
          - isOpen
          - hasLabel:
              label: Needs-Author-Feedback
          - hasLabel:
              label: No-Recent-Activity
          - isNotLabeledWith:
              label: Blocking-Issue
          - noActivitySince:
              days: 3
        actions:
          # Guard retries with the closed state before posting the closure reply
          - closeIssue
          - addReply:
              reply: >-
                Hello ${issueAuthor},


                This pull request has been automatically closed because the requested author feedback was not provided within 3 days of the stale warning.


                ###### Template: msftbot/noRecentActivity/close
      - description: >-
          Search for Issues where -
          * Issue is Open
          * Issue has the label Needs-Author-Feedback
          * Issue has the label No-Recent-Activity
          * Issue does not have the label Blocking-Issue
          * Has not had activity in the last 3 days

          Then -
          * Close the Issue
          * Add the issue specific closure reply
        frequencies:
          - daily:
              time: 12:00
        filters:
          - isIssue
          - isOpen
          - hasLabel:
              label: Needs-Author-Feedback
          - hasLabel:
              label: No-Recent-Activity
          - isNotLabeledWith:
              label: Blocking-Issue
          - noActivitySince:
              days: 3
        actions:
          # Guard retries with the closed state before posting the closure reply
          - closeIssue
          - addReply:
              reply: >-
                Hello ${issueAuthor},


                This issue has been automatically closed because the requested author feedback was not provided within 3 days of the stale warning.


                ###### Template: msftbot/noRecentActivity/close
onFailure:
onSuccess:
