          GH_AW_PROMPT: /tmp/gh-aw/aw-prompts/prompt.txt
          GH_AW_EXPR_1A3A194A: ${{ github.event.discussion.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'discussion' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_463A214A: ${{ github.event.pull_request.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'pull_request' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_802A9F6A: ${{ github.event.issue.number || (fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_type == 'issue' && fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').item_number) }}
          GH_AW_EXPR_FF1D34CE: ${{ github.event.comment.id || fromJSON(github.event.inputs.aw_context || github.event.client_payload.aw_context || '{}').comment_id }}
          GH_AW_GITHUB_ACTOR: ${{ github.actor }}
          GH_AW_GITHUB_REPOSITORY: ${{ github.repository }}
          GH_AW_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_AW_GITHUB_WORKSPACE: ${{ github.workspace }}
          GH_AW_MCP_CLI_SERVERS_LIST: "- `github` — run `github --help` to see available tools\n- `safeoutputs` — run `safeoutputs --help` to see available tools"
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);

            const substitutePlaceholders = require('${{ runner.temp }}/gh-aw/actions/substitute_placeholders.cjs');

            // Call the substitution function
            return await substitutePlaceholders({
              file: process.env.GH_AW_PROMPT,
              substitutions: {
                GH_AW_EXPR_1A3A194A: process.env.GH_AW_EXPR_1A3A194A,
                GH_AW_EXPR_463A214A: process.env.GH_AW_EXPR_463A214A,
                GH_AW_EXPR_802A9F6A: process.env.GH_AW_EXPR_802A9F6A,
                GH_AW_EXPR_FF1D34CE: process.env.GH_AW_EXPR_FF1D34CE,
                GH_AW_GITHUB_ACTOR: process.env.GH_AW_GITHUB_ACTOR,
                GH_AW_GITHUB_REPOSITORY: process.env.GH_AW_GITHUB_REPOSITORY,
                GH_AW_GITHUB_RUN_ID: process.env.GH_AW_GITHUB_RUN_ID,
                GH_AW_GITHUB_WORKSPACE: process.env.GH_AW_GITHUB_WORKSPACE,
                GH_AW_MCP_CLI_SERVERS_LIST: process.env.GH_AW_MCP_CLI_SERVERS_LIST
              }
            });
      - name: Validate prompt placeholders
        env:
          GH_AW_PROMPT: /tmp/gh-aw/aw-prompts/prompt.txt
        # poutine:ignore untrusted_checkout_exec
        run: bash "${RUNNER_TEMP}/gh-aw/actions/validate_prompt_placeholders.sh"
      - name: Print prompt
        env:
          GH_AW_PROMPT: /tmp/gh-aw/aw-prompts/prompt.txt
        # poutine:ignore untrusted_checkout_exec
        run: bash "${RUNNER_TEMP}/gh-aw/actions/print_prompt_summary.sh"
      - name: Upload activation artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.github/agents
            /tmp/gh-aw/.github/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs: activation
    if: needs.activation.outputs.daily_ai_credits_exceeded != 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      copilot-requests: write
      pull-requests: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: unattendedartifacttriage
    outputs:
      agentic_engine_timeout: ${{ steps.detect-agent-errors.outputs.agentic_engine_timeout || 'false' }}
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      http_400_response_error: ${{ steps.detect-agent-errors.outputs.http_400_response_error || 'false' }}
      inference_access_error: ${{ steps.detect-agent-errors.outputs.inference_access_error || 'false' }}
      invocation_cap_exceeded: ${{ steps.detect-agent-errors.outputs.invocation_cap_exceeded || 'false' }}
      mcp_policy_error: ${{ steps.detect-agent-errors.outputs.mcp_policy_error || 'false' }}
      model: ${{ needs.activation.outputs.model }}
      model_not_supported_error: ${{ steps.detect-agent-errors.outputs.model_not_supported_error || 'false' }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@e89c65e17eb281bbd5ff2ff9e9199a03e96654c7 # v0.83.4
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Unattended Artifact Triage"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/unattended-artifact-triage.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.75"
          GH_AW_INFO_AWF_VERSION: "v0.27.42"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: activation
          path: /tmp/gh-aw
      - name: Install GitHub Copilot CLI
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh" 1.0.75
        env:
          GH_HOST: github.com
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.27.42 --rootless
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const determineAutomaticLockdown = require('${{ runner.temp }}/gh-aw/actions/determine_automatic_lockdown.cjs');
            await determineAutomaticLockdown(github, context, core);
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".github/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".github/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - env:
          TARGET_PR: ${{ github.event.inputs.pull_request_number }}
        name: Collect safe unattended artifact metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        with:
          github-token: ${{ github.token }}
          script: "const fs = require(\"fs\");\nconst outputPath = \"/tmp/gh-aw/unattended-artifact.json\";\nfs.mkdirSync(\"/tmp/gh-aw\", { recursive: true });\nconst owner = \"microsoft\", repo = \"winget-pkgs\";\nconst appId = 1451866;\nconst appSlug = \"wingetvalidator-prod\";\nconst completionName = \"10. Validation Completed\";\nconst installationName = \"08. Installation Validation\";\nconst targetLabel = \"Validation-Unattended-Failed\";\nconst maxTextBytes = 20000, maxJsonBytes = 16000, maxEntries = 100;\nconst maxEntryBytes = 10 * 1024 * 1024;\nconst maxScreenshotBytes = 5 * 1024 * 1024;\nconst unsafeLabels = new Set([\n  \"URL-Validation-Error\", \"Validation-Defender-Error\",\n  \"Validation-Virus-Scan-Error\", \"Validation-SmartScreen\",\n  \"Validation-SmartScreen-Error\", \"Needs-SmartScreen-Investigation\",\n  \"Validation-Hash-Flagged\", \"Validation-Hash-Verification-Failed\",\n  \"Validation-Hash-Error\", \"Error-Hash-Mismatch\",\n  \"Validation-Signature-Error\", \"Validation-Shell-Execute\",\n  \"Binary-Validation-Error\", \"Validation-Executable-Error\",\n  \"Internal-Error-Static-Scan\", \"Possible-Malware\",\n  \"Blocking-Issue\",\n]);\nconst output = {\n  available: false, pullRequestNumber: null, headSha: null,\n  operationBound: false, installation: null, screenshot: null,\n};\nconst fail = () => { throw new Error(\"Evidence is unavailable.\"); };\nconst boundedInteger = (value, maximum) =>\n  Number.isSafeInteger(value) && value >= 0 && value <= maximum;\nconst trusted = (check, headSha) =>\n  check?.app?.id === appId &&\n  check?.app?.slug === appSlug &&\n  check?.head_sha === headSha;\ntry {\n  const pullRequestNumber = Number(process.env.TARGET_PR);\n  if (!Number.isSafeInteger(pullRequestNumber) || pullRequestNumber <= 0) fail();\n  const pull = (\n    await github.rest.pulls.get({\n      owner, repo, pull_number: pullRequestNumber,\n    })\n  ).data;\n  const headSha = String(pull?.head?.sha ?? \"\");\n  output.pullRequestNumber = pullRequestNumber; output.headSha = headSha || null;\n  if (pull?.state !== \"open\" || !/^[0-9a-f]{40}$/.test(headSha)) fail();\n  const labels = new Set(\n    (pull.labels ?? []).map((label) => String(label?.name ?? \"\")),\n  );\n  if (\n    !labels.has(targetLabel) ||\n    [...labels].some((label) => unsafeLabels.has(label))\n  ) fail();\n  const checksResponse = await github.rest.checks.listForRef({\n    owner, repo, ref: headSha, app_id: appId,\n    filter: \"all\", per_page: 100, page: 1,\n  });\n  const checks = checksResponse.data?.check_runs ?? [];\n  const totalChecks = Number(checksResponse.data?.total_count ?? 0);\n  if (\n    !Number.isSafeInteger(totalChecks) ||\n    totalChecks > 100 ||\n    checks.length !== totalChecks\n  ) fail();\n  const trustedChecks = checks.filter((check) => trusted(check, headSha));\n  const completions = trustedChecks\n    .filter(\n      (check) =>\n        check.name === completionName &&\n        check.status === \"completed\",\n    );\n  if (\n    completions.some(\n      (check) =>\n        !Number.isSafeInteger(check.id) ||\n        !Number.isFinite(Date.parse(check.completed_at ?? \"\")),\n    )\n  ) fail();\n  const completion = completions.sort(\n    (left, right) =>\n      Date.parse(right.completed_at) - Date.parse(left.completed_at) ||\n      right.id - left.id,\n  )[0];\n  if (!completion) fail();\n  const completionTime = Date.parse(completion.completed_at);\n  if (\n    trustedChecks.some(\n      (check) =>\n        [\"queued\", \"in_progress\"].includes(check.status) &&\n        (\n          !Number.isSafeInteger(check.id) ||\n          check.id > completion.id ||\n          Date.parse(check.started_at ?? \"\") > completionTime\n        ),\n    )\n  ) fail();\n  const completionText = String(completion.output?.text ?? \"\");\n  const jsonBlocks = [\n    ...completionText.matchAll(/```json\\s*([\\s\\S]*?)```/gi),\n  ];\n  if (\n    completionText.length === 0 ||\n    completionText.length > maxTextBytes ||\n    jsonBlocks.length !== 1 ||\n    jsonBlocks[0][1].length === 0 ||\n    jsonBlocks[0][1].length > maxJsonBytes\n  ) fail();\n  let payload;\n  try { payload = JSON.parse(jsonBlocks[0][1]); } catch { fail(); }\n  const operationId = String(payload?.OperationId ?? \"\").trim();\n  const artifacts = payload?.Artifacts;\n  if (\n    payload?.PullRequestNumber !== pullRequestNumber ||\n    operationId.length === 0 ||\n    operationId.length > 128 ||\n    operationId !== String(completion.external_id ?? \"\").trim() ||\n    !artifacts ||\n    typeof artifacts !== \"object\" ||\n    Array.isArray(artifacts) ||\n    operationId !== String(artifacts.OperationId ?? \"\").trim()\n  ) fail();\n  const installationChecks = checks.filter(\n    (check) =>\n      trusted(check, headSha) &&\n      check.name === installationName &&\n      check.status === \"completed\" &&\n      String(check.external_id ?? \"\").trim() === operationId,\n  );\n  if (installationChecks.length !== 1) fail();\n  const outcome = String(\n    installationChecks[0].conclusion ?? \"\",\n  ).toLowerCase();\n  if (![\"failure\", \"timed_out\", \"action_required\"].includes(outcome)) fail();\n  let artifactUrl;\n  try { artifactUrl = new URL(String(artifacts.ArtifactDownloadUrl ?? \"\")); }\n  catch { fail(); }\n  if (\n    artifactUrl.protocol !== \"https:\" ||\n    artifactUrl.host !== \"cdn.winget.microsoft.com\" ||\n    artifactUrl.username ||\n    artifactUrl.password\n  ) fail();\n  const installationLogs = artifacts.InstallationLogs;\n  const validationResults = artifacts.ValidationResults;\n  if (!Array.isArray(installationLogs) || !Array.isArray(validationResults)) fail();\n  const entries = [...installationLogs, ...validationResults];\n  if (\n    entries.length > maxEntries ||\n    artifacts.TotalFilesCount !== entries.length ||\n    !boundedInteger(artifacts.TotalSizeBytes, maxEntryBytes) ||\n    !entries.every((entry) =>\n      boundedInteger(entry?.SizeBytes, maxEntryBytes),\n    )\n  ) fail();\n  const screenshots = installationLogs.filter(\n    (entry) =>\n      typeof entry?.FileName === \"string\" &&\n      /\\.(?:png|jpe?g)$/i.test(entry.FileName),\n  );\n  if (screenshots.length !== 1) fail();\n  const screenshot = screenshots[0];\n  const fileName = screenshot.FileName;\n  if (\n    fileName.length === 0 ||\n    fileName.length > 192 ||\n    fileName !== fileName.split(/[\\\\/]/).pop() ||\n    !/^[A-Za-z0-9._ -]+$/.test(fileName) ||\n    fileName.includes(\"..\") ||\n    screenshot.SizeBytes <= 0 ||\n    screenshot.SizeBytes > maxScreenshotBytes\n  ) fail();\n  const normalized = fileName.toLowerCase();\n  const category = (expression) => {\n    const values = new Set(\n      [...normalized.matchAll(expression)].map((match) => match[1]),\n    );\n    return values.size === 1 ? [...values][0] : null;\n  };\n  output.operationBound = true;\n  output.installation = {\n    stage: installationName,\n    outcome,\n    timedOut: outcome === \"timed_out\",\n  };\n  output.screenshot = {\n    exists: true,\n    format: normalized.endsWith(\".png\") ? \"PNG\" : \"JPEG\",\n    architecture: category(\n      /(?:^|[^a-z0-9])(arm64|x64|x86)(?=[^a-z0-9]|$)/g,\n    ),\n    scope: category(/(?:^|[^a-z0-9])(machine|user)(?=[^a-z0-9]|$)/g),\n    locale: category(\n      /(?:^|[^a-z0-9])([a-z]{2}-[a-z]{2})(?=[^a-z0-9]|$)/g,\n    ),\n    sizeBytes: screenshot.SizeBytes,\n  };\n  output.available = true;\n} catch {\n  output.reason = \"Trusted evidence was unavailable or unsafe.\";\n} finally {\n  fs.writeFileSync(outputPath, JSON.stringify(output));\n}\n"
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (source v7)
        with:
          if-no-files-found: error
          name: unattended-artifact-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gh-aw/unattended-artifact.json
          retention-days: 1

      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.27.42@sha256:26a8af4e5566485b02f52af59ee03803ae798271a9619d4767e94d07806deb9b ghcr.io/github/gh-aw-firewall/api-proxy:0.27.42@sha256:944f2686c9ab9bec338fd14b662461662f77cd12cd0ea8a3e7cb8c0987cd1607 ghcr.io/github/gh-aw-firewall/squid:0.27.42@sha256:42dfeb649c680a8558cd5423dbc530b653a69413e35ffbe5e71da5d48c94bdf0 ghcr.io/github/gh-aw-mcpg:v0.4.6@sha256:fecabec51bbc41f2ad61076d6bcd9a36ef23b142e672a444e054d37fc29de93c ghcr.io/github/gh-aw-node@sha256:a8082161d7dceda14b68f32eb39d0eaa96b825d07f5895b096afab9d9e0c7748 ghcr.io/github/github-mcp-server:v1.7.0@sha256:c491ffdf6f4c85cb5397021bc655edb8ab825c6f5f568e7597d77a1bd7c4d308
      - name: Generate Safe Outputs Config
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
          cat > "${RUNNER_TEMP}/gh-aw/safeoutputs/config.json" << 'GH_AW_SAFE_OUTPUTS_CONFIG_ed40b7453c4c07a1_EOF'
          {"noop":{"max":1,"report-as-issue":"false"},"post-unattended-artifact-comment":{"description":"Post one fixed-target unattended artifact routing comment","inputs":{"body":{"default":null,"description":"Complete moderator-facing comment body","required":true,"type":"string"}},"output":"Unattended artifact routing comment posted"},"report_incomplete":{}}
          GH_AW_SAFE_OUTPUTS_CONFIG_ed40b7453c4c07a1_EOF
      - name: Generate Safe Outputs Tools
        env:
          GH_AW_TOOLS_META_JSON: |
            {
              "description_suffixes": {},
              "repo_params": {},
              "dynamic_tools": [
                {
                  "description": "Post one fixed-target unattended artifact routing comment",
                  "inputSchema": {
                    "additionalProperties": false,
                    "properties": {
                      "body": {
                        "description": "Complete moderator-facing comment body",
                        "type": "string"
                      }
                    },
                    "required": [
                      "body"
                    ],
                    "type": "object"
                  },
                  "name": "post_unattended_artifact_comment"
                }
              ]
            }
          GH_AW_VALIDATION_JSON: |
            {
              "noop": {
                "defaultMax": 1,
                "fields": {
                  "message": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  }
                }
              },
              "report_incomplete": {
                "defaultMax": 5,
                "fields": {
                  "details": {
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "reason": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 1024
                  }
                }
              }
            }
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/generate_safe_outputs_tools.cjs');
            await main();
      - name: Start MCP Gateway
        id: start-mcp-gateway
        env:
          GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST: ${{ vars.GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST || 'true' }}
          GH_AW_SAFE_OUTPUTS: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS }}
          GH_AW_SAFE_OUTPUTS_CONFIG_PATH: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS_CONFIG_PATH }}
          GH_AW_SAFE_OUTPUTS_TOOLS_PATH: ${{ steps.set-runtime-paths.outputs.GH_AW_SAFE_OUTPUTS_TOOLS_PATH }}
          GITHUB_MCP_GUARD_MIN_INTEGRITY: ${{ steps.determine-automatic-lockdown.outputs.min_integrity }}
          GITHUB_MCP_GUARD_REPOS: ${{ steps.determine-automatic-lockdown.outputs.repos }}
          GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          mkdir -p "${RUNNER_TEMP}/gh-aw/mcp-config"

          # Export gateway environment variables for MCP config and gateway script
          export MCP_GATEWAY_PORT="8080"
          export MCP_GATEWAY_DOMAIN="awmg-mcpg"
          export MCP_GATEWAY_HOST_DOMAIN="localhost"
          MCP_GATEWAY_API_KEY=$(openssl rand -base64 45 | tr -d '/+=')
          echo "::add-mask::${MCP_GATEWAY_API_KEY}"
          export MCP_GATEWAY_API_KEY
          export MCP_GATEWAY_PAYLOAD_DIR="/tmp/gh-aw/mcp-payloads"
          mkdir -p "${MCP_GATEWAY_PAYLOAD_DIR}"
          export MCP_GATEWAY_PAYLOAD_SIZE_THRESHOLD="524288"
          export DEBUG="*"

          export GH_AW_ENGINE="copilot"
          MCP_GATEWAY_UID=$(id -u 2>/dev/null || echo '0')
