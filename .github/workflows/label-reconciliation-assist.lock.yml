name: "Label Reconciliation Assist"
on:
  # bots: # Bots processed as bot check in pre-activation job
  # - microsoft-github-policy-service[bot] # Bots processed as bot check in pre-activation job
  pull_request_target:
    types:
      - labeled
  # roles: # Roles processed as role check in pre-activation job
  # - admin # Roles processed as role check in pre-activation job
  # - maintainer # Roles processed as role check in pre-activation job
  # - write # Roles processed as role check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      target_pull_request:
        description: Open Highest-Version-Removal or Needs-CLA pull request
        required: true
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: gh-aw-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.inputs.target_pull_request || github.run_id }}
  queue: max

run-name: "Label Reconciliation Assist"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.label-reconciliation-assist
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Label%20Reconciliation%20Assist,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

