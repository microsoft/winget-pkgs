concurrency:
  cancel-in-progress: false
  group: gh-aw-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  queue: max

run-name: "Domain Validation Assist"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
