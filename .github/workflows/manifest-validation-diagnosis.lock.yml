          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/manifest-validation-diagnosis.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.80"
          GH_AW_INFO_AWF_VERSION: "v0.28.14"
