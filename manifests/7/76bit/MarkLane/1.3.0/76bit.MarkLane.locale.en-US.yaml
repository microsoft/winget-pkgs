ShortDescription: One calm viewer for Markdown, JSON, SQLite and more.
Description: |-
  MarkLane is a native document viewer for Windows. Open a file, see it in the view that fits the format, and get out of the way. Markdown, JSON, SQL and code, SQLite, CSV, logs, SVG, HTML and XML all open in one calm reader, with tabs, split view, search, file comparison and a dark theme. MarkLane is a viewer, not an editor.
