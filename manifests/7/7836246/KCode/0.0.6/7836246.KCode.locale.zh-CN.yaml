Description: |-
  KCode 是开源 AI 编程工作台，提供桌面应用、浏览器界面和终端 Agent。自行配置模型供应商即可使用。
  KCode 基于 ZCode（Apache-2.0）公开源码，与 Z.ai / 智谱无官方关联：产品名、图标、命令和环境变量统一为 KCode，去掉智谱 / Z.ai 登录、OAuth、套餐和升级实现，改为自行配置供应商，官方插件市场改为仓库内置目录。
