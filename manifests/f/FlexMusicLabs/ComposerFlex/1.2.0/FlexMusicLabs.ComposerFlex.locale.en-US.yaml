ShortDescription: 'Composes songs for solo piano or a band and plays them, with PianoFlex Player included.'
Description: |-
  Composes complete songs, for solo piano or with a band, from its own musical rules, and plays them as it writes them. Type a few keywords, such as a style, a mood or instruments, or pick a preset, set how calm or wild, and press Start. Each song comes from a seed, so a song you like can be made again. PianoFlex Player comes with it and plays the piano; the band's guitars, bass and drums play in GuitarFlex, BassFlex and DrumFlex, or in your own instruments through MIDI.
  
  The download is both the demo and the full version. The demo never expires: each session lasts 20 minutes, then the sound fades; songs sent to a MIDI port leave out eight keys; the MIDI archive and song videos need a license. A license key unlocks the full version.
