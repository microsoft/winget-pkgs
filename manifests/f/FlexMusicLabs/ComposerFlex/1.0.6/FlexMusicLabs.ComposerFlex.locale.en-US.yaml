ShortDescription: 'Composes solo-piano songs and plays them, with PianoFlex Player included.'
Description: |-
  Composes solo-piano songs and plays them as they are written. Pick a preset (a style) or mix your own, set how calm or wild, and press Start. Each song comes from a seed, so a song you like can be made again. PianoFlex Player comes with it.
  
  The download is both the demo and the full version. The demo never expires: each session lasts 20 minutes, then the sound fades; songs sent to a MIDI port leave out eight keys; the MIDI archive and song videos need a license. A license key unlocks the full version.
