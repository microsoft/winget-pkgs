ShortDescription: 'A modeled piano for Windows: MIDI in, audio out, standalone and as a VST3 plugin.'
Description: |-
  A piano for Windows made by modeling rather than recordings. Many pianos, styles and rooms, each a preset, with every slider open. It plays from a MIDI keyboard on its own and as a VST3 plugin, and makes song videos.
  
  The download is both the demo and the full version. The demo never expires: each session lasts 20 minutes, then the sound fades; eight keys are silent; song videos need a license. A license key unlocks the full version.
