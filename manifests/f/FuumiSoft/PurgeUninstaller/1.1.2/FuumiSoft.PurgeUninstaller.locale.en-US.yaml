ShortDescription: Uninstall apps and every leftover they leave, with a preview and a way back.
Description: |-
  Purge Uninstaller runs an app's own uninstaller, then lists what the app left behind: folders in Program Files, ProgramData and AppData, shortcuts, registry keys, services, drivers and scheduled tasks. Every leftover is shown with its place and size before anything is removed, only the clear matches are ticked, and folders many apps share are never offered.
  Removed items move into Restore, so one click puts them back. It also does batch and force uninstall, finds leftovers of apps removed earlier and manages the right-click menu. Free to use; Pro is a one-time upgrade.
