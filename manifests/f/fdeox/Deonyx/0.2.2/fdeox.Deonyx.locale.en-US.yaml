ShortDescription: Dark mode for any Windows app. Flips lightness, not colors, so 3D views and photos stay true.
Description: |-
  Deonyx darkens the Windows apps that never got a dark mode, like SketchUp and countless older programs. Instead of inverting the screen, it flips only how light each pixel is (OKLab), so red stays red and pictures don't look like negatives. 3D viewports, canvases, photos and videos are found automatically and keep their real colors.
  Pick the apps to darken or darken every light window, choose a look, darken only at night or from sunset to sunrise, and switch with hotkeys, profiles, the tray or the command line. Nothing is injected into other apps and nothing leaves your PC.
