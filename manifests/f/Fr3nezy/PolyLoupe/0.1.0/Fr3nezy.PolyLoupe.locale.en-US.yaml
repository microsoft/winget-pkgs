ShortDescription: Fast 3D model viewer for asset creators, with Explorer thumbnails.
Description: |-
  PolyLoupe opens glTF/GLB, FBX, OBJ, STL, PLY, 3MF and COLLADA files in about a second, with
  Blender-style navigation and shading, texture channels, UV layout, mesh checks, measuring,
  cross-sections and A/B compare. The installer also adds Explorer thumbnails for these formats.
