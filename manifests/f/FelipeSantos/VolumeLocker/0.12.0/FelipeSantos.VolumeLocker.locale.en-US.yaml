  - Shrink the binary, simplify platform code and test COM and updates by @felipecrs in #201
  - Update Rust crate notify-rust to 4.19.0 by @renovate[bot] in #206
  - i18n: add Simplified Chinese (zh-Hans) translation by @BaoZiFly-233 in #205
