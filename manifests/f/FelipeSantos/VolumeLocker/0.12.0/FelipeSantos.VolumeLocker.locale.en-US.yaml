  - Link the C runtime statically by @felipecrs in #208
  - Rename Device Priority to Default device order by @felipecrs in #209
  - Rename Settings transfer to Devices seen as new by @felipecrs in #210

  New Contributors
  - @BaoZiFly-233 made their first contribution in #205 💙
