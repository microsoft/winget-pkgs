ShortDescription: Self-hosted multi-platform AI assistant and agent collaboration platform.
Description: |-
  PiBot is a self-hosted AI assistant and agent collaboration platform built on a "center management + local device execution" architecture.
  The center server manages model providers and API credentials, devices and bots, MCP/Skills/plugins, bot learning, webhook automation tasks, and client version distribution. It can be self-hosted through Docker or an Ubuntu/Debian DEB package.
  Multi-platform nodes (Host & Client) run on Windows, Linux, macOS (Apple Silicon), and Android devices. Tools execute on the device where the bot lives, and the working directory and session storage stay on that device. Clients collaborate with remote hosts through the center relay.
  Core features:
  - Local tools and privacy boundaries: each device's bot binds to a real local working directory, with bundled fixed-version rg/fd search tools and runtime environments. Device tokens and model credentials are protected by system encryption or private permission files.
  - Background execution: accepted tasks keep running after the desktop window closes (systemd --user with linger on Linux, protected logon autostart tasks on Windows, and user LaunchAgents on macOS).
  - Bot board and cross-device group chat: the shared bot board aggregates the needs-you, working, pending-review, and idle states of all devices, with cross-device room chat collaboration.
  - Shower virtual screens: per-session isolated virtual display spaces with GUI automation (private Xvnc and a lightweight desktop on Linux, the interactive session desktop on Windows, and Shizuku-based virtual displays on Android).
  - Bot learning and webhooks: sessions are reviewed automatically in the background to generate skill suggestions, and generic JSON webhooks support idempotency keys for n8n, CI, or external automation scripts.
