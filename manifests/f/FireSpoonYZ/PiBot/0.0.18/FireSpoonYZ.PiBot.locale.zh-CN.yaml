PackageIdentifier: FireSpoonYZ.PiBot
PackageVersion: 0.0.18
PackageLocale: zh-CN
ShortDescription: 自托管的多端 AI 助手与 Agent 协同平台。
Description: |-
  PiBot 采用「中心管控 + 设备本地执行」架构的自托管 AI 助手与 Agent 协同平台。
  中心服务器集中管理模型服务商与 API 凭据、设备与 Bot、MCP / Skill / 插件、Bot 学习、Webhook 自动任务以及客户端版本分发，支持通过 Docker 或 Ubuntu / Debian DEB 安装包自托管。
  多端节点（Host & Client）运行在 Windows、Linux、macOS（Apple Silicon）与 Android 设备上。工具在 Bot 所在设备执行，工作目录与会话主存储也在该设备。客户端通过中心的 Relay 与远端 Host 协作。
  核心特性：
  - 本地工具与隐私边界：每台设备的 Bot 绑定本地真实工作目录，内置固定版本的 rg / fd 搜索与运行时环境，设备令牌和模型凭据由系统加密存储或私有权限文件保护。
  - 后台常驻执行：桌面端关闭窗口不中断已受理任务（Linux 基于 systemd --user + linger，Windows 基于受保护的登录自启动任务，macOS 基于用户 LaunchAgent）。
  - Bot 看板与跨机群聊：汇总所有设备的需要你、工作中、待查看与空闲状态，支持跨设备 Room 群聊协同与 Bot 私聊审阅。
  - Shower 虚拟屏：按会话提供独立虚拟显示空间与 GUI 自动化能力（Linux 私有 Xvnc + 轻量桌面，Windows 交互会话桌面，Android 基于 Shizuku 的虚拟屏）。
  - Bot 学习与 Webhook：后台自动回顾会话并生成 Skill 建议，通用 JSON Webhook 支持幂等键，可用于 n8n、CI 或外部自动化脚本。
