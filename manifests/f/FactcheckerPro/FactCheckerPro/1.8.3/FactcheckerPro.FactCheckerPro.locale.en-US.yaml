ReleaseNotes: |-
  What is new in 1.8.3
  News Videos now has Asia, South America and Oceania tabs, so you can watch clips from channels in more parts of the world.
  FactReels is a new tab with short videos in many categories, fact checks and picks from the community.
  Headline Decoder shows how hard a headline pulls on your emotions.
  Forward Check looks at a WhatsApp, Telegram or SMS forward for the warning signs of a hoax or scam before you pass it on.
  Downloads
  Mac, Intel and Apple Silicon: FactCheckerPro-1.8.3-mac.dmg, signed and notarized by Apple.
  Windows: FactCheckerPro-Setup-x64.exe for most PCs, FactCheckerPro-Setup-arm64.exe for Windows on Arm.
