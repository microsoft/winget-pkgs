ReleaseNotes: |-
  v1.3.0 - FactPlay
  Adds a new FactPlay section with seven interactive features: Spot the Fake (a daily
  headline-vs-debunked-claim challenge with streaks and XP), a Live Event Fact-Check Rail
  for trending topics, a Viral Radar of claims currently being fact-checked, a Screenshot
  Check tool with reverse image search shortcuts, a Creator Credibility lookup, a Job Offer
  Check that scans postings for common new-grad scam red flags, and Squad Mode for private
  group leaderboards. Fully backward-compatible with no changes to existing data or settings.
