ReleaseNotes: |-
  v1.2.1 - Network connectivity fix
  Fixed a network error on sign-in affecting users on corporate networks, VPNs, and machines
  with antivirus HTTPS inspection enabled (Kaspersky, ESET, Bitdefender, etc.).
  Switched API calls from Node built-in fetch to electron.net.fetch, which respects Windows
  proxy settings, WPAD/PAC files, and the system certificate store.
