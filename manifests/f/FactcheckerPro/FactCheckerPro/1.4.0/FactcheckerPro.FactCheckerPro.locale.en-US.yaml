PackageIdentifier: FactcheckerPro.FactCheckerPro
PackageVersion: 1.4.0
PackageLocale: en-US
Publisher: FactChecker Pro
PublisherUrl: https://factcheckerpro.net
PublisherSupportUrl: https://factcheckerpro.net
PrivacyUrl: https://factchecker-pro-production.up.railway.app/privacy
PackageName: FactChecker Pro
PackageUrl: https://factcheckerpro.net
License: Proprietary
ShortDescription: Real-time AI-powered fact-checking with credibility scores, claim detection, source analysis, and misinformation alerts.
Description: |-
  FactChecker Pro is a Windows desktop companion app that brings AI-powered fact-checking
  to your daily browsing. It connects with the FactChecker Pro Chrome extension to deliver
  real-time credibility scores, claim detection, source analysis, and misinformation alerts.

  Sign in to access your transparency score, review your fact-checking history, manage account
  settings, and receive live notifications when claims on pages you visit are flagged.

  Requires the FactChecker Pro Chrome extension for full functionality.
Tags:
  - fact-check
  - misinformation
  - ai
  - news
  - credibility
  - browser
  - journalism
ReleaseNotes: |-
  v1.4.0 - Election Watch NL
  Adds Election Watch NL, a pilot panel built after a conversation with Dutch
  election-disinformation researchers. It surfaces election-period claims sourced
  specifically from Dutch-language fact-checkers via Google's Fact Check Tools API,
  plus related NL-market news, rather than anything translated in from elsewhere.
  Fully backward-compatible with no changes to existing data or settings.
ReleaseNotesUrl: https://github.com/OchanP/FactCheckerPro-Desktop/releases/tag/v1.4.0
