ShortDescription: Free, open-source video downloader for Windows built on yt-dlp and FFmpeg.
Description: |-
  GetVideosLocally is a free, open-source desktop app for downloading and converting video and audio from the 1,000+ sites that yt-dlp supports.
  It offers quality options up to 8K when available, MP4, MKV, MOV and WEBM video output, MP3, WAV, M4A, OPUS and FLAC audio extraction, playlists, subtitles, a download queue and a searchable history.
  Everything runs locally. There is no account, no ads and no paid tier.
