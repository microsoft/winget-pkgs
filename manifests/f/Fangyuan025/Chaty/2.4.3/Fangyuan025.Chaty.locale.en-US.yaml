ReleaseNotes: "## The model knows where it is\n\nChat opens with a few lines from Chaty (on by default, Settings → Chat)：which model is\nrunning and on which engine, the computer it runs on, what Chaty can do and where, and\nhow its reply will be shown. Asked who it is, a model gives the name of what is running;\nit points to the + menu instead of offering to look up what it cannot reach.\n\n## A thought can be cut short\n\nWhile a chat reply is thinking, Skip appears at the end of its Thinking line when the\npointer is over the thought：the thought ends where it stands, kept as it was written,\nand the model answers from what it had thought so far — on both engines. A limit in\nSettings → Chat, off by default, does the same by itself once a thought runs that long;\nan experimental floor, the other way round, keeps a model thinking at least that long.\nA thought going round in circles is closed the same way, in chat and in Code, and\nCode's think limit now closes the thought and lets the step act, as chat's does.\n\n## More image models, ready from the store\n\nMost popular text-to-image models now download with what they need beside them, as\nQwen-Image and Z-Image did：FLUX.3 Image Klein, MiniMax-H3-Image, P-H3-Image, Krea 2,\nMOSS-Image, FLUX.2 [dev], ERNIE-Image, Anima, Ovis-Image, LongCat-Image, Iris-3B,\nQwen-Image Edit, Stable Diffusion 3.5 and more, each set up as its makers run it. The\nstore reads what a model is from the file itself, so fine-tunes under names of their own\nget their family's files too.\n\n## A chat as a PDF\n\nThe download arrow over a chat saves it as a PDF too, with no print dialog：laid out as\nChaty draws it, in the theme you use — its fonts, code colours, tables, formulas and\ndiagrams — edge to edge, cut into pages where it reads well, each reply with the model\nthat wrote it.\n\n## One thing at a time\n\nA Code session at work can be left to read other sessions or chat; nothing can be sent,\nand the model can be neither switched nor unloaded, until it is done — a line over the\nbox says where it is. Each session's row says where it stands：a light over the running\none's title, an accent bar by one waiting on you, an unread title on one that finished\nwhile you were away. Downloads go on with the store or Set up for me closed, show at the\ntop of the store wherever they were started, and fill a hairline under the model chip.\nA model load can be stopped at any point, from beside the chip, and holds chat's send as\nit holds Code's.\n\n## Inkling 2\n\nInkling 2 and Inkling 2 Mini run on llama.cpp and MLX with their reasoning, effort ladder,\ntool calls and pictures, and each turn reuses the whole of the last, with thinking on or off.\nUnsloth's own looped Inkling 2 Mini files are converted once, on their first load, into the\nlayout llama.cpp reads; a looped model runs every pass on the GPU, and NVFP4 weights run on\na Mac's GPU.\n\n## New architectures\n\nSenseNova Loop 9B runs on llama.cpp with its reasoning, tool calls and pictures, streaming\nevenly at 21 tokens a second on a Mac, and Olala\nv1.0 mini — which only its authors' fork of llama.cpp ran — with its reasoning, effort\nladder and tool calls, token for token what that fork writes. Raon-1, Dory and Maxwell-V1\nrun from pull requests llama.cpp has not merged, and Unlimited-OCR-2 reads a page back as\nits text. On MLX, LFM3, Spark-X2.6, flint and Dory join, and a checkpoint packed at mixed\nprecision loads.\n\n## Code mode\n\nThe first Qwen3 models keep thinking through a long task, and a few steps gone round\nwith nothing changing are pointed out, then paused. A screenshot no longer breaks a\nsession; a small model that sends the same plan again is handed the look at the\nworkspace its plan began with; one reading a file again for something not in it is\ntold where that is. With tool calls folded, the view keeps following a run to its end.\n\n## Nothing stutters, nothing jumps\n\nA page's picture is made out of sight and kept across restarts; long code, the first\ndiagram or formula, and badly broken diagrams no longer hitch the window. Loading a\nmodel names it on the chip as it goes, and an MLX model's bar keeps moving to the end\ninstead of standing at half; a model loads with the automatic context it settled on\nlast time, said the first time only; the sidebar slides; folded code, thoughts and\nCode mode's cards open and close smoothly, by a click or by themselves; Code mode's\nthought fades in word by word, and a long one shows under its run as it is written.\nCode mode's welcome holds still while a model loads.\n\n<!-- Highlights go above this line, hand-written per release —\n     the release page is where people who found Chaty through a\n     model's name land, and a bare install table tells them\n     nothing about why this version exists. -->\n\n## Install\n\n| Platform | File |\n|---|---|\n| **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |\n| **macOS (Apple Silicon)** | `Chaty_*_aarch64.dmg` |\n| **Linux x64 (beta)** | `Chaty_*_amd64.AppImage` — `chmod +x` and run |\n\n### macOS first launch — \"Apple could not verify…\" / \"damaged\"\n\nChaty is **ad-hoc signed but not notarized** (no paid Apple Developer\naccount), so Gatekeeper flags it on first launch. The app is safe —\neverything runs locally. Clear the download quarantine once, in Terminal:\n\n```sh\nxattr -dr com.apple.quarantine /Applications/Chaty.app\n```\n\nThen open Chaty normally. (Alternatively：try to open it once, then go to\n**System Settings → Privacy & Security → Open Anyway**.)\n\n---\n\n\n**Full Changelog**：https://github.com/Fangyuan025/Chaty/compare/v2.4.2...v2.4.3"
