ReleaseNotes: "## Looks like your system\n\nThe theme follows your system's light or dark by default and switches with it,\nthe native menus and dialogs follow the app's theme, and the window opens in its\ncolours. The text size setting now reaches Code mode too.\n\n## Long work, in the background\n\nDownloads, model loads, pictures and music show their progress on the Dock icon /\ntaskbar button, and the machine does not idle into sleep while they run. When the\ncoding agent stops to ask, or a long job finishes while you are elsewhere, the\nDock icon bounces once / the taskbar button flashes.\n\n## Keyboard and clipboard\n\nShortcuts for a new chat (⌘N / Ctrl+N), Settings (⌘,), chat and Code (⌘1 / ⌘2),\nsearch (⌘F) and stopping a reply (Esc). Paste a screenshot or a file into the\ninput and it attaches — in chat, in Code mode and in the image studio.\n\n## More context on a big GPU\n\nAn automatic context window on Windows and Linux now fills the memory left after the\nweights — the GPU's for the layers on it, RAM for any on the CPU — up to what the model\nwas trained for. It was 8192 tokens whatever the card. Hybrid and sliding-window\nmodels (Qwen3.5/3.6, LFM, Gemma 4) are counted by the layers that keep a cache, and\nget several times the context they did.\n\n## Windows and Linux\n\nThe icon fills its tile like other apps' and is sharp at every size, the taskbar's\nincluded (#25). Fedora no longer opens to a gray window：Chaty keeps WebKitGTK away\nfrom the COLRv1 emoji font it cannot draw, and draws emoji in colour with its own\n(#30 — thanks @davidecelentano). AppImage managers can update Chaty from the update\ninformation and `.zsync` it now carries. Downloads go to the models folder Settings\nshows — on Windows the one beside the program when your models are there.\n\n## Engine updates\n\nAn engine update is used only by the Chaty release it was built for：a runtime pack\ncarries Chaty's own code around its engine, and one built for an older release would\nbring that code back.\n\n<!-- Highlights go above this line, hand-written per release —\n     the release page is where people who found Chaty through a\n     model's name land, and a bare install table tells them\n     nothing about why this version exists. -->\n\n## Install\n\n| Platform | File |\n|---|---|\n| **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |\n| **macOS (Apple Silicon)** | `Chaty_*_aarch64.dmg` |\n| **Linux x64 (beta)** | `Chaty_*_amd64.AppImage` — `chmod +x` and run |\n\n### macOS first launch — \"Apple could not verify…\" / \"damaged\"\n\nChaty is **ad-hoc signed but not notarized** (no paid Apple Developer\naccount), so Gatekeeper flags it on first launch. The app is safe —\neverything runs locally. Clear the download quarantine once, in Terminal:\n\n```sh\nxattr -dr com.apple.quarantine /Applications/Chaty.app\n```\n\nThen open Chaty normally. (Alternatively：try to open it once, then go to\n**System Settings → Privacy & Security → Open Anyway**.)\n\n---\n\n\n**Full Changelog**：https://github.com/Fangyuan025/Chaty/compare/v2.3.9...v2.4.0"
