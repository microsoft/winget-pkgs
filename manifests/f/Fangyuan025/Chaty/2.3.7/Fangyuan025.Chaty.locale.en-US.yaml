ReleaseNotes: "## Watch it work\n\nCode mode now shows what the agent is doing as it does it. The tool calls\nbetween two things the model says fold into one line — what is going on now,\ntool by tool, then what the run did (\"Read 3 files, ran 2 commands, 1\nfailed\") — and opening it shows every step as before. After each small step\nthe model says what it did and what comes next：a thinking model wrote that\ninside its thought whatever it was asked, so it now rides in the tool call\nitself, and Qwen3.6 35B, which made 8 or 9 calls without a word on a\nfind-the-bug task, now never goes more than two calls without one.\n\n## Five permission modes, and a plan before the work\n\nAuto, Manual, Accept edits, Plan and Bypass permissions, as Claude Code has\nthem, kept by each session and Auto for a new one. Auto goes ahead with\nroutine work and asks before what is hard to take back. Plan researches and\nhands you the plan, with the choice under it to carry it out — a change\nattempted while planning is stopped as its name is written, not after a whole\nfile has been generated. A message sent mid-run asks whether to queue or\ninterrupt, and folders granted outside the workspace are named to the model.\n\nAlso：browser tabs per Code session and a console-like `browser_eval`; a long\nchat opens in half the time; a file read a third time unchanged, an empty\nfile, and a Gemma 4 thought going round on digits no longer cost minutes.\n\n<!-- Highlights go above this line, hand-written per release —\n     the release page is where people who found Chaty through a\n     model's name land, and a bare install table tells them\n     nothing about why this version exists. -->\n\n## Install\n\n| Platform | File |\n|---|---|\n| **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |\n| **macOS (Apple Silicon)** | `Chaty_*_aarch64.dmg` |\n| **Linux x64 (beta)** | `Chaty_*_amd64.AppImage` — `chmod +x` and run |\n\n### macOS first launch — \"Apple could not verify…\" / \"damaged\"\n\nChaty is **ad-hoc signed but not notarized** (no paid Apple Developer\naccount), so Gatekeeper flags it on first launch. The app is safe —\neverything runs locally. Clear the download quarantine once, in Terminal:\n\n```sh\nxattr -dr com.apple.quarantine /Applications/Chaty.app\n```\n\nThen open Chaty normally. (Alternatively：try to open it once, then go to\n**System Settings → Privacy & Security → Open Anyway**.)\n\n---\n\n\n**Full Changelog**：https://github.com/Fangyuan025/Chaty/compare/v2.3.6...v2.3.7"
