ReleaseNotes: "## Engines that update without a Chaty release\n\nSettings → Runtimes lists llama.cpp, stable-diffusion.cpp, audio.cpp and MLX\nwith the build each is on, and a newer one to switch to at a click — or by\nitself, once you turn that on. Every day each engine's newest upstream is\nbuilt into this release's own wrappers and published only if it starts; the\nlist is signed, and a newer engine is checked and started once on your\nmachine before it is used. One that will not start is set aside and the\nbundled one takes over by itself.\n\n## llama.cpp in a process of its own\n\nGGUF models now run in `chaty-llama`, a helper beside the app, as the image,\nmusic and MLX engines already did. That is what lets it be replaced, and a\ncrash inside llama.cpp ends that process instead of the window. Loading shows\nllama.cpp's own progress.\n\n## MLX on upstream\n\nMLX runs on upstream mlx-swift-lm and mlx-swift 0.33 instead of our fork:\nupstream's own Qwen3.5 MTP support made it unnecessary. Speculative decoding\nstays as fast — Qwen3.5-4B MTPLX at 69 tokens a second against 40 without it\non an M4 Pro.\n\n## Linux\n\nOpen models folder works on Fedora：the AppImage no longer carries its own\n`xdg-open`, and the programs Chaty starts get your system's environment\ninstead of the image's library paths (#28). Folders and files are picked with\nyour desktop's own chooser through the XDG Desktop Portal — Nautilus's on\nGNOME, Dolphin's on KDE — with the GTK dialog kept for a desktop with no\nportal (#29). Thanks to @davidecelentano for both.\n\n<!-- Highlights go above this line, hand-written per release —\n     the release page is where people who found Chaty through a\n     model's name land, and a bare install table tells them\n     nothing about why this version exists. -->\n\n## Install\n\n| Platform | File |\n|---|---|\n| **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |\n| **macOS (Apple Silicon)** | `Chaty_*_aarch64.dmg` |\n| **Linux x64 (beta)** | `Chaty_*_amd64.AppImage` — `chmod +x` and run |\n\n### macOS first launch — \"Apple could not verify…\" / \"damaged\"\n\nChaty is **ad-hoc signed but not notarized** (no paid Apple Developer\naccount), so Gatekeeper flags it on first launch. The app is safe —\neverything runs locally. Clear the download quarantine once, in Terminal:\n\n```sh\nxattr -dr com.apple.quarantine /Applications/Chaty.app\n```\n\nThen open Chaty normally. (Alternatively：try to open it once, then go to\n**System Settings → Privacy & Security → Open Anyway**.)\n\n---\n\n\n**Full Changelog**：https://github.com/Fangyuan025/Chaty/compare/v2.3.8...v2.3.9"
