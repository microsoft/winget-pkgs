ReleaseNotes: "## Long Code sessions keep their pace\n\nAn MLX model was given its whole trained context, whatever the\nmachine. Qwen3.6 35B-A3B on a 48 GB Mac got 262k tokens, and past\n100k a Code session's cache outgrew the GPU's memory：decoding fell\nfrom 26 to 3 tok/s and stayed there. The engine now measures what\nthe loaded model's cache costs per token and holds the context to\nwhat memory can carry — 90k for that 35B, which ran at 24 to 29\ntok/s up to the session's compaction. A long prompt is read in\nchunks that fit, a step left with its tool call open no longer\nmakes the next one re-read the whole conversation (302 s at 86k\ntokens), and a forward pass that breaks stops the reply instead of\nwriting noise.\n\n## Each conversation keeps its numbers\n\nThe context ring stays with its chat conversation or Code session —\nafter a switch, after a restart, and through a model change until\nthe next reply counts again — and chat's ring is now Code mode's,\nthe counts on hover. Deleting a conversation clears its numbers for\ngood, and chat shows how far a long prompt has been read, thinking\non or off.\n\n## Every source, in its own script\n\nA web search is no longer held to six sources：every result on topic\ngoes in while it fits, folded into one line under the answer and\nkept with it. Pages and files are read in their own character set —\nGBK sites, Notepad's UTF-16, Big5 and Shift_JIS — instead of rows of\nreplacement characters.\n\nAlso：a model's README in the store reads as it does on Hugging\nFace, and the store keeps its lists when Hugging Face cannot list\nmodels; YuE2's instrumentals keep the voice out; a mouse wheel\nglides on a Mac; a Code session exports as a full JSONL trace, and\nCode's answers come set cleanly and without emoji.\n\n<!-- Highlights go above this line, hand-written per release —\n     the release page is where people who found Chaty through a\n     model's name land, and a bare install table tells them\n     nothing about why this version exists. -->\n\n## Install\n\n| Platform | File |\n|---|---|\n| **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |\n| **macOS (Apple Silicon)** | `Chaty_*_aarch64.dmg` |\n| **Linux x64 (beta)** | `Chaty_*_amd64.AppImage` — `chmod +x` and run |\n\n### macOS first launch — \"Apple could not verify…\" / \"damaged\"\n\nChaty is **ad-hoc signed but not notarized** (no paid Apple Developer\naccount), so Gatekeeper flags it on first launch. The app is safe —\neverything runs locally. Clear the download quarantine once, in Terminal:\n\n```sh\nxattr -dr com.apple.quarantine /Applications/Chaty.app\n```\n\nThen open Chaty normally. (Alternatively：try to open it once, then go to\n**System Settings → Privacy & Security → Open Anyway**.)\n\n---\n\n\n**Full Changelog**：https://github.com/Fangyuan025/Chaty/compare/v2.3.5...v2.3.6"
