ShortDescription: Stella, the easy AI assistant for your computer. Use your ChatGPT or Claude plan (stella.sh)
Description: |-
  Stella (stella.sh) is an AI assistant that lives on your computer. Use the ChatGPT or Claude plan you
  already have, and Stella works with your files, apps and browser to do tasks for you. It's on your
  phone too.

  Stella can also change itself: ask, and it rewrites any part of its own app, then you preview the
  change and keep it or undo it.

  This is Stella's small launcher. On first start it downloads the rest of Stella into your user
  folder, adds Stella to the Start menu, and keeps itself up to date.
