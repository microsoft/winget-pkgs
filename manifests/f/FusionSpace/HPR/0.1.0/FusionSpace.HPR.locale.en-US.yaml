ReleaseNotes: |-
  The first release: the simulator, as a Rust library, the hpr command line and a Python package.
  The command line flies a design, scatters it, looks up motors, converts design files, reads a
  flight log and fetches a launch day's weather. See the changelog for what works, how far to
  trust it, and the known gaps.
ReleaseNotesUrl: https://github.com/nrdptel/fusionspace-eridanus/releases/tag/v0.1.0
