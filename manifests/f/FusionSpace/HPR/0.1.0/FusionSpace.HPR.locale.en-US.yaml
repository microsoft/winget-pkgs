ShortDescription: Flight simulator and flight-log analyzer for hobby and high-power rockets, on the command line.
Description: |-
  FusionSpace HPR is an open-source flight simulator for hobby and high-power rockets, written in Rust.
  The hpr command flies a rocket design (hpr sim), scatters its inputs in a Monte Carlo run (hpr mc),
  looks up motors in its bundled catalog or on ThrustCurve.org (hpr motors), converts design files
  (hpr convert), reads a flight log from an altimeter or flight computer (hpr analyze), and fetches a
  launch day's weather (hpr weather). Every number it prints is an estimate, not a
  go/no-go verdict: a motor's published data and your range safety officer decide.
Moniker: hpr
