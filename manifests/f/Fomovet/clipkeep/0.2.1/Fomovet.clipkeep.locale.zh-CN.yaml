ReleaseNotes: |-
  clipkeep v0.2.1
  本版本加入应用内更新，修复部分截图无法记录、从旧版本升级后仍运行旧版本，以及粘贴图片到网页时文件名冲突的问题。
  新增
  - 应用内更新：在设置页「关于」或托盘菜单中检查更新。发现新版本后，可在应用内下载安装包，下载完成后会校验 SHA-256，并在你确认后安装。安装时 clipkeep 会自动关闭，完成后重新启动，历史记录和设置保留。
  - 启动时检查更新：启动后检查一次。有新版本时，托盘图标、托盘菜单和设置按钮会显示红点，不会自动下载或安装。可在设置中关闭。
  - 国内网络支持：同时查询 GitHub 和 jsDelivr；下载走系统代理设置。
  - 版本号显示：设置页和托盘菜单中显示当前版本。
  - 粘贴图片时附带文件名：粘贴到网页上传时，使用原文件名或粘贴时间命名，不再都叫 image.png。可在设置中关闭。
  修复
  - 剪贴板中同时包含空白文本或非图片文件时，截图不被记录 (#2)
  - 截图工具生成图片较慢、剪贴板短时间被占用时，截图不被记录 (#2)
  - 从单文件版升级后，旧版本仍在后台运行、开机仍启动旧版本。新版本启动时会关闭更早的版本，并将开机自启指向自己
  - 粘贴多张图片到网页编辑器时，因文件名相同导致上传失败 (#3)
  改进
  - 托盘菜单「退出」始终位于最下方，菜单高度与内容一致
  - 截图未被记录时，诊断日志会写明原因和剪贴板中的格式，便于排查
