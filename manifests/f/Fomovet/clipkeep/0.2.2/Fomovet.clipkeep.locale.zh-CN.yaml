ReleaseNotes: |-
  clipkeep v0.2.2
  本版本让固定窗口后可以连续粘贴多条，HEX 色值会显示颜色预览，并修复了导入大备份占用内存过多、快速连续复制时可能漏记等问题。
  新增
  - 固定窗口后连续粘贴：点亮右上角的图钉后，粘贴或复制条目不再隐藏窗口，可以用鼠标依次点击多条连续粘贴。窗口固定期间点了别的窗口，下一次粘贴会进入你最后点击的那个窗口。粘贴过的条目保持原位，不会跳到列表顶部 (#5)
  - HEX 色值预览：整条内容恰好是一个 #RGB、#RGBA、#RRGGBB 或 #RRGGBBAA 色值时，列表中显示颜色方块；带透明度的颜色以棋盘格背景显示。粘贴出来的仍是原文 (#4，感谢 @Chitose11)
  修复
  - 复制大尺寸截图后马上复制其他内容，后一次复制可能没有被记录
  - 导入较大的备份时一次性读入整个文件并解码全部图片，内存占用过高
  - 导入失败时，已写入的图片文件要到下次启动才会被清理
  - 导出备份和损坏数据库备份的文件名使用了 UTC 时间，与本地时间相差 8 小时
