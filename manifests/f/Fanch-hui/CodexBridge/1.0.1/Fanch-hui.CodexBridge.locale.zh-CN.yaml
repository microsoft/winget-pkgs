ReleaseNotes: |-
  本次更新改进 macOS 与 Windows 的 Agent 发现、连接、续聊和工作台体验。
  更新内容
  - 优化 Codex、OpenCode、DeepSeek Harness 与 Antigravity 的安装发现。首次初始化自动扫描并保存结果，后续通过“扫描 Agent”手动更新。
  - 修复 Windows DSH 源码安装入口的路径解析与连接问题，补充安装、代理和 Fake-IP 排障指南。
  - 保留 DSH 显式代理环境配置，便于在需要代理的网络中使用网页抓取。
  - 修复续聊时将默认模型标记误作具体模型 ID 的问题，macOS 与 Windows 共用处理逻辑。
  - 修复 Windows 错误弹窗被内置浏览器遮挡，以及工作台底部显示错误 Agent 模型的问题。
  - 改进文件变更记录、非 Git 项目处理、任务状态与 Markdown 展示。
  - 保留 ACP 上游返回的错误详情并隐藏敏感内容，方便区分模型服务过载与本机连接问题。
  - 减少 Windows 会话展示的额外等待，保留实时订阅与后台自适应刷新。
  - 提供内置更新清单，可由支持应用内更新的版本检测并安装本次更新。
ReleaseNotesUrl: https://github.com/Fanch-hui/codex-bridge/releases/tag/v1.0.1
