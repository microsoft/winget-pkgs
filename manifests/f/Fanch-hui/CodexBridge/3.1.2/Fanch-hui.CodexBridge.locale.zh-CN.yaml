ReleaseNotes: |-
  Codex Bridge v3.1.2
  更新内容
  - 修复工作台中社区供应商模型（如 Antigravity、OpenCode Zen 插件）不显示推理强度的问题：选择模型后，输入器会显示该模型支持的推理强度。
  - 修复工作台新建对话首次发送时短暂出现“操作失败，具体原因未识别”提示的问题，实际消息已正常发送。
  使用提示
  - 升级后若仍未看到推理强度，请在工作台的模型列表中刷新一次。
  - 使用 ChatGPT 插件的用户，升级后请在插件设置中刷新 Codex Bridge。
  - macOS 安装包使用 ad-hoc 签名。若系统阻止打开，请前往「系统设置 → 隐私与安全性」允许此次打开。Linux 用户请选择与架构对应的 .deb 安装包。
ReleaseNotesUrl: https://github.com/Fanch-hui/codex-bridge/releases/tag/v3.1.2
