ReleaseNotes: |-
  Codex Bridge v3.0.1
  更新内容
  - 改进网络较慢时更新下载的等待处理。
  - 修复更新公告在后台状态刷新时跳回顶部的问题。
  - 支持通过反向代理接入 WorkBuddy、ZCode，并在工作台使用。
  使用提示
  - 旧版如果下载更新超时，请从发布页面下载对应安装包，手动覆盖安装一次。
  - 更新后请在 ChatGPT 插件设置中刷新 Codex Bridge。
  - macOS 安装包使用 ad-hoc 签名。若系统阻止打开，请在“系统设置 → 隐私与安全性”中允许此次打开。
  - Linux 使用系统包管理器安装对应架构的 .deb；1.3.5 版本首次升级需手动下载安装包。
