ShortDescription: A free, open-source app that runs Claude Code, Codex, Cursor and more side by side on your own computer.
Description: |-
  Friday runs the coding agents you already use, such as Claude Code, Codex, Cursor, Gemini CLI, GitHub Copilot and OpenCode, side by side on your own computer.
  Agents work as a team: they share a task board and message each other, each can work in its own Git worktree, and when one runs out of usage its task moves to another agent with a record of what the first did and changed.
  There is no account to create. Friday runs on your computer and uses each tool's own plan.
