PackageIdentifier: flyhero.Antumi
PackageVersion: 0.21.7
PackageLocale: en-US
ShortDescription: A multi-agent workbench that runs your existing coding agents in parallel.
Description: |-
  Antumi puts the Claude Code, Codex, Cursor and other agents you already have to work: investigating bugs, answering questions in chat, and building features together.
  It shows how much quota each model has left and keeps working when one runs out by handing the task to another agent. Tasks run in parallel, development agents can delegate subtasks to their peers, and both the desktop app and your phone can review sessions, approve authorisations and preview files.
