ReleaseNotes: |-
  新功能
  - 飞书和 Lark 的任务卡片支持开始与验收。提问人可通过或写原因退回，主人确认后继续返工。
  - 聊天平台创建的任务可在原话题通知进度，涵盖开始、提交验收（含总结和 PR）、完成和取消。
  - 事项自动化可选项目、智能体和模型，在独立工作区执行、检查并提交 GitHub PR，支持容量限制和人工接手。
  - Antigravity 支持多个 Google 账号，可单独查看额度和在会话中切换。ACP 后端可选自动、agy 原生或独立服务器。
  - 「设置 → 外观」可上传背景图或选用 6 款渐变，覆盖整个窗口或外框，并调节毛玻璃效果。
  - 飞书接入可按需开放文档工具，智能体可使用机器人身份读写已分享的文档。
  - 飞书和 Lark 可开启话题内免 @。机器人回答后，提问人可在仅有双方参与的话题里直接追问。
  - 「设置 → 智能体 → 代理」可为本地 CLI 配置和测试代理，每个 CLI 可单独选择是否使用。
  - 「设置 → 集成 → 回写」可按事项类型设规则和演练，任务详情可预览下一步回写。需更新来源插件。
  - 移交会话或任务时，可为接手的智能体选择服务商或账号。
  改进
  - 任务、例程、团队和手机端可选服务商，各智能体可记住常用服务商，模型列表随选择更新。
  - 空闲会话可切换服务商并继续聊天。服务商失效时会保留选择并提示。
  - 新会话可直接进入聊天页等待准备，项目配置可跳过本次运行。
  - 聊天中可调整排队消息的发送顺序。
  - 智能体 5 分钟没有可见进展时会提示继续等待或停止。
  - 送达情况不明时，可把原文、图片和引用恢复到输入框，或移除本地发送记录。
  - 消息发送失败会显示紧凑状态，可展开错误详情。
  - 聊天、委派详情和错误浮条移除了「找作者」和提 Issue 入口。
  - 聊天平台接入设置按步骤展示，开关说明可点击旁边的 ⓘ 查看。
  - 看板快捷建任务可选择团队，展开更多选项后保留选择。
  - 新建会话可通过 @ 选择智能体、外部智能体和团队。
  - 手机端发送后立即清空输入并显示状态，可连续排队、查看队列、取消或继续暂停的消息。
  - 事项自动化的中枢可选权限模式和提示词。打开「允许新建任务」后，可处理未分配给你的事项。
  - 事项自动化也可处理非 GitHub 仓库，检查后把提交留在任务分支上等待验收。
  - 事项自动化排查可自动执行读文件、搜索等只读操作。
  - 按规则回写只改分配给你的事项，重启后仍可继续，写入失败会自动重试。需更新来源插件。
  - 「外部智能体」可验证 DeepSeek Harness 模型、检查 CLI 更新，并提供未验证版本的回退命令。
  - 「外部智能体」的接入指南提供中英文的分步说明。
  - GitHub 新增问题与功能建议表单，方便说明版本、复现步骤和接入方式。
  修复
  - 智能体会话失效后不再一直显示运行中，重试未送达的消息也会保留队列。Codex 首次回应前可停止。
  - Windows 上智能体回答时，输入框使用静态边框，窗口和任务栏图标也会完整显示。
  - 新建会话和添加项目时，最近项目不再因工作区副本查询而迟迟不显示。
  - 点侧栏项目旁的 ＋ 新建会话，不再默认选中工作区副本。
  - Antigravity 担任队长或只读成员时不再因缺少只读模式报错。团队配置会提前提示不支持的智能体。
  - 全窗口背景下，下拉菜单和子菜单不再偏移，附加项目也可右键设为主要项目。
  - 从 CC Switch 导入 Claude 的 1M 模型后，测试连接不再报模型名无效，会话也会保留 1M 选择。
  - 在 WSL 中安装和登录 Antigravity 后，不再误报缺少 CLI 或登录校验失败。
  - Antigravity 等待浏览器授权时可停止会话，之后可重试首条消息。
  - macOS 或 Linux 没有 unzip 时，安装 Antigravity 可改用 Python 3。
  - 后台守护进程意外退出后，应用会在几分钟内重新启动它。
  - 导入本机会话后，可在继续对话前选择模型。
  - 审批可继续用数字键选择、用 Enter 提交，切回允许后键盘操作也能恢复。
  - 新建工作区副本会话时，不再被原项目正在工作的智能体阻挡。
  - Claude 的上下文用量不再被缺少计数的消息清零。
  - 自动排查和修复不再因审批或回答问题而误判为人工接管。
  - 回合刚结束时点击停止不再误报异常，异常提示也可提前关闭。
  - 旧回写重试不再倒退事项状态或重复发评论，事项交给别人后不再续发评论。
  - 聊天平台的项目列表、搜索和读取可处理以两个点开头的文件名，访问仍限于已授权目录。
  - Windows 上停止会话时，即使无法结束整个进程树，也会尝试结束主进程。
  - Windows 无法验证 Gemini CLI 启动脚本时，外部智能体列表仍可加载。
  - Windows 可正确识别工作区副本分支，清理时也能识别 Git 确认可移除的副本。
  - Windows 同时上传同一张图片时不再发生文件写入冲突。
  - 配置和新建会话时，Antigravity 的推理强度可正常选择。
  - 终端选中文字时可用 Ctrl+C 或 Ctrl+Shift+C 复制。「引用到对话」也不会在划到左上角时消失。
  - Ubuntu 22.04 自带的 Git 可正常读取项目分支状态。
  - 排队的团队委派会在启动时使用主会话当前的权限选择。
  - 从设置页返回时，宠物不再先闪成默认形象。
  - 更新 DeepSeek Harness CLI 后可读取模型和服务商，更新 Antumi 后也可正常启动。
  - 聊天平台消息附带多张图片时，智能体会收到所有图片。
