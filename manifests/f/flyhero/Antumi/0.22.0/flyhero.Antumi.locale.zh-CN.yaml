ReleaseNotes: |-
  破坏性改动
  - 桌面端与后端需配套更新；现有智能体、团队和聊天记录保留。
  新功能
  - 设置 → 后端位置可选远程服务器：经 SSH 在一台 Linux 服务器上运行后端，任务、会话和 Agent 都在服务器上。
  - 聊天输入框支持 @团队：在独立任务中开发，成果回传后由主智能体合并并验证。
  - 同一智能体可同时接入聊天平台和在 Antumi 中使用，渠道运行仍只使用受限的项目工具。
  - 从来源导入的任务可以回写原事项：任务详情里改状态、发评论；也可在「设置 → 集成」设规则，开始、提交验收、验收通过时自动改状态，同时发 Agent 写的总结。需更新来源插件。
  - 「设置 → 服务商」可从 CC Switch 导入 Claude Code / Codex API 服务商（含未启用项），支持预览勾选、跳过重复项，Key 不在预览中显示。
  - 「设置 → 插件」的推荐列表加入飞书项目 / Meegle 和 TAPD：用令牌把空间里的工作项同步进收件箱。
  - 输入框的 ＋ 可选「添加文件」：任意文件都能附上，图片仍作为图片发送，其他文件以 @ 引用交给 Agent。
  - 项目可以重命名：在侧栏项目分组上右键，或在「设置 → 项目」中修改，只改 Antumi 里显示的名字。
  - CodeArts 的模型列表显示倍率和上下文大小，可切换推理强度；输入框开头输入 / 可选它的命令和技能。
  - 更新后首次启动可查看本次更新；状态栏统一提示应用、插件和 Agent 的可用更新，设置中同步显示数量。
  改进
  - 电脑和手机上的 Cursor、DeepSeek Harness、Antigravity、Gemini CLI 和 CodeBuddy 图标更新为对应品牌样式。
  - 设置中的「运行」和「权限」合为「运行与权限」，页内分区查看和调整。
  - 设置中的会话、聊天命令、会话导入和项目统一归入「工作区」，「Agent」分组改名为「智能体」，「扩展」移到「集成」之后。
  - 设置 → 插件 分为「已安装」和「推荐插件」，推荐列表支持搜索；「从其他位置安装」按需展开，默认选择 GitHub Release。
  - 智能体配置按基础、协作和平台分区编辑，保存操作始终可见；未保存的草稿离开后可继续。
  - 只装了 ChatGPT 桌面版时，「设置 → 本机 Agent」可一键安装 Codex CLI。
  - 服务商入口明确标注「沿用本机配置」，Claude Code 和 Codex 的就绪状态可区分本机服务商与登录账号。
  - DeepSeek Harness 新增支持 0.2.2-rc.4 和 rc.5，保留 rc.3；更新的版本 Antumi 也会直接尝试运行。
  - 「设置 → 集成」的回写规则改为按平台从下拉框选状态，平台不支持的选项不再显示。需更新来源插件。
  - 来源同步失败时分开提示「插件调用超时」和「已取消」，不再笼统地说「已取消或超时」。
  - 检查器页签增加图标，面板较窄时只显示图标，悬停可看名称。
  - 后端在 WSL 或远程服务器上没有 Node 24 时，Antumi 会自己装一份；两者都支持 Ubuntu 20.04。
  - 会话多的项目里切换分支更快，切完能更早发消息。
  修复
  - 内置浏览器打开 V2EX 等网站时，不再一直卡在 Cloudflare 的「验证你是真人」。
  - 在内置浏览器里从其他网站跳到 Google 登录（如 V2EX 的「Sign in with Google」）不再让 Antumi 闪退。
  - 内置浏览器里用 Google 账号登录网站不再提示「此浏览器或应用可能不安全」。
  - Windows 连接 WSL 后端时，不再弹出两个常驻终端窗口；退出应用后后台任务仍继续运行。
  - 后端在 WSL、远程服务器或 Linux 版本机上运行时，不再因「系统库太旧」起不来；首次启动较慢也不再误报「后端没能启动」。
  - WSL 和远程服务器上装好的后端和 Node 不再归其他系统账号所有。
  - macOS 上用 nvm、bun 等安装的 Codex 等 Agent 不再检测不到。
  - Codex 使用 CC Switch 等工具配置中转 API 后，不再被误提示需要登录账号。
  - Windows 上 DeepSeek Harness 桌面版排在前面时，Antumi 会选用已安装且能启动的 npm 版。
  - 手机新建会话时，电脑新增的 Agent 不再导致整个列表加载失败；加载失败时可直接重试。
  - 切换分支等 Git 操作进行中发出的消息不再直接失败，会等操作结束后发出。
  - 会话移交时，输入框里的图片不再留在草稿中，会随补充说明一起发给接手的 Agent。
  - 用 GitHub 地址安装的插件「检查并更新」时不再报「Release 必须有一个插件 ZIP」，同一仓库里别的插件发版也不会挡住更新。
  - 设置中的插件更新按钮会显示更新进度，完成提示不再出现在页顶，而是留在对应插件下方。
  - 插件可区分社区限流和 Cloudflare 验证，遇到验证页时能提示在插件登录浏览器中完成验证。
  - 会话很多时，Git 面板不再长时间停在「正在读取项目…」。
  - 从禅道导入的任务，Agent 不再被要求写发不出去的事项总结。
