ReleaseNotes: |-
  新功能
  - 支持 CodeBuddy：在终端登录中国站或国际站后即可在会话、任务和定时里使用，也能接着聊终端里的会话；还可在 设置 → 账号 添加两站的 API Key 账号。
  - 支持华为云 CodeArts：设置华为云访问密钥后即可在会话、任务和定时里使用，可选自动、规划、只读等模式。
  - 智能体可以接入 Lark（飞书国际版）：在智能体配置页的「聊天平台」里点「添加 Lark」，用法和飞书一样。
  - 聊天平台接入可开启「允许创建任务」：智能体按工作指令将明确需求收进授权项目的任务，保留提问人和原文，由你开始执行。
  - Windows 上可以让 Antumi 在 WSL 2 的发行版里运行（设置 → 后端位置），直接用发行版里的项目、git 和 Agent。发行版里要有 Node 24 以上。
  - 提供 Intel 芯片 Mac 的安装包（macos-x64.dmg），可在发布页下载。
  - 侧栏可收成图标窄栏：会话列表和页面合成一张卡片，标题栏放搜索、在工作与等你的数量、新建和面板开关。
  - 会话输入框下方可以为 Claude Code、Codex、CodeBuddy 单独选账号，会话中途也能换，之后一直用它。
  - 设置的「会话」里新增「已归档」页：按项目列出已归档的会话，可单选、全选或整个项目勾选后一起删除。
  - 插件可以自带页面，也能在内置浏览器登录站点，用独立会话读取内容、上传图片和提交回复，退出时单独清理登录状态。
  - 手机上点开聊天里的图片（含预览图）后，可点右上角的下载按钮保存到手机相册。
  - 手机聊天页顶部显示会话的上下文用了多少（如「上下文 42%」），快满时变色。
  改进
  - 从 GitHub 安装插件只需填写项目地址；最新正式版有多个包时再选择。
  - 定时列表明确显示已启用、已暂停或仅手动，自动运行开关与「立即运行一次」分开显示。
  - 发送消息后立即播放飞入动画；发送失败时可在原消息下方重试。
  - 会话列表中等待确认或回答的列表项以淡色背景缓慢呼吸，提醒处理被阻断的会话。
  - 设置 → 支持与反馈 的「交流」显示作者微信二维码，扫码加好友即可进交流群。
  - 设置 → 外观 的渐变背景精简为 Sea Glass 和 Funky Fresh 两款。
  - 小屏窗口中的设置菜单栏更窄，为右侧设置内容留出更多空间。
  - 设置里的「更新」现在排在「存储」前面。
  - 会话标题栏的上下留白略小，聊天区域更紧凑。
  - 离开插件页面后 10 分钟内回来，页面原样还在，不再重新加载。
  - 插件侧栏入口可显示各自的图标，收起侧栏后也能区分不同插件。
  - 新人引导浮在状态栏上方，不再把上面的页面顶上去。
  - 手机会话列表不再只显示最近 50 个会话，滑到底会接着显示更早的。
  修复
  - 内置浏览器里 Cloudflare 的「请验证您是真人」点过后不再反复出现。
  - AI 停止自己开启的终端时会同时关闭标签页，不再留下已结束的开发服务标签。
  - Claude Code 回答后再更新记忆时，回答不再被折进「工作过程」。
  - 聊天平台已能正常回答时，不再误报「提问都会失败」。
  - 设置里「从其他位置安装」插件后，按钮旁会显示「插件已安装」并清空表单。
  - 来源的设置保存失败时，提示会写出具体哪一项不对，不再只显示「设置不对」。
  - 设置 → 账号 不再显示未安装的外部智能体，避免点击无效的登录入口。
  - 设置 → 外部智能体 中，独立安装的 Codex 不再被误判为来源未知，可直接检查并升级。
  - 追加指令中的项目等引用不再单独占一行，与前后文字自然排列。
  - 窗口较宽时，定时页的「电脑睡着时到点不会运行」提示与页面内容对齐。
  - 会话列表右侧的分隔线在聊天标题处不再变细。
  - 手机上很长的问题和确认不再挡住「提交回答」和「允许」，卡片内容可以上下滑动。
