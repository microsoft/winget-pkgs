ShortDescription: 多 Agent 工作台：额度看得见、用完不断档，多个 Agent 协作、多任务并行开发。
Description: |-
  Antumi（安图米）是一个多 Agent 工作台，让你已经装好的 Claude Code、Codex、Cursor 等 Agent 自动排查 bug、在群里替你把话答完，也可以几个 Agent 一起把活做完。
  额度看得见、用完不断档：用量账本会告诉你每个模型的余量，额度耗尽时可以安排其他 Agent 接手。多个任务能够并行推进，开发型智能体还能把子任务委派给别的智能体，桌面端和手机端都可以查看会话、审批授权和预览文件。
