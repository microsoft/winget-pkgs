ReleaseNotes: "```\nThe signing key can be retrieved with below command:\n\n    gpg --recv-keys 0x6855E493B5B2DF96E319BB6D16E2E1ACC6F51242\n\nNote on Windows builds:\n\n   •  MediaDownloaderQt6 builds for Windows are 64 bit/Qt6 and have \n      minimum requirement of windows 10, version 1607.\n\n   •  MediaDownloaderQt5 builds for Windows are 32 bit/Qt5 and have \n      minimum requirement of windows 7.\n\n     [WINDOWS]\n      • Unbandle ffmpeg and install it on first run. Version 9.0.2\n        will be installed if Windows version is atleast version 10 22H2\n        and Version 8.1 will be installed otherwise.\n      • Qt6 build installer now Defaults to use \"C:\\Program Files\" instead \n         of \"C:\\Progran Files (x86)\".\n      • Users of Qt6 installer are advised to unistall first before running the \n         installer to make possible for the new install path to be used.\n      • Switch to nicolaasjan's yt-dlp for users who use windows version less\n         than windows 10.\n     [FLATPAK]\n      • Use deno instead of quickjs-ng as yt-dlp javascript runtime.\n\n```"
