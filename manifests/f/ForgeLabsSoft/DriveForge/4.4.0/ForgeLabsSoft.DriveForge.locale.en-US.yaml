ReleaseNotes: |-
  New: write one image to several drives, one after another. Each drive is erased, written, verified and put
  back before the next begins, so no more than one disk is ever offline. The confirmation lists every drive by
  name, size and current contents, and will not start until you tick a box naming the number of drives. Each
  drive gets its own result at the end rather than one verdict for the batch.

  The rest of this release is what running every function against real hardware found, and then fixing it:

  - A failure to write the boot record is explained in words in all five flows that write one, including both
    restore paths, instead of a raw exit code and sixty lines of trace.
  - A restore no longer ends by announcing "USB creation finished", no longer lists options the mode never
    applies in the last dialog before the disk is erased, and estimates its remaining time from the image's own
    content size rather than a multiplier.
  - A finished operation's progress row no longer follows you to every other page, and the progress bar no
    longer walks backwards at the end of a long copy.
  - Secure shred no longer reports that it overwrote a gigabyte when it overwrote three megabytes.
  - The multi-boot drive picker marks the disks in its list that are not removable drives.
  - Changing language no longer erases the result a failed or stopped run left on screen, and two languages had
    words written in the wrong alphabet.

  Proven end to end on real drives: this PC backed up to an 88.6 GB image, restored onto a blank disk and
  booted; the VHDX export attaches and carries a complete Windows; Ventoy installs, takes an ISO and boots.
