ReleaseNotes: |-
  Fixed: on a plain USB flash drive, a drive could be emptied and then told the operation had failed.

  Every destructive tool starts with the same command, and on a plain flash drive Windows often refuses it
  with "Access is denied" - after the partition table is already gone. The tool then showed a hexadecimal
  error code and created nothing, so the drive was left blank and the message explained nothing. Eleven
  places started with that command, among them the SSD erase, Format, the full-overwrite Wipe and writing
  an ISO to a stick.

  They all now look at the disk instead of reading an exit code, and finish the job: when the partition
  table is already gone they carry on, otherwise they try two further routes before stopping. If all of
  them fail, the message says in plain language that nothing new was created and that unplugging the drive
  and trying again usually clears it.

  Four more faults in the same chain were found the same way and fixed: an emptied disk that still reported
  its old partition table could never be given a new one; a drive that cannot TRIM failed the whole erase;
  a partition that was created but not formatted was abandoned with no file system on it; and the progress
  line called a flash drive an SSD immediately after warning that it is not one.

  All of it was measured by driving the application on a real flash drive, and the erase was then run
  through it four times from end to end.
