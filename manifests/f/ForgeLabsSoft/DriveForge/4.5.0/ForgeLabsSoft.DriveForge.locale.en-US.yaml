ReleaseNotes: |-
  A screen-by-screen audit of the whole application, driven on real hardware rather than read.
  Thirty-eight changes, and nearly all of them are one fault in different clothes: the app knew
  something and did not say it. Nothing here changes a file format or a saved setting.

  A run now reports what it actually did. A clone could take back three of the four options it had
  offered you, into the log alone. Writing an image to several drives reported "6 of 6 written" when
  it had refused two of them, and also dropped drives that vanished while the confirmation was up and
  ticks with no drive connected. "Windows is keeping this disk offline" reached one report out of two.
  A read-only file-system scan could call a drive healthy, as could Create partition and Delete volume,
  which decided their verdict from a variable set to true and never lowered. The speed test spent 80 MB
  and spoke for the whole drive; the disk-space analyser counted the Recycle Bin as free space. Clean
  traces reported a stopped run as a finished one and a plain delete as a secure wipe, and named
  sanitising standards it does not implement.

  Screens that hid the thing they exist for. Recover would not list the one volume it exists for.
  Cleanup gave four different answers to "what is on screen". Three finished tools had no button
  anywhere. The file-system menu stopped repeating the 32 GB FAT32 limit, which was measured to be
  wrong, and now asks rather than refusing.

  Stop is answered as a Stop on every path behind the Start button; several treated it as a failure,
  and one saved a log file to the Desktop on the way out.

  Download an ISO: "Get latest" for Ubuntu was two LTS releases behind and could not have caught up,
  with 24.04 written into the entry three times over. It now reads Ubuntu's release server and takes
  the newest LTS. Reported by Keith Weisshar. The SHA-256 check is now offered where a download
  finishes, which is the one screen that did not have it.

  Also: the step numbers are gone from the interface, sentences that point at a button now name it,
  and 46 of the 84 error sentences a person could see are translated, along with four dialogs that
  were English end to end - including the one shown before erasing a drive.

