ReleaseNotes: |-
  Fixed: erasing an SSD could empty the drive and then stop, leaving it blank and uninitialised with only
  an error code to explain it. Reported by a user on Windows 11 26H2.

  DriveForge was asking Windows to convert a partition table that the erase had just removed, so there was
  nothing to convert. It now creates the table with the call meant for a blank disk, and then checks that it
  got one; if Windows refuses, the message says the drive is blank rather than broken, in your own language.

  If this happened to you, the drive is not damaged. Initialise it from DriveForge's Partition tools,
  "Initialize a blank / RAW disk", or from Windows Disk Management, and it is a normal empty drive again.

  The same mistake was found in two more places while fixing the first - creating a bootable VHDX, and the
  Windows-To-Go layout - and both are fixed. Two tests now fail the build if it is ever reintroduced.
