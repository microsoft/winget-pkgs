ReleaseNotes: Adds a Subfolders control so folder scans can cover everything, the chosen folder alone, or a set number of levels, and remembers your algorithm and metadata choices between runs. The Browse dialogs now open at the path already in the box, and the window no longer opens taller than the screen at high display scaling.
