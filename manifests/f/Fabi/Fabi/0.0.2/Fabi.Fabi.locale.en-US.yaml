ShortDescription: Universal AI Control Plane — scan your AI estate, keep one honest ledger, subtract what you don't need.
Description: |-
  Fabi scans your machine's AI estate — tools, models, services, GPU —
  writes an append-only local ledger, and answers with numbers:
  what's installed, what's idle, what's duplicated, what's hidden.
  It never deletes autonomously; it shows evidence and you decide.
  Offline core, zero config, ~8 MB binary.
