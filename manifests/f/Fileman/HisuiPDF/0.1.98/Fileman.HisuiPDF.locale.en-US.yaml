  ─────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Linux x64            │Hisui.Pdf-v0.1.98-linux-x64.tar.gz
  ─────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  macOS (Intel)        │Hisui.Pdf-v0.1.98-osx-x64.tar.gz
  ─────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  macOS (Apple Silicon)│Hisui.Pdf-v0.1.98-osx-arm64.tar.gz
  ─────────────────────┴────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Unpack the archive and run Hisui.Pdf.App (.exe on Windows).
  > macOS: the binary is unsigned — on first launch right-click -> Open, or run
  > xattr -dr com.apple.quarantine Hisui.Pdf.App to clear Gatekeeper quarantine.
  >
  > Linux/macOS OCR: the scanned-PDF OCR feature needs a system Tesseract library
  > (apt install libtesseract5 / brew install tesseract). All other features work standalone.
