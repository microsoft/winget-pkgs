InstallationNotes: |2

    ─────────────────────────────────────────────────────
      Move Window Between Desktops v1.4 - Ready to use!
    ─────────────────────────────────────────────────────

    HOTKEYS
    Ctrl + Shift + Win + Right/Left     move window to next/prev desktop
    Ctrl + Shift + Alt + Right/Left     move window (alternative key)
    Ctrl + Win + Right/Left             switch between desktops (native)
    Ctrl + Alt + Right/Left             switch between (alternative key)

    FEATURES
    • AUTOSTART is configured automatically (active after every logon)
    • View Shortcuts (Tray icon)
    • Enable Cycling (Tray icon)
    • Show Desktop Name (Tray icon)

