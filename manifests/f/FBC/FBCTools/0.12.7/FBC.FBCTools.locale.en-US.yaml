ShortDescription: A configurable right-click menu for Windows Explorer, defined in a JSON file and edited with its own editor.
Description: |-
  FBCTools adds an FBCTools menu to the right-click menu of Windows Explorer. Each entry runs a program on the selected files, folders or the folder background, or one of the tools built into FBCTools.
  Out of the box it converts videos to MP3 or MP4 and images to JPG or PNG with ffmpeg, copies paths, names and file contents to the clipboard, calculates and verifies checksums, splits and joins files, tidies up folders, and sends a markdown file with its images to a Wiki.js page.
  It installs for the current user without administrator rights.
