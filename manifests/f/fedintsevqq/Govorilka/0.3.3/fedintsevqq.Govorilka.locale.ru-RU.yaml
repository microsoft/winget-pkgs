ShortDescription: Расшифровка созвонов на русском на вашем компьютере, без облака
Description: |-
  Говорилка превращает созвон в текст прямо во время разговора: ваш микрофон и звук компьютера отдельно, собеседники
  различаются, после звонка — итоги и задачи. Расшифровывает аудио и видео любой длины, диктует в любое окно.
  Распознавание работает на компьютере, без интернета и без бота в звонке.
