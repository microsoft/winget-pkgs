ReleaseNotes: |-
  What is new
  - Reserved rooms in the app. Reserve a room with links that stay. A room has host, speaker and viewer links. You do not need an account.
  - My rooms. Keep your reserved rooms in the app. Join as host, share links, extend, make new links or delete a room. The app encrypts the room keys on your computer.
  - Reminders. The app tells you before a reserved room expires. Click the notification to extend the room.
  - Reserve links. Paste a host, speaker, viewer or manage link in the start field. The app shows the room and role before you join.
  - Links. The app opens ffmuc-meet:// and jitsi-meet:// links.
  - Theme. Light, dark or system theme. The default is system.
  - New design. New start page with cards for joining, reserved rooms and recent meetings.
  Tests
  Tested:
  - CI builds for Linux, macOS and Windows.
  - Unit tests for the reserve client and the start field.
  - Manual tests of the development build on Linux: light and dark theme, start page cards, links and My rooms.
  Not tested:
  - A separate smoke test of the release packages.
  - The macOS and Windows builds on real computers.
  - A full meeting with other people.
  - Screen readers.
