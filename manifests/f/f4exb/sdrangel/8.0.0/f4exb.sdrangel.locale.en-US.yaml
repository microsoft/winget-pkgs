ReleaseNotes: "## SDRangel enters the AI era\n\nThanks to @srcejon SDRangel is now AI-ready, with the addition of a MCP server. There are also facilities to connect Claude or Chat GPT/Codex to it but the MCP protocol is model agnostic so it can be used with any model. It was tested successfully with the Hermes desktop and Gemma 31B Turbo. You may need to pass these instructions to the model：https://github.com/f4exb/sdrangel/blob/master/plugins/feature/mcpserver/bandguide.md To see what it looks like see this amazing video: https://youtu.be/G0FmiX7zwb8. To know more about it check its readme: https://github.com/f4exb/sdrangel/blob/master/plugins/feature/mcpserver/readme.md It can certainly contribute to make SDRangel more accessible to beginners and the less SDR savvy.\n\nThis alone justifies bumping to a new major version so here is version 8!\n\nIt also comes with a goodie to show the data flow between modules which is a major milestone in the UI area\n\nIt also features a lot of code issues fixes improving code quality and stability thanks to @rgetz\n\n## A whole bunch of new plugins\n\nDevice:\n  • Add USRP MIMO PR #2983 thanks to @srcejon\n\nChannels:\n  • Add PSK31 Demod PR #2966 thanks to @srcejon\n  • Add WEFAX demodulator PR #2975 thanks to @srcejon\n  • Add Broadcast FM modulator PR #2989 thanks to @srcejon\n  • Add DVB demodulator PR #3003 thanks to @srcejon\n  • Add DJI DroneID demodulator PR #3007 thanks to @srcejon\n  • Add SELCAL demodulator PR #3011 thanks to @srcejon\n  • Add 802.15.4 demodulator PR #3015 thanks to @srcejon\n\n## What else has Changed\n• Fix mac build & add install / run smoke test by @srcejon in https://github.com/f4exb/sdrangel/pull/2898\n• Update CMake configuration by @rgetz in https://github.com/f4exb/sdrangel/pull/2899\n• Fix payload FEC status reporting in Meshtastic LoRa soft decoder by @jvn314 in https://github.com/f4exb/sdrangel/pull/2900\n• packet demod PACKETDEMOD_CHASE_MAX missing by @tomasjura in https://github.com/f4exb/sdrangel/pull/2901\n• Add coverity to workflows：by @rgetz in https://github.com/f4exb/sdrangel/pull/2902\n• Fix scope trace buffer corruption by @srcejon in https://github.com/f4exb/sdrangel/pull/2903\n• Fix ADS-B decoder issues found from AddressSanitizer (ASAN)  by @rgetz in https://github.com/f4exb/sdrangel/pull/2905\n• Improve asynchronous device error handling, using PlutoSDR as example by @rgetz in https://github.com/f4exb/sdrangel/pull/2906\n• Rate-limit FIFO overflow messages by @rgetz in https://github.com/f4exb/sdrangel/pull/2907\n• Fix uninitialized members in plugins/channelrx by @rgetz in https://github.com/f4exb/sdrangel/pull/2909\n• Eliminate the possibilities of accessing buffers with negative indexes by @rgetz in https://github.com/f4exb/sdrangel/pull/2910\n• Update rtl-sdr version by @AsciiWolf in https://github.com/f4exb/sdrangel/pull/2911\n• Coverity：fix scan result archive path and upload handling by @rgetz in https://github.com/f4exb/sdrangel/pull/2912\n• Fix data races identified by ThreadSanitizer by @rgetz in https://github.com/f4exb/sdrangel/pull/2913\n• USRP：Support devices without GPIO, such as n210. by @srcejon in https://github.com/f4exb/sdrangel/pull/2916\n• Fix Meshtastic interpolator bandwidth update by @jvn314 in https://github.com/f4exb/sdrangel/pull/2917\n• Readme.md : Add project status badges by @rgetz in https://github.com/f4exb/sdrangel/pull/2919\n• Python Example：Update Python 2 syntax in Swagger example by @rgetz in https://github.com/f4exb/sdrangel/pull/2920\n• map/webserver : Fix WebServer substitution memory leak by @rgetz in https://github.com/f4exb/sdrangel/pull/2923\n• objectpipesregistrations：Fix ObjectPipesRegistrations memory leak by @rgetz in https://github.com/f4exb/sdrangel/pull/2924\n• device/deviceuiset：Fix GLSpectrumView use-after-free by @rgetz in https://github.com/f4exb/sdrangel/pull/2925\n• map/mapgui：Fix MapGUI memory leaks on exit by @rgetz in https://github.com/f4exb/sdrangel/pull/2926\n• mapmodel：Fix MapModel and ObjectMapItem memory leaks by @rgetz in https://github.com/f4exb/sdrangel/pull/2927\n• map/mapsettings：Fix MapSettings item settings ownership by @rgetz in https://github.com/f4exb/sdrangel/pull/2928\n• Fix Mac builds by @srcejon in https://github.com/f4exb/sdrangel/pull/2936\n• resolve uninitialized member variables in the plugins dir by @rgetz in https://github.com/f4exb/sdrangel/pull/2930\n• Position fallback options when GPS is unavailable by @rgetz in https://github.com/f4exb/sdrangel/pull/2932\n• Serialize configuration loads to fix a use-after-free crash by @Es00bac in https://github.com/f4exb/sdrangel/pull/2948\n• Update snap to Qt6 and core26 + a few bug fixes by @srcejon in https://github.com/f4exb/sdrangel/pull/2949\n• wavfilerecord：add RF64 support by @rgetz in https://github.com/f4exb/sdrangel/pull/2951\n• meshtastic：retain upchirp FFT bin residuals by @jvn314 in https://github.com/f4exb/sdrangel/pull/2952\n• Add MCP Server for Claude & ChatGPT by @srcejon in https://github.com/f4exb/sdrangel/pull/2934\n• Enable denoiser feature on Windows by @srcejon in https://github.com/f4exb/sdrangel/pull/2953\n• resolve uninit member var in ./sdrbase by @rgetz in https://github.com/f4exb/sdrangel/pull/2954\n• tree wide：Fix message ownership and reporting for unhandled queue messages by @rgetz in https://github.com/f4exb/sdrangel/pull/2955\n• fix：range rate assignment in satellite tracker for sgp4 by @42617274 in https://github.com/f4exb/sdrangel/pull/2956\n• Add NVIDIA Denoiser and VST3 effects to Denoiser Feature by @srcejon in https://github.com/f4exb/sdrangel/pull/2958\n• Define repository-wide text and binary file attributes by @rgetz in https://github.com/f4exb/sdrangel/pull/2943\n• repo wide : Name SDRangel-owned threads for debugging by @rgetz in https://github.com/f4exb/sdrangel/pull/2957\n• Fix macOS MCP bundle packaging failure in build_mac by @srcejon with @Copilot in https://github.com/f4exb/sdrangel/pull/2959\n• Fix Linux external library build configuration by @rgetz in https://github.com/f4exb/sdrangel/pull/2961\n• Add button to display connections between devices, channels and features by @srcejon in https://github.com/f4exb/sdrangel/pull/2962\n• BFMDemod：Set audio icon background to green when squelch open. by @srcejon in https://github.com/f4exb/sdrangel/pull/2963\n• RadioClock：Add support for RBU and PCSK-225.  by @srcejon in https://github.com/f4exb/sdrangel/pull/2964\n• FileSink：Fix waterfall resetting  by @srcejon in https://github.com/f4exb/sdrangel/pull/2965\n• Fix external library paths for Debian builds by @rgetz in https://github.com/f4exb/sdrangel/pull/2969\n• Attempt to fix Windows github action hang.  by @srcejon in https://github.com/f4exb/sdrangel/pull/2971\n• codacy：Add PR review instructions by @rgetz in https://github.com/f4exb/sdrangel/pull/2974\n• Add PSK31 Demod by @srcejon in https://github.com/f4exb/sdrangel/pull/2966\n• Add WEFAX demodulator by @srcejon in https://github.com/f4exb/sdrangel/pull/2975\n• DSC：Add support for VHF. Improve HF performance. by @srcejon in https://github.com/f4exb/sdrangel/pull/2976\n• PlutoSDR：fix four crashes with Rx + Tx device sets on one device (#2721) by @hxcrd in https://github.com/f4exb/sdrangel/pull/2972\n• Add native Linux ARM64 CI build by @benhu in https://github.com/f4exb/sdrangel/pull/2977\n• Pager：Add FLEX support. by @srcejon in https://github.com/f4exb/sdrangel/pull/2978\n• Try #2 in codacy ai reviewer by @rgetz in https://github.com/f4exb/sdrangel/pull/2980\n• Add USRP MIMO device + fixes for other devices with buddies + Windows library updates by @srcejon in https://github.com/f4exb/sdrangel/pull/2983\n• Fix remaining uninitialized member variables and unset variable warnings by @rgetz in https://github.com/f4exb/sdrangel/pull/2984\n• Packet Demod：add native G3RUH 9600 receive mode by @delfer in https://github.com/f4exb/sdrangel/pull/2986\n• Add Broadcast FM modulator by @srcejon in https://github.com/f4exb/sdrangel/pull/2989\n• WDSP Rx：fill WDSPRxReport instead of null SSBDemodReport in channel report by @3ProFilm in https://github.com/f4exb/sdrangel/pull/2995\n• Prevent unsafe copying of resource-owning classes by @rgetz in https://github.com/f4exb/sdrangel/pull/2996\n• meshtasticdemod：add carrier frequency offset to JSON output by @jvn314 in https://github.com/f4exb/sdrangel/pull/3000\n• ValueDial：fix out of range read in paintEvent while animating by @Wahaj18 in https://github.com/f4exb/sdrangel/pull/3001\n• MeshCore demod：connect preset combo and Apply button by @Wahaj18 in https://github.com/f4exb/sdrangel/pull/3002\n• reduce warnings on cmake > 4.x (windows-x64 CI) by @rgetz in https://github.com/f4exb/sdrangel/pull/2985\n• Add DVB demodulator by @srcejon in https://github.com/f4exb/sdrangel/pull/3003\n• Presets/Configurations dialogs：remember collapsed groups by @3ProFilm in https://github.com/f4exb/sdrangel/pull/3004\n• Add trailing-whitespace checks to GitHub Actions and provide an optional local pre-commit hook. by @rgetz in https://github.com/f4exb/sdrangel/pull/3005\n• Add DJI DroneID demodulator by @srcejon in https://github.com/f4exb/sdrangel/pull/3007\n• SondeHub：batch telemetry uploads and send listener position every 3 hours by @Wahaj18 in https://github.com/f4exb/sdrangel/pull/3010\n• Add SELCAL demodulator by @srcejon in https://github.com/f4exb/sdrangel/pull/3011\n• Add DRM (Digital Radio Mondiale) demodulator by @srcejon in https://github.com/f4exb/sdrangel/pull/3012\n• resolve gcc 14.2 warnings by @rgetz in https://github.com/f4exb/sdrangel/pull/3013\n• Add DAB modem by @srcejon in https://github.com/f4exb/sdrangel/pull/3014\n• Add 802.15.4 demodulatior by @srcejon in https://github.com/f4exb/sdrangel/pull/3015\n• DVB：Add HbbTV support by @srcejon in https://github.com/f4exb/sdrangel/pull/3016\n• Fix missing OpenCV libraries in Windows installer by @srcejon in https://github.com/f4exb/sdrangel/pull/3018\n• HbbTV：Support Polish EPG. by @srcejon in http"
