ShortDescription: A lightweight Dynamic Island for Windows with message alerts, AI agent approvals, lyrics, clipboard history and tasks.
Description: fly-island (formerly FocuSD Island) is an always-on-top island at the top of the Windows screen. WeChat, QQ and IMAP mail messages pop up on the island; Claude Code and Codex sessions show their status there, and permission requests can be approved or denied in place. It also offers synced lyrics and media controls, clipboard history, a file shelf, quick translation and daily tasks. It expands when needed and collapses back when done.
