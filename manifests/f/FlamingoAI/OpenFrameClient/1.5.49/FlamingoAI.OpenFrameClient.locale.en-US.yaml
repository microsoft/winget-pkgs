ShortDescription: Device agent of the OpenFrame RMM platform. Installs as a Windows service and connects the machine to your OpenFrame tenant.
Description: |-
  OpenFrame Client is the device agent of the OpenFrame platform (remote monitoring and management for MSPs) by Flamingo AI, Inc. It requires an OpenFrame tenant.
  Installing the package registers the Windows service com.openframe.client; it starts and waits, sending nothing until the device is connected with openframe-client auth.
  Updates are delivered by the OpenFrame platform.
Moniker: openframe-client
Tags:
- agent
- monitoring
- msp
- rmm
ReleaseNotesUrl: https://www.flamingo.run/roadmap-and-releases?tab=product-releases
InstallationNotes: |-
  The service is installed and waiting. In a new elevated terminal, connect the device with the command from your OpenFrame dashboard (Devices -> Add device):
  openframe-client auth --serverUrl TENANT_HOST --initialKey KEY --orgId ORG_ID --userId USER_ID
  Updates are delivered by the OpenFrame platform.
