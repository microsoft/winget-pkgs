ShortDescription: Desktop app of the OpenFrame platform, with notifications that keep arriving from the tray.
Description: |-
  OpenFrame Console is the desktop app of the OpenFrame platform (remote monitoring and management for MSPs) by Flamingo AI, Inc. It requires an OpenFrame account: sign in with your email and the app finds your workspace.
  It adds what a browser tab cannot: OS notifications that keep arriving while the app sits in the tray, a session that survives long idle, and Start at Login.
  The app updates itself from your OpenFrame environment.
