ShortDescription: A desktop window onto My Claude Code, the local LLM proxy and model router for AI coding agents.
Description: >-
  My Claude Code (MCC) is a local multi-provider LLM proxy, model router and control plane for AI
  coding agents. Claude Code, Codex, OpenCode, Gemini CLI, Crush, Cline, Goose, Aider and a dozen
  others point at one address and share one control panel: routing tiers with fallback chains,
  reasoning controls, credential rotation and health, a native web-search tool proxy, and analytics
  with cost provenance, in front of 57 model providers. It speaks four inbound protocols --
  Anthropic Messages, OpenAI Responses, OpenAI Chat Completions and the Gemini API -- and serves a
  dashboard on 127.0.0.1:8082.

  This package installs the desktop app: a small native window that renders that dashboard and puts
  an icon in the tray. It carries no Python, no server and no configuration. On first launch, if the
  server is not installed yet, the window shows you the exact install command and runs it in front
  of you, then starts the server and loads the dashboard.

  It installs per user, needs no administrator rights, and uninstalling it removes the window and
  nothing else -- your configuration, your keys and the mcc-server command are left alone.
