ReleaseNotes: |-
  The following is a list of improvements made between the June 2026 release and the August 2026 update.
  PowerPoint Improvements
  This release significantly improves the PowerPoint experience, making it easier to navigate slides, view and edit slideshow content, understand PowerPoint slide content and formatting, and deliver presentations with more accurate and less repetitive speech. The full list of improvements includes:
  - JAWS now reads slideshow content in Presentation mode when pressing F5
  - JAWS will now announce “decorative rectangle” when tabbing to a rectangle after a PowerPoint presentation is opened
  - JAWS no longer announces that objects are decorative when the Decorative check box is unchecked
  - In Reading and Slideshow View, JAWS now correctly reads formatted words and nested lists
  - When tabbing through contents of PowerPoint slides, JAWS no longer continuously announces slide number placeholders
  - When tabbing through the slide area, excessive speech has been removed
  - When tabbing through slide content, JAWS no longer reads the previous object’s alt text description when focus is on a different object
  - When in Edit object mode, JAWS now announces links correctly
  - In Slideshow View, bullets with no content no longer appear
  - Math content on slides is now indicated so you can press ENTER to display equations in the JAWS Math Viewer
  - In Slideshow View, JAWS no longer announces “graphic” in slides which only contain text
  This updated support also includes new scripts used by default in PowerPoint versions 16.0.20026 and later with an option to go back to legacy scripts. In most cases, users should not need to switch back unless specific functionality is required that is currently only available in the prior scripts. To change to legacy PowerPoint scripts:
  1. Open PowerPoint, then press INSERT+V to open the Quick Settings dialog box.
  2. In the search box, type “use” without the quotes.
  3. Press the DOWN ARROW to move to the setting, “Use legacy scripts,” and press the SPACEBAR to check the box.
  4. Navigate to the OK button and press the SPACEBAR to save the changes.
  Note: For PowerPoint versions older than 16.0.20026, legacy scripts are used by default.
  Aria and Web
  - In Google Chrome, JAWS now focuses on and speaks autofill menu items.
  - When interacting with buttons that expand or collapse sections of a web page, focus now remains on the selected button regardless of whether ENTER or SPACEBAR was used.
  - JAWS now more consistently announces inserted or deleted content that is part of a link or button.
  - JAWS now indicates submenus in Chromium-based browsers when Forms Mode is active.
  - JAWS now indicates links even if they are attached to a check box.
  - Improved navigation on certain pages where JAWS was not announcing links when tabbing.
  - You can now interact with math content inside an HTML legend element.
  Braille
  - In File Explorer, braille now shows correct file information, such as “date modified,” when using the LEFT and RIGHT ARROW keys to move through the details of a file.
  - JAWS now displays complete table row and column information in Braille for table cells that span multiple rows or columns.
  - The Liblouis Braille translator used by JAWS and Fusion has been updated to version 3.38.0.
  - If JAWS Braille input and output translation settings for several international versions such as Dutch are configured for 6-dots, text entered from a Braille display no longer disappears after pressing SPACE.
  - Support for the newer Help Tech braille displays including the myBraille has been added to this release.
  - The latest driver for the EuroBraille braille displays, Version 1.0.2.3, has been added to this release.
  Other
  - The JAWS FSAPI is now supported on Arm64 devices for developers creating applications that call JAWS script functions.
  - Improved navigating tables containing cells spanning multiple rows.
  - Improved navigating tables where cells automatically update to show new information.
