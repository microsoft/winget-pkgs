ReleaseNotes: |-
  The following is a list of improvements made between the August 2026 release and the September 2026 update.
  Facebook and Reddit Enhancements
  Significant improvements have been made in this release for users who previously had issues navigating Facebook or Reddit.
  - When using feeds on either site, you can now use the heading navigation quick key H to move through content more consistently.
  - JAWS also no longer unexpectedly moves focus while scrolling, making it easier to keep track of previously viewed content.
  Cloud Settings Enhancements
  - Vocalizer Expressive voice settings are now included in Cloud Settings sync. These settings can be transferred to a new computer even if the corresponding voices are not yet installed. The voices must still be installed separately, but once installed, the previously synced settings can be applied.
  - You should now encounter fewer conflict dialogs when synchronizing Cloud Settings between multiple computers.
  - Sync status information indicating that JAWS settings are currently syncing to the cloud, have not been synced, or are synced has been added to the JAWS status line.
  - The Manage sync settings dialog box now gains focus so users no longer have to press ALT+TAB to navigate to the window.
  - If there is a conflict when syncing cloud settings, the text of the error can now be navigated using the ARROW keys or copied to the clipboard.
  Microsoft Office
  - JAWS no longer says “message” while typing in Outlook (new).
  - If the Information bar messages announcement option in Quick Settings for Outlook is enabled, JAWS now reads the contents of the information bar as expected when opening an email.
  - Continued improvements to JAWS interacting with math content in PowerPoint slides.
  - Pressing CTRL+ENTER in Microsoft Teams while focused on a message in the chat history for a conversation now more reliably activates the Virtual PC Cursor for reading the message contents.
  ARIA and Web
  - JAWS now more consistently moves the virtual cursor from combo boxes to buttons when navigating web pages.
  - Using navigation quick key I to move to list items now moves to items in nested lists.
  - Improved JAWS indication of elements on web pages that offer additional content which can be toggled by pressing INSERT+BACKSLASH.
  - JAWS now more reliably reads prompts for multiline edit fields when they gain focus.
  Braille
  - The Mantis Q40 braille display now has a keymap, and no longer relies on legacy drivers.
  - You can now pan inside of the new Notepad in Windows 11 using your braille display’s panning controls.
  - An issue with panning using multiline braille displays, such as the DotPad X, has been fixed.
  - Fixed an issue where settings for Monarch braille displays weren’t saving even though they were written to the correct JCF file.
  - You can now enter content from HelpTech Braille displays when connected to JAWS using the Braille HID protocol.
  Language-Specific Improvements
  - When using the Korean Vocalizer Expressive voices Yuna and Nuri, JAWS now correctly reads the number 6.
  - The Bulgarian installation of JAWS now supports the Neural SpeechLab synthesizer for high-quality text-to-speech.
  - OCR items in the File Explorer context menu now follows JAWS language switching and does not revert back to English when the OS language is not set to English.
  Other
  - When renaming the selected file in File Explorer, JAWS no longer speaks both the old and new name after typing the name and pressing ENTER.
  - Improved instances where JAWS continued speaking the contents from a prior screen instead of the focused content.
  - JAWS now reads the entire contents of table cells containing multiple lines when tabbing.
  - Fixed JAWS table reading commands (ALT+CTRL+ARROW keys) not reading cell contents in certain tables.
