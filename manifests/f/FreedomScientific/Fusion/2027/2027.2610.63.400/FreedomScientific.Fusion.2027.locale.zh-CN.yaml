ShortDescription: 融合屏幕阅读与屏幕放大功能的无障碍解决方案，同时提供 ZoomText 与 JAWS。
Description: Fusion 是一款终极无障碍辅助工具，适用于服务视力受损人群的学校、机构、培训中心和企业。Fusion 将两者的优势合而为一：ZoomText 提供屏幕放大与视觉增强，让屏幕浏览更加轻松；JAWS 则带来强大数据快速屏幕阅读能力。只需一个安装程序和一个许可证，您即可单独使用 ZoomText 和 JAWS，或将二者作为 Fusion 组合方案一并使用。
