ReleaseNotes: |-
  - Added Transceiver Firmware Updates for Flexbox 5, allowing users to view available transceiver firmware updates and install them directly from the app
  - Fixed an issue where users could see a session error message after logging out instead of being returned to the start page
  - Fixed an issue where clicking Retry could start multiple update downloads at the same time
  - Fixed an issue where the optical power monitoring screen could get stuck showing live data after the connection stopped unexpectedly
