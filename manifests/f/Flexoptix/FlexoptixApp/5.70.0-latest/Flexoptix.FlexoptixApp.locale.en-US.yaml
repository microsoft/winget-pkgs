ShortDescription: Desktop application for configuring FLEXOPTIX FLEXBOX transceiver modules.
Description: The FLEXOPTIX App is the desktop companion for FLEXBOX transceiver modules (FB-02, FB-03, FO.FB.V4 and FO.FB.5). It supports transceiver and adapter reconfiguration, transceiver details and history, Power Meter & Source, Distance Analyzer (OTDR), tuning of tunable transceivers, firmware updates, and serial number lookup.
