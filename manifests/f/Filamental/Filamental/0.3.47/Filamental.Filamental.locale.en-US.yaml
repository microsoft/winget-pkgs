ReleaseNotes: |-
  • Branches leaving a node sort themselves by classification. All the orange on one side of it, all the green on another, so the colour of a node tells you where to look before you have read a single label. The fan was the right shape before this and the order inside it meant nothing, which put two nodes of the same kind on opposite sides of the thing they both hang off as often as not. Nothing moves closer to or further from the node it connects to, so the structure you built keeps the shape you gave it：this only decides which side of it a branch sits on. Branch Grouping, in Physics, takes it from off to firmly sorted
  • Layered structures sit closer together and use the full width of each layer. The planes were spaced so far apart you had to fly the camera out to see two at once, a sparse layer huddled on the centreline under a busy one, and edges ran from the far right of one layer to the far left of the next because the ordering compared raw positions between layers of completely different sizes. Re-laying out a structure also does something now：the button had incremented a number that never reached the part of the layout it was supposed to change, so pressing it again moved nodes by a couple of pixels. It tries six arrangements and keeps whichever crosses the fewest edges
  • Present and Download HTML are Pro. Building a structure, writing documents, making them beautiful and publishing one live share link all stay free, and always will. What Pro buys is showing and sending：a second live link at once, pushing an update to a link you have already sent, the standalone HTML file, and full-screen presentation. Download HTML was free until this version and the pricing page said so, so this one is a genuine takeaway and worth saying plainly rather than burying

