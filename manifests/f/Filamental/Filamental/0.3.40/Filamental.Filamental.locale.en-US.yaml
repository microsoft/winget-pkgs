ReleaseNotes: |-
  • Headings and lists in the Publisher now space evenly whatever order you put them in. A heading directly under another heading, and a list directly under a heading, both came out too tight, and a subheading under a section title lost about a third of its gap. The same two blocks could look different depending on what happened to sit above them
  • Heading 4, 5 and 6 are in the format menu. They were always reachable from the keyboard and from any markdown you imported, but the menu stopped at 3, so putting the cursor in one showed "Paragraph" and there was no way to see the real level or set it back
  • Heading 4 is clearly smaller than Heading 3 now. The two were within a pixel of each other, so the ladder read as five levels rather than six
  • A published page spaces and sizes text the way the Publisher does. The two had never matched, so what you laid out was never quite what a reader got
  • Heading 4, 5 and 6 were published as Heading 3. Anything you built deeper than three levels reached a reader flatter than you wrote it

