ReleaseNotes: |-
  • Present, next to Share in the Publishing Studio top bar, fills the screen with your structure and turns it slowly, with no panels, no toolbars and nothing that answers to a mouse. It is for the ten minutes before a meeting starts, with the structure up on the big screen while people take their seats, and it does the same work at an exhibition stand or on a lecture theatre wall. A row of controls along the bottom sets the speed of the turn and how close the camera sits, shows or hides the colour key, and gets you out again. The slowest speed holds the structure still, which is the one you want when somebody asks about a node. The controls and the pointer fade away after a few seconds of stillness, so a screen nobody is touching shows your work and nothing else, and Escape leaves
  • Whatever the canvas was showing when you press it is what the room sees, at the same size, so you frame it yourself beforehand rather than being handed a view somebody else chose. The zoom steps are reversible, so the same number of presses each way lands back on exactly the framing you set up
  • Every link you publish and every file you export from this version onwards carries the same button, in the top right of its graph, so whoever you sent it to can put it on a screen in their own meeting, without you there and without installing anything

