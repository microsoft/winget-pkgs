ReleaseNotes: |-
  "Frameworks" are now "Templates". The same ready made structures, under a name that explains itself the first time you meet it
  Attaching several files at once now keeps all of them. Only one was being registered, so the rest quietly disappeared from the panel
  Attachment filenames follow your theme's colours instead of a fixed blue, and files you have already attached sit above the drop zone rather than below it
  Publisher: a link at the foot of a page now carries its connector's label in front of the page name, so it reads "gated by Change of Control Clause" instead of just the title. Shared and exported pages carry the labels too, so re-share anything you want them on
  Publisher: the footer and the cover image buttons now take the page's Title colour, so they stay readable against a dark canvas or a photograph. Borders and hover states down there had assumed a pale background and were invisible on anything else

