ReleaseNotes: |-
  • Settings is reorganised into General, Appearance, Fonts, Graph, Background, Controls, AI, Account and About, opening on General
  • Every setting has a plain name and a line describing what it does, in all eight languages
  • Sliders in Settings show their value, and every on or off setting uses the same switch
  • The shortcut reference is translated, in Settings and in its pop-out window
  • Page style, on the Publisher's top bar, holds the font, text size, page width and palette in one window with a live preview
  • Drag the Page style window aside and keep working on the page while your changes appear on it
  • Text size is Small, Medium or Large, and headings, the page title and spacing grow and shrink with it
  • Page width is Narrow, Standard or Wide
  • The palette is set out as Backdrop, Title & subtitle and Paper around the page, then Headings and Body text on it
  • Formatting selected text is done from the toolbar that appears over your selection
  • Gradient headings now run across the words on shared and downloaded pages
  • Share asks one thing first, a live link or an HTML file, then shows only the options for that choice
  • Reduce file size, for an HTML file, leaves out the graph background and page covers and keeps every picture on your pages
  • Windows across the app share one layout, with clearer names, spacing and buttons
  • Arrow keys move the cursor in text fields inside windows
  • New help pages：Working with Obsidian, and the Obsidian plugin

