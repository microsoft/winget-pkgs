ReleaseNotes: |-
  - Publisher Studio is free. Building a document used to sit behind the paywall, which put the gate in front of the wrong act: you could not make anything until you had paid for the thing you had not made yet. Everybody can write documents now, and publish one live share link. Pro is more than one link at a time, and pushing a new version to a link you have already sent
  - There is a monthly plan again, at $12 a month. Annual stays at $120 a year
  - The prices shown inside the app were wrong, in all eight languages. The upgrade buttons read "$80/yr" and "$8/mo" while the checkout charged $120 and $20, and the Portuguese copy quoted the annual price in reais. Every price in the app now matches what you are actually charged
  - Updating a link in place is a Pro feature. On the free plan you remove the link and share again, which gives you a new address. Anything already out there keeps working until you revoke it
  - Three restrictions on the free plan that nobody had decided on. Adding a folder somebody sent you to your shortcuts asked for an upgrade, although shortcuts have been unlimited on the free plan since August. The Help Playground was capped at twenty nodes, two above the number it already ships with, so the space built for exploring ran out almost immediately. And a shortcut pointing at a folder that has moved showed no warning unless you had paid, which hides a fault rather than selling anything
  - Setting up the MCP server in VS Code and Copilot. They read the same server as every other client but want a different shape, and pasting the Claude version into VS Code does nothing and tells you nothing. Both have their own snippet now, along with a portable version you can commit to a repository and hand to somebody else. The client list gains VS Code and LM Studio
  - Ctrl+S, Ctrl+Shift+S, Ctrl+B and Ctrl+F have gone from the shortcut list. All four had stopped doing anything: the first two saved a panel that no longer exists, Ctrl+B wrote bookmarks nothing could reach, and Ctrl+F named a search box in an editor we have since replaced

