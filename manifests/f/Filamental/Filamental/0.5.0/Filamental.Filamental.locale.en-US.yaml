ReleaseNotes: |-
  • Stars：draw your nodes as points of light with their names beneath, in a dark world of their own. Switch between Cards and Stars at any time in Settings, under Graph
  • Atmosphere puts a soft cloud of light around each star
  • Connectors between stars can be straight, or curved in three styles：Sweep, Tension and Filament
  • Connector labels between stars sit clear of node names
  • Group, on the bottom toolbar or key 5, gathers each classification into a cluster of its own
  • Present, a third studio on the top bar, shows your project to an audience. Press Y to open it
  • While presenting, Flow sends light along curved connectors and Breathe lets each group drift gently out and back
  • Shared links and HTML downloads show Stars, curved connectors, Flow and Breathe as you set them
  • In a shared link, clicking empty space clears a highlight and shows the whole structure at full brightness
  • Add your own video as a background, or search Pexels for one, in Settings under Background
  • Background settings are laid out as Images, Adjust, Videos and Gradients, with your own backgrounds first in each
  • Fifteen backgrounds are retired
  • The app opens on the Precision theme and The Studio background, and Publisher pages are set in IBM Plex Sans unless you choose another font
  • The Publisher opens with the graph and the page at equal width. Shared links open with the graph taking two thirds
  • Page style is saved in the project, so it comes with the project to another computer
  • PDFs and images keep their classification, properties and connections when a project opens on another computer
  • Opening a folder as a project brings in notes whose front matter holds only tags, aliases or a title
  • Setup for Codex, Gemini CLI and Zed, in Settings under AI, Other AI apps
  • Live links are now called shared links, and a published link reads Published
  • Pressed buttons and highlights across the app take the theme's accent colour
  • Tooltips are shorter, and every one with a shortcut shows it in brackets
  • The studio switcher on the top bar is no longer covered by the buttons beside it
  • New help page：Cards and Stars

