ReleaseNotes: |-
  • The help is reorganised into seven areas, with every page under the one it belongs to
  • Clicking a [[link]] in a note selects that node, and a page link in Publisher, a shared link or an HTML download opens that page
  • The welcome tour opens on a first run, and again when the tour itself changes
  • The spin preview is UFO Spin, in Space and in Publisher
  • Pin position is kept when you reopen a project
  • In Publisher, 1 runs Dark Energy and 5 runs Group
  • Download HTML is in the Link menu while a document's link is live
  • Link nodes have Open link, on their right-click menu and in the right panel
  • The interface theme, font and node style now apply to every project
  • With two or more nodes selected, Forces sliders arrange just those, and pinned nodes stay in place
  • Opening an Obsidian vault as it is leaves every note unchanged
  • Claude Desktop stays disconnected after Disconnect, and is only connected when it's installed
  • Undoing a Filamental AI reply leaves alone anything you've changed since
  • Adding a template uses a classification or connector type you already have instead of adding a second
  • The Performance mode slider sets the frame rate it switches on at
  • Settings › AI shows each app's settings path the way your computer writes it
  • The shortcut list matches the keys：Ctrl+K searches, Tab moves between panels, Space pauses physics
  • Export for AI writes every connection in the direction it points
  • A Mermaid import keeps nodes whose names start with "end"
  • A note whose front matter can't be read is left as it is on import

