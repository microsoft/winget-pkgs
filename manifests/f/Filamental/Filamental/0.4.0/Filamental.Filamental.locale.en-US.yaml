ReleaseNotes: |-
  • New / Open / Import is one window to start a project：blank, from a template, from a Mermaid diagram, from a folder you already have, or from an Obsidian vault
  • Build a project from a folder of documents, or from one document, with your own AI connection. Markdown, text, Word and PDF files are read, and the originals are never changed
  • Add a folder or a document to the project you have open, as a separate structure in a folder of its own
  • An import that stops carries on from where it left off the next time the project opens
  • Sub-folders can become classifications when you open a folder or import an Obsidian vault, PDFs and images included
  • Classify notes by folder, in the + menu, does the same for a project you already have
  • Pathfinder：select two nodes and press R to light the shortest route between them
  • Export for AI saves a Markdown file of your project that opens with a summary of how it is structured
  • The assistant connects to Ollama or LM Studio running on your own computer
  • The assistant, in the app and over MCP, can find how any two nodes connect and give a short overview of a whole project
  • A project inside another project appears there as a folder bridge
  • Editing a note keeps the front matter other apps add to it, such as Obsidian tags and aliases
  • Report a bug from the new button beside Filamental AI, at the top right. It opens an email to us

  ---
