ReleaseNotes: |-
  • Highlight a classification or a connector type in the left panel, press Dark Energy, and that selection is laid out first, on its own, before anything else is placed around it. A process that runs in a line comes out in a line. Until now the button took in the whole structure at once, so a sequence buried in something larger was pulled about by everything hanging off it and arrived as a curve with its steps facing whichever way the rest of the graph pushed them. The steps that are separated by something else, an approval or a handover of a different classification, are still read as consecutive, and those nodes in between end up sitting along the run rather than flung out to the sides of it. Once the run is placed it is held still, and the rest of your structure arranges itself around it
  • Highlighting dims everything else now instead of hiding it. Picking a classification used to make every connector that left it disappear, which took away the very thing you were looking at the structure to find：where those nodes sit in it. Nothing is removed any more, it recedes, so the shape around your selection stays legible while the selection stands out of it
  • Highlighting a connector type keeps the nodes at both ends of it lit, so you can see what it joins rather than a line floating between two things you cannot read. Picking a classification lights those nodes and steps every connector back, including the ones running between them, because that view is asking where they are and not how they interconnect
  • Node cards, the small distant markers, the connectors and their arrowheads all dim by the same amount and at the same moment. They did not before：card backgrounds stayed solid while their writing faded, distant markers ignored the highlight entirely, and arrowheads stayed at full strength until you nudged the canvas

