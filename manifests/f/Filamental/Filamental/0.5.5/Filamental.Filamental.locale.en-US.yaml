ReleaseNotes: |-
  • The Projects and Templates windows, and the tooltips on the Space, Publisher and Present buttons, now appear in all eight languages
  • A bridge can point at a folder that isn't a project yet, and creating it makes that folder a new project
  • Connector types have a Pull setting, from 1 (tightest) to 5 (loosest), in both connector editors
  • Connector thickness runs from 1 to 5 in both connector editors
  • Saving a connector type in the full editor keeps its pull and description
  • Connector Properties opens at the line weight the type already has
  • Export for AI writes the value of a Key property as (hidden)
  • Search finds nodes whose type isn't one of the project's classifications
  • A Mermaid import keeps the direction of each arrow
  • A Mermaid import that stops part-way is undone in one step

