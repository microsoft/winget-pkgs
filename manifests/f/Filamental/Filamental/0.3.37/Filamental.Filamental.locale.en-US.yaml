ShortDescription: 3D Docs, Diagrams & Flowcharts
Description: "See your thoughts like never before with Filamental.\n\nFilamental allows you to place your thoughts, connect them and present them\nin a way that is both intuitive and has depth.\n\nCreate connected networks, networked documents, documented knowledge.\n\nLimited only by your imagination, add anything, link to anything, share to\nanyone.\n\nDesigned For You\nWork in 3D or 2D, use physics to keep control, switch between an infinite\nspace and publishing. Then add themes, colors, tables, columns, images and\nbackgrounds to enhance your work and make it land.\n\nPrivacy By Default\nDid we mention we don't hold your data, IP, documents and personal info\nhostage? We don't do that. Your data stays on your machine, under your\ncontrol and you decide where it goes. It is literally impossible for us to\ngather or see.\n\nAI On Your Terms\nConnect your own AI, we don't force you to use a cheap knock-off we\nrebranded. It's easy and it's your choice.\n\nRead-Write-Collaborate\nFilamental is powerful when acting as a companion to AI, allowing you to\ncompile and create astonishing constellations. Even if AI isn't your thing,\nyou might want to give it a second chance.\n\nFree forever and paid options.\n\nFeatures:\n- Easy and intuitive navigation and UI\n- Quickly switch between building and publishing\n- Huge range of customization options for beautiful documents\n- Share and open anywhere using links or HTML files\n- 2D and 3D views\n- Custom categories and structured properties\n- Custom connector types with directional arrows, labels, colors, weights\n- Local MCP connection and BYOK brings the power of AI to creating and\n  understanding your work\n- Wikilink and Mermaid compatibility\n- Insert any files of any type to link them into your project\n- Folder bridges jump between your spaces\n- All local. You set the terms. You choose where your data resides - not us.\n- Built-in help playground, feature suggestions, bug reporting and granular\n  adjustments"
