ReleaseNotes: |-
  • Properties work, and they are worth using. You define them once for the whole structure, in the sidebar beside your note types and connector types, and every one you define then appears on every node waiting to be filled in. They were meant to come from a node's classification before this, and that half had never once had anything in it：every template shipped empty, so nothing was ever derived from anything. The half that did work dropped any property you added before you typed a value into it, and showed you the previous node's value when you clicked a second node that shared a field, then wrote that value back over the top when you clicked away
  • Twelve kinds, in words you can read. Text, Number, Yes / No, Date, Choice, Tags, Link, Email, Phone, ratings out of three or five, and Key. The old pair were called "string" and "date", and one of those is not a word. Choice and Tags take their values from a list you curate, or that you extend by typing a new one straight into the node you are filling in, and every kind tells you what it is for at the moment you pick it
  • Key is for the values you copy rather than read：an API key, a wallet address, an account number. It is hidden until you reveal it, one click copies it, and it is left out of search so a fragment of it cannot bring the node up. It is marked with an eye and a line through it rather than a padlock, because hiding is all it does. Nothing in your files is encrypted, and an icon that suggested otherwise would be the kind of reassurance that gets a live key put somewhere it should not be
  • Ratings are written into the file as "4/5" rather than "4", so the number still means something to anyone reading the file later, yourself included
  • Your existing structures are untouched. Every value is still plain text in the node's own frontmatter, exactly where it was, so anything you have already written stays put and still reads the same by hand

