ReleaseNotes: |-
  • Filamental has a new look. The mark, the wordmark and the colours are the same ones the website uses, so the app and the site finally agree on what the product looks like
  • The wordmark in the toolbar now reads filamental over .space on two lines, so a screenshot you share carries the web address with it
  • A new interface theme, Precision. Light cool grey, square corners, no shadows, and red used sparingly and only where something needs pointing at
  • The brand is drawn rather than typeset now, so it stays sharp at any size and does not wait on a font to load. On the darker themes it switches to a lighter ink and a lighter red so it stays readable
  • New app icon, on all platforms. The old one was still the previous identity
  • Settings："Node Font" is now "Graph Font", because it sets the connector labels as well as the node cards. "Node cards" and "Connector labels" now say "width", which is what they actually change, and "Inherit" is now "Match UI"
  • Settings：the font picker shows each font's name at a readable size and drops the "Aa" underneath it. Every name is already written in its own font, so the sample was saying the same thing twice
  • Gruppo no longer looks greyed out in the font pickers. It was being asked for a weight it does not have, so it fell back to its lightest one and looked switched off next to the others. Cardo had the same problem
  • The buttons along the bottom of the graph sit properly now. The insert and connector group is centred on the screen rather than wherever the groups either side happened to leave it, and the export buttons have moved to the right
  • The Filamental mark on the graph no longer sits behind the buttons in the bottom right corner
  • The first card of the welcome tour is centred again. It had been sitting low and to the right

