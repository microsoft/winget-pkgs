ReleaseNotes: |-
  • The interface font is now IBM Plex Sans, the same face the website uses. The other nine are still there in Settings
  • The notes panel in the Space Studio follows your interface font. It had been pinned to one fixed face whatever you picked, because the editor it is built on sets a font of its own and nothing was overriding it
  • Changing UI theme no longer resets your interface font. Switching theme quietly put the font back to the default and left it there until you picked a font again or restarted the app
  • Node labels on the canvas were reset by that same thing, and are fixed along with it
  • The pop-out note, controls and Filamental AI windows open in your chosen font instead of the default. They had never read the setting at all
  • Every font offered for node labels is now offered for the interface too. The two pickers had drifted apart, so Gruppo, Grotesk, Syne and Cardo could be used on the graph but not on the interface

