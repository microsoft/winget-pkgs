ReleaseNotes: |-
  • Publisher：paste a YouTube, Vimeo or Loom link onto an empty line and it becomes a player. Drag its edge to resize it, centre it, or drop it into a column like any other block
  • Publisher：a linked video survives an export or a shared link, because the player is fetched rather than carried in the file. A video file still cannot travel that way, and now says so properly when you export or share
  • Publisher：a link pasted into the middle of a sentence reads as the title of the page it points at, rather than as a long address that tells the reader nothing
  • Help has its own entry at the foot of the Projects sidebar, next to a link to the tutorial videos on our YouTube channel. It used to sit under the project grid, below whatever you were actually working on, where it was easy never to notice
  • Project card captions are readable. They were tinted so faintly that they measured under 3:1 against the card in every theme
  • Help：a new "Inserting Media" page covering the four ways to get a picture or a video onto a page, and which of them survive being handed to somebody else

