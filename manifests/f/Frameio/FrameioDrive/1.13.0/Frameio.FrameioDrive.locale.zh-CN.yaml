Description: |-
  Frame.io Drive 是 Frame.io（Adobe 视频协作平台）的桌面应用。它将 Frame.io 存储挂载到您的桌面，单击即可快速上传和下载大型文件或整个项目。
  挂载和传输可在单一窗口中管理并提供传输日志，下载会在后台持续进行；传输失败时会报告准确的错误信息，并支持下载错误日志。
