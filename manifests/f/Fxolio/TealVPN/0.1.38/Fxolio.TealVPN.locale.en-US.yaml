ShortDescription: Private VPN for Windows 10 and 11 with a free plan of 500 MB a day, no ads and no browsing logs.
Description: |-
  Teal VPN is a private VPN for Windows 10 and 11 (Intel, AMD and ARM). It encrypts your connection on hotel, café, office and airport Wi-Fi and is made for networks that block or detect VPN traffic: the connection is obfuscated and the app tries another route by itself when one stalls.
  Teal Free is included with every account: 500 MB of data a day, up to 2 devices, no payment details and no ads. Teal Pro adds unlimited data, every location and up to 3 devices. Sign in with Google, Apple or email; the same account works on Android, Mac and Linux.
