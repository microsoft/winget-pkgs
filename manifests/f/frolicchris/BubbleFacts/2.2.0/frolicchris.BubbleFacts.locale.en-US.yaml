ShortDescription: Short facts about the song you're playing, shown as bubbles on your stream in OBS.
Description: BubbleFacts is a free, open-source app for musicians and DJs who stream. It follows the song that is playing from StreamerSongList, StreamElements, Nightbot, Streamling or a now-playing file, and shows a few short facts about it as bubbles in an OBS browser source. Facts come from Wikipedia, Wikidata and MusicBrainz and are written on your own computer. Built with AI coding tools; the project discloses this.
