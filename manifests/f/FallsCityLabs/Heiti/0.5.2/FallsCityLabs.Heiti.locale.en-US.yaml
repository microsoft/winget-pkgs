ShortDescription: A private, local-first meeting brain. Records calls and in-room conversations with no bot, transcribes on your PC, knows who spoke, and writes notes with your own AI. Free to use.
Description: |-
  Heiti records any call (Microsoft Teams, Zoom, Google Meet, browser calls) or an in-room conversation with no bot joining, transcribes it on your own computer, and knows who spoke by voice: name a voice once and Heiti recognizes that person after. Summaries, tasks and follow-ups are written by the AI you choose: your own agent over MCP (Claude or Codex), your own API key, or a local model. Dictation on a hotkey types into any app, even during a recording. Heiti can also create a starter meeting brain folder in Markdown that works with Obsidian.
  Free: manual recording and import, unlimited local transcription, speaker separation, voice memory for up to 5 people, dictation, search, Markdown and text export, read-only MCP, and 5 AI summaries a month on your own key or local model, on one device. Pro (by invitation today; a paid subscription on fallscitylabs.com later) adds call detection and auto-record, always-on mode, unlimited voice memory and summaries, templates, Ask Heiti, tasks and follow-ups, write MCP and agent hand-off, the brain folder, end-to-end encrypted sync and every export format. Recording and transcription need no account; a free Falls City Labs account (email only) is for Pro.
  Heiti for Windows 10 and 11. A Mac version is coming later.
