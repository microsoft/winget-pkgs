ShortDescription: Hold a mouse thumb button, point at a zone on any monitor, let go to snap the window. 7-day free trial, then a one-time purchase.
Description: |-
  Thumbtile turns a mouse thumb button (or a held key such as Right Ctrl) into a window manager. Hold it and snap zones appear on every monitor at once; point at one and release to snap the window under the cursor there. Scroll while holding to change the layout (21 landscape and 16 portrait layouts, set per monitor), tap to maximize, and middle-click while holding to send the window to the next monitor. Make your own layouts in a split-and-drag editor, or capture the windows already on screen as a new layout. Works with any mouse with Back/Forward buttons and with the Logitech MX Master gesture button or Actions Ring via Logi Options+. Runs locally with no account.
  Trial: every feature is free for 7 days on one PC; after that, snapping pauses until a Pro license (one-time purchase, up to 3 PCs) is added. Settings are kept.
