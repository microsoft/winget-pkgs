ShortDescription: Find personal information in Japanese PDFs and images, and redact it for good — the text underneath is removed too.
Description: |-
  Fuseji finds names, addresses, phone numbers, My Number and bank account numbers in Japanese PDFs and images, and removes them together with the text underneath.
  Unlike black boxes laid on top, the result cannot be undone. After export it checks that nothing remains and writes a verification report.
  Documents, images and detection results never leave your computer.
  The free version covers detection, review and export (exported files carry a watermark). The paid version is a one-time purchase: you buy a license key on the Polar checkout page and enter it in the app. No payment is made inside the app.
