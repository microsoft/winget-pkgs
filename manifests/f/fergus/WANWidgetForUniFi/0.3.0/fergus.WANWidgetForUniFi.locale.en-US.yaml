ShortDescription: Desktop widget for UniFi gateways showing live WAN throughput, data used this month and your public IP.
Description: |-
  A small Windows desktop widget fed by your UniFi gateway's local API. It shows a live graph of WAN download and upload (with 24-hour and 7-day history from the gateway), data used in your billing month, your public IP with a CGNAT badge, WAN uptime and latency. It can notify you when the internet goes down or your public IP changes.
  Works with UniFi OS consoles and UniFi OS Server, using an API key kept in Windows Credential Manager. Not affiliated with Ubiquiti.
