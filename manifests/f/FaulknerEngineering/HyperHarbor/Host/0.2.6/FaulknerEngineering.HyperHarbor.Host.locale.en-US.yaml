ShortDescription: Manages the Hyper-V virtual machines on this PC for paired HyperHarbor clients.
Description: The HyperHarbor host runs as a Windows service on the PC that runs Hyper-V. Paired devices running the HyperHarbor client list, start, create, and back up its virtual machines and connect to them with Remote Desktop in one click, with a one-time password for each connection. It needs Windows 10 or 11 Pro, Enterprise, or Education with Hyper-V turned on.
