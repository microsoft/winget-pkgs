InstallationNotes: HyperHarbor Host runs as the HyperHarborHost service and updates itself. Open HyperHarbor Host from the Start menu to set an admin passphrase and to pair devices. Uninstalling keeps pairings and settings in %ProgramData%\HyperHarbor; delete that folder to remove them too.
