ShortDescription: Passive Bluetooth LE gateway and ESPHome proxy for Windows.
Description: AirFoxBT is a zero-driver, zero-privilege Windows background service and desktop tray gateway that turns Windows 10, Windows 11, or Windows Server into an ESPHome Bluetooth Proxy (port 6053) for Home Assistant. It passively decodes BLE advertisements (BTHome v2, ATC, PVVX, MiBeacon) and streams raw frames over TCP without pairing or custom drivers.
