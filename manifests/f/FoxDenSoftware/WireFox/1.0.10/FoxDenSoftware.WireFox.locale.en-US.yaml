ShortDescription: Automated roaming and watchdog manager for WireGuard on Windows
Description: WireFox bridges the missing link of WireGuard on Windows with intelligent background roaming and kernel-level tunnel watchdog protection. Auto-disconnects on trusted home Wi-Fi and gateways, auto-connects on untrusted networks, and defends against ARP spoofing.
