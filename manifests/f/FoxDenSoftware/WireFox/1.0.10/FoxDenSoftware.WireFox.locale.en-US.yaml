ReleaseNotes: |-
  WireFox bridges the missing link of WireGuard on Windows: intelligent background roaming and kernel-level tunnel watchdog protection.
  📝 What's New in v1.0.10
  Addressing app ux freezing
  - UI Thread Decoupling & wg.exe Timeout Guard: Offloaded DiagnosticsViewModel summary/scan queries and SettingsViewModel tunnel discovery off the WPF UI thread, and replaced unbounded StandardOutput.ReadToEnd() calls in WireGuardCliService with a strict 3-second timeout + process termination guard so a wedged wg.exe pipe can never freeze the UI, tray icon, or background watchdog.
  - Default-Off Debug Logging & Log Rotation: Added a Debug Logging toggle on the Diagnostics page (off by default) with a 5 MB rollover cap (app.log.old), streamed self-hash verification in UpdateService, and guarded all async void event handlers.
  - Serialized WatchdogService State Machine: Unified OnNetworkSettled, OnPeriodicCheckAsync, OnConfigChanged, OnNotificationAction, and manual tunnel commands under a single SemaphoreSlim gate with a timer re-entrancy guard to prevent overlapping wake/reconnect races.
  - Initial Setup Watchdog Gate: Deferred automatic tunnel activation and recovery until InitialSetupCompleted is true, preventing background watchdog races during first-run setup.
  - Post-Wake Settling Window: Enforced a 4-second post-wake grace deadline in NetworkMonitorService so flapping NetworkAddressChanged events cannot prematurely shorten sleep-resume stabilization.
  - Non-Blocking Dispatcher Audit: Replaced remaining synchronous Dispatcher.Invoke calls in TrustedNetworksViewModel, WatchdogService, and LoggingService with InvokeAsync, and offloaded tray ContextMenuStrip actions to background tasks.
  - Tray, Offline Standby & About UX: Added a Tunnel Ready (Offline) gray standby indicator when physical uplinks drop with an armed tunnel, a Restart dropdown (Restart WireFox, Restart WireFox + WireGuard) and standalone About popup on the system tray menu, plus GitHub/Releases/Issues/Ko-fi links in Settings > About.
  Run PowerShell as Administrator to install or seamlessly upgrade in place:
  irm https://raw.githubusercontent.com/TalviFox/WireFox/main/install.ps1 | iex

