ReleaseNotes: |-
  - Settings now says what Ctrl V pastes after a dictation: the dictation itself, still the default, or what you had copied before.
  - With Ctrl V set to paste what you copied before, a dictation Koegaki left on the clipboard is still known as its own after Koegaki quits, updates or restarts, so the next dictation no longer puts it back as if you had copied it.
