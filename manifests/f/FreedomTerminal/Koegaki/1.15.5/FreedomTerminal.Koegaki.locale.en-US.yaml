ReleaseNotes: |-
  - With Tap to start and stop, long speech with no pause is no longer cut in the middle of a word. Koegaki used to split it after 14 seconds wherever that fell, which could change a word or drop one at the split. It now waits for a pause. Speech that runs past 20 seconds with none is split at its quietest moment.
