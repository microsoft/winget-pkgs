ShortDescription: 拖入项目，生成 60 页软著源程序文档。离线抽取、注释清洗、自动排版，导出前先帮你过一遍审查——代码不出本机。
Description: CodeSucker 把软件著作权源程序材料规则整理成一条本地流水线：导入项目 → 五步向导 → 导出文档，并在导出前自动检查页数、行数、页眉和署名等风险，帮助减少手工整理错误与补正概率。支持目录级文件筛选与安全重新扫描、按文件数/代码行查看文件类型构成并按后缀导出、状态机代码清洗（逐字符识别注释与字符串边界，支持 30+ 后缀）、自动分页排版与导出前校验。全程离线运行，代码不出本机。
Tags:
- 软著
ReleaseNotes: |-
  安装与处理边界
  当前 macOS 安装包尚未进行 Apple Developer ID 签名与公证。请只从本项目 Release 下载并先核对 SHA-256；如首次打开被 Gatekeeper 拦截，请在“系统设置 → 隐私与安全性”中选择“仍要打开”。详细处理方式见 README。
  CodeSucker 自身的源码扫描、第三方代码线索分析、清洗、分页、校验和导出全部在本机运行，不调用任何本地或云端 LLM，也不向模型服务发送源码。第三方代码线索只提供启发式证据与筛选建议，不自动判定代码归属，也不构成法律意见。更新检测仅查询 GitHub Release 公开版本元数据。
