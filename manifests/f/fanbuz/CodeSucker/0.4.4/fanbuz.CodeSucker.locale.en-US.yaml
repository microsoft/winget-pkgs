ShortDescription: Drop in a project and generate the 60-page source-code document for Chinese software copyright registration. Offline extraction, comment cleaning, automatic layout, and a pre-export review — your code never leaves the machine.
Description: 'CodeSucker turns the rules for software copyright source-code materials into a local pipeline: import a project, walk through a five-step wizard, and export the document, with automatic pre-export checks for page count, line count, headers, and attribution to reduce manual errors and correction requests. It offers directory-level file filtering with safe rescanning, file-type composition by file count or code lines with per-extension export, state-machine code cleaning that recognizes comments and string boundaries character by character across 30+ extensions, automatic pagination and layout, and pre-export validation. Everything runs offline — your code never leaves the machine.'
