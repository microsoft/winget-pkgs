ShortDescription: >-
  Free Windows app that converts iPhone HEIC/HEIF photos to JPG in a batch — set the JPEG quality with a slider, choose where the results go, and convert offline. No uploads, no accounts, no telemetry.
Description: >-
  HEIC to JPG Converter fixes the one annoying thing about photos from an iPhone: they arrive as .heic files that half the world refuses to open. Add a whole camera roll at once, dial the JPEG quality with the slider — 90 for print, 85 for sending, lower when the files just have to be small — and pick an output folder, or keep the default “Next to the original”. Every row shows the before → after size and the share saved. Conversion uses the very same HEIF codec Windows uses for Explorer thumbnails, so no third-party DLLs are bundled; if that codec is not installed yet, the app offers a one-click link to the free Microsoft “HEIF Image Extensions” — and Explorer gains HEIC thumbnails as a side effect. Everything is local: photos are decoded and re-encoded on your PC, never uploaded, no cloud service, no account, no telemetry — the app works with Wi-Fi off.
