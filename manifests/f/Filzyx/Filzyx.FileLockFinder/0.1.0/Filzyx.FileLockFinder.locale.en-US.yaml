ShortDescription: >-
  Free Windows app that answers “who is locking this file?”: Windows itself reports the processes holding it open — names, PIDs, one click, read-only.
Description: >-
  File Lock Finder solves the eternal Windows frustration: you try to delete, move or replace a file and hear “the file is in use by another program” — without saying which one. Add the file (or a whole batch), press Check, and Windows reports the truth: every process holding the file open, by name and PID — the same Restart Manager engine that installers and Task Manager use for their “files in use” dialogs. Nothing is unlocked, closed or killed: the tool is read-only by design, because a mysterious lock is usually a program you actually want. Typical jobs: freeing a folder that refuses to delete, replacing a build artifact held by a stale process, moving a video still open in a player, or just understanding what that sync client is doing to your documents.
