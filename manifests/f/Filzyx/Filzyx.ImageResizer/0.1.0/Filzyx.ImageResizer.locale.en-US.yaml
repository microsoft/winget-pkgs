ShortDescription: >-
  Free Windows app that resizes images in batches — by width, height, a bounding box or a percentage — with high-quality resampling and zero fear of ruining your originals.
Description: >-
  Image Resizer does the everyday image job Windows forgot to include: batch resizing. Point it at a folder's worth of pictures, choose how to size them — a fixed width, a fixed height, fit them into a 1920×1080 box, or scale by percentage — and press one button. Every file shows its before → after dimensions, sizes and the percentage saved; results are written next to the originals as name_800x450.jpg and nothing is ever overwritten. Resampling is high quality (cubic): photos keep their smoothness, screenshots keep their edges. JPEG re-encodes with the quality slider you set; PNG and WebP stay lossless. Perfect before posting to a site with size limits, emailing a batch, or taming a folder of 6000×4000 camera shots into something your cloud drive will actually accept.
