ShortDescription: >-
  Free Windows app that verifies downloaded files against MD5, SHA-1, SHA-256 or SHA-512 checksums — paste the expected hash, get a green or red badge. Streaming reads, no size limit, fully offline.
Description: >-
  Checksum Verifier is the last step after every download: add an ISO, installer or archive, paste the checksum from the vendor's download page, and see at a glance whether the file is intact — a green “Hash matches” badge or a red “Hash does not match”. MD5, SHA-1, SHA-256 and SHA-512 are built in, alone or several at once, and the comparison ignores case and stray spaces, so a hash copied from a webpage just works. Files are read from disk in a stream — even a 10 GB ISO is hashed with a flat memory footprint — and a whole batch can be verified in one pass. Everything happens locally: nothing is uploaded, the file never leaves your PC, no account, no telemetry. Keep it for installers, Linux ISOs, firmware images, USB sticks and any file that crossed a network.
