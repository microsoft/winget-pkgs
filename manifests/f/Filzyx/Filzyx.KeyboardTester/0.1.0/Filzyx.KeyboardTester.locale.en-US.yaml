ShortDescription: >-
  Free Windows app that shows which keys work and how many keys your keyboard can hold at once — press, see it turn green, check for rollover.
Description: >-
  Keyboard Tester turns the classic “which key is broken?” question into a simple board. Press any key on your real keyboard and the matching key on the on-screen 104-key layout lights up green — tested keys stay marked, so you can walk through the whole board and see exactly what failed at a glance. The status panel counts tested keys, shows the last key with its USB HID code, and measures rollover: hold several keys together and watch “max held at once” climb. Cheap membrane keyboards often cap at 3–6 keys; a good mechanical board handles the full row. A moving focus hint appears if the window loses keyboard focus, and one button resets the test for a fresh round. Everything runs locally — no driver, no admin rights, no internet. Ideal before a warranty claim, after spilling coffee, or when hunting a ghosting problem in games.
