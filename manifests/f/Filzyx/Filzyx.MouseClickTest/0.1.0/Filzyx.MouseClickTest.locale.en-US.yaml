ShortDescription: >-
  Free Windows app that counts left, middle and right clicks, measures clicks per second and tests your double-click speed against a 250–900 ms threshold. Fully offline — no click history is recorded.
Description: >-
  Mouse Click Test turns the whole window into one big click area: left, middle and right buttons all count, with a running total, per-button chips and a live clicks-per-second meter that shows the current burst and the best one since you reset. Switch to the double-click test and it times the gap between two clicks — if the interval is under your threshold (adjustable from 250 to 900 ms with the slider, 500 ms by default) it reports “Double click detected”; if not, “Too slow for a double click”. That one number tells you a lot: a healthy mouse double-clicks well under 500 ms, while a worn switch drifts slower and starts registering single presses as doubles in Explorer. Counting happens in memory only — no click history is written to disk — and the app never touches the network. Use it to diagnose a dying mouse, measure your CPS in games, or check a new mouse before the return window closes.
