ShortDescription: >-
  Free Windows app that turns your Wi-Fi signal into a live 2-minute graph — one measurement per second through netsh, no admin rights. Signal in percent, a plain-word quality rating, SSID/BSSID and receive/transmit speeds, so you can find the best...
Description: >-
  Wi-Fi Signal Monitor watches the strength of your wireless connection in real time: a graph fills in as you watch, keeping the last 2 minutes with one sample every second. The current level is shown as a percentage and translated into plain words — Excellent, Good, Fair or Poor — and next to it you see the network you are on: SSID, BSSID (the exact access point) and the negotiated receive and transmit speeds. Walk around the flat with the graph open to find where the signal dips; move the router, rearrange the furniture or switch a device between 2.4 and 5 GHz and watch the line react. The readings come from the built-in netsh command run once a second under your normal user account: no admin rights, no network traffic, no telemetry — and with the internet off the app still measures. Dark and light themes, free for Windows 10/11.
