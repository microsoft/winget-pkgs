ShortDescription: >-
  Free Windows app that shows every device on your local network: routers, phones, TVs, printers and sleeping gadgets — one ping sweep plus the ARP table, no deep scanning.
Description: >-
  LAN Device Scanner answers the question every home network owner asks eventually: what is actually connected? Enter your range (it auto-detects it, e.g. 192.168.1.0/24) and press Scan: the app pings every address once and then reads the local ARP table, so both awake devices and sleeping ones with a known IP–MAC pair appear in one clean list — IP address, MAC, reverse-DNS hostname when it resolves, and an honest status: “online” or “in ARP — no ping reply”. Typical jobs: finding the printer's IP, checking that smart-home gadgets are still on the network, verifying that a visitor's phone really left, or just seeing how many devices share your Wi-Fi. Read-only by design: no port scanning, no probing, nothing sent anywhere.
