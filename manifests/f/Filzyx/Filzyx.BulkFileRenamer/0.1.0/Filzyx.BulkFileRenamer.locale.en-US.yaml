ShortDescription: >-
  Free Windows app that renames many files at once: build a rule chain — find & replace, numbering, case, extension — and watch every new name in a live preview before anything touches the disk. One click renames, one click undoes.
Description: >-
  Bulk File Renamer turns the impossible Explorer chore into a two-minute job. Add files or a whole folder (subfolders included), stack rename rules in any order — find & replace with regex, insert text, numbering with padding, case conversion, spaces to underscores, extension change — and see the result instantly in a preview list where conflicts with existing names are flagged in red before anything is renamed. The rename itself is a safe two-phase operation: swaps and case-only changes are handled correctly, a target that would overwrite an unrelated file is refused, and one click of Undo restores every original name.
