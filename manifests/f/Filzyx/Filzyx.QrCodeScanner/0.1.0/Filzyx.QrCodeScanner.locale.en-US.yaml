ShortDescription: >-
  Free Windows app that reads QR codes from image files — screenshots, photos, downloads — with a pure offline decoder, no camera and no uploads.
Description: >-
  QR Code Scanner decodes the QR codes you already have as pictures: a screenshot of a Wi-Fi code from a chat, a photo of a poster taken on the street, a downloaded ticket PDF rendered to an image. Add the files, press Decode, and the app lists the content of each code — with a chip saying what it is: a URL, a Wi-Fi network, an e-mail, a phone number or plain text. Copy any decoded payload with one click, and see honest statuses when a picture contains no readable code instead of silent failure. Batch works too: drop a folder's worth of shots and read them all at once. The decoder is pure software — it never touches your camera, never opens the network, and nothing leaves the PC.
