ShortDescription: >-
  Free Windows app that checks a monitor for dead, stuck and hot pixels: fullscreen solid colours, a smooth gradient and a flashing stuck-pixel fix mode. No browser, no ads, works offline.
Description: >-
  Dead Pixel Test shows your screen in every colour that matters — white, black, the three primaries, cyan, magenta, yellow, gray and a smooth gradient — so dead pixels (always black), stuck pixels (always bright or coloured) and hot pixels become impossible to miss. Click or press Space to walk through the screens, press F for real fullscreen, and note anything that does not switch colour. If a stuck pixel shows up, the built-in flashing mode runs rapid colour cycles that often revive it — leave it for 10–30 minutes. A colour legend on the home screen shows exactly which screens are coming.
