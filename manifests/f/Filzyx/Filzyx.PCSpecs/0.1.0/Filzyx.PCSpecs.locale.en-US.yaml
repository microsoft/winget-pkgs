ShortDescription: >-
  Free Windows app that shows what is inside your computer: CPU model, cores and clock, RAM size and modules, graphics adapter, disks, motherboard, BIOS — in plain readable cards.
Description: >-
  PC Specs runs one PowerShell query against the standard Windows hardware sources (CIM/WMI) and lays the answer out as clean cards: operating system and build, processor model with cores, threads and clock speed, installed RAM with module details, graphics adapter and driver, every disk with its size, drive letters with free space, motherboard and BIOS. Three seconds after launch you have the full spec sheet — the same data systeminfo and msinfo32 show, minus the console window and the wall of text. A “Copy all” button puts a formatted list on the clipboard for a forum post, an insurance list or a buyer asking “what are the specs?”.
