Description: >-
  Startup Manager gathers every autostarting program in one list: the Run and RunOnce keys of the registry (current user and all users) and both Startup folders. Each entry shows what Windows will actually run — the program name, its exact command and where it comes from, the details Task Manager keeps out of sight. The switch works exactly like the one in Task Manager: it writes the StartupApproved flag, the entry itself stays in place, nothing is deleted, and flipping the switch back restores the program. Entries for the current user toggle without administrator rights; entries for all users are listed with a lock. Use it to speed up sign-in, to find forgotten updaters and game launchers, to audit what software added right after its installation, and to answer the eternal question — who is slowing down my boot?
