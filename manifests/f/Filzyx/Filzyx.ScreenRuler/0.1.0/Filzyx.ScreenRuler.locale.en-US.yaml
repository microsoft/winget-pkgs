ShortDescription: >-
  Free Windows app that turns your screen into a ruler: a draggable pixel ruler with live readout, horizontal or vertical, ghost-transparent over anything you measure.
Description: >-
  Screen Ruler measures what a physical ruler cannot — pixels on your screen. Drag the marker and the readout follows: ≈ 482 px, updated in real time; arrow keys nudge by one pixel, Shift+arrows by ten. Flip between horizontal and vertical mode, dial the window opacity down to 40% so the ruler ghosts over the UI you are measuring, and keep it always-on-top — it stays above your browser, editor or image viewer. Typical jobs: checking that a button really is 44 px tall, verifying an element's width before writing CSS, comparing spacings between two layouts, or measuring a distance in a screenshot at 100% zoom. One small window, no calibration needed at standard display scaling.
