ShortDescription: >-
  Free Windows app that gives any folder a custom icon — an .ico file or any .exe / .dll whose icon you want to reuse. Works on Windows 10 and 11 in bulk, shows the change instantly, and resets with one click.
Description: >-
  Folder Icon Changer puts the icons you want on the folders you want. Add one or several folders, point the app at an .ico — or at any .exe or .dll to borrow its embedded icon — and press Apply. The tool writes the icon into the folder's own desktop.ini, sets the attributes Explorer requires and asks the shell to refresh, so the new icon appears immediately. Windows 11 removed the Properties → Customize tab that used to do this manually; here it works on a whole batch at once. Reset to default restores the original folder icon and cleans up the files it created.
