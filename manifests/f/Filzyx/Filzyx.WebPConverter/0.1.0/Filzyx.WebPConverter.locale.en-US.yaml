ShortDescription: >-
  Free Windows app that converts images to WebP — losslessly, pixel-perfect — and turns WebP files back into PNG or JPG so any program can open them. Batch, offline, nothing uploaded.
Description: >-
  WebP Converter solves both directions of the WebP problem. Going to WebP: drop in JPEG, PNG, BMP or GIF files and get lossless WebP — the pixels are preserved exactly, while graphics-heavy images typically shrink by 25–80%. Coming from WebP: websites love serving .webp, but Windows apps, editors and messengers still choke on it — one press turns a whole batch into pixel-perfect PNG or JPG with the quality you choose. Every file shows its before/after size and the percentage saved, outputs are written next to the originals with a new extension and never overwrite anything, and the whole conversion happens locally — no uploads to an online converter, no accounts.
