ShortDescription: >-
  Free Windows app that finds the right emoji by keyword and copies it in one click — 546 emojis, a recent strip and zero internet.
Description: >-
  Emoji Picker is the missing search box for your emoji habit: type “rocket”, “ok”, “fire” or “love” and the right symbol is one click from your clipboard. The bundled library holds 546 emojis in eight groups — smileys, animals, food, activity, travel, objects, symbols and flags — with English keyword synonyms that work no matter what language your Windows runs in. Every copy lands in the recent strip (24 items, deduplicated) so the emoji you use daily is always at hand. Everything is local: the library ships inside the app, nothing is fetched from the internet, no account, no telemetry. Think of it as the built-in Win+. panel — plus keyword search that actually finds things, plus a real history, plus one-click copy. Paste with Ctrl+V into any chat, document or bug report and get on with your day.
