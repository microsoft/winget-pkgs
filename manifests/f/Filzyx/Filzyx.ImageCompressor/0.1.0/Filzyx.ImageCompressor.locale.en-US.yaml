ShortDescription: >-
  Free Windows app that makes photos and screenshots smaller — pick a JPEG quality from 10 to 95 or an exact target size in KB/MB, cap the max side, and read “saved N%” on every file. Fully offline, and originals are never overwritten.
Description: >-
  Image Compressor turns a folder of oversized photos into files you can actually send. Quality mode is the direct route: slide JPEG quality from 10 to 95, from “tiny but rough” to “visually identical”, and every row reports the new size and the percentage saved. Target size mode is the precise one: type a limit in KB or MB — 500 KB, 2 MB — and the app binary-searches the JPEG quality until the file fits, honestly saying “target not reached” when the limit is impossible instead of pretending. Need smaller pixel dimensions too? Set a max side and oversized photos are downscaled proportionally before saving. Results are written next to the original as .jpg files named after the source — sunset.png becomes sunset.jpg — or into a folder of your choosing, with a safe “-1” suffix on name clashes; the original is never modified, so trying another setting costs nothing. Every file shows a line like 4.8 MB → 620 KB · saved 87% · quality 74, and the header totals the savings for the whole batch. Transparency is flattened onto white instead of turning black, so PNG logos and screenshots stay usable. It all runs on your own PC: nothing is uploaded, there is no account and no telemetry — Wi-Fi off changes nothing.
