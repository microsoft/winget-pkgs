ShortDescription: Free Windows duplicate file finder: exact SHA-256 matches, similar photos, duplicate music by tags or by sound.
Description: |
  Duplicate File Finder is a free utility for Windows 10/11 (x64) that finds and removes duplicate files. Four search modes: exact duplicates verified with a two-pass SHA-256 pipeline; similar photos matched with perceptual hashing and an adjustable similarity threshold; duplicate music matched by embedded tags; and identical recordings matched by audio fingerprints across formats and bitrates. Groups are reported live while scanning, images can be previewed with EXIF data, audio can be played before removal, the oldest file in each group is kept as the original, and deleted copies go to the Recycle Bin. No ads, no accounts, no telemetry.
