ShortDescription: >-
  Free Windows app that makes QR codes for links, Wi-Fi networks and e-mail — with a live preview and crisp PNG export, fully offline.
Description: >-
  QR Code Generator turns text into a QR code the moment you type it: paste a link, build a Wi-Fi code that joins guests to your network, or make a “write us an e-mail” code with a filled-in subject and message. The preview updates live, and the export is rendered module by module — choose the module size for print and keep a quiet zone of at least four modules so any scanner locks on instantly. Error correction is selectable (L/M/Q/H) for stickers, dirty surfaces or a logo overlay later. Everything runs on your PC: nothing is uploaded, no account, no watermark in a “free tier”, and the PNG is yours to print, share or put on a business card. The app also tells you honestly when a payload is too long for one QR code — better than silently producing an unscannable square.
