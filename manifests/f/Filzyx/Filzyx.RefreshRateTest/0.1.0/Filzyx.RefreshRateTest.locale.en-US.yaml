ShortDescription: >-
  Free Windows app that reads the current display mode through Win32 and measures what your monitor really delivers — reported Hz, every available mode, real FPS and frame times, plus a moving bar that makes stutter visible.
Description: >-
  Refresh Rate Test answers the question every gaming monitor owner eventually asks: is my display really running at 144 Hz — or did Windows quietly leave it at 60? The app asks Windows itself through the Win32 EnumDisplaySettings API: it shows the current resolution and refresh rate together with every mode the display reports for that resolution, so you can compare what the panel supports, what is selected right now and what actually happens in the loop. Then it starts measuring: a bar glides across the window, the meter counts real frames per second and keeps the average and worst frame times. If the number sits below the reported Hz or the frame times spike, something is dropping frames — and the stripe, which should move without jumping, shows it immediately. All of it is local: a thin FFI bridge reads the display APIs Windows already exposes, so there is no driver to install, no administrator rights and no telemetry. It is the first thing to run after buying a monitor, updating a GPU driver, moving a laptop to battery or suspecting that a cable cannot carry 1080p at 240 Hz.
