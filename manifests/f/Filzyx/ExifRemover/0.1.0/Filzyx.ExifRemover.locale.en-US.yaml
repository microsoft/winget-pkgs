ShortDescription: >-
  Free Windows app that strips EXIF, XMP, IPTC, comments and text chunks from photos — losslessly, without re-compressing a single pixel, and without uploading anything.
Description: >-
  EXIF Remover cleans photos before you share them: it reads every added photo, shows exactly what is hidden inside — camera make and model, capture date, GPS coordinates, XMP, IPTC and comments — and removes all of it with one press. The magic is in how: instead of re-saving the image (which degrades quality and sometimes doubles the size), the app rebuilds the file without its metadata segments and chunks, copying the image data byte-for-byte. EXIF and XMP (APP1), IPTC (APP13), comments and PNG text chunks are dropped; JPEG colour profiles (ICC), JFIF and the pixels themselves are preserved perfectly. By default clean copies are saved next to the originals; a switch rewrites files in place for those who know what they are doing.
