ShortDescription: >-
  Free Windows app that shows what is taking up space on your drive: an interactive treemap, a breakdown by file categories and the largest files list. Cleanup goes to the Recycle Bin, and the interface speaks 16 languages.
Description: >-
  Disk Space Analyzer scans a drive or folder without reading file contents, so even multi-terabyte disks take about a minute. The interactive treemap draws folders and files as blocks sized by their real footprint — click a block to drill down. A colour-coded bar breaks the space down by categories (video, images, archives, documents, programs and more), and the largest files list ranks the top 500 files so the biggest space hogs are visible immediately. Files and whole folders go to the Recycle Bin without a rescan: the totals update instantly.
