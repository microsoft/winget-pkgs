ShortDescription: >-
  Free Windows app that finds every empty folder — including long chains where folders only contain other empty folders — and removes them to the Recycle Bin. Manual selection, one click, nothing is deleted behind your back.
Description: >-
  Empty Folder Cleaner scans the folders you choose and shows every directory that contains no files at all. It is smarter than a simple check: a folder whose only content is other empty folders counts as empty too, so an entire dead chain from an uninstalled program or a moved photo library is found in one pass. System folders are skipped by default, unreadable folders are never touched, and nothing is selected automatically. Tick what you do not need and press Recycle — everything goes to the Recycle Bin, so a mistake is one restore away.
