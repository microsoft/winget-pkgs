ShortDescription: >-
  Free Windows app that reads the exact colour of any pixel on your screen: live preview, one-click pick anywhere, HEX/RGB/HSL values and a history wall that copies as you work.
Description: >-
  Color Picker is the eyedropper Windows never shipped. The window shows the colour under your cursor live — move the mouse and the big swatch, HEX, RGB and HSL values follow. Press Space, or just left-click anywhere on the screen (even outside the window), and the colour lands in the history wall and on your clipboard as a HEX code, ready to paste into CSS, a palette, or a chat. Pick thirty colours in a row and they line up as swatches — click any of them to copy again. A Keep-on-top switch keeps the app above your design tool or browser. No screenshots are taken and nothing leaves the computer: the app reads exactly one pixel under the cursor at a time.
