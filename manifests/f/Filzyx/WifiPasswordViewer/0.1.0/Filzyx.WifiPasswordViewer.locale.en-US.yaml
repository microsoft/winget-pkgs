ShortDescription: >-
  Free Windows app that shows the passwords of every Wi-Fi network this PC has ever connected to — masked by default, revealed with one click and copied to the clipboard.
Description: >-
  Wi-Fi Password Viewer lists every saved WLAN profile on the computer and reads the password behind each one. The list stays masked (••••••••) until you press Show passwords or a per-network eye button, so nothing leaks over your shoulder; a copy button puts a single key on the clipboard and Copy all exports the whole “SSID: password” list at once. Data comes from the standard Windows WLAN profiles — the same store that fills in your password automatically when you reconnect — so no admin rights, no router access and no internet connection are needed. A search box filters by network name, and Refresh re-reads the list after a new connection.
