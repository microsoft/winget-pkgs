ShortDescription: >-
  Free Windows app that shows what your laptop battery is really worth: design capacity vs full charge capacity, wear in percent and charge cycles — read straight from Windows, no vendor tools.
Description: >-
  Battery Health Check reads the battery report Windows already generates and turns it into one clear card: current health as a percentage, how much capacity has been lost (wear), the original design capacity, the capacity the battery still reaches on a full charge, charge cycles, chemistry and manufacturer. On a Lenovo, Dell, HP, ASUS or any other laptop, that is the fastest way to answer “is my battery dying?” — the numbers come from the system itself, not from a third-party estimate. One refresh button re-reads everything, and the full official Windows report can be opened in the browser for the complete charging history.
