ReleaseNotes: "# ZManager CLI 2.3.0 Release Notes\n\nZManager CLI 2.3.0 updates the TZAP engine and strengthens release provenance\nand macOS distribution.\n\n## Highlights\n\n• Update TZAP crates to 0.3.0. TZAP preserves existing destinations during\n  atomic overwrite, limits selected-file restore work to the requested members,\n  and signs and notarizes its macOS binaries.\n• Sign and notarize ZManager's macOS CLI binaries before publishing them.\n• Pin every sibling build input to a reviewed commit and use that same snapshot\n  across release packages.\n• Improve static OpenSSL builds and cross-platform release packaging.\n\n## Upgrading\n\nThe command-line interface and archive formats remain compatible. TZAP 0.3.0\nimproves overwrite safety and selected-file restore behavior."
