ShortDescription: Floating bar that shows and controls what happens with your Internet connection.
Description: |-
  TrafficBar is a free, open-source floating bar for Windows. It shows how pages load, which trackers contact you and which
  programs use your network, and lets you cut connections, block programs with Windows Firewall rules and keep a monthly
  data quota. Everything runs locally: no telemetry, no accounts, no automatic updates.
  The per-program traffic monitor needs Npcap (https://npcap.com) and administrator rights; the interactive installer offers
  to download it, a silent install does not.
