  Added
  - You can organize the sidebar into collapsible sections: create sections, drag Bots and groups between them, or let the Main Bot organize the team for you. (#836, #875, #1176)
  - Creating or editing a Bot puts its runtime (DeepSeek Harness model or a local agent CLI) in one selector, and you can set the reasoning effort of a Codex CLI Bot. (#916, #1059, #1087, #1088, #1135, #1137)
  - Memory layers and tidy: entries carry an id, an optional end date and a pin; MEMORY.md writes spill to topic files when full instead of failing; changes reach a running conversation without invalidating its prompt cache; related topic entries are recalled at the start of a turn; automatic reviews write team learnings to topic files until you add them to every Bot; changed memories are tidied once a day with one-click undo; you can move an entry to another scope from the memory panel; and Bots can read a public Bot's memory on demand. (#214, #453, #797, #925, #1185, #1202, #1205–#1213, #1220, #1229, #1232)
  - When a Bot is waiting on a delegated Bot, group or subagent that never answers, you can give up on that wait from the right-click menu so the Bot can go on. (#919, #1198)
  Changed
  - Settings opens in a single two-column dialog across General, Models, Local agents, Connectors, IM, Computer use, Secrets and Usage, and model providers fold by default with a search box. (#1038, #1049, #1136)
  - On macOS, the desktop app draws its window without the system title bar, with native window controls and vibrancy in the sidebar, and full-height panes start at the left column's edge. (#1230, #1231)
  - Word, Excel and PowerPoint creation supports rich document blocks (callouts, code blocks, page breaks, headers and footers), number formats and column widths in spreadsheets, and two-column, stat and frame slides in presentations. (#613, #1180)
  Fixed
  - On Windows, Computer use turns on again instead of failing to load its native driver with os error 126, and Bots get Windows-specific input guidance. (#1025, #1035, #1175)
  - On macOS, the packaged desktop app runs the signed Computer use helper from outside the app bundle (with retry from Settings) so macOS attributes Screen Recording and Accessibility permissions to DSH Computer Use, and Computer use recognizes MCP structured tool results and leaves DeepSeek Harness's own Computer use alone in ordinary Sessions. (#1050, #1066, #1070, #1100, #1101, #1112, #1174, #1175, #1178, #1224)
  - On Windows, Bots that run on an agent CLI installed with npm or pnpm (OpenCode, Claude Code, Codex and others) start again instead of stopping with spawn EINVAL, and Settings → Local agents finds CLIs installed outside the default PATH and confirms when a sign-in command is copied. (#1033, #1036, #1057, #1083, #1133, #1197)
  - Local agent fixes for Claude Code startup, Codex thread parameters and MCP tool approvals, Cursor ACP flags, and ACP team tool approvals. (#1061, #1069, #1089, #1132, #1134, #1144, #1145, #1159, #1169, #1177)
  - Browser plugin tools such as browser_exec start in the desktop app; they failed with "Cannot find package 'playwright'". (#1034, #1037)
  - IM connection fixes for WeChat QR login and expired sessions, Feishu, WeCom, and initial connection retries on Telegram, QQ, DingTalk and Feishu. (#1023, #1026, #1080, #1092, #1096, #1097, #1119, #1123, #1124, #1153)
  - Reloading the plugin while a Bot is working keeps its running turn and restores team tools (#976, #1143); a turn that hits the output limit mid-tool-call or mid-sentence continues instead of stopping or leaking raw tool tags (#960, #1046, #1104, #1109); and a group's goal panel stays reachable after the group moves to a fresh part (#909, #1048).
  - A show_view card closed from the dock keeps its answered or dismissed state (#1154, #1155); multiple approval cards in a batch stay open until each is decided (#619, #1181); and Copy on a folded code block inside an attached file card copies the full block (#718, #1183).
