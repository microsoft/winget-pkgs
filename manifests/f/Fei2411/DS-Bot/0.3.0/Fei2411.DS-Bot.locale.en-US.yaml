ReleaseNotes: |-
  Added
  - Bots can use the apps on your computer, as far as you allow: turn it on in Settings → Computer use, give each Bot a level and its apps, and take over or hand back at any time. (#917, #918)
  - Talk to your Bots from WeChat, Feishu, DingTalk, WeCom, QQ, Telegram, Discord and Slack, with pairing, group chats, approval cards and replies (Settings → IM). (#904, #910, #967)
  - Connectors: connect services from a catalog with one sign-in, add your own or import them from other apps, connect QQ Mail, 163, Gmail and other mailboxes, and choose which Bots use each connector. (#905, #906)
  - A local agent CLI (Devin CLI, Claude Code, Codex CLI, OpenCode, Cursor, Gemini, Grok, Cline, Qwen Code, Goose or a custom ACP agent) can run a Bot with the CLI's own sign-in and models, and the Bot works with the rest of the team. (#916, #920, #1000)
  - Local agent Bots show each command they run and what an approval is for, and carry their agent's logo. (#1009)
  - The model menu keeps a stepped thinking-level slider at its bottom while you scroll through models. (#898)
  Changed
  - DS Bot tracks DeepSeek Harness 0.2.2-rc.1. (#908)
  - Question, view and skill proposal cards stay in the chat after you answer, dismiss or approve them, folded to a short line with the result. (#971, #972, #981)
  - browser_exec scripts run in a separate process without access to the host or the network, and a script past its 20-second limit is stopped. (#1005)
  - Models on a custom OpenAI-compatible gateway get system instructions as system, and take the known context window and image support of their model. (#982, #989)
  - The IM settings page is redesigned: setup steps for each platform, pairing requests on top, and a detail view for each IM bot. (#1006)
  - Bots no longer start Agent Teams teammates that you cannot see or stop; they do the work themselves or hand it to another Bot. (#973, #996)
  - Classic Agent mode is only in Settings → General → Mode; the entry in the bottom-left menu is gone. (#933)
  - The start window and the app's own cards use the same rounded buttons as the team view. (#886)
  Fixed
  - Bots in a group chat see images sent to the group and can read their saved copy, as in private chats. (#955, #956)
  - A Bot's messages to another Bot no longer appear in your queued-message bar as if you had typed them. (#663, #1001)
  - When a Bot in a group stops because its model call failed, the group keeps a line that says so and how to go on. (#974, #1010)
  - A Bot no longer stops answering after you open one of its earlier sessions, and a current session that DSH archived is taken back out of the archive. (#1008)
  - With DeepSeek Harness 0.2.2, Bot replies no longer fail with "Cannot read properties of undefined (reading 'filter')", and scheduled tasks keep working when a Bot's chat goes on in a fresh part. (#908)
  - Switching a Bot to another model no longer fails with context compaction failed when the conversation is too large for the new model or the old model is out of quota. (#965)
  - Stopping a group's work or deleting a Bot no longer fails with cannot get property "subagents", and the other members stop even when one does not. (#930)
  - Importing a team or moving the data no longer fails on .asar files, which are copied whole, and a download no longer overwrites an existing .asar file. (#894, #896)
  - On Linux, the import checks whether the chats were written by a newer DSH before it copies them. (#897)
  - At startup the whale again leaps out and lands on the Main Bot's avatar, and the close button of a new chat lines up with the list below it. (#885, #895)
  - Conversations and the message box stay visible when a narrow host collapses its sidebars. (#844)
  - After an update, DS Bot offers a newer release in the same check. (#914)
  - Docker profiles keep their bundled DS Bot archive for later dependency installs, also on the old archive path. (#879)
