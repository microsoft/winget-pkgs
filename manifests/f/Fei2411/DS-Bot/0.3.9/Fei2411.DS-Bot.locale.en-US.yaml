ReleaseNotes: |-
  Added
  - Asynchronous Bot work and background tasks: slow shell commands continue in the background after a configurable wait (Settings → General → Background work); Bots can spawn and manage forked background tasks (task_start, task_send, task_stop, task_list) in direct and group chats; sending a new message while a Bot is busy moves the current work into the background so the foreground stays responsive; desktop Dynamic Island, a Tasks tab with a read-only task reader, and a mobile task bar show live progress and let you stop tasks. (#783, #1655, #1887, #1892, #1902, #1936, #1944)
  - DeepSeek official services: auto web search tries DeepSeek's Search API on the asking route's origin while keeping source summaries; read_document reads PDF, Word, PowerPoint, and image documents; dictation and reply read-aloud support DeepSeek speech recognition and text-to-speech — each opt-in under Settings → DeepSeek services. (by @klarkxy; #1577, #1879, #1880, #1881)
  - Web remote: control your Bot team from any browser over the encrypted relay link (Settings → Phone → Open in a browser). (#1779)
  - Scheduled task pause and resume: pause and resume individual scheduled tasks from Settings, a Bot's settings, or the phone app, with optimistic concurrency checks and automatic retargeting onto the chat's current part. (#1910, #1931)
  - Browser profile login import: import logins directly from more desktop browsers and non-Default profiles without extensions, with macOS direct decryption, Windows Chrome/Edge remote-debugging guidance, localStorage seeding, site filtering, persistent session logins, paste/cURL import, and auto-reload. (#1856)
  - Opt-in local MCP access: Settings → MCP access lets other agents on the same computer (Claude Desktop, Cursor, Codex, etc.) message your Bots and read their replies with per-client tokens. (#1919)
  - Custom MCP server OAuth and client setup guide: custom remote MCP servers can sign in with OAuth (Sign in), and connectors that require your own app client show an in-place redirect URL guide with copy and settings links. (by @alexopenfan-xiaxin and @Aaronliu2016; #1138, #1139, #1774, #1594, #1885)
  - Built-in DS Bot manual and bug reporting: Bots carry an up-to-date DS Bot manual to explain and configure supported settings, and can draft a GitHub bug report for you to review and submit via an approval card. (#1941, #1942, #1948)
  - Model menu search and Bot terminal tabs: filter models by name, ID, or provider in the Bot model menu; terminals started by a Bot open as tabs in the right column when supported by DSH. (by @Gyl1219 and @CYC7b; #1029, #1826, #1854)
  - Phone app additions: add and open the DSH Agent from the Android + menu (including Stop while running), set or reset a group chat's working folder on mobile, swipe right from the left half of a chat to open the Bot list, and press Android Back once to open the sidebar before minimizing. (#1415, #1924, #1805, #1844, #1788, #1923, #1692, #1758)
  - IM outbound images and WeChat quotes: Bots can upload and send local Markdown reply images across IM platforms, receive images and files from QQ, DingTalk, and WeChat, carry quoted WeChat messages into the Bot, and deliver QQ voice messages via ASR transcription. (by @srafyhucl-cpu and @lhy-dcf; #1761, #1868, #1090, #1862, #1303, #1306, #1824, #1827)
  - Group chat controls: surface member tool and computer-use approvals in the top island, and offer New session for an idle group member in group details. (#1623, #1860, #1716, #1771)
  Changed
  - Bot memory tool names: renamed remember, forget, and recall to bot_remember, bot_forget, and bot_recall to avoid collisions with other plugins' memory tools; local agent Bots can also answer memory calls with their own CLI without an API model. (#1561, #1752, #1593, #1811)
  - Performance across startup, chat, search, Usage, and phone transfers: skip offscreen message bodies so typing stays smooth in long LaTeX chats; stop replaying every group Session on startup; lazy-load MCP OAuth and WeCom WebSocket packages; add a SQLite rollup table for Usage and indexed reads/lowercase caches for chat & group search; read phone attachment chunks by range; read avatar library pages and import workspace sizes in parallel batches; share one scroll listener across long-reply guides and cache capability/memory recall lookups. (by @anthonyhann; #1812, #1829, #1666, #1736, #1679, #1921, #1912, #1947, #1851, #1852, #1780, #1781, #1782, #1783, #1949, #1952, #1954)
  - Unsent drafts stay with their chat: unsent text, images, and files are preserved when switching Bots or starting a new session. (#1248, #1909)
  - Translations: added 102 missing host error translations across non-English locales and tied generated Traditional Chinese supplements to their plugin namespace owners. (#1650, #1875, #1906)
  Fixed
  - Windows, Linux, macOS & browser rendering: restored sharp ClearType text on Windows in both the desktop app and plugin by removing backdrop blur; restored Ctrl+0 / Ctrl+= / Ctrl+- zoom shortcuts on Windows and Linux; kept the desktop window draggable when the side panel is open; fixed the Linux app icon at registered hicolor sizes; revived ended Windows cua-driver computer-use sessions; fixed General settings menu placement in Firefox and start.ps1 -DataRoot binding. (by @ahmed20005; #1375, #1925, #1945, #1876, #1571, #1708, #1809, #1810, #1821, #1922, #1815, #1870, #1557, #1706)
  - Frontend layout, theming, and mobile web: kept open dropdown lists readable in dark themes; fixed mobile chat layout, narrow-sidebar round buttons, iPhone Safari chat visibility, opaque native mobile conversation headers, touch bubble width, collapsed plugin settings pages, duplicate plugin settings icons, @ trigger menu surface fill, / menu description alignment, send button hover tint, provider model badge wrapping, Usage range badge sliding, DSH 0.2.2-rc.3 960px chat column width, collapsed-sidebar Agent row alignment, transient reconnect flashes, pending learning approval reachability, and layout, reduced-motion, keyboard/IME, voice transcription, and accessibility polish. (by @AdamPlatin123, @zealotCE, @shadow-of-light123, and @QINXIN111; #1874, #1772, #1776, #845, #1846, #1669, #1678, #1372, #1738, #1359, #1756, #1726, #1740, #1698, #1884, #935, #1839, #901, #1878, #1546, #1742, #1547, #1710, #1830, #1859, #963, #1150, #1790, #1686, #1834, #1882)
  - Android group history: keep earlier group messages reachable after a conversation rolls over to a new session without restarting the app. (#1926)
  - IM reliability and formatting: kept a turn's IM origin across redelivered events and mixed-source messages; stopped background job/subagent results from leaking into another IM chat sharing the same Bot or group Session; fixed Feishu schema 2.0 cards, rich-text/media inbound, and open_id @ checks; treated QQ 2xx error bodies as failures and retried only undelivered chunks; fixed Discord channel titles and Markdown preservation on edits, Slack bold formatting, Telegram escaped code-fence splitting, GFM tables without outer pipes, and <br> table rows. (by @lhy-dcf; #1869, #1886, #1904, #1908, #1920, #1953, #1658, #1680, #1850, #1866, #1871, #1803, #1930, #1799, #1798, #1804, #1801)
  - Local agents & CLI compatibility: recognized macOS Antigravity Keychain sign-in, CodeBuddy Code session sign-in, Qoder CN CLI names (qoderclicn/qodercn), and standalone pi.exe on Windows; showed the context window reported by the CLI (1M for Antigravity) instead of the 200K fallback; preserved qoder/* plugin model refs across restarts; filtered excluded host env vars case-insensitively; preserved upstream error codes/details and fixed toLlmError crashes; skipped duplicate local-agent route IDs cleanly; ran local agents on the displayed preset; fixed ACP/Claude ask disposal and ClaudeEngine.steer block arrays. (by @lhy-dcf and @vb2250158; #1853, #1835, #1861, #1849, #1864, #1795, #1820, #1823, #1828, #1890, #1897, #1234, #1806, #1865, #1777, #1778, #1390, #1737, #1707, #1681, #1759)
  - Groups, sessions, tools & reliability: deduplicated repeated group status lines, closing echoes, "started on it" rows, and delivery failure notices; blocked a member's group tasks on failure/stop; routed report_back replies to the caller's thread; stopped group goals from resetting idle check budgets; picked image-capable routes for group Sessions so vision members aren't misled by OCR fallback; restored legacy compressed group replies and pre-ledger lines; hid internal delegated-work continuation turns; moved stuck parts on after proxy size errors (413) and kept New session model-free; fitted model-switch checkpoints into smaller context windows and kept post-compaction room-making active; retried MALFORMED_RESPONSE and Bot team tool registration; refused silently ignored schedule_edit everySeconds updates; guarded Bot deletion against group races; kept DSH Agent forks in their source Agent; allowed Full-access Bots to set working folders outside the workspace; kept Windows dot-directories and #/? filenames working in file links; prevented failed Bot browser form posts or crashed tabs from stopping DS Bot. (by @klarkxy, @tungloong, @IFT8, and @lhy-dcf; #1627, #1628, #1624, #1709, #1319, #1682, #1663, #1741, #1652, #1330, #1651, #1857, #1858, #852, #1841, #1258, #1757, #1739, #1751, #1716, #1753, #1822, #1863, #1409, #1766, #1188, #1754, #1042, #1755, #1641, #1749, #1789, #1432, #1433, #1308, #1410, #1690, #1712, #1714, #1813)
