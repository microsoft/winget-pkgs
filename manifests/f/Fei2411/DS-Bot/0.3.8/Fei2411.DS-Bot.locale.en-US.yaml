ReleaseNotes: |-
  Added
  - Local agent Bots add support for Antigravity (agy) and 24 more coding CLIs with automatic stdio MCP bridging, per-engine cwd isolation, reasoning-level restore, PATH directory filtering, and CLI sign-in detection in Settings → Local agents. (#1073, #1407, #1439, #1463, #1539, #1619)
  - Start a second live conversation part for a Bot while its earlier part is still working, and let a local agent Bot's own CLI and model act as its context steward for compacting or handing off to a fresh part. (#1501, #1548, #1593, #1595, #1607)
  - Global Interface motion setting (Full, Reduced, Off) in Settings → General → Appearance, independent of per-Bot avatar animation. (#1582)
  - Group chat collaboration tools: a task board showing what each member registered, a shared group to-do list, message search from the group header, per-member changed-file rows that open inline diff reviews, and verification marks when a reply claims unchecked work. (#326, #327, #977, #1323, #1324, #1325, #1441, #1446, #1484, #1488)
  - Bot details panel improvements: edit a Bot's label and instructions inline, keep the thinking-level slider accessible while picking a model, view live run-stats, and browse Session history for any Bot. (#1111, #1320, #1322, #1344, #1346, #1349)
  - Optional passphrase encryption at rest for stored Secrets (Settings → Secrets), and manual refresh of the model list on saved custom model providers (Settings → Models). (#968, #1467, #1480, #1537)
  - Phone app: save Bot-delivered files to the device via chunked transfer over the encrypted phone link, plus unsigned iOS simulator/TestFlight build support in CI. (#1443, #1448, #1487, #1576, #1581)
  - Gateway @Remote compatibility (dsBot/call and dsBot/feed), Relay Server per-address hourly bandwidth caps, and ds-bot doctor to inspect or clean up stale profile pins. (#1429, #1449, #1477, #1532, #1583)
  - Selecting text in a Bot or group chat shows Quote text and Annotate; an annotation is sent to the Bot together with the quoted text. (Builds on @klarkxy's #1371; #1367, #1649)
  - A Bot chat or group chat / menu shows DS Bot's own commands, and DSH slash commands no longer run there. (#810, #1541)
  - The desktop app sends a system notification when a Bot finishes or a card waits for you while the window is behind other apps; the notification does not take focus, and clicking it opens that conversation. (#1504, #1535)
  - QQ replies are sent as Markdown messages (by @Menghuan1918), WeCom receives voice transcripts, files and video (by @johnhom1024), and the desktop import reads DSH's YAML profile patches (by @inchTodd). (#1244, #1597, #1424, #1425, #1555, #1186, #1193)
  - A long Bot reply shows a small reading pill under the header while you are inside it: a button back to the start of the reply and the title of the section you are in, with a menu of the reply's headings. (by @AdamPlatin123; #1562, #1563)
  Changed
  - Polish Settings spacing, controls and Liquid Glass surfaces, explain missing fields before adding a custom provider, keep long composer pastes folded cleanly as cards, and keep user bubble text readable over translucent glass skins. (#256, #1077, #1326, #1332, #1393, #1437, #1491)
  - Cap context check thresholds below long-context prefix-cache cliffs, cut idle polling churn when the window is inactive, and stop re-parsing Markdown across all messages on every roster update. (#337, #1253, #1347, #1462, #1486)
  - Complete ja, ko, es, fr, and de translations for host error messages, allow seconds in scheduled times, and point Bots at office_render when inspecting PDF files. (#1221, #1255, #1499, #1524, #1598)
  - Bot avatar and shimmer animations pause while the window is hidden, after 30 seconds without input, and for rows scrolled out of view, which cuts the idle CPU and GPU load of a busy team. (#1462, #1647)
  - Settled show_view and ask_user cards expand to show the full read-only view or every option, and fold back without a jump. (#1629)
  - The menus above the Bot composer have an opaque background. (by @GeJin0425; #1113, #1114)
  Fixed
  - Android phone app: fix sidebar/drawer crash on MagicOS 11 / Android 17 and shrinking Release APK (~58 MB), fix Settings → Connectors crash, display per-Bot capability status instead of Unknown, render remote https Markdown images with cleaner soft-break spacing, sync "Waiting for you" badges with settled cards, and persist seen timestamps per computer across restarts. (#1498, #1504, #1514, #1518, #1523, #1529, #1533, #1534, #1586, #1588, #1599, #1614)
  - Local agents & connectors: reopen a local agent CLI when its Bot permission preset changes, fall back to the team/profile default model for memory summaries, isolate failed CLI probes so the host keeps running, follow configured HTTP proxy and static client fallback for connector OAuth/tool calls, skip unnecessary connector masks, and refresh Computer use tool masks on mount/save. (#1222, #1403, #1412, #1426, #1452, #1479, #1485, #1503, #1528, #1530, #1531, #1570, #1615)
  - IM reliability: route replies strictly to the originating IM chat/turn, retain failed sends across stops/retries for manual retry, forward Telegram videos and report >20 MB limits instead of dropping silently, serialize DingTalk msgParam cleanly, strip stray boundary blank lines, and end WeChat long polling cleanly on quit while releasing the team lock. (#1419, #1450, #1451, #1459, #1473, #1475, #1481, #1483, #1584, #1603, #1611, #1613)
  - Groups, turns & model calls: queue messages arriving as a group round closes, keep upstream-refused Bot replies in chat, show failed background children to the group, isolate Bot sessions created during another Bot's turn, distinguish content-audit 403 errors from auth failures, respect configured output budgets and cutoff room during recovery, and explain model-switch compaction failures with recovery actions. (#973, #1140, #1148, #1196, #1296, #1329, #1333, #1337, #1460, #1461, #1472, #1478, #1549, #1573, #1601)
  - Interface, host shell & browser: restore native text quoting in Bot chats, quote group messages into the active part, capture delayed browser downloads within their originating action, keep the activity row ordered cleanly, keep Settings and Classic toggle reachable when the host fails to load, hide collapsed section rows and duplicate shell sidebar toggles, fix narrow-window phone rail overlap and message toolbar placement, fix Bot logo orbit when switching details/browser, and keep team lock/skill proposal cards clean. (#1084, #1254, #1288, #1301, #1304, #1328, #1339, #1343, #1345, #1350, #1357, #1360, #1365, #1382, #1391, #1430, #1434, #1458, #1476, #1489, #1545)
  - Android: the app installs on OEM devices that refused it (the build is pinned to compileSdkVersion 36), asks for the notification permission, reconnects faster after the phone returns to the foreground, scrolls wide Markdown tables sideways, and shows connector cards and OAuth or key sign-in on the phone. (#1540, #1559, #1635, #1538, #1631, #1497, #1542, #1591, #1592, #1636)
  - DSH Desktop: switching to Bot mode no longer makes the chat area shake from side to side. (#1618, #1630)
  - Long user messages fold again on newer DSH releases, and the settings button opens settings when another entry held the settings seat or DSH's own settings shell is on. (by @GeJin0425 and @EventHorizonXT; #1616, #1617, #1355, #1356, #1245, #1252)
  - A Bot name with a space in a user bubble stays one mention, a produced file named in a reply's inline code opens its preview, and the avatar rail no longer covers the chat in a narrow window. (by @GeJin0425, @inchTodd and @zealotCE; #1354, #1281, #1084, #1454)
  - Connectors: tool schemas reach the model without the keywords KIMI rejected, a hand-entered OAuth client keeps its secret, and </DSML …> closing tags no longer show in assistant text. (#1508, #1521, #1594, #1517, #1522)
  - IM: Feishu refreshes its token before downloading an inbound image, reads the image's real type, and recovers a half-open connection (also DingTalk); typing and group attachments reach the right chat and Session; adding or updating a connection says why it failed. (by @EventHorizonXT, @vuuihc, @lhy-dcf; #1520, #1566, #1307, #1311, #1158, #1637, #1121, #1160, #1120, #1166)
  - A group falls back when its default model is retired instead of failing with UNKNOWN_MODEL. (by @GeJin0425; #1310, #1353)
  - Local agents: image attachments reach the CLI, a context hand-off or compaction that is cancelled leaves nothing behind, and a second caller waits for the CLI's initialize handshake instead of using an unready process. (#1422, #1632, #1593, #1643, #1222, #1558)
  - After a desktop shell restart, a Bot's shell receives its secrets again, and a second part of a Bot's chat keeps its routing across deferred turns. (#670, #1639, #1638)
  - A failed in-app update in DSH Desktop no longer makes DS Bot disappear from the sidebar: when removing the old bundle fails after the profile changed, the update selects the bundle again, or installs the running version again. (#1625, #1672)
