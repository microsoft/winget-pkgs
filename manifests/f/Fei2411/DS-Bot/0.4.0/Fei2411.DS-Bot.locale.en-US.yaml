ReleaseNotes: |-
  Added
  - DS Bot desktop frontend & custom appearance: desktop app now runs on DS Bot's own frontend with a pure-host dsbot-engine (full parity for message rendering, secrets, file references, syntax/math highlighting, tool & approval cards, composer/classic mode, narrow layout, file-tree watch, Excel preview, and reconnect feed resume), adds the Fei theme (with bundled serif for Bot replies), 2-color theme derivation, VS Code theme import, and CSSOM-sanitized user stylesheets. (#2260, #2214, #2298, #2328, #2330, #2332, #2333, #2335, #2375)
  - Unified Inbox: one view for pending approvals, unanswered questions, and unread items across all Bots and group chats. (#2307, #2369)
  - Redesigned 3D Bot avatars & live motion (desktop and phone): 20-character 4×5 avatar picker (including aquatic characters), 3D character motion models showing what a Bot is doing at a glance, synced onto mobile Bot marks with aligned states and badges. (by @klarkxy; #1787, #2168, #2230, #2305, #2281, #2370)
  - Bot Plugins & security tiers: Bot plugin runtime, registry catalog, redesigned Plugins panel with a hot-swappable Browser Control slot, plus a 4-tier execution model, consent fingerprints, env governance, and kill-list. (#2102, #2106, #2146, #2304)
  - Auto Review permission mode: optional review model inspects pending browser, folder, privacy, and external CLI approvals with structured evidence. (by @klarkxy; #1302, #1934, #1935)
  - Unified External API & CLI: local External API with Streamable HTTP MCP, CLI access, and an OpenAI-compatible endpoint. (#2016)
  - Customizable keyboard shortcuts: configure keyboard shortcuts across desktop and plugin views. (#2274, #2326)
  - In-app What's New dialog: offline release-notes dialog shown once after upgrading and replayable anytime from Settings → About DS Bot, plus concise pre-update highlights in desktop update prompts. (#2341, #2342)
  - Sign in with ChatGPT & same-CLI account profiles: sign in with a ChatGPT account under OpenAI settings, and configure multiple account profiles for the same local coding CLI with exact UTF-8 handoff budgets. (#2045, #2056, #2063, #2189)
  - Multiple folders, group avatars & per-Bot Agent presets: grant Bots and group chats access to multiple folders at once; customize group avatars on desktop, mobile, and via group tools; select an Agent preset per Bot. (by @alexopenfan-xiaxin and @klarkxy; #1298, #2084, #2085, #2086, #2088, #2091, #1055)
  - Secrets 1Password (op://), one-time handles & multiline support: reference 1Password items via op://, deliver secrets via one-time handles or 0600 files, store multiline secret values, and pass authorized Bot secrets to Codex CLI. (#2188, #2166, #2201)
  - Opt-in Code Mode executor: hybrid run_code + compact SDK tool executor for programmatic multi-tool workflows. (#1818)
  - Phone app additions: Android in-app auto-update and native notifications, full Android Usage dashboard, inline show_view cards in chat, optional Enter-to-send, draft preservation across Bot switches, empty-state team search, and DS Bot PWA branding. (by @atian25 and @klarkxy; #2101, #2118, #2124, #2017, #2115, #2116, #992, #2371)
  - Browser cookie import, auto-update toggle & privacy-first telemetry: macOS Safari and batch cookie import UI in Browser settings, an automatic updates toggle in About settings, and opt-in privacy-first anonymous telemetry with fail-closed offline private sessions. (#2134, #2269, #2149, #2272, #2310, #2340)
  - Bundled maintenance & plugin-dev guides: built-in self-maintenance and plugin development skills and reference guides. (by @klarkxy; #1654)
  Changed
  - Bot-to-Bot Call & Return & message coordination: refactored Bot-to-Bot communication to a Call & Return lifecycle backed by a SQLite coordination ledger, separating group requests, results, and non-waking messages, with group report-back and explicit foreground handoff. (#2109, #2125, #2130, #2139, #2180, #2236, #2271)
  - Context runtime & KV-cache stability: unified ContextRuntime and context rebuilder with epoch deduplication, tool-output recall, cache-safe pruning, and local-agent side-chat isolation; pinned DSH 0.2.2-rc.5. (#1993, #2136, #2141, #2275, #2286, #2287)
  - Performance, CPU & memory footprint: eliminated Electron, client, and host CPU/heat hotspots, memory leaks, and zombie processes; slimmed state.json by externalizing segment notes; memoized streaming Markdown blocks via WeakMap; accelerated cold startup, workspace listing, session import, and sidebar collapse/expand; replaced Reanimated shimmer with native Animated.loop on mobile. (by @AdamPlatin123; #1989, #2155, #2156, #2157, #2174, #2175, #2176, #2177, #2267, #2283, #2302, #2350)
  - Remote & memory security boundaries: enforced team-boundary isolation for paired devices and Gateway Remote, fenced memory review transcripts against untrusted turns, and updated repository/update feeds to Fei-Craft/DS-Bot. (#2198, #2199, #2276, #2296, #2331)
  Fixed
  - Durability, restarts & state safety: atomic fsync state saves prevent losing Bots/groups after power loss; corrupt locations.json falls back to defaults; queued saves merge safely; held inputs, interrupted question-card drafts, superseded cards, steered multi-messages, and foreground handoffs survive retries and restarts without dropping work; deleted or gone Sessions and removed providers recover cleanly. (by @GeJin0425, @AdamPlatin123, and @lhy-dcf; #1981, #2002, #2003, #2004, #2037, #2100, #2135, #2144, #2158, #2207, #2216, #2229, #2242, #2245, #2262, #2309, #2318, #2345)
  - Groups, memory & UI polish: showed member-presented files under group messages, fixed group_relay handle prefixes, second group mentions, folded group rounds, memory scope isolation and timeout diagnostics, sidebar 0px collapse/drag and approval indicators, narrow segmented controls, mobile avatar badge overlap, and macOS setTypeOfService / console EPIPE errors. (by @AdamPlatin123, @GeJin0425, and @weiquyun123; #1074, #2029, #2053, #2138, #2142, #2143, #2165, #2221, #2225, #2241, #2246, #2273, #2297, #2334, #2349)
  - IM platforms & connectors: added request timeouts for IM adapters, fixed Slack 3000-character section splitting, Telegram Markdown tables/headings, QQ outbound images, DingTalk real group titles, Gmail OAuth refresh/attachments, and code-point/astral-character chunking for WeChat and IM excerpts. (by @AdamPlatin123, @lhy-dcf, and @liuwf2012; #1927, #1928, #1980, #2067, #2071, #2209, #2224, #2258, #2290, #2292)
  - Local agents & models: hardened CLI sign-in probes and Antigravity model catalog discovery, surfaced stalled ACP turns, reconnected Codex team tools on resume, preserved remote routes for CLI-named providers, fixed Windows Cursor .cmd shims, unwrapped DSH session-title JSON payloads, detected Qoder CN sign-in, and retried Gemini MALFORMED_RESPONSE stops. (by @stphliyz-lgtm and @CoinkWang; #2052, #2057, #2061, #2122, #2160, #2208, #2220, #2222, #2223, #2264, #2282, #2284, #2285, #2289, #2327)
