ShortDescription: A macOS-style notch for Windows that shows live OpenCode session activity, approvals and context usage.
Description: OpenCode Notch keeps your OpenCode sessions visible at the top edge of the screen. A small pill shows whether each agent is running, waiting for you or finished; hovering expands a panel with live activity, context usage, permission approvals, interactive forms, quick replies and a session center with project grouping, search, rename, archive and opening a project in the OpenCode TUI. It is a standalone Electron app that talks to the local OpenCode service directly, so no plugins or project config are required.
