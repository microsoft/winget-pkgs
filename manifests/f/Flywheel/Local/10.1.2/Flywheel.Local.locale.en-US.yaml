ReleaseNotes: |-
  Features
  - Added a ‘Download Local logs’ item to the app menu help section. This generates a zip archive that bundles all logs into a single file for easier sharing with support or troubleshooting.
  - Use the “Open Site” and “WP Admin” buttons with your preferred browser: “Appearance & behavior” → “Default apps” now displays all browsers installed on your system, instead of just a fixed list. This change also introduces browser selection on Linux for the first time.
  - Windows can now optionally close Local to the system tray by enabling “System Tray” from preferences in Appearance & behavior (defaults to off).
  - You can now disable direnv from Advanced Preferences if it conflicts with your developer environment.

  Fixes
  - Windows users will no longer encounter site creation failures when their user account or site credentials contain special characters.
  - Slowness on Windows has been resolved for new sites using MariaDB 10.11.18, ensuring consistent performance across database types.
  - Fixed an issue on Windows that could cause “missing MariaDB” and “unable to swap services” errors when starting sites running versions of MariaDB older than 10.11.18.
  - Local will now use MySQL 8.4.0+2 as the preferred version to fix an issue with sites failing to start on Linux.
  - Fixed “missing Mailpit” issues caused by sites running older versions of Mailpit, or macOS users migrating Local from Intel to Apple Silicon.
  - Improved accessibility of radio buttons to make them selectable via keyboard.

  Updates
  - The MariaDB version has been upgraded to 10.11.18 and set as the default (Windows only).
