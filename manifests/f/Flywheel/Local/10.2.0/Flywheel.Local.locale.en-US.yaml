ReleaseNotes: |-
  Features
  - Local’s localwp command line interface (CLI) is here! Enable it at Preferences → Advanced → Install Local CLI. You and your AI agent can use Local from the command line to start, stop and make new sites or run WP-CLI commands. Learn more in the Local CLI help docs.

  Fixes
  - The “new site” pages have better keyboard control and accessibility. (Advance by pressing enter, for example.)
  - One-click admin and “Open Site” now work on sites with HTTPS enabled.
  - Local no longer shows site certificates as “Trusted” after a domain name change.
  - Linux: Local’s install profile no longer conflicts with AppArmor’s ‘local’ folder, which could prevent upgrades.

  Updates
  - Updated Electron from 42.2.0 to 42.9.2, Node to 24.18.1.
