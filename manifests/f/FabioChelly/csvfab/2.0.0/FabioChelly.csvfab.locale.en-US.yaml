ShortDescription: Desktop CSV editor — open, filter, clean and rewrite large CSV files in place.
Description: |-
  csvfab edits CSV files in place, as one native program with nothing else to install: tabs, fast filters,
  column profile and value filters, sort, dedupe, split and merge columns, find & replace with regex,
  series fill, copy and paste with Excel, undo, encodings (UTF-8, Windows-1252, ISO-8859-1/15,
  Mac Roman, UTF-16) and export to Excel. A timestamped .bak copy is kept before the first overwrite.
