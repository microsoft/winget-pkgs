ShortDescription: A calm Windows desktop for Claude Code – every session at a glance, approvals from PC or phone.
Description: |-
  VibeDesk is a full-screen Windows workspace built around the real Claude Code CLI.
  Run several Claude Code sessions side by side, see which one is working, waiting for you or done,
  answer permission requests with one click on your PC or your phone, and give each project a memory
  that Claude maintains through MCP. Rain on the window, lofi radio and a focus timer included.
  Requires your own Claude plan (Pro/Max) or an API key. Not affiliated with Anthropic.
