ShortDescription: Free local video compressor that finds heavy videos and shrinks them several times with no visible quality loss.
Description: |-
  Framewring finds the videos that take the most space on your drives, shows how much each one wastes,
  and compresses them several times smaller with no visible loss of quality. Originals are never touched
  unless you choose to replace them, and then only after full verification, with the original going to
  the Windows Recycle Bin.
  It runs FFmpeg on an Nvidia, AMD or Intel GPU (NVENC / AMF / Quick Sync, AV1 or H.265) or on the CPU
  (x265, SVT-AV1), and can test a short piece first and report the final size and quality (VMAF).
  Everything is local: your files never leave your computer. The interface is available in English,
  Russian, German, French, Spanish, Portuguese and Simplified Chinese.
