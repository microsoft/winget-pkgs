ShortDescription: 'Бесплатный локальный видеокомпрессор: находит тяжёлые видео и сжимает их в разы без заметной потери качества.'
Description: |-
  Framewring (в русском интерфейсе — «Жмых») находит видео, которые занимают больше всего места на дисках,
  показывает, сколько места тратит каждое, и сжимает их в несколько раз без заметной потери качества.
  Оригиналы не трогаются, пока вы сами не выберете замену: она выполняется только после полной проверки,
  а оригинал уходит в корзину Windows.
  Работает на FFmpeg: видеокарты Nvidia, AMD и Intel (NVENC / AMF / Quick Sync, AV1 или H.265) или процессор
  (x265, SVT-AV1); умеет сначала сжать короткий фрагмент и показать итоговый размер и качество (VMAF).
  Всё происходит на вашем компьютере: файлы никуда не отправляются. Интерфейс: английский, русский, немецкий,
  французский, испанский, португальский и китайский (упрощённый).
