ShortDescription: Free, open-source AI video upscaler and enhancer that runs on your own GPU.
Description: |-
  FrameScale AI upscales video to 4K, removes noise, restores faces and converts video to 60 fps with AI, entirely on your own GPU.
  No account, no uploads, no watermark.
  Models: Real-ESRGAN (upscaling), NAFNet and Real-CUGAN (denoising), CodeFormer (face restoration, optional download), RIFE (frame interpolation), BWDIF (deinterlacing).
  Preview 2 seconds of the real result before rendering; keeps HDR10/HLG, audio, subtitles and chapters; exports HEVC 10-bit, AV1 and H.264.
  Works with NVIDIA, AMD and Intel GPUs through Vulkan.
