ShortDescription: Fast, lightweight disk space analyzer with a CLI.
Description: |-
  Bulk shows what's using your disk space. It reads the NTFS master file table directly, so a
  drive with 1-2 million files scans in about 5 seconds, then stays up to date live through the
  NTFS change journal. It has treemap and sunburst charts, search across every drive, a duplicate
  finder, cleanup suggestions, a view of what changed since an earlier snapshot, and a bulk
  command-line tool.
