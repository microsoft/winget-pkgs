ShortDescription: Easily create step-by-step guides and documentation of any process.
Description: |-
  Folge is a desktop tool to capture steps with every click of the mouse, customize screenshots, create annotations, and generate the final guide in HTML, Word Document, PDF, PowerPoint slides, and more.
  Main Features are:
  - Take screenshots of apps, any selected region, windows or fullscreen. Pause, adjust, and resume. Screenshots with every mouse click or keypress.
  - Give each step a name and description. Reorder them, hide them, and add new ones on the fly. Organize guides in projects.
  - Exports guides to HTML, PDF, DOC, PPT, JSON, Markdown files ready to share with others. And more formats to come.
Tags:
- guide
ReleaseNotes: |-
  🎁 New Features
  - Video Export (beta) – Turn a guide into an MP4 video without recording or editing anything. It zooms in on your clicks and shows the step titles as captions. Landscape or vertical, up to 4K, with a captions file for YouTube or your LMS.
  - Find and Replace – Press Cmd+F (Mac) or Ctrl+F (Windows) to find a word across the whole guide and replace it in one go.
  - Crop to an Aspect Ratio – Lock the crop to 16:9, 4:3, 1:1 and more, on one step or all of them.
  - Favorite Export Formats – Star the formats you use and they stay at the top of the export screen.
  - Right-Clicks – Folge now captures right-clicks and titles those steps "Right-click".
  ⭐ Improvements
  - More accurate step titles, including menu paths like "File > Export > PDF".
  - Capturing the active window: a click on the taskbar, Dock or another window now captures the whole screen instead of the wrong window.
  - In the SCORM preview, you now see that only the first few steps are included.
  🔧 Bug Fixes
  - The watermark was too big on steps with focused view.
  - Minor fixes and improvements.
