ReleaseNotes: |-
  ⭐ Improvements
  - Confluence export: pages use the guide title as the page name, and the space picker remembers your last used space.
  - Confluence export: "Test connection" now really checks your API token.
  🔧 Bug Fixes
  - Create Guide button did not work on computers set to the new British Columbia or Alberta time zones.
  - Open Guide: steps could get duplicated when a shared guide was edited from different computers.
  - Taking a second simple screenshot could leave the capture overlay stuck on screen.
  - Confluence export: all team spaces are now listed, and you can search spaces by name.
  - Imported images are added in the correct order.
  - Minor fixes and improvements.
