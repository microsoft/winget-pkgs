ShortDescription: Easily create step-by-step guides and documentation of any process.
Description: |-
  Folge is a desktop tool to capture steps with every click of the mouse, customize screenshots, create annotations, and generate the final guide in HTML, Word Document, PDF, PowerPoint slides, and more.
  Main Features are:
  - Take screenshots of apps, any selected region, windows or fullscreen. Pause, adjust, and resume. Screenshots with every mouse click or keypress.
  - Give each step a name and description. Reorder them, hide them, and add new ones on the fly. Organize guides in projects.
  - Exports guides to HTML, PDF, DOC, PPT, JSON, Markdown files ready to share with others. And more formats to come.
Tags:
- guide
ReleaseNotes: |-
  🎁 New Features
  - AI Step Descriptions – Let AI write step descriptions for you, based on the step's screenshot and its context. Generate a description for a single step right from the editor, or fill in the whole guide in one go. Works with your own AI provider key (OpenAI, Claude, OpenRouter, or a custom endpoint), and screenshots are only ever sent to the provider you configure.
  - Apply One Font to All – Change the font of every text element in your Word, PDF, and PowerPoint export settings with a single click.
  ⭐ Improvements
  - Completely redesigned PowerPoint export with branded cover and agenda slides, cleaner step layouts, slide numbers, and more.
  - Capturing is now noticeably faster.
  - Automated Annotations: a new "Guide Language" option in Settings > Capturing writes pre-filled step titles in the language you choose, independently of the app language.
  - Logos in Word export headers and footers are now sharper, larger, and vertically centered.
  - The step description editor custom toolbar is now available in your language.
  - Better capture support for multi-monitor setups.
  🔧 Bug Fixes
  - Export settings color pickers no longer get cut off by the window.
  - The Word cover page editor now warns about unsaved changes before closing.
  - The PDF cover page editor adds new blocks at the bottom of the list, like the Word editor, and shows block names in your app language.
  - Notion export no longer fails for guides with inline images inside step descriptions.
  - Adding a table in the Word cover page editor no longer sends the next added block into the table's first cell.
  - Fixed layout issues in two-column PDF exports.
  - Other minor fixes and improvements.
