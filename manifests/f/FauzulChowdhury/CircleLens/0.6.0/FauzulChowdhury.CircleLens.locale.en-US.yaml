ShortDescription: A free screen magnifier that opens where you're looking. Draw a circle twice with the mouse, and a magnifying lens follows your pointer.
Description: |-
  Circle Lens is a lightweight screen magnifier for Windows. Draw a circle twice with the mouse, or tap Shift twice, and a round magnifying lens opens at the pointer and follows it, in every app.
  Ctrl + plus or minus (or Ctrl + mouse wheel) changes the zoom. Move fast and it zooms out a little so you can see where you are going, then back in as you slow down.
  Settings live in its tray icon: how many circles open it, zoom, lens size, the shortcut, and starting with Windows. It installs per user without administrator rights, uses about 13 MB of memory while waiting, and keeps itself up to date from its GitHub releases unless you turn that off.
