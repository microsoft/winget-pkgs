ShortDescription: 'A desktop front end for winget: update, install, uninstall, pin and export packages.'
Description: |-
  A Windows desktop front end for winget. Everything happens in one table with checkboxes:
  update what has a newer version, install something new by searching as you type, list and
  uninstall what is already there, pin what must not be touched, and export or import the whole
  package list to rebuild a machine.

  Light and dark theme, no telemetry, a single executable with nothing to install. Requires
  administrator rights, which it asks for at startup.
Moniker: wingetstudio
Tags:
- gui
- package-manager
- packages
- winget
ReleaseNotes: |-
  A winget failure is no longer shown as an empty list: when winget itself fails, the Updates,
  Installed and Install tabs show its reason instead of "No updates available", "No installed
  package found" or "No package matches", and a search where the Microsoft Store does not
  answer says so.

  Pins made from the app are now blocking pins, so winget refuses to upgrade the package even
  when asked for it by name. Import reads package lists whose file name contains [ or ], and
  refuses a list with no packages before the confirmation.
ReleaseNotesUrl: https://github.com/FedeB2160/WinGetStudio/releases/tag/v1.10.2
