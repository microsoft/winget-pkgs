ShortDescription: 'A desktop front end for winget: update, install, uninstall, pin and export packages.'
Description: |-
  A Windows desktop front end for winget. Everything happens in one table with checkboxes:
  update what has a newer version, install something new by searching as you type, list and
  uninstall what is already there, pin what must not be touched, and export or import the whole
  package list to rebuild a machine.

  Light and dark theme, no telemetry. Installs for all users with a Start menu entry and
  uninstalls from Windows Settings. Requires administrator rights, which it asks for at startup.
Moniker: wingetstudio
Tags:
- gui
- package-manager
- packages
- winget
ReleaseNotes: |-
  If winget is missing, WinGet Studio now offers to install it, and Settings shows the App
  Installer version, with an update button where the Microsoft Store does not update it.
  Per-user programs that winget refused to uninstall from an elevated app are now retried
  without elevation. Every message and confirmation follows the light or dark theme. The
  automatic update check at startup works again.
ReleaseNotesUrl: https://github.com/FedeB2160/WinGetStudio/releases/tag/v1.12.0
