ReleaseNotes: |-
  A new icon: a cardboard package with a command prompt stamped on its side and a download
  badge, drawn for every size Windows uses so it stays sharp in the title bar, the taskbar and
  Explorer. When WinGet Studio itself shows up in the Updates list, the log now points to the
  Settings tab to update it.
