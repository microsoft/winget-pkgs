ShortDescription: 让开机自启动项按设定延时逐个启动，不挤在一起抢资源
Description: |-
  DelayStart 接管你选定的自启动项，在登录后按每个条目设定的延时依次启动，
  避免十几个程序同时抢占磁盘与 CPU 造成登录后长时间卡顿。支持注册表 Run 键、
  启动文件夹、计划任务与 UWP 应用四类来源，可给条目设置调度周期
  （每天 / 工作日 / 法定节假日等），并记录每次调度结果。
