ShortDescription: Launch Windows startup items on a schedule, one at a time, instead of all at once
Description: |-
  DelayStart takes over the startup items you select and launches them one by one after
  login, each after its configured delay, so a dozen programs don't all fight for disk and
  CPU at once and leave you staring at a frozen desktop. It supports four sources - registry
  Run keys, the Startup folder, scheduled tasks, and UWP apps - lets you set a schedule per
  item (daily / weekdays / public holidays, etc.), and logs the result of every run.
