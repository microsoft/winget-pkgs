ShortDescription: Read-only data recovery for corrupted Firebird 2.5-5.0 databases, without the Firebird engine.
Description: |-
  fbrescue reads Firebird database files (.fdb) directly, without the Firebird server, and exports
  every table to CSV, SQL or JSON Lines. It gets data out of damaged databases that gbak cannot back
  up, and out of intact ones when no Firebird is installed. It never modifies the database file.
