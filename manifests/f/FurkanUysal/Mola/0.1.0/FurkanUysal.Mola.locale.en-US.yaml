ShortDescription: Water and stand-up reminder for Windows.
Description: |-
  Mola is a small tray app that reminds you to drink water and to get up from your desk.
  It resets the sitting timer automatically when you step away from the keyboard and mouse,
  limits how many times you can snooze, and stays quiet during calls and fullscreen apps.
  Available in English and Turkish.
