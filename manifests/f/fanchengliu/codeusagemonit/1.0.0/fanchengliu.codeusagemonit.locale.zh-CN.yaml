ShortDescription: Windows 的 AI 编程额度与用量监控。
Description: codeusagemonit 把 Codex、Claude、Cursor 等 11 款 AI 编程工具的剩余额度、重置时间、Token 用量和输出速度，统一放在 Windows 托盘的一个小窗口里。它读取各工具的本机会话记录，按小时、按模型统计 Token、请求数和输出速度，并用官方 API 单价估算费用；走中转站的用量可归到具体站点按时间段对比。它是原生 C# / WPF 程序，另附命令行工具 codeusage。
