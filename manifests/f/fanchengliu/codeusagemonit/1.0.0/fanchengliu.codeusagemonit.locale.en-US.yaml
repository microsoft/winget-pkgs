ShortDescription: AI coding quota and usage monitoring for Windows.
Description: codeusagemonit puts the remaining quota, reset times, token usage, and output speed of 11 AI coding tools such as Codex, Claude, and Cursor into one small Windows tray window. It reads each tool's local session records to track tokens, requests, and output speed per hour and per model, estimates cost from official API pricing, and groups relay-based usage by site for period comparisons. It is a native C# / WPF application with a codeusage command-line tool.
