ShortDescription: A modern Windows front end for robocopy. Copy, mirror or move large folders, stop anytime and resume later.
Description: |-
  RoboUI is a Fluent-style desktop app for robocopy, the file copy tool built into Windows.
  Robocopy does all the copying; RoboUI builds the command, shows live progress (files, data,
  speed and time left) and keeps a history of your runs.
  It offers Copy, Mirror and Move modes, a test run that shows what would be copied or deleted
  without changing anything, and stop/resume for large jobs: stop a copy, shut down the PC and
  continue the next day.
