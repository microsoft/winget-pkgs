ReleaseNotes: |-
  Summary
  FreeTube v0.26.0 introduces several notable improvements. Live stream playback is working again, although seeking is still unavailable (see issue #9044). New in-player subtitle appearance settings allow users to customize various aspects of subtitles, such as size, position, and color. The playback speed menu has also been updated with a slider and several preset speeds, similar to YouTube's interface.
  The update also includes numerous bug fixes, performance improvements, security enhancements, and general UI refinements.
  Note
  Due to the upgrade to Electron v44.0.0, macOS 12 (Monterey) and ARMv7l builds are no longer supported. macOS 13 (Ventura) or later is now required to run FreeTube, and ARMv7l builds will no longer be provided.
