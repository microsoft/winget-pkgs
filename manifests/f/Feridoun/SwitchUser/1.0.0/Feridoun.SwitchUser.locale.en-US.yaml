ShortDescription: Instantly switch between signed-in Windows users with a hotkey, tray-icon click or picker, without a password prompt.
Description: |-
  SwitchUser replaces the Start > account picture > Switch user > pick a tile sequence with a single step. Press Ctrl+Alt+U to switch to the other signed-in user, Ctrl+Alt+Shift+U to pick one, or left-click the tray icon to switch and right-click it to pick. A small SYSTEM service brings the other user's already signed-in session to the screen with no password prompt, so you land straight on their desktop. After installing the package, run "switch-user install" once to register the service. Intended for a single-owner PC where every account is yours.
