ShortDescription: Instantly switch between signed-in Windows users with a hotkey, tray-icon click or picker, without a password prompt.
Description: |-
  SwitchUser replaces the Start > account picture > Switch user > pick a tile sequence with a single step. Press Ctrl+Alt+U to switch to the other signed-in user, Ctrl+Alt+Shift+U to pick one, or left-click the tray icon to switch and right-click it to pick. A small SYSTEM service brings the other user's already signed-in session to the screen with no password prompt, so you land straight on their desktop. Intended for a single-owner PC where every account is yours.
Moniker: switch-user
Tags:
- user
- switch
- session
- login
- account
- tray
- hotkey
- utility
ReleaseNotes: |-
  - A proper installer: it installs to Program Files, sets up the background service and starts the tray icon for everyone who's signed in.
  - Uninstalling removes everything: the service, the startup entry and every user's tray icon, not just the program file.
  - Setup notes that anyone at the PC can reach every signed-in account without a password, so only install it on a PC where all the accounts are yours.
ReleaseNotesUrl: https://github.com/Feridoun/SwitchUser/releases/tag/v1.1.0
