ShortDescription: An AI-native programming language and compiler toolchain with static typing, native backends, and compiler-grounded AI tooling.
Description: Fidan is an AI-native general-purpose programming language and compiler toolchain with human-readable syntax and static typing. Its Rust-based compiler exposes diagnostics, inferred types, symbol information, reads/writes, call graphs, type maps, and static execution traces to first-party AI explain/fix/improve workflows and MCP tools. AI tools can work with structured compiler knowledge alongside source text; model-assisted workflows require the optional AI helper and a configured provider. Fidan provides a MIR interpreter, selective Cranelift JIT, Cranelift AOT, and optional LLVM AOT through a separately installed toolchain. It includes native interop, concurrency, and editor tooling. Backend support varies by language feature; consult the repository documentation for current capabilities and limitations.
