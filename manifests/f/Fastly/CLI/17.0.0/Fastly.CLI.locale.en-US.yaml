ReleaseNotes: |-
  v17.0.0 (2026-10-26)

  Breaking:
  - breaking(ai-runtime-control): key create no longer accepts the --user-id flag, as it was removed from the API (#1949)
  - breaking(json): --json output for ai-runtime-control usage-metrics list, ngwaf workspace list, ngwaf rule list and ngwaf workspace rule list is now a bare array instead of an object with data and meta (#1949)

  Bug Fixes:
  - fix(ai-runtime-control): update AI Runtime Control command descriptions to reflect the latest API references (#1939)

  Enhancements:
  - feat(ngwaf): add --autoEnableNewVirtualPatches flag to ngwaf workspace create and ngwaf workspace update for Automated Virtual Patching, and show it in ngwaf workspace get (#1953)

  Dependencies:
