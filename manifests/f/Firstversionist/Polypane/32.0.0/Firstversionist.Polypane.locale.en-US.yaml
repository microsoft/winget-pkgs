ReleaseNotes: |-
  **Polypane 32**
  Polypane 32 adds a whole new way of accessing Polypane through Automation, a WebMCP panel, deeper metadata insights, and improvements across many panels and workflows. [Full release notes](https://polypane.app/blog/polypane-32-automation-webmcp-panel-speculation-rule-insights-and-chromium-160/)

  **New**

  • **New** Polypane Automation (MCP and CLI)
  • **New** Speculation rules overview in Meta panel
  • **New** Obsolete tag detection in Meta panel
  • **New** Media overview with images, videos and SVGs in Outline panel
  • **New** WebMCP testing panel
  • **New** Copy page as Markdown
  • **New** Chromium 160

  **Improved**

  • **Improved** Debug tools：horizontal overflow detection is more intelligent and accurate
  • **Improved** Debug tools：horizontal overflow button has active status
  • **Improved** Debug tools：combine reachability checks in one line
  • **Improved** Debug tools：target size now logs small elements
  • **Improved** Accessibility panel：checks all open panes
  • **Improved** Accessibility panel：lists the number of tests it runs
  • **Improved** Accessibility panel：updated list of checks
  • **Improved** Network panel：shows human-readable error messages
  • **Improved** Network panel：shows detailed timing information (Thanks Matija!)
  • **Improved** Network panel：timeline now takes Web Vitals timing into account
  • **Improved** Network panel：also shows failed requests without response
  • **Improved** Console panel：error stacks now filter out internal frames and node_modules
  • **Improved** Console panel：detect links and make them clickable
  • **Improved** Console panel：grouped HTML elements are now faster and more accurate
  • **Improved** Elements panel：improve handling of nested media queries
  • **Improved** Elements panel：filtering styles now also filters font and keyframe declarations
  • **Improved** Elements panel：debug tab shows element's box-sizing
  • **Improved** Elements panel：syntax highlight styles
  • **Improved** Elements panel：strikethrough inactive clamp, min, max, minmax and if function items
  • **Improved** Elements panel：allow reordering tabs (Thanks Eric!)
  • **Improved** Elements panel：go to definition for custom properties in style() functions
  • **Improved** Elements panel：hover `random()` now shows the actual value
  • **Improved** Elements panel：`random()` values can now be set explicitly or reseeded
  • **Improved** Meta panel：smarter canonical URL comparison logic
  • **Improved** Meta panel：validation of color-scheme, JSON-LD and resource hints
  • **Improved** Meta panel：JSON-LD overview now lets you inspect raw JSON too
  • **Improved** Meta panel：updated styling for webmanifest
  • **Improved** Meta panel：support XML oEmbed info and highlight differences
  • **Improved** Meta panel：validate webmanifest for installability errors (Thanks Walther!)
  • **Improved** Meta panel：badge styling updates
  • **Improved** Browse panel：add a share/QR button
  • **Improved** Recording：shows a warning for zoomed-out panes
  • **Improved** Screenshots：save all viewports now uses stored folder (Thanks Eric!)
  • **Improved** Outline panel：focus order overlay supports shadow DOM internals and handles sticky better
  • **Improved** Outline panel：better checking for broken links with no HEAD support (e.g. Facebook URLs)
  • **Improved** Outline panel：warnings now take into account that other elements are hidden
  • **Improved** Outline panel：visual and accessibility name comparison now ignores whitespace
  • **Improved** Projects：add tab layout is now remembered per project (Thanks John!)
  • **Improved** Syncing：custom attribute to prevent or force syncing (Thanks Benoit!)
  • **Improved** Address bar：more consistent behavior while handling panes with loading web content
  • **Improved** Address bar：support data URLs containing spaces (Thanks Luke!)
  • **Improved** Address bar：prevent input when navigation sync is off for a tab
  • **Improved** Color picker：now gives more accurate color suggestions for low contrast combinations in APCA
  • **Improved** Image editor：remembers last used tools and colors (Thanks Eric!)
  • **Improved** Snippets panel：expand editor to full height option (Thanks Scarlett!)
  • **Improved** Snippets panel：closing edited unsaved snippets now prompts for confirmation
  • **Improved** Entra support on Windows, Mac and Linux

  **Removed**

  • **Removed** Elements panel：remove 'open in Chrome DevTools' button

  **Fixes**

  • **Fix** Prevent crash when fetching links on certain pages
  • **Fix** Projects：no longer shows broken images for items without favicon
  • **Fix** Double click on tab bar maximizes app again
  • **Fix** Switching between layouts no longer focuses unnamed panes
  • **Fix** Image editor no longer shows for images that don't fit the GPU limits
  • **Fix** Playgrounds：support loading external fonts
  • **Fix** Playgrounds：the file URL popup sent the incorrect path on Windows (Thanks Benoit!)
  • **Fix** Emulation：switching to focus layout no longer forgets touch emulation (Thanks Rick!)
  • **Fix** Network panel：prevent showing NaN ms (Thanks Matija!)
  • **Fix** Network panel：stable origin ordering per tab (Thanks Matija!)
  • **Fix** Network panel：support opening in-flight requests (Thanks Matija!)
  • **Fix** Network panel：zebra striping is now stable while requests come in (Thanks Matija!)
  • **Fix** Meta panel：copy buttons for JSON-LD now work correctly
  • **Fix** Storage panel：newlines in cookies are now handled consistently with localStorage
  • **Fix** Snippets panel：toggling a snippet in a detached panel no longer reverts
  • **Fix** Snippets panel：editing an active CSS snippet automatically puts it in live preview (Thanks Scarlett!)
  • **Fix** Outline panel：fix issue with elements lacking computed styles
  • **Fix** Elements panel：now updates styling for elements when children it depends on change
  • **Fix** Elements panel：support style synchronization for blob stylesheets
  • **Fix** Overflow issue in bottom-aligned Elements panel navigator (Thanks Matija!)
  • **Fix** 'Don't sync on next click' could prevent clicks altogether
  • **Fix** Canvas layout：prevent clicking in pane popups from triggering a drag (Thanks Matija!)
  • **Fix** Web Vitals button：sometimes could not highlight INP elements
  • **Fix** Console panel：no longer shows undefined for empty log entries
  • **Fix** Detached navigation glow now sits behind guides when visible
  • **Fix** Meta panel：bug in how Mastodon cards handled domain overrides (Thanks Andrew!)
