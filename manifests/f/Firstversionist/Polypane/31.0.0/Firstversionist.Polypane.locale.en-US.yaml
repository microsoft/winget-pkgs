ReleaseNotes: |-
  **Polypane 31**
  This release has a new canvas layout that lets you freely arrange panes on an infinite canvas. The elements panel now lets you filter styles, search the DOM tree, quickly navigate to and back from custom property definitions, and a new flex item explainer that can tell you exactly how flex items are sized and positioned.

  Polypane 31 also has device presets for the latest iPhone devices, and runs on Chromium 155. [full release notes](https://polypane.app/blog/polypane-31-canvas-layout-elements-panel-improvements-and-chromium-155/)


  **New**

  • **New** Canvas layout mode
  • **New** Devices：Add new iPhone 18 Pro, iPhone 18 Pro Max, iPhone Duo and 5K device presets
  • **New** Show CPU and memory usage per pane
  • **New** Elements panel：Flex item visualisation
  • **New** Elements panel：Go to custom property definition (and back!)
  • **New** Screenshots：new "visible workspace" option
  • **New** Crash overlay and experimental features toggle
  • **New** Updated Chromium

  **Improved**

  • **Improved** Significantly smaller download size
  • **Improved** Significant performance improvements for large pages
  • **Improved** Screenshots：Support full range of text characters in overview screenshots
  • **Improved** Screenshots：Much better screenshotting for panes that are naturally larger than the window (Thanks Thomas!)
  • **Improved** Recording：Much faster processing of video
  • **Improved** Recording：Now uses the native pointer
  • **Improved** Panes：Allow zoom per pane instead of per origin
  • **Improved** Panes：Height or width constrained panes now get a lock icon with explanation (Thanks Goh!)
  • **Improved** Console panel：Improve performance for large log outputs (Thanks Adrian!)
  • **Improved** Elements panel：Scroll badges get highlighted when you scroll in panes
  • **Improved** Elements panel：Filter styles in style tab
  • **Improved** Elements panel：Search in DOM tree
  • **Improved** Meta panel：No longer recommends adding `initial-scale=1` (Thanks Declan!)
  • **Improved** Meta panel：Now shows llms.txt contents
  • **Improved** Meta panel：Smarter and less frequent fetching of well-known URLs
  • **Improved** Browse panel：Supports page zoom UI (Thanks Jay!)
  • **Improved** Browse panel：Supports extension installation confirmation message
  • **Improved** Outline panel：Explicitly choose to list or hide hidden elements in overviews (Thanks Eric!)
  • **Improved** Outline panel：Image outline updates after attribute changes
  • **Improved** Outline panel：The overlay labels are now better positioned and less intrusive
  • **Improved** Outline panel：Smarter fallback when testing URLs that don't support HEAD
  • **Improved** Outline panel：Clearer messages for URLs blocked due to Cloudflare challenges
  • **Improved** Projects：You can now copy settings from existing projects (Thanks Christian!)
  • **Improved** Address bar：Automatically clear 404 URLs from the suggestion history
  • **Improved** Address bar：Better support for different `esc` states like other browsers (Thanks Mark!)
  • **Improved** Peek：Now remains visible when hovering pseudo-elements
  • **Improved** Command bar：Can now also toggle CSP, CSRF and web security
  • **Improved** Command bar：Can now trigger all global screenshot actions
  • **Improved** Camera icon in header now opens popup instead of creating overview screenshot
  • **Improved** Removed the workspace tooltip (Thanks Mark!)
  • **Improved** Accessibility state for many buttons is now more accurate

  **Fixes**

  • **Fix** Deleting sessions used by other projects would cause internal reloads (Thanks Chris!)
  • **Fix** Screenshots：Split layout screenshots work again
  • **Fix** Browse panel：Now handles application popups better
  • **Fix** Debug tools：re-apply button did not always work
  • **Fix** Debug tools：Color blindness filters did not get applied in 30.1
  • **Fix** Portal：Injected CSS now handles nesting and media query order correctly
  • **Fix** Console：Now shows errors originating from incorrectly typed commands
  • **Fix** Elements panel：When editing before/after styles, the styles remain visible
  • **Fix** Elements panel：Scrollbar for child nodes no longer overlaps dimensions (Thanks Rick!)
  • **Fix** Outline panel：Overlays now clear when refetching data (Thanks Eric!)
  • **Fix** Relaunching the app on Mac no longer requires a full quit (Thanks Jonathan!)
