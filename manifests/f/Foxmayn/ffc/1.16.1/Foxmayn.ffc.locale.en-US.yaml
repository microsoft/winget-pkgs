ReleaseNotes: |-
  Fixed
  - Scoop installs are recognised. Scoop runs ffc from apps\ffc\current, a directory junction, and ffc could not resolve its own path through it. ffc update and ffc update --rollback failed with "resolving symlinks: The system cannot find the path specified.", and the update notice and ffc doctor named ffc update instead of scoop update ffc. They now refuse with Scoop's command, as for Homebrew and winget.
  Security
  - Built with Go 1.27.2 and golang.org/x/net v0.60.0, which fix vulnerabilities in net/http (HTTP/2), crypto/tls and net/textproto that ffc's code reaches (GO-2026-6603, GO-2026-6605, GO-2026-6607, GO-2026-6608, GO-2026-6610, GO-2026-6611, GO-2026-6612, GO-2026-6613, GO-2026-6617). Update with ffc update, brew upgrade ffc or scoop update ffc.
  Changelog
  - d8132ac chore(deps): bump Go to 1.27.2 and golang.org/x/net to v0.60.0 (#94)
  - 73b53eb ci(mcp): publish server.json to the MCP Registry (#93)
  - 5bb6683 fix(update): recognise a Scoop install run through its current junction (#92)
