ReleaseNotes: |-
  CC Switch v3.20.2
  > 这一版仍以 Codex 为主线，但形态从上一版的「一次重设计」变成「一波兼容性修复」：Grok 终于能经 xAI 原生 Responses API 在 Codex 路由下跑通——xAI 拒收的工具 schema、Codex 拒收的整数浮点、多智能体注入的邮箱消息、xAI 不认识的 Codex 角色型号，四道坎逐一拆掉；围绕它的一族「一因一果」修复：Grok OAuth 卡不再被 v3.20.1 的切换闸误拦、接管不再把 Codex 卡在登录屏、GPT-6 走 Codex OAuth 不再报「需要更新 Codex」、Claude Code 在 Codex OAuth 上恢复并行工具调用、内置图片生成走通本地路由、四个 catalog 缺陷（旧版 Codex 拒载、DeepSeek 下 MCP 工具全隐身、视觉型号被判纯文本、Kimi 工具 schema 400）关闭，智谱 GLM 预设改指官方 Responses 端点。用量侧，Codex resume 后统计停摆与代理每轮打断前缀缓存两条硬修复落地。预设阵营新增腾讯云 Token Plan、QwenCloud、AICodeWith 与两家赞助商 9527CODE、SoleAPI，定价表补入七个新模型并做了一轮九月调价。本版不含数据库迁移。
  English → | 日本語版 →
  重点内容：你现在可以
  - 在 Codex 里经 xAI 原生 Responses 跑 Grok（#6917，修复 #6815）：xAI 拒收的 Codex Desktop 工具 schema 被折叠、Grok 回传的整数浮点被改写、多智能体子任务的 agent_message 被翻译成普通消息、gpt-5.6-sol 一类角色型号被映射到你配置的 Grok 模型——子智能体不再 422，工具调用不再被拒。
  - 正常切换 Grok OAuth 卡、正常接管：v3.20.1 的无密钥安全闸误拦了代理注入令牌的 OAuth 卡；接管在直接切换删除 auth.json 之后不再把 Codex 困在登录屏。
  - 用 GPT-6 走 Codex OAuth 接管（#7132）：自报的 Codex 客户端版本升到 0.153.4，不再被 ChatGPT 后端以「需要更新 Codex」拒绝。
  - 让 Claude Code 在 Codex OAuth 上并行调用工具（#7024，修复 #5719）：parallel_tool_calls 默认改为 true，每轮不再只允许一个工具调用。
  - 在 Codex 路由下使用内置图片生成与编辑（#7036，修复 #5429、#6745）：/images/generations 与 /images/edits 两条路由经本地代理透传，用量按 token 记账。
  - 在 DeepSeek 原生预设下看到 MCP 工具（#6653，修复 #6647）：catalog 不再声明 DeepSeek 不支持的 tool_search，MCP 工具直接列出。
  - Codex 桌面端经本地代理接 Kimi/Moonshot 不再必现 400（#6863，修复 #6867）：带兄弟关键字的 $ref 只对 Moonshot 域名改写成 allOf，其他供应商的 schema 逐字节不变。
  - 让智谱 GLM 在 Codex 直连（#6957，修复 #6944）：预设改指官方 Responses 端点 /api/v1、默认 glm-5.3，存量卡需重新导入。
  - resume 之后用量继续累计（#6905，修复 #6904）：回退过的线程再 resume 时写入的双 UUID rollout 文件不再被永久搁置，积压用量自动回填到原日期。
  - 在 OpenAI 格式上游重新命中前缀缓存（#6941，修复 #6789）：Claude Code 每轮注入的中途 system 消息不再被合并到对话开头，DeepSeek、GLM、Kimi 一类端点的缓存命中率不再从 99% 掉到 20%。
  - 一键添加新供应商：腾讯云 Token Plan（六应用，#7011）、QwenCloud（七应用，#6214）、AICodeWith（八应用）、赞助商 9527CODE 与 SoleAPI（九应用）；Pi 补齐腾讯 TokenHub / Token Plan（#7159）与 PPIO（#6870）。
  - 看到 Fable 5.1 / Mythos 5.1、GPT-6 Astra、GLM-5.3、Gemini 3.8 Flash 的真实成本：此前这些请求按 $0 记账；Sonnet 5 按 Anthropic 转正口径改回 $2/$10。
  - 再次看到 Hermes 的升级按钮：最新版本改读 GitHub Releases，不再永远停在 PyPI 的 0.19.0。
  使用攻略
  - 添加供应商：新增预设的导入入口，以及「预设改动只影响新建供应商」的含义。
  - 请求路由：Grok 经 xAI 原生 Responses、Codex 图片端点透传都走这条路径。
  - 用量统计：定价表回填与 resume 积压用量的记账口径。
