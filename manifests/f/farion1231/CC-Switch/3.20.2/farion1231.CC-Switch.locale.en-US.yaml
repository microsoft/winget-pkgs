  概览
  v3.20.1 之后的开发依旧由 Codex 领衔，但这一次是一波兼容性修复而不是一次重设计。最长的一条线是 Grok：xAI 的原生 Responses API 在几处与 Codex 的假设相左——它在采样前就拒收 Codex Desktop 的工具 schema、Grok 回传的 JSON 整数带小数点而 Codex 的解析器拒收、Codex 多智能体模式注入的 agent_message 邮箱项 xAI 无法反序列化、Codex 自己的角色型号（如 gpt-5.6-sol）xAI 直接 404。本版把这四道坎在同一个原生 Responses 闸门后逐一拆掉，Grok 终于能在 Codex 路由下完整工作，包括子智能体。
  围绕它是一族「一因一果」的修复：v3.20.1 引入的无密钥安全闸误拦了代理注入令牌的 Grok OAuth 卡；直接切换删掉 auth.json 之后再开接管，Codex 会被过时的 requires_openai_auth = true 困在登录屏；GPT-6 走 Codex OAuth 接管被后端以客户端版本过旧拒绝；Claude Code 在 Codex OAuth 上被强制串行调用工具；内置图片生成在本地路由下 404；四个 catalog 缺陷——旧版 Codex 拒载 catalog、DeepSeek 预设下 MCP 工具全部隐身、DeepSeek 视觉型号被判纯文本、Kimi 工具 schema 必现 400——各自关闭；智谱 GLM 预设从 Chat 端点改指官方 Responses 端点。用量侧两条硬修复：Codex resume 之后统计静默停摆，以及代理把 Claude Code 每轮注入的中途 system 消息合并到开头、打断上游前缀缓存。
  预设库新增腾讯云 Token Plan、QwenCloud、AICodeWith 与赞助商 9527CODE、SoleAPI，Pi 补齐腾讯与 PPIO；定价表补入七个新模型行并按各厂商九月官方价页做了一轮调价。本版不改数据库 schema。
  发布日期：2026-09-07
  更新规模：52 commits | 71 files changed | +10,483 / -573 lines
  新功能
  新增预设
  腾讯云 Token Plan（六产品 × 六应用，#7011）、QwenCloud（三计划 × 七应用，#6214）、AICodeWith（八应用）与两家赞助商 9527CODE、SoleAPI（九应用）加入预设库；Pi 补齐腾讯 TokenHub / Token Plan（#7159）与 PPIO（#6870）。存量供应商不受影响；需要重新导入的情形见升级提醒。
  七个新模型的定价行
  Claude Fable 5.1 与 Mythos 5.1：$10/$50 每百万，缓存读 $0.25、缓存写 $12.50（#7051，修复 #7050）——此前没有行，这些请求一律按 $0 入账，因为前缀规则只找更长的带日期 id、无法回落到 claude-fable-5；GLM-5.3：$1.40/$4.40，缓存读 $0.26，与 Z.ai 官方价一致（#6591）；GLM-5.3 Flash：$0.15/$0.50，缓存读 $0.03（#7163）；GPT-6 Astra：$10/$50，缓存读 $1、缓存写 $12.50，low/medium/high/xhigh 后缀回落到基础行（#7162）；Gemini 3.8 Flash：$0.75/$3.75，缓存读 $0.075，无缓存写费（#7164）；Qwen3.8 Flash：$0.15/$0.47，1M 窗口内不分档，缓存读/写 $0.016/$0.20。全部只是 seed 行、不改 schema；存量安装下次启动即拿到，启动时的成本回填会把这些 id 此前按 $0 记录的历史行补上价格。
  变更
  2026 年 9 月定价刷新
  Sonnet 5 改回 $2/$10——Anthropic 价页现已注明介绍价即标准价、9 月 1 日涨到 $3/$15 的计划不再执行——并带一条守卫修复：仍是 seed 值 3/15/0.30/3.75 的安装被纠正，用户自定义过的行不动（#7051）。GPT-5.6 Sol、裸名 gpt-5.6 及其五个档位后缀行同步从 $5/$30（缓存读 $0.50、写 $6.25）降到促销价 $4/$20（缓存读 $0.40、写 $5），至少持续到 2026-11-21。Gemini 3.6 Flash 从 $1.50/$7.50/$0.15 降到与 3.8 Flash 相同的介绍价 $0.75/$3.75/$0.075，至 2026-12-31。MiniMax M2、M2.1、M2.5 统一为官方按量价 $0.30/$1.20，缓存读 $0.03、缓存写 $0.375——后者此前记为零。每项调价都是 seed 加一条按旧值守卫的修复条目，追加在既有链条之后，老数据库会逐级经过中间价位。
  修复
  Grok 经 xAI 原生 Responses API 在 Codex 路由下跑通
  一组贡献者提交关闭了原生 Responses 通往 xAI 路径上四个互相独立的故障。xAI 在采样前就拒收 Codex Desktop 的内置工具 schema，于是请求路径上折叠根级 oneOf/anyOf 函数参数（#6815），各分支的 required 取交集而不是并集，压平后的 oneOf 不会强求所选分支没有的字段。Grok 回传的 JSON 整数带小数点，Codex 的解析器拒收为整数，于是已完成 function_call 参数里的整数浮点被改写（恰好 2^64 现在直接拒绝而不是静默改写差一）。Codex 多智能体模式注入的 agent_message 邮箱项 xAI 无法反序列化，每个子任务在任何工具运行前就 422，于是这些项被改写成普通 user 消息、加密内容压平为文本。xAI 对 Codex 的角色型号（如 gpt-5.6-sol）直接 404，于是未知的请求模型被映射到供应商配置的模型（catalog 里的 grok-4.5 一类与任何 grok 前缀 id 原样放行），且映射先于清洗执行，落到 grok-4.5 上的子智能体也会被剥掉不支持的采样字段。全部逻辑收在一个原生 Responses 闸门后的独立模块里，便于在上游覆盖同样场景之前 rebase 或 cherry-pick。grok-4.5 的 xAI 预设现在声明 low/medium/high/xhigh：2026-08-30 实测该端点接受这四档、对 max 报 HTTP 400，而 Codex 不会把目录外的档位夹回范围。（#6917）
  切换到 Grok OAuth 的 Codex 卡不再被拒绝
  v3.20.1 的 config-only 切换重构把无密钥安全闸推广到所有写入路径，误伤了代理托管的 OAuth 卡（xAI Grok OAuth）：它们本来就无密钥——本地代理逐请求注入真实令牌——但预设快照继承了 0.149 之前模板的 requires_openai_auth = true，安全闸把它当作「会回落到官方登录」而拒绝切换。修的是快照而不是给闸门开例外：对代理注入的 OAuth 供应商（xAI OAuth 与 GitHub Copilot；Codex OAuth 刻意排除，官方登录就是它的凭据）在活跃自定义表上把该标志强制为 false，挂在共享的有效供应商构建器里，预检、普通写入与代理备份/接管投影看到同一形状，Codex 0.149 无需读 auth.json 即判定为未鉴权。预设源头现在就输出 false，存量卡在下一次切换时自愈。
  接管不再把 Codex 困在登录屏
  「非接管切换时保留官方登录」关闭（默认）时，直接切换到第三方供应商会删除 ~/.codex/auth.json；此后再开启代理接管，config.toml 从存量卡重建，而卡上仍带 0.149 之前的 requires_openai_auth = true，于是 Codex ≥ 0.149 即使已有代理占位 bearer token 也停在登录屏——接管中执行 codex logout 后热切换也踩同一个坑。接管写入器现在按 Codex 自己会观察到的登录状态戳记活跃自定义表的标志，与直接切换的计划对齐：先按 Codex 的规则解析鉴权模式（显式 auth_mode 优先，其次个人访问令牌、Bedrock API 密钥、Bedrock 访问密钥、OPENAI_API_KEY、ChatGPT）再核对凭据，紧邻过期 API 密钥的 Bedrock 凭据永远不会被抬举为 OpenAI 登录；先判定凭据存储再碰 auth.json——keyring 与 auto 存储无法从磁盘判定、保留卡上原值，ephemeral 存储一律视为未登录，只有 file 存储才读文件，文件缺失、不可读或损坏都视为未登录且不再让接管写入失败。代理注入的 OAuth 卡无论磁盘上是什么都保持中和后的 false；官方透传与托管官方分支不动。
  重复的托管 ChatGPT 账号会被拒绝
  普通托管账号登录若 ChatGPT workspace 与 稳定用户身份（id_token 的 subject）同时匹配已有账号，会以本地化提示拒绝而不是新建第二行。检查在存储锁内执行，并发完成的登录无法漏进重复；刷新锁现在只在定向重鉴权时获取，被拒的添加不会留下锁条目。同一 workspace 的不同用户仍可并存。（#7061）
  GPT-6 走 Codex OAuth 接管不再被拒为「需要更新 Codex」
  Claude 转 Codex OAuth 路由上的 gpt-6-astra 请求自报 Codex 0.144.1，低于该模型 0.153.0 的最低客户端版本，ChatGPT 后端回 HTTP 400。自报版本升为 0.153.4，originator 与版本常量在生成与模型发现之间共享——后者此前发的是 cc-switch 自己的包版本与 originator。（#7132，关联 #7129）
  Claude Code 在 Codex OAuth 上恢复并行工具调用
  来自 Anthropic 的请求没有显式给值时，Codex OAuth 请求把 parallel_tool_calls 默认为 false，迫使 Claude Code 每轮只能调用一个工具。默认改为 true（与 codex-rs 一致），Anthropic 的 tool_choice.disable_parallel_tool_use 映射为 Responses 侧的反值，显式串行仍被保留。接力自 #5722。（#7024，修复 #5719）
  Codex 内置图片生成在路由下可用
  Codex 的 ImageGen 工具调用旧版 OpenAI Images API，而本地代理只注册了 Responses、Chat Completions、Compact 与 Alpha Search 路由，/v1/images/generations 返回空 404。generations 的别名（裸路径、/v1、/v1/v1、/codex/v1）现在作为与 Alpha Search 共用的 Codex 独立透传转发，Alpha Search 的完整 URL 改写被泛化为从完整的 Responses/Compact/Chat URL 推导兄弟 Images URL（已有 Images URL 原样保留，不透明的完整 URL 关闭失败），响应里的输入/输出 token 经 Codex 用量解析器记账。后续一笔补上 /images/edits——ImageGen 一旦引用已有图片（显式路径或最近生成的 N 张）就切换到它，此前仍打到空路由；两条路由共享一张后缀表，把任一条配成完整 URL 的供应商都能推导出另一条。（#7036，修复 #5429、#6745）
  旧版 Codex 重新能加载 catalog
  Codex 0.144.5 到 0.148.0-alpha.15 把 supports_parallel_tool_calls 声明为 catalog 必填字段，而上游 2026-08-14 已把它从模型信息里删除——新版刷新的 models_cache.json 没有该字段，从它克隆出的 ProxyChat catalog 被同机的旧版 Codex 以「missing field」拒载。该字段加入必填回填清单、从内置 gpt-5.5 模板取值（true）；已有值绝不覆盖，新版对多余键视而不见。用真实二进制验证：旧 catalog 被 0.147.0 与 0.148.0-alpha.15 拒绝，新 catalog 在两者与 0.148.0 上都能加载。（#6666，修复 #6661、#6709）
  DeepSeek 原生预设下 MCP 工具重新可见
  内置的官方 catalog 为 deepseek-v4-pro 与 deepseek-v4-flash 声明了 supports_search_tool = true，而 Codex 用这个标志决定是否把 MCP 工具延迟到 tool_search 之后——DeepSeek 的 Responses API 根本不提供 tool_search，于是所有 MCP 工具被藏起来、一个都调不到。两个模型现在声明 false，Codex 直接列出 MCP 工具；托管 web search 由供应商能力门控而不是这个标志，不受影响，DeepSeek 服务端的联网搜索也照常工作。（#6653，修复 #6647）
  DeepSeek 镜像 catalog 里的视觉型号不再被判纯文本
  内置 DeepSeek catalog 里没有的型号会克隆旗舰条目、继承它的纯文本输入模态，deepseek-v4-flash-vision-exp 一类视觉型号因此失去图片输入。未匹配的型号现在与非厂商路径一样经注册表解析模态、失败即放行；用户显式设置的模态仍优先，匹配到的型号逐字保留厂商声明。另外 glm-5.3 加入已确认纯文本清单，其 [1M] 变体被识别、glm-5.3v 不受波及（#6851）。（#6750，修复 #6725）
  Codex 桌面端经本地代理接 Kimi/Moonshot 不再因工具 schema 必现 400
  Moonshot 的 Chat Completions 校验器（api.moonshot.cn、api.moonshot.ai 与 Kimi For Coding 端点 api.kimi.com）拒收带兄弟关键字的 $ref，而 Codex Desktop 的内置工具 schema 正是这种形状——经本地代理路由到 Kimi 的每一轮桌面请求都失败。解析出的上游域名是 Moonshot/Kimi 时，Responses 转 Chat 之后每个带兄弟键的 $ref 被移入 allOf、兄弟键留在原位；遍历只进入 schema 值的关键字，改写幂等。其他供应商的工具 schema 逐字节不变，Codex 转 Anthropic 路径不动——Moonshot 的 Anthropic 兼容端点接受原始形状。（#6863，修复 #6867）
  智谱 GLM 的 Codex 预设改指官方 Responses 端点
  智谱每个站点文档写明三个 Base URL——Anthropic /api/anthropic、Chat /api/coding/paas/v4、Responses /api/v1——并警告用错端点无法消耗 Coding Plan 额度；Codex 直连说的是 Responses，而 400 unknown variant custom 正来自 Chat 端点那个严格的旧网关。「Zhipu GLM」与「Zhipu GLM (en)」预设改为 /api/v1 上的原生 Responses（shell 命令式编辑、不发 freeform apply_patch），并镜像官方模型列表：glm-5.3（1M 窗口，low/high/max，默认 max），国内站另有 glm-5-turbo；glm-5.2 与 none 档被删。一条域名回退让「保存时还是 Chat 格式、但 Base URL 已是原生 Responses」的行无需重存即拿到 Responses catalog（Chat 端点路径排除在外）；厂商域名按 DNS 标签边界匹配，z.ai 不再误捕 xyz.ai；bigmodel.cn、z.ai 与 glm 前缀加入 Codex 托管 web search 的拒绝清单。（#6957，修复 #6944）
