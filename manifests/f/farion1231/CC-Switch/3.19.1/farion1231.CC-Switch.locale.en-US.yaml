ReleaseNotes: |-
  CC Switch v3.19.1
  > 这一版的主线是把上一版的尾巴收干净：三家国产 Codex 网关经确认原生支持 Responses API，不用再开本地路由接管——DeepSeek 与火山方舟 Coding Plan 的预设从走本地路由改为直连，新加入的腾讯混元 TokenHub 一上来就是直连；四个能在日常里撞上的故障被修掉——Claude Desktop 用量自 v3.18.0 起被算了两遍（升级后历史数字会自动回正，但有 30 天窗口，见「升级提醒」）、切回官方 Codex 会卡在 401 且看不到登录界面、从设置页升级 Grok Build 只报一句 os error 2、Grok Build 开启接管后直接 404。另有 8 个此前一直按 $0 记账的模型补上内置定价，39 个界面文案的语言问题被修正。本版没有数据库迁移，并且是本项目第一个删除量超过新增量的版本。
  English → | 日本語版 →
  重点内容：你现在可以
  - 让 DeepSeek、火山方舟 Coding Plan、腾讯混元在 Codex 里直连：三家的官方 Codex 文档都已确认端点原生提供 Responses API。DeepSeek 与火山方舟 Coding Plan 的既有预设从 Chat 格式改为原生格式，供应商卡片上的「需要路由」标记与切换时的提示随之消失，请求不再经过本地代理的协议转换；腾讯混元 TokenHub 是本版新增的预设，从一开始就是原生格式。注意 DeepSeek V4 Pro 暂时还不能直连——厂商侧尚未开通它的 Codex 集成，直连请用 V4 Flash（预设默认），详见升级提醒。
  - 让 DeepSeek 用上 DeepSeek 自己发布的模型目录：新的「官方厂商目录镜像」机制把厂商公布的 models.json 原样下发给该厂商自己的端点，freeform apply_patch 与配套的 GPT-5 提示词框架成套保留，不再被压成中性模板。判定只认域名、不认模型名——同一个模型在聚合站上未必实现同样的能力。
  - 拿到正确的 Claude Desktop 用量数字：自 v3.18.0 起，经本地网关的 Claude Desktop 流量在看板里被记了两遍——一遍来自代理、一遍来自会话日志导入，token、费用与请求数约翻倍。本版修好后，明细行还在的日子会自动回到正确数字，不需要重建。
  - 切回官方 Codex 之后能正常登录：此前从第三方供应商切回内置的官方 Codex 条目时，第三方的 key 会留在 ~/.codex/auth.json 里，Codex 拿着它去请求官方端点，稳定 401——又因为文件存在，它不会退回自己的登录界面，在应用里没有出路。
  - 从设置页把 Grok Build 升上去：grok update 自 0.2.112 起改为内部调用 npm 完成分发，而图形界面启动的应用看不到 node，升级只会报一句 Error: No such file or directory (os error 2)。
  - 给 Grok Build 开启接管而不是撞上 404：API 格式被手动改成 OpenAI Chat 或 Anthropic 的 Grok Build 供应商，开启接管后请求会打到一个代理没有注册的路由上，直接 404，且没有故障转移、没有用量记录。同时，Grok Build 的每次请求此前都被当成新会话，缓存键注入与按会话聚合都失效了。
  - 看到 8 个此前一直按 $0 记账的模型的真实成本：gpt-5.3-codex-spark、gemini-3.5-flash-lite、kimi-k2.7-code-highspeed、glm-5-turbo、glm-5v-turbo、qwen3.6-flash，以及不带日期后缀的 claude-opus-4-6 / claude-sonnet-4-6。
  - 在繁体中文界面里看懂「关于」页的工具管理：30 个只补了简中 / 英文 / 日文的文案漏了繁体中文，因为 i18next 会静默回落英文，这块面板自 v3.16.0 起一直是半英文的。另有 9 个文案在所有语言下都显示简体中文。
  - 在官方订阅与 DeepSeek 之间来回切，而不是二选一：auth.json 与 config.toml 都是单槽文件，Codex 自己存不下第二份凭据。厂商的一键脚本会把这份配置改造成自己专用的，而 CC Switch 是按供应商整段快照与还原——这也是它和官方脚本最实际的区别，详见下文对照。
  使用攻略
  本版的改动集中在 Codex 的连接方式与用量统计口径上，建议结合以下文档了解：
  - 本地路由：哪些供应商需要开启接管、接管做了什么。本版之后 DeepSeek、火山方舟 Coding Plan 与腾讯混元都不再需要它。
  - 用量统计：用量看板的数据来源与统计口径，理解 Claude Desktop 双算是怎么发生的、修复后为什么部分历史日期无法回正。
  - 在 Codex 中用 DeepSeek 这类 Chat 格式 API：这篇攻略讲的是本地路由如何把 Responses 转换成 Chat Completions，已针对本版更新。开头新增了一节判定：用预设新建的 DeepSeek 走直连不需要路由，但升级前保存的供应商、以及要用 deepseek-v4-pro 时仍然需要；机制部分对 Kimi、智谱 GLM、SiliconFlow 等仍是 Chat 形态的供应商完全适用。
