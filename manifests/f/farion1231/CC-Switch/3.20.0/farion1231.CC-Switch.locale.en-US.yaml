ReleaseNotes: |-
  CC Switch v3.20.0
  > 这一版由三条结构性主线撑起：Pi 成为第九个受管应用——供应商、提示词、Skills、会话浏览与用量统计一站接入；Codex 支持多个 ChatGPT 账号——认证中心随便登几个，每张官方卡各绑各的，切换永不串账；Claude Code 内置 WebSearch 在 GPT 路由下终于可用。紧急修复也有一条：v3.19.2 在 WSL 路径上已有配置无法更新或切换，受影响用户请直接升级本版。同一批 Windows 修复还包括版本检测大修（五个 issue 一次修）、启动闪屏与 MSI 注册表垃圾键。本版包含数据库迁移（v16 → v17），升级前自动备份，降级需还原备份。
  English → | 日本語版 →
  重点内容：你现在可以
  - 用 CC Switch 管理 Pi：第九个受管应用（#6064）。供应商表单是针对 Pi 原生 schema 的结构化编辑器，内置 58 个预设与 57 个模型的能力目录；提示词库、SYSTEM.md / APPEND_SYSTEM.md 编辑器、斜杠命令模板、Skills、会话浏览与安装升级一并接入。Pi 自己的登录、默认供应商与默认模型永远不被触碰。首启会导入 models.json 里已有的供应商，见升级提醒。
  - 在看板里看到 Pi 的会话用量：逐模型的 token、成本、错误与中断轮次，独立的「Pi (Session)」来源与应用筛选；增量同步只解析文件新增部分（#6463）。
  - 添加 Codex 官方供应商时直接选择已授权的 ChatGPT 账号：认证中心登录任意多个账号，新建官方卡时下拉直选其一完成绑定；也可以照旧添加一张不绑定的空官方卡，跟随 Codex CLI 本地登录、读取本地的 access token。切换到绑定卡会写入该账号完整的令牌包——裸 codex CLI 也以该账号运行、且能自行续期。接管下的请求会校验账号一致性，绝不静默把账单记到另一个账号头上（#3879、#6535）。
  - 在 GPT 路由下使用 Claude Code 的内置 WebSearch：搜索在上游执行、结果带引用返回、次数进用量；Codex 新客户端的 Alpha Search 端点也不再 404（#5681）。
  - 从 v3.19.2 的 WSL 故障中脱困：v3.19.2 在 \\wsl.localhost 路径上无法更新或切换已有配置（#6188），该版本内无任何绕过手段——请直接升级本版，并且 CI 从此在真实 WSL2 文件系统上跑测试（#6233）。
  - 让 Windows 版本检测和你的终端看到的一致：检测改为合并注册表 PATH（用户+机器）、扫描独立安装器目录、优先探测 PATH 默认项——应用内自更新后「未安装」、winget 装的 Claude Code 找不到、旧 npm shim 遮住新版本，五个 issue 一网打尽（#6284）。
  - 给每个模型声明它真实支持的思考档位：Codex 模型目录支持逐模型多选八个标准档位并指定默认值，各家预设按厂商文档预填了真实档位（#6228）。
  - 信任你的备份：SQL 备份逐值保真往返、截断文件导入前即被拒绝（#6146）；备份文件原子发布、恢复先在暂存库整体校验、.db 恢复会把各应用 live 配置一并重建，所有同步/恢复路径严格串行（#6147）。
  - 在几百个模型里直接搜：所有应用的模型下拉都换成了可输入过滤的组合框，按模型 id 和厂商名都能匹配（#6285）。
  - 启动不再白/黑闪屏：主题在页面绘制前同步应用，Windows 上窗口加载完成前保持隐藏（#6252）。
  使用攻略
  本版改动集中在供应商管理与用量统计上，建议结合以下文档了解：
  - 添加供应商：Pi 与新预设的入口。
  - 用量统计：Pi 会话用量的来源与口径，以及 DeepSeek 调价对读数的影响。
  - 请求路由：WebSearch 桥接生效的路由场景。
  Warning
  唯一官方渠道声明（请务必阅读）
  CC Switch 是完全免费、开源的桌面应用，不会向用户收取任何费用。请仅通过下列官方渠道获取本软件：
