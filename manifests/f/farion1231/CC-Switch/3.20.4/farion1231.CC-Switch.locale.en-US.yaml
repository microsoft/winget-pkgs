ReleaseNotes: |-
  CC Switch v3.20.4
  > 这一版以修复为主，另有一项新接入：MiniMax Code 成为第十个受管应用，供应商、MCP、Skills、提示词、会话浏览与用量统计一并接入，默认模型、登录和会话删除仍由 MiniMax Code 自己管。修复主要集中在经本地代理使用 Codex 的场景，四个会让 Codex 用不下去的问题在本版关闭：Codex 0.154 起放进 additional_tools 的工具让严格的 Chat 网关直接 400；一张 detail: "original" 的截图让整段会话此后每轮都 400；编辑或切走部分 Codex 供应商会悄悄清空已保存的 API Key；绑定到已删除 ChatGPT 账号的卡片既切不走，也改不了绑定。Claude Code 这边，GitHub Copilot 下的 auto mode 恢复可用，/effort 的 xhigh、max 与 Grok 4.6 的推理强度都按所选档位发送。Claude Desktop 的第三方配置现在也支持 Linux。本版含数据库迁移（v18 → v19），建议升级前手动备份一次数据库，见升级提醒。
  English → | 日本語版 →
  重点内容：你现在可以
  - 用 CC Switch 管理 MiniMax Code（#7383、#7578）：第十个受管应用。供应商写进 ~/.minimax/config.yaml，与 MiniMax Code 自己的设置共存，多个供应商可以同时存在；MCP 与 ~/.minimax/mcp.json 双向同步；Skills 与 AGENTS.md 提示词库一并接入；预设来自 Pi 的预设目录，共 41 个。默认模型、登录与会话删除仍由 MiniMax Code 自己管，CC Switch 不碰。
  - 在看板里看到 MiniMax Code 的会话与用量：只读浏览会话、复制 resume 命令；用量以独立的「MiniMax Code (Session)」来源增量导入，首次同步会补齐历史。
  - 在 Linux 上给 Claude Desktop 切第三方供应商（#7331，修复 #4855）：配置路径与 macOS、Windows 一致，Flatpak 版也能用。
  - Codex 0.154 及以后版本经 Chat 网关不再 400（#7454，修复 #7451、#6158）：additional_tools 里的工具正确并入请求，不再变成一条 content: null 的 system 消息。
  - 一张截图不再毁掉整段 Codex 会话（#7476，修复 #6495、#7458）：已经坏掉的会话升级后直接恢复，不用手动改历史。
  - 编辑或切走 Codex 供应商不再清空已保存的 API Key（#7434，修复 #7433）。
  - 删掉 ChatGPT 账号后，绑着它的 Codex 卡片能重新绑定或切走（#7395，修复 #7392）。
  - 在 GitHub Copilot 下用 Claude Code 的 auto mode（#5404，修复 #5175）。
  - /effort 选哪档就发哪档（#7318、#7531，修复 #7314、#5367）：xhigh 不再被丢，映射到 Grok 4.6 的模型重新带上推理强度，GPT-5.6 与 GPT-6 Astra 的 max 不再降成 xhigh。
  - 没写描述的工具不再让整轮请求 400（#7319、#7378，修复 #7303）。
  - 在请求日志里看到每秒输出 token 数（#3369，修复 #5936）。
  - 在 OpenCode 供应商表单里搜索并批量添加模型（#7515，修复 #7423）。
  使用攻略
  - Claude Desktop：本版新增的 Linux 配置路径、Flatpak 的边界，以及更新后的支持范围表。
  - 添加供应商：Codex 原生 Responses 直连与 Chat 路由转换的区别（「仅 Chat」示例改为点名百度千帆 Coding Plan 与阶跃 Step Plan），以及「隐藏 AI 署名」开关现在写入的三个字段。
  Warning
  唯一官方渠道声明（请务必阅读）
  CC Switch 是完全免费、开源的桌面应用，不会向用户收取任何费用。请仅通过下列官方渠道获取本软件：
