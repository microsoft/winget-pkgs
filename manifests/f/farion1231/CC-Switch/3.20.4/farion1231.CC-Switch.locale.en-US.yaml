  任何向你收费、要求充值、或索取登录凭据的"CC Switch"网站或客户端均为假冒。如果你被诱导支付了费用，请立即停止操作并通过 GitHub Issues 反馈。
  概览
  MiniMax Code 是 MiniMax 的编程智能体，终端版 mcode 与桌面版共用 ~/.minimax 数据目录。CC Switch 以累加模式管理它，与 OpenCode、Hermes、Pi 相同：每个供应商是 ~/.minimax/config.yaml 中 custom_provider 下的一项，多个供应商共存，写入时保留 MiniMax Code 自己的其他设置，并遵守它的配置文件锁。MCP 与 ~/.minimax/mcp.json 双向同步，Skills 部署到 ~/.minimax/skills/，提示词库写入 ~/.minimax/AGENTS.md；会话浏览是只读的，用量从 MiniMax Code 自己的数据库增量导入。接入范围刻意收得很紧：默认模型、登录、云端功能与会话删除都留给 MiniMax Code，本地代理接管、故障转移、托盘、通用配置片段与 Profiles 也不覆盖它。（#7383、#7578）
  修复里分量最重的是经本地代理使用 Codex 的一组。Codex 0.154 起把插件、执行命名空间等额外工具放进一个 additional_tools 输入项，转换器把它当成消息，生成一条 content: null 的 system 消息，严格的 Chat 网关直接 400，里面的工具也被丢掉（#7454）。Codex 给截图标 detail: "original"，这个值只在 Responses API 里合法，被原样搬进 Chat 请求后，方舟/豆包、日日新、GLM、vLLM 一类网关对整条请求返回 400；Codex 每轮都会重放完整历史，一张图就让这个会话从此每轮失败（#7476）。另外两个是账号数据问题：自带凭据来源的 Codex 供应商在编辑保存或切走时，已保存的 API Key 被 live 里的空 auth 覆盖（#7434）；在认证中心删掉并重新登录 ChatGPT 账号后，绑着旧账号的卡片每次切换、接管和启动恢复都报「账号不存在」（#7395）。
  Claude Code 经转换的请求也有几处修正：没写描述的工具不再以 "description": null 发出（#7319、#7378）；GitHub Copilot 下 auto mode 的分类器不再因 stop 参数 400（#5404）；/effort xhigh 不再被丢，映射到 Grok 4.6 的模型重新带上推理强度，GPT-5.6 与 GPT-6 Astra 的 max 不再降成 xhigh（#7318、#7531）。其余修复覆盖 Skills 安装（skills.sh 的 id 与目录名不一致、超过 1 万个文件的仓库，#6381、#7489）、提示词读回外部修改（#7194）、WSL 上的 OMO 统一配置（#7550）、关于页的版本探测（#7346、#7348）与 Windows 任务栏（#6348）。新功能方面，Claude Desktop 第三方配置支持 Linux（#7331），请求日志显示每秒输出 token 数（#3369），OpenCode 供应商表单可以搜索并批量添加获取到的模型（#7515）。
  预设做了一轮维护：国内 Codex 预设按各家 Responses 文档对齐（Kimi For Coding 升到 K2.8 Preview、1M 窗口，DeepSeek 默认 deepseek-flash），MiniMax 国内站与百灵迁到当前官方域名，AICodeWith 的 Codex 族端点改正为 /v1，另新增几个预设。DeepSeek 在 2026-09-12 撤回了 V4 Pro 改按 V4.1 Flash 计价的公告，v3.20.3 提前执行的调价在本版改回高峰档。本版含数据库迁移：SCHEMA_VERSION 18 → 19，为 MCP 与 Skills 表加上 MiniMax Code 的启用列。
  发布日期：2026-09-22
  更新规模：46 commits | 156 files changed | +8,673 / -684 lines
  新功能
  MiniMax Code 成为第十个受管应用
  MiniMax Code（app_type 为 mcode）的终端版与桌面版共用一个数据目录，默认是 ~/.minimax，可以用 MINIMAX_DATA_DIR（或旧的 MAVIS_DATA_DIR）改到别处。（#7383、#7578）
  - 供应商：累加模式，与 OpenCode、Hermes、Pi 相同。每个供应商是 ~/.minimax/config.yaml 中 custom_provider 下的一项，卡片算不算「已添加」只看文件里有没有它的键。表单沿用 OpenCode 风格的结构化编辑器，另有 JSON 编辑器，支持 anthropic-messages、openai-completions、openai-responses 三种 API 格式；预设从 Pi 的预设目录派生，发版时共 41 个。在 MiniMax Code 里新建的自定义供应商会在列表加载时导入，在那边做的修改也会同步回来；账号类供应商（kind 不是 custom 的）既不导入也不覆盖。写入时保留 config.yaml 里其他所有键，遵守 MiniMax Code 自己的 config.yaml.lock 目录锁（超过 10 秒的锁会被回收，否则保存失败并提示重试），原生文件写入失败时数据库改动回滚。在 config.yaml 里删掉某个供应商后，它的卡片会立即刷新为未添加，可以再次添加（#7578）。
  - 默认模型归 MiniMax Code 管：CC Switch 从不写 defaultModel / defaultLightModel。某个供应商或模型正被这两项引用时，CC Switch 拒绝删除或停用它，需要先在 MiniMax Code 里换一个默认模型。
  - MCP：与 ~/.minimax/mcp.json 双向同步。编辑只替换传输字段（command、args、env、url、headers、type），timeout 这类原生选项会保留；同 id 但传输方式不同的服务器会跳过并提示，不会覆盖；全量重新同步不会删除开关关闭的条目，只有显式停用或删除才会移除。数据库提交失败时原生文件会还原。
  - Skills 与提示词：Skills 部署到 ~/.minimax/skills/，沿用 Pi 的归属检查，同名但不是 CC Switch 部署的 Skill 一律不动。提示词库把启用的提示词写进 ~/.minimax/AGENTS.md：切换前先把文件里的外部修改写回当前提示词；还没有启用任何 MiniMax Code 提示词时，文件里对不上的内容先存成一条备份提示词。停用最后一个提示词时清空文件；单个提示词上限 32 KiB（按 UTF-8 字节计）。
  - Deep link：MCP deep link 的 apps 支持 mcode；MiniMax Code 的供应商 deep link 会被拒绝。
  - 不在本版范围内：MiniMax Code 的原生登录与云端功能、本地代理接管与故障转移、托盘入口、通用配置片段、统一供应商、Profiles（MiniMax Code 页面隐藏 Profile 切换器）、单卡供应商检测、设置里的目录覆盖，以及在「设置 → 关于」里安装或升级。
  MiniMax Code 的会话与用量进入看板
  会话浏览器以只读方式打开 ~/.minimax/v2/sqlite/runtime-state.sqlite，列出 MiniMax Code 的对话（隐藏、归档、子会话以及 peek/channel/cron 会话不列），每个会话提供 resume 命令 env MINIMAX_DATA_DIR=<dir> mcode --session <id>（Windows 上是 PowerShell 写法）。会话与 MiniMax Code 的运行状态绑定，所以界面上不能删除，后端也会拒绝。
  用量从同一个数据库的 local_runtime_token_usage 表增量导入，来源为「MiniMax Code (Session)」，看板有独立的应用筛选。推理 token 计入输出；模型 id 取第一个 / 之后的部分（custom_provider:router/vendor/model 记为 vendor/model）。MiniMax Code 自己算出的 cost_usd 是有限的非负数时直接采用，缺失、为负或非有限值时改按 CC Switch 的定价表计算；原生费用恰好为 $0 的行按 $0 入库，但和其他有 token 的 $0 行一样，一旦该模型在定价表里有了价格，就会被共享的费用回填重新计价。与 Pi 一样，含 MiniMax Code 的合计带「缓存写入数据不完整」的提示。（#7383）
  Claude Desktop 第三方配置支持 Linux
  此前在 Linux 上写 Claude Desktop 第三方配置会直接报平台不支持。现在 Linux 与 macOS、Windows 使用同一套文件布局：配置根目录是 $XDG_CONFIG_HOME（必须是绝对路径），没有设置时是 ~/.config，CC Switch 在其下维护 Claude/ 与 Claude-3p/ 两个目录里的配置文件。CC Switch 以 Flatpak 运行时（通过 /.flatpak-info 识别）总是写宿主机的 ~/.config，不写沙盒私有的 XDG_CONFIG_HOME；如果你的 Claude Desktop 用的是自定义 XDG 目录，请改用原生安装包。自带的 Flatpak 清单已经授予家目录访问权限。macOS 与 Windows 的路径不变；手册（中/英/日）补上了 Linux 路径与支持范围表。（#7331，修复 #4855）
  请求日志显示每秒输出 token 数
  请求日志表的输出 token 旁显示生成速率（如 1,234/56 tps），请求详情面板在输出 token 后用括号显示。流式请求记录了首 token 时间时，速率 = 输出 token ÷（总延迟 − 首 token 时间），只算首 token 之后的生成；非流式请求用完整延迟，所以包含了首 token 的等待时间。速率不小于 1 时取整，小于 1 时保留一位小数。没有输出 token 或没有有效时间窗的行不显示，包括从 Claude Code、Codex、Gemini 会话日志导入的行，它们没有延迟数据。速率在显示时用已存字段计算，不涉及 schema 或日志改动。（#3369，修复 #5936）
  OpenCode 供应商表单：搜索并批量添加模型
  点「获取模型列表」后，表单上方会出现一个可搜索的多选列表：按模型 ID 或所有者过滤，勾选想要的模型（换搜索词时勾选会保留），再点「添加所选模型（N）」一次加入，模型 ID 同时作为配置键和初始显示名。已配置的模型显示为勾选、不可选并标注「已添加」，已有条目的名称、限制与选项保持不变。修改 Base URL 或 API Key 会清空候选列表，并丢弃上一个端点迟到的响应；在搜索框里按回车不会提交表单。每一行原有的下拉选择保留；复用 OpenCode 字段的 MiniMax Code 供应商表单也有同样的选择器。（#7515，修复 #7423）
  新增预设
  Kimi Global 与 Kimi For Coding Global（#7526）、FluxA Token Plan 与 Soshow 加入 Claude Code、Claude Desktop、Codex、Hermes、OpenClaw、OpenCode 与 Pi 七个应用，其中两条 Kimi Global 预设对应 Kimi 国际站（kimi.ai）。Codex 另新增 StepFun API（国内与国际）、百度千帆（按量付费）与讯飞 Astron Coding Plan 的原生 Responses 预设。存量供应商不受影响。
  其他新增
  - 五个模型补上定价：grok-4.7、glm-5.3-flashx、hy4-preview（混元 Hy4 Preview）、qwen3.8-2.4t-a95b 与 qwen3.8-27b 此前没有定价行，请求一律按 $0 入账。升级后启动时的回填会给这些 id 下历史的 $0 请求补上费用。Grok 4.7 按 20 万 token 以下的基础档计价。
  - 关于卡片的 Star 提示：「设置 → 关于」卡片在标题和按钮之间加了一行 GitHub Star 提示，点击打开仓库；GitHub 按钮移到按钮行最前面。
  变更
  国内 Codex 预设按各家 Responses 文档对齐
  - Kimi For Coding：kimi-for-coding 现在由 K2.8 Preview 提供服务，目录行改名为「Kimi For Coding (K2.8 Preview)」，上下文窗口从 262144 升到 1048576，声明文本+图片输入，推理档位从只有 high 扩为 low / high / max（默认 high）。kimi-for-coding-highspeed 仍是 262144、只有 high。
  - DeepSeek：预设默认改用 deepseek-flash（V4.1 Flash，文本+图片），不再用旧别名 deepseek-v4-flash；deepseek-v4-pro 行声明为纯文本，两行都与内置的 DeepSeek 官方目录一致。还在用 deepseek-v4-flash 的卡片照常可用，厂商会把这个别名路由到 deepseek-flash。
  - 腾讯混元：新增 hy4-preview（96 万输入、纯文本），默认模型仍是 hy3。
  - 千问AI平台与 QwenCloud 按量付费：新增开源权重的 qwen3.8-2.4t-a95b（纯文本）与 qwen3.8-27b（文本+图片）。
  - 没有预设更换协议：腾讯 Token Plan 企业版的四条预设仍走 Chat，因为 TokenHub 标明 Kimi K2.7 Code 不支持 Responses，DeepSeek V4 与 GLM-5.2 在那里也只是服务端转换成 Chat。
  MiniMax 国内站与百灵迁到当前官方域名
  MiniMax 国内预设在七个应用里从 api.minimaxi.com 改到 api.minimax.cn（Claude Code 与 Claude Desktop 用 /anthropic，Codex、Hermes、OpenClaw、OpenCode、Pi 用 /v1），官网与密钥链接改到 platform.minimax.cn。Coding Plan 用量检测同时认新旧两个域名，并改为按主机名逐段匹配，api.minimax.cn.example.com 这类仿冒主机不再误触发。在 Codex 里，minimax.cn 与旧域名一样按原生 Responses 处理、一样关闭 web_search。
  百灵在同样七个应用里从 api.tbox.cn 迁到 api.ant-ling.com。仍停在 Ling-2.5-1T（厂商文档已不再列出）的六个应用改为默认 Ling-2.6-1T，与 Codex 一致；Ling-2.6-1T 同时登记为纯文本模型，见升级提醒。
  StepFun、百度千帆与讯飞 Astron 的 Responses 端点关闭 Codex 的 web_search
  Codex 默认会带上托管的 web_search 工具，但 StepFun 的 Responses API 只接受 function 工具，千帆按量付费与 Astron 的 Responses 文档里也没有托管工具。stepfun.com、stepfun.ai、qianfan.baidubce.com 与 xf-yun.com 上的原生 Responses 卡片现在会在 ~/.codex/config.toml 写入 web_search = "disabled"（千帆与 Astron 是预防性处理，尚未确认会拒收）。这些域名上也有 Chat 产品（StepFun Step Plan、千帆 Coding Plan / Token Plan、Astron Chat），所以不会把整个域名当成原生 Responses，Chat 卡片的 web_search 设置不受影响。
  其他预设维护
  - SudoCode.chat 的 Claude Code、Claude Desktop、Codex 与 Grok Build 预设新增备用端点 api.sudorelay.com，会出现在端点测速里；默认地址仍是 api.sudocode.chat。
  - APIKEY.FUN 在九个应用里的官网、注册链接与 Base URL 从 apikey.fun 迁到 apikey.fan；Claude Code、Claude Desktop、Codex、Gemini 与 Grok Build 保留旧地址作为备用端点。
  修复
  Codex 0.154 起带 additional_tools 的请求不再被 Chat 网关 400
