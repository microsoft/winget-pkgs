ShortDescription: AI image upscaler for Windows that enlarges photos and other images ×2, ×4 or to any size with neural networks.
Description: |-
  Krupno enlarges photos and other images with neural networks, in a window or from the command line (krupno-cli).
  It runs ONNX models on any DirectX 12 GPU, NVIDIA, AMD or Intel, and falls back to the CPU; on Windows 11 24H2 and later
  it can also use the vendors' accelerators through Windows ML. Large images are processed in tiles without visible seams.
  It keeps transparency, EXIF rotation and color profiles, and works offline. Setup downloads the models you pick; each
  model has its own license, and some are for non-commercial use only.
