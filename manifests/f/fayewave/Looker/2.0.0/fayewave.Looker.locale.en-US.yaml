ShortDescription: A fast, minimal photo and file viewer for Windows 11 with a built-in file explorer.
Description: |-
  Looker is a fast, minimal viewer for Windows 11 with a built-in file explorer: tabs, a sidebar with bookmarks,
  collections and history, sortable columns, saved views, file moves and copies with undo, favourites and colour
  tags, and drag and drop to and from other apps. It opens JPEG, PNG, GIF, WebP, HEIC, AVIF, JPEG XL, TIFF, SVG,
  PSD, PDF, camera RAW and 3D models (OBJ, STL, PLY, 3MF, glTF, GLB).
