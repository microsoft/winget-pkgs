PackageVersion: 0.9.0-beta.11
PackageLocale: en-US
Publisher: Fabian Hassler
PublisherUrl: https://github.com/FabianHassler
PackageName: RustFig
PackageUrl: https://fabianhassler.github.io/rustfig/
License: MIT OR Apache-2.0 (parts under the xfig licence)
LicenseUrl: https://github.com/FabianHassler/rustfig/blob/main/LICENSE-MIT
ShortDescription: A modern xfig for Windows, without an X server, with fig2dev and LaTeX built in.
Description: |-
  RustFig is xfig rebuilt in Rust: the classic vector drawing program with the same modes, mouse buttons, panels, keys and .fig files, running natively on Windows (no X server, Cygwin or WSL).
  Every fig2dev export is built in (PDF, SVG, EPS, PNG, pstex/pdftex, TikZ, PSTricks, pict2e and more), LaTeX text is typeset on the canvas, and figures can be printed with the system's print dialog.
Moniker: rustfig
Tags:
