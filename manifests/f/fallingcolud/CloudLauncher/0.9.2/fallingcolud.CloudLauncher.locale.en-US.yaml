ShortDescription: A Minecraft launcher for Windows that keeps your modded instances on a server.
Description: |-
  CloudLauncher is a launcher for Minecraft: Java Edition on Windows. Set a modded instance up
  once and it is kept on your CloudLauncher account, so you can download it on any PC or share
  it with friends through a link. It browses and installs mods, modpacks, resource packs and
  shader packs from Modrinth and CurseForge, imports and exports packs in both formats, checks
  mods for updates in bulk, keeps backups of worlds, shows live status for your servers with an
  RCON console, and has config and KubeJS script tools that work across instances. It installs
  for the current user without administrator rights and updates itself. You need your own copy
  of Minecraft: Java Edition to play. CloudLauncher is not an official Minecraft product and is
  not approved by or associated with Mojang or Microsoft.
