ShortDescription: An ODF-native office suite with native clients for Windows, macOS, GTK, the browser, the terminal and the command line.
Description: |-
  grind is an ODF-native office suite written from scratch, with a native application for each platform rather than a cross-platform toolkit: a Windows program, a Mac program, GTK windows, a terminal UI, a browser client and a command line. Its native format is OpenDocument (odf).

  - A plain-text projection of a document makes every cell a line, so a spreadsheet can live in git and be reviewed and audited as diff, and it still opens in the window.
  - Formulas can be shown as self-documenting text instead of terse references, for example Future Value(Rate: Loan.B7/12, Number Of Periods: 10*12, Payment: -Loan.B6) in place of =FV(Loan.B7/12;10*12;-Loan.B6).
  - A domain specific language based on rhai generates spreadsheets from dynamic data without a Turing complete language, and without macro support.
  - A scratch calculator for the times where a calculator comes first and a spreadsheet would be easier later: define names, calculate line by line, and promote the tape to a real spreadsheet.
  - The CLI is a first class citizen, whether it is used by a human, in shell scripts or by AI agents; discover it with grind --help.
  - Excel workbooks are imported and their formulas recalculated, and their bar, line, pie and area charts are brought along.

  The clients are the spreadsheet and the word processor for Windows, macOS, GTK and the browser, the terminal version grind-tui, the command line grind, and a VS Code extension for .grind and .rhai files.
