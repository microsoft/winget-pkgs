ReleaseNotes: |-
  变更内容

  - grind calc 草稿计算器：逐行输入公式，用 #3 引用前面某行，或用 vat = 0.19 给某行命名，再用 --save 把这些行保存为电子表格。数字格式跟随 --locale。终端版里对应 grind-tui --tape 或 :tape；电子表格窗口里是标题栏上的计算器按钮，或菜单中的 Scratch Calculator，并用 Open as Spreadsheet 转到表格里继续；浏览器里是表格上方的计算器按钮，或 Ctrl+K 中的 Scratch calculator；Windows 上是 Data ▸ Scratch Calculator…；Mac 上是 Edit ▸ Scratch Calculator…。
  - 浏览器、Windows 和 Mac 里的草稿计算器是一个笔记本：输入一行，按 Enter 下一行就准备好了；在较早的行上按 Enter 会在它下面新建一行，方向键在行间移动，在空行里按 Backspace 会删除该行。
  - 草稿计算器会边输入边补全：Tab 补出你的各行定义的名称，并优先连同它们的值一起提供，还有函数名。草稿纸已知的名称与拼错的名称用不同颜色区分。在每个窗口和终端里都如此。
  - grind sheet extract，以及电子表格窗口中的 Extract a Number into a Named Cell…，把公式里的一个数字移到某个具名输入单元格中，并让公式改用那个名称。
  - Excel 较新的函数现在会重算而不再显示 #NAME?：IFS、SWITCH、CONCAT、TEXTJOIN、XLOOKUP、XMATCH、STDEV.S、STDEV.P、VAR.S 与 VAR.P。
  - 统计函数：PERCENTILE、QUARTILE、MODE、PERCENTRANK、CORREL、PEARSON、RSQ、SLOPE、INTERCEPT、FORECAST、SUMSQ、DEVSQ、AVEDEV、GEOMEAN、HARMEAN、COMBIN 与 PERMUT。
  - TEXT：按 #,##0.00 或 dd.mm.yyyy 这样的格式代码写出数字或日期。
  - LOOKUP、ISEVEN、ISODD、ISREF、ISFORMULA、FORMULA（Excel 的 FORMULATEXT）、ERROR.TYPE、CHAR、CODE、UNICHAR 与 UNICODE。
  - OFFSET 与 INDIRECT：移动并改变尺寸的引用，以及写成文本的引用 —— 工作表名前用 . 或 Excel 的 !，也可以是已定义名称，或用 R1C1 风格。
  - 另有四个电子表格函数：FIXED、LEGACY.NORMSINV，以及 Excel 的 NORM.S.DIST 和 GAMMA.DIST，因此用正态分布与伽马分布做模拟的工作簿会重新计算，而不是变成错误。
  - 导入 Excel 工作簿时，当某个单元格数组公式的计算结果与普通公式相同，就仍然把它保留为公式，而不是冻结成保存时的值。
  - 面积图：在插入或修改图表的地方，与柱形图、折线图和饼图并列提供，并且按 LibreOffice 的画法绘制 —— 堆叠的色带，线上再叠线。
  - LibreOffice 锚定到单元格的图表现在会显示出来；它们过去在 grind 里是看不见的。
  - 堆叠柱形图与堆叠折线图现在按堆叠绘制；过去是并排绘制的。
  - 保存结果被四舍五入到十位数字的公式不再被视为过期：编辑这样的工作簿不再就成千上万个公式发出警告，重新计算时也会保留它们。
  - 导入 Excel 工作簿会把其中的图表一起带进来 —— 柱形、折线、饼图和面积图，无论是否堆叠，柱形或面积之上带折线的也一样 —— 放在原来的位置，由工作簿的单元格绘制出来，系列名称即使工作簿里是文本而不是单元格也能保留，颜色包括主题色也一并保留。三维图表按其对应的平面类型导入。

  Fixes

  - grind 保存的电子表格里的公式，在现行 LibreOffice 中打开仍然是公式，而不是每个公式单元格都显示 Err:510。
  - 显示星期几的日期格式现在指向正确的那一天；除星期体外，其他每一天都曾被显示成前一天。
  - MATCH 除了查找区域，也能查找数组，因此 MATCH(TRUE(); INDEX(B1:B9>15; 0); 0) 能找到第一个大于 15 的行而不再失败；INDEX 也能从数组中取出一行或一列。
  - INDEX 作用于区域时会返回一个可作为区域使用的单元格、行或列，因此 MAX(A2:INDEX(A2:A99; B1)) 与 SUM(INDEX(A1:C9; 0; 2)) 可以工作，而不再显示 #VALUE!。
