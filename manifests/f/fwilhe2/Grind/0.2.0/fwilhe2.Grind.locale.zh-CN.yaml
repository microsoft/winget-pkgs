PackageIdentifier: fwilhe2.Grind
PackageVersion: 0.2.0
PackageLocale: zh-CN
ShortDescription: 原生支持 ODF 的办公套件，为 Windows、macOS、GTK、浏览器、终端和命令行提供原生客户端。
Description: |-
  grind 是一套从零编写、原生支持 ODF 的办公套件。它为每个平台编写原生程序，而不是采用跨平台工具包：Windows 程序、Mac 程序、GTK 窗口、终端界面、浏览器客户端和命令行。它的原生格式是 OpenDocument（odf）。

  - 文档有纯文本投影，每个单元格就是一行，因此电子表格可以放进 git，以 diff 的形式审阅和核对，同时仍然能在窗口里打开。
  - 公式可以显示为自我说明的文本，而不是简略的单元格引用，例如用 Future Value(Rate: Loan.B7/12, Number Of Periods: 10*12, Payment: -Loan.B6) 代替 =FV(Loan.B7/12;10*12;-Loan.B6)。
  - 基于 rhai 的领域特定语言可以从动态数据生成电子表格，不需要图灵完备的语言，也不提供宏支持。
  - 草稿计算器用于先按计算器入手、后来发现用电子表格更省事的时候：定义名称、逐行计算，再把草稿纸提升为真正的电子表格。
  - 命令行是一等公民，无论是人使用、写在 shell 脚本里，还是交给 AI 代理使用；可用 grind --help 了解它的能力。
  - 可以导入 Excel 工作簿并重算其中的公式，柱形图、折线图、饼图和面积图也会一并导入。

  客户端包括 Windows、macOS、GTK 与浏览器里的电子表格和文字处理程序，终端版 grind-tui，命令行 grind，以及用于 .grind 和 .rhai 文件的 VS Code 扩展。
