ShortDescription: 'Saytrue suggests how to say something differently: speak or type a text and get a warmer version that tells you what it changed. Local transcription and AI.'
Description: |-
  Saytrue suggests how to say something differently. Speak or type a text and Saytrue rephrases it, labelled with what the new version does differently, for example "Warmer phrasing".

  FREE EDITION
  - Rephrasing with the Tone lens ("Warmer phrasing")
  - Emotion detection from voice and text, tone analysis across five dimensions, topic classification
  - Bible Impulse and prayer (optional, off by default)
  - Dictation with spoken punctuation, quick recording to the clipboard
  - AI chat about your recordings and about the app
  - Export as PDF, Markdown, TXT, HTML or DOCX
  - 15 languages

  LOCAL BY DEFAULT
  - Local transcription via whisper.cpp
  - Local AI via Ollama, or cloud with your consent: OpenAI, Anthropic, Mistral (EU)
  - API keys encrypted in Windows Credential Manager
  - Recordings stored locally, configurable automatic deletion
  - Optional crash reports, off by default (EU servers)

  Saytrue Pro adds rephrasings with further lenses (Nonviolent Communication, Four-Sides Model, Transactional Analysis and more), response alternatives in three styles and coaching.

  IMPORTANT: Saytrue describes language and suggests phrasings; it does not diagnose and is not a substitute for professional advice. AI output can be inaccurate (EU AI Act Art. 50).
