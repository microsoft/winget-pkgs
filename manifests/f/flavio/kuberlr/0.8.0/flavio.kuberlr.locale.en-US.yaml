# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

PackageIdentifier: flavio.kuberlr
PackageVersion: 0.8.0
PackageLocale: en-US
Publisher: Flavio Castelli
PublisherUrl: https://github.com/flavio
PublisherSupportUrl: https://github.com/flavio/kuberlr/issues
PackageName: kuberlr
PackageUrl: https://github.com/flavio/kuberlr
License: Apache-2.0
LicenseUrl: https://github.com/flavio/kuberlr/blob/main/LICENSE
ShortDescription: A tool that simplifies the management of multiple versions of kubectl
Description: kuberlr (kube-ruler) is a wrapper for kubectl that detects the version of the Kubernetes API server and runs a kubectl binary compatible with it, downloading one from the upstream mirror when needed.
Moniker: kuberlr
Tags:
- k8s
- kubectl
- kubernetes
ReleaseNotesUrl: https://github.com/flavio/kuberlr/releases/tag/v0.8.0
InstallationNotes: |-
  kuberlr is a kubectl wrapper. Run kubectl through it with "kuberlr kubectl <args>".
  To call it directly as kubectl, kuberlr must be installed for all users
  ("winget install flavio.kuberlr --scope machine"; uninstall a per-user install
  first). See https://github.com/flavio/kuberlr#using-kuberlr-as-kubectl.
Documentations:
- DocumentLabel: Using kuberlr as kubectl on Windows
  DocumentUrl: https://github.com/flavio/kuberlr#using-kuberlr-as-kubectl
ManifestType: defaultLocale
ManifestVersion: 1.12.0
