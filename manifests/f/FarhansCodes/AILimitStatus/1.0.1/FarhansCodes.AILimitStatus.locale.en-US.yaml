ShortDescription: See your Claude Code and Codex usage limits at a glance from the Windows taskbar or macOS menu bar.
Description: |-
  AI Limit Status is a free, open-source desktop app that shows how much of your Claude and Codex subscription limits you have left.
  It reads the sign-in already created by the Claude Code and Codex CLIs, shows weekly limits with reset times, and sends a notification when a limit drops to 50%, 20% and 10%.
  It has no analytics or telemetry. Not affiliated with OpenAI or Anthropic.
