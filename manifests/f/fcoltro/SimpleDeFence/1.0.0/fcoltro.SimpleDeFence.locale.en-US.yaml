ShortDescription: A free, lightweight Windows firewall that blocks any application you have not allowed.
Description: |-
  SimpleDeFence is a free, lightweight, secure-by-default firewall for Windows. It sits in the
  notification area and blocks any application you have not explicitly allowed onto the network.

  It installs no kernel driver, so it cannot destabilise the system, and it collects no data about
  you or your machine. Rather than replacing the Windows firewall, it drives it: rules are applied
  through the Windows Filtering Platform by a background service, and the interface is a separate
  process that talks to it over a named pipe restricted to administrators.

  Five modes (Normal, Block all, Allow outgoing, Learning, Disabled), a live view of what is
  connected, listening and blocked with one-click allow, password-lockable configuration,
  hosts-file blocklists, and sixteen interface languages.

  SimpleDeFence began as a fork of TinyWall and has since been rebuilt on .NET 10 with a WinUI 3
  interface.
