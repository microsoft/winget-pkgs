ShortDescription: "Free AI game maker built on Godot."
Description: "Flockbay is a desktop app with the official Godot 4.7.2 engine inside. Your game is a plain Godot 4 project in a folder you choose: it opens in stock Godot, and Git works on it like on any project.\n\nFlockbay's AI edits scenes, nodes and GDScript through the Godot editor, runs the game, reads stdout and the debugger, and fixes what broke. It runs on free daily hosted AI usage or on your own Claude, ChatGPT or API key; paid plans add more hosted usage. Claude Code, Codex, Cursor and other MCP clients connect to it as an MCP server.\n\nBuilding needs an internet connection. The game you built runs locally."
