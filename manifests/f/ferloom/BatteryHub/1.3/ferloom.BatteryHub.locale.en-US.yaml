ShortDescription: Battery levels of your wireless mouse, headset, keyboard and controller, right on the Windows taskbar.
Description: |-
  BatteryHub shows the battery levels of wireless peripherals next to the Windows clock, without Logitech G HUB, SteelSeries GG or other vendor software running.
  It supports Logitech (LIGHTSPEED, Bolt, Unifying, Bluetooth), SteelSeries, Razer, ROCCAT, Sony DualSense / DualShock 4, Xbox controllers, Apple AirPods / Beats and generic Bluetooth and HID devices.
  A lightweight Rust recode of the C++ BatteryHub by krisgfx9 (about 2 MB of RAM when idle). Per-user install, no administrator rights needed.
