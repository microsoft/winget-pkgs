ShortDescription: 给你自己网盘用的 agent 驱动媒体库。
Description: 你说要某部电影 / 剧 / 番，LLM agent 跨索引源搜罗资源、把最合适的转存进你自己的 115 / 夸克 / 光鸭网盘、转存后回读验证，并持续追踪还缺什么。桌面应用内置自己的 SQLite 数据层，在 Electron 壳里运行完整引擎——不需要 Docker、Postgres 或终端。
