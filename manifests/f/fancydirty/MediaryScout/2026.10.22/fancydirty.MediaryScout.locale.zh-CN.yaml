ReleaseNotes: |-
  - 新增 搜索框支持按剧情描述或带季名找片：记不起片名时描述剧情，或直接搜「作品名 第三季」也能找到目标作品
  - 新增 获取动漫与剧集时支持联网核对民间分季与总集数的对应关系，解决官方不分季作品因季名不同被漏收的问题
  - 修复 电影分享链接里同时包含多个画质版本时，只保留最符合画质偏好的那一份，不再把多份正片全部落盘
  - 修复 内置免费 AI 模型遇到上游短暂拥堵时直接报错中断的问题，现在会自动重试
  - 改进 定时巡检遇到网络或模型临时抖动且尚未转存时会自动重试一次

  桌面版：macOS（Apple 芯片）下载 .dmg，Windows 下载 .exe。覆盖安装，数据和设置都会保留。
  Docker 自部署：按升级说明更新。
