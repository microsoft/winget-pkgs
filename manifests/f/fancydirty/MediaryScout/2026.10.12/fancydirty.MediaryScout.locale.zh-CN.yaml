ReleaseNotes: |-
  - 新增 媒体库支持按片名快速查找：输入片名立即定位，回车直达详情，找片换资源不用再翻墙
  - 新增 没有配置 AI 模型也能开箱即用：默认使用内置免费模型池（无需注册），设置页可一键换成自己的模型
  - 修复 搜索源偶发故障时候选资源被漏搜、明明有的大文件资源找不到的问题
  - 修复 在非第一个网盘的媒体库里点「电影」「电视剧」会跳回第一个网盘的问题
  - 改进 镜像源偶发连不上时自动重试并留下日志，获取不再因此受影响

  桌面版：macOS（Apple 芯片）下载 .dmg，Windows 下载 .exe。覆盖安装，数据和设置都会保留。
  Docker 自部署：按升级说明更新。
