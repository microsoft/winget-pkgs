ReleaseNotes: |-
  - 新增 多网盘统一协作获取与统一媒体库：不再需要手动切换网盘工作区，获取时自动在所有已连接网盘的候选资源中择优入库，单块网盘能收齐绝不拆盘，单盘都不全时自动跨盘互补收齐
  - 新增 六大网盘实时剩余空间感知与超额保护：设置页网盘卡片直接显示剩余容量，空间已满或会员到期超额的网盘自动禁止写入，剧集详情页与通知卡片直观标注每部作品和每一集所在的网盘
  - 新增 支持连接 UC 网盘（支持手机 App 扫码登录与 Cookie 连接），支持转存 UC 网盘分享链接
  - 新增 光鸭云盘支持手机 App 扫码登录，连接时无需再手动抓包复制凭证
  - 新增 支持配置海搜（Haisou）官方 API 作为补充搜索源，扩展各网盘的分享链接覆盖率

  桌面版：macOS（Apple 芯片）下载 .dmg，Windows 下载 .exe。覆盖安装，数据和设置都会保留。
  Docker 自部署：按升级说明更新。
