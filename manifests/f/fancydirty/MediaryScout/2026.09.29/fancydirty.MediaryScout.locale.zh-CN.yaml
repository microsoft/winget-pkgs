ReleaseNotes: |-
  这是桌面版自 v1.4.1（2026-08-06）以来的第一个版本，包含这两个月的全部改进。以后每次发布都用日期命名；装上这个版本之后，桌面版会自己提示新版本。
  - 新增 桌面版有新版本时，会在托盘和系统通知里提示，设置页「更新」里可以一键下载安装包
  - 新增 设置页多了「更新」，能看到当前版本和每个版本改了什么
  - 新增 可以在剧集详情页给 agent 留言，让它把不满意的资源换掉
  - 新增 agent 会记住每部作品获取时的经验，下次少走弯路；这些笔记在剧集详情页能看到、能删除
  - 新增 光鸭网盘支持转存光鸭的分享链接
  - 新增 123 网盘也能自动补外挂字幕
  - 新增 每个页面底部可以请作者喝杯咖啡
  - 改进 应用有了中文名「巡影」
  - 改进 巡检更快：不再因为繁体或英文片名拦下搜索，多块网盘可以同时巡检（设置里可调）
  - 改进 设置页「资源与服务」改成一块块的服务卡片，直接显示每个服务是否正常
  - 改进 可选接入 Jev 预筛，自动剔除色情和明显不相关的搜索结果
  - 改进 远程访问（Mediary Connect）改用支付宝付款
  - 修复 巡检不会在一次运行里把同一个资源包转存两次；候选旁会写明这个链接最近转过几次、文件有没有留下
  - 修复 转存中途失败留下的临时文件夹，系统会自己收拾干净，不再提醒你手动处理
  - 修复 115 转存字幕包时不再一下子用光接口额度
  - 修复 123 网盘的临时文件夹删不掉、越积越多
  - 修复 已完结的剧缺集时，巡检不再永远跳过它
  - 修复 同一部剧追在两块网盘上时，详情页不再显示成另一块盘的进度
  - 修复 搜索源没有结果时，不再误报「搜索源连不上」
  - 修复 模型审查打断任务时如实说明，不再误报「没有资源」
  - 修复 在详情页操作后，页面不再要等四五秒才更新
  - 修复 换掉某一集时，只记下视频，不再把字幕也记成「不要的资源」
  - 修复 手机上顶栏和「近期热门」的布局挤压
  - 修复 桌面版里点外部链接会用系统浏览器打开，不再弹出一个应用内的窗口

  桌面版：macOS（Apple 芯片）下载 .dmg，Windows 下载 .exe。覆盖安装，数据和设置都会保留。
  Docker 自部署：按升级说明更新。
