ReleaseNotes: |-
  Features
  - Butane: stabilize OpenShift spec 5.0.0, targeting Ignition spec 3.5.0
    (#2333)
  - Butane: add OpenShift spec 5.1.0-experimental, targeting Ignition spec
    3.7.0-experimental (#2334)
  - Support Outscale (#2296)
  - Butane: add --yaml-doc-separator to prepend the YAML document separator
    (---) to MachineConfig output

  Changes
  - ./test validates the Butane configs in butane/docs without needing a butane binary, restoring coverage that was lost when Butane merged into this repository
  - Document file append and overwrite behavior with examples (#2270)

  Bug fixes
  - Read Azure custom data from the base64 CustomData in ovf-env.xml so Confidential VMs pick up their Ignition config, falling back to CustomData.bin when custom data is missing or undecodable
  - Resolve intermediate symlinks in relabel paths, fixing SELinux relabeling failures for users with home_dir on OSTree platforms after policycoreutils 3.11 (#2316)
  - Fix Butane rendering large sizeMiB/startMiB values in scientific
    notation when generating OpenShift MachineConfig YAML (#2310)
  - Fix the Butane root partition constraint check to only examine subsequent partitions (#2304)
  - Close /proc/mounts after checking whether block devices are mounted, preventing file descriptor leaks during disk setup (#2289)
  - Drop supplementary groups when dropping privileges to write files as a user (#2242)
  - butane: report the friendly input name (<stdin> instead of /dev/stdin) in stdin read errors
  - Disable instances of template units (e.g. foo@bar.service) marked enabled: false; previously they were silently left enabled
  - butane: don't make with_mount_unit units for virtiofs filesystems require systemd-fsck@<tag>.service, which waits for a device that never appears and fails the mount
  - butane: report the CEX kernel-argument validation error only once when both boot_device.luks.cex and a root storage.luks CEX entry are enabled (#2285)
  - Build butane with DWARF debug info (drop linker -w) so downstream debuginfo packages contain valid debug symbols, matching the ignition and ignition-validate builds
ReleaseNotesUrl: https://github.com/coreos/ignition/releases/tag/v2.28.0
