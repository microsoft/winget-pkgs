ReleaseNotes: |-
  Hermes Desktop v0.7.9 aligns the stable release branch with the reviewed v0.7.8 application under a fresh version tag.
  This patch changes release metadata only. Application code, runtime assets and dependency versions match v0.7.8, retaining Agent v0.23.1 compatibility, managed runtime discovery, the canonical Windows interpreter fix, Electron 44.9.1 and the Linux arm64 updater feed.
  Existing published tags remain unchanged. Desktop and Agent continue to update independently; this patch does not require reinstalling Agent or changing Remote hosts.
  See the v0.7.9 release notes for scope and validation boundaries, and the v0.7.8 notes for the full application changes.
