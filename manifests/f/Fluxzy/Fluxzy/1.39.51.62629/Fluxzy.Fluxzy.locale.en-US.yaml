  Official .NET builds are signed and published at nuget.org.
  vv1.39.51 vv1.39.51
  - CLI binaries are available as assets or downloadable via this page.
  - Docker images are available at Docker Hub.
  CLI Installation
  npm (Windows, macOS, Linux):
  npm install -g @fluxzy/cli
  Or run directly without installing:
  npx @fluxzy/cli start --llo
  Windows (winget):
  winget install Fluxzy.Fluxzy
  macOS (Homebrew):
  brew tap haga-rak/fluxzy
  brew install fluxzy
  What's Changed
  Fixes
  - Encode empty key_share with a zero-length list in TLS 1.2 JA3 impersonation by @haga-rak in #810
  - Keep the connection of an unanswered request in the archive by @haga-rak in #813
  Dependencies
  - Bump Fluxzy.Core.Pcap from 1.39.47 to 1.39.48 by @dependabot[bot] in #799
  Other Changes
  - Upgrade MessagePack to 3.1.12 by @haga-rak in #818
  - Fix request framing in the HTTP/1.1 bridge handler and HTTP/2 header encoding by @haga-rak in #819
  - Add dissect summary subcommand and --json/--ndjson output by @haga-rak in #812
  - Disable brotli decoding on runtimes affected by CVE-2026-111497 by @haga-rak in #820
