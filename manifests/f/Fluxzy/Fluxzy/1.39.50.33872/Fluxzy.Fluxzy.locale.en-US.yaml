ReleaseNotes: |-
  Official .NET builds are signed and published at nuget.org.
  vv1.39.50 vv1.39.50
  - CLI binaries are available as assets or downloadable via this page.
  - Docker images are available at Docker Hub.
  CLI Installation
  npm (Windows, macOS, Linux):
  npm install -g @fluxzy/cli
  Or run directly without installing:
  npx @fluxzy/cli start --llo
  Windows (winget):
  winget install Fluxzy.Fluxzy
  macOS (Homebrew):
  brew tap haga-rak/fluxzy
  brew install fluxzy
  What's Changed
  Fixes
  - Fix oversized HTTP/2 response frame writes by @bbartels in #795
  - Limit H2 concurrent streams and rate-limit stream resets by @haga-rak in #805
  - Fix GetDecodedResponseBody on responses with Transfer-Encoding: chunked by @haga-rak in #808
