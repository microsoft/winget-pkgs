ShortDescription: Open-source remote desktop that connects your computers to a relay you run yourself.
Description: |-
  Farpane lets you open your own Windows and Linux computers from a browser, through a relay server you run yourself.
  This package is the program for each computer: it connects out to your Farpane relay, so nothing on the computer listens and no router ports are opened.
  After installing, run the setup command from your Farpane relay (farpane setup <server> <code>). It runs as the signed-in person, without administrator rights, and the person at the computer always sees on its tray icon when someone has it open.
