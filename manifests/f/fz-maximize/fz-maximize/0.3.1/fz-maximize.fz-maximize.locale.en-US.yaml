ShortDescription: Maximize a window into its PowerToys FancyZones zone instead of the whole monitor.
Description: |-
  fz-maximize makes the maximize button, a title-bar double-click, Win+Up and dragging to the
  top edge fill the PowerToys FancyZones zone the window is in, instead of the whole monitor.
  Hold Shift (configurable) for a normal full-screen maximize. Zone-maximized windows can be
  locked like truly maximized ones, and the move into the zone is animated like Windows' own
  maximize. Requires PowerToys with FancyZones enabled.
