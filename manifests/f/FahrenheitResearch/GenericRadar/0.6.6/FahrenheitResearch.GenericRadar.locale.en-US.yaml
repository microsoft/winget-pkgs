ReleaseNotes: |-
  GenericRadar v0.6.6
  Smoother, clearer map navigation with seamless basemaps and uninterrupted radar imagery.

  Basemap and navigation improvements
  - Raster map tiles now meet cleanly without visible cracks; vector boundaries
    remain continuous across zoom levels.
  - Previously loaded basemap detail stays visible until its exact replacement
    is ready, preventing black flashes while zooming.
  - Cursor-anchored animated zoom and inertial panning make map movement smooth
    and predictable.
  - Disable animation at Settings → Navigation → Smooth camera motion if
    immediate movement is preferred.
  - Radar imagery is smoothly resampled during movement; decoded gate values,
    scientific readouts, and underlying radar data are unchanged.
  - Live low-tilt following, Level 1 I/Q reprocessing, surface observations,
    placefiles, and current-view/animated-loop exports remain available.
  - Pure Rust implementation with no new dependencies.

  Downloads
  GenericRadar.exe is the locally built and verified Windows binary. Windows
  may show a SmartScreen warning because the application is not code-signed.
  Additional Windows x64/ARM64, Linux x64/ARM64, and macOS Intel/Apple Silicon
  packages are compiled from the same tagged source. Non-Windows builds are not
  flight-tested.

  Data credits
  NEXRAD Level II is produced by NOAA/NWS and served from the
  Unidata-hosted unidata-nexrad-level2 and
  unidata-nexrad-level2-chunks buckets. Surface METAR observations are
  published by the NOAA/NWS Aviation Weather Center; historical reports and
  supplemental station networks are served by the Iowa Environmental
  Mesonet. Additional sources include NOAA/NWS api.weather.gov,
  NOAA/NSSL KOUN Level 1 data, USGS The National Map, and
  OpenStreetMap contributors. Optional user-selected placefiles belong to
  their respective providers. Research-radar fixtures and applicable CC BY 4.0
  attributions are documented in DATA-SOURCES.md.
