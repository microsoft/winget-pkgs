ShortDescription: Fast, free, native NEXRAD Level II radar viewer — live storm-scale radar in a single small download
Description: 'BowEcho — A fast, free, native NEXRAD Level II radar viewer. Live super-resolution base data, dealiased velocity, dual-pol, derived severe-weather products, synced multi-pane, and vertical cross-sections — in a single small download. BowEcho decodes raw NEXRAD Level II data straight from the public AWS archive and live chunk feed (no account, no API key) and renders it with a fast CPU rasterizer that preserves the native super-resolution pixel pattern. It is built in Rust for speed: products switch instantly, panning stays fluid, and first pixels from a fresh volume arrive in well under a second on typical connections.'
Moniker: bowecho
ReleaseNotes: |-
  BowEcho v0.34.12
  This release expands local WRF analysis, adds initial ArWen output support and
  official MRMS observations in WoFS, and resolves several satellite, radar, and
  appearance problems reported after v0.34.11.

  Models and WRF
  - BowEcho now recognizes ArWen-generated wrfout files through their producer
    metadata while retaining compatibility with ordinary WRF workflows. ArWen
    and other WRF scenes are kept in separate compatible groups.
  - Imported WRF runs retain presentation-safe producer, version, domain, grid
    dimensions, and resolution metadata. Native plots and exported batch PNGs
    show that context without recording the original source path.
  - Standalone 10-m wind plots now show the complete range down to calm winds
    instead of masking values below 10 kt. User color-table overrides still take
    precedence, and the intentional threshold on MSLP wind overlays is unchanged.
  - Domain extrema… in Models > Field tools graphs a stored 2-D field's
    whole-domain minimum or maximum without requiring a pinned map probe. It
    preserves exact subhourly lead times, supports long minute-cadence runs,
    marks the run extremum and its time, and loads a timestep when its chart point
    is clicked.
  - Native batch plots now use exact forecast-time labels and include available
    WRF/ArWen grid context in their subtitles.

  WoFS and MRMS observations
  - WoFS now retains the official product metadata needed to distinguish
    forecasts from observations.
  - Official MRMS composite-reflectivity observations can use their native
    valid-time URLs, including pre-initialization frames and midnight crossings.
  - WoFS timeline controls, radar-time synchronization, map drapes, and status
    labels support negative, zero, and positive observation offsets.
  - Overlays are requested only at times they advertise, and availability checks
    use the correct forecast or observation URL scheme.

  Satellite and lightning
  - Saved-run filtering is now scoped to the selected GOES, Himawari, or
    Meteosat provider and product. Changing provider, band, sector, or MTG
    product clears stale imagery before rebuilding the relevant catalog.
  - Explicit one-shot RGB, focused-window, and SimSat results remain selectable
    without allowing unrelated cached products to replace the active display.
  - Valid warm and clear IR pixels remain visible on the map instead of becoming
    transparent and leaving only sparse cold speckles. The satellite-layer
    opacity control remains responsible for radar blending.
  - GOES live follow lists directly rendered ABI bands; composite recipes remain
    in the dedicated RGB loader.
  - The lightning layer is now labeled GOES GLM, large flash counts are
    compacted, and Meteosat LI is presented as a separate gear-menu action.

  Radar, alerts, and inspector
  - Disabled sweep cuts remain disabled as later scans arrive, and re-enabling a
    cut clears its session-wide exclusion consistently.
  - The field loupe no longer intercepts ordinary map zoom. Use
    Control/Command+wheel or the new Inspector slider to change loupe
    magnification.
  - Inspector coordinates can be hidden, and the preference persists.
  - Storm-track geometry remains visible, while motion text is shown only for
    the selected track to reduce map clutter.
  - Unacknowledged current alerts flash their row accent until acknowledged, and
    the selected alert's full text can be collapsed.
  - JTWC forecast matching is restricted to its covered basins so a same-name
    match cannot replace an NHC/CPHC forecast.

  Appearance
  - Persisted Slate and Graphite selections now keep BowEcho on its dark UI
    branch at startup, preventing a Windows light-theme event from resetting the
    interface to white.

  Operational notes
  - Every official release asset is built from the v0.34.12 tag by GitHub
    Actions. Matching .sha256 files are published beside the Windows, macOS,
    and Linux downloads.
