ShortDescription: 'ArWen: GPU-native WRF-ARW-class regional weather model, verified against WRF v4.6.1'
Description: "ArWen is an independent, GPU-native implementation of a WRF-ARW-class regional atmospheric model. It is not affiliated with or endorsed by NCAR or UCAR. The name is a wordmark for \"the ARW solver, GPU-native\"; the Python package is currently named gpuwm. Safety. ArWen is a research and educational tool. It is never a substitute for official forecasts and warnings from your national meteorological service. Do not use it to make safety decisions. Regional numerical weather prediction at convective scale has mostly required institutional clusters, which means most of the world runs on global-model guidance at 10-25 km. ArWen's aim is to put a verified, kilometer-scale limited-area model on a single consumer GPU: pick a point, size a nest ladder to your card, pull public analysis data, and run a 1 km (or 500 m) simulation of your own area on hardware you own -- especially in places where no national convection-permitting model exists."
Moniker: arwen
ReleaseNotes: |-
  ArWen 2.7.4 is a corrective release with Desktop 1.0.4.
  - Windows desktop: extract and open ArWen.exe. Setup installs and checks the matching runtime, tables and geography.
  - Linux desktop: follow the included installation guide. The graphical application requires x86-64 Linux with glibc 2.39 or newer.
  - Integration kit, desktop source, verification records, and checksums.
  This release includes these changes:
  - Cyclone tracking uses shared source preparation and catalog capabilities. Source coverage, available times and required fields still apply.
  - The cyclone center picker displays the selected model's pressure and wind map, with visible loading, failure details and retry. Layers offers barb size/spacing, line weight, overlay visibility and Reset controls.
  - Downscaled forecasts can be downscaled again, and child settings use the shared physics editor. Failed forecasts show their recorded reason in My forecasts, including saved runs reopened later.
  - WRF and metgrid initialization preserve supported analyzed fields and expose the existing vertical-grid and shared-GPU controls consistently.
  - WRF inputs decode character time records, retain supported cold Noah-MP state and interpret moist boundary theta correctly. Soil-water recovery uses original metgrid layers and their producing Vtable to convert amounts before interpolation; original files remain unchanged.
  - Model maps preserve selected ensemble members and statistical products through acquisition, storage and rendering. Component-based source feeds use normalized ingestion automatically.
  - Global AIFS/IFS previews preserve the full longitude span, and corrected normalized stores replace earlier single-column cached crops using verified source data.
  - Downloads preserve complete cached objects, retry transient IFS endpoint failures and select complete forcing windows. Windows long paths and transient reader locks work through acquisition and preparation.
  - Competing WRF/metgrid launches receive separate output attempts, including existing user-created empty folders. Worker ownership and recovered soil payloads participate in restart/output identity.
  - Windows status publication and analysis flushes handle the reproduced filesystem failures. Restart and episode-output recovery preserve input and output identities.
  - Preparation and remote memory estimates are advisory. Remote resume honors explicit input and product overrides.
  - Physics corrections include the checked WDM6 substep counter and the reviewed Morrison, Thompson and MYNN repairs. The verification records state each check's scope and limitations.
  - Native Rust rendering receives shared heavy diagnostic inputs from WRF output, and output discovery reaches committed episode frames.
  - Offline child preparation corrects bounded interpolation roundoff from nonnegative parent mass fields and invokes the native NSSL initializer when target number moments are missing.
  - The carried-physics artifacts identify exact changes for downstream consumers.
  Local data assimilation remains experimental. Its ordinary Desktop entry point is hidden; advanced users can enable it by starting the TUI with --enable-local-da. Backend capabilities remain available. Continuous local cycling is outside this release's qualification.
  Offline downscaling supports retaining the parent microphysics scheme for the admitted Kessler, WSM6, Thompson, Milbrandt-Yau, Morrison, NSSL, Thompson aerosol-aware, P3 and microphysics-off paths. Changing schemes offline is limited to an NSSL child from WSM6, Thompson, Morrison or Thompson aerosol-aware parent state. WDM6 offline downscaling and other offline scheme changes are not supported in 2.7.4; broader shared transition routing is deferred to 2.7.5. The online nesting transition catalog is broader and should not be read as an offline capability claim.
  Arbitrary WRF warm-restart restoration, live nested vertical refinement, some mixed-scheme/streamed nesting combinations and active black-carbon input in the supplied mp28 path remain outside the supported scope. The reusable in-app observed-versus-forecast A/B timeseries is not included.
  The verification packet identifies completed artifact and startup checks, the short GPU forecast, and retained component evidence. It does not establish general forecast skill or whole-model parity.
  Installation and usage | Full changelog
