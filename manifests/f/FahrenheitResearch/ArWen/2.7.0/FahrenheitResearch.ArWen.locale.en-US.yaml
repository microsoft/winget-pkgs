ShortDescription: 'ArWen: GPU-native WRF-ARW-class regional weather model, verified against WRF v4.6.1'
Description: "ArWen is an independent, GPU-native implementation of a WRF-ARW-class regional atmospheric model. It is not affiliated with or endorsed by NCAR or UCAR. The name is a wordmark for \"the ARW solver, GPU-native\"; the Python package is currently named gpuwm. Safety. ArWen is a research and educational tool. It is never a substitute for official forecasts and warnings from your national meteorological service. Do not use it to make safety decisions. Regional numerical weather prediction at convective scale has mostly required institutional clusters, which means most of the world runs on global-model guidance at 10-25 km. ArWen's aim is to put a verified, kilometer-scale limited-area model on a single consumer GPU: pick a point, size a nest ladder to your card, pull public analysis data, and run a 1 km (or 500 m) simulation of your own area on hardware you own -- especially in places where no national convection-permitting model exists."
Moniker: arwen
ReleaseNotes: |-
  ArWen 2.7.0
  Native Windows and Linux applications, a Rust terminal workspace, and the ArWen
  forecast engine. This release includes ERA5 member selection, cyclone-follow
  setup, reviewed forecast planning, native weather maps, and UTC playback.

  Downloads
  - Windows GUI and TUI — 45.3 MB
  - Linux GUI and TUI — 42.4 MB
  - Integration kit: developer guide, tested client examples, catalogs, and client design notes.
  - Download checksums
  Extract the complete desktop archive and follow its INSTALL.md. The desktop
  downloads use a separate Python 3.11+ environment. For a client controlling a
  remote forecast computer, install:
  python -m pip install 'gpuwm[render]==2.7.0'
  Select that environment with the desktop launcher's --python argument. The
  Linux desktop requires x86-64 Linux with glibc 2.39 or newer and working OpenGL
  under X11 or Wayland. The engine-only Linux wheel supports glibc 2.28 or newer.
  GPU execution also needs a compatible NVIDIA GPU/driver and the corresponding
  CUDA extra on the forecast computer; see the
  new installation guide.

  Compatibility and qualification
  Version 2.7 writes checkpoint format 6. Format-5 checkpoints, including earlier
  2.7 previews, must be completed with their originating version or restarted
  from the original configuration and inputs. Retained limits include some
  Noah-MP memory-estimation refusals, cold playback delays, incomplete preview
  provider coverage, and the documented completion-transition and dateline issues.
  Read the release notes,
  qualification,
  and review history
  for the tested scope and retained limitations. The six exact Python distributions
  are attached as well as being prepared for PyPI; publication is complete when
  the publish workflow records its successful final receipt.
ReleaseNotesUrl: https://github.com/FahrenheitResearch/arwen/releases/tag/v2.7.0
InstallationNotes: |-
  This application requires an NVIDIA GPU with CUDA support to run.
  Will not function on integrated graphics or non-NVIDIA hardware.
  Without compatible hardware, the application will fail to launch.
