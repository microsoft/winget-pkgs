ShortDescription: 'ArWen: GPU-native WRF-ARW-class regional weather model, verified against WRF v4.6.1'
Description: "ArWen is an independent, GPU-native implementation of a WRF-ARW-class regional atmospheric model. It is not affiliated with or endorsed by NCAR or UCAR. The name is a wordmark for \"the ARW solver, GPU-native\"; the Python package is currently named gpuwm. Safety. ArWen is a research and educational tool. It is never a substitute for official forecasts and warnings from your national meteorological service. Do not use it to make safety decisions. Regional numerical weather prediction at convective scale has mostly required institutional clusters, which means most of the world runs on global-model guidance at 10-25 km. ArWen's aim is to put a verified, kilometer-scale limited-area model on a single consumer GPU: pick a point, size a nest ladder to your card, pull public analysis data, and run a 1 km (or 500 m) simulation of your own area on hardware you own -- especially in places where no national convection-permitting model exists."
Moniker: arwen
ReleaseNotes: |-
  New
  - `gpuwm check --met-em DIR` prices card memory from a WPS metgrid directory alone, without WPS_GEOG.
  - `gpuwm run` and `gpuwm go` take `--lake-state {auto,forcing,ROW}` and `--lake-state-path` for met_em and WRF input directories.
  - `gpuwm go --lake-ice wps`, or `[ingest] gfs_lake_ice = "wps"`, keeps the GFS forcing's own lake ice.
  - `gpuwm sim` and `gpuwm run` take `--no-verify-visuals`.
  - `lbc_hydrometeor_envelope_km` sets the edge envelope over which the boundary ring is fed the source's cloud and precipitation.
  - A stated lake-state source reads a water temperature stated for one water body from a small CF file.

  Changed
  - An omitted `sf_ocean_physics` is 0 (no ocean model) at every forecast length; runs of 48 h or longer no longer switch on the mixed-layer ocean by themselves.
  - Every run prints one lake state: line, and the plan, dry run and report.json name the lake source; a resumed run takes its lakes from the checkpoint.
  - The GFS route fetches the IMS lake-ice analysis only for a domain with lake cells.
  - RCON (`mp_physics = 29`) is an explicit option instead of being refused at run start; it needs its initialized table stream installed with `gpuwm fetch-tables --schemes rcon --from DIR`.
  - A domain at 600 m or finer takes 100 m land cover and SoilGrids soil by default with its high-resolution terrain.
  - A 2 m temperature map of a field too narrow for the fixed ladder is drawn on a ladder cut for that field.

  Fixed
  - `gpuwm run --met-em` reads met_em written with `nocolons = .true.`, and model-level met_em that carries relative humidity without SPECHUMD.
  - A namelist.wps with `parent_id = 0` for the outermost domain imports and prepares.
  - `gpuwm check` prices the MYNN column width and the legacy RRTMG width the run takes on the declared card.
  - A failed lake analysis fetch is reported instead of falling back quietly, and the plan no longer promises a GLSEA request outside the Great Lakes.
  - A NetCDF source mapping that marks soil landmask_water decodes soil over water as missing.
  - A GDAS cycle before 2021-03-22 12Z, or an archive object every host answers absent, is refused instead of waited on.
  - Plan review agrees with the run on the physics settings and pairings the run refuses.
  - The stock-WRF wrfbdy_d01 export carries the boundary hydrometeor tables instead of zeros.
  - High-resolution terrain is built for a domain that crosses 180 degrees instead of being refused.
  - Maps of a curvilinear grid over a pole or across 180 degrees keep the grid's own mesh; they drew stripes and a seam.
  - ECMWF routes take Google's open-data mirror as an archive, so an IFS start older than 72 h no longer depends on one mirror.
  - DWD transfers ask a stalled connection again on a fresh one and move more files at once from a slow host.
ReleaseNotesUrl: https://github.com/recastsystems/arwen/releases/tag/v3.0.2
InstallationNotes: |-
  This application requires an NVIDIA GPU with CUDA support to run.
  Will not function on integrated graphics or non-NVIDIA hardware.
  Without compatible hardware, the application will fail to launch.
