ShortDescription: 'ArWen: GPU-native WRF-ARW-class regional weather model, verified against WRF v4.6.1'
Description: "ArWen is an independent, GPU-native implementation of a WRF-ARW-class regional atmospheric model. It is not affiliated with or endorsed by NCAR or UCAR. The name is a wordmark for \"the ARW solver, GPU-native\"; the Python package is currently named gpuwm. Safety. ArWen is a research and educational tool. It is never a substitute for official forecasts and warnings from your national meteorological service. Do not use it to make safety decisions. Regional numerical weather prediction at convective scale has mostly required institutional clusters, which means most of the world runs on global-model guidance at 10-25 km. ArWen's aim is to put a verified, kilometer-scale limited-area model on a single consumer GPU: pick a point, size a nest ladder to your card, pull public analysis data, and run a 1 km (or 500 m) simulation of your own area on hardware you own -- especially in places where no national convection-permitting model exists."
Moniker: arwen
ReleaseNotes: |-
  ArWen 2.9.6. The desktop stays ArWen Desktop 1.0.10, from the 2.9.0 release.
  - Install or upgrade: pip install --upgrade "gpuwm[all-cu12]==2.9.6".
  - Integration kit, verification records, and checksums.
  - Node GPU gate: Stage 1 and both GPU-shard results, with the tested source revision and card identity.
  New
  - Soundings at any point after a run: gpuwm soundings RUN --columns DIR writes a column store of every column at each history time, and a sounding drawn from a stored column matches one drawn from the history file.
  - Soundings say what they show: the point, valid time, forecast hour and member at the top left, and the model and its start in bold at the top right (title, brand and init settings, or GPUWM_SOUNDINGS_SETTINGS). rw_hex_points takes --brand.
  - Single-domain runs apply [perturbation] warm bubbles.
  - gpuwm hydro ahead CONFIG builds a domain's hydro fabric before the launch that uses it.

  Fixed
  - gpuwm go no longer waits about 35 minutes on a RAP or HRRR native cycle that has already posted.
  - HRRR and RAP smoke starts before 2021-12-21 14Z read MASSDEN in its real units (ug m-3).
  - Morrison microphysics (mp=10) steps about 11% faster, with identical output.
  - The end-of-run redraw of a fire (SFIRE) forecast no longer fails on the native fire panels, and those panels keep their folders.
  - A WRF-input --restart started from another directory is no longer refused as a different run.
  - Preparation has no single-core stages between fetch and forecast, and a forecast from a prepared bundle pre-warms its kernels.
  - rw_soundings reads only the profile columns it needs (much faster, a quarter of the memory) and no longer hangs at exit.
  - A fetch that streams many files at once no longer uses up the account's file watchers (other programs then failed with "too many open files").
  - Maps: threshold colorbars (snowfall, liquid equivalent) give every band the same length with a tick at each boundary; a map with nothing to draw says why; rain, snow, freezing rain and ice pellet flags are drawn as two categories with crisp edges; dimensionless fields carry no unit label; the map frame is the same width on every side.
ReleaseNotesUrl: https://github.com/FahrenheitResearch/arwen/releases/tag/v2.9.6
InstallationNotes: |-
  This application requires an NVIDIA GPU with CUDA support to run.
  Will not function on integrated graphics or non-NVIDIA hardware.
  Without compatible hardware, the application will fail to launch.
