ShortDescription: 'ArWen: GPU-native WRF-ARW-class regional weather model, verified against WRF v4.6.1'
Description: "ArWen is an independent, GPU-native implementation of a WRF-ARW-class regional atmospheric model. It is not affiliated with or endorsed by NCAR or UCAR. The name is a wordmark for \"the ARW solver, GPU-native\"; the Python package is currently named gpuwm. Safety. ArWen is a research and educational tool. It is never a substitute for official forecasts and warnings from your national meteorological service. Do not use it to make safety decisions. Regional numerical weather prediction at convective scale has mostly required institutional clusters, which means most of the world runs on global-model guidance at 10-25 km. ArWen's aim is to put a verified, kilometer-scale limited-area model on a single consumer GPU: pick a point, size a nest ladder to your card, pull public analysis data, and run a 1 km (or 500 m) simulation of your own area on hardware you own -- especially in places where no national convection-permitting model exists."
Moniker: arwen
ReleaseNotes: |-
  New
  - A nest under a hex parent can be forced at the parent's 15-minute frame spacing; gpuwm domain --cadence-minutes and python -m gpuwm.local_posting --lead-minutes name it.
  - rw_compare has the reference row hrrr-nat, HRRR's isobaric planes built from its own hybrid levels, and mixed-layer CAPE planes computed from the run; --list-products lists what each reference row serves.
  - Maps of the u and v wind components at 10 m, 850, 700 and 500 hPa, in knots, with the full wind drawn as barbs.
  Changed
  - MYNN (bl_pbl_physics = 5, the wrf_461 generation) runs the upstream MYNN v6.1 fixes by default as correct-mode finding MY1. physics.mode = "exact", physics.correct_skip = ["MY1"] and mynn_fixes_v61 = false keep WRF's MYNN.
  - The BouLac downward mixing length in a layer of constant potential temperature takes the corrected sign by default as correct-mode finding ML1, in MYNN (mynn_boulac_down_sign) and in the BouLac and k-epsilon PBL schemes (pbl_boulac_down_sign). physics.mode = "exact" keeps WRF's line.
  - Grid and spectral nudging refuse a strength above 1 per refresh (coefficient x time step x the steps fgdt holds the tendency) when the configuration loads, naming the largest admissible coefficient (NUDGING_STEP_STRENGTH).
  - gpuwm check and the run's memory preflight price the Noah-MP SNICAR spectra and particle arrays.
  - gpuwm domain refuses a --point whose latitude and longitude look swapped and names the point it likely means.
  - gpuwm go and gpuwm fetch refuse a cycle due more than 24 h ahead, naming its date and the wait; --wait-for-cycle waits for it.
  - gpuwm verify-visuals --domain takes the domain by number or frame name.
  - Rain maps and the snowfall liquid-equivalent map draw one colour per band, with every band the same length on the colour bar, green from 0.01 in.
  - gpuwm domain prints each warning about the file it writes once.
  - A host card queue's grant is read from CARD_QUEUE_CARDS and CARD_QUEUE_DIR; another prefix is named in GPUWM_CARD_QUEUE_PREFIX or ~/.config/gpuwm/card-queue.json.
  Removed
  - The experimental local data assimilation: the gpuwm local-da command and the modules and scripts only it used. gpuwm local-da now says it was removed and exits 2. The analysis start (gpuwm run --analysis), radar latent heating, ensemble perturbations, gpuwm enprod, the observation operators and observation ingest and scoring stay at their import paths.
  Fixed
  - gpuwm-hex add-nest and gpuwm prep --source hex-global take the parent's model levels from its frames, so a nest under a 59-level parent on NOAA's hrrrv5 suite prepares and runs; a 55-level parent prepares as before.
  - WPS output without LAI12M prepares and runs as WRF runs it when the land model does not read it.
  - The start's SNOALB over water is real.exe's 0.08 under rdmaxalb.
  - The start's VEGFRA and Noah soil blends run in real.exe's float32 order.
  - gpuwm fetch-geog gives land east of 180 degrees that the GMTED terrain stores as 0 m its Copernicus GLO-30 height.
  - MYNN no longer deletes dew and frost: the limit on a downward surface moisture flux only stops it taking the lowest layer below 1e-8 kg/kg (part of MY1).
  - gpuwm verify-visuals RUN applies --domain, --first-hour and --last-hour to a run folder.
  - Plan review admits the physics pairs the run already starts: BouLac or SASE over the GFS surface layer, and the slab land model under the GFS, TEMF, QNSE or Pleim-Xiu surface layer.
  - The Thompson hail table and fork-table builds fetch their pinned Ubuntu packages from Launchpad's librarian.
  - Land use and soil for a domain that crosses 180 degrees are repaired as the tiles are read, on the WRF route and in rw_mpas_static.
  - ERA5 137-level preparation regrids the surface file when it sits on a different 0.25 degree lattice from the model-level file.
  - A domain with sea ice in only some preparation slabs prepares.
  - A member-roster ensemble's first member runs in the directory claimed for it.
  - A single-domain forecast over steep ground no longer stops on the stability check while its flow is healthy: the check grades WRF's vertical Courant number.
  - Hub-height maps name their valid time and lead.
  - rw_mpas_convert --window mesh draws a global start and frames the refined core of a globe refined by 2x.
ReleaseNotesUrl: https://github.com/recastsystems/arwen/releases/tag/v3.0.3
InstallationNotes: |-
  This application requires an NVIDIA GPU with CUDA support to run.
  Will not function on integrated graphics or non-NVIDIA hardware.
  Without compatible hardware, the application will fail to launch.
