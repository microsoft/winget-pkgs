ShortDescription: 'ArWen: GPU-native WRF-ARW-class regional weather model, verified against WRF v4.6.1'
Description: "ArWen is an independent, GPU-native implementation of a WRF-ARW-class regional atmospheric model. It is not affiliated with or endorsed by NCAR or UCAR. The name is a wordmark for \"the ARW solver, GPU-native\"; the Python package is currently named gpuwm. Safety. ArWen is a research and educational tool. It is never a substitute for official forecasts and warnings from your national meteorological service. Do not use it to make safety decisions. Regional numerical weather prediction at convective scale has mostly required institutional clusters, which means most of the world runs on global-model guidance at 10-25 km. ArWen's aim is to put a verified, kilometer-scale limited-area model on a single consumer GPU: pick a point, size a nest ladder to your card, pull public analysis data, and run a 1 km (or 500 m) simulation of your own area on hardware you own -- especially in places where no national convection-permitting model exists."
Moniker: arwen
ReleaseNotes: |-
  New
  - Zero-centred diverging colour scales for difference maps: div_bwr and div_brbg, and CF rows temperature_difference, humidity_difference, wind_difference and pressure_difference for rw_wrfbatch --cf.

  Fixed
  - A second account on a shared Linux host can run gpuwm fetch; each account now keeps its fetch locks in its own folder, and a lock folder it cannot write is refused with the remedy (GPUWM_FETCH_LOCK_ROOT).
  - Several accounts can fetch into one shared output folder and wait for each other; DATA.md, "A host shared by several accounts", prints the group setup such a folder needs, and a fetch into a folder the account cannot write is refused before anything downloads.
  - Two accounts fetching at the same time on one Linux host no longer stop with a PermissionError on another account's fetch slot, fetch lock or card lock file in a shared sticky folder such as /tmp.
  - A second account on a shared host can take a card lock; runs of every account still keep off one another's card.
  - A NOMADS rate-governor lock left in /tmp by another account no longer hangs every other account's NOMADS fetch; each account paces from a folder of its own, and a lock that cannot be taken ends in one line naming the file.
  - GPUWM_BRIDGE_DIR moves the bridge folder, so the accounts of a shared host can read one copy; gpuwm doctor names the folder in use.
  - gpuwm fetch of a past cycle says the file was already up when first asked, and how late that was in minutes, hours or days.
  - gpuwm fetch names the next step by the model that reads the folder; with gpuwm-global installed, a whole-globe GDAS analysis leads with the ArWen Global command.
  - gpuwm fetch-geog --config takes an ArWen Global experiment by path or shipped name and stages what its statics read.
  - gpuwm fetch-geog stages into GPUWM_WPS_GEOG when it is set; a shared archive the account cannot write is read as it is.
  - gpuwm fetch-geog into a shared archive whose download folder another account made is refused before any download, with the remedy; a download folder it makes in a group-writable archive can be written by the group.
  - Maps drawn from a file that names its model carry that model as their source.
  - Sea-level pressure maps on global and coarse grids are smoothed over high ground, so they show far fewer small closed isobars there. Pressure over ground at or below 500 m is unchanged on every grid, and projected grids of 11.4 km or finer are drawn as before. A regular latitude-longitude grid of any spacing is now smoothed row by row, so away from the equator its isobars over higher ground can move slightly (at most about 0.1 hPa on test fields at 0.03° to 0.1°).
  - Maps of a forecast resampled onto a latitude-longitude file state the grid in degrees.
  - gpuwm fetch-bridges --from takes the bundle archive's own path as well as the folder that holds it.
  - A gpuwm multi-run child reads its [output] block from the configuration it captured at launch, like every other setting, not from the original file.
  - Documentation: the README's venv line names the Debian and Ubuntu package it needs; DATA.md says which commands take a card lock and that the NOMADS rate governor paces one account.
ReleaseNotesUrl: https://github.com/recastsystems/arwen/releases/tag/v3.0.6
InstallationNotes: |-
  This application requires an NVIDIA GPU with CUDA support to run.
  Will not function on integrated graphics or non-NVIDIA hardware.
  Without compatible hardware, the application will fail to launch.
