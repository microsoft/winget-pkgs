ShortDescription: Installer for the Parley Deck multi-agent cooperation skill.
Description: "parley-deck-skill installs the vendor-neutral Parley Deck cooperation skill for local CLI agents, plus opt-in companion add-ons. v2.6.0 documents the global core protocol introduced in parley-deck-cli 1.42.0: the cooperation protocol now lives once in a write-once versioned store under the user config directory, and each project deck holds a generated view of it rather than a hand-edited copy. The skill tells agents not to hand-edit that view, describes the render, check and publish commands, and states which parts are not yet in force so an agent does not rely on them. It is also explicit that the regeneration loss report is a line-level diff rather than a semantic analysis: an empty report means no line disappeared, not that no meaning was lost."
