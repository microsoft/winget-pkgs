ShortDescription: CLI that orchestrates Parley Deck multi-agent cooperation workflows.
Description: "parley orchestrates multi-agent Parley Deck cooperation across local CLI agents: risk-tiered tracks, deliberation rounds, consensus and finalize, implementation with living execution plans, a live TUI, and a human-braked outer loop. v1.42.0 adds a GLOBAL CORE PROTOCOL. Measured across 36 project decks there were eight different protocol versions, because the cooperation protocol was copied into every deck and hand-editable there. The protocol now lives once, in a write-once versioned store under the user config directory, and each deck holds a generated view of it. The new parley protocol command renders that view, checks a deck for hand edits without overwriting them, and publishes a new core version only from an attended terminal session. A deck records the exact core version it uses, and a machine that does not have that version blocks rather than substituting another. Regeneration reports the deck content it will not carry forward, before and during the write."
