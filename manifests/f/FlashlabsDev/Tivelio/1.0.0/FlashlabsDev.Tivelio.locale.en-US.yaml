ShortDescription: IPTV player for your own Xtream Codes account or M3U playlist. Tivelio provides no channels and no content.
Description: |-
  Tivelio is an IPTV player: connect your own Xtream Codes account or M3U / M3U8 playlist and play the live channels, movies and series of the service you already subscribe to. It provides no channels, no playlist and no subscription.
  With an Xtream Codes account: live TV with an EPG programme guide, catch-up where your service archives it, movies and series with detail pages. Also: one search across channels, movies and series, favourites, parental control with a PIN, light, dark or AMOLED themes, 30 languages, and navigation built for keyboard, mouse and remote.
  Free to use. Tivelio Pro, an optional licence, covers up to five devices across Windows, macOS, Linux, Android, Android TV, Fire TV, iPhone, iPad and Apple TV.
