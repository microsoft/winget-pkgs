ReleaseNotes: "## What's Changed\r\n• Poetry：`pyproject.toml` files with a `[tool.poetry.dependencies]` entry that has no version, git, path or url (e.g. a source-only `pkg = { source = \"private\" }` that adds settings to a dependency declared in PEP 621 `[project].dependencies`) no longer fail analysis. (https://github.com/fossas/fossa-cli/pull/1784)\r\n• uv：`uv.lock` files that lock more than one version of a package (e.g. different versions for different Python versions) now report every version under the package that depends on it. Previously only one version was kept, and the other versions' dependencies were reported as direct dependencies. (https://github.com/fossas/fossa-cli/pull/1782)\r\n\r\n\r\n**Full Changelog**：https://github.com/fossas/fossa-cli/compare/v3.19.0...v3.19.1"
