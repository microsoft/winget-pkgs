ShortDescription: Write long-form text in plain Markdown, alongside AI agents.
Description: |-
  Quillwright is a quiet, book-like writing environment for novels and other long documents. A project is an ordinary folder of Markdown files: one per chapter, one per character, and a page of world rules. There is no database and no lock-in.
  It is designed to run next to AI agents that edit the same folder. Changes made on disk appear in the editor as they happen, and unsaved text is never overwritten. The assistant panel uses the AI tool you already have installed (Claude Code, Codex, Ollama, or any command), and its suggestions are shown as a diff that you accept or reject.
  Also: research files (PDFs, images, notes) beside the page, project-wide search, spell checking, autosave and version history, and built-in export to Word, EPUB, PDF, OpenDocument, and HTML.
