ShortDescription: Save Instagram photos, videos, Reels, Stories and more to your Windows 10 or 11 PC. Browse and search your local library. FeedSaver is independent and is not affiliated with Instagram or Meta.
Description: |-
  FeedSaver is a desktop app for 64-bit Windows 10 and 11 that saves photos and videos you can view on Instagram. Save profile posts, carousel images, Reels, reposts, tagged posts, active Stories and selected Highlights. You can also save items from your Instagram Saved posts or paste one or more post or Reel links. Captions are available as optional text files.

  FeedSaver opens Instagram's own sign-in window. We never receive your password, and the app can see only the content your signed-in account can access. Choose where account folders are saved on your PC. In the local library, filter photos or videos and search by account, filename or caption. You start each run yourself. If Instagram asks FeedSaver to pause, the app waits for you to resume.

  The free version offers every way of saving, up to 50 files per day. The library and search stay free. Pro costs US$59 once for two PCs and includes every FeedSaver 1.x update. It removes FeedSaver's daily file limit and adds Update the accounts you follow, which goes through your Instagram following list one account at a time and saves what's new.

  Save only content you have the right to keep. FeedSaver is independent and is not affiliated with Instagram or Meta.
