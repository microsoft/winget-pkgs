ReleaseNotes: |-
  Welcome to Froststrap 2.0!
  After exactly 10 months and over 1,500 commits, Froststrap 2.0 is officially available as a stable release!
  Froststrap 2.0 is our biggest update yet, bringing a complete UI framework rewrite, full Linux and macOS support, and a large number of new features and improvements.
  Download now through https://froststrap.xyz/ or here
  What's New in 2.0?
  Everything in this section covers changes made since Froststrap 1.5.0.
  Cross-Platform Support
  Froststrap has been completely rewritten from WPF-UI to Avalonia, allowing the application to run natively across Windows, macOS, and Linux.
  This also means Froststrap's UI and features are now shared across platforms rather than maintaining separate platform-specific implementations.
  Linux Support
  image
  Froststrap now has full Linux support, using Sober as the Roblox client.
  - Full Froststrap functionality on Linux
  - Linux-native paths and configuration
  - Linux-specific account management
  - Linux Studio support (including downgrading Studio)
  - Linux notifications
  - Support for Froststrap's existing modding and customization features
  macOS Support
  Froststrap running on macOS
  Froststrap now supports macOS, bringing the majority of Froststrap's existing functionality to Apple's platform.
  - Roblox and Roblox Studio support
  - Virtual Display
  - Account management
  - Mods and FFlags
  - Notifications
  See the README for the complete list of supported features.
  New Features
  Quickplay
  A new way to easily rejoin and search for games on Roblox, tied and integrated directly into account manager!
  image
  - When logged in, you can also see your Continue Playing for the selected account
  - Search through Continue, Recommended, and favourite lists
  - Search for any game on Roblox, revealing statistics such as:
    - number of players playing
    - visits
    - subplaces
  - Context menu that allows you to join tracked servers, rejoin the last server, and view Roblox servers as well as private servers
  Account Manager
  image
  - rewritten ui for account manager, simplifying the process of logging in, switching, and deleting accounts.
  - Trust Froststrap never leaks your sensitive account information, as it is now stored through your OS credential helper
  - Identical setup and process on all 3 OS's
  Region Selector
  image
  - An improved region selector experience
  - Added server aliveness checks, a Roblox cookie is required for the check. Otherwise, you might join dead servers
  - Region selection is significantly faster
  - Region selection no longer requires a Roblox cookie
  Onboarding
  image
  - An easy way to setup Froststrap from the start of your installation
  - Go through
    - Language selection
    - Appearance
    - Account manager
    - Better Matchmaking
    - Shortcut creation
    - FAQ for quick questions
  Mod Generator Gradient Support is back!!
  image
  - You can finally use different gradient colors again thanks to @EfazDev
  - You can use specific images for the Roblox icon instead of coloring normally
  - Generated mods will be added to 'My Mods'
  Settings Search
  image
  - Added a new search icon in the sidebar
  - This allows you to quickly search for settings you can't find
  Version Management
  - Player downgrading is back!
    - Easily downgrade whitelisted Roblox Player versions set within our limits
    - Downgrade to any Roblox Studio version deployed through Roblox's CDN on all operating systems
  - Added a dedicated window for viewing available Roblox versions
  - Improved version switching and version downgrading
  Softkey (Windows only)
  - Built-in snaptap feature that works for Windows only for now
  - Option to change depending on keyboard layout
  Window Manipulation (Windows only)
  - Change Roblox icon on launch
    - Option to change icon to the current game icon
  - Change Roblox Title on Launch
    - Change Roblox Title to the current game name
    - Add player count to game title
  Removed Features
  - Removed Process Priority
  - Removed multi instance launching
  UI & Quality-of-Life Improvements
  - New Froststrap logo made by Mr Morale
  - Reworked the Froststrap interface around Avalonia
  - Reworked BetterMatchmaking to be way faster
  - Improved bootstrapper styling and progress indicators
  - Made gbs settings use a horizontal card instead of a square
  - Fixed mods-related bugs
  Other Improvements
  - Added a new notification backend
  - Added platform-specific application identifiers
  - Added support for Linux and macOS account permissions
  - Added improved Studio launching
  - Added option to select how many threads are used for Roblox download
  - Added new translations
  - Added new licensing under the MPL-2.0
  and so much more!
  What's Changed Since Release Candidate 2?
  This section contains changes made after Froststrap 2.0.0-rc.2 and is intended for users who have already been testing the 2.0 prereleases.
  Changes
  - Search bar is now a modal with a dedicated icon in the sidebar
  Fixes
  - Fixed issue regarding DiscordRPC being stale
  - Improved application startup and shutdown behaviour
  - Fixed remaining platform-specific issues
  - Fixed various UI and layout issues
