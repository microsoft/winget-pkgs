Description: |-
  A free Windows check-up that takes a few seconds and prints a receipt you can actually read: battery, disks, memory, Windows, the apps that start with Windows, and graphics, in plain words, in English or Italian.
  Fettle only reads what Windows already knows. The app sends nothing but an update check you can turn off, and a report only when you ask for a share link.
