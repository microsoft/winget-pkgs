ShortDescription: What an app's installer did to your Windows PC, in plain words. Only reads.
Description: |-
  Shows, in plain words, what an app's installer did to your Windows PC, and what it left behind after you uninstalled it.
  Installers can add background services, schedule daily updaters, start with Windows, install drivers, open the firewall and add right-click menu entries. idiff looks at exactly those places before and after, filters out what Windows changed on its own in the meantime, and prints a receipt. idiff itself only reads: it doesn't change or remove anything.
