ShortDescription: Count the pages in your folder. Scan mixed documents, review counted and estimated pages, and see spreadsheet cells separately. Expand results, save corrections, reopen scans and export a file-by-file report. Documents stay on your PC.
Description: |-
  Count the pages in your folder.

  Scan PDFs, Word, Excel and PowerPoint files, TIFFs, images, email and text together. Expand folders to inspect each file, its page count and how it was counted.

  Counted pages, such as PDF pages, TIFF frames and slides, stay separate from estimates. Default Word page counts are estimates and may differ from Microsoft Word pagination. Spreadsheet page estimates use worksheet used ranges. Spreadsheet cells are reported beside the page total, never added to it.

  Review files that cannot be counted and see the reason. Unknown counts are never treated as zero. Supported files inside ZIP archives are counted in place; unsupported files and unavailable archive contents are flagged for review. The result shows counted and estimated contributions and files left out.

  Save corrections and use Undo while preserving the original documents. Retry password-protected PDFs and ZIPs locally. Reopen saved scans and export file-by-file results as CSV or JSONL.

  Documents are processed on your PC and are not uploaded. No AI is used. Source files are opened read-only, and Microsoft Office is not required. No account is needed to scan. A license activates online once on each PC, then works offline.

  Try every feature free for seven days, then buy a one-time license for all the Windows PCs and Macs you own or control. Updates are included, and the license never expires. See https://filetally.com/licensing for current pricing and terms.

  Also available for Mac as a direct download from filetally.com. Visit filetally.com for current iPad and iPhone availability.
