ShortDescription: Count the pages in a folder of PDFs, Office files, TIFFs, images and email, on your own PC.
Description: |-
  FileTally counts the pages in a whole folder of documents. It scans PDFs, Word, Excel and PowerPoint files, TIFFs, images, email and text in one pass, and counts supported files inside ZIP archives in place.

  Counted pages, such as PDF pages, TIFF frames and slides, stay separate from estimated pages, such as Word body text and spreadsheet used ranges. Spreadsheet cells are reported beside the page total, never added to it. Files that cannot be counted are listed for review with the reason.

  Export per-file results as CSV or JSONL. Scans are saved and can be reopened later.

  Documents are processed on your PC and are not uploaded. Source files are opened read-only, and Microsoft Office is not required.

  Every feature is free for seven days, then a one-time license is required. See https://filetally.com/licensing for current pricing and terms.
