ReleaseNotes: "\U0001F680 全新工作区：左侧分组坞与标签条，网站按组打开、切组不散窗；主页图标库单击默认弹出独立窗口，也可改为工作区内打开。登录官方云即可同步配置，网站登录状态不会上传。脚本库可安装、启用与分享页面脚本；钥匙串保存账号，打开网站即可填入。工作台锁保护工位；内存占用与休眠让后台更轻；广告过滤与未读角标开箱即用。每个账号可单独走代理；支持 AI 接入，让助手在本机帮你操作网站。多套主题、自定义颜色与在线壁纸；设置按偏好、同步、授权、关于重新整理；支持打开本地网页、拼音搜标题、快捷键指引与窗口快速切换。"
