ReleaseNotes: "\U0001F680 A new workspace: group dock and tab bar on the left, sites stay in groups without scattering windows; the home icon library opens a separate window by default, or you can keep it inside the workspace. Sign in to official Cloud to sync your setup—site sign-ins are never uploaded. Install, enable, and share page scripts from the script library; the keychain saves accounts and fills them when you open a site. Workbench lock protects your desk; memory use and hibernation keep the background light; ad blocking and unread badges work out of the box. Each account can use its own proxy; AI access lets an assistant operate your sites on this computer. Theme packs, custom colors, and an online wallpaper gallery; Settings regrouped into Preferences, Sync, License, and About; open local pages, search titles more easily, follow the shortcut guide, and switch windows quickly."
