ReleaseNotes: "\U0001F31F 锁住的窗口更好找回来了：把网站锁成桌面挂件后，主窗口右下角会弹出一张卡片，点一下就能打开「切换窗口」，那里标着哪个窗口被锁住、一键就能解开；窗口图标的右键菜单里也多了「解锁穿透」，图标库和分组图标上都能用。解锁后窗口会自动取消置顶/置底，变回普通窗口。另外，锁住的网站在图标上只显示一把锁，不再和「已打开」的小绿点挤在一起。"
