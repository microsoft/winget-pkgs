ShortDescription: Voice dictation from an earbud button, transcribed locally and typed into the focused window.
Description: |-
  Press the play/pause button on Bluetooth earbuds (or a keyboard media key), speak, and stop talking. The utterance is transcribed on your own CPU with whisper.cpp and typed into whatever window has focus, followed by Enter. No cloud, no account. Runs as a notification-area icon; the speech model (142 MB) is downloaded on first run.
