ShortDescription: A self-hosted photo and video library with native apps, private face and smart search, photo and video editing, and optional cloud backup.
Description: |-
  Frameleaf is a photo and video library that runs on your own NAS, home server or Linux machine with Docker. Your originals stay as ordinary files on your own disks. Faces, smart search and AI captions are worked out on your own hardware, and there is no telemetry.
  Frameleaf Desktop connects to your Frameleaf server, connects to Frameleaf Cloud, and brings in photos from folders on your computer. The server is open source (AGPLv3) and a fork of Immich. Frameleaf is in beta.
