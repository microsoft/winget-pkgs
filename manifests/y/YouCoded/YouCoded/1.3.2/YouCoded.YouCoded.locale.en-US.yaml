Description: |-
  YouCoded is a fully customizable AI assistant and open-source everything app. Ask in the chat for new features, pages or a whole new look, and it builds them inside the app.
  It works on your files (Word, Excel, PowerPoint, PDFs) with a version history of every change, asks before it acts, and runs on whichever AI you choose: Claude or ChatGPT on your own plan, hundreds of models through OpenRouter, or a free model running offline on your own computer.
