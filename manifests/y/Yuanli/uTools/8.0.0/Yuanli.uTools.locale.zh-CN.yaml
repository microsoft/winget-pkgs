ReleaseNotes: |-
  uTools v8.0.0 全面升级底层运行环境，并带来全新的界面体验、AI 应用生成能力、定时任务能力及多项开发 API。
  底层升级：
  - Electron 由 23 升级至 34.5.8
  - Chromium 由 108 升级至 132
  - Node.js 由 16 升级至 20
  UI 全新升级：
  - Windows 11 和 macOS 的搜索框、超级面板支持亚克力窗口背景效果。
  - 管理中心全面改造升级，包括插件应用市场、个人中心和设置等界面。
  - 悬浮球支持显示用户自定义头像。
  全新功能：
  - AI 生成插件应用：支持通过自然语言描述，一句话生成完整的插件应用。生成完成后，点击打开即可将插件应用直接集成到 uTools。
  - 定时任务：底层新增定时任务支持，插件应用可以创建定时任务，按照设定的计划自动执行任务。
  其他改进：
  - 此外，本版本还进行了大量功能调整与优化，并包含底层升级、性能优化及稳定性改进。
  新增 API：
  - utools.captureDisplay：获取显示器截图，用于程序自动截图，无需显示截图交互界面。
  - utools.getCmdHotKey：获取指令对应的全局快捷键。
  - utools.getPluginLocalDataPath：获取插件应用本地存储目录。
  - utools.getPluginTempPath：获取插件应用临时存储目录。插件应用结束运行后，临时目录会自动清理。
  - utools.requestSchedule：请求创建定时任务。
  - utools.onScheduleTrigger：定时任务触发时调用。
  - utools.getSchedules：获取当前插件应用已创建的定时任务列表。
  - utools.removeSchedule：删除指定的定时任务。
  - utools.screenCapture：支持 Promise 调用。
  - utools.screenColorPick：支持 Promise 调用。
  升级影响：
  底层存储架构进行了重构，升级后会将旧数据迁移至新的存储目录。
  受影响的数据包括：「最近使用」、「剪贴板记录」。
  注意： 如果回退至旧版本，上述迁移后的数据将无法读取。
