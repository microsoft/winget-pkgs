ShortDescription: A zero-latency, local-first Markdown scratchpad engineered for instant capture, with optional AI features.
Description: |-
  MD-Memo is a local-first Markdown scratchpad for instant capture. It sits in the system tray, wakes with a global hotkey, keeps daily scrap files as plain Markdown and searches them in parallel.
  Optional AI features use the models and API keys you configure (for example Ollama, LM Studio, Gemini or any OpenAI-compatible endpoint): ghost-text completion, Ask AI, OCR for pasted screenshots, voice input and Quick Actions. With nothing configured, your notes are never sent to any external service.
  Mobile Drop sends photos, files, voice memos and text from a phone straight into the open note. MD-Memo needs the Microsoft Edge WebView2 Runtime, which is installed as a dependency when it is missing.
