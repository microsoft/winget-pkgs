ShortDescription: A zero-latency, local-first Markdown scratchpad engineered for instant capture, with optional AI features.
Description: |-
  MD-Memo is a local-first Markdown scratchpad for instant capture. It sits in the system tray, wakes with a global hotkey and keeps your notes as plain Markdown files in a folder you choose.
  Optional AI features use the models and API keys you configure (for example Ollama, LM Studio, Gemini or any OpenAI-compatible endpoint): ghost-text completion, Ask AI at the caret, OCR for pasted screenshots, voice input, Quick Actions and a meaning search over your notes. With nothing configured, your notes are never sent to any external service.
  You can also run shell commands over your text, hand jobs to agent CLIs, print the preview as PDF, and drive the running app from scripts through md-memo-cli and a local JSON-RPC port. MD-Memo needs the Microsoft Edge WebView2 Runtime, which is installed as a dependency when it is missing.
