ShortDescription: A Windows taskbar and tray AI quota monitor for Claude Code, Codex, and Antigravity.
Description: >-
  Gengchou is a lightweight native Windows taskbar widget and system-tray app
  for viewing the quota windows reported by Claude Code, Codex, and Google
  Antigravity without opening a provider dashboard. Before reading an existing
  local session, it asks for provider-specific permission and identifies the
  credential source. It has no analytics, telemetry, or separate backend
  service, and it does not store provider tokens.
