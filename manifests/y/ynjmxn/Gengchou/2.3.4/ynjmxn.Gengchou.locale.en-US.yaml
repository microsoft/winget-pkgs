ReleaseNotes: Fixes the first-run permission prompt so it appears after an app surface is visible, remains minimizable, and continues to default to No without reading credentials before authorization.
ReleaseNotesUrl: https://github.com/ynjmxn/gengchou/releases/tag/v2.3.4
InstallationNotes: WinGet portable packages do not create a Start menu shortcut. Open a new terminal and run "gengchou", then choose whether to allow each visible provider. Permissions can be changed later under "Provider access"; optionally enable "Start with Windows" from the app context menu.
