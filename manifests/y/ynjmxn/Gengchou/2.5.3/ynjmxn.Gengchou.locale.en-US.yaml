ReleaseNotes: The daily update check now raises a silent balloon once per version. Clicking it asks whether to update. The detail popup footer shows the waiting version while an update is outstanding and that line is clickable. A remembered offer that is not newer than the running build is treated as up to date. A failed automatic check does not clear the last successful offer.
ReleaseNotesUrl: https://github.com/ynjmxn/gengchou/releases/tag/v2.5.3
InstallationNotes: WinGet portable packages do not create a Start menu shortcut. Open a new terminal and run "gengchou", then answer the one-time permission prompt that covers every provider. Access can be revoked for a single provider later under "Provider access"; optionally enable "Start with Windows" from the app context menu.
