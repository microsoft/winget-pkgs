# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: ynjmxn.Gengchou
PackageVersion: '2.3.3'
PackageLocale: zh-CN
Publisher: ynjmxn
PackageName: 更筹 Gengchou
License: MIT
ShortDescription: 面向 Windows 的 Claude Code、Codex 和 Antigravity 配额监视器，提供任务栏组件、浮窗和托盘图标。
Description: >-
  更筹是轻量级原生 Windows 任务栏组件与系统托盘应用，无需打开服务商控制台
  即可查看 Claude Code、Codex 和 Google Antigravity 实际报告的配额窗口。
  读取现有本地会话前，应用会按服务商单独请求授权并明确显示凭据来源。
  应用不包含分析、遥测或独立后端服务，也不会保存服务商令牌。
ReleaseNotes: 新增分服务商明确授权；授权前不读取本地凭据、不启动服务商轮询，可随时撤销，且不保存令牌。
InstallationNotes: WinGet 的 portable 包不会创建开始菜单快捷方式。安装后请在新终端中运行“gengchou”，并分别选择是否允许访问各个可见服务商；之后可在“服务商访问权限”菜单中修改。如需开机启动，可在应用右键菜单中启用“Start with Windows”。
ManifestType: locale
ManifestVersion: 1.12.0
