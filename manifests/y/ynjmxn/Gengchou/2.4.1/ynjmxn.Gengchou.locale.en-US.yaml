ReleaseNotes: Reserves the Windows warning glyph for notifications that require action. Routine provider detection, quota reset, and Claude Code update notifications use the Gengchou app icon and remain silent. Adds current provider integration and OpenCode Go engineering notes.
ReleaseNotesUrl: https://github.com/ynjmxn/gengchou/releases/tag/v2.4.1
InstallationNotes: WinGet portable packages do not create a Start menu shortcut. Open a new terminal and run "gengchou", then answer the one-time permission prompt that covers every provider. Access can be revoked for a single provider later under "Provider access"; optionally enable "Start with Windows" from the app context menu.
