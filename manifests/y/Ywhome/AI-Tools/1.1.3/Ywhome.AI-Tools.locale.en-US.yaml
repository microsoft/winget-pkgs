ShortDescription: Manage MCP servers and AI agent skills for 32 AI clients in one desktop app
Description: |-
  AI-Tools is a desktop app for managing MCP servers and AI agent skills in one place. It supports 32 AI clients and provides browsing, search, installation, debugging, backup, multi-device sync, and cloud sync.

  Instead of editing each client's configuration files by hand, you can manage every MCP server and skill from a single interface and keep your setups consistent across tools.
