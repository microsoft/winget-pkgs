ShortDescription: Diagnostic et réparation gratuits de votre PC Windows 11, dans un seul fichier.
Description: |-
  Rustine analyse un PC Windows 11 en quelques secondes et dit en clair ce qui ne va pas : matériel complet (carte mère, BIOS, mémoire et profil XMP ou EXPO, disques, carte graphique, écrans), écrans bleus et pilote en cause, santé SMART et NVMe des disques, latence des pilotes (son qui craque), démarrage lent, jeu qui plante.
  Il répare ensuite avec votre accord (point de restauration et « Tout annuler »), allège Windows sans toucher à Defender ni aux mises à jour, et réunit pilotes, nettoyage, espace disque, recherche de fichiers, sécurité et capteurs en direct.
  Un serveur MCP intégré (rustine --mcp) permet à Claude, Codex ou Cursor de piloter Rustine.
