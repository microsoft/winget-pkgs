ShortDescription: Free diagnosis and repair for your Windows 11 PC, in a single file.
Description: |-
  Rustine checks a Windows 11 PC in seconds and explains plainly what is wrong: full hardware inventory (motherboard, BIOS, memory and XMP/EXPO profile, drives, graphics card, displays), blue screens and the driver involved, SMART and NVMe drive health, driver latency (crackling audio), slow boot, crashing games.
  It then repairs with your consent (restore point and "Undo all"), debloats Windows without touching Defender or updates, and brings together drivers, cleanup, disk space, file search, security and live sensors.
  A built-in MCP server (rustine --mcp) lets Claude, Codex or Cursor drive Rustine.
