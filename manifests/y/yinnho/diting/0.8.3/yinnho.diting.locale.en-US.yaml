ShortDescription: A browser engine for AI agents - one Rust binary with built-in V8, no Chromium.
Description: |-
  diting is a server-side browser engine for AI agents. It fetches JS-rendered pages as markdown, takes deterministic screenshots, renders HTML/CSS animations to video, aggregates multi-engine web search, and replays recorded interaction flows - all over a local HTTP API. Single Rust binary with built-in V8; no Chromium, no system browser.
