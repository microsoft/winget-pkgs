ReleaseNotes: |-
  Varin 0.9.47 带来独立的浏览器连接、原生桌面查询与条件等待，让 Bot 能及时注意到长时间没有新动作的任务。同时完善等待事项编辑、聊天中的设置变更展示，并修复定时任务的模型选择和执行准备问题。
  连接你实际使用的浏览器
  - 在 Computer Use 旁加入独立的 浏览器 设置页。管理当前服务或已连接设备上的浏览器，设置服务默认浏览器，也可为单个任务指定浏览器。工作台中查看哪个浏览器，与让任务使用哪个浏览器分别选择。
  - 支持多条具名 CDP 连接，可配置认证请求头与可选的共享文件目录。连接地址和文件路径由所选服务解释，让浏览器、前端、Harness 和工作区可以部署在不同设备。
  - 通过浏览器扩展连接现用 Chrome 或 Edge 标签页，沿用真实的网页登录状态。在设置中下载扩展、生成设备配对链接，再主动分享需要交给任务的标签页。扩展直接连接服务，无需本地辅助程序或另一套凭据系统。
  - 工作台和扩展均可接手页面，也可交还任务；交还后任务重新观察页面再继续。关闭工作台不会关闭原标签页，连接中断时也不会重放结果不明的操作。
  - 补齐现有支持语言中的浏览器设置、连接弹窗、工作台标签与扩展文案。修复英文词条覆盖中文的问题，并让扩展下载包完整包含语言目录。
  扩展目前需要在 Chrome 或 Edge 的开发者模式下加载解压后的目录，支持直接 HTTP(S) 服务连接，暂不支持仅提供中继的链接或扩展文件传输。通过 CDP 传输文件时，服务与浏览器需要共用所配置的目录。
  桌面查询、状态操作与条件等待
  - 按角色、名称、值和状态查找控件，读取指定属性，或在已观察区域内查询。原生查询返回紧凑结果，并明确底层范围是否已完整搜索。
  - 在桌面提供方支持时，直接设置勾选、展开状态，选择项目或将元素滚入视野。普通点击可以使用控件的原生操作，明确指定的鼠标与键盘输入继续可用。
  - 通过 computer_await 等待桌面条件，由原设备重新观察实际状态。两次采样之间释放输入通道，让等待中的任务不会独占桌面；观察不完整、原窗口消失等情况保留真实含义。
  - 聊天过程展示实际桌面动作与目标，并可查看结构化的查询结果和等待结果。
  让 Bot 及时掌握正在进行的工作
  - 执行中的任务默认 20 分钟没有新的模型请求或工具调用时，提醒负责它的 Bot。可在聊天设置中调整时间或关闭。同一段无活动只提醒一次，有真实新动作后重新计时；暂停、等待用户和条件等待保留原状态。
  - 执行意外中断、重启后等待恢复等情况，通过原有工作事件回到 Bot，并附上记录中的执行状态。任务恢复活动、结束或取消后，过时提醒不再唤醒 Bot。外部 Harness 按其实际提供的活动记录计时。
  - 在原管理条目中修改等待事项的后续指令、触发时间或文件条件，保留来源与交付历史。右侧关注视图纳入普通等待，可直接进入原会话管理。
  - 设置修改直接在聊天中展示实际返回的修改前后值、操作结果和生效时机，并提供对应设置页入口。
  定时任务与执行修复
  - 从原生会话创建定时任务时，预填当前所选模型和思考等级，仍可继续修改。选择已有任务时保留准确的会话与分支；编辑已保存的日程时保留日程自己的选择。
  - 未指定的思考与温度选项在经过内核接口时继续保持未指定，避免变成显式的空覆盖值。
  - 修复执行准备报错 ready composition differs from the rebound launch。启动绑定更新时，已就绪的工具候选基于当前工具目录重新准备，并保留原服务直到交接完成。
  - 恢复旧普通任务时，不再要求这些任务原本就没有的 Bot 归属信息。
  桌面版发布目标覆盖 Windows x64/ARM64、Linux x64/ARM64 与 macOS Apple Silicon。签名 Android APK 用于连接已有的 Varin Host。标准版与 toolbelt Docker 镜像通过容器发布流程构建；可选的本地嵌入组件继续单独下载。
  源码部署： 请一起重新构建应用与 Rust 内核，然后重启 Host。受支持的会话存储会在打开时自动升级，升级前建议保留备份。
  完整更新记录
