ReleaseNotes: |-
  Varin 0.9.47 makes browsers independently connectable, adds native desktop queries and condition waits, and helps Bots notice work that has stopped making progress. It also improves follow-up editing, shows settings changes in conversation, and fixes scheduled-task model selection and execution preparation.
  Connect the browser where you work
  - Add a dedicated Browser settings page alongside Computer Use. Manage browsers on the current service or a connected device, set a service default, and choose a browser for an individual task. Viewing a browser in the workbench and assigning it to a task are separate actions.
  - Configure multiple named CDP connections, including authentication headers and an optional shared file directory. Connection addresses and file paths are interpreted by the selected service, allowing the browser, frontend, Harness and workspace to run on different devices.
  - Connect existing Chrome or Edge tabs through the browser extension, preserving their real sign-in state. Download the extension from settings, create a device pairing link, and explicitly share the tabs to use. The extension connects directly to the service without a native helper or a second credential system.
  - Take over a shared page from either the workbench or extension, then let the task continue after a fresh observation. Closing the workbench leaves the original tab open; connection loss does not replay actions with uncertain results.
  - Complete browser settings, connection dialogs, workbench labels and extension translations across the supported languages. Fix English entries overwriting Chinese messages, and include native language directories in extension downloads.
  The extension currently requires loading the extracted directory through Chrome or Edge's developer mode. It supports direct HTTP(S) service connections; relay-only links and extension-based file transfer are not yet supported. CDP file transfer requires the service and browser to share the configured directory.
  Desktop queries, state actions and condition waits
  - Find controls by role, name, value and state, inspect selected properties, and read within an observed region. Native queries return compact results and preserve whether the underlying scope was completely searched.
  - Set a checkbox or expansion state, select an item, and scroll an element into view when the desktop provider exposes those actions. Supported ordinary clicks can use the native control operation; explicit pointer and keyboard input remain available.
  - Wait for a desktop condition through computer_await, using fresh observations from the original device. Waiting releases the input lane between samples, so it does not monopolize the desktop. Incomplete observations and a lost source window retain their actual meaning.
  - Present desktop activity with the real action and target in conversation, with structured query and wait results available to inspect.
  Help Bots keep track of ongoing work
  - Notify the responsible Bot when running work has no new model request or tool call for 20 minutes by default. Change the interval or turn it off in chat settings. Each inactive period produces one reminder; actual new activity restarts the timer. Paused work, user waits and condition waits keep their existing states.
  - Deliver execution interruptions and restart-recovery waits through the existing work-event path, including the recorded execution state. Expired reminders stop waking the Bot once the work resumes, ends or is cancelled. External Harnesses use the activity they actually report.
  - Edit a follow-up's instruction, scheduled time or file condition from its existing management entry, keeping its source and delivery history. The right-hand attention view includes ordinary waits and opens their original conversation for management.
  - Show returned before/after values, operation results and effective timing for settings changes directly in conversation, with a link to the corresponding settings page.
  Scheduling and execution fixes
  - Prefill new scheduled work with the opening native conversation's selected model and thinking level, while keeping both editable. Choosing existing work preserves its exact conversation and branch; editing a saved definition preserves its own selections.
  - Preserve unspecified thinking and temperature options across the kernel boundary instead of turning them into explicit empty overrides.
  - Fix execution preparation failing with ready composition differs from the rebound launch. Ready tool candidates now refresh against the current tool catalog when launch bindings change, retaining the original service until handover completes.
  - Recover older ordinary tasks without requiring Bot ownership metadata that those tasks never had.
  Desktop release targets cover Windows x64/ARM64, Linux x64/ARM64 and macOS Apple Silicon. The signed Android APK connects to an existing Varin Host. Standard and toolbelt Docker images use the container release workflow; optional local embedding components remain separate downloads.
  Source deployments: rebuild the application and Rust kernel together, then restart the Host. Supported conversation stores upgrade automatically on opening; keep a backup before upgrading.
