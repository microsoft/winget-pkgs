ReleaseNotes: |-
  Varin 0.9.48 带来模型容量预设和聊天中的生成速度显示，并修复 #353 中的传输、记忆连接和后台接续问题。发布与更新入口也已同步到新的组织仓库 Astrmira/Varin。
  更方便地设置模型容量
  - 上下文窗口提供 128K、256K、512K、1M 预设，也可直接在同一输入框填写自定义值。
  - 最大输出提供 8K、16K、32K、64K、128K、256K 预设，仍可留空，沿用原有模型与服务商处理方式。
  - 支持直接输入数字或 K/M 写法，菜单显示准确 Token 数，K 和 M 按十进制换算。已有自定义值原样保留，继续支持自动保存和恢复目录默认值。
  在用量旁查看生成速度
  - 在现有聊天用量区域显示 tok/s，生成过程中实时更新，完成后保留本轮结果。可在聊天设置中关闭。
  - 展开详情可查看首次输出延迟、距上次输出的时间及统计口径。实时计数使用现有 tokenizer 估算，完成后优先使用服务端返回的用量。
  - 计时由执行端记录，随原模型请求保存，重新打开会话后仍可查看。多次模型调用按总输出 Token 除以总模型请求耗时汇总，包含首次输出前的等待，排除工具执行与等待用户的时间。
  修复执行与后台接续
  - 修复并发活动中流的 BEGIN 先于 OPEN 发送的竞态，避免由此触发协议错误。
  - 内核退出时清理记忆和提示配置模块缓存的旧连接，重启后由仍在运行的 Host 为后续工作取得新连接；旧句柄错误不再误报为来源授权失败。
  - Bot 无活动扫描排除标题生成等辅助任务。单个截止时间来源、任务处理或投递失败时，负责后台接续的工作线程继续处理其他来源，并保留具体来源与原始错误。
  - 某个接续来源失败时，保留其他等待、后续事项和日程的计时与投递，让无关任务仍能按期继续。
  项目地址与更新入口
  - 桌面自动更新、发行版下载、可选组件下载、问题反馈和公开包元数据统一指向 Astrmira/Varin。
  - 发布校验与镜像来源标记同步组织仓库；已有容器镜像名称保持不变。
  - README 与使用指南采用 你的个人超级智能体 新定位，同步现有翻译和组织链接。
  源码部署： 请一起重新构建应用与 Rust 内核，然后重启 Host。
  完整更新记录
