ReleaseNotes: |-
  Varin 0.9.48 adds model capacity presets and generation speed in conversations, and fixes the transport, memory and background continuation failures reported in #353. Release and update links now use the project's new home, Astrmira/Varin.
  Set model capacity without losing custom values
  - Choose a context window of 128K, 256K, 512K or 1M, or enter your own value in the same field.
  - Choose a maximum output of 8K, 16K, 32K, 64K, 128K or 256K. The field can still be left empty to use the existing model and provider behavior.
  - Enter numbers directly or use K/M notation. The menu shows the exact Token count; K and M use decimal units. Existing custom values stay unchanged, and edits retain automatic saving and the option to restore catalog defaults.
  See generation speed alongside usage
  - Show tok/s in the existing conversation usage footer while the model generates, and retain the result when the turn finishes. The display can be turned off in chat settings.
  - Open the details to see first-output latency, time since the last output and the measurement method. Live output counts use the existing tokenizer; completed requests prefer the provider's reported usage.
  - Record timing at the execution source and save it with the original model request, so results remain available after reopening a conversation. Turns with multiple model calls use total output Tokens divided by total model-request time, including time before the first output and excluding tool execution and user waits.
  Restore reliable execution and background follow-ups
  - Fix a transport race in which a stream's BEGIN could be sent before OPEN during concurrent activity, causing protocol failures.
  - Invalidate cached memory and prompt connections when the kernel exits. The surviving Host obtains a fresh connection for subsequent work after restart; obsolete handles are no longer misreported as source authorization failures.
  - Exclude title generation and other auxiliary runs from the Bot inactivity scan. A failure in one deadline source, task reconciliation or delivery no longer stops the shared continuation worker; diagnostics retain the source and original error.
  - Preserve existing waits, follow-ups and calendar deadlines when another continuation source fails, so unrelated work can still become due and be delivered.
  Project home and updates
  - Move desktop updater configuration, release downloads, optional component downloads, feedback links and public package metadata to Astrmira/Varin.
  - Update publication checks and image source labels for the transferred repository. Existing container image names remain unchanged.
  - Refresh the README and user guides around Your personal super agent, with matching translations and organization links.
  Source deployments: rebuild the application and Rust kernel together, then restart the Host.
  Full changelog
