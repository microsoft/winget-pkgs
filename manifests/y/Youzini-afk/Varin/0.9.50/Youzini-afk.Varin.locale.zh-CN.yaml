ReleaseNotes: |-
  Varin 0.9.50 可以在实际运行 Agent 的设备上管理外部 Agent，新增自建 HTTPS 外部访问，并减少多端连接中的重复请求和传输开销。这版也修复了 Android 连接 Host 后工作台卡在启动页的问题。
  在执行设备上管理和使用外部 Agent
  - 在设置里选择当前 Host 或工作连接中的设备，检测并启用已有程序，也可为支持的 Agent 安装和更新。登录继续在各 Agent 自己的 CLI 中完成。
  - 输入框的执行 Agent 列表支持搜索和滚动。内置目录扩充了可接入的 Agent，包括 DeepSeek Harness 官方 ACP 配置。 #383
  - 直接在输入框选择外部 Agent 支持的模型、思考强度和模式。Codex 还可以切换当前工作目录可用的原生权限档位。
  - 回复抬头显示 Agent 的产品图标，以及该轮报告的模型和思考强度。桌面、移动端和 Bot 派发的外部任务在有数据时显示上下文占用。实时数据缺失时可查看上次记录，每轮 Token 用量仍可在消息底部查看。
  自建外部访问与多端连接
  - 在 设置 → 外部访问 接入自建 HTTPS 地址。可以让 Varin 管理本端 FRP 转发，也可自行运行转发或接入已有反向代理。设置页提供可下载、可编辑的 FRP 与 Caddy 部署文件，以及接入已有 Caddy、NGINX 的示例。 #376
  - 浏览器配对在 Host 重启后继续有效。可以单独撤销某台设备的授权，或关闭外部入口。其他 Varin 实例也能通过工作连接接入同一 HTTPS 地址。
  - 聊天、编辑器和侧栏共享同一份会话更新。支持新传输方式的连接会直接发送远程桌面图像的二进制数据，并在一次请求中连续传输附件，减少编码和网络往返。
  修复与兼容性
  - 修复 Android 连接 Host 或切换实例后工作台卡在启动阶段的问题。工作台启动请求现在会发往用户当前连接的 Host。 #387
  - 修复 OpenDesign 等 OpenAI 兼容网关的流式响应在后续分片返回空 ID 时，模型测试和对话失败的问题。后续空 ID 沿用首个分片的有效 ID，模型测试会显示具体的协议错误。 #385
  - 改善输入框展开和收起的动画。连续切换时从输入框当下的尺寸接着动，减少跳动。 #378
  - 新增 Magpie 内置模型服务，方便连接本地网关并发现模型。更新桌面内置的 Electron、Node.js，以及会话认证、网络传输和文档预览相关依赖。 #382 · #386
