ReleaseNotes: |-
  Varin 0.9.49 expands collaboration across conversations and external Agents, makes model waiting and stopping easier to understand, and fixes tool-result recovery, Bot model updates and startup problems.
  Bring existing conversations into the work
  - Main tasks, child tasks and Bot conversations can discover and contact one another within the accessible conversation scope. Requests and replies retain their actual sender, recipient and branch; contacting a conversation preserves its original task ownership.
  - Discover available execution backends through executors, and dispatch directly to Codex, Claude Code, Pi or a configured ACP Agent. Varin remains the default, and existing Agent presets can still bind an execution backend.
  - Find, read and send work to external conversations already registered in Varin, including manually created conversations and tasks dispatched elsewhere. Continue the original session with its own directory and configuration, and return reports to the conversation that requested the work.
  - Add input to an active Codex turn through native steering, or explicitly queue it for the next turn. Other backends retain next-turn delivery where reliable steering is unavailable. Text, images and original file attachments follow the same delivery path.
  - Use product logos throughout external Agent settings, backend selection, conversation lists and messages. Built-in configurations support automatic discovery, explicit enablement and disablement, using programs installed on the execution Host.
  Conversation tools and clearer collaboration
  - Add a dedicated Conversation tools button to the Bot title bar, using the conversation-tree icon. Open the conversation tree, collaboration, context or conversation recovery in the shared right-hand panel; desktop and mobile remember the selected view.
  - Show Bot-to-Agent instructions, messages and final reports in the collaboration feed, with the actual participants and Bot avatars. Reports link back to the original task and execution, and member conversations remain directly accessible.
  - Move reference and command guidance into actionable entries in the composer's Add menu. Selecting an entry inserts @ or / at the cursor and opens the existing picker. Remove the static hint line and the fullscreen menu entry.
  Know what is happening, and stop with clear feedback
  - Replace the generic processing label with the actual current request phase: preparing the request, waiting for the model, thinking, replying or preparing a tool call. Retry and stopping states use the same status position and follow execution-side observations.
  - Give the stop button immediate visual feedback while cancellation is being processed. Tool cards show stopping or stopped in their existing status area, and the send button returns when the run actually ends. Failed stop requests remain retryable.
  Recover tool results and apply current Bot settings
  - Fix document_read and other tool results being rejected with tool receipt lacks dispatch/no-send evidence after the executor had already finished. Preserve the original execution receipt when adding model-facing attachment references.
  - On startup, settle saved executor-stop receipts and resume result handling for conversations left waiting by this failure. Existing cancellation requests can finish through the same recovery path, without invoking the completed tool again.
  - Apply current Bot model and thinking settings when preparing background wake-ups, recovery and queued continuation. Handle runs ending during configuration synchronization, and prepare the new model directly after the previous request has closed, so a deleted old provider no longer blocks subsequent work.
  - Allow memory organization with maximum output left empty. Missing context capacity now points to the required model setting; maintenance failure logs include the stage and original cause.
  Startup and remote desktop fixes
  - Dismiss the mobile web startup splash when the workspace mounts. Login, connection recovery and error screens can become visible; module and React initialization failures offer an error message and retry.
  - Keep the Varin main window visible over capture-based remote desktop connections when opening Computer Use. Capture exclusion now applies to the Computer overlays themselves, preventing an invisible main window from continuing to block clicks.
  Source deployments: rebuild the application and Rust kernel together, then restart the Host. Recovery of affected tool calls uses their saved receipts during startup.
  Full changelog
