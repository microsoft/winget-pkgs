ReleaseNotes: Varin 0.9.32 主要更新了代码检索、对话阅读和设置体验。代码检索现在直接使用原生 Agent 调查流程，不再依赖预先建立的代码向量索引；聊天默认把回答放在前面，将执行过程收进可展开的实时活动中。同时，本版完善了结构化提问、计划编辑、项目信任和本地知识嵌入，并修复回答问题后的任务续接、Windows 长路径升级等问题。
