ShortDescription: An independent agent workspace and full harness for coding, research, and other project work.
Description: 'Varin is an independent agent workspace and full harness for coding, research, and other project work, centered on local and desktop experiences. It bundles the Pi runtime: the model and provider stack, session tree, package manager, and extension model remain Pi-owned, while Varin owns the surrounding tool environment, working state, recovery, retrieval, context policy, task governance, and workbench surfaces. Varin ships two first-party working shapes: an Agent Workspace centered on sessions, tasks, and context, and an IDE Workbench centered on editors, search, Git, diagnostics, and debugging with the agent as a dockable panel.'
