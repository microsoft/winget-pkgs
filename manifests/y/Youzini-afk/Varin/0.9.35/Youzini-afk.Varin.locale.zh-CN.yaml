ReleaseNotes: |-
  Varin 0.9.35 带来支持多会话的长期 Bot 助手、持续记忆整理、可选桌宠和 Host 用量面板，同时改进聊天呈现、任务续接、终端命令记录与清洁构建。
  长期助手与持续记忆维护
  - 每个 Bot 可以拥有多个独立会话，共用身份、记忆、家目录和日程。工作可以派发到工作台，用户随时查看原任务并直接介入。
  - 跟进持续事项，通过定向消息和续接复用已有 Agent。回报返回实际交办工作的会话；关注的普通任务继续保留自身身份。
  - 在后台整理已有记忆，支持合并、拆分、修订和概述。可以查看整理结果、取消维护、将历史理解恢复为新修订，以及停用或遗忘过时内容。
  - 整理沿已处理的原始位置和已生成结果继续，确认执行者停止后回收冗余输入与推理正文，主聊天保持可用。
  - 打开存储时，自动将受支持的 Catalog 格式 78、79 升级到 80，保留原有身份与记录。
  页面中的 Varin 与桌面陪伴
  - 加入新的 Bot 动态形象、跟随主题重点色的配色、工作表现，以及窗沿上的协作团队。Bot 面板集中展示各会话的概览、动态、记忆和日程。
  - 加入可选桌宠，提供绘制好的工作、休息和互动动画。可以选择关联的 Bot、查看派发任务，并在设置中唤醒或沉睡。
  - 桌宠素材改为按需下载，不再把全部图集放进安装包。设置中可管理已下载素材，切换主题复用同一份资源。
  - 减少场景重复构建、图集重复解码与活动查询；桌宠表现关联实际 Bot 归属与公开回复。
  用量、图片与会话导航
  - 新增设置 → 用量，查看当前连接 Host 的 Token、缓存统计与估算费用，支持导出 CSV 和配置模型价格。
  - Agent 引用的图片支持聊天内自适应图库、预览及打开原图。
  - 可以配置每完成多少轮完整的用户与 Agent 交流后自动更新标题。
  - 记住侧栏展开选择，子任务列表默认收起。修复 Bot 与工作台切换时反复播放过场的问题，未命名 Bot 会话使用 Bot 名称。
  执行与构建可靠性
  - 修复子任务来源尚未准备好时的续接取消、准备失败报告及向 Bot 回报，避免重复处理。
  - 修正权限调用校验和原始来源扩展捕获，保留来源归属、准确的批准身份和读者退出后的回收边界。
  - PowerShell 根据实际接受的命令生成记录，避免历史去重漏报；终端控制帧保留中文和 emoji，同时保留用户的 I/O 编码与历史回调。
  - 发布目标共享已核验的构建产物，失败重试保留已完成的产物，发布前检查源码身份和全部文件校验值。
  - 修复源码归档与 Docker 清洁构建；CLI 直接使用所选 Host 产物的声明，不再依赖开发目录中的类型缓存。
  - 更新 Electron、Capacitor 等运行依赖，包含 Wasmtime/Cranelift、minimatch/glob 安全修复，保留已有聊天动画和 Windows 安装器补丁。
  升级与平台说明
  - 新用量账本从格式升级后开始记录，旧回执不会补算到用量面板；显示费用依据模型价格估算，并非渠道账单。
  - 桌宠素材为可选下载，普通会话与工作台不依赖它。
  - 发布目标包括 Windows x64/ARM64、Linux x64/ARM64、macOS Apple Silicon，以及签名 Android APK。Android 沿用原发布密钥，连接 Varin Host 使用。Windows、macOS 产物仍未签名，macOS 产物未公证。
  Full changelog / 完整提交记录
