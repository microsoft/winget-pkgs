ReleaseNotes: |-
  Mobile conversations and pairing
  - Bot chats and the workbench now share the same navigation on phones. Open the conversation list or details, then return to the same chat. Tablets with enough room can show the list and conversation side by side.
  - Model and reasoning controls sit at the bottom right of the mobile composer. The desktop turn ruler is hidden on phones, giving messages more room. Conversation menus support touch, and the session drawer opens above the composer.
  - The pairing QR code uses a reachable LAN address, which you can also copy from the dialog. Fixed an Android connection-time crash on builds without Firebase push configuration.
  Bot execution and deployment
  - Ordinary Bot chat prepares built-in tools together and opens a work location when a tool needs it. File reads, terminal input and code search can use that location on demand. Local speech workers can be used again after an idle shutdown.
  - Desktop model discovery shows whether it found new models, found none, or found only models already in your list. Also fixed Bot model updates, attachment reads through a workspace, and external agents missing environment settings from their Host.
  - Browser and Computer services can run separately from the application Host. In the application Docker images, file tools can now use any mounted path accessible to the container user. Set VARIN_WORKSPACE_LOCKDOWN=true to restrict access to the workspace root.
  Knowledge stores
  - Varin now bundles TriviumDB 0.9.3 and its migration tool. Back up the data directory before upgrading. On first writable access, Varin converts older checkpoints alongside the originals and uses the converted store for subsequent writes.
  - If a TriviumDB 0.8 store has only its write-ahead log (WAL), Varin shows the affected path. Stop Varin, open that store on a writable backup copy with Varin 0.9.53, close it normally, then reopen the copy in 0.9.54. A 0.8 store with an existing checkpoint migrates directly. Backup and recovery
  Full changelog
