ReleaseNotes: |-
  更新摘要
  Varin 0.9.22 改善长时间运行、工具执行、索引维护和聊天交互，完善 Bot、多 Agent、多语言语音和提供商配置。本次发布包含截至 65dd3615 的更新。
  稳定性与性能
  - 修复首次启动时服务尚未就绪便进入初始化失败页面、需要手动重试的问题。
  - 防止慢速上下文和后台服务请求阻塞后续工具调用，保留取消与失败结果。
  - 稳定嵌入配置的索引身份；重启后复用未变化的内容，继续增量维护及中断的构建，减少无故重建。
  - 将原生索引存储移出桌面主线程，合并突发文件更新，减少流式聊天中的重复历史处理。
  - 修复开屏动画结束时的白屏闪烁，并改善聊天跟随底部的行为。
  聊天与任务操作
  - 调整文字排版和工具折叠显示，辅助操作与用量统计按整轮呈现；会话宽度支持调节。
  - 文件编辑实时展示绿色添加、红色删除及实际应用状态。
  - 快速检索使用统一卡片：运行时滚动展示进度，完成后预览来源片段，可展开查看。
  - 逐条管理排队消息，选择排队或补充当前任务；支持立即应用已准备的上下文摘要。
  - 加入聊天右键菜单和选中文本提取记忆；输入框与聊天列对齐，简化工作概览、工作目录提示和 Git 导航。
  项目、检索、模型与 Agent
  - 项目可命名并包含多个文件夹；后台索引按选择的目录维护，Bot 私有目录不参与索引。
  - 索引目录支持新增、暂停／恢复、检测更新和删除对应的索引资源。
  - 快速检索保留截止前取得的材料，改进候选准备、来源片段交付，以及未支持语言的文本覆盖。
  - 聊天、嵌入、重排、快速决策分别配置；自定义提供商可选择 API 格式，并为启用的能力拉取和导入模型。
  - 修复模型目录失败后的持续转圈，提供明确的失败状态与重试入口；改善无项目推理配置、嵌入重试和重排材料格式。
  - 用列表和详情编辑器管理内置、自定义及插件 Agent，配置启用状态、名称、模型、温度、提示词和工具。
  - 移除自动审阅触发与合并门禁，保留按需派发的审阅 Agent。
  Bot、电脑协作与语音
  - 独立 Bot 模式支持命名、置顶、重命名、档案与记忆管理、休眠／唤醒、归档／恢复及删除。
  - Bot 删除会停止所属工作并清理所属会话与生成资源，提供处理状态、错误和重试入口。
  - 分别绑定工作环境与电脑目标，支持跨环境文件操作、认证服务转发、桌面事件跟随和持久操作证据。
  - Chromium CDP 与 LibreOffice UNO 接入同一可见 Linux 桌面；Linux VM 和远端桌面仍为实验性能力。
  - 修复 Windows 电脑驱动的解包路径及 UTF-8 输出。
  - 新增 Whisper large-v3 Turbo、Qwen3-ASR 0.6B 和 SenseVoice Small；本地听写默认采用多语言 Whisper Turbo，支持语言选择并统一模型管理。
  运行时、安全与维护
  - 内置 Pi 升级至 1.0.0，接入原生运行时引用与图像用量统计。
  - 纳入 Wasmtime 48.0.4 及相关依赖安全修复，修正 Docker 构建中的 Pi 补丁装配。
  - 清理过时和重复测试、废弃辅助代码及重复构建流程，保留关键回归保护；修正原生验收中的目录别名、终端提示符与计时问题。
