ReleaseNotes: |-
  Release highlights
  Varin 0.9.22 improves long-running sessions, tool execution, indexing and chat interaction, with expanded Bot, Agent, multilingual voice and provider controls. This release includes changes through 65dd3615.
  Stability and performance
  - Wait for runtime readiness on first launch, preventing premature initialization failures that required a manual retry.
  - Prevent slow context and background-service requests from blocking subsequent tools, preserving cancellation and failure outcomes.
  - Stabilize embedding configuration identity, reuse unchanged index content after restart, and resume incremental maintenance and interrupted builds.
  - Move native index storage off the desktop main thread, coalesce file updates and reduce repeated history processing during streaming.
  - Fix the white flash after the splash animation and improve chat following near the bottom.
  Chat and task controls
  - Refine typography and compact tool disclosures; show actions and usage once per turn and make conversation width adjustable.
  - Stream file additions and deletions with their actual application status.
  - Present quick retrieval in one expandable card, with live progress and source previews after completion.
  - Manage queued messages individually, choose queueing or steering, and apply prepared context summaries immediately.
  - Add chat context menus and memory extraction from selected text; align the composer with the chat column and simplify the work overview, directory hints and Git navigation.
  Projects, retrieval, models and Agents
  - Create named projects with multiple folders and index selected directories. Bot-private directories stay outside the index.
  - Add, pause, resume, check and remove index directories, including their generated index resources.
  - Preserve retrieval material obtained before deadlines; improve candidate preparation, source-window delivery and text coverage for unsupported languages.
  - Configure chat, embedding, reranking and fast-decision capabilities independently, select custom API formats, and discover or import their models.
  - Replace failed model-catalog spinners with explicit failure and retry states; improve projectless inference, embedding retries and reranker document formatting.
  - Manage built-in, custom and plugin Agents in a list/detail editor, including enablement, names, models, temperature, prompts and tools.
  - Remove automatic review triggers and merge gates while keeping review Agents available on demand.
  Bots, desktop cooperation and voice
  - Dedicated Bot mode supports naming, pinning, renaming, profile and memory management, sleep/wake, archive/restore and deletion.
  - Bot deletion stops owned work and removes owned sessions and generated resources, with progress, errors and retry controls.
  - Bind work and computer targets independently, with cross-environment file operations, authenticated service forwarding, desktop follow-ups and durable operation evidence.
  - Connect Chromium CDP and LibreOffice UNO to the same visible Linux desktop. Linux VM and remote desktop features remain experimental.
  - Fix unpacked Windows driver paths and UTF-8 output.
  - Add Whisper large-v3 Turbo, Qwen3-ASR 0.6B and SenseVoice Small; default local dictation to multilingual Whisper Turbo with language selection and unified model management.
  Runtime, security and maintenance
  - Upgrade bundled Pi to 1.0.0, integrating native runtime references and image usage reporting.
  - Include Wasmtime 48.0.4 and dependency security fixes, and repair Pi patch staging in Docker builds.
  - Remove obsolete and duplicate tests, unused helpers and repeated builds while preserving meaningful regressions; fix native acceptance issues involving directory aliases, terminal prompts and timing.
