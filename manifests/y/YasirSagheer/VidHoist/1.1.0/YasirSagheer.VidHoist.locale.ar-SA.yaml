Description: |-
  ينزّل VidHoist الفيديو والصوت من الويب بمحرّك yt-dlp المدمج في التطبيق. الصق الرابط واختر الجودة، فيصير الملف لك: في مكتبة تشغّله، وتعرض ترجمته، وتقرأ نصّه معك، وتجد المقطع بأي كلمة قيلت فيه لا بعنوانه فقط.
  بلا حساب ولا خادم ولا إعلانات ولا تتبّع. باثنتي عشرة لغة، والعربية من اليمين أولاً، نهاراً وليلاً.
