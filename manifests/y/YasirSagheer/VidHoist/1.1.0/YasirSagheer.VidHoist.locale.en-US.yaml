ShortDescription: Download video and audio with yt-dlp built in, and find any clip by what was said.
Description: |-
  VidHoist downloads video and audio from the web with yt-dlp built into the app. Paste a link, pick a quality, and the file is yours: in a library that plays it, shows its subtitles, reads its transcript along with you, and finds the clip by anything that was said in it, not only by its title.
  No account, no server, no ads, no tracking. In twelve languages, right-to-left first, by day and by night. A companion Android app pairs with it over the local network.
