ReleaseNotes: |-
  Installation Discord Donate Documentation Nightly Master
  A description of the various files is in the README
  The zipimport Unix executable and release tarball contain code licensed under ISC and MIT. The PyInstaller-bundled executables are subject to these and other licenses, all of which are compiled in THIRD_PARTY_LICENSES.txt
  Important changes
  - The minimum required Python version has been raised to 3.11
    - Python 3.10 has reached its end-of-life as of October 2026, and yt-dlp has now removed support for it. Read more
  - The official Windows release binaries now require Windows 10 or later. Read more
  - Security: The recent brotli and certifi vulnerabilities have now been fully addressed in the executables
    - The brotli package bundled with the executables has been upgraded to version 1.2.1, and the curl-cffi package has been upgraded to version 0.17.0. These upgrades address the recent brotli security vulnerability
    - curl-cffi 0.17.0 also fully addresses the recent certifi security vulnerability that was already partially addressed by upgrading the certifi package bundled with the executables
  Changelog
  Core changes
  - Remove Python 3.10 support (#17160) by bashonly, doe1080, Grub4K
  Extractor changes
  - odnoklassniki: Fix boosty direct link extraction (#17749) by bashonly
  Networking changes
  - Request Handler: curl_cffi: Support curl_cffi 0.17.x (#17929) by bashonly (With fixes in 15262b0)
  Misc. changes
  - build
    - Always use latest Python version on Windows (#17901) by bashonly
    - Update 13 dependencies (#17924) by bashonly, dlp-bot
    - Update 3 dependencies (#17933) by dlp-bot
  - ci
    - Test with PyPy 3.12 (#17926) by gamer191
    - Update 7 actions in 9 workflows (#17925) by bashonly, dlp-bot
  - cleanup: Miscellaneous: 7e3644c by bashonly, doe1080
  - docs: Add changelog entries for dropping Py3.10 & Win8 support (#17889) by bashonly
