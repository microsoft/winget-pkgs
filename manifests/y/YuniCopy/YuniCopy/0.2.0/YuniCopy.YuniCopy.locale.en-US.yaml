ShortDescription: Windows file-copy utility that verifies every file and never lets one failure abort the batch
Description: |-
  YuniCopy copies files and proves it: every destination file is read back
  from the device and verified against the source, a failed file never
  aborts the rest of the batch, and interrupted copies leave no half-written
  files under real names. Native Win32 GUI plus a console tool (yunicopy),
  free and open source with no tiers or telemetry.
