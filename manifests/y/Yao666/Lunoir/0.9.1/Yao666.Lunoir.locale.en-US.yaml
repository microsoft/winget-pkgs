ReleaseNotes: |-
  Aspect ratio presets fit the frame instead of stretching to it
  Right-click › Aspect now crops the picture into the ratio you pick, from the centre,
  rather than stretching it to that shape. The picture keeps its own proportions:
  - A 4:3 film into 16:9 — the top and bottom are cut away, the picture fills the width.
  - A 2.35:1 film into 16:9 — the sides are cut away, the picture fills the height.
  - Default puts the whole frame back.
  - Stretch to fill is untouched — it stays the one option that deliberately distorts.
  Windowed, the window takes the shape you picked, so the cut isn't immediately undone by
  black bars on the other axis. Your choice carries across files and is recalculated for
  each one.
