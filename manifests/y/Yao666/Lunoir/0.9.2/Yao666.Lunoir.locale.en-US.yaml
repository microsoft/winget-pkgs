ReleaseNotes: |-
  What's new
  Video viewer
  - Ctrl+wheel to zoom — scale the picture from 25% to 800% without touching the original file. Zoom level shows as a brief OSD.
  - Drag to pan — while zoomed in, left-drag to move around the frame. Playback pauses during the drag and resumes on release so the pan stays smooth.
  - Ctrl+double-click to reset — snaps back to 1× and recentres in one gesture. Zoom and pan also reset automatically when you open a new file.
  File info overlay
  - Press i to open a compact info panel over the video. Shows:
    - Container format, duration, file size, overall bit rate
    - Video: codec, resolution, frame rate, video bit rate, bit depth, colour space, HDR type
    - Audio: each track with format name, channel layout (5.1 / 7.1 / …), and per-track bit rate
  - Click the background or press i again to close.
  External audio tracks (merged from community PR)
  - Add audio… button in the Audio panel — load an external audio file (.flac, .dts, .truehd, .ac3, and more) and switch to it without interrupting playback position.
  - The selected track (embedded or external) is remembered per file and restored automatically on reopening, before the resume seek.
  Fixes
  - Zoom and pan reset correctly when switching files.
  - Channel count display in the info overlay now shows surround layout labels (5.1, 7.1) instead of raw channel counts (6.0, 8.0).
