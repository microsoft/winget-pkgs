ShortDescription: Lunoir Media Player
Description: Lunoir is a modern, frameless, frosted-glass media player for Windows, built on an mpv core (Dolby Vision / HDR10 / HDR10+, 10-bit). Frame-accurate playback, Live TV / IPTV with recording, an experimental Timeline for stitching and trimming a folder of clips, subtitle styling, and 9 interface languages. Open source (MIT), no telemetry.
