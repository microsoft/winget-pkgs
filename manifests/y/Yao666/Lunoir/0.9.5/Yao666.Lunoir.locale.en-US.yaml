ReleaseNotes: |-
  What's new
  Subtitles
  - Per-file subtitle choice is remembered (embedded, external, or off), including attached files after a reopen.
  - New Subtitle encoding setting for external text subtitles (Windows-1251, GB18030, Big5, Shift_JIS, and others). UTF-8 is still recognized first. Reopen the video to apply a change to already-loaded subtitles.
  - Optional black subtitle background with adjustable opacity for unstyled text subtitles. Off by default; ASS/SSA keep their own styles.
  Audio
  - Attached external audio files stay available when you switch to an embedded track.
  Playback
  - Arrow keys no longer fight a focused volume or seek slider (volume jumping by 6, seeking appearing stuck).
  - Frame-step is one frame per tap.
  - Double-click the title bar to maximize and restore, without the window flashing past the taskbar.
  Thanks to max-wolf-cpp for the subtitle, audio, encoding, background, and shortcut work.
