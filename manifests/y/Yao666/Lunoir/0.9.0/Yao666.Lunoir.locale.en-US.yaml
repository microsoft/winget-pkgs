ReleaseNotes: |-
  Controls can live at the bottom edge
  Settings › Interface › Controls style offers a second arrangement. The floating pill
  over the picture is still the default and hasn't changed.
  Pick Docked and the controls become a full-width bar along the window's bottom edge:
  - It doesn't cover the picture. Windowed, the video gives up that strip — the same way
    it already makes room for the title bar at the top.
  - It doesn't hide. There's nothing underneath it to uncover, so it stays put; the
    right-click menu and the 收藏 overlay no longer dismiss it either. Fullscreen still
    auto-hides on the delay you've set, as before.
  - The window grows to make room, so the picture keeps the size it had. If there's no
    room left to grow — already filling the screen, or maximized — the video yields the
    strip instead.
  - One row, so it costs about half the floating pill's height: transport on the left,
    then the seek bar, volume, the format marks, and the menu buttons. The seek bar is the
    only part that stretches, so it always runs the full width available.
  Dragging the window's bottom edge and bottom corners still resizes it, and the bar fades
  in place rather than zooming into view.
  Clearing your recent list
  收藏 › Recent has a Clear button, next to the close button. It asks for a second click
  before it does anything — the history isn't recoverable once it's gone.
  Fixed
  - A window could come up empty. On the first launch after starting a dev build, the
    controls sometimes appeared as a blank frosted strip. Any window whose interface fails
    to start now reloads itself instead of sitting there empty.
