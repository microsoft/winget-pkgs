ReleaseNotes: |-
  What's new
  Native right-click editing in every text field
  - Text inputs now show the standard Cut / Copy / Paste / Select All menu on right-click. This covers the URL box (Home and the playback overlay), the User-Agent field, the playlist search and value fields, settings inputs and the library rename field. Electron doesn't draw Chromium's edit menu on its own, so those right-clicks used to do nothing.
  - Right-clicking inside a text field no longer closes the URL box or flips the screen — the edit menu simply works, in the main window, both side panels and the library window alike.
  Home: right-click anywhere opens the URL box
  - Right-click on any empty spot of the home screen to switch between the Open File and URL surfaces — previously only the Open File button carried that gesture, which got easy to miss.
  - The URL surface now shows a hint so the way back is discoverable: Right-click anywhere to go back to Open File.
  - Home hint updated to: Double-click for a folder · Right-click anywhere for a URL.
  Merged from community PR (thanks max-wolf-cpp)
  - Local & saved playlists resume properly (#2):
    - Local M3U playlists are parsed into the regular playback queue
    - Relative playlist entries resolve against the M3U's own location
    - Reopening a local or saved playlist restores its last active item — the existing per-file position memory then resumes that item at its saved timestamp
    - M3U files are now offered by the media file picker
  - yt-dlp rename retry: Windows Defender can briefly hold a just-downloaded .part file, making the rename fail with EPERM — the rename now retries with backoff, and the real error is logged so future failures stay diagnosable.
  Housekeeping
  - Fixed the i18n-check placeholder validation (CRLF files made it read every placeholder as absent); all nine locales verify clean again.
