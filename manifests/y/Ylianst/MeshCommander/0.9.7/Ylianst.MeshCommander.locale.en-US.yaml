ShortDescription: An Intel® Active Management Technology (Intel® AMT) remote management tool
Description: >
  It's feature rich and includes a built-in remote desktop viewer for Hardware-KVM, a
  Serial-over-LAN terminal, IDER-Redirection support and much more. MeshCommander is built on web
  technologies and runs on many platforms. In addition to being available as a stand-alone tool,
  MeshCommander was built to be very space efficient so that it can be uploaded into Intel AMT flash
  space to have it served directly from the Intel AMT web server. There are different ways to
  install and use MeshCommander.
