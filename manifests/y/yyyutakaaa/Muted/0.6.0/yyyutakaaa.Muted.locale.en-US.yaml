ShortDescription: Local RNNoise noise suppression for your microphone, before Discord, Teams or your game hears it.
Description: |-
  Muted runs your microphone through RNNoise on your own PC and sends the cleaned voice into a
  virtual audio cable, so any call app or game can use it as a microphone. It also offers echo
  cancellation, a voice gate, push to talk, voice presets and a guided voice calibration.
  No account, no cloud, no telemetry.
