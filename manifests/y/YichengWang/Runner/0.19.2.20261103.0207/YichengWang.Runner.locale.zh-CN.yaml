ReleaseNotes: |-
  Runner 0.19.2 是 macOS、Windows 和 Linux 上基于 0.19.1 的修复版本。
  新功能
  - 终端内查找。 在聊天 pane、终端、mission slot 或 mission 抽屉终端中按 ⌘F（Windows 和 Linux 上为 Ctrl+Shift+F），即可搜索其回滚内容。匹配项会高亮显示，Enter 和 ⇧Enter 在匹配项之间跳转，Esc 会让终端回到查找前的位置。在 Windows 和 Linux 上，Ctrl+F 仍会发送给 shell。快捷键可在 Settings → Keyboard shortcuts 中修改。(#897)
  - New chat 更名为 New tab。 启动器可以启动聊天、终端和 mission，因此侧栏条目、Recents 菜单、命令面板和 Settings → Shortcuts 现在都称其为 New tab。启动器页面显示时，其项目或 Recents 下会出现一条虚线 New tab 行；点击页面的 ×、该行的 × 或按 ⌘W 都可以关闭页面。(#1117)
  - Settings 新增 Cloud 分组。 Account 和 Remote access 移入独立的 Cloud 分组，位于 Integrations 和 System 之间。(#1101)
  问题修复
  - 在远程电脑上切换聊天不再重放整个屏幕。 切回远程聊天时，agent 会重新输出全部历史，画面出现一阵疯狂翻页。现在，已打开 tab 中的聊天会保持连接，即使收到重绘也只绘制一次。(#1025)
  - Codex mission slot 重启后可以恢复。 来自 slot 未跟踪对话的 Codex SessionEnd 可能会替换其保存的对话，之后 Resume slot 会报错 "No saved session found"。(#1109)
  - 通知确认后 mission 消息不再被卡住。 Claude Code 成员的上一条收件箱通知被确认后，它可能长时间停留在 Unsent，直到 pane 重绘。(#1125)
  - Windows 上 mission 成员的多段消息会完整送达。 在 Windows 上，Codex 成员通过 runner msg post 发送的消息之前只保存了第一段。(#1107)
  - runner mission answer 会拒绝不在待回答状态的问题。 回答未知或已回答的 ID 现在会报错并列出待回答的 ID，而不是被静默丢弃。成员的 ask_human 事件 ID 也可以使用。(#1121)
  - 两个 Runner 构建不再互相替换 daemon。 当 Runner 发现另一个构建正在使用同一份数据时，会提示你先退出那个构建，而不是停止它的 runnerd 并挂断其会话。(#1116)
  - runnerd 重启后保留 agent 用量。 执行 Quit & Stop Sessions、更新或重启电脑后，侧栏底部的用量标签和 Usage 弹窗会保留上次的数据，而不是在下次获取前一直显示 Checking…。(#984)
  - 聊天与终端分屏时侧边面板保持打开。 聚焦终端 pane 不再关闭聊天的侧边面板。(#1111)
  - 远程 Roles 和 Crews 页面不再透明。 使用 Glass 窗口材质时，远程电脑的 Roles 和 Crews 页面会透出桌面。(#1132)
  - Remote access 中已配对的手机显示为手机。 之前它们会显示为以指纹命名的未知电脑。(#1122)
  - 模型选择器的高亮项保持可见， 用方向键浏览长列表时不会滚出视野。(#1066)
  - 侧边面板的拖动手柄位于面板边框上， 开始拖动时边缘不再跳动。(#1123)
