ReleaseNotes: |-
  Runner 0.16.7 is a feature release for macOS and Windows on top of 0.16.6.
  New
  - Collapsible Active groups. In the sidebar's Active view, select the Chats, Missions or Terminals heading to collapse or expand that group, as you can with Projects. Runner remembers which groups are collapsed, and ⌘1–9 number only the rows you can see. (#887)
  Bug fixes
  - The usage footer is back to its 0.16.5 layout. The sidebar footer again shows weekly usage for every installed, enabled provider, Antigravity included, spread across the control, and the extra line above the footer is gone. (#963)
  - The New chat row no longer looks selected. Since 0.16.6, the sidebar's New chat row kept a border at rest. It now shows the border only on hover again. (#959)
