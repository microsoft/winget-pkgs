ReleaseNotes: |-
  Runner 0.16.7 是 macOS 和 Windows 上基于 0.16.6 的功能版本。
  新功能
  - “活跃”视图的分组可以折叠。 在侧边栏的“活跃”视图中，点击“聊天”“任务”或“终端”标题即可折叠或展开该分组，和“项目”一样。Runner 会记住哪些分组已折叠，⌘1–9 只为可见的行编号。 (#887)
  问题修复
  - 用量显示恢复为 0.16.5 的布局。 侧边栏底部重新显示所有已安装并启用的服务商的每周用量（包括 Antigravity），并在整个控件内均匀分布；底部上方多出的那条线也已去掉。 (#963)
  - “新建对话”一行不再看起来像已选中。 从 0.16.6 起，侧边栏的“新建对话”一行在未悬停时也带有边框。现在恢复为仅在悬停时显示边框。 (#959)
