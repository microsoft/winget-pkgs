ReleaseNotes: |-
  Runner 0.16.1 is a feature release for macOS and Windows on top of 0.16.0.
  New
  - Desktop notifications when an agent needs you. While Runner is in the background, it notifies you when a chat needs your input, finishes a turn, or fails. Clicking a notification takes you to that chat or mission, and Runner clears it once you look at the session. Choose which events notify you in the new Settings → Notifications pane: chat notifications are on by default, and mission notifications (a crew member asks you a question, needs your input or fails, or the whole mission goes idle) are off until you turn them on. On macOS, Runner asks for permission when it launches; banner style and sound stay in System Settings → Notifications → Runner. (#701, #891)
  - OpenCode v2 support. OpenCode joins the agents you can run in chats, roles and crews, with resume by exact session, its own model and effort choices, and Skills and MCP settings. Fork, usage and update controls are not available for OpenCode yet. (#876)
  - Newest first within a project. A new tab or mission created inside a project or in Recents now appears at the top of its list. Dragging still reorders, and existing rows keep their order. (#884, #892)
  - Direct's agent picker remembers what you use. The Start Chat picker lists recently started agents first and opens on the last one you started; the Settings default applies until you have started one. (#894)
  Bug fixes
  - Pasting a large image no longer disconnects Runner. Image paste now lets the agent read the clipboard itself instead of sending the image through Runner's background service, so a large image cannot drop the connection, and TIFF-only clipboard images paste too. Any other oversized request now fails on its own instead of disconnecting every pending call. (#877, #880)
  - MCP servers set up differently per agent are no longer flagged. Settings → MCP drops the amber warning for servers whose definitions differ between agents, such as per-agent arguments, and editing one agent's entry no longer turns on Also update for agents whose entry differs. (#895)
