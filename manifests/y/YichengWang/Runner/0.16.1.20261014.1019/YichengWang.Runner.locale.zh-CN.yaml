ReleaseNotes: |-
  Runner 0.16.1 是 macOS 和 Windows 上基于 0.16.0 的功能版本。
  新功能
  - 智能体需要你时发送桌面通知。 Runner 在后台时，聊天需要你输入、完成一轮回复或失败时会通知你。点击通知会跳转到对应的聊天或任务，你查看该会话后 Runner 会清除这条通知。可以在新的 Settings → Notifications 面板中选择哪些事件需要通知：聊天通知默认开启；任务通知（成员向你提问、需要你输入或失败，或整个任务进入空闲）默认关闭，需要手动开启。在 macOS 上，Runner 启动时会请求通知权限；横幅样式和声音仍在 System Settings → Notifications → Runner 中设置。 (#701, #891)
  - 支持 OpenCode v2。 OpenCode 现在可以用于聊天、角色和团队，支持按确切会话恢复、使用其自身的模型和推理强度选项，以及 Skills 和 MCP 设置。OpenCode 暂不支持分叉、用量和更新控制。 (#876)
  - 项目内最新的排在最前。 在项目或 Recents 中新建的标签或任务现在会出现在列表顶部。拖动仍可调整顺序，已有条目保持原有顺序。 (#884, #892)
  - Direct 的智能体选择器会记住你的使用习惯。 Start Chat 选择器会把最近启动过的智能体排在前面，并默认选中你上次启动的那个；在你启动过任何智能体之前，仍使用 Settings 中的默认设置。 (#894)
  问题修复
  - 粘贴大图片不再导致 Runner 断开连接。 粘贴图片时，现在由智能体直接读取剪贴板，不再经由 Runner 的后台服务传输图片，因此大图片不会再导致连接断开，仅含 TIFF 格式的剪贴板图片也可以粘贴。其他超大请求现在只会让该请求本身失败，不会断开所有待处理的调用。 (#877, #880)
  - 不同智能体配置不同的 MCP 服务器不再被标记。 Settings → MCP 不再为各智能体定义不同的服务器（例如各智能体自己的参数）显示琥珀色警告；编辑某个智能体的条目时，也不再为定义不同的智能体默认开启 Also update。 (#895)
