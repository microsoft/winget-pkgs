ReleaseNotes: |-
  Runner 0.16.8 是 macOS 和 Windows 上基于 0.16.7 的功能版本。
  新功能
  - 任务动态流新增滚动条。 任务动态流现在显示与侧边栏和设置相同的滚动条，在很长的任务里也能看到当前位置，并拖动到任意位置。 (#947)
  - 智能体读取消息的提示更清楚。 智能体用 runner msg read --since 或 --from 读取消息后，如果仍有未读消息，CLI 会提示还剩多少条未读，以及如何用不带参数的 runner msg read 清空。智能体指引和使用指南也说明了两者的区别。 (#965)
  问题修复
  - 很长的任务动态流不再卡顿。 随着动态流变长，滚动、在动态流输入框中打字以及新事件到达都不会再变慢，包括超长的消息和同一智能体连续发出的大量消息。 (#962)
  - 恢复的任务可以继续运行。 在 Settings → Archived 中恢复任务，或使用 runner mission unarchive，现在会重新开启该任务：成员保持停止状态，直到你选择“恢复”；消息重新可用，动态流也会标记这次重新开启。之前恢复的任务虽然回到侧边栏，却无法继续运行。 (#890)
  - 在符号链接文件夹中，pi 成员能接着原来的对话继续。 当任务所在文件夹是通过符号链接访问的时，已经工作过的 pi 成员在恢复时可能丢失对话并从头开始。现在会从上次中断处继续。 (#971)
  - “活跃”视图的行不再跳动。 智能体开始、结束、请求批准或产生新输出时，“活跃”视图中的行不再来回移动。每个分组按创建顺序排列，⌘1–9 始终对应同一行。 (#972)
