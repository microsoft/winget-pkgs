ReleaseNotes: |-
  Runner 0.17.0 是 macOS 和 Windows 上基于 0.16.8 的功能版本。
  新功能
  - 多个 Claude Code 账户。 保持多个账户分别登录，并在 Settings 或用量菜单中选择当前账户。新聊天和任务使用该账户；已有会话可通过停止后恢复来切换账户，并保留对话历史。每个账户分别显示用量。 (#955)
  - 可选的配置共享。 让其他账户使用主账户的记忆、技能、代理、命令、已启用插件、设置和 MCP 服务器。各账户的登录和对话历史保持独立，本地技能和插件状态也会保留。 (#955)
  - 独立的代理设置页。 每个代理都有自己的设置页，集中管理可执行文件、默认设置和更新；Claude Code 页面还包含账户管理。 (#955)
