ReleaseNotes: |-
  Runner 0.17.0 is a feature release for macOS and Windows on top of 0.16.8.
  New
  - Multiple Claude Code accounts. Keep separate accounts signed in and choose the active account from Settings or the usage menu. New chats and missions use that account; stop and resume existing sessions to switch them while retaining conversation history. Usage is shown per account. (#955)
  - Optional shared configuration. Let another account use your main account's memory, skills, agents, commands, enabled plugins, settings and MCP servers. Sign-ins and conversation histories stay separate, and local skills and plugin state are preserved. (#955)
  - Dedicated agent settings pages. Each agent now has its own page for executable, defaults and update controls, with Claude Code account management alongside them. (#955)
