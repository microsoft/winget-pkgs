ReleaseNotes: |-
  Runner 0.20.4 is a feature release for macOS, Windows and Linux on top of 0.20.3. It unifies Markdown rendering across the app with code block headers, copy, wrap and syntax highlighting, brings remote mission role management and smarter terminal file-link detection, makes the latest chat name win between Runner and the agent, and adds file-viewer scrollbar lanes and platform fixes.
  New
  - Unified Markdown renderer across the app. Mission feed messages, question cards, role and crew prompt previews, Settings → Skills previews, and the Info popover's System prompt now share the Files Markdown renderer, bringing CommonMark emphasis, nested lists, task checkboxes, H4–H6 headings, multi-line blockquotes, wrapped tables and code lines, and row-aligned selection and copy. (#1342)
  - Code block headers with language, wrap toggle, copy and syntax highlighting. Fenced and indented code blocks in Files and every Markdown surface now display a header bar with the language label and hover-revealed Wrap lines and Copy code buttons (with a Copied confirmation). Unwrapping a block adds a shared horizontal scrollbar, and compact surfaces such as the mission feed and prompt previews now highlight code syntax. (#1444)
  - Add and remove mission roles from a remote window. Connected remote windows can now add roles from the host's catalog (including handle, runtime, model, effort, speed and task overrides) via the Sessions rail or empty-roster feed card, and remove active mission members with confirmation. (#1235)
  - Smarter terminal file-link detection across agent CLIs. Terminal links now join hard-wrapped paths across lines, handle Unicode paths, balanced parentheses/brackets, spaces (with continuous underline), @ / a/ / b/ prefixes, and line/column ranges (:LINE-END, #L…C…, (LINE)), recognize vscode://, vscode-insiders://, cursor://, windsurf:// and zed:// file URIs plus OSC 8 bare paths, and resolve relative paths against the folder chosen in Files. (#1452)
  - Chats show their latest name, from Runner or the agent. Renaming a chat in Runner or inside the agent (/rename, /name) now displays whichever name arrived last — including for role chats — while ignoring replayed titles on attach, resume or fork and keeping terminal and mission-member names unchanged. (#1442)
  - Codex TUI workspace launch option (off by default). Added a TUI workspace switch under Settings → Agents → Codex → Launch (default Off, passing -c features.tui_workspace=false to interactive Codex chats and missions without modifying ~/.codex/config.toml). (#1451)
  Bug fixes
  - File viewer scrollbars stay off the code, and rendered Markdown gains a scrollbar. Code and Diff views (unified and split) now reserve a dedicated 10 px lane on scrolling axes so the rounded 4 px scrollbar thumb never covers text, line numbers, find highlights or the Mark viewed footer, while diff row tints still reach the edge. Rendered Markdown pages in Files now carry the same scrollbar in their right margin. (#1475)
  - Antigravity chat titles no longer roll back to stale summaries. Runner now tracks last_modified_time per Antigravity conversation and coordinates with live OSC titles so background agy summary reconciliation (such as /usage probes or new sessions) cannot revert a newer title or manual Runner rename, while restoring the trusted title when returning to an earlier conversation via /resume. (#1472)
  - Improved ANSI blue contrast in the Runner dark terminal palette. Updated ANSI Blue (ansi[4]) in the Runner dark theme from #39E5FF (which duplicated Cyan) to One Dark blue (#61AFEF), improving contrast for bright-white selection backgrounds and Powerline prompts while keeping Blue distinct from Cyan. (#1470)
  - Windows: full-bleed taskbar icon with a native 24 px entry. Regenerated assets/icon.ico from vector with a full-bleed rounded tile and all five standard Windows icon sizes (16, 24, 32, 48, 256 px) instead of downscaling macOS's Dock-padded icon, so Runner matches adjacent taskbar icons at 100% DPI. (#1426)
  - Windows and Linux: stopped injecting macOS-only LC_CTYPE=UTF-8. Restricted the bare LC_CTYPE=UTF-8 locale fallback to macOS so Git for Windows' MSYS2 less and glibc Linux environments no longer reject the BSD locale name and display <XX> byte escapes for UTF-8 branch names and logs. (#1433)
  - Side panel card corners stay rounded around the file viewer. Fixed square viewer fills, inner-panel border alignment, zoomed tab-strip fades and bottom clearance so docked chat panels, overlay sheets, mission rails and archived chat panels keep clean rounded corners across themes and display scales. (#1440)
  - Tighter island spacing and sidebar footer buttons. Narrowed gaps between workspace islands to 4 px and outer margins to 6 px (preserving macOS's 8 px top margin and fixing Windows/Linux initial terminal row estimates), and tightened the sidebar footer's host and settings buttons to 28 px with a 4 px gap. (#1438, #1453)
  - Missing label in the Files menu. Added the missing English (Choose another folder…) and Simplified Chinese (选择其他文件夹…) labels for the Files ⋯ menu item that previously displayed ui.choose_another_folder. (#1464)
