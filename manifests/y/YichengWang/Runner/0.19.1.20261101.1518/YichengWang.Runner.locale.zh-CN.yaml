ReleaseNotes: |-
  Runner 0.19.1 是 macOS、Windows 和 Linux 上基于 0.19.0 的修复版本。
  新功能
  - 从启动器启动 Mission。 Mission 快捷项、命令面板、crew 页面以及项目或 Recents 上的 + 现在都会打开启动器页面：选择一个 crew，填写可选的目标，然后在所选项目和文件夹中启动。New mission 对话框已移除，打开启动器也不再创建空 tab。Mission 标题取自目标的第一行，没有目标时使用 crew 名称和日期。(#1097)
  - runner mission start 需要 --title。 通过 CLI 启动 mission 的脚本和 agent 现在需要传入标题。(#1097)
  - Claude Code 成员在轮次进行中也能再次收到消息。 自 0.19.0 起，每条 mission 收件箱通知都要等成员变为 Idle 才投递。Claude Code 会把轮次进行中输入的内容排队，因此正在工作的 Claude Code 成员现在会立即收到新消息，并在下一步读取。Codex 和其他运行时仍会等待 Idle；终端中的草稿或最近的输入仍会阻止投递。(#1103)
  - 侧栏底部改回设置齿轮。 侧栏底部的账号头像改回 Settings 齿轮：单击（或 ⌘,）即可打开 Settings，无论是否登录。登录和退出仍在 Settings → Account 中。Settings → General → Local only 已移除，Account 和 Remote access 会始终列出；退出登录时，正在显示其他电脑的窗口会切回本机。(#1099)
  问题修复
  - 在空闲 agent 中按 Return 不再卡住其收件箱。 在 0.19.0 中，如果在空闲 mission 成员的终端里按下的 Return 没有开始新轮次（例如在空输入框上），该成员会一直显示 Busy，之后的收件箱通知都无法送达。现在，提交后若没有开始新轮次，Runner 会在约 10 秒后将其恢复为 Idle。若通知在两分钟后仍因卡住的 Busy 而无法投递，mission 动态中会显示警告。(#1102)
  - 提前退出后 Resume 会保留对话。 Resume 后立即退出时，除非运行时确认对话已不存在，否则不再清除聊天的对话，下次 Resume 会再次尝试同一对话。此问题主要影响 Codex。(#1028)
