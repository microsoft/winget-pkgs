ReleaseNotes: |-
  Runner 0.18.3 是 macOS、Windows 和 Linux 上基于 0.18.2 的功能版本。
  新功能
  - 开始前选择项目。 New chat 和 New mission 现在可以在填写工作目录时选择项目。项目选择会跟随匹配的目录变化，保留 worktree 路径和明确选择的 No project，并在目录位于所选项目之外时提示。添加到 pane 的聊天归入其 tab 的项目。(#968)
  - 每位 mission 成员共享目标。 Crew 不再要求指定 lead：每位成员都会收到目标、团队约定和自己的 brief，任何成员都可以被移除。runner ask "<question>" 现在直接向你提问；--human 仍可作为别名使用。(#873)
  - 终端内手动启动的 agent 也能显示状态。 在终端 tab 中手动启动的兼容程序，现在可以通过 Program Status Protocol（OSC 7501）报告 Working、Idle 和 Needs you，即使其 pane 当前不可见。已有 agent hook 的状态仍优先使用。(#861)
  - 简体中文用户指南。 完整用户指南现已提供简体中文版本，主题与导航和英文版保持一致。CLI 命令和自动生成的帮助仍使用英文。(#1058)
  问题修复
  - Codex 等待输入时显示 Needs you。 Runner 现在能识别 Codex 原生的审批和问题等待，不再一直显示 Working；Codex 报告继续运行后，等待状态会随之解除。(#1008)
  - 远程侧栏记住上次视图。 切换电脑再返回时，现在会恢复每台远程电脑的 Show all / Show active only 选择，以及分区、项目和 Active 分组的折叠状态，各窗口独立记忆。(#1047)
  - 未提交的收件箱通知不再卡住后续投递。 如果收件箱通知的 Return 未生效，Runner 会识别自己输入的文本并重试提交，不会再叠加输入第二条通知。持续较久的投递阻塞现在会产生 mission 警告，可通过 runner mission show 查看。(#1075)
  Nightly 渠道
  - 每次合并 pull request 后，现在会自动触发 macOS、Windows 和两种 Linux 架构的 nightly 构建。共享的 nightly 预发布页面和更新渠道保持不变。
