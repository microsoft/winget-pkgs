ReleaseNotes: |-
  Runner 0.16.5 是 macOS 和 Windows 上基于 0.16.4 的功能版本。
  新功能
  - 任务消息可以同时发给多位成员。 在任务的消息输入框开头输入 @ 并选择一位成员，即可添加一个收件人标签；重复操作可选择多位成员。点击标签可将其移除，在草稿为空时按 Backspace 会移除最后一个标签。只有收件人会收到收件箱通知，其他成员的工作不会被打断。没有收件人的消息仍会发给整个团队，正文中间的 @ 提及只作为普通文本。在 CLI 中，可以重复使用 --to，或在消息开头写提及：runner msg post "@coder, @reviewer: please check the parser." (#826)
  - 智能体只读取新消息。 runner msg read 现在只显示未读的收件箱消息，后面附上一段简短摘要，列出其他成员之间互发的消息。--all 显示加入以来的全部团队消息，--since 和 --from 可用于筛选历史。团队成员不必再花上下文重读旧消息。 (#826)
  - 把文件拖到终端上。 从访达（Finder）或文件资源管理器中把文件拖到对话窗格、抽屉终端或任务成员的终端上，即可在提示符处插入它们的路径，引号处理与粘贴文件时相同。文件悬停在终端上方时终端会高亮，松开后终端获得焦点；在你按下回车之前不会执行任何内容。 (#898)
  问题修复
  - 任务消息不再丢失或停留在未发送状态。 此前，发给团队成员的消息可能在智能体仍在启动时被输入，然后停留在输入框中没有发送；也可能被输入到你留在那里的草稿里；或在 Runner 后台服务重启时丢失。现在 Runner 会保留每条消息直到成员收到，确认智能体已经提交，并会在你有未发送的草稿时等待。如果消息仍未提交，任务成员的终端上会显示“消息未提交 — 请按回车键”。任务动态中 Runner 自己的通知现在标记为 System。 (#907)
  - pi 对话显示正确的标题。 此前未命名的 pi 对话标题显示为字面上的“π”，已命名的显示为“π - <名称>”。现在未命名的 pi 对话会像其他运行时一样回退为角色名称，已命名的只显示名称。 (#941)
  - 对话保留符号链接文件夹的路径。 在 macOS 上，从通过符号链接访问的文件夹启动的对话，其 shell 提示符和标题显示的是解析后的路径，而不是你选择的路径。智能体看到的 PWD 现在也是正确的。 (#944)
