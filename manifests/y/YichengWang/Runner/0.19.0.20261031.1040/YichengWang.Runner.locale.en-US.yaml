ReleaseNotes: |-
  Runner 0.19.0 is a feature release for macOS, Windows and Linux on top of 0.18.3.
  New
  - Panes as islands. Every chat and terminal pane, and the info panel, now sits in its own island. Its header shows the status, an always-visible Stop/Resume button, and the menu, split and close controls. A stopped chat shows a centered Chat stopped card with its reason and one Resume button. Missions get the same layout: the content, the Sessions/Info rail and an open drawer are separate islands. (#1086)
  - One launcher for chats and terminals. ⌘N, the sidebar, a project, the command palette and an empty pane now all open the same launcher in place. It has a search field, your four most recent agents and roles, and Terminal and Mission shortcuts. A click, Enter or 1–4 starts an entry with its saved configuration. On the Start page, the project row under the search field sets the project and folder. A split pane uses its tab's project and starts in the neighbouring chat's folder. In a short pane the launcher drops rows from the bottom so it still fits. (#1092)
  - No more terminal drawer under chats. Split the pane or open a terminal tab instead. Shells saved in chat drawers are closed on upgrade. Mission drawers stay (Alt-F12). (#1086)
  - Terminals close without asking. A shell pane or mission shell closes as soon as its shell exits. Closing a terminal pane, tab or mission drawer is immediate, even while a command is running. Archiving a running chat still asks first. (#1086, #1092)
  - Quieter scrollbars and refined light colors. List and sidebar scrollbars appear only while you hover, scroll or drag, and hide shortly after. Terminal scrollbars are unchanged. Runner Light has refined surfaces, and Rosé Pine Dawn uses Runner's warm terminal background. (#1086)
  - Mission inbox notices wait for Idle. Inbox notices are now delivered only once a member is Idle, so messages sent during a turn no longer sit unsubmitted in its composer. A draft hold now ends ten minutes after your last keystroke. Input-method text left behind by a disconnected client is cleared. (#1046)
  Bug fixes
  - Claude Code hooks no longer time out on Windows. Runner's status hooks for Claude Code, Copilot and Antigravity now get 10 seconds instead of 2. A slow shell start on Windows no longer shows a red "UserPromptSubmit hook … timed out after 2s" error or loses the status update. (#1081)
  - Remote access asks new hosts for a PIN. After a new host signs in, its Settings window asks for a PIN and keeps a setup row until one is set. The CLI login prints the same next step. Picking a paused or offline computer now shows an Offline dialog instead of looking like a wrong PIN. After a timeout or relay error, the PIN you entered is kept for one retry. (#1044)
  - Extra Claude Code accounts reuse the main settings. An account that shares the main account's configuration now links its settings.json as well. It starts with the main account's effort and settings, and its mission sessions no longer stall at startup. On Windows the link needs Developer Mode; without it, Runner keeps merging the settings as before. (#1074)
  - Claude Code's answer marker is no longer a blue emoji on Windows. One-column terminal symbols such as ⏺, ⏸ and ⏹ are now drawn as text with Segoe UI Symbol instead of the color emoji font. This mostly showed when a Windows computer viewed a Mac-hosted Claude Code session. Wide emoji keep their color. (#1064)
  - A Codex rollback no longer leaves inbox delivery held. After an interrupt and a Codex rollback, clearing the composer releases the Drafting hold. Submit / clear is offered once Codex's hooks report that the turn is over. (#1018)
