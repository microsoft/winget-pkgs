ShortDescription: Runs Claude Code, Codex, Copilot CLI and other terminal coding agents together on one mission.
Description: 'Runner is a native desktop application where terminal agents work together. Claude Code, Codex, OpenCode, Cursor CLI, Grok Build, Antigravity CLI, Copilot CLI and pi can take the same task in one mission, and each agent keeps its own TUI in a real terminal while the lead brings the decisions back to you. Everything in Runner is also a `runner` command: missions, crews, roles, projects, chats, sessions and messages are all addressable from the command line, with `runnerd` as the background service. Agents run natively on Windows without WSL, and PowerShell 7 is optional. Status: alpha, actively shipping. Native builds target macOS (Apple Silicon) and Windows (x64) on Windows 10 version 1809 or later; Intel Macs, Windows ARM64 and Linux are not supported. The installer, the application and the CLI sidecars are Authenticode-signed with a Certum open-source certificate issued to Open Source Developer Yicheng Wang.'
