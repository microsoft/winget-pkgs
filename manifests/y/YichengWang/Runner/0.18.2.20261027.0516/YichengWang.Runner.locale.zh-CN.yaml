ReleaseNotes: |-
  Runner 0.18.2 是 macOS、Windows 和 Linux 上基于 0.18.1 的功能版本，以 beta 形式为 Runner 带来 Linux 支持。
  新功能
  - Linux beta。 Runner 现在可原生运行于 Linux ARM64 和 x86_64，提供签名的 .deb 与 tarball 包。Settings → Updates 会验证并就地安装新版本；可选的 systemd 用户服务能让 runnerd 在应用未打开时继续运行。这是 beta 版本：目前已在 Ubuntu 26.04 ARM64 虚拟机上试用，原生硬件、x86_64 和其他发行版尚未验证，欢迎反馈问题。(#823)
  问题修复
  - 取消后可重新登录。 在 Settings → Remote access 登录过程中点击 Cancel，Sign in 按钮会立即恢复可用。被放弃的登录不会再打开浏览器，也不会干扰新的登录，包括在另一个窗口发起的登录。(#1036, #1040)
  - 远程访问错误即时显示。 远程访问无法启动时，登录或退出会立即在 Remote access 卡片上显示实际错误，而不是等待约 45 秒。(#1036)
  Nightly 渠道
  - Linux nightly 现在与 macOS、Windows 一起发布在共享的 nightly 预发布中，文件名为 Runner_nightly.<sha>.<stamp>_linux-<arm64|x64>.deb 或 .tar.gz，排在 macOS 和 Windows 下载之后。改名前安装的 Linux nightly 无法发现改名后的包，请从 nightly 页面重新安装一次。
