ReleaseNotes: |-
  Runner 0.17.2 是 macOS 和 Windows 上基于 0.17.1 的修复版本。
  新功能
  - 自选角色和团队每页显示数量。 可选择每页 10、25 或 50 行。Runner 分别记住两个列表的选择，在已打开的窗口间同步，并在窄窗口下调整分页控件。 (#1007)
  问题修复
  - 国际布局 Mac 键盘可正常输入 Option 字符。 新增 Settings → Terminal → Option as Meta key 设置，默认为 Automatic：U.S.、U.S. International 和 ABC 布局保留 Meta 快捷键，其他布局可输入 @、括号、管道符等字符。也可指定两个 Option 键、仅左侧、仅右侧或 Off；按词移动快捷键继续可用。字符输入模式下，Option+Space 会输入普通空格。 (#929)
  - 终端换行链接保持完整。 同一表格单元格内属于同一链接的片段会一起高亮，周围标点和相邻单元格不包含在内。重绘和重新连接会话后，链接目标与标识仍会保留。 (#1006)
  - 当前输入框清空后及时放行任务消息。 Antigravity 和 Claude Code 重绘或调整大小后，Runner 会继续跟踪当前输入框，避免历史记录中的已提交文本让收件箱一直等待；真正尚未提交的草稿仍会暂停消息投递。 (#995)
