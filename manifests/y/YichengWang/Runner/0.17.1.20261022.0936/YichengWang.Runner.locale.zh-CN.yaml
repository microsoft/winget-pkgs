ReleaseNotes: |-
  Runner 0.17.1 是 macOS 和 Windows 上基于 0.17.0 的修复版本。
  问题修复
  - Codex 对话不再卡在 Drafting 状态。 在 Codex 中提交提示词、输入框清空后，Runner 现在能正确识别，并投递排队中的收件箱消息，而不是一直扣着不发。(#940)
  - 折行的链接作为一个整体打开。 较长的 URL 折到下一行时，悬停任意部分都会高亮完整链接，按住修饰键点击后续行也会打开完整地址。(#994)
  - 在 Windows 上再次启动 Runner 会切到正在运行的应用。 第二次启动会把已有窗口带到前台，而不是再启动一个副本并接管主窗口。(#980)
  - 任务中的智能体改为等待收件箱通知。 等待队友时，团队成员现在会先结束当前回合，收到 Runner 的通知后再读取收件箱，而不是自己启动 feed 监听。(#985)
