ReleaseNotes: |-
  Runner 0.17.1 is a bug-fix release for macOS and Windows on top of 0.17.0.
  Bug fixes
  - Codex chats no longer get stuck as Drafting. After you submit a prompt in Codex and its input box is empty again, Runner now detects this and delivers queued inbox messages, instead of holding them back. (#940)
  - Wrapped links open as one link. When a long URL wraps onto the next row, hovering any part of it now highlights the whole URL, and modifier-clicking a continuation row opens the full address. (#994)
  - Launching Runner again on Windows focuses the running app. A second launch now brings the existing window back to the front, instead of starting another copy that takes over the main window. (#980)
  - Mission agents wait for inbox notifications. Crew members now end their turn and read their inbox when Runner notifies them, instead of starting their own feed watchers while they wait for teammates. (#985)
