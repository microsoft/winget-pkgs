ReleaseNotes: |-
  Runner 0.16.4 是 macOS 和 Windows 上基于 0.16.3 的功能版本。
  新功能
  - Runner 支持英文和简体中文界面。 在设置 → 通用 → 语言（Settings → General → Language）中选择：跟随系统（默认，跟随操作系统的首选语言）、English 或简体中文。切换立即生效，会应用到所有已打开的窗口，包括菜单和命令面板，无需重启。草稿、选中内容、快捷键和终端会话都会保持原样。智能体的输出和终端内容不会被翻译。 (#565)
  - macOS 上的关于 Runner。 Runner 菜单中新增 About Runner（中文界面下为“关于 Runner”），位于 Check for Updates… 上方，会打开标准的 macOS 关于面板，显示 Runner 的版本和构建信息。 (#924)
  问题修复
  - Codex 任务成员会继续收到消息。 此前如果 Codex 在第一轮中切换到另一个对话，或这一轮因失败而没有正常结束，Codex 成员在第一轮之后可能再也收不到消息，包括你对它所提问题的回答。现在 Runner 会把这两种情况都视为该轮结束，并投递排队中的消息。 (#927, #928)
  - 已暂停的任务不再显示未读提示点。 任务暂停时会隐藏绿色的未读提示点；恢复任务后，如果仍有未读回复，提示点会重新出现。 (#920, #923)
