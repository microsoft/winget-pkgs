ShortDescription: Lightweight native all-in-one Windows productivity suite with instant file search, offline OCR, screenshot markup, screen recording Studio, and mouse gestures.
Description: 'Tools3000 unifies everyday Windows desktop utilities into one lightweight native C++ and Rust application: millisecond NTFS file and full-text document search, QuickLook preview, scrolling capture, precision screenshot annotation, grouped desktop pins, high-accuracy offline PP-OCRv4 text recognition, screen recording with auto-zoom Studio, and global mouse gestures. 100% offline, zero telemetry, GPL-3.0 open source.'
