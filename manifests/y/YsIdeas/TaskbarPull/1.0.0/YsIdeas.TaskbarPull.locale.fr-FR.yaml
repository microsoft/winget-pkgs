PackageLocale: fr-FR
Publisher: Yasser Chkam
PackageName: Taskbar Pull
License: MIT
ShortDescription: Amène une fenêtre sur l'écran dont vous cliquez la barre des tâches.
Description: |-
  Taskbar Pull est une petite application de la zone de notification pour les configurations à plusieurs écrans.
  Cliquez sur le bouton d'une fenêtre dans la barre des tâches de n'importe quel écran (Alt+clic par défaut, ou
  clic simple sur les écrans choisis) et la fenêtre vient sur cet écran. Les fenêtres agrandies le restent, les
  autres gardent une taille proportionnelle. Aucune touche n'est envoyée aux fenêtres plein écran ni aux jeux listés.
