ShortDescription: Brings a window to the screen whose taskbar you click.
Description: |-
  Taskbar Pull is a small tray app for Windows setups with several screens. Click a window's button on the
  taskbar of any screen (Alt+click by default, or a plain click on the screens you choose) and the window
  comes to that screen: minimized or background windows, the active window, combined-button thumbnails.
  Maximized windows stay maximized, other windows keep a proportional size across different scaling.
  It never sends keys into full-screen windows or listed games.
