ShortDescription: 让副屏专用、主屏干净：外接屏时锁住光标，别的窗口不会越界。
Description: |-
  ScreenMate 是一个 Windows 常驻托盘小工具。

  外接显示器时进入「接管模式」：鼠标被锁在主屏，跑到副屏上的窗口会被搬回主屏，
  副屏则显示你的插件面板、动态壁纸，或被「托管」过来的某个应用窗口。

  支持插件扩展、场景编排、定时切换，以及应用内检查更新。

  内置「Token 用量」插件：副屏直接看 MiniMax（M Plan）、小米 MiMo（Token Plan）的用量与余量，
  API Key 由本机 DPAPI 加密保存，插件拿不到明文。
