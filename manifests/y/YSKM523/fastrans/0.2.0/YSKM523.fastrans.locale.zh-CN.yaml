Description: |-
  fastrans 是一个极简的 Windows 悬浮翻译输入条:在任何应用里按全局热键呼出,
  打中文(内置带简拼与记忆的拼音输入,没装输入法的电脑也能用),本地神经模型
  实时给出英文(完全离线、无 API key),回车自动粘贴回原应用。带系统托盘、
  设置页、静默自动更新,译文自带北美办公室口吻润色。
