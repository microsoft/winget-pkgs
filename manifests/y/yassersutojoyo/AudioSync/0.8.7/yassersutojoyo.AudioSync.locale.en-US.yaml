ShortDescription: Play your PC's audio on AirPlay, Google Cast and Bluetooth speakers at the same time, in sync.
Description: |-
  AirPlay speakers play about two seconds late, so the same song on an AirPlay speaker and a local speaker sounds like an echo.
  AudioSync captures the PC's audio once, sends it to AirPlay speakers and a Google Cast speaker, and plays a delayed copy on Bluetooth and the other Windows outputs so they all line up.
  It is a single portable exe and updates itself. It is a beta.
