ShortDescription: 一键拉取全球 AI 情报：新模型、免费模型、泄漏与匿名内测线索
Description: |-
  AI Radar 把分散在十余个站点上的 AI 情报聚到一个桌面窗口，点一次刷新全部拉完，
  并按三类真正关心的维度分类：

  - 泄漏与匿名内测：未正式发布的权重出现在公开仓库，或社区/媒体出现明确说法，
    每条带可信度分级（未发布权重 / 有说法未证实 / 有证据多源印证）
  - 免费可用：OpenRouter 上定价为 0 的可调用模型，或开放权重可本地运行
  - 新模型：HuggingFace 新上传且已有热度、OpenRouter 新上架

  情报来自 12 个源：HuggingFace、OpenRouter、Anthropic、OpenAI、Google AI、
  Mistral、Simon Willison、Hacker News、Reddit、HuggingFace Blog、GitHub Search、
  以及 Google News 的 6 组中英双语定向查询。

  Tauri 2 + React 桌面应用，托盘常驻、开机自启、新情报桌面通知与任务栏角标。
  数据全部在本地缓存，不上传任何内容。
