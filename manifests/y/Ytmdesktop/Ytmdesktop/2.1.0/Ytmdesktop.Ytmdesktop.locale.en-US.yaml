ReleaseNotes: |-
  What's Changed
  This is a big one and a lot of things have changed but most will not be user facing. This release changes a lot of the internals of the application which will help us maintain things better, faster, and hopefully provide more features quicker over time. Many features have been rewritten because of this change and may provide a better user experience.
  With that said this release does contain a lot of new features and other changes.
  Features
  - Timed lyrics when available for the current video. We source this from YTM directly and replace the lyrics tab
    - Known potential issues This is non-exclusive to timed lyrics but there are cases where the lyrics do not align with the currently playing video and our timed lyrics system reflects this as well. This is an issue with YTM as it occurs even without our timed lyrics system.
  - Experimental enhanced media service (default enabled with this release) powered by Xosms. If you encounter issues you can disable it under Integrations -> Enhanced media service
    - On Windows this allows us to provide more information and functionality if you use a third party flyout program such as Fluent Flyouts.
    - On Linux this allows us to provide our own MPRIS based service (org.mpris.MediaPlayer2.ytmdesktop). Enhanced functionality is provided such as scroll to adjust player volume, shuffle, and repeat actions.
    - macOS support exists but is far more experimental and not as thoroughly tested.
  - Miniplayer that can be opened from the top when you don't want a large YTM window taking up your space and something you can pin on top to control the player.
    - Note: If you are on linux using wayland you will need to use your native window manager to pin the miniplayer always on top.
  - More shortcuts for managing the player.
    - Note: If you are on linux using wayland this feature will not likely work correctly for now.
  - More context menu actions for ease of use
    - Opening the context menu on an image allows opening it in your browser
    - Opening the context menu on a text box will provide undo, redo, copy, cut, paste, and select all actions.
  Developer Features
  - Companion Server
    - shuffleEnabled state is now provided.
    - Queue modification commands are now provided allowing you to arbitrarily add videos or playlists via id to the queue in any position. You can also remove or move videos around in the queue.
    - When the user is offline (no internet) thumbnails for the current song may be provided as a base64 data url containing the image instead of a link to the thumbnail.
    - mDNS broadcasting provided for the companion server under the name _ytmdesktop._tcp. If you are making a third party application such as a mobile app to control YTMDesktop you can use mDNS to find the player instead of scanning IPs or asking the user for an IP.
  - Read-only IPC server that allows receiving the player's current state in real-time without using socket.io.
  - All new features and how to use the Companion Server API are documented at https://ytmdesktop.github.io/developer/
  Fixed
  - Changes to YTM preventing the app from loading. This will also no longer happen and the app will continue to allow you to use YTM even if our hooks fail. The app will run in a degraded state with some features unavailable or not functional. Please open an issue on the GitHub if you encounter this popup as it should never happen and indicates changes that need to be made.
  - For more fixes view the full changelog
  Miscellaneous
  - Changelog window popup when the app updates containing the latest release notes
  - Changes which comply with electron's security recommendations
  - View the full changelog
  Known Issues
  - Check for updates in About is non-functional. This was missed before the update went live. Restarting the app will still correctly update
  Full Changelog: v2.0.12...v2.1.0
  CHECKSUMS.sha256.asc no longer exists. We now utilize artifact attestations from our builds which create these releases. This can be accessed from here
