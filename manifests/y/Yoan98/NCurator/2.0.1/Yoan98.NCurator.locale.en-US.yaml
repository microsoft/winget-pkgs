ReleaseNotes: |-
  v2.0.1
  2026-11-20
  ## New features
  - The Mainland China edition adds Light, Dark, and System appearance options. Language and appearance settings now work the same way.
  - Subtask retries, cancellations, and elapsed time are easier to follow.
  ## Bug fixes
  - Model retry messages no longer show billing status incorrectly. You can still see actual usage and charges in billing.
  - Fixed inconsistent themes across windows, previews, and editors.
