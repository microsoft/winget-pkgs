ReleaseNotes: |-
  New features
  - New interface language setting: follow your system, Simplified Chinese, or English
  - Switch between mainland China and international routes for official services
  - Access help from Settings and preview the item count and space usage before clearing partner caches
  Bug fixes
  - Fixed startup failures on some Windows computers
  - Fixed controls or the cursor being hidden while composing long messages
  - Fixed incorrect display of some original formatting in Word document change reviews
  - Fixed subtasks continuing to update their status after being stopped
  - File change lists no longer include internal temporary scripts generated during tasks
