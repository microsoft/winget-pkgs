PackageIdentifier: Yoan98.NCurator
PackageVersion: 1.0.11
PackageLocale: zh-CN
PublisherUrl: https://www.guanzhangai.cn/
ShortDescription: 处理本地办公文件的 AI 助手。
Description: |-
  馆长是一款本地优先的 AI 助手，围绕你电脑上的办公文件展开工作。
  - 办公文件处理：读取、创建和编辑 DOCX、PPTX、XLSX 与纯文本文件，支持 PDF 阅读。
  - 本地知识库：支持大量文件索引处理，检索内容并引用来源。
  - 网页搜索：搜索网络信息、读取网页内容，并可操作内置浏览器。
  - 本地终端：执行本地命令和脚本，完成数据处理与任务自动化。
  - 改动审核：查看修改记录，审核改动差异，回退支持的文件改动。
  - WPS 联动：点击 AI 改动处，在 WPS 中打开文档并定位；AI 修改或回退后自动刷新文档。
  - 定时任务：按计划执行任务，复用伙伴的资料与模型配置。
Tags:
- 人工智能
- 办公
- 大模型
- 大语言模型
- 文档
- 文档处理
- 知识库
ReleaseNotes: |-
  新功能
  - 新增界面语言设置，可选择跟随系统、简体中文或英文
  - 支持切换中国大陆与国际官方服务线路
  - 设置页新增帮助入口，伙伴缓存清理可查看待清理数量与占用空间
  Bug 修复
  - 修复 Windows 部分电脑启动失败的问题
  - 修复输入长消息时按钮或光标被遮挡的问题
  - 修复 Word 文档修改对比中部分原有格式显示不正确的问题
  - 修复子任务停止后仍继续更新状态的问题
  - 文件修改列表不再显示任务运行时产生的内部临时脚本
