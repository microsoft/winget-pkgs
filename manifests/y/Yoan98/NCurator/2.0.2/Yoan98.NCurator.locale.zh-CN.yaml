PackageIdentifier: Yoan98.NCurator
PackageVersion: 2.0.2
PackageLocale: zh-CN
PublisherUrl: https://www.guanzhangai.cn/
ShortDescription: 处理本地办公文件的 AI 助手。
Description: |-
  馆长是一款本地优先的 AI 助手，围绕你电脑上的办公文件展开工作。
  - 办公文件处理：读取、创建和编辑 DOCX、PPTX、XLSX 与纯文本文件，支持 PDF 阅读。
  - 本地知识库：支持大量文件索引处理，检索内容并引用来源。
  - 网页搜索：搜索网络信息、读取网页内容，并可操作内置浏览器。
  - 本地终端：执行本地命令和脚本，完成数据处理与任务自动化。
  - 改动审核：查看修改记录，审核改动差异，回退支持的文件改动。
  - WPS 联动：点击 AI 改动处，在 WPS 中打开文档并定位；AI 修改或回退后自动刷新文档。
  - 定时任务：按计划执行任务，复用伙伴的资料与模型配置。
Tags:
- 人工智能
- 办公
- 大模型
- 大语言模型
- 文档
- 文档处理
- 知识库
ReleaseNotes: |-
  新功能
  - 新增伙伴长期记忆，支持直接编辑、审核变更，并可控制用户信息与任务经验的记忆同步
  - Word 新增常用格式工具栏和搜索，改善选区引用与修订定位，扩展 AI 对批注、页眉页脚和分节的处理能力
  - 改进应用内 Excel 编辑和 Office 文件保存，支持按偏好在应用内或 WPS 中查看差异
  - 新增 HTML 交互预览和视频播放，支持不兼容视频的自动转换，改善会话中的媒体展示
  - 优化对话导航、回复复制与完成时间、上下文用量展示和提问通知，改善网络异常重试及系统休眠后的任务中断提示
  - 工作目录可记住展开状态，统一隐藏依赖和虚拟环境目录，改善清空消息记录的操作提示和界面图标可见性
  Bug 修复
  - 修复 Word 重复选择当前颜色后面板无法关闭的问题
  - 修复采用 1904 日期系统的 Excel 工作簿审核中的日期公式计算
  - 修复 Windows 多行记忆编辑与审核异常的问题
  - 修复点开头目录中的本地文件、图片和视频引用显示为不可用的问题
  - 修复文档预览刷新后无法插入资料引用的问题
