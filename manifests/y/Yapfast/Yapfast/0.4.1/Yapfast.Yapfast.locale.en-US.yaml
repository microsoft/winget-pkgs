ReleaseNotes: |-
  Keybinds! The ones I forgot to put in 0.4.0 😄
  Install
  On Windows, run Yapfast-0.4.1-windows-x64-setup.exe, or extract the portable ZIP. The installer still isn't signed, so SmartScreen may warn you: choose More info, then Run anyway.
  On Linux, download Yapfast-0.4.1-x86_64.AppImage, make it executable and run it. On Arch, install the .pkg.tar.zst with sudo pacman -U and its link. With Nix, nix profile add github:yapfast/yapfast/v0.4.1#yapfast builds it from source.
  On 0.4.0 with Check for updates on, Settings → About offers this one, and Update and restart installs it if you used the installer or the AppImage.
  What's new
  - Settings has a Keybinds page, as Discord does: add a keybind, pick what it does (Push to Talk, Push to Mute, Toggle Mute, Toggle Deafen or Toggle VAD) and record its keys. They work from any app, and a keybind can be up to four keys held together, like Ctrl+Shift+M.
  - Push to Mute: hold it and your microphone sends nothing, in either input mode.
  - The push to talk key on the Voice page takes combinations too.
  - On Windows, push to talk now hears keys sent by keyboard software and key remappers. It missed those before, which may be why push to talk did nothing for some of you (#78, #182).
  I haven't run keybinds on a real Windows machine or a real Wayland desktop yet, only under Wine and in my test sessions, so if push to talk still does nothing for you on Windows, please tell me which keyboard and key you use.
  All the changes: https://github.com/yapfast/yapfast/compare/v0.4.0...v0.4.1
