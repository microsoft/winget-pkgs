ShortDescription: Keeps display brightness the same across all Windows power schemes.
Description: |-
  Windows stores display brightness separately for every power scheme, so switching power modes
  (for example ASUS Armoury Crate Silent / Performance / Turbo) changes the brightness.
  Brightness Sync is a small tray utility that writes the current brightness into every power scheme,
  so all modes share one brightness level.
