ReleaseNotes: |-
  - HDR monitors: scrolling changes SDR content brightness (the Settings > Display > HDR slider), since monitors ignore their own brightness control in HDR
  - Built-in display: the 80% Windows sets when HDR turns on no longer replaces the usual brightness, which comes back when HDR turns off
  - Tooltip marks displays with HDR on
