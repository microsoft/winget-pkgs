ShortDescription: A Windows tray icon that shows what each pi coding session is doing.
Description: >-
  picadence puts one icon in the notification area and shows, for every pi session
  running in a terminal tab, whether it is working, waiting for an answer, or
  failed. The icon takes the most urgent state among your sessions, so a session
  that needs you is visible without alt-tabbing through tabs. A click opens a panel
  listing each session with its folder, its state, and how long ago it changed. A
  session can be kept, so its row survives the tab, and restarted into a new tab; a
  cadence can wake a session on a schedule you pick, and open its tab for it if you
  kept it. The pi half is one extension, installed with `pi install`.
