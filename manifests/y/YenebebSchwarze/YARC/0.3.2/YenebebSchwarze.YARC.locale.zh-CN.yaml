PackageIdentifier: YenebebSchwarze.YARC
PackageVersion: 0.3.2
PackageLocale: zh-CN
ShortDescription: 一款免费开源的浏览器，延续 Arc 的使用方式，并可导入你的 Arc 空间、固定的标签页、收藏和历史记录。
Description: |-
  YARC：Arc 浏览器的开源替代品
  YARC 是一款免费开源的 Arc 浏览器替代品。Arc 将于 2026 年 12 月 22 日关闭。YARC 按 Arc 的方式工作，拥有垂直侧边栏、各自拥有配置文件的空间、命令栏、分屏视图、Little Arc 和快速预览。它可以一步导入你的 Arc 空间、配置文件、收藏、固定的标签页、文件夹、归档和历史记录。它可在 macOS、Windows 和 Linux 上运行（Linux 为实验性）。
  The Browser Company 将于 2026 年 12 月 22 日关闭 Arc。过了这一天，应用将停止工作，Arc 账户也会被停用。YARC（Yet Another Arc Clone，又一个 Arc 克隆，yarrr！）是为不想转投 Dia、也不想退回标签栏的人准备的。它重现了 Arc 的工作流，并导入你的 Arc 侧边栏，让你像从前一样继续使用。
  YARC 是一个独立项目。它与 The Browser Company 无隶属关系，未获其认可，也没有任何关联。“Arc” 是他们的商标；本项目在 Chromium 之上（通过 Electron）重新实现了这套交互设计。
  侧边栏
  所有东西都放在一条垂直侧边栏里，页面占据窗口的其余部分。从上到下依次是：
  - 窗口控件与导航：切换侧边栏、后退、前进和重新加载。在 macOS 上，红绿灯按钮也在这里；在 Windows 和 Linux 上，原生的最小化、最大化和关闭按钮位于窗口右上角、页面之上，就像 Windows 版 Arc 那样。
  - URL 胶囊：显示当前网站。点击它或按 Ctrl/⌘+L 即可编辑网址。已安装扩展程序的按钮会出现在胶囊右侧。
  - 收藏：一组图标网格，放着你常开的网站（邮件、日历、聊天）。圆点表示哪些网站已加载。
  - 固定的标签页和文件夹：会一直留着的标签页，直到你移除它们。文件夹可以嵌套和折叠。
  - 今天：分隔线下方的日常标签页，最新的在前。“清空”会一次归档全部。
  - 底栏：资料库（归档、历史记录、下载）、你的各个空间，以及用来新建空间的 +。
  按 Ctrl/⌘+S 隐藏侧边栏，页面即可占满全宽。把鼠标移到窗口左边缘，侧边栏会重新滑出、覆盖在页面上，直到你移开鼠标。
  侧边栏里的一切都支持拖放。你可以在收藏、固定、文件夹和今天之间拖动标签页，把文件夹放进另一个文件夹，或把标签页拖到某个空间的图标上来移动它。右键点击任何条目可以看到它的选项，例如重命名、复制、在分屏视图中打开、静音或移动到某个空间。中键点击关闭标签页，双击则重命名。
  空间，每个空间都有自己的配置文件
  一个空间是一条独立的侧边栏，拥有自己的名称、表情符号和颜色。整个窗口会染上这个颜色。
  - 每个新空间默认拥有自己的配置文件。一个配置文件有自己的 Cookie 和登录状态、站点存储、缓存、历史记录和 Chrome 扩展程序。这样你可以同时在工作空间里登录工作用 Google 账号，在个人空间里登录个人账号。
  - 空间也可以共享配置文件，就像 Arc 把空间关联到配置文件那样。创建空间时选择“与……共享”。
  - 收藏属于配置文件。使用该配置文件的每个空间都显示同样的收藏。
  - 固定的标签页、文件夹和今天标签页属于空间本身。
  在侧边栏上双指左右滑动、点击底部的图标，或使用 Ctrl+1–9（macOS）/ Alt+1–9（Windows）以及 ⌘⌥←/→ / Ctrl+Alt+←/→ 来切换空间。
  与 Arc 行为一致的固定标签页
  - 固定的标签页会记住自己固定的网址。当你浏览去了别处，它的标题前面会出现一个 /。把鼠标悬停在其图标上并点击箭头，即可回到固定的网址。
  - 关闭固定的标签页（Ctrl/⌘+W）只是把它卸载以释放内存。它仍留在侧边栏里，点击它会再次打开固定的网址。
  - Ctrl/⌘+D 可固定或取消固定当前标签页。
  - 指向其他网站的链接会在快速预览中打开。当你在固定的标签页或收藏里点击指向其他网站的链接时，页面会在标签页上方的浮动卡片中打开，固定的页面保持原位。同一网站内的链接仍在标签页本身打开。
    - 按 Esc、点 × 按钮或点击卡片外部关闭快速预览。
    - 用展开按钮（或 Ctrl/⌘+O）保留页面：它会变成一个新的今天标签页。分屏按钮则在当前标签页旁边打开它。
    - 可在设置中关闭：“从固定的标签页和收藏中，在快速预览里打开其他网站”。
  今天标签页会自动归档
  12 小时没看过的未固定标签页会自动移入归档。你可以改成 24 小时、7 天或 30 天，也可以关闭该功能。正在播放音频或处于分屏视图中的标签页永远不会被归档。关闭的标签页也会进入归档。可以在资料库里找回它们、在命令栏中搜索，或使用 Ctrl/⌘+Shift+T。
  命令栏
  Ctrl/⌘+T 打开命令栏，它取代了新标签页。输入即可：
  - 切换到任何空间中已打开的标签页（名称匹配时“切换到标签页”是第一个结果）；
  - 打开网址，或用你的搜索引擎搜索，并提供实时建议；
  - 从历史记录和归档中查找页面；
  - 运行命令，例如切换侧边栏、复制网址、新建空间、从 Arc 导入或将 YARC 设为默认浏览器；
  - 输入空间名称跳转到该空间。
  Shift+Enter 会在分屏视图中打开结果。Ctrl/⌘+L 会带着当前网址打开命令栏，随时可编辑。
  分屏视图
  最多可以把四个标签页并排、堆叠或两者结合（例如四个一组的网格）显示。开始一个分屏有几种方式：
  - 从侧边栏把标签页拖到页面上：拖到页面左、右、上或下边缘附近放下，它会占据那一半；拖到已经分屏的页面上放下，则会添加到那个窗格旁边；
  - 把标签页拖到侧边栏中另一个标签页的中间：放在左半边或右半边，它就落在那一侧；拖到标签页上缘或下缘附近放下则是重新排序；
  - 按 Ctrl+Shift+= 并选择一个标签页或网址；
  - 按住 Shift 点击侧边栏中的标签页；
  - 从链接的右键菜单中选择“在分屏视图中打开链接”。
  一个分屏在侧边栏中显示为一行，每个标签页占一半；点击其中一半即可聚焦那个窗格。每个窗格有自己的工具栏，包含后退、前进、它的地址，以及只关闭该标签页的关闭按钮。关闭按钮旁边的分屏视图按钮（在聚焦的窗格上，或当你指向关闭按钮附近时）可以左右移动窗格、在任意一侧添加分屏、把标签页从分屏中分离，或把分屏从并排切换为堆叠。
  拖动窗格之间的间隙可调整大小，双击间隙则恢复等分。聚焦的窗格有彩色描边。Ctrl+Shift+- 关闭分屏。
  多个窗口
  ⌘N / Ctrl+N（或“文件 › 新建窗口”，以及 macOS 上的 Dock 菜单）会在你当前所在的空间打开另一个窗口，命令栏处于打开状态。每个窗口显示的是同一条侧边栏：你在一个窗口固定的标签页也会出现在另一个窗口里。每个窗口保留自己的空间、选中的标签页、分屏视图和侧边栏。一个标签页可以同时在两个窗口中打开：你正在使用的窗口显示实时页面，另一个窗口显示它最后的样子，直到你点击它。再次启动 YARC 时，它会重新打开你的所有窗口。
  Little Arc
  一个小巧、极简的窗口，用来快速查看。用 Ctrl+Alt+N / ⌘⌥N 打开一个。当 YARC 是你的默认浏览器时，来自其他应用（Slack、Discord、邮件）的链接也会在这里打开，让你的侧边栏保持整洁。想保留页面时，点击“在你的空间中打开”：它会原样移入你的今天标签页，不重新加载。它旁边的箭头可以选择另一个空间。不想保留的话，直接关掉窗口就行。
  地址左侧的标识显示页面用的是哪个配置文件，也就是你登录的是哪些账号。点击它可以用另一个配置文件打开页面；YARC 会为该网站记住这个选择。这个窗口也会记住你给它的大小。
  内置广告和跟踪器拦截
  广告和跟踪器开箱即被拦截，在每个配置文件中都是如此，使用的过滤列表与 uBlock Origin 和 EasyList 属于同类（通过 Ghostery 的开源引擎）。其中包括网络层拦截、隐藏空广告位的装饰性过滤，以及用来对付 YouTube 式广告的脚本片段。URL 胶囊中的盾牌会显示当前页面拦截了多少请求。点击它可以允许该网站显示广告（例如网站因此无法正常使用的时候），再点一次恢复拦截。列表每天更新。你可以在设置中完全关闭拦截。
  Chrome 扩展程序
  直接访问 Chrome 网上应用店并点击“添加至 Chrome”即可安装扩展程序，或运行“获取扩展程序”命令。扩展程序按配置文件安装，所以你的工作空间可以和个人空间拥有不同的扩展程序。它们会自动保持最新，按钮会出现在 URL 胶囊里。
  导入
  - 从 Arc：空间（包括各自的表情符号和颜色）、配置文件、收藏、固定的标签页、文件夹、今天标签页、归档和浏览历史。参见“从 Arc 迁移”。
  - 从 Zen：空间（包括各自的颜色）、固定的标签页、文件夹、常用项（作为收藏导入）、今天标签页和浏览历史。你的空间使用的每个容器都会变成一个 YARC 配置文件，因为两者都把 Cookie 分开存放。从命令栏、文件菜单或“设置 → 导入”运行“从 Zen 导入”；用“使用其他副本……”选择另一个配置文件，或一份已复制的 Zen 文件夹。先退出 Zen，能得到最完整的结果。
  - 从 Chrome、Edge 或 Brave：浏览历史和书签。书签会作为一个固定的文件夹进来。
  来源浏览器的文件绝不会被改动：YARC 先复制它们，再读取副本。
