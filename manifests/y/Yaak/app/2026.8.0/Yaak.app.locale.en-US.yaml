ReleaseNotes: |-
  ![Yaak 2026.8.0](https://yaak.app/changelog-og/2026.8.0/banner.png?v=3)

  The [changelog for 2026.8.0](https://yaak.app/changelog/2026.8.0) has the full write-up, with screenshots of the headline features. Here's everything that changed.

  ### 🎁 New

  • 🔄 Import into existing workspaces ([#618](https://github.com/mountain-loop/yaak/pull/618), [feedback](https://yaak.app/feedback/posts/update-current-workspace-during-import))
  • Preview imports and choose their destination ([#571](https://github.com/mountain-loop/yaak/pull/571))
  • 🧭 JSON response breadcrumbs ([#653](https://github.com/mountain-loop/yaak/pull/653), [feedback](https://yaak.app/feedback/posts/breadcrumbs-for-json-responses))
  • ✨ Example gRPC messages ([#613](https://github.com/mountain-loop/yaak/pull/613), [feedback](https://yaak.app/feedback/posts/grpc-message-example-from-proto))
  • 🔑 Custom OAuth 2.0 params ([#629](https://github.com/mountain-loop/yaak/pull/629), [feedback](https://yaak.app/feedback/posts/oauth-2-0-support-adding-origin-other-headers-in-token-request))
  • HTTP Digest authentication ([#628](https://github.com/mountain-loop/yaak/pull/628), [feedback](https://yaak.app/feedback/posts/native-support-for-http-digest-authentication))
  • Show a home screen on new installs and after deleting the last workspace ([#660](https://github.com/mountain-loop/yaak/pull/660))

  ### 💄 Improved

  • 🐧 Official Arch Linux package ([feedback](https://yaak.app/feedback/posts/add-arch-linux-install-instructions-for-official-package))
  • Faster search match counting in large responses ([#612](https://github.com/mountain-loop/yaak/pull/612), [feedback](https://yaak.app/feedback/posts/improve-search-performance-for-large-responses))
  • Open windows without waiting for the plugin runtime ([#616](https://github.com/mountain-loop/yaak/pull/616))
  • Shorter agent skill description ([#625](https://github.com/mountain-loop/yaak/pull/625), [feedback](https://yaak.app/feedback/posts/shorten-the-agent-skill-description))
  • Show a dot on the Info tab when a description exists ([#645](https://github.com/mountain-loop/yaak/pull/645), [feedback](https://yaak.app/feedback/posts/visible-feedback-for-information-section))
  • Import Digest, NTLM, OAuth 1.0, and folder auth from Postman collections ([#667](https://github.com/mountain-loop/yaak/pull/667))
  • Convert Postman dynamic variables to template functions on import ([#680](https://github.com/mountain-loop/yaak/pull/680))

  ### 🛠️ Fixed

  • ⚡ More responsive under load ([#642](https://github.com/mountain-loop/yaak/pull/642), [feedback](https://yaak.app/feedback/posts/lately-yaak-has-been-extremely-unstable-for-me-ive-encountered-two-issues-multip))
  • Disable macOS Writing Tools suggestions inside editors
  • Disable Writing Tools suggestions in plain inputs ([#646](https://github.com/mountain-loop/yaak/pull/646))
  • Remove the broken Refresh item from the gRPC method picker
  • Fix Postman import swapping the API key name and value ([#643](https://github.com/mountain-loop/yaak/pull/643))
  • Join cURL line continuations followed by whitespace ([#644](https://github.com/mountain-loop/yaak/pull/644))
  • Accept responses with more than 100 headers ([#658](https://github.com/mountain-loop/yaak/pull/658), [feedback](https://yaak.app/feedback/posts/when-response-headers-exceed-a-certain-count-hyper-throws-error))
  • Focus the confirm button when a dialog opens
  • Use the current time when uuid.v6 has no timestamp ([#647](https://github.com/mountain-loop/yaak/pull/647))
  • Stop flagging an empty JSON editor as invalid
  • Fix the MCP server ignoring environmentId on send_http_request ([#654](https://github.com/mountain-loop/yaak/pull/654))
  • Flush exported files to disk before the CLI reports success ([#686](https://github.com/mountain-loop/yaak/pull/686))

  <br>

