ReleaseNotes: |-
  ![Yaak 2026.9.0](https://yaak.app/changelog-og/2026.9.0/banner.png?v=3)

  The [changelog for 2026.9.0](https://yaak.app/changelog/2026.9.0) has the full write-up, with screenshots of the headline features. Here's everything that changed.

  ### 🎁 New

  • 📦 Import from Bruno ([#706](https://github.com/mountain-loop/yaak/pull/706), [feedback](https://yaak.app/feedback/posts/import-from-bruno))
  • Import several files, folders, and URLs in one batch ([#706](https://github.com/mountain-loop/yaak/pull/706), [feedback](https://yaak.app/feedback/posts/support-for-importing-zip-or-multiple-files-and-only-allow-importable-file-forma))

  ### 💄 Improved

  • 📂 Multi-file import ([#706](https://github.com/mountain-loop/yaak/pull/706), [feedback](https://yaak.app/feedback/posts/redesigned-import-data-dialog))
  • Import multiple collections into one existing workspace ([#706](https://github.com/mountain-loop/yaak/pull/706), [feedback](https://yaak.app/feedback/posts/import-multiple-files-to-single-workspace))
  • Show gRPC proto files and import folders as a file list ([#706](https://github.com/mountain-loop/yaak/pull/706), [feedback](https://yaak.app/feedback/posts/grpc-proto-file-picker-uses-the-shared-file-list))
  • Write template string arguments in plain quotes instead of base64 ([#708](https://github.com/mountain-loop/yaak/pull/708))
  • Convert Insomnia timestamp, hash, base64, cookie, and prompt tags on import ([#712](https://github.com/mountain-loop/yaak/pull/712), [feedback](https://yaak.app/feedback/posts/convert-the-remaining-insomnia-tags-to-native-yaak-functions-on-import))

  ### 🛠️ Fixed

  • Keep sidebar items in place when editing items with equal sort priorities ([#705](https://github.com/mountain-loop/yaak/pull/705))
  • Open the imported workspace after a deep-link import
  • 🧩 Better Insomnia imports ([#693](https://github.com/mountain-loop/yaak/pull/693))
  • Keep template tags intact when a quoted argument contains ]} ([#710](https://github.com/mountain-loop/yaak/pull/710))
  • Open the environment editor faster when it has many variables ([#713](https://github.com/mountain-loop/yaak/pull/713), [feedback](https://yaak.app/feedback/posts/environment-dialog-takes-about-half-a-second-to-open-on-large-workspaces))
  • Select new sub-environments in the editor and keep disabled rows through bulk edit ([#714](https://github.com/mountain-loop/yaak/pull/714))
  • Show an error instead of deleting requests when a sync file can't be read ([#725](https://github.com/mountain-loop/yaak/pull/725))
  • Fix PDF previews on older versions of macOS ([#730](https://github.com/mountain-loop/yaak/pull/730), [feedback](https://yaak.app/feedback/posts/view-pdf-bug))
  • Ignore leading and trailing spaces in request URLs ([#724](https://github.com/mountain-loop/yaak/pull/724))
  • Return attribute and text values from XPath queries ([#723](https://github.com/mountain-loop/yaak/pull/723))

  <br>

