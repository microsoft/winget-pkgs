ReleaseNotes: |-
  Kensaku 1.0.18 is a substantial update introducing per-folder indexing modes, improved Markdown and Outlook message extraction, better OCR scheduling, and several indexing and search fixes.
  Existing settings and indexes are compatible. No re-index is required to upgrade.
  [!IMPORTANT]
  Windows: Binaries are signed using SignPath's test certificate. Windows SmartScreen may still show "Unknown publisher". Select More info → Run anyway if you want to proceed.
  The production signing certificate is still pending. Production-signed binaries will follow once it is issued.
  macOS: Builds remain unsigned and are not notarized (#73).
  What's Changed
  - fix(indexer): honor Skip Hidden Files during directory scans by @codewithpom in https://github.com/yjid/kensaku/pull/179
  - fix(indexer): index .msg bodies stored only as HTML or RTF (follow-up to #63) by @mtjia6 in https://github.com/yjid/kensaku/pull/167
  - fix(tls): respect system and custom CA bundles by @codewithpom in https://github.com/yjid/kensaku/pull/171
  - Clean up Markdown search text and previews by @surkhayka in https://github.com/yjid/kensaku/pull/139
  - fix(ocr): bound inference threads and preserve UI priority by @codewithpom in https://github.com/yjid/kensaku/pull/172
  - Per-directory indexing mode: names only or names and content by @rhurta in https://github.com/yjid/kensaku/pull/145
  - fix(build): give Windows test binaries the Common Controls v6 manifest by @yjid in https://github.com/yjid/kensaku/pull/192
  - fix(indexer): wait out a busy Tantivy writer lock on reopen by @yjid in https://github.com/yjid/kensaku/pull/191
  - chore(deps): bump mail-parser from 0.11.9 to 1.0.1 by @yjid in https://github.com/yjid/kensaku/pull/190
  - feat(setup): let users cancel the first-run scan and change folders by @mtjia6 in https://github.com/yjid/kensaku/pull/188
  - chore(deps): bump interprocess from 2.4.7 to 2.4.8 in /cli by @dependabot[bot] in https://github.com/yjid/kensaku/pull/181
  - chore(deps): bump interprocess from 2.4.7 to 2.4.8 in /src-tauri by @dependabot[bot] in https://github.com/yjid/kensaku/pull/183
  - chore(deps): bump cfb from 0.14.0 to 0.16.0 in /src-tauri by @dependabot[bot] in https://github.com/yjid/kensaku/pull/186
  - chore(deps): bump notify from 8.2.1 to 8.2.2 in /src-tauri by @dependabot[bot] in https://github.com/yjid/kensaku/pull/184
  - chore(deps): bump parking_lot from 0.12.5 to 0.13.0 in /src-tauri by @dependabot[bot] in https://github.com/yjid/kensaku/pull/182
