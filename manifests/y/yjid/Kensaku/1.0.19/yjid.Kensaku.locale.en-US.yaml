ReleaseNotes: |-
  Kensaku 1.0.19 adds in-app updates, one-line installers, and a round of indexing and OCR fixes.
  Existing settings and indexes are compatible. No re-index is required to upgrade.
  [!IMPORTANT]
  Upgrading from 1.0.16, 1.0.17 or 1.0.18: install 1.0.19 once manually. From 1.0.20 onward, updates arrive in the app. See docs/UPDATER.md.
  macOS: Builds remain unsigned and are not notarized (#73).
  Highlights
  - In-app updates. Kensaku checks for signed updates, downloads them in the background, verifies the signature, installs in place, and relaunches. Windows no longer opens the installer wizard, and per-user installs no longer ask for admin.
  - One-line installers. install.sh (Linux and macOS) and install.ps1 (Windows) install per-user without admin and verify SHA256SUMS.
  - OCR packs can be re-downloaded from Settings to repair a stale or truncated pack. The PP-OCR dictionary now ships with the app.
  Fixes
  - Re-indexing keeps semantic search working while a crawl is paused or cancelled.
  - Whole-drive roots skip Windows system folders. An explicitly watched folder inside one still gets indexed.
  - Setup cleans up pasted folder paths: duplicates are removed, UNC shares are handled, and missing folders get a clear error.
  - OCR no longer panics on a detector box far outside the image.
  - macOS no longer starts a helper daemon from the app.
  - The update check has a timeout, so a busy index no longer leaves the UI on "Waiting for backend".
  - The web view now uses a strict content security policy.
  Known open
  - Very large drives can take a while before the first files appear (#207).
  - Indra on Fedora 44 still needs logs before the zero-detector result can be diagnosed (#174).
  - MSI, portable .zip, .deb and .rpm installs update through their own package, not the in-app updater.
  Pull requests
  - feat(updater): signed in-place updates via Tauri's updater by @yjid in https://github.com/yjid/kensaku/pull/236
  - feat(install): one-line installers for Linux, macOS, and Windows by @yjid in https://github.com/yjid/kensaku/pull/239
  - feat(ocr): add a Re-download action for the OCR packs by @yjid in https://github.com/yjid/kensaku/pull/232
  - fix(ocr): bundle the PP-OCR dictionary by @yjid in https://github.com/yjid/kensaku/pull/222
  - fix(ocr): reject boxes that overflow imageproc's warp by @yjid in https://github.com/yjid/kensaku/pull/234
  - fix(indexer): skip Windows system trees for volume roots by @yjid in https://github.com/yjid/kensaku/pull/230
  - fix: pre-1.0.19 audit fixes (semantic reindex, macOS TCC, volume roots) by @yjid in https://github.com/yjid/kensaku/pull/237
  - fix(setup): canonicalize and deduplicate watched directory paths by @pawangopallavudya-commits in https://github.com/yjid/kensaku/pull/210
  - fix(security): bind update downloads to the checked release and add a CSP by @yjid in https://github.com/yjid/kensaku/pull/213
  - fix(stats): time out a blocked get_stats poll by @yjid in https://github.com/yjid/kensaku/pull/221
