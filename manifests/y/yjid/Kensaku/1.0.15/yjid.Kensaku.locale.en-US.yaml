ReleaseNotes: Fixed an indexing freeze that could stall OCR crawls near 97% when processing large batches of images. Rate-limited memory trims on Windows, replaced a mutex-guarded channel receiver with a condition variable, removed a blocking lock convoy across parallel OCR engines, and raised the single-file OCR timeout budget from 8 to 45 seconds for images and scanned PDFs.
