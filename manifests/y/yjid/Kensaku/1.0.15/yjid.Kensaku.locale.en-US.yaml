ShortDescription: Local file search and launcher with OCR and semantic search.
Description: Kensaku is an open-source desktop file launcher that indexes file names, document and code text, and text recognised in screenshots, all on the local machine. Searches return instantly without a cloud round-trip, and the same index is exposed to AI agents over MCP or a loopback HTTP server. Full-text extraction covers PDF, Office and other document formats, while optional OCR packs and semantic models download on first use.
