PackageIdentifier: yjid.Kensaku
PackageVersion: 1.0.15
PackageLocale: zh-CN
ShortDescription: 支持 OCR 与语义搜索的本地文件搜索与启动器。
Description: Kensaku 是一款开源的桌面文件启动器，在本地机器上索引文件名、文档与代码文本以及截图中识别出的文字。搜索无需云端往返即可即时返回结果，同一套索引还可通过 MCP 或本机回环 HTTP 服务提供给智能体使用。全文抽取覆盖 PDF、Office 等文档格式，OCR 语言包与语义模型在首次使用时按需下载。
