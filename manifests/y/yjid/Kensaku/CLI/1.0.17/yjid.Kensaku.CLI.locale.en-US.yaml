ShortDescription: Command-line and MCP client for the Kensaku local search index
Description: kensaku-cli is the standalone agent command of Kensaku. It searches the same local index the desktop app builds, prints results as text or JSON, reports index state, serves the index over MCP or a loopback HTTP server, and configures MCP clients such as Claude Desktop, Claude Code and Cursor. Nothing leaves the machine. The desktop Kensaku app must have run once to create the index, otherwise the CLI exits with code 3.
