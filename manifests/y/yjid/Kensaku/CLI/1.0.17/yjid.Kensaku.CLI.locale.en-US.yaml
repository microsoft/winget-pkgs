ReleaseNotes: |-
  Security release
  This release fixes five privately reported security issues. Details are published as GitHub Security Advisories alongside this release.
  - Agent scope and direct reads now fail closed.
  - Update downloads are staged in a private, per-user directory, with ownership, permission and file-type checks before anything runs.
  - The watcher honors excluded extensions and sensitive names.
  - Office extraction now has bounded XML, input and buffer budgets.
  Builds are still unsigned, so macOS and Windows may show a first-install warning. See docs/INSTALL.md.

