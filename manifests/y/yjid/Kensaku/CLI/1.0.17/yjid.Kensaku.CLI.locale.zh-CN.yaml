ShortDescription: 搜索 Kensaku 本地索引的命令行与 MCP 客户端
Description: kensaku-cli 是 Kensaku 的独立智能体命令行工具。它搜索桌面应用构建的同一套本地索引，以文本或 JSON 输出结果，报告索引状态，并通过 MCP 或本机回环 HTTP 服务对外提供索引，还可以为 Claude Desktop、Claude Code 与 Cursor 等 MCP 客户端写入配置。数据不会离开本机。首次使用前需先运行一次 Kensaku 桌面应用以建立索引，否则命令以退出码 3 结束。
