ShortDescription: Small native Windows tray tools for window management, launching and volume control.
Description: |-
  Ypo-Lite is a suite of small native Windows tray tools written in Rust, each a single executable of a few hundred kilobytes:
  - Y-Snap moves, resizes, rolls up, fades or pins the window under the pointer, from hotkeys, mouse gestures and an on-screen overlay.
  - Y-Pop launches anything from tray menus, or by typing a few letters.
  - Y-Coustic steps or mutes the master volume, the microphone and any application from hotkeys, the mouse wheel and the tray icon.
  Each tool comes with a settings app. Configuration is plain XML in %APPDATA%\Ypo-Lite.
