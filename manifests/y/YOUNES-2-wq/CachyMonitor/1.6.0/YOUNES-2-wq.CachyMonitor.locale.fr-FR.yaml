ReleaseNotes: |-
  CachyMonitor 1.6.0 : PresentMon devient la source principale pour les FPS (Windows)
  - PresentMon est désormais utilisé en priorité pour les FPS et les statistiques de session : il continue de suivre le jeu même lorsque vous cliquez sur CachyMonitor ou une autre fenêtre (plus de perte de FPS après un Alt-Tab).
  - RivaTuner (RTSS) sert désormais de solution de secours lorsque PresentMon ne mesure rien (par exemple pour un jeu en mode fenêtré classique).
  - Architecture interne découpée en modules avec tests automatisés.
ReleaseNotesUrl: https://github.com/YOUNES-2-wq/cachymonitor/releases/tag/v1.6.0
InstallationNotes: |-
  Notes importantes après l'installation :
  - Si vous avez activé l'option « Allow PresentMon » lors de l'installation, veuillez fermer votre session Windows et vous reconnecter une fois pour appliquer les droits du groupe « Performance Log Users ».
  - L'application fonctionne immédiatement pour les FPS, l'usage CPU/GPU et la RAM. Pour afficher la température et la consommation électrique du CPU, installez et lancez MSI Afterburner.
