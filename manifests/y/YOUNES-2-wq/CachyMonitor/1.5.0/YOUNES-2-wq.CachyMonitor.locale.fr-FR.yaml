ShortDescription: Moniteur système gaming — CPU, GPU, RAM, températures et statistiques de FPS
Description: |-
  CachyMonitor affiche en temps réel l'état du CPU, du GPU, de la RAM et de la VRAM
  (usage, fréquences, températures, consommation), ainsi que les statistiques de la
  session de jeu en cours : FPS, 1 % low, 0.1 % low, moyenne, graphe de frametime et
  détection du goulot d'étranglement CPU ou GPU. Une carte dédiée donne le modèle de
  la manette connectée, sa connexion (câble ou Bluetooth) et son niveau de batterie.
  Thème clair ou sombre suivant le bureau, interface en français ou en anglais.

  Sous Windows, la température, la consommation et la fréquence réelle du CPU
  proviennent de MSI Afterburner, qui doit être installé et lancé — le système
  n'expose pas ces capteurs autrement. Les FPS viennent de RivaTuner (RTSS), ou à
  défaut de PresentMon d'Intel, inclus dans l'installateur. Le GPU NVIDIA est lu via
  nvidia-smi.

  Le même fichier fonctionne aussi sous Linux, où les mesures viennent de /proc, /sys
  et des journaux de MangoHud.
