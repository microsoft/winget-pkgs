ReleaseNotes: |-
  CachyMonitor 1.7.0 : température et consommation du CPU sans MSI Afterburner (AMD Ryzen, Windows)
  - Nouveau, optionnel et décoché par défaut : température et consommation du CPU par PawnIO, un petit pilote open source signé par Microsoft. Aucune écriture dans le processeur.
  - Pour l'activer : installer CachyMonitor pour tous les utilisateurs (winget install YOUNES-2-wq.CachyMonitor --scope machine), installer PawnIO (winget install namazso.PawnIO), puis cocher « Température CPU par PawnIO » dans les Options. Effet au lancement suivant.
  - Contrepartie : CachyMonitor se relance alors en administrateur et Windows demande une confirmation à chaque lancement. Refuser ouvre l'appli normalement (Afterburner en secours).
  - Nouveau bouton « À propos » dans les Options. Les processeurs Intel ne sont pas encore pris en charge par cette méthode.
ReleaseNotesUrl: https://github.com/YOUNES-2-wq/cachymonitor/releases/tag/v1.7.0
InstallationNotes: |-
  Notes importantes après l'installation :
  - Si vous avez activé l'option « Allow PresentMon » lors de l'installation, veuillez fermer votre session Windows et vous reconnecter une fois pour appliquer les droits du groupe « Performance Log Users ».
  - L'application fonctionne immédiatement pour les FPS, l'usage CPU/GPU et la RAM. Pour afficher la température et la consommation du CPU, installez et lancez MSI Afterburner, ou (AMD Ryzen) activez l'option PawnIO dans les Options après une installation pour tous les utilisateurs.
