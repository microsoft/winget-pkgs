ReleaseNotes: |-
  CachyMonitor 1.7.1 : mise à jour intégrée à l'application (Windows)
  - Quand une version plus récente existe, une barre apparaît en haut de la fenêtre. « Mettre à jour » télécharge l'installateur, vérifie son empreinte SHA-256 contre celle publiée par GitHub, l'installe en silence et relance l'application.
  - La vérification a lieu quelques secondes après le démarrage, puis toutes les 6 heures. Elle demande seulement à GitHub s'il existe une version plus récente : rien sur le PC n'est envoyé. Activée par défaut ; case « Rechercher les mises à jour au démarrage » dans les Options pour la désactiver.
  - En mode administrateur (PawnIO), la barre demande de relancer sans droits administrateur avant de mettre à jour : rien n'est téléchargé ni exécuté avec des droits élevés.
  - Les versions jusqu'à la 1.7.0 n'ont pas cette barre : cette mise à jour se fait une fois par winget ou par l'installateur, les suivantes pourront se faire depuis l'application.
ReleaseNotesUrl: https://github.com/YOUNES-2-wq/cachymonitor/releases/tag/v1.7.1
InstallationNotes: |-
  Notes importantes après l'installation :
  - Si vous avez activé l'option « Allow PresentMon » lors de l'installation, veuillez fermer votre session Windows et vous reconnecter une fois pour appliquer les droits du groupe « Performance Log Users ».
  - L'application fonctionne immédiatement pour les FPS, l'usage CPU/GPU et la RAM. Pour afficher la température et la consommation du CPU, installez et lancez MSI Afterburner, ou (AMD Ryzen) activez l'option PawnIO dans les Options après une installation pour tous les utilisateurs.
