ShortDescription: Moniteur système gaming — CPU, GPU, RAM, températures et statistiques de FPS
Description: |-
  CachyMonitor affiche en temps réel l'état du CPU, du GPU, de la RAM et de la VRAM (usage, fréquences, températures, consommation), ainsi que les statistiques de la session de jeu en cours : FPS, 1 % low, 0.1 % low, moyenne, graphe de frametime et détection du goulot d'étranglement CPU ou GPU.
  Une carte dédiée indique également le modèle de la manette connectée, son type de connexion (câble ou Bluetooth) et son niveau de batterie. Thème clair ou sombre suivant le bureau, interface en français ou en anglais.

  Sous Windows, les FPS et les statistiques de frametime proviennent en priorité de PresentMon d'Intel (inclus dans l'installateur), qui continue de suivre le jeu même en arrière-plan, avec RivaTuner (RTSS) en secours. La fréquence réelle du CPU et la RAM sont lues nativement, tandis que le GPU NVIDIA utilise NVML / nvidia-smi. La température et la consommation du CPU viennent de MSI Afterburner ou, sur un processeur AMD Ryzen et seulement si l'option est cochée dans les Options, du pilote PawnIO (CachyMonitor se relance alors en administrateur, avec une confirmation Windows à chaque lancement).
