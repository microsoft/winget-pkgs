ReleaseNotes: |-
  CachyMonitor 1.8.0 : nouvelle apparence (Windows)
  - 22 thèmes, sombres et clairs : Windows 11 (reprend la couleur d'accent), Claude (verre dépoli et fond animé), Noir (OLED), Nord, Dracula, Catppuccin, Tokyo Night, Synthwave, Cyberpunk et d'autres. La barre de titre suit le thème.
  - Réglages du thème Claude : intensité du verre, couleur d'accent, fond animé, fond calme pendant un jeu. Le fond animé consomme un peu de processeur hors jeu et peut être décoché.
  - Jauges animées, anneau orange ou rouge en alerte, FPS en grand, bandes de couleur sur le graphe de frametime.
  - Mode compact et choix des cartes affichées (Options > Apparence).
  - Nouvelle icône.
ReleaseNotesUrl: https://github.com/YOUNES-2-wq/cachymonitor/releases/tag/v1.8.0
InstallationNotes: |-
  Notes importantes après l'installation :
  - Si vous avez activé l'option « Allow PresentMon » lors de l'installation, veuillez fermer votre session Windows et vous reconnecter une fois pour appliquer les droits du groupe « Performance Log Users ».
  - L'application fonctionne immédiatement pour les FPS, l'usage CPU/GPU et la RAM. Pour afficher la température et la consommation du CPU, installez et lancez MSI Afterburner, ou (AMD Ryzen) activez l'option PawnIO dans les Options après une installation pour tous les utilisateurs.
