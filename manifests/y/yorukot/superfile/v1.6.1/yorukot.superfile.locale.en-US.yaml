  Detailed Change Summary
  Details
  Update
  - Use the native Trash on macOS, the Recycle Bin on Windows, and the FreeDesktop trash on Linux by @yorukot in #1495
  - Write all selected paths to the chooser file in panel order by @Abhirup0 in #1653
  - Show the number of items in a folder in the file panel’s size column by @booth-w in #1648
  - Show Windows file attributes in the metadata panel by @xelavopelk in #1464
  - Show FreeBSD file flags in the metadata panel by @clausecker in #1472
  - Recognize the FreeBSD NO_UCACHE flag by @clausecker in #1644
  - Add the Rosé Pine Dawn and Rosé Pine Moon themes by @MJLiiii in #1664
  - Add an uninstall script for Linux and macOS by @dragosgatan in #1467
  - Add an application icon and AppStream metadata for the desktop entry by @Jaredy899 in #1523
  - Report permission errors when compressing files by @xelavopelk in #1498
  Bug Fix
  - Handle trash on Linux filesystems mounted outside the root partition by @paczek654321 in #1490
  - Preserve symbolic links when copying files by @xelavopelk in #1501
  - Copy the paths of all selected items to the system clipboard by @yorukot in #1486
  - Keep the leading dot when naming archives for hidden files and folders by @xelavopelk in #1475
  - Preserve dotfile names when removing an extension would leave an empty or dot-only ZIP name by @toller892 in #1485
  - Keep dotted parent directory names intact when choosing where to extract an archive by @xelavopelk in #1476
  - Show the underlying error when creating a file or directory fails by @xelavopelk in #1524
  - Apply create, paste, compress, and extract shortcuts only when a file panel has focus by @somaz94 in #1685
  - Stop Page Up and Page Down at the first and last items by @KristianHolme in #1504
  - Scroll the focused panel with Page Up and Page Down by @prajwalmahajan101 in #1519
  - Keep keyboard focus on a newly opened file panel by @prajwalmahajan101 in #1518
  - Respect the configured sidebar sections and their order by @nenas1ya in #1442
  - Keep the icon out of the name when renaming a pinned directory by @ikan31 in #1540
  - Skip fuzzy search when filtering leaves no candidate filenames by @lazysegtree in #1609
  - Recognize printable UTF-8 text in file previews by @KristianHolme in #1507
  - Expand tabs to the next tab stop in text previews by @prajwalmahajan101 in #1509
  - Show a focus prompt for folder size until the metadata panel calculates it by @VXNCXNX in #1630
  - Handle unreadable entries while calculating directory size by @YuriNachos in #1627
  - Handle empty input in the superfile prompt by @MouadHaikal in #1701
  - Expand a leading tilde only when it stands alone or precedes a path separator by @Abhirup0 in #1652
  - Remove stale trailing bytes when repairing a TOML file by @ikan31 in #1529
  - Have the cd-on-quit shell functions ask the installed binary for the lastdir path by @VXNCXNX in #1629
  - Use Go 1.26 for the Nix package to fix builds on Apple Silicon by @MachXNU in #1635
  Optimization
