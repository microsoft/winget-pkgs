ShortDescription: Free, open-source SSD & HDD health monitor, SMART diagnostics, disk benchmark, and read-only NTFS file recovery for Windows.
Description: |-
  SSD Sentinel is a local-first Windows storage diagnostics and safety suite built with Rust and Tauri 2 against documented Win32/NTFS kernel interfaces and bundled smartmontools 7.5 (GPL-2.0-or-later).
  Key capabilities include live NVMe, SATA SSD, and HDD SMART monitoring with 720-sample SQLite wear and endurance forecasting, an unbuffered Win32 IOCP Direct-I/O benchmark with PCIe/SATA link checks, a 200-zone raw LBA read-only surface scanner with thermal and cascade watchdogs, SHA-256 verified NTFS Directory Junction storage tiering, developer and WSL2 .vhdx compaction tools, and strictly read-only NTFS forensic recovery.
  Fresh installations start with Default Read-Only Guard enabled in Rust and require Dry-Run execution manifests before any disk write occurs.
