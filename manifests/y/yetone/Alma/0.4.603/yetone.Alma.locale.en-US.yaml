ReleaseNotes: |-
  0.4.603
  Features
  - Use ⌘O to open the current chat's workspace in your preferred editor, such as Cursor, VS Code, Zed, Windsurf, Sublime, Xcode, or your file manager. Choose the editor in Settings → General → Coding Agent.
  - A code icon now appears beside the workspace title; click it to open the workspace in your editor, with a tooltip showing the editor and shortcut.
  - Right-click the title’s code icon to open the workspace in another editor, which then becomes the default for ⌘O.
  - Press ⌘⇧X to open the composer’s project picker with search focused. Press Enter to choose the first match, or Esc / ⌘⇧X to close.
  - Press ⌘⌥C to copy the current thread as a reference link. Paste it into a composer to insert a thread chip that agents can follow.
  - In the model menu, use ⌘⇧↓ and ⌘⇧↑ to jump to the next or previous provider’s first model.
