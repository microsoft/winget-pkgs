ReleaseNotes: |-
  Features
  - Recently Deleted list, restore, and purge now run directly in the server, so Node stays idle and isn’t woken up just to show, restore, or empty the trash.
  - Items older than 30 days in Recently Deleted are now cleaned up automatically.
  - Use ALMA_NODE_TRASH_LIST/RESTORE/PURGE/SWEEP=1 to switch each action back to Node.
