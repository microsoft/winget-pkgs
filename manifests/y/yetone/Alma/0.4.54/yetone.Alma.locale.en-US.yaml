ReleaseNotes: |-
  0.4.54
  Features
  - Team collaboration is now available: invite members, authenticate them, share channels, and ask Team Alma with @alma.
  - Team invitations open directly in Alma via an alma:// link.
  - The Team page now works more like Slack and has a more polished settings experience.
  - Organizers can set response policies (silent, on mention, or topic-based), set an hourly rate, and @-mention candidates.
  - Team Alma can draft submissions, with an “ask Team Alma” toggle and a team skill.
  - DeepSeek thinking levels are now available in the composer as Low, High, and Max, and are correctly sent to the API.
  Bug Fixes
  - Fixed sidebar alignment issues with project counts and unread dots.
  - The date page now has a way back.
  - Fixed mention behavior when a tab is closed, and kept draft text correctly mirrored.
  - Team connections now show “reconnecting” while retrying instead of a raw socket error.
  - The token display stays aligned when the composer text area grows a scrollbar.
  - New threads now inherit the project card’s default model and thinking effort.
  - Threads are named from the first message instead of after the full first reply.
  - File-reference pills now work on click: they reload if missing, fold if matched, or say “not found.”
  - Fixed the Windows command-line tool to find its bundled runtime and avoid breaking Git Bash PATH.
  - Fixed context compaction: mid-turn compaction survives AutoContinue, overhead is budgeted, failed tool calls are counted, and manual compaction no longer unexpectedly expands context.
  Improvements
  - Refreshed the loopback sign-in page and community site with the alma.now branding.
