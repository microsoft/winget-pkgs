ReleaseNotes: |-
  0.4.34
  Features
  - Prompts now clean up their own scaffolding and verify the criterion as written.
  Improvements
  - Image generation "Auto" now ranks providers and puts GPT Image 2.5 first.
  - Presentations download the LibreOffice runtime only when needed.
  Bug Fixes
  - Refined website download cards.
  - Prevented collapsed Windows chrome from overlapping.
  - Image generation now enforces the configured image model instead of just asking for it.
  - Tool group summaries now only title the groups the reader actually reaches.
  - Fixed a server issue so one turn end results in one fan-out.
  - Windows auto-update now supports resumable downloads.
  - Stopped stalled dialog animations from freezing the whole Windows UI.
  - Prevented the image generation skill from overriding the user's selected model.
  - Stopped the turn-end clerk from backfilling entire conversations.
  - Removed an unnecessary canvas dependency from the headless server bundle.
  - Stopped streaming from waiting out a thinker timeout when the socket is dead.
  - Tools now emit the current AI SDK file part and avoid walking binary payloads.
  - Memory no longer guesses an OpenAI embedding model for custom endpoints.
  - Email account runners now start once the database exists.
  - Headless mode is no longer treated as a broken notification state.
  - Capabilities no longer re-await a failed fetch, and vision stays on when models.dev is unreachable.
  - Evaluation no longer reports a killed turn as finished.
  - Tools never inline images for models that cannot see them.
