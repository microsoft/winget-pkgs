ReleaseNotes: |-
  0.4.1171
  Features
  - Improved thread loading by automatically migrating thread paths in a single step for better consistency and performance.
  - Expanded built-in composition support to include hand-picked tools, run_script, vision input, and summary model.
  Bug Fixes
  - Fixed an issue where task events could arrive before the parent message, causing updates to appear out of order.
  - Fixed time clues on channel guide chips for fresh workspaces so the guide composes correctly without prior syncing.
  - Fixed an issue where WebSocket clients could miss broadcasts when the server woke from idle.
