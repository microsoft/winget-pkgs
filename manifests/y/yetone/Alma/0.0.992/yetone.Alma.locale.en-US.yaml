ReleaseNotes: |-
  0.0.992
  Bug Fixes
  - Timeline hover now uses a rest-based delay, making hover interactions more reliable.
  - Agent IDs are now handled consistently, so CJK (Chinese, Japanese, Korean) names no longer break tasks or references.
  - Fixed hover selection on cards: moving to the select button now works properly.
  - Fixed hover selection travel lock: reaching the select button no longer causes the card to jump upward.
