ReleaseNotes: |-
  0.4.586
  Features
  - On first run, you can now connect a model from the home screen in one step and skip the introduction.
  Improvements
  - Agent sections now expand and collapse with a smoother two-step animation, so headers never overlap fading rows.
  Bug Fixes
  - Fixed an iOS issue where opening the keyboard changed the computer display’s zoom, size, or position.
  - Fixed the reconnecting note so it stays centered in the same spot on every page, below headers and navigation, with a background that keeps it readable.
  - Fixed the window picker over the computer screen closing unexpectedly on iPhone Duo.
