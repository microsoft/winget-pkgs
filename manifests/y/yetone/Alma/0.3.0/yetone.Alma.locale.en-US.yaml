ReleaseNotes: |-
  0.3.0
  Features
  - Introduced Focus Mode: a full-width preview with a floating composer.
  - The Focus Mode composer hides automatically and reappears when you move toward it.
  - Live responses now appear above the Focus Mode composer.
  - The Focus Mode composer appears as a compact pill until you focus it.
  - You can now edit Markdown in place and save it back.
  Bug Fixes
  - Fixed a conflict between the pointer guard and another selection rule in the preview.
  - Fixed tiny mouse movements re-arming the composer.
  - Fixed the reveal area so it only activates near the composer, not the entire edge.
  - Fixed Generative UI widgets taking each other's measurements.
  - Fixed the tucked composer not leaving completely, and opening it no longer opens the model picker.
  - Fixed agent processes not being killed during cleanup.
  - Fixed external absolute paths being folded into the workspace.
  - Fixed tucking so the composer stays on the window edge and the handle moves with it.
  - Fixed the tucked composer to be a tab and gave the handle enough room.
  - Fixed the composer so it stays put while only the handle responds to proximity.
  - Fixed @thread transcripts so each block keeps its source.
  - Fixed Focus Mode so it doesn't outlive the dock it describes.
  - Fixed the RPM install path for non-openSUSE distributions.
  - Fixed the @ picker to provide a way back out of a kind.
  - Fixed setting a goal or loop from the main page.
