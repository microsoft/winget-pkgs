ReleaseNotes: |-
  0.4.162
  Features
  - Added the ability to drag photos and files into the composer on iOS.
  - Added a rotate button when viewing a Mac screen full-screen on iOS.
  Bug Fixes
  - Fixed an issue where the Alma icon flashed in the Dock about every 12 seconds while activity recording was on and Chrome was active.
  - Fixed deck cards to fit their content instead of showing tall empty boxes.
  - Fixed an issue where images from earlier turns could be dropped when using vision models.
  - Fixed an issue where long tool turns in WeChat dropped the final reply.
