ReleaseNotes: |-
  0.4.1074
  Features
  - Turn entry claim is now enabled by default in the Go server. Disable it with ALMA_GO_TURN_ENTRY_CLAIM=0.
  - Go now generates native tool skills and tool search blocks, replacing the previous Node-based generation flags (ALMA_NODE_GEN_NATIVE_SKILLS=1, ALMA_NODE_GEN_NATIVE_TOOLSEARCH=1).
  Bug Fixes
  - Fixed a “database is locked” error in Node’s time-clue writes when a Go commit occurred between the read and write. The write is now an immediate transaction.
