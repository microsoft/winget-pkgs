ReleaseNotes: |-
  0.4.165
  Features
  - Remote handoff can remember a host, so you don’t have to paste the pairing link every time.
  - Clicking an attached PDF or file card in chat opens a preview in the sidebar.
  - Absolute file paths in your own messages open in the sidebar preview.
  Bug Fixes
  - The Read tool is available whenever an overflow archive is in context.
  - Fetched pages now appear in the iOS tool sheet, and Read can open overflow archives in remote workspaces.
  - Renaming in the sidebar no longer traps focus or starts from a double-click that opens a thread; empty lists keep retrying after launch.
  - Messages sent while the connection is down survive the app being killed on iOS.
  - PDFs and Office/iWork files in workspace previews render correctly instead of showing garbled text.
  - Large uploads on slow connections no longer loop on “reconnecting.”
  - The zoomed Mac screen can be dragged to the top again.
  - Pinching to zoom the Mac screen now grows the screen instead of leaving it as a letterboxed strip.
