ReleaseNotes: |-
  0.4.60
  Features
  - Time expressions are now understood by the app's main model, with grammar-based parsing used only as an offline fallback.
  - Posts that @mention you and include a time now become time clues on your device.
  - You can turn a team member into a local person record in one click.
  - The floating tool rail can be unpinned so it auto-hides at the edge of the window.
  - Quick actions on selected text now send it as quoted text instead of a snippet.
  Bug Fixes
  - File header controls now stay on one line, and the browser tab strip no longer grows a scrollbar.
  - Date chips are now treated as a single time clue, and the Time clues dialog is read as one voice.
  - Fixed project header counts accidentally collapsing the row.
  - The Changes diff view now colors code correctly.
  - The document language now follows the app language, so Chinese, Japanese, and Korean text uses a consistent font.
  - Channels now reopen at the last position you were reading, while new channels open at the newest post.
  - One-time scheduled tasks set more than 24.86 days ahead no longer fire when they are created.
