ReleaseNotes: |-
  0.4.939
  Features
  - Desktop: Added sidebar workspaces. Create, rename, and delete workspaces, move projects into them, and use “All” to see everything.
  Bug Fixes
  - Android: Fixed a stuck reply that caused the app to repeatedly download recent messages every 3 seconds. It now fetches the missing update once and waits longer before retrying.
  Improvements
  - Android: Connection logs are kept for one week on your device and can be exported as a .txt file for a selected time range.
