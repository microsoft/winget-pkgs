ReleaseNotes: |-
  Features
  - Android: Swipe up in the Alma or agent chat composer to recall previous messages; swipe down to return to the newest message and empty field.
  - iOS: Swipe up or down in the composer to move through sent messages in Alma and agent chats, matching the desktop ↑/↓ behavior.
  Bug Fixes
  - iOS: A flick on the resting composer field no longer registers as a tap.
  - Settings: The Magpie provider now shows the custom provider’s Blocks instead of Magpie’s own mark in desktop and Electron apps, including model pickers.
