ReleaseNotes: |-
  0.4.833
  Features
  - WeChat bot's core logic now runs in Go, improving reliability and adding support for mapping, commands, watchdog, early sending, final replies, and files. Node continues to handle the WeChat connection.
  Improvements
  - Android: Made buttons larger and easier to tap in the chat list bar, agent composer, and home header, matching the iOS layout.
  Bug Fixes
  - Android: Fixed button spacing and placement; the New Chat button now sits next to the search field and an extra gap after Back has been removed.
