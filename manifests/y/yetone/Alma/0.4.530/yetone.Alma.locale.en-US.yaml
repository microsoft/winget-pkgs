ReleaseNotes: |-
  0.4.530
  Bug Fixes
  - Fixed Add Project and Select Directory on remote computer windows so they browse that computer’s folders instead of doing nothing.
  - Fixed Linux login entries so they stay working after updates and report the correct status when an entry is missing or not executable.
  - Fixed compatibility with Gemini 3+ models by sending the correct thinking setting.
  Improvements
  - Updated the Android app to version 3.2 (version code 47). Re-pairing now replaces the old pairing, and website download links point to the latest Android build.
