ReleaseNotes: |-
  0.4.774
  Features
  - Desktop: The sidebar now acts as an inbox. Threads an agent is working on in the background fold into a “Working” group at the top and return to the list when they need your attention—such as when a run ends, or when there’s an approval, question, or failure. The open thread stays visible, and a short delay prevents flicker between consecutive runs.
  - iOS and Android: The agent composer’s “/” list now includes OMP’s built-in commands such as /model, /compact, /plan, /handoff, and /resume.
  Improvements
  - Android: Slash command descriptions now appear in Chinese when the phone language is set to Chinese.
  Bug Fixes
  - iOS: The agent composer’s glass now fades into the page’s own color instead of grey and extends to the bottom edge, so the area above the home indicator is no longer left bare.
  - iOS: Removed a light column beside the agent composer and unified the frost and wash gradient so it lands on the page’s color.
  - iOS: The agent chat composer now sits on glass tinted with the page’s own hue, with rows blurring out progressively beneath it.
