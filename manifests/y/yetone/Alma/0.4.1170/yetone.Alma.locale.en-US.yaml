ReleaseNotes: |-
  0.4.1170
  Improvements
  - Discord routes now respond with "bot not active" directly from the Go server when Node is idle and the Go bot isn't running, avoiding an unnecessary Node startup.
  - OpenAI-compatible chat completion requests are now prepared in Go when Node is idle, so they no longer start Node.
  - Native host update and download requests now respond with "not supported" from Go when Node is idle and no host is attached.
