ReleaseNotes: |-
  0.4.155
  Features
  - You can now send a new message while a reply is streaming to steer the running turn.
  Bug Fixes
  - Added a close button to the expiring reference notification.
  - Fixed flickering of the thinking indicator while DeepSeek is reasoning.
  - Fixed images being sent as "base64,[object Object]" in Copilot.
  - Fixed card consult and drafting in projects when using a single GLM model.
  - Fixed "where to continue" pointers to show the thread's name instead of an alma:// link.
  Improvements
  - Starred models from the Mac now appear first in the model picker.
