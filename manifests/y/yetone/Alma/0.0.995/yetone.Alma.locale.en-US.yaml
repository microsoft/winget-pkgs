ReleaseNotes: |-
  0.0.995
  Features
  - Added a mechanical ratchet haptic effect with click-stops that adapt to your scrolling speed.
  - Added stronger haptic ticks, five ratchet style options, and a settings screen to customize them.
  - Timeline now gives a single haptic tick each time you cross a marker.
  Bug Fixes
  - Haptic feedback now works on all connected multitouch devices, not just the first one.
  - Timeline rail highlight now follows the pointer instantly.
