ReleaseNotes: |-
  0.4.766
  Features
  - Task subagents now receive a more complete system prompt from the Go server, including the task type prompt, environment note, managed agent profile and catalog, and available skills. The previous method remains as a fallback where exact behavior isn’t reproduced.
  Bug Fixes
  - Folders with thousands of files no longer slow down the Files panel; it now loads only the visible rows while still letting you reveal any file.
  - Fixed an issue where making two quick edits to a custom model could cause one edit to be lost.
  - Time formatting now rounds correctly: 999.6 ms displays as 1.0 s, and 59.96 s displays as 1.0 m.
  - Importing a Chrome profile whose cookies were wiped no longer fails; it imports no cookies instead.
  - Starting a new chat from a first message no longer pulls you back from another chat you opened in the meantime.
