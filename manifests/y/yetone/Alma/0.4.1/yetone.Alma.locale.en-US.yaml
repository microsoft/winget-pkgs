ReleaseNotes: |-
  0.4.1
  Bug Fixes
  - The link dialog now finds same-project files from any entry point, and arrow-key navigation works.
  - Focus mode no longer covers the sidebar, respecting the card’s slight overhang.
  - The outputs button now docks into the dock header, eliminating overlap and positioning gaps; the floating rail fully unloads when not needed.
  - Manual dock resizing always keeps a chat column visible, and focus-mode leftovers are cleaned up.
  - Clicking outside the composer collapses it again.
  - Fixed an issue where the first click after expanding the composer was ignored.
  - The composer no longer collapses when interacting with menus.
  - Narrow docks use compact icon-only tabs, and the close button stays visible in focus mode.
  - The zero-permission support panel no longer looks like a dark box inside a dark box.
  - Composer corner styling is consistent, and clicking the model picker no longer shrinks the composer.
  - Centered thread info in the titlebar no longer slides under the crew pill.
  - Detected areas and hand-drawn masks no longer fight over pointer control.
