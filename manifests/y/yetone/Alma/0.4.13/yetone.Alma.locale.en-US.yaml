  Bug Fixes
  - Fixed scheduled task history so records are kept correctly and removed tasks are not re-delivered.
  - Fixed macOS traffic light buttons to follow the active theme.
  - Fixed crash reporting to ignore normal Windows session shutdown instead of reporting it as a crash.
