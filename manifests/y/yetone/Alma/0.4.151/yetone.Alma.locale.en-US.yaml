ReleaseNotes: |-
  0.4.151
  Features
  - Added a per-chat Fast toggle for models with a priority tier.
  - The sidebar now shows a dot on the project row when Alma has a card suggestion.
  - Right-click a project in the sidebar to open its folder in Finder.
  - On iOS, the project list follows the Mac's order and can also keep its own order.
  Bug Fixes
  - Fixed proposals showing resume names; drafts now keep your picks.
  - Fixed OpenAI-type providers on a gateway not getting its reasoning levels.
