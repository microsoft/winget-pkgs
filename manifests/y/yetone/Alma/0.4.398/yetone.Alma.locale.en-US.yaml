ReleaseNotes: |-
  0.4.398
  Features
  - Android: Added an agent model/effort menu, ink working indicator, and soft scroll edge on agent lists.
  Bug Fixes
  - Fixed long images being squeezed to 1024 px on the long side; they are now sent as readable slices.
  - Fixed Android phones on the same network not moving off the relay like iOS.
  Improvements
  - Android UI now matches iOS in several areas: subagent detail sheet, subagent list rows, chat and agent conversation scroll edges, project order sheet icons, toolbar glass rim, person icon, ink indicator filtering, and file error page.
