ReleaseNotes: |-
  Features
  - Android now matches iOS on the personal screen: Alma appears at the top with a Chat | Routines switch, messenger-style conversation, routing rules, routines, and About you.
  - Alma can now show feelings: shy, angry, busy, happy, relaxed, embarrassed, nervous, and scared.
  - Added an Open at Launch setting on iOS to choose whether Alma or the last open agent appears.
  - The chat search field on iOS now sits at the bottom.
  - Android project cards now show the five most recent projects, with a “Show all” option.
  - If there’s no personal agent, Routines now asks you to update the Mac’s Alma instead of appearing empty.
  Bug Fixes
  - Fixed an issue where unlocking from your phone could type the password into the macOS lock screen.
  - Fixed the Duo rail layout for Alma’s Chat, Routines, and About you.
  - Fixed iOS personal screen and sidebar layout: Alma’s face and Routines appear first, her face shows her state instead of a name tag, and the pinned row works on iPad and Duo.
  - Fixed the iOS chat search field’s position and keyboard dismissal.
  - Fixed Android chat falling behind after a silent stream.
  Improvements
  - Improved Android performance for long chats.
