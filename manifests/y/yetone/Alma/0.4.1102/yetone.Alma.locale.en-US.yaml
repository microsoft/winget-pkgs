ReleaseNotes: |-
  0.4.1102
  Features
  - Introduced Boards on Android: a kanban view with four columns, drag-and-drop or long-press to move cards, live chat status, a “Needs you” badge, card/add/settings sheets, and a Boards entry in the More menu when supported.
  - Introduced Boards on desktop: a kanban view beside agents with four columns, drag-to-reorder or move to In progress to start, card details with Start / Open chat / Send back / Accept, and board settings.
  - New boards now auto-run To-do cards by default, five at a time. Auto-run appears as a simple on/off switch instead of a count.
  Bug Fixes
  - Fixed board cards showing the chat title from when the chat started instead of the updated title when the chat title changed.
