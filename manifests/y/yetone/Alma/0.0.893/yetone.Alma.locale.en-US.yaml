ReleaseNotes: |-
  Features
  - Added a built-in Windows 98 theme that reskins the interface with period-correct chrome, including property-sheet tabs, square windows, and a fix for the composer grip.
  Bug Fixes
  - Fixed text readability for badges in the navy provider selection within the Windows 98 theme.
  - Vertically centered the thread meta in the title bar for the Windows 98 theme.
  - Adjusted the more-menu’s bottom edge spacing to match its internal separator spacing.
  - Prevented duplicate messages by ensuring queued chat rows are claimed correctly, avoiding double-sending.
