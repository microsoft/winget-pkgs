ReleaseNotes: |-
  0.4.954
  Features
  - Added the ability to shut down a simulator from Alma, with a Shut Down option in the device buttons menu and a power button on each running device in the picker. The dock and window close along with it.
  Bug Fixes
  - Fixed alma herdr new --cwd so the chat opens in the selected folder’s workspace, and a home-folder workspace no longer includes every path under home.
  - Paths using ~ are now expanded on the target machine.
  - Updated handling for Claude Code 2.1’s trust screen, including unnumbered prompts and the renamed Yes option.
  - alma herdr close --pane P now closes the chat and removes its workspace when that workspace was created by alma herdr new.
  - Restored click handling for the device buttons and width menus.
  - Fixed a crash when dragging the dock’s resize edge.
