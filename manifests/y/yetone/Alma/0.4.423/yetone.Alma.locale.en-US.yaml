ReleaseNotes: |-
  v0.4.423
  Features
  - Added a blur effect at the top of the personal page under Alma and the switch.
  Improvements
  - Very long conversations now open smoothly, loading earlier messages one page at a time.
  - Chat timestamps are now generated once per screen update instead of for each row.
  Bug Fixes
  - Fixed the Anthropic proxy so it keeps the model requested by Claude Code.
  - Fixed chat losing its scroll position when an iPhone Duo folds or unfolds.
  - Fixed the personal page top: it now uses a thin, progressive blur with no grey band.
  - Fixed an issue with the mascot’s drowsy animation.
  - Fixed the app hanging at launch after a very long agent run.
