ReleaseNotes: |-
  0.4.455
  Features
  - The personal chat typing bubble now shows a small round Alma hopping.
  - Personal chat now shows Alma’s orb pacing and murmuring while waiting instead of three dots.
  Bug Fixes
  - Alma server now stays connected when Discord gateway handshakes time out.
  - Herdr now follows /clear and /new commands in Codex 0.165 or later.
  - Fixed an issue where typing undo could be lost when an agent composer’s text was set in code.
