ReleaseNotes: |-
  0.4.1210
  Features
  - Android 5.01: Easier navigation in long Agents lists, with time sections, a time and project scrubber, search across past conversations, and a queue pill that appears in the correct place.
  Bug Fixes
  - iOS: The title capsule now behaves like the system glass buttons in the bar—it swells and lights up when pressed.
  - iOS: Tapping the queue pill now scrolls to the correct row, even if the row was previously scrolled out of sight.
