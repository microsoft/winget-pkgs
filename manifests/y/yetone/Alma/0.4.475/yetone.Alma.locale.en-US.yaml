ReleaseNotes: |-
  0.4.475
  Bug Fixes
  - Fixed a Codex pane not following its approval reviewer and its verdicts staying out of the chat.
  - Fixed an issue where a Codex pane in a folder could take over a thread started by another pane.
  - Fixed Android rendering of Markdown tables placed immediately after a line of text.
  - Fixed an iOS “Bad thread payload” error when loading a superseded thread.
  - Fixed end-to-end encrypted response bodies to be paced by the phone’s acknowledgements.
  - Fixed Android stream resync after a lost update, and added relay fallback when a direct connection becomes unstable.
