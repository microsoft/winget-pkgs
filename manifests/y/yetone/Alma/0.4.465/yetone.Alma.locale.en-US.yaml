ReleaseNotes: |-
  0.4.465
  Features
  - Personal chat murmurs now appear beside Alma’s badge instead of showing a second typing indicator below.
  - Personal typing now shows Alma’s own face blinking and glancing, replacing the drawn mochi.
  Bug Fixes
  - Fixed an issue where a message sent mid-turn could be missed if it became a background run.
  - Fixed the typing indicator cropping Alma’s head.
  - Fixed a potential crash when deleting text in the composer after sending.
