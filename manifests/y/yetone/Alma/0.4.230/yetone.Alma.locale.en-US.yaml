ReleaseNotes: |-
  0.4.230
  Features
  - View Pi sessions as chats and start Pi from your phone.
  - Sort agent chats and spaces.
  - Send files from your phone to an agent.
  - Add your own text to agent prompts and chat about it.
  - Submit button for multiple-choice agent prompts.
  - Route glyph beside the title opens the space menu.
  - Switch spaces from the title menu.
  - Swipe between images in a chat's lightbox.
  - Show local network or relay status under root titles.
  - Read a prompt beside Claude Code's diff panel, with checkboxes.
  Improvements
  - Clear message to update the Mac when a subagent route is missing.
  - Route subtitle now uses words only; navigation subtitle drops symbols.
  Bug Fixes
  - Fixed blank page left past the end of a chat; the arrow now reaches the true end.
