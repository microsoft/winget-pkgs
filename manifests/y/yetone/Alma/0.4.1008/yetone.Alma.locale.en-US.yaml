ReleaseNotes: |-
  Features
  - Added Amp to the new-tab menu on phone and computer. Amp opens in its own terminal and is recognized correctly when installed via npm.
  Improvements
  - Improved server responsiveness and reliability: the health endpoint stays available while the server manages the database, and personal host settings and scheduled check-ins are now handled directly by the server. Proxy fallback activity is also logged for easier troubleshooting.
  Bug Fixes
  - Fixed Android composer long-press behavior: long-pressing now selects text instead of starting voice input. Hold-to-talk only works when the composer is empty; when the keyboard is open or text has been typed, use the microphone button to talk.
