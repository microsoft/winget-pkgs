ReleaseNotes: |-
  0.4.1152
  Features
  - Added a New Folder option in the computer's folder picker on iOS and Android. The folder is created on the computer and opens ready for selection.
  Bug Fixes
  - Fixed results from a dispatched run so they return to the main conversation instead of its opening line.
  - Fixed how Alma’s additions to a task appear: they now show as folded system notes instead of user messages.
  - Fixed an iOS visual issue where a pressed button over the composer lost its top edge while the find bar was folded.
  - Fixed mobile relay dropouts so brief interruptions no longer appear as a lost connection. The app now holds the current screen, reconnects faster, and avoids re-downloading the full thread list.
