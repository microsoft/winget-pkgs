ReleaseNotes: |-
  Features
  - Android remote desktop keyboard now works like a physical keyboard.
  - Added iOS-style context menus on Android that lift rows over a dimmed page.
  - Added background job cards and pane menus that visually lift the item they act on.
  - You can now start a new chat outside any project on Android.
  Bug Fixes
  - Fixed an issue where an unanswered question could leave the assistant waiting even after the turn was marked done.
  - Fixed an iOS issue where an agent's question appeared garbled; it now shows the transcript text in the agent's own words.
  - Fixed Android chat widgets flashing blank while scrolling.
  - Fixed several Android visual glitches, including the send button arrow and rim, sparkles, checkmark, and glyphs.
  Improvements
  - Improved Android UI to match iOS 26 more closely: menus open from their buttons, confirmation popovers have matching tail/rim/glass, and sheet/title/More menus align with iOS.
  - Improved Android typography and layout: row heights, spacing, font metrics, text wrapping, Dynamic Type leading, chevrons, settings sections, and footers now match iOS.
  - Improved Android glass effects for light and dark pages, including blur, translucency, shadow, and page-specific blur.
  - Improved Android message previews, agent rows, space chips, and context menus to open and display like iOS.
  - Improved Android connection log, terminal font, and color scheme page layouts to match iOS.
