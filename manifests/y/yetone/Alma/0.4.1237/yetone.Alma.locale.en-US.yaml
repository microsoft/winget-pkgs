ReleaseNotes: |-
  0.4.1237
  Bug Fixes
  - Fixed Whisper model downloads so they automatically use a mirror when Hugging Face is slow or unavailable, and show a clear reason if a download fails.
  - Fixed the Herdr title button on iOS so it no longer dims the entire capsule when tapped.
  - Fixed back navigation on mobile: opening Herdr from the chat list and tapping Back now returns to the chat list instead of the home screen.
  - Fixed background agent statuses on Android and iOS so finished tasks no longer keep showing as running, and tasks the system no longer tracks appear as stopped.
