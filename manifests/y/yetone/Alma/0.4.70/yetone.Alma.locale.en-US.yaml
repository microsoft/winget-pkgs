ReleaseNotes: |-
  0.4.70
  Features
  - Added a phone-friendly message composer and long-press message actions on iOS.
  - After adding a scratch reference, a popup now offers “Add to this message.”
  - Dragging a thread to the edge of a conversation now splits the view into two panes.
  Improvements
  - Adjusted default widths for one-action layouts.
  - The artifact dock now remains available after updating or restarting the app.
  Bug Fixes
  - Removed remaining desktop-style interface elements from phone messages on iOS.
