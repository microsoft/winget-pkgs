ReleaseNotes: |-
  0.4.231
  Features
  - Reply to agent questions directly from a notification: allow, deny, or answer.
  - See a Live Activity on your phone while agents work.
  - Open Codex chats as regular chat conversations.
  - Mute notifications for individual workspaces.
  - Start agents and automatically clear resolved notifications.
  - Long-press a chat message to copy it, select part of it, or share it.
  - Drag to reorder chats and spaces.
  - Choose an agent from the + menu when starting a new chat.
  Bug Fixes
  - Fixed a crash that could occur when closing a swiped tab.
  - Fixed a crash in the chat list after closing a chat.
  - Ensured answers to agent questions go only to the intended question.
  Improvements
  - Chats now start instantly, with no polling for new messages.
  - Live Activity updates stay current and are delivered reliably.
  - Added clearer agent markers when starting new chats and simplified chat row subtitles.
  - Closing a tab now shows a confirmation alert that stays on screen.
  - Improved security for phone connections and limited file access to home and temporary folders.
