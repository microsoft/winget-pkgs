ReleaseNotes: |-
  0.4.146
  Features
  - iPhone Browser and Terminal now support multiple tabs.
  - Terminal can mirror the Mac’s PTY sessions.
  - The agent browser renders at 2x while a phone is watching, keeping the live view sharp on standard displays.
  Bug Fixes
  - Dragging the live browser page no longer moves the sheet.
  - The folder button now appears as soon as a thread gets its workspace mid-turn.
  - Running tool rows keep their command or description while the thread is generating.
  - Deleting a chat now moves its unused session folder to the Trash.
