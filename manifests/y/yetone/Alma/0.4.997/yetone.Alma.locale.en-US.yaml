ReleaseNotes: |-
  Features
  - Agents in a Herdr pane can now send files directly to you using alma send file. Alma installs and updates a file-sending skill in each supported agent (Claude Code, Codex, agents, pi, omp), and files appear as cards or images in the chat under the step and in Outputs.
  - Skill extraction for Go turns now runs directly in Go, including analysis, generation, saving, cache refresh, progress updates, and analyzed stamps. This improves performance and removes the need for a broadcast. A kill switch is available with ALMA_NODE_GEN_SKILLS=1.
