ReleaseNotes: |-
  0.4.1243
  Bug Fixes
  - Long tasks now wait for approval instead of failing while you're away.
  - "Always Allow" choices in a chat now persist after a restart.
  - Unanswered approval or question cards now stay valid for up to a day instead of 10 minutes.
  - Time spent waiting for approval or question cards no longer counts toward task timeouts.
  - Script commands now respect their configured timeout instead of being capped at 5 minutes.
  - Fixed terminal pane sizing on paired computers so Claude Code lines no longer appear jumbled.
  - Fixed Alma Server requests through Magpie gateway being attributed to the wrong name.
  Features
  - Bash approval requests now explain why they're asking, including the reason and risk level.
  - "Allow in This Chat" now shows the scope of the permission being granted.
