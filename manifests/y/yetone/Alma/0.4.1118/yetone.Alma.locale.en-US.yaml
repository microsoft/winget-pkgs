ReleaseNotes: |-
  0.4.1118
  Features
  - Server background updates now run without waking Node.js for thread deletions, status updates, usage prices, remote host statuses, and the bun path.
  Bug Fixes
  - Fixed the remote screen going black or freezing on iPhones after opening a full-screen view, showing a still image, or resizing. The video layer now keeps the last frame visible at any size and in any window.
