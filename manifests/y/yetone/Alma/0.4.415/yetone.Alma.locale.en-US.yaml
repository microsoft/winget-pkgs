ReleaseNotes: |-
  v0.4.415
  Features
  - Android: Routine replies are now shown as cards.
  - Android: Added Alma’s live vitals.
  - Android: Cron schedules are now described in plain words.
  - Android: Search is now located at the bottom of the screen.
  - Android: Added an Open at Launch option.
  - Android: The window picker now holds the session.
  Bug Fixes
  - iOS: Fixed a crash when an image viewer was missing from a view’s environment.
  - iOS: Fixed the live terminal screen freezing the phone.
  - iOS: Fixed search on the personal home screen zooming the chat list out of its button.
  - Chat: The tool router can now see pasted text and no longer shows its output.
  - Linux: Fixed screenshot capture hanging when Hyprland/Sway monitors were asleep.
