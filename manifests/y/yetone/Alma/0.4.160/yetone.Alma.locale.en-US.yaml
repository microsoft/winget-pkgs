ReleaseNotes: |-
  0.4.160
  Features
  - iOS now supports Browser picture-in-picture over chat, just like on Mac. Tap the floating window to open the Browser tab.
  - The agent can open work that needs review in the sidebar browser for you.
  - On iOS, you can annotate and edit images opened from the workspace Files tab.
  Improvements
  - Applying changes in the image annotator is faster and creates smaller files.
  - Remote screen sharing is sharper, with higher-quality video and connection stats in the status indicator.
  Bug Fixes
  - Fixed prompt caching so tool steps no longer re-bill the whole turn.
