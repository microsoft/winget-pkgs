ReleaseNotes: |-
  0.4.916
  Features
  - Added Chinese language support on Android. The app follows the system language by default, with options for System, English, or 简体中文 in Settings → Language.
  Bug Fixes
  - Fixed merged or closed pull requests showing on agents when a long-lived branch remained after merge, preventing old PR badges from appearing on every agent in that checkout.
  - Fixed the merged PR badge color on iOS. It now uses a quiet lavender instead of system purple, so it doesn’t glare beside titles.
  - Fixed the sidebar Alma | Herdr switcher on Windows and Linux. The capsule track was removed to avoid looking like a slab; only the thumb shows by default. You can re-enable the background in Settings > User Interface > Advanced > Sidebar Switcher Background (on by default on macOS).
