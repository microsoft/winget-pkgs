ReleaseNotes: |-
  0.4.1066
  Features
  - Links now open in the system browser by default. Right-click on desktop or long-press on iOS/Android offers options to open in the built-in browser, the remote computer’s browser, or copy the link.
  - Flicking a page in the remote browser now keeps scrolling after you lift your finger and gradually slows to a stop, like a page on a phone.
  Bug Fixes
  - Restored swipe scrolling in the remote browser.
  - Scroll inputs waiting behind a slow remote-control command now merge into one instead of piling up.
  - If Chrome doesn’t respond to an input, it no longer blocks other actions after 1.5 seconds.
  - If a tab isn’t updating its display, the remote browser now sends a fresh picture after each input.
