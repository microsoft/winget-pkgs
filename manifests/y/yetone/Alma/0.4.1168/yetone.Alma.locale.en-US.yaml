ReleaseNotes: |-
  Features
  - Added a Recently Deleted area for chats and conversations. Deleted items are kept for 30 days and can be restored or permanently deleted.
    - Desktop: Find it under More → Recently Deleted, with remaining days shown and Restore / Delete Now actions.
    - Android: Find it at the bottom of the chat list.
    - Threads: Deleted conversations can be restored within 30 days.
  - Delete confirmations now let you know that deleted chats can be restored for 30 days.
