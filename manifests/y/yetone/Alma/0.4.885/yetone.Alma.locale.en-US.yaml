ReleaseNotes: |-
  0.4.885
  Bug Fixes
  - Fixed an interrupted subagent recovery issue that could make a thread appear stuck with no visible status or stop control, causing the reply to hang indefinitely. Threads now recover side by side instead of waiting on one another.
  - Fixed an Android issue where holding the composer to talk would pop up the text toolbar (Select all / Autofill).
  Improvements
  - Search reindexing after certain turns is now handled in Go, improving performance and reducing reliance on legacy Node processing.
  Updates
  - Android download page updated to version 4.20.
