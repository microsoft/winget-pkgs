ReleaseNotes: |-
  0.4.1105
  Features
  - Added the ability to export the connection log as a .txt file on iOS. You can choose the last 10 minutes, the last hour, or everything, then copy or share the file.
  Bug Fixes
  - Fixed a crash on desktop that could happen after the agent typed or clicked in a browser tab.
  - Fixed an issue on iOS 27.0 where sending a message with the keyboard open could freeze the app.
  - Fixed a crash on iOS 17.0–17.1 when rotating the screen while the agent title showed a waiting animation.
  - Fixed the context gauge so it updates step by step during an agent turn instead of only after the turn ends.
  - Fixed missing token usage data for custom OpenAI Chat providers, which could make the context gauge and token counter inaccurate.
