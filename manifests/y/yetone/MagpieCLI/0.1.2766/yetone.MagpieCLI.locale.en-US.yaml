ReleaseNotes: |-
  Features
  - Added support for Loomy’s Hy-Image generators using the images API.
  Bug Fixes
  - Fixed relayed citations missing required offsets being dropped, keeping conversation threads intact.
  - Fixed spawned Claude Code sessions not registering the claude-cli:// URL handler.
  - Fixed a released run leaving its session active for the next conversation turn after answering a prompt suggestion.
  - Fixed duplicate tool use IDs in relayed Messages replies by salting IDs the client has already seen.
  - Fixed CORS preflight requests from another machine being incorrectly prompted for an API key.
  - Fixed plugin fetches hanging on silent streams; they now time out after 30 minutes.
  - Fixed incorrect provider fallback messaging when a lapsed account was kept first.
  Improvements
  - Improved DavSync error messages for denied writes to include the target folder and quota status.
