PackageIdentifier: yetone.MagpieCLI
PackageVersion: 0.1.2766
PackageLocale: zh-CN
ShortDescription: 为你的所有 Agent 统一选模型 - magpie 的纯命令行版本。
Description: |-
  magpie 是给你所有 Agent 统一选模型的地方。先把你有的供应商加进来，再给每个 Agent 选一个模型；magpie 会把它写进那个 Agent 自己的配置文件。
  背后是一个跑在你本机的小网关。它同时支持 OpenAI、Anthropic 和 Gemini 三种 API，并在它们之间互相转换，所以任何 Agent 都能用任何供应商的模型；一个账号额度用完时会自动换到下一个。
  本包提供只在终端使用的构建，它运行同一个网关并把 magpie 命令加入你的 PATH。桌面应用以独立的便携可执行文件发布。
Tags:
- 人工智能
- 代理
- 网关
- 路由
ReleaseNotes: |-
  Features
  - 添加了通过 images API 使用 Loomy 的 Hy-Image 生成器的支持。
  Bug Fixes
  - 修复了转发的引用因缺少所需偏移量而被丢弃的问题，从而保持对话线程完整。
  - 修复了生成的 Claude Code 会话未注册 claude-cli:// URL 处理器的问题。
  - 修复了已释放的运行在回答提示建议后，其会话在下一轮对话中仍保持活动的问题。
  - 修复了转发的 Messages 回复中重复的工具使用 ID，通过对客户端已见过的 ID 加盐来解决。
  - 修复了来自另一台机器的 CORS 预检请求被错误地提示输入 API 密钥的问题。
  - 修复了插件获取在静默流上挂起的问题；现在它们会在 30 分钟后超时。
  - 修复了当失效账户被保留在首位时，提供商回退消息不正确的问题。
  Improvements
  - 改进了 DavSync 在写入被拒绝时的错误消息，使其包含目标文件夹和配额状态。
