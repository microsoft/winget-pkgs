PackageIdentifier: yetone.MagpieCLI
PackageVersion: 0.1.3199
PackageLocale: zh-CN
ShortDescription: 为你的所有 Agent 统一选模型 - magpie 的纯命令行版本。
Description: |-
  magpie 是给你所有 Agent 统一选模型的地方。先把你有的供应商加进来，再给每个 Agent 选一个模型；magpie 会把它写进那个 Agent 自己的配置文件。
  背后是一个跑在你本机的小网关。它同时支持 OpenAI、Anthropic 和 Gemini 三种 API，并在它们之间互相转换，所以任何 Agent 都能用任何供应商的模型；一个账号额度用完时会自动换到下一个。
  本包提供只在终端使用的构建，它运行同一个网关并把 magpie 命令加入你的 PATH。桌面应用以独立的便携可执行文件发布。
Tags:
- 人工智能
- 代理
- 网关
- 路由
ReleaseNotes: |-
  Features
  - 标记为“mix”的搜索 API 现在会一起查询，并且它们的结果页会合并。(#2845)
  - 你现在可以设置一次搜索返回多少条结果，范围为 1 到 20。(#5545)
  Improvements
  - Claude 思考 token 现在会计为推理 token，并在其他协议的模型进行推理时与 Claude Code 共享。(#3430)
  - Tuned for you 现在按提供商价格而非模型名称对 Magpie 路由的模型进行加权。(#3435)
  Bug Fixes
  - 由智能体取消的请求不再计为失败。(#2398)
  - Copilot 上的 Claude 模型现在对 1 小时缓存写入使用 Copilot 的定价，按 5 分钟写入费率计费。(#3435)
