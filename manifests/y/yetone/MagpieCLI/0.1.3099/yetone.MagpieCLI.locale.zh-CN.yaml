PackageIdentifier: yetone.MagpieCLI
PackageVersion: 0.1.3099
PackageLocale: zh-CN
ShortDescription: 为你的所有 Agent 统一选模型 - magpie 的纯命令行版本。
Description: |-
  magpie 是给你所有 Agent 统一选模型的地方。先把你有的供应商加进来，再给每个 Agent 选一个模型；magpie 会把它写进那个 Agent 自己的配置文件。
  背后是一个跑在你本机的小网关。它同时支持 OpenAI、Anthropic 和 Gemini 三种 API，并在它们之间互相转换，所以任何 Agent 都能用任何供应商的模型；一个账号额度用完时会自动换到下一个。
  本包提供只在终端使用的构建，它运行同一个网关并把 magpie 命令加入你的 PATH。桌面应用以独立的便携可执行文件发布。
Tags:
- 人工智能
- 代理
- 网关
- 路由
ReleaseNotes: |-
  Bug Fixes
  - 修复了网关在 403 禁止访问响应中无法正确显示模型名称的问题。
  - 修复了网关，使其能够正确分类同时提到 “insufficient_quota” 和每分钟限制的限流响应。
  - 修复了将 LiteLLM “Budget has been exceeded” 错误视为配额限制，以便密钥配额限制生效的问题。
  - 修复了对超过模型上下文长度的提示的检测，以便 Codex 自动进行压缩。
  - 修复了路由组使用自身的意图置信度设置而不是继承该设置的问题。
  - 修复了卸载程序，使其即使相关 Magpie 设置已不存在，也能移除 Codex 的网关 URL。
  - 修复了 macOS 上 Dock 和托盘图标透明度的问题。
