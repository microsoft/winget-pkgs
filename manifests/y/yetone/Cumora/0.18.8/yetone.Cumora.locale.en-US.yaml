ReleaseNotes: |-
  Changes
  fix: mount agent FUSE directly during bootstrap (#344)
  release: v0.18.8 (#343)
  feat(byoa): upgrade paired computer engines from their cards (#342)
  fix(byoa): restore sandboxed Bash for Claude agents
  feat(byoa): add Maka ACP persistent-session engine adapter (#338)
  fix(antigravity): preserve ongoing work after progress replies
  perf(antigravity): stop re-inlining the standing prompt and bound the reply tail
  perf(antigravity): skip default cold local triage spawn in favor of persistent session
  fix(antigravity): avoid inner --sandbox EPERM on real turns and support --conversation resume
  feat(byoa): add native Fast Mode for Codex and Claude Code
  fix(byoa): isolate Codex state and preserve sessions and login (#327)
  fix(byoa): do not advance inbox drain watermark on failed fetch (#304)
  fix(ship): don't sit on 'Opening contract…' when nothing is selected
  fix(windows): integrate native controls into app title bar
  fix(cleanup): stop retrying a workspace deletion forever (#324)
  fix(server): drain on shutdown and stop gating listen on backfill (#326)
  fix(db): keep readiness off the request pool (#325)
  fix(realtime): durable wakes go through the outbox (#321)
  fix(migrate): rebuild required indexes before the deploy gate (#323)
  fix(idle): run the heartbeat on one replica (#322)
  fix(security): keep model ids out of the Windows shell (#320)
  fix(email): an unauthenticated From is no longer a workspace member (#319)
  docs: record the contracts the comments were inventing (#316)
  fix(kanban): include unclassified due cards and preserve early years
  feat(kanban): add optional card due dates
  fix: keep computers add command collapsed by default
  fix: copy pairing commands through native desktop clipboard
  fix: report pairing command copy failures accurately
  fix(computers): hide pairing code after settings closes
  feat(computers): rotate workspace pairing code
  fix(invites): a refused accept re-POSTed forever
  fix(polls): a half-filled poll followed the conversation switch
