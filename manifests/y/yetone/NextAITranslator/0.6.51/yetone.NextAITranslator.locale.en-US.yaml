ReleaseNotes: |-
  Gemini follows the thinking switch, and MiniMax-M3 is the default MiniMax model
  - Gemini now follows the "thinking" switch in settings: with it off, translations use as little thinking as each model allows (faster); with it on, the model thinks normally. Gemini 3.x models use their thinking levels (#1900, thanks @Loongphy)
  - MiniMax-M3 is now the default MiniMax model; the older M2.5 models were removed from the list (your saved model choice is kept) (#1884, thanks @octo-patch)
