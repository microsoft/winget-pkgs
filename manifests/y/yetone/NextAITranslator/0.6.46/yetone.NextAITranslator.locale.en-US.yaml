ReleaseNotes: |-
  Current Claude and Azure models work again, and failed lookups stop spinning
  - Fixed Claude Opus 4.7+, Sonnet 5+, Haiku 5.5 and Fable 5+ rejecting every request: they no longer accept temperature or a thinking budget, so the app now uses adaptive thinking with an effort level on those models, and the 5.5 models are in the model list (#1937, #1941)
  - Fixed Azure OpenAI rejecting gpt-4o, gpt-4.1, gpt-5 and o-series deployments, and Azure AI Foundry endpoints, by sending max_completion_tokens instead of max_tokens (#1926, #1936)
  - Fixed the Responses API receiving max_completion_tokens; it is now sent as max_output_tokens (#1942)
  - The compact inline lookup window now stops loading and shows the error when a translation fails, instead of spinning forever (#1938, #1942)
