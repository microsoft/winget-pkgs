PackageIdentifier: yetone.Magpie.CLI
PackageVersion: 0.1.4917
PackageLocale: zh-CN
ShortDescription: 为你的所有 Agent 统一选模型 - magpie 的纯命令行版本。
Description: |-
  magpie 是给你所有 Agent 统一选模型的地方。先把你有的供应商加进来，再给每个 Agent 选一个模型；magpie 会把它写进那个 Agent 自己的配置文件。
  背后是一个跑在你本机的小网关。它同时支持 OpenAI、Anthropic 和 Gemini 三种 API，并在它们之间互相转换，所以任何 Agent 都能用任何供应商的模型；一个账号额度用完时会自动换到下一个。
  本包提供只在终端使用的构建，它运行同一个网关并把 magpie 命令加入你的 PATH。桌面应用以独立的便携可执行文件发布。
Tags:
- 人工智能
- 代理
- 网关
- 路由
ReleaseNotes: |-
  Features
  - 添加了共享房间，以便多个访客可以在 usemagpie.ai 上共同使用同一个页面。
  - 页面现在可以从打开它们的浏览器中安装为应用。
  - 添加了听写支持，使页面可以接收查看者的语音内容。
  - 添加了文本转语音功能，使页面文本可以使用 Magpie 的语音模型朗读。
  - 添加了下载功能，允许页面提供文件，查看者确认后即可保存。
  - 添加了页面评论功能，并可选将评论发送给页面的智能体。
  - 页面现在可以直接向模型提问。
  - 页面可以通过 Library 代表查看者运行其 manifest 中列出的 MCP 工具。
  - 页面可以从其发布时所在的文件夹读取文件，并与查看者的访问权限相匹配。
  - 在另一台计算机上打开的页面可以独立运行，而无需完整的查看器外壳。
  Improvements
  - 模型列表端点现在会报告最大上下文窗口，并与远程 Magpie 保持同步更新。
  - 改进了能力文档，以便智能体能够更好地理解页面如何调用其能力。
  - MCP 服务器说明现在会首先介绍何时发布页面。
  - 页面现在会按预期等待 shell 在繁忙时作出响应。
  - 页面后续的发送现在会在前一次发送之后立即打开。
  - 当 Magpie 的 MCP hub 关闭时，页面现在会收到正确的状态，而不是误导性的缺失服务器错误。
  Bug Fixes
  - 修复了 CLI 包检查中的一个 Windows 路径问题。
  - 修复了 share.json 权限检查，使其仅在支持文件权限的平台上运行。
  - 修复了非常大的租约 TTL 值会回绕并变短的问题。
  - 修复了页面在查看者允许之前就能发表评论的问题。
