ReleaseNotes: |-
  Features
  - Added shared rooms so multiple visitors can use a page together on usemagpie.ai.
  - Pages can now be installed as apps from the browser they open in.
  - Added dictation support, so a page can receive the viewer’s spoken words.
  - Added text-to-speech, so a page’s text can be read aloud using Magpie’s speech model.
  - Added downloads, letting pages provide files that viewers can save after confirming.
  - Added comments on pages, with the option to send a comment to the page’s agent.
  - Pages can now ask a model directly.
  - Pages can run MCP tools listed in their manifest through the Library on the viewer’s behalf.
  - Pages can read files from the folder they were published from, matching the viewer’s access.
  - Pages opened on another computer can run standalone without the full viewer shell.
  Improvements
  - The model list endpoint now reports the maximum context window and stays updated with a remote Magpie.
  - Improved capability documentation so agents can better understand how pages call their capabilities.
  - MCP server instructions now lead with when to publish a page.
  - Pages now wait as long as expected for busy shell responses.
  - Subsequent sends from a page now open immediately after a previous one.
  - When Magpie’s MCP hub is off, pages now receive the correct status instead of a misleading missing-server error.
  Bug Fixes
  - Fixed a Windows path issue in the CLI package check.
  - Fixed share.json permission checks to only run on platforms that support file permissions.
  - Fixed very large lease TTL values so they no longer wrap around and become shorter.
  - Fixed pages being able to write comments before the viewer allowed it.
