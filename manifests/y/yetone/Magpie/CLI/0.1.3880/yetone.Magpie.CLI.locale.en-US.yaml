ShortDescription: Pick every agent's model from one place - the terminal-only CLI build of magpie.
Description: |-
  magpie is one place to choose the model each of your agents uses. Add the providers you have, then pick a model per agent; magpie writes it into that agent's own config.
  Behind it is a small gateway on your machine. It speaks the OpenAI, Anthropic and Gemini APIs and translates between them, so any agent can use any vendor's model, and when one account runs out of quota the next one takes over.
  This package provides the terminal-only build, which runs the same gateway and puts the magpie command on your PATH. The desktop app is published as a separate portable executable.
