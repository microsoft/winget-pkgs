ReleaseNotes: |-
  1. Optimized the feature of forwarding incoming calls to voicemail: The Send to Voicemail button appears on the incoming call window only if the Voicemail is enabled for your extension (Path: Preferences→Voicemail→Enable Voicemail).
  2. Fixed the following notification issues:
     - Failed to receive pop-up notifications when receiving new messages from internal chat.
     - Connection Error notifications popped up frequently even when the Linkus client was working properly and network connection was intact.
  3. Fixed the external application integration issue: After integrating an external application for call popup, the application did not launch automatically upon receiving an incoming call.
  4. Fixed the call issue: When users logged into Linkus client using an external hostname, there was no audio during calls.
  5. Fixed the number paste issue in Keypad: When pasting numbers into the keypad input field during a call, the content was pasted twice. For example, pasting "1234" resulted in "12341234".
  6. Fixed the following CTI mode issue:
     - After setting Linkus Desktop Client to control Linkus Mobile Client and initiating calls via the Linkus Desktop Client, tapping the answer button on the Linkus Mobile Client failed to establish the call.
     - After setting Linkus Desktop Client to control a CTI-compatible IP phone and initiating calls via the Linkus Desktop Client, the New Call and Keypad buttons were not displayed on the Linkus call window.
