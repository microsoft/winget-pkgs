ReleaseNotes: |-
  1. Added support for Croatian, Serbian and Slovenian interface languages.
  2. Fixed the client auto-startup issue: If Auto Startup was enabled for the Linkus client, when the computer started, the client automatically started but stayed on a blank screen and could not be used.
  3. Fixed the certificate issue: The self-signed certificate for Linkus client was expired and the client could not establish a secure connection with the PBX server.
  4. Fixed the interface display issue: After the client language was switched to German, the UI layout of the client and call window was cramped.
  5. Fixed the client window display issue: When the Linkus client was opened from a chat message notification pop-up, the client window size and position were not retained from the previous session when the client was closed.
  6. Fixed the call control issue: After an outgoing call was hung up via a headset button, the next call could no longer be hung up with the headset button during ringing.
