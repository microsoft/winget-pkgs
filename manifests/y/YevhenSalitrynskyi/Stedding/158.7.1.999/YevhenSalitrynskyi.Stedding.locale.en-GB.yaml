ShortDescription: 'An open-source Arc browser alternative built on Chromium: vertical tabs, Spaces, pinned tabs, a command bar, import from Arc.'
Description: |-
  An open-source, Arc-style browser built on Chromium. A sidebar with vertical tabs, Spaces that can keep their own sign-ins, folders and pinned tabs, a command bar, sidebar sync with no account, and one-click import from Arc. macOS and Windows. No telemetry.

  An open-source alternative to Arc
  Stedding is a desktop browser for people who liked the way Arc worked: tabs live in a sidebar, each project gets its own Space, the important sites are pinned and always where you left them, and ⌘ Command T is one place to search, open a site or jump to any tab. Arc stopped getting new features in 2025; Stedding rebuilds that way of working on ground you control.
  - Open source, all of it.
    The browser, its interface and the build are BSD-3-Clause. No account, no company roadmap, nothing that can be taken away.
  - Built on Chromium stable.
    A small, documented patch series, so it follows Chromium’s security releases and runs the extensions you already use.
  - Private by default.
    No telemetry, no experiments, no Google sign-in or AI surfaces; third-party cookies blocked; the search engine of your choice.

  What Arc never had
  - Open source, with no account.
    Stedding is BSD-licensed and asks you to sign up for nothing: download it and use it. Arc requires an account, and its code is closed.
  - Spaces with their own sign-ins, in one profile.
    Give a Space an Independent session and it keeps its own cookies and site data, so one site can be signed in as work in one Space and as you in another, and the essentials you add there are that Space’s own; extensions, settings, history and saved passwords stay shared. One setting gives every new Space its own session, if you keep them all apart. Arc keeps sign-ins apart only by giving a Space a whole separate profile.
  - Dark pages.
    One switch turns every website dark from its first frame, with no white flash: the moon by the address row, or ⌥ Option ⇧ Shift ⌘ Command D. Keep some sites light, or darken only the ones you list.
  - Apps from any page.
    Add to Dock on the Mac, Install page as app on Windows: the page gets a window and an icon of its own, and stays signed in as the Space it was made in. Arc does not install web apps.
  - Your sidebar on every computer, with no server.
    Pick a folder that syncs, such as iCloud Drive, OneDrive, Dropbox or a network share, or your own WebDAV or S3 storage, and each Stedding keeps its Spaces, pins and folders there, on a Mac and on Windows alike. Nothing goes through a Stedding account or server: there is none.
  - Links without trackers, and ad blocking, when you want them.
    ⇧ Shift ⌘ Command C copies a link without utm_ and similar parameters. One switch takes them off every link you open, too, and ad and tracker blocking is built in, from the EasyList and EasyPrivacy lists. Both are off until you turn them on, at the first start or in Settings.
  - Site cleanup in one step.
    Clear Site Cookies and Reload (⌥ Option ⇧ Shift ⌘ Command R) signs you out of the site in front of you and nothing else; Close Duplicate Tabs is one command away.

  Everything from Arc, in one click
  The first start offers “Move everything from Arc”, on a Mac and on Windows: your Spaces with their colours and icons, the essentials row, pinned tabs, folders, open tabs, history and saved passwords, from Arc’s own files on your disk.
  Nothing leaves your machine. On a Mac, passwords need one keychain prompt; on Windows, none. Run it again later from Settings; nothing is duplicated.
  Arc shuts down on December 22, 2026. Moving from Arc has what comes over, how, and how Arc’s features map to Stedding’s.

  Privacy is a set of defaults
  - No telemetry, no crash reports, no experiments, no identifiers. The new tab page is local and makes no requests.
  - No Google account surfaces. No sign-in, no Google services in the address bar, no AI sections in Settings. You pick the search engine at first start (DuckDuckGo until you do); search suggestions off until you turn them on.
  - Protective defaults on. Third-party cookies blocked, HTTPS-first, Global Privacy Control, quiet permission prompts, Chromium’s ad-measurement APIs off.

  The privacy document lists every network connection the browser makes, with what each one carries, and records what a fresh profile actually contacted. Anything not on the list is a bug.
