PackageIdentifier: YevhenSalitrynskyi.Stedding
PackageVersion: 158.7.0.999
PackageLocale: zh-CN
ShortDescription: 基于 Chromium 构建的开源 Arc 浏览器替代品：垂直标签页、空间、固定的标签页、命令栏，以及从 Arc 导入。
Description: |-
  一款基于 Chromium 构建的 Arc 风格开源浏览器。带垂直标签页的侧边栏、能保留各自登录状态的空间、文件夹和固定的标签页、命令栏、无需账户的侧边栏同步，以及一键从 Arc 导入。macOS 和 Windows。没有遥测。
  Arc 的开源替代品
  Stedding 是为喜欢 Arc 工作方式的人打造的桌面浏览器：标签页住在侧边栏里，每个项目有自己的空间，重要网站固定在原处、始终在你离开时的位置，而 ⌘ Command T 是一个统一入口，用来搜索、打开网站或跳到任意标签页。Arc 从 2025 年起不再有新功能；Stedding 在你自己掌控的地基上重建了这种工作方式。
  - 彻彻底底的开源。
    浏览器、界面和构建都采用 BSD-3-Clause 许可证。没有账户，没有公司路线图，没有任何可能被拿走的东西。
  - 基于 Chromium 稳定版。
    只有一小组有文档记录的补丁，因此能跟上 Chromium 的安全更新，也能运行你已经在用的扩展程序。
  - 默认注重隐私。
    没有遥测、没有实验、没有 Google 登录或 AI 界面；屏蔽第三方 Cookie；搜索引擎由你选择。
  Arc 从未有过的一切
  - 开源，而且不要账户。
    Stedding 采用 BSD 许可证，不要求你注册任何东西：下载就能用。Arc 则需要账户，而且代码闭源。
  - 在同一个配置文件里，让各个空间拥有自己的登录状态。
    给空间设置一个独立会话，它就会保留自己的 Cookie 和站点数据，于是同一个网站可以在这个空间里以工作身份登录、在另一个空间里以你本人身份登录；你在那里添加的常用项也只属于这个空间；扩展程序、设置、历史记录和已保存的密码仍然共享。还有一个设置可以让每个新空间都拥有自己的会话，把所有空间都分开。Arc 只能通过给空间分配一整个独立配置文件来隔离登录状态。
  - 暗色页面。
    一个开关让每个网站从第一帧起就是暗色，没有白屏闪烁：地址栏旁边的月亮，或者 ⌥ Option ⇧ Shift ⌘ Command D。可以让某些网站保持浅色，或只把你列出的网站变暗。
  - 把任何页面变成应用。
    在 Mac 上是“添加到 Dock”，在 Windows 上是“将页面安装为应用”：页面得到自己的窗口和图标，并保持在创建它的那个空间里的登录状态。Arc 不能安装网络应用。
  - 你的侧边栏出现在每台电脑上，而且不需要服务器。
    选择一个会同步的文件夹，例如 iCloud Drive、OneDrive、Dropbox 或网络共享，或者你自己的 WebDAV 或 S3 存储，每台 Mac 和 Windows 上的 Stedding 都会把空间、固定项和文件夹保存在那里。任何东西都不经过 Stedding 的账户或服务器：因为根本没有这种东西。
  - 没有跟踪器的链接，以及按需开启的广告拦截。
    ⇧ Shift ⌘ Command C 会复制不带 utm_ 等参数的链接。一个开关也能在你打开的每个链接上去掉这些参数；广告和跟踪器拦截则基于 EasyList 和 EasyPrivacy 列表内置其中。两者默认都是关闭的，你可以在首次启动或设置里开启。
  - 一步清理站点。
    “清除站点 Cookie 并重新加载”（⌥ Option ⇧ Shift ⌘ Command R）只让你退出眼前的网站，别的都不动；“关闭重复标签页”也只是一条命令的距离。
  Arc 的一切，一键迁移
  首次启动时，无论 Mac 还是 Windows，都会提供“从 Arc 迁移全部内容”：从 Arc 在你磁盘上的自有文件里，读出你的空间及其颜色和图标、常用项栏、固定的标签页、文件夹、打开的标签页、历史记录和已保存的密码。
  没有任何东西离开你的电脑。在 Mac 上，导入密码需要一次钥匙串授权；在 Windows 上则不需要。以后可以从设置里再运行一次；不会有任何重复。
  Arc 将于 2026 年 12 月 22 日关闭。“从 Arc 迁移”说明了哪些内容会迁移过来、如何迁移，以及 Arc 的功能如何对应到 Stedding。
  隐私是一组默认设置
  - 没有遥测、没有崩溃报告、没有实验、没有标识符。新标签页完全在本地，不发出任何请求。
  - 没有 Google 账户界面。没有登录入口，地址栏里没有 Google 服务，设置里也没有 AI 板块。搜索引擎由你在首次启动时选择（在那之前是 DuckDuckGo）；搜索建议默认关闭，直到你开启。
  - 保护性默认项全部开启。屏蔽第三方 Cookie、HTTPS 优先、Global Privacy Control、静默的权限提示，并关闭 Chromium 的广告衡量 API。
  隐私文档列出了浏览器发出的每一个网络连接及其承载的内容，并记录了全新配置文件实际联系过的对象。清单之外的任何连接都是缺陷。
