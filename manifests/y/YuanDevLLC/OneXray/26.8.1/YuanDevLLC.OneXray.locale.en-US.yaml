ReleaseNotes: |-
  OneXray v26.8.1 adds startup controls, custom Xray inbounds, faster batch
  latency checks, and important Apple VPN improvements.
  What's Changed
  - Added desktop launch-at-login and quiet-start options, plus an optional
    Connect on App Launch setting across supported platforms.
  - Added custom Xray Profile inbounds, including dokodemo-door.
  - Reworked node latency checks to process configurations in batches of five.
  - Added an Apple Exclude Local Networks setting.
  - Added selectable Dock icons for macOS.
  - Refined subscription loading indicators, dialogs, and toast notifications.
  - Updated Xray-core to v26.7.28, Apple targets to Swift 6, and Android to AGP
    9.3.
  Fixes
  - Fixed Apple full-tunnel routing and improved iOS/macOS VPN connectivity.
  - Prevented subscription Add actions while a download or update is active.
  - Improved startup setting validation and cleanup behavior.
  - Improved custom inbound validation and runtime configuration handling.
  - Updated dependencies and general build reliability.
