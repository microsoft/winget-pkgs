ReleaseNotes: |-
  A simpler OneXray, with more control when you need it
  OneXray 26.9.1 rebuilds the experience around Connect, Servers, Advanced, and Settings. Start with your own servers and Smart Routing, or choose custom rules and complete Raw JSON configurations.
  Highlights
  - New responsive phone, tablet, and desktop layouts with consistent navigation.
  - Automatic server selection by subscription or location, latency/protocol labels, and edit/share/delete actions.
  - Smart Routing with a single direct region, local-network and Apple/Microsoft service bypass, optional ad blocking, and 1–3 entry servers with load balancing and an optional final exit.
  - Named Custom Routing with domain, IP, port, and network conditions, GeoData completion, and import/sharing independent of servers.
  - Expert mode with complete Raw JSON selection, editing, import, and sharing.
  - Simpler file, clipboard, QR, and subscription imports without a second confirmation for ordinary nodes. Initial setup can finish without waiting for latency tests.
  - Queued latency tests with group cancellation, clear download/test progress, and safe subscription refreshes that retain existing data when no valid nodes are returned.
  - Dedicated routing-data management and separate subscription/GeoData update schedules.
  - Apple on-demand Wi-Fi connect/disconnect rules, iOS cellular/macOS Ethernet behavior, and Android per-app lists with icons and independent include/exclude selections.
  - Windows EXE/ZIP packaging alongside the MSIX system VPN edition, native x64/ARM64 builds, and winget publishing support.
  - System-following theme and language by default, with English, Simplified Chinese, Traditional Chinese, Russian, and Persian.
  - More reliable startup checks, VPN state synchronization, and stop-before-reconnect handling.
  Important changes from v26.8.4
  - The old Simple Profile, Xray Profile, Full Config, and Rule/Global/Direct workflow is replaced by the new connection and routing model.
  - Existing local nodes, subscriptions, and Raw JSON are retained by the database upgrade. Retired Profile/Full Config records are not available in the new interface; recreate needed routing in Custom Routing or use a compatible Raw JSON configuration.
  - Running preferences are reset when upgrading from the old product model. Review your server selection, routing, and platform settings before connecting.
  - Custom Routing allows three configurations. New Raw JSON is limited to three; existing Raw entries above that limit remain visible and usable.
  - Traffic now shows only speeds and counters for the current connection. Historical/device totals and the traffic detail dialog are removed.
  - App backup and backup import/restore are removed. Individual server, subscription, custom-route, and Raw JSON sharing remain.
  - macOS OneXraySE does not expose file-log controls or log viewing.
  - Windows EXE/ZIP and MSIX have separate data locations and are not interchangeable upgrade channels. MSIX Quit leaves the VPN running; use Quit and Stop VPN to disconnect before exiting. EXE/ZIP Quit stops it.
  Before upgrading, keep independent copies of any configuration you need to recreate. Do not rely on importing an old backup archive in this version.
