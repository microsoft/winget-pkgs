ReleaseNotes: |-
  New
  - console: add a test settings page to channel diagnostics, plus a protocol column and per-round details
  - console: test the connection before saving in the model dialog, and fix the fallout from the dependency upgrade (#61)
  - console: make the request-log channel-model filter searchable and drop the redundant channel filter
  - logs: split runtime logs by module and default to the proxy module
  - console: replace the request-log date inputs with a range picker
  - console: sortable headers on the analytics tables
  Fixed
  - build: give the Linux AppImage a safe executable name
  - console: drop the caps in the test config and stop the unit label wrapping
  - build: pin @electron/get to 3.1.0 so release packaging works
  - console: tidy up the request-log filter bar and pin the table header
  - console: baseline-align the header live metric with the runtime status
  - window: make the title bar overlay transparent so it follows the app theme
  - tray: drop the redundant sync footnote from the tray panel
  Changed
  - console: unify persistence on createPersistedStore
  - console: decouple business logic from React and turn the layering into an executable check
  - diagnostics: split diagnostics into domain modules and make the runner a class with subscriptions
  Under the hood
  - deps: upgrade pnpm to 12.14.0 and drop the @electron/get override
  - run electron-builder in CI and narrow the @electron/get override scope
  - upgrade dependencies and compatibility fixes
  Other changes
  - Merge pull request #60 from yinxulai/fix/console-scroll-bottom-padding
