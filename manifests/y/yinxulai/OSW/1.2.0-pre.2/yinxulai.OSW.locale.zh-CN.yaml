PackageIdentifier: yinxulai.OSW
PackageVersion: 1.2.0-pre.2
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 把你手上所有的大模型渠道，合成一个本地地址。当前渠道挂了，自动换下一个。
Description: OSW 在本机跑一个代理服务。你把能用的渠道都配进来（不同供应商、不同账号、不同模型），排好优先级，然后让所有 AI 客户端统一指向一个本地地址。剩下的事它自己做：识别协议、按顺序挑渠道、把请求送出去、失败就换下一个，并把真实发生的一切记录清楚。于是客户端只会看到成功的那一次。
