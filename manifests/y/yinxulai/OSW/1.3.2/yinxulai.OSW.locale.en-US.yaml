ShortDescription: Local LLM API proxy with automatic channel failover.
Description: OSW (One Switch) runs a proxy on your machine. Register every channel you have - different providers, accounts, and models - order them the way they should be tried, and point every AI client at a single local address. OSW identifies the protocol, picks a channel, moves on when one fails, and records exactly what happened. Your client only ever sees the attempt that succeeded.
