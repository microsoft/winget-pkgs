ShortDescription: Convert HTML, XML and Markdown documents to PDF using CSS.
Description: |-
  Prince converts HTML, XML and Markdown documents into PDF files.
  It uses CSS for layout and typography, including paged media features such as page headers and footers, footnotes and cross-references.
  It can also run JavaScript and render SVG and MathML.
  The package includes the prince command-line tool and the Prince graphical interface.
  Prince is free for non-commercial use; commercial use requires a license.
