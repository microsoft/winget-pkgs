ReleaseNotes: |-
  - OTP (desktop): Add keyboard layout families and variants for static passwords.
  - PIV: Remove support for legacy PIN-derived management keys. PIN-protected stored management keys remain supported.
  - PIV: Add support for ML-DSA and ML-KEM keys on PQC YubiKeys.
  - Android: Add support for configuring OTP slots.
  - Desktop: Replace the Python helper with a Rust-based helper using YubiKey Manager 6.0.0-beta.0.
  - Desktop: Unify USB and NFC device handling and device selection.
  - Windows: Add native ARM64 support.
  - Windows: Add a background service for YubiKey access removing the need to elevate to Administrator for FIDO commands.
  - UI: Updated app icons, typography and color scheme.
  - Temporarily cached FIDO, PIV and OATH credentials now expire after three minutes of inactivity.
  - macOS: Raise the minimum supported version to 12.0 (Monterey) to follow Flutter's deployment target requirements.
  - Binaries compiled with Flutter 3.47.8.
