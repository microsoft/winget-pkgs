ShortDescription: Connection manager for SSH, telnet and serial consoles.
Description: |-
  YACM (Yet Another Connection Manager) keeps your SSH, telnet and serial sessions in one tree,
  with an encrypted vault for passwords and keys, credential profiles, jump hosts, tunnels,
  file transfer over SFTP and SCP, TFTP, HTTP and SCP file servers, session logs and team libraries.
  It imports sessions from SecureCRT, MobaXterm, mRemoteNG, PuTTY, Xshell, Ásbrú, ssh config, CSV/Excel and NetBox.
