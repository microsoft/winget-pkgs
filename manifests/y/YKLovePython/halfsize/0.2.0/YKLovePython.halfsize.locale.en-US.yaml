ShortDescription: Compress any video to an exact size locally, with a measured quality report.
Description: |-
  halfsize turns "make this fit in 20 MB" into one command. It computes a bitrate
  budget from the target size, picks the largest resolution that budget can carry,
  runs a two-pass x264 or x265 encode, then measures VMAF and SSIM against the
  source so you know what the compression cost.

  The download includes FFmpeg, so nothing else has to be installed. It provides
  three ways in: a command line, a local web app (halfsize --web) and an MCP server
  for AI agents (halfsize --mcp). Files never leave the machine.
