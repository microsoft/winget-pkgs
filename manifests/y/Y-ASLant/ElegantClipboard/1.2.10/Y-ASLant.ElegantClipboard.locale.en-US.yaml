ReleaseNotes: |-
  • fix：WebView2 运行时更新后，已加载版本与可用版本不同或收到原生版本更新事件时只记录日志，不再单独触发应用重启、恢复通知或阻止设置、翻译、预览和编辑窗口创建，避免每十分钟重复重启并最终熔断。https://github.com/Y-ASLant/ElegantClipboard/issues/160
  • fix：使用 WebView2 官方版本比较忽略 beta、dev、canary 渠道后缀，避免将相同数字版本误判为版本变化。https://github.com/Y-ASLant/ElegantClipboard/issues/166
  • fix：可用版本查询失败不再阻止窗口创建；版本未知、查询失败或比较失败时保留恢复计数，不把无法确认的状态当作检查成功。
  • fix：进程崩溃、连接断开、窗口就绪超时等真实故障继续保留自动恢复。恢复计数跨启动保留，最多允许两次自动恢复，不再因十分钟计数过期而循环重启；成功版本检查且未安排恢复时清理旧计数，记录与清理互斥，避免丢失刚写入的恢复次数。
  • perf：清空搜索、重置窗口状态或切换筛选时取消被替代的搜索防抖，减少重复列表查询。
  • perf：WebDAV 配置加载后不再无变化写回，同步类型只保存改变的子项；通用设置只保存变化字段，避免重复应用自启动和管理员启动开关。保存成功后更新基线，失败字段保留后续重试，保存期间的新修改按顺序处理。
  • chore：补充运行时更新、恢复计数、搜索请求合并及设置保存的回归测试；简化资源状态逻辑并清理冗余测试与临时截图。
