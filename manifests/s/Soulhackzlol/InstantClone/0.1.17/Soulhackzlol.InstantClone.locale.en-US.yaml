ShortDescription: Free, open-source stream delay for OBS. Change the delay live without restarting your stream.
Description: InstantClone sits between OBS and your platforms as a local RTMP delay proxy. Arm a buffer, watch it fill, and change or cut the delay on demand to stop stream snipers, without restarting the stream. Works with Twitch (including Enhanced Broadcasting), YouTube, Kick and multistreaming.
