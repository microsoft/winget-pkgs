ShortDescription: Local YouTube downloader with a browser interface.
Description: |-
  YTGrab downloads YouTube videos and audio you are allowed to save, from a page in your
  browser. It runs only on your computer: pick the exact quality, download playlists after
  reviewing them, pause and resume, and follow progress from the tray. Downloading is done by
  yt-dlp, which is included; FFmpeg and Deno are installed as dependencies.
