ShortDescription: 把书籍、文档和漫画（EPUB、PDF、MOBI、FB2、CBZ 等）转换为本地 HTML，可阅读，并用浏览器自带的网页翻译来翻译。扫描件支持 OCR。可选 Google Cloud 或 Ollama。
Description: |-
  doc-html-translate 是一款 Windows 应用，可把文档（EPUB、PDF、MOBI、AZW3、FB2、RTF、TXT、Markdown、HTML）转换为干净的本地
  HTML，并生成导航和真正的多级目录。内置阅读器提供 light/sepia/dark/night 主题、字号与字体控制，并记住阅读位置。它能识别图片中的文字（OCR 需另行安装 Tesseract - 内置英语语言数据，其他语言按需下载），也可以选择通过 Google Cloud Translation API 或本地 Ollama 模型翻译全部内容。界面提供 13
  种语言。你可以得到一个长长的单页，也可以保留带目录的章节。重新打开已转换过的书籍是瞬间完成的。软件包同时包含命令行程序（doc-html-translate）和一个小巧的图形界面（doc-html-ui）。pdftotext
  已内置于可执行文件中；MOBI 和 AZW3 另需安装 Calibre（仅限无 DRM 的文件）。
  它还能打开漫画压缩包（CBZ/CBR/CB7/CBT）和单张图片（PNG、JPG、WebP、GIF、BMP、TIFF），把识别出的文字叠加在每一页上，以便就地翻译；CBR 和 CB7 需要 7-Zip。
