ShortDescription: 'বই, নথি ও কমিক্স (EPUB, PDF, MOBI, FB2, CBZ ইত্যাদি) স্থানীয় HTML-এ রূপান্তর করে, যা পড়া যায় এবং ব্রাউজারের পেজ অনুবাদ দিয়ে অনুবাদ করা যায়। স্ক্যানের জন্য OCR। ঐচ্ছিক: Google Cloud বা Ollama।'
Description: |-
  doc-html-translate একটি Windows অ্যাপ্লিকেশন, যা নথি (EPUB, PDF, MOBI, AZW3, FB2, RTF, TXT,
  Markdown, HTML) পরিচ্ছন্ন স্থানীয় HTML-এ রূপান্তর করে, সঙ্গে তৈরি নেভিগেশন ও সত্যিকারের বহুস্তরের
  সূচিপত্র। অন্তর্নির্মিত রিডার light/sepia/dark/night থিম, লেখার আকার ও ফন্ট নিয়ন্ত্রণ যোগ করে এবং
  পাঠ-অবস্থান মনে রাখে। এটি ছবির ভিতরের লেখা শনাক্ত করতে পারে (আলাদাভাবে ইনস্টল করা Tesseract দিয়ে OCR - ইংরেজি ভাষার ডেটা সঙ্গে দেওয়া, বাকি ভাষা চাহিদামতো) এবং চাইলে সব কিছু Google Cloud Translation API বা স্থানীয় Ollama মডেল দিয়ে অনুবাদ করতে
  পারে। ইন্টারফেস ১৩টি ভাষায় পাওয়া যায়। আপনি একটিমাত্র লম্বা পৃষ্ঠা পেতে পারেন, বা সূচিপত্রসহ
  অধ্যায়। আগে রূপান্তরিত বই আবার খোলা তাৎক্ষণিক। প্যাকেজে CLI (doc-html-translate) ও একটি ছোট GUI
  (doc-html-ui) দুটোই আছে। pdftotext বাইনারির ভিতরেই আছে; MOBI ও AZW3-এর জন্য অতিরিক্তভাবে Calibre
  ইনস্টল থাকা দরকার (কেবল DRM-মুক্ত ফাইল)।
  এটি কমিক আর্কাইভ (CBZ/CBR/CB7/CBT) ও আলাদা ছবিও (PNG, JPG, WebP, GIF, BMP, TIFF) খোলে এবং শনাক্ত করা লেখা প্রতিটি পৃষ্ঠার উপর বসিয়ে দেয়, যাতে সেখানেই অনুবাদ করা যায়; CBR ও CB7-এর জন্য 7-Zip দরকার।
