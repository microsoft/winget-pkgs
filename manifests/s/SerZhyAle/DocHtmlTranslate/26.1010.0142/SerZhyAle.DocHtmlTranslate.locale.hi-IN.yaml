ShortDescription: 'किताबों, दस्तावेज़ों और कॉमिक्स (EPUB, PDF, MOBI, FB2, CBZ आदि) को स्थानीय HTML में बदलता है, जिसे पढ़ा और ब्राउज़र के पेज अनुवाद से अनूदित किया जा सकता है। स्कैन के लिए OCR। वैकल्पिक: Google Cloud या Ollama।'
Description: |-
  doc-html-translate एक Windows एप्लिकेशन है जो दस्तावेज़ों (EPUB, PDF, MOBI, AZW3, FB2, RTF, TXT,
  Markdown, HTML) को साफ़ स्थानीय HTML में बदलता है, जिसमें बनी हुई नेविगेशन और असली बहुस्तरीय
  विषय-सूची होती है। अंतर्निहित रीडर light/sepia/dark/night थीम, पाठ का आकार और फ़ॉन्ट नियंत्रण जोड़ता
  है और पठन-स्थिति याद रखता है। यह छवियों के भीतर का पाठ पहचान सकता है (अलग से स्थापित Tesseract के ज़रिए OCR - अंग्रेज़ी भाषा का डेटा साथ में, बाकी भाषाएँ माँग पर) और चाहें तो सब कुछ Google Cloud Translation API या स्थानीय Ollama मॉडल से अनुवाद कर
  सकता है। इंटरफ़ेस 13 भाषाओं में उपलब्ध है। आप एक लंबा पृष्ठ पा सकते हैं या विषय-सूची सहित अध्याय।
  पहले से बदली गई पुस्तक दोबारा खोलना तुरंत होता है। पैकेज में CLI (doc-html-translate) और एक छोटा GUI
  (doc-html-ui), दोनों हैं। pdftotext बाइनरी के भीतर ही है; MOBI और AZW3 के लिए इसके अलावा Calibre
  स्थापित होना चाहिए (केवल DRM-रहित फ़ाइलें)।
  यह कॉमिक आर्काइव (CBZ/CBR/CB7/CBT) और अलग-अलग छवियाँ (PNG, JPG, WebP, GIF, BMP, TIFF) भी खोलता है और पहचाना गया पाठ हर पृष्ठ के ऊपर रखता है, ताकि उसी जगह अनुवाद हो सके; CBR और CB7 के लिए 7-Zip चाहिए।
