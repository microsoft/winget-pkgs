ShortDescription: 'Набір інструментів у треї для клавіатури та робочого столу: розкладка біля каретки, виправлення тексту в хибній розкладці, знімок екрана й модулі для тексту.'
Description: "CyrFlip - набір інструментів у треї для клавіатури та робочого столу Windows. Одразу після запуску він показує активну розкладку просто біля миготливої каретки, а також на текстовому курсорі миші та на значку в треї: кожна з 13 популярних мов має власний колір, а за увімкненого CapsLock з'являється рамка; гаряча клавіша виправляє виділення, набране в хибній розкладці, на місці й в обидва боки. Таблиця пар розкладок додає скільки завгодно перетворень \"з розкладки в розкладку\" з власним сполученням кожне, друга клавіша виправляє випадковий CapsLock, а вікно налаштувань замінює розділ мов Windows: встановлення, порядок і видалення розкладок, сполучення перемикання та прямі сполучення на мову, які обробляє сама Windows. Ctrl+Shift+PrintScreen кладе будь-яку область екрана в буфер обміну. Решта - необов'язкові модулі, вимкнені, доки ви їх не ввімкнете: власне меню над виділенням за Ctrl і правим кліком; перекладач, що надсилає виділення до Ollama - безкоштовної програми, яку ви окремо встановлюєте на свій комп'ютер, - і показує переклад у маленькому вікні біля курсора миші, типово звертаючись лише до localhost, тож текст не покидає вашу машину; історія буфера з пошуком і шифруванням DPAPI; локальні зашифровані швидкі нотатки, які зберігають код рівно таким, яким його набрали; відкритий текстовий файл обміну, що переносить нотатки й історію на інший комп'ютер; і \"Швидкий запуск\", який перетворює ваші програми, скрипти та завантаження yt-dlp на сценарії із запуском з трея, за власним глобальним сполученням або з Jump List панелі завдань. Додатково: два перемикачі \"не давати засинати\", світла або темна тема, інтерфейс 13 мовами та кнопка \"Надіслати логи автору..\", яка збирає логи CyrFlip в один архів для листа - надсилаєте його ви самі. Один портативний exe, без інсталятора та залежностей."
