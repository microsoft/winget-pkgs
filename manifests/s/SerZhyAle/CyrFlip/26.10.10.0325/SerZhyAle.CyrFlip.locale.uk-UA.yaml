ReleaseNotes: |-
  У цьому випуску CyrFlip представляється як трей-набір інструментів для клавіатури та робочого столу, а ще з'явилися вітальний тур, вікно символів і сторінка з усіма комбінаціями клавіш.
  - Вітальний тур: п'ять коротких сторінок під час першого запуску показують, що вміє CyrFlip, і дозволяють одразу ввімкнути чи вимкнути кожен необов'язковий модуль; повторити можна на сторінці «Про програму».
  - Вікно символів (за бажанням, типово вимкнене): Ctrl+Shift+F9 відкриває палітру приблизно з 500 знаків, яких немає в жодній встановленій розкладці, - валюти, стрілки, математика, грецькі літери, рамки. Клацання копіює знак і не забирає фокус у вашого редактора.
  - Усі комбінації: нова сторінка налаштувань перелічує кожне сполучення клавіш CyrFlip, показує, чи воно справді спрацьовує і чому ні, та дає змогу змінити, вимкнути або скинути будь-яке; якщо навести вказівник на значок у треї, показується той самий список.
  - Перенесення налаштувань: експорт у звичайний файл та імпорт на іншому комп'ютері з попереднім переглядом і трьома автоматичними локальними копіями.
  - Ctrl+Shift+Alt+PrintScreen відкриває теку, до якої зберігаються знімки екрана.
  - У вікні налаштувань стало зручніше: згортні групи, пошук, значки сторінок масштабуються разом з екраном, а вікно відкривається там, де ви його залишили.
