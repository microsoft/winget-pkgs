ReleaseNotes: |-
  В этом выпуске CyrFlip представляется как трей-набор инструментов для клавиатуры и рабочего стола, а ещё появились приветственный тур, окно символов и страница со всеми комбинациями клавиш.
  - Приветственный тур: пять коротких страниц при первом запуске показывают, что умеет CyrFlip, и позволяют тут же включить или выключить каждый необязательный модуль; повторить можно на странице «О программе».
  - Окно символов (по желанию, по умолчанию выключено): Ctrl+Shift+F9 открывает палитру примерно из 500 знаков, которых нет ни в одной установленной раскладке, - валюты, стрелки, математика, греческие буквы, рамки. Щелчок копирует знак и не забирает фокус у вашего редактора.
  - Все комбинации: новая страница настроек перечисляет каждое сочетание клавиш CyrFlip, показывает, действительно ли оно срабатывает и почему нет, и позволяет изменить, отключить или сбросить любое; при наведении на значок в трее показывается тот же список.
  - Перенос настроек: экспорт в обычный файл и импорт на другом компьютере с предпросмотром и тремя автоматическими локальными копиями.
  - Ctrl+Shift+Alt+PrintScreen открывает папку, в которую сохраняются снимки экрана.
  - Окно настроек стало удобнее: сворачиваемые группы, поиск, значки страниц масштабируются вместе с экраном, а окно открывается там, где вы его оставили.
