ReleaseNotes: |-
  This release introduces CyrFlip as a tray toolkit for your keyboard and desktop and adds a first-run tour, a symbols palette and one page with every shortcut.
  - Welcome tour: five short pages on the first run show what CyrFlip does and let you switch each optional module on or off on the spot; About replays it.
  - Symbols window (opt-in, off by default): Ctrl+Shift+F9 opens a palette of about 500 characters that sit on no installed layout - currency, arrows, math, Greek, box drawing. A click copies one and never takes the focus from your editor.
  - All shortcuts: a new settings page lists every chord CyrFlip binds, says whether it really fires and why not, and lets you change, switch off or reset each one; hovering the tray icon shows the same list.
  - Settings transfer: export your settings to a plain file and import them on another PC, with a preview and three automatic local backups.
  - Ctrl+Shift+Alt+PrintScreen opens the folder your screen captures are saved in.
  - A friendlier settings window: collapsible groups, a search box, page icons that scale with the display, and it reopens where you left it.
