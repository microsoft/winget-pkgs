ReleaseNotes: |-
  This release brings a dark theme, a screen-region capture, local quick notes and a much sturdier clipboard flip.
  - Theme: choose "Like Windows", Light or Dark on the General tab; every window, dialog and menu follows at once, with no restart.
  - Screen capture: Ctrl+Shift+PrintScreen (or the tray item), drag a region - the picture lands on the clipboard as PNG and can also be saved to a folder.
  - Quick notes (opt-in, off by default): Ctrl+Shift+Alt+N opens a local notepad, encrypted on disk; the text menu can save a selection into it. Notes and clipboard history move to another PC or phone as one plain-text exchange file.
  - The flip hands your clipboard back exactly: images, copied files, a Cut and password-manager markers survive, and a slow target (RDP, a VM, a busy Word) no longer pastes your old clipboard over the fix. Clipboard history is encrypted whole on disk, and "×" really erases an entry.
  - More works from the keyboard: Ctrl+Shift+Alt+M opens CyrFlip's menu at the caret, and the history strip, the capture and the settings lists take the arrow keys.
  - Steadier: hotkeys never wait on a disk or a network share, CyrFlip closes cleanly at sign-out, the Store build keeps each Windows user's files apart, and the portable build adds Start menu and desktop shortcuts. "Send logs to the author" masks account names and never includes the clipboard history.
