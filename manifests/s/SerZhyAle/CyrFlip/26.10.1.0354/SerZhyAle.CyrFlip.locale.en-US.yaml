ShortDescription: Live keyboard-layout indicator at the caret, plus one-key conversion between any two installed layouts.
Description: "CyrFlip is a tiny Windows tray utility. It shows the active keyboard layout right next to the blinking text caret - on the mouse I-beam and the tray icon too - so you always know which layout you are typing in, with its own colour for each of the 13 curated languages and a frame when CapsLock is on. A global hotkey transliterates a selection between QWERTY and JCUKEN in place, a second one fixes an accidental CapsLock, and a table of layout pairs adds as many \"from layout to layout\" conversions as you need, each with its own chord and each working in both directions. A settings window replaces the Windows language pane: install, reorder and remove keyboard layouts, choose the switch chord, and assign per-language shortcuts that Windows itself handles. An optional Quick launch module turns your programs, scripts and yt-dlp downloads into scenarios started from the tray, from a global hotkey of their own, or from the taskbar Jump List. A built-in translator, optional as well, sends a selection to Ollama - a free program you install separately on your own computer - and shows the translation in a small window at the mouse pointer; it stays off until you enable it and by default talks only to localhost, so no text leaves your machine. Extras: an optional context menu of CyrFlip's own, opened over a selection by Ctrl and a right click; an optional DPAPI-encrypted clipboard history with search; two keep-awake switches; an interface available in 13 languages; and a Send logs to the author button that packs CyrFlip's own logs into one archive for a report you send yourself. Ships as a single portable exe with no installer and no runtime dependencies."
