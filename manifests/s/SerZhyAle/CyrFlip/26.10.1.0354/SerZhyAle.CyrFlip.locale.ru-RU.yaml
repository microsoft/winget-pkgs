ShortDescription: Живой индикатор раскладки у каретки и конвертация текста между любыми двумя установленными раскладками.
Description: 'CyrFlip - крошечная утилита в трее для Windows. Она показывает активную раскладку прямо рядом с мигающей кареткой, а также на текстовом курсоре мыши и на значке в трее, поэтому вы всегда знаете, в какой раскладке печатаете: у каждого из 13 популярных языков свой цвет, а при включённом CapsLock появляется рамка. Горячая клавиша транслитерирует выделение между QWERTY и ЙЦУКЕН на месте, вторая исправляет случайный CapsLock, а таблица пар раскладок добавляет сколько угодно конвертаций "из раскладки в раскладку" - у каждой своя комбинация, и каждая работает в обе стороны. Окно настроек заменяет раздел языков Windows: установка, порядок и удаление раскладок, сочетание переключения и прямые сочетания на язык, которые обрабатывает сама Windows. Необязательный модуль "Быстрый запуск" превращает ваши программы, скрипты и загрузки yt-dlp в сценарии, которые запускаются из трея, по собственной глобальной комбинации или из Jump List панели задач. Встроенный переводчик, тоже необязательный, отправляет выделение в Ollama - бесплатную программу, которую вы отдельно ставите на свой компьютер, - и показывает перевод в маленьком окне у курсора мыши; по умолчанию он выключен и обращается только к localhost, поэтому текст не покидает вашу машину. Дополнительно: необязательное собственное меню, которое открывается над выделением по Ctrl и правому клику; необязательная история буфера с поиском и шифрованием DPAPI; два переключателя "не давать засыпать"; интерфейс на 13 языках; кнопка "Отправить логи автору..", которая собирает логи CyrFlip в один архив для письма - отправляете его вы сами. Один портативный exe, без установщика и без зависимостей.'
Tags:
