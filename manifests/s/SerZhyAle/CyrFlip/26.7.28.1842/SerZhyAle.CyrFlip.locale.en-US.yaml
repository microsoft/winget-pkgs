ReleaseNotes: |-
  This release is about the translator, and about the places where the text had fallen behind the app.
  - Translation is no longer limited to the thirteen interface languages: the picker now offers every language Windows knows. CyrFlip promises nothing about which of them your model can handle - it says so plainly and links to the model's own description, because coverage belongs to the model, not to us. We dispatch the text; the model translates it.
  - The default model changed to aya-expanse:8b. That was decided by measurement, not by size: the previous default put Chinese characters into a Russian translation and answered Ukrainian with nonsense, and every model under 4 GB failed the same way. It is a larger one-time download, and English, Russian and Ukrainian are now genuinely correct.
  - The two keep-awake switches are remembered between launches. Leave one on and it keeps the machine awake after a restart too - CyrFlip will not watch your battery for you, and the setting says so.
  - The VS Code companion extension draws the layout marker in the app's own colours for every language, instead of colouring three and leaving the rest grey.
  - The privacy policy is now published in all 13 interface languages, not only English.
  - Several settings still described the marker as EN/RU/UK. It has shown the code of any installed layout for a long time; the text now matches what the app does.
