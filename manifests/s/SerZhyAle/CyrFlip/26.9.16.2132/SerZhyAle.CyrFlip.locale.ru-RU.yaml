ShortDescription: Живой индикатор раскладки у каретки и конвертация текста между любыми двумя установленными раскладками.
Description: >-
  CyrFlip - крошечная утилита в трее для Windows. Она показывает активную раскладку прямо рядом
  с мигающей кареткой, а также на текстовом курсоре мыши и на значке в трее, поэтому вы всегда
  знаете, в какой раскладке печатаете: у каждого из 13 популярных языков свой цвет, а при
  включённом CapsLock появляется рамка. Горячая клавиша транслитерирует выделение между QWERTY
  и ЙЦУКЕН на месте, вторая исправляет случайный CapsLock, а таблица пар раскладок добавляет
  сколько угодно конвертаций "из раскладки в раскладку" - у каждой своя комбинация, и каждая
  работает в обе стороны. Окно настроек заменяет раздел языков Windows: установка, порядок и
  удаление раскладок, сочетание переключения и прямые сочетания на язык, которые обрабатывает
  сама Windows. Необязательный модуль "Быстрый запуск" превращает ваши программы, скрипты и
  загрузки yt-dlp в сценарии, которые запускаются из трея, по собственной глобальной комбинации
  или из Jump List панели задач. Встроенный переводчик, тоже необязательный, отправляет выделение
  в Ollama - бесплатную программу, которую вы отдельно ставите на свой компьютер, - и показывает
  перевод в маленьком окне у курсора мыши; по умолчанию он выключен и обращается только к
  localhost, поэтому текст не покидает вашу машину. Дополнительно: необязательное собственное меню,
  которое открывается над выделением по Ctrl и правому клику; необязательная история буфера
  с поиском и шифрованием DPAPI; два переключателя "не давать засыпать"; интерфейс на 13 языках;
  кнопка "Отправить логи автору..", которая собирает логи CyrFlip в один архив для письма -
  отправляете его вы сами. Один портативный exe, без установщика и без зависимостей.
ReleaseNotes: |-
  Этот выпуск - о маркере: что означает его цвет, как он выглядит и где появляется, - плюс два переключателя для конвертации.
  - Цвет маркера теперь называет раскладку, а не только язык: у каждой из 25 раскладок 13 отобранных языков свой оттенок цвета её языка - русский всегда красный, но «Русская (машинопись)» уже другой красный, - а все остальные раскладки Windows получили один нейтральный цвет вместо случайного оттенка. В компактном стиле «точка» этот цвет и есть весь маркер.
  - Рядом с кареткой и на указателе мыши маркер стал полупрозрачным, так что текст под ним остаётся читаемым, а его буквы вписаны в значок с одним пикселем поля. Сам текстовый курсор и значок в трее остаются непрозрачными.
  - Двойного маркера в VS Code больше нет: пока рисует расширение, CyrFlip прячет свой. В панели чата, в терминале и в полях поиска, где расширение рисовать не может, маркер возвращается.
  - Смешанный текст исправляется одним нажатием: направление выбирается теперь для каждого символа, поэтому «ghbdtnпривет» превращается в «приветghbdtn», а не удваивает первую половину.
  - Знаки препинания теперь ваш выбор: клавиша, дающая знак в обеих раскладках, не говорит о том, в какой из них её нажали, поэтому «Конвертировать знаки препинания вместе с текстом» можно выключить - тогда «/ghbdtn» сохранит свой слеш вместо того, чтобы начаться с точки. По умолчанию флажок стоит, как CyrFlip вёл себя всегда.
  - Синхронизация CapsLock после исправления регистра задаёт состояние клавиши, а не переключает его: включает, если исправленный текст заканчивается заглавной, выключает, если строчной, и не трогает, если букв с регистром в тексте нет. Повторное исправление того же текста больше не оставляет клавишу в обратном положении.
  - На вкладке «О программе» показана версия сборки - тот же штамп YY.M.D.HHmm, который несёт архив релиза.
