ShortDescription: Живий індикатор розкладки біля каретки та перетворення тексту між будь-якими двома встановленими розкладками.
Description: >-
  CyrFlip - крихітна утиліта в треї для Windows. Вона показує активну розкладку просто біля
  миготливої каретки, а також на текстовому курсорі миші та на значку в треї, тож ви завжди
  знаєте, якою розкладкою друкуєте: кожна з 13 популярних мов має власний колір, а за
  увімкненого CapsLock з'являється рамка. Гаряча клавіша транслітерує виділення між QWERTY та
  ЙЦУКЕН на місці, друга виправляє випадковий CapsLock, а таблиця пар розкладок додає скільки
  завгодно перетворень "з розкладки в розкладку" - кожне з власним сполученням і в обидва боки.
  Вікно налаштувань замінює розділ мов Windows: встановлення, порядок і видалення розкладок,
  сполучення перемикання та прямі сполучення на мову, які обробляє сама Windows. Необов'язковий
  модуль "Швидкий запуск" перетворює ваші програми, скрипти та завантаження yt-dlp на сценарії,
  які запускаються з трея, за власним глобальним сполученням або з Jump List панелі завдань.
  Вбудований перекладач, теж необов'язковий, надсилає виділення до Ollama - безкоштовної програми,
  яку ви окремо встановлюєте на свій комп'ютер, - і показує переклад у маленькому вікні біля
  курсора миші; типово він вимкнений і звертається лише до localhost, тож текст не покидає вашу
  машину. Додатково: необов'язкове власне меню, яке відкривається над виділенням за Ctrl і правим
  кліком; необов'язкова історія буфера з пошуком і шифруванням DPAPI; два перемикачі
  "не давати засинати"; інтерфейс 13 мовами; кнопка "Надіслати логи автору..", яка збирає логи
  CyrFlip в один архів для листа - надсилаєте його ви самі. Один портативний exe, без інсталятора
  та залежностей.
ReleaseNotes: |-
  Цей випуск - про маркер: що означає його колір, який він на вигляд і де з'являється, - плюс два перемикачі для перетворення.
  - Колір маркера тепер називає розкладку, а не лише мову: кожна з 25 розкладок 13 відібраних мов має власний відтінок кольору своєї мови - російська завжди червона, але «Російська (друкарська машинка)» вже інший червоний, - а всі інші розкладки Windows дістали один нейтральний колір замість випадкового відтінку. У компактному стилі «крапка» цей колір і є весь маркер.
  - Поруч із кареткою та на вказівнику миші маркер став напівпрозорим, тож текст під ним лишається читабельним, а його літери вписані у значок з одним пікселем поля. Сам текстовий курсор і піктограма в треї лишаються непрозорими.
  - Подвійного маркера у VS Code більше немає: поки малює розширення, CyrFlip ховає свій. У панелі чату, в терміналі та в полях пошуку, де розширення малювати не може, маркер повертається.
  - Змішаний текст виправляється одним натисканням: напрям обирається тепер для кожного символу, тому «ghbdtnпривет» перетворюється на «приветghbdtn», а не подвоює першу половину.
  - Розділові знаки тепер ваш вибір: клавіша, що дає знак в обох розкладках, не каже, в якій із них її натиснули, тому «Перетворювати розділові знаки разом із текстом» можна вимкнути - тоді «/ghbdtn» збереже свій слеш замість того, щоб початися з крапки. Типово прапорець стоїть, як CyrFlip поводився завжди.
  - Синхронізація CapsLock після виправлення регістру задає стан клавіші, а не перемикає його: вмикає, якщо виправлений текст закінчується великою літерою, вимикає, якщо малою, і не чіпає, якщо літер із регістром у тексті немає. Повторне виправлення того самого тексту більше не лишає клавішу у зворотному положенні.
  - На вкладці «Про програму» показано версію збірки - той самий штамп YY.M.D.HHmm, який несе архів релізу.
