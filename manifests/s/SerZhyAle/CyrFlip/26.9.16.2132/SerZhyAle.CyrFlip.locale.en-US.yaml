ShortDescription: Live keyboard-layout indicator at the caret, plus one-key conversion between any two installed layouts.
Description: >-
  CyrFlip is a tiny Windows tray utility. It shows the active keyboard layout right next to the
  blinking text caret - on the mouse I-beam and the tray icon too - so you always know which
  layout you are typing in, with its own colour for each of the 13 curated languages and a frame
  when CapsLock is on. A global hotkey transliterates a selection between QWERTY and JCUKEN in
  place, a second one fixes an accidental CapsLock, and a table of layout pairs adds as many
  "from layout to layout" conversions as you need, each with its own chord and each working in
  both directions. A settings window replaces the Windows language pane: install, reorder and
  remove keyboard layouts, choose the switch chord, and assign per-language shortcuts that
  Windows itself handles. An optional Quick launch module turns your programs, scripts and yt-dlp
  downloads into scenarios started from the tray, from a global hotkey of their own, or from the
  taskbar Jump List. A built-in translator, optional as well, sends a selection to Ollama - a free
  program you install separately on your own computer - and shows the translation in a small
  window at the mouse pointer; it stays off until you enable it and by default talks only to
  localhost, so no text leaves your machine. Extras: an optional context menu of CyrFlip's own,
  opened over a selection by Ctrl and a right click; an optional DPAPI-encrypted clipboard history
  with search; two keep-awake switches; an interface available in 13 languages; and a Send logs to
  the author button that packs CyrFlip's own logs into one archive for a report you send yourself.
  Ships as a single portable exe with no installer and no runtime dependencies.
ReleaseNotes: |-
  This release is about the marker - what its colour means, how it looks, and where it appears - plus two switches for the conversion.
  - The marker's colour now names the keyboard layout, not only the language: each of the 25 layouts of the 13 curated languages has its own shade of its language's colour - Russian is always red, but Russian Typewriter is a different red - and every other Windows layout shares one neutral colour instead of a hue picked at random. In the compact dot style that colour is the whole marker.
  - Beside the caret and on the mouse pointer the marker is translucent, so the text under it stays readable, and its letters are fitted to the badge with one pixel of border. The I-beam itself and the tray icon stay solid.
  - No more double marker in VS Code: while the companion extension is drawing, CyrFlip hides its own. It returns in the chat panel, the terminal and the search boxes, where the extension cannot draw at all.
  - Mixed text is fixed in one press - the direction is now decided for each character, so "ghbdtnпривет" comes back as "приветghbdtn" instead of doubling the first half.
  - Punctuation is now your choice: a key that gives a symbol in both layouts says nothing about which layout you meant, so "Convert punctuation along with the text" can be switched off, and "/ghbdtn" then keeps its slash instead of starting with a full stop. It stays on by default, the way CyrFlip has always behaved.
  - Synchronizing CapsLock after the case fix sets the key instead of toggling it - on when the corrected text ends in a capital, off when it ends in a small letter, untouched when nothing in it has case - so correcting the same text twice no longer leaves the key backwards.
  - The About tab shows the build version, the same YY.M.D.HHmm stamp the release ZIP carries.
