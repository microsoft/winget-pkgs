ShortDescription: Живой индикатор раскладки у каретки и конвертация текста между любыми двумя установленными раскладками.
Description: 'CyrFlip - крошечная утилита в трее для Windows. Она показывает активную раскладку прямо рядом с мигающей кареткой, а также на текстовом курсоре мыши и на значке в трее, поэтому вы всегда знаете, в какой раскладке печатаете: у каждого из 13 популярных языков свой цвет, а при включённом CapsLock появляется рамка. Горячая клавиша транслитерирует выделение между QWERTY и ЙЦУКЕН на месте, вторая исправляет случайный CapsLock, а таблица пар раскладок добавляет сколько угодно конвертаций "из раскладки в раскладку" - у каждой своя комбинация, и каждая работает в обе стороны. Окно настроек заменяет раздел языков Windows: установка, порядок и удаление раскладок, сочетание переключения и прямые сочетания на язык, которые обрабатывает сама Windows. Необязательный модуль "Быстрый запуск" превращает ваши программы, скрипты и загрузки yt-dlp в сценарии, которые запускаются из трея, по собственной глобальной комбинации или из Jump List панели задач. Встроенный переводчик, тоже необязательный, отправляет выделение в Ollama - бесплатную программу, которую вы отдельно ставите на свой компьютер, - и показывает перевод в маленьком окне у курсора мыши; по умолчанию он выключен и обращается только к localhost, поэтому текст не покидает вашу машину. Дополнительно: необязательная история буфера с поиском и шифрованием DPAPI, два переключателя "не давать засыпать" и интерфейс на 13 языках. Один портативный exe, без установщика и без зависимостей.'
Tags:
- клавиатура
- раскладка
- транслитерация
- кириллица
ReleaseNotes: |-
  Самый большой выпуск за всё время: пять новых модулей, каждый необязательный и выключенный, пока вы его не включите.
  - Конвертация раскладок теперь открытая таблица: сколько угодно пар "из раскладки в раскладку", у каждой своя комбинация. Текст переводится по физическому положению клавиш, поэтому AZERTY и QWERTZ обрабатываются правильно, и каждая пара работает в обе стороны. Прежний переворот EN/RU - просто её первая строка.
  - Отдельная страница настроек заменяет языковую панель Windows: устанавливайте, переставляйте и удаляйте раскладки, выбирайте комбинацию для перебора языков и назначайте прямые сочетания на конкретный язык, которые обрабатывает сама Windows - они работают, даже когда CyrFlip закрыт.
  - Встроенный переводчик: выделите текст, нажмите свою комбинацию - и перевод появится в небольшом окне рядом с указателем мыши. Работает на Ollama, бесплатной программе, которую вы один раз ставите себе сами, поэтому текст уходит на вашу же машину, а не в облако и не разработчику.
  - "Быстрый запуск" превращает ваши программы, скрипты и загрузки yt-dlp в сценарии, которые запускаются из трея, по собственной горячей клавише или из списка переходов на панели задач.
  - Два переключателя не дают Windows уснуть и погасить экран, пока вы работаете.
  - Интерфейс теперь говорит на 13 языках, включая языки справа налево, и по умолчанию следует за языком Windows.
