ReleaseNotes: |-
  В этом выпуске настройки идут за функциями, а CyrFlip стало труднее уронить.
  - Страницы настроек идут за функциями: «Исправление текста» объединяет таблицу раскладок и исправление регистра, у меню над выделенным текстом своя страница, «Графика» стала «Снимками экрана», в «Общих» четыре группы, а «Горячие клавиши» содержат общий выключатель и список всех комбинаций.
  - Сбой в одном действии больше не роняет CyrFlip: появляется уведомление, а значок в трее, индикатор и горячие клавиши продолжают работать; сам CyrFlip закрывается только после пяти сбоев за пять минут.
  - Данные надёжнее при сбоях: нечитаемые настройки больше не стирают таблицу раскладок и снимки состояния Windows, неудачная смена раскладок клавиатуры откатывается, журнал заметок переживает двойной сбой, а неудавшиеся импорт, копирование или удаление сообщают об этом.
  - Окно настроек создаётся при первом открытии, а при выключенной истории буфера CyrFlip не обращается к её файлу при запуске.
  - Приветственный тур начинается с одной страницы-оглавления обо всём, что умеет CyrFlip, а кнопки диалогов получили значки.
  - На новых установках снимок области - Ctrl+PrintScreen, открытие папки со снимками - Ctrl+Shift+PrintScreen; на установках, где комбинации уже заданы, они сохраняются.
