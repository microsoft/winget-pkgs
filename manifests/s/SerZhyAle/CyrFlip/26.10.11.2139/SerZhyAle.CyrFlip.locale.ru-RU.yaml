ShortDescription: 'Набор инструментов в трее для клавиатуры и рабочего стола: раскладка у каретки, исправление текста в неверной раскладке, снимок экрана и модули для текста.'
Description: 'CyrFlip - набор инструментов в трее для клавиатуры и рабочего стола Windows. Сразу после запуска он показывает активную раскладку прямо рядом с мигающей кареткой, а также на текстовом курсоре мыши и на значке в трее: у каждого из 13 популярных языков свой цвет, а при включённом CapsLock появляется рамка; горячая клавиша исправляет выделение, набранное в неверной раскладке, на месте и в обе стороны. Таблица пар раскладок добавляет сколько угодно конвертаций "из раскладки в раскладку" со своей комбинацией каждая, вторая клавиша исправляет случайный CapsLock, а окно настроек заменяет раздел языков Windows: установка, порядок и удаление раскладок, сочетание переключения и прямые сочетания на язык, которые обрабатывает сама Windows. Ctrl+PrintScreen кладёт любую область экрана в буфер обмена. Остальное - необязательные модули, выключенные, пока вы их не включите: собственное меню над выделением по Ctrl и правому клику; переводчик, который отправляет выделение в Ollama - бесплатную программу, которую вы отдельно ставите на свой компьютер, - и показывает перевод в маленьком окне у курсора мыши, по умолчанию обращаясь только к localhost, поэтому текст не покидает вашу машину; история буфера с поиском и шифрованием DPAPI; локальные зашифрованные быстрые заметки, которые хранят код ровно таким, каким его набрали; открытый текстовый файл обмена, переносящий заметки и историю на другой компьютер; и "Быстрый запуск", который превращает ваши программы, скрипты и загрузки yt-dlp в сценарии с запуском из трея, по собственной глобальной комбинации или из Jump List панели задач. Дополнительно: два переключателя "не давать засыпать", светлая или тёмная тема, интерфейс на 13 языках и кнопка "Отправить логи автору..", которая собирает логи CyrFlip в один архив для письма - отправляете его вы сами. Один портативный exe, без установщика и без зависимостей.'
