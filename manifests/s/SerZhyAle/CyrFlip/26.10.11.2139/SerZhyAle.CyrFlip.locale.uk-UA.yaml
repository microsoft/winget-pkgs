ReleaseNotes: |-
  У цьому випуску налаштування ідуть за функціями, а CyrFlip стало важче повалити.
  - Сторінки налаштувань ідуть за функціями: «Виправлення тексту» поєднує таблицю розкладок і виправлення регістру, у меню над виділеним текстом своя сторінка, «Графіка» стала «Знімками екрана», у «Загальних» чотири групи, а «Гарячі клавіші» містять загальний вимикач і список усіх сполучень.
  - Збій в одній дії більше не валить CyrFlip: з'являється сповіщення, а значок у треї, індикатор і гарячі клавіші далі працюють; сам CyrFlip закривається лише після п'яти збоїв за п'ять хвилин.
  - Дані надійніші при збоях: нечитабельні налаштування більше не стирають таблицю розкладок і знімки стану Windows, невдала зміна розкладок клавіатури відкочується, журнал нотаток переживає подвійний збій, а невдалі імпорт, копіювання чи видалення повідомляють про це.
  - Вікно налаштувань створюється під час першого відкриття, а коли історію буфера вимкнено, CyrFlip не звертається до її файлу під час запуску.
  - Вітальний тур починається з однієї сторінки-змісту про все, що вміє CyrFlip, а кнопки діалогів отримали значки.
  - На нових установках знімок області - Ctrl+PrintScreen, відкриття теки зі знімками - Ctrl+Shift+PrintScreen; на установках, де сполучення вже задані, вони зберігаються.
