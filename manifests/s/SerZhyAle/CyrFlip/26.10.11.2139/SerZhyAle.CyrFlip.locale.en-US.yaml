ReleaseNotes: |-
  This release makes Settings follow the features and makes CyrFlip harder to knock over.
  - Settings pages follow the features: Text correction holds the layout table and the case fix, the selection menu has a page of its own, Graphics is now Screenshots, General has four groups, and Hotkeys holds the master switch and the list of every chord.
  - One failing action no longer takes CyrFlip down: a notice appears and the tray icon, the indicator and the hotkeys keep working; it closes itself only after five faults within five minutes.
  - Safer data on failures: unreadable settings no longer wipe the layout table or the Windows snapshots, a failed keyboard-layout change is rolled back, the notes journal survives a double failure, and a failed import, copy or erase says so.
  - Settings is built on first open, and with the clipboard history off CyrFlip does not touch its file at startup.
  - The welcome tour opens on a one-page index of everything CyrFlip does, and dialog buttons carry icons.
  - New installs: Ctrl+PrintScreen for the region capture and Ctrl+Shift+PrintScreen for opening the capture folder; existing installs keep their chords.
