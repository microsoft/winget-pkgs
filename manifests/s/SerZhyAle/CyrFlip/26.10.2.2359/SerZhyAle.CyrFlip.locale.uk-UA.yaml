ShortDescription: Живий індикатор розкладки біля каретки та перетворення тексту між будь-якими двома встановленими розкладками.
Description: "CyrFlip - крихітна утиліта в треї для Windows. Вона показує активну розкладку просто біля миготливої каретки, а також на текстовому курсорі миші та на значку в треї, тож ви завжди знаєте, якою розкладкою друкуєте: кожна з 13 популярних мов має власний колір, а за увімкненого CapsLock з'являється рамка. Гаряча клавіша транслітерує виділення між QWERTY та ЙЦУКЕН на місці, друга виправляє випадковий CapsLock, а таблиця пар розкладок додає скільки завгодно перетворень \"з розкладки в розкладку\" - кожне з власним сполученням і в обидва боки. Вікно налаштувань замінює розділ мов Windows: встановлення, порядок і видалення розкладок, сполучення перемикання та прямі сполучення на мову, які обробляє сама Windows. Необов'язковий модуль \"Швидкий запуск\" перетворює ваші програми, скрипти та завантаження yt-dlp на сценарії, які запускаються з трея, за власним глобальним сполученням або з Jump List панелі завдань. Вбудований перекладач, теж необов'язковий, надсилає виділення до Ollama - безкоштовної програми, яку ви окремо встановлюєте на свій комп'ютер, - і показує переклад у маленькому вікні біля курсора миші; типово він вимкнений і звертається лише до localhost, тож текст не покидає вашу машину. Додатково: необов'язкове власне меню, яке відкривається над виділенням за Ctrl і правим кліком; необов'язкова історія буфера з пошуком і шифруванням DPAPI; два перемикачі \"не давати засинати\"; інтерфейс 13 мовами; кнопка \"Надіслати логи автору..\", яка збирає логи CyrFlip в один архів для листа - надсилаєте його ви самі. Один портативний exe, без інсталятора та залежностей."
