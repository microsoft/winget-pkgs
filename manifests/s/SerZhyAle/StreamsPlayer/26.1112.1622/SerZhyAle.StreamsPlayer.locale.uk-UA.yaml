ReleaseNotes: Кнопка «Трансляція» в шапці відкриває вікно трансляції з картками екрана, камери, мікрофона й системного звуку. Кожна запускається і зупиняється сама, тож в ефірі може бути кілька джерел одночасно, а ділитися можна посиланням, QR-кодом або файлом. Трансляція, яка не запустилася, називає причину на своїй картці, а запуск, що ще чекає, можна скасувати. Передача на свій пристрій повідомляє, чи її прийнято. Трансляція екрана тримає 30 кадрів на секунду на моніторі 4K, а монітори називаються з реальним розміром у пікселях. Через кілька секунд після зупинки передавача плеєр пише «Трансляція закінчилася» і пропонує «Перепідключитися». Справжня втрата мережі, як і раніше, перепідключає сама. Трансляція з паролем грає на цьому ПК локальною мережею або через ваш сервер обміну, коли пароль уведено один раз. Стандартні налаштування можна зберегти на вашому сервері обміну й прочитати на іншому ПК. Ключі пристроїв, шляхи до обладнання, звукові пристрої, порти й положення вікон лишаються на кожному ПК. У шапці значки «Список», «Сітка», «Сервер обміну» і «Свої трансляції», а «Сервер обміну» і «Трансляція» - окремі сторінки «Налаштувань». Радіо більше не мовчить після того, як відеоплеєр або попередній перегляд каналу заглушив звук застосунку. Вбудований список каналів актуальний (18 824 активні потоки від 11.11.2026). Вікно трансляції має власну сторінку у вбудованій довідці (F1).
