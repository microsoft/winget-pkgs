ReleaseNotes: Кнопка «Трансляция» в шапке открывает окно трансляции с карточками экрана, камеры, микрофона и системного звука. Каждая запускается и останавливается сама, поэтому в эфире может быть несколько источников сразу, а делиться можно ссылкой, QR-кодом или файлом. Трансляция, которая не запустилась, называет причину на своей карточке, а запуск, который ещё ждёт, можно отменить. Передача на своё устройство сообщает, принята ли она. Трансляция экрана держит 30 кадров в секунду на мониторе 4K, а мониторы называются с реальным размером в пикселях. Через несколько секунд после остановки передающего плеер пишет «Трансляция закончилась» и предлагает «Переподключиться». Настоящая потеря сети по-прежнему переподключает сама. Трансляция с паролем играет на этом ПК по локальной сети или через ваш сервер обмена, когда пароль введён один раз. Стандартные настройки можно сохранить на вашем сервере обмена и прочитать на другом ПК. Ключи устройств, пути к оборудованию, звуковые устройства, порты и положение окон остаются на каждом ПК. В шапке значки «Список», «Сетка», «Сервер обмена» и «Свои трансляции», а «Сервер обмена» и «Трансляция» - отдельные страницы «Настроек». Радио больше не молчит после того, как видеоплеер или предпросмотр канала заглушил звук приложения. Встроенный список каналов актуален (18 824 активных потока от 11.11.2026). У окна трансляции есть своя страница во встроенной справке (F1).
