InstallationNotes: Трансляции не подписаны сертификатом разработчика, поэтому при первом запуске Windows SmartScreen может показать предупреждение - что оно значит и как проверить загрузку - https://serzhyale.github.io/StreamsPlayer/ru/trust.html
