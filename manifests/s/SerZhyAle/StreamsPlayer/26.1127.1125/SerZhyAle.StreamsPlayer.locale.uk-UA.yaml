ReleaseNotes: "Керуйте StreamsPlayer з інших своїх пристроїв через власний сервер обміну: показати вікно, відтворити, поставити на паузу, продовжити й зупинити потік, задати гучність і закрити програму. Вимкнено, доки ви не ввімкнете. Нове вікно «Зовнішнє керування»: які пристрої можуть надсилати команди, які виконуються одразу, а які спершу питають вас, і перелік останніх запитів. Скрипти можуть запускати й зупиняти трансляцію мікрофона, звуку системи, екрана або камери. У StreamsPlayerCli.exe, який встановлюють zip, інсталятор і winget, з’явилися команди broadcast start і broadcast stop. Якщо комп’ютер не довіряє сертифікату безпеки потоку, програма одразу про це каже й не повторює спроби. Налаштування: недоступна опція пояснює причину, у вузькому вікні сторінки переходять до меню, а в «Про програму» є посилання на підтримку й завантаження. Виправлено: команди під час завантаження програми відповідають «зайнято», невдала команда більше не повідомляє про успіх, а налаштування, яке не вдалося зберегти, повертається назад. У журналах приховано ключі доступу локальних посилань трансляцій. У вбудованій довідці (F1) є сторінка про зовнішнє керування."
