ReleaseNotes: "Управляйте StreamsPlayer с других своих устройств через собственный сервер обмена: показать окно, воспроизвести, поставить на паузу, продолжить и остановить трансляцию, задать громкость и закрыть программу. Выключено, пока вы не включите. Новое окно «Внешнее управление»: какие устройства могут присылать команды, какие выполняются сразу, а какие сначала спрашивают вас, и список последних запросов. Скрипты могут запускать и останавливать трансляцию микрофона, звука системы, экрана или камеры. В StreamsPlayerCli.exe, который ставят zip, установщик и winget, появились команды broadcast start и broadcast stop. Если компьютер не доверяет сертификату безопасности трансляции, программа сразу говорит об этом и не повторяет попытки. Настройки: недоступная опция объясняет причину, в узком окне страницы уходят в меню, а в «О программе» есть ссылки на поддержку и загрузки. Исправлено: команды во время загрузки программы отвечают «занято», неудачная команда больше не сообщает об успехе, а настройка, которую не удалось сохранить, возвращается назад. В журналах скрыты ключи доступа локальных ссылок трансляций. Во встроенной справке (F1) есть страница о внешнем управлении."
