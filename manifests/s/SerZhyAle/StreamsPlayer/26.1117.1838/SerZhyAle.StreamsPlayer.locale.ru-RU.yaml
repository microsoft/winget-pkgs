ReleaseNotes: Скрипты, ярлыки и другие программы могут давать StreamsPlayer команды - показать и закрыть его, воспроизвести, поставить на паузу, продолжить и остановить трансляцию, задать громкость, добавить трансляцию в ваш список и узнать состояние. Команда идёт в уже запущенную копию и никогда не открывает диалог. Консольный помощник StreamsPlayerCli.exe устанавливается рядом с приложением, пишет в канал и возвращает код выхода. «StreamsPlayerCli.exe commands» перечисляет все команды. В «Настройках» появилась группа «Команды от других программ». Команды, которые читают или пишут ваши данные, например список того, что играет сейчас, или запись в папку, отклоняются, пока вы не включите её переключатель. По умолчанию он выключен, и менять его можете только вы. В заголовке раздела закреплённых каналов стоит треугольник - он смотрит вниз, пока раздел открыт, и вправо, когда раздел свёрнут. Если устройство, у которого есть содержимое, ещё не может отправить его защищённым, страница сервера обмена объясняет, почему от него ничего не приходит. Остановленная вами трансляция больше не может снова стать «играет». Встроенная справка (F1) описывает новую группу настроек.
