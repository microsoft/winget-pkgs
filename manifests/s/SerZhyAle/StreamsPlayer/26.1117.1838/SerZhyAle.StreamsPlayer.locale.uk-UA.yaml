ReleaseNotes: Скрипти, ярлики та інші програми можуть давати StreamsPlayer команди - показати й закрити його, відтворити, поставити на паузу, продовжити й зупинити потік, задати гучність, додати потік до вашого списку й дізнатися стан. Команда йде до вже запущеної копії й ніколи не відкриває діалог. Консольний помічник StreamsPlayerCli.exe встановлюється поруч із застосунком, пише в канал і повертає код виходу. «StreamsPlayerCli.exe commands» перелічує всі команди. У «Налаштуваннях» з’явилася група «Команди від інших програм». Команди, що читають або пишуть ваші дані, наприклад перелік того, що грає зараз, чи запис до теки, відхиляються, доки ви не ввімкнете її перемикач. За замовчуванням він вимкнений, і змінити його можете лише ви. У заголовку розділу закріплених каналів стоїть трикутник - він дивиться вниз, поки розділ відкритий, і праворуч, коли розділ згорнутий. Якщо пристрій, що має вміст, ще не може надіслати його захищеним, сторінка сервера обміну пояснює, чому від нього нічого не надходить. Зупинена вами трансляція більше не може знову стати «грає». Вбудована довідка (F1) описує нову групу налаштувань.
