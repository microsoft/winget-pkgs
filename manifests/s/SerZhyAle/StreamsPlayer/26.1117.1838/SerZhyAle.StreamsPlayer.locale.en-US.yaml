ReleaseNotes: Scripts, shortcuts and other programs can give StreamsPlayer commands - show and close it, play, pause, resume and stop streams, set the volume, add a stream to your list and ask about its state. A command goes to the running copy and never opens a dialog. StreamsPlayerCli.exe, a console companion installed beside the app, prints to a pipe and returns an exit code. StreamsPlayerCli.exe commands lists every command. Settings has a "Commands from other programs" group. Commands that read or write your data, such as listing what plays now or recording into a folder, are refused until you turn its switch on. The switch is off by default and only you can change it. The header of the pinned channels section shows a triangle that points down while the section is open and right while it is collapsed. When the device that has the content cannot send it protected yet, the exchange server page explains why nothing from it comes through. A broadcast you stopped can no longer switch back to "playing" afterwards. The offline help (F1) describes the new settings group.
