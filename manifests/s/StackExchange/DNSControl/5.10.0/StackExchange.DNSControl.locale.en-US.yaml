ReleaseNotes: |-
  Greetings DNS fans!
  This is mostly (another) refactoring release. A lot of redundant code was removed. Please test before rolling out into production. Verify that dnscontrol preview output is the same as the previous release.
  Other changes: Cloudflare now supports OPENPGPKEY (#5096), SPF handling is now case insensitive (#5094), delegation updates work better when zones need to be created (https://github.com/DNSControl/dnscontrol/pull/5097), and the big news is that @chicks-net reworked the format of Support Record Types and it looks a million times better! Thanks!
  Due to the upcoming U.S. holidays, there will probably be only a few releases between now and January 1.
  Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!
  Sincerely,
  --Tom Limoncelli
  Monthly video call!
  Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
  GitHub Discussions.
