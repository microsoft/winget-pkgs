ReleaseNotes: |-
  Greetings DNS fans!
  New provider!
  DNSControl now supports CloudPress DNS! Thanks to @arnoschoon for submitting this!
  Experimental: Try the new D() syntax!
  We're experimenting with a new registrar/dns provider syntax. Try out this newer, more concise format:
  D("example.com",
      REGISTRAR("gandi_main"),
      SERVICE("gandi_main"),
      A("@", "192.0.2.1")
  );
  No REG_* or DSP_* variables. No muss, no fuss.
  - More examples here.
  - Please test it and share feedback!
  - The old NewRegistrar()/NewDnsProvider()/DnsProvider() syntax still works, of course. We'll support those forever.
  Like it? Hate it? Join the discussion here: https://github.com/orgs/DNSControl/discussions/4949
  Unless someone finds a major problem, this will probably become the default in all documentation in a coming release. Until then, the format might change slightly.
  Thanks!
  Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!
  Sincerely,
  --Tom Limoncelli
  Monthly video call!
  Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
  GitHub Discussions.
