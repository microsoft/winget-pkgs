ReleaseNotes: |-
  Greetings DNS fans!
  Release highlights
  Just one quick bugfix related to "preview --ir" plus some non-code (docs and CI) fixes. Enjoy!
  Thanks!
  Thanks to all contributors involved in this release! This is a community project done entirely by volunteers. We we couldn't do it without all of your contributions!
  Sincerely,
  --Tom Limoncelli
  Monthly video call!
  Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
  GitHub Discussions.
