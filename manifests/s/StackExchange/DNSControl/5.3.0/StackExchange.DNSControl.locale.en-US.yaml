ReleaseNotes: |-
  Greetings DNS fans!
  Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!
  SECRET NEW FEATURE: There's a new syntax for D(). Test it out and let me know if you like it. (Both the old and new syntax will be supported.) Details are here: https://docs.dnscontrol.org/getting-started/converting-dnsconfig
  TWO NEW PROVIDERS: DNSControl now supports MITTWALD and SPACESHIP! Thanks and welcome to @twiesing and @rootful who joins the project as its maintainers. We look forward to great things!
  Sincerely,
  --Tom Limoncelli
  Monthly video call!
  Everyone is invited to the Monthly DNSControl Community Video Conference Call on the 2nd Tuesday of each month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
  GitHub Discussions.
  SECRET BETA: Try the new D() syntax!
  The new D() syntax in dnsconfig.js attempts to improve usability. It is fully backwards compatible. See the examples in the conversion guide. Feedback needed!
