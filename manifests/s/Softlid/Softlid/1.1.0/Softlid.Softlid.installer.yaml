# winget: how to install Softlid (the NSIS installers from the GitHub release). For a new version: the version
# numbers, the URLs and each installer's SHA-256 (release.ps1 prints them); check it with
# winget validate --manifest cpp\installer\winget
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: Softlid.Softlid
PackageVersion: 1.1.0
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
# (Unattended, the installer gives the spoken steps in the Windows language, the smallest install; an update keeps
# whatever was chosen before.)
UpgradeBehavior: install
MinimumOSVersion: 10.0.17763.0
# The uninstall entry the installer writes (HKCU\...\Uninstall\Softlid), so winget knows what's installed.
ProductCode: Softlid
AppsAndFeaturesEntries:
  - DisplayName: Softlid
    Publisher: Softlid
    DisplayVersion: 1.1.0
    ProductCode: Softlid
ReleaseDate: 2026-10-29
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Kindleshard/Softlid/releases/download/v1.1.0/Softlid-1.1.0-setup.exe
    InstallerSha256: BC7CA677E8C52D20FF282A8756242B038B135E655488FD9C6095C150243E8FF3
  - Architecture: arm64
    InstallerUrl: https://github.com/Kindleshard/Softlid/releases/download/v1.1.0/Softlid-1.1.0-arm64-setup.exe
    InstallerSha256: 58521B8363D8BB345DA833DBF0FCEAF38B63DBC0CE2B217BBEB3ED02756C5B0C
ManifestType: installer
ManifestVersion: 1.12.0
