ShortDescription: Lembrete diário de reinício para computadores de caixa (PDV).
Description: |-
  O Aviso de Reinício fica na bandeja do sistema e, todos os dias no horário
  configurado (padrão 02:00), abre um pop-up pedindo para reiniciar o computador.
  Se o funcionário estiver atendendo, clica em "OK, adiar" e o aviso volta após
  alguns minutos, repetindo até o computador ser reiniciado. Inclui tela de
  configurações, log em CSV e reinício forçado opcional.
