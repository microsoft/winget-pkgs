ShortDescription: A software framework for the de-novo identification of metabolites using tandem mass spectrometry
Description: SIRIUS is a Java-based software framework for the analysis of LC-MS/MS data of metabolites and other small molecules of biological interest. It integrates a collection of tools, including CSI:FingerID (with COSMIC), ZODIAC and CANOPUS. Both the graphical user interface and the command line version seamlessly integrate the CSI:FingerID, CANOPUS and MSNovelist web services, and the packaged Windows version includes the Java Runtime Environment.
