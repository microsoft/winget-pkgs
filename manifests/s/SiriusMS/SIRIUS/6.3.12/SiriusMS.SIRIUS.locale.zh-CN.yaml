ShortDescription: 用于串联质谱数据的代谢物从头鉴定软件框架
Description: SIRIUS 是一个基于 Java 的软件框架，用于分析代谢物及其他「生物相关小分子」的 LC-MS/MS 数据。它集成了包括 CSI:FingerID（含 COSMIC）、ZODIAC 和 CANOPUS 在内的一系列工具，图形界面和命令行版本均可无缝使用 CSI:FingerID、CANOPUS 和 MSNovelist 网络服务。Windows 安装包已包含 Java 运行时环境。
