ReleaseNotes: |-
  Codem v1.18.0
  发布日期：2026-11-03
  类型：稳定版（Windows x64）
  下载：Codem_1.18.0_x64-setup.exe（NSIS 安装包）· Codem_1.18.0_x64_en-US.msi（MSI）· Android 预览包见下方
  Android 真机验证包
  - Codem-Mobile-1.0.0-arm64.apk：真机（arm64-v8a）安装包。
  - Codem-Mobile-1.0.0-x86_64.apk：x86_64 模拟器包。
  - 最低 Android 7.0（API 24）。当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
  - 安装：手机允许“安装未知应用”后打开 APK；与已装同包名版本会覆盖升级。
  - 连接：PC 保持 Codem 运行，并执行 tailscale serve --bg 41873；手机与 PC 登录同一 tailnet 后，在手机「添加电脑」填 https://<machine>.<tailnet>.ts.net，配对码留空即可。
  本版要点
  1. 长任务目标模式：复杂任务先拆成可验收的阶段，再逐阶段执行、核对证据；支持暂停、修改目标、自动续跑、重启或上下文压缩后继续，已完成阶段不会重跑。
  2. 手机原生客户端（预览）：新增 Flutter 原生 Android 客户端，使用 Codem 自己的炭黑 + 紫视觉与移动密度，不再依赖 WebView 共享页面。
  3. 零配对码：同一 Tailscale 网络内通过 Serve 打开时，按 Tailscale 身份自动登记设备，手机不再需要输入 6 位配对码。
  4. 远程新建项目/会话：手机可以直接在桌面同一份项目与会话库里新建，并明确看到失败原因或能力缺失。
  5. 交互式命令不再挂起：npx 等等待输入的命令会立即拿到 EOF 并失败，不再把整轮任务拖到超时。
  变更
  新增与改进
  - 长任务目标模式：阶段契约、确定性验收、证据触发的重规划、阶段进度与决策记录；预算默认不设上限。
  - 手机原生客户端：会话列表、流式对话、工具卡、审批、项目、文件树/预览、改动 diff、深浅主题、主机切换；图片入口按 Host 能力位显示。
  - Tailscale Serve 零配对码：设备表持久化；桌面设置页可查看设备并单台撤销；同名设备重连会轮换凭据。
  - 远程网关：手机可新建项目/会话；文件树支持隐藏目录；网关继续只绑定回环地址，不新增中继服务。
  修复
  - 工具命令 stdin 关闭，交互式命令不再无限等待输入。
  - 重新进入等待审批的会话时保留待决审批，并从 Host 拉取 approval.list。
  - Host 未开放附件能力时，手机端附件按钮禁用，不再显示点了必失败的入口。
  - 零配对码设备重连/撤销状态更可靠：同一登录 + 设备名只保留一台，撤销后需要配对码重新认领。
  升级说明
  - 可直接覆盖安装，无需手动迁移数据；会话、设置、项目与已配对设备都会保留。
  - 零配对码仅适用于 Tailscale Serve。Funnel、Cloudflare 与自定义反向代理仍使用一次性配对码。
  - 停止网关会撤销全部设备；重新启动后重新允许零配对码。
  已知问题
  - 手机原生客户端目前只验证 x86_64 模拟器；本次 Release 已附 arm64 真机预览包（debug 签名），arm64 仍未在发布环境做完整回归；凭据暂存仍需在正式移动端发布前迁移到 Keystore。
  - 手机原生客户端的本机 Host 启动/发现尚未接入；当前主路径是连接远程桌面 Host。
  - Funnel/公网入口没有可信的 Tailscale 身份头，仍必须使用配对码；这不是缺陷，是安全边界。
  - 本版没有重新跑完整的跨实现评测，因此不写未经验证的对比数字。
  校验
  - 附更新器签名 .sig；latest.json 平台键为 windows-x86_64-nsis、windows-x86_64。
  - 安装包与 MSI 均由同一版本源码构建。
