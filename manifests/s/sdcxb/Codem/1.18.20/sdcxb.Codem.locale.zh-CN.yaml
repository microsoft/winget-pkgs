ReleaseNotes: |-
  Codem v1.18.20
  发布日期：2026-11-26
  类型：稳定版（Windows x64）
  下载：Codem_1.18.20_x64-setup.exe（NSIS 安装包）· Codem_1.18.20_x64_en-US.msi（MSI）
  本版要点
  1. Hub 皮肤在 v2 下恢复橙色品牌强调和 Hub 自己的表面色，不再被中性琥珀覆盖。
  2. 高对比档在 v2 下重新生效：次要文字、元信息、边框和焦点环都会加深。
  3. 系统开启「减少透明度 / 更强对比」时，梦幻皮肤会关闭毛玻璃，而不是继续强制模糊。
  4. 设置里的「界面密度：紧凑」对 v2 按钮、页签和侧栏行恢复生效。
  变更
  修复
  - 修复 Hub 皮肤在 v2 下强调色变琥珀、面板变成 v2 中性灰的问题。
  - 修复高对比档被 v2 令牌桥接层覆盖、文字与边框没有变化的问题。
  - 修复减少透明度偏好被 v2 的梦幻玻璃 !important 覆盖的问题。
  - 修复 v2 固定 28/32px 导致紧凑密度设置无效的问题。
  测试
  - 新增皮肤 × 显示模式矩阵判据：Hub 品牌色、高对比、减少透明度、紧凑密度都必须穿透 v2。
  升级说明
  - 支持直接覆盖安装，设置、会话、项目与工作区数据保留。
  - 本版不改数据格式；如需回退，可安装上一稳定版 1.18.19。
  已知问题 / 后续
  - 本版只处理 v2 与皮肤/显示模式的交叉生效，未改模型路由与 agent 循环。
  校验
  - 附更新器签名 .sig；latest.json 使用 windows-x86_64-nsis 与 windows-x86_64 两个平台键。
