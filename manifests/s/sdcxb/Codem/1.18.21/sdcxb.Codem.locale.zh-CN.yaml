ReleaseNotes: |-
  Codem v1.18.21
  发布日期：2026-11-28
  类型：稳定版（Windows x64）
  下载：Codem_1.18.21_x64-setup.exe（NSIS 安装包）· Codem_1.18.21_x64_en-US.msi（MSI）
  本版要点
  1. 默认亮色回到中性纸面，不再继承 Dream 的暖米色；主对话改为白色内容面 + 发丝边框。
  2. 保留琥珀，但拆成填充色 + 文字色：
     - 主操作（发送/保存/确认）：#b7791f 填充 + 深墨字；
     - 链接/标签/选中态文字：#6d5423 文字琥珀。
  3. 保留 v2.5 的聊天标题层级、纸面分层与 36px 发送键，暗色仍是原来的琥珀主按钮。
  变更
  修复
  - 修复默认亮色继承 Dream 暖纸、整屏米色和棕色 accent 的问题。
  - 主操作改为金色填充，不再使用墨色/棕色按钮。
  - 亮色用户气泡改用白色内容面 + 一条发丝边框，和浅灰画布拉开层次。
  - 同步 docs/design/tokens.json、DESIGN-DIRECTION.md 与 accent 对比度判据。
  升级说明
  - 支持直接覆盖安装，设置、会话、项目与工作区数据保留。
  - 本版不改数据格式；如需回退，可安装上一稳定版 1.18.20。
  已知问题 / 后续
  - 本版只处理默认亮色与 token；Hub/Dream 的强调色映射保持 1.18.20 的修复。
  校验
  - 附更新器签名 .sig；latest.json 使用 windows-x86_64-nsis 与 windows-x86_64 两个平台键。
