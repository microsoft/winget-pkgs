ReleaseNotes: |-
  Codem v1.18.17
  发布日期：2026-11-25
  类型：稳定版（Windows x64）
  下载：Codem_1.18.17_x64-setup.exe（NSIS 安装包）· Codem_1.18.17_x64_en-US.msi（MSI）
  本版要点
  1. 界面阅读更轻松：正文、次要文本和元信息整体上调一档，页面标题与分区标题层级统一。
  2. 聊天更安静：运行统计默认收进「运行详情」，只保留轮次、步数和总耗时；需要时再展开 token、缓存、费用和时延。
  3. 聊天新增工作证据区：展示本会话最近的文件变更和验证结果，没有记录时不占位。
  4. 插件、任务、设置三个高频面板完成信息架构收口：插件按类型分组、任务空态给下一步、设置保存固定在底栏。
  5. 图标、强调色和边框统一：可见图标收敛到 16/20，装饰性金色和逐行边框大幅减少。
  变更
  新增与改进
  - 聊天回合尾部新增工作证据区，显示文件变更和验证命令的通过/失败结果。
  - 插件列表按核心、服务、能力、界面、兼容分组；依赖为空时不再显示占位符。
  - 任务与活动空态不再展示 0% 仪表和全零字段，改为明确的团队/时间线入口。
  - 设置底栏改为贴底操作条：次要操作在左，保存固定在右；内容底部留出滚动空间。
  - 弹窗标题、工具栏和列表统一留白；图标统一 16/20 尺寸与 1.5 描边。
  修复
  - 修复任务中心、插件市场、智能体面板用内联边框绘制列表导致的密度和悬停不一致。
  - 修复任务卡、消息气泡、记忆项和运行证据区的逐条描边与错位。
  - 修复免费模型插件行依赖为空时仍显示「—」的问题。
  - 修复设置段内多个实心主按钮争抢焦点，以及任务/记忆导航链接过多使用强调色。
  升级说明
  - 支持直接覆盖安装，设置、会话、项目与工作区数据保留。
  - 本版不改变数据格式；如需回退，可安装上一稳定版 1.18.16。
  已知问题 / 后续
  - 本版以界面与可用性收口为主，未改模型路由与 agent 循环，未重新跑长任务评测。
  - Android arm64 真机验证仍不在本版范围内。
  校验
  - 附更新器签名 .sig；latest.json 使用 windows-x86_64-nsis 与 windows-x86_64 两个平台键。
