ReleaseNotes: |-
  Codem v1.18.19
  发布日期：2026-11-25
  类型：稳定版（Windows x64）
  下载：Codem_1.18.19_x64-setup.exe（NSIS 安装包）· Codem_1.18.19_x64_en-US.msi（MSI）
  本版要点
  1. 梦幻皮肤的「卡片透明度」重新生效：卡片、面板和侧栏会跟随滑杆实时变化。
  2. 梦幻皮肤的「毛玻璃模糊度」重新生效：侧栏、设置、弹窗、菜单和卡片恢复背景模糊。
  3. 默认 v2 界面不变，仍使用中性面与发丝线，不会重新引入玻璃效果。
  变更
  修复
  - 修复 v2 的不透明表面令牌覆盖梦幻皮肤半透明令牌，导致透明度滑杆无效。
  - 修复 v2 的 backdrop-filter: none 覆盖梦幻皮肤毛玻璃，导致模糊度滑杆无效。
  - 梦幻皮肤下 v2 的文字、边框和强调色同步到皮肤色板。
  升级说明
  - 支持直接覆盖安装，设置、会话、项目与工作区数据保留。
  - 本版不改数据格式；如需回退，可安装上一稳定版 1.18.18。
  已知问题 / 后续
  - 本版只修复梦幻皮肤与 v2 的令牌/玻璃兼容，未改模型路由与 agent 循环。
  校验
  - 附更新器签名 .sig；latest.json 使用 windows-x86_64-nsis 与 windows-x86_64 两个平台键。
