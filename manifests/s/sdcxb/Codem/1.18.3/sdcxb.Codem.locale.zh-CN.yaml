ReleaseNotes: |-
  Codem v1.18.3
  发布日期：2026-11-04
  类型：稳定版（Windows x64）
  下载：Codem_1.18.3_x64-setup.exe（NSIS 安装包）· Codem_1.18.3_x64_en-US.msi（MSI）· Android 预览包见下方
  Android 真机验证包
  - Codem-Mobile-1.0.0-arm64.apk：真机（arm64-v8a）安装包。
  - Codem-Mobile-1.0.0-x86_64.apk：x86_64 模拟器包。
  - 最低 Android 7.0（API 24）。当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
  - 安装：手机允许“安装未知应用”后打开 APK；与已装同包名版本会覆盖升级。
  - 连接：PC 保持 Codem 运行，并执行 tailscale serve --bg 41873；手机与 PC 登录同一 tailnet 后，在手机「添加电脑」填 https://<machine>.<tailnet>.ts.net，配对码留空即可。
  本版要点
  1. 写文档任务不再被误催测试/构建：以前只要这一轮改过文件、没跑测试/构建，收尾就提示「这一轮没有跑过任何验证」。现在按改动对象分级：明确只改了 .md / .docx / .pdf / .xlsx 等文档，或文档任务里用脚本生成文档，不再要求测试/构建。
  2. 代码验证门没有放宽：明确改了代码/配置，或混合改动里包含代码，仍然要求测试/构建/类型检查；完成门、回归门、红判据门也保持不变。
  3. 文档任务不再出现“未经证实”的黄色警告，不会再让用户去跑与任务无关的测试或构建。
  变更
  修复
  - 新增改动范围分类：文档/内容、代码/配置、未知三类；明确路径优先，命令/输出里的扩展名次之，任务描述只做未知情况兜底。
  - 文档-only 回合跳过「没有验证」的 nudge 与「未经证实」收尾提示。
  - 保留代码任务的原有验证门；混合改动（文档 + 代码）仍按代码处理。
  升级说明
  - 可直接覆盖安装，无需手动迁移数据；会话、设置、项目与已配对设备都会保留。
  - 本版只调整收尾提示的适用范围，不改变工具执行、完成门、验证门、回归门或长任务行为。
  - 手机 APK 与 v1.18.2 相同，本版未重新构建移动端。
  已知问题
  - 手机 APK 仍为 1.0.0 debug 签名预览包。
  - 完整 12 任务跨实现评测仍未重跑；长尾单任务的两轮结果只作为方向性参考。
  校验
  - 附更新器签名 .sig；latest.json 平台键为 windows-x86_64-nsis、windows-x86_64。
  - 安装包与 MSI 均由同一版本源码构建。
