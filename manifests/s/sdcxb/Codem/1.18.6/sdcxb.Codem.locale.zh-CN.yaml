ReleaseNotes: |-
  Codem v1.18.6
  发布日期：2026-11-05
  类型：稳定版（Windows x64）
  下载：Codem_1.18.6_x64-setup.exe（NSIS 安装包）· Codem_1.18.6_x64_en-US.msi（MSI）· Android 预览包见下方
  本版要点
  1. 项目级文档索引：PDF、Word / Excel / PPT、Markdown / 文本、图片进入同一个项目索引；支持标题大纲、页/块级引用与中文全文检索。索引库独立于会话库，可重建。
  2. 扫描件 / 图片页视觉转录：没有文本层的 PDF 页和图片交给视觉模型转成可检索正文；逐页串行，单页失败可重试，转录后和普通文本页一样参与检索与引用。DeepSeek Flash 可直接使用原生视觉。
  3. 大文件续跑与进度：取消或崩溃后，同样内容重试会从检查点继续（PDF 按页），不再从零开始；长文件索引时状态条显示百分比。
  4. PDF 标题识别：书签优先；没有书签时识别「第 X 章 / Chapter N / 1.2」；再兜底按字号层级推断。
  5. 大规模向量检索：文档块可选向量索引，聚类 + int8 量化 + 外存读取；支持跨文档证据检索，每条结果带稳定引用，由对话模型基于证据作答。
  6. 安装与升级：文档索引库 schema 自动迁移到 v4，覆盖安装即可，无需手动清理。
  变更
  新增与改进
  - 文档索引：PDF / DOCX / XLSX / PPTX / Markdown / 文本 / 图片统一入口；4MB 分块上传；标题感知分块；页/块引用。
  - 图片与扫描页视觉转录；转录文本进入同一套分块与检索。
  - 文档索引进度、状态与可行动错误（未就绪不会返回“没有相关内容”）。
  - 向量检索：IVF 聚类 + int8 量化 + 精确重排；doc_cross_search 跨文档证据工具。
  - 输入区附件提示与上下文徽章不再挤压编辑区。
  - 目标模式暂停 / 阻塞时提供取消入口；停止会同时结束当前回合。
  修复
  - DeepSeek Flash 被误判为“不支持视觉”，图片被降级成文字标注。
  - 粘贴图片后左侧上下文徽章把编辑区挤到右边。
  - 目标已暂停但仍显示流式停止按钮、没有取消出口。
  - 首次安装（没有旧库）时弹出「操作没有生效」的假失败。
  - 旧版文档索引库升级时索引创建顺序错误，可能打不开。
  Android 真机验证包
  - Codem-Mobile-1.0.0-arm64.apk：真机（arm64-v8a）安装包。
  - Codem-Mobile-1.0.0-x86_64.apk：x86_64 模拟器包。
  - 最低 Android 7.0（API 24）。当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
  - 本版 Windows 改动不涉及移动端，APK 与 1.18.5 相同。
  升级说明
  - 可直接覆盖安装；文档索引库与设置会自动迁移，无需手动操作。
  - 从更早版本升级后，已建立的文档索引会在首次打开时自动迁移到新 schema。
  - 回退：安装旧版安装包即可；文档索引是可重建缓存，回退不会影响会话数据。
  已知问题 / 后续
  - 向量索引需要先配置 embedding 提供方；未配置时仍使用全文检索，功能不受影响。
  - 扫描件转录依赖当前对话模型或「设置 → 多模态 → Vision」配置；未配置时会保持 needs_ocr 并给出可行动提示。
  - 极大规模向量集合的首次训练需要一些时间；训练完成后查询走聚类索引。
  - 冷启动后立刻对扫描件触发转录，若视觉配置尚未加载，可能提示「未配置视觉模型」；重试一次即可。
  校验
  - 附更新器签名 .sig；latest.json 平台键为 windows-x86_64-nsis、windows-x86_64。
  - MSI 与 NSIS 安装包同源同签名。
