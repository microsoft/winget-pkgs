ReleaseNotes: |-
  Codem v1.18.8
  发布日期：2026-11-05
  类型：稳定版（Windows x64）
  下载：Codem_1.18.8_x64-setup.exe（NSIS 安装包）· Codem_1.18.8_x64_en-US.msi（MSI）· Android 预览包见下方
  本版要点
  1. 修复暂停免费模型插件后仍能选择免费模型：暂停或删除插件后，免费模型的归属索引立即清空、界面收到设置变更并刷新；模型选择器按当前开关过滤，关闭时不再列出任何免费模型，重新启用后才恢复。
  2. 接入 AI Code With：在「设置 → 模型供应商」填一把 sk-acw-* key，即可选择 Claude / GPT / Gemini / Grok / DeepSeek / GLM / Kimi / MiniMax / Jev 的聊天模型；按模型族自动走 Anthropic Messages、Google Gemini、OpenAI 三套协议。模型列表标注来源与「多模态 / 文本」，同名模型分成两条并携带 provider 选择，避免调错供应商。
  变更
  新增与改进
  - 新增 AI Code With 供应商预设（Base URL https://api.aicodewith.ai/v1，可改国内线路），一把 key 覆盖 Claude / GPT / Gemini / Grok / DeepSeek / GLM / Kimi / MiniMax / Jev。
  - 动态模型目录只保留聊天模型；图像/视频生成模型不进入选择器。
  - 模型菜单、设置页、档案页、输入区与重新生成弹层都标注来源与模态，避免只改一处漏一处。
  - AICodeWith 模型目录启动后自动刷新（24 小时内只拉一次，失败下次启动重试）；设置卡片仍可手动「刷新模型列表」。
  修复
  - 暂停/删除免费模型插件时清空 isFreeModelId 归属索引，避免旧模型 id 继续按免费模型路由。
  - 插件设置写入时广播 codem-settings-changed，模型选择器与设置页立即重算，不再依赖重新打开面板。
  - getConfiguredApiModels() 增加开关闸门：关闭时即使缓存或动态列表里还有旧条目，也不进入选择器。
  Android 真机验证包
  - Codem-Mobile-1.0.0-arm64.apk：真机（arm64-v8a）安装包。
  - Codem-Mobile-1.0.0-x86_64.apk：x86_64 模拟器包。
  - 最低 Android 7.0（API 24）。当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
  - 手机端是远程窗口：模型调用发生在已配对的电脑上。电脑配好 AICodeWith 后，手机自动使用同一个模型/供应商，不需要在手机端再填 key。
  - 本版 Flutter 代码未改，APK 随版重新构建；自包含 Android 本机 Host 不在本版发布资产内。
  升级说明
  - 可直接覆盖安装；设置、文档索引与会话数据不受影响。
  - 升级后暂停插件，模型选择器会立刻移除免费模型；重新启用后恢复。
  已知问题 / 后续
  - 免费模型依赖本机插件进程与网络；插件未启动或模型不可用时，选择器会按可用性屏蔽/标注。
  校验
  - 附更新器签名 .sig；latest.json 平台键为 windows-x86_64-nsis、windows-x86_64。
  - MSI 与 NSIS 安装包同源同签名。
