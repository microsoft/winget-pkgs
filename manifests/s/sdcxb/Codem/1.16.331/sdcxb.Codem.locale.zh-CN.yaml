ReleaseNotes: |-
  Codem v1.16.331
  本版要点
  长期使用后数据库会自己瘦身。 会话事件日志（轨迹、回放、审计细节）默认只保留最近 14 天、每个会话最多 5000 条，启动后在后台自动清理；陈旧会话只留一条会话元信息。本机实测数据库从 898 MB 降到 317 MB。对话内容、搜索、继续对话、导出完全不受影响——被清理的是事件流水，不是聊天记录。
  右侧「改动」面板现在先给结论。 顶部一行是本轮汇总（+N −N、涉及多少文件），下面按文件列出增删行数；再往下是「最近检查」，显示本轮跑过的验证命令与通过/失败。没有记录时会明确说「本轮没有检查记录」，不把「不知道」画成 +0。
  启动更快、安装包更小。 数学公式与代码高亮改为按需加载，主包从约 4.76 MB 降到约 2.70 MB；启动瞬间先给轻量的首帧提示，减少白屏感。窗口在后台时，界面定时器也不会再被系统降频。
  修复
  - 退出应用后不再残留命令进程：应用崩溃或被强杀时，它启动的 shell 与命令会随系统一起回收。
  - worktree 合并冲突可以直接打开文件看：冲突时仍会先回滚（不会把仓库留在冲突态），但会列出冲突文件，点一下即可在编辑器里打开。
  - 全文索引的孤儿记录能真正清掉：此前消息表里存在空 id 时，清理语句一行都删不掉却报「已清理 0 条」。
  - 正文渲染不再强制优化字形：移除了会让部分字体发虚的 text-rendering 设置。
  改进
  - 正文与输入框同宽：1400 宽窗口下两者都是 732px（此前正文 770、输入框 732）。
  - 设置页层级与窄窗口：卡片标题统一 13px 加粗；窗口很窄时行式设置自动回退单列。
  - 右栏分隔条双击复位：拖宽后双击即可回到默认宽度。
  - 内存体检不再卡界面：重复项扫描分块推进、显示进度、可取消；超过上限会如实说明「只扫了最近 N 条」。
  - 梦幻皮肤补齐 21 个语义令牌：强调色、阴影、边框、提示框、终端底色等都跟随背景图取色，换图时整体一起变。
  对标结果
  本版没有改动 agent 循环、模型路由或上下文策略；12 个真实仓库修复任务的对标批未重跑，能力结论沿用上一版，不把未复测的数字当成新结论。
  已知问题
  - 首次启动的事件日志清理可能多花几秒（本次实测约 9 秒回收 581 MB），期间界面可正常使用。
  - 事件日志被清理后，旧会话的「事件级回放/轨迹」不再完整；对话本身不受影响。
  - 梦幻皮肤的颜色取自背景图，未设置背景图时使用默认粉紫。
  校验
  - tsc --noEmit 零错误；全量测试通过（0 失败）。
  - latest.json 同时包含 windows-x86_64-nsis 与 windows-x86_64，签名与本机构建产物一致。
  - 安装包已在本机静默安装并核对文件版本：FileVersion=1.16.331、ProductVersion=1.16.331。
