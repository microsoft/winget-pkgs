ReleaseNotes: |-
  Codem v1.17.0
  发布日期：2026-11-03
  类型：功能更新
  下载
  - Windows 安装包：Codem_1.17.0_x64-setup.exe
  - 校验：见 release 资产中的 .sig 与 latest.json
  本版要点
  手机远程访问 PC（桌面远程网关）
  - 手机经 6 位一次性配对码连接 PC 后，直接查看/操作这台 PC 桌面自己的项目、会话与历史；PC 仍是数据的唯一拥有者，手机与 PC 不共用数据库。
  - 支持在已有会话里发消息、流式查看回答/工具调用、回答审批、停止运行。
  - 支持文件树、文件预览、统一 diff、按轮次的文件变更列表与单文件 diff。
  - 手机窄屏新增「变更」入口；平板/宽屏可用双列/三列布局（列表可折叠，第三列文件/差异/变更）。
  手机本机模式
  - Android 端可独立运行本机 Host，拥有自己的项目/会话数据，与 PC 互不干扰。
  - 新增「本机模型设置」：base URL / API Key / model 可在手机上填写；Key 用 Android Keystore 加密保存，保存后热重启本机 Host，不影响 Activity/会话数据。
  - 本机 Host 使用随机端口与每次运行随机本地凭据，同机其它 App 不能再直接调用。
  统一界面与安全
  - 桌面与手机共用同一套 Markdown、工具卡、审批卡、文件树、diff 与变更列表。
  - 审批支持拒绝理由与「始终允许」；敏感文件（.env、.git/config、.ssh、私钥等）读取需审批。
  - 移除旧 LAN/TLS/二维码配对与桌面 Host sidecar 远程入口；桌面设置里只保留「桌面远程网关」与可选的 Agents Anywhere 账号通道。
  - 工具名随消息落库，重开历史不再显示 tool。
  升级说明
  - 可直接覆盖安装；设置、会话、项目、技能、插件与历史均保留。
  - 桌面升级后不再自动启动旧 Host sidecar；手机远程请在「设置 → 连接手机 → 桌面远程网关」启动网关并生成配对码。
  - Android 端为独立 APK，需侧载安装；本机模型 Key 可在应用内设置。
  - 停止网关或重启桌面后需要重新配对（当前网关配对为进程内）。
  已知问题
  - 手机远程暂不支持新建会话、上传附件、运行引导与插件列表；这些能力仍在手机本机模式/Host 路径。
  - 网关只绑定 127.0.0.1：真机需 adb reverse 或 Tailscale/Cloudflare 等隧道。
  - 桌面安装包使用更新器 minisign 签名，未做 Authenticode 签名；SmartScreen 可能提示。
  - Android arm64 仅完成构建，未在物理 arm64 设备上运行验证。
