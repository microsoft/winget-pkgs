ReleaseNotes: |-
  Codem v1.18.22
  发布日期：2026-11-29
  类型：稳定版（Windows x64）
  下载：Codem_1.18.22_x64-setup.exe（NSIS 安装包）· Codem_1.18.22_x64_en-US.msi（MSI）
  本版要点
  1. 高分辨率下聊天区不再只显示中间一条：1600px 以上按可用宽度铺满，只保留阅读 gutter，超宽屏两侧不再出现大片空白。
  2. 发送区重新分级：输入为空时发送键保持中性；有内容时发送键为墨色，快捷短语下拉为浅色面，不再并排两块高饱和色。
  变更
  改进
  - 宽屏正文列与 Composer 同步使用聊天区可用宽度，1920 / 2560 / 4K 下不再出现固定阅读列留下的死白。
  - 发送键、快捷短语下拉统一主次关系；下拉改为中性面与发丝线，避免和发送键争抢视觉焦点。
  修复
  - 修复发送键禁用态仍使用高饱和黄铜、与右侧下拉形成两个主操作的问题。
  - 修复高分辨率下正文列与 Composer 宽度不一致、两侧留白过大的问题。
  升级说明
  - 可直接覆盖安装；现有会话、项目与设置保留，不需要手动迁移。
  - 本次只调整界面布局与配色，不涉及数据格式变更。
  已知问题 / 后续
  - 本次未改模型路由与 agent 循环；长任务评测结论仍以对应版本的既有记录为准。
  校验
  - 安装包与 MSI 均附更新器签名 .sig。
  - latest.json 同时提供 windows-x86_64-nsis 与 windows-x86_64 两个平台键。
