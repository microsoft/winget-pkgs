ReleaseNotes: |-
  Codem v1.16.334
  发布日期：2026-10-31
  类型：功能版
  下载
  - Windows 安装包：本页 Assets 中的 Codem_1.16.334_x64-setup.exe（NSIS）或 Codem_1.16.334_x64_en-US.msi
  - 自动更新：安装后检查更新，或重启应用
  本版要点
  - 压缩不再删除历史：压缩只留下检查点，旧提问、思考、回答仍可在「完整历史」查看；模型/Agent 只看检查点之后的内容。
  - 完整历史与模型视图：主对话和完整历史面板都能切换两套视图，完整历史不计入水位。
  - 长会话虚拟列表：完整历史按测量高度、主对话按块估算，只渲染可视区与少量预渲染；2000 条会话不再一次挂满 DOM。
  - 检查点索引：检查点写入独立的派生索引，面板显示索引数量；索引丢失或损坏不影响模型读路径。
  - 溢出工具结果全文查看：被截断的工具结果可直接打开全文；文件丢失会明确提示。
  - 旧压缩历史自动回填：打开旧会话时自动补进权威日志，失败可手动重试；也提供一次性回滚。
  健壮性
  - 水位优先使用最近一次真实请求的 promptTokens，只有可见消息、内容与窗口都一致时才采用；变化后自动退回估算。
  - 溢出路径越界、文件缺失、坏检查点 metadata、派生表命令失败均按显式状态处理，不伪装成功。
  - 上下文检查点保留一次性回滚入口，回滚只写回隐藏标记，不删除正文。
  升级说明
  - 可直接覆盖安装；设置、会话、技能、插件与溢出文件均保留。
  - 旧版压缩隐藏的历史会在打开会话时自动回填。
  - 如需回到旧版压缩行为，可在「完整历史」使用一次性回滚（二次确认）。
  对标结果
  本版是上下文架构升级，未改变模型/工具路由；沿用 1.16.333 的真实仓库任务基线，未重新跑批。
  已知问题
  - 无已知阻断问题。
  - 极长会话首次打开完整历史时需要测量可视区高度，可能有短暂布局调整。
  校验
  - NSIS 安装包 SHA-256：ef17c9a31c6716536d3de2f96cfa31df9c2f2ef0fbd694b435642de86b66c0d2
  - 更新清单同时提供 windows-x86_64-nsis 与 windows-x86_64 两个平台键，签名已校验。
