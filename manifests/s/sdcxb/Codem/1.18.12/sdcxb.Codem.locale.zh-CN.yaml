ReleaseNotes: |-
  Codem v1.18.12
  发布日期：2026-11-06
  类型：Android 本机模式预览
  下载：Android 本机模式见下方；Windows 安装包随版
  本版要点
  手机本机项目导入补齐：
  - 原生「本机模型设置」新增「从手机文件夹导入项目」；
  - 调系统文件选择器（SAF）选择任意目录，递归复制到共享工作区 /storage/emulated/0/codem/workspace/<项目名>；
  - 导入成功后自动切换到该项目并重启本机 Host；
  - 只读源目录，不删除/移动原文件；上限 5000 文件 / 512MB。
  至此手机本机模式的项目主链：共享目录 → 文件管理器/系统选择器放入项目 → 选择/新建项目 → Host 在手机本地运行。
  Android 本机模式
  - Codem-Shell-1.18.12-arm64.apk：真机安装包，不依赖电脑。
  - Codem-Shell-1.18.12-x86_64.apk：x86_64 模拟器包。
  - 当前为 debug 签名预览包。
  使用
  1. 首次启动允许「所有文件访问」；
  2. 信息 → 本机模型设置 → 填 AICodeWith key，拉模型列表；
  3. 「从手机文件夹导入项目」选择手机目录，或直接在 内部存储/codem/workspace 放项目；
  4. 保存后 Host 以该项目为 --workspace 重启。
  已知问题 / 后续
  - 终端（terminal.*）未支持（按你的要求本次不做）；
  - Flutter 客户端仍是远程窗口，不是本机运行；
  - 项目导入是复制，不是双向同步。
  校验
  - 共享目录 Host 参数实测 /storage/emulated/0/codem/workspace/emoy；
  - 系统文件选择器导入路径已编译进 APK；全量测试见发布记录。
