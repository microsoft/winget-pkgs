ReleaseNotes: |-
  Codem v1.18.9
  发布日期：2026-11-05
  类型：稳定版（Windows x64）+ Android 本机模式预览
  下载：Windows 安装包见下载区；Android 本机模式见下方
  本版要点
  1. Android 本机模式支持 AI Code With：手机不连电脑也能在本机 Host 上使用 AICodeWith 的一把 key。Claude 走 Anthropic Messages、Gemini 走 Google Gemini、其余模型走 OpenAI 兼容入口，和桌面端同一套分派规则。
  2. 手机端模型设置补齐：原生「本机模型设置」新增「使用 AI Code With 预设」与「获取模型列表」；填 sk-acw-* 后可列出聊天模型并点选，不再需要手输模型名。图像/视频生成模型不进入列表。
  3. 桌面端启动自动刷新 AICodeWith 目录：24 小时内最多拉一次，失败下次启动重试；设置卡片仍可手动刷新。
  Android 本机模式
  - Codem-Shell-1.18.9-arm64.apk：手机真机安装包，APK 内含 PRoot + Ubuntu + Node + 本机 Host，不依赖电脑。
  - Codem-Shell-1.18.9-x86_64.apk：x86_64 模拟器包。
  - 首次启动会解压运行时；桌面「文件/信息」里可查看本机端点，本机模型设置在「信息 → 本机模型设置」。
  - 当前为 debug 签名预览包，只用于真机验证，不可上架应用商店。
  升级说明
  - Windows 可直接覆盖安装；AICodeWith key、模型目录、会话数据保留。
  - Android 本机模式的旧配置保留；在本机模型设置里点「使用 AI Code With 预设」，填 key，再点「获取模型列表」即可。
  已知问题 / 后续
  - Android 本机模式的工作区当前是应用内运行时目录，手机本地项目选择/导入还在补齐；Flutter 远程客户端仍是「手机看电脑」的形态。
  - AICodeWith 的模型目录依赖服务端 /models；取不到时仍可手输模型名。
  校验
  - Windows 附更新器签名与 latest.json；Android 本机模式 APK 使用项目 debug keystore 签名。
  - 全量测试 895 文件 / 9636 用例 / 9619 通过 / 17 skipped。
