ReleaseNotes: |-
  >> IMPORTANT NOTES ON HDR SCREENSHOTS <<

   + Changed HDR PNG screenshot chunk names to comply with changes made to HDR PNG's
      final specification versus the draft spec SK was designed around...

     * Most browsers that used to use the old chunk names now only recognize the
         new ones and these particular chunks (mDCv and cLLi) are critical for
           tonemapping content too bright for a user's display to output unaltered.

       @ As such, any older screenshots you have lying around may appear dimmer on
           some users screens if they view them in a browser rather than SKIV.

    -- Simultaneously, and unrelated to SK, Discord is currently broken and removing
         ICC profiles from all images uploaded, which causes perfectly standard HDR
           screenshots to be treated as SDR when displayed inline in chat...

        * SK cannot fix this, but your images _are_ all valid, if they ever fix it.

   + Fixed changes to Assassin's Creed: Shadows Reflex implementation that were
      preventing DLSS framegen. Engine still broken; just in more interesting ways
   + Changed Xbox Impulse Trigger -> DualSense Adaptive Trigger's frequency to make
      it more closely resemble the pathetic motors on Xbox triggers
   + Improved Unity fixed-delta-time overrides for games like Dave The Diver, that
      change this engine variable every time game modes change
   + Disable Unity engine's internal framerate limiter whenever VSYNC is off, because
      it's often using wrong rate and not desired/configurable in the first place
   + Improved DualSense Edge extra button -> keyboard compatibility with Unity
   + Stop detecting all HID devices with matching HID report sizes as PlayStation
   + Removed serial number mismatch warning on newer revision DualSense controllers
   + Prevent PRAGMATA from blocking the Windows Key and external hotkeys by default
      (reset config if you need this)
   + Avoid injecting SK into the wrong part of Microsoft's Xbox Russian Nesting Doll
      (more specifically, the Xbox 360 emulator that runs the Xbox emulator, rofl)
