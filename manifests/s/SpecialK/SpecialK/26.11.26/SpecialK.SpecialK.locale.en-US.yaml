ReleaseNotes: |-
  Special K 26.11.26
  ------------------
   + Merged pull request #404 from Aemony:fix/crash-stutters
      * Fixes stutters when exceptions are thrown, e.g. in Unity/il2cpp games.

  SKIF 2.0.0
  ----------
   + Library: Added support for the EA app, itch.io, Ubisoft Connect and
       version 2 of the Epic Games Launcher.
   + Library: Added a grid view of covers, with a size slider, platform logos
       and drag and drop of new covers. Also available in Horizon mode.
   + Added support for animated covers (APNG and WebP), and WebP covers in
       general.
   + Covers can now be downloaded from IGDB for all platforms.
   + SKIF no longer keeps asking for covers a source does not have; it checks
       again after a week, or when Refresh is used in the cover menu.
   + Dropping a new cover on a game can now be undone.
   + Steam: Added support for the Steam client beta.
   + Steam: Fixed some games missing their cover.
   + Library: Select multiple games to change their category or favorite state
       at once.
   + Library: Pinned games are now favorites.
   + Library: Added filter history; F3 is a synonym for Ctrl+F. Added
       "Clear Filter" to the right-click menu.
   + Game details now show the technology a game uses, based on its files.
      * Special K is disabled by default for games with anti-cheat, and a
          warning is shown next to the launch button.
   + Reworked launch options, the launch bar and the Properties window.
   + Added environment variables and a working directory to launch options,
       including for custom games. Improved support for elevated launches.
   + Added an INI Editor for Special K's config files, with presets.
   + Added a Local Install Manager to install, reinstall and remove local copies
       of Special K.
   + Reordered the tabs.
   + Settings: Added in-game keybindings and improved gamepad button rebinding.
   + Added a service toggle in the bottom left corner.
   + The Start Service hotkey now also whitelists the game in the foreground,
       and restarts the service if Special K was already loaded in it.
   + Added an option to ignore the blacklist.
   + Jump list: Recently launched games are moved to the top, and fixed Xbox
       games missing from it.
   + Added a German translation.
   + SKIF and the library start considerably faster.
   + Sharper game icons and covers, and better support for high-DPI and
       multi-monitor setups.
   + SKIF remembers a maximized window. Double-click the title bar to
       maximize/restore it.
   + SKIF now uses the system proxy settings.
   + Fixed several crashes, and a crash while saving no longer risks losing
       your categories, favorites and renamed games.
   + Fixed HDR detection on multi-monitor setups.
   + Fixed garbled text in some cases.
   + Use SKIF_SteamAppIDtxt=0 to remove steam_appid.txt.
   + Disabled UnX as it is no longer compatible.

  SKIV 1.0.0
  ----------
   + Added an HDR-to-SDR tone mapper setting, in Settings and in the context
       menu of HDR images. It is used to show HDR images on SDR displays, and
       when saving or copying HDR images and screen captures as SDR.
      * Default:        The image's range mapped to that of SDR (as before).
      * SKIV Piecewise: Keeps the darker half of SDR as is, and compresses
                        the highlights.
      * SKIV Auto Tone: Like Piecewise, but darkens the midtones of bright
                        scenes to make room for the highlights.
   + Added playback of animated images: APNG, GIF, WebP and AVIF.
   + Added color management: ICC profiles and wide gamut images are now
       shown with the right colors, and HLG images are supported.
   + Added a thumbnails carousel along the bottom of the viewer, and faster
       browsing through folders.
      * Added Home/End navigation, and a setting to loop through the images
          of a folder.
   + Added zooming, dragging and double-clicking of the image in the viewer,
       and an Automatic mode to the Scaling menu.
   + Added a native (Windows) context menu, sorting as File Explorer does,
       and deleting the image shown.
   + Region captures now work across all displays, and while SKIV is
       minimized.
      * Selections can be dragged in any direction, and a right click
          cancels them.
      * The snipping toolbar can save to disk and pick the file to save to.
   + Added a Screenshots folder with a configurable naming scheme for saved
       screen captures, including the window's title and process name.
   + Added a Discord Compatibility option, so that Discord shows thumbnails
       of HDR PNGs in HDR.
   + Improved copying and pasting, including pasting images from browsers.
   + Added SDR AVIF decoding and encoding.
   + Improved support for Photoshop documents (.psd).
   + Large progressive JPEGs load faster, with a preview while they load.
   + The image details show DDS texture information.
   + Keybindings:
      * Hotkeys can be turned off without unbinding them.
      * Enter (or Numpad Enter) confirms a new keybinding.
      * Escape, Backspace, Delete and Enter can be bound with a modifier held
          (e.g. Ctrl+Delete).
      * Viewer hotkeys are disabled while on the Settings tab.
   + Added support for Windows 7 and 8, and 32-bit builds are back.
   + OpenEXR (.exr) images are not supported in this build.
   + Fixed crashes when navigating past the final image, when deleting files
       from elsewhere, and when using too long paths.
   + Fixed memory leaks when browsing images.
   + Fixed HDR detection on multi-monitor setups.
   + Fixed screenshot paths with some regional date formats.
   + Fixed Escape not minimizing the app again from the system tray.
   + Fixed deleting the only image of a folder.
   + Fixed the snipping toolbar not accepting clicks.
