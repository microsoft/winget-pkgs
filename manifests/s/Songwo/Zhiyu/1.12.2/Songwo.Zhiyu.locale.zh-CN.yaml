ReleaseNotes: |-
  知屿 Zhiyu 1.12.2
  全新 2 分钟宣传片。本版没有应用功能变化，应用内更新只同步版本号；已有资料沿用原数据目录。
  宣传片
  - 产品主页的宣传片重制为 2 分钟的代码动画：一个 HTML 文件按时间画出每一帧（seek(t) 是时间的纯函数），每帧三个子帧平均出运动模糊，1920×1080、60fps。
  - 配乐由代码原创合成，120 BPM，60 个小节；第 5 小节进入主段，安全段是间奏，命令面板处第二次进入；界面音效按峰值对齐画面事件，响度 -14 LUFS。
  - 内容按小节推进：散落的资产与过期提醒 → 资产总览与需要留意 → 关联与详情页 → 标签 → 文档 → 用量 → 邮箱与号码 → 续费日历与「已续费」→ 自定义资产类型 → AI 助手的出处、修改建议与下一步，以及各页的「问 AI」→ 密钥库、加密、加密备份与每日活动 → 命令面板、深色模式、快速开始、订阅模板 → 主机监控、SSH、便携版、浏览器插件、应用内更新、使用指南 → 结尾的仓库地址与 Star。
  - 小蟹（原创的橙色小螃蟹）是片中的带路角色；真实界面截图使用演示数据，不含私人资产。
  - 产品主页同步更新封面图与说明文字；视频约 22 MB。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.12.2-setup.exe、便携版 Zhiyu-1.12.2-portable-x64.zip、浏览器插件 Zhiyu-1.12.2-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
  验证
  - 宣传片逐拍抽帧检查（240 拍）：页面无报错，画面无重叠遮挡；成片 1920×1080、60fps、120 秒。
  - TypeScript、ESLint、i18n 与单元测试通过；打包程序的 19 项发布检查全部通过。
  - 已知：agent-workspace 的桌面输入区贴底断言（8px 间距）以及 usage-charts、usage-insights、relations-usage-ui、mail-push、probe-desktop 在 1.10.0 上同样失败，与本版改动无关。
