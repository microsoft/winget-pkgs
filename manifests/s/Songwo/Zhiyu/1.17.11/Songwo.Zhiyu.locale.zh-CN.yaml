ReleaseNotes: |-
  知屿 Zhiyu 1.17.11
  本次修正邮箱身份授权容易被误解为已连接收件箱的提示，并减少启动时加载的非必要功能。
  改动
  - 修复设置主密码弹窗延迟聚焦抢走确认框焦点的问题，避免快速输入时受到干扰；用可控时钟复现旧版失败并检查修复后的焦点保持。
  - 修复尚未打开正文就先请求附件时的解析结果层级错误，避免下载失败；附件与正文共享的缓存保留解析依赖。
  - 终端界面首次打开时加载，有明确加载状态及错误恢复入口；离开页面保持挂载，保留终端实例与会话。桌面与 Web 同步。
  - 邮件正文 MIME 解析、HTML 文本转换和安全清洗首次读取正文时加载；SMTP 传输首次发信时加载。邮件清洗、缓存、锁库取消和明确发送确认继续保留。
  - 邮箱 Google / Microsoft 授权明确标注为身份核验，成功后提示尚未连接收件箱。完整邮件 OAuth2（#6）及生物认证（#7）尚未实现，issue 保持开放，不能将本次文案修复当作这两项功能已交付。
  - #5 的 Web SSH 指纹恢复再次通过隔离真实 SSH 服务回归，已补充验证结果并关闭 issue。
  性能测量
  同机 Windows、生产桌面构建、独立临时资料目录，三次启动到界面出现文字：优化前 4175 / 2333 / 2364ms，优化后 1699 / 1600 / 1966ms，中位数约减少 28%。样本较少，受操作系统缓存与机器负载影响，不代表其他设备或已安装正式包的保证。
  独立 Node 进程导入邮件模块：优化前 598 / 847 / 817ms，优化后 275 / 251 / 299ms。该数据只说明模块加载开销，不可等同为整机启动收益。桌面入口 JS 从 537.65kB 降为 520.69kB（gzip 168.11 → 162.36kB）；完整安装包体积以正式附件为准。
  下载与边界
  Windows 提供安装、在线安装及便携版；Mac arm64、x64 分别提供 DMG 和 ZIP。Mac 未签名、未公证；自动化打包校验不代表 Mac 全系列设备实机验收。
  Web 使用相同源码的版本镜像并保留资料卷。公开镜像更新不会自动重启自托管实例。Web 的浏览器与服务器风险提示继续保留，敏感资产建议优先使用桌面端。
  正式公开前须通过三平台打包和完整附件校验；公开后核验全部下载摘要、应用更新清单、Web 多架构镜像与 Pages 下载入口。
  本地验证
  - 完整测试 1,253 项 JavaScript、113 项 TypeScript 通过，无失败或跳过；其中新增 SMTP 延迟加载期间锁库取消、首次请求附件和随后读取正文、锁库后迟到的解析不得重新填充缓存的回归。
  - 类型检查、国际化检查通过；lint 0 错误、22 条既有警告。
  - 真实 Electron 生产界面验证：首页不解析终端模块，第一次打开加载、切换页面保留同一终端实例，控制台无异常。该回归加入 Windows CI 与正式发布流程。
  - 邮箱 OAuth 原有 PKCE、会话隔离、一次性回调相关测试通过，不代表已新增真实邮件 OAuth 或完成供应商授权测试。
