ReleaseNotes: |-
  知屿 Zhiyu 1.17.1
  这一版回答一个问题：网页版部署到 VPS 之后，别人通过扫描端口或直接输入网址就能碰到登录页，怎么保证安全？已有资料沿用原数据目录，可在应用内更新；网页版镜像为 ghcr.io/songwo/zhiyu-web:1.17.1。
  网页版安全加固
  防线从外到内依次是：
  - 自动 HTTPS：新增 docker-compose.https.yml 和 Caddyfile，设置 ZHIYU_DOMAIN 即可自动申请、续期证书；知屿本身不发布端口，只有 Caddy 的 80 / 443 对外。纯 http 访问时，登录页和「账号安全」页会显示明文传输的提示。
  - 来源限制：设置 ZHIYU_ALLOWED_NETS（IP、网段或 private）后，名单外的连接直接断开、不返回任何内容，端口扫描看不到登录页。写错的条目让服务拒绝启动，而不是默认对所有人开放。使用反向代理时只信任来自本机或私网的一层 X-Forwarded-For 的最后一项；本机进程（容器健康检查）始终放行。
  - 登录限流：每个来源 15 分钟内失败 8 次即拒绝；全站失败越多每次尝试越慢（上限 5 秒），每分钟最多 40 次尝试；限流在进入密码哈希之前检查。未登录时状态接口不再返回版本号和用户名，登录前请求体限制 8 KB、请求头 20 秒内必须发完。
  - 两步验证（TOTP）：「设置 → 个人资料 → 账号安全」扫码开启，登录除了密码还要验证器里的 6 位码。验证码用过的时间窗不能重放；8 个一次性恢复码只显示一次，服务器只保存加盐哈希；种子用服务器密钥加密保存；密码错和验证码错的响应一致。开启、关闭和会话管理都要重新输入登录密码。
  - 登录设备与记录：查看每台登录设备的地址、浏览器和最近活动，可单独或批量退出；会话 7 天无操作自动失效；记录最近 100 条登录、失败、限流和安全设置事件，不记录任何密码。开启「提醒推送」后，新地址登录和反复失败会推送到手机。
  - 响应头与容器：HSTS（HTTPS 下）、Cross-Origin-Resource-Policy、Permissions-Policy、X-Robots-Tag: noindex；compose 里的容器启用 no-new-privileges。
  部署清单、威胁模型和这些措施做不到的事见 WEB.md 的「安全加固」，设计要点见 SECURITY.md「网页版的访问防护」。
  其他
  - 同步设置里新增「看动画」按钮，直接打开配对与同步协议的逐步动画。
  - 修复网页版登录页在已有账号时仍显示「设置口令」「再次输入密码」两项的问题（CSS 的 display 盖掉了 hidden）。
  - 产品主页的使用说明补充了网页版安全设置。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.17.1-setup.exe、便携版 Zhiyu-1.17.1-portable-x64.zip、浏览器插件 Zhiyu-1.17.1-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件本版只同步版本号。
  升级网页版后需要你做的事：默认行为不变（不开两步验证、不限制来源也能照常登录）。要真正守住公网入口，请按 WEB.md 的清单至少做到：用 HTTPS、开启两步验证并保存恢复码，能固定来源时再加上 ZHIYU_ALLOWED_NETS。
  验证
  - 范围说明：安全功能用真实启动的网页版服务器做集成测试（来源白名单、代理头伪造、限流、两步验证的开启 / 重放 / 恢复码 / 关闭、会话撤销、登录记录与推送告警）；界面在 Chromium 里走通了开启两步验证、恢复码、已登录设备与记录、带验证码的登录页和手机宽度。没有在真实 VPS 或真实 Docker 主机上部署验证，docker-compose.https.yml 只通过了 docker compose config 语法检查，Caddy 的自动证书申请没有实际运行，请部署后自行确认。
  - TypeScript、ESLint（0 错误）、i18n 检查通过；1102 项后端与脚本单元测试、112 项前端单元测试通过，其中新增网页版安全测试 18 项（访问来源、TOTP 标准向量、限流、登录记录、代理头、推送告警等）。
  - 桌面与网页构建（desktop:build、build、web:build）通过。
  - 打包程序 node scripts/release-smoke.mjs 检查通过（版本 1.17.1、独立数据目录、首次设置、重启、缩放，无页面错误）。
  - SHA256：Zhiyu-1.17.1-setup.exe ded725f0c5b3baf109e8f593d7bce3d8e98d94ac52226d4112a42ed2886d5ac1；Zhiyu-1.17.1-portable-x64.zip 7e156abc8e2b79f2c908095fb1e8534ec37200a93f34e811daf990358ee7e5f6。
  - 未执行：docs/RELEASING.md 中依赖开发预览的 Electron 集成脚本本版未重跑；macOS 构建未验证；两步验证在真实验证器 App（Google / Microsoft Authenticator）上的扫码未做，测试里用标准向量和同算法生成的验证码代替。
