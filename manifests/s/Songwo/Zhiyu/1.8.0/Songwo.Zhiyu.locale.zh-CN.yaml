ReleaseNotes: |-
  知屿 Zhiyu 1.8.0
  新增费用与续费管理和应用内加密备份。已有资料沿用原数据目录，可在应用内更新。
  费用与续费
  - 左侧导航「工作台」新增「费用与续费」。「到期时间线」按日期列出未来 30 或 90 天到期的资产，以及近 30 天已过期的资产，可导出为日历。
  - 「费用概览」把年付按 12 个月摊到每月、月付乘 12 计入全年；一次性费用单独列出，不计入月度和年度支出。人民币与美元分开合计；填写「1 USD = ? CNY」后再统一换算。
  - 编辑服务器、域名、服务资产和号码时可以填写费用：金额、币种（CNY／USD）和周期（每月／每年／一次性）。金额留空表示不记录。服务器（VPS）和服务资产新增可选的到期日。
  - AI 订阅沿用已有的美元月费；接口未提供月费的订阅不计为 0。
  - 服务器和服务资产的到期日与其他资产一样进入托盘提醒和日历导出。资产总览的「AI 月度订阅」卡片改为「每月支出」，并显示 30 天内到期的数量。
  - 旧资料没有费用字段时保持未填写；导入的数据中不合法的费用会被忽略，不会导致整条资产丢失。
  加密备份与恢复
  - 「设置 → 数据」新增「创建加密备份」，无需先退出程序。软件先等待正在进行的保存完成，再把资产、文档、密钥库、个人资料、偏好设置、对话、知识库、用量记录、邮箱基线及云服务与探针配置打包成一个 .zhiyu-backup 文件。备份密码为 10 至 256 位，使用 scrypt 派生密钥、AES-256-GCM 加密；文件内容和清单都在密文中，没有密码无法预览。
  - 可选勾选「同时包含系统保护的凭据」：模型 API Key、云服务与探针连接、图床密钥和 Linux.do 主身份会在本机解密后用备份密码加密放入备份，恢复到新电脑时再交给新系统加密，换电脑后无需重新填写。勾选此项需要先解锁密钥库。
  - 「从备份恢复」先输入密码并预览备份的创建时间、版本、资产、文档和凭据数量。密码错误与文件损坏分别提示，都不会改动当前资料。确认后自动重启，在读取任何资料之前完成替换；原资料整体移到 restore-snapshots 中，保留最近 5 份，可随时找回。
  - 「自动备份」可选择资料目录之外的文件夹，按每天、每 3 天或每周写入，保留最近几份，只清理自己生成的旧备份。自动备份密码由系统加密保存在本机；自动备份不包含系统保护的凭据。
  - 备份中的密钥库仍由创建备份时的主密码保护。请同时记住备份密码和当时的主密码，两者都无法找回。详见 使用教程 · 备份与恢复。
  其他修复
  - 修复网页预览中资产总览「每日活动」偶发的 hydration 不一致；CI 新增对应检查。
  - Windows 正式版流水线新增加密备份的桌面回归测试。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.8.0-setup.exe、便携版 Zhiyu-1.8.0-portable-x64.zip、浏览器插件 Zhiyu-1.8.0-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
  本机验证：类型检查、中英文文案检查和 ESLint（0 错误）通过；单元测试全部通过，无失败。基于合并后代码的打包程序运行 16 项桌面集成测试全部通过，包括加密备份往返恢复与自动备份、存储清理和发布冒烟测试；合并后的 main 分支 CI 与 macOS 打包检查通过。真实换机恢复（另一台电脑、另一个 Windows 账户）尚未实机验证。
