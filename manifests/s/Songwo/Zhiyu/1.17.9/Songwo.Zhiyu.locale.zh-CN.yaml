ReleaseNotes: |-
  知屿 Zhiyu 1.17.9
  本次以资产关联为核心，补齐号码、节点和文档的通用关系，改善保存可靠性，并同步提供可调节的界面动效。
  通用资源关联
  - 修复手机号只能选择 AI 订阅、无法直接关联阿里云等服务器的问题；手机号现在可关联域名、邮箱、账号、证书、服务、支付卡、eSIM、自定义资产、节点、文档和其他号码。
  - 两篇文档可以直接关联；节点使用服务器与节点的组合标识，避免不同主机同名节点串线。
  - 详情、号码编辑、文档信息、节点管理、关系图和批量整理共用规则。支持双向查看、跳转、解除、反向去重及删除清理。
  - 保留旧号码订阅与文档绑定。备份、恢复和同步保留新连线；关联只表示用户保存的联系，不自动推断登录依赖。
  保存与文档保护
  - 关联保存等待存储实际应答，失败保留草稿、显示错误并支持重试，避免提前提示成功。
  - 文档绑定仅更新元信息，与正文保存共用队列；正文自动保存保留最新绑定，已删除文档不会被旧草稿复活。旧接口无法安全修改绑定时明确要求升级。
  - AI 关联建议确认前不写入；号码、节点引用使用正确跳转。节点另列资源统计，不重复计入核心资产的费用或异常。
  - 修复号码长表单滚动时标题和保存栏偏移，桌面与手机只滚动字段区。
  桌面与 Web 动效
  - 外观设置增加完整、轻量、关闭三档及本地动效预览；页面、侧栏、详情、编辑弹窗和任务步骤共用 Motion。
  - 系统减少动态效果实时生效，偏好只保存在当前设备；预览不读取私人资产，不调用收费服务。
  - 修复嵌套弹窗 Esc 穿透和关闭后的键盘焦点恢复。
  下载与升级
  Windows 提供安装包、在线安装器和便携 ZIP。macOS Apple Silicon 提供 mac-arm64.dmg、mac-arm64.zip；Intel 提供 mac-x64.dmg、mac-x64.zip。Mac 未签名、未公证，构建及包结构检查不代表所有设备和 macOS 版本均经过实机测试。
  先保存正在编辑的文档并创建加密备份。跨端使用新增关系时，请将所有相关设备升级至 1.17.9，旧版本不保证识别新类型连线。Windows 安装版可后台下载，安装仍需用户确认；便携版更新程序时保留 data。Web 更新同版本镜像并保留资料卷；镜像发布不会自动重启用户的自托管实例。Web 继续提示浏览器与服务器风险，敏感资产建议优先使用桌面端。
  验证范围
  规则及真实 HTTP 测试覆盖 23 个合成资源的 253 种两两组合，检查双向去重、解除、删除、兼容、同步合并及加密备份恢复；AI 关联建议同样覆盖组合。界面验收覆盖号码关联其余 22 个资源、刷新/重启保留、服务器反向解除、文档绑定和正文不变、拖线实际落盘、删除清理、保存故障重试及手机布局。组合测试不等于每种组合都经过手工界面验收。
  所有验证使用隔离资料和合成供应商，不读取用户真实资产，也不将模拟服务验证写成真实账号、云存储或付费 API 验收。发布流水线强制等待 Windows 与 Mac 两架构的构建、测试和包结构检查，再汇总完整附件与更新清单后公开，随后发布 Web 多架构镜像与产品主页。
  发版前本地全量测试为 1,247 项 JavaScript 与 113 项 TypeScript，全部通过且无跳过；类型检查、国际化和三端构建通过。从待发布源码单独执行 lint 为 0 错误、22 条既有警告，未包含独立视频工程。长号码表单布局在旧产物先复现失败，修复后的桌面、390px 手机视口均通过。复核还恢复了既有保存调用的错误传播，邮件头像写入失败会保留编辑器并撤回未落盘更新，真实界面回归通过。
