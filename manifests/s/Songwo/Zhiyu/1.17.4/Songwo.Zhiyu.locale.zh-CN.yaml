ReleaseNotes: |-
  知屿 Zhiyu 1.17.4
  新增支付卡与 eSIM、银行与常用服务内置图标，补充文档编辑工具并修复长文滚动与保存问题；左侧导航默认按分组收起，桌面增加 Exa 检索与 Jev 原文提示。
  卡片与资产闭环
  - 支付卡支持国内常见银行的离线号段辅助识别、手动修正、自定义发行方与卡组织，按中国大陆、港澳台、海外等地域筛选。号段不能证明真实持卡、余额、有效期或虚拟/实体形态。
  - 居中的 3D 卡片支持正反翻转、发行方配色纹理与内置图标，尾号完整显示；完整卡号与其他私人资料单独保存在密钥库，解锁后按需显示和复制，失焦、锁库与翻回正面会隐藏。
  - eSIM 独立管理套餐到期与保号期限，关联账号、服务器、服务和文档，沿用已有提醒、备份及同步结构。
  - 删除服务器等资产需逐字输入完整名称；删除卡片需要解锁并清理对应加密资料，文档保留。
  文档与界面
  - 补充正文与三级标题、下划线、删除线、行内代码、分隔线、清除格式、移除链接等工具。
  - 修复长 Markdown 输入时高度测量导致阅读视口位移，宽度变化后重新计算高度；延迟自动聚焦尊重用户已经选择的正文位置。
  - 修复快速重新进入编辑后，全选模型和浏览器选区不同步导致清除格式失效的问题；全选快捷键会同步恢复可见选区。
  - 修复粘贴邮箱、电话等非网页链接后保存被拒的问题：保留文字，HTTP/HTTPS 链接继续保留；保存层安全规则不放宽。
  - 左侧四组导航默认收起，点击或键盘展开并保存选择，当前入口始终可见；整栏图标模式保留全部入口。移动抽屉背景不再透出正文。
  - 编辑器、详情和设置按需加载，桌面包只保留 en-US、zh-CN、zh-TW 语言资源。
  联网检索与原文提示
  - Exa 依赖维护者部署的登录/检索服务，每个稳定 Linux.do 身份一次性赠送 50 次。免费与已购余额、购买和消耗记录分别展示，失败与取消不扣次数，HTTP 轮询逐项展示真实处理状态。
  - 积分购买需要另行配置 LDC 商户，并核实 Exa 预算。无法读取新鲜可信余额、预算不足或服务未配置时禁止创建订单；Connect 登录不代表已经开启积分支付，也不提供静默扣积分权限。
  - Jev 对用户明确授权的当前段落调用 TypeSafe 分类接口，只在原文临时标记，不生成新文档；支持显示样式、颜色、阈值与阅读排版，配置使用用户自己的 Key。
  - Web 共享卡片、eSIM、图标和编辑器改动，继续使用顶部导航；Exa/Linux.do 购买流程和 Jev 本次仅提供桌面能力，网页尚未接入。详见 联网检索与原文提示。
  登录恢复与结果页
  - 回调页使用知屿品牌、明暗主题与手机布局，区分验证成功和未完成。验证成功后仍需回应用核对并确认绑定，不自动绑定身份。
  - 提供“关闭此页”，浏览器不允许关闭时提示手动关闭；显示后移除地址栏中的 code/state，不加载第三方资源。
  - 浏览器遇到 Invalid state 时可重新发起授权，生成新的 state、PKCE 和回调监听，保留已有身份与资产。官方站点的验证循环或临时不可用无法由客户端绕过。
  验证与边界
  - 全量测试 1,284 项通过（1,172 个 JavaScript + 112 个 TypeScript），0 失败、0 跳过。类型检查、国际化检查通过，Lint 为 0 错误及 24 条既有警告。
  - 桌面离线包、自托管 Web 与 Grok SSR 构建通过；自托管 Web 的首次设置、登录、跨设备资料、推送配置、失效分块恢复和退出回归通过。
  - 17 组实际程序发布回归通过，包括卡片、原文提示、编辑器、导航、工作区、Agent、密码、身份、用量、订阅、图标、安装目录、自启和更新引擎。另完成 11 组源码交互、10 组网页界面回归及真实浏览器扩展交互。
  - 登录结果页在真实浏览器验证明暗主题、390px 布局、查询参数清理、CSP 和关闭受限提示；原生终端完整本机 SSH、物理键盘、托盘保活、恢复与锁库清理回归通过。
  - 在线安装器 26 项检查通过；同版离线包的长度、SHA256、更新清单 SHA512 与文件大小已一致性核对。正式流水线额外在一次性 Windows runner 检查完整安装与卸载，不在维护者日常目录试装。
  - 维护者已完成真实 Linux.do 登录，公网检索服务已升级并用真实 Exa Key 返回结果；端到端验证消耗 1 次免费检索，余额 49 次，进度、结果和账本一致。没有进行真实社区积分交易，当前 LDC 商户与可信余额来源未配置，积分购买关闭。
  - TypeSafe 仍以本机 HTTP 合成供应商验证协议、系统密钥存储、逐段进度及原文标记；没有宣称真实 TypeSafe Key 验收。未配置生产数据库，Grok 的独立数据库迁移分支明确跳过；不把本机构建描述为生产数据库迁移完成。
  Windows 继续提供离线安装包、在线安装器、便携版、扩展 ZIP、更新清单、差分信息和 SHA256 校验文件。在线安装器固定同版离线包的地址、长度与摘要。当前未配置 Authenticode 证书。
