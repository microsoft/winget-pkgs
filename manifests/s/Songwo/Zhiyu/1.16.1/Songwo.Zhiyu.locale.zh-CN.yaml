ReleaseNotes: |-
  知屿 Zhiyu 1.16.1
  修复网页版升级后旧页面报错的问题。桌面版没有功能变化，应用内更新只同步版本号；已有资料沿用原数据目录。
  网页版升级后旧页面自动恢复
  - 网页版的部分页面按需加载。换了新镜像（docker compose pull && docker compose up -d）后，服务器上只剩新版本的页面文件，已经打开的标签页再进入这些页面时会取不到旧文件，页面显示出错，「重试」也无效。
  - 现在遇到这种情况会自动刷新一次，载入新版本；刷新后会回到总览页。
  - 30 秒内再次失败时不再循环刷新，改为显示「知屿已更新」和「刷新页面」按钮。
  检查
  - CI 的网页版端到端检查改按 1.16.0 的顶部导航操作（原脚本仍在找旧侧栏的按钮，导致 1.16.0 提交后 CI 失败），并新增覆盖：网页版不再有侧栏、主机监控页能打开、页面文件缺失后自动刷新。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.16.1-setup.exe、便携版 Zhiyu-1.16.1-portable-x64.zip、浏览器插件 Zhiyu-1.16.1-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。网页版镜像为 ghcr.io/songwo/zhiyu-web:1.16.1。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
  验证
  - TypeScript、ESLint（0 错误）、i18n 检查通过；1016 项后端与脚本单元测试、105 项前端单元测试通过；build、web:build、desktop:build 通过。
  - node scripts/web-selfhost-integration.mjs 在本机通过；另用 Playwright 拦截一个按需加载的页面文件，确认第一次失败时自动刷新、30 秒内再次失败时显示「知屿已更新」。网页版各页面与设置分页逐个打开，无报错。
  - 安装包由 Windows 正式版流水线构建，并在打包程序上运行集成检查；SHA256 见 Release 附件中的 SHA256SUMS.txt。
