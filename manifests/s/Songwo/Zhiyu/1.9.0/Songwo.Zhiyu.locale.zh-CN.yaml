ReleaseNotes: |-
  知屿 Zhiyu 1.9.0
  全新标志，资产详情与系统设置改为页面内打开，新增续费日历，表格与用量图表重新设计。已有资料沿用原数据目录，可在应用内更新。
  全新标志
  - 新标记是一本摊开的书像浮在海面的小岛，右上方一轮朝阳，前面一道海浪——「知」是书页，「屿」是海上的岛。
  - 标记为透明背景，书页蓝、朝阳橙、海浪青在浅色、深色背景和 Windows 任务栏上都能看清。应用侧栏、安装图标、任务栏、网站图标和浏览器插件统一更换，均由 src/lib/brand-mark.mjs 同一份矢量生成。
  资产详情与系统设置改为页面
  - 点击资产卡片、表格行、关系图节点或搜索结果，详情在主内容区打开，不再浮在列表上。左列是资产本身与监控指标，右列是关联资产、文档和凭据位置；服务器详情保留监控概览、自建节点、服务文档、绑定密钥、运维工具和 SFTP 分页。
  - 标题栏面包屑显示「知屿 › 服务器 › 资产名」，点上一级回到列表。顶部「返回」、标题栏后退、Alt+←、鼠标侧键和 Esc 都回到原列表，筛选条件和滚动位置保持不变。
  - 头像菜单中的「系统设置…」和「个人资料」改为页面打开，左侧分组导航吸顶；右上角的设置按钮和 Ctrl+, 仍打开弹窗，所有分页使用同一尺寸（与「云服务与探针」一致），切换时窗口不再跳动。
  费用与续费：续费日历
  - 新增月视图日历，周一开头。每天列出到期的资产，按服务器、域名、证书、AI、服务资产和号码分别配色；月付、年付的资产按周期向后推算之后的续费日，以空心标记区分。
  - 点任一天，右侧列出当天要处理的事项，点击进入资产详情；切换月份时日历从切换方向滑入，「今天」按钮一键回到本月。
  - 日历标题显示本月续费项数与合计金额，人民币和美元分开合计。到期时间线与 ICS 导出保持不变。
  表格视图与用量记录
  - 表格视图改为一张白卡，去掉整宽硬线和工具栏底线；行悬停是左右对称的圆角浅底，排序列高亮，行依次淡入。到期时间线的月份标题去掉灰底条，行同样改为圆角。
  - 用量图表按指标配色：本机 Token 紫、API 绿、流量橙、订阅额度玫红。柱子带渐变并依次长出，悬停时其余柱子退后；构成图每项一种颜色。顶部摘要卡片带该类颜色的图标与柔光。
  - 「订阅与来源」的来源卡片重新设计：类型图标、连接状态胶囊、失败原因提示，额度与流量行带细进度条。
  - 修复：订阅账号第一次查询额度就失败时，失败原因被静默丢弃，用量页只剩一张没有说明的空图表。现在会建立该账号的来源并显示原因（例如套餐不提供额度查询）；额度图表为空时提示到「订阅与来源」查看。
  界面尺寸与细节
  - 默认窗口改为 1280×800（最小 960×620），页面标题、头图大字和统计数字同步收小，正文字号不变。
  - 收起的侧栏：选中高亮块与图标居中对齐，隐藏滚动条；入口放不下时在可滚动的一侧渐隐，提示还有更多。
  - 修复侧栏头像缺少替代文字。
  仓库与主页
  - 产品主页按新界面重做，加入 90 秒宣传片、资产详情、续费日历、用量、文档、表格与密钥库截图，并提供便携版直链。
  - README 换用新标志与截图墙；历史计划、验证记录移入 docs/archive/，新增 docs/README.md 文档索引；只改文档或主页时不再触发完整 CI 和 macOS 打包检查。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.9.0-setup.exe、便携版 Zhiyu-1.9.0-portable-x64.zip、浏览器插件 Zhiyu-1.9.0-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件同步版本号与新图标。
  验证
  - TypeScript、ESLint、i18n、977 项后端与脚本单元测试和 94 项前端单元测试通过。
  - 浏览器与桌面集成测试覆盖资产详情页、系统设置页、续费日历、表格视图、用量图表与侧栏；打包程序通过版本与图标检查。
  - 已知：usage-charts、usage-insights、relations-usage-ui 三项集成测试的断言写于旧的筛选行为，在 1.8.0 上同样失败，与本版改动无关，后续单独更新。
