ReleaseNotes: |-
  知屿 Zhiyu 1.7.1
  加固本地主密码库、系统加密存储与桌面权限，并将服务器历史指标图表改为按需加载；已有资料沿用原数据目录。
  主密码与旧库兼容
  - 新建密钥库和修改主密码要求 10 至 256 位，主进程与界面共同校验。已有 6 位主密码仍可解锁旧库，无需重建或清空资料。
  - 新库使用 v2 格式，记录 scrypt 参数 N=2^17、r=8、p=1。旧 v1 库仍按原参数 N=2^15、r=8、p=1 解锁，普通读写保持原格式，修改主密码后才升级。
  - 密钥库中的派生参数必须通过类型、范围、内存与运算量检查；不接受非法参数后自动回退到旧参数的处理。
  - 应用运行期间恢复外部备份后，下一次读取会核对文件和解密密钥；密钥不匹配时锁定旧会话，清除界面已显示的凭据并撤销浏览器会话。写入前再次检查本次读取的文件快照，期间文件变化则取消操作，避免旧缓存覆盖恢复的内容。
  - Windows 暂时拒绝替换密钥库文件时，会进行次数有限的重试。等待期间若锁库、恢复了备份或保存条件失效，仍取消提交；持续的权限错误不会被忽略。
  备份与恢复仍应先退出应用，再复制完整数据目录；修改主密码前保留备份。新库与改密升级后的库使用新参数，不能依赖旧版程序读取。具体边界见 安全与备份。
  桌面安全与性能
  - 操作系统安全存储不可用或退化为 basic_text 时，拒绝保存模型 API Key，并显示明确错误。
  - OAuth 客户端 JSON 限制为 256 KB，通过同一个文件句柄检查类型并有界读取，防止检查后文件增长造成无界读取；客户端字段校验类型，失败提示不回显可能包含密钥的 JSON 片段。此限制针对 OAuth 客户端配置，不是资产 JSON 导入。
  - 桌面渲染器权限仅放行所需的剪贴板读取与写入，拒绝其他权限；内容安全策略限制脚本、连接、嵌入对象与表单提交。
  - 修复 Windows 文件标识超过安全整数范围时，本机用量目录被安全检查误判的问题。路径和打开句柄使用精确整数校验，日志断点保留原有标识格式，避免升级后重复计入已有 Token。
  - 服务器历史指标图表独立加载，仅展开相关详情时加载图表模块及 recharts。与已发布 1.7.0 安装包对比，首屏预加载 JavaScript 从约 1.51 MB 降至 1.14 MB，减少 24.7%（未压缩大小，实际网络传输大小取决于压缩）。
  升级与发行
  发布前完整测试通过 957 项（864 项 Node、93 项 TypeScript），无失败、取消或跳过；类型检查、中英文文案检查通过，ESLint 为 0 错误、19 条既有警告。网页与桌面构建通过。正式桌面包另验证锁库后的凭据清理、OAuth 文件导入、权限与 CSP、旧缓存迁移及用量图表；使用 1.7.0 安装包中的真实实现生成隔离旧库，验证六位旧密码、普通写入保留 v1、改密升级及重启后记录完整。
  验证中定位到 Windows 文件替换操作偶发返回 EPERM，同一文件在短暂等待后可以替换。本版为此增加有界重试及回归测试，覆盖恢复成功、等待时锁库/恢复备份、提交条件失效、永久拒绝替换；没有修改或放宽原测试断言。
  本版只调整安全、兼容与加载行为。安装包、应用内版本、教程和浏览器插件版本同步为 1.7.1；浏览器插件仅同步版本号。
  Windows 附件使用 Zhiyu-1.7.1-setup.exe 与 Zhiyu-1.7.1-browser-extension.zip，应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。下载页从已发布的正式 Release 读取版本与附件信息，不将未发布构建显示为正式版。
  macOS 目标为独立的 mac-test-1.7.1.1 测试版，发布后提供 Apple Silicon / Intel 对应附件。测试包未签名、未公证；既有 1.6.0 单台设备反馈不代表本版已经通过实机验证。
