ReleaseNotes: |-
  知屿 Zhiyu 1.16.0
  这一版回应网页版的两条反馈：「网页版部署在 VPS 上，应该能看到这台 VPS 的用量」，以及「网页端页面很大，不要和桌面版用同一套侧栏布局」。网页版换成单独设计的顶部导航与仪表盘首页，新增主机监控；原来显示「仅桌面版可用」的功能大多改由服务器完成。桌面版的界面与功能不变，已有资料沿用原数据目录，可在应用内更新。
  网页版新布局
  - 顶部悬浮导航条取代左侧栏：总览、主机监控、服务器、域名、续费、文档、AI 助手常驻，其余页面收进「更多」面板，按分组排列并显示待处理数量；右侧是搜索、新建、主题、密钥库锁和账号菜单。
  - 首页改为宽屏仪表盘：上方四张卡片显示这台服务器的 CPU、内存、磁盘、网络与迷你曲线，下面是资产统计，左栏待处理事项、服务器与快速开始，右栏近期续费与每日活动。内容区放宽到 1440 像素。
  - 窄屏时导航收进整屏菜单，底部有「总览 / 主机 / 服务器 / 文档 / 全部」快捷栏。
  主机监控（网页版）
  - 显示部署知屿的机器的 CPU（含 I/O 等待与 steal）、内存与交换、磁盘、1 / 5 / 15 分钟负载、网络与磁盘读写速率、运行时长、占用最多的进程（可按 CPU 或内存排序）、网卡累计流量、容器的内存与 CPU 配额，以及知屿服务自身的内存占用。
  - 每 5 秒刷新，服务器在后台持续采样，打开页面就能看到最近一小时的曲线；曲线悬停显示时间与数值。
  - 只读取 Linux 的 /proc 与 cgroup，不执行任何命令；接口需要登录。
  - 页面顶部说明当前是哪种视角。在 Docker 里默认的 docker-compose.yml 已只读挂载 /proc:/host/proc 与 /etc/os-release，网络与进程换成整台 VPS 的；不挂载时网卡与进程只有容器自己。/etc/hostname 的挂载默认注释掉，避免宿主机没有该文件时被 Docker 建成空目录。完整对照表见 网页版部署说明。
  桌面版功能搬上网页
  服务器按桌面版同名的接口提供这些功能（白名单，需要登录）：
  - SSH 终端与 SFTP 文件浏览、下载；主机探测、指标历史与按周期自动采集。SSH 凭据在浏览器里用主密码解密后随连接发送，服务器用完即丢、不保存；不支持 SSH agent 与服务器上的私钥文件。主机指纹记录在服务器上。
  - 域名与证书检查、自建节点 TCP 检测。
  - Cloudflare 直连（导入域名、同步、DNS 管理）与知屿探针。
  - AI 助手与知识库（知识文档在浏览器里选文件上传；网页版不能代为检查邮箱）。
  - 用量记录：机场订阅与 API 用量来源由服务器每 5 分钟刷新，浏览器关着也会；「本机」AI 客户端用量指服务所在的机器。
  - 邮箱收信、阅读、标记已读、发信、附件与草稿。登录名与授权码在浏览器里解密后随请求发送、不保存。
  - 图床上传、个人资料（名字与头像）。
  Cloudflare Token、模型 API Key、用量来源凭据、图床 Key 与邮件草稿用服务器密钥 server/secure.key 加密保存，这个密钥不进入备份。把桌面版备份恢复到网页版时，桌面版用系统钥匙串加密的凭据解不开，需要在网页版重新填写一次；备份时包含了系统加密凭据的，恢复时会改用服务器密钥重新加密。
  其他
  - 二次验证码（TOTP）改用纯 JavaScript 实现，桌面版与网页版共用；网页版在浏览器里生成，种子不经过服务器。
  - 网页版「设置 → 个人资料」新增网页登录账号：显示当前用户、修改登录密码（其他设备随后需要重新登录）、退出登录。
  - 网页版「关于知屿」由服务器查询 GitHub 上的最新版本，并给出 docker compose pull && docker compose up -d 升级命令；「数据」显示服务器资料目录，「存储」显示服务器上各资料文件的大小。
  - 仍只在桌面版的功能在网页版写明了原因：浏览器插件配对、浏览器密码 CSV 迁移、AI 账号与邮箱的 OAuth 网页登录、新邮件推送、v2rayN 本机流量、系统托盘与系统通知。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.16.0-setup.exe、便携版 Zhiyu-1.16.0-portable-x64.zip、浏览器插件 Zhiyu-1.16.0-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。网页版镜像为 ghcr.io/songwo/zhiyu-web:1.16.0，升级后建议重新下载 docker-compose.yml（或手动加上主机监控的只读挂载）。安装包与便携版均未做代码签名，请核对 SHA256。桌面版界面与功能不变（二次验证码改为与网页版共用的实现，生成结果相同）；浏览器插件本版只同步版本号。
  验证
  - 范围说明：主机监控在 Windows 开发机上用伪造的 Linux /proc 与 cgroup 验证（采样、速率、进程、容器配额、宿主机 / 容器视角），没有在真实 Linux 容器里运行；挂载 /proc 后能否读到宿主机网卡取决于宿主机设置，读不到时退回容器网卡。SSH、邮箱、Cloudflare、模型调用在网页版只验证了登录保护、白名单与凭据检查，没有连接真实主机、真实邮箱或真实账号；真实使用结果由使用者自行确认。
  - TypeScript、ESLint（0 错误）、i18n 检查通过；1016 项后端与脚本单元测试、105 项前端单元测试通过。新增覆盖：/proc 解析、两次采样的速率与 CPU、容器与宿主机视角、非 Linux 时的说明；RPC 白名单、未登录拒绝、个人资料保存、SSH 凭据只接受密码或私钥正文、事件流需要登录并推送变更。
  - 网页构建（web:build）与 web:start 通过；Playwright 截图检查桌面 1440×900 与手机 390×844 的仪表盘、主机监控（浅色与深色），无控制台错误、无横向滚动。逐个检查了网页版各设置分页、终端页与个人资料保存。桌面渲染层预览确认侧栏与标题栏不变。
  - 打包程序 node scripts/release-smoke.mjs 与 SHA256：打包后补齐。
