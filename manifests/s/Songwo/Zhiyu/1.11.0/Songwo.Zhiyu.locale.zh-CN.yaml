ReleaseNotes: |-
  知屿 Zhiyu 1.11.0
  AI 助手从「回答问题」变成「把事情办完」：每个回答都给出可点的下一步，发现缺失的费用、到期日或运维文档时直接生成可审阅的修改；续费页和资产详情也能一键交给 AI，或直接标记已续费。已有资料沿用原数据目录，可在应用内更新。
  AI 助手：下一步与完整闭环
  - 回答下方新增「下一步」：2 至 4 个按钮，可继续追问（直接发送），或打开续费日历、某个页面、某项资产。按钮与回答在同一轮生成，不额外增加模型请求；目标资产和页面会先在本机校验，不存在的会被丢弃。
  - 新增「建议修改资产」：补齐服务器、域名、服务资产的费用与到期日，AI 订阅的续费日与月费，以及各类资产的标签和备注。与其他修改建议一样，显示修改前后对比，由你确认后才写入；资料在审阅期间变化时拒绝应用。
  - 新增「建议新建文档」：按资料起草运维手册、巡检清单或续费计划，可同时关联最多 10 项资产，不确定的步骤以待办标出；不会写入密码、密钥或令牌。
  - 新增「续费与费用」工具：读取未来 N 天（最多 400 天）的到期日、按月付年付推算的续费、近 30 天已过期项、按币种合计的应付金额与每月支出，作为可引用的来源。
  - 提示词要求发现问题时直接生成对应建议；没有勾选「本次生成修改建议」时，会在回答下方请求本次授权，点一下按原问题继续。
  - 应用建议后，卡片上可直接「打开文档」或「查看资产」核对结果。
  - 首屏改为「巡检与处理 / 续费与费用 / 资料整理」三组提问，数字取自当前资料（例如需要留意的资产数、30 天内续费数、缺少费用的资产数）；需要修改的提问会自动勾选「本次生成修改建议」。内置能力新增「补齐费用与到期日」「起草运维文档」「规划续费」。
  其他页面直达 AI 与续费闭环
  - 「费用与续费」的到期时间线、续费日历当天列表和首页「近期续费」新增「已续费」：续费完成后点一下，到期日按月付或年付顺延一期，日历、提醒与支出同步更新；提示里可以撤销，操作记入每日活动。只对实际记录的到期日显示，按周期推算的日期、一次性费用和网页授权同步的 AI 订阅不显示。
  - 到期时间线新增「让 AI 规划」：按当前 30 / 90 天范围询问续费顺序、合计金额和缺少费用的资产。
  - 资产详情新增「问 AI」：带上资产名询问状态、关联、到期情况与下一步。
  - 首页「待处理事项」新增「让 AI 逐项分析」。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.11.0-setup.exe、便携版 Zhiyu-1.11.0-portable-x64.zip、浏览器插件 Zhiyu-1.11.0-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
  验证
  - TypeScript、ESLint、i18n、983 项后端与脚本单元测试和 103 项前端单元测试通过；新增下一步校验、续费工具、资产修改与新建文档建议、到期日顺延的测试。
  - 浏览器集成测试覆盖助手输入区、授权、修改建议、工作流、首页 hydration、文档与服务资产页；桌面集成测试覆盖助手工具与文档权限。另用合成桥接检查了首屏分组提问、下一步按钮、应用后跳转，以及「已续费」顺延与撤销。
  - 已知：agent-workspace 的桌面输入区贴底断言（底部 8px 间距）以及 usage-charts、usage-insights、relations-usage-ui、mail-push、probe-desktop 在 1.10.0 上同样失败，与本版改动无关。
