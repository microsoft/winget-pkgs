ReleaseNotes: |-
  知屿 Zhiyu 1.16.2
  修复 1.16.0 与 1.16.1 桌面版安装后无法启动的问题。网页版不受影响，镜像只同步版本号。
  修复桌面版启动报错
  - 现象：安装 1.16.0 或 1.16.1 后启动，弹出「A JavaScript error occurred in the main process」，提示 Cannot find package '@noble/hashes'，程序无法打开。
  - 原因：1.16.0 起二次验证码改用 @noble/hashes 生成（桌面版与网页版共用），但桌面安装包只安装固定清单里的主进程依赖，漏了这个包。发布流水线在仓库目录里启动打包程序，Node 沿上级目录找到了仓库自己的依赖，所以检查没有发现。
  - 处理：打包清单加入 @noble/hashes；打包前扫描主进程实际引用的每个第三方包，不在清单里就停止打包；新增单元测试核对两者一致。
  - 升级：已经装了 1.16.0 / 1.16.1 的电脑无法启动，也就用不了应用内更新，请从 Release 下载 Zhiyu-1.16.2-setup.exe 直接覆盖安装（或换用便携版）。资料目录不受影响，密钥库照常用原主密码解锁。
  升级与发行
  Windows 附件为安装包 Zhiyu-1.16.2-setup.exe、便携版 Zhiyu-1.16.2-portable-x64.zip、浏览器插件 Zhiyu-1.16.2-browser-extension.zip 与 SHA256SUMS.txt；应用内更新沿用同次构建的 latest.yml 和 .exe.blockmap。网页版镜像为 ghcr.io/songwo/zhiyu-web:1.16.2。安装包与便携版均未做代码签名，请核对 SHA256。浏览器插件仅同步版本号。
  验证
  - 本机打包（desktop:pack）后确认 app.asar 内含 node_modules/@noble/hashes，并把打包程序复制到仓库以外的目录，用 node scripts/release-smoke.mjs 启动检查通过（独立数据目录、首次设置、重启、缩放，无页面错误）。
  - TypeScript、ESLint（0 错误）通过；1017 项后端与脚本单元测试（含新增的打包清单核对）、105 项前端单元测试通过。
  - 安装包由 Windows 正式版流水线构建，并在打包程序上运行集成检查；SHA256 见 Release 附件中的 SHA256SUMS.txt。
