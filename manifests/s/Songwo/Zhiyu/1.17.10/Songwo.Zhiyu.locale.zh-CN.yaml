ReleaseNotes: |-
  知屿 Zhiyu 1.17.10
  本次修复桌面与 Web 工作区的大面积留白、右侧栏居中和宽屏卡片排列问题，让各导航页充分使用窗口空间。
  布局修复
  - 移除主内容与右侧概览共同受限的居中容器，服务器、域名等列表使用全部可用区域，仅保留必要内边距。
  - 右侧概览贴右，宽度在 264–320px 间自适应；扣除主导航后的实际空间不足时隐藏，不预留空列。展开导航、缩小窗口和调整界面缩放均使用同一规则。
  - 资产卡片按最小宽度自动排列，不再固定最多三列；窄屏保持单列，避免横向溢出。
  - AI 上下文栏随实际工作区宽度收起；文档目录、设置分类与日历侧栏保留面板边界，文档正文和对话内容继续保持阅读行宽。
  - 桌面与 Web 同步采用这套布局，详细约定见工作区与侧栏布局。
  下载与升级
  Windows 提供安装包、在线安装器和便携 ZIP；macOS Apple Silicon 与 Intel 均提供 DMG 和 ZIP。Mac 未签名、未公证，包结构和架构校验不代表所有 Mac 设备及系统版本均经过实机验收。
  升级前保存正在编辑的文档并创建加密备份。Windows 安装版可后台下载，安装仍需用户确认；便携版保留资料目录。Web 使用同版本镜像并保留资料卷，镜像发布不会自动重启用户的自托管实例。Web 的浏览器与服务器风险提醒继续保留，敏感资产建议优先使用桌面端。
  验证范围
  布局回归先在旧产物复现 2048px 窗口两侧各 310px 空列，修复后通过 216 个场景，覆盖全部导航、详情与设置、2048/1440/1024/390px、主导航展开与收起及 125%/150% 缩放。检查外侧边距、右栏位置与宽度、内部侧栏边界及横向溢出；另行通过长文档滚动与 Web AI 底部操作区回归。
  发版前重新执行本地完整测试：1,249 项 JavaScript、113 项 TypeScript 全部通过，无跳过。类型检查、国际化与三端构建通过，lint 为 0 错误、22 条既有警告。新版本生产产物再次通过 134 个桌面、82 个 Web 布局场景；桌面与手机渲染无控制台错误和横向溢出。
  验证使用隔离资料与合成资产，不读取真实资产或连接私人服务器。正式发布流程在 Windows、Mac 双架构构建、测试、应用结构及完整附件校验通过后才公开，再同步 Web 多架构镜像和产品下载页。
