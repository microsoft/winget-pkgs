ReleaseNotes: |-
  知屿 Zhiyu 1.17.2
  新增 Windows 原生在线安装器：沿用知屿蓝白界面与安装动效，由小型引导器下载完整程序，校验通过后安装。完整程序的体积没有缩减；继续提供离线安装包与便携版。
  安装体验
  - 在线入口：Zhiyu-1.17.2-online-setup.exe。基于 Windows 自带的 .NET Framework/WPF，无需下载另一份 Electron 或 WebView2。实际大小以附件为准。
  - 全新安装优先 D:\Apps\Zhiyu；无可用 D 盘时回退到当前用户本地程序目录。发现旧版时沿用目录和范围，不自动搬迁资料。
  - 桌面快捷方式默认开启，开机自启默认关闭；支持当前用户和所有用户安装。需要管理员权限时交给 Windows 系统授权，不模拟 UAC 弹窗。
  - 下载进度来自实际字节数；下载失败可重新下载，取消会清理本次临时文件。写入阶段显示不定进度，等待 NSIS 结束后核对实际安装版本。
  - 修正完成页主按钮与次按钮的文字居中轴线。卸载时仅移除指向当前程序的自启项。
  校验与签名
  引导器内固定同一版本的官方 HTTPS 附件地址、长度与 SHA256，执行前再次校验，拒绝残缺或哈希不符的安装文件。自启设置由安装引擎写入，不让普通用户引导器长期保持管理员权限。为避免以管理员身份启动日常应用，请直接双击在线安装器，不使用“以管理员身份运行”。
  本版未配置受信任 Authenticode 证书，Windows 可能显示未知发布者或 SmartScreen 提示。校验哈希不等于可信发布者签名。签名接入条件见 Windows 签名说明。
  发布验证
  Windows 正式版流水线执行类型检查、lint、国际化检查、测试、桌面构建及既有正式程序集成检查；额外编译并执行原生引导器测试，在一次性的 Windows CI 环境验证实际 NSIS 安装、版本、自启设置与卸载清理。在线和离线包使用同一次构建生成的校验值，应用内更新的 latest.yml 与 blockmap 保持指向离线包。
  真实管理员授权确认、不同 Windows 版本与第三方安全软件兼容性不由无交互 CI 代替；本地日常资料和真实账号不用于安装回归。正式附件以发布流水线成功上传的结果为准。
