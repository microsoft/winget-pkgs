ReleaseNotes: |-
  知屿 Zhiyu 1.17.5
  自托管 Web 同步 Linux.do 主身份、Exa 联网检索、额度与记录、Jev 原文提示和文档账号提取，修正文档更新与保存位置提示。
  Web 功能同步
  - 资产详情、AI 工作台和文档可使用 Exa，展示真实步骤、来源、免费/已购剩余及记录；同一 Linux.do 主体共用远端账本，不重复获得免费 50 次。
  - Jev 使用自己的 TypeSafe Key，授权本次发送后逐段分析。支持原文高亮、下划线、定位和阅读样式，不生成新文档，切换样式不重复调用。
  - Linux.do 主身份支持官方授权、预览确认、资料同步和本人公开帖子。服务器用 PKCE 轮询领取结果，不让远程浏览器回跳服务器的本机地址，也不接受任意外部回调域名。
  - 授权预览必须由原网页登录会话确认；取消、过期和退出使旧授权失效。弹窗受限时提供手动链接，结果页支持明暗主题、手机布局、查询参数清理和关闭提示。
  - 文档账号提取在浏览器复用桌面解析、预览、选择、修改和去重，确认后一次加密保存并关联原文。锁库或预览失效不提交部分记录。
  - 文档服务端保存/删除时通知已打开页面，保留正在编辑的草稿；修正保存位置、图床状态和 AI 官网链接。
  密钥、费用与运行环境
  主身份和 Jev Key 使用服务器密钥加密保存在 server/，不回传浏览器、不进入工作区备份或同步。此存储由实例管理员管理，不同于浏览器端到端加密的资产密钥库。Jev 任务按网页登录会话隔离，取消和退出会话中止对应分析。
  Exa 失败/取消不扣次数；LDC 商户和可信 Exa 余额未配置时继续禁止积分购买。没有真实 TypeSafe Key 时不宣称真实付费 API 验收。系统托盘、原生终端、扩展配对和部分供应商 OAuth 仍有平台差异；逐项检查见仓库 docs/WEB-PARITY.md。
  验证与升级
  发布前执行类型、国际化、Lint、全量测试、Web 正式构建与真实浏览器回归。本机 HTTP 合成 OAuth、Exa 和 TypeSafe 供应商验证实际授权、幂等、余额、错误、取消及会话隔离；不将合成调用描述成真实第三方账号或积分支付。
  本地全量测试 1,290 项通过（1,178 个 JavaScript + 112 个 TypeScript），0 失败、0 跳过。类型与国际化检查通过；Lint 为 0 错误、24 条既有警告。Web、桌面目录包、Grok SSR 构建通过；Web 的新旧流程及四组实际桌面包回归通过。开发与生产预览均检查桌面/390px，控制台无错误且无基线差异。
  本机 Docker 首次构建在 npm 下载依赖阶段出现 ECONNRESET，不计为镜像验证通过；正式发布以 GitHub Linux 构建、容器启动和多架构推送结果为准。独立登录服务已保留原配置和账本升级，公网确认网页授权等待、错误验证器拒绝、取消及旧桌面授权入口，未进行真实第三方用户登录、Exa 检索或社区积分支付。
  已有自托管实例需要升级镜像并重建容器，原数据卷保留。发布镜像不会自动升级所有用户已运行的实例。
