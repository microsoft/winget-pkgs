ReleaseNotes: |-
  知屿 Zhiyu 1.17.13
  费用与续费
  - 顶部费用区改为紧凑信息布局，减少渐变和空白。
  - 保留月度支出、人民币/美元分币种合计、30 天内到期数量和未填写费用提示。
  - 汇率细节改为可折叠；金额、汇率折算、月付/年付/一次性费用口径不变。
  - 移动端使用两列紧凑摘要，降低首屏高度。
  资产关系图
  - 复用现有 React Flow 图库优化关系分层、断开子图间距和卡片连线绕行。
  - 大图初始聚焦最大连通分量并保持卡片可读；用户主动“适应画布”仍可查看全图。
  - 点击资产仅高亮自身和直接邻居，其余节点与连线弱化；清除后恢复。
  - 保留横向/纵向布局、fit、100%、定位、小地图和实线/虚线图例，不伪造方向。
  - 后台数据更新不重置用户平移与缩放；明确切换布局或聚焦资产时才重新适配。
  新增与编辑关联
  - 新增/编辑资产时使用统一的搜索多选关联选择器，可直接选择已有邮箱、网站账号、域名、服务器、服务资产、号码、节点和文档。
  - 已选关联可见且可移除；自动去重、禁止自关联，旧快照中的悬空引用安全忽略。
  - 网站账号与域名沿用现有资源类型并明确区分。
  - 普通资产与关系一次写入同一份快照；文档使用专用绑定接口。失败时保留表单输入，并反向补偿资产、普通关系、旧文档 links 与密钥库写入；取消不写入。
  - 编辑 AI 资产移除号码时同步清理兼容的 subscriptionIds，避免刷新后关系复活。
  - 支付卡与 eSIM 编辑器复用同一关联多选和事务保存流程。
  - 编辑时回显已有关联，重启后从既有 links / bindings 恢复。
  GitHub Issue 修复
  - #8 富文本自动保存时以编辑器模型判断正文是否变化，避免保存前后的默认属性差异重置选区。标题按回车可以进入富文本或 Markdown 正文，富文本编辑区有清晰边界。
  - #9 Google 明确拒绝旧客户端时显示个人账号额度限制。缺少项目时提示检查 Code Assist 席位和项目。刷新失败保留上次额度并标记过期。
  - #9 桌面用量记录新增本机 Antigravity CLI 额度入口，按需显示独立结果。
  - #6 桌面邮箱编辑新增单独的 Gmail / Outlook 收发授权，保留原有身份核验与应用专用密码方式。
  - 邮件外部图片默认拦截，可在「系统设置 → 数据与安全 → 存储」开启自动加载，单封仍可隐藏。
  验证范围
  Windows 已实测 Gmail 授权及收件箱读取、文档光标及 Antigravity CLI 取数。Outlook 真实收信及两家真实发信仍待验收；自托管 Web 保留邮箱身份核验。
  提供 Windows x64 安装版、在线安装版、便携版，macOS Apple Silicon / Intel 的 DMG 和 ZIP、浏览器扩展，以及同版本自托管 Web 镜像。macOS 包未签名、未公证，Touch ID 仍待硬件实测。
