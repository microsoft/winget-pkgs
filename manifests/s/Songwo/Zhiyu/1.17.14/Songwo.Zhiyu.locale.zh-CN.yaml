ReleaseNotes: |-
  知屿 Zhiyu 1.17.14
  桌面工作区
  - 侧栏集中显示常用入口。重新安排资产总览，统一文档、邮箱、续费等功能页的标题、筛选与主操作。
  - 资产详情集中显示关联资产和文档。服务器详情分区呈现监控、端口与容器、自建节点、服务文档、凭据、运维工具和 SFTP。
  - 邮箱详情将打开收件箱、写信和检查新邮件放在同一区域。
  关系图
  - 「当前资产及关联」和「全部资源」直接显示在图上。选中节点可高亮直接关联并打开详情。
  - 短窗口和高倍界面缩放时，底部工具栏随可用高度调整。大型图谱首次定位到关键节点，仍可用「适应画布」查看全图。
  - 修复 Windows 桌面版无法进入图谱全屏的问题。可通过退出按钮、Esc 或打开资产详情离开全屏。
  启动与打包
  - AI 助手首次调用时才加载模型 SDK。主机监控界面按需加载。
  - 关系图仅订阅相关资产数据，刷新节点时按 ID 匹配并保留位置。
  - 桌面包剔除模型 SDK 的开发源码、类型声明和调试映射。Windows x64 本地解包验证中，应用归档约减少 10.5 MB。
  下载与验证范围
  - Windows x64 提供安装版、在线安装版和便携版。macOS 提供 Apple Silicon 与 Intel 两种架构的 DMG 和 ZIP。
  - 自托管 Web 镜像与浏览器扩展同步版本。附件摘要见 SHA256SUMS.txt。
  - Mac 包未签名、未公证。Touch ID 仍待带指纹识别硬件的 Mac 实机验收。
  - 桌面邮件授权沿用既有支持范围。Outlook 真实收信与 Gmail、Outlook 真实发信仍待实际账号验收。Antigravity 额度继续在桌面用量记录独立展示，归属于本机 CLI 当前登录的账号。
