ShortDescription: Encrypted screenshot album and screen capture tool, with an editor, text search inside pictures and MP4 or GIF recording.
Description: KillerShot captures a region, a window or every monitor with Print Screen, puts the picture on the clipboard and into an encrypted SQLCipher album on your own computer, and lets you find it again by the text inside it. Mark captures up and redact them in the editor, read QR codes locally, take scrolling and interval captures, and record the screen to MP4 or GIF with system audio and microphone. Runs portable or installs for you or every user. Open source under GPLv3.
