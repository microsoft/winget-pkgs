ShortDescription: Open-source network scanner for Windows with device discovery, port scanning, service identification and live monitoring.
Description: |-
  Fast local network scanner for Windows, built for field techs. One click maps the subnet - IP, hostname, MAC, vendor, device type, and open ports - with no admin console and no subscription.

  - ARP cache + parallel ping sweep discovery; a second ARP pass catches phones and devices that block ICMP
  - TCP port scan across 30+ common service ports with active fingerprinting: HTTP title, SSH banner, TLS cert, NetBIOS, SNMP, ICMP TTL
  - mDNS (Bonjour) and SSDP (UPnP) discovery spots Chromecasts, printers, Sonos, AirPlay, Roku, Plex, and Synology devices
  - MAC vendor lookup across the full IEEE registries (MA-L, MA-M, MA-S) with randomized-MAC detection; vendor database refreshable in-app
  - Weighted-score classifier identifies routers, hypervisors, Windows and Linux boxes, printers, NAS, cameras, IoT, mobile, and more
  - Right-click to copy IP/MAC/hostname, launch RDP/SSH/browser, or override a device type; SSH asks which account to use and remembers it per device
  - Permanent Devices, Services, Topology, Keep Alive and Terminal views, each keeping its own state
  - Topology (F8) infers how the network fits together, with movable multi-select device boxes, four arrangements, radial and compact layouts, settings for box size, orientation, fonts and connection lines, Ctrl+wheel zoom, and full-resolution transparent PNG, JPG or HTML with SVG export
  - Keep Alive (F9) watches up to 16 devices at once as status cards with latency sparklines, packet loss, per-device checks and event logs
  - Embedded terminals run PowerShell 7, ping and SSH with KillerShell's prompt and the KillerScripts module carried inside the EXE
  - A speed test (F4) runs in the terminal with KillerScan's own engine against speed.killerscan.net, asking before any data is sent
  - Deep Scan checks discovered hosts on ports 1-1024 plus additional service ports and collects more fingerprints; scan profiles (Ctrl+Shift+P) remember targets and can follow with Deep Scan
  - Scan history (Ctrl+H) compares runs for added, missing and changed devices, or shows a saved run in full, with trusted-device baselines, unknown-device alerts, and retention by age, by count or without a limit
  - A service-centric view (F7) organizes results by service, port and device, with a menu that copies service details or connects with the service's protocol and port
  - Export follows the view: devices as CSV or HTML, services as CSV, topology as PNG, JPG or HTML with SVG, the Keep Alive run as CSV or a page, and the terminal session as text
  - Headless command line for scripts, RMM, and KillerMCP: scan, probe, network details, offline vendor lookup, ping, traceroute, diagnostics, availability monitoring, speed tests, and CSV, JSON or HTML export; installed copies run as killerscan scan from any terminal
  - Scan several networks in one pass: comma-separated CIDR blocks, single hosts, and ranges
  - Thirteen themes, with eight accent colors for Dark, Light, Black and 98SE, localized in nineteen languages
  - Follows Windows contrast themes, names every control for screen readers, and keeps keyboard focus inside open cards
  - Keyboard shortcuts on F1, with a shortcut list and a color-coded keyboard map, plus an app-wide size control from 70% to 250%
  - Checks for updates on startup and offers a newer release in a dialog, with a switch to turn the check off
  - One self-contained Windows EXE that requires .NET Framework 4.8; installs per-user or for all users, or runs portable
  - GPLv3, no account, no telemetry; device identification runs locally, and only network features such as update checks, vendor database refresh and speed tests connect out; an HTML report loads the KillerScan logo from killerscan.net when opened
