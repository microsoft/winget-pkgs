ReleaseNotes: |-
  1.4.0 replaces the legacy preview engine, adds outgoing links and code highlighting, and improves editing, recovery, and navigation.
  Added
  - Keyboard access now covers note actions, dialogs, and tools, including database context menus, with matching menu hints and a synchronized shortcut guide; the CLI adds sharing, export, templates, recovery, groups, tags, and backups.
  - The note's link strip now includes outgoing links, including targets that do not exist yet.
  - Fenced Markdown code blocks use their declared language for syntax highlighting.
  - A dimmed loading overlay shows while the startup database and initial note open, hiding the empty-note prompt until loading finishes.
  - Dragging a note to the top or bottom edge of the notes list scrolls it, so groups out of view can be reached.
  - Ukrainian, Norwegian (Bokmål), and Brazilian Portuguese localization.
  - Added a silent uninstall, /uninstall-silent, registered as the quiet uninstall so WinGet and other package managers can remove KillerNotes without a prompt.
  - Added yellow and magenta accents to the neutral and 98SE themes.
  - Syntax audit logs include timing for tokenizing, resolving positions, painting, and complete highlight passes.
  Changed
  - The markdown and HTML preview is now drawn by the app itself instead of the Internet Explorer engine, so it follows the theme and grain and keeps its rounded corners.
  - Hover descriptions and shortcuts appear on separate wrapped rows; the format bar has a right-click menu, with heading levels available directly.
  - The language menu shows its 19 languages in two columns with a faint divider that fades at both ends.
  - Selected states, accent picker pills, and filled or hovered buttons use gradients outside 98SE; accent swatches lift subtly on hover, Light buttons have softer gray borders, and yellow wordmarks match their accent.
  - Menu rows now show accent text and icons on the theme's hover color.
  - Line numbers use a numbered-row icon to distinguish them from the heading outline.
  - Toolbar and link-strip chevrons match the sidebar's color-only hover; the link-strip chevron reverses when folded.
  Fixed
  - Pressing F4 to leave the preview no longer crashes with an "Unknown Hard Error".
  - Cross-note replacement handles formatted text correctly and keeps links accurate through undo (#14).
  - Read-only notebooks reject checklist and heading changes.
  - Restoring the oldest saved version works when history is full.
  - Restoring an older note title offers to update incoming links through the rename dialog.
  - Templates and daily notes use the latest title edits immediately.
  - Previews render Markdown and HTML together and preserve angle-bracket placeholders and code examples.
  - Removed the preview's inset frame and restored dragging its split-view divider.
  - The mouse wheel scrolls the notes list a full step per notch again and scrolls the note under the pointer after sidebar selection.
  - Text stays sharp at app sizes other than 100%.
  - Pinned places in the file picker can be dragged into a new order.
  - Ctrl+wheel changes picker views and icon sizes, and image previews keep their texture and thumbnail shadow.
  - Fixed picker, dialog, Graph, and SketchPad frame corners, close-button hover contrast, and the corner alignment of SketchPad and Dictation close buttons.
  - Restored slider tracks and corrected note and group title, database, dialog, menu, toolbar, and footer contrast, with quieter themed footers and subtle gray Delirium dividers.
  - The notes list keeps rounded selection corners at narrow widths and no longer fades its last row at the bottom.
  - The shortcuts list uses the keyboard map's category colors throughout, with the in-note find section in the left column and an aligned online help link in both views.
  - Selected language and theme rows keep the active accent on hover.
  - The theme picker's divider updates when switching themes.
  - The theme menu's Fonts row has compact spacing and a faint fading divider; 98SE keeps flat accent swatches, a beveled link strip, and About panel edges matching the sidebar.
  - The uninstaller has its own taskbar button, labeled "Uninstall KillerNotes", with the app icon.
  - Install and uninstall windows now show the film grain and the app icon in the title bar.
  - Main window and dialog title bar icons now use sharp size-matched images.
  - The portable footer button reads PORTABLE, like KillerPDF and KillerScan, and its tooltip offers the install.
  KillerNotes embeds the LAME MP3 encoder (libmp3lame, LGPL-2.1) for exporting recordings. Its complete corresponding source is attached to this release as lame-3.100.tar.gz, and also lives in third_party/audio/ in the tagged source. Build instructions are in third_party/audio/README.md.
