ShortDescription: A searchable, encrypted notepad for techs - rich text, inline images, real tables, full-text search, and tear-off .knote sharing.
Description: KillerNotes is a searchable, encrypted notepad built for techs who live in a dozen Notepad windows. Every note saves itself on every pause, note switch, and close, and full-text search finds any note as fast as you can type. Rich text with inline screenshots, real tables, a full color picker, adjustable font size, and color-coded tags. Optional whole-database SQLCipher AES-256 encryption. Share a note as a tear-off .knote (drag it into Teams or Outlook) or a whole database as .kndb. Opens and exports .txt, .md, .html, .rtf, and images, with a markdown/HTML preview. Single signed exe, portable or one-click install with /silent for RMM, no account, no cloud, no telemetry, GPLv3. Windows 10/11.
