ReleaseNotes: |-
  1.7.1 adds the Trash Polka theme, a docked format bar and a New folder button in the pickers, takes the latest KillerUI cards and menus, keeps one installation per account, re-encrypts backups with the password, and tightens update, signature and pipe checks.
  Security
  - Update and signature checks read the publisher from the signature Windows verified, never from the file a second time, and the installer's lock can only be opened by the current user, administrators and the system.
  - KillerNotes no longer installs a per-user copy beside an all-users one. The repair for a PC that has both keeps the all-users copy without admin rights, and that copy still opens the file or quick note the launch asked for.
  - The app's pipes accept only the account running KillerNotes, and the command line refuses to send anything to a copy running as another account.
  - The uninstall cleanup runs Windows' own cmd from System32 and calls its commands by full path.
  - Backups are re-encrypted in the background when the password is set, changed or removed, and quitting waits for that to finish. The status line says how many backups the previous password couldn't open, or that the backup folder couldn't be read.
  Fixed
  - Theme and language menu labels line up with their radio buttons and check boxes again, instead of sitting a pixel high.
  - The theme and language menus keep 8px between their rows and the card edge on every side, and the language menu's divider has the same gap on each side.
  - The Mourning theme highlights selections in its original peach with dark text again, instead of pink.
  - A second Enter in the file dialog's name box waits for a slow folder check instead of running twice.
  - A translation file that fails to load reports through the app's own dialog.
  - Chinese and Japanese interface text draws in that language's own Windows font (Microsoft YaHei UI, Yu Gothic UI) instead of a Traditional Chinese face.
  - On the 98SE theme the dialog close buttons draw the Win98 pixel X, and the System menu's Close glyph stays readable on the Light and 98SE menus.
  - Pasting rich text that contains links, such as a draft copied from the Claude desktop app or a browser, keeps its headings, bulleted and numbered lists, code blocks, inline code, and the spacing between paragraphs. Code blocks keep every line and their indentation in a monospace font, and links still work.
  - On the 98SE theme the format bar's raised frame runs along its top edge too, so it is framed on all four sides.
  - The note card's Tags tile lists tags that are assigned to the note but no longer defined, in gray, so they can still be seen and removed.
  - Switching Trash Polka accents waits at most one second in total for the ink, even when several pieces are slow.
  - Markdown notes export rendered. Lettered and Roman lists export as numbered lists, and floated content and recordings reach the HTML.
  - Nested checklists stay nested on export, and a numbered checklist item keeps a single marker.
  - UTF-16 text files import with their front matter, and a sketch with missing parts still opens.
  - Importing an image through MCP checks the group before it adds a note.
  - A crash is logged once, and trimming the crash log keeps the newest entry.
  - A tag whose stored color is unreadable falls back to the default color.
  Changed
  - The encrypted database engine is updated to SQLCipher 4.20.0 (SQLite 3.54.1). Existing databases and passwords open unchanged.
  - Backing up the database right away moved from Alt+B to Shift+F6.
  - Menus and cards draw their text in the full text color in Dark, Black, Light and Trash Polka, keep an even 8 px edge, and show tile shortcuts on a second line. The theme and language rows center their content, and dialog captions match ConfirmDialog's.
  - The preview's right-click menu, the lock button's menu, the Trash header's menu and the sidebar side menu are KillerUI tile cards, with each tile's shortcut under its caption.
  - The note, group and editor right-click menus, the New note menu and the format bar's own menu are KillerUI tile cards too, each tile showing its shortcut. The note, group and editor cards can be customized: tiles you seldom use move into the card's drawer.
  - The tray icon, sort button, search icon, dictation button, mentions strip, text boxes and the unlock dialog's "Use another database" now open tile cards too. The tray card is one row of Open, Quick note and Exit, with their shortcuts, under the KillerNotes logo and wordmark. Small cards keep every row full: four tiles sit two by two. The Databases card puts Delete in its header over four tiles, and the tag card keeps Delete in its header over Rename and Color. Color slides the tag's swatch row out under the tiles.
  - The dictation waveform, sketch pad and graph right-click cards are tiles now, with no text rows. Every row is full, and five tiles sit three over two. A sketch object's card keeps Delete in its header, and the graph's Shape, saved arrangement and Forget lists open beside their tiles.
  - The rule flyout's choices and the calculator keys draw the film grain over their hover fill, as menu rows and card tiles do.
  - On Trash Polka, check boxes and radio wells are solid black, so the ink never shows inside them.
  - Trash Polka's ink is kept in a disk cache per screen size, so the first switch to it decodes in about a second instead of rendering. A background builder at idle priority fills the cache after startup, and the ink is released when another theme is chosen.
  - The preview's view and title pickers draw on the KillerUI dropdown field again.
  - The format bar and its grips keep the arrow pointer. The grab hand shows only while dragging.
  Added
  - The calendar's month buttons have tooltips.
  - While customizing a card, Alt+arrow keys move the focused tile one place or one row, and a screen reader hears its new position.
  - The save and folder pickers have a New folder button (Ctrl+Shift+N). Type a name and press Enter to create the folder and open it; a name Windows won't accept is explained under the box.
  - Trash Polka, a new theme under 98SE: black with a tattoo-style ink background in your accent color, from eight accents with Blood red as the default. The ink runs through the note pane, the About and Keyboard shortcuts cards, the calculator readout, dropdown lists, flyouts, the format, find and mention bars, and the preview and outline panes. Under a Windows high contrast theme the ink steps aside for the system colors.
  - The format bar can dock in a row of its own above the note instead of floating over its top edge. Switch it with Docked toolbar or Floating toolbar on the format bar's right-click menu, or with Alt+B, as in KillerPDF. Floating stays the default, and a quick drag of the floating bar lands where it is released, from its grip or from any empty space on the bar.
  - On Trash Polka, the ink shows at 13% behind the note and 19% behind its rendered preview.
  - A global shortcut brings KillerNotes forward, from the tray too. It is Win+Alt+O by default, and the About card can change it to one of four other Win+Alt keys or turn it off.
  KillerNotes embeds the LAME MP3 encoder (libmp3lame, LGPL-2.1) for exporting recordings. Its complete corresponding source is attached to this release as lame-3.100.tar.gz, and also lives in third_party/audio/ in the tagged source. Build instructions are in third_party/audio/README.md.
