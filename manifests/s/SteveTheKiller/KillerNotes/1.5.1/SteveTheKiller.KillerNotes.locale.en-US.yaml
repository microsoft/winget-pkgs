ReleaseNotes: |-
  Added
  - Added a right-hand position for the sidebar and its rail, picked from the rail's right-click menu or with Alt+Shift+Left and Alt+Shift+Right. The arrow of the side the sidebar is already on collapses or expands it.
  - Rail buttons can be dragged into any order, which is remembered. Theme, language and shortcuts stay together at the bottom of the rail.
  - The create and update commands take --content-file for Markdown longer than a command line can hold.
  - Installed copies add their folder to PATH, so commands such as killernotes list run from any new terminal. killernotes --help lists commands, and --cli stays compatible. Portable copies run from their folder or full path. Uninstalling removes the installed PATH entry.
  - Added Start with Windows to the About card. It starts KillerNotes minimized on the taskbar when you sign in, and stays off until you turn it on.
  - Added Close to system tray to the About card. With it on, closing the window keeps KillerNotes running in the notification area, where its icon brings the window back or exits; it stays off until you turn it on.
  - The shortcuts overlay lists Ctrl+Tab, which moves keyboard focus out of the note while Tab keeps typing in it.
  - Alt+Shift+G turns Film Grain on or off. It is listed in the shortcuts overlay, and the keyboard map has a new Alt+Shift layer for it.
  - The website's top bar has a Microsoft Store button on every page, and the MCP page has a Microsoft Store button for KillerMCP.
  - The website's About page lists KillerBench and KillerShot under Also try, with larger app icons.
  Changed
  - Film grain is softer and shows on every theme, Black included. Its specks come in many shades, and some lean toward a color opposite the theme accent, such as purple on green and orange-brown on blue and red.
  - Rail buttons and the collapse arrow sit centered across the rail on either side, with the same space toward the sidebar and the edge, and the arrow is larger. The side choices in the rail's right-click menu show a picture of each position.
  - Note titles in the sidebar are slightly larger, so they stand apart from the preview line and date under them.
  - The New note button is filled with the theme accent so it stands out from the quieter sort buttons, and shrinks to + before the sort buttons would wrap under it.
  - The sidebar starts 20px wider, and the width you drag it to is remembered the next time KillerNotes opens.
  - The website's top bar Download button uses the same font and height as the other top bar buttons.
  - The keyboard focus outline is a thin one-pixel dotted ring in the theme accent instead of a thick dotted line, and uses the text color where the accent would be too faint to see.
  - Primary, outline and secondary buttons sit raised on a soft shadow that lifts on hover and sets down when pressed. 98SE keeps its flat beveled buttons.
  Fixed
  - Shared notes and imported databases keep editable sketches and embedded audio; notes made from templates keep their audio too.
  - Editing a recording stays with its original note, even after switching notes, and cannot replace audio in another database.
  - Network databases reserve one writer before changes begin, and a crashed app releases the reservation.
  - Backups made in the same minute keep separate snapshots, and a failed backup does not replace an earlier copy.
  - Importing a shared note or database is all or nothing, so a file that fails partway no longer leaves some of its notes behind.
  - Malformed MCP requests no longer crash the app, and a client that stalls mid-request no longer blocks later CLI and MCP commands.
  - Windows contrast themes now use system colors, including custom note and group titles, without changing saved colors or theme preferences.
  - The cursor can no longer land inside a horizontal rule, so text typed after moving up or down past a rule no longer comes out tiny (#28).
  - The window opens fully on screen on a small or high-scaling display, or when its saved size came from a bigger monitor, instead of running off the edges.
  - The command line accepts an optional trailing --json while keeping its existing JSON output.
  - In a note that mixes languages, syntax highlighting colors each line in its own language. A # comment line no longer switches the whole note to markdown, comments inside a script stay comments, and a shell line such as export PATH=$HOME/bin reads as Bash instead of PowerShell.
  - On the Light theme's Yellow and Orange accents, buttons, links, tabs and accent icons keep their color with a thin gray outline around accent text and icons, instead of turning near-black or brown.
  - Gray, menu and accent text reads at 4.5:1 contrast or better in every theme and accent, and the footer's version and copyright are slightly dimmed.
  - The Dark theme's Red accent stays a true red on buttons, lines, scroll bars and the website's accent swatches, and only small red text uses a lighter red.
  - The website's text and accent colors read at 4.5:1 contrast or better in every theme, and a narrow top bar shrinks the Microsoft Store and MCP buttons to their logos and moves links into a More menu instead of wrapping.
  - On the website's Light theme with the Yellow or Orange accent, links, headings and labels keep their color with a thin gray outline instead of turning olive or brown.
  - The exe's file properties show Steve the Killer as the copyright holder instead of leaving it blank.
  - Screen readers no longer read toolbar, format bar, menu and title bar icons as unreadable symbols, and every part of each scroll bar now has a name. File-picker rows announce folder and file names.
  - Tab no longer stops on hidden links, which screen readers announced as the window.
  - Screen readers and accessibility checkers no longer report empty text or the hidden parts of scroll bars as items on screen.
  - Each group of option buttons is one Tab stop that lands on the selected option, and the arrow keys move between its options.
  - Turning off Film Grain removes the grain from the note pane too.
  - The file picker's close button turns red on hover without filling a red block, like every other dialog's close.
  - Group and Trash headings in the sidebar sit centered in their row and its highlight instead of low against the bottom edge.
  - The format bar's top corners are square where it hangs from the top of the note pane, and round only when the bar sits flush in a corner of the pane.
  - The website top bar no longer leaves extra space under the wordmark and buttons.
  - Theme and language radio buttons and the Film Grain checkbox line up with their labels again.
  - On the website, text on accent-colored buttons, tabs and highlights switches to white or near-black for contrast, so it is never white on yellow.
  - Theme names, the preview modes, the unlock dialog buttons and other labels that were still in English are translated in every language, and the Hungarian Open dialog lists file types correctly again.
  - The website's MCP page, release details, contact cards, carousel controls and remaining labels are translated in every language.
  - On phones, the website's logo, download hash, Technical model table and file paths fit the screen instead of making the page scroll sideways.
  - The database name in the title bar sits on the baseline of Killer in the wordmark instead of 1px below it.
  KillerNotes embeds the LAME MP3 encoder (libmp3lame, LGPL-2.1) for exporting recordings. Its complete corresponding source is attached to this release as lame-3.100.tar.gz, and also lives in third_party/audio/ in the tagged source. Build instructions are in third_party/audio/README.md.
