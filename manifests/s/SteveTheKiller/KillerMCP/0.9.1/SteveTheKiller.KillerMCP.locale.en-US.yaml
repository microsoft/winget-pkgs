ReleaseNotes: |-
  KillerMCP 0.9.1 reaches KillerScan 1.9.0's Locations, scan settings and adapter choice.

  ### Fixed

  - Bookmark input files follow the network path restrictions before they are opened.
  - Setup refuses installation and leftover cleanup paths redirected through links or junctions.
  - Failed client registration preserves settings and names any completed registrations that need review.
  - Client settings stay locked while an update is written, with a recovery copy for interrupted updates.

  ### Changed

  - `killershell_list_processes` and `killershell_list_services` with `detail` now mask more secret shapes: any switch named for a password, token, secret, API key or credential, URL passwords, `AccountKey`, `SharedAccessKey`, `SharedAccessSignature` and `client_secret` values, whole Authorization header values for every scheme, and brace or quoted connection string values. Masking is best effort, and the tool descriptions say that detail can still expose secrets in unusual forms.

  ### Added

  - KillerBench exposes capability-gated evidence, knowledge, review and catalog tools, MSI code lookup, and more focused diagnostics. File inputs respect agent path restrictions; existing repair consent and exclusions remain in place.
  - `killershell_storage_report` reports the largest folders and files under one directory and appears with KillerShell 1.5.1 or later. It only reads folder sizes.
  - `killershell_list_processes` and `killershell_list_services` take `detail` and `filter` when the installed KillerShell offers them. Older KillerShell versions keep the plain listings.
  - `killerpdf_set_metadata`, `killerpdf_set_bookmarks`, `killerpdf_add_comment`, `killerpdf_delete_comments` and `killerpdf_crop` appear with KillerPDF 1.9.2 or later.
  - `killerpdf_print` takes `duplex` and `reverse` with KillerPDF 1.9.2 or later, and `killerpdf_fix_orientation`, `killerpdf_straighten` and `killerpdf_render_separations` take `password`.
  - `killerscan_list_locations` lists KillerScan's saved Locations with the name or ID a scan takes. It reads only and sends no network traffic.
  - `killerscan_scan_network` and `killerscan_probe_host` take `location`, `skip` and `adapter` when the installed KillerScan offers them. A scan with `location` uses that Location's saved names and types and records the run there, and its result says whether the save worked and passes on KillerScan's baseline and new-device notes. `skip` lists the checks to turn off, and `adapter` sends every probe from one connected adapter.
