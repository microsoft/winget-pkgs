ReleaseNotes: |-
  1.9.2 follows a PDF owner's limits when saving, printing and exporting, lets you edit recognized text on scans, fixes rendering, signatures, comments, forms, zoom, text selection and update relaunches, and adds reverse-order and binding-edge printing.

  ### Fixed

  - Damaged encrypted PDFs with a missing encryption trailer are refused before saving instead of being rewritten with unreadable pages.
  - Protection is recognized wherever a PDF keeps its encryption entry, including linearized files and large cross-reference streams, so those files no longer open as unprotected.
  - Render-failure recovery keeps a protected document's encryption, so the recovered tab keeps its limits and saves back to its file. A recovered document that does not reopen is listed with the documents that need review.
  - Render-failure recovery preserves unsaved edits across panes and detached windows, including edits committed after focus moves, and a recovered document reopens once, with no clean tab of its file beside it.
  - Undo and Redo preserve retryable history and the open document when snapshot storage fails.
  - Command-line straightening and text replacement preserve an existing output if copying unchanged input fails.
  - PDFs opened from ZIP archives ask for a permanent location on first save, and abandoned import files are cleaned up safely.
  - Canceled or failed protected opens restore the previous document, and closing an importing window stops its remaining opens.
  - ZIP export preserves existing archives when creation fails and refuses to replace the source PDF.
  - Canceling Save Flattened before publication preserves the destination and reports cancellation.
  - A signed PDF that needs a password opens read-only with its user or owner password and keeps its signatures. A second tab of the same file asks for the password again.
  - Removing or changing a signed field can be undone, canceling a change keeps the signature, and fields stay signed through Undo, Redo, and tab switches.
  - A form opened with a user password saves its allowed filling back into the protected file.
  - Forms that repeat a field name save normally instead of failing with a duplicate name error. Typing, font size and background changes reach every field of that name on every page, comb fields included, and deleting one removes them all. A field that cannot take the new value keeps its own, and the save names it. (#466)
  - Comments save on PDFs that reuse an annotation name on different pages.
  - Merge keeps pages whose annotations share a duplicate name, renaming later duplicates and preserving popup links. (#455)
  - Repeated content appends keep PDF drawing instructions separate.
  - Damaged signature libraries are preserved and reported instead of crashing the signature picker.
  - Folder and ZIP import stays responsive, limits discovery and extraction, rejects unsafe entries, and stops canceled merges at the next work boundary.
  - Password-protected PDFs open when their writer left XMP metadata unencrypted, and PDFs whose user password forbids editing open read-only with an option to enter the owner password. (#470)
  - A PDF that is open read-only because its owner forbids editing prints when its permissions allow printing, and its Comments panel, navigation audit, auto-bookmarks, table of contents, separations, structure comparison, accessibility review and preflight work instead of failing on its encryption.
  - `optimize` works on a healthy encrypted PDF and keeps its protection, and commands that cannot change an encrypted PDF say what to do in plain words.
  - An all-users update reopens KillerPDF for the signed-in user at normal rights, whether it finishes or stops early. Windows was refusing that relaunch, so the app stayed closed.
  - Reloading a PDF rewritten at the same size shows the new pages instead of the old ones.
  - Raster images retain fine detail when reduced along one axis, preventing some pages from rendering blank.
  - Corrected Japanese character order, rotated paragraph line order, mixed horizontal and vertical reading order, vertical-text selection, hit testing, and accessible text ranges. (#465)
  - Merge accepts images with single-element device color-space arrays. (#469)
  - Rasterize Region works on tagged PDFs and keeps their accessibility tags, and its dialog says the text under the image stays selectable and searchable. (#369)
  - The print command renders for print, so annotations, layers and redaction marks come out as the app prints them.
  - Export Pages as Images measures its scale from the page's real image size, so x1 no longer overstates it. (#462)
  - Export Pages as Images shows the size the file really comes out at, has a Cancel button, and when canceled stops at the next page and says how many pages it saved.
  - Save Flattened shows its progress from the first page and has a Cancel button that stops it promptly.
  - Reopening PDFs preserves zoom across view modes, and queued fit and zoom commands use the final layout while pages load or switch layouts.
  - Releases can reuse a matching successful signed dry run, test the freshly built CLI instead of a stale copy, and skip Microsoft Store submission while a previous version is under review.
  - The paragraph dialog keeps every field reachable at a high app scale.
  - At a large app size the sidebar rail's icons shrink to fit below its arrow instead of running over it, and the read-only notice, message boxes and prompts are drawn at the app's size, including the password prompts, the save prompt on close and the quit prompt.
  - Comment export and import preserve PDF dates with time zone offsets.
  - Saved signatures support mouse drag, click placement, and keyboard selection, with visible placement instructions.
  - Late page rendering preserves focus in open pickers and other windows.
  - Form buttons and signed signature fields redraw correctly when their visibility changes.
  - Keyboard focus cues respect the theme, Windows contrast refreshes are coalesced and restore frame colors, and picker selections keep text and icons shadow-free.
  - Tab labels and close buttons sit evenly inside each tab, the close X turns red only on hover or keyboard focus, and dragged tabs keep their current appearance and size.

  ### Changed

  - KillerPDF follows a PDF owner's limits. Save, Save As and Reduce File Size keep a protected PDF's encryption, passwords and permissions, with no owner password needed. Printing a PDF whose owner forbids it, or above low quality where only that is allowed, takes the owner password. So do removing protection from a file that sets limits, and making new PDFs, page images or text and data exports that its limits forbid, including page drags and saved attachments. On-screen selection, the clipboard and screen readers are not limited.
  - Command-line tools follow a PDF owner's limits the same way the app does. On a PDF whose limits forbid the output, `decrypt`, `protect`, `extract-pages`, `split`, `merge`, `flatten`, `to-image`, `ocr`, `scan-to-text`, `straighten`, `export`, `export-form-data`, `attachments` with an output folder, `comments`, `measurements`, `recognize-fields` without an output file, `data-merge`, `batch-render` and `macro` need the owner password through `--password`, and stop with exit code 1 without it. `batch-render` lists such a file as skipped, and `print` declines a PDF that forbids printing.
  - An unknown double-dash command-line switch prints the usage and exits 2 instead of opening the app.

  ### Added

  - Editing a recognized line on a scan matches the scan's colors, text size and closest installed font at any zoom, follows a tilted line, and replaces only the words you change. (#467)
  - Printing adds reverse order and long-edge or short-edge duplex binding, and page selection moves to its own Pages to print section. (Thanks @Rafie-kun)
  - Printing adds a Shrink oversized pages scale, and the print window remembers the scale and custom percentage. (#464)
  - Export Pages as Images and Save Flattened keep each page's own resolution by default, and Transform's resolution slider starts at x1. (#462)
  - `--password` opens protected PDFs for print, attachments, export, comments, measurements, recognize-fields, optimize, macros and batch-render.
  - New commands: `set-metadata`, `set-bookmarks`, `add-comment`, `delete-comments`, and `crop`, which can also resize pages.
  - Preflight can run a custom profile file from Document tools. (#264)
  - The print command accepts `--duplex` and `--reverse`, command-line help lists where `--password` works, and the help page has a full command reference.
  - Placing a signature shows a faint copy at the pointer, and the mouse wheel resizes it before you click. (#468)
