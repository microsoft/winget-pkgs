ShortDescription: Free shell for power users. A file browser, a terminal and a text editor share one window, one tab strip and one set of keys, in a single portable Windows exe.
Description: KillerShell is a file browser, a terminal and a text editor sharing one window, one tab strip and one set of keys. Search by filename wildcard or by file content across any directory, with results streaming in as they are found and no indexing service running in the background. Open PowerShell or cmd in a tab that starts in the folder you were just looking at, and edit ps1, reg, ini, log, JSON, XML, YAML and CSV files with syntax highlighting without leaving the window. Ships as a single portable Windows executable with no installer, no runtime to chase, no account and no telemetry. Free and open source under GPLv3.
