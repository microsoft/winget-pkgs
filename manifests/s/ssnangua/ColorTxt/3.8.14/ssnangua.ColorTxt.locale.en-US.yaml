PackageIdentifier: ssnangua.ColorTxt
PackageVersion: 3.8.14
PackageLocale: en-US
PackageName: ColorTxt
ShortDescription: A local TXT novel reader that colors your content, with support for common e-book formats such as .epub.
Description: |-
  ColorTxt (彩读) is a local TXT novel reader that colors the content you read. It also offers chapter detection, simplified/traditional Chinese conversion, text highlighting, notes, a dictionary, translation, multi-role text to speech, an AI reading assistant, and book-source search. It runs on macOS, Windows, and Linux.

  - Local file reading: reads local `.txt` and `.md` files
  - Other e-books: opens common e-book formats such as `.epub`, converting them to `.md` when loading
  - ColorTxt book packs: import and export the `.ctz` and `.ctzx` book pack files for sharing and cross-device sync
  - Automatic encoding detection: opens both `UTF-8` and `ANSI` files correctly
  - Automatic chapter detection: ships common chapter matching rules and supports custom rules
  - Content coloring: a custom highlighting rule set colors the text for a distinct reading experience
  - Custom highlight words: highlight any word you choose, for example main characters or key terms
  - Custom colors: several built-in color schemes, plus editable reading area, highlight, and annotation colors
  - Full-screen reading, minimal view, reading ruler, stealth mode, and a Pomodoro timer
  - Bookmarks with notes, annotation and note taking, edit mode, and timed auto-scroll
  - Text to speech: narration and dialogue voices, combined with AI and character cards for multi-role reading
  - Text replacement, and simplified/traditional and full-width/half-width conversion
  - AI reading assistant: asks the AI to analyze the plot or answer questions about the novel, and can generate mind maps and word clouds
  - Character card generation and AI typesetting
  - Book-source search: search multiple sources and read online or download whole books
  - WebDAV sync for app settings and book packs
  - Dictionary with importable local databases, and translation of the selected text
  - File list with drag and drop, categorization, sorting, and filtering, plus full-text search
  - Font, font size, letter/line/paragraph spacing, and margins
  - Light and dark themes
