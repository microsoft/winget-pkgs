ReleaseNotes: |-
  改进：
  - 「设置 → AI 阅读助手 → 对话模型」支持手动输入模型 ID（部分服务商没有提供模型查询接口） #100，#101
  - 只读选区工具条支持数字快捷键：按钮左上角显示对应数字角标；按钮未启用时快捷键不生效 #110
  - 「设置 → 阅读 → 滚动」新增「滚动条轨道行为」：禁用 / 翻页（默认）/ 跳转；只读时生效，编辑与 Diff 预览始终为跳转 #114
  - 移除高亮词前增加二次确认 #102
  - 高亮词「AI 检索」进行中改为在列表内显示信息条，不再全屏蒙版挡操作；信息条右侧可点「停止」，并使用已检索到的词语 #102
  - 系统字体列表：可切换「字体族 / 区分字重」；列表预览同时应用字重与斜体 #93
  修复：
  - Edge TTS 朗读 403：微软已要求 Sec-MS-GEC v2 握手令牌，旧版 v1 被拒绝
  - 书源分页目录可完整加载 #103
  - (Mac) 退出全屏模式阅读进度异常 #99
  - (Mac) 摸鱼模式：
    - 鼠标移到摸鱼窗口边缘时，会显示为调整窗口大小的光标
    - 退出摸鱼模式后，程序坞图标会重新显示
    - 翻页/切章的默认全局快捷键改为 Ctrl+Option+方向键，避开系统调度中心占用的 Ctrl+方向键
