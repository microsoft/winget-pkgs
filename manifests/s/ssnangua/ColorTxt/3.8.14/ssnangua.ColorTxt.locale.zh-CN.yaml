ShortDescription: 一款会给内容上色的本地 TXT 小说阅读器，也支持打开 .epub 等常见电子书格式。
Description: |-
  「彩读 3.0 书源 × AI+」——一款会给内容上色的本地 TXT 小说阅读器，带给你不一样的阅读体验！还有章节识别、简繁互转、划线标注、记笔记、词典、翻译、多角色语音朗读、AI 阅读助手、书源找书等功能。支持 macOS、Windows 和 Linux。

  - 本地文件阅读：支持本地 `.txt` / `.md` 文件
  - 其他电子书：支持常见的电子书格式（如 `.epub`），打开时会转换为 `.md` 进行加载
  - 彩读书包：可导入 / 导出彩读专用的 `.ctz` / `.ctzx` 书包文件，方便分享和跨设备同步
  - 自动编码识别：`UTF-8` 和 `ANSI` 都能正常打开
  - 自动章节识别：内置常用的章节匹配规则，也支持自定义匹配规则
  - 个性内容上色：使用一套自定义的高亮规则对内容进行着色，带来独特的阅读体验
  - 自定义高亮词：可选择任意词语进行高亮显示（可用于突出主要角色、关键词语等）
  - 自定义配色：内置多套配色方案，也可以自定义阅读区配色 / 高亮色 / 标注色
  - 全屏阅读、极简视图、阅读尺、摸鱼模式、番茄时钟
  - 书签：可添加带备注的书签
  - 划线笔记：可选中文本进行划线标注、记笔记
  - 编辑模式：方便对小说内容进行修改
  - 定时滚动：定时滚动一屏或一行
  - 语音朗读：支持旁白 / 对白多音色，配合 AI + 角色卡可实现多角色语音朗读
  - 文本替换：全局替换文本（可用于替换人名、去广告文本等）
  - 简繁互转：简繁互转，字母 / 数字全半角互转
  - AI 阅读助手：可以让 AI 帮忙分析剧情、回答小说相关问题（支持生成思维导图 / 词云图）
  - 角色卡生成：借助 AI 检索小说中角色的相关信息生成摘要，通过文生图生成角色立绘
  - AI 智能排版：让 AI 对文本进行排版，可自动处理硬换行、修正标点符号等
  - 书源找书：可多源搜索，支持在线阅读或整书下载
  - WebDAV：用于跨设备同步应用配置、书包
  - 词典：查询词语释义，支持导入本地词库
  - 翻译：翻译选中文本，支持 AI 翻译和多种翻译服务
  - 文件列表：拖放添加文件 / 目录（会递归读取子目录），支持分类 / 排序 / 过滤
  - 全文搜索：检索所有匹配项并给出结果列表
  - 字体与排版：可设置字体 / 字号、字间距 / 行间距 / 段间距 / 左右边距
  - 主题切换：内置明亮 / 暗黑两种主题
