ShortDescription: Local chart analysis with a private AI price forecast (Chronos-2). No cloud, no account.
Description: |-
  KandleOS is a desktop app for technical chart analysis. It shows candles from 1 minute to 12 months,
  indicators, drawing tools and a watchlist with folders. Its AI forecast (Chronos-2) runs locally on your CPU
  and comes with a backtest that shows how accurate past forecasts were. Crypto data comes from Binance,
  stocks from Alpaca, Yahoo Finance (opt-in) or Finnhub. Not investment advice.
