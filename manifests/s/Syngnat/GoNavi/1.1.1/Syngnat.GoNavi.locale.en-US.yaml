ReleaseNotes: |-
  > 💖 赞助商 · 華龍算力：deepseek,glm,kimi降至3.8折，DeepSeek谷价仅1.9折！
  > 華龍算力AI中转站活动加码：充88得100，每人限1单哦
  ✨ 新功能
  - ✨ feat(session): 新增提醒记录，事后可查谁在什么时候堵了多久
  - ✨ feat(sql-analysis): 新增执行计划前后对比，改写 SQL 或加索引后逐步看清哪一步变快
  - ✨ feat(sql-analysis): 执行计划实测模式支持 SQL Server 与 Oracle
  - ✨ feat(sql-analysis): 执行计划新增实测模式，用真实耗时和行数对照估算找出估错的步骤
  - ✨ feat(session): 新增长事务与锁等待提醒，超过阈值主动提示并一键定位到会话
  - ✨ feat(session): 锁等待面板支持 OceanBase、达梦、崖山与 GBase 8c，会话工作台新增崖山与 GBase 8c
  - ✨ feat(sql-analysis): 执行计划图标出成本热点并按数据流向绘制，更快看懂 SQL 为什么慢
  - ✨ feat(data-grid): 查询结果新增图表视图，一键出图并支持按选中数据看趋势和分布
  - ✨ feat(session): 会话工作台新增锁等待面板，一眼看到谁在等锁、等谁
  🐛 问题修复
  - 🐛 fix(ai-chat): 内置 AI 解释和优化 SQL 时不再只复述原句，也不再编造查询结果
  - 🐛 fix(session): 修复 OceanBase Oracle 租户会话列表与终止失败，并修正“只看执行中”筛选不生效
  - 🐛 fix(driver-release): 已发布驱动指纹闸门按数据源描述表声明的平台比对
  - 🐛 fix(db-icons): Trino 补上官方图标，自定义数据源图标重画
  - 🐛 fix(update): 更新确认只针对其他 GoNavi 窗口，自家后台进程不再计入“其他实例”
  - 🐛 fix(connection): 导入连接跳过已存在的连接，分组管理支持只删除所选连接
  - 🐛 fix(update): 更新时关闭其他实例不再逐个等待，确认后不用转圈好几秒
  - 🐛 fix(driver-release): 驱动指纹闸门的运行时探测失败时重试，不再被偶发启动失败卡住发布
  - 🐛 fix(release): 可选驱动资产校验按数据源描述表声明的平台要求资产
  - 🐛 fix(release): 可选驱动资产校验按数据源描述表声明的平台要求资产
  - 🐛 fix(driver-manager): 驱动重装确认弹窗在确认后立即关闭，不再转圈到安装结束
  ⚡ 性能优化
  - ⚡️ perf(table-designer): 再次打开表设计直接显示上次的结构，双击进表时提前发出元数据请求
  - ⚡️ perf(table-designer): 首次进入表设计不再重复请求，Ctrl+点击时提前取字段
  - ⚡️ perf(query-editor): 新开查询页复用已加载的对象元数据与 schema 列表，不再每次转圈等待
  🔧 其他变更
  - 🔧 chore(release): 准备 v1.1.1 发布
  - 🔧 chore(wails): 同步执行计划实测模式的 TS 绑定
  - 🔧 chore(wails): 同步长事务提醒与会话监控能力的 TS 绑定
  - 🎨 style(session): gofmt 对齐 sessionSpec 字段
  - 🔧 chore(wails): 同步锁等待面板与连接包导入跳过计数的 TS 绑定
