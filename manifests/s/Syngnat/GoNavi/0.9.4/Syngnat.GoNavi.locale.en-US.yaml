ReleaseNotes: |-
  ✨ 新功能
  - ✨ feat(connection-modal): 补齐 Nacos 测试进度与取消交互
  - ✨ feat(nacos): 支持连接测试进度与取消
  - ✨ feat(ssh): 自动识别并确认隧道服务器身份
