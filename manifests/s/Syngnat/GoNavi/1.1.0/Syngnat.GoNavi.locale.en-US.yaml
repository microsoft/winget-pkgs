ReleaseNotes: |-
  > 💖 赞助商 · 華龍算力：deepseek,glm,kimi降至3.8折，DeepSeek谷价仅1.9折！
  > 華龍算力AI中转站活动加码：充88得100，每人限1单哦
  ✨ 新功能
  - ✨ feat(change-preview): 驱动代理转发变更预览，非 SQL 数据源展示实际发出的请求
  - ✨ feat(typesense): 接入 Typesense（0.20 – 29，按 schema 翻译 filter_by 的数据网格与 REST 控制台）
  - ✨ feat(meilisearch): 接入 Meilisearch（0.20 – 1.x，REST 控制台与按索引设置选路的数据网格）
  - ✨ feat(firebird): 接入 Firebird（2.5 – 5.0，纯 Go 驱动，按语句硬提交避免元数据锁）
  - ✨ feat(yashandb): 接入崖山数据库（purego 绑定 yacli 客户端，复用 Oracle 元数据）
  - ✨ feat(gbase8s): 接入 GBase 8s（Informix 内核，经用户安装的 CSDK 以 ODBC 连接）
  - ✨ feat(gbase8c): 接入 GBase 8c（openGauss 内核、sha256 / sm3 认证与 A / B / PG 兼容模式）
  - ✨ feat(gbase8a): 接入 GBase 8a（MySQL 协议、真正生效的事务与 HASH 索引表设计）
  - ✨ feat(zookeeper): 接入 ZooKeeper（znode 子树浏览、zkCli 风格控制台与 3.4 / 3.5+ 两档驱动版本）
  - ✨ feat(etcd): 接入 etcd（键前缀浏览、etcdctl 风格控制台与 v2 / v3 两档驱动版本）
  - ✨ feat(presto): 接入 Presto（自写 REST 协议客户端、三档驱动版本并复用 Trino 方言）
  - ✨ feat(influxdb): 接入 InfluxDB（InfluxQL / Flux / SQL 控制台、line protocol 写入与三档驱动版本）
  - ✨ feat(weaviate): 接入 Weaviate（GraphQL / REST 控制台、多租户与三档驱动版本）
  - ✨ feat(opensearch): 接入 OpenSearch（复用 ES 驱动、SQL / PPL 只读控制台与三档驱动版本）
  - ✨ feat(timescaledb): 接入 TimescaleDB 并补齐描述表数据源的视图定义、表概览与表统计
  - ✨ feat(greptimedb): 接入 GreptimeDB（MySQL 协议、TAG/FIELD/TIME INDEX 元数据与两档驱动版本）
  - ✨ feat(questdb): 接入 QuestDB（PostgreSQL 协议、原生元数据与三档驱动版本）
  - ✨ feat(sidebar): 描述表数据源可声明侧栏不显示的对象分组
  - ✨ feat(datasource): 测试连接提示手动选择的驱动版本与服务端不匹配
  - ✨ feat(connection-modal): 连接表单显示驱动版本选择并回填已保存的档位
  - ✨ feat(sql-dialect): 描述表数据源按兼容家族生成标识符引号、方言判定与分页语法
  - ✨ feat(cockroachdb): 接入 CockroachDB 与 KWDB（PostgreSQL 协议、时序库与按版本档位适配）
  - ✨ feat(connection-modal): 连接配置携带驱动版本档位
  - ✨ feat(datasource): 驱动管理、测试连接与 DDL 方言接入描述表，并新增驱动版本选择字段
  - ✨ feat(datasource): 新增数据源描述表并以 TiDB 打通驱动代理接入链路
  - ✨ feat(ai-chat): 内置 AI 可调用只读数据库工具，写操作只给出语句、不执行
  - ✨ feat(ai-agent): 每回合把 GoNavi 角色提示词与用户自定义提示词交给模型，所有供应商生效
  - ✨ feat(ai-chat): 内置 AI 登录等待期间显示设备码，浏览器返回后立即完成登录
  - ✨ feat(deeplink): 浏览器授权页可通过 gonavi:// 链接唤醒正在运行的 GoNavi
  - ✨ feat(workbench): 重启后恢复全部标签页、AI 面板与上次的 AI 对话
  - ✨ feat(ai-chat): 用动态上下文圆环取代进度条，按真实构建结果显示各部分占用
  - ✨ feat(ai-chat): 绑定的选中内容以胶囊显示并随消息保存，支持引用回答片段
  - ✨ feat(ai-chat): 内置模型读图改为桌面端本地识别文字，并支持在设置中管理
  - ✨ feat(ai-chat): 接入 GoNavi AI 供应商登录，首次登录前展示使用准则
  - ✨ feat(ocr): 新增桌面端图片文字识别组件的安装与管理
  - ✨ feat(ai-service): 新增上下文试算接口，按真实构建器计算将发送的内容
  - ✨ feat(runharness): 附件文本并入模型上下文并为小窗口收敛工作区快照
  - ✨ feat(ai-service): 接入 GoNavi 内置免费 AI 客户端
  - ✨ feat(sidebar): 设置中心与同步、导入导出工作台显示时自动折叠左侧树
