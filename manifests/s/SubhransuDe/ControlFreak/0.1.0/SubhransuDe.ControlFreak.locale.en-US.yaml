ShortDescription: Local computer-use MCP server for Windows with screenshots, OCR, window control and mouse and keyboard input.
Description: |-
  ControlFreak is an MCP server that an AI client such as Claude Code or Codex starts over STDIO.
  It captures displays and windows, reads text with local Windows OCR, manages windows and virtual desktops, and sends mouse and keyboard input.
  It has no network code, telemetry or update check.
  Setup can add ControlFreak to supported MCP clients. A silent install configures no clients unless /CLIENTS is passed.
