Description: |-
  Spider Shield blocks ads, trackers, malware and phishing for every app on this device, and its block lists update by themselves. Shield is free because it shares your connection. Spider's customers load public websites through it, so those sites see your IP address. Nothing is blocked or shared until you turn on Shield in the app. After that it runs in the background from startup, even with the window closed or no one signed in, and uses some of your data, battery and speed. Sharing pauses on mobile connections your system detects. Turn off Shield anytime to stop protection and sharing. To remove it, choose Uninstall Spider Shield from the Shield icon's menu, or remove the package with your package manager.
