ShortDescription: Share one keyboard and mouse across Windows, macOS and Linux computers
Description: |-
  ScreenMouse lets one keyboard and mouse control several computers over the local network.
  Move the cursor past the edge of one screen and it continues on the next computer.
  Mouse movement is sent as an 11-byte message, so the added delay is well under 1 ms on a wired network.
  No server/client roles, one-time 4-digit pairing code, TLS 1.3 encryption, clipboard sharing and file drag-and-drop.
  Free for the first month (up to 2 months).
