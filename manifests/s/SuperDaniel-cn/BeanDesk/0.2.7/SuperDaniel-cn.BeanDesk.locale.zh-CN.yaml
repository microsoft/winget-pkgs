PackageIdentifier: SuperDaniel-cn.BeanDesk
PackageVersion: 0.2.7
PackageLocale: zh-CN
ShortDescription: 本地优先的复式记账桌面软件。
Description: BeanDesk 是一款运行在本地的复式记账桌面软件。不设云端账号，无需自建数据库，账目与原始凭证完全由自己保管。可结合 AI 协助日常录账与合规核查，即时生成规范的对公财务报表，并提供本地与远端加密备份。
Tags:
- beancount
- 会计
- 记账
- 财经
- 金融
ReleaseNotes: |-
  BeanDesk v0.2.7 新增会计准则预设、既有账本接管与合规规则变更审核。

  - 初始化、升级账套结构或接管既有 Beancount 账本时，支持显式选择会计准则与记账币种（zh-CN / CNY 或 en / USD）
  - 自定义合规规则变更需在桌面端对比差异并审核批准后方才生效，支持一键恢复上次批准的版本
  - MCP 卡片语言自动跟随账套的会计准则
  - 消除报表空闲重渲染，统一界面与用户手册的财务术语

  安装包覆盖 macOS、Windows 和 Linux。此版本不提供移动端构建。
