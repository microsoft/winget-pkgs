ReleaseNotes: |-
  BeanDesk v0.2.7 adds accounting standard presets, existing Beancount ledger adoption, and rule review protection.

  - Select accounting standards and currency (zh-CN / CNY or en / USD) when initializing, upgrading, or adopting an existing Beancount ledger
  - Require desktop review and approval before custom TOML policy rules take effect, with one-click diff view and rollback
  - Match MCP card language to the ledger's accounting standard
  - Stop idle report rerenders and unify accounting terminology across the app and handbook

  Installers for macOS, Windows, and Linux. This version has no mobile build.
