ShortDescription: A minimal, private web browser built on Chromium, with ad and tracker blocking built in.
Description: |-
  Bare is a small Chromium browser written in Rust: tabs, an address bar, and nothing else.
  Ad and tracker blocking is built in (uBlock Origin-style filter lists), browsing is HTTPS-only, and
  there are no accounts, telemetry, AI features or news feed. Updates are signed and install themselves.
