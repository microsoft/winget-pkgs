ShortDescription: "Ultra-lightweight native Rust PC & SSD storage cleaner for Windows 10 and 11 with unlimited free Temp & Browser Cache clean and 7-Day Undo Quarantine (2–10 GB budget, 5 GB default)."
Description: "SWEEPR Cleaner is a modern, ultra-lightweight PC cleaner and storage optimizer written in native Rust (6.76 MB installer, <40 MB active RAM). SWEEPR Free: Unlimited Temp & Browser Cache Clean (5 rules on Windows/macOS/Linux, moved to OS Recycle Bin); Pro unlocks Deep GPU/AI/Dev Caches (DirectX 12, Vulkan, NVIDIA DXCache, AMD), SHA-256 Duplicates, Uninstaller, Scheduler & 7-Day Undo Quarantine (configurable 2–10 GB disk budget, 5 GB default, same-volume O(1) move; OS Recycle Bin fallback if file exceeds budget; excludes shredded files, browser DBs, and registry edits). Runs on-demand with optional tray/scheduled cleaning and Zero-Telemetry Offline Mode toggle (on by default; opt-in diagnostics off by default)."
