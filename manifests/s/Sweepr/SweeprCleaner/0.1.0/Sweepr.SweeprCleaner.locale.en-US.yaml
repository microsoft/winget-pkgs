ShortDescription: Ultra-lightweight native Rust PC & SSD storage cleaner for Windows 10 and 11 with a 7-day undo safety net.
Description: SWEEPR Cleaner is a modern, ultra-lightweight PC cleaner and storage optimizer written in native Rust (<7 MB binary, <40 MB active RAM). Cleans orphaned Windows Update caches, GPU shader caches (DirectX 12, Vulkan, NVIDIA DXCache, AMD), browser clutter, chat apps, and developer scratch disks in under 60 seconds. Features zero background daemons, zero telemetry, smart uninstaller, duplicate finder, private file shredder, and a 7-day Undo Quarantine rollback safety net.
