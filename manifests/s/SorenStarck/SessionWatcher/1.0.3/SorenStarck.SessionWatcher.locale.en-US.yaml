ShortDescription: Usage limits, reset times and estimated cost for Claude Code, Codex, Cursor, GitHub Copilot, Gemini CLI and 15 more AI coding tools, in the Windows taskbar.
Description: |-
  SessionWatcher is a desktop usage tracker for AI coding tools. On Windows 11 the readout sits inside the taskbar; on Windows 10 it sits in a small window beside it. Click it, or press Ctrl+Shift+U, to see each tool's 5-hour and weekly limits, when they reset, whether you are on pace, and an estimated cost. Notifications fire at 70% and 90% of a limit and when it resets.
  It tracks 20 tools, including Claude Code, Codex, Cursor, GitHub Copilot, Gemini CLI, Antigravity and opencode, and can show several Claude and Codex accounts side by side. It reads usage from the logins your tools already keep on the PC; it does not read your code or your conversations. Licence checks send the licence key and device details to sessionwatcher.com.
  Paid app with a free trial: the first 7 days are free, need no card and include every Pro feature. After that it needs a licence key bought on sessionwatcher.com: Solo (one of Claude Code, Codex or Cursor) or Bundle (all three) as one-time purchases for 1 device, or Pro (all 20 tools, up to 5 devices) yearly or one-time. Prices start at $6.99 one-time until October 31, 2026 and $8.99 after; see sessionwatcher.com/pricing. One licence key works on Mac and Windows. 14-day refund window.
