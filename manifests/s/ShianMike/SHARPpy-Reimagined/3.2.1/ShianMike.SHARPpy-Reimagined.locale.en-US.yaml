ReleaseNotes: |-
  More reliable maps and soundings, with clearer recovery and safer saved settings.
  Windows downloads: Installer · Portable ZIP
  The app includes Python and the scientific backend. Extract the complete portable folder before running it.
  - More reliable forecast changes: Forecast changes recover while older requests stop. Shared downloads keep running for panels that need them; leaving Model Viewer pauses automatic preloading. Failed downloads stop their remaining transfers, and provider failures report their original cause.
  - Release unused rendering memory: Switching between globe and flat maps releases unused graphics resources. Completed and failed sounding renders release unused image buffers before the next request. Scientific values, profile edits and lossless HD and UHD exports keep their existing quality.
  - Every sounding time: Choose any time in an imported forecast file. Each time keeps its own edits and undo history, and exported charts use the selected profile. Typed station IDs survive source-tab changes.
  - Clearer Map Controls And Recovery: Controls use orange hover feedback throughout both themes. Maps remove the heavy road network for clearer weather and labels. Manage forecast downloads in one panel with animated hour lists; the Fast/Smooth icon sits beside Loop. Drawn maps stay available through recoverable rendering errors. Retry failed maps, imagery and overlays. Pan with arrow keys and press Enter to inspect the map’s centre.
  - Settings stay usable: If device storage is unavailable or full, workspace settings keep working for the current session. Long release highlights scroll with their close controls in reach. Unchanged map labels reuse their layout during forecast playback.
  - Updated bundled security components: The Windows app includes a maintained Python and TLS runtime, updated libraries for network access and weather files, and signed installer checks. Downloads include checksums and a detailed component inventory.
  Downloads include SHA256 checksums, signed updater metadata and a CycloneDX runtime inventory. Verify provenance with gh attestation verify PATH-TO-ASSET --repo ShianMike/SHARPpy-Reimagined.
  Windows executables are not Authenticode-signed; SmartScreen may warn on first launch. The in-app updater verifies its separately signed installer payload.
  Native presentation FPS remains unverified on hosted Hyper-V Video. The two-hour stability workload is removed and excluded. The SBOM documents its limits for statically linked libraries and system components; all-target Linux GTK advisories remain documented with target-aware Windows evidence.
  Full changelog · Performance measurements and limits · v2.0.0 Legacy GUI
