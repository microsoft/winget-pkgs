ReleaseNotes: |-
  A faster workspace with clearer downloads and more reliable caching.
  - Faster maps and soundings: Upcoming forecast images are prepared before playback advances. Repeated sounding requests reuse downloaded model data and prepared rendering work.
  - More control over downloads: See which forecast hours are saved and which are ready to play. Check the cache, retry missing hours, or stop a model-sounding download. Stopped downloads no longer block new requests.
  - More reliable caching: Forecast caches have size and age limits. Active downloads stay protected, and failed sounding downloads clean up their temporary files.
  - A simpler Overview: Start with Model Viewer, Live Tracking or Soundings. Model availability and recent activity stay close at hand in expandable rows.
  - Release highlights in the app: See a short What’s new popup after a version change, and revisit the highlights anytime in Settings → Updates.
  Windows downloads: Installer · Portable ZIP
  Full changelog · Current screenshot tour · SHA256 checksums
  The installer includes Python and the scientific engine. For the portable ZIP, extract it and keep the backend folder beside SHARPpy-Reimagined.exe. Saved preferences are kept.
  Windows SmartScreen may warn because these executables are not Authenticode-signed. Updater signatures and GitHub build provenance are supplied; verify downloads against the published checksums.
  The final old Qt GUI remains available as v2.0.0 Legacy.
