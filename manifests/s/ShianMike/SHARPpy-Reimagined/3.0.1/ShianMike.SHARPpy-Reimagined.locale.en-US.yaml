ReleaseNotes: |-
  v3.0.0 patch — build v3.0.1. This page keeps the v3.0.0 title; the installer, app, tag, and updater use 3.0.1 so later releases can be recognized correctly.
  Recommended Windows download: SHARPpy-Reimagined-v3.0.1-windows-x64-setup.exe
  Changes
  - Automatically check for stable updates on launch, hourly while the app is open, and after reconnecting. Choose Update now or Later; check manually under Settings → Updates. Nothing installs until you click.
  - Download and verify the signed installer, save preferences, and upgrade the existing installation. The app restarts to finish installation.
  - Add a fullscreen button beside Point details, plus F11 and Escape support in the desktop app.
  - Set the minimum window size to 1280 × 800.
  - Match SPC outlook tooltip formatting to observations and storm reports.
  - Simplify the Updates page and improve error/update notices, spacing, icons, and buttons.

  Installing this patch
  The original v3.0.0 download has no updater. Run this installer once to gain in-app updates; subsequent higher versions can update through the app. Finish your work before updating. Saved preferences are kept. Updates download a complete installer.
  The portable ZIP includes the same app and scientific backend. Extract the entire folder and keep its backend folder beside the executable. Python is bundled.
  Updater signatures and Windows code signing are separate: Windows SmartScreen may still warn on first launch. Verify downloads against SHARPpy-Reimagined-v3.0.1-SHA256SUMS.txt; GitHub build provenance can also be checked with gh attestation verify PATH-TO-ASSET --repo ShianMike/SHARPpy-Reimagined.
  Patch PR #74 · Detailed changelog · User guide
  Legacy GUI: v2.0.0 Legacy remains available with its original Windows downloads.
