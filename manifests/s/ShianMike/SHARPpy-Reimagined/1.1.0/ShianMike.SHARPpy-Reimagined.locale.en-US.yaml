ReleaseNotes: |-
  Recommended Windows download: SHARPpy-Reimagined-v1.1.0-windows-x64.zip
  Extract the ZIP and run SHARPpy-Reimagined.exe inside its folder. This one-folder build starts substantially faster than the self-extracting portable executable.
  The file ending in portable.exe is retained for single-file convenience and starts more slowly because it self-extracts at launch.
  These executables are not code-signed, so Windows SmartScreen may warn on first launch. Check a download against the published SHA256SUMS.txt, and verify GitHub build provenance with gh attestation verify PATH-TO-ASSET --repo ShianMike/SHARPpy-Reimagined.
