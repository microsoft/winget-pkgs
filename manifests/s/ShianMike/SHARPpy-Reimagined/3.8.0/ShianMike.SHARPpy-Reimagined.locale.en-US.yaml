ReleaseNotes: |-
  Winter soundings: switch between Severe and Winter. Winter retains the large Skew-T, hodograph, wind plots and omega meter, with precipitation type/source, snow growth, icing, PBL diagnostics, fog/drizzle checks and four low-level profiles.
  Forecast GIFs: select hours, resolution and speed beside Smooth/Fast. All selected hours load before lossless frame capture and background GIF encoding. The full map, forecast times and color scale remain visible, with smooth pixels and no transition blending.
  Images for other applications: render Severe or Winter PNGs with sharpmod-render, optional JSON metadata, and the new integration guide. The CLI locator is hidden unless explicitly requested.
  More Rust calculations: height charts and height-aligned profile comparisons use the native engine through existing interfaces.
  Session cleanup: desktop shutdown waits for workers, retries locked temporary files and recovers owned sessions left by crashes while preserving active sessions, saved exports and reusable data.
  README: the feature summary and screenshot gallery now focus on v3.8.0, with a current Winter sounding.
  Included dependency updates: ecCodes 2.50.1 (#156), Ruff 0.17.4 (#155), and softprops/action-gh-release 3.0.4 (#154, pinned to commit 8a0cd651e5b2365bd640854a3fa5dfc70e4875f3).

