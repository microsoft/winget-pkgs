ReleaseNotes: |-
  - Australian radar, 2–5 km updraft tracks and clearer sounding controls.
  - Search 67 Australian radar sites in Live Tracking and display MRRL Base Reflectivity or Doppler Velocity at the lowest available elevation. Source scan times, missing coverage and range folding remain distinct.
  - View 1-hour and 3-hour maximum updraft helicity for 2–5 km AGL on HRRR and supporting models, using the shared 0–400 m²/s² colour table. The 3-hour field starts at F003 and requires all three hourly maxima.
  - Toggle OpenStreetMap roads per panel, read full storm-report hazard names and use consistent surface-observation symbols.
  - Choose sounding models, runs and times in compact glass popups. Switch height charts and diagnostics with dropdowns, edit one pressure level at a time, and undo or redo changes.
  - Read clearer labels and helper text over bright maps. Workspaces load when first opened and retain the map after its first visit.

  The completed Rust migrations are documented separately as the v3.4.2 migration baseline, included in this v3.5.0 release. There is no separate v3.4.2 binary release. Rust now handles more weather-provider work, resumable model transfers, map processing and sounding calculations through the existing interfaces.

  The final legacy Qt interface remains available in v2.0.0 Legacy.
