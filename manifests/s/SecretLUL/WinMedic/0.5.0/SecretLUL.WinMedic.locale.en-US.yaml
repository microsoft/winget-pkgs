ShortDescription: Finds out why Windows acts up and repairs it, so you do not have to reinstall
Description: |-
  Updates that fail, no internet, a slow or crashing PC: WinMedic finds out
  why and repairs it, so you do not have to reinstall Windows. It checks system
  files and the component store, Windows Update, services, the network, disks,
  crash reports, hardware errors and leftovers of removed programs.

  Easy mode shows how the PC is doing and what Repair will do; Advanced mode
  lists every finding with its evidence. Nothing changes until you click
  Repair, and a restore point is created first, so every change can be undone.
  A single program: nothing to install, nothing else to download.
