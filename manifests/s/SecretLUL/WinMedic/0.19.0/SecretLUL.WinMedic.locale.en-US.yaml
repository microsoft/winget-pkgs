ReleaseNotes: |-
  WinMedic v0.19.0
  A friendlier start. A first start opens with a short introduction, Settings
  comes in five pages, and WinMedic can share anonymous usage data, but only
  if you agree. A scan now waits for the component store analysis to finish
  instead of dropping it, and its bar keeps moving while it does.
  New
  - An introduction on the first start: three short pages before the
    window itself: what WinMedic does, the two buttons that do it (Scan now,
    then Repair), and what you can leave alone (Advanced mode, Settings).
    Skip is as big as Next. Esc skips, and Enter and the arrow keys
    read on and back. Help -> Show the introduction shows the same pages at
    any time.
  - Settings, one page at a time: the Settings view is five short pages
    now, picked from a list on the left: Repairs, Undo changes, Scans,
    Logs and General. A page shows only a handful of settings, so the
    small window of Easy mode is no longer filled with small print. Each
    setting has one line of explanation. The arrow keys walk the settings and
    turn the page with them, PgUp and PgDn turn the pages, and B goes to
    the registry backups and back. The page you pick comes in the way the two
    views do.
  - Anonymous usage data, only if you agree: after the introduction of a
    first start, WinMedic asks once whether to share it. It stays off until
    you click Yes, share. Esc counts as No, thanks, and no other key
    answers. With it on, the window sends a short report after each finished
    scan and after each repair that repaired or failed at something: the
    WinMedic version, the Windows build number, Easy or Advanced mode, how
    long the scan took, the health score, and for each check only counts
    (found, repaired, failed). It never sends names of devices, files or
    folders, your user or computer name, or the text of a finding.
  - Where to see it: Settings -> General -> Share anonymous usage data.
    Ticking it opens the page that says what is sent and where it goes, and
    Show what is sent shows a report before anything goes out. Unticking it
    takes effect at once. Every report that was sent is also written to
    usage-data.log in the log folder.
  - Where it goes: to the developer's own server in Germany, by way of
    Cloudflare. No analytics company is in between. Like every server, both
    see your IP address. The developer's server does not write it down and
    does not pass it on to the statistics.
  - A long scan says that all is well: after 30 seconds, Easy mode's scan
    page says "All good, WinMedic is still checking. The last checks take the
    longest." under Cancel. Below that line it names the checks still
    running when one or two are left, such as "Still running: System & Cache
    Cleaner.", and how many are left otherwise.
  - The component store is checked to the end: a scan gave the analysis
    of the component store two minutes. On a PC where it takes longer, the
    scan dropped it without a word and could miss what the cleanup would
    free. The analysis now gets up to 15 minutes. When it still does not
    finish, the scan says "Component store not checked" and gives the reason
    in the scan log.
  - A bar that keeps moving: a scan used to reach 99 % within seconds and
    then wait there for the component store analysis. WinMedic now remembers
    how long the last analysis took and moves the bar by the clock. The step
    says how long it took last time, for example "took 4m 52s last time".
  - Keys on the buttons: a button that has a key now shows it as a small
    key cap after its label, for example Scan now S, Repair F,
    Cancel Esc and Export report E. Until now the key was in a
    tooltip, which only appeared when you rested the pointer on the button. The
    mode button no longer has "(F7)" in its label.
  - Easy mode points to Advanced mode once: the lines below the buttons
    say only what happened, such as "1 repair did not work.", "1 more needs
    your decision." or "Could not check X.". One link below them, "Show
    details in Advanced mode (F7)", replaces the pointer each line used to
    carry.
  Good to know
  - Nobody who already uses WinMedic is asked about usage data, and
    nobody is asked twice. For everyone but a first start, the switch under
    Settings -> General stays off until you tick it.
  - --scan, --auto-fix, the background scan and a simulation send
    nothing, whatever the switch says.
  - The introduction opens by itself only on a first start: on a PC with
    no WinMedic settings and no saved scan. An update does not show it.
    Help has it for everyone else.
  - A scan can take longer now on a PC with a slow component store
    analysis. It takes as long as the analysis does, about five minutes on
    the developer's PC. Easy mode still says a scan takes a minute or two. A
    scan can be cancelled as before.
  - The bar is an estimate: it counts with the time the last analysis
    took, or with two minutes if there was none yet. When the analysis takes
    longer than last time, the bar waits until it is done.
  - A key cap shows only where the key does what the button does:
    Update now has none in Settings, where U restores a snapshot, and
    Cancel has none while a filter is set, because Esc clears the filter
    first.
  - With "Animation effects" switched off in Windows, the pages of
    Settings do not move, as with the rest of the window.
  - If you tried a preview of this version, WinMedic offers you this
    release as an update, as usual.
  Full changelog: v0.18.0...v0.19.0
ReleaseNotesUrl: https://github.com/SecretLUL/WinMedic/releases/tag/v0.19.0
InstallationNotes: |-
  WinMedic repairs system components, so the repair paths need Administrator
  rights. Start it from an elevated terminal, or run "winmedic --elevate" to
  raise a UAC prompt. Diagnostics alone run fine without elevation.
