PackageIdentifier: shizgnit.tachikoma
PackageVersion: "0.1.0"
PackageLocale: en-US
Publisher: shizgnit
PackageName: tachikoma
License: MIT
ShortDescription: Terminal-based filesystem reconnaissance tool (size-aware directory tree)
Description: |
  Tachikoma is a terminal-based filesystem reconnaissance tool that renders an interactive, size-aware directory tree. It highlights space hogs at a glance with per-directory totals, color-coded sizes, and fast recursive scanning of large trees.
PublisherSupportUrl: https://github.com/shizgnit/tachikoma/issues
ReleaseNotes: |
  - Initial release
  - Interactive curses TUI with size-aware directory tree
  - Recursive scanning with live progress and cancellation
