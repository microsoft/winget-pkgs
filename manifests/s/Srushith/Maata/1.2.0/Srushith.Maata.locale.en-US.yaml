ShortDescription: Talk instead of type in any Windows app, with AI cleanup.
Description: |-
  Maata is voice typing for any Windows app. Press Win+Alt+Space, speak, press it again, and your words appear where your cursor is.
  Optional AI cleanup removes filler words, keeps only your self-corrections, fixes punctuation and turns spoken lists into bullet points.
  Supports 50+ languages. Uses OpenAI's speech recognition with your own API key, so there is no subscription; you pay OpenAI only for what you use.
