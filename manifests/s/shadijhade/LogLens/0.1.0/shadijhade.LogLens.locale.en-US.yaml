ShortDescription: Fast desktop log viewer and analyzer for Serilog text logs
Description: |-
  LogLens reads a folder of Serilog text logs into one timeline and shows what is in it:
  which messages dominate, which exceptions are thrown from where, and when.
  It groups messages into patterns and exceptions by throw site, filters by level, text,
  time range, pattern and exception, follows logs as they are written, and exports what is shown.
