PackageIdentifier: Songsta.Songsta
PackageVersion: 1.8.0
PackageLocale: de-DE
ShortDescription: Ein Musikplayer für die Musik, die dir gehört, mit deinen Dateien, Jellyfin und Navidrome in einer Bibliothek.
Description: |-
  Das Gefühl einer Streaming-App, für deine eigene Sammlung. Deine Dateien, Jellyfin und Navidrome in einer Bibliothek: Hi-Res-FLAC, synchronisierte Songtexte, Mixe aus deinem eigenen Hören und die Lautsprecher zu Hause.
  Eine Handy-App für Android und ein optionaler Sync-Dienst auf deinem eigenen Server halten beide auf dem gleichen Stand.
  Kostenlos und Open Source, ohne Konto und ohne Werbung.
Tags:
- audio
- flac
