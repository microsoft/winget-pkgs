ReleaseNotes: |-
  Note: Due to site changes and additions, this is a highly recommended update for all users.
  Note: For users of MPF.UI, you will notice that there are additional DLL files included in the release package. Please extract these as well. They are included due to a specific bug in .NET 11 and WPF (the UI framework used on Windows). These will hopefully be removed for the next release, but this is an upstream .NET issue and not something that I can control.
  UI Builds
  Windows x64 - Recommended for all Windows users
  Windows x86 - Only needed for older machines
