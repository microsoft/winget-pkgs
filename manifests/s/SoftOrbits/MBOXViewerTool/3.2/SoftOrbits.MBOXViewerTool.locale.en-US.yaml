ShortDescription: MBOX viewer for Windows 10 and 11 that opens Google Takeout exports, Apple Mail mailboxes and whole Thunderbird profiles read-only, with a folder tree and a full-width reading pane.
Description: |-
  This MBOX viewer for Windows 10 and 11 is for anyone holding an .mbox file, a Google Takeout export or a mailbox copied off a retired computer, who simply wants to read it. MBOX Viewer Tool opens the archive where it lies, shows the folders and messages, and never writes to the file, so the archive stays exactly as it was.

  How to use MBOX Viewer Tool
  1. Install the package and launch the program.
  2. Open one .mbox file, or point the program at a whole Thunderbird profile directory.
  3. Select a folder in the tree to list its messages by subject, sender, recipient and date.
  4. Search by Subject, From or To and set a date range to narrow a long folder.
  5. Click a message to read it in full, with HTML formatting and inline images.
  6. If you need a copy, save the open message as EML, PDF or HTML, or print it.

  Trial note: the free trial lists every message and opens 3 a day freely, then each new one waits behind a countdown reminder until a limit page appears after 10. A license lifts the daily limit and unlocks saving, printing and attachments.

  What it handles
  - Thunderbird mailboxes with no extension, sitting next to their .msf index files and .sbd subdirectories.
  - Inbox, Sent, Drafts, Deleted and Junk, recognized by name.
  - Gmail archives from Google Takeout, including the parts Takeout splits off past 2 GB.
  - Big folders, which start listing in portions while the file is still being scanned.
  - HTML bodies and inline pictures, rendered instead of shown as encoded text.
  - An interface in 16 languages.

  Outside its scope
  As an MBOX viewer it only reads, so there is no batch export to PDF or PST and no import back into a mail client. Search covers headers, not the message body.

  Who it is for
  People who downloaded their Gmail and found that Windows has nothing to open it with. Help desk staff checking a mailbox someone handed over before deciding what to migrate. Anyone who needs an MBOX reader that leaves evidence and backups untouched, or who is looking up how to open MBOX file archives on a PC without setting up an account.

  Questions

  Can Thunderbird read MBOX files?
  Yes, but only after the mailbox is imported into a profile, which copies the data and can change read flags. This program reads the same file in place without importing anything.

  How do I get an MBOX file from Gmail?
  Request your mail through Google Takeout, which delivers Gmail as .mbox and splits exports larger than 2 GB into parts. Each part opens in the MBOX viewer on its own.

  Can I convert MBOX to PDF with it?
  Only one message at a time: open it and save it as PDF. A whole folder in a single run is a job for a dedicated converter.
