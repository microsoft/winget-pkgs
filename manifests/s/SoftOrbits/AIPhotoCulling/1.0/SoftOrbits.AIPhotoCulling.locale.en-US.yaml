ShortDescription: Photo culling software for 64-bit Windows 10 and 11 that flags blurred, soft, blinking and badly exposed frames in a shoot, so a photographer reaches the keepers faster.
Description: |-
  AI Photo Culling Software is photo culling software for 64-bit Windows 10 and 11 that makes the first sorting round over a fresh shoot. It opens a folder of RAW or JPEG frames, rates each one from 0 to 100 and names the reason when a frame looks weak, so your attention goes to the shots still in the running. Analysis runs on the CPU with local AI models, and the pictures never leave the machine.

  How to use AI Photo Culling Software
  1. Run the program and choose Open Folder. Thumbnails fill in while frames are analyzed, so the review can begin before the whole card is read.
  2. Read the suggestion under each thumbnail: Keep, Reject or Maybe, next to the overall score.
  3. Hover over a score to see the beauty and composition subscores and the technical reasons that lowered it.
  4. Switch between grid and loupe with G and E. The loupe adds face focus and a histogram.
  5. Mark frames with P to keep, X to reject and U for maybe, give 1 to 5 stars, fold a burst with S and undo with Ctrl+Z.
  6. Export the session: keepers are copied to a _Selected folder, rejects go to _Rejected, and marks can be written to XMP sidecars.

  Trial note: the free trial analyzes and displays the whole folder, while export is limited to 15 frames per session across copies, XMP files, moves and deletion. A license removes that limit.

  What it handles
  - Motion blur and a soft subject, measured on the subject itself, so a portrait with a blurred background at f/1.4 keeps its score.
  - Closed eyes and faces left in shadow.
  - Backlit, too dark or blown out subjects. Silhouettes get their own category.
  - Screenshots, scans and receipts, set apart as not a photo and tagged Maybe.
  - Bursts of near-identical frames, grouped into stacks with a few strong candidates picked by AI.
  - 23 RAW formats such as CR2, CR3, NEF, ARW, DNG, ORF and RAF, read through the embedded preview, plus HEIC, HEIF, JPEG, PNG and WebP. Video files are put aside and not analyzed.

  Who it is for
  Wedding, event and sports photographers who come home with thousands of frames and want a shortlist before importing into an editor. Hobbyists who shoot bursts of children or birds and end up with too many near copies. The photo culling software also helps as photo sorting software for a trip or family folder, and it never deletes a file without a confirmed step from you.

  Questions
  What is photo culling?
  It means going through a shoot once and deciding which frames deserve editing before any retouching starts. An AI pass speeds that round up by finding the technical failures for you.

  What is a good way to cull photos?
  Drop the clearly broken frames first, then choose among the clean ones. This culling software works in that order: a technical fault lowers the score before anything else, and beauty and composition only rank frames that passed.

  How much does AI culling cost?
  The free version scores every frame of a folder, so you can judge the results on your own shoot before paying. Exporting more than 15 frames per session needs a lifetime, 1-year, monthly or business license.
