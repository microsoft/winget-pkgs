ShortDescription: QIF to QBO converter for Windows that rewrites Quicken .qif and QuickBooks .iif exports as .qbo files for the Web Connect import, using a bank list stored inside the program and no internet connection.
Description: |-
  QIF to QBO Converter Software is a QIF to QBO converter for Windows built for the owner of a small business who has outgrown Quicken and now keeps the books in QuickBooks. QuickBooks will not read a .qif export, so the program rewrites it as a .qbo file carrying the bank details QuickBooks checks during import. Everything runs on the local PC.

  How to use QIF to QBO Converter Software
  1. Add .qif files by dragging them in, or use Add Files or Add Folder for a whole set of account exports.
  2. Select a file and look at the preview, which shows the transaction count, the detected encoding and the first rows.
  3. Press Lookup, type a few letters of your bank name and choose it from the list.
  4. If the bank is missing, enter the FID by hand or use the fallback suggested in the panel.
  5. Keep QBO as the output format.
  6. Choose a target folder and press Start.
  7. In QuickBooks Desktop, open the Utilities menu under File and import the result as a Web Connect file.

  Trial note: the free trial writes up to 20 transactions per document into a real .qbo, with no watermark and no nag screen. A license removes the 20-transaction cap.

  What it handles
  - QIF exports from Quicken and other money programs, including bank, credit card and investment sections.
  - IIF files from QuickBooks Desktop, recognized by their content even when saved as .txt.
  - A directory of 6839 institutions inside the program, 5790 of which carry every field a .qbo header needs.
  - Manual FID and INTU.BID fields for users who already know their numbers.
  - A refusal to create a .qbo without a valid FID, with the error text displayed exactly as produced.
  - Cyrillic payees transliterated and CJK text stored as numeric references, since QBO uses the CP1252 code page.
  - Transaction IDs that do not shift when a line is added at the top of a file, so QuickBooks does not take the same statement in twice.
  - CSV and PDF as extra output formats.

  Before you buy
  Check your QuickBooks release first. A copy more than three years old will not import a .qbo, whichever program wrote it.

  Who it is for
  Small business owners moving their history from Quicken to QuickBooks, bookkeepers asked to bring years of client QIF exports into a QuickBooks company, and anyone who wants to convert QIF to QBO without uploading bank data to a website.

  Questions

  Is there a QIF to QBO converter online?
  Web services exist, but they need your financial file uploaded first. This program does the same job on your own PC with no connection.

  Is it also an Excel to QBO converter?
  No, it reads .qif and .iif files only. Export the data from your old money program as QIF first, then run the qif to qbo step here.

  What kind of QBO file converter is it?
  One that builds a .qbo from QIF or IIF input, with CSV and PDF as side outputs. Opening an existing .qbo is outside its job.
