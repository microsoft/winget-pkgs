ShortDescription: MSG to EML converter for Windows that rewrites Outlook .msg files as standard .eml messages in batch, and turns .eml back into .msg, with no Outlook installed.
Description: |-
  This MSG to EML converter for Windows 10 and 11 is aimed at people leaving Outlook for Thunderbird, Apple Mail or eM Client who have a folder of saved .msg messages to bring along. MSG to EML Converter Software reads each file from disk and writes a plain RFC 822 .eml that those clients import. Outlook does not need to be installed, and no message is sent to a web service.

  How to use MSG to EML Converter Software
  1. Install the package and open the program.
  2. Add .msg files by dragging them in, or use Add Files or Add Folder, which also reads subfolders.
  3. Check the direction column: .msg files go to EML and .eml files go to MSG, and both kinds can sit in one list.
  4. Choose how output files are named, by subject or by source file name, and decide whether to keep original headers and decode RTF bodies.
  5. Select the output folder and press Start.

  Trial note: the free trial converts the whole queue but shows a reminder screen with a wait that grows before the run and every five files. A license removes the reminder and the wait.

  What this MSG to EML converter handles
  - Every To, Cc and Bcc recipient, plus Date, Message-ID, References and In-Reply-To.
  - The full internet header block when the message carries it, including Received lines, DKIM and Authentication-Results.
  - Subjects in Cyrillic, accented letters or emoji, encoded so other clients show them correctly.
  - Inline pictures in the body, and attachments copied byte for byte.
  - Messages that only have an RTF body.
  - Files named .msg that are really RFC 822 text inside, which are copied as they are.
  - The reverse of MSG to EML, with .eml files rebuilt as Outlook .msg.

  Outside its scope
  PDF or HTML output, MBOX and PST files, and live Outlook or IMAP accounts belong to other tools. Damaged .msg files are not repaired.

  Who it is for
  Users who switch to another mail client and want to convert MSG to EML in one pass. Paralegals and compliance staff who need the delivery trail of a message in an open format. IT staff who receive saved mail from Outlook users and work on PCs without Office.

  Questions

  How do I convert MSG to EML?
  Add the .msg files or a whole folder, pick an output folder and press Start. Each message is written as an .eml with the same recipients, headers and attachments.

  Which is better, EML or MSG?
  It depends on where the mail goes next. MSG suits Outlook only, while EML is an open standard that most other clients read, so it moves between programs more easily.

  Can you open a .msg file on a Mac?
  Mac mail apps generally cannot read the Outlook container, and this program runs on Windows only. Convert the files to EML on a PC first, and Apple Mail opens the results.
