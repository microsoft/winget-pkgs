ShortDescription: Photo watermark remover for Windows that finds camera dates, own logos and captions on your pictures with AI, fills the spot from nearby pixels and can process a whole folder in one batch run.
Description: |-
  Photo Stamp Remover is a photo watermark remover for Windows that takes camera date stamps, your own logos, captions and stray objects off photos stored on your PC. It locates the marked area by itself with AI detection and fills it from the surrounding picture. Batch mode lets you remove a watermark from photos across a whole folder. Use it on pictures you shot or have the right to edit.

  How to use Photo Stamp Remover
  1. Launch the program and drag pictures onto the window, or click Add files.
  2. On the first run, agree to download the AI models. This takes about 5 to 10 minutes, and after that the program works offline.
  3. Click Remove Watermark to detect and erase the mark automatically, or click Find watermark if you only want the area selected for review.
  4. If a trace remains, select it by hand and clean it with the Remove button, Concealer or Clone Stamp.
  5. Save the cleaned picture. For many files, switch to batch mode and process the whole set.

  Trial note: the free trial of this photo watermark remover runs detection and removal so you can see the result on screen, but the unregistered version does not save images and works for a limited number of days. A license turns saving on.

  What the photo watermark remover handles
  - Image files in JPG, PNG, TIF, WebP and HEIC.
  - Four fill methods: Inpainting, Hole filling, Texture generation and quick Remove.
  - Editing tools: Crop, Rotate, Smudge, Undo Brush, Concealer and Clone Stamp.
  - Adding your own watermark to finished pictures.
  - A console mode for scripted jobs.
  - GPU processing through CUDA where a supported card is present, with the processor used otherwise.
  - Output at the original resolution of each picture.

  Who it is for
  Photographers and families whose older camera printed the date into every frame, small shops that need an old company logo gone from their own product shots, and office staff preparing screenshots without captions. It also suits admins who install tools with winget and want a photo watermark remover that keeps pictures on the local disk.

  Questions

  Is it a watermark remover for PDF or video files?
  No. This photo watermark remover opens still image files only, so a video clip or a PDF document is outside its scope.

  Do I have to upload photos to an online watermark remover?
  No. Once the models are downloaded, detection and filling run on your own PC and pictures are not sent anywhere. As watermark remover software installed locally, it also has no per-image credits to buy.

  Can it remove a stamp or a signature from a photo?
  Yes, when the stamp or signature is yours to remove. Let Find watermark outline it or draw the selection yourself, then pick a fill method. Results depend on the background behind the mark, and on busy textures the Clone Stamp helps finish the edges.
