ShortDescription: Voice to text software for Windows that types what you say into the active window while you hold a hotkey, with a speech model stored on the PC and batch transcription of recordings.
Description: |-
  SayOnce - Voice to Text Software is voice to text software for Windows that puts your words wherever the cursor is: a code editor, a terminal, a browser tab, a chat or a document. You hold a global hotkey, speak, release, and the text is pasted into the active window. Recognition runs on the PC with a model downloaded once, and the audio is not sent to a server.

  How to use SayOnce
  1. Install the program and let it fetch the speech model on the first launch, roughly 478 MB.
  2. Place the cursor in any text field.
  3. Hold Ctrl+Win, the default hotkey, and speak.
  4. Release the keys. The recognized text appears at the cursor.
  5. Optionally pick a preset on the main screen or open the Files tab for recordings.

  Trial note: the free trial has no expiry date, but the unregistered version allows a limited number of dictations per day and then blocks the hotkey. A license removes the daily limit.

  What the speech to text software handles
  - Dictation into any active Windows window through a hold-to-talk hotkey, with push-to-talk and the paste method adjustable in Settings.
  - A speech model that runs on the processor, with a graphics card optional.
  - Detection of speech and of the end of a phrase.
  - Three formatting presets named Prose, Code and Email.
  - Snippets and a personal dictionary for repeated text and unusual words.
  - A tray icon and a small overlay that shows when it is listening or processing.
  - Autostart with Windows and an option to unload the model after idle time.
  - A history of past transcriptions.
  - Batch transcription of WAV, MP3, M4A, AAC, FLAC, OGG, OPUS, MP4, MOV, MKV and WEBM into plain .txt files.

  Who it is for
  Developers who dictate prompts and comments into an IDE or an AI agent. Writers and students who draft long text. Anyone at a Windows PC who types a lot and wants dictation software for Windows that keeps audio on the machine. Admins can install this voice to text software with winget and leave the model download for the first run of each user.

  Questions

  Is there a software that converts voice to text?
  Yes. SayOnce is voice to text software that turns live speech into typed text in the current window and can also convert saved recordings into text files on the Files tab.

  Does Windows 11 have built-in dictation software?
  Windows 11 includes its own voice typing. SayOnce is a separate voice dictation software that adds a local model and a hold-to-talk hotkey, plus file transcription for recordings.

  What is a good voice-to-text typing software for developers?
  One that leaves identifiers alone and pastes into the editor you already use. The Code preset keeps edits to a minimum, and the hotkey works in VS Code, Cursor, a terminal or a browser.
