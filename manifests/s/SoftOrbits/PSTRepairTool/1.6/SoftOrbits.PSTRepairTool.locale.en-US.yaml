ShortDescription: PST repair tool for Windows that opens a damaged Outlook .pst or .ost file read-only, rebuilds whatever is still readable and saves it into a new file in a format you choose.
Description: |-
  Outlook PST Repair Tool is a PST repair tool for Windows 10 and 11 that works on a data file Outlook refuses to open, for example after the warning that errors have been detected. It reads the damaged .pst or .ost without Outlook or an Exchange account and writes what it recovers into a new file, so the source is left unchanged.

  How to use Outlook PST Repair Tool
  1. Install the program and click Open to select the broken .pst or .ost on disk.
  2. Let the repair run. The status line reports which stage did the work, starting with a normal open and moving on to a rebuilt header or a full signature scan only when needed.
  3. Review the result in the folder tree, filter messages by subject or sender and read them in the preview pane.
  4. If needed, switch the scan depth from Automatic to Quick only or Deep scan. Deep scan also looks for deleted mail.
  5. Choose the output format and decide whether attachments and inline images go along.
  6. Tick folders, set a destination and press Start. Free space is checked first.

  Trial note: the free trial scans the file and previews everything it recovered, so you see the real result on your own data. Saving any output requires a license.

  What it handles
  - Damaged Unicode PST files and the older ANSI format, plus OST files left behind by accounts that no longer exist.
  - Header and index damage, the case where nearly all mail usually returns.
  - Deleted messages found by Deep scan. They often come back with headers and a date but a missing or short body, and are flagged [partial].
  - Messages without a parent folder, gathered into a Lost & Found branch together with orphaned attachments.
  - Output written to a .part file that is renamed only after a clean finish.
  - Six output formats: PST for Outlook, MSG, EML, MBOX, PDF and HTML.
  - A run report for support listing what was done and what could not be recovered, with no file names, subjects or addresses in it.

  Who it is for
  Users and help desk staff facing a corrupt PST file after a full disk, an interrupted copy or an unplugged USB drive, and anyone whose earlier scanpst run still left mail missing. When you need to repair PST file damage on a machine without Outlook, or pass recovered mail to people who never use a mail client, this PST repair tool keeps the work on the local PC. It takes one file per run, with no batch mode or command line.

  Questions
  Can a damaged PST file be repaired?
  In most cases, yes. Header and index damage repairs well, while stretches of overwritten bytes are lost and the affected messages are marked partial.

  Where can I find the PST repair tool for Outlook?
  Outlook comes with the Inbox Repair Tool, scanpst.exe, which edits the data file in place. This program is a separate install that writes the repair into a new file instead.

  How can I fix a corrupted OST file from Outlook?
  Open the OST here the same way as a PST. Its readable content is saved as a new PST or as loose message files, which also works for an OST that Outlook will not attach anymore.
