ShortDescription: Outlook attachment extractor for Windows that pulls the files attached to messages in a .pst or .ost archive into a folder, with type filters and duplicate skipping, and needs no Outlook.
Description: |-
  Outlook Attachment Extractor Software is an Outlook attachment extractor for Windows that opens a .pst or .ost data file from disk and writes every file attached to its messages into a folder you pick. Outlook does not have to be installed or running, and the archive is processed offline on the local machine. It is meant for people who need to extract attachments from Outlook archives in bulk rather than open each message by hand.

  How to use Outlook Attachment Extractor Software
  1. Load a .pst or .ost file. The program works with one archive per session.
  2. Tick folders in the tree, or highlight individual messages in the list. The Attachments column shows how many files each message carries.
  3. If the list is long, type a word into the text filter and match it against Subject, From, To or Body.
  4. Set the source to checked folders or to selected messages.
  5. Leave All file types on, or restrict the run with the chips for PDF, DOC/DOCX, XLS/XLSX, JPG/PNG and ZIP, plus a field for other extensions.
  6. Choose the output layout and the naming rule, then press Start.

  Trial note: the free trial saves every attachment when the selection holds 20 files or fewer, and 10 percent of a bigger selection, rounded up and capped at 100. A license takes the cap away.

  What it handles
  - Output that repeats the folder hierarchy of the PST, or puts everything into a single folder.
  - File names left as they were, or rebuilt as Date_Subject_Name.
  - Inline pictures, skipped by default and available with one checkbox.
  - A size threshold (20 KB out of the box) that keeps signature logos and tiny icons out of the result.
  - Duplicate detection by content hash, so a contract sent in forty messages is saved once.
  - Name clashes settled with _1 and _2 suffixes, or by overwriting, whichever you select.
  - A CSV report listing what was written.

  What it does not do
  There is no date range filter, ZIP files found among the attachments stay packed, and IMAP or Office 365 accounts cannot be opened. OLM, BAK and OFT files are not accepted as input.

  Who it is for
  Bookkeepers who want to save all attachments from Outlook archives as one folder of invoices, office managers who sort out an old mailbox before it goes to storage, and admins who collect documents from the data file of an employee who has left. In each case the outlook attachment extractor turns a mail archive into plain files that other programs can open.

  Questions

  How can I extract attachments from an Outlook email?
  Open the .pst or .ost that contains the email, highlight that message and run the job with Selected messages as the source. Its files appear in the output folder under the original names or the Date_Subject_Name pattern.

  How do I download all attachments from multiple emails at once?
  Select the messages, or tick whole folders, and press Start once. That is the way to download all attachments from Outlook data in a single pass, with the CSV report as a record.

  How to clean up Outlook attachments?
  Copy them out first. The extractor drops duplicates and small signature images on the way, so the result is a tidy folder of real documents. Removing attachments from the mailbox afterwards is outside what this program does.
