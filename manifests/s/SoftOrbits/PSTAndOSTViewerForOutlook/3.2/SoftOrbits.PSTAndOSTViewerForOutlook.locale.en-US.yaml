ShortDescription: PST viewer for Windows 10 and 11 that opens Outlook .pst and .ost data files read-only, lists folders and messages, and runs on PCs where Outlook was never installed.
Description: |-
  PST and OST Viewer for Outlook is a PST viewer for Windows 10 and 11 that opens Outlook .pst and .ost data files directly from disk and displays their folders and messages. The file is opened read-only, so read flags and dates inside it stay as they were. The program is made for reading mail, and it does not convert whole archives.

  How to use PST and OST Viewer for Outlook
  1. Click Open and choose a .pst or .ost file, even one taken from an old laptop or a backup drive.
  2. Wait while the folder tree fills. Large folders load in portions, so reading can start early.
  3. Select a folder to list its messages.
  4. Narrow the list with the text filter, and add a date range when the folder is large.
  5. Click a message to read it across the whole window.
  6. Right-click it to print or to save a PDF copy. The same menu stores the message in HTML, EML or MSG format and writes its attachments to a folder.

  Trial note: the free trial displays the first 20 messages in each folder, while the tree and the counters still report the real totals. A license removes that limit.

  What it handles
  - Orphaned .ost files whose mailbox no longer exists, read as ordinary files.
  - Folders with thousands of items that scroll while they are still loading.
  - HTML messages with their formatting and inline pictures.
  - Header lines with sender and date above every message.
  - Attachments written out under their original names.
  - Printing through the standard Windows dialog.
  - An interface in 16 languages.

  What it does not do
  This PST viewer has no batch export, so a folder or a whole archive cannot be converted in one run. Damaged and password-protected data files are not opened.

  Who it is for
  IT staff who receive the mail archive of an employee who has left, people on a new PC who need one message from an old backup, and anyone who wants a PST file viewer on a computer without Office. HR and legal teams pick it when mail must stay on their own machine.

  Questions

  What is a PST viewer?
  It is a program that opens an Outlook data file and lets you read the mail inside without importing it into a mail profile. This one reads .ost files as well.

  What programs can open a .PST file?
  Outlook can attach one to a profile, and this program opens it on its own, without Outlook and without an import step. It also reads .ost caches that Outlook refuses on another computer.

  How can I view a PST file?
  Open it here and pick a folder. Messages appear in the list, and one click shows the selected email full width. Nothing else is required to open a PST file without Outlook.
