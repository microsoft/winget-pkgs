ShortDescription: PST to MBOX converter for Windows that turns an Outlook .pst or .ost archive into MBOX mailboxes or EML files for Thunderbird, Apple Mail and Postbox, offline and without Outlook.
Description: |-
  PST to MBOX Converter for Thunderbird is a PST to MBOX converter for Windows 10 and 11 that reads an Outlook .pst or .ost archive and writes mailboxes that Thunderbird, Apple Mail, Postbox and Eudora can import. A switch on the Convert tab produces separate .eml files instead. Outlook is not required, and the mail never leaves the PC.

  Thunderbird has no reader for .pst files, and its own Outlook import relies on Outlook being installed on the same machine. A bare archive from a backup therefore has to be turned into a format the new client accepts, and this program exists to convert PST to MBOX locally.

  How to use PST to MBOX Converter for Thunderbird
  1. Open the .pst or .ost file, or drop it onto the program window. Only one archive is loaded at a time.
  2. Tick the folders to export, and preview any message first if you want to check it.
  3. Pick MBOX or EML on the Convert tab.
  4. For MBOX, keep the .sbd layout to preserve nesting, or switch to flat files.
  5. Set the optional filters and the action for a mailbox that already exists.
  6. Choose the destination and press Start.
  7. In Thunderbird, open Tools, then Import, select the profile directory option and point it at the output folder.

  Trial note: the free trial shows a reminder screen and converts only part of a large selection. Registering removes the limit, so every ticked folder is exported.

  What it handles
  - A folder tree written as Inbox plus Inbox.sbd under a Mail folder, so Thunderbird treats the output as a profile.
  - Original internet headers of mail received over SMTP, kept unchanged with the Received chain and DKIM.
  - Recipients stored as real SMTP addresses rather than display names.
  - Read and unread state carried in X-Mozilla-Status.
  - Body lines that begin with "From " escaped by the mboxrd rule.
  - Inline pictures that keep their cid links, and attachments copied byte for byte.
  - Subjects and folder names in Cyrillic or CJK.
  - A date range, dropping attachments, skipping empty folders and leaving Deleted Items out.
  - Rename, overwrite or append when a mailbox file is already there.

  What it does not do
  Contacts, calendars, tasks and notes stay inside the .pst. Damaged or encrypted archives are not processed.

  Who it is for
  People leaving Outlook for Thunderbird or Apple Mail, admins moving a team to another client, and anyone with an old backup who wants to import PST to Thunderbird on a PC without an Office license. The pst to mbox converter also feeds EML files into archiving tools that expect one message per file.

  Questions

  What is the difference between PST and MBOX files?
  A PST is the Outlook database that keeps folders, mail and other items together in one file. MBOX is a plain text mailbox that stores no hierarchy and is read by Thunderbird, Apple Mail and many Unix mail tools.

  Can I import a PST file into Thunderbird?
  Not directly, because Thunderbird does not read .pst. Convert it here with the .sbd layout on, and the Thunderbird import wizard accepts the output folder as a profile directory.

  Can you convert MBOX to PST?
  Not with this program, which only works from Outlook archives toward MBOX and EML. The reverse direction is covered by our separate MBOX to PST Converter.
