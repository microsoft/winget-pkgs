ShortDescription: Tool to blur faces in video on a Windows PC, offline, hiding heads, bodies and license plates in body cam, dashcam and CCTV footage before you release a recording.
Description: |-
  AI Video Redaction Software - Blur Faces in Video finds people and license plates in recordings and covers them on your own PC, for staff who answer FOIA or DSAR requests and must blur faces in video before a file leaves the office. It is video blur software with no upload step: frames and audio stay on the disk, and detection runs on the CPU without a graphics card.

  How to use AI Video Redaction Software - Blur Faces in Video
  1. Add recordings by drag and drop or with Add Files.
  2. Tick what to hide: heads, full bodies, license plates, or a custom area you draw.
  3. Pick the cover style: smooth blur, pixelation or a black square.
  4. Adjust detection confidence and how often frames are checked.
  5. Optionally mark audio stretches for silence or a beep.
  6. Start the batch and collect the results from the output folder.

  Trial note: the free trial adds no watermark and does not limit the number of files, but it shortens the exported clip. A license gives full-length output.

  What it handles
  - Heads at any angle, in profile, partly covered or under helmets and hoods.
  - License plates from dashcam and street cameras, with a separate confidence slider.
  - Custom areas drawn as a rectangle or in free form for logos, signs or screens.
  - Audio intervals muted or replaced by a 1 kHz tone.
  - Input in MP4, MOV, AVI, MKV, WMV, WebM, 3GP and more. Output is MP4 with H.264 and AAC, at the source resolution and frame rate.
  - Batch processing on all CPU cores, with a Detect every Nth frame setting for speed.

  Accuracy and review
  Automatic detection misses things now and then. Plates slip past more often than heads, and a bright round object can get covered by mistake, so someone should watch each output before it goes out. Whether a file satisfies FOIA, GDPR or any other rule is for the releasing office to judge, and the program does not certify it.

  Who it is for
  Records officers, police departments that redact video files from body cams before release, security teams sharing CCTV clips with insurers, and dashcam owners posting a road clip. Anyone who wants face blur software that keeps footage off the internet fits too.

  Questions

  How can I redact a video on a PC?
  Load it, tick heads or plates, choose a cover style and press start to blur faces in video with no upload. Everything happens locally.

  Is there a way to unblur faces in videos?
  Not from the exported file. The cover is written into the frames, and the black square removes the face completely. Keep the original stored securely if you may need it.

  Which redaction tool suits law enforcement video?
  One that works offline, handles body cam and interview room footage in batches, and can mute spoken names. This program covers those points. It does not store evidence or track cases.
