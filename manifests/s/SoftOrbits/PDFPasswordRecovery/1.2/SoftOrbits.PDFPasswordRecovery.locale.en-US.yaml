ShortDescription: PDF unlocker for Windows that lifts print, copy and edit limits from your own files and recovers a forgotten open password on the PC, processing whole folders in one run.
Description: |-
  PDF Unlocker - PDF Password Remover Software is a PDF unlocker for Windows 10 and 11 that works on documents you own. It handles two different locks. An owner lock limits printing, copying and editing, and the program lifts it in seconds with the bundled qpdf engine. An open password stops the file from opening at all, and for that the program searches on your computer with the hashcat engine. Files are never sent anywhere.

  How to use PDF Unlocker
  1. Install the package and start the program.
  2. Drag .pdf files into the window, or use Add Files or Add Folder to load a whole directory.
  3. Press Start. The quick qpdf path runs first, and any file with an open password moves on to the search.
  4. Read the status next to each file. It tells you whether the job was a simple restriction removal or a harder encrypted one.
  5. Pick a destination folder and save the unlocked copy.

  Trial note: the free trial does the whole job and shows the unlocked document in a preview window, but the registered version is the one that saves files. A license enables the Save button.

  What it handles
  - Printing, copying and editing limits, removed with no password at all.
  - Open passwords on older documents using RC4 or AES-128, where common human passwords tend to turn up quickly.
  - Batch runs over many files, one after another without attention.
  - GPU search when a graphics card is present, with a time estimate when only the processor is available.

  If you need to remove PDF password prompts from a stack of old files, or to unlock PDF documents before sharing them inside a team, the steps above are the same on every machine. This PDF unlocker bundles qpdf and hashcat, so nothing extra has to be installed. The interface is available in English and Russian.

  Who it is for
  Administrators and power users who keep archives of their own contracts, reports and forms, and who need them printable, searchable or editable again. It does not promise every password: a long random one on a PDF 2.0 file with AES-256 stays out of reach because of its slow key derivation.

  Questions
  How do I open a PDF file if I forgot my password?
  Load the file and press Start. The program tries a wordlist and then character masks, which suits short or dictionary-style passwords on your own document. This PDF unlocker reports progress while it works.

  How to bypass PDF restrictions?
  Use the program on your own file. Permission flags are cleared with qpdf, so no password is needed and the result is ready in seconds.

  Can I unlock a PDF without a password?
  Yes for owner restrictions, because those flags can be removed directly. A file that asks for a password just to open still needs that password recovered first.
