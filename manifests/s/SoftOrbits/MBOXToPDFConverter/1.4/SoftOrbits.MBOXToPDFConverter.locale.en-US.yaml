ShortDescription: MBOX to PDF converter for Windows 10 and 11 that turns Thunderbird and Apple Mail mailboxes into PDF files on the local disk, for people moving off a desktop mail client.
Description: |-
  This MBOX to PDF converter for Windows 10 and 11 is meant for people who have left Thunderbird or Apple Mail and still keep their old mail as .mbox files. MBOX to PDF Converter Software reads those files straight from disk, lists the messages and writes PDF documents that open on any computer. No mail client has to run, and nothing is uploaded anywhere.

  How to use MBOX to PDF Converter Software
  1. Install the package and launch the program.
  2. Load mailboxes with Add File, which accepts several at once, or with Add Folder to pick up every mailbox under a directory. Dragging files and folders onto the window works as well.
  3. Click a mailbox in the tree on the left to list its messages by Subject, From, To, Date and Size.
  4. Open any message in the HTML preview to check how it looks.
  5. Narrow the list with the From, To, Subject or Body filter and tick only the messages you need, or keep the whole mailbox selected.
  6. Choose one combined PDF per mailbox or a separate PDF for each message, set the destination folder and press Start.

  Trial note: the free trial converts 3 messages per day, the count resets at midnight, and a reminder screen appears once the quota is used. A license removes the daily cap.

  What it handles
  - Several .mbox files in one session, each shown as its own node in the tree.
  - Thunderbird mailboxes saved with no extension at all, such as Inbox or Sent, and the contents of .sbd subfolders.
  - HTML formatting and inline pictures of each message, rendered into the document.
  - One merged MBOX to PDF document per mailbox, or one file per message in a subfolder named after the mailbox.
  - A bundled PDF engine, so Adobe Acrobat is not required.
  - Separate output for every mailbox, so files from different sources never overwrite each other.

  Outside its scope
  It reads .mbox only. Outlook .msg, PST and single .eml files need other tools, and there is no connection to a live IMAP account. Several mailboxes are never joined into one document, because merging happens inside a single mailbox.

  Who it is for
  People who switched away from Thunderbird or Apple Mail and want to convert MBOX to PDF before the old profile is deleted. Legal and HR staff who need mail as fixed pages for a case file or an audit. Anyone who wants personal correspondence in a form that a PDF reader will still open years from now.

  Questions

  What is an MBOX file?
  It is a mailbox stored as one plain text file, with messages placed one after another. Thunderbird and Apple Mail both use it, and the MBOX to PDF converter reads it without either of them installed.

  What program can open an MBOX file?
  This one opens it on Windows: add the file and its messages appear in a list with a preview pane. Windows itself has no app registered for the format.

  Can I open an MBOX file in Gmail?
  Not through this program, because it never signs in to Gmail or any other mail service. It opens the file locally, and the PDF it creates can be attached to a Gmail message like any other document.
