ShortDescription: Windows PST password remover for your own Outlook data files. It recovers a working password or clears the protection on .pst archives in about a second, locally.
Description: |-
  Outlook PST Password Remover and Recovery Software is a PST password remover for Windows that works on Outlook data files you own. Give it one archive or a whole batch and it recovers a password that opens the file, or clears the protection so no password is asked at all. The work happens on your computer, with no upload and no cloud step.

  How to use Outlook PST Password Remover and Recovery Software
  1. Install the package and start the program.
  2. Add one or more .pst files to the list.
  3. Press Start. The result comes back almost at once, because there is no long search behind it.
  4. Look at the result window, then save the password or the unlocked copy.

  Trial note: the free trial runs the full job and shows the result window, but only the first letter of the password is visible and no unlocked copy is saved. A license shows the complete password and writes the copy without protection.

  What it handles
  - Unicode .pst files from current Outlook and older ANSI .pst files too.
  - Batches of archives, so you can remove password from PST file after file in one run without typing anything.
  - Outlook PST password recovery that returns a password you can type when Outlook asks for it.
  - A duplicate of the .pst with the password cleared, so Outlook opens it without a prompt.

  How it works
  A password on a .pst file is not encryption. Outlook stores a 32-bit checksum of the password inside the file and compares it when you open the archive. The program reads the data store without that check and finds a string with the same checksum. Because a checksum can match several strings, the password it shows may differ from the one you set years ago, and it still opens the file. Only .pst files are covered, and .ost files are not.

  Who it is for
  Administrators, help desk staff and individual users who inherited an old archive and cannot remember what protected it. It is meant for files you created or are allowed to open.

  Questions

  How do I remove the password on a PST file?
  Add the file to the list and press Start. The registered version saves an unprotected duplicate, and Outlook then opens that duplicate with no prompt.

  How can I open a PST file without a password?
  Either clear the protection, or use the recovered password in the prompt. Both come from the same run, and the original file is not changed.

  How to remove password if forgot?
  Run the program on the archive. It does not need your old password, since it works from the checksum stored in the file and returns a password that unlocks it.
