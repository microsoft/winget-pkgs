ShortDescription: QFX to PDF converter for Windows that reads bank .qfx and .ofx downloads and prints them as a paged PDF statement, for people who do not have Quicken on their PC.
Description: |-
  QFX to PDF Converter Tool is a Windows program for people who download statements from their bank as .qfx or .ofx files and need them as readable pages. It works offline, so the transactions stay on the computer, and its text preview doubles as a QFX file viewer before anything is written.

  How to use QFX to PDF Converter Tool
  1. Add your .qfx or .ofx files one by one, or add a folder of them.
  2. Select a file to see the preview: how many transactions were found, the encoding and the first rows.
  3. Choose A4 or Letter. Orientation can follow the table width or be fixed.
  4. Pick how dates are printed.
  5. Tick memo, transaction type or running total if you want those columns. The running total is off by default.
  6. Set the output folder and press Start.

  Trial note: the free trial stops after 20 transactions per statement and prints a note that the report is incomplete. A license removes that limit.

  What it reads and writes
  - OFX 1.x in SGML form, where tags are left open, and OFX 2.x in XML.
  - Intuit-specific tags such as INTU.BID next to the standard bank fields.
  - Several statements in one file, credit card statements and investment statements.
  - Investment rows that carry a share quantity and no cash amount, such as a split.
  - Cyrillic, CJK and Latin-1 memos.
  - PDF output only, with the column header repeated on each page, page numbers in the footer and negative amounts shown in color and in parentheses.

  Dates and encodings
  OFX keeps every date as YYYYMMDD, so nothing has to be guessed on input, and the date setting only decides how dates look on paper. The preview also names the encoding it detected, which shows at once whether non-Latin memos were read correctly.

  Who it is for
  Account holders who left Quicken behind but still get .qfx downloads, bookkeepers who need a QFX to PDF printout for a client file, and anyone who wants to open QFX file archives from closed accounts years later. It also fits the case where a tax preparer or a lender asks for statements on paper and the bank only offered a data download.

  Questions

  Is there a QFX file viewer that works offline?
  Yes, the preview in this program shows the transaction count and opening rows on your own PC, and nothing goes to a website. For full pages, run the conversion.

  How do I turn a QFX file into a PDF?
  Add the file, choose page size and date format, and press Start. The QFX to PDF result lands in the output folder you chose.

  What is the Quicken QFX file format?
  It is an OFX statement with extra Intuit tags, made for the Web Connect import in Quicken. The program reads those tags and lays the transactions out as a table.
