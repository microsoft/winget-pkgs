ShortDescription: 'PST to PDF converter for Windows legal and HR work: reads a saved Outlook mail archive offline and exports ticked folders or highlighted messages to PDF, HTML or TXT documents.'
Description: |-
  PST to PDF Converter Software is a PST to PDF converter for Windows aimed at people who must hand over mail from a saved Outlook archive as documents, such as a paralegal building a case file or an HR officer answering a records request. It opens one .pst or .ost file from disk, shows the folder tree of that archive and exports the messages you choose. Outlook does not have to be installed or running, and no mail leaves the machine.

  How to use PST to PDF Converter Software
  1. Click Open PST or drag one .pst or .ost file onto the window. Opening another file replaces the current archive.
  2. Tick folders in the tree on the left, for example Sent Items or a project subfolder.
  3. Click a folder to list its messages by Subject, From, To and Size, then click a message to read it in the HTML preview.
  4. To narrow the list, type in the From, To, Subject or Body filter and press Search. The search covers the current folder.
  5. On the Convert tab choose the output format and whether inline images go in, then set the mode to checked folders or selected messages.
  6. Choose an output folder and press Start. A counter tells how many messages will be exported, and progress runs message by message.

  Trial note: the program installs as a free trial, so you can check the output on your own archive first. Registering with a license removes the trial limits.

  What it handles
  - Outlook data files in .pst format and offline .ost caches.
  - Output as PDF for filing, as HTML for a browser, or as plain text.
  - HTML and plain text messages, rendered to PDF by a converter bundled with the program.
  - A header block with From, Date, To and Subject above the body of every message, HTML ones included.
  - Dates read from the archive in UTC, because a PST does not store the time zone offset of the sender.
  - Inline images, kept or left out with one checkbox.
  - PST to PDF export of a few messages as well as whole folders out of an archive with thousands of items.

  Outside its scope
  One archive per session. Loose .eml and .msg files are not read, and neither are MBOX files or live mailboxes on IMAP or Exchange. There is no command line and no Mac build, and a password-protected PST that cannot be opened ends with an error message.

  Who it is for
  Legal and HR staff who need to save Outlook emails as PDF for a dispute or an audit, people doing eDiscovery on an exported mailbox, and anyone who keeps an old archive and wants it readable on a computer with no Outlook. When the request is to convert PST to PDF for a single custodian, the folder checkboxes keep the export to what was asked for.

  Questions

  Can a PST file be converted to PDF?
  Yes. Open the archive in this PST to PDF converter, tick folders or pick messages, select PDF and press Start.

  What is a PST vs a PDF?
  A PST is the database Outlook uses for mail, folders and other items, and it needs a mail program to read. A PDF is a fixed page that opens in any reader, which is why archives get turned into PDF before they are shared.

  Which program reads a .PST file on Windows?
  Outlook does, and so does this program for a file saved on disk. Its folder tree and preview let you read messages without a mail profile.
