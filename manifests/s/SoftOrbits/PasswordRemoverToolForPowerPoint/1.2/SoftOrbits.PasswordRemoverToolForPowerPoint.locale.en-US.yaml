ShortDescription: Windows powerpoint password remover for your own .pptx decks. It runs a local open-password search over a whole folder, trying likely words before pattern variants, and uploads nothing.
Description: |-
  PowerPoint Password Remover Tool is a Windows powerpoint password remover for presentations that belong to you. When a .pptx asks for an open password you no longer remember, the program searches for it locally, starting from a wordlist and applying rule-based mutations that follow how people build passwords. The deck is only read, never rewritten, and no slide leaves the computer.

  How to use PowerPoint Password Remover Tool
  1. Install the package and start the program.
  2. Drop locked .pptx files on the window, or use Add Files and Add Folder to queue a whole directory.
  3. Press Start. The program reads the encryption header of each file and picks the matching Office scheme.
  4. Watch the row of each file. It shows its own status, the number of tested passwords and the current speed.
  5. When a password is found, copy it and type it into PowerPoint to open the original file.

  Trial note: the free trial runs the complete search and shows the outcome in a preview popup, but the full password stays behind a Buy banner. A license removes that limit.

  What it handles
  - Presentations saved as .pptx with an open password, from PowerPoint 2007, 2010 and 2013 or later.
  - A batch of files in one run, processed one after another without supervision.
  - A graphics card for speed. Without one the search continues on the processor.
  - Progress details such as tested and rejected counts and the rule set currently in use.

  Limits
  Use it to remove password from powerpoint files only when you own them or are allowed to open them. A short or word-based password comes back in reasonable time. A long random password on PowerPoint 2013 or later is protected by AES-256 with a slow key step and may never be found. Old .ppt files from PowerPoint 2003 are not supported in this version.

  Who it is for
  Administrators and help desk staff who get a ticket about a locked presentation and want a powerpoint password remover that works on the local machine instead of a web page, to unlock powerpoint files. Also anyone with an archive of old pitch decks whose passwords are forgotten.

  Questions

  How do I remove password protection from a PPT file?
  Load the file and press Start. The program searches for the open password and shows it, so you can open the deck in PowerPoint yourself and clear the protection there.

  Can I remove a PowerPoint password online for free?
  You can, but an online page needs your presentation uploaded. This program works offline, and the trial runs the full search on your own PC.

  How do I remove a forgotten password from PPT?
  Add the .pptx and let the search run. It tries likely words first and then rule-based variations, and the result row reports when a password has been found.
