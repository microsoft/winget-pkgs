ShortDescription: Photo to sketch converter for Windows that redraws your own pictures as pencil drawings, color sketches or line art, with over 30 presets, adjustable strokes and folder batch runs.
Description: |-
  Sketch Drawer - Photo to Sketch Converter is a photo to sketch converter for Windows that redraws your pictures as pencil drawings, colored sketches or clean line art. It uses a stroke and hatching engine on the local PC, so nothing is uploaded, and you can tune how the pen moves before the final render.

  How to use Sketch Drawer
  1. Drag a picture into the program window.
  2. Pick a style: Realistic, Detailed, Classic or Anime.
  3. Choose a preset such as Pen Sketch, Line Drawing or Pastel and look at the preview.
  4. Adjust contour strength, hatching, line thickness, stroke direction and color until the preview looks right.
  5. Press Run, then save the drawing as JPEG or send it to a printer.

  Trial note: in the free trial each preset can be tried and previewed, though nothing is written to disk until the copy is registered. Buying a license switches on saving of the JPEG drawings.

  What the photo to sketch converter handles
  - Input pictures in JPEG, PNG, TIFF and RAW, output as high resolution JPEG.
  - More than 30 presets, in color or in black and white.
  - Separate controls for contour, hatching, thickness, stroke direction and color.
  - An Undo brush that brings selected parts of the frame back to the original photo.
  - Crop, rotate and brightness correction before the sketch pass.
  - Batch processing for a whole folder of pictures.
  - A command line for scripted runs.
  - Printing straight from the program.

  Who it is for
  People who want a quick photo to sketch effect for a greeting card, or a hand-drawn portrait of a relative or a pet for a frame. Hobby artists who need line art to trace or paint over. Teachers preparing drawing material from their own photos. Power users who install tools through winget can call the command line and convert photo to sketch files as one step of a script, which saves opening the window for every image.

  Questions

  How do I turn a photo to a sketch?
  Open the picture, pick a style and a preset, check the preview and press Run. If the preset is close but not exact, change the stroke settings and run it again.

  Is there a free AI to turn a picture into a drawing?
  This program is a stroke engine rather than an AI face generator. It draws lines over the structure of the photo, so faces keep their original shape. You can try it free and see each drawing in the window, while saving requires a license.

  How do I turn a whole folder of photos into sketches?
  Switch to batch mode, add the folder and choose one preset for all files. Each picture is rendered with the same settings and written out as JPEG, which keeps a series of portraits consistent.
