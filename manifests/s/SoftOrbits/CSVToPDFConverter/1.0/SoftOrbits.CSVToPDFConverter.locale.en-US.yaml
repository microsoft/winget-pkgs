ShortDescription: CSV to PDF converter for Windows 10 and 11 that turns bank, broker and payment exports in .csv, .tsv or .txt into paginated PDF statements, with an optional QBO output.
Description: |-
  CSV to PDF Converter for Bank Statements is a csv to pdf converter for Windows 10 and 11 that reads a transaction export from a bank, a broker or a payment service and lays it out as a PDF statement. You can print the result, sign it or attach it to an application for a visa, a lease or a loan. The program works offline, needs no account, and the export stays on your PC.

  How to use CSV to PDF Converter for Bank Statements
  1. Open the program and drop .csv, .tsv or .txt files into the window, or load a whole folder with Add Folder.
  2. Select a file to see the text preview: detected delimiter, encoding, number of transactions and the first parsed rows.
  3. Tell it how dates are written in the file, Day/Month/Year or Month/Day/Year.
  4. Keep PDF as the output format, or switch to QBO for a QuickBooks import.
  5. Pick an output folder and press Start.

  Trial note: the free trial converts your real export but puts only the first 20 transactions in the PDF and marks the page, so the short report cannot pass for a full one. A license lifts the limit.

  What it handles
  - Comma, semicolon, tab and pipe delimiters, detected from the file.
  - UTF-8 with or without a byte-order mark, UTF-16, CP1251 and CP1252, so Cyrillic and German names print as letters.
  - Bank preambles with account number and period above the column names, skipped until the real header row.
  - Columns found by name in English, Russian or German, in any order.
  - Separate debit and credit columns merged into one signed amount.
  - Negative amounts in brackets or with a trailing minus, read as numbers.
  - An account column, used to group transactions per account.
  - An optional Category column, off by default.

  Who it is for
  Freelancers and small business owners who need to convert CSV to PDF for a landlord, a visa office or a tax adviser. Traders whose exchange hands out CSV only. Anyone with an export that opens as one long column in a spreadsheet and needs a bank statement converter that sorts out the delimiter and the date order. The same files can also go to QuickBooks, since the program doubles as a csv to qbo converter with a bank directory lookup.

  Questions
  How can I make a PDF out of a CSV file?
  Load the export, set the date order and press Start. The program reads the rows as transactions first, so the PDF comes out as a statement instead of a printed spreadsheet grid.

  What does CSV mean?
  CSV stands for comma-separated values, a plain text format with one record per line and fields split by a delimiter. Each bank picks its own column names and date style, which is why the program detects them per file.

  Is there a free online CSV to PDF converter?
  Some exist, but they want the file uploaded first, and a bank export carries your account number and every payee. This program runs locally, and its free trial lets you check the output on your own file.
