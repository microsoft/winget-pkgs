ShortDescription: CSV to VCF converter for Windows that turns contact tables from Excel, Google or Outlook exports into vCard 2.1, 3.0 or 4.0 files ready for phones and address books, offline.
Description: |-
  CSV to VCF Converter Software is a desktop csv to vcf converter for Windows 10 and 11 that reads contact tables and writes vCard files that a phone, Google Contacts, Outlook or a CRM can import. It works out the column separator and the text encoding of each file before conversion, so exports made with semicolons or saved in ANSI Cyrillic come through readable. Everything is processed on the local machine with no upload.

  How to use CSV to VCF Converter Software
  1. Start the program and add .csv files, or a whole folder including its subfolders.
  2. Check the separator and encoding detected for every file in the list, and change either one by hand if needed.
  3. Select vCard 3.0 (the default), 2.1 or 4.0.
  4. Review the column mapper, then reassign or skip columns.
  5. Decide between one combined .vcf and one card per person named by a template.
  6. Click a file to preview its first contact as a finished card, then press Start.

  Trial note: the free trial writes the first 10 contacts of each run and then shows a reminder. A license removes the limit so the whole table is converted.

  What it handles
  - Quoted cells that contain commas or line breaks, parsed by RFC 4180, in files with CRLF or LF endings.
  - Comma, semicolon, tab and pipe separators, counted outside quotes, with Auto or a manual choice.
  - Encoding found from the BOM, a UTF-8 check and a frequency test for cp1251, cp1252 or GBK, with a manual override.
  - vCard 2.1 with CHARSET=UTF-8 and QUOTED-PRINTABLE for non-ASCII names, so old handsets and car kits display Cyrillic and CJK text.
  - Version-specific syntax for TEL types, BDAY dates, embedded photos and UID/REV in 4.0, with long lines folded to 75 octets.
  - Google and Outlook style phone columns turned into multiple TEL and EMAIL entries with Home or Work labels.
  - Address parts merged into one ADR field, and a single Name column split into given and family name.

  Who it is for
  Office staff who need to convert csv to vcf before loading a client list onto company phones, sales teams moving a CRM export into an address book, and admins who want a csv to vcard tool that keeps personal data away from web services.

  Questions
  Can I convert a CSV file to a vCard online?
  Web services can, but they need the whole contact list uploaded first. This csv to vcf converter does the same job offline on your PC.

  How can I make a VCF file?
  Put the contacts in a spreadsheet, save it as CSV and add it to the program. Press Start and it writes a .vcf with one record per row.

  Is there a free VCF to CSV converter?
  Not this program, since it only goes from tables to cards. The reverse direction is a separate SoftOrbits product, VCF to CSV Converter.
