ShortDescription: JPEG repair tool for Windows that rebuilds corrupted and truncated JPEG and PSD files in batches, keeps EXIF where it can and pulls out the thumbnail when the main image is lost.
Description: |-
  Picture Doctor is a jpeg repair program for Windows that works on photos broken by an interrupted download, a bad sector on a memory card or a file cut short during copying. It also reads damaged Photoshop PSD files. All processing happens on the local PC, so pictures are not sent anywhere.

  How to use Picture Doctor
  1. Install the package and open the program.
  2. Add damaged files with Add Files, add a whole folder, or drop them onto the window.
  3. Choose an output directory for the repaired copies.
  4. Optionally turn on a preview, and set the balance between speed and depth of recovery.
  5. Click Start and check the output folder when the run ends.

  Trial note: the free trial repairs files without a count limit, but each restored image is saved with a black rectangle over its center. A license removes the rectangle.

  What it handles
  - Truncated JPEG files whose tail is missing after a broken transfer.
  - Visual damage such as stripes, green blocks and holes in the picture.
  - Progressive JPEG as well as baseline images.
  - EXIF data, which the JPEG route tries to keep or restore.
  - Broken markers, which are skipped so the rest of the data can still be decoded.
  - PSD files: layer recovery and the flattened composite, plus a deep scan for JPEG markers inside them.
  - Thumbnail extraction when the full frame cannot be recovered.
  - BMP output, so the result does not go through another lossy save. EXIF is not carried into BMP.
  - Batch runs over many files at once.

  Repaired copies go to the output directory you set, apart from the damaged originals. A quick pass suits a large folder, and the deeper recovery setting is there for the photos that still come back incomplete.

  Who it is for
  Photographers who pulled a card from the camera too early, support staff handed a folder of photos that will not open, and admins who need jpeg file repair on a workstation without uploading private images to a website. For jpeg image repair of a single family photo the steps are the same as for a folder of hundreds.

  Questions

  Is there a JPEG repair tool that works offline instead of online?
  Yes. This one runs on your Windows PC and reads files from your disk, so nothing is uploaded and a slow connection does not matter.

  What does a JPG file error usually mean?
  Most often the file is incomplete or a block of its data is damaged, so a viewer stops at the first bad marker. Repair skips the damaged part and decodes what remains.

  Which JPEG repair software runs on a Windows desktop?
  This one does. Install the package, add the files and press Start. The same steps work for one photo and for a few hundred.
