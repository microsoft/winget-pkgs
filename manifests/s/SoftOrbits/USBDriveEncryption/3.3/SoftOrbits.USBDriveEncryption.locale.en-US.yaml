ShortDescription: 'USB drive encryption for Windows 10 and 11: closes a flash drive with AES-256-GCM and a password, and the stick opens on another PC with no install and no admin account.'
Description: |-
  Encrypt & Password Protect USB Drive does usb drive encryption on any edition of Windows 10 and 11, Home included, where BitLocker To Go is not available. Each file on the stick is rewritten with AES-256-GCM under a key derived from your password. A small native decryptor of about 2 MB is placed on the drive, so the contents can be opened on a different computer without installing anything, without administrator rights and without a kernel driver.

  How to use Encrypt & Password Protect USB Drive
  The steps below show how to encrypt a USB flash drive from start to finish.
  1. Install the package and insert the stick. Only removable media appear in the list, each with its file system and free space.
  2. Pick the drive, type a password and keep the recovery key the program displays.
  3. Press Protect and follow the per-file progress. The run can be cancelled.
  4. After the run the stick shows one program file, and the data moves into a hidden storage folder.
  5. On another machine, start that program file from the stick, enter the password, then view or copy what you need.

  Trial note: the free trial allows three protect runs and five openings with all features on. A license removes those counts, and decrypting your own drive keeps working without one.

  What it handles
  The usb drive encryption here is per file, which shapes everything below.
  - AES-256-GCM on each file individually, so the stick is used as it is, with nothing to mount.
  - The stick keeps its factory file system and partitions, and Windows still mounts it as a removable disk.
  - A check of capacity and file system before the first byte is written.
  - A hidden storage folder with ordinary attributes, so $RECYCLE.BIN and other service folders stay outside the protected set.
  - Reinstalling the app and pointing it at the drive opens it again if the decryptor file was deleted.
  - Files and keys stay with you. Sign-up is not part of the process, and the recovery key is shown once.
  - Interface in 20 languages. The PC where you open the stick needs no runtime.

  Who it is for
  Staff who move contracts and spreadsheets between the office and home, consultants who plug a stick into a client PC where they cannot install software, and admins who need usb drive encryption to meet a removable media policy on laptops running Windows Home.

  Questions

  Can you encrypt a flash drive of any brand or size?
  Yes. Brand and capacity do not matter, the file system does. FAT32 refuses single files over 4 GB, while exFAT and NTFS have no practical limit.

  How to encrypt a USB drive on Windows 11 Home?
  Windows 11 Home has no built-in usb drive encryption for removable media. Install this program, select the stick, set a password and press Protect, which works the same on Home and Pro.

  Why does my USB drive suddenly look encrypted?
  A drive protected by this program shows only one program file at its root. Run that file and type the password to see the contents.
