ShortDescription: 'Duplicate photo finder for 64-bit Windows 10 and 11: scans chosen folders or whole drives, sorts repeated and near-identical pictures into groups and proposes one frame to keep in each.'
Description: |-
  SoftOrbits Duplicate Photo Finder is a duplicate photo finder for 64-bit Windows 10 and 11 that compares the pictures in folders and drives you choose. It puts byte-identical copies into one group together with look-alike frames, such as a resized export, a burst series or an image saved again in another format, and proposes a keeper for every group. Scanning runs on the processor, so no graphics card is required, and each file is read locally.

  How to use SoftOrbits Duplicate Photo Finder
  1. Start the program after setup completes.
  2. Drop folders onto the window, use Add Folder or Add Photos, or pick Scan Computer to go through whole drives. Windows and Program Files are skipped.
  3. Choose what to look for: Photos, Photos + Video, or All Files.
  4. For pictures, select the Exact or Similar comparison method, adjust Matching Level and Accuracy, then press Scan.
  5. Groups appear while the scan is still running. The keeper of each group gets a green frame and the others are marked.
  6. Change the marks by hand or with Selection Assistant rules (newest, oldest, largest, highest resolution), then press Delete Marked.

  Trial note: the free trial scans, groups and previews everything it finds, but the number of files you can delete in one session is limited. A license removes that cap.

  What it handles
  - Common formats: JPG, PNG, BMP, GIF, TIFF and WebP.
  - RAW camera files such as CR2, CR3, NEF, ARW, RAF and DNG (more than 30 RAW types in total), plus HEIC and HEIF pictures from phones.
  - Rotated or flipped versions of one frame, when that option is switched on.
  - Videos, installers, documents and archives as exact copies, matched by size and SHA-256 hash and listed without a picture preview.
  - Out-of-focus shots through the Find Blurry Photos mode with a threshold slider.
  - Keeper choice by resolution first, then sharpness, then file size, then the newer date.
  - Removal through the Windows Recycle Bin, with at least one picture left in every group.
  - A JSON or CSV report of the results.

  Who it is for
  People with years of phone backups and camera imports on one PC, photographers with burst series and re-saved exports, and anyone who wants to thin out a picture library before moving it to a new disk or to cloud storage. It also serves as a duplicate photo cleaner for shared folders where the same images were copied more than once.

  Questions

  Is there an easy way to find duplicate photos?
  Yes. Add the folder, keep the default settings and press Scan. Results come sorted into groups with everything except the keeper already marked, so the review mostly means confirming that choice.

  What should a duplicate photo finder for Windows 11 do?
  It should catch near-identical frames as well as exact copies and show why it keeps one of them. This program weighs sharpness when it picks the keeper and places EXIF data, dimensions and dates next to a zoomable preview.

  Is there an app that identifies duplicate photos by how they look?
  Yes. With the Similar method the program works as a similar photo finder: it compares perceptual hashes instead of file bytes, so a picture that was resized or converted still lands in the right group. Matching Level sets how strict that comparison is, which makes it a duplicate image finder for content rather than file names.
