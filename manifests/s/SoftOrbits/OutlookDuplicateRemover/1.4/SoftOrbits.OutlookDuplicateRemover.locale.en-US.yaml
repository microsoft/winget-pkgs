ShortDescription: 'Remove duplicate emails Outlook downloaded twice: this Windows utility scans the folders of a .pst or .ost archive, groups identical messages and saves one copy of each to a fresh PST.'
Description: |-
  Outlook Duplicate Remover is a Windows 10 and 11 utility that helps you remove duplicate emails Outlook has saved more than once inside a .pst or .ost data file. It reads the closed file straight from disk, so Outlook does not have to be installed or running, and nothing goes online. Your input archive is left as it was. The program writes a separate PST holding one message from each group of copies, together with a CSV log of the run.

  How to use Outlook Duplicate Remover
  1. Run the installer, start the program and click Open to load a .pst or .ost file from a local disk.
  2. Tick the folders to compare in the tree. Nested folders come along, so the Inbox is checked against Sent Items and the archive folders.
  3. Narrow the message list with the text filter when only part of the mailbox matters.
  4. Choose the match criteria. Subject, sender and body are on by default. Adding recipients or the sent date makes the rule stricter.
  5. Pick which message survives in each group, for example the oldest one.
  6. Set an output folder, decide on the backup PST and the CSV report, and press Start.

  Trial note: the free trial handles a limited share of the messages and then displays a reminder. A license lifts that cap, so the clean copy gets every unique email.

  What it handles
  - PST and OST archives, one per session, opened without Microsoft Outlook.
  - Copies scattered over several folders. The built-in Clean Up command misses them because it only looks inside a single folder.
  - Replies and forwards whose subject differs only by an RE: or FW: prefix, which can be ignored while matching.
  - An optional second PST with the removed copies, so any message can be put back later.
  - A UTF-8 CSV report that lists folder, subject, sender, date and whether each item was kept or removed.
  - Email messages only. Contacts and calendar items are not compared, and live Office 365 or IMAP accounts are not opened.

  Who it is for
  Help desk staff and power users who inherit a mailbox where one account was configured for POP and for IMAP at the same time, or where an old archive was imported twice. It also suits anyone who has to remove duplicates from PST file archives before passing them on to a colleague while the original stays intact for audit. As an Outlook duplicate email remover it runs offline, and the interface comes in 17 languages, German and Russian among them.

  Questions
  Why do I suddenly get duplicate emails?
  Usually an account was added twice, a Send/Receive cycle broke off and repeated, or a PST was imported again. A scan of the data file lets you remove duplicate emails Outlook created this way and keep one of each.

  How do I remove duplicate mail?
  Load the .pst or .ost here, tick the folders, set the match rules and press Start. To remove duplicate emails Outlook pulled down twice, that single pass is enough, and the result is a fresh PST.

  How to clean up a PST file that keeps growing with copies?
  Run a scan across folders and save the unique messages to a new PST, then open that file in Outlook. The old archive stays untouched as a fallback, which is the safe way to remove duplicate emails Outlook would otherwise keep syncing.
