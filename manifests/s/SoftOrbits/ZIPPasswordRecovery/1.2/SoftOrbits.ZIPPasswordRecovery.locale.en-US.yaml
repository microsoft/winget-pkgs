ShortDescription: Windows program for zip password recovery on your own archives. It checks the protection type, searches with a word list and masks, then saves a copy that opens without a prompt.
Description: |-
  ZIP Password Recovery Software is a zip password recovery tool for Windows 10 and 11. It helps when the archive is yours and the password is gone, for example a backup from an old PC or a file a former colleague protected. The program reads the archive header, reports whether it uses ZipCrypto or WinZip AES, and tries passwords on your computer. Nothing is uploaded, and the original archive is never modified.

  How to use ZIP Password Recovery Software
  1. Install the package and start the program.
  2. Drag .zip files into the window, or use Add Files or Add Folder for a whole directory.
  3. Choose the output folder in the Save to field.
  4. Press Start. The search begins with a dictionary and then moves to masks, and progress is shown for each archive.
  5. When the password is confirmed on the file, save the copy without protection to the folder you picked.

  Trial note: the free trial runs the complete search and tells you whether the password was found, but the unprotected copy is saved only in the registered version. A license turns saving on.

  What it handles
  - Archives with legacy ZipCrypto protection, which usually finish quickly even on a processor.
  - Archives with WinZip AES (AE-1 and AE-2, 128-bit and 256-bit keys), where a graphics card shortens the search a lot.
  - A mask for the part you remember, such as a word plus three unknown characters.
  - A queue of many archives taken from one folder, each one handled by the same zip password recovery run.
  - A time warning before the search starts when no graphics card is found.

  Limits
  Zip password recovery here covers .zip archives only, so RAR and 7z files are out of scope. A long, fully random password on WinZip AES may take an impractical amount of time or never turn up. Use the program on archives you created or are allowed to open.

  Who it is for
  IT staff and help desk technicians who get a ticket from someone who says they forgot zip password details, and people who want to recover zip password access to old backups. As a zip password unlocker it works on files you may lawfully open.

  Questions

  Can I remove the password from a ZIP file without knowing it?
  Not directly. The program first has to find the password through a dictionary or mask search, and only then does it write a copy with no protection. For a short or common password this often takes minutes.

  Is there zip password recovery for Android or Mac?
  No. This package is the Windows desktop program, and there is no phone or Mac build. Copy the archive to a Windows PC and run the search there.

  Can zip password recovery software handle a whole folder?
  Add the folder with Add Folder and every .zip inside joins the queue. The program works through them one after another and saves each recovered copy to the output folder.
