ShortDescription: Batch picture resize tool for Windows that shrinks or enlarges whole folders of photos by pixels, percent or a target file size in KB, for web shops and image-heavy sites.
Description: |-
  Batch Picture Resizer runs a batch picture resize on a Windows PC for anyone who has to fit a folder of photos into the size rules of a web shop, a marketplace or an upload form. You point it at the files, set the new dimensions once, and it writes the results while using every processor core. Nothing is sent to a server, the pictures stay on the disk where they already are.

  How to use Batch Picture Resizer
  1. Add pictures with Add Files or Add Folder, or drag them onto the window. The Explorer context menu sends a selection straight in.
  2. Open the size settings and pick the unit: pixels, percent or KB.
  3. Keep the aspect ratio, or turn on smart crop when every output has to be exactly the same shape.
  4. Choose an output folder. Same as original writes each copy beside its source, and the folder structure can be kept.
  5. Click Start to launch the batch picture resize and look through the destination folder when the run ends.

  Trial note: a free trial without sign-up lets you test the program on your own photos, and a license turns it into the full version.

  Sizing options
  - Width and height in pixels or as a percentage of the original.
  - A target weight in KB for JPEG output, with presets from 20 KB to 5 MB. The program tunes JPEG quality and scales down only if quality alone cannot reach the target, then saves the final file after a single recompression.
  - Resize only if larger, so small pictures are left alone.
  - A choice of resampling algorithms, Lanczos among them.
  - DPI and JPEG quality set per job.

  Other steps in the same run
  - Automatic rotation from EXIF orientation, plus flip, mirror and rotate.
  - Renaming, and a watermark stamped from text or an image file.
  - Format conversion on the way out, if the target system wants a different type.

  A command line mode lets a scheduled task resize multiple images at once whenever new files land in a folder, with no window to click. Each scripted batch picture resize uses the same settings you saved in the interface.

  Who it is for
  Online sellers whose listings have a pixel limit, webmasters trimming page weight, office staff who attach pictures to forms with a size cap, and photographers handing a client a lighter copy of a shoot. It works as a bulk image resizer on the local machine, with no account to create, and a batch picture resize of a few thousand files needs no internet connection.

  Questions

  Is there a way to bulk resize images?
  Yes. Add the folder, set one size rule and press Start, and every picture in it goes through a single batch picture resize.

  How can I reduce the size of images in bulk?
  Choose KB as the unit and type the weight you need. Each JPEG is written at or just under that number, which helps with upload portals and email.

  How do I resize 100 images at once?
  Put all 100 into one folder and add that folder. The job is split across CPU cores and finishes in one pass.
