ShortDescription: 'Desktop tool to convert PDF to CSV on Windows 10 and 11: it reads the tables in bank statements, price lists and reports, a whole folder per run, offline, with OCR for scanned pages.'
Description: |-
  PDF to CSV Converter is a Windows 10 and 11 program for people who need to convert PDF to CSV in bulk and cannot send documents to a web service. Point it at a folder of bank statements, payroll sheets, price lists or lab reports, and it writes the tables it finds into CSV files that open in any spreadsheet. All processing happens on the local machine, so no document is uploaded anywhere.

  How to use PDF to CSV Converter
  1. Run the program once installation is complete.
  2. Add single PDF files or a complete folder.
  3. Keep the OCR box ticked if some pages are scans. It is on by default, and text pages skip it automatically.
  4. Pick the delimiter: comma, semicolon, tab or vertical bar.
  5. Choose the output mode. One CSV per PDF is the default, and you can also get one CSV per table or tick the option that puts everything into a single file.
  6. Look at the text preview, then run the conversion.

  Trial note: the free trial exports only the first 10 data rows of every table (header rows are not counted) and shows a reminder screen. A license lifts the row limit and removes that screen.

  What it handles
  - Tagged PDFs saved from Word, Excel or Google Docs, read through their structure tags.
  - Tables drawn with vector grid lines.
  - Borderless tables, where columns are worked out from the gaps between words.
  - Scanned pages, recognized offline at about 3 seconds per page. OCR covers Latin script (English, German, French, Spanish, Italian, Polish, Czech, Slovak, Turkish) and Cyrillic (Russian, Ukrainian, Belarusian). Chinese, Japanese, Korean, Arabic, Thai, Greek and Hebrew are not recognized.
  - Tables that continue over several pages, joined into one with the repeated header rows dropped.
  - CSV output per RFC 4180, encoded as UTF-8 with a BOM.
  - A second output in QBO format for QuickBooks, built from text PDFs once the bank's FI ORG and FID are set from the built-in bank list. Without a valid FID no QBO file is written.
  - Accounting brackets such as (1 234,56), which always come out as -1234.56.
  - Formula protection, on by default: a cell that starts with =, +, - or @ gets a leading apostrophe, numbers excepted.
  - Optional cleanup of numbers, ISO 8601 dates and currencies. These boxes are off until you tick them.

  What to expect
  A PDF has no fixed way of storing a table, so the program rebuilds each one from the page layout. Clean digital files give the closest match, and scans depend on how good the scan is. There is no XLSX output, and column borders cannot be dragged in the preview. The quickest way to judge a PDF table extractor is to run it on your own documents during the trial, before you convert PDF files to CSV for real work.

  Who it is for
  Bookkeepers who convert PDF statements to CSV for import into their books, office staff who collect supplier price lists, and analysts who need report tables in a spreadsheet. It also fits anyone who has to extract table from PDF files every week but is not allowed to put client data on a website.

  Questions

  How do I turn a PDF into a CSV?
  To convert a PDF to CSV, add the file, choose a delimiter and an output mode, then start. With the default settings each PDF becomes one CSV that holds every table found in it.

  What is a bank statement converter?
  It is a tool that reads the transaction table of a statement and writes it as rows that a spreadsheet or accounting program can import. This one produces CSV, plus QBO for text PDFs with a known bank FID, and it can also convert scanned PDF pages to CSV.

  Can AI detect fake bank statements?
  This program does not judge whether a statement is genuine. It copies the table as printed on the page, so checking authenticity stays with you.
