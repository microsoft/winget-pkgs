ShortDescription: 'Photo restoration software for Windows that repairs scanned family prints on your PC: it clears scratches and stains, rebuilds faces with AI and adds color to black and white pictures.'
Description: |-
  SoftOrbits Photo Retoucher is photo restoration software for Windows made for people who have a box of old prints and a scanner. Once the pictures are scanned, it clears scratches and stains, reconstructs faded faces and can colorize black and white frames with AI. The processing happens on your own PC.

  How to use Photo Retoucher
  1. Scan the prints at the highest resolution your scanner offers and save them as TIFF, PNG or JPEG.
  2. Start the program and confirm the download of the AI models on the first run. Wait for it to finish.
  3. Open a scan and run the one-click AI restoration to repair faces and remove noise and blur.
  4. Turn on Colorize if you want color, or keep the picture black and white.
  5. Clean any leftovers with Object Remover or Clone Stamp, and adjust brightness and contrast by hand.
  6. Enlarge the result up to 8x before printing if the original was small.

  Trial note: with the free trial you can watch the AI repair a scan from start to finish, while storing the restored file stays disabled until registration. Entering a license makes saving available.

  What this photo restoration software covers
  - Automatic cleanup that can remove scratches from photos together with dust, spots and torn or cut-off areas.
  - AI face reconstruction that keeps the expression of the person in the frame.
  - Automatic colorization, with manual recoloring when a jacket or a dress gets the wrong shade.
  - Removal of date stamps, text, watermarks and people you do not want in the picture.
  - Batch mode that can run the full repair or only chosen steps, for example retouching faces only.
  - An AI enlarger for low resolution scans, up to 8x.
  - GPU acceleration through CUDA, with every function also available on the processor.
  - RAW, scanned TIFF, JPEG, PNG and other common image formats.

  Who it is for
  Family historians who gather pictures of ancestors for a family tree. Anyone digitizing a parent's album before the prints fade further. Photographers who also want photo retouching software for face cleanup on recent shots. People who install their tools with winget and prefer old photo restoration that keeps the family archive on a local disk instead of an upload page.

  Questions

  How can I restore a damaged old photo?
  Scan it at a high resolution, run the automatic AI repair, and fix what remains with the manual brushes. Badly damaged faces are rebuilt, but small details may differ from the original.

  Where can I restore old photos for free?
  The free trial of this photo restoration software lets you repair your scans and judge the full result on screen. Saving the repaired files needs a license.

  Which AI tool can restore old photos on a PC?
  SoftOrbits Photo Retoucher is photo restoration software that downloads its AI models to your computer and processes pictures there, so scans are not uploaded. It is tested on Windows 7, 10 and 11.
