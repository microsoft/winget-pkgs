ShortDescription: IMAP migration tool for Windows that copies mail between two accounts such as Gmail, Microsoft 365, Yahoo or iCloud, keeping folders, dates and read flags.
Description: |-
  IMAP to IMAP Email Migration Tool is an IMAP migration tool for Windows that moves the contents of one mailbox into another when you change host, provider or address. Both accounts are signed in at once, and the source is opened read-only, so the old mailbox loses nothing while copies land on the new side.

  How to use IMAP to IMAP Email Migration Tool
  1. Type the source address on the left. Presets cover Gmail, Microsoft 365, personal Outlook, Yahoo and iCloud, and Other IMAP server takes a manual host and port.
  2. Sign in. Gmail, Yahoo and iCloud need an app password, while a Microsoft account signs in through the login page of Microsoft.
  3. Repeat on the right for the receiving mailbox.
  4. Review the folder map. Folders missing on the destination are flagged for creation.
  5. Optionally limit the move to a date range.
  6. Press Start, follow the counters, and read the report at the end.

  Trial note: the free trial of this email migration tool moves only the latest 25 messages of every folder. With a license, repeat the same pair and the rest arrives, with no second copy of those 25.

  What it handles
  The IMAP migration tool carries over:
  - Folder structure, with Sent, Drafts and similar roles matched even when names differ between servers.
  - Dates and read, flagged and answered status.
  - Raw messages with attachments and headers, unchanged down to the byte.
  - Duplicate checks by Message-ID, so a second pass adds only new mail.
  - A journal that lets Continue resume after a dropped connection or a restart.
  - Junk, Trash and the Gmail views All Mail, Important and Starred, left unchecked by default.
  - Pauses and retries when a provider throttles, plus automatic reconnect.

  Who it is for
  People leaving an ISP or web host for Gmail or Outlook, anyone merging an old address into a current one, and small offices that need to migrate IMAP to IMAP while switching hosting, one mailbox pair at a time. Google Workspace accounts are not supported in this version.

  Questions

  How do I migrate my IMAP email to a new server?
  Sign in to the old account on the left and the new server on the right, check the folder map and press Start. In the IMAP migration tool, choose Other IMAP server when your host has no preset.

  How long does IMAP migration take?
  Mostly it comes down to how much mail there is and how quickly the two servers answer. The progress bar estimates the remaining time from recent transfer speed, and you can stop and resume later.

  How do I migrate all emails from one account to another?
  Add both accounts, leave every folder ticked and run the IMAP migration tool. If new mail arrives later, a second run copies just the additions.
