ShortDescription: HEIC to JPG converter that turns folders of iPhone HEIC and HEIF photos into JPG or PNG on a Windows 10 or 11 PC, keeping HDR color, color profiles and photo metadata.
Description: |-
  SoftOrbits HEIC to JPG Converter is a desktop HEIC to JPG converter for Windows 10 and 11, made for moving a phone photo library onto a PC in one pass. It reads HEIC and HEIF files, tiled and animated ones included, and writes JPEG by default, with PNG among the other targets. Conversion is spread over all processor cores, and no picture ever leaves the PC.

  How to use SoftOrbits HEIC to JPG Converter
  1. Drag HEIC photos into the main window. The Add files and Add folder buttons do the same job.
  2. Choose where the results go. Same as original writes each converted picture into the folder of its source.
  3. Leave the output format on JPEG or select another one, such as PNG.
  4. If disk space matters, add a resize step before the conversion.
  5. Press Start and open the destination folder when the batch is done.

  Trial note: a free trial is available, so you can run the conversion on your own HEIC files first. A license unlocks the full version.

  Scripting and Explorer
  The program adds a conversion command to the Windows Explorer menu. For unattended work there is a command line mode, so a PowerShell script can watch an input folder and convert new pictures as soon as they arrive from a phone or tablet.

  What it handles
  - HEIC and HEIF from current Apple devices, read according to the latest format specification, plus HEIC pictures from Android phones.
  - HDR pictures and wide-gamut color, with color profiles carried into the output.
  - Photo metadata kept in the converted files.
  - HEIC to PNG output when you need a lossless copy.
  - More than 40 image formats in total, among them WebP, GIF, TIFF, PSD, BMP and RAW types like CRW, NEF, ARW and DNG.
  - Batch edits on the way: resize, automatic rotation, crop and smart crop.
  - File renaming that puts the capture date into the name.
  - Large jobs: there is no cap on the number of files or on image size, and a broken file does not stop the rest of the batch.
  - A built-in HEIC viewer for checking pictures before you convert them.

  Who it is for
  People who need their HEIC photos on Windows in a format every program opens, anyone who needs JPG copies for printing, desktop editors or a website, and admins looking to call a heic converter from scripts. Online shops that receive product shots taken on phones fit here as well.

  Questions

  Why are my photos suddenly HEIC instead of JPG?
  Newer phones save camera shots as HEIC because the files take less space. Many Windows programs, older devices and websites still expect JPG, which is where a batch conversion helps.

  Why can't I save a HEIC file as a JPG?
  Plenty of viewers and editors on Windows cannot open HEIC, so they offer no JPG export for it. A HEIC to JPG converter like this one reads the file with up-to-date HEIC libraries and re-encodes it as JPEG.

  What is the fastest way to convert HEIC to JPG?
  Add the whole folder instead of single files and press Start. The batch runs on every CPU core, and one damaged picture does not interrupt it.
