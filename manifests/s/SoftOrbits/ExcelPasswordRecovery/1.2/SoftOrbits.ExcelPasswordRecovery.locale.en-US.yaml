ShortDescription: Windows tool for excel password recovery on your own workbooks. It clears forgotten sheet and workbook protection and searches for a lost open password on your PC.
Description: |-
  Excel Password Recovery Software is a Windows program for excel password recovery on workbooks that belong to you. It reads .xlsx and .xls files, tells you what kind of lock is on them, and either clears the protection or searches for the forgotten password. Everything runs on the local machine, so nothing is uploaded, and the source file stays as it was.

  How to use Excel Password Recovery Software
  1. Install the package and start the program.
  2. Add workbooks with Add Files, or use Add Folder to load every workbook in a directory.
  3. Pick a destination folder.
  4. Press Start. The button turns into Stop while the job runs, and a progress bar shows how far it has got.
  5. When the result window opens, review it and save the unlocked file.

  Trial note: the free trial does the whole job and shows the result window, but the password is masked after its first character and no unlocked file is written. A license reveals the full password and lets you save the file.

  What it handles
  - A sheet or workbook you protected and forgot the password for. This lock is not encryption, so the program can unprotect excel sheet settings without any password search.
  - A workbook that asks for a password to open. Here the program searches with a word list and mutation rules, and the window then reports the recovered password and its length.
  - Legacy .xls files and current .xlsx files in the same queue.
  - A graphics card, which speeds up excel password recovery for an open password when one is present.

  Limits
  Newer Excel files use slow key derivation, and the search on a graphics card runs at a few thousand guesses per second. A word, a name or a date with a few digits is realistic. A long random password may never turn up, and the program does not promise it. Use it only on files you created or are allowed to open.

  Who it is for
  Windows administrators and help desk staff who get a workbook with a lost password and want a local excel password remover instead of a web service. Also anyone who needs to recover excel password access to an old budget or report from a previous job.

  Questions

  How do I unlock an Excel workbook if I forgot the password?
  Add the file and press Start. If the lock is on a sheet or the workbook structure, the program clears it directly. If the file asks for a password to open, it searches with a dictionary and rules.

  How can I unprotect an Excel sheet online without using a password?
  You do not need a web service for it. This program works offline, and a sheet lock is cleared on your PC, so the workbook is never sent anywhere.

  How do I turn off password protect in Excel?
  Excel does that from its own menus when you know the password. When you have lost it, the registered version of this program saves a copy of the workbook with the protection removed.
