ShortDescription: NSF to PST converter for Windows that reads Lotus Notes .nsf and .ntf databases without HCL Notes installed and writes the mail into a Unicode PST for Outlook.
Description: |-
  This NSF to PST converter for Windows 10 and 11 targets admins finishing a Notes to Outlook migration after the HCL Notes client has already been removed. NSF to PST Converter Software for Lotus Notes parses the .nsf database file on its own, with no Notes installation and no Domino server, and writes the mail folders into a Unicode PST that Outlook 2016 or newer opens.

  How to use NSF to PST Converter Software for Lotus Notes
  1. Install the package and start the program.
  2. Click Open and select a .nsf or .ntf file, or drag it onto the window.
  3. Wait for the scan to finish, then browse the folder tree.
  4. Optionally limit the export by date range, by a word in Subject, From or To, or by leaving out Trash. The list shows exactly what will be exported.
  5. Choose an output folder and press Start, then open the PST in Outlook.

  Trial note: the free trial converts a database of up to 20 messages in full, while a larger one exports about a tenth of its messages, at most 100 per run, with a registration reminder. A license converts every selected message.

  What it handles
  - Notes databases in ODS 41 to 55, which covers Notes 5 and later.
  - Folder structure from the view formulas, with system containers such as ($Inbox) given plain names.
  - Message bodies stored as Notes CD records or as the original MIME.
  - Attachments compressed on the Domino server, unpacked into real files.
  - Real SMTP addresses taken from headers instead of canonical CN= names, with a fallback domain you supply.
  - Non-English text in the LMBCS character set.
  - Messages that appear both in a folder and in All Documents, written to the PST once.

  Outside its scope
  The NSF to PST job covers mail only, so calendar entries, tasks and contacts are not converted. Databases protected with Notes encryption need a user ID file, which the program does not use, and files older than ODS 41 are reported as unsupported.

  Who it is for
  IT admins and contractors who need to convert NSF to PST for each user's mail file after Notes is gone. Records and legal staff who must hand over an old corporate mailbox as one file Outlook can mount.

  Questions

  How do I convert NSF to PST?
  Open the .nsf file in this program, narrow it with filters if needed and press Start. The result is a PST file you open or import in Outlook.

  How can I open an NSF file?
  Without Notes, the practical route is conversion: the NSF to PST converter reads the database directly, and the PST it writes opens in Outlook. Renaming the file to .pst does not work, since the formats are unrelated.

  What is a PST converter?
  It is a program that reads mail kept in another format and writes it into a PST, the Outlook Data File. This one takes Lotus Notes .nsf and .ntf databases as its source.
