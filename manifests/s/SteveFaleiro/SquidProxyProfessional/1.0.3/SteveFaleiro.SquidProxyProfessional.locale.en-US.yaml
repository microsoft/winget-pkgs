ShortDescription: The Squid web proxy for Windows, installed as a Windows service and managed from a desktop console. Commercial; needs a license key (free 30-day trial).
Description: |-
  Squid Proxy Professional is a supported Windows distribution of the Squid caching web proxy: Squid built from source for Windows, a code-signed installer, a Windows service, and a management console to set it up and run it.

  This is commercial software that needs a license key. A free 30-day trial key is available from the website; the trial is the full product and starts when the key is activated. Without an active key the console opens read-only and the service does not start the proxy.

  After installing, open Squid Proxy Professional from the Start menu, activate a key on the Licensing page, and run the Setup Wizard, which writes squid.conf, installs the Windows service and starts it.

  Features: Squid 7.8 built from source (64-bit); runs as a Windows service; a Setup Wizard; access rules, listener, cache and logging set in forms, each change checked with squid -k parse and backed up first; optional Windows domain sign-on (Kerberos/NTLM); log rotation; live logs, diagnostics, backup and restore.

  Uninstalling removes the program and the service and keeps the data folder (configuration backups, cache, logs and the license file).
