ShortDescription: Wireless and USB Android screen mirroring, Remote apps, Phone-to-PC sync, and fleet management built on scrcpy and ADB.
Description: |-
  Paneless is a free, open-source Windows desktop GUI for scrcpy and ADB.

  Features include wireless and USB device discovery, one-click screen mirroring, Remote apps (running Android apps in standalone Windows windows with desktop shortcuts), Devolutions RDM session export and embedded tabs, a files and photos browser, always-on clipboard sync, quick controls and media controls, fleet grouping and automation (recipes, schedules, alerts), a live multi-screen Wall overview, Logcat crash filtering, and an optional local MCP server for AI assistants. Everything runs locally with no companion Android app required.
