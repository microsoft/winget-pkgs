ShortDescription: Use your Android phone as a touchpad and keyboard for your PC, even at the Windows sign-in screen.
Description: |-
  DeskWand for PC is the free Windows part of DeskWand, an Android app that turns your phone into a touchpad and keyboard for your computer.
  It runs as a service, so the phone works already at the sign-in screen, on the lock screen and in UAC prompts.
  Pair once by tapping the PC in the app, scanning a QR code or entering a six-digit code.
  The connection stays in your local network (or goes through your own VPN) and is encrypted; the notification-area icon shows which phones are paired and which are in control.
  The Android app is on Google Play: https://play.google.com/store/apps/details?id=schematic.deskwand
