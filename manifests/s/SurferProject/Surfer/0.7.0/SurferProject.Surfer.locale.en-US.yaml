ShortDescription: A waveform viewer with a focus on a snappy usable interface, and extensibility.
Description: |-
  Surfer is a waveform viewer for VCD, FST and GHW files produced by digital hardware simulators.
  It focuses on a snappy, usable interface and extensibility.
  The package also includes Surver, a server that serves waveform files to a Surfer client running on another computer, so the waveform files do not have to be copied.
