ShortDescription: Your personal context engine.
Description: |-
  LokalBot is a free, open-source app that remembers your work on your own computer. It records meetings without a bot joining the call, transcribes and summarizes them on-device, and lets you search and ask about your meetings and, if you turn it on, what you saw on screen. Processing runs locally by default.
  The Windows app is an alpha: the installer isn't code-signed yet, so SmartScreen may warn on first launch, and a few features of the Mac app haven't been ported.
