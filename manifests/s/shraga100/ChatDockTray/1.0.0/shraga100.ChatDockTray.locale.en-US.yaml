ShortDescription: Tray icon and taskbar unread count for the ChatDock Chrome extension (an unofficial companion for Google Chat).
Description: |-
  A small helper for the ChatDock Chrome extension. Chrome starts it through native messaging while "Icon in the system tray" is on in ChatDock's options.
  It shows ChatDock's icon with the unread count in the system tray and on the ChatDock window's taskbar button, and keeps ChatDock's hidden windows off the taskbar.
  It opens no network connection and talks only to the ChatDock extension. Installs for the current user, without admin rights.
