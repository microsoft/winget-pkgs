ShortDescription: CLI for SCPI instruments over HiSLIP, VXI-11, raw socket, USBTMC and serial
Description: |-
  ivi-cli manages, diagnoses and operates instruments addressed by VISA resource strings.

  - HiSLIP, VXI-11, raw socket and serial without a VISA runtime; USB through the installed VISA runtime
  - LAN and USB discovery (LXI mDNS, VXI-11 broadcast)
  - Scenario-driven mock instrument and SCPI gateways
  - Management HTTP / WebSocket API with tokens, TLS and audit
