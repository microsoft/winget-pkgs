ShortDescription: Pin every local repository to one GitHub identity, so the wrong account — or a coding agent — never pushes for you.
Description: Shehata Git assigns one authenticated GitHub identity to each local repository and routes HTTPS credentials per repository, so a terminal or a coding agent cannot push with the wrong account. Force push, destructive reset, and remote deletion are absent by design, and every operation is recorded in a redacted local activity trail.
