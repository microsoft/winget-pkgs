ShortDescription: Give a local folder its own drive letter on Windows, without copying files.
Description: |-
  ScsSubst is a small graphical front end for the Windows subst command: pick a local folder and a free drive letter, and the folder gets its own letter. Nothing is copied or moved, so Z:\ and the original path are the same files on the same disk. It uses plain Windows APIs, so no file-system driver is installed and no administrator rights are needed. One limitation is worth knowing: a subst mapping lives in the Windows session that created it, so it is gone after a log-off or a reboot, and services or scheduled tasks running in Session 0 do not see the drive letter. ScsSubst keeps the list of mappings and can re-apply them at start-up, so the letters are back when you sign in again. Only local folders can be mapped; network shares are not supported. A 7-day full-feature trial is included, with no ads and no forced subscription.
