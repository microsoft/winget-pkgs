ShortDescription: 把本地文件夹映射成独立盘符，不复制文件、不装驱动。
Description: |-
  ScsSubst 是 Windows subst 命令的图形界面：选一个本地文件夹和一个空闲盘符，这个文件夹就有了自己的盘符。不会复制或移动任何文件，Z:\ 与原路径是同一份数据、同一块盘。它只用 Windows 自带 API，不安装文件系统驱动，也不需要管理员权限。有一个限制值得先知道：subst 映射属于创建它的那个 Windows 会话，注销或重启后就没了，运行在 Session 0 的服务和计划任务也看不到这个盘符。ScsSubst 会保存映射清单，并可在启动时重新应用，所以盘符会在你再次登录时回来。只能映射本地文件夹，不支持网络共享。含 7 天完整功能试用，没有广告，也没有强制订阅。
