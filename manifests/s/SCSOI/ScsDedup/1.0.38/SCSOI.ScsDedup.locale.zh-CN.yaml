ShortDescription: "按文件内容哈希找重复文件，并看清能回收多少空间。"
Description: |-
  ScsDedup 按文件内容而不是文件名归组，所以改过名、挪过位置的副本一样会被认成重复。它对文件做哈希计算（SHA-256），把内容完全相同的文件归到一组，并显示这一组能回收多少空间。它是「先看报告」型的工具：扫描结束后给出 HTML 报告，可导出 HTML 或 CSV，程序本身不会替你删文件，保留哪一份由你决定。免费下载含一次完整分析报告；一次买断后本机不限次扫描。没有广告，也没有订阅，界面与报告支持中、英、日、韩、西、法、德、俄八种语言。Windows 10 / 11，64 位。
