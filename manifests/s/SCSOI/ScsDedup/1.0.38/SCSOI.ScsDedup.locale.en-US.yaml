ShortDescription: "Find duplicate files on Windows by content hash and see how much space they waste."
Description: |-
  ScsDedup groups files by their content instead of by their name, so copies that were renamed or moved are still reported as duplicates. It hashes the files (SHA-256) and shows each group of identical content together with the space it can reclaim. It is report-first: the analysis produces an HTML report you can export as HTML or CSV, and the tool does not delete anything for you - you decide what to keep. The free download includes one complete analysis report; a one-time buyout then allows unlimited scans on that machine. There are no ads and no subscription, and the interface and the report are available in Chinese, English, Japanese, Korean, Spanish, French, German and Russian. Windows 10 / 11, 64-bit.
