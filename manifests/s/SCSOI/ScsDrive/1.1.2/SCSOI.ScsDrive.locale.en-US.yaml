ShortDescription: Mount a NAS, WebDAV share or cloud storage as a real local Windows drive letter.
Description: |-
  ScsDrive mounts a NAS, WebDAV share or cloud storage as a real local disk, so it shows up under "This PC" with its own drive letter and programs that only accept local paths can open it directly. Mounting needs no administrator rights, the client has no ads and no forced subscription, and a 7-day full-feature trial is included. On first launch the client sets up the open-source user-mode driver Dokany (LGPL), so there is nothing extra for you to install or configure. The mount belongs to the Windows session that created it, so services and scheduled tasks running in Session 0 do not see the drive letter.
