ShortDescription: 把 NAS、WebDAV 或云存储挂载成 Windows 本地盘符
Description: |-
  ScsDrive 把 NAS、WebDAV 共享或云存储挂载成本机真实磁盘，在"此电脑"里拥有自己的盘符，只接受本地路径的程序也能直接打开。挂载不需要管理员权限，客户端没有广告、没有强制订阅，含 7 天完整功能试用。首次启动时客户端会自行配置开源用户态驱动 Dokany（LGPL），使用者无需额外安装或配置。挂载归属于创建它的 Windows 会话，Session 0 中的服务与计划任务看不到该盘符。
