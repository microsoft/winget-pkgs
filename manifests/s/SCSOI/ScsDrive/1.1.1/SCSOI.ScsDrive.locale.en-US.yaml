ShortDescription: Mount a NAS, WebDAV share or cloud storage as a real local Windows drive letter.
Description: |-
  ScsDrive mounts a NAS, WebDAV share or cloud storage as a real local disk, so it shows up under "This PC" with its own drive letter and programs that only accept local paths can open it directly. The mount needs no administrator rights, the client has no ads and no forced subscription, and a 7-day full-feature trial is included. The mount belongs to the Windows session that created it, so services and scheduled tasks running in Session 0 do not see the drive letter.
