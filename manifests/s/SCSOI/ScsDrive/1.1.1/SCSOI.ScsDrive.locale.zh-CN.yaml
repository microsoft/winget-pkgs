ShortDescription: 把 NAS / WebDAV / 网盘挂成 Windows 里的真实本地盘符。
Description: |-
  ScsDrive 把 NAS、WebDAV 或网盘挂成「此电脑」里的真实本地磁盘，有自己的盘符，只认本地路径的老软件也能直接打开。挂载不需要管理员权限，客户端无广告、不强制订阅，含 7 天全功能试用。挂载属于创建它的那个 Windows 会话，因此跑在 Session 0 的服务和计划任务看不到这个盘符。
