ShortDescription: "Grow a Windows C: drive from free space on the same physical disk."
Description: |-
  ScsExpand gives unused free space that sits on the same physical disk to the C: volume, so a Windows system drive can grow without a new disk. Nothing is reformatted and no partitions are merged; the files stay where they are and only the capacity moves. The pre-check refuses, before anything starts and with the reason spelled out, free space that lives on a second physical disk, BitLocker-locked volumes, non-NTFS source partitions such as FAT32, and dynamic disks. The resize itself runs in a guided restart environment rather than WinPE: the machine restarts once, the space is moved, and Windows comes back on its own. The free download includes one expansion of up to 5 GB, and a one-time buyout removes that limit; there are no ads and no forced subscription.
