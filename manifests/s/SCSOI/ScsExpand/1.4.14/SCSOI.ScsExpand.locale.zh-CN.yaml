ShortDescription: "用同一块物理盘上的空闲空间给 Windows C 盘扩容。"
Description: |-
  ScsExpand 把同一块物理盘上闲置的空闲空间划给 C: 卷，让系统盘在没有新硬盘的情况下也能变大。不会格式化，也不合并分区；文件留在原地，只是容量在分区之间移动。前置检查会在动手之前就拒绝并说明原因的情况有：空闲空间在第二块物理盘上、被 BitLocker 锁定的卷、源分区不是 NTFS（例如 FAT32）、以及动态磁盘。扩容本身跑在引导式重启环境里而不是 WinPE：机器重启一次，空间移动完成，Windows 自己回来。免费下载含一次最大 5 GB 的扩容额度，一次买断后不限次数与大小；没有广告，也没有强制订阅。
