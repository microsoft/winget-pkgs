ReleaseNotes: |-
  ⚠️ Security
  #704 Update Go to v1.27.3
  This release is built with Go 1.27.3, which fixes CVE-2026-111943 in crypto/x509. Go now refuses trust in a small set of intermediate certificates of a specific Certificate Authority, after its CA keys were reported compromised. Verify filters out chains containing those intermediates. The Go team highly recommends upgrading immediately.
  ghtkn talks to GitHub over TLS and relies on crypto/x509 to verify the server certificate, and that connection carries your access tokens and refresh tokens. We recommend upgrading.
  ref.
  - https://go.dev/doc/devel/release#go1.27.3
  - https://thehackernews.com/2026/10/eight-emudhra-ca-keys-compromised.html
  This release also includes Go 1.27.2 (#681), which has security fixes to the go command and the crypto/tls, html/template, net/http, net/textproto, and os packages.
  - https://go.dev/doc/devel/release#go1.27.2

  Documentation
  #703 Compare ghtkn with GitHub CLI's expiring tokens

