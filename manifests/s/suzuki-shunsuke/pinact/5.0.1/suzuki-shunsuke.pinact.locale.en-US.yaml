ReleaseNotes: |-
  ⚠️ Security
  #1792 Update Go to v1.27.3
  This release is built with Go 1.27.3, which fixes CVE-2026-111943 in crypto/x509. Go now refuses trust in a small set of intermediate certificates of a specific Certificate Authority, after its CA keys were reported compromised. Verify filters out chains containing those intermediates. The Go team highly recommends upgrading immediately.
  pinact relies on crypto/x509 to verify the TLS certificate of GitHub when it calls the GitHub API, with your access token if one is set, to resolve the commit SHAs that workflows are pinned to. We recommend upgrading.
  ref.
  - https://go.dev/doc/devel/release#go1.27.3
  - https://thehackernews.com/2026/10/eight-emudhra-ca-keys-compromised.html
  This release also includes Go 1.27.2 (#1764), which has security fixes to the go command and the crypto/tls, html/template, net/http, net/textproto, and os packages.
  - https://go.dev/doc/devel/release#go1.27.2

  Others
  #1766 ci: Update GitHub Actions runner to ubuntu-26.04
  #1767 ci: Use download-go-module-action
  #1768 ci: Share Go modules between integration test and go-test-full-workflow
  #1774 ci: Use the reusable workflow of go-autofix-action
  #1782 ci: Replace go-test-full-workflow with go-test-workflow and test-workflow

  Dependency updates
