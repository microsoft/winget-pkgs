ShortDescription: Convert HDR game screenshots (ReShade .jxl, NVIDIA / Game Bar .jxr) into Ultra HDR JPEGs that stay HDR on Instagram, phones and browsers.
Description: |-
  UltraShot turns HDR game screenshots into Ultra HDR JPEGs: ordinary JPEG files that carry a gain map, so Instagram, Threads, Google Photos, Chrome, Edge and Android phones display them in HDR while every other screen shows a correct SDR image. It reads the lossless JPEG XL files written by ReShade and the JPEG XR files written by the NVIDIA App and the Windows Game Bar, never alters the HDR data, writes gain-map metadata that phones apply in full, and prepares an Instagram-sized copy so nothing has to change during upload. A watch folder converts new captures automatically; the app runs from the tray and can start with Windows.
