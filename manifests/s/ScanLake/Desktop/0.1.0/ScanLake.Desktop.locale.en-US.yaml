ShortDescription: Reads the Star Citizen mining-scan HUD and uploads the scans to ScanLake.
Description: |-
  ScanLake Desktop reads the mining-scan panel of the Prospector, MOLE and Golem in Star Citizen
  (mass, resistance, instability, volume and composition), shows what it read in an overlay over
  the game, and uploads the scans to ScanLake. Shared sessions let a crew see each other's rock
  clusters and navigate back to them.
