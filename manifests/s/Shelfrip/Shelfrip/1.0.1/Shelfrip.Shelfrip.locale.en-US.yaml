ShortDescription: Rip DVDs, Blu-rays and 4K discs with MakeMKV, then name movies, episodes and extras for Plex, Jellyfin, Emby or Kodi.
Description: |-
  Shelfrip turns a stack of discs into a properly named media library. Put a DVD, Blu-ray or 4K disc in and it rips with MakeMKV (no re-encoding), works out the movie or show, puts episodes in order, and names the special features by matching run times against TheDiscDB and a shared disc database. You check every name before anything moves, then it files the disc into Plex, Jellyfin, Emby or Kodi exactly where your server expects it. It also rips music CDs to FLAC.
  Requires MakeMKV, installed and licensed separately.
