ShortDescription: Out-of-band command line utility for managing Supermicro IPMI devices (BMC) and SuperBlade systems.
Description: |-
  SMCIPMITool is a command line interface utility for Supermicro IPMI devices (BMC) and SuperBlade systems. It manages servers out-of-band, over the network, and complements the in-band IPMICFG.

  Key features:
  - IPMI and Supermicro OEM commands against a remote BMC (power control, sensors, SEL, FRU, users, network settings)
  - BMC and BIOS firmware update, virtual media and remote KVM launch
  - SuperBlade, MicroBlade and other chassis management
  - Shell mode and batch execution across many hosts

  This is the Windows build with a bundled Java runtime, so no Java installation is needed.
