ShortDescription: In-band command line utility for configuring IPMI devices (BMC/FRU) on Supermicro servers.
Description: |-
  IPMICFG is an in-band utility for configuring IPMI devices. It is a command line tool providing standard IPMI and Supermicro proprietary OEM commands, and is used for BMC/FRU configuration.

  Key features:
  - Set up IPMI IP address and configuration
  - Configure IPMI user management
  - Configure IPMI FRU
  - Manage the System Event Log (SEL)
  - Manage IPMI by node management (NM) protocol
