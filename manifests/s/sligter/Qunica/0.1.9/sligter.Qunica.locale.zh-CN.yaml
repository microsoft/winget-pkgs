ShortDescription: 让人和 AI Agent 在同一个本地优先的房间里规划、分工并交付。
Description: Qunica 让人与 AI Agent 进入同一个工作空间，一起规划、分工、编码和交付。会话记录与项目文件共享，群组支持四种消息路由拓扑，外部 Agent 命令行通过 ACP 接入，Shell 命令则经由受保护的审批流程执行。后端在本地运行，工作数据保留在自己的设备上。
