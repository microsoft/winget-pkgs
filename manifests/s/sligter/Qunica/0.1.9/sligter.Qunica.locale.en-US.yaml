ShortDescription: One local-first room where people and AI agents plan, delegate and ship together.
Description: Qunica brings humans and AI agents into the same workspace to plan, delegate, code and ship. Conversation history and project files are shared, groups support four routing topologies, external agent CLIs join through ACP, and shell commands go through a guarded approval workflow. The backend runs locally, so the work stays on your own machines.
