ReleaseNotes: |-
  ## What's Changed

  - **Python 3.14 installs are now rejected.** `torrra` declares `Requires-Python: <3.14` because `libtorrent` still has no cp314 wheels. Previously, installing on Python 3.14 could silently resolve to an ancient `torrra` 0.1.2.
  - If 3.14 is your default interpreter, use `uv tool install torrra --python 3.13` (or `pipx install --python 3.13 torrra`).
  - Documented the Python requirements and the workaround in the installation guide.
  - CI now actually tests Python 3.10–3.13 (the matrix previously always ran 3.13 because `.python-version` took precedence).

  **Full Changelog**: https://github.com/stabldev/torrra/compare/v2.6.0...v2.6.1
