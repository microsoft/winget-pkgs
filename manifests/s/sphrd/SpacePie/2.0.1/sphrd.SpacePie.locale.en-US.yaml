ShortDescription: Fast, free and open-source disk space analyzer and cleaner.
Description: |-
  SpacePie shows where your disk space went and helps you free it. It scans a whole drive in seconds (reading the NTFS master file table when run as administrator), shows folders and files as a pie chart or treemap, suggests caches and temporary files that can be removed, finds big, old and duplicate files, and uninstalls apps together with the files they leave behind. One small portable app, nothing to install.
