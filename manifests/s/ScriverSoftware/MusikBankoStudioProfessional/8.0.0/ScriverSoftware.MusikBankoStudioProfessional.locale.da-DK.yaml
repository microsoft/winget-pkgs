ShortDescription: Komplet dansk løsning til professionel musik-banko med Generator, live Kontrolcenter og Analysecenter.
Description: |-
  Musik-Banko Studio Professional 8 er ikke bare et traditionelt musik-banko-program.
  Det er en komplet dansk løsning udviklet specifikt til professionel musik-banko,
  hvor Generator, live Kontrolcenter og Analysecenter er samlet i ét system.
  Programmet hjælper dig gennem hele arrangementet – fra oprettelse af bankoplader
  og planlægning af spillelisten til den live afvikling, kontrol af gevinster og
  styring af musikken. Med integration til VirtualDJ kan Musik-Banko Studio indgå
  direkte i den musikalske afvikling og samle endnu mere af arbejdsgangen ét sted.
  Professional 8 indeholder en række specialudviklede funktioner, der går langt ud
  over almindelige musik-banko-løsninger og giver spilleværten både kontrol,
  overblik og fleksibilitet før, under og efter arrangementet.
