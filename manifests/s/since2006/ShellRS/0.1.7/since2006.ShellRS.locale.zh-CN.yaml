  新增
  - Windows 上 SFTP 本地目录列表列出各个驱动器，可切换到其他盘。

  改进
  - SFTP 文件列表点列名即可排序。

  修复
  - 修复经部分堡垒机上传文件失败、编辑器保存时 SFTP 连接断开。
  - 修复 SFTP 换目录后拖宽的列恢复原宽。
