PackageIdentifier: since2006.ShellRS
PackageVersion: 0.1.16
PackageLocale: zh-CN
ShortDescription: GPU 渲染的原生 SSH 客户端。
Description: ShellRS 是一个免费开源的 SSH 客户端，用 Rust 编写、由 GPU 渲染界面：主机管理、终端、WinSCP 式 SFTP 和端口转发，都在一个窗口里，支持 macOS、Windows 和 Linux。
