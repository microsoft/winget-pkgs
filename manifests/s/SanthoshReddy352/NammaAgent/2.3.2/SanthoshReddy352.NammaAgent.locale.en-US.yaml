ReleaseNotes: |-
  **Which file do I download?**
  • **Windows** → `NammaAgentInstaller-<ver>.exe`
  • **Mac (Apple Silicon — M1 and later)** → `NammaAgent-<ver>-arm64.dmg`
  • **Mac (Intel)** → `NammaAgent-<ver>-x86_64.dmg`
  • **Linux** → `NammaAgentInstaller-<ver>-x86_64.AppImage` (`chmod +x`, then run — no libfuse2 needed), or the source zip
  • **Server/VPS** → skip the installers：[one-line install](https://github.com/SanthoshReddy352/Namma-Agent/blob/main/docs/DEPLOY.md)

  *macOS note：the app isn't code-signed yet. If macOS blocks it, right-click → Open, or approve it under System Settings → Privacy & Security.*


