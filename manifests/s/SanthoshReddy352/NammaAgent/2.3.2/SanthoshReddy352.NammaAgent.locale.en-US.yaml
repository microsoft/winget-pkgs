ShortDescription: The trustworthy personal AI agent that measurably knows you — first-class on Windows.
Description: Namma Agent is a self-hosted personal AI agent. Any cloud brain (Anthropic, OpenAI, Google, or any OpenAI-compatible endpoint), ~90 native tools, an in-process memory engine with a published recall benchmark, event-driven watchers, and a layered trust model (per-channel sender trust, injection screening, sandboxed shell, secrets vault) that is on by default and visible in the UI.
