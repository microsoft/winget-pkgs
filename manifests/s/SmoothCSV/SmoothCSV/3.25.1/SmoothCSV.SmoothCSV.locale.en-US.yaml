ShortDescription: A fast, full-featured CSV editor for Windows, macOS, and Linux.
Description: |-
  SmoothCSV is a fast, full-featured CSV editor for Windows, macOS, and Linux.

  It focuses on making CSV editing feel familiar: grid editing like Excel, keyboard-first workflows like VS Code, and careful preservation of details like encoding, delimiter, and original quoting.

  It also brings together SQL queries on CSV data, multi-cell editing, side-by-side CSV comparison, and support for messy files with inconsistent column counts.

  All features are free. An optional one-time license supports continued development.
