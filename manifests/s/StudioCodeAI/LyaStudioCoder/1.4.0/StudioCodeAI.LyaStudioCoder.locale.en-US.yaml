ReleaseNotes: |-
  🌌 Lya Studio Coder v1.4.0 — Core5 V2 Nativo (768d), CURE Auto-Mitigação e Chat Sanitizado
  > 🚀 Release de Produção. Versão oficial compilada para Microsoft Store (Partner Center), Winget e GitHub Releases. Incorpora o subsistema de memória de longo prazo nativo em Rust, auto-mitigação de erros com o CURE e blindagem estrita de privacidade em todo o instalador.
  ✨ Principais Destaques
  - 🧠 Core5 V2 Nativo (768d em Rust): Motor de memória de longo prazo embarcado como crate nativo de alto desempenho (src-tauri/core5), eliminando subprocessos externos. Espaço vetorial canônico unificado de 768 dimensões com LanceDB embarcado e 8 ferramentas MCP in-process (memory_boot, memory_search, cure_report, memory_save, ace_export, ace_import, memory_get, memory_catalog).
  - 🩹 Projeto CURE — Auto-Mitigação & Diagnósticos: O motor CURE atua de forma preventiva e corretiva. Ao detectar cicatrizes de falhas no projeto, injeta diagnósticos técnicos e tooltips inline diretamente no editor Monaco e orientações de mitigação no Chat — preservando o prefixo para não invalidar o Prompt Caching das LLMs.
  - 📊 MemoryStudio & CureScarCard: Painel visual aprimorado para inspeção do grafo de memória, ciclo de vida das cicatrizes curadas, contadores de feridas e monitoramento em tempo real do disjuntor de segurança.
  - 🛡️ Privacidade Absoluta e Chat Sanitizado: Resolução definitiva de resíduos de sessão. A distribuição de produção é 100% auditada (scripts/audit-bundle.mjs), iniciando sempre com uma tela de boas-vindas limpa e interativa (Welcome Empty State), sem qualquer histórico, conversa ou credencial pré-gravada.
  - 📖 Manual Oficial do Usuário: Documentação arquitetural e guia prático detalhado cobrindo todos os 20 subsistemas da IDE, disponível em docs/MANUAL_DO_USUARIO.md.
  - 📸 Galeria Visual: Nova vitrine com capturas em alta resolução dos módulos em execução disponível no README e nas lojas.
