License: Apache-2.0
LicenseUrl: https://github.com/sigstore/gitsign/blob/HEAD/LICENSE
ShortDescription: Optional gitsign helper that caches signing credentials in memory
Description: gitsign-credential-cache is an optional helper binary for gitsign that caches ephemeral private keys and Fulcio signing certificates in memory over a local socket, so back-to-back signing operations do not need to repeat the OIDC authentication flow.
