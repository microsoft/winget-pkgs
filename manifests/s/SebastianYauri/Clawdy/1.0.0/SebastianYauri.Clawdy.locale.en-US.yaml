ShortDescription: A tiny animated desktop buddy that shows your Claude usage and acts out what Claude Code is doing.
Description: |-
  Clawdy sits in a corner of your screen and shows how much of your Claude plan you have used: the 5-hour session, the weekly limit and per-model limits, as rings around an animated pixel mascot. Hover it to see every limit and when it resets.
  With Claude Code hooks enabled, Clawdy acts out what Claude Code is doing: thinking, writing code, running commands, juggling subagents and celebrating when the job is done. It also has seasonal costumes.
  It reads the same data as /usage in Claude Code using your existing session: no API key, no extra cost, no telemetry. Not affiliated with Anthropic.
