ShortDescription: Organise a big, messy video library offline. Find duplicate videos, clean file names and organise folders.
Description: |-
  SceneSort Pro organises a big, messy media library on your own Windows 10/11 PC.
  It finds duplicate videos, including re-encoded or renamed copies (file size, a content fingerprint and sampled frames),
  cleans cluttered file names with a side-by-side review before anything changes, organises files into folders,
  and lets you browse and search the whole library in one place.
  Everything runs offline: no account, no cloud, full undo.
  Scanning, browsing and previewing are free with no time limit; a one-time Pro licence applies the fixes.
