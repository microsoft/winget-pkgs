ShortDescription: Zero-config, zero-token P2P E2EE file transfer, chat, and MCP server for AI agents
Description: >-
  SRIFT is a zero-config, zero-token peer-to-peer secure file transfer tool,
  encrypted chat, and Model Context Protocol (MCP) server for AI coding
  agents (Claude, Cursor, Windsurf, Continue, Zed) and developers. Sessions
  and --encrypt links are end-to-end AES-256-GCM encrypted with keys made on
  the devices (ECDH P-256 + HKDF-SHA256); nothing is retained centrally.
