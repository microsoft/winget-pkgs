Description: 交我汇（jAide）是由思源极客协会开发的上海交通大学学生工作智慧助手。支持 jAccount 统一身份认证登录，覆盖征兵报名、心理咨询、就业指导、第二课堂、奖助学金申请等学生工作服务。集 AI 智能对话（任意大模型接入、MCP 工具池、Agent Skills）、可拖拽智能数据看板、校园资讯订阅与 AI 摘要推送、日程与 DDL 管理、自动化工作流、插件市场与 AI 造插件于一体。日程、资讯、会话、看板全部存储在本机 SQLite 数据库，jAccount 凭据以 AES-256-GCM 加密保存于本地，零 PII 遥测。
