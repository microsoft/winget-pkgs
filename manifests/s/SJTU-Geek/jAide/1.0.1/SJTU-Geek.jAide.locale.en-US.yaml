ShortDescription: Student affairs smart assistant for Shanghai Jiao Tong University with AI chat, campus services, dashboard, and automation workflows.
Description: jAide (交我汇) is a student affairs assistant for Shanghai Jiao Tong University developed by the SJTU-Geek association. It signs in with jAccount unified authentication and covers student affairs services such as enlistment registration, counseling appointments, career guidance, second classroom, and scholarship applications. It combines AI chat with any large language model, MCP tools, and Agent Skills, a draggable card dashboard, campus news subscription with AI summaries, a calendar with DDL management, no-code automation workflows, and a plugin market whose AI Plugin Maker generates plugins from a conversational description. Data is stored locally in SQLite, jAccount credentials are encrypted with AES-256-GCM, and no PII telemetry is collected.
