ReleaseNotes: |-
  体验优化
  - 调整额度卡片布局与配色，单周额度时显示剩余进度条。
  - 插件包选择、检查和安装改为在插件页内完成，无需打开独立对话框
  - 用量时间轴支持悬停预览、点击固定时段，离开后保留选择
  问题修复
  - 修复 Windows 启动器退出后无法继续追踪 Codex 主进程的问题
  - 修复会话统计误读后台会话的问题，优先匹配当前可见会话。
  - 安装更新前会先保存尚未提交的设置。
  - 模型筛选会继续分页加载，避免遗漏低频模型
