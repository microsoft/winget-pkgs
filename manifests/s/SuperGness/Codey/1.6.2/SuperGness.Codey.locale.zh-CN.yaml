ReleaseNotes: |-
  新增功能
  - WebSocket TLS 连接支持系统证书，兼容企业代理和自定义 CA。
  - 官方直连线路可使用网关压缩生成摘要。
  体验优化
  - 非默认账号令牌临期时会在转发、额度查询和手动刷新时自动续期
  - 已启动的路由可热更新不影响 WebSocket 和原生搜索能力的协议及凭据变更。
  - 启动时已安装输入中继的情况下，切换杂事模型无需重启。
  问题修复
  - 恢复历史会话时自动沿用此前使用的模型。
  - 修复长时间复用的 WebSocket 连接可能因静默断链而超时的问题。
  - 系统代理设置变化时，并发请求会等待新客户端，避免继续使用旧代理配置。
  - 修复未登录离线时无法分叉任务的问题。
