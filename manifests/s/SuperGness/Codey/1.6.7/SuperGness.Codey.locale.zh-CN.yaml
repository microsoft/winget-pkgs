ReleaseNotes: |-
  新增功能
  - 转换 Chat Completions 时会保留并输出 URL 引用标注
  体验优化
  - 长文本粘贴更少被自动转换为附件。
  - 提示词优化现支持 ProseMirror 编辑器，并可将结果正确填回输入框
  - 界面整体调整为更简洁的浅色与深色视觉风格。
  问题修复
  - 修复 Claude 4.6+ 和 5.x 模型因思考参数不兼容导致请求失败的问题。
  - 并行工具调用期间穿插的提示和图片不再导致请求被上游拒绝
  - Responses 接口现在能正确展示搜索引用的链接、标题和文本位置
  - 上游 WebSocket 消息超限时自动改用 HTTP SSE，避免请求直接失败
  - 异常空流不再被误判为成功完成，合法空回复仍可正常返回
  - 插件市场请求现可识别插件列表、详情及安装和卸载操作
  - 账号用量摘要现在可读取 Codex 专属额度数据
  - 按对话 ID 识别当前会话，避免任务恢复时误用隐藏的旧对话。
