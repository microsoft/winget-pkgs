ReleaseNotes: |-
  新增功能
  - 图片生成和编辑请求支持模型别名，并将别名解析为对应的上游模型。
  - 请求统计可将不同别名的模型合并为同一分组。
  体验优化
  - Fast 和 Ultrafast 档位不再受登录权限检查限制，按模型支持情况提供。
  问题修复
  - 本地路由监听异常退出后会自动恢复，减少路由中断。
  - WebSocket 延续请求遇到持久化上下文错误时，可携完整历史改用 HTTP 完成本轮请求。
