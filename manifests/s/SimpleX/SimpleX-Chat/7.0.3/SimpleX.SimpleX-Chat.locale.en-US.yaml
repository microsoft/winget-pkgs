ReleaseNotes: "New in v7.0.3.\n\n• Build fixes\n• Fix reproducible builds script \n\n[SimpleX domains](https://simplex.domains?utm_source=release) launch on December 12 - one name for your channel and contact address\n\nYou can get a stake in SimpleX Chat – we launched [equity crowdfunding on Wefunder](https://wefunder.com/simplex.chat).\n\nCommits:\n• ui：use backward compatible Java api in stripFormattedTextLink (#7464)\n• scripts：re-init submodules in reproduce builds (#7508)\n• ui：crowdfunding banner on onboarding and in chat list (#7552)\n• ui：add wefunder logo to crowdfunding banner (#7553)\n• ui：replace wefunder logo with simplex logo on crowdfunding banner (#7555)\n• tests：fix race conditions (#7579)\n• ui：update crowdfunding title (#7593)\n• ui：news channel (#7594)\n• assets：compress crowdfunding images\n• android：match app links by exact path so simplex.chat pages open in the browser (#7565)\n• android：fix SimpleX links (#7596)\n• 7.0.3：android 381, desktop 164, ios 359\n\n**Android APKs**:\n\nSHA2-256(simplex-aarch64.apk)= d535e5a8986d4e11b9abd5656a3c0e1be5a08e06b00a7b20d6b7587ed0c3457f\n\nSHA2-256(simplex-armv7a.apk)= 3a89d2f825ce1a30ff51b30487c1b0b58de6eba03426d1500112b7417e659fdc\n\n**Desktop app**:\n\nSHA2-256(simplex-chat-macos-aarch64)= e93100d489747448f99daf68190bfef9a1a21ebe3117a24c1aefdbb28132138f\n\nSHA2-256(simplex-chat-windows-x86-64)= 33ecedfac9331f8659ec1fbbc2a0828a29a3b6eec5f9ff2017153dded50ae2c7\n\nSHA2-256(simplex-desktop-macos-aarch64.dmg)= 296188f3c54f181d9e4c1e54a035d42788e92f11fed2f5399c705df69f09116e\n\nSHA2-256(simplex-chat-ubuntu-22_04-aarch64)= 91f332edc813cab78a848da7ba75ed91bcb8d09abf1fc92eca74330dc29ec970\n\nSHA2-256(simplex-chat-ubuntu-22_04-aarch64.deb)= 3860391b47ca0badb71c4f07bcdf2883ef14dae75476a95d9aa70187aa74bb7d\n\nSHA2-256(simplex-chat-ubuntu-24_04-aarch64)= 2d2e62351f11bc51ae659618584722b38ea5a6796b806c9a388ee6e3124c90ac\n\nSHA2-256(simplex-chat-ubuntu-24_04-aarch64.deb)= 4025126f1a33147e79e0f0138dcbc95601b609f1ae5efa0