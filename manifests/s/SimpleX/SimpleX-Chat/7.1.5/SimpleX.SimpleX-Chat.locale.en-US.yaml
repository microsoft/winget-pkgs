ReleaseNotes: |-
  New in v7.1.5

  Restore compatibility with Android 8 and armv7a.
  Improve flat layout.
  Desktop:
  • Zoom images and videos.
  • Dependency upgrades：vlc, skiko libraries.

  Trail of Bits completed the most comprehensive security audit of SimpleX so far, covering 16 areas：from the post-quantum double ratchet to groups, channels, file transfer, push notifications, calls and device storage.

  Please upgrade and ask your contacts to upgrade too!

  More details in the post：https://simplex.chat/blog/20261121-simplex-chat-security-audit-trail-of-bits-security-process.html

  v7.1.5 also includes supporter badges that allow larger files available for longer. Crowdfunding investors get a free badge, and with an investment of $500 or more, a free SimpleX public name too：[wefunder.com/simplex.chat](https://wefunder.com/simplex.chat?utm_source=github)

