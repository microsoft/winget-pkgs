ReleaseNotes: "New in v7.0.2.\r\n\r\n• Updated VLC to latest version.\r\n• Build fixes.\r\n\r\n[SimpleX domains](https://simplex.domains?utm_source=release) launch on December 12 - one name for your channel and contact address\r\n\r\nInvest in SimpleX Chat by September 22 to get your name for 7 years, before the public launch.\r\n\r\nLivestream on September 15：https://simplex.chat/livestream\r\n\r\nCommits:\r\n• directory：only create group links after approval (#7356)\r\n• ui：update post link in whats new (#7400)\r\n• desktop：build nanohttpd from a submodule (#7396)\r\n• desktop：fix nanohttpd submodule check never running (#7408)\r\n•  scripts：add chat relay docker setup (#7406)\r\n• desktop：bump vlc to v3.0.23-2 (#7407)\r\n• ui：show countdown until SimpleX domains sale launch (#7434)\r\n• ui：update strings\r\n• core：7.0.0.12\r\n• 7.0.2：android 375, desktop 159, ios 351\r\n\r\n**Android APKs**:\r\n\r\nSHA2-256(simplex-aarch64.apk)= 0a3a0bb7ca1e2411854883ba1ae352b15b11146fe0e137395671fff9ed839871\r\n\r\nSHA2-256(simplex-armv7a.apk)= 48c2681bb1e96eafeab125f61a644eec49562a1cc1117d2871c35280fe2d8e45\r\n\r\n**Desktop app**:\r\n\r\nSHA2-256(simplex-chat-macos-aarch64)= 1ab8d76ad151ffd6166f0c76daa94bb79005b42f8aae22fcdedd0b7b3a034d04\r\n\r\nSHA2-256(simplex-chat-windows-x86-64)= e6dd41cf178e4faf1f58ba74bcaeecc41c4ded07d584f6891b9dabeeb0a7b0c5\r\n\r\nSHA2-256(simplex-chat-ubuntu-22_04-aarch64)= 91f332edc813cab78a848da7ba75ed91bcb8d09abf1fc92eca74330dc29ec970\r\n\r\nSHA2-256(simplex-chat-ubuntu-22_04-aarch64.deb)= aed056808513092d3e7815a3e66489f49f0d59437d9639cc6fe7072f473aaf9e\r\n\r\nSHA2-256(simplex-chat-ubuntu-24_04-aarch64)= 2d2e62351f11bc51ae659618584722b38ea5a6796b806c9a388ee6e3124c90ac\r\n\r\nSHA2-256(simplex-chat-ubuntu-24_04-aarch64.deb)= 24ea719f80286eb5742a1d848357c52ea70803321c7870edf0f5220ea81ad133\r\n\r\nSHA2-256(simplex-chat-ubuntu-24_04-x86_64)= 895fb14cfaa662d1c0947f2f871141fc89680fe3e70bff64c366cbe9e59aa4f0\r\n\r\nSHA2-256(simplex-chat-ubuntu-24_04-x86_64.d