ReleaseNotes: "New in v7.0.1.\r\n\r\nYou can get a stake in SimpleX Chat – we launched [equity crowdfunding on Wefunder](https://wefunder.com/simplex.chat).\r\n\r\nSend .webm files as videos (Android and desktop).\r\n\r\nFixed (Android and desktop):\r\n• a live message is sent to the chat it was typed in.\r\n• the draft no longer appears in another chat.\r\n• the save passphrase switch is no longer cut off.\r\n• connect to SimpleX links in markdown.\r\n\r\nCommits:\r\n• scripts：match AGP zip alignment in android reproduce build (#7196)\r\n• Merge branch 'stable'\r\n• android, desktop：keep database passphrase toggle inside the section card (#7326)\r\n• android, desktop：fix draft appearing in another chat when switching chats while sending (#7308)\r\n• docs：update readme (#7341)\r\n• website：link to wefunder (#7344)\r\n• support bot：add crowdfunding announcement to welcome message (#7351)\r\n• android, desktop：fix live message sent to the chat opened after switching (#7323)\r\n• ios：update whats new (#7359)\r\n• ui：connect when a SimpleX link is pasted as a markdown hyperlink (#7348)\r\n• android：add google and foss build flavors (#7328)\r\n• ui：send dropped .webm as video only when it has a video track (#7354)\r\n• android, desktop：add CF page (#7373)\r\n• ios：add CF page (#7369)\r\n• ios：fix store\r\n• desktop：fix the layout of the crowdfunding page (#7385)\r\n• ui：store country (#7389)\r\n• ios：7.0.1 build 349\r\n• 7.0.1：android 372, desktop 157\r\n\r\n**Android APKs**:\r\n\r\nSHA2-256(simplex-aarch64.apk)= d5b37d2eaf92d560181306973f359518b11048e3f69585d56ab5eed53a97f865\r\n\r\nSHA2-256(simplex-armv7a.apk)= 878b8d7571db3caad5a67a1edc9bf92f862374bfa609f0094dced8a99635c5be\r\n\r\n**Desktop app**:\r\n\r\nSHA2-256(simplex-chat-macos-aarch64)= b2837b8d1e782285bdaefca98b61f03cb0384948ab43275b1bed7b2964593590\r\n\r\nSHA2-256(simplex-chat-windows-x86-64)= 72a1a2a95dcbf325b774f0724f13d32a219bebcdba2bb26d2d4ac3653d8b37af\r\n\r\nSHA2-256(simplex-chat-ubuntu-22_04-aarch64)= 79