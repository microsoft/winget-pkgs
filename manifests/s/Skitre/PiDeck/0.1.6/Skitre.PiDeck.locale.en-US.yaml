ShortDescription: A native desktop app for Pi Coding Agent — chat with your coding agent, watch its tools work, manage sessions, models, and packages in one visual workspace.
Description: PiDeck is a native desktop app for the Pi Coding Agent. It offers streaming conversations with real-time tool calls and one-click abort, sessions and workspaces with exact history restoration, models and providers switching with per-conversation usage visibility, built-in Git with per-hunk staging and branch history, a Workspace Dock with file tree and embedded browser tabs, Packages management for Pi Extensions, Skills, Prompts, and Themes, extension UI and an integrated workspace terminal, plus customizable shortcuts and an English/简体中文 interface. Available for Windows and macOS.
