PackageIdentifier: Skitre.PiDeck
PackageVersion: 0.1.6
PackageLocale: zh-CN
ShortDescription: Pi Coding Agent 的原生桌面应用：与你的编码智能体对话、实时查看工具调用、管理会话 / 模型 / Packages —— 全部在一个可视化工作空间里。
Description: PiDeck 是 Pi Coding Agent 的原生桌面应用。支持流式对话（实时展示智能体的思考过程、工具调用和执行结果，一键停止生成，会话异常自动恢复）、会话与工作区（跨项目浏览、搜索、创建和重新打开会话，对话历史完整恢复）、模型与 Provider 切换（每个对话的用量一目了然）、内置 Git（按 hunk 暂存/撤销、浏览分支历史）、工作区 Dock（项目文件树、引用文件、内置浏览器标签与常驻终端）、Packages 管理（Pi 的 Extensions、Skills、Prompts、Themes），以及可自定义快捷键与中英文界面。支持 Windows 与 macOS。
