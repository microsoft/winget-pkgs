ShortDescription: Voice, text chat and screen sharing for a few friends, hosted on one of their PCs.
Description: |-
  Voice, text chat and screen sharing for a few friends on Windows, built for the lowest delay.
  One friend hosts on their own PC, the others join with an invite code, and packets go straight between each friend's PC and the host's over UDP, encrypted after a Noise handshake. The host decrypts and forwards what the room sends. No accounts and no server in the middle.
  Voice uses 5 ms Opus frames. Screen sharing captures with Desktop Duplication and encodes on the GPU, up to 1440p at 120 fps, H.264 or HEVC; on Intel graphics it encodes in software for now, H.264 up to 1080p at 60 fps. Ping, jitter and loss stay on screen.
  It installs for the current user without an administrator prompt. On first start it asks once for administrator rights to add its firewall rule. It is not code signed, so Smart App Control on Windows 11 blocks it.
