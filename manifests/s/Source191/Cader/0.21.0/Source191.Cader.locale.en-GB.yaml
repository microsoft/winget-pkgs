ShortDescription: 'Cader keeps every Claude Code session on Windows in one place: one tab that lists every session on the machine, rings when one needs you, and opens any of them in its own coloured tab.'
Description: Cader is a Terminal.Gui console for Claude Code sessions and git worktrees on Windows. One tab lists every Claude Code session on the machine with its state, repository, pull request and age; rings the terminal bell when a session needs you; and opens any session in its own coloured Windows Terminal tab. A second tab lists git worktrees and their health, and lets you start a session in one, open its folder in your editor or solution, or remove it safely. Cader checks for updates daily and upgrades itself with winget. It needs Claude Code 2.1.309 or later, Windows Terminal, PowerShell 7 and git.
