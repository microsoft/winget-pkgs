ShortDescription: Guitar amp, songs without the guitarist, chords, tabs and lyrics
Description: |-
  Play your guitar through captures of real amps with the songs you love, without their guitarist.
  Strum separates a song into vocals, drums, bass, guitar, keys and the rest, finds its bars, chords and key,
  and shows chords, Guitar Pro tabs and lyrics following the recording. Slow it down, change the key,
  loop a part, record yourself. Everything runs on your computer: nothing is uploaded.
