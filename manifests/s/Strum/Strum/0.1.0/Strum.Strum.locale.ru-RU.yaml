ShortDescription: Комбик для гитары, песни без гитариста, аккорды, табы и текст
Description: |-
  Играй на гитаре через снимки настоящих комбиков под любимые песни — без их гитариста.
  Strum делит песню на вокал, барабаны, бас, гитару, клавишные и остальное, находит такты, аккорды и тональность
  и показывает аккорды, табы Guitar Pro и текст по ходу записи. Замедляй, меняй тональность,
  зацикливай куски, записывай себя. Всё работает на компьютере: ничего не отправляется.
