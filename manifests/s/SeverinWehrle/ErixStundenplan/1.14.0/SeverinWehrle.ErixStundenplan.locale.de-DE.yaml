Description: |-
  Erix Stundenplan zeigt dir Woche, Prüfungen, Noten, Absenzen und freie Räume aus dem Extranet deiner Schule, sofort und ohne Ladezeit. Die nächste Lektion steht im Tray, Erinnerungen kommen als Mitteilungen.
