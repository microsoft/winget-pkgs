PackageLocale: en-US
Publisher: Severin Wehrle
PackageName: Erix Stundenplan
License: MIT
ShortDescription: Your timetable from the school extranet, without the wait. Unofficial.
Description: |-
  Erix Stundenplan shows your week, exams, grades, absences and free rooms from your school's extranet, right away and without loading. The next lesson sits in the tray, and reminders arrive as notifications.
  You sign in with your own school account. The app never types a password, and your school data stays on your device. No ads, no tracking.
  Unofficial student project, not made by your school.
