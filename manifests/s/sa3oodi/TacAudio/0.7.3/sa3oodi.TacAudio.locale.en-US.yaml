ShortDescription: Free 3D headphone audio for FPS games on Windows.
Description: |-
  TacAudio turns a game's 7.1 surround sound into 3D audio for any headphones, so you can hear where footsteps and gunfire come from.
  It runs inside Windows audio with almost no delay, and adds combat dynamics (tames gunfire and explosions, lifts quiet sounds), footstep clarity, bass control, headphone EQ and per-game profiles.
