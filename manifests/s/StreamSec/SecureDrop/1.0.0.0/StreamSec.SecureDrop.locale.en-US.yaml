ShortDescription: "Host a selected folder through controlled private HTTPS links."
Description: >-
  You pick a folder, Secure Drop gives you a private HTTPS link, and you send that link to the
  people who need the files. They download in a web browser or with Secure Drop Client. If you
  allow it, they can upload files back to you. Links expire on a schedule you set, you can revoke
  them, and you can see the transfers as they happen. The files stay on your PC, and recipients
  fetch them directly from it.
