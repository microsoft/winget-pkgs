ShortDescription: "Inspect certificates and keys, assemble chains and create private identities."
Description: >-
  Someone hands you a ZIP with a .pem, a .pfx, a .p7b and a .csr, and the server still won't
  start. Certificate Desk opens all of them in one window. It shows what each file contains and
  which private key belongs to which certificate, and it puts the chain together in the right
  order, telling you if a link is missing. It can also create keys, certificate requests and
  private test certificates. It works offline and leaves the Windows certificate stores alone.
