ShortDescription: "Inspect TLS, QUIC, certificate chains and trust decisions."
Description: >-
  A browser tells you a connection failed. TLS Inspector tells you why. Point it at a host and
  port and it shows the TLS version, cipher suite and key exchange the server actually picked,
  every certificate it sent, and each trust check as a separate pass or fail. You can use it from
  a Windows window or from the command line, and save the result as JSON for a ticket or a
  before-and-after comparison.
