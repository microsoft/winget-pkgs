ShortDescription: "Connect a plaintext TCP service to an authenticated TLS 1.3 leg."
Description: >-
  Plenty of useful software still sends its traffic unencrypted: an old line-of-business service,
  a device protocol, a database link, an in-house tool. TLS Bridge runs alongside it, normally on
  the same PC, and carries that traffic across the network over TLS 1.3, with certificate checks
  and, if you want, client certificates on both sides. It also helps when a server already uses
  TLS but lets anyone connect: two Bridges can make an existing HTTPS site accept only computers
  that hold a client certificate you issued. The software itself doesn't change. You set up a
  route, choose the certificates, press Start, and watch the connections.
