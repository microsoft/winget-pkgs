ShortDescription: "Use a Secure Drop share with application-local private PKI."
Description: >-
  If someone shares files with you through Secure Drop, a browser is often enough. When the share
  is protected with a private CA and client certificates, though, a browser usually means
  installing certificates into Windows or the browser. Secure Drop Client avoids that. You paste
  the link, confirm the owner's root certificate once, and then drag files to and from Explorer.
  The certificates stay inside the Client and need no administrator rights.
