ReleaseNotes: |-
  ## :warning：Security release
  **Bundled Java JDK updated as a [`Java4Shell`](https://www.cve.org/CVERecord?id=CVE-2026-114938) vulnerability mitigation.
  This release includes only a stable changes from master branch.**

  ### Features

  • [build] Create a macOS install bundle for jadx-gui (PR #2916)
  • [build] Add file associations for macOS (PR #2917)
  • [build] Build Windows .msi bundle
  • [gui] Use ResourcePanel with file-type specific tabs. (PR #2915)
  • [gui] Make inheritance graphs display both super and subclass relations (PR #2935)
  • [gui] Add tree filter (PR #2941)

  ### Bug Fixes

  • [core] Sanitize user comments (PR #2940)
  • [core] Disable `AdjustForIfMergeVisitor` as regression workaround (#2951)
  • [gui] Copy full code snippet when copy all search results (PR #2911)
  • [gui] Don't throw exception if NLS key missing in fallback locale
  • [gui] Set locale before loading gui config (PR #2923)
  • [gui] Collapsed single-child directory chains causing display problems (PR #2925)
  • [gui] Allow adb serial numbers with 8 and 9 characters (#2927, PR #2928)
  • [gui] Improve Chinese localization in Messages_zh_CN.properties (PR #2934)
  • [gui] Use save mode for package directory export (PR #2937)
  • [gui] Avoid project reload when saving settings on start page (PR #2943)
  • [gui] Load next binary block at block boundary (PR #2948)
  • [gui] Use correct versions for j2v8 libs (#2959)
  • [quark] Fix missing string escape in report panel, resolve some code warnings

  ## New Contributors
  • @nstion made their first contribution in https://github.com/skylot/jadx/pull/2911
  • @arimu1 made their first contribution in https://github.com/skylot/jadx/pull/2923
  • @tim21-f0 made their first contribution in https://github.com/skylot/jadx/pull/2935
  • @cuishuang made their first contribution in https://github.com/skylot/jadx/pull/2948

  **Full Changelog**：https://github.com/skylot/jadx/compare/v1.5.6...v1.5.7

