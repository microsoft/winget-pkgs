ShortDescription: A developer-friendly CLI wrapper for Microsoft WSLC.
Description: wip is an open-source CLI wrapper that brings a dip-like workflow to Microsoft WSLC. It collects a project's container, image, environment variables, and commands into a single wip.yml file, then forwards them to wslc as safe argument arrays with no shell interpolation. It ships as a single self-contained Native AOT executable, so there is no runtime to install.
