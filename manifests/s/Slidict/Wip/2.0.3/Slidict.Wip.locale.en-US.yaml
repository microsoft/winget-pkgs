ReleaseNotesUrl: https://github.com/slidict/wip/releases
InstallationNotes: From PowerShell or cmd, run wip. From a WSL2 shell the extension is required - run wip.exe - because bash does not consult PATHEXT. See https://github.com/slidict/wip#running-it-from-a-wsl2-shell for a shim that lets you type wip there too.
