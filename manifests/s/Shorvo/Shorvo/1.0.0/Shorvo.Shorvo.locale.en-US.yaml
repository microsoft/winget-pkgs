ShortDescription: Turn a topic or your own script into a finished vertical Short on your Windows PC.
Description: |-
  Shorvo is a Windows desktop app for YouTube Shorts, TikTok and Reels creators.
  Type a topic or paste your own script; Shorvo finds footage, adds an AI voiceover and word-timed captions,
  and writes a title, description and hashtags, producing a finished 9:16 video on your own PC.
  The first 3 finished videos are free (with a watermark). Pro is a one-time licence, not a subscription.
