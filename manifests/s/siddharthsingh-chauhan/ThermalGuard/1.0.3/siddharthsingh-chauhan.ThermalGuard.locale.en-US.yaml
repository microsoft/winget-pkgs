InstallationNotes: ThermalGuard starts at every logon through a Task Scheduler task. For CPU temperature readings, install LibreHardwareMonitor (winget install LibreHardwareMonitor.LibreHardwareMonitor) and turn on its web server, or tick that option in the interactive installer.
