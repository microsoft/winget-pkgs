ShortDescription: Keeps Windows laptops cool and quiet by switching the CPU between quiet, balanced and performance modes and capping the clock when it gets hot.
Description: |-
  ThermalGuard is a system tray app that adjusts the CPU every 2 seconds based on what you are doing.
  Light work runs in Quiet mode (turbo off, fans low), real work gets turbo, and heavy all-core work gets aggressive turbo.
  Background services such as search indexing, antivirus scans and updates do not count as your work, so they no longer spin the fans up.
  When the CPU passes 90 °C it lowers the maximum clock step by step and releases it once cool, holding the fastest speed the cooler can sustain.
  It uses its own power plan (a copy of Balanced) and switches back to your previous plan on exit or uninstall.
