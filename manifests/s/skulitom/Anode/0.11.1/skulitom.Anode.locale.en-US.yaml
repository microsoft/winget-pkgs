ShortDescription: 'Background Windows desktop for AI agents: native GUI automation, screenshots and app testing.'
Description: |-
  Runs apps in a Windows child session with its own screen, pointer and keyboard focus, so an agent can automate native UI, take screenshots and run headed app/browser tests while you keep working. Requires 64-bit Windows 10/11 Pro, Enterprise or Education (or Windows Server with an RDP host) and a one-time 'anode setup' as administrator. Shares your files, account and network; it is not a security sandbox.
Moniker: anode
Tags:
- ai-agents
- automation
- background-desktop
- desktop-automation
- gui-testing
- mcp
- model-context-protocol
- rdp
- screenshots
- ui-automation
ReleaseNotesUrl: https://github.com/skulitom/Anode/releases/tag/v0.11.1
InstallationNotes: |-
  Check prerequisites, then enable child sessions once; setup asks for administrator approval:
    anode doctor | Out-Host
    anode setup | Out-Host
  Register Anode with the Codex and Claude Code CLIs found on PATH:
    anode configure | Out-Host
  Before 'winget upgrade skulitom.Anode', save work in the seat, run 'anode quit' (it closes every seat application) and close MCP clients using Anode.
