ReleaseNotesUrl: https://github.com/skulitom/Inkbolt/releases/tag/v0.82.0
InstallationNotes: |-
  Start the MCP server over stdio with 'inkbolt mcp'; add '--workspace <existing absolute folder>' before 'mcp' to choose where requests and stores resolve. Run 'inkbolt --help' for command-line usage.
