ShortDescription: 'Local graphics editing for AI agents: create, preview, revise and export vector and raster artwork.'
Description: |-
  Inkbolt lets AI agents create graphics, preview their work, make precise revisions and export the result while keeping an editable source, for diagrams, illustrations, layouts and image assets. It builds compositions from vector shapes, text and images, imports SVG artwork, keeps saved sessions with undo/redo and revision comparisons, and exports PNG, TIFF, SVG or PDF within its documented limits without overwriting existing files. Agents use it through MCP over stdio ('inkbolt mcp') or a JSON command-line interface; there is no account, network service or telemetry.
