ShortDescription: Nests parts on fixed sheets for laser, CNC, plasma, waterjet and fabric cutting.
Description: |-
  Nestbolt arranges parts on fixed sheets to save material for laser cutters, CNC routers, plasma, waterjet, fabric and leather. It imports SVG and DXF outlines or LightBurn projects, places parts inside the holes of other parts, spreads a job over several sheets and writes per-sheet SVG, DXF or LightBurn files. The package provides the 'nestbolt' command-line tool and 'nestbolt-mcp', an MCP server over stdio for AI agents; neither needs a network listener or account. Built on sparrow and jagua-rs.
Moniker: nestbolt
