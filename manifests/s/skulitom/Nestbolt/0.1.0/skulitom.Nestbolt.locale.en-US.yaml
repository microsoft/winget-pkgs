- cnc
- dxf
- laser-cutting
- mcp
- nesting
- plasma-cutting
- sheet-metal
- svg
ReleaseNotesUrl: https://github.com/skulitom/Nestbolt/releases/tag/v0.1.0
InstallationNotes: |-
  Run 'nestbolt --help' for the command-line tool. For AI agents, register 'nestbolt-mcp' as an MCP server over stdio; it works on files inside the folder it is started in.
