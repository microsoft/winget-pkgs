ShortDescription: Local video editing engine for agents that edits footage, adds captions, mixes audio and exports through structured commands.
Description: |-
  Cutbolt is a local video editing engine for AI agents, used through a JSON command-line program or an MCP server over stdio ('cutbolt mcp'). It creates project snapshots, validates and edits timelines, inspects local media, plans renders and produces verified output. Local sessions keep revisions, reject conflicting edits, replay successful requests and support undo. It makes no network requests at runtime. This is an early release that is still in development.
  FFmpeg and ffprobe are not included and must be installed separately: put both on PATH, or set CUTBOLT_FFMPEG and CUTBOLT_FFPROBE to their executable paths.
Moniker: cutbolt
Tags:
- ai-agents
- captions
- cli
- ffmpeg
- mcp
- model-context-protocol
- video-editing
- video-editor
ReleaseNotesUrl: https://github.com/skulitom/Cutbolt/releases/tag/v0.4.0
InstallationNotes: |-
  Cutbolt needs FFmpeg and ffprobe, which this package does not install (the tested build is FFmpeg 7.0). Put both on PATH, or set CUTBOLT_FFMPEG and CUTBOLT_FFPROBE to their executable paths, then restart your MCP client. Check the setup with:
    cutbolt doctor
