ShortDescription: Isolated browsers with a persistent identity for AI agents, running on your own machine.
Description: |-
  Scalebrowser gives each AI agent its own browser profile that keeps its identity and its sign-ins between runs.
  The browsers run on your own Windows machine instead of a vendor's cloud, and agents connect over MCP, a REST API or the Python and Node SDKs.
  A Scalebrowser account with an active plan or trial is required.
