ShortDescription: Free ship office assistant for masters and officers.
Description: |-
  SeaVint is a free Windows program for ship's officers. It works next to Outlook on the ship's computer, also without internet:
  noon reports and ETA notices from the ship's own data, agent forms (pre-arrival, FAL, crew lists, waste) filled in the agent's own file,
  deadlines picked out of incoming e-mail, hours of rest with an STCW/MLC check, and "Ask the ship" — offline answers from the ship's own SMS and manuals.
