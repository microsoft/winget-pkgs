ReleaseNotes: |-
  Note
  #269 の問題があるためUWSCRライブラリ機能 (uwsl) は利用しないでください
  バージョン1.2.0にて何かしらの対策を行う予定です
  > [!caution] ブラウザ操作でデフォルトプロファイルを利用したブラウザを操作できなくなりました
  > Google ChromeおよびMicrosoft Edgeの厳格化に伴いデバッグポート利用時にデフォルトプロファイルを利用できなくなっています
  > そのためBrowserControl/BrowserBuilderにてプロファイルが未指定の場合に決められたプロファイルパスが指定されるようになりました (#297)
  バグ修正
  - #293 getslider/setsliderでvivaldiのページズームの取得・変更ができなかった
  - 言語サーバー: 意味トークン修飾子の算出方法に誤りがあった

  仕様変更
  - #293 対応に伴いsetsliderの第4引数を廃止
  - 対象がトラックバー等のスライダーであった場合、小数値の取得及びセットができるようにした
    - getsliderで返す値が倍精度浮動小数点数になります
    - setsliderに渡す値が倍精度浮動小数点数になります (従来のような丸めを行いません)
  - #297 BrowserControl/BrowserBuilderでプロファイル未指定時は以下のディレクトリをプロファイルとして利用するようにした
    - スクリプトパス\chrome (Google Chromeの場合)
    - スクリプトパス\msedge (Microsoft Edgeの場合)

