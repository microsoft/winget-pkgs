ReleaseNotes: |-
  Note
  #269 の問題があるためUWSCRライブラリ機能 (uwsl) は利用しないでください
  バージョン1.2.0にて何かしらの対策を行う予定です
  Caution
  ブラウザ操作でデフォルトプロファイルを利用したブラウザを操作できなくなりました
  Google ChromeおよびMicrosoft Edgeの厳格化に伴いデバッグポート利用時にデフォルトプロファイルを利用できなくなっています
  そのためBrowserControl/BrowserBuilderにてプロファイルが未指定の場合に決められたプロファイルパスが指定されるようになりました (#297)
  バグ修正
  - #299 複数スレッドから同一のモジュールまたはクラスインスタンスにアクセスした場合にpanicする場合があった
  - #298 kbd関数の改善

  仕様変更
  - #301 連想配列への代入を原則禁止
  - #302 ログの書き出し時にpanicする可能性があった

