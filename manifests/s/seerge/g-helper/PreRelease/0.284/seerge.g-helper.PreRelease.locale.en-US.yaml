ReleaseNotes: "### 🎧 [Headset support](https://github.com/seerge/g-helper/discussions/5964)\r\n• [ROG Delta II](https://github.com/seerge/g-helper/issues/5483) and Delta II KJP, [ROG Pelta](https://github.com/seerge/g-helper/issues/5161)：RGB, equalizer, sidetone, mic noise reduction, battery\r\n• [ROG Cetra True Wireless SpeedNova](https://github.com/seerge/g-helper/issues/2867)：RGB, equalizer, ANC, battery (left / right / case)\r\n• [ROG Cetra RGB](https://github.com/seerge/g-helper/issues/6007)：RGB, [ROG Clavis](https://github.com/seerge/g-helper/issues/4408): RGB and AI noise cancellation\r\n\r\n<img width=\"1786\" height=\"1554\" alt=\"image\" src=\"https://github.com/user-attachments/assets/42ddd286-ed4f-4573-953c-e41b7fc3602f\" />\r\n\r\n### 🎮 Overlay\r\n• Skip game-only overlay for WeChat / Weixin windows https://github.com/seerge/g-helper/issues/6035\r\n\r\n### 🚥 Aura\r\n• Fixed wrong Slash lighting status on startup https://github.com/seerge/g-helper/issues/6024\r\n\r\n### ⚙️ Other changes\r\n• Detachable keyboard support for Zenbook Duo UX8406 https://github.com/seerge/g-helper/issues/6017\r\n• Wider charge limit range for FX607 https://github.com/seerge/g-helper/issues/6019\r\n• Fixed CPU power limit cap falsely applied to FX507VV https://github.com/seerge/g-helper/issues/6039\r\n\r\n### 💻 UI Tweaks\r\n• Fixed app stuck in dark / light mode when Windows switches themes quickly https://github.com/seerge/g-helper/issues/6032\r\n• Translation updates\r\n• Minor UI tweaks, cleanups and stability fixes\r\n\r\n>[!NOTE]\r\n>If you find G-Helper useful, please consider [supporting the app](https://g-helper.com/support) to help fund future development.\r\n\r\n[<img width=\"200\" src=\"https://g-helper.com/button/download.svg\" />](https://github.com/seerge/g-helper/releases/download/v0.284/GHelper.exe) &nbsp; [<img width=\"200\" src=\"https://g-helper.com/button/donate.svg\" />](https://g-helper.com/support)"
