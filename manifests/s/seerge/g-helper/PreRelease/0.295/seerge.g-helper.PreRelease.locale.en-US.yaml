ReleaseNotes: |-
  ### 🚥 Aura
  • Per-key RGB for ROG Strix Scar 15 G533Q
  • LampArray Fn and duplicate PrtSc mapping fix https://github.com/seerge/g-helper/issues/5927
  • Multiwheel light fix for ROG Zephyrus S17 GX703HS https://github.com/seerge/g-helper/issues/6339
  • Keyboard backlight fix for TUF A14 2025 FA401KM https://github.com/seerge/g-helper/issues/6360
  • Ambient keyboard colors scale with backlight level https://github.com/seerge/g-helper/issues/6361

  ### 🎮 Overlay
  • Custom [exclude list](https://github.com/seerge/g-helper/wiki/Power-user-settings#overlay-only-in-games-exclusions) for overlay https://github.com/seerge/g-helper/issues/6346

  ### ⚙️ Other changes
  • Dynamic Boost fix for ROG Zephyrus G14 GA403UH https://github.com/seerge/g-helper/issues/6362
  • Mini-LED mode fix for ROG Strix Scar 16 G634JYR https://github.com/seerge/g-helper/issues/6352

  ### 💻 UI Tweaks
  • Minor UI tweaks, cleanups and stability fixes

