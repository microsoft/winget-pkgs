ReleaseNotes: "### 🎮 Overlay\r\n• **New Overlay settings screen：modes, metrics, size, transparency and CPU / GPU colors** (https://github.com/seerge/g-helper/pull/5917)\r\n\r\n<img width=\"1730\" height=\"1548\" alt=\"image\" src=\"https://github.com/user-attachments/assets/e61202b2-6527-44b1-9287-078d09f1a8eb\" />\r\n\r\n### ⌨️ [External Keyboards support](https://github.com/seerge/g-helper/discussions/5710)\r\n• ROG Azoth Extreme SE, Strix Flare COD, Flare PNK LTD, Scope RX EVA and EVA-02 Edition\r\n• Faster peripheral detection\r\n\r\n### 🖱️ Mouse Settings\r\n• Rapid Fire bindings with custom [delays](https://github.com/seerge/g-helper/wiki/Power-user-settings#rapid-fire-delays) https://github.com/seerge/g-helper/issues/5930 (https://github.com/seerge/g-helper/pull/5984)\r\n\r\n### ⚙️ Other changes\r\n• Warning when disabling GPU with an external HDMI / DP display connected https://github.com/seerge/g-helper/issues/4244\r\n• Removed unsupported RGB modes for H7606 https://github.com/seerge/g-helper/issues/5966\r\n• Camera toast notification fix https://github.com/seerge/g-helper/issues/5982\r\n\r\n### 💻 UI Tweaks\r\n• Translation updates\r\n• Minor UI tweaks, cleanups and stability fixes\r\n\r\n>[!NOTE]\r\n>If you find G-Helper useful, please consider [supporting the app](https://g-helper.com/support) to help fund future development.\r\n\r\n[<img width=\"200\" src=\"https://g-helper.com/button/download.svg\" />](https://github.com/seerge/g-helper/releases/download/v0.281/GHelper.exe) &nbsp; [<img width=\"200\" src=\"https://g-helper.com/button/donate.svg\" />](https://g-helper.com/support)"
