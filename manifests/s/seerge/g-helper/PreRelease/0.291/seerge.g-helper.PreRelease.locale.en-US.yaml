ReleaseNotes: |-
  ### 🎧 [Headset support](https://github.com/seerge/g-helper/discussions/5964)
  • [ROG Delta S](https://github.com/seerge/g-helper/issues/6250)：RGB and AI noise cancellation
  • New audio-reactive Music lighting mode for ROG Delta S, Cetra RGB and Clavis

  ### ⌨️ [External Keyboards support](https://github.com/seerge/g-helper/discussions/5710)
  • Custom per-key RGB fix for ROG Strix Scope II 96 Wireless https://github.com/seerge/g-helper/issues/6233
  • Custom lighting restored after sleep for ROG Strix Scope II X https://github.com/seerge/g-helper/issues/6249

  ### 🎮 Overlay
  • Optional CPU / GPU clocks https://github.com/seerge/g-helper/issues/6260 (https://github.com/seerge/g-helper/pull/6268)

  ### 🚥 Aura
  • Keyboard backlight follows ambient light sensor https://github.com/seerge/g-helper/issues/4575 (https://github.com/seerge/g-helper/pull/5802) (https://github.com/seerge/g-helper/pull/6221) (thanks @xaviergonz)

  ### 🖱️ Mouse Settings
  • Settings fixes for ROG Harpe Mini Core https://github.com/seerge/g-helper/issues/6232

  ### ⚙️ Other changes
  • Firmware fan floors shown on fan curve charts https://github.com/seerge/g-helper/issues/6270 (https://github.com/seerge/g-helper/pull/6274)
  • Fixed Fn+C and flicker-free dimming hotkeys on ProArt PX13 https://github.com/seerge/g-helper/issues/6231
  • Re-apply Fn-Lock after lid open / wake (https://github.com/seerge/g-helper/pull/6234) (https://github.com/seerge/g-helper/pull/6221)
  • Hidden Fn+Numpad bindings on TUF A14 FA401 https://github.com/seerge/g-helper/issues/6253
  • Hidden GPU settings on Zenbook S16 UX5606 https://github.com/seerge/g-helper/issues/6251
  • Aura and OLED settings tweaks for ProArt H7407
  • Fixed driver updates detection https://github.com/seerge/g-helper/issues/6259 https://github.com/seerge/g-helper/issues/6242

  ### 💻 UI Tweaks
  • Fans + Power window no longer hidden behind top taskbar https://github.com/seerge/g-helper/issues/6263
  • Minor UI tweaks, cleanups and stability fixes

