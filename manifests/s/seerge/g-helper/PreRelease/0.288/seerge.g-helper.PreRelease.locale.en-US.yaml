ReleaseNotes: |-
  ### 🎧 [Headset support](https://github.com/seerge/g-helper/discussions/5964)
  • [ROG Strix Go 2.4](https://github.com/seerge/g-helper/issues/5158)：AI noise cancellation, sleep timer, battery (https://github.com/seerge/g-helper/pull/6125)

  <img width="1786" height="1554" alt="image" src="https://github.com/user-attachments/assets/42ddd286-ed4f-4573-953c-e41b7fc3602f" />

  ### ⌨️ [External Keyboards support](https://github.com/seerge/g-helper/discussions/5710)
  • TUF Gaming K3 Gen II Miku Edition and ASUS TX 98 support https://github.com/seerge/g-helper/issues/6088

  ### 🎮 Overlay
  • Overlay fixes for AMD devices https://github.com/seerge/g-helper/issues/6148
  • Skip game-only overlay for SpaceSniffer https://github.com/seerge/g-helper/issues/6136

  ### 🚥 Aura
  • RGB support for ROG Bulwark Dock DG300 https://github.com/seerge/g-helper/issues/6093 (https://github.com/seerge/g-helper/pull/6114)
  • Rear light strip fixes for [ROG Strix Scar 18](https://github.com/seerge/g-helper/issues/6055) (https://github.com/seerge/g-helper/pull/6138)
  • [Skip Aura](https://github.com/seerge/g-helper/wiki/Power-user-settings#skip-keyboard-aura-initialisation-on-startup) option now keeps Windows Dynamic Lighting colors on Flow Z13 https://github.com/seerge/g-helper/issues/6112

  ### 🖱️ Mouse Settings
  • ROG Gladius II Core support https://github.com/seerge/g-helper/issues/6157
  • Joystick binding options for ROG Chakram https://github.com/seerge/g-helper/discussions/6083

  ### ⚙️ Other changes
  • iGPU VRAM allocation for Intel https://github.com/seerge/g-helper/issues/6060 (https://github.com/seerge/g-helper/pull/6070)
  • Toggle Touchpad as a key binding action https://github.com/seerge/g-helper/discussions/6094
  • Mic mute LED now syncs on startup for [Zenbook Duo](https://github.com/seerge/g-helper/issues/6146)
  • Fixed driver and BIOS updates check for ROG NUC https://github.com/seerge/g-helper/issues/6073

  ### 💻 UI Tweaks
  • Settings window opens next to the taskbar when it is at the top of the screen https://github.com/seerge/g-helper/issues/6130
  • Localized Rear Light label on [Flow Z13](https://github.com/seerge/g-helper/issues/6143)
  • Translation updates
  • Minor UI tweaks, cleanups and stability fixes

  >[!NOTE]
  >This is a big update that took a lot of personal time and effort to build! Please consider [supporting the app](https://g-helper.com/support) to help fund future development.

