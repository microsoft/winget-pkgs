ShortDescription: Free, offline real-time noise cancellation for your microphone on Windows.
Description: |-
  Getsu removes keyboard clicks, fan hum, room noise and background voices from your microphone, for every app at once:
  Discord, Steam, Zoom, OBS and games. It runs on the CPU (no GPU needed), works offline and needs no account.
  Getsu passes the clean voice to other apps through the free VB-CABLE virtual audio cable (donationware by VB-Audio).
  A silent install skips VB-CABLE; Getsu offers to install it when it first starts.
