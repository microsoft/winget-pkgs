ReleaseNotes: |-
  - Updated the bundled monospace font (Iosevka): no ligatures, 4% wider.
  - Quitting the app is disabled while the Titan upload dialog is open. (The contents are autosaved in case of a crash.)
  - Fixed visibility of selected text against different backgrounds.
  - Fixed feed refresh not getting triggered when due.
  - Fixed potential crash when an inline prompt is immediately visible at launch.
  - TUI: Fixed potential hang in the text renderer.
  What's new in v1.21?
