ReleaseNotes: |-
  ## v1.7.7

  This release adds a profile name indicator for multi-account setups, a redesigned Monthly Spend and Credits panel, an optional scheduled session start, and several reliability fixes.

  ### What's New

  • **Scheduled session start (experimental):** Choose a daily time in Settings to send a tiny Haiku prompt that starts your five hour session, either locally while the widget is running or through a Claude cloud routine that works even when your computer is off.
  • **Redesigned Monthly Spend and Credits panel:** Shows your cap reset date, a marker for when your balance runs out before the cap does, and a clear paused state once your balance hits zero. "Credits" is now labeled "Available balance" to match claude.ai's own wording.
  • **Profile name shown in title bar and tray tooltips:** Running more than one `--profile` instance now shows the active profile name in the window title and both tray tooltips, so you can tell them apart at a glance. Thanks to @morgan-heimbeck.
  • **Custom login domain whitelist:** Add your organization's SSO domain yourself with `--whitelist-add`, no release needed, for setups like WorkOS that the built in login allowlist does not cover.
  • **Self-service taskbar icon recovery:** If a Windows taskbar icon gets stuck on a stale or generic image, `--reset-aumid` clears the cached identity without needing a new profile.
  • **Day-Month date format options:** The Weekly Resets column now offers Day-Month formats alongside the existing Month-Day ones.
  • **Taskbar stats redesigned as a single icon:** Session and weekly usage are now drawn as one split-panel taskbar icon rather than a second window, fixing a long-running icon corruption issue. Thanks to @bastionecho for the original design this was adapted from.

  ### Bug Fixes

  • **Extra Usage now shows your own spend limit** on Team and Enterprise accounts, rather than the organization-wide figure. Thanks to @niceindividual and @ariankordi for the detailed report.
  • **Fixed "Continue with Google" failing to sign in**, caused by the login window blocking all popups. Sign-in popups are now allowed toward trusted domains only, and Google accounts that redirect through a country-specific domain now work correctly too. Thanks to @ijaehun.
  • **Fixed the second tray icon missing on Linux with Wayland**, where only one of the two usage icons would appear.
  • **Fixed a crash on every launch when running as a Linux AppImage**, introduced by the Wayland tray fix above. Thanks to @williamvdev for catching this.
  • **Fixed a silent logout** that could happen during session key decryption. Thanks to @adihebbalae.
  • **Rate limit responses are now retried with backoff** instead of immediately forcing a re-login, and the auto-refresh timer is jittered to avoid synchronized requests. Thanks to @mtspl.
  • **The window now remembers its hidden, minimized, or normal state** across restarts instead of always appearing on launch.
  • The usage meter now correctly shows 100% when credit spend is actively climbing near your plan's ceiling, since the reported percentage can lag slightly behind real spend.

  ### Security

  • Login popups are now checked against the same trusted domain list used for regular navigation, closing a gap where any popup from the login window was allowed through unchecked. Blocked navigation is also now logged by hostname only, since sign-in URLs can carry sensitive tokens in the query string.

  ### Contributors

  Thanks to everyone who contributed code this release：@bastionecho, @williamvdev, @adihebbalae, @mtspl, @morgan-heimbeck, and @ijaehun.

