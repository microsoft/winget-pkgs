ShortDescription: One brightness control for every screen, external monitors over DDC/CI and the laptop panel over WMI, from the Windows tray.
Description: |-
  Lumos is a small Windows tray app that changes the hardware brightness of your monitors. It uses DDC/CI for external displays and the WMI backlight for laptop panels, so one slider or hotkey dims every screen at once.
  It has configurable hotkeys, the mouse wheel over the tray icon, a per-monitor brightness range, a time-of-day schedule, dim when idle, auto brightness from a Home Assistant light sensor, and lumosctl for the command line.
