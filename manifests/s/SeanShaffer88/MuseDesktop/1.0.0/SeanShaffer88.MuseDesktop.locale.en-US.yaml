ShortDescription: A native Windows desktop client for Muse (muse.ai) — its own window, tray icon, downloads with progress, and multiple sign-in profiles.
Description: Muse has no Windows app, so this is one — a small native program that opens muse.ai in its own window, keeps you signed in, and lives in the system tray. It adds the desktop touches a browser tab can't — downloads with progress and a history window, multiple sign-in profiles, a settings window, update notices, and sensible link handling. Free and open source (MIT), with no telemetry.
