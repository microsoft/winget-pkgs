ShortDescription: Steam-Cloud-like save sync for non-Steam games in Steam, such as emulators, recompilations and other PC games.
Description: |-
  Steam Cloud only covers games from the Steam store. Ludonimbus syncs the saves of the other games you launch from Steam: emulators, recompilations and third-party PC games.
  Newer saves are pulled before the game starts and new saves are uploaded after it exits. Saves live in your own Google Drive, WebDAV server (NAS, Nextcloud, OpenList), S3-compatible storage or any folder, with version history and conflict handling.
