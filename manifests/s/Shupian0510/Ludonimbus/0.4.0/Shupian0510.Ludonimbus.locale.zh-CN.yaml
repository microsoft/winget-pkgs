ShortDescription: 给 Steam 里的非 Steam 游戏补上云存档：模拟器、重制版、第三方 PC 游戏，像 Steam 云存档一样自动同步。
Description: |-
  Steam 云存档只对 Steam 商店里的游戏有效。Ludonimbus 为你加进 Steam 的模拟器、重制版和其他游戏同步存档。
  启动游戏前拉取更新的存档，退出后自动上传。存档保存在你自己的 Google Drive、WebDAV（NAS、坚果云、Nextcloud、OpenList）、S3 兼容存储或任意文件夹，带版本历史和冲突处理。
