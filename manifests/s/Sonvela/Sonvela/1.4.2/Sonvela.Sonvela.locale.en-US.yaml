ShortDescription: Fast YouTube Music player for Windows with an in-game overlay, synced lyrics and Discord status.
Description: |-
  Sonvela is a desktop player for YouTube Music.
  Press Alt+` in a game to open a small player on top of it and switch music without leaving the game.
  It also has synced lyrics, Discord Rich Presence, recommendations based on what you listen to,
  playlist import from Spotify and Apple Music exports, media keys, a tray icon, a low-memory mode,
  automatic updates and 12 interface languages.
