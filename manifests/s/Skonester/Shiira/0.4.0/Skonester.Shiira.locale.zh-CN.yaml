PackageIdentifier: Skonester.Shiira
PackageVersion: 0.4.0
PackageLocale: zh-CN
ShortDescription: 一款受经典 Shiira 项目启发的超暗色浏览器。
Description: |-
  一款以现代 Electron 技术向经典 Mac OS X Shiira 浏览器致敬的作品——拥有深色、可自定义的界面，强大的标签页工作流，以及实用的隐私工具。
  Shiira 仍在积极开发中，在项目成熟之前，最适合作为辅助浏览器使用。
  为什么选择 Shiira？
  Shiira 为希望浏览器用起来像自己工作区的人而打造。它把专注的深色界面与你每天依赖的浏览器功能结合在一起，又不会把窗口变成一块仪表板。
  - 整理你的注意力：空间、收藏、固定的标签页、文件夹、分屏视图、快速预览，以及存放近期未用标签页的归档。
  - 个性定制：Shiira Night、主题、自定义色轮、灵活的侧边栏/顶部标签布局，以及可配置的启动行为。
  - 安心浏览：原生广告拦截、装饰性过滤、隐私标签页、站点权限控制、缓存工具和安全的密码存储。
  - 让工作流不断前进：命令栏、Tab Expose、Chrome 扩展程序支持、Arc 导入、书签、历史记录、RSS 和会话恢复。
  更好的标签页管理方式
  - 空间让不同的项目拥有各自的标签页集合、名称、表情符号和颜色。
  - 每个空间可以使用独立的配置文件，将网站登录、存储、权限、历史记录、收藏和扩展程序相互分开。在空间编辑器中创建或重命名配置文件。现有数据保留在 Default 中。
  - 侧边栏实时更新在窗口之间共享空间、固定的标签页、文件夹、收藏和归档，合并各自的改动，同时每个窗口保留自己当前打开的页面。
  - 收藏、固定的标签页和文件夹在重启之后依然可用。
  - 今天标签页自动把不活跃的标签页移入归档。
  - 分屏视图可以把最多四个页面排成列、行或网格，而快速预览让你在不打断正在阅读的页面的情况下预览链接。
  - 标签页休眠会释放未使用标签页占用的内存，并在需要时重新加载。
  - Tab Expose 为你提供所有打开标签页的可视化总览。
  实用的浏览器工具
  - 可从 Chrome、Edge、Brave、Vivaldi、Opera、Chromium、Firefox、Safari 或 HTML 导出文件导入书签。Arc 迁移还会把空间、嵌套的固定标签页、所有配置文件的收藏、可选的今天标签页和历史记录、已归档的标签页以及缓存的图标带入 Shiira 的 Default 配置文件。
  - 支持来自 Chrome 网上应用店的 Manifest V3 Chrome 扩展程序。
  - 笔记和 Easels 可以从钢笔按钮或命令栏打开。撰写带格式的笔记和清单，或在画布上排布文字、绘画、形状、图片和页面截取。文档按配置文件在本地自动保存。
  - 书签栏、收藏启动器、可搜索的历史记录、RSS 和会话恢复。
  - 缓存、Cookie、站点存储、下载、权限、密码和更新的控制。
  简单直接的隐私保护
  - 由内置过滤引擎驱动的网络层与装饰性广告拦截。
  - 隐私标签页会保持扩展程序禁用。
  - 可选的退出时清除缓存行为，以及直观的浏览数据控制。
  - 密码存储由操作系统钥匙串支撑。
  笔记、Easels 和共享侧边栏只存在于本安装中，没有云端账户，也没有跨设备同步。
