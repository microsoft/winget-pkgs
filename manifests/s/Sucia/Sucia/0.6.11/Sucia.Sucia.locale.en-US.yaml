Description: |-
  The Sucia app is the desktop client for a Sucia account. Sign in with your Sucia account in the browser, and the app shows your Library: the games, tools, kits and Sucia Studio you own, with install, update, uninstall, Verify files and disk use per item, and a download queue with pause and resume. It downloads from Sucia, checks every file against a signed manifest, and launches only files it verified, from its own folder. Updates send only the changed files. Offline, it keeps working for seven days. No silent installs, no bundled extras, no ads. Installs per user without administrator rights.
