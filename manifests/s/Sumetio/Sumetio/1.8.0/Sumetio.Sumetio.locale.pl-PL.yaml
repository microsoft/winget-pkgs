ShortDescription: Program do budżetu domowego na Windows. Wczytuje plik z historią konta z banku i porządkuje wydatki według sklepów i kategorii. Dane zostają na komputerze.
Description: |-
  Sumetio to program do budżetu domowego na komputer z Windows 10 i 11. Pobierasz z bankowości internetowej plik z historią konta, wczytujesz go do programu i widzisz wydatki według sklepów i kategorii — bez przepisywania każdej pozycji, bez loginu do banku i bez zakładania konta. Dane finansowe nie opuszczają komputera. Plan miesiąca, podpowiedziany z historii, pokazuje, ile zostało na wydatki.
  Wersja próbna: przez 7 dni od pierwszego uruchomienia program działa w pełni, bez karty i bez konta. Potem do wczytywania nowych plików i zapisywania zmian potrzebna jest płatna licencja (jednorazowo, z 12 miesiącami nowych wersji); bez niej program działa w trybie podglądu — dane można przeglądać i wyeksportować.
