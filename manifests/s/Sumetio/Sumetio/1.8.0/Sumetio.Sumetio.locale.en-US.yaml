ShortDescription: Household budget program for Windows. Reads the account history file from your online banking and sorts spending by shops and categories on your computer.
Description: |-
  Sumetio is a household budget program for Windows 10 and 11. Download the account history file (CSV) from your online banking, load it into Sumetio and see your spending by shops and categories, without typing every item, without a bank login and without creating an account. Your financial data stays on your computer. A monthly plan suggested from your spending history shows how much is left to spend.
  Trial: the program works fully for 7 days from the first launch, without a card or an account. After that, loading new files and saving changes requires a paid licence (one-time payment, 12 months of new versions included); without it the program stays in preview mode, where your data can still be viewed and exported.
