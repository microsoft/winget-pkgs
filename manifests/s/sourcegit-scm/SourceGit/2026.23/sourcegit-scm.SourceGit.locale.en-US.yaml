ReleaseNotes: |-
  What's Changed
  - fix: keep folder filter when checking out or creating a branch inside it by @hltu1 in #2778
  - Add support for Alacritty Terminal integration on MacOS by @chris-t-jansen in #2781
  - Add catalan translation by @xeanhort in #2791
  - fix: keep focus on filter textbox when clicking clear button by @JC-Chung in #2794
  - fix: map ssh.bitbucket.org remotes to bitbucket.org web URLs by @ganeshmshetty in #2805
