ReleaseNotes: |-
  What's Changed
  - fix: HasPendingPullOrPush dirty state not updated after checkout by @JC-Chung in #2734
  - fix: clear stale commit message after an external operation ends by @d-tatianin in #2741
  - localization: update Russian translate by @AquariusStar in #2744
  - feature: confirm before trusting a repository refused by git by @a2580vb in #2746
  - localization: update Spanish translation by @jjesus-dev in #2749
  - localization: update Traditional Chinese translations by @JC-Chung in #2750
  - ux: allow to deselect selected author in Statistics window by @JC-Chung in #2751
  - docs: document Cheaper Inference as an OpenAI-compatible service by @aiapienthusiast in #2755
  - localization: update Traditional Chinese translations by @JC-Chung in #2756
  - localization: update Spanish translation by @jjesus-dev in #2759
  - enhance: embed AppImage update information and publish zsync files by @gengurke in #2762
  - fix: collapse shadow padding when window touches a screen edge by @gadfly3173 in #2717
  - fix: prevent leftmost x-axis label from being clipped in Statistics chart by @JC-Chung in #2556
  - fix: branch graph not always updated after fetch by @cdammanintopix in #2764
  - docs: add API Route AI service configuration by @DennyHo0917 in #2767
  - docs: document Opper as an OpenAI-compatible service by @Felixkw12 in #2769
  - localization: update Russian translate by @AquariusStar in #2770
  - macOS: sign macOS page locally
  - Fix the issue that stashes not updated after running git reflog expire --expire=now --all command out of SourceGit
  - Rewrite adding worktree
    - Support to checkout a local branch (non-current) as worktree
    - Support to checkout a remote branch as worktree
    - Pre-fill worktree path with a recommanded path
    - Add Worktree now will only create worktree based on HEAD
  - Fix the issue that editor font size falls back to 13 after switching tabs when set to 12
  - Add a pie-chart to show top contributors in Statistic dialog.
  - Several other UI/UX changes.

  New Contributors
