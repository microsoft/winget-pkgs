ShortDescription: Lightweight dual-screen desktop customization - animated wallpapers and a utility side panel.
Description: |-
  UX-windows is a minimalist, low-resource app for dual-screen PCs.
  It plays video or image wallpapers (hardware decoded, auto-paused when a game or video goes full screen)
  and docks a utility panel on the secondary screen: clock, CPU / GPU temperature, power and load,
  fans (with EZFAN), now playing music (Apple Music and others) and Claude Code sessions.
  The interface is in French.
