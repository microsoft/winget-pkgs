PackageIdentifier: Snooze561.UX-windows
PackageVersion: 0.5.1
PackageLocale: fr-FR
Publisher: Snooze561
PackageName: UX-windows
License: MIT
ShortDescription: Personnalisation légère pour double écran - fonds d'écran animés et panneau utilitaire.
Description: |-
  UX-windows est une app minimaliste et économe pour les PC à deux écrans.
  Elle affiche des fonds d'écran vidéo ou image (décodage matériel, pause automatique quand un jeu ou une vidéo passe en plein écran)
  et un panneau utilitaire sur l'écran secondaire : horloge, température, consommation et charge du processeur et de la carte graphique,
  ventilateurs (avec EZFAN), musique en cours (Apple Music et autres) et sessions Claude Code.
