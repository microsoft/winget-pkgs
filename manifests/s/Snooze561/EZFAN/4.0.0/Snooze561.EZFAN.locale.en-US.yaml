ShortDescription: Simple PC fan control with temperature curves and usage profiles.
Description: |-
  EZFAN controls motherboard and graphics card fans with temperature curves.
  A setup wizard identifies each fan header and builds four usage profiles (office, light gaming, AAA gaming, performance).
  It runs in the system tray, has a safety mode that sets all fans to 100 % at critical temperatures,
  and gives fans back to the BIOS when it exits. Requires the PawnIO driver. The interface is in French.
