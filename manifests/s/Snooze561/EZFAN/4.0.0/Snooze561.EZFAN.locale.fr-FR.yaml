Publisher: Snooze561
PackageName: EZFAN
License: MIT
ShortDescription: Pilotage simple des ventilateurs du PC, avec courbes de température et profils d'usage.
Description: |-
  EZFAN pilote les ventilateurs de la carte mère et de la carte graphique selon des courbes de température.
  Un assistant identifie chaque prise et crée quatre profils (Bureautique, Jeux légers, Jeux AAA, Performance).
  Il tourne dans la zone de notification, passe tout à 100 % en cas de température critique
  et rend les ventilateurs au BIOS en quittant. Nécessite le pilote PawnIO.
