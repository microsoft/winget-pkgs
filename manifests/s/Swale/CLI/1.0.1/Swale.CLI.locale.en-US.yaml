ReleaseNotes: |-
  `swale pull` creates a destination folder that does not exist yet.
  - `swale pull <target> --path <dir>` now creates `<dir>`, and any missing parent folders, when it does not exist yet. The folder is created only once the pull is ready to download, so a pull that is refused leaves no folder behind.
  - `swale pull` refuses a `--path` that is an existing file up front, with `Path '<path>' is a file, not a directory.`
