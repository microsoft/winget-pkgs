ShortDescription: Zero-cost global network optimizer for multiplayer games
Description: |-
  LightSpeed is a zero-cost global network optimizer for multiplayer games. It routes your game traffic through an optimized proxy tunnel, bypassing slow ISP paths to reduce and stabilize your ping. No subscriptions, no usage fees, no infrastructure bills.

  The Windows GUI (lightspeed-gui) provides a system-tray controller and a status window for the LightSpeed client. The MSI installs per-machine and bundles the WinDivert driver used for game traffic redirection.
