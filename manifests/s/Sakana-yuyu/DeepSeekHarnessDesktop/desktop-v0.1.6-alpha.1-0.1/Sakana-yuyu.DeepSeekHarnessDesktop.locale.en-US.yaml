ShortDescription: A cross-platform Tauri desktop shell for the DeepSeek Harness dsh web interface.
Description: DeepSeek Harness Desktop is a cross-platform Tauri/WebView desktop shell for the DeepSeek Harness dsh web interface, with a custom title bar, system tray, signed automatic updates, and task-completion alerts. On first launch, it checks for Node.js, pnpm, and an existing ~/.dsh home, downloading missing runtime and production dependencies when needed.
