Description: DeepSeek Harness Desktop 是 DeepSeek Harness dsh web 界面的跨平台 Tauri/WebView 桌面外壳，提供自定义标题栏、系统托盘、签名自动更新和任务完成提醒。应用首次启动时会检查本机的 Node.js、pnpm 和 ~/.dsh 主目录，并在缺少时下载所需运行时和生产依赖。
