ReleaseNotes: |-
  Deutsch · English below
  Fehlerbehebungen vom 24.09.2026. Beide Dateien sind wie v0.4.4 mit EV-Code-Signatur
  signiert (JBK-Holding GmbH, Sectigo, mit RFC-3161-Zeitstempel).
  Behoben
  - Sicherheit (XSS): Fremde Titel aus den Datenbanken können das eingebettete Skript der
    Leseliste nicht mehr beenden. Alle eingebetteten Daten werden jetzt maskiert.
  - ✔ Quelle bestätigen und ⚠ melden hängen am festen Zeilen-Schlüssel statt am Anzeigetitel.
    Frühere Datenbank-IDs bleiben als Verweis erhalten, Favoriten und Archiv verwaisen nicht mehr.
  - Reader-Prüfung: Eine Zeitüberschreitung oder ein Serverfehler (5xx) gilt nicht mehr als
    „Reader tot“. Als tot zählt eine Domain nur noch, wenn das Netz nachweislich funktioniert.
  - Lesestand von Hand: Ein manuell gesetztes Kapitel wird vom Browser-Scan abgelöst, sobald
    dort weitergelesen wurde. Vorher blieb der Handwert für immer stehen.
  - Updater: Ein Release nur mit Installer schneidet Installer-Nutzer nicht mehr von Updates ab.
  - Titel- und Kapitel-Erkennung: Titel mit Zahlen (Kaiju No. 8, Zom 100) bleiben ganz,
    ein Kapitel-Token zählt nur als eigenes Wort (the-witch-2 ist kein Kapitel 2), dazu
    Korrekturen für Titel mit senkrechtem Strich und für japanische/chinesische Suchbegriffe.
  Prüfsummen (SHA-256)
  3833ccabd49d72308f59b6b0b477448f756ec1975d55dfd82cc7e8a26e7baa8b  SyncManga-Setup.exe
  c4d5391827f67ac9a4e0020e764bf6bdbf3d570e592dc81ffb492d420f711793  SyncManga.exe
  Als Dateien liegen SyncManga.exe.sha256 und SyncManga-Setup.exe.sha256.txt bei. Die Setup-Prüfsumme endet bewusst auf .txt: der Update-Prüfer älterer Fassungen nimmt jeden .sha256-Anhang und würde sonst danebengreifen.
  Signatur prüfen: Rechtsklick auf die Datei, Eigenschaften, Reiter Digitale Signaturen —
  oder in PowerShell Get-AuthenticodeSignature .\SyncManga-Setup.exe.
  English
  Bug fixes from 24 Sep 2026. Like v0.4.4, both files carry an EV code signature
  (JBK-Holding GmbH, Sectigo, RFC 3161 timestamp).
  Fixed
  - Security (XSS): titles coming from the metadata databases can no longer break out of the
    reading list's embedded script. All embedded data is escaped now.
  - ✔ confirm source and ⚠ report resolve via the stable row key instead of the display title.
    Earlier database IDs are kept as aliases, so favourites and archive entries no longer get orphaned.
  - Reader check: a timeout or server error (5xx) no longer marks a reader as dead. A domain only
    counts as dead when the network demonstrably works.
  - Manual progress: a chapter you set by hand is superseded by the browser scan as soon as you
    read further there. Before, the manual value stuck forever.
  - Updater: a release that only ships the installer no longer cuts installer users off from updates.
  - Title and chapter parsing: titles containing numbers (Kaiju No. 8, Zom 100) stay intact, a
    chapter token only counts as a word of its own (the-witch-2 is not chapter 2), plus fixes for
    titles with a pipe and for Japanese/Chinese search terms.
  Checksums (SHA-256)
  See the German section above — the checksums are identical.
  Checksum files: SyncManga.exe.sha256 and SyncManga-Setup.exe.sha256.txt. The installer's file deliberately ends in .txt: the update checker of older versions picks any .sha256 asset and would otherwise grab the wrong one.
  Verify the signature: right-click the file, Properties, Digital Signatures tab — or in
  PowerShell Get-AuthenticodeSignature .\SyncManga-Setup.exe.
