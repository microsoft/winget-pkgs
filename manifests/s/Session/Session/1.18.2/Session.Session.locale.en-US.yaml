ReleaseNotes: |-
  Release Overview
  - Show a placeholder for messages this version can't process, and retain them https://github.com/session-foundation/session-desktop/pull/2025
  - Default to stream encryption and write the stream fragment bare https://github.com/session-foundation/session-desktop/pull/1992
  Other Changes
  - Update Windows build info https://github.com/session-foundation/session-desktop/pull/1946
  Bug Fixes
  - Avoid jumping back after sending https://github.com/session-foundation/session-desktop/pull/1961
  - Keep draft reply quotes per conversation https://github.com/session-foundation/session-desktop/pull/1959
  - Focus composition input when typing https://github.com/session-foundation/session-desktop/pull/1956
  - Allow same-name staged attachments https://github.com/session-foundation/session-desktop/pull/1950
  - Support pinch-to-zoom and drag-to-pan in lightbox https://github.com/session-foundation/session-desktop/pull/1957
  - Reduce update file server polling https://github.com/session-foundation/session-desktop/pull/1960
  - Preserve unread state for remote deletions https://github.com/session-foundation/session-desktop/pull/1968
  - Build errors with latest libsession-util-nodejs https://github.com/session-foundation/session-desktop/pull/1969
  - Keep Home and End within message input https://github.com/session-foundation/session-desktop/pull/1987
  - Popover position on open is measured after open https://github.com/session-foundation/session-desktop/pull/2008
  - Make sure only one create/restore is in flight https://github.com/session-foundation/session-desktop/pull/2011
  - Renew config message TTLs at most once an hour per swarm https://github.com/session-foundation/session-desktop/pull/2017
  - Preserve colon suffixes after consecutive dots in URLs https://github.com/session-foundation/session-desktop/pull/2020
  - Remember lightbox video volume https://github.com/session-foundation/session-desktop/pull/2012
  - Erase group entries a config merge recreated after another device erased them https://github.com/session-foundation/session-desktop/pull/2027
  - Keep a hidden conversation hidden when our own message syncs into it https://github.com/session-foundation/session-desktop/pull/2000
  - Stop an in-flight poll undoing a cursor reset https://github.com/session-foundation/session-desktop/pull/2016
  - Make the collapsed message bubble and its Read More button addressable https://github.com/session-foundation/session-desktop/pull/1999
  - Stop the sending device counting its own message twice https://github.com/session-foundation/session-desktop/pull/1998
  - Fix system-specific build issues https://github.com/session-foundation/session-desktop/pull/1982
