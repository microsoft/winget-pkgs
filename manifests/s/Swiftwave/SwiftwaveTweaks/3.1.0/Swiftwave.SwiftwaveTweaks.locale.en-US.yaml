ShortDescription: Windows 11 optimization utility with verified, reversible settings for power, gaming, startup and system cleanup.
Description: |-
  Swiftwave Tweaks is a Windows 11 desktop utility for conservative PC configuration. It inspects the current system, presents settings that can be changed safely, and verifies each change after applying it. Every modification is recorded so it can be reverted from inside the app.

  Features include power plan switching with previous-plan rollback, supported gaming-related Windows policy settings, startup entry management with automatic backup and restore, supported network adapter and NVIDIA display power-management settings, cleanup suggestions, and a diagnostics view.

  Settings that require administrator rights trigger a standard Windows User Account Control prompt. The application does not install drivers or Windows services, and settings it cannot verify are reported as manual or unsupported rather than changed.
