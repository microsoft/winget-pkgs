ShortDescription: Use USB devices plugged into another computer over your network, as if they were plugged in locally.
Description: |-
  PulseUSB shares USB devices from a small Linux server to Windows and Linux computers on the same network, using the standard USB/IP protocol.
  This package is the Windows app: it finds servers automatically and connects their devices, with auto-connect, device groups, a tray menu, keyboard shortcuts and KVM-style switching between computers.
  The server runs on Linux and is installed separately from the project's releases.
