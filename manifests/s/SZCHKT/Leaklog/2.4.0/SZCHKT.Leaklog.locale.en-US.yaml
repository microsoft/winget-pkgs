ShortDescription: Leakage control system based on Regulation (EC) No 842/2006.
Description: Leaklog is a leakage control system based on Regulation (EC) No 2024/573. It logs findings and parameters of leakage checks, shows a history of the development of parameters, compares them with nominal ones and calculates the percentage of leakage.
