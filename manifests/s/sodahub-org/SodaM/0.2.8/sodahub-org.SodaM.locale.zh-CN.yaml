ReleaseNotes: |-
  - 更紧凑的启动窗口：默认调整为 980 × 640 逻辑像素，在主屏幕居中；最小尺寸保持 900 × 560。
  - 记住音量与静音状态：重启后恢复上次音量，取消静音时恢复静音前的音量，不再跳到最大；偏好后台防抖、原子保存，正常退出时刷尾。
  - 可调音频缓存上限：默认 10 GiB，设置页提供常用容量和 ±1 GiB 调整（1–1024 GiB）。后台按最近使用时间淘汰旧缓存；正在下载、等待装载、播放及暂停中的音频受保护，可能暂时超额。
  - 清空缓存不再阻塞界面：后台递归清理音频、封面和封面原图，保留使用中的音频及近期下载临时文件。
  - 播放恢复加固：装载失败及音频线程退出都会回执，避免一直停在 loading；设备报错或播放进度长时间不动时提示重试，失效输出会在下次播放时重新打开；坏缓存清理与下载写入互斥。
  - 跨平台测试稳定性：音频单测改为注入故障输出，验证设备不可用时的失败回执与重试，不依赖 CI runner 的真实声卡。
