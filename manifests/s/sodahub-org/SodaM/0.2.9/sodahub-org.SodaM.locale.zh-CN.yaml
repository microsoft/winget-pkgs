ReleaseNotes: |-
  - 播放跟随系统默认输出设备：播放中把系统默认输出从音响切到 USB 耳机（或反向）后，2 秒内自动切到新设备，并从原位置续播，音量与暂停状态保持不变，不再需要重启应用；切歌也会使用当前默认设备。Windows(WASAPI) / macOS(CoreAudio) 适用；Linux 由 PipeWire/WirePlumber 自行迁移，行为不变。
  - Wayland 窗口控制按钮：使用客户端装饰的桌面（GNOME 等）补齐最小化 / 最大化 / 关闭按钮与标题栏拖拽，最大化后按钮切换为「还原」图标；X11 与 macOS 继续使用系统装饰，不会出现两套按钮。wlroots 系桌面（Hyprland / sway）保持无边框现状。
  - 已知问题：Wayland 下双击标题栏最大化暂未生效 —— 第一次按下会被合成器的窗口移动 grab 抢占指针，详见 #11，将在后续版本修复。
  - 其它：新增 restore 图标与图标注册回归测试；音频设备切换检测补充单测；README 更新贡献者与 0.2.9 安装说明。
