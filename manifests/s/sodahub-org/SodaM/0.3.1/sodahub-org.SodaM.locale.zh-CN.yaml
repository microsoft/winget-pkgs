Description: SodaM 是一个基于 GPUI 和 libresoda 的原生汽水音乐桌面客户端，面向 Linux、macOS 和 Windows 桌面，重点提供接近官方客户端的操作手感、稳定的本地播放体验、会员账号的无损音质播放，以及干净自适应的主题系统。
