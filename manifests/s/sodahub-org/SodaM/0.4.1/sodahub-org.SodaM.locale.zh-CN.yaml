ReleaseNotes: |-
  SodaM 0.4.1
  封面与图片
  - 封面状态收成一个 CoverStore：队列满与下载失败不再永久丢图，原图并进同一份状态（#255、#260）。
  - 封面按显示尺寸存 JPEG（缩略图 160 / 大图 1280），内存预算 64 MiB / 512 张，磁盘 512 MiB 上限按最后显示时间淘汰（#218、#217、#219、#224）。
  - 封面写入改成原子替换，清缓存撞上在飞下载不再记死路径（#216、#264）；扫描不完整时淘汰不再静默跳过（#225）。
  音频缓存
  - 下载切到可续传路径，断网只补缺口（#243、#95）。
  - 缓存维护一轮只扫一遍，未超限不排序（#310）；下载时记账，占用越过九成提前清理（#314）。
  - 容量与用量口径统一：数不准就写「至少」，读不全要说明（#315）；该不该清收成一处判断（#316），认族与删族收成一处（#317）。
  - 暂存文件名固定、一歌两锁；启动巡检清掉暂存残留，锁跟着音频一起淘汰（#241、#242）。
  音质与升级
  - 批量升级每首前查身份、可取消，单首与批量共用同一条跑曲路径（#254）。
  - 旧缓存同码率重下不再算升级成功（#272）；试听换试听不算成功，取消后按钮不再假可点（#274）。
  - 未知档位的探测结论按账号范围退避（#288）；杜比 / Hi-Res 的探测结论也能落盘（#247）。
  - 升级失败按原因记日志（#295）；批量没有失败时不再弹黄色警告（#289）。
  设置与退出
  - 13 处设置保存收成一条后台写队列，退出只等一次 flush（#259）。
  - 会话只持有真正用到的 10 个字段（#256）；单首升级完就重算设置页预估（#248）。
  播放与性能
  - 点播失败收成一份纯决策，判定与提示共用同一处（#257）。
  - 常用模式失败给出终态与重试入口（#213）。
  - 暂停时心跳降频，歌词窗口隐藏后不再空转（#261）；托盘三条状态并成一拍，空闲不无条件进 app（#258）。
  窗口与安装包
  - 关窗行为可配置，没有托盘时不再把窗口收丢（#324）。
  - Windows 安装器升级时不再跳过安装位置页（#309）。
  - Linux x86_64 包回到 x86-64 baseline，老 CPU 不再在 TLS 握手时 SIGILL（#306）。
  依赖
  - libresoda 提到 b60422e，签名器失败按服务端给的时长重试一次（#213）。
  - gpui 基线换到 d9a82ba（上游 17c64ae + 本 fork 7 个修复）。
  验证：cargo metadata --locked 通过（Cargo.lock 与版本号同步）；scripts/check.sh --fmt-only 通过；编译、clippy、测试与四平台产物由 tag 触发的 CI 执行。
