PackageVersion: 1.5.3
PackageLocale: en-US
License: AGPL-3.0-only
ShortDescription: A third-party client for Fruit short dramas that needs no sign-in.
Description: |-
  Unofficial third-party client for short-drama episodes, including live-action series, AI comic series and AI short dramas. No sign-in and no ads.
  - Home, search, categories and rankings with real catalogue data.
  - Plays decrypted encrypted streams with quality switching, playback speed, episode selection, auto-play next and resume position.
  - Follows, favourites and watch history are stored locally and can sync across devices over WebDAV.
  - Scrollable danmaku overlay on the player with a remembered on/off state.
  - Light and dark themes; the Android build is a portrait immersive client and the Windows desktop build adds keyboard and mouse control and windowed fullscreen.
