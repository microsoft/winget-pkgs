ShortDescription: 第三方水果短剧客户端，免登录、免广告，支持真人剧与 AI 短剧。
Description: |-
  第三方短剧客户端，非官方、免登录、免费使用，支持真人剧、AI 漫剧、AI 短剧等多种短剧。
  - 首页、搜索、分类与榜单，展示真实数据。
  - 加密流解密播放，支持清晰度切换、倍速、选集、自动连播与进度续播。
  - 追剧、收藏与观看历史本地保存，支持 WebDAV 多设备同步。
  - 播放层内置滚动弹幕，可随时开关并记住状态。
  - 深浅双主题；Android 竖屏沉浸式体验，Windows 桌面版支持键鼠操作与窗口全屏。
