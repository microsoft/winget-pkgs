ReleaseNotes: |-
  议题现在有看板了。可以按状态在对应列中看到每个议题，并在列之间拖动卡片来更改状态。Drive 文件会在相关线程的侧边窗格中打开以便编辑，Capy 在线程、云端机器和桌面应用上都更快了。
  这一版还补充了 Capy 在 Slack 中的更多功能，并修复了线程、议题、桌面应用和 Slack 中的多项问题。
