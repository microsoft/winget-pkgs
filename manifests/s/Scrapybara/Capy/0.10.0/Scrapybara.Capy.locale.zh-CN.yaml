ShortDescription: Capy 的桌面客户端，为工程团队并行运行 AI 编程智能体。
Description: Capy 是一个 AI 软件工程平台。桌面应用在本地标签页和窗口中并行运行编程智能体，打开来自 Slack 和浏览器的深度链接，并让你审查智能体生成的代码差异。每个线程可以在隔离的云端机器上运行，也可以在已配对的计算机的文件夹中运行，安装流程还能导入现有的 Codex 和 Claude Code 会话。
