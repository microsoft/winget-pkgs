ShortDescription: Desktop client for Capy, which runs AI coding agents in parallel for engineering teams.
Description: Capy is an AI software engineering platform. The desktop app runs coding agents in parallel in native tabs and windows, opens deep links from Slack and the browser, and lets you review the diffs the agents produce. Each thread can run in an isolated cloud machine or in a folder on the paired computer, and the setup flow can import existing Codex and Claude Code sessions.
