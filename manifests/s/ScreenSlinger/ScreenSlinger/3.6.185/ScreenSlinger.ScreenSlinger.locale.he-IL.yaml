ShortDescription: צילום מסך מהיר ל-Windows עם צילום גלילה אוטומטי, סימון אמיתי והסתרה חכמה של מידע רגיש.
Description: |-
  Screen Slinger הוא כלי לצילום מסך ולסימון על גבי הצילום ל-Windows 10 ו-11, שנבנה כדי להסביר מסך ולא רק לצלם אותו.

  צלמו אזור - ריחוף מעל המסך מציע את החלון, הפאנל או הטבלה שמתחת לסמן - או תנו לצילום הגלילה האוטומטי לגלול עבורכם עמוד ארוך: הוא נעצר לבד בתחתית, מזהה כותרות נעוצות כדי שיופיעו פעם אחת בלבד, ומחבר הכול לתמונה אחת ארוכה. אחר כך מסמנים בחצים, צורות, טקסט, בועות דיבור, סימוני שלבים ממוספרים אוטומטית, זרקור, זכוכית מגדלת, מדבקות אימוג'י ומדבקות שגזרתם מכל צילום. כל סימון נשאר אובייקט שאפשר לערוך: סוגרים את הקובץ, פותחים אותו בשבוע הבא, ועדיין אפשר להזיז, לעצב מחדש או למחוק כל דבר.

  טשטוש, פיקסליזציה ומילוי אחיד מחליפים את הפיקסלים בקובץ המיוצא ולא רק מכסים אותם, ובלחיצה אחת מוצעות הסתרות לכתובות דוא"ל ולמספרים ארוכים שזוהו. אפשר להעתיק טקסט מצילום בעזרת מנוע ה-OCR המובנה ב-Windows (תלוי בחבילות השפה המותקנות).

  הכול רץ מקומית: אין חשבון, אין העלאה ואין טלמטריה. התוכנה פונה לרשת רק כדי לבדוק מפתח רישיון בהפעלה, ובכל הפעלה כדי לבדוק אם יש גרסה חדשה. הממשק באנגלית, צרפתית, גרמנית או עברית: בהפעלה הראשונה נבחרת שפת Windows (אחרת אנגלית), ואפשר לשנות בהגדרות. טקסט סימון בעברית נכתב מימין לשמאל.

  ב-Screen Slinger אין שיתוף בענן. השימוש חינם במשך 30 יום עם כל התכונות פתוחות, ואחר כך רכישה חד-פעמית.
