ShortDescription: Fast Windows screen capture with automatic scrolling capture, real annotation and smart redaction.
Description: |-
  Screen Slinger is a screenshot and annotation tool for Windows 10 and 11, built for explaining a screen rather than only capturing it.

  Capture a region - hovering suggests the window, panel or table under the cursor - or let the automatic scrolling capture scroll a long page for you: it stops at the bottom by itself, detects sticky headers so they appear only once, and stitches everything pixel-accurately into one tall image. Then mark it up with arrows, shapes, text, speech-bubble callouts, auto-numbered step markers, a spotlight, a magnifier, emoji stickers and stickers of your own cut from any capture; text can size itself to its box. Every annotation stays an editable object: close the file, reopen it next week, and you can still move, restyle or delete anything, because the undo history is saved alongside the image.

  Blur, pixelation and solid fill replace the pixels in the exported file rather than covering them, and one click suggests hides for detected e-mail addresses and long numbers, with reusable hide-templates for screens you capture every day. Text can be copied out of a capture via the OCR engine built into Windows (it depends on the installed OCR language packs).

  It runs entirely locally. There is no account, no upload and no telemetry, and it goes online only to check a licence key at activation and, at start-up, to check for a newer version. It ships as a single self-contained, digitally signed executable with no installer and no runtime prerequisites, and the interface is in English, French, German or Hebrew: on first run it takes the Windows language, otherwise English, and it can be changed in Settings. Hebrew annotation text is written right-to-left.

  Screen Slinger offers no cloud sharing. It is free to use for 30 days with every feature unlocked, then a one-time purchase.
