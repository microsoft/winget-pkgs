ReleaseNotes: |-
  久等了，最近对软件整体架构进行了大幅调整，修复了一些遗留问题，不可避免存在一些破坏性变更，更新后需要重新定位游戏。
  文档站正在准备中 https://starward.scighost.com ，收集一下在使用过程中不理解的功能或遇到的问题，点击填写问卷。
  值得关注的更新
  - 重构了游戏安装功能，整体架构更改为以启动器渠道为中心，支持添加自定义渠道，更新后需要重新定位游戏
  - 战绩功能移除网页登录，改为通行证登录，更新后需要重新登录
  - 新增原神的过场动画资源管理功能，通过删除相关文件最多可节省 40+GB 存储空间。 功能入口如下图
  其他更新
  - 适配完整的游戏安装流程，修复崩坏 3 的预下载流程
  - 删除硬链接功能设置，改为强制开启，安装进度和游戏列表中展示硬链接大小
  - 删除了基于注册表的账号切换功能，改用通行证授权登录代替
  - 删除了统一的游戏设置页面，仅在启动器页面的设置中保留特殊图形设置（原神：HDR，星穹铁道：帧率）
  - 删除了高级设置中的注册 URL 协议，安装版自动注册
  - 删除了高级设置中的 RPC 保持后台运行选项，RPC 进程跟随主进程退出
  已知问题
  国际服战绩页面无法登录（404 错误），请等待后续更新修复。
