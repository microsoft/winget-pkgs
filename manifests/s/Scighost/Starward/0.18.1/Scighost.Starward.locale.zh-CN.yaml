Description: Starward 是一个为了解决 HoYoPlay（米哈游启动器）的缺点而开发的开源第三方启动器，支持米哈游 PC 端的所有游戏，目标是完全替代官方启动器。除了启动器的基本功能外，还提供记录游戏时间、切换游戏账号、浏览游戏截图、保存抽卡记录等拓展功能。
