ShortDescription: An open-source third-party launcher for all PC games of HoYoverse that aims to completely replace the official HoYoPlay launcher.
Description: Starward is an open-source third-party launcher developed to address the shortcomings of HoYoPlay (miHoYo Launcher). It supports all PC games of HoYoverse and aims to completely replace the official launcher. In addition to the basic functions of a launcher, it includes additional features such as recording game time, switching game accounts, viewing game screenshots, and saving gacha records.
