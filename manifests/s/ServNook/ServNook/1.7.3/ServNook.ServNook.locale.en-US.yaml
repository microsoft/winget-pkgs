ShortDescription: Free, open-source local web stack for Windows. Apache, the latest PHP, MariaDB, phpMyAdmin and Node.js in one folder.
Description: |-
  ServNook is a portable, XAMPP-style local development stack for Windows. It installs per user without admin rights and, on first run, downloads the current official Windows builds of Apache, PHP, MariaDB, phpMyAdmin, Node.js and Composer, checking their SHA-256 checksums where the publisher provides them.
  Every folder in www becomes a site at http://<folder>.localhost, several PHP versions can be installed side by side, Node.js apps run as managed processes, and MariaDB runs with crash-safe settings and automatic backups. MySQL 8.4, PostgreSQL and MongoDB are optional.
