ReleaseNotes: "• Price Check:\r\n  • added support for Jewelry Catalysts\r\n  • added settings for default values of \"Merchant Only\" and \"Buyout Currency\" filters\r\n  • added ability to check Timeless Jewel against different Keystones\r\n  • added support for \"Quality does not increase [...]\" enchant\r\n  • added icon for all Unveiled mods\r\n  • Unique Items:\r\n    • added Kingsmarch Disenchant value\r\n    • Base Percentile is now used for calculating minimum and maximum possible Defenses roll value\r\n    • Implicits are now hidden by default \r\n    • You should now see much less stats consumed by conversion into pseudo stats\r\n  • added icons to indicate that stat roll was changed by Reflecting Mist, Volatile Vaal Orb, or increased by modifier (usually via Catalysts)\r\n  • optimized API call cost for Mercenary Warrant, when you check 6-Link filter and all Tier 3 gems on that skill\r\n  • 5 Skills Medium Cluster is now searched as \"max：5\" instead of \"min: 5, max: 5\"\r\n  • Blighted Maps are now checked with Area Name by default\r\n• Item/Map Check:\r\n  • fixed crash when checking some Maps\r\n  • only Explicit mods are now shown\r\n  • brought back map screenshots (you can only see them for Memory thread maps in Eagon interface)\r\n  • added a reminder text to Maven Witness a map that contains Memory Thread boss\r\n  • fixed PoEDB links\r\n\r\n<img width=\"460\" height=\"559\" alt=\"image\" src=\"https://github.com/user-attachments/assets/b925be1c-0629-4f8c-9687-91dfc3b3570c\" />"
