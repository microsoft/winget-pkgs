ReleaseNotes: |-
  - 优化：恢复顶部品牌标志、主导航栏、网关状态胶囊与左侧平台列表的原有界面风格
  - 优化：移除内置网关供应商卡片的额外高亮底纹、亮框及顶部和左侧饰条，使列表与卡片外观更加统一清爽
  - 修复：修复 Antigravity IDE 一键汉化无法匹配安装语言包与设置页未生效的问题，缩短汉化后启动首屏白屏等待并补齐欢迎页翻译
  - 修复：修复增强插件安装后桌面端汉化丢失、接入策略配置未生效及多界面快速切换串显的问题
  - 优化：Antigravity 与 Antigravity IDE 拆分独立增强插件面板，桌面端聚焦内置汉化的上下文与多账号扩展，有原项目的扩展统一显示原始项目名称
  - 其余功能不变，可直接覆盖安装
