- 人工智能
ReleaseNotes: |-
  - 修复：修复 Antigravity 反代接入第三方模型后无法调用自带高阶工具、子智能体以及已安装插件与外部工具服务的问题，纯自建密钥模式与混合模式均可完整挂载并连续调用
  - 新增：Antigravity 桌面端增强插件新增三款社区扩展并支持跨扩展自动冲突检测与互斥切换，涵盖原生用量与速率监控、Codex 昼夜双主题及暖纸五段主题
  - 新增：增强插件弹窗支持叠层预览仓库详情页、点击截图放大与目录跳转，并完整呈现标题、徽章、多列截图、数据趋势图与演示视频
  - 修复：修复增强插件安装、重装与卸载时因客户端监听或文件扫描占用引发拒绝访问与占用失败的问题，临时解压与覆盖清理更稳妥
  - 优化：重构增强插件弹窗布局，执行日志收纳为底部折叠抽屉，重启桌面端时自动保留本地调试参数
  - 其余功能不变，可直接覆盖安装
