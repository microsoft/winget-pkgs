ReleaseNotes: '- 改进：默认外观调整——界面风格默认改为「极简扁平」（此前默认「轻拟物」），顶部导航标签图标默认隐藏（此前默认显示）。首帧脚本、设置页开关初始态与运行时默认值三处同步修改，避免启动瞬间跳变；已存过 byok-style / byok-show-nav-icons 偏好的老用户继续沿用原选择，不会被强制覆盖。'
