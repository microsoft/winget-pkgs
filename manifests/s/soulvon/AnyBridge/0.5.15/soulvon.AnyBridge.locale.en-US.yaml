PackageIdentifier: soulvon.AnyBridge
PackageVersion: 0.5.15
PackageLocale: en-US
ShortDescription: A local BYOK model onboarding and configuration manager for AI coding tools.
Description: 'AnyBridge is a simple local BYOK (bring your own channel or key) model onboarding and configuration manager for AI coding tools. It solves the problem of tools that do not freely support custom models or require hand-written configuration: through a graphical interface it connects third-party API relays such as OneAPI and NewAPI, self-hosted gateways, and custom models such as DeepSeek, Claude, and GPT to your usual desktop IDEs and terminal CLI tools, supporting more than 12 tools including Claude Code, Codex, Windsurf, Cursor, and Devin.'
