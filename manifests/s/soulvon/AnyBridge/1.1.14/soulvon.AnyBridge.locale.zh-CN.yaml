- cursor
- 人工智能
ReleaseNotes: |-
  - 修复：Devin 升级到新版后模型列表无法改写、自定义模型代理失效的问题
  - 修复：流式回复在中文或长回答下偶发乱码、中断的问题
  - 修复：连接中途断开时用量统计记录不准确的问题
  - 优化：保存供应商配置更可靠，写入异常时会自动恢复原配置，不会留下坏数据
  - 优化：整体运行更轻快，长时间会话与多账号切换更稳定
  - 其余功能不变，可直接覆盖安装
