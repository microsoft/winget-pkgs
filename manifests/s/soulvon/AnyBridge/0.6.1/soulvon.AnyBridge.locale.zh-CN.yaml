ShortDescription: AI 编程工具的本地 BYOK 模型接入与配置管理客户端。
Description: AnyBridge 是一款简单方便的本地 BYOK（自带渠道 / Key）模型接入与配置管理客户端，解决各类 AI 编程工具无法自由配置模型或手写配置麻烦的问题。无需手写配置文件、无需搭建复杂环境，在图形界面中即可把第三方中转站（OneAPI / NewAPI 等）、自建网关以及 DeepSeek、Claude、GPT 等自定义模型快捷接入常用的桌面 IDE 与终端 CLI 工具，支持 Claude Code、Codex、Windsurf、Cursor、Devin 等 12 款以上的工具。
