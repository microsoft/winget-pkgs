- cursor
- 人工智能
ReleaseNotes: |-
  - 修复：停止接入后残留的代理地址会让客户端一直连不上、账号切换等插件无法正常工作。现在停止接入会完整清理两端配置并重启语言服务，即使中途关闭程序也不会留下失效地址
  - 增强：与账号切换类扩展共存。现在会跟随客户端实际使用的调试端口、不抢客户端重启、写入配置时保留其它扩展的设置，互不干扰
  - 其余功能不变，可直接覆盖安装
