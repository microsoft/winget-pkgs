ReleaseNotes: "Note：Sqlectron no longer supports Windows 7.1, 8, 8.1 and macOS 10.11 and 10.12\r\n\r\n## Features\r\n\r\n• Update build/icon.icns to conform to Big Sur style by @amancevice in https://github.com/sqlectron/sqlectron/pull/682\r\n• Allow user to select install location for Windows by @MasterOdin in https://github.com/sqlectron/sqlectron/pull/740\r\n• Build arm64 dmg for macOS by @MasterOdin in https://github.com/sqlectron/sqlectron/commit/57378a33c7c418cd385ffb73e45586f67015d1e2\r\n• Set up Windows code signing by @MasterOdin in https://github.com/sqlectron/sqlectron/commit/57378a33c7c418cd385ffb73e45586f67015d1e2 and https://github.com/sqlectron/sqlectron/pull/739\r\n• Support ed25519 authentication for MariaDB by @MasterOdin in https://github.com/sqlectron/sqlectron/commit/f67761604d521078e72e0b8635d2aa4995d81322\r\n\r\n## Bug Fixes\r\n\r\n• Fix search crash Issue by @Ormax563 in https://github.com/sqlectron/sqlectron/pull/723\r\n• Fix resizing server sidebar  by @ruddenchaux in https://github.com/sqlectron/sqlectron/pull/710\r\n\r\n## New Contributors\r\n• @amancevice made their first contribution in https://github.com/sqlectron/sqlectron/pull/682\r\n• @armujahid made their first contribution in https://github.com/sqlectron/sqlectron/pull/719\r\n• @Olexandr88 made their first contribution in https://github.com/sqlectron/sqlectron/pull/736\r\n• @Ormax563 made their first contribution in https://github.com/sqlectron/sqlectron/pull/723\r\n• @ruddenchaux made their first contribution in https://github.com/sqlectron/sqlectron/pull/710\r\n\r\n**Full Changelog**：https://github.com/sqlectron/sqlectron/compare/v1.38.0...v1.39.0"
