ReleaseNotes: |-
  Captae 第一个公开版本。macOS、Windows、Linux 上的本地媒体下载和管理工具：粘贴链接或在浏览器里点「下载」，Captae 挑好清晰度、下载、放进能搜字幕的素材库；Claude、Cursor 这些 AI 助手也能通过 MCP 让它下载、找素材、转文字。所有文件和登录状态都只在你自己的电脑上。

  The first public release of Captae, a local media downloader and library for macOS, Windows and Linux. Paste a link or click Download next to a video in your browser; Captae picks the quality, downloads it and files it into a library you can search by subtitle text. AI assistants such as Claude and Cursor can use it over MCP. Everything stays on your computer.

  已知情况 / Known issues
  - 界面有 8 种语言，简体中文以外都是 AI 翻译的，欢迎纠正。/ The UI comes in 8 languages; all but Simplified Chinese are AI translations, and corrections are welcome.
  - 浏览器插件没上架商店，要在开发者模式里加载（Captae 的「浏览器插件」页会带你做）。/ The browser extension is not in any store yet; load it in developer mode (Captae's Browser extension page walks you through it).
  - 网站改版后附带的 yt-dlp 可能暂时读不了，Captae 会引导你用浏览器插件在网页里下。yt-dlp 每天自动检查更新。/ After a site changes, the bundled yt-dlp may fail for a while; Captae points you to the browser extension. yt-dlp updates itself daily.
  - 不做 DRM：受数字版权保护的内容 Captae 会直接说不能下载。/ No DRM: protected content is reported as not downloadable.
  - Intel Mac、ARM 版 Windows / Linux 暂时没有安装包。/ No builds yet for Intel Macs or ARM Windows / Linux.
