PackageIdentifier: sol1560.Captae
PackageVersion: 0.2.0
PackageLocale: zh-CN
Description: |-
  macOS、Windows、Linux 上的本地媒体下载和管理工具。粘贴一个链接，或者在浏览器里点视频旁边的「下载」，Captae 挑好清晰度、下载、存成好用的文件，放进能搜字幕的素材库；Claude、Cursor 这些 AI 助手也能通过 MCP 让它下载、找素材、转文字。所有文件、素材和登录状态都只在你自己的电脑上。

  - 下载：YouTube、B 站、X、抖音 / TikTok、Instagram 等网站的视频和音频（网页交给 yt-dlp），M3U8（HLS）流和媒体直链。下载前能看每一档清晰度多大；播放列表、多视频帖子、B 站分 P 可以挑着下；正在直播的可以「从现在开始录」，录够了「停止并保存」。
  - 要登录的也能下：在 Captae 自带的登录窗口里登录一次，或者用浏览器插件带上浏览器里的登录状态。
  - 说清楚为什么下不了：要登录、要验证、地区限制、被网络拦截、视频已删除、受 DRM 保护……每种都有对应的说法和下一步按钮，不是一句笼统的「失败」。
  - 素材库：下好的文件自动入库，按标题、标签和字幕里的话搜；转换格式（MP4、WebM、MOV、ProRes、MP3、FLAC……）、精确剪辑、拼接、换音轨、生成和烧录字幕、在文件管理器中显示。
  - 语音转文字：没有字幕的视频在本机识别成字幕和文字稿（faster-whisper，声音不上传）。
  - 发给 AI：把一个视频整理成文字稿 + 关键画面，放进剪贴板，贴进 AI 对话就能让它理解视频内容。
  - 复制了链接也能下：复制了视频链接、1 分钟内打开 Captae，它在下载页问一句要不要下（复制的那一刻什么都不弹）；Captae 里也能直接粘贴。
  - 浏览器插件：网页里的视频旁边出现下载按钮和清晰度菜单，右下角显示进度；工具栏面板列出这一页能下的视频、声音和图片，最近找到的也会出现在 Captae 的侧栏里。
  - AI 助手：MCP 服务器提供下载、转换、字幕、剪辑、拼接、查素材库、预设、发给 AI 等工具；你可以整个关掉，或者只开放一部分，每次调用都有记录。
  - 多种语言：界面、提示和命令行支持简体中文、English、繁體中文、日本語、한국어、Deutsch、Español、Français，默认跟随系统，设置里可以换。
