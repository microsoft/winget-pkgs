ReleaseNotes: |-
  Captae 0.3.0：网页上的下载按钮直接放进网站自己的那一排、存网页和复刻整站、素材库用 AI 整理成分类，从这一版起 Captae 能在应用里自己更新。
  Captae 0.3.0: the Download button now sits in each site's own row of buttons, you can save web pages and clone whole sites, the Library can be sorted into categories by AI, and from this version on Captae updates itself.
  从 0.2.0 升级 / Upgrading from 0.2.0
  - 0.2.0 还没有应用内更新，这一次要手动下载安装（直接覆盖，素材库和设置都留着）。从 0.3.0 起，Captae 会自己检查、下载、验签，点「重新打开」就装好。
  - 装好以后到浏览器的扩展程序页面，给 Captae 插件点一次「重新加载」。以后 Captae 更新时，从 Captae 安装位置加载的插件会自己跟着换。
  - 0.2.0 has no in-app updates, so install this one by hand (it installs over the old version; your Library and settings stay). From 0.3.0 on, Captae checks, downloads and verifies updates itself; click Relaunch to install.
  - After installing, click Reload for the Captae extension once on your browser's Extensions page. Later updates reload the extension automatically if it was loaded from Captae's install location.
  新功能 / What's new
  - 网页上像原生一样的下载按钮：YouTube、X、小红书、B 站、TikTok、抖音、Instagram、Facebook 上，「下载」按钮放进网站自己的那一排按钮里（点赞、分享旁边），信息流里每条帖子下的就是这条帖子的视频。认不准是哪条帖子时不下，并说明原因。
    小红书图文和 X 图片帖能下原图；有字幕的视频，菜单里能单独下字幕（SRT），设置里填了 AI 模型时还能翻译成界面语言。
  - 存网页：右键「把这个网页存下来」，整个网页存成一个断网也能打开的 .html，Captae 开着就放进素材库（新的「网页」分段）。
  - 复刻整站：右键「复刻整站…」，把网页（可以连同最多 30 个同站网页）打开时的每个请求录下来，以后在你的电脑上回放，原网站的脚本照样运行。录的时候浏览器顶上会出现「正在调试」的提示（插件新加了 debugger 权限，只用在 Captae 自己开的录制窗口上）。
  - 用 AI 复刻成可改的工程：电脑上装着 magpie 时，可以让 magpie 里的模型照复刻下来的网页写一份 HTML / CSS 工程，用的是 magpie 里的额度。
  - 素材库分类：「用 AI 整理」把素材分成最多 8 类，先给你看结果，确认了才写进去；侧栏、筛选、详情、多选都能按分类看和改。用你自己的模型和密钥（设置里原来的「字幕翻译」改成了共用的「AI 模型」），密钥单独存在本机、界面读不到。AI 助手也能按分类查。
  - 应用内更新：macOS、Windows、Linux（deb 和 AppImage）。更新包用 minisign 签名、签名里带版本号；有下载在进行时，重新打开后接着下。设置 › 关于 Captae 里可以关掉自动下载。
  - 其他：抖音视频改由 Captae 在看不见的网页里读（附带的 yt-dlp 读不了）；X 长文嵌在帖子里时也能存成 Markdown；Windows 上 captae.exe 有了版本号。
  - Native-looking Download buttons: on YouTube, X, RedNote, Bilibili, TikTok, Douyin, Instagram and Facebook, the Download button sits in the site's own row of buttons (next to Like and Share), and in a feed each post's button downloads that post's video. When Captae can't tell which post a video belongs to, it doesn't download and says why.
    RedNote image posts and X image posts download as original images. For videos with subtitles, the menu can download just the subtitles (SRT), and translate them into your interface language if you've set up an AI model.
  - Save web pages: right-click and choose “Save this page” to save the whole page as one .html file that opens offline. When Captae is open it goes into the Library (new “Web” tab).
  - Clone sites: right-click and choose “Clone site…” to record every request a page makes (optionally with up to 30 linked pages on the same site) and replay it later on your computer with the site's own scripts running. While recording, the browser shows a “debugging” notice (the extension now asks for the debugger permission, used only on the recording window Captae opens).
  - Rebuild with AI as an editable project: if magpie is installed, a model in magpie can rewrite a cloned page as an HTML / CSS project, using your magpie quota.
  - Library categories: “Organize with AI” sorts your items into up to 8 categories and shows you the result before anything is saved. The sidebar, filters, details and multi-select all work with categories. It uses your own model and key (the old “Subtitle translation” setting is now a shared “AI model”); the key is stored separately on your computer and the interface can't read it. AI assistants can filter by category too.
  - In-app updates on macOS, Windows and Linux (deb and AppImage). Updates are signed with minisign, with the version inside the signature. Downloads in progress continue after the relaunch. You can turn off automatic downloads in Settings › About Captae.
  - Also: Douyin videos are now read by Captae in a hidden web view (the bundled yt-dlp can't read them); X articles embedded in posts can be saved as Markdown; captae.exe on Windows now carries a version number.
  已知情况 / Known issues
  - 只有 X 会拿两处来源的编号互相核对；TikTok、抖音、Facebook Reels 的编号取自视频本身；YouTube、B 站、小红书、Instagram 信息流按网址和帖子里的链接认帖子。刚滑到下一条时按钮可能先显示「认不出」，停一下再点。
  - 右键菜单和工具栏面板里的「发给 AI」遇到一条帖子里有几个视频时，不核对是哪一个（网页上的按钮会）。
  - 复刻整站：收尾没放进素材库时，重试按钮只在原来那个标签页里，标签页关了就要重录（录到的一天后自动删）；回放不了 WebSocket、别的网站的 iframe、没下完的视频和超过 50 MB 的视频。
  - 存网页存不下还没滚到的内容、无限滚动的下半截和关着的 Shadow DOM。
  - 抖音要 Captae 开着才读得到；命令行、AI 助手在 Captae 没开时读不了。
  - Linux deb 版装更新时要输入密码，点「取消」就不装；AppImage 放在不能写的文件夹里时不能自动更新。
  - 界面有 8 种语言，简体中文以外都是 AI 翻译的，欢迎纠正。浏览器插件没上架商店，要在开发者模式里加载。网站改版后附带的 yt-dlp 可能暂时读不了（yt-dlp 每天自动检查更新）。不做 DRM。Intel Mac、ARM 版 Windows / Linux 暂时没有安装包。
  - Only X checks the video against two independent IDs. TikTok, Douyin and Facebook Reels take the ID from the video itself; YouTube, Bilibili, RedNote and the Instagram feed identify the post from the address and the post's links. Right after you scroll to the next item the button may say it can't tell which post it is; wait a moment and try again.
  - Send to AI from the right-click menu or the toolbar panel doesn't check which video it is when a post has several (the in-page button does).
  - Clone sites: if the clone couldn't be added to the Library at the end, the retry button is only in the original tab; once that tab is closed you need to record again (the recording is deleted after a day). Replay can't do WebSockets, iframes from other sites, videos that weren't fully loaded, or videos over 50 MB.
  - Saved pages don't include content you haven't scrolled to, the rest of infinite feeds, or closed Shadow DOM.
  - Douyin only works while Captae is open; the command line and AI assistants can't read it when Captae isn't running.
  - Installing an update on Linux (deb) asks for your password; Cancel means it isn't installed. An AppImage in a folder you can't write to can't update itself.
  - The UI comes in 8 languages; all but Simplified Chinese are AI translations, and corrections are welcome. The browser extension isn't in any store yet; load it in developer mode. After a site changes, the bundled yt-dlp may fail for a while (it checks for updates daily). No DRM. No builds yet for Intel Macs or ARM Windows / Linux.
