ShortDescription: Shows the sound your PC is playing as a glow along the screen edges, with its direction, loudness and type, for deaf and hard-of-hearing people.
Description: |-
  SoundVisualizer is an open-source accessibility app for deaf and hard-of-hearing people.
  It captures the audio your PC is playing (WASAPI loopback) and draws it as a click-through glow along the edges of the screen, on top of videos, music and games.
  The side a sound comes from grows (front and back too with 5.1/7.1 output), louder sounds are drawn bigger, and an on-device AI model colors each sound as ambient, human sounds or danger.
  It runs offline and needs no account. F2/F3 switch modes and F4 opens an editor to fit the drawing area to your screen. 18 languages.
