PackageIdentifier: SOVIS.SoundVisualizer
PackageVersion: 2.1.1
PackageLocale: ko-KR
Publisher: SOVIS
PublisherUrl: https://sovis-team.github.io/
PackageName: SoundVisualizer
ShortDescription: 컴퓨터에서 나는 소리의 방향·세기·종류를 화면 테두리에 그려 보여 주는, 농인 및 청각장애인을 위한 접근성 앱입니다.
Description: |-
  SoundVisualizer는 농인 및 청각장애인을 위한 오픈소스 접근성 앱입니다.
  컴퓨터에서 재생되는 소리를 받아 영상, 음악, 게임 위에 마우스가 통과하는 빛으로 화면 테두리에 그립니다.
  소리가 나는 쪽이 더 크게 빛나고(5.1·7.1 소리면 앞뒤까지), 큰 소리는 더 크게 그려지며, 기기 안의 AI가 소리를 환경음·사람 소리·위협음으로 나눠 색을 바꿉니다.
  인터넷 연결과 회원가입 없이 동작합니다. F2·F3으로 모드를 바꾸고 F4로 그리는 영역을 화면에 맞춥니다. 18개 언어를 지원합니다.
Tags:
- 접근성
- 청각장애
- 난청
