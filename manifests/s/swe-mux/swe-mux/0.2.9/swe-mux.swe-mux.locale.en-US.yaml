ShortDescription: Run your coding agents together. Know which ones need you.
Description: |-
  swe-mux is a terminal multiplexer for coding agents. It runs Claude Code, Codex, opencode, pi or any shell in real terminals on your own machine, under your own subscriptions.
  Agent sessions show whether they are working, done, or waiting on you. Sessions, notes, files and dev-server previews go in tabs and panes, with tmux, VS Code, Vim or Emacs shortcuts.
  The same live sessions open on your phone over your own Tailscale network: the terminal, git diff review, files, previews and push notifications. A separate supervisor process owns the terminals, so sessions survive the app restarting or updating.
  There is no account, no relay and no telemetry.
