ShortDescription: Open-source Windows browser built around Spaces and a sidebar.
Description: |-
  Sol is an open-source browser for Windows built around Spaces and a sidebar. Each Space keeps its own tabs, icon and theme, while Favorites, folders and pinned tabs hold what stays and Today gives everything else a place with automatic archiving.
  Split View gives two pages room in the same window, Link Peek opens links in a preview above the page, and Little Sol opens a link in a small window of its own from Sol or from any app. A command bar reaches the web, open tabs and history, and profiles keep logins, history and extensions separate.
  Sol combines a native C++ host with a maintained CEF fork of Chromium, supports Chrome extensions, and imports data from Chrome, Edge, Arc and Zen. It requires no account and sends nothing to a sync server; installed copies check for updates themselves.
