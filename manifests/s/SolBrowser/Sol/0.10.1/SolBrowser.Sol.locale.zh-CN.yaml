PackageIdentifier: SolBrowser.Sol
PackageVersion: 0.10.1
PackageLocale: zh-CN
ShortDescription: 以空间和侧边栏为核心的开源 Windows 浏览器。
Description: |-
  Sol 是一款以空间和侧边栏为核心构建的开源 Windows 浏览器。每个空间都拥有自己的标签页、图标和主题；收藏、文件夹和固定的标签页安放常驻内容，而“今天”则为其余所有标签页提供位置并自动归档。
  分屏视图让两个页面在同一窗口中各得其所；Link Peek（链接快速预览）会在当前页面上方打开预览；Little Sol 则可以在 Sol 或任何应用中，把链接在一个专属小窗口中打开。命令栏直达网页、已打开的标签页和历史记录；多个配置文件让登录状态、历史和扩展程序彼此隔离。
  Sol 将原生 C++ 宿主与持续维护的 Chromium CEF 分支相结合，支持 Chrome 扩展程序，并可从 Chrome、Edge、Arc 和 Zen 导入数据。它不需要账户，也不向同步服务器发送任何内容；已安装的副本会自行检查更新。
