ShortDescription: Local, offline semantic code search with an MCP server for coding agents
Description: |-
  ripsem finds the code that does something, asked with an identifier, an error message or a plain description of the behaviour.
  It merges BM25 over code-aware tokens with vector similarity from a local embedding model, returns whole functions and types named after their declaration, and serves the same search to coding agents over MCP.
  Everything runs offline once the model is downloaded.
