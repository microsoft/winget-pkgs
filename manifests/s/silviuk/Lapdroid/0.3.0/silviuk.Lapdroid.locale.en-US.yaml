ShortDescription: Turn your laptop into a Bluetooth keyboard, trackpad & stylus for Android phones & tablets
Description: |-
  Lapdroid is an ultra-low latency Bluetooth input bridge that turns your Windows
  laptop keyboard, touchpad, and active stylus into a high-precision input device
  for Android phones and tablets.
  Operates completely offline over pure Bluetooth RFCOMM without Wi-Fi or local network
  access required. Includes international keyboard layout synchronization, text selection,
  media controls, cursor overlay, and custom hotkeys.
