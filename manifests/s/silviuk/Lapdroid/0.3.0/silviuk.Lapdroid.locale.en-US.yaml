ReleaseNotes: |-
  What's New in Lapdroid v0.3.0:
  - Full Keyboard Keycode Coverage: All alphanumeric keys, F1-F12, full numpad, Insert, Caps/Num/Scroll Lock, Pause.
  - Accurate International Layouts & Modifier Sync: Low-level hook keyboard state directly via GetAsyncKeyState and GetKeyState for Shift, AltGr, Control, Caps Lock.
  - Tricky Keys & Text Editing Shortcuts: Windows Ctrl shortcuts (Ctrl+A, Ctrl+C, Ctrl+V, Ctrl+X, Ctrl+Z, Ctrl+Y, Ctrl+Backspace/Delete word deletion, Ctrl+Left/Right word jumps).
  - Shift Text Selection: Shift+Arrows and Shift+Home/End expand and shrink selection ranges.
  - Dedicated Android Settings: Configurable Enter Key modes (Smart, Always Newline, Always Submit), Tab navigation modes, Super/Win key actions.
  - Optional Direct Input Keyboard IME: For terminal emulators (Termux) and games requiring direct keycode injection.
  - Audio & Media Controls: Dedicated volume (Vol+, Vol-, Mute) and playback (Play/Pause, Next, Prev, Stop) controls.
  - Unified Brand App Icon & Live Diagnostic Logging on both Windows and Android.
