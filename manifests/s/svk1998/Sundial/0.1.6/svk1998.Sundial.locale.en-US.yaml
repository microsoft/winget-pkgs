ShortDescription: Tracks how long you're actually at your Windows PC each day.
Description: |-
  Sundial is a small tray app that counts your real time at the PC each day. Time counts only while the session is unlocked and you've used the keyboard or mouse in the last 5 minutes; locking, sleeping, or walking away pauses it.
  A floating widget shows today's total, and clicking it opens yesterday, this week, a daily average, a 7-day chart, and your history. Light and dark themes (or match Windows) and three widget sizes.
  Local only: no account and no network connections. Data stays in one JSON file in %APPDATA%\Sundial.
