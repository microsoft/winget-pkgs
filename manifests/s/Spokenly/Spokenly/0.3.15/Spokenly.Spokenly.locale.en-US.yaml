ShortDescription: Free speech to text for Windows with local and cloud dictation, AI text processing, and support for 100+ languages.
Description: |-
  Spokenly for Windows is a dictation app with local and cloud speech to text, AI text processing, and support for 100+ languages.
  It offers local models (Whisper, Parakeet) and cloud models (Deepgram, OpenAI, Soniox, ElevenLabs), real-time streaming and file-based transcription, bring-your-own API keys from 11 providers at zero cost, AI text processing with modes and AI Instructions (GPT-4, Claude, Gemini, Grok, local LLMs via Ollama), a global hotkey with recording overlay and system-wide text insertion, and auto-updates from inside the app. Local models and your own API keys are free with no account required.
