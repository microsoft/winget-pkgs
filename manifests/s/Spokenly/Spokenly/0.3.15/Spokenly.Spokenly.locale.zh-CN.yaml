ShortDescription: Windows 上的免费语音转文字应用，支持本地与云端听写、AI 文本处理，以及 100 多种语言。
Description: |-
  Spokenly for Windows 是一款听写应用，提供本地与云端的语音转文字、AI 文本处理，并支持 100 多种语言。
  它支持本地模型（Whisper、Parakeet）与云端模型（Deepgram、OpenAI、Soniox、ElevenLabs），实时流式与文件转录，可自带 11 家服务商的 API key 且零成本使用，支持带模式与 AI 指令的 AI 文本处理（GPT-4、Claude、Gemini、Grok、Ollama 本地大模型），提供全局热键、录音悬浮窗与系统级文本插入，并支持应用内自动更新。使用本地模型或自带 API key 完全免费，无需注册账号。
