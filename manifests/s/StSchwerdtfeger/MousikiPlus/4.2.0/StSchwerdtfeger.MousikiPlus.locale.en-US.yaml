ShortDescription: Terminal music player and internet radio with oscilloscope, spectrogram, synced lyrics, karaoke and a phone remote.
Description: |-
  Mousiki Plus is a keyboard-driven terminal (TUI) music player and internet radio in one program,
  based on Mousiki v1.0 by itzender5820. It plays local files and YouTube, SoundCloud and Bandcamp
  streams, and has an Audacity-style spectrogram, an XY oscilloscope (also in its own GPU window),
  synced lyrics with a karaoke mode, a 10-band equalizer, playlists, a tag editor with AcoustID lookup
  a listening history and a remote control from your phone or the command line. The radio has presets, Radio Browser search, timeshift and recording.
  Use Windows Terminal.
