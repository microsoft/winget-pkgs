ReleaseNotes: |-
  Camera backgrounds: put an image, a solid color or a looping video behind your green-screened webcam.
  Reduce background noise: one click removes fan, hum and keyboard noise from your mic.
  OBS Virtual Camera can be picked as a webcam.
  Custom destinations can set the bitrate and keyframe interval their server asks for.
  Security: a stream key pasted into a server URL is no longer saved to disk, and keys are masked in errors and the log.
  A blocked microphone no longer loses the recording, and Stop no longer hangs on a stalled destination.
