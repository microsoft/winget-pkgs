ShortDescription: Record your screen and go live, without the setup.
Description: |-
  FastCast is a lightweight Windows screen recorder and live streaming app. Pick a monitor or a single window, your mic and desktop audio, and an optional webcam, then press Start recording. It saves H.264 MP4 files, keeps the last 30 seconds to 5 minutes in memory for Instant Replay (Ctrl+Alt+F8), has a built-in green screen with image, color or video backgrounds, and streams to YouTube, Twitch, Kick or any RTMP/RTMPS server.
  FastCast Free records and streams at 1080p60. A one-time Pro license adds 1440p and 4K, 120 fps, multistreaming and advanced encoder controls. No account, watermark or telemetry.
