ReleaseNotes: |-
  重构
  - 将原有内置音源、流媒体的设计，重构为插件化设计，用户可自行编写插件来支持更多音源；
  - 新增大量的文档，对 vibe coding 更加友好；
  新增
  - 新增：macOS 原生 tray、touchbar 歌词高亮、滚动功能；
  - 新增：对 cue 类型歌曲的支持；
  - 新增：本地歌单歌曲的排序功能；
  - 新增：下一首歌曲的封面、歌词预加载；
  修复
  - 修复：桌面歌词阴影颜色配置不生效 by @pyreymo in https://github.com/stark81/VutronMusic/pull/378；
  - 修复：windows 版本 smtc 未上报歌曲进度，导致第三方歌词增强软件无法使用的 bug；
  - 修复：issue #416 报告的安全性问题；
  - 修复：桌面歌词窗口无法响应鼠标移出的 bug；
  - 修复：扫描音乐后缀敏感导而导致的扫描不全问题；
  贡献者
  - @pyreymo made their first contribution in https://github.com/stark81/VutronMusic/pull/378
  - @xgkk made their first contribution in https://github.com/stark81/VutronMusic/pull/388
