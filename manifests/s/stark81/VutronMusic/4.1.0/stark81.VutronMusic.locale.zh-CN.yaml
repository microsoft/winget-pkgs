ReleaseNotes: |-
  v4.0.0 之后的维护版本：集中修复 4.0 重构带来的回归（登录、搜索、本地扫描、自动缓存、低分辨率显示），把 Lottie 背景切换到 GPU 渲染，并修正自动更新与 Linux 桌面图标的打包问题。
  新增
  1. 界面缩放（设置 → 通用设置）：100% / 90% / 80% / 75% / 67%。屏幕较小时（如 1024×600）可让界面完整显示，窗口最小尺寸同步按比例缩小，窗口也不会再跑到显示器工作区之外（#432）；
  2. 插件登录入口可见化：设置 → 音乐设置 → 插件管理里，插件卡片直接显示「登录 / 已登录」按钮；卡片折叠时也显示账号摘要（未登录时提示「N 个插件未登录 · 点击展开登录」）。
  3. 登录状态与错误提示：登录过程中显示「登录中…」，失败会明确提示（如「Cookie 无效或已过期」），不再静默无反应。
  改进
  1. Lottie 背景实现调整。
  2. 自动缓存：缓存工作线程改为按需启动/退出，支持 301/302 跳转、转发 UA、超时与文件完整性校验，元数据或封面写入失败时回退为原始音频，失败原因会回传日志（#427）。
  3. 升级体验：启动时检测到上次运行的版本低于 4.0.0，自动重置一次播放器状态并提示，之后不再干预播放列表与音量。
  4. 小窗口适配：侧栏在矮窗口下收紧间距、播放条在窄窗口下收窄内边距。
  修复
  1. 修复 Cookie 登录点了没反应（#424）的 bug；
  2. 修复了解灰音乐无法缓存的问题（#427）；
  3. 修复了搜索结果页二次搜索不刷新（#431）的 bug；
  4. 本地音乐扫描数量偏少 / 扫到却无法播放（用户反馈）：
  5. 修复了本地音乐无法自动匹配的 bug；；
  6. 修复了 Linux 任务栏多出一个空图标（#436）的问题；
  7. 修复了自动更新会推送错误版本的 bug。
