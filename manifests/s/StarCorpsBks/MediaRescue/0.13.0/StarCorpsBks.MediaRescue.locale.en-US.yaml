ShortDescription: Repairs damaged MP4, AVI, Matroska and MP3 files without touching the original.
# One line, deliberately: winget's YAML scanner refuses a folded block here, and a colon inside an
# unquoted scalar breaks it too. The long prose belongs in the README, not in this field.
Description: mediarescue repairs video and audio files that no longer play -- a missing index, a truncated tail, a damaged header. It writes a separate repaired copy, never modifies the original, and decodes the whole output to prove the repair worked, deleting a copy that fails that check instead of offering it as a fix.
