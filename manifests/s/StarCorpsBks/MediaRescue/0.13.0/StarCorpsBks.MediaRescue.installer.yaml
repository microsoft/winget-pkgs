# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json

# The installer facts the client acts on. Every value here mirrors packaging/mediarescue.iss:
# per-user install (PrivilegesRequired=lowest -> Scope: user), Inno Setup, x64 only.
# InstallerSha256 must be the digest GitHub publishes for that release asset; a mismatch is how a
# broken upload reaches users as "install failed" with no explanation.
PackageIdentifier: StarCorpsBks.MediaRescue
PackageVersion: 0.13.0
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART
UpgradeBehavior: install
AppsAndFeaturesEntries:
  - DisplayName: mediarescue
    Publisher: Star Corps bks
    DisplayVersion: 0.13.0
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/lutherrio25-svg/mediarescue/releases/download/v0.13.0/mediarescue-0.13.0-setup.exe
    InstallerSha256: C39247651602FF2BFD5556B768AC14BD579DFA3C0928E752F242957BD5A6B082
ManifestType: installer
ManifestVersion: 1.28.0
