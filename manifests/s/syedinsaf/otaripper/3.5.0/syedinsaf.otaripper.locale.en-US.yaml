ReleaseNotes: |-
  What's New in v3.5.0
  The Payload Safety Hardening & CLI Aesthetics update. v3.5.0 focuses on deep safety hardening for remote OTA HTTP streaming, arithmetic overflow protection, negative seek underflow defenses, updated dependencies, and a completely redesigned CLI help interface with color-coded syntax highlighting.
  Highlights
  - Checked Arithmetic & Overflow Protection: Implemented checked_add calculations for payload data offsets to eliminate integer overflow risks when parsing remote OTA payloads.
  - Hardened HTTP Remote Stream Validation: Added strict validation for Payload::parse_remote magic bytes (CrAU), manifest offsets, header bounds, and signature sizes against corrupted HTTP streams.
  - Negative Seek Underflow Defenses: Hardened CachingHttpReader remote Seek implementations with checked bounds to prevent negative seek underflows (i64 underflow protection).
  - Automated Test Suite Expansion: Added comprehensive unit tests covering remote payload header parsing, short input handling, invalid magic bytes, and stream seeking behavior.
  - Revamped CLI Help & Terminal Aesthetics: Redesigned FRIENDLY_HELP interface with color-coded syntax highlighting (otaripper in cyan, options/subcommands in yellow, arguments in bright white), structured section hierarchy (▸ QUICK START, ▸ COMMON TASKS, etc.), pixel-perfect column alignment, and zero emojis.
  - Toolchain & Dependency Refresh: MSRV upgraded to Rust 1.98.1 alongside updated core dependencies (clap 4.6.7, anyhow, serde, console, indicatif, memmap2, crossbeam-channel, liblzma).
  What's Changed
  - feat(payload): payload safety hardening, remote seek bounds checking, and overflow protection (#51)
  - refactor(cmd): redesign FRIENDLY_HELP interface layout, color palette, syntax highlighting, and column alignment
  - test(payload): add unit tests for remote payload parsing and HTTP seek bounds
  - build(deps): bump dependencies in Cargo.toml & Cargo.lock (#49, #50, #51)
