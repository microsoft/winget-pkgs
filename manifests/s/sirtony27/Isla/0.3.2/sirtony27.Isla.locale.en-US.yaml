ShortDescription: "A tiny native notch for Windows: now playing, volume, water, focus timer and system alerts."
Description: |-
  A tiny native notch for the top of your Windows screen. It shows what's playing and the things your PC wants to tell you, then gets out of the way.
  Now playing from any player (Spotify, browsers, Apple Music) with controls and optional synced lyrics from LRCLIB, volume and brightness alerts, audio output and battery alerts, a microphone and camera indicator, a Pomodoro timer and a water reminder.
  A single portable exe with no runtime dependencies, built to sit at 0% CPU when idle.
