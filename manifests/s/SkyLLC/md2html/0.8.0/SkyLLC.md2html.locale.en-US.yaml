ShortDescription: Markdown in, one complete web page out
Description: |-
  md2html turns Markdown into one self-contained HTML page that brings its own
  outline, search, light and dark themes, glossary, footnotes, coloured code,
  typeset maths and diagrams, in seventeen languages, and loads nothing from
  the network. It also writes EPUB 3, and PDF with an installed Chrome,
  Chromium or Edge. One Rust program with nothing beyond the standard library.
