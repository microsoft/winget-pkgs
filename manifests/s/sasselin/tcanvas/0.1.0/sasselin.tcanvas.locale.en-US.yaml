ShortDescription: WSL terminals as cards on an infinite canvas.
Description: |-
  tcanvas shows your WSL terminals as cards on an infinite canvas. Every card is a tmux session
  inside WSL, so terminals keep running when the app is closed. Group them by project, link a
  group to a folder to watch its changed files and diffs live, and get notified when a terminal
  is stalled, waiting for input or done. Requires WSL with a Linux distribution and tmux.
