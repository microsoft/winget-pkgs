ShortDescription: Clone physical disks on Windows while preserving bootability.
Description: A minimal native C++ CLI utility for cloning physical disks on Windows while preserving bootability, built exclusively on inbox Microsoft APIs. The running system disk is snapshotted with VSS and copied consistently, NTFS volumes copy only allocated clusters, and both GPT/UEFI and MBR/BIOS disks stay bootable. Requires an elevated prompt.
