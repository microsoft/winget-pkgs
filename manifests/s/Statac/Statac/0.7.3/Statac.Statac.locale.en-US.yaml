ShortDescription: A friendlier static site generator.
Description: |-
  Statac makes a website from a folder of Markdown. You write pages in Markdown, choose how they look with templates, and run statac build. It writes a site of plain files, ready to put on any web host.
  When something in the site is wrong, it shows the file, the line and the exact text, and links to a page about that kind of problem.
  It is one program in one file, with no plugins and nothing else to install beside it.
