ShortDescription: The friendly static site generator.
Description: |-
  Statac makes a website from a folder of writing. You write pages in Markdown, choose how they look with templates, and run statac build.
  When something in the site is wrong, it shows the file, the line and the exact text, and links to a page about that kind of problem.
  It is one program in one file, with no plugins.
