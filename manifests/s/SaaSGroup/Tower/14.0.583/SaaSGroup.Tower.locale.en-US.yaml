ReleaseNotes: |-
  New
  Branch Review: Review all local branches against a selected base branch in a dedicated workspace, with ahead/behind counts, merge status, pull request details, filters, inline changes, and branch actions. Fully Merged Detection: Tower now detects branches merged through Git ancestry and merge commits—and, in Tower Pro, through merged pull requests—reliably catching squash and rebase merges that Git ancestry alone can miss. Fully Merged Hints: Branch hints now explain why Tower considers a branch merged, with direct links to supporting evidence and a “Don’t Show Again” option. Title Bar: License and update notices now appear in the window title bar, keeping the toolbar focused on repository actions. App Icon: Tower now uses an updated app icon. Working Copy: Diffs now include a footer with a change summary, context-line controls, an option to hide whitespace-only changes, and an option to display the complete file.
  Improved
  Services: Improved service account refreshes for a more responsive experience. Sidebar: The Branches group context menu now more closely matches Tower for Mac, including direct branch-creation actions. View Customization: Customize the sidebar, History, and diff views with options for branch and tag display, remote-branch filters, stash counts, and diff context lines. Bundled Git: Updated Git for Windows to version 2.55.0.5.
  Fixed
  Bitbucket: Fixed OAuth account refreshes, cloning, fetching, and pushing failing when newer Bitbucket tokens exceeded the Windows Credential Manager size limit. Services: Fixed crashes while refreshing service repository lists and when Azure DevOps returns incomplete pull request data. Diff View: Fixed newly staged files sometimes opening with their first lines cut off. Graphite: Graphite branches with a parent now offer the “Unset Parent Branch” quick action. Trial Registration: Tower now shows the available next steps when a trial has expired instead of leaving registration stuck.
