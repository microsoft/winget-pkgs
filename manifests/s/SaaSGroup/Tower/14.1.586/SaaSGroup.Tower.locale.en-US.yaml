ReleaseNotes: |-
  New
  History: Selecting several commits now shows their combined diff in the detail pane as one changeset across the whole selection, with expandable inline diffs. Review a range of work without stepping through each commit individually. Services: Tower now supports Forgejo and Codeberg accounts. Connect to codeberg.org or your own Forgejo instance to browse, clone, and create repositories. SSH key management is available for Forgejo and Codeberg accounts. Worktrees: Added "Repair Worktree…" for worktrees whose folder was moved. Pick the new location, and Tower reconnects the worktree to its repository and reloads its branches.
  Improved
  Git for Windows: Added support for Git for Windows 2.56. Pro Trial: The title bar badge now shows the remaining days in your Pro trial, includes its expiration date in a tooltip, and can be hidden via View > Hide Pro Trial Badge. Pro Trial: Pro badges now remain visible on Pro features throughout the trial, so you always know which features are part of Tower Pro. Upgrade to Pro: The upgrade window now shows your active Pro trial and its remaining days, instead of saying that a trial will be available again later. Workflows: The Start and Finish actions for topic branches are now available on every plan. Blame: An open Blame window now follows new commits and branch switches. Failed blame operations now show an error instead of an empty window. Git: You can now skip a bundled Git update permanently.The startup dialog includes a "Skip This Version" button, while "Not Now" asks again on the next start. Tower will ask again when a later update includes a newer Git version.
  Fixed
  Repositories: A repository created from the “Create Repository” offer now opens immediately instead of only being added to the sidebar. Pull Requests: Fixed a crash in GitHub repositories with more than 100 open pull requests. GitLab now also lists all open pull requests. Pull Requests: Fixed a stale “conflicts must be resolved” banner that could persist after a fetch. The “behind” count for Update Branch now also remains correct after the branch moves. Worktrees: Fixed a crash when right-clicking a broken worktree in the sidebar. Worktrees: Fixed a crash when opening a worktree whose folder was deleted or whose main repository was moved. Working Copy: Fixed a crash when discarding local changes that include a staged rename. Working Copy: Fixed a crash while rebasing when a step removed a submodule. History: Fixed a crash when opening the diff tool with no commit selected. Clone: Fixed the second line of each entry in the Cloned Remote Repositories popup being cut off. Command Line: Tower.exe -o now offers to create a repository when the specified folder is not one. It also reuses an already open repository instead of opening it twice. Stability: Fixed crashes that could occur while cloning or removing a repository, shortly after launch, or while Tower redrew its icons. Graphite: Fixed an empty, disabled "Parent Branch" submenu showing for branches Graphite does not track.
