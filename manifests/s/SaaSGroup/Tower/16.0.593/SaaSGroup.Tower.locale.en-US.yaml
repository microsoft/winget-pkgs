ReleaseNotes: |-
  New
  AI Commit Messages: Generate commit messages from your staged changes using an installed AI coding agent, such as Claude Code, OpenAI Codex, or Gemini CLI. You can also rephrase messages and create custom prompts for each repository. Set it up in Preferences → AI. No additional API key required, and Tower detects newly installed agents automatically, even while running. Available with all plans. Blame: Blame now opens directly inside the repository window instead of a separate window. The updated view includes line numbers, syntax highlighting, and annotations for each change. You can also switch between files and revisions directly from the header and see who contributed to the file. Blame: You can now use “Show Blame” in the combined diff when multiple commits are selected.
  Improved
  History: Commit history now loads much faster, especially in repositories with signed commits. Tower only checks signatures for commits currently visible on screen. History: After importing or trusting a GPG key, commit signatures now update without requiring a restart. Diff View: When “Show invisible characters” is enabled, tabs are now displayed as arrows spanning their full width, making them easier to distinguish from spaces. Working Copy: The commit templates button has moved to the bar below the commit message. Working Copy: Tower now remembers a pinned commit body after a restart, and the pin applies to all open repositories.
  Fixed
  Fixed a crash that could occur when quitting Tower. Diff View: Page Up and Page Down now scroll the entire diff instead of moving the cursor within a single chunk. History: Fixed an issue where the commit list would not load when the Git setting log.showSignature was enabled. History: Fixed an issue where commit history could stop loading prematurely if a page failed to load. Bitbucket: Remotes using Bitbucket’s new SSH hosts, ssh.bitbucket.org and altssh.bitbucket.org, are now correctly linked to your Bitbucket account and its pull requests. Pull Requests: Bitbucket Cloud pull requests now display the author’s name instead of an empty “by” field. Pull Requests: You can now edit and delete your own pull request comments on Bitbucket, as well as reply to any comment. Edit and Delete options appear only for comments you’ve written and use the account that originally posted them. Services: Fixed sign-in errors that could occur when browser authentication attempts overlapped, were cancelled, or returned results from an earlier attempt. Services: Fixed an issue where Tower could fail to recognize GitHub, Azure DevOps, and other service remotes when Windows was set to Turkish. Azure DevOps Server: Fixed an issue where the collection name could be added twice to the server address. Preferences: Improved the appearance of disabled options in drop-down menus and checkboxes.
