ShortDescription: Record a browser bug with your voice and get a task with the steps, network errors and a replay that a coding agent can reproduce.
Description: |-
  Sirv Lens records a browser session with your voice. Press Record in the Lens side panel and use the site as usual while you talk. Lens keeps your clicks, keys and page changes, the network and the console, and writes down your words on your computer. Press Stop to review the recording, cut and annotate it, then file it as a task or hand it to a coding agent such as Claude Code or Codex.
  Lens needs its browser extension for Chrome, Edge, Brave or Firefox; the app brings it and shows how to add it.
