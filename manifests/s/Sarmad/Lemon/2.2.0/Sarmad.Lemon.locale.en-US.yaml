ShortDescription: "Chat and code with local AI models through Ollama, entirely on your own PC."
Description: |-
  Lemon (Local AI Chat) is a lightweight Windows desktop app for chatting and coding with AI models that run entirely on your own PC through Ollama.
  It is a single portable exe with its own window and an Arabic and English interface, with no cloud services, accounts or telemetry.
  Custom assistants can answer only from your own files (PDF, text, code) and notes and show their sources, using a local multilingual embedding model.
  HTML, JavaScript and SVG code can run in a live preview inside the app.
  Requires Ollama (https://ollama.com) installed and running.
