ShortDescription: "Write amounts in words for cheques and invoices in Arabic, English and French, offline."
Description: |-
  InstaWords writes amounts in words (tafqit) for cheques, invoices and accounting documents, in Arabic, English and French.
  It handles masculine/feminine agreement, dual and plural forms, currency subunits with any power-of-ten ratio, Arabic-Indic, Persian and Western digits, and exact numbers up to 999 trillion.
  About 40 currencies and units, optional prefix and suffix, bulk conversion and CSV import/export. Works fully offline.
