ReleaseNotes: |-
  Features
  - Add support for alternative performance metrics (peak memory usage, instructions, CPU cycles, cache misses, branch misses).
  - Add --env to set environment variables even without an intermediate shell.
  - The plotting and analysis scripts now support different metrics as well.
  Breaking changes
  - Benchmarked commands are now executed directly by default, without an intermediate shell (--shell=none). Use -S to restore previous behavior.
  - Always run --setup, --prepare, --conclude, and --cleanup commands in a shell.
  - The JSON format for --export-json has changed (schema version 2).
  - --time-unit/-u has been removed in favor of --metrics METRIC[:UNIT].
  - --sort has been removed.
  - --reference and --reference-name have been removed. The first command is always considered as the reference command.
