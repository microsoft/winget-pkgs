ShortDescription: Open-source Windows 10/11 CD/DVD/Blu-ray burner, DVD-Video authorer, and unfinalized DVD recovery tool.
Description: CDBurner10 is a 100% open-source (GPL-3.0), zero-adware optical disc burning and recovery utility for Windows 10/11 built with .NET 10 and WinUI 3 (Mica + native Dark Mode). Features data/ISO burning, MP4/MKV to DVD-Video authoring with subtitles, unfinalized DVD recovery, Audio CD burning (TAO/SAO/DAO-96 + CD-Text), and legacy .dxp/.axp and cdbxpcmd CLI compatibility.
