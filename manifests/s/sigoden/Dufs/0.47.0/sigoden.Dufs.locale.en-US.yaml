ReleaseNotes: |-
  Features
  - Conditionally include default IPv6 addr (#721)
  - Webui better uploaders (#749)
  - Support HEAD requests for embedded assets and health check (#750)
  - Render placeholders in custom 404 page (#752)
  - Preserve directory entries and metadata when zipping a directory (#760)
  Bug Fixes
  - Liblzma dynamic linking issues on MacOS (#712)
  - Guard_root_contained walks up to existing ancestor for non-existent paths (#716)
  - Return response after forbid status (#722)
  - Require path separator boundary when stripping --path-prefix (#725)
  - Clamp range last-pos to EOF per RFC 9110 (#738)
  - Keep directories grouped on top when sorting in descending order (#732)
  - Enhance security (#753)
  - Close path ACL bypass via filesystem name aliases (#754)
  - Serve HTML/SVG/XML files inline again (#759)
  - Bind unix socket address only once (#761)
  - Don't set SO_REUSEADDR on Windows (#762)
  - Eliminate panics that could abort the server (#764)
  Refactor
  - Handle unspecified ip addrs in check_addrs (#708)
  - Webui add css color variables (#710)
  - Replace async-zip with async-deflate-zip (#720)
  - Upgrade async-deflate-zip to v0.2.0 (#723)
  - Improve server port selection (#748)
  - Send title-case HTTP/1 response header names (#751)
  - Reduce release binary size (#763)
  Full Changelog: https://github.com/sigoden/dufs/compare/v0.46.0...v0.47.0
