ShortDescription: Free, open-source download manager with multi-connection downloads, pause/resume, scheduler and browser integration.
Description: Nexonic Download Manager splits each file into up to 32 parallel connections, pauses and resumes downloads even after a restart, refreshes expired links, and catches downloads from Chrome, Edge, Brave and Firefox. It includes queues and a scheduler, batch downloads, a site grabber, speed limits, proxy support, checksum checks, an ndm command-line tool and saving of streamed video.
