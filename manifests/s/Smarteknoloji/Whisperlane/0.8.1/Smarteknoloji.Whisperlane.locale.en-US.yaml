ShortDescription: Hold a key, talk, and it is typed - local-first dictation for Windows.
Description: |-
  whisperlane is a free, open source dictation tool for Windows. Hold a key,
  speak, release, and the transcribed words appear where the caret already is:
  an editor, a terminal, or a coding agent running inside one.

  Transcription runs on the machine, on the GPU where one is available - CUDA,
  Vulkan for AMD and Intel, CPU as the fallback. There is no account, no sync,
  and the words are never sent anywhere. Speech models are downloaded when the
  user asks for them.
