ShortDescription: A notch toolkit for Windows. An island at the top of the screen for AI coding agents, media and system tools.
Description: |-
  Lintel adds a small island that stays hidden at the top edge of the screen and slides out when you point at it or when something needs you.
  It shows the sessions of AI coding agents and lets you answer their permission requests with a click, and it carries chat, media controls, a clipboard history, system monitoring, screenshots, screen recording and an optional local voice assistant.
  It has a Rust core with a web view interface, no telemetry and no account, and every feature can be switched off.
