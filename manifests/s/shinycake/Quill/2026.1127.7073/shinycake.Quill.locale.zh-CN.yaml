ShortDescription: 非官方开源 Telegram 桌面客户端，支持会话、群组、频道、媒体、通话与多账号。
Description: |-
  Quill 是一款免费、开源的 Telegram 桌面客户端，完全用 Rust 从零编写。你用普通的 Telegram 账号登录，就能看到自己真实的会话、群组、频道和通话。它通过 Telegram 自家的客户端库 TDLib 与服务器通信，整个界面都在 GPU 上绘制，内部不含任何浏览器引擎或 WebView。

  功能

  - 消息：加粗、斜体、代码、剧透、引用和链接。回复与引用回复、转发、定时发送与静默消息、云端草稿、会话内搜索、表情回应和投票。
  - 媒体：照片、视频、相册、GIF 和贴纸。可在应用内录制语音和视频消息并转写。全屏媒体查看器、音频播放条、链接预览和下载列表。
  - 通话：一对一语音和视频通话，支持屏幕共享，还有群组语音聊天。
  - 群组与频道：管理员工具、邀请链接、入群申请、论坛话题、评论，以及带增长曲线的统计。机器人支持键盘、内联结果和游戏。
  - 隐私与账号：秘密聊天、本地锁屏密码、活动会话管理和两步验证。可用手机验证码、二维码或密码登录，并在多个账号之间切换。
  - 你的设置：浅色与深色主题、自动夜间模式、强调色、聊天背景、文字大小，以及气泡或平铺消息布局。支持 tg:// 和 t.me 链接、托盘菜单和未读角标。

  隐私

  Quill 在你的电脑上运行，数据也留在本机。本地数据库用存放在 Windows DPAPI 中的密钥加密。Quill 没有自己的服务器，也没有数据统计。除 Telegram 之外，它只会访问 GitHub 来检查更新，这一项也能在设置里关掉。

  状态

  Quill 是一个独立项目，与 Telegram 无任何关联，也未获 Telegram 认可或赞助。它是尚处于测试阶段的实验性软件，按 MIT 许可证提供、不含任何担保，因此请保留一个官方 Telegram 应用。
