ReleaseNotes: |-
  新功能
  Quill 是一款非官方的 Telegram 客户端，目前仍处于测试阶段。
  更顺滑、更清晰
  - 鼠标滚轮的一格现在会像在浏览器里那样滑到目标位置，而不再是跳动。滚动距离保持不变。快速连续滚动会累加，反向一转会立刻停下，触控板和减弱动效的设置照旧可用（#1517）。由 @lowngly 在 #1507 中反馈。
  - 全屏查看器和照片故事里的照片现在按原始尺寸加载。此前，磁盘上已有较小副本时，它们可能一直显示模糊的缩略图（#1517）。由 @lowngly 在 #1507 中反馈。
  - 玻璃效果在每个像素上做的计算更少了。这在 Windows 和 Linux 的核显笔记本上提升最明显（#1517）。
  浮动、玻璃与紧凑
  - 在浮动布局下，搜索筛选标签、贴纸面板的标签页与搜索框，以及贴纸和 GIF 面板底部的分区标签都改为圆角，与周围的卡片一致（#1517）。
  - 浮动标题栏里的搜索按钮放在一个小胶囊上，任何聊天背景下都能看清（#1517）。
  - 开启玻璃效果时，或在经典布局下，搜索标签边缘不再出现彩色方块（#1517）。
  - 开启玻璃效果时，菜单被打开的那条会话会保留高亮（#1517）。
  尚未在真实硬件上验证
  - 这些改动经过测试、三个平台上的 CI 以及 macOS 上的离线演示验证。玻璃效果与滚动相关的改动没有在真实的 Windows 或 Linux 硬件上运行过，因此这两个平台上的 Quill 仍是实验性的。
