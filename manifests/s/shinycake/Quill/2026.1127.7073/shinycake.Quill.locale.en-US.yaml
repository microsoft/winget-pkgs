ShortDescription: Unofficial, open-source Telegram desktop client with chats, groups, channels, media, calls and several accounts.
Description: |-
  Quill is a free, open-source Telegram desktop client written from scratch in Rust. You sign in with your normal Telegram account and get your real chats, groups, channels and calls. It talks to Telegram through TDLib, Telegram's own client library, and draws its whole interface on the GPU, so there is no browser engine or web view inside.

  Features

  - Messages: bold, italic, code, spoilers, quotes and links. Replies and quote-replies, forwarding, scheduled and silent messages, cloud drafts, search inside a chat, reactions and polls.
  - Media: photos, videos, albums, GIFs and stickers. Voice and video messages recorded in the app, with transcription. A fullscreen media viewer, an audio player bar, link previews and a downloads list.
  - Calls: one-to-one audio and video calls with screen sharing, and group voice chats.
  - Groups and channels: admin tools, invite links, join requests, forum topics, comments, and statistics with growth charts. Bots with keyboards, inline results and games.
  - Privacy and accounts: secret chats, a local passcode lock, active-session management and two-step verification. Sign in with a phone code, a QR code or a password, and switch between several accounts.
  - Your setup: light and dark themes with automatic night mode, accent colors, chat wallpapers, text size, and bubble or plain message layouts. tg:// and t.me links, a tray menu and unread badges.

  Privacy

  Quill runs on your computer and keeps its data there. The local database is encrypted with a key held in the Windows DPAPI store. Quill has no server of its own and no analytics. Besides Telegram, it only contacts GitHub to check for updates, and you can turn that off in Settings.

  Status

  Quill is an independent project. It is not affiliated with, endorsed by, or sponsored by Telegram. It is early, experimental beta software provided under the MIT License without warranty of any kind, so keep an official Telegram app installed.
