ShortDescription: Sticky notes and serverless LAN messenger for Windows. Send notes to other PCs on the local network, encrypted with AES-256.
Description: |-
  ShixxNOTE puts sticky notes on your Windows desktop and sends them to other computers on your local network, with no server, no cloud and no internet needed.
  Notes can be sent to one PC or a whole group at once, and notes sent over the network or by e-mail can be encrypted with AES-256.
  It also has reminders and alarms, pictures in notes, themes, daily backups and an interface in fourteen languages.
  One licence covers every Windows PC in your home or office network. This package installs the fully functional 30-day trial.
