ShortDescription: 'See what''s on your local network: fast, zero-config device discovery and identification'
Description: lsnet finds every device on your local network and tells you what each one is (an Apple TV, a printer, a smart plug, a NAS) in about two seconds, with no configuration. It combines what devices announce about themselves (Bonjour, UPnP), web UI banners, open ports and MAC vendors into a type and a model, lists the services on the network, and prints a table or JSON for scripts. It isn't a port scanner or a security tool, and needs no Npcap or administrator rights.
