ShortDescription: 'See what''s on your local network: fast, zero-config device discovery and identification'
Description: lsnet finds every device on your local network and tells you what each one is (an Apple TV, a printer, a smart plug, a NAS) in about two seconds, with no configuration. It combines what devices announce about themselves (Bonjour, UPnP, SNMP, NetBIOS names), web UI banners, open ports and MAC vendors into a type and a model, alongside each device's IPv4 and IPv6 addresses, MAC address and ping time. In a terminal it opens a browser, driven by the keyboard or the mouse, with everything known about each device, a list of the services on the network (web UIs, SSH, file shares, Plex, Proxmox, Home Assistant) with the address to reach each one, and a key that opens a device's web UI at the right port. It remembers each network and points out devices that are new, moved, renamed or missing. Piped, it prints a table, or JSON with the evidence behind each identification. It isn't a port scanner or a security tool, and needs no Npcap or administrator rights.
