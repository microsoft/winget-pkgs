ReleaseNotes: |-
  A maintenance release: a signed Windows binary, and sturdier mDNS.
  Signed on Windows
  lsnet.exe is now signed by its publisher, Awesome Machinery, LLC, so Windows names who made it instead of warning about an unknown publisher. (The macOS binary was already signed and notarized.)
  Sturdier mDNS
  lsnet reads the mDNS answers every device on your network sends, and now uses simple-dns 0.13.1:
  - A malformed packet from the network can no longer make lsnet set aside a large amount of memory before reading it.
  - A device whose name contains a dot (an NDI source named after a Mac, STAGE-MBP.LOCAL (Scan Converter)) still shows its whole name.
  Also
  - tokio 1.54 and rustix 1.1.6 fix two soundness advisories (RUSTSEC-2026-0386, -0486).
  Install
  brew upgrade sanford/tap/lsnet     # macOS and Linux
  winget upgrade Sanford.lsnet       # Windows
  cargo install lsnet
  Full changes: v0.15.0...v0.15.1
