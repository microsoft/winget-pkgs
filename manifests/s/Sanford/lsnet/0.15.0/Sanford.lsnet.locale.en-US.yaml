ReleaseNotes: |-
  Telling you when macOS keeps lsnet off the network
  When your terminal app doesn't have macOS's Local Network permission, the system quietly stops lsnet from reaching most of your devices, and a scan finds far fewer devices and services than are really there. 0.14.1 started noticing this, but only said so in a dim note that was easy to miss.
  Now lsnet says so in a popup as soon as the scan notices, with what to do about it:
  - o opens System Settings at Privacy & Security › Local Network, where you can allow your terminal app.
  - r scans again once you have.
  - Any other key closes it. It stays closed until the next scan.
  While the scan is blocked, the summary line starts with a yellow "off the local network", even in a narrow terminal. lsnet --list still shows the same note under the results.
  Install with winget
  lsnet is now in winget, so on Windows:
  winget install Sanford.lsnet
  Full changes: v0.14.1...v0.15.0
