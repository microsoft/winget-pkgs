ReleaseNotes: |-
  New since 0.8.0:
  - Links you can follow as you read: the link nearest a band a third of the way down the screen is highlighted, and the footer shows where it goes. Enter (or l or →) follows it, Esc (or h or ←) comes back, and c then u copies it. Where no link is highlighted, Enter still scrolls.
  - Following a link selects that document in the file list, so the list beside the document shows where you are.
  - Links are easier to read: light blue on dark terminals, a deeper blue on light ones.
  - The file list stays beside the document on any terminal 80 columns or wider.
  - Click a pane to give it the keyboard.
  - Pictures move with the text while scrolling, and terminals started from iTerm2 (Kitty, Ghostty, WezTerm) are recognized correctly.
