ShortDescription: Terminal-friendly Markdown (.md) reader built for navigating large projects
Description: |-
  lsmd shows every Markdown file in a project on one screen, so you can browse and read them quickly. It knows which documents link to each other, in both directions, searches the document you're reading as you type and every file in the project in a moment, and shows the source beside the rendered text.

  - Search every file: narrow the list by name as you type, with the files that mention it in their text following, or list every matching line in every file.
  - See how documents connect: the header shows how many documents this one links to and how many link to it, and L lists both.
  - Follow links as you read: the link nearest your place is highlighted, Enter follows it and Esc comes back, each document scrolled to where you were. The file list follows along.
  - Find your place in a long document: the current section in the header, an outline, and jumps between headings.
  - Stays current: documents reload as they're edited, keeping your place, and e opens your editor at the line you're reading.
  - Diagrams and pictures: Mermaid diagrams and images are drawn in place, in terminals that can show pictures (Sixel, Kitty, WezTerm, Ghostty, iTerm2).
