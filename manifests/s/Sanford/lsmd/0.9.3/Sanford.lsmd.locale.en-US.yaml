ReleaseNotes: |-
  A maintenance release: a signed Windows binary, and Markdown read the way GitHub reads it in a few more corners.
  Signed on Windows
  lsmd.exe is now signed by its publisher, Awesome Machinery, LLC, so Windows names who made it instead of warning about an unknown publisher. Right-click it, then Properties › Digital Signatures, to see the signature.
  Markdown, closer to GitHub's
  lsmd now uses comrak 1.1, the Markdown parser's first stable release. Almost every document reads exactly as before. A few edge cases now follow GitHub:
  - In a table, c\\| ends the cell after c\.
  - ~~a~ *b* now emphasizes b, where a mismatched ~ used to stop it.
  - A footnote defined twice uses its first definition, shown with the other footnotes at the end.
  - [x] starts a task item only when a space or the line's end follows it.
  Also
  - Dependencies are up to date, including a fix to rustix (RUSTSEC-2026-0486).
  - lsmd is in winget: winget install Sanford.lsmd.
  Install
  On macOS and Linux:
  brew upgrade sanford/tap/lsmd      # or: brew install sanford/tap/lsmd
  On Windows:
  winget install Sanford.lsmd        # or: winget upgrade Sanford.lsmd
  scoop update lsmd                  # with Scoop
  Or download lsmd-windows-x64.zip below and put lsmd.exe on your PATH, or use the PowerShell command in the README.
  Anywhere with a Rust toolchain: cargo install lsmd.
