ShortDescription: Knows what each coding-assistant subscription has left, keeps work and private apart, and hands tasks to the official CLIs
Description: |-
  tokendealer reads what each coding-assistant subscription (Claude Code, Kiro, GitHub Copilot) has left
  from files the clients keep on this machine, puts the subscriptions in the order to use them, tells
  every session whether it runs under the right profile, and can hand a bounded task to another
  client's official command-line program. It opens no network connection and keeps nothing of a prompt.
