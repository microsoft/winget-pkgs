ShortDescription: Digital signage player that turns a Windows PC into a managed screen.
Description: |-
  SignageStack Player turns a Windows PC into a dedicated digital signage screen, managed from the SignageStack web dashboard.
  After installation the PC shows a pairing code; once it is paired, the player shows its playlists full screen as a kiosk, starts at sign-in, restarts itself after a crash or a hang, keeps playing from its cache when the network drops, and updates itself.
  It is meant for a PC that does nothing but drive a screen: the kiosk window covers the desktop and the taskbar. Uninstalling it from Settings > Apps gives the desktop back.
  Requires a SignageStack account.
