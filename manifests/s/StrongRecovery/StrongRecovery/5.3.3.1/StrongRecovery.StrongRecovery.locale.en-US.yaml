ShortDescription: Photo and file recovery for Windows
Description: |-
  StrongRecovery recovers deleted photos and files from HDDs, SSDs, SD cards and USB drives in Windows. Adjustable HQ thumbnails and file previews help assess recovery results. INSP recognition in Deep Scan requires PRO. FREE recovers up to 50 files totalling up to 5 GB; both limits apply.

  On supported NTFS, FAT12/16/32 and exFAT file systems, any file type can be recovered when the necessary file-system records and file data survive. Windows 7, 8, 10 and 11 are supported. Administrator rights are required. Save recovered files to another physical drive.
