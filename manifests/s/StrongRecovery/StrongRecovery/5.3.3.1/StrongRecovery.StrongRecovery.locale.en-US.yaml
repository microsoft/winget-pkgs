ReleaseNotes: |-
  Updated and standardized translations. Expanded localization coverage for the user interface, disk imaging messages, event logs, and the recovery map legend.

  New SKIP x2 + SIEVE imaging algorithm. Adaptive sector skipping improves disk image creation from damaged SD and microSD cards, USB flash drives, and other storage devices. The algorithm detects regions with frequent, scattered read errors and adjusts the skip size.

  Visual recovery map and improved imaging resume support. A separate .srmap file stores imaging progress and the status of successfully read, failed, and skipped ranges.

  SKIP x2 + SIEVE is available to try for the first 10 GB of an image. Once this limit is reached, imaging continues with basic sector skipping; further use of the advanced algorithm requires a Professional license.
