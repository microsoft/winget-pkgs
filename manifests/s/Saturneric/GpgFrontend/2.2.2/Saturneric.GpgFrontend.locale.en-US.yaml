ReleaseNotes: "## Improvements & Fixes\n\n• Enhanced built-in text editor with line numbers, current-line highlighting, richer status\n  information, and more reliable document recovery.\n• Improved file panel usability, including drag-and-drop operations, file/folder creation, Trash\n  support, and better navigation.\n• Refreshed startup wizard and onboarding experience.\n• Appearance changes now take effect immediately without restarting.\n• Improved window restoration and multi-screen behavior.\n• Improved key generation workflows and algorithm selection.\n• Enhanced key database management dialogs and interactions.\n• Improved output filename handling for encryption, decryption, signing, and verification operations.\n• Fixed potential crashes (AppImage) caused by conflicts between project-built OpenSSL and Qt’s\n  OpenSSL usage.\n• Fixed editor recovery and tab restoration issues.\n• Various UI and stability fixes.\n\n## Localization\n\n• Added Russian language support. (#249)\n• Completed many previously missing translations across supported languages using automated\n  translation and automated review.\n• Translation quality may still need community refinement. If you notice inaccurate or unnatural\n  translations, contributions are welcome.\n\n## Build & Signing\n\n• Added build coverage for macOS 16 Intel environments.\n• No longer uses a project-built OpenSSL in official builds and now relies on the system OpenSSL\n  provided by the target environment. Downstream packagers should make sure OpenSSL is provided by\n  the system or packaging environment.\n• This is the final release signed with the Windows code signing certificate serial\n  785a00b7985a7078fb1913c7b93b05e6. A new signing certificate will be used starting from the next\n  release.\n\n> [!NOTE]\n>\n> Many improvements in this release were synchronized from the main branch. For the 2.1 maintenance\n> series, only UI enhancements and bug fixes have been backported. No major core functionality changes\n> are included."
