ReleaseNotes: |-
  v2.2.4 is a quick follow-up to 2.2.3 that fixes several critical issues. **All 2.2.3 users should upgrade.** It is a drop-in upgrade：your profiles, keys and settings carry over unchanged.

  ### Critical fixes

  • **Symmetric (password-only) encryption was disabled for files.** (#276)
  • **Encrypted email reached only the first recipient.** In the Email module, Encrypt and Sign used only the first selected key, so other recipients could not read the message.
  • **Certifying could use the wrong key.** Your default key was used instead of the one you chose.
  • **The main window could freeze** when GnuPG stopped responding.
  • **The update check could run before you agreed to it.**
  • Fixed a crash, and GnuPG failing to start in temporary profiles on macOS.

  ### What's new

  • **New key generation wizard,** with simple choices (Modern, Compatibility or Hybrid post-quantum), an Expert Mode, and one-click Quick Generate.
  • **Guided wizards** for creating and exporting profiles and for exporting and importing key packages. You can pick which keys to import from a package.
  • **Key database recycle bin.** Removed key databases can be restored from Settings.
  • **HTML mail preview** in the Email module (Windows, macOS and Flatpak), safe by default：no scripts, no remote content, and links open only after you confirm.
  • **Easier email account setup.** A wizard finds your mail servers from your address and tests the connection.
  • **Redesigned certify dialog.**

  ### Other fixes

  • When signing files with a key that has more than one signing subkey, you can choose which one to use. (#281)
  • Key categories and the default key database are kept when exporting and importing profiles. (#277, #278)
  • The OpenPGP Structure Inspector recognizes post-quantum algorithms. (#279)
  • Profile files are now readable by you only.
  • Key Management opens much faster with many keys.

  > [!NOTE]
  > **Packagers:** unit tests are now opt-in, so building no longer needs GoogleTest (#280), and `GPGFRONTEND_BUILD_MODE` / `GPGFRONTEND_BUILD_FLAVOR` replace the old stable, portable and sandbox build options.

  **Full Changelog**：https://github.com/saturneric/GpgFrontend/compare/v2.2.3...v2.2.4
