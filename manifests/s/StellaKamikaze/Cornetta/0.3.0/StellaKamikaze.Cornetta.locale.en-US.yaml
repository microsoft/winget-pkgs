ShortDescription: Free call recorder. Your voice and the others' in one file, with any calling app.
Description: |-
  Cornetta records calls on your PC with any app: WhatsApp, Microsoft Teams, Zoom, Google Meet, Discord, browser calls.
  It captures your microphone and the audio the call app plays, on the devices Windows assigns to communications, and mixes them into one .m4a file in Music\Cornetta.
  It notices when an app starts using the microphone and offers to record. No account, no audio driver, no administrator rights. Beta.
