PrivacyUrl: https://cornetta.stellakamikaze.org/privacy/
License: MIT
ShortDescription: Registratore di chiamate gratuito. La tua voce e quella degli altri nello stesso file, con qualunque app.
Description: |-
  Cornetta registra le chiamate dal PC con qualunque app: WhatsApp, Microsoft Teams, Zoom, Google Meet, Discord, le chiamate dal browser.
  Registra il microfono e l'audio dell'app di chiamata, sui dispositivi che Windows assegna alle comunicazioni, in un file .m4a in Musica\Cornetta.
  Si accorge quando un'app inizia a usare il microfono e propone di registrare. Senza account, senza driver audio, senza permessi di amministratore. Beta.
