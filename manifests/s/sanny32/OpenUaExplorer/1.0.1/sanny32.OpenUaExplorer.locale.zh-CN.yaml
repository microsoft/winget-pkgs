PackageIdentifier: sanny32.OpenUaExplorer
PackageVersion: 1.0.1
PackageLocale: zh-CN
ShortDescription: 用于浏览、查看和监控 OPC UA 服务器的开源 OPC UA 客户端。
Description: |-
  OpenUaExplorer 是一款开源的 OPC UA 客户端，用于浏览、查看和监控 OPC UA 服务器。

  功能
  - 发现服务器端点，可使用任意标准安全策略建立连接：None、Basic128Rsa15、Basic256、Basic256Sha256、Aes128_Sha256_RsaOaep、Aes256_Sha256_RsaPss，支持 Sign 和 Sign & Encrypt 模式。
  - 支持匿名、用户名密码或 X.509 客户端证书认证；在内置证书存储中管理证书和信任决策。
  - 浏览 OPC UA 地址空间，查看节点属性和引用，写入属性值，并在节点上下文菜单中调用方法。发布标准 Icon 属性的对象和变量会在树中以服务器提供的颜色显示该图标。
  - 在数据访问面板中查看实时值；将节点拖放到面板即可，拖动对象或文件夹可添加其变量，可选择包含整个子树。
  - 创建可自定义发布间隔的订阅，监控数据变化和事件。
  - 读取提供历史数据的节点的数据历史和事件历史。
  - 将订阅的值绘制为实时趋势图。
  - 保存常用服务器和最近的连接；保存会话并可随时恢复。
  - 在内置日志中跟踪客户端活动。
  - 支持在浅色和深色应用主题之间切换。
