ShortDescription: Open source OPC UA client for browsing, inspecting, and monitoring OPC UA servers.
Description: |-
  OpenUaExplorer is an open source OPC UA client for browsing, inspecting, and monitoring OPC UA servers.
  Features
  - Discover server endpoints and connect with any standard security policy — None, Basic128Rsa15, Basic256, Basic256Sha256, Aes128_Sha256_RsaOaep, Aes256_Sha256_RsaPss — in Sign or Sign & Encrypt mode.
  - Authenticate anonymously, with username and password, or with an X.509 client certificate; manage certificates and trust decisions in the built-in certificate store.
  - Browse the OPC UA address space, inspect node attributes and references, write attribute values, and call methods from the node context menu. Objects and variables that publish a standard Icon property show that icon in the tree, in the colours the server gave it.
  - Watch live values in the Data Access panel — just drag nodes onto it; drop an object or a folder to add its variables, optionally those of the whole subtree.
  - Create subscriptions with configurable publishing intervals and monitor data changes and events.
  - Read data and event history for nodes that provide it.
  - Plot subscribed values as live trend graphs.
  - Keep favorite servers and recent connections at hand; save a session and restore it later.
  - Follow client activity in the built-in log.
  - Switch between light and dark application themes.
