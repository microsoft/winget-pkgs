ShortDescription: Player de musica para Windows com cerca de 70 formatos e um osciloscopio colorido por trilha.
Description: |-
  O VPX e um player de musica para Windows feito em cima de duas ideias que os players
  modernos abandonaram: tocar tudo, e mostrar o som.

  Ele abre cerca de 70 formatos na mesma janela - MP3, FLAC, WAV, OGG, Opus, AAC, M4A,
  WMA, APE e WavPack, mais os modulos de tracker da era Amiga e DOS (MOD, XM, IT, S3M,
  MTM, 669, OKT, MED, FAR, PTM, DBM, PSM, GDM, UMX e companhia), renderizados pela
  libopenmpt. Sem pacote de codec, sem plugin pra procurar.

  Enquanto toca, cada trilha ganha o seu proprio osciloscopio, colorido pela frequencia:
  verde no grave, ambar no medio, vermelho no agudo. Tem tambem equalizador de 10 bandas,
  crossfade entre faixas, listas por pasta e uma pele compacta pro canto da tela.

  Teste gratis de tres dias e depois pagamento unico. Sem assinatura e sem conta.
