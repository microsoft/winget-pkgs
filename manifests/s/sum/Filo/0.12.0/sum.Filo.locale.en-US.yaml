ShortDescription: The desktop workbench for agents, with Claude Code, Codex, Antigravity, OpenCode, pi and Grok side by side in threads.
Description: |-
  Claude Code, Codex, Antigravity, OpenCode, pi and Grok, side by side in threads. Each thread runs the very agent in your terminal, so chat and terminal are two views of one session, with its own sessions and settings, and every change knows which thread made it.

  What holds for any agent lives in Filo. What belongs to one agent stays with that agent.

  Changes know their thread
  The changes panel knows which thread changed each file and can show just this one's. Check files, then commit or roll them back.

  Findings come with evidence
  Here Codex reviews Claude Code's work: it runs the repro first, then writes R1 and S1. One click sends the report back to the author's composer, to fix or rebut item by item. The reviewer and whoever takes over are ordinary new threads that get a brief: which files changed and what you asked for. History isn't moved, because one vendor's history doesn't fit another's.

  Last week's chat, in seconds
  Searches prompts and replies across every project and every agent, terminal sessions included. Enter opens the thread at that message.

  Threads talk through one command
  From any agent's shell: filo list, send, wait, so one thread can call another. Routines open a thread on a schedule, and a precheck can skip a run before it spends a token.

  Agents use your browser
  Each thread gets its own tab to read, click and shoot; or it works in your own Chrome, with your logins, on the sites you allow. Sign-in, captchas and payment stay with you: it stops one step before money moves.

  WebStorm's keys, plain git
  Branches popup, commit, push, rebase, cherry-pick, stash: every action is one git command. After the commit, the branch's pull request, CI and review comments are right here.

  Three numbers: context, cache, cost
  Keeps the cache warm before it expires, subscriptions included; compacts a long thread while the cache is hot, warns when spend runs high. An address and a key make a channel for an agent; several keys form a group that fails over.

  Close the window, threads keep going
  Agents and terminals live in a separate process: if the window crashes or you quit, the running turn goes on and reconnects when you reopen.

  Delete Filo and lose nothing
  Filo keeps no conversations of its own. Each agent's sessions sit in its own folder in its own format, and its CLI in your terminal reads them as before. Search copies and cost numbers are caches you can throw away and rebuild; what Filo records itself (activity, the editor's local history, tasks) is plain files in ~/.filo and in your project.
