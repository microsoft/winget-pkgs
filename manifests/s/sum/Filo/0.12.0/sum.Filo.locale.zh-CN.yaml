ShortDescription: Agent 的桌面工作台，Claude Code、Codex、Antigravity、OpenCode、pi、Grok 在多个线程里并排干活。
Description: |-
  Claude Code、Codex、Antigravity、OpenCode、pi、Grok 在多个线程里并排干活。线程里跑的就是你终端里那个 Agent，对话和终端是同一个会话的两种看法，会话和配置仍是它自己的那一份；每处改动都知道是哪个线程做的。

  换成别的 Agent 也成立的，做在 Filo 里；只属于某一家的，留给那一家自己。

  改动认得它的线程
  改动面板知道每个文件是哪个线程改的，可以只看当前线程的。勾选文件，直接提交或回滚。

  结论附带证据
  这里是 Codex 审 Claude Code 的活：先跑一遍复现命令，再写 R1、S1。报告一键发回作者的输入框，逐条改或逐条反驳。审查者和接手的都是普通的新线程，只拿到一份任务说明：改了哪些文件、你要的是什么。历史不搬，因为各家的历史本来就接不上。

  上周那次对话，几秒找到
  搜遍所有项目、所有 Agent 的提问和回复，终端里跑过的会话也在内。回车直接打开那个线程。

  线程之间，用一条命令互通
  任何 Agent 的 shell 里都能 filo list、send、wait：让一个线程去叫另一个线程。例程按时间开新线程，前置检查不通过就跳过这一次，不起线程，也不花 token。

  Agent 用你的浏览器办事
  每个线程有自己的标签页，Agent 读页面、点击、截图；也可以直接用你自己的 Chrome，带着你的登录，能开哪些网站由你定。登录、验证码和付款留给你，填到钱要动的前一步就停。

  WebStorm 的键位，终端里的 git
  分支弹窗、提交、推送、变基、拣选、贮藏，每个操作就是终端里的一条 git 命令。提交之后，这个分支的 PR、CI 和审查意见也在这里。

  只看三个数：上下文、缓存、花费
  缓存快过期时替你保温，订阅也一样；线程长了趁缓存还热压缩，花超了提醒。一个地址加一个 key 就是那个 Agent 的一个渠道，多个 key 成组，失败自动换下一个。

  关了窗口，线程还在跑
  Agent 和终端跑在独立的进程里：窗口崩了或退出，进行中的一轮不停，再打开就接回来。

  删掉 Filo，你什么都不会丢
  Filo 不另存对话。每个 Agent 的会话都躺在它自己的目录里，用它自己的格式，终端里的 CLI 照样读。搜索副本、花费统计是可以丢掉重算的缓存；Filo 自己记的（活动时长、编辑器的本地历史、任务）是 ~/.filo 和项目里的普通文件。
