ShortDescription: Tiny tray timer that keeps the PC awake (no sleep, hibernation or screen saver)
Description: |-
  Nexa Coffee sits in the tray and shows the remaining time inside a ring icon.
  Pick unlimited, 12 h, 6 h, 2 h, 1 h, 30 min or a custom days/hours/minutes value and it prevents
  sleep, hibernation, display-off and the screen saver until the timer ends. Pure Win32, no CRT, about 30 KB.
  Portable build: a single exe, no installer. The installer package is SosomLab.NexaCoffee.
