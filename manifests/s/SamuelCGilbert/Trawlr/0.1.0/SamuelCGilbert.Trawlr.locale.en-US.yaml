ShortDescription: Instant file name search with an always-current index.
Description: |-
  Type a few letters and every matching file and folder on the PC is listed before you finish the word.
  A small service reads each NTFS drive's master file table, which indexes a million files in seconds,
  and follows the drive's change journal, so new files appear in the results the moment they are created.
  Includes a window with global hotkeys and a tray icon, and a trawlr command for the terminal.
