ReleaseNotes: "## [1.1308.3](https://github.com/snyk/snyk/compare/v1.1308.2...v1.1308.3) (2026-10-23)\n\nThe Snyk CLI is being deployed to different deployment channels, users can select the stability level according to their needs. For details please see [this documentation](https://docs.snyk.io/snyk-cli/releases-and-channels-for-the-snyk-cli)\n\n### Bug Fixes\n\n• **deps**：Updates dependencies to fix vulnerabilities:\n  • Updates the embedded Node.js runtime to 22.23.4 to address CVE-2026-105481, CVE-2026-105482, CVE-2026-106069, CVE-2026-106073, CVE-2026-106074, and CVE-2026-111497 ([23482f5bd](https://github.com/snyk/snyk/commit/23482f5bd63c800ee8b014c4530c1d17ef9a9397))\n  • Updates the `toml` library used by `snyk fix` for Poetry projects to 5.0.1 to address CVE-2026-114141, CVE-2026-114142, CVE-2026-114143, and CVE-2026-114144 ([f07ccbac6](https://github.com/snyk/snyk/commit/f07ccbac6e96126986be090473e148776509f426))"
