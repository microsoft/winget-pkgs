ShortDescription: Connects the security cameras on your network to Seayora.
Description: |-
  The Seayora Bridge runs on a computer on the same network as your cameras and
  connects them to Seayora, so you can watch them, record them and share footage
  from the website or either phone app.

  It finds the cameras on your network, keeps a local recording and sends only
  what you ask it to send. Camera passwords are sealed to the bridge on your own
  device and are never readable by Seayora.

  Install it with the pairing code from Seayora (Cameras, then Add a bridge):

    winget install seabridge
    seabridge ABCD-2345

  Running `seabridge` with no pairing code opens the setup and asks for one.
  It needs administrator rights to install the service, and Windows will ask.
