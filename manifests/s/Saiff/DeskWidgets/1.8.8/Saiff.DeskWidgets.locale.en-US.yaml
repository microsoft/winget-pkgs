ShortDescription: Lightweight, Apple-style desktop widgets for Windows 11.
Description: |-
  Desk Widgets puts Apple-style widgets on the Windows desktop: clocks, weather, calendar,
  now playing, system monitors and more. Everything is drawn by one small native process
  with no dependencies, using about 33 MB of memory, and widgets sit pinned to the desktop
  behind your windows rather than in a sidebar or a panel.

  Beyond the built-in clocks, widgets are community-made and installed in a click from an
  in-app gallery. Each one is C# source that is reviewed before publication, verified by
  SHA-256 on the machine before it compiles, and run in isolation so a misbehaving widget
  cannot take the app down with it.

  Free and open source under the MIT licence.
