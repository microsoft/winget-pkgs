ShortDescription: A desk stretch coach that pops up after 20 minutes of screen time and guides you through a short stretch.
Description: |-
  Gino the Gnocchi lives in your tray. After 20 minutes of active screen time he pops up in the corner with a short desk stretch, shows you how it's done, and counts you through it, with guided reps for chin tucks, thoracic extension and shoulder rolls.
  He waits while you're on a call or in a full-screen app, never takes your keyboard focus, and keeps everything on your computer.
  He uses the web engine already built into Windows (Microsoft Edge WebView2) instead of bringing his own, so the download is about 3 MB.
