ShortDescription: Package Manager Guard (PMG) protects developers and AI agents from malicious open source packages
Description: |-
  Package Manager Guard (PMG) checks open source packages for malware before a package manager installs them. It leverages threat intel, dependency cooldown and opt-in sandbox to protect against known and unknown malicious packages. PMG is free and open source.
  This package installs pmg for every user of the machine. It puts shims for the package managers first on the machine PATH. A plain npm install then goes through PMG. Uninstall removes all of it.
  Open a new terminal after the install. Then run "pmg setup doctor" to check the setup.
