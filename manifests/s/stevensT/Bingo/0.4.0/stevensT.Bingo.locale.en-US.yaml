ShortDescription: An always-on-top readout of how much of your Claude subscription usage is left, and when it resets.
Description: |-
  Bingo is a small always-on-top HUD for Windows that shows how much is left in your Claude Pro or Max usage windows, the 5-hour and the weekly, and when each resets. It turns amber and red as a window runs low and sends a desktop notification at 25% and 10% left by default. Clicks pass through it until you rest the cursor on it, so it stays out of the way.
  It reads the sign-in Claude Code already keeps on your machine, so Claude Code must be installed and signed in. Bingo is an independent project and is not affiliated with or endorsed by Anthropic.
