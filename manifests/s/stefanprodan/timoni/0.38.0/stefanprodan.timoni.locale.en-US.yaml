ReleaseNotes: |-
  ## Highlights

  • Timoni is now built with [CUE v0.18.0](https://github.com/cue-lang/cue/releases/tag/v0.18.0).
  • `timoni mod vendor crd` keeps the CRD maps declared with `additionalProperties` open. Maps with `additionalProperties：true`, preserved unknown fields and int-or-string values were vendored as closed structs that rejected every key. Re-run `timoni mod vendor crd` to regenerate the affected schemas, see [custom resources](https://timoni.sh/cue/module/custom-resources).
  • The temporary files created when reading bundles and runtimes from stdin with `-f -` are now removed when the command exits.

  ## What's Changed
  • fix(cli)：Remove stdin temp files on exit by @somaz94 in https://github.com/stefanprodan/timoni/pull/676
  • build(deps)：bump the ci group across 1 directory with 8 updates by @dependabot[bot] in https://github.com/stefanprodan/timoni/pull/681
  • build(deps)：update CUE to v0.18.0 and Go dependencies by @stefanprodan in https://github.com/stefanprodan/timoni/pull/682

  ## New Contributors
  • @somaz94 made their first contribution in https://github.com/stefanprodan/timoni/pull/676

