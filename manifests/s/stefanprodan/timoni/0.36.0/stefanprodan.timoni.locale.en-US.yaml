ReleaseNotes: |-
  ## Highlights

  • The `timoni mod build` and `timoni artifact build` commands take the `--resolve-symlinks` flag for packaging the symlink targets as regular files, the same as `timoni mod push` and `timoni artifact push`, see [symbolic links](https://timoni.sh/cue/module/publishing/#symbolic-links).
  • Timoni is now built with Go 1.27.3.

  ## What's Changed
  • feat(cli)：add `--resolve-symlinks` flag to `mod build` and `artifact build` by @stefanprodan in https://github.com/stefanprodan/timoni/pull/663
  • build(deps)：update Go dependencies, GitHub Actions and golangci-lint by @stefanprodan in https://github.com/stefanprodan/timoni/pull/669


