ReleaseNotes: |-
  ## Highlights

  • The `timoni build`, `timoni bundle build` and `timoni bundle apply` commands validate custom resources against their CRD schemas and CEL rules, see [bundle validation](https://timoni.sh/bundle/#validation).
  • The `timoni bundle vet --offline` command validates bundles with Runtime values from environment variables, without connecting to the clusters, see [runtime values](https://timoni.sh/bundle-runtime/#using-values-from-environment-variables).
  • Custom health checks fail fast on evaluation errors, and the [health check library](https://timoni.sh/cue/module/health-checks/#the-health-check-library) now covers the Gateway API `XBackend` kind.
  • The release assets include a signed [packslip](https://packslip.dev) for verifying the downloaded binaries.
  • Timoni is now built with Kubernetes 1.37.

  ## What's Changed
  • fix(mod)：tolerate conditional config field in `mod vet` by @stefanprodan in https://github.com/stefanprodan/timoni/pull/646
  • feat(bundle)：add `--offline` flag to `bundle vet` by @stefanprodan in https://github.com/stefanprodan/timoni/pull/647
  • feat(bundle)：validate custom resources with CRD schema + CEL by @stefanprodan in https://github.com/stefanprodan/timoni/pull/648
  • fix(runtime)：fail fast on health check schema errors by @stefanprodan in https://github.com/stefanprodan/timoni/pull/649
  • build(deps)：bump google.golang.org/grpc from 1.83.0 to 1.83.1 by @dependabot[bot] in https://github.com/stefanprodan/timoni/pull/651
  • build(deps)：bump google.golang.org/grpc from 1.83.1 to 1.83.2 by @dependabot[bot] in https://github.com/stefanprodan/timoni/pull/653
  • fix：remove trailing c-directives-end marker from timoni build YAML output by @kormide in https://github.com/stefanprodan/timoni/pull/657
  • ci(release)：Publish a signed packslip by @jdx in https://github.com/stefanprodan/timoni/pull/659
  • build(deps)：bump the ci group across 1 directory with 6 updates by @dependabot[bot] in https://github.com/stefanprodan/timoni/pull/658
  • Update dependencies to Kubernetes v1.37.1 by @stefanprodan in https://github.com/stefanprodan/timoni/pull/660
  • Update blueprint schemas to Kubernetes 1.37 by @stefanprodan in https://github.com/stefanprodan/timoni/pull/661

