ReleaseNotes: "## Highlights\r\n\r\n• The new [`timoni bundle update`](https://timoni.sh/bundle-update/) command brings Renovate/Dependabot-style automation to bundles, updating the module versions and digests according to the `@timoni(update:...)` policies declared on each module reference.\r\n• The `timoni mod vet` command validates the rendered custom resources against their CRD schemas and CEL rules, see [custom resource validation](https://timoni.sh/cue/module/custom-resources/#custom-resource-validation).\r\n• The `timoni mod vendor crd` command can select kinds and versions with `--kind` and `--version`, list them with `--list`, and remove stale definitions with `--prune`, see [custom resources](https://timoni.sh/cue/module/custom-resources/#select-kinds-and-versions).\r\n• The `timoni apply --diff` and `timoni bundle apply --diff` commands exit with code 1 when drift is detected, allowing their use as drift checks in CI, see [diff upgrade](https://timoni.sh/bundle/#diff-upgrade).\r\n• The [Timoni GitHub Action](https://timoni.sh/github-actions/) installs the release matching the action ref and verifies the build provenance attestation with `gh attestation verify`.\r\n• The Timoni [agent skill](https://timoni.sh/ai-agents/) can be installed with `gh skill install stefanprodan/timoni`.\r\n\r\n## What's Changed\r\n• refactor(e2e)：Rework the e2e workflow to deploy the fleet bundle by @stefanprodan in https://github.com/stefanprodan/timoni/pull/638\r\n• feat(cli)：exit 1 when applying with `--diff` to signal drift  by @stefanprodan in https://github.com/stefanprodan/timoni/pull/640\r\n• feat(action)：Verify attestations and pin the version to the GitHub Action ref by @stefanprodan in https://github.com/stefanprodan/timoni/pull/641\r\n• docs：add `gh skill install` to agents guide by @stefanprodan in https://github.com/stefanprodan/timoni/pull/642\r\n• feat(engine)：vet resources against their CRD schemas and CEL rules by @stefanprodan in https://github.com/stefanprodan/timoni/pull/643\r\n• feat(mod)： add kind, version, list and prune flags to `mod vendor crd` by @stefanprodan in https://github.com/stefanprodan/timoni/pull/644\r\n• build(deps)：bump the ci group across 1 directory with 3 updates by @dependabot[bot] in https://github.com/stefanprodan/timoni/pull/639\r\n• feat：add `bundle update` command for automating module version updates by @stefanprodan in https://github.com/stefanprodan/timoni/pull/645\r\n\r\n\r\n**Full Changelog**：https://github.com/stefanprodan/timoni/compare/v0.33.0...v0.34.0"
