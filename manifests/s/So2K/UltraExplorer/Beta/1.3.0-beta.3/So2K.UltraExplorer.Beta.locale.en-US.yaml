ShortDescription: A native Windows file manager with a zoomable canvas and Quick Look previews.
Description: |-
  UltraExplorer displays your folder hierarchy on a zoomable canvas. It includes
  Quick Look previews for images, documents, 3D models and media, quick text notes,
  color tags and optional Windows file-dialog integration.
  This package installs the beta release. It uses the same application folder
  and profile as the stable release; the two cannot be installed side by side.
