ShortDescription: Проводник для Windows с масштабируемым холстом и быстрым просмотром файлов.
Description: |-
  UltraExplorer показывает структуру папок на масштабируемом холсте. Поддерживает
  быстрый просмотр изображений, документов, 3D-моделей и медиа, текстовые заметки,
  цветовые метки и отключаемую интеграцию с диалогами выбора файлов Windows.
  Этот пакет устанавливает бета-версию. Она использует папку приложения и профиль
  стабильной версии; установить обе версии параллельно нельзя.
