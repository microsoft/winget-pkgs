ShortDescription: The SurrealDB command line. Installs, runs and upgrades the SurrealDB database and its tools.
Description: |-
  surreal is the command line for SurrealDB. It runs the database (surreal db), SurrealDB Cloud
  (surreal cloud) and the SurrealQL language server (surreal lsp) as separate components.

  The launcher downloads each component from download.surrealdb.com into %USERPROFILE%\.surrealdb,
  but only when you ask: on first use it names the host and asks before downloading, and an
  unattended run exits with the command that would install it. Each download is checked against
  its published SHA-256. surreal install, surreal upgrade, surreal use and surreal uninstall manage
  the installed versions.

  surreal start, surreal sql and the other commands of the standalone database still work, and
  forward to surreal db.
