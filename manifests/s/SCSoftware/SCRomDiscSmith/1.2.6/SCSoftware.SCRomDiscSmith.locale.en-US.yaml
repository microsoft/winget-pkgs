ShortDescription: 'Shrink your emulator game disc images to compact CHD files, check every byte, and convert them back when you need to.'
Description: |-
  Play classic console games on an emulator? Each game is a big disc image copied from a disc you own. SC ROM & Disc Smith shrinks your collection and proves every file is intact.

  SHRINK TO CHD
  • Convert ISO and single-track BIN/CUE disc images to CHD, the compressed format most emulators open directly, often around half the size.
  • Convert a whole batch at once, even straight from ZIP or 7z archives.
  • An optional check after every conversion proves the CHD matches the original, byte for byte.

  CHECK AND GET THE ORIGINAL BACK
  • Verify a CHD is complete and undamaged without unpacking it.
  • Turn a CHD back into an ISO or BIN file whenever you need it.

  SEE WHAT'S INSIDE
  • Format, tracks and volume details for ISO, BIN/CUE, CHD, RVZ and WIA images.
  • RVZ, WIA and multi-track audio CDs are inspected only, and the app tells you so.

  PRIVATE
  • Everything runs on your computer. Nothing is uploaded.

  Works on Windows 10 and 11 and on Linux. SC ROM & Disc Smith does not include or download any games. Use it with disc images you own.

  Pay once and it's yours to keep. No subscription and no adverts.
