ShortDescription: 'Turn videos, photos and audio into thumbnails, social artwork, MP4s and clean audio in one batch, on your PC.'
Description: |-
  Make every size you need for YouTube, Shorts, Instagram and your store page from the same source files, in one batch, without uploading anything.

  PICK A PRESET, DROP YOUR FILES, EXPORT
  • YouTube Shorts / 9:16 vertical: vertical video, Shorts cover and a 16:9 thumbnail.
  • YouTube 1080p + artwork pack, or a 4K (2160p) kit.
  • Social & store artwork pack: 1280×720 thumbnail, 1920×1080 hero, 1080×1080 square and 1080×1920 story.
  • Creator full social suite: adds Instagram 4:5 (1080×1350) and a 21:9 banner (2560×1080).
  • Podcast / audio master: normalised WAV plus 320 kbps MP3 and square cover art.
  • Audio + thumbnail only.

  GET THE CROP RIGHT
  • Live preview of the cropped result for every size.
  • Choose where the crop sits: centre, top or bottom.

  CLEAN AUDIO
  • Extract the soundtrack and peak-normalise it to a consistent level.

  SAFE BATCHES
  • Cancel at any time: finished items stay, half-finished ones are cleaned up.
  • Every export gets a manifest listing each file it made.
  • Your originals are never changed.

  PRIVATE
  • Everything is processed on your computer. Nothing is uploaded.

  Works on Windows 10 and 11 and on Linux. On Linux, MP4 (H.264) video uses your system's H.264 encoder; without one, videos are exported as WebM.

  Pay once and it's yours to keep. No subscription and no adverts.
