ShortDescription: 'Tidy messy folders with your own rules. Preview every move first, undo any batch, and recover safely after a crash.'
Description: |-
  Set up rules once and let SC FileFlow sort Downloads, photos, invoices and anything else into the right folders with the right names.

  RULES THAT FIT YOUR FILES
  • Match by file type, name pattern, regular expression, size or age.
  • Rename as you go with {date}, {year}, {month}, {name}, {ext} and {counter}.
  • Order your rules, switch them on and off, and save or load rule sets.
  • Ready-made presets: Downloads organiser, photo year/month sorter, invoice & receipt collector.

  SEE IT BEFORE IT HAPPENS
  • A dry-run preview shows every move and rename before anything is touched.
  • Optional duplicate detection skips files you already have.

  UNDO AND RECOVERY
  • Every batch is written to a journal as it runs.
  • Undo the last batch in one click.
  • If your PC crashes or loses power mid-batch, FileFlow finds the interrupted batch and lets you finish or roll it back.

  HANDS-FREE
  • Watch a folder and organise new files as they arrive, after preview or automatically.

  PRIVATE
  • Everything happens on your computer. Nothing is uploaded.

  Works on Windows 10 and 11 and on Linux.

  Pay once and it's yours to keep. No subscription and no adverts.
