ShortDescription: 'Turn scanned receipts, invoices and letters into searchable PDFs, pick out the important details and find any document fast.'
Description: |-
  Scan it, drop it in, find it again in seconds. SC PaperTrail reads your paperwork on your own computer and keeps a searchable library of it.

  SEARCHABLE PDFS
  • Import PDFs and scans (PNG, JPG, BMP, TIFF), including multi-page PDFs.
  • Text recognition adds an invisible text layer, so you can search and copy from scanned pages.
  • Your original files are never altered.

  THE DETAILS THAT MATTER
  • Picks out who it's from, the date, the total and the reference number.
  • You review and correct them before anything is renamed.
  • Smart file names from the details you confirmed, or apply confident ones automatically.
  • Low-confidence documents are flagged for review.

  A LIBRARY YOU CAN SEARCH
  • Full-text search across everything you've imported, plus vendor and needs-review filters.
  • Keep a backup of your library, and check it for missing or moved files.

  PRIVATE
  • Text recognition runs on your computer. Nothing is uploaded.

  Windows 10 and 11 use Windows' built-in text recognition for the languages installed on your PC. On Linux, text recognition is built in.

  Pay once and it's yours to keep. No subscription and no adverts.
