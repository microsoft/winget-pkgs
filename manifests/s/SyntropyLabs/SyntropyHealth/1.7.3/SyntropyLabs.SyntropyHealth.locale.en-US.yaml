ShortDescription: The open-source, self-hosted personal health record. Medical records, wearables and Apple Health in one private place, on a computer you own.
Description: |-
  Syntropy Health brings your health data into one record on your own computer: lab results, medications, conditions and visits from patient portals (SMART on FHIR), sleep, heart rate and workouts from Oura, WHOOP, Fitbit and Apple Health, and lab reports read from a PDF or photo.
  It runs entirely on hardware you control, with no account and no cloud service. The database is encrypted on disk and sits behind a password. An optional assistant answers questions from your records with the AI you choose, including a model running on your own computer.
  Syntropy Health organizes your records. It is not a medical device and doesn't give medical advice.
