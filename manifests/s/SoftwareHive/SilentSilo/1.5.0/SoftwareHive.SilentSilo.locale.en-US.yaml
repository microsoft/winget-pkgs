ShortDescription: Encrypted vault for files and passwords, unlocked with a security key or Windows Hello, synced through storage you own.
Description: |-
  SilentSilo keeps files and passwords in an encrypted silo on your own computer. It unlocks with a FIDO2 security key, Windows Hello or a recovery code on paper, and syncs through storage you choose: OneDrive, Dropbox, Google Drive, an S3 bucket, WebDAV, SFTP or a folder. There is no SilentSilo account and no SilentSilo server.
