ShortDescription: The desktop admin app for Meilisearch.
Description: |-
  MeiliOps is a native desktop admin app for Meilisearch, in the spirit of MongoDB Compass and pgAdmin.
  Browse and edit documents, try searches, analyze an index's schema, tune every index setting, watch tasks and batches, and manage API keys, webhooks, dumps and snapshots.
  It can also run local Meilisearch instances, side by side in any version or in Docker / Podman.
  API keys are stored in Windows Credential Manager, never in a config file.
