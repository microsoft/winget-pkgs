ShortDescription: An open-source game launcher for Windows. Launch from the tray, and let Windows adapt to the game.
Description: |-
  TrayTrigger puts your Steam, Epic, GOG, EA, Ubisoft Connect, Xbox / PC Game Pass, Battle.net, Rockstar, Amazon Games and itch.io games in one library and tray menu.
  Each game starts with its own setup: HDR, CPU cores (3D V-Cache or performance cores), power plan, display and sound device, NVIDIA DLSS Override,
  companion apps that start and close with it, and your own PowerShell scripts before and after.
  Quit, and those per-game settings revert; Activity & History shows what each launch did.
  Play from the couch with a full-screen Library and an Xbox or PlayStation controller.
  Also includes Stutter Check and optional, undoable system tweaks. No account, no telemetry.
