ShortDescription: Free viewer for STL, 3MF, G-code, FreeCAD, STEP, OBJ and glTF files with one-click hand-off to your slicer.
Description: |-
  PrintView3D is a fast, free viewer made for 3D printing. It shows models and sliced G-code
  (toolpaths by type, layer slider, print time and filament use), every object of a 3MF project,
  FreeCAD and STEP files (with your installed FreeCAD), and OBJ, PLY, OFF and glTF models.
  One click opens the file in Creality Print, OrcaSlicer, Bambu Studio, PrusaSlicer, Cura and
  others. Includes File Explorer thumbnails and is available in English, Arabic, Dutch, German,
  French and Spanish.
