  - fix: Fixes scalacOptions in BSP using VirtualFileRef by @azdrojowa123 in #9610
  - fix: Fixes -V parsing in sbt runners by @anatoliykmetyuk in #9626
  - fix: Fixes filesystem traversal order affecting cache stability by @christianharrington in #9646
