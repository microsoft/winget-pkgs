ReleaseNotes: |-
  1.6.0 makes exit codes and theme-refresh behavior match measured reality:
  - Exit code 20 (broadcast failure) is now meaningful; it was chronically returned on successful theme changes because internal per-window notifications always failed silently
  - Faster switches: app nudges now run before the global broadcast, roughly halving in-process work on busy desktops
  - The stubborn-app nudge list is slimmed to notifications that verifiably deliver (Explorer, dialogs, Chromium/Electron family, Firefox)
  - /passthru now prints per-stage timing diagnostics
  - No CLI syntax changes; scripts keying on exit codes now get a real signal

  A switch completes in a few tens of milliseconds even on a busy desktop.

  See full changelog at: https://github.com/espensev/ThemeToggle/blob/main/docs/RELEASE_NOTES.md
