ReleaseNotes: |-
  Added
  - you choose which sources are on. a new install starts with screen, system audio, and the microphone off, and it does not start at login until you turn that on. if you're updating, screen, system audio, and the microphone stay on, and so do your microphone settings, a pause you've set, your journal connection, and start at login. settings shows you the new switches.

  Fixed
  - updated the ZIP library used by the app's updater to address security advisories.
