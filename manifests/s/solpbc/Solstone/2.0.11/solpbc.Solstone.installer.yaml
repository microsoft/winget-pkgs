# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: solpbc.Solstone
PackageVersion: 2.0.11
MinimumOSVersion: 10.0.18362.0
Scope: user
InstallerType: exe
InstallModes:
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
  InstallLocation: --installto "<INSTALLPATH>"
  Log: --log "<LOGPATH>"
UpgradeBehavior: install
ProductCode: Solstone
ReleaseDate: 2026-09-24
# The Settings/About UI is a WebView2 surface; the app relies on the OS Evergreen
# WebView2 runtime (not bundled). Declaring it lets winget resolve the runtime from
# its own catalog first on the rare machine that lacks it (older Win10/LTSC/Server).
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.EdgeWebView2Runtime
# Correlation for `winget upgrade`: released 0.2.11 registers ARP DisplayName `sol`;
# the next package registers `solstone`. The stable ProductCode `Solstone` (Velopack
# --packId, capital S; not --packTitle `solstone`) spans that transition, so DisplayName
# is omitted here. Keep ProductCode at installer scope and in this section (winget 1.12).
AppsAndFeaturesEntries:
  - ProductCode: Solstone
InstallationMetadata:
  DefaultInstallLocation: '%LocalAppData%\Solstone'
Installers:
  # x64: the Setup.exe stub is a 32-bit Velopack shim, but the application it
  # installs (solstone-windows-app.exe) is PE32+ x86-64. Architecture describes the
  # app's applicability, not the stub -- tools that sniff the stub guess x86. Do not
  # let one "correct" this to x86.
  - Architecture: x64
    InstallerUrl: https://github.com/solpbc/solstone-windows/releases/download/v2.0.11/solstone-setup-2.0.11.exe
    InstallerSha256: 1EB6F01885958F19B7F4A936EFCBA9E701D1EEE805872387EB33D2DA4AEE5CCD
ManifestType: installer
ManifestVersion: 1.12.0
