ReleaseNotes: |-
  Introducing Dark Mode

  Use Typeless comfortably in low-light environments with the new dark appearance. Keep Typeless dark if that is what you prefer, or let it adapt automatically as your system switches between light and dark appearances.
  Go to Settings and find Appearance, then select "Dark" to keep the darker look, or select "System" to follow your system setting. You can also select "Light" to stay with the light appearance.
  Thanks for using Typeless. We hope the new appearance helps Typeless better fit the way you work.
