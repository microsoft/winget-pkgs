ShortDescription: Switches your monitor's input when you press your USB switch, so a USB switch and one monitor work like a KVM.
Description: |-
  A small tray app that watches for your keyboard or mouse to disappear when you press a USB switch, then tells the monitor over DDC/CI to change its input. When they come back, it switches the input back.
  It only needs to run on one of the two computers.
