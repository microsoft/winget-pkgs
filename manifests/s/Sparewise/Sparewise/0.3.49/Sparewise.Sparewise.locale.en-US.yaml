ShortDescription: See why your Windows drive is full and free space safely. Cache cleaner and storage analyzer with AI agent support.
Description: |-
  Sparewise shows what fills your drive in plain words and clears only what comes back by itself: app, browser and Windows caches, temporary files, Windows Update leftovers, shader caches and developer caches (npm, pip, NuGet, Docker and WSL disks).
  It lists local AI models (Ollama, LM Studio, Hugging Face) with when each was last used.
  Everything it removes goes to the Recycle Bin or is set aside so it can be put back.
  It is also an MCP server, so AI assistants such as Claude, Codex and Cursor can plan cleanups within limits you set.
  Free, no account, no telemetry, 30 languages.
