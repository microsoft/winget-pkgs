ShortDescription: See why your drive is full and free space safely. Everything it moves can be put back.
Description: |-
  Sparewise finds the space developer and AI tools fill on Windows (package caches, local AI models, Docker and WSL disks) plus ordinary Windows clutter, says what each item is, and frees it only when you say so. Changes go to the Recycle Bin or an undo window; it never deletes permanently. Also an MCP server for AI assistants. No account, no telemetry.
