ShortDescription: Convert files by pressing Shift while dragging them in Explorer.
Description: |-
  Shiftdial is a tray app for Windows. Start dragging files in Explorer, press Shift, and a dial of formats
  opens under the cursor; drop on one and the converted file lands next to the original. Ctrl+Shift opens
  tools instead: trim and compress video, crop and resize images, merge PDFs, extract archives.
  Everything runs locally, with no account and no network access.
