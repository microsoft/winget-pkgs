ShortDescription: Prints Sealed Print cloud print jobs on the printers of this computer.
Description: |-
  The Sealed Print relay client shares the printers of this computer (USB or local network) as destinations of
  Sealed Print, the cloud printing service. It only connects outbound, so no ports have to be opened. It installs
  for the current user without administrator rights, starts with Windows and updates itself. After installing,
  sign in to Sealed Print in the browser and confirm the code shown to connect the computer.
