ShortDescription: Version control for Mirth Connect and Open Integration Engine configuration
Description: |-
  mirthSync is a command-line tool for putting Mirth Connect and Open Integration
  Engine configuration under version control. It pulls channels, code templates,
  configuration maps, global scripts and resources out of a running engine into a
  directory tree you can commit, and pushes them back, which is what makes CI/CD
  on an interface engine practical.
