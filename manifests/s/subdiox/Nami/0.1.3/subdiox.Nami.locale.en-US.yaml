ShortDescription: An IINA-style, Windows-native media player built on mpv
Description: |-
  Nami is a modern media player for Windows in the spirit of IINA on macOS. It is built on libmpv with a WinUI 3 interface: an auto-hiding on-screen controller, a quick settings panel for video, audio and subtitles, playlists and chapters, seek-bar thumbnails, a mini player, music mode, online subtitle search, HDR output, screenshots, customizable key bindings and an mpv.conf editor. It plays local files and, with yt-dlp, online video.
