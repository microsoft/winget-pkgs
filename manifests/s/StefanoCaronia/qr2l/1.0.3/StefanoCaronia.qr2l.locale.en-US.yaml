ShortDescription: A minimalistic QR Code Generator Tool (CLI and GUI)
Description: |-
  qr2l is a minimalistic QR code generator for Windows, available both as a
  command-line tool (qr2l) and as a desktop GUI application (qr2l-gui).
  It supports multiple export formats (PNG, SVG, PDF, BMP, JPEG, GIF, PostScript),
  color customization, logo embedding, error correction levels and automatic
  payload detection for URLs, email, phone, SMS, WhatsApp, WiFi, geolocation,
  contacts (vCard) and calendar events.
