ShortDescription: CLI for Discord with SQLite backend
Description: |-
  discrawl mirrors Discord guild data into local SQLite so you can search, inspect, and query server history without depending on Discord search.

  It is a bot-token crawler. No user-token hacks. Data stays local.

  What It Does
  - discovers every guild the configured bot can access
  - syncs channels, threads, members, and message history into SQLite
  - maintains FTS5 search indexes for fast local text search
  - builds an offline member directory from archived profile payloads
  - extracts small text-like attachments into the local search index
  - records structured user and role mentions for direct querying
  - tails Gateway events for live updates, with periodic repair syncs
  - exposes read-only SQL for ad hoc analysis
  - keeps schema multi-guild ready while preserving a simple single-guild default UX
Moniker: discrawl
ReleaseNotes: |-
  0.15.1 - 2026-09-13
  - Explain empty search, messages, and dms results with stderr diagnostics for restrictive filters and missing local data, while preserving stdout, JSON output, and exit codes. Thanks @rnavarro.
  - Avoid repeated requests to unavailable Discord channels for seven days during routine sync, while full and targeted syncs retry immediately, unavailable-only backlogs keep discovering channels, and doctor reports marker health using the same timestamp policy. Thanks @rnavarro.
  - Preserve cancellation for interrupted SQLite work and closed transactions, while retaining the underlying diagnostic.
  - Keep the generated documentation identity stable when building from a renamed checkout.
  - Update CrawlKit to v0.16.2 and the optional Chinese tokenizer to gse v1.1.0 with cedar v0.50.0, retaining the Go minimum and SQLite runtime pairing.
