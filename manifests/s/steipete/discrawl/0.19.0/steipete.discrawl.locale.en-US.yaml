ShortDescription: CLI for Discord with SQLite backend
Description: |-
  discrawl mirrors Discord guild data into local SQLite so you can search, inspect, and query server history without depending on Discord search.

  It is a bot-token crawler. No user-token hacks. Data stays local.

  What It Does
  - discovers every guild the configured bot can access
  - syncs channels, threads, members, and message history into SQLite
  - maintains FTS5 search indexes for fast local text search
  - builds an offline member directory from archived profile payloads
  - extracts small text-like attachments into the local search index
  - records structured user and role mentions for direct querying
  - tails Gateway events for live updates, with periodic repair syncs
  - exposes read-only SQL for ad hoc analysis
  - keeps schema multi-guild ready while preserving a simple single-guild default UX
Moniker: discrawl
ReleaseNotes: |-
  0.19.0 - 2026-10-28
  Highlights: Let readers copy only changed relationship and history rows, and restore opt-in cloud publication.
  - Add a durable source change feed for message_attachments, mention_events, message_embedding_history and attachment_text_history: same-transaction trigger entries with a gap-safe sequence, per-table generations for history the log cannot express, 7-day prefix compaction during tail, and change_feed in status --json. Readers can copy only changed rows; existing tables and readers are unchanged.
  - Refresh the OpenAI and Google SDKs, gRPC, network helpers, and security analysis tooling while preserving the Go minimum and SQLite compatibility pins.
  - Restore opt-in D1/R2 publication after verified native checkpoint and Git publication, preserving serialized acquisition, inventory adoption guards, resumable uploads and visible cloud failures.
