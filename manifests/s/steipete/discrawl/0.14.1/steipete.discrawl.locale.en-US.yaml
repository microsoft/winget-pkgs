ShortDescription: CLI for Discord with SQLite backend
Description: |-
  discrawl mirrors Discord guild data into local SQLite so you can search, inspect, and query server history without depending on Discord search.

  It is a bot-token crawler. No user-token hacks. Data stays local.

  What It Does
  - discovers every guild the configured bot can access
  - syncs channels, threads, members, and message history into SQLite
  - maintains FTS5 search indexes for fast local text search
  - builds an offline member directory from archived profile payloads
  - extracts small text-like attachments into the local search index
  - records structured user and role mentions for direct querying
  - tails Gateway events for live updates, with periodic repair syncs
  - exposes read-only SQL for ad hoc analysis
  - keeps schema multi-guild ready while preserving a simple single-guild default UX
Moniker: discrawl
ReleaseNotes: |-
  0.14.1 - 2026-09-09
  - Accept the application's legacy migrated attachment column order in the backup-first repair helper while retaining exact schema and repair safeguards.
  - Add a manually gated, backup-first maintenance workflow for narrowly scoped attachment text repair, with strict snapshot validation before installing a new Actions database cache.
  - Keep extracted attachment text within its byte limit without splitting valid UTF-8 characters, and identify invalid admitted attachment columns in contents-free export errors without changing stored data or weakening snapshot validation.
  - Limit disposable Discord backup clones to current main and required descendants, without fetching tagged history.
  - Provide checked-out source and workflow run identity to Discord archive publications.
  - Update CrawlKit to v0.15.0 while retaining the existing Go minimum and preferred toolchain.
  - Preserve stable published shard paths for released subscribers, roll back handled pre-manifest installation failures, and report post-manifest cleanup failures without committing or pushing a partial result.
  - Add optional manifest-bound producer.json receipts for explicitly identified publishers, preserving unrelated files and checking the binding before publication push retries. Receipts are unsigned publisher assertions, not authenticated provenance.
  - Keep publication Git arguments bounded with literal NUL-delimited paths and one path-only commit, preserving unrelated staged work.
  - Report incomplete selected channel or category permissions in publication preflight, including inherited thread permissions, without changing public-only export selection.
  - Accept exact manifest-owned table generation paths alongside legacy snapshot shards without broadening publication cleanup or Git staging.
  - Remove previously published embedding and media files when omitted, and commit only exact archive outputs and explicitly generated reports while preserving unrelated staged work.
  - Exclude deleted messages from cloud row publication and SQLite bundles, using the existing replacement protocol and matching live-row counts.
  - Preserve cached channel permissions during targeted sync and exclude unobserved permissions from public-only snapshots.
  - Exclude nested unselected guild metadata from filtered snapshots while retaining local raw observations.
  - Keep local Wiretap DMs out of embedding enqueue, rebuild and provider requests, including jobs queued by older versions.
  - Keep inferred Git fingerprints separate from snapshot integrity metadata when importing legacy snapshots, including historical restores, while preserving incremental merge checkpoints.
  - Exclude local-only direct messages from published README activity reports and add report --published for standalone shared reports, while preserving full local reports and filtered-publication safeguards.
  - Remove prior manifest-declared embedding files when export is disabled or its model changes, preserving undeclared embedding/media siblings, unrelated staged work, and local vectors.
  - Validate imported embedding rows against their manifest identity and vector dimensions; reject malformed or non-finite vectors transactionally and skip missing, deleted, and local-only message targets while preserving existing DM vectors.
