ShortDescription: Snow, stardust and Christmas fireworks that fall across your whole screen as you type.
Description: |-
  Typefall draws gentle snow or stardust over your entire screen while you type, and bursts into red and green
  Christmas fireworks when you type "christmas". Choose the effect, a pastel or rainbow color, and the particle
  amount from the tray menu. The overlay is transparent and click-through, so it never gets in the way.

  Typefall uses a global keyboard hook only to detect that you are typing. Key contents are never stored or
  sent anywhere; the app only counts keystrokes and, if the Christmas effect is on, tracks progress through
  a key sequence in memory. The full source code is public.
