ShortDescription: Remote GUI for the Transmission torrent daemon
Description: |-
  Torrent Remote is a desktop GUI for remotely controlling the Transmission BitTorrent daemon. It is a Tauri application forked from TrguiNG, with a multi-tabbed interface for concurrent server connections, torrent creation with multi-threaded hashing, powerful torrent filtering, support for the latest Transmission features (labels, bandwidth groups, sequential download), completion notifications, a tray icon, in-app updates, and light and dark themes. Transmission v2.40 or later is required.
