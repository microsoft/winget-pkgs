Description: eID Klient 是斯洛伐克公共行政电子服务（slovensko.sk）的官方登录应用程序，可使用带芯片的电子身份证（eID）配合读卡器登录。它还支持与国家安全局合作的合格电子签名（QES/aQES），使用经认证的 SSCD/QSCD 设备。
