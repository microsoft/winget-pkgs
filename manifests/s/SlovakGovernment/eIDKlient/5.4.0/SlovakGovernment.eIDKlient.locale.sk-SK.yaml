ShortDescription: Oficiálna prihlasovacia aplikácia do elektronických služieb verejnej správy pomocou elektronického občianskeho preukazu.
Description: eID Klient je oficiálna aplikácia na prihlasovanie sa do elektronických služieb verejnej správy (slovensko.sk) pomocou elektronického občianskeho preukazu (eID) s čipom a čítačkou. Podporuje aj kvalifikovaný elektronický podpis (QES/aQES) s certifikovanými zariadeniami SSCD/QSCD v spolupráci s Národným bezpečnostným úradom.
