ShortDescription: A local collaboration control plane for Claude Code, Codex, and Grok Build sessions.
Description: |-
  PairRoom connects supported Claude Code, Codex, and Grok Build sessions for
  evidence-based cross-review without replacing their native coding harnesses.
  Each durable Room holds two stable Agent slots; either slot may select any
  supported runtime, including the same runtime twice. Review a plan together,
  then let the chosen agent execute normally with its own tools, skills, and
  subagents. All listeners stay on numeric loopback and remote access uses SSH
  local port forwarding.
