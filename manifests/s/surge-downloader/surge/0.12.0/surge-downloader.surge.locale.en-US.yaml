ReleaseNotes: |-
  Highlights
  - Add clipboard parsing for curl commands to make new downloads faster to create.
  - Improve resilience when disk space is insufficient and preserve download errors across restarts.
  - Refine the terminal UI with safer removal confirmation, less hidden rendering work, and clearer graph behavior.
  - Improve concurrent downloading by avoiding redundant initial remainder requests and strengthening retry behavior.
  System integration
  - Add a systemd service option.
  - Update the Star History chart integration.
  Dependencies
  - Refresh core networking, test, terminal UI, and ANSI dependencies.
  Verification
  - Built and tested successfully on Linux, macOS, and Windows.
