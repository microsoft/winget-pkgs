ShortDescription: Unofficial open-source companion app for RadiaCode radiation detectors.
Description: |-
  Radiacode Companion connects to RadiaCode radiation detectors (tested with the RadiaCode-110) over USB or Bluetooth LE.
  It shows live dose rate, count rate, accumulated dose and hardness, an energy spectrum with isotope identification, background subtraction, history, alarms with notifications, and the detector's battery, temperature and settings.
  Not affiliated with RadiaCode.
