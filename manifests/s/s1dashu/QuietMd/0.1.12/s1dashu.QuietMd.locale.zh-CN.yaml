ReleaseNotes: |-
  Quiet.md 0.1.12
  中文
  这次更新让导入更直接，也重新打磨了主页和窗口。
  - 拖进侧栏导入：可以把文件从访达（Windows 上是文件资源管理器）直接拖进侧栏：拖到文件夹上导入到这个文件夹，拖到两行之间会出现灰色占位，文件就落在那里。「本机文件」里的文件也可以这样拖进「我的文档」。导入前会先确认，导入的是副本，原文件不动。
  - 整页都是放置区：拖文件到主页或文件夹页时，整个页面亮起虚线框和蓝色光晕，松手后有一圈波纹。
  - 主页卡片：改为连续圆角，去掉灰色外框，换成极淡的细边和轻微的阴影；卡片固定 5:6 比例，悬停时有一圈灰色描边。修复个别卡片缩略图一直空白。
  - 在访达中打开：主页和文件夹页右上角的「…」菜单可以直接打开文档库或当前文件夹。
  - 面包屑：文档顶部的路径都从「我的文档」开始；窗口很窄时自动收成「…」，标题优先显示。
  - 窗口：最小宽度给文档区留足 480pt，再加上侧栏宽度；在很窄的窗口里打开侧栏会自动加宽。全屏时侧栏使用不透明底色。
  - 修复：在文件夹里新建 Markdown 或导入文档时，某些情况下程序会卡死。
  English
  This update makes importing more direct and refines Home and the window.
  - Drop into the sidebar: drag files from Finder (File Explorer on Windows) straight into the sidebar. Drop on a folder to import into it; between rows, a grey slot opens and the files land there. Files on this computer can be dragged into My documents the same way. Importing asks first; it copies, and the original file is left as it is.
  - The whole page is a drop target: dragging files over Home or a folder page lights the page with a dashed edge and a blue glow, with a ripple when you let go.
  - Home cards: squircle corners; the grey frame gives way to a faint hairline and a light shadow. Cards keep a 5:6 shape and show a grey ring on hover. Fixes a card whose preview stayed blank.
  - Open in Finder: the … menu on Home and folder pages opens the library or the current folder.
  - Breadcrumbs: a document's path always starts at My documents, and folds into "…" in a narrow window so the title stays readable.
  - Window: the minimum width keeps 480pt for the note plus the sidebar; opening the sidebar in a narrow window widens it. The sidebar is solid in full screen.
  - Fixed: creating a Markdown document or importing into a folder could hang the app.
  Packages / 安装包
  - macOS: Apple Silicon and Intel ZIPs, Developer ID signed and notarized.
  - Windows: x64 installer; unsigned, as in 0.1.11.
  - Linux: experimental x86_64 AppImage (glibc 2.35 baseline); in-app updates are supported when running the AppImage.
  Linux: chmod +x quiet-md-0.1.12-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
  All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub.
  Full changelog: https://github.com/s1dashu/quiet-md/compare/v0.1.11...v0.1.12
