ReleaseNotes: |-
  Quiet.md 0.1.13
  中文
  这次更新带来画板和版本历史，也让应用更小、更省内存。
  - 画板：按 Excalidraw 源码移植的白板。图形、保持绑定的箭头、画笔、文字、便签、分区和图片都有，界面和快捷键与 Excalidraw 一致。可以作为文档里的一块，也可以直接打开 .excalidraw 文件，存回去 excalidraw.com 也能打开。一万个图形（约 3.2 万个元素）时，悬停、拖动、缩放都比原版 Excalidraw 快很多倍，数据见 tools/perf/board-results.md。
  - 版本历史：每次保存会留下之前的正文。在文档的「…」›「版本历史」里按天列出，点一下就在原处只读预览，改动的段落会标出颜色，随时回到当前版本。默认每篇保留 20 份，可以在设置里改成 1–30 份。
  - 新语言：法语和阿拉伯语界面。阿拉伯语的多行说明靠右排。
  - 复制和整理：复制为 Markdown（⌘⇧C，Windows 上是 Ctrl+Alt+Shift+C），侧栏右键可以复制文件路径，设置 › 文档库里可以换到另一个文件夹。文件夹行的「+」和标题栏一样弹出新建菜单。
  - 粘贴的图片不再失效：从飞书、Notion 或网页粘贴的图片会马上下载、存进文档库，不再因为链接过期而显示不出来。关闭「自动下载网络图片」时不下载。
  - 更省内存、更流畅：主页和文件夹页的 PNG 缩略图边解码边缩小，大图多的页面内存峰值明显降低；导入、删除和清空回收站在后台进行；侧栏在几千篇文档时滚动也流畅。
  - 修复：表格里用 ↑ / ↓ 移出单元格时保持在同一列；复制带公式的文字时保留公式；保存 Markdown 时公式不再越存越多反斜杠；Linux 上 emoji 能正常显示；Windows 10 LTSC 2019 可以安装；文档库里图片的旧绝对路径失效时能找回。
  English
  This update brings boards and version history, and makes the app smaller and lighter on memory.
  - Boards: a whiteboard ported from Excalidraw's source, with shapes, arrows that stay bound, freehand, text, sticky notes, frames and images, and the same tools and shortcuts. Add one to a note, or open a .excalidraw file directly; it saves back in a format excalidraw.com opens. With 10,000 shapes (about 32,000 elements), hovering, dragging and zooming are many times faster than the original Excalidraw; numbers are in tools/perf/board-results.md.
  - Version history: each save keeps the text it replaced. … › Version history lists the versions by day; click one to preview it in place, read-only, with changed blocks tinted, and go back to the current version at any time. Each note keeps 20 by default, 1–30 in Settings.
  - New languages: French and Arabic. Multi-line notes in Arabic are right-aligned.
  - Copy and organize: Copy as Markdown (⌘⇧C, Ctrl+Alt+Shift+C on Windows); copy a file's path from the sidebar's row menu; switch to another library folder in Settings › Documents. A folder row's + opens the New menu, like the one in the header.
  - Pasted images keep working: images pasted from Feishu, Notion or the web are downloaded right away and saved into the library, so they no longer break when a signed link expires. Nothing is downloaded when "Download web images" is off.
  - Lighter and smoother: PNG thumbnails on Home and folder pages shrink while they decode, so picture-heavy pages use much less memory at peak. Importing, deleting and emptying the Trash run in the background, and the sidebar scrolls smoothly with thousands of documents.
  - Fixed: ↑ / ↓ out of a table cell keeps its column; copied text keeps its equations; saving Markdown no longer adds a backslash to equations each time; emoji draw on Linux; Windows 10 LTSC 2019 can install; images whose old absolute path went stale are found again.
  Packages / 安装包
  - macOS: Apple Silicon and Intel ZIPs, Developer ID signed and notarized.
  - Windows: x64 installer; unsigned, as in 0.1.12.
  - The packages are larger than 0.1.12 (about 30 MB on macOS): boards bring Excalidraw's fonts, including a handwritten Chinese font.
  - Linux: experimental x86_64 AppImage (glibc 2.35 baseline); in-app updates are supported when running the AppImage.
  Linux: chmod +x quiet-md-0.1.13-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
  All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub.
  Full changelog: https://github.com/s1dashu/quiet-md/compare/v0.1.12...v0.1.13
