ReleaseNotes: |-
  Quiet.md 0.1.14
  中文
  这次更新带来正则查找、Obsidian 双链跳转、可下载的文档字体、土耳其语界面和从右往左的阿拉伯语排版，也让大文档库里的搜索和删除快了很多。
  - 正则查找：查找替换栏里点 .* 就按正则表达式匹配（不区分大小写，在一行内匹配），替换时可以用 $1、${name} 引用分组，替换后保留原来的文字样式；写错的表达式会提示「正则有误」。
  - Obsidian 双链：导入的 Obsidian 库里，[[笔记]]、[[文件夹/笔记]]、[[笔记#标题]] 这样的双链点一下就打开对应的笔记，规则和 Obsidian 一致（不区分大小写、路径可省、同一文件夹优先）。
  - 新语言和从右往左排版：新增土耳其语界面，界面语言一共 9 种。阿拉伯语正确连写；从右往左的段落靠右排，光标、选区和方向键都按从右往左走，列表符号在右侧。
  - 字体：设置 › 外观里可以分别选择界面字体和文档字体，代码块仍用主题的等宽字体。字体列表按黑体、宋体、楷体 · 手写、等宽、西文等分组，每行用自己的字体显示示例，悬停或用方向键移到某一行就预览整页效果，可以收藏，也会记住最近用过的。
  - 按需下载字体：文档字体可以选霞鹜文楷、朱雀仿宋和小赖手写体，选中时才从 download.quiet.md 下载，列表里显示大小和下载进度，下载的字体可以删除。画板的中日韩手写字体（Xiaolai，14 MB）不再打包进安装包，第一次需要时才下载，下载期间画板先用系统字体。字体文件按哈希校验，除了请求这个文件不发送任何信息。
  - 清理未使用资源：设置 › 文档库可以找出没有任何笔记（包括回收站、版本历史和本机文件）用到的图片和文件，确认后移到文档库的 .quiet/removed-assets，30 天后自动删除，期间可以拖回来。
  - 退格键回到标题：设置 › 通用里新增这个开关，默认开（和以前一样，在正文开头按退格会把第一段并入标题）；关掉后光标留在正文里。
  - 快捷键变化：Windows 和 Linux 上「复制为 Markdown」的默认快捷键改为 Ctrl+Shift+M（原来的 Ctrl+Alt+Shift+C 在不少键盘布局上会被当成 AltGr 打出字母）。macOS 仍是 ⌘⇧C。自己改过键位的不受影响。
  - 更快：两千篇文档的库里，搜索框每输入一个字从最慢 5 秒多降到 45 毫秒以内；删除 190 篇的文件夹从最慢 1.5 秒降到约 0.1 秒，全选删除 822 项从约 1.1 秒降到约 0.23 秒，清空回收站从约 1 秒降到约 0.08 秒。切换文档时不再每次都同步写盘。
  - 窗口和画板：窗口变窄时自动收起的侧栏，放宽后会自动展开（手动收起的不会）。画板支持触控板双指缩放。笔记和侧栏之间的阴影更淡了。
  - 文档菜单：「…」菜单去掉了「更多」子菜单，「复制为 Markdown」直接放在「下载为」后面；「阅读模式」和「显示引用列表」变成菜单里的开关。
  - 修复：切换文档卡顿；代码块的折叠状态随文档保存；画板选背景色时可能崩溃；深色模式下查找替换和设置弹窗里的按钮看不清；Windows 上的设置说明和首次启动引导不再写 ⌘N 和「访达」；繁体中文界面用词统一（文件庫、垃圾桶）。
  数据表这个版本还不开放：新建不了数据表，已有的数据表文件只显示只读占位，文件保持原样。
  English
  This update brings regular-expression find, Obsidian wikilinks, downloadable document fonts, a Turkish interface and right-to-left Arabic, and makes search and deleting much faster in large libraries.
  - Regular expressions: click .* in the find bar to match a regular expression (case-insensitive, within one line). Replacements can use $1 and ${name} groups and keep the replaced text's style; an invalid pattern says so.
  - Obsidian wikilinks: in an imported Obsidian vault, links such as [[Note]], [[Folder/Note]] and [[Note#Heading]] open the note they point to, resolved the way Obsidian does (case-insensitive, path optional, same folder first).
  - New language, right to left: a Turkish interface, for nine interface languages in all. Arabic joins its letters; right-to-left paragraphs are right-aligned, and the caret, selection and arrow keys move right to left, with list markers on the right.
  - Fonts: choose the interface font and the document font separately in Settings › Appearance; code blocks keep the theme's monospace face. The lists are grouped by kind (sans, serif, script, monospace, Latin and more), each row shows a sample in its own face, hovering or arrowing to a row previews the page in it, and you can star fonts; recent picks are remembered.
  - Fonts on demand: LXGW WenKai, Zhuque Fangsong and Xiaolai can be picked as the document font; each is downloaded from download.quiet.md only when you pick it, with its size and progress shown in the list, and can be deleted later. The board's handwriting face for Chinese, Japanese and Korean (Xiaolai, 14 MB) is no longer in the packages: it is fetched the first time a board needs it, and the board uses the system fonts until then. Font files are checked against their hashes, and nothing is sent besides the request for the file.
  - Unused assets: Settings › Documents finds images and files that no note uses (the Trash, version history and Files on this computer included) and, once you confirm, moves them to .quiet/removed-assets in the library, where they are deleted after 30 days; until then you can drag them back.
  - Backspace returns to title: a new switch in Settings › General, on by default (as before, Backspace at the start of the body joins the first paragraph to the title); off keeps the caret in the body.
  - Shortcut change: on Windows and Linux, Copy as Markdown is now Ctrl+Shift+M by default (Ctrl+Alt+Shift+C acted as AltGr and typed a letter on many keyboard layouts). macOS keeps ⌘⇧C. Keys you rebound yourself are unchanged.
  - Faster: in a library of 2,000 notes, each keystroke in search went from up to 5 seconds to under 45 ms. Deleting a folder of 190 notes went from up to 1.5 s to about 0.1 s, deleting 822 selected items from about 1.1 s to 0.23 s, and emptying the Trash from about 1 s to 0.08 s. Switching documents no longer syncs to disk every time.
  - Windows and boards: a sidebar hidden because the window got narrow comes back when it widens again (one you hid yourself stays hidden). Pinch to zoom boards on a trackpad. The shadow between the note and the sidebar is fainter.
  - Document menu: the … menu drops its More submenu: Copy as Markdown follows Download as, and Reading mode and Show references are switches in the menu.
  - Fixed: lag when switching documents; code block folds are saved with the document; a possible crash in a board's background picker; hard-to-read buttons in dark mode (find and replace, settings pop-ups); settings and first launch on Windows no longer say ⌘N or Finder; consistent wording in Traditional Chinese.
  Data tables are not in this release: none can be made, and existing table files show a read-only placeholder and are left as they are.
  Packages / 安装包
  - macOS: Apple Silicon and Intel ZIPs, Developer ID signed and notarized.
  - Windows: x64 installer; unsigned, as in 0.1.13.
  - Linux: experimental x86_64 AppImage (glibc 2.35 baseline); in-app updates are supported when running the AppImage.
  Linux: chmod +x quiet-md-0.1.14-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
  All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub.
