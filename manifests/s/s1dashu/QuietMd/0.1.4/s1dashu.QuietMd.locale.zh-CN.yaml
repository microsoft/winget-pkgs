ShortDescription: 又快又安静的本地笔记应用，Rust + GPUI 原生绘制，兼容飞书文档 DocxXML 格式。
Description: |-
  一个又快又安静的本地笔记应用。Rust + GPUI 原生绘制，笔记全部存在你的电脑上，兼容飞书文档的 DocxXML 格式。
  快，原生的那种快。整个界面由 Rust 和 GPUI 直接用 GPU 绘制，没有 WebView、没有 Electron。百万字文档实测中，输入、删除和滚动的帧处理 P95 均低于 6 ms。
  本地优先，文件归你。没有账号，没有云端，默认不联网（可选的更新检查除外）。文档库就是电脑上的一个普通文件夹，每篇笔记是一个 XML 文件。用 Git、iCloud、坚果云或任何同步工具管理都可以，哪天不用了，文件也还在。
  兼容飞书 DocxXML，完整的富文本编辑器。笔记直接以飞书文档的 DocxXML 格式保存，从飞书复制粘贴、导入导出都能保留结构。标题、待办、表格、分栏、高亮块、代码、公式、图片和附件，写文档常用的块都有。
Tags:
- markdown
- 笔记
- 编辑器
- 飞书文档
ReleaseNotes: |-
  quiet.md v0.1.4 带来应用内自动更新和深色模式。
  - 自动更新：有新版本时，侧栏顶部会出现「更新」按钮。下载后先校验签名，重启即完成安装，打开的文档会先保存。自动检查可在 设置 › 通用 中关闭；检查时只读取一份版本信息，不发送任何数据。0.1.3 及更早的版本需要手动下载一次本版本，之后的版本都能在应用内更新。
  - 深色模式：设置 › 外观 可选跟随系统、浅色或深色，内置主题和自定义主题都有对应的深色效果；导出和打印仍是浅色。浅色模式与 0.1.3 完全一致。
  macOS 包面向 Apple Silicon，已通过 Developer ID 签名、Apple 公证及 Gatekeeper 验证。最低系统声明为 macOS 13，尚未在 macOS 13 实机验证。
  Windows 包面向 x64、Windows 10 2004 及以上，暂未代码签名；全局快捷键、PDF 导出和打印暂不支持。Intel Mac 暂无预编译安装包。
ReleaseNotesUrl: https://github.com/s1dashu/quiet-md/releases/tag/v0.1.4
