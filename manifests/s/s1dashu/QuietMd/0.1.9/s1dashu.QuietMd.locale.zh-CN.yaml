ReleaseNotes: |-
  Quiet.md 0.1.9
  中文
  这次更新修复了退出、窗口按钮和文字选区的三个问题。
  - macOS：修复按 ⌘Q 无法退出的问题，退出前仍会检查文档保存状态。
  - Windows：修复关闭、最大化和最小化按钮无响应的问题。
  - 文字选区：修复带背景色的文字选中后看不到选区的问题，适用于所有平台。
  English
  This update fixes quitting, window controls, and text selection visibility.
  - macOS: fix Cmd+Q failing to quit. Documents are still checked for unsaved changes before exit.
  - Windows: fix unresponsive close, maximize, and minimize buttons.
  - Text selection: keep selection visible over text highlight colors on all platforms.
  Fixes #108, #109, #111, and #114. Thanks to everyone who reported these issues.
  Packages / 安装包
  - macOS: Apple Silicon and Intel ZIPs, Developer ID signed and notarized.
  - Windows: x64 installer; unsigned, as in 0.1.8.
  - Linux: experimental x86_64 AppImage (glibc 2.35 baseline); updates are manual.
  Linux: chmod +x quiet-md-0.1.9-x86_64.AppImage, then run it. If FUSE is unavailable, run it with --appimage-extract-and-run.
  All packages include SHA-256 checksums and detached Minisign signatures, verified with packaging/update-key.pub.
  Full changelog: https://github.com/s1dashu/quiet-md/compare/v0.1.8...v0.1.9
