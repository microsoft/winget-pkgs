ShortDescription: 在 Windows 任务栏实时显示无线外设电量的轻量原生托盘应用。
Description: |-
  Octans 在 Windows 任务栏实时显示无线外设电量。它是一款轻量的原生托盘应用，可直接读取 2.4G 与蓝牙鼠标、键盘、耳机和手柄的电量，无需再安装各厂商的驱动套件。

  任务栏一眼看电量：点击面板中任意设备卡片即可将其固定到任务栏托盘，支持同时固定多台外设；取消最后一台后自动恢复极简透明托盘图标。
  三套可切换样式：内置 Octans（液态渐变波纹）、Nebula（经典电量环）与 Pulsar（大号数字电量），并提供滑杆微调托盘图标大小。
  极低资源占用：静默驻留托盘时 0% CPU、内存小于 5 MB，不加载显卡 3D 驱动或浏览器内核；面板隐藏后释放缓冲，全程零后台联网与零遥测。
  免驱动即插即用：自动监听 USB 2.4G 接收器热插拔与 Windows 休眠唤醒，不必再让 Logitech G HUB、Razer Synapse 等套件常驻后台。
  广泛的设备支持：支持 30+ 主流品牌的 2.4G 无线鼠标、键盘、耳机与手柄。
