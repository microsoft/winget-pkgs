  本次新增与修复
  - 迈从 MCHOSE QHW V3 无线键盘协议（核对自官方 M HUB 网页驱动源码）：
    - 新增 G87 V3（3837:1015 2.4G / 3837:2029 有线）、K87 V3（3837:2023）、G98 V3（3837:2025）及同协议 0xFF80:0x0001 键盘支持；
    - 完整实现 QHW Report 0x4D（flags=0x03、0x0904 电量查询 + 0x0900 状态/休眠兜底、32B/64B/65B 报文与 0xFF 忙帧退避）。
  - 迈从 MCHOSE GLW 无线键盘协议：
    - 同步新增 K99 V3 / G87 V2 (8K) / G75 V2 (8K) / K87S（3837:3033 2.4G 及 200E/2020/2021 有线，0x0001:0x0000 与 0xFF31:0x0074 通道，0x55 0x04/0x05 槽位块解析 + FA FB 07 推送）。
  - 飞智 Flydigi V2 手柄私有 HID 协议直读（逐字节对齐 SDL3 SDL_hidapi_flydigi.c）：
    - 新增 八爪鱼 5（Apex 5，37D7:2501）、黑武士 5 Pro（Vader 5 Pro，37D7:2401）、八爪鱼 6（Apex 6，37D7:2502） 2.4G 接收器与有线模式直读，解决 XInput 将 2.4G 接收器误判为有线手柄导致无电量的问题；
    - 自动适配 Report ID 0x03 / 0x00 与 0xFFA0:0x0001（兼容 0xA0FF），内置时间窗排空高频 0xEF 输入流并自动排除 37D7:6001 CD2 充电底座。
    - 注：飞智八爪鱼 5 / 黑武士 5 Pro 原厂固件按 5 档（×20%）上报电量，八爪鱼 6 按 10 档（×10%）上报；八爪鱼 5 建议更新至官方最新固件（>= 7.0.3.1）。
  - 底层 HID 解析修复：
    - core/hid_parse.c 新增 HidP_GetButtonCaps Report ID 采集，修复仅在 ButtonCaps 声明 Output/Feature Report ID（如八爪鱼 5 0x03）时漏检的问题。

