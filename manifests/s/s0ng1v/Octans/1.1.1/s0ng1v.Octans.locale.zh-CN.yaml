ReleaseNotes: |-
  Octans v1.1.1
  更新内容
  - 新增雷柏（Rapoo）VT0 / 二代 N54 全系鼠标支持：
    - 精确支持 VT0（24AE:1410/4610）、VT0 MAX（1420/4620）、VT0 Air MAX（14A1/46A1）、VT0 MAX 大师版（144A/464A），以及二代 VT1 / VT3 / VT7 / VT9 系列。
    - 修复 Windows 下 Report ID 0x07 前导字节偏移、网吧版 0xB0 偏移、满电状态（state=3）识别与路由优先级问题。
    - 新增 HidD_GetInputReport(0x07) 零写入即时直读，鼠标静止/休眠或与官方 A-HUB 并存时均可直接秒读电量。
  - 单元测试与清单更新：新增 19 项实机报文与路由断言，全部 557/557 项通过；同步更新中英文 README 与外设清单。
