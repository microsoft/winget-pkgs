ShortDescription: A lightweight native tray app that shows wireless peripheral battery levels in the Windows taskbar.
Description: |-
  Octans shows the battery level of your wireless peripherals right in the Windows taskbar. It is a lightweight native tray application that reads 2.4G and Bluetooth mice, keyboards, headsets and controllers without their vendor driver suites.

  At-a-Glance Taskbar Battery: Click any device card in the panel to pin it directly to the Windows system tray, with several peripherals pinned at the same time. Unpinning the last device restores the minimal transparent tray icon.
  Three Switchable Styles: Built-in Octans (liquid gradient wave), Nebula (classic battery ring) and Pulsar (large numeric readout), plus a slider to fine-tune the tray icon size.
  Ultra-Low Resource Footprint: Uses 0% CPU and under 5 MB of RAM while idle in the tray, without loading GPU 3D drivers or browser runtimes. Panel buffers are released when hidden, with no background telemetry.
  Plug-and-Play Without Vendor Bloat: Automatically tracks USB 2.4G receiver hot-plug events and Windows sleep and wake cycles, so Logitech G HUB, Razer Synapse and similar suites no longer need to stay running.
  Wide Device Support: Supports 2.4G wireless mice, keyboards, headsets and controllers from more than 30 mainstream brands.
