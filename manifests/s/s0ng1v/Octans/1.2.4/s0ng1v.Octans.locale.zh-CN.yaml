  本次新增与修复
  - 华硕 ASUS ROG 独立无线键盘直读（核对自 G-Helper AsusKeyboard 源码）：
    - 新增 ROG 游侠 Strix Scope RX TKL 无线版（0B05:1A07 2.4G） 电量与充电状态直读（注：该型号有线模式 0B05:1A05 固件本身不上报电量，请使用 2.4G 无线模式）；
    - 同步覆盖同协议的 ROG Claymore II（196B）、Strix Scope II 96 / 96 RX（1AAE/1B78）、Azoth / Azoth Extreme / SE / Azoth X（1A85/1A83/1B3F/1CEF/1C25/1C24）、Falchion / Falchion RX（193E/193C/1B04） 及 OMNI Falchion RX LP（自动兼容 [11] 电量偏移），并优先采用 Interrupt OUT（WriteFile）发送 00 12 01。
  - 修复游戏鼠标误识别为键盘的根因（如魔咖等 ODM 多集合鼠标）：
    - 新增跨接口组智能类型推断 octans_infer_kind_from_group：综合同设备全部 HID 接口与产品名（同时包含鼠标 0001:0002 与宏键盘 0001:0006 集合时以 MI_00 主接口为准），不再受 Windows 枚举顺序影响，并自动修正 0xFFFF 公模通配与广谱扫描的设备类型。
  - 右键菜单新增「设备图标」一键切换与持久化：
    - 右键面板中的任意设备卡片（或托盘已固定设备图标），即可在菜单内直接切换 鼠标 / 键盘 / 头戴耳机 / 入耳耳机 / 游戏手柄 / 触控笔 / 音箱 7 种矢量图标，面板与任务栏托盘 0ms 实时联动更新（3 套皮肤全适配），并自动持久化保存，支持一键 「恢复默认」。

