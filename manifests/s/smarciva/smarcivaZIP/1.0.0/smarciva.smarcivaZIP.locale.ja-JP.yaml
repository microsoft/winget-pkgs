ShortDescription: Lhaplus の使い心地のまま、今の書庫に対応した圧縮・解凍ソフト。ダブルクリックで解凍、右クリックで圧縮。
Description: |-
  Lhaplus と同じく、書庫をダブルクリックすれば解凍、ファイルを右クリックすれば形式を選んで圧縮できる、余計なことをしない圧縮・解凍ソフトです。
  7-Zip を使って RAR5・Zstandard・XZ・LZH など数十形式を解凍し、ZIP（AES-256 暗号化を含む）・7z・tar 系で圧縮できます。
  海外製 ZIP の文字化けを自動で判定して直し、macOS で作られた書庫の濁点の分解や __MACOSX / .DS_Store も片付けます。Zip Slip や Zip Bomb も防ぎます。
  20 言語に対応。利用者ごとのインストールで、管理者権限は要りません。
