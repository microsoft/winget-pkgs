ShortDescription: A simple archiver in the spirit of Lhaplus - double-click to extract, right-click to compress.
Description: |-
  smarcivaZIP keeps the simplicity of Lhaplus - double-click an archive to extract it, right-click files to compress them - and brings it up to date.
  It extracts RAR5, Zstandard, XZ, LZH and dozens of other formats through 7-Zip, creates ZIP (including AES-256), 7z and tar archives, detects and repairs garbled (mojibake) file names in ZIP archives, normalizes macOS file names and drops __MACOSX / .DS_Store, and blocks Zip Slip and Zip Bomb archives.
  The interface is available in 20 languages. Installs per user; no administrator rights are needed.
