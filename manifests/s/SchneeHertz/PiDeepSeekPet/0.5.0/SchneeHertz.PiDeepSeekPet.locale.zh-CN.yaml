ShortDescription: 独立的 Windows 桌面宠物，通过本机 HTTP bridge 展示 Pi 的运行状态。
Description: Pi DeepSeek Pet 是一个独立的 Windows 桌面宠物，通过仅监听 127.0.0.1 的本机 HTTP bridge 展示 Pi 的运行状态。它以透明、无边框、置顶的窗口呈现 97 个 640×360 VP9 Alpha WebM 动画，支持待机随机链、转向、漫游、点击反馈、拖拽和气泡，并将 Pi 的 thinking、responding、tool、waiting、compacting 等状态映射为相应的动画。应用可独立离线使用，不需要先启动 Pi。
