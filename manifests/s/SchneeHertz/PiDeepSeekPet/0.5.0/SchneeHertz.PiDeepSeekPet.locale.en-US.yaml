ShortDescription: A standalone Windows desktop pet that visualizes the runtime status of Pi through a secure loopback HTTP bridge.
Description: Pi DeepSeek Pet is a standalone Windows desktop pet that visualizes the runtime status of Pi through a secure loopback HTTP bridge. It renders 97 640×360 VP9-alpha WebM animations in a transparent, frameless, always-on-top window, with idle random chains, turning, roaming, click feedback, dragging, and speech bubbles. Pi states such as thinking, responding, tool, waiting, and compacting are mapped to matching animations. The app works offline on its own and does not require Pi to be running first.
