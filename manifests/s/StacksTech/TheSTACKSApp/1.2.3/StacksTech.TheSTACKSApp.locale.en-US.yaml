ShortDescription: Device buyback, repair and resale operations for phone stores.
Description: |-
  The STACKS App runs the day to day operations of a phone store: device
  buyback, repair tracking, inventory and resale. Connect an iPhone or Android
  handset over USB and it reads the IMEI, serial, model, storage and battery
  health directly from the device, then saves the result to inventory.

  Reading iPhone details requires Apple's device service, available as iTunes
  or the free Apple Devices app from the Microsoft Store. Android handsets are
  detected without any additional software.
