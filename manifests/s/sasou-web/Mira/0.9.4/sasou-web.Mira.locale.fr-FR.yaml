ReleaseNotes: |-
  Mira pour Mac comme Windows, Mira web retirée, groupe visible, pages plus fluides.
  - Mira pour Mac comme sous Windows: Fiche, Réglages, lecteur, avis, connexion, menus : le Mac reprend ce que Windows avait déjà, avec une vraie barre des menus.
  - Mira se concentre sur ses apps: Mira web est retirée. La party d’un ami s’ouvre dans Mira sur Windows, Mac et iPhone, sans navigateur.
  - On voit qu’on est dans un groupe: Un bouton du groupe, avec le nombre de personnes, se voit sur chaque page sous Windows, Mac et iPhone.
  - Défilement et pages plus fluides: Sous Windows, défiler suit enfin l’écran ; sur Mac, revenir à une page est instantané.
  - Une interface plus calme: Favori et Vu gardent leur forme, le flash lecture/pause est l’icône seule, moins d’avis inutiles, et l’iPhone s’ouvre sur le « m » de Mira.
