ShortDescription: A cinema-style Jellyfin client for Windows, with mpv built in.
Description: 'Mira plays your Jellyfin library in a native Windows app with mpv: direct play of almost any file, skip intros, watch together with friends, subtitles kept on your server, and, on the PC that runs Jellyfin, its setup in a few clicks. Also for Mac and iPhone. Free and open source, no account but your Jellyfin.'
