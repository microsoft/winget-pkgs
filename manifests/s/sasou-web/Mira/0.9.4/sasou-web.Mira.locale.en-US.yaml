ReleaseNotes: |-
  Mira for Mac like Windows, the browser version retired, a visible group, smoother pages.
  - Mira for Mac like Windows: Title page, Settings, player, notices, sign-in, menus: the Mac gets what Windows already had, with a real menu bar.
  - Mira goes all-in on its apps: The browser version is retired. A friend’s party opens in Mira on Windows, Mac and iPhone, without a browser.
  - You can see you’re in a group: A group button, with the number of people, shows on every page on Windows, Mac and iPhone.
  - Smoother scrolling and pages: On Windows, scrolling finally keeps up with the screen; on Mac, going back to a page is instant.
  - A calmer interface: Favorite and Watched keep their shape, the play/pause flash is the icon alone, fewer needless notices, and the iPhone app opens on Mira’s “m”.
