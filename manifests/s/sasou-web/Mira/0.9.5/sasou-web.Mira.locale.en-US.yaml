ReleaseNotes: |-
  Mac recovers stalled streams, Jellyfin remote control, more filters, the iPhone offline.
  - A sturdier Mac: Stalled streams and sleep recovered, media keys, new-episode notifications, the window reopens where you left it, ⌘W leaves Mira in the Dock.
  - More filters, a remote: Filter by picture (4K), rating and languages; Jellyfin can control Mira, and the iPhone can play on another device.
  - iPhone: offline, QR code, cellular: Keep a title on the iPhone, sign in by scanning a QR code, quality capped on cellular, trailers and a page for each person.
  - Calmer evenings: Night sound, hidden spoilers, “Still watching?” and a couch mode for the TV.
  - Privacy and report: A page lists everything that leaves your device, and a report can be attached when you report a problem.
