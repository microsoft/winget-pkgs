ReleaseNotes: |-
  Le Mac rattrape les flux bloqués, télécommande, plus de filtres, iPhone hors connexion.
  - Le Mac, plus solide: Flux bloqué ou veille rattrapés, touches multimédias, notifications de nouveaux épisodes, fenêtre rouverte à sa place, ⌘W qui laisse Mira dans le Dock.
  - Plus de filtres, une télécommande: Filtrer par image (4K), note et langues ; Jellyfin peut piloter Mira, et l’iPhone peut lire sur un autre appareil.
  - L’iPhone : hors connexion, QR code, 4G: Garder un titre sur l’iPhone, se connecter en scannant un QR code, qualité plafonnée en 4G, bandes-annonces et page d’une personne.
  - Soirées plus tranquilles: Son de nuit, spoilers cachés, « Tu regardes toujours ? » et mode canapé pour la télé.
  - Confidentialité et rapport: Une page dit tout ce qui part sur le réseau, et un rapport se joint à un signalement de problème.
