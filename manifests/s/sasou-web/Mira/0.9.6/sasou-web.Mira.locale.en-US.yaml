ReleaseNotes: |-
  The Mac shuts down cleanly, Jellyfin without the extension, a safer player, 30 languages.
  - Mac: Shutting down, restarting or logging out is no longer interrupted by Mira.
  - Mac: Updates install from the Dock, and a hidden window asks Jellyfin nothing.
  - Mac: Install Mira’s extension on Jellyfin from the Mac, like on Windows.
  - Jellyfin: Without the extension: no empty Downloads, empty libraries or dead invite link.
  - Player: The server’s https:// certificate is checked before the token is sent.
  - Player: Subtitles: only forced ones when the audio is in your language.
  - Languages: 30 languages for audio and subtitles, the device’s own first.
  - Security: GitHub attestations, VirusTotal and a wiki page to verify a file.
