ReleaseNotes: |-
  Le Mac s’éteint sans accroc, Jellyfin sans extension, lecteur plus sûr, 30 langues.
  - Mac: Éteindre, redémarrer ou fermer la session n’est plus interrompu par Mira.
  - Mac: Mise à jour depuis le Dock, et rien demandé à Jellyfin fenêtre cachée.
  - Mac: Installer l’extension Mira sur Jellyfin depuis le Mac, comme sous Windows.
  - Jellyfin: Sans l’extension : plus de Téléchargements vide, de bibliothèques vides ni de lien mort.
  - Lecteur: Le certificat https:// du serveur est vérifié avant d’envoyer le jeton.
  - Lecteur: Sous-titres : seulement les forcés quand l’audio est dans ta langue.
  - Langues: 30 langues pour l’audio et les sous-titres, celle de l’appareil en premier.
  - Sécurité: Attestations GitHub, VirusTotal et une page du wiki pour vérifier un fichier.
