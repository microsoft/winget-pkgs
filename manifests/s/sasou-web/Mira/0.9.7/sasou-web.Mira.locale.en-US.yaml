ReleaseNotes: |-
  Settings in a window, episodes in a grid, true-black OLED background, about a hundred bugs fixed.
  - Settings: Settings and Help open in a window, with a search (Windows, Mac).
  - Series: Episodes in a grid of pictures, missing ones in their place (every screen).
  - Look: True-black background everywhere, buttons without animation, cast in one row.
  - Library: Filters open over the grid, each choice shown as a chip.
  - Player: The mini-player tucks against the edge; scrolling stops dead.
  - Playback: Multi-file films, rewatched titles and chosen tracks are respected.
  - Reliability: About 85 bugs fixed: kept copies, ended sessions, Tailscale, party.
