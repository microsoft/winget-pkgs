ReleaseNotes: |-
  Réglages en fenêtre, épisodes en grille, fond noir OLED, une centaine de bugs corrigés.
  - Réglages: Réglages et Aide s’ouvrent dans une fenêtre, avec une recherche (Windows, Mac).
  - Séries: Les épisodes en grille d’images, ceux qui manquent à leur place (tous les écrans).
  - Apparence: Fond noir pur partout, boutons sans animation, casting en une rangée.
  - Bibliothèque: Les filtres s’ouvrent par-dessus la grille, chaque choix en pastille.
  - Lecteur: Le mini-lecteur se range contre le bord ; un défilement qui s’arrête net.
  - Lecture: Films en plusieurs fichiers, titres revus et pistes choisies respectés.
  - Fiabilité: Environ 85 bugs corrigés : copies gardées, session finie, Tailscale, party.
