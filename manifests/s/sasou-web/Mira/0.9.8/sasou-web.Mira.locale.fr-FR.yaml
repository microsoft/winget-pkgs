ShortDescription: Un client Jellyfin « cinéma » pour Windows, avec mpv intégré.
Description: 'Mira lit ta bibliothèque Jellyfin dans une vraie app Windows avec mpv : lecture directe de presque tous les fichiers, intros passées, regarder ensemble avec des amis, sous-titres gardés sur ton serveur et, sur le PC de Jellyfin, son installation en quelques clics. Aussi pour Mac et iPhone. Libre et gratuit, aucun compte à part ton Jellyfin.'
