ReleaseNotes: |-
  Télécharger les épisodes manquants, un défilement sans à-coup, un mini-lecteur plus vif.
  - Séries: Un bouton télécharge les épisodes et les saisons qui manquent (Windows, Mac, iPhone).
  - Défilement: La molette n’à-coupe plus : chaque cran reprend la page à sa vitesse (Windows, Mac).
  - Lecteur: Le mini-lecteur sort et se range plus vite ; la vitesse de lecture est retirée.
  - Réglages: Coins de la fenêtre Réglages, plus d’éclair blanc dans le rail, onglet recliqué calme.
  - Apparence: Survol sans liseré, pastilles arrondies comme les boutons, carrousel sans survol.
  - iPhone: L’écran de chargement attend Jellyfin en 5G au lieu d’afficher une erreur.
