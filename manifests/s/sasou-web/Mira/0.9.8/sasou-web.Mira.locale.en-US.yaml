ReleaseNotes: |-
  Download missing episodes, scrolling without jolts, a quicker mini-player.
  - Series: A button downloads the missing episodes and seasons (Windows, Mac, iPhone).
  - Scrolling: The wheel no longer jolts: each notch takes the page up at its speed (Windows, Mac).
  - Player: The mini-player slides out and tucks away faster; the playback speed choice is gone.
  - Settings: Settings window corners fixed, no white flash in the rail, a re-clicked tab stays calm.
  - Look: Hover without a dark edge, chips rounded like the buttons, carousel without hover.
  - iPhone: The opening screen waits for Jellyfin on 5G instead of showing an error.
