ShortDescription: A desktop disk-space explorer with a nested, zoomable treemap.
Description: |-
  SpaceBadger shows what fills a folder or drive as a nested, zoomable treemap that updates live while it scans.
  Select, zoom, and follow breadcrumbs; filter by file name, folder, or file type; color the map by folder depth or file type; show items in Explorer; and move selected items to the Recycle Bin behind explicit safeguards.
  When a whole drive is scanned, the volume overview shows files found, used space not attributed to any file, and free space.
  Portable: nothing is installed beyond the program itself.
