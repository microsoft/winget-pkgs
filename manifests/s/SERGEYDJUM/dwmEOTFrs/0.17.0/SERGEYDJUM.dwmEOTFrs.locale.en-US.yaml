ShortDescription: Utility that fixes Windows sRGB to scRGB "gamma" by patching DWM shaders
Description: |-
  An alternative implementation of the same idea that is behind dwm_eotf.

  It has additional features, such as system tray controls, autostart and shader dumping. This version
  is also more reliable, as it does not require multiple tries for it to work (as far as I can tell).

  dwm_eotf_rs works by reading memory of the loaded dwmcore.dll module, patching shaders that are
  responsible for incorrect SDR to HDR conversions there and writing it back.
ReleaseNotes: |-
  ## What's Changed
  • fix：Windows' modern UI (Mica material) and other apps that rely on transparency looked wrong when boosting brightness
  • feat：add Multi-Plane Overlay toggle (`-m false/true`) that tweaks DWM's OverlayTestMode registry value (**see notes below!!!**)
  • feat：add `-n/--nits` option to set the desired SDR content brightness. `--brightness` option with `dwm_eotf`-compatible math still works
  • feat：add two new shaders (possibly for older devices) to the main SDR-to-HDR whitelist

  ## New Contributors
  • @Gabarsolon made their first contribution in https://github.com/SERGEYDJUM/dwm_eotf_rs/pull/11

  **Full Changelog**：https://github.com/SERGEYDJUM/dwm_eotf_rs/compare/v0.14.1...v0.17.0

  ## Notes
  • The new, optional MPO toggle (`-m false`) extends `dwm_eotf_rs'` reach to _windowed_ SDR games and apps that normally bypass DWM and this app's efforts to fix gamma mismatch (including Chromium/Electron/NW.js/etc-based). It can even force the fix onto Chromium-derived browsers, if you disable HDR there with a flag. The process is a little involved, so **you should read the "Multi-Plane Overlay" and updated "Known Issues" sections of ReadMe**.
  • Currently, the `--nits` option uses the highest value of SDR content brightness slider (the one in Windows HDR Settings) stored in registry. You might want to max out the slider to avoid issues with multiple monitors or disconnected HDR displays with registry leftovers.
  • Thanks to @Gabarsolon, who determined which shaders must be patched to fix transparency issues.

  ### Old Notes
  • The "set and forget" way to use the app is to put the executable somewhere safe and run it once with `-c schedule`, then run again with `-c` or reboot.
  • This app requires admin rights for process memory manipulation, utilizes PowerShell for autostart registration and reads/writes to registry.
