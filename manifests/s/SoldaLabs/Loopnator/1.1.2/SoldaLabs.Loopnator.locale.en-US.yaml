ShortDescription: "Mouse and keyboard recorder: record once, replay with loops, speed control and a failsafe."
Description: |-
  A mouse and keyboard recorder for Windows. Records input with millisecond precision and replays it any number of times, with loop counts, 0.5x-4x speed control, a sequence editor, screen-colour triggers, a scheduler and a built-in failsafe: moving the real mouse stops the replay instantly. Single portable executable, 100% local with no telemetry. Paid app (one-time purchase) with a free 3-day trial; keyboard recording and advanced features are part of the Pro edition.
