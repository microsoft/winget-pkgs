ShortDescription: Ultra-lightweight, zero-knowledge P2P voice chat and 1080p60 screen sharing built in pure Rust.
Description: |-
  SquadAir is a fast, native desktop voice chat and screen-sharing app built in pure Rust for gamers and squads who want clear, low-latency comms without Electron bloat, accounts, or central media servers.
  Includes 10 ms Opus audio with WebRTC AEC3 and RNNoise, free 1080p 60fps screen sharing, ChaCha20-Poly1305 end-to-end encryption, 6-digit SPAKE2 voice codes, X25519 friends, LAN rooms with host failover, and a click-through in-game HUD overlay.
