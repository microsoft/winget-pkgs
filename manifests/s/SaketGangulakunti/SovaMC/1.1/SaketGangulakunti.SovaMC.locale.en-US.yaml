ShortDescription: A clean, modern custom Minecraft launcher.
Description: SovaMC Launcher is a clean, modern custom Minecraft launcher. It scans your .minecraft folder, lists every installed version (vanilla, Forge, Fabric, Quilt), and lets you pick one and launch. Supports downloading new versions, Modrinth mods and modpacks, SovaClient performance mods, server favorites, shaders, launch profiles, and optional Microsoft account sign-in.
