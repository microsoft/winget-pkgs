ShortDescription: Cross-platform CalDAV task management app
Description: |-
  Chiri is a cross-platform CalDAV task management app for organizing tasks and to-dos across devices.
  It syncs with CalDAV servers like Fastmail, Nextcloud, Radicale and Baikal, so your tasks stay up to date on Windows, macOS, and Linux.
