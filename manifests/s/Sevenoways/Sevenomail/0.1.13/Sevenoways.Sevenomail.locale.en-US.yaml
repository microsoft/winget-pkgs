ShortDescription: A fast, private email client for Windows that brings all your accounts into one inbox.
Description: |-
  Sevenomail brings your work, personal and Gmail accounts together in one calm, fast inbox.
  Images from the internet stay blocked until you choose to load them, emails can't run scripts,
  and passwords are kept in Windows Credential Manager. Supports IMAP (with push) and POP3,
  conversations, attachments, notifications and a tray icon.
