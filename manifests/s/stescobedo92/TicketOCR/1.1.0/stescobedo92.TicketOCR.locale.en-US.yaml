ShortDescription: Native C++20 desktop GUI and CLI that extracts structured error details from screenshots with Anti-Moire DSP, Zero-Leakage DLP redaction, and ITSM ticket pre-filling.
Description: |-
  TicketOCR Studio is a high-performance native C++20 desktop application (Per-Monitor HiDPI Win32/GDI+ GUI) and CLI automation tool designed to eliminate manual transcription of error screenshots in L1/L2/L3 IT Support and Service Desk operations.
  It processes desktop captures and smartphone photos of monitors (mitigating Moire interference, uneven illumination, and Dark Mode UIs), extracts structured diagnostic entities (error codes, module names, software versions, sanitized URLs, and error messages), redacts sensitive PII and credentials (emails, JWTs, API keys, URL secrets, and payment card PANs) with zero leaks, classifies incidents across support queues, recommends Knowledge Base (KB) articles, and exports ready-to-use ITSM tickets in JSON and Markdown formats.
