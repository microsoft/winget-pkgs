ReleaseNotes: |-
  - Added custom multi-resolution Windows application icon (16px to 256px) and native Win32 PE version resource metadata.
  - Included Per-Monitor HiDPI Win32/GDI+ desktop GUI with runtime Light/Dark theme switching and English/Spanish i18n menus.
  - Included headless CLI for single-image analysis, Knowledge Base export, synthetic corpus generation, and quantitative KPI benchmarking.
