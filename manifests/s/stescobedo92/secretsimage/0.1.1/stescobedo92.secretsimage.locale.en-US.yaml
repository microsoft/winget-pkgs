ReleaseNotes: |-
  - Windows executable now carries complete VERSIONINFO metadata (product,
    company, file/product version, description, copyright) generated from
    the project version alongside the embedded icon.
  - End-user release archives no longer bundle `gen_synthetic`, a
    test-corpus development tool; it remains available in per-commit CI
    artifacts and from source builds.

  First published in 0.1.0: multi-scale OCR via Tesseract, secret/PII
  detection (vendor tokens, JWTs, connection strings, labelled assignments,
  e-mail, private IPs, IPv6, Luhn-validated cards, mod-97-validated IBANs,
  SSNs, high-entropy tokens), irreversible solid-fill redaction with an
  audit log that never contains values, clipboard watch mode, and
  `redact`/`scan`/`watch` CLI modes.
