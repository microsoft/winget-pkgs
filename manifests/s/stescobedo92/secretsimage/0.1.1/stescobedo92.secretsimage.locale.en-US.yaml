InstallationNotes: |-
  Tesseract OCR is a hard runtime dependency and is installed automatically
  (UB-Mannheim.TesseractOCR). secretsimage finds it on PATH or in the
  standard installer location (C:\Program Files\Tesseract-OCR); set
  SECRETSIMAGE_TESSERACT to point at a custom install.
ShortDescription: Automatic, irreversible redaction of secrets and personal data in screenshots
Description: |-
  Screenshots get pasted into Jira, Slack, Teams, Word documents and pull
  requests with tokens, connection strings, e-mail addresses, internal IPs
  and client names in plain sight. Secret scanners read text and code, not
  images, so a credential inside a PNG passes without an alarm. secretsimage
  sits between the screenshot and the paste: it OCRs the image, finds
  sensitive regions, covers them with a solid fill (never blur, which is
  reversible), and writes an audit log of what was covered. The audit log
  never contains the secret values themselves.

  Modes:
  - `secretsimage watch` — clipboard interception daemon: every new clipboard
    image is redacted before you paste it anywhere.
  - `secretsimage redact in.png -o out.png` — file mode for attachments and
    documentation images, plus an audit report.
  - `secretsimage scan img...` — detection only; exit code 2 when secrets are
    present, for CI gates over documentation images.

  Detects AWS/GCP keys, GitHub and Slack tokens, JWTs, Bearer tokens,
  private-key headers, connection strings, labelled assignments
  (`password = ...`), e-mail addresses, private IPv4 addresses, IPv6,
  Luhn-checked credit-card numbers, mod-97-checked IBANs, US SSNs, and
  generic high-entropy tokens.
