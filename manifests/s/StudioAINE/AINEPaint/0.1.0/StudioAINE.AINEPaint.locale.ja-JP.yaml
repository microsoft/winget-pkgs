ShortDescription: Windows向けの無料お絵描きソフト
Description: |-
  AINE Paint は、Windows 向けの無料のお絵描きソフトウェアです。
  はじめて絵を描く人でも迷わないことを設計の基準に置いています。

  ペン・鉛筆・消しゴム、筆圧、レイヤー、長方形となげなわによる選択範囲と移動・拡大縮小・回転、
  塗りつぶし、カラーピッカー、スポイト、50回まで戻せる操作履歴を備えています。
  独自形式 .ainpaint での保存と、透明を保持した PNG の書き出しに対応しており、
  PNG や JPEG を読み込んで描き足すこともできます。

  広告は表示されません。
