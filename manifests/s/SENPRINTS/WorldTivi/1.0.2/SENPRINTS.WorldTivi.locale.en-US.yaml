ShortDescription: Simple, fast IPTV player for your own M3U playlists, Xtream Codes and Stalker portals. Provides no channels or content.
Description: |-
  World Tivi plays live TV from your own IPTV sources: M3U playlists, Xtream Codes accounts and Stalker portals, with a TV-style guide (XMLTV), favourites, recently watched and a picture that floats on top of other apps.
  World Tivi does not provide any channels or content; you add your own playlist.
  The app is free; World Tivi Plus is an optional paid upgrade.
