ShortDescription: Compiled systems language with a self-hosted compiler, deterministic cleanup, and built-in web, UI and game libraries.
Description: 'Salivo is a compiled systems language that lets one developer build command-line tools, web APIs, browser frontends and desktop games in a single language. Why choose it: no garbage collector and no manual memory management, because values free what they own when they leave scope, and the Drop trait handles your own cleanup. Programs compile to small, fast native executables or WebAssembly. The standard library has the essentials built in, with no package downloads needed: HTTP/1.1 and HTTP/2 server, PostgreSQL, MySQL and SQLite, JSON, regex, compression, cryptography, a reactive WebAssembly UI framework, and a 2D/3D game engine. Builds are fast, and unchanged programs start in milliseconds. The syntax is clean, with postfix ? error handling and string interpolation. The compiler is written in Salivo itself. The SDK includes the compiler (sf), package manager (spm), language server, formatter, linter and documentation tool, plus a VS Code extension.'
