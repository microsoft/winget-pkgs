ShortDescription: 'Safe native code without the ceremony: no garbage collector, no borrow checker, and a web server, databases and UI built in.'
Description: 'Salivo is a compiled systems language for command-line tools, web backends, browser frontends and desktop games, all in one language. Values free what they own when they leave scope, so there is no garbage collector, no manual free and no lifetime annotations, and reading past the end of a list stops with a clear error instead of corrupting memory. Checks stay out of your way: live errors as you type, a type check in about 40 ms, a linter that can fail a build on any warning, Result and Option with postfix ? for errors, and match that must cover every case. Programs build in about a quarter of a second into small native executables or WebAssembly. The standard library includes an HTTP/1.1 and HTTP/2 server, PostgreSQL, MySQL and SQLite, JSON, regex, compression, cryptography, async tasks, a reactive WebAssembly UI framework and a 2D and 3D game engine, with nothing to download. The compiler is written in Salivo and builds itself. The SDK includes the compiler (sf), package manager (spm), language server, formatter, linter and documentation tool, plus a VS Code extension.'
