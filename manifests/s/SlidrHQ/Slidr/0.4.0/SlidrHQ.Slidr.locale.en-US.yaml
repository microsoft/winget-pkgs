ShortDescription: Open-source AI presentation editor. Describe a deck, watch it build, edit every slide.
Description: |-
  Slidr is a free, open-source presentation editor in which AI is a full editing partner.
  Describe the deck in a few lines and watch an AI agent build it on the stage: layouts, charts and photos, checked for contrast, overflow and alignment.
  Every slide is made of real objects you can move, retype and restyle, by hand or by chat.
  It runs on the AI account you already have (Claude, ChatGPT, GitHub Copilot, Gemini or Grok), with no account of its own and no telemetry.
  It imports HTML and PowerPoint, and exports .pptx or one self-contained HTML file. 16 languages, including right-to-left.
