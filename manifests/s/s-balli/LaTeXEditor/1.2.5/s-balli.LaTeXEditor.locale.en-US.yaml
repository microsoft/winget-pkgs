ShortDescription: Notepad++-style LaTeX editor with instant PDF preview and SyncTeX
Description: A lightweight desktop LaTeX editor for Windows and Linux. Edit, compile and preview in one window; editing and compiling work offline. Instant PDF preview after every save, two-way SyncTeX navigation between source and PDF, project-wide search across .tex/.bib/.cls files, a bibliography manager that adds sources by DOI, three engines (lualatex, pdflatex, xelatex), seven themes and a Turkish/English interface. Handles Turkish-character problems in IEEE and ASYU templates and fixes projects imported from Overleaf. A failed compile tells you which package to install. The download contains the editor only; a LaTeX distribution such as TeX Live is installed separately.
