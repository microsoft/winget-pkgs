ReleaseNotes: |-
  What's Changed
  While the Dictionary Loads
  A small release after 1.2.4.
  - Closing the app while the spell-check dictionary was still loading no
    longer crashes it on exit. Loading a dictionary takes a few seconds;
    if the window closed in that time, the app crashed on the way out. It
    now waits for the load to finish before it exits.
  - Switching the spell-check language while a dictionary was loading no
    longer checks with the old one. The text was marked with the
    dictionary that was loading instead of the one you picked. The app now
    remembers the latest choice and loads it as soon as the current load
    finishes.
  - The PDF preview uses PDFium 156. The packages carry pypdfium2 5.14.0
    (1.2.4 had 5.13.0 with PDFium 153). The full test suite passes with it
    on Windows, Linux and macOS, and the packages change by less than
    0.1 MB.
  - Tests: a helper that read an already closed PDF page under pypdfium2
    5.14.0 is fixed, and a test that hangs now leaves the stack of every
    thread in the log after five minutes.
  4671 tests, up from 4668.
  Installation
  > Warning: The app only includes the GUI. The LaTeX compiler (lualatex/pdflatex/xelatex) must be installed separately via TeX Live.
  Windows
  1. Install WSL (PowerShell, as administrator):
     wsl --install
  2. Install TeX Live in WSL:
     sudo apt-get update
     sudo apt-get install texlive-base texlive-binaries texlive-latex-base \
       texlive-latex-extra texlive-latex-recommended texlive-lang-european \
       texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \
       texlive-font-utils texlive-extra-utils biber texlive-publishers \
       texlive-humanities texlive-pstricks python3-pygments pandoc
  3. Download LaTeX_Editor_v1.2.5_Windows.exe and run.
  Linux
  Install TeX Live:
  sudo apt-get update
  sudo apt-get install texlive-base texlive-binaries texlive-latex-base \
    texlive-latex-extra texlive-latex-recommended texlive-lang-european \
    texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \
    texlive-font-utils texlive-extra-utils biber texlive-publishers \
    texlive-humanities texlive-pstricks libxcb-cursor0 python3-pygments pandoc
  Download LaTeX_Editor_v1.2.5_Linux_x86_64.AppImage, chmod +x and run.
  macOS (Apple Silicon)
  Install MacTeX:
  brew install --cask mactex
  Download LaTeX_Editor_v1.2.5_macOS_arm64.dmg, open it and drag the app to Applications. Then remove the download quarantine once:
  xattr -dr com.apple.quarantine "/Applications/LaTeX Editor.app"
  Without that command macOS refuses to open the app: the build is signed ad-hoc, not notarized, because notarization needs a paid Apple Developer ID. The command only clears the flag your browser attached to the download; it does not change the app. Intel Macs are not covered by this build.
  Minimum installation (basic compilation only)
  sudo apt-get update
  sudo apt-get install texlive-base texlive-binaries texlive-latex-base \
    texlive-latex-recommended texlive-luatex texlive-xetex libxcb-cursor0
  Kurulum
  > Önemli: Uygulama yalnızca GUI'yi içerir. LaTeX derleyicisi (lualatex/pdflatex/xelatex) ayrıca TeX Live ile kurulmalıdır.
  Windows
  1. WSL kur (PowerShell, yönetici olarak):
     wsl --install
  2. WSL içinde TeX Live kur:
     sudo apt-get update
     sudo apt-get install texlive-base texlive-binaries texlive-latex-base \
       texlive-latex-extra texlive-latex-recommended texlive-lang-european \
       texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \
       texlive-font-utils texlive-extra-utils biber texlive-publishers \
       texlive-humanities texlive-pstricks python3-pygments pandoc
  3. LaTeX_Editor_v1.2.5_Windows.exe'yi indir ve çalıştır.
  Linux
  TeX Live kur:
  sudo apt-get update
  sudo apt-get install texlive-base texlive-binaries texlive-latex-base \
    texlive-latex-extra texlive-latex-recommended texlive-lang-european \
    texlive-luatex texlive-xetex texlive-fonts-extra texlive-science texlive-bibtex-extra \
    texlive-font-utils texlive-extra-utils biber texlive-publishers \
    texlive-humanities texlive-pstricks libxcb-cursor0 python3-pygments pandoc
  LaTeX_Editor_v1.2.5_Linux_x86_64.AppImage'i indir, chmod +x yapip calistir.
  macOS (Apple Silicon)
  MacTeX kur:
  brew install --cask mactex
  LaTeX_Editor_v1.2.5_macOS_arm64.dmg dosyasini indir, ac ve uygulamayi Applications klasorune surukle. Sonra indirme karantinasini bir kez kaldir:
  xattr -dr com.apple.quarantine "/Applications/LaTeX Editor.app"
  Bu komut olmadan macOS uygulamayi acmiyor: paket ad-hoc imzali, notarization yok, cunku notarization ucretli bir Apple Developer ID istiyor. Komut yalnizca tarayicinin indirmeye taktigi isareti siliyor, uygulamayi degistirmiyor. Intel Mac'ler bu yapinin kapsaminda degil.
  Minimum kurulum (sadece temel derleme)
  sudo apt-get update
  sudo apt-get install texlive-base texlive-binaries texlive-latex-base \
    texlive-latex-recommended texlive-luatex texlive-xetex libxcb-cursor0
  For detailed usage see README.
  Detaylı kullanım için README.tr.md.
