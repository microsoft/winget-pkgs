ReleaseNotes: |-
  Ctrl++ on Turkish Q

  A small release after 1.2.5.

  - Ctrl++ now enlarges the editor text on the Turkish Q keyboard. There
    the + sign is Shift+4, so the key arrives with Shift held and the
    editor did not treat it as Ctrl++. Ctrl+- made the text smaller, and
    the only way back was Ctrl+Numpad+.

  - The update check now writes its result to the app log: whether the
    app is up to date, which newer version it found, or why it could not
    reach GitHub. Before, a check that could not reach GitHub left no
    trace.

  - winget: the notes sent with the winget package are now this list
    only, not the whole release page with its install steps.

  4687 tests, up from 4671.
ReleaseNotesUrl: https://github.com/s-balli/latex-editor/releases/tag/v1.2.6
InstallationNotes: 'The editor only. To compile you also need WSL and TeX Live on Windows: run `wsl --install`, then in Ubuntu `sudo apt update && sudo apt install texlive-full`. Setup steps: https://s-balli.github.io/latex-editor/'
