ShortDescription: Simple room-to-room messaging for small offices, served from one PC to any browser on the office network.
Description: |-
  Dental Comms is a simple intra-office messaging system for dental and other small offices, like BlueNote Communicator. Install it on one Windows PC; staff open it in any web browser on the office network. Tap a room and a message button ("Doctor needed", "Patient is ready") and that room gets a color-coded alert with a chime that repeats until someone taps Got it, and the sender sees when it has been seen.
  No accounts, no passwords, nothing to install on staff computers, and nothing sent to the internet. For routine, non-urgent messages only: it is not an emergency, nurse-call or medical system. Formerly Dental Flow.
