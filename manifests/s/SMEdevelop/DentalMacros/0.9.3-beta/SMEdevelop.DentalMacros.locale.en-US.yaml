ShortDescription: Turn a spare keyboard or numpad into a grid of macro keys, Stream Deck style.
Description: |-
  Dental Macros turns a spare keyboard, numpad or Bluetooth macro pad into a grid of macro keys that you set up by pointing and clicking. It uses Windows' Raw Input API to tell which physical keyboard each keystroke came from, so the macro pad fires macros instead of typing while your main keyboard keeps working normally.
  Macros can type text, press key combinations, click, open programs and more. It runs entirely on your PC, with no network code and no accounts. Formerly MacroDeck.
