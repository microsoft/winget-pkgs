ReleaseNotes: |-
  image
  Changes in 3.0.1
  - Fixed the taskbar search box option being greyed out on some Windows 11 taskbars (#761)
  - Fixed searches typed with an IME only showing results after adding a trailing space in the deskband (#762)
  - Further translation updates via Crowdin 💖
  Changes in 3.0.0
  - Added a taskbar search box that embeds into the default Windows 11 taskbar
  - Added support for the Everything 1.5 SDK which comes with big performance improvements when listing search results
  - EverythingToolbar now waits for Everything to become available instead of showing no results when it isn't running yet
  - Fixed the global keyboard shortcut being missed or delivered late after the app had been idle (#754)
  - The "Disable animations" setting now covers all remaining animations
  - Tooltips are now themed to match the rest of the interface
  - Fixed "Run as administrator" always being visible in the result context menu
  - Fixed the update notification banner not appearing for certain version increments
  - Custom actions: the first matching rule now wins, and valid regular expressions are no longer rejected
  - Fixed the taskbar pin icon not updating after re-pinning
  - Search queries no longer block the UI thread
  - Fixed the settings crashing when the autostart registry entry could not be read or written
  - Fixed Everything's filters failing to load when the filter file contains duplicate or missing columns
  - Various performance improvements to the result list, icon loading, and window animations
  - Improved translations via Crowdin 💖
