ReleaseNotes: |-
  Highlights
  - Added encrypted local management for multiple DeepSeek API keys, including balance and model catalog views.
  - Added local DeepSeek Responses and Chat Completions gateways with request logs, token usage, latency, and estimated cost.
  - Added one-click model configuration for Codex and DeepSeek Harness.
  - Refreshed the ChatGPT and DeepSeek account dashboards, model dialog, application icon, and interface screenshots.
  - Added the image creation workspace.
  - Fixed image creation so generation and model loading strictly use the account selected in the creation workspace, without cross-account failover.
  - Added up to three concurrent image-generation tasks across one or multiple conversations.
  - Kept each loading placeholder and generated image directly below its corresponding prompt, even when concurrent requests complete out of order.
  Downloads
  - macOS Apple Silicon: StarBox-0.2.0-mac-arm64.dmg
  - macOS Intel: StarBox-0.2.0-mac-x64.dmg
  - Windows x64 installer: StarBox-0.2.0-windows-x64.exe
  - Windows x64 portable archive: StarBox-0.2.0-windows-x64.zip
  Signing notice
  These binaries are currently unsigned. macOS Gatekeeper and Windows SmartScreen may display a warning when opening them.
