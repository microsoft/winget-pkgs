ShortDescription: A desktop app for managing ChatGPT and Codex accounts locally.
Description: StarBox is a locally run desktop application for managing ChatGPT and Codex accounts on Windows. Use it to manage multiple accounts, view quotas and available models, track requests and token usage, call models through a local gateway, and create images. Account credentials, usage records, and generated content are stored locally on your device.
