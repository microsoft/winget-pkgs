ShortDescription: Simple graphical user interface for the Windows Package Manager (winget). The user interface is in German.
Description: |-
  WPM is a simple, fast graphical front end for winget, written in Rust with egui.
  The user interface is available in German only.

  Features:
  - Show available updates and install them individually, selected or all at once
  - Pin packages to skip their updates, and unpin them again
  - List, filter, upgrade and uninstall installed programs
  - Search and install new packages from winget and the Microsoft Store
  - Optional tray icon and background mode with periodic update checks and Windows notifications
  - Optional start with Windows, optional updates with administrator rights
  - Export and import package lists, manage winget sources, full log of every winget command

  Requires Windows 10 or 11 with winget (App Installer).
  After installation, start WPM with the command "wpm" (for example via Win+R).
