InstallationNotes: |-
  WPM has no Start menu entry. Start it with the command "wpm" (for example via Win+R or in a terminal; open a new terminal first).
  WPM updates itself from within the app. Close WPM (also in the notification area) before upgrading or uninstalling it with winget from a terminal.
