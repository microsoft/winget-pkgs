ReleaseNotesUrl: https://github.com/Stanischewski/WPM/releases/tag/v0.2.2
InstallationNotes: |-
  WPM legt keinen Startmenü-Eintrag an. Start mit dem Befehl „wpm“ (z. B. über Win+R oder in einem neu geöffneten Terminal).
  WPM aktualisiert sich in der App selbst. Vor dem Aktualisieren oder Deinstallieren mit winget im Terminal bitte WPM beenden (auch im Infobereich).
