ShortDescription: Einfache grafische Oberfläche für den Windows-Paketmanager winget.
Description: |-
  WPM ist eine einfache, schnelle Oberfläche für winget, geschrieben in Rust mit egui.

  Funktionen:
  - Verfügbare Updates anzeigen und einzeln, ausgewählt oder alle installieren
  - Pakete anheften (Update ignorieren) und wieder lösen
  - Installierte Programme anzeigen, filtern, aktualisieren und deinstallieren
  - Neue Pakete in winget und im Microsoft Store suchen und installieren
  - Optional Symbol im Infobereich und Hintergrundbetrieb mit regelmäßiger Update-Suche und Windows-Benachrichtigungen
  - Optional mit Windows starten, optional Updates mit Administratorrechten
  - Paketlisten exportieren und importieren, winget-Quellen verwalten, Protokoll aller winget-Befehle

  Voraussetzung: Windows 10 oder 11 mit winget (App-Installer).
  Nach der Installation startet WPM mit dem Befehl „wpm“ (z. B. über Win+R).
Tags:
