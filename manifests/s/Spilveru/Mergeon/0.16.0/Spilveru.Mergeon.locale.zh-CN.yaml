ShortDescription: 使用 Rust 与 GPUI 编写的高性能 GPU 加速跨平台 Git 桌面客户端。
Description: |-
  使用 Rust 与 GPUI 编写的高性能 GPU 加速跨平台 Git 桌面客户端。

  主要功能
  - 提交历史与图形视图：可视化提交图、多提交选择、批量 cherry-pick/revert、ref 徽标，可按提交说明、作者、路径、分支、日期或代码内容搜索。
  - 本地更改与差异对比：统一差异与并排差异并支持 tree-sitter 语法高亮，可按文件、代码块或单行暂存/取消暂存/放弃更改，支持整文件切换、图片差异对比与差异内搜索。
  - 三方冲突解决器：内置文本、二进制、重命名以及增删冲突的解决界面，提供本地/远端/基线面板与继续、中止、跳过操作。
  - 分支、工作树与暂存：交互式 rebase、fixup 与 autosquash、分支对比、已合并分支清理、选择性暂存、Git 工作树、标签、远端与子模块。
  - 撤销 / 重做：按仓库维护的撤销/重做栈，覆盖提交、修补、合并、rebase、重置、分支/标签/暂存操作以及文件放弃。
  - GitHub 集成：OAuth 设备码登录、仓库浏览与克隆，并在侧边栏与状态栏显示 Pull Request 和 CI 检查状态。
  - 工作区与效率：多仓库标签页与命名工作区、可自定义的键盘快捷键、预览与固定文件标签页、文件历史与可跳转的 blame、命令面板、浅色与深色主题。
