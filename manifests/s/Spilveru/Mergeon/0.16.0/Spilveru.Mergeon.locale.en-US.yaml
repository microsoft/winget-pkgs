ReleaseNotes: |-
  What's New
  - Workspace Switcher Shortcut (#16) — Added a customizable Switch workspace shortcut (default Ctrl+Alt+W on Linux/Windows, ⌘⌥W on macOS) in Settings → Shortcuts, the Command Palette, and the titlebar workspace switcher tooltip. Pressing it opens a keyboard-first switcher where 0 jumps straight to All, 1–9 jump straight to workspaces 1–9, and ↑/↓/j/k/Enter/Esc or New workspace… work without touching the mouse.
  - Collapsible Branch Subfolders (#17) — Slash-delimited branches (e.g., feature/login, feature/auth/oauth, fix/crash) are now automatically grouped into nested collapsible folders in both Branches and Remotes, with branch counts and an active-branch indicator dot when collapsed. Folders start expanded, auto-expand when filtering or switching to a branch inside a collapsed folder, and preserve full branch names in tooltips, context menus, and drag-and-drop (Starred stays flat).
  - Per-Action Dialog Control for Fetch / Pull / Push — Replaced the global dialog-skip checkbox in Settings → Git with an individual Show options dialog mode for Fetch, Pull, and Push: From toolbar (default: toolbar opens the dialog, shortcut runs immediately), Always (both open the dialog), or Never (both run immediately). Settings → Shortcuts hints and toolbar tooltips update live, and existing skipActionDialogs: true configs migrate automatically to Never.
  Bug Fixes
  - Dialog, Menu & View Focus — Deferred dialog-opening context menu actions so menu dismissal no longer steals focus from newly opened dialogs; restored single-key navigation (Space, D, ↑/↓) in Local Changes and All Commits after switching views; kept single-key shortcuts from firing inside editable inputs; fixed Escape and post-close state cleanup in diff search (Ctrl+F) and shortcut recording.
  - Slash-Named Remotes & Branch Operations — Fixed remote/branch splitting when a remote name itself contains /, and tightened rebase and detached-HEAD validations in sidebar branch menus and drag-and-drop.
