ShortDescription: A fast, GPU-accelerated cross-platform desktop Git client written in Rust with GPUI.
Description: |-
  A fast, GPU-accelerated cross-platform desktop Git client written in Rust with GPUI.

  Features
  - Commit History & Graph: Visual commit graph, multi-commit selection, batch cherry-pick/revert, ref badges, search by message, author, path, branch, date, or code.
  - Local Changes & Diff: Unified and split diffs with tree-sitter syntax highlighting, stage/unstage/discard by file, hunk, or individual lines, whole-file toggle, image diffs, and in-diff search.
  - 3-Way Conflict Resolver: Built-in conflict resolution for text, binary, rename, and add/delete conflicts with ours/theirs/base panels and continue/abort/skip controls.
  - Branches, Worktrees & Stashes: Interactive rebase, fixups and autosquash, branch comparison, merged branch cleanup, selective stashes, Git worktrees, tags, remotes, and submodules.
  - Undo / Redo: Per-repository undo/redo stack covering commits, amends, merges, rebases, resets, branch/tag/stash ops, and file discards.
  - GitHub Integration: OAuth device flow sign-in, repository browsing and cloning, and Pull Request and CI check status in the sidebar and status bar.
  - Workspace & Productivity: Multi-repo tabs with named workspaces, customizable keyboard shortcuts, preview and pinned file tabs, file history and navigable blame, command palette, and light and dark themes.
