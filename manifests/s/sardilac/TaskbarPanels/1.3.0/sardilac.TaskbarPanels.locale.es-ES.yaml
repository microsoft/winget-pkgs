PackageIdentifier: sardilac.TaskbarPanels
PackageVersion: 1.3.0
PackageLocale: es-ES
Publisher: sardilac
PackageName: Taskbar Panels
License: MIT
ShortDescription: Paneles modernos y ligeros para la barra de tareas de Windows 11 - red, consumo de IA, sistema y multimedia.
Description: |-
  Taskbar Panels agrega paneles modernos y ligeros a la barra de tareas de Windows 11, escritos en Rust:
  - Red: gráficas de subida/bajada, IP pública con bandera del país, ping a la puerta de enlace y speed test bajo demanda (Speedtest.net, Cloudflare, LibreSpeed, GCI).
  - Consumo de IA: Claude, GitHub Copilot, gasto de las API de OpenAI y Anthropic y proveedores JSON personalizados.
  - Sistema: uso y temperatura de CPU/GPU, FPS (Intel PresentMon) y actividad de discos.
  - Multimedia: carátula, controles de reproducción y espectro de audio en vivo.
  Al pasar el mouse sobre un panel se abre una ventana de vidrio esmerilado con el detalle. El instalador registra una tarea programada elevada (necesaria para sensores y PresentMon) y puede descargar PresentMon de Intel verificando su firma digital.
