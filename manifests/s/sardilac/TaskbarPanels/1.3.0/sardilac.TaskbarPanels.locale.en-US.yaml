ShortDescription: Modern, lightweight panels for the Windows 11 taskbar - network, AI usage, system and media.
Description: |-
  Taskbar Panels adds modern, lightweight panels to the Windows 11 taskbar, written in Rust:
  - Network: upload/download charts, public IP with country flag, router/gateway ping and an on-demand speed test (Speedtest.net, Cloudflare, LibreSpeed, GCI).
  - AI usage: Claude, GitHub Copilot, OpenAI and Anthropic API spend, and custom JSON providers.
  - System: CPU/GPU usage and temperatures, FPS (Intel PresentMon) and disk activity.
  - Media: album art, playback controls and a live audio spectrum.
  Hovering a panel opens a frosted-glass flyout with details. The installer registers an elevated scheduled task (needed for sensors and PresentMon) and can optionally download Intel PresentMon, verifying its digital signature.
