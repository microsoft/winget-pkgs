ShortDescription: Local, offline network monitor for Windows - live bandwidth, usage and quotas, per-program traffic, connections with GeoIP and a world map.
Description: |-
  NetMon is a free, open-source network monitor in the spirit of NetWorx. Everything runs on your PC: no accounts, no cloud.
  - Live download/upload speed, tray graph, and mini graph / ping widgets that float on the desktop or sit on the taskbar
  - Usage history (hours, days, weeks, months; Jalali calendar) and data quotas with warnings
  - Per-program traffic (with Npcap), a live connections table with program names, host names, country, city and ISP
  - A 2D world map or 3D globe of where your traffic goes
  - VPN / proxy detection, CSV export, optional MikroTik whole-network usage
