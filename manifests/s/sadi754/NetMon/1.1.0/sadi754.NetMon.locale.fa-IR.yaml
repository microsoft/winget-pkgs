ShortDescription: مانیتور شبکه‌ی محلی و آفلاین برای ویندوز - سرعت لحظه‌ای، مصرف و سهمیه‌ی اینترنت با تقویم شمسی، ترافیک هر برنامه، اتصال‌ها با GeoIP و نقشه‌ی جهان.
Description: |-
  NetMon یک نرم‌افزار رایگان و متن‌باز مانیتورینگ شبکه شبیه NetWorx است. همه‌چیز روی کامپیوتر خودتان اجرا می‌شود؛ بدون حساب کاربری و بدون سرور ابری.
  - سرعت لحظه‌ای دانلود و آپلود، نمودار در tray، و ویجت‌های مینی‌گراف و پینگ که روی دسکتاپ یا روی تسک‌بار قرار می‌گیرند
  - تاریخچه‌ی مصرف با تقویم شمسی و سهمیه‌ی اینترنت با هشدار، با امکان ضریب برای ترافیک داخلی
  - ترافیک هر برنامه (با Npcap) و جدول زنده‌ی اتصال‌ها با نام برنامه، کشور، شهر و ISP
  - نقشه‌ی جهان دوبعدی یا کره‌ی سه‌بعدی از مقصد ترافیک
  - تشخیص VPN و پروکسی، خروجی CSV، و مصرف کل شبکه با روتر MikroTik (اختیاری)
