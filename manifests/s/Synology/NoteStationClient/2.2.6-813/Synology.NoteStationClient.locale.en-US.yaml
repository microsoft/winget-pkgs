ReleaseNotes: |-
  Important Notes
  1. Synology Note Station Client 3.0 is now available. It cannot be installed as an update to this version and must be downloaded and installed separately. Before installing, make sure all notes have been synced back to your NAS. Unsynced changes may be lost.
  Fixed Issues
  1. Fixed an issue where leading spaces might be lost when pasting plain text into a note.
  2. Fixed an issue where consecutive blank lines might be lost when pasting plain text into a note.
  3. Minor bug fixes and overall stability enhancement.
