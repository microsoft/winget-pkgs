ShortDescription: A third-party fork of CC Switch that points AI coding tools at the provider you choose by writing the config files they already read.
Description: |-
  Third-party fork. K-Switch is a third-party, slimmed-down fork of CC Switch, built to address parts of upstream that had become bloated. It is not the official CC Switch and is not affiliated with its maintainers. Upstream is MIT-licensed; K-Switch keeps the license and attribution.
  Only the switch
  K-Switch does one job: it points your coding tool at the provider you choose by writing the configuration file that tool already reads.
  The normal path is direct. No local gateway has to sit between your agent and the provider. K-Switch is organized around providers and config files, not around a gateway dashboard or an all-in-one agent platform.
  Your local files are the source of truth. K-Switch writes them directly and does not create a per-provider sidecar file, a second config tree, or a shadow copy that drifts from the real one. The app's own database stores K-Switch state; the files your tools read remain authoritative.
  Why K-Switch
  - Native config, no sidecar. K-Switch edits the file each tool already reads. There is no k-switch/providers/*.json tree to keep in sync.
  - One-click switching. Pick a provider in the window or from the tray. The native config changes; your work does not.
  - Layered configuration. Provider routing, reusable common-config profiles and the effective config are kept separate, composed in order, and written transactionally.
  - Atomic Codex switching. auth.json and config.toml are updated together, with rollback when a write fails.
  - Protected migration. Import an official CC Switch instance once, explicitly, with no continuous sync back into it.
  - Coexists with CC Switch. Separate app identity and private data; both tools still edit the same native harness config.
  - Cross-platform. Windows, macOS and Linux, with the same data-directory behavior for installed and portable builds.
