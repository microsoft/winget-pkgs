PackageIdentifier: Sakyvo.KSwitch
PackageVersion: 1.0.0
PackageLocale: zh-CN
ShortDescription: CC Switch 的第三方精简 fork，通过改写编程工具原本读取的配置文件，把 AI 工具指向所选供应商。
Description: |-
  第三方 fork。 K-Switch 是 CC Switch 的第三方 fork 精简版，意在解决上游部分臃肿问题。它不是官方 CC Switch，也与上游维护者无隶属关系。上游为 MIT 许可，K-Switch 保留许可与归属。
  只做切换
  K-Switch 只做一件事：把你选择的供应商写进工具本来就在读的配置文件，让工具指向它。
  正常路径是直连。不需要本地网关挡在 agent 和供应商之间。K-Switch 围绕供应商与配置文件组织，而不是围绕网关面板或 all-in-one agent 平台。
  你的本地文件是唯一真相。K-Switch 直接写这些文件，不创建每个供应商单独的旁路配置文件，不另建第二棵配置树，也不维护会与真实文件漂移的影子副本。应用自身数据库只保存 K-Switch 状态；工具读取的文件仍然是权威来源。
  为什么是 K-Switch
  - 原生配置，不建旁路。 K-Switch 编辑每个工具本来就在读的文件，不存在需要同步的 k-switch/providers/*.json 目录。
  - 一键切换。 在窗口或托盘里选择供应商，改的是原生配置，不动你的工作内容。
  - 分层配置。 供应商路由、可复用的通用配置档案和有效配置分层保存，按顺序合成，并以事务方式写入。
  - Codex 原子切换。 auth.json 与 config.toml 同时更新，写入失败时回滚。
  - 受保护迁移。 从官方 CC Switch 实例做一次性、明确确认的迁移，迁移后不持续反向同步。
  - 与 CC Switch 共存。 应用身份与私有数据独立；两者仍然编辑同一份 Harness 原生配置。
  - 跨平台。 Windows、macOS、Linux；安装版与便携版遵循同一套数据目录规则。
