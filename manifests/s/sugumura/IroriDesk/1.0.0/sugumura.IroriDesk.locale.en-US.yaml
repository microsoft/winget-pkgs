ShortDescription: Read-only desktop client for Cloud Firestore and Firebase Authentication
Description: |-
  Irori Desk is a desktop app for browsing and querying Cloud Firestore and Firebase Authentication.
  It is read-only: it never calls any API that writes to Firestore or Authentication, so it is safe to point at production.
  It also includes an MCP server, so AI agents can read Firestore with your approval, masking of personal data and a read log.
