PackageIdentifier: sugumura.IroriDesk
PackageVersion: 1.0.0
PackageLocale: ja-JP
Publisher: sugumura
PackageName: Irori Desk
License: MIT
ShortDescription: Cloud Firestore と Firebase Authentication の読み取り専用デスクトップクライアント
Description: |-
  Irori Desk は、Cloud Firestore と Firebase Authentication を閲覧・クエリするためのデスクトップアプリです。
  Firestore や Authentication に書き込む API は一切呼ばない読み取り専用なので、本番環境にも安全に接続できます。
  MCP サーバーも内蔵していて、AI エージェントが承認・個人情報のマスク・読み取りの記録付きで Firestore を読めます。
ReleaseNotesUrl: https://github.com/sugumura/IroriDesk/releases/tag/v1.0.0
