PackageIdentifier: SplitLane.SplitLane
PackageVersion: 0.3.1
PackageLocale: ru-RU
Publisher: SplitLane
PackageName: SplitLane
License: GPL-3.0-or-later
ShortDescription: Разделение трафика по программам для Windows - часть программ идёт через exit node Tailscale, остальные напрямую.
Description: |-
  SplitLane раскладывает программы по двум дорожкам: «Через VPN» и «Напрямую». Программы дорожки VPN идут через ваш exit node Tailscale, остальные - напрямую через обычное подключение. Программы переносятся с дорожки на дорожку перетаскиванием.
  Нужна учётная запись Tailscale (сеть tailnet) с доступным exit node. Это бета-версия.
