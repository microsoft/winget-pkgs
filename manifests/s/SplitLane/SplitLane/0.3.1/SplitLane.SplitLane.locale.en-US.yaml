ShortDescription: Split routing by program for Windows - some apps go through your Tailscale exit node, the rest go directly.
Description: |-
  SplitLane puts programs on two lanes, Via VPN and Direct. Programs on the VPN lane go through your Tailscale exit node, everything else goes directly through your normal connection. Arrange programs by dragging them from one lane to the other.
  Requires a Tailscale account (tailnet) with an exit node you can use. This is a beta.
