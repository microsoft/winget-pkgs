ReleaseNotes: |-
  弹幕转换器会被 360 爆毒，有出现请添加到白名单，代码开源在：third_party/danmaku-factory
  新增
  - 添加 TemporalFix S1、S2、S3 三款时序去闪烁模型。
  - 添加多帧超分设置和显示器刷新率自动匹配（实验）。
  - 添加 ameNZB 字幕账号登录，支持登录后搜索和下载字幕。
  优化
  - 改善开始播放、切换视频和退出时的稳定性。
  - 改善全屏切换后的画面显示、底栏按钮和键盘快捷键响应。
  - 优化弹幕自动匹配，提高同名作品和不同季度的识别准确性。
  - 优化多显卡选择、模型推荐和配置方案导入保存。
  - 优化 RIFE 补帧的切镜检测和 GPU 字幕渲染。
