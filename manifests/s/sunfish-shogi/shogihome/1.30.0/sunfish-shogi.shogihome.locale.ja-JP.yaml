ReleaseNotes: |-
  ## What's Changed

  ### 新機能

  • 次の一手出題画面に選択肢表示機能を追加 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1753
  • 局面図のコメント表示をカスタマイズする機能 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1757
  • 局面図のハイライト色を選べる機能 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1764
  • 局面図をクリップボードにコピーする機能 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1846
  • WASM エンジンをダウンロードする機能 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1812
  • エンジンのバナー画像を表示する機能 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1833  https://github.com/sunfish-shogi/shogihome/pull/1851

  ### 表示

  • 盤レイアウトに「ポートレイト（正方形）」を追加 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1765
  • 分岐の順序変更ボタンの幅が潰れる問題を修正 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1792
  • 移動可能なマスを示す機能 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1793
  • 盤と駒台の設定に「色を選択」を追加 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1798
  • エンジンの起動がタイムアウトした場合のメッセージを改善 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1797
  • テーマ「桜」「紅葉」の背景色を調整 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1828
  • 定跡情報ダイアログの UI を改善 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1867
  • レイアウトマネージャーの UI をアップデート by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1869
  • 思考表示の UI を更新 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1871
  • ダイアログの表示を微調整 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1872
  • スクロール可能なことを示すフェード効果 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1873
  • 履歴ダイアログの自動バックアップに局面プレビューを表示する by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1877

  ### その他

  • カスタムレイアウトに自動でリサイズするオプションを追加 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1731
  • SFENコピーにショートカットキーを割り当て by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1751
  • 局面編集画面にショートカットキーを追加 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1752
  • 履歴機能の保存件数の上限緩和とフィルタ機能の実装 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1790
  • リリース通知に公開から 7 日間のクールダウン期間を設ける by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1814
  • シェア機能の URL を analysis.shogihome.com へ変更 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1865
  • メニューバーから定跡ファイルを開いた時に定跡表示へ自動で切り替える by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1866
  • 全てのボタン内の要素を範囲選択の対象から除外 by @sunfish-shogi in https://github.com/sunfish-shogi/shogihome/pull/1881

  **Full Changelog**：https://github.com/sunfish-shogi/shogihome/compare/v1.29.1...v1.30.0
