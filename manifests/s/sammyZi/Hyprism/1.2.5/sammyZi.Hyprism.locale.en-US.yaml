ShortDescription: Hyprland vibes for Windows. A control center that installs, themes and updates open-source Windows customization tools.
Description: |-
  Hyprism is a control center for ricing Windows 11 and Windows 10 22H2. It installs, configures, themes and
  updates mature open-source projects (TranslucentTB, Windows Terminal, GlazeWM, Zebar, Flow Launcher, Lively,
  Windhawk and more) and adds the glue: one color palette for everything, wallpaper search, profiles, global
  hotkeys, performance mode, safe mode and backups.
