ShortDescription: Smooth cursor movement between monitors of different size and resolution.
Description: |-
  Windows joins monitors by pixels, so when two screens have different pixel density the cursor jumps at the border.
  beezl reads each monitor's physical size and moves the cursor to the same physical point on the next screen.
  It lives in the tray and starts with Windows.
