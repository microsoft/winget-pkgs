ShortDescription: 'Discord style emoji autocomplete for Windows. Type :fire: and get 🔥.'
Description: |-
  Type a colon and a few letters in the apps you type in, and a small popup shows matching emoji at your text cursor.
  Pick with the arrow keys and Enter, or type a full code like :fire: and it converts instantly.
  Uses the shortcodes from Discord, Slack and GitHub, skips password fields, and never connects to the internet.
