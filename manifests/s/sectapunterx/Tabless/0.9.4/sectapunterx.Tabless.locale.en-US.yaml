ShortDescription: Your tasks, meetings and notes in one keyboard-driven window
Description: |-
  Just makes your day easier.
  Tabless is a desktop app for developers whose work lives in a shared tracker. It brings the tasks assigned to you from 13 trackers (GitHub, GitLab, Jira and more), today's meetings and your Markdown notes into one window you drive from the keyboard.
  It reads your trackers and writes nothing back unless you turn status updates on for a tracker. Everything stays in one JSON file on your disk: no account, no analytics. Formerly lowkey, and heap before that.
