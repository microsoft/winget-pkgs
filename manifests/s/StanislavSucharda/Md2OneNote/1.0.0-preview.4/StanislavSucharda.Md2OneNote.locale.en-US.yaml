ShortDescription: Import Markdown files into OneNote as pages that look typed, not pasted.
Description: |-
  Md2OneNote is a small add-in for the OneNote desktop app on Windows. It adds one button to the
  Insert tab: pick one or more Markdown files, and each becomes a page in the current section with
  OneNote's own headings, lists, tables, highlighted code and embedded images. Mermaid and Graphviz
  diagrams and KaTeX formulas are rendered offline and placed as pictures. A page the add-in
  created is never overwritten: importing an unchanged file again is skipped, and a changed file
  gets a second, dated page. Everything happens on your machine; the add-in never touches the
  network.
  Requires OneNote for Windows (Microsoft 365, or 2016 and later; not the Store or web versions)
  and .NET Framework 4.8. Diagrams and formulas need the Microsoft Edge WebView2 runtime; without
  it they appear as code.
