ShortDescription: KiT - Keep it Ticking. No PC naps, on-demand dark mode that keeps your apps ticking.
Description: |-
  KiT is a quiet Windows companion. Three modes: Light keeps the machine
  awake. Night offers wakeable dark - deep screen, clear desk, the PC still
  working - with four screensaver faces (Globules, DVD, Snake, Orbit) and
  optional Hold Night. Off returns ordinary Windows. Optional Ghost bar
  (transparent, click-through), optional run at sign-in, remembers how you
  left it. Single instance. Entirely local. No telemetry. No fake input.
  Codified in TRUST.md.
