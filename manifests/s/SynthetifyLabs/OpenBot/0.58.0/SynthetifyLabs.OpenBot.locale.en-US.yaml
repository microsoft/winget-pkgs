ReleaseNotes: |-
  New
  - Show the OpenCode Go monthly limit as a third bar in Usage, under the 5-hour and weekly bars. Before, Usage showed only the one of the weekly and monthly limits that was closer to its end.
  - Add 17 OpenBot agents to Marketplace: QA Tester, PR Shepherd, Skill Smith, Prototype Builder, Design Critic, Accessibility Desk, Handoff Spec Writer, Copy Editor, Search Content Planner, Prospect Researcher, Call Coach, Chief of Staff, Spend Auditor, Request Triage Desk, Ops Digest, Home Care Log and Bill Tracker. Each agent does one job and asks before it sends, spends, merges or publishes.
  - Add 15 OpenBot skills for these agents, such as Acceptance Check, PR Follow-up, Voice Edit, Daily Brief, Spend Audit and Care Log.
  - Some agents install with an active routine, such as the weekday morning brief of Chief of Staff. A routine asks once for its setup and sends nothing when there is nothing new.
  - Start a workflow from GitHub. A GitHub trigger runs on new issues, comments, labels, pull requests, reviews, merges, closes, assignments, failed checks, or a mention of @openbotgit, in a repository that the OpenBot GitHub App can see. A second event for the same issue waits for the first run, and events for other issues run at the same time. The trigger shows the newest 50 events and why each one started a run, waited, or was skipped.
  - Change GitHub from a workflow. A GitHub output comments, adds or removes labels, assigns a person, asks for a review, approves or requests changes, closes, reopens, or creates an issue, as the OpenBot GitHub App. An agent can choose the labels or the person from the repository's own lists.
  - Show each open run on the workflow canvas, and the events that wait for one.

  Improved
  - The server invitation page has one Open OpenBot button. Below it, links let you join in the browser or download OpenBot. When OpenBot does not open on a computer, a dialog tells you to install it and gives a download button.
  - The invitation, Slack and Discord connect, billing and report pages no longer show a blue glow and a shadow behind the card.
  - Rewrite the OpenBot agents and skills in Marketplace. Each one now has a named result, the evidence it gives for each claim, and a fixed rubric. Agents that you installed get the update offer in Marketplace.
  - Remote connections now use two Signal machines at the same time. Each server has a home machine. When one machine stops, its servers and their devices move to the other machine in about one minute.
  - The first conversation of a joined server opens faster when the server has many agents. Before, the app showed it only after it read the queue of each agent. On a server with 50 agents, the desktop app now shows it in about half the time.
  - The web app reads the agent settings, connectors and routine calendar of a server once when it opens, not up to three times. On a server with 50 agents, its side panels show about a quarter sooner.
  - When you open the app again, the agents and sidebar of a joined server show at once from the last visit, while the app connects to the server. The saved view holds no messages. Server actions start when the connection is made. The channels show in their place too, and a hidden or moved agent stays hidden or moved in the saved view.
  - The desktop app opens its window about 3 seconds sooner when the Dynamic Island is on. The window does not wait for the Island to load.
  - A client connects to a joined server with fewer steps in sequence. The desktop app reads the server compatibility once, not twice. The web app loads its workspace code while it signs in, and on a server it connected to before, it reads the workspace at the same time as the compatibility. With 100 ms network latency, the web workspace is ready about 250 ms sooner.
  - On the web, a switch to another server is about 2.5 times faster. The app uses the connection that it already keeps to that server for notifications, and it does not wait for the old server's session to end. On openbot.run, a switch took 0.7 to 1.0 seconds, against 1.7 to 2.8 seconds before.

  Removed
  - Remove six OpenBot agents from Marketplace: Product Design Lead, Communications Partner, Meeting Assistant, Account Research Partner, Outreach Writer and Operations Planner. Other agents now do their jobs. Copies that you installed keep working.

  Fixed
  - A custom provider that you add now appears in the model picker when OpenCode or Pi is not installed. OpenBot downloads the provider that runs the endpoint when you save it. Before, the endpoint was saved, but the Custom tab stayed hidden until you downloaded OpenCode yourself.
  - The account service does less database work when a phone or browser connects to a server. Before, each connection read the connections of all users of that server, and each server or account deletion read every connection of every server.
  - Accept the Claude sign-in check when Claude reports that it is signed in but its status text is not readable. Before, this stopped the turn of an agent with its own Claude account, and the message to that agent failed.
  - The download button in the "Nothing opened?" dialog of the invitation, Slack and Discord pages now uses your language. Before, it was always in English.
  - Moving a queued message works when more than 32 messages wait in the queue, on this computer and on a joined server. Before, every move failed with "Invalid delivery ids." or a 400 error and the order did not change.
  - A Pi agent turn now fails with a message when Pi sends nothing for 10 minutes. Before, the turn stayed "working" until you stopped it, and other messages waited behind it.
  - Long model names in the model picker, such as the Fusion models of Devin, now go to a second line. Before, the picker cut off the end of the name.
  - In the web app, a server that is open in another browser tab now shows a full-window screen that says so, with "Use here" to move the server to this tab. Before, the page showed "Starting" for 15 minutes, started the server again every few seconds, and then showed "did not start in time", while the server ran.
  - A host that starts lists its agents as soon as they load. Before, a client could wait about 15 seconds for the list while the host ran its routine checks.
  - On the web, an agent that you open while the app connects stays open after the connection.
  - While a joined server connects, the conversation says that it connects. It does not ask you to complete the provider setup.
  - While a joined server connects, a channel from the last visit does not say "No messages yet" or show its creation date.
