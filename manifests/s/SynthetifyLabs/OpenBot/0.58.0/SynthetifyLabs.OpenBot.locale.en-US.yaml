ShortDescription: A free desktop app that runs AI agents as a team on your own computer
Description: OpenBot is a local-first desktop workspace for persistent AI teammates. Run Codex, Claude, and Grok with dedicated workspaces, task queues, file sharing, browser control, and agent-to-agent collaboration, using the subscription plan you already pay for or your own model.
