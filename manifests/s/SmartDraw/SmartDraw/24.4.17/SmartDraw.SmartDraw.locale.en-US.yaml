Description: |-
  SmartDraw is a diagramming and layout tool for creating professional-looking visuals of all kinds quickly and easily. It covers plans for buildings, homes, offices, sites, planograms, evacuations, fire safety, and accident reconstruction, together with flowcharts, org charts, mind maps, and other common diagrams.
