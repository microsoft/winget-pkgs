License: 专有软件
ShortDescription: 快速轻松地创建各类专业图表。
Description: |-
  SmartDraw 是一款绘图与布局工具，可帮助用户快速轻松地创建各类专业图表。它可用于绘制建筑、住宅、办公室、场地、陈列规划、疏散图、消防安全和事故重建等平面图，也支持流程图、组织结构图、思维导图和其他常用图表。
  桌面版将 SmartDraw 体验带到 Windows，提供 70 多种图表模板、数千个符号，以及与 SmartDraw 云账户同步的团队共享文件。
