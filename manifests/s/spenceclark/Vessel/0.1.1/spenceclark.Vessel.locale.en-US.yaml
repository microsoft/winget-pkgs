ShortDescription: The lightweight observability proxy for LLM traffic
Description: The lightweight, local-first observability proxy for LLM traffic. Point a client’s base_url at one small binary and get capture, search, metrics, replay, Compare, and a private UI—without sending prompts to a third party.
