ShortDescription: Fast, portable Windows scanning app with auto-crop, photo splitting, deskew and multi-page PDF.
Description: |-
  OmniScan is a small portable scanning app for Windows. It works with WIA scanners, crops the page automatically,
  splits several photos scanned at once into separate files, straightens skewed scans and saves multi-page PDFs.
  A scanner attached to one computer can be shared with the other computers on the home network.
