ShortDescription: Free, open-source AI coworkers that use your PC - websites, desktop apps and files - and ask before they post, send or pay.
Description: |-
  Sahkarmi is a free, open-source Windows desktop app for running a team of AI coworkers on your own computer.
  Each coworker has its own workspace folder, its own browser profile with persistent sign-ins, memory and a task queue,
  and can browse websites, fill forms, work with files and, with the "Control this PC" permission, use desktop apps.
  Coworkers run on the AI you choose: free built-in models, or Claude, ChatGPT (Codex), Gemini and other providers.
  Posting, sending, submitting and payments wait for the owner's approval.
