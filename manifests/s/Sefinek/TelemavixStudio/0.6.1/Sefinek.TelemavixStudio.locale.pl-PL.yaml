ShortDescription: Dodaje HUD z telemetrią do nagrań z kamer DJI Osmo i GoPro oraz z dronów DJI.
Description: |-
  Wymaga FFmpeg 9 z bibliotekami współdzielonymi; aplikacja sama proponuje jego instalację.
  Telemavix Studio dodaje do nagrań z kamer DJI Osmo i GoPro oraz z dronów DJI HUD z telemetrią (prędkość, mapa, trasa, przechył i inne). Korzysta z telemetrii kamery, logów lotu DJI i opcjonalnie zewnętrznych śladów GPS. Obraz jest kodowany ponownie kodekiem i z ustawieniami źródła, aby wynik był jak najbliższy oryginałowi.
