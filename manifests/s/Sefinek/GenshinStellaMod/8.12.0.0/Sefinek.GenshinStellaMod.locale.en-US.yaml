ReleaseNotes: |-
  Miscellaneous
  1. Reverted DpiMode from PerMonitorV2 back to SystemAware in Stella Mod Launcher, Configuration Window, Prepare Stella Mod, Welcome App, and FPS Unlocker - PerMonitorV2 was causing incorrect UI scaling when a window was moved between monitors with different display scaling.
  2. This update introduces new improvements to the security system.
  3. Updated the audio library to the latest version.
  i18n Translations
  1. NEW! Added 9 new languages: Arabic, German, Indonesian, Japanese, Korean, Thai, Vietnamese, Simplified Chinese, and Traditional Chinese - Stella Mod is now available in 18 languages.
  2. All 17 translations have been completed to 100%.
  3. The language selection window has been fully migrated to the translation system - previously it always displayed in English regardless of the application's selected language.
  4. Fixed a bug where users with Traditional Chinese selected saw Simplified Chinese highlighted in the language selection window.
  5. Moved a dozen or so error messages that were previously hardcoded into the code to the translation system - they now display in the user's selected language instead of always in English.
  6. Replaced the inactive Crowdin link with a link to the new Stella-Mod-Translations repository, from which all translations are now managed.
  7. Removed the list of translators from the language selection window - full credits are now available in the repository's README on GitHub.
  Tip
  Want to help translate Stella Mod into your native language? Check out the Stella-Mod-Translations repository.
  FPS Unlocker (v4.3.0.0)
  1.  NEW! Added a "-- Not selected --" option to the monitor list in Settings - lets the game decide which monitor to launch on instead of forcing one.
  2.  NEW! Added an update checker that notifies users when a new version is available (excluding Genshin Stella Mod users).
  3.  NEW! The application now shows a system notification and automatically updates the saved monitor, resolution, and refresh rate if the previously selected monitor is no longer connected, instead of silently launching the game with mismatched settings.
  4.  Fixed cases where the game could launch on the wrong monitor instead of the previously defined one.
  5.  NEW! Added a "Refresh" button next to the monitor selector in Settings to rescan connected monitors without needing to reopen the window.
  6.  Rebuilt the application icon as a proper multi-resolution .ico file (16px up to 256px) instead of a single low-resolution frame - fixes blurry/pixelated icons in the system tray, toast notifications, and Windows Explorer.
  7.  Improved monitor name detection - the application now shows the actual monitor model whenever possible, instead of a generic name like "Generic PnP Monitor".
  8.  NEW! Settings now shows the config version and when it was last updated.
  9.  Fixed the generated launch command preview in Settings not updating immediately after changing the selected monitor.
  10. The main (Primary) monitor is now always listed first in the monitor list in Settings.
  11. Updated unlocker.config.example.json to reflect the current configuration file format.
  12. The system tray icon is now consistent with the application icon.
  13. Added a hint in Settings letting users know that hovering over a setting shows more information about it.
  14. Added a note in Settings indicating the app is available in 18 languages and where to change it.
  15. Fixed known issues.
  Stella Plus
  1. NEW! The launcher now automatically updates the required resources from the GitHub repository, offering faster compatibility with upcoming game releases.
  Stella Mod Launcher
  1. Fixed an issue where the button for launching the official Genshin Impact launcher (HoYoPlay) returned the message Game launch file not found if HoYoPlay and the game itself were installed on different drives.
  Full Changelog: v8.11.0.0...v8.12.0.0
