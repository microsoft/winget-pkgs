ShortDescription: The macOS screenshot thumbnail for Windows. Drag screenshots into any app; nothing piles up on disk.
Description: |-
  Take a screenshot and a thumbnail floats in the corner of your screen. Drag it straight into WhatsApp, Slack, Discord, Gmail or any other app, and nothing is saved to your Screenshots folder.
  Click it to mark it up with arrows, boxes, highlighter, text, numbered steps, crop and blur. One click hides emails, phone numbers and one-time codes. Copy text out of a screenshot, beautify it, combine several into one, or find recent ones again in the tray.
