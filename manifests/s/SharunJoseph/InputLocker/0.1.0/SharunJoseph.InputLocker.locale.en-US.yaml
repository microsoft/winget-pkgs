ShortDescription: High-performance OS-level input suppressor & glass HUD overlay for live AV staging.
Description: Input Locker intercepts and swallows all global keyboard and mouse events using low-level OS hooks to create a secure locked state, while keeping background rendering engines (e.g. Resolume, WATCHOUT, QLab, DAWs) running and visible through a non-activating semi-transparent overlay.
