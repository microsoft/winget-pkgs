ShortDescription: Screenshot and recording tool with local text search and clipboard history.
Description: |-
  Snipocket automatically collects screenshots and lets you find text in images,
  video frames and PDF content. Basic screenshots, annotations, desktop pinning,
  color picking and text clipboard history remain free. Advanced features have
