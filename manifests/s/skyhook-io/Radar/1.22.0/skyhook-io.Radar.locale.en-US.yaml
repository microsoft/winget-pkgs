ReleaseNotes: |-
  ## Radar v1.22.0

  **Modern Kubernetes visibility.** Local-first. No account. No cloud dependency. Fast.

  Topology, event timeline, and service traffic — plus resource browsing and Helm management. Open source. Free forever.

  ### Installation

  **Homebrew (macOS/Linux):**
  ```bash
  brew install skyhook-io/tap/radar
  ```

  **Scoop (Windows):**
  ```powershell
  scoop bucket add skyhook https://github.com/skyhook-io/scoop-bucket
  scoop install radar
  ```

  **PowerShell (Windows):**
  ```powershell
  irm https://raw.githubusercontent.com/skyhook-io/radar/main/install.ps1 | iex
  ```

  **Manual (macOS Apple Silicon):**
  ```bash
  curl -LO https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_darwin_arm64.tar.gz
  tar -xzf radar_v1.22.0_darwin_arm64.tar.gz
  sudo mv kubectl-radar /usr/local/bin/
  ```

  **Manual (macOS Intel):**
  ```bash
  curl -LO https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_darwin_amd64.tar.gz
  tar -xzf radar_v1.22.0_darwin_amd64.tar.gz
  sudo mv kubectl-radar /usr/local/bin/
  ```

  **Manual (Linux amd64):**
  ```bash
  curl -LO https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_linux_amd64.tar.gz
  tar -xzf radar_v1.22.0_linux_amd64.tar.gz
  sudo mv kubectl-radar /usr/local/bin/
  ```

  ### Desktop App

  **Homebrew (macOS):**
  ```bash
  brew install --cask skyhook-io/tap/radar-desktop
  ```

  **Debian/Ubuntu:**
  ```bash
  curl -LO https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar-desktop_v1.22.0_linux_amd64.deb
  sudo dpkg -i radar-desktop_v1.22.0_linux_amd64.deb
  ```

  **Fedora/RHEL:**
  ```bash
  curl -LO https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar-desktop_v1.22.0_linux_amd64.rpm
  sudo rpm -i radar-desktop_v1.22.0_linux_amd64.rpm
  ```

  **Scoop (Windows):**
  ```powershell
  scoop bucket add skyhook https://github.com/skyhook-io/scoop-bucket
  scoop install radar-desktop
  ```

  **Windows (direct download):** Download from the assets below.

  ### CLI

  Then run：`kubectl radar`

