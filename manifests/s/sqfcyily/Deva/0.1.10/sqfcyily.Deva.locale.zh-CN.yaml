ReleaseNotes: |-
  新功能 / New Features
  - Responses 协议思考等级统一发送 reasoning.effort / send reasoning.effort for all model families over Responses
  - 新增 compat 格式支持国产模型走 Anthropic 兼容端点 / add compat format for Chinese models on Anthropic-compatible endpoints
  - 交付卡改为回合结束后显示在回复末尾 / show deliverables card at the end of the reply after the turn ends
  - 后台子智能体移至输入框上方胶囊，已处置卡片收进时间轴 / move background subagents to composer capsule and fold resolved cards into timeline
  - 工作过程改为时间轴折叠并显示回合耗时 / render work process as a collapsible timeline with turn duration
  - 回合结束后将工作过程折叠，只露最终回复与固定卡片 / fold work process after a turn ends, showing only the final reply and pinned cards
  - 默认角色提示词随新版自动更新，用户改过则保留 / auto-update default persona prompts on upgrade unless user modified them
  - 优化上下文压缩的展示与状态提示 / improve context compaction display and status indication
  - 记忆条目改随消息增量下发，系统提示词只保留记忆规则 / send memory entries as message deltas, keeping only memory rules in the system prompt
  - 技能清单改随消息增量下发，工具描述与系统提示词不再随技能变化 / send skill listing as message deltas to keep tools and system prompt cache-stable
  - 扩展页新增只读技能详情，展示 license / compatibility / metadata 与正文 / add read-only skill detail showing license, compatibility, metadata and body
  - 输入框支持指令样式高亮 / input box supports instruction style highlighting
  - 重写 create-skill 元技能，支持规划资源与落盘校验 / rework create-skill meta skill with resource planning and validation
  - AI 生成提交信息支持流式输出与停止生成 / stream AI commit message generation and support stopping it
  - 计划审阅卡新增忽略选项与继续完善时的卡内回复 / add ignore option and inline feedback to plan review card
  问题修复 / Bug Fixes
  - 要求提交计划前先澄清未决问题，计划中不留待答问题 / require resolving open questions before submitting a plan
