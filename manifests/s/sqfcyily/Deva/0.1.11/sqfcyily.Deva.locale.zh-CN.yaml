ReleaseNotes: |-
  新功能 / New Features
  - 对话列表显示挂载的文件夹名并支持按文件夹名检索 / show mounted folder name in thread list and support searching by it
  - 优化系统提示词与 Deva 角色设定 / refine system prompts and Deva persona
  - 精简 IM 回合卡片并新增指令消息用完即删 / simplify IM turn cards and auto-delete command messages
  - 新增 deb 安装包并在发版时打包 Linux / add a deb package and build Linux packages on release
  - AppImage 开箱即用：Wayland 原生运行、输入法、启动器入口与多尺寸图标 / make the AppImage work out of the box: native Wayland, IME, launcher entry and icon sizes
  - 让桌面端可在 Linux 上构建运行 / make the desktop app build and run on Linux
  - 支持拖入文件作为附件并提示被跳过的文件 / support drag-and-drop attachments and warn about skipped files
  - 工具失败时直接显示具体原因 / show specific reasons for failed tool calls
  - 对话页会话列表可收起，悬停图标浮出列表 / make the conversation list collapsible with hover peek
  - 会话右键菜单新增重命名，留空恢复默认标题 / add conversation rename with default title restore
  - 输入框草稿按会话保存，列表中提示未发送内容 / keep composer drafts per conversation and mark them in the list
  - 思考节点与工作过程折叠条展开时标题行吸顶，手动收起后显示可视区 / pin thinking and process headers when expanded, scroll the row back into view on manual collapse
  - 收紧 ask_user 提问条件，允许计划阶段执行只读命令 / tighten ask_user criteria and allow read-only commands during planning
  问题修复 / Bug Fixes
  - grep/glob 结果路径改为相对项目根路径，便于直接读取 / show grep and glob result paths relative to project root
  - 放宽 grep 正则解析并修正 glob 文件名匹配 / relax grep pattern parsing and fix glob basename matching
  - X11 下窗口 WM_CLASS 改为 deva，任务栏归到 Deva 图标下 / set the X11 window class to deva so the taskbar groups it under Deva
  - 记忆标签背景改用主题色，修复深色模式下白底白字 / use theme background for memory tags so they stay readable in dark mode
  - 回复开始输出后不再显示已结束的思考步骤 / stop showing the finished thinking step once the reply starts
  - 工具参数解析失败时按原因回灌并纳入连续截断计数 / report unparseable tool args by cause instead of running them with empty args
  完整变更 / Full Changelog: https://github.com/sqfcyily/deva/compare/v0.1.10...v0.1.11
