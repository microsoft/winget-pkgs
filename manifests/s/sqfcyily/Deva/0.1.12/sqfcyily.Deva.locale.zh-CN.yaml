ReleaseNotes: |-
  新功能 / New Features
  - 提问卡「自己输入」改为选中后原地变输入框 / turn the ask card custom option into an inline input
  - 支持为技能与 MCP 服务指定可用角色 / add per-persona availability for skills and MCP servers
  - 时间轴命令可展开查看完整内容，失败原因改为灰字 / make timeline commands expandable and show failure reasons in gray
  问题修复 / Bug Fixes
  - 大量文件暂存改经标准输入传路径，修复命令行超长报错 / pass pathspecs via stdin for large batches to fix ENAMETOOLONG on staging
  - 批量异步校验文件路径，修复挂载大仓库时界面卡顿 / batch path checks asynchronously to fix freezes when mounting large repositories
  - 编辑与写入文件时保留原有换行符与 BOM / preserve line endings and BOM when editing and writing files
  - 记忆与待办工具须先于最终回复调用，避免回复被收进过程 / call memory and todo tools before final reply to avoid reply hidden in process
  - 修复连接过程中停用 MCP 服务后进程未及时退出的问题 / fix MCP server process lingering when disabled during connection
  - 修复内容缩短后贴底态未刷新导致回到最新常驻 / fix stick-to-bottom state not refreshing when content shrinks
  其他改进 / Other Improvements
  - grep 遵守 .gitignore 并并发读取文件 / make grep respect .gitignore and read files concurrently
  - 移除角色的开场白（tagline）字段 / remove tagline field from personas
  - 长对话改为分段渲染，修复切换对话卡顿 / render long conversations in segments to fix lag when switching
  完整变更 / Full Changelog: https://github.com/sqfcyily/deva/compare/v0.1.11...v0.1.12
