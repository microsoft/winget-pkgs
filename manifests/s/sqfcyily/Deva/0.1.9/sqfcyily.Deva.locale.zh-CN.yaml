  - 要求子智能体汇报改动清单 / require subagents to report changes
  - 新增模型设置页，支持按模型设置上下文窗口与最大输出长度 / add model detail page with per-model context window and max output settings
  - 新增 present_files 工具与交付卡，向用户交付成品文件 / add present_files tool and deliverables card for delivering output files
  - 新增回复完成和等待输入的系统通知功能 / Add system notifications for reply completion and pending input
  问题修复 / Bug Fixes
  - 删除角色时定时任务改由默认角色 Deva 执行 / reassign scheduled tasks to default persona Deva on persona deletion
