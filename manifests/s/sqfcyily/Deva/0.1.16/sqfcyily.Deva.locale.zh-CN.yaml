ReleaseNotes: |-
  本版主要新增手机网页端：在手机浏览器里继续电脑上的对话，局域网直连或经中转在任意网络下使用。同时带来输入框的模型面板、记忆自动归纳，以及远程机器人和项目成员的若干改进。
  This release introduces the phone web client: continue your desktop conversations from a phone browser, either directly on the local network or through a relay from anywhere. It also adds a model panel in the composer, automatic memory consolidation, and improvements to remote bots and project members.
  手机网页端 / Phone Web Client
  - 扫码即用：在设置的「手机」面板扫码配对，手机浏览器打开即可使用，无需安装 App / Scan to pair: pair from the new "Phone" panel and open it in a phone browser, no app needed
  - 两种连接方式：同一局域网直连电脑；不在同一网络时经 Cloudflare 中转。连接方式按设备选择，通道按需启停 / Two ways to connect: direct over the LAN, or through a Cloudflare relay when away. The mode is chosen per device and channels start only when needed
  - 自建中转：也可以把中转部署到自己的服务器，pnpm relay-node:deploy 一条命令完成安装与更新 / Self-hosted relay: deploy the relay to your own server with a single pnpm relay-node:deploy
  - 完整交互：流式进展、停止、中途插话，回答提问、审批计划、处理挂载请求，查看与操作定时任务 / Full interaction: live progress, stop, insert messages, answer questions, approve plans, handle mount requests and manage scheduled tasks
  - 跨端同步：已读状态、改模型、归档、删除在手机与电脑之间同步；断线自动重连，上传中断后自动续传 / Cross-device sync: read state, model changes, archiving and deletion sync both ways; reconnects and resumes uploads automatically
  - 成员与任务：项目成员和定时任务的交差回复以各自身份显示，成员待处理的提问和计划卡也会出现在主对话 / Members and tasks: reports show their own identity, and members' pending prompts appear in the main chat
  - 文件预览：交付的 HTML 文件可在手机上隔离渲染预览 / File preview: delivered HTML files can be previewed in a sandbox on the phone
  新功能与改进 / New Features & Improvements
  - 输入框模型面板：模型贴片上的圆环显示上下文占用，悬停可看百分比；面板里显示已用量、自动压缩位置和剩余空间。先选服务商再选模型，每个模型标注上下文窗口，思考等级并入同一个菜单 / Composer model panel: a ring on the model chip shows context usage; the panel shows usage, the auto-compact point and room left. Pick a provider then a model with its window shown, with thinking level in the same menu
  - 记忆写满自动归纳：写入记忆时达到上限，会先用当前模型把旧条目归纳到约七成容量再写入；归纳前自动备份（保留最近 5 份），失败时不改动原记忆 / Auto-consolidating memory: when memory is full, older entries are consolidated to about 70% capacity before writing, with a backup kept (last 5) and nothing changed on failure
  - 远程机器人回复更像聊天：新建的 Telegram、飞书机器人默认「仅最终结果」，回合结束后发一条聊天式回复，进行中显示正在输入 / Chat-like bot replies: new Telegram and Feishu bots default to final-only mode, sending one chat-style reply per turn with a typing indicator meanwhile
  - 成员插入任务各自交差：成员忙碌时插入的任务依次排队、分别交差；新增 reply_task，成员可以先交回其中一项 / Separate reports for inserted tasks: tasks inserted while a member is busy are queued and reported separately; the new reply_task lets a member report one early
  - 胶囊排浮于消息区：输入框上方的胶囊排不再占用输入区高度，消息区底部改为渐隐 / Floating dock: the pill dock floats over the messages instead of taking composer space, with a fade at the bottom
  问题修复 / Bug Fixes
  - 模型回复过程中断线时自动重连重试，不再直接报错 / Reconnect and retry automatically when the stream drops mid-reply
  - 模型请求超过 10 分钟没有响应时判定为中断并重连，避免回合无限挂起 / Treat requests with no response for 10 minutes as dropped and reconnect, so turns no longer hang forever
  - 修复回合进行中历史被并发改写导致输出丢失、回合卡在「进行中」的问题；重启后不再出现空白对话 / Fix lost output and turns stuck in progress caused by concurrent history rewrites; no more blank chats after restart
  - 首次配置时添加的官方服务商可以在设置页删除 (#50) / Official providers added during first-run setup can now be deleted in settings (#50)
  - 修复显式触发技能后，消息气泡显示技能全文的问题 / Fix message bubbles showing the full skill text after invoking a skill explicitly
  - 删除对话轮后清除过期的上下文用量读数 / Clear the stale context usage reading after deleting turns
  其他 / Other
  - 内部重构：拆分对话主循环、聊天界面与对话协议类型，工具登记改为表驱动，便于后续维护和参与贡献 / Internal refactoring: split the agent loop, chat shell and protocol types, and make tool registration table-driven for easier maintenance and contributions
  - 新增 AGENTS.md，说明提交信息格式与代码组织约定 / Add AGENTS.md describing commit message format and code organization conventions
  致谢 / Thanks
  代码与设计贡献 / Code & Design Contributions
  - @aloasut：通用设备接入接口、Web 控制台、安卓客户端样例、角色默认工作区 (#45、#46、#47、#49)
  - @miaocell：手机浏览器继续对话的 Web 界面 (#53)
  - @moxuyio1024：输入框上下文用量胶囊、记忆遗忘区与整理工具 (#62、#63)
  本版的手机网页端、模型面板与记忆归纳参考了以上 PR 的设计 / The phone web client, model panel and memory consolidation in this release draw on the designs from these PRs.
