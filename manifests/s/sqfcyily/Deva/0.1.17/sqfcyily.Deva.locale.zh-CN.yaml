ReleaseNotes: |-
  新功能 / New Features
  - 精简手机版引导文案，去掉「电脑上的」冗余描述 / simplify mobile guide text by removing redundant "on your computer"
  - 支持为服务商配置自定义请求头，403 错误显示服务商原因 / support custom provider headers and show provider reason on 403
  - 记忆标签改为点击进入详情页编辑 / open memory detail page on tag click instead of inline editing
  - 新增对话列表多选，支持批量归档与删除 / add multi-select to chat list for batch archive and delete
  - 支持回合进行中插入消息时附带附件 / support attachments when inserting messages mid-turn
  - 记忆升级为全局、角色、项目三层并引入类型与标题 / upgrade memory to global, role and project layers with types and titles
  - 新增角色默认文件夹与 mount_workspace 工具，取代自动挂载闸门 / add role home folder and mount_workspace tool to replace the auto-mount gate
  问题修复 / Bug Fixes
  - 恢复 DeepSeek 漏进正文的 DSML 工具调用 / recover DeepSeek DSML tool calls leaked into text
  - 修复 Gemini 调用工具后因缺少思考签名报 400 的问题 / fix 400 from missing thought signature after Gemini tool calls
  其他改进 / Other Improvements
  - 改用 httpFetch 发起请求以支持代理环境变量 / use httpFetch for requests to support proxy env vars
  - 记忆详情移除类型选择，记忆列表改用对话行样式 / remove memory type picker and reuse conversation row style for memory list
  - 将模型面板拆为上下文、模型、思考等级三个贴片 / split model panel into context, model and effort chips
  - 移除上下文容量下方的说明文字 / remove context usage note below the progress bar
  - 模型面板改为单层平铺，模型与思考等级一点即切换 / flatten model panel into a single layer with one-click model and effort switching
  - 角色默认工作区改按 id 存放并统一术语 / store role default workspace by id and unify terminology
