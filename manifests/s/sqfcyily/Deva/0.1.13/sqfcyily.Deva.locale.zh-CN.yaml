ReleaseNotes: |-
  新功能 / New Features
  - 支持内置浏览器：Deva 可以打开、读取和操作网页，需要登录或靠脚本渲染的页面也能处理；可在独立窗口与输入框上方的胶囊中查看 / add a built-in browser: Deva can open, read and operate web pages, including ones that need login or JavaScript; view them in a separate window or the composer capsule
  - 支持中途插话：回合进行中可以直接发送消息补充要求，不必等它结束或先停止 (#30) / send follow-up messages while a turn is running, without waiting or stopping it first
  - 新增对话归档：暂时不用的对话可以归档，不占列表，支持撤销 (#24) / archive conversations you don't need right now, with undo
  - 对话列表支持按角色与文件夹筛选 (#20) / filter the chat list by persona and mounted folder
  - 对话文字大小可在设置中调整，提供小 / 标准 / 大 / 特大四档 (#30) / adjustable chat text size: small, default, large and extra large
  - 时间轴显示技能加载步骤，悬停可查看技能说明 / show skill loading steps in the timeline with description on hover
  - 适配 OpenCode Go 推理网关 (#28) / support the OpenCode Go inference gateway
  - 请求模型时携带 Deva 版本的 User-Agent，便于服务商识别 (#33) / send a Deva versioned User-Agent to model providers
  改进 / Improvements
  - 定时任务改为在专属对话中按普通对话方式运行，并新增步数上限与原地打转检测 / scheduled tasks now run as regular turns in their own conversation, with a step limit and loop detection
  问题修复 / Bug Fixes
  - 修复角色头像数据异常时整个界面白屏 (#25) / fix blank screen when avatar data is invalid
  - 未绑定角色或所绑角色已删除的对话，统一归到默认角色 / fall back to the default persona for unbound or deleted-persona chats
  - 修复删除、归档对话时后台回合的状态问题 / fix background turn state when deleting or archiving chats
  - 归档或删除当前对话后，自动打开下一个对话 / open the next conversation after archiving or deleting the current one
  - 载入配置时逐条校验服务商与模型，单条出错不再清空全部配置 / validate providers and models individually so one bad entry no longer wipes the config
  - macOS 菜单栏改用单色图标 / use a monochrome menu bar icon on macOS
  致谢 / Thanks
  感谢每一位为 Deva 提交代码、反馈问题和提出建议的朋友 / Thanks to everyone who contributed code, reported issues and shared ideas.
