ShortDescription: Build, run and test SwiftUI iPhone apps on Windows, on your real iPhone, with no Mac.
Description: |-
  SwiftWin Studio compiles SwiftUI apps with the open-source Swift toolchain, signs them with your Apple ID,
  installs them on the iPhone plugged into your PC over USB, and shows the phone live on your screen, where a
  click is a tap. It includes a code editor, app logs and crash reports, the `swiftwin` command line, and an MCP
  server so AI agents such as Claude Code or Codex can build, run and test the app on the phone.
