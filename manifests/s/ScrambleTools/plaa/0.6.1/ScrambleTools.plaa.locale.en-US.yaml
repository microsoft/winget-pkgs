ShortDescription: A fast, lightweight media player for video and audio files and streams
Description: |-
  plaa plays nearly every video and audio format through FFmpeg, decoding on the graphics card where it can, with one window per file and controls that float over the picture.
  It trims, splits and exports, records sound, the screen and a camera, casts to Chromecasts and DLNA renderers, and shows a spectrum, waveform or 3D scene for sound files.
