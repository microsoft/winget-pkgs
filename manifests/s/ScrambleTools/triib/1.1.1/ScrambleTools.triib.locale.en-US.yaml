ShortDescription: A simple yet full-featured network audio controller for AVB and Milan
Description: |-
  triib manages every Milan and AVB device on the network: it connects streams, maps streams and clocks across the network, and changes formats, clocks, channel maps and controls, with triib-cli for the command line.
  triib reaches the network through Npcap (https://npcap.com), which it offers to download when it is missing.
