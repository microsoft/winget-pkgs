ShortDescription: Discover, connect and set up AVB and Milan devices
Description: |-
  triib is an ATDECC (IEEE 1722.1) controller with Milan, AVB Lite and AVB Wireless support: a connection matrix, the network as gPTP shows it, device settings and firmware updates, presets and a frame log, with triib-cli for the command line and an MCP server for AI agents.
  On Windows, triib reaches the network through Npcap, whose license keeps installers from carrying it: install Npcap from https://npcap.com first.
