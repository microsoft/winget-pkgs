ShortDescription: Extract huge zip files on a nearly full drive, giving the space back as it goes.
Description: |-
  ZeroZip extracts a zip in place when the drive has no room for both the zip and its contents.
  It works from the end of the archive, and once each file is written and CRC-checked it cuts
  that file's data off the zip, so free space comes back during the run. Before starting, it
  shows how low free space will get, and a stopped run picks up where it left off.
  The zip is used up: when ZeroZip finishes, the zip is gone.
