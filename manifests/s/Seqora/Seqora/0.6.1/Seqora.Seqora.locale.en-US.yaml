ShortDescription: Desktop database client for PostgreSQL, MySQL, MariaDB, SQLite and SQL Server.
Description: |-
  Seqora is a desktop database client for PostgreSQL, MySQL, MariaDB, SQLite and SQL Server. It runs on your computer with no account and no cloud service in between.
  Write SQL with completion and history, browse and edit rows, chart and export results, and read your schema as an ER diagram. The free version can be used for any purpose, including paid work. Seqora Pro adds schema design, where every statement the design writes is shown for review before it runs, plus schema compare, history and drift.
