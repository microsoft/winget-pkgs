ReleaseNotes: |-
  Highlights
  - Connect to Microsoft SQL Server 2016 and later, including Azure SQL Database: browse, filter and edit tables, run SQL with GO batches, draw the ER diagram and open the database brief. Connection strings from TablePlus, DBeaver, DataGrip, .env files, ADO.NET and JDBC are read.
  - Geometry and geography values draw as shapes in the cell inspector, with their type, SRID, bounds, area and length, and WKT and GeoJSON to copy.
  - Seqora sends one anonymous usage report a day unless you turn it off in Settings › Privacy, which shows the report before it goes.
  Fixes
  - Closing the table change review with Keep editing or Escape no longer crashes the app or loses the staged edits.
  - A staged delete is rolled back when the row changed since it loaded, and running SQL beside a table pane no longer discards that pane's staged edits.
  - Binary values are no longer exported as the grid's size label, exports say which columns were left out, and SQL exports quote every identifier.
  - Windows: Seqora starts on a PC without the Visual C++ Redistributable again.
  - Double-clicking the title bar maximizes and restores the window.
  - Dates before the year 100, time fractions and large floats print as the database does, and a later result in the same editor keeps its own column order.
  - Pasted connection URLs are read in more forms, passwords never show in the clipboard banner, and connection errors say which field to fix.
  - Many smaller fixes to contrast, keyboard focus, labels and dialogs.
