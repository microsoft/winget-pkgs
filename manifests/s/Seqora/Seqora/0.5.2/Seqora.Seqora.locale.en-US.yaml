ReleaseNotes: |-
  Highlights
  - Install Seqora's MCP server into Claude Code from Settings even when the claude command is unavailable or installation through it fails. Copy config also offers a JSON configuration when the command is unavailable.
  Fixes
  - Agent setup finds the Microsoft Store version of Claude Desktop's configuration and uses VS Code Insiders when it is the available installation.
  - Installing Seqora into an agent's JSON configuration now accepts comments and trailing commas, while preserving other entries, comments, key order, indentation, and line endings.
  - Settings shows Installed when the agent's configuration contains its current Seqora access token, and Old token when the configured token no longer works. Copying a configuration alone no longer marks an agent as installed.
