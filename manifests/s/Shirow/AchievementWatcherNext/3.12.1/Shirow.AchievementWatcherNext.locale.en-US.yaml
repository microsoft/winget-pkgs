ShortDescription: Free achievement tracker with unlock popups for Steam, GOG, Epic, Ubisoft, EA, Xbox PC, emulators and RetroAchievements.
Description: |-
  Achievement Watcher Next is the successor of Achievement Watcher. It collects achievements, rarity and playtime from Steam, GOG, Epic, Ubisoft Connect, EA, Xbox PC, RetroAchievements and emulated games (Goldberg, GBE Fork, Uplay R1 and R2) into one library.
  When you unlock an achievement it shows a customizable popup over the game, and an in-game overlay lists what is left to unlock.
