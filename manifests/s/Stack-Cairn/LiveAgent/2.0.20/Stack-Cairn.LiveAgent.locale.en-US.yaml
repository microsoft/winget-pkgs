ReleaseNotes: |-
  LiveAgent v2.0.20
  内置 K-brain v0.107.32。
  新功能
  - 内置浏览器（#1293）：右侧栏新增「浏览器」工具，用本机已安装的 Chrome / Edge（独立 profile，不影响日常浏览器）在应用内浏览网页。
    - 多标签页、前进/后退/刷新、地址栏（直接输入域名或搜索词）。
    - 元素拾取：点工具栏的拾取按钮，悬停高亮、点击后把元素信息（URL、选择器、XPath、文本、属性、位置等，密码框内容会被遮盖）插入对话输入框，方便直接让 agent 改这个元素。
    - 截图发到对话：一键把当前页面截图附加到输入框。
    - 对话里的本地开发链接（localhost、内网 IP、.local、.test）点击后直接在内置浏览器打开。
    - 导入本机登录态：「更多」菜单 →「从本机浏览器导入登录状态」，选择 Chrome / Edge / Brave / Chromium 的某个 profile（可按站点筛选），把 cookie 复制到内置浏览器，免去重新登录。只在本机解密和复制，cookie 内容不会上传或显示；macOS 会弹出钥匙串授权。Windows 上 Chrome 127+ 的应用绑定加密 cookie 无法被第三方读取，会在结果中标为跳过。
    - 「清除浏览数据」可一键清空内置浏览器的 cookie、缓存和导入的登录态。
    - 仅桌面端提供，WebUI 暂不显示。
  修复
  - 会话统计条读数跳动、忙等超时报错无法操作（#1288，v2.0.19 已包含）。
  - 中断子代理后会话历史对账、后台通知不再显示成用户气泡、未受理输入不丢失（#1291）。
  - 内置 K-brain 升到 v0.107.32：kn 新增 /skills 命令（#1287）。
  完整变更：https://github.com/Stack-Cairn/LiveAgent/compare/v2.0.19...v2.0.20
