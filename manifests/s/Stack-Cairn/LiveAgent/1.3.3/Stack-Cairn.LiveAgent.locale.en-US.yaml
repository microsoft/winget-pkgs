ReleaseNotes: |-
  LiveAgent v1.3.3
  修复 v1.3.2 中会话「更多」菜单被归档入口取代造成的回归，删除会话与转移工作空间等操作恢复可用。
  Overview
  本版是一个聚焦回归修复的小版本。v1.3.2 的会话侧栏改版把会话行上的「更多」按钮换成了「归档」，却没有在桌面端留下打开原菜单的入口，导致删除会话、转移工作空间等操作无法访问（#782）。本版恢复「置顶 + 更多」的交互，并完整移除会话归档功能。
  Fixed
  - 会话操作菜单：恢复会话行的「置顶 + 更多」菜单，删除确认、转移工作空间、运行状态限制等操作重新可用。
  - 会话归档：移除会话归档的入口按钮、归档列表、对应设置字段、分页过滤与专用删除处理，以及中英文文案。
  - 菜单样式：会话菜单与工作空间子菜单统一为 12px 文字、14px 图标，图标不再被过长的路径压缩。
  Internal
  - 实现范围：agent-ui 共享组件（ChatHistorySidebar*）、桌面端与 Gateway WebUI 两侧的 sidebar container、lib/sidebar 存储与偏好、Tauri 设置类型与规范化、中英文翻译。移动端继续保留长按菜单。
  - 测试：新增真实菜单组件的打开、转移、删除确认与运行状态限制用例；更新旧设置兼容与分页测试；补齐既有侧栏测试遗漏的图标 mock。
  - 兼容性：旧版本写入的归档标记不再隐藏历史会话，历史消息不会被删除；原有工作空间归档保持可用。
  Full Changelog: https://github.com/Stack-Cairn/LiveAgent/compare/v1.3.2...v1.3.3
