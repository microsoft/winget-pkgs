ReleaseNotes: |-
  LiveAgent v1.2.5
  LiveAgent v1.2.5 improves workspace and chat workflows with conversation moves, worktree support, checkpoints, richer file handling, provider updates, and a broad set of WebUI stability fixes.
  Overview
  This release focuses on making day-to-day agent work more reliable across chat, workspace files, Git projects, providers, and WebUI interactions. It adds new workspace and Git capabilities, improves context and checkpoint handling, expands SFTP and image workflows, and fixes several issues that could affect conversation persistence, settings, Windows behavior, and WebUI layout.
  Highlights
  - Conversation management: Move conversations to another workspace, including single and batch moves, by @devil233-ui in #356.
  - Workspace access: Added external directory authorization and multi-root file access by @yovinchen in #468.
  - Git workflows: Added Git worktree support with sidebar project grouping by @Mieluoxxx in #404.
  - Checkpoints: Added session-level file change checkpoints and code rewind support by @xiaozhou26 in #504, then moved rewind controls into the user message row by @su-fen in #524.
  - Context handling: Added a context usage ring and more reliable manual compaction by @su-fen in #426, with touch and tooltip refinements in #432.
  - File workflows: Added folder import via drag-and-drop routing for workspace and attached directories by @yovinchen in #484.
  Added
  - Chat: Added durable task lists across context compaction by @su-fen in #416.
  - Chat: Added an interactive image viewer by @Is14w in #513.
  - Workspace preview: Upgraded image preview with anchored pan and zoom, rotation, file actions, metadata, and fullscreen support by @Is14w in #461.
  - SFTP: Added file editing for local and remote files in the SFTP panel by @su-fen in #476.
  - Git: Added semantic commit message generation from staged changes by @AlphaCatMeow in #442.
  - Providers: Added support for full request URLs by @yovinchen in #433.
  - Providers: Added DeepSeek as an official provider group and fixed a v1.2.4 stream interruption regression by @su-fen in #502.
  - Shell: Added resumable Bash sessions with ProcessWait and ProcessStop by @su-fen in #509.
  - Automation: Raised the Auto Prompt cron timeout cap and starts the lease at claim time by @su-fen in #519.
  Changed
  - Provider behavior: Made the Codex cache prompt protocol optional and aligned Responses behavior with the CLI by @su-fen in #436.
  - Dependencies: Upgraded Monaco to 0.56 and KaTeX to 0.18, with language mapping moved to the Monaco registry by @su-fen in #497.
  - Skills and MCP: Standardized the Skills and MCP UI by @Loosand in #427.
  - Composer: Consolidated composer controls and added session workbench foundation work by @yovinchen in #501.
  - UI architecture: Shared chat rendering across GUI and WebUI by @su-fen in #419.
  - Frontend architecture: Extracted shared frontend logic into agent-ui by @su-fen in #443.
  - UI maintenance: Split oversized frontend UI files by @su-fen in #470.
  - Dialogs: Replaced modal implementation with a Dialog component by @Loosand in #448.
  - Model catalog: Refreshed the model catalog in #417, #425, #451, and #472.
  Fixed
  - Chat persistence: Fixed long-turn final history save failures that could cause conversation loss by @thirsty5034 in #445.
  - Chat compaction: Preserved history revision across compaction by @su-fen in #532.
  - Checkpoint rewind: Preserved checkpoint hashes during rewind in WebUI by @su-fen in #534.
  - Chat stop behavior: Fixed retry flows where pressing stop could leave the spinner running by @AlphaCatMeow in #458.
  - Chat links: Fixed cross-platform local file link path parsing by @su-fen in #422.
  - Shared conversations: Included the gateway port in shared conversation links by @su-fen in #424.
  - Chat layout: Prevented the input scrollbar from covering the context usage ring by @su-fen in #438.
  - Tool previews: Prevented tool argument expansion areas from truncating MCP and long parameters by @24baigei in #460.
  - Composer layout: Kept composer dropdowns above the prompt input by @su-fen in #527.
  - Settings: Fixed WebUI model refresh button disabled state and false missing-key reports by @su-fen in #463.
  - Settings: Prevented WebUI save status wrapping by @su-fen in #466.
  - Settings: Aligned provider credential fields by @yovinchen in #469.
  - Updater: Avoided restarting the app directly while tasks are running by @Skitre in #434.
  - Windows: Fixed sidebar dropdown rename responsiveness on Windows by @devil233-ui in #423.
  - Windows: Skipped WSL bash.exe app execution aliases during PATH scanning by @su-fen in #498.
  - WebUI: Restored the SFTP dual-pane bottom horizontal scrollbar by @su-fen in #447.
  - WebUI: Fixed new Worktree and path picker dialog layering by switching to Base UI Dialog by @su-fen in #450.
  - WebUI: Fixed right sidebar background task tab cross-host sync and state mirroring recovery by @su-fen in #453.
  - Markdown: Allowed selecting and copying text in workspace Markdown preview by @changshunxu520 in #431.
  - i18n: Detected system locale on first launch by @Is14w in #474.
  - i18n: Localized hard-coded fallback copy by @Is14w in #480.
  - Models: Fixed model limits involving aggregator prefixes and provider source data by @AlphaCatMeow in #482.
  - Providers: Upgraded pi to 0.84.2 and fixed three semantic regressions by @su-fen in #495.
  - Agent import: Reworked directory import liveness tracking with cross-process activity markers by @yovinchen in #487.
  - Scripts: Fixed Windows path separator false positives in UI boundary checks by @Smithhss in #455.
  - Tests: Aligned save_system_persists_project_setting_rows with workspace resource settings by @thirsty5034 in #414.
  - Repository: Restored the test/workspace directory that had been excluded by .gitignore by @su-fen in #494.
  Internal
  - Added gateway directory import handling, upload tests, WebSocket managed process tests, WebUI directory import tests, and gateway Git/socket client tests.
  - Refactored gateway socket code into shared, RPC, and transport modules.
  - Added workspace project root adapters, directory drop helpers, upload directory utilities, and multiple gateway runtime hooks.
  - Updated generated gateway protocol files and related gateway types.
  - Improved prompt cache hit rate with prefix observation and deferred runtime state classification by @xiaozhou26 in #489.
  - Full changelog: https://github.com/Stack-Cairn/LiveAgent/compare/v1.2.4...v1.2.5
