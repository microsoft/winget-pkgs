ReleaseNotes: |-
  Improvements
  - Bundled K-brain updated to v0.107.36 (#1326): in the kn terminal UI, a message typed while a turn runs waits in the editable queue only until the current round of tool calls ends, then joins the same turn, so the model reads it right after the tool results instead of after the whole turn. Slash commands still wait for the end of the turn, and a message the turn ends before reading goes back to the queue.
