ReleaseNotes: |-
  LiveAgent v1.3.6
  This release focuses on broad UI polish and consistency across LiveAgent, adds versioned release announcements, and fixes several navigation, scrolling, and window-sizing issues.
  Overview
  LiveAgent v1.3.6 brings a unified UI pass across Desktop, Gateway, and agent-ui, along with dark-mode and sidebar refinements. It also introduces per-version update announcements, improves chat navigation and scrolling behavior, and restores narrower desktop window support.
  Highlights
  - Unified styles, animations, and shared components across Desktop, Gateway, and agent-ui (#824, @Loosand)
  - Versioned release announcements for the desktop updater (#833, #850, @Is14w, @coder-hhx)
  - Improved dark-mode controls, sidebar consistency, and preserved conversation reading positions (#828, #831, @AlphaCatMeow, @Loosand)
  - Branch switcher now supports filtering in git review (#843, @AlphaCatMeow)
  - Multiple chat, sidebar, and scrolling fixes for smoother navigation (#836, #837, #839, #841, @AlphaCatMeow)
  - Desktop window can be resized down to 480px (#847, @coder-hhx)
  - Restored the workspace “new group” entry in the sidebar (#848, @yovinchen)
  Added
  - Versioned release announcements in the desktop app (#833, #850)
  - Filter input in the git-review branch switcher menu (#843)
  - ESC key support to return from settings to the conversation view (#836)
  - Support for narrowing the desktop window to 480px (#847)
  - Runtime supplement layer for thinking-tier model data from models.dev, using snapshot, live, and fallback behavior
  Changed
  - Unified UI styles, animations, and shared components across Desktop, Gateway, and agent-ui (#824)
  - Improved dark-mode controls and sidebar consistency while preserving conversation reading positions (#831)
  - Right dock content now follows panel width after the left sidebar expands (#841)
  - Cross-workspace conversation selection now activates the corresponding workspace and syncs the right-side file tree (#837)
  - Refreshed model catalog snapshots and relaxed the moonshotai snapshot guard
  Fixed
  - Dark-mode sidebar and main panel divider no longer appear overly bright (#828)
  - Chat transcript no longer suddenly jumps upward near the bottom; snap-to-bottom behavior was removed and end anchoring corrected (#839)
  - Eliminated height jumps when switching between the conversation page and system settings (#836)
  - Sidebar selection of cross-workspace conversations now syncs workspace and file tree in one step (#837)
  - Right toolbar content now reflows with the panel width when the left sidebar is expanded (#841)
  - File tree ignore rules are now scoped to the workspace’s own git repository (#838)
  - Desktop window can now be resized edge-to-edge down to 480px (#847)
  - Restored the workspace new-group entry in the sidebar (#848)
  - Removed the chat sidebar right border
  Internal
  - Release tooling: keep reasoning output out of AI release notes and inject numeric MSI versions for named prerelease tags
  - CI: support shared TypeScript configs in isolated builds and restore isolated TypeScript builds
  - Added browser-based scroll-follow probe and transcript scroll-follow contract tests
  - Updated UI refactor tests, style rule helpers, and shared component coverage
  - Enhanced macOS DMG build process with new settings and verification scripts
  - Added release announcement documentation and debug announcement preview
  Thanks to @AlphaCatMeow, @Loosand, @coder-hhx, @yovinchen, and @Is14w for their contributions.
