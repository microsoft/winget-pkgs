ReleaseNotes: |-
  LiveAgent v1.2.6
  LiveAgent v1.2.6 expands workspace, settings, and input capabilities while tightening several UI and runtime flows.
  Overview
  This release adds major end-user features across chat, settings, and speech input, alongside provider and platform updates that make the app more flexible to use day to day.
  Highlights
  - Session Workbench: adds a multi-pane workspace for side-by-side sessions and a terminal pane (#521).
  - Session trajectory view: introduces a three-lane timeline, event ledger, and dual-end access (#537).
  - Voice input: adds desktop and WebUI speech-to-text support (#529).
  - Settings sync: adds desktop config import/export plus WebDAV synchronization (#528).
  - Provider updates: DeepSeek now uses the Responses protocol and supports native search (#554).
  Added
  - Trajectory UI: adds live trajectory views and related mobile layouts/reconnect handling.
  - Settings workflows: adds grouped buttons for adding, importing, and configuring providers (#556).
  - STT support: adds speech input providers and settings for desktop and web.
  - macOS packaging: adds DMG configuration and a custom background image (#557).
  Changed
  - Session behavior: Session Workbench now supports multiple sessions in parallel with terminal panes (#521).
  - Sandbox handling: unifies OS sandboxing and the Windows workspace-write backend (#530).
  - Provider behavior: improves the failover provider picker (#541) and preserves native web search round trips for Claude (#547).
  - DeepSeek integration: switches the official provider to the Responses protocol with native search support (#554).
  Fixed
  - UI layering: fixes Portal overlays inside modal dialogs so they remain interactive (#539).
  - Mobile controls: improves mobile composer and settings-page interactions and layout (#549, #551).
  - Mermaid fullscreen: restores wheel zoom and fixes fullscreen blur (#544, #535).
  - Tunnel behavior: removes the fixed connection limit for public tunnels (#543).
  Internal
  - Protocol and gateway updates: refreshes gateway protobufs and websocket handling.
  - Settings and history plumbing: expands backup, WebDAV, STT, and trajectory-related backend commands.
  - Test coverage: adds and updates tests across gateway, WebUI, trajectory, settings, and runtime paths.
  - Build and release tooling: updates CI, packaging, and release configuration files.
