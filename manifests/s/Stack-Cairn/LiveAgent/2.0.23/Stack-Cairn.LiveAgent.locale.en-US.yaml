ReleaseNotes: |-
  LiveAgent v2.0.23
  内置 K-brain v0.107.34（与 v2.0.22 相同）。
  本版以修复为主，感谢 @annasu3004 报告并修复 #1304–#1312，感谢 @AlphaCatMeow 修复 #1298。
  WebUI / Gateway
  - 切换设备后的设置保存（#1313，修复 #1304）：排队中的设置保存只会写回发起保存的那台设备，不会再写到刚切换过去的设备；旧设备的请求慢，也不会卡住新设备上的保存。
  - 大附件上传（#1314，修复 #1305）：超过 16 MiB（含元数据）的附件或附件批次，会直接返回「超出桌面端传输上限」，桌面端连接不再因为单帧过大而断开。
  - 目录上传（#1315，修复 #1306）：目录上传里只要有约 500 个以上的小文件，就会报 “invalid multipart form”；现在承诺的 2000 个文件以内都能正常上传，文件数、总字节数和字段大小仍有上限。
  - 联网搜索状态（#1316，修复 #1307）：迟到的旧设置快照不会再把联网搜索的可用状态改回去。
  聊天
  - DeepSeek Flash 联网开关（#1297，修复 #1298）：选择 deepseek-flash 时联网开关可以正常打开，桌面端与 WebUI 的实际请求和开关状态保持一致。
  用量统计
  - 同一模型、多个提供方：
    - 模型分布环形图悬停时显示该提供方自己的用量，不再显示同名模型其他提供方的数字（#1317，修复 #1308）。
    - 「最常用模型」卡片合计该模型在所有提供方的用量，与排名口径一致（#1322，修复 #1309）。
  - 趋势线颜色（#1322，修复 #1310）：排名靠后的模型出现在近 7 / 30 日趋势中时，会分到各自不同的颜色，不再全部显示为灰色；优先使用环形图里没有占用的颜色。
  - 热力图说明（#1303，关联 #1302）：说明改为「颜色越醒目用量越多」。深色主题下用量越多的格子越亮，与浅色主题方向相反，这是有意为之，保证用量最多的日子最显眼。
  - 只在 K-brain 返回的数据缺字段时才会触发的两处兜底计算（#1322）：
    - 缺少总量时不再重复计入缓存 token（修复 #1311）。
    - 缺少汇总时，「当前连续天数」只算到今天或昨天为止，不再从很久以前的最后一次活跃往回数（修复 #1312）。
  完整变更：https://github.com/Stack-Cairn/LiveAgent/compare/v2.0.22...v2.0.23
