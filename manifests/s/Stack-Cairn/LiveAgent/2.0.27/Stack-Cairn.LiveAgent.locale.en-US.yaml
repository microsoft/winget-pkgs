ReleaseNotes: |-
  Fixes
  - Sidebar: a conversation deleted elsewhere no longer reappears after a refresh, or when a page that was loading during the deletion arrives late (#1338, #1339).
  - Updater: a release that was withdrawn, or is only available as a manual download, between the check and the install no longer reports a successful install or restarts the app (#1340, #1341).
  - Find in conversation: matches text inside fenced and inline code (for example HTML tags) and words with characters such as İ pasted as is; highlights land on the original text. Re-reading the transcript while a reply streams with the find bar open stays fast (#1342, #1343).
  - WebUI paste: pasting several files with the same name, size, type and timestamp but different contents keeps all of them (#1344, #1345).
  - Desktop transcript: when rows change order, their measured heights move with them instead of staying at the old positions (#1346, #1347).
  - Queued messages: removing an image while editing a queued message actually removes it from the request the model receives; attachments added while editing are included (#1348, #1349).
  - K-brain runs: if the response confirming a new run, /goal set or /goal resume is lost after K-brain accepted it, the desktop app recovers the run by its request ID and keeps following it, without submitting it again (#1350, #1351).
  - Goal bar: a goal query that returns late no longer overwrites a newer state, such as a pause the user just made (#1352, #1353).
  - Gateway: the hello response is written before any other frame, and event subscriptions start before it (#1337).
