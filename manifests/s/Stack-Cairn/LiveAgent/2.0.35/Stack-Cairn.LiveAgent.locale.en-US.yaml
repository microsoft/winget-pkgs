ReleaseNotes: |-
  New
  - Tool rows show the MCP server's display name, for example "Fixture Apps · show_chart", instead of its internal key. (#1389, via #1390)
  Improved
  - Faster startup.

    |                                   | Before  | After   | Change |
    | --------------------------------- | ------- | ------- | ------ |
    | Desktop startup JavaScript (gzip) | 356 KB  | 257 KB  | −28%   |
    | WebUI startup JavaScript (gzip)   | 1.60 MB | 1.23 MB | −23%   |

    - Feature translations load with the feature that uses them.
    - The WebUI now loads Settings, the dashboards, dialogs and dock panels on demand. (#1391, via #1392)
  - Speech-to-Text speaks your language. The "Current runtime" line and microphone, transport and composer errors are now translated instead of always showing Chinese. Messages from the speech provider are still shown exactly as received. (#1395, via #1396)
  - WebUI connected straight to K-brain: changing the language or theme no longer shows "Save failed". These preferences are kept in the browser, and any other rejected setting still reports an error. (#1395, via #1396)
  - Visual consistency: most remaining hard-coded colors and sizes now use shared design tokens. That covers image preview, lightbox, attachments, the clarify panel, the terminal, the status dashboard and the hub pages. Small visible changes:
    - command palette rows are slightly tighter;
    - inline terminal output uses the shared terminal color;
    - the dark-mode switch is a touch deeper blue.
    (#1389, via #1390)
  - Composer: pressing Escape right after typing @ or / now reliably closes the suggestion menu. Before, a stale re-check could occasionally reopen it. (#1393, via #1394)
  - Bundled K-brain is now v0.107.44:
    - scheduled task runs that start in the same millisecond keep their order;
    - a desktop that has quit is reported as "not connected" instead of a raw request error.
    (#1397, via #1398)
  Quality
  - The Gateway sends the "dequeued" snapshot before starting the next queued run. This fixes an intermittent ordering failure in tests. (#1393, via #1394)
  - The CJK literal check now also covers .ts sources. Existing literals are recorded in a baseline that can only shrink. (#1395, via #1396)
  - The design-token baseline went from 680 to 228 entries. (#1389, via #1390)
