ReleaseNotes: |-
  LiveAgent v2.0.22
  内置 K-brain v0.107.34。
  新功能
  - 用量统计（#1300，修复 #1299）：新增「设置 → 用量统计」页，汇总所有会话的 token 用量。
    - 概览：总 token（输入/输出）、会话数与消息轮数、活跃天数与最长连续天数、最常用模型、最长会话、当前连续天数；能按模型单价计价时显示估算费用。
    - 活跃热力图：最近 52 周，可切换每日 / 每周 / 累计；颜色按当前视图的四分位分级，个别用量特别大的日子不会让其他格子全部变浅。
    - 每日趋势：近 7 日 / 近 30 日，按用量最多的几个模型分线显示，悬停查看当天总量和各模型用量。
    - 模型分布：环形图加明细（占比、token、提供方），超过 6 个模型时合并为「其他模型」。
    - 数字按语言使用 万/亿 或 K/M/B。桌面端与 WebUI 均可用。
    - 统计口径与会话用量一致：输入已包含缓存读写，总量 = 输入 + 输出；子代理用量只计一次。
  内置 K-brain v0.107.34
  - 新增跨会话用量统计接口 /v1/usage/stats（K-brain #209）。
  - Windows：会话文件被其他程序短暂占用时，保存会自动重试，不再报 “Access is denied”。
  已知限制
  - 没有落成消息的模型调用（压缩、审阅、失败请求）不计入按天统计，总量可能略低于会话自身的计数。
  - 运行中的子代理在结束后才计入。
  完整变更：https://github.com/Stack-Cairn/LiveAgent/compare/v2.0.21...v2.0.22
