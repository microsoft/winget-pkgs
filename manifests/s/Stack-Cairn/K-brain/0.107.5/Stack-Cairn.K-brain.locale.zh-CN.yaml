ReleaseNotes: |-
  K-brain v0.107.5
  本版从 main 的 b1e074771fef3e79fb48beab44a6ab445335545b 构建。
  更新
  - 完善 LiveAgent 后端协议、历史读取、运行恢复及供应商请求兼容。
  - 日程补齐重复规则、RDATE/DURATION、自定义时区与订阅刷新错误恢复。
  - 统一后端日程时区偏好和版本冲突检查，支持客户端同步。
  下载与校验
  提供 macOS、Linux、Windows 的 x64/ARM64 CLI 与 computer helper，共 12 个二进制；SHA256SUMS 用于校验下载文件。
  跨平台构建、computer 协议测试及 Linux 桌面集成工作流通过。发布的 macOS ARM64 CLI 已验证版本输出、后端健康检查和父进程 stdin 关闭后退出；其他平台不等同于完整真机验收。
  完整变更
