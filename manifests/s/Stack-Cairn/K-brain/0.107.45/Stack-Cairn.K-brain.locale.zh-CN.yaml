ReleaseNotes: |-
  新增
  - 终端界面：思考显示精简。
    - 每轮的思考合并成一行“Thought for Ns”，少于 1 秒的不显示。
    - 进行中只保留一个状态提示。
    - Ctrl+O 切换时只在底栏短暂提示，不再写入对话记录。
    - 新安装默认隐藏思考，已保存的选择不受影响。（#248）
  - 终端界面：新安装默认“每次询问”。
    - 权限模式按项目保存，不会每次启动都重置。
    - 首次运行时会说明当前模式。
    - 底栏的模式标签不再被截断。
    - 已有用户的设置不变。（#248）
  - 终端界面：不依赖 Alt 的快捷键。
    - Ctrl+]：切换顶部面板。
    - Ctrl+F：展开工具输出。
    - Shift+↑：把焦点移到对话记录。
    - Ctrl+E：编辑排队的消息。
    - 各处提示统一。（#248）
  - 终端界面：大段粘贴保持折叠。 发出后在对话记录里也折叠显示，可以展开查看；超过 40 行的消息只显示开头几行。（#248）
  - 终端界面：子代理审批写明请求方。 卡片标题写明是哪个子代理在请求，并显示还有几个待处理；等待审批时，子代理所在行显示“waiting for approval”。（#248）
  - 后端：保存思考内容。 重新打开对话时能看到。（#248）
  - 后端：保存中断前已经输出的内容。
    - 流中断时，已输出的部分照样保存。
    - 还没输出就停止时，会记录一条“已停止”标记。
    - 后端正常关闭导致的中断带 cancel_reason:"shutdown"。
    - 每完成一轮工具调用就保存一次会话。（#248）
  - 后端：结构化错误信息。
    - 失败的运行带上 error_detail（类型、上游状态码、服务商消息）。
    - 拉取模型列表失败时返回 errorCode 和 upstreamStatus。
    - 重试事件新增 retries_remaining。（#248）
  - 后端：新增文件提及接口。 /v1/fs 新增 mention_list，遵守 .gitignore 和 .ignore，跳过 node_modules 等目录，结果按查询排序，并标明是否截断。（#248）
  修复
  - 终端界面：一次到达的文字里，和按键同名的单词不再被当成按键执行。 输入法整段上屏、语音输入、SSH 卡顿时都会遇到，例如 up、home、delete。（#246）
  - 未配置模型服务商时直接提示怎么配置。 以前要空转约 70 秒才报错。（#246）
  - 模型迟迟不返回响应头时，显示“无响应，正在重试”并自动重试。 以前会误报成“已中断”。（#246）
  - 工具参数是非法 JSON 时，把错误回给模型重试。 以前这一轮直接静默结束。（#246）
  - 以路径开头的消息正常发送；未知命令会保留草稿。（#246）
  - 回退浏览时输入的文字回到输入框；回退前先确认。（#246）
  - 审批卡片： 差异的上下文行、写文件时的行数、选项标签都改正了。（#246）
  - 命令面板： 标题和底部提示固定显示。（#246）
  - 异步通知： 异步通知同时显示在底栏，翻看记录时也不会错过。（#246）
  - 输出截断： 截断时在行首或字符边界切开。（#246）
  - 读取行数： 读取以换行结尾的文件时，行数不再多算一行。（#246）
  - 输入框提示： 占位提示和实际状态一致。（#246）
  兼容性
  - 后端新增的字段都是可选的，原有字段不变，旧版客户端不受影响。
  - 新增能力项 filesystem_mention_list。旧后端收到 mention_list 会返回 422。
  - config.json 新增可选字段 permissionMode。
  其他
  - 补充了回归测试，并更新了终端界面的快照基准。
