ReleaseNotes: |-
  修复
  - kn：屏幕错位后能恢复（#210, #211）。屏幕被 kn 之外的输出或终端自身挪动后，输入框上方的分隔线等不变的行会一直残留旧内容，例如重复出现的一条旧信息行。
    - 新增 Ctrl+L 整屏重绘，任何对话框、浮层打开时都能用。
    - 每轮结束、终端重新获得焦点时自动重绘一次，不清屏，不闪烁。
