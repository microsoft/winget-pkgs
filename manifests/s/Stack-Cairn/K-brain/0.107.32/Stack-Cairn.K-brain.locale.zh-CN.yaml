ReleaseNotes: |-
  K-brain v0.107.32
  本版从 main 的 72552d7 构建，在 v0.107.31 的基础上为 kn 终端界面新增 /skills 命令。
  kn 界面（#202）
  - 新增 /skills [筛选词]（别名 /skill）：直接打开技能列表，不用再到 /extensions 里切标签页。
    - 先列顶层技能，再按技能包分组；只能按名字调用的技能标 manual，有问题的标 warning；
    - 可以直接输入筛选，/skills review 打开时就带着筛选词，匹配名字、说明和路径；
    - 预览显示说明、所属技能包和 SKILL.md 路径，路径相对 ~ 或当前目录显示。
  - 按 Enter 插入技能：把 $名字 插到输入框光标处，已有草稿保留，接着写要求就能调用。/extensions skills 页同样支持。
  - /skills 可以在 / 补全菜单和 Ctrl+P 命令面板中找到，回合进行中也能使用。
  下载与校验
  提供 macOS、Linux、Windows 的 x64/ARM64 CLI 与 computer helper；SHA256SUMS 用于校验下载文件。
  完整变更：https://github.com/Stack-Cairn/K-brain/compare/v0.107.31...v0.107.32
