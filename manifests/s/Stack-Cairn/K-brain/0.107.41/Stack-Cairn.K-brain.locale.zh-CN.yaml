ReleaseNotes: |-
  kn 终端界面优化
  性能
  - 长会话调整窗口大小提速约 8 倍（1000 轮：3.7s → 0.47s），拖动窗口边缘从约 80s 降到 1s 内；恢复长会话 3.7s → 2.0s。语法高亮结果缓存，连续 resize 合并为一次重排。(#229)
  - 新增同步输出（DEC 2026），支持的终端中每帧原子刷新，减少流式输出时的闪烁；可用 K_BRAIN_SYNC_OUTPUT=0/1 强制开关，/doctor 显示状态。(#236)
  新功能
  - 内联模式：kn --inline 或 /settings → Inline mode。不使用备用屏幕，已完成的对话写入终端滚动缓冲区，退出后仍可翻看与搜索。(#236)
  - 会话总览 /dashboard：各会话的状态、模型、工作区、最近活动与费用，支持打开、新建、删除、过滤、分组。(#237)
  - Mermaid 图：回复中的流程图、时序图渲染为终端字符图，焦点模式按 m 用系统程序打开源码。(#237)
  - 主题：内置 dusk、harbor、paper、contrast 等主题，/theme 实时预览；支持 ~/.liveagent/themes/*.json 自定义主题；运行中跟随终端深浅色。(#238)
  - 紧凑模式 /density compact、正文宽度上限 maxContentWidth、状态行内置项目与多行输出。(#238)
  - vim 模式（/vim，默认关闭）。(#235)
  快捷键变化（按终端习惯）
  - Ctrl+K 改为剪切到行尾，Ctrl+E 改为移到行尾；清空对话只能用 /clear。
  - 展开/折叠最近的工具结果改为 Alt+O。
  - 输入框支持 Shift+方向键选择；空输入框按 ? 或 F1 打开帮助。
  - 焦点模式（Alt+↑）新增 [/] 按回合跳转、y 复制、r 查看原始 markdown、Ctrl+U/Ctrl+D 半页滚动；向上滚动后按 End 回到最新。
  - diff 按词高亮变化部分。
  - macOS：/doctor 说明如何把 Option 设为 Meta；可选“Option as Alt”。(#235)
  修复
  - 列表项内多段落粘连、代码块背景断档、折行无续行标记。
  - “再按一次”类提示不再写入对话记录；状态行不再重复工具名、统一时间格式。
  - 选中标记与提示文字统一；队列选中行标反的问题。
  - kn 不再修改 tmux 全局 extended-keys，改为提示配置方法。(#230)
  完整按键说明见 docs/user-guide/03-tui.md，外观设置见 13-appearance.md。
