ReleaseNotes: |-
  K-brain v0.107.15
  本版从 main 的 c3aec1b 构建。v0.107.14 的构建没有完成发布，它的修复一并包含在本版中。
  修复
  - 压缩摘要被输出上限截断（#102）：压缩时报 compaction summary failed: response truncated by output limit (incomplete.max_output_tokens) 的问题已修复。推理模型的思考 token 也算进输出上限，原先固定的 4096 很容易被用完。现在的处理是：
    - 摘要被截断时自动加大输出上限重试，最多到 32768，不超过模型自身的上限；
    - 走缓存的同模型摘要仍被截断时，改用分块转录摘要；
    - 都失败时保留原有历史，不会用残缺摘要替换。
  - 设置里标了"文本与图片"的模型仍按纯文本处理（#103）。供应商 /models 目录把模型报成只有 text 时（中转站常见），设置里的覆盖不起作用：
    - Read / Image 报 image attachment unavailable for this model；
    - 对话里贴的图片被丢弃。
    现在设置里保存的输入能力优先于供应商目录；没有保存时仍按目录判断。
  下载与校验
  提供 macOS、Linux、Windows 的 x64/ARM64 CLI 与 computer helper，共 12 个二进制；SHA256SUMS 用于校验下载文件。
  完整变更
ReleaseNotesUrl: https://github.com/Stack-Cairn/K-brain/releases/tag/v0.107.15
