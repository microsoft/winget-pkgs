ReleaseNotes: |-
  K-brain v0.107.6
  本版从 main 的 0d84c4121b70079bced8b78feab565e1cd3f4b60 构建（与 v0.107.6-beta.28 相同），作为 LiveAgent v2.0.0 正式版的配套后端。
  更新
  - 记忆系统：大量稳定性与正确性修复，改进召回、写入与会话摘要缓存/增量同步。
  - 审批与权限：新增权限规则引擎，支持“允许并记住”、只读操作自动放行及 AI 审核；支持按运行设置权限模式。
  - 运行时：运行阶段与首个输出计时、SSE 心跳；会话级提示队列；文件修改版本化；只读文件系统资源；分支谱系；目标续跑与斜杠命令。
  - 自动化：持久化循环日程，子代理任务控制（暂停/取消/查看）。
  - 图像：支持 GPT Image 2/2.5 尺寸、Agnes 及 Image Studio 目标。
  - Computer：内嵌 Cua 运行时。
  - 上下文：缓存能力检测与复用前缀的压缩策略。
  - 隐私、网络与 TUI 多项修复。
  下载与校验
  提供 macOS、Linux、Windows 的 x64/ARM64 CLI 与 computer helper，共 12 个二进制；SHA256SUMS 用于校验下载文件。
  跨平台构建工作流通过。发布的 macOS ARM64 CLI 已验证 SHA256 校验与版本输出（k-brain v0.107.6）；其他平台不等同于完整真机验收。
  完整变更
ReleaseNotesUrl: https://github.com/Stack-Cairn/K-brain/releases/tag/v0.107.6
InstallationNotes: 在终端中运行 kn。首次使用前，请在 %USERPROFILE%\.k-brain\config.json 中配置模型提供商。
