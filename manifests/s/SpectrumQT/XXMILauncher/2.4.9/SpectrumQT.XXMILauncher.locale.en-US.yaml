ReleaseNotes: "**Available Editions** ([Installation Guide](https://github.com/SpectrumQT/XXMI-Launcher?tab=readme-ov-file#installation)):\n• For **Native Windows App** mode download `.msi` installer.\n• For **Portable** **or** **Linux** setup download `.zip` version.\n\n[![Support on Patreon](https://img.shields.io/badge/Support-PATREON-orange?logo=patreon&logoColor=white)](https://www.patreon.com/SpectrumQT)\n\n## Additions\n• **[EFMI]:** Added **Official Launcher Folder** option for **Direct Game Launch** mode.\n    • Required for **GRYPHLINK** and **Epic Games** game installations to work with direct launch.\n\n## Improvements\n• **[EFMI]:** Better **GRYPHLINK** auto-detection for non-global launcher.\n• **[Launcher]:** User-friendly error display for corrupted Steam app manifests.\n\n## Bugfixes\n• **[Launcher]:** Fixed **Steam** `localconfig.vdf` search being case sensitive.\n• **[GUI]:** Fixed missing error widget text word wrapping for settings options.\n• **[GUI]:** Fixed GUI error on message widget radio buttons spam.\n\n## Signature Extra\n• MGYCMQC3OXkHd2T7M4kiegoeY7x26EHKnoO3tVPiANULWTSEcBpZ5lfWeF9fuA0wJm3ScpACMQCGHYoLrtlesr2YRI7gn/oxr5Q5XNLRp7VC7vyqY+YwJeV75Q4k5TXrVyznGRzusNk=\n\n## Signature\n• MGYCMQDp4D1du+1Psu5eos0tpG6eu2R+qUR5QqOXboYQyRqUe+kG/yHglOFY6VQ00PRUtosCMQD3V8buL12VcNK1g6UJrgjmYZjU7U/h25mLyv0Wmu/or7kanMWZ/xDJmCfgpXHN8mo="
