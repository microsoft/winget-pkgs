ReleaseNotes: "**Available Editions** ([Installation Guide](https://github.com/SpectrumQT/XXMI-Launcher?tab=readme-ov-file#installation)):\n• For **Native Windows App** mode download `.msi` installer.\n• For **Portable** **or** **Linux** setup download `.zip` version.\n\n[![Support on Patreon](https://img.shields.io/badge/Support-PATREON-orange?logo=patreon&logoColor=white)](https://www.patreon.com/SpectrumQT)\n\n## Additions\n• **[EFMI]:** Experimental workaround for **Direct Game Launch** for **GRYPHLINK** and **EGS** installations of **Endfield** (kudos to [Gustav0](https://github.com/Seris0) for research).\n• **[EFMI]:** Added support for **Steam Game Launch** for **Endfield**.\n• **[GUI]:** Added user-friendly status messages for the game startup step in the launch sequence.\n\n## Adjustments\n• **[GUI]:** Enabled display of XXMI DLL-specific settings when using a non-XXMI DLL.\n    • Options requiring **XXMI DLL v1.2.0+** are now disabled (greyed out), with an explanatory warning in the tooltip.\n    • Options introduced in earlier versions of XXMI DLL remain enabled, but display a warning in the tooltip.\n\n## Bugfixes\n• **[Launcher]:** Fixed an issue where game window wait timeout error was not triggering if the game process started successfully.\n\n## Signature Extra\n• MGQCMHM47RLA0InYSwl0I3/q+i29TMQxLGCk1sjXlWatsLYfZ9Ap6u6qUT1m+X8+7sC2hAIwQ5FSxLlecaQX1vfzquIhrC4Jt33bb5494ZZeDcQllmC74FVe4NbLtuVg/67/fYgt\n\n## Signature\n• MGYCMQCpvMDgvLPq0GDLVH38g1KPRGMKrL04VLTVvUUceU1a4Y+KcJWTdEHRinxPhojDmgsCMQCHWCJ19nqXdB40hOe6at9cfdt74JMhvcZ0eWpHd6G3vo/9Q9hCRusKIRGu247/O2s="
