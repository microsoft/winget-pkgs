ReleaseNotes: "**Available Editions** ([Installation Guide](https://github.com/SpectrumQT/XXMI-Launcher?tab=readme-ov-file#installation)):\n• For **Native Windows App** mode download `.msi` installer.\n• For **Portable** **or** **Linux** setup download `.zip` version.\n\n[![Support on Patreon](https://img.shields.io/badge/Support-PATREON-orange?logo=patreon&logoColor=white)](https://www.patreon.com/SpectrumQT)\n\n## Additions\n• **[Launcher]:** Added integration with **Epic Games** and **Steam**. See the **Game Launch** option in the **General** tab.\n• **[XXMI]:** Added support for new **XXMI DLL** `d3dx.ini` options in the Model Importer settings tab.\n• **[WWMI]:** Added handling for WuWa **Resource Quality** settings.\n• **[ZZMI]:** Added detection and notification for duplicate ZZMI libraries in `Mods` folder.\n• **[GUI]:** Added indication of enabled logging verbosity level under the **Start** button.\n\n## Adjustments\n• **[GUI]:** Moved **Custom Launch** and **Start Method > Manual** to the **Game Launch** option in the **General** tab.\n• **[GUI]:** Moved **inject mode selection** from **Custom Launch** to the **XXMI DLL Injection Mode** option in the **[XX]MI** tab.\n\n## Overhauls\n• **[GUI]:** Redesigned the settings window layout.\n• **[Launcher]:** Significantly reworked the codebase and upgraded the build environment to the latest versions.\n\n## Improvements\n• **[Updates]:** **ZIP-channel** updates now respect the built-in proxy and pre-release settings.\n• **[Launcher]:** The **XXMI DLL** version now displays the version of the DLL in the MI folder.\n    • For non-live or third-party DLL it displays `X.X.X` instead.\n• **[Updates]:** Added file integrity verification after unpacking and deployment for better protection against corrupted disks.\n• **[Launcher]:** Improved automatic handling of errors caused by an already-open game.\n\n## Removals\n• **[WWMI]:** Removed WuWa configuration options that are no longer functional due to changes by Kuro.\n• **[WWMI]:** Removed unsupported performance tweaks.\n\n## Bugfixes\n• **[Launcher]:** Fixed missing handling of the `Config is missing {setting_name} setting` error caused by invalid `d3dx.ini` file.\n• **[GUI]:** Fixed the **Update Available** message remaining stuck in `--nogui` mode until game launch completed.\n• **[Launcher]:** Fixed few minor GUI and backend errors.\n\n## Hotfixes\n• **[v2.3.9]:** Fixed \"**Realtime**\" **Process Priority** handling.\n• **[v2.4.0]:** Minor GUI fixes and improvements.\n• **[v2.4.1]:** Fixed rare ZZZ launch workdir issues and old GUI themes handling.\n\n## Signature Extra\n• MGQCME1AYtwR/NAqLTmYGHN8uUpnNztecaHyYrT+MZXEcJXSgOnqpj9lXX3B8cVD62qt4AIwVqOmUMtbkn0KxI0mePFgGLr3AvkDirU/EdzW2137cDgDD8IVI6CpIVvG3yuOaLos\n\n## Signature\n• MGYCMQC7l/juPLgy81x2uuQHAXtC3+S+IDO+G0YgAPbCE/1Q/lFvuzH4vFmCJNQoI8ZTTD0CMQDB1fv7Uf5Y/4A33djRkkSxtba8ASd2Hd7Zpq2frU/oXP9bojaJAwCP5fvx/os4wQs="
