  [![Support on Patreon](https://img.shields.io/badge/Support-PATREON-orange?logo=patreon&logoColor=white)](https://www.patreon.com/SpectrumQT)

  ## Additions
  • **[GUI]:** Added animated background playback support for `.mp4` and `.webm` videos.
  • **[GUI]:** Added a **Launcher > Window Scale** option to adjust the launcher window size.
  • **[GUI]:** Added animated background FPS tracking widget (**Launcher > Theme Developer Mode**).

  ## Optimizations
  • **[GUI]:** Optimized animated background rendering and frame scheduling for smoother playback and improved responsiveness.
  • **[GUI]:** Minimized the performance impact of video resolution on animated backgrounds through efficient frame resizing.

  ## Improvements
  • **[GUI]:** Added error reporting for invalid options in `custom-tkinter-theme.json` when loading custom themes.

  ## Bug Fixes
  • **[Launcher]:** Optimized registry searches to reduce delays during game detection.
  • **[GUI]:** Fixed animated background failing to restart after GUI reload.
  • **[GUI]:** Fixed GUI elements becoming unresponsive when animated backgrounds were running on high-DPI monitors.
  • **[GUI]:** Fixed minor issues in the settings interface.

  ## Removals
  • **[GUI]:** Removed support for `.apng` animated images.

