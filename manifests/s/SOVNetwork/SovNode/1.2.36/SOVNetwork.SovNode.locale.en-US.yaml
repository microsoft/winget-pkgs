ShortDescription: Desktop wallet, end-to-end encrypted messenger and node for SOV Network, where each real person holds exactly one account.
Description: |-
  SOV Node is the desktop app for SOV Network (SOV = Self-Owned Value), an open-source network owned by the people who use it. One app holds your wallet, your messages and your identity.

  - One human, one account: enrolment happens on your phone with a palm scan and a live face check. No photo is ever stored or sent; the network compares protected templates. On a computer you restore the same wallet with your 12 recovery words.
  - End-to-end encrypted messages, photos, documents and groups. Nodes never store message content.
  - A fixed supply of 50,000,000 SOV. Not a blockchain, nothing to buy.
  - Optional: turn this computer into a node that serves the network.
  - A command line (sovnode) lets scripts drive the wallet, with spending limits every node enforces.
