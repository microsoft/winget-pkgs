ShortDescription: Le ventilo qui fait chut. Règle automatiquement les ventilateurs de la carte mère selon la température.
Description: |-
  Chutoki règle tout seul la vitesse des ventilateurs de la carte mère : silencieux quand le PC se repose, plus fort quand il travaille.
  Modes : Calme (par défaut), Auto, Normal, Fort.
  Garde-fous : réaction immédiate si la température grimpe vite, zone d'alerte, Calme renforcé, urgence à 100 %, capteur perdu, ventilateur bloqué, retour aux réglages du BIOS à la fermeture.
  Processeurs Intel et AMD, cartes graphiques NVIDIA, AMD et Intel. 6 langues. Gratuit, sans pub, open source.
  IMPORTANT : nécessite le pilote gratuit PawnIO (non inclus, installé séparément) et les droits administrateur au lancement.
  Pour PC de bureau ; sur les PC portables, l'appli affiche seulement les températures.
