ReleaseNotes: |-
  Version 1.1.0.
  Rappel : le pilote PawnIO n'est pas inclus. Installe-le une fois depuis https://github.com/namazso/PawnIO.Setup/releases/latest (ou via winget : namazso.PawnIO).
  Chutoki.exe demande les droits administrateur à chaque lancement (nécessaires pour piloter les ventilateurs).
ReleaseNotesUrl: https://github.com/Slimouzz/chutoki/releases/tag/v1.1.0
InstallationNotes: |-
  Chutoki a besoin du pilote PawnIO (https://github.com/namazso/PawnIO.Setup/releases/latest) et demande les droits administrateur au lancement.
  Lance-le avec la commande « chutoki » ou depuis le dossier d'installation de winget. Quand tu le quittes, le BIOS reprend la main sur les ventilateurs.
