ReleaseNotes: |-
  Version 1.1.0.
  Reminder: the PawnIO driver is not included. Install it once from https://github.com/namazso/PawnIO.Setup/releases/latest (or with winget: namazso.PawnIO).
  Chutoki.exe asks for administrator rights at every launch (needed to control the fans).
ReleaseNotesUrl: https://github.com/Slimouzz/chutoki/releases/tag/v1.1.0
InstallationNotes: |-
  Chutoki needs the PawnIO driver (https://github.com/namazso/PawnIO.Setup/releases/latest) and asks for administrator rights when launched.
  Start it with the "chutoki" command or from winget's install folder. When you quit it, the BIOS takes back control of the fans.
