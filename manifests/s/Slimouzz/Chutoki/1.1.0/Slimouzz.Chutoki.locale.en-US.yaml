ShortDescription: The fan that goes shhh. Automatically adjusts your motherboard fans based on temperature.
Description: |-
  Chutoki automatically adjusts your motherboard fan speeds: quiet when your PC rests, stronger when it works.
  Modes: Quiet (default), Auto, Normal, Strong.
  Safeguards: instant reaction to fast temperature rises, alert zone, Quiet boost, 100% emergency mode, lost-sensor and stalled-fan protection, fans handed back to the BIOS on exit.
  Intel and AMD CPUs, NVIDIA, AMD and Intel GPUs. 6 languages. Free, no ads, open source.
  IMPORTANT: requires the free PawnIO driver (not included, installed separately) and administrator rights at launch.
  For desktop PCs; on laptops the app only shows temperatures.
