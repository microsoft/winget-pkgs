ShortDescription: "First, select audio devices that are used in conference software you'd like to record."
Description: |-
  Conference Audio Recorder

  First, select audio devices that are used in conference software you'd like to record.

  Second, perform test recording. If you hear echo on recording, then probably microphone hears your speaker. In this case try to disable recording the speaker or use headphones.

  Third, click start recording at the beginning of a meeting, stop it when meeting ends.

  MP3 file with recordings will be saved in the recordings folder. Click 'See recordings' button to navigate to it.
