Description: |-
  Trình ghi âm hội nghị

  Trước hết, hãy chọn thiết bị âm thanh mà phần mềm họp đang dùng.

  Sau đó hãy ghi thử. Nếu nghe tiếng vọng, micro đang thu loa. Hãy tắt ghi loa hoặc dùng tai nghe.

  Khi cuộc họp bắt đầu thì bắt đầu ghi, và dừng khi cuộc họp kết thúc.

  Tệp MP3 được lưu trong thư mục bản ghi. Nút "Xem bản ghi" sẽ mở thư mục đó.
