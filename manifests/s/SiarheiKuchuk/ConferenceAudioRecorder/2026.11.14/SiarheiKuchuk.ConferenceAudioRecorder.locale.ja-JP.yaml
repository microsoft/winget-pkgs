Description: |-
  会議音声レコーダー

  まず、録音したい会議ソフトウェアで使用されているオーディオデバイスを選択してください。

  次に、テスト録音を実行してください。録音でエコーが聞こえる場合は、マイクがスピーカーの音を拾っている可能性があります。この場合、スピーカーの録音を無効にするか、ヘッドフォンを使用してください。

  会議の開始時に録音開始をクリックし、会議が終了したら停止してください。

  録音されたMP3ファイルは録音フォルダに保存されます。「録音を表示」ボタンをクリックしてフォルダに移動してください。
