Description: |-
  Enregistreur audio de conférence

  D'abord, sélectionnez les périphériques audio utilisés par le logiciel de conférence à enregistrer.

  Ensuite, faites un essai. Si vous entendez un écho, le microphone capte le haut-parleur. Désactivez l'enregistrement du haut-parleur ou utilisez un casque.

  Au début de la réunion, démarrez l'enregistrement, puis arrêtez-le à la fin.

  Le fichier MP3 est enregistré dans le dossier des enregistrements. Cliquez sur « Voir les enregistrements » pour l'ouvrir.
