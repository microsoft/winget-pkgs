Description: |-
  மாநாட்டு ஒலி பதிவி

  முதலில் மாநாட்டு மென்பொருள் பயன்படுத்தும் ஒலி சாதனங்களைத் தேர்ந்தெடுக்கவும்.

  பிறகு ஒரு சோதனைப் பதிவு செய்யவும். எதிரொலி கேட்டால் மைக் ஸ்பீக்கரைக் கேட்கிறது. ஸ்பீக்கர் பதிவை அணைக்கவும் அல்லது ஹெட்ஃபோன் பயன்படுத்தவும்.

  கூட்டம் தொடங்கும்போது பதிவைத் தொடங்கி, முடியும்போது நிறுத்தவும்.

  MP3 கோப்பு பதிவுகள் கோப்புறையில் சேமிக்கப்படும். "பதிவுகளைக் காண்க" அதைத் திறக்கும்.
