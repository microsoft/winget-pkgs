Description: |-
  Grabadora de audio de conferencias

  Primero, seleccione los dispositivos de audio que se utilizan en el software de conferencias que desea grabar.

  Segundo, realice una grabación de prueba. Si escucha eco en la grabación, es probable que el micrófono escuche su altavoz. En este caso, intente deshabilitar la grabación del altavoz o use auriculares.

  Tercero, haga clic en iniciar grabación al comienzo de una reunión y deténgala cuando termine la reunión.

  El archivo MP3 con las grabaciones se guardará en la carpeta de grabaciones. Haga clic en el botón 'Ver grabaciones' para abrirla.
