Description: |-
  Rejestrator audio konferencji

  Najpierw wybierz urządzenia audio używane przez program konferencyjny, który chcesz nagrać.

  Następnie zrób nagranie próbne. Jeśli słychać echo, mikrofon słyszy głośnik. Wyłącz nagrywanie głośnika albo użyj słuchawek.

  Na początku spotkania rozpocznij nagrywanie i zatrzymaj je, gdy spotkanie się skończy.

  Plik MP3 trafia do folderu nagrań. Przycisk „Zobacz nagrania” otwiera ten folder.
