Description: |-
  Εγγραφή ήχου συνδιάσκεψης

  Πρώτα επιλέξτε τις συσκευές ήχου που χρησιμοποιεί το πρόγραμμα συνδιάσκεψης.

  Έπειτα κάντε μια δοκιμαστική εγγραφή. Αν ακούτε ηχώ, το μικρόφωνο ακούει το ηχείο. Απενεργοποιήστε την εγγραφή του ηχείου ή χρησιμοποιήστε ακουστικά.

  Στην αρχή της συνάντησης ξεκινήστε την εγγραφή και σταματήστε την στο τέλος.

  Το αρχείο MP3 αποθηκεύεται στον φάκελο εγγραφών. Το κουμπί «Προβολή εγγραφών» τον ανοίγει.
