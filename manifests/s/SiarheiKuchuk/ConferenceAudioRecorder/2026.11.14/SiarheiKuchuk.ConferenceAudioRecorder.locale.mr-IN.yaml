Description: |-
  परिषद ऑडिओ रेकॉर्डर

  आधी परिषद सॉफ्टवेअर वापरत असलेली ऑडिओ साधने निवडा.

  नंतर चाचणी रेकॉर्डिंग करा. प्रतिध्वनी ऐकू आल्यास मायक स्पीकर ऐकत आहे. स्पीकर रेकॉर्डिंग बंद करा किंवा हेडफोन वापरा.

  बैठक सुरू होताच रेकॉर्डिंग सुरू करा आणि संपल्यावर थांबवा.

  MP3 फाइल रेकॉर्डिंग फोल्डरमध्ये जतन होते. "रेकॉर्डिंग पहा" ते फोल्डर उघडते.
