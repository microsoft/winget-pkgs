Description: |-
  Konferencia-hangrögzítő

  Először válassza ki a konferenciaprogram által használt hangeszközöket.

  Ezután készítsen próbarögzítést. Ha visszhangot hall, a mikrofon a hangszórót veszi. Kapcsolja ki a hangszóró rögzítését, vagy használjon fejhallgatót.

  A találkozó elején indítsa el a rögzítést, és a végén állítsa le.

  Az MP3 a felvételek mappájába kerül. A „Felvételek megtekintése” gomb megnyitja.
