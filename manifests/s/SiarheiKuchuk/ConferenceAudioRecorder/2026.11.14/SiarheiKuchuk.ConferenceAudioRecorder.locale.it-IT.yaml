Description: |-
  Registratore audio per conferenze

  Per prima cosa seleziona i dispositivi audio usati dal programma di conferenza che vuoi registrare.

  Poi fai una registrazione di prova. Se senti l'eco, il microfono sente l'altoparlante. Disattiva la registrazione dell'altoparlante oppure usa le cuffie.

  All'inizio della riunione avvia la registrazione e fermala quando la riunione finisce.

  Il file MP3 viene salvato nella cartella delle registrazioni. Il pulsante «Vedi registrazioni» la apre.
