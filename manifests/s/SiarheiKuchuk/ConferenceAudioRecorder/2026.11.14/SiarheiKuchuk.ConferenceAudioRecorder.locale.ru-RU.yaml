Description: |-
  Запись аудио-конференций

  Сначала выберите аудио-устройства, которые используются в приложениях для конференций.

  Затем сделайте запись тестового звонка. Если на записи будет эхо, значит микрофон слышит динамики. В этом случае отключите запись динамиков или используйте наушники.

  Затем перед началом конференции начните запись, а по окончании конференции остановите запись.

  MP3 файл с записью будет сохранен в каталог с аудио-записями, открыть который можно нажав на кнопку 'Посмотреть записи'.
