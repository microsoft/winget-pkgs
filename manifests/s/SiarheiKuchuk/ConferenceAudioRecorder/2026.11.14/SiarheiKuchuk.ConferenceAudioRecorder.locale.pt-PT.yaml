Description: |-
  Gravador de áudio de conferência

  Primeiro, selecione os dispositivos de áudio usados no programa de conferência que pretende gravar.

  Depois, faça uma gravação de teste. Se ouvir eco, o microfone está a captar a coluna. Desative a gravação da coluna ou use auscultadores.

  No início da reunião, comece a gravar e pare quando a reunião terminar.

  O ficheiro MP3 fica na pasta de gravações. O botão «Ver gravações» abre essa pasta.
