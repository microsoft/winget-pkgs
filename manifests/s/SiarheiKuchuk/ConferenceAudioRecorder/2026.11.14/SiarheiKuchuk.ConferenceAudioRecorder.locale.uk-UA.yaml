Description: |-
  Запис аудіоконференцій

  Спочатку виберіть аудіопристрої, які використовує програма для конференцій.

  Потім зробіть пробний запис. Якщо чути луну, мікрофон чує динамік. Вимкніть запис динаміка або скористайтеся навушниками.

  На початку зустрічі почніть запис, а наприкінці зупиніть його.

  Файл MP3 зберігається в теці записів. Кнопка «Переглянути записи» відкриває її.
