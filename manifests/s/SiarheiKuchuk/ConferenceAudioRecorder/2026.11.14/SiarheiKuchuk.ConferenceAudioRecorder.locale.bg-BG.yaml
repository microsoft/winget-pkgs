Description: |-
  Запис на аудио от конференции

  Първо изберете аудиоустройствата, които използва програмата за конференции.

  После направете пробен запис. Ако чувате ехо, микрофонът чува високоговорителя. Изключете записа на високоговорителя или използвайте слушалки.

  В началото на срещата пуснете записа и го спрете, когато срещата свърши.

  MP3 файлът се записва в папката със записи. Бутонът „Преглед на записите“ я отваря.
