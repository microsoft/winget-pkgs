Description: |-
  Konferenz-Audiorekorder

  Wählen Sie zunächst die Audiogeräte aus, die in der Konferenzsoftware verwendet werden, die Sie aufzeichnen möchten.

  Führen Sie zweitens eine Testaufnahme durch. Wenn Sie ein Echo in der Aufnahme hören, hört das Mikrofon wahrscheinlich Ihren Lautsprecher. Versuchen Sie in diesem Fall, die Aufnahme des Lautsprechers zu deaktivieren oder verwenden Sie Kopfhörer.

  Klicken Sie drittens zu Beginn eines Meetings auf Aufnahme starten und stoppen Sie sie, wenn das Meeting endet.

  Die MP3-Datei mit den Aufnahmen wird im Aufnahmeordner gespeichert. Klicken Sie auf die Schaltfläche „Aufnahmen anzeigen“, um dorthin zu navigieren.
