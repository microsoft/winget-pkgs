Description: |-
  कॉन्फ़्रेंस ऑडियो रिकॉर्डर

  पहले वे ऑडियो उपकरण चुनें जिनका उपयोग कॉन्फ़्रेंस सॉफ़्टवेयर करता है।

  फिर एक परीक्षण रिकॉर्डिंग करें। यदि प्रतिध्वनि सुनाई दे, तो माइक्रोफ़ोन स्पीकर सुन रहा है। स्पीकर रिकॉर्डिंग बंद करें या हेडफ़ोन का उपयोग करें।

  मीटिंग शुरू होते ही रिकॉर्डिंग शुरू करें और समाप्त होने पर रोकें।

  MP3 फ़ाइल रिकॉर्डिंग फ़ोल्डर में सहेजी जाती है। "रिकॉर्डिंग देखें" वह फ़ोल्डर खोलता है।
