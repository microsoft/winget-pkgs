Description: |-
  ضبط‌کننده صدای جلسه

  ابتدا دستگاه‌های صوتی را که نرم‌افزار جلسه استفاده می‌کند انتخاب کنید.

  سپس یک ضبط آزمایشی بگیرید. اگر پژواک شنیدید، میکروفون صدای بلندگو را می‌گیرد. ضبط بلندگو را خاموش کنید یا از هدفون استفاده کنید.

  در آغاز جلسه ضبط را شروع کنید و در پایان آن را متوقف کنید.

  فایل MP3 در پوشه ضبط‌ها ذخیره می‌شود. دکمه «دیدن ضبط‌ها» آن پوشه را باز می‌کند.
