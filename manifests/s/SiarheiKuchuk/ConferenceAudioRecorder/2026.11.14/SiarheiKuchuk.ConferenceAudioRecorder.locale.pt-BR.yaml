Description: |-
  Gravador de áudio de conferência

  Primeiro, selecione os dispositivos de áudio usados no software de conferência que você deseja gravar.

  Segundo, faça uma gravação de teste. Se você ouvir eco na gravação, provavelmente o microfone está captando o áudio do alto-falante. Nesse caso, tente desabilitar a gravação do alto-falante ou use fones de ouvido.

  Terceiro, clique em iniciar gravação no início de uma reunião e pare quando a reunião terminar.

  O arquivo MP3 com as gravações será salvo na pasta de gravações. Clique no botão 'Ver gravações' para abri-la.
