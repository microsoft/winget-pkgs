Description: |-
  సమావేశ ఆడియో రికార్డర్

  ముందు సమావేశ సాఫ్ట్‌వేర్ ఉపయోగించే ఆడియో పరికరాలను ఎంచుకోండి.

  తర్వాత పరీక్ష రికార్డింగ్ చేయండి. ప్రతిధ్వని వినిపిస్తే మైక్రోఫోన్ స్పీకర్‌ను వింటోంది. స్పీకర్ రికార్డింగ్ ఆఫ్ చేయండి లేదా హెడ్‌ఫోన్ వాడండి.

  సమావేశం మొదలైనప్పుడు రికార్డింగ్ ప్రారంభించి, అయిపోయాక ఆపండి.

  MP3 ఫైలు రికార్డింగ్‌ల ఫోల్డర్‌లో సేవ్ అవుతుంది. "రికార్డింగ్‌లు చూడండి" ఆ ఫోల్డర్‌ను తెరుస్తుంది.
