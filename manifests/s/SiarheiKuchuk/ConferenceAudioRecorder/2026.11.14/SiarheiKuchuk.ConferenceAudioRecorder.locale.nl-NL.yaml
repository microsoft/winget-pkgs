Description: |-
  Conferentie-audiorecorder

  Kies eerst de audioapparaten die het conferentieprogramma gebruikt dat u wilt opnemen.

  Maak daarna een testopname. Als u echo hoort, vangt de microfoon de luidspreker op. Schakel de luidsprekeropname uit of gebruik een hoofdtelefoon.

  Start de opname aan het begin van de vergadering en stop wanneer de vergadering eindigt.

  Het MP3-bestand komt in de map met opnamen. De knop 'Opnamen bekijken' opent die map.
