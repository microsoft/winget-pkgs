Description: |-
  会议录音器

  首先，选择您想要录音的会议软件所使用的音频设备。

  其次，进行测试录音。如果您在录音中听到回声，那么可能是麦克风听到了您的扬声器。在这种情况下，请尝试禁用扬声器录音或使用耳机。

  第三，在会议开始时点击开始录音，会议结束时停止录音。

  录音的 MP3 文件将保存在录音文件夹中。点击“查看录音”按钮即可打开该文件夹。
