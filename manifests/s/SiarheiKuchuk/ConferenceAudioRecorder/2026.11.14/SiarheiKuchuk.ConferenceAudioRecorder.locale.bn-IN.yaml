Description: |-
  কনফারেন্স অডিও রেকর্ডার

  প্রথমে কনফারেন্স সফটওয়্যার যে অডিও ডিভাইস ব্যবহার করে সেগুলো বেছে নিন।

  তারপর একটি পরীক্ষামূলক রেকর্ডিং করুন। প্রতিধ্বনি শুনলে মাইক্রোফোন স্পিকার শুনছে। স্পিকার রেকর্ডিং বন্ধ করুন বা হেডফোন ব্যবহার করুন।

  মিটিং শুরু হলে রেকর্ডিং শুরু করুন এবং শেষ হলে থামান।

  MP3 ফাইল রেকর্ডিং ফোল্ডারে সেভ হয়। "রেকর্ডিং দেখুন" সেই ফোল্ডার খোলে।
