Description: |-
  Záznam zvuku konferencí

  Nejprve vyberte zvuková zařízení, která používá konferenční program, který chcete nahrávat.

  Potom udělejte zkušební záznam. Pokud slyšíte ozvěnu, mikrofon slyší reproduktor. Vypněte záznam reproduktoru nebo použijte sluchátka.

  Na začátku schůzky spusťte záznam a na konci jej zastavte.

  Soubor MP3 se uloží do složky záznamů. Tlačítko „Zobrazit záznamy“ ji otevře.
