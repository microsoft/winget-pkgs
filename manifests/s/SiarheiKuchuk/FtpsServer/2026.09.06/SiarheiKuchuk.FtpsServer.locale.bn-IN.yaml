ShortDescription: "নেটওয়ার্কে নিরাপদ ফাইল শেয়ারিংয়ের জন্য FTPS সার্ভার।"
Description: |
  নেটওয়ার্কে ডিভাইসগুলোর মধ্যে নিরাপদ ফাইল শেয়ারিংয়ের জন্য FTPS (TLS-এর উপর FTP) সার্ভার।
  
  বৈশিষ্ট্য:
  - **ব্যবহারকারীর অনুমতি** - পড়া/লেখার কার্যক্রমের সূক্ষ্ম নিয়ন্ত্রণ
  - **প্রতি-ব্যবহারকারী রুট ফোল্ডার** - প্রতিটি ব্যবহারকারীর জন্য আলাদা ডিরেক্টরি
  - **পথের নিরাপত্তা** - ডিরেক্টরি ট্রাভার্সাল আক্রমণ থেকে সুরক্ষা
  - **UTF-8** - স্থানীয়কৃত অক্ষর সমর্থন করে
  - **Windows UI** - WPF দিয়ে তৈরি গ্রাফিকাল ইন্টারফেস
  - **স্ব-স্বাক্ষরিত সার্টিফিকেট** - TLS সার্টিফিকেট স্বয়ংক্রিয়ভাবে তৈরি করুন বা নিজেরটি ব্যবহার করুন
  - **একাধিক আর্কিটেকচার** - x64 এবং ARM64 সমর্থন করে
