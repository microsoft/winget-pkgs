ShortDescription: "用于在网络上安全共享文件的 FTPS 服务器。"
Description: |
  FTPS（基于 TLS 的 FTP）服务器，用于在网络设备之间安全共享文件。
  
  功能：
  - **用户权限** - 对读/写操作的精细控制
  - **每用户根目录** - 为每个用户隔离的目录
  - **路径安全** - 防止目录遍历攻击
  - **UTF-8** - 支持本地化字符
  - **Windows 界面** - 使用 WPF 构建的图形界面
  - **自签名证书** - 自动生成 TLS 证书或使用您自己的证书
  - **多种架构** - 支持 x64 和 ARM64
