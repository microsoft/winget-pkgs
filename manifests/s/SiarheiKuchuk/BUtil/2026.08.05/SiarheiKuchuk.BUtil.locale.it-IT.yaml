ShortDescription: "BUtil crea backup incrementali, sincronizzazione incrementale e importa contenuti multimediali nel PC con de-duplicazione e supporto trasporti WebDAV, S3-compatible, NFS, Azure Blob, SFTP, FTPS, SMB/CIFS per Windows e Linux."
Description: |
  Backup/sincronizza i dati in Windows, Linux.
  Importa foto dal telefono tramite Wi-Fi e altro ancora.
  
  Funzionalità:
  - Backup incrementale con de-duplicazione dei file e supporto trasporti WebDAV, S3-compatible, NFS, Azure Blob, SFTP, FTPS, SMB/CIFS;
  - Sincronizzazione dei file tra dispositivi usando archiviazione centralizzata e supporto versioning;
  - Importazione media - Importa audio, foto, video dalla scheda SD di fotocamera, registratore; foto e video dal telefono tramite Wi-Fi attraverso l'applicazione Server FTPS usando nomi file modello o tramite;
  - Console per la pianificazione dell'automazione;
  - Crittografia AES-256.
  
  Piattaforme: Windows 11 x64, ARM64 o Ubuntu 24+.
