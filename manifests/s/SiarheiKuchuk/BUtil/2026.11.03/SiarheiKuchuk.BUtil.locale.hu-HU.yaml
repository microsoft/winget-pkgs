ShortDescription: "Növekményes fájlmentés, mappaszinkronizálás és visszaállítás. Deduplikáció, ütemezés és fotóimport. Helyi mappa, NAS, S3, SFTP vagy WebDAV. Nincs fiók és nincs hirdetés."
Description: |-
  A BUtil biztonsági mentést készít, szinkronizál és visszaállít fájlokat ezen a PC-n. A növekményes mentés csak a változást tárolja. A deduplikáció egy példányt tart meg, ha ugyanaz a fájl többször szerepel.
  
  A mentés mehet egy mappába ezen a PC-n, NAS-ra (SMB/CIFS), vagy WebDAV-ra, S3-kompatibilis tárhelyre, NFS-re, Azure Blobra, SFTP-re vagy FTPS-re.
  
  Szinkronizáljon egy mappát az Ön által kezelt tárhelyen keresztül, és tartsa meg a régebbi verziókat, ha a fájlok változnak. Importáljon képeket, videót és hangot SD-kártyáról, fényképezőgépről vagy telefonról ugyanazon a Wi-Fi-n.
  
  Ugyanezek a feladatok a konzolból is futnak, ütemezéssel együtt. A mentett jelszavak ezen a számítógépen titkosítva vannak. Nincs fiók, hirdetés és telemetria.
  
  A BUtil nyílt forráskódú. Saját kódja közkincs. A harmadik féltől származó összetevők megtartják a saját licencüket.
  
  - A növekményes mentés csak azt tárolja, ami a legutóbbi futás óta változott.
  - A deduplikáció egy példányt tart meg, ha ugyanaz a fájl többször szerepel.
  - Állítson vissza fájlokat egy már elkészített mentésből.
  - Mentés helyi mappába, WebDAV-ra, S3-kompatibilis tárhelyre vagy NFS-re.
  - Mentés NAS-ra (SMB/CIFS), Azure Blobra, SFTP-re vagy FTPS-re.
  - Mappa szinkronizálása számítógépek között az Ön által kezelt tárhelyen.
  - Régebbi verziók megőrzése, ha egy szinkronizált fájl megváltozik.
  - Fotók, videó és hang importálása SD-kártyáról vagy fényképezőgépről.
  - Fotók és videók importálása telefonról ugyanazon a Wi-Fi-n.
  - Az importált fájlok elnevezése egy Ön által választott sablonnal.
  - Mentés ütemezése bejelentkezéskor vagy heti terv szerint.
  - Ugyanezek a feladatok a konzolból, ütemezéssel együtt.
  - Konzolparancs másolása bármely feladathoz, hogy automatizálhassa.
  - Látható, mely feladatok ütemezettek, és hogyan végződött az utolsó futás.
  - A mentett jelszavak ezen a számítógépen titkosítva vannak.
  - Feladat után a PC bekapcsolva maradhat, kijelentkezhet, újraindulhat vagy leállhat.
  - Nyílt forráskód, fiók, hirdetés és telemetria nélkül.
  - Mappa feltöltése, a már tárolt fájlok kihagyásával.
