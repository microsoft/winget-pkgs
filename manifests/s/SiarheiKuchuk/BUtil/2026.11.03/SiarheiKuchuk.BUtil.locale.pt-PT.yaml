ShortDescription: "Cópia de segurança incremental, sincronização de pastas e restauro. Deduplicação, agendamentos e importação de fotos. Pasta local, NAS, S3, SFTP ou WebDAV. Sem conta e sem anúncios."
Description: |-
  O BUtil faz cópias de segurança, sincroniza e restaura ficheiros neste PC. As cópias incrementais guardam apenas o que mudou. A deduplicação mantém uma única cópia quando o mesmo ficheiro aparece mais do que uma vez.
  
  Envie as cópias para uma pasta neste PC, para um NAS (SMB/CIFS), ou para WebDAV, armazenamento compatível com S3, NFS, Azure Blob, SFTP ou FTPS.
  
  Sincronize uma pasta através de armazenamento que controla e mantenha versões anteriores quando os ficheiros mudam. Importe imagens, vídeo e áudio de um cartão SD, de uma câmara ou de um telemóvel na mesma Wi-Fi.
  
  As mesmas tarefas executam-se na consola, incluindo com um agendamento. As palavras-passe que guarda são encriptadas neste computador. Não há conta, publicidade nem telemetria.
  
  O BUtil é de código aberto. O código próprio é dedicado ao domínio público. Os componentes de terceiros mantêm as próprias licenças.
  
  - A cópia incremental guarda apenas o que mudou desde a última execução.
  - A deduplicação mantém uma cópia quando o mesmo ficheiro aparece mais do que uma vez.
  - Restaure ficheiros de uma cópia de segurança que já fez.
  - Faça cópias para uma pasta local, WebDAV, armazenamento compatível com S3 ou NFS.
  - Faça cópias para um NAS (SMB/CIFS), Azure Blob, SFTP ou FTPS.
  - Sincronize uma pasta entre computadores através de armazenamento que controla.
  - Mantenha versões anteriores quando um ficheiro sincronizado muda.
  - Importe fotos, vídeo e áudio de um cartão SD ou de uma câmara.
  - Importe fotos e vídeos de um telemóvel na mesma Wi-Fi.
  - Dê nome aos ficheiros importados com um modelo à sua escolha.
  - Agende uma cópia no início de sessão ou num plano semanal.
  - Execute as mesmas tarefas na consola, incluindo com um agendamento.
  - Copie um comando de consola de qualquer tarefa para a automatizar.
  - Veja que tarefas estão agendadas e como terminou a última execução.
  - As palavras-passe guardadas são encriptadas neste computador.
  - Após uma tarefa, deixe o PC ligado, termine a sessão, reinicie ou encerre.
  - Código aberto, sem conta, sem anúncios e sem telemetria.
  - Envie uma pasta e ignore os ficheiros que já estão armazenados.
