ShortDescription: "Inkrementalna rezervna kopija, sinhronizacija fascikli i vraćanje. Deduplikacija, rasporedi i uvoz fotografija. Lokalna fascikla, NAS, S3, SFTP ili WebDAV. Bez naloga i bez reklama."
Description: |-
  BUtil pravi rezervne kopije, sinhronizuje i vraća datoteke na ovom računaru. Inkrementalne kopije čuvaju samo ono što se promenilo. Deduplikacija zadržava jednu kopiju kada se ista datoteka pojavi više puta.
  
  Šaljite kopije u fasciklu na ovom računaru, na NAS (SMB/CIFS) ili na WebDAV, skladište usklađeno sa S3, NFS, Azure Blob, SFTP ili FTPS.
  
  Sinhronizujte fasciklu preko skladišta kojim upravljate i zadržite starije verzije kada se datoteke promene. Uvezite slike, video i zvuk sa SD kartice, fotoaparata ili telefona na istoj Wi-Fi mreži.
  
  Isti zadaci rade iz konzole, uključujući raspored. Lozinke koje sačuvate šifruju se na ovom računaru. Nema naloga, reklama ni telemetrije.
  
  BUtil je otvorenog koda. Sopstveni kod je predat u javno vlasništvo. Komponente trećih strana zadržavaju sopstvene licence.
  
  - Inkrementalna kopija čuva samo ono što se promenilo od poslednjeg pokretanja.
  - Deduplikacija zadržava jednu kopiju kada se ista datoteka pojavi više puta.
  - Vratite datoteke iz rezervne kopije koju ste već napravili.
  - Sačuvajte kopiju u lokalnu fasciklu, na WebDAV, na skladište usklađeno sa S3 ili na NFS.
  - Sačuvajte kopiju na NAS (SMB/CIFS), Azure Blob, SFTP ili FTPS.
  - Sinhronizujte fasciklu između računara preko skladišta kojim upravljate.
  - Zadržite starije verzije kada se sinhronizovana datoteka promeni.
  - Uvezite fotografije, video i zvuk sa SD kartice ili fotoaparata.
  - Uvezite fotografije i video snimke sa telefona na istoj Wi-Fi mreži.
  - Imenujte uvezene datoteke prema šablonu koji izaberete.
  - Zakažite kopiju pri prijavi ili prema nedeljnom planu.
  - Pokrenite iste zadatke iz konzole, uključujući raspored.
  - Kopirajte konzolnu naredbu bilo kog zadatka da biste ga automatizovali.
  - Pogledajte koji zadaci su zakazani i kako je završilo poslednje pokretanje.
  - Sačuvane lozinke šifruju se na ovom računaru.
  - Nakon zadatka ostavite računar uključen, odjavite se, ponovo pokrenite ili ga ugasite.
  - Otvoreni kod, bez naloga, bez reklama i bez telemetrije.
  - Pošaljite fasciklu i preskočite datoteke koje su već sačuvane.
