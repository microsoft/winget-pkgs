ShortDescription: "Trinvis filsikkerhedskopi, mappesynkronisering og gendannelse. Deduplikering, tidsplaner og fotoimport. Lokal mappe, NAS, S3, SFTP eller WebDAV. Ingen konto og ingen reklamer."
Description: |-
  BUtil sikkerhedskopierer, synkroniserer og gendanner filer på denne pc. Trinvise sikkerhedskopier gemmer kun det, der er ændret. Deduplikering beholder én kopi, når den samme fil optræder mere end én gang.
  
  Send sikkerhedskopier til en mappe på denne pc, til en NAS (SMB/CIFS) eller til WebDAV, S3-kompatibel lagerplads, NFS, Azure Blob, SFTP eller FTPS.
  
  Synkroniser en mappe via lagerplads, du styrer, og behold ældre versioner, når filer ændres. Importér billeder, video og lyd fra et SD-kort, et kamera eller en telefon på det samme wi-fi.
  
  De samme opgaver kører fra konsollen, også efter en tidsplan. Adgangskoder, du gemmer, krypteres på denne computer. Der er ingen konto, ingen reklamer og ingen telemetri.
  
  BUtil er open source. Dens egen kode er givet til offentligt domæne. Tredjepartskomponenter beholder deres egne licenser.
  
  - En trinvis sikkerhedskopi gemmer kun det, der er ændret siden sidste kørsel.
  - Deduplikering beholder én kopi, når den samme fil optræder mere end én gang.
  - Gendan filer fra en sikkerhedskopi, du allerede har lavet.
  - Sikkerhedskopiér til en lokal mappe, WebDAV, S3-kompatibel lagerplads eller NFS.
  - Sikkerhedskopiér til en NAS (SMB/CIFS), Azure Blob, SFTP eller FTPS.
  - Synkroniser en mappe mellem computere via lagerplads, du styrer.
  - Behold ældre versioner, når en synkroniseret fil ændres.
  - Importér fotos, video og lyd fra et SD-kort eller et kamera.
  - Importér fotos og videoer fra en telefon på det samme wi-fi.
  - Navngiv importerede filer ud fra en skabelon, du vælger.
  - Planlæg en sikkerhedskopi ved logon eller efter en ugentlig plan.
  - Kør de samme opgaver fra konsollen, også efter en tidsplan.
  - Kopiér en konsolkommando for en opgave, så du kan automatisere den.
  - Se hvilke opgaver der er planlagt, og hvordan det sidste kørsel endte.
  - Gemte adgangskoder krypteres på denne computer.
  - Efter en opgave kan pc'en blive tændt, logge af, genstarte eller lukke ned.
  - Open source, uden konto, uden reklamer og uden telemetri.
  - Upload en mappe, og spring filer over, der allerede er gemt.
