ShortDescription: "Lisäävä tiedostovarmuuskopio, kansiosynkronointi ja palautus. Kaksoiskappaleiden poisto, aikataulut ja kuvien tuonti. Paikallinen kansio, NAS, S3, SFTP tai WebDAV. Ei tiliä eikä mainoksia."
Description: |-
  BUtil varmuuskopioi, synkronoi ja palauttaa tiedostoja tällä tietokoneella. Lisäävät varmuuskopiot tallentavat vain muuttuneen. Kaksoiskappaleiden poisto säilyttää yhden kopion, kun sama tiedosto esiintyy useammin kuin kerran.
  
  Lähetä varmuuskopiot kansioon tällä tietokoneella, NAS-laitteeseen (SMB/CIFS) tai WebDAViin, S3-yhteensopivaan tallennustilaan, NFS:ään, Azure Blobille, SFTP:hen tai FTPS:ään.
  
  Synkronoi kansio hallitsemasi tallennustilan kautta ja säilytä vanhemmat versiot, kun tiedostot muuttuvat. Tuo kuvia, videota ja ääntä SD-kortilta, kamerasta tai puhelimesta samassa Wi-Fi-verkossa.
  
  Samat tehtävät voi ajaa konsolista, myös aikataulun mukaan. Tallentamasi salasanat salataan tällä tietokoneella. Tiliä, mainoksia eikä telemetriaa ole.
  
  BUtil on avointa lähdekoodia. Sen oma koodi on luovutettu vapaaseen käyttöön. Kolmannen osapuolen osat säilyttävät omat lisenssinsä.
  
  - Lisäävä varmuuskopio tallentaa vain sen, mikä on muuttunut edellisen ajon jälkeen.
  - Kaksoiskappaleiden poisto säilyttää yhden kopion, kun sama tiedosto esiintyy useammin.
  - Palauta tiedostoja varmuuskopiosta, jonka olet jo tehnyt.
  - Varmuuskopioi paikalliseen kansioon, WebDAViin, S3-yhteensopivaan tilaan tai NFS:ään.
  - Varmuuskopioi NAS-laitteeseen (SMB/CIFS), Azure Blobille, SFTP:hen tai FTPS:ään.
  - Synkronoi kansio tietokoneiden välillä hallitsemasi tallennustilan kautta.
  - Säilytä vanhemmat versiot, kun synkronoitu tiedosto muuttuu.
  - Tuo kuvia, videota ja ääntä SD-kortilta tai kamerasta.
  - Tuo kuvia ja videoita puhelimesta samassa Wi-Fi-verkossa.
  - Nimeä tuodut tiedostot valitsemallasi mallilla.
  - Ajoita varmuuskopio kirjautumiseen tai viikoittaiseen suunnitelmaan.
  - Aja samat tehtävät konsolista, myös aikataulun mukaan.
  - Kopioi konsolikomento mistä tahansa tehtävästä, jotta voit automatisoida sen.
  - Näe, mitkä tehtävät on ajoitettu ja miten viimeisin ajo päättyi.
  - Tallennetut salasanat salataan tällä tietokoneella.
  - Tehtävän jälkeen jätä tietokone päälle, kirjaudu ulos, käynnistä uudelleen tai sammuta.
  - Avoin lähdekoodi, ei tiliä, ei mainoksia eikä telemetriaa.
  - Lähetä kansio ja ohita tiedostot, jotka on jo tallennettu.
