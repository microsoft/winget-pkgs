ShortDescription: "Sao lưu tệp tăng dần, đồng bộ thư mục và khôi phục. Loại bản trùng, lịch và nhập ảnh. Thư mục cục bộ, NAS, S3, SFTP hoặc WebDAV. Không tài khoản và không quảng cáo."
Description: |-
  BUtil sao lưu, đồng bộ và khôi phục tệp trên máy tính này. Bản sao lưu tăng dần chỉ giữ phần đã thay đổi. Loại bản trùng giữ một bản khi cùng một tệp xuất hiện nhiều lần.
  
  Gửi bản sao lưu vào thư mục trên máy tính này, tới NAS (SMB/CIFS), hoặc tới WebDAV, kho tương thích S3, NFS, Azure Blob, SFTP hoặc FTPS.
  
  Đồng bộ một thư mục qua kho do bạn kiểm soát, và giữ phiên bản cũ hơn khi tệp thay đổi. Nhập ảnh, video và âm thanh từ thẻ SD, máy ảnh hoặc điện thoại trên cùng Wi-Fi.
  
  Các tác vụ đó chạy từ bảng điều khiển, kể cả theo lịch. Mật khẩu bạn lưu được mã hóa trên máy tính này. Không có tài khoản, quảng cáo hay đo từ xa.
  
  BUtil là mã nguồn mở. Mã của chính nó được hiến vào phạm vi công cộng. Thành phần của bên thứ ba giữ giấy phép riêng.
  
  - Sao lưu tăng dần chỉ giữ phần đã thay đổi kể từ lần chạy trước.
  - Loại bản trùng giữ một bản khi cùng một tệp xuất hiện nhiều lần.
  - Khôi phục tệp từ bản sao lưu bạn đã tạo.
  - Sao lưu vào thư mục cục bộ, WebDAV, kho tương thích S3 hoặc NFS.
  - Sao lưu tới NAS (SMB/CIFS), Azure Blob, SFTP hoặc FTPS.
  - Đồng bộ thư mục giữa các máy tính qua kho do bạn kiểm soát.
  - Giữ phiên bản cũ hơn khi một tệp đã đồng bộ thay đổi.
  - Nhập ảnh, video và âm thanh từ thẻ SD hoặc máy ảnh.
  - Nhập ảnh và video từ điện thoại trên cùng Wi-Fi.
  - Đặt tên tệp đã nhập theo mẫu bạn chọn.
  - Lên lịch sao lưu khi đăng nhập hoặc theo kế hoạch hằng tuần.
  - Chạy các tác vụ đó từ bảng điều khiển, kể cả theo lịch.
  - Sao chép lệnh bảng điều khiển của bất kỳ tác vụ nào để tự động hóa.
  - Xem tác vụ nào được lên lịch và lần chạy gần nhất kết thúc thế nào.
  - Mật khẩu đã lưu được mã hóa trên máy tính này.
  - Sau tác vụ, để máy bật, đăng xuất, khởi động lại hoặc tắt máy.
  - Mã nguồn mở, không tài khoản, không quảng cáo và không đo từ xa.
  - Tải một thư mục lên và bỏ qua tệp đã được lưu.
