ShortDescription: "Incremental file backup, folder sync, and restore. Deduplication, schedules, and photo import. Local folder, NAS, S3, SFTP, or WebDAV. No account and no ads."
Description: |-
  BUtil backs up, syncs, and restores files on this PC. Incremental backups store only what changed. Deduplication keeps a single copy when the same file appears more than once.
  
  Send backups to a folder on this PC, a NAS (SMB/CIFS), or to WebDAV, S3-compatible storage, NFS, Azure Blob, SFTP, or FTPS.
  
  Sync a folder through storage you control, and keep older versions when files change. Import pictures, video, and audio from an SD card, a camera, or a phone on the same Wi-Fi.
  
  Run the same tasks from the console, including on a schedule. Passwords you save are encrypted on this computer. There is no account, no advertising, and no telemetry.
  
  BUtil is open source. Its own code is dedicated to the public domain. Third-party components keep their own licenses.
  
  - Incremental backup stores only what changed since the last run.
  - Deduplication keeps one copy when the same file appears more than once.
  - Restore files from a backup you already made.
  - Back up to a local folder, WebDAV, S3-compatible storage, or NFS.
  - Back up to a NAS (SMB/CIFS), Azure Blob, SFTP, or FTPS.
  - Sync a folder between computers through storage you control.
  - Keep older versions when a synchronized file changes.
  - Import photos, video, and audio from an SD card or camera.
  - Import photos and videos from a phone on the same Wi-Fi.
  - Name imported files from a template you choose.
  - Schedule a backup at sign-in or on a weekly plan.
  - Run the same tasks from the console, including on a schedule.
  - Copy a console command for any task so you can automate it.
  - See which tasks are scheduled and how the last run finished.
  - Encrypt saved passwords on this computer.
  - After a task, leave the PC on, sign out, restart, or shut down.
  - Open source, with no account, no ads, and no telemetry.
  - Upload a folder and skip files that are already stored.
