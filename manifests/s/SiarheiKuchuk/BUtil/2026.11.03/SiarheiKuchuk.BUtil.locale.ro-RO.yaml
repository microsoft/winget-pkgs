ShortDescription: "Copiere de rezervă incrementală, sincronizare de foldere și restaurare. Deduplicare, programări și import de fotografii. Folder local, NAS, S3, SFTP sau WebDAV. Fără cont și fără reclame."
Description: |-
  BUtil face copii de rezervă, sincronizează și restaurează fișiere pe acest PC. Copiile incrementale păstrează doar ce s-a schimbat. Deduplicarea păstrează o singură copie când același fișier apare de mai multe ori.
  
  Trimiteți copiile într-un folder de pe acest PC, pe un NAS (SMB/CIFS) sau către WebDAV, stocare compatibilă S3, NFS, Azure Blob, SFTP ori FTPS.
  
  Sincronizați un folder prin stocarea pe care o controlați și păstrați versiunile mai vechi când fișierele se schimbă. Importați imagini, video și audio de pe un card SD, un aparat foto sau un telefon din aceeași rețea Wi-Fi.
  
  Aceleași activități rulează din consolă, inclusiv după un program. Parolele pe care le salvați sunt criptate pe acest calculator. Nu există cont, publicitate sau telemetrie.
  
  BUtil este open source. Codul propriu este dedicat domeniului public. Componentele terțe își păstrează licențele.
  
  - Copia incrementală păstrează doar ce s-a schimbat de la ultima rulare.
  - Deduplicarea păstrează o copie când același fișier apare de mai multe ori.
  - Restaurați fișiere dintr-o copie de rezervă pe care ați făcut-o deja.
  - Faceți copii într-un folder local, pe WebDAV, pe stocare compatibilă S3 sau pe NFS.
  - Faceți copii pe un NAS (SMB/CIFS), Azure Blob, SFTP sau FTPS.
  - Sincronizați un folder între calculatoare prin stocarea pe care o controlați.
  - Păstrați versiuni mai vechi când un fișier sincronizat se schimbă.
  - Importați fotografii, video și audio de pe un card SD sau un aparat foto.
  - Importați fotografii și videoclipuri de pe un telefon din aceeași rețea Wi-Fi.
  - Denumiți fișierele importate după un șablon pe care îl alegeți.
  - Programați o copie la conectare sau după un plan săptămânal.
  - Rulați aceleași activități din consolă, inclusiv după un program.
  - Copiați o comandă de consolă pentru orice activitate, ca să o automatizați.
  - Vedeți ce activități sunt programate și cum s-a terminat ultima rulare.
  - Parolele salvate sunt criptate pe acest calculator.
  - După o activitate, lăsați PC-ul pornit, deconectați-vă, reporniți sau opriți-l.
  - Open source, fără cont, fără reclame și fără telemetrie.
  - Încărcați un folder și săriți peste fișierele deja stocate.
