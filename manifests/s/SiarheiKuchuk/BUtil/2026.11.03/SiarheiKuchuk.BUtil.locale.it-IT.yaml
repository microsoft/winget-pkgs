ShortDescription: "Backup incrementale dei file, sincronizzazione delle cartelle e ripristino. Deduplicazione, pianificazioni e importazione foto. Cartella locale, NAS, S3, SFTP o WebDAV. Senza account e senza pubblicità."
Description: |-
  BUtil esegue il backup, sincronizza e ripristina i file su questo PC. I backup incrementali salvano solo ciò che è cambiato. La deduplicazione tiene una sola copia quando lo stesso file compare più di una volta.
  
  Invia i backup a una cartella di questo PC, a un NAS (SMB/CIFS), oppure a WebDAV, archiviazione compatibile con S3, NFS, Azure Blob, SFTP o FTPS.
  
  Sincronizza una cartella tramite uno spazio di archiviazione che controlli e conserva le versioni precedenti quando i file cambiano. Importa immagini, video e audio da una scheda SD, da una fotocamera o da un telefono sulla stessa Wi-Fi.
  
  Le stesse attività si eseguono dalla console, anche in base a una pianificazione. Le password che salvi sono cifrate su questo computer. Non c’è un account, né pubblicità, né telemetria.
  
  BUtil è open source. Il suo codice è dedicato al pubblico dominio. I componenti di terze parti mantengono le proprie licenze.
  
  - Il backup incrementale salva solo ciò che è cambiato dall’ultima esecuzione.
  - La deduplicazione tiene una copia quando lo stesso file compare più di una volta.
  - Ripristina i file da un backup che hai già creato.
  - Esegui il backup in una cartella locale, su WebDAV, su archiviazione compatibile con S3 o su NFS.
  - Esegui il backup su un NAS (SMB/CIFS), Azure Blob, SFTP o FTPS.
  - Sincronizza una cartella tra computer tramite uno spazio di archiviazione che controlli.
  - Conserva le versioni precedenti quando un file sincronizzato cambia.
  - Importa foto, video e audio da una scheda SD o da una fotocamera.
  - Importa foto e video da un telefono sulla stessa Wi-Fi.
  - Assegna un nome ai file importati con un modello che scegli tu.
  - Pianifica un backup all’accesso o con un piano settimanale.
  - Esegui le stesse attività dalla console, anche in base a una pianificazione.
  - Copia un comando della console per qualsiasi attività, così puoi automatizzarla.
  - Vedi quali attività sono pianificate e come è terminata l’ultima esecuzione.
  - Le password salvate sono cifrate su questo computer.
  - Dopo un’attività, lascia il PC acceso, disconnetti, riavvia o spegni.
  - Open source, senza account, senza pubblicità e senza telemetria.
  - Carica una cartella e salta i file già archiviati.
