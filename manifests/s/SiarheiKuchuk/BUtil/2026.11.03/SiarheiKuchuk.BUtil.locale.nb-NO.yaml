ShortDescription: "Trinnvis filsikkerhetskopi, mappesynkronisering og gjenoppretting. Deduplisering, tidsplaner og fotoimport. Lokal mappe, NAS, S3, SFTP eller WebDAV. Ingen konto og ingen reklame."
Description: |-
  BUtil sikkerhetskopierer, synkroniserer og gjenoppretter filer på denne PC-en. Trinnvise sikkerhetskopier lagrer bare det som er endret. Deduplisering beholder én kopi når samme fil finnes mer enn én gang.
  
  Send sikkerhetskopier til en mappe på denne PC-en, til en NAS (SMB/CIFS), eller til WebDAV, S3-kompatibel lagring, NFS, Azure Blob, SFTP eller FTPS.
  
  Synkroniser en mappe via lagring du styrer, og behold eldre versjoner når filer endres. Importer bilder, video og lyd fra et SD-kort, et kamera eller en telefon på samme wifi.
  
  De samme oppgavene kjører fra konsollen, også etter en tidsplan. Passord du lagrer, krypteres på denne datamaskinen. Det er ingen konto, ingen reklame og ingen telemetri.
  
  BUtil er åpen kildekode. Egen kode er viet til offentlig eiendom. Tredjepartskomponenter beholder sine egne lisenser.
  
  - En trinnvis sikkerhetskopi lagrer bare det som er endret siden forrige kjøring.
  - Deduplisering beholder én kopi når samme fil finnes mer enn én gang.
  - Gjenopprett filer fra en sikkerhetskopi du allerede har laget.
  - Sikkerhetskopier til en lokal mappe, WebDAV, S3-kompatibel lagring eller NFS.
  - Sikkerhetskopier til en NAS (SMB/CIFS), Azure Blob, SFTP eller FTPS.
  - Synkroniser en mappe mellom datamaskiner via lagring du styrer.
  - Behold eldre versjoner når en synkronisert fil endres.
  - Importer bilder, video og lyd fra et SD-kort eller et kamera.
  - Importer bilder og videoer fra en telefon på samme wifi.
  - Gi importerte filer navn etter en mal du velger.
  - Planlegg en sikkerhetskopi ved pålogging eller etter en ukentlig plan.
  - Kjør de samme oppgavene fra konsollen, også etter en tidsplan.
  - Kopier en konsollkommando for en oppgave, så du kan automatisere den.
  - Se hvilke oppgaver som er planlagt, og hvordan siste kjøring ble avsluttet.
  - Lagrede passord krypteres på denne datamaskinen.
  - Etter en oppgave kan PC-en være på, logge av, starte på nytt eller slå seg av.
  - Åpen kildekode, uten konto, uten reklame og uten telemetri.
  - Last opp en mappe og hopp over filer som allerede er lagret.
