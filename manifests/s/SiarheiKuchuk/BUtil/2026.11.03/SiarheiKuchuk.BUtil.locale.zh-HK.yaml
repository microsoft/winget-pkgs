ShortDescription: "增量檔案備份、資料夾同步同還原。去重、排程同相片匯入。本機資料夾、NAS、S3、SFTP 或者 WebDAV。冇帳戶、冇廣告。"
Description: |-
  BUtil 喺呢部電腦備份、同步同還原檔案。增量備份只儲存有改動嘅部分。去重喺同一個檔案出現多過一次時，只保留一份。
  
  備份可以放到呢部電腦嘅資料夾、NAS（SMB/CIFS），或者 WebDAV、相容 S3 嘅儲存、NFS、Azure Blob、SFTP 或 FTPS。
  
  透過你控制嘅儲存同步資料夾，檔案改動時保留舊版本。由 SD 卡、相機，或者同一個 Wi-Fi 上嘅手機匯入相片、影片同音訊。
  
  同一個工作可以用主控台執行，包括排程。你儲存嘅密碼會喺呢部電腦加密。冇帳戶、冇廣告、冇遙測。
  
  BUtil 係開源軟件。佢自己嘅程式碼屬於公有領域。第三方元件保留自己嘅授權。
  
  - 增量備份只儲存上次執行之後有改動嘅部分。
  - 去重喺同一個檔案出現多過一次時，只保留一份。
  - 由已經做好嘅備份還原檔案。
  - 備份到本機資料夾、WebDAV、相容 S3 嘅儲存或者 NFS。
  - 備份到 NAS（SMB/CIFS）、Azure Blob、SFTP 或者 FTPS。
  - 透過你控制嘅儲存，喺電腦之間同步資料夾。
  - 同步嘅檔案有改動時，保留舊版本。
  - 由 SD 卡或者相機匯入相片、影片同音訊。
  - 由同一個 Wi-Fi 上嘅手機匯入相片同影片。
  - 用你揀嘅範本幫匯入嘅檔案起名。
  - 登入時或者按每週計劃安排備份。
  - 用主控台執行同樣嘅工作，包括排程。
  - 複製任何工作嘅主控台命令，方便自動化。
  - 睇吓邊啲工作已排程，以及上次執行點結束。
  - 你儲存嘅密碼會喺呢部電腦加密。
  - 工作完成後，可以保持開機、登出、重新啟動或者關機。
  - 開源，冇帳戶、冇廣告、冇遙測。
  - 上傳資料夾，並且跳過已經儲存嘅檔案。
