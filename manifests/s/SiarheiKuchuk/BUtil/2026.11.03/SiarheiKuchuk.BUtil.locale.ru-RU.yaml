ShortDescription: "Инкрементное резервное копирование, синхронизация папок и восстановление. Дедупликация, расписания и импорт фото. Локальная папка, NAS, S3, SFTP или WebDAV. Без учётной записи и без рекламы."
Description: |-
  BUtil создаёт резервные копии, синхронизирует и восстанавливает файлы на этом компьютере. Инкрементные копии хранят только то, что изменилось. Дедупликация оставляет одну копию, если один и тот же файл встречается больше одного раза.
  
  Отправляйте копии в папку на этом компьютере, на NAS (SMB/CIFS) или на WebDAV, хранилище, совместимое с S3, NFS, Azure Blob, SFTP или FTPS.
  
  Синхронизируйте папку через хранилище, которым вы управляете, и храните прежние версии, когда файлы меняются. Импортируйте изображения, видео и звук с SD-карты, камеры или телефона в той же сети Wi-Fi.
  
  Те же задачи запускаются из консоли, в том числе по расписанию. Пароли, которые вы сохраняете, шифруются на этом компьютере. Нет учётной записи, рекламы и телеметрии.
  
  BUtil — программа с открытым исходным кодом. Собственный код передан в общественное достояние. Сторонние компоненты сохраняют свои лицензии.
  
  - Инкрементная копия хранит только то, что изменилось с прошлого запуска.
  - Дедупликация оставляет одну копию, если один и тот же файл встречается больше одного раза.
  - Восстановите файлы из резервной копии, которую вы уже сделали.
  - Копируйте в локальную папку, на WebDAV, в хранилище, совместимое с S3, или на NFS.
  - Копируйте на NAS (SMB/CIFS), в Azure Blob, по SFTP или FTPS.
  - Синхронизируйте папку между компьютерами через хранилище, которым вы управляете.
  - Храните прежние версии, когда синхронизированный файл меняется.
  - Импортируйте фото, видео и звук с SD-карты или камеры.
  - Импортируйте фото и видео с телефона в той же сети Wi-Fi.
  - Называйте импортированные файлы по выбранному шаблону.
  - Запланируйте копирование при входе или по недельному плану.
  - Запускайте те же задачи из консоли, в том числе по расписанию.
  - Скопируйте команду консоли для любой задачи, чтобы автоматизировать её.
  - Смотрите, какие задачи запланированы и чем закончился последний запуск.
  - Сохранённые пароли шифруются на этом компьютере.
  - После задачи оставьте компьютер включённым, выйдите, перезагрузите или выключите его.
  - Открытый исходный код, без учётной записи, без рекламы и без телеметрии.
  - Отправьте папку и пропустите файлы, которые уже сохранены.
