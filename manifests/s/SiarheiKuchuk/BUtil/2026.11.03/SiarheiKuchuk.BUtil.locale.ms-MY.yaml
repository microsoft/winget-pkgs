ShortDescription: "Sandaran fail berperingkat, segerak folder, dan pemulihan. Nyahpendua, jadual, dan import foto. Folder tempatan, NAS, S3, SFTP atau WebDAV. Tiada akaun dan tiada iklan."
Description: |-
  BUtil menyandarkan, menyegerak dan memulihkan fail pada PC ini. Sandaran berperingkat hanya menyimpan yang berubah. Nyahpendua menyimpan satu salinan apabila fail yang sama muncul lebih daripada sekali.
  
  Hantar sandaran ke folder pada PC ini, ke NAS (SMB/CIFS), atau ke WebDAV, storan serasi S3, NFS, Azure Blob, SFTP atau FTPS.
  
  Segerakkan folder melalui storan yang anda kawal, dan simpan versi lama apabila fail berubah. Import gambar, video dan audio daripada kad SD, kamera atau telefon pada Wi-Fi yang sama.
  
  Tugas yang sama berjalan dari konsol, termasuk mengikut jadual. Kata laluan yang anda simpan disulitkan pada komputer ini. Tiada akaun, iklan atau telemetri.
  
  BUtil ialah sumber terbuka. Kodnya sendiri didedikasikan kepada domain awam. Komponen pihak ketiga mengekalkan lesen masing-masing.
  
  - Sandaran berperingkat hanya menyimpan yang berubah sejak larian terakhir.
  - Nyahpendua menyimpan satu salinan apabila fail yang sama muncul lebih daripada sekali.
  - Pulihkan fail daripada sandaran yang sudah anda buat.
  - Sandarkan ke folder tempatan, WebDAV, storan serasi S3 atau NFS.
  - Sandarkan ke NAS (SMB/CIFS), Azure Blob, SFTP atau FTPS.
  - Segerakkan folder antara komputer melalui storan yang anda kawal.
  - Simpan versi lama apabila fail yang disegerakkan berubah.
  - Import foto, video dan audio daripada kad SD atau kamera.
  - Import foto dan video daripada telefon pada Wi-Fi yang sama.
  - Namakan fail yang diimport dengan templat yang anda pilih.
  - Jadualkan sandaran semasa log masuk atau mengikut pelan mingguan.
  - Jalankan tugas yang sama dari konsol, termasuk mengikut jadual.
  - Salin arahan konsol mana-mana tugas supaya anda boleh mengautomasikannya.
  - Lihat tugas yang dijadualkan dan bagaimana larian terakhir tamat.
  - Kata laluan yang disimpan disulitkan pada komputer ini.
  - Selepas tugas, biarkan PC hidup, log keluar, mulakan semula atau matikan.
  - Sumber terbuka, tanpa akaun, tanpa iklan dan tanpa telemetri.
  - Muat naik folder dan langkau fail yang sudah disimpan.
