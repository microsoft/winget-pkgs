ShortDescription: "கூடுதல் கோப்பு காப்பு, கோப்புறை ஒத்திசைவு மற்றும் மீட்பு. நகல் நீக்கம், அட்டவணை மற்றும் புகைப்பட இறக்குமதி. உள்ளூர் கோப்புறை, NAS, S3, SFTP அல்லது WebDAV. கணக்கு இல்லை, விளம்பரம் இல்லை."
Description: |-
  BUtil இந்த கணினியில் கோப்புகளை காப்புப் பிரதி எடுக்கிறது, ஒத்திசைக்கிறது, மீட்டெடுக்கிறது. கூடுதல் காப்பு மாறியதை மட்டும் சேமிக்கிறது. நகல் நீக்கம் ஒரே கோப்பு பல முறை வந்தால் ஒரு நகலை வைக்கிறது.
  
  காப்புகளை இந்த கணினியின் கோப்புறைக்கோ, NAS-க்கோ (SMB/CIFS), அல்லது WebDAV, S3-க்கு இணையான சேமிப்பு, NFS, Azure Blob, SFTP அல்லது FTPS-க்கோ அனுப்புங்கள்.
  
  நீங்கள் கட்டுப்படுத்தும் சேமிப்பு வழியாக ஒரு கோப்புறையை ஒத்திசைத்து, கோப்புகள் மாறும்போது பழைய பதிப்புகளை வையுங்கள். SD அட்டை, கேமரா அல்லது அதே Wi-Fi-இல் உள்ள தொலைபேசியிலிருந்து படம், காணொளி, ஒலியை இறக்குமதி செய்யுங்கள்.
  
  அதே பணிகள் கன்சோலிலிருந்தும் இயங்கும், அட்டவணை உட்பட. நீங்கள் சேமிக்கும் கடவுச்சொற்கள் இந்த கணினியில் மறைகுறியாக்கப்படும். கணக்கு, விளம்பரம், தொலை அளவீடு இல்லை.
  
  BUtil திறந்த மூலம். அதன் சொந்த குறியீடு பொது உரிமைக்கு அர்ப்பணிக்கப்பட்டது. மூன்றாம் தரப்பு கூறுகள் தங்கள் உரிமங்களை வைத்திருக்கும்.
  
  - கூடுதல் காப்பு கடைசி ஓட்டத்திற்குப் பிறகு மாறியதை மட்டும் சேமிக்கிறது.
  - நகல் நீக்கம் ஒரே கோப்பு பல முறை வந்தால் ஒரு நகலை வைக்கிறது.
  - ஏற்கெனவே செய்த காப்பிலிருந்து கோப்புகளை மீட்டெடுங்கள்.
  - உள்ளூர் கோப்புறை, WebDAV, S3-க்கு இணையான சேமிப்பு அல்லது NFS-க்கு காப்பு எடுங்கள்.
  - NAS (SMB/CIFS), Azure Blob, SFTP அல்லது FTPS-க்கு காப்பு எடுங்கள்.
  - நீங்கள் கட்டுப்படுத்தும் சேமிப்பு வழியாக கணினிகளுக்கிடையே கோப்புறையை ஒத்திசையுங்கள்.
  - ஒத்திசைந்த கோப்பு மாறும்போது பழைய பதிப்புகளை வையுங்கள்.
  - SD அட்டை அல்லது கேமராவிலிருந்து புகைப்படம், காணொளி, ஒலியை இறக்குமதி செய்யுங்கள்.
  - அதே Wi-Fi-இல் உள்ள தொலைபேசியிலிருந்து புகைப்படங்களையும் காணொளிகளையும் இறக்குமதி செய்யுங்கள்.
  - இறக்குமதி செய்த கோப்புகளுக்கு நீங்கள் தேர்ந்த வார்ப்புருவால் பெயரிடுங்கள்.
  - உள்நுழையும்போது அல்லது வாரத் திட்டத்தில் காப்பை அட்டவணைப்படுத்துங்கள்.
  - அதே பணிகளை கன்சோலிலிருந்து, அட்டவணை உட்பட, இயக்குங்கள்.
  - எந்தப் பணியின் கன்சோல் கட்டளையையும் நகலெடுத்து தானியக்கமாக்குங்கள்.
  - எந்தப் பணிகள் அட்டவணையில் உள்ளன, கடைசி ஓட்டம் எப்படி முடிந்தது என்று பாருங்கள்.
  - சேமித்த கடவுச்சொற்கள் இந்த கணினியில் மறைகுறியாக்கப்படும்.
  - பணிக்குப் பிறகு கணினியை இயக்கத்தில் விடுங்கள், வெளியேறுங்கள், மறுதொடக்கம் செய்யுங்கள் அல்லது நிறுத்துங்கள்.
  - திறந்த மூலம், கணக்கு இல்லை, விளம்பரம் இல்லை, தொலை அளவீடு இல்லை.
  - ஒரு கோப்புறையை பதிவேற்றி, ஏற்கெனவே சேமித்த கோப்புகளைத் தவிருங்கள்.
