ShortDescription: "Sauvegarde incrémentielle, synchro de dossiers et restauration. Déduplication, planifications et import de photos. Dossier local, NAS, S3, SFTP ou WebDAV. Sans compte et sans publicité."
Description: |-
  BUtil sauvegarde, synchronise et restaure des fichiers sur ce PC. Les sauvegardes incrémentielles ne conservent que ce qui a changé. La déduplication ne garde qu’une copie lorsque le même fichier apparaît plusieurs fois.
  
  Envoyez les sauvegardes dans un dossier de ce PC, sur un NAS (SMB/CIFS), ou vers WebDAV, un stockage compatible S3, NFS, Azure Blob, SFTP ou FTPS.
  
  Synchronisez un dossier via un stockage que vous contrôlez, et conservez les anciennes versions lorsque les fichiers changent. Importez des images, des vidéos et de l’audio depuis une carte SD, un appareil photo ou un téléphone sur le même Wi-Fi.
  
  Les mêmes tâches s’exécutent depuis la console, y compris selon une planification. Les mots de passe que vous enregistrez sont chiffrés sur cet ordinateur. Il n’y a pas de compte, pas de publicité et pas de télémétrie.
  
  BUtil est open source. Son propre code est versé dans le domaine public. Les composants tiers conservent leurs licences.
  
  - La sauvegarde incrémentielle ne conserve que ce qui a changé depuis la dernière exécution.
  - La déduplication ne garde qu’une copie lorsque le même fichier apparaît plusieurs fois.
  - Restaurez des fichiers à partir d’une sauvegarde déjà créée.
  - Sauvegardez vers un dossier local, WebDAV, un stockage compatible S3 ou NFS.
  - Sauvegardez vers un NAS (SMB/CIFS), Azure Blob, SFTP ou FTPS.
  - Synchronisez un dossier entre ordinateurs via un stockage que vous contrôlez.
  - Conservez les anciennes versions lorsqu’un fichier synchronisé change.
  - Importez des photos, des vidéos et de l’audio depuis une carte SD ou un appareil photo.
  - Importez des photos et des vidéos depuis un téléphone sur le même Wi-Fi.
  - Nommez les fichiers importés selon un modèle que vous choisissez.
  - Planifiez une sauvegarde à la connexion ou chaque semaine.
  - Exécutez les mêmes tâches depuis la console, y compris selon une planification.
  - Copiez une commande de console pour chaque tâche afin de l’automatiser.
  - Voyez quelles tâches sont planifiées et comment la dernière exécution s’est terminée.
  - Les mots de passe enregistrés sont chiffrés sur cet ordinateur.
  - Après une tâche, laissez le PC allumé, déconnectez-vous, redémarrez ou arrêtez-le.
  - Open source, sans compte, sans publicité et sans télémétrie.
  - Envoyez un dossier et ignorez les fichiers déjà stockés.
