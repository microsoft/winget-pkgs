ShortDescription: "Inkrementelle Dateisicherung, Ordnersynchronisierung und Wiederherstellung. Deduplizierung, Zeitpläne und Fotoimport. Lokaler Ordner, NAS, S3, SFTP oder WebDAV. Kein Konto und keine Werbung."
Description: |-
  BUtil sichert, synchronisiert und stellt Dateien auf diesem PC wieder her. Inkrementelle Sicherungen speichern nur, was sich geändert hat. Die Deduplizierung behält eine einzige Kopie, wenn dieselbe Datei mehr als einmal vorkommt.
  
  Senden Sie Sicherungen in einen Ordner auf diesem PC, auf ein NAS (SMB/CIFS) oder zu WebDAV, S3-kompatiblem Speicher, NFS, Azure Blob, SFTP oder FTPS.
  
  Synchronisieren Sie einen Ordner über Speicher, den Sie kontrollieren, und behalten Sie ältere Versionen, wenn sich Dateien ändern. Importieren Sie Bilder, Video und Audio von einer SD-Karte, einer Kamera oder einem Telefon im selben WLAN.
  
  Dieselben Aufgaben laufen auch über die Konsole, einschließlich eines Zeitplans. Kennwörter, die Sie speichern, werden auf diesem Computer verschlüsselt. Es gibt kein Konto, keine Werbung und keine Telemetrie.
  
  BUtil ist Open Source. Der eigene Code ist gemeinfrei. Komponenten von Drittanbietern behalten ihre eigenen Lizenzen.
  
  - Inkrementelle Sicherung speichert nur, was sich seit dem letzten Lauf geändert hat.
  - Deduplizierung behält eine Kopie, wenn dieselbe Datei mehr als einmal vorkommt.
  - Stellen Sie Dateien aus einer vorhandenen Sicherung wieder her.
  - Sichern Sie in einen lokalen Ordner, nach WebDAV, in S3-kompatiblen Speicher oder nach NFS.
  - Sichern Sie auf ein NAS (SMB/CIFS), nach Azure Blob, per SFTP oder FTPS.
  - Synchronisieren Sie einen Ordner zwischen Computern über Speicher, den Sie kontrollieren.
  - Behalten Sie ältere Versionen, wenn sich eine synchronisierte Datei ändert.
  - Importieren Sie Fotos, Video und Audio von einer SD-Karte oder Kamera.
  - Importieren Sie Fotos und Videos von einem Telefon im selben WLAN.
  - Benennen Sie importierte Dateien nach einer Vorlage, die Sie festlegen.
  - Planen Sie eine Sicherung bei der Anmeldung oder wöchentlich.
  - Führen Sie dieselben Aufgaben über die Konsole aus, auch nach Zeitplan.
  - Kopieren Sie einen Konsolenbefehl für jede Aufgabe, um sie zu automatisieren.
  - Sehen Sie, welche Aufgaben geplant sind und wie der letzte Lauf endete.
  - Gespeicherte Kennwörter werden auf diesem Computer verschlüsselt.
  - Nach einer Aufgabe den PC anlassen, abmelden, neu starten oder herunterfahren.
  - Open Source, ohne Konto, ohne Werbung und ohne Telemetrie.
  - Laden Sie einen Ordner hoch und überspringen Sie Dateien, die schon gespeichert sind.
