ShortDescription: "Инкрементално резервно копие, синхронизиране на папки и възстановяване. Дедупликация, графици и импорт на снимки. Локална папка, NAS, S3, SFTP или WebDAV. Без акаунт и без реклами."
Description: |-
  BUtil прави резервни копия, синхронизира и възстановява файлове на този компютър. Инкременталните копия пазят само промененото. Дедупликацията запазва едно копие, когато един и същ файл се появява повече от веднъж.
  
  Изпращайте копия в папка на този компютър, на NAS (SMB/CIFS) или към WebDAV, хранилище, съвместимо с S3, NFS, Azure Blob, SFTP или FTPS.
  
  Синхронизирайте папка през хранилище, което контролирате, и пазете по-стари версии, когато файловете се променят. Импортирайте снимки, видео и звук от SD карта, камера или телефон в същата Wi-Fi мрежа.
  
  Същите задачи се пускат от конзолата, включително по график. Паролите, които записвате, се шифроват на този компютър. Няма акаунт, реклами и телеметрия.
  
  BUtil е с отворен код. Собственият код е отдаден на общественото достояние. Компонентите на трети страни запазват своите лицензи.
  
  - Инкременталното копие пази само промененото от последното изпълнение.
  - Дедупликацията запазва едно копие, когато един и същ файл се появява повече от веднъж.
  - Възстановете файлове от резервно копие, което вече сте направили.
  - Копирайте в локална папка, WebDAV, хранилище, съвместимо с S3, или NFS.
  - Копирайте на NAS (SMB/CIFS), Azure Blob, SFTP или FTPS.
  - Синхронизирайте папка между компютри през хранилище, което контролирате.
  - Пазете по-стари версии, когато синхронизиран файл се промени.
  - Импортирайте снимки, видео и звук от SD карта или камера.
  - Импортирайте снимки и видео от телефон в същата Wi-Fi мрежа.
  - Именувайте импортираните файлове по шаблон, който изберете.
  - Планирайте копие при влизане или по седмичен план.
  - Пускайте същите задачи от конзолата, включително по график.
  - Копирайте конзолна команда за всяка задача, за да я автоматизирате.
  - Вижте кои задачи са планирани и как е завършило последното изпълнение.
  - Записаните пароли се шифроват на този компютър.
  - След задача оставете компютъра включен, излезте, рестартирайте или го изключете.
  - Отворен код, без акаунт, без реклами и без телеметрия.
  - Качете папка и пропуснете файловете, които вече са записани.
