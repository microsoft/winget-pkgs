ShortDescription: "增量文件备份、文件夹同步和还原。去重、计划和照片导入。本地文件夹、NAS、S3、SFTP 或 WebDAV。无账户、无广告。"
Description: |-
  BUtil 在这台电脑上备份、同步和还原文件。增量备份只保存有变化的内容。去重会在同一文件出现多次时只保留一份。
  
  备份可以保存到这台电脑上的文件夹、NAS（SMB/CIFS），或 WebDAV、兼容 S3 的存储、NFS、Azure Blob、SFTP 或 FTPS。
  
  通过你控制的存储同步文件夹，并在文件变化时保留旧版本。从 SD 卡、相机，或同一 Wi-Fi 上的手机导入图片、视频和音频。
  
  同一任务可从控制台运行，包括按计划运行。你保存的密码会在这台电脑上加密。没有账户、没有广告、没有遥测。
  
  BUtil 是开源软件。它自己的代码属于公有领域。第三方组件保留各自的许可证。
  
  - 增量备份只保存上次运行以来有变化的内容。
  - 去重会在同一文件出现多次时只保留一份。
  - 从已经做好的备份中还原文件。
  - 备份到本地文件夹、WebDAV、兼容 S3 的存储或 NFS。
  - 备份到 NAS（SMB/CIFS）、Azure Blob、SFTP 或 FTPS。
  - 通过你控制的存储，在电脑之间同步文件夹。
  - 同步的文件发生变化时，保留旧版本。
  - 从 SD 卡或相机导入照片、视频和音频。
  - 从同一 Wi-Fi 上的手机导入照片和视频。
  - 用你选择的模板为导入的文件命名。
  - 在登录时或按每周计划安排备份。
  - 从控制台运行同样的任务，包括按计划运行。
  - 复制任意任务的控制台命令，以便自动运行。
  - 查看哪些任务已安排，以及上次运行如何结束。
  - 保存的密码会在这台电脑上加密。
  - 任务结束后，可以让电脑保持开机、注销、重启或关机。
  - 开源，无账户、无广告、无遥测。
  - 上传文件夹，并跳过已经保存的文件。
