ShortDescription: "Copia de seguridad incremental, sincronización de carpetas y restauración. Deduplicación, programaciones e importación de fotos. Carpeta local, NAS, S3, SFTP o WebDAV. Sin cuenta y sin anuncios."
Description: |-
  BUtil copia, sincroniza y restaura archivos en este PC. Las copias incrementales guardan solo lo que cambió. La deduplicación conserva una sola copia cuando el mismo archivo aparece más de una vez.
  
  Envíe las copias a una carpeta de este PC, a un NAS (SMB/CIFS), o a WebDAV, almacenamiento compatible con S3, NFS, Azure Blob, SFTP o FTPS.
  
  Sincronice una carpeta a través de un almacenamiento que usted controla y conserve versiones anteriores cuando los archivos cambien. Importe imágenes, vídeo y audio desde una tarjeta SD, una cámara o un teléfono en la misma Wi-Fi.
  
  Las mismas tareas se ejecutan desde la consola, también con una programación. Las contraseñas que guarda se cifran en este equipo. No hay cuenta, ni publicidad, ni telemetría.
  
  BUtil es de código abierto. Su propio código está dedicado al dominio público. Los componentes de terceros conservan sus licencias.
  
  - La copia incremental guarda solo lo que cambió desde la última ejecución.
  - La deduplicación conserva una copia cuando el mismo archivo aparece más de una vez.
  - Restaure archivos de una copia de seguridad que ya haya creado.
  - Copie en una carpeta local, WebDAV, almacenamiento compatible con S3 o NFS.
  - Copie en un NAS (SMB/CIFS), Azure Blob, SFTP o FTPS.
  - Sincronice una carpeta entre equipos a través de un almacenamiento que usted controla.
  - Conserve versiones anteriores cuando cambia un archivo sincronizado.
  - Importe fotos, vídeo y audio desde una tarjeta SD o una cámara.
  - Importe fotos y vídeos desde un teléfono en la misma Wi-Fi.
  - Asigne nombres a los archivos importados con una plantilla que usted elige.
  - Programe una copia al iniciar sesión o con un plan semanal.
  - Ejecute las mismas tareas desde la consola, también de forma programada.
  - Copie un comando de consola de cualquier tarea para automatizarla.
  - Vea qué tareas están programadas y cómo terminó la última ejecución.
  - Las contraseñas guardadas se cifran en este equipo.
  - Tras una tarea, deje el PC encendido, cierre la sesión, reinicie o apáguelo.
  - Código abierto, sin cuenta, sin anuncios y sin telemetría.
  - Suba una carpeta y omita los archivos que ya están almacenados.
