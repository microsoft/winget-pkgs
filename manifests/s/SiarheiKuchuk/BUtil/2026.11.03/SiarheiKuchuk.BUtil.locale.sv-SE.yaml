ShortDescription: "Inkrementell filsäkerhetskopiering, mappsynk och återställning. Deduplicering, scheman och fotoimport. Lokal mapp, NAS, S3, SFTP eller WebDAV. Inget konto och ingen reklam."
Description: |-
  BUtil säkerhetskopierar, synkroniserar och återställer filer på den här datorn. Inkrementella säkerhetskopior sparar bara det som ändrats. Deduplicering behåller en enda kopia när samma fil förekommer mer än en gång.
  
  Skicka säkerhetskopior till en mapp på den här datorn, till en NAS (SMB/CIFS), eller till WebDAV, S3-kompatibel lagring, NFS, Azure Blob, SFTP eller FTPS.
  
  Synkronisera en mapp via lagring som du bestämmer över, och behåll äldre versioner när filer ändras. Importera bilder, video och ljud från ett SD-kort, en kamera eller en telefon i samma wifi.
  
  Samma uppgifter körs från konsolen, även enligt ett schema. Lösenord som du sparar krypteras på den här datorn. Det finns inget konto, ingen reklam och ingen telemetri.
  
  BUtil är öppen källkod. Den egna koden är allmän egendom. Komponenter från tredje part behåller sina egna licenser.
  
  - En inkrementell säkerhetskopia sparar bara det som ändrats sedan senaste körningen.
  - Deduplicering behåller en kopia när samma fil förekommer mer än en gång.
  - Återställ filer från en säkerhetskopia som du redan har skapat.
  - Säkerhetskopiera till en lokal mapp, WebDAV, S3-kompatibel lagring eller NFS.
  - Säkerhetskopiera till en NAS (SMB/CIFS), Azure Blob, SFTP eller FTPS.
  - Synkronisera en mapp mellan datorer via lagring som du bestämmer över.
  - Behåll äldre versioner när en synkroniserad fil ändras.
  - Importera foton, video och ljud från ett SD-kort eller en kamera.
  - Importera foton och videor från en telefon i samma wifi.
  - Namnge importerade filer enligt en mall som du väljer.
  - Schemalägg en säkerhetskopia vid inloggning eller enligt en veckoplan.
  - Kör samma uppgifter från konsolen, även enligt ett schema.
  - Kopiera ett konsolkommando för en uppgift så att du kan automatisera den.
  - Se vilka uppgifter som är schemalagda och hur den senaste körningen slutade.
  - Sparade lösenord krypteras på den här datorn.
  - Efter en uppgift kan datorn vara på, logga ut, starta om eller stängas av.
  - Öppen källkod, utan konto, utan reklam och utan telemetri.
  - Ladda upp en mapp och hoppa över filer som redan finns lagrade.
