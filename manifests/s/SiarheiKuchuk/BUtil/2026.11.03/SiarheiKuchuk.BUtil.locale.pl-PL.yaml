ShortDescription: "Przyrostowa kopia zapasowa, synchronizacja folderów i przywracanie. Deduplikacja, harmonogramy i import zdjęć. Folder lokalny, NAS, S3, SFTP lub WebDAV. Bez konta i bez reklam."
Description: |-
  BUtil tworzy kopie zapasowe, synchronizuje i przywraca pliki na tym komputerze. Kopie przyrostowe zapisują tylko to, co się zmieniło. Deduplikacja zostawia jedną kopię, gdy ten sam plik występuje więcej niż raz.
  
  Wysyłaj kopie do folderu na tym komputerze, na serwer NAS (SMB/CIFS) albo do WebDAV, magazynu zgodnego z S3, NFS, Azure Blob, SFTP lub FTPS.
  
  Synchronizuj folder przez magazyn, który kontrolujesz, i zachowuj starsze wersje, gdy pliki się zmieniają. Importuj obrazy, wideo i dźwięk z karty SD, aparatu albo telefonu w tej samej sieci Wi-Fi.
  
  Te same zadania działają z konsoli, także według harmonogramu. Zapisane hasła są szyfrowane na tym komputerze. Nie ma konta, reklam ani telemetrii.
  
  BUtil jest open source. Własny kod jest oddany do domeny publicznej. Składniki innych firm zachowują własne licencje.
  
  - Kopia przyrostowa zapisuje tylko to, co zmieniło się od ostatniego uruchomienia.
  - Deduplikacja zostawia jedną kopię, gdy ten sam plik występuje więcej niż raz.
  - Przywracaj pliki z kopii zapasowej, którą już utworzono.
  - Twórz kopie w folderze lokalnym, w WebDAV, w magazynie zgodnym z S3 lub w NFS.
  - Twórz kopie na serwerze NAS (SMB/CIFS), w Azure Blob, przez SFTP lub FTPS.
  - Synchronizuj folder między komputerami przez magazyn, który kontrolujesz.
  - Zachowuj starsze wersje, gdy zsynchronizowany plik się zmienia.
  - Importuj zdjęcia, wideo i dźwięk z karty SD lub aparatu.
  - Importuj zdjęcia i wideo z telefonu w tej samej sieci Wi-Fi.
  - Nazywaj importowane pliki według wybranego szablonu.
  - Zaplanuj kopię przy logowaniu albo według planu tygodniowego.
  - Uruchamiaj te same zadania z konsoli, także według harmonogramu.
  - Kopiuj polecenie konsoli dowolnego zadania, aby je zautomatyzować.
  - Zobacz, które zadania są zaplanowane i jak skończyło się ostatnie uruchomienie.
  - Zapisane hasła są szyfrowane na tym komputerze.
  - Po zadaniu zostaw komputer włączony, wyloguj, uruchom ponownie albo wyłącz.
  - Open source, bez konta, bez reklam i bez telemetrii.
  - Wyślij folder i pomijaj pliki, które są już zapisane.
