ShortDescription: "專為 Windows 而設的開源截圖標註工具。拍攝、裁剪，用箭頭、標註、模糊和 OCR 做標記。無需帳戶，無廣告，無雲端。"
Description: |-
  Screenshot Annotator 能在數秒內，把雜亂的螢幕截圖變成清楚的說明。按下 Print Screen，裁出重點，做好標記，然後分享。它是開源的。截圖留在這部 PC 上。無需帳戶。無廣告。無雲端。
  
  截圖始終只需一鍵。即使應用程式在背景或已最小化，Print Screen 依然可用。裁出範圍，再指向、說明、隱藏、修飾。
  
  讓畫面自己把話說完
  
  - 準確指向目標位置的可自訂箭頭
  - 帶可編輯文字的對話氣泡
  - 用來框出重點的備註和帶邊框矩形
  - 可改色的螢光筆
  - 用模糊和塗白遮住密碼、姓名和私隱資料
  - 用直向和橫向裁切去掉空白
  - 複製、貼上、匯入，以及匯出 PNG、JPEG 或 WebP
  
  從螢幕擷取文字
  
  選取範圍，用內建 Windows OCR 擷取文字。無需額外軟件。如果你已經在用 Tesseract，也可以選用該引擎。編輯結果，複製，然後繼續。
  
  保持流暢
  
  專案會自動儲存並附帶預覽縮圖，昨天的錯誤報告或今天的操作說明都能即時跳回。把圖片拖進來。把完成的畫面複製到剪貼簿。隨 Windows 啟動，登入後截圖功能已在等候。工作區深色、輕快，並提供 57 種語言。
  
  截圖屬於你
  
  這是一款開源桌面工具。標註專案存放在圖片資料夾中。設定留在這部電腦上。不會上載任何內容。你可以檢查它如何運作。用於錯誤報告、說明文件、評測、支援工單，以及每一次「你睇吓呢個」的時刻。
  
  工作認真。工具有趣。友善的貓咪偶爾會露面。
  
  - 按 Print Screen 或應用程式內的按鈕即可截圖，即使程式在背景亦可用。
  - 一下動作裁出重點範圍，然後立刻開始標註。
  - 繪製可自訂的箭頭，準確指向要人留意的位置。
  - 加入可編輯文字的對話氣泡，保持清晰易讀。
  - 放下備註和帶邊框的矩形，用來說明或框出任何區域。
  - 用可改色的螢光筆突顯真正重要的內容。
  - 模糊密碼、姓名以及不應分享的任何資料。
  - 將選取範圍塗白，或只把該部分複製到剪貼簿。
  - 裁走空白的直向或橫向條帶，讓截圖保持精簡。
  - 用內建 Windows OCR 從選區擷取文字。亦可選用 Tesseract。
  - 複製貼上截圖和圖形。將圖片拖放到專案中。
  - 匯出 PNG、JPEG 或 WebP。專案旁邊還會儲存一份 PNG。
  - 專案自動儲存並附預覽縮圖，可即時跳回繼續。
  - 隨 Windows 啟動，登入後 Print Screen 截圖隨時可用。
  - 開源。無廣告、無分析、無需帳戶。截圖留在這部 PC 上。
  - 深色、專注的工作區，設有捲軸，適合處理大截圖。
  - 調整備註、氣泡和箭頭的字型、顏色、大小、粗體和斜體。
  - 選取、移動並編輯標註，直到畫面把故事講清楚。
