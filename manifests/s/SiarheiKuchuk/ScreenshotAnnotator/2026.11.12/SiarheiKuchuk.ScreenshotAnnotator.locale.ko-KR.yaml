ShortDescription: "Windows용 오픈 소스 스크린샷 주석 도구입니다. 캡처, 자르기, 화살표·말풍선·흐림·OCR로 표시하세요. 계정 없음, 광고 없음, 클라우드 없음."
Description: |-
  Screenshot Annotator는 지저분한 화면 캡처를 몇 초 만에 분명한 설명으로 바꿉니다. Print Screen을 누르고, 중요한 부분을 자르고, 표시한 뒤 공유하세요. 오픈 소스입니다. 스크린샷은 이 PC에 남습니다. 계정 없음. 광고 없음. 클라우드 없음.
  
  캡처는 언제나 키 하나. 앱이 백그라운드이거나 최소화되어 있어도 Print Screen이 동작합니다. 영역을 자른 다음 가리키고, 설명하고, 숨기고, 다듬으세요.
  
  그림이 말하게 하세요
  
  - 정확한 지점을 가리키는 사용자 지정 화살표
  - 편집 가능한 텍스트가 있는 말풍선
  - 중요한 부분을 감싸는 메모와 테두리 사각형
  - 색을 바꿀 수 있는 형광펜
  - 비밀번호, 이름, 개인 정보를 가리는 흐림과 화이트아웃
  - 빈 공간을 없애는 세로·가로 자르기
  - 복사, 붙여넣기, 가져오기, PNG·JPEG·WebP 내보내기
  
  화면에서 텍스트를 꺼내세요
  
  영역을 선택한 뒤 내장 Windows OCR로 텍스트를 추출합니다. 추가 소프트웨어는 필요 없습니다. 이미 Tesseract를 쓰고 있다면 그 엔진도 지원합니다. 결과를 편집하고, 복사한 뒤, 다음으로 넘어가세요.
  
  흐름을 유지하세요
  
  프로젝트는 미리보기 썸네일과 함께 자동 저장되므로, 어제 버그 리포트나 오늘의 사용 설명으로 바로 돌아갈 수 있습니다. 이미지를 끌어다 놓으세요. 완성한 그림을 클립보드에 복사하세요. Windows와 함께 시작하면 로그인한 뒤 캡처가 기다리고 있습니다. 작업 공간은 어둡고 빠르며 57개 언어로 제공됩니다.
  
  스크린샷은 당신의 것입니다
  
  오픈 소스 데스크톱 도구입니다. 주석이 달린 프로젝트는 사진 폴더에 저장됩니다. 설정은 이 PC에 남습니다. 아무것도 업로드되지 않습니다. 동작 방식을 직접 확인할 수 있습니다. 버그 리포트, 문서, 리뷰, 지원 티켓, 모든 「이거 봐」 순간에 쓰세요.
  
  일은 진지하게. 도구는 즐겁게. 친절한 고양이가 가끔 나타납니다.
  
  - Print Screen 키나 앱 안의 버튼으로 캡처하세요. 앱이 백그라운드여도 됩니다.
  - 중요한 부분을 한 동작으로 자른 뒤 바로 주석을 답니다.
  - 사람들이 정확한 지점을 보도록 사용자 지정 화살표를 그립니다.
  - 읽기 쉬운 편집 가능한 텍스트가 있는 말풍선을 추가합니다.
  - 메모와 테두리 사각형으로 영역을 설명하거나 강조합니다.
  - 색을 바꿀 수 있는 형광펜으로 중요한 부분을 강조합니다.
  - 비밀번호, 이름, 공유하면 안 되는 정보를 흐리게 처리합니다.
  - 선택한 영역을 하얗게 가리거나, 그 부분만 클립보드에 복사합니다.
  - 빈 세로띠나 가로띠를 잘라 스크린샷을 간결하게 유지합니다.
  - 선택 영역에서 텍스트를 추출합니다. 내장 Windows OCR. 선택적으로 Tesseract도 사용할 수 있습니다.
  - 스크린샷과 도형을 복사하고 붙여넣습니다. 이미지를 프로젝트로 끌어다 놓습니다.
  - PNG, JPEG, WebP로 내보냅니다. 프로젝트 옆에 PNG도 저장됩니다.
  - 프로젝트는 미리보기 썸네일과 함께 자동 저장되어 바로 이어서 작업할 수 있습니다.
  - Windows와 함께 시작하고, 로그인한 뒤에도 Print Screen 캡처를 바로 쓸 수 있습니다.
  - 오픈 소스. 광고 없음, 분석 없음, 계정 없음. 스크린샷은 이 PC에 남습니다.
  - 큰 스크린샷을 위한 스크롤바가 있는, 어둡고 집중하기 좋은 작업 공간.
  - 메모, 말풍선, 화살표의 글꼴, 색, 크기, 굵게, 기울임꼴을 조정합니다.
  - 그림이 이야기를 전할 때까지 주석을 선택하고 옮기고 편집합니다.
