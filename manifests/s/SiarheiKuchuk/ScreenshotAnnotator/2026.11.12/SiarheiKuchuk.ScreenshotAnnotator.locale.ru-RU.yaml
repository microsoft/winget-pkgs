ShortDescription: "Открытый аннотатор скриншотов для Windows. Снимайте, обрезайте, помечайте стрелками, выносками, размытием и OCR. Без аккаунта, без рекламы, без облака."
Description: |-
  Screenshot Annotator за секунды превращает хаотичный снимок экрана в понятное объяснение. Нажмите Print Screen, обрежьте важное, разметьте и поделитесь. Это открытый проект. Скриншоты остаются на этом PC. Без аккаунта. Без рекламы. Без облака.
  
  Захват всегда под рукой — одна клавиша. Print Screen работает, даже когда приложение свёрнуто или в фоне. Обрежьте область, затем указывайте, поясняйте, скрывайте и доводите до блеска.
  
  Пусть картинка говорит сама
  
  - Настраиваемые стрелки, которые указывают точно в нужное место
  - Выноски в виде речевых пузырей с редактируемым текстом
  - Заметки и прямоугольники с рамкой, чтобы выделить важное
  - Маркер, цвет которого можно менять
  - Размытие и закрашивание белым для паролей, имён и личных данных
  - Вертикальные и горизонтальные разрезы, чтобы убрать пустое пространство
  - Копирование, вставка, импорт и экспорт PNG, JPEG или WebP
  
  Снимите текст с экрана
  
  Выделите область и извлеките текст встроенным Windows OCR. Дополнительное ПО не нужно. Если вы уже используете Tesseract, этот движок тоже поддерживается. Отредактируйте результат, скопируйте и идите дальше.
  
  Оставайтесь в потоке
  
  Проекты сохраняются автоматически с миниатюрами предпросмотра — можно мгновенно вернуться к вчерашнему баг-репорту или сегодняшней инструкции. Перетаскивайте изображения. Копируйте готовый снимок в буфер обмена. Запускайте вместе с Windows, чтобы захват ждал вас после входа. Рабочее пространство тёмное, быстрое и доступно на 57 языках.
  
  Ваши скриншоты — ваши
  
  Это настольный инструмент с открытым исходным кодом. Размеченные проекты живут в папке «Изображения». Настройки остаются на этом компьютере. Ничего не загружается. Вы можете посмотреть, как всё устроено. Подходит для баг-репортов, документации, обзоров, тикетов поддержки и каждого «посмотри вот это».
  
  Работа остаётся серьёзной. Инструмент — весёлым. Время от времени появляются дружелюбные коты.
  
  - Нажмите Print Screen или кнопку в приложении, чтобы сделать снимок — даже если оно в фоне.
  - Обрежьте нужный фрагмент одним движением и сразу переходите к разметке.
  - Рисуйте настраиваемые стрелки, которые указывают точно туда, куда нужно.
  - Добавляйте выноски в виде речевых пузырей с редактируемым читаемым текстом.
  - Ставьте заметки и прямоугольники с рамкой, чтобы пояснить или выделить область.
  - Подчёркивайте важное маркером, цвет которого можно менять.
  - Размывайте пароли, имена и всё, чем не стоит делиться.
  - Закрашивайте выбранную область белым или копируйте только этот фрагмент в буфер обмена.
  - Вырезайте пустые вертикальные или горизонтальные полосы, чтобы скриншот оставался компактным.
  - Извлекайте текст из выделения встроенным Windows OCR. По желанию — Tesseract.
  - Копируйте и вставляйте скриншоты и фигуры. Перетаскивайте изображения в проект.
  - Экспортируйте PNG, JPEG или WebP. PNG также сохраняется рядом с проектом.
  - Проекты сохраняются автоматически с миниатюрами, чтобы сразу вернуться к работе.
  - Запускайте вместе с Windows, чтобы захват Print Screen был готов после входа.
  - Открытый исходный код. Без рекламы, без аналитики, без аккаунта. Скриншоты остаются на этом компьютере.
  - Тёмное, сосредоточенное рабочее пространство с прокруткой для больших скриншотов.
  - Настраивайте шрифты, цвета, размер, жирность и курсив у заметок, выносок и стрелок.
  - Выделяйте, перемещайте и правьте аннотации, пока картинка не расскажет историю.
