ShortDescription: "Windows ପାଇଁ ଓପନ ସୋର୍ସ ସ୍କ୍ରିନସଟ ଚିହ୍ନିତକରଣ ଆପ୍। କ୍ୟାପଚର କରନ୍ତୁ, କ୍ରପ କରନ୍ତୁ, ତୀର, କଲଆଉଟ, ବ୍ଲର ଓ OCR ରେ ମାର୍କ କରନ୍ତୁ। ଆକାଉଣ୍ଟ ନାହିଁ, ବିଜ୍ଞାପନ ନାହିଁ, କ୍ଲାଉଡ ନାହିଁ।"
Description: |-
  Screenshot Annotator ଅସ୍ତବ୍ୟସ୍ତ ସ୍କ୍ରିନ ଗ୍ରାବକୁ ସେକେଣ୍ଡରେ ସ୍ପଷ୍ଟ ବ୍ୟାଖ୍ୟାରେ ବଦଳାଏ। Print Screen ଦବାନ୍ତୁ, ଦରକାରୀ ଅଂଶ କାଟନ୍ତୁ, ମାର୍କ କରନ୍ତୁ ଓ ସେୟାର କରନ୍ତୁ। ଏହା ଓପନ ସୋର୍ସ। ଆପଣଙ୍କ ସ୍କ୍ରିନସଟ ଏହି PC ରେ ରହେ। ଆକାଉଣ୍ଟ ନାହିଁ। ବିଜ୍ଞାପନ ନାହିଁ। କ୍ଲାଉଡ ନାହିଁ।
  
  କ୍ୟାପଚର ସର୍ବଦା ଗୋଟିଏ କି ଦୂରରେ। ଆପ୍ ପୃଷ୍ଠଭୂମିରେ କିମ୍ବା ଛୋଟ ହୋଇଥିଲେ ମଧ୍ୟ Print Screen କାମ କରେ। ଅଞ୍ଚଳ କାଟନ୍ତୁ, ତା’ପରେ ଦେଖାନ୍ତୁ, ବୁଝାନ୍ତୁ, ଲୁଚାନ୍ତୁ ଓ ସଜାନ୍ତୁ।
  
  ଛବିକୁ କଥା କହିବାକୁ ଦିଅନ୍ତୁ
  
  - ଠିକ୍ ସେହି ସ୍ଥାନ ଦେଖାଉଥିବା କଷ୍ଟମ ତୀର
  - ସମ୍ପାଦନଯୋଗ୍ୟ ପାଠ୍ୟ ସହିତ ସ୍ପିଚ-ବବଲ କଲଆଉଟ
  - ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ କଥା ଫ୍ରେମ କରିବାକୁ ନୋଟ ଓ ବଡର ଯୁକ୍ତ ଆୟତ
  - ପୁନର୍ବାର ରଙ୍ଗ ବଦଳାଯାଇପାରୁଥିବା ହାଇଲାଇଟର
  - ପାସୱାର୍ଡ, ନାମ ଓ ବ୍ୟକ୍ତିଗତ ତଥ୍ୟ ପାଇଁ ବ୍ଲର ଓ ହ୍ୱାଇଟ-ଆଉଟ
  - ଖାଲି ସ୍ଥାନ କାଢ଼ିବାକୁ ଉଲମ୍ବ ଓ ସମାନ୍ତରାଳ କଟ
  - PNG, JPEG କିମ୍ବା WebP କପି, ପେଷ୍ଟ, ଇମପୋର୍ଟ ଓ ଏକ୍ସପୋର୍ଟ
  
  ସ୍କ୍ରିନରୁ ପାଠ୍ୟ ଉଠାନ୍ତୁ
  
  ଗୋଟିଏ ଅଞ୍ଚଳ ବାଛନ୍ତୁ ଓ ବିଲ୍ଟ-ଇନ Windows OCR ରେ ପାଠ୍ୟ ବାହାର କରନ୍ତୁ। ଅତିରିକ୍ତ ସଫ୍ଟୱେର ଦରକାର ନାହିଁ। ଆପଣ ପୂର୍ବରୁ Tesseract ବ୍ୟବହାର କରୁଥିଲେ, ସେହି ଇଞ୍ଜିନ୍ ମଧ୍ୟ ସପୋର୍ଟେଡ୍। ଫଳାଫଳ ସମ୍ପାଦନ କରନ୍ତୁ, କପି କରନ୍ତୁ, ଆଗକୁ ବଢ଼ନ୍ତୁ।
  
  ପ୍ରବାହରେ ରୁହନ୍ତୁ
  
  ପ୍ରକଳ୍ପ ପ୍ରିଭ୍ୟୁ ଥମ୍ବନେଲ ସହିତ ସ୍ୱୟଂଚାଳିତ ଭାବେ ସେଭ ହୁଏ, ତେଣୁ ଗତକାଲିର ବଗ୍ ରିପୋର୍ଟ କିମ୍ବା ଆଜିର ହାଉ-ଟୁକୁ ତୁରନ୍ତ ଫେରିପାରିବେ। ଛବି ଟାଣି ଆଣନ୍ତୁ। ସମାପ୍ତ ଛବି କ୍ଲିପବୋର୍ଡରେ କପି କରନ୍ତୁ। Windows ସହିତ ଆରମ୍ଭ କରନ୍ତୁ ଯେପରି ସାଇନ ଇନ ପରେ କ୍ୟାପଚର ଅପେକ୍ଷା କରେ। କାର୍ଯ୍ୟକ୍ଷେତ୍ର ଗାଢ, ଦ୍ରୁତ ଓ 57ଟି ଭାଷାରେ ଉପଲବ୍ଧ।
  
  ସ୍କ୍ରିନସଟ ଆପଣଙ୍କର
  
  ଏହା ଏକ ଓପନ ସୋର୍ସ ଡେସ୍କଟପ ଟୁଲ୍। ଆନୋଟେଟେଡ୍ ପ୍ରକଳ୍ପ ଆପଣଙ୍କ Pictures ଫୋଲ୍ଡରରେ ରହେ। ସେଟିଂସ ଏହି କମ୍ପ୍ୟୁଟରରେ ରହେ। କିଛି ଅପଲୋଡ ହୁଏ ନାହିଁ। ଏହା କିପରି କାମ କରେ ଆପଣ ଦେଖିପାରିବେ। ବଗ୍ ରିପୋର୍ଟ, ଡକ୍ୟୁମେଣ୍ଟେସନ, ରିଭ୍ୟୁ, ସପୋର୍ଟ ଟିକେଟ ଓ ପ୍ରତ୍ୟେକ "ଏହା ଦେଖ" ମୁହୂର୍ତ୍ତରେ ବ୍ୟବହାର କରନ୍ତୁ।
  
  କାମ ଗମ୍ଭୀର ରହେ। ଟୁଲ୍ ମଜାଦାର ରହେ। ବନ୍ଧୁତ୍ୱପୂର୍ଣ୍ଣ ବିଲେଇ ମଝିରେ ମଝିରେ ଦେଖାଯାଏ।
  
  - ଆପ୍ ପୃଷ୍ଠଭୂମିରେ ଥିଲେ ମଧ୍ୟ Print Screen କିମ୍ବା ଆପ୍ ବଟନରେ କ୍ୟାପଚର କରନ୍ତୁ।
  - ଗୋଟିଏ ଗତିରେ ଦରକାରୀ ଅଂଶ କାଟନ୍ତୁ, ତା’ପରେ ସଙ୍ଗେ ସଙ୍ଗେ ମାର୍କ କରନ୍ତୁ।
  - ଠିକ୍ ସେହି ସ୍ଥାନକୁ ଦେଖାଉଥିବା କଷ୍ଟମ କରିହେବା ତୀର ଆଙ୍କନ୍ତୁ।
  - ପଢ଼ିହେବା ସମ୍ପାଦନଯୋଗ୍ୟ ପାଠ୍ୟ ସହିତ ସ୍ପିଚ-ବବଲ କଲଆଉଟ ଯୋଡନ୍ତୁ।
  - ଯେକୌଣସି ସ୍ଥାନ ବୁଝାଇବା କିମ୍ବା ଫ୍ରେମ କରିବାକୁ ନୋଟ ଓ ବଡର ଯୁକ୍ତ ଆୟତ ଦିଅନ୍ତୁ।
  - ପୁନର୍ବାର ରଙ୍ଗ ବଦଳାଯାଇପାରୁଥିବା ହାଇଲାଇଟରରେ ଗୁରୁତ୍ୱପୂର୍ଣ୍ଣ କଥା ଚିହ୍ନିତ କରନ୍ତୁ।
  - ପାସୱାର୍ଡ, ନାମ ଓ ଯାହା ଅଂଶୀଦାର କରିବା ଉଚିତ ନୁହେଁ ତାହା ବ୍ଲର କରନ୍ତୁ।
  - ବଛା ଅଞ୍ଚଳକୁ ଧଳା କରନ୍ତୁ, କିମ୍ବା କେବଳ ସେହି ଖଣ୍ଡକୁ କ୍ଲିପବୋର୍ଡରେ କପି କରନ୍ତୁ।
  - ଖାଲି ଉଲମ୍ବ କିମ୍ବା ସମାନ୍ତରାଳ ପଟି କାଟି ସ୍କ୍ରିନସଟକୁ ସଂକ୍ଷିପ୍ତ ରଖନ୍ତୁ।
  - ବିଲ୍ଟ-ଇନ Windows OCR ରେ ବଛା ଅଂଶରୁ ପାଠ୍ୟ ବାହାର କରନ୍ତୁ। ବୈକଳ୍ପିକ Tesseract।
  - ସ୍କ୍ରିନସଟ ଓ ଆକୃତି କପି-ପେଷ୍ଟ କରନ୍ତୁ। ପ୍ରକଳ୍ପରେ ଛବି ଡ୍ରାଗ ଆଣ୍ଡ ଡ୍ରପ କରନ୍ତୁ।
  - PNG, JPEG କିମ୍ବା WebP ଏକ୍ସପୋର୍ଟ କରନ୍ତୁ। ପ୍ରକଳ୍ପ ପାଖରେ PNG ମଧ୍ୟ ସେଭ ହୁଏ।
  - ପ୍ରକଳ୍ପ ପ୍ରିଭ୍ୟୁ ଥମ୍ବନେଲ ସହିତ ଅଟୋ-ସେଭ ହୁଏ, ତେଣୁ ତୁରନ୍ତ ଫେରିପାରିବେ।
  - Windows ସହିତ ଆରମ୍ଭ କରନ୍ତୁ, ସାଇନ ଇନ ପରେ Print Screen କ୍ୟାପଚର ପ୍ରସ୍ତୁତ ରହିବ।
  - ଓପନ ସୋର୍ସ। ବିଜ୍ଞାପନ ନାହିଁ, ଆନାଲିଟିକ୍ସ ନାହିଁ, ଆକାଉଣ୍ଟ ନାହିଁ। ସ୍କ୍ରିନସଟ ଏହି କମ୍ପ୍ୟୁଟରରେ ରହେ।
  - ବଡ ସ୍କ୍ରିନସଟ ପାଇଁ ସ୍କ୍ରୋଲବାର ଥିବା ଗାଢ, ମନୋଯୋଗୀ କାର୍ଯ୍ୟକ୍ଷେତ୍ର।
  - ନୋଟ, କଲଆଉଟ ଓ ତୀରରେ ଫଣ୍ଟ, ରଙ୍ଗ, ଆକାର, ବୋଲ୍ଡ ଓ ଇଟାଲିକ ଠିକ କରନ୍ତୁ।
  - ଛବି କାହାଣୀ କହିବା ପର୍ଯ୍ୟନ୍ତ ଆନୋଟେସନ ବାଛନ୍ତୁ, ଘୁଞ୍ଚାନ୍ତୁ ଓ ସମ୍ପାଦନ କରନ୍ତୁ।
