ShortDescription: "Na open source screenshot annotator wey dey for Windows. Capture, crop, mark am with arrow, callout, blur, and OCR. No account, no ads, no cloud."
Description: |-
  Screenshot Annotator dey turn messy screen grab to clear explanation for seconds. Press Print Screen, crop wetin matter, mark am, and share. Na open source. Your screenshots go stay for this PC. No account. No ads. No cloud.
  
  Capture dey one key away. Print Screen dey work even if di app dey background or e don minimize. Crop di area, then point, explain, hide, and polish.
  
  Make di picture talk
  
  - Arrows wey you fit customize wey dey point di exact spot
  - Speech-bubble callouts with text wey you fit edit
  - Notes and bordered rectangles to frame wetin matter
  - Highlighter wey you fit change di color
  - Blur and white-out for passwords, names, and private data
  - Vertical and horizontal cuts to remove empty space
  - Copy, paste, import, and export PNG, JPEG, or WebP
  
  Comot text from di screen
  
  Select one area and comot text with di Windows OCR wey dey inside. You no need extra software. If you don dey use Tesseract, dat engine dey supported too. Edit di result, copy am, and move on.
  
  Stay for flow
  
  Projects dey save by demself with preview thumbnails, so you fit jump back to yesterday bug report or today how-to. Drag images enter. Copy di finished picture go clipboard. Start with Windows so capture dey ready after you sign in. Di workspace dark, fast, and e dey for 57 languages.
  
  Your screenshots na your own
  
  Na open source desktop tool be dis. Annotated projects dey live for your Pictures folder. Settings dey stay for this computer. Nothing dey upload. You fit check how e dey work. Use am for bug reports, documentation, reviews, support tickets, and every "look this" moment.
  
  Di work dey serious. Di tool dey fun. Friendly cats dey show now and then.
  
  - Press Print Screen or di button for di app to capture, even if di app dey background.
  - Crop di interesting part for one move, then annotate sharp sharp.
  - Draw arrows wey you fit customize wey dey point people to di exact spot.
  - Add speech-bubble callouts with text wey you fit edit and wey dey easy to read.
  - Drop notes and bordered rectangles to explain or frame any area.
  - Highlight wetin matter with highlighter wey you fit change di color.
  - Blur passwords, names, and anything wey you no suppose share.
  - White out one selected area, or copy only dat slice go clipboard.
  - Cut empty vertical or horizontal strips so di screenshot go stay compact.
  - Comot text from selection with Windows OCR wey dey inside. Tesseract na optional.
  - Copy and paste screenshots and shapes. Drag and drop images enter project.
  - Export PNG, JPEG, or WebP. PNG go also save beside di project.
  - Projects dey auto-save with preview thumbnails so you fit jump back quick.
  - Start with Windows and keep Print Screen capture ready after you sign in.
  - Open source. No ads, no analytics, no account. Screenshots dey stay for this computer.
  - Dark, focused workspace with scrollbars for large screenshots.
  - Tune font, color, size, bold, and italic for notes, callouts, and arrows.
  - Select, move, and edit annotations until di picture tell di story.
