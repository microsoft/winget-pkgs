ShortDescription: "ونڊوز لاءِ کليل ذريعو اسڪرين شاٽ وضاحت ڪندڙ. ڪيپچر ڪريو، ڪراپ ڪريو، ۽ تيرن، ڪال آئوٽ، بلر ۽ OCR سان نشان لڳايو. ڪو کاتو نه، اشتهار نه، ڪلائوڊ نه."
Description: |-
  Screenshot Annotator هڪ اٽيل اسڪرين شاٽ کي سيڪنڊن ۾ واضح وضاحت بڻائي ٿو. Print Screen دٻايو، جيڪو ضروري آهي اهو ڪراپ ڪريو، نشان لڳايو، ۽ شيئر ڪريو. هي کليل ذريعو آهي. توهان جا اسڪرين شاٽ هن PC تي ئي رهن ٿا. ڪو کاتو نه. ڪي اشتهار نه. ڪو ڪلائوڊ نه.
  
  ڪيپچر هميشه هڪ ڪنجي پري آهي. Print Screen تڏهن به ڪم ڪري ٿو جڏهن ايپ پسمنظر ۾ هجي يا ننڍي ڪيل هجي. علائقو ڪراپ ڪريو، پوءِ ڏيکاريو، سمجهايو، لڪايو، ۽ سينگاريو.
  
  تصوير کي ڳالهائڻ ڏيو
  
  - ترتيب ڏيڻ جهڙا تير جيڪي بلڪل جاءِ ڏانهن اشارو ڪن
  - ڳالهائڻ جا بلبل جن ۾ سنوارڻ جوڳو متن هجي
  - نوٽ ۽ ڪناري وارا مستطيل جيڪي ضروري شيءِ کي فريم ڪن
  - هاءِ لائٽر جنهن جو رنگ توهان بدلائي سگهو
  - پاسورڊ، نالن، ۽ نجي ڊيٽا لاءِ بلر ۽ اڇو ڪرڻ
  - خالي جاءِ هٽائڻ لاءِ عمودي ۽ افقي ڪٽ
  - PNG، JPEG، يا WebP ڪاپي، پيسٽ، درآمد، ۽ برآمد
  
  اسڪرين تان متن ڪڍو
  
  علائقو چونڊيو ۽ اندروني Windows OCR سان متن ڪڍو. اضافي سافٽ ويئر جي ضرورت ناهي. جيڪڏهن توهان اڳ ۾ Tesseract استعمال ڪريو ٿا، اهو انجن به سهارو ڏئي ٿو. نتيجو سنواريو، ڪاپي ڪريو، ۽ اڳتي وڌو.
  
  وهڪري ۾ رهو
  
  منصوبا پاڻمرادو ننڍين تصويرن سان محفوظ ٿين ٿا، تنهنڪري توهان ڪالهه جي بگ رپورٽ يا اڄ جي رهنمائي ڏانهن فوري موٽي سگهو ٿا. تصويرون ڇڪي آڻيو. مڪمل تصوير ڪلپ بورڊ تي ڪاپي ڪريو. ونڊوز سان شروع ڪريو ته سائن ان کان پوءِ ڪيپچر تيار هجي. ڪم جي جاءِ اونداهي، تيز، ۽ 57 ٻولين ۾ آهي.
  
  توهان جا اسڪرين شاٽ توهان جا آهن
  
  هي کليل ذريعو ڊيسڪ ٽاپ اوزار آهي. نشان لڳل منصوبا توهان جي Pictures فولڊر ۾ رهن ٿا. سيٽنگون هن ڪمپيوٽر تي ئي رهن ٿيون. ڪجهه به اپ لوڊ نٿو ٿئي. توهان ڏسي سگهو ٿا ته اهو ڪيئن ڪم ڪري ٿو. ان کي بگ رپورٽن، دستاويزن، جائزن، مدد جي ٽڪٽن، ۽ هر "هي ڏسو" لمحي لاءِ استعمال ڪريو.
  
  ڪم سنجيده رهي ٿو. اوزار مزيدار رهي ٿو. دوستاڻيون ٻليون ڪڏهن ڪڏهن ظاهر ٿين ٿيون.
  
  - Print Screen يا ايپ جي بٽڻ سان ڪيپچر ڪريو، ايپ پسمنظر ۾ هجي تڏهن به.
  - دلچسپ حصو هڪ حرڪت ۾ ڪراپ ڪريو، پوءِ فوري نشان لڳايو.
  - اهڙا تير ٺاهيو جيڪي ماڻهن کي بلڪل جاءِ ڏانهن اشارو ڪن ۽ ترتيب ڏئي سگهجن.
  - ڳالهائڻ جا بلبل شامل ڪريو جن ۾ سنوارڻ جوڳو ۽ پڙهڻ جهڙو متن هجي.
  - نوٽ ۽ ڪناري وارا مستطيل رکو ته ڪنهن به علائقي کي سمجهايو يا فريم ڪريو.
  - هاءِ لائٽر سان ضروري شيءِ اجاگر ڪريو، جنهن جو رنگ توهان بدلائي سگهو.
  - پاسورڊ، نالا، ۽ جيڪو شيئر نه ڪرڻ گهرجي اهو بلر ڪريو.
  - چونڊيل علائقو اڇو ڪريو، يا رڳو اهو ٽڪرو ڪلپ بورڊ تي ڪاپي ڪريو.
  - خالي عمودي يا افقي پٽيون ڪٽيو ته اسڪرين شاٽ سُڌو رهي.
  - چونڊ مان متن اندروني Windows OCR سان ڪڍو. Tesseract اختياري آهي.
  - اسڪرين شاٽ ۽ شڪليون ڪاپي ۽ پيسٽ ڪريو. تصويرون منصوبي ۾ ڇڪي آڻيو.
  - PNG، JPEG، يا WebP برآمد ڪريو. PNG منصوبي جي ڀرسان به محفوظ ٿئي ٿو.
  - منصوبا ننڍين تصويرن سان پاڻمرادو محفوظ ٿين ٿا، تنهنڪري فوري موٽي سگهو ٿا.
  - ونڊوز سان شروع ڪريو ته سائن ان کان پوءِ Print Screen تيار رهي.
  - کليل ذريعو. اشتهار نه، تجزيو نه، کاتو نه. اسڪرين شاٽ هن ڪمپيوٽر تي رهن ٿا.
  - وڏن اسڪرين شاٽن لاءِ اسڪرول بارن سان اونداهي، مرڪوز ڪم جي جاءِ.
  - نوٽن، ڪال آئوٽن، ۽ تيرن جو فونٽ، رنگ، ماپ، ٿلهو، ۽ ترڇو ترتيب ڏيو.
  - نشان چونڊيو، هلايو، ۽ سنواريو جيستائين تصوير ڪهاڻي ٻڌائي.
