ShortDescription: "Windows का लागि ओपन सोर्स स्क्रिनसट मार्कअप एप। क्याप्चर गर्नुहोस्, क्रप गर्नुहोस्, बाण, कलआउट, ब्लर र OCR ले चिन्ह लगाउनुहोस्। खाता छैन, विज्ञापन छैन, क्लाउड छैन।"
Description: |-
  Screenshot Annotator अस्तव्यस्त स्क्रिन ग्र्याबलाई सेकेन्डमै स्पष्ट व्याख्यामा बदल्छ। Print Screen थिच्नुहोस्, चाहिने भाग काट्नुहोस्, मार्क गर्नुहोस् र सेयर गर्नुहोस्। यो ओपन सोर्स हो। तपाईंका स्क्रिनसट यही PC मा रहन्छन्। खाता छैन। विज्ञापन छैन। क्लाउड छैन।
  
  क्याप्चर सधैं एक की टाढा छ। एप पृष्ठभूमिमा वा मिनिमाइज हुँदा पनि Print Screen काम गर्छ। क्षेत्र काट्नुहोस्, अनि देखाउनुहोस्, व्याख्या गर्नुहोस्, लुकाउनुहोस् र सफा गर्नुहोस्।
  
  तस्बिरलाई नै बोल्न दिनुहोस्
  
  - ठ्याक्कै त्यो ठाउँ देखाउने अनुकूल बाण
  - सम्पादनयोग्य पाठसहित स्पीच-बबल कलआउट
  - महत्त्वपूर्ण कुरा फ्रेम गर्न नोट र किनारा भएका आयत
  - फेरि रङ फेर्न मिल्ने हाइलाइटर
  - पासवर्ड, नाम र निजी डाटाका लागि ब्लर र ह्वाइट-आउट
  - खाली ठाउँ हटाउन ठाडो र तेर्सो कट
  - PNG, JPEG वा WebP कपी, पेस्ट, आयात र निर्यात
  
  स्क्रिनबाट पाठ निकाल्नुहोस्
  
  एउटा क्षेत्र चयन गरेर अन्तर्निहित Windows OCR ले पाठ निकाल्नुहोस्। अतिरिक्त सफ्टवेयर चाहिँदैन। तपाईं पहिले नै Tesseract प्रयोग गर्नुहुन्छ भने त्यो इन्जिन पनि समर्थित छ। नतिजा सम्पादन गर्नुहोस्, कपी गर्नुहोस्, अघि बढ्नुहोस्।
  
  प्रवाहमा रहनुहोस्
  
  परियोजना पूर्वावलोकन थम्बनेलसहित स्वतः बचत हुन्छन्, त्यसैले हिजोको बग रिपोर्ट वा आजको हाउ-टुमा तुरुन्त फर्कन सकिन्छ। तस्बिर तानेर राख्नुहोस्। सकिएको तस्बिर क्लिपबोर्डमा कपी गर्नुहोस्। Windows सँग सुरु गर्नुहोस् ताकि साइन इनपछि क्याप्चर कुरिरहोस्। कार्यक्षेत्र अँध्यारो, छिटो र 57 भाषामा उपलब्ध छ।
  
  स्क्रिनसट तपाईंकै हुन्
  
  यो ओपन सोर्स डेस्कटप उपकरण हो। एनोटेट परियोजना तपाईंको Pictures फोल्डरमा रहन्छन्। सेटिङ यही कम्प्युटरमा रहन्छन्। केही अपलोड हुँदैन। यो कसरी काम गर्छ तपाईं हेर्न सक्नुहुन्छ। बग रिपोर्ट, कागजात, समीक्षा, सपोर्ट टिकट र हरेक "यो हेर" क्षणमा प्रयोग गर्नुहोस्।
  
  काम गम्भीर रहन्छ। उपकरण मज्जाको रहन्छ। मिलनसार बिराला कहिलेकाहीं देखिन्छन्।
  
  - एप पृष्ठभूमिमा हुँदा पनि Print Screen वा एपको बटनले क्याप्चर गर्नुहोस्।
  - एकै चालमा चाहिने भाग काट्नुहोस्, अनि तुरुन्त मार्क गर्नुहोस्।
  - ठ्याक्कै त्यो ठाउँ देखाउने अनुकूल बाण कोर्नुहोस्।
  - पढ्न मिल्ने सम्पादनयोग्य पाठसहित स्पीच-बबल कलआउट थप्नुहोस्।
  - कुनै पनि क्षेत्र व्याख्या वा फ्रेम गर्न नोट र किनारा भएका आयत राख्नुहोस्।
  - फेरि रङ फेर्न मिल्ने हाइलाइटरले महत्त्वपूर्ण कुरा चिन्ह लगाउनुहोस्।
  - पासवर्ड, नाम र बाँड्नु नहुने कुरा ब्लर गर्नुहोस्।
  - चयन गरिएको क्षेत्र सेतो पार्नुहोस्, वा त्यो टुक्रा मात्र क्लिपबोर्डमा कपी गर्नुहोस्।
  - खाली ठाडो वा तेर्सो पट्टी काटेर स्क्रिनसट छोटो राख्नुहोस्।
  - अन्तर्निहित Windows OCR ले चयनबाट पाठ निकाल्नुहोस्। वैकल्पिक Tesseract।
  - स्क्रिनसट र आकार कपी-पेस्ट गर्नुहोस्। परियोजनामा तस्बिर तानेर राख्नुहोस्।
  - PNG, JPEG वा WebP निर्यात गर्नुहोस्। परियोजना छेउमा PNG पनि बचत हुन्छ।
  - परियोजना पूर्वावलोकन थम्बनेलसहित स्वतः बचत हुन्छन्, तुरुन्त फर्कन सकिन्छ।
  - Windows सँग सुरु गर्नुहोस्, साइन इनपछि Print Screen क्याप्चर तयार रहोस्।
  - ओपन सोर्स। विज्ञापन छैन, एनालिटिक्स छैन, खाता छैन। स्क्रिनसट यही कम्प्युटरमा रहन्छन्।
  - ठूला स्क्रिनसटका लागि स्क्रोलबारसहित अँध्यारो, केन्द्रित कार्यक्षेत्र।
  - नोट, कलआउट र बाणमा फन्ट, रङ, आकार, बोल्ड र इटालिक मिलाउनुहोस्।
  - तस्बिरले कथा नभनेसम्म एनोटेसन चयन गर्नुहोस्, सार्नुहोस् र सम्पादन गर्नुहोस्।
