ShortDescription: "Quelloffener Screenshot-Annotator für Windows. Aufnehmen, zuschneiden und mit Pfeilen, Sprechblasen, Unschärfe und OCR markieren. Kein Konto, keine Werbung, keine Cloud."
Description: |-
  Screenshot Annotator macht aus einem unübersichtlichen Bildschirmfoto in Sekunden eine klare Erklärung. Print Screen drücken, das Wichtige zuschneiden, markieren und teilen. Die App ist Open Source. Ihre Screenshots bleiben auf diesem PC. Kein Konto. Keine Werbung. Keine Cloud.
  
  Die Aufnahme ist immer nur eine Taste entfernt. Print Screen funktioniert auch, wenn die App im Hintergrund oder minimiert ist. Den Bereich zuschneiden, dann zeigen, erklären, verbergen und glätten.
  
  Das Bild spricht für sich
  
  - Anpassbare Pfeile, die genau auf die richtige Stelle zeigen
  - Sprechblasen mit bearbeitbarem Text
  - Notizen und Rahmen, um Wichtiges einzurahmen
  - Ein Hervorheben-Stift, den Sie umfärben können
  - Unschärfe und Weißabdeckung für Passwörter, Namen und private Daten
  - Vertikale und horizontale Schnitte, um leeren Raum zu entfernen
  - Kopieren, Einfügen, Importieren und Exportieren als PNG, JPEG oder WebP
  
  Text vom Bildschirm holen
  
  Einen Bereich auswählen und Text mit integriertem Windows OCR extrahieren. Keine Zusatzsoftware nötig. Wenn Sie bereits Tesseract nutzen, wird diese Engine ebenfalls unterstützt. Das Ergebnis bearbeiten, kopieren und weiterarbeiten.
  
  Im Fluss bleiben
  
  Projekte speichern automatisch mit Vorschaubildern, sodass Sie zum Fehlerbericht von gestern oder zur Anleitung von heute zurückspringen können. Bilder hineinziehen. Das fertige Bild in die Zwischenablage kopieren. Mit Windows starten, damit die Aufnahme nach der Anmeldung bereitsteht. Der Arbeitsbereich ist dunkel, schnell und in 57 Sprachen verfügbar.
  
  Ihre Screenshots gehören Ihnen
  
  Das ist ein quelloffenes Desktop-Tool. Annotierte Projekte liegen in Ihrem Bilder-Ordner. Einstellungen bleiben auf diesem Computer. Nichts wird hochgeladen. Sie können nachschauen, wie es funktioniert. Nutzen Sie es für Fehlerberichte, Dokumentation, Reviews, Support-Tickets und jeden „schau mal“-Moment.
  
  Die Arbeit bleibt ernst. Das Werkzeug bleibt unterhaltsam. Freundliche Katzen schauen ab und zu vorbei.
  
  - Mit Print Screen oder der Schaltfläche in der App aufnehmen – auch wenn die App im Hintergrund läuft.
  - Den relevanten Bereich in einer Bewegung zuschneiden und sofort annotieren.
  - Anpassbare Pfeile zeichnen, die genau auf die richtige Stelle zeigen.
  - Sprechblasen mit bearbeitbarem Text hinzufügen, der gut lesbar bleibt.
  - Notizen und Rahmen setzen, um Bereiche zu erklären oder einzurahmen.
  - Wichtiges mit einem Hervorheben-Stift markieren, den Sie umfärben können.
  - Passwörter, Namen und alles, was nicht geteilt werden sollte, unscharf machen.
  - Einen Bereich weiß überdecken oder nur diesen Ausschnitt in die Zwischenablage kopieren.
  - Leere vertikale oder horizontale Streifen entfernen, damit der Screenshot kompakt bleibt.
  - Text aus einer Auswahl mit integriertem Windows OCR extrahieren. Optional Tesseract.
  - Screenshots und Formen kopieren und einfügen. Bilder per Drag-and-Drop ins Projekt ziehen.
  - Als PNG, JPEG oder WebP exportieren. Ein PNG wird zusätzlich neben dem Projekt gespeichert.
  - Projekte speichern automatisch mit Vorschaubildern, damit Sie sofort weitermachen können.
  - Mit Windows starten und Print Screen nach der Anmeldung sofort nutzen.
  - Open Source. Keine Werbung, keine Analyse, kein Konto. Screenshots bleiben auf diesem Computer.
  - Dunkler, fokussierter Arbeitsbereich mit Bildlaufleisten für große Screenshots.
  - Schrift, Farben, Größe, Fett und Kursiv an Notizen, Sprechblasen und Pfeilen anpassen.
  - Annotationen auswählen, verschieben und bearbeiten, bis das Bild die Geschichte erzählt.
