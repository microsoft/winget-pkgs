ShortDescription: "Anotador de capturas de pantalla de código abierto para Windows. Captura, recorta y marca con flechas, llamadas, desenfoque y OCR. Sin cuenta, sin anuncios, sin nube."
Description: |-
  Screenshot Annotator convierte una captura desordenada en una explicación clara en segundos. Pulsa Print Screen, recorta lo importante, márcalo y comparte. Es de código abierto. Tus capturas se quedan en este PC. Sin cuenta. Sin anuncios. Sin nube.
  
  La captura está siempre a una tecla. Print Screen funciona aunque la app esté en segundo plano o minimizada. Recorta la zona, luego señala, explica, oculta y pule.
  
  Que hable la imagen
  
  - Flechas personalizables que apuntan al punto exacto
  - Llamadas en bocadillo con texto editable
  - Notas y rectángulos con borde para enmarcar lo importante
  - Un rotulador que puedes recolorear
  - Difuminado y blanco para contraseñas, nombres y datos privados
  - Cortes verticales y horizontales para quitar el espacio vacío
  - Copiar, pegar, importar y exportar PNG, JPEG o WebP
  
  Saca el texto de la pantalla
  
  Selecciona un área y extrae texto con el OCR de Windows integrado. No hace falta software extra. Si ya usas Tesseract, ese motor también está admitido. Edita el resultado, cópialo y sigue.
  
  Sigue el ritmo
  
  Los proyectos se guardan automáticamente con miniaturas, para volver al informe de error de ayer o a la guía de hoy. Arrastra imágenes. Copia la imagen terminada al portapapeles. Inicia con Windows para que la captura esté lista al iniciar sesión. El espacio de trabajo es oscuro, rápido y está disponible en 57 idiomas.
  
  Tus capturas son tuyas
  
  Es una herramienta de escritorio de código abierto. Los proyectos anotados viven en tu carpeta Imágenes. Los ajustes se quedan en este equipo. No se sube nada. Puedes ver cómo funciona. Úsala para informes de errores, documentación, reseñas, tickets de soporte y cada momento de «mira esto».
  
  El trabajo sigue siendo serio. La herramienta sigue siendo divertida. De vez en cuando aparecen gatos amistosos.
  
  - Pulsa Print Screen o el botón de la app para capturar, incluso si la app está en segundo plano.
  - Recorta la zona interesante de un gesto y anota al momento.
  - Dibuja flechas personalizables que señalan exactamente el punto.
  - Añade llamadas en forma de bocadillo con texto editable y siempre legible.
  - Coloca notas y rectángulos con borde para explicar o enmarcar cualquier zona.
  - Resalta lo importante con un rotulador que puedes recolorear.
  - Difumina contraseñas, nombres y todo lo que no debas compartir.
  - Blanquea un área seleccionada, o copia solo ese recorte al portapapeles.
  - Corta franjas vacías verticales u horizontales para que la captura siga compacta.
  - Extrae texto de una selección con el OCR de Windows integrado. Tesseract opcional.
  - Copia y pega capturas y formas. Arrastra imágenes a un proyecto.
  - Exporta PNG, JPEG o WebP. También se guarda un PNG junto al proyecto.
  - Los proyectos se guardan solos, con miniaturas, para volver en un instante.
  - Inicia con Windows y deja Print Screen listo tras iniciar sesión.
  - Open source. Sin anuncios, sin analítica, sin cuenta. Las capturas se quedan en este equipo.
  - Espacio de trabajo oscuro y centrado, con barras de desplazamiento para capturas grandes.
  - Ajusta fuentes, colores, tamaño, negrita y cursiva en notas, llamadas y flechas.
  - Selecciona, mueve y edita las anotaciones hasta que la imagen cuente la historia.
