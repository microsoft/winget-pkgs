ShortDescription: "Open source nga screenshot annotator para sa Windows. Kuhaa, i-crop, ug markahi gamit ang mga udyong, callout, blur, ug OCR. Walay account, walay ads, walay cloud."
Description: |-
  Screenshot Annotator maghimo sa gubot nga kuha sa screen nga tin-aw nga pasabot sulod sa pipila ka segundo. Pindota ang Print Screen, i-crop ang importante, markahi, ug i-share. Open source kini. Ang imong mga screenshot magpabilin niini nga PC. Walay account. Walay ads. Walay cloud.
  
  Ang pagkuha usa ra ka key. Ang Print Screen molihok bisan ang app anaa sa background o naka-minimize. I-crop ang bahin, dayon itudlo, ipasabot, tagoa, ug pahimutanga.
  
  Pahimoa nga ang hulagway maoy mosulti
  
  - Mga udyong nga mapa-customize nga motudlo sa eksaktong lugar
  - Mga speech-bubble callout nga adunay teksto nga ma-edit
  - Mga nota ug rectangle nga adunay border aron i-frame ang importante
  - Highlighter nga mahimo nimong usbon ang kolor
  - Blur ug white-out para sa mga password, ngalan, ug pribadong datos
  - Bertikal ug horizontal nga pagputol aron tangtangon ang walay sulod nga luna
  - Kopyaha, i-paste, i-import, ug i-export ang PNG, JPEG, o WebP
  
  Kuhaa ang teksto gikan sa screen
  
  Pagpili og lugar ug kuhaa ang teksto gamit ang built-in nga Windows OCR. Dili na kinahanglan pa og laing software. Kung naggamit ka na og Tesseract, suportado usab kana nga engine. I-edit ang resulta, kopyaha, ug padayon.
  
  Magpabilin sa dagan
  
  Ang mga proyekto mag-save sa ilang kaugalingon uban ang preview thumbnail, aron makabalik ka sa bug report kagahapon o sa how-to karong adlawa. I-drag ang mga hulagway. Kopyaha ang nahuman nga hulagway ngadto sa clipboard. Sugdi uban sa Windows aron andam na ang pagkuha human ka mo-sign in. Ang workspace ngitngit, paspas, ug anaa sa 57 ka pinulongan.
  
  Imo ang imong mga screenshot
  
  Kini usa ka open source nga desktop tool. Ang mga proyekto nga na-annotate anaa sa imong Pictures folder. Ang mga setting magpabilin niini nga kompyuter. Walay gi-upload. Mahimo nimong susihon kung giunsa kini molihok. Gamita kini para sa mga bug report, dokumentasyon, review, support ticket, ug sa matag "tan-awa ni".
  
  Ang trabaho magpabiling seryoso. Ang himan magpabiling malipayon. Ang mahigalaong mga iring mopakita panagsa.
  
  - Pindota ang Print Screen o ang buton sa app aron mokuha, bisan anaa ang app sa background.
  - I-crop ang makapaikag nga bahin sa usa ka lihok, dayon i-annotate dayon.
  - Pagdibuho og mapa-customize nga mga udyong nga motudlo sa eksaktong lugar.
  - Idugang ang speech-bubble callout nga adunay ma-edit nga teksto nga magpabiling mabasa.
  - Ibutang ang mga nota ug bordered rectangle aron ipasabot o i-frame ang bisan unsang lugar.
  - I-highlight ang importante gamit ang highlighter nga mahimo nimong usbon ang kolor.
  - I-blur ang mga password, ngalan, ug bisan unsa nga dili angay i-share.
  - I-white out ang napiling lugar, o kopyaha lang kana nga hiwa ngadto sa clipboard.
  - Putla ang walay sulod nga bertikal o horizontal nga mga strip aron magpabiling compact ang screenshot.
  - Kuhaa ang teksto gikan sa pinili gamit ang built-in nga Windows OCR. Opsyonal ang Tesseract.
  - Kopyaha ug i-paste ang mga screenshot ug mga porma. I-drag ug i-drop ang mga hulagway ngadto sa proyekto.
  - I-export ang PNG, JPEG, o WebP. Usa ka PNG ang ma-save usab tupad sa proyekto.
  - Ang mga proyekto mag-auto-save uban ang preview thumbnail aron makabalik ka dayon.
  - Sugdi uban sa Windows ug ipadayon nga andam ang Print Screen human ka mo-sign in.
  - Open source. Walay ads, walay analytics, walay account. Ang mga screenshot magpabilin niini nga kompyuter.
  - Ngitngit, nakatutok nga workspace nga adunay scrollbar para sa dagkong screenshot.
  - I-adjust ang font, kolor, gidak-on, bold, ug italic sa mga nota, callout, ug udyong.
  - Pagpili, ibalhin, ug i-edit ang mga annotation hangtod ang hulagway mosulti sa istorya.
