ShortDescription: "面向 Windows 的开源截图标注工具。拍摄、裁剪，用箭头、标注、模糊和 OCR 做标记。无需账户，无广告，无云端。"
Description: |-
  Screenshot Annotator 能在几秒内，把杂乱的屏幕截图变成清楚的说明。按下 Print Screen，裁出重点，做好标记，然后分享。它是开源的。截图留在这台 PC 上。无需账户。无广告。无云端。
  
  截图始终只需一键。即使应用在后台或已最小化，Print Screen 依然可用。裁出区域，再指向、说明、隐藏、打磨。
  
  让画面自己把话说完
  
  - 精确指向目标位置的可自定义箭头
  - 带可编辑文字的气泡标注
  - 用来框出重点的备注和带边框矩形
  - 可改色的荧光笔
  - 用模糊和涂白遮住密码、姓名和隐私信息
  - 用纵向和横向裁切去掉空白
  - 复制、粘贴、导入，以及导出 PNG、JPEG 或 WebP
  
  从屏幕上取出文字
  
  选中区域，用内置 Windows OCR 提取文字。无需额外软件。如果你已经在用 Tesseract，也可以选用该引擎。编辑结果，复制，然后继续。
  
  保持流畅
  
  项目会自动保存并附带预览缩略图，昨天的缺陷报告或今天的操作说明都能立刻跳回。把图片拖进来。把完成的画面复制到剪贴板。随 Windows 启动，登录后截图功能已在等候。工作区深色、轻快，并提供 57 种语言。
  
  截图属于你
  
  这是一款开源桌面工具。标注项目保存在图片文件夹中。设置留在这台电脑上。不会上传任何内容。你可以检查它如何工作。用于缺陷报告、文档、评测、支持工单，以及每一次「你看这个」的瞬间。
  
  工作认真。工具有趣。友好的猫咪偶尔会露面。
  
  - 按 Print Screen 或应用内按钮即可截图，即使应用在后台也没问题。
  - 一气呵成裁出关键区域，然后立刻开始标注。
  - 绘制可自定义的箭头，精确指向要看的位置。
  - 添加带可编辑文字的气泡标注，始终清晰易读。
  - 放下备注和带边框的矩形，用来说明或框出任意区域。
  - 用可改色的荧光笔突出真正重要的内容。
  - 模糊密码、姓名以及不该分享的任何信息。
  - 将选中区域涂白，或只把那一块复制到剪贴板。
  - 裁掉空白的纵向或横向条带，让截图保持紧凑。
  - 用内置 Windows OCR 从选区提取文字。也可选用 Tesseract。
  - 复制粘贴截图和图形。将图片拖放到项目中。
  - 导出 PNG、JPEG 或 WebP。项目旁边还会保存一份 PNG。
  - 项目自动保存并带预览缩略图，可立刻跳回继续。
  - 随 Windows 启动，登录后 Print Screen 截图随时可用。
  - 开源。无广告、无分析、无需账户。截图留在这台 PC 上。
  - 深色、专注的工作区，带滚动条，适合处理大截图。
  - 调整备注、气泡和箭头的字体、颜色、大小、粗体和斜体。
  - 选择、移动并编辑标注，直到画面把故事讲清楚。
