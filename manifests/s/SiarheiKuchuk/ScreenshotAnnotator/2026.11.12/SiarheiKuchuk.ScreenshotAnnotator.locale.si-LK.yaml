ShortDescription: "Windows සඳහා විවෘත මූලාශ්‍ර තිර රූප සටහන් යෙදුම. ග්‍රහණය කරන්න, කපන්න, ඊතල, කෝල්අවුට්, බොඳ කිරීම සහ OCR එකින් සලකුණු කරන්න. ගිණුමක් නැත, දැන්වීම් නැත, ක්ලවුඩ් නැත."
Description: |-
  Screenshot Annotator අවුල් සහගත තිර ග්‍රහණයක් තත්පර කිහිපයකින් පැහැදිලි විස්තරයක් බවට පත් කරයි. Print Screen ඔබන්න, වැදගත් කොටස කපන්න, සලකුණු කරන්න, බෙදා ගන්න. එය විවෘත මූලාශ්‍රයකි. ඔබේ තිර රූප මෙම PC එකේම රැඳේ. ගිණුමක් නැත. දැන්වීම් නැත. ක්ලවුඩ් නැත.
  
  ග්‍රහණය සැමවිටම එක් යතුරක් දුරින්ය. යෙදුම පසුබිමේ හෝ හකුළුවා තිබියදීත් Print Screen ක්‍රියා කරයි. ප්‍රදේශය කපන්න, පසුව පෙන්වන්න, පැහැදිලි කරන්න, සඟවන්න සහ පිරිසිදු කරන්න.
  
  රූපයටම කතා කිරීමට ඉඩ දෙන්න
  
  - හරියටම එම ස්ථානයට යොමු කරන අභිරුචි ඊතල
  - සංස්කරණය කළ හැකි පෙළ සහිත කථන-බුබුලු කෝල්අවුට්
  - වැදගත් දේ රාමු කිරීමට සටහන් සහ දාර සහිත සෘජුකෝණ
  - නැවත වර්ණ ගැන්විය හැකි හයිලයිටරය
  - මුරපද, නම් සහ පෞද්ගලික දත්ත සඳහා බොඳ කිරීම සහ සුදු කිරීම
  - හිස් ඉඩ ඉවත් කිරීමට සිරස් සහ තිරස් කැපීම්
  - PNG, JPEG හෝ WebP පිටපත්, අලවීම, ආනයනය සහ අපනයනය
  
  තිරයෙන් පෙළ ගන්න
  
  ප්‍රදේශයක් තෝරා බිල්ට්-ඉන් Windows OCR එකින් පෙළ උපුටා ගන්න. අමතර මෘදුකාංග අවශ්‍ය නැත. ඔබ දැනටමත් Tesseract භාවිතා කරන්නේ නම්, එම එන්ජිමද සහාය දක්වයි. ප්‍රතිඵලය සංස්කරණය කරන්න, පිටපත් කරන්න, ඉදිරියට යන්න.
  
  ගලා යාමේ රැඳෙන්න
  
  ව්‍යාපෘති පෙරදසුන් සිඟිති රූ සමඟ ස්වයංක්‍රීයව සුරැකේ, එබැවින් ඊයේ දෝෂ වාර්තාවට හෝ අද මාර්ගෝපදේශයට ක්ෂණිකව ආපසු යන්න. රූප ඇද දමන්න. අවසන් රූපය ක්ලිප්බෝඩ් වෙත පිටපත් කරන්න. Windows සමඟ ආරම්භ කරන්න, පුරනය වූ පසු ග්‍රහණය බලා සිටී. වැඩබිම අඳුරු, වේගවත් සහ භාෂා 57 කින් ලබා ගත හැක.
  
  තිර රූප ඔබේය
  
  මෙය විවෘත මූලාශ්‍ර ඩෙස්ක්ටොප් මෙවලමකි. සටහන් කළ ව්‍යාපෘති ඔබේ Pictures ෆෝල්ඩරයේ රැඳේ. සැකසුම් මෙම පරිගණකයේම රැඳේ. කිසිවක් උඩුගත නොවේ. එය ක්‍රියා කරන ආකාරය ඔබට පරීක්ෂා කළ හැක. දෝෂ වාර්තා, ලේඛන, සමාලෝචන, සහාය ටිකට් සහ සෑම "මෙය බලන්න" අවස්ථාවකට භාවිතා කරන්න.
  
  වැඩ බැරෑරුම්ව තබයි. මෙවලම විනෝදජනකව තබයි. මිත්‍රශීලී බළලුන් අතරින් අතරට පෙනී සිටී.
  
  - යෙදුම පසුබිමේ තිබියදීත් Print Screen හෝ යෙදුමේ බොත්තමෙන් ග්‍රහණය කරන්න.
  - එකම චලනයකින් අවශ්‍ය කොටස කපා, එවිටම සලකුණු කරන්න.
  - හරියටම එම ස්ථානයට යොමු කරන අභිරුචි ඊතල අඳින්න.
  - කියවිය හැකි සංස්කරණය කළ හැකි පෙළ සහිත කථන-බුබුලු කෝල්අවුට් එක් කරන්න.
  - ඕනෑම ප්‍රදේශයක් පැහැදිලි කිරීමට හෝ රාමු කිරීමට සටහන් සහ දාර සහිත සෘජුකෝණ දමන්න.
  - නැවත වර්ණ ගැන්විය හැකි හයිලයිටරයෙන් වැදගත් දේ උද්දීපනය කරන්න.
  - මුරපද, නම් සහ බෙදා නොගත යුතු දේ බොඳ කරන්න.
  - තෝරාගත් ප්‍රදේශය සුදු කරන්න, නැතහොත් එම කැබැල්ල පමණක් ක්ලිප්බෝඩ් වෙත පිටපත් කරන්න.
  - හිස් සිරස් හෝ තිරස් තීරු කපා තිර රූපය සංයුක්තව තබන්න.
  - බිල්ට්-ඉන් Windows OCR එකින් තේරීමෙන් පෙළ උපුටා ගන්න. විකල්ප Tesseract.
  - තිර රූප සහ හැඩ පිටපත් කර අලවන්න. ව්‍යාපෘතියට රූප ඇද දමන්න.
  - PNG, JPEG හෝ WebP අපනයනය කරන්න. ව්‍යාපෘතිය අසල PNG එකක් ද සුරැකේ.
  - ව්‍යාපෘති පෙරදසුන් සිඟිති රූ සමඟ ස්වයං-සුරැකේ, එබැවින් ක්ෂණිකව ආපසු යන්න.
  - Windows සමඟ ආරම්භ කරන්න, පුරනය වූ පසු Print Screen ග්‍රහණය සූදානම්ව තබන්න.
  - විවෘත මූලාශ්‍රය. දැන්වීම් නැත, විශ්ලේෂණ නැත, ගිණුමක් නැත. තිර රූප මෙම පරිගණකයේම රැඳේ.
  - විශාල තිර රූප සඳහා ස්ක්‍රෝල්බාර් සහිත අඳුරු, අවධානය යොමු කළ වැඩබිම.
  - සටහන්, කෝල්අවුට් සහ ඊතල මත අකුරු, වර්ණ, ප්‍රමාණය, තද සහ ඇලකුරු සකසන්න.
  - රූපය කතාව කියන තෙක් සටහන් තෝරන්න, ගෙන යන්න සහ සංස්කරණය කරන්න.
