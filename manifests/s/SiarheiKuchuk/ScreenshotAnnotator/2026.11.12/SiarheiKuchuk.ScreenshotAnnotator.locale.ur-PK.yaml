ShortDescription: "Windows کے لیے اوپن سورس اسکرین شاٹ نشان زن۔ کیپچر کریں، کراپ کریں، تیروں، کال آؤٹ، دھندلا پن اور OCR سے نشان لگائیں۔ کوئی اکاؤنٹ نہیں، اشتہار نہیں، کلاؤڈ نہیں۔"
Description: |-
  Screenshot Annotator بے ترتیب اسکرین شاٹ کو چند سیکنڈ میں واضح وضاحت بنا دیتا ہے۔ Print Screen دبائیں، جو اہم ہے کراپ کریں، نشان لگائیں اور شیئر کریں۔ یہ اوپن سورس ہے۔ آپ کے اسکرین شاٹس اسی PC پر رہتے ہیں۔ کوئی اکاؤنٹ نہیں۔ اشتہار نہیں۔ کلاؤڈ نہیں۔
  
  کیپچر ہمیشہ ایک کلید دور ہے۔ Print Screen تب بھی کام کرتا ہے جب ایپ پس منظر میں ہو یا چھوٹی ہو۔ علاقہ کراپ کریں، پھر اشارہ کریں، سمجھا کر چھپائیں اور سنواریں۔
  
  تصویر خود بات کرے
  
  - حسب ضرورت تیر جو بالکل درست جگہ کی طرف اشارہ کریں
  - ترمیم پذیر متن والے اسپیچ ببل کال آؤٹ
  - اہم بات کو فریم کرنے کے لیے نوٹ اور بارڈر والے مستطیل
  - ہائی لائٹر جس کا رنگ بدل سکتے ہیں
  - پاس ورڈ، نام اور نجی ڈیٹا کے لیے دھندلا پن اور سفید کرنا
  - خالی جگہ ہٹانے کے لیے عمودی اور افقی کٹ
  - PNG، JPEG یا WebP کاپی، پیسٹ، درآمد اور برآمد
  
  اسکرین سے متن اتاریں
  
  ایک حصہ منتخب کریں اور بلٹ اِن Windows OCR سے متن نکالیں۔ اضافی سافٹ ویئر کی ضرورت نہیں۔ اگر آپ پہلے سے Tesseract استعمال کرتے ہیں تو وہ انجن بھی معاون ہے۔ نتیجہ ترمیم کریں، کاپی کریں اور آگے بڑھیں۔
  
  بہاؤ میں رہیں
  
  پروجیکٹس پیش نظارہ تھمب نیل کے ساتھ خود محفوظ ہوتے ہیں تاکہ کل کی بگ رپورٹ یا آج کی ہدایت پر فوراً واپس جائیں۔ تصاویر اندر گھسیٹیں۔ تیار تصویر کلپ بورڈ پر کاپی کریں۔ Windows کے ساتھ شروع کریں تاکہ سائن اِن کے بعد کیپچر منتظر ہو۔ ورک اسپیس گہرا، تیز اور 57 زبانوں میں دستیاب ہے۔
  
  آپ کے اسکرین شاٹس آپ کے ہیں
  
  یہ اوپن سورس ڈیسک ٹاپ ٹول ہے۔ نشان زدہ پروجیکٹس آپ کے تصاویر فولڈر میں رہتے ہیں۔ ترتیبات اسی کمپیوٹر پر رہتی ہیں۔ کچھ بھی اپ لوڈ نہیں ہوتا۔ آپ دیکھ سکتے ہیں یہ کیسے کام کرتا ہے۔ بگ رپورٹس، دستاویزات، جائزے، سپورٹ ٹکٹ اور ہر «یہ دیکھو» لمحے کے لیے استعمال کریں۔
  
  کام سنجیدہ رہتا ہے۔ ٹول مزے دار رہتا ہے۔ دوستانہ بلیاں کبھی کبھار نظر آتی ہیں۔
  
  - Print Screen یا ایپ کے بٹن سے کیپچر کریں، چاہے ایپ پس منظر میں ہو۔
  - دلچسپ حصہ ایک حرکت میں کراپ کریں، پھر فوراً نشان لگائیں۔
  - حسب ضرورت تیر کھینچیں جو بالکل درست جگہ کی طرف اشارہ کریں۔
  - ترمیم پذیر اور پڑھنے میں آسان متن کے ساتھ اسپیچ ببل کال آؤٹ شامل کریں۔
  - کسی بھی حصے کی وضاحت یا فریم کے لیے نوٹ اور بارڈر والے مستطیل رکھیں۔
  - رنگ تبدیل کرنے والے ہائی لائٹر سے اہم بات نمایاں کریں۔
  - پاس ورڈ، نام اور جو کچھ شیئر نہ کرنا چاہیے اسے دھندلا کریں۔
  - منتخب حصے کو سفید کریں، یا صرف وہی سلائس کلپ بورڈ پر کاپی کریں۔
  - خالی عمودی یا افقی پٹیوں کو کاٹیں تاکہ اسکرین شاٹ مختصر رہے۔
  - انتخاب سے بلٹ اِن Windows OCR سے متن نکالیں۔ اختیاری Tesseract۔
  - اسکرین شاٹس اور شکلیں کاپی اور پیسٹ کریں۔ تصاویر پروجیکٹ میں گھسیٹ کر چھوڑیں۔
  - PNG، JPEG یا WebP برآمد کریں۔ PNG پروجیکٹ کے ساتھ بھی محفوظ ہوتا ہے۔
  - پروجیکٹس پیش نظارہ تھمب نیل کے ساتھ خود محفوظ ہوتے ہیں تاکہ فوراً واپس جائیں۔
  - Windows کے ساتھ شروع کریں تاکہ سائن اِن کے بعد Print Screen کیپچر تیار ہو۔
  - اوپن سورس۔ نہ اشتہار، نہ تجزیات، نہ اکاؤنٹ۔ اسکرین شاٹس اسی کمپیوٹر پر رہتے ہیں۔
  - بڑے اسکرین شاٹس کے لیے اسکرول بار کے ساتھ گہرا، مرکوز ورک اسپیس۔
  - نوٹس، کال آؤٹ اور تیروں پر فونٹ، رنگ، سائز، موٹا اور ترچھا سیٹ کریں۔
  - نشان زدگیوں کو منتخب کریں، ہلائیں اور ترمیم کریں جب تک تصویر کہانی نہ بتائے۔
