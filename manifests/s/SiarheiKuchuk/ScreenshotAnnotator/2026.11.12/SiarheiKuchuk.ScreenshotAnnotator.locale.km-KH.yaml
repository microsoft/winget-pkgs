ShortDescription: "កម្មវិធីចំណាំរូបថតអេក្រង់ប្រភពបើកចំហសម្រាប់ Windows។ ថត ច្រឹប ដាក់ព្រួញ ការហៅ ព្រិល និង OCR។ គ្មានគណនី គ្មានពាណិជ្ជកម្ម គ្មានពពក។"
Description: |-
  Screenshot Annotator បំប្លែងរូបថតអេក្រង់រញ៉េរញ៉ៃទៅជាការពន្យល់ច្បាស់ក្នុងរយៈពេលវិនាទី។ ចុច Print Screen ច្រឹបអ្វីដែលសំខាន់ ដាក់ចំណាំ ហើយចែករំលែក។ វាជាប្រភពបើកចំហ។ រូបថតអេក្រង់របស់អ្នកនៅលើ PC នេះ។ គ្មានគណនី។ គ្មានពាណិជ្ជកម្ម។ គ្មានពពក។
  
  ការថតតែងតែស្ថិតនៅចម្ងាយគ្រាប់ចុចមួយ។ Print Screen ដំណើរការទោះកម្មវិធីស្ថិតនៅផ្ទៃខាងក្រោយ ឬត្រូវបានបង្រួមក៏ដោយ។ ច្រឹបតំបន់ បន្ទាប់មកចង្អុល ពន្យល់ លាក់ និងកែលម្អ។
  
  ឱ្យរូបភាពនិយាយជំនួស
  
  - ព្រួញដែលអាចកំណត់តាមបំណង ចង្អុលទៅកន្លែងត្រឹមត្រូវ
  - ការហៅពពុះនិយាយដែលមានអត្ថបទអាចកែ
  - កំណត់ចំណាំ និងចតុកោណមានស៊ុម ដើម្បីដាក់ស៊ុមអ្វីដែលសំខាន់
  - ប៊ិចរំលេចដែលអ្នកអាចប្តូរពណ៌
  - ព្រិល និងគូសសขาว សម្រាប់ពាក្យសម្ងាត់ ឈ្មោះ និងទិន្នន័យឯកជន
  - ការកាត់បញ្ឈរ និងផ្តេក ដើម្បីដកចន្លោះទទេ
  - ចម្លង បិទភ្ជាប់ នាំចូល និងនាំចេញ PNG, JPEG ឬ WebP
  
  ស្រង់អត្ថបទពីអេក្រង់
  
  ជ្រើសតំបន់មួយ ហើយស្រង់អត្ថបទដោយ Windows OCR ដែលភ្ជាប់មកជាមួយ។ មិនត្រូវការកម្មវិធីបន្ថែមទេ។ ប្រសិនបើអ្នកប្រើ Tesseract រួចហើយ ម៉ាស៊ីននោះក៏ត្រូវបានគាំទ្រដែរ។ កែលទ្ធផល ចម្លងវា ហើយបន្តទៅមុខ។
  
  នៅតែក្នុងលំហូរការងារ
  
  គម្រោងរក្សាទុកស្វ័យប្រវត្តិជាមួយរូបតូចមើលជាមុន ដូច្នេះអ្នកអាចត្រឡប់ទៅរបាយការណ៍កំហុសម្សិលមិញ ឬការណែនាំថ្ងៃនេះ។ អូសរូបភាពចូល។ ចម្លងរូបភាពដែលបានបញ្ចប់ទៅក្តារតម្បៀតខ្ទាស់។ ចាប់ផ្តើមជាមួយ Windows ដើម្បីឱ្យការថតរង់ចាំបន្ទាប់ពីអ្នកចូល។ កន្លែងធ្វើការងងឹត លឿន និងមានជា 57 ភាសា។
  
  រូបថតអេក្រង់របស់អ្នកជារបស់អ្នក
  
  នេះគឺជាឧបករណ៍ផ្ទៃតុប្រភពបើកចំហ។ គម្រោងដែលបានចំណាំស្ថិតនៅក្នុងថតរូបភាពរបស់អ្នក។ ការកំណត់នៅលើកុំព្យូទ័រនេះ។ គ្មានអ្វីត្រូវបានផ្ទុកឡើងទេ។ អ្នកអាចពិនិត្យមើលរបៀបដែលវាដំណើរការ។ ប្រើវាសម្រាប់របាយការណ៍កំហុស ឯកសារ ការវាយតម្លៃ សំបុត្រគាំទ្រ និងគ្រប់ពេល «មើលនេះ»។
  
  ការងារនៅតែធ្ងន់ធ្ងរ។ ឧបករណ៍នៅតែសប្បាយ។ ឆ្មាមិត្តភាពលេចមកម្តងម្កាល។
  
  - ចុច Print Screen ឬប៊ូតុងក្នុងកម្មវិធីដើម្បីថត ទោះកម្មវិធីស្ថិតនៅផ្ទៃខាងក្រោយក៏ដោយ។
  - ច្រឹបផ្នែកដែលចាប់អារម្មណ៍ក្នុងចលនាមួយ បន្ទាប់មកចំណាំភ្លាមៗ។
  - គូរព្រួញដែលអាចកំណត់តាមបំណង ដែលចង្អុលមនុស្សទៅកន្លែងត្រឹមត្រូវ។
  - បន្ថែមការហៅពពុះនិយាយដែលមានអត្ថបទអាចកែ ហើយនៅតែអាចអានបាន។
  - ដាក់កំណត់ចំណាំ និងចតុកោណមានស៊ុម ដើម្បីពន្យល់ ឬដាក់ស៊ុមតំបន់ណាមួយ។
  - រំលេចអ្វីដែលសំខាន់ដោយប៊ិចរំលេចដែលអ្នកអាចប្តូរពណ៌។
  - ធ្វើឱ្យព្រិលពាក្យសម្ងាត់ ឈ្មោះ និងអ្វីដែលអ្នកមិនគួរចែករំលែក។
  - គូសសขาวតំបន់ដែលបានជ្រើស ឬចម្លងតែផ្នែកនោះទៅក្តារតម្បៀតខ្ទាស់។
  - កាត់ឆ្នូតទទេបញ្ឈរ ឬផ្តេក ដើម្បីឱ្យរូបថតអេក្រង់នៅតែសង្ខេប។
  - ស្រង់អត្ថបទពីការជ្រើសដោយ Windows OCR ដែលភ្ជាប់មកជាមួយ។ Tesseract ជាជម្រើស។
  - ចម្លងនិងបិទភ្ជាប់រូបថតអេក្រង់ និងរូបរាង។ អូសនិងទម្លាក់រូបភាពចូលគម្រោង។
  - នាំចេញ PNG, JPEG ឬ WebP។ PNG ក៏ត្រូវបានរក្សាទុកក្បែរគម្រោងផងដែរ។
  - គម្រោងរក្សាទុកស្វ័យប្រវត្តិជាមួយរូបតូចមើលជាមុន ដូច្នេះអ្នកអាចត្រឡប់ភ្លាមៗ។
  - ចាប់ផ្តើមជាមួយ Windows ហើយរក្សាការថត Print Screen ឱ្យរួចរាល់បន្ទាប់ពីចូល។
  - ប្រភពបើកចំហ។ គ្មានពាណិជ្ជកម្ម គ្មានវិភាគ គ្មានគណនី។ រូបថតអេក្រង់នៅលើកុំព្យូទ័រនេះ។
  - កន្លែងធ្វើការងងឹត ផ្តោតអារម្មណ៍ ជាមួយរបាររមូរសម្រាប់រូបថតអេក្រង់ធំ។
  - លៃតម្រូវពុម្ពអក្សរ ពណ៌ ទំហំ ដិត និងទ្រេត លើកំណត់ចំណាំ ការហៅ និងព្រួញ។
  - ជ្រើស ផ្លាស់ទី និងកែចំណាំ រហូតដល់រូបភាពប្រាប់រឿង។
