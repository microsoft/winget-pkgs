ShortDescription: "Windows向けオープンソースのスクリーンショット注釈ツール。撮影、切り抜き、矢印・吹き出し・ぼかし・OCRでマークアップ。アカウント不要、広告なし、クラウドなし。"
Description: |-
  Screenshot Annotatorは、雑な画面キャプチャを数秒でわかりやすい説明に変えます。Print Screenを押して、必要な部分を切り抜き、注釈を付けて共有。オープンソースです。スクリーンショットはこのPCに残ります。アカウント不要。広告なし。クラウドなし。
  
  撮影は常にキーひとつ。アプリがバックグラウンドや最小化でもPrint Screenは使えます。範囲を切り抜き、指し示し、説明し、隠し、整えます。
  
  画像に語らせる
  
  - 見てほしい場所を正確に指す、カスタマイズ可能な矢印
  - 編集可能なテキスト付きの吹き出し
  - 大切な箇所を囲むメモと枠付きの四角形
  - 色を変えられる蛍光ペン
  - パスワード、名前、個人情報を隠すぼかしと白塗り
  - 余白を落とす縦・横の切り取り
  - コピー、貼り付け、読み込み、PNG・JPEG・WebPの書き出し
  
  画面から文字を取り出す
  
  範囲を選んで、内蔵のWindows OCRでテキストを抽出。追加ソフトは不要です。すでにTesseractを使っているなら、そのエンジンにも対応しています。結果を編集し、コピーして、次へ進めます。
  
  作業の流れを切らさない
  
  プロジェクトはプレビュー付きで自動保存。昨日のバグ報告や今日の手順書にすぐ戻れます。画像をドラッグして追加。完成した画像をクリップボードにコピー。Windowsと一緒に起動すれば、サインイン後すぐ撮影できます。作業画面はダークで軽快、57言語に対応しています。
  
  スクリーンショットはあなたのもの
  
  これはオープンソースのデスクトップツールです。注釈付きプロジェクトはピクチャフォルダーに保存されます。設定はこのPCに残ります。何もアップロードしません。仕組みを自分で確認できます。バグ報告、ドキュメント、レビュー、サポートチケット、あらゆる「ここ見て」に使えます。
  
  仕事はきちんと。ツールは楽しく。ときどき、やさしいネコが顔を出します。
  
  - Print Screenキーまたはアプリ内ボタンで撮影。アプリがバックグラウンドでも使えます。
  - 必要な部分をひと動作で切り抜き、すぐに注釈を付けられます。
  - カスタマイズ可能な矢印で、見てほしい場所を正確に指し示します。
  - 編集可能なテキスト付きの吹き出しを追加。読みやすさを保てます。
  - メモや枠付きの四角形で、範囲を説明したり囲ったりできます。
  - 色を変えられる蛍光ペンで、大切な箇所を強調します。
  - パスワード、名前、共有すべきでない情報をぼかせます。
  - 選択した範囲を白く塗りつぶすか、その部分だけをクリップボードにコピー。
  - 余白の縦帯や横帯を切り取って、スクリーンショットをコンパクトに保ちます。
  - 選択範囲からテキストを抽出。内蔵のWindows OCR。任意でTesseractも使えます。
  - スクリーンショットと図形をコピー＆ペースト。画像をプロジェクトへドラッグ＆ドロップ。
  - PNG、JPEG、WebPで書き出し。プロジェクトの横にPNGも保存されます。
  - プロジェクトはプレビュー付きで自動保存。すぐに作業へ戻れます。
  - Windowsと一緒に起動し、サインイン後もPrint Screenでの撮影をすぐ使えます。
  - オープンソース。広告なし、分析なし、アカウント不要。スクリーンショットはこのPCに残ります。
  - 大きなスクリーンショット向けのスクロールバー付き、集中できるダークな作業画面。
  - メモ、吹き出し、矢印のフォント、色、サイズ、太字、斜体を調整できます。
  - 注釈を選択、移動、編集して、画像がストーリーを語るまで仕上げます。
