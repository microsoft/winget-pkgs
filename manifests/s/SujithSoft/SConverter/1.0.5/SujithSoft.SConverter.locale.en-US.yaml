Description: |-
  S Converter converts files entirely on your PC, with no uploads, ads or account.
  It handles images (including iPhone HEIC and camera RAW), video with NVIDIA, Intel and AMD GPU acceleration, audio, documents (Word and PowerPoint to PDF without Microsoft Office) and PDFs (merge, split, compress, rotate, page numbers).
  It also adds watermarks, creates password-protected ZIP files and extracts ZIP, 7Z, RAR and ISO archives.
  Select files in File Explorer and press Ctrl+Alt+C, or right-click them, to convert without opening the app.
