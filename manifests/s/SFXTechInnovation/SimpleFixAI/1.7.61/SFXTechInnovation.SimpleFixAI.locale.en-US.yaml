ShortDescription: Windows PC repair tool that finds common problems, explains them in plain English, and asks before every repair.
Description: >-
  SimpleFixAI checks your PC for common Windows problems, explains what it finds
  in plain English, and repairs them with the tools built into Windows, run in a
  safe order. It asks before every repair and saves a snapshot first. Many
  repairs can be undone with one click, some can only be partly undone, and some
  leave nothing to undo; repairs that change system files also ask Windows for a
  restore point. Diagnosis, undo and most repairs run on your PC without an
  internet connection, including the repairs for a broken connection. An
  optional local AI model answers questions in the chat on your PC. Usage and
  error reports are on by default, and one switch in Settings turns them off.
