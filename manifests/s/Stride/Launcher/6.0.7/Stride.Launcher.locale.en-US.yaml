ShortDescription: Free, open-source C# 2D and 3D game engine. Installs the Stride Launcher, which installs and updates Stride versions.
Description: |-
  Stride is a free, open-source C# game engine for 2D and 3D games, built on .NET. It comes with Game Studio, a visual editor, and targets desktop and mobile platforms.
  This package installs the Stride Launcher. The launcher installs Stride versions (Game Studio and the engine), opens projects with the right version and updates itself.
