ShortDescription: OTLP/gRPC collector with DuckDB storage, REST API, SQL console with auto charting
Description: otel-viewer is a small OpenTelemetry collector that receives traces, metrics and logs over OTLP/gRPC, stores them in DuckDB and serves a web UI plus a REST query API with a read-only SQL console that automatically charts results. The desktop app bundles the collector, API and UI in a single Tauri window.
