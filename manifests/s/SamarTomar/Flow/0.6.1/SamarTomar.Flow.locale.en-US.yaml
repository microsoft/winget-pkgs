ShortDescription: Local English dictation with a talk-to-it refine loop
Description: |-
  Hold ctrl+win (or the pill), talk, and let go: the words paste into the window you were
  working in. Said it wrong? Hold again and say "change Tuesday to Thursday" or "scratch
  that", and Flow fixes what it just pasted. Tap the pill to change mode: Type pastes;
  Refine turns what you said into a prompt for your project, written by the agent CLI you
  already use; Ask puts a question to it and shows the answer above the pill. Flow Home is
  one window for the speech models, the microphone, a tuning to your voice, a history if
  you choose to keep one, and the settings.

  Speech recognition runs on the machine with faster-whisper, so no audio leaves it and
  there is no API key. English only. The agent CLI - codex or claude, on PATH and already
  signed in - is optional: without one, dictation and spoken corrections still work.

  The speech models are not in the download. They are fetched to the Hugging Face cache
  the first time Flow needs them, with progress in Flow Home. The build is unsigned, so the
  first launch shows the Windows SmartScreen panel and takes More info, then Run anyway,
  once per machine.
Moniker: flow-dictation
