ShortDescription: Find any moment in your video footage by what's on screen, what's said and who's in it.
Description: |-
  Sift Clips searches all of a video editor's footage at once: every drive, even ones that aren't plugged in, plus Frame.io projects and synced cloud folders. Describe a shot, a line or a person and land on the exact frame, without tagging anything. Search runs on your own computer, so footage is never uploaded to be searched.
  It works on its own and inside Adobe Premiere and DaVinci Resolve, and AI assistants like Claude and ChatGPT can use it to find, check and line up footage while you make the cut.
  Free for 3 days or 25 searches, then $99 a year.
