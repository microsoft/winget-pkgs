ReleaseNotes: Sift now works with AI assistants like an editor would. Claude or ChatGPT can search with filters, check how shots move and sound, work in your Selects, read your timeline in Premiere or Resolve, and send or share after you allow it. People you share footage with can search it with their own assistant. Settings is simpler.
