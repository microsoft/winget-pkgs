ReleaseNotes: |-
  - OCR Improvements:
    - Replaced Windows OCR with AI powered PaddleOCR, which gives significantly more accurate results. It supports over 100 languages out of the box, with no language packs to download and no switching between languages, and everything still runs locally on your device.
    - Redesigned the OCR window with an image preview that outlines the recognized text. Click a text region to copy it, or use the mouse wheel to zoom the preview.
    - Added "Separate paragraphs" option that automatically detects paragraphs and keeps their structure in the recognized text.
    - Added "Make text in captures searchable in history" option (Application settings -> History).
    - Removed the "Language" option, since languages no longer need to be selected, and the "Scale factor" option.
  - Added "Pixel editor" tool for pixel art and sprite animations, with layers, an animation timeline, tilemaps, slices, and sprite sheet import and export. Images can be opened in it with "Edit in Pixel editor…" from the main window and history windows.
  - Image editor improvements:
    - The top toolbar can now be moved with its drag handle. Double-click the handle to reset its position.
    - Added "Compact image editor toolbar" option, closer to the ShareX v21 editor (Task settings -> Tools -> Image editor).
    - Added "Right-click deletes the shape under the cursor" option (Task settings -> Tools -> Image editor).
    - Added "Size window to fit image" option (Task settings -> Tools -> Image editor).
    - "Zoom to fit on open" now only shrinks images, so small images open at their actual size.
    - Added "New from screenshot (region)…" and "New from screenshot (full screen)" options to the file menu and start screen.
    - Added "Auto size to text" option to the "Speech Balloon" tool.
    - Added border options to the "Magnify" tool.
    - The font size can now be typed in, from 1 to 1000, including decimals such as 36.5.
    - "Crop" now shows position and size while cropping, like ShareX v21.
    - The "Smart Eraser" tool can now be rotated to improve parity with other tools.
    - Holding Shift while drawing with the "Freehand" tool now draws straight lines, like ShareX v21.
    - Resized images now stretch to fill their box, and holding Shift while dragging a corner keeps their proportions, like ShareX v21.
    - Shift + Enter now starts a new line in text annotations.
    - Added recent colors next to the screen color picker in the color dropdown.
  - Updated toolbar customization for region capture and the image editor so tools and spacers can be dragged into place on a preview of the toolbar.
  - Region capture improvements:
    - Region capture now opens about twice as fast.
    - Added "Ellipse region" and "Freehand region" tools back.
    - Added "Capture selected region" mouse action (Task settings -> Region capture).
    - Pressing Enter now captures the highlighted window.
    - Added "Mouse wheel" option to choose whether scrolling resizes or zooms the magnifier. Hold Ctrl while scrolling to do the other (Task settings -> Region capture).
    - Added "Use custom toolbar button size" option (Task settings -> Region capture). Ctrl + Mouse wheel over the toolbar also resizes it.
    - The toolbar now follows the mouse cursor across monitors until it is used.
  - The after capture window and editors now open on the screen the capture was taken on.
  - Animated GIFs now play in the task preview, thumbnails and image viewer.
  - Added "Image preview location" option to show the image preview below the list view (Application settings -> Main window).
  - Added "Always show full-width scroll bars" option (Application settings -> Theme).
  - Added "Monitor" option to choose which monitor toast notifications appear on (Task settings -> General -> Notifications).
  - Photo editor improvements:
    - Added "Layer from Background" to the Layers panel right-click menu.
    - Layers can now be deleted by dragging them onto the bin in the Layers panel.
    - Copied text layers are now pasted as text.
  - Added crop and resize options to the animated GIF trimmer.
  - "Save image to file as" can now save in any supported image format.
  - Links in the QR code window can now be opened with Ctrl + Click.
  - The video converter now shows the average bitrate, file size and resolution of the output after converting.
  - Improved image effects search to rank results and match common words.
  - Settings, stats, debug log, about, image effects and FFmpeg options windows can now be closed with Esc.
  - Improved keyboard and screen reader support. The task list can now be used with the keyboard, and message box buttons have Alt shortcuts.
  - Added "Display diagnostics" window that creates a report for scaling and multi-monitor issues (Debug -> Display diagnostics).
  - Removed "Leave clipboard alone" goal from the after capture window.
  - Upgraded project to .NET 11.
  - Removed "Dev" update channel.
