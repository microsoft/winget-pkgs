ShortDescription: A cross-platform port of the popular ShareX screen capture and file sharing tool, built with Avalonia UI and .NET 10.
Description: XerahS (ShareX.Avalonia) is a cross platform reimagining of the ShareX user interface built with Avalonia. It targets modern UX modular architecture and long term maintainability while preserving core workflows speed and reliability. It provides a foundation for future desktop experiences on Windows macOS and Linux with consistent accessible design.
