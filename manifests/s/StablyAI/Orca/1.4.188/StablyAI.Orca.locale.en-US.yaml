  - fix(terminal): require a proven exit before retiring a subscription's lease by @brennanb2025 in https://github.com/stablyai/orca/pull/15470
  - refactor(shell): collapse the zsh wrapper to one .zshenv and a precmd hook by @nwparker in https://github.com/stablyai/orca/pull/15391
  - fix(pty): keep a CPR reply from overtaking a deferred colour reply by @nwparker in https://github.com/stablyai/orca/pull/15559
  - fix(terminal): refuse a cursor on a screen read, and correct the source docs by @nwparker in https://github.com/stablyai/orca/pull/15563
