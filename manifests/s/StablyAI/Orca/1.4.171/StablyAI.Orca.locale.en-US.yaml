ReleaseNotes: |-
  Summary
  SSH / remote-server reliability patch series since 1.4.169 (this release includes everything from 1.4.170 as well). Covers terminal reattach and liveness, host-surface materialization on reconnect, outage error flooding / stuck panes, agent status flapping on remote tabs, terminate/timeout handling for remote PTYs, and automatic recovery from a dropped SSH relay instead of wedging on “Multiplexer disposed”.
  If you skipped 1.4.170, everything below is new relative to 1.4.169.
  What's Changed in 1.4.171
  - fix(remote-runtime): keep a remote outage from flooding the error surface and dead-ending the pane by @Jinwoo-H in https://github.com/stablyai/orca/pull/12650
  - fix(remote-runtime): stop the host tab mirror from fighting renderer-owned agent status by @Jinwoo-H in https://github.com/stablyai/orca/pull/12641
  - Recover automatically instead of getting stuck on "Multiplexer disposed" when an SSH relay drops by @nwparker in https://github.com/stablyai/orca/pull/12216
  Also included from 1.4.170
  - fix(terminal): truthful handle liveness + no forked resume tabs for hidden restorable panes by @Jinwoo-H in https://github.com/stablyai/orca/pull/12574
  - fix(runtime): reject leaf terminal sends only on controller-proven PTY absence by @Jinwoo-H in https://github.com/stablyai/orca/pull/12578
  - fix(runtime): seed terminal previews and titles from restore payloads by @Jinwoo-H in https://github.com/stablyai/orca/pull/12579
  - fix(terminal): attach never-activated daemon sessions on remote subscribe and provider-read fallback by @Jinwoo-H in https://github.com/stablyai/orca/pull/12589
  - fix(remote-runtime): materialize the host surface when reconnecting a terminal pane by @planderdev in https://github.com/stablyai/orca/pull/11542
  - fix(ssh): preserve agent generation timeout budget by @Jinwoo-H in https://github.com/stablyai/orca/pull/12644
  - fix(ssh): let terminate reach remote PTYs the app gave up reattaching (STA-3376) by @Jinwoo-H in https://github.com/stablyai/orca/pull/12642
  Full Changelog: https://github.com/stablyai/orca/compare/v1.4.169...v1.4.171
