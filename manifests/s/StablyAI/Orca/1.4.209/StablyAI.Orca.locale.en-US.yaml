ReleaseNotes: |-
  Thank you so much for using Orca and for your continued support! ❤️
  This is a patch on top of v1.4.207.
  The short version
  Agents & chat: Search results are sorted by newest activity, launch prompts can be delivered directly to terminal agents, and Codex, OpenCode, Claude, and other provider usage reporting is more reliable.
  Workspaces, editor & source control: Large artifacts and conflict trees load more smoothly, PDF zoom persists across tabs and restarts, Markdown previews survive wiki-link navigation, and file search no longer shows stale results while a new query loads.
  Terminal & remote: Configure interactive Unix shell arguments, preserve composed text and selections in terminal panes, and keep remote pane scrollback across hard restarts. Relay rehomes and same-capacity rollouts are more resilient.
  Mobile: The over-the-air page now supports browser screencasting, HTML previews, Mermaid diagrams, dictation, and additional source-control and session routes.

  Product experience
  Agents, chat & workspaces
  Search is easier to trust, agent launches are more direct, and large workspace lists stay responsive.
  - feat(agent-launch): deliver a launch prompt to a terminal agent by @brennanb2025 in https://github.com/stablyai/orca/pull/21891
  - feat(session-search): sort search results by newest, and break relevance ties by recency by @Jinwoo-H in https://github.com/stablyai/orca/pull/21863
  - Virtualize artifacts list with reusable component by @AmethystLiang in https://github.com/stablyai/orca/pull/22061
  - Virtualize large conflict file trees by @AmethystLiang in https://github.com/stablyai/orca/pull/21920
  - Fix stale listings when search query changes by @AmethystLiang in https://github.com/stablyai/orca/pull/22173
  Editor & terminal
  PDF work, Markdown navigation, terminal input, and remote pane recovery are more consistent.
  - fix(editor): persist PDF zoom across tabs and restarts by @Jinwoo-H in https://github.com/stablyai/orca/pull/21879
  - fix(editor): preserve Markdown preview when following wiki links by @SahilZ0810 in https://github.com/stablyai/orca/pull/19790
  - feat(terminal): configure interactive Unix shell arguments by @nwparker in https://github.com/stablyai/orca/pull/21904
  - fix(terminal): preserve Polish and Option-composed text in kitty panes by @nwparker in https://github.com/stablyai/orca/pull/21082
  - fix(terminal): persist a parked remote pane's scrollback across a hard restart (#21295) by @nwparker in https://github.com/stablyai/orca/pull/21367
  Mobile
  The mobile page gains richer browser, preview, diagram, dictation, and session support.
  - feat(mobile): carry browser screencast frames over the bridge as base64 (OTA phase C, C6.1) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21758
  - feat(mobile): render Mermaid diagrams on the page from one deferred engine artifact (OTA phase C, C7.10 B) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21871
  - feat(mobile): dictation on the OTA page over native audio verbs (Phase C, C7.10 PR D) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21905
  - feat(mobile): render the HTML preview on the page in a sealed srcdoc frame (OTA phase C, C7.10 A) by @Jinwoo-H in https://github.com/stablyai/orca/pull/21862
  Full Changelog: https://github.com/stablyai/orca/compare/v1.4.207...v1.4.209
