ShortDescription: A tiny always-on-top widget that shows your Claude plan's 5-hour and weekly usage and forecasts when you'll hit the limit.
Description: |-
  Burnrate is a small Windows tray widget for Claude Code users. It shows your 5-hour and weekly plan usage with reset countdowns, forecasts when you'll run out at your current pace, and breaks token usage down by project.
  Optional extras: a live feed from Claude Code's statusline, reopening a session when a limit resets, and advice on whether your plan fits how you use it.
  Free and open source. No account, no telemetry. Not affiliated with Anthropic.
