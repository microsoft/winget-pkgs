# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
#
# Shape: telltale ships as a zip holding a single portable exe, so this is
# InstallerType: zip + NestedInstallerType: portable — the same shape fzf,
# ripgrep and zoxide use, and the reason there is no installer to write.
#
# ONLY windows_amd64 is listed, and that is deliberate rather than an
# oversight: winget installs on Windows, and windows/amd64 is the one target
# this project continuously verifies. windows/arm64 is not built at all, so
# there is nothing to list for it.
PackageIdentifier: sanlee-ys.telltale
PackageVersion: "0.2.0"
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: telltale.exe
    PortableCommandAlias: telltale
ReleaseDate: 2026-08-14
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/sanlee-ys/telltale/releases/download/v0.2.0/telltale_0.2.0_windows_amd64.zip
    InstallerSha256: 7A2401AAD45BA1AC91E3ADA364BBC692F4901F0C92873EAED08A47D433772528
ManifestType: installer
ManifestVersion: 1.12.0
