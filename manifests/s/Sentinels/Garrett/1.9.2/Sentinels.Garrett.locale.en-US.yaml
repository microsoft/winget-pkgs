ShortDescription: Host intrusion sentinel that stops what it catches.
Description: |-
  garrett watches this machine's running programs and their connections, scores them on the machine, and pauses or ends a program it judges hostile.
  It reports cases to a Sentinel service you run yourself, applies what that service learned from earlier attacks, and shares what one machine learns with the rest of your machines.
  It runs as SYSTEM and starts with Windows. See what it finds with "C:\Program Files\garrett\garrett.cmd" cases
