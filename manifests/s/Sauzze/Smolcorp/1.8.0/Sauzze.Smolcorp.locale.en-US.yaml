ShortDescription: A control pad on your phone for the AI coding agents in your terminal.
Description: |-
  Your agent sessions are people in a little pixel-art office on your phone, each at a desk, acting out what it's doing: Claude Code, Codex, Gemini CLI, OpenCode and Grok.
  Approve a permission request from across the room, interrupt an agent, or change how hard Claude thinks.
  Your phone connects over your Wi-Fi, so there's nothing to install from an app store.
  On Windows, start agents with `smolcorp run claude`, or a role with `smolcorp run --role tester`, or use them in tmux, WezTerm or kitty.
