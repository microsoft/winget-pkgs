ReleaseNotes: |-
  What’s New in Legcord v1.3.1 ✨

  📢 Important: Security Update & The Future of Legcord
  Legcord v1.3.1 fixes two security vulnerabilities affecting versions 1.1.0 through 1.3.0. Please update to v1.3.1 or newer.
  In a new article, I discuss these vulnerabilities, explain the security implications of Legcord's current architecture, and outline plans for Legcord 2.0 - a complete rewrite built around a modular, community-extensible architecture.
  👉 Read the full article: Future of Legcord

  Highlights & Improvements
  - 🔒 Security fixes (CVE-2026-105294 & CVE-2026-105293)
    Fixed two security vulnerabilities affecting Legcord versions 1.1.0 through 1.3.0: a configuration injection vulnerability and a path traversal vulnerability in theme IPC handlers. Please update to v1.3.1 or newer.
  - ⚡ Faster startup and improved performance
    Eliminated unnecessary synchronous I/O and improved configuration access with caching (#1138, #1158 by @youtsuhodev). Reduced startup overhead by limiting the 1500 ms delay to Linux (#1157 by @youtsuhodev) and replaced the five-second preload sleep with targeted global polling (#1173 by @youtsuhodev).
  - 🖥️ Improved screensharing previews
    Each screenshare picker tile now has its own preview, improving the selection experience (#1155 by @dylanjkl).
  - 🎨 Improved themes and interface fixes
    Fixed the Themes tab (#1151 by @ewof), replaced observer version patching with a CSS pseudo-element (#1149 by @MahmodZE), and prevented macOS window controls from overlapping the navigation bar (#1165 by @angelo-Cahetel).
  - 🎮 More reliable Rich Presence
    Fixed an issue where resolving one Rich Presence image could interfere with resolving the other. Large and small images are now resolved independently (#1160 by @youtsuhodev).
  - 📦 Improved portable mode
    Fixed portable mode behaviour (#1172 by @MahmodZE).

  Fixes & Quality of Life
  - 🐧 Fixed Debian package dependencies (#1146 by @renangiuliasse).
  - 🐧 Updated Flatpak metadata to remove a broken release entry (#1140 by @imide).
  - 📖 Updated the README to include Flathub installation instructions (#1143 by @imide).
  - 🔧 Fixed the CI workflow to run the intended command instead of installing dependencies in the affected step (#1137 by @imide).
  - 🔧 Set the pnpm store version in CI for more consistent builds (#1139 by @imide).
  - 📝 Added .gitattributes to enforce consistent LF line endings across the repository (#1167 by @youtsuhodev).

  New Contributors 👋
  - @ewof – first contribution (#1151)
  - @dylanjkl – first contribution (#1155)
  - @angelo-Cahetel – first contribution (#1165)

  Special Thanks ❤️
  Big shoutout to @FlintSH, @fluffypony for their generous donations!
