ReleaseNotes: |-
  What’s New in Legcord v1.3.0 ✨

  Highlights & Improvements
  - 🖥️ Hardware accelerated screensharing on Windows & macOS
  - 🎨 Redesigned screenshare picker UI
    Updated the screenshare picker and source cards to match Discord's design system (#1076 by @youtsuhodev, #1107 by @youtsuhodev).
  - 🖼️ Redesigned Settings page, Themes page, About window
    Redesigned the themes page UI with a modern card layout (#1108 by @youtsuhodev) and overhauled the About window (#1121 by @youtsuhodev, #1133 by @youtsuhodev).
  - ⚙️ Settings sidebar icons
    Added icons to the Legcord settings sidebar (#1079 by @youtsuhodev).
  - 🍎 macOS native system audio loopback capture
    Implemented native system audio capture for screensharing on macOS (#1092 by @sakudiff).
  - 🐧 Wayland global keybind support
    Added native keybind support on Wayland (#1127 by @renangiuliasse).
  - ⚡ Performance & startup optimizations
    Parallelized client mod fetching and plugin initialization (#1131 by @youtsuhodev), cached theme lists via fs.watch (#1118 by @youtsuhodev), and resolved memory leaks and high CPU usage (#1102 by @youtsuhodev). More performance modes.
  - 🔒 Security enhancements & protocol changes
    Configured Electron fuses (#1114 by @imide) and switched local HTML files to use the legcord:// protocol (#1120 by @youtsuhodev).
  - 🖼️ CSS Editor now loads locally
    Up to 2x faster loading!

  Fixes & Quality of Life
  - 🛡️ Fixed potential JS injection via navigateTo deep links (#1074 by @youtsuhodev).
  - 🎙️ Fixed Windows microphone drop in getUserMedia patch (#1088 by @Kolhun).
  - 🖥️ Fixed window state restoration across mixed-DPI multi-monitor setups (#1110 by @Sickjuicy).
  - 🍏 Fixed macOS traffic light positioning on 'Overlay' window style (#1134 by @isaxk).
  - 🚀 Fixed blank settings and theme on first launch (#1101 by @youtsuhodev).
  - 📦 Updated Flatpak metainfo for full Flathub compatibility (#1111 & #1112 by @imide).
  - 📦 Added license and dependency metadata to Debian target (#1130 by @renangiuliasse).
  - 🛠️ Updated AppImage toolset per Electron Builder docs (#1136 by @imide).
  - 🤖 Uploaded generated-sources.json with release artifacts (#1119 by @imide).
  - 🧹 Fixed injection TypeError (#1085 by @youtsuhodev).
  - 🧹 Resolved all Biome lint errors and formatted codebase (#1100 & #1117 by @youtsuhodev).
  - 📖 Added clipboard fallback plugin documentation example (#1123 by @NigelThorne).
  - 🧹 Bumped all depedencies

  New Contributors 👋
  - @Kolhun – first contribution (#1088)
  - @sakudiff – first contribution (#1092)
  - @Sickjuicy – first contribution (#1110)
  - @NigelThorne – first contribution (#1123)
  - @isaxk – first contribution (#1134)

  Special Thanks ❤️
  Big shoutout to @FlintSH, @fluffypony for their generous donations!
