ShortDescription: Бесплатная двусторонняя синхронизация папки компьютера с Яндекс.Диском.
Description: |-
  STEREO Sync возвращает бесплатную фоновую синхронизацию папки на компьютере с Яндекс.Диском после того, как Яндекс сделал синхронизацию в своём приложении для ПК платной (июнь 2026).
  Работает через официальный API Яндекса (OAuth): файлы идут напрямую между компьютером и вашим облаком.
  Живёт в трее и запускается вместе с Windows.
  Бесплатно — одна папка. Pro (разовая оплата) — папок сколько угодно, изменения из облака каждые 5 секунд.
