License: Proprietary
ShortDescription: Free two-way sync between a computer folder and Yandex.Disk.
Description: |-
  STEREO Sync brings back free background sync between a folder on your computer and Yandex.Disk after Yandex made desktop sync in its own app paid (June 2026).
  It works through the official Yandex API (OAuth): files go directly between the computer and your cloud.
  Runs in the system tray and starts with Windows.
  Free: one folder. Pro (one-time payment): unlimited folders and changes from the cloud every 5 seconds.
