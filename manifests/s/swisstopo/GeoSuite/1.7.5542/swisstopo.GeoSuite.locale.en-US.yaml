Description: GeoSuite is the free geodetic software package of the Swiss Federal Office of Topography (swisstopo). It combines a spreadsheet-like file editor and project management with the calculation modules LTOP (adjustment of geodetic, GNSS and levelling networks), REFRAME (planimetric and height transformations for Swiss national and cadastral surveying) and TRANSINT (transformation and interpolation of points), with integrated map visualisation and CAD/GIS export.
