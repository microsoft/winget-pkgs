ShortDescription: Generate, translate and burn in subtitles entirely on your own machine.
Description: |-
  Sablate is a desktop app for Windows and macOS that generates, translates, edits
  and burns in subtitles without sending your footage anywhere.

  faster-whisper runs locally across four quality tiers and 100 source languages,
  and a supported NVIDIA GPU is used automatically on Windows. Translation is added
  to an existing transcript as a layer rather than a second job, so every language
  shares the same cue timings: Argos runs fully offline, while DeepL, OpenAI and
  Claude work with your own API key.

  The editor puts the video, the transcript and a style panel side by side, with
  timeline drag retiming, cue split and merge, find and replace, a term glossary,
  a reading-speed warning and 13 caption presets including a word-by-word karaoke
  sweep.

  Export .srt, .vtt, .txt, .ass, a soft-subtitled .mkv with one track per language,
  or an .mp4 with the subtitles burned in by libass at 16:9, 9:16 or 1:1.

  The free tier is permanent and needs no account. Pro is a single one-time payment.
