ShortDescription: Read-only health check for Windows dev environments.
Description: >-
  envdoctor inspects a Windows developer machine and reports what is actually wrong with it,
  then scores the setup out of 100. It checks PATH length, dead and duplicate PATH entries,
  Microsoft Store alias stubs that shadow real tools, duplicate toolchains, long-path support,
  package-cache size, occupied dev ports and git configuration. Every finding includes a
  one-line fix. It is read-only, needs no administrator rights, makes no network calls and
  writes no configuration.
