ReleaseNotes: "### enhancements\n\n• media player, seekable progress bar with live-updating playback position while playing.\n\n### fix\n\n• PWA windows (e.g. Firefox PWAs) grouped under their parent browser instead of being detected as separate apps when the\n  AppUserModelId is assigned after window creation.\n• Toolbar and dock maximized window colors api.\n\n## What's Changed\n• build(deps-dev)：bump svelte from 5.56.10 to 5.57.0 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1784\n• build(deps-dev)：bump lefthook from 2.1.10 to 2.1.12 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1782\n• build(deps-dev)：bump antd from 6.6.1 to 6.6.2 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1781\n• build(deps)：bump dompurify from 3.4.13 to 3.4.14 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1785\n• build(deps)：bump arc-swap from 1.9.1 to 1.9.2 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1783\n• build(deps-dev)：bump fast-uri from 3.1.5 to 3.1.7 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1786\n• fix(tb)：stop showing the muted icon when the default audio device is lost by @z1pp090 in https://github.com/eythaann/Seelen-UI/pull/1775\n\n## New Contributors\n• @z1pp090 made their first contribution in https://github.com/eythaann/Seelen-UI/pull/1775\n\n**Full Changelog**：https://github.com/eythaann/Seelen-UI/compare/v2.8.3...v2.8.4"
