ReleaseNotes: "### features\n\n• HDR toggle for supported monitors on quick settings widget.\n• Light/dark mode toggle on quick settings widget.\n• Night Light toggle on quick settings widget.\n• Mobile hotspot toggle on quick settings widget and network popup, with QR code and connection details (SSID, password,\n  band) for quick sharing.\n\n### enhancements\n\n• show apps menu on the monitor where the cursor is positioned.\n\n### fix\n\n• notifications behaviors\n• apps menu and power menu stuck on mounting when the user folders indexing was slow or failed.\n• apps menu inmediately dissmising.\n\n## What's Changed\n• fix(notifications)：activate Win32 toasts through their COM activator by @z1pp090 in https://github.com/eythaann/Seelen-UI/pull/1792\n• build(deps)：bump react-router from 8.3.0 to 8.3.1 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1804\n• build(deps-dev)：bump tsx from 4.23.12 to 4.23.13 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1803\n• build(deps-dev)：bump i18next from 26.4.0 to 26.4.2 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1805\n• build(deps)：bump dompurify from 3.4.14 to 3.4.15 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1802\n• build(deps-dev)：bump js-yaml from 4.3.1 to 4.3.2 by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1806\n• build(deps)：bump adm-zip and deepl-node by @dependabot[bot] in https://github.com/eythaann/Seelen-UI/pull/1766\n\n\n**Full Changelog**：https://github.com/eythaann/Seelen-UI/compare/v2.8.4...v2.8.5"
