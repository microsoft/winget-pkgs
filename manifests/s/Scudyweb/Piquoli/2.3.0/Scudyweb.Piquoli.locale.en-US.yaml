License: Proprietary (free on 2 themes, 7-day trial, then subscription)
ShortDescription: Learn languages by playing — 7 languages, A1 to C1.
Description: |-
  Piquoli turns vocabulary and grammar into quick games: spaced-repetition flashcards, matching, sentence translation, listening, dictation, spelling, memory, grammar and speaking practice with speech recognition.
  7 languages (English, French, Dutch, Italian, Spanish, German, Russian), 148 themes from A1 to C1, real voices, a placement test and a guided path. Interface available in the same 7 languages.
