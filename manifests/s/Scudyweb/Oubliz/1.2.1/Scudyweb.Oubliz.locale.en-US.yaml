PackageIdentifier: Scudyweb.Oubliz
PackageVersion: 1.2.1
PackageLocale: en-US
Publisher: Scudyweb
PackageName: Oubliz
License: Proprietary (7-day free trial, then paid licence)
ShortDescription: The household deadline keeper — reminded on time, never forgotten again.
Description: |-
  Vehicle inspection, ID card, boiler service, taxes, warranties, subscriptions, appointments: enter a single date and Oubliz works out the rest and reminds you at the right time.
  26 ready-made templates designed for Belgium, a monthly agenda, a yearly budget, checklists and on-screen alerts before each deadline.
  Show a document to the camera and Oubliz reads the date by itself. Phone calendar subscription, household sharing, interface in English, French and Dutch. Your data stays on your computer.
ReleaseNotes: |-
  - Show a document to the camera: Oubliz spots the date by itself and straightens the image.
  - Much more reliable date reading (built-in system engine, handwriting included) and appointment times.
  - Several documents of any format per deadline, with preview.
  - Phone calendar via QR code (iPhone, Google Calendar, Outlook) and household sharing.
  - Yearly budget, checklists, 26 templates, Dutch and English interface.
Tags:
- calendar
- deadlines
- organizer
- productivity
- reminders
