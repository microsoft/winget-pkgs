ShortDescription: Run Claude Code, Codex, Gemini CLI, Copilot and 14 more coding agents side by side.
Description: |-
  AgentVera is a desktop app that runs the AI coding agents installed on your computer side by side, per project, each in a real terminal with your own CLI login. No API key is needed.
  It adds what is missing between agents: layouts and git worktrees, flows that pass one agent's reply to the next, agent-to-agent messages and a shared task list, automatic code review, account switching when a usage limit runs out, an MCP manager, and approvals from Telegram or your phone.
