Description: Imagine is a free, lightweight image and animation viewer for Windows, known for its minimal resource usage, extensive format support, and fast performance even on legacy hardware. It combines essential viewing tools with batch processing capabilities in a compact package. It supports numerous image and animation formats, digital camera RAW formats, and archive formats, and includes image manipulation, batch conversion, slide show, capture screen, and multilingual support.
