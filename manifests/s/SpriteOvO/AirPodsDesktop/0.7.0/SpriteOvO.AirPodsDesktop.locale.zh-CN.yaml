ShortDescription: AirPods 桌面用户体验提升计划
ReleaseNotes: |-
  这是 Beta 测试版本。如果使用时遇到任何问题或错误，欢迎 提出 Issue 告诉我们。
  Important
  此版本的 Windows 安装程序未使用 Authenticode 源代码签章，因此 Windows 可能显示「未知的发行者」或 Microsoft Defender SmartScreen 警告。请只从此官方 Release 页面下载。
  📜 更新内容
  1. 电量弹窗改为仿照 iOS 卡片：电量圈显示在耳机与充电盒下方，两只耳机在一起时播放转盘动画，拿出一只时改为显示各只耳机与充电盒的静态图，场景切换时有淡入淡出。充电盒开着时弹窗会持续显示。 (#238、#239、#278)
  2. 每个机型都有专属动画。AirPods Max、AirPods Max (USB-C)、Beats Fit Pro、Beats Solo3、Powerbeats 3 与 BeatsX 会依照你的装置颜色显示，共 76 种颜色。 (#250、#278)
  3. 新增 Beats Solo3、BeatsX 与 Powerbeats 3 支援，并可辨识 AirPods Max 2 的产品 ID。 (#258、#278)
  4. AirPods Max 改为显示单一、置中的电量。 (#250、#276)
  5. 改善从系统匣连线的体验：重新设计的快速连线卡片、可选择在开始播放音讯时自动连线，以及更可靠的电量侦测。 (#262、#278)
  6. 新增可关闭「开盖时弹出视窗」的设定。弹窗不再抢走使用中程序的焦点，耳机在盒盖已开的状态下重新出现时也不会再次弹出。 (#246、#249)
  7. 修正 AirPods Pro 2 在讯号较弱时自动耳朵侦测失效的问题。 (#237)
  8. 修正弹窗显示时无法结束程序，以及启动时出现错误代码 5 的问题。安装程序现在会在安装或解除安装前先关闭执行中的 AirPodsDesktop。 (#269、#271、#279)
  9. 新增波兰文、西班牙文、波斯文与印尼文翻译，并补齐既有语言的翻译。 (#232、#236、#244、#248、#274、#275)
  安装程序比以往大（约 200 MB，先前为 57 MB），因为现在包含每个机型与颜色的动画。
  感谢 @cbittle、@Piteriuz、@z1pp090、@akhmadqasim、@b14ck4nge1、@austinmiller770 与 @aaroncheungzy 的首次贡献。
