ShortDescription: AirPods 桌面用戶體驗提升計劃
ReleaseNotes: |-
  這是 Beta 測試版本。如果使用時遇到任何問題或錯誤，歡迎 提出 Issue 告訴我們。
  Important
  此版本的 Windows 安裝程式未使用 Authenticode 程式碼簽章，因此 Windows 可能顯示「未知的發行者」或 Microsoft Defender SmartScreen 警告。請只從此官方 Release 頁面下載。
  📜 更新內容
  1. 將程式從 Qt 5 Win32 遷移至 Qt 6.8.3 與原生 Windows x64。現在需要 Windows 10 1809 或更新版本，以及 x64 處理器。
  2. 新增升級橋接安裝程式，讓既有 32 位元版本可透過內建更新程式移除舊版並安裝新的 x64 程式。
  3. 新增自動淺色／深色外觀，並重新設計設定、更新、系統匣與彈窗介面。
  4. 新增依語言選擇字體的功能，採用 Inter 與 Noto Sans Traditional Chinese，並改善設定介面的文字、按鈕、語言名稱與導覽。
  5. 改善 AirPods 動畫播放，並修正深色模式下可見的背景底色與暗色邊緣問題。
  6. 改善混合 DPI 多螢幕配置下的彈窗位置、圓角與介面顯示。
  7. 將更新流程整合至單一對話框，並改善進度文字、失敗恢復與系統匣通知。
  ⚠️ 升級注意事項
  - 若目前使用安裝版的 32 位元版本，請優先從 AirPodsDesktop 內啟動更新。遷移安裝程式會先詢問是否移除舊版，再安裝 x64 版本。
  - 如果自動移除失敗，請先關閉 AirPodsDesktop，從 Windows 設定解除安裝舊版，再手動執行 AirPodsDesktop-0.6.0-win64.exe。
  - Portable 使用者應將完整的 x64 套件解壓縮至全新的空目錄。請勿將新的 Qt 6 x64 檔案與既有 Qt 5 Win32 portable 目錄混合使用。
  - 需要在 AMD64／x64 電腦上使用 Windows 10 1809 或更新版本；不支援 32 位元 Windows 與 Windows on ARM64。
  - 安裝版與 portable 套件均已包含必要的 Qt 6.8.3 runtime，不需要另外安裝 Qt。
  感謝大家一直以來對 AirPodsDesktop 的使用與支持。
  本次更新迎來了架構與介面的重大升級，除了支援深色模式外，也希望能為大家帶來更流暢、更現代且更穩定的使用體驗。
  由於這次改版幅度較大，初期使用時仍可能遇到一些問題。
  如果各位在使用過程中發現任何異常，歡迎隨時 提出 Issue。
  我們會盡快進行分析並修正，再次感謝大家的支持與體諒。
