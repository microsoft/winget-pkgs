ReleaseNotes: |-
  This is a Beta version. If you encounter any questions or bugs while using it, please feel free to open an issue to let us know.
  Important
  The Windows installers in this release are not Authenticode-signed. Windows may show an unknown publisher or Microsoft Defender SmartScreen warning. Only download files from this official release page.
  📜 Change log
  1. Migrated the application from Qt 5 Win32 to Qt 6.8.3 and native Windows x64. Windows 10 version 1809 or newer and an x64 processor are now required.
  2. Added an upgrade bridge that lets existing 32-bit installations use the built-in updater toremove the legacy version and install the new x64 application.
  3. Added adaptive light and dark appearance and redesigned the settings, update, tray and popup UI.
  4. Added locale-aware typography using Inter and Noto Sans Traditional Chinese, with clearer text, buttons, language names and navigation across the settings interface.
  5. Improved AirPods animation playback and removed matte backgrounds and dark edge artifacts visible in dark mode.
  6. Improved popup placement, rounded corners and rendering across mixed-DPI monitor layouts.
  7. Unified the update flow into one dialog and improved progress text, failure recovery and tray notifications.
  ⚠️ Upgrade notes
  - If you use an installed 32-bit release, start the update from AirPodsDesktop when possible. The migration installer asks for permission to remove the legacy installation before installing x64.
  - If automatic removal fails, exit AirPodsDesktop, uninstall the old version from Windows Settings, then run AirPodsDesktop-0.6.0-win64.exe manually.
  - Portable users should extract the complete x64 package into a new, empty directory. Do not mix the new Qt 6 x64 files with an existing Qt 5 Win32 portable directory.
  - Windows 10 version 1809 or newer on an AMD64/x64 PC is required. 32-bit Windows and Windows on ARM64 are not supported.
  - The required Qt 6.8.3 runtime is included in both packages; a separate Qt installation is not required.
  Thank you for using and supporting AirPodsDesktop.
  This release introduces major architectural and interface upgrades, including support for dark mode, with the goal of providing a smoother, more modern, and more reliable experience.
  As this is a substantial update, you may encounter some issues during the initial release period.
  If you experience any problems, please feel free to open an issue.
  We will investigate and address reported issues as quickly as possible.
  Thank you again for your continued support and understanding.
