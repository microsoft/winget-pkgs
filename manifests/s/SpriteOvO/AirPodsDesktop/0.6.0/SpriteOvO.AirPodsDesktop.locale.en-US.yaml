ReleaseNotes: |-
  1. Migrated the application from Qt 5 Win32 to Qt 6.8.3 and native Windows x64. Windows 10 version 1809 or newer and an x64 processor are now required.
  2. Added an upgrade bridge that lets existing 32-bit installations use the built-in updater toremove the legacy version and install the new x64 application.
  3. Added adaptive light and dark appearance and redesigned the settings, update, tray and popup UI.
  4. Added locale-aware typography using Inter and Noto Sans Traditional Chinese, with clearer text, buttons, language names and navigation across the settings interface.
  5. Improved AirPods animation playback and removed matte backgrounds and dark edge artifacts visible in dark mode.
  6. Improved popup placement, rounded corners and rendering across mixed-DPI monitor layouts.
  7. Unified the update flow into one dialog and improved progress text, failure recovery and tray notifications.
