ShortDescription: AirPods 桌面用户体验提升计划
ReleaseNotes: |-
  这是 Beta 测试版本。如果使用时遇到任何问题或错误，欢迎 提出 Issue 告诉我们。
  Important
  此版本的 Windows 安装程序未使用 Authenticode 源代码签章，因此 Windows 可能显示「未知的发行者」或 Microsoft Defender SmartScreen 警告。请只从此官方 Release 页面下载。
  📜 更新内容
  1. 将程序从 Qt 5 Win32 迁移至 Qt 6.8.3 与原生 Windows x64。现在需要 Windows 10 1809 或更新版本，以及 x64 处理器。
  2. 新增升级桥接安装程序，让既有 32 位元版本可透过内置更新程序移除旧版并安装新的 x64 程序。
  3. 新增自动浅色／深色外观，并重新设计设定、更新、系统匣与弹窗界面。
  4. 新增依语言选择字体的功能，采用 Inter 与 Noto Sans Traditional Chinese，并改善设定界面的文字、按钮、语言名称与导览。
  5. 改善 AirPods 动画播放，并修正深色模式下可见的背景底色与暗色边缘问题。
  6. 改善混合 DPI 多屏幕配置下的弹窗位置、圆角与界面显示。
  7. 将更新流程整合至单一对话框，并改善进度文字、失败恢复与系统匣通知。
  ⚠️ 升级注意事项
  - 若目前使用安装版的 32 位元版本，请优先从 AirPodsDesktop 内启动更新。迁移安装程序会先询问是否移除旧版，再安装 x64 版本。
  - 如果自动移除失败，请先关闭 AirPodsDesktop，从 Windows 设定解除安装旧版，再手动执行 AirPodsDesktop-0.6.0-win64.exe。
  - Portable 使用者应将完整的 x64 套件解压缩至全新的空目录。请勿将新的 Qt 6 x64 档案与既有 Qt 5 Win32 portable 目录混合使用。
  - 需要在 AMD64／x64 电脑上使用 Windows 10 1809 或更新版本；不支援 32 位元 Windows 与 Windows on ARM64。
  - 安装版与 portable 套件均已包含必要的 Qt 6.8.3 runtime，不需要另外安装 Qt。
  感谢大家一直以来对 AirPodsDesktop 的使用与支持。
  本次更新迎来了架构与界面的重大升级，除了支援深色模式外，也希望能为大家带来更流畅、更现代且更稳定的使用体验。
  由于这次改版幅度较大，初期使用时仍可能遇到一些问题。
  如果各位在使用过程中发现任何异常，欢迎随时 提出 Issue。
  我们会尽快进行分析并修正，再次感谢大家的支持与体谅。
