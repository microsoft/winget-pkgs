  ## What's Changed
  ### Features
  • feat(control)：add generation-two CBOR operation parity by @appcypher in https://github.com/superradcompany/microsandbox/pull/1669
  • feat(cli)：add --no-stdin for exec and run by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1688
  • feat(network)：answer denied HTTP/HTTPS egress with 403 instead of a reset by @tobi in https://github.com/superradcompany/microsandbox/pull/1489
  • feat(network)：make the published-port TCP accept queue size configurable by @yashau in https://github.com/superradcompany/microsandbox/pull/1606
  • feat(sdk)：add fork naming with deprecated compatibility aliases by @appcypher in https://github.com/superradcompany/microsandbox/pull/1708
  ### Fixes
  • fix(cli)：prevent piped exec from hanging on stdin by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1674
  • fix(sandbox)：reject snapshot patches before creating storage by @rahulpatle-sol in https://github.com/superradcompany/microsandbox/pull/1607
  • fix(sandbox)：keep lower directory metadata for patch parents by @gerritlansing in https://github.com/superradcompany/microsandbox/pull/1690
  • fix(release)：repair labeling and retry registry propagation by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1698
  • fix(ci)：repair type generation and stabilize sandbox test cleanup by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1697
  • fix(network)：allow placeholders on trusted secret hosts by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1700
  • fix(network)：propagate guest FIN on published ports by @skorfmann in https://github.com/superradcompany/microsandbox/pull/1706
  • fix(network)：make readable denial responses opt-in by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1694
