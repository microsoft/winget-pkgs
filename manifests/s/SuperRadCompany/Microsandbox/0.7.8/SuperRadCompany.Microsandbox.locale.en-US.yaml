  • feat(snapshot)：configure filesystem state limits by @0xpolarzero in https://github.com/superradcompany/microsandbox/pull/1751
  ### Fixes
  • fix(db)：preserve SQLite locks during Linux identity checks by @toksdotdev in https://github.com/superradcompany/microsandbox/pull/1766
  • fix(filesystem)：update cached paths after Windows directory renames by @x0day in https://github.com/superradcompany/microsandbox/pull/1769
  • fix(metrics)：follow live memory resizes in memory limit and usage by @IIITManjeet in https://github.com/superradcompany/microsandbox/pull/1679
