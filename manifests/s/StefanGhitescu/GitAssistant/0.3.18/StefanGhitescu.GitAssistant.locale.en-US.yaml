PackageVersion: 0.3.18
PackageLocale: en-US

Publisher: Stefan Ghitescu
PublisherUrl: https://github.com/ONEoo7
PublisherSupportUrl: https://github.com/ONEoo7/ai_tools_git_assistant/issues

Author: Stefan Ghitescu
PackageName: Git Assistant
PackageUrl: https://github.com/ONEoo7/ai_tools_git_assistant

License: MIT
LicenseUrl: https://github.com/ONEoo7/ai_tools_git_assistant/blob/main/LICENSE
Copyright: Copyright (c) 2026 Stefan Ghitescu

ShortDescription: System-tray Git assistant powered by a local LLM served by LM Studio
Description: |-
  A system-tray assistant for Git that writes commit messages, reviews staged
  changes against your own rule tables, and audits repositories - using a local
  language model served by LM Studio, or a hosted provider if you prefer.

  Requires Git for Windows, which winget installs alongside it.

Moniker: git-assistant
Tags:
  - git
  - commit
  - llm
  - ai
  - code-review
  - developer-tools

ReleaseNotesUrl: https://github.com/ONEoo7/ai_tools_git_assistant/releases/tag/v0.3.18

# No documentation links, for now. An earlier attempt used `Documentation:`
# and `winget validate` called it an unknown field -- correctly: the field is
# `Documentations`, plural, and it takes a list, not a URL:
#
#   Documentations:
#     - DocumentLabel: README
#       DocumentUrl: https://github.com/ONEoo7/ai_tools_git_assistant#readme
#
# Left out rather than guessed at, since it is optional and this manifest is
# being submitted by hand for the first time.
ManifestType: defaultLocale
ManifestVersion: 1.12.0
