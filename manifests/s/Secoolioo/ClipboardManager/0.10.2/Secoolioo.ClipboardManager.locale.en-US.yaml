ShortDescription: Fast, private clipboard history for Windows – one shortcut, instant search, local only.
Description: |-
  Clipboard Manager runs in the notification area and remembers the text you copy. Press Ctrl+Shift+V,
  type a few letters and press Enter: the entry is back in your clipboard and focus returns to the app
  you came from. The history survives restarts, pins never expire, and duplicates move to the top.
  Everything stays on your PC: no account, no cloud, no telemetry. It respects the "do not record"
  markers of password managers and private browser windows and hides itself from screen sharing.
