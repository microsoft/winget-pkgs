ShortDescription: A wooden mannequin on your desktop that shows you a short stretch while the computer works.
Description: |-
  Desk Break is a small break reminder for Windows. A wooden mannequin appears on your screen and demonstrates a short stretch or exercise, counting reps or running a timer, while your computer is busy (for example while a build, a render or an AI coding agent is running).
  You can drag it, shrink it to just its head, or hide it. English and Hebrew interface.
  The 435 exercise animations it uses are also published as an open library (GLB, Blender and JSON, MIT licensed).
