ReleaseNotes: |-
  ## 2.21.0 (2026-10-22) ### 新增 - 解析记录支持按标题、链接搜索，并可按内容类型筛选 - 解析列表中下载记录里已有的项目以绿色对勾标出，可在解析列表设置中关闭 - 下载列表显示下载进度百分比与预计剩余时间 - 下载列表以标签显示画质、编码、音质、格式与附加内容，封面角标标明媒体类型与时长 - 下载列表支持按标题、文件名、UP 主、合集名、BV 号搜索，并可按状态与媒体类型筛选；筛选时顶栏的批量操作只作用于当前显示的任务
  ### 优化 - 优化下载列表显示效果 - 文件大小按单位调整显示精度：KB 取整，MB 保留一位小数，GB 保留两位小数
  ### 修复 - 修复使用附带的 FFmpeg 时，仅下载音频无法输出 m4a 文件的问题 - 修复 macOS 上退出程序时崩溃的问题 - 修复从源码运行时检查更新报错的问题 - 修复下载列表中新加入的任务不按所选排序方式排列的问题 - 修复部分 CDN 节点返回错误数据区间，导致下载的视频花屏、音画不同步的问题 - 修复 ASS 弹幕样式中的滚动时长与静止时长设置不生效的问题
