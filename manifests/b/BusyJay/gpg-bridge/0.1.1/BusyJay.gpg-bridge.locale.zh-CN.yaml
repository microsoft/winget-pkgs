PackageIdentifier: BusyJay.gpg-bridge
PackageVersion: 0.1.1
PackageLocale: zh-CN
ShortDescription: 在 Windows 上连接 openssh-portable 与 GnuPG 的桥梁。
Description: |-
  gpg-bridge 在 Windows 上把 openssh-portable 与 GnuPG 连接起来，让远程机器上的 SSH 会话能够使用你本地 Windows 上运行的 GPG agent。
  Windows 上的 GnuPG 并不使用原生的 Unix 域套接字，而 openssh-portable 也无法把本地套接字转发到 GnuPG 模拟出来的那一个。gpg-bridge 就是在两者之间搭起缺失的桥：既可以用 --extra 通过 TCP 端口转发，也可以在 gpg-agent 配置了 enable-putty-support 之后用 --ssh 通过命名管道转发。
Tags:
- gnupg
- gpg
- gpg-agent
