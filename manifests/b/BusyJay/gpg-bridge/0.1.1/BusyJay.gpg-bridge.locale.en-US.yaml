ShortDescription: A bridge that connects openssh-portable and GnuPG on Windows.
Description: |-
  gpg-bridge connects openssh-portable and GnuPG on Windows so that an SSH session on a remote machine can use the GPG agent running on your local Windows box.
  GnuPG for Windows does not use native Unix domain sockets, and openssh-portable cannot forward its local socket to the one GnuPG simulates. gpg-bridge supplies the missing link, either over a TCP port with --extra or through a named pipe with --ssh once gpg-agent is configured with enable-putty-support.
