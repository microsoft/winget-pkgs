ShortDescription: Agent that lets BURSU Connection Manager reach this computer behind NAT, with no port forwarding and no VPN
Description: |-
  BURSUlink is the agent half of BURSU Connection Manager's NAT traversal. Installed as a Windows service on a computer that has no public address, it keeps one outbound connection to a BURSUlink relay and lets members of the linked BURSUcloud database open SSH, SFTP, Telnet, RDP, VNC, WinRM and AppleRD sessions to that computer, or, in gateway mode, to the hosts on an allow-list around it. Each session is authorised by a signed two-minute pass from the portal and encrypted end to end; the connection goes direct whenever the NATs allow it and through the relay otherwise. The service starts with Windows, before anyone signs in; a status icon and window let a signed-in user link the computer with a one-time code or a portal sign-in.
