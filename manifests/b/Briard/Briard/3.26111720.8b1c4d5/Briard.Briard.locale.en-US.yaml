ShortDescription: Self-hosting. Just the fun part. Run self-hosted apps like Home Assistant on the PC you already have.
Description: |-
  Briard runs self-hosted apps, like Home Assistant and Mealie, on the Windows PC you already have.
  One button installs an app, one click undoes a change, and your data stays home.

  Briard runs the apps in a small Linux virtual machine that it keeps for you. Installing it adds
  two Windows services, installs OpenVPN's TAP network driver, turns on the Windows Hypervisor
  Platform and builds a network bridge, then asks for one restart. The PC needs hardware
  virtualization (VT-x / AMD-V) turned on in its firmware settings.

  Briard updates itself. Uninstalling keeps your apps' data in C:\ProgramData\briard\state, so
  installing again picks up where you left off.
