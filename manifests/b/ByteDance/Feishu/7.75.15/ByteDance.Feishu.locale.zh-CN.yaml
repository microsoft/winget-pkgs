ReleaseNotes: |-
  豆包工作
  - 豆包工作，一款面向生产力场景的全新 Agent 产品。豆包工作能围绕用户目标自主拆解任务、调用工具、持续推进复杂工作流程。豆包工作还与飞书深度打通，让 Agent 基于企业上下文更准确地完成工作。如需申请开通，请联系客服。
  多维表格
  - 多维表格新增 SMALL、LARGE、LET、SQRT、LOG、LN、EXP、PRODUCT、STDEV 和 RANDOMARRAY 共 10 个公式函数，支持取数组第 k 个最小值或最大值、复用中间变量、进行开方和对数计算、求乘积与样本标准差，以及生成随机数组等场景，公式处理更灵活。
  - 在多维表格中使用表单视图时，你可以设置为有人提交后自动通知指定对象，方便及时查看填写情况；还可以设置定时提醒和催填，进度跟进更省心。
  - 你可以在多维表格中插入签字字段，支持手写签字和输入签字两种方式，适用于审批确认、门店巡检、验收、培训签到、会议签到等场景中的签字留痕需求。场景应用更广泛，业务留档更便捷。
