# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: BlockchainGravity.Terminal
PackageVersion: 0.1.0-beta.9
MinimumOSVersion: 10.0.19041.0
InstallerType: exe
# Velopack's setup. `--silent` and `/silent` are both understood - verified
# against the built binary rather than taken from documentation.
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
InstallModes:
  - interactive
  - silent
  - silentWithProgress
# Installs under %LOCALAPPDATA%, no administrator rights. Do not change to
# `machine`: the app is built to live in the user profile and its updater
# writes there.
Scope: user
# The app updates itself through Velopack from the same channel, so an
# installation will often be AHEAD of the version winget recorded. `install`
# rather than `uninstallPrevious` so an upgrade is the same operation the
# app's own updater performs.
UpgradeBehavior: install
ReleaseDate: 2026-09-24
Installers:
  - Architecture: x64
    InstallerUrl: https://api.blockchaingravity.com/downloads/beta/BlockchainGravityTerminal-0.1.0-beta.9-Setup.exe
    InstallerSha256: B1293AA5027B477BF9C3F2877A36E138730FF008BA1201CD9217AB5BDBDB9D7E
ManifestType: installer
ManifestVersion: 1.6.0
