ShortDescription: Displays Windows notifications as custom popups you can snooze, dismiss or open the source app from.
Description: |-
  Way Better Notifications replaces the Windows 11 notification popup with one you actually control.
  Captures the notifications Windows 11 delivers and shows them as your own custom popups: rounded cards
  with a subtle entrance animation that you can drag anywhere on your screen and keep visible for as long as you need.
  Features include snoozing with custom intervals, persistent history, source application launching on double-click,
  Do Not Disturb awareness, and full light/dark theme support.
