ShortDescription: Use an iPhone or iPad as a camera, microphone, trackpad and keyboard for your computer
Description: |-
  RemoteCrab turns an iPhone or iPad into the camera, microphone, trackpad and keyboard of a Mac or Windows PC over your own network, with no account and no cloud round trip. The desktop half can also open itself in any browser tab with a link and a six digit code, so the other side installs nothing.
