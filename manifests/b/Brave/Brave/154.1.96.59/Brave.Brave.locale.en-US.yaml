ReleaseNotes: |-
  Web3
  - Updated wallet to validate Solana mint addresses before NFT metadata/balance lookups. (#58531)
  - Updated wallet to use a popup window instead of opening the panel for submitted transaction. (#19595)
  Leo
  - Added support for rendering mathematical equations in Leo responses. (#56523)
  - Fixed incorrect error displayed for "Tab focus" when no matching tabs are found. (#58519)
  General
  - Added preview dialog for "Screenshot" tool. (#57937)
  - Updated VPN onboarding UI. (#57586)
  - Updated brave://settings/system "Memory" section to display "Always keep these sites active" selections. (#58960)
  - Updated location of "Screenshot" tool in hamburger menu from "Share" to "Save" section. (#58425)
  - Updated "Shift + Right click" override to check for canvas elements on page. (#56333)
  - Disabled Widevine in Tor windows and forced HTTPS on install as reported on HackerOne by newfunction. (#58453)
  - Fixed renderer crash when "UserMediaElement" is disabled. (#59012)
  - Fixed issue where onmibox calculation inputs were truncated in certain cases. (#54277)
  - Fixed toggle for "Improve search suggestions" under brave://settings/search not being persisted on browser restart. (#58943)
  - Fixed inability to edit startup pages under brave://settings/getStarted in certain cases. (#58846)
  - Fixed desktop shortcuts displaying the Chromium icon instead of the Brave icon. (#58499)
  - Fixed tab group hover card position when using vertical tabs. (#58592)
  - Fixed missing "WM_CLASS" and Wayland app ID for video Picture-in-Picture (PiP) window on Linux. (#57390)
  - Fixed issue where Brave News images weren't immediately rendered in the side panel. (#58411)
  - Upgraded Chromium to 154.0.8037.58. (#59235) (Changelog for 154.0.8037.58)
