ReleaseNotes: |-
  What's Changed
  - Updated the look and feel of the desktop app
  - Various under-the-hood improvements and minor bug fixes
  - Synchronized unlock for web, browser, and desktop
  ⚠️ Renamed Desktop download files
  Starting with this release, every Desktop download file starts with a license prefix: bit for the commercial build and oss for the open-source build.
  ───────────┬───────────────┬──────────┬───────────────────────────────────────────────────────────────────────────────────
  Build      │Previous prefix│New prefix│Example
  ───────────┼───────────────┼──────────┼───────────────────────────────────────────────────────────────────────────────────
  Commercial │commercial-    │bit-      │commercial-Bitwarden-{version}-universal.dmg →
             │               │          │bit-Bitwarden-{version}-universal.dmg
  ───────────┼───────────────┼──────────┼───────────────────────────────────────────────────────────────────────────────────
  Open source│(none)         │oss-      │Bitwarden-{version}-universal.dmg → oss-Bitwarden-{version}-universal.dmg
  ───────────┴───────────────┴──────────┴───────────────────────────────────────────────────────────────────────────────────
  All release files now follow the pattern {license}-{file}, where {license} is bit (commercial) or oss (open source). The rest of each file name is unchanged. This applies to every file on this release, including the Windows installers, .appx and .nsis.7z packages, macOS .dmg and .zip, Linux .AppImage, .deb, .rpm, .snap and .tar.gz, and the latest*.yml files.
  Do I need to do anything?
  - Scripts, Dockerfiles or CI pipelines that download a file directly from GitHub releases: update the file name. For example, .../download/desktop-v2026.11.0/commercial-Bitwarden-Installer-2026.11.0.exe is now .../download/desktop-v2026.11.0/bit-Bitwarden-Installer-2026.11.0.exe. Older releases keep their original names, so if you pin a version, update the name together with the version number.
    - A file name with no prefix, such as Bitwarden-Installer-{version}.exe, was the open-source build. To keep downloading the same build, use the oss- name. For the standard Bitwarden build, use the bit- name.
  - https://vault.bitwarden.com/download/?app=desktop&platform=… links: no change needed. They point to the new commercial (bit-) files.
  - Installed apps: no change needed. Desktop auto-updates as before.
  - Microsoft Store, Mac App Store, Snap and Chocolatey: no change needed.
  - Homebrew, winget and Flathub: no change needed on your side. These listings download files from this page by name, so version 2026.11.0 may reach them later than usual while their manifests are updated.
