ReleaseNotes: |-
  Overview
  - Added shared folder commands to the command line interface
  - Various under-the-hood improvements and minor bug fixes

  ⚠️ Renamed CLI download files
  Starting with this release, the commercial-license CLI zips include a bit license prefix. Their names now match the open-source builds, which already use bw-oss-*.
  ───────────┬────────────────────────────┬────────────────────────────────
  Platform   │Previous name               │New name
  ───────────┼────────────────────────────┼────────────────────────────────
  Windows x64│bw-windows-{version}.zip    │bw-bit-windows-{version}.zip
  ───────────┼────────────────────────────┼────────────────────────────────
  macOS x64  │bw-macos-{version}.zip      │bw-bit-macos-{version}.zip
  ───────────┼────────────────────────────┼────────────────────────────────
  macOS arm64│bw-macos-arm64-{version}.zip│bw-bit-macos-arm64-{version}.zip
  ───────────┼────────────────────────────┼────────────────────────────────
  Linux x64  │bw-linux-{version}.zip      │bw-bit-linux-{version}.zip
  ───────────┼────────────────────────────┼────────────────────────────────
  Linux arm64│bw-linux-arm64-{version}.zip│bw-bit-linux-arm64-{version}.zip
  ───────────┴────────────────────────────┴────────────────────────────────
  All release zips now follow the pattern bw-{license}-{os}[-arm64]-{version}.zip, where {license} is bit (commercial) or oss (open source). The open-source file names are unchanged.
  Do I need to do anything?
  - Scripts, Dockerfiles or CI pipelines that download a zip directly from GitHub releases: update the file name. For example, .../download/cli-v2026.11.0/bw-linux-2026.11.0.zip is now .../download/cli-v2026.11.0/bw-bit-linux-2026.11.0.zip. Older releases keep their original names, so if you pin a version, update the name together with the version number.
  - https://vault.bitwarden.com/download/?app=cli&platform=… links: no change needed. They point to the new files.
  - npm (@bitwarden/cli), Chocolatey, Snap and Homebrew: no change needed.
  bw update: from 2026.11.0, bw update links to the exact zip for your license, operating system and CPU architecture. Earlier versions now show the releases page instead of a direct download link. Previously, open-source and arm64 users could be sent the wrong build.

