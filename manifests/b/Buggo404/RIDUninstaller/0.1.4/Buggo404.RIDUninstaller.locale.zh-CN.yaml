PackageIdentifier: Buggo404.RIDUninstaller
PackageVersion: 0.1.4
PackageLocale: zh-CN
Publisher: Buggo404
PackageName: RID Uninstaller
License: MIT
ShortDescription: 开源的 Windows 卸载工具：连同残留一起清理，删除的内容可以还原。
Description: |-
  RID Uninstaller 先运行程序自带的卸载程序，再查找它留下的文件夹、注册表项、服务和快捷方式。
  每一项残留都标明被找到的依据，受保护的位置和其他程序的目录一律拒绝删除，删除的内容先进隔离区，可以整批还原。
  还支持安装追踪（基于 Windows 事件追踪，不装驱动）、强制删除、批量卸载和启动项管理。
