ShortDescription: Open-source uninstaller that removes programs together with their leftovers and can restore what it deleted.
Description: |-
  RID Uninstaller runs a program's own uninstaller, then finds the folders, registry keys, services and shortcuts it left behind.
  Every leftover shows the evidence it was found by, protected locations and other programs' folders are always refused, and everything removed goes to a quarantine it can be restored from.
  It can also record what a setup program creates (using Windows event tracing, no driver), force-remove programs with broken uninstallers, uninstall in batches, and manage startup entries.
