ShortDescription: A keyboard-driven wallpaper picker overlay for Windows.
Description: >-
  Press a hotkey and a translucent overlay drops over everything: a horizontal
  strip of your wallpapers, sheared into leaning parallelograms. Scroll it with
  vim keys, hit Space, and the wallpaper changes and the app is gone. No tray
  icon, no daemon, no window to manage. Gladius is a Windows port of
  hyprquickpaper, rewritten from scratch in Python and PySide6, with the
  original's three best-known papercuts fixed.
