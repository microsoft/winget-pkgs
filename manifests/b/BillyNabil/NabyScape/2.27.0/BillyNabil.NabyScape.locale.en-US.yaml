ShortDescription: A customizable Windows desktop island for music, focus, live lyrics and your own AI companion.
Description: |-
  NabyScape brings music controls, everyday tools and an optional AI companion into one configurable island at the top of your screen.
  - Music controls with live synced lyrics and a cover-inspired glow
  - Focus timers, work and break sessions, and a stopwatch
  - Notes, tasks, clipboard history, a file shelf, calendar and weather
  - Naby, an optional AI companion with chat and voice (bring your own provider or local model)
  - Dark, Light or Follow Windows themes, in six interface languages
