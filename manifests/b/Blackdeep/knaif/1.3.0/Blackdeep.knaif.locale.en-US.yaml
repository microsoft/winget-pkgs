ShortDescription: Turn natural-language requests into validated, executable action plans
Description: |-
  knaif turns plain-language requests into validated commands for local tools, with a small model
  running on your own PC. The model only proposes a plan; knaif validates it, shows it and runs it
  through skills such as ffmpeg (video and audio) and documents (PDF and Office files).
