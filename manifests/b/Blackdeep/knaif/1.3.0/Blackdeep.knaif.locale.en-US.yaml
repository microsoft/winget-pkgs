InstallationNotes: |-
  Download the AI model before the first run (~2.5 GB, into ~/.knaif/models):
    knaif models pull knaif-qwen3-4b-v2
  On an NVIDIA GPU, faster inference (~668 MB): knaif backend install cuda
  To see what each skill still needs: knaif skills deps
