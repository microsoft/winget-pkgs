ReleaseNotes: |-
  Designs saved in 0.22.0 use format 35 and don't open in 0.21.0 or older.
  SolidCraft is open-source parametric 3D CAD in Rust: sketch, constrain, extrude, and change a parameter to watch the timeline rebuild. Website · documentation · try it in the browser · Discord · issues.
  Highlights
  - Render workspace (first release): a new Render tab with GPU rendering, studio lighting, materials, and image export (#6050, #5494).
  - Frames: a profile library and frame members along sketch lines (#4004).
  - Holes: place a hole by distances from reference edges, snap to face and round-edge centres, and drag placed holes. Tapped holes gain metric fine, UNC/UNF and G/Rp catalogues (#2931, #2912, #4178).
  - 3D mouse: driver choice, guided calibration, and button mapping (#3825).
  - Assemblies: the first part is grounded, and free joint chains can be dragged (#2805).
  - Control channel and MCP are on by default, with a setting to turn them off (#5561).
  Modelling and sketching
  - Mirror and pattern can use a pattern or mirror feature as the source (#3998).
  - A spherical shell revolves into a solid with a void (#4182).
  - Extrude switches to To Object when you pick a face, vertex or plane off the profile (#2855).
  - Press Pull sends curved faces to Offset Face (#3463).
  - Coil parameters can be shown and edited (#3915).
  - Pressing a sketch tool's shortcut again cycles its creation modes (#3564).
  - Equal works with three or more curves (#5139).
  - Trim cuts a line at its tangent point on a circle (#5163).
  - The Line tool snaps a diameter through a circle's centre (#4327).
  - Slots and 2-point circles take typed dimensions (#4318, #3335).
  - Cancel Sketch leaves a sketch without keeping its changes (#3938).
  Interface
  - The browser's view is saved with the design, with an option to hide the origin by default (#1849).
  - Design tabs can be reordered by dragging (#3188).
  - Picking a body in the viewport scrolls the browser to it (#3081).
  - Feature menus gain Rename and Delete (#4342).
  - Reference geometry can show through bodies (Preferences, off by default) (#2697).
  - Exploded views export as an animation (#3744).
  - On Linux, you can choose Wayland or X11 (#3084).
  - Agent chat can attach the current selection as context (#2288).
  Fixes
  - Linked components' joints keep their faces after Update Links (#4874).
  - A rigid joint is no longer saved with the wrong occurrence when two occurrences share a component (#3939).
  - Renaming parameters, planes and axes keeps the references that use them (#4423, #4354, #4449).
  - Suppressing a feature keeps later features' body names (#4311).
  - Deleting an inserted file removes its components and joints (#4113).
  - DXF writes and reads Béziers at their own degree (#5281).
  - 3MF imports from Bambu Studio name bodies after their objects (#3859).
  - FreeCAD and Rhino import also work in the browser (#4482).
  Compatibility
  0.22.0 writes design file format 35 (0.21.0 wrote 34). It opens every earlier design, but 0.21.0 and earlier refuse a design saved by 0.22.0.
