ReleaseNotes: |-
  Why 0.15: a minor release with a new icon set, sweep rails, motion analysis, many modelling and STEP fixes, and a new design file format (26). SolidCraft now lives at tangency-labs/solidcraft; old links redirect. If you're on 0.14.0 or older, download this one by hand: the in-app update check in older versions doesn't follow the move. From 0.15.0 on it does.
  New
  - A new icon set: every command has its own icon, in toolbars, menus, the command palette, the browser and the timeline (#853).
  - Modelling: sweep along guide rails and two-rail sweep (#1806); Class-A surfacing part 3: blend curves, curved-edge fillets, the G2 corner and continuity analysis (#1642, #1247); Split Body by a plane lying on a face (#1897); Thread suggests the cylinder size, with metric diameter and pitch (#1759); Midplane asks for its two planes (#1846).
  - Assemblies and motion: cam and follower joints (#1734); motion analysis charts and collisions along a study (#1712); export a study or a joint drive as an animated GIF (#1680); a clearance report (#1900); mirror placed components' bodies (#1896).
  - Sketch: rectangles, circles and polygons draw by press, drag and release (#1641); Explode Text into ordinary curves (#1921); the view goes orthographic while a sketch is open (#1758); Ctrl+Space opens expression suggestions (#1852); mixed numbers such as 2 1/8" (#1820).
  - Navigation: hold Space to pan (#1754); Look At pressed again looks from the other side (#1904); 3D mice: any HID multi-axis controller, per-axis invert and speed, and spacenavd on Linux (#1880, #1814, #1825). The grid stays on the ground plane; Preferences ▸ Grid follows the view turns it to face side views (#2035).
  - Agent chat: answers render as Markdown, and Antigravity replaces the retired Gemini CLI (#1778, #1795).
  - Browser app: a JavaScript command API (#1713).
  - Languages: Spanish (Spain), Brazilian Portuguese, Galician and Czech, plus French and Ukrainian updates and a Thai font fallback (#1689, #1735, #1771, #1752, #1676, #1632, #1913).
  Fixed
  - Booleans and cuts: whole-turn round faces from STEP, prism cuts whose walls only touch, text cut into large parts, blind cuts that kept small rounds, a cut that took other sketches (#1892, #1894, #1903, #1593, #1310).
  - Fillets: mixed arc and line corners, rolling-ball strip ends, rounds on both sides of a wall, the suggested radius beside a hole (#604, #1702, #1720, #1885).
  - STEP: hyperbola and parabola edges, periodic B-splines, seam-bounded balls, nested assembly parts on export (#1832, #1916, #1742, #1895); large STEP assemblies stay responsive (#1762).
  - Viewport: hidden edges no longer show through faces and thin faces stop flickering; faster picking; missing surfaces after a skipped startup frame (#1768, #1776, #1791).
  - Updates: Windows relaunches SolidCraft after an update, and the updater recognises MSI installs outside Program Files (#1748, #1873).
  - macOS: saving to a network share works (#1741).
  Compatibility
  Designs saved by 0.15.0 use file format 26 and don't open in 0.14.x or earlier. Older designs open and rebuild as before.
