ReleaseNotes: |-
  Designs saved in 0.24.0 use format 39 and don't open in 0.23.1 or older.
  SolidCraft is open-source parametric 3D CAD in Rust: sketch, constrain, extrude, and change a parameter to watch the timeline rebuild. Website · documentation · try it in the browser · Discord · issues · roadmap.
  Security
  - Links and design fonts ask before following a network location. A design that points at a file on another computer (for example \\server\share\part.solidcraft) no longer reaches it silently: Update Links and Open Linked Design ask first, with Allow once or Always allow this server, and Preferences › Design keeps the list of trusted servers. Please update. Details will follow in a security advisory (#7372).
  Highlights
  - Edit a dimension without opening the sketch: with a sketch's dimensions shown, double-click one in the model view, type a value or expression and the model rebuilds (#7080).
  - Return to the previous view when a sketch ends: a new option, off by default, in Preferences › Sketch (#7043).
  - Weldments ribbon tab for frames, and placement handles for Rest, Boss and Snap Fit, with base-height and new-body options for Snap Fit (#5262, #5362, #6911).
  - 3D arc sketch command, and left- or right-handed threads (#5682, #4415).
  - New themes: Clay and Clay Dark, warm paper and charcoal with a terracotta accent (#7342).
  - Smoother: features apply off the window thread, so the window stays responsive while the model rebuilds (#3135, #7002).
  Interface
  - The agent chat shows tool calls as plain summaries (no long file paths), with the details one click away (#6245).
  - Reopening a design that's already open switches to its tab (#2414); Ctrl+Shift+S opens Save As (#6567).
  - Sketch dimension labels show their unit, and the dimension box uses the design's units (#6131, #3878).
  - New option, off by default: perspective while orbiting, orthographic on face-on views (#6700). Perspective is now a command, so a 3D mouse button can switch it (#6143).
  - The History docked under the Browser follows the Browser's translucency (#6922).
  - Navigation bar view commands (#6586).
  Fixes
  - Top-level cut and join reach bodies in sub-components; linked components stay valid through Undo after Save As (#6246, #6877).
  - Insert Design keeps the source part's properties (#6691); large meshes save once compressed (#6701).
  - Many sketch fixes: offset slots, circles at the origin, nested circles, constraints to any body's edges.
  Windows
  - Windows builds now go through SignPath code signing (test certificate for now; the production certificate is on its way).
  Compatibility
  0.24.0 writes design file format 39 (0.23.1 wrote 38). It opens every earlier design, but 0.23.1 and earlier refuse a design saved by 0.24.0.
