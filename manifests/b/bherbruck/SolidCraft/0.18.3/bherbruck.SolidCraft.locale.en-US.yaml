ReleaseNotes: |-
  Why 0.18.3: a patch release of compatible fixes and small additions on top of 0.18.2.
  New
  - Align takes the origin planes, construction and sketch planes, and the origin point, and stays parametric (#4248).
  - Threads: a modelled thread on a shaft thicker than the thread turns the shaft down to the major diameter instead of refusing, so an M6 on an 8 mm shaft works (#4256).
  - View: held arrow keys turn the view smoothly (#4090).
  - Large STEP assemblies keep their display plans and reopen from the model cache instead of converting the STEP again (#4021).
  - Agents: commands sent over the control channel can compute off the window thread, so the window stays live (opt-in) (#3340); control.running lists what the app is running across connections (#3689).
  Fixed
  - Face names: pieces of a split face keep their numbers from one evaluation to the next; older designs keep their numbering (#3991).
  - Speed: sketching on a face no longer meshes the body twice, about 1 s faster per feature after a split (#3981).
  - Modeling: joins, cuts and intersects meet their tools where they're shown across placed components (#3384); holes from a sketch on a body's face drill that body (#3770); extrude to an edge or corner ends at the requested plane (#3748); extrudes from a nested STEP part's face join and cut it (#3852); mirrored and copied sheet bodies stay sheet metal (#3354); Split Body pieces can be renamed one by one (#3527); Shell shows its tangent-chain face selection (#3809).
  - Sketch: type-first horizontal/vertical dimensions keep the picked points (#3168); sketches no longer also show under Features in the browser (#3584).
  - Measure: a body's volume no longer drifts with its position (#2069).
  - Files: designs with STEP imports over 256 MB save (#3285); IGES import closes small gaps between trim pieces (#3846); 3MF production-extension import is stricter about what it reads (#3628); STEP export starts merged cylinder and cone loops on the right side (#3557).
  - UI: Move respects the selected component (#3588); Delete in Edit Joint deletes that joint, and a refused delete says why (#3776); Section Analysis Edit reopens where you left it (#3617); expressions accept a leading decimal comma such as ,5 (#3797); Settings › AI › Add agent opens from the Home tab (#3522); AI chat retries without reasoning when OpenAI refuses tools (#3817); a transform that isn't an affine placement is refused (#3900).
  Compatibility
  0.18.3 writes design file format 29 (0.18.2 wrote 28): Align's plane references, split-face piece names and sheet-metal perforation sides. 0.18.3 opens every earlier design, but 0.18.2 and earlier refuse a design saved by 0.18.3.
  Thanks
  Thank you to everyone who contributed to this release: @afaber999, @amolinari-autotex, @bluecmd, @cfaulkingham, @jeremymiribung-blip, @jyviko, @kaltenbrunnermarkus, @kezmdor, @mknutso-2, @NOWN-DEV, @phanoob, @raykholo, @rlartot, @SS-EN, @SychPL and @Tyler-Chiriboga.
  Install
  Upgrading from 0.7 or earlier. 0.8 changed the Linux app ID to ai.storyteller.solidcraft:
  flatpak update offers to replace the old app, and the .deb, .rpm and AppImage remove the old
  menu entry.
  Upgrading from 0.5 or earlier. 0.6 renamed SolveCraft to SolidCraft and made the zip
  container the default save format. .solvecraft designs, old settings folders and
  SOLVECRAFT_* variables are still picked up, and solvecraft-cli still forwards to
  solidcraft-cli. Want plain JSON? Use File ▸ Save As JSON… or --save design.json. On
  macOS, replace SolveCraft.app with SolidCraft.app. Details:
  compatibility notes.
  Documentation, the browser app and the Flatpak feed use the SolidCraft project Pages URLs.
