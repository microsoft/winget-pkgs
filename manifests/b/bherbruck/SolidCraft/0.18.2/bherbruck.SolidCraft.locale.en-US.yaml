ReleaseNotes: |-
  Why 0.18.2: a patch release that puts back what the new ribbon interface in 0.18.0 lost, with import, modeling and sketch fixes that were ready alongside. Thanks to everyone who reported them.
  Fixes for the new interface
  - Parameters and Configurations are on the Model, Sheet Metal and Sketch tabs again, as well as Manage; Parameters opens without switching tabs (#3937).
  - Sheet Metal is a tab in every document again, with New Sketch first and Convert to Sheet Metal in the Create menu (#3937, #3946). The Surface tab leads with New Sketch too (#3964).
  - Finish Sketch is back at the bottom of the sketch palette as a full-width button (#3937), and on the Sketch tab it sits right after the last sketch panel instead of alone at the far right (#3958).
  - Browser: long names end in "…" inside the card, with the full name in the tooltip (#3940).
  - Solve Sketch no longer shows up in command search: sketches solve themselves after every edit (#3940).
  Sketching
  - Esc Esc finishes the sketch: two quick presses of Escape (within 0.4 s) finish it; with a tool out, the first press puts the tool down. A double Escape on a sketch you added nothing to removes it in one undo step, so no blank sketch is left behind. A single Escape still never leaves the sketch (#3950).
  - Symmetry about a line pairs line ends by their mirror image, so a rectangle's opposite sides no longer collapse to zero height or get refused (#3029).
  - 2-tangent circle starts from the circle that touches both curves instead of the click, so it no longer moves your curves or fails on fixed ones (#3210).
  Import and modeling
  - STEP import: a cone bounded only by its base circle reaches its point instead of coming in as a flat disc (#3871); a void written with its shell flag the other way round, as SOLIDWORKS does, reads as a cavity instead of adding its volume (#3872). A new regression sweep checks 17 parts of known shape from the step-conformance corpus on every change (#3880, #3901).
  - IGES import: a B-spline curve over a tiny knot span keeps the faces it bounds (#3886); groups and subfigure instances come in as nested components, and imported parts take their product names instead of Body1 (#1609).
  - Boolean: a small hole in a large body's face stays a hole when the face is divided (#2580).
  - Loft: sections turning past 90 degrees no longer build a folded solid (#3452); a circle lofted to a non-star-shaped profile, such as a comb, goes round once (#3670).
  - Extrude from a face rounded by fillets joins, and cuts whose walls only touch work, instead of failing after minutes (#2041).
  - Pattern and mirror of a join that merged its targets keep working (#3387).
  - Fillet and chamfer previews follow a radius or distance as it's dragged or typed (#3150).
  Also new and fixed
  - Document tabs: right-click a tab to close it, the others or all (#3152).
  - Ribbon tooltips give a two-sentence help for the main tools (#3089).
  - English (UK) is a language in Preferences (#2502).
  - Move ▸ Point to Point can pick the origin point, in the view or in the browser (#3718).
  - MCP: a failed batch with rollback: true restores the original document, even after file.new (#3288).
  - File menu: Export STL… and Export 3MF… replace Save as mesh…, and command search finds mesh export by stl, 3mf or print (#3873).
  - Recovery: every open design tab is autosaved on its own; switching to a clean tab no longer deletes another tab's recovery copy (#2952).
  Compatibility
  0.18.2 writes design file format 28, the same as 0.17, 0.18.0 and 0.18.1.
  Thanks
  Thank you to everyone who contributed to this release: @asd417, @bluecmd, @CamWight, @dahakbuilds, @denelson1-dot, @flukejones, @jeremymiribung-blip, @JZiegener, @phanoob, @plexi32, @raykholo and @rlartot.
  Install
  Upgrading from 0.7 or earlier. 0.8 changed the Linux app ID to ai.storyteller.solidcraft:
  flatpak update offers to replace the old app, and the .deb, .rpm and AppImage remove the old
  menu entry.
  Upgrading from 0.5 or earlier. 0.6 renamed SolveCraft to SolidCraft and made the zip
  container the default save format. .solvecraft designs, old settings folders and
  SOLVECRAFT_* variables are still picked up, and solvecraft-cli still forwards to
  solidcraft-cli. Want plain JSON? Use File ▸ Save As JSON… or --save design.json. On
  macOS, replace SolveCraft.app with SolidCraft.app. Details:
  compatibility notes.
  Documentation, the browser app and the Flatpak feed use the SolidCraft project Pages URLs.
