ReleaseNotes: |-
  Designs saved in 0.23.1 use format 38 and don't open in 0.23.0 or older.
  SolidCraft is open-source parametric 3D CAD in Rust: sketch, constrain, extrude, and change a parameter to watch the timeline rebuild. Website · documentation · try it in the browser · Discord · issues · roadmap.
  Highlights
  - Joints follow your parts: a joint placed on a hole rim, an edge or a corner now moves with it when the part changes (thicker, moved hole), for every joint type, in one design and through Update Links (#6942).
  - macOS: Undo, Redo, Settings and Help are back in the app bar (#6190).
  - Coloured components: each component gets its own colour, and you can change it (#2877).
  - Open and insert DXF files outside a sketch (#4635).
  - Sketch patterns take their count, spacing and angle from parameters (#5332).
  - Construction points and axes appear in the Browser and can be picked in the view and dialogs (#4320).
  Modelling and assemblies
  - Starting Extrude, Revolve or another feature finishes the sketch you're in (#2815).
  - Pipe has an Operation row, so it can join, cut or intersect (#5169).
  - Move and Align work on placed components, with previews (#4455).
  - Open a linked part from its assembly Browser row (#2349).
  - Loft takes a picked sketch point as an apex; arc-length dimensions from an arc and its end point (#5207, #4245).
  - A profile drawn twice is cut once (#5789).
  Interface
  - The grid fades with distance instead of cutting off (#4629).
  - A light 3D view in a dark window, and the reverse (#4147).
  - Look At in the viewport menu for a planar face or plane (#4497).
  - The Assistant warns when a turn ends without using SolidCraft's tools, and when an Ollama model has no tool support (#5188, #4916).
  Docs
  - A short, user-facing roadmap (#6797), local models with the Assistant (#4964), and what to do when a design won't open (#5114).
  Compatibility
  0.23.1 writes design file format 38 (0.23.0 wrote 37). It opens every earlier design, but 0.23.0 and earlier refuse a design saved by 0.23.1.
  Thanks
