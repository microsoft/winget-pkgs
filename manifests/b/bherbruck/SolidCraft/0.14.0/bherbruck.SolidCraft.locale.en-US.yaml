ShortDescription: Open-source parametric 3D CAD built in Rust.
Description: SolidCraft is an open-source parametric 3D CAD application built in pure Rust. Sketch, constrain, extrude, and change a parameter to watch the timeline rebuild. It runs on desktop and web, and can be automated through MCP with solidcraft-cli.
