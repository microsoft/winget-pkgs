ReleaseNotes: |-
  Designs saved in 0.23.0 use format 37 and don't open in 0.22.1 or older.
  SolidCraft is open-source parametric 3D CAD in Rust: sketch, constrain, extrude, and change a parameter to watch the timeline rebuild. Website · documentation · try it in the browser · Discord · issues · roadmap.
  Highlights
  - Section views are solid again: bodies behind the cut no longer show their colour through the cap, and hovering the cut no longer lights up what it hides (#6728, #6722).
  - Cosmetic threads are drawn on internal and external threads (#2868).
  - Text parameters: sketch text built from a parameter follows every change (#6364).
  - Web app opens a design from a link, with an embed mode for sharing (#6253).
  - Sheet metal: Perforate, and edge flanges with material outside and tangent bend positions (#4404, #6060).
  - Pick your graphics card in Preferences (#6010).
  Modelling and sketching
  - The Timeline shows only the active component's features (#3543).
  - Mesh export has a quality choice, so small round features get enough sides (#4773).
  - A sketch point on the origin can be dragged; finished sketches on a face stay visible with a dark halo (#4837, #4956).
  - Pattern edits preview while dragging; zero-length distance dimensions keep a sketch fully constrained (#4426, #4397).
  - Split-face names stay short however many times a face is split (#6045).
  Interface
  - New themes: Okibi (dark) and Akari (light) (#5731).
  - One set of X, Y and Z colours for the origin axes, view triad and Move gizmo (#4430).
  - The AI assistant picks the provider first, then its model (#5565).
  - New translations: Norwegian Bokmål, plus large Brazilian Portuguese, Ukrainian and Danish updates (#4556, #5776, #4136, #4051, #4223).
  Fixes and speed
  - Ambient occlusion no longer shows ghost copies of the model (#4251).
  - Measure reports no volume or mass for open surface bodies (#4268).
  - Faster joint solving and component listing on large assemblies (#6393, #6395).
  Compatibility
  0.23.0 writes design file format 37 (0.22.1 wrote 36). It opens every earlier design, but 0.22.1 and earlier refuse a design saved by 0.23.0.
