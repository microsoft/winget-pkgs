ReleaseNotes: |-
  Why 0.19.0: a minor release for the reworked workspace: a Compact layout, shared panel containers, and a redesigned Assistant and History. It also includes the fixes that landed since 0.18.4.
  New interface
  - Compact layout: Preferences › General offers Floating or Compact. Compact joins the workspace panels with single borders, and folded Browser and History stacks give the room back to the view (#4533).
  - Show text under ribbon icons: turn it off for a ribbon 24 points shorter, in either layout. Tooltips and command menus stay (#4533).
  - Assistant is redesigned: grouped tool results with expandable failures, approval cards, setup guidance and a composer pinned to the bottom. It fills the height of the view on either side (#4533).
  - History is a resizable panel with beginning, back, forward and end controls. Dock it at the bottom, full height on the left, or under the Browser (#3953).
  - Shared containers: panels, windows, confirmations and menus are built from one container, so they look and behave alike (#4533).
  Themes
  - 14 official themes (#4602): SolidCraft 95, Platinum 9, Cupertino, Green Phosphor, Amber Phosphor, Blueprint and One Dark, plus palettes: Tokyo Night, Solarized Light, Nord, High Contrast, Graphite, Nosferatu and Catppuccin Mocha.
  New
  - Free orbit (opt-in, Preferences › Navigation): mouse and 3D mouse orbit turn freely through the poles. Normal to Selection is in the face context menu, and shares Ctrl+8 and Look At (#1912).
  - Sketch dimensions: typing name = value in a dimension adds that user parameter and dimensions with it (#3638).
  - Tapped Hole: Custom stays chosen and its nominal diameter can be edited (#2441).
  - Bug report asks labelled questions in a padded form (#2246).
  Fixed
  - Camera: Orbiting no longer lags after using the view cube; view changes still glide (#4596).
  - Chamfer: a chamfer on a pin standing near walls no longer cuts slivers out of the walls (#4539).
  - Mirror: copies of a placed component's bodies join their source's component and survive inserting the same file again (#1938).
  - Extrude: a cut sketched with an empty root active is no longer refused when it goes through a component's part (#3363).
  - Sketch: a centre circle drawn through a snapped point stays on it (#3277); MidPoint takes two lines (#3836); trim and extend refuse an offset's ends instead of silently undoing (#3918).
  - Parameters: a new parameter's expression starts blank and Tab selects a field (#3096); clicking a suggestion inserts it (#3260).
  - Dialogs picking a plane show the origin planes in the view, even with the Origin hidden (#2618).
  - Rename: Tab, or leaving the box, keeps the new name (#3336).
  - Files: Export Current View as DXF includes shown sketches (#3780); separate closed pieces of one IGES part come in as separate solids (#3972).
  - CLI: --help prints to stdout and exits 0 (#1828).
  Compatibility
  0.19.0 writes design file format 30 (0.18.4 wrote 29) for Mirror copies that join their source's component. 0.19.0 opens every earlier design, but 0.18.4 and earlier refuse a design saved by 0.19.0.
  Thanks
  Thank you to everyone who contributed to this release: @amolinari-autotex, @crono2250, @dannyow, @DuBearte, @Mauznemo, @Nathan-Dane, @NOWN-DEV, @phanoob, @raykholo, @takuto-NA and @Tyler-Chiriboga.
  Install
  Upgrading from 0.7 or earlier. 0.8 changed the Linux app ID to ai.storyteller.solidcraft:
  flatpak update offers to replace the old app, and the .deb, .rpm and AppImage remove the old
  menu entry.
  Upgrading from 0.5 or earlier. 0.6 renamed SolveCraft to SolidCraft and made the zip
  container the default save format. .solvecraft designs, old settings folders and
  SOLVECRAFT_* variables are still picked up, and solvecraft-cli still forwards to
  solidcraft-cli. Want plain JSON? Use File ▸ Save As JSON… or --save design.json. On
  macOS, replace SolveCraft.app with SolidCraft.app. Details:
  compatibility notes.
  Documentation, the browser app and the Flatpak feed use the SolidCraft project Pages URLs.
