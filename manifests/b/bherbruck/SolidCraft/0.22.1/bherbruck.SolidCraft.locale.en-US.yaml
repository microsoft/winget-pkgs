ReleaseNotes: |-
  Designs saved in 0.22.1 use format 36 and don't open in 0.22.0 or older.
  SolidCraft is open-source parametric 3D CAD in Rust: sketch, constrain, extrude, and change a parameter to watch the timeline rebuild. Website · documentation · try it in the browser · Discord · issues.
  Highlights
  - AI apps just work: SolidCraft adds itself to the AI apps on your computer (Claude Desktop and Claude Code, Codex, OpenCode, Gemini CLI, Copilot CLI, Cursor, VS Code, Windsurf and Zed). Open one and ask it to build something; it drives the SolidCraft window you have open. Help > Connect AI assistants re-runs it, and Settings > Assistant turns it off (#6379, #6388).
  - solidcraft-cli on PATH everywhere: the Windows installer, the macOS app and the AppImage now put solidcraft-cli on PATH (#6340, #6347).
  - Signed and notarized on macOS: no more right-click > Open on first launch (#6016).
  - Agent chat has no per-message limit by default; an Unlimited checkbox on the AI page sets one if you want it (#6349).
  - Sheet metal Path Flange, and bend angles shown as the included press-brake angle (#4096, #6040).
  Modelling
  - Fillets on several bodies keep each edge on its own body after parameter changes (#6378).
  - Holes get an independent tapping depth and recessed drill points (#4486).
  - Offset Plane through a point; Revolve takes a planar body face as its profile; sketch on the sides of a thin extrude (#3765, #5170, #5781).
  - Sketch: snap where two curves cross, symmetry between two fixed lines, point/circle to circle dimensions (#5342, #3895, #4065).
  Interface
  - Section views no longer show edges behind the cut through the cap (#6363).
  - Each design tab keeps its own agent chat (#5612).
  - A warning when a design is open elsewhere or changed on disk (#5468).
  - Editing an Extrude or Revolve shows its sketch; command windows keep their place (#5443, #5444).
  - Value fields step with the arrow keys and mouse wheel; lengths respect the design's units (#2608, #3315).
  Fixes and speed
  - Joints on imported parts and moved holes stay where they belong (#6368, #6370, #6374).
  - Faster joint solving, parameter edits and inspection on large designs (#6372, #6418, #6412, #5839).
  - Windows OpenGL uses the system title bar so clicks line up with the picture (#4403).
  Compatibility
  0.22.1 writes design file format 36 (0.22.0 wrote 35). It opens every earlier design, but 0.22.0 and earlier refuse a design saved by 0.22.1.
