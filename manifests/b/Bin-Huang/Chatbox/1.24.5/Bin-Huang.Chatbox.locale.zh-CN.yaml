ReleaseNotes: |-
  1. 支持导入 DeepSeek 对话
  2. 支持 DeepSeek 官方联网搜索、网页抓取和 OCR
  3. Chatbox AI 生图支持点数计费，工作模式审批时会显示本次消耗
  4. 消息操作新增「压缩到这里」，压缩范围包含当前消息
  5. 更新各家内置模型列表，新增 GPT-6、Claude 5.5、Gemini 4 等近期模型
  6. 不支持识图的模型会复用此前识别过的图片文字，避免后续轮次重复识别
  7. 优化知识库检索，并加快复制大型对话的速度
  8. 修复工作模式菜单被遮挡、缺失会话无法删除等问题
  9. 修复移动端备份入口和图片模型列表的显示问题
