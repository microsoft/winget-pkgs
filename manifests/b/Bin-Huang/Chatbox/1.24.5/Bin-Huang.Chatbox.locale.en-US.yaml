ReleaseNotes: |-
  1. Added DeepSeek conversation import
  2. Added DeepSeek official web search, page fetching, and OCR
  3. Chatbox AI image generation now supports point billing, and Work Mode approvals show the points that will be used
  4. Added “Compact to here” in message actions; the compacted range includes the current message
  5. Updated built-in provider model lists, including recent models such as GPT-6, Claude 5.5, and Gemini 4
  6. Models without vision can reuse previously recognized image text, avoiding repeated OCR on later turns
  7. Improved knowledge base retrieval and made copying large conversations faster
  8. Fixed the Work Mode menu being covered and missing chats that could not be removed
  9. Fixed backup actions and the image model list on mobile
