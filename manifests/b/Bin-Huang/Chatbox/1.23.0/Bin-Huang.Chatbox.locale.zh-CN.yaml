ReleaseNotes: |-
  1. 新增持久记忆：新对话也能记住你留下的关键事实，支持全局记忆或为单个搭档单独配置
  2. 工作模式新增 Soul 设置，用于定义 AI 的性格和行为底线
  3. 生成过程中支持排队发送新消息，也可立即插入
  4. 工作目录和权限沿用上次配置，在输入框上方即可快速修改
  5. 「完全访问」模式默认不再每 25 步暂停确认
  6. 支持视觉的模型可自动打开本地图片或刚下载的文件进行识别
  7. 优化长任务上下文保持：工具结果不再过早丢弃，上下文压缩时优先保留最近对话
  8. 归档对话支持一键清空；工具调用结果中的文本内容可直接预览
  9. 新增腾讯混元、小米 MiMo、LongCat、智谱 GLM Coding Plan、OpenCode Zen / OpenCode Go，并支持自托管 SearXNG 搜索引擎
