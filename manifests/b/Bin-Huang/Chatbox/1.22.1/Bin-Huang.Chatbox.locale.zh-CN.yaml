ReleaseNotes: |-
  1. 新增工作模式：AI 可运行代码、调用工具、处理电脑中的文件，还可查找历史对话和生成图片，自主完成复杂任务。了解更多
  2. 新增技能（Skills）：可安装和管理可复用的 AI 能力，内置技能库持续更新
  3. 新增完整数据备份，可一并导出和恢复对话、图片及附件
  4. 重新设计模型选择器，支持搜索及按模型设置思考深度
  5. 新增对话小地图，方便浏览长对话
  6. 全新新手引导，提供开箱即用的示例
  7. 支持归档对话，并在侧边栏显示对话创建时间
  8. 移动端支持 PDF 文件
  9. 优化回复的流式显示、自动滚动和思考状态展示
  10. 更新 DeepSeek 预置模型，并提升 MCP 服务兼容性
  11. 多项问题修复与稳定性优化
