ReleaseNotes: |-
  ## New Features

  • **Form / Code View in User Defined Dialog**：Added a persistent **Form / Code** mode toggle across both the **Functions** and **Units** tabs, letting you switch between the structured form and v7-style JavaScript object syntax while keeping definitions synced and remembering your last-selected mode.
  • **JavaScript Syntax Highlighting for UDF / UDU**：Replaced plain textareas with CodeMirror JavaScript editors for the function body and Code mode editors, complete with light/dark theme styling, syntax-highlighted single-line and multi-line list previews, bracket matching/auto-close, comment toggling (`Ctrl+/` / `Cmd+/`), quick save (`Ctrl+Enter` / `Cmd+Enter`), undo/redo support, and context menu support.
  • **Expanded UDF / UDU Dialog Layout**：Increased the dialog height and removed the redundant Save icon from the Save buttons.

  ## Improvements & Security

  • **Worker-Only UDF Validation**：Moved user-defined function validation completely into the calculation Web Worker (with automatic rollback and timeout handling), removing main-thread evaluation of UDFs.
  • **Calculation Worker Lockdown**：Restricted access to network, storage, channel, and messaging globals inside the calculation Web Worker.
  • **Form Parameter Validation**：Added strict validation for Form-mode UDF parameter lists (`empty`, `()`, comma-separated identifiers, optional trailing `...rest`) while preserving complex parameter signatures entered in Code mode.
  • **Mobile Page List Behavior**：Disabled docked page list mode and the dock toggle button on mobile devices, defaulting `Page list position` to **Floating** (with **Floating** and **Tabs** available).

  ## Bug Fixes

  • **Faster Linux AppImage Startup (#335)**：Switched Linux AppImage compression to `gzip` to eliminate multi-second startup decompression delays under maximum `xz` compression.
  • **Legacy v7 UDF Migration Edge Case**：Fixed an uncaught error during v7 -> v8 migration when legacy object shorthand methods use default or destructured parameters.
  • **Modal Reopen Handling**：Deduplicated deferred modal reopen callbacks when reopening a modal during a hide transition.
