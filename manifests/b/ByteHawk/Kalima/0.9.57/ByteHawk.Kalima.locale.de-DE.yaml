ShortDescription: Live-Transkripte und Übersetzungen für alles, was gesprochen wird.
Description: |-
  Kalima macht aus allem, was gesprochen wird, durchsuchbaren Text, und zwar live: Meetings, Vorlesungen, Interviews und Gespräche.
  Die Desktop-App nimmt den Ton direkt auf Ihrem Computer auf. Es tritt also kein Bot dem Gespräch bei, und Kalima funktioniert mit jeder App, ob Zoom, Microsoft Teams, Google Meet oder ein Video im Browser.
  Über 60 Sprachen, Sprechererkennung, Live-Übersetzung und KI-Zusammenfassungen. Es gibt einen kostenlosen Tarif.
