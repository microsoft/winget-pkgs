ReleaseNotes: |-
  ✨ Release Highlights
  Netcatty v1.1.89 is a hotfix for MCP on Windows SSH PowerShell, plus a few prompt, SSH, settings, and i18n fixes.
  🤖 External MCP
  - MCP terminal_execute / terminal_start on Windows SSH PowerShell no longer hangs with SHELL_NOT_READY after PSReadLine clear-prefix CSI erase. Idle prompts that are only visible (not in the tracking tail) are treated as ready, with an alt-screen tail guard so truncated prompts do not fire early (#3928 / #3927).
  - Alpine default shell prompts (e.g. host:path#$) are recognized as idle, so MCP readiness works on Alpine hosts (#3925).
  🔐 SSH
  - OpenSSH host-certificate negotiation is supported, so connections that present a host cert complete instead of failing key exchange (#3919 / #3918).
  ⚙️ Settings & SFTP
  - Long Agent CLI paths truncate cleanly in AI settings cards instead of overflowing the layout (#3924 / #3923).
  - Deleting an SFTP file association uses the in-app ConfirmDialog instead of the native browser confirm (#3921 / #3920).
  🌐 i18n
  - Spanish locale strings catch up with English (#3917).

  Code signing policy
  Netcatty is applying to the SignPath Foundation open-source program. Once
  approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
  See the
  Code signing policy
  and Privacy policy.
  What's Changed
  - fix(ssh): negotiate OpenSSH host certificates (Fixes #3918) by @binaricat in https://github.com/binaricat/Netcatty/pull/3919
  - Update Nix release metadata for v1.1.87 by @netcatty-bot in https://github.com/binaricat/Netcatty/pull/3913
  - fix(i18n): restore Spanish locale parity with English by @difagume in https://github.com/binaricat/Netcatty/pull/3917
  - Update Nix release metadata for v1.1.88 by @netcatty-bot in https://github.com/binaricat/Netcatty/pull/3916
  - fix(settings): use in-app confirm for SFTP file association delete by @binaricat in https://github.com/binaricat/Netcatty/pull/3921
  - fix(settings): truncate long Agent CLI paths in AI cards by @binaricat in https://github.com/binaricat/Netcatty/pull/3924
  - fix(ai): recognize Alpine default shell prompts by @li88iioo in https://github.com/binaricat/Netcatty/pull/3925
  - fix(mcp): send commands when a PowerShell prompt is only visible by @binaricat in https://github.com/binaricat/Netcatty/pull/3928
