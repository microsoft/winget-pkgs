ReleaseNotes: |-
  ✨ Release Highlights
  Netcatty v1.1.94 delivers a major three-phase memory and startup optimization alongside an upgrade to Electron 45.5.0, adds Standard RDP Security (RC4 & FIPS) support with automatic fallback for legacy RDP hosts, prevents orphan MCP server processes on disconnect, and fixes JumpServer prompt readiness, SSH auto-auth ordering, RDP fullscreen click-through, and magnified-pane borders.
  ⚡ Memory Optimization & Electron 45 Upgrade
  - Three-phase memory & startup overhaul: cut cold-start idle memory by ~39.5% PSS (~27.8% Private Dirty) by deferring idle worker startup, enabling Chromium sandbox: true across BrowserWindows, reclaiming closed Settings windows, fixing hibernated terminal WeakRef leaks (halving hibernated multi-terminal memory), shrinking the renderer entry bundle by 74%, and slashing KeywordHighlighter heap/ArrayBuffer overhead (#4476).
  - Leaner bundles & active terminal footprint: minified preload scripts, removed third-party npm packages from main/worker cold startup, eliminated eager idle mounts (TerminalLayer, AIChatSidePanel, Fig autocomplete specs), and lazy-loaded pinyin-pro plus Vault drawers, modals, importers, and sidebars to cut App bundle size by more than half and lower active multi-terminal memory (#4488).
  - Electron 45.5.0 runtime: upgraded from Electron 42.11.12 to Electron 45.5.0 (Chromium 156, Node 24.22, V8 15.6) with full Electron 43–45 API migrations (async W3C Clipboard API, sandboxed preload Uint8Array staging, openAsHidden cleanup) for a smaller renderer V8 heap and leaner main-process footprint (#4491).
  🖥️ Remote Desktop (RDP)
  - Standard RDP Security & auto fallback: added 40/56/128-bit RC4 (standard/salted MAC and 4096-packet key updates) and FIPS (3DES-EDE3-CBC + HMAC-SHA1) encryption to the built-in IronRDP WASM client, fixed GCC ConferenceCreateRequest PER length encoding for legacy servers (including Windows Server 2003 R2), and added automatic auto-mode fallback with a toolbar security indicator (#4493).
  - Fullscreen toolbar click-through: prevented the RDP session fullscreen toolbar wrapper from intercepting clicks aimed at the remote desktop's top-edge window controls; only the top hover strip and revealed/pinned pill now capture pointer events (#4487).
  - Fixed-size resolution editing: stopped fixed-size RDP width/height inputs from clamping mid-keystroke, added inline 200–8192 range validation, and rendered the missing width/height inputs on companion RDP Host Details tabs (#4473).
  🛠️ Terminal, SSH & External MCP
  - JumpServer prompt readiness & nested target titles: recovered shell readiness from the visible terminal buffer when worker tracking reports SHELL_READINESS_UNKNOWN (unblocking terminal_execute and terminal_start without a manual redraw), and updated agent title mode to display nested JumpServer target hostnames while preserving configured labels for direct SSH sessions (#4479).
  - SSH auto-auth priority: tried saved passwords (and MFA keyboard-interactive) ahead of discovered default ~/.ssh/id_* keys in automatic SSH, SFTP, and jump-host auth, avoiding "Too many authentication failures" disconnects on servers with strict MaxAuthTries limits (#4480).
  - Clean MCP stdio server exit: wired stdin EOF/close, stdout disconnect, signal handlers, and a Windows parent-PID watchdog into netcatty-mcp-server so external MCP disconnects no longer leave orphan Netcatty.exe processes running (#4492).
  - Magnified pane border: drew the 1px magnified-pane accent stroke as an inner overlay so it paints cleanly inside overflow-hidden rounded containers on both terminal split panes and side panels (#4489).
  🔒 Release Supply Chain & CI
  - Hardened release workflows: pinned GitHub Actions via actions.lock and Linux build containers by digest, removed unnecessary checkout token persistence, added weekly Dependabot updates for GitHub Actions, and fixed stale CI unit tests (#4485, #4490).
  Code signing policy
  Netcatty is applying to the SignPath Foundation open-source program. Once
  approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
  See the
  Code signing policy
  and Privacy policy.
