ReleaseNotes: |-
  ✨ Release Highlights
  Netcatty v1.1.92 introduces built-in VNC & RDP remote desktop sessions with Catty Computer Use, raises the default AI iteration limit to 200 with redesigned Computer Use tool cards, adds bulk background terminal jobs and one-click port forwarding from System Manager, and ships a major round of plugin-platform primitives and terminal/Vault fixes.
  🖥️ Built-in VNC & RDP Remote Desktop
  - Native VNC & RDP workspaces: connect to Windows RDP and VNC desktops (including JumpServer RDP) directly inside Netcatty with responsive toolbar overflow, HiDPI scaling, macOS Cmd-to-Ctrl mapping, protocol-aware special keys, VNC manual refresh, and automatic TLS 1.2 kRSA fallback for Windows RDP certificates (#4463).
  - Multi-monitor, shared drives, and telemetry: switch RDP monitors, mount local folders via RDPDR, sync clipboard text/files, play remote RDP audio, monitor live network quality telemetry, and create RDP/VNC/local-shell hosts from the refreshed New Host dropdown menu (#4463, #4465).
  🤖 Catty Computer Use & AI Improvements
  - Catty Computer Use for VNC & RDP: inspect connected remote desktops read-only with remote_desktop_read_screen (supporting full-screen, coordinate grid, and zoomed region captures) and run mouse/keyboard actions via remote_desktop_act with privacy-lock controls, high-risk OS shortcut approvals, user preemption, and an action audit log (#4463).
  - Structured Computer Use cards & higher default step limit: remote desktop tool calls now render as rich artifact cards with action-specific icons, human-readable summaries, secret-redacted hover details, and clickable cached screenshot thumbnails. Built-in AI maxIterations now defaults to 200 (configurable up to 1000) (#4465).
  - Bulk background jobs & MCP polish: launch, poll, and stop background jobs across 2–20 sessions at once with terminal_start_bulk, terminal_poll_bulk, and terminal_stop_bulk, alongside tighter terminal_execute_bulk output budgets, dismissible model-catalog warnings, and better idle-prompt recognition when decorative glyphs precede prompts (#4423, #4425, #4431, #4420).
  🛠️ Terminal, SFTP, System Manager, and Vault
  - One-click port forwarding from System Manager: create local port forwards directly from the Ports tab with IPv6 wildcard listener preservation (#4459).
  - Directory Picker & SFTP: added Git Bash support in the terminal Directory Picker, a configurable setting for SFTP tree view folder double-click behavior, and persistent compose-bar cwd labels across command submissions (#4407, #4460, #4422).
  - SSH, tabs, and Vault fixes: clearer jump-chain connection progress showing each hop's address and target label, respected configured SSH tab names and dynamic title modes, restored Host Details inheritance and safe group-path normalization, consistent MCP host/group proxy updates, always-visible per-pane close buttons at narrow widths, polished magnified-pane chrome, and prioritized custom Open Local Terminal shortcuts (#4413, #4409, #4447, #4427, #4443, #4418, #4448, #4450, #4452, #4414, #4458).
  🔌 Plugin Platform & Performance
  - Host-rendered workbench primitives: added native Monaco code editor, virtualized DataGrid with foreign-key navigation and keyboard shortcuts, SplitPane, ER canvas, overlay scrollbars, STARTTLS/SSH host bindings, and file/secret APIs while keeping development packages gated behind NETCATTY_PLUGIN_DEV=1 (#4437, #4438, #4451, #4461).
  - Faster plugin runtime: accelerated plugin startup, view updates, and pooled image rasterization (#4462).
  Code signing policy
  Netcatty is applying to the SignPath Foundation open-source program. Once
  approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
  See the
  Code signing policy
  and Privacy policy.
