ReleaseNotes: |-
  OpenWrt connection fix
  Netcatty v1.1.85 fixes a regression introduced in v1.1.84 that could disconnect OpenWrt / Dropbear sessions immediately after signing in (#3731, #3732).
  If your OpenWrt connection stopped working after upgrading to v1.1.84, please update to v1.1.85.
  Code signing policy
  Netcatty is applying to the SignPath Foundation open-source program. Once
  approved, covered Windows release artifacts will use Free code signing provided by SignPath.io, certificate by SignPath Foundation.
  See the
  Code signing policy
  and Privacy policy.
  What's Changed
  - Update Nix release metadata for v1.1.84 by @netcatty-bot in https://github.com/binaricat/Netcatty/pull/3730
  - fix(ssh): keep the cwd probe under Dropbear's command limit after auth by @netcatty-bot in https://github.com/binaricat/Netcatty/pull/3732
  Full Changelog: https://github.com/binaricat/Netcatty/compare/v1.1.84...v1.1.85
