ShortDescription: AI-powered SSH client, SFTP browser and terminal manager.
Description: Netcatty is a beautiful, feature-rich SSH workspace built with Electron, React, and xterm.js. Built-in AI agent (Catty Agent), split terminals, vault views, SFTP workflows, and custom themes — all in one.
