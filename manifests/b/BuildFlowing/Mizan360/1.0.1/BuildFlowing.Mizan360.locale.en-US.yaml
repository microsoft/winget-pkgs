ShortDescription: "Bookkeeping, general ledger and finance in one desktop app"
Description: "Mizan 360 brings invoices, accounts, stock, cash and bank, cheques and notes, instalments, payroll and the simple-method business ledger into one desktop app. Invoices, collections, payroll and cheque movements are posted to double-entry journal vouchers automatically. Scan Document reads photos of invoices, receipts and bank slips and prepares the entry. Doubtful receivables, sales-rep commission and account risk limits; a categorised, searchable tree menu; a 360° right-click menu with related records; an Early Warning Center; the DataFlow analysis engine and data-model Excel (Power Pivot + DAX). Turkish and English. Your data stays on this computer."
