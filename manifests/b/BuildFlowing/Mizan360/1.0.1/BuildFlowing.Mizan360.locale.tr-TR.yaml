Description: "Mizan 360; fatura, cari, stok, kasa ve banka, çek ve senet, taksit, bordro ve basit usul işletme defterini tek masaüstü programında toplar. Fatura, tahsilat, bordro ve çek-senet hareketleri çift taraflı yevmiye fişine kendiliğinden döner. Belge Tara fatura, fiş ve dekont fotoğrafını okuyup kaydı hazırlar. Şüpheli alacak, plasiyer prim hakedişi ve cari risk limiti; kategorili, aranabilir ağaç menü; sağ tık 360° menü ve ilişkili kayıtlar; Erken Uyarı Merkezi; DataFlow analiz motoru ve veri modelli Excel (Power Pivot + DAX). Türkçe ve İngilizce. Veri bu bilgisayarda kalır."
