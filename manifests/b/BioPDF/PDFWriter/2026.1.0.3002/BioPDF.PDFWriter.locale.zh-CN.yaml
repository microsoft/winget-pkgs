ShortDescription: 通过虚拟打印机，几乎可以从任何 Windows 应用程序输出 PDF 文档。
Description: bioPDF PDF Writer 会安装一台 Microsoft Windows 打印机，将几乎所有 Windows 应用程序的打印输出转换为 PDF，也可选择输出为 BMP、EPS、PS、PNG、PCX、JPEG 或 TIFF。文档可以直接写入固定文件，也可以在保存时提示选择位置；输出支持密码保护与 40、128、256 位加密、水印、背景文档、页面追加与前置、质量预设以及文档属性。所有设置都可通过命令行、COM/ActiveX 接口和 .NET 接口进行控制，便于脚本化和无人值守部署。安装程序支持无人值守安装，并支持 Citrix MetaFrame、Windows 终端服务器和 RDP。安装和使用不超过 10 个副本免费，更大规模部署需要商业许可。
