ShortDescription: Write PDF documents from almost any Windows application through a virtual printer.
Description: bioPDF PDF Writer installs a Microsoft Windows printer that converts print output from almost any Windows application into PDF, and optionally into BMP, EPS, PS, PNG, PCX, JPEG or TIFF. Documents can be written directly to a fixed file or prompted for a destination, and output supports password protection and 40, 128 or 256 bit encryption, watermarks, background documents, page appending and prepending, quality presets and document properties. Every setting is reachable through a command line interface, a COM/ActiveX interface and a .NET interface, so the writer can be scripted and deployed unattended. The setup runs unattended and supports Citrix MetaFrame, Windows Terminal Server and RDP. Installation and use of up to 10 copies is free; larger deployments require a commercial license.
