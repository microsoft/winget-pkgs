ShortDescription: Desktop email client that lays mail out as envelopes on a desk, with boxes, stamps, rules and a calendar.
Description: InboxNext is a desktop email client for Windows. Mail arrives as envelopes on a desk — sender, date and first line printed on the envelope — and opening one brings out the letter. Stamps mark priority, boxes are folders you can drag mail into, rules sort it as it arrives, and a built-in calendar with holidays and weather keeps the day in view. It connects straight to your own mail servers over IMAP and POP3, with no middleware, no account with us and no telemetry, and the mailbox lives on your machine, so reading and search work offline. It imports .pst, .mbox and .eml, blocks remote trackers by default, verifies PGP signatures without ever holding a private key, and can be tried before buying.
