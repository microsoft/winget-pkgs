ReleaseNotes: |-
  Added
  - A refreshed Mahjong. Mahjong has a new design in Blanc's Sunrise look,
    in light and dark mode, with new tile artwork, a simpler setup sheet and a
    smaller results card. On wide windows the Burst rack sits beside the board.
  - Mahjong tile sets. Mahjong now has three tile sets, Porcelain, Carved
    and Inlay, and moves to the next one after every three boards you clear in
    a row. A board keeps the set it was dealt in. Starting a new game partway
    through a board you've played on starts the count again.
  - Mahjong celebrations. Matching two tiles draws a short trail between
    them, and clearing a board plays a short celebration before the results
    card. A click or any key skips straight to the card. With reduced motion
    on, matched tiles glow briefly in place instead.
  Changed
  - Screen readers now name Mahjong's wind and dragon tiles plainly, such as
    "north wind" or "red dragon".
  - Mahjong's board-cleared card is smaller and fits its content, and its title
    says what happened, such as a new personal best, a first clear of a layout
    or three boards in a row, instead of always reading "A beautiful finish."
  - Choose your game fits without scrolling at ordinary window sizes. While
    Daily is selected, a note explains how to pick another layout, and copy
    current deal is now copy board link and confirms when it has copied.
  - The stronger free-tile highlight option is gone from Mahjong's setup.
  - The Island matches Mahjong's background, as it does on the Start Page.
  - Long Burst scores shrink to fit the rack beside the board.
  - The closed Island no longer leads with the current Space's mark, so it
    stays shorter. Spaces open from the Spaces button in the ⌘L panel's
    footer, which now shows the current Space's symbol on its color (the
    planet when the window isn't in a Space). With vertical tabs, the side
    list still shows the mark at the top.
  - The Island's address field now reads Search or type URL.
  Fixed
  - After Continue on a certificate warning for a local or private-network
    address, windows that page opens on its own, such as Proxmox's separate
    console, now load and connect too, instead of staying black or white.
