ShortDescription: 一款极简桌面浏览器，用一个紧凑的 Island 承载标签页、导航和命令。
Description: |-
  一款极简桌面浏览器，用一个紧凑的 Island 承载标签页、导航和命令。支持 macOS、Windows、Linux、iPhone 和 iPad，免费使用，并内置广告和跟踪器拦截。
  Island 承载标签页、搜索和斜杠命令，还能隐匿不见，并可选配垂直标签列表。Blanc 空间让各组标签页各自独立，标签组负责整理它们，Glance 则把另一个已打开的标签页叠加显示在你所在的页面上，无需切换过去，显示的内容还能以分屏视图的形式留在页面旁边。
  Blanc Blocker 从首次启动起就已开启。更偏爱 uBlock Origin？在受支持的构建上，你可以为常规标签页选择它。像 !yt 这样的 Bang 会把搜索直接发送到指定网站，可选的同步则以端到端加密的方式，让收藏夹、设置和打开的标签页在各台电脑之间保持一致。正在从 Arc 迁移？Blanc 会把你的空间一起带过来。
