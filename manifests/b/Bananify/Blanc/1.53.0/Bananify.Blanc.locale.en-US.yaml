ShortDescription: A minimal desktop browser with one compact Island for tabs, navigation and commands.
Description: |-
  A minimal desktop browser with one compact Island for tabs, navigation and commands. Free for macOS, Windows, Linux, iPhone and iPad, with built-in ad and tracker blocking.
  The Island holds tabs, search and slash commands and can hide out of sight, with an optional vertical tab list. Blanc Spaces keep separate sets of tabs, tab groups organize them, and Glance brings another open tab into view over the page you're on without switching. A result can stay beside the page as a split view.
  Blanc Blocker is on from the first launch. Prefer uBlock Origin? On supported builds, you can choose it for regular tabs. Bangs like !yt send a search straight to a chosen site, and optional sync keeps Favorites, settings and open tabs in step across your computers, end-to-end encrypted. Coming from Arc? Blanc brings your Spaces with you.
