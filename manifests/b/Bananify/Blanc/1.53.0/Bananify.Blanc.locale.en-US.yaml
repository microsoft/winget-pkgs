ReleaseNotes: |-
  Blanc 1.53.0
  Added
  - Move a mini window to a Space. Click the Spaces button beside
    Open in Blanc or choose File → Move to Space. Pick an existing Space
    in the current profile or create a new one. Your tabs, groups, and splits
    move together, and Blanc brings the destination Space forward. If a tab
    can’t move, such as a private tab or one playing audio, Blanc explains why
    and keeps the tabs in the mini window (#1734).
  - Open local HTML files on Linux. Choose Blanc from your file manager’s
    Open With menu to see an .html file in a static preview. The preview
    blocks scripts and network requests (#1630).
  Fixed
  - Favorites opens with ⌥⌘B on the Mac again. Auto-hide the Island now
    uses ⇧⌘B, and Close Window uses ⇧⌘W. Use ⌘W to close the current tab (#1737).
  - Ctrl+Y redoes on Windows and Linux. Use Ctrl+H for History (#1737).
  - Clearer screen reader labels. The share picker, tab handoff, Sync
    settings, Start Page, and Mahjong now give assistive technology more
    context for their labelled controls and groups (#1748).
