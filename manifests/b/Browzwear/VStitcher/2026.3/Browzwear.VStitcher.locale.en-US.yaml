ReleaseNotes: |-
  VStitcher 2026.3.0 Release Notes
  Release Date: October 30th, 2026

  VStitcher 2026.3.0 brings a combined Points of Measure (POM) workflow, expanded static point controls, and pattern piece color customization in the 2D window.

  Points of Measure (POM)
  - The Formulas tab now combines formulas and POMs in one table: Name, Description, Formula, Value (2D cm), 3D (cm), Target, Tol (+/-) and POM.
  - New POM in Sizes tab shows read-only POM values for every size, with size filtering and optional Diff columns.
  - Save to Formula: select a line or two points in the 2D window, right-click, and save the value directly into a formula.
  - Selecting a formula row highlights its measurement in the 2D window. Rows can be reordered by drag and drop; the order is saved in the BW file.
  - Export the POM table to CSV for the current size or all sizes.
  - Rulers can be converted to POMs (prompt on file open, or Convert in the Rulers tab). Rulers are now read-only.
  - Target & Apply Changes (Enterprise and Teams SSO accounts, enabled by Browzwear): enter a Target on POM rows and click Apply Changes to reshape the piece. Available on the base size only.
  Static Points
  - Set Static now supports a Stacking Axis: X, Y or XY (default).
  - Setting static on a symmetry piece now preserves grading and no longer distorts the contour.
  - Static points are marked with a diamond in the 2D window and are saved in the BW file.
  - New Restore Nested View action at piece level, in the Piece Transformation section. Grading edits made while static are kept.
  - New customizable keyboard shortcuts: Set Static XY, Set Static X, Set Static Y and Restore Nested View.
  Pattern Piece Color Customization
  - Set a piece outline color and allowance color from a 9-color palette, in the DXF import dialog, the Appearance section of the piece contextual menu, or the 2D right-click Appearance menu.
  - Color changes can be applied per piece, allowing you to have different colors for multiple pieces in your file.
  - New allowance opacity control (0–100%) in the Appearance section.
  - New X-ray display option renders all piece fills semi-transparent (up to 40%) to inspect overlaps.
  - Outline/allowance color only affects the 2D display only.
  - New Python API properties: piece.outline_color, piece.fill_color, piece.fill_opacity, plus reset_outline_color() and reset_fill_color().

  Download and Upgrade Versions Instructions
  Upgrading to VStitcher 2026.3:
  - Download and install VStitcher from Here
  - Cloud License Users - send your upgrade request to [email protected]. There is no need to send any files.
  - Dongle License Users - you must update your license dongle. Send your C2V to [email protected]. For further information, refer to Retrieving a C2V File and Applying a V2C File.
  - If you need to renew your contract and are interested in version 2026.3 contact your Customer Success Manager.
  File Versions
  - VStitcher 2026.3 and Lotta 2026.3 both support files created in earlier VStitcher and Lotta versions.
  - Earlier VStitcher and Lotta versions do not support version 2026.3 files.
  Version Support
  With the release of VStitcher 2026.3 and Lotta 2026.3 the company's support now extends to the following versions of VStitcher and Lotta:
  - 2026.3
  - 2026.2
  - 2026.1
  - 2025.3
