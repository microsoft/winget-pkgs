ReleaseNotes: |-
  Changes since 2.9.3
  2.11.5 - 2026-10-27
  Added
  - DataAnalyzer: Add possibility to move rows
  - macos/ios: add native support for passkeys authentication
  - DataAnalyzer: Introduce the data-analyzer module for WebAssembly
  Fixed
  - DataAnalyzer: App crashes when entering a value in a future year
  - DataAnalyzer: App crashes when clearing already empty cell
  - DataAnalyzer: Move multiple rows under same parent not always possible
  - DataAnalyzer: Existing report column names based on dataelements are not updated when dataelement name is changed
  - DataAnalyzer: Default expand row not correctly applied
  - DataAnalyzer: CSV export not exporting correct data
  - Windows: "Use Native Text Rendering" option is not correctly loaded on startup font and style is not propagated to popped out windows
  - App crashes when using calculated fact columns
  - Opening a context menu at another position while it is already open fails
  - Create button in reports is shown even when the user does not have the corresponding permission
  - View name containing '&' is not displayed correctly in the view dropdown
  - Standard/hidden label in view dropdown have hover effect even though dropdown is disabled
  - Last open tabs are opened twice on startup and whenever MoBeele sends dataChanged for userPreferences
  - Crash when opening home cockpit on macOS
  - Sorting any column collapses column groups to the highest level
  - Links from native report/smart table are not opened anymore in main tab
  Changed
  - Update Qt to 6.8.9
  - Update libexpat to 2.8.5
  - Update OpenSSL to 3.5.9
  - Removed burger menu button from smart table/report cells in first column
  - macOS: Accessibility is now disabled by default to avoid the crash above (QTBUG-145814). VoiceOver, Voice Control, Switch Control and UI automation tools can no longer access the app. Can be re-enabled via a new global setting
