ReleaseNotes: "This release writes a lighthouse configuration file straight to a swarm.\n\n### New features\n\n• **Lighthouse configuration files for a swarm** — `swarm lh write` and\n  `swarm lh check` take a YAML file with `-i/--input`, as `lh config write -i`\n  and `lh config check -i` do for one Crazyflie. The file is used instead of\n  the stored configuration the swarm names, for example one from\n  `lh config read` or the Crazyflie client. `write` skips the Crazyflies that\n  already have it, as before. See\n  [docs/swarm.md](docs/swarm.md#lighthouse).\n  ([#42](https://github.com/bitcraze/cfcli/issues/42))\n\n  ```text\n  $ cfcli swarm lh write -i my_setup.yaml\n  Lighthouse config from my_setup.yaml：base stations 4, 5, 6, 7\n  CF-05：written and stored in flash\n  CF-06：up to date\n  ```\n\n### Improvements\n\n• **`swarm lh` loads the configuration first** — a missing or broken file, or\n  an unknown stored configuration, fails at once, before any Crazyradio is\n  opened.\n• **`swarm lh check` suggests the right `write`** — when Crazyflies differ, the\n  `swarm lh write` it suggests includes the `--config` or `-i` that was given.\n  It used to suggest plain `swarm lh write`, which writes the configuration\n  the swarm names."
