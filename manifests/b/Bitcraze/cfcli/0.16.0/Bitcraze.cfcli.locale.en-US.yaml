ReleaseNotes: "This release is mostly about swarms. cfcli can now store lists of Crazyflies,\nrun commands on all of them at once, and share swarms and lighthouse\nconfigurations with the people you fly with.\n\n### New features\n\n• **Swarms** — a swarm is a named list of Crazyflies, each with a short name,\n  stored in the same YAML format as\n  [Swarmkeeper](https://github.com/evoggy/swarmkeeper) so a file can move\n  between the two. `swarm config` manages them (`list`, `select`, `create`,\n  `delete`, `show`, `name`, `add`, `remove`, `rename`, `import`, `export`,\n  `move`), `swarm scan` shows which Crazyflies answer, and\n  `select --from-swarm CF-02` selects one of them for all the other commands.\n  See [docs/swarm.md](docs/swarm.md).\n\n  ```text\n  $ cfcli swarm config import ~/Documents/Swarmkeeper/swarms/lab.yaml\n  Imported swarm 'lab' from …/lab.yaml (3 Crazyflies), 3 URIs now use radio:/// (any Crazyradio)\n  Selected swarm 'lab' (3 Crazyflies)\n  $ cfcli swarm scan\n  CF    | URI                       | Radio | Online\n  ------+---------------------------+-------+--------\n  CF-01 | radio:///80/2M/E7E7E7E701 | 1     | yes\n  CF-02 | radio:///90/2M/ABAD1DEA01 | 0     | yes\n  CF-03 | radio:///90/2M/ABAD1DEA02 | 0     | yes\n  3 of 3 Crazyflies answered\n  ```\n\n  `swarm config add` takes URIs, `--scan`, or `--from-usb` (the one\n  USB-attached Crazyflie), and asks for a name when a single Crazyflie is added.\n  Swarm IDs and Crazyflie names complete in bash, zsh and PowerShell.\n\n• **Any Crazyradio：`radio:///`** — a URI with the radio left empty means \"any\n  Crazyradio\". A single Crazyflie gets the first Crazyradio that can be opened,\n  so cfcli keeps working while another program holds radio 0. A swarm is spread\n  over all attached Crazyradios, and Crazyflies on the same channel, or on\n  channels less than 2 apart, always share one, so two radios never transmit on\n  the same channel. `radio://0/` is rewritten to `radio:///` when Crazyflies are\n  imported or added to a swarm; other radio indices are kept.\n\n• **Commands on a whole swarm** — these run on every Crazyflie in the selected\n  swarm, or on the ones picked with `--cf`, `--exclude` or `--swarm`:\n\n  | Command | |\n  |---|---|\n  | `swarm platform info \\| reboot \\| power-off \\| sleep \\| wakeup` | |\n  | `swarm param get \\| set \\| store \\| clear` | without names, the parameters are picked from the first Crazyflie |\n  | `swarm log print` | streaming, or one row per Crazyflie with `--once` |\n  | `swarm deck list`, `swarm debug assert` | |\n  | `swarm bootload info \\| flash` | see below |\n  | `swarm rechannel` | see below |\n  | `swarm lh check \\| write` | see below |\n\n  Listings look like the normal ones with a `CF` column in front, and `--csv`\n  rows start with `cf,uri`. A Crazyflie that fails doesn't stop the others; its\n  error goes to stderr with its name in front. The exit code is 0 when all\n  succeed, the usual code when all fail the same way (10 when none answer), and\n  the new **50** otherwise.\n\n  ```text\n  $ cfcli swarm platform info\n  CF    | Platform                | Firmware    | CRTP protocol\n  ------+-------------------------+-------------+---------------\n  CF-BS | Crazyflie 2.1 Brushless | 2026.08 +84 | 13\n  CF-01 | Crazyflie 2.1 Brushless | 2026.08     | 12\n  CF-02 | Crazyflie 2.1 Brushless | 2026.08     | 12\n  ```\n\n  Each Crazyradio talks to up to 8 Crazyflies at a time, and log and parameter\n  TOCs are downloaded once per firmware instead of once per Crazyflie (3.2 s\n  cold and 0.6 s warm for `swarm platform info` on 3 Crazyflies).\n\n• **Flashing a swarm** — `swarm bootload flash` takes the same `--release`,\n  `--zip`, `--bin` and `--targets` as `bootload flash` and flashes the\n  Crazyflies one after another, with a summary table at the end. A release is\n  downloaded for each platform in the swarm, and everything is prepared before\n  the first Crazyflie is touched, so a wrong `--zip` stops the command instead of\n  failing halfway. STM32 and nRF51 images given with `--bin` are only flashed\n  when all the Crazyflies have the same platform; `--platform` flashes one\n  platform at a time in a mixed swarm.\n\n  `swarm bootload info` shows the bootloader versions of each Crazyflie and\n  restarts it back into its firmware. Its `Broadcast` column tells whether both\n  bootloaders support broadcast flashing (bootloader protocol 0x11), which is in\n  preparation; this release flashes one Crazyflie at a time.\n\n• **Spreading a swarm over several channels** — Crazyflies on one channel share\n  one Crazyradio, so a swarm on a single channel can only use one.\n  `swarm rechannel --count 3` (channels 80, 78 and 76) or\n  `--channels 80,76,72` gives each channel an equal share, keeps Crazyflies\n  that are already on one of the channels where they are, and refuses a plan\n  that would put two Crazyflies with the same address on one channel. The plan\n  is shown and confirmed first (`--dry-run` stops there, `--yes` skips the\n  question). Each Crazyflie that moves is reprogrammed, rebooted and found on\n  its new channel before its URI in the swarm file changes, so running the\n  command again after an interruption finishes the job.\n\n• **Sharing swarms and lighthouse configurations** — `auth login` signs cfcli in\n  to a server through the browser, with nothing to copy (`auth status`,\n  `auth logout`). Signed in, swarms on the server sit next to the local ones as\n  `<organization>/<swarm>`, and every swarm command takes either kind of ID.\n  `swarm config move lab org/lab` shares a local swarm, and moving it back takes\n  it back. The default server is https://arc.bitcraze.io; `--server` signs in to\n  another one. See [docs/auth.md](docs/auth.md).\n\n  ```text\n    | ID                | Name        | Crazyflies | Stored\n  --+-------------------+-------------+------------+----------------------------\n  • | lab               | Lab         | 3          | this computer\n    | bitcraze-lab/cage | Flight cage | 8          | arc.bitcraze.io, revision 3\n  ```\n\n  With sync on (`settings sync on`, the default), commands check the server\n  first and upload changes right away, and a change someone else made in between\n  is kept. With sync off, `pull` and `push` sync by hand. Without the server,\n  commands work on this computer's copies and upload the changes later, so\n  working with the Crazyflies never waits for the network. When you change your\n  ID for an organization on the server, cfcli moves its copies and the selected\n  swarm to the new ID.\n\n• **Stored lighthouse configurations** — lighthouse configurations can be stored\n  like swarms, locally as `<config>` or shared as `<org>/<config>`:\n  `lh config list`, `save` (the Crazyflie's configuration), `import`, `export`\n  (a file the Crazyflie client opens), `name`, `delete`, `move`, `pull` and\n  `push`. `display`, `write` and `check` take a stored configuration, a file\n  (`-i`) or YAML on stdin. See [docs/lighthouse.md](docs/lighthouse.md).\n\n  A swarm can name the configuration it flies in (`swarm config lh`).\n  `swarm lh check` compares every Crazyflie with it, and `swarm lh write` writes\n  it to the Crazyflies that don't have it yet and reads it back:\n\n  ```text\n  $ cfcli swarm lh check\n  Lighthouse config 'lab/cage' (revision 3)：base stations 0, 1, 2, 3\n  CF    | Lighthouse\n  ------+------------------------------------------\n  CF-01 | up to date\n  CF-02 | BS 2 moved 4.1 cm, turned 0.62°\n  CF-03 | no position for BS 0, 1, 2, 3\n  Error：differs: 2 of 3 Crazyflies have another lighthouse configuration; 'cfcli swarm lh write' gives them this one\n  ```\n\n• **Comparing lighthouse configurations** — `lh config check` compares the\n  Crazyflie's configuration with a file or a stored one, per base station：how\n  far the geometry moved and turned, and whether the calibration belongs to\n  another base station. A difference exits with the new code **60**, so a\n  script can act on it. `--csv` is supported.\n\n  ```text\n  BS | Geometry             | Calibration\n  ---+----------------------+-------------------------------------------------------------------------\n  0  | not on the Crazyflie | other base station：0x00BC614E in the file, 0xE8781C12 on the Crazyflie\n  1  | -                    | same\n  ```\n\n• **One log sample** — `log print --once` reads one sample, prints it as a table\n  and stops; `--csv` gives the header and the first row. See\n  [docs/logging.md](docs/logging.md).\n\n• **Radio URIs of USB-attached Crazyflies** — `scan --from-usb` reads the radio\n  configuration of every USB-attached Crazyflie and prints its radio URI,\n  without selecting it the way `select --from-usb` does:\n\n  ```text\n  $ cfcli scan --from-usb\n  > radio://0/90/2M/ABAD1DEA01 (usb://410050000551343036333233)\n  ```\n\n• **Restarting the STM32 into USB DFU** — `platform dfu` restarts the STM32 into\n  its ROM bootloader over the radio, without holding the power button, and\n  waits for it to show up on USB (`0483:df11`). `platform reboot` brings it back.\n  This needs nRF51 firmware with\n  [crazyflie2-nrf-firmware#126](https://github.com/bitcraze/crazyflie2-nrf-firmware/pull/126),\n  which is not in a firmware release yet. See [docs/platform.md](docs/platform.md).\n\n• **GAP8 as a flash target** — the AI-deck's GAP8 (`bcAI:gap8-fw`) can now be\n  flashed.\n\n### Bug fixes\n\n• **`bootload info` shows the real bootloader protocol version** — the version\n  was read from the byte that echoes the command, so every bootloader reported\n  `Protocol Version：16` (0x10). It is now read from the right byte (0 for\n  bootloaders from before it existed), and the CPU ID is shown in full instead\n  of its first 2 bytes.\n\n• **Entering the bootloader no longer hangs** — the warm boot behind\n  `bootload flash` and `bootload info` asked the firmware for its bootloader\n  once, and could wait forever if that request or its answer was lost. It now\n  asks aga"
