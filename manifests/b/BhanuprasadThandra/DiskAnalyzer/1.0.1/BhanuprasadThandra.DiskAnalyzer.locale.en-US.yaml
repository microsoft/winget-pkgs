ShortDescription: A fast, read-only disk space analyzer for Windows with an interactive treemap heatmap.
Description: |-
  Disk Analyzer shows exactly where your disk space goes. It scans whole drives or individual folders with a fast multithreaded scanner (or, when run as administrator, by reading the NTFS Master File Table read-only) and presents the results as:
  - a folder explorer with sizes, percentages, sorting and filters,
  - an interactive, zoomable treemap heatmap colored by file type, age or size,
  - lists of the largest files and folders, a file-type breakdown and a duplicate file finder,
  - instant search, scan history with comparison between scans, and CSV/Excel/JSON export.
  It is strictly read-only, never needs administrator rights to run, and makes no network connections.
