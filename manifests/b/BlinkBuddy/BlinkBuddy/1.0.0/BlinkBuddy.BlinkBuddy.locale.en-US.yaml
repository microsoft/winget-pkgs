ShortDescription: Gentle eye care in the Windows tray - blink reminders, guided breaks, a screen filter and a reading strip.
Description: |-
  BlinkBuddy reminds you to blink and to rest your eyes, with guided eye exercises and a stretch coach you can
  follow, read aloud if you like. Its screen filter warms the screen after sunset, dims below what the display
  allows and has colour effects; a reading strip keeps your place, and mini mode and a focus timer stay out of
  the way. Free, in 21 languages, and light: about 3 MB of memory while it waits in the tray.
