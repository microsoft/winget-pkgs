InstallationNotes: DeskSentry installs per-user to %LocalAppData%\Programs\DeskSentry and starts on the Free tier. To unlock Pro, open Help > Upgrade to Pro and enter your licence key. Profiles, settings and the event log are stored in %AppData%\DeskSentry.
