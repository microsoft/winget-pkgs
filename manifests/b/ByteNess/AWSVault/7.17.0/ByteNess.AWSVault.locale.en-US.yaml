ReleaseNotes: |-
  ## Highlights

  ### Parallel-safe mode (opt-in)

  A new `--parallel-safe` flag (or `AWS_VAULT_PARALLEL_SAFE=true`) makes it safe to run many aws-vault processes at once, such as hundreds of `credential_process` calls from Terraform. It adds cross-process locks so that:

  • only one process per SSO start URL refreshes the token or opens a browser sign-in, while the others wait for the cached token
  • only one process at a time writes a given cached session
  • keyring access is serialized, with one lock per store
  • SSO `GetRoleCredentials` rate limits (HTTP 429) are retried with jittered backoff, honouring `Retry-After`

  It's off by default, and without it nothing changes. Every process running at the same time needs it, so setting the environment variable is the easiest way. Lock files live in `aws-vault/locks` under your user cache directory. See [Parallel-safe mode](https://byteness.github.io/aws-vault/docs/parallel-safe/).

  Thanks to @timvisher-dd, who wrote the original in #337, and to @posquit0 for rebasing it in #476.

  ### Touch ID only when the keychain is locked (macOS)

  With `--biometrics`, every aws-vault process asked for Touch ID, including every `credential_process` call. keyring v1.14.0 checks whether the keychain is locked and only prompts then, so how often you see it now follows your keychain's lock settings. See [Touch ID](https://byteness.github.io/aws-vault/docs/backends/#touch-id). Fixes #421.

  ### Behaviour change

  • `aws-vault exec --json` with `--server`, `--ecs-server` or `--ec2-server` now fails with an error (exit code 1). Before, it printed credentials, ignored the server flag and exited 0. (#492)

  <!-- Release notes generated using configuration in .github/release.yml at v7.17.0 -->

