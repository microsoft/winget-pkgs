ReleaseNotes: |-
  The audio system has rebuilt from the ground up for fortress mode. We have user interface sounds, a better ambience system, and varied work sounds for mining. With this new framework, we can continue to add more audio variety to the game as we go.
  Audio updates
  - Complete migration of the audio system into FMOD Studio.
  - Each biome comes with its own ambience that mixes itself as conditions change, with sounds coming from all around your fortress.
  - As you dig down, the surface sounds fade away and the underground sounds take over.
  - New spatialized mining sounds come from where your miners are actually working, muffled by the stone around them.
  - Every mining breakthrough sounds different depending on what was uncovered: stone, gems, ice, water, magma, caverns... and a few things you'd rather not find.
  - Ambience, sound effects, and user interface sounds mix themselves based on music volumes and states.
  - New music and cards to discover over the life of your fortress.
  - User interface sounds, including new unique sounds for every button along the edge of the screen in fortress mode.
  - User interface sounds have their own volume slider in the options menu.
