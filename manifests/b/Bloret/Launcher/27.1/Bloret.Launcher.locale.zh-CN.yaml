ReleaseNotes: |-
  Be creative, be simple. Your Personal Innovative Open Source AI Minecraft Launcher. Relax, it's Bloret Launcher.

  # It's 27.1

   - **隆重推出插件功能，Bloret Launcher 的一切均可自定义。**
   - 可访问 [Bloret Launcher 商店](https://launcher.bloret.net/apps) 寻找或是提交你的插件
   - [Bloret Launcher 插件开发规范文档](https://bbs.bloret.net/#post/Bloret%20Software%20Community/Bloret%20Launcher/1786541044479_9ne65.json)
   - 远程国际化功能，数据来源于 [tr.bloret.net](tr.bloret.net) 任何人都可以参与翻译 Bloret Launcher
   - 针对 Blora Agent (原络可) 界面与一些功能进行了优化
   - 支持多任务并行下载与安装 Minecraft
   - 支持将 Blora Agent 连接到微信、飞书、Telegram、Discord、iMessage 或是各种其他平台
   - 针对下载设置项进行了优化
   - 针对性能与逻辑进行了优化

