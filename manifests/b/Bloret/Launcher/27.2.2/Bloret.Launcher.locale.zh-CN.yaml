ReleaseNotes: |-
  Be creative, be simple. Your Personal Innovative Open Source AI Minecraft Launcher. Relax, it's Bloret Launcher.

  # It's 27.2.2

  ## Fixes

  • Fixed Windows source-run installations registering `bloret://` without the launcher script path, which caused the browser callback to silently fail.
  • The launcher now re-registers the protocol before each Windows Passport login and reports a clear error if registration fails.
  • Switched the Windows single-instance mutex from `Global\` to `Local\` so non-admin users can forward the OAuth callback to the running instance.
  • Accept a trailing slash in the Passport callback path, as added by some browser/protocol handlers.
  • Added diagnostics when an OAuth callback arrives without a pending login.

  The Passport authorization page now also shows an **Open Bloret Launcher** button after approval, so browser blocking of automatic custom-protocol redirects no longer leaves the user on a blank page.

  **Full Changelog**：https://github.com/BloretCrew/Bloret-Launcher/compare/27.2.1...27.2.2
