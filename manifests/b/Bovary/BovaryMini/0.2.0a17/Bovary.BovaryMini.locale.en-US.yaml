ShortDescription: Run local AI models on Windows using streamed model weights to reduce system RAM use.
Description: |-
  Bovary Mini runs Gemma 26B and Inkling 2 Mini locally on Windows. It streams model weights from disk to limit system memory use, with CUDA acceleration on supported NVIDIA GPUs and a CPU mode for Gemma. This alpha release requires internet access for initial setup and model downloads. Inference can run offline after setup.
