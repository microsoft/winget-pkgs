ReleaseNotes: |-
  A rich-text note saved as .rtf now keeps its images. The file still opens in Word and WordPad. The .scrb format is unchanged.
  RTF images:
  - PNG and JPEG images are stored as they are. GIF, WebP and BMP images are converted to PNG. The width set in the editor and any image link are saved too.
  - Opening an .rtf brings back its PNG and JPEG pictures, including ones saved by Word.
  - Tables and SVG images still cannot be stored in RTF. Scrib asks before a save would remove them. Save as .scrb to keep them.
  Also includes the 1.10.1 fixes:
  - Closing Scrib no longer crashes.
  - Rich text now saves under any file name, even one typed without an extension.
  Test suite grown from 643 to 670.
