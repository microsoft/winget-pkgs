ReleaseNotes: |-
  Printing arrives, and a bug that could replace a table cell's text with the whole note is fixed. That bug affected 1.10.2 and earlier, so updating is recommended. The .scrb format is unchanged.
  - Table fix: after typing in a table cell, clicking the note and pressing Ctrl+End could replace the cell's text with the entire note, and the next save kept it. Clicking the note now takes the cursor out of the cell first. The first click on a new table now goes into the cell, and Tab in a cell no longer inserts a tab into the note.
  - Printing: File > Print (Ctrl+P) prints the active note through the standard Windows print dialog, so any printer Windows knows about works, including Microsoft Print to PDF and Universal Print. Tables and SVG images do not print yet. Printing an encrypted note asks first, because the printout is not encrypted.
  - Built with Flutter 3.47.7. Open, Save As and Insert Image now use Flutter's own Windows file dialogs.
  Test suite grown from 670 to 707.
