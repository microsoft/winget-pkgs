Description: |-
  BatchDocProcessor is a Windows desktop application for batch editing Microsoft Word documents. It makes the same changes to every document in a folder in one run: new headers and footers from a template, a replaced logo, find and replace, a metadata clean-up, links repointed after a server move, styles from your template, .doc to .docx, and a PDF or PDF/A for each document.
  It edits copies by default, restores any document it can't change safely, and reports what happened to each file. Documents are processed on your PC.
  Commercial software. Free trial: 7 days or 50 documents, whichever comes first, with every feature; it needs an internet connection for each run. A license is needed after the trial.
  Includes bdp-cli.exe for scheduled tasks.
