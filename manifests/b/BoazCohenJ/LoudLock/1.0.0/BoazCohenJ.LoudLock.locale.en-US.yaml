ShortDescription: Stop Windows volume jumping to 100%. Undo volume jumps you didn't make, cap each device, lock your mic level and keep per-app volumes.
Description: LoudLock sits in the tray and watches every output device, microphone and app through the Windows audio API. It undoes sudden volume rises that you didn't make, lets you set a highest volume per device, holds a microphone at an exact level so apps with automatic gain can't change it, and puts each app back at the volume you last gave it when it starts. Every correction is logged with what was going on at the time. Runs on .NET Framework 4.8, which is already part of Windows 10 and 11.
