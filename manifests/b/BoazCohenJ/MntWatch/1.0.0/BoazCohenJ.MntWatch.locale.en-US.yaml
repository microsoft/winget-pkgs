ShortDescription: Hot reload for WSL 2 projects on /mnt/c. Makes Linux file watchers (Vite, webpack, nodemon, fs.watch, inotify) see files you edit in Windows, without polling.
Description: MntWatch is a tray app for WSL 2. inotify never fires for files under /mnt/c, so dev servers in WSL don't reload when you save in a Windows editor. For each folder you pick, MntWatch remounts just that folder in your distro with an inode-caching flag, so changes made from Linux fire again, and forwards Windows change notifications into Linux so watchers hear about edits, new files and atomic saves made in Windows. It never starts WSL itself, and the folder goes back to normal when it exits. Includes a self-test that reproduces the bug and then shows the fix. Runs on .NET Framework 4.8, which is already part of Windows 10 and 11.
