ShortDescription: Start menu shortcuts for portable apps installed with winget. Adds, updates and removes them automatically as you install, upgrade and uninstall.
Description: winget's portable packages (zips and bare exes) get a PATH alias but no Start menu entry, so you can't find them with Win + typing, and launchers that index the Start menu can't see them (winget-cli issue 2299). PortaStart reads winget's portable install records and creates a Start menu shortcut for every GUI app, picking the right exe from a zip (the build for your CPU, never the uninstaller). A small background watcher with no window keeps the shortcuts in sync. Console tools are skipped unless you opt them in, shortcuts it didn't make are never touched, and a shortcut you delete stays deleted. No admin rights needed. Runs on .NET Framework 4.8, which is already part of Windows 10 and 11.
Moniker: portastart
