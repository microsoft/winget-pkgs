ShortDescription: Stop apps from stealing focus on Windows, and find out which app keeps doing it.
Description: NoFocusSteal sits in the tray and stops apps from stealing keyboard focus on Windows. It blocks apps that keep grabbing focus, shows a focus log of which app took it and when, and gives your window back so half a sentence doesn't land in the wrong place. Runs on .NET Framework 4.8, which is already part of Windows 10 and 11.
