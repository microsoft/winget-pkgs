ShortDescription: Log internet outages on Windows and get a report that shows whether each one was on your side or your provider's.
Description: OutageLog is a small tray app that checks your connection every 2 seconds by pinging your router and three independent internet servers and resolving a name without the DNS cache. It logs every drop and tells your Wi-Fi or router apart from the provider's line and from DNS failures, then turns the log into a one-page HTML report you can send to your provider, with every outage's start time, length and verdict and a day-by-day timeline. A built-in self-test fakes an outage without touching your real connection. Runs on .NET Framework 4.8, which is already part of Windows 10 and 11.
