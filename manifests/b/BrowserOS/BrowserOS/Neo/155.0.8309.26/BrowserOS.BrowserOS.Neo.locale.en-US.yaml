ShortDescription: The open-source agentic browser for AI agents
Description: BrowserOS neo is an open-source agentic browser built as a second browser for your AI agents. Import your logins from Chrome in one click, connect Claude Code, Codex or any MCP agent, and hand off your web tasks. Agents run in parallel in their own tabs while you watch live or replay any session like a video.
