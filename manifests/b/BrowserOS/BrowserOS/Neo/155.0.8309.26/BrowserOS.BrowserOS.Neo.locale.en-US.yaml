ReleaseNotes: |-
  ✨ What's new
  - Take over when your agent needs help. Neo now shows when an agent is waiting for you, takes you to the page that needs attention, and lets you hand control back with an optional note. Other agents can keep working while you help.
  - More reliable browser connections. Improved recovery when Neo is running but an agent loses access to the browser. Agents can also reconnect to their existing tab group and continue where they left off.
  - Downloads where you expect them. Agent downloads now use your browser's configured download folder, preserve existing files, and appear correctly in the browser's download list.
  - Tasks are now Skills. Updated the Neo interface to use the Skills name.
  - Chromium 155. Updated to Chromium 155.0.8059.26.
