ReleaseNotes: |-
  ✨ What's new
  - The new onboarding experience, now on Windows. Neo walks you through setup in a short conversation. Pick your browser profile, choose the supported data to bring over, and follow the import into your cockpit.
  - Watch your first task, then try it. The first-run cockpit shows your connected AI apps, an animated walkthrough, and a prompt to copy for your first task. Claude Cowork setup guidance is included.
  - A simpler first launch. Browser sign-in and default-browser prompts no longer interrupt Neo's startup.
  These onboarding changes first shipped for macOS and Linux in Neo 0.51.2.3.
