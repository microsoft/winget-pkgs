ReleaseNotes: |-
  ✨ What's new
  - More reliable agent connections. Neo now sets up and repairs its skill and MCP connection for supported agents, including agents installed while Neo is already running. It also remembers when you disconnect an app.
  - Control when agents ask for help. A new Ask for human help switch in Settings lets you turn off Neo's handoff prompts. When off, agents are instructed to explain what they need in their own chat instead.
  - Recovery after failed updates. Fixed cases where a failed server update left agent connections unavailable after restarting Neo. Neo now retries failed starts and keeps checking for recovery updates.
  - Clearer macOS updates. Updates downloaded in the background now show an update badge, and Relaunch to update applies the ready update.
  - Ultrafast early access. You can now join the Ultrafast mode waitlist from Neo's cockpit.
  Also improved: Fixed a crash when an agent opened a tab from a popup window, and made agent names on tab groups easier to recognize.
  Built on Chromium 155.0.8059.26.
