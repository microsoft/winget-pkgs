ReleaseNotes: |-
  ✨ What's new
  - No BrowserOS account needed. Sign-in and cloud-sync screens have been removed. Conversations continue to stay on your device, and sidebar history is now available to everyone.
  - Connect your preferred AI. The built-in BrowserOS model has been retired. Connect an LLM provider or a coding agent in AI Settings to chat. If a scheduled task used the built-in model, choose a connected provider for it too.
  - An updated model picker. The ChatGPT subscription model list now includes newer model families, and the provider catalogue has been refreshed. You can also enter a model ID directly; availability depends on your provider and subscription.
  - Screenshots reach custom providers. Fixed an issue that prevented vision-capable models on OpenRouter and other OpenAI-compatible providers from receiving the agent's screenshots.
  - Chromium 155. Updated to Chromium 155.0.8059.26.
