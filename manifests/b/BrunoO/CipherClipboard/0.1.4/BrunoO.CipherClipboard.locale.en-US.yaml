ShortDescription: Encrypted, cross-platform clipboard manager with instant search, syntax highlighting, and secure SQLCipher storage.
Description: |-
  CipherClipboard is an encrypted, privacy-first clipboard manager built in Rust.
  It stores clipboard history locally in an AES-256 encrypted SQLCipher database,
  offers instant fuzzy search, automatic code snippet language detection and syntax highlighting,
  color palette detection, and zero unencrypted data leakage.
