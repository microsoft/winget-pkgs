ShortDescription: Free up disk space without losing anything. Back up files you haven't touched in a year to the cloud, then delete them.
Description: |-
  dusty scans your drives for folders and files you have not modified in a long time and lists the
  largest whole stale units (projects are never split, system folders are never touched). Tick what
  you want gone and dusty copies it to Google Drive, OneDrive or any backup folder, verifies the copy
  (size, SHA-256 or zip CRC) and only then deletes the original. Folders with many small files are
  stored as a single zip, which is far faster on cloud drives. Portable, English and Turkish UI.
