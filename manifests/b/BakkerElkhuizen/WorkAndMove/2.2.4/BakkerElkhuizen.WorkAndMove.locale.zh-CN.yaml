Description: WORK & MOVE 是 BakkerElkhuizen 面向电脑工作的健康管理软件。它会记录你的电脑使用行为并给出反馈，依据你的个人建议最优的工作—活动—休息节奏，帮助你建立自己的节奏。本机安装包用于为一名或多名用户部署 WORK & MOVE；ClickOnce 和 Microsoft Store 版本无需管理员权限即可安装。安装包默认包含 90 天试用许可，安装后可以激活正式许可。
