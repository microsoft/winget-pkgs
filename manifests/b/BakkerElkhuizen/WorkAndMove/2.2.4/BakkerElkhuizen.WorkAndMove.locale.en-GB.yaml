ShortDescription: Coach your work-movement-break rhythm while you work at the computer.
Description: WORK & MOVE is BakkerElkhuizen's wellbeing software for computer work. It observes your computer behaviour, gives insight and feedback on it and advises an optimal work-movement-break rhythm matched to your personal needs, so you can build your own rhythm. Install this machine-wide deployment package to configure WORK & MOVE for one or several users; the ClickOnce and Microsoft Store editions install without administrator rights. The package ships with a 90-day trial license, and a production license can be activated after installation.
