ShortDescription: Shared clipboard for Mac and Windows over Wi-Fi, readable by AI tools.
Description: |-
  Clipferry keeps one clipboard across your computers. Pair them with a one-time code and anything you copy on one shows up on the other, directly over your local network and end-to-end encrypted, with no account or server.
  Passwords and API keys are detected before they travel, the history is searchable, and AI tools can read it over MCP.
