ShortDescription: SSH, serial and local terminal for network engineers.
Description: |-
  SheepTerm is a terminal client for network engineers. It runs SSH, serial consoles and local shells in tabs and split panes.
  It highlights switch, router and firewall output by vendor and keeps saved hosts, snippets and session logs.
  It can also sync your data, end-to-end encrypted, through your own Google Drive (optional).
  The app is portable: its data is kept in a Data folder next to SheepTerm.exe.
