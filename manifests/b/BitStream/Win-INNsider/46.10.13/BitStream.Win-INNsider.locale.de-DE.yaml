ShortDescription: Geräteinfos und Schnellschalter in der Taskleiste für Anwender und Helpdesk.
Description: |-
  Win-INNsider legt ein Symbol in den Infobereich der Taskleiste. Ein Klick öffnet ein Flyout im Stil der
  Windows-Schnelleinstellungen: Geräteinfos (Rechnername, Benutzer, Domäne, Modell, Seriennummer, CPU, RAM,
  Datenträger, Netzwerkadapter, Windows-Version, Betriebszeit) und Aktionen (Touch-Display, Präsentationsmodus,
  Energie, Intune-Sync, MECM-Zeitpläne, GPUpdate, Support-Verweise). Jede Zeile ist kopierbar, „Support-Info kopieren“
  sammelt alles für das Ticket. Konfigurierbar über Intune oder MECM.
  Für Privatanwender kostenlos ohne Registrierung; Unternehmen und Behörden registrieren sich (kostenlos oder mit
  Supportvertrag). Ein Windows-Dienst prüft etwa einmal am Tag das signierte Versionsmanifest von BitStream und
  installiert neue Fassungen; winget upgrade geht ebenso.
