ShortDescription: Device information and quick toggles in the Windows taskbar for users and the helpdesk.
Description: |-
  Win-INNsider puts an icon in the notification area. One click opens a flyout in the style of the Windows quick
  settings: device information (computer name, user, domain, model, serial number, CPU, RAM, disks, network adapters,
  Windows version, uptime) and actions (touch display, presentation mode, power settings, Intune sync, MECM
  schedules, GPUpdate, support links). Every line can be copied, and "Copy support info" collects it for a ticket.
  Configurable via Intune or MECM.
  Free for private use without registration; businesses and public authorities register (free of charge or with a
  support contract). A Windows service checks BitStream's signed release manifest about once a day and installs new
  versions; winget upgrade works as well.
