ShortDescription: File properties, signature and checksums of a file
Description: Explorer context menu tool that shows the properties of a file, its Authenticode signature (signer, issuer, validity, revocation, timestamp, EV/OV) and the checksums MD5, SHA1, SHA256, SHA384 and SHA512 in a single read pass. Also shows the origin (Mark of the Web) and offers a command-line check with exit code and JSON output.
