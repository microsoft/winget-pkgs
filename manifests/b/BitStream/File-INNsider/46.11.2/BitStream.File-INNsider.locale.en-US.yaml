ShortDescription: Explorer context menu tool that shows file properties, Authenticode signatures and checksums.
Description: |-
  File-INNsider adds an entry to the Explorer context menu. One window shows the file and version properties, the
  Authenticode signature with signer, issuer, timestamp and revocation state, and the MD5, SHA1, SHA256, SHA384 and
  SHA512 checksums of a file. A checksum pasted into the compare field is matched against all algorithms.
  Free for private use without registration; businesses and public authorities register (free of charge or with a
  support contract). The application never updates itself; use winget upgrade.
