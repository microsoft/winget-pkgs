ShortDescription: Zeigt Eigenschaften, Authenticode-Signatur und Prüfsummen einer Datei per Rechtsklick im Explorer.
Description: |-
  File-INNsider ergänzt das Kontextmenü des Explorers. Ein Fenster zeigt Datei- und Versionsangaben, die
  Authenticode-Signatur mit Signierer, Aussteller, Zeitstempel und Sperrlage sowie die Prüfsummen MD5, SHA1, SHA256,
  SHA384 und SHA512. Eine eingefügte Prüfsumme wird mit allen Verfahren verglichen.
  Für Privatanwender kostenlos ohne Registrierung; Unternehmen und Behörden registrieren sich (kostenlos oder mit
  Supportvertrag). Das Programm aktualisiert sich nie selbst; neue Fassungen kommen mit winget upgrade.
