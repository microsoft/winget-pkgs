ShortDescription: A JDK version manager for Windows, similar to nvm-windows
Description: >-
  Single-binary JDK version manager for Windows. Installs, switches, updates
  and removes JDKs from Temurin, Corretto, Microsoft Build of OpenJDK, Azul
  Zulu, BellSoft Liberica and Oracle GraalVM without administrator rights,
  automatically configuring JAVA_HOME and PATH so every new terminal instantly
  uses the selected version.
