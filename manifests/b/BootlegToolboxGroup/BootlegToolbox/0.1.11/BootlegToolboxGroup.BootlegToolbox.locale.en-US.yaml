ShortDescription: Checksums, tests, torrents and conversions for lossless concert recordings, a modern take on Trader's Little Helper.
Description: |-
  Bootleg Toolbox is a free, open-source desktop program for collectors and traders of lossless concert recordings. It covers the everyday jobs traders use Trader's Little Helper for, and adds checks TLH never had.
  - Verify and create FFP, ST5, MD5 and SFV checksum files; decode test every file in full.
  - Lossless? tells whether a recording really comes from a lossless source (lowpass, MP3 and AAC encoder traces, lossyWAV, fake 24-bit, upsampling); Speed? tells whether a tape runs fast or slow.
  - Spectrograms, MediaInfo-style summaries, private torrents for Dime a Dozen, The Traders' Den and other trackers, and a check of a show against its .torrent.
  - To FLAC (checked by reading back), to WAV, MP3 copies, SBE fix, Tag and rename from the info file, setlists from setlist.fm, DVD audio extraction.
  - Reads FLAC, WAV, AIFF, APE, SHN, WavPack, ALAC, MP3, MP2, AAC, Ogg, M4A, MKA, MP4 videos and DVD folders.
  One executable, nothing else to install. Originals are never changed, and nothing goes over the network unless you ask. Every operation also runs from the command line (bootleg-toolbox --cli help).
Moniker: bootleg-toolbox
