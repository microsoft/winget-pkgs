ReleaseNotes: |-
  New formats
  - AIFF and AIFF-C (.aif, .aiff, .aifc), read as lossless: every check, analysis and To FLAC works as for WAV.
  - Ogg (.ogg, .oga): FLAC in Ogg is lossless and converts to FLAC; Vorbis is flagged as lossy and never converted to FLAC; tags are carried over. Opus is not supported yet and says so.
  Easier to read
  - The Result column and the log wrap when the window is narrow, instead of cutting the text.
  - Shorter Convert menu: FLAC levels 0-8 on one row.
  - Correct plurals everywhere.
  Fixes
  - A show's length no longer counts a FLAC and a WAV of the same track twice.
  - Clean WAV copies show as "WAV-cleaned: <show>".
  - Clearer Speed?, Lossless? and DVD audio extraction wording.
  The executable is not code-signed yet (SignPath application in progress): Windows SmartScreen may warn on first launch.
ReleaseNotesUrl: https://github.com/bootleg-toolbox-group/bootleg-toolbox/releases/tag/v0.1.11
InstallationNotes: The executable is not code-signed yet, so Windows SmartScreen may warn on first launch. Run bootleg-toolbox to open the window, or bootleg-toolbox --cli help for the command line.
