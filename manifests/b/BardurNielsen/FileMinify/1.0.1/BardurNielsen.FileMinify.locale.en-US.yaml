ShortDescription: Compress videos, images and PDFs, convert between formats and merge files into one PDF, in the browser, on this PC, and on phones on the same Wi-Fi.
Description: |-
  FileMinify shrinks phone videos to an email-sized clip, compresses images and
  PDFs, converts Office documents, images and PDFs between formats, and merges
  anything printable into one PDF. It runs on this PC and opens in the browser;
  nothing is uploaded anywhere else. It uses FFmpeg, ImageMagick and LibreOffice
  (installed as dependencies) and ships GPL Ghostscript (AGPL v3) unmodified.
