ShortDescription: Fast, free image viewer that flips through the whole folder without waiting.
Description: |-
  Lumaflip is a fast, free image viewer. Opening one image opens its whole folder; the neighbouring
  images are preloaded, so the arrow keys flip through the folder immediately.
  It reads JPEG, PNG, GIF, WebP, TIFF, HEIC/AVIF, JPEG XL, camera RAW, SVG, PSD and more (on Windows
  through the system codecs), browses ZIP/CBZ/RAR/7z archives like folders, shows metadata and a
  histogram, rates and culls photos with Lightroom-compatible XMP sidecars, compares images side by
  side and never uploads anything. No account, no subscription, no telemetry.
