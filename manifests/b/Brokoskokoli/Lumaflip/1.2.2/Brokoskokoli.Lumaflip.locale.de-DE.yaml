ShortDescription: Schneller, freier Bildbetrachter, der den ganzen Ordner ohne Wartezeit durchblättert.
Description: |-
  Lumaflip ist ein schneller, freier Bildbetrachter. Ein geöffnetes Bild öffnet den ganzen Ordner;
  die Nachbarbilder werden vorab geladen, sodass die Pfeiltasten sofort weiterblättern.
  Liest JPEG, PNG, GIF, WebP, TIFF, HEIC/AVIF, JPEG XL, Kamera-RAW, SVG, PSD und mehr (unter Windows
  über die Codecs des Systems), blättert durch ZIP-/CBZ-/RAR-/7z-Archive wie durch Ordner, zeigt
  Metadaten und Histogramm, bewertet und sortiert Fotos aus (XMP, kompatibel mit Lightroom),
  vergleicht Bilder nebeneinander und lädt nichts hoch. Kein Konto, kein Abo, keine Telemetrie.
