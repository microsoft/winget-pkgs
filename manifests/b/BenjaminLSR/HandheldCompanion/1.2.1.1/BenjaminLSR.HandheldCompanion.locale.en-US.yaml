ReleaseNotes: "# 1.2.1.1 — New Devices, Controllers, Input Features & Hotfixes\r\n\r\nSince the release of 1.0.0.0, we've continued expanding Handheld Companion's hardware support while improving controller handling, input customization, performance, and the overall user experience.\r\n\r\nThis release adds support for new devices and controllers, introduces remote/network controller support, expands touchpad and keyboard customization, improves virtual controller performance, and brings a wide range of UI, power-management, and stability improvements.\r\n\r\nA follow-up hotfix also addresses several issues discovered after the initial 1.2.0.x releases, particularly around controller streaming, trackpad haptics, response curves, profiles, and the new 2026 Steam Controller.\r\n\r\n## Highlights\r\n\r\n### Expanded Device Support\r\n\r\nHandheld Companion now supports:\r\n\r\n• OneXPlayer X2\r\n• OneXPlayer X2 Mini Pro\r\n• Valve Fremont (Steam Machine)\r\n• Legion Go and Legion Go 2 DirectInput mode\r\n• Steam Deck OLED firmware `0x1100`\r\n• 2026 Steam Controller\r\n\r\n### Remote & Network Controllers\r\n\r\nControllers can now be connected through the network, allowing Handheld Companion to use their input and motion data as if they were locally connected.\r\n\r\nRemote controller support includes:\r\n\r\n• Automatic controller discovery over the network\r\n• Button, axis, and controller-state streaming\r\n• Accelerometer and gyroscope streaming\r\n• Controller metadata and button glyph synchronization\r\n• Connection and disconnection management\r\n• Remote controller sessions\r\n• Dedicated remote controller section\r\n• Disconnect action for network controllers\r\n• Protection against network controllers discovering themselves through local discovery\r\n\r\nWhen streaming a controller, the host device can automatically dim its display and apply the profile's on-battery power preset to help preserve battery life.\r\n\r\nThis makes it possible to use a handheld as a controller, or use a controller physically connected to another device as an input source for Handheld Companion without requiring a direct USB or Bluetooth connection.\r\n\r\n### Controller Improvements\r\n\r\n• Added support for the 2026 Steam Controller.\r\n• Improved virtual controller device management and cleanup.\r\n• Reduced virtual controller CPU usage.\r\n• Improved controller state handling.\r\n• Fixed controller target transition races.\r\n• Fixed SDL `OpenGamepad()` / `CloseGamepad()` handling affecting the 2026 Steam Controller.\r\n• Fixed Steam Controller mode setting type handling.\r\n• Corrected motion-sensor mappings for GPD and OneXPlayer devices.\r\n• Prevented duplicate device insertion events.\r\n• Fixed a regression when assigning the Legion Go controller to XInput slot 1.\r\n\r\n> The virtual controller CPU usage reduction is based on the work of [[corando98/VIIPER](https://github.com/viiper)](https://github.com/viiper), included here with their contribution.\r\n\r\n## Input & Layouts\r\n\r\n• Added configurable trackpad haptic feedback, touch, click, and scrolling.\r\n• Added `TouchpadActions` for touchpad gestures, touch, and click actions.\r\n• Added configurable keystroke duration for keyboard hotkeys.\r\n• Improved keyboard chord handling and interception.\r\n• Fixed modifier handling in key sequences involving `Ctrl`, `Alt`, `Win`, `AltGr`, and `Shift`.\r\n• Fixed Special button passthrough while the controller is muted.\r\n• Fixed response curves and movement haptics for joystick, mouse, and touchpad mappings.\r\n\r\n## Device Support\r\n\r\n• Added OneXPlayer X2 and X2 Mini Pro support, including X2-specific EC handling and Turbo button takeover.\r\n• Added Valve Fremont support.\r\n• Added DirectInput mode for Legion Go and Legion Go 2.\r\n• Added Steam Deck OLED firmware `0x1100` support.\r\n• Added Intel prebuilt shader download controls, including per-application support where available.\r\n• Added an MSI Claw `Win+G` workaround for proper OEM key use and mapping.\r\n• Improved HID device handling and centralized HID cleanup.\r\n• Improved fan control across supported devices.\r\n\r\n## Performance & Power Management\r\n\r\n• Migrated GPU telemetry and overlay metrics to LibreHardwareMonitor.\r\n• Fixed crashes caused by GPU telemetry query failures.\r\n• Corrected default CPU policies for heterogeneous and homogeneous CPUs.\r\n• Disabled core parking by default on homogeneous CPUs.\r\n• Updated Intel KX processor support used for CPU power-management controls.\r\n• Restored power-profile EPP management.\r\n• Added an option to enable or disable the frame limiter.\r\n• Improved GPU telemetry, overlay metrics, and background performance.\r\n• Improved power management during controller streaming.\r\n\r\n## UI & Library\r\n\r\n• Improved Library navigation and visual presentation.\r\n• Added library check timestamps and game counts.\r\n• Added localized relative-time display.\r\n• Improved profile page layout, spacing, and dialog scrolling.\r\n• Added accent styling to settings cards.\r\n• Hid unsupported device settings.\r\n• Added manual artwork overrides for library entries.\r\n• Added navigation from toast notifications to the relevant page.\r\n• Improved overlay customization.\r\n• Moved remote controllers into their own dedicated section.\r\n• Relocated advanced remote-controller settings under Steam Deck settings.\r\n• Fixed profile artwork carousel indices becoming temporarily invalid while artwork was loading.\r\n\r\n## Miscellaneous\r\n\r\n• Avoided uninstalling ViGEm during setup.\r\n• Updated the installer to Inno Setup 7.1.0.\r\n\r\n**Full Changelog**：https://github.com/Valkirie/HandheldCompanion/compare/0.32.2.0...1.2.1.1\r\n\r\n<img width=\"820\" height=\"520\" alt=\"Screenshot 2026-08-23 134959\" src=\"https://github.com/user-attachments/assets/84d8e90e-6e32-4f8a-8806-864eceaf4758\" />\r\n<img width=\"820\" height=\"467\" alt=\"Screenshot 2026-08-26 151437\" src=\"https://github.com/user-attachments/assets/7c050432-2cca-4853-9a0f-53947a599e82\" />\r\n<img width=\"820\" height=\"467\" alt=\"Screenshot 2026-08-26 151455\" src=\"https://github.com/user-attachments/assets/a8bf3354-125f-4c50-8c26-7a4ee4312b08\" />\r\n<img width=\"820\" height=\"461\" alt=\"1\" src=\"https://github.com/user-attachments/assets/85115862-42c6-41ee-a3eb-b429a141221a\" />\r\n<img width=\"820\" height=\"461\" alt=\"Untitled\" src=\"https://github.com/user-attachments/assets/949598f1-91e4-4e73-8543-329b166efe2e\" />\r\n<img width=\"820\" height=\"467\" alt=\"Screenshot 2026-08-26 151317\" src=\"https://github.com/user-attachments/assets/324d99bf-fd03-4afe-a3ab-8d61e0dc47c4\" />"
