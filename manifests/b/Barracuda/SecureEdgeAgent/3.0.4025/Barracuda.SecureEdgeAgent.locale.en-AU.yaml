Description: Barracuda SecureEdge secures your users, sites and things with an easy-to-deploy cloud-first platform that connects any device, application and cloud/hybrid environment. Remote users access applications directly from any type of device with Zero-Trust enforcement, URL filtering and protection from web-based threats. Last kilometre traffic optimisation ensures fast and reliable application access, making the most of shared Internet lines. Barracuda SecureEdge provides an unprecedented level of control and visibility into user-generated traffic at each endpoint.
