ReleaseNotes: |-
  TiLex 0.2.3
  相比 0.2.2 的改动。直接运行新安装包升级即可，设置和生词本会保留。
  新增
  - 划词翻译快捷键：在任意程序里选中文字，按快捷键直接弹出翻译结果，不用等划词浮标。浮标关闭时也能用。默认留空。
  - 「快捷键」设置页：位于「生词本」和「关于」之间，集中设置划词翻译、截图翻译、开关设置窗口三个快捷键。设成已被占用的组合时会提示被哪一项占用。
  - 字体选择：「翻译设置」第一项。可选微软雅黑细（默认）、微软雅黑，以及宋体、黑体、楷体、Segoe UI 等常用字体，只列出电脑上装了的。切换后所有窗口立即生效。
  修复与改进
  - 文字更清楚：开启字体微调（hinting），笔画对齐像素，不再发灰、像带阴影。宋体、新宋体在小字号下使用字体自带的点阵，和系统程序里一样清楚。
  - 生词本：详情里原文黑色、译文灰色，一眼分清。
  - 图标：任务管理器和标题栏的小图标不再失真。

  TiLex 0.2.3 (English)
  Changes since 0.2.2. Run the new installer to upgrade. Your settings and wordbook are kept.
  New
  - Translate Selection hotkey: Select text in any app and press the hotkey to open the translation right away, without waiting for the floating icon. Works even when the floating icon is off. Empty by default.
  - Shortcuts settings page: A new page between Wordbook and About with all three hotkeys: Translate Selection, Screenshot Translate, and Toggle Settings Window. If a combination is already taken, TiLex tells you which one uses it.
  - Font choice: The first item on the Translate page. Choose Microsoft YaHei Light (default), Microsoft YaHei, or common fonts such as SimSun, SimHei, KaiTi, and Segoe UI. Only installed fonts are listed. All windows update right away.
  Fixes & Improvements
  - Sharper text: Font hinting is now on, so strokes line up with pixels and no longer look gray or shadowed. SimSun and NSimSun use their built-in bitmaps at small sizes and look as sharp as in native apps.
  - Wordbook: In the detail view, source text is black and translations are gray, so they are easy to tell apart.
  - Icons: The small icon in Task Manager and the title bar is no longer distorted.
