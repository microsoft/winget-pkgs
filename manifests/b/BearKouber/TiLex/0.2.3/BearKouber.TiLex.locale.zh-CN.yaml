PackageIdentifier: BearKouber.TiLex
PackageVersion: 0.2.3
PackageLocale: zh-CN
ShortDescription: Windows 上的划词翻译与截图 OCR 工具。
Description: |-
  选中文字即可浮出小按钮查看翻译，框选屏幕任意区域即可借助本机微信 OCR 或自托管的 Umi-OCR 服务识别文字。必应、谷歌、腾讯交互翻译免配置直接使用，百度和 DeepL 可填写自己的密钥，还能通过内置厂商预设接入任意 OpenAI 兼容的 AI 服务。翻译结果可一键收藏到本地生词本。

  特性
  - 划词即翻译 —— 选中文字，旁边浮出一个小按钮，点一下出结果。原文已经是母语时不打扰。
  - 截图 OCR —— 框选屏幕上任意一块认字，识别能力来自本机已装的微信， 或你自己跑的 Umi-OCR（离线）。
  - 六家翻译引擎并排出结果 —— 必应 / 谷歌 / 腾讯交互翻译免配置直接用， 百度 / DeepL 填自己的 key。
  - 任意 OpenAI 兼容的 AI 服务 —— 内置厂商预设，填地址和 key 就能加一个； 支持 OpenAI / Anthropic / Gemini 三种协议格式。
  - 模型测速与优选 —— 一次把账号下的模型全测一遍延迟，直接选最快的那个。
  - 生词本 —— 划词结果一键收藏，本地 SQLite 存着。
