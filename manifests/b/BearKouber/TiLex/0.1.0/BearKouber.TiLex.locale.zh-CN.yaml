ReleaseNotes: |-
  TiLex 0.1.0
  TiLex 是一个 Windows 上的划词翻译与截图 OCR 工具。
  名字取自 Tiny（轻巧） + Lexicon（词典）。
  这是第一个发布版本，核心功能已经齐备：
  主要功能
  - 划词浮标与弹窗：鼠标选中文字后，光标旁会弹出小浮标，点击展开翻译面板。浮标位置、展开方向均可在设置里自定义。
  - 截图 OCR：框选屏幕直接认字。识别能力直接调用本机已有的微信 OCR，或者你自己运行的本地 Umi-OCR 服务，TiLex 本身不打包笨重的模型文件。
  - 多引擎并排：内置必应、谷歌、腾讯交互翻译，免配置直接可用，方便横向比对译文。
  - 自定义 AI 服务：支持兼容 OpenAI、Anthropic、Gemini 协议的各类大模型，内置测速功能，帮你挑选延迟最低的模型。
  - 跳过母语：自动检测语种，选中的内容如果是目标语言则不弹窗打扰。
  - 本地生词本：翻译结果一键收藏，数据离线保存在本地 SQLite。
  系统要求：Windows 10 (1809 及以上) 或 Windows 11。
  来源与致谢
  - 代码基底：衍生自 pot-desktop
  - 交互设计：参考了 Easydict
  - OCR 驱动思路：借鉴自 STranslate
