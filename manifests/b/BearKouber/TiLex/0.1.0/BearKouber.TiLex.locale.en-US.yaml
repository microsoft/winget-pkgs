ShortDescription: Windows translation and screenshot OCR tool with selection popups.
Description: |-
  Select text to bring up a floating button and see the translation, or drag to select any area of the screen and recognize the text with local WeChat OCR or a self-hosted Umi-OCR service. Bing, Google, and Tencent Transmart work without API keys, Baidu and DeepL accept your own keys, and any OpenAI-compatible AI service can be connected through built-in vendor presets. Results can be saved into a local wordbook with one click.

  Features
  - Select to Translate — Select text to bring up a floating button; click to see results. Silent when the selection is already in your native language.
  - Screenshot OCR — Select any area on the screen to recognize text. Powered by local WeChat OCR (if installed) or offline Umi-OCR.
  - Multi-Engine Results — Bing, Google, and Tencent Transmart work out of the box with no API keys. Baidu and DeepL can be used with your own keys.
  - Any OpenAI-Compatible AI Service — Built-in vendor presets. Just enter the URL and API key. Supports OpenAI, Anthropic, and Gemini protocol formats.
  - Model Speed Test & Selection — Benchmark latency across all available models on your account in one run to pick the fastest one.
  - Wordbook — Save words from translation results into a local SQLite database with one click.
