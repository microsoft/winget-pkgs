ReleaseNotes: |-
  TiLex 0.1.0
  TiLex is a selection translation and screenshot OCR tool for Windows.
  The name comes from Tiny + Lexicon.
  This is the first release with all core features ready:
  Key Features
  - Selection Indicator & Popup: Select text to display a small floating indicator next to the cursor. Click it to expand the translation panel. Indicator position and panel expand direction are fully
    customizable in Settings.
  - Screenshot OCR: Drag and select any area on the screen to recognize text. It directly utilizes the existing local WeChat OCR on your machine or your self-hosted Umi-OCR service—TiLex does not
    bundle heavy model files.
  - Side-by-Side Engines: Built-in Bing, Google, and Tencent translators work out of the box with zero configuration, allowing easy side-by-side translation comparisons.
  - Custom AI Services: Supports models compatible with OpenAI, Anthropic, and Gemini API formats, with a built-in latency benchmark to help you find the fastest model.
  - Skip Native Language: Automatically detects language and suppresses popups if the selected text is already in the target language.
  - Local Wordbook: Save translation results with one click. Data is stored offline in a local SQLite database.
  System Requirements: Windows 10 (version 1809 or higher) or Windows 11.
  Credits & Acknowledgements
  - Base codebase: Derived from pot-desktop
  - Interaction design: Inspired by Easydict
  - OCR driver architecture: Inspired by STranslate
