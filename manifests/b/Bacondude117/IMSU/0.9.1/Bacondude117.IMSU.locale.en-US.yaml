ShortDescription: Checks whether your PC's BIOS, chipset drivers and graphics drivers are up to date.
Description: |-
  IMSU (Is my shit updated?) checks your motherboard BIOS, chipset and platform drivers, and AMD or NVIDIA graphics drivers, and gets updates straight from the makers.
  It sits in the system tray and checks in the background. Downloads only come from the makers' own servers and are verified. IMSU never flashes your BIOS; it walks you through doing it yourself.
