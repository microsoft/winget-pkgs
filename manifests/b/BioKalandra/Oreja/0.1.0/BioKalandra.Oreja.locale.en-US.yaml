ShortDescription: One-click Windows tray recorder for microphone and system audio, saved as 16 kHz mono FLAC for Whisper transcription.
Description: |-
  Oreja sits silently in the system tray. One click starts a recording of the default microphone plus the system audio of all playback devices, mixed into a single 16 kHz mono FLAC file; another click stops it. No sounds, no windows – the tray icon shows the state.
  Finished recordings are moved into a configurable folder (e.g. a Google Drive for Desktop folder). The user interface is German.
