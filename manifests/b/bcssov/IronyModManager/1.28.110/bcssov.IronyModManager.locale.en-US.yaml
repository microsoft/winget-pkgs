ReleaseNotes: "## Current Release Notes\n\n• Fix #624 ORM regression affecting legacy launcher database updates\n\n## Release Notes 1.28\n\n• Upgrade to .NET 10\n• Update dependencies\n• Update Steamworks.NET\n• Update LiteDB\n• Modernize CWTools integration\n• Improve Wayland support\n• Fix deployment bugs on OSX\\Linux\n• Improve Windows rendering recovery for rare blank or unresponsive windows\n• Improve deterministic build composition\n• Generalize Avalonia build workaround\n• Harden update artifact signature validation\n• Remove obsolete image parsing references\n• Remove SharpCompress\n• Update localization\n• Improve parser compatibility\n• Improve Compress Merge writable preflight\n• Improve collection rename progress feedback\n• Add per-game filesystem safety and recovery\n• Preserve missing collection mods as virtual entries\n• Preserve missing mods when importing collections\n• Improve collection persistence across unavailable mod sources\n• Add controlled recovery after changing mod directories\n• Skip unavailable mods when applying or launching collections\n• Preserve missing-mod metadata when exporting collections\n• Add visual indicators for unavailable collection mods\n• Improve virtual mod removal and collection membership handling\n• Add virtual-mod-aware collection undo and redo\n• Add local mod aliases\n• Search mods by local alias\n• Add Advanced Filter UI for mod search\n• Add exact mod-set Ignore Rules to Conflict Solver\n• Add GUI management for exact mod-set Ignore Rules with Add/Delete and read-only preview\n• Preserve exact mod-set Ignore Rules through Conflict Solver persistence and legacy rule editing\n• Note：Exact mod-set Ignore Rules are new in 1.28 and are not understood correctly by older Irony versions\n• Improve Options scaling and accessibility\n• Add responsive Options layout for high-DPI and small viewports\n• Add macOS application bundle packaging\n• Improve macOS Finder launch compatibility\n• Improve macOS update experience with manual release-page updates\n• Improve conflict analysis equivalence filtering\n\n---\n\n# Which file should I download?\n\n## Windows\n\n• Portable version：`win-x64.zip`\n• Installer version：`win-x64-setup.zip`\n\n## MacOS\n\n• Finder convenience bundle (recommended)：`IronyModManager-osx-x64-app.tar.gz`\n• Portable fallback：`osx-x64.zip`\n\nThe macOS app bundle is unsigned and not notarized. Depending on your macOS security settings and how the archive was downloaded, macOS may require you to explicitly allow the application before it can run.\n\n## Linux\n\n• Portable version：`linux-x64.zip`\n\n---\n\n# How to run Irony\n\n## Windows\n\n### Portable build\n\n1. Download `win-x64.zip`\n2. Extract it anywhere\n3. Run `IronyModManager.exe`\n\n### Installer build\n\n1. Download `win-x64-setup.zip`\n2. Extract it\n3. Run `win-x64-setup.exe`\n4. Follow the on-screen instructions\n\n---\n\n## MacOS\n\n### App bundle\n\n1. Download `IronyModManager-osx-x64-app.tar.gz`.\n2. Extract it using a tool that preserves Unix permissions.\n3. Open `IronyModManager.app` from Finder.\n\nThe app bundle is unsigned and unnotarized. macOS may therefore require the normal user approval applicable to downloaded unsigned software before opening it.\n\n### Portable fallback\n\nIf the app bundle does not work on your system, the existing portable build remains available:\n\n1. Download and extract `osx-x64.zip`.\n2. Open Terminal.\n3. Navigate to the extracted Irony directory:\n   `cd /path/to/Irony`\n4. Make the file executable:\n   `chmod +x IronyModManager`\n5. Run Irony:\n   `./IronyModManager`\n\n(Important：`./` must be included.)\n\n### Updating Irony on MacOS\n\nIrony can check for new versions on macOS, but automatic installation is not supported.\n\nWhen an update is available, **Open Release Page** opens the official GitHub releases page. Download the latest macOS build and replace your existing copy manually.\n\n---\n\n## Linux\n\n1. Download and extract `linux-x64.zip`.\n2. Open a terminal in the extracted directory.\n3. Make Irony executable:\n   `chmod +x IronyModManager`\n4. Run Irony:\n   `./IronyModManager`\n\n---"
