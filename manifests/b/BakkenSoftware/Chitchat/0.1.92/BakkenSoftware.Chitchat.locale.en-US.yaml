InstallationNotes: >-
  The local speech engine requires a separate setup download. Open a new PowerShell
  window after installation and run & "$env:LOCALAPPDATA\Programs\chitchat-sonnet\chitchat.exe" setup,
  then run & "$env:LOCALAPPDATA\Programs\chitchat-sonnet\chitchat.exe" start.
  If you chose another installation directory, use its chitchat.exe path.
  See https://github.com/bakkensoftware/chitchat-releases#installation-and-first-use.
