ShortDescription: Fast, light, cross-platform disk space analyzer that runs without admin privileges! Go beyond directory listing, gain actionable insights from the interactive graphs.
Description: Drive Sonar is a fast, lightweight, cross-platform disk space analyzer built with Rust and Tauri. It allows you to visualize drive usage through interactive treemaps, identify large files via histograms and scatter plots, and perform safe file cleanups (after confirmation and several saftety checks) with high performance and low memory overhead. In addition, you can also save the disck scan report. Optimized for Windows, Drive Sonar runs on Linux and macOS as well, giving you a consistent user experience.
