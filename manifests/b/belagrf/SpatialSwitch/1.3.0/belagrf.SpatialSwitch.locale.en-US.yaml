ShortDescription: Switches Windows Spatial Sound automatically while selected games run.
Description: |-
  A small tray app that changes your output device's spatial sound format (Dolby Atmos, Windows Sonic, DTS Headphone:X or Off) while any program from your list is running, and switches back when the last one exits.
  Typical use: turn spatial sound off for games that render their own 3D audio, such as Valorant or CS2, and keep Atmos or Sonic for everything else.
  Includes NirSoft SoundVolumeView, which performs the switch.
