ShortDescription: Fixes text typed with the wrong keyboard layout (Hebrew/English, French AZERTY) with one key, F10.
Description: |-
  Keyboard Layout Fixer is a small tray app for Windows 10 and 11. Typed "akuo" instead of the Hebrew word you meant? Select the text and press F10: it is converted to the other keyboard layout. F9 fixes text typed with Caps Lock on. The clipboard is put back after each fix, and nothing you type is ever sent or stored.
