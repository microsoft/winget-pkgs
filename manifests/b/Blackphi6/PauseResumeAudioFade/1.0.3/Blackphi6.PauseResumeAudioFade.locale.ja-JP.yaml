PackageIdentifier: Blackphi6.PauseResumeAudioFade
PackageVersion: 1.0.3
PackageLocale: ja-JP
PackageName: Pause Resume Audio Fade
ShortDescription: 一時停止・再開・シークのたびに、音を自動でフェードさせるタスクトレイ常駐アプリ。
Description: |-
  動画や音楽の一時停止・再開・シークのたびに、アプリを問わず音を自動でフェードさせます。
  音を少し遅らせて、一時停止を検出したら遡ってフェードアウトをかけ、実際の出力へ再生します。
  元の音を逃がす「使っていない出力」が1つ必要です。無料の仮想ケーブル VB-CABLE か、余っている出力デバイス
  (スピーカーとヘッドホン、HDMIモニターなど)を使います。初回の案内画面で手順を表示します。
  インターネットには接続せず、音声の録音・保存もしません。
ReleaseNotes: アプリアイコン(Mac版と共通)と、状態を示すバッジ付きのトレイアイコンを追加しました。
ManifestType: locale
