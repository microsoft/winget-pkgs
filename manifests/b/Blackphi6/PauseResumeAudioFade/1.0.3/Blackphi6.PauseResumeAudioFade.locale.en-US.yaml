ShortDescription: System tray app that fades audio on pause, resume and seek for all apps.
Description: |-
  Pause Resume Audio Fade for Windows fades the sound of any application when you pause, resume or seek
  (browsers, video and music players): no abrupt cut-offs, and a soft fade-in on resume.
  It delays the audio by a short lookahead, applies the fade-out retroactively and plays it on your real output.
  It needs an unused output device to route the original sound to: the free virtual cable VB-CABLE, or a spare
  output device (for example speakers plus headphones, or an HDMI monitor). A first-run guide explains this.
  It does not access the internet and does not record or store audio.
