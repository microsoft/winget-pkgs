ShortDescription: One keyboard, mouse and clipboard for all your computers on the local network.
Description: |-
  DeskFlower lets you control several computers with a single keyboard and mouse: move the cursor past the edge of your screen and it continues on the next computer.
  It shares the clipboard (text, images and files), lets you drag files between computers, can show another computer's screens on your monitor (remote view, with that computer's approval) and receives photos and files from your phone through a QR code.
  Devices pair with a one-time 6-digit PIN and all traffic is encrypted. Everything stays on your local network: no account, no cloud, no telemetry.
