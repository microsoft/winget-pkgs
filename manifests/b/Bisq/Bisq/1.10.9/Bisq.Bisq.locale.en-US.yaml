ReleaseNotes: |-
  Release notes
  This important security update fixes vulnerabilities identified during our recent security audit and includes the latest Tor security release.
  Updating to this version is required to continue trading.

  Trading and Payments
  - The API prevents payment-started confirmation before seller payment details arrive.
  - Revolut account details use the Revtag identifier.
  - Offer republishing waits for P2P bootstrap to complete.

  Reliability
  - Trusted BSQ block providers are initialized once, including when the configured list is empty.
  - Bank account input validation runs before country-dependent fields are cleared.

  BSQ Swaps
  - Validate BSQ swap inputs and signatures at both sides of the trade, including outpoint binding and duplicate input checks.

  Tor
  - Update to Tor 0.4.9.13.

  Installation

  macOS
  Bisq does not use Apple's notarization process (see why).
  For that reason you will see that (misleading) alert:
  <img src="https://github.com/user-attachments/assets/e058c34c-38f5-4329-8fc5-f48b3f2ba4dd" width="180"/>
  Grant permissions by:
  - run sudo xattr -rd com.apple.quarantine /Applications/Bisq.app in a terminal (type Terminal in the Apple search box)
  - open Bisq again
  More details can be found here.

  Windows
  For similar reasons you will get that warning at Windows: Windows protected your PC
  - Click the More info button when prompted
  - Click the Run anyway button when prompted
  More details can be found here.

  Verify download
  See the verification and installation instructions in the Bisq Wiki.
