ReleaseNotes: |-
  Release notes
  This important security update includes the latest Tor security release.

  Tor and Security
  - Updated the netlayer dependency to v0.7.12, which includes Tor 0.4.9.14.
  - Renewed the validity of the release signing keys and removed the unused, expired key 4A133008.

  DAO Resources
  - Updated bundled mainnet DAO state and block data through height 971800.
  - Added DAO state hash checkpoints for heights 970000 and 971000; nodes with a diverging DAO state resync from the bundled data.
  - Added the Burning Man address list v0007.
  - Stopped shipping the short-lived temporary proposal store.

  Builds
  - Updated CI actions.
  - The application and packaging version is 1.10.10.

  Installation

  macOS
  Bisq does not use Apple's notarization process (see why).
  For that reason you will see that (misleading) alert:
  <img src="https://github.com/user-attachments/assets/e058c34c-38f5-4329-8fc5-f48b3f2ba4dd" width="180"/>
  Grant permissions by:
  - run sudo xattr -rd com.apple.quarantine /Applications/Bisq.app in a terminal (type Terminal in the Apple search box)
  - open Bisq again
  More details can be found here.

  Windows
  For similar reasons you will get that warning at Windows: Windows protected your PC
  - Click the More info button when prompted
  - Click the Run anyway button when prompted
  More details can be found here.

  Verify download
  See the verification and installation instructions in the Bisq Wiki.
