ShortDescription: Scan-station client that exposes a connected TWAIN or ISIS scanner to a Grooper server
Description: |
  GrooperScanModule is the scan-station client for Grooper. It runs in the
  system tray on a Windows workstation with a scanner attached and makes
  that scanner available to a Grooper server over HTTP on port 13950. It
  carries the 32-bit TWAIN support and installs the PIX/ISIS codec files
  that Atalasoft DotImage loads on scan stations, and it starts at every
  logon. The .NET 10 Desktop Runtime (x86), ASP.NET Core Runtime (x86) and
  Visual C++ runtime (x86) are embedded and installed when detection finds
  them missing. Install it on each physical workstation that has a scanner
  attached; the Grooper server itself does not need it.
