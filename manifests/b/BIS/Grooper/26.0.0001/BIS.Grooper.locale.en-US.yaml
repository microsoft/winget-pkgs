ShortDescription: A governed MCP runtime where any AI agent - Claude, Codex, Cursor, Grok - works on your data, on your servers
Description: |
  Grooper is a governed MCP runtime for AI agents. The data can take any
  form - documents, images, PDFs, email and attachments, JSON, XML, EDI,
  database records, and web services - scanned or born-digital, structured
  or not. Any MCP client - Claude, Codex, Cursor, Grok or one you build -
  connects to MCP servers that Grooper hosts and works on that data through
  real tools: plan a task, call tools, observe results, repeat until done.
  Build those loops on your own data in Grooper, with human-in-the-loop
  checkpoints: agents work until judgment is needed, hand off to a person,
  and resume. You publish your own MCP servers - pick the tools that run on
  each - and one governance model covers them all: scoped repositories,
  explicitly selected tools, and policy-controlled connections to external
  servers. Everything runs on-premises: agents work at scale without your
  data leaving your environment.
