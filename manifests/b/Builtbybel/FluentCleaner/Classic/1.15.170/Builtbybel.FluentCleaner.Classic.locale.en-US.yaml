ReleaseNotes: |-
  FluentCleaner Classic 1.15.170 (WinForms, .NET Framework 4.8). Same cleaning engine as FluentCleaner Modern 26.08.03.

  Official downloads are only from https://github.com/builtbybel/FluentCleaner. fluentcleaner.org is not affiliated.

  - Added a Cookie Manager for Edge, Chrome, Chromium, Brave, Vivaldi, Opera, Opera GX, and Firefox
  - Selected website cookies can be protected so logins survive regular browser cleaning
  - Individual cookies can be deleted from the Cookie Manager
  - Cookie keep-lists can be imported from CCleaner TXT exports and exported as portable TXT files
  - Browser cleaning preserves selected cookies instead of deleting the complete cookie database
