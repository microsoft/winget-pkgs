Description: FluentCleaner Classic is the lightweight WinForms edition of FluentCleaner. It uses the same FluentCleaner.Core scan engine and Winapp2.ini parser as the WinUI 3 app, but ships as a ~3.5 MB .NET Framework 4.8 portable zip with no Windows App Runtime dependency.
