ReleaseNotes: |-
  FluentCleaner Classic 1.17.227 (WinForms, .NET Framework 4.8). Mini mode release.

  Official downloads are only from https://github.com/builtbybel/FluentCleaner. fluentcleaner.org is not affiliated.

  - Added Mini mode with quick access to Analyze, Review, and Clean
  - Option to launch FluentCleaner directly in Mini mode in Settings
  - Always-on-top option and automatic Mini window-position saving
  - /MINI and /FULL command-line switches
  - Settings page now scrolls correctly on smaller windows
  - Added Polish localization
  - Updated German, English, Bulgarian, French, and Simplified Chinese localization
