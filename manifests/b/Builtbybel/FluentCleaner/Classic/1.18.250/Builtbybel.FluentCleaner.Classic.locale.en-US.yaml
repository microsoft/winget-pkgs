ReleaseNotes: |-
  FluentCleaner Classic 1.18.250 (WinForms, .NET Framework 4.8), shipped with FluentCleaner 26.09.01.

  Official downloads are only from https://github.com/builtbybel/FluentCleaner.

  - Added command-line automation: analyze or clean the saved selection silently, target individual cleaner categories, shut down after cleaning
  - Added command-line documentation and examples under Options > Handoff / CLI
  - Paused built-in Mini mode development; may return as an add-on or plugin
  - Cookie Manager: deleting a cookie keeps list position, Select all respects search filters
  - Correctly remembers an intentionally empty cleaner selection, including silent/CLI runs
  - Improved DetectFile handling for 32-bit apps, auto-sized Entry column, automation-friendly exit codes with %AppData%\FluentCleaner\auto.log
  - Added Azerbaijani localization, refreshed Brazilian Portuguese and French
