ReleaseNotes: |-
  FluentCleaner 26.11.123 — Back to the Future

  Both editions got updated: Modern is now 26.11.123, Classic 1.20.280. Download links are at the bottom.
  Important
  Using Winapp3? Turning it on ticked all of its rules, also the ones that delete across the whole drive. One of you lost several apps that way. Now nothing from Winapp3 starts ticked, in Modern and Classic, but your old ticks stay until you pick Restore default state. In Modern it's in the cleaner's ∨ menu and resets all your ticks. In Classic, right-click each category.
  - A bit more CCleaner. I put the old one next to FluentCleaner and took what it did right. Status, progress and size are above the results, after Analyze it tells you nothing has been deleted yet, and categories and entries have a right-click menu.
  - Devs, this one's for you. New Developer Tools category: npm, Yarn, pnpm, pip, uv, Cargo, Go, NuGet, Gradle, Maven, vcpkg, Claude Code, Cursor, Windsurf, Antigravity, Docker Desktop. All the junk our builds leave behind.
  - Two old bugs. The Recycle Bin icon stayed full after emptying, and bins on drives other than C: were never touched. Both there since day one. Took two of you to notice.
  - Gone. The PowerShell scripts in Custom. They ran blind with no preview, bad idea in a cleaner.
  Note
  Modern or Classic? I once asked which one you prefer, and right now the ugly one is winning. Yes, Classic :D Modern changed a lot since then: native build, opens in about 126 ms, takes 17 MB. Still team Classic? Fine by me, but the vote is still open.

  Added
  - [Added] Developer Tools category. npm, Yarn, pip, uv, Go, Cargo and NuGet download caches are ticked, the tools just fill them again. NuGet packages, pnpm store, Gradle, Maven and vcpkg are unticked with a warning, the next build pulls all of it again. (#145)
  - [Added] Also in there: Claude Code (cache, logs and temp ticked; backups, file history, sessions and shell snapshots not), Cursor, Windsurf and Antigravity (unticked, close them first), and Docker Desktop's cache and logs. Your images and containers stay alone.
  - [Added] You only see the category if one of these tools is installed. It's in Winapp2.ini, so older versions get it with a database update. Still have Claude.ini in your Custom folder? Delete it, it's all in here now.
  - [Added] GitHub in the ∨ menu, with a star. If you like the app, leave one.
  - [Added] After an update a small bar tells you once and links to what's new. Close it and it's gone until the next one.

  Improved
  - [Improved] F5 refreshes the cleaner, Tweaks and Apps
  - [Changed] Scan status, progress and size moved above the results. Before they were spread over a thin bar, the status bar and a total at the bottom.
  - [Changed] After Run Cleaner the list stays and shows what each entry really freed. Used to be a single "Done" line, not even translated.
  - [Improved] Result rows have their category's icon
  - [Improved] Shorter names in the tree: under "Microsoft Edge" it just says "Caches". Full name is in the tooltip
  - [Improved] No more "0 B" in the tree. Sizes in the results use the normal text colour
  - [Changed] Right-click menus on categories and entries, the hidden ... button is gone. Menu key, Shift+F10 and press-and-hold work too. Analyze and Clean show the name: "Analyze Firefox"
  - [Changed] "Select defaults" is now "Restore default state", like in CCleaner
  - [Changed] Rule Lab opens as a tab with its own icon. To test a new cleaner, save it first, then right-click its card
  - [Improved] Terminal looks more like the real one: edge to edge, solid background, Cascadia Mono
  - [Improved] Cookie lists in Settings are compact, about 40% more domains fit
  - [Improved] Windows is the first category, it used to be sixth
  - [Changed] "Restart as administrator" is gone from the status bar. You get it above the results when a clean skipped files and the app isn't elevated.

  Fixed
  - [Fixed] [Modern, Classic] Winapp3 ticked all its rules when turned on, "Dangerous" ones included. Nothing starts ticked now, and a Winapp3 update can't bring it back. Ticks you already set stay until you use "Restore default state". The badge in Settings now says "aggressive · own risk". (#217)
  - [Fixed] [Modern, Classic] Firefox from the Microsoft Store was invisible to the cookie manager, and cleaning ignored your "Cookies to keep" and deleted all of them. (#185)
  - [Fixed] "Web Storage" for Chrome, Edge, Firefox and 60 other browsers was ticked by default with no warning, and cleaning it signs you out of most sites. Unticked now, with a warning. Had it ticked? It stays until you use "Restore default state". Database fix, so older versions get it too.
  - [Fixed] Narrator read entries, categories, tweaks, apps and switches as just "checkbox" or "toggle button". Now it says the name. (#194)
  - [Fixed] Recycle Bin icon stayed full after emptying, in the app and with /clean. There since day one and nobody noticed, me neither. Thanks #205 for looking at their desktop
  - [Fixed] Recycle Bin was only emptied on the system drive. Now on all drives. Database fix, so older versions get it too. (#15)
  - [Fixed] Long names in the results ran into the Contents column in a narrow window ("Universal Windows Platform20 files").
  - [Fixed] Custom: editing a cleaner you had switched off switched it back on
  - [Fixed] Custom: renaming a cleaner to an existing name overwrote the other one without asking.
  - [Fixed] Custom: if saving failed the dialog closed anyway and your text was gone. It stays open now and tells you why.

  Removed
  - [Removed] PowerShell scripts in Custom. No analysis, no preview, not in FluentSeeds, not in /auto, just a Run button. Scripts you already have stay in the Custom folder, right-click and "Run with PowerShell"
  - [Removed] "Expand all" and "Collapse all" from the ∨ menu. Nobody needs that for a dozen categories, and search still opens everything.

  Under the hood
  - [Changed] All file work in Custom goes through CustomEntryService now
  - [Changed] SetupCode is FluentSeed in the code too

  Translations
  - [New] DlgNewCleanerNameTaken, DlgNewCleanerNameInvalid, DlgNewCleanerSaveFailed (English, German).
  - [New] St_UpdatedTo, BtnWhatsNew (English, German).
  - [New] MenuAnalyzeNamed, MenuCleanNamed with {0} for the name (English, German). They replace MenuAnalyzeCategory, MenuCleanCategory, MenuAnalyzeEntry, MenuCleanEntry
  - [Changed] AppMenuSetupCode is now ShareSelection. Fixed the Spanish while at it
  - [Changed] BtnRestartElevated.Content is now .Text, same wording
  - [Changed] New wording in St_ScanComplete, LblWinapp3Tag, LblWinapp3Desc and Classic's BasicSettings_Winapp3Desc (English, German). Translators, these need a look
  - [Removed] St_Administrator, St_SearchFound, St_SearchNone, St_StatusResult, St_StatusFound, ResultsHeader, DlgNewCleanerTest, RuleLabTitle, BtnCategoryActions, BtnEntryActions and 8 script strings (BtnRunScript, St_CustomRunning, DlgNewCleanerTypePs1...)
  - [Open] LblAICustomHint still promises a PowerShell script in 11 languages

  Two editions, one cleaner
  Same cleaning engine, two independent builds. Both are free, portable and ad-free.
