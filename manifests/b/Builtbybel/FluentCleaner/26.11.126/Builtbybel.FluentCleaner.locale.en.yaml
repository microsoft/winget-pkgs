ReleaseNotes: |-
  Modern only this time. Classic stays at 1.20.280. Download links are at the bottom.
  Important
  Firefox from the Microsoft Store? Cleaning ignored your "Cookies to keep" and deleted all of your cookies. Fixed since 26.11.123 in Modern and Classic, but it was buried in the list last time, so here it is again (#185)
  - Got a bit of macOS DNA. Details open on the right now, the list stays where it is. Small window? The panel slides over the list. I'll admit it 😅
  - Clean means clean. After Run Cleaner the list is empty, the bar turns green, done. In 123 the entries came back and it looked like nothing happened
  - Cookie manager, finally usable. Both lists use the full height, scroll on their own and have "Select all". (#259) Thanks @deus-e-x for calling it out (#259)
  - Classic had it first. Right-click a registry line and that key is never cleaned again. Files and folders always worked, now registry keys too
  Added
  - [Added] Right-click a registry line in the details to exclude that key. Classic has had this for a while, Modern came up short. Ported over now.
  - [Added] Entries with a ⚠ show their warning in the details, next to Delete. Before you only saw it when you happened to hover the tree.
  - [Added] Cookie manager: "Select all" in both right-click menus. With a search typed in, it picks only what's shown. (#259)

  Changed
  - [Changed] Details are their own column on the right, file name on top, folder below. Narrow window: the panel goes over the list, close it with the X
  - [Changed] After Run Cleaner the list is empty, like in Classic. Green check and what got freed sit in the header
  - [Changed] Results list is just name and size. The file count moved into the details.
  - [Improved] Sorting by name was there all along, you just couldn't see it. Now Name gets an arrow too and a second click flips A–Z to Z–A, like in Explorer
  - [Changed] First start opens at 1200×720 instead of 960×620, list and details side by side. Your saved size stays
  - [Changed] Category panel is 250 px instead of 300
  - [Changed] Settings > Exclusions explains the rules now, with an example for each

  Fixed
  - [Fixed] Right-click > Analyze or Clean on a single entry showed only Cancel, no status, no progress. With Winapp3's "Backup Files" it looked frozen. Now it works like Run Cleaner.
  - [Fixed] Long names in the category tree were cut off hard. Now they end in "…", hover for the full name
  - [Fixed] Cookie manager: both lists scrolled with the whole settings page. Each scrolls on its own now and uses the full height.(#259)
  - [Fixed] Files and folders showed up in the exclude menu on registry lines, where they did nothing
  - [Fixed] Sort by size ascending, then scan again: the list was biggest first, but the arrow still pointed up

  Under the hood
  - [Changed] Settings was one 777-line page that hid and showed its own parts. Now every section is its own small page in a Frame, all sharing one ViewModel. MVVM the way WinUI wants it. You won't see a difference, I will 😄
  - [Changed] Details switch between side and overlay with a VisualStateManager and one AdaptiveTrigger. No code 😃

  Translations
  - [Updated] Spanish is up to date with 123 again, and the tweaks speak Spanish now too (Plugins\Tweaks\Lang\es-ES.ini). Thanks @dracp (#257)
  - [Tip] Want the tweaks in your language? Copy Plugins\Tweaks\Lang\_example.ini, name it like fr-FR.ini, translate Name and Detail. Whatever you leave out stays English. No build needed, just Refresh in the tweak page's ... menu.
  - [New] BtnCleanDetail, BtnDetailClose, MenuExcludeRegKey (English, German).
  - [Changed] LblExclusionsDesc explains the right-click and the rule format now (English, German). Translators, this one needs a look.
  - [Removed] ColContents, ColType, BtnDetailBack.

  Two editions, one cleaner
  Same cleaning engine, two independent builds. Both are free, portable and ad-free.
