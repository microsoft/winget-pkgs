PackageIdentifier: BlueHeisenberg.SCSKiller
PackageVersion: 1.2.3
PackageLocale: zh-CN
ShortDescription: 在你开始游戏之前，把游戏的着色器预编译进 GPU 驱动的着色器缓存，让游戏不再在游玩中因编译着色器而卡顿。
Description: |-
  SCSKiller 读取游戏自带的着色器，推算出它将构建的管线，并在游戏关闭时由自身进程提前把它们编译进驱动的着色器缓存。当你启动游戏时，它们已经就绪。

  功能
  - 支持 NVIDIA 与 AMD。支持 DirectX 12 游戏；NVIDIA 上还支持 DirectX 11 游戏。
  - 自动发现 Steam、Epic Games、EA app、GOG、Ubisoft Connect、Xbox (PC)、Battle.net、PURPLE、HoYoPlay 和 Gaijin 中的游戏。
  - 知道哪些游戏会卡顿：游戏库会把已知的卡顿大户排在最前，并标明原因。
  - 驱动更新后重新编译：驱动更新会清空着色器缓存，SCSKiller 会察觉并重新编译，你也可以让它自动进行。
  - 可选录制器：对于无法从文件推算管线的游戏，开启录制器游玩几分钟，再进行编译。
  - 每次会话的帧时间：开启录制器后，游戏页面会绘制上一次会话的帧时间曲线，把着色器编译卡顿与其他卡顿区分开。
  - 游戏库与游戏页面上的“开始游戏”按钮：通过对应商店启动游戏。
  - 绝不触碰反作弊游戏（读取其文件除外）：不启动、不注入、不录制。
