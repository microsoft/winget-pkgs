ShortDescription: Compiles your games' shaders into your GPU driver's cache before you play, so the game doesn't stop to compile them mid-game.
Description: |-
  SCSKiller reads the shaders a game ships with, works out the pipelines it will build, and compiles them into your driver's shader cache ahead of time, from its own process and with the game closed. When you launch the game, they're already there.

  Features
  - NVIDIA and AMD. DirectX 12 games, and DirectX 11 games on NVIDIA.
  - Finds your games in Steam, Epic Games, EA app, GOG, Ubisoft Connect, Xbox (PC), Battle.net, PURPLE, HoYoPlay and Gaijin.
  - Knows which games stutter: the library puts known offenders on top, with the reason.
  - Recompiles after driver updates: a driver update clears the shader cache, and SCSKiller notices and compiles again, on its own if you let it.
  - Optional recorder for games whose pipelines cannot be worked out from their files: play a few minutes with it on, then compile.
  - Frame times per session: with the recorder on, a game's page graphs your last session and tells the shader stutters apart from other hitches.
  - Play button in the Library and on a game's page: starts the game through its store.
  - Never touches anti-cheat games beyond reading their files: no launching, no injecting, no recorder.
