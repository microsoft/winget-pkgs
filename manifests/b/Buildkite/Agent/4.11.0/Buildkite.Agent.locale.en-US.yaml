ReleaseNotes: |-
  What's Changed

  🔒 Security
  - Prevent shell expansion of hook and temporary-directory paths in POSIX hook wrappers by @buildkate in #4641
  - Prevent job environment variables from overriding the agent executable used by hook wrappers by @swebb in #4645
  - Prevent repository URL normalization from bypassing --allowed-repositories by @buildkate in #4643

  ✨ Added
  - Add buildkite.pull_request_draft to job spans and OpenTelemetry resources by @jlisee in #4649
  - Add buildkite.program_status.id to hook and command spans when program-status reporting is active by @mcncl in #4667

  🐛 Fixed
  - Resume polling when the streaming connection drops during job execution by @SarthakRawat-1 in #4626
  - Recover GitHub pull request checkouts when the head ref is missing but the build commit is available by @swebb in #4642

  🏠 Internal
  - Isolate checksum files across concurrent E2E runs by @mcncl in #4632
  - Dependency updates by @dependabot[bot] in #4633, #4634, #4635, #4638, #4652, #4651, #4653, #4658, #4660 and #4657

