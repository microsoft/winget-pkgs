ReleaseNotes: |-
  What's Changed

  🔒 Security
  - Update Ruby packaging dependencies to Mustache 1.1.3 to fix GHSA-5hrj-7fc3-cmx9, and pleaserun 0.0.35 by @dependabot[bot] in #4698

  ✨ Added
  - Add an experimental post-bootstrap agent hook that runs even if the bootstrap process is killed by @sj26 in #4673
  - Add an opt-in timeout for the pre-bootstrap agent hook that rejects the job on expiry by @lucaswilric in #4676
  - Run job bootstrap in Docker on Linux with --experiment docker-executor and --executor docker by @sj26 in #4686

  🐛 Fixed
  - Fix signature verification for pipelines with top-level secrets signed by buildkite-agent tool sign or buildkite-agent pipeline upload by @lizrabuya in #4650
  - Fix AWS KMS signature verification with --verification-jwks-file (set the public key's kid to the KMS key ARN) by @scadu in #4688

  🏠 Internal
  - Dependency updates by @dependabot[bot] in #4677, #4678, #4681, #4587 and #4661
