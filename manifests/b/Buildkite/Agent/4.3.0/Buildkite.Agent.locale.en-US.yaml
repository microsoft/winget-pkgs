ReleaseNotes: |-
  What's Changed

  ✨ Added
  - Add --git-mirrors-lfs-cache (off by default) to cache Git LFS objects in Git mirrors, so checkouts on the same host don't download them again by @zhming0 in #4408

  🐛 Fixed
  - Stop cache invalidation from deleting a cache entry that another job has just saved again by @ss1909 in #4442

  🔧 Changed
  - Title replayed output "Cache exec saved" instead of "Cache hit saved" when buildkite-agent cache exec skips a command by @ss1909 in #4462
  - Skip the upload in buildkite-agent cache save when the cache store already has an identical archive by @buildkate in #4463

  🏠 Internal
  - Speed up release jobs by building the release tools image once per build by @moskyb in #4457
