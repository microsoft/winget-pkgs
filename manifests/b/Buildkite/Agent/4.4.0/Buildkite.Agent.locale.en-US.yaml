ReleaseNotes: |-
  What's Changed

  🐛 Fixed
  - Stop leaking BUILDKITE_JOB_LOG_TMPFILE between jobs when enable-job-log-tmpfile is set and the agent runs with --spawn by @isaacsu in #4484
  - Treat Windows paths such as C:\tools\runner.exe as absolute when resolving commands by @tomowatt in #4382

  🔧 Changed
  - Redact Buildkite tokens by prefix in errors reported by the experimental buildkite-agent job capture-error by @123sarahj123 in #4468
  - Show the buildkite-agent cache exec restore report inside the replay or run group, instead of in a separate group by @ss1909 in #4483
  - Explain how to fix buildkite-agent cache save and cache restore on hosted agents when they run inside a Docker plugin container by @buildkate in #4492

  🏠 Internal
  - Remove repository docs that duplicate the public docs site by @zhming0 in #4467
  - Move Git LFS fetch and checkout helpers into git_lfs.go by @zhming0 in #4493
  - Move finishMirrorUpdate into checkout_mirror.go by @zhming0 in #4494
