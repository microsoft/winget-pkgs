ReleaseNotes: |-
  A point release on top of 2.0.0 — mainly a macOS crash fix. Nothing here changes what 2.0 is; read the 2.0.0 notes for macOS VMs, the AI layer, remote WSL and the UI audit.
  Downloads
  ───────────────────────────┬────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Platform                   │Get it
  ───────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Windows (recommended)      │Microsoft Store — Pro is a one-time purchase there
  ───────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Windows, no Store          │wsl2-distro-manager-v2.0.1-setup.exe (installer), or the portable .zip below, or winget install
                             │Bostrot.WSLManager
  ───────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  macOS (Apple silicon, beta)│wsl2-distro-manager-v2.0.1-macos.dmg, or brew install --cask bostrot/tap/wsl-manager
  ───────────────────────────┴────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Fixed
  - macOS: opening Settings could quit the app. The window plugin traps in native code the moment it is asked about a window it was never handed — no error, the process just goes. Every window call the app makes now hands it one first, and the Flutter view is put in place before plugins are registered rather than swapped out from under them afterwards.
  - Alpine VMs buried the login prompt under can't open /dev/ttyAMA0. Alpine's cloud images keep a getty on a UART that Virtualization.framework does not have, so init respawned it forever. The console now runs on hvc0, where the serial port actually is. Existing VMs pick this up with vmctl reseed.
  - The BETA pill's label is centred, and the pill is the same size as the NEW one beside it in the pane.
  Also in this release
  - The direct builds update themselves. The installer .exe, the portable .zip and the macOS downloads no longer sit at whatever version they were installed at behind a link to this page. Store installs are untouched — the Store keeps those current.
  - Pro can be bought without the Microsoft Store on Windows. A licence key from wslmanager.com/buy now works on Windows too, at the same US$ 14.99, alongside the Store listing. macOS already worked this way.
  - The Create screens for distros and VMs are grouped into titled cards instead of one flat column of controls.
  - Distro packages is marked as beta in the navigation pane — .wsl packaging is as new as the AI Workspace, and it writes a distribution config and exports several gigabytes.
  Full Changelog: v2.0.0...v2.0.1
