ReleaseNotes: |-
  A small follow-up to 2.0.2. For the full picture of what this generation of
  WSL Manager brings, see the 2.0.0 release notes
  — everything described there still applies.
  Community scripts open quickly again
  Opening Community scripts used to make eighty-one separate requests before
  the first row appeared, and it spent the anonymous GitHub rate limit that
  everyone behind your address shares. It is now a single cached request.
  The same change repairs distro download URLs, which had quietly been frozen on
  whatever shipped with your build rather than picking up new ones.
  Fixes
  - macOS: Homebrew installs no longer fail with "Cask reports different
    checksum" when a release is rebuilt after publishing.
  - The Windows package now advertises Korean, so the Store offers it alongside
    the other languages the app already ships.
