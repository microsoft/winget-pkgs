ShortDescription: A Windows Wubi input method that needs no network for typing and stays out of the system input language list
Description: |-
  A Windows Wubi input method built to be left alone after installation.
  Typing needs no network: no cloud lookup, no telemetry, and both dictionaries are plain text files in the
  repository that can be edited by hand. The only network call is the optional Check for updates link next to the
  version number in the About dialog, which just reads the latest release tag.
  It does not register a TSF text service. A global keyboard hook plus a top-most candidate window keeps the
  system input language list, Win+Space and Ctrl+Shift exactly as they were, so other input methods are not
  displaced.
  Input state follows the window in focus. One rule per program, English for a game or mixed for a chat
  client, is applied when that window gains focus and the previous state is restored when it loses focus.
  Wubi and pinyin are looked up on the same key press and shown in one candidate list, Wubi candidates first,
  so falling back to pinyin needs no mode switch.
  A symbol panel covers punctuation, mathematics, Greek letters, pinyin with tone marks, and engineering
  drawing symbols such as diameter, degree/minute/second and geometric tolerances.
