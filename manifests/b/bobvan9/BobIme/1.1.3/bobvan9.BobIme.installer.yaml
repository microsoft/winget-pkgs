# 发新版时这三处要一起改：PackageVersion、InstallerUrl 里的 v<版本> 与文件名、InstallerSha256。
# 哈希取 GitHub Release 附件的 digest：gh api repos/bobvan9/BobIme/releases/latest --jq '.assets[]|.digest'
# 目录层级照上游 manifests/<小写首字母>/<Publisher>/<App>/<版本>/，整份 1.1.3 目录拷进 fork 即用。
# ProductCode 就是 installer/BobIme.iss 里那个不能改的 AppId GUID，实测装机键是 HKLM\...\Uninstall\{7A3C1E58-...}_is1。
# 本机自检：winget validate --manifest <这个目录>；查上游有没有认出来：winget --info 之后 BobIme 会列在已装程序里。
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json

PackageIdentifier: bobvan9.BobIme
