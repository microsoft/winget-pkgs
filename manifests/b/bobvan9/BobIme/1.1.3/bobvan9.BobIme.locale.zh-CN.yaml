PackageIdentifier: bobvan9.BobIme
PackageVersion: 1.1.3
PackageLocale: zh-CN
Publisher: bobvan9
PackageName: Bob 五笔
License: GPL-3.0-only
ShortDescription: 完全离线的 Windows 五笔输入法，不占系统语言栏
Description: |-
  一个装上之后不用再管的 Windows 五笔输入法。
  完全离线：没有云输入、不上报、不联网，五笔和拼音两份词库就是仓库里的文本文件，可以自己改。
  不走系统语言栏：全局键盘钩子加置顶候选窗，不注册 TSF，语言栏和 Win+Space 列表都不会多出条目，
  也不跟微软拼音、搜狗抢 Ctrl+Shift。
  按窗口切输入状态：一张规则表，一行一个程序，游戏填英文、聊天填混合，窗口获得焦点就切过去，
  走开自动还回原来那档。
  五笔拼音混输：一次按键两套词库都查，五笔候选在前、拼音候选在后，排在同一条候选栏里。
  符号面板：标点、数学、希腊字母、带音调的拼音，以及直径、度分秒、形位公差这些机械制图常用符号。
ManifestType: locale
ManifestVersion: 1.28.0
