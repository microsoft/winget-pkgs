ShortDescription: Make bootable USB drives (Linux or Windows) from a 3 MB app, every byte verified.
Description: |-
  USBoot writes any ISO or IMG to a USB drive byte for byte and reads it all back to verify it.
  It has a built-in library of 20 Linux distributions that always downloads the newest official release from the fastest mirrors and checks its SHA-256,
  a Windows mode for Windows 11 install ISOs (with options for unsupported PCs and local accounts),
  can flash several drives at once and unpacks compressed images (.xz, .gz, .zst).
