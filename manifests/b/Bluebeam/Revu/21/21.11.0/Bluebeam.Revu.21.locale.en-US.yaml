ReleaseNotes: |-
  Revu 21.11 - Release Notes
  What's New
  - Expanded MCP capabilities with ChatGPT (Codex) support, new hyperlink workflows, bookmark improvements and automatic text box sizing.
  - Improved Studio with faster search across Sessions and Projects, clearer review status visibility, and updated access and invitation experiences.
  - Redesigned the first-time user experience with a new Essentials profile, guided in-app orientation and ongoing learning resources.
  - Added Bluebeam ID authentication for Task Link, allowing users to sign in to GoCanvas using their BBID.
  What's Fixed
  - Fixed an issue where existing Stamps were not transferred to the new default per-user Stamps folder after upgrading to Revu 21.10.
  - Fixed an issue where the previous default Stamps folder could become read-only after upgrading to Revu 21.10.
  - Fixed an issue where font size changes made to form fields before entering data could fail to persist.
  - Fixed an issue where calculations in some forms could incorrectly return a value of 0.
  - Fixed an issue where grouped Snapshot markups could become corrupted when exported from Tool Sets or Profiles.
  - Fixed an issue where Reduce File Size could remove text from PDFs created with Allplan.
  - Fixed an issue where the Bluebeam plugin for Excel could freeze when converting workbooks containing multiple sheets.
  - Fixed an issue where Revit 2025 could crash when accessing Manage Links with the Bluebeam plugin enabled for Revu Max users.
  For full release notes, visit our support site at https://support.bluebeam.com/revu/resources/revu-21-release-notes.html
