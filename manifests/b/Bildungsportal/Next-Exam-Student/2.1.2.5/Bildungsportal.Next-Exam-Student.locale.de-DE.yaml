  Next-Exam 2.1.2.5 – Changelog:
  Desktop/Allg.
  - Signatur überlappt Text nicht mehr (Activesheets/Editor); Statusleiste im Editor-PDF fix; Swal-Refocus (Scrollsprung) verhindert
  - Chromium-Accessibility aus → Grammarly/ChatGPT/Copilot können nicht mehr mitlesen/eingreifen
  - Default-Gateway-Erkennung: veraltetes Modul durch eigenes ersetzt (wmic fehlt ab Win11 24H2)
  - Abgabe bei Verbindungsverlust → klare Meldung (#689)
  - Focuslost per Mouseleave nur noch bei Maus (Stift/Touch ignoriert);
    Mouseleave-Sensor in allen Modi gefixt
  - Warnung bei Print2PDF-Fehler sowie bei zu großer/fehlerhafter Backup-ZIP
    Backup-Intervall stoppt nie mehr (#687/#688)
  - Win: Apps erkennen, die sich vor Screenshots verbergen bzw. den Fokus entziehen (#682)
  - LocalLockdown: Dualscreen-Verbot, Focuslost per PW aufheben
    Tab-Reihenfolge (auch Teacher-Startseite),
    Backport-Änderungen, neues Icon (#681/#683/#655)
  - PDF-Parser überarbeitet: keine Ghostfields mehr;
    echte Formularfelder werden erkannt und ersetzen die Feldsuche auf dieser Seite
    neue Option „nur Formularfelder“ (#669)
  - Activesheets: Export als ZIP (PDF, Customfields, Korrekturvorlage),
    Import per ZIP (#670)
  - URL-Blocking: Subdomains/Ordner korrekt (#667)
  - macOS: eigene App-UUID statt Electron-Standard (Freigabe „Lokales Netzwerk“)
  - MS365: Refresh-Token + Auto-Refresh, „Verbindung erneuern“-Button,
    File-API, Link bleibt bei Sectionwechsel, kein Collapse bei Focuslost/Materialupdate (#649/#672)
  - MS Assigned-Access-Code entfernt (#650)
  - LocalVM: QEMU-WebDAV-Share umgedreht (funktioniert trotz Internetsperre)
    Workfolder-Mount, Systemcheck-Dialog-Fix,
    Abbruch bei abgebrochener Prüfung, Dialoge gefixt
    VM auf C:\next-exam\qemu für multiuser environments
  - Versionscheck: nur bei zu alt warnen, korrekte Meldung bei zu neu (#641)
  - Performance: keine Header-Repaints alle 5s
    kein doppelter Reload beim Autosave (20s)
  kleinere Fixes:
  - KDE-Shortcuts nach Prüfung (#654)
  - LanguageTool-Sprache in LL (#653),
  - Screenshot-Skalierung/Region + Seitenzoom fix 100% (#636),
  - Timestamp-Warnung (#671)
  - Print2PDF-Wait im Teacher (#674),
  - AA-Timeout (#663)
  - Bildungsportal-Login (eduvidual)
  - GGB-Dateinamen suite/classic,
  - dynamische Imports im Release-Build (Koffi, #656)
  - lokale Bilddatei im Prüfungsmodus öffnen
  - Statuszeile ohne Umbruch, genauerer Log bei BiP-Login-Fehler
  - Teacher: Batch-Entfernen getrennter Schüler,
  - CSS-Fixes Widgets/Serverlog/Versionshinweis
  iOS
  - Neu: LocalLockdown, MS365-Modus (unerwünschte Buttons inkl. Bild einfügen ausgeblendet), URL als Material, Remote-LanguageTool, Header/Footer im Editor-PDF, Focuslost, PrintDeny, PrivateSpellcheck, alte Prüfungen löschen, lokale Dateien bei LL-Start löschen, fehlende Teacher-Aktionen, Backup automatisch laden bei Sectionwechsel
  - Fixes: Reconnect, Viewport, GGB-Keyboard, Section-Registrierung, Lock-Icon, Crashes, PDF-Format, Einzeldatei-Übertragung, native Webviews bei Dialogen ausblenden, Material-Webviews bei Seitenwechsel schließen, Copyleft-Bilder, Exit-Button entfernt, BiP-Cookies nach Login zurücksetzen
