ReleaseNotes: |-
  - Installs for all Windows users in Program Files with elevated setup and uninstall. Remove legacy per-user copies first; external profiles, preferences, backups and licensing state are retained.
  - Language changes refresh license and update text; Cancel restores the previous language and theme.
  - Localized preview actions, validation and activity messages, confirmation buttons and support-email drafts.
  - Corrected update-check status and natural-language translations; fictional languages are explicitly experimental.
  - New installations select the desktop shortcut by default.
