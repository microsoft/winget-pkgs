ReleaseNotes: |-
  What's New?
  This is a Desktop hotfix that fixes messages with links disappearing from their conversations, along with a few smaller fixes.
  Looking for Android? Click here for the latest Android release.

  Fixes
  - Fixes messages with links disappearing from their conversation once the link preview loads. Messages that already disappeared are restored the next time the app starts
  - Fixes an error when a message arrives while a conversation is still loading
  - Fixes pasting text into the message box when starting a new conversation
  - Shows an error when pasting attachments before a new conversation has been started
  - Fixes exporting logs freezing or failing when there are lots of logs, and keeps older logs from being lost when the log files rotate

  Useful Links
  - Support Us (One-Time): https://bluebubbles.app/donate
  - Sponsor Us (Recurring): https://github.com/sponsors/BlueBubblesApp

  Clients
  - BlueBubbles Server: https://github.com/BlueBubblesApp/bluebubbles-server/releases
  - BlueBubbles for Android: https://play.google.com/store/apps/details?id=com.bluebubbles.messaging
  - BlueBubbles for Windows: https://apps.microsoft.com/store/detail/9P3XF8KJ0LSM
  - BlueBubbles for Linux: https://flathub.org/apps/details/app.bluebubbles.BlueBubbles
  Enjoy!
