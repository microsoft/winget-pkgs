ShortDescription: Desktop double-entry accounting for small businesses, with a free archive for QuickBooks Desktop history.
Description: |-
  BizBooks Pro is GAAP-compliant double-entry accounting software that runs on your own Windows PC, with your company data stored locally.
  It imports every year of a QuickBooks Desktop file (accounts, customers, vendors, items and transactions).
  The free Desktop History Archive keeps an imported QuickBooks Desktop file readable with no expiry: open every register, run any report for any period and export to PDF, Excel or CSV. Recording new transactions needs a paid plan, an annual subscription with a 30-day free trial.
