ShortDescription: Bambu Studio is a cutting-edge, feature-rich slicing software. It contains project-based workflows, systematically optimized slicing algorithms, and an easy-to-use graphic interface, bringing users an incredibly smooth printing experience.
ReleaseNotes: |-
  Known Issue:
  1. The macOS 27 Beta network plugin can now be downloaded normally and supports cloud connections. However, users may be unable to connect to printers over LAN. This is because the current configuration may trigger a permission issue on macOS 27 Beta. We are working on this issue and will fix it in a future release, when the final release of macOS 27 is public.
  2. On macOS 27 Beta , after switching filament mapping in the send-to-print dialog, a white floating window may occasionally appear. Re-selecting the same filament slot resolves the issue.
  3. On macOS 27 Beta, Bambu Studio cannot exit full screen after the window is maximized. You can use the shortcut Command (⌘) + Control (^) + F to exit full screen as a workaround.
  This Bambu Studio update brings several major new features and experience improvements, including pause point information on the print progress bar, model assembly guide creation, upgraded color prediction and color decompose capabilities, enhanced filament management on the Device page, E3D hotend support, and multiple improvements to slicing and device interaction.
  You can download the Flathub version for Linux from Bambu Studio on Flathub
  The Flathub version is maintained by @hadess ; thanks to him for his outstanding work.
  New Features

  Pause Point Information on the Print Progress Bar
  Users can now view pause point information directly on the print progress bar, including the total number of pause points in the current print job, how many pause points have already been triggered, and the locations of upcoming pause points.
  When hovering the mouse over a pause point marker on the progress bar, users can also see the estimated time until the pause is triggered. This helps users prepare in advance for operations such as inserting parts, changing colors, or placing magnets.
  Notes:
  1. This feature requires printer firmware support. The minimum supported firmware version is 01.02.50.00（H2S）. Support for additional printers will be rolled out gradually through firmware updates.
  2. The print progress bar can display up to 5 upcoming pause points. As printing progresses, information for later pause points will be displayed progressively on the progress bar.

  Improvements

  Print a Shorter Prime Tower to Save Filament When Color Changes Only Occur at Higher Layers
  After enabling Developer Mode, users can enable the “No sparse layers” option under Others > Prime Tower.
  When enabled, Bambu Studio will skip intermediate layers where no filament change is needed when generating the prime tower. The prime tower will only be generated near the height where filament changes occur, reducing material consumption. For print jobs where color changes only happen at higher layers, this feature can help save filament to a certain extent.
  Notes:
  1. This feature is still experimental. It also has certain requirements for the relative position between the prime tower and the model, and can only work properly when these requirements are met.
  2. Because the Z-axis movement is relatively slow, moving from the shorter prime tower back to the model after printing the tower may take a longer time. This may increase the risk of print defects such as oozing or stringing.

  Filament Manager Displays Filament Note Information
  The Filament Manager can now display Note information in the filament list, making it easier to distinguish between multiple spools of the same filament type. #11354
  Users can also search for filaments by their Note information in the search window. PR #11505. Thanks to @BenJule.

  Improved Floating Issues with Tree Supports
  For organic tree supports, Bambu Studio now enables lightning infill reinforcement by default for internal cavities, reducing the risk of print failures caused by unsupported or floating support structures.

  Part-level Clone Added to the Right-click Menu
  Users can now clone individual parts directly from the right-click menu, improving the efficiency of copying and editing multi-part models.

  Improved Print Time Estimation for A2L When Connected to Different AMS Types
  For A2L printers connected to different types of AMS, Bambu Studio has optimized the print time estimation related to AMS filament changes, making the estimated print time closer to the actual print duration.
  Users can also calibrate loading and unloading times based on their own PTFE tube length and AMS type.
  > ⚠️ Minimum supported firmware version: 01.01.01.00（A2L）

  A2L Displays First-layer Thermal Preconditioning Areas and Explains Their Impact on Print Time
  The Bambu Lab A2L now holds the heatbed at its target temperature before automatic bed leveling, which helps ensure a consistent first layer. The extra wait time depends on where the model is placed on the build plate. This feature is currently supported on the A2L (see below for the minimum firmware version).
  Bambu Studio now visualizes these Thermal Preconditioning areas so users can adjust model placement accordingly. Note that areas near the edge of the heatbed generally take longer to reach a stable temperature. The area prompts and warnings can be turned off in Preferences.
  > ⚠️ Minimum supported firmware version: 01.01.01.00（A2L）

  Other Improvements
  1.  The live camera view on the Device page now supports mouse wheel zooming. PR #11325. Thanks to @BenJule.
      Note: Panning is not currently supported and will be optimized in a future version.
  2.  Optimized PET-CF material parameters to improve print quality in overhang scenarios.
  3.  Updated the recommended process parameters for using PVA to support PLA. The support bottom Z distance is now set to 0 to improve support stability.
  4.  When the cloud service is abnormal or the network is unstable, the software will automatically try switching to LAN mode to continue sending the print, improving device connection stability.
  5.  Optimized filament mapping logic on the print sending page to reduce mismatches between sliced filaments and the actual filament types loaded in the printer.
  6.  The Assembly Guide tool now supports Undo and Redo, improving fault tolerance and editing efficiency during assembly guide creation.
  7.  When using the Cut tool to cut a model and generate dovetail joints, the original painting information of the model will be preserved.
  8.  When multiple AMS slots contain filaments of the same type and color, the print sending page will prioritize matching the filament with the lower remaining amount. PR #11347. Thanks to @ojimpo.
  9.  Optimized slicing logic for multi-toolhead printers in filament-saving mode. When there is only one filament change, the slicing engine will try to group filaments according to the actual left/right filament arrangement, avoiding the need for users to rearrange filaments on the printer just to save a single filament change.
  10. Enhanced the stability and workflow safety of Helio simulation, reducing failures caused by unstable network conditions. PR #11793. Thanks to @HelioPri.
  11. The “Copy to Clipboard” function in the System Information dialog now includes more complete information, making it easier for users to provide software and system details when reporting issues and improving diagnostic efficiency. PR #11491. Thanks to @BenJule.

  Bug Fixes
  1.  Fixed a crash that could occur when shutting down the application. (#11482 )
  2.  Fixed excessively long slice times on plates with many objects. (#11255)
  3.  Fixed an issue where the project profile name displayed incorrectly or failed to display. (#10769)
  4.  Fixed an issue where custom bed textures appeared black after loading. (#11314)
  5.  Fixed a crash that could occur during automatic flow dynamics calibration in certain cases. (#11416)
  6.  Fixed incorrect slicing colors bleeding into adjacent objects when importing standard multi-color 3MF files with single-color volumes. (#11348)
  7.  Fixed tree support roots being generated in mid-air instead of resting on the model or bed. (#11681)
  8.  Fixed floating tree support regions that had nothing underneath to support them. (#11681)
  9.  Fixed an intermittent blank screen when opening Filament Manager on Mac. (#11005)
  10. Fixed an issue where the Pressure Advance setting always showed Default. (#8196)
  11. Fixed an intermittent crash when saving that could leave the file unsaved. (#11715)
  12. Fixed a login loop when using a Google/Gmail account to download models. (#11095)
  13. Fixed MakerWorld logo and “open in browser” external links that failed to open. (#11579)
  14. Fixed legacy or custom filament profiles being blocked from slicing on high-flow and similar nozzles. (#11589)
  15. Fixed grammar and formatting issues in user-facing UI strings. (PR #11257)
  16. Fixed an issue where saved PA calibration profiles were not shown in the AMS materials dialog for the main extruder. (PR #10850)
  17. Fixed a misspelling in the Dutch translation of travel speed. (PR #11480)
  18. Fixed several English UI wording and punctuation issues. (PR #10814)
  19. Fixed missing Node.js dependency support that prevented building on Linux ARM64. (PR #10712)
  20. Fixed missing device name for SpaceMouse Wireless BT that prevented correct recognition. (PR #11755)
  21. Fixed Linux single-instance mode failing to pass files opened in a second instance to the running instance. (PR #11826)
