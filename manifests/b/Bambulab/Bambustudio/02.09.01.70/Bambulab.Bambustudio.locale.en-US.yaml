ShortDescription: Bambu Studio is a cutting-edge, feature-rich slicing software. It contains project-based workflows, systematically optimized slicing algorithms, and an easy-to-use graphic interface, bringing users an incredibly smooth printing experience.
ReleaseNotes: |-
  New Features
  Mixed Nozzle Diameter Slicing and Printing
  This is the most important update in this Bambu Studio release. Printing with multiple nozzle diameters is not a new topic. Previously, users could assign filament and nozzles by slicing line type such as wall, infill, and support, for example, by setting the filament for sparse infill, solid infill, and walls on the Process > Strength > Advanced page. What is different about this update is that Bambu Studio extends this capability into regions of the model: within a single model, users can assign nozzles of different diameters to local details and to the main body, and let each nozzle print at its own appropriate layer height. This means that, even within the same height range of a model, a small nozzle no longer has to increase its layer height to accommodate the main body, and a large nozzle no longer has to keep using thin layers for local details. A small nozzle can reproduce text and scales with a narrower line width and thinner layers; a large nozzle prints the main body with a wider line width and thicker layers. Detail is left to the areas that need it, and efficiency is left to the areas suited to fast printing. Thanks to this capability, with the Maker Watch (by DadaLand) printed on the H3C, the fine watch face, the watch case body, and the flexible TPU strap can be completed in a single print job, reducing the need for separate parts and post-print assembly. See the Wiki to learn how the feature works, when it applies, and its limitations. This capability was made possible by extensive refactoring of the slicing architecture, so all multi-nozzle models benefit. Mixed nozzle diameters involve multiple workstreams, including slicing, materials, presets, and AMS and nozzle-switching compatibility. This release supports the H3C first. Information about support for other models will be provided in official announcements. We thank users for their patience, and we welcome feedback from users and the community on slicing and printing results with real models, as well as updates and iterations based on the Bambu Studio open-source code.

  Color Mixing Updates and Improvements
  - Consolidated workflow: Color Split has been merged into the mixed-color page and renamed Color Matching. When adding a mixed-color filament, Manual Mixing and Color Matching are both available on the same page. Color Matching lets you pick a target color from the project filaments, automatically calculates a matching mixed-color result, and lets you adjust that result.
  - Easier to use: for the H3C 0.4 mm nozzle presets at 0.2 mm and 0.24 mm layer heights, the color mixing sublayer feature is enabled by default, with no manual setup required.
  - More flexible filament setup: mixed-color filaments no longer count toward the project limit of 32 filaments, and support has been added for Bambu PLA Palette, Bambu Lab's color mixing kit. Click "Use Official Color Mixing Kit" to automatically add the filaments in the kit.
  - Less repetitive setup: when adding a mixed-color filament manually, the previous color mixing parameters are reused, making duplication and fine-tuning easier.
  - Smoother texture model import: the import page is now a two-step flow with clearer guidance; color quantization performance has been improved; Bambu color mixing kits can now be bound directly; and the UI and visual layout have been refined.

  Optimized Top Surface Monotonic Line Infill Path to Reduce Travel Moves
  This version optimizes the printing path for the top surface monotonic line infill pattern, reducing travel moves during printing and improving print efficiency. The improvement is more noticeable on models with more detailed and complex top surfaces.

  Illustrated Slicing Parameter Tips
  When users hover the mouse over a process parameter name, Bambu Studio will display the corresponding parameter tip. Parameter tips now support illustrated explanations, making it easier to understand what each setting means, how it works, and how it may affect the print result. This helps new users learn and adjust slicing parameters more easily. Note: This update mainly covers process parameters in Simple Mode. Tips for more advanced parameters will be added and improved in future releases.

  Independently Set Initial Layer Wall and Infill Line Widths
  This version adds a new Initial Layer Infill Line Width parameter. The original Initial Layer Line Width parameter now only applies to lines except the infill lines on the initial layer, including the initial-layer wall lines, allowing users to control the wall line width and infill line width of the initial layer separately. Users can moderately increase the initial-layer infill line width based on actual print results. For example, when using a 0.4 mm nozzle, setting the initial-layer infill line width to 0.55 mm can help improve initial-layer adhesion and reduce the chance of poor initial-layer printing. Note: It is not recommended to set the initial-layer wall line width too large, as this may increase the risk of losing fine details on the initial layer for certain models.

  Add Filament Vendors / Brands from the Filament Manager Entry Page
  This version improves the filament entry workflow in the Filament Manager. Users can now add custom filament vendors or brands directly from the entry page. When the corresponding filament parameter preset does not exist, users can create a custom filament directly in the Filament Manager without switching to the Prepare page, making the workflow more convenient and efficient.

  New Archimedean Spiral Pattern for Ironing, Providing a More Uniform Surface Finish
  This version adds a new Archimedean spiral pattern for ironing. The new pattern expands outward gradually from the center of the region, and the toolpath can be naturally interrupted by internal holes in the model. Compared with the standard concentric pattern, it helps reduce marks caused by the innermost toolpaths and produces a more uniform ironing result. Note: Ironing quality is affected by multiple factors, including flow rate, line spacing, top surface print speed, temperature, and the physical properties of the material. Users should tune the settings based on actual print results. The default parameters may not be suitable for all scenarios.

  New Infill Pattern Parameter for the Sub-Top Surface
  This version separates the sub-top surface from internal solid infill, allowing users to set its infill pattern independently. By default, the sub-top surface now uses monotonic infill instead of the rectilinear pattern previously used for internal solid infill. This helps reduce the visibility of extrusion marks from internal solid infill on the model’s top surface and improves the top surface appearance.

  Improvements
  New Collapse Status Icon on the Prepare Page
  Improved the visibility of the collapse feature: a new collapse status icon on the prepare page makes panel collapsing easier to discover, and clicking a panel title now collapses or expands that panel. Collapsing the device and filament panels while adjusting parameters gives you more room for parameter editing.

  Liveview on the Device Page Now Zooms Around the Cursor Position
  Zooming is now centered on the mouse position, making it easier to inspect.

  Parameter Differences Are Now Shown When Syncing Printer Information
  When opening a 3MF file or syncing printer information, the parameter differences between the current 3MF and the connected printer are now displayed, making it easier to decide what to sync. If no exact nozzle match is available, you can select one manually from the drop-down list.

  Added a TPU 75A Preset and Improved Support Printing Parameters and Behavior
  - Added a TPU 75A filament preset.
  - Optimized PVA retraction: instead of retracting 2 mm and then another 10 mm, PVA now retracts 12 mm in one continuous movement, so retraction is no longer interrupted and print quality is improved.
  - Optimized the printing temperature and cooling fan settings for Support for PLA/PETG, improving adhesion between this support material and PLA and reducing the risk of print failures caused by weak adhesion.

  Modifier Alternating Layers and Conformal Fill
  - Alternating layers: a modifier can now apply for N layers, then skip M layers, and repeat. Adding a wall every other layer, for example, creates a regular texture on surfaces such as shoe uppers. With "Ignore infill settings" enabled, the modifier overrides only the wall count and leaves the region's infill unchanged.
  - Conformal fill: sparse infill follows each layer's contour and runs radially on curved surfaces such as shoe uppers, while top and bottom shells, solid infill, and bridging keep their original pattern. Available on process, object, part, and modifier.

  Tree Support Tip Diameter Can Now Be Adjusted
