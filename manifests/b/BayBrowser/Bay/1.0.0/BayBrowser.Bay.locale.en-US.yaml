ShortDescription: A fast browser with your tabs in a sidebar
Description: |-
  Bay is a browser built around a sidebar. Favorites sit on top, pinned tabs and folders under them, and the day's tabs below. Spaces keep work and home apart, each with its own theme and its own sign-ins.
  Built on Chromium, so sites and Chrome Web Store extensions work as they do in Chrome. Bay adds Peek and Split View, a command bar for addresses, searches and open tabs, built-in ad blocking with uBlock Origin Lite, and import from Arc, Chrome, Firefox, Brave and other browsers.
