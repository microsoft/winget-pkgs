ShortDescription: Check what is known to go wrong with the exact product you are about to buy, with the source beside every finding.
Description: >-
  Kriko helps you research known problems with the exact product you are considering. Check installed catalogs, open the source behind each finding, and compare a shortlist before buying. The Windows app runs on your computer and works beside any listing site; a companion browser extension shows the check next to a product page while the app is running. Installed catalogs support offline lookups. Online research uses the agent or provider you connect, and paid providers bill your account. Coverage can have gaps: no finding is not proof that a product has no problems. The installer is currently unsigned.
