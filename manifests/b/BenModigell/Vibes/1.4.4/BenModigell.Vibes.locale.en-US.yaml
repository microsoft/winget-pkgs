ReleaseNotes: |-
  ## Vibes v1.4.4

  Serato 4 libraries import for the first time (beta): please tell us if yours does not come across.

  ### New
  Serato 4 (Beta): reads the new SQLite library.
  Trial: add your email for 5% off.

  ### Improved
  Track list: Title and Artist use the width on big screens.
  Top-right controls: always visible, hideable in Settings.
  Playlists: rekordbox and Serato smart lists show as skipped.
  Update check: says why it could not reach the server.
  Analysis progress: steadier counts, toasts stay clear.

  ### Fixed
  Windows: the window forgot its size and position.
  Scrollbar: barely visible, and vanished mid-drag.
  Analysis: hour-long mixes timed out, some FLACs always failed.
  Import: tracks on renamed or external drives read as missing.
  Serato 4 export (beta): failed when Serato 4 was installed.
  Startup: the app could freeze right after launch.
  Tags: "a, b, c" in one tag became a single vibe.
  Remove from library: the dialog read like delete from disk.

  ### Downloads

  **macOS (Apple Silicon — M1/M2/M3/M4)**
  Download `Vibes_1.4.4_aarch64.dmg`
  Intel Macs are not supported.

  **Windows (64-bit)**
  Download `Vibes_1.4.4_x64-setup.exe`
  Supports Windows 10 and later.

  ### Auto-Update

  Existing users receive this update automatically.

  ### Platforms
  macOS (ARM64)
  Windows (x64)

  ### Windows: "publisher unknown" warning

  Windows SmartScreen may warn that this app "isn't commonly downloaded". That is expected for a new independent app and does not mean the file is unsafe. To install, click **More info**, then **Run anyway**.

  ### Verify your download

  Every installer's SHA-256 is listed in `SHA256SUMS.txt`, attached to this release. Check yours before opening it, then compare against the matching line.

  Windows (PowerShell): `Get-FileHash .\Vibes_1.4.4_x64-setup.exe -Algorithm SHA256`

  macOS (Terminal): `shasum -a 256 Vibes_1.4.4_aarch64.dmg`

  Windows installer SHA-256: `42fe5d76f2f07dbe64a3cd9ea1ff84c869772c88bdb6b69186fbe115d78cd9ee`


