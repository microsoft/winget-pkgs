ReleaseNotes: |-
  Vibes v1.4.6
  Vibes 1.4.6 is a stability and learning release: analysis recovers on its own, large imports stay smooth, and Auto-tag learns from your tags within seconds.

  New
  - Auto-tag learning: your tags and accepted picks retrain it in seconds.
  - Auto-tag info: a meter shows what it learned and what's next.
  - Re-tag sweep: a better model fixes what the old one got wrong.
  - Crash screen: Restart Vibes and Open logs folder.
  - Serato export: crates land on each track's drive, in sidebar order.
  - Export to file: shows the rekordbox import steps.
  - Quiet mode: a small machine's first import starts gentle.
  - License tab: "Get a license" opens vibesdj.io.

  Improved
  - Import: faster, with a live count while preparing.
  - Import: covers on screen load first.
  - Playback: starts faster, and analysis yields while music plays.
  - Auto-tag: the button spins and waits while it learns.
  - Export: counts skipped items and refuses an empty run.
  - Rekordbox: exporting while it is open says to restart it.
  - Welcome screen: the 5% code shows its real deadline.
  - Preset picker: says why a small library gets no suggestions.
  - Vibe pills: a changing track count no longer resizes the pill.
  - Memory: cover art no longer piles up over a session.

  Fixed
  - Import: very large libraries froze the window while preparing.
  - Import: a crash mid-import needed a reinstall to recover.
  - Import: added dates showed "-" until a restart.
  - Analysis: stuck, crashed or out-of-memory workers stalled the queue.
  - Windows: analysis stalled two minutes on laptops low on memory.
  - AIFF: files with a sound data offset did not play or show artwork.
  - Serato: crate paths used a format Serato does not read.
  - Deleted tracks: could reappear after a pending update.
  - License: a failed hardware check could remove your license (macOS).
  - Error toasts: showed "undefined" instead of the message.
  - Cancelled imports: kept looking like they were still running.

