ReleaseNotes: |-
  ## Vibes v1.4.5

  Vibes now reads your library and suggests the vibes that fit it, and analysis works again on macOS 27.

  ### New
  • Vibe suggestions (Beta)：a starter setup built from your own tracks.
  • Tag on accept：every track gets one vibe per chosen category.
  • Role, Structure, Energy Feel：vibes measured from the audio itself.
  • Existing libraries：a one-time notice offers the new vibe axes.
  • Preset picker："Suggest vibes from my library", any time.
  • Trial badge："Get Vibes" opens checkout with your 5% code.
  • Empty Vibe Creator and Vibe Sort：open the preset picker.

  ### Improved
  • Auto-tag：tempo checks keep impossible genres off tracks.
  • Untrained vibes：better matching for vibes without examples.

  ### Fixed
  • macOS 27：analysis failed on every track.
  • Vibe track lists：title, artist and pills vanished on hover.
  • Launch：the library load waited behind cover thumbnails.
  • Analysis：corrupt files claiming hours of audio crashed the worker.

  ### Downloads

  **macOS (Apple Silicon — M1/M2/M3/M4)**
  • Download `Vibes_1.4.5_aarch64.dmg`
  • Intel Macs are not supported.

  **Windows (64-bit)**
  • Download `Vibes_1.4.5_x64-setup.exe`
  • Supports Windows 10 and later.

  ### Auto-Update

  Existing users receive this update automatically.

  ### Platforms
  • macOS (ARM64)
  • Windows (x64)

  ### Windows："publisher unknown" warning

  Windows SmartScreen may warn that this app "isn't commonly downloaded". That is expected for a new independent app and does not mean the file is unsafe. To install, click **More info**, then **Run anyway**.

  ### Verify your download

  Every installer's SHA-256 is listed in `SHA256SUMS.txt`, attached to this release. Check yours before opening it, then compare against the matching line.

  Windows (PowerShell)：`Get-FileHash .\Vibes_1.4.5_x64-setup.exe -Algorithm SHA256`

  macOS (Terminal)：`shasum -a 256 Vibes_1.4.5_aarch64.dmg`

