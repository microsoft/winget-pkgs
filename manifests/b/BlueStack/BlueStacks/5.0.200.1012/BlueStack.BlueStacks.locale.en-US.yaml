ReleaseNotes: |-
  This update contains the following app compatibility fixes and improvements:
  1. Play Free Fire (com.dts.freefireth) as never before with several improvements to enhance your gaming experience:
  - Aiming in the game has been further refined to resolve all issues with mouse acceleration/sensitivity. Furthermore, you will receive consistent stable FPS throughout the gameplay.
  - Your game controls have been made more interactive with fixes for the "D-pad" control issues. Now, the "D-pad" control won't appear in the middle of your gameplay screen.
  2. You will now be able to find Cookie Run: Kingdom (com.devsisters.ck) on the Google Play Store and you can download or update it without facing any "Device incompatible" error.
  3. Get ready to play The Seven Deadly Sins: Grand Cross (com.netmarble.nanagb) with a smooth crash-free installation. Feel the thrill of battle in this breathtaking RPG adventure!
  4. Now, you can play ドラゴンクエストⅩ 冒険者のおでかけ超便利ツール (com.square_enix.dqxtools) on BlueStacks 5 Nougat 32-bit without it crashing at launch.

  5. You can play 天堂 2M (com.ncsoft.lineage2mtw) without any crashes on BlueStacks 5 Nougat 64-bit.
  6. You can now play ディズニー ツイステッドワンダーランド (com.aniplex.twst.jp) without  any crashes upon launching the game on BlueStacks 5 Nougat 32-bit.
  7. Play あんさんぶるスターズ！！Music (jp.co.happyelements.boysm) on BlueStacks 5 Nougat 32-bit without any crashes at launch. Feel the rhythm flow through you!
  8. You can now play ヴァルキリーコネクト (jp.co.atm.vcon.jp) on BlueStacks 5 Nougat 32-bit without facing a white screen or any crashes at launch!
  9. You can play ドラゴンクエストタクト (com.square_enix.android_googleplay.dqtactj) without any crashes upon launching the game on BlueStacks 5 Nougat 32-bit!

  10. You can now use your mouse without facing any lag or freeze issues in BlueStacks 5.
