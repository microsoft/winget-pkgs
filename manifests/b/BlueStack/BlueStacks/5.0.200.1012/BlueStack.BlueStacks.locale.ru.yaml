Description: Получите максимально быстрый и плавный игровой процесс с BlueStacks – самым популярным, безопасным и БЕСПЛАТНЫМ эмулятором Android для Windows и Mac. Нам доверяют более 500 миллионов игроков.
ReleaseNotes: |-
  Встречайте обновление, в котором разработчики исправили различные проблемы со следующими играми:
  1. Играть в Free Fire (com.dts.freefireth) стало еще круче благодаря нескольким улучшениям, значительно влияющим на игровой опыт:
  - Устранены проблемы акселерации и чувствительности мыши, что значительно упростило прицеливание в игре.
  - Повышена стабильность FPS в матчах.
  - Решена ситуация с D-pad, который периодически перемещался в центр игрового экрана.
  2. Cookie Run: Kingdom (com.devsisters.ck) теперь доступна для скачивания и обновления в Google Play Store. Вы больше не увидите сообщение о недоступности приложения на устройстве.
  3. В The Seven Deadly Sins: Grand Cross (com.netmarble.nanagb) устранены сбои при установке.
  4. Решена проблема вылета игры ドラゴンクエストⅩ 冒険者のおでかけ超便利ツール (com.square_enix.dqxtools) на BlueStacks 5 Nougat 32-bit.

  5. Игра 天堂 2M (com.ncsoft.lineage2mtw) больше не вылетает на BlueStacks 5 Nougat 64-bit.
  6. Игра ディズニー ツイステッドワンダーランド (com.aniplex.twst.jp) больше не вылетает на BlueStacks 5 Nougat 32-bit.
  7. Исправлены вылеты при запуске игры あんさんぶるスターズ！！Music (jp.co.happyelements.boysm) на BlueStacks 5 Nougat 32-bit.
  8. Устранены вылеты и появление белого экрана при запуске игры  ヴァルキリーコネクト (jp.co.atm.vcon.jp) на BlueStacks 5 Nougat 32-bit.
  9. Устранены вылеты при запуске игрыドラゴンクエストタクト (com.square_enix.android_googleplay.dqtactj) на BlueStacks 5 Nougat 32-bit!

  10. Решена проблема лагов и фризов мыши в BlueStacks 5.
  Версия выпущена 3 июня 2021 года
