ReleaseNotes: |-
  Ta aktualizacja zawiera następujące poprawki i ulepszenia dotyczące zgodności aplikacji:
  1. Teraz będzie można znaleźć plik Cookie Run: Kingdom (com.devsisters.ck) w Sklepie Google Play i można go pobrać lub zaktualizować bez napotkania błędu „Niezgodne urządzenie”.
  2. Przygotuj się do gry w The Seven Deadly Sins: Grand Cross (com.netmarble.nanagb) dzięki płynnej instalacji bez awarii. Poczuj dreszczyk bitwy w tej zapierającej dech w piersiach przygodzie RPG!
  3. Teraz możesz grać w ドラゴンクエストⅩ 冒険者のおでかけ超便利ツール (com.square_enix.dqxtools) na 32-bitowym BlueStacks 5 Nougat bez awarii podczas uruchamiania.
  4. Możesz grać w 天堂 2M (com.ncsoft.lineage2mtw) bez żadnych awarii na 64-bitowym BlueStacks 5 Nougat.
  5. Możesz teraz grać w ディズニー ツイステッドワンダーランド (com.aniplex.twst.jp) bez żadnych awarii po uruchomieniu gry na 32-bitowym BlueStacks 5 Nougat.
  6. Odtwarzaj あんさんぶるスターズ！！Music (jp.co.happyelements.boysm) na 32-bitowym BlueStacks 5 Nougat bez żadnych awarii podczas uruchamiania. Poczuj przepływający przez Ciebie rytm!
  7. Możesz teraz grać w ヴァルキリーコネクト (jp.co.atm.vcon.jp) na 32-bitowym BlueStacks 5 Nougat bez białego ekranu lub awarii podczas uruchamiania!
  8. Możesz graćドラゴンクエストタクト (com.square_enix.android_googleplay.dqtactj) bez żadnych awarii po uruchomieniu gry na 32-bitowym BlueStacks 5 Nougat!
  9. Możesz teraz używać myszy bez problemów z opóźnieniami lub zawieszaniem się w BlueStacks 5.
