ReleaseNotes: |-
  Esta atualização contém as seguintes correções e melhorias de compatibilidade de aplicativos:
  1. Jogue Free Fire (com.dts.freefireth) como nunca antes, com várias melhorias para aprimorar sua experiência de jogo:
  - A mira no jogo foi ainda mais refinada para resolver todos os problemas com a aceleração/sensibilidade do mouse. Além disso, você receberá FPS estáveis   consistentes durante o jogo.
  - Os controles do jogo ficaram mais interativos com correções para os problemas de controle do "D-pad". Agora, o controle "D-pad" não aparecerá no meio da tela de jogo.
  2. Agora você poderá encontrar Cookie Run: Kingdom (com.devsisters.ck) na Google Play Store e poderá baixá-lo ou atualizá-lo sem encontrar nenhum erro de "Dispositivo incompatível".
  3. Prepare-se para jogar The Seven Deadly Sins: Grand Cross (com.netmarble.nanagb) com uma instalação tranquila e sem travamentos. Sinta a emoção da batalha nesta aventura de RPG de tirar o fôlego!
  4. Agora você pode jogar ドラゴンクエストⅩ 冒険者のおでかけ超便利ツール (com.square_enix.dqxtools) no BlueStacks 5 Nougat de 32 bits sem travar na inicialização.

  5. Você pode jogar 天堂 2M (com.ncsoft.lineage2mtw) sem travar no BlueStacks 5 Nougat de 64 bits.
  6. Agora você pode jogar デ ィ ズ ニ ー ツ イ ス テ ッ ド ワ ン ダ ー ラ ン ド (com.aniplex.twst.jp) sem travar ao iniciar o jogo no BlueStacks 5 Nougat de 32 bits.
  7. Jogue あんさんぶるスターズ！！Music (jp.co.happyelements.boysm) no BlueStacks 5 Nougat de 32 bits sem travar no lançamento. Sinta o ritmo fluir através de você!
  8. Agora você pode jogar ヴァルキリーコネクト (jp.co.atm.vcon.jp) no BlueStacks 5 Nougat de 32 bits sem enfrentar uma tela branca ou travar no lançamento!
  9. Agora você pode jogar ドラゴンクエストタクト (com.square_enix.android_googleplay.dqtactj) sem travar ao iniciar o jogo no BlueStacks 5 Nougat de 32 bits!

  10. Agora você pode usar o mouse sem enfrentar problemas de lag ou congelamento no BlueStacks 5.
