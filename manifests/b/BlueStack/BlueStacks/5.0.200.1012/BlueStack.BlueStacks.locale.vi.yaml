ReleaseNotes: |-
  Bản cập nhật này chứa các bản sửa lỗi và cải tiến tính tương thích của ứng dụng sau:
  1. Chơi Free Fire (com.dts.freefireth) hơn bao giờ hết với một số cải tiến để nâng cao trải nghiệm chơi game của bạn:
  - Nhắm mục tiêu trong trò chơi đã được tinh chỉnh hơn nữa để giải quyết tất cả các vấn đề với khả năng tăng tốc / độ nhạy của chuột. Hơn nữa, bạn sẽ nhận được FPS ổn định nhất quán trong suốt quá trình chơi.
  - Các điều khiển trò chơi của bạn đã được thực hiện tương tác hơn với các bản sửa lỗi cho các vấn đề điều khiển "D-pad". Bây giờ, điều khiển "D-pad" sẽ không xuất hiện ở giữa màn hình trò chơi của bạn.
  2. Bây giờ bạn sẽ có thể tìm thấy Cookie Run: Kingdom (com.devsisters.ck) trên Cửa hàng Google Play và bạn có thể tải xuống hoặc cập nhật nó mà không gặp phải bất kỳ lỗi "Thiết bị không tương thích" nào.
  3. Hãy sẵn sàng để chơi The Seven Deadly Sins: Grand Cross (com.netmarble.nanagb) với một bản cài đặt trơn tru không có sự cố. Cảm nhận cảm giác hồi hộp của trận chiến trong cuộc phiêu lưu RPG ngoạn mục này!
  4. Bây giờ, bạn có thể chơi ド ラ ゴ ン ク エ ス ト Ⅹ 冒 険 者 の お で か か け 便利 ツ ー ル (com.square_enix.dqxtools) trên BlueStacks 5 Nougat 32-bit mà không bị lỗi khi khởi chạy.
  5. Bạn có thể chơi 天堂 2M (com.ncsoft.lineage2mtw) mà không gặp bất kỳ sự cố nào trên BlueStacks 5 Nougat 64-bit.
  6. Bây giờ bạn có thể chơi デ ィ ズ ニ ー ツ イ ス テ ッ ド ワ ン ダ ー ラ ン ド (com.aniplex.twst.jp) mà không gặp bất kỳ sự cố nào khi khởi chạy trò chơi trên BlueStacks 5 Nougat 32-bit.
  7. Chơi あ ん さ ん ぶ る ス タ ー ズ ！！ Music (jp.co.happyelements.boysm) trên BlueStacks 5 Nougat 32-bit mà không gặp sự cố nào khi khởi chạy. Cảm nhận nhịp điệu chảy qua bạn!
  8. Bây giờ bạn có thể chơi ヴ ァ ル キ リ ー コ ネ ク ト (jp.co.atm.vcon.jp) trên BlueStacks 5 Nougat 32-bit mà không gặp phải màn hình trắng hoặc bất kỳ sự cố nào khi khởi chạy!
  9. Bạn có thể chơi ド ラ ゴ ン ク エ ス ト タ ク ト (com.square_enix.android_googleplay.dqtactj) mà không gặp bất kỳ sự cố nào khi khởi chạy trò chơi trên BlueStacks 5 Nougat 32-bit!
  10. Bây giờ bạn có thể sử dụng chuột của mình mà không gặp phải bất kỳ sự cố nào về độ trễ hoặc đóng băng trong BlueStacks 5.
