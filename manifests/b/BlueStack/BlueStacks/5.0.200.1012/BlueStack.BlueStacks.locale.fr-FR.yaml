ReleaseNotes: |-
  Cette mise à jour contient des correctifs de compatibilité des applications qui résolvent des problèmes avec les applications suivantes:
  1. Jouer à Free Fire (com.dts.freefireth) comme jamais auparavant avec plusieurs améliorations pour augmenter votre expérience de jeu:
  - La visée dans le jeu a été affinée pour résoudre tous les problèmes d'accélération/sensibilité de la souris. De plus, vous bénéficierez d'un nombre de FPS stable et constant tout au long du gameplay.
  - Les contrôles du jeu ont été rendus plus interactifs grâce à la résolution des problèmes de contrôle du "D-pad". Désormais, le contrôle du "D-pad" n'apparaîtra plus au milieu de votre écran de jeu.
  2. Vous pourrez maintenant trouver Cookie Run: Kingdom (com.devsisters.ck) sur le Google Play Store et vous pouvez le télécharger ou le mettre à jour sans rencontrer l'erreur "Appareil incompatible".
  3. Préparez-vous à jouer à The Seven Deadly Sins: Grand Cross (com.netmarble.nanagb) avec une installation sans problème. Ressentez le frisson de la bataille dans cette aventure RPG à couper le souffle !
  4. Maintenant, vous pouvez jouer à ドラゴンクエストⅩ 冒険者のおでかけ超便利ツール (com.square_enix.dqxtools) sur BlueStacks 5 Nougat 32 bits sans qu'il ne plante au lancement.

  5. Vous pouvez jouer à 天堂 2M (com.ncsoft.lineage2mtw) sans subir de crash sur BlueStacks 5 Nougat 64 bits.
  6. Vous pouvez maintenant jouer à ディズニー ツイステッドワンダーランド (com.aniplex.twst.jp) sans rencontrer de crash lors du lancement du jeu sur BlueStacks 5 Nougat 32 bits.
  7. Jouez à あんさんぶるスターズ！！Music (jp.co.happyelements.boysm) sur BlueStacks 5 Nougat 32 bits sans aucun problème de crash au démarrage. Sentez le rythme vous traverser !
  8. Vous pouvez désormais jouer à ヴァルキリーコネクト (jp.co.atm.vcon.jp) sur BlueStacks 5 Nougat 32 bits sans faire face à un écran blanc ou à un quelconque crash au lancement !
  9. Vous pouvez jouer à ドラゴンクエストタクト (com.square_enix.android_googleplay.dqtactj) sans aucun crash au lancement du jeu sur BlueStacks 5 Nougat 32 bits !
  10. Vous pouvez maintenant utiliser votre souris sans faire face à des problèmes de lag ou de freeze dans BlueStacks 5.
