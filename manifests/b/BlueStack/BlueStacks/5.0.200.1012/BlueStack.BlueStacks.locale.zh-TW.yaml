Description: 透過BlueStacks獲得最快、最流暢的遊戲效能，BlueStacks是世界上最流行，最安全且免費的Windows和Mac版Android模擬器。受到超過5億遊戲玩家的信賴。
ReleaseNotes: |-
  此更新包含以下應用相容性修復和優化：
  - Free Fire (com.dts.freefireth) 前所未有的多項優化以增強您的遊戲體驗：
    - 遊戲中的瞄準已進一步完善，以解決所有滑鼠加速/靈敏度問題。 此外，您將在整個遊戲過程中獲得更穩定的 FPS。
    - 修復了“方向鍵”控制問題，使您的遊戲操控更具靈活性。 現在，“虛擬搖桿”功能不會出現在您的遊戲畫面中間。
  - 薑餅人王國 (com.devsisters.ck) 修復了從 Google play 商店下載或更新時出現的"設備不相容"問題
  - 七大罪：光與暗之交戰 (com.netmarble.nanagb)安裝不再出現問題
  - ドラゴンクエストⅩ 冒険者のおでかけ超便利ツール (com.square_enix.dqxtools) 在 BlueStacks 5 Nougat 32 位元版本修復了閃退問題
  - 天堂 2M (com.ncsoft.lineage2mtw) 在 BlueStacks 5 Nougat 64 位元版本上修復了閃退問題
  - ディズニー ツイステッドワンダーランド (com.aniplex.twst.jp) 在 BlueStacks 5 Nougat 32 位元版本上修復了閃退問題.
  - あんさんぶるスターズ！！Music (jp.co.happyelements.boysm) 在 BlueStacks 5 Nougat 32 位元版本上修復了閃退問題.
  - ヴァルキリーコネクト (jp.co.atm.vcon.jp) 在 BlueStacks 5 Nougat 32 位元版本上修復了白畫面問題.
  - ドラゴンクエストタクト (com.square_enix.android_googleplay.dqtactj) 在 BlueStacks 5 Nougat 32 位元版本上修復了閃退問題.
  - 您現在可以使用 BlueStcks 游標而不會出現任何卡頓問題
