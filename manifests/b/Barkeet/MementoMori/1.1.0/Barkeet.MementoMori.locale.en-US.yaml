ShortDescription: A life-in-weeks wallpaper that repaints itself every Monday.
Description: |-
  Memento Mori renders your life as a grid of weeks on your desktop wallpaper:
  the weeks you have lived and the weeks still ahead. A scheduled task repaints
  it every Monday morning, coloring in one more square. Pure PowerShell with no
  runtime dependencies, no background processes, and no telemetry. Includes a
  local settings page for themes, shapes, and date options.
