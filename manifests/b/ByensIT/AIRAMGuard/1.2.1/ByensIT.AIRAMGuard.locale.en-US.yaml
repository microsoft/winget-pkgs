ShortDescription: Stops Claude Code, Codex, Cursor and MCP servers from eating your RAM.
Description: |-
  AI RAM Guard shows how much RAM your AI coding tools really use. It finds duplicate and orphaned
  MCP servers, tells you which config file loads them, and frees memory automatically without
  closing the app you are working in. It lowers the priority of AI apps you are not using, and shows
  which AI caches fill your system drive, with one-click moves you can undo. Per-user install, no admin
  rights, no telemetry.
