ShortDescription: The fastest gallery viewer for pictures, videos, comics, manga and webtoons.
Description: |-
  TelescopeView decodes the next pictures in the background before you ask for them, so flipping through a folder never flickers or waits.
  It opens PNG, JPEG, WebP, GIF, TIFF, JPEG XL, EXR, PSD, SVG and more, plus HEIC, AVIF and camera RAW through the Windows codecs, and plays videos with sound.
  It also reads comics, manga and webtoons (CBZ, CBR, CB7, CBT, EPUB and PDF) with two-page spreads, right-to-left reading and a long-strip mode.
