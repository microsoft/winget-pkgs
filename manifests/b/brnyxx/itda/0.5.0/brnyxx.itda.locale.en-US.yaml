ShortDescription: Named actions on the websites you use, for your AI agent. Reads just work; changes wait for your approval.
Description: |-
  Give itda the address of a site you use. It looks at the page as itself, names what the site can do in plain words, tries every read once and hands your agent a short list of actions over MCP. Reads run right away. A change never runs until you approve it in your terminal, and everything agents did is in a hash-chained audit log. itda identifies itself to every site, never imitates a browser and stops when a site says no.
