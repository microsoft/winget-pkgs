ReleaseNotes: |-
  * Experimentell: Über einen MCP-Endpunkt können KI-Assistenten Teile deiner Portfoliodaten lesen und ändern. Diese erste Version deckt noch nicht alles ab und über Feedback freuen wir uns. Die Funktion ist standardmäßig ausgeschaltet und lässt sich in den Einstellungen aktivieren.
  * Neu: "In neuem Fenster öffnen" im Kontextmenü der Registerkarten öffnet eine Kopie der Portfolioansicht in einem separaten Fenster.
  * Neu: Attribute von Konten können jetzt als Spalten in der Vermögensaufstellung und in den Klassifizierungen angezeigt werden.
  * Neu: PDF-Importer für bank99, Charles Schwab, E*TRADE, Robinhood und Volksbank Wien.
  * Verbesserung: PDF-Importer für Baader Bank, C24 Bank, DEGIRO, Deutsche Bank, DKB, easybank, Erste Bank, flatex, ING-DiBa, J&T Direktbank (jetzt auch J&T Banka Slowakei), Liechtensteinische Landesbank, Postbank, Raiffeisenbank, S-Broker, Scalable Capital, St.Galler Kantonalbank, Targobank und Trade Republic wurden verbessert.
  * Verbesserung: Der CSV-Importer für Trade Republic bucht Gebühren bei Einlagen/Einzahlungen jetzt als separate Gebührenbuchungen.
  * Verbesserung: Der Attributtyp "Prozentzahl (einfach)" heißt jetzt "Zahl (2 Dezimalstellen)", da der alte Name fälschlicherweise einen Prozentwert suggerierte.
  * Fehlerbehebung: Gebühren auf Dividenden werden jetzt in den Gesamtgebühren eines Wertpapiers berücksichtigt.
  * Fehlerbehebung: Bei Leerverkäufen (Short-Trades) wird der gleitende Durchschnittseinstand jetzt als undefiniert statt als 0 angezeigt.
  * Fehlerbehebung: Der Kursanbieter Kraken lädt jetzt historische Kurse auch für Wertpapiere, für die noch keine Kurse vorhanden sind.
