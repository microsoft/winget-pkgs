ReleaseNotes: |-
  * Neu: Trades können jetzt je Zugang gruppiert werden: Jeder Kauf erzeugt einen eigenen Trade, und Verkäufe werden auf die Zugänge aufgeteilt, die dadurch geschlossen werden.
  * Neu: Kategorien in der Vermögensaufstellung lassen sich ein- und ausklappen; der eingeklappte Zustand wird pro Datei und Klassifizierung gespeichert.
  * Neu: Die Linienbreite im Kursdiagramm eines Wertpapiers lässt sich jetzt über das Diagramm-Menü auf 1, 2 oder 3 Pixel einstellen.
  * Verbesserung: PDF-Importer für Barclays Bank Ireland, comdirect, Consorsbank, DAB, Raiffeisen Bankengruppe und Trade Republic wurden verbessert.
  * Verbesserung: Der Titel der Trades-Ansicht berücksichtigt jetzt die ausgewählten Konten und Depots. 
  * Fehlerbehebung: Der Import vieler PDF-Dokumente schlägt nicht mehr mit dem Fehler "No more handles" fehl.
  * Fehlerbehebung: Die Suche nach einem neuen Wertpapier bricht nicht mehr ab, wenn ein Suchanbieter eine unerwartete Antwort liefert.
  * Fehlerbehebung: Trades verwenden jetzt den in der Buchung hinterlegten Wechselkurs statt des Tageskurses.
  * Fehlerbehebung: Ein sporadischer Fehler im Diagramm zum Depotbestand wurde behoben, der auftrat, wenn es zweimal kurz hintereinander aktualisiert wurde.
  * Fehlerbehebung: Das Donut-Diagramm sortiert jetzt wie das Kreisdiagramm.
