ReleaseNotes: |-
  * Neu: Das Dashboard hat ein neues Widget "Volatilität (annualisiert)". Es rechnet immer auf ein Jahr hoch, sodass du den Wert über verschiedene Berichtszeiträume hinweg und mit veröffentlichten Kennzahlen vergleichen kannst.
  * Neu: CSV-Importer für XTB (Cash Operations), einschließlich CFD-Ergebnissen und Spin-off-Zahlungen.
  * Neu: PDF-Importer für Alpac Capital.
  * Verbesserung: PDF-Importer für Arkéa Direct Bank, Bank11, Bison, Commerzbank, Debitum, DEGIRO, FKB, Findependent, Ford Money, GenoBroker, Hypothekarbank Lenzburg, Liberty Vorsorge, MeDirect, N26, NIBC, OLB, Orange Bank, Quirin Privatbank und Scalable Capital wurden verbessert.
  * Verbesserung: Der Dialog zum Bearbeiten eines Wertpapiers öffnet sich bei großen Klassifizierungen deutlich schneller. Kategorien wählst du jetzt aus einer durchsuchbaren Liste aus, und bereits zugeordnete Kategorien werden ausgegraut.
  * Verbesserung: Die Performanceberechnung sowie die Spalten für Klassifizierungen und Kursveränderungen in Wertpapierlisten sind schneller.
  * Verbesserung: Während der Kursaktualisierung werden die Ansichten seltener neu berechnet, sodass die Anwendung reaktionsfähig bleibt.
  * Verbesserung: Beim Umbenennen oder Kopieren einer Klassifizierung wird jetzt auch der oberste Knoten umbenannt, und beim Kopieren bleiben die Notizen aller Kategorien erhalten.
  * Fehlerbehebung: Das Widget für die Sharpe Ratio verwendet jetzt die annualisierte Volatilität. Bisher hing der Wert von der Länge des Berichtszeitraums ab.
  * Fehlerbehebung: Der CSV-Import von Dividenden, Steuern und Gebühren funktioniert jetzt auch, wenn nur die Spalte für den Wechselkurs zugeordnet ist, und bricht bei Wertpapieren ohne Währung nicht mehr ab.
  * Fehlerbehebung: Beim Ausführen von Sparplänen während des Programmstarts tritt kein Fehler ("ConcurrentModificationException") mehr auf. Buchungen, die erstellt wurden, bevor ein fehlender Kurs einen Sparplan abbricht, werden jetzt angezeigt und gespeichert.
  * Fehlerbehebung: Unter Linux bleiben Tabellenüberschriften und Beschriftungen der Werkzeugleiste lesbar, wenn das Fenster nicht im Fokus ist.
  * Fehlerbehebung: Unter Linux erscheint in der Zahlungsmatrix nicht mehr der Fehler "Unknown column layout data".
  * Fehlerbehebung: Ein Wechsel der Währung verursacht keinen Fehler mehr, wenn beim Rebalancing "Anlagebetrag anzeigen" eingeschaltet ist.
  * Fehlerbehebung: Das Ringdiagramm beginnt jetzt am selben Winkel wie das Kreisdiagramm.
  * Fehlerbehebung: Die CSV-Importe für Trade Republic und XTB zeigen jetzt den richtigen Titel im Assistenten.
  * Fehlerbehebung: Das Schließen des Dialogs zur Suche nach Kurslieferanten verursacht keinen Fehler mehr.
