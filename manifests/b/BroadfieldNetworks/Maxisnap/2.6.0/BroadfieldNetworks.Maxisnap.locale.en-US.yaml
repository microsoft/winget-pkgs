ReleaseNotes: |-
  - NEW: Set up your own branded Maxisnap Studio entirely inside the app: branding, host and a free Cloudflare Studio in about five minutes.
  - NEW: The Library keeps every screenshot, recording and upload in one place; click the tray icon or press Ctrl+Alt+9.
  - NEW: Print Screen picks an area, and you can give keys to new captures for text, the active window, your previous area or a 3, 5 or 10 second delay.
  - IMPROVED: Captures stay crisp on scaled displays, each editor opens on the screen you captured, and Select text copies words from any screenshot.
  - FIXED: Unticking Keep me signed in now ends your session when Maxisnap closes, and stopping a scrolling capture keeps everything already stitched.
