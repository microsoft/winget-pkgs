ReleaseNotes: |-
  Highlights
  Last release we put in a lot of work to revamp the theme system, and now we are launching Community Themes !
  Check out the docs for info on how to create your own theme and submit a PR to the plugin repo to have it show up in the app.
  We've also fixed a bunch of bugs with SurrealDB and moved to pnpm in dev. Check out the full changelog below to see everything we've changed.
