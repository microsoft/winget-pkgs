ReleaseNotes: |-
  What's New
  codexhost 0.21.0 adds Desktop Side Chats on external Threads, lets delegators answer pending agent questions across CLI, HTTP, MCP, and Web, and brings custom background images and workspace file actions to Web. It also restores native browser access on macOS Desktop, supports inline browser annotations in external Turns, and improves Remote Web, Claude Code, Antigravity, Qoder, and Host lifecycle reliability.
  codexhost 0.21.0 支持在外部 Thread 上开启 Desktop Side Chats，支持跨 CLI、HTTP、MCP 与 Web 回答委派任务的待答题，并为 Web 新增自定义背景图与工作区文件打开/下载操作。同时恢复了 macOS Desktop 原生浏览器访问，支持外部 Turn 内联浏览器标注图片，并提升了 Remote Web、Claude Code、Antigravity、Qoder 与 Host 生命周期的稳定性。
  Features
  - Desktop Side Chats on external Threads: open attached or ephemeral Side Chats from external Harness Threads—including before the first Turn completes—while keeping inherited history and Side Chat Turns cleanly separated (#885)
  - Answer pending delegated questions: read pendingQuestions from thread read and reply across CLI thread answer, HTTP, MCP, and Web, with wait and one-shot watches reporting needsInput (#848)
  - Web background images and file actions: customize Web background images with live opacity preview, open workspace files externally or download originals, and act on preview tabs or Markdown file links from context menus
  - Output speed metering for hidden reasoning: measure visible text output TPS in Grok and Antigravity when hidden reasoning exposes no start boundary, while excluding unverified reasoning intervals
  - Official Antigravity icons: update Antigravity badges and Harness icons to the official SVG artwork
  Fixes
  - Native browser access on macOS Desktop: restore built-in browser MCP access through Codex Desktop's signed runtime, preserving global browser tool policy, request budgets, and session cleanup on disconnect (#881)
  - Inline browser annotations in external Turns: materialize inline browser annotation images for external Harness Turns when Desktop omits complete attachment paths (#883)
  - Claude Code large transcripts, checkpoints, and models: stream large JSONL transcripts without hitting string-length limits, preserve rollback and fork recovery across split blocks and compaction, and accept empty model descriptions (#875, #892, #897)
  - Remote Web history and sends: paginate bounded remote history without blocking stop, reconcile timed-out remote sends against durable receipts, and keep remote viewers connected through large responses (#869, #870, #874)
  - Web UX, mobile stability, and Codex defaults: steady the mobile frame, drawer, safe area, and theme status bar, default new Codex drafts to advertised full access, focus the draft end after quoting selected text without redundant notices, re-probe failed Harness inspections and invalidate catalogs on refresh, and refine composer, usage groups, mentions, and session rename behavior (#872, #873)
  - Antigravity, Kimi, and Qoder reliability: read cold Antigravity history without starting a writable resume, reuse isolated snapshot readers, preserve complete history, replay tail metadata, and active-turn usage costs, derive Kimi draft thinking options from model configuration, and discover desktop-bundled Qoder CLIs while keeping unknown installers manual (#889)
  - Host Runtime, Shim, and Launcher lifecycle: keep non-Desktop callers off the local Host Runtime, validate Mapping Store owner start identity and Windows PID exit races, force stuck Controllers during update shutdown and wait across Controller identity changes, preserve CODEXHOST_EXTERNAL_CLIENT_PORT on startup, list submitted Threads before native identity is ready, explain unsupported resume of interrupted external Turns, and deliver delegation watch notifications after the target Thread is idle (#876, #893, #899)
  新功能
  - 外部 Thread 支持 Desktop Side Chats： 支持从外部 Harness Thread 开启持久或临时侧边聊天（含首轮完成前），并清晰隔离继承历史与侧边聊天自身 Turn (#885)
  - 委派任务待答题跨端作答： thread read 支持读取 pendingQuestions，可通过 CLI thread answer、HTTP、MCP 与 Web 统一答复，wait 与一次性 watch 支持返回 needsInput (#848)
  - Web 自定义背景图与文件操作： 支持设置 Web 背景图并实时预览不透明度，支持用外部应用打开工作区文件或下载原文件，并为预览标签菜单与 Markdown 文件链接提供快捷操作
  - 无起点隐藏思考的输出速率计量： 当 Grok 与 Antigravity 的隐藏思考缺少起点边界时按可见文本窗口计算 TPS，并排除未验证的思考区间
  - Antigravity 官方图标： 更新 Antigravity 徽章与 Harness 图标为官方 SVG
  修复
  - 恢复 macOS Desktop 原生浏览器访问： 通过 Codex Desktop 签名运行时承载内置浏览器 MCP，保留全局浏览器工具策略、请求体预算及断连清理 (#881)
  - 外部 Turn 支持内联浏览器标注： 当 Desktop 未提供完整附件路径时，自动为外部 Harness Turn 落盘内联浏览器标注图片 (#883)
  - Claude Code 大会话、检查点与模型兼容： 流式读取超大 JSONL 会话记录避免字符串长度超限，跨分块与自动压缩保留回滚与分叉恢复能力，并兼容空字符串的模型描述 (#875, #892, #897)
  - 远程 Web 历史与发送回执： 分页读取远程历史且不阻塞 stop，基于持久化回执对账超时的远程发送，并在大响应传输中保持远程观察者不断连 (#869, #870, #874)
  - Web 交互、移动端稳定性与 Codex 默认权限： 稳固手机端页面框架、侧边抽屉、安全区与主题状态栏，新建 Codex 草稿默认使用声明的 full access，划词引用后聚焦输入框末尾并移除多余提示，支持重探测失败的 Harness 检查并在刷新后更新目录缓存，同时优化输入框、Usage 分组、提及列表与会话重命名交互 (#872, #873)
  - Antigravity、Kimi 与 Qoder 稳定性： 读取冷态 Antigravity 历史时不启动可写恢复、复用快照读取进程池、保留完整历史与回放尾部元数据及活跃轮次费用；从模型配置推导 Kimi 草稿思考选项；支持发现桌面端内置 Qoder CLI 并将未知安装方式识别为手动更新 (#889)
  - Host Runtime、Shim 与 Launcher 生命周期： 避免非 Desktop 调用方占用本地 Host Runtime，校验 Mapping Store 持有者启动身份并处理 Windows 进程退出时间竞态，更新停服时强制终止卡住的 Controller 并在其身份变更后继续等待，启动时保留 CODEXHOST_EXTERNAL_CLIENT_PORT，在原生身份就绪前展示已提交 Thread，明确提示外部中断 Turn 不支持直接恢复，并在目标 Thread 空闲后再投递委派 watch 通知 (#876, #893, #899)
