ReleaseNotes: |-
  What's New
  codexhost 0.20.0 now supports the official relay with no invite code required. It also migrates Antigravity to its native ACP protocol—significantly improving responsiveness and stability while adding native session import and usage metering—brings inline text-selection reply quotes to Web, and adds live steering to delegated thread send across CLI, HTTP, and MCP. Remote Web management for access tokens and UI extensions, inline sign-in QR codes, quota and TPS displays, mobile reconnection, and cross-platform lock and Codex discovery reliability are improved as well.
  codexhost 0.20.0 现已支持官方 Relay 且无需邀请码。同时将 Antigravity 全面迁移至原生 ACP 协议，大幅提升响应速度与稳定性，并支持原生会话导入与用量计量；Web 端新增划词引用回复、内联登录二维码以及已认证远程管理访问令牌与 UI 扩展的能力，CLI、HTTP 与 MCP 的委派 thread send 迎来实时 Steering 引导能力。这一版还优化了额度弹窗与 TPS 展示、移动端 Web 前台重连体验，以及跨平台文件锁与 Codex 自动发现的稳定性。
  Features
  - Official relay without invite codes: connect through the official relay directly without needing an invite code
  - Native ACP integration for Antigravity: rewrite Antigravity sessions on native ACP stdio transport for faster, more reliable responses, support importing native sessions, and meter request timing, reasoning tokens and usage (#862)
  - Inline reply quotes in Web: select text in an assistant response to attach it as a reply annotation to your next message via a compact floating action bar, preserved across edits and sends (#856)
  - Remote Web management and inline QR sign-in: allow authenticated remote sessions to manage access tokens and UI extensions, and reveal sign-in QR codes inline instead of in a modal
  - Live steering for delegated tasks: support steering from thread send consistently across CLI, HTTP, and MCP, with retries for undelivered watch steering (#847)
  - Clearer Quota and Usage displays: group multi-scope quota popovers with reset countdowns, display reset credits as a compact footer pill with expiry, and filter buffered timings to show session average TPS
  - Smoother Web navigation and updates: click a selected parent Thread row in the sidebar to fold it and clear descendant unread state, see an update badge on the Settings launcher, and preserve Connections scroll position and in-flight update state
  Fixes
  - Improve mobile and iOS home-screen Web experience with foreground-aware connection recovery and a stable status bar
  - Prevent duplicate Adapter item starts and attach fault context for clearer diagnostics (#868)
  - Stabilize Mapping Store process-lock identity, handle Linux executable replacement and exit races, and take over stale locks without replacing a live owner (#859, #867)
  - Continue official Codex discovery past proxy shims and broken candidates (#866)
  - Restore unloaded native Thread descendants in Web, converge archive state for already-archived native Threads, open empty history cursors properly, and improve paginated Thread list performance (#853, #855)
  - Skip settled explicit Web commands that were superseded by later ordinary turns
  - Preserve WorkBuddy's bundled CLI path across credential preload, recover CodeBuddy history containing discarded aborted tool calls, and detect OMP's default Windows install directory (#841, #846, #849)
  新功能
  - 官方 Relay 免邀请码： 现已支持直接使用官方 Relay，无需邀请码
  - Antigravity 原生 ACP 接入： 基于原生 ACP stdio 传输重写 Antigravity 会话核心并移除旧版 PrintMode，大幅提升响应速度与稳定性，同时支持原生会话导入、请求耗时与思考 Token / 用量计量 (#862)
  - Web 划词引用回复： 在回复内容中选中文本即可通过紧凑浮窗引用到下一条消息中，并在编辑与发送过程中保留引用标注 (#856)
  - 远程 Web 管理与内联登录二维码： 支持在已认证的远程会话中管理访问令牌与 UI 扩展，并将登录二维码改为卡片内联展开显示
  - 委派任务支持实时 Steering： 在 CLI、HTTP 与 MCP 中统一支持通过 thread send 进行 Steering 引导，并自动重试未送达的 watch steering (#847)
  - 更清晰的额度与速率展示： 多作用域 Quota 弹窗按分组显示重置倒计时，底部以紧凑标签展示重置额度及过期时间；Usage 过滤缓存干扰计时并展示会话平均 TPS
  - 更顺手的 Web 导航与更新提示： 点击已选中的父级 Thread 行可折叠并清除子级未读状态；设置按钮显示更新徽章，Connections 面板保留滚动位置与进行中的更新状态
  修复
  - 优化移动端与 iOS 主屏幕 Web 体验，前台切换时自动平滑恢复连接并保持状态栏稳定
  - 防止 Adapter item 重复启动并补充故障上下文诊断 (#868)
  - 稳定 Mapping Store 进程锁身份识别，处理 Linux 可执行文件替换与退出竞态，并在不覆盖存活进程的前提下接管过期锁 (#859, #867)
  - 自动发现官方 Codex 时跳过代理垫片与损坏候选 (#866)
  - 恢复 Web 中未加载的原生 Thread 子树，收敛已归档原生 Thread 的归档状态，修复空历史游标并优化分页列表性能 (#853, #855)
  - 跳过已被后续普通对话取代的已完结显式 Web 命令
  - 跨凭据预加载保留 WorkBuddy 内置 CLI 路径，恢复包含已丢弃中断工具调用的 CodeBuddy 历史，并支持检测 OMP 的 Windows 默认安装目录 (#841, #846, #849)
