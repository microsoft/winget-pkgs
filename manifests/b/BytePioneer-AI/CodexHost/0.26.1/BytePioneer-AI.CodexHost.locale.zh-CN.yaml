ReleaseNotes: |-
  本次更新修复了新版 Codex Desktop 下外部 Harness 审批模式入口消失的问题，带来 Web 侧栏多远端主机轻量化展示、排队消息附件编辑与额度倒计时，并显著优化了输入流畅度、后台内存占用以及 macOS、Windows、Android 兼容性。
  ⚠️ 升级提示：npm 镜像（如 npmmirror）通常在发布后约 1 小时内同步新版本，同步前通过 npm 自动更新可能失败，请稍后重试。若更新提示“服务未能就绪”并已恢复旧版本，不影响继续使用：退出 Codex 后在终端运行 codexhost 重新启动即可；如仍是旧版本，依次运行 codexhost stop、npm install -g @codexhost/cli@latest，再运行 codexhost。v0.26.1 已修复这两个问题：自动更新会先确认你的 npm 源已同步再提示，并在停止服务前下载好新版本；从 v0.26.1 起，后续更新不再需要上述操作。
  🛡️ 适配新版 Codex Desktop 与 Composer 体验升级
  修复 Codex Desktop 26.1120 下外部 Harness 审批/权限模式切换按钮消失的问题；切换至无 Thinking 选项的 Model 时保留原有 Thinking 偏好；Web 端粘贴图片后输入框不再丢焦点，并在额度栏新增倒计时提示。
  — @BytePioneer-AI · @koeria
  🌐 Web 侧栏、排队编辑与远端文件预览
  Web 侧栏顶部新增色点主机筛选栏，远程会话改用左侧细色条标识并仅在选中行轻显主机名，列表更清爽；支持编辑包含图片与文件附件的排队消息；修复远端主机预览 HTML、图片、PDF 及 Office 文档报错，以及过期草稿恢复和删除工作区后被同步还原的问题。
  — @BytePioneer-AI · @omsd512-W · @zxd-666 · @koeria
  ⚡ 输入流畅度与后台内存优化
  优化 Web/Desktop 输入响应与壁纸模式视口内模糊渲染，消除打字卡顿；用量统计改为按需读取与空闲释放，并升级依赖以显著降低 Host 常驻内存占用。
  — @BytePioneer-AI
  🖥️ macOS、Windows 与 Android 兼容性修复
  修复 macOS 上 codex-app-tools 桥接鉴权失败、Windows 应用包模式下内置 Codex CLI 无法被正确选用，以及部分 Android 厂商 WebView 因缺少多 Profile 或新 API 导致无法使用的问题。
  — @YanYunCY · @koeria · @BytePioneer-AI
  🤖 各 Harness 稳定性与额度刷新优化
  修复 Antigravity 活动轮次内的重复唤醒回复；优化 Claude Code 与 Antigravity 的额度刷新冷却与被动推送机制，减少多余请求；修复 Hermes 侧栏原生标题与持久化兼容，以及 DeepSeek 桌面启动环境下的 CLI 发现问题。
  — @bwndlct · @lpmasser · @fs-lx · @zxd-666 · @BytePioneer-AI
  🚀 新功能
  - Web 侧栏：新增顶部色点主机筛选栏，远程会话改用左侧细色条并仅在选中行轻显主机名
  - Web 排队消息：支持直接编辑包含图片与文件附件的排队消息 (#1112)
  - Web Composer：额度栏新增倒计时提示 (#1113)
  🐛 修复
  - 自动更新：npm 更新改为先确认源已同步再提示、并在停止服务前完成下载，失败说明按当前界面语言展示
  - Codex Desktop 26.1120：修复外部 Harness 审批/权限模式切换按钮消失的问题
  - Composer：切换至无 Thinking 选项的 Model 时不再丢失原有 Thinking 选择 (#1147)
  - Web Composer：粘贴或添加图片后输入框不再失焦、光标保持可见 (#1123)
  - 远端文件预览：修复远端主机预览 HTML、图片、PDF 及 Office 转 PDF 时报路径错误的问题
  - Web 预览与恢复：修复客户端预览加载偶发截断 (#1145)，启动恢复过期草稿会话时自动回退到新建会话 (#1142)
  - Web 工作区：删除工作区后同步 Desktop 时不再重新出现 (#1131)
  - 性能与内存：优化打字重绘与壁纸模式模糊范围，按需读取并空闲释放用量统计以降低后台内存占用 (#1109, #1110, #1111, #1133)
  - macOS：修复 codex-app-tools 在 exec-server 与 Desktop 桥接下的鉴权失败 (#1125)
  - Windows：修复应用包模式下未能正确使用内置 Codex CLI 的问题 (#1064)
  - Android：兼容不支持多 Profile 与较新 JS API 的厂商 WebView (#1119)
  - Antigravity：修复活动轮次中流式唤醒触发重复回复的问题 (#1124)
  - Claude Code / Antigravity：优化额度刷新节流与冷启动后的被动推送，减少多余请求 (#1121)
  - Hermes：侧栏正常显示原生会话标题并兼容原生持久化接口 (#1132, #1135)
  - DeepSeek：支持从桌面启动环境自动发现用户安装的 DSH CLI (#1116)

  This release fixes missing external Harness permission mode controls on newer Codex Desktop builds, brings a cleaner remote-host sidebar with top dot tabs, queued-message attachment editing, and composer countdown indicators, and improves typing responsiveness, memory usage, and macOS, Windows, and Android compatibility.
  ⚠️ Upgrade Note: npm mirrors (such as npmmirror) typically sync new releases within ~1 hour; automatic npm updates may fail before your mirror syncs, so please retry shortly. If an update reports that the service failed to become ready and rolls back to the previous version, you can keep using it normally: quit Codex and run codexhost in your terminal to restart; if you are still on the older version, run codexhost stop, npm install -g @codexhost/cli@latest, and then codexhost. v0.26.1 fixes both issues—auto-updates now verify your npm registry has synced before prompting and download the new release before stopping services, so these steps will not be needed for future updates starting from v0.26.1.
  🛡️ Codex Desktop 26.1120 & Composer Polish
  Restores external Harness permission mode controls on Codex Desktop 26.1120; retains Thinking preferences when switching to a Model without Thinking options; keeps Composer focus and caret visible after attaching images and adds countdown indicators to the Web usage dock.
  — @BytePioneer-AI · @koeria
  🌐 Remote-Host Sidebar, Queue Editing & File Preview
  Adds a top color-dot host filter bar in the Web sidebar, replacing repeated per-row host text with a subtle left rail and showing the host name only on the active remote row; supports editing queued messages with images and file attachments; fixes remote HTML/image/PDF/Office previews, stale draft recovery, and deleted workspaces reappearing after Desktop sync.
  — @BytePioneer-AI · @omsd512-W · @zxd-666 · @koeria
  ⚡ Typing Responsiveness & Lower Memory Footprint
  Eliminates typing re-render fan-out and limits wallpaper blur to near the viewport; loads usage statistics on demand with idle release and trims Host schema memory overhead.
  — @BytePioneer-AI
  🖥️ macOS, Windows & Android Compatibility
  Fixes macOS codex-app-tools bridge authentication, packaged Windows Codex CLI selection, and Android vendor WebViews lacking multi-profile or newer JS APIs.
  — @YanYunCY · @koeria · @BytePioneer-AI
  🤖 Harness Reliability & Quota Refresh
  Prevents duplicate wake turns during active Antigravity prompts; throttles Claude Code and Antigravity credits refreshes and relies on passive plan-limit pushes; fixes Hermes native sidebar titles and persistence compatibility, plus DeepSeek CLI discovery from desktop launches.
  — @bwndlct · @lpmasser · @fs-lx · @zxd-666 · @BytePioneer-AI
  🚀 Features
  - Web sidebar: top color-dot host filter bar with subtle left rails for remote sessions and active-row-only host labels
  - Web queued messages: edit queued messages containing image and file attachments (#1112)
  - Web Composer: countdown indicators in the usage dock (#1113)
  🐛 Fixes
  - Auto-update: verify npm registry sync before prompting, download new versions before stopping services, and display failure messages in the page language
  - Codex Desktop 26.1120: external Harness permission mode picker disappeared on newer Desktop builds
  - Composer: switching to a Model without Thinking options no longer clears the saved Thinking choice (#1147)
  - Web Composer: focus and caret stay visible after attaching images (#1123)
  - Remote file preview: fixed binary path errors when previewing remote HTML, image, PDF, and Office files
  - Web preview & startup: fixed occasional client bundle preview truncation (#1145) and automatically fall back to a new session when restoring stale drafts (#1142)
  - Web workspaces: deleted workspaces no longer return after Desktop sync (#1131)
  - Performance & memory: reduced typing re-renders, scoped wallpaper blur near the viewport, and released idle usage statistics to cut memory use (#1109, #1110, #1111, #1133)
  - macOS: fixed codex-app-tools authentication across exec-server and Desktop bridge (#1125)
  - Windows: fixed packaged Codex CLI selection when app-package mode skips the cache (#1064)
  - Android: added fallback support for vendor WebViews without multi-profile or ES2024 APIs (#1119)
  - Antigravity: prevented duplicate wake turns streamed inside an active prompt (#1124)
  - Claude Code / Antigravity: throttled account credits refresh and avoided extra plan-limit polling after cold start (#1121)
  - Hermes: restored native sidebar session titles and native persistence API compatibility (#1132, #1135)
  - DeepSeek: discovered user-installed DSH CLI from desktop launches (#1116)
  Install & Upgrade
  - New install: npm install -g @codexhost/cli, or download the installer for your platform from Assets below.
  - Upgrade: codexhost update. For npm installs, run codexhost stop before reinstalling.
  - macOS "cannot verify this app": xattr -dr com.apple.quarantine /Applications/codexhost.app
  - More: README
