  🔀 统一 Harness 选择器与跨 Harness 交接
  Web 与 Codex Desktop 统一 Harness 选择器分组、未安装列表与上下文交接入口，可直接从 Composer 发起跨 Harness 交接；Thinking 校验延后至 Adapter 打开时执行，避免切换模型时误拦截。
  — @iruriQ · @BytePioneer-AI · @lpmasser
  📂 项目归属与会话列表更稳更准
