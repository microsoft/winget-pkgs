  📋 完整更新清单
  展开查看全部新功能（8 项）与修复（16 项）
  🚀 新功能
  - 性能与内存：长对话离屏内容虚拟化（保留 Cmd+F 与选区）、已结束长代码块默认折叠、PDF 离屏画布回收、隐藏窗口暂停无限动画，以及服务端历史大工具输出按需加载 (#1247)
  - 远端网状配对：支持一键双向/网状（Mesh）Peer 配对与设置页交互式连接拓扑图 (#1237)
  - 远端两级 @ 委派：输入框新增两级 @ 远端主机委派菜单，并支持在远端 Peer 会话内 @ 补全目标机器的 Harness (#1240, #1244)
  - 跨机 @ 会话链接：修复远端主机列表路由，引入稳定节点标识并自动按主机视角转换跨机 @ 会话链接 (#1211)
  - 冷读会话历史：被动查看历史会话不再唤醒外部 Harness 子进程 (#1188)
  - 统一 Harness 选择器：Web 与 Codex Desktop 统一 Harness 分组、未安装列表与 Composer 跨 Harness 交接入口 (#1221)
  - 远端图片预览：支持工作区外远端图片预览与 Markdown 图片加载占位 (#1222)
  - 命令行更新与限流提示：codexhost update 实时展示下载进度 (#1212)，限流与配额耗尽错误改为结构化展示 (#1192)
  🐛 修复
  - Web 新会话：修复首条消息触发 Session not found 报错、首条消息短暂消失 (#1201) 与新会话初始 Turn 读取时序问题
  - 项目与侧边栏：同步读取 Codex Desktop 最新 SQLite 全局状态 (#1202)，对齐原生项目归属 (#1213)，重启后已归档会话不再回到侧边栏 (#1230)，并隐藏临时侧边聊天 (#1198)
