  📱 移动端交互与更新体验升级
  手机端点击发送与工具栏不再误弹软键盘，空闲标签页按时间戳及时自动关闭，顶部提示条不再被悬浮顶栏遮挡；codexhost update 实时显示下载进度，加固 npm 平台包更新校验与诊断控制台 Node 路径查找，更新日志明细支持默认折叠收起。
  — @iruriQ · @twodogegg · @ChaceLyee2101
  💬 限流提示与 Adapter 稳定性
  配额耗尽与限流错误改为结构化展示，Claude Code 主会话模型自动降级时在对话中给出明确提示，并修复预取输出读取拒绝导致的稳定性问题。
