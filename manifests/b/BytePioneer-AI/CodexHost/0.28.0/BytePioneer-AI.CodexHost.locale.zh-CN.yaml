  This release brings comprehensive desktop/Web memory and long-transcript rendering optimizations, one-click mutual/mesh remote Peer pairing with a two-level @ remote host delegation menu, a unified Harness picker, and mobile and stability fixes.
  ⚡ Desktop & Long-Transcript Memory Optimizations
  Offscreen transcript rows now virtualize while preserving native Cmd+F find and cross-row selection, settled long code blocks fold by default, PDF offscreen canvases and hidden-window animations reclaim resources automatically, and oversized historical tool outputs reload on demand. Passive history reads no longer wake external Harness processes, and large-scale usage statistics scan an order of magnitude faster.
  — @BytePioneer-AI · @biground · @iruriQ
  🌐 One-Click Mesh Peer Pairing & Two-Level @ Delegation
  Connect remote Peers in one click with mutual/mesh pairing and an interactive connection topology graph, with automatic cross-host @ thread link translation. The composer adds a two-level @ remote host delegation menu and remote Peer Harness autocomplete, alongside outside-workspace remote image previews and cross-peer permission mode sync.
  — @iruriQ
  🔀 Unified Harness Picker & Cross-Harness Handoff
  Web and Codex Desktop share unified Harness picker grouping, uninstalled listings, and Composer-initiated cross-Harness handoff. Thinking validation is deferred until Adapter open so model switches are no longer rejected prematurely.
  — @iruriQ · @BytePioneer-AI · @lpmasser
  📂 Reliable Project Membership & Sidebar State
  Reads Codex Desktop's latest SQLite global state and aligns native sidebar project membership, keeps archived threads out of the sidebar tree after restarts, hides temporary side chats, and restores Antigravity native titles and tool folding in converted Codex history. Also fixes first-message Session not found errors and transient message disappearance.
  — @sduhantao-maker · @iFinelioTower · @licoded · @bwndlct · @zxd-666
  📱 Mobile Polish & Update Experience
  Tapping Send or toolbar actions on mobile no longer raises the soft keyboard, idle session tabs expire immediately from timestamps, and mobile header notices sit cleanly below the floating header. codexhost update now displays download progress, npm updates enforce native platform packages, the diagnostic console resolves Node paths reliably, and detailed release notes collapse cleanly by default.
  — @iruriQ · @twodogegg · @ChaceLyee2101
  💬 Rate-Limit Clarity & Adapter Stability
  Rate-limit and quota-exhausted turn errors surface with structured details, Claude Code displays an in-chat notice on model fallback, and prefetched output read rejections are handled cleanly.
  — @2773281213 · @koeria · @Tim0085
  📋 Full Changelog
  Show all features (8) and fixes (16)
  🚀 Features
  - Performance & Memory: offscreen transcript row virtualization (with native Cmd+F lease and selection preservation), default folding for settled long code blocks, PDF offscreen canvas reclaim, hidden-window animation pausing, and on-demand loading for oversized historical tool outputs (#1247)
  - Mesh Peer Pairing: one-click mutual and mesh Peer pairing with an interactive directed connection topology graph in Settings (#1237)
  - Two-Level @ Remote Delegation: two-level @ remote host delegation menu in the composer and @ Harness autocomplete inside remote Peer sessions (#1240, #1244)
  - Cross-Peer Thread Links: fixed host list routing, added stable node IDs, and translated @ thread links per peer perspective (#1211)
  - Cold History Reads: read thread history passively without waking external Harness processes (#1188)
  - Unified Harness Picker: unified Harness grouping, uninstalled list, and Composer handoff across Web and Codex Desktop (#1221)
  - Remote Image Previews: outside-workspace remote image previews and Markdown image loading placeholders (#1222)
  - Update Progress & Rate Limits: live download progress in codexhost update (#1212) and structured rate-limit/quota-exhausted turn errors (#1192)
  🐛 Fixes
  - Web New Sessions: fixed first-message Session not found errors, transient first-message disappearance (#1201), and initial turn read timing
  - Projects & Sidebar: read Desktop's SQLite global state (#1202), aligned native sidebar project membership (#1213), kept archived threads out of the sidebar tree after restart (#1230), and hid temporary side chats (#1198)
  - Mobile UX: prevented send and toolbar taps from raising the soft keyboard (#1238), evaluated idle tab expiration immediately from timestamps (#1239), and moved header notices below the floating header (#1249)
  - Usage Statistics: narrowed Codex session fingerprinting and accelerated large-scale usage scanning and aggregation (#1227)
  - Remote Permissions: synced and persisted external permission mode across remote Peers (#1216)
  - Claude Code: surfaced main-session model fallback as an in-chat notice (#1107)
  - Antigravity: displayed native session titles in the sidebar (#1204)
  - History Projection: restored tool call folding in converted Codex history (#1209)
  - Delegation & Models: deferred activeModel Thinking validation to Adapter open (#1220)
  - Updater & Launcher: required the native platform package during npm updates (#1214) and resolved Node for the diagnostic console (#1218)
  - Host Stability: handled prefetched output read rejections cleanly (#1215)
  - Release Notes: supported collapsible <details> sections in the Settings update view
  Install & Upgrade
  - New install: npm install -g @codexhost/cli, or download the installer for your platform from Assets below.
  - Upgrade: codexhost update. For npm installs, run codexhost stop before reinstalling.
  - macOS "cannot verify this app": xattr -dr com.apple.quarantine /Applications/codexhost.app
  - More: README
