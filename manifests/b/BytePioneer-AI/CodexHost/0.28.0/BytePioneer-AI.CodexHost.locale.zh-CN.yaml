  长对话离屏内容按需虚拟化并保留原生 Cmd+F 查找与跨行选区，已结束长代码块默认折叠预览，PDF 离屏画布与隐藏窗口动画自动回收暂停，历史大工具输出按需加载；被动查看历史不再唤醒外部 Harness 进程，大规模用量统计扫描提速一个数量级。
  — @BytePioneer-AI · @biground · @iruriQ
  🌐 远端多机一键网状配对与两级 @ 委派
  新增一键双向/网状（Mesh）Peer 配对与交互式连接拓扑图，跨机器 @ 会话链接按视角自动转换；输入框支持两级 @ 远端主机委派菜单与目标机器 Harness 补全，并支持工作区外远端图片预览与权限模式跨机同步。
