ReleaseNotes: |-
  What's New
  This release adds support for DSH 0.2.1-rc.1 and 0.2.1-rc.2 and improves localized Harness controls and quota labels. It also fixes WorkBuddy authentication, OpenCode streaming, Claude Code Fork caching, external Harness sending on Desktop 26.1002 and mobile SSH conversations.
  本版支持 DSH 0.2.1-rc.1 与 0.2.1-rc.2，完善 Harness 控件和额度标签的本地化，并修复 WorkBuddy 认证、OpenCode 流式输出、Claude Code Fork 缓存、Desktop 26.1002 外部 Harness 发送及手机端 SSH 续聊问题。
  Features
  - Support DSH 0.2.1-rc.1 and 0.2.1-rc.2, fixing session failures and unreadable history caused by new session and web-search records (#549)
  - Improve localization for Harness permission modes, commands, CLI update notices and quota labels (#522)
  Fixes
  - Let the bundled WorkBuddy CLI read its encrypted login credentials and show clearer native authentication errors in WorkBuddy and CodeBuddy (#533)
  - Keep external Harnesses usable when Codex quota is exhausted on Desktop 26.1002, and hide the Codex quota banner in their Composer (#542)
  - Stream OpenCode text and reasoning as they arrive instead of waiting for the complete response (#212)
  - Correctly show OpenCode v2's default thinking option (#537)
  - Preserve Claude Code prompt-cache reuse after a Fork by repairing copied tool references (#530)
  - Allow ChatGPT iOS and other official clients over SSH to reopen and continue existing External Threads (#544)
  - Keep session usage available when account quota reads or refreshes fail, and avoid waiting for quotas on Harnesses that do not provide them (#522)
  - Show only session usage in the usage popover and hide its entry when no usage data is available
  新功能
  - 支持 DSH 0.2.1-rc.1 与 0.2.1-rc.2，修复新增会话和搜索记录导致的会话故障及历史无法打开问题 (#549)
  - 完善 Harness 权限模式、命令、CLI 更新说明和额度标签的中英文展示 (#522)
  修复
  - 修复 WorkBuddy 内置 CLI 无法读取加密登录凭据的问题，并改善 WorkBuddy 和 CodeBuddy 的原生认证错误提示 (#533)
  - 修复 Desktop 26.1002 上 Codex 额度耗尽后误拦外部 Harness 发送的问题，并在外部 Harness 的 Composer 中隐藏 Codex 额度横幅 (#542)
  - 修复 OpenCode 文本和思考内容无法持续流式显示、需要等待完整结果才出现的问题 (#212)
  - 修复 OpenCode v2 默认思考选项显示不正确的问题 (#537)
  - 修复 Claude Code Fork 后工具引用失效、导致提示缓存无法正常复用的问题 (#530)
  - 修复 ChatGPT iOS 等官方客户端通过 SSH 打开和续聊已有 External Thread 时被阻断的问题 (#544)
  - 修复账号额度读取或刷新失败影响会话用量查询的问题，并避免等待未提供额度能力的 Harness (#522)
  - 用量浮窗只展示会话用量，不再显示账号身份；没有用量数据时隐藏入口
