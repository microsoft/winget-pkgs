ReleaseNotes: |-
  What's New
  This release adds native Copilot SDK support, native same-turn steering for Claude Code, and more Harness management and usage controls. It also improves Composer and delegated-thread visibility, while fixing reliability issues across Pi, Claude Code, Cursor, Codex usage, and Desktop integration.
  本版新增 Copilot 原生 SDK 支持、Claude Code 同轮原生引导，以及更多 Harness 管理和用量控制功能；同时改进 Composer 与委派线程信息，并修复 Pi、Claude Code、Cursor、Codex 用量和 Desktop 集成中的多项问题。
  Features
  - Add a native Copilot SDK Harness plugin
  - Steer a running Claude Code Turn natively without starting a new Turn (#572)
  - Install and update Harnesses through Host background tasks, and update multiple Harnesses from Settings
  - Check WorkBuddy versions and open the official download page
  - Select a Host for usage statistics and aggregate usage in the Desktop timezone (#555)
  - Show plugin-declared cache countdowns in Composer (#582)
  - Name delegated threads using their parent and subtask titles (#569)
  - Confirm live Grok permission-mode changes
  Fixes
  - Preserve Pi's native autonomous-turn boundaries and Fast model eligibility (#575), keep changed-file information after history rebuilds (#567), and resolve npm account-import installation failures (#592)
  - Preserve Claude Code background continuation history, keep asynchronous Agent runs within their Turn, and use the CLI's default project and local configuration
  - Avoid synthetic OpenCode conversations for subagent notifications (#577)
  - Improve Codex usage reliability for late token counts and prompts (#536), large compressed rollout records (#558), and long titles containing emoji (#559)
  - Keep Cursor Fork working during active Turns and on Node 26, and make Auto's Optimize For option selectable as Thinking (#568, #573)
  - Avoid failing Antigravity Turns when a native error repeats (#554)
  - Recognize the Desktop 26.1016 Host registry without waiting for a manager identifier (#579)
  - Create a Windows desktop shortcut during installation
  - Fix opaque Wayland input-method candidate borders (#565)
  - Use native Desktop services for SSH connections
  新功能
  - 新增基于原生 SDK 的 Copilot Harness 插件
  - 支持在 Claude Code 正在运行的 Turn 中进行原生引导，不必另开 Turn (#572)
  - 通过 Host 后台任务安装和更新 Harness，并可在设置中批量更新
  - 检查 WorkBuddy 版本并打开官方更新下载页面
  - 用量统计支持选择 Host，并按 Desktop 时区汇总 (#555)
  - Composer 展示插件声明的缓存倒计时 (#582)
  - 根据父线程和子任务标题命名委派线程 (#569)
  - Grok 实时切换权限模式时增加确认
  修复
  - 保留 Pi 原生自主 Turn 边界和 Fast 模型适用性判断 (#575)；重建历史后保留“修改的文件”信息 (#567)；修复 Pi 账号导入导致的 npm 安装失败 (#592)
  - 修复 Claude Code 后台续接历史丢失；异步 Agent 默认在当前 Turn 内运行；按 CLI 默认加载项目和本地配置
  - 避免 OpenCode 子代理通知生成虚假的对话轮次 (#577)
  - 修复 Codex 用量统计遗漏较晚到达的 Token 数和用户提示 (#536)、无法处理较大的压缩记录 (#558)，以及含表情符号的长标题导致页面打不开 (#559)
  - 修复 Cursor 活跃 Turn 期间及 Node 26 环境下的 Fork 问题，并允许将 Auto 的 Optimize For 选项作为 Thinking 选择 (#568, #573)
  - Antigravity 重复返回先前原生错误时不再导致 Turn 失败 (#554)
  - 无需等待 manager 标识即可识别 Desktop 26.1016 Host 注册表 (#579)
  - Windows 安装时创建桌面快捷方式
  - 修复 Wayland 输入法候选框边框不透明的问题 (#565)
  - SSH 连接改用 Desktop 原生服务
