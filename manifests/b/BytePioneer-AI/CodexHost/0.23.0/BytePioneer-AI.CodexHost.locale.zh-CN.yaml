ReleaseNotes: |-
  What's New
  codexhost 0.23.0 introduces a hot-pluggable Desktop UI extension platform with an in-app Marketplace, adds WebRTC direct streaming and adaptive performance to Web's sidebar browser, and brings native Codex Usage metering on the shared channel, Codex Ultrafast speed controls, inline reply comments, and DeepSeek prepaid balances. It also restores full compatibility with Codex Desktop 26.1117, upgrades the bundled Node.js security runtime, and delivers fixes across Claude Code, Antigravity, Grok, Pi, WorkBuddy, and Remote Control.
  codexhost 0.23.0 推出可热插拔的 Desktop 界面扩展平台与应用市场，为 Web 侧栏浏览器带来 WebRTC 直连与自适应流畅推流，并新增共享通道原生 Codex 用量计量、Codex Ultrafast 档位、回复划词批注以及 DeepSeek 预付费余额显示。同时全面兼容 Codex Desktop 26.1117 启动链与侧栏布局，升级安装包内嵌 Node.js 安全版本，并修复了 Claude Code、Antigravity、Grok、Pi、WorkBuddy 与 Remote Control 的多项问题。
  Features
  - Desktop UI extension platform and Marketplace: load hot-pluggable Desktop UI extensions and optional isolated Node backends without restarting Codex Desktop; race primary and mirror catalog URLs concurrently, browse categories, GitHub stars, and install counts, switch bilingual (中 / EN) extension details, install from the Marketplace, GitHub URLs, or local .zip archives, open a "Create plugin" modal with a copyable AI prompt, configure declarative plugin settings, and recover via Console's "Disable all extensions and reload" action (#992)
  - Sidebar browser WebRTC direct connection and adaptive streaming: automatically negotiate WebRTC DataChannel frame delivery when accessing Web through a relay or proxy (falling back seamlessly to WebSocket), pipeline in-flight frames, stream active motion as JPEG before restoring lossless 2x PNG, coalesce wheel input, anchor touch scrolling, and pause capture when tabs are collapsed or hidden
  - Native Codex Usage metering on the shared channel: meter native Codex Threads directly on the shared client channel and manage Desktop tool authorization and MCP override lifecycles across idle refreshes
  - Codex Ultrafast tier in Web: switch between Standard, Fast, and Ultrafast from the Composer lightning menu, model picker, and /model when advertised by the owning Host (including SSH and Remote Control hosts) while preserving the native model and Thinking settings (#923)
  - Inline reply comments in Web: use Comment beside Add to chat on selected reply text to open an anchored note card right next to the passage and return focus to the Composer after confirming (#927)
  - DeepSeek prepaid balance display: view DeepSeek API key prepaid balances in Settings → Accounts and in the Composer quota chip (#602, #603)
  - Antigravity idle background output: project and persist idle Antigravity background output onto the latest completed Turn—promoting trailing background replies to the final answer—to match native SQLite history (#898)
  - Bundled Node.js security upgrade: update the bundled Node.js runtime in macOS and Windows installers to 24.22.1 (#606)
  Fixes
  - Codex Desktop 26.1117 compatibility and Settings UI: recognize the App server host utility launch chain on macOS and Windows so the Host starts cleanly without timing out, place sidebar Harness icons in the native leading slot at a uniform 14px size, and hide the native workspace outline under the injected Settings page (#980, #983)
  - Claude Code narration, quota, and import: display signed narration thinking blocks as commentary instead of hiding them in Reasoning, show plan quota immediately after Host restarts while keeping weekly windows scoped, and skip duplicate session IDs instead of blocking the entire import list (#802, #902, #933)
  - Antigravity Skill replies: persist and display conversational Antigravity Skill replies as normal Turns instead of trapping them inside ephemeral command cards (#984)
  - Grok, Pi, and WorkBuddy compatibility: preserve Grok native model IDs containing slashes and restore saved models on cold resume, restore Pi subagent cards keyed by parent session file, and support WorkBuddy's legacy credential bootstrap protocol (#581, #598, #934)
  - Web reconnect, streaming, Skills, Remote Control, and proxy logins: keep the thread title and Usage dock visible during reconnects, keep the Usage popover open during streaming auto-scroll, prevent live assistant chunk drops in long histories, list Codex Skills before the first message in new Web sessions, retain migrated Desktop project groups, recognize native Codex threads over Remote Control on macOS/Linux hosts, and allow non-Relay logins behind HTTPS proxies without --trusted-proxy (#525, #797, #932, #952)
  - Composer input, Host delegation, Broker, Launcher, and Windows portable info: allow native Codex draft editing when private model bindings are unavailable while waiting for routing callbacks before sending, settle external Threads left busy by a killed Harness session, align optional HTTP delegation defaults with the CLI, raise Broker response limits to 32 MiB cleanly, stop exiting supervisors from clearing active service ready records, and report portable Windows Desktop version and source from ASAR metadata (#589, #633, #796, #807, #843, #925)
  新功能
  - Desktop 界面扩展平台与应用市场： 支持热插拔加载 Desktop 界面扩展与可选的独立 Node 后端，无需重启 Codex Desktop；并发竞速拉取市场主源与镜像，支持浏览分类、查看 GitHub Star 数与安装量、切换中英文扩展文案、从市场 / GitHub 链接 / 本地 .zip 安装，提供带可复制 AI 提示词的「创建插件」弹窗、声明式插件设置页，以及 Console「禁用全部扩展并重载」应急恢复入口 (#992)
  - Web 侧栏浏览器 WebRTC 直连与自适应流畅推流： 经 Relay 或代理访问 Web 时自动协商 WebRTC 直连传输画面并在失败时无感回退 WebSocket，支持帧流水线并发、运动阶段自动切换 JPEG 再恢复无损 2x PNG、合并滚轮与锚定触屏滚动，并在标签折叠或隐藏时暂停抓帧推流
  - 共享通道原生 Codex 用量计量与工具生命周期管理： 在共享客户端通道上直接计量原生 Codex Thread 用量，并在连接断开后于空闲期自动按有效配置重建 Desktop 工具授权与 MCP 覆盖
  - Web 支持 Codex Ultrafast 档位： 当所属 Host（含 SSH 与 Remote Control）声明支持时，可通过 Composer 闪电菜单、模型选择器与 /model 在标准、Fast 与 Ultrafast 间切换，同时保留当前模型与 Thinking 设置 (#923)
  - Web 回复划词内联批注： 选中回复文本后可在「添加到对话」旁点击 Comment / 批注，在段落旁直接填写备注并附带发送，确认后焦点自动回到输入框 (#927)
  - DeepSeek 预付费余额显示： 在「设置 → 账号」及 Composer 额度胶囊中展示 DeepSeek API Key 的预付费余额 (#602, #603)
  - Antigravity 空闲后台输出投影： 将 Antigravity 空闲期产生的后台输出投影并持久化到最近完成的 Turn（将尾部后台回复提升为最终回答），与原生 SQLite 历史保持一致 (#898)
  - 安装包内嵌 Node.js 安全升级： 将 macOS 与 Windows 安装包内嵌私有 Node.js 运行时升级至 24.22.1 (#606)
  修复
  - Codex Desktop 26.1117 兼容与设置页修复： 识别 macOS 与 Windows 上新版 App server host 工具进程启动链以避免 Host 启动超时，将侧栏 Harness 图标重新对齐到原生前置槽位与统一 14px 尺寸，并隐藏设置页上方穿透显示的原生工作区外框线 (#980, #983)
  - Claude Code 过程说明、重启额度与导入列表： 将带 narration 签名的思考块展示为过程说明而非隐藏进 Reasoning，Host 重启后无需新消息即可直接显示套餐额度并隔离每周窗口，导入列表遇到重复 Session ID 时跳过冲突项而非阻塞整表 (#802, #902, #933)
  - Antigravity Skill 回复展示： 将产生对话回复的 Antigravity Skill 展示并保存为普通 Turn，不再困在临时命令卡片内 (#984)
  - Grok、Pi 与 WorkBuddy 兼容性： 支持包含斜杠的 Grok 原生模型 ID 并在冷恢复时还原已选模型，按父会话文件路径正确恢复 Pi 子代理卡片，以及兼容旧版 WorkBuddy 内置 CLI 的凭据引导协议 (#581, #598, #934)
  - Web 重连、流式输出、Skills、Remote Control 与代理登录： 重连同步期间保留会话标题与 Usage 栏避免界面跳动，流式自动滚动时保持 Usage 弹窗开启，修复长历史流式分片偶发丢字，新建 Codex 会话首条消息前即可列出工作区 Skills，保留从 Desktop 迁移的项目分组，支持 macOS/Linux 主机经 Remote Control 识别原生 Codex Thread，以及放宽反向代理后非 Relay 场景的同源协议校验 (#525, #797, #932, #952)
  - 原生输入、委派 HTTP、Broker、Launcher 与便携版版本号： 缺失私有模型绑定时允许原生 Codex 正常编辑并在路由回调就绪后再提交，Harness 会话异常终止时自动收敛挂起为忙碌的外部 Thread，补齐 HTTP 委派默认参数以对齐 CLI，将 Broker 响应上限提升至 32 MiB 并稳健重组分片，避免退出的监管进程误删存活服务的 ready 记录，以及从 ASAR 元数据正确读取 Windows 便携版 Desktop 版本与来源 (#589, #633, #796, #807, #843, #925)
