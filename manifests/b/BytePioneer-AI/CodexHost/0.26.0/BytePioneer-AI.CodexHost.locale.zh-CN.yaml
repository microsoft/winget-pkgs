ReleaseNotes: |-
  本次更新带来多远端主机聚合与文件预览、自包含 Linux 安装包与全新桌面壳启动页，并大幅优化了空闲资源占用与各 Harness 稳定性。
  🌐 多远端主机聚合、文件预览与 Skills
  在同一个 Web 界面中可同时配对并管理多台远端 codexhost 主机，添加时支持预选项目、设置标签颜色并行内启停；远端项目支持文件预览、Office 转 PDF、流式下载、附件与图片收发、@ 文件引用补全以及查看 Skills 与只读斜杠命令，同时大幅提升了远端列表加载速度。
  — @iruriQ · @BytePioneer-AI
  📱 Web 侧栏、聊天渲染与移动端体验
  Web 侧栏同步展示 Desktop 分组项目，展开更多与翻页重试更顺畅；聊天中的 Markdown 图片与软换行表现对齐 Codex Desktop，并修复了 iOS 渲染、测试通知范围与外部会话回退标题等问题。
  — @sduhantao-maker · @xzxxn777 · @ChaceLyee2101 · @BytePioneer-AI
  🖥️ 桌面壳焕新、插件预览与 Linux 独立安装包
  桌面壳的启动引导与加载页换上全新分屏水獭插画，启动异常时可直接查看详情并跳转反馈；插件详情支持全屏灯箱预览截图、实时下载量展示与更新高亮；新增自包含的 Linux x64 / ARM64 tar.gz 独立安装包，并改进了 Windows 启动、便携版更新与孤儿进程恢复。
  — @BytePioneer-AI · @iruriQ · @fs-lx · @koeria · @ChaceLyee2101 · @hhucz
  ⚡ 资源占用优化与空闲自动释放
  外部 Harness 会话在空闲 10 分钟后默认自动释放，长时间无人跟进的本地历史视图也会自动回收，显著降低后台内存占用；同时跳过升级迁移时的多余目录探测，启动更轻快。
  — @BytePioneer-AI · @fs-lx
  ✍️ Composer 与自定义 Provider 更顺手
  输入框在中文和全角标点后也能直接用 # 触发引用，且不会在代码块内误触；使用自定义 Provider 推理时不再被 Codex 额度限制阻断，窄宽度下的按钮显示也更整洁。
  — @2773281213 · @ump45nose · @BytePioneer-AI
  🤖 各 Harness 能力与稳定性修复
  Antigravity 新会话默认跳过权限确认、Thread 额度优先展示当前 Model 分组，且首轮列表加载失败后支持重试恢复；同时修复了 Claude Code、Hermes、DeepSeek 与 Pi 的模型解析、环境发现和取消后恢复问题。
  — @BytePioneer-AI · @YanYunCY · @lpmasser · @fs-lx · @liuxxxu · @2773281213 · @shiziyang2000-bit
  🚀 新功能
  - Web 多远端主机：支持同时配对与聚合多台远端 codexhost Web 主机，新建对话时可直接选择目标主机与项目目录，添加主机时支持预选项目、设置标签颜色并行内开关启停 (#1101)
  - 远端文件与交互：远端项目支持文件预览、Office 转 PDF 渲染、流式下载、附件与图片端到端收发、@ 文件引用补全以及查看远端 Skills 与只读斜杠命令
  - Web 侧栏与聊天：同步显示 Desktop 放入分组的项目，聊天中的 Markdown 图片与软换行表现对齐 Codex Desktop (#1076)
  - Linux 安装包：新增自包含的 x64 / ARM64 tar.gz 独立发行包 (#1102)
  - 桌面壳：启动引导与加载页升级为分屏水獭插画，并支持查看启动报错与一键反馈问题
  - 插件中心：插件详情支持全屏灯箱预览截图，展示实时下载统计并高亮可更新插件
  - Composer：支持在中文和全角标点后用 # 触发引用，并自动跳过代码块 (#1087)
  - Antigravity：新建会话默认跳过权限确认，Thread 额度优先展示当前 Model 所属分组
  - 资源管理：外部 Harness 空闲 10 分钟后默认自动释放，无人跟进的本地历史视图自动回收以降低内存占用 (#1099, #1100)
  🐛 修复
  - 远端主机体验：新建远端 Thread 不再显示原始 UUID 标题并自动生成首轮标题，可写远端会话恢复排队、引导与取消操作，重连或停用后再启用时项目与刷新状态可正常恢复
  - 远端主机性能与显示：远端主机列表分页加载更流畅，修复远端 Harness 图标偶发缺失或陈旧、空目录文件树无法展开，以及已登录远端会话无法管理远端主机的问题
  - 自定义 Provider：使用独立原生 Provider 推理时不再被 Codex 额度限制阻断 (#470)
  - Antigravity：首次加载 Model 列表失败后不再一直卡住，支持重试恢复 (#1061)
  - Claude Code：旧版 fable 模型别名自动解析到最新目录版本 (#1060)
  - Hermes：选择 Model 时不再丢失具名 Provider 路由 (#1098)
  - DeepSeek：修复通过 nvm 安装时无法发现可执行文件，以及无端口会话 Cookie 识别失败的问题 (#1079, #1091)
  - Pi：取消操作未完成时会话不再卡死，可正常恢复继续对话 (#950)
  - Web 侧栏：项目下点击「展开显示」不再提前截断，翻页重试保持当前项目范围且大列表合并更流畅 (#1081, #1097)
  - Web 移动端与交互：修复 iOS 下代码块和壁纸模式用户消息漏绘、工具提示偏移，以及多击选中回答时误选输入框区域 (#1074)
  - Web 通知与标题：测试通知仅发送到当前设备；标题生成失败时为外部 Thread 自动回退首条消息标题 (#1069, #1071)
  - 控制台与更新：校验托管的 Desktop 进程状态避免误报运行中，并保留便携版 Desktop 的更新路径 (#1072, #1075)
  - Windows 与桌面壳：改进 Windows Store 版启动稳定性与 macOS 桌面壳圆角样式，管理进程退出后可自动清理恢复孤儿 Web 子进程 (#1057)
  - Composer：窄宽度下更早折叠权限模式标签，并隐藏加载期误显的原生模型按钮
  - 启动迁移：跳过不必要的模型目录探测，减少启动等待 (#1094)
  - 另有 8 项远端连接稳定性、内存占用与细节修复

  This release brings multi-remote host aggregation with remote file preview, self-contained Linux archives, and redesigned desktop shell onboarding screens, along with lower idle memory usage and Harness stability fixes.
  🌐 Multi-remote host hub, file preview & Skills
  Pair and manage multiple remote codexhost hosts from one unified Web UI with project pre-selection, color-coded host badges, and inline enable toggles; remote projects now support file previews, Office-to-PDF rendering, streaming downloads, end-to-end attachments and image previews, @ file mentions, and remote Skills / read-only slash commands, alongside much faster catalog loading.
  — @iruriQ · @BytePioneer-AI
  📱 Web sidebar, chat rendering & mobile experience
  The Web sidebar now shows Desktop section projects with smoother "Show more" pagination and retries; chat Markdown images and soft breaks match Codex Desktop, and iOS rendering, test notification targeting, and fallback Thread titles are fixed.
  — @sduhantao-maker · @xzxxn777 · @ChaceLyee2101 · @BytePioneer-AI
  🖥️ Refreshed desktop shell, plugin previews & Linux archives
  The desktop shell onboarding and loading screens feature new split-hero otter artwork with surfaced launch errors and quick issue reporting; plugin details support viewport lightbox previews, live download counts, and update highlights; self-contained Linux x64 / ARM64 tar.gz archives join the release alongside Windows startup, portable update, and orphan Web recovery improvements.
  — @BytePioneer-AI · @iruriQ · @fs-lx · @koeria · @ChaceLyee2101 · @hhucz
  ⚡ Lower idle memory & automatic session release
  Idle external Harness sessions are now released by default after 10 minutes, and unfollowed local history views are evicted automatically to cut background memory usage; startup migration also skips unnecessary catalog probes.
  — @BytePioneer-AI · @fs-lx
  ✍️ Smoother Composer & independent Providers
  Trigger # mentions directly after CJK or fullwidth punctuation without false triggers inside code blocks; independent native Providers are no longer blocked by Codex quota limits, and narrow Composers stay clean during loading.
  — @2773281213 · @ump45nose · @BytePioneer-AI
  🤖 Harness enhancements & stability fixes
  Fresh Antigravity sessions now default to skip permissions, lead Thread quota with the active Model's group, and recover via retry after an initial catalog failure; Claude Code, Hermes, DeepSeek, and Pi also receive routing, discovery, and cancellation recovery fixes.
  — @BytePioneer-AI · @YanYunCY · @lpmasser · @fs-lx · @liuxxxu · @2773281213 · @shiziyang2000-bit
  🚀 Features
  - Web multi-remote hub: pair and aggregate multiple remote codexhost Web hosts with a host and project picker for new sessions, optional project pre-selection, color-coded host badges, and inline enable toggles (#1101)
  - Remote files & interactions: preview remote workspace files, render Office documents to PDF, stream downloads, send and preview attachments end-to-end, use @ file mention completion, and browse remote Skills and read-only slash commands
  - Web sidebar & chat: show Desktop section projects directly in the Web sidebar, and align chat Markdown images and soft breaks with Codex Desktop (#1076)
  - Linux installers: publish self-contained x64 and ARM64 tar.gz release archives (#1102)
  - Desktop shell: redesigned split-hero otter onboarding and loading screens with launch error details and quick issue links
  - Extensions: full-viewport screenshot lightbox preview, live download stats, and highlighted plugin updates
  - Composer: # mentions now trigger after CJK/fullwidth punctuation and skip code blocks (#1087)
  - Antigravity: default fresh sessions to skip permissions and lead Thread quota with the current Model's group
  - Resource management: release idle external Harness sessions after 10 minutes by default and drop unfollowed local history views to reduce memory usage (#1099, #1100)
  🐛 Fixes
  - Remote host workflows: newly created remote Threads showed raw UUID titles instead of generated or fallback titles, writable remote sessions rejected queue/steer/cancel actions, and reconnecting or re-enabling a host left stale refresh states or missing projects
  - Remote host loading & display: slow multi-page remote catalogs, missing or stale remote Harness icons, empty-root remote file trees, and authenticated remote sessions unable to manage remote peers
  - Custom Providers: independent native Provider inference was blocked by Codex quota limits (#470)
  - Antigravity: failed initial Model catalog loads could not recover on retry (#1061)
  - Claude Code: legacy fable model alias failed to resolve to the latest catalog version (#1060)
  - Hermes: named Provider routes were lost during Model selection (#1098)
  - DeepSeek: missed nvm installations and rejected port-less session cookie names (#1079, #1091)
  - Pi: sessions could stay stuck after an unsettled cancellation (#950)
  - Web sidebar: "Show more" stopped before reaching a project's own Threads, retry lost page scope, and large page merges lagged (#1081, #1097)
  - Web mobile & UI: missing code blocks and wallpaper messages on iOS, shifted user message tooltips, and multi-click selection bleeding into Composer controls (#1074)
  - Web notifications & titles: test notifications broadcast beyond the current device, and external Threads lacked a fallback title when generation failed (#1069, #1071)
  - Console & updater: stale running status for managed Desktop processes and lost portable Desktop paths during updates (#1072, #1075)
  - Windows & desktop shell: Windows Store launch reliability, macOS shell corner alignment, and orphaned Web child recovery after supervisor exit (#1057)
  - Composer: crowded permission labels and native loading buttons briefly showing plugin route carriers
  - Startup migration: skipped unnecessary catalog probes (#1094)
  - 8 more remote connection, memory, and stability fixes
  Install & Upgrade
  - New install: npm install -g @codexhost/cli, or download the installer for your platform from Assets below.
  - Upgrade: codexhost update. For npm installs, run codexhost stop before reinstalling.
  - macOS "cannot verify this app": xattr -dr com.apple.quarantine /Applications/codexhost.app
  - More: README
