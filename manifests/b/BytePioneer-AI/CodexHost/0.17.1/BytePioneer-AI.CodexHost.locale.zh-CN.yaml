ReleaseNotes: |-
  What's New
  Support connections between Windows, macOS, and Ubuntu, and improve SSH and Remote Control connection reliability. Restore ZCode Personal Coding Plan access and fix Pi, Cursor CLI, Kimi Code, and Antigravity interactions.
  支持 Windows、macOS 与 Ubuntu 三端互相连接，改善 SSH 与 Remote Control 连接稳定性。恢复 ZCode 个人 Coding Plan 访问，并修复 Pi、Cursor CLI、Kimi Code 和 Antigravity 的交互问题。
  Features
  - Let Kimi Code receive delegated tasks using its native YOLO mode, only after Kimi confirms the mode; ordinary sessions keep their native defaults (#711)
  Fixes
  - Restore external Harnesses on Windows Remote Control Hosts across Desktop manager layouts and reconnects, preserving history and native approval interactions; keep official Codex available over SSH (#706)
  - Recognize ZCode Personal Coding Plan project credentials so valid subscriptions can load models and authenticate, while retaining support for existing API Keys (#713)
  - Preserve Windows Pi working directories for WSL/network UNC projects when using supported npm or managed launchers (#703)
  - Stop Pi token-speed and other temporary footer status updates from flooding conversations; normal notifications remain visible (#710)
  - Respect Cursor CLI's existing Run Everything setting instead of repeatedly requesting tool approval, subject to native team policy (#699)
  - Preserve Cursor's remembered model parameters when switching models, avoiding unintended Fast mode activation (#705)
  - Show Kimi Code plan review as native Codex choices, keeping approval, revision, rejection, and cancellation distinct (#712)
  - Allow Antigravity conversations to be archived after failures before native session creation, and preserve the original failure when refreshing history (#701)
  新功能
  - Kimi Code 可通过原生 YOLO 模式接收委派任务，仅在 Kimi 确认模式后继续；普通会话保持原生默认配置 (#711)
  修复
  - 修复不同 Desktop 管理布局及重连后的 Windows Remote Control 外部 Harness 访问，保留历史与原生审批交互；SSH 连接仍可使用官方 Codex (#706)
  - 识别 ZCode 个人 Coding Plan 项目凭据，让有效订阅正常加载模型并完成鉴权，同时兼容已有 API Key (#713)
  - 使用受支持的 npm 或托管启动器时，Windows Pi 在 WSL/网络 UNC 项目中保持正确工作目录 (#703)
  - Pi 测速等临时页脚状态不再刷满对话，正常通知仍会显示 (#710)
  - 尊重 Cursor CLI 已有的 Run Everything 设置，避免反复请求工具审批；原生团队策略仍然生效 (#699)
  - Cursor 切换模型时保留原生记忆的参数，避免意外开启 Fast 模式 (#705)
  - Kimi Code 计划审批使用 Codex 原生选项，明确区分批准、修改、拒绝与取消 (#712)
  - Antigravity 在原生会话创建前失败后仍可归档对话，刷新历史时保留原始错误 (#701)
