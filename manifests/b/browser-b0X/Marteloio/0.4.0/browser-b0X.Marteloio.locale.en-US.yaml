ShortDescription: A free, open-source eBay listing generator that turns your notes into a finished listing.
Description: Type a few notes about an item and Marteloio drafts the eBay title, item specifics and an HTML description to copy into eBay. Handles single items and bundles, keeps the condition you wrote, and saves drafts and templates. Uses your own free AI key (Google Gemini, Groq, OpenRouter or FreeLLMAPI) and needs no eBay account or developer keys. Runs on your own PC, includes the Python runtime and opens in your browser.
