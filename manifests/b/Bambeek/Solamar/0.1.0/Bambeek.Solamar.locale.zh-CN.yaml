PackageIdentifier: Bambeek.Solamar
PackageVersion: 0.1.0
PackageLocale: zh-CN
ShortDescription: 一款为告别 Arc 的用户打造的本地优先侧边栏浏览器。
Description: |-
  The Browser Company 将于 2026 年 12 月 22 日终止 Arc。Solamar 保留了 Arc 做得好的部分，例如空间、垂直侧边栏、固定的标签页和文件夹，并支持一键把你的 Arc 侧边栏迁移过来。它还内置广告拦截器，并带有一个在你开启之前始终保持关闭的 AI 代理。Solamar 免费且开源，没有账户，也没有遥测。
  从 Arc 迁出
  - Arc 空间，一键迁移。Solamar 会读取 Arc 保存在你电脑上的侧边栏文件，且不做任何改动。它会把你的空间连同各自的颜色和图标、固定的标签页以及文件夹一并迁移过来。任何内容都不会被上传。
  - 也可以来自其他浏览器。一键导入电脑上其他浏览器的书签和历史记录。密码则通过浏览器或密码管理器导出的 CSV 文件导入。
  - 你自己的布局。保留 Arc 的垂直侧边栏，或切换为顶部标签栏。每个标签页都显示标题和自己的关闭按钮。
  内置功能
  - 空间：颜色、固定的标签页、收藏和嵌套文件夹。今天的标签页会在 12 小时后自动归档。
  - 命令栏：按 Ctrl+T 即可搜索、打开网站、跳转到某个标签页或执行操作。所有快捷键都可以更改。
  - 分屏视图和快速预览：把两个页面并排放置。按住 Shift 点击链接，即可在当前页面上方打开它；可以保留为标签页，或按 Esc 关闭。
  - Zap 和 Boosts：点击横幅或弹窗即可将其永久移除。Boosts 能为任何网站套用你自定义的颜色、字体和 CSS。
  - 广告拦截：首次启动即默认开启，YouTube 也包括在内。它使用开源引擎和社区过滤列表，一键即可允许某个网站显示广告。
  - 密码：登录时 Solamar 会询问是否保存登录信息，并使用系统钥匙串加密保存。它只在对应的网站上填充密码。
  - Chrome 扩展程序：从 Chrome 网上应用店添加扩展程序。安装之前，Solamar 会用平实的语言告诉你它能做什么。
  - 隐私空间：一个什么都不保存的空间：没有历史记录、不加载扩展程序，关闭之后也不残留 Cookie。
  - 内存占用低：未被查看的标签页会进入休眠。崩溃之后，你的标签页会连同各自的历史、滚动位置和正在输入的内容一起恢复。
  - 迷你播放器：直接在顶栏控制另一个标签页中音乐的播放、暂停和画中画。
  AI，只在你需要时开启
  AI 在你开启之前保持关闭。届时由你选择每项功能由什么来驱动：
  - 通过 Ollama 使用本地模型，任何数据都不会离开你的电脑；
  - 或使用你自己的 Anthropic API 密钥连接 Claude，密钥由 Solamar 保存在系统钥匙串中。
  - 代你操作。告诉代理在当前页面上做什么，例如填写表单或收集页面上的所有地址。它会展示每一步，你可以随时叫停。在为任何东西付费之前，它都会等待你的点击。它无法在密码、银行卡或一次性验证码输入框中输入内容。
  - 起草回复。在邮件或聊天输入框中按 Ctrl+Shift+Space，它会以你的口吻写出回复，留给你发送。
  - 询问页面。按 Ctrl+J 获取长页面的要点，或就页面内容提问。
  - 更好的搜索。在命令栏中按 Tab 进行更精准的搜索，或直接提问并在命令栏中得到答案。
  - 整理标签页。它会为今天的标签页建议分组。在你应用之前，什么都不会移动。
  用 Claude Code 驱动它
  开启“设置 > Claude Code”后，Solamar 会启动一个仅限本机访问的 MCP 服务器。设置页面会显示一条 claude mcp add 命令，在终端中运行一次即可。此后 Claude Code 就能打开标签页、读取页面、点击和输入。它可以在自己的 Claude 空间中工作，也可以在你共享给它的标签页中操作。它遵循与 Solamar 自带代理相同的规则：付费操作等待你的点击，而且绝不输入密码或卡号。顶栏的胶囊图标会显示它何时在工作，你也可以在那里停止它。
  一款浏览器，而非一项服务
  - 无账户。无需创建任何东西，也无需登录任何服务。
  - 无同步服务器。你的标签页永远不会经过我们的服务器。
  - 无遥测。Solamar 没有分析统计，也没有使用情况跟踪。
  - 数据留在你的电脑上。空间、标签页和设置是应用数据文件夹中的一个 JSON 文件。密码和 API 密钥用系统钥匙串加密。导入只读取其他浏览器的文件，隐私空间不向磁盘写入任何内容。
  引擎
  Solamar 基于 castLabs 的 Electron 44.9.3 构建：这是加入了 Google Widevine 模块的 Electron，用于 DRM 视频。要求正式签名的服务（如 Netflix）目前在发布版本中还无法播放。它捆绑 Chromium 152.0.7977.167 和 Node.js 24.22.0。页面由 Chromium 本身完成渲染、沙箱和隔离；Solamar 只是在其外层提供自己的界面，而非自研引擎。
