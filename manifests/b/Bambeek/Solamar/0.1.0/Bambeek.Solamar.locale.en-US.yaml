ReleaseNotes: |-
  The first public release of Solamar, a local-first browser for people leaving Arc (Arc stops on December 22, 2026).
  What's in it
  - Your Arc spaces in one click: spaces with their colors and icons, pinned tabs and folders, read from Arc's sidebar file on your computer. Bookmarks and history from Chrome, Edge, Brave, Firefox and Safari; passwords from a CSV export.
  - Tabs you can tell apart: a top bar with space pills and a row of titled tabs, or Arc's vertical sidebar. Today tabs archive themselves, tabs you don't use go to sleep, split view, a command bar (Ctrl+T).
  - Ad and tracker blocking built in, YouTube included, with a per-site switch.
  - Chrome extensions from the Chrome Web Store, a password vault sealed with your system's keychain (Windows Hello before showing a password), Peek (open links over the page), Boosts (your own colors, fonts and CSS for any site), a mini player, and everything back after a crash.
  - AI, off until you turn it on: a local model through Ollama or Claude with your own API key. Ask about a page, draft replies, or let the agent do it for you on the page, step by step. Claude Code can drive Solamar through a local MCP server.
  - No account, no sync server, no telemetry.
