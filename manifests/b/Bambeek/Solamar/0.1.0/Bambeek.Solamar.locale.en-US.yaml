ShortDescription: A local-first sidebar browser for people leaving Arc.
Description: |-
  The Browser Company ends Arc on December 22, 2026. Solamar keeps what Arc got right, like spaces, a vertical sidebar, pinned tabs and folders, and brings your Arc sidebar over in one click. It also has an ad blocker built in, and an AI agent that stays off until you switch it on. Solamar is free and open source. There is no account and no telemetry.
  Moving out of Arc
  - Arc spaces, one click. Solamar reads the sidebar file Arc keeps on your computer, without changing it. It brings over your spaces with their colors and icons, your pinned tabs and your folders. Nothing is uploaded.
  - Or from another browser. It brings in bookmarks and history from the other browsers on your computer in one click. Passwords come in from the CSV file a browser or password manager exports.
  - Your layout. Keep Arc's vertical sidebar, or switch to a top bar. Every tab shows its title and its own close button.
  What's inside
  - Spaces: Colors, pinned tabs, favorites and nested folders. Today's tabs archive themselves after 12 hours.
  - Command bar: Press Ctrl+T to search, open a site, jump to a tab or run an action. You can change every shortcut.
  - Split view and Peek: Put two pages side by side. Shift+click a link to open it over the page; keep it as a tab or press Esc.
  - Zap and Boosts: Click a banner or popup to remove it for good. Boosts give any site your own colors, fonts and CSS.
  - Ad blocking: On from the first launch, YouTube included. It uses an open-source engine and community filter lists. You can allow a site in one click.
  - Passwords: Solamar offers to save a login when you sign in, and encrypts it with your system's keychain. It fills a password only on the site it belongs to.
  - Chrome extensions: Add extensions from the Chrome Web Store. Before one goes in, Solamar tells you in plain words what it can do.
  - Private spaces: A space that saves nothing: no history, no extensions, and no cookies after you close it.
  - Light on memory: Tabs you have not looked at go to sleep. After a crash, your tabs come back with their history, scroll position and anything you were typing.
  - Mini player: Play, pause and picture in picture for music in another tab, right in the top bar.
  AI, only if you want it
  AI is off until you switch it on. Then you pick what runs each feature:
  - a local model through Ollama, so nothing leaves your computer;
  - or Claude, on your own Anthropic API key, which Solamar keeps in your system's keychain.
  - Do it for me. Tell the agent what to do on the page you are looking at, like filling in a form or collecting every address on a page. It shows each step, and you can stop it any time. It always waits for your click before it pays for anything. It cannot type into password, card or one-time-code fields.
  - Draft a reply. In a mail or chat box, press Ctrl+Shift+Space. It writes the reply in your voice and leaves it for you to send.
  - Ask about a page. Press Ctrl+J to get the gist of a long page or ask a question about it.
  - Better search. Press Tab in the command bar for a sharper search, or ask a question and get the answer in the bar.
  - Tidy tabs. It suggests groups for today's tabs. Nothing moves until you apply them.
  Drive it from Claude Code
  Turn on Settings > Claude Code and Solamar starts an MCP server that only this computer can reach. The settings page shows a claude mcp add line to run once in a terminal. Claude Code can then open tabs, read pages, click and type. It works in its own Claude space, or in tabs you share with it. It follows the same rules as Solamar's own agent: payments wait for your click, and it never types passwords or card numbers. A pill in the top bar shows when it is working, and you can stop it from there.
  A browser, not a service
  - No account. There is nothing to create and nothing to sign in to.
  - No sync server. Your tabs never pass through a server of ours.
  - No telemetry. Solamar has no analytics and no usage tracking.
  - Your data stays on your computer. Spaces, tabs and settings are one JSON file in the app data folder. Passwords and your API key are encrypted with your system's keychain. Imports only read your other browsers' files, and private spaces write nothing to disk.
  Engine
  Solamar is built on castLabs' Electron 44.9.3: Electron with Google's Widevine module added, for DRM video. Services that demand a production signature, like Netflix, do not play in released builds yet. It bundles Chromium 152.0.7977.167 and Node.js 24.22.0. Pages are rendered, sandboxed and isolated by Chromium itself; Solamar adds its own interface around it, not its own engine.
