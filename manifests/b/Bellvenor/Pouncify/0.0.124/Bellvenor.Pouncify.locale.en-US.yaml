ShortDescription: Marketplace alerts for Facebook Marketplace, Craigslist, OfferUp and Kijiji
Description: |-
  Pouncify is a free desktop app that watches the local marketplaces you already use and alerts you within minutes of a fresh listing. It runs on your own computer: no account, no sign-up, and your searches and listings stay on your machine.

  What you get
  - One search covers Facebook Marketplace, Craigslist, OfferUp (United States) and Kijiji (Canada)
  - Alerts minutes after a listing posts, with photo, price and where it is: Telegram, email, Discord, or a push to the free iPhone and Android companion apps
  - Anything people sell locally: furniture, tools, bikes, cameras, PC parts, appliances. Vehicles go deepest, with make, model, year and price history
  - Pouncify sits in the tray and watches while your computer is on

  Free to start. A paid plan with more searches and faster checks is sold at pouncify.com. Support: support@pouncify.com

  Pouncify is made by Bellvenor LLC. It is an independent app, not affiliated with, endorsed by or sponsored by Meta Platforms, craigslist, OfferUp or Kijiji; marketplace names are trademarks of their respective owners.
