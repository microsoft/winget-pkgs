PackageLocale: ko-KR
PackageUrl: https://barbellsoft.com/ko/revive/
ShortDescription: 포맷하라고 뜨는 USB·SD카드에서 파일을 되살리고 드라이브를 고치는 무료 도구
Description: |-
  포맷하라고 뜨거나 RAW로 보이거나 파일이 안 보이는 USB·SD카드를 위한 무료 Windows 도구입니다.
  먼저 드라이브 전체를 이미지 파일로 복사하고, 그 복사본에서 파일을 이름·폴더 그대로(이름이 없으면 파일 서명으로) 되살린 뒤에야 드라이브를 고칩니다.
  드라이브 자체가 고장 난 경우에는 고치지 않고 파일만 꺼낸 뒤 교체를 권합니다.
