ShortDescription: Recover files from a USB drive or SD card that asks to be formatted, then repair the drive
Description: |-
  ReviveUSB is a free Windows tool for USB drives and SD cards that ask to be formatted, show up as RAW, or seem to have lost their files.
  It first copies the whole drive to an image file, recovers your files from that copy with their names and folders (or by file signature when names are gone), and only then repairs the drive.
  If the drive itself is failing, it does not try to repair it: it gets your files out and tells you to replace the drive.
  It needs administrator rights to read the drive directly, so Windows asks for permission when it starts.
