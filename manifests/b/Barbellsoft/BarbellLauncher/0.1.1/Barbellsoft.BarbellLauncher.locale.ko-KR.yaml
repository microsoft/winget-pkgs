ShortDescription: 앱 실행·계산·날짜·내 바로가기를 키보드로 여는 무료 런처
Description: |-
  Barbell Launcher는 Windows용 무료 런처입니다. 어디서든 Alt+Space를 누르고 몇 글자 입력한 뒤 Enter를 누르면 됩니다.
  시작 메뉴와 Microsoft Store 앱을 실행하고, 계산 결과와 날짜를 복사하고, 웹사이트·폴더·파일에 붙인 내 키워드를 열고, 저장한 글을 입력하던 자리에 붙여 넣습니다.
  추가한 내용은 PC에만 저장하며, 스스로 인터넷에 연결하지 않습니다.
