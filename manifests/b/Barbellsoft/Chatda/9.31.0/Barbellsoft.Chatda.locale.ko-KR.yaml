ShortDescription: 파일 이름과 문서 안의 글자로 파일을 찾는 무료 검색 프로그램
Description: |-
  Chatda(찾다)는 Windows·macOS용 무료 데스크톱 검색 프로그램입니다. PC·외장 드라이브·네트워크 폴더(NAS)의 파일을 이름과 문서 안의 글자(TXT·MD·CSV·DOCX·XLSX·PPTX·PDF·HWPX)로 찾습니다.
  Windows 에서는 NTFS 파일 목록을 읽어 고정 드라이브 전체를 색인하고, 새 파일도 몇 초 안에 검색됩니다.
