ShortDescription: Search files by name and by the text inside documents
Description: |-
  Chatda is a free desktop search tool for Windows and macOS. It finds files on your PC, external drives and network folders (NAS) by name and by the text inside documents (TXT, MD, CSV, DOCX, XLSX, PPTX, PDF, HWPX).
  On Windows it indexes whole fixed drives by reading the NTFS file table, and new files show up in search within seconds.
