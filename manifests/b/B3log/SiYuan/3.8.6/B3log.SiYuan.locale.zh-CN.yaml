ReleaseNotes: |-
  概述
  本版本进一步完善思维导图和数据库日历，增加编辑流程的自定义选项，改善移动端交互和窗口管理，并新增工作空间容量统计。同时，性能、AI、MCP 和插件能力也得到进一步提升。
  编辑、思维导图与数据库
  思维导图新增专用块类型和括号概要，节点编辑和展开控制也得到完善。数据库日历支持 ISO 周数、按周导航和安排未设置日期的条目，数据库视图新增条件颜色。命令面板可以插入块、资源和引用，右键菜单快捷键也可以自定义。
  移动端、窗口管理与性能
  移动端编辑器新增可选的斜线命令搜索，命令面板的打开更加方便，思维导图也支持双指缩放。新窗口布局可以保存和恢复，工作空间容量统计便于了解空间使用情况。启动、同步、长文档编辑、索引恢复、Markdown 解析和大型表格渲染等方面的性能也得到优化。
  AI 与扩展能力
  内置 MCP 服务支持 OAuth 2.1，工作空间中的 AGENTS.md 文件可以为 AI 智能体提供自定义指令。智能体和 MCP 工具支持管理集市包，插件则新增发布资源目录声明和支持灵活匹配的资源选择器。
  变更记录
  以下是此版本中的详细变更。
  改进功能
  - 支持保存和恢复新窗口布局
  - 支持双击父文档标题打开文档
  - 支持按层级展开列表思维导图
  - 改进大纲展开控制，将其集中到层级菜单中
  - 改进过时安装包的清理
  - 改进块别名输入
  - 改进模板管理交互
  - 改进复制混有嵌入块的文本
  - 支持通过快捷键切换任务列表的两种状态
  - 改进索引恢复和重建时的内存占用
  - 改进思维导图节点的内容编辑支持
  - 改进日历视图的边框和圆角
  - 支持专用的思维导图块和思维导图条目块类型
  - 支持在移动端点击父文档标题展开或折叠子文档
  - 支持在日历视图中显示 ISO 周数和按周导航
  - 改进日历视图模式在重启后的保留
  - 支持将收集箱条目插入当前文档
  - 支持在日历视图中为未设置日期的条目安排日期
  - 改进浏览器扩展剪藏弹窗中保存路径的显示速度
  - 改进全局引用排序和传递反链显示
  - 支持工作空间容量统计
  - 改进原位编辑时嵌入块工具栏的可见性
  - 改进列表项转换为文档时的结构保留
  - 支持从命令面板插入块、资源和引用
  - 改进高度设置菜单的一致性
  - 改进粘贴从豆包复制的内容
  - 支持在图片和 PDF 导出中包含 JavaScript 嵌入块
  - 支持列表项的批量标题转换
  - 改进移动端编辑时打开命令面板的交互
  - 支持在移动端编辑器中按需启用可搜索的斜线命令
  - 改进启动和云同步处理
  - 支持自定义右键菜单快捷键
  - 支持 PlantUML 图表的图片预览
  - 改进数据同步期间窗口启动的响应速度
  - 改进数据库关联字段中的主键显示模板
  - 改进持续编辑长文档时的内存占用
  - 改进 Markdown 解析性能
  - 支持在移动端通过双指缩放思维导图
  - 支持内置 MCP 服务使用 OAuth 2.1
  - 支持思维导图块中的括号概要
  - 改进锁定云端同步目录失败时的错误详情
  - 支持通过工作空间 AGENTS.md 自定义 AI 智能体指令
  - 改进没有子块的标题的折叠指示器
  - 支持创建文档引用时选择保存位置
  - 支持数据库视图中的条件颜色
  - 改进新窗口行为，关闭最后一个页签后保持窗口打开
  - 改进数据库关联选择中的字段可见性和列宽
  - 支持按 ID 搜索本地数据快照
  - 支持在智能体和 MCP 中管理集市包
  - 改进大型表格渲染性能
  - 支持自动 RTL/LTR 文本方向
  修复缺陷
  - 块选择模式下插入块后输入会返回前一个块
  - 从数据库单元格和属性面板打开本地文件链接的行为不一致
  - 移动端输入时块图标闪烁
  - 使用全局锚文本排序时反链面板持续刷新
  - 将 HTML 富文本粘贴到表格单元格时丢失格式
  - Responses 消息 ID 缺少 msg_ 前缀时智能体对话失败
  - 删除绑定到分组数据库的块时触发事务 panic
  - 在数据库搜索框中按 Enter 会插入换行
  - Android 上插入行时出现表格单元格编辑器界面文本
  - 一些安全漏洞
  - 发布服务中的文档题头图无法加载
  - 搜索候选项达到结果上限时提及不完整
  - 平板上蓝牙键盘输入失败
  重构
  - 升级 abcjs 6.7.0 到 6.7.1
  - 升级至 Electron v44.4.5
  开发者
  - 改进思维导图主题自定义和交互反馈
  - 支持插件发布资源的目录声明
  - 支持具有灵活匹配能力的插件资源选择器
  - 改进内置题头图选择器的滚动
