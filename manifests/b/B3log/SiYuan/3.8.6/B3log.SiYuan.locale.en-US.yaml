ReleaseNotes: |-
  Overview
  This release expands mind maps and database calendars, adds more ways to customize editing workflows, improves mobile interactions and window management, and introduces workspace storage statistics. It also brings performance improvements and new capabilities for AI, MCP, and plugins.
  Editing, mind maps, and databases
  Mind maps now have dedicated block types, bracket summaries, and improved node editing and expansion controls. Database calendars support ISO week numbers, week navigation, and scheduling undated items, while database views gain conditional colors. The command panel can insert blocks, assets, and references, and context menu shortcuts can be customized.
  Mobile, window management, and performance
  Mobile editing gains optional searchable slash commands, easier Command Palette access, and pinch-to-zoom for mind maps. New window layouts can be saved and restored, and workspace storage statistics help you see how space is used. Startup, synchronization, long document editing, index recovery, Markdown parsing, and large table rendering are improved.
  AI and extensibility
  The built-in MCP server now supports OAuth 2.1, and workspace AGENTS.md files can provide custom instructions for the AI agent. Agent and MCP tools can manage Bazaar packages, while plugins gain directory declarations for publish resources and an asset picker with flexible matching.
  Changelogs
  Below are the detailed changes in this version.
  Enhancement
  - Support saving and restoring new window layouts
  - Support double-clicking parent document titles to open them
  - Support expanding list mind maps by level
  - Improve outline expansion controls by grouping them in the level menu
  - Improve cleanup of outdated installer packages
  - Improve block alias input
  - Improve template management interactions
  - Improve copying text mixed with embedded blocks
  - Support two-state task list toggling via keyboard shortcuts
  - Improve memory usage during index recovery and rebuilding
  - Improve content editing support in mind map nodes
  - Improve calendar view borders and rounded corners
  - Support dedicated mind map and mind map item block types
  - Support expanding or collapsing child documents by tapping a parent title on mobile
  - Support ISO week numbers and week navigation in calendar views
  - Improve calendar view mode persistence across restarts
  - Support inserting inbox items into the current document
  - Support scheduling undated items in calendar views
  - Improve save path display speed in the browser extension clipping popup
  - Improve global reference sorting and transitive backlink display
  - Support workspace storage statistics
  - Improve embed block toolbar visibility during in-place editing
  - Improve preservation of list item structure when converting to a document
  - Support inserting blocks, assets, and references from the command panel
  - Improve consistency of height setting menus
  - Improve pasting content copied from Doubao
  - Support JavaScript embeds in image and PDF exports
  - Support batch heading conversion for list items
  - Improve command palette access while editing on mobile
  - Support opt-in searchable slash commands in the mobile editor
  - Improve startup and cloud sync handling
  - Support customizable context menu shortcuts
  - Support image preview for PlantUML diagrams
  - Improve window startup responsiveness during data synchronization
  - Improve primary key display templates in database relation fields
  - Improve memory usage during continuous editing of long documents
  - Improve Markdown parsing performance
  - Support pinch-to-zoom for mind maps on mobile
  - Support OAuth 2.1 for the built-in MCP server
  - Support bracket summaries in mind map blocks
  - Improve error details when locking the cloud sync directory fails
  - Support custom AI agent instructions with workspace AGENTS.md
  - Improve fold indicators for headings without child blocks
  - Support choosing a save location when creating a document reference
  - Support conditional colors in database views
  - Improve new window behavior by keeping it open after the last tab closes
  - Improve database relation selection field visibility and column widths
  - Support searching local data snapshots by ID
  - Support Bazaar package management in Agent and MCP
  - Improve large table rendering performance
  - Support automatic RTL/LTR text direction
  Bugfix
  - Typing returns to the previous block after inserting a block in block selection mode
  - Local file links fail to open consistently from database cells and attribute panels
  - Block icon flickers while typing on mobile
  - Backlink panel refreshes continuously with global anchor sorting
  - Pasting HTML rich text into table cells loses formatting
  - Agent conversations fail when Responses message IDs lack the msg_ prefix
  - Deleting a block bound to a grouped database triggers a transaction panic
  - Pressing Enter inserts line breaks in the database search box
  - Table cell editor UI text appears when inserting rows on Android
  - Some security vulnerabilities
  - Document title images fail to load in the publishing service
  - Mentions are incomplete when search candidates reach the result limit
  - Bluetooth keyboard input fails on tablets
  Refactor
  - Upgrade abcjs 6.7.0 to 6.7.1
  - Upgrade to Electron v44.4.5
  Development
  - Improve mindmap theme customization and interaction feedback
  - Support directory declarations for plugin publish resources
  - Support plugin asset picker with flexible matching
  - Improve scrolling in the built-in cover picker
