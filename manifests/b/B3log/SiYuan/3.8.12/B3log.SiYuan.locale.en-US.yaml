ReleaseNotes: |-
  Upgrade notice
  Plugins that rely on the desktop main menu’s previous identifier, barWorkspace, should use barMainMenu for the button ID and menu events. Details
  Overview
  This release adds manual ordering for sibling tags and sorting by most recent addition in the tag panel. Mobile image preview gestures and controls are improved, and asset files can now be shared from mobile.
  The desktop Markdown editor supports relative document links, and database cell editors are better aligned. This release also adds a Vietnamese interface and a built-in Russian user guide, and introduces the official SiYuan connector for WorkBuddy.
  Watch the release overview: YouTube
  Changelogs
  Below are the detailed changes in this version.
  Enhancement
  - Support manual sorting of sibling tags in the tag panel
  - Support sorting the tag panel by most recent addition
  - Improve sync reliability when putFile writes overlap snapshot indexing
  - Support relative document links in the desktop Markdown editor
  - Improve database cell editor alignment
  - Support Vietnamese interface language
  - Support in-process OCR in dynamically linked Linux builds
  - Improve mobile image preview gestures and controls
  - Add official SiYuan connector for WorkBuddy
  - Support sharing asset files on mobile
  - Support AI provenance in block attributes
  Bugfix
  - SiYuan may exit during startup on iOS
  Document
  - Add a built-in Russian user guide
  Refactor
  - Upgrade to Electron v44.11.5
  Development
  - Improve naming consistency for the desktop main menu
