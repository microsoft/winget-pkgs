ReleaseNotes: |-
  升级须知
  本版本会自动将笔记本迁移到新的文档标题模式，支持文档标题包含 /。
  使用新版打开工作空间前，请先退出所有旧客户端，将访问或同步同一份数据的全部设备统一升级；离线设备也须先升级再连接，并在升级前确认插件兼容。
  迁移后，请勿再使用旧版本打开、编辑、恢复或同步同一数据，以免修改被覆盖、丢失并经同步传播。旧版拒绝打开部分文档，并不代表整个笔记本已受保护。详见兼容性说明。
  概述
  本版本支持文档标题包含 /，并改进思维导图、数据库自动化、移动端编辑和文件变更检测。
  思维导图与编辑
  思维导图新增主题、全局样式、节点选择和剪贴板操作，改进概要创建和列表式编辑交互。
  表格支持调整行高，并改进单元格激活、文本格式设置性能，以及 Markdown 列表的复制和导出。
  数据库与导航
  数据库自动化支持收集块引用、按属性名子串和正则表达式匹配，并支持限制子文档深度。
  反链支持按数据库字段筛选，新建数据库条目后可配置打开方式，移动端支持在文档底部显示反链。
  平台与可靠性
  改进 iOS 文本选择和编辑、移动端搜索导航、同步进度和取消操作，以及快照、同步和恢复的文件变更检测。
  新增 Windows 标题栏覆盖层、macOS 系统代理检测、TIFF 预览和自定义锁屏壁纸，同时更新运行时和 CA 证书。
  变更记录
  以下是此版本中的详细变更。
  改进功能
  - 改进复制和导出时的 Markdown 列表格式
  - 支持文档标题包含 /
  - 改进编辑、数据库视图和搜索性能
  - 支持隐藏嵌入块面包屑中的父级路径
  - 支持置顶智能体会话
  - 支持在各平台最大化和还原 PDF 面板
  - 支持选择、复制、剪切和粘贴思维导图节点
  - 改进思维导图工具栏分组和窄屏布局
  - 改进表格单元格激活和右键菜单
  - 改进思维导图概要连线和创建预览
  - 支持将文档页签移回主窗口
  - 支持关闭最后一个页签时关闭独立窗口
  - 改进粘贴表格中的文本格式设置性能
  - 支持限制数据库自动化范围中的子文档深度
  - 支持在移动端文档底部显示反链
  - 改进同步应用数据的进度显示和取消操作
  - 支持 TIFF 图片预览
  - 改进数据库自动收集，支持属性名子串和正则表达式匹配
  - 支持清空最近打开的文档记录
  - 改进鼠标侧键导航
  - 支持自定义锁屏壁纸
  - 支持思维导图主题和全局样式
  - 支持检测 macOS 系统网络代理
  - 支持按数据库字段筛选反链
  - 改进基于选中节点创建思维导图概要
  - 支持调整表格行高
  - 改进块引用与行内代码格式的组合使用
  - 改进浮动侧栏展开时停靠栏的可见性
  - 改进移动端搜索结果导航和关键词高亮
  - 改进加载指示器，采用支持主题自定义的渐隐圆环
  - 改进内部预览的资源链接解析
  - 改进快照、同步和恢复的文件变更检测
  - 改进 iOS 文本选择和编辑
  - 支持 Windows 标题栏覆盖层
  - 支持配置创建数据库条目后的打开方式
  - 改进思维导图中的列表式编辑交互
  - 支持通过数据库自动化收集块引用
  - 改进粘贴和导入时的 LaTeX 公式分隔符兼容性
  - 支持 AI 智能体提取 PDF 内嵌图片
  修复缺陷
  - 复制代码块时围栏短于内容中的反引号序列
  - 动态块引用文本中包含行内备注内容
  开发重构
  - 统一工作空间指令存储，改进 AI 数据存储一致性
  - 升级 Electron、Go 和 CA 证书，撤销对受损 eMudhra 中间证书的信任
  - 使用纯 Go 实现改进 Android 文件遍历和诊断
