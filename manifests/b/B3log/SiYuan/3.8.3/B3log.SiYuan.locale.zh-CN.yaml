ReleaseNotes: |-
  概述
  本版本进一步完善了文档与数据库操作，优化了移动端和跨平台体验，并增强了 AI、命令面板、集市及插件相关功能。
  编辑、文档与数据库
  拖动时的滚动、键盘选块、标签页容器、文档与笔记本排序、从模板创建子文档树等功能得到改进，数据库还支持上下文筛选和模板字段值处理，让编辑和整理更加高效。
  移动端与跨平台体验
  移动端的 PDF 批注、导航、侧栏、块选择、键盘与文本选择、图片查看、安全区域适配和工作空间交互得到优化。桌面端新增远程内核连接，数据同步支持按需下载资源；同时停止支持 macOS 12，并升级至 Electron 44.2.0。
  AI、集成与可扩展性
  智能体会话和模型配置得到改进，支持非 OpenAI 提供商使用 Responses API 和加载 Skill 资源，并完善了命令面板、MCP、集市及插件 API，为 AI 和插件扩展提供更好的基础。
  变更记录
  以下是此版本中的详细变更。
  改进功能
  - 支持在拖动文档树时使用滚轮滚动位置
  - 支持在拖动编辑器时使用滚轮滚动位置
  - 支持在移动端内部打开并批注 PDF 资源
  - 改进 code、tag 和 kbd 元素的换行行为
  - 数据库文本字段支持块元素和行级元素
  - 改进固定文档标签页的拖动
  - 改进调整窗口大小时停靠面板的响应
  - 支持使用模板渲染数据库字段值
  - 改进选择工具栏中的外观面板交互
  - 支持在选择工具栏中控制行级文本方向
  - 改进 Ctrl+F 和 Ctrl+P 之间的已保存搜索路径处理
  - 支持设置行级文本的字体系列
  - 支持标签页容器块
  - 支持从模板创建子文档树
  - 通过可见性控制和拖放重新排序改进顶栏自定义
  - 支持桌面端连接到远程内核
  - 改进键盘选择块和批量操作
  - 通过忽略代码元素内的 HTML 注释改进网页剪藏
  - 支持加载内置 Skill 资源文件
  - 改进移动端块引用提示的位置和编辑体验
  - 闪念速记简写选择已锁定的加密笔记本作为默认目标
  - 支持统一命令注册表和命令面板基础
  - 改进内核退出代码 26 的文件系统错误提示
  - 改进从只读源复制外观资源
  - 改进集市包元数据和资源处理
  - 改进集市插件生命周期同步
  - 改进集市浏览和包管理
  - 改进公共集市索引中已下架包的筛选
  - 通过共享快捷键改进所见即所得和导出预览模式切换
  - 通过 models.dev 和本地回退改进 AI 模型上下文元数据更新
  - 允许自定义模型名称以改进 AI 模型配置
  - 移除 config-wrap 并使所有配置项适配窄屏
  - 改进导入 .sy.zip 时的文档排序位置
  - 改进新建笔记本和用户指南的位置，使其遵循 CreateDocAtTop
  - 改进 iOS 对边到边底部内容的安全区域适配
  - 改进错误窗口，通过可点击链接打开 workspace/temp/siyuan.log
  - 改进平板电脑上的文本选择工具栏和上下文菜单行为
  - 改进模板自引用 ID 重映射
  - 改进包含现有备注的选区中的行级备注编辑
  - 支持在移动端始终定位已打开的文档
  - 改进打开键盘时移动端底部栏的隐藏
  - 改进冷启动引导窗口渲染
  - 改进账号密码更改后的发布会话失效处理
  - 改进集市前端兼容性标签以区分所有前端类型
  - 改进原生输入上下文菜单
  - 改进删除数据库块后的光标保留
  - 改进数据同步后已删除笔记本残留的处理
  - 改进 MCP SQL 查询结果中默认行数限制的可见性
  - 支持将笔记本 .sy.zip 压缩包导入为子文档
  - 改进从右侧栏退出移动应用
  - 改进自动标题编号的对齐
  - 支持将文档从文档树移动到标签页
  - 改进编辑器内容宽度调整以防止回弹动画
  - 支持数据库块的上下文筛选
  - 改进移动端启动期间的编辑器字体加载
  - 支持非 OpenAI 提供商使用 Responses API
  - 改进忽略路径上的文件写入 API 数据同步调度
  - 改进跨块边界的方向键导航
  - 支持从关于设置查看变更记录
  - 支持在删除前可选地检查块引用
  - 改进与不支持独立 SSE 的 MCP 服务器的兼容性
  - 支持从大纲批量转换标题级别
  - iOS 上嵌套子菜单被裁剪或位置错误
  - 改进设置对话框拖动区域
  - 移动端键盘打开时外观设置输入框移到顶部
  - 改进移动端多块选择
  - 支持在非自定义排序的文档列表中创建同级文档
  - 支持配置全局默认字体
  - 支持数据同步期间按需下载资源
  - 支持在图片查看器中复制图片并改进工具栏可见性
  - 改进窄宽度下 Agent 侧栏控件
  - 改进从网页和办公应用粘贴时的 HTML 格式化
  - 改进连续按 Backspace 删除后跨块合并的响应速度
  - 支持带源代码编辑和预览的模板管理器
  - 改进启用排序规则时数据库视图中的手动重新排序
  - 改进云端账号认证失败后的自动注销
  - 改进启用排序规则时文档树中的手动重新排序
  移除功能
  - 不再支持 macOS 12
  修复缺陷
  - 跨窗口拖动子块后超级块仍然存在
  - 每日笔记子菜单中的 SVG 默认笔记本图标过大
  - 文档树拖放排序后，被 MaxListCount 隐藏的文档自定义顺序被重置
  - 笔记本拖放排序后，已关闭笔记本丢失自定义排序位置
  - 行级格式破坏标注块标题布局和内容完整性
  - 通过自定义配置隐藏所有条目后停靠栏仍然可见
  - 折叠的停靠面板有时仍保留宽度
  - 切换回刚命名的文档后大纲停靠面板显示 Untitled
  - 从空文档删除所有选中内容后后续输入丢失
  - MCP 文档搜索返回空的文档 ID 和名称
  - MCP SQL 结果列与标题未对齐
  - S3 同步和云端快照操作在 COS 上因 404 NoSuchKey 失败
  - 特定表格右下角为直角
  - 符号链接目录下的工作空间中自定义图标和挂件加载失败
  开发重构
  - 升级 Electron 至 v44.2.0
  开发者
  - 支持可扩展的自定义块
  - 当标签包含嵌套行级格式时，getBlockKramdown 会添加额外的标签分隔符
  - 支持 Protyle API 中稳定的 DOM 范围跟踪
  - 支持插件命令使用统一的执行上下文
  - 支持 addToolbarItem 和 removeToolbarItem 插件 API 以及空值安全的键位映射渲染
  - 改进导入通知，使用专用事件替代 filetreeSortChanged
  - 改进 onDataChanged 以处理其他前端实例对插件存储的更改
