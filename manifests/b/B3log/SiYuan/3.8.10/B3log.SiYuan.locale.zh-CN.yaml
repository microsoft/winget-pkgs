ReleaseNotes: |-
  概述
  本版本新增富文本文档标题、数据库子条目与关联视图、工作空间级 AI 长期记忆，以及内置轻量级 Markdown 编辑器。
  文档树改进大型目录的浏览性能，统一的文档和块面包屑让导航更加一致。其他改进包括移动端底部面板、模板 HTTP 请求、自定义 PDF 页面尺寸、局域网同步地址选择和集市兼容性筛选。
  变更记录
  以下是此版本中的详细变更。
  改进功能
  - 支持统一的文档和块面包屑
  - 支持富文本文档标题并保留笔记本名称中的斜杠
  - 改进文档树浏览性能和大型目录访问
  - 支持在外观方案中配置面包屑按钮的可见性和顺序
  - 支持将嵌入块转换为普通块或块引用
  - 支持为内置网页搜索配置 Exa API 密钥
  - 支持数据库子条目
  - 支持在模板中发送 HTTP 请求
  - 支持工作空间级 AI 长期记忆
  - 改进思维导图概要输入框尺寸、对齐和颜色
  - 改进 Android 全面屏导航栏适配
  - 改进浮动窗口调整大小的响应速度
  - 改进包含单引号文本的关键词搜索
  - 支持自定义 PDF 页面尺寸
  - 改进移动端通过更多菜单撤销和重做的操作
  - 支持配置浮动停靠栏的可见性
  - 支持视频块循环播放
  - 支持内置轻量级 Markdown 编辑器
  - 支持通过命令行选项禁用固定端口代理
  - 改进多行表头创建
  - 使用底部面板改进移动端对话框的一致性
  - 改进标签删除，支持选择移除自动收集的数据库条目
  - 支持在条目详情中显示关联数据库视图
  - 改进多网卡和 VPN 环境下的局域网同步地址选择
  - 支持集市包兼容性筛选和按首次发布时间排序
  开发重构
  - 将桌面端 Electron 主进程迁移为严格模式的 TypeScript 模块
  开发者
  - 支持通过插件 API 打开文档和笔记本菜单
