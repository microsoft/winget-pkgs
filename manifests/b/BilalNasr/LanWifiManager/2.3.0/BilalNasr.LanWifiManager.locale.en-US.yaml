ShortDescription: Switches your traffic from LAN to Wi-Fi when the wired connection stops working or gets poor, and back when it recovers.
Description: |-
  LAN Wi-Fi Manager is for computers connected by both a LAN cable and Wi-Fi.
  Every 30 seconds by default it tests the internet through each adapter (several pings and a DNS test) and rates each link Good, Degraded or Down.
  A dead LAN switches traffic to Wi-Fi, a poor LAN switches only if the Wi-Fi is better, and traffic goes back to the LAN once it is healthy again.
  Both adapters stay connected: the app only changes the interface metric, so switching is instant. When you quit, it turns Windows' automatic metrics back on (a setting, on by default).
  It also has manual Use LAN / Use Wi-Fi / Toggle modes, a Status tab with latency, packet loss, jitter and DNS for both links, a Resources tab (CPU, memory, GPU, network, disk and a process list, plus Startup apps and Services views to turn startup apps on or off and start, stop or restart services), live download/upload speed next to the tray icons, start at login and a daily log.
  The app needs administrator rights to change the network priority: it starts without them and asks for elevation (UAC) when launched.
  It is not code-signed. No telemetry and no account; it only contacts your ping targets, your adapters' DNS servers and, for update checks that can be turned off, the GitHub API.
  The app adds its own Start menu shortcut the first time it runs. Before uninstalling, quit it from the tray and turn off 'Show in the Start menu and Windows search' and 'Start with Windows' in its settings, or the shortcut and the start-at-login task stay behind.
  Update it with 'winget upgrade BilalNasr.LanWifiManager' (quit the app first). When the app was installed by winget, it does not replace its own exe: Settings > Updates & about tells you a new version is out and offers to copy this command.
