ReleaseNotes: |-
  - Improved video speed settings: added preview (playback) support.
  - Added a file adding order option (by file name / date created / date modified).
  - Improved AV1 video decoding compatibility and performance.
  - Improved stability when initializing codec information navigation.
  - Bugs fixed
    - Fixed a bug where uploading to Vimeo failed
    - Crash caused by a surge in memory usage during conversion.
    - Improved seeking performance in preview (playback).
    - Output file dates differed from the original when using "Preserve creation date/time" (Encoding/High-Speed mode).
    - Incorrect numbering in output file names when encoding multiple files separately.
    - Thumbnails not displayed correctly after adding files.
    - Error during High-Speed mode processing of certain H.264 files.
    - No sound in preview for videos with unsupported audio.
