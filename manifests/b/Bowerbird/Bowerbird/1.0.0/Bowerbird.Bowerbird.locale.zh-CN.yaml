ShortDescription: 注重隐私的本地优先桌面应用，用于浏览、标记和评分电脑中已有的图片。
Description: |-
  Bowerbird 是一款桌面应用，用于浏览、标记和评分你已经拥有的图片。它本地优先：无需账号、不依赖云端，你的私人文件始终留在原处。

  添加文件夹，查看其中全部内容。
  - 选择电脑或外接硬盘中的任意文件夹，Bowerbird 就在原处读取它。
  - 其中所有图片（含子文件夹）显示在一个网格中，每张图保持自己的比例，不会被裁切。
  - 随手为图片添加标签与星级，之后用搜索、筛选和智能文件夹重新找到它们。

  为快速处理大量图片而设计
  - 按 1 到 5 为所选图片评分，按 0 清除评分；可以整批选中一次性打分。
  - 带颜色的标签，边输入边查找，也能就地新建；可以一次为整个选区添加。
  - 按文件名、文件夹和标签搜索，并按标签、文件类型、方向与评分进一步筛选。
  - 把任意搜索保存为智能文件夹，随时再次打开并修改。
  - 提供“未标记”和“未评分”两个视图，用来处理还没整理的图片。
  - 缩略图在后台生成，优先处理屏幕上的图片，因此滚动依然流畅。
  - 支持多个资料库，工作与生活分开，每个资料库都有自己的文件夹、标签、评分和智能文件夹。
  - 可选浅色、灰色或深色主题，也可以跟随系统。
  - Bowerbird 绝不移动、重命名、复制或删除你的图片。评分与标签保存在它自己的资料库中，并绑定到图片本身而非路径，移动或重命名后依然保留。

  支持 JPEG、PNG、GIF、WebP、AVIF、BMP、TIFF 与 HEIC/HEIF。不使用 AI，图片也不会被发送给任何 AI 服务。
