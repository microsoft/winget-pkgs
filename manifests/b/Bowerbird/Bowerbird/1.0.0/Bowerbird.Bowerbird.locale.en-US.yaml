ShortDescription: Private, local-first desktop app for browsing, tagging and rating the images on your computer.
Description: |-
  Bowerbird is a desktop app for browsing, tagging and rating the images you already have. It is local-first: no account, no cloud, and your private files stay exactly where they are.

  Add a folder. See everything. Sort through it.
  - Pick any folder on your computer or an external drive, and Bowerbird reads it where it is.
  - Everything inside, subfolders included, shows in one grid, each image at its own shape and never cropped.
  - Give images tags and stars as you go, then find them again with search, filters and smart folders.

  Built for going through a lot of images quickly
  - Press 1 to 5 to rate the selected images, and 0 to clear. Select a whole shoot and rate it in one go.
  - Colored tags you type to find, or create on the spot. Add them to a whole selection at once.
  - Search file names, folders and tags, then narrow it down by tag, file type, orientation or rating.
  - Save any search as a smart folder, and open it later.
  - Two views of everything you haven't sorted yet: Untagged and Unrated.
  - Thumbnails are made in the background, the ones on screen first, so scrolling stays quick.
  - Keep work and personal apart. Each library has its own folders, tags, ratings and smart folders.
  - Pick a light, grey or dark theme, or let Bowerbird follow your system.
  - Bowerbird never moves, renames, copies or deletes your images. Ratings and tags live in its own library, and they belong to the image rather than its path, so they follow it when you move or rename it.

  It opens JPEG, PNG, GIF, WebP, AVIF, BMP, TIFF and HEIC/HEIF. It uses no AI, and your images are never sent to an AI service.
