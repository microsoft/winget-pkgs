Description: |-
  BlackBox 组件构建器是一款开源的集成开发环境与框架（模块的集合），使用 Component Pascal 语言开发，该语言是 Niklaus Wirth 所设计的 Oberon-2 语言的超集。
  BlackBox 提供文档创建、程序编译、模块执行与界面设计等功能，是面向 Windows 操作系统的 Win32 应用程序。
