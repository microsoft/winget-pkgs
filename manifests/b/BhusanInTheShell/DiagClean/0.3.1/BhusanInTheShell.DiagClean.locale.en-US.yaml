PackageIdentifier: BhusanInTheShell.DiagClean
PackageVersion: 0.3.1
PackageLocale: en-US
Publisher: BhusanInTheShell
PackageName: DiagClean
License: MIT
ShortDescription: Diagnostics, cleanup, uninstall, optimize, disk analysis, and status for helpdesk technicians
Description: >-
  DiagClean is a single, focused utility for Windows and macOS helpdesk/IT support
  technicians. It collects a hardware/disk/event-log/software/network diagnostic report
  (HTML and/or PDF) in one pass; includes a safety-first temp/browser-cache cleanup tool
  with mandatory dry-run preview, protected-path whitelisting, and an audit log of every
  run; an app uninstaller that also removes leftover caches/preferences/logs; a system
  optimizer for common fixes (DNS flush, icon/font cache, stuck services); an
  interactive disk usage browser; and a live CPU/memory/disk/network/battery dashboard.
Tags:
  - helpdesk
  - diagnostics
  - sysadmin
  - cleanup
  - uninstaller
  - disk-usage
