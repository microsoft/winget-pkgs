PackageIdentifier: BhusanInTheShell.DiagClean
PackageVersion: 0.1.0
PackageLocale: en-US
Publisher: BhusanInTheShell
PackageName: DiagClean
License: MIT
ShortDescription: Diagnostic collector + safe cleanup tool for helpdesk technicians
Description: >-
  DiagClean is a single, focused utility for Windows and macOS helpdesk/IT support
  technicians. It collects a hardware/disk/event-log/software/network diagnostic report
  (HTML and/or PDF) in one pass, and includes a safety-first temp/browser-cache cleanup
  tool with mandatory dry-run preview, protected-path whitelisting, and an audit log of
  every clean run.
Tags:
