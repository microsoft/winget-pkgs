ShortDescription: Native Kubernetes desktop client
Description: >-
  Kubyl is a free, native Kubernetes desktop client for macOS, Windows and Linux, built in Rust
  on GPUI. It covers what k9s and the Kubernetes Dashboard do, plus selected OpenShift console
  features, in a fast, keyboard-first window with a command palette for clusters, namespaces
  and resources.
