ShortDescription: Desktop photo manager and image editor with non-destructive RAW development.
Description: |-
  FerrumPix is a desktop photo manager and image editor. Browse your folders, sort and rate what is in them, look at photos, and edit them in one application that runs entirely on your own machine. It can also connect to a self-hosted Immich or Nextcloud server.

  It puts photo management, non-destructive RAW development, pixel editing, local folders and direct access to Immich and Nextcloud into one native application, and is built for hobby photographers and enthusiasts rather than studio pipelines.

  What you can do with it:
  - Browse local photo folders with fast thumbnails, ratings, favourites, keywords and saved searches.
  - View photos and videos fullscreen, compare them side by side, and check metadata and histograms.
  - Edit with crop, resize, rotate and distort, exposure and colour, curves, filters, masks, retouching, text and shapes, and layers.
  - Develop RAW files from the sensor data, including Sigma X3F and compressed DNGs, with lens correction measured for more than 1500 lenses.
  - Run batch work over a whole selection: rename, convert, resize, watermark, filters, metadata and export.
  - Open JPEG, PNG, WEBP, JPEG XL, TIFF, BMP, GIF and RAW, plus HEIC, HEIF, AVIF, JPEG 2000, OpenEXR and Radiance HDR read-only, and Photoshop files with their layers.
  - Find the people in your photos and search by them, or search by where a photo was taken, entirely on your own machine.
  - Connect to your own Immich or Nextcloud server for browsing, upload, download, editing and metadata sync.
  - Use FerrumPix in a web browser while it runs on the computer where your photos are.

  Originals are never changed behind your back, and nothing is written until you save. Edits to a RAW or Photoshop file go into a sidecar beside it, and a RAW sidecar can hold several variants of the same edit. Twenty-one interface languages are built in.
