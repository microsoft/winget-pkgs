PackageIdentifier: Bitpainter75.FerrumPix
PackageVersion: 0.9.91-1
PackageLocale: zh-CN
ShortDescription: 具备无损 RAW 开发功能的桌面照片管理与图片编辑应用。
Description: |-
  FerrumPix 是一款桌面照片管理与图片编辑应用。你可以在同一程序中浏览本地文件夹、整理和评分照片、查看照片并进行编辑，所有处理都在自己的电脑上完成；它还可以连接自托管的 Immich 或 Nextcloud 服务器。

  它把照片管理、无损 RAW 开发、像素级编辑、本地文件夹以及对 Immich 和 Nextcloud 的直接访问整合为一个原生应用，面向摄影爱好者而非工作室流水线。

  主要能力：
  - 使用快速缩略图、评分、收藏、关键词和已保存搜索浏览本地照片文件夹。
  - 全屏查看照片与视频，并排对比，查看元数据和直方图。
  - 编辑功能包括裁剪、缩放、旋转与变形、曝光与色彩、曲线、滤镜、蒙版、修饰、文字与形状、图层。
  - 基于传感器数据开发 RAW 文件，支持 Sigma X3F 与压缩 DNG，并内置 1500 多种镜头的实测校正。
  - 对整个选区执行批量处理：重命名、转换、缩放、水印、滤镜、元数据与导出。
  - 打开 JPEG、PNG、WEBP、JPEG XL、TIFF、BMP、GIF 和 RAW，只读支持 HEIC、HEIF、AVIF、JPEG 2000、OpenEXR 与 Radiance HDR，以及带图层的 Photoshop 文件。
  - 在本地识别人物并按人物或拍摄地点搜索照片。
  - 连接自己的 Immich 或 Nextcloud 服务器，完成浏览、上传、下载、编辑和元数据同步。
  - 让 FerrumPix 运行在存放照片的电脑上，并通过浏览器使用。

  原始文件不会被擅自修改，只有保存时才会写入。对 RAW 或 Photoshop 文件的修改保存在旁边的 sidecar 文件中，一个 RAW 的 sidecar 可以保存同一编辑的多个变体。内置二十一种界面语言。
