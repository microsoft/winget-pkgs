ReleaseNotes: |-
  What's new in FerrumPix 0.9.91
  Changes
  - The viewer can show a frame around every detected face with the person's name below it, switched on and off with a new button in the footer. Confirmed names, suggestions and faces without a name look different, and the frames follow zoom, rotation and cropping.
  - The viewer can show where the camera focused, switched on and off with a new button in the footer, and Z then zooms to 100 percent right at that spot.
  - Lighting in the editor: a light can now draw a rim light, a bright edge along the outline of a subject that stands in front of a more distant background, as a light from behind does. It is switched on per light and has its own strength and width. Shadows cast by newly placed lights treat thin things such as fences, branches and ropes as thin, so they no longer throw a shadow like a wall. Lights in saved edits look exactly as before.
  - The picture comparison in the viewer can show four pictures at once, in two rows. Select three or four pictures in the gallery and choose Compare, or switch between two and four with a new button next to the chain. Paging changes only the picture you clicked, zoom and position stay in step across all of them, and focus points and focus peaking now work in the comparison too.
  - Kept and rejected pictures are marked in the filmstrip of the viewer, the editor and the map with a green or red thumb at the top of the tile. A new setting for the filmstrip switches the marks off.
  - The size of the grid in the editor can be set right there: a small arrow next to the grid button opens a slider and a few fixed sizes.
  - Saving an adjustment in the editor now asks what it should contain: tick whole groups such as colour or single sliders, and applying it later changes only those and leaves the rest of the picture alone. Adjustments saved before keep working as they did. Saved adjustments can be sorted into folders, and a new Manage button opens a window to rename, move and delete them. With a picture open, that window shows your photo in small with each adjustment and shows one on the picture while the mouse rests on it, before you apply anything. Each one is a small file, so sharing them means copying files or a whole folder, and the settings let you keep them in a folder of your choice, for example in a cloud folder. Pasting copied adjustments has a second command, Paste with selection, that asks which sliders to paste and leaves all others as they are.
  - While the viewer develops a picture, it can show the tile from the gallery right away instead of an empty area. A new switch in the RAW settings turns this on.
  - Live photos and motion photos from phones are recognised. Their tile carries a small badge, the info bar says what the file is, and a new button in the footer of the viewer plays the short video once. The picture and the video of a live photo stay together when you delete, move, copy or rename one of them, and with stacks switched on the video sits behind its picture.
  - The settings link to the documentation: an entry below the homepage opens the manual in the browser.
  - Exported JPEG files now carry a small sRGB colour profile, so every program shows their colours the same way, also when the picture is saved without metadata.
  - Depth mask, depth blur and depth fog use a new, much more accurate depth model. It separates thin and close things such as fences, branches, ropes and single people from the background, where the old one often saw a flat surface. The model file is new: the settings offer it as an update, and the depth tools need it.
  - Depth blur and the depth mask have an eyedropper: click the subject in the picture and the sharp range or the selected distance is placed around it. The choice of an aperture shape for the depth blur is gone, the blur is always round.
  Fixes
  - Lighting with depth looks cleaner: the relief no longer draws a dark rim around every object or contour lines across flat surfaces, light and shadow end at the outline of an object instead of a few pixels beside it, and cast shadows keep the shape of what throws them. A new slider sets how softly the edge of a cast shadow fades.
  - Depth blur no longer lets the colour of the sharp subject bleed into the blurred background around it.
  - Depth fog leaves the nearest part of the picture clear when the foreground slider is at zero.
  - Depth fog, depth blur and the depth mask leave a narrower fringe around objects.
  - The white balance picker ignores points where a colour channel is blown out, so a click near bright highlights no longer pulls the result towards the colour of the clipped channel.
  - Videos in the viewer: two quick clicks on the seek bar no longer jump back to the start, the handle no longer slips away under the pointer while dragging, the play button shows the right state after switching to another video, and the mouse wheel on the seek bar really jumps.
  - Full screen from the picture comparison shows the picture of the active field, and paging there changes it; back in the window the comparison is as you left it.
  - When the graphics card runs out of memory during the depth map, denoising, object removal or upscaling, for example because another program is using it, FerrumPix now continues on the processor instead of only reporting that it did not work.
  - Motion photos from phones, a JPEG with a short video attached, no longer lose the video when they are saved in the editor or rotated in the viewer: the edit is stored beside the picture and the file stays untouched.
