ReleaseNotes: "### What's New\nBetterleaks v1.9.0 expands secret detection coverage and improves performance.\n\n• Added 46 detection rules, including Miro, VoyageAI, and Bitbucket Data Center tokens.\n• Reduced memory retention and logging overhead during scans.\n• Refined detection patterns and filters to reduce false positives. \n• Fixed duplicate PKCS#12 file findings and removed internal attributes from reports.\n• Empty JSON reports now return [] instead of null.\n\n## Changelog\n• 2bc07526bd83d8402bed0f7991c4d3e60f345af3 Add VoyageAI API key rule (#324)\n• 3d798ac55d89f14a60c8df65d4d2bda6fccb1ea1 Clone box context so fragment.Raw can be released (#313)\n• b1599d6c50946e8b2765e676318a92e5ecce62eb Merge branch 'main' of github.com:betterleaks/betterleaks\n• ee133f66764c6a3285ff781a53bde72bc0a0b93a Revert \"forgot a test/comment\"\n• e9ddabf2c87a7715b07e7179d617a93c19f031f1 Revert \"only retain findings when needed (#323)\"\n• 10234528e348f4a64f0a693df50b01589cb53933 Revert \"remove semgroup crossing detect/source boundary (#325)\"\n• f3188f0ad29a7c11c8bac279e46559f9e224c873 Revert \"rm more deprecated fields (#326)\"\n• 0f4004beaa13a37b7a3c5f120ac3c6ce4bdfe29c Rules/miro (#291)\n• 530e3304d96b604bbabb7dde19bb38bda8db5cae add Bitbucket Data Center token rule (#346)\n• 1c5b7d82eb35007df51d37a397a8360a9ec2daae couple new rules (#311)\n• 5b53d1b30685e1a9cab17062f5014f63783f365b filter out obvious encryption (#310)\n• 2e108eac8b3f552147fcd455cbe34e0cacff589e fix：make sumoLogic accessID prefix case-sensitive (#322)\n• 5ac4b0b5333a6b39b6c1762070ac235a68d57d9c forgot a test/comment\n• 0e4ce8453904512673b6a23dad5e8d3433567b53 more rules (#312)\n• 95237cf8eb4d8e9f67409595b245e674832992cf only construct a logger after regex hit (#338)\n• 574f3a533d9f9af87a1cfac4d9447a95e9ac3d4c only retain findings when needed (#323)\n• abeb307ccee7af8e06ca7923db9a2fa51c72ea69 optimize some rules (#328)\n• 81aff7a638638aae3a659845d089043e1d8fe9ac prep v1 release\n• 1a591583c114e27afffeb7c