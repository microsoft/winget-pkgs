ShortDescription: BetterGI · 原神 UI 自动化测试工具
Description: BetterGI 是一个基于计算机视觉技术的原神 UI 自动化测试工具，可以自动完成钓鱼、自动剧情、自动战斗、遮罩窗口等操作，方便开发者进行 UI 自动化测试与游戏辅助操作。
