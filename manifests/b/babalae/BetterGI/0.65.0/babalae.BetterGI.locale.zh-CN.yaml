ReleaseNotes: |-
  近期为了支持后续功能扩展，和解决历史遗留问题，底层能力正在进行重构，版本 BUG 较多，请谨慎选择更新！
  适配原神 7.0 TemplateMatch 地图与分层地图资源。适配 7.0 鱼类。修复传送频繁失败的问题。
  新增实验性自动连招：识别队伍并调用 OpenAI 兼容 LLM 生成、执行战斗行为树，支持测试、暂停和自动秘境后台建树 (#3584 #3668) @FishmanTheMurloc
  自动钓鱼
  - 重构全自动钓鱼流程，细化举竿、抛竿、咬钩和提竿操作，并在停止或退出时可靠收尾 (#3492 #3561 #3665) @FishmanTheMurloc
  - 自动钓鱼支持至冬、挪德卡莱新增的雪鳍鱼、星花鱼和闪烁饵，并更新检测模型 (#3527) @lwh9346
  自动战斗
  - 战斗结束后默认启用掉落物光柱扫描与拾取 (#3521) @ShadowLemoon
  - 修复 JSON 战斗异常与复活恢复未触发当前路径段重试的问题 (#3623 #3647) @Bedrockx
  - 调整派蒙结束检测与角色切换逻辑，避免切换成功后重复发送按键 (#3529) @Bedrockx
  - 修复短队伍名称及已滚动角色筛选界面下的角色切换失败 (#3611 #3652) @Patrick-Ze
  地图追踪
  - 更新 6.x ~ 7.0 TemplateMatch 地图资源
  - 改善 WGC HDR 与至冬等浅色背景下的传送候选和地图缩放识别 (#3520 #3634) @Jac0b-Shi @guamian1337
  - 优化候选列表动画、截图和拖图时序，修复未开启锚点导致后续传送失败
  - 修复 TemplateMatch 空特征描述符可能导致的匹配异常 (#3534) @L0U0m0
  - 替换路径配置的多选框组件，改善选项显示与交互
  截图器
  - 新增 Windows Graphics Capture V2 截图模式，支持 GPU BGR 打包、CPU 转换回退和可选帧率限制 (#3630) @guamian1337
  - 新增“窗口类名优先检测”模式，未命中时自动回退进程窗口与原有检测方式 (#3569) @guamian1337
  多语言
  - 重构界面多语言机制，改用 XAML 直接翻译并支持切换语言后即时刷新 (#3566)
  - 新增意大利语、俄语，完善英文热键与遮罩、日语及秘境 OCR 多语言支持 (#3399 #3404 #3472 #3596 #3656) @L0U0m0 @antajl @himais0giiiin @Kelsiito
  通知
  - 新增 QQ 官方通知，支持私聊与群聊、文字与截图，并可自动绑定 OpenID (#3530 #3547 #3581) @tianshan233
  - 新增微信 Clawbot 通知，支持扫码绑定、文字与截图，并改善图片推送与会话过期提示 (#3542 #3558 #3573) @tianshan233
  - 一条龙结束后可推送原粹树脂、浓缩树脂和每日委托奖励汇总及截图，识别失败时降级为部分结果 (#3540) @antecanis8
  其他
  - 新增“根据提升指南选择秘境”，可识别培养目标并选择含需求角色的最高难度关卡 (#3632) @lele
  - 自动地脉花修复按星期配置与至冬地域切换，统一通过冒险之证定位地脉花并细分通知事件 (#3523 #3605) @ddaodan
  - 自动邀约修复目标分支选择和已选状态干扰，并改善分支下拉列表滚动 (#3517) @Yukinoshita52
  - 容忍角色名称 OCR 的相近字误识别，提高角色选择稳定性 (#3613) @1004452714
  - 修复寻找阿圆时异步任务提前结束与取消链路失效的问题
  - 优化遮罩窗口性能与状态切换：未启用指标时不再采样，日志框隐藏后仍可用快捷键恢复 (#3606 #3638) @guamian1337 @RRRR623
  - 修复自定义按键注册表读取，支持自动判断或手动选择国服、国际服配置来源 (#3239)
  - 修复多实例日志分析无法识别 fakeLog 的问题（也就是日志分析无法分析 JS 日志的问题）
  - 主窗口支持本地自定义背景，可调整透明度和填充方式，并提供旋转、裁剪与预览 (#3533) @Serendipty1251
  - 修复“AI 推理设备设置 - 更多”无法打开及部分按钮前景色异常 (#3604 #3664) @loosheng @zaodonganqi
  - 修复背包数量 OCR 首尾空白和物品图标后台保存时的对象释放问题 (#3532) @taozhe6
  - 修正 BgiWorld 模型缓存命名，避免与其他模型缓存混淆 (#3553) @DZXH-TX
  - 关闭桌面分身时展示等待进度并暂停交互，普通与小窗模式分别记忆窗口位置
  - 自动首领讨伐新增至冬的“不灭衍生造物”和“嵌合翼骏狮”，并优化无相之草路线与战后重新接近流程 (#3612) @1004452714
