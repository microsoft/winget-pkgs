ReleaseNotes: |-
  本次适配原神 7.0 至冬内容，新增自动演奏和自动拾取白名单，并集中优化地图传送与稳定性。
  新增自动演奏，支持多种曲谱格式、筛选播放与自动切换乐器 (#3419)
  原神 7.0 适配
  - 支持至冬地图与传送点数据 (#3428 #3436) @zaodonganqi
  - 更新七圣召唤 7.0 角色牌数据 (#3449) @haokaiyang
  - 补充至冬天赋秘境材料信息 (#3464) @zaodonganqi
  - 新增至冬地脉花点位与配套路线，并补充挪德卡莱路线 (#3450) @ddaodan
  自动拾取
  - 新增白名单模用于解决经常误点击的问题，支持独立配置拾取与排除规则并更新名单资源 (#3447)
  地图追踪
  - 新增法尔伽、夜兰战技赶路，优化玛薇卡跳飞与赶路配置 (#3400 #3418) @Bedrockx
  - 提升传送点绝对定位、候选列表点击和完成判定稳定性 (#3413 #3438 #3488) @physligl
  - 补全路径执行时火元素采集动作的元素前置校验 (#3411) @columhypnia
  自动战斗
  - 优化战斗结束检测，支持派蒙辅助识别和更灵活的检查时机配置 (#3378) @Bedrockx
  - 修复游泳检测提前释放截图对象导致的异常
  秘境
  - 修复树脂次数输入框内容被清空按钮遮挡
  - 修复秘境树脂次数输入框内容被清空按钮遮挡 (#3468)
  - 优化奖励页就绪检测与数量识别，减少奖励汇总遗漏 (#3476 #3494) @1004452714
  桌面分身
  - 新增独立静音，切换后自动重新连接 RDP (#3406)
  - 桌面分身软件启动游戏时自动清理与桌面分身冲突的窗口和分辨率参数
  JS 脚本
  - genshin.SwitchCharacter 支持联机队伍，并提升特殊角色查找稳定性 (#3412 #3416) @1004452714
  - 优化 characterDevelopmentTask 的角色头像、元素与武器名称识别 (#3459 #3460 #3463) @1004452714
  - 优化 dispatcher.RunCountInventoryItemTask 的物品数量识别 (#3476) @1004452714
  - HTML 遮罩按虚拟域名隔离数据目录，避免不同脚本间状态互相影响 (#3469) @zaodonganqi
  - 脚本配置组改用原子写入，降低保存中断导致配置损坏的风险 (#3502) @physligl
  其他
  - 完善截图、图像识别和窗口订阅的资源释放，修复多处内存泄漏 (#3421)
  - 优化 PaddleOCR 文本检测后处理与旋转文本裁剪，避免识别区域越界
  - 优化全局异常处理和启动失败兜底，修复非 UI 线程弹窗造成的内存泄漏 (#3454 #3461) @guamian1337
  - 修复主窗口最大化时部分对话框未相对父窗口居中的问题 (#3487) @breadgrocery
  - 新增禁用键鼠监听选项 (#3503) @guamian1337
  - 获取剪贴板兑换码时忽略 URL，避免把链接内容误识别为兑换码 (#3470) @girl-dream
  - 新增 Gotify 通知渠道，支持配置服务地址、App Token、优先级和发送测试 (#3485) @sgpublic
  - 修复遮罩总开关关闭后仍会启动 FPS 采样的问题 (#3430) @guamian1337
  - 遮罩 UI 缩放改为默认关闭
  - 修复领取奖励后退出阿圆对话不稳定的问题，确保返回主世界 (#3467)
  - 优化自动剧情弹出页判断，避免关闭手动打开的聊天历史等页面，并支持英勇纪行界面 (#3452)
  - 开发者工具：新增 Recognition 模板素材制作工具，支持本地图片、响应式锚定搜索区域与预览
  - 日志分析兼容实例标识引入前的旧版日志 (#3458)
