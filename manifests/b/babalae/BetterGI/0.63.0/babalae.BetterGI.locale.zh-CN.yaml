ReleaseNotes: |-
  Caution
  0.63 版本识图素材底层重构，可能存在较多未知 BUG ，当前版本并不稳定，请谨慎选择更新！
  新增桌面分身功能，你可以在桌面分身中启动 BetterGI 与游戏，可以做到游戏不占用前台鼠标！注意该功能设置上存在难度，请仔细阅读相关文档。
  地图追踪
  - 部分适配霜月地图（大地图传送还存在问题） (#3339) @zaodonganqi
  - 新增角色战技赶路，支持多名角色与连续赶路模式，并完善体力判断和下车逻辑 (#3280 #3319 #3328 #3336 #3367) @Bedrockx
  - 重构传送任务的滑动方式与候选点位寻找 (#3258) @physligl
  - 补充隐居处传送点数据 (#3324) @JamisHoo
  - 优化传送候选文字的识别 (#3345) @Jac0b-Shi
  - 新增低血量回复时机设置，可选择任意路径点、仅传送点或不回复 (#3283) @Bedrockx
  - 修复路径追踪转圈时按住前进键导致无法正确转向的问题 (#3310) @Bedrockx
  遮罩窗口
  - 新增地图遮罩标点单独隐藏与恢复功能，并按地图数据源隔离保存状态 (#3281) @YufeiV
  - 新增可配置准星，支持多种预设与自定义样式 (#3320 #3382) @Bedrockx
  - 新增遮罩样式自定义并支持分辨率与 DPI 自适应，可分别调整日志和指标栏缩放 (#3184 #3352) @ddaodan @kaedelcb
  - 扩充遮罩指标栏硬件数据并改用游戏进程显卡占用率，支持独立显示快捷键 (#3256 #3278 #3346 #3361 #3386) @quantcat26 @ddaodan @cookie981 @guamian1337
  自动战斗
  - 重构自动战斗索敌与角色特化逻辑，支持可配置的目标锁定和伤害数字识别 (#3292 #3297 #3299 #3321 #3335) @Bedrockx
  - 优化 JSON 战斗策略执行器与条件求值，修复条件计数和当前角色状态异常 (#3274 #3296 #3392) @Bedrockx
  - 修复战后扫描拾取的转向和时长配置，使配置组设置正确生效 (#3119 #3377) @cookie981 @LiquidCrystalWatermelon
  JS 脚本
  - 新增队伍角色重组和角色养成信息识别接口，可读取角色等级、武器与天赋信息 (#3248 #3371) @1004452714
  - 扩展地图脚本接口，支持读取订阅路线文本、点击大地图坐标并返回标准摄像机角度 (#3252 #3317) @Patrick-Ze @1004452714
  - 新增共享战斗策略执行接口，并修复任务间取消令牌和当前角色状态污染 (#3288 #3353) @Bedrockx
  - 拆分前往合成台与合成树脂接口，新增 genshin.GoCraftResin (#3364) @1004452714
  - 扩展视觉脚本 API，新增 BvFlow 链式流程、模板匹配得分 (#3340 #3389) @1004452714
  其他
  - 完善首领讨伐的一条龙配置与战斗超时设置，并修复特殊地图体力识别、树脂弹窗和路线等待 (#3265 #3309 #3343 #3387) @1004452714 @Kirito520Asuna
  - 优化幽境危战状态流转，兼容未解锁 N6 的账号并正确处理活动结束返回主界面 (#3330 #3331) @ShadowLemoon
  - 自动剧情优化对话选项三角标识与单选项重试识别，提高活动界面和大地图场景下的判断稳定性 (#3254) @1004452714
  - 一条龙支持重复添加任务和从指定书签继续执行，并保留各任务实例的独立配置 (#3276) @Bedrockx
  - 新增一键领取奖励及独立快捷键，支持按需滚动奖励列表 (#3273) @Tooltingsu
  - 更新霜月区域自动拾取黑名单 (#3338) @zaodonganqi
  - 秘境级联选择框支持清除当前选择
  - 修复部分场景下尘歌壶地图住宅图标无法点击的问题 (#3355) @Bedrockx
  - 缩小进入游戏按钮的识别范围，避免误点击其他界面元素 (#3326) @bling-yshs
  - 恢复一键强化宏点击详情菜单的操作 (#3272)
  - 自定义背景支持网络图片及可刷新图片 API (#3368) @a701651
  - 重构截图与识别资源管理，底层支持跨分辨率识别 (#3250 #3290 #3370)
  - 统一页面排版、边距和滚动交互，并修复主导航容器显示细节 (#3303) @Arkadegong
  - 新增 WinUI 风格导航选中动画并重写 Markdown 渲染组件 (#3369)
