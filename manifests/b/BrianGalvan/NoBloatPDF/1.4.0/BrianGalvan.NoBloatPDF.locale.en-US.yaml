ReleaseNotes: |-
  Page editing. Select pages in the Pages panel and delete, reorder, copy,
  or export them, then save the result back into the PDF. Right-click a page
  for the menu or press Delete, and undo any change before saving.

  Fixed: the About box links and Check for Updates never opened a browser.

  Fixed: closing a file with unsaved annotations, signatures, or page changes
  now warns first instead of discarding the work silently.
