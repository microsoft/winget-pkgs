ReleaseNotes: |-
  Fixed: on XFA forms (Adobe LiveCycle), deleting a page left Save and Save
  As doing nothing, with no error. Page editing is now off for those forms
  and saving works. A save that cannot finish now always says so and keeps
  your changes; discarding edits no longer opens a Save dialog; Combine
  Files and Sanitize Document explain XFA forms instead of writing a
  placeholder page.
