ShortDescription: Terminal UI for herdr-core - many coding agents in one terminal, see who is waiting for you.
Description: |-
  hc-tui is an unofficial terminal UI for herdr-core (hc). It shows every coding agent on every machine
  in one sidebar, highlights the ones waiting for your input, copies code blocks exactly as Claude
  wrote them, and shares its layout with the Herdr desktop and iPhone apps. Requires herdr-core.
