ReleaseNotes: |-
  Bazelisk v1.30.0 comes with new features and several improvements:
  Security Fixes (Go)
  - Updated Go to 1.27.3 to address CVE-2026-111943 / golang/go#82345 (#821).

  New Features (Go)
  - Added support for patched Bazel release candidates (#814).

  Bug Fixes & Improvements (Go)
  - Bazelisk now looks for configuration files in all parent directories (#805).

  Bug Fixes & Improvements (Docs)
  - Improved documentation of USE_BAZEL_VERSION (#807).
  - Documented BAZELISK_WRAPPER_DIRECTORY (#815).
  We’d like to thank our amazing contributors @dws, @keith, @marlamb, @matx-sjacob and @phst!
