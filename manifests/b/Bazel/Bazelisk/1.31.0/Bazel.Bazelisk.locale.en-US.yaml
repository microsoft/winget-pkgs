ReleaseNotes: |-
  Bazelisk v1.31.0 comes with new features and improvements:
  New Features (Go)
  - Bazelisk now recognizes the NETRC environment variable (#833).

  Bug Fixes & Improvements (Go)
  - Bazelisk now properly sets the BAZELISK environment variable (#829).
  We’d like to thank our amazing contributors @hofbi and @waldoppper!
