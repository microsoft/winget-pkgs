ShortDescription: Azure DevOps deployment dashboard for Windows.
Description: |-
  Worre is a free Windows desktop app for Azure DevOps Services. Follow applications and environments together, inspect build context, and receive desktop notifications. Approval waits appear separately from the currently deployed build.
  Worre signs in with a Microsoft Entra work account. An offline sample workspace lets you explore the app before connecting a project. Deployment views use Azure DevOps Environments; classic releases and Azure DevOps Server are not supported.
