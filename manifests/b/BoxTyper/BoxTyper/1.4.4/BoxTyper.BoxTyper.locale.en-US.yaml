ShortDescription: 'Dictate into any Windows app: hold a hotkey, speak, and the text appears where your cursor is. Speech recognition runs locally on your PC.'
Description: |-
  BoxTyper turns speech into text in any Windows application. Hold the hotkey, speak, release, and the text is pasted into the field you are working in: mail, chat, documents, code editors.

  Speech recognition runs on your own computer with Whisper or NVIDIA Parakeet. No account and no cloud service are needed for dictation.

  Free for private, non-commercial use. Commercial use requires a licence, see boxtyper.com.

  - Push-to-talk dictation into the focused text field of any app
  - Local speech recognition with Whisper and NVIDIA Parakeet, no cloud needed
  - Runs on NVIDIA, AMD and Intel graphics, or on the processor alone
  - Polish: removes filler words, writes spoken numbers and punctuation, optional local language model for style and translation
  - Personal dictionary with corrections for names and technical terms
  - Meeting transcripts with speaker labels and generated notes
  - File transcription to text and subtitles (.txt, .srt)
  - Searchable history of everything you dictated
  - Optional server mode: one PC transcribes for the others in the network
