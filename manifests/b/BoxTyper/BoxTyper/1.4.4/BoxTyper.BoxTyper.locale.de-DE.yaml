ShortDescription: 'In jede Windows-Anwendung diktieren: Tastenkombination halten, sprechen, und der Text steht dort, wo der Cursor ist. Die Spracherkennung läuft lokal auf dem eigenen PC.'
Description: |-
  BoxTyper macht aus Sprache Text, in jeder Windows-Anwendung. Tastenkombination halten, sprechen, loslassen, und der Text wird in das Feld eingefügt, in dem gerade gearbeitet wird: E-Mail, Chat, Dokumente, Code-Editoren.

  Die Spracherkennung läuft auf dem eigenen Computer, mit Whisper oder NVIDIA Parakeet. Zum Diktieren braucht es weder ein Konto noch einen Cloud-Dienst.

  Kostenlos für die private, nicht kommerzielle Nutzung. Die kommerzielle Nutzung braucht eine Lizenz, siehe boxtyper.com.

  - Diktieren per Tastenkombination in das fokussierte Textfeld jeder Anwendung
  - Lokale Spracherkennung mit Whisper und NVIDIA Parakeet, ohne Cloud
  - Läuft auf Grafikkarten von NVIDIA, AMD und Intel oder allein auf dem Prozessor
  - Feinschliff: entfernt Füllwörter, schreibt gesprochene Zahlen und Satzzeichen, optional ein lokales Sprachmodell für Stil und Übersetzung
  - Eigenes Wörterbuch mit Korrekturen für Namen und Fachbegriffe
  - Mitschrift von Besprechungen mit Sprechern und erzeugten Notizen
  - Transkription von Dateien zu Text und Untertiteln (.txt, .srt)
  - Durchsuchbarer Verlauf aller Diktate
  - Optionaler Server: ein PC transkribiert für die anderen im Netzwerk
