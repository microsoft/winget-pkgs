ShortDescription: Free, offline all-in-one disk analyzer and cleaner for Windows 10 and 11.
Description: |-
  Argus Cleaner is a free, offline all-in-one storage manager for Windows 10 and 11 that
  brings together what usually takes several programs.

  It reads your disk's NTFS table directly, so it maps your entire drive in seconds and
  shows where your space goes with an interactive treemap and a navigable 3D map. Every
  item is color-coded by safety before you delete anything, so you clean without breaking
  Windows.

  Features:
  - Instant disk space analyzer (treemap and 3D map)
  - Safe cleanup with a health score (caches, temp files, update leftovers)
  - Content-based duplicate finder that catches renamed copies
  - Deep uninstaller (removes leftovers and registry keys) with batch uninstall
  - SMART disk health with a clear keep / monitor / replace verdict
  - Live GPU / CPU / RAM monitors
  - Windows debloat and privacy tweaks, fully reversible, with a restore point
  - Built-in encyclopedia of thousands of Windows files and folders

  Runs 100% offline: no network connection, no telemetry, no account, no ads. Portable
  (no installation). Available in French, English and Russian.
