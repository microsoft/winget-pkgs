PackageIdentifier: Bilalmesk.SessionRecovery
PackageVersion: 2.8.1
PackageName: Session Recovery
Publisher: Bilalmesk
License: MIT
LicenseUrl: https://github.com/Bilalmesk/session-recovery/blob/main/LICENSE
ShortDescription: Reopen the apps, folders and browser tabs that were open before a crash.
PackageUrl: https://github.com/Bilalmesk/session-recovery
Tags:
  - backup
  - session
  - restore
  - crash-recovery
  - windows
  - snapshots
  - privacy
InstallationNotes: >-
  Session Recovery runs in the background and saves local snapshots of your
  open windows, folders and browser tabs. After a crash or restart it can
  reopen everything. All data stays on the PC; snapshots can be encrypted
  with DPAPI and gzip-compressed.
