ReleaseNotes: |-
  Update dependency global-agent to v4

  Notable changes
  - wait for the end of the CONNECT response headers before starting TLS (#121) (6f6c130)
  - detect absolute https:// request paths (fixes #82) (c0354ad)
  - include bootstrap.js in published files (fixes #81, fixes #85) (93fe319)
