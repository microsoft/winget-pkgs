ReleaseNotes: |-
  修复
  - 游戏内中文显示成方块：在使用 TextMeshPro 的游戏里（例如对话框），翻译后的中文会显示成 □。原因是发布包里的内置字体放错了位置，程序没把游戏字体写进翻译插件的配置。现在无论如何都会写入字体：优先用你在设置里选的字体，找不到时自动改用系统中文字体（如微软雅黑）
  - 内置字体统一放在 fonts\：从 1.0.0 升级时，在线更新和 Setup 都会自动清理旧位置多出来的那份字体，配置和备份保持不动
  升级
  - 已经装了 1.0.0：打开「设置 → 通用 → 关于 → 检测更新」直接在线升级；或者下载新版 Setup 覆盖安装
  - 升级后需要重新启动一次游戏，字体配置才会写进去

  Fix: translated CJK text in TextMeshPro (e.g. dialogue boxes) no longer shows as boxes. The game font is now always written to the translator config. It uses your chosen font, or a system CJK font if that font can't be found. The bundled font now lives under fonts\. Updating from 1.0.0 in-app or with the Setup keeps your settings and backups.
