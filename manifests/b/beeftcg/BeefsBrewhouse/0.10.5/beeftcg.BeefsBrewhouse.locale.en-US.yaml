ShortDescription: A free multi-game trading card game deckbuilder with legality checking and export, covering Magic, Yu-Gi-Oh!, Pokemon, One Piece, and Riftbound.
Description: >-
  Beef's Brewhouse is a desktop deckbuilder for Magic: The Gathering, Yu-Gi-Oh!,
  the Pokemon Trading Card Game, One Piece Card Game, and a Riftbound fan
  project. It supports deck legality checking against official formats/ban
  lists, importing and exporting decklists in the formats popular deckbuilding
  sites use, a card collection and wishlist, and price tracking. It is an
  unofficial fan project and is not affiliated with Wizards of the Coast,
  Konami, The Pokemon Company, or Riot Games.
