ShortDescription: Select a word anywhere and press a hotkey to see its definition or translation.
Description: |-
  A Windows tray app for looking up and translating words. Select a word in any app and press Alt+D: its definition opens in a card next to the selection. Alt+T translates the selection instead.
  English lookups work offline; Italian can be downloaded. It uses about 3 MB of memory while idle.
