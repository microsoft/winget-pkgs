ShortDescription: Free, open-source creative studio for Windows - video editing without watermark, screen recording, live streaming, photo editing and music.
Description: DedCut is a free and open-source (GPL-3.0) creative app for Windows. It puts five tools in one program - a video editor (multitrack timeline, automatic subtitles, edit by deleting words, automatic Shorts, 4K export with no watermark), an OBS-style recording studio, live streaming to YouTube, Twitch, Facebook, Kick and TikTok at the same time, a photo editor and a music studio, with an AI assistant that works offline. No account, no ads, no telemetry. Currently in beta.
