ShortDescription: Logiciel de création gratuit et libre pour Windows - montage vidéo sans filigrane, enregistrement d'écran, live, retouche photo et musique.
Description: DedCut est un logiciel libre (GPL-3.0) et gratuit pour Windows. Il réunit cinq espaces dans un seul programme - montage vidéo (sous-titres automatiques, montage en effaçant des mots, Shorts automatiques, export 4K sans filigrane), enregistrement d'écran façon OBS, live sur YouTube, Twitch, Facebook, Kick et TikTok en même temps, retouche photo et création musicale, avec un assistant IA qui marche sans internet. Pas de compte, pas de pub, pas de télémétrie. En bêta.
