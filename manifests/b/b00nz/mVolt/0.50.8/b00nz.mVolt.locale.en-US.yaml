ShortDescription: NVIDIA GPU tuning and monitoring tool with voltage, clock, power and fan control.
Description: mVolt+ is a Windows tool for tuning and monitoring NVIDIA GPUs. It controls core and fabric voltage limits, clock offsets, power limits, V/F curves and fan curves, shows live telemetry, and saves settings as profiles. RTX 50 series is the primary target; earlier GeForce generations are supported experimentally.
