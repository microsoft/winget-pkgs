ShortDescription: 免费的 Windows 壁纸软件，把博物馆开放馆藏里的名画设成桌面和锁屏壁纸，显示方式有三种可选。
Description: |-
  观画壁纸把你的 Windows 桌面变成一面画墙。它从世界各地博物馆的开放获取馆藏里挑选名作，定时换一幅。显示方式有三种可选：完整显示、博物馆画框、智能裁切。
  打开托盘菜单，第一行就是正在显示的作品、画家和博物馆。每台显示器各换各的，锁屏也跟着换。不想看的作品可以屏蔽，喜欢的可以收藏。
  作品来自：大都会艺术博物馆、芝加哥艺术博物馆、克利夫兰艺术博物馆、荷兰国立博物馆、台北故宫博物院、丹麦国家美术馆、盖蒂博物馆、美国国家美术馆、耶鲁大学艺术馆藏、巴黎市立博物馆联盟。也可以用维基共享资源、wallhaven、Pexels 的图片，或者电脑上的文件夹。
  免费，没有广告，不用注册，不收集任何数据。界面有简体中文和英文。源码公开，许可证是 PolyForm Noncommercial 1.0.0，不能用于商业目的。
