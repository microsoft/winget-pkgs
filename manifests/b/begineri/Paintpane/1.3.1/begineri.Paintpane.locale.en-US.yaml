ShortDescription: Free wallpaper app that sets paintings from museums' open-access collections as your desktop and lock screen wallpaper, with three display modes to choose from.
Description: |-
  Paintpane turns your Windows desktop into a gallery wall. It picks masterpieces from the open-access collections of museums around the world and moves on to the next one on a schedule. Choose how each work is shown: Full artwork, Museum frame or Smart crop.
  Open the tray menu and the first line tells you the work, the artist and the museum. Each monitor changes on its own, and the lock screen changes too. Block works you don't want to see again; keep the ones you love as favorites.
  Artworks come from The Metropolitan Museum of Art, Art Institute of Chicago, Cleveland Museum of Art, Rijksmuseum, National Palace Museum (Taipei), Statens Museum for Kunst, J. Paul Getty Museum, National Gallery of Art, Yale University Art Collections and Paris Musées. You can also use pictures from Wikimedia Commons, wallhaven and Pexels, or a folder on your PC.
  Free, no ads, no account, no data collection. English and Simplified Chinese interface. The source is public under the PolyForm Noncommercial License 1.0.0; noncommercial use only.
