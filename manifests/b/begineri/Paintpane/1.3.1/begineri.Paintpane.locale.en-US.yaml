ReleaseNotes: |-
  - The Metropolitan Museum of Art: when its website blocks downloads for a while, Paintpane no longer saves broken images and pauses that museum until later. Its department collections show artworks again.
  - Switching display modes quickly no longer leaves you with no wallpapers.
  - Another copy of Paintpane, such as a newer version you try out, can no longer take over Start with Windows.
