ReleaseNotes: |-
  Native-receiver preview 0.2.4 (GitHub tag v0.2.4-preview.1).
  Fixes clipped text in Settings dropdowns.
  Includes local discovery, a separate mirrored-screen window, audio playback, and opt-in local diagnostic logging.
  Known limitation: Quit has occasionally left the control process running after the receiver stops.
  Quit MirrorMe before upgrading or uninstalling. If it remains running, end its process in Task Manager first.
  Broad physical-device compatibility testing is still in progress.
