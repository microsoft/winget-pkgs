ReleaseNotes: |-
  Decode straight from a URL when yt-dlp is installed, so a container carried as video can
  be fetched and decrypted in one step instead of being downloaded by hand first. yt-dlp is
  optional and never installed on your behalf: it is used if present and its absence is
  reported.

  Fixed: the Start Menu shortcut opens the interface, as it always claimed to. It passed no
  arguments, so it printed the help text and closed. The Windows file properties of the
  binary now carry the real version instead of "dev".
