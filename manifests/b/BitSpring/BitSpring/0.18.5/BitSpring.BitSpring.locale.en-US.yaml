ShortDescription: Free, open-source bit-perfect music player.
Description: |-
  BitSpring sends your DAC exactly what is in the file: no resampling, no system mixer. Each track plays at its own sample rate, up to 768 kHz, through WASAPI Exclusive mode; DSD plays natively over DoP or as PCM; same-format tracks play gapless. A parametric equalizer with AutoEQ headphone profiles, crossfeed and upsampling are there when you want them, and off means bit-perfect again. Plays FLAC, ALAC, WAV, AIFF, APE, WavPack, MP3, AAC, Ogg, Opus, DSF, DFF and SACD ISO, also on UPnP/DLNA and Chromecast players. No account, no ads, nothing collected.
