ShortDescription: 'Fast, focused browser with no tab strip: tabs live in a searchable command center.'
Description: |-
  1zero Browser is a desktop browser for macOS, Windows and Linux with no tab strip and no toolbar. The page gets the whole window, and your tabs live in the command center: a searchable grid of live previews you can color, drag into folders and combine into split views.
  Long-pressing or Alt-clicking a link opens it in Peek over the page, where it can become a tab or join a split without losing your place. A Dynamic Island in the titlebar shows what is playing, timers, downloads and updates, and restarting brings every window back as you left it.
  A native ad and tracker blocker built on EasyList and EasyPrivacy runs inside the browser from the first page you open, with cookie banners answered by Reject, HTTPS upgrades, secure DNS and no telemetry. Settings can import history, cookies, open tabs and extensions from Chrome, Edge, Firefox and Arc.
