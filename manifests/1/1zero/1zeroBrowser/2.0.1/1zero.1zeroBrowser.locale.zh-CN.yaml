ShortDescription: 一款快速、专注的浏览器，没有标签栏：标签页栖身于可搜索的指挥中心。
Description: |-
  1zero Browser 是一款面向 macOS、Windows 和 Linux 的桌面浏览器，没有标签栏，也没有工具栏。页面占据整个窗口，你的标签页则驻留在指挥中心里：一个可搜索的实时预览网格，你可以为其着色、拖入文件夹并组合成分屏视图。
  长按或 Alt+点击链接，会在页面上方以 Peek 打开它，它可以在那里变成一个标签页或加入分屏，而不会让你离开当前所在的位置。标题栏中的灵动岛会显示正在播放的内容、计时器、下载和更新，重启后每个窗口都会恢复到你离开时的样子。
  基于 EasyList 和 EasyPrivacy 构建的原生广告与跟踪器拦截器，从你打开的第一个页面起就在浏览器内运行，cookie 横幅会自动以“拒绝”作答，并提供 HTTPS 升级、安全 DNS，且没有遥测。设置可以从 Chrome、Edge、Firefox 和 Arc 导入历史记录、Cookie、打开的标签页和扩展程序。
