ShortDescription: Free, open-source VPN client for Windows built on sing-box.
Description: |-
  Ninety is a desktop client for your own servers. Import a subscription URL, a single proxy link,
  a sing-box or Xray config or a WireGuard/AmneziaWG file, then connect in local proxy,
  system proxy or full VPN (TUN) mode. Ninety picks the fastest server, routes traffic by
  domain, IP address or program, and its diagnostics show exactly where a connection breaks.
  No ads, no telemetry, no account.
