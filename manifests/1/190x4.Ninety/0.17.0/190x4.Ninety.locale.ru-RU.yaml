ShortDescription: Бесплатный VPN-клиент для Windows с открытым кодом на базе sing-box.
Description: |-
  Ninety — клиент для ваших собственных серверов. Добавьте ссылку на подписку, отдельный конфиг,
  конфиг sing-box или Xray либо файл WireGuard/AmneziaWG и подключайтесь в режиме прокси,
  системного прокси или полного VPN (TUN). Ninety сам выбирает быстрый сервер, разводит трафик
  по доменам, IP-адресам и программам, а диагностика показывает, где именно рвётся связь.
  Без рекламы, телеметрии и регистрации.
