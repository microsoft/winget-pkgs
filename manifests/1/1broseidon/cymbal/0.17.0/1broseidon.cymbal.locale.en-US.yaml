ShortDescription: Language-agnostic code navigation CLI powered by tree-sitter.
Description: |-
  cymbal is a fast, language-agnostic code navigator. It parses a codebase
  with tree-sitter into a local SQLite index, then answers symbol lookups,
  cross-references, impact analysis, and relationship queries in
  milliseconds - from the terminal or from an AI agent.

  It replaces long chains of grep, find, and file reads with one focused
  command. Indexing and queries run locally, with no account or
  configuration.
