ShortDescription: A lightweight, native Git and Subversion desktop client, with a read-only project browser, an English/Chinese interface, and optional AI-written commit messages.
Description: Viff is a lightweight native Git desktop client written in Go with the Viva toolkit, without Electron or a WebView. It shows diffs, commit history and changelists, offers a read-only project browser, and switches between an English and a Simplified Chinese interface. Viff drives the Git executable already installed on the system; it does not bundle Git.
