ReleaseNotes: |-
  🎬 播放器与预览
  - 视频缓存：新增自定义缓存目录 & 大小上限设置，空间管理更自由
  - 字幕体验：字幕大小改为 16～56px 连续调节，告别"跳档"，微调更顺滑
  - 字幕渲染修复：外挂 PGS 图形字幕、ASS/SSA 特效字幕现在可以正常显示了
  - 加载修复：修复本地缓存缺失或不完整时视频一直转圈的问题
  - 播放流畅度：修复暂停等缓存后继续播放偶发卡顿的问题
  - 倍速统一：视频/音频倍速上限统一为 4 倍，切换即时生效，不再需要等待
  - 音频播放器：「更多」中新增「播放原文件」开关，同时修复了多项音频播放问题
  - 看图模式：修复适应模式下按住实况照片起播前闪黑的问题
  📁 文件、传输与其他
  - 传输悬浮球：支持三档显示模式——拖拽文件时显示 / 一直显示 / 关闭，按需选择
  - 移动/复制体验：目标文件夹支持按时间排序，记住视图偏好；搜索续拉不再重复或弹回顶部
  - 下载优化：按实时速度自适应分块，下载更稳定；同一文件可分别下载到不同目录
  - 购买中心：支持多语言和深浅主题，支付状态、会员信息与赠送空间显示更稳定
  - 其他：修复若干已知问题，整体稳定性提升
  
  ✨核心亮点
  1. 全格式适配：支持视频、音频、图片、文档、电子书、压缩包等全类型文件在线预览播放，无需本地下载转换；
  2. 专业播放能力：自研播放引擎，兼容 MKV、AVI、RMVB、ISO 镜像等特殊格式，支持 4K、HDR 高动态范围高清播放；
  3. 稳定可靠：断点续传+断网自动恢复机制，大批量、大文件传输无惧网络中断；
  4. 高效办公阅读：全新升级的电子书批注、云端同步、智能朗读能力，全方位满足日常阅读与办公批注需求；
  5. 精致体验：深色模式、简繁英三语适配，原生 Windows 流畅交互体验，界面美观且操作顺手。
  📁文件管理：像本地一样管理云端
  一、流畅浏览
  1. 目录秒开：看过的文件夹再次进入立即显示，后台静默更新
  2. 上万文件的大目录，滚动、框选、全选依然如丝般顺滑
  3. 列表/网格双视图，缩略图封面一目了然；记住上次浏览位置，打开即回到工作现场
  二、高效整理
  1. 完善的文件操作：新建、重命名、移动、复制、星标、置顶、评分、备注、标签
  2. 批量重命名：查找替换、添加序号、大小写转换、繁简转换等十余种规则自由叠加，实时预览效果，常用组合云端保存、多端通用
  3. 移动文件自动检测同名冲突，保留、替换、合并随你选
  4. 强大的搜索与筛选：关键词高亮、类型筛选、自定义后缀、搜索历史
  三、得心应手的快捷键
  1. 方向键浏览、回车打开、空格预览，双手不离键盘完成日常操作
  2. Ctrl+C 复制、Ctrl+X 剪切、Ctrl+V 粘贴，跨目录整理文件和本地文件夹操作一致，简单自然；
  3. 复制本地文件，切回应用按 Ctrl+V 直接上传
  4. 按 Ctrl+/随时唤出快捷键速查面板，快速查阅全部快捷操作。
  四、安全与隐私
  1. 文件加密隐藏：私密文件一键隐藏，需 6 位安全密钥验证才能查看
  2. 应用锁：启动解锁+无操作自动锁定，他人碰不到你的网盘
  3. 回收站：误删文件随时找回，彻底删除需安全验证，多一道保险
  🚀文件传输：大文件、大批量，稳如磐石
  1. 整个文件夹上传/下载：完整保留目录结构，空文件夹也不遗漏；应用程序、素材库整包传输
  2. 断点续传+断网自动恢复：网络中断自动暂停，恢复后自动续传，无需人工干预
  3. 多连接加速：下载多线路并发，跑满你的带宽；也支持限速，不影响其他应用
  4. 传输管理中心：上传下载统一管理，实时测速、失败原因清晰可见、任务详情逐段展示；关闭应用再打开，任务原样恢复
  5. 拖拽即传：文件直接拖入窗口即可上传，右键菜单快速「上传至 115 生活」，传输更便捷。
  ☁️云下载：链接丢进来，网盘帮你下
  1. 支持 HTTP/FTP/磁力链/电驴链接，多行批量添加
  2. BT 种子云下载：解析种子内容，按类型快速勾选想要的文件
  3. 复制磁力链自动识别弹窗，一键添加
  4. 任务分类管理，配额与套餐明细清晰可查
  🎬视频播放：专业级云端播放体验
  1. 全格式直接播放：自研播放引擎，MKV/AVI/WMV/FLV/RMVB 等格式无需转码即点即播
  2. 光盘镜像（ISO）直接播放：ISO 文件双击即放，高码率内容流畅不卡顿
  3.  4K 原画+HDR 高动态范围：更宽的亮度与色彩范围精准呈现，明暗层次纤毫毕现
  4. 字幕全能：内嵌、外挂字幕全支持，ASS 特效字幕完整渲染，语言偏好自动优选
  5. 多音轨/多声道：多条音轨自由切换，多声道原样输出
  6. 播放更省心：跳过片头片尾（按目录记忆）、自动连播、倍速 0.5–3.0、章节跳转、播放进度云端同步，手机看一半，电脑接着看
  7. 画音自定义：宽高比切换、色彩均衡器、音频均衡器（十段自定义+21 种预设）、音频延迟微调
  8. 独立播放窗口：边看边用，播放不打断文件管理
  9. 快捷键：K/J/L、数字键跳转、逐帧步进，按？随时查看快捷键说明
  🎵音频播放：把网盘变成你的曲库
  1. 沉浸式播放界面：旋转封面、律动音波、滚动歌词
  2. 歌词支持：自动匹配歌词文件，逐行高亮、点击跳转
  3. 桌面迷你播放器：小窗常驻、跨桌面悬浮，工作听歌两不误
  4. APE/FLAC/WMA/OGG/DSD 等无损与小众格式通吃
  5. 十段图形均衡器（24 种预设）、跳过静音、记住播放位置、睡眠定时关闭
  📚我听 · 我看：你的专属音视频库
  1. 「我听」音频库：听单管理、最近在听、进度接续，通勤路上手机听，回家电脑继续
  2. 「我看」视频库：合集管理、封面墙浏览、观看进度标记
  3. 支持编辑封面、评分、相关人等信息，打造个人媒体库
  🖼️图片查看：大相册也能秒开
  1. 渐进式加载：先出图再逐级清晰，翻页零等待
  2. 智能预加载：连续翻图、幻灯片放映如本地般流畅
  3. GIF 动图、实况照片、EXIF 信息一应俱全
  4. 缩略图网格：整屏宫格速览大相册，点击直达
  📖阅读与文档
  1. 电子书阅读器：EPUB/TXT/MOBI/AZW3/FB2/CBZ 漫画/PDF 全支持，双页对开排版、五种阅读主题、全文搜索、TTS 语音朗读自动翻页
  2. 在线文档：新建与编辑 Word/Excel/PPT，Office 文件在线预览，无需下载
  3. 通用预览：PDF、超大文本（最高 200MB）、Markdown 富文本渲染
  4. 云解压：压缩包无需下载，云端在线解压直接入库，支持后台解压
  🔗分享协作：一条链接，好友即达
  1. 灵活的分享设置：有效期、访问码（随机/自定义）、接收次数限制、指定账号可见
  2. 免登录下载：好友无需注册 115 也能下载你分享的文件
  3. 多渠道发送：复制链接、口令分享、二维码、微信/微博/QQ 空间
  4. 分享管理：所有分享集中管理，续期、变更访问码、重置次数一站搞定
  5. 转存：收到分享链接？复制后应用自动识别弹窗，浏览内容并一键转存到自己网盘
  👨👩👧👦家庭共享：一人网盘，全家共享
  1. 创建共享文件夹，邀请家人好友共同使用
  2. 成员权限精细管理：预览、上传、下载、转存逐项控制
  3. 共享内容直接双击预览播放，照片、视频、文档即点即看
  4. 成员动态一目了然，谁上传了什么清清楚楚
  特别说明：部分高清播放、高级阅读、云解压、家庭共享等进阶功能为 VIP 会员权益，具体可查看应用内详情。欢迎广大用户下载试用，如有使用问题或优化建议，可随时反馈，我们将持续迭代优化产品体验！
