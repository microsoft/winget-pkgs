ReleaseNotes: 115 生活 Windows 客户端是 115 科技打造的全能桌面云应用，适配全系主流 Windows 电脑，集成文件管理、极速传输、视频预览、阅读办公、分享协作等核心能力，一站式满足用户云端存储与日常使用需求，轻量化、高效率、功能全面。本次 V37.2.1 版本次主要更新优化文件管理，「全部文件」上线 12 种多窗格布局，支持跨窗格操作、记忆浏览位置，重命名功能升级。大批量传输更稳定，新增桌面传输悬浮球。优化 4K/HDR 视频播放，修复播放闪退、卡顿问题。同时调整登录设置，优化分享、预览等功能，修复各类已知 bug，提升整体稳定性。
