Description: Windows command-line toolkit for Windows 10/11. Includes a 19-chapter CMD/PowerShell cheat sheet, 13 practical scripts (system info, network diagnosis, port usage, temp cleanup, robocopy backup, process/service overview, large file finder, batch rename, console menu) and a zero-dependency WinForms GUI that runs every task in a background runspace with live colored output. Falls back to registry / performance counters / native commands when WMI or CIM is blocked.
