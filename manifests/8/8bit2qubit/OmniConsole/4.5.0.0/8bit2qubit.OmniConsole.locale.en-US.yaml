ReleaseNotes: "## v4.5.0.0：Set It Once, Every Desktop Launch Follows\r\n\r\n> 🌐 **[Official Website](https://8bit2qubit.github.io/omniconsole-site)** — documentation, features overview, and installation guide.\r\n> 🐱 **[Teach Nekomata your language](https://github.com/8bit2qubit/OmniConsoleTranslations)** — she's all ears, so teach her a new language, or help her say it more naturally.\r\n> _See the [live translation status](https://github.com/8bit2qubit/OmniConsoleTranslations/blob/main/4.5.0.0/TRANSLATION_STATUS.md) for the latest._\r\n> 🕹️ **[Share your custom platform](https://github.com/8bit2qubit/OmniConsolePlatforms)** — export a platform you have set up and open a pull request, so everyone else can add it with a single click.\r\n\r\nWriting this software has been my way of raising a tiny living thing. I'm Nekomata's mom! A nekomata, in Japanese folklore, is a cat who's lived long enough for her tail to split in two, who's said to command fire, and even to make dead things move again. It sounds a little frightening put that way, but I've always felt it suited her ever so well：what she does is take the places that wouldn't answer you and make them answer again. So her colors are those very flames; everything around her carries a phantom's name. I fed her one line at a time. That's just how I brought her up to where she is today. She's grown up now, and she goes into people's homes to lend a paw. There's a quiet little Pro corner in the settings, and if you'd ever like to help me keep raising her, that's just what it's there for. I'm rather curious myself about what she'll grow into next~\r\n\r\n### ✨ New Features (v4.5.0.0)\r\n\r\n• **Choose how XBOX Mode (FSE) starts from the desktop, and whether to confirm on the way out**：under **Settings → Advanced → XBOX Mode (FSE)** you can have Windows ask you every time, restart for optimized performance, or start right away. The confirmation on your way back to the Windows desktop is yours to keep or leave out as well.\r\n\r\n  <img width=\"900\" height=\"250\" alt=\"The XBOX Mode (FSE) section in Advanced settings, with the entry action and the exit confirmation\" src=\"https://github.com/user-attachments/assets/c23aaa4a-31fb-4c5e-a37a-7153d75324ac\" />\r\n\r\n### 🔧 Improvements (v4.5.0.0)\r\n\r\n• **Nekomata Mode and Game Bar’s cursor stay in step**：switch Nekomata Mode from OmniConsole or from the OmniCharm widget, and OmniConsole picks up the latest state the next time it starts.\r\n• **The same name you see in Windows**：Microsoft now styles the brand in all caps, and OmniConsole reads that way throughout. That covers XBOX Mode (FSE), the XBOX app and the XBOX button. Spanish, Russian and Turkish carry the new spelling as well.\r\n• **Two Chinese scripts, one look**：parentheses, quotation marks and the spacing around them follow one style throughout OmniConsole, so Traditional and Simplified read alike.\r\n\r\n### 🔧 Improvements (v4.4.3.0)\r\n\r\n• **A steadier jump to the mapping editor**：pressing **Customize gamepad mapping for this app…** on the OmniCharm widget takes you to the editor far more consistently, especially on lower-powered consoles.\r\n• **OmniConsole reaches the front more reliably when it is called up**：from Game Bar’s Home and Library buttons, from entering XBOX Mode, and from the OmniCharm widget.\r\n• **Nekomata catches the mouse**：with Nekomata Mode on, OmniConsole has Game Bar’s game controller cursor step aside, so the pointer on screen is hers alone.\r\n\r\n> ⚠️ **A Game Bar quirk**：newer builds of Windows and Game Bar carry an option that turns Game Bar’s game controller cursor on for you automatically, and that option is turned on by default, which puts it at odds with Nekomata Mode. OmniConsole settles that as it starts.\r\n\r\n> ⚠️ **A quirk between Game Bar and Windows**：in some games, Game Bar does not appear, even when you press Win+G or the XBOX button on the controller (it does open, but it is invisible, and the gamepad can still reach what is on it). This has been the case across Windows builds. If you see it, report it to Microsoft through the Windows Feedback Hub.\r\n\r\n### 🔧 Improvements (v4.4.2.0)\r\n\r\n• **More of Windows works in Nekomata Mode out of the box**：Windows Remote Assistance, the Remote tab of System Properties and the Windows Update standalone installer respond to the gamepad as soon as they open. Those that run as Administrator need Administrator App Support, a Pro feature.\r\n• **Steam Big Picture and Playnite Fullscreen fill the screen however you reach them**：OmniConsole has always worked around the two quirks below when it starts a platform, sizing the window to fill the display, and this version reaches further. Switch between Steam's desktop client and Big Picture, or between Playnite's Desktop and Fullscreen mode, and the screen fills just the same. On Big Picture the gamepad goes straight to Steam throughout, and Nekomata Mode steps in for Steam's desktop client alone.\r\n\r\n> ⚠️ **A quirk between XBOX Mode and Steam**：Big Picture occasionally stops short of full screen, sitting in the middle with XBOX Mode's black backdrop around it. It appears only after repeatedly switching between Steam's desktop client and Big Picture inside Steam, and it takes OmniConsole to fill the display.\r\n\r\n> ⚠️ **A quirk between XBOX Mode and Playnite**：inside XBOX Mode, Playnite Fullscreen almost always sits in the middle of the screen with XBOX Mode's black backdrop around it, and it takes OmniConsole to fill the display.\r\n\r\n• **Nekomata's advanced sleep**：Nekomata checks on things only when there is reason to, and dozes the rest of the time. Whenever you are not using the gamepad she curls up for a proper nap. Touch the gamepad and her ears go up first, then her eyes, and she is right there beside you before you have finished the motion.\r\n• **Gamepad navigation runs smoothly through the OmniConsole interface**：every frame carries your latest gamepad input, so the highlight glides along with your thumb.\r\n\r\n### 🔧 Improvements (v4.4.1.0)\r\n\r\n• **Back to the widget bar, on OmniCharm’s own tile**：leaving the OmniCharm widget upward from its top row brings you to the Game Bar widget bar, with the highlight resting on OmniCharm itself.\r\n\r\n> ⚠️ **A Game Bar quirk**：at the boundary between the widget bar and a widget, going down into the widget and coming back up to the bar, the way Game Bar handles that direction varies between XInput controllers, so it takes one press on some and two on others.\r\n\r\n### 🔧 Improvements (v4.4.0.0)\r\n\r\n• **A faster response when you hold a direction**：hold the D-pad or the stick in OmniConsole and the focus keeps stepping at a quicker pace.\r\n• **Your last press stays in OmniConsole Settings**：say you are reading in a browser and open OmniConsole Settings partway through. The B press that takes you out is received by Settings alone, and does not reach the browser by accident.\r\n• **File Explorer arrives with the gamepad ready on Steam Big Picture**：Steam Big Picture holds on to gamepad input for about five seconds after File Explorer opens. This release works around that, so the gamepad reaches File Explorer alone from the moment it appears.\r\n• **Scrolling and navigation feel even smoother**：as you move through the interface or scroll a page with the gamepad, the view keeps up more closely.\r\n• **The widget carries everything it needs to run**：installing or updating it requires no system framework package (VCLibs).\r\n• **One press takes you back to the widget bar**：from the top row of the OmniCharm widget, a single press of D-pad Up puts you on the Game Bar widget bar.\r\n\r\n### 🔧 Improvements (v4.3.1.0)\r\n\r\n• **The main app carries everything it needs to run**：installing or updating it requires no system framework package (Windows App Runtime).\r\n\r\n### ✨ New Features (v4.3.0.0)\r\n\r\n• **File Explorer from the widget**：the OmniCharm widget carries a **File Explorer** button that opens straight to **This PC**, so your files stay within reach while a game is running. It opens the **classic** File Explorer window, the one with the **ribbon** along the top, and Nekomata Mode's built-in mapping already covers it, letting you browse and open your files with the gamepad alone.\r\n\r\n  <img width=\"1284\" height=\"568\" alt=\"OmniCharm widget's File Explorer button, and the classic File Explorer window it opens\" src=\"https://github.com/user-attachments/assets/b33a3f2c-6fa8-4574-a869-9eb1162cd8d4\" />\r\n\r\n> ⚠️ **A Steam quirk**：open File Explorer while Steam Big Picture is on screen and Steam holds on to the gamepad input for about five seconds before letting go. Give it a moment, then browse as usual. It only happens with Steam Big Picture; with any other app on screen, File Explorer is ready to use the moment it opens.\r\n\r\n### 🔧 Improvements (v4.3.0.0)\r\n\r\n• **The Windows shell stays its own**：Prevent Double Input is introduced only into the apps you set it up for, and stays out of Windows' own shell and system components, as well as OmniConsole's.\r\n• **The tuning agent is recognized both ways**：OmniConsole and the OmniCharm widget confirm the tuning agent's identity before sending it anything, and the agent confirms theirs in turn.\r\n• **Every component loads from where it belongs**：each one resolves the Windows libraries it needs from the system folder, and reaches for the tools it uses by their full path.\r\n• **More of Windows works with the gamepad out of the box**：Registry Editor, Disk Cleanup, System Information, Remote Desktop, Windows Mobility Center, device property sheets, Hyper-V and a wide range of other built-in tools and Control Panel dialogs respond to the gamepad as soon as they open, and App Installer joins them. Those that run as Administrator need Administrator App Support, a Pro feature.\r\n• **Playnite stays in the mode you choose** (#7)：switch between Fullscreen and Desktop mode from inside Playnite, and your screen settles into the mode you picked. It holds in both directions, whether you started from the built-in Playnite Fullscreen platform or from a P"
