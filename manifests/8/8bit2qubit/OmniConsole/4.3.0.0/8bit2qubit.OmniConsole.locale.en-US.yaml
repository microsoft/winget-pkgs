  ### 🛠️ Installation Instructions

  Download `OmniConsole_4.3.0.0_x64.zip` from the Assets below and extract it to any folder.

  **Option A: Install.bat (Recommended)**

  1. Run `Install.bat`. It will enable Developer Mode, install the certificate, install any missing framework dependencies, and install both MSIX packages automatically.

  **Option B: Manual Install**

  1. **[Critical]** Go to **Windows Settings → System → Advanced** and enable **Developer Mode**.
  2. **[Critical]** Double-click `OmniConsole_4.3.0.0_x64.cer` → click **Install Certificate** → Store Location: **Local Machine** → **Place all certificates in the following store** → Browse → select **Trusted People** → Finish. _(Skip this step if you already have the certificate installed)_
  3. _(Optional — only needed on fresh/offline systems; online systems fetch these automatically)_ Double-click each file inside `Dependencies\` to install the bundled framework packages (skip any that report an equal or newer version already installed).
  4. Double-click `OmniConsole_4.3.0.0_x64.msix` to install the main app.
  5. Double-click `OmniConsole.PhantomLink_4.3.0.0_x64-widget.msix` to install the OmniCharm widget.

  ### ⚙️ Prerequisites

    **Windows 11 24H2 (Build 26100.7019)+** with Xbox Mode (FSE) enabled.
    OmniConsole requires the **Full Handheld edition** of Xbox Mode (FSE). Microsoft is gradually rolling out a Limited PC edition to regular PCs — use [Xbox Full Screen Experience Tool (XFSET)](https://github.com/8bit2qubit/XboxFullScreenExperienceTool) to switch to the Full Handheld edition.
    **Desktops, Laptops, Tablets & Handhelds without the Full Handheld edition**: Run XFSET first.
    **Native Handheld Devices** (e.g., ROG Xbox Ally series): Already on the Full Handheld edition — install OmniConsole directly.
    **Xbox Controller Required**: Game Bar, Xbox Mode (FSE), and all gamepad features require an Xbox-compatible (XInput) controller with an Xbox button.

  **Full Changelog**: https://github.com/8bit2qubit/OmniConsole/compare/v4.2.1.0...v4.3.0.0

