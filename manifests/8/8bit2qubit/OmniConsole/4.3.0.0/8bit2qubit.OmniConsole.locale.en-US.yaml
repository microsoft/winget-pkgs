  ### 🔄 已安裝過 OmniConsole？直接在應用程式內更新

  1. 開啟 **OmniConsole 設定**，前往 **☰ → 進階**。
  2. 點選**檢查更新**，再點**下載並安裝**。OmniConsole 會自動下載新版本並完成安裝。

  > 🔁 **手把映射的遷移**：若你曾為以版本資料夾封裝的程式自訂過手把映射（在 v3.7.0.0 之前為 GitHub Desktop 等程式，或在 v4.1.0.0 之前為 EA Desktop），其既有設定檔仍綁在該程式當初的版本、該程式升級後便不會生效。請開啟該程式，從 OmniCharm 小工具點選**自訂此程式的手把映射…**，並在編輯器中按下**儲存並返回**，設定檔即會重新綁定、通用日後所有版本。重新綁定後，編輯器顯示的繫結執行檔路徑會以 `app-{version}` 標記版本段，代表此設定檔已通用所有版本，屬正常現象。

  > ⚠️ **升級時請透過「應用程式內更新」或 `Install.bat`（解壓 `OmniConsole_4.3.0.0_x64.zip` 後可見），不要從下方 Assets 下載安裝 MSIX 套件。** 「應用程式內更新」與 `Install.bat` 都會妥善處理被執行中的遊戲佔用的檔案；手動安裝 MSIX 套件會導致更新不完整或兩套件版本不一致。

  ### 🔄 Already have OmniConsole installed? Update from within the app

  1. Open **OmniConsole Settings**, then go to **☰ → Advanced**.
  2. Click **Check for Updates**, then **Download & Install**. OmniConsole downloads the new version and installs it for you.

  > 🔁 **Gamepad mapping migration**: if you customized the gamepad mapping for an app that ships in a versioned folder (such as GitHub Desktop on a version earlier than v3.7.0.0, or EA Desktop on a version earlier than v4.1.0.0), its existing profile is still tied to the app version it was set up on and stops applying once that app updates itself. Open the app, then from the OmniCharm widget tap **Customize gamepad mapping for this app…** and press **Save & return**. The profile is rebound and now applies across all future versions. After rebinding, the bound executable path shown in the editor marks the version segment as `app-{version}`, indicating the profile now covers every version — this is expected.

  > ⚠️ **Please update via the in-app updater or `Install.bat` (found after extracting `OmniConsole_4.3.0.0_x64.zip`), rather than downloading the MSIX packages from the Assets below.** Both the in-app updater and `Install.bat` properly handle files still in use by a running game; installing the MSIX packages manually will leave the update incomplete or the two packages on mismatched versions.

