  ## v4.3.0.0：你的檔案，遊戲中伸手就到

  > 🌐 **[前往官方網站](https://8bit2qubit.github.io/omniconsole-site/zh-TW)**：完整文件、功能介紹與安裝指南。
  > 🐱 **[教貓又說你的語言](https://github.com/8bit2qubit/OmniConsoleTranslations)**：貓又正洗耳恭聽！教她一種新語言，或幫她說得更自然。
  > _最新進度請見[即時翻譯狀態](https://github.com/8bit2qubit/OmniConsoleTranslations/blob/main/4.3.0.0/TRANSLATION_STATUS.zh-TW.md)。_
  > 🕹️ **[分享你的自訂平台](https://github.com/8bit2qubit/OmniConsolePlatforms)**：把你設定好的平台匯出並發起 pull request，其他人就能一鍵加入。

  說起來，我從一開始就把寫這套軟體當成是在養育一個小小的生命，我就是貓又的媽媽呢！貓又是日本傳說裡的妖怪，貓活得夠久，尾巴就會分成兩條，據說還會操弄火焰，甚至讓死去的東西重新動起來。這樣講好像有點嚇人，可我一直覺得很適合她：她做的事，不就是把那些原本不理你的地方，變回會回應你的樣子嗎？所以她身上是鬼火的顏色，身邊的東西也都帶著「幻影」這個字。她是我一行一行餵大的，就這樣一路拉拔到了今天。現在她長大了，到每個人的家裡去幫忙。設定裡有一個「專業版」的角落，如果你也願意陪我一起把她養下去，那就是它的用處了。她還會長成什麼樣子，我自己也還在期待著呢~

  ### ✨ 新功能 (v4.3.0.0)

    **從小工具開啟檔案總管**：OmniCharm 小工具備有**檔案總管**按鈕，直接開啟**本機**，遊戲進行中你的檔案伸手就到。它開啟的是**經典**的檔案總管視窗，也就是頂端帶有**功能區**的那一版，而貓又模式的內建映射涵蓋它，所以瀏覽與開啟檔案全程用手把就行。

    <img width="1284" height="568" alt="image" src="https://github.com/user-attachments/assets/e53b04ca-9400-4a37-a93e-cab12b87a835" />

  > ⚠️ **這是 Steam 本身的怪癖**：畫面上是 Steam Big Picture 時開啟檔案總管，Steam 會抓著手把訊號大約五秒才放開，稍待片刻再操作即可。只有 Steam Big Picture 會這樣，畫面上是其他程式時，開啟檔案總管馬上就能操作。

  ### 🔧 改進 (v4.3.0.0)

    **Windows 殼層仍是它自己**：「避免雙重輸入」只會進入你設定過的程式，Windows 自身的殼層與系統元件、以及 OmniConsole 自己的元件，一律不會踏進去。
    **調校代理雙向相認**：OmniConsole 與 OmniCharm 小工具在送出任何指令之前，會先確認調校代理的身分；代理也會確認它們的身分，兩邊相互對應。
    **每個元件都從它該在的地方載入**：各元件所需的 Windows 函式庫一律自系統資料夾解析，動用到的工具也以完整路徑取用。
    **更多 Windows 內建工具開箱即用**：登錄編輯程式、磁碟清理、系統資訊、遠端桌面、Windows 行動中心、裝置內容、Hyper-V 等一系列內建工具與控制台對話方塊，一開啟就能用手把操作，應用程式安裝程式也在其中。以系統管理員身分執行的那些需搭配系統管理員程式支援（專業版功能）。
    **Playnite 停在你選的模式**：在 Playnite 裡切換全螢幕版與桌面版，畫面就停在你選的那一個。兩個方向都成立，不論你是以內建平台的 Playnite 全螢幕版啟動它，還是自訂平台的 Playnite 桌面版（可從使用者平台索引標籤的**社群**按鈕一鍵新增）。

  ### 🔧 改進 (v4.2.1.0)

    **從第一次啟動就帶著你走**：OmniConsole 會指引你到 **Windows 設定 → 遊戲 → Xbox 模式 (FSE)** 把它選為主畫面應用程式；待你於 Xbox 模式 (FSE) 中啟動，它若看出這台主機可以讓完整體驗運作，便會請你按下**套用**補上其餘的設定。

  ### ✨ 新功能 (v4.2.0.0)

    **效能疊加層控制（專業版）** (#8, #22)：Game Bar 本身就備有微軟提供的**效能**小工具，遊戲進行中可以看到幀率與系統使用量。專業版另備一組控制項，讓你在 OmniConsole 裡調整 RivaTuner Statistics Server 的螢幕顯示。於**設定 → 進階 → 效能疊加層**可開關螢幕顯示、顯示它的幀率統計、為文字加上陰影、放大顯示，以及設定幀率上限。OmniCharm 小工具的**疊加層**分頁備有同一組控制項，遊戲進行中也伸手可及。需搭配系統管理員程式支援與 RivaTuner Statistics Server。<br><img width="480" height="645" alt="image" src="https://github.com/user-attachments/assets/1986f3aa-d699-4cb9-aa68-db4d9232f2c1" />
    **ROG Ally 家族主機上的貓又模式（專業版）**：這類主機出廠即備有廠商自己的手把映射，貓又一向為它讓路。專業版讓這件事成為一個選擇：於**設定 → 進階**開啟，再到 Command Center（控制中心）把**控制模式**設為**遊戲控制器**。貓又在電腦上會的，在這裡她一樣會，同樣的版面配置、同樣的各程式咒語、同樣那個你已經熟悉的編輯器。它預設關閉，初次開啟時會請你確認一次，設定裡與 OmniCharm 小工具上都是如此。
    **完成 Xbox 模式 (FSE) 的設定**：OmniConsole 會在啟動時看出這台主機可以讓 Xbox 模式 (FSE) 以完整體驗運作，並主動詢問是否為你套用所需的設定。按下**套用**、給予一次系統管理員授權，再重新啟動主機即可完成。掌上型主機維持原樣，不做任何更動。

  ### 🔧 改進 (v4.2.0.0)

    **一個動作，一聲回應**：在**控制器預設版面**旁按下 **編輯…** 開啟自訂版面編輯器時，會得到乾淨俐落的一聲。
    **焦點停在你放下的地方**：進入**專業版**分頁時，白框會留在你按下的導覽項目上，與其他設定分頁的節奏一致。
    **每個方向都通往某處**：在**自訂版面**編輯器裡，從標題往下按一定會帶你進入下方的工具列，無論 **從程式讀入…** 當下是否可用。
    **在你登入的工作階段運作**：安裝系統管理員程式支援之後，幻影之鑰（PhantomKey）與幻影之火（PhantomIgnis）會在你實際使用的工作階段裡就位，不論你人在主機前面，還是從遠端桌面連進來。
    **元件完整性驗證**：OmniConsole 在啟動、載入或將任何元件帶進遊戲之前，都會驗證它的數位簽章與完整性，並自查驗起持續保護該檔案直到它投入使用。
    **效能疊加層的存取驗證**：調校代理在套用任何變更前會先識別呼叫來源，疊加層設定因此僅回應 OmniConsole 本身。
    **先聽你的回答**：啟動時若有需要你確認的事，OmniConsole 會等你處理完，再帶你進入平台。

  ### ✨ 新功能 (v4.1.0.0)

    **OmniConsole 專業版**：設定中新增**專業版**分頁。OmniConsole 是獨立開發者利用自己的閒暇時間撰寫與維護的個人興趣專案，你的支持能讓它繼續走下去。專業版授權可從該分頁取得，啟用後即可解鎖下列進階功能。頁面也會顯示授權對象，以及這台主機持有的授權。
    **系統管理員程式支援（專業版）**：手把映射能作用於以系統管理員身分執行的程式與遊戲。在**設定 → 進階 → 貓又**點選**安裝**並通過系統管理員授權，貓又模式就會延伸到這類程式。OmniCharm 小工具也能為以系統管理員身分執行的程式開啟映射編輯器。<br><img width="900" height="103" alt="image" src="https://github.com/user-attachments/assets/c8b39f46-d8dc-49d0-9177-b0df6d6131de" />

    **自訂控制器版面（專業版）**：在 OmniNav 與經典之外，自己定義一套預設版面。於**設定 → 進階 → 貓又 → 控制器預設版面**選擇**自訂**，再點 **編輯…** 編排手把的輸入位。內建映射涵蓋的程式會立即套用，新增的程式設定檔也以它為起點，喜歡的按鍵配置不必再一個程式一個程式抄過去。OmniCharm 小工具也能切換到它。<br><img width="900" height="146" alt="image" src="https://github.com/user-attachments/assets/8d1188a4-700c-4cb9-964e-edca5ecac745" />

    **用手把叫出螢幕鍵盤（專業版）**：Windows 本身就能從 Game Bar 的**設定 → 顯示鍵盤**叫出螢幕鍵盤。專業版多一條直達路線：在映射編輯器裡把任一按鍵映射成叫出鍵盤，手邊的事不必中斷。可選用手把直接打字的**遊戲控制器鍵盤**，或以游標點按的**螢幕小鍵盤**。螢幕小鍵盤另需系統管理員程式支援。遊戲控制器鍵盤按 B 鍵關閉，螢幕小鍵盤再按一次同一顆鍵即關閉。<br><img width="900" height="229" alt="image" src="https://github.com/user-attachments/assets/f4906233-1b65-4283-806a-0e4be9293bb7" />

  ### 🔧 改進 (v4.1.0.0)

    **EA Desktop 的手把映射支援**：EA Desktop 屬於以版本資料夾封裝的程式，你為它自訂的手把設定檔現在通用日後所有版本，處理方式與 GitHub Desktop 等 App 相同。此外，EA Desktop 現在也在內建鍵鼠導覽的涵蓋範圍內。
    **開啟方式對話方塊開箱即用支援貓又模式**：讓你挑選要用哪個程式開啟檔案的對話方塊，現在與 Windows 檔案選擇器一樣套用內建映射，不必再自訂設定檔，就能用手把挑選。
    **工作管理員支援貓又模式（專業版）**：工作管理員與檔案總管一樣套用內建映射，不必自訂設定檔。工作管理員以系統管理員身分執行，因此這一項需搭配系統管理員程式支援。

  ### 🎮 貓又模式速查表

