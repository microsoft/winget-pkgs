ReleaseNotes: |-
  ## v4.3.0.0: Your Files, Within Reach While You Play

  > 🌐 **[Official Website](https://8bit2qubit.github.io/omniconsole-site)** — documentation, features overview, and installation guide.
  > 🐱 **[Teach Nekomata your language](https://github.com/8bit2qubit/OmniConsoleTranslations)** — she's all ears, so teach her a new language, or help her say it more naturally.
  > _See the [live translation status](https://github.com/8bit2qubit/OmniConsoleTranslations/blob/main/4.3.0.0/TRANSLATION_STATUS.md) for the latest._
  > 🕹️ **[Share your custom platform](https://github.com/8bit2qubit/OmniConsolePlatforms)** — export a platform you have set up and open a pull request, so everyone else can add it with a single click.

  Writing this software has been my way of raising a tiny living thing, you see. I'm Nekomata's mom! A nekomata, in Japanese folklore, is a cat who's lived long enough for her tail to split in two, and who's said to command fire, and even to make dead things move again. It sounds a little frightening put that way, but I've always felt it suited her rather well: what she does is take the places that wouldn't answer you, and make them answer again. So her colors are those very flames, and everything around her carries a phantom's name. I fed her one line at a time, and that's just how I brought her up to where she is today. She's grown up now, and she goes into people's homes to lend a paw. There's a quiet little Pro corner in the settings, and if you'd ever like to help me keep raising her, that's just what it's there for. I'm rather curious myself about what she'll grow into next~

  ### ✨ New Features (v4.3.0.0)

    **File Explorer from the widget**: the OmniCharm widget carries a **File Explorer** button that opens straight to **This PC**, so your files stay within reach while a game is running. It opens the **classic** File Explorer window, the one with the **ribbon** along the top, and Nekomata Mode's built-in mapping already covers it, letting you browse and open your files with the gamepad alone.

    <img width="1284" height="568" alt="image" src="https://github.com/user-attachments/assets/b33a3f2c-6fa8-4574-a869-9eb1162cd8d4" />

  > ⚠️ **A Steam quirk**: open File Explorer while Steam Big Picture is on screen and Steam holds on to the gamepad input for about five seconds before letting go. Give it a moment, then browse as usual. It only happens with Steam Big Picture; with any other app on screen, File Explorer is ready to use the moment it opens.

  ### 🔧 Improvements (v4.3.0.0)

    **The Windows shell stays its own**: Prevent Double Input is introduced only into the apps you set it up for, and stays out of Windows' own shell and system components, as well as OmniConsole's.
    **The tuning agent is recognized both ways**: OmniConsole and the OmniCharm widget confirm the tuning agent's identity before sending it anything, and the agent confirms theirs in turn.
    **Every component loads from where it belongs**: each one resolves the Windows libraries it needs from the system folder, and reaches for the tools it uses by their full path.
    **More of Windows works with the gamepad out of the box**: Registry Editor, Disk Cleanup, System Information, Remote Desktop, Windows Mobility Center, device property sheets, Hyper-V and a wide range of other built-in tools and Control Panel dialogs respond to the gamepad as soon as they open, and App Installer joins them. Those that run as Administrator need Administrator App Support, a Pro feature.
    **Playnite stays in the mode you choose**: switch between Fullscreen and Desktop mode from inside Playnite, and your screen settles into the mode you picked. It holds in both directions, whether you started from the built-in Playnite Fullscreen platform or from a Playnite Desktop platform you set up yourself (add it with one click from the **Community** button on the user platforms tab).

  ### 🔧 Improvements (v4.2.1.0)

    **Guided from your first launch**: OmniConsole points you to **Windows Settings → Gaming → Xbox mode (FSE)** to choose it as your Home App, and once you start in Xbox Mode (FSE), if it recognizes that this console can run with the full experience, it asks you to choose **Apply** to put the remaining settings in place.

  ### ✨ New Features (v4.2.0.0)

    **Performance Overlay Controls (Pro)** (#8, #22): Game Bar comes with Microsoft's own **Performance** widget for watching your framerate and system usage while you play. Pro adds a separate set of controls, for adjusting RivaTuner Statistics Server's on-screen display from inside OmniConsole. Under **Settings → Advanced → Performance Overlay** you can turn the on-screen display on or off, show its framerate statistics, add a shadow behind the text, scale it up, and set a framerate limit. The OmniCharm widget carries the same controls on its **Overlay** tab, so they are within reach while a game is running. Requires Administrator App Support and RivaTuner Statistics Server.<br><img width="480" height="645" alt="image" src="https://github.com/user-attachments/assets/632c7cb6-db7f-4722-ac88-48a2794754fb" />
    **Nekomata Mode on the ROG Ally family (Pro)**: these consoles ship with the manufacturer's own gamepad mapping, and Nekomata has always deferred to it. Pro makes that a choice: turn it on under **Settings → Advanced**, then set **Control Mode** to **Gamepad** in Command Center. Everything Nekomata does on a PC she does here too, with the same layouts, the same per-app charms, and the same editor you already know. It starts out off, and asks for confirmation the first time, whether from Settings or from the OmniCharm widget.
    **Complete Xbox Mode (FSE) setup**: at startup, OmniConsole recognizes when this console can run Xbox Mode (FSE) with the full experience, and offers to apply the settings it needs. Choose **Apply**, grant administrator approval once, then restart your console and it is done. Handheld consoles are left exactly as they are.

  ### 🔧 Improvements (v4.2.0.0)

    **One action, one sound**: opening the custom layout editor with **Edit…** beside **Controller Layout Preset** answers with a single, clean note.
    **The focus rests where you left it**: opening the **Pro** page keeps the highlight on the navigation item you came from, in step with every other settings page.
    **Every direction leads somewhere**: in the **Custom Layout** editor, pressing down from the title always carries you into the tools below, whether or not **Copy from App…** is available to you.
    **It works in the session you signed in to**: once Administrator App Support is installed, PhantomKey and PhantomIgnis come up in the session you are actually using, whether you are sitting at the console or connected over Remote Desktop.
    **Component integrity verification**: OmniConsole verifies the digital signature and integrity of every component before starting it, loading it, or introducing it into a game, and keeps each file protected from the moment of verification until it is in use.
    **Verified access to the performance overlay**: the tuning agent identifies each caller before applying any change, so overlay settings respond only to OmniConsole itself.
    **Your answer comes first**: when something at startup needs your confirmation, OmniConsole waits until you have settled it before taking you into your platform.

  ### ✨ New Features (v4.1.0.0)

    **OmniConsole Pro**: a new **Pro** page in Settings. OmniConsole is a personal interest project, written and maintained by a solo developer in their own free time, and your support keeps it going. A Pro license is obtained from that page, and activating it unlocks the advanced features below. The page also shows who the license is for along with the licenses on this console.
    **Administrator App Support (Pro)**: gamepad mappings reach apps and games that run as administrator. Install it from **Settings → Advanced → Nekomata** and approve the administrator prompt, and Nekomata Mode extends to those apps. The OmniCharm widget also opens the mapping editor for an app that runs as administrator.<br><img width="900" height="125" alt="image" src="https://github.com/user-attachments/assets/6e0526d9-bedf-4919-a76b-f3e5204a624f" />

    **Custom Controller Layout (Pro)**: define your own default layout alongside OmniNav and Classic. Choose **Custom** under **Settings → Advanced → Nekomata → Controller Layout Preset**, then click **Edit…** to arrange the controller's inputs. Apps covered by built-in mapping pick it up right away, and every new app profile starts from it, so the bindings you like no longer have to be copied over one app at a time. The OmniCharm widget can switch to it as well.<br><img width="900" height="145" alt="image" src="https://github.com/user-attachments/assets/46abffb1-e9f2-49f5-82d1-ffa5b565bb68" />


