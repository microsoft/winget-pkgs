  ### 🛠️ 安裝說明

  從下方 Assets 下載 `OmniConsole_4.3.0.0_x64.zip` 並解壓縮至任意資料夾。

  **方式 A：Install.bat（建議）**

  1. 執行 `Install.bat`，將自動開啟開發人員模式、安裝憑證、補齊相依框架套件，並安裝兩個 MSIX 套件。

  **方式 B：手動安裝**

  1. **[重要]** 前往 **Windows 設定 → 系統 → 進階**，啟用**開發人員模式**。
  2. **[重要]** 點兩下 `OmniConsole_4.3.0.0_x64.cer` → 點選**安裝憑證** → 存放區位置選擇**本機電腦** → **將所有憑證放入以下的存放區** → 瀏覽 → 選擇**受信任的人** → 完成。（_若你之前已安裝過，則無需重複此步驟。_）
  3. _（選用，僅全新／離線系統需要；連網系統會自動下載）_ 依序點兩下 `Dependencies\` 中的檔案安裝相依框架套件（若顯示已安裝相同或更新版本可略過）。
  4. 點兩下 `OmniConsole_4.3.0.0_x64.msix` 安裝主程式。
  5. 點兩下 `OmniConsole.PhantomLink_4.3.0.0_x64-widget.msix` 安裝 OmniCharm 小工具。

  ### ⚙️ 前置條件

    **Windows 11 24H2 (Build 26100.7019)+**，且已啟用 Xbox 模式 (FSE) 功能。
    OmniConsole 需要**完整掌機版**的 Xbox 模式 (FSE)。Microsoft 正逐步將受限 PC 版推送至一般 PC，請使用 [Xbox Full Screen Experience Tool (XFSET)](https://github.com/8bit2qubit/XboxFullScreenExperienceTool) 切換至完整掌機版。
    **桌機、筆電、平板及未取得完整掌機版的掌機**：請先執行 XFSET。
    **原生掌機裝置**（如 ROG Xbox Ally 系列）：原廠即為完整掌機版，可直接安裝 OmniConsole。
    **需要 Xbox 手把**：Game Bar、Xbox 模式 (FSE) 以及所有手把功能皆需使用具備 Xbox 按鈕的 XInput 相容控制器。

