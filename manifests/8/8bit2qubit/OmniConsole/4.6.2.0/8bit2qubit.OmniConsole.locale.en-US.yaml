ReleaseNotes: |-
  v4.6.2.0: Eight Times the Paw, Yours to Size, Then Minds the Little Things, Part Two
  > 🌐 Official Website — documentation, features overview, and installation guide.
  > 🐱 Teach Nekomata your language — she's all ears, so teach her a new language, or help her say it more naturally.
  > See the live translation status for the latest.
  > 🕹️ Share your custom platform — export a platform you have set up and open a pull request, so everyone else can add it with a single click.
  Writing this software has been my way of raising a tiny living thing. I'm Nekomata's mom! A nekomata, in Japanese folklore, is a cat who's lived long enough for her tail to split in two, who's said to command fire, and even to make dead things move again. It sounds a little frightening put that way, but I've always felt it suited her ever so well: what she does is take the places that wouldn't answer you and make them answer again. So her colors are those very flames; everything around her carries a phantom's name. I fed her one line at a time. That's just how I brought her up to where she is today. She's grown up now, and she goes into people's homes to lend a paw. There's a quiet little Pro corner in the settings, and if you'd ever like to help me keep raising her, that's just what it's there for. I'm rather curious myself about what she'll grow into next~

  🔧 Improvements (v4.6.2.0)
  - Performance Overlay Controls work behind the scenes: adjust them under Settings → Advanced → Performance Overlay or on the OmniCharm widget's Overlay tab, and the screen stays just as it was.

  🔧 Improvements (v4.6.1.0)
  - Administrator App Support (PhantomSigil) runs as a Windows service: the groundwork for capabilities to come.
  - “Entering from the Desktop” shows what it depends on: while the Windows “Enter XBOX mode (FSE) on startup” setting is off, a notice appears with an Open Settings link that takes you straight there.
  - The Background Material notice is there when you need it: with Phantom Glass or Phantom Glass Deep selected and Windows transparency effects turned off, a notice appears with an Open Settings link that takes you straight there.
  - The Volume Mixer works in Nekomata Mode out of the box: like the other built-in Windows tools, it responds to the gamepad as soon as it opens, so you can set each app's volume without a custom profile.
  - OmniConsole comes back more reliably after an update: once an update finishes installing, OmniConsole restarts itself and returns on the new version.

  ✨ New Features (v4.6.0.0)
  - Change the cursor size right here: Windows keeps this one in Accessibility settings, and OmniConsole puts it right where you set the cursor speed, anywhere from 100% up to 800%. The OmniCharm widget carries the same slider.

  🔧 Improvements (v4.6.0.0)
  - The mouse wheel carries you down the whole page: on the settings pages the wheel scrolls the page wherever the pointer rests, dropdowns included.
  - The plain arrow, however you come back: OmniConsole has always set the pointer back to the arrow after a dropdown or a suggestion list, and this version reaches further. Open an external link from the About page, or switch to another program and back, and the arrow is there the moment OmniConsole returns to the front.
  > ⚠️ A WinUI 3 quirk: in the interface framework Windows apps are built on, a dropdown you have clicked keeps the focus, and while the pointer rests on it the wheel reaches that dropdown as well: the page scrolls as usual, and the selected item travels along with it. OmniConsole keeps the wheel on the page alone.
  > ⚠️ A WinUI 3 quirk: opening a dropdown or a suggestion list can leave the busy spinner on the cursor, and it can still be there after you switch to another program and come back. OmniConsole sets the pointer back to the arrow.

  ✨ New Features (v4.5.0.0)
  - Choose how XBOX Mode (FSE) starts from the desktop, and whether to confirm on the way out: under Settings → Advanced → XBOX Mode (FSE) you can have Windows ask you every time, restart for optimized performance, or start right away. The confirmation on your way back to the Windows desktop is yours to keep or leave out as well.

  🔧 Improvements (v4.5.0.0)
  - Nekomata Mode and Game Bar’s cursor stay in step: switch Nekomata Mode from OmniConsole or from the OmniCharm widget, and OmniConsole picks up the latest state the next time it starts.
  - The same name you see in Windows: Microsoft now styles the brand in all caps, and OmniConsole reads that way throughout. That covers XBOX Mode (FSE), the XBOX app and the XBOX button. Spanish, Russian and Turkish carry the new spelling as well.
  - Two Chinese scripts, one look: parentheses, quotation marks and the spacing around them follow one style throughout OmniConsole, so Traditional and Simplified read alike.

  🔧 Improvements (v4.4.3.0)
  - A steadier jump to the mapping editor: pressing Customize gamepad mapping for this app… on the OmniCharm widget takes you to the editor far more consistently, especially on lower-powered consoles.
  - OmniConsole reaches the front more reliably when it is called up: from Game Bar’s Home and Library buttons, from entering XBOX Mode, and from the OmniCharm widget.
  - Nekomata catches the mouse: with Nekomata Mode on, OmniConsole has Game Bar’s game controller cursor step aside, so the pointer on screen is hers alone.
  > ⚠️ A Game Bar quirk: newer builds of Windows and Game Bar carry an option that turns Game Bar’s game controller cursor on for you automatically, and that option is turned on by default, which puts it at odds with Nekomata Mode. OmniConsole settles that as it starts.
  > ⚠️ A quirk between Game Bar and Windows: in some games, Game Bar does not appear, even when you press Win+G or the XBOX button on the controller (it does open, but it is invisible, and the gamepad can still reach what is on it). This has been the case across Windows builds. If you see it, report it to Microsoft through the Windows Feedback Hub.

  🔧 Improvements (v4.4.2.0)
  - More of Windows works in Nekomata Mode out of the box: Windows Remote Assistance, the Remote tab of System Properties and the Windows Update standalone installer respond to the gamepad as soon as they open. Those that run as Administrator need Administrator App Support, a Pro feature.
  - Steam Big Picture and Playnite Fullscreen fill the screen however you reach them: OmniConsole has always worked around the two quirks below when it starts a platform, sizing the window to fill the display, and this version reaches further. Switch between Steam's desktop client and Big Picture, or between Playnite's Desktop and Fullscreen mode, and the screen fills just the same. On Big Picture the gamepad goes straight to Steam throughout, and Nekomata Mode steps in for Steam's desktop client alone.
  > ⚠️ A quirk between XBOX Mode and Steam: Big Picture occasionally stops short of full screen, sitting in the middle with XBOX Mode's black backdrop around it. It appears only after repeatedly switching between Steam's desktop client and Big Picture inside Steam, and it takes OmniConsole to fill the display.
  > ⚠️ A quirk between XBOX Mode and Playnite: inside XBOX Mode, Playnite Fullscreen almost always sits in the middle of the screen with XBOX Mode's black backdrop around it, and it takes OmniConsole to fill the display.
  - Nekomata's advanced sleep: Nekomata checks on things only when there is reason to, and dozes the rest of the time. Whenever you are not using the gamepad she curls up for a proper nap. Touch the gamepad and her ears go up first, then her eyes, and she is right there beside you before you have finished the motion.
  - Gamepad navigation runs smoothly through the OmniConsole interface: every frame carries your latest gamepad input, so the highlight glides along with your thumb.

  🔧 Improvements (v4.4.1.0)
  - Back to the widget bar, on OmniCharm’s own tile: leaving the OmniCharm widget upward from its top row brings you to the Game Bar widget bar, with the highlight resting on OmniCharm itself.
  > ⚠️ A Game Bar quirk: at the boundary between the widget bar and a widget, going down into the widget and coming back up to the bar, the way Game Bar handles that direction varies between XInput controllers, so it takes one press on some and two on others.

  🔧 Improvements (v4.4.0.0)
  - A faster response when you hold a direction: hold the D-pad or the stick in OmniConsole and the focus keeps stepping at a quicker pace.
  - Your last press stays in OmniConsole Settings: say you are reading in a browser and open OmniConsole Settings partway through. The B press that takes you out is received by Settings alone, and does not reach the browser by accident.
  - File Explorer arrives with the gamepad ready on Steam Big Picture: Steam Big Picture holds on to gamepad input for about five seconds after File Explorer opens. This release works around that, so the gamepad reaches File Explorer alone from the moment it appears.
  - Scrolling and navigation feel even smoother: as you move through the interface or scroll a page with the gamepad, the view keeps up more closely.
  - The widget carries everything it needs to run: installing or updating it requires no system framework package (VCLibs).
  - One press takes you back to the widget bar: from the top row of the OmniCharm widget, a single press of D-pad Up puts you on the Game Bar widget bar.

  🔧 Improvements (v4.3.1.0)
  - The main app carries everything it needs to run: installing or updating it requires no system framework package (Windows App Runtime).

  ✨ New Features (v4.3.0.0)
  - File Explorer from the widget: the OmniCharm widget carries a File Explorer button that opens straight to This PC, so your files stay within reach while a game is running. It opens the classic File Explorer window, the one with the ribbon along the top, and Nekomata Mode's built-in mapping already covers it, letting you browse and open your files with the gamepad alone.
