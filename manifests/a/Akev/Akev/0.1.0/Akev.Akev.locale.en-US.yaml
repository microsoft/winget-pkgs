ShortDescription: Fast HTTP(S) debugging proxy to intercept, inspect, mock and replay traffic.
Description: |-
  Akev is an open-source HTTP(S) debugging proxy for developers, testers and security engineers.
  Launch a browser, terminal, Android device or container with one click and every request it makes shows up as it happens: headers, bodies, timings, TLS details and the app that sent it.
  Then mock responses, rewrite requests, map to local files, throttle the network or pause at breakpoints.
  It decodes HTTP/1.1, HTTP/2, WebSockets, SSE, gRPC and protobuf, with optional HTTP/3, imports HAR, Charles, mitmproxy and Fiddler captures, and includes an MCP server for AI coding agents.
