ShortDescription: Dim, warm and blue-filter your whole screen for night viewing.
Description: |-
  Night Dimmer goes darker than your monitor's lowest brightness, adds an amber tone and cuts
  blue light - for watching or reading at night. It combines display gamma ramps (which reach
  Alt+Tab, Start and notifications) with a click-through overlay for dimming beyond Windows'
  gamma cap. Dark control panel with presets, global hotkeys (Ctrl+Alt+D opens the panel),
  tray icon, and command-line control. Single self-contained executable; no installer, no
  admin rights.
