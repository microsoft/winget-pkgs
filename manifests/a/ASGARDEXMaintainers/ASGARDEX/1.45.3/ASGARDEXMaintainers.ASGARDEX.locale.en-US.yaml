ReleaseNotes: "# ASGARDEX v1.45.3 🚀\r\n\r\nOneClick fee accuracy, Midgard-resilient quotes, and safer Chainflip/THOR deposit flows\r\n \r\n<!-- Release notes generated using configuration in .github/release.yml at release/v1.45.3 -->\r\n\r\n## What's Changed\r\n<details>\r\n<summary>📦 Dependency updates (1)</summary>\r\n\r\n• chore(deps)：bump @reduxjs/toolkit from 2.3.0 to 2.12.0 by @dependabot[bot] in https://github.com/asgardex/asgardex-desktop/pull/1160\r\n</details>\r\n\r\n### Other Changes\r\n• chore(deps)：bump axios to 1.18.1 (match xchainjs) by @Thorian1te in https://github.com/asgardex/asgardex-desktop/pull/1173\r\n• fix(swap)：skip quote requests for trading-halted THOR/MAYA routes by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1177\r\n• fix(evm)：EIP-1559 headroom for THOR/MAYA pool deposit txs by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1179\r\n• fix(swap)：restore ERC20 Approve CTA when quote is approval-blocked by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1178\r\n• chore(deps)：bump @xchainjs + Chainflip deposit-channel for aggregator 3.0 by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1181\r\n• fix(thor/maya)：never auto-retry keystore MsgDeposit broadcasts by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1182\r\n• fix：Chainflip submit UX, aggregator 3.0.1, asset search, halt banners by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1188\r\n• fix(swap)：stop lastblock polls from re-firing quotes every 60s by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1190\r\n• chore：release v1.45.3 — aggregator 3.0.2, OneClick fees, swap details by @underthesun49 in https://github.com/asgardex/asgardex-desktop/pull/1191\r\n\r\n\r\n**Full Changelog**：https://github.com/asgardex/asgardex-desktop/compare/v1.45.2...v1.45.3\r\n\r\n## The following binaries have been signed by THORChain/ASGARDEX admins listed at [ad