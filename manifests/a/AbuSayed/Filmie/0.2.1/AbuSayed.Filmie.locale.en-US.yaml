ShortDescription: Browse movies and TV shows and keep your Trakt history up to date.
Description: |-
  Filmie is a free, open-source Windows app for browsing movies and TV shows from TMDB and tracking them with Trakt.
  It shows trending and upcoming titles, your continue watching list, watchlist, lists and history, and works out your watching stats on your PC with no Trakt VIP needed.
  Nothing is marked as watched until you choose Mark watched.
  Filmie doesn't host or include any video. It has no video servers built in; you can add servers you have the right to use.
