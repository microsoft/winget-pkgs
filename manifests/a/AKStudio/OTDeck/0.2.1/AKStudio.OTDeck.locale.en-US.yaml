ShortDescription: MQTT, Modbus TCP/RTU and OPC UA client with an MCP server for AI agents that asks you before any write.
Description: OTDeck is a desktop workbench for industrial protocols. An MQTT 5 and 3.1.1 client with Sparkplug B decoding, a Modbus TCP/RTU client with byte and word order, and an OPC UA client with Basic256Sha256 security share one window and one trend panel. A built-in simulator runs an MQTT broker, a Modbus TCP PLC and an OPC UA server locally, production connections start read-only, and the bundled otdeck-mcp server lets Claude, Cursor, Codex and other AI agents read the same topics, registers and nodes; with Pro an agent can ask to write, and nothing is written until you allow it in OTDeck. Free forever with one open connection.
