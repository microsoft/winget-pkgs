ShortDescription: A low-CPU terminal audio player with real-time visualizations, a parametric EQ and synced lyrics.
Description: |-
  Keet is a terminal audio player for MP3, FLAC, WAV, OGG, AAC/M4A, ALAC and AIFF. It plays gaplessly, with a WASAPI exclusive output mode, a 10-band parametric EQ, effects, headphone crossfeed and ReplayGain.
  It shows real-time visualizations (spectrum, VU, oscilloscope, spectrogram and more), album covers, and synced lyrics from .lrc files, tags or LRCLIB, in three themes: Classic, Minimal and Hi-Fi.
