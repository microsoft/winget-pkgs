ShortDescription: Battery levels of your Bluetooth and USB-dongle devices on the Windows taskbar.
Description: >-
  A tiny always-on-top strip on the empty left side of the Windows 11 taskbar showing the battery of
  Bluetooth headsets, keyboards, mice, controllers and 2.4 GHz dongle devices (Logitech, HyperX,
  DualSense, AirPods, Redragon, UGREEN), with low-battery, fully-charged and charge-tonight reminders,
  battery health insights, audio output switching and quick connect/disconnect.
