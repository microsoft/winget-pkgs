ReleaseNotes: |-
  Linux packages now run on older distributions
  The 4.1.0 .deb, .rpm and AppImage packages were built against glibc 2.39 and refused to start on anything older than Ubuntu 24.04 (version GLIBC_2.39 not found). Linux packages are now built on Ubuntu 22.04, so they work on Ubuntu 22.04+, Debian 12+ and RHEL/Fedora 9+ equivalents.
