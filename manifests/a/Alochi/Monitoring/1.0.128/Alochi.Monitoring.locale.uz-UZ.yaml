ReleaseNotes: |-
  <div align="center">

  # 🖥️ Alochi Monitoring
  ### v1.0.128

  ![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)
  ![Version](https://img.shields.io/badge/version-1.0.128-4F46E5?style=flat-square)

  </div>

  ## ✨ New features
  • wire studentName/subjectsCompleted through /diagnostic_finished route
  • redesign finished screen with medal badge, stars, status pills, countdown pause
  • pass studentName and subjectsCompleted to finished-screen route
  • track completed subjects in test runner
  • add ARB keys for finished-screen personalization

  ## 🐛 Bug fixes
  • fix dispose()-during-retry hang and cross-call Timer race, add coverage for the real cancellable-delay path
  • retry once before flipping the login badge to offline
  • scale grid text measurement with ambient font-scale, hoist shared layout constants onto the tactile card
  • use real text-width measurement instead of char-count for 2x2 grid heuristic

  ## 🔧 Other changes
  • bump version to 1.0.128+128
  • verify subjectsCompleted extra survives full CAT completion
  • fix stale file reference in Track A summary
  • fix plan per review (Wave 0 ARB sequencing, merge into existing test file, overflow check)
  • implementation plan for diagnostic finished-screen redesign
  • correct spec baseline after reading actual origin/main file (drop confetti-extraction, reuse existing animation infra)
  • fix spec per review findings (subjectsCompleted, ARB, confetti params, dispose)
  • spec for diagnostic finished-screen redesign

