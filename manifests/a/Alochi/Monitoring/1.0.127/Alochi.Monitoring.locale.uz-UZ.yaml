ReleaseNotes: |-
  <div align="center">

  # 🖥️ Alochi Monitoring
  ### v1.0.127

  ![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)
  ![Version](https://img.shields.io/badge/version-1.0.127-4F46E5?style=flat-square)

  </div>

  ## ✨ New features
  • auto-advance after answer select + clearer countdown timer
  • wire tactile 2x2 options grid and scratchpad into fixed-variant runner
  • centered dock, top question-dots carousel, grade-pill header for fixed-variant
  • tactile Duolingo-style option cards, 2x2 grid, scratchpad

  ## 🐛 Bug fixes
  • selected tactile card uses opaque brandLight, not a translucent tint
  • widen Finish button 172->220 (label still wrapped to 2 lines)
  • revert nav buttons to bounded SizedBox (ConstrainedBox broke rendering)
  • min-width (not fixed) nav buttons, friendlier error card
  • replace GridView(childAspectRatio) with content-sized 2x2 rows
  • address T1 review findings on gamified redesign

  ## 🔧 Other changes
  • bump version to 1.0.127+127 (diagnostic gamified auto-advance + partial-finish release)

