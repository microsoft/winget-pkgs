  <div align="center">

  # 🖥️ Alochi Monitoring
  ### v1.0.167

  ![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)
  ![Version](https://img.shields.io/badge/version-1.0.167-4F46E5?style=flat-square)

  </div>

  ## ✨ New features
  • teacher can switch which monitor of a student PC is shown
  • auto-save latest.alochires per result, re-export all, copy results to flash drive
  • monitoring roster marks finished students, retake confirm; hide diagnostic download-all in pack/LAN mode
  • record built-in (assets) runner results in the pack chain / LAN hub
  • LAN client mode and class monitor UI
  • LAN hub for the teacher PC (shelf server, class code auth, UDP discovery)
  • .alochires format 2, T2 hardening (purge, zip limits, kdf floor, overflow, media cleanup)
  • USB pack mode - .alochipack loader, HMAC-chained results, .alochires export, monotonic clock

  ## 🐛 Bug fixes
  • keep result idempotency keys <= 64 chars so .alochires is not rejected
  • teacher 'Finish test' ends the student's test within seconds
  • make queue DB schema setup idempotent so version-drifted PCs can open it
  • only an explicit leave abandons the attempt on the hub
  • keep real test_key on the finished ping; hub abandons the attempt on a finished ping
  • paused attempt survives leaving the test; re-entry resumes it; hub shows client's own time left
  • show autosave warning only for a recorded failure, not for unknown state after restart
  • attempt_id nonce + completed marker make crash-replay submit idempotent; fix hanging expired-deadline relaunch test
  • unique export filenames, surface auto-save backup failures
  • review fixes for export, auto-save and flash copy
  • guard Windows file dialogs (single-flight, lockParentWindow, try/catch); export to Downloads/alochi-offline without folder dialog; test cancel keeps open pack
  • pack/LAN catalog refresh really loads tests into cache; launchRunner falls back to the open pack instead of 'not in cache'
  • exam dead-end screens always offer back/Esc; pack/LAN tests count as available (no download)
  • roster done-state from pack chain, retake confirm, selection reset; serialize pack open so a failed/concurrent open never closes the active session
  • localize diagnostic online-required tooltip
  • diagnostic on USB pack - no history/queue/answer leaks, honest finished screen, ready peek
  • proper ru plural for usbExportDone
  • keep LAN client connectivity chip on hub health; internet hint only for USB pack; add exam-integrity test
  • connectivity probe hit the swapped offline api; add login banner with exit while a pack/LAN session is open
  • /student_entry route crashed with Null->TestSession for school-less (general/pack) tests
  • sync numeric-variant golden fixtures and add engine-open regression test
  • offline pack inspect Isolate closure captured the dialog State (unsendable); hoist to top-level, show exception type on generic read error
  • cap typed answers of the assets runners (S-N1)
  • LAN hub T2 third-pass fixes (F-1..F-5)
  • LAN hub T2 re-review fixes (N-1..N-7)
  • LAN hub T2 review fixes (S-001..S-011)
  • purgeExpired also requires the export to be 30 days old (S-018)

  ## 🔧 Other changes
  • fix login redesign DNS-timer leak (stub reachable api)
  • fake PathProviderPlatform so flash-copy dialog tests run on Windows
  • bump version to 1.0.167+167
  • manual LAN client harness for a remote hub (env-gated)
  • braces around if in test_catalog_service (analyze info)
  • allow the 151-write per-PC quota test 3 minutes on slow Windows CI disks; docs：note skipped backend round-trips
  • make source-scan test CRLF-safe and frame-bomb test codec-tolerant on Windows; docs：add Windows E2E runbook

