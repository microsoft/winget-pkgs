ReleaseNotes: "## 🪟 Windows\n\n|  | File | Size |\n|---|---|---|\n| 🟢 Portable ZIP | [`alochi-monitoring-windows.zip`](https://github.com/rusthype/alochi-monitoring/releases/download/v1.0.159/alochi-monitoring-windows.zip) | 57.9 MB |\n| 🔵 Setup.exe (tavsiya) | [`AlochiMonitoring-1.0.159-Setup.exe`](https://github.com/rusthype/alochi-monitoring/releases/download/v1.0.159/AlochiMonitoring-1.0.159-Setup.exe) | 77.4 MB |\n| 🟣 MSIX | [`alochi-monitoring.msix`](https://github.com/rusthype/alochi-monitoring/releases/download/v1.0.159/alochi-monitoring.msix) | 62.1 MB |\n\n**SHA256 (ZIP):** `0708F1F2BEAA906CEF140FE7C2224F65288793F623C179D108D13780F82E3E55`\n\n**SHA256 (Setup.exe):** `231350468C6A191A7CCD7A222BCD60427C1355E7213C2CB1F9F48798D62422B5`\r\n\n<div align=\"center\">\n\n# 🖥️ Alochi Monitoring\n### v1.0.159\n\n![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)\n![Version](https://img.shields.io/badge/version-1.0.159-4F46E5?style=flat-square)\n\n</div>\n\n## ✨ New features\n• set diagnosticLocaleProvider from the selected class's language\n• scope student-select/test-runner/finished routes under DiagnosticLocaleShell\n• add ShellRoute wrapper that overrides Locale from diagnosticLocaleProvider\n• add scoped, unpersisted diagnostic locale provider\n• auto-fullscreen kiosk mode + F11 toggle (win32) and shared responsive helper\n• report kiosk LAN IP alongside WAN IP in live proctoring\n\n## 🐛 Bug fixes\n• safer 800x540 minSize + adaptive reflow tuning for small monitors\n• read locale from Localizations instead of the global provider for name script\n• clamp hardcoded image heights and floating-nav padding on small monitors\n• make finished-screen return button smaller and pill-shaped\n\n## 🔧 Other changes\n• bump version to 1.0.159+159\n• add implementation plan for diagnostic class language auto-switch\n\n## 📦 Download\n\n|  | File | Size |\n|---|---|---|\n| 🍎 macOS DMG | [`alochi-monitoring.dmg`](https://github.com/rusthype/alochi-monitoring/releases/download/v1.0.159/alochi-monitoring.dmg) | 65M |\n\nAd-hoc signed. First launch：**right-click → Open** to bypass Gatekeeper — see [macOS o'rnatish qo'llanmasi](https://github.com/rusthype/alochi-monitoring/blob/main/docs/INSTALL_MACOS.md).\n\n**SHA256 (DMG):** `39ed6e20e7131cbce644de005f03bee6664f896a7782bee9d2b2ad6fc1e3fbe2`\n\n<div align=\"center\">\n\n**[Full changelog → v1.0.158...v1.0.159](https://github.com/rusthype/alochi-monitoring/compare/v1.0.158...v1.0.159)**\n\n</div>"
