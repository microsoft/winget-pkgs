ReleaseNotes: |-
  <div align="center">

  # 🖥️ Alochi Monitoring
  ### v1.0.155

  ![macOS](https://img.shields.io/badge/macOS-11+-000000?style=flat-square&logo=apple&logoColor=white)
  ![Version](https://img.shields.io/badge/version-1.0.155-4F46E5?style=flat-square)

  </div>

  ## ✨ New features
  • persist fixed-variant answers to SQLite per tap + live sync
  • flush pending diagnostic answers via SyncService's 60s timer
  • add DiagnosticKioskApi.syncAnswers for kiosk/sync/
  • add local SQLite store for fixed-variant answer progress

  ## 🐛 Bug fixes
  • guard against local-SQLite read errors in restore, update stale AttemptStore-blob assertion, fix restore test's wait strategy

  ## 🔧 Other changes
  • bump version to 1.0.155+155
  • mark stale offline-resume answers assertion as skipped, not failing — see queue_crypto/DiagnosticAnswerStore migration note

