ShortDescription: A local-first desktop Agent workspace for documents, data, presentations, and code.
Description: |-
  Wordless is an Agent workbench for macOS and Windows. Select a workspace, model, and work mode, then let the Agent read context and invoke tools within explicit permission boundaries. Presentations, spreadsheets, research results, and code changes stay visible in the same interface where the work happens.
  Wordless is local-first. Workspaces, conversations, and artifacts remain on your device. Google sign-in and cloud sync are optional, so local work continues when you are signed out or offline.
