ShortDescription: 一个面向文档、数据、演示文稿和代码的本地优先桌面 Agent 工作台。
Description: |-
  Wordless 是一个面向 macOS 与 Windows 的 Agent 工作台：选择工作区、模型与工作模式，让 Agent 在明确的权限边界内读取上下文并调用工具。演示文稿、电子表格、调研结果与代码变更都保留在同一界面中，工作过程清晰可见。
  Wordless 采用本地优先设计。工作区、会话与产物始终保留在你的设备上。Google 登录与云同步均为可选项，离线或退出登录时本地工作不受影响。
