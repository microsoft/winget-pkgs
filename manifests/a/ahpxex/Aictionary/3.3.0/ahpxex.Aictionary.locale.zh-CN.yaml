ShortDescription: 快速且异常好用的词典 App，基于 Tauri 2 + React，提供本地离线词库和可选大模型释义。
Description: Aictionary 是一款专注于「查词体验」的桌面词典，基于开源英汉词库提供详细易懂的中文释义，常用高频词预先缓存，离线也能秒开。当本地词库没有词条时，可调用配置好的 LLM（如 OpenAI 等）生成中文解释和例句，适合技术 / 学术场景。支持查词历史与使用统计、个人词库，以及快捷键快速查词、剪贴板查询等细节优化。基于 Tauri 框架，提供 Windows / macOS / Linux 原生安装包。
Tags:
- 查词
- 翻译
- 词典
ReleaseNotes: |-
  应用内自动更新
  从这个版本开始，桌面端（macOS / Windows / Linux）不用再手动下载覆盖了：应用启动时自动检查新版本，点一下「更新并重启」，就会带进度下载签名更新包、校验、安装并自动重启进入新版本，全程不离开应用。
  - 更新包经 minisign 签名，应用只安装验签通过的版本
  - 设置 → 关于 页的手动检查也走同一安装流程
  - Android 仍从 Release 页下载 APK
  注意：从 v3.2.0 及更早版本升到本版仍需手动安装一次（旧版本里还没有更新器），此后即为全自动。
