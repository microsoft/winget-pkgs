PackageIdentifier: ahpxex.Aictionary
PackageVersion: 3.3.0
PackageLocale: en-US
ShortDescription: Another desktop dictionary, but way more faster and definition-rich, which makes you truly understand language.
Description: Aictionary is a desktop dictionary focused on the word-lookup experience, built with Tauri 2 and React. It provides detailed, easy-to-understand Chinese definitions based on an open-source English-Chinese dictionary; high-frequency words are cached locally so they resolve instantly even offline. When a term is missing from the local dictionary, an optional LLM (such as OpenAI) can generate a Chinese explanation with example sentences, suited for technical and academic use. It tracks lookup history and statistics, builds a personal vocabulary, and offers keyboard shortcuts for quick lookup and clipboard queries. Native installers are provided for Windows, macOS, and Linux.
