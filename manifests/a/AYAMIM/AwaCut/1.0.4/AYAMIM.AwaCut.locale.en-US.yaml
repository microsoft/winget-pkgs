ShortDescription: Removes image backgrounds offline on your PC, one image or whole folders at once, with a bundled AI model.
Description: |-
  What it does: removes the background from photos on the local computer with a bundled AI segmentation model (BiRefNet). Nothing is uploaded; no internet connection is needed to process images.
  Input: single images or whole folders of JPG, PNG, WebP, BMP or TIFF.
  Output: PNG or WebP with a real alpha channel (transparent), or JPG/PNG on pure white (RGB 255, 255, 255) or any custom colour, at the original resolution. Optional outline for stickers and print-and-cut.
  Runs on: the CPU (no graphics card needed); about 3 seconds per image on an Apple Silicon Mac, depending on the computer.
  Price: free trial of 10 images, no account. Licence USD 29 per year, unlimited images, no per-image credits, up to 2 computers, covers Windows, macOS and Linux.
  Typical uses: product photos for online stores and marketplaces (Amazon, Etsy, eBay), logos and signatures, transparent PNGs for print-on-demand, replacing remove.bg Desktop, which closes on 1 December 2026.

  For people: drop a folder of photos into AwaCut, pick transparent, white or a colour, and export them all at full size, without uploading anything.
