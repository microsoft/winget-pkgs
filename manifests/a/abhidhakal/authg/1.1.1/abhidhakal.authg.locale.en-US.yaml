ShortDescription: Minimal native desktop Google Authenticator with encrypted local vault
Description: AuthG keeps your Google Authenticator 2FA codes in the system tray. Import accounts from a Google Authenticator export QR code, then type a name and press Enter to copy a code. Secrets are stored locally in an AES-256-GCM encrypted vault whose key is kept in Windows Credential Manager. No telemetry.
