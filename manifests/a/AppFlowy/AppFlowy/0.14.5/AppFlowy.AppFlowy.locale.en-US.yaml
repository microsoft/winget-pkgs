ReleaseNotes: "### :rocket：v0.14.5 (Latest)\r\n\r\nAdded database formulas and improved document recovery and desktop reliability.\r\n\r\n#### New Features\r\n\r\n• **Formula properties** — Added calculated database properties with property references, built-in functions, suggestions, and live previews. Formula results can be filtered, sorted, and summarized.\r\n\r\n#### Improvements\r\n\r\n• **Document recovery** — Improved recovery of unsaved document content after write failures, including when navigating between pages in the same app session.\r\n\r\n#### Bug Fixes\r\n\r\n• Fixed missing row-page content and overwritten page metadata during sync, and preserved subpages when their page details were not cached.\r\n• Fixed errors when dragging database rows, accessing relations after a linked view was trashed, and opening row comments.\r\n• Restored specific image-upload messages for file-size and workspace-storage limits.\r\n• Fixed Linux RPM launch failures and crashes caused by SVG icon loading.\r\n\r\n#### :warning：Action Required\r\n\r\n• Self-hosted workspaces require **AppFlowy Cloud v0.18.10 or later**. Upgrade the server before upgrading to desktop v0.14.5."
