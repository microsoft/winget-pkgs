ShortDescription: Windows 的 grep 工具
Description: AstroGrep 是一款 Microsoft Windows 的 grep 工具。Grep 是一个 UNIX 命令行程序，可在文件中搜索关键字。AstroGrep 支持正则表达式、多种打印选项、存储最近使用的路径，并具有“上下文”功能，非常适合查看源代码。
