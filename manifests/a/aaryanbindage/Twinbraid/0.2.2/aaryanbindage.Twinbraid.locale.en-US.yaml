ShortDescription: Pair any two coding agents (Claude Code, Codex, Ollama, LM Studio, Gemini CLI, Aider) in one workspace.
Description: |-
  Twinbraid is a desktop app that runs two coding agents on the same project folder and lets them message each other. Watch both agents think and work side by side, interrupt either one, or broadcast to both. Works with Claude Code, Codex, local models through Ollama, LM Studio or llama.cpp, OpenAI-compatible APIs, Gemini CLI and Aider.
