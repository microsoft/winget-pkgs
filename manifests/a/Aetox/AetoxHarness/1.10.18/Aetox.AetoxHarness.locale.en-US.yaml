ShortDescription: A Windows desktop AI agent that does the work on your own machine.
Description: |-
  Aetox Harness is the working environment for AI on your computer — one system where the model, the skills, the team, the code and the memory work together.

  Two doors share one memory, one permission set and one set of keys. The Assistant works on real files, a browser you can watch, shell commands, documents and meeting recordings. The Developer opens the real project with an editor, terminal, language server and git, runs the project's own tests before saying done, and keeps a memory per project folder.

  Includes OCR for images and video in Thai and English, offline speech transcription, an MCP client, and named agent teams where each agent carries its own tools, memory and model.

  Bring any model you already have, or run one locally. Conversations, output files and browser data stay on your machine.
