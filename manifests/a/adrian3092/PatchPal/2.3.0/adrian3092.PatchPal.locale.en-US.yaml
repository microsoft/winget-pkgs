ShortDescription: A Windows 11-style app that finds outdated programs and updates them through winget, Scoop, and Chocolatey.
Description: |-
  Patch Pal scans your PC for programs with newer versions available through winget, Scoop, and Chocolatey, and lists them in one place.
  Update one app or all of them at once, see which apps update themselves, and keep a history of every update with its log.
  It also runs headless from the command line and can export the list to CSV or HTML.
