ShortDescription: Customizable haptics and action-button remapping for Surface Mouse (2nd Edition).
Description: |-
  iXpat adds customizable haptic feedback for clicks, scrolling, menus, controls and text selection to the Microsoft Surface Mouse (2nd Edition).
  Remap the action button's press, double press and hold, use hold-and-move gestures, open an Action Ring with up to eight shortcuts, and configure per-app preferences and kinetic scrolling.
  The app runs in the system tray without an additional driver or administrator rights. It supports the Surface Mouse (2nd Edition) only. Input aimed at elevated or admin windows is not shaped.
