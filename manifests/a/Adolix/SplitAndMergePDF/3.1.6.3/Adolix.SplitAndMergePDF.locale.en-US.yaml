ShortDescription: Splits and merges PDF files offline on Windows, with no upload and no file size limit.
Description: |-
  Adolix Split and Merge PDF splits and combines PDF documents on Windows. Unlike online PDF
  tools, it processes everything locally: files are never uploaded to a server, so there is no
  file size limit and documents never leave your computer.

  You can split a PDF by page range, into individual pages, or using a custom pattern similar
  to Word printing. You can combine several PDFs into one, append encrypted PDF files, or mix
  two documents page by page. Every file it produces can be protected with a password or a
  watermark. A command line interface lets you add it to the Explorer context menu or drive it
  from a script.

  The Free edition merges up to 5 files and splits PDFs of up to 50 pages. The Professional
  edition removes both limits and allows use in business and commercial environments; it is a
  one-time purchase, not a subscription.
