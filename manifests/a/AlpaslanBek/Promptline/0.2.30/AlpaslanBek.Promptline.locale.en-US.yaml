ShortDescription: Your prompt vocabulary, one hotkey away, in every window
Description: A tray app for Windows that keeps your prompt library one hotkey away. Press the hotkey in any window, pick a prompt, and it is pasted where you were, with the clipboard already substituted for {clipboard}. Prompts live as plain JSON under %APPDATA%; packs are files you can share or let an agent write. No telemetry. One update check, off in a click.
