ReleaseNotes: 'ZestSSH 4.2.0, Local programs: a Local host can run a program of your choice (Program, Arguments, Start in and Runs on in place of an address; a device asks before such a program first runs there); Copy setup details in Settings > About; the SFTP dock can use the whole pane; a paste that finds no text says so; a closed SFTP dock stays closed. On phones and tablets: mouse buttons and a scroll strip for remote screens, and fixes for tablets.'
