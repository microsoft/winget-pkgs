ReleaseNotes: "ZestSSH 3.0 brings Teams: shared vaults end-to-end encrypted on members' devices, roles, team rules, invites by code or QR, short-lived SSH certificates and an audit log. Also new: the 3.0 look with the Ember, Graphite and Daylight themes, updates from inside the app checked against a signed manifest, step-by-step guides in Help, history suggestions, and port forwarding free on every plan. Update every device you sync."
