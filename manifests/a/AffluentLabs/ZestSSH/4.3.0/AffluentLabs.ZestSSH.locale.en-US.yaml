ShortDescription: Cross-platform SSH, SFTP, and terminal client for developers, sysadmins, and homelabs.
Description: ZestSSH is a cross-platform SSH, SFTP, and terminal client for Windows, macOS, Linux, Android, and iOS, with remote screens over VNC and Remote Desktop (RDP) in the same tabs. It brings a tabbed desktop shell with split panes, jump-host chaining, port forwarding, an SFTP file browser, snippets and workflows, live server monitoring, and optional end-to-end encrypted sync across every device, all backed by a single shared connection library.
