ReleaseNotes: "ZestSSH 4.0.1, Room to Work: the file editor opens in the workspace with a tab of its own instead of covering the window; Edit for several hosts can move or copy them to another vault or team; the lock screen can show your open sessions; VNC servers get three minutes to connect; fixes for RDP to Windows Server 2022 with RDS licensing, the pointer over a remote screen's side bars, paste and SFTP long names."
