ReleaseNotes: 'ZestSSH 3.2.1 reworks the key row on phones and tablets: Small, Medium or Large keys, every key the same width so the rows line up, keys you can hide and reorder in both layouts, and a tablet row that keeps just the keys a hardware keyboard lacks. A long press on the terminal no longer brings the keyboard back up.'
