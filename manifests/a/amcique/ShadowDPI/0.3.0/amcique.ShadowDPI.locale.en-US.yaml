ShortDescription: Modern and lightweight DPI circumvention utility for Windows x64
Description: ShadowDPI changes the first packets of a connection so deep packet inspection has a harder time recognizing it. It runs on WinDivert, needs Administrator rights, and includes a scanner for finding a preset that works on your provider.
