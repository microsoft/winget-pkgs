ShortDescription: 开源桌面音乐播放器，支持多音源聚合、桌面歌词与智能发现。
Description: TuneFree Desktop 是基于 Tauri 的开源桌面音乐播放器，聚合音乐来源，连接本地曲库、独立桌面歌词与智能发现。界面由 React 与 TypeScript 构建，Rust 承担原生能力、音乐解析、本地代理和推荐数据管理，并支持基于曲库与播放反馈的本地推荐和 AI 语境搜歌。
