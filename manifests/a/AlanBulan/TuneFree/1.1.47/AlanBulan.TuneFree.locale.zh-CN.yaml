ReleaseNotes: |-
  本次更新修复推荐任务状态、歌词匹配与音频频谱问题。
  - 推荐状态在首页、设置和音乐伙伴之间同步更新；切页后继续显示等待、运行和完成状态。
  - 修正推荐刷新时机、缓存复用与重复负反馈，播放推荐歌曲时继续完成后台推荐任务。
  - 改进同名歌、合唱及 Live / Remix 版本的歌词匹配，校正 YRC、QRC、KRC 逐字时间轴，并加入免费 LRCLIB 同步歌词兜底。
  - 歌词跟随实际播放时间，暂停、缓冲、跳转和倍速播放时保持同步。只有普通 LRC 的歌曲继续逐行显示。
  - 音频分析失败时恢复普通播放并保留位置、音量与倍速；频谱仅显示真实音频数据。
  Windows 提供 x64 安装包，macOS 提供 Apple Silicon / Intel 通用包。可在应用内检查更新，或下载下方安装包。
  修复详情：PR #17。
