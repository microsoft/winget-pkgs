ReleaseNotes: |-
  修复
  - 修复 macOS 最小化或关闭主窗口后，从 Dock / Finder 再次打开应用无法恢复窗口的问题；桌面歌词仍显示时也能恢复主窗口。
  - 支持 Cmd-H 隐藏后恢复；Cmd-Q 继续彻底退出。“最小化到托盘”选项调整为“后台运行”，已有关闭偏好保持兼容。
  - 修复模型连接测试通过、完整歌单却在 8 秒时被截断的问题：默认等待时间提高至 60 秒，高级设置最大 180 秒。一次性迁移旧版 8 秒默认设置，保留其他自定义值。
  - 正文读取超时会明确提示请求超时及当前限制，不再误报响应解码失败。
  验证
  - 实机验证最小化恢复、关闭后恢复（桌面歌词仍显示）、Cmd-H 恢复和 Cmd-Q 退出。
  - 同一实际服务和模型生成“下雨天的咖啡馆”歌单，15.2 秒返回 12 首歌曲；推荐重排和发现计划分别约 17.5 秒、21.7 秒成功返回。
  - 1021 项前端测试、255 项 macOS 原生测试、10 项浏览器回归通过，源码行覆盖率 100%，依赖审计 0 漏洞。
  - 新增正文延迟超过旧版 8 秒、超时错误分类及配置迁移回归。
  修复与验证记录
