ReleaseNotes: |-
  - 使用 Bloub 官方 TypeScript 动画核心替换原桌面伙伴，提供全部 15 种动作、16 种表情和 8 种外形，并与播放和 AI 推荐状态联动。
  - 优化页面布局、关于页间距和技术栈版本展示，补齐侧栏、页签及展开面板的切换动画，移除重复按钮和不必要的菜单滚动条。
  - 修复榜单顶部留白与开发模式页面闪烁，改善桌面歌词显示和占位符过滤，修复播放音质降级后选项不同步的问题。
  - 修复 AI 推荐任务并发启动、取消和清理之间的竞态，改进任务进度、取消及过期结果处理。
  - 改善下载重名处理、播放恢复和本地数据保存，修复更新包验签失败时进度误报完成的问题。
  - 更新前后端依赖和构建工具，补充前后端回归测试；前端行覆盖率达到 100%。
