ShortDescription: Open-source desktop music player with aggregated sources, desktop lyrics, and smart discovery.
Description: TuneFree Desktop is an open-source desktop music player built on Tauri. It aggregates music sources and connects your local library, a standalone desktop-lyrics window, and smart discovery. The interface is built with React and TypeScript, while Rust handles native capabilities, music parsing, a local proxy, and recommendation data, with local recommendations and AI contextual song search on top.
