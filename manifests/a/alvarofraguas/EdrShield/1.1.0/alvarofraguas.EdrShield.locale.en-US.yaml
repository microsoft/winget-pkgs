ShortDescription: Protect your EDR from WFP and QoS silencing attacks
Description: |-
  EdrShield is a lightweight Windows service that defends Endpoint Detection and Response agents
  against WFP (Windows Filtering Platform) and QoS (Quality of Service) tampering attacks.
  When an attacker installs hostile network filters to cut off your EDR's cloud communication,
  EdrShield detects and removes them within seconds.
