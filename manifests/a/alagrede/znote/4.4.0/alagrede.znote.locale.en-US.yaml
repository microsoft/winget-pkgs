ReleaseNotes: |-
  Znote 4.4.0 — Obsidian integration
  Run your code blocks in Znote, read the results in Obsidian. This release makes
  executable code blocks fully compatible with Obsidian vaults, in both directions.
  ✨ Code block results saved into your notes
  - Text results are persisted in the markdown itself. Running a js
    (//exec: node) or bash/powershell block writes its output right below
    the code fence as a plain ```output block — readable in Obsidian, on
    GitHub, anywhere. Re-running updates it in place, Clear removes it.
  - Rich results (charts, tables, HTML) saved on demand. A new camera button
    on the runner snapshots the rendered result as a PNG in your attachments
    folder, referenced with Obsidian's native embed syntax
    (![[znote-run-… .png|width]]) — pixel-aligned with the live result, sharp
    on retina displays, and re-running or clearing the block cleans it up.
  - Copy button on saved snapshots — hover a saved result image to copy it
    to the clipboard at full resolution.
  - Enabled by default ("Persist code block results", saved per vault; use
    noSave; on a fence to skip a single block).
  - Results survive restarts and are included in PDF/HTML exports.
  🔗 Obsidian companion plugin
  A new plugin, installable in one click from Znote (proposed the first time
  you open an Obsidian vault, or from the editor settings):
  - "Open in Znote" from the command palette, file/editor context menus, the
    ribbon, a note header action — and a hover "▶ Run in Znote" button on
    executable code blocks, in both reading view and editing mode.
  - Saved ```output blocks are styled as labeled RESULT panels in reading view.
  - Powered by a new znote://open deep link: known vaults open instantly
    (including from a cold start, straight into the right note); a vault Znote
    has never seen asks for confirmation first, showing the exact paths.
  🎨 Editor
  - Readable line length — the editor now uses Obsidian's 700px column by
    default. New toggle in the editor settings, and in Obsidian vaults the
    .obsidian/app.json value is followed (and written back), like Inline title.
  - Obsidian image size syntax ![[image.png|640]] is now rendered by the editor.
  🐛 Fixes
  - Images (pasted or saved results) were missing from PDF/HTML exports; runner
    results could also be attached to the wrong code block in exports.
  - Unsaved edits could silently skip autosave after a file was added to the
    vault (attachments, image paste) while typing.
  - Spurious scrollbars on ApexCharts and gridjs results with classic macOS
    scrollbars; wide datagrids no longer stretch the whole note.
  - Restored results after scrolling in long notes: no more doubled display,
    lost gridjs styling, or misaligned/offset snapshots.
