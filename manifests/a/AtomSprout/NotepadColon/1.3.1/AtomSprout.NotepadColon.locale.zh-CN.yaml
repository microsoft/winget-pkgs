ShortDescription: 快速、专注、本地优先的 Windows 文本与代码编辑器。
Description: |-
  Notepad Colon（Notepad::）是一款原生 Windows 文本与代码编辑器：多标签、分屏视图、
  60 多种语言的语法高亮、文件夹内查找与替换、旧式编码自动检测、会话恢复，
  以及对最大 4 GiB 的 UTF-8 文件的定长内存编辑。
  不需要账号，没有遥测、云服务、插件系统、语言服务器或后台索引，也从不联网。
