ShortDescription: A fast, focused, local-first text and code editor for Windows.
Description: |-
  Notepad Colon (Notepad::) is a native Windows text and code editor. It offers
  multi-document tabs, split views, syntax highlighting for more than 60
  languages, folder search and replace, legacy-encoding detection, session
  recovery, and fixed-memory editing of UTF-8 files up to 4 GiB.
  It uses no account, telemetry, cloud service, plugin system, language server
  or background indexing, and never connects to the network.
