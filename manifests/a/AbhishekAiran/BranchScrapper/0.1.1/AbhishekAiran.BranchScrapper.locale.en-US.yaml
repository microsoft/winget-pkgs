ShortDescription: Desktop app to search, scrape and explore GitHub repositories with live Chrome workers.
Description: |-
  Branch Scrapper is a Windows desktop app that searches GitHub for repositories and collects per-repo details such as stars, forks, branches, tags, releases, contributors, languages, topics and licence. It drives a real, hidden Chrome over the DevTools Protocol instead of calling the GitHub API, stores results in a local SQLite database, and lets you search, filter and export them. It requires Google Chrome, Microsoft Edge or Brave to be installed.
