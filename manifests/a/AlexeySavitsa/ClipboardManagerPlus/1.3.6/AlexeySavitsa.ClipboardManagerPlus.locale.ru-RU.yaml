ShortDescription: Менеджер истории буфера обмена для Windows с категориями, шаблонами и скриншотами.
Description: "Нативное приложение на Win32 для Windows 10 и 11 — до 200 записей текста и изображений с поиском, закреплением, папками и слотами быстрого доступа. Есть шаблоны с переменными подстановки, редактор скриншотов, резервная копия в JSON, горячие клавиши, трей и быстрое меню, автозапуск и портативный режим. Интерфейс на 8 языках. Бесплатная версия работает без регистрации, Pro открывается бессрочным лицензионным ключом без подписки."
