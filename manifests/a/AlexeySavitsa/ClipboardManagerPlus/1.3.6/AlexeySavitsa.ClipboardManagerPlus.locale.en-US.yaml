ShortDescription: Clipboard history manager for Windows with categories, templates and screenshot capture.
Description: Native Win32 clipboard manager for Windows 10 and 11 that keeps up to 200 text and image entries with search, pinned items, folders and quick-access slots. Includes templates with substitution variables, a screenshot editor, JSON backup, hotkeys, tray and quick menu, autostart and a portable mode. Interface is available in 8 languages. The free version works without registration; Pro features are unlocked with a lifetime license key, with no subscription.
