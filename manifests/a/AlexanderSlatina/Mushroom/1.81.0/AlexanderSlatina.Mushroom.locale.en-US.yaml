ShortDescription: A pixel pet that reminds you to drink, move and rest your eyes, timed to when you are actually at the desk.
Description: |-
  Mushroom is a tiny pixel-art pet that lives on your desktop and nudges you to drink water, take breaks and rest your
  eyes. It reads how long you have been at the desk, so nudges arrive when they help and stay quiet when you are away.
  Reminders in plain words, focus sessions, stats and streaks, and on-device chat. Free for 7 days, then a one-time
  purchase of USD 9.99 from the developer, for up to 5 PCs and Macs.
