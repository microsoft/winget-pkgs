ReleaseNotes: |-
  ALEAPP v2026.3.1
  - Broad new app coverage: Instagram, Tinder, Netflix, Reddit, Amazon Shopping, plus a new Proton Mail db-mail (MailX) Room store parser.
  - Snapchat and TikTok expansion: chat media, core.db and session artifacts for Snapchat, new TikTok Account/activity artifacts with multi-account database handling for IM data (plus deduplication of duplicate extraction paths).
  - WhatsApp add-on artifacts (reactions, edits, revokes, polls, receipts, system events), Wire data recovery surviving encrypted app generations, LINE messages/calls now reported even with empty contact tables, and GroupMe deletion state, FCM queued messages, and a scoped group-creator lookup.
  - Chrome additions: saved credit cards and payments customer data artifacts, aligned with the same fixes shipped in iLEAPP.
  - Multiple crash fixes for unopenable databases (siminfo, Samsung My Files, usageapps, airGuard now logging errors instead of silently reporting no data), a Windows long-path SQLite fix, tolerance for older Snapchat arroyo schemas, and artifact reference permalinks pinned to specific commits.
