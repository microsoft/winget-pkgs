ReleaseNotes: |-
  #ALEAPP v2026.3.2
  - New apps: over 35 new parsers added, including Uber, Facebook, Threads, Twitch, Zoom, PayPal, Revolut, Outlook, Yahoo Mail, Adobe Acrobat Reader, Disney+, Amazon Prime Video, Pinterest, Hinge, NordVPN, Roblox, eBay, Etsy, Vinted, Booking.com, Ryanair, DHL, CapCut, Shazam, Truecaller, SimpleX Chat, TeleGuard (calls, account, drafts, downloads), Threema, Opera Browser, Samsung Bixby Routines, Spotify (6 artifacts), and Private Photo Vault.
  - Timestamp accuracy fixes: corrected Unix timestamp conversion for pre-1970/pre-2001 values, deprecated utcfromtimestamp replaced project-wide, and two timezone-dependent timestamps fixed to no longer depend on the host system's clock.
  - Container and account scoping: eBay/Disney+ cache indexes now keyed by container to prevent cross-app bleed, Gmail parsing now reads every account store across users instead of just the first, and Facebook msys duplicate rows merged.
  - Source-path and reporting accuracy: real device/source paths reported instead of examiner folder paths, extraction-relative paths enforced library-wide, a report checker crash on large TSV cells fixed, and Gmail bodies now shown as readable text with a dedicated Links column.
  New Contributors
  - @forest-savage1234 made their first contribution in #1199
