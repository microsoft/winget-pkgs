ReleaseNotes: |-
  ALEAPP v2026.4.6
  - Linux downloads now include .deb and .rpm packages for x64 and ARM, beside the AppImages.
  - Samsung: Messages, visual voicemail, Phone RTT call text, Quick Share transfers and link shares, Find devices and locations, Reminder, Voice Recorder, Gallery search and operation history, Clock alarms and world clocks, Calculator history, Internet bookmarks, saved pages, tabs, search history, quick access and web notifications, Health weight, steps and medications, Digital Wellbeing timers, context engine, Secure Folder file operations, vold external storage events, Customization Service screen state, Cloud Clock Offset and the encrypted Health and Customization Service stores. Samsung Gallery Log Encoded Strings by @dantitto. Samsung message log rows are no longer listed as calls.
  - Google: Find My Device locations and devices, GMS semantic location (with activity and Wi-Fi), Contact Keys, Google Accounts from accounts_ce.db, the Play Services SMS index, the advertising ID, AdServices attribution and consent, Calculator history, Chrome Accounts and Reading List, and Chromium Favicons.
  - Messaging: WhatsApp status updates and viewers, Business tools, local and Google Drive backups, and the default disappearing messages timer (thanks @charpy4n6); Signal conversation view, account and image cache (thanks @kalink0), plus on-device backups read with the recovery key; Threema account, contacts, messages and media reworked (thanks @kalink0); Jami; Zangi calls and groups; newer Wire databases when the extraction carries the keys; Telegram downloaded media linked from file_to_path.db and the Saved Messages chat labelled; LINE messages without a contacts table.
  - Snapchat Conversation Turn Events, Last Saved Location and Client Notifications. TikTok search history and play records. Spotify stores, ported from iLEAPP.
  - System: App Ops access history on Android 16 (thanks @danjethh), Telephony Analytics, URI permission grants, companion device associations, enabled accessibility services, Android Keystore entries, wallpapers, Photo Picker synthetic files, SMS device clock gap, bug report shortcuts, Beats devices, and battery usage on v10 and v11 databases for every user. netstats shows identity fields, each row's collection and source file, and keeps rows when one input is damaged.
  - Stock Android Browser and Email, KDL (Known-data logger) artifacts, Smart Select fragments (thanks @stark4n6), the Protected Notes app (thanks @jensstigaard) and a LAVA conversation view for ChatGPT (thanks @Rugikex).
  - Email bodies: HTML bodies show as readable text, K-9 plain text parts are decoded, and DeepSeek text is stored without HTML escapes.
  - Notes and labels across many modules were corrected after an audit of the examiner-facing text, including Samsung IMS, Solid Explorer, Wi-Fi profiles, notifications, App Standby, what3words, Hive and accounts.
  - Removed: walStrings, which listed text runs from -wal and -journal files that could not be tied to a table, row or state of the database. It was already off by default.
  - File times: artifacts that showed the staged copy's time now report the time the evidence recorded, or the stored reading under a no-zone heading on FAT and exFAT input, and a new CI check flags code that reads a file's stat times. Reports name a staged file by its name in the evidence.
  - Disk images: qnxprobe 1.88 and ewfprobe 0.17.3. -t raw now reads Lx01 and ASIF.
  - HEIC media shows in reports as a JPEG copy, read with heicreader instead of pillow-heif, so the packaged programs carry no GPL or LGPL code. Each build ships the licence of every package and system library it bundles.
  - LAVA output: new number, latitude and longitude header types stored as NUMERIC, case data in the LAVA manifest, and the run info records the architecture. Report cells break on every line ending.
  - The vendored LevelDB reader skips a table block it cannot read or decompress, and keeps reading. The test cases also run on Windows.
  New Contributors
  - @jensstigaard made their first contribution in #1888
  - @dantitto made their first contribution in #1900
