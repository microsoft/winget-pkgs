ReleaseNotes: |-
  ALEAPP v2026.4.5
  - Android bug reports: a large set of new artifacts read a bug report zip, from device facts, sections, installed packages and package times to usage events, process exit info, settings and settings changes, boot reasons, recovery history, permissions and app ops, notifications, accounts, battery and power, network, Wi-Fi, Bluetooth, telephony, security and storage. Thanks @danjethh.
  - More from @danjethh: Health Connect (Android 14+), Samsung Smart Switch, Bluetooth File Transfers (btopp.db), Blocked Numbers and Android Auto Rejected Cars, Setup Flags and boot reason entries from the persistent property store, one database per Android user in frosting, Calendar, Settings Search, My Files recents and Android Auto, and image rows kept in cmh when location_view cannot be queried (Android 16).
  - New artifacts: Instagram Pending Media, Samsung Launcher Search History, Samsung Wi-Fi networks and foreground apps, Package Rollback Records, Permission Controller Safety Label History, Permission Change Dates and Permission Controller Log, Lock Settings (locksettings.db), Google Play Services Screen Lock State History, Google Play Store Install Source and App Data Usage, Google Maps Sync places and people, Battery Stats Daily Package Changes, Wi-Fi IP Memory Store, Call Data Logs (Scone), Telegram Push Messages, Mozilla browser profile times, and a Hive box inventory through a vendored hive-parser.
  - Chromium browsers: Omnibox Shortcuts, Browsing Topics API usage, web notifications, website usage events and share history, Site Permissions with permission prompt actions and counts, the File System API (including bucket storage), AccountBookmarks in Bookmarks, and ETag and Last-Modified in Downloads. The browser is named from the package, not the whole path.
  - SQLite WAL: a shared reader for the committed state of a database and its -wal, including the previous WAL generation and an uncommitted tail, now vendored from sqlite-wal v0.1.0. Samsung Honeyboard, Snapchat, Phone Link, Discord, Telegram and Google Chat report rows that only another WAL state holds. is_sqlite_sidecar replaces the hand-written sidecar filters in 56 modules, and eight modules no longer open a sidecar listed first.
  - Call logs show the SIM ICCID for each call, with SIM account details in a new Phone Accounts artifact. Facebook reads Messenger's contacts store and prefs_db, with an Android User column. C2PA provenance is read through the vendored c2pareader 0.2.0.
  - Reading acquisitions with -t raw: NTFS, ReFS, exFAT and FAT names now match whatever their case on macOS and Linux, as they already did on Windows, and a file two patterns of one artifact match is handed to it once. Three artifacts (Package Rollback Records, Samsung wipe history, TeleGuard saved images) now match their stores at a bare userdata partition root.
  - Profiles: the example profile is fixed, and a profile that names a missing artifact now says so. Artifacts have icons and categories the report can show, KML output is declared only where an artifact has coordinate columns, and reports keep a module's own HTML rows when the artifact has a media column.
  - Builds and CI install the mister_skinnylegs chain from the same lock, with readers that allow Brotli 1.2.1. validate_sample_data.py --emit reads disk images.
  New Contributors
  - @danjethh made their first contribution in #1779
