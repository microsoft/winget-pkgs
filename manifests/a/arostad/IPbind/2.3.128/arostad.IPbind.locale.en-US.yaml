ShortDescription: Bind multiple static IPv4 addresses to one Ethernet adapter simultaneously with a single click, then return to DHCP just as fast.
Description: |-
  IPbind is a free, open-source Windows utility for field technicians and engineers who connect a laptop to isolated IP-based equipment, such as PLCs and signal controllers, spread across several subnets.

  Keep a list of addresses in CIDR form and apply them all to a chosen adapter in one batch. IPbind verifies each address and logs what was applied or skipped, and why. One button returns the adapter to DHCP and resets DNS.

  Features:
  - Bind a full list of static IPv4 addresses at once
  - One-click Return to DHCP
  - Step-by-step console log of every change
  - Remembers your adapter and address list between sessions
  - Optional gateway and DNS for one address, off by default

  IPbind changes network adapter settings and requires administrator approval each time it starts. Return the adapter to DHCP before connecting to any other network.
