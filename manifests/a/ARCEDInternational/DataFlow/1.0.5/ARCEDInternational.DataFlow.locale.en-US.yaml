ShortDescription: Checks field survey data the moment it syncs, on your own computer.
Description: |-
  DataFlow checks survey data from SurveyLoopr, SurveyCTO, ODK Central and KoboToolbox, or CSV and Excel files, as it arrives.
  It finds duplicates, outliers, short interviews, GPS problems and signs of fabricated interviews, keeps every correction logged and reversible, and exports a Stata do-file that rebuilds the clean data.
  Survey data stays on your computer, and the built-in AI runs locally.
