ShortDescription: A private, searchable memory of everything you see on your PC, with a local AI.
Description: |-
  RecallOS records what is on your screen, reads the text on it, and makes every moment
  searchable by the words that were on screen or by meaning. Ask questions in plain words
  and a local AI model, included in the installer, answers with every claim linked to the
  moment it came from.

  Everything is stored on your PC. There is no cloud, no sync and no telemetry, and the AI
  runs on your own computer. Passwords, card numbers, API keys and other secrets are removed
  before anything is saved, apps can be excluded from recording, and anything recorded can
  be deleted for good.

  It also fills in timesheets from your screen time, drafts pull request descriptions and
  status updates from what you worked on, and restores the windows you had open.
