ShortDescription: A local-first memory layer that records your screen and makes it searchable.
Description: |-
  RecallOS records what is on your screen, extracts the text from it with OCR, and makes
  every moment searchable by the words that were on screen or by meaning. Everything is
  stored on the local machine. There is no account, no sync and no telemetry.

  Version 2 groups those frames into episodes, so asking what you were doing returns the
  span of time, the order things happened in, the sites and documents involved, and the
  sentences that were on screen, each attributed to the frame it came from. It builds a
  graph of the projects, people, websites and topics encountered, and anything recorded
  can be destroyed permanently.

  Password boxes are blurred at the instant of capture, before a frame is written to disk.
  Card numbers, API keys, tokens and other secrets are found in the extracted text and
  blurred out of both the image and the search index. Individual applications can be
  excluded from recording entirely.
