ShortDescription: 在本机识别中文与英文语音的离线语音输入工具。
Description: |-
  Arion 是不离开你电脑的语音输入。在 macOS 或 Windows 的任意应用里听写：Arion 在本机识别中文、英文和中英混说，离线可用，以 AGPL-3.0 开源。
  在任意应用里按下快捷键即可开始说话，中文、英文或中英混合都可以。Arion 在本机完成识别，并把文字输入到光标位置。可以在句中切换中英文，不需要先选语言；说话过程中文字先作为草稿停留在胶囊里，只有整句完成才会写入。
  语音识别在你的设备上运行。一次性下载模型之后，听写不再需要联网，也不会上传任何音频或文字。音频只在本次听写期间留在内存中，不写入磁盘，也不发送；词汇表使用 AES-256-GCM 加密，密钥保存在钥匙串或 DPAPI 中。
  修改 Arion 打错的词，它下次就会照改，并且可以撤销。学到的词加密后留在本机。自带的拼音键盘离线可用，带本地候选排序与词库，轻按 Shift 切换中英文。润色与翻译默认关闭，只有你开启并选择服务商和模型后才会使用云端。剪贴板历史同样默认关闭，开启后在本机加密保存。
