ReleaseNotes: |-
  0.1.7
  English
  Update for macOS Apple silicon (macOS 14 or later) and Windows x64.
  - Turn off Show what you say in Settings › General to keep recognized text out of the pill. The switch stays on until you turn it off. While listening, the pill shows how many words were recognized. After you release, it shows Transcribing… until the outcome. What gets inserted is unchanged.
  - After an update, Settings shows what's new since you last finished or skipped it. Each highlight is a short recording and a few lines, newest first. Skip, Done or Escape remembers this version. About › See what's new opens the newest highlights again. A new install does not show them.
  - On macOS, a login-item start stays in the menu bar. The launch event is read when the app has finished launching, so Settings does not open on its own.
  - On Windows, uninstall still removes the shortcut, the uninstall entry and the installed files when clearing notifications fails. Installing still stops if notification registration fails.
  - On-device recognition can reuse the previous reading of the current segment. The recognizer keeps only text it would have produced itself, and a reading does not carry into the next segment or session.
  - When polishing fails, the local diagnostic log records which step closed and a reason category. The log still omits the text, the prompt and provider details.
  macOS release packages require Developer ID signing and Apple notarization. Windows publisher signing remains unavailable. Model weights download separately. Multi-device sync, Windows edit-learning, clean-machine acceptance, production old-to-new update acceptance, and real-service cloud and translation acceptance remain open. This tag stages the release and opens a GitHub draft; it does not publish the stable update channel. See RELEASE-STATUS.md and SHA256SUMS.
  中文
  适用于 macOS Apple 芯片（macOS 14 或更高版本）和 Windows x64 的更新版本。
  - 在「设置 › 通用」中关闭「显示说的话」，药丸不再显示识别出的文字。这个开关默认开启。听写时，药丸显示已识别的字数。松开后显示「正在转写…」，直到出结果。写入的内容不变。
  - 更新后，设置会显示自上次看完或跳过以来的新功能。每条是一段短录屏和几行说明，最新的在前。跳过、完成或 Esc 会记住这个版本。「关于 › 查看新功能」会再次打开最新的说明。新安装不会显示。
  - 在 macOS 上，登录时启动仍留在菜单栏。启动事件在应用完成启动时读取，因此设置窗口不会自行打开。
  - 在 Windows 上，清除通知失败时，卸载仍会移除快捷方式、卸载项和已安装的文件。安装时若通知注册失败，仍会中止。
  - 本机识别可以把当前这一段的上一次转写交给识别进程作参考。识别器只保留它自己也会写出的文字，这段参考不会进入下一段或下一次听写。
  - 润色失败时，本地诊断日志会记下结束的步骤和原因类别，不记录原文、提示词或服务商信息。
  macOS 发布包要求 Developer ID 签名和 Apple 公证。Windows 仍无发布者签名。模型权重单独下载。多设备同步、Windows 纠错学习、全新机器验收、生产版本跨版本更新，以及云端服务和翻译的实际服务验收仍待完成。此标签会暂存发布并创建 GitHub 草稿，不会发布稳定更新渠道。验收范围及校验信息见 RELEASE-STATUS.md 与 SHA256SUMS。
