ReleaseNotes: "## NextTrace 原生 MTR 与 API v4 / Native NextTrace MTR & API v4\r\n\r\n### 新功能 New Features\r\n• 7e6be33 接入 NextTrace 原生 MTR 模式，不支持或启动失败时静默回退至原持续 Trace 实现 / integrate native NextTrace MTR with silent fallback to the legacy continuous trace implementation\r\n• 7e6be33 支持 NextTrace API v4，可通过内置浏览器完成人机验证并自动提取、确认和保存 Token / support NextTrace API v4 with embedded verification, automatic token extraction, confirmation and storage\r\n• f633ea4 新增 Microsoft Store 打包、签名和测试工具 / add Microsoft Store packaging, signing and testing tools\r\n• 7584047 支持在 Windows、macOS 和 Linux 上使用管理员权限重新启动 / support restarting with administrator privileges on Windows, macOS and Linux\r\n\r\n### 故障修复 Bugfix\r\n• 7e6be33 修复 MTR 模式下界面无响应和内存持续增长的问题 / fix UI freezes and continuously increasing memory usage in MTR mode\r\n• 7e6be33 将 LeoMoeAPI 相关表述统一更正为 NextTrace / replace remaining LeoMoeAPI references with NextTrace\r\n• b1475ce 升级 Eto.Forms 至 2.11.0，提升新版 macOS 上窗口、文本框和 WebView 的稳定性 / upgrade Eto.Forms to 2.11.0 for improved window, text field and WebView stability on recent macOS versions\r\n• 14db666 修复开始追踪时已解析 IP 下拉框内容被清除的问题 / preserve the resolved IP dropdown when starting a trace\r\n• 8c218d7 修复 Linux GTK 环境下地图 WebKit 初始化失败的问题 / fix map WebKit initialization on Linux GTK"
