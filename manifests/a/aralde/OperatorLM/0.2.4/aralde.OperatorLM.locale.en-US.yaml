ShortDescription: Local OpenAI-compatible proxy with multi-provider routing, failover and local GGUF models.
Description: OperatorLM is a tray app that exposes a local OpenAI-compatible endpoint on 127.0.0.1:11434 and routes requests to OpenAI, OpenRouter, Gemini, Azure, Anthropic or your ChatGPT subscription, with retries, circuit breaking and secrets kept in the OS keyring. It can also serve local GGUF chat models, embeddings and speech.
