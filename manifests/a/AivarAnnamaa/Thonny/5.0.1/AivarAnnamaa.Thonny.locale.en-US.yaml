ReleaseNotes: |-
  Thonny 5 is dedicated to Ukraine fighting the Russian invasion. Please support Ukraine!
  Thonny 5 was originally planned to include many new features, but because they are taking longer than expected, we are releasing version 5 as an intermediate bug‑fix release, mainly to add compatibility with newer Python versions. The major version number has been increased only because of dependency upgrades in the bundles. All new features have been moved to the version 6 milestone.

  Changes since 5.0.0
  - Upgrade Python to 3.14.10 in macOS and Windows bundles. This upgrades bundled Tk from 8.6.17 to 9.0.4 (with some extras) and fixes dialog freezes in macOS 27 (#3934).
  - Because of Tk upgrade, several issues involving Unicode characters, especially emojis, got fixed (eg. find/replace in #3925)
  - Fix Plugin manager crashes with NameError: name 'req' is not defined in Thonny 5.0.0, #3932
  - Make installing ESP MicroPython local images working again, #3903
  - Upgrade several dependencies in bundles.
  - Require esptool 5.0, which means require Python 3.10, which means no support Windows 7 and 8 anymore, even by installing older Python and Thonny separately. Yes, this would have technically warranted a major version bump, but the release is otherwise small and the 5.0.0 bundle for Windows also required Windows 10 or 11.
