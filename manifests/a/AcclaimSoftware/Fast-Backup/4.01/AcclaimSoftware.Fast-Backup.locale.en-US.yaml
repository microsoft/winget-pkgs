ShortDescription: Free, open-source incremental backup software for Windows that stores backups as ordinary browsable files.
Description: Fast-Backup copies only files that have changed after the first backup. It stores backups as ordinary files and folders instead of using a proprietary archive, supports file history and point-in-time restore, and can run through its graphical interface or command line.
