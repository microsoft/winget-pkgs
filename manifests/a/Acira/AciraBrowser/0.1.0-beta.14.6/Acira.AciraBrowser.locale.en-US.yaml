ShortDescription: A desktop browser with private and Tor tabs, workspaces and built-in ad blocking.
Description: |-
  Acira Browser is a desktop web browser for Windows, Mac and Linux with built-in Tor, private tabs, and ad and tracker blocking. Keep your tabs in workspaces, use split view, and bring back what you close with a week of Rewind.
  In most browsers, going private means leaving what you're doing for a second window. In Acira, press Ctrl+Shift+P and a private tab opens beside the one you're on. Tor works the same way: one tab through Tor, nothing to install.
  No wallet, no rewards, no sponsored tiles and no account. Ads and trackers are blocked from the start. Tab sleep frees the tabs you aren't using.
  Acira starts clean, and the depth is there when you want it: 12 finishes, four window views, your own shortcuts and command search.
