ReleaseNotes: |-
  What's new
  - Seamless: the sidebar and the top bar reveal again when you come back to Acira from another app. After one click in another app they could stop revealing until something on the page changed (in 14.4 and 14.5).
  - Playing tabs: point at the sound bars and they turn into a mute button. Click to mute or unmute without opening the tab.
  - A playing Favorite shows the same sound bars as a playing tab, blended into its tile.
  - A video you start muted now shows the sidebar player at once, with a muted look. Before, it showed only after you unmuted.
  - Picture in picture: Back to tab always brings you to the tab, also when another app is in front, and for every pop-out (automatic, the site's own button, the right-click menu, the player card or the shortcut). Switching into picture in picture no longer misses.
  - Picture in picture: leaving a split view pops out the video of either pane; a video scrolled out of view still pops out; the next episode or another video taking the small window no longer throws you back to the first tab; a stuck frame in an ad no longer blocks it; a tab put to sleep no longer leaves a dead player card. Only your own press on Back to tab brings Acira in front of another app.
  - Split view: going back to a split no longer blows a page up to double size. The panes arrive in one move.
  - Side panel: a site slides in from its edge in one move, showing its last picture, or the loading dots for a site you never opened. No flash on the first opens.
  - Side panel: six sites fit on one line, and the + never sits alone on a line.
  - Side panel: hold a floating panel by its top and drag it to the left or right of the page; it glides into place. The page beside an open panel now scrolls, takes clicks and typing, and a click on the page no longer closes the panel (the founder's ask).
  - Popups and right-click menus open already at their final look and size, with no flash.
  - Share button, off by default: turn it on from the top bar's right-click or Customize toolbar. It opens a share card with a clean link, copy, a QR code and share targets (a member's idea).
  - Reader mode has a button in the address field, beside the star. It shows only on articles; press it to read, press again to go back (F9 does the same; a member's idea).
  - Back and Forward: right-click or hold them to see the tab's history as a timeline. Click a stop to go there (a member's idea).
  - Uploads open in the last folder you used on that site, and save windows open in the last folder you saved to (a member's report).
  - Easy Files: bigger thumbnails, with the file name under each one (a member's report).
  - Link preview stays with its tab: switching tabs hides it, and coming back shows it as you left it (a member's report).
  - Workspaces: drag a workspace in the switcher to a new place. The + for a new workspace never stands alone on a line (a member's report).
  - The new-workspace and edit forms always fit in the window, so Cancel and Create are never cut off in a short window, and a menu now turns straight into the form, with no blink and no see-through frames.
  - Customize sidebar: switch single icons off in the sidebar foot (Bookmarks, Downloads, History, Settings).
  - Page right-click menu: the extensions' items are one Extensions row that opens them beside the menu (a member's ask).
  - Side panel sites such as WhatsApp and Pinterest: Esc or a click in the page closes their right-click menu (a member's report).
  - Tab menu, Move to workspace: every workspace name lines up, also the last one, and "New workspace…" is there again with 8 or more workspaces: it makes a workspace and moves the tab there as it is (a member's report).
  - Right-click in a text field: "Emoji…" opens the system emoji picker, and the emoji lands in the field (Mac and Windows, a member's idea).
  - Windows: when you make Acira the default in Windows Settings, Acira now knows it and stops offering "Make default". A link with spaces in it, opened from another app, now reaches a tab (also on the Mac).
  - Downloads: one toast per download. The finished one takes the place of the running one.
  - Private windows: no white frame while a page opens.
  - A PDF that a site opens in a pop-up window, such as an admit card or a receipt, now shows its pages. It could stay blank with 0 pages (a member's report).
  - Window opacity at 100% is simply fully solid. It no longer switches Reduce transparency on, so the Noël frost on Favorites stays.
  - With Reduce transparency on, the tab strip on top is one surface with the sidebar, with no dark band.
  - At low window opacity, no seam where the sidebar meets the top bar.
  - Pages start with less work: Acira's own start-up scripts for each page are one instead of eight.
  Known in this build
  - The Windows and Linux changes above were checked in tests, not on a real PC.
  AciraBrowserSetup.exe is the installer; installed copies of Acira update themselves from it. SHA-256 checksums are in SHA256SUMS.txt.
