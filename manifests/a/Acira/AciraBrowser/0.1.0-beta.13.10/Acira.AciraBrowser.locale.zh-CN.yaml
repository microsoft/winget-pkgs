PackageIdentifier: Acira.AciraBrowser
PackageVersion: 0.1.0-beta.13.10
PackageLocale: zh-CN
ShortDescription: 一款支持隐私标签页、Tor 标签页、工作区和内置广告拦截的桌面浏览器。
Description: |-
  Acira Browser 是一款面向 Windows、Mac 和 Linux 的桌面网页浏览器，内置 Tor、隐私标签页以及广告和跟踪器拦截。你可以把标签页放进工作区，使用分屏视图，并借助保留一周的 Rewind 找回你关闭的内容。
  在大多数浏览器中，进入隐私模式意味着丢下手头的事，另开一个窗口。而在 Acira 中，按下 Ctrl+Shift+P，一个隐私标签页就会在你当前标签页旁边打开。Tor 也是如此：一个标签页经由 Tor 访问，无需安装任何东西。
  没有钱包、没有奖励、没有推广磁贴，也不需要账户。广告和跟踪器从一开始就被拦截。标签页休眠会释放你未在使用的标签页。
  Acira 默认保持简洁，深度功能在你需要时触手可及：12 种外观风格、四种窗口视图、自定义快捷键和命令搜索。
