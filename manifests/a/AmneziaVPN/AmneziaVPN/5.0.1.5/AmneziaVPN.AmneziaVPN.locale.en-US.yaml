ReleaseNotes: |-
  Version differences
  Android
  - For Android version 11 and higher, you need to use .apk that start with - AmneziaVPN_5.0.1.5_android11+
  - For Android version 9-10, you need to use .apk that start with - AmneziaVPN_5.0.1.5_android9-10
  - The app version for Android 7 and 8 is temporarily unavailable
  macOS
  !!! The previous version (4.8.8.2 and lower) of the application (installed via the .dmg installer) must be uninstalled via “move to bin” in the applications folder
  - For macOS version 13 and higher, you need to use .pkg - AmneziaVPN_5.0.1.5_macos.pkg
  - The app version for macOS 10.15 - 12, is temporarily unavailable
  Linux
  For Ubuntu you need to install xcb plugin:
  apt install libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libopengl0 libxkbcommon-x11-0
  Changelog
  General
  - Added AWG 3.1 support
  - Improve stability
  Full Changelog: 5.0.0.5...5.0.1.5
  Also we would like to thank Oleg Surnin from Positive Technologies for discovering and reporting a vulnerability in AmneziaVPN. The researchers at Positive Technologies have also prepared a detailed technical report describing the identified issue.
  This vulnerability has been fixed in the current release.
