ReleaseNotes: |-
  Stable downloads: https://download.cmtraceopen.com/?source=github-release
  CMTrace Open v1.5.2
  A focused maintenance release based on v1.5.1. This release includes the Windows clipboard-history fix from #520 and the associated test correction from #559, without pulling the later development work from main into the release.
  Fixed
  - Windows clipboard history (#520): Copies made from the Info pane are now registered in Windows clipboard history (Win+V).
  - Info-pane text selection: Ctrl+C now preserves a selected portion of the message. When no text is selected, it continues to copy the complete log entry.
  - Clipboard mirror test reliability (#559): Tests now advance the hook’s intentional deferred clipboard write before asserting the plugin call.
