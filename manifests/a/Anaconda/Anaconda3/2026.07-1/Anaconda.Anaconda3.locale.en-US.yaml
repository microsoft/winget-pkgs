ReleaseNotes: |-
  Python version: 3.14.6

  User-facing Changes
  - Conda has been updated to v26.5.3. See the conda blog post for highlights about the conda 26.5.x releases.
  - Anaconda3 now ships with Python 3.14 (upgraded from Python 3.13).
  - This release includes the anaconda-channel-guide plugin, which notifies users when packages not found in their configured channels are available through other Anaconda channels, including the new main-x channel.
  - Added jedi and libxml2 to the package list.
  - Removed pycurl and scrapy from the package list.
  - Added architecture checks for macOS PKG and SH installers. Attempting to install a macOS installer onto an Intel Mac will now lead to an error at the beginning of the installation.
  - Updated the macOS PKG installer error message when the target directory already exists. The error message now includes a link to the uninstall instructions.
  - The option to choose a specific install location has been removed from the macOS PKG installers for this release due to a bug specifically with macOS Tahoe (version 26).
  - Each installation now contains an .installer.info file with information about the installer to simplify diagnostics.

  Bug fixes
  - The ~/.anaconda directory is now deleted when choosing to remove user data during uninstallation.
  - Fixed an issue where macOS PKG installers would fail when file ownership in $HOME could not be changed.
  - Fixed a bug in EXE installers that prevented uninstallation if the installation was added to PATH.
  - Fixed a bug for EXE installers that caused package extraction to fail with Windows Defender Application Control.
