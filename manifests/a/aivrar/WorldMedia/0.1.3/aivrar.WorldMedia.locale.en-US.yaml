ShortDescription: Portable player for internet radio, live TV, podcasts, public-domain films and open media archives.
Description: |-
  World Media (Open Media Explorer) brings together internet radio, live television, podcasts, public-domain films, space media, cultural archives, audiobooks, conference recordings, PeerTube and Owncast streams from eleven public sources in one portable Windows app.
  Search everything, save favorites, import M3U/M3U8 playlists, use a ten-band EQ, download finite media and optionally record live streams. No account, subscription, API key or telemetry.
