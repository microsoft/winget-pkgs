ShortDescription: Fold animation for your laptop lid, driven by the best available lid angle source
Description: |-
  Close the lid and the desktop stays anchored in space while the glass tilts over it, blurring and darkening from the hinge outward. Hingewave reads a hinge angle sensor when the laptop has one, falls back to the lid accelerometer on convertibles, and otherwise plays a timed transition from the lid switch. It runs from the tray, captures the primary display only while the lid is moving, and has no network access or telemetry.
