ReleaseNotes: "## This release includes a security fix, so upgrading is strongly recommended.\r\n\r\nA vulnerability was fixed which allowed animated image attachments (APNG, GIF, WebP) to bypass the thumbnail pixel budget, potentially causing multi-gigabyte memory allocation when the thumbnail was rendered.\r\n\r\nMany thanks to the security researcher who responsibly disclosed this issue and helped improve Mailpit's security.\r\n\r\n### Security\r\n• Bound thumbnail decode to single frame ([GHSA-2vgv-6hcp-mf43](https://github.com/axllent/mailpit/security/advisories/GHSA-2vgv-6hcp-mf43))\r\n\r\n### Feature\r\n• Add major version tag for Docker images in workflow ([#734](https://github.com/axllent/mailpit/issues/734))\r\n\r\n### Chore\r\n• Improve message rendering performance with envelope caching\r\n• Update Go dependencies\r\n• Update node dependencies\r\n• Update caniemail test database\r\n\r\n### Fix\r\n• Re-quote local-parts in API JSON responses ([#732](https://github.com/axllent/mailpit/issues/732))"
