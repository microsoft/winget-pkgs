ReleaseNotes: |-
  [4.2.1] - 2026-09-30
  Four New Ways to Connect, and a Round of Repairs
  A patch release that also brings new places to connect: Twake Drive as a native integration, IBM Cloud Object Storage and Mail.ru Cloud as ready presets, and Proton Drive through the official Proton Drive CLI. AeroAgent reaches 1.5, with provider-native reasoning kept across tool calls and approvals that fail closed. Most of the rest is repair: extraction, trash, keystore backups, sync, the CLI and the cloud providers now do what they say, and several of the fixes came from community reports. A full pre-release review read every change since 4.2.0; the defects it found, among them a Mirror that could delete files it had been told to keep and a keystore import that could drop servers, are all fixed here, each with a test that failed before the fix.
  Every change listed here is tracked, with its commit and its discussion, in the release tracker: AeroFTP 4.2.1, known issues, patches and updates.
  What changes for you
  Most of this release is new places to connect and repair, so the short version below is split by where you meet it: what is new, and what stops going wrong. Everything in this list appears again further down with the detail and the commit.
  In the app
  - Four new ways to connect: Twake Drive, IBM Cloud Object Storage, Mail.ru Cloud and Proton Drive. Twake Drive (formerly Cozy Cloud, 5 GB free) is a native provider that signs in against your own instance in the browser, with no vendor app. IBM Cloud Object Storage and Mail.ru Cloud join as ready presets with setup pages on the docs site. Proton Drive works through the official Proton Drive CLI: sign in to Proton in the browser and AeroFTP drives it, with a live check that says whether the CLI is installed and signed in.
  - A failed extraction no longer empties or shortens files you already had. A wrong 7z password could replace an existing file with an empty one, and a truncated zip, tar or 7z extracted short files silently. Entries are now written aside and moved into place only when complete, and a wrong password is named as such.
  - A Mirror keeps what it did not complete, and removing a folder never takes its content along. A file the sync was told to leave alone, or one whose backup copy failed, keeps its folder, and the result says why each folder was kept. Deleting a folder without asking for recursion now refuses one that still holds files, on every backend.
  - AeroSync's versioned backup keeps the old copy on remote destinations too. Before a sync overwrites or deletes a file on a remote, the old copy is moved to the backup folder, and a later Mirror can never delete those copies. The Plan also gains exclude patterns for every pair and shows the matching command-line sync for the same run.
  - Importing a keystore backup shows, server by server, what would change, and lets you choose. New, removed and changed profiles are listed with their field-level differences (never a secret), and a changed profile can take the backup's version, keep this device's, or be kept as both. A "skip existing" import no longer drops the servers you added after the backup.
  - AeroAgent asks for approvals in its own window, and remembers an answer for the rest of the chat. Only that window can grant an approval; allowing a tool for the rest of the chat (off by default, never for delete, trash, shell or extraction) means three folders need one approval instead of three. Stop now also cancels the tools still running, and on a large vault the agent sees every saved server instead of the first fifth.
  - SFTP transfers no longer hang when the server goes away. An upload in flight when the server restarted used to never return; every SFTP transfer now ends as a lost connection that the app reconnects on and the command line retries.
  - Cloud providers no longer act on an item whose name differs only in case. On Google Drive, uploading a.txt beside A.txt overwrote A.txt; similar traps on Box, kDrive, Drime, Internxt and OneDrive are closed, and a trash purge takes only the item trashed from that folder.
  - A rename or move never overwrites what already has the destination name. Several providers replaced the existing file silently, or left two files with one name; every provider now refuses a taken name first.
  - Upload progress is real on Zoho WorkDrive, Koofr, kDrive, 4shared and FileLu. The bar used to sit still and jump to 100 at the end; it now follows the bytes, reaches 100 only when the server has the file, and WorkDrive accepts uploads over 250 MB through its stream upload server.
  - Downloads keep the remote modification time, and WebDAV dates are read. A downloaded file used to get the time of the download, so the next sync saw every one of those files as changed; a second sync after a download is now a no-op.
  - AeroSync Compare warns about the files the remote cannot take. With a remote on one side, it lists the files a sync would send that the remote cannot store, each with its reason (too large, name or path over the provider's documented limit), so you can rename or split before starting.
  - On Linux the app is harder to lose: no more blank window at a cold start, and a crashed web process reloads by itself. The interface is now served by a new built-in server that answers every connection. In-app updates no longer leave a 70 MB package in /var/tmp, and the AppImage runs for every user, including sandboxed starts.
  - Internxt connects again, and implicit FTPS transfers work again. Free Internxt accounts logged in against a host that no longer answers; every implicit FTPS transfer failed in the data handshake. Both are fixed, and a failed Internxt login now says what actually failed.
  - Cyber Tools derives Argon2id keys and computes the BLAKE3 keyed and derive-key modes, locally, pinned against the official test vectors, and nothing is stored: the inputs live in the window only.
  In the CLI and for automation
  - Ctrl-C now stops a transfer and reports it as interrupted. A single-file get, put or pget used to run to its end or hang; every transfer stops in every phase and exits 130 with "status": "interrupted" instead of a misleading success or a retryable failure.
  - One-way sync reaches parity with the app. sync --update, --conflict-mode, --modify-window and --checksum bring the Backup and Update rules to the command line, one modification-time rule applies on every backend, and sync --delete removes the directories it emptied on every backend.
  - Deletes got safer edges. rm without -r refuses a folder that still holds files (exit 9), a percentage --max-delete rounds down so a cap under 100% can never empty a side, and rm --dry-run on a non-empty directory exits 9 like the real run.
  - sync --immutable can no longer drop a transfer silently. A same-size destination counts as skipped, one of another size (usually the partial a cut left behind) is refused instead of overwritten, and batch uploads on providers without a transfer pool sign in once per worker instead of once per file, which removes the login rate limits that cut large uploads.
  - One exclude rule in the app and the CLI. A bare name such as node_modules now excludes the whole directory, matching is case-insensitive, and an invalid pattern is a usage error (exit 5) instead of being dropped without a word. Patterns match more than before, never less, so exclude lists written for the old reading deserve a review.
  - The rclone bridge reads and writes keys the way rclone does. S3, Azure, Swift and B2 keys import exactly as written (a small share used to be stored corrupted, so a profile imported from rclone that fails to sign in should be imported again), Internxt exports to rclone, Drime, Cloudinary and ImageKit round-trip both ways, and secrets stay out of the JSON report.
  - AeroAgent 1.5 keeps reasoning state across tool calls and fails closed. Modern providers keep their native reasoning between steps, a changed provider or model cannot replay another turn, --auto-approve high stops short of delete and shell, and agent --provider anthropic reaches the right endpoint again.
  - Recursive downloads honour the multi-thread settings. get -r, glob get and sync downloads now follow --multi-thread-streams and --multi-thread-cutoff instead of always using the measured default, and print the policy they use.
  Added
  - AeroAgent 1.5: modern provider contracts and native tool continuations. Reasoning models keep their provider-native state across tool calls (OpenAI Responses, Anthropic content blocks, compatible Chat), with scope checks so a changed provider, model or endpoint cannot replay another turn. NVIDIA and Alibaba Model Studio capabilities are discovered exactly and public OpenRouter metadata enriches its models; custom providers can be added more than once and named. The Send button becomes Stop during generation. Each turn starts with four core tools and loads more through a local tool search that never grants approval. aeroftp-cli agent --provider anthropic reaches the right endpoint again, Ctrl-C exits 130 with the partial answer, and provider errors reach the user bounded and with keys removed (#948).
  - One modification-time rule for sync, and CLI one-way sync at parity with the GUI. Two times within 2 s are the same instant, the window follows the precision each backend keeps (size only where a backend has no comparable time, stated), one date parser replaces thirteen, and a pair with the same date is never decided by its size. CLI one-way sync gains the GUI's Backup and Update rules: --update, --conflict-mode source|skip, --modify-window, --checksum against server checksums, and safe removal of directories emptied by --delete; every pair left open is reported. AeroCloud waits for a file to be quiet before sending it and reports one that keeps changing instead of marking it synced (#949).
