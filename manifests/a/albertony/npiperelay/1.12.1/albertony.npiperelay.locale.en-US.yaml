  a13700a3a491f329b4c2e31c2ab3efb72f60011c01b0f2044b2b7475e2e80aed  npiperelay_windows_386.zip
  dbb448aea38835a65e2e10d83e2dd770a8e4dfa5f43b5669d7551a3125445ca4  npiperelay_windows_amd64.exe
