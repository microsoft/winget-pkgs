ReleaseNotes: |-
  Fixed
  - A long silent rustic call is no longer stopped as stalled on macOS and Windows (#43)
  - Hooks that print no longer break reading rustic's output (#40)
  - Stop the server on Ctrl-Break on Windows (#36)
  - Commands no longer hang on Windows while the server runs (#35)
  - Show which run holds the lock that a run waits for (#26)
  Backup
  - A killed run leaves no rustic running on Windows (#38)
  Cli
  - Draw notify, install and update as step trees (#54)
  Install
  - Let package manager handle updates (#41)
  - Sign the macOS app again after an update replaces its executable (#19)
  Web
  - Browse, search and download Windows snapshots (#37)
  Translated
  - Translate into Italian (#25)
