ShortDescription: The Autohand coding agent for the terminal.
Description: |-
  Autohand Code is a self-evolving AI coding agent that runs in your terminal. It combines reasoning, file edits, shell commands, and web context in one interactive loop.
  It works with multiple LLM providers, including OpenRouter, OpenAI, AWS Bedrock, DeepSeek, Azure, Z.ai, and local models through Ollama, llama.cpp, and MLX. Autohand Code integrates with Git, extends through modular skills, hooks, and an Agent SDK, and supports Agent Client Protocol (ACP) mode for editors such as Zed and JetBrains IDEs.
