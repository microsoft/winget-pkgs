PackageIdentifier: Autohand.AutohandCodeCLI
PackageVersion: 0.9.9
PackageLocale: zh-CN
ShortDescription: 面向终端的 Autohand 编程智能体
Description: |-
  Autohand Code 是一个在终端中运行的自进化 AI 编程智能体。它将推理、文件编辑、Shell 命令和网页上下文结合在同一个交互循环中。
  它支持多种大语言模型提供商，包括 OpenRouter、OpenAI、AWS Bedrock、DeepSeek、Azure、Z.ai，以及通过 Ollama、llama.cpp 和 MLX 运行的本地模型。Autohand Code 可与 Git 集成，通过模块化技能、钩子和 Agent SDK 进行扩展，并支持面向 Zed、JetBrains IDE 等编辑器的智能体客户端协议（ACP）模式。
