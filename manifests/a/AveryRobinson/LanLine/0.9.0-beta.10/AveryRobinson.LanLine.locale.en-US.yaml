ShortDescription: A pinned window on your Mac and PC. Drop files, folders, screenshots or text on one, grab them on the other, over your local network.
Description: |-
  Lan-Line is a small always-on-top window on a Mac and a Windows PC on the same network. Text, files, whole folders and pasted screenshots dropped on one computer appear on the other straight away, in both directions; up to 8 computers can be paired, and Send goes to everyone or to one. It notifies you when something arrives, shows big transfers as they go and carries on after a dropped connection, can share the clipboard if you turn that on, and keeps a searchable history on each computer.
  Everything goes directly between the computers, encrypted end to end; there are no servers or accounts. Lan-Line goes online only to check for an update, to download an update you chose to install, and, if you turn link previews on, to fetch the pages of links you receive.
  This is a public beta and isn't code-signed yet.
