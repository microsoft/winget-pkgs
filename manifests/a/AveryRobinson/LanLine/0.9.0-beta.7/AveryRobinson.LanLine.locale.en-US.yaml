ShortDescription: A pinned window on your Mac and PC. Drop files, folders, screenshots or text on one, grab them on the other, over your local network.
Description: |-
  Lan-Line is a small always-on-top window on a Mac and a Windows PC on the same network. Text, files, whole folders and pasted screenshots dropped on one computer appear on the other straight away, in both directions; up to 8 computers can be paired, and Send goes to everyone or to one.
  Everything goes directly between the two computers, encrypted end to end; there are no servers or accounts. Lan-Line only goes online when you click Check for Updates or turn on daily checks.
  This is a public beta and isn't code-signed yet.
