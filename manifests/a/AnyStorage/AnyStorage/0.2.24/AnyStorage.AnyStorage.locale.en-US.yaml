ShortDescription: Browse and mount object storage, cloud drives, WebDAV, FTP and SFTP from one desktop workspace.
Description: >-
  AnyStorage brings local files, object storage, cloud drives and standard file
  protocols into a single desktop workspace. It connects to 20+ storage types,
  including Amazon S3, Cloudflare R2, Backblaze B2, Google Cloud Storage, Azure
  Blob, Alibaba OSS, Tencent COS, OneDrive, Google Drive, Dropbox, WebDAV, FTP
  and SFTP. A built-in WebDAV server can expose every connection as a local
  network drive, so connected storage is mountable directly in File Explorer.
  Tabbed browsing, a Transfer Station that tracks uploads and downloads,
  presigned upload and download links, prefix search and inline previews for
  images, text and audio cover everyday file work. Connection credentials stay
  on the local machine and no account is required; the free tier allows
  commercial use.
