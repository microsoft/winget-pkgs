ReleaseNotes: |-
  AtomCode v5.2.8 Release Notes
  发布日期：2026-11-20
  v5.2.8 把「从其他 AI 编程工具迁移过来」做成了真正可用的入口（atomcode import / /import），并补齐结构化 Git 状态、视觉预处理模型配置、托管网页搜索与多后端自动故障转移。稳定性方面重点治理长思考与流式传输，会话、压缩、后台任务、团队与子 agent 减少了竞态与空转，终端新增首次模型配置与登录恢复引导。

  ⚠️ Behavior Changes（注意行为变化）
  - 连续思考不再按时长中断：移除思考累计时长上限与相关手动/自动恢复路径，只要模型持续产出思考内容就继续等待；首响应超时与流空闲超时仍然生效，且思考内容会刷新流空闲计时。
  - 工具审批需显式确认：TUI 工具审批弹出时，普通字符键回到输入框、不再被面板吞掉；审批必须通过可见的确认操作完成，草稿与输入法不受影响。
  - 权限规则按字面保存：Bash 权限规则不再展开通配符，保存的是用户输入的原始命令文本。
  - 网页搜索选择迁移为 auto：旧的 Exa 搜索选择会一次性迁移为 auto，由路由与故障转移决定实际后端。

  ✨ 新增功能（Features）
  外部 Agent 资产迁移
  - atomcode import 命令：扫描 Claude Code、Codex、OpenCode 留下的指令、技能、MCP 与 provider 配置，逐项说明哪些已在生效、哪些可迁移、哪些带不走。
  - 迁移报告与写入：--json 输出机器可读报告，--apply 逐项确认后写入，--yes 跳过无明文凭据的确认项。
  - TUI /import 面板：会话中以底部面板完成同一套扫描与导入流程；存在多个来源时才询问要迁移哪一个。
  - 凭据处理：provider 账号凭据只按类型比对、不读取明文；已在配置中的账号标记为「已导入」，不重复写入。
  - 报告可信度：报告与运行时共用同一套技能目录解析规则，不会声称某个技能已生效而运行时并不读取；有意留空的部分会体现在退出码上，脚本不会把「没导进去」读成成功。
  结构化 Git 状态
  - git_status 工具：一次返回分支、HEAD、upstream、领先/落后提交数，以及已暂存、未暂存、未跟踪与冲突路径。
  - 路径语义明确：路径相对仓库根，不含子模块内部改动；只读、不发起 fetch，比较不可用时返回空值而不是猜测。
  - 未推送提交检测：模型可直接判断本地是否存在未推送提交，减少误判工作区状态。
  视觉预处理与网页搜索
  - 视觉预处理模型配置：可在 TUI 与 WebUI 配置视觉预处理（VL）模型，多模态请求按配置走独立 provider 与独立流式路径。
  - 托管网页搜索后端：网页搜索新增托管后端，并按路由顺序在多个服务商之间自动故障转移。
  Provider 与模型
  - 厂商协议选择：配置服务商时可直接选择厂商协议，覆盖不同端点与鉴权方式。
  - 模型发现更可信：保留服务商返回的错误；只有协议或端点确实不支持列出模型时，才回退到 models.dev 目录候选。
  - 预设扩充：新增阿里、小米、Kimi、腾讯等预设，并区分订阅凭据与套餐地址。
  - 单模型输出预算：支持为单个模型配置输出 token 预算，CodingPlan 模型按目录生效。
  - 按模型指定账号：CodingPlan 支持为单个模型指定 provider_account，并自动识别网关白名单。
  - 换模型上下文预警：切换模型时按新模型的上下文窗口提示下一条消息可能超出窗口或即将触发自动压缩；窗口未知时保持静默。
  - 思考档位继承：配置了思考档位的模型，其辅助调用（会话标题、压缩摘要等）继承模型默认档位，显式指定时以显式值为准，日志记录实际下发档位与来源。
  会话与压缩
  - 缓存安全的压缩分叉：压缩摘要在分叉会话中复用父会话已发送的温前缀，减少重复投递带来的缓存失效。
  - 长历史分段总结：超长历史在可恢复窗口内分段总结，避免一次压缩失败即丢失上下文。
  - 回退存储保留上限：回退点存储增加保留上限，快照不再无限累积。
  - 项目知识按需查阅：项目知识索引提供适用范围、关联理由与文件路径，模型按需查阅相关笔记与原始证据。
  代码评审
  - 耗时追踪与 Git 证据：评审可追踪各阶段耗时，并共享 Git 证据作为判断依据。
  - 候选验证收敛：候选验证范围收敛到改动文件，减少无关读取。
  - 大批量评审分批：大型评审分批执行，超时时报告已完成的范围而不是整体失败。
  TUI 体验
  - 首次运行模型配置引导：欢迎页可直接登录 CodingPlan 或选择服务商，授权链接可点击打开或按 c 复制。
  - 登录过期恢复：退出登录或登录过期后提示使用 /login 或 /provider，恢复登录时保留已写草稿。
  - 主题设置快捷键：/theme 直接打开主题设置，重启后应用更改。
  - 斜杠菜单可搜索：按命令说明搜索斜杠命令，而不仅按命令名匹配。
  - @ 会话引用增强：可查找本机其他工作目录的会话，也可切换到「会话 · 本工作区」缩小范围；支持按会话 ID 与预览文字搜索，未命名会话用已保存的首条用户消息做预览，首轮未结束时也能显示。
  - diff 换行策略：可配置长 diff 行的换行显示策略，窄屏下超长行不再被直接截断。
  - 生成速度统计：生成速度按流式输出的实际产出统计。
  - SSH 凭据管理：TUI 内可管理已保存的 Git SSH 凭据，并诊断无人值守场景下的凭据问题、抑制多余提示。
  WebUI 体验
  - 工作区统一文件预览：文件预览在工作区内统一呈现，并可从 Git 面板直接链接跳转。
  - 会话浏览增强：以只读方式展示被其他运行时持有的会话及其活动，可为会话创建独立分叉。
  - 模型选择整合：模型选择与思考强度合并为一个控件，保留模型标签并按时间顺序导航回合。
  - 移动端与深色模式：移动端可通过触摸点击操作输入区控件，离线页面在深色模式下更易辨认。
  IDE 插件
  - VS Code 字号缩放：聊天面板支持 Ctrl（macOS 为 Cmd）+ 鼠标滚轮实时缩放字号，atomcode.fontSize 改动后立即生效，无需重载窗口；正文与代码块字号联动缩放。

  🛠 修复（Fixes）
  长思考与流式传输
  - 思考预算与用量：修复 reasoning_without_output 预算不随思考增量重置、重试成倍叠加导致的单轮长时间挂起与用量丢失问题。
  - SSE 行上限：Anthropic、Ollama、Responses 解码器为单行设置 16 MiB 上限，超长行或未结束尾部以终态错误结束流；只扫描新增字节，不再逐行重扫缓冲区。
  - 严格 schema 平台 400：工具 schema 中缺省类型的标量 enum 补上类型标注，修复火山 kimi-k3-1-pro 等严格校验平台返回 400 InvalidParameter。
  - 重试噪声：自动重试不再刷满对话记录，同组重试合并展示；清理请求重试中残留的临时提示。
  - 被拒流诊断：修复被拒绝与 EOF 流上仅上报缓存创建用量的问题，并保留被拒绝流的关键诊断信息。
  会话 / 压缩 / 恢复
  - 压缩失败可分辨：压缩失败与「无需压缩」分开报告并保留诊断，失败原因可追溯。
  - 摘要误判：模型在总结阶段请求调用工具时视为总结未完成，不再产出半成品摘要。
  - 工具输出预览：压缩后的长工具输出预览保留首尾，末尾的错误与退出信息不再丢失。
  - 会话切换拒绝：恢复被拒绝的会话切换时提示具体原因，Unavailable / Stale 类型在嵌入边界上不再丢失。
  - 中途中断的回合：恢复时明确报告回合中途结束，而不是默默清空。
  - 回退失效：检查点保留失败时对话回退仍然生效。
  - 流中断：修复 WebUI 会话中断后响应流未能正确结束的问题。
  Provider / 网络
  - Termux 登录：系统解析器不可用时改用 Termux 的 DNS 配置，修复静态链接版读不到解析配置而回落到环回地址、导致无法登录的问题。
  - 退出登录保留外部服务商：退出登录不再清空外部模型 provider 配置。
  - 模型元数据回退：模型元数据缺失时回退到规范元数据与 models.dev 目录，界面不再显示空标签。
  - 响应头超时：延长响应头等待并在自动重试时保持安静。
  - 远端任务恢复：保留中继诊断信息，便于远端任务恢复时定位问题。
  后台任务 / 团队 / 子 agent
  - 后台等待与唤醒对齐：后台任务等待与宿主唤醒策略一致，取消等待有界后再关闭运行时。
  - 待处理请求与统计开销：保留待处理请求并限制 git 统计开销。
  - 团队空转：团队成员不再反复轮询状态，并能解析带限定名的模型路由。
  - 只读委派：子 agent 支持只读的 Grok 与 OpenCode 委派，委派前先做前置检查并明确报告阻塞原因。
  - 失败任务展示：失败的后台任务不再出现在团队条上。
  代码智能 / 工具
  - LSP diagnostics 恒为空：Windows 上服务端返回的 URI（小写盘符与百分号编码的冒号）与打开文档时的 URI 不一致导致整条推送被丢弃，现按文件系统路径身份归一化后匹配。
  - 提示词证据链：系统提示词要求把重要结论落在检查过的证据上，区分观察与推断，如实报告未执行或失败的检查。
  - 批量替换写入恢复：批量搜索替换写入失败时，尽力恢复已写入且仍可验证的文件并报告恢复结果。
  - todowrite 回显瘦身：全量计划回显改为状态计数，减少无关输出。
  - AtomGit 工具容错：工具参数容错解析，写路径统一给出 UN_KNOW 自纠错提示。
  - grep 性能：敏感路径检查不再逐文件做 JSON 往返，并保留单引号路径边界。
  - 图片请求校验：校验模型请求中的图片并恢复此前被误拒的请求。
  WebUI
  - 滚轮回跳：修复浏览会话时聊天渲染被替换、滚动位置跳到前几轮的问题。
  - 回合导航与时间线：保留时间线窗口、刷新回合导航，回合高亮可越过已完成的回复尾部。
  - 本地文件链接：本地文件链接在所属会话中预览，不再跳到错误上下文。
  - Windows 动态端口：未指定端口且默认端口段不可用时，WebUI 使用系统分配的端口。
  - 工作台 Git 空状态：目录未初始化 Git 时工作台显示空状态而不是报错。
  - 只读会话实时状态：只读浏览会话时仍展示实时状态。
  - 运行时模式保留：实时快照中保留运行时模式，不再被覆盖。
  TUI
  - 新会话首轮引用：修复首轮未结束时 @ 会话引用拿不到预览的问题。
  - 复制用户消息：复制用户消息时排除展示用提示。
  - 光标与占位符：使用闪烁竖线光标，空输入框的占位文字为光标留出一格。
  - 本地 shell 输入输出：本地 shell 交互的输入与输出展示更清晰。
  权限 & 安全
  - 托管非交互审批：--require-approval-hook 要求配置覆盖所有工具的用户级审批 Hook；Hook 未明确放行、超时或执行失败时阻止工具调用。
  - 遥测脱敏：上报前先清洗更长的路径，provider 错误在发送前脱敏。
  - 凭据静默提示：无人值守场景下抑制不必要的凭据弹窗。
  其他
  - 卸载凭据清单：卸载时保持回退的 SSH 凭据清单同步。
  - 版本回退：回退版本后，下次启动尊重回退选择，抑制此前暂存的自动升级。
  - 计划任务参数校验：atomcode schedule 校验 CLI 输入并遵循通知策略。

  📚 文档（Docs）
  - 新增 docs/git-auth.md，说明 Git 凭据托管与无人值守场景的处理方式。
  - 新增外部 Agent 资产迁移的设计与实施文档，涵盖扫描报告与 provider 导入。
  - 补充 Termux DNS 排障文档与权限模型说明。
  - 新增 v5.2.8 中英文更新日志节，并在站点侧同步版本信息。
