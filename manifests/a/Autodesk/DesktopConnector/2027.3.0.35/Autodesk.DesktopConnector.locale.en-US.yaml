ShortDescription: A desktop application that streamlines file management by syncing files to the cloud while understanding design file relationships.
Description: |-
  Desktop Connector seamlessly integrates with your device, enabling you to sync, manage, and access local and cloud files effortlessly. It preserves file relationships and references, ensuring design integrity and reducing errors. With Desktop Connector, you can:
  - Visualize complex file references
  - Maintain up-to-date project information
  - Streamline collaboration across your team
ReleaseNotes: |-
  Download Desktop Connector v2027.3.0.35

  Important:
  If you are upgrading from a previous major release (for example, 17.x to 2027.x), we recommend running the Reset Utility, uninstalling, and then reinstalling. For minor release upgrades, you can upgrade in place. For complete instructions, see Update Desktop Connector for manual installs and Admin deployment guide for administrator deployment installs.

  What's new
  - Data Panel is now the Details Panel: The Data Panel is now called the Details Panel everywhere it appears in Desktop Connector, including the home page task menu and settings. For Autodesk Forma files, the Details Panel shows the same file attributes that the Data Panel showed. Learn more about the Details Panel.
  - File thumbnail in the Details Panel: The Details Panel now shows a thumbnail of the selected file so you can confirm it is the right file before you open or edit it. If a thumbnail is not available, the panel shows the file type icon instead.
  - Generate a preview from the Details Panel: For Autodesk Forma files, you can now select Generate Preview in the Details Panel to create a viewable for the selected file, similar to Process for viewing. When it is ready, you can view and interact with the preview in the panel. Generate Preview is intended primarily for Autodesk Forma 3D viewables. It is not available for Autodesk Fusion connected drives or for file types that cannot be previewed in the viewer, such as Microsoft Office documents or text files.
  Enhanced user experience
  - Clearer permission update messages: Messages about permission updates now use clearer wording, so routine permission checks that resolve on their own no longer look like errors.
  - Clearer notification for archived files: When a file cannot be downloaded because it has been archived, the download notification now explains that the file is unavailable, instead of showing a generic service error.
  - Smoother updates: You no longer need to shut down Desktop Connector manually before updating. Desktop Connector now handles the update for you.
  Bug fixes and stability
  Permissions
  - Reduced repeated permission checks during sync: Addressed an issue where Desktop Connector could schedule a permission check on every sync cycle for projects whose permissions had not changed. Desktop Connector now schedules a permission check only when needed.
  - Resolved Home screen stuck on "Can't update permissions": Addressed an issue where the home screen could stay on "Can't update permissions" for a project when a folder kept changing while permissions were being applied.
  - Less frequent retries for permission updates that cannot finish: When a permission update cannot finish, Desktop Connector still tries again automatically, but now does so less frequently and tries it again after a restart or when you re-add the project. This reduces background activity and helps keep Desktop Connector responsive.
  Sync reliability
  - Resolved folder move not syncing after an offline rename: Addressed an issue where, if you renamed a folder while offline and another user moved the same folder, Desktop Connector synced the rename but not the move when you reconnected. Desktop Connector now applies both changes or shows a conflict so you can resolve it.
  - Resolved syncing paused: Addressed an issue where Desktop Connector could stop syncing and show the message "Syncing is paused until the Desktop Connector update is complete." This affected users who have access to Autodesk Forma projects or Autodesk Fusion projects, but not both. Syncing now continues as expected.
  - Resolved unintended conflicts after upgrading to 2027.2.x: After upgrading from a previous version of Desktop Connector to 2027.2.x, you could see a conflict on a file that only you were editing. These conflicts affected only that user and were caused by a mismatch in the Desktop Connector database created during the upgrade. Desktop Connector 2027.3.0 includes a fix that repairs the database automatically when you upgrade.
