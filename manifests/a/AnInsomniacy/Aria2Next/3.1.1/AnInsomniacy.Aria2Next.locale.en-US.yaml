ShortDescription: Maintained aria2 fork with extensive bug fixes and modernized architecture
Description: |-
  aria2 is remarkable open source software. For over a decade it has been one of the most capable
  download engines available, trusted by countless tools and users worldwide. We are deeply grateful
  to the original authors and contributors of the aria2 project. They built something that has stood
  the test of time, and that enduring quality is the best testament to their vision and craftsmanship.

  But upstream development has slowed dramatically in recent years. Dependencies grew stale, builds
  broke on modern platforms, and a backlog of bugs went unaddressed. We picked up the baton: migrated
  the codebase to a modern build framework, triaged and fixed a substantial number of upstream issues,
  and introduced ED2K protocol support for the first time. A full audit trail is preserved in
  docs/maintenance/upstream-issue-review/matrix.csv.

  Aria2 Next is an actively maintained aria2-compatible engine for everyone, and it is also the embedded
  engine used by Motrix Next. Original interfaces, including options, configuration, sessions, JSON-RPC,
  and libaria2, remain intact so downstream projects get a seamless upgrade. The focus is straightforward:
  release reliability, current dependency baselines, and ongoing compatibility fixes. Same engine, renewed
  foundation.
ReleaseNotes: |-
  ## Summary

  Aria2 Next 3.1.1 fixes a crash when moving a paused torrent, makes the shutdown methods answer before the daemon exits, and lets removed downloads resume correctly when they are added again. It also fixes BitTorrent with a relative `--dir` on Windows, refills the queue when a download starts seeding under `--detach-share-only`, and numbers media outputs that would collide. Release assets cover the same seven platforms.

  ### Fixed

  • `aria2.moveDownload` no longer crashes the daemon on a paused multi-file torrent whose files have not been read or written in this session ([#92](https://github.com/AnInsomniacy/aria2-next/issues/92)).
  • `aria2.shutdown` and `aria2.forceShutdown` return their `"OK"` over HTTP and WebSocket before the daemon exits. The server stops accepting connections, then waits up to two seconds for replies to requests it has already read ([#93](https://github.com/AnInsomniacy/aria2-next/issues/93)).
  • BitTorrent downloads work with a relative directory such as the default `--dir=.` on Windows. Save paths are now absolute and normalized, because Windows extended-length paths take a `.` component literally ([#91](https://github.com/AnInsomniacy/aria2-next/issues/91)).
  • With `--detach-share-only`, a download that finishes and starts seeding frees its place in `--max-concurrent-downloads` at once, so the next queued download starts ([#89](https://github.com/AnInsomniacy/aria2-next/issues/89)).
  • Removing an unfinished HTTP download keeps its resume record while the file stays on disk. Adding the same file again with `--continue` resumes from the bytes actually written, instead of treating a preallocated multi-connection file as complete. On startup, records whose files were deleted are discarded; records on directories that are not present, such as an unmounted drive, are kept ([#90](https://github.com/AnInsomniacy/aria2-next/issues/90)).
  • A media download whose output name is already being written by another task gets the next numbered name, so two streams with the same name download side by side ([rayburst#819](https://github.com/AnInsomniacy/rayburst/issues/819)).

  ### Changed

  • The `--http-accept-gzip` description states when decoding applies：single-stream downloads decode gzip and deflate bodies, while ranged requests ask for identity encoding, as browsers do ([#88](https://github.com/AnInsomniacy/aria2-next/issues/88)).

