Description: |-
  aria2 is remarkable open source software. For over a decade it has been one of the most capable
  download engines available, trusted by countless tools and users worldwide. We are deeply grateful
  to the original authors and contributors of the aria2 project. They built something that has stood
  the test of time, and that enduring quality is the best testament to their vision and craftsmanship.

  But upstream development has slowed dramatically in recent years. Dependencies grew stale, builds
  broke on modern platforms, and a backlog of bugs went unaddressed. We picked up the baton: migrated
  the codebase to a modern build framework, triaged and fixed a substantial number of upstream issues,
  and introduced ED2K protocol support for the first time. A full audit trail is preserved in
  docs/maintenance/upstream-issue-review/matrix.csv.

  Aria2 Next is an actively maintained aria2-compatible engine for everyone, and it is also the embedded
  engine used by Motrix Next. Original interfaces, including options, configuration, sessions, JSON-RPC,
  and libaria2, remain intact so downstream projects get a seamless upgrade. The focus is straightforward:
  release reliability, current dependency baselines, and ongoing compatibility fixes. Same engine, renewed
  foundation.
ReleaseNotes: |-
  ## Summary
  Aria2 Next 3.0.1 fixes regressions found in 3.0.0. 
  Linux builds no longer crash when BitTorrent starts, compressed subtitle tracks are readable again, and live global option changes now reach tasks that are already running. 
  Command line, configuration files and JSON-RPC are unchanged, and release assets cover the same seven platforms.

  ### Fixed
  Linux: the engine no longer crashes with a segmentation fault as soon as the BitTorrent session starts https://github.com/AnInsomniacy/aria2-next/issues/65. 
  libtorrent was built as C++17 while the engine is C++20, so the two disagreed on the layout of shared Asio types; libtorrent now builds with the engine's standard.
  Changing a live global option with aria2.changeGlobalOption, such as bt-first-last-piece-first or force-sequential, now applies to running tasks that inherit it, instead of only after they restart.

  ### Changed
  --http-accept-gzip defaults to true again, as in 2.8.x. 
  Servers that compress subtitle tracks regardless of the request no longer leave them saved compressed and unparsable https://github.com/AnInsomniacy/aria2-next/issues/64.
  Linux and macOS release builds, and CI, start a real BitTorrent session over RPC before assets are published.

  ### Downloads
  The release workflow builds the following standalone executables and uploads SHA-256 checksums:

  | Platform | Asset |
  | --- | --- |
  | Linux x86_64 | `aria2-next-3.0.1-linux-x86_64` |
  | Linux ARM64 | `aria2-next-3.0.1-linux-aarch64` |
  | macOS Apple Silicon | `aria2-next-3.0.1-macos-arm64` |
  | macOS Intel | `aria2-next-3.0.1-macos-x86_64` |
  | Windows x86_64 | `aria2-next-3.0.1-windows-x86_64.exe` |
  | Windows ARM64 | `aria2-next-3.0.1-windows-arm64.exe` |
  | Android ARM64 | `aria2-next-3.0.1-android-arm64` |
  | SHA-256 checksums | `aria2-next-3.0.1-checksums.sha256` |

