ShortDescription: Maintained aria2 fork with extensive bug fixes and modernized architecture
Description: |-
  aria2 is remarkable open source software. For over a decade it has been one of the most capable
  download engines available, trusted by countless tools and users worldwide. We are deeply grateful
  to the original authors and contributors of the aria2 project. They built something that has stood
  the test of time, and that enduring quality is the best testament to their vision and craftsmanship.

  But upstream development has slowed dramatically in recent years. Dependencies grew stale, builds
  broke on modern platforms, and a backlog of bugs went unaddressed. We picked up the baton: migrated
  the codebase to a modern build framework, triaged and fixed a substantial number of upstream issues,
  and introduced ED2K protocol support for the first time. A full audit trail is preserved in
  docs/maintenance/upstream-issue-review/matrix.csv.

  Aria2 Next is an actively maintained aria2-compatible engine for everyone, and it is also the embedded
  engine used by Motrix Next. Original interfaces, including options, configuration, sessions, JSON-RPC,
  and libaria2, remain intact so downstream projects get a seamless upgrade. The focus is straightforward:
  release reliability, current dependency baselines, and ongoing compatibility fixes. Same engine, renewed
  foundation.
ReleaseNotes: |-
  ## Summary

  Aria2 Next 3.0.6 shares a server's connections fairly between downloads when the server limits them, and keeps parallel connections for servers that answer a range request with a 206 but no Content-Range. Release assets cover the same seven platforms.

  ### Changed

  • Downloads from one server now share its connections. When the server refuses requests with 429 or 503, its limit is set to the connections it was serving across all downloads; each download keeps at least one connection and the rest are split by remaining bytes. A small download started first no longer starves a large one, and the server sees fewer refused requests. The limit drops at most once per window and grows back while the server stays calm, refusals in a row lengthen the pause before new requests, and Retry-After applies to the whole host. A server is asked afresh once no download uses it any more ([#71](https://github.com/AnInsomniacy/aria2-next/issues/71)).

  ### Fixed

  • A 206 without Content-Range is placed by its Content-Length when that spans exactly the requested range, as RFC 9110 allows. Downloads from such servers keep their parallel connections instead of falling back to a single connection from byte zero; If-Range still guards the file. A `bytes=` prefix in Content-Range is accepted ([rayburst#734](https://github.com/AnInsomniacy/rayburst/issues/734)).

