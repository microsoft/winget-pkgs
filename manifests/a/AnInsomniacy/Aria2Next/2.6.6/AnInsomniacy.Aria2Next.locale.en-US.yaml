ShortDescription: Maintained aria2 fork with extensive bug fixes and modernized architecture
Description: |-
  aria2 is remarkable open source software. For over a decade it has been one of the most capable
  download engines available, trusted by countless tools and users worldwide. We are deeply grateful
  to the original authors and contributors of the aria2 project. They built something that has stood
  the test of time, and that enduring quality is the best testament to their vision and craftsmanship.

  But upstream development has slowed dramatically in recent years. Dependencies grew stale, builds
  broke on modern platforms, and a backlog of bugs went unaddressed. We picked up the baton: migrated
  the codebase to a modern build framework, triaged and fixed a substantial number of upstream issues,
  and introduced ED2K protocol support for the first time. A full audit trail is preserved in
  docs/maintenance/upstream-issue-review/matrix.csv.

  Aria2 Next is an actively maintained aria2-compatible engine for everyone, and it is also the embedded
  engine used by Motrix Next. Original interfaces, including options, configuration, sessions, JSON-RPC,
  and libaria2, remain intact so downstream projects get a seamless upgrade. The focus is straightforward:
  release reliability, current dependency baselines, and ongoing compatibility fixes. Same engine, renewed
  foundation.
ReleaseNotes: |-
  ## Summary

  Aria2 Next 2.6.6 improves Windows HTTPS availability and makes HTTP existing-file and resume handling safer. The release provides standalone binaries for Linux, macOS, Windows, and Android, together with SHA-256 checksums.

  ### Changed

  • HTTP downloads using `--continue` now inspect remote metadata before accepting an untracked existing file.
  • Equal-length files complete without downloading payload data, while shorter files resume only after the server confirms byte-range support.
  • `--allow-overwrite` now takes explicit precedence over `--continue` for untracked output files.

  ### Fixed

  • Windows Schannel downloads no longer fail only because a certificate revocation service is unavailable. Explicitly revoked and otherwise invalid certificates remain rejected.
  • HTTPS proxy connections use the same native best-effort revocation policy as direct HTTPS connections.
  • TLS failures after redirects no longer inherit a misleading HTTP redirect status in diagnostics.
  • Longer local files and servers that cannot safely resume are preserved and reported as errors instead of being silently overwritten.
  • Existing-file inspection now handles valid range responses, HEAD fallback, and unsatisfied range responses consistently.

  ### Downloads

  | Platform | Download |
  | --- | --- |
  | Linux x86_64 | `aria2-next-2.6.6-linux-x86_64` |
  | Linux ARM64 | `aria2-next-2.6.6-linux-aarch64` |
  | macOS Apple Silicon | `aria2-next-2.6.6-macos-arm64` |
  | macOS Intel | `aria2-next-2.6.6-macos-x86_64` |
  | Windows x86_64 | `aria2-next-2.6.6-windows-x86_64.exe` |
  | Windows ARM64 | `aria2-next-2.6.6-windows-arm64.exe` |
  | Android ARM64 | `aria2-next-2.6.6-android-arm64` |
  | Checksums | `aria2-next-2.6.6-checksums.sha256` |
