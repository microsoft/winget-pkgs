ShortDescription: Maintained aria2 fork with extensive bug fixes and modernized architecture
Description: |-
  aria2 is remarkable open source software. For over a decade it has been one of the most capable
  download engines available, trusted by countless tools and users worldwide. We are deeply grateful
  to the original authors and contributors of the aria2 project. They built something that has stood
  the test of time, and that enduring quality is the best testament to their vision and craftsmanship.

  But upstream development has slowed dramatically in recent years. Dependencies grew stale, builds
  broke on modern platforms, and a backlog of bugs went unaddressed. We picked up the baton: migrated
  the codebase to a modern build framework, triaged and fixed a substantial number of upstream issues,
  and introduced ED2K protocol support for the first time. A full audit trail is preserved in
  docs/maintenance/upstream-issue-review/matrix.csv.

  Aria2 Next is an actively maintained aria2-compatible engine for everyone, and it is also the embedded
  engine used by Motrix Next. Original interfaces, including options, configuration, sessions, JSON-RPC,
  and libaria2, remain intact so downstream projects get a seamless upgrade. The focus is straightforward:
  release reliability, current dependency baselines, and ongoing compatibility fixes. Same engine, renewed
  foundation.
ReleaseNotes: |-
  ## Summary

  Aria2 Next 2.6.5 establishes consistent, actionable diagnostics across HTTP, BitTorrent, ED2K, SQLite-backed state, TLS, XML, DNS, and WebSocket operations. The release reduces routine log noise while preserving native error context needed to diagnose transfer and persistence failures. Standalone binaries are provided for Linux, macOS, Windows, and Android, with a consolidated checksum file.

  ### Added

  • Integrated curated native diagnostics from libcurl and libtorrent, including transfer timing, connection identity, tracker, DHT, peer, storage, and session events.
  • Added structured SQLite diagnostics with extended result codes, failing operation context, SQL error offsets, and native messages.
  • Added complete OpenSSL error-queue reporting and native diagnostics for Expat, DNS resolution, and WebSocket operations.
  • Added runtime propagation of log-level changes to active HTTP and BitTorrent sessions.

  ### Changed

  • Changed the default file log level from `trace` to `debug` to keep routine logs useful and bounded.
  • Moved successful periodic and RPC session serialization messages to `debug` while retaining failures at `error`.
  • Limited trace output to actionable protocol and lifecycle diagnostics, excluding payload bodies, TLS frames, authentication data, and repetitive peer-removal events.

  ### Fixed

  • Preserved native libcurl error details, operating-system errors, endpoint information, and retry context instead of collapsing failures into generic transport errors.
  • Prevented C++ exceptions from crossing libcurl, SQLite, and WebSocket C callback boundaries.
  • Removed a false BitTorrent part-file deletion error emitted when libtorrent reported successful metadata-only cleanup.
  • Improved SQLite statement, binding, stepping, schema, and connection failure reporting for ED2K and stream state databases.

