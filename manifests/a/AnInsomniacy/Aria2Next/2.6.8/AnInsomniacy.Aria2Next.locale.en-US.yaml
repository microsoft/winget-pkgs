ShortDescription: Maintained aria2 fork with extensive bug fixes and modernized architecture
Description: |-
  aria2 is remarkable open source software. For over a decade it has been one of the most capable
  download engines available, trusted by countless tools and users worldwide. We are deeply grateful
  to the original authors and contributors of the aria2 project. They built something that has stood
  the test of time, and that enduring quality is the best testament to their vision and craftsmanship.

  But upstream development has slowed dramatically in recent years. Dependencies grew stale, builds
  broke on modern platforms, and a backlog of bugs went unaddressed. We picked up the baton: migrated
  the codebase to a modern build framework, triaged and fixed a substantial number of upstream issues,
  and introduced ED2K protocol support for the first time. A full audit trail is preserved in
  docs/maintenance/upstream-issue-review/matrix.csv.

  Aria2 Next is an actively maintained aria2-compatible engine for everyone, and it is also the embedded
  engine used by Motrix Next. Original interfaces, including options, configuration, sessions, JSON-RPC,
  and libaria2, remain intact so downstream projects get a seamless upgrade. The focus is straightforward:
  release reliability, current dependency baselines, and ongoing compatibility fixes. Same engine, renewed
  foundation.
ReleaseNotes: |-
  ## Breaking Changes

  BitTorrent managed metadata and fast-resume files now live exclusively under `state-dir/bittorrent/torrents`. Earlier private resume layouts are not migrated.

  ## Summary

  This release improves HTTP transfer recovery, BitTorrent discovery, private state ownership, and connection stability across supported standalone builds.

  ### Added

  • Added encrypted-first BitTorrent peer negotiation with native plaintext fallback.
  • Added focused local validation tooling for HTTP, BitTorrent, ED2K, Metalink, and SFTP transfers.

  ### Changed

  • Uploaded torrent metadata and fast-resume data are managed together in the private BitTorrent state directory.
  • BitTorrent listeners use native wildcard binding, operating-system route selection, and socket reopening after system resume.
  • Added trackers are separated into UDP, HTTP, and HTTPS tiers, with a shorter default completion timeout.
  • HTTP transfers dynamically size the libcurl connection pool and adapt per-task concurrency after server throttling.

  ### Fixed

  • Preserved validated HTTP ranges across retryable HTTP, TLS, SSH, and transport failures.
  • Prevented range leases from extending past the server-confirmed response boundary.
  • Improved stalled endgame recovery without resetting completed progress.
  • Reclaimed unreferenced managed torrent metadata and fast-resume files while preserving shared references and user-owned torrent files.
  • Improved BitTorrent tracker reachability and peer connection behavior across network changes.

