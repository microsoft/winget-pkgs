ShortDescription: Explore and visualize your local coding-agent session history.
Description: |-
  SessionGraph reads the local history of your coding agents and presents it in one desktop application. It imports sessions from OpenCode, Claude Code, Codex, T3 Code, Cursor, Gemini CLI, Qwen Code, Pi, GitHub Copilot CLI, GitHub Copilot Chat, Cline, Roo Code, Kilo Code, and Continue without modifying the sources it reads.

  Key features:
  - Session orbs show your conversations over time, fork connections show where sessions branched or spawned subagents, and clusters group sessions by project directory even across harnesses.
  - Search conversations, browse messages, and inspect changed files.
  - Imports, search, and visualization stay on your computer. No account is required and the app collects no telemetry.
  - Publishing a graph is optional and uploads only the metadata snapshot you select after confirmation.
  - Desktop releases install the sessiongraph and ssg commands on first launch.
