PackageIdentifier: arvindell.SessionGraph
PackageVersion: 1.0.21
PackageLocale: zh-CN
ShortDescription: 在本地浏览并可视化你的编程智能体会话历史。
Description: |-
  SessionGraph 会读取各编程智能体在本机的历史记录，并在同一个桌面应用中呈现。它从 OpenCode、Claude Code、Codex、T3 Code、Cursor、Gemini CLI、Qwen Code、Pi、GitHub Copilot CLI、GitHub Copilot Chat、Cline、Roo Code、Kilo Code 和 Continue 导入会话，且不会修改被读取的数据源。

  主要特性：
  - 会话轨道展示随时间变化的对话，分叉连线展示会话派生或子智能体的位置，聚类则按项目目录跨智能体归类会话。
  - 搜索对话、浏览消息并查看改动的文件。
  - 导入、搜索与可视化全部在本机完成，无需账号，也不收集遥测数据。
  - 公开分享图谱是可选项，仅上传你确认后选中的元数据快照。
  - 桌面版在首次启动时安装 sessiongraph 和 ssg 命令。
