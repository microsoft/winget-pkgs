ShortDescription: Browse your movie and TV files with posters, ratings and summaries.
Description: |-
  MovieCat scans your folders for movie and TV files, recognises each title from its file name and shows the poster, rating, year and a short summary.
  It understands typical release names, TV season and episode numbers and foreign titles, can find the folders that hold your movies automatically, and leaves out home videos and screen recordings.
  No account, sign-up or API key needed.
