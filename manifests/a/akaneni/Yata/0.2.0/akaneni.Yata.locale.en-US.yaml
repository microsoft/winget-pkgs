ShortDescription: A Dynamic Island-style notch for Windows, with what's playing, your next meeting and your reminders.
Description: |-
  Yata is a living notch at the top of the screen, just below the camera. Closed, it's a black pill with the time; hover it and it opens into tabs.
  It shows what's playing in any app that uses Windows media controls, with synced lyrics, your next Google Calendar meeting with a Join button, a Pomodoro timer, a water goal, tasks with reminders and a shelf for files. A hand-drawn pixel raven lives in the notch and reacts to your day.
  Open source, no account, no telemetry.
