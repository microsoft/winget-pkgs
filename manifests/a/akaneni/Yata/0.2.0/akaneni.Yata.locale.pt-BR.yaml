# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json
PackageIdentifier: akaneni.Yata
PackageVersion: 0.2.0
PackageLocale: pt-BR
PrivacyUrl: https://getyata.app/pt/privacy
PackageUrl: https://getyata.app/pt/
ShortDescription: Um notch estilo Dynamic Island para o Windows, com o que está tocando, sua próxima reunião e seus lembretes.
Description: |-
  O Yata é um notch vivo no topo da tela, logo abaixo da câmera. Fechado, é uma pílula preta com a hora; passe o mouse e ele abre em abas.
  Mostra o que está tocando em qualquer app que use os controles de mídia do Windows, com letras sincronizadas, sua próxima reunião do Google Agenda com botão para entrar, um Pomodoro, uma meta de água, tarefas com lembretes e uma prateleira de arquivos. Um corvo em pixel art desenhado à mão mora no notch e reage ao seu dia.
  Código aberto, sem conta e sem telemetria.
ManifestType: locale
ManifestVersion: 1.12.0
