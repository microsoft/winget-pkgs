ShortDescription: Fix text typed in the wrong keyboard layout between Thai and English with one hotkey.
Description: |-
  PimPid ("typo" in Thai) converts text typed in the wrong keyboard layout between Thai (Kedmanee) and English (US QWERTY).
  Select the text, or just keep typing, and press the hotkey (Ctrl + Shift + Space by default).
  It converts by key position, then switches the keyboard layout so you can keep typing.
  Keystrokes are only held in memory; nothing typed is written to disk and the app makes no network connections.
