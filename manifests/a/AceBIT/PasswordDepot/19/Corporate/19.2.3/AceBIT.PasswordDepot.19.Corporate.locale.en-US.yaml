ReleaseNotes: |-
  New Features
  - Offline copies of server databases that are protected by Windows, Entra ID (Azure AD) or OpenID Connect sign-in are now encrypted with a DPAPI key. Existing offline copies are converted automatically the next time they are opened.
  - The local channel the browser add-ons use to talk to Password Depot is now restricted to your own Windows account: connections from other user sessions on the same machine and from the network are refused.
  - Reworked the import from Dashlane: folders, notes, web addresses and two-factor (TOTP) secrets are now imported as well.
  - Custom icons are now carried over when entries are copied or moved into another database.
  - Databases that were locked when the program was closed are now restored together with the other tabs in the next session.
  - Support for SFTP in Internet storage connections has been discontinued. FTP, FTPS, FTPES, WebDAV and WebDAVs remain available; existing SFTP connections have to be moved to one of these, and a newly added custom server now starts out as FTPES.
  - In the Internet connection profile, the button that shows the password in plain text is now only available while a connection is being created, no longer when an existing connection is edited.
  - Added the missing StoreSession key to DefSettings.ini so administrators can preset the "Restore the tabs from the previous session" option.
  - Enhanced standard entry icons.
  - The word lists used by the passphrase generator are now built into the program; separate word list files are no longer installed.
  - The English word list has been replaced with the EFF long word list, a curated set of 7,776 memorable words, and the default passphrase length has been raised from five to six words, so generated passphrases remain at least as strong as before. A passphrase length you have set yourself is kept.
  Bug Fixes
  - Fixed a high processor load that could occur when that channel could not be opened, for example because another program was occupying it; the client now pauses between attempts instead of retrying without a break.
  - Fixed OpenID Connect sign-in failing for up to 24 hours after the identity provider rotated its token signing keys.
  - Fixed custom fields being scrambled when the list had been sorted by a column header: on saving the entry, names, values and types were reassigned across each other.
  - Fixed database names containing a dot being cut short when creating a database ("A1.1" became "A1"), which could report the database as already existing and overwrite an unrelated one.
  - Fixed importing CSV files with Unix line endings: the last character of every line was dropped, and the import could stop with a "List index out of bounds" message and a partially filled database.
  - Fixed the field list in the CSV import wizard gaining a further copy of all field names with every keystroke in the delimiter box, which could leave columns assigned as "<Unknown>".
  - Fixed the XML export failing with "Invalid class typecast" and writing nothing at all when an entry contained a TAN with a comment. TAN comments are now part of the export.
  - Re-importing a previously deleted custom icon now brings it back for all entries of that website instead of showing a white square.
  - Icons and the names proposed for new entries are now taken from the full host name of a web address; for addresses such as "shop.example.uk.com" the icon and name of "uk.com" were used before.
  - Refresh (F5) now really reloads a database stored in a cloud service; changes made on another device only appeared after closing and reopening the database.
  - The "Modified" column of the cloud storages now shows local time instead of UTC.
  - Restoring an entry or a folder from the recycle bin of a server database now puts it straight back into the folder it was deleted from, without a refresh.
  - Fixed Advanced Search aborting with an "invalid mask" message when a search field contained "[".
  - "Open URL with" in the Entry menu is now reliably disabled for entries without a web address.
  - Entry names, usernames and passwords containing "&" are now shown correctly on the top bar and in the favourites, custom fields, global fields and TAN menus.
  - Revealing a password with the eye button in the entry dialog now counts as using the entry, as it already did in the main window.
  - Changing the master password to the password already in use is now rejected instead of completing as if it had been changed.
  - Fixed the master password policy setting "All the selected character types" being lost on the next program start.
  - "Create Backup" in the database properties is now only available once a backup target has been configured; it previously reported success without writing anything.
  - "Ignore this URL" now takes effect for local and cloud databases: the address is stored with the database and also appears under Database > Properties > Content > Edit websites.
  - Removed the dropdown arrow from the "Ignore this URL" button in the "Create a password entry" dialog, which never opened a menu.
  - When a database is created with a key file, the key file is now proposed next to the database instead of in the program folder, where a standard user cannot write.
  - The master password dialog now grows to fit longer translated texts; the key file line could overlap the buttons in every language except English.
  - Printing entries now preserves the line breaks in comments and other multi-line fields, and long values are wrapped instead of being cut off at the column edge.
  - Creating or importing an entry of a type that the server policy has disabled now reports which entry type is affected and where the policy is set, instead of an unrelated Windows error message.
  - Fixed F1 opening a "page not found" for many dialogs; every help key now points to an existing help topic.
  - Completed the passkey field labels and further texts in German, French, Spanish and Dutch, and corrected the labels "Auto-complete selected", "Diners Club" and "woelkli".
  - Fixed ten entries in the mixed word list that held an unusable control character where an accented letter belonged, so a generated passphrase could contain a character that cannot be typed and that other programs may discard or cut the rest of the passphrase at. Those entries have been removed.
  - A number of other optimizations and fixes.
