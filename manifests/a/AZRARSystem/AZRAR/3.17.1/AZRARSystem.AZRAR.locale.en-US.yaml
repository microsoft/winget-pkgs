ShortDescription: Real estate office management system for contracts, installments, sales, and commissions. Arabic-first with English support. Business data is stored locally on your device.
Description: AZRAR is a real estate office management system for property, contract, and payment tracking. It manages properties, owners, tenants, rental and sale contracts, installment schedules, commissions, and move-in/move-out inspections, with automatic damage comparison at contract clearance. Business data is stored locally on the device and the application works without an internet connection. Optional features that use the network include update checks, WhatsApp message links, Google Drive backup, Google Calendar sync, AI text generation with a user-supplied key, map display, SQL Server synchronization, and the mobile companion bridge. It is Arabic-first (RTL) with English as a secondary language, and includes smart alerts for upcoming payments and contract renewals.
