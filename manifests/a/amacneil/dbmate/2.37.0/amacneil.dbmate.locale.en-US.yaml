ReleaseNotes: |-
  Notable changes
  - Go 1.27.2 and updated golang.org/x/net and golang.org/x/crypto, which resolve the govulncheck findings in v2.36.0 (#857).
  - New --migration-lock flag serializes concurrent migration runs on PostgreSQL (#848).
  - Migration files with multiple migrate:up/migrate:down sections now work on SQLite, MySQL and PostgreSQL. The version is recorded once per file (#824), rollback runs sections from last to first (#856), and Applied:/Rolled back: print only after every section succeeds (#851, #856).
  What's Changed
  - Add --migration-lock to serialize concurrent migration runs (PostgreSQL) by @dgsardina in #848
  - fix: check go.mod toolchain on fork pull requests instead of syncing by @bradykimball-pnnl in #858
  - fix: update Go toolchain and security dependencies by @bradykimball-pnnl in #857
  - build(deps): bump Homebrew/actions/setup-homebrew from 2026.09.13.1 to 2026.10.12.1 by @dependabot[bot] in #855
  - build(deps-dev): bump handlebars from 4.7.9 to 4.7.10 in /typescript by @dependabot[bot] in #860
  - build(deps-dev): bump brace-expansion from 1.1.18 to 1.1.21 in /typescript by @dependabot[bot] in #861
  - build(deps): bump alpine from 3.24.1 to 3.24.2 by @dependabot[bot] in #843
  - fix(sqlite): use database file path when dropping databases by @snooze26h in #850
  - fix: handle long lines when processing schema SQL by @sagar5412 in #862
  - fix: insert migration version once for multi-section migration files by @youdie006 in #824
  - fix: log Applied only after a migration section succeeds by @MrBeldum in #851
  - fix: roll back multi-section migrations in reverse order by @AdamMagued in #856
  - v2.37.0 by @dossy in #863
