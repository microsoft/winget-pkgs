ReleaseNotes: |-
  Notable changes
  - Built with Go 1.27.4, which fixes GO-2026-6859 in net/http (#892).
  - Updates golang.org/x/net to v0.62.0 (GO-2026-6860, GO-2026-6866) and golang.org/x/crypto to v0.59.0 (GO-2026-5932) (#891, #892). dbmate doesn't call the code these advisories cover, but dependency scanners that read module versions from the binary will stop flagging them.
  - The Docker image is now based on Alpine 3.24.4 (#893).
  There are no functional changes from v2.38.1.
  What's Changed
  - chore: bump golang.org/x/net to v0.62.0 by @hritik8118 in #891
  - build(deps): bump go.opentelemetry.io/otel/trace from 1.46.0 to 1.47.0 by @dependabot[bot] in #889
  - fix: bump Go to 1.27.4 and x/crypto to v0.59.0 by @dossy in #892
  - build(deps): bump alpine from 3.24.3 to 3.24.4 by @dependabot[bot] in #893
  - v2.38.2 by @dossy in #896
  New Contributors
  - @hritik8118 made their first contribution in #891
