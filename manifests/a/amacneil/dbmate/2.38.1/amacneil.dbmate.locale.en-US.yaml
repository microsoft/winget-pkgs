ReleaseNotes: |-
  Notable changes
  - Fixes the v2.38.0 linux/amd64 binary crashing with Illegal instruction (SIGILL) before printing anything on x86-64 CPUs without AVX (#886). This affected the dbmate-linux-amd64 release asset, the amd64 ghcr.io/amacneil/dbmate:2.38.0 and amacneil/dbmate:2.38.0 images, and @dbmate/linux-x64@2.38.0 on npm. The Linux binaries are built on Ubuntu 24.04 again, and CI now runs the amd64 binary on an emulated CPU without AVX (#887).
  There are no other changes from v2.38.0.

  What's Changed
  - ci: build Linux binaries on ubuntu-24.04 by @dossy in #887
  - v2.38.1 by @dossy in #888
