PackageIdentifier: anglee0323.AntigravityToolsLite
PackageVersion: 4.10.17
PackageLocale: zh-CN
ShortDescription: 管理 Antigravity 应用及其 agy CLI 使用的 Google 账号、模型配额与 Token 用量。
Description: |-
  一款专为 Antigravity 打造的本地桌面客户端。用于管理 Antigravity 应用及其 agy CLI 所使用的 Google 账号，展示各模型的配额及重置倒计时，并汇总本地记录的 Token 用量与预估的 API 费用。所有处理均在本地设备上完成

  概览
  - 账号管理 —— 导入本机已有账号、切换 Antigravity 使用的账号、为账号添加备注、随时移除账号
  - 配额概览 —— 查看各模型配额与重置时间，按 PRO / ULTRA / FREE 分类，支持表格和卡片视图
  - 用量看板 —— 统计今天、昨天、近 3 天、7 天或 30 天的 Token 用量，按模型细分，并预估 API 费用
  - 双端同步切换 —— Antigravity 应用与 agy CLI 读取相同的凭据条目，单次切换即可同时对两者生效
  - 纯本地数据 —— 无代理、无后台服务、无遥测收集；凭据安全保存在操作系统的凭据管理器中
  - 双语界面 —— 支持简体中文和英文，提供浅色与深色主题，支持托盘菜单
Tags:
- antigravity
ReleaseNotes: |-
  - 配额查询改用 Antigravity 客户端实际使用的 daily-cloudcode-pa.googleapis.com 优先，沙箱和生产端点作为回退。只返回 Claude/GPT 组的 HTTP 200 响应仅作部分兜底，不再与其它端点环境的数据合并成一份完整观测。
  - 请求 User-Agent 改为 antigravity/hub/<版本> (os_type=…; arch=…)。服务端不再按旧客户端降级，Gemini 4 Argon、Hydrogen、Carbon 的模型列表和第三个配额组（Gemini 4 Argon 周额度）会正常返回。
  - 模型目录新增 Gemini 4 Argon（Low/Medium/High），Orchestrator (Argon) 与 Orchestrator (Carbon) 归到对应模型的额度；-disabled 模型显示「—」，不再借用共享池百分比。
  - 修正 5 小时与周配额的取值：模型上报的 primary_quota 若对应周桶的重置时间，5H 视图不再把它当成 5 小时额度，避免显示错误的百分比和倒计时。5H 视图只显示五小时额度，周配额视图只显示周额度。
  - 修复「周期变化」弹窗：前端读取的字段与后端返回不一致，弹窗此前一直为空。现在按账号分组显示周期记录、检查点、消耗金额和环比。
  - 估值校准增加保护：冷启动和离群样本不再写入参考上限，异常环比不再显示。
