ShortDescription: A sleek, modern dashboard for monitoring and managing your media stack services.
Description: Dashbrr is a dashboard for monitoring and managing your media stack services. It provides real-time service health monitoring, cached data with live SSE updates, built-in and OpenID Connect authentication, and a responsive, draggable card UI covering Plex, Jellyfin, Sonarr, Radarr, Lidarr, Readarr, Whisparr, Bazarr, Prowlarr, Overseerr, Maintainerr, Autobrr, SABnzbd, NZBGet, Qui, Tailscale, Uptime Kuma, Traefik and generic HTTP health endpoints.
