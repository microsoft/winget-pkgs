ReleaseNotes: |-
  Changelog
  Breaking changes
  - Batch jobs are private by default, like the CLI. A job with no private key now makes a private torrent and gets the tracker's default source, so its info hash changes. To keep the old torrents, add private: false or source: "" to the job.
  - create --batch rejects other create flags. mkbrr used to ignore them. Only -v, -q, and -i work with --batch, so move flags such as --tracker or --exclude into the batch file.
  - A max piece length of 14 or 15 fails where it cannot apply. mkbrr used to make 64 KiB pieces anyway. Set --max-piece-length to 16 or higher, and the hash stays the same.
  - Go API. BatchJob now embeds torrent.CreateSettings with pointer fields, and ModifyOptions now embeds torrent.ModifySettings.
  Highlights
  - Plan before you hash. mkbrr create --plan prints the piece length and the exact .torrent size as JSON without hashing, so you can check a tracker size limit first.
  - Presets work the same everywhere. The CLI, the GUI, and batch mode now resolve settings in one order. In the GUI, the private checkbox works with a preset, and preset values such as target_piece_count apply. Batch jobs accept max_piece_length and no_creator.
  - Modify changes only what you ask. New --no-entropy removes entropy. Settings you do not set keep the torrent's value, modify writes no file when nothing changes, and it reads skip_prefix from the preset.
  - Batch failures you can see. A failed job makes create --batch exit non-zero with N of M batch jobs failed, also with --quiet.
  - Fixes and polish. --fail-on-season-warning stops before hashing, modify with one tracker removes the old announce-list, and create stops with an error when it cannot make entropy.
