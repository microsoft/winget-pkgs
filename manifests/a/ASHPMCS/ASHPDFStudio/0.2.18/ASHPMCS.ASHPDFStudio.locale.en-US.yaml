ShortDescription: "Free, open-source PDF viewer and editor for Windows: view, search, annotate, sign, edit pages and fill forms."
Description: "ASH PDF Studio is a free, open-source (MIT) PDF viewer and editor for Windows. It renders with Mozilla pdf.js and adds tabs, thumbnails, bookmarks and layers; find in the document and advanced search across folders of PDFs; shapes, text boxes, callouts, highlights, sticky notes and stamps saved as real PDF annotations; a comments panel with status and CSV export; a signature library; page tools (rotate, reorder, insert, extract, crop, merge, split); headers, footers, page numbers, watermarks and Bates numbering; form filling and printing. Everything runs on your computer; files are not uploaded anywhere."
