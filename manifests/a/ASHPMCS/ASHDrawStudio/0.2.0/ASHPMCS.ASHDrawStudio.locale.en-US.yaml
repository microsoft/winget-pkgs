ShortDescription: "Free, open-source DXF drawing viewer and editor for Windows; opens and saves DWG through bundled LibreDWG converters."
Description: "ASH Draw Studio is a free, open-source (MIT) drawing viewer and editor for Windows. It opens, edits and saves DXF drawings (R12 to R2018) and DWG files through the separately bundled LibreDWG converters. It shows layers, colours, linetypes, blocks, hatches, text, dimensions and leaders; draws and modifies with object snaps, ortho and polar tracking and an AutoCAD-style command line; and exports to PDF, SVG and PNG. Everything runs on your computer."
