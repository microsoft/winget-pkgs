ShortDescription: Universal Rust data & vector ETL/lakehouse framework
Description: >-
  NexusFlow is a high-performance data movement, transformation,
  vectorization, and orchestration platform (ETL/ELT/Streaming) built in
  Rust on Apache Arrow. It ships a visual node-based canvas (React Flow),
  RBAC, native CDC connectors (Postgres/MySQL/MongoDB), an AI Lakehouse
  embedding pipeline (ONNX), and native ADBC/Arrow connectors for
  relational databases, vector databases, and open table formats.
