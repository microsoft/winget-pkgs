ShortDescription: 跨设备的开源 AI Agent 工作台，把本机 Codex、Claude Code 和 DeepSeek Harness 会话带到桌面、手机和浏览器。
Description: Agents Anywhere 是跨设备的开源 Agent 工作台。连接运行 Codex、Claude Code 或 DeepSeek Harness 的工作设备，在桌面、手机和 Web 查看会话、回复请求、管理文件与终端。Agent 在连接的工作设备上执行任务。桌面客户端负责连接工作设备，同一会话可以从手机、平板或浏览器继续访问，服务端也支持用 Docker 自托管。
