ReleaseNotes: |-
  Agents Anywhere v2.2.0 is an interface update to the 2.x series. It adds unified native Plan mode (`/plan`) with inline composer review across Codex, Claude Code, and DSH, introduces unified Goal mode (`/goal`) for Codex and Claude Code, adds Pi and Hermes Agent support, and brings model gateway management.

  ## Before You Upgrade
  - All components unified at 2.2.0. Existing 2.1.0 clients can still sign in and use existing sessions.
  - Database migrations and rollout order (v2_45–v2_55): Self-hosted servers must run migrations v2_45 through v2_55. Migrate first, then start the new Server, then upgrade Connectors.
  - Secrets and Tokens Anywhere: Set `AGENT_SERVER_SECRET` to at least 32 characters.
  - System requirements: Desktop now requires macOS 13 or later.

  ## Updates
  ### Unified Plan
  - Codex, Claude Code, and DSH sessions support `/plan`, `/plan <task>`, and `/plan off`.
  - Web, Desktop, Android, and iOS add streaming plan cards with inline Approve & Execute / Revise Plan / Dismiss actions.

  ### Session Creation, New Agents, and Message Delivery
  - **Added Pi support**: reuses compatible local models, auth, and config; supports attachments and tool approvals.
  - **Added local Hermes Agent support**: conversations, tool approvals, text and image attachments, interrupt, and resume.
  - **Reduced database and memory pressure at scale**.

  ### Documentation and Licensing
  - **Project license changed from MIT to Apache License 2.0**.
