PackageIdentifier: AnywhereLabs.AgentsAnywhere
PackageVersion: 2.2.0
PackageLocale: en-US
ShortDescription: An open-source agent workbench that brings your local Codex, Claude Code and DeepSeek Harness sessions to desktop, mobile and the browser.
Description: Agents Anywhere is an open-source agent workbench across your devices. Connect a work machine running Codex, Claude Code or DeepSeek Harness, then view sessions, respond to requests, manage files and use terminals from desktop, mobile and Web. Agents execute tasks on the connected work machine. The desktop client links that machine, so the same sessions stay reachable from a phone, tablet or browser, and the server can also be self-hosted with Docker.
