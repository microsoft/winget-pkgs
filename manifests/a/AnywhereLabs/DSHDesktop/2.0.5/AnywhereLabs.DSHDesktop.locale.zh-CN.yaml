ReleaseNotes: |-
  DSH Desktop 2.0.5 是最新上游的稳定版适配。
  DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
  主要更新
  优化
  一、修复部分 windows 上的已知问题
  二、修复恢复助手的部分已知 bug
  1. 切换 profile、选择回滚的页面二次操作的报错问题；
  2. 新建 profile 卡顿，导致新建失败；
  3. 加载已经删除的 profile 时无法正常加载其他 profile。
  三、增强稳定性，增强兼容性
  新增
  一、适配上游最新版本——v0.1.2-rc.1
  注意！！！： 因为上游更新可能会导致很多插件不可用
  二、恢复助手界面新增“快速恢复”
  1. 快速恢复新增引导信息和安全模式；
  2. 安全模式：
     1. 自动创建一个全新的 profile 环境，然后进入页面，用户在此进行操作；
     2. 用户一旦退出安全模式后，下一次启动时直接删除安全模式的环境及数据；
     3. 安全模式使用的是隔离的环境和数据，不是默认的.dsh 目录。
  三、与 beta 版
  1. 说明：稳定版和 beta 版可以共存，但是共享了数据和配置信息；
  2. 增如果同一个 profile 先后被稳定版和 beta 版加载，会出现警告。
