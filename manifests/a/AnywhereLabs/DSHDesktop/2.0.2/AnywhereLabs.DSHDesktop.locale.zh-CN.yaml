ReleaseNotes: |-
  DSH Desktop 2.0.2 是桌面体验和稳定性更新。
  DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
  主要更新
  优化
  一、修复部分已知的 windows 端闪退问题
  二、优化恢复助手和回滚界面
  1. 恢复助手会显示错误的具体文件信息；
  2. 触发回滚时页面时会增加更多可选项：打开专用终端、导出诊断信息、运行回滚、切换配置并重启、新增配置；
  三、增强稳定性，增强兼容性
  新增
  一、MacOS 的左上角菜单页面
  为了防止 MacOS27 之前，会因为开太多程序（尤其是笔记本刘海屏）而导致找不到图标，将系统菜单栏同步至左上角应用菜单页
  二、更新上游（DeepSeek Harness）版本到 v0.1.1-rc.2
  注意！！！：
  1. 部分插件暂未适配最新上游版本。请联系相关插件开发者适配。
  2. 因为上游进行了部分破坏性更新，安装新版本后会导致旧版本不可用（如果您本机同时存在）。
  三、插件市场相关
  1. 新增 dsh-market 支持；
  2. 插件预览页面增加下载量、star 数，种类等信息；
  3. 优化加载问题；
  四、设置选项新增“桌面版”页面
  1. Profile（配置）：切换启动时使用的 Profile，或创建一个安全的 Web Profile。注意！！！：因为官方的破坏性更新，新版本可能导致您此前的 profile（desktop，web 等）无法打开，建议您先新建一个 profile 后重启使用；如果旧的 profile 仍无法使用，建议您删除旧的不可用 profile；在此之前，先打开终端，输入 dsh plugin list 查看并复制您已经安装的插件，然后执行删除操作（会话消息会保存，但是插件不会）
  2. 插件市场：选择要在桌面版中启用的插件市场。每次只会加载一个。
  3. 桌面外观与行为：选择与上游一致的兼容模式，或桌面版增强布局。
  4. 桌面通知：选择 DSH Desktop 何时发出系统通知。通知不包含会话内容。（不建议与其他通知类插件一同使用）
