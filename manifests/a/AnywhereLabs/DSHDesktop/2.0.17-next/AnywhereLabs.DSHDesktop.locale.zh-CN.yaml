ReleaseNotes: |-
  本次更新升级至 DeepSeek Harness v0.2.0-rc.2，修复 Linux AppImage 在应用内重启后无法重新启动的问题。 Next 同时修复 Session 日志下载和 /export 无响应的问题。
  DSH NEXT 是社区维护的开源项目，并非 DeepSeek 官方产品。
  新增与改进
  - 升级内核： 从 v0.2.0-rc.1 升级至 v0.2.0-rc.2，同步适配三通道运行时和插件管理。
  - 终端与 CLI： 适配新版内置终端及 Desktop Profile 插件管理流程，支持通过应用提供的 CLI 安装、移除插件及管理版本兼容例外。
  - 手机远控： 更新 Agents Anywhere 的 rc.2 兼容适配。
  修复
  - Linux AppImage 重启： 修复菜单重启、恢复模式、进入／退出安全模式、切换 Profile 或数据目录时，应用退出后不再启动的问题。
  - 无 FUSE 的运行方式： 使用 --appimage-extract-and-run 或 APPIMAGE_EXTRACT_AND_RUN=1 时，重启后继续使用解压运行模式，并避免新实例与旧临时目录清理相互干扰。
  - Session 导出： 修复“下载 Session 日志”和 /export 没有反应的问题；现在会弹出系统保存对话框并写入文件。
  - 下载错误提示： 下载失败时显示具体原因，取消保存或传输中断时不会留下未完成的文件。
  - 更多重启流程： AppImage 下首次设置、恢复出厂设置及更新安装失败后的回退重启也使用修复后的启动流程。
  使用提示
  - 请先退出旧版应用并备份 ~/.dsh。内置的 v0.2.0-rc.2 仍为候选发布版本。
  - 新版内核会检查插件声明的兼容版本，不兼容的插件可能被跳过；遇到插件未加载时，请先检查并更新插件。
  - 通用设置中的“上传 Session Log”选项，保留上游默认值（默认开启）；可在设置中查看并调整。
  - Next 仍属实验通道，默认与稳定版共用 ~/.dsh；Profile 不隔离同一目录中的会话、账号和凭据。
  - 可通过绝对路径 DSH_DESKTOP_NEXT_HOME 隔离 DSH 数据，但不会因此隔离 AA 的默认共享登录与设备绑定状态。
  - 新 Profile 的插件市场、手机远控和 Computer Use 默认关闭；Next 暂不提供原桌面版的扩展／增强窗口模式。
  - 如需通过应用内终端管理 desktop Profile 的插件，请先启动 Desktop 完成该 Profile 的初始化。
  完整变更记录 · 项目网站
  DSH NEXT 将逐步取代稳定版。
