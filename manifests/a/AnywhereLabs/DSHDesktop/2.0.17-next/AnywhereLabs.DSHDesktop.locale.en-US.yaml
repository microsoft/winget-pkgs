ReleaseNotes: |-
  This release upgrades to DeepSeek Harness v0.2.0-rc.2 and fixes Linux AppImage builds quitting without restarting when using in-app restart actions. Next also fixes unresponsive Session log downloads and /export.
  DSH NEXT is a community-maintained open-source project, not an official DeepSeek product.
  New and improved
  - Updated core: Upgraded from v0.2.0-rc.1 to v0.2.0-rc.2, adapting the runtime and plugin management across all three channels.
  - Terminal and CLI: Adapted to the updated built-in terminal and Desktop Profile management flow. The bundled CLI supports plugin installation, removal, and management of version compatibility exceptions.
  - Mobile remote control: Updated Agents Anywhere integration for compatibility with rc.2.
  Fixes
  - Linux AppImage restart: Fixed the app exiting without relaunching after menu restarts, recovery actions, entering/leaving Safe Mode, or switching Profiles or data directories.
  - Running without FUSE: When using --appimage-extract-and-run or APPIMAGE_EXTRACT_AND_RUN=1, restarts retain extraction mode and avoid conflicts with cleanup of the previous temporary directory.
  - Session export: Fixed “Download Session log” and /export doing nothing. They now open the native save dialog and write the file.
  - Download errors: Failed downloads show the underlying reason. Cancelling or interrupting a download does not leave an incomplete file.
  - Additional restart flows: AppImage setup, factory reset, and fallback restarts after failed update installation also use the corrected relaunch flow.
  Usage notes
  - Quit the previous version and back up ~/.dsh before installing. The bundled v0.2.0-rc.2 is still a release candidate.
  - The new core checks declared plugin compatibility and may skip incompatible plugins. Check for plugin updates if a plugin does not load.
  - General settings retains the upstream “Upload Session Log” option, retaining the upstream default (enabled). Review or change it in Settings.
  - Next remains experimental and defaults to the shared ~/.dsh home. Profiles do not isolate sessions, accounts, or credentials within that home.
  - Set DSH_DESKTOP_NEXT_HOME to an absolute path to isolate DSH data; this does not isolate AA’s default shared sign-in and device-binding state.
  - Markets, mobile remote control, and Computer Use are off by default in new Profiles. Next does not yet offer the original Desktop’s Extended / Advanced window modes.
  - Before managing plugins for the desktop Profile from the bundled terminal, launch Desktop to initialize that Profile.
  Full changelog · Project website
  DSH NEXT will gradually replace the Stable edition.
