ReleaseNotes: |-
  DSH Desktop 2.0.3 是桌面体验和稳定性的进一步优化。
  DSH Desktop 是由社区团队维护的开源项目，基于 DeepSeek Harness 构建，并非 DeepSeek 官方产品，也不代表 DeepSeek 官方立场。
  主要更新
  优化
  一、修复部分已知的 windows 上的已知问题
  二、优化插件市场体验
  1. 对于某些插件，在安装时会被 pnpm 拦截警告，现在会显示更详细的日志信息；
  2. 修改了图标。
  三、增强稳定性，增强兼容性
  新增
  一、新增初次打开时的引导设置
  用户首次打开一个新的 profile 时会进入到引导设置页，设置关于桌面的特性（可跳过）
  二、窗口模式设置选项
  1. 新增“扩展窗口模式”：使用玻璃侧边栏和顶部控制栏，在不改动官方内容的情况下扩展桌面操作区域；
  2. “兼容模式”和“扩展窗口模式”下，顶部菜单栏新增终端、重启、开发者工具的选项与与版本信息；
  3. 新增“窗口材质”：选择窗口的透明或玻璃效果。修改后会询问是否立即重启。
  三、新增“浏览器与局域网”选项
  1. 新增“允许在浏览器中打开”开关选项：选择是否允许在浏览器中打开这个 Profile，以及 Web 界面的网络访问范围。（仅在兼容模式下可以开启）；
  2. 新增“允许向局域网开放”（Beta）。
