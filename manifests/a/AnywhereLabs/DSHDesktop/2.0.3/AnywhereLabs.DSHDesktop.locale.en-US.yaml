ReleaseNotes: |-
  DSH Desktop 2.0.3 further improves the desktop experience and application stability.
  DSH Desktop is a community-maintained open-source project built on DeepSeek Harness. It is not an official DeepSeek product and does not represent DeepSeek’s official position.
  What’s New
  Improvements
  1. Windows Fixes
  Fixed several known issues on Windows.
  2. Improved Plugin Marketplace Experience
  1. When pnpm blocks the installation of certain plugins and displays a warning, the Plugin Marketplace now provides more detailed log information.
  2. Updated the Plugin Marketplace icon.
  3. Enhanced Stability and Compatibility
  New Features
  1. First-Launch Setup Guide
  When users open a new Profile for the first time, they will be taken to a setup guide where they can configure desktop-related features. This step can be skipped.
  2. Window Mode Settings
  1. Added Extended Window Mode, which uses a glass-style sidebar and top control bar to expand the desktop workspace without modifying the official interface.
  2. In Compatibility Mode and Extended Window Mode, the top menu bar now provides access to the terminal, restart command, developer tools, and version information.
  3. Added a Window Material option for selecting transparent or glass window effects. After changing this setting, the application will ask whether you want to restart immediately.
  3. Browser and Local Network Settings
  1. Added an Allow opening in a browser option. This controls whether the Profile can be opened in a browser and determines the network access scope of its web interface. This option can only be enabled in Compatibility Mode.
  2. Added an Allow local network access option (Beta).
  Upgrade Instructions
  Upgrading from v0.1.0
  Download the appropriate v2.0.3 installer for your platform:
  - macOS: Open the new DMG, drag DSH Desktop into the Applications folder, and replace the previous version.
  - Windows: Run the new installer and follow the on-screen instructions.
  Upgrading from v2.0.0 or Later
  Right-click the application icon in the system tray to check for and install the update.
  We recommend closing the currently running version of DSH Desktop before upgrading.
