ShortDescription: DSH Desktop 是由社区维护的 DeepSeek Harness 桌面客户端，并非 DeepSeek 官方产品。
Description: DSH Desktop 把 DeepSeek Harness 的本地 Web UI、Host 服务和插件系统装进原生桌面应用。官方 Harness 以固定版本原样运行；Desktop 负责窗口、托盘、终端、更新和工作配置，并通过官方插件机制与 Harness 组合。
