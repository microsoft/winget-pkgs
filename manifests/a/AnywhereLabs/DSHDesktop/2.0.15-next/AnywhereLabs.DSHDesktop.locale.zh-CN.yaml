ReleaseNotes: |-
  本次 Next 升级至 DeepSeek Harness v0.1.7-rc.2，完善首次引导、插件市场开关与手机远控状态共享，并新增 Linux AppImage 和 Debian/Ubuntu 安装包。
  DSH NEXT 属于社区维护的开源项目，并非 DeepSeek 官方产品。
  新增与改进
  - 升级内核： 从 v0.1.7-rc.1 升级至 v0.1.7-rc.2，继续复用官方 Web 前端、设置与插件管理页面。
  - 插件市场按需开启： 插件页新增市场启用开关；新建 Next Profile 默认关闭两个市场，已有 Profile 的选择保持不变。
  - 手机远控状态共享： AA 使用与稳定版、Beta 相同的默认登录、设备绑定和 Connector 状态目录；是否开启 AA 仍按 Profile 单独保存。
  - 首次引导： 恢复桌面设置 → DeepSeek 登录选择 → 官方引导的衔接，并分别保留各流程的完成状态。
  - Linux 安装包： 在 .tar.gz 之外，新增 x64 AppImage 和 Debian/Ubuntu .deb 包。
  - 定时任务： 复用官方插件组件，并补充中文说明。
  修复
  - 修复桌面设置结束后未正确交接官方引导的问题，并完善登录续接与跳过流程。
  - 移除 Next 按 Profile 生成的 AA 独立状态目录覆盖，改善部分 Windows / WSL 环境中的远控启动问题。
  - 修复 Windows 打开本地路径时，资源管理器窗口被隐藏的问题。
  - 为 macOS 签名应用及 Helper 补齐麦克风用途说明与音频输入权限，改善录音授权。
  使用提示
  - 共享数据： Next 默认使用 ~/.dsh，与稳定版共享 Profile 和数据；Profile 不隔离同一目录中的会话、账号和凭据。升级前请备份。
  - AA 登录： 原先独立的 AA 状态目录会保留，不自动合并旧凭据；如果此前只在旧目录登录，可能需要重新登录。多个 AA 实例仍受共享状态目录的占用锁约束。
  - 独立试用： 可将 DSH_DESKTOP_NEXT_HOME 设置为绝对路径来隔离 DSH 数据；这不等于隔离 AA 的默认共享状态。
  - 实验通道： Next 仍属实验通道；新 Profile 的插件市场、手机远控和 Computer Use 默认关闭，可按需开启。
  - Next 暂不提供原桌面版的扩展／增强窗口模式。
  完整变更记录 · 项目网站
  DSH NEXT 将逐步取代稳定版。
