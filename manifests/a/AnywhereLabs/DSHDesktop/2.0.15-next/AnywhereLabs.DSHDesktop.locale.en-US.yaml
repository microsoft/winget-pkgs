ReleaseNotes: |-
  This Next release upgrades to DeepSeek Harness v0.1.7-rc.2, improves onboarding, market controls, and shared mobile remote-control state, and adds Linux AppImage and Debian/Ubuntu packages.
  DSH NEXT is a community-maintained open-source project, not an official DeepSeek product.
  New and improved
  - Updated core: Upgraded from v0.1.7-rc.1 to v0.1.7-rc.2, continuing to use the official Web frontend, settings, and plugin manager.
  - Opt-in plugin markets: Added a market enable switch to the Plugins page. Both markets start disabled in new Next Profiles; existing choices are preserved.
  - Shared remote-control state: AA uses the same default sign-in, device-binding, and Connector state directory as Stable and Beta. AA enablement remains per Profile.
  - First-run setup: Restored the Desktop setup → DeepSeek sign-in choice → official onboarding handoff, retaining independent completion states.
  - Linux packages: Added x64 AppImage and Debian/Ubuntu .deb packages alongside .tar.gz.
  - Scheduled tasks: Reuses the official plugin components and adds Chinese descriptions.
  Fixes
  - Fixed the handoff to official onboarding after Desktop setup, including sign-in continuation and explicit skip handling.
  - Removed Next's generated per-Profile AA state-directory override, addressing remote-control startup issues in some Windows / WSL environments.
  - Fixed Explorer windows being hidden when opening local paths on Windows.
  - Added microphone usage descriptions and audio-input entitlements to the signed macOS app and Helpers.
  Usage notes
  - Shared data: Next defaults to ~/.dsh, sharing Profiles and data with Stable. Profiles do not isolate sessions, accounts, or credentials within the same directory. Back up before upgrading.
  - AA sign-in: Previous isolated AA state directories are retained, without merging credentials. If you signed in only to an old directory, you may need to sign in again. Concurrent AA instances remain subject to the shared-store ownership lock.
  - Separate trial environment: Set DSH_DESKTOP_NEXT_HOME to an absolute path to isolate DSH data. This does not isolate AA's default shared state.
  - Experimental channel: Next remains experimental. Markets, mobile remote control, and Computer Use are off by default in new Profiles and can be enabled as needed.
  - Next does not yet provide the original Desktop's Extended / Advanced window modes.
  Full changelog · Project website
  DSH NEXT will gradually replace the Stable edition.
