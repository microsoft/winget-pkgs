ReleaseNotes: |-
  This release adds a remote-control shortcut to the title bar and fixes issues with request preparation and Windows subprocess startup. Stable and Beta include the same features and fixes.
  DSH Desktop is a community-maintained open-source project, not an official DeepSeek product.
  New and improved
  - Remote-control shortcut: Enable remote control from the title bar, restart when prompted, and complete Phone connection setup to use DeepSeek Harness on this computer from another device.
  - Updated the bundled Agents-Anywhere component with homepage links and clearer launch guidance.
  Fixes
  - Fixed an issue where Desktop-owned plugins could not be identified correctly during request preparation.
  - Fixed the Windows subprocess runner to launch in Node mode within Electron.
  - Fixed a mismatch between runtime patch configuration and build validation.
  Usage notes
  Quit the previous version before installing. Remote control requires completing Phone connection setup. This computer must remain powered on and connected to the internet during remote use.
  Full changelog · Project website
