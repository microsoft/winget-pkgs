ReleaseNotes: |-
  本次更新新增标题栏远程控制入口，并修复请求准备和 Windows 子进程启动中的问题。稳定版与测试版包含相同的功能和修复。
  DSH Desktop 是社区维护的开源项目，并非 DeepSeek 官方产品。
  新增与改进
  - 远程控制快捷入口：可从标题栏开启远程控制，按提示重启并完成“手机连接”配置后，即可从其他设备使用这台电脑上的 DeepSeek Harness。
  - 更新内置 Agents-Anywhere 组件，补充主页链接并完善启动引导。
  修复
  - 修复部分情况下无法正确识别桌面内置插件，导致请求准备失败的问题。
  - 修复 Windows 下子进程运行器的启动模式，确保其在 Electron 中以 Node 模式运行。
  - 修复运行时补丁配置与构建校验不一致的问题。
  使用提示
  请先退出旧版应用再安装。启用远程控制后，需要完成“手机连接”配置；远程使用期间，这台电脑需要保持开机并联网。
  完整变更记录 · 项目网站
