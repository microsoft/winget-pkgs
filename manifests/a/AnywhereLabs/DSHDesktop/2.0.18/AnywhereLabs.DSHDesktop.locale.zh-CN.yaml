ReleaseNotes: |-
  稳定版更新公告：从下个版本开始，稳定版将不再更新，并由 DSH NEXT 取代。
  本次更新新增桌面端开发者日志和编辑右键菜单，统一插件管理入口，完善市场来源配置，并修复任务通知、界面恢复、本地路径引用和 Windows 更新安装等问题。
  DSH Desktop 是社区维护的开源项目，并非 DeepSeek 官方产品。
  上游版本： DeepSeek Harness v0.2.1-rc.2。
  新增与改进
  - 开发者日志：新增可选开启的桌面端开发者日志，覆盖 Host 与界面进程，关联记录模型、工具和会话活动、通信耗时、进程输出及界面错误；日志保留有容量限制，并纳入诊断导出，不记录聊天正文或工具输入／输出。
  - 启动诊断：补充认证、页面加载、DOM 就绪及 preload 失败记录；未开启开发者日志时也保留关键启动诊断，界面启动健康检查等待时间延长至 120 秒。
  - 编辑右键菜单：可编辑区域提供撤销、重做、剪切、复制、粘贴和全选的原生右键菜单；选中的只读文本提供复制。Windows 菜单文字随应用语言切换。
  - 插件控制入口：插件页集中提供插件市场和手机远控的管理入口，市场选择会被记住；桌面设置中的原有入口改为引导至插件页。
  - 插件启停：改进插件市场和手机远控的启用／停用流程，支持无需重启整个应用即可生效。
  - 市场来源配置：新增来源配置入口，可启用实验性的“自定义插件市场”、配置或移除插件源；当前预置可配置源为 dsh-market。配置操作按需预加载索引。
  - 首次设置：插件市场步骤新增“自定义插件市场”选项，选择后自动启用对应插件并配置 dsh-market 源。
  修复
  - Windows 沙箱命令：改善执行沙箱命令时弹出控制台窗口、抢占焦点的问题。
  - 插件信息：修复插件组件名称、说明和图标未正确显示的问题，完善桌面 Profile 的插件包信息查询。
  - 旧版目录清理：修复清理旧版 Profile 模块链接时可能误删旧安装目录文件的问题。
  - 后台任务通知：前台命令完成或失败、关闭会话时取消的任务不再误报“后台任务完成／失败”；真正转到后台运行的任务仍可正常通知。
  - 界面恢复：修复兼容模式下页面已销毁、自动恢复耗尽后，显示或关闭窗口触发异常并导致整个应用退出的问题。
  - 本地路径引用：修复拖入文件夹无法使用的问题；拖入、粘贴或选择的本地文件及文件夹可正确解析为输入框中的 @ 路径引用。
  - 侧栏浏览器：让其他 Profile 默认启用右侧栏浏览器，同时保留用户在 Profile 中显式设置的开关。
  - 深色模式下拉菜单：修复 Windows 和 Linux 深色模式下，下拉列表白底白字、选项难以辨认的问题。
  - Windows 更新安装：兼容旧版更新器传入的静默与隐藏参数，让更新安装进度窗口正常显示。
  - 插件页状态：修复返回已安装插件页时开关重复进入加载、短暂禁用或闪动的问题，保留已读取的状态并在后台刷新。
  使用提示
  - 请先退出旧版应用并备份 ~/.dsh，安装后验证常用插件和工作流程。
  - 如需通过应用内终端管理 desktop Profile 的插件，请先启动 Desktop 完成该 Profile 的初始化。
  - Windows 使用不透明窗口；Linux 仅提供兼容模式。
  完整变更记录 · 项目网站
