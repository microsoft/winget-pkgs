ReleaseNotes: |-
  Stable edition update notice: Starting with the next release, the Stable edition will no longer receive updates and will be replaced by DSH NEXT.
  This release adds Desktop developer logging and a native editing menu, unifies plugin controls, introduces market source configuration, and fixes task notifications, renderer recovery, local path references, and Windows update installation.
  DSH Desktop is a community-maintained open-source project, not an official DeepSeek product.
  Upstream version: DeepSeek Harness v0.2.1-rc.2.
  New and improved
  - Developer logging: Added opt-in Desktop developer logging across Host and renderer processes for correlated model, tool, and session activity, transport timing, process output, and renderer errors. Logs have bounded retention and are included in diagnostic exports without recording chat text or tool inputs/outputs.
  - Startup diagnostics: Added authentication, page-load, DOM-readiness, and preload-failure records, retaining key startup diagnostics even when developer logging is disabled. The renderer boot health deadline is now 120 seconds.
  - Editing context menu: Added a native editing menu with Undo, Redo, Cut, Copy, Paste, and Select All, plus Copy for selected read-only text. Windows labels follow the application language.
  - Plugin controls: The Plugins page brings together market and mobile remote-control management, remembers the selected market, and replaces the old Desktop Settings controls with a link to Plugins.
  - Live plugin toggles: Improved market and mobile remote-control toggles so changes can take effect without restarting the entire application.
  - Market source configuration: Added source configuration for enabling experimental Custom Plugin Markets and configuring or removing sources. The current built-in configurable source is dsh-market; indexes are preloaded on demand during configuration.
  - First-run setup: Added a Custom Plugin Markets option to onboarding that enables the corresponding plugin and configures the dsh-market source.
  Fixes
  - Windows sandbox commands: Reduced console-window popups and focus stealing when running sandboxed commands.
  - Plugin information: Fixed missing component names, descriptions, and icons, and improved package information lookup in Desktop Profiles.
  - Legacy directory cleanup: Fixed cleanup of legacy Profile module links potentially deleting files from an older installation directory.
  - Background task notifications: Foreground commands and tasks canceled during session teardown no longer trigger misleading background-task completion or failure notifications. Tasks that actually continue in the background still notify.
  - Renderer recovery: Fixed the entire app exiting when showing or closing a Compatibility-mode window after its page was destroyed and automatic recovery was exhausted.
  - Local path references: Fixed dropped folders not working. Dropped, pasted, or picked local files and folders now resolve correctly to @ path references in the composer.
  - Sidebar browser: Enabled the right-sidebar browser by default in other Profiles while respecting explicit Profile-level overrides.
  - Dark-mode select menus: Fixed unreadable white-on-white select popups in dark mode on Windows and Linux.
  - Windows update installation: Handled silent and hidden flags passed by older updaters so the installation progress window remains visible.
  - Plugin page state: Fixed switches repeatedly loading, briefly disabling, or flickering when returning to Installed Plugins. Previously loaded state is retained during background refresh.
  Usage notes
  - Quit the previous version and back up ~/.dsh before installing. Verify your usual plugins and workflows afterward.
  - Before managing plugins for the desktop Profile from the bundled terminal, launch Desktop to initialize that Profile.
  - Windows uses opaque windows. Linux supports Compatibility mode only.
  Full changelog · Project website
