ReleaseNotes: |-
  本次更新修复托盘菜单语言混用，并改善 macOS 安装包内 Agents Anywhere 与 Python 工具的兼容性。
  DSH Desktop 是社区维护的开源项目，并非 DeepSeek 官方产品。
  新增与改进
  - 保持 DeepSeek Harness v0.1.5-rc.2，继续使用 ~/.dsh 数据目录。
  - macOS 安装包更新内置 Agents Anywhere，统一稳定版与 Beta 的 AA 版本。
  修复
  - 修复托盘菜单启动时出现中英文混用的问题；跟随系统语言及运行中切换语言时，终端、诊断、更新等菜单项同步更新。
  - 修复 macOS 稳定版内置的旧版 AA 读取 Beta 写入的新配置字段时可能启动失败的问题。
  - 修复 macOS 安装包内 uv 缺少执行权限的问题，并加强 Apple Silicon / Intel 双架构打包与可执行性检查。
  使用提示
  请先退出旧版应用再安装。内置的 DeepSeek Harness v0.1.5-rc.2 为上游候选发布版本。
  完整变更记录 · 项目网站
