ReleaseNotes: |-
  This release fixes mixed-language tray menus and improves compatibility for Agents Anywhere and its bundled Python tooling in the macOS installers.
  DSH Desktop is a community-maintained open-source project, not an official DeepSeek product.
  New and improved
  - Keeps DeepSeek Harness at v0.1.5-rc.2 and continues to use the ~/.dsh data directory.
  - Updated the bundled Agents Anywhere in the macOS installers, aligning the AA version across Stable and Beta.
  Fixes
  - Fixed mixed-language tray menus at startup. Terminal, diagnostics, update, and other menu entries now follow the resolved system language and language changes during use.
  - Fixed the older AA bundled in macOS Stable potentially failing to start when reading newer configuration fields written by Beta.
  - Fixed missing execute permissions on the uv binary bundled in the macOS installers, and strengthened Apple Silicon / Intel packaging and executable checks.
  Usage notes
  Quit the previous version before installing. The bundled DeepSeek Harness v0.1.5-rc.2 is an upstream release candidate.
  Full changelog · Project website
