ReleaseNotes: |-
  DSH NEXT is a new experimental channel built on DeepSeek Harness v0.1.7-rc.1. It uses the official Web frontend and basic Desktop presentation, with desktop tools, plugin markets, mobile remote control, and Computer Use.
  DSH NEXT is part of the community-maintained DSH Desktop project, not an official DeepSeek product. This release belongs to the experimental channel.
  New and improved
  - Official interface with desktop integration: Reuses the official conversation, settings, and plugin pages, adding the system tray, background operation, desktop preferences, task completion/failure notifications, and diagnostic export.
  - Native sidebar browser: Opens sites such as GitHub that block iframe embedding, with real back/forward navigation, address navigation, and pane resizing.
  - Plugins and mobile remote control: Choose Community Market or dshmarket and manage Agents Anywhere remote control at the top of the Plugins page. Switching markets retains installed plugins.
  - Computer Use: Optional computer interaction with screen-recording, Accessibility, and microphone permission controls. Computer Use is off by default in new Profiles and requires explicit enablement and authorization.
  - Setup and Profiles: First-run setup lets you choose a market, remote control, and Computer Use. Create, switch, and manage Profiles from the desktop tools.
  - Recovery assistant: Safe mode, configuration repair, rollback, plugin disabling/re-enabling, and diagnostic export remain available even when the Host cannot start.
  - Browser and LAN access: Ordinary browser access is off by default. Enable it to obtain authenticated login links; LAN access uses HTTPS/WSS.
  - System proxy and updates: Inherits the system HTTP/HTTPS proxy at startup and provides update checks and download/install controls for the separate Next channel.
  Fixes and refinements
  - Completed DeepSeek Platform sign-in and authorization callback handling.
  - Fixed Agents Anywhere Connector startup with certain proxy settings and repeated session synchronization retries.
  - Improved sidebar reopening, window drag regions, folder selection, and desktop settings navigation across the home and plugin pages.
  - Improved market plugin visibility and management, avoiding duplicate market and remote-control entries in the ordinary plugin list.
  - Uses Stable's ~/.dsh home by default while retaining existing custom locations. Next capabilities load only within Next, keeping them out of shared Profile manifests used by Stable or the CLI.
  Usage notes
  - Data directory: Next defaults to ~/.dsh, sharing Profiles and data with Stable. Profiles separate plugin configuration, but do not isolate sessions, accounts, or credentials within the same home. Factory reset also affects shared data in that directory. Back up before trying Next.
  - Separate trial environment: Set DSH_DESKTOP_NEXT_HOME to an absolute path to use a dedicated directory. Next does not select its home from DSH_HOME.
  - Current limits: Next does not yet offer the original Desktop's Extended / Advanced window modes, or the full offline Python / Office runtime and skill payloads from the official upstream distribution.
  - Update channel: Next accepts only Next packages. If the online Next update service is not configured or available, the app reports it as unavailable; download manually from this page.
  - Proxy and permissions: Restart after changing the system proxy. Computer Use requires the relevant OS permissions and a model that supports image input. Mobile remote control is off by default in new Profiles.
  Project website · Next user documentation
  DSH NEXT will gradually replace the Stable edition.
