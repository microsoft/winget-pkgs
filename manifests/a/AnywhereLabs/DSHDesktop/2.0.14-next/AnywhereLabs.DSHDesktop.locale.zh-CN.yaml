ReleaseNotes: |-
  DSH NEXT 是新的实验通道：基于 DeepSeek Harness v0.1.7-rc.1，直接使用官方 Web 前端与基本桌面样式，集成桌面工具、插件市场、手机远控和 Computer Use。
  DSH NEXT 属于社区维护的 DSH Desktop 项目，并非 DeepSeek 官方产品。本版本属于实验通道。
  新增与改进
  - 官方界面与桌面集成： 复用官方对话、设置和插件管理页面，加入系统托盘、后台运行、桌面设置、任务完成／失败通知与诊断导出。
  - 原生侧边栏浏览器： 可在侧边栏打开 GitHub 等不允许 iframe 嵌入的网站，支持真实的前进、后退、地址导航与分栏调整。
  - 插件与手机远控： 在插件页顶部切换社区市场或 dshmarket，并管理 Agents Anywhere 远程控制；切换市场保留已安装插件。
  - Computer Use： 提供可选的电脑操作能力，以及屏幕录制、辅助功能和麦克风权限入口。新 Profile 默认关闭 Computer Use，按需启用并授权。
  - 首次引导与 Profile： 首次启动可选择插件市场、远程控制和 Computer Use，支持新建、切换与管理 Profile。
  - 恢复助手： 提供安全模式、配置修复、回滚、插件停用／重新启用和诊断导出，Host 无法启动时仍可使用。
  - 浏览器与局域网访问： 默认关闭普通浏览器访问；按需开启后提供带认证的登录链接，局域网访问使用 HTTPS/WSS。
  - 系统代理与更新： 支持启动时继承系统 HTTP/HTTPS 代理，并提供独立 Next 通道的更新检查与下载安装入口。
  修复与完善
  - 完善 DeepSeek 平台登录与授权回调流程。
  - 修复 Agents Anywhere Connector 的代理配置启动问题和会话同步反复重试问题。
  - 改善首页及插件页的侧栏展开、窗口拖动区域、目录选择和桌面设置导航。
  - 完善市场插件的显示与管理，避免市场和远控入口在普通插件列表中重复出现。
  - 默认与稳定版共用 ~/.dsh，保留已有自定义目录；Next 的桌面能力仅在 Next 运行时加载，避免写入共享 Profile 后影响稳定版或 CLI。
  使用提示
  - 数据目录： Next 默认使用 ~/.dsh，可与稳定版共享 Profile 和数据。Profile 区分插件配置，但不隔离同一数据目录中的会话、账号和凭据；恢复出厂设置也会影响该目录中的共享数据。首次体验前请备份。
  - 独立试用： 如需使用独立数据目录，可将 DSH_DESKTOP_NEXT_HOME 设置为绝对路径；Next 不通过 DSH_HOME 选择数据目录。
  - 功能边界： Next 暂不提供原桌面版的扩展／增强窗口模式，也尚未集成上游官方发行版完整的离线 Python / Office 运行时与技能资源。
  - 更新通道： Next 只接受 Next 安装包。线上 Next 更新服务尚未配置或不可用时，会显示不可用状态，可从本页手动下载安装。
  - 代理与权限： 修改系统代理后需重启应用；Computer Use 需要相应系统权限和支持图像输入的模型。新 Profile 的手机远控默认关闭。
  项目网站 · Next 使用说明
  DSH NEXT 将逐步取代稳定版。
