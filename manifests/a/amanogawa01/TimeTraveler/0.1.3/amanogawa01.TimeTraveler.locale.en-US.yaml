ShortDescription: A command-line tool that turns Git history into music.
Description: Time Traveler is a command-line tool that analyzes a Git repository's commit history and turns development activity into music. It maps repository statistics such as commit frequency, lines changed, file activity, and churn to musical properties including tempo, scale, intensity, note density, and dissonance, then synthesizes the result as audio.
