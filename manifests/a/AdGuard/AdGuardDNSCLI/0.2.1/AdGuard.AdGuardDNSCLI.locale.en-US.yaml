ReleaseNotes: |-
  Why release many change when few change do trick? 🤔
  Following the paraphrased wisdom by The Office’s Kevin Malone, we decided to limit ourselves to select few changes in this release: security fixes, Go update, and the new debug API.
  Full changelog
  See also the v0.2.1 GitHub milestone.

  Security
  - Go version has been updated to prevent the possibility of exploiting the Go vulnerabilities fixed in 1.27.1.
  - AdGuard DNS CLI is now more resistant to resource exhaustion attacks when using DNS-over-QUIC.

  Removed
  - The support for macOS 13 Ventura, see Go 1.27 release notes.

  Added
  - A Debug HTTP API for runtime profiling via pprof. The API serves pprof endpoints under the /private/debug/pprof/ path and is disabled by default. To enable it, configure the debug.pprof object in the configuration file:
    debug:
        pprof:
            enabled: true
            port: 6060
