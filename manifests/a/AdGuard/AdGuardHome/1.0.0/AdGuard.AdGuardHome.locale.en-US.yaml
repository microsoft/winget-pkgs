ReleaseNotes: "Since the beta of AdGuard Home v1.0 was released in late September, we collected feedback and acted accordingly. The product has gone through major overhaul both under the hood and appearance-wise in the beta versions. The stable release adds the fine-tuning that users asked for. Today, we are releasing AdGuard Home v1.0.\n\n## A redesign you don’t have to relearn\n\nThe web interface for AdGuard Home has been completely updated to look cleaner, more modern, and fully aligned with the rest of the AdGuard ecosystem. Avoiding overall layout changes was intentional — we didn’t wish for you to stress out while relearning where every button is. We refreshed the visual style while preserving the familiar logic. We wrote extensively about it in our [article on the beta version](https://adguard-dns.io/en/blog/adguard-home-v1-0-beta.html), it is worth a look if you need more information. \n\n![New dashboard](https://cdn.adtidy.org/content/release_notes/dns/home-v1-0-beta/dashboard.png)\n\nBut this overhaul goes deeper than looks. The new frontend shares the backend’s strict optimization philosophy. Rebuilt with fine-grained reactivity, it is now significantly lighter and faster. This update also resolves memory consumption issues linked to the old interface, making AdGuard Home run smoothly on low-power devices, and introduces a fully responsive mobile UI.\n\n![Before and after](https://cdn.adtidy.org/content/release_notes/dns/home-v1-0-beta/adguard_home_before_after.png)\n\n## New release model\n\nWe are adopting a more flexible development and versioning model used by other AdGuard products. Minor releases may now include backward-incompatible changes, which lets us ship features faster.\n\nWhat does this mean for you? Moving forward, the new release cycle will focus on delivering features and tools, not just patches and library updates.\n\nNo migration needed：v1.0 keeps the same configuration schema as v0.107.x, , so your existing configuration works as is.\n\n## What changed since the beta\n\nWhile the first beta of v1.0 introduced a globally changed interface, the second beta was all about stability. 18 changes were included in it, we will highlight the most important ones below; you can consult the full list in the [changelog](https://github.com/AdguardTeam/AdGuardHome/releases/tag/v1.0.0-b.2).\n\n• **DHCP:** IPv4 settings can now be saved alongside an IPv6-compatible interface, DHCP starts with a DHCPv6-only configuration, and subnet validation works as expected.\n• **Clients and ClientIDs:** IPv6 CIDRs with an embedded IPv4 address are accepted, malformed MAC addresses and leading-zero octets are rejected, and per-client schedules survive saving.\n• **Interface:** long values no longer overflow dialogs, encrypted DNS addresses appear in the Setup Guide right away, and emoji passwords work in the wizard.\n• **DNS:** DDR returns a valid SVCB record with empty DoH routes, schedules no longer shift on clock changes, and command-line updates work with private reverse DNS enabled.\n• **Everything else:** `--check-config` behaves correctly on first launch, and `log.enabled：false` now disables the legacy logger.\n\nOne change deserves a special mention. New installations now use *Cloudflare DNS* as the default upstream and bootstrap servers instead of *Quad9*. \n\nThe new defaults are `https://cloudflare-dns.com/dns-query` for the upstream and `1.1.1.1`, `1.0.0.1`, `2606:4700:4700::1111`, `2606:4700:4700::1001` for the bootstrap. Previously we used `https://dns10.quad9.net/dns-query` with `9.9.9.10`, `149.112.112.10`, `2620:fe::10`, `2620:fe::fe:10`. Existing configurations are not migrated automatically. \n\n> Users whose traffic goes through France, should update the upstream and bootstrap addresses before November 24, when *Quad9* stops serving the country.\n\nAlso, client settings are now more specified：*Use global settings* covers *Protection* only, blocked services have their own switch, and upstream and cache settings stay editable. You can apply global settings when you want many clients to share the same configuration, or set things up per-client when you want an individual approach.\n\n## Our plans for future releases\n\nAdGuard Home v1.0 won’t be the last version to bring major changes — we plan to keep improving it until it reaches its full potential. A self-diagnostics page, mass-importing of filtering lists, a built-in search tool for the interface and the ability to automatically issue and renew TLS certificates are currently in the works. We intend to move the product forward at a faster pace from now on.\n\n## How to update or switch to v1.0\n\n**If you are using the beta or edge channel:** You don’t need to do anything. The update will go through automatically via the built-in updater.\n\n**If you are on the stable version:** Follow the UI prompt to update.\n\n**If you prefer using CLI:** Run the command `./AdGuardHome --update -v`\n\n**If you are updating through Docker:** Set the image tag to `:latest`, then recreate and restart the container.\n\n## Your feedback is important for our development\n\nFound a bug or have a suggestion? Let us know on [GitHub](https://github.com/AdguardTeam/AdGuardHome/issues). \n\n> [!TIP]\n> Use the search bar first to check if someone else has already reported the issue. If it’s a new one, open a ticket, and we’ll dive right into it.\n\n## Full changelog\n\nSee also the [v1.0.0 GitHub milestone][ms-v1.0.0].\n\n### Security\n\n• Go version has been updated to mitigate the possibility of exploiting the Go vulnerabilities fixed in [1.27.4][go-1.27.4].\n\n### Changed\n\n• The default upstream and bootstrap addresses have been changed from Quad9 to Cloudflare DNS, since Quad9 is adding geography-based restrictions (#8686).\n\n    **NOTE:**  If you live in the affected area (France) and still have not changed your upstream, bootstrap, and possibly fallback addresses, it is recommended that you do so.\n\n    See our [list of known DNS providers][dns-kb-list].\n\n• Client settings in the new web interface：*Use global settings* now applies to Protection only, blocked services have a separate *Use global blocked services* switch, and upstream DNS servers and the DNS cache are always editable.\n\n### Fixed\n\n• The new web interface install wizard counting the minimum password length in UTF-8 bytes and letting the server reject a password it had accepted; the minimum is now counted in characters, as the server does.\n\n• Changing the theme in the new web interface failing with `unknown language：\"\"` on installations that never selected a language.\n\n• Init script actions not being passed to System V and OpenWrt services.\n\n• DNS rewrites with trailing dots not matching (#8674).\n\n• Shutdown deadlock when looking up clients for query accounting (#8658).\n\n• CLI update failing when an upstream is specified by a hostname defined only in `/etc/hosts`.\n\n• The *Check the filtering* result in the new web interface showing only the first matched rule (#8677).\n\n• Panic on binding to a busy port (#8656).\n\n• Expired dynamic leases are served by DNS (#8671).\n\n• The *Check for updates* button disappearing and raw or untranslated error messages being shown when the update check or the DNS server status check failed in the new web interface (#8681).\n\n• The theme selected in the new web interface not being saved to the server (#8699).\n\n• Invalid SVCB record from DDR when DoH routes are empty.\n\n• Schedule shift on clock change cases (#8670).\n\n• Incorrect behaviour on the first launch with the `--check-config` flag.\n\n• Reading partially received TCP prefix.\n\n• A panic when updating AdGuard Home binary via the command line with `use_private_ptr_resolvers` set to true (#8613).\n\n• `log.enabled` set to `false` leaving the legacy logger enabled (#8565).\n\n• DHCP server persisting uncommitted leases with zero expiry after `DHCPDISCOVER` messages (#8572).\n\n• DHCPv4 settings not being saved when an IPv6-capable interface is selected and DHCPv6 is not configured (#8608).\n\n• DHCP not being enabled when only the DHCPv6 section is configured.\n\n• DHCP IPv4 range subnet validation not working (#8609).\n\n• Client ID validation rejecting valid IPv6 CIDRs with an embedded dotted-decimal IPv4 address (#8610).\n\n• Client ID validation accepting IPv4 addresses with leading-zero octets (`192.168.01.1`), malformed MAC addresses, and ClientIDs with leading or trailing hyphens.\n\n• IP addresses being sorted lexicographically instead of numerically in the web interface (#8636).\n\n• Invalid secondary bootstrap resolver IPv4 address (#8637).\n\n• The *Server addresses* dialog overflowing horizontally when a long value is entered. Long unbreakable values in the settings rows overflowing the page.\n\n• Encrypted DNS server addresses not appearing in the Setup Guide until the page was reloaded after enabling encryption.\n\n• Passwords containing emoji being rejected by the first-run setup wizard in the new web interface.\n\n• Cache size and TTL override rows being locked while the DNS cache was disabled in the new web interface (#8644).\n\n• Tables staying on an empty page after the last row of that page was deleted in the new web interface (#8644).\n\n• The *Log out* button opening the login page in a new tab in the new web interface (#8661).\n\n• Per-client blocked services schedules being reset when a client was saved in the new web interface (#8638).\n\n• Client sub-pages of the new web interface showing the default values instead of the client's settings when opened directly or reloaded.\n\n### Removed\n\n• The following deprecated HTTP APIs:\n    • `GET /control/blocked_services/list`\n    • `GET /control/blocked_services/services`\n    • `GET /control/clients/find`\n    • `GET /control/i18n/current_language`\n    • `GET /control/querylog_info`\n    • `GET /control/stats_info`\n    • `POST /control/blocked_services/set`\n    • `POST /control/i18n/change_language`\n    • `POST /c"
