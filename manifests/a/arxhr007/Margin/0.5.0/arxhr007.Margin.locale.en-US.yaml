ShortDescription: Turns the edges and corners of a laptop touchpad into controls for volume, brightness, seeking, shortcuts and more.
Description: |-
  Margin turns the strip around a laptop touchpad into controls. Slide along an edge for volume, screen brightness, seeking a video, zoom, switching windows or virtual desktops, skipping tracks, or your own shortcut. Press a corner once, twice or three times, or press and hold it, to mute, take a screenshot, lock the PC, open an app or website, press a shortcut, or run a command. You choose what each edge and corner does, for all apps or per app; the middle stays a normal touchpad.
  Needs a precision touchpad. Margin runs from the tray, uses no network and sends no telemetry.
