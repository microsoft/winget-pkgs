ReleaseNotes: |-
  NextCoWork 3.0.2
  3.0 是重新打造的新一代桌面应用(.NET + Avalonia,内置 C# Agent),NextCoWork 以后的新功能都只在 3.0 里提供。已经装了 3.0.1 的会自动更新到 3.0.2。
  3.0.2 更新内容
  新功能
  - 供应商：能从本机其他 AI 工具(Claude Code、Codex、cc-switch、opencode、Gemini CLI 等)和环境变量里自动发现已有的配置，一键导入；添加 / 编辑供应商改成两步式弹窗，内置常用服务的模版。
  - 模型：新的「编辑模型」弹窗，可以改名称、上下文窗口、能力和价格，不再只能改名。
  - 输入框：内置斜杠命令 /goal、/compact、/model、/clear。
  - 会话：权限档位记在会话上，切换会话 / 项目时跟着走。
  - 启动：新的启动动画。
  性能与内存
  - 运行时升级到 .NET 11;Agent 改用 Satori GC(实验性的低停顿垃圾回收器)。
  - 设置的各个分页、右侧面板的各页改成用到时才创建，设置关掉后释放，界面常驻内存明显下降。
  - 很长的「思考」展开后限高、在框内滚动并跟到最新内容，只渲染看得见的部分，不再越长越卡。
  - 模型目录的加载和同步不再在内存里留下几 MB 的临时数据；内容没变时不再重复解析。
  修复
  - 结束的任务不再把旧错误和残留的工具调用钉在对话末尾。
  - 鼠标停在内联可视化上时也能滚动对话。
  - 插件弹出的确认 / 输入提示按界面语言显示。
  - 项目设置刚打开时不会误显示「保存 / 还原」。
  从 2.x 升级
  - 最简单：把 2.x 升级到 2.9.2,在「设置 → 关于」里点「下载 3.0」,下载并校验完成后点「重启并安装 3.0」。
  - 手动：从下方下载你平台的安装包，先完全退出 2.x,再打开 3.0。
  - 首次打开 3.0 时，会先对 2.x 的数据做一份完整备份，再自动迁移项目、会话、设置和供应商配置；个别没能自动迁移的密钥，3.0 会列出来请你重新填写。
  - 迁移时 2.x 必须是关闭的；迁移完成后，这台电脑上的 2.x 不会再打开这份数据，以免两个版本同时写坏它。
  - 想回到 2.x:在 3.0 的「设置 → 数据」里选「回到 NextCoWork 2.x」,数据会恢复成迁移前的样子(迁移之后在 3.0 里新写的内容不会带回来)。
  - 和其他设备的配对需要在 3.0 里重新扫码；2.x 的独立设备服务 3.0 不再支持。
  已知限制
  - macOS 目前只有 Apple 芯片版，没有 Intel 版，也没有 .pkg 安装包。
  - Windows 和 Linux 的安装包尚未在足够多的真机上验证，遇到问题请到 Issues 反馈，并附上系统版本。
  - Windows 和 Linux 的包没有代码签名(和 2.x 一致)。
  - 3.0 的后续更新由 3.0 自己的更新源提供，不走 2.x 的自动更新。
