ShortDescription: 编码型 Agent 桌面端，在本地目录中读写、检索并执行任务。
Description: NextCoWork 是一款编码型 Agent 桌面端。打开一个本地目录作为工作区，Agent 就在这个目录里读写、检索和执行，将模型能力直接放进你的代码目录。
