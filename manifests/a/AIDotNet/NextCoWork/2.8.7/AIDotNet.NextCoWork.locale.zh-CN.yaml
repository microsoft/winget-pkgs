ReleaseNotes: |-
  修复
  - 任务卡住后计时一直走、点停止没反应(#187):点停止后若任务 5 秒内仍未收尾，主进程会强制结束该运行并释放会话，之后该运行的迟到写入一律丢弃，不会覆盖新运行的历史；界面侧 7 秒后会向主进程核对实际状态，补齐漏掉的结束事件，不再无限计时
  - 无法删除会话、重启后才能删：删除改按真实运行状态判定。没有 Agent 在执行时直接删除，停止后残留的运行条目会自动清理；确有 Agent(含后台子 Agent)在执行时弹窗提示，可选「停止并删除」
  - 软链接目录下的文件打不开、复制路径报错(#182):工作区内通过软链接(含 Windows 目录联接)进入的文件现在可以打开、保存和复制路径，复制得到的是工作区内的路径；.. 越界仍会被拒绝。新建、重命名、移动、删除等结构性操作在软链接目录内仍不支持
  - 设置里编辑 MCP 整个界面白屏：旧版本或导入留下的 MCP 配置缺少 args / envNames / headerNames 等字段时，打开编辑器会抛错导致整窗白屏。现在打开前会先规整配置；设置页与 MCP 弹窗加了错误边界，出错时显示错误信息和重试按钮。同时修复带空格的参数在「打开再保存」后被拆成两个的问题
