ReleaseNotes: |-
  NextCoWork 3.0.7
  3.0 的补丁版本。已经装了 3.0.x 的会自动更新到 3.0.7;从 2.x 升级的方法见下文。
  3.0.7 更新内容
  改进
  - 工具调用默认收起：对话里两段文字之间连续的工具调用(读文件、搜索、改文件、跑命令……)现在收成一行摘要，长任务不再刷满屏。运行中这一行显示正在做什么，比如「正在编辑 HostedProvider.cs · 第 3 个操作」;结束后显示「读取 2 个文件，运行 1 条命令」这样的统计，以及增删行数和失败个数(红色)。点一下展开，看到原来的每一条工具调用。
    - 只有一个工具时不分组，还是原来的单行。
    - 需要你审批的工具、生成的图片 / 视频 / 音频、可视化卡片不会被收起来，始终原位显示。
    - 一轮回答写完后，和以前一样由「工作区」把整轮的过程收起；展开「工作区」后，里面的连续工具仍是一行摘要，可以再展开。
  3.0.6 已包含的内容
  3.0.6 只通过 3.0 的自动更新发布，这里一并列出：
  - 修复登录 NextCoWork 账户后请求 Claude 模型返回 401: 内置托管供应商改用 Authorization: Bearer 鉴权，供应商调试台和模型列表探测同样修复。
  从 2.x 升级
  - 最简单：把 2.x 升级到 2.9.2,在「设置 → 关于」里点「下载 3.0」,下载并校验完成后点「重启并安装 3.0」。
  - 手动：从下方下载你平台的安装包，先完全退出 2.x,再打开 3.0。
  - 首次打开 3.0 时，会先对 2.x 的数据做一份完整备份，再自动迁移项目、会话、设置和供应商配置；个别没能自动迁移的密钥，3.0 会列出来请你重新填写。
  - 想回到 2.x:在 3.0 的「设置 → 数据」里选「回到 NextCoWork 2.x」。
  已知限制
  - macOS 目前只有 Apple 芯片版，没有 Intel 版。
  - Windows 和 Linux 的安装包尚未在足够多的真机上验证，遇到问题请到 Issues 反馈，并附上系统版本。
  - Windows 和 Linux 的包没有代码签名。
