ReleaseNotes: |-
  NextCoWork 3.0.5
  3.0 的补丁版本。已经装了 3.0.x 的会自动更新到 3.0.5;从 2.x 升级的方法见下文。
  3.0.5 更新内容
  修复
  - Claude 5.5 系列不能用(#202): claude-opus-5-5、claude-sonnet-5-5 等新模型只接受自适应思考，之前发出的思考参数会被直接拒绝(requires adaptive thinking)。现在 Claude 4.6 及以后的模型都改用自适应思考，思考档位照常可选；「关闭思考」按各型号支持的方式发送(Opus 5.5 不能关闭思考，会降到最低档)。
  - Windows 托盘右键没有菜单、无法退出(#200): 托盘右键菜单现在能正常弹出(打开、新建会话、通知设置、退出等)。另外新增「退出 NextCoWork」命令：命令面板(Ctrl+K)里可以找到，快捷键 Ctrl+Q(macOS 上是 ⌘Q)。
  - 任务执行中看不到进度(#200): 对话运行期间，末尾的「正在生成回复」提示不会再因为之前出错的任务残留的状态而消失；由排队、目标续跑或其他设备发起的任务也会显示。
  - 报错看不出原因(#200): 错误卡片的「详情」里现在会显示上游的 HTTP 状态码、中转网关放在错误信息之外的具体原因，以及连接失败的底层原因(DNS、TLS 等)。反馈问题时请附上「详情」里的内容。
  - 带图片的消息被拒后整个会话都发不出去：上游以请求无效(400 等)拒掉带图片的那一轮后，之后的消息不再重复发送那张图片，会话可以继续使用。
  改进
  - 终端(#194): 右键菜单可以复制、粘贴和清屏。Windows / Linux 上选中文字后 Ctrl+C 是复制(没有选中时仍是中断),Ctrl+Shift+C 没有选中时不再误发中断；焦点在终端里时，Ctrl+L 等 shell 快捷键直接交给终端。清屏只清当前显示的内容，切换标签页或重新连接后会恢复设备上保存的输出。
  - 媒体生成：对话里可以生成图片、视频和语音。在「设置 → 通用 → 媒体工具」里为每种媒体单独选择供应商和模型，结果存为会话附件，可以预览和另存为。
  3.0.3 / 3.0.4 已包含的内容
  这两个版本只通过 3.0 的自动更新发布，这里一并列出：
  - 对话内的工作流编排，可视化显示每个步骤。
  - 输入框可以粘贴剪贴板里的图片和文件路径，没有正文时也能单独发送附件。
  - 供应商调试台、内置托管供应商、明暗主题、项目图标。
  - 供应商按类型区分(文本 / 图片 / 视频 / 音频),支持 OpenAI、火山方舟的图片与视频和 OpenAI 的语音。
  - VS Code 风格的文件浏览与标签页(单击预览、双击固定、路径面包屑)、会话置顶。
  - Hooks 支持用模型做判定、更多事件；子代理可以在独立的 git worktree 里工作并能恢复。
  - Windows 版的 exe、窗口和安装程序带上了应用图标(#199)。
  从 2.x 升级
  - 最简单：把 2.x 升级到 2.9.2,在「设置 → 关于」里点「下载 3.0」,下载并校验完成后点「重启并安装 3.0」。
  - 手动：从下方下载你平台的安装包，先完全退出 2.x,再打开 3.0。
  - 首次打开 3.0 时，会先对 2.x 的数据做一份完整备份，再自动迁移项目、会话、设置和供应商配置；个别没能自动迁移的密钥，3.0 会列出来请你重新填写。
  - 想回到 2.x:在 3.0 的「设置 → 数据」里选「回到 NextCoWork 2.x」。
  已知限制
  - macOS 目前只有 Apple 芯片版，没有 Intel 版。
  - Windows 和 Linux 的安装包尚未在足够多的真机上验证，遇到问题请到 Issues 反馈，并附上系统版本。
  - Windows 和 Linux 的包没有代码签名。
