ReleaseNotes: |-
  这是 NextCoWork 2.x 的最后一个版本。
  新功能
  - 升级到 NextCoWork 3.0 的引导：3.0 发布后，标题栏右端会出现一颗升级图标，「设置 → 关于」顶部有升级说明：数据会在第一次打开 3.0 时自动迁移(迁移前先做完整备份)、和其他设备需要在 3.0 里重新配对、2.x 的独立设备服务 3.0 不再支持、升级后可以在 3.0 的「设置 → 数据」里回到 2.x。点「前往下载并退出」会打开官网下载页并正常退出 2.x(迁移时 2.x 必须是关闭的)。3.0 是单独的安装包，不会经 2.x 的自动更新下载
  修复
  - 数据被 3.0 接管后，2.x 仍会打开并写入同一份数据：2.x 不认识 3.0 的数据库迁移，会跳过它们照常写入，两个版本交替打开会把数据写坏。现在 2.x 启动时先检查，发现数据已由 3.0 接管就不再打开，改为提示「打开 NextCoWork 3.0 / 下载 3.0 / 退出」
