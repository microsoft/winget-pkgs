Description: >-
  A small, privacy-friendly Windows tray application that reads local Codex
  session data and displays the latest available usage. It offers optional
  normal and compact desktop widgets, a thin taskbar usage indicator,
  configurable notifications, and does not require account credentials or
  send telemetry.
