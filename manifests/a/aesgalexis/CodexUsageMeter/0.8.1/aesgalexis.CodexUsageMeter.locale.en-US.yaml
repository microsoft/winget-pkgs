ShortDescription: Windows tray app for viewing local Codex usage limits.
Description: >-
  A small Windows tray application that reads local Codex usage and task-state
  metadata. It displays weekly and rolling five-hour limits through widgets,
  a tray icon and a multi-display taskbar indicator. Available resets use the
  installed, signed-in Codex client, which may contact OpenAI for account
  metadata. The meter requests no password or API key and includes no analytics
  or telemetry.
Moniker: codex-usage-meter
Tags:
  - codex
  - openai
  - system-tray
  - usage
  - windows
ReleaseNotes: |-
  - Shows available reset credits separately from the currency credit balance in the normal usage card, with both values in the compact widget tooltip.
  - Reads the authoritative reset count through the installed Codex client's read-only rate-limit interface, using its existing sign-in. Queries run only while the card is visible, at most once per minute, and never redeem resets.
  - Distinguishes unavailable reset data from zero, marks retained counts as stale after a failed query, and documents the additional account-metadata request.
ReleaseNotesUrl: https://github.com/aesgalexis/codex-usage-meter-windows/releases/tag/v0.8.1
