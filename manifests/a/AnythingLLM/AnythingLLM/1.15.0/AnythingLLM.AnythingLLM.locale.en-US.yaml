ReleaseNotes: |-
  # AnythingLLM Is Now An AI Agent Across Your Os

  With AnythingLLM 1.15.0 for Desktop we have been working hard on what it means to bring your agent
  to you. Something that is still local, but outside of the walls of an app or a browser. This release
  features our first 3 features about this effort - we hope you enjoy them.

  ## Introducing Magic Features

  Magic Features bring AI to your entire computer — not just inside AnythingLLM. Dictation, text
  actions, and autocomplete that work in any app, fully on-device.

  All Magic Features are free to use — no signup required. Pro removes the daily limits.

  #### AnythingLLM Pro

  Nothing about AnythingLLM is changing. Pro is purely additive — no existing features are affected,
  nothing is being locked away.

  Every Pro feature will always have a free daily tier, no signup required.

  You can read more about what AnythingLLM Pro is here.

  ## Magic Echo - Docs

  > A smarter voice-to-text dictation that works anywhere on your OS. Can replace tools like
  > SuperWhisper or WhisprFlow entirely. Fully on-device.

  Speak naturally and your words appear right where your cursor is — transcribed, cleaned up, and
  punctuated. Echo can see what's on your screen to make dictations smarter and more contextual.

  Includes custom dictionary support, voice commands, and more.

  ## Magic Beacon - Docs

  > Highlight text in any app and instantly act on it with AI.

  Highlight any text on your screen and instantly act on it — summarize, translate, rewrite, research,
  or run a custom action. Beacon works in any app without switching windows.

  It also has full access to your agent skills, MCPs, and tools — AnythingLLM's entire capability set,
  available anywhere your cursor is.

  ## Magic Tab - Docs

  > Grammarly across your entire computer - fully on-device.

  As you type, Magic Tab suggests what comes next — in any app, aware of what you're working on so
  suggestions actually fit. Click into a text field and it'll suggest something before you've typed a
  single letter.

  If you use Grammarly, Tab can replace it entirely — privately, on your device.

  -------------------------------------------------------------------------------------------------

