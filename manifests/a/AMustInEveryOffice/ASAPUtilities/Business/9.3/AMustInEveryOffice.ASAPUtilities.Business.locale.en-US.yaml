ReleaseNotes: |-
  We're happy to announce that version 9.3 is now available for download!
  Switch Back to Previous Sheet, a small but very useful new tool that lets you instantly return to the sheet you used last and easily switch back and forth between two sheets, even when they are in different workbooks.
  We've also expanded the List All Named Ranges in Workbook tool so it now includes Excel table names. In addition, this release includes several small improvements, fixes, and compatibility updates.
  We invite you to upgrade to version 9.3.
