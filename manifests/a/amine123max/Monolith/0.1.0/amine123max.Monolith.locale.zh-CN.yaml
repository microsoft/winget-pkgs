ShortDescription: 本地优先的桌面 AI Agent 客户端，使用你自己的 API Key 协调多智能体工作。
Description: Monolith 将对话、代码、终端、文件编辑与多智能体编排整合进一个桌面工作区。你接入自己的 OpenAI 兼容或 Anthropic 兼容端点；会话、用量统计与配置全部保存在 ~/.Monolith 下的本地 SQLite 数据库中，API Key 经 Windows DPAPI 加密后才落盘。界面提供 Chat 与 Code 双模式、可调宽度的右侧工作面板（文件、侧边聊天、内嵌浏览器）、真实的底部终端、可选的本地 PIN 安全锁、深浅主题与 11 种界面语言。安装器额外携带 WebView2 离线安装包，可覆盖未预装 WebView2 运行时的机器。
