ShortDescription: A local-first desktop client for coordinating AI agents with your own API keys.
Description: Monolith brings chat, code, terminals, file editing, and multi-agent orchestration into one desktop workspace. You connect your own OpenAI-compatible or Anthropic-compatible endpoints; conversations, usage statistics, and configuration stay in a local SQLite database under ~/.Monolith, and API keys are encrypted with Windows DPAPI before they ever touch the disk. The interface ships with Chat and Code modes, a resizable right-hand work panel, a real bottom terminal, an optional local PIN gate, light and dark themes, and 11 UI languages. The installer carries an offline WebView2 package for machines without the WebView2 runtime.
