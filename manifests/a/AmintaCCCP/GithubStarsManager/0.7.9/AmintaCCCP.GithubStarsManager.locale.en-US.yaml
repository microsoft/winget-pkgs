ReleaseNotes: |-
  Warning
  The Repository Q&A Assistant is still in an early stage. Please keep the following in mind before using it:
  - Expect bad cases. Retrieval may fail and answers may be wrong or incomplete. If an answer feels shallow, raise the Task depth setting at the bottom-left of the chat input (Default / Quick / Deep / Unlimited).
  - The app does not index every file of the repository being asked about. It is designed for simple questions and quick lookups (usage, docs, recent changes, small implementation details). For complex, whole-codebase analysis and multi-file reasoning, we recommend cloning the repository locally and using a mature coding agent of your choice.
  - Function calling is disabled by default. The experimental native tool loop must be enabled manually in Settings → AI Configuration → Repository Q&A → Advanced Settings → "Tool-loop mode (experimental)", and it only takes effect on chat models marked as supporting tool calling.
  Warning
  仓库问答助手仍处于早期阶段，使用前请注意以下几点：
  - 请对 Bad case 保持宽容。 检索可能失败，回答也可能出错或不完整。如果觉得回答不够深入，可以在聊天输入框左下角把「任务深度」调高（默认 / 快速 / 深入 / 不限）。
  - 本应用并不会索引被提问仓库的全部文件，因此只适合简单的问题提问与信息检索（例如用法、文档、最近更新、小范围的实现细节）。如果需要进行复杂的代码分析与推理，建议把仓库克隆到本地，使用市面上成熟的 coding agent 来完成。
  - Function calling（原生工具循环）默认是关闭的，需要手动开启：进入「设置 → AI 配置 → 仓库问答 → 高级设置」，勾选「工具循环模式（实验性）」。该功能仅对勾选了「支持工具调用」的聊天模型生效。
  What's New in v0.7.9
  Version 0.7.9 is a quality-and-polish release: a much smarter Repository Q&A experience (streaming answers, task depth, citation badges, and new Release/Issue sources), more accurate platform detection across the app, fixes for several long-standing UI annoyances, and more reliable Docker publishing with a new all-in-one image.
  Changes

  | Pull request | Summary                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              |
  | ------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | #311         | Major Repository Q&A experience upgrade: real streaming answers rendered character by character (OpenAI, DeepSeek, Claude, Gemini and compatible providers), a Task depth selector (Default / Quick / Deep / Unlimited) that controls retrieval rounds and read scope, inline file:line citations rendered as badges with hover previews that jump to the exact GitHub source line, a collapsible execution timeline, and copy / regenerate actions under each answer. Also fixed the top header disappearing when dropdowns opened. |
  | #314         | The Q&A assistant gains two new information sources: Release notes & asset lists (answers "what changed recently" and "which platform builds are provided") and GitHub issue search including closed issues with comment excerpts (answers "I hit this problem, how do I fix it"). Both go through the same citation-verification pipeline as file evidence. An experimental native function calling tool loop that lets the model decide its own evidence-gathering order is also included — disabled by default.                   |
  | #313         | Platform icons across the app unified to Simple Icons brand glyphs; each release asset row now shows a square platform badge and the asset's own update date; platform detection is now deterministic — inferred from file extensions and filename semantics across recent releases (with topics/description as fallback), so repository cards show what a project actually builds.                                                                                                                                                  |
  | #310         | Fixed two long-standing annoyances: the repository edit modal no longer closes by itself seconds after opening it from a keyword-searched list (background sync no longer wipes the active search results), and the page no longer jitters when the scrollbar appears or hides (constant scrollbar gutter).                                                                                                                                                                                                                          |
  | #312         | Fixed the AI search bar drawing over the top header when scrolled, and fixed the page behind an open modal/side sheet still being scrollable (double scrollbars in the Q&A sheet). Background scrolling is now properly locked while overlays are open.                                                                                                                                                                                                                                                                              |
  | #308         | New optional all-in-one Docker image (ghcr.io/amintacccp/github-stars-manager) that serves the web UI and the backend API from a single container, with a docker-compose.fullstack.yml example and setup/migration docs. All existing deployment options are unchanged.                                                                                                                                                                                                                                                              |
  | #307         | Stabilized multi-architecture Docker publishing: the frontend static build now runs once on its native platform (no slow QEMU emulation), superseded publishing runs are canceled automatically, and the frontend/backend builds use separate build caches with timeouts — amd64 + arm64 images publish reliably.                                                                                                                                                                                                                    |

  v0.7.9 更新内容
  0.7.9 是一个打磨体验的版本：仓库问答全面升级（流式回答、任务深度、引用徽章、Release/Issue 信息来源），全应用的平台识别更准确，修复了一批影响日常使用的界面问题，Docker 发布更稳定并新增一体化镜像。
  变更列表

  | Pull request | 摘要                                                                                                                                                                                                                                                                                                                                                                       |
  | ------------ | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | #311         | 仓库问答体验大升级：支持真正的流式回答（逐字显示，兼容 OpenAI、DeepSeek、Claude、Gemini 等接口）；新增任务深度选择器（默认 / 快速 / 深入 / 不限），控制取证轮数与读取范围；回答中的 file:line 引用渲染为徽章，可悬浮查看原文、点击直达 GitHub 源码对应行；执行过程时间线默认折叠、状态一目了然；每条回答下方新增复制与重新生成按钮。同时修复了打开下拉框时顶栏消失的问题。 |
  | #314         | 问答助手新增两类信息来源：Release 说明与安装包清单（可回答"最近更新了什么""提供哪些平台的构建包"）和 GitHub Issue 搜索（含已关闭 Issue 与评论摘录，可回答"遇到 XXX 问题怎么解决"）。两类结果与文件证据一样经过引用校验。另提供实验性的原生 function calling 工具循环（由模型自主决定取证顺序），默认关闭。                                                                 |
  | #313         | 全应用平台图标统一为 Simple Icons 品牌字形；Release 资产行新增方形平台徽章与资产自身的更新时间；平台检测改为确定性规则——根据文件扩展名与文件名语义统计最近 Release 的实际产物（辅以 topics/仓库描述推断），仓库卡片展示的平台列表更准确。                                                                                                                                  |
  | #310         | 修复两个长期存在的问题：通过关键词搜索后打开的仓库编辑弹窗不再自动关闭（后台同步不再覆盖当前搜索结果）；滚动条出现/隐藏时页面不再抖动（始终保留滚动条槽位）。                                                                                                                                                                                                              |
  | #312         | 修复搜索栏滚动到顶部时盖住顶栏的问题；修复弹窗/侧边栏打开时背后的页面仍可滚动（问答边栏出现双滚动条）的问题，弹层打开期间背景滚动被正确锁定。                                                                                                                                                                                                                              |
  | #308         | 新增可选的一体化 Docker 镜像（ghcr.io/amintacccp/github-stars-manager），单容器同时提供网页界面与后端 API，附带 docker-compose.fullstack.yml 示例及部署/迁移文档；原有部署方式完全不受影响。                                                                                                                                                                               |
  | #307         | 稳定 Docker 多架构发布：前端静态构建改为在原生平台构建一次（不再走缓慢的 QEMU 模拟），自动取消被取代的发布任务，前后端镜像使用独立构建缓存并增加超时保护，amd64 + arm64 双架构发布更可靠。                                                                                                                                                                                 |
