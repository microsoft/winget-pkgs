ReleaseNotes: |-
  Thoughts on "Discovery" & Breaking Out of Algorithmic Bubbles / 关于「发现」与「打破算法茧房」的一点碎碎念
  In previous releases, while the app offered several trending and recommendation feeds, most of them inevitably converged on superstar repositories with tens of thousands of stars. Don't get me wrong — those headline projects are magnificent feats of engineering, but in day-to-day work, many of us will honestly never touch them.
  In an era dominated by algorithmic recommendations, we are constantly boxed into homogeneous bubbles. My persistent goal has been to break through this enclosure and unearth modest, lesser-known, but deeply practical and grounded tools.
  在此前的版本中，应用虽然内置了一些仓库推荐与趋势信源，但坦率地说，大部分推到眼前的都是自带大流量的明星项目。不可否认它们确实非常硬核、非常震撼，但很多时候我们可能一辈子都用不到。
  在这个被推荐算法深度裹挟的时代，信息越看越趋同，我一直希望能帮大家（也帮我自己）打破这种信息茧房，去发掘那些低调、没多少关注度，却极其接地气、能切实解决日常小摩擦的宝藏项目。
  - Ruan Yifeng Weekly Submissions Feed / 阮一峰周刊精选（开源投稿）：
    Strictly speaking, this channel does not track only the published issues of Ruan Yifeng's Weekly — rather, it taps into the raw stream of open-source candidate submissions. This is one of my personal favorite corners to browse; I constantly stumble upon delightful utilities here. Most have virtually zero marketing and no influencer endorsements, yet they solve real frictions in everyday workflows with surgical elegance. Because every issue has limited slots and every curator evaluates "utility" differently, many hidden gems never make the final cut. Through this feed, I hope to give these overlooked but brilliant projects the spotlight they deserve.
    严格来说，这并不是阮老师每周刊发正文里的项目，而是来自周刊的「读者投递与开源候选库」。这个投稿列表是我平时最爱逛的地方之一，经常能淘到意想不到的小工具。它们大多没有大厂光环，也没有 KOL 站台背书，但往往恰好能抹平日常生活或开发中某一处让人抓狂的摩擦。受限于篇幅与各人对实用性理解的不同，周刊每期能够正式登出的一定只是冰山一角，海量闪光的小项目就此埋没实在可惜。希望这个渠道能让大家发掘更多不被聚光灯照耀的优秀开源项目。
  - X (Twitter) & Telegram Discovery Channels / X（推特）与 Telegram 发现频道：
    These two platforms are also staples in my own daily repository-hunting routine. Both channels are now seamlessly integrated into Discovery. Each comes with a single pre-configured default feed purely to demonstrate functionality (no commercial ties whatsoever — feel free to remove or replace them anytime).
    这两个平台同样是我日常挖掘前沿仓库最常用的阵地。我们在「发现」中接入了推文与频道的实时订阅。为了方便大家开箱体验，两边各自预置了一个示例信源（作者与这些信源没有任何利益关联，仅作为演示；不喜欢随时可以一键删除或换成你自己的关注源）。
  - Lightning-Fast Global Code & Docs Search / GitHub 全网极速代码与文档搜索：
    Often we don't know the exact repo we need; we just need to see how a specific function is written, troubleshoot an obscure error, or grep through real-world usage patterns. The new Code Search view lets you query code and documentation across GitHub repositories in milliseconds with zero local indexing required, complete with path, extension, and language filters.
    很多时候我们可能并不知道具体哪个仓库好用，只是想搜一段报错、找一个函数实现，或者查某个小众库的用法。这次新增的代码搜索通道，可以在不提前本地拉取/索引仓库的前提下，以极快的速度穿透 GitHub 全网海量开源代码与文档，并内置了语言、路径等常用过滤器，补足了轻量检索与灵感搜寻的拼图。

