ReleaseNotes: |-
  GitHub Stars Manager v0.8.9
  ⚡ Urgent Fix / 紧急修复说明
  - EN: This is an early hotfix release for a critical Windows issue: after the window was fully covered by another window, restored from the system tray, or the monitor layout changed, the window could stop repainting and appear completely frozen ("dead") even though the app was still running. We are shipping this version ahead of schedule so everyone can get back to normal use as soon as possible.
  - ZH: 本版本为紧急修复版本：修复 Windows 上窗口被完全遮挡、从系统托盘恢复或显示器布局变化后画面停止重绘、看起来像客户端“死掉”的问题（进程实际仍在运行）。为了不影响大家正常使用，我们提前发布了这一版。

  🚀 Key Improvements / 主要更新
  1. Critical Windows Fix / Windows 窗口假死紧急修复 (#534)
  - EN: Fixed the Windows "frozen window" issue where the window stopped receiving new frames after being fully occluded, restored from the tray, or when the monitor configuration changed. The fix adds forced repaint, compositor (BeginFrame) liveness detection, and a main-process reload fallback when the focused window keeps receiving no frames (#534, fixes #533).
  - ZH: 修复 Windows 窗口假死问题：窗口被完全遮挡、从托盘恢复或显示器拓扑变化后画面停止刷新。新增强制重绘、合成器（BeginFrame）存活检测，以及聚焦窗口持续无帧时由主进程自动重载的兜底机制 (#534，修复 #533)。
  2. New Features / 新功能 (#535, #536)
  - EN:
    - Discovery semantic repository search now recalls candidates via GitHub Search instead of grep.app, greatly enlarging the candidate pool and improving final ranking quality — measured recall@10 improved from 0.083 to 0.348 (#535).
    - The Releases page adds a built-in "Current System" asset filter: it keeps only releases with installable assets for your device, sorts assets by download likelihood, and marks the best match as "Recommended" (#536).
  - ZH:
    - 发现页语义仓库搜索改用 GitHub Search 召回候选，候选池规模与质量大幅提升，AI 精排效果显著改善——实测召回率 recall@10 由 0.083 提升至 0.348 (#535)。
    - Release 页新增内置「当前系统」资产过滤器：一键只保留当前设备可安装资产的 Release，资产按最可能下载的顺序排序并标注「推荐」(#536)。
  3. Fixes & Improvements / 问题修复与体验优化 (#529, #530, #531)
  - EN:
    - AI compatibility: connection tests now allow up to 30 seconds, gateway errors returned inside HTTP 200 responses are recognized correctly, and throttled requests are retried — slow or rate-limited OpenAI-compatible gateways now work reliably (#529).
    - Quieter diagnostic logs: plugin snapshots now accept releases with more than 500 assets (truncated per protocol), GitHub 403 rate-limit warnings no longer spam the log, duplicate vector IDs are handled, and oversized persistence-shard write warnings are throttled (#530).
    - UI polish: unified hover feedback across buttons and controls, with a stronger sidebar visual hierarchy (#531).
  - ZH:
    - AI 兼容性：连接测试超时延长至 30 秒，正确识别 HTTP 200 响应中的网关错误，并对限流请求自动重试——慢速或有限流的 OpenAI 兼容网关现在可以稳定使用 (#529)。
    - 诊断日志降噪：插件快照接受超过 500 个资产的 Release（按协议截断），GitHub 403 限流告警不再刷屏，修复向量重复 ID 问题，并对超大持久化分片的写入告警做节流 (#530)。
    - 界面优化：统一按钮与控件的悬停反馈，强化侧边栏视觉层级 (#531)。
  4. Security / 安全修复 (#528, #532)
  - EN: Upgraded @hono/node-server to fix a serveStatic path double-decoding middleware bypass (Dependabot #98), and decode-uri-component to fix a high-severity denial-of-service vulnerability (Dependabot #99).
  - ZH: 升级 @hono/node-server 修复 serveStatic 路径二次解码导致的中间件绕过漏洞（Dependabot #98）；升级 decode-uri-component 修复高危拒绝服务漏洞（Dependabot #99）。

