ShortDescription: AI-powered GitHub stars manager with semantic search, auto-categorization, and release tracking.
Description: GitHub Stars Manager automatically syncs your starred repositories, uses AI to summarize and categorize them, and lets you find anything with semantic search. Track releases, filter assets, and download with one click. It also supports vector semantic search, fork management, gist management, network proxy, and remote aria2 downloads.
