ReleaseNotes: |-
  What's New in v0.8.3 / 新版本特性
  🌟 Highlights & Special Notes / 特别说明
  English:
  🧩 Plugin Ecosystem Matures: Plugin settings can now compare your installed plugins against the community plugin registry, showing available updates, permission changes, and revoked or blocked plugins (PR #389). A documented proposal for the community registry itself — with SHA-256 integrity checks and a maintainer review workflow — is also included (PR #394).
  🎨 More Personalization: Repository card fields (description, tags, language, stars, license, last pushed) are now individually configurable (PR #390), and the Appearance settings gain accent color, corner radius, font scale, and reduced-motion controls (PR #392).
  📈 Trending Ranking History: The Discovery page now records a daily local snapshot of Trending lists and shows ranking changes, new entries, consecutive-day streaks, and star growth over time (PR #391).
  📦 Smarter Downloads: Release asset lists detect your current platform and architecture and highlight the installer that fits your device (PR #386).
  💖 Special Thanks: Huge thanks to community contributor @Khk-NL, who contributed seven PRs to this release — smarter release asset recommendations (#386), batch import URL extraction (#387), plugin registry comparison (#389), configurable card fields (#390), trending ranking history (#391), theme token customization (#392), and the community registry proposal (#394)!
  中文：
  🧩 插件生态更完善：插件设置现在可与社区插件注册表比对，展示可更新版本、权限变化以及已撤销/被阻止的插件状态（PR #389）。同时收录了社区插件注册表方案的完整设计文档，包含 SHA-256 完整性校验与维护者审核流程（PR #394）。
  🎨 更多个性化：仓库卡片的字段（描述、标签、语言、Stars、许可证、最近更新时间）现在可以逐项配置显示与隐藏（PR #390）；外观设置新增强调色、圆角、字号缩放与减少动效选项（PR #392）。
  📈 趋势榜单历史：发现页每天记录一份趋势榜单的本地快照，可查看排名变化、新上榜、连续上榜天数与 Star 增长历史（PR #391）。
  📦 下载更省心：Release 附件列表会识别当前系统平台与架构，自动推荐适合你设备的安装包（PR #386）。
  💖 特别鸣谢：特别感谢社区贡献者 @Khk-NL，本次版本一人贡献了 7 个 PR——智能安装包推荐（#386）、批量导入链接提取（#387）、插件注册表比对（#389）、卡片字段自定义（#390）、趋势榜单历史（#391）、主题自定义（#392）与社区注册表提案（#394）！

  What's Changed / 更新内容

  | PR   | English Summary                                                                                                                                                                                                                                                                                                                                                                             | 中文说明                                                                                                                                                                                                                                        |
  | ---- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | #386 | feat: Recommend installable release assets for the current device<br>Release asset lists detect the current platform and architecture and highlight the recommended installer (MSI/EXE, DMG/PKG, DEB/RPM/AppImage), while the full asset list stays selectable. Source archives, checksums, and debug files are excluded, and nothing is downloaded automatically. (Contributed by @Khk-NL) | Release 附件智能推荐当前设备适配的安装包<br>Release 附件列表会识别当前系统与架构，自动高亮匹配的安装包格式（MSI/EXE、DMG/PKG、DEB/RPM/AppImage），完整列表仍可手动选择。源码包、校验文件等会被排除，不会自动下载任何内容。(感谢 @Khk-NL 的贡献) |
  | #387 | feat: Extract repository URLs for batch import<br>Adds the extraction and normalization layer for batch repository import: pulls repositories out of GitHub URLs, Markdown, plain owner/repo text, and JSON, deduplicates them case-insensitively, and keeps invalid entries visible with a reason. (Contributed by @Khk-NL)                                                                | 批量导入的仓库链接提取能力<br>为批量导入打好基础：可从 GitHub 链接、Markdown、owner/repo 文本和 JSON 中提取仓库并规范化，自动去重，无效条目会连同原因一起保留。(感谢 @Khk-NL 的贡献)                                                            |
  | #389 | feat: Compare installed plugins with the community registry<br>Plugin settings load the community plugin registry and show available updates, new permission and data-use summaries, and revoked/blocked status. Nothing is downloaded, installed, or disabled automatically. (Contributed by @Khk-NL)                                                                                      | 插件设置支持与社区注册表比对<br>插件设置会加载社区插件注册表，展示可更新版本、新增权限与数据用途说明、已撤销/被阻止状态。全程不会自动下载、安装或停用任何插件。(感谢 @Khk-NL 的贡献)                                                            |
  | #390 | feat: Make repository card fields configurable<br>New appearance settings let you show or hide description, tags, language, stars, license, and last-pushed time on repository cards, consistently in grid and list views. Choices persist, and malformed values fall back to the visible-by-default behavior. (Contributed by @Khk-NL)                                                     | 仓库卡片字段可自定义<br>新增外观设置，可在网格与列表视图下分别控制卡片上描述、标签、语言、Stars、许可证、最近更新时间的显示与隐藏，设置会持久保存，异常配置自动恢复默认。(感谢 @Khk-NL 的贡献)                                                  |
  | #391 | feat: Record trending snapshots and show ranking history<br>Discovery records a bounded local Trending snapshot once per day (per period and language) and derives rank changes, new entries, consecutive-day streaks, and star growth, shown in a compact history panel when there is enough data. (Contributed by @Khk-NL)                                                                | 趋势榜单快照与排名历史<br>发现页每天（按榜单周期与语言）记录一份趋势榜单本地快照，据此展示排名升降、新上榜、连续上榜天数与 Star 增长，数据足够时以简洁的历史面板呈现。(感谢 @Khk-NL 的贡献)                                                     |
  | #392 | feat: Add theme token customization<br>Appearance settings gain controls for the primary accent color, corner radius, font scale, and reduced motion, applied through validated CSS variables with contrast-aware foreground selection and one-click restore to defaults. (Contributed by @Khk-NL)                                                                                          | 主题细节自定义<br>外观设置新增主题强调色、圆角、字号缩放与减少动效选项，自动选择可读的前景色，并可一键恢复默认外观。(感谢 @Khk-NL 的贡献)                                                                                                       |
  | #394 | docs: Propose a community plugin registry<br>Documents a static, reviewable community plugin registry backed by pinned GitHub release assets with SHA-256 checks, covering the contributor, automated scanning, and maintainer review workflows. (Contributed by @Khk-NL)                                                                                                                   | 社区插件注册表方案文档<br>新增社区插件分发与注册表设计文档，介绍基于固定版本 Release 附件与 SHA-256 校验的安装方案，以及贡献者提交、自动扫描与维护者审核流程。(感谢 @Khk-NL 的贡献)                                                             |
  | #398 | fix: Retain headingless repository evidence<br>The Repository Q&A Assistant keeps citable evidence from downloaded files without headings and preserves partial streamed answers when streaming fails, instead of discarding them.                                                                                                                                                          | 修复仓库问答丢失无标题文档证据<br>仓库问答助手对没有章节标题的文档仍可查找并引用证据；流式回答中断时保留已生成的部分内容，不再整体丢弃。                                                                                                        |
  | #399 | fix(discovery): Show "No description" instead of the README fallback<br>Trending cards no longer render the entire README as the repository description when a repo has no description; a localized "No description available" placeholder is shown instead.                                                                                                                                | 发现页无描述仓库显示「暂无描述」<br>修复趋势频道没有简介的仓库把整篇 README 当作描述展示的问题，现在统一显示本地化的「暂无描述」占位文案。                                                                                                      |
  | #400 | fix(lists): Pre-flight GitHub Lists limits before pushing categories<br>Pushing categories to GitHub Lists now validates GitHub's undocumented limits (at most 32 lists, names up to 32 characters) locally before writing anything, aborting cleanly with per-item guidance instead of leaving a half-finished push.                                                                       | 推送分类前预校验 GitHub Lists 上限<br>分类回写到 GitHub Lists 前，会先在本地校验 GitHub 的隐藏限制（最多 32 个 List、名称最长 32 字符），超限时整体中止、零写入，并给出逐项处理指引。                                                           |
  | #401 | feat(settings): Add auto-translate repository descriptions toggle<br>A new Settings > AI > Translation Engine toggle (off by default) automatically translates repository descriptions that differ from the interface language, with session caching, concurrency limits, and a graceful fallback to the original text.                                                                     | 新增仓库描述自动翻译开关<br>设置 > AI 配置 > 翻译引擎新增「自动翻译仓库描述」开关（默认关闭），开启后与界面语言不一致的仓库描述会自动翻译显示，带会话级缓存与并发控制，失败时回退原文。                                                         |

