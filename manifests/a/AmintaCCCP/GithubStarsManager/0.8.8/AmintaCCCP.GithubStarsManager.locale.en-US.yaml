ReleaseNotes: |-
  GitHub Stars Manager v0.8.8
  💡 Release Highlights / 版本亮点
  💡 Tips & Experience / 体验建议与说明：
  中文：本次更新重点对 AI 向量搜索 与 相似仓库推荐 的召回排序质量进行了大幅重构与升级。特别推荐使用 硅基流动（SiliconFlow）免费提供的 BAAI/bge-m3 嵌入模型——开启重排（Rerank）后，软件会自动协同调用对应的 BAAI/bge-reranker-v2-m3 Cross-Encoder 重排模型进行精细重排，搜索命中率与相关性提升极为显著！另外，我们对桌面端界面进行了全方位改版重构，专属侧边栏搭配更通透的内容视窗，让工作区更大、更专注。
  English: This release brings a major upgrade to the recall and ranking quality of both AI Vector Search and Similar Repository Recommendations. We highly recommend configuring the free BAAI/bge-m3 embedding model on SiliconFlow — when reranking is enabled, the app automatically coordinates with the matching BAAI/bge-reranker-v2-m3 Cross-Encoder model for fine-grained ranking, yielding substantially better search accuracy! Furthermore, the desktop interface shell has been redesigned with dedicated context sidebars and expanded viewing areas, giving you a significantly larger and more immersive workspace.

  📸 Previews / 界面截图

  | 向量搜索模型配置 (Vector Search Settings) | 桌面端全新工作区与语义搜索 (Workspace & Semantic Search) |
  | ----------------------------------------- | -------------------------------------------------------- |
  |                                           |                                                          |

  🚀 Key Improvements / 主要特性与更新
  1. Vector Search & Similar Repository Ranking Upgrade / 向量搜索与相似仓库推荐大升级 (#505, #507)
  - EN:
    - Vector Ranking without Reindexing: Query pipeline now features query-intent analysis, dual dense recall (raw + ideal descriptions), local lexical & structured recall, Grouped Reciprocal Rank Fusion (RRF), optional SiliconFlow Cross-Encoder (BAAI/bge-reranker-v2-m3), and graded LLM reranking (#505).
    - Source-Profile Similarity Recommendations: Substantially enhances similar-repository recall quality by combining source profile extraction with dense peer matching and lexical filtering (#507).
  - ZH:
    - 免重建索引的向量搜索重排优化：全新查询理解流水线引入意图分析、Raw + Ideal 密集向量双路召回、本地词法与结构化多路召回、Grouped RRF 融合，并原生支持硅基流动 Cross-Encoder（BAAI/bge-reranker-v2-m3）及 LLM 智能重排，原有向量索引完全向下兼容无须重建 (#505)。
    - 源画像相似仓库推荐：基于源仓库特征画像与同类密集检索构建推荐流水线，显著提升相似仓库的准确度与契合度 (#507)。
  2. Refined Desktop Workspace Shell / 桌面端全新工作区布局 (#524)
  - EN:
    - Rebuilt desktop workspace shell with route-owned context sidebars for Repositories, Releases, Forks, Gists, Discovery, and Settings.
    - Expands usable workspace width, standardizes content grid, and unifies toolbars, filters, spacing, dialogs, and themes.
  - ZH:
    - 重构桌面端工作区布局，为仓库、发布、Fork、Gist、发现、设置提供专属上下文侧边栏。
    - 极大拓展内容可视区域，统一全局网格规范、筛选栏、弹窗与暗黑/明亮主题视觉质感 (#524)。
  3. AI Semantic Search in Discovery / 发现页仓库搜索新增 AI 语义搜索 (#494)
  - EN: Discovery repository search now supports "AI Semantic Search" mode with multilingual query expansion, documentation/markdown recall, and LLM curated results (#494).
  - ZH: 发现页「仓库搜索」新增「AI 语义搜索」模式，支持多语言关键词意图扩展、文档域优先召回与 LLM 智能筛选精选 (#494)。
  4. Stability, Security & Bug Fixes / 稳定性、安全性与问题修复 (#481, #495, #498, #504, #526, #527)
  - EN:
    - Windows Tray Restore Freeze Fixed: Deferred window hiding on minimize-to-tray to avoid frozen windows upon tray restore on Windows (#527, fixes #522).
    - Network Timeout & Retry: Added 30s timeout and exponential backoff retry to GitHub API requests, preventing the sync button from hanging after laptop sleep or network loss; added "Relaunch App" in tray menu (#526, fixes #523).
    - Fullstack Docker CSP Fix: Resolved blank screen on full-stack Docker SPA deployments under strict CSP and plain-HTTP (#481, fixes #480).
    - Security & Vulnerabilities: Addressed CodeQL code scanning alerts, patched undici (CVE-2026-109869), hono, and follow-redirects (#495, #498, #504).
  - ZH:
    - 修复 Windows 托盘恢复卡死：优化托盘最小化调度机制，彻底解决 Windows 上从系统托盘恢复窗口卡死的问题 (#527，修复 #522)。
    - 网络超时与断网重试：为 GitHub API 请求增加 30 秒超时及指数退避重试，杜绝休眠或断网后刷新按钮一直被禁用的问题；托盘菜单新增「重启应用」快捷项 (#526，修复 #523)。
    - 全栈 Docker 容器白屏修复：修复全栈 Docker 容器在 Helmet CSP 和纯 HTTP 局域网访问下由于脚本哈希与协议重写导致白屏的问题 (#481，修复 #480)。
    - 安全漏洞处置：修复 CodeQL 代码安全扫描存量告警，升级 undici（修复 CVE-2026-109869）、hono 与 follow-redirects (#495, #498, #504)。
  5. Dependency Updates / 依赖升级
  - Upgraded Electron 45, Zustand 5, Better-SQLite3 13, Parse5 8, Date-fns 4, Mermaid 12, ESLint 10, Vitest 5.0.5, Wrangler 4.152.0, and more (#482-#493, #499-#503, #509-#520, #525).

