ReleaseNotes: |-
  What's New in v0.8.4 / 新版本特性
  🌟 Highlights & Special Notes / 特别说明
  English:
  ⭐ Star from Links: Paste any text or Markdown that mentions GitHub repositories into the new "Star from links" dialog, preview each repository's description, language, stars, and starred status, then star the ones you pick — up to 50 at a time, with per-repository results (PR #408).
  🎛️ Discovery Channel Management: Hide discovery channels you don't use (such as X or Telegram) straight from the sidebar, on both desktop and mobile. At least one channel always stays enabled (PR #403).
  🔍 Smarter Release Asset Filters: Custom filters now support keyword blacklists, per-filter "always include" and "always exclude" repository lists, and optional include keywords. The filter editor is reorganized into Assets and Repositories tabs, and multi-filter results are predictable: within one filter, exclusion wins; across filters, any match shows the release (PR #405, #409, #411).
  🪟 Update Dialog Polish: The "New Version Available" dialog is wider, keeps the title and buttons in place while the changelog scrolls, and auto-hides its scrollbar (PR #406).
  🛠️ Fullstack Deployment Fix: In the fullstack image, every GitHub API call now honors the network routing setting, and the server's CSP allows browser-direct GitHub/AI origins — fixing login and sync failures ("Failed to fetch") and missing avatars (PR #410).
  中文：
  ⭐ 从链接 Star 仓库：新增「从链接 Star」功能，把提到 GitHub 仓库的文本或 Markdown 直接粘贴进来，预览每个仓库的描述、语言、Stars 和已 Star 状态，勾选后一键 Star——单次最多 50 个，每个仓库单独反馈结果（PR #408）。
  🎛️ 发现频道管理：可以在侧栏直接隐藏用不到的发现频道（如 X、Telegram），桌面端和移动端都支持，且始终保留至少一个频道（PR #403）。
  🔍 Release 资产过滤器更强大：自定义过滤器现在支持关键词黑名单、按过滤器设置「始终包含」和「始终排除」的仓库列表，包含关键词也可以留空。过滤编辑弹窗重排为「资产 / 仓库」两个标签页，多过滤器规则更可预期：同一过滤器内排除优先，多个过滤器之间任一命中即显示（PR #405、#409、#411）。
  🪟 更新弹窗体验优化：「新版本可用」弹窗加宽，标题和按钮固定不动、只有更新日志区域滚动，滚动条会自动隐藏（PR #406）。
  🛠️ 全栈镜像部署修复：全栈镜像中所有 GitHub API 请求都会遵守网络请求路由设置，服务端 CSP 放行浏览器直连的 GitHub/AI 来源——修复登录、同步报「Failed to fetch」以及头像不显示的问题（PR #410）。

  What's Changed / 更新内容

  | PR   | English Summary                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           | 中文说明                                                                                                                                                                                                                                                                                                                        |
  | ---- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | #403 | feat: Let users choose visible discovery channels<br>A menu next to Refresh lets you hide discovery channels you don't use, on desktop and mobile. Hiding the active channel switches to another visible one, and the last visible channel always stays enabled. (Contributed by @Khk-NL)                                                                                                                                                                                                                 | 用户可自行选择显示哪些发现频道<br>在「刷新」按钮旁的菜单里即可隐藏不用的发现频道，桌面侧栏与移动端均可管理。隐藏当前选中的频道会自动切换到其他可见频道，且始终保留至少一个启用频道。(感谢 @Khk-NL 的贡献)                                                                                                                       |
  | #405 | feat(releases): Filter keyword blacklist and per-filter repo exclusion<br>Custom asset filters gained an excludeKeywords blacklist (a hit rules out the asset even if it matches the include list) and a per-filter repository list; preset filters now respect saved edits.                                                                                                                                                                                                                              | Release 过滤器支持关键词黑名单与按过滤器排除仓库<br>自定义过滤器新增关键词黑名单（命中即排除，即使同时命中包含词）和按过滤器的仓库列表；预设过滤器的手动编辑也会被持久保留，不再被常量覆盖。                                                                                                                                    |
  | #406 | feat(update): Widen new-version dialog, freeze chrome, auto-hide scrollbar<br>The "New Version Available" dialog is wider so changelog lines wrap less; the header and footer buttons stay fixed while only the changelog scrolls with a thin auto-hiding scrollbar. The header update banner now shows just the version and release date.                                                                                                                                                                | 更新弹窗加宽、固定边框、滚动条自动隐藏<br>「新版本可用」弹窗加宽，更新日志换行更少；标题与底部按钮固定，仅日志区域滚动并配以自动隐藏的细滚动条。顶栏更新横幅简化为只显示版本号与发布日期。                                                                                                                                      |
  | #408 | feat: Preview pasted GitHub links and star selected repositories<br>New "Star from links" entry in the repository toolbar: paste prose or Markdown, preview each repository's description, language, stars, and starred status, adjust the selection, then star the chosen repositories. Up to 50 per batch, non-GitHub links and duplicates are ignored, and results are reported per repository so partial failures don't hide successes. (Contributed by @Khk-NL)                                      | 粘贴链接预览并批量 Star 仓库<br>仓库工具栏新增「从链接 Star」：粘贴提到仓库的文章或 Markdown，先预览各仓库的描述、语言、Stars 与已 Star 状态，调整勾选后再一键 Star。单次最多 50 个，自动忽略非 GitHub 链接与重复仓库，逐仓反馈结果，部分失败不影响已成功项。(感谢 @Khk-NL 的贡献)                                              |
  | #409 | fix(releases): Per-filter repo list is always-include, not exclude<br>Corrects #405: the per-filter repository list now means "always include" — repos on the list appear in that filter's results without matching any keyword. Filters decide release visibility only, and matched releases show all their download assets. Stale excludeRepos data from #405 is cleaned up automatically.                                                                                                              | 按过滤器的仓库列表改为「始终包含」<br>修正 #405 的语义：过滤器内的仓库列表现在是「始终包含」——启用该过滤器时，列表中的仓库无需命中关键词也会出现在结果里。过滤器只决定 Release 是否显示，命中的 Release 展示全部下载资产；#405 短暂引入的旧数据会被自动清理。                                                                   |
  | #410 | fix: Route GitHub API clients through the route-mode factory and open CSP for browser-direct origins<br>Fixes fullstack deployments: all 26 direct GitHub API client constructions were replaced with the route-mode factory so requests honor the Network Request Routing setting, and the server CSP now allows browser-direct GitHub/AI origins and owner avatars. This fixes login, sync, and auto-restore surfacing as "Failed to fetch", plus blocked avatars. An ESLint rule prevents regressions. | GitHub API 统一走路由工厂，CSP 放行浏览器直连来源<br>修复全栈镜像部署问题：26 处直接构造 GitHub API 客户端的代码全部改为路由模式工厂，请求遵守「网络请求路由」设置；服务端 CSP 放行浏览器直连的 GitHub/AI 来源与仓库头像。由此修复登录、同步、自动恢复时报「Failed to fetch」以及头像不显示的问题，并新增 ESLint 规则防止回归。 |
  | #411 | feat(releases): Add per-filter repository exclusions<br>Builds on #409 with per-filter always-exclude repositories, reorganizes the filter editor into Assets / Repositories tabs, makes include keywords optional, and makes multi-filter matching predictable: within one filter, exclusion wins; across filters, OR with local exclusions.                                                                                                                                                             | 按过滤器排除仓库，过滤编辑器分组重构<br>在 #409 基础上新增按过滤器的「始终排除仓库」，过滤编辑弹窗重排为「资产 / 仓库」两个标签页，包含关键词可留空；多过滤器匹配规则更可预期：同一过滤器内排除优先，多个过滤器之间任一命中即显示。                                                                                             |

