ReleaseNotes: |-
  Highlights
  Version 0.7.6 brings official GitHub-style README rendering, a unified design system built on shadcn/ui and Radix Primitives, and a batch of reliability fixes for release tracking and GitHub synchronization.
  README rendering
  - GitHub-style README rendering (PR #287): Repository cards (Repos and Trending) and release notes now render with the official github-markdown-css dual-theme styling. Support has been added for GitHub Alerts (> [!NOTE] and friends), gemoji short codes (:tada: becomes 🎉), math formulas via KaTeX, and Mermaid diagrams. KaTeX and Mermaid are lazily loaded so they do not affect startup or bundle budget. The table of contents, side-by-side translation overlay, and copy-code buttons all remain fully compatible.
  Unified user interface
  - Migration to shadcn/ui and Radix Primitives (PR #284): The presentation layer has been refactored onto the shadcn/ui component style backed by Radix Primitives. Previously the CSS and components were hand-rolled; this migration unifies the visual language across the app and lays the foundation for consistent, faster iteration going forward. The global theme now uses standard semantic variables (background, foreground, card, popover, primary, secondary, muted, accent, destructive, border, input, ring, radius), shared controls such as Button, Badge, Input, Card, Select, Checkbox, Switch, Tabs, Dialog, and AlertDialog follow the canonical shadcn defaults, and dark-theme foreground colors on primary actions have been fixed. Business logic and data flow are unchanged, and an unused react-router-dom dependency was removed (production npm audit now reports zero vulnerabilities).
  Release tracking fixes
  - Correct release update times and asset markers (PR #280): The repository header now reflects the effective latest activity across releases and their assets, newly added or changed assets are tracked accurately during refresh, and the asset-level Assets updated marker appears consistently in both release views.
  - Asset indicators decoupled from read state (PR #283): Per-asset Assets updated badges no longer disappear as soon as the parent release is marked read. Each asset can be dismissed independently via a new per-asset read action, and "mark all as read" also clears every asset badge.
  - Aligned repository view timestamps (PR #275): The latest-release timestamp in the repository header is right-aligned with the release count and latest tag rows for visual consistency.
  - Simplified filter panel (PR #281): Removed the duplicate preset-filter Reset button and the redundant selected-filter summary row, keeping a single top-level "Clear all filters" action.
  GitHub synchronization fixes
  - Existing tokens synced to the backend (PR #277): After local state hydration, an existing frontend GitHub token is now synced idempotently to the Docker backend, fixing GITHUB_TOKEN_NOT_CONFIGURED errors for existing sessions without requiring re-login.
  - Direct-connection fallback for GitHub Lists (PR #278): When the backend proxy cannot reach api.github.com (for example inside a container without proxy settings), Lists GraphQL queries automatically fall back to a direct browser connection for the rest of the run. Transient 5xx responses are retried, backend error details are surfaced, and proxy usage is preserved whenever it works.
  - Watched-repository sync resilience (PR #286): Watched-repository synchronization no longer fails when GitHub returns an empty 204 No Content response, redundant duplicate requests were removed, and license metadata is normalized to SPDX identifiers.
  Desktop downloads
  This release includes installers for Windows, macOS (Intel and Apple Silicon), and Linux. Use the Assets section below to download the package for your platform.
  Upgrade notes
  No data migration is required. The interface refresh in PR #284 changes only the presentation layer; all settings, categories, and synchronized data remain intact.
