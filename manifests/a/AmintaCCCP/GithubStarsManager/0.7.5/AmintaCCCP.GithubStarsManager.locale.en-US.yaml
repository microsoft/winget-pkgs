ReleaseNotes: |-
  Highlights
  Version 0.7.5 improves release tracking, vector-search reliability, version management, and synchronization with GitHub Lists.
  Release and version management
  - Centralized application versioning (PR #270): The root package.json is now the single source of truth for the application version. The package lockfile is synchronized automatically, the duplicate Electron version field has been removed, and the release helper now rejects duplicate or downgraded versions while validating metadata and download URLs more safely.
  Vector-search reliability
  - Safer Vectorize metadata handling (PR #271): Vector metadata is compacted at the Cloudflare Worker /upsert boundary using UTF-8 JSON byte limits while preserving structured fields. Oversized descriptions and tags, malformed license metadata, and excessive similarity-search limits are handled more safely.
    If you use the Cloudflare Worker deployment, redeploy the Worker before using this fix.
  Release update tracking
  - Improved release refresh behavior (PR #272): When release assets or metadata change, the release is correctly marked as unread again. Displayed timestamps now reflect the latest asset update, and affected releases show an Assets updated indicator while preserving the read state of unaffected releases.
  - Clearer asset-update indicators (PR #274): The Assets updated indicator now disappears when the release is marked as read. The behavior is consistent in both release cards and repository group headers, with additional coverage for timestamp and read-state edge cases.
  GitHub Lists synchronization
  - Experimental two-way GitHub Lists synchronization (PR #273, addressing issue #229): You can optionally pull GitHub native Lists into the app and push local categories back to GitHub Lists. The feature supports configurable sync modes, protected categories, list-to-tag/category mapping, and confirmation dialogs for operations that may overwrite unlocked classifications.
    This is an experimental feature. Please back up your data before trying it. Existing users, and users who do not use GitHub native Lists, are advised to continue using the legacy synchronization mode. GitHub Lists synchronization is optional and can be selected in the sync settings.
  Desktop downloads
  This release includes installers for Windows, macOS, and Linux. Use the Assets section below to download the package for your platform.
  Upgrade notes
  After upgrading, users of the Cloudflare Worker deployment must redeploy the Worker for the Vectorize metadata fix in PR #271 to take effect. Users evaluating GitHub Lists synchronization should back up their data first and may continue using the legacy synchronization mode if they do not need native Lists support.
