ReleaseNotes: |-
  What's New in v0.7.7
  IMPORTANT NOTICE - PLEASE READ BEFORE UPGRADING
  This version refines the UI across the board, converts every hardcoded style into design tokens, introduces a multi-theme switcher, and ships a major architecture refactor of the frontend.
  Please make sure you back up your data before upgrading.
  Highlights
  - Multi-theme one-click switching: 12 built-in theme presets (Default, Twitter Blue, Supabase Green, Claude Warm Orange, Vercel Minimal, T3 Chat, Catppuccin, Neo Brutalism, Cyberpunk, Soft Pop, Mocha Mousse, Northern Lights), each with matched light + dark palettes, selectable in Settings > General > Appearance and applied instantly. (PR #289)
  - Full style tokenization: all hardcoded colors, radii, shadows, and fonts were migrated to semantic design tokens, including a second audit round that routed remaining hardcoded neutrals (black/white/gray) and success/warning/overlay colors through tokens so every preset restyles correctly. Existing users keep exactly the same default look as before the upgrade. (PR #289, #290)
  - Major architecture refactor: layered frontend architecture with enforced boundaries, pure repository state commands, domain hooks for cards/lists/settings/lifecycle, a modular store behind one persistence shell, and typed shallow selectors everywhere - with no changes to the persistence schema (key github-stars-manager, version 11). (PR #295-#301)
  Changes
  Features & Theming
  - Multi-theme engine with 12 presets generated from tweakcn sources, runtime [data-theme] injection, persisted selection with safe fallback, self-hosted font families for offline/Electron use, and a new Appearance settings card with live theme previews. (PR #289)
  Performance
  - Added a deterministic bundle:report command and lazy-loaded dormant views (Settings, Discovery/Subscription, Gists, Releases, Forks, README modal): modern entry shrank from 2,398 KiB to 323 KiB and the largest legacy chunk from 2,762 KiB to 996 KiB. (PR #293)
  Bug Fixes & Accessibility
  - Closing the README modal now restores keyboard focus to the repository card that opened it, instead of dropping focus to the page body. (PR #294)
  Quality Gates & Testing
  - CI now runs lint, typecheck, and tests as required checks on every pull request and push to main, with a project-reference-aware TypeScript typecheck script. (PR #291)
  - Persistence and repository behavior contracts frozen with historical-snapshot fixtures; the new contracts exposed and fixed real hydration gaps: backend API secret priority handling, explicit-clear semantics, analyzing-state reset on rehydration, and stale discovery cache cleanup. (PR #292)
  Architecture Refactor
  - Repository field transitions centralized as pure command functions (analysis success/failure, bulk restore/categorize, category lock/unlock, subscription markers) with parameterized unit tests. (PR #295)
  - RepositoryCard operations moved into a useRepositoryCardActions domain hook so the card stays purely presentational. (PR #296)
  - RepositoryList batch AI orchestration and non-AI bulk workflows moved into focused job hooks with preserved confirmation, progress, pause/resume, and failure semantics. (PR #297)
  - Settings-page service orchestration moved into per-area action hooks (AI config, vector search, WebDAV/backup, backend, MCP, network, star sync, diagnostics); controller components removed. (PR #298)
  - The app store was modularized into focused slices behind a single Zustand persistence shell while keeping public imports unchanged. (PR #299)
  - Untyped store subscriptions replaced with typed shallow-compared selectors (37 files / 38 occurrences down to zero), and application lifecycle (backend init, session restore, sync, MCP bridge) extracted into dedicated lifecycle hooks. (PR #300)
  - Frontend layering rules are now automatically enforced via ESLint import restrictions, and the architecture contract is published as ADR 0001. (PR #301)
  Full Changelog
  https://github.com/AmintaCCCP/GithubStarsManager/compare/v0.7.6...v0.7.7
