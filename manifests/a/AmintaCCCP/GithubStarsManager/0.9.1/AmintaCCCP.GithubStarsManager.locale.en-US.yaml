ReleaseNotes: |-
  GitHub Stars Manager v0.9.1
  🚀 Key Improvements & What's New / 主要更新与新特性
  1. 🔌 Repo Custom Fields Plugin & Plugin Enhancements / 仓库自定义字段插件与插件能力升级 (#575, #577)
  - ZH:
    - 仓库自定义字段插件：新增「Repo Custom Fields」插件，可以在仓库卡片上添加自己定义的可点击链接（比如文档、官网、演示地址）。插件平台同步升级到 V1.6，支持弹出式小窗口模式，小表单不再需要打开整个全屏页面 (#575)。
    - 自定义插件图标：插件设置新增内置图标选择器，提供 50 多个分类图标，支持搜索和一键恢复默认。选好的图标会显示在插件卡片、仓库卡片操作按钮和批量操作栏上 (#577)。
    - 卡片快捷操作排序：外观设置里可以自定义仓库卡片上插件快捷按钮的显示顺序，把最常用的功能放到最前面 (#577)。
  - EN:
    - Repo Custom Fields Plugin: Added the "Repo Custom Fields" plugin, which lets you attach your own clickable links (docs, homepage, demo, etc.) to repository cards. The plugin platform is upgraded to V1.6 with a new non-fullscreen popup mode, so small forms no longer need a full page (#575).
    - Custom Plugin Icons: Plugin settings now include a built-in icon picker with 50+ categorized icons, search, and one-click reset. Your chosen icon shows up on plugin cards, repository card actions, and bulk action toolbars (#577).
    - Card Quick Action Ordering: Appearance settings now let you reorder plugin quick actions on repository cards, so your most-used actions come first (#577).
  2. 🔄 Smarter Update Reminders / 更贴心的更新提醒 (#579)
  - ZH:
    - 自动检查更新开关：「设置 → 通用 → 检查更新」新增"自动检查更新"开关（默认开启）。关闭后启动时不再自动检查更新，手动检查不受影响。
    - 按版本"不再提示"：更新弹窗新增"不再提示"按钮。点击后当前版本不再自动弹出提醒，等发布了更新的版本后会自动恢复提醒；顶部的更新横幅也会同时收起。
  - EN:
    - Auto-Check Toggle: Added an "Automatically check for updates" switch in Settings → General (on by default). When it is off, the app stops checking on startup, but manual checks still work.
    - Per-Version "Don't Remind Me Again": The update dialog now has a "Don't remind me again" button. It silences reminders for the current version and automatically resumes when a newer version comes out; the top update banner is dismissed at the same time.
  3. 🖥️ Desktop & UI Fixes / 桌面端与界面修复 (#603, #608, #609)
  - ZH:
    - 托盘菜单多语言：桌面托盘右键菜单现在会跟随界面语言显示，全部 10 种语言都已支持，不再是固定中文 (#603)。
    - 界面切换更流畅：优化了视图和设置标签页的切换体验，点击立即响应，去掉了卡顿的过渡动画，快速切换不再掉帧 (#609)。
    - Release 标签名截断：修复超长 tag 名称在 Release 时间线里挡住时间和下载量的问题。超长标签现在会以省略号显示，鼠标悬停可以看到完整内容 (#608)。
  - EN:
    - Tray Menu Localization: The desktop tray context menu now follows your selected UI language, with translations for all 10 supported languages instead of fixed Chinese (#603).
    - Smoother View/Tab Switching: Switching views and settings tabs now responds instantly, with janky transitions removed so rapid switching no longer stutters (#609).
    - Long Tag Name Truncation: Fixed overly long release tag names covering the time and download columns in the release timeline. Long tags now show an ellipsis, with the full name available on hover (#608).
  4. 🔐 Security & Authentication Fixes / 安全与认证修复 (#580, #604, #605)
  - ZH:
    - 服务端安全加固：修复自托管部署在未设置 API_SECRET 时所有接口对外公开的高危问题。现在未配置密钥时容器会自动生成随机密钥并拒绝未授权访问；本地开发需要显式声明才会关闭校验 (#580)。
    - Token 引导优化：新建 Token 引导默认推荐 Classic Token，并在你使用 Fine-grained Token 时明确提示它的限制（对别人的仓库取消 Star 会失败、不支持 GitHub Lists），减少"明明有权限却提示无权限"的困惑 (#604)。
    - 本地 AI 端点测试修复：修复保存前测试本地 AI 配置（如 Ollama 的 127.0.0.1、局域网模型）报 502 错误的问题，现在保存之前就能直接测试连接 (#605)。
  - EN:
    - Server Security Hardening: Fixed a high-severity issue where self-hosted deployments without API_SECRET exposed every API endpoint. Unconfigured containers now auto-generate a random secret and reject unauthorized access; local development requires an explicit opt-out (#580).
    - Token Guidance: Token setup now defaults to Classic token guidance and clearly warns about Fine-grained token limits (un-starring other people's repos fails, GitHub Lists not supported), reducing "403 even though I have permission" confusion (#604).
    - Local AI Endpoint Testing: Fixed a 502 error when testing unsaved local AI configurations (e.g. Ollama on 127.0.0.1 or LAN models). You can now test the connection before saving (#605).
  5. ⚙️ CI/CD & Dependencies / 构建与依赖升级 (#573, #576, #578, #581, #595, #606, #582-#586, #588-#593, #596-#600, #607)
  - ZH:
    - UI 预览机器人：新增 UI 预览工作流：PR 改动界面时会自动截图并在 PR 里评论，只截取实际改动的页面，并覆盖登录页、弹窗等条件渲染场景，界面改动一眼可见 (#573, #576, #578, #581, #606)。
    - 依赖升级：升级 i18next 27、jsdom 31、Vitest 5.1、undici、axios、zod、parse5、@hono/node-server 等运行时依赖，以及 CI Actions 和 Wrangler 工具链 (#582-#586, #588-#593, #596-#600, #607)。
    - Dependabot 治理：GitHub Actions 的依赖更新会自动合并为一个 PR，减少流水线噪音 (#595)。
  - EN:
    - UI Preview Bot: Added a UI preview workflow that automatically screenshots UI changes and comments on the PR. It only captures pages actually touched and covers login pages, dialogs, and other conditional states, so UI changes are visible at a glance (#573, #576, #578, #581, #606).
    - Dependency Upgrades: Updated runtime dependencies including i18next 27, jsdom 31, Vitest 5.1, undici, axios, zod, parse5, and @hono/node-server, plus CI actions and the Wrangler toolchain (#582-#586, #588-#593, #596-#600, #607).
    - Dependabot Hygiene: GitHub Actions dependency updates are now grouped into a single PR to reduce pipeline noise (#595).

