  | #359        | fix(forks): Keep personal forks after username rename<br>Ensures user's personal forks remain intact and correctly tracked after renaming their GitHub username.                                                                                                                                                                      | 修复重命名 GitHub 用户名后 Fork 丢失问题<br>修复在 GitHub 更改用户名后，个人已同步的 Fork 仓库无法正常识别与保留的问题。                                                                                                      |
  | #360        | fix(auth): Preserve local data on logout; force pull on existing backend login<br>Preserves local repository cache and settings when logging out. When logging into an account with existing backend records, automatically pulls latest data to prevent data drift.                                                                  | 优化登录退出数据持久化策略<br>退出登录时完整保留本地数据；已有后端登录时强制拉取最新数据，避免多设备数据不一致或被意外覆盖。                                                                                                  |
  | #368        | feat: i18n multi-language support (10 interface languages)<br>Full UI localization for 10 languages (zh-CN, zh-TW, en, ja, ko, de, fr, es, pt, ru). AI descriptions, Release summaries, and translations dynamically match the active language.                                                                                       | i18n 多语言国际化全面支持<br>内置支持简中、繁中、英、日、韩、德、法、西、葡、俄共 10 种语言。AI 仓库总结、Release 分析与翻译提示词全链路适配所选语言。                                                                        |
  | #380        | fix(ui): Align list mode action buttons with inline edit & responsive folding<br>Aligns quick action buttons on the same row as inline category editing, folding buttons into dropdown based on container width.                                                                                                                      | 优化列表视图操作按钮与响应式排版<br>列表模式下将常用操作按钮与快速编辑置于同一行，并根据卡片可用宽度智能逐级折叠，避免排版溢出。                                                                                              |
  | #381        | fix(sync): Persist defaultCategoryOverrides through backend autoSync<br>Ensures custom default category override rules are preserved during background automatic synchronization.                                                                                                                                                     | 修复自动同步时默认分类规则覆盖丢失<br>修复后台自动同步期间 defaultCategoryOverrides 规则未正确写入导致分类重置的问题。                                                                                                        |
  | #382        | feat: Add repository health facts panel<br>Provides objective health indicators across Activity, Maintenance, Community, and Maturity without subjective scoring. Adds archived filter and created-date sorting. (Contributed by @Khk-NL)                                                                                             | 新增仓库客观健康事实面板<br>从活跃度、维护、社区和成熟度等维度展示客观指标，无主观评分偏见。支持按归档状态与活动周期筛选，新增按创建时间排序。(感谢 @Khk-NL 的贡献)                                                           |
