  ---

  > **A new logo**, and the play controls no longer cover the time readout on smaller windows.

  ### Changed

  • **New logo.** A retro stamp：the balaclava on a navy disc inside a cream badge, with "VIDEO KIDNAPPER" across the top and the app's steps, download, trim, caption and export, along the bottom. It replaces the blue balaclava everywhere: the window and taskbar icon, the app header, the Store tiles, the macOS and Linux icons, the website and the README. Small sizes such as the taskbar use a ring-free version of the mark, so it stays crisp at 16 pixels. Every logo file is now generated by `scripts/make_brand_assets.py`.

  ### Fixed

  • **The play controls covered the timecode on smaller windows.** Below about 1400 pixels wide, the transport under the preview drew the play buttons on top of the time readout, cutting the duration off. The controls now move into the free space and the readout drops its hours when the panel is narrow, so both stay visible down to the minimum window size. Times also round to the nearest millisecond instead of showing 1.2 s as 01.199.
