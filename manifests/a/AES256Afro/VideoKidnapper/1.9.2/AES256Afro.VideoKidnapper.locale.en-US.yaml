ReleaseNotes: "Published to PyPI：https://pypi.org/project/videokidnapper/1.9.2/\n\n**macOS:** `*-macos-arm64.dmg` (Apple Silicon) · `*-macos-x86_64.dmg` (Intel). Signed and notarized by Apple; FFmpeg bundled.\n\n---\n\n> **Everything in one window, easier trimming, and a steadier player.** Typing in a caption no longer fires shortcuts, Play no longer opens a console window or crashes, the preview keeps up with 4K, and on Windows updates now install themselves.\n\n### Added\n\n• **Updates install themselves on Windows.** When a new version is out, the bar at the top of the window asks whether to **Restart to update** (Setup, winget and portable installs). The new version downloads from the GitHub release with a progress bar in that same bar, is checked against the SHA-256 checksum GitHub publishes, and after you're asked to save your project the app closes, installs it and opens again. Setup and winget installs upgrade silently in the same per-user or all-users scope they were installed with (an all-users install still shows the Windows admin prompt); the portable build swaps its own .exe. You can cancel the download at any time, and the first start after an update says which version you're on. This works from 1.9.2 onward：updating to 1.9.2 itself still goes through the release page once.\n• **Trimming is easier to see and to do.**\n  • The two trim handles are now solid blue tabs on the video and audio lanes. They sit just inside the part being kept, so you can grab them even at the very start and end of the clip, and they light up under the mouse. The video and audio that will be cut are washed out.\n  • While you drag a handle, the ruler shows exactly where it is and how long the part is.\n  • Drag across the empty **Ranges** lane, or Shift-drag anywhere on the timeline, to draw the part to keep in one go.\n  • The timeline bar says what will be exported, for example \"Keeping 1:55.0 – 2:07.2 · 12.2 s\", and **Whole video** puts the full clip back.\n  • Under the preview, **Mark in** and **Mark out** are now **Start here** and **End here**, in the trim colour.\n  • **←** and **→** step one frame for a cut on the exact frame; **Shift+←/→** move a second.\n• **Delete** (or Backspace) removes the caption or image picked on the timeline, and Ctrl+Z brings it back.\n• **Icon buttons say what they do.** Hover over any icon (undo, crop, previous and next caption, the arrows under the preview…) and the status bar says what it does and its key. The caption's delete button now sits a little apart from the others.\n• **Discord presets warn about size.** With Discord (8 MB) or Discord (25 MB) picked, \"You'll get\" turns orange when the export will probably be too big to upload, instead of the upload failing afterwards.\n• **Right-click a text box** for Cut, Copy, Paste and Select all.\n• **Right-click a caption or image on the timeline** to go to its start, duplicate it (captions) or delete it.\n• **Export says when the frame shape cuts the picture.** A platform preset sets the frame shape too, so picking \"YouTube 1080p\" for a vertical clip cut most of it away, and only the Edit preview showed it. \"You'll get\" now says, for example, \"Frame 16:9：cuts off the top and bottom, keeping 32% of the picture\", with a **Keep its shape** button.\n• **A crash leaves a note behind.** If the app ever closes unexpectedly, the next start says so in the status bar and puts what it logged (including where every thread was when it died) in **Settings › Debug log**. The log is kept in `.videokidnapper_crash.log` in your home folder and trimmed to the last few runs.\n\n### Changed\n\n• **One window.** Recovering unsaved work, saving before you close or open another project, stopping an export that is still running, and restarting after a theme change are now asked in a bar at the top of the window instead of separate popups. The bar floats over the top edge, so nothing else moves, and you can keep working while it waits. Closing the recovery bar with ✕, or opening another video first, keeps the unsaved work for next time.\n• **Projects are in the main window.** Click the project's name in the header for Open project, Save, Save as and your recent projects. Import lists recent projects too, each with an Open button. The separate Projects window is gone.\n• **No welcome window on first start.** The app opens on Import, which already shows the ways to bring a clip in.\n• **Exporting no longer opens a separate window.** Progress, Stop and the finished file now appear right under the Export button：open the file, show it in its folder, or share it from there. While an export runs the button turns into Stop, so pressing it again can't start a second export. Quick export and `Ctrl+E` take you to Export so you can watch it.\n• **Captions from speech is now in the Text tab.** Pick the Whisper model and press **Generate captions**; progress, Stop and the result show in the same place, and the model you chose is remembered. **Captions ▾ ▸ Captions from speech** opens it.\n• **Screen recording is set up on the Import page.** Type how many seconds and press **Start recording**. The window still hides while it records; open it again to stop early, and what was recorded so far is kept. The Record buttons in Edit take you there.\n• **Text colour no longer opens the system colour picker.** The Text tab shows the eight preset swatches and a box for any hex code, such as `#FF8800`, next to the current colour.\n• **Setup and components opens inside the window.** It used to open a second window. It is now a page in the main window, like the debug log：the prerequisites on the left, the install output on the right, all without scrolling. **Back** or **Esc** returns to the step you were on. An install keeps going if you leave the page, and the page shows how it went when you come back. On first run, **Review details** opens the same page in place of the setup screen.\n• **Keyboard shortcuts open inside the window.** Press **?**, or the **?** button in the header, to see every shortcut on one page. Press **?** again, **Esc** or **Back** to return to where you were. A **?** typed into a caption or any other text box is still just a question mark.\n• **The update offer is in the main window too.** Store, pip and release-page installs see their update route in the bar at the top instead of a separate window.\n• **Smooth scrubbing.** Dragging the playhead no longer freezes the window while each frame is fetched：frames load in the background and show as they arrive. In a test drag across a 1080p clip the window was unresponsive for 3.7 seconds in total before, and 0.2 seconds now. Loading a clip also shows the window sooner.\n• **Faster start.** The window is ready about a third sooner (2.6 s to 1.7 s on the test machine)：the Export page and the Inspector's Text and Image tabs are built the first time they are used instead of at startup.\n• **The Text tab fits without scrolling.** At a 1440×900 window, half of it (position, timing, fade and motion) used to sit below a scrollbar. Position and its hint share a row, the From/to times and Fade each take one row, and Motion is a single row until you switch it on. The Clip tab's trim times are labelled **Start** and **End** and share a row.\n• **Smoother preview.** Shrinking each frame to fit the preview takes about half as long (a 1080p frame went from 12 ms to 6 ms, 4K from 33 ms to 15 ms), which matters most while playing, typing a caption and dragging. Stickers are resized once instead of on every redraw, a sticker drag no longer reloads the file twice per step, and an animated sticker's frames are freed when it's removed. Resizing the window redraws the preview and timeline once it settles instead of for every pixel, and dragging a caption that isn't on screen no longer redraws the preview. History thumbnails are fetched small, and the app starts a little sooner.\n• **Faster timeline and much less memory.** The filmstrip under the timeline loads about twice as fast and uses a few hundred kilobytes instead of up to 800 MB for 4K video, because it now fetches small frames several at a time instead of full-size frames one by one. The preview's frame cache is now capped by memory as well as by count. The waveform for an hour-long video is drawn in a fraction of a second instead of several seconds. Loading a clip no longer asks ffprobe about the same file eight times.\n• **4K plays in step with the sound.** Playback now has ffmpeg decode frames at about the size they're shown, and skips a frame that arrives late instead of falling further behind. In a 6-second 4K test the picture used to run about 50 ms behind the sound and showed 105 of its 180 frames; it now shows all 180, in step.\n• **Typing a caption no longer redraws the whole frame.** The frame is shrunk to the preview once, and each keystroke, sticker drag or caption edit only redraws the captions and stickers on top, as small patches laid out exactly as before. A keystroke on a 4K frame went from 40 ms to 7 ms (84 ms to 7 ms with a colour grade), and a blur-filled 9:16 frame from 72 ms to 24 ms. Animated stickers load in the background instead of pausing the window, a sticker drag counts as one change instead of two, and the timeline only redraws when something on it changed.\n• **Every installed font is in the caption font menu, and each one draws as itself.** The menu stopped at 30 fonts, and 19 of those came out as Arial in the preview and the export, because the font file was guessed from its name. The app now reads each font file's own name in the background at start, so all of them can be picked (about 200 on a stock Windows 11), Bold and Italic find the right file, and fonts installed just for you are found too.\n• **Time boxes take the short forms.** \"1:30\", \"90\" or \"90.5\" in a Start, End, From or Until box now work; they used to be thrown away. Anything that isn't a time gets a red border, and so does a font size that isn't a number, instead of quietly becoming 24.\n\n### Fixed\n\n• **A failed export only said \"Clip 1"
