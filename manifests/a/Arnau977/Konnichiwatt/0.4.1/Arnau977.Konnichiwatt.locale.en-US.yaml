Description: |-
  Konnichiwatt is a small tray app for Windows 11 that shows the battery level of wireless mice, keyboards,
  headsets and controllers (Bluetooth and USB receivers) inline on the taskbar, with low-battery and
  charge-complete alerts, a battery history page and automatic updates. Available in Spanish and English.
