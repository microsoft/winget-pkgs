ReleaseNotes: Studio layout by default, one-click updates from Settings, an Island pages screen with live previews, new mascot moods (Do Not Disturb, Live, AFK, Streaming Shows), a Tuck / Show / Hide choice for full-screen apps with per-app overrides, and the Notch as the default shape.
