ReleaseNotes: |-
  riscos: keyboard and mouse on the VNC desktop; pinned-QEMU cache keyed by release
  RISC OS guests now get a USB keyboard and a USB mouse (usb-kbd and
  usb-mouse; QEMU's usb-tablet never moves the RISC OS pointer because it
  rejects SET_PROTOCOL). Both work with riscos-builder v2.0.1, whose
  patched QEMU keeps framing the USB bus after the port reset RISC OS
  issues at Wimp startup; DEFAULT_BUILDER_VERSIONS moves riscos to 2.0.1.
  Earlier anyvm releases attach nothing but a tablet to that guest, so
  its desktop stayed view-only (vmactions/riscos-vm#12).
  The pinned-QEMU cache now lives under tools/-v/
  instead of tools//. A builder that republishes a same-named
  tarball with a fix (riscos-builder v2.0.1 did) was invisible to any
  machine that had already extracted the old one. Existing tools/
  directories are left in place and simply no longer used.
  Full Changelog: v0.7.4...v0.7.5
