ReleaseNotes: |-
  new guest libernt, new dragonflybsd, midnightbsd, nextbsd and hyprbsd
  default images
  New guest: --os libernt (LiberNT, the ReactOS fork that targets NT 10.0;
  a tech preview, x86_64 and aarch64). Like reactos it has no sshd: anyvm
  drives it over the telnet server the builder bakes in, and folder sync
  is --sync tar with Windows-style guest paths (-v "$PWD:C:\work").
  x86_64 is capped at 3072 MB of RAM. On a Linux host that is an AMD CPU
  running under Hyper-V (WSL2, Hyper-V or Azure VMs), anyvm runs LiberNT
  x86_64 under TCG instead of KVM unless --cpu-type is given: KVM nested
  on Hyper-V's AMD-V can lose guest CR8 writes, and LiberNT's Debug
  kernel then bug-checks.
  New default builder versions:
  dragonflybsd 2.0.7 -> 2.0.8 one consistent package set for the
  openssl 3.5 dports
  midnightbsd 2.0.8 -> 2.0.9 adds 4.0.9
  nextbsd 2.0.3 -> 2.0.4 adds continuous-desktop; every image is
  installed from upstream's live ISO
  hyprbsd 2.0.2 -> 2.0.3 15.1 is built from the final ISO
  libernt (new) -> 2.0.0
  Full Changelog: v0.7.7...v0.7.8
