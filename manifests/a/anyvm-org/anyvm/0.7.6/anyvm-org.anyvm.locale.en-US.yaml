ReleaseNotes: |-
  new default images for netbsd, omnios, openindiana, tribblix, ghostbsd
  and nextbsd
  The only change to anyvm.py is DEFAULT_BUILDER_VERSIONS, the builder
  release --os uses when no --builder is given. Pass --builder
  with the old version to keep the previous images.
  New default builder versions:
  netbsd 2.2.7 -> 2.2.9 adds NetBSD 11.1 (x86_64, aarch64,
  riscv64, sparc64, 11.1-microvm)
  omnios 2.1.3 -> 2.1.4 adds r151060 and r151060-build
  openindiana 2.1.4 -> 2.1.6 adds 202610 and 202610-build; every
  image is smaller (202604 is a 1.3 GB
  download instead of 2.2 GB)
  tribblix 2.0.7 -> 2.0.8 adds 0m41.1
  ghostbsd 2.0.8 -> 2.0.9 adds 26.2 and 26.2-xfce
  nextbsd 2.0.1 -> 2.0.3 NextBSD 27.0.0 instead of the 20260814
  snapshot; pkg install -y still
  installs FreeBSD ports
  netbsd-builder stopped rebuilding NetBSD 9.x at 2.2.8, so 2.2.9 has no
  9.x images. --release 9.0 to 9.5 keep working: anyvm finds them in
  2.2.7, the last release that has them.
  Other: CI tests every new release above except the -build variants, and
  its nfs check can now create the non-root user on NextBSD. The builder
  bump bot no longer moves a default before the new release has uploaded
  every image, and for a microvm image the kernel it boots.
  Full Changelog: v0.7.5...v0.7.6
