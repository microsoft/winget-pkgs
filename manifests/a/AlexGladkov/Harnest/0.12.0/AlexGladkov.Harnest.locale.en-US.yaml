ReleaseNotes: |-
  ## profile-router — субагент-планировщик флоу (новое)
  `install` генерит `~/.claude/agents/profile-router.md` (claude-code). Точка входа любого чистого флоу：детектит профиль по **Keywords** из `## Meta`, читает профиль + проектный `CLAUDE.md`, резолвит роли→агенты/scope/Models и возвращает **ПЛАН ОРКЕСТРАЦИИ**. Сам не спавнит и не пишет код — вложенный спавн запрещён harness; спавнит по плану main («мозг / руки»). Плюс секция «Шаг 0» в global-шаблоне.

  ## Fix：дублирование managed-блока
  Осиротевшие немаркированные копии шаблона теперь вычищаются, а не дублируются аппендом (корень бага удвоенного `~/.claude/CLAUDE.md`).

  ## Надёжность
  `installGlobalConfig` и запись агента атомарны (tmp+rename) с бэкапом `.bak`.

  ## Тесты
  `install_test.go`：create / idempotency / dedup / rewrap / append / backup / agent-gen. `go test ./...` зелёный.

  **Upgrade:** `harnest install` — почистит дубль, поставит profile-router (старый CLAUDE.md уйдёт в `.bak`).
