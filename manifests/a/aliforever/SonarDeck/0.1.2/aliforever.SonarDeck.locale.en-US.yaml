ShortDescription: Native Windows audio control deck with headset/speaker switching, an app mixer and SteelSeries Arctis Nova Elite control.
Description: |-
  Sonar Deck switches the default output and microphone between a headset and speakers with one click, from the tray or with Ctrl+Alt+F12.
  It has a per-app mixer with Game, Chat, Media and Aux groups and live level meters.
  A virtual microphone (via VB-CABLE) adds AI noise suppression (DeepFilterNet3), voice presets, a leveler and a de-esser, with a listen mode to hear the result.
  For SteelSeries Arctis Nova Elite headsets it shows battery levels, follows the headset power switch, uses the base station knob as master volume and controls the onboard EQ and headset settings without SteelSeries GG.
