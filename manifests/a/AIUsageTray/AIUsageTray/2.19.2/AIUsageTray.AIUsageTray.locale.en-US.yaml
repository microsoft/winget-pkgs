ShortDescription: Windows tray app that shows the live quota of your Claude, Codex, Z.AI and GitHub Copilot subscriptions behind one icon.
Description: |-
  AI Usage Tray is a lightweight Windows tray app that shows, behind one icon, the live quota of several AI coding subscriptions: any number of Claude subscriptions (5-hour and weekly windows), any number of OpenAI / ChatGPT Codex accounts, the Z.AI / GLM coding plan and GitHub Copilot (experimental).
  The tray icon shows the worst window's percentage, a hover popup lists every account, and a widget (Ctrl+Alt+U) gives an overview with per-account details. A local usage dashboard estimates token usage and API-equivalent cost from the Claude Code and Codex session logs on the machine. Optional features include an always-on floating status panel, scheduled five-hour window starts and a private remote view for phones.
  It is a fork of fmdz387/costats (MIT).
