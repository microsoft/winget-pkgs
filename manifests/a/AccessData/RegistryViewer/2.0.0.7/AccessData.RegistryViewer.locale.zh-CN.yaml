PackageIdentifier: AccessData.RegistryViewer
PackageVersion: 2.0.0.7
PackageLocale: zh-CN
ShortDescription: 免费的 Windows 取证注册表查看器，可查看 Windows 操作系统注册表的内容。
Description: AccessData Registry Viewer 可以查看 Windows 操作系统注册表的内容。与只能显示当前计算机注册表的 Windows 注册表编辑器不同，Registry Viewer 可以查看任何计算机的注册表文件。它可以访问注册表的受保护存储区，其中可能包含 Windows 注册表编辑器中无法访问的密码、用户名和其他信息。完整注册表视图显示注册表文件的全部内容，常见区域视图显示最可能包含重要数据的部分，报告视图只打印你选择的项。兼容 64 位 Windows 10、11 与 Server 2016/2019/2022。
