ShortDescription: Keeps your PC awake by gently nudging the mouse pointer.
Description: |-
  BusyMouse keeps your Windows PC awake by gently nudging the mouse pointer, so the screen doesn't lock and chat apps keep showing you as available.
  It lives in the tray: turn it on or off from the tray menu, the main window, or Ctrl+Shift+J. When you're using the mouse yourself, it skips the nudge.
  Nudge styles, interval and distance, time limits, pause while locked, and start with Windows.
