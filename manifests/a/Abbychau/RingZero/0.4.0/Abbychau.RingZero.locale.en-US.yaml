ShortDescription: Minimal token-efficient agent harness for the terminal
Description: RingZero is a minimal, token-efficient agent harness. The kernel is zero-dependency; the TUI is built on Ink (React). It features an agent loop with a permission gate, CJK-aware token budgeting, context compaction, tool-result truncation, prompt caching, MCP support, skills, plugins, and an interactive TUI plus REPL, one-shot, watch, and JSON-RPC modes.
