ShortDescription: Fast, lightweight MySQL and MariaDB client with unlimited connections.
Description: |-
  MySQL Lens is a free, open-source desktop client for MySQL and MariaDB.
  It offers unlimited connections, SSH tunnels, an editable data grid, SQL autocomplete and formatting,
  foreign key navigation, an ER diagram, manual-commit transactions, saved queries,
  and import/export for CSV, Excel, JSON and SQL dumps.
