ShortDescription: A simple program to monitor your network/data usage. Made for the average windows user.
Description: OpenNetMeter monitors your network speed and data usage. It shows the current session's usage, the data usage for today, and detailed usage for any period up to the past 60 days. A mini widget can be placed over the taskbar to display the network speed.
