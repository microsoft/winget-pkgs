ShortDescription: Windows desktop app for downloading videos via yt-dlp, with a bundled FFmpeg for post-processing.
Description: >-
  VideoDownloader is a Windows desktop app for downloading videos via yt-dlp,
  with a bundled custom FFmpeg for merging and remuxing. Paste a link or a
  list of links, pick a video/audio quality or let it auto-select the best
  available, and queue batch downloads with configurable concurrency,
  per-job progress, and cancel support. Every attempt is logged to a
  searchable download history with one-click redownload. Available in
  English and Polish, with Light/Dark/System UI themes.
