ShortDescription: A Windows system-tray app for building your own quick-access menu of programs, files, and shortcuts.
Description: |-
  CustomTools is a lightweight Windows system-tray utility with no main window. It builds its context menu dynamically from plugins.
  The bundled Registry Tree plugin lets you build a nested menu of items that run commands, open URLs or files, with a built-in editor and XML import/export.
  Features include a plugin architecture, launch at login, auto-update and an English, Polish, German, Spanish and Italian UI.
