ShortDescription: Free, open-source software-defined radio receiver covering TV, radio, aviation, maritime, satellite and amateur modes.
Description: |-
  OnAir turns a low-cost software-defined radio (a HackRF, an RTL-SDR, an Airspy and many others) into a receiver for most of what is on the air. Plug in an antenna, pick a mode, and watch the spectrum, the sync, the error correction and the decoded data.

  It covers 392 modes in 14 families, from TV and DAB to aircraft, ships, satellites, two-way radio, pagers and sensors, including digital TV (DVB-T/T2/C/S2, ATSC, ISDB-T, DTMB), DAB+, FM/RDS, DRM, ADS-B, ACARS, AIS, weather satellites, GNSS, FT8 and other amateur modes, DMR, P25 and TETRA, and pagers.

  It works with HackRF, RTL-SDR, Airspy, SDRplay, BladeRF, LimeSDR, USRP and Pluto, plus network radios, sound cards and Hamlib rigs. Free and open source under GPL-3.0-or-later.

  It is a receiver first. It can also send test signals through a transmit-capable radio into a dummy load, which is off by default behind a licence notice. New users can press Tour in the app to walk through OnAir on a built-in demo signal before buying a radio.
