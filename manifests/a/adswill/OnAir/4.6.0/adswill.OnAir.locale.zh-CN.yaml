PackageIdentifier: adswill.OnAir
PackageVersion: 4.6.0
PackageLocale: zh-CN
ShortDescription: 免费的开源软件定义无线电接收机，覆盖电视、广播、航空、海事、卫星与业余无线电模式。
Description: |-
  OnAir 可以把便宜的软件定义无线电设备（HackRF、RTL-SDR、Airspy 等）变成一台能够接收绝大多数空中信号的接收机。接上天线、选择模式，就能看到频谱、同步、纠错和解码结果。

  它覆盖 14 个类别中的 392 种模式，从电视和 DAB 到航空、船舶、卫星、对讲机、寻呼和传感器，包括数字电视（DVB-T/T2/C/S2、ATSC、ISDB-T、DTMB）、DAB+、FM/RDS、DRM、ADS-B、ACARS、AIS、气象卫星、GNSS、FT8 等业余无线电模式，以及 DMR、P25、TETRA 和寻呼。

  支持 HackRF、RTL-SDR、Airspy、SDRplay、BladeRF、LimeSDR、USRP 和 Pluto，也支持网络无线电、声卡和 Hamlib 收发信机。以 GPL-3.0-or-later 授权，免费且开源。

  它首先是接收机；也可以通过具备发射能力的无线电向假负载发送测试信号，该功能默认关闭并位于许可提示之后。新用户可以在应用中点击 Tour，使用内置演示信号先熟悉 OnAir，再决定是否购买设备。
