ShortDescription: Privacy-first personal double-entry bookkeeping
Description: |-
  AloxBook is a personal finance application that brings real double-entry bookkeeping to your desktop. Password protection is optional. When a password is set, SQLCipher encrypts the book with AES-256; without a password, the book is an unencrypted SQLite database. Forgotten passwords cannot be recovered.
  Features include a hierarchical account tree, CSV import with configurable profiles, transaction templates, period close and carry forward, and full English, German, French, Spanish and Italian language support with live switching.
