ReleaseNotes: |-
  0.33.0 - 2026-09-20
  The icons move now, and the app's interactions were audited end to end for
  consistency. Every glyph on a button, a menu item, a tab, a settings category
  or the activity rail has a motion of its own on hover, in the style of an
  animated icon set, with no new dependency and full respect for the reduced
  motion setting. Beyond that: a greyed-out control tells you why it is off,
  breadcrumbs on the detail tabs, a confirm before clearing an inbox, Move up
  and Move down in the collection tree, and a long list of small places where
  the same action was done two ways and now is done one.
  Added
  - Icons that move. Hover or focus a control and its icon acts out what it
    is: the trash lid lifts, the clock's hands turn, the radio's waves travel
    outward, the folder tilts open, the braces part, the search lens wiggles, the
    download arrow drops into its tray, the pin leans, the bell rings, the gauge
    needle sweeps. All 26 motions run from the button or row that owns the icon,
    never from the icon itself, and none of them loop. A status icon that is
    reporting a state stays still. The reduced motion setting, and the operating
    system's own reduced motion preference, collapse every one of them.
  - State changes crossfade instead of popping: Copy to a check, Show to
    Hide on a secret, Play to Stop, a folder opening and closing.
  - A disabled control says why. Hover a greyed-out button and the reason is
    there: "No captures to clear", "No unsaved changes", "Already first" on a
    menu item that cannot move further.
  - Breadcrumbs on the detail tabs. The collection tab, the dashboard and a
    run's report show where they live, with each ancestor clickable. A nested
    collection shows its chain; a root collection shows nothing extra.
  - Move up and Move down in a collection tree row's menu, beside the
    existing drag.
  - Empty trash in the Trash panel's header.
  - Empty states offer the way forward. An empty dashboard, history list,
    services list, mock server, console or request pane carries the button that
    fills it, rather than a sentence pointing at a toolbar.
  - Clearing an inbox's captures asks first, naming how many it is about to
    remove. It was the one destructive action in the app that did not.
  - Run status in the history sidebar carries a shape as well as a colour, so a
    finished, failed and stopped run are distinguishable without colour vision.
  - Import progress is announced to assistive technology as each step completes.
  Changed
  - Copying shows a check on the button it came from. A copy from a menu
    item or a text button toasts, naming what was copied. A copy that the system
    refused now says so in both cases; it used to fail silently.
  - Delete confirmations read the same way everywhere: the item by name,
    and "and everything inside it" when children go with it, where they used to
    be worded per screen.
  - A new folder is called New Folder, not New Sub Collection.
  - Services rows show their actions on hover, like every other row.
  - A history row whose URL does not fit keeps the path and drops the host,
    since the path is what tells two runs apart.
  - The welcome screen sits in a centred reading column instead of stretching
    to the window's width.
  - The settings restart banner and the dashboard's slow-request notice read as
    warnings, not errors.
  - Consistency pass across the app: one look for tab strips and pane headers,
    one component each for field, block and pane errors, one section-label
    style, one Cancel button, named sizes for the two smallest type steps and
    the small icon size, and one hover treatment for row actions. No behaviour
    changes beyond those listed above.
  Fixed
  - Renaming a collection, folder or request commits only on a plain Enter.
    An Enter that finishes composing a character in an input method, or an
    Enter carrying Ctrl or Cmd, no longer commits a half-typed name. Escape
    always cancels; it used to commit in two of the trees.
  - The spare row at the bottom of a params, headers or variables table no
    longer shows an enable checkbox for an entry that does not exist yet.
  - The trash icon's lid was clipped at the top of its box when it opened.
  - A settings pane, a variable table or a code editor that failed to load
    showed red text where the rest of the app shows an error state with the
    detail underneath; they match now.
