ReleaseNotes: |-
  0.39.0 - 2026-10-01
  Read Changed before updating: this version upgrades the workspace
  database again, and an imported form-data file is no longer sent until you
  choose it or allow its folder. The headline changes are a Binary file
  body mode, a new Settings > Files page that decides which files a request
  may send, and URLs and query strings encoded the way Postman sends them,
  including hosts with non-ASCII names.
  Added
  - Binary file bodies. The Body tab has a Binary file mode that sends
    one file as the whole request body. Choose it, drop it on the editor, or
    type a path; a path can use variables, such as {{fixturesDir}}/avatar.png.
    Files of any size are supported, and large ones are streamed from disk.
  - The body's Content-Type comes from an enabled Content-Type header if you
    set one, else the type you pick in the editor, else the file extension,
    else application/octet-stream. Code snippets show the same type.
  - Settings > Files. Vayu sends a file you chose in the editor, or any file
    under a folder you allow on this page. A path that came from an import, a
    pasted curl command, an AI agent, a data file or a variable is sent only from
    an allowed folder, so an imported collection cannot read a file you did not
    pick.
  - A request with a file nobody chose here shows Not chosen on this machine
    with Relink and Allow folder.... The import preview lists the folders
    an import's files live in, each with Allow folder.
  - Binary bodies import from Postman (mode: "file"), Insomnia, OpenAPI
    (application/octet-stream and format: binary) and a pasted
    curl --data-binary @file or wget --post-file, and the Postman and OpenAPI
    exports and code snippets write them back. Before this version they were
    dropped with a count.
  - History shows each sent file's name, size and SHA-256. The path and the
    contents are not stored.
  - AI agents can add a file to a request, but Vayu sends it only after you
    choose it or allow its folder.
  - A request to a host with a non-ASCII name, such as bücher.example, is sent
    using its punycode name, as Postman does. Client certificates and proxy
    rules written with either spelling apply to it.
  Changed
  - The workspace database moves to schema version 3. Once 0.39.0 opens a
    workspace, earlier versions refuse it, so going back to 0.38 means restoring
    a backup.
  - An imported form-data file is no longer sent until you relink it or allow
    its folder. Earlier versions tried to send it from the path in the
    collection, which usually failed on another machine.
  - A missing, unreadable or untrusted file stops the send or run with a message
    naming the file and what to do. A collection or load run checks every file
    before it starts.
  - URLs, query values and query-placed credentials are encoded the way Postman
    encodes them, including in pm.sendRequest and values filled in only at
    send time. An imported query row with an empty value is sent as key=, a
    row with no value at all as key.
  Fixed
  - A load or collection run against a host that resolves to more than one
    address (*.localhost, for instance) could fail where Send worked.
  - The Params table lost a query row's valueless state, and editing one row
    re-encoded the others.
  - A {{variable}} in the query was shown on the Sends line differently
    from how it was sent.
  - Internal: documentation kept in step with all of the above.
