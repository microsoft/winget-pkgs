ReleaseNotes: |-
  0.51.0 - 2026-11-16
  Read before updating: this release carries a dozen security fixes (under Security), so update soon. Behaviour changes to check: a collection's setup and teardown scripts now run for every folder, a collection's inherit auth is refused, GraphQL schemas are fetched on their own only for endpoints you have already contacted, and trashing a collection stops its mocks. New: scripts get more of pm.request.url, Run inline switches on script elements, edits made outside the app show up in open tabs, and an accessibility and narrow-window pass across the app.
  Added
  - Edits made outside the app appear in open tabs. A change another client makes through the engine, an agent for instance, now refreshes the tabs, lists and trash that show it, without reopening anything (#3420).
  - A Run inline switch on pre-request and post-request script elements. The setup and teardown editors are labelled by kind and offer only snippets that need no request (#3455).
  - pm.request.url has getRaw(), getPathWithQuery() and getRemote(), and the query list reads like Postman's. The import notice names pm.request.url.variables, pm.response.jsonp and pm.response.json(reviver), which are not supported (#3462).
  - Requests a script sends with pm.sendRequest, and a failed token fetch, are logged to the Console (#3462).
  - Unsaved edits in a collection's Info, Auth and variables tabs survive a switch to another tab, and are dropped with the tab or the collection (#3459).
  - Saving a response as an example keeps one header row per received line and flags a body that was cut. The MCP example tools accept ordered {key, value, enabled?} header rows (#3422).
  - A text response example in an OpenAPI 3.x or Swagger 2.0 document is imported (#3424).
  - The Trash names what a purge destroys and who owns each entry, and says why a restore needs its parent first (#3449, #3451).
  - A pasted URL's query opens as Params rows, and typing a query pair keeps the URL's order (#3491).
  - A collection run shows its verdict on the welcome screen, in the context bar's Last run row and in the palette, and History shows a folder rather than a GET badge for it (#3458).
  - The tab strip and context rail join the F6 region cycle, run starts and endings are announced to screen readers, charts have a text alternative, and icon-only buttons show their label on keyboard focus. F8 is listed in Settings > Keyboard shortcuts (#3498).
  Changed
  - A collection's setup and teardown scripts run for every folder in a sequential collection run and in a scenario load run, not only the top one. A setup that refuses the run is named on the failed report (#3455).
  - A collection or request auth with an unknown mode is refused, and inherit is refused on a collection write and stepped over when already stored. The MCP collection tools no longer offer it (#3445, #3464).
  - GraphQL introspection runs on its own only for an endpoint you have contacted. A request from an imported file used to be sent, with your variables and auth, as soon as its GraphQL body was on screen (#3522).
  - Trashing a collection stops its mocks, whichever client deleted it (#3449).
  - A move out of an OpenAPI spec binding is declined, and a document a trashed collection binds cannot be deleted (#3447).
  - A collection run with failed or errored steps is marked failed in History, and a single-request load run counts its failed assertions in its verdict (#3458).
  - A request's pm.test rows no longer read a bare null or undefined, and a script that runs out of memory reports a sentence (#3460).
  - A script cannot store a variable name the API refuses. console stays defined as a no-op when script console output is off.
  - The Sends line shows the URL that reaches the server, including an OAuth 2.0 query token and a GraphQL GET's document, and masks a resolved API key.
  - Numbers (latency, phases, percentages, byte sizes up to GB) follow your locale in every panel, and a literal -0 prints as 0 (#3497).
  - Engine messages say "Couldn't ..." and name Settings with the same path separator the app uses. Short labels are spelled out ("All statuses", "Wire time") (#3500).
  - Accent colours meet 4.5:1 for text and white-on-fill in every scheme, focus rings are 3:1, and a latency percentile over its SLO is marked with a glyph and text rather than colour alone (#3499, #3515).
  - Below 1000px the side drawer overlays the pane, only one overlay shows at a time, and the chrome that broke at a narrow pane or 200% scale now reflows (#3494, #3507).
  - Electron 44.10.2, the MCP SDK 2.4, and updated app dependencies, including a patched dompurify bundled in the editor (#3533, #3534).
  - Internal: design-system, test and documentation clean-ups.
  Fixed
  - A collection's deferred replay and inline load scripts get the right request. Each sample replays with the request it sent, and an inline script sees the request's id and name. A load run's replay or running script now ends on Stop and on shutdown (#3460).
  - A sub-collection's variables show with their ancestor path in the Variables drawer (#3495).
  - Duplicate copies a request's saved examples and flushes an open editor's pending save first.
  - A deleted request's unsaved edit is dropped instead of saved back (#3444).
  - A collection tree drag no longer leaves a stuck chevron after Escape, lands under an open folder correctly and offers no stale Undo (#3447).
  - A new folder is revealed and focused, and focus returns to the row after a dialog opened from its menu closes (#3443).
  - Inline rename opens with the whole name selected, and a tree row's accessible name is its own name.
  - The Dock and Services drawer follow an engine crash at once, name the services a restart stopped and drop the notice when the outage ends (#3493).
  - A webhook inbox shows a capture's body in the main pane, keeps the tail of a long path visible and reads empty or undecodable base64 correctly (#3492).
  - A failed send keeps the server's headers in its stored trace, and body byte counts are UTF-8 (#3423).
  - A stream Send no longer refills the pane from the last design run (#3421).
  - A global a script sets is saved on a workspace whose globals were never saved.
  - The load dialog no longer warns that a pre-request script marked Run inline will not run.
  - A curl or wget paste keeps the total timeout, and a UTF-8 body stays in the editor under a binary header type (#3427).
  - Postman import skips an oversize or over-cap saved response instead of failing, skips one with a non-final status code, and counts a certificate on a {{port}} or {{scheme}} URL rather than registering it (#3424, #3454).
  Security
  - Error text no longer carries the value a variable resolved to, and what an MCP agent reads in an engine refusal is masked like run output (#3518).
  - Run output given to MCP agents withholds URL passwords and credentials in a report's request URL (#3520).
  - A secret is masked in a URL's path, fragment and user info as well as its query (#3521).
  - GraphQL introspection no longer sends a request on its own to an endpoint you have not contacted (#3522).
  - A mock with an origin list answers only on its own loopback address (#3524).
  - Vayu no longer downloads a spellcheck dictionary at launch on Linux (#3526).
  - The change feed needs a single-use subscription id, so nothing else on the machine can fill its slots (#3528).
  - The engine's grant secret is overwritten in its process environment, not only unset (#3529).
  - The inbox, mock and OAuth listeners bound their connection queues, so idle connections cannot exhaust the engine's file descriptors (#3530).
  - A stopping server never starts an OAuth token request (#3523).
  - A compressed webhook body is captured as sent instead of being refused (#3525).
  - SECURITY.md says an imported Postman file can turn certificate verification off (#3527).
  Every asset except the .sha256 checksums carries a build-provenance attestation: gh attestation verify <asset> --repo athrvk/vayu.
  Which file do I download?
  - macOS (Apple Silicon and Intel): run bash -c "$(curl --proto '=https' --tlsv1.2 -fsSL https://athrvk.github.io/vayu/install.sh)". The .dmg and .zip are the same universal build, unsigned.
  - Windows (x64): winget install athrvk.Vayu, or Vayu-x64.exe.
  - Linux (x86_64 only, there is no arm64 build): the .AppImage, or sudo apt install ./Vayu-amd64.deb.
  - The .yml, .blockmap and .sha256 files are for the auto-updater and for checking a download. You do not need them.
  If your OS warns you
  Vayu is not code-signed, so the OS can stop a downloaded file on first launch. Nothing is wrong with the file.
  macOS says an app downloaded from this page (.dmg or .zip) is "damaged", because Vayu is not notarized. This command installs it without the warning:
  bash -c "$(curl --proto '=https' --tlsv1.2 -fsSL https://athrvk.github.io/vayu/install.sh)"
  Windows shows "Windows protected your PC". Choose More info, then Run anyway. winget install athrvk.Vayu skips it.
