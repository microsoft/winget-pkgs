ShortDescription: A fast, lightweight download manager with multi-connection downloads, pause and resume, and a browser extension.
Description: |-
  BDownloader splits each file into parts and downloads them in parallel over several connections, so downloads finish faster, and can pause and resume them at any time, even after a restart.
  Its browser extension for Chrome, Edge, Firefox, Brave, Opera and Vivaldi hands your downloads to it, and adds a "Download this video" bar to videos: video files, HLS streams and YouTube, in any quality up to 4K.
  It also has a speed limit, a tray icon and automatic updates. Free for personal and other non-commercial use.
