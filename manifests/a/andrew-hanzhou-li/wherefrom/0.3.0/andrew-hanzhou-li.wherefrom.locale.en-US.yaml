ShortDescription: Right-click any file and see where it was downloaded from, even after it's renamed, moved or copied.
Description: |-
  wherefrom remembers where your downloaded files came from: the link, the page that link was on, and when. Right-click any file and choose "Where did this come from?" to see it, even after the file has been renamed, moved, or copied to a USB stick or another computer.
  It reads what your browser already records (the Mark of the Web and the download history of Chrome, Edge, Brave, Vivaldi, Chromium and Firefox) and keeps it in a small database on your computer, next to a fingerprint of each file's contents. Everything stays on your computer; it makes no network connections.
