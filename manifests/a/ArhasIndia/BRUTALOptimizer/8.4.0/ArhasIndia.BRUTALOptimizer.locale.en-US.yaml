ShortDescription: Windows optimizer and gaming toolkit that measures instead of promising.
Description: |-
  BRUTAL Optimizer tunes Windows settings for everyday use and for gaming, and shows its work. The settings it changes have per-module undo. The Disk Cleaner reports the space Windows actually freed. Drive Health checks whether TRIM is on, runs ReTrim on SSDs when you choose Optimize, and defragments only hard drives. On Windows 11 the FPS overlay counts the game's own frames for the PC games it detects and for GameLoop; whenever it shows the display's rate instead (as on Windows 10 and for other emulators), the FPS figure is labelled DISPLAY, and with no game it shows "No game" instead of a fake number. No hooks in the game, and no kernel driver of our own. Network tools grade bufferbloat and trace your route.
  Smart Route, on the BRUTAL GPN (our network of gaming relays), measures your direct path and a path through a nearby relay to the server you're already on. When you route a game, it engages the relay only if it measurably wins, never switches routes mid-match, and goes direct again when the relay stops winning; otherwise it stays direct. The publisher's rules decide whether relayed traffic is allowed.
  Free includes 17 of the 22 modules. Pro and Ultra are yearly plans that renew until cancelled. Smart Route measuring is free; engaging a route needs Ultra.
  Smart Route installs the official, signed WireGuard for Windows the first time you route a game, in one click, from WireGuard's own site.
