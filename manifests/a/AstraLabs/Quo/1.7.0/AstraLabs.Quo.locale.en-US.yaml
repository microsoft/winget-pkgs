ShortDescription: Private AI that works offline. An open-source assistant that runs AI models on your own computer.
Description: |-
  Quo is a free, open-source AI assistant that runs language models on your own computer, so your conversations, documents and photos stay on the device and it works without an internet connection.
  Models run on the graphics card. Quo answers questions about documents and images, and Code mode is a coding agent that asks before every change, command, commit and push.
  Optional cloud models are clearly marked and used only when you choose one.
