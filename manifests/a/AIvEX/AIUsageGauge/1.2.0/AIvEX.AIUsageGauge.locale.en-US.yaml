ShortDescription: Always-on-top Windows widget that shows how much Claude Code usage you have left.
Description: |-
  AI Usage Gauge sits in the corner of your screen and shows your remaining Claude Code 5-hour and weekly usage.
  With Claude Code 2.1.80+ (terminal, Pro/Max) it can show the official remaining % that Claude Code passes to its status line; otherwise it estimates from local logs.
  It never reads your login. Also shows tabs for Codex, Gemini CLI, Antigravity and Cursor (activity estimate), and finds overly long chats.
  Unofficial tool, not affiliated with Anthropic.
