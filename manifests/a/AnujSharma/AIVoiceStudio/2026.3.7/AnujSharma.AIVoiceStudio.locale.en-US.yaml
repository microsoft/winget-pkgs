ShortDescription: Convert PDF, DOCX, EPUB and clipboard text into spoken audio with offline neural voices
Description: "AI Voice Studio turns documents into spoken audio books and DAISY talking books on your own computer. It reads PDF, DOC/DOCX, EPUB, HTML, Markdown and plain text (or text on the clipboard), splits the text into pages or chapters, and records each part as a separate WAV, MP3 or FLAC file with an offline neural text-to-speech engine. Every window works with a screen reader: real MSAA names on every control, access keys on every action, keyboard-only operation, and an audit tool that fails the build when a gesture stops working. Synthesis runs locally, so no document leaves the machine."
