ShortDescription: Keeps your PC awake with a tray timer.
Description: |-
  Caffeine for Windows keeps your PC awake so it stays unlocked for
  presentations, downloads, and remote sessions. A tray icon starts and stops
  a countdown timer with 5, 10, 15, 30, and 60 minute presets or an indefinite
  hold. Optional auto-reset on activity and reactivate-after-wake, an optional
  Windows startup task, and a dark or light aware tray icon are included.
  The app is under 1 MB and needs no admin rights.
