ShortDescription: Terminal coding agent for local LLMs (llama.cpp, Ollama, vLLM) and any OpenAI-compatible API. OS-sandboxed autonomy, MCP, sessions. Go.
Description: 'apogee is an open-source AI coding agent that runs in your terminal and works with local LLMs. Point it at a local model server — llama.cpp, Ollama, LM Studio, vLLM — and your code never leaves your machine: no API key, no cloud, works offline. The one request apogee makes on its own is a check for a newer release on github.com when the TUI starts; update-check: false turns it off. Point it at any OpenAI-compatible endpoint, at OpenRouter, or at Claude over the Anthropic API, and the same agent runs there. One binary for Windows, macOS and Linux.'
