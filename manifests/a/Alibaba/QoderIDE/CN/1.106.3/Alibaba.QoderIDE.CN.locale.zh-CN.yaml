ReleaseNotes: |-
  企业设备账号管控
  功能
  - 企业设备账号管控：企业 IT 可通过系统托管配置，限制设备仅允许登录指定企业的账号。
  - 会话内查找：按 Ctrl/Cmd+F 搜索当前会话，支持区分大小写、全词匹配和正则表达式，快速定位历史内容。
  优化
  - 悬停在已发送的消息上即可复制，粘贴回输入框时保留引用文件等附件标签，方便修改后重新发送。
  - 加快大仓库中通过 @ 搜索和引用文件的速度，减少等待。
  - 缩短部分模型的上下文压缩耗时，提升长对话的流畅度。
  - 优化文件上下文的使用，按需读取附件，并结合对话判断当前打开的文件是否相关。
  - 缩短网页登录成功后返回 IDE 完成认证的等待时间。
  修复
  - 修复 Windows 启动和退出时的卡顿，以及服务重新连接后历史会话无法自动恢复的问题。
  - 修复文件保存失败后 Agent 继续编辑或重试，以及 Hook 拦截后文件占用和“生成中”状态残留的问题。
  - 修复 Agent 新建后又删除的文件仍留在 Review 列表、导致审查页无法打开的问题。
  - 修复终端输出导致内存持续增长的问题，提升长时间使用的稳定性。
  - 修复企业模型与官方模型同名时选择错误的问题，并在切换模型和恢复会话时保留明确选择的企业模型。
