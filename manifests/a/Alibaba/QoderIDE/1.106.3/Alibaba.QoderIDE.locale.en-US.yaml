ReleaseNotes: |-
  Qoder IDE Now Supports Mobile Remote Control
  Features
  - Mobile Remote Control: Use Qoder Mobile to check task progress, respond to confirmation requests, add instructions, or stop tasks while away from your computer. You can also create Agent tasks for projects already open in the IDE.

  - Customizable Chat Layout: Move chats freely between the sidebar and editor area by dragging or using the tab menu, while preserving drafts, attachments, model selection, and chat state. Chat alongside your code or give longer chats more reading space.

  Improvements
  - Added support for configuring the maximum output token count for custom models.
  - The chat input now explains why “Optimize Input” is unavailable.
  - User questions are no longer pinned to the top of the chat panel. User message bubbles are also easier to distinguish from replies in the default light theme.
  - Reduced unnecessary rewrites when Agent edits large files, improving editor responsiveness and lowering peak memory usage when saving and restoring extensive edit histories.
  - Reduced duplicate uploads and preparation overhead when sending messages with images.
  - Improved handling of new pop-up windows and tabs in the built-in browser when opening and closing them, reducing page state loss.
  - Improved voice connection compatibility with system-trusted certificates, reducing connection failures when using enterprise certificates or proxies.
  - Deleted content in inline diffs now displays fully within the editor layout and supports selection and copying, making it easier to retain portions of the original text during review.
  - Optimized IDE packaging to reduce installer size and speed up startup.
  Fixes
  - Fixed an issue where the local AI service failed to recover automatically after disconnections or repeated connection failures, leaving the chat panel unavailable for extended periods.
  - Fixed issues where interrupted Windows updates could prevent the app from launching or break shortcuts.
  - Fixed issues where terminal commands remained in a waiting state after completion and missing prompts interfered with subsequent commands.
  - Fixed an issue where large edit histories could not be restored.
  - Fixed an issue where stale state prevented changes from being accepted after reloading while offline or reopening a previous chat.
  - Fixed an issue where changes could not be accepted after line-ending changes, even when selecting “Keep Current Content.”
  - Fixed an issue where deleting an empty file prevented navigation to the next file.
  - Fixed an issue where sending multiple screenshots together was incorrectly flagged as exceeding the message size limit.
  - Fixed an issue where copying unavailable images from previous messages caused the input box to crash.
  - Fixed issues where resizing the input box clipped image removal buttons and left excess blank space.
  - Fixed an issue where unsent drafts were lost when opening previous chats.
  - Fixed an issue where adding selected text from the Search Editor to a chat caused an error due to missing file location information.
  - Fixed an issue where the welcome page obscured page load failures in the built-in browser.
  - Fixed an issue where certain task data caused the Expert Team overview to crash during rendering.
  - Fixed an issue where the surrounding chat could not scroll when an interactive component had no scrollable content or had reached its scroll boundary.
  - Fixed an issue where mouse-wheel font zoom in the terminal was restricted by the scroll position.
