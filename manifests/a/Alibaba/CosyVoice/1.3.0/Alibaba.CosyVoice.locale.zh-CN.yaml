Description: CosyVoice 是阿里通义推出的智能语音输入应用，支持实时高质量语音转文本，自动过滤“嗯、啊、那个”等口语化填充词与重复词；识别“不对，改成…”等口语自我修正并自动应用；将散乱口述自动整理为编号列表、表格或大纲；一句话指令即可生成完整邮件、会议邀请等成稿。支持上海话、粤语、四川话等多种方言转写为标准普通话，并提供多语言翻译、智能区分发言人、智能总结摘要、智能待办跟踪等功能。
