ReleaseNotes: |-
  企业级 Skill 与 MCP 下发及多项稳定性修复
  - 修复 Windows PowerShell 安装脚本在受限语言模式下（如启用了 AppLocker 或 WDAC 的企业电脑）无法解压安装包的问题。现在会改用系统自带的 tar.exe 解压，安装可以正常完成
  - 修复了 MCP 工具列表刷新失败导致工具不可用的问题
  - 修复长会话压缩上下文时，模型服务返回“输入过长”错误导致压缩失败的问题。现在会自动裁剪较早的历史并重试压缩
  - 支持企业管理员向成员下发独立 Skill 和 MCP
  - Auto 权限模式下审批策略改为仅命中高风险命令时才进行模型审批
  - 修复在色彩支持有限的终端（如 TERM=xterm 下的 GNU screen）中，主输入框不显示光标的问题
  - 修复 BYOK 模型的思考强度档位、关闭思考选项和上下文窗口选项丢失的问题
  - 修复项目目录无法建立文件索引时，@ 补全整体失效的问题
  - 修复自动压缩后使用 /rewind 可能恢复压缩前全部历史的问题。该问题会导致上下文占比较低时也再次触发自动压缩
  - 修复会话流中的长 URL 换行后点击只能打开部分地址的问题
  - 修复终端深浅色主题切换后颜色残留的问题
  - 修复在部分终端使用 /export 时，导出的会话内容重复的问题
  - 修复 Windows 下会话查询 Git 信息超时或被取消后，Git 相关进程可能残留的问题
  - 修复 WebFetch 选择“始终允许”后仍反复弹出权限确认的问题
