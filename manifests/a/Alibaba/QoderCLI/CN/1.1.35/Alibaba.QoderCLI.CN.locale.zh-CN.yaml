  什么是 Qoder CLI

  Qoder CLI 是 Qoder 品牌下的命令行 AI 编程助手，它把强大的 AI 编程能力直接带入你的终端。你不需要离开命令行，就可以让 Qoder 理解整个代码库、编写和修改代码、运行命令、检索资料，并完成从探索到提交的完整开发流程。
  Qoder CLI 面向习惯在终端里工作的开发者。它以对话的方式运行：你用自然语言描述想做的事情，Qoder 会自主决定需要读取哪些文件、调用哪些工具、执行哪些命令，并在关键操作前根据权限设置向你确认。

  核心能力

  Qoder CLI 的能力大致可以分为以下几类：

  代码理解与生成
  - 查询和编辑大型代码库，跨文件理解项目结构与依赖关系。
  - 支持多模态输入（例如图片、PDF），根据设计稿或截图生成代码。
  - 用自然语言描述缺陷，让 Qoder 定位并修复问题。

  内置工具
  - 文件读写与编辑、目录浏览。
  - Shell 命令执行。
  - 代码搜索（Grep）与文件查找（Glob）。
  - Web 搜索与网页抓取，获取实时信息。

  自动化与集成
  - 自动化 Git 操作、提交、PR 处理等重复性任务。
  - 通过 MCP（Model Context Protocol）接入外部服务和自定义工具
  - 支持非交互（Headless）模式，在脚本和 CI/CD 流水线中运行

  可扩展性
  - 通过 Skills、Plugins、Subagents、钩子 和 自定义命令 按团队需要扩展 Qoder CLI 的行为。
  - 通过 记忆 与 知识库 让 Qoder 记住项目约定和团队知识。

  运行机制
  Qoder CLI 的核心是一个 Agent：它接收你的请求，规划步骤，调用工具完成任务，并在过程中不断根据结果调整策略。整个过程围绕四个要素协同运行：
  - Agent：负责理解意图、规划步骤、决定下一步动作。
  - 工具：Agent 通过工具与你的项目和环境交互，例如读写文件、执行命令、搜索代码。
  - 权限：在执行有副作用的操作（如写文件、跑命令）前，Qoder 会依据权限设置请求确认或直接放行。
  - 上下文：对话历史、项目说明（AGENTS.md）和长期记忆共同构成 Qoder 完成任务时依赖的背景信息。

  多种工作方式
  同一个任务可以有不同的完成方式。Qoder CLI 提供多种工作方式，覆盖从即时对话到长时间自动化的不同场景：
  - 交互模式：边聊边做，最常用的默认方式。
  - Plan（先规划再执行）：先分析问题、确认方案，再动手改代码。
  - Goal（持续完成目标）：设定完成条件，让 Qoder 持续工作直到达成目标。
  - 定时任务：在指定时间运行一次，或按日历计划重复运行。
  - /loop（重复执行）：按固定时间间隔重复运行同一任务。
  - Headless（脚本中运行）：在非交互环境中运行，输出结构化结果。
