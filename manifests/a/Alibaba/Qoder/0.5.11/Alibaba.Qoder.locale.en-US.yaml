ReleaseNotes: |-
  Beyond Responses, Proactive Suggestions

  Features
  - Next-step suggestions: Qoder can proactively suggest what to do next when the composer is idle and empty. Press Tab or Right Arrow to insert a suggestion into your draft, then review and send it.
  - Custom UI plugins: Use the plugin-creator skill to build plugins with custom interfaces. Once installed, they can stay open as apps in Qoder, bringing your own tools into your everyday workflow.
  - Issue collaboration: Add comments, replies, and attachments, assign issues to available agents, link discussions, and review execution records and results. Available to accounts with project collaboration enabled.
  - Data import: Adds Kiro IDE imports for tasks, memory, and supported Skills, MCP configurations, and Powers, with incremental updates. Also improves QoderWork source detection and preservation of workspace information for Codex sessions spanning multiple directories.

  Improvements
  - IM plugin management: Review connection states, notifications, and pairing requests from enabled IM plugins in one place, with clearer setup guidance and authorization when switching the device handling a connection.
  - Cloud automations: Select existing cloud resources and upload supported attachments to provide the capabilities and inputs your automations need.
  - Browser and webpage context: Reference tabs from connected, supported browsers with @, and request summaries of public webpage links.
  - Device connections: When the target device supports and authorizes it, create a workspace on that device or start a task without a workspace.
  - Knowledge management: Improves incremental updates, progress displays, and retries after failures for Repo Wiki and Knowledge Cards. Available team knowledge can be retrieved automatically where account and organization policies allow.
  - Tasks and attention: Review and clear eligible local My Attention history. Output files in the task monitor are ordered by their last-modified time, making recent results easier to find.
  - Network proxy: Adds SOCKS5 support for manual proxy configuration, with improved credential editing and feedback when applying saved settings.
  - Qoder Helper: Improves official-documentation lookup, guidance on where to find features, and configuration explanations, helping you find the information and actions you need.
  - Remote work: SSH sessions can send files from your local machine and reference content on the same remote host. The first connection opens the remote home directory by default, and reconnecting keeps the selected directory.

  Fixes
  - Fixed annotations on empty Word table cells failing to send, false connection or permission errors while the editor loads, and tab icon and pagination display issues.
  - Fixed excessive memory use when converting Excel formulas to values in bulk, and increased the object limit for creating dense presentation slides.
  - Fixed Sites preview recovery after its entry file is renamed or backed up, navigation from a conversation to a valid annotation, and template-list and design-style picker display issues.
  - Fixed Windows attachment paths, legacy Skill labels, and large-record reads in QoderWork imports. For sources that support re-importing, individual unavailable images no longer block the remaining content.
  - Fixed Chrome’s “Send this page” requiring a prior visit to Settings, while preserving the existing draft. Also fixed character-encoding issues in some webpage link previews.
  - Fixed being unable to re-enter an SSH password after entering it incorrectly, the SSH configuration dialog failing to close on Linux, and WSL incorrectly reporting lost history after switching tasks.
