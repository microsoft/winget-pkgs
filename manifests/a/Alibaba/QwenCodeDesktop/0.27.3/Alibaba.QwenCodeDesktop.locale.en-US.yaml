ShortDescription: The desktop app of Qwen Code, the open-source AI coding agent.
Description: |-
  Qwen Code Desktop is the desktop application of Qwen Code, an open-source AI coding agent for the terminal, editor, desktop, browser, and chat. The desktop app bundles a Web Shell for managing agent sessions, channels, and approvals from a window instead of the terminal.
  Core features:
  - Agentic out of the box: Auto-Memory, Auto-Skills, SubAgents, Agent Teams, and MCP. Dynamic workflows with zero setup.
  - Open-source inside and out: the framework and the Qwen models are open-source and evolve together, with no vendor lock-in.
  - Web Shell: live session panels, token usage, pending approvals, and chat channels including Telegram, DingTalk, WeChat, and Feishu.
  - Multi-protocol: connects to OpenAI, Anthropic, Gemini, and Qwen APIs, third-party providers, or local models (Ollama / vLLM) at runtime.
  Sign in with a Qwen account, QwenCloud, Alibaba ModelStudio, a third-party provider, or a custom local endpoint.
