PackageIdentifier: Alibaba.QwenCodeDesktop
PackageVersion: 0.27.3
PackageLocale: zh-CN
ShortDescription: Qwen Code 桌面版，开源智能编码工具的桌面应用。
Description: |-
  Qwen Code Desktop 是 Qwen Code 的桌面应用。Qwen Code 是覆盖终端、编辑器、桌面、浏览器与聊天场景的开源智能编码工具。桌面应用内置 Web Shell，可在窗口中管理智能体会话、频道与审批，而不仅限于终端。
  核心特性：
  - 开箱即用的智能体能力：Auto-Memory、Auto-Skills、子智能体、智能体团队与 MCP，动态工作流零配置。
  - 内外皆开源：框架与 Qwen 模型共同开源、共同演进，无供应商锁定。
  - Web Shell：实时会话面板、Token 用量、待审批事项，以及 Telegram、钉钉、微信、飞书等聊天频道。
  - 多协议：可连接 OpenAI、Anthropic、Gemini 与 Qwen API、第三方提供商或本地模型（Ollama / vLLM），支持运行时切换。
  可使用 Qwen 账户、QwenCloud、阿里云 ModelStudio、第三方提供商或自定义本地端点登录。
