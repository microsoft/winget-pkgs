ReleaseNotes: |-
  群组协作与登录恢复优化
  体验优化
  - 群组消息展示：来自 IM 的群组任务消息会标明单聊或群聊来源及发送人；发回 IM 的群组成员消息将名称加粗并与正文分行显示。
  - 运行环境标识：创建 Waker 时，已选环境与环境列表会显示本机、远端或云电脑来源。
  问题修复
  - 修复群组与 Waker 安装同名 Skill，或 Skill 包含嵌套资源时，群组任务可能无法启动的问题。
  - 修复群组任务无法提交当前 Waker 已授权工作目录中的文件结果的问题，覆盖本机与跨设备执行。
  - 修复钉钉下载文件的回执可能指向已清理的临时文件，导致后续读取失败的问题。
  - 修复钉钉最终回复和表情更新遇到明确的暂时性拒绝时直接失败的问题，现在会进行有限重试。
  - 修复 @Waker 任务取消或接力时，已显示的过程内容被终止提示覆盖的问题。
  - 修复开启 IM 管理授权后，上传、安装或变更自身及其他 Waker 的 Skill 仍被错误拦截的问题。
  - 修复本机登录密钥丢失后无法直接重新登录的问题，并在凭据文件权限异常时提供对应处理提示。
