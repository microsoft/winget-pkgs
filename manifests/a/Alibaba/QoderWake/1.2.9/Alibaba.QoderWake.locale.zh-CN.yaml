ReleaseNotes: |-
  会话性能与更新体验优化
  体验优化
  - 长会话性能：优化工具调用较多时的输入与浏览体验，重新展开工具详情时保留阅读位置。
  - 版本更新：明确下载、准备更新与更新重启的操作提示，优化 Windows 慢速网络下的更新下载与断点续传体验。
  - 飞书配置：扫码创建机器人后可继续完成个人搜索授权，减少接入用户和群聊时的重复配置。
  - 钉钉文件发送：钉钉用户渠道可选择直接发送文件或以链接交付，默认保持链接方式。
  - 定时响应：单个 IM 配对支持最多 15 条定时规则，并在达到上限时提供更明确的提示。
  - 自动任务历史：支持删除自动任务的历史会话，不影响任务配置和后续调度。
  问题修复
  - 修复网络断连恢复时，远程任务可能重复执行的问题。
  - 修复企业微信配对审批通过后，回复仍停留在等待审批提示的问题。
  - 修复 IM 群组任务完成后，在页面继续追问可能无法启动的问题。
  - 修复公共项目新增本地目录后，已有会话无法访问新目录的问题。
  - 修复部分 Skill 更新后正文重复累积的问题。
  - 修复长文件名或长路径导致升级备份失败、应用无法启动的问题。
