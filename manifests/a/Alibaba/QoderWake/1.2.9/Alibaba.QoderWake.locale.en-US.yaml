ReleaseNotes: |-
  Conversation Performance and Update Improvements
  Improvements
  - Long Conversations: Improved typing and browsing performance in conversations with many tool calls, while preserving your reading position when reopening tool details.
  - App Updates: Clarified the download, preparation, and update-and-restart steps, and improved update downloads and resuming interrupted downloads on slow Windows connections.
  - Feishu Setup: After scanning to create a bot, you can continue with personal search authorization, reducing repeated setup when connecting users and group chats.
  - DingTalk File Delivery: DingTalk user channels can send files directly or deliver them as links. Link delivery remains the default.
  - Scheduled Responses: Each IM pairing now supports up to 15 scheduled rules, with clearer guidance when the limit is reached.
  - Automation History: You can now delete historical automation conversations without affecting the automation configuration or future scheduled runs.
  Bug Fixes
  - Fixed remote tasks potentially running more than once after recovering from a network disconnection.
  - Fixed WeCom replies remaining on the approval prompt after a pairing request was approved.
  - Fixed follow-up messages failing to start from the app after an IM group task was completed.
  - Fixed existing conversations being unable to access newly added local directories in a shared project.
  - Fixed duplicated content accumulating after some Skill updates.
  - Fixed long file names or paths causing upgrade backups to fail and preventing the app from starting.
