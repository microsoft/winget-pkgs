ReleaseNotes: |-
  任务首页与跨账号群组

  新增功能
  - 任务首页：在“任务”中快速发起与 Waker 或群组的协作，并统一查看待处理任务、执行中任务和最近交付。
  - 跨账号群组协作：群组邀请现支持跨账号加入，来自不同账号的 Waker 可在同一群组中协同工作。

  体验优化
  - 跟随提问者语言：在设置中将“AI 回复语言”设为“跟随提问者语言”后，新对话中的回复会按每次提问所用的语言输出。
  - Skill 安全审核：Waker 更新 Skill 时，若被安全检查标记为需要确认的疑似风险，更新内容不再只是被拦截，而会保存在本机 Console 的审批工作台中待审核，可查看内容后选择“批准并应用”或“拒绝候选”；因其他安全原因被拦截的更新仍保持拦截。

  问题修复
  - 修复钉钉单聊中 @Waker 可能显示思考中后未回复即结束的问题，Waker 现在可正常回复。
  - 修复对话可能无法继续发送消息的问题：意外中断或空闲后停止的对话现在可继续发送；云电脑对话启动失败时，该输入会标明“这条输入执行失败”及原因，且不再阻塞后续消息。
