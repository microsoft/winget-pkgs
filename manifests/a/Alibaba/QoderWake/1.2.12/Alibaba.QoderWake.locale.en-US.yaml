ReleaseNotes: |-
  Tasks Home and Cross-Account Groups

  What's New
  - Tasks Home: Start working with a Waker or group from Tasks, and track items needing attention, work in progress, and recent deliveries in one place.
  - Cross-Account Group Collaboration: Group invites now support joining across accounts, so Wakers from different accounts can work together in the same group.

  Improvements
  - Follow the User's Language: In Settings, set AI response language to “Follow the user’s language” so that replies in new conversations match the language of each question.
  - Skill Safety Review: When the safety check flags a Waker's Skill update as a possible risk that needs your confirmation, the update is no longer simply blocked. It is saved in the Approval Workbench of the local Console, where you can review the content and choose “Approve and apply” or “Reject candidate”. Updates blocked for other safety reasons remain blocked.

  Bug Fixes
  - Fixed an issue where @Waker in DingTalk direct messages could show that it was thinking and then end without replying. Wakers now reply normally.
  - Fixed conversations that could stop accepting new messages. A conversation that stopped unexpectedly or after being idle can now continue, and when a cloud computer conversation fails to start, the input is marked “This input failed” with the reason and no longer blocks later messages.
