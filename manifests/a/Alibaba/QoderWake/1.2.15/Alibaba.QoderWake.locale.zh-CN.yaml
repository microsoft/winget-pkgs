ReleaseNotes: |-
  Waker 跨设备迁移与首页群组任务优化
  新增功能
  - Waker 跨设备迁移：将 Waker 的配置、所选项目、记忆和对话任务迁移到同一账号下的另一台设备，并可在“迁移记录”中查看进度或重试；敏感凭据不会迁移。
  体验优化
  - 首页发起群组任务：在首页选择群组并发送任务描述，即可直接开始新的群组任务，无需进入群组后再次发送。
  问题修复
  - 修复通过 HTTP 访问的远程页面或弹窗中，复制内容可能失败却仍显示成功的问题。
  - 修复通过 IP 地址访问的 HTTP 页面安装连接器时，无法显示安装目标列表的问题。
  - 修复编辑自定义连接器时，追加参数或修改请求头后可能无法保存的问题。
  - 修复部分桌面升级失败后无法继续重试的问题；重试时会核实已完成的安装步骤，减少重复安装。
