ReleaseNotes: |-
  主动响应与自定义模型
  新增功能
  - IM 主动响应：在已开启觉醒模式的钉钉、飞书和企业微信群中，根据响应策略判断何时主动介入。支持主动设置和自主学习响应策略。
  - BYOK 模型接入：仅个人版支持。在设置中添加供应商模型或自定义模型服务，逐模型配置、校验、编辑和删除；接入的模型仅供本机使用。
  体验优化
  - 企业微信渠道支持配置响应方式：支持配置 @、指定真人的条件响应、语音和定时响应。
  - 群组执行详情：改善长任务的流式输出和状态刷新；本机执行的工具可在手动展开时查看本机保存的完整参数和结果。
  - 自定义连接器编辑：从“我的连接器”卡片直接编辑配置，并将改动同步到关联的 Waker。
  - 记忆管理：改善长期记忆的保存和读取，保护未保存的编辑内容，并支持在 IM 记忆详情中删除单条记忆。
  问题修复
  - 修复从 Console 继续 IM 会话时无法发送文件，以及部分钉钉附件下载失败的问题。
  - 修复企业微信历史消息读取中断后无法恢复，以及部分配对冲突和配置保存异常的问题。
  - 修复群组远程取消和执行结果状态不一致，以及部分工具审批反复出现的问题。
  - 修复部分 macOS 更新重启失败后待安装包丢失或恢复异常的问题。
