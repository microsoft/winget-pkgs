ReleaseNotes: |-
  Proactive Responses and Custom Models
  What's New
  - Proactive IM Responses: In DingTalk, Feishu, and WeCom groups with Awakening Mode enabled, response policies help Wakers decide when to step in. Supports manually configured and automatically learned response policies.
  - BYOK Models: Available in the Personal Edition only. Add provider models or custom model services in Settings, with per-model configuration, validation, editing, and deletion. These models are available only on the local machine.
  Improvements
  - WeCom Channel Response Modes: Configure mentions, conditions for selected human senders, voice, and scheduled responses.
  - Group Execution Details: Smoother streaming output and status updates for long-running tasks. Manually expand locally executed tools to view the full arguments and results saved on that machine.
  - Custom Connector Editing: Edit a custom Connector directly from its card in My Connectors and synchronize changes to its associated Wakers.
  - Memory Management: Improves long-term memory reads and saves, protects unsaved edits, and supports deleting individual memories from IM memory details.
  Bug Fixes
  - Fixed file sending when continuing an IM conversation in Console and some DingTalk attachment download failures.
  - Fixed interrupted WeCom history reads failing to recover, along with pairing conflicts and configuration save issues.
  - Fixed inconsistent remote cancellation and execution results in groups, and repeated tool approval prompts.
  - Fixed pending macOS update packages being lost or failing to recover after some update restart failures.
