ReleaseNotes: |-
  Cloud Computers and Group Task Improvements

  What's New
  - Cloud Computers: Purchase and configure a Cloud Computer in QoderWake, use it as a Waker runtime, and transfer files through the cloud desktop workspace.

  Improvements
  - Group Model Configuration: Configure context length and thinking effort for group members, with the selected settings applied when Group tasks run.
  - Running Automation Input: Add instructions to a running API-triggered automated task without waiting for the current turn to finish.
  - Group Task History: Load Group tasks as needed while keeping the latest task titles, settings, status, and message activity.
  - Remote Environment Management: Manage chat connections, automated work, knowledge, and Skills for Wakers on the selected device.
  - WeCom Authorization on Linux: Complete QR-code authorization from QoderWake when running on a Linux server without a graphical desktop.
  - Personalized Guidance: Memory and Skill notifications identify whether content was created or updated, and Personal Avatar conversations provide role-relevant starter questions.

  Bug Fixes
  - Fixed issues affecting pairing-code creation, pending-request filters, pairing recovery, and remote Skill installation status.
  - Fixed Connector imports that still required configuration and Connector saving over standard HTTP connections.
  - Fixed media downloads in DingTalk direct chats and cloud chats running on Linux.
  - Fixed interrupted installation and update recovery, along with credential-permission failures affecting account checks and application restart.
  - Fixed Windows historical conversations failing to resume, failed long-running tasks remaining active, and Personal Avatar learning not resuming after cancellation.
  - Fixed older Group task pages overwriting newer titles, settings, status, or message activity.
