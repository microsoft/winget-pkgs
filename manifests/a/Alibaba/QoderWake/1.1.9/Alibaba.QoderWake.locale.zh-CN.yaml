ReleaseNotes: |-
  Group 任务与远端管理体验优化

  体验优化
  - Group 模型配置：可为群组成员设置上下文长度和思考强度，并在 Group 任务运行时应用所选配置。
  - 运行中补充自动任务要求：API 触发的自动任务运行期间，可直接补充要求，无需等待当前轮次结束。
  - Group 任务记录：按需加载 Group 任务，并保留最新的任务标题、设置、状态和消息动态。
  - 远端环境管理：可按所选设备管理 Waker 的聊天接入、自动任务、知识和 Skill，包括云电脑环境。
  - Linux 企业微信授权：在无图形桌面的 Linux 服务器上运行时，可通过 QoderWake 完成企业微信扫码授权。
  - 个性化引导：Memory 和 Skill 通知会区分创建与更新结果，个人数字分身对话会展示与角色相关的推荐问题。

  问题修复
  - 修复配对码生成、待处理请求筛选、配对恢复及远端 Skill 安装状态相关问题。
  - 修复导入待配置 Connector 时被错误启用，以及普通 HTTP 环境下 Connector 无法保存的问题。
  - 修复钉钉单聊媒体文件和 Linux 云端聊天媒体文件下载失败的问题。
  - 修复安装或升级中断后的恢复异常，以及凭据权限故障影响账号查询和应用重启的问题。
  - 修复 Windows 历史会话无法继续、长任务失败后仍显示运行中，以及个人数字分身取消学习后无法继续的问题。
  - 修复加载较早的 Group 任务时，最新标题、设置、状态或消息动态可能被覆盖的问题。
