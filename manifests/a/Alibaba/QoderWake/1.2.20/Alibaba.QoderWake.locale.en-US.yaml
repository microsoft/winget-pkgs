ReleaseNotes: |-
  Context Usage View and Catch-Up for Scheduled Tasks
  What's New
  - Context usage and compaction: The conversation input box shows how much of the context window is in use. Click it to view details, and when a conversation on this device is idle, compact earlier messages to free up context for the rest of the conversation.
  - Catch-up window for scheduled tasks: Use "Catch up missed runs" in a scheduled task's advanced settings to set a catch-up window. If a scheduled time is missed, for example while the device is asleep, the most recent missed run starts automatically as long as it is still within the window.
  Bug Fixes
  - Fixed an issue where a task still running in the background could be run again or marked as failed after you left the conversation page.
  - Fixed an issue where a command moved to the background could end a task early without returning the command result.
  - Fixed an issue on some Windows devices where every command in a conversation failed to run.
