ReleaseNotes: |-
  Remote Skill Trials and Cross-Device Improvements
  Improvements
  - Remote Skill Trials: Start a conversation with a remote Waker directly from an installed Skill, with the selected Skill automatically referenced.
  - Model Information: Platform models can display FREE / NEW labels and idle, crowded, or busy status when provided by the current model catalog.
  - Environment Selection: All Environments prioritizes the current device and online environments, making available execution devices easier to find.
  Bug Fixes
  - Fixed missing Chinese names, descriptions, and icons for some Skills, and stale failure states remaining after installation succeeded.
  - Fixed DingTalk tasks failing to start because their working directory was misidentified, failed tasks remaining stuck on Starting, and model or default-target settings being assigned to the wrong Waker when editing multiple remote Wakers.
  - Fixed preselected knowledge bases not being bound after creating a remote Waker.
  - Fixed HTTP Connectors disappearing after creating a Waker, and Cloud Computers failing to import Connectors with Chinese names.
  - Fixed cross-device Personal Avatar conversations failing to read and update memories.
  - Fixed duplicate requests and timeouts when searching the remote task board or switching devices, and incorrect trigger sources in WakerFlow history.
