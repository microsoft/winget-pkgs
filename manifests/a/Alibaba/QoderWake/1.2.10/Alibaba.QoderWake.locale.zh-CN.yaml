ReleaseNotes: |-
  @Waker 体验与群组稳定性优化

  体验优化
  - @Waker 与自动任务配置：优化账号详情、授权确认和投递目的地的展示，补充未配置 IM 连接时的操作指引。
  - 飞书授权：已具备完整有效授权时减少重复扫码，并统一机器人搜索所需权限的申请。
  - 个人分身记忆：优化大量记忆下的读取与召回，降低内存开销，减少记忆规模较大时的读取失败。
  - 更新提示：明确更新后重启及恢复连接可能需要 3–5 分钟，并补充异常时的重试与修复指引。

  问题修复
  - 修复群共享文件在列表刷新后消失，以及群附件上传异常的问题。
  - 修复历史群组任务产生大量文件后，后台处理可能导致其他任务卡顿或超时的问题。
  - 修复任务失效后仍补发历史进展，以及钉钉个人分身在本人已回复后仍继续代答的问题。
  - 修复企业微信连续消息被误判为忙碌，以及会话启动失败后后续消息无法继续处理的问题。
  - 修复飞书远端配对审批与多 Waker 响应配置无法正常恢复的问题。
  - 修复 @Waker 职责冲突检测反复请求、误报结果不存在的问题。
  - 修复 Windows 下部分钉钉 @Waker 任务无法准备工作目录，以及部分旧钉钉登录配置导致文档查询被误拦截的问题。
  - 修复部分更新失败后无法正常恢复或重新安装，以及 Connector 自动续期导致会话启动失败的问题。
