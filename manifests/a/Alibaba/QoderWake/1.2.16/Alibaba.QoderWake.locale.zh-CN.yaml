ReleaseNotes: |-
  企业微信与钉钉授权简化及记忆批量删除
  体验优化
  - 企业微信授权更简单：配置企业微信机器人时，「消息 → 发送与获取消息」权限确认可用后即可完成授权，无需再额外开启通讯录权限或为此补扫二维码；通讯录、文档、邮件、日程等权限可按需开启。
  - 钉钉授权页面手动打开：在本机配置钉钉账号时，若浏览器未自动打开授权页面，可在配置提示中点击「打开授权页面」继续完成授权。
  - 记忆批量删除：IM 配对中的群通用记忆、群成员记忆和单聊记忆列表支持多选、全选和批量删除；部分记忆未能删除时，会提示成功与失败数量，并保留失败项便于核对。
  - 更准确的记忆保存：Waker 对话会更少将追问结果、临时进度或一次性操作限制自动保存为长期记忆；记忆更新通知只展示最终实际保存的变更，不再出现先创建后删除的中间结果。
  问题修复
  - 修复 Waker 执行长任务并定期检查进度时，容易过早中断当前对话的问题。
