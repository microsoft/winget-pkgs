ReleaseNotes: |-
  页面性能与 IM 稳定性优化
  体验优化
  - 页面性能：优化 @Waker 与自动任务页面的加载、切换和列表浏览体验，减少重复请求与后台刷新开销。
  - Waker 记忆：优化大量记忆下的会话启动体验，并完善升级后首次会话的历史记忆读取。
  - 飞书渠道配置：统一检测机器人所需权限，提供集中申请与重新检测入口，减少配置过程中反复查找权限的操作。
  - 群组附件：添加超过 100MB 的附件时提前提示大小限制。
  问题修复
  - 修复部分旧定时任务会话无法继续对话的问题。
  - 修复重启后部分 @Waker 消息无法正常响应的问题。
  - 修复部分已中断任务仍持续发送状态播报的问题。
  - 修复企业微信同时配置 Waker 与 WakerFlow 后，消息无法正常响应的问题。
  - 修复企业微信自动接入设置中，确认人可选但无法保存的问题，并补充首次接入指引。
  - 修复微信配对申请可误选多个 Waker 的问题。
