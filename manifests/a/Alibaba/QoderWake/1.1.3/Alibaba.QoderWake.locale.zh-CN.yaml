ReleaseNotes: |-
  云电脑与跨设备体验优化
  体验优化
  - 云电脑体验：支持选择或拖拽本地文件上传到云电脑，独立串流页也会自动适配窗口大小。
  - 远端设备管理：配对数据同步期间保持只读，审批可在后台继续；未绑定数字员工的远端设备也能正常管理钉钉渠道。
  - Skill 同步：异常文件会被跳过并显示原因，不再影响其他有效 Skill。
  - 知识库更新：上传状态会等待服务端确认，写入结果也会根据知识库的实际返回展示。
  - 个人分身学习：优化学习输入和结果提交方式，减少不必要的重试和失败。
  问题修复
  - 修复群协作 Skill 文档链接无法打开的问题。
  - 修复 Waker 头像修改失败或多处显示不一致的问题。
  - 修复 CN Windows 自动任务无法执行已授权钉钉写操作的问题。
  - 修复部分旧环境中的安装和图标显示问题。
  - 修复悬浮助手能力不可用时，完整 Wakey 页面无法打开的问题。
  - 修复所选模型不可用时被静默替换，而未给出明确提示的问题。
