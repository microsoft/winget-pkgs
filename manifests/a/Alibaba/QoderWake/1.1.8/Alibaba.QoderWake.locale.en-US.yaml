ReleaseNotes: |-
  Side Chats and Group Collaboration

  What's New
  - Side Chats: Start multiple temporary side chats while the main task is running to ask quick questions and review responses.

  Improvements
  - WeCom Group Chat Q&A: Connect Group Chat Q&A Assistants to internal WeCom groups, with support for adding experts, requesting help, returning answers, and handing questions to another expert.
  - Chat Access Rules: Edit access rules for the current connection and apply them when saved, with a warning before leaving unsaved changes.
  - Application Updates: After automatic installation completes, choose when to restart. The settings page also keeps checking, installation, and restart status synchronized.
  - Group Collaboration Experience: Unifies progress, continuation, and file-result display for Group tasks, and adds a direct details entry beside connection names.

  Bug Fixes
  - Fixed issues affecting Group-task follow-ups, cancellation, final delivery, image and historical-file analysis, and artifact display.
  - Fixed expert answers not returning to the requester and some repeated processing after authorization or pending-task recovery.
  - Fixed DingTalk self-chats being bound to the wrong conversation, triggered repeatedly, or receiving confirmation messages in the wrong chat.
  - Fixed WeCom pairing QR codes, authorization identities, and attachment filenames in some flows.
  - Fixed model context length and reasoning effort being reset when an automated task was saved again.
  - Fixed Waker knowledge bases being lost after sign-out, cloud-computer sign-in state failing to renew, and final replies missing across devices.
