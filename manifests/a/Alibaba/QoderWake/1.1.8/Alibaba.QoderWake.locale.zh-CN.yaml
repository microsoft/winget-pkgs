ReleaseNotes: |-
  侧边聊天与 Group 协作

  新增功能
  - 侧边聊天：主任务运行期间可同时开启多个临时侧边聊天，用于快速提问和查看回复。

  体验优化
  - 企业微信群聊答疑：群聊答疑助手可接入企业微信内部群，支持专家添加、求助、答复回流和转交。
  - 聊天接入规则：按当前连接编辑接入规则，保存后立即生效；存在未保存修改时，切换连接或关闭页面会给出提示。
  - 应用更新：自动安装完成后由用户选择何时重启；设置页同步显示检查、安装和待重启状态。
  - 群组协作体验：统一群组任务的进度、续接和文件结果展示，并在连接列表中增加详情入口。

  问题修复
  - 修复群组任务在续问、取消、最终结果、图片和历史文件分析及产物展示中的部分异常。
  - 修复专家答复未回流给提问者，或授权与待办恢复后可能重复处理的问题。
  - 修复钉钉本人单聊可能被错误绑定、重复触发，或成功提示发送到错误会话的问题。
  - 修复企业微信配对二维码、授权身份和附件文件名相关问题。
  - 修复自动任务重复保存后，上下文窗口和思考强度被重置的问题。
  - 修复退出登录后 Waker 知识库丢失、云电脑登录状态无法续期，以及跨设备最终回复缺失的问题。
