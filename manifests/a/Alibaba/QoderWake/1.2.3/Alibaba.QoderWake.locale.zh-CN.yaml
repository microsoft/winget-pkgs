ReleaseNotes: |-
  飞书个人分身与群组任务稳定性优化
  新增功能
  - 个人分身支持飞书：连接飞书个人账号，选择授权范围内的单聊、群聊和会议纪要用于个人分身创建。
  体验优化
  - 私聊历史召回：在 IM 私聊中查询同一连接和身份范围内本人参与的历史任务、讨论及本人的群成员记忆，并查看来源。
  - 自定义日期补学：个人分身支持按指定日期范围查找和补充学习聊天及会议资料。
  - 自动已读设置：钉钉个人分身可在档案中开启或关闭自动已读，关闭后仍可正常回复。
  - 记忆检索：优化关键词与语义检索、分页和来源说明，减少重复读取，提高历史记忆查询效率。
  - 响应对象配置：优化群组响应对象的加载、分组和滚动体验，避免个别群组加载缓慢阻塞整个列表。
  问题修复
  - 修复 Windows 群组并发任务因资源替换失败而无法启动，以及部分模型配置冲突导致任务启动失败的问题。
  - 修复仍在持续输出进度的长任务被误判超时，以及群组任务强制停止后无法继续的问题。
  - 修复群组 Skill 显示为空、资源过期后无法复用，以及异常插件影响其他正常 Skill 菜单和引用的问题。
  - 修复钉钉图片、文件上传和群聊图片读取失败，以及企业微信任务结果、附件未能返回原会话的问题。
  - 修复主动响应学习误将其他身份的请求或机器人自身消息归纳为响应策略的问题。
  - 修复部分连接器升级后的地址兼容与工具恢复，以及历史定时任务的调度兼容问题。
  - 修复群组 @ 提醒、任务看板和 IM 任务详情的未读状态不同步，以及企业微信会话中的姓名显示问题。
