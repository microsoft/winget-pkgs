ReleaseNotes: |-
  @Waker Connections to Waker Groups and WakerFlow Now in Public Beta
  What's New
  - More @Waker Response Options: Configure an @Waker conversation with one or more Wakers, Waker groups, and WakerFlows, then set its trigger methods and routing rules.
  Improvements
  - Lower Memory Usage: Multiple conversations, @Waker sessions, automated tasks, and WakerFlows reuse running processes to reduce resource usage.
  - Faster Conversation Startup: Reuses prewarmed runtime environments and reduces historical data scans, index validation, and repeated configuration loading to shorten startup waits for conversations and @Waker.
  - Faster Task Execution: Improves process reuse, message queries, and background reconciliation to reduce queuing, scanning, and main-thread blocking when multiple tasks run concurrently.
  - Feishu Group Response Configuration: Search current group members and bots directly, then configure conditional, voice, and scheduled responses.
  - Execution Details: Reasoning and tool details are collapsed by default while tasks run; adjust the display in Preferences.
  - Automated Task Artifact Delivery: Send artifacts from automated tasks to one or more paired @Waker conversations across different IM channels.
  - Automated Task Search: Search local and remote automated tasks by name.
  - Group Chat Q&A Display: Responses from Group Chat Q&A Specialists support Markdown rendering.
  Bug Fixes
  - Fixed WakerFlows executing more than once, errors during history recovery and result queries, and some flows failing to stop correctly.
  - Fixed Windows Bash, plugins, tool configurations, and parameterized custom Hooks sometimes failing to start in multi-conversation mode.
  - Fixed image and attachment delivery, scheduled task result delivery, and response rules after account switching in DingTalk, Feishu, and WeCom.
  - Fixed some Personal Avatar learning sources failing, identity fields behaving incorrectly, and memory sources being omitted.
  - Fixed Windows updates repeatedly downloading and sometimes failing during restart handoff or installation recovery.
