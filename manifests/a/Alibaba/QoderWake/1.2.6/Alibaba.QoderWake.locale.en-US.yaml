ReleaseNotes: |-
  WeCom Experience and Task Stability
  Improvements
  - WeCom setup: Improved bot authorization and added guidance on configuring access for multiple users and message permissions.
  - Conversation attachment downloads: Improved attachment downloads on slow networks, with automatic retry on network errors.
  Bug Fixes
  - Fixed issues with WeCom bot, group, and sender names, and with restoring message permissions after they expire or are revoked.
  - Fixed configuration sync issues and incorrect responding Wakers after changing the response mode of an IM connection.
  - Fixed stale @Waker pairings and incorrect group-owner permission errors after a Waker group was deleted or archived.
  - Fixed an issue where file names containing Chinese or special characters in a Git working directory could prevent some group tasks from starting.
  - Fixed inconsistent capitalization of labels in the model selector.
