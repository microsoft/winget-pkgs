ReleaseNotes: |-
  企业微信体验与任务稳定性优化
  体验优化
  - 企业微信配置：优化机器人授权流程，补充多人使用范围与消息权限的配置指引。
  - 会话附件下载：优化网络较慢时的附件下载体验，并在网络异常时自动重试。
  问题修复
  - 修复企业微信机器人名称、群名和发送者名称显示异常，以及消息权限失效后恢复异常的问题。
  - 修复 IM 连接调整响应方式后，配置同步异常或响应 Waker 不正确的问题。
  - 修复 Waker 群组删除或归档后，仍残留在 @Waker 配对中或被误报为群主权限不足的问题。
  - 修复 Git 工作目录中含中文或特殊字符的文件名导致部分群组任务无法启动的问题。
  - 修复模型选择器中标签大小写不一致的问题。
