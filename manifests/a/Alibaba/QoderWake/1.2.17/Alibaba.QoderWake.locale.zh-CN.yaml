ReleaseNotes: |-
  钉钉账号集中管理与模型选择优化
  体验优化
  - 钉钉账号集中管理：在统一区域管理钉钉账号与组织，操作立即生效，无需另行保存。
  - 模型选择更清晰：模型列表展示可用状态，并明确提示加载失败或暂无可用模型。
  - 自动任务配置更清晰：按触发、执行和交付分区配置，Waker 任务可选择仅在任务中查看结果或投递到 IM。
  问题修复
  - 修复通过文件或分享链接导入 Waker 后虽提示导入成功，但导入的 Waker 可能仍无法开始对话的问题。
  - 修复下载较大的更新时，更新弹窗可能提前提示超时，以及 Windows 上更新校验耗时较长时可能更新失败并恢复为旧版本的问题。
  - 修复消息中「7~14℃」这类用单个波浪号表示的范围被误显示为删除线的问题。
