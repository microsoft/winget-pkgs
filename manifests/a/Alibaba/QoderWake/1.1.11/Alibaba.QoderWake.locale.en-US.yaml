ReleaseNotes: |-
  Automated Task Delivery and Model Settings
  Improvements
  - Automated Task Delivery: Configure IM reports for local automated tasks to send text, image, and file results to paired DingTalk, Feishu, or WeCom conversations.
  - Model Settings: Set each model's default context window, thinking effort, and visibility in Settings.
  - Personal Avatar Profiles: View and edit contact and group-chat profiles so your Personal Avatar can use communication preferences and group context when replying.
  - Organization Service Accounts: Run Wakers and tasks with an organization Service Account, with resources isolated by Service Account and organization.
  - Personal Avatar Learning: Updates information about the same contact or group using existing memories and profiles, while preserving manual edits.
  - Memory Updates: Saves memories in the background after conversations and automated tasks reply, with update notices shown under the corresponding reply. Automatic cleanup that deletes or replaces existing memories requires review.
  - Quoted DingTalk Replies: Ordinary direct-chat and group-chat replies support quoting the original message, without repeating names in group mentions.
  Bug Fixes
  - Fixed supplementary requests interrupting a running @Waker task.
  - Fixed issues with IM activation retries, pending-approval recovery, and pairing-status synchronization across devices.
  - Fixed DingTalk connections appearing connected after sign-in expired, and failures when remotely leaving the last organization.
  - Fixed inconsistencies between CLI, document, and Memory-page content, and memory-document edits affecting other existing content.
  - Fixed Waker knowledge-base bindings failing to load after switching connection environments.
  - Fixed some macOS upgrade restart failures and Windows historical-task recovery failures.
  - Fixed display issues with model names, description popovers, and Wakey feedback screenshots.
