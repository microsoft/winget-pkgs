ReleaseNotes: |-
  体验优化
  - 自动任务结果推送：为本地自动任务配置 IM 汇报，将文字、图片和文件结果发送到已配对的钉钉、飞书或企业微信会话。
  - 模型设置：在设置页统一配置各模型的默认上下文窗口、思考强度和显示状态。
  - 个人数字分身画像：查看和编辑联系人、群聊画像，让分身结合沟通偏好和群聊背景回复。
  - 组织服务账号：使用组织服务账号运行 Waker 和任务，资源按服务账号与组织隔离。
  - 分身学习：结合已有记忆和画像持续更新同一联系人或群聊的信息，保留人工编辑的内容。
  - 记忆更新：对话和自动任务回复后在后台保存记忆，更新提示显示在对应回复下；自动整理涉及删除或替换已有记忆时需审核。
  - 钉钉引用回复：普通单聊和群聊回复支持引用原消息，群聊中的 @ 提醒不再重复显示姓名。
  问题修复
  - 修复向运行中的 @Waker 补充要求时，当前任务可能被中断的问题。
  - 修复 IM 激活重试、待处理审批恢复及跨设备配对状态同步相关问题。
  - 修复钉钉登录失效后仍显示已连接，以及远程退出最后一个组织失败的问题。
  - 修复 CLI、文档和记忆页内容不一致，以及编辑记忆文档可能影响其他已有内容的问题。
  - 修复切换连接环境后无法读取 Waker 知识库绑定的问题。
  - 修复部分 macOS 升级重启和 Windows 历史任务恢复失败的问题。
  - 修复模型名称、说明浮层及小管家反馈截图的显示问题。
