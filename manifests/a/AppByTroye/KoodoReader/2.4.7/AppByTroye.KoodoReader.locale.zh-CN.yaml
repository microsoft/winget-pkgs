ReleaseNotes: |-
  新增
  - 新增 OCR 插件功能，请前往设置-插件
  - 新增对 caj, djvu, xps, chm, doc, rtf, pptx, ppt, ofd, djv, oxps, ofd 格式的支持
  - 阅读页面支持沉浸式标题栏，阅读时将自动隐藏标题栏
  - 阅读选项支持分组展示
  - 新增图书合集和分组功能，支持将多本书合并展示和管理
  - 支持调节双页模式下的页间距，请前往右侧阅读选项-排版
  - 支持从右往左翻页，请前往右侧阅读选项-排版
  - 支持导出图书包功能，将把图书文件及其笔记，高亮，书签，生词一同打包为一个新文件，然后方便分享给其他人和在新设备上导入
  - 卸载时增加询问是否清除全部数据
  - 支持解析图书文件中的 ISBN，出版日期，修改日期，语言等信息
  - 适配 EPUB, MOBI, AZW3 格式的漫画，支持双页模式和连续滚动
  - 新增自动阅读功能，将按照指定的速度自动滚动页面，请点击右上角的辅助阅读按钮
  - 新增清理临时缓存和清理 TTS 缓存的功能，请前往设置-数据
  - 打开外部链接之前增加弹窗提示
  - 支持隐藏文字版 PDF 的内置背景
  - 支持清除所有快捷键
  - 优化 TXT 分章规则
  -（移动版）阅读设置分为基础设置和高级设置，同时高级设置支持分组展示
  -（移动版）增加对 MEGA 网盘的支持
  -（移动版）新增自动调节阅读亮度的选项
  -（移动版）原生 PDF 阅读器和漫画阅读器支持音量键翻页
  -（移动版）设置新增数据管理，支持展示缓存和全部数据大小
  -（移动版）支持调节自动清理临时缓存的阈值大小，请前往设置-数据管理
  -（移动版）支持清理 TTS 缓存，请前往设置-数据管理
  -（移动版）翻页动画新增覆盖动画
  -（移动版）按照图书名排序支持按照数字的自然大小排序
  -（移动版）新增对 djvu, xps, chm, doc, rtf, pptx, ppt, ofd, djv, oxps, ofd 格式的支持
  -（移动版）新增图书合集和分组功能，支持将多本书合并展示和管理
  -（移动版）支持调节双页模式下的页间距，请前往右侧阅读选项-排版
  -（移动版）支持从右往左翻页，请前往右侧阅读选项-排版
  -（移动版）支持解析图书文件中的 ISBN，出版日期，修改日期，语言等信息
  -（移动版）适配 EPUB, MOBI, AZW3 格式的漫画，支持双页模式和连续滚动
  -（移动版）支持隐藏文字版 PDF 的内置背景
  -（移动版）优化 TXT 分章规则
  修复
  - 修复部分图书内容在单页模式和双页模式下被遮挡的问题
  - 修复部分 CBZ 和 CBR 格式图书的导入和渲染问题
  - 修复部分 AI 提供商无法获取模型列表的问题
  - 修复 Docker 版 OPDS 的目录遍历的安全漏洞
  -（移动版）修复锁屏之后，无法长时间在后台听书的问题
  -（移动版）修复原生 PDF 阅读器和漫画阅读器书签列表为空的问题
  -（移动版）修复无法设置文字规则的适用范围的问题
  -（移动版）修复部分图书内容在单页模式和双页模式下被遮挡的问题
  -（移动版）修复部分 CBZ 和 CBR 格式图书的导入和渲染问题
  -（移动版）修复部分 AI 提供商无法获取模型列表的问题
  Tip
  我们还提供了高速下载镜像，您也可以从 自托管镜像 下载此版本的安装包
