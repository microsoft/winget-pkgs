ReleaseNotes: |-
  新增
  - 阅读统计支持按照图书和时间范围进行筛选
  - 支持创建 markdown 和 HTML 格式的笔记
  - 阅读统计新增阅读时长排行榜
  - 听书插件增加对 naturalVoiceSapiAdapter 的支持，现在您可以调用本地的微软神经网络语音包进行听书
  - 新增本地聚合词典功能，支持将本地导入的词典的查询结果聚合之后一起展示
  - 本地词典增加对更多格式的支持，包括：StarDict / DICT / Slob / BGL
  - 自动阅读，速读模式，阅读尺，段落模式支持按图书设置
  - 增加自动阅读的滚动速度调节范围
  - 支持单独删除回收站中的某一本书
  - 漫画等格式双页模式下支持从偶数页开始渲染
  - 阅读窗口宽度小于 900px 时自动切换为单页模式
  - 词典，翻译，问书，笔记窗口支持 ESC 快捷键
  - 摸鱼模式下窗口支持拖动
  - 新增仿真图书封面功能，请前往设置-外观开启
  - 页脚新增当前章节字数和剩余电量
  - 新增文本着色功能，请在右上角的阅读辅助中开启
  - AI 问书支持自动跳转到最新的位置
  - 涂鸦功能支持设置虚线
  - 优化 Djvu 格式的渲染性能
  -（移动版）支持导入和导出本地的笔记，高亮和查词历史
  -（移动版）支持导入桌面端导出的 KDZ 格式的图书包
  -（移动版）支持使用蓝牙键盘进行翻页
  -（移动版）增加对 OCR API 的支持，请前往设置-API 设置添加
  -（移动版）新增网页翻译和网页词典功能，支持调用网页版百度翻译，有道词典等，请前往设置-API 设置
  -（移动版）页眉增加显示当前章节字数
  -（移动版）书架支持导入本地图书到书架，请点击上方的三个点按钮
  -（移动版）自动阅读，速读模式，阅读尺，段落模式支持按图书设置
  -（移动版）阅读统计支持按照图书和时间范围进行筛选
  -（移动版）支持创建 markdown 和 HTML 格式的笔记
  -（移动版）阅读统计新增阅读时长排行榜
  -（移动版）新增文本着色功能
  -（移动版）AI 问书支持自动跳转到最新的位置
  -（移动版）优化 Djvu 格式的渲染性能
  修复
  - 修复触控板翻页太快的问题
  - 修复仿真翻页动画效果消失的问题
  - 修复应用思源黑体之后图书内容空白的问题，需要删除字体之后重新下载
  - 修复部分 epub 图书中图片不显示的问题
  - 修复图书竖排时从右往左翻页不生效的问题
  - 修复部分 PDF 图书在滚动模式下显示不全的问题
  - 修复部分 TXT 图书导航问题
  - 修复部分情况下列表模式和封面模式 UI 异常问题
  - 修复无法双击打开文件管理器中的图书的问题
  - 修复部分 MDX 词典查询之后导致软件卡死的问题
  - 修复使用替换规则和删除规则之后，听书时文字不高亮的问题
  -（移动版）修复图书进度更新不及时的问题
  -（移动版）修复无法取消设置的背景图片的问题
  -（移动版）修复部分情况下书架中显示的图书数量和实际不符的问题
  -（移动版）修复图书合集无法从首页隐藏的问题
  -（移动版）修复双页模式下页数显示的问题
  -（移动版）修复原生 PDF 阅读器和漫画阅读器的目录中页数显示问题
  -（移动版）修复应用思源黑体之后图书内容空白的问题，需要删除字体之后重新下载
  -（移动版）修复部分 epub 图书中图片不显示的问题
  -（移动版）修复图书竖排时从右往左翻页不生效的问题
  -（移动版）修复部分 PDF 图书在滚动模式下显示不全的问题
  -（移动版） 修复部分 TXT 图书导航问题
  -（移动版）修复使用替换规则和删除规则之后，听书时文字不高亮的问题
  Tip
  我们还提供了高速下载镜像，您也可以从 自托管镜像 下载此版本的安装包
