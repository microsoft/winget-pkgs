ReleaseNotes: |-
  新增
  - 支持导出笔记，高亮，生词为 JSON 格式
  - 支持重新导入 JSON 和 CSV 格式的笔记，高亮，生词，请前往设置-数据
  - 优化包含大量笔记、高亮时的渲染速度，不再出现卡顿问题
  - 支持使用 AI 从文件名中解析出图书名和作者名，请在图书上右键-编辑图书
  - 支持使用 AI 在导入图书时，从文件名中解析出图书名和作者名，请前往设置-通用
  - 支持缓存全文翻译和 OCR 的结果，下次打开图书直接从缓存读取
  - 新增段落模式，阅读尺和速读模式，请在右侧阅读选项面板开启
  - 支持流式解析 CBZ 和 CBT 图书，不再需要把整本书写入内存，大幅提升图书导入和打开速度
  - 在线匹配图书元数据，新增出版时间，ISBN，评分等信息
  - 复制图书文字支持保留文字的原始样式
  - 新增 100 张精选的图书和应用背景图片，请前往设置-背景图片
  - 新增 11 本公有领域的词典，请前往设置-本地词典
  - 批量导出图书新增导出进度
  - 支持使用 book key 搜索图书
  - 重新支持自定义听书插件，同时增加安全警告
  - 实验性的支持总页数功能，请在右侧阅读选项面板开启
  - 图书目录中增加显示页数
  - 官方 AI 词典支持更多的目标语言
  - 点击书中目录跳转之后新增返回原处按钮
  -（移动版）iOS 版支持调用系统词典，系统翻译和系统 OCR，请前往设置-三方服务
  -（移动版）优化大体积 CBZ 文件导入和打开速度
  -（移动版）CBZ 格式新增专门的漫画模式，支持流式渲染
  -（移动版）支持批量下载图书，请点击首页顶部的三个点-批量操作
  -（移动版）优化阅读统计的图表 UI
  -（移动版）支持自定义翻译和听书 API，请前往设置-API 设置
  -（移动版）点击书中目录跳转之后新增返回原处按钮
  -（移动版）增加字体大小的调节范围
  -（移动版）支持修改文字版 PDF 转文本的段落间距阈值和标题大小阈值
  -（移动版）优化包含大量笔记、高亮时的渲染速度，不再出现卡顿问题
  -（移动版）支持使用 AI 从文件名中解析出图书名和作者名，请长按图书-编辑
  -（移动版）支持使用 AI 在导入图书时，从文件名中解析出图书名和作者名，请前往设置-通用选项
  -（移动版）支持缓存全文翻译和 OCR 的结果，下次打开图书直接从缓存读取
  -（移动版）新增段落模式，阅读尺和速读模式，请在图书页面的设置开启
  -（移动版）在线匹配图书元数据，新增出版时间，ISBN，评分等信息
  -（移动版）新增 100 张精选的图书背景图片
  -（移动版）支持使用 book key 搜索图书
  -（移动版）实验性的支持总页数功能，请前往设置-阅读选项
  -（移动版）图书目录中增加显示页数，请先启用总页数功能
  -（移动版）官方 AI 词典支持更多的目标语言
  修复
  - 修复使用阿里云盘作为数据源时，提示云端不存在图书的问题（阿里云盘 API 变动导致）
  - 修复文言文词典不返回发音的问题
  - 修复词典窗口固定右侧之后的单词发音不匹配的问题
  - 修复听书时删除和替换规则失效的问题
  - 修复无法从云端导入图书的问题
  - 修复无法双击文件夹中的图书导入的问题
  -（移动版）修复部分情况下，自定义字体不生效的问题
  -（移动版）修复安卓版部分情况下返回键失效的问题
  -（移动版）修复部分情况下获取的听书文本异常问题
  -（移动版）修复横屏下 iOS 版字体大小问题
  -（移动版）修复双页模式下 PDF 渲染问题
  -（移动版）修复使用阿里云盘作为数据源时，提示云端不存在图书的问题（阿里云盘 API 变动导致）
  -（移动版）修复文言文词典不返回发音的问题
  -（移动版）修复听书时删除和替换规则失效的问题
  Tip
  我们还提供了高速下载镜像，您也可以从 自托管镜像 下载此版本的安装包
