ReleaseNotes: "These are the release notes for ActivityWatch version v0.14.1.\n\n**New to ActivityWatch?** Check out the [website](https://activitywatch.net) and the [README](https://github.com/ActivityWatch/activitywatch/blob/master/README.md).\n\n# Installation\n\nSee the [getting started guide in the documentation](https://docs.activitywatch.net/en/latest/getting-started.html).\n\n# Downloads\n\n## Classic distribution\n\n • [**Windows**](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-v0.14.1-windows-x86_64-setup.exe) (.exe installer)\n • **macOS**：[Intel](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-v0.14.1-macos-x86_64.dmg) | [Apple Silicon](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-v0.14.1-macos-arm64.dmg) (.dmg)\n • **Linux**：[.zip](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-v0.14.1-linux-x86_64.zip) | [.AppImage](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-linux-x86_64.AppImage) | [.deb](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-v0.14.1-linux-x86_64.deb)\n\n## Tauri distribution (experimental — native Wayland support on Linux)\n\n • [**Windows**](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-tauri-v0.14.1-windows-x86_64-setup.exe) (.exe installer)\n • **macOS**：[Intel](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-tauri-v0.14.1-macos-x86_64.dmg) | [Apple Silicon](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-tauri-v0.14.1-macos-arm64.dmg) (.dmg)\n • **Linux**：[.AppImage](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-tauri-0.14.1-linux-x86_64.AppImage) | [.zip](https://github.com/ActivityWatch/activitywatch/releases/download/v0.14.1/activitywatch-tauri-v0.14.1-linux-x86_64.zip)\n\n# Support ActivityWatch\n\nActivityWatch is free and open source, with no feature gates. If it is useful to you, [AW Pro](https://activitywatch.net/subscribe/) is an optional subscription that funds ongoing development.\n\n# Contributors\n\nThanks to everyone who contributed to this release:\n\n@0xbrayo, @AbdulGoodLooks, @erikbjare, @Gabriel-Dalton, @kvnloo, @TimeToBuildBob\n\n# Changelog\n\nChanges since [v0.14.0](https://github.com/ActivityWatch/activitywatch/releases/tag/v0.14.0):\n\n\n## 📦 activitywatch\n\n### ✨ Features (3)\n\n • feat(research)：ship an optional geography-free category preset ([#1474](https://github.com/ActivityWatch/activitywatch/issues/1474)) ([`21142d0`](https://github.com/ActivityWatch/activitywatch/commit/21142d0))\n • feat(scripts)：automated screenshots with realistic demo data ([#1500](https://github.com/ActivityWatch/activitywatch/issues/1500)) ([`bbcc9b8`](https://github.com/ActivityWatch/activitywatch/commit/bbcc9b8))\n • feat(changelog)：add a Support ActivityWatch section to bundle release notes ([#1486](https://github.com/ActivityWatch/activitywatch/issues/1486)) ([`45ae1c8`](https://github.com/ActivityWatch/activitywatch/commit/45ae1c8))\n\n### 🐛 Fixes (7)\n<details><summary>Click to expand</summary>\n<p>\n\n • fix(release)：don't bundle libwayland into the Tauri AppImage, and gate it ([#1509](https://github.com/ActivityWatch/activitywatch/issues/1509)) ([`2251b6e`](https://github.com/ActivityWatch/activitywatch/commit/2251b6e))\n • fix(build)：drop stale Tauri bundles, and stop packaging from failing silently ([#1512](https://github.com/ActivityWatch/activitywatch/issues/1512)) ([`df22b2e`](https://github.com/ActivityWatch/activitywatch/commit/df22b2e))\n • fix(package)：Linux Tauri zip: drop move-to-aw-modules.sh and the loose awatcher, rewrite README ([#1508](https://github.com/ActivityWatch/activitywatch/issues/1508)) ([`ed54fd7`](https://github.com/ActivityWatch/activitywatch/commit/ed54fd7))\n • fix(make)：use pip's freeze format in the uninstall target ([#1505](https://github.com/ActivityWatch/activitywatch/issues/1505)) ([`017d703`](https://github.com/ActivityWatch/activitywatch/commit/017d703))\n • fix(linux)：stop bundling host-ABI libraries in the Qt bundle ([#1484](https://github.com/ActivityWatch/activitywatch/issues/1484)) ([`0ef9191`](https://github.com/ActivityWatch/activitywatch/commit/0ef9191))\n • fix(changelog)：use /commits/`<tip>` when submodule is new to the release ([#1504](https://github.com/ActivityWatch/activitywatch/issues/1504)) ([`81885e2`](https://github.com/ActivityWatch/activitywatch/commit/81885e2))\n • fix(changelog)：use /commits/`<tip>` when submodule is new to the release ([#1496](https://github.com/ActivityWatch/activitywatch/issues/1496)) ([`d02cc21`](https://github.com/ActivityWatch/activitywatch/commit/d02cc21))\n\n</p>\n</details>\n\n### 🔨 Misc (6)\n\n • chore：migrate issue templates to issue forms ([#1482](https://github.com/ActivityWatch/activitywatch/issues/1482)) ([`0c4c185`](https://github.com/ActivityWatch/activitywatch/commit/0c4c185))\n • docs(contributing)：remove the dead GitPOAP section ([#1513](https://github.com/ActivityWatch/activitywatch/issues/1513)) ([`6a00b79`](https://github.com/ActivityWatch/activitywatch/commit/6a00b79))\n • docs(citation)：update to v0.14.0 and 2026 ([#1514](https://github.com/ActivityWatch/activitywatch/issues/1514)) ([`94eceed`](https://github.com/ActivityWatch/activitywatch/commit/94eceed))\n • test(query-parity)：assert the startup poll actually retried ([#1472](https://github.com/ActivityWatch/activitywatch/issues/1472)) ([`17d0088`](https://github.com/ActivityWatch/activitywatch/commit/17d0088))\n • docs(readme)：repair release workflow badge URL ([#1489](https://github.com/ActivityWatch/activitywatch/issues/1489)) ([`46c8ca8`](https://github.com/ActivityWatch/activitywatch/commit/46c8ca8))\n • docs(readme)：v0.14.0 screenshots ([#1501](https://github.com/ActivityWatch/activitywatch/issues/1501)) ([`97db8ff`](https://github.com/ActivityWatch/activitywatch/commit/97db8ff))\n\n*(excluded 10 less relevant [commits](https://github.com/ActivityWatch/activitywatch/compare/v0.14.0...v0.14.1))*\n\n## 📦 aw-server\n\n### ✨ Features (1)\n\n • feat(auth)：optional API key authentication, matching aw-server-rust ([#182](https://github.com/ActivityWatch/aw-server/issues/182)) ([`fc2f28c`](https://github.com/ActivityWatch/aw-server/commit/fc2f28c))\n\n### 🐛 Fixes (5)\n\n • fix(api)：invalidate the heartbeat cache when events are inserted ([#178](https://github.com/ActivityWatch/aw-server/issues/178)) ([`384b122`](https://github.com/ActivityWatch/aw-server/commit/384b122))\n • fix(import)：return descriptive error messages and roll back failed imports ([#176](https://github.com/ActivityWatch/aw-server/issues/176)) ([`72e3007`](https://github.com/ActivityWatch/aw-server/commit/72e3007))\n • fix(api)：replace the merged heartbeat event by id, not the latest by timestamp ([#177](https://github.com/ActivityWatch/aw-server/issues/177)) ([`ce55bbd`](https://github.com/ActivityWatch/aw-server/commit/ce55bbd))\n • fix(rest)：return 400 instead of 500 for malformed client input ([#175](https://github.com/ActivityWatch/aw-server/issues/175)) ([`5e3c0de`](https://github.com/ActivityWatch/aw-server/commit/5e3c0de))\n • fix(api)：keep created and data when creating a bucket over REST ([#180](https://github.com/ActivityWatch/aw-server/issues/180)) ([`4851fea`](https://github.com/ActivityWatch/aw-server/commit/4851fea))\n\n### 🔨 Misc (1)\n\n • test(import)：undo monkeypatches before cleanup deletes buckets ([#186](https://github.com/ActivityWatch/aw-server/issues/186)) ([`511639b`](https://github.com/ActivityWatch/aw-server/commit/511639b))\n\n*(excluded 2 less relevant [commits](https://github.com/ActivityWatch/aw-server/compare/5bf925f...511639b))*\n\n## 📦 aw-server-rust\n\n### 🐛 Fixes (16)\n<details><summary>Click to expand</summary>\n<p>\n\n • fix(android)：open the JNI datastore exactly once ([#801](https://github.com/ActivityWatch/aw-server-rust/issues/801)) ([`faeded2`](https://github.com/ActivityWatch/aw-server-rust/commit/faeded2))\n • fix(query-cache)：charge timestamps-only in key weight, not query text ([#799](https://github.com/ActivityWatch/aw-server-rust/issues/799)) ([`4c1cda9`](https://github.com/ActivityWatch/aw-server-rust/commit/4c1cda9))\n • fix(aw-server)：dedup re-imports against the privacy-filtered form of events ([#768](https://github.com/ActivityWatch/aw-server-rust/issues/768)) ([`9793c91`](https://github.com/ActivityWatch/aw-server-rust/commit/9793c91))\n • fix(datastore)：infer schema version when a restored DB has user_version 0 ([#776](https://github.com/ActivityWatch/aw-server-rust/issues/776)) ([`96f4113`](https://github.com/ActivityWatch/aw-server-rust/commit/96f4113))\n • fix(export)：prefix CSV data keys that collide with id/timestamp/duration ([#795](https://github.com/ActivityWatch/aw-server-rust/issues/795)) ([`344f476`](https://github.com/ActivityWatch/aw-server-rust/commit/344f476))\n • fix(dirs)：restore %LOCALAPPDATA% on Windows, migrate v0.14.0 Roaming data, pin paths ([#791](https://github.com/ActivityWatch/aw-server-rust/issues/791)) ([`dc01d74`](https://github.com/ActivityWatch/aw-server-rust/commit/dc01d74))\n • fix(server)：warn at startup when the web UI has no index.html ([#794](https://github.com/ActivityWatch/aw-server-rust/issues/794)) ([`d059a4c`](https://github.com/ActivityWatch/aw-server-rust/commit/d059a4c))\n • fix(aw-server)：re-importing an updated export replaces events in place ([#766](https://github.com/ActivityWatch/aw-server-rust/issues/766)) ([`bb7f769`](https://github.com/ActivityWatch/aw-server-rust/commit/bb7f769))\n • fix(query)：remove duplicate clippy allow attributes on parser module ([#779](https://github.com/ActivityWatch/aw-server-rust/issues/779)) ([`22a77dc`](https://github.com/ActivityWatch/aw-server-rust/commit/22a77dc))\n • fix(datastore):"
