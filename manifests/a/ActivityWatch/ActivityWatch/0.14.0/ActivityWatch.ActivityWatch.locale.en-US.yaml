ReleaseNotes: |-
  Huzzah! v0.14.0 is finally here! 🎉
  Almost two years since v0.13.2, and eight betas later. This is a big one: faster, steadier, a new desktop app, and an Android app that has caught up. And syncing between your devices works, local-first, with whatever sync tool you already use: it's still early and opt-in, with a few rough edges (see Sync below, or the announcement). More than 30 people contributed.
  Since the last stable release, ActivityWatch also passed 1 million downloads, and it's now downloaded over 10,000 times a week. Thank you!
  Read more: the announcement · the full changelog (about 1,000 changes, too long for this page)
  Summary
  - ⚡ Much faster, especially once you have years of data: dashboards load day by day and cache finished days, so long ranges no longer time out and repeat visits are near instant
  - 🐛 Steadier all round: crashed watchers restart on their own, a macOS memory leak and crash are fixed, and a long tail of annoyances is gone
  - 🔄 Sync between your devices works. It is local-first: no ActivityWatch server, no account. Point it at a folder you already sync with Syncthing, Dropbox or anything else, and each device's data shows up on the others. It is still rough in places (it takes more disk space than it should, and setup is manual), so it is opt-in (how to set it up)
  - 👀 See all your devices together: the Activity view can now merge any set of devices into one view
  - 📱 Android caught up: ActivityWatch for Android 0.14 shipped last month, its first stable release since 2023, with far fewer crashes and the same sync built in
  - 🖥️ A new desktop app built on Tauri: same features as the classic one and lighter, but less battle-tested so far, so the classic app ships too and stays the default
  - 🌐 A refreshed web UI: a better timeline, custom date ranges, a work-time report, billable hours export, and category sets for switching between rule profiles
  - 🌍 ActivityWatch now speaks Swedish, German, Ukrainian, Russian and Chinese
  - 🔒 More control over what gets stored: filter sensitive window titles before they ever reach the database
  - 🛡️ For those who want it: put an API key on the server
  - 🍎 macOS: signed and notarized builds for Apple Silicon and Intel, and browser URLs are tracked properly again
  - 🐧 Linux: Wayland support out of the box in the new app, and arm64 builds
  - 🤖 For the AI crowd: one canonical query that returns clean, categorized events, so an assistant can answer questions about your time without a custom integration (agents and AI)
  - And a lot more...
