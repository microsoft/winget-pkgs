ShortDescription: Dictation and meeting notes for Windows, with speech recognition that runs on your PC.
Description: |-
  Legato is a dictation app and meeting notetaker for Windows. Hold a shortcut, speak, and the text lands where you're typing. Record a meeting and get a transcript with each voice told apart.
  Speech recognition runs on your computer with models such as Parakeet and Whisper, on the GPU through Vulkan on x64, so what you say stays on the PC. Summaries, transforms and Ask use an AI provider only if you add one yourself.
