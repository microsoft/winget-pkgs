ShortDescription: Office suite for Word documents, PDFs, Excel spreadsheets and PowerPoint slides.
Description: |-
  TriEdit edits documents, PDFs, spreadsheets and presentations in one app, in the standard formats: .docx, .doc and
  .rtf; .pdf; .xlsx, .xls and .csv; .pptx and .ppt. Documents get a Word-style ribbon, real pages, styles, tables,
  pictures, charts, headers and footers, spelling and grammar checks and offline dictation. Spreadsheets have a
  formula engine, sorting, filters and charts; presentations have themes, animations and a slide show. Everything
  exports to PDF.
