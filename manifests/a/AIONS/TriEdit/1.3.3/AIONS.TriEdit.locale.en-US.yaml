ReleaseNotes: |-
  Format Shape has colour pickers for the fill, outline and text colours (theme colours with shades, standard colours, recent colours and a custom colour). The text in a shape can have its own font, size, bold, italic and underline, with a live preview, in documents and on slides. The Windows taskbar shows the TriEdit icon instead of a blank page.
