ReleaseNotes: |-
  Hello everyone, I am gz83, a collaborator on the Thorium browser project. Since Alex is currently unavailable to update Thorium, I have temporarily taken over the task, and this release is a major update to the stable version of M156. The code is available here:
  https://github.com/gz83/thorium
  I think the current version is quite stable, and I'm only marking it as BETA because it hasn't been officially released by Alex yet.
  Welcome to use Thorium. Please submit any issues you encounter in the main Thorium repository using the issue template:
  https://github.com/Alex313031/thorium/issues
  Here are the release notes for this release:
  (Due to space limitations, not all changes are fully summarized.)
  Updated Chromium from 154.0.8037.45 to 156.0.8078.28.
  Thorium highlights
  - Updated bundled uBlock Origin to 1.75.0, retaining offline installation for new profiles.
  - Improved icon switching across the browser UI and WebUI. Thorium icons now use separate resources, preserving Chromium's rounded and legacy icons when --disable-thorium-icons is used.
  - Updated Android extensions and on-device DevTools for M156, including a fix for the missing extension-feature declaration that caused Android compilation errors.
  - Adapted the legacy download shelf to Chromium's updated active-content view API.
  - Fixed V8 snapshot dependencies for Windows SSE2 installer packaging and macOS framework resources, resolving GN generation errors encountered during cross-compilation.
  Chromium highlights
  - JPEG XL decoding is enabled by default, using the Rust-based decoder with support for progressive images, HDR and animation.
  - Expanded CSS support, including symbols(), margin-trim, random() and :navigation-source, for custom counters, cleaner layouts and navigation feedback.
  - More capable JavaScript modules: import text directly with with { type: "text" }, and retry module fetches after network failures instead of permanently caching those failures.
  - Expanded WebCrypto algorithms, adding ML-KEM, ML-DSA, X-Wing and ChaCha20-Poly1305.
  - Inherited upstream stability and memory-safety fixes, including a dangling-reference fix in DOM attribute cloning.
