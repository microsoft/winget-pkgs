ReleaseNotes: |-
  Hello everyone, I am gz83, a collaborator on the Thorium browser project. Since Alex is currently unavailable to update Thorium, I have temporarily taken over the task, and this release is a major update to the stable version of M158. The code is available here:
  https://github.com/gz83/thorium
  I think the current version is quite stable, and I'm only marking it as BETA because it hasn't been officially released by Alex yet.
  Welcome to use Thorium. Please submit any issues you encounter in the main Thorium repository using the issue template:
  https://github.com/Alex313031/thorium/issues
  Here are the release notes for this release:
  (Due to space limitations, not all changes are fully summarized.)
  Updated Chromium from 156.0.8078.80 to 158.0.8127.41, incorporating upstream fixes and web-platform improvements.
  Thorium highlights:
  - Shortcut change: Thorium's custom keyboard-shortcut overrides have been removed for redesign; affected shortcuts follow Chromium defaults.
  - More search choices: Search selected text with other configured engines and active site searches directly from the desktop context menu, without changing your default engine.
  - Multi-column bookmarks: Display long bookmark menus across columns, with scrolling, keyboard navigation, and drag-and-drop support. Enable thorium://flags/#multi-column-bookmarks; disabled by default and unavailable in native macOS menus.
  - WebRTC networking controls: Choose interface and non-proxied UDP policies through thorium://flags/#webrtc-ip-handling-policy. The Default option preserves existing settings.
  - Optional Windows GDI text rendering: Added thorium://flags/#force-gdi for use with tools such as MacType, including browser UI font metrics and HiDPI spacing fixes. Disabled by default; enabling it relaxes some sandbox and process security protections.
  - Windows fixes: Improved browser shutdown during system-level installs and same-version repairs, and corrected extension-menu scrollbars while respecting accessibility settings.
  - Media fixes: Corrected AC3/EAC3 audio sample-format handling and HEVC decoder linking.
  - Arch Linux packaging: Reworked packages with CPU-compatibility checks and guidance on suitable build variants.
  Selected upstream improvements:
  - Predictable tab switching: Ctrl+Tab in most-recently-used mode now stays within the current window, avoiding jumps to other windows or desktops.
  - CSS capabilities: Added support for custom text-overflow markers and text-decoration-inset
  - Networking efficiency: Enabled batched QUIC packet reads on Linux and Android and address-sorting connection caching on Android.
  - Memory safety: Fixed use-after-free issues in XSLT processing and password autofill.
