ShortDescription: Your research partner for rigorous science.
Description: |-
  Claude Science is a desktop application that pairs Claude with an analysis environment on your computer. Describe a research task in plain language and Claude writes and runs Python, R, or shell code in a sandbox, reads the folders you grant it, and pulls data from scientific databases through connectors.
  Results are saved as versioned artifacts with a full provenance record, and figures, tables, and notebooks include the exact code, environment, and conversation that produced them. Built-in renderers view proteins, alignments, genomic tracks, chemical structures, and PDFs natively.
  It is installed separately from the Claude desktop app and needs a Claude Pro, Max, Team, or Enterprise plan. Your files stay on your computer.
