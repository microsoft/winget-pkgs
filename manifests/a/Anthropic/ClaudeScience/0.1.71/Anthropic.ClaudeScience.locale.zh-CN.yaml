ShortDescription: 严谨科学的 AI 研究伙伴。
Description: |-
  Claude Science 是一款桌面应用程序，将 Claude 与你电脑上的分析环境结合。用自然语言描述研究任务，Claude 就会在沙箱中编写并运行 Python、R 或 shell 代码，读取你授权的文件夹，并通过连接器从科学数据库中获取数据。
  结果会保存为带有完整溯源记录的版本化产物；图表、表格和笔记本都包含生成它们的代码、环境和对话。内置渲染器可直接查看蛋白质、序列比对、基因组轨道、化学结构和 PDF。
  它独立于 Claude 桌面应用安装，需要 Claude Pro、Max、Team 或 Enterprise 套餐。你的文件保留在本机。
