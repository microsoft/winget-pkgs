ReleaseNotes: |-
  - Until now, Claude could work directly in a folder you'd granted Read & write: edit files, commit to git, install packages, and run builds. Now it makes changes in a separate folder of its own, in the app's data folder, then saves the finished files into yours, replacing the old versions. Anything in its folder that isn't saved to yours or as an artifact is deleted between 12 hours and 7 days after Claude's last reply in the session. Claude's ability to read files in your folder hasn't changed. It can no longer commit, install, or build in your folder, and neither scripts that it runs nor local connectors you've added can write there. You can do those in your own terminal, or see other ways
  - To a Read & write folder, Claude saves most data, figures, documents, and notebooks by itself, and with auto mode on, most source code, too. With auto mode off, it asks once in a session for each git repository or granted folder before it saves source code there. It saves some other kinds of files, such as JSON, shell scripts, and zip files, only when you tell it to and approve a card. It can't save some kinds there, even if you approve, such as Zarr stores and STAR or Bowtie 2 indexes. Ask it to keep those as artifacts
  - Mac and Linux: on most network storage (not rclone mounts), when a session saves over a version of your file that it didn't write itself, the old one now stays beside it as <name>.kept-…. On local disks that happens too, for example if another program has the file open and may be writing it, and it can on any system, Windows included, when less than 1 GB is free on the disk with the app's data folder. Claude Science tells you in the session where the copies are. Check them, then delete them yourself
  - Mac and Linux: the permission card for a folder now starts on Read-only, with Read & write as an option you choose
  - The literature review skill now catches more retracted papers, and says when a failed lookup left a paper unchecked
  - In a downloaded zip of artifacts, some files that a program loads automatically now start with _, as in _nextflow.config or _.Rprofile. renamed_files.txt lists them. To use one, check what's in it, then remove the _
  - ESMFold2's setup no longer uses a package that's gone from GitHub. On your own GPU machine, ESMFold2 now needs NVIDIA driver 580 or newer
  - After you paste an OpenAlex API key or GitHub token that Claude asked for, it's saved, but code Claude writes can use it only after you approve a Credentials card, even with auto mode on
  - If auto mode is available to you but off, code you've allowed to run without asking now gets auto mode's safety check first if it uses a saved credential. You're asked if the check isn't sure. If you don't answer, and for ten minutes you're in another session or another app, that code doesn't run and Claude carries on without it, and until you allow one, later such code in that session can end the same way. Each check takes several seconds and counts toward your usage
  - Team and Enterprise: if you're in the Life Sciences Verification Program (beta) with an approved use case, new sessions that would start on Opus 5 now start on Opus 5.5, unless you picked a model or your organization set a default
  - Mac and Linux: some conda packages, including some builds of TensorFlow, can no longer be installed in the starter Python and R environments. They can go into a task environment instead
  - Linux: fixed commands and code cells failing with "inode number out of range" when a folder you've granted, or your home folder, is on some NFS servers
  - Linux: the app now refuses connections from other user accounts on the same computer. If that blocks a service account or reverse proxy, set refuse_other_accounts = false in config.toml and restart the app
  - Windows: Python and R environments, task environments included, now keep their own copies of package files, so each can take more disk space. The first start after you update makes the copies in the background
  - Windows: fixed Claude Science affecting sound and printing in Chrome, Edge, and other Chromium-based apps
  - Package mirrors on Mac and Linux: if your mirror's links include a token, revoke it and get a new one. Pip installs could leave it in report files, and the app now deletes those
  - Bug fixes and reliability improvements
