ShortDescription: Interact with the Claude API directly from your terminal with the ant command-line tool
Description: |-
  The ant CLI provides access to the Claude API from your terminal. Every API resource is exposed as a subcommand, with output formatting, response filtering, and support for YAML or JSON file input that make it practical for both interactive exploration and automation.
  Compared to calling the API with curl, ant lets you build request bodies from typed flags or piped YAML rather than hand-written JSON, inline file contents into string fields with an @path reference, and extract fields from the response with a built-in --transform query (no separate JSON tooling required). List endpoints paginate automatically. Claude Code understands how to use ant natively.
Tags:
- claude
ReleaseNotes: |-
  Features
  - api: add Update Bundle, which sets a Claude Tag Bundle's instructions, and return instructions on Bundle
  - api: let the CLI fill Claude Tag bundle and target IDs from output
  Bug Fixes
  - sessions: keep the viewer's one-time link out of the browser opener's arguments
    ant beta:sessions connect --web now opens a temporary file that only you can read, and that file sends the browser on to the viewer. If the browser shows an error instead, because it can't read the temp directory, paste the link printed in the terminal into it.
  Chores
  - bump go sdk to v2.10.0
  - docs: add an example value for the workspace name
  - docs: clarify which workspaces an external key can be attached to
  - docs: say when organization_id is required on plugin reads
