ShortDescription: Uma alternativa gratuita ao Docker Desktop para Windows, sob Apache-2.0, sem limite de funcionários ou de faturamento e sem licença para comprar.
Description: 'O FreeWilly instala e opera o Docker no Windows. Um preflight diz se esta máquina consegue rodá-lo antes de qualquer download, e cada verificação aponta a única ação que a muda. O engine vive numa distribuição WSL2 chamada freewilly, criada por esta ferramenta, então nada seu é tocado e a desinstalação é um comando. Um ícone na bandeja mostra o estado do engine, e uma janela lista contêineres, imagens e volumes, com logs, portas e um shell. Instala por usuário em %LOCALAPPDATA%\FreeWilly e não pede permissão de administrador; ativar o recurso WSL2 ainda pode pedir. Requer Windows 10 2004 (build 19041) ou posterior, com WSL2 e virtualização de hardware: numa máquina sem eles o instalador para antes de gravar qualquer coisa e diz o que mudar.'
