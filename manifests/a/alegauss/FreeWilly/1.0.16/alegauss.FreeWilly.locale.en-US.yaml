ShortDescription: A free Docker Desktop alternative for Windows under Apache-2.0, with no headcount or revenue threshold and no licence to buy.
Description: "FreeWilly installs and drives Docker on Windows. A preflight says whether this machine can run it before anything is downloaded, and every check names the one action that changes it. The engine lives in a WSL2 distribution called freewilly that this tool owns, so nothing of yours is touched and the uninstall is one command. A tray icon carries the engine's state, and one window lists containers, images and volumes, with logs, ports and a shell. It installs per user into %LOCALAPPDATA%\\FreeWilly and asks for no administrator prompt; turning on the WSL2 feature may still need one. Requires Windows 10 2004 (build 19041) or later with WSL2 and hardware virtualization: on a machine without them the installer stops before writing anything and says what to change."
