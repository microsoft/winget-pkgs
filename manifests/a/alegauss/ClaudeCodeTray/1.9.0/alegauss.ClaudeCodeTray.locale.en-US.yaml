ShortDescription: Unofficial Windows tray monitor for Claude Code limits — the icon shows your 5h or weekly usage and turns red before you run out, and the weekly forecast is paced to the hours you actually work.
Description: >-
  Claude Code Tray is an unofficial, community-built Windows system-tray monitor for your
  Claude Code rate-limit usage. It draws a crisp, DPI-aware vector icon showing the current
  usage percentage with a Task Manager-style fill bar, and projects when you'll hit 100% —
  a proportional pace line for the weekly window and a burn-rate regression for the 5h session
  and extra windows — turning the bar vivid red when you're on track to run out before the
  window resets. The Statistics window goes further for the week: it learns when you usually work
  (day of week and hour, from your local transcripts) and spends the remaining quota along that
  shape, so the run-out time lands in a working afternoon instead of 4 a.m. Switch which window the icon tracks (session 5h, week 7d, or extra) from the
  right-click menu. When a window hands your quota back, a bespoke color-coded toast slides up
  to announce it: Surprise! (early weekly reset), Bonus! (mid-window credit), New week!, and
  Fresh session! — each toggleable in Settings. A Usage insights (24h) submenu shows a local,
  price-weighted breakdown of your usage (from subagents, large-context share, and a by-model
  split) computed from your own Claude Code session transcripts — no extra API calls and never
  reading message content. The app reuses the OAuth token Claude Code already stores, so there
  is nothing to configure, and it self-updates from GitHub Releases.
