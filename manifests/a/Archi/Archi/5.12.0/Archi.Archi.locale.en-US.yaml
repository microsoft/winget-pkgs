ReleaseNotes: |-
  Improvements
  - Bundled Java Runtime is version 21.0.13.1+2 (fix for CVE-2026-114938 “Java4Shell”)
  - Improve handling of image export on Windows in multi-monitor setups
  - Connection dashes are correctly scaled when zooming < 100% on Windows
  - Default figures in preferences and figure types in the Properties tab now adapt to dark theme
  Fixes
  - Fix possible blank images on Windows in multi-monitor setups
  - Fix malformed figure text layout when switching between monitors on Windows in multi-monitor setups
  - Other internal fixes and optimisations
