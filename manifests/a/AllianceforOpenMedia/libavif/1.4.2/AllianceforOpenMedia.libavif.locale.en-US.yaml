ShortDescription: AVIF image encoding and decoding library and command-line tools
Description: libavif implements the AV1 Image File Format in C, supporting all AV1 YUV formats and bit depths, including alpha. It includes avifenc and avifdec command-line tools for converting images to and from AVIF.
