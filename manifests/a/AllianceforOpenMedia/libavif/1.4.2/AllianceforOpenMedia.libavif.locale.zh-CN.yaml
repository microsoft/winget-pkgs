PackageIdentifier: AllianceforOpenMedia.libavif
PackageVersion: 1.4.2
PackageLocale: zh-CN
ShortDescription: 用于 AVIF 图像编码和解码的库及命令行工具
Description: libavif 使用 C 语言实现 AV1 图像文件格式，支持 AV1 的所有 YUV 格式和位深，包括透明度。它提供 avifenc 和 avifdec 命令行工具，用于将图像转换为 AVIF 或从 AVIF 转换为其他图像格式。
