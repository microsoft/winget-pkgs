ShortDescription: AVIF 이미지 인코딩 및 디코딩을 위한 라이브러리와 명령줄 도구
Description: libavif는 C로 AV1 이미지 파일 형식을 구현하며 알파 채널을 포함한 AV1의 모든 YUV 형식과 비트 심도를 지원합니다. 이미지를 AVIF로 변환하거나 AVIF에서 변환하는 명령줄 도구인 avifenc와 avifdec가 포함되어 있습니다.
