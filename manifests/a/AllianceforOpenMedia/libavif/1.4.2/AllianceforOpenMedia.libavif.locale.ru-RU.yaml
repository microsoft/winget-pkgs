PackageLocale: ru-RU
ShortDescription: Библиотека и утилиты командной строки для кодирования и декодирования изображений AVIF
Description: libavif реализует формат изображений AV1 на языке C и поддерживает все форматы YUV и глубины цвета AV1, включая альфа-канал. Включает утилиты командной строки avifenc и avifdec для преобразования изображений в AVIF и из него.
