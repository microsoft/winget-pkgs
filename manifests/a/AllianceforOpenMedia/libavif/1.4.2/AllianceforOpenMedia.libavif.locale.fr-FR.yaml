ShortDescription: Bibliothèque et outils en ligne de commande pour encoder et décoder des images AVIF
Description: libavif implémente le format de fichier image AV1 en C et prend en charge tous les formats YUV et profondeurs de bits d’AV1, y compris le canal alpha. Il comprend les outils en ligne de commande avifenc et avifdec pour convertir des images vers et depuis AVIF.
