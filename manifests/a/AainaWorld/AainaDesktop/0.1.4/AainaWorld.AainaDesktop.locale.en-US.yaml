ShortDescription: Model photos of your products, made on your own computer. Free and open source.
Description: |-
  Add a photo of what you sell, pick a studio model, poses and a scene, and get model photos for your shop.
  Photos are made with your own OpenAI account, about $0.05 a photo. There is no account with Aaina and no subscription, and everything you make is kept on your computer.
  Also makes ghost mannequin and flat-lay photos, and your own models, poses and scenes.
