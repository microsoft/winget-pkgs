ShortDescription: A touch macro pad for your Windows PC, on the phone or tablet you already own.
Description: |-
  PadNook turns an iPhone, iPad, Android device or any browser on your home network into a touch macro pad for your Windows PC.
  Keys can run shortcuts, launch programs, mute the microphone, control OBS Studio, Streamlabs, Twitch, Discord and Lightroom Classic, call webhooks and show live information.
  Everything stays on the local network: no cloud, no account.
