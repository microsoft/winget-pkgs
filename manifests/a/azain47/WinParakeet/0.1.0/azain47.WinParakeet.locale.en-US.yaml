ShortDescription: Private, offline dictation and meeting transcripts for Windows.
Description: WinParakeet is free, open-source speech-to-text for Windows that runs on your own PC. Hold a shortcut, talk, and your words are typed into any app. Record a call (your microphone and what your PC plays) and get a transcript of both sides with speaker labels. Speech recognition uses NVIDIA Parakeet, Whisper, Qwen3-ASR and other local models, GPU-accelerated through Vulkan; no audio leaves your computer.
