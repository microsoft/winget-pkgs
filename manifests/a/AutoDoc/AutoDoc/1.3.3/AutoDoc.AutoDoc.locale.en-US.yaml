ReleaseNotes: |-
  New: the interface is available in 27 languages (choose in onboarding or Settings), and a Light/Dark appearance setting.
  Fixes include a Retry option when the disk is full, a CPU fallback for Windows GPU memory errors, and more reliable encryption of recordings over 2 GB.
  Security: Electron 44.10.0.
