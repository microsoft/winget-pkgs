ShortDescription: Free, open-source meeting notes that also record your screen, so you can replay the moment your notes mention.
Description: |-
  AutoDoc is a free, open-source meeting notes app for Windows and Mac.
  It transcribes your meeting, writes notes with timestamps, and records your screen, so clicking a note replays what was said and shown at that moment.
  Transcription, notes and Ask AI run on your computer. No meeting bot joins your call and no account is required.
  The interface is available in 27 languages, with light and dark appearance.
