ReleaseNotes: |-
  It took some time, but with this release of Auto Dark Mode all the improvements of the past ten months are coming to your machine. We fixed many well-known issues from the original 11.0 release, including the crash when opening the Wallpaper page under Personalization. We also brought back some features that got lost while modernizing the user interface. For example, you can again just change the accent color of your taskbar depending on the current theme. Additionally, we made some nice quality-of-life improvements, such as a redesigned accent color page, inspired by the design of the Windows Settings app. All these fixes make 11.1 a rock-solid release, with the quality you usually expect from the Auto Dark Mode project.
  This release also includes an exciting new feature for all users with an ambient light sensor on their machine. Usually these are notebooks or tablets. Auto Dark Mode can now read the sensor values to adapt the theme to your environmental brightness. You can set a custom threshold, so you can define at which point your room is too dark for the light mode. You can enable this feature on the Time page.
  We're still not done with improvements to Auto Dark Mode. We hope to see you again on the next release notes in 2027. Until then, stay light! Or dark! Whatever you like! Probably both! 👋🏻
