ShortDescription: 矢量插画；以纯 Rust 全新重写的开源 Adobe Illustrator 净室重实现
Description: |-
  矢量插画；一个以纯 Rust 全新重写的开源 Adobe Illustrator 净室重实现。

  - 熟悉。Illustrator 的布局、工具、菜单、面板和快捷键：钢笔、直接选择、路径查找器、智能参考线、外观、色板、图层等。你已经会用它了。
  - 快速。UI 线程之外的多线程 SIMD 渲染。20,000 个形状在全视网膜分辨率下约 27 毫秒即可渲染完成，同时界面保持 120 fps。
  - 稳健。精确的曲线布尔运算（不再出现"无法执行操作"），通过结构共享实现无限撤销，并经过属性测试的文件往返验证。
  - 开放。有文档的原生格式（.vectorcraft，JSON）、一流的 SVG、PDF（及兼容 PDF 的 .ai）导入导出、PNG/JPEG/WebP 导出、Export for Screens，以及打开 SVGZ、模板、GIF、TIFF 和 BMP。
  - 智能体原生。每个菜单项、工具手势、面板和对话框都可以通过 JSON 控制通道和 MCP 服务器驱动，让 Claude 等智能体像人一样绘图、编辑和导出。
  - 随处可用。桌面应用同一套代码，相同的界面也在浏览器中提供。
