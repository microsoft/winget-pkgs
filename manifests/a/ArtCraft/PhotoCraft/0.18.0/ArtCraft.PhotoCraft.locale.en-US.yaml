ShortDescription: "Image editing: an open-source, clean-room reimplementation of Adobe Photoshop, rebuilt in pure Rust."
Description: "PhotoCraft is an open-source image editor, a clean-room reimplementation of Adobe Photoshop with layers, masks, adjustment layers, layer styles, type, vectors, brushes and PSD files, written from scratch in pure Rust. It is MIT OR Apache-2.0 licensed and runs natively on Windows, macOS and Linux."
