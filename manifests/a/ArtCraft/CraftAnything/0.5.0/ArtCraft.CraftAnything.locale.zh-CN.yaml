ShortDescription: 看清任意网站、应用或游戏是怎么做的，再让 AI 给你造一个自己的版本。
Description: |-
  看清任意网站、应用或游戏是怎么做的，再让 AI 给你造一个自己的版本；一个纯 Rust 写的开源净室引擎。

  把目标指给它，说清你想要什么，它就用真实的检查工具研究原作，让编码 agent 建一个新项目，把结果与原件比对，再反复收敛。

  - 研究一切：网站、桌面程序、手机应用、游戏和文件。真实的检查工具弄清它们是怎么搭起来的、做了什么，每个结论都带着证据。
  - 造一个自己的：说出你要什么（“复刻这个网站”、“用 Rust 复刻这个游戏的玩法”），编码 agent 就按你指定的技术栈建一个新项目。
  - 比对过，不是猜的：每个构建都会与原件比对（网页按三种屏宽、游戏跑它自己的自检、应用看它的运行），并反复收敛到足够接近。
  - 为 agent 准备好：数百个工具，每个既是 CLI 子命令、又是 MCP 工具，任何 agent 都能驱动跟应用同一个引擎。纯研究不需要 AI。
