ShortDescription: "See how any website, app or game works, then have AI build your own version; an open-source, clean-room engine in pure Rust."
Description: "Craft Anything is an open-source engine that studies a website, app or game with real inspection tools and has a coding agent build a working version, written from scratch in pure Rust. It is MIT OR Apache-2.0 licensed and runs natively on Windows, macOS and Linux."
