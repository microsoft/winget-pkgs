ReleaseNotes: |-
  ## What's Changed
  * Built by no longer offers a GitHub SSH key as a computer, and finds Claude Code on a Mac opened from the Dock by @bflatastic in https://github.com/storytold/craft-anything/pull/4
  * Explain failed agent runs, keep a log to open, and stop offering git servers as computers by @echelon in https://github.com/storytold/craft-anything/pull/3
  * Stop deadlocks as they form and watch every lock for one that never lets go by @echelon in https://github.com/storytold/craft-anything/pull/5
  * Show what a build is doing now and how long it has been quiet by @echelon in https://github.com/storytold/craft-anything/pull/6
  * Point links and release metadata at the renamed storytold/craft-anything repository by @echelon in https://github.com/storytold/craft-anything/pull/7
  * Record the v0.1.0 release in the roadmap by @echelon in https://github.com/storytold/craft-anything/pull/2
  * Try again picks up where a build stopped instead of starting over by @echelon in https://github.com/storytold/craft-anything/pull/8
  * Call a coding agent's cost an estimate, not the bill by @echelon in https://github.com/storytold/craft-anything/pull/9
  * Show what a build is on now, and open up into its activity as it arrives by @echelon in https://github.com/storytold/craft-anything/pull/10
  * Bump the version to 0.2.0 by @echelon in https://github.com/storytold/craft-anything/pull/11
  * ci: switch CI/CD to craft-common-actions and add Flatpak OCI by @dylanmtaylor in https://github.com/storytold/craft-anything/pull/12
  * Coding agents installed with npm on Windows start instead of "isn't on your PATH" by @bflatastic in https://github.com/storytold/craft-anything/pull/23
  * LM Studio and other local servers accept our tools: boolean sub-schemas are sent as objects by @bflatastic in https://github.com/storytold/craft-anything/pull/25
  * A program that crashes is named by its error, not the last line of its stack trace by @bflatastic in https://github.com/storytold/craft-anything/pull/26
  * Korean, Chinese, Japanese and other scripts are tested to show in release builds, which ship their font licences by @bflatastic in https://github.com/storytold/craft-anything/pull/29
  * OpenCode runs its task with `opencode run` instead of reading the prompt as a folder by @bflatastic in https://github.com/storytold/craft-anything/pull/35
  * Testing a coding agent says it only checked the program's version by @bflatastic in https://github.com/storytold/craft-anything/pull/49
  * Another program on a model server's port is no longer offered as an AI by @bflatastic in https://github.com/storytold/craft-anything/pull/39
  * A malformed engine hash is refused as bad input on every system, so the FreeBSD tests pass by @bflatastic in https://github.com/storytold/craft-anything/pull/40
  * The window draws in a Windows VM instead of staying black by @bflatastic in https://github.com/storytold/craft-anything/pull/38
  * Skip an ext inode that starts at the end of the address space by @rech4210 in https://github.com/storytold/craft-anything/pull/42
  * Stop an ELF segment at the end of the file offsets from overflowing by @rech4210 in https://github.com/storytold/craft-anything/pull/43
  * A builder that writes /app/… paths builds the app instead of being refused by @bflatastic in https://github.com/storytold/craft-anything/pull/36
  * Doctor says a local AI server is reachable only when it answers with its models by @bflatastic in https://github.com/storytold/craft-anything/pull/45
  * An agent set up by its program and a model runs that agent with that model by @bflatastic in https://github.com/storytold/craft-anything/pull/46

  ## New Contributors
  * @bflatastic made their first contribution in https://github.com/storytold/craft-anything/pull/4
  * @dylanmtaylor made their first contribution in https://github.com/storytold/craft-anything/pull/12
  * @rech4210 made their first contribution in https://github.com/storytold/craft-anything/pull/42

  **Full Changelog**: https://github.com/storytold/craft-any
