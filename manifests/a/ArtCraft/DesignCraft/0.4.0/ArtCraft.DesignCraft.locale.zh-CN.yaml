ShortDescription: 页面排版与出版；以纯 Rust 全新重写的开源 Adobe InDesign 净室重实现
Description: |-
  页面排版与出版；一个以纯 Rust 全新重写的开源 Adobe InDesign 净室重实现。

  - 熟悉。InDesign 的布局、工具、菜单、面板和快捷键：跨页与父页面、框架与串接文本故事、控制面板、段落和字符样式、色板、文本绕排等。如果你会用 InDesign，就已经会用它。
  - 优美的文字排版。Knuth-Plass 段落排版器（外加单行排版）、字典连字、字词、字母和字形缩放对齐、避头尾、视觉边距对齐、分栏、基线网格、制表符、标尺线和底纹。换行结果在屏幕和 PDF 中完全一致。
  - 快速。多线程 SIMD 渲染、写时复制文档与 O(1) 撤销快照，以及缓存排版。
  - 开放。有文档的原生格式、IDML 导入导出、PNG 导出，PDF 在路线图上。无订阅、无许可服务器、无遥测。
  - 智能体原生。每个菜单项、工具手势、面板控件和对话框都可以通过 JSON 控制通道和 MCP 服务器驱动，让 Claude 等智能体像设计师一样排版和编辑文档。
  - 随处可用。桌面与 Web 共用一个 Rust 代码库。
