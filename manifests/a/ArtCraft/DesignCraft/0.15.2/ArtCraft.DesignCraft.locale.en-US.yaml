ReleaseNotes: |-
  ## What's Changed
  * Grant network access so update checks can reach GitHub by @dylanmtaylor in https://github.com/storytold/designcraft/pull/1954
  * Honor CARGO_BUILD_TARGET in FreeBSD packaging for aarch64 release builds by @dylanmtaylor in https://github.com/storytold/designcraft/pull/1959
  * Show file and message dialogs without blocking the frame (fixes macOS crash) by @aiongg in https://github.com/storytold/designcraft/pull/1961
  * packaging: Flatpak finds and prints to CUPS printers by @dylanmtaylor in https://github.com/storytold/designcraft/pull/2012
  * Repaint the canvas when a placed file is relinked or updated by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1842
  * Fix duplicated xref format text before an unclosed '<' in IDML export by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1915
  * Compose: tables clear the footnote area by @KnottyDyes in https://github.com/storytold/designcraft/pull/1971
  * Fix "-0" in Name with Color Value for slightly negative RGB by @Silvertree2010 in https://github.com/storytold/designcraft/pull/2008
  * Tables: a shape a table cannot hold is clamped, not allocated (#1583) by @Hamza0101 in https://github.com/storytold/designcraft/pull/1868
  * Drop XML-forbidden control characters in file.exportXml by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1908
  * i18n(ka): Georgian for keyboard shortcut sets, command forms and labels added since #1573 by @devius in https://github.com/storytold/designcraft/pull/1932
  * IDML export: write the document's default StoryPreference by @hscabral in https://github.com/storytold/designcraft/pull/1976
  * [fix] Running headers read a page in text order, not by height by @seanth in https://github.com/storytold/designcraft/pull/1233
  * PDF export: SOURCE_DATE_EPOCH stands in for the clock, so exports repeat by @Hamza0101 in https://github.com/storytold/designcraft/pull/1306
  * Escape font family and typeface values in Tagged Text export by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1860
  * A table size Create Table cannot mean is refused by @Hamza0101 in https://github.com/storytold/designcraft/pull/1568
  * Fix RTF import swallowing characters after a short \'hh escape by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1905
  * PDF export: a name escapes every byte a name cannot hold (#1582) by @Hamza0101 in https://github.com/storytold/designcraft/pull/1872
  * Strip story marker characters from placed plain text files by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1948
  * Data merge: an image named by many records is read once (#1595) by @Hamza0101 in https://github.com/storytold/designcraft/pull/1911
  * Print: the Windows print test expects the driver's default color by @dotCooCoo in https://github.com/storytold/designcraft/pull/1840
  * Keep leading and trailing spaces in Tagged Text style names by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1998
  * (fix) macOS: accept .idml dropped on the app icon and opens with contextual "open with..." by @seanth in https://github.com/storytold/designcraft/pull/1183
  * Import: a shared string and a footnote are not copied per reference (#1584) by @Hamza0101 in https://github.com/storytold/designcraft/pull/1871
  * Data merge: the UNC refusal is tested on Windows too (#1601) by @Hamza0101 in https://github.com/storytold/designcraft/pull/1909
  * macOS: declare the UI languages so the open and save panels are translated by @Atalantis in https://github.com/storytold/designcraft/pull/1863
  * Open documents whose items share an id by @Silvertree2010 in https://github.com/storytold/designcraft/pull/1935
  * compose: settle a story's own anchored wraps by object count, not 4 passes by @garrytan in https://github.com/storytold/designcraft/pull/1949
  * Add German 2006 reform hyphenation by @RoHaX in https://github.com/storytold/designcraft/pull/1254
  * Rulers: a guide dragged out keeps its resize cursor until it is dropped by @
