ShortDescription: Open-source 2D vector animation studio written in Rust
Description: AniCraft is an open-source 2D vector animation studio and a clean-room reimplementation of Adobe Animate, written from scratch in pure Rust. It provides a timeline with layers and keyframes, classic and shape tweens, onion skinning, bitmap and vector drawing, and an egui stage. It runs natively on macOS, Windows, Linux and FreeBSD.
