ShortDescription: 用 Rust 编写的开源 2D 矢量动画工作室
Description: AniCraft 是一款开源的 2D 矢量动画工作室，也是对 Adobe Animate 的净室重写，完全使用 Rust 从零编写。它提供带图层与关键帧的时间轴、传统补间与形状补间、洋葱皮提示、位图与矢量绘制，以及基于 egui 的舞台，可原生运行于 macOS、Windows、Linux 与 FreeBSD。
