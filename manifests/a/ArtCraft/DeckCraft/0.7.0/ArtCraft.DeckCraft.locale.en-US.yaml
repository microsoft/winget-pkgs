ReleaseNotes: |-
  What's Changed
  - Text: superscript and subscript letters no longer spread apart by @echelon in https://github.com/storytold/deckcraft/pull/264
  - Themes: background pictures are recoloured, and dark layouts stay dark by @echelon in https://github.com/storytold/deckcraft/pull/269
  - Render: two-colour gradients ramp like PowerPoint's by @echelon in https://github.com/storytold/deckcraft/pull/273
  - PPTX: a picture fill with no stretch or tile is tiled, as in PowerPoint by @echelon in https://github.com/storytold/deckcraft/pull/290
  - PPTX: a placeholder without geometry takes its layout's by @echelon in https://github.com/storytold/deckcraft/pull/301
  - Draw only the first character of a multi-character bullet by @echelon in https://github.com/storytold/deckcraft/pull/307
  - Text: a list whose hang passes the box edge keeps its gap after the number by @echelon in https://github.com/storytold/deckcraft/pull/265
  - Text: single-spaced lines are 1.2 times the font size apart, as in PowerPoint by @echelon in https://github.com/storytold/deckcraft/pull/266
  - Render: shapes filled with the slide background show it by @echelon in https://github.com/storytold/deckcraft/pull/274
  - Render: slide backgrounds are laid over white, as in PowerPoint by @echelon in https://github.com/storytold/deckcraft/pull/275
  - Text: wrap URLs, Korean and CJK punctuation where PowerPoint does by @echelon in https://github.com/storytold/deckcraft/pull/276
  - Emoji: drawn in colour, with families, skin tones and flags joined by @echelon in https://github.com/storytold/deckcraft/pull/278
  - Text: gradient fills draw, starting over on every line as in PowerPoint by @echelon in https://github.com/storytold/deckcraft/pull/281
  - Text: shadows and glows are drawn, with PowerPoint's glow spread by @echelon in https://github.com/storytold/deckcraft/pull/283
  - Bullets: circled numbers and symbols the text font lacks come from a fallback font by @echelon in https://github.com/storytold/deckcraft/pull/284
  - Render: pattern fills draw PowerPoint's preset tiles by @echelon in https://github.com/storytold/deckcraft/pull/285
  - Render: compound outlines (double, thick-thin, thin-thick, triple) by @echelon in https://github.com/storytold/deckcraft/pull/287
  - Render: rectangle and outline path gradients by @echelon in https://github.com/storytold/deckcraft/pull/288
  - Render: soft edges fade to the shape's outline by @echelon in https://github.com/storytold/deckcraft/pull/289
  - Tables: styles the file defines are read, drawn and kept by @echelon in https://github.com/storytold/deckcraft/pull/292
  - Tables: the table's own fill is drawn behind its cells by @echelon in https://github.com/storytold/deckcraft/pull/294
  - Bullets: an installed symbol font draws its own glyph by @echelon in https://github.com/storytold/deckcraft/pull/293
  - Render: shadows, inner shadows and glows spread like PowerPoint's by @echelon in https://github.com/storytold/deckcraft/pull/305
  - Text: no Latin ligatures, and kerning only from the run's kern size by @echelon in https://github.com/storytold/deckcraft/pull/309
  - Text: WordArt transforms (prstTxWarp) draw, and their adjusts round-trip by @echelon in https://github.com/storytold/deckcraft/pull/312
  - Shapes: the 38 missing PowerPoint preset shapes by @echelon in https://github.com/storytold/deckcraft/pull/315
  - Pictures: WMF and EMF draw (metafile reader ported from WordCraft) by @echelon in https://github.com/storytold/deckcraft/pull/317
  - Fonts: missing fonts draw as PowerPoint draws them, and Windows family names resolve by @echelon in https://github.com/storytold/deckcraft/pull/322
  - Render tests: arch top bound allows Linux's fallback font by @echelon in https://github.com/storytold/deckcraft/pull/323
