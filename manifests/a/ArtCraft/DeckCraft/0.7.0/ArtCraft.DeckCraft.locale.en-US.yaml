  - Text: Ctrl+arrows, Ctrl+Backspace/Delete and other text keys work like PowerPoint (#268) by @echelon in https://github.com/storytold/deckcraft/pull/333
  - UI: en and em dashes show in interface text by @echelon in https://github.com/storytold/deckcraft/pull/334
  - Pictures: WMF/EMF text, pattern and hatch brushes draw; ActiveX previews show by @echelon in https://github.com/storytold/deckcraft/pull/336
  - Render: a group's child-coordinate scale no longer scales line widths (#233, from #251) by @echelon in https://github.com/storytold/deckcraft/pull/337
