  - Opening a .ppsx from the command line starts the slide show (#862) by @marcoarnulfo in https://github.com/storytold/deckcraft/pull/864
  - Show: Back leaves a slide whose first animation plays by itself by @marcoarnulfo in https://github.com/storytold/deckcraft/pull/882
