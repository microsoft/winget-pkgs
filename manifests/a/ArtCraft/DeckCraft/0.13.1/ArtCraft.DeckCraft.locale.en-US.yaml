ReleaseNotes: |-
  ## What's Changed
  * Grant network access so update checks can reach GitHub by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1502
  * Honor CARGO_BUILD_TARGET in FreeBSD packaging for aarch64 release builds by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1507
  * CI: workflows only call craft-common-actions at @main (AGENTS.md; windows-arm64 unpinned) by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1557
  * Update prompt shows the app icon and accent color instead of a letter by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1561
  * Fix update testing and dev-only testkit layer checks by @dylanmtaylor in https://github.com/storytold/deckcraft/pull/1562
  * Fix the editor's media bar ignoring clicks by @kinower in https://github.com/storytold/deckcraft/pull/1226
  * Render: skip shapes far larger than any screen instead of aborting (#1165) by @Naseq in https://github.com/storytold/deckcraft/pull/1374
  * Reject invalid slide index in file.export, file.render, slide.colorAt by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1410
  * Animation state no longer moves layout and master shapes that share an id with a slide shape (fixes #1362) by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1441
  * Reject '+' sign in slide range numbers by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1453
  * Slide show: Set Up Slide Show can keep the mouse cursor visible (#1445) by @Faabyy in https://github.com/storytold/deckcraft/pull/1456
  * PDF export: transparent content pixels take the backdrop colour (fixes #1455) by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1466
  * table.cellAlign takes a horizontal align by @zberry in https://github.com/storytold/deckcraft/pull/1475
  * Inserts in the master views: insert.dateTime fills the master's date placeholder; answers say a master or layout was edited (part of #298) by @zberry in https://github.com/storytold/deckcraft/pull/1477
  * A group's box follows its children after a command moves or resizes one by @zberry in https://github.com/storytold/deckcraft/pull/1478
  * review.compare says which side each change is on; an absent box is not a rotation by @zberry in https://github.com/storytold/deckcraft/pull/1479
  * show.presenter answers {on, window} (part of #298) by @zberry in https://github.com/storytold/deckcraft/pull/1480
  * Tests pinning picture.reset, a repeated PNG export and an action button's theme fill by @zberry in https://github.com/storytold/deckcraft/pull/1481
  * Decoders: set up picture state inside the panic guard by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1498
  * Bound EMF+ region paths to declared spans by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1512
  * Slide show: going back plays the left slide's transition in reverse (#1531) by @Faabyy in https://github.com/storytold/deckcraft/pull/1533
  * Reject invalid slide index in animation.clear by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1537
  * Reject invalid slide index in design.applyIdea and design.ideas by @Silvertree2010 in https://github.com/storytold/deckcraft/pull/1538
  * Long English dates follow each English locale's day order and punctuation by @zberry in https://github.com/storytold/deckcraft/pull/1324
  * PPTX: a picture in a picture placeholder takes its layout's shape by @leobasilio in https://github.com/storytold/deckcraft/pull/1384
  * Format: Fill offers Slide background fill by @dotCooCoo in https://github.com/storytold/deckcraft/pull/1397
  * fix(pptx): read Auto-reverse from animation behaviour nodes by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1435
  * fix(format): Reflection None clears after another preset (#1356) by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1437
  * Bullets in an unavailable Unicode symbol font keep their character (fixes #1347) by @Harrison-Booth in https://github.com/storytold/deckcraft/pull/1442
  * Fonts
