  - Reject non-finite arguments in CAL min() and max() by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2547
  - Reject nan and inf text values in SETVAR for real variables by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2546
  - Fix LISP atof returning a wrong value for out-of-range exponents by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2533
