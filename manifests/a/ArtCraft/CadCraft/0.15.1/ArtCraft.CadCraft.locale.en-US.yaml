ReleaseNotes: |-
  ## What's Changed
  * Grant network access so update checks can reach GitHub by @dylanmtaylor in https://github.com/storytold/cadcraft/pull/2413
  * Honor CARGO_BUILD_TARGET in FreeBSD packaging for aarch64 release builds by @dylanmtaylor in https://github.com/storytold/cadcraft/pull/2425
  * PEDIT Multiple at the command line by @aldozar in https://github.com/storytold/cadcraft/pull/2225
  * Reject out-of-range LUNITS, LUPREC, AUNITS and AUPREC in SETVAR by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2269
  * Cap autosave file names at 255 bytes for multibyte titles by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2289
  * Refuse invalid counts in JSON arraypolar and arrayrect by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2399
  * DWG: keep the current layer (CLAYER) through a save and reopen (#2252) by @SBaksa in https://github.com/storytold/cadcraft/pull/2407
  * xtask: the test suite and clippy pass on Windows by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2198
  * MEASURE picks its starting end by the curve's parameter, as AutoCAD does by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2207
  * Block Editor: BEDIT inside it switches to another block, asking to save first by @codyvogt in https://github.com/storytold/cadcraft/pull/2219
  * Reject out-of-range numeric colours in properties.set by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2286
  * Command line: a LISP value at a prompt is the answer, not another expression (fixes #1920) by @ayozetr in https://github.com/storytold/cadcraft/pull/2338
  * fix(render): fill font glyphs with the nonzero winding rule (진 drawn as 지) by @heejunB in https://github.com/storytold/cadcraft/pull/2189
  * feat(web): persist validated browser panel layouts by @smacdmac101 in https://github.com/storytold/cadcraft/pull/2258
  * Skip a leading UTF-8 BOM when parsing ASCII DXF by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2287
  * Bound the MCP client's reply read and the control server's total buffered bytes (#1925) by @SBaksa in https://github.com/storytold/cadcraft/pull/2398
  * Tests remove the temp files they write by @bmh129 in https://github.com/storytold/cadcraft/pull/2232
  * Refuse invalid count in JSON copy instead of clamping it by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2294
  * Count DXF group codes correctly when enforcing limits by @TheGalitube in https://github.com/storytold/cadcraft/pull/2408
  * Reject zero distance in JSON offset command by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2190
  * Stop DIMTMOVE 2 text taking the DIMTAD 1 clearance twice by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2302
  * fix: keep WIPEOUT closure coherent across grips and outlines by @jonascloud in https://github.com/storytold/cadcraft/pull/2284
  * Dimensions: report the measurement as soon as one is created (#2421) by @SBaksa in https://github.com/storytold/cadcraft/pull/2438
  * ELLIPSE from axis endpoints matches what AutoCAD stores by @2ez4gcx in https://github.com/storytold/cadcraft/pull/2197
  * DWG: keep block draw-order sort handles through the DXF bridge (#2410) by @SBaksa in https://github.com/storytold/cadcraft/pull/2439
  * Reject negative or non-finite JSON chamfer distances by @Silvertree2010 in https://github.com/storytold/cadcraft/pull/2406
  * DWG: post-read fix-ups run under catch_unwind; merge work is bounded (#1934) by @SBaksa in https://github.com/storytold/cadcraft/pull/2402
  * fix(engine): refresh attribute baselines after value changes by @smacdmac101 in https://github.com/storytold/cadcraft/pull/2214
  * CI: workflows only call craft-common-actions at @main (AGENTS.md; windows-arm64 unpinned) by @dylanmtaylor in https://github.com/storytold/cadcraft/pull/2473
  * deps: bump tar, zip, roxmltree, rustls-webpki and symphonia to latest by @dylanmtaylor in https://github.com/storytold/cadcraft/pull/2475
  * Update prompt shows the app icon and accent color instead of
