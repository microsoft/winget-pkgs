Description: "SoundCraft is an open-source digital audio workstation for recording, editing and mixing audio, a clean-room reimplementation of Avid Pro Tools written from scratch in pure Rust. It is MIT OR Apache-2.0 licensed and runs natively on Windows, macOS and Linux."
