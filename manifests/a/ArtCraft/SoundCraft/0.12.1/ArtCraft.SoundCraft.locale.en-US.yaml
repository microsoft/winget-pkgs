  - security: enforce HTTPS on curl downloads (SonarCloud S6506) by @dylanmtaylor in https://github.com/storytold/soundcraft/pull/860
  - README: the app icon above the title by @bflatastic in https://github.com/storytold/soundcraft/pull/934
  - Fix integer overflow in AutoParam::label for Pan(255) by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/834
  - Fix integer overflow in TempoMapbar_beat_at_tick for i64MIN by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/831
  - Reject undefined SMPTE frame rates in MIDI headers by @MMexicann in https://github.com/storytold/soundcraft/pull/830
  - Fix overflow in extreme timecode frame counts by @MMexicann in https://github.com/storytold/soundcraft/pull/828
  - Reject mix.send to an unknown bus name instead of creating a bus by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/829
  - Fix normalize producing inf samples for subnormal peaks by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/820
  - Keep existing breakpoint at end + 1 in AutomationLane::write_range by @Silvertree2010 in https://github.com/storytold/soundcraft/pull/812
  - fix(ui): bare "=" key nudges the selected clip right, matching "-" by @MichaelMuClaude in https://github.com/storytold/soundcraft/pull/786
