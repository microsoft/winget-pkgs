Description: |-
  动态图形与视觉特效；一个以纯 Rust 全新重写的开源 Adobe After Effects 净室重实现。
  EffectCraft 尚处早期：首次提交于 2026 年 10 月 1 日。After Effects 的几乎所有功能均已具备，包括其全部效果，但“存在”并不等于表现与 After Effects 完全一致。现在它是尝试新事物、并告诉我们哪里出问题的好地方。
  After Effects 项目尚无法打开。项目会保存为 .ecproj（可读的版本化 JSON），EffectCraft 无法打开 .aep / .aepx 文件，After Effects 插件也无法运行。
