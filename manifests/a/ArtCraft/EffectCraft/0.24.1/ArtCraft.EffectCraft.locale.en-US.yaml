  - Import, Relink: index sequence runs and folder listings; probe relink candidates once by @dylanmtaylor in https://github.com/storytold/effectcraft/pull/3000
  - ScriptUI: bound the edges and bands a fillPath is tessellated with by @dylanmtaylor in https://github.com/storytold/effectcraft/pull/3001
  - Scripting: run-time compiled code passes the nesting check; bounded file masks, socket line search and file reads by @dylanmtaylor in https://github.com/storytold/effectcraft/pull/2975
  - CI: nightly release dry run by @FredApps in https://github.com/storytold/effectcraft/pull/3520
