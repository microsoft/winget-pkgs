ReleaseNotes: |-
  ## What's Changed
  * Honor CARGO_BUILD_TARGET in FreeBSD packaging for aarch64 release builds by @dylanmtaylor in https://github.com/storytold/effectcraft/pull/2555
  * Export: convert H.264 frames to YUV 4:2:0 on the GPU by @MatejKozlovsky in https://github.com/storytold/effectcraft/pull/1631
  * Face tracker: find polygon crossings once per window row by @vangel76 in https://github.com/storytold/effectcraft/pull/2334
  * Camera tracking: validate solver input and bound workspaces by @vangel76 in https://github.com/storytold/effectcraft/pull/2341
  * av1enc: reuse scratch buffers in the transform path, the coefficient writer and the level search by @vangel76 in https://github.com/storytold/effectcraft/pull/2405
  * vp9enc: loop filter in 8-lane groups by @vangel76 in https://github.com/storytold/effectcraft/pull/2448
  * Shapes: Wiggle Paths has Spatial Phase, which slides its wiggle along the path by @dotCooCoo in https://github.com/storytold/effectcraft/pull/2450
  * Skip whole CSS at-rule blocks in the SVG parser by brace depth by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/2547
  * Fix Align Video to Data panic on multi-byte char in timestamp by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/2548
  * Disk cache: 20 GB default and a free-space reserve, so it no longer fills the disk (#2551) by @arnav-hiwarkar in https://github.com/storytold/effectcraft/pull/2553
  * Glow, Radial Blur, Venetian Blinds, Radial Wipe, Fractal Noise and the Transform effect render as in After Effects by @vangel76 in https://github.com/storytold/effectcraft/pull/1873
  * Cryptomatte pick: keep a hover probe, built off the UI thread (#473) by @MatejKozlovsky in https://github.com/storytold/effectcraft/pull/2517
  * Scripts: Recent Script Files lists the last ten scripts and Cmd+Alt+Shift+D reruns the newest by @dotCooCoo in https://github.com/storytold/effectcraft/pull/2291
  * Fix #341: on macOS, a quit goes through `terminate:` by @dotCooCoo in https://github.com/storytold/effectcraft/pull/1762
  * GPU: Classic 3D builds with FXC, so the GPU compositor starts on DirectX 12 (#613) by @MatejKozlovsky in https://github.com/storytold/effectcraft/pull/1571
  * SVG, FCP XML: bound XML entity expansion (#2129) by @bflatastic in https://github.com/storytold/effectcraft/pull/2597
  * Camera tracking: avoid per-view triangulation allocations by @vangel76 in https://github.com/storytold/effectcraft/pull/2338
  * i18n: two labels that already had a catalog row were formatted in English by @zitann2020 in https://github.com/storytold/effectcraft/pull/1669
  * Fix HexTile centerline cell selection by @sanyamsingh001 in https://github.com/storytold/effectcraft/pull/1776
  * Keep FrameRate::from_f64 nonzero for tiny positive fps by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/2287
  * Bound SVG arc segment count for huge radii by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/2288
  * Require hex digits in glTF uri_decode percent escapes by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/2460
  * Reject '+' signs in Lottie text stroke colour hex pairs by @Silvertree2010 in https://github.com/storytold/effectcraft/pull/2542
  * macOS: declare the UI languages so the open and save panels are translated by @Atalantis in https://github.com/storytold/effectcraft/pull/2470
  * Scripts: socket tests wait for the buffers to stay full on macOS by @dotCooCoo in https://github.com/storytold/effectcraft/pull/2533
  * EffectCraft — start the window surface from eframe's default (frame latency 2 → 1) by @ZJHeepfixer in https://github.com/storytold/effectcraft/pull/2370
  * Lottie: import a layer's time stretch below 1 % as 100 %, with a warning by @marcoarnulfo in https://github.com/storytold/effectcraft/pull/2308
  * vp9enc: forward transform accumulates all outputs together by @vangel76 in https://github.com/storytold/effectcraft/pull/2446
  * i18n(ka): shorter Georgian for 14 labels that didn't fit by @devius in https://github.com/stor
