ReleaseNotes: |-
  ## What's Changed
  * Use shared Craft workflows and support cross packaging by @dylanmtaylor in https://github.com/storytold/texturecraft/pull/11
  * More filters: High Pass, Edge Detect, Warp Directional, Grayscale, Normal Invert by @bflatastic in https://github.com/storytold/texturecraft/pull/9
  * Clear coat in USD export by @bflatastic in https://github.com/storytold/texturecraft/pull/10
  * More filters: Bevel, Glow, Mosaic by @bflatastic in https://github.com/storytold/texturecraft/pull/13
  * Cameras from FBX, COLLADA and USD files by @bflatastic in https://github.com/storytold/texturecraft/pull/15
  * Baked Lighting filter by @bflatastic in https://github.com/storytold/texturecraft/pull/16
  * FBX texture files beside the mesh by @bflatastic in https://github.com/storytold/texturecraft/pull/17
  * Displacement in the path tracers and the viewport's shadows by @bflatastic in https://github.com/storytold/texturecraft/pull/18
  * Geometry masks: layers on chosen mesh parts by @bflatastic in https://github.com/storytold/texturecraft/pull/19
  * Eight smart masks and four smart materials by @bflatastic in https://github.com/storytold/texturecraft/pull/20
  * Export presets: Godot 4 (ORM) and OpenPBR by @bflatastic in https://github.com/storytold/texturecraft/pull/21
  * Docs: roadmap and status after the November features by @bflatastic in https://github.com/storytold/texturecraft/pull/22
  * Radial symmetry for brushes by @bflatastic in https://github.com/storytold/texturecraft/pull/24
  * Panels: move onto craft-ui's shared docking (egui 0.37) by @aiongg in https://github.com/storytold/texturecraft/pull/14
  * Geometry mask tool: click mesh parts by @bflatastic in https://github.com/storytold/texturecraft/pull/25
  * Six more materials: Rust, Slate, Sandstone, Terrazzo, Cork, Paper by @bflatastic in https://github.com/storytold/texturecraft/pull/27
  * Replace Color filter by @bflatastic in https://github.com/storytold/texturecraft/pull/28
  * UI design pass: IBM Plex, one type and spacing scale, cleaner titles and forms by @bflatastic in https://github.com/storytold/texturecraft/pull/29
  * Viewport backdrop in the interface's slate by @bflatastic in https://github.com/storytold/texturecraft/pull/31
  * Custom title bar: app icon, menus and window buttons in one strip by @bflatastic in https://github.com/storytold/texturecraft/pull/32
  * Inter, even gaps and readable selections by @bflatastic in https://github.com/storytold/texturecraft/pull/30
  * Retake the README screenshots for the new UI by @bflatastic in https://github.com/storytold/texturecraft/pull/33
  * Version 0.2.0 by @bflatastic in https://github.com/storytold/texturecraft/pull/34
  * Mark the packaging scripts executable by @bflatastic in https://github.com/storytold/texturecraft/pull/35

  ## New Contributors
  * @aiongg made their first contribution in https://github.com/storytold/texturecraft/pull/14

  **Full Changelog**: https://github.com/storytold/texturecraft/compare/v0.1.0...v0.2.0
