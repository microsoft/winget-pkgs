ReleaseNotes: |-
  ## What's Changed
  * Grant network access so update checks can reach GitHub by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/4741
  * Honor CARGO_BUILD_TARGET in FreeBSD packaging for aarch64 release builds by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/4760
  * Labels: continue selected recipients across sheets (#4880) by @OPUZZLES in https://github.com/storytold/wordcraft/pull/4894
  * packaging: Flatpak finds and prints to CUPS printers by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/4909
  * Keep zero-sized paragraph frames in normal flow by @finwarman in https://github.com/storytold/wordcraft/pull/2810
  * Tables: share spanning minima by preferred widths by @finwarman in https://github.com/storytold/wordcraft/pull/1883
  * Tables can be copied and cut: whole tables, rows and cells (#1744) by @dkhlapov in https://github.com/storytold/wordcraft/pull/1784
  * #1103: ignore macOS launch arguments and name the real cause when a file won't open by @dkhlapov in https://github.com/storytold/wordcraft/pull/2622
  * Traditional Chinese interface: draw hanzi to the Taiwan standard with an installed TC font by @TobyWu666 in https://github.com/storytold/wordcraft/pull/3380
  * Content controls: resolve lone table-open markers in linear time (#3826) by @madhasoeki in https://github.com/storytold/wordcraft/pull/4227
  * Prevent X11 crashes from NUL in document titles (#3634) by @Lucenx9 in https://github.com/storytold/wordcraft/pull/4301
  * CI: workflows only call craft-common-actions at @main (AGENTS.md; windows-arm64 unpinned) by @dylanmtaylor in https://github.com/storytold/wordcraft/pull/4919
  * M14: validate window fallback geometry and avoid duplicate symbol names by @kalmarr in https://github.com/storytold/wordcraft/pull/4343
  * Layout parity: field results take \* DollarText, \* Hex and \* ArabicDash by @dotCooCoo in https://github.com/storytold/wordcraft/pull/4361
  * docx: pin Standard-encryption key derivation to a real-world package by @Bra1nZ in https://github.com/storytold/wordcraft/pull/4472
  * WordArt gallery: hand the keyboard back to the page after a pick (#4061) by @MichaelMuClaude in https://github.com/storytold/wordcraft/pull/4358
  * Options: a blank User Name stays blank after a restart (#4368) by @x-labb in https://github.com/storytold/wordcraft/pull/4421
  * Layout › Arrange › Group stays on while a group is selected, so Ungroup is reachable (#4229) by @x-labb in https://github.com/storytold/wordcraft/pull/4440
  * Format Painter: double-click a word to paint it (#4410) by @MichaelMuClaude in https://github.com/storytold/wordcraft/pull/4502
  * Shading buttons show the last picked colour (#4412) by @MichaelMuClaude in https://github.com/storytold/wordcraft/pull/4505
  * AutoCorrect Options opens with no document open (#4585) by @naxvog in https://github.com/storytold/wordcraft/pull/4626
  * Ctrl+V pastes a clipboard picture again with egui 0.37 by @iAmRarted in https://github.com/storytold/wordcraft/pull/4787
  * Insert › Shapes shows the basic shapes as an icon grid (#4349) by @dhruvLearner8 in https://github.com/storytold/wordcraft/pull/4739
  * Carry rounded ISO duration seconds into minutes and hours by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/4555
  * Reject '+' signs in 8-digit hex colours in parse_color by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/4653
  * fix(formats): HTML <font size> offsets no longer overflow at the integer limits by @jayzed80 in https://github.com/storytold/wordcraft/pull/4755
  * Fix HTML import leaking <title> text into body outside <head> by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/4725
  * Keep -- and '' apart across text runs in LaTeX export by @Silvertree2010 in https://github.com/storytold/wordcraft/pull/4822
  * HTML: preserve preformatted lines with CR input newlines (#4810) by @OPUZZLES in https://github.com/storytold/wordcraft/pull/4815
  * Markdown import: bound nested reference-label work by @OPUZZLES in https://
