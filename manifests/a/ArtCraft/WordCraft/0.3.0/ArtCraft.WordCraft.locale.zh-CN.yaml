PackageIdentifier: ArtCraft.WordCraft
PackageVersion: 0.3.0
PackageLocale: zh-CN
ShortDescription: 一个用纯 Rust 全新重写的 Microsoft Word 开源净室实现
Description: |-
  WordCraft 是一个用纯 Rust 全新重写的 Microsoft Word 开源净室实现。它可以打开和保存 .docx（OOXML），也支持 .odt、.rtf、.html、.md 和 .txt，并导出文本真实可选、带链接和书签的 PDF。原生 egui 直接跑在 GPU 上，没有 Electron 也没有 Tauri，同一份代码覆盖 macOS、Windows、Linux、BSD 和网页端。

  - 熟悉：Word 的功能区选项卡、命令组、快捷键和行为，实时预览的样式库，正则查找替换，以及随打随查的拼写和语法检查。
  - 写作与排版：支持输入法的快速输入、智能引号、自动更正、列表自动套用，字体、字符和段落格式，样式、主题和样式集。
  - 页面：页边距、方向、纸张大小、分栏，页/栏/节分隔符，页眉和页脚、页码、水印、页面边框、行号、首字下沉和自动断字。
  - 表格和对象：带样式的表格，合并与拆分单元格、公式和跨页重复标题行；图片、形状和文本框，支持浮动定位与文字环绕。
  - 引用：目录、脚注和尾注，APA、MLA、Chicago 或 IEEE 格式的引文与书目，题注、交叉引用和索引。
  - 审阅：修订、页边距批注框、接受与拒绝、文档比较、限制编辑、辅助功能检查器、同义词库和字数统计。
  - 邮件：从 CSV 进行邮件合并，支持合并域、地址块和问候语，以及信封和标签。
  - 为代理而生：389 个命令驱动功能区、快捷键、命令搜索、CLI、JSON 控制通道和 MCP 服务器。一切皆可离线完成，界面提供英语、简体中文、繁體中文和日本語。
