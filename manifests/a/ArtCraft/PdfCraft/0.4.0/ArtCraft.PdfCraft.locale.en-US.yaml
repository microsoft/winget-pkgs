ShortDescription: A native PDF workbench for reading, organizing, combining, splitting, and securing documents.
Description: PdfCraft provides PDF viewing, document-wide search, and text selection. It can rotate, delete, insert, and reorder pages, combine documents, and extract or split pages while preserving links, form fields, layers, and bookmarks. Incremental saves, autosave, and crash recovery help preserve document changes.
Moniker: pdfcraft
