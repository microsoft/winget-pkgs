ShortDescription: "The PDF workbench: an open-source, modern PDF reader and editor, built in pure Rust."
Description: "PdfCraft is an open-source modern PDF reader and editor for reading, organizing, combining, splitting and securing PDFs, written from scratch in pure Rust. It is MIT OR Apache-2.0 licensed and runs natively on Windows, macOS and Linux."
