PackageIdentifier: ArtCraft.MaterialCraft
PackageVersion: 0.2.0
PackageLocale: zh-CN
ShortDescription: 以纯 Rust 构建的节点式程序化材质编辑器，用于制作可平铺的 PBR 材质。
Description: |-
  程序化材质；一个以纯 Rust 从零构建的开源节点式材质设计器。

  在节点图里用噪声、图案与滤镜拼出可平铺的 PBR 材质，在 2D 视图和 3D 模型上实时预览，并把贴图导出给任意引擎使用。它可在 macOS、Windows、Linux 和 FreeBSD 上原生运行，也能通过 WebAssembly 在浏览器中运行。

  - 工作区包含资源管理器、材质库、节点图、3D 视图、2D 视图和属性面板，采用熟悉的节点编辑器布局。
  - 天生可平铺：带各向异性纹理的木板、发光缝隙上的开裂熔岩石、高度混合的苔藓地面等图都能无缝重复。
  - 新节点图可以从 PBR 模板或示例材质开始，拖动时即时解算。
  - 导出的贴图使用开放格式，并能与 TextureCraft 配合使用。
  - 为 agent 准备好：同一个引擎可以通过 materialcraft-cli 从命令行调用。
