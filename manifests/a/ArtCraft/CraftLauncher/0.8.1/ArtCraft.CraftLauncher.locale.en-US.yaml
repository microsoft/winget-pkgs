ShortDescription: Install, update, and open every app in the Craft App Suite from one place.
Description: |-
  ArtCraft Launcher is one place to install, update, and open every app in the Craft App Suite, rebuilt in pure Rust: PhotoCraft, LightCraft, FilmCraft, DesignCraft, VectorCraft, PdfCraft, EffectCraft, WordCraft, DeckCraft, GridCraft, CADCraft, and SoundCraft.

  The Craft apps each ship their own builds for every platform. ArtCraft Launcher saves you from hunting through a dozen release pages: it lists every app in the suite, shows which ones you have and which version, installs the right build for your operating system and processor, and tells you when an update is out. It is a small native app that can sit in your menu bar or system tray.

  Features
  - Install in one click: picks the right download for your OS and CPU (DMG, MSI, AppImage, .deb, .rpm and more), checks it against the release's SHA-256 checksums, and installs it.
  - Stay up to date: checks each app's GitHub releases and updates the ones you have, with a notification when there is something new.
  - Always at hand: opens any Craft app from one window, or from the tray and menu-bar icon. Native egui, no Electron, no web view.
