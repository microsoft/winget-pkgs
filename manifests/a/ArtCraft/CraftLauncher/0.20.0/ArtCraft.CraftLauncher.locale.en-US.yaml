ReleaseNotes: |-
  Highlights
  - Developer Builds: an opt-in page for nightly builds of Craft apps, with strict signature checks on Windows, macOS and Linux. Until a signed nightly is published it shows "No developer builds are available yet." If you never opt in, nothing changes.
  - One AI entry for every app: AI agents reach every installed Craft app through a single MCP entry. The gateway ships with the launcher and is signed on its own. A new Local Services panel detects Craft apps and manages LM Studio MCP entries.
  - Fonts tab: manage fonts and preview them.
  - Announcements: a header bell shows announcements from a signed file on getartcraft.com.
  - Smoother installs: apps download one at a time in the order shown, Linux "Update all" asks for your password once, and on Windows you can add a desktop shortcut from an app's ⋯ menu.
  - Languages: Ukrainian and Bosnian.
