PackageIdentifier: ArtCraft.CraftLauncher
PackageVersion: 0.1.0
PackageLocale: zh-CN
ShortDescription: 在一个地方安装、更新并打开 Craft 应用套件中的所有应用。
Description: |-
  ArtCraft Launcher 让你可以从一个地方安装、更新并打开 Craft 应用套件中的所有应用，全部以纯 Rust 重建：PhotoCraft、LightCraft、FilmCraft、DesignCraft、VectorCraft、PdfCraft、EffectCraft、WordCraft、DeckCraft、GridCraft、CADCraft 和 SoundCraft。

  每个 Craft 应用都为各个平台发布自己的构建版本。ArtCraft Launcher 免去了你在十几个发布页面之间翻找的麻烦：它列出套件中的每个应用，显示你已安装了哪些以及版本号，为你的操作系统和处理器安装正确的构建版本，并在有更新时提醒你。它是一个常驻菜单栏或系统托盘的小型原生应用。

  功能
  - 一键安装：为你的操作系统和 CPU 选择正确的下载（DMG、MSI、AppImage、.deb、.rpm 等），对照发布版的 SHA-256 校验和检查后安装。
  - 保持更新：检查每个应用的 GitHub 发布并更新已安装的应用，有新内容时发送通知。
  - 随手可得：从一个窗口或托盘、菜单栏图标打开任意 Craft 应用。原生 egui，无 Electron，无 WebView。
