PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.5.1
PackageLocale: it-IT
ShortDescription: Progettazione di interfacce e prototipi con layout automatico, componenti, reti vettoriali e collaborazione in tempo reale.
Description: |-
  FigCraft è un’applicazione per la progettazione di interfacce e la prototipazione, sviluppata in Rust. Funziona offline e salva i progetti in file .figcraft locali.

  Progetta schermate con cornici, layout automatico, componenti e varianti, reti vettoriali, stili e variabili. Crea prototipi interattivi con transizioni animate e usa la modalità sviluppatore per consultare misure, aggiungere annotazioni e generare codice CSS, HTML, React, SwiftUI e Compose.

  Ospita sessioni di collaborazione in tempo reale dall’applicazione o dal tuo server. Importa SVG, immagini, PDF e file .fig ed esporta i livelli in PNG, JPG, WebP, SVG o PDF. Lo strumento da riga di comando, il canale di controllo JSON e il server MCP permettono di accedere allo stesso motore di comandi dell’applicazione grafica.
