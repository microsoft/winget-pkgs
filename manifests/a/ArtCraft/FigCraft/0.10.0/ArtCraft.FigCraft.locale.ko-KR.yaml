PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: ko-KR
ShortDescription: 자동 레이아웃, 컴포넌트, 벡터 네트워크 및 실시간 협업을 지원하는 인터페이스 디자인과 프로토타이핑 앱입니다.
Description: |-
  FigCraft는 Rust로 개발된 인터페이스 디자인 및 프로토타이핑 앱입니다. 오프라인으로 작동하며 디자인을 로컬 .figcraft 파일로 저장합니다.

  프레임, 자동 레이아웃, 컴포넌트와 변형, 벡터 네트워크, 스타일 및 변수를 사용해 화면을 디자인할 수 있습니다. 애니메이션 전환이 있는 인터랙티브 프로토타입을 만들고, 개발자 모드에서 치수와 주석을 확인하거나 CSS, HTML, React, SwiftUI 및 Compose 코드를 생성할 수 있습니다.

  앱이나 자체 서버에서 실시간 협업 세션을 호스팅할 수 있습니다. SVG, 이미지, PDF 및 .fig 파일을 가져오고 레이어를 PNG, JPG, WebP, SVG 또는 PDF로 내보낼 수 있습니다. 명령줄 도구, JSON 제어 채널 및 MCP 서버를 통해 그래픽 앱과 동일한 명령 엔진에 접근할 수 있습니다.
