PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: de-DE
ShortDescription: Oberflächendesign und Prototyping mit automatischem Layout, Komponenten, Vektornetzwerken und Zusammenarbeit in Echtzeit.
Description: |-
  FigCraft ist eine in Rust entwickelte Anwendung für Oberflächendesign und Prototyping. Sie funktioniert offline und speichert Entwürfe in lokalen .figcraft-Dateien.

  Gestalten Sie Bildschirme mit Frames, automatischem Layout, Komponenten und Varianten, Vektornetzwerken, Stilen und Variablen. Erstellen Sie interaktive Prototypen mit animierten Übergängen und nutzen Sie den Entwicklermodus für Maße, Anmerkungen und generierten CSS-, HTML-, React-, SwiftUI- und Compose-Code.

  Hosten Sie Sitzungen zur Zusammenarbeit in Echtzeit über die Anwendung oder Ihren eigenen Server. Importieren Sie SVG, Bilder, PDF und .fig-Dateien und exportieren Sie Ebenen als PNG, JPG, WebP, SVG oder PDF. Das Befehlszeilenwerkzeug, der JSON-Steuerkanal und der MCP-Server bieten Zugriff auf dieselbe Befehls-Engine wie die grafische Anwendung.
