PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: es-ES
ShortDescription: Diseño de interfaces y prototipos con diseño automático, componentes, redes vectoriales y colaboración en tiempo real.
Description: |-
  FigCraft es una aplicación de diseño de interfaces y creación de prototipos desarrollada en Rust. Funciona sin conexión y guarda los diseños en archivos .figcraft locales.

  Diseña pantallas con marcos, diseño automático, componentes y variantes, redes vectoriales, estilos y variables. Crea prototipos interactivos con transiciones animadas y utiliza el modo de desarrollo para consultar medidas, añadir anotaciones y generar código CSS, HTML, React, SwiftUI y Compose.

  Organiza sesiones de colaboración en tiempo real desde la aplicación o tu propio servidor. Importa SVG, imágenes, PDF y archivos .fig, y exporta capas a PNG, JPG, WebP, SVG o PDF. La herramienta de línea de comandos, el canal de control JSON y el servidor MCP permiten acceder al mismo motor de comandos que la aplicación gráfica.
