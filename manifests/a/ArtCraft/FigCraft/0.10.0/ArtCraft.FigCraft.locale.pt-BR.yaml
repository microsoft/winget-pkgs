PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: pt-BR
ShortDescription: Design de interfaces e prototipagem com layout automático, componentes, redes vetoriais e colaboração em tempo real.
Description: |-
  FigCraft é um aplicativo de design de interfaces e prototipagem desenvolvido em Rust. Funciona offline e salva os projetos em arquivos .figcraft locais.

  Crie telas com quadros, layout automático, componentes e variantes, redes vetoriais, estilos e variáveis. Crie protótipos interativos com transições animadas e use o modo de desenvolvedor para consultar medidas, adicionar anotações e gerar código CSS, HTML, React, SwiftUI e Compose.

  Hospede sessões de colaboração em tempo real pelo aplicativo ou pelo seu próprio servidor. Importe SVG, imagens, PDF e arquivos .fig e exporte camadas para PNG, JPG, WebP, SVG ou PDF. A ferramenta de linha de comando, o canal de controle JSON e o servidor MCP dão acesso ao mesmo mecanismo de comandos do aplicativo gráfico.
