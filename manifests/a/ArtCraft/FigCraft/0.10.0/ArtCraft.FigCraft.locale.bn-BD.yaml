PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: bn-BD
ShortDescription: স্বয়ংক্রিয় লেআউট, কম্পোনেন্ট, ভেক্টর নেটওয়ার্ক ও রিয়েল-টাইম সহযোগিতাসহ ইন্টারফেস ডিজাইন ও প্রোটোটাইপ তৈরির অ্যাপ।
Description: |-
  FigCraft হলো Rust দিয়ে তৈরি ইন্টারফেস ডিজাইন ও প্রোটোটাইপ তৈরির একটি অ্যাপ। এটি অফলাইনে কাজ করে এবং ডিজাইন স্থানীয় .figcraft ফাইলে সংরক্ষণ করে।

  ফ্রেম, স্বয়ংক্রিয় লেআউট, কম্পোনেন্ট ও ভ্যারিয়েন্ট, ভেক্টর নেটওয়ার্ক, স্টাইল ও ভেরিয়েবল দিয়ে স্ক্রিন ডিজাইন করুন। অ্যানিমেটেড ট্রানজিশনসহ ইন্টারঅ্যাক্টিভ প্রোটোটাইপ তৈরি করুন এবং মাপ, টীকা ও তৈরি করা CSS, HTML, React, SwiftUI ও Compose কোডের জন্য ডেভেলপার মোড ব্যবহার করুন।

  অ্যাপ বা নিজের সার্ভার থেকে রিয়েল-টাইম সহযোগিতার সেশন হোস্ট করুন। SVG, ছবি, PDF ও .fig ফাইল আমদানি করুন এবং লেয়ার PNG, JPG, WebP, SVG বা PDF হিসেবে রপ্তানি করুন। কমান্ড-লাইন টুল, JSON নিয়ন্ত্রণ চ্যানেল ও MCP সার্ভার গ্রাফিক্যাল অ্যাপের একই কমান্ড ইঞ্জিন ব্যবহারের সুযোগ দেয়।
