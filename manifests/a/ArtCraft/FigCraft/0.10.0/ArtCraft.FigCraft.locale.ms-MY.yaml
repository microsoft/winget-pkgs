PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: ms-MY
ShortDescription: Reka bentuk antara muka dan prototaip dengan susun atur automatik, komponen, rangkaian vektor dan kerjasama masa nyata.
Description: |-
  FigCraft ialah aplikasi reka bentuk antara muka dan pembinaan prototaip yang dibangunkan dalam Rust. Aplikasi ini berfungsi di luar talian dan menyimpan reka bentuk sebagai fail .figcraft setempat.

  Reka skrin dengan bingkai, susun atur automatik, komponen dan varian, rangkaian vektor, gaya dan pemboleh ubah. Bina prototaip interaktif dengan peralihan beranimasi dan gunakan mod pembangun untuk ukuran, anotasi serta kod CSS, HTML, React, SwiftUI dan Compose yang dijana.

  Hoskan sesi kerjasama masa nyata melalui aplikasi atau pelayan anda sendiri. Import SVG, imej, PDF dan fail .fig, serta eksport lapisan kepada PNG, JPG, WebP, SVG atau PDF. Alat baris perintah, saluran kawalan JSON dan pelayan MCP menyediakan akses kepada enjin perintah yang sama seperti aplikasi grafik.
