ShortDescription: ऑटो लेआउट, कंपोनेंट, वेक्टर नेटवर्क और रीयल-टाइम सहयोग के साथ इंटरफ़ेस डिज़ाइन और प्रोटोटाइप बनाने का टूल।
Description: |-
  FigCraft, Rust में बनाया गया इंटरफ़ेस डिज़ाइन और प्रोटोटाइप बनाने का ऐप है। यह ऑफ़लाइन काम करता है और डिज़ाइन को स्थानीय .figcraft फ़ाइलों में सहेजता है।

  फ़्रेम, ऑटो लेआउट, कंपोनेंट और उनके वेरिएंट, वेक्टर नेटवर्क, स्टाइल और वेरिएबल से स्क्रीन डिज़ाइन करें। ऐनिमेटेड ट्रांज़िशन वाले इंटरैक्टिव प्रोटोटाइप बनाएँ और माप, टिप्पणियों तथा जनरेट किए गए CSS, HTML, React, SwiftUI और Compose कोड के लिए डेवलपर मोड का उपयोग करें।

  ऐप या अपने सर्वर से रीयल-टाइम सहयोग सत्र होस्ट करें। SVG, इमेज, PDF और .fig फ़ाइलें आयात करें और लेयर को PNG, JPG, WebP, SVG या PDF में निर्यात करें। कमांड-लाइन टूल, JSON कंट्रोल चैनल और MCP सर्वर उसी कमांड इंजन का इस्तेमाल करते हैं जो ग्राफ़िकल ऐप में है।
