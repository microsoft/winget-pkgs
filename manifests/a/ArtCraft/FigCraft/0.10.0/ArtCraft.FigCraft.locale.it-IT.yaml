PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: it-IT
ShortDescription: Progettazione di interfacce e prototipi con layout automatico, componenti, reti vettoriali e collaborazione in tempo reale.
Description: |-
  FigCraft, scritto in Rust, consente di progettare interfacce e realizzare prototipi. Può essere usato senza connessione Internet e salva i documenti sul computer nel formato .figcraft.

  L'editor offre riquadri, disposizione automatica, componenti con varianti, reti vettoriali, stili e variabili. I prototipi possono includere interazioni e transizioni animate. La vista per sviluppatori mostra misure e annotazioni e produce codice CSS, HTML, React, SwiftUI e Compose.

  Le sessioni di lavoro condiviso in tempo reale possono essere ospitate nell'app oppure su un server proprio. È possibile importare SVG, immagini, PDF e documenti .fig ed esportare i livelli nei formati PNG, JPG, WebP, SVG e PDF. L'interfaccia a riga di comando, il canale JSON di controllo e il server MCP danno accesso al medesimo sistema di comandi utilizzato dall'interfaccia grafica.
