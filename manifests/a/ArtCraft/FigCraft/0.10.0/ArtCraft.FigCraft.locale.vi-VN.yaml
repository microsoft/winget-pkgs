ShortDescription: Thiết kế giao diện và tạo nguyên mẫu với bố cục tự động, thành phần, mạng vectơ và cộng tác theo thời gian thực.
Description: |-
  FigCraft là ứng dụng thiết kế giao diện và tạo nguyên mẫu được xây dựng bằng Rust. Ứng dụng hoạt động ngoại tuyến và lưu thiết kế dưới dạng tệp .figcraft trên máy của bạn.

  Thiết kế màn hình bằng khung, bố cục tự động, thành phần và biến thể, mạng vectơ, kiểu và biến. Tạo nguyên mẫu tương tác với hiệu ứng chuyển tiếp động và sử dụng chế độ nhà phát triển để xem số đo, thêm chú thích và tạo mã CSS, HTML, React, SwiftUI và Compose.

  Tổ chức các phiên cộng tác theo thời gian thực từ ứng dụng hoặc máy chủ riêng của bạn. Nhập SVG, hình ảnh, PDF và tệp .fig, rồi xuất các lớp sang PNG, JPG, WebP, SVG hoặc PDF. Công cụ dòng lệnh, kênh điều khiển JSON và máy chủ MCP cung cấp quyền truy cập vào cùng bộ máy lệnh được ứng dụng đồ họa sử dụng.
