PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: fr-FR
ShortDescription: Conception d’interfaces et prototypage avec mise en page automatique, composants, réseaux vectoriels et collaboration en direct.
Description: |-
  FigCraft est une application de conception d’interfaces et de prototypage développée en Rust. Elle fonctionne hors ligne et enregistre les créations dans des fichiers .figcraft locaux.

  Concevez des écrans à l’aide de cadres, de la mise en page automatique, de composants et de variantes, de réseaux vectoriels, de styles et de variables. Créez des prototypes interactifs avec des transitions animées et utilisez le mode développeur pour consulter les mesures, ajouter des annotations et générer du code CSS, HTML, React, SwiftUI et Compose.

  Hébergez des sessions de collaboration en temps réel depuis l’application ou votre propre serveur. Importez des SVG, des images, des PDF et des fichiers .fig, et exportez les calques en PNG, JPG, WebP, SVG ou PDF. L’outil en ligne de commande, le canal de contrôle JSON et le serveur MCP donnent accès au même moteur de commandes que l’application graphique.
