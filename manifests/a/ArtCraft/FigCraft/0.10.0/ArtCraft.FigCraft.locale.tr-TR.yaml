PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: tr-TR
ShortDescription: Otomatik düzen, bileşenler, vektör ağları ve gerçek zamanlı iş birliğiyle arayüz tasarımı ve prototip oluşturma.
Description: |-
  FigCraft, Rust ile geliştirilmiş bir arayüz tasarımı ve prototip oluşturma uygulamasıdır. Çevrimdışı çalışır ve tasarımları yerel .figcraft dosyalarında saklar.

  Çerçeveler, otomatik düzen, bileşenler ve varyantlar, vektör ağları, stiller ve değişkenlerle ekranlar tasarlayın. Animasyonlu geçişlerle etkileşimli prototipler oluşturun; ölçümler, açıklamalar ve üretilen CSS, HTML, React, SwiftUI ve Compose kodları için geliştirici modunu kullanın.

  Uygulamadan veya kendi sunucunuzdan gerçek zamanlı iş birliği oturumları düzenleyin. SVG, görsel, PDF ve .fig dosyalarını içe aktarın; katmanları PNG, JPG, WebP, SVG veya PDF olarak dışa aktarın. Komut satırı aracı, JSON kontrol kanalı ve MCP sunucusu, grafik uygulamayla aynı komut motoruna erişim sağlar.
