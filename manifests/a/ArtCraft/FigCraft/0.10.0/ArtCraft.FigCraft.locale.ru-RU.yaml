PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: ru-RU
ShortDescription: Дизайн интерфейсов и прототипирование с автоматической компоновкой, компонентами, векторными сетями и совместной работой.
Description: |-
  FigCraft — приложение для дизайна интерфейсов и прототипирования, написанное на Rust. Оно работает без подключения к интернету и сохраняет проекты в локальные файлы .figcraft.

  Создавайте экраны с помощью фреймов, автоматической компоновки, компонентов и вариантов, векторных сетей, стилей и переменных. Создавайте интерактивные прототипы с анимированными переходами и используйте режим разработчика для измерений, аннотаций и генерации кода CSS, HTML, React, SwiftUI и Compose.

  Организуйте сеансы совместной работы в реальном времени через приложение или собственный сервер. Импортируйте SVG, изображения, PDF и файлы .fig, экспортируйте слои в PNG, JPG, WebP, SVG или PDF. Инструмент командной строки, канал управления JSON и сервер MCP предоставляют доступ к тому же движку команд, что и графическое приложение.
