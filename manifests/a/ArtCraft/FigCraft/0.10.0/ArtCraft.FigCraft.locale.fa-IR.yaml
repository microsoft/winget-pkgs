ShortDescription: طراحی رابط کاربری و نمونه‌سازی با چیدمان خودکار، مؤلفه‌ها، شبکه‌های برداری و همکاری هم‌زمان.
Description: |-
  FigCraft یک برنامهٔ طراحی رابط کاربری و نمونه‌سازی است که با Rust ساخته شده است. این برنامه بدون اتصال به اینترنت کار می‌کند و طرح‌ها را در فایل‌های محلی .figcraft ذخیره می‌کند.

  با استفاده از فریم‌ها، چیدمان خودکار، مؤلفه‌ها و گونه‌های آن‌ها، شبکه‌های برداری، سبک‌ها و متغیرها صفحه طراحی کنید. نمونه‌های تعاملی با گذارهای متحرک بسازید و برای اندازه‌گیری، یادداشت‌گذاری و تولید کد CSS، HTML، React، SwiftUI و Compose از حالت توسعه‌دهنده استفاده کنید.

  جلسه‌های همکاری هم‌زمان را از طریق برنامه یا سرور خود میزبانی کنید. SVG، تصاویر، PDF و فایل‌های .fig را وارد کنید و لایه‌ها را به PNG، JPG، WebP، SVG یا PDF خروجی بگیرید. ابزار خط فرمان، کانال کنترل JSON و سرور MCP دسترسی به همان موتور فرمانی را فراهم می‌کنند که برنامهٔ گرافیکی از آن استفاده می‌کند.
