ShortDescription: تصميم الواجهات وإنشاء النماذج الأولية مع تخطيط تلقائي ومكوّنات وشبكات متجهية وتعاون مباشر.
Description: |-
  FigCraft تطبيق لتصميم الواجهات وإنشاء النماذج الأولية، مبني بلغة Rust. يعمل دون اتصال بالإنترنت ويحفظ التصاميم محليًا في ملفات .figcraft.

  صمّم الشاشات باستخدام الإطارات والتخطيط التلقائي والمكوّنات وأشكالها المختلفة والشبكات المتجهية والأنماط والمتغيّرات. أنشئ نماذج أولية تفاعلية بانتقالات متحركة، واستخدم وضع المطوّر للاطّلاع على القياسات وإضافة التعليقات التوضيحية وتوليد شيفرات CSS وHTML وReact وSwiftUI وCompose.

  استضف جلسات تعاون مباشر من التطبيق أو من خادمك الخاص. استورد ملفات SVG والصور وPDF و.fig، وصدّر الطبقات بصيغ PNG أو JPG أو WebP أو SVG أو PDF. تتيح أداة سطر الأوامر وقناة التحكم عبر JSON وخادم MCP الوصول إلى محرك الأوامر نفسه المستخدم في الواجهة الرسومية.
