ShortDescription: ออกแบบส่วนติดต่อและสร้างต้นแบบด้วยการจัดวางอัตโนมัติ คอมโพเนนต์ เครือข่ายเวกเตอร์ และการทำงานร่วมกันแบบเรียลไทม์
Description: |-
  FigCraft เป็นแอปออกแบบส่วนติดต่อและสร้างต้นแบบที่พัฒนาด้วย Rust ทำงานแบบออฟไลน์และบันทึกงานออกแบบเป็นไฟล์ .figcraft ในเครื่อง

  ออกแบบหน้าจอด้วยเฟรม การจัดวางอัตโนมัติ คอมโพเนนต์และรูปแบบย่อย เครือข่ายเวกเตอร์ สไตล์ และตัวแปร สร้างต้นแบบแบบโต้ตอบพร้อมการเปลี่ยนหน้าจอที่มีแอนิเมชัน และใช้โหมดนักพัฒนาเพื่อดูขนาด เพิ่มคำอธิบายประกอบ และสร้างโค้ด CSS, HTML, React, SwiftUI และ Compose

  โฮสต์เซสชันการทำงานร่วมกันแบบเรียลไทม์จากแอปหรือเซิร์ฟเวอร์ของคุณเอง นำเข้า SVG รูปภาพ PDF และไฟล์ .fig และส่งออกเลเยอร์เป็น PNG, JPG, WebP, SVG หรือ PDF เครื่องมือบรรทัดคำสั่ง ช่องทางควบคุม JSON และเซิร์ฟเวอร์ MCP ใช้กลไกคำสั่งเดียวกับแอปแบบกราฟิก
