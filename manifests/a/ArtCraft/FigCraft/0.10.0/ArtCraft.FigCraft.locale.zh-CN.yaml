PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: zh-CN
ShortDescription: 界面设计与原型制作工具，支持自动布局、组件、矢量网络和实时协作。
Description: |-
  FigCraft 是一款使用 Rust 构建的界面设计与原型制作应用。它支持离线使用，并将设计保存为本地 .figcraft 文件。

  使用画框、自动布局、组件与变体、矢量网络、样式和变量设计界面。通过动画过渡创建交互式原型，并使用开发者模式查看尺寸、添加注释，以及生成 CSS、HTML、React、SwiftUI 和 Compose 代码。

  通过应用或自己的服务器主持实时协作会话。导入 SVG、图像、PDF 和 .fig 文件，并将图层导出为 PNG、JPG、WebP、SVG 或 PDF。命令行工具、JSON 控制通道和 MCP 服务器与图形界面使用同一套命令引擎。
