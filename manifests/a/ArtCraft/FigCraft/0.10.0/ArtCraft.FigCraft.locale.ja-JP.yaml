PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: ja-JP
ShortDescription: 自動レイアウト、コンポーネント、ベクターネットワーク、リアルタイム共同編集に対応したインターフェースデザインとプロトタイピングのアプリ。
Description: |-
  FigCraft は Rust で開発されたインターフェースデザインとプロトタイピングのアプリです。オフラインで動作し、デザインをローカルの .figcraft ファイルに保存します。

  フレーム、自動レイアウト、コンポーネントとバリアント、ベクターネットワーク、スタイル、変数を使って画面をデザインできます。アニメーション付きの画面遷移を備えたインタラクティブなプロトタイプを作成し、開発者モードで寸法や注釈を確認したり、CSS、HTML、React、SwiftUI、Compose のコードを生成したりできます。

  アプリまたは自分のサーバーからリアルタイム共同編集のセッションをホストできます。SVG、画像、PDF、.fig ファイルを読み込み、レイヤーを PNG、JPG、WebP、SVG、PDF に書き出せます。コマンドラインツール、JSON 制御チャネル、MCP サーバーから、グラフィカルアプリと同じコマンドエンジンにアクセスできます。
