PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: ur-PK
ShortDescription: خودکار لے آؤٹ، اجزا، ویکٹر نیٹ ورکس اور براہِ راست اشتراک کے ساتھ انٹرفیس ڈیزائن اور پروٹوٹائپ بنانے کی ایپ۔
Description: |-
  FigCraft، Rust میں تیار کردہ انٹرفیس ڈیزائن اور پروٹوٹائپ بنانے کی ایپ ہے۔ یہ آف لائن کام کرتی ہے اور ڈیزائن مقامی .figcraft فائلوں میں محفوظ کرتی ہے۔

  فریمز، خودکار لے آؤٹ، اجزا اور ان کی مختلف صورتوں، ویکٹر نیٹ ورکس، اسٹائلز اور متغیرات کے ذریعے اسکرینیں ڈیزائن کریں۔ متحرک انتقالات کے ساتھ تعاملی پروٹوٹائپ بنائیں اور پیمائشوں، تشریحی نوٹس اور تیار کردہ CSS، HTML، React، SwiftUI اور Compose کوڈ کے لیے ڈیولپر موڈ استعمال کریں۔

  ایپ یا اپنے سرور سے براہِ راست اشتراک کے سیشنز کی میزبانی کریں۔ SVG، تصاویر، PDF اور .fig فائلیں درآمد کریں اور لیئرز کو PNG، JPG، WebP، SVG یا PDF میں برآمد کریں۔ کمانڈ لائن ٹول، JSON کنٹرول چینل اور MCP سرور اسی کمانڈ انجن تک رسائی دیتے ہیں جو گرافیکل ایپ میں استعمال ہوتا ہے۔
