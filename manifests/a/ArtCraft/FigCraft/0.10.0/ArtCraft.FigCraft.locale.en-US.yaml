ShortDescription: Interface design and prototyping with auto layout, components, vector networks and live collaboration.
Description: |-
  FigCraft is an interface design and prototyping app built in Rust. It works offline and stores designs as local .figcraft files.

  Design screens with frames, auto layout, components and variants, vector networks, styles and variables. Create interactive prototypes with animated transitions, and use Dev Mode for measurements, annotations and generated CSS, HTML, React, SwiftUI and Compose code.

  Host live collaboration sessions from the app or your own server. Import SVG, images, PDF and .fig files, and export layers to PNG, JPG, WebP, SVG or PDF. The command-line tool, JSON control channel and MCP server expose the same command engine as the graphical app.
