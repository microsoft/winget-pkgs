PackageIdentifier: ArtCraft.FigCraft
PackageVersion: 0.10.0
PackageLocale: tl-PH
ShortDescription: Pagdisenyo ng interface at paggawa ng prototype na may awtomatikong layout, mga component, vector network at sabayang pagtutulungan.
Description: |-
  Ang FigCraft ay isang app para sa pagdisenyo ng interface at paggawa ng prototype na binuo gamit ang Rust. Gumagana ito nang offline at nagse-save ng mga disenyo sa mga lokal na .figcraft file.

  Magdisenyo ng mga screen gamit ang mga frame, awtomatikong layout, mga component at variant, vector network, estilo at variable. Gumawa ng mga interactive na prototype na may mga animated na transition, at gamitin ang developer mode para sa mga sukat, anotasyon at pagbuo ng CSS, HTML, React, SwiftUI at Compose code.

  Mag-host ng mga sesyon ng sabayang pagtutulungan mula sa app o sa sarili mong server. Mag-import ng SVG, mga larawan, PDF at .fig file, at mag-export ng mga layer sa PNG, JPG, WebP, SVG o PDF. Nagbibigay ang command-line tool, JSON control channel at MCP server ng access sa parehong command engine na ginagamit ng graphical na app.
