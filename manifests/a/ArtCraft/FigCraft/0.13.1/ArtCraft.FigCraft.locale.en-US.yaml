ShortDescription: "Interface design and prototyping: open source, collaborative and built in pure Rust."
Description: "FigCraft is an open-source interface design and prototyping tool with frames, auto layout, components and variants, vector networks, styles, variables and prototypes, written from scratch in pure Rust. It is MIT OR Apache-2.0 licensed and runs natively on Windows, macOS and Linux."
