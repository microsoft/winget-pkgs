ReleaseNotes: |-
  ## What's Changed
  * Honor CARGO_BUILD_TARGET in FreeBSD packaging for aarch64 release builds by @dylanmtaylor in https://github.com/storytold/figcraft/pull/1475
  * M8: repair and library manifests check membership by set lookups (#1078) by @StrajnarFilip in https://github.com/storytold/figcraft/pull/1480
  * M8: normalising after a command runs under the panic guard (part of #1085) by @StrajnarFilip in https://github.com/storytold/figcraft/pull/1481
  * M1: the stroke weight keeps room for its value beside the variable button (#1452) by @StrajnarFilip in https://github.com/storytold/figcraft/pull/1482
  * M1: page ruler guides survive save and reopen (#1476) by @StrajnarFilip in https://github.com/storytold/figcraft/pull/1485
  * fix(present): prototype links open only behind the notice or a viewer's click (#1096) by @ChristopherLinnett in https://github.com/storytold/figcraft/pull/1487
  * i18n(sv): translate 47 new strings by @kler in https://github.com/storytold/figcraft/pull/1393
  * i18n(ka): Georgian for 76 strings added since the language landed by @devius in https://github.com/storytold/figcraft/pull/1443
  * M9: a ping every keep-alive interval, whatever else the client sends by @samhyun in https://github.com/storytold/figcraft/pull/1424
  * fix(ui): right-click on a frame's name label picks that frame by @watchakorn-18k in https://github.com/storytold/figcraft/pull/1470
  * fix(app): ask before ⌘Q quits with unsaved changes (#857) by @ChristopherLinnett in https://github.com/storytold/figcraft/pull/1489
  * M6: .fig embedded images are copied once per blob, not once per hash (#1059) by @StrajnarFilip in https://github.com/storytold/figcraft/pull/1486
  * fix(collab): image entries must match their hash and sane bounds (#1086) by @ChristopherLinnett in https://github.com/storytold/figcraft/pull/1488
  * M8: the browser refines a zoom only once it has paused by @samhyun in https://github.com/storytold/figcraft/pull/1468
  * M3: scaled instances keep their scale when their main is rebuilt (#922) by @StrajnarFilip in https://github.com/storytold/figcraft/pull/1484
  * M8: a progressive JPEG sampling a component finer than its first is refused, not decoded by @samhyun in https://github.com/storytold/figcraft/pull/1491
  * i18n(ar): add Arabic draft interface catalog by @hussain-hz in https://github.com/storytold/figcraft/pull/1466
  * M7: line the Home tab's divider up with the icon rail by @Skyfuller1303 in https://github.com/storytold/figcraft/pull/1462
  * feat: property copy/paste, blend-mode hover preview and clipboard fixes by @culiulemon in https://github.com/storytold/figcraft/pull/1457
  * M4: Thai lines keep marks and leading vowels with their letter (part of #1219) by @SusieeTheLinuxUser in https://github.com/storytold/figcraft/pull/1400
  * ui: show constraint guides for a selected layer in its frame by @yelintong in https://github.com/storytold/figcraft/pull/1406
  * M12: MCP comment feedback and live change events by @phonedu in https://github.com/storytold/figcraft/pull/1465
  * M4: draw dots for zero-length round dashes by @Guillergood in https://github.com/storytold/figcraft/pull/1439
  * Reject cornerRadius/padding/strokeSides arrays with non-numeric entries by @Silvertree2010 in https://github.com/storytold/figcraft/pull/1405
  * Cap Sketch image members by compression ratio and total size by @Silvertree2010 in https://github.com/storytold/figcraft/pull/1398
  * Keep the right edge of right-aligned auto-width text as it grows by @Silvertree2010 in https://github.com/storytold/figcraft/pull/1479
  * fix(engine): make Set as thumbnail affect saved files (#1428) by @Zaxaerith in https://github.com/storytold/figcraft/pull/1432
  * Reject '+' sign in NodeId::from_str by @Silvertree2010 in https://github.com/storytold/figcraft/pull/1417
  * M8: keep undo entries after a failed batch undoes an earlier edit (#1410) by @avhn in https://github.com/storytold/figcraft/pull/1419
  * Reject non-page ids in page.duplicate by @Silvertree2010 in https://github.com/storytold/f
