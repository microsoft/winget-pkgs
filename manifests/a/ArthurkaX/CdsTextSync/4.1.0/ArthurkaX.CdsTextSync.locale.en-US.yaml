License: MIT
LicenseUrl: https://github.com/ArthurkaX/cds-text-sync/blob/main/LICENSE
ShortDescription: Keeps a CODESYS project in sync with plain text files in git, and drives the IDE from the command line.
Description: |-
  cds-text-sync exports a CODESYS project to plain text files, one per object, imports
  changes back, and runs builds, downloads and tests through an in-IDE agent with the
  cts command. Built for git workflows and for AI coding agents, which learn it from
  cts --help.
Moniker: cds-text-sync
Tags:
- codesys
- plc
- iec-61131-3
- structured-text
- git
- automation
InstallationNotes: |-
  Next: close CODESYS and run `cts install --toolbar` to add the menu entry, the in-IDE agent and the toolbar button.
  After `winget upgrade`, run `cts install` again so the agent matches cts.
