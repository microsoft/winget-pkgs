ShortDescription: AI-assisted engineering IDE for PLC programming with Siemens TIA Portal and CODESYS
Description: |-
  AnyAutomation Studio is a desktop IDE for PLC engineers. It connects to Siemens TIA Portal (V15 through V21 over the official Openness API) and CODESYS 3.5 and puts the engineering loop into one workspace: an AI assistant that generates, refactors and explains SCL with the real tags and data types of the project, using the AI provider of your choice (cloud with your own key, or local models via Ollama, LM Studio, vLLM and SGLang); SCL unit tests on PLCSIM Advanced or a real S7 PLC with a CI/CD runner; PLC online monitoring over native S7 and OPC UA; bulk block export and import as Git-friendly text sources; block and project compare; a Git client; a reusable block library (Forge); an EPLAN connector; FUXA web SCADA generation; and an AES-256 password vault for know-how protection. TIA Portal or CODESYS must be installed on the same machine for the respective features. Free 30-day trial, then a subscription.
