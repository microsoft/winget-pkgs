ShortDescription: Command-line tool for developing and deploying Apify Actors
Description: Apify CLI is the command-line tool for creating, developing and deploying Apify Actors and for managing the Apify cloud platform from your terminal. It runs Actors locally with a simulated Apify environment, deploys them to the platform, and manages Actors, builds, runs, datasets, key-value stores, request queues, tasks and secrets.
