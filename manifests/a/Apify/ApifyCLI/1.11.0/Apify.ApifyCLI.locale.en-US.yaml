ReleaseNotes: |-
  1.11.0 (2026-10-29)
  🚀 Features
  - Require Node.js 22 or newer (#1403) (f26ca62) by @l2ysho
  - Add --apply-env-vars-to-build flag to push (#734) (#1345) (216cc15) by @MatousMarik
  - Read applyEnvVarsToBuild from actor.json in push (#734) (#1346) (4e9f83d) by @MatousMarik
  - One token resolution order across every command (#1431) (c01872b) by @l2ysho
  - Auth.json v2 with profiles keyed by user ID (#1434) (56475cc) by @l2ysho
  - Key secrets by user ID on both backends (#1450) (3cfddd5) by @l2ysho
  - Make token login additive across accounts (#1458) (4708c1c) by @l2ysho
  - Add --profile, auth switch, auth list and per-account logout (#1459) (22812c6) by @l2ysho
  - Log in through OAuth 2.0 device code by default (#1402) (75603a8) by @vladfrangu
  - Detect dockerContextDir in apify push and refuse monorepo Actors before any write (#1502) (bd0f69d) by @DaveHanns
  - Warn before apify mcp install embeds an expiring OAuth token (#1529) (556263b) by @l2ysho
  🐛 Bug Fixes
  - run: Purge local stores from the correct directory (#1404) (d292f92) by @l2ysho
  - Restore retry backoff when removing files (#1394) (7c97865) by @roli-lpci
  - kvs: Write record metadata sidecars for input files (#1416) (e9fb806) by @janbuchar
  - create: Make the local-only source option say nothing is uploaded (#1397) (44ea854) by @l2ysho
  - deps: Align devEngines pnpm with packageManager to 11.11.0 (#1412) (05669c4) by @l2ysho
  - actors ls: Do not crash when an Actor record has no stats (#1435) (af22f50) by @l2ysho
  - Include $schema line in actor.json generated by apify init (#1507) (a97643d) by @janbuchar
  - actors info: Follow the Actor's default build for --input and --readme (#1473) (6cb3b29) by @l2ysho
  - init: Stop the name prompt looping when stdin is not a TTY (#1479) (23d6b54) by @l2ysho
  - Report the real Actor name length limit (#1484) (9f312ec) by @l2ysho
  - Stop apify upgrade reporting success after a failed binary write (#1462) (84e7fb0) by @l2ysho
  - Send --timeout 0 (no timeout) to the API in call, actors start and task run (#1491) (6a54259) by @Pijukatel
  - cli: Read stdin lazily so open pipes don't hang the CLI (#1330) (b908820) by @l2ysho
