ShortDescription: Get back what a damaged .gz, .tar.gz, .zip or Office file still holds, and extract archives fast on any CPU or an NVIDIA GPU.
Description: |-
  gzip, tar and 7-Zip stop at the first damaged byte. gpuzip rescue keeps going: it decodes a
  broken .gz, .tar.gz, .zip or Office document block by block, gives back every file that survived,
  and says exactly which bytes are certain and which are not. Office documents are rebuilt so that
  Word, Excel and PowerPoint open them.
  Healthy archives extract on every CPU core (a ZIP tests 14-20x faster than with 7-Zip), and a
  large .gz decodes in parallel on an NVIDIA GPU. RAR, 7z and the rest go to 7-Zip.
