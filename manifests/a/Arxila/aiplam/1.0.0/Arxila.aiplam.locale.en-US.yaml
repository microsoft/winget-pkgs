ShortDescription: Links the skills, subagents, rules and other artifacts of AI playbooks into the folders that coding agents read them from.
Description: |-
  aiplam (AI Playbook Manager) makes coding agents such as Claude Code, GitHub Copilot, Cursor, Codex or Gemini CLI use
  the skills, subagents, commands and rules of AI playbooks: git repositories of such artifacts, shared by a team.
  It links the artifacts of each playbook's local clone into the folders agents read them from, and keeps the links in
  step when a clone is switched to another version.
