  - fix(subtitles): one key per YouTube caption, labelled when embedded; profiles can keep manual and auto by @antonio-orionus in #401
  - docs(readme): regenerate screenshots with spotlights, add 8K HDR and subtitles shots by @antonio-orionus in #402
