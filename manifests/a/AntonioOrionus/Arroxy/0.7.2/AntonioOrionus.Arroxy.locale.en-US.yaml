ShortDescription: Free, open-source video downloader for YouTube and 2000+ other sites. Save videos, playlists, channels and audio in up to 8K HDR, and sign in through the built-in browser for private or members-only videos. No ads.
Description: "Arroxy is a free, open-source desktop app for downloading video and audio from YouTube and 2000+ other sites. Paste a link, or browse any site in the built-in Explore browser and download what you are watching: videos, Shorts, playlists and channels in up to 8K HDR at 60 fps, or audio as MP3, M4A or Opus. Download profiles remember how you like each download, and subtitles, SponsorBlock and partial downloads are built in. Sign in once in Explore to download private, members-only and age-restricted videos your account can watch, without exporting cookies. No ads, no upsells, and files go straight to the folder you choose."
