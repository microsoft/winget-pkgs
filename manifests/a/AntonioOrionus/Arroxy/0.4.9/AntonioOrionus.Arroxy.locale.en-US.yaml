  - fix(settings): serialize every settings write and roll back to canonical state by @antonio-orionus in #203
  - fix(linux): AppImage static runtime, README install guidance, theme diagnostics by @antonio-orionus in #205
  - fix(hotkey): stop bouncing ambiguous YouTube URLs back to the app by @antonio-orionus in #206
