ShortDescription: Remove tracking parameters and unwrap tracking redirects from URLs and text.
Description: |-
  url-sanitize removes tracking parameters (utm_*, fbclid, gclid, YouTube and Spotify si, and others) and unwraps tracking redirects from URLs, using the ClearURLs, Brave and Firefox rules built into the binary.
  Pass URLs as arguments or one per line on stdin, or use --text to clean every link inside a block of text and copy the rest as is. --json prints a structured result for each URL. It makes no network requests.
