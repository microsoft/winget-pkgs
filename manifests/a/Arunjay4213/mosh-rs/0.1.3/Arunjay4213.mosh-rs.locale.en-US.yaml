ShortDescription: The mobile shell (mosh) in Rust, with a native Windows client
Description: |-
  mosh-rs is a Rust reimplementation of mosh, the mobile shell, wire-compatible with mosh 1.4.
  It adds a native Windows client that runs in Windows Terminal and uses the OpenSSH client that ships with Windows,
  and an opt-in scrollback mode that puts the session's output in the local terminal's history.
  The remote host needs mosh-server from mosh-rs or mosh 1.4.
