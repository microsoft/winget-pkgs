ReleaseNotes: "<p align=\"left\">\n  <picture>\n    <source media=\"(prefers-color-scheme：dark)\" srcset=\"https://raw.githubusercontent.com/Aster-Privacy/Aster-Mail/01a79449e4706b43cd790419736ed24bfbea95c0/public/aster_mail_logo_dark.png\">\n    <img alt=\"Aster Mail\" src=\"https://raw.githubusercontent.com/Aster-Privacy/Aster-Mail/01a79449e4706b43cd790419736ed24bfbea95c0/public/aster_mail_logo_light.png\" width=\"320\">\n  </picture>\n</p>\n\n> [!NOTE]\n> These files are for new installations. If Aster Mail is already installed, it updates automatically.\n\n## What's new\n• Labels can contain other labels, and changes to folders and labels appear on your other devices right away.\n• Message details show whether the sender passed authentication checks.\n• A message shows the tracking pixels that Aster Mail blocked, grouped by domain.\n• The inbox, opened messages, and the sign-in screen appear sooner.\n\n## Fixed\n• When you search from Trash or Spam, Aster Mail searches that folder.\n• You can move messages out of Trash and Spam into the inbox or a folder.\n• Encrypted messages that didn't open before now open, including mail on accounts created in the iOS app.\n• Scheduled replies keep the sender address and the conversation that you chose.\n• Emails designed for a light background stay readable in dark mode."
