ShortDescription: Live widgets set into your Windows 11 desktop, a clock, a spectrum visualizer, synced lyrics, a player and a system monitor.
Description: One small native tray app that sets five live widgets into the desktop, under your windows. Each redraws only when something on it changes. The visualizer, lyrics and player follow whatever Spotify plays, with no Spotify login. The System widget shows CPU, RAM, GPU, drives, network and battery. A light alternative to Rainmeter. Formerly Deskbeat.
