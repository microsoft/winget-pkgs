ReleaseNotes: |-
  3.12.1:
  - Do not report a host as dead when pinging fails with an I/O error
  - Enable MAC and MAC Vendor fetchers by default for new users
  - Copy MAC address from the results menu when the MAC fetcher is active
  - Fix inflated ping times when ARP is used in addition to the selected pinger
  - Default to 100 threads again, as virtual threads get pinned to number of CPU cores, especially on Windows
  - Windows:
    - force to uninstall a previous version before installing a new one with different admin rights
    - fix IPv6 pinging (address family, reply layout, and scope ID)
    - security: prevent command injection through Windows terminal openers
    - use the actual version in installer metadata
    - show fatal startup errors instead of failing silently
    - handle ICMP API failures and size IPv6 reply buffers correctly
    - fix a crash when moving the window between monitors with different scaling
