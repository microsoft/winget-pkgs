ReleaseNotes: |-
  What's new in 2.8.1
  A small release about moving between the editor and the preview, and about motion that gets out of your way.
  - Click in the preview to place a cursor. It lands on the exact character, and Ctrl+E opens the editor right there.
  - Ctrl+E keeps your place. Switching between editor and preview lands on the same line every time, at any zoom and with proportional fonts. No more drifting down, no jump after the preview appears.
  - The outline can follow your cursor. New editor setting: Table of Contents Highlights → Cursor Line. The outline also stops flashing the first headings on Ctrl+E.
  - Smoother animations. Preview / Split / Edit slide again, without the text re-wrapping mid-slide. Pinning the outline, the tab strip and the home page stop bouncing. Outline jumps respect Animate Scrolling on Jump and reduced motion.
  - Small fixes. With line numbers off, text no longer drifts right as you zoom. Find stays in the title bar in edit mode. Toolbar settings say what each button does.
