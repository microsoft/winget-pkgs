ReleaseNotes: |-
  What's new in 2.8.4
  A small release about tables.
  - Wide tables have two settings. In Settings → Preview:
    - Wide Tables Can Exceed Max Width, off by default. On, a table wider than the text grows into the side margins, as in 2.8.0–2.8.3. Off, it stays within Max width.
    - Scroll Wide Tables, on by default. On, a table that still does not fit keeps its words whole and scrolls sideways, as on GitHub. Off, the whole table is squeezed to fit, breaking words where it has to.
    If you liked tables using the margins, turn the first one on.
  - npm audit is clean again. Two dependency advisories are fixed: source-map-js, and the copy of KaTeX that Mermaid used.
