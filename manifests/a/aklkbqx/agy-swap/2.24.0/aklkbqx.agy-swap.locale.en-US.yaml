ShortDescription: Switch Google Antigravity CLI and IDE accounts and monitor live model quotas from your terminal
Description: |-
  agy-swap is an open-source terminal UI and CLI for managing multiple Google Antigravity accounts on one machine.
  It displays live 5-hour and weekly quotas for Gemini, Claude/GPT, and weekly Gemini 4 Argon pools with local reset times, protects against background token refresh overwrites, and rotates accounts cleanly.
  Tokens stay local in vault.json (0600, not encrypted) or in Windows Credential Manager via AGY_SWAP_VAULT=keychain, with zero telemetry.
