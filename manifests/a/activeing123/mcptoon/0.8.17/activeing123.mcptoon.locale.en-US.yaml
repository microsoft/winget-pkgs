ShortDescription: Zero-dependency MCP gateway CLI that keeps tool and skill schemas out of your context window.
Description: |-
  mcptoon is a zero-dependency native CLI that manages every MCP tool and agent
  skill on your computer and shares them across all your agents with no config
  written by you. It keeps server schemas and skill bodies out of the context
  window, cutting the tool and skill footprint by about 99% (99.2% on a 255-tool
  sample; run `mcptoon usage` for your own number).

  It connects to a 17,000+ MCP tool registry and searches skills on demand, so
  nothing is pre-installed and you choose what goes in. It is self-contained:
  the package embeds its own CPython, so there is no Python to install first.
