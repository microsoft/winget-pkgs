ReleaseNotes: |-
  Editor:
  - Fixed script editor hanging forever when there's a "]" character typed right at the beginning of a new line.
  Compiler:
  - Fixed forward struct declarations. They could cause obscure mistakes sometimes.
  Engine:
  - Fixed ListBox.FillDirList() and File.GetFiles() not finding any files if request was made to search right in the game's directory. (Regression in 3.6.1)
  - Fixed inconsistent Slider handle position, introduced by a incorrect slider fix in the previous patches (Patch 12/13). The slider looks should now be synced with 3.6.0 (and higher versions).
  - Fixed "give all inventory" debug cheat reducing larger inventory item quantity to 1.
  - Fixed Software renderer not clearing surface after the room viewport is moved around screen.
  - Fixed Software renderer displaying room viewport incorrectly if it's moved partially offscreen.
  - Fixed 48khz OGG clips may have extra silence added to them in the end, causing "hickups" when the sound playback is looped.
  - Fixed particular rare OGG Vorbis clips not playing.
  - Fixed another rare case when a WAV file can get stuck in the end of the playback forever.
  Compatibility:
  - Fixed slider handle visual position in pre-3.6.0 games.
