ShortDescription: Warns you when a Microsoft Teams chat may be visible in your Teams screen share.
Description: |-
  Blindspot is a small tray app that checks about once a second whether a Teams Chat or Activity window is on the screen you are sharing in Teams.
  If it is, Blindspot plays a warning sound, turns its tray shield red, and shows a banner on a screen you are not sharing.
  It can also minimize those Teams windows during a whole-screen share.
  Everything runs locally: it reads window titles and positions only, never captures screen images, and never uses the network.
