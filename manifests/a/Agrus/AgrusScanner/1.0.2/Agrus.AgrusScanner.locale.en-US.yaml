ShortDescription: Network scanner that discovers hosts, open ports, and AI/ML services and MCP servers on your network
Description: |-
  Agrus Scanner is a native Windows network reconnaissance tool with deep AI/ML service detection.
  It performs ping sweeps, TCP port scans, and hostname resolution, then probes discovered services
  to identify over 70 AI/ML platforms (Ollama, vLLM, llama.cpp, LM Studio, ComfyUI, Stable Diffusion,
  NVIDIA Triton, Open WebUI, vector databases, GPU exporters, Docker AI containers) and Model Context
  Protocol (MCP) servers, reporting model names, versions, GPU and container details.
  Detection signatures update automatically through a cryptographically signed feed. The app also
  runs as an MCP server so AI agents such as Claude Code can use it as a network scanning tool.
