ShortDescription: Hardware inventory, sensors, benchmarks and stress tests for Windows 11 in one open-source app.
Description: |-
  HWSuite covers what CPU-Z, GPU-Z and HWMonitor do separately: processor, motherboard, memory (SPD, XMP, EXPO),
  graphics (GPU-Z style details, counterfeit check, video BIOS backup), storage health (NVMe and S.M.A.R.T.), NPU,
  battery and UPS, live sensors with alerts and CSV logging, and CPU/GPU benchmarks and stress tests.
  It includes a command-line tool (hwsuite.exe) and a WinUI 3 desktop app.
