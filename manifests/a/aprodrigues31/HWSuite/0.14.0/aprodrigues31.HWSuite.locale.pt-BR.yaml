PackageIdentifier: aprodrigues31.HWSuite
PackageVersion: 0.14.0
PackageLocale: pt-BR
Publisher: HWSuite contributors
PackageName: HWSuite
License: MPL-2.0
ShortDescription: Inventário de hardware, sensores, benchmarks e stress tests para Windows 11 num só aplicativo open source.
Description: |-
  O HWSuite reúne o que o CPU-Z, o GPU-Z e o HWMonitor fazem separadamente: processador, placa-mãe, memória (SPD, XMP,
  EXPO), vídeo (detalhes no estilo GPU-Z, detecção de falsificação, backup da BIOS de vídeo), saúde dos discos (NVMe e
  S.M.A.R.T.), NPU, bateria e nobreak, sensores ao vivo com alertas e log CSV, e benchmarks e stress tests de processador e GPU.
