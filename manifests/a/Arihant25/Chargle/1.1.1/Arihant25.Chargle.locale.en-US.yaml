ShortDescription: Plays a sound when your laptop starts or stops charging.
Description: |-
  Chargle sits in the system tray and watches the power source. Plug the charger in and it plays a
  short rising sound, pull it out and the sound falls, so you can tell what happened without
  looking at the battery icon.

  Eight sound packs are built in, all of them generated by code in the repository rather than
  recorded, and you can point the app at your own audio files instead. If you would rather not hear
  anything, it can show a small on-screen panel in its place, in a few styles and positions.

  It stays quiet during Do Not Disturb, full-screen apps and screen sharing. There is no account to
  make and no telemetry of any kind.
