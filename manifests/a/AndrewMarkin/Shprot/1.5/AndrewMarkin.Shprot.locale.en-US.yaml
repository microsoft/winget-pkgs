ShortDescription: Keeps a SOCKS5/HTTP proxy over SSH alive with auto-reconnect and health checks.
Description: |-
  Shprot is a desktop application that gives you a reliable SOCKS5 proxy over SSH without touching the command line.
  It watches your network, restarts the tunnel after network changes or waking from sleep, verifies that traffic actually passes through the tunnel, and retries rarely after authentication failures so the server doesn't ban your IP address.
  Built-in SSH key generation, host key verification and an optional HTTP proxy make it easy to set up. Requires the OpenSSH client, which is included in Windows 10 and 11.
