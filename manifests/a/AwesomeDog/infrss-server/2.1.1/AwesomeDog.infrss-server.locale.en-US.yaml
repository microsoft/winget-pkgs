ShortDescription: A standalone RSS reader backend powered by OPML and SQLite.
Description: |-
  infrss-server is a self-contained RSS reader service that does not require Thunderbird.
  It loads subscriptions from a Thunderbird-style OPML file, fetches feeds, stores articles
  and read state in SQLite, and serves the Infinite RSS Reader web interface locally.
Moniker: infrss-server
Tags:
- cli
- feed
- opml
- rss
- self-hosted
- sqlite
ReleaseNotesUrl: https://github.com/AwesomeDog/infinite-rss-reader/releases/tag/v2.1.1
InstallationNotes: Run "infrss-server --opml <path-to-feeds.opml>" to start the reader at http://localhost:7655.
