ShortDescription: Голосовой ввод на русском. Говорите, и текст появляется там, где вы печатаете. Речь распознаётся прямо на компьютере, без интернета.
Description: |-
  Говорун — умный голосовой ввод. Говорите, и текст появляется там, где вы печатаете: в мессенджере, почте, заметках, документах.

  Речь распознаётся прямо на компьютере: бесплатно, без интернета, аккаунта и подписок. Звук никуда не отправляется.

  - Диктовка в любое приложение по сочетанию клавиш. Текст появляется там, где курсор.
  - Свой словарь: имена, термины и замены.
  - Статистика: сколько слов и времени вы надиктовали.
  - Улучшение текста нейросетью (бета) — через свой OpenAI-совместимый сервер или через сервис Говоруна (тарифы: https://govorun.club/plans).
  - Синхронизация настроек, словаря и стилей с Android — по желанию, после входа.
