ShortDescription: Voice typing for Russian. Speak, and the text appears where you type. Speech is recognized on your computer, offline.
Description: |-
  Govorun is voice typing for the Russian language. Press a hotkey, speak, and the text appears where the cursor is: in messengers, mail, notes and documents.

  Speech is recognized right on your computer: free, offline, with no account or subscription. Audio never leaves the device.

  Optional online text improvement (beta) works through your own OpenAI-compatible server or the Govorun service (plans: https://govorun.club/plans).

  The interface is in Russian.
