ShortDescription: View and query Parquet, CSV, JSON and Excel files
Description: |-
  ParVu views and queries large Parquet, CSV, JSON and Excel files with DuckDB, without loading them into memory.
  Filter, sort, clean, reshape and edit tables without SQL, or use full DuckDB SQL; add formula columns, charts and conditional formatting, and save to Parquet, CSV, JSON, Excel or Markdown.
  An MCP server lets Claude and other AI clients work on the open tables; every change they make is approved in ParVu first.
  Free for noncommercial use; commercial use needs a commercial license.
