ShortDescription: Interactive TUI installer for the Aetheris control plane on Windows (Docker based)
Description: Interactive archinstall-style wizard (arrow-key navigation, no emoji) that sets up the Aetheris control plane on Windows. It manages the required dependencies through winget (Docker Desktop, Git for Windows, Node.js LTS, Python 3.12), clones aetheris-app and brings up the full Docker stack (web, worker, backend, PostgreSQL, Redis), or tears it all down again. Supports --deps, --software, --both, --uninstall and --dry-run modes.
