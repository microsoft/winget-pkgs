Publisher: Leo-Galli / Aetheris Project
PackageName: Aetheris
License: AGPL-3.0
ShortDescription: Installer interattivo per Windows del pannello di controllo cloud self-hosted Aetheris
Description: |-
  Aetheris e una piattaforma self-hosted di gestione cloud con billing, adapter
  di virtualizzazione e pannello web. Questo installer gestisce lo stack Docker,
  installa le dipendenze tramite winget (Docker Desktop, Git, Node.js, Python)
  e consente di scegliere tra PostgreSQL e SQLite per lo sviluppo.
