ReleaseNotes: |-
  Armbian Imager 2.5 sets up your board with a few answers, checks the target again right before it writes, and moves Settings to a page of its own. It also closes a few ways a write could go wrong without you noticing.

  ## First-boot profiles, guided

  New profile opens a guided setup that asks one thing at a time：network, user, language and time zone, how you sign in. Your answers collect in a column beside the questions. If you type a static address that can't work, like the broadcast address or a gateway outside the subnet, the app tells you right away. SSH keys from GitHub, GitLab or a URL get looked up before you flash, so a typo in the user name shows up there and not at first login.

  A profile can be limited to the boards it fits, and the confirm step only offers those. Profiles now work with Armbian images you build yourself, every preset answers first login's "Connect via wireless?" prompt for you, and the Wi-Fi country list has the codes that were missing.

  ## Checked again before anything is erased

  The system-disk guard used to live in the UI only. The backend now rescans before writing and accepts only a whole disk it detected itself, at the size you confirmed, so a card swapped during the password prompt is refused. Images bigger than the device are refused up front, and on EDL the app flashes the board you picked instead of the first one it finds.

  An empty image used to get through. On Linux and macOS the first 10 MiB of the card were zeroed, nothing was written, and the app said "Flash complete!". Empty or truncated images, and archives that decompress to nothing, are now stopped before the device is touched.

  Cancel works at every stage. Before, a cancel pressed during the profile step, the password prompt or the download could still erase the card. The profile step is also about 40 seconds faster on a 9 GB image, and says "Applying your profile..." instead of sitting on a frozen write bar.

  ## Settings, with a page of its own

  The gear opens a full page with five sections：General, Writing, First-boot profiles, Downloads and storage, About and support, each with its own animated scene. Updates now download in the background from About and support. Click Restart Now when you're ready; if a write is running, the restart waits for it.

  ## Twenty languages

  Greek and Serbian (Cyrillic) are in, thanks to @igorpecovnik. On first launch the app starts in your system language.

  ## A safer first-boot writer

  The ext4 writer that puts the profile into the image leaked blocks when the preset file already had content, and the kernel could then remount root read-only at first boot. Official images ship that file empty, but your own builds may not. That's fixed, and layouts the writer can't handle safely are refused before anything is written. Old images built without `metadata_csum` or `64bit` can't take a profile anymore; they still flash without one.

  ## If you flashed UFS images with a profile on 2.0.2 to 2.0.4

  Those versions wrote the profile into the UFS image itself, passwords and Wi-Fi key included (#196), so the next flash of that image carried it again, even with no profile selected. 2.5 writes the profile into a temporary copy, and on first start it deletes the UFS images cached by those versions.

  Your own local UFS `.img` files flashed with a profile on those versions carry it too. They live outside the cache, so the app can't clean them：delete or rebuild them.

  ## Also in this release

  • The success screen names what you wrote to：SD card, USB drive or disk. Thanks to @xsalaices.
  • The page numbers under the manufacturer and board grids are now a small glass pager over the cards.
  • A panel that fails to load shows the error and a Retry button instead of a skeleton that never ends. Checksum, verification and decompression errors are translated.
  • Board photos that fill their frame are no longer clipped.
  • Cache file names and deletes stay inside their folders, on Windows too.
  • Debug builds have a scenarios panel that simulates devices, write errors and network failures. Every release build is checked so none of it ships.
  • Dependency updates, and `cargo audit` now blocks CI.

