ReleaseNotes: |-
  Armbian Imager 2.5.1 fixes flashing some custom images on Windows, makes Retry work after a failed flash, and gets the tip of the day updating again.

  ## Custom images on Windows

  Images whose size isn't a whole number of 512-byte sectors, like some OpenWrt builds, failed on Windows at the very end with "The parameter is incorrect". Windows only writes whole sectors to a disk, so the last chunk is now padded with zeros up to the sector size. Verification still compares only the image's own bytes. Official Armbian images were never affected.

  ## Retry after a failed flash

  When a flash fails, the app deletes the temporary image it prepared for it：a decompressed custom image or a download that isn't cached. Retry used to look for that deleted file and fail with "file not found". Now it decompresses or downloads the image again.

  ## Tip of the day

  The tip of the day came from a feed that is no longer updated (#233). It now reads Armbian's featured feed：news, sponsors, ways to contribute, services and builds, each with its own icon. Clicking a tip opens its page.

  ## Also in this release

  • Tauri, the updater and zstd are updated, which clears the latest RustSec advisories.
  • The Linux AppImage builds again with the current appimagetool.

  ## What's Changed
  • chore(deps)：clear cargo audit and fix the AppImage repack by @SuperKali in https://github.com/armbian/imager/pull/236
  • fix(ui)：read the tip of the day from the featured feed by @SuperKali in https://github.com/armbian/imager/pull/235
  • fix(flash)：flash images with a partial last sector on Windows by @SuperKali in https://github.com/armbian/imager/pull/234


