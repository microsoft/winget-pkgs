ReleaseNotes: |-
  There are quite a lot of changes in this release, so here's a quick summary!
  > I guess I've been spending a little too much time working on Nekori, my novel-reading app, and left this project unattended for quite a while.
  >
  > I might go quiet again for at least a few months after this release, hehe. 🫠
  ✨ Features
  - Startup Splash Screen: Added two splash screen styles: Classic (Discord-like) and Modern.
  - Settings UI: Replaced Monaco Editor with a new WinUI-based application settings interface.
  - Update Settings: Added an option to disable automatic update checks on application startup.
  - DNS over HTTPS: Added support for selecting different DoH providers, with an option to bypass the System Proxy (check Settings).
  - Discord Uploads: Increased the upload size limit to 20 MB.
  - Embed Editor: Brought back the classic Embed Editor interface (enable it in BotClient plugin settings).
  - Emoji Picker: Application Emojis are now available in the Emoji Picker.
  - Direct Messages: Added the ability to open a DM with a specific user through Create Message → New Message.
  image
  🐛 Fixes
  - Fixed several issues caused by incorrect BrowserWindow context handling.
  - Security: Hardened the local Express server against several security issues reported in #383 (related fixes: #366 and #384).
  - Added Discord Token validation before making certain internal API requests.
  - Applied fixes from PRs #368 and #369.
  - Fixed an issue where some slash commands were missing: #356.
  - Fixed an issue where fetching applicationData could fail in the users/:id profile route: #365.
  - Fixed the GetExperiment IPC argument contract and handling of boolean/array inputs: #367.
  - Fixed an issue where messages could exceed Discord's 2,000-character limit.
  - Fixed incorrect skeleton loading states in Forum and Media channels.
  ⚡ Performance
  - Fixed issues with Discord protos and streamlined proto processing.
  - Removed unnecessary IPC communication between the renderer and main processes, making proto processing faster.
  🛠️ Chores & CI
  - Updated DiscordBotClient to Discord Core Stable 657850.
  - Updated Vencord to v1.15.15.
  - Updated project dependencies.
  - Added issue and feature request templates.
  - Updated GitHub Actions workflows.
  - Refactored DiscordBotClient to v3: #379.
  🙏 Special Thanks
  A huge thank you to everyone who helped identify and address security issues in this release!
  - @CopperKoi — For discovering and reporting the security vulnerability in #383.
  - @notwo1f — For assisting with the vulnerability research and investigation.
  - @khawarahemad — For contributing to the investigation and fixes.
  Some of the proposed fix PRs couldn't be merged directly because I was already working on a major refactor. However, their reports and contributions were still extremely helpful, and the necessary fixes have been incorporated into this release.
  Thank you for your time and effort! ❤️
  New Contributors
  - @rabbanyhmm made their first contribution in #365.
  - @khawarahemad made their first contribution in #367.
  📝 Notes
  - Bugs fixed 🐛
  - Probably added more bugs to fix later 🎉
  - See you again in a few months... maybe?
