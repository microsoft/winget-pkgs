ReleaseNotes: |-
  新功能
  - ui：Windows 托盘左键打开的宠物状态在鼠标未进入时 3 秒后自动收起 (#41)
  - pet：贴心宝贝自动照料优先选溢出最少的道具，没有食物时继续照顾清洁和心情 (#40)
  - pet：新增躺下休息与好友来访场景，菜单加入「一起玩耍」 (#25)
  - pet：接入走后张望、躲边、额外待机动作与小游戏图标 (#25)
  - pet：接入 GG 行走、拖拽与幼年脏/穷动作变体，动作数据集中到 ACTIONS (#25)
  - assets：补充原版 GG 动作、互动动作与快捷栏图标 (#25)
  - ui：桌面界面缩放、连点版本号显示作弊页、粉钻可开通续费
  - ui：高清模式下对话气泡使用 2 倍重绘素材 (#19)
  - ios：新增 iOS 支持与 Darwin 20 共用运行时兼容性
  修复
  - win：全屏检测加入防抖并忽略任务栏，网页视频全屏时宠物和任务栏不再无限闪烁 (#37)
  - save：存档被杀毒/同步软件短暂占用时重试写入，不再弹出主进程错误窗口 (#38)
  - ui：修复隐藏宠物后仍拦截点击和响应拖动
  - android：悬浮窗换位置时同步设置页面偏移，展开菜单和拖动时宠物不再上下跳一下 (#18)
  - pet：拖拽时以按下点校准原生光标坐标，Windows 缩放下宠物不再偏离鼠标 (#31)
  - ui：状态面板只释放自己拿到的焦点，不影响聊天、设置等面板 (#33)
  - ui：修复 macOS 托盘菜单与状态面板关闭行为
  - ui：任务完成次数不再超过要求次数 (#23)
  - exam：补齐小学艺术题库，题库缺失时不再卡死考试 (#30)
  - ui：右键菜单不再因光标移出或进入子菜单而消失 (#19)
  - ui：修复道具背景显示与宠物资料布局溢出
  优化
  - ui：将宠物状态移至右键菜单一级
