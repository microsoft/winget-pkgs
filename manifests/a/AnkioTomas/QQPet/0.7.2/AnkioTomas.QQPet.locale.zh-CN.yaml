ReleaseNotes: |-
  下载哪个
  - 完整版（约 450–520 MB，自带宠物内容，装好即用）：Windows QQPet.Setup.*.exe，macOS QQPet-*-arm64.dmg（Apple 芯片）/ QQPet-*.dmg（Intel），Linux QQPet-*.AppImage / qqpet_*_amd64.deb（ARM64 为 QQPet-*-arm64.AppImage / qqpet_*_arm64.deb）
  - 精简版（约 120–160 MB，不带宠物内容）：文件名带 Lite。首次启动时在窗口里下载内容包（可填加速镜像），或导入已下载的 QQPet-content-*.qqpetpack
  - 内容包 QQPet-content-*.qqpetpack：给精简版首次使用，或在「设置 → 内容包」里导入；已经装了完整版不需要下载
  新功能
  - state：贴心宝贝开通后可点爱心图标续费 (#105 #84)
  修复
  - talk：只有钉住的提示（升学考试「我要考试」）停留 3 分钟且不被闲聊等其他气泡顶掉；普通带回调的闲聊恢复 5 秒
  - control：物品面板随状态刷新只更新进度条，触屏第一次点按的预览不再被重建清掉，第二下即可使用
  - talk：等待按钮的气泡（如「我要考试」）停留 3 分钟，不再 5 秒就消失
  - exam：带确认按钮的气泡不再被闲聊顶掉，「我要考试」能点开考卷 (#114 #106)
  - pet：隐藏 Ruffle 播放按钮，离开时启动的宠物不再在暂停期间显示播放图标 (#119)
  - build：Windows 安装包固定 x64，避免 Apple 芯片本地打包出 arm64 载荷后 NSIS 静默跳过 QQPet.exe 和全部 DLL
  - hd：删除未引用的 ditu011/ditu021 图片，避免 Windows 安装时按 8.3 短文件名覆盖 ditu01@2x/ditu02@2x 导致右键菜单顶部错乱 (#117)
  - hd：高清图按原图尺寸输出，@2x 不是两倍时回退原图，商城装扮预览不再撑满面板
  - android：悬浮窗移动关闭系统滑动动画，菜单收起时宠物不再向左跳再滑回
  - pet：忽略光标仍在宠物上的 pointerleave，Windows 点击后互动点不再消失 (#113)
  - pet：未抬起的点击后总是恢复互动点，不再依赖 Windows 上不可靠的悬停事件 (#113)
  - pet：Windows 点击后以 :hover 判断光标仍在宠物上，互动点能重新出现 (#113)
  - ui：安卓平板页面缩放大于 1 时按可见区域缩放窗口，修复农场等窗口超出屏幕无法关闭 (#103)
  - community：社区任务奖励的元宝直接计入余额，不再放进背包 (#112)
  - pet：未达拖动阈值的点击不再挪动宠物，桌面点击后恢复互动点，便于完成点击互动 (#113)
  - ui：切换动作栏按钮时立即隐藏上一个子菜单，消除残影 (#108)
  - exam：免打扰不再吞掉升学考试提示，考卷被异常关闭后可重开，未通过时显示错题与正确答案 (#106 #114)
  - ai：OpenAI 官方等严格端点不再发送 chat_template_kwargs，修复 400 (#111)
  - android：悬浮窗留边距且内容未越界时不再移动，远距离移动先透明再挪窗，修复切换动作抖动、开面板和拖动起止时宠物跳位 (#18)
  优化
  - pet：宿主暂停时挂起 requestAnimationFrame 回调，Ruffle 暂停后不再空转 (#119)
  - pet：隐藏、锁屏、休眠或主人离开时暂停 Ruffle，隐藏的气泡不再重绘，隐藏时放慢光标轮询，安卓空闲时降低窗口测量频率 (#119)
