PackageIdentifier: AnkioTomas.QQPet
PackageVersion: 0.4.0
PackageLocale: en-US
ShortDescription: A cross-platform standalone remake of the QQ desktop pet with optional AI chat.
Description: |-
  QQPet is a cross-platform remake of the QQ desktop pet (Windows / macOS / Linux / Android / HarmonyOS), rebuilt from the Arctic Penguin T800 client, with Flash content played through Ruffle.

  - Nurturing: adopt from eggs, growth and leveling, hunger/cleanliness/mood/health, illness and treatment, death and revival, rebirth with a change of gender.
  - Daily life: jobs, school (with entrance exams), nationwide travel (adventures, souvenirs, and travel-album postcards); progress keeps counting while the app is closed.
  - Items: shop and cart, backpack, food/cleanliness/medicine/toys, limited-time items, and diamond VIP features.
  - Tasks and mail: daily tasks generated around pet needs and holidays, tricks, study and jobs, travel tasks; sign-ins and a collection book; holiday, birthday, and travel postcard mail.
  - Activities: pond fishing, the QQFarm, escape rooms, and 98 minigames in 6 categories.
  - AI (optional): connect any OpenAI-compatible API for pet chat, rewritten lines, clipboard commentary, and translation.
  - Extras: weather reports, holiday greetings, do-not-disturb, transparency, autostart, auto-hiding over fullscreen apps, HD graphics, and save import/export.
