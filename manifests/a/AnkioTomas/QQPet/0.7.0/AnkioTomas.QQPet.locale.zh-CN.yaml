ReleaseNotes: |-
  下载哪个
  - 完整版（约 450–520 MB，自带宠物内容，装好即用）：Windows QQPet.Setup.*.exe，macOS QQPet-*-arm64.dmg（Apple 芯片）/ QQPet-*.dmg（Intel），Linux QQPet-*.AppImage / qqpet_*_amd64.deb
  - 精简版（约 120–160 MB，不带宠物内容）：文件名带 Lite。首次启动时在窗口里下载内容包（可填加速镜像），或导入已下载的 QQPet-content-*.qqpetpack
  - 内容包 QQPet-content-*.qqpetpack：给精简版首次使用，或在「设置 → 内容包」里导入；已经装了完整版不需要下载
  新功能
  - chat：未提炼对话缓冲落盘，重启不丢
  - chat：记忆注入改进——相关事实优先，修复摘要遗漏
  - chat：记忆压缩——旧事实合并成摘要
  - chat：聊天新增 STUDY 动作——听得懂「去学数学」
  - chat：搜索后端可选 + 自填 key，设置归入 AI 区
  - chat：联网搜索——免 key 双后端（DDG 优先、Bing 回退）
  - chat：记忆三流分离 + 聊天框打开滚到底部
  - chat：节日提醒节流——回应后只再提一次
  - ui：托盘档案悬浮展开，离开 0.5 秒收起
  - chat：台词润色开关，说完再开口
  - chat：生活全入账——物品使用与按钮回话进上下文
  - chat：宠物自言自语入账——它记得自己说过的话
  - chat：对话记忆——历史落盘、长期记忆、交接压缩
  - content：不带宠物内容的精简版程序首次启动时弹出窗口，可下载最新完整内容包（进度、校验、重试、镜像）或导入本地内容包，装好后自动启动宠物 (#28)
  - ui：宠物状态面板可以像宠物资料一样用鼠标拖动 (#53)
  修复
  - ai：关闭 DeepSeek 思考模式——默认开且 effort high 会烧光 max_tokens
  - chat：修复记忆提炼被聊天人设污染导致静默不写
  - chat：联网搜索默认关闭
  - chat：节流提满后禁止 AI 闲聊再编节日
  - chat：节日提醒节流落盘，重启不再复读
  - ui：档案悬浮在托盘上不再被 0.5 秒误关
  - chat：免打扰改开关式——AI 自己开的静音自己也能关
  - lan：修复真机单向发现——定向广播、单播心跳、bye 只认 id (#63)
  - lan：修复真机单向发现——定向广播、单播心跳、bye 只认 id
  - android：悬浮窗里点 Ruffle“复制错误详情”改走系统剪贴板，复制后能正常粘贴 (#18)
  - pond：鱼苗商店等级标签不再换行截断，两位数等级完整显示（如 lv42） (#58)
  - community：风语广场“去东郊荒地”和神器传说的 NPC 不再卡在“请稍等”：失效的神器传说界面直接按加载失败处理，传送点直接把宠物送到东郊荒地/天剑峰/昆仑顶 (#56)
  - farm：商店作物详情连续查看不再越缩越小、卡住；仓库卖出后再开商店，作物按列排布、有滚动条 (#55)
  - desktop：AppImage 重启（装好内容包、导入存档等）改为等旧进程退出后从 AppImage 文件重新启动，不再一去不回 (#28)
  - content：完整内容包默认可导入任何支持内容包的程序（v0.6.8 起），不再要求与打包版本相同 (#54)
  - ui：动作栏子菜单在光标离开按钮后短暂保留，斜着移过去也不再消失，第二项以下可以点到 (#52)
  优化
  - ui：属性道具简介改为说明实际改变的属性和数值（如“每个减少 300 点成长值”），不再显示“获得驻颜丹*-300” (#57)
