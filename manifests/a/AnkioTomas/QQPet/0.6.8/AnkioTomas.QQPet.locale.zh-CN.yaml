ReleaseNotes: |-
  新功能
  - voice：平时说话松手直发，仅回信弹窗落字可改
  - voice：打包带上 resources/asr（模型在就随包，不在就裸跑）
  - voice：说话只填字不自动发送，方便修正转译错误
  - voice：说话时气泡实时显示转译文字
  - voice：设置里显示说话键快捷键
  - voice：说话键语音对话——双击左 Alt 按住说话，本地识别进聊天管线
  - lan：敲门时轻轻三下敲门声
  - chat：聊天指挥送信——模型经 LETTER 动作调用送信能力
  - lan：串门传话——企鹅带话上门、回话带回、离线蹲门口
  - lan：联机改为设置可选项，测试提速并抗环境干扰
  - lan：局域网自动发现与在场广播
  - desktop：桌面端支持导入内容包、恢复内置内容，检查更新时可只下载增量内容包 (#28)
  - content：新增 .qqpetpack 内容包格式与打包脚本，发布时附带完整包、增量包和 packs.json (#28)
  修复
  - android：宠物窗口移动时不再先隐藏再显示，修复点击、菜单和拖动时宠物闪烁消失 (#18)
  - voice：LFS 规则收窄到模型文件，README 按纯文本入库
  - voice：适配上游内容包重构后的 resourcesRoot 位置
