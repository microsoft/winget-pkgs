ShortDescription: A modern, high-performance cross-platform Markdown desktop editor.
Description: Penna Markdown is a modern, high-performance cross-platform Markdown desktop editor built with Tauri v2 and penna-markdown, with fast startup and a native experience. Its rendering core is fully driven by the open-source penna-markdown component with GFM support and Penna syntax extensions; it supports dropping .md files or whole folders into the window, follows the system dark mode automatically, and provides an immersive borderless custom title bar.
