ShortDescription: 现代化、高性能的跨平台 Markdown 桌面编辑器。
Description: Penna Markdown 是一款基于 Tauri v2 与 penna-markdown 构建的现代化、高性能跨平台 Markdown 桌面编辑器，极速启动，原生体验。渲染核心完全由开源组件 penna-markdown 驱动，支持 GFM 标准与 Penna 语法扩展；支持将 .md 文件或整个文件夹拖入窗口、跟随系统自动切换暗黑模式，并提供沉浸式无边框自定义标题栏。
