ShortDescription: Hundreds of models & providers. One command to find what runs on your hardware.
Description: A terminal tool that right-sizes LLM models to your system's RAM, CPU, and GPU. Detects your hardware, scores each model across quality, speed, fit, and context dimensions, and tells you which ones will actually run well on your machine.
