ShortDescription: Graphical autocomplete for the terminal (PowerShell, Git Bash), based on the Fig specs.
Description: |-
  EasyTab shows a list of suggestions under the cursor while you type a command: subcommands,
  options and their values, read from the Fig completion specs. After installing the package,
  run `easytab install --shell pwsh` (and `easytab install --shell bash` for Git Bash), then open
  a new terminal.
