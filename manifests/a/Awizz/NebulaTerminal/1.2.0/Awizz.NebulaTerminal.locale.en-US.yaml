ShortDescription: A fast, good-looking Windows terminal with its own Linux-style shell.
Description: |-
  Nebula Terminal runs Nebula, a Linux-style command interpreter with ls, grep, find, pipes and scripts, alongside PowerShell, Command Prompt, Git Bash, WSL and SSH.
  It has tabs and split panes, a command palette, themes, notifications when long commands finish, and shell integration that works without any setup.
  It can open folders from File Explorer and be the default terminal of Windows 11.
