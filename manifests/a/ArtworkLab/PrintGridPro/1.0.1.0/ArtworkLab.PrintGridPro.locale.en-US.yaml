ShortDescription: Print multiple cards and photos per sheet.
Description: >-
  PrintGrid Pro is a Windows print-layout app for arranging multiple invitations,
  place cards, business cards, photos, tags, and labels on one sheet. Open finished
  PDF, PNG, or JPEG artwork, set physical print dimensions, choose the paper size,
  and adjust margins and spacing. Preview the sheet and optional cutting guides
  before printing directly or exporting a PDF. Front-and-back setup and manual
  duplex controls help prepare two-sided designs.
