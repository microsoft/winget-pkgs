ShortDescription: Use a PS5 DualSense controller on Windows with Xbox and Game Pass games, with adaptive triggers per game.
Description: |-
  Open-source helper for the PS5 DualSense controller on Windows (USB).
  Creates a virtual Xbox 360 controller (requires the ViGEmBus driver) so games that only accept Xbox controllers work,
  and applies adaptive trigger effects (resistance, bow, weapon, vibration), light bar color and player LEDs per game,
  switching profiles automatically with the game in the foreground. Game rumble can be mirrored into trigger vibration.
  The user interface is in Spanish.
