PackageIdentifier: arcships.DimCode
PackageVersion: 0.1.0-alpha.23
PackageLocale: zh-CN
ShortDescription: 基于事件驱动时间线与全插件运行时的智能体范式。
Description: |-
  一种以事件驱动时间线为基础、运行时完全插件化的智能体范式；它会在所处的环境里不断生长和迭代。
  dimcode 是用纯 Rust 编写的命令行客户端。直接运行会打开可交互的滚屏客户端；把提示词通过标准输入管道传入，则执行一次后退出。子命令包括：exec 以无头方式处理单条提示词（支持文字与本地图片）、acp 通过标准输入输出提供 ACP、session 用于继续、重命名、删除、清理和导出会话、export 把一个会话的完整时间线写为 JSONL。
  运行时能力来自插件而不是固定内核。压缩包按运行时布局发布，包含 bin/dimcode.exe、default-plugins.json 与 plugins 目录。Goal、Scheduler 等能力以原生 Rust 插件形式提供，Workflow 等可选插件通过 PluginManager 安装并启用。
  模型接入通过指定模型配置文件来设置，其中写明服务商端点与凭据所在的环境变量名，例如 dimcode --model-config "$PWD/.dev/model.json" --permission read-only。
