ShortDescription: An agent paradigm built on an event-driven timeline and a fully plugin-based runtime.
Description: |-
  An agent paradigm built on an event-driven timeline and a fully plugin-based runtime; it grows and iterates within the environment it runs in.
  dimcode is the pure Rust command-line client. With no redirection it opens an interactive scrollback client; pipe a prompt on stdin to run one and exit. Subcommands cover exec for a single headless prompt with text and local images, acp to serve ACP over stdin and stdout, session to resume, rename, delete, clean up and export sessions, and export to write a session's whole timeline as JSONL.
  Runtime behaviour comes from plugins rather than a fixed core, and the archive ships the runtime layout with bin/dimcode.exe, default-plugins.json and a plugins directory. Goal, Scheduler and other capabilities install as native Rust plugins, and PluginManager enables or installs optional ones such as Workflow.
  Model access is configured through a model configuration file that names the provider endpoint and the credential environment variable, for example dimcode --model-config "$PWD/.dev/model.json" --permission read-only.
