ReleaseNotes: |-
  Changes since alpha.17
  - MCP server entries support environment references and per-entry tool timeouts. The CLI shows invalid entries individually so they can be corrected. (#1014, #1035, #1037)
  - The CLI streams session exports page by page. (#1094)
  - Goal and Scheduler ship as native Rust plugins. (#1005, #1086)
  - Workflow is an optional plugin. Install and enable it through PluginManager if you use it. (#1092)
