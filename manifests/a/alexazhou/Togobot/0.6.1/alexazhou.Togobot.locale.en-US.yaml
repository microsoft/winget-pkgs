PackageIdentifier: alexazhou.Togobot
PackageVersion: 0.6.1
PackageLocale: en-US
ShortDescription: A desktop app for running ready-made AI agent teams.
Description: |-
  Togobot gives you an AI team rather than a single assistant. Tell the project manager what you need and it breaks the work down for the engineer, who hands the result to the tester for review, with everything communicated through group chat.
  Agents discuss in group rooms, coordinate one-on-one in private rooms and speak up autonomously based on events, so no predefined workflow is required. You can organize departments and managers like a real company, and agents can create role templates, recruit new members and open new rooms.
  Ready-made preset teams cover software development and creative brainstorming, and assignments are tracked as structured tasks whose dependencies advance automatically along a ticket-style event timeline.
  Agents keep long-term memory of your preferences and rules, conversations are compacted automatically as they approach the context limit, and any working agent can be stopped or given a new instruction at any time.
  Model access is not locked in: the app is compatible with the OpenAI and Anthropic protocols and can point different agents at different models.
Tags:
- ai
- automation
- chat
- llm
- multi-agent
ReleaseNotes: |-
  Togobot 0.6.1
  - Unified titlebar across platforms: macOS and Windows now share the same titlebar with steadier window dragging, and app mode no longer shows a "log out" item.
  - Upgraded the gTSP execution component: the built-in execution component is now 0.6.0 with a more practical output retention policy, so long logs no longer fill the window at once; glob / grep_search return relative paths.
  - Better guidance in the built-in console: help output is no longer truncated and spells out allowed values and positional arguments; multi-value flags such as --depends-on 42,44 work directly; failures come with a specific error code and a suggested next step.
  - Better context management: command output keeps only the tail at 300 lines / 20 KB, with the ability to page further from an offset or read the beginning separately; tool descriptions were trimmed as well, reducing per-turn token cost.
  - More readable activity log: images an agent reads render inside the activity card, click for full size, with a placeholder when loading fails; result previews now prefer the actual body text instead of hiding data behind a status field; also removed the stray horizontal scrollbar in the chat area and the always-visible scrollbar track in list panes.
  Full Changelog: https://github.com/alexazhou/TogoSpace/compare/v0.5.2...v0.6.1
