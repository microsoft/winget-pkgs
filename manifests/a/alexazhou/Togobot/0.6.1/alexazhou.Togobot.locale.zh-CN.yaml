ShortDescription: 一款开箱即用、运行 AI 智能体团队的桌面应用。
Description: |-
  Togobot 给你的是一支 AI 团队，而不是单个助手。把需求告诉「项目经理」，它会拆解给「工程师」，工程师再把成果交给「测试」评审，全程通过群聊沟通。
  智能体在群聊室里讨论、在私聊室里一对一协调，并根据事件自主发言，因此不需要预定义工作流。你可以像真实公司一样组织部门和负责人，智能体还能创建角色模板、招募新成员、开设新房间。
  内置的研发团队、创意头脑风暴等现成团队模板，任务以结构化方式跟踪，前置任务完成后下游自动进入待办，并保留工单式的事件时间线。
  智能体会长期记住你的偏好和规则，接近上下文上限时对话会自动压缩，任何正在工作的智能体都可以随时停止或插入新指令。
  模型不锁定：兼容 OpenAI 与 Anthropic 协议，不同智能体可以使用不同的模型。
