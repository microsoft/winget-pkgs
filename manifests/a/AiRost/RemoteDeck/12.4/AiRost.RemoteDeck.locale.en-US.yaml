Description: 'RemoteDeck is a peer-to-peer remote-desktop app: control another computer over the internet, or let someone control yours. Connections are end-to-end encrypted and negotiated directly between the two devices, so the relay server never sees your screen or your input. Share your permanent ID plus a rotating access code to grant access, and revoke it at any time. Free to use with one hour of access per day; RemoteDeck Pro removes the limit and unlocks full-resolution video.'
