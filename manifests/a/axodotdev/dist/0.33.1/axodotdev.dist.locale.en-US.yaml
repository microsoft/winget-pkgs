ReleaseNotes: |-
  ## Release Notes

  This release updates several dependencies. This includes an update to dependencies containing certificate lists to ensure recently-revoked certificates are no longer trusted.

  ## Install cargo-dist 0.33.1

  ### Install prebuilt binaries via shell script

  ```sh
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.sh | sh
  ```

  ### Install prebuilt binaries via powershell script

  ```sh
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/axodotdev/cargo-dist/releases/download/v0.33.1/cargo-dist-installer.ps1 | iex"
  ```

  ### Install prebuilt binaries via Homebrew

  ```sh
  brew install axodotdev/tap/cargo-dist
  ```

  ### Install prebuilt binaries into your npm project

  ```sh
  npm install @axodotdev/dist@0.33.1
  ```

