ShortDescription: Read-only viewer for Word documents
Description: LeanDoc is a focused, read-only viewer for Word documents. It opens .docx files in page view or reading view using the system WebView2 runtime rather than a bundled browser. It never runs macros and never fetches remote templates or images that a document points to, and a quiet bar lists content it does not display. One button hands the file to Word, LibreOffice, or the default editor.
