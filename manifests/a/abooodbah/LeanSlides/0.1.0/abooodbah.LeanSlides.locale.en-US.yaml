ShortDescription: "Presentation viewer: read-only, never runs macros, never fetches what a deck links to"
Description: LeanSlides is a read-only Windows viewer for .pptx, .ppsx and .potx presentations, and opens macro-enabled .pptm, .ppsm and .potm files without running their macros. It shows slide thumbnails, fits or zooms the slide, presents full screen with F5, shows speaker notes, finds text across slides, and opens several files as tabs. It draws slides with the system Microsoft Edge WebView2 Runtime. Macros, OLE objects and ActiveX controls never run, and linked pictures, videos and objects are never fetched. No telemetry and no account.
