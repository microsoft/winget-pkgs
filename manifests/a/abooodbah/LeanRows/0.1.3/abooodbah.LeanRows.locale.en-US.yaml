ShortDescription: Read-only viewer for large CSV, TSV, JSONL and log files
Description: LeanRows is a native, read-only Windows viewer for large row-oriented files. It indexes the file progressively and materializes only the rows in the current viewport, so peak memory is governed by window size rather than file size. Supports CSV, TSV, JSONL, NDJSON, log and plain text, with quote-aware record boundaries across read blocks. No telemetry and no network access.
