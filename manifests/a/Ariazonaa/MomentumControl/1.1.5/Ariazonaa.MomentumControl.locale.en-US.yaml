ShortDescription: Open-source Sennheiser Smart Control alternative for the MOMENTUM 4 headphones.
Description: |-
  Unofficial desktop app for the Sennheiser MOMENTUM 4 Wireless. It talks to the headset over Bluetooth straight from the PC and runs locally, without cloud, account or telemetry.
  Noise control (ANC strength, adaptive ANC, transparency, anti-wind), a 5-band equalizer with presets, bass boost, the headset's behaviour settings, multipoint switching, battery in the tray and the m4ctl command line.
  Not affiliated with Sennheiser or Sonova.
