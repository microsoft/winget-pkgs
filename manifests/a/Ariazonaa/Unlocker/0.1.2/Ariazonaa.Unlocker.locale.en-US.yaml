ReleaseNotes: |-
  - Windows 11 context menu registration (context-menu\register-w11-menu.ps1) picked a random Windows SDK when several are installed and failed with "makeappx.exe not found" if that was an old one. It now uses the newest SDK that actually contains makeappx.exe and signtool.exe.
