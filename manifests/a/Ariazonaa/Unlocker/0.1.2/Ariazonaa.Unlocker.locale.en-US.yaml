ShortDescription: Release locked files and folders, usually without ending the program that holds them
Description: >-
  Unlocker finds every process that holds a file or folder: open handles, loaded modules and working
  directories, also access through network shares and locks held by the system itself. Wherever
  possible it closes the handle and the program keeps running; processes are ended only when
  unavoidable. Afterwards the file can be deleted, renamed, moved or copied, or deleted on the next
  restart. It comes with a GUI (unlocker), a command line tool with text, table, CSV and JSON output
  (unlockerc) and an optional Explorer context menu that is registered with the scripts in the
  package. No installer, no background service.
