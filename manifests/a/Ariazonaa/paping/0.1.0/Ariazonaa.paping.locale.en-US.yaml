ShortDescription: TCP port ping with TLS and HTTP timing over IPv4 and IPv6
Description: >-
  paping connects to a host and port over and over and shows how long each connect takes, the way
  ping does for ICMP. It works where ICMP is blocked and tells you whether a service answers. It is
  a from-scratch rewrite in Rust of paping 1.5.5 and keeps its command line and output. It checks
  IPv4 and IPv6 side by side, can time the TLS handshake and an HTTP request, shows a live status
  line or a full-screen view, and writes JSON or CSV for scripts.
Moniker: paping
Tags:
  - cli
  - http
  - ipv6
  - latency
  - monitoring
  - network
  - ping
  - port
  - tcp
  - tls
ReleaseNotes: |-
  First release of the Rust rewrite. Command line and text output are compatible with paping 1.5.5.

  - IPv4 and IPv6 side by side, with statistics per address; -4 / -6 pick one family.
  - --tls times the TLS handshake; --http shows the status code and the time to the first byte.
  - host:port, [ipv6]:port and service names such as https for the port.
  - On a terminal: colors by latency, a live status line and a trend in the statistics; --tui for a full-screen live view.
  - --json (NDJSON) and --csv output with p95/p99 per address; exit codes 0 / 1 / 2.
  - Fixes over 1.5.5: a closed port reads "Connection refused", and the average no longer counts failures.
ReleaseNotesUrl: https://github.com/Ariazonaa/paping/releases/tag/v0.1.0
