ShortDescription: Per-app internet for Windows. Choose which connection each app uses, or combine them.
Description: |-
  Net Switch lets you choose which internet connection each app uses: a cable, Wi-Fi, a USB Wi-Fi adapter or a phone with USB tethering.
  It can also combine lines. New connections are spread across them, so downloads that open several connections get the speed of all of them.
  If a line goes down, its apps move to another one and come back when it returns. A phone line can be kept for the apps you choose, with a daily or monthly data cap.
  Everything runs on your PC, with no account and no telemetry.
