ShortDescription: See every listening port on Windows, which process owns it, and end it.
Description: |-
  PortPilot is a native Windows app that shows every listening TCP and UDP port, the process behind it
  (name, icon, path, command line, start time) and lets you open it in the browser, copy details,
  reveal it in File Explorer or terminate the process after confirmation. It highlights common
  development ports such as 3000, 5173, 5432 and 8080, runs in the notification area, and makes no
  network connections.
