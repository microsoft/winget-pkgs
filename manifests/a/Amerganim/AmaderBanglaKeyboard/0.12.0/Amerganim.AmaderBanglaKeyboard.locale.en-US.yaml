ReleaseNotes: |-
  Amader Bangla Keyboard 0.12.0
  New in 0.12.0
  - ছ with one h: ch now types ছ and c types চ (chele → ছেলে, cai → চাই,
    hocche → হচ্ছে). The old chh still works.
  - New icon (shared with the Android and Mac keyboards) in the Win+Space
    switcher, Setup, Apps & features and the Start Menu.
  - Website with download and typing guide:
    https://amerganim.github.io/WindowsBanglaKeyboard/
