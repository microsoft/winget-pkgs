# Installer manifest: portable zip for x64 and arm64 (no MSI/NSIS - the
# executables are simply on PATH after install via NestedInstallerFiles aliases).
PackageIdentifier: AufsichtAI.Aufsicht
PackageVersion: 0.1.1
MinimumOSVersion: 10.0.17763.0
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/Fachryxyf/aufsicht-releases/releases/download/v0.1.1/aufsicht-v0.1.1-windows-x86_64.zip
    InstallerSha256: e4ac64cba5ca0889e8220a196bd9efbf71131e31f74d42d72c59e7b265d841c1
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: aufsicht.exe
        PortableCommandAlias: aufsicht
      - RelativeFilePath: aufsichtd.exe
        PortableCommandAlias: aufsichtd
      - RelativeFilePath: aufsicht-tui.exe
        PortableCommandAlias: aufsicht-tui
    Commands:
      - aufsicht
    # zip + portable installs need no custom switches.
    # ProductCode: intentionally omitted. Winget tracks NestedInstallerType
    # "portable" apps by their alias/link paths, not by an installer product
    # code; emitting one would fail winget-pkgs validation.
    Platform:
      - Windows.Desktop
  - Architecture: arm64
    InstallerType: zip
    InstallerUrl: https://github.com/Fachryxyf/aufsicht-releases/releases/download/v0.1.1/aufsicht-v0.1.1-windows-aarch64.zip
    InstallerSha256: 8073c89b47696806ad9d67b0035557a7de6be67a6c3171d6eefad303299aabe3
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: aufsicht.exe
        PortableCommandAlias: aufsicht
      - RelativeFilePath: aufsichtd.exe
        PortableCommandAlias: aufsichtd
      - RelativeFilePath: aufsicht-tui.exe
        PortableCommandAlias: aufsicht-tui
    Commands:
      - aufsicht
    Platform:
      - Windows.Desktop
ManifestType: installer
ManifestVersion: 1.4.0
