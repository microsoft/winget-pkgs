ShortDescription: View any file's icon or thumbnail at any size
Description: Thumbico shows the icon or thumbnail of any file, folder, or drive. Unlike Windows, which shows you only small, standard-size images, Thumbico gives you the image at any size. This makes it easy to extract a program's icon at its largest size for an article or a slide, or to see a photo or video thumbnail at, say, 1024 pixels. You can save it as PNG, ICO, JPEG, BMP, or GIF, or copy it.
