ReleaseNotes: |-
  New Features
  Timing with the Audio Visualizer
  - View timestamps
  - Time subtitles with left/right click
  - Seek video with middle click
  - Two timing modes: Snap to Frame (default), Free Placement
    - Temporarily switch with Shift, or swap default in settings
  Subtitle Profiler
  - Benchmark render time, image size, and image count
  - Choose between all events, selected time range, or selected events
  - Export results to CSV
  Scripting
  - New Scripting Playground experience - More details on the wiki
  - View the source code of scripts before installing them
  - View and modify the source code of installed scripts
  Linux
  - Drag and Drop
  Other
  - Start with --safe to temporarily disable script loading
  - New layout for working with vertical video
  - Window state persists across restarts
  - Unmanaged crashes now trigger crash reporter
  Fixes
  - Fixed crash when opening a video while opening a video
  - Fixed crash when opening About box
  - Fixed loading of Files\ with\ spaces from the command-line
  - Fixed incorrect frame seek calculation
  - Fixed Command Palette sometimes closing instantly
  Full Changelog: v1.1.0...v1.2.0
  Pre-built binaries are attached below. For Arch Linux users, there's also a PKGBUILD.
  Huge thanks to everyone who's contributed to the localization efforts, especially CiferrC! If you're interested in helping out, head over to the Crowdin project page!
  You can submit bugs and feature requests to the issue tracker directly, or head over to the Discord server or discussions page for a conversation.
  I hope you continue to enjoy using Ameko!
