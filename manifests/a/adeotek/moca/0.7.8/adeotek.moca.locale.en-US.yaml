ShortDescription: "A coding agent in one static Go binary: eight frozen tools, native ACP, any OpenAI-compatible model"
Description: |-
  moca is a coding agent for the terminal with eight frozen tools, MCP without prompt bloat, and native Agent Client Protocol support so editors such as Zed and VS Code can drive it.
  It runs against Claude, ChatGPT, Ollama, OpenCode Zen, or any OpenAI-compatible endpoint, and keeps every session in plain files you can read.
  `moca update` replaces itself from the latest GitHub release; this package installs the same prebuilt binary.
