ShortDescription: Concurrent traceroute that maps every hop on xmsl.dev IPMap
Description: |-
  xmtr traces several targets at once with trippy, stops each route when its path is stable, and uploads the routes to xmsl.dev IPMap, which places every hop on a map.
  Tracing uses raw sockets, so run it from an Administrator terminal.
