ShortDescription: A Windows 11 taskbar built to minimise OLED burn-in, on any screen edge.
Description: |-
  Umbra replaces the Windows 11 taskbar with one designed from the ground up to minimise OLED
  differential wear. It puts between 70 and 660 times less light on the taskbar's pixels than
  Windows' own, depending on how much of the day the pointer spends on the bar, and it can sit on
  any screen edge. It is otherwise a full replacement: pinned and running
  applications, window previews, jump lists, a notification area and a clock.

  Umbra hides Windows' taskbar while it runs and gives it back when it exits. To stop using it,
  right-click the bar and choose Exit Umbra before uninstalling.
