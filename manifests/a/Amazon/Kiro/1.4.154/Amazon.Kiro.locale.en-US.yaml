ReleaseNotes: |-
  Compaction Hooks, Workflow Run Search, and Memory for Sub-Agents
  This release adds Pre Compaction and Post Compaction Hook triggers, so a Hook can run before or after Kiro compacts a conversation. It also adds search to the Workflow Runs view, compact workflow run cards, web fetches that ask sites for Markdown, and read-only Memory access for sub-agents. It fixes Agent Focus stalling on a window that did not finish connecting, an MCP token refresh outage forcing a new sign-in, and very large sessions that would not open.
  Run a Hook before or after Kiro compacts a conversation
  Two new triggers in the Hook editor, in the Compaction Hooks group, run a Hook when Kiro compacts a conversation automatically. A Pre Compaction Hook runs before the summary is written and can cancel the compaction by exiting with code 2, with its error output shown as the reason. A Post Compaction Hook runs after the summary replaces the older history, and its output is added to the conversation so the agent keeps what the summary left out. Neither trigger takes a matcher. Learn more ->
  Improvements

  Fixes
