ShortDescription: AWS Verified Access 连接客户端，无需 VPN 即可安全访问企业应用程序。
Description: |-
  AWS Verified Access 连接客户端为 AWS Verified Access 端点提供安全连接。AWS Verified Access 无需 VPN 即可安全访问企业应用程序，它基于信任策略对每个请求进行评估，让用户访问的是应用程序而不是网络。
  该客户端会安装系统托盘应用程序和后台服务，通过 AWS 私有网络路径建立到 Verified Access 端点的连接。用户访问以连接客户端作为接入方式的 Verified Access 端点时需要使用它。
