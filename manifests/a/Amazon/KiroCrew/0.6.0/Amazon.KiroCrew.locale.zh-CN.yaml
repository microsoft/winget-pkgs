Description: Kiro Crew 是一个持久化的开源开发工作区，可跨会话记住上下文并并行编排多个 AI 智能体。它基于 Kiro CLI 和 Agent Client Protocol（ACP）运行，支持定时后台任务，并可集成 Slack、Discord、Telegram 以及通过 SSH 管理的远程实例。Kiro Crew 本身免费；智能体推理通过 Kiro 账号运行，并计入相应的 Kiro 套餐。
