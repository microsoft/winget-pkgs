ShortDescription: Open source development workspace where AI agents remember context and work in parallel.
Description: Kiro Crew is a persistent, open source development workspace that remembers context across sessions and orchestrates multiple AI agents in parallel. It runs on the Kiro CLI and the Agent Client Protocol (ACP), supports scheduled background tasks, and integrates with Slack, Discord, Telegram, and SSH-managed remote instances. Kiro Crew itself is free; agent inference runs through a Kiro account and counts against the associated Kiro plan.
