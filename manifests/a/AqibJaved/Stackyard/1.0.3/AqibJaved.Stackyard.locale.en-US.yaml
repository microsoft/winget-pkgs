ShortDescription: See every SDK and toolchain on your machine, which projects use each version, and what's safe to remove.
Description: |-
  Stackyard finds the SDKs and toolchains on your computer (Flutter and FVM, Node.js with nvm-windows, fnm or Volta, the Android SDK and emulators, Gradle, Java, Python and .NET), shows which of your projects use each version, and what's safe to remove.
  Problems such as a JAVA_HOME pointing at a deleted folder, dead PATH entries or a missing pinned version come with a one-click fix. It also cleans rebuildable project folders like node_modules, build and .gradle. Every change is shown before it runs, and removals go to the Recycle Bin by default.
