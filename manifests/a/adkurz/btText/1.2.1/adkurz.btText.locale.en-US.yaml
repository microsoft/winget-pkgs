ShortDescription: A lightweight and accessible Windows desktop application for managing and reusing text snippets
Description: btText is a lightweight and accessible Windows desktop application for managing and reusing text snippets. It keeps frequently used text in a searchable database and can paste snippets into other Windows applications through the clipboard. Optional hotstrings and configurable global hotkeys make common snippets available without leaving the active application.
