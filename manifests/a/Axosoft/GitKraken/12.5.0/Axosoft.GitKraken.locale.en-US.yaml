ReleaseNotes: |-
  New ✨
  - Live agent status support for GitHub Copilot CLI:
    - GitKraken Desktop can now track Copilot CLI agent sessions and display their status across worktrees in the Agent Sessions panel.
    - GitKraken will also display pending permission requests from Copilot CLI in associated worktree cards, with allow and deny actions to directly respond without switching into the worktree. Dismissing a request hands the decision back to Copilot’s own prompt.
    - You can install or uninstall the Copilot CLI Plugin that enables live status reporting from Preferences > External Tools.
  - Support for Cursor CLI as your Coding Agent:
    - Cursor CLI can now be selected as your Coding Agent. If cursor-agent is installed on your machine it appears in Preferences > External Tools > Coding Agent and in the agent picker on the New Agent Session form, and starting a session launches it in the terminal ready for input.
  Improvements 🙌
  - Improved Commit Composer: “Compose commits with AI” and “Recompose commits with AI” actions now run on a faster, more reliable engine.
    - More reliable grouping — AI output is validated and retried automatically instead of failing outright
    - Faster on large diffs, and generated files like lockfiles no longer eat into your token budget
    - Accurate authorship — recomposed commits keep their original authors, adding co-authors when a commit combines work from multiple people (previously all attributed to whoever ran compose)
    - Real progress updates — the toast now shows the actual stage, plus file/hunk counts, instead of generic timed messages
  - Branch dropdowns now show the full branch name in a hover tooltip, so you can tell apart similarly named branches that are cut off by the width of the panel. This covers the branch inputs in the Create Pull Request panel, the base branch inputs in the Start an Agent Session modal and the New Agent Session form, and the reference input in the Create Worktree panel.
  - Cloud integrations will initialize slightly faster on launch.
  Bug Fixes 🐛
  - Fixed an issue where connecting a self-hosted integration (such as Jira Data Center or GitHub Enterprise) failed with “Could not reach the specified Host Domain” when the instance was configured to deny unauthenticated requests; GitKraken now attempts authentication with the provided token before reporting the host as unreachable.
  - Fixed an issue where undoing or redoing the drop of the HEAD commit silently discarded your uncommitted changes; GitKraken now asks whether to stash them first.
  - Fixed an issue where staging a file whose name contains a character such as [ or * also staged other files whose names it happened to match.
  - Fixed an issue where checking out a pull request whose branch lives on a hidden remote could fail with a “Cannot find the ref” error; the checkout now succeeds without having to unhide the remote first.
  - Fixed an issue where Serverless and On-Premise clients were shown the option to review pull requests on gitkraken.dev.
