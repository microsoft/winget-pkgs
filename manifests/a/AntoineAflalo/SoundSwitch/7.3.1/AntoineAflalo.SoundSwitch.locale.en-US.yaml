ReleaseNotes: |-
  Sorry for having so many releases, but I thought I had fixed the Sound Notification, I didn't.
  I reverted some of the code back to be sure it works again as before. I'll test more updated code for it.
  If you're not using Sound Notification, there aren't much else in this release to look towards.
  7.3.1 (2026-08-28)
  Enhancements
  - audio: widen custom-sound picker to AAC (.aac/.m4a) (#2384) (b6b38ee)
  Bug Fixes
  - audio: fall back to default endpoint when configured device is missing (#2384) (e79e8ba)
  - audio: include target device id in playback-failure Sentry logs (#2384) (#2391) (ba429e5), closes #2388
  - audio: log non-cancellation playback failures at Error so they reach Sentry (#2384) (1ad3997)
  - audio: pin NAudio via umbrella (Windows-asset fix) + address playback review threads (#2384) (59a80d7), closes #1407
  - audio: publish new device cache before disposing old devices in Refresh (#2389) (#2393) (7914a3a), closes #2390
  - audio: resolve notification IMMDevice via ComThread to kill InvalidCastException (#2384) (#2397) (537fb1e)
  - audio: serialize device-cache publication with a dedicated .NET 9 Lock (#2389) (#2396) (c4b59b2)
  - audio: snapshot devices before disposal in Refresh to fix collection-modified race (#2389) (#2390) (6dcf17d)
  - audio: treat empty deviceId as default in playback-failure logs (#2384) (d3eb590), closes #2391
  - audio: use AudioFileReader for stream decode (handles WAV+MP3), drop unused IsMp3Stream (d243ede)
