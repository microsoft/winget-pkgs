ReleaseNotes: |-
  SoundSwitch v7.4.0 🎉
  This one's been a long time coming, and it's packed with the features you've been asking for.
  ✨ Highlights
  - Dark mode everywhere — the WinForms settings now follow the Windows dark theme, extended to every remaining screen, tab page, list headers, and a crisper, device-aware tray icon.
  - Hotkeys for app rules — assign a keyboard shortcut to any application rule and trigger it without opening the settings (#2496).
  - Self-contained installers — both x86 and x64 installers ship with everything bundled. No more runtime downloads, no more install failures on locked-down machines (#2435).
  - Banner customization — choose which monitor the banner appears on, and tweak its color and scale to fit your setup.
  - Microphone control — pick exactly which device your mic hotkey mutes, with mute banners scoped to the affected device so you always know what happened.
  🐛 Fixes
  - App rules now persist device info so they keep working when a device ID changes (common with docks and hubs).
  - No more phantom update offers when running a nightly build.
  - Plus a round of dark-mode polish: readable link colors, light column headers, repainted group headers, and text rendering initialized correctly before the hidden window.
  - Website: search restored, changelog excluded from search results, and no more horizontal scrolling on mobile.
  💜 A first-time contributor made this release shine
  Big thanks to @ampersandru for their first contributions to the project: banner customization and the microphone mute target. Two features in a first PR batch, nice work!
