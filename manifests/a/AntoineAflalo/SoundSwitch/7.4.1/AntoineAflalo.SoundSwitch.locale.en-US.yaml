ReleaseNotes: |-
  Stability release this time: six Sentry-reported crashes fixed, mostly around the notification sound and the mute banners that shipped in 7.4.0.
  Strongly advise to update, especially if you use notification sounds on a device that gets unplugged or comes in and out, or mute banners. Some of these hit a big chunk of the user base.
  🐛 What got fixed
  - Notification sounds don't take the app down anymore when the output device is unplugged, reconfigured, taken in exclusive mode, or rejects the format while the sound plays (the single Sentry fingerprint with ~300 affected users).
  - Saving your settings survives a locked configuration file (backup/sync tool, antivirus, second instance): saves go through a temp file and swap atomically instead of crashing Settings.
  - Mute banners no longer die when they close themselves (click-to-dismiss, fade-out after click).
  - Mute events arriving during app startup are handled instead of crashing an audio thread, and the mute banner state reconciles at startup.
  - Device list refresh doesn't throw "Collection was modified" between the cache publication and the mute target lookup anymore.
  - And the settings window no longer crashes when the banner scale input receives its 0 default (#2558, the bug 7.4.0 introduced).
  7.4.1 (2026-11-04)
  Bug Fixes
  - audio: serialize retained-id snapshot with cache publication (#2561) (b682764), closes #2554
  - audio: tolerate endpoint disconnect during notification playback (#2564) (23549e2), closes #2557
  - banner: tolerate disposed banners in mute banner rearrangement (#2563) (0943e9e), closes #2559
  - configuration: atomically persist config save with transient-lock retry (#2560) (a297fcf), closes #2556
  - notification: guard mute-change notifications against uninitialized state (#2562) (49e48ad), closes #2555
  - settings: stop the crash on the banner scale numeric (e2425a3), closes #2558
  🛡 VirusTotal GitHub Action analysis:
  - SoundSwitch_v7.4.1.0_Release_Installer.exe
  - SoundSwitch_v7.4.1.0_Release_Installer_arm64.exe
