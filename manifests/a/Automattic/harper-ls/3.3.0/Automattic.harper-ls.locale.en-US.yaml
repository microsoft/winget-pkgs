ReleaseNotes: |-
  What's Changed
  Another release! This one isn't quite a big or heavy on the bugfixes as some of our other releases, but I wanted to get something out to you all anyway.
  Most significantly, @ecairol did some amazing work enhancing how Harper ranks its spelling suggestions. You'll find that the suggestions in this version are for more correct in context than ever before. Definitely a welcome improvement.
  We also added the ability to load Weirpacks in the Desktop app, after several requests. In the Chrome Extension, you should see more relevant checks in more places.
  Hopefully we can get another release out soon with some more improvements we've been cooking up. Until then, cheers!
  The PRs We Merged
  - fix(core): mark "learnt", "burnt" and "leapt" as past forms by @jayhemnani9910 in #4874
  - test(chrome-ext): stop stray blurs failing the iframe popup tests by @GaryJones in #4947
  - fix(TheyToThem): avoid flagging coordinating conjunction 'for they' by @abdul-karim-mia in #4926
  - feat: them selves → themselves by @hippietrail in #4897
  - feat: despite he is → although/even though he is by @hippietrail in #4887
  - fix(core): don't ask for a preposition after "have" as a main verb by @ozenyunus35 in #4622
  - fix(core): don't flag the acronym "RE" in "the RE process" by @ozenyunus35 in #4632
  - feat: update dictionary regular past verbs /j vs /tT by @hippietrail in #4965
  - docs: update stale paths in AGENTS.md by @shoustak in #4951
  - fix(core): detect "to" before degree words followed by nouns mid-sentence by @draphy in #3131
  - feat(desktop): allow restarting onboarding from settings by @elijah-potter in #4934
  - test(chrome-ext): fix the most common flaky extension tests by @GaryJones in #4943
