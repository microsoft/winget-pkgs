ShortDescription: Virtual tabletop for tabletop roleplaying games.
Description: |-
  Argo is a desktop virtual tabletop for running tabletop roleplaying games online.
  It brings your world, your table, your characters and the rules into one place:
  play live sessions with maps, tokens, dice and voice, and keep the campaign in sync
  with the Argo web app. The installer sets up the Argo launcher, which downloads the
  game and keeps it up to date. An Argo account is required.
