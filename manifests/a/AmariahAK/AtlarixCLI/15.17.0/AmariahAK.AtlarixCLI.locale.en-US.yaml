ReleaseNotes: |-
  Free Auto every month. Free Atlarix Auto comes with a monthly usage allowance. When the month's allowance is used up, every surface (app, CLI, VS Code, the Chrome extension) shows the same popup with one way to keep going: Atlarix Core.
  Smarter Auto and Zenith. Each turn of paid Auto and Zenith is matched to the right model by one quick decision, and that model answers the whole turn. Auto thinks at medium effort and Zenith at high. In the model picker, Auto is "Best for Daily Use" and Zenith is "For complex agentic tasks".
  atlarix run uses your CLI sign-in. atlarix run reads the sign-in from atlarix login in-process and refreshes it under a lock shared across processes, so several runs at once never sign each other out. Project memory is on in atlarix run too, as in the app (ATLARIX_MEMORY=off turns it off). Its refusals say one thing each: "Sign in to use Atlarix Core: run atlarix login", "atlarix run needs a model: pass --model auto", "--model X is not an Atlarix Core model: use --model auto", "--api-key-file is not used with Atlarix Core: run atlarix login".
  Hidden-character defence. Invisible Unicode characters (tag characters, bidi controls, zero-width marks) are removed from files, tool results and connector data before the model sees them, so text hidden in them can't steer it. Edits keep the file's own bytes.
  Sub-agents and sessions. Sub-agents get the skills index and can use skills; a skills: list really narrows them. send_message to a wrong session name says which one it probably meant (never for one- or two-character names). A plan written under a new title after the old one is finished starts a new plan.
  Sign-in waits. The walking Rix keeps you company while a sign-in finishes in the app, the VS Code panel and the Chrome extension.
  Account and sync. Fewer account reads: window focus asks the proxy's copy, and the balance comes from each reply. The Chrome extension's conversation sync goes through account-scoped calls, sends only what changed, merges overlapping pushes and deletes rows past a shortened transcript. Clients no longer create their own account row; a missing one is made by the server.
  Your first task. "How is Atlarix doing this session?" is asked once after your account's first finished task, then at its usual pace.
  Also. The CLI's update notice tells winget installs to run winget upgrade AmariahAK.AtlarixCLI, and other Windows installs the PowerShell installer, never curl | sh; own-key OpenAI dictation no longer sends a realtime model to transcription, and the transcription list follows the selected model; the word filter on saved model replies is removed.
