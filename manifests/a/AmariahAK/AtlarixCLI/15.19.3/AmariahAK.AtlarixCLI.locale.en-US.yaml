ReleaseNotes: |-
  A model for each task. Integrations → Models & providers has a new section at the top: choose the model that Explore, Plan, Build and sub-agents use. A task you leave unset uses the chat's model; Auto and Zenith choose their own. If a saved model can no longer run (its key was removed, or it's no longer offered), its row says why, and the task stops with a message that tells you where to change it, instead of quietly using another model.
  Switch to Build. Ask for a change in Explore or Plan and you now get a card: "This needs Build mode. Switch to Build?" Switch, and Atlarix carries on with your request. Stay, and nothing changes. Unattended runs, where nobody can answer, skip the card.
  Edicts that can allow. A pre_tool_use edict can now answer allow (Claude Code's permissionDecision: "allow", or exit 0 with {"decision":"allow"}), and that call's approval card is skipped. When several hooks match, the strictest answer wins: deny, then ask, then allow. Deny rules still win over an allow, and anything outside your workspace, sudo, installs and dangerous commands still ask.
