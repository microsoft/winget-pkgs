ReleaseNotes: |-
  Everything new in 15.18, with fixes for Windows.
  Atlarix can write silks and edicts for you. Ask for a silk, an edict or a mod and Atlarix writes the files itself, following its built-in silk-authoring skill. A new silk goes in a dev folder for the chat, and changes to your own edicts go in edicts.json. Each file asks you first, and that card never offers "always": "Allow all" doesn't cover it, and atlarix run and automations never write these files. An edict you approve applies from the next step on. A new silk doesn't run until you add its folder in /silks, which shows what it runs and asks first. atlarix silks validate <folder> checks a silk before you add it.
  Mods run as real code. A silk's mod now runs as you, in its own process, with Node itself: files, network, programs and timers. It can call its own silk's MCP servers with $.mcp.call and redraw its panes at any time with $.ui.redraw(). Each event has 10 seconds. A mod that hangs or crashes is restarted, and after 3 times it is off until Atlarix restarts. Mods you already installed wait for your OK again, because what they can do has changed.
  Sign in with a code when the browser can't finish. If your browser says you're signed in but Atlarix doesn't, the "Sign-in not completing?" window now offers "Sign in with a code": enter the code at atlarix.dev on this or any device. It no longer suggests Linux terminal commands, which didn't work for the AppImage or the .deb.
  Questions asked in the CLI can be answered in the app. When the CLI asked you a question, opening that session in the app showed "Asked you" with no question. The question and its choices now show there, including in sessions saved before this fix.
  Commands run as you, and ask first. With the sandbox off, the new default, the agent's commands run like in your own terminal, so apps that sandbox themselves (Electron, Chrome and apps built on them) start. Each command asks before it runs, unless it's on the short built-in list of read-only commands (ls, cat, grep, git status and the like) shown in Settings → Commands & network. "Always allow" on a command lets the next one like it run. With the sandbox on, commands run inside it without asking. Turn it on in Settings → Commands & network, or with /sandbox in the CLI and in VS Code, Zed and JetBrains. If you had set something only the sandbox enforces (the host allow-list, "no program can read", "require the sandbox", extra writable folders), the sandbox stays on for you. atlarix run, automations and other runs with no one watching keep the sandbox on unless you turn it off yourself. Explore and Plan still run commands read-only unless you turn the sandbox off. A \\wsl$ project still runs in its Linux distro with the sandbox off.
  Export a chat. /export in the app, the CLI and VS Code, Zed and JetBrains saves the conversation as Markdown, or as JSON with --json. --sanitize replaces your home folder, email addresses and keys. In the app, the session menu has Export too.
  Delete your account. In the app's account settings, with atlarix account delete in the CLI, or at atlarix.dev/account. You confirm with your email, and Atlarix shows what goes: your plan is cancelled, any balance is lost, your synced data is deleted, and every device is signed out. It can't be undone.
  A \\wsl$ project opens even when its distro has stopped. WSL stops an idle distro, and its folder can't be opened until it runs again, so the CLI used to exit with "EUNKNOWN … lstat". Atlarix now starts the distro first in the app, the CLI and VS Code, Zed and JetBrains, or says how to start it.
  Settings saved with a byte-order mark are read. Windows PowerShell and some editors put one at the start of user-settings.json. Atlarix used to ignore the whole file and use its defaults. The same goes for Edicts, permission rules, plugin manifests and editors' MCP config files.
  Three work modes: Explore, Plan and Build. Debug and Review are now the /debug and /review commands, which run in whatever mode the chat is in: /debug what fails finds the cause before fixing anything, and /review reviews what you name (your uncommitted changes if you name nothing). Shift+Tab cycles the three modes in the app and the CLI; VS Code, Zed and JetBrains list the two commands. A chat, setting or older version that still says Debug or Review opens in Build. A Review chat used to be read-only, so it can now change files once you approve. A plugin, mod or skill command of your own named debug or review is now behind the built-in one: rename it to keep using it.
  Report a bug from inside Atlarix. Type /bug, with what happened if you like, or choose Help → Report a Bug… in the app or "Atlarix: Report a Bug" in VS Code. Atlarix drafts the report and shows it to you; nothing is sent until you choose Send. Keys, home folders and email addresses are masked, and your chat goes only if you choose Send with this chat. /feedback reaches the Atlarix team the same way.
  Hidden characters you can see and remove. Invisible Unicode characters (tag characters, bidi controls, zero-width marks) now reach the model as visible markers like ⟦U+200B⟧ (a long hidden run as one short marker) in files, tool results, connector data and your own messages, instead of being removed silently. Hidden text still can't steer the model, and Atlarix can now remove the characters when you ask. Edits keep the file's own bytes.
  An honest answer when today's free Auto is used up. When nothing can serve you for the rest of the day, Atlarix says so with the reset time ("Resets in 3h 20m (back at 8:00 AM)") instead of "busy, try again". "Busy" now means only a short wait. Pro includes $19 of Atlarix Core usage every month, at the same rates as credit.
  Your browser works for your account only. Atlarix uses the browser only when the Atlarix extension there is signed in to the same account as the app, CLI or editor asking. Otherwise it says which one to sign in to. Update the Atlarix app and CLI along with the extension so they keep using the browser.
  Open-source licences. Settings → General → Open-source licences lists every open-source package in Atlarix with its licence text.
  Sign-in and checkout. Every sign-in screen says that continuing confirms you're 13 or older (16 in the EU) and agree to the Terms and Privacy Policy. Pro checkout says it renews monthly until you cancel, on atlarix.dev and in the app.
  Security fixes. Tighter checks on the links and windows the app opens, on which part of the app may call into it, on web addresses the agent fetches, on silk archives, on which commands count as read-only, on file read rules, on hosts commands may reach, and on what other sessions may approve.
  Also fixed
  Removing or updating a silk with a running mod works on Windows. Atlarix now stops the mod, keeps it stopped and waits for its process to exit before it removes or replaces the silk's files, including a mod that stopped after a crash or a timeout. Before, Windows refused to delete the folder the process was still using.
  Exporting to a path through a file says so. /export to a path where part of the folder is a file now says "part of that path is a file, not a folder" on every system.
  A link above a missing path is checked. A read-only command on a path that doesn't exist yet now asks first when a folder above it is a link that points outside the project.
