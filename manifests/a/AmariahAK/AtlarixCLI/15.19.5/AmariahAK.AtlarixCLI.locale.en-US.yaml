ReleaseNotes: |-
  Long replies no longer freeze Atlarix. A very long reply no longer slows Atlarix down as it grows, or runs the app, the CLI or a headless run out of memory. The CLI redraws once a frame and draws only the end of a long reply each frame, even one with no blank lines, so a reply of millions of characters stays responsive and Esc stops it quickly. In the CLI, Stop during a very fast reply now takes effect while the reply is still arriving, instead of after it. A reply that repeats one line is kept whole, instead of being cut in half as if it had been sent twice.
  Long answers go on as long as they make progress. A reply that reaches the model's output limit is continued while each part adds a line the reply doesn't already have, instead of at most 50 times. One that loops, or adds nothing, stops with a last line saying why. Only a length finish counts as a cut. The output asked for is at most 256K tokens. Stop during a mid-turn summary sends nothing more.
  Summaries only ever make a long task smaller. A mid-turn compaction is kept only when the history comes out smaller. After a decline, the summariser isn't asked again until the history grows by a tenth of the compaction point.
  Clearer answers from your own provider.
  - A 404 for the model you picked ends the turn with "isn't available … Pick another model" (or "has been retired"), followed by the provider's own words.
  - A 429 waits as long as the provider says (retry-after-ms, retry-after, x-ratelimit-reset-*), up to 10 tries with the wait shown, and Stop ends the wait. A request bigger than the whole per-minute limit ends at once.
  - A refusal after a completed step ends the turn there, keeping the step, and shows the reason once.
  Agent files ask before using another provider. A repo's .atlarix/agents/<name>.md whose model: is on a different provider asks first: Yes, Yes and always in this folder, or No. Always is in the app and the CLI; in VS Code and other editors the card offers Yes and No. Unattended runs skip the sub-agent and say how to allow it. If no key is set up for that provider, the sub-agent says so.
  Fixes.
  - After Allow all this turn, a write outside the project still shows its card instead of leaving the turn waiting.
  - A silk Atlarix writes for you offers to turn it on, and your installed silks and edicts stay protected, even before your Atlarix folder exists or when a folder in the path has a Windows short name like PROGRA~1.
  - atlarix run uses your saved provider keys, and waits for its background work before it exits.
  - gpt-5 on an OpenAI-compatible provider replies instead of failing on max_tokens.
  - Stop ends a compaction summary.
  - Toasts follow the app's theme and sit above the composer, and an opened workspace is named by its folder.
  - A typed answer takes new lines as the prompt box does, and Enter that confirms IME text no longer sends.
  - On Linux, the sign-in survives restarts when there is no keyring.
  - A Pro account is never offered Subscribe, in the app, the CLI, VS Code or ACP editors, and sees "Pro · active · renews ". Resume Pro is offered for a cancelled plan on every surface, and in the CLI a Pro account with no credit gets Pro's included Core.
  - read_url works again in the CLI, and pages come back as readable markdown. Browser console and network capture come back after you navigate.
  - Sub-agents can run commands (tests, builds, git log) under the same approval card as the main chat, and can see and stop the main chat's background jobs.
  - "Always allow" on a compound command saves one rule per part that asked, and a commit message that mentions rm -rf no longer shows "deletes files".
  - In the CLI, a rating keypress never takes your next message, and changing an answer to a question opens it as answered.
  - Adding a custom endpoint under a name you already use asks first, then replaces it.
  - In the CLI and VS Code, a waiting steer says "esc send now", and Esc sends it.
