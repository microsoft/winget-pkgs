ReleaseNotes: |-
  Fixes.
  - When Ollama or another local server isn't running, Atlarix now says so at once and tells you how to start it, instead of retrying. atlarix run no longer hangs when the model can't be reached.
  - Browser: filling a rich-text editor now works, and Atlarix reports what actually ended up in a field that changes what you type. In some editors, text with several lines lands as one paragraph with line breaks.
  - Browser: Atlarix picks its own browser session back up after the browser's helper restarts, and keys still reach the page after it reconnects.
