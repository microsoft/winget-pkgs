ReleaseNotes: |-
  Auto-update everywhere, including Intel Macs and Linux .deb/.rpm installs. Signing in comes
  first in the CLI and editors, with a code for SSH and remote machines. Each chat keeps its own
  model, effort and mode. A missing or unreadable key stops the turn and says so instead of
  quietly moving to Atlarix Core. System notifications replace sounds. Approvals hold for the
  whole turn, and Stop withdraws the turn's open approvals everywhere.
