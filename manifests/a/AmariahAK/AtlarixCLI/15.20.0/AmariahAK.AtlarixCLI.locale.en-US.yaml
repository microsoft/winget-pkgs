ReleaseNotes: |-
  Two modes: Build and Plan. Build is the default. Plan reads, searches and plans, and keeps every tool Explore had, including the browser and MCP servers. When you ask for a change in Plan, Atlarix tells you to switch to Build. Chats that were in Explore open in Plan. In the CLI, shift+tab switches between the two.
  File edits inside your project apply without a card. Approval cards are for commands now. Editing, deleting or renaming a file inside your project just happens, and Revert still undoes it. Writing outside the project still asks once per folder, and silks, hooks and edicts still ask. So do files that can run commands later or change your tools, such as anything in .git, .vscode or .husky, and .envrc or .npmrc. Rules you saved to never allow something keep working: Atlarix moves them to ~/.atlarix/permissions.json for you.
  Sub-agents follow your permissions. In Plan, Atlarix starts only read-only sub-agents. A read-only sub-agent can run checks like tests, builds and git log, but not commands that change things. A Build sub-agent runs commands under the same approval card as the main chat. MCP tools follow the main chat's mode. Each sub-agent gets its own browser tab, so sub-agents running side by side never share a page.
  More ways to install the CLI.
  - Debian and Ubuntu: apt install atlarix from the signed Atlarix repository. Fedora and RHEL: dnf install atlarix. Installing the .deb or .rpm adds the repository, so updates come with your system updates.
  - pip install atlarix, or uvx atlarix to run it without installing.
  - Docker: docker run -it --rm -v "$PWD:/work" ghcr.io/amariahak/atlarix.
  - Windows: scoop bucket add atlarix https://github.com/AmariahAK/scoop-atlarix, then scoop install atlarix/atlarix. choco install atlarix works once Chocolatey's review is done.
  - snap install atlarix --classic works once the Snap Store's review is done.
  - atlarix update tells you the right upgrade command for however you installed it.
  Credit on commits and PRs. In Build, Atlarix adds a Co-authored-by: atlarix-agent line to the commits it makes and "Made with Atlarix" to the PR descriptions it writes. Ask it to stop and it stops, then asks whether to save that as a rule or a memory. The Co-author settings page is gone.
  Fixes.
  - An approval card from a background sub-agent can still be answered after your next message starts.
  - The sign-in screen shows just the ways to sign in.
  - When you allow a write into a new folder outside your project, the write goes through right after you say yes.
