ReleaseNotes: |-
  Connect MCP servers in one click. Servers that support sign-in now connect with one click in the app, the CLI, VS Code, Zed and JetBrains. The consent screen shows Atlarix's name and logo. Where a server offers both, sign-in comes first and "Use an API key instead" is the fallback (PostHog, for example). Server logos use the icon the server names for itself, and a broken image shows the letter avatar instead of a blank.
  Reconnect without losing the task. When a server's sign-in expires or is refused mid-task, Atlarix pauses and asks you to reconnect, then carries on with the same task. In the app it's a card in the chat (Reconnect, Save key, Open settings or Go on without it); in the CLI and the editors it's a Reconnect prompt. A server that drops its connection reconnects by itself.
  Relics with video, audio, PDFs and slides. A relic is now saved as normal files in your project's relics/ folder. It can include files from your project by path, play video and audio, and show PDFs. Ask for slides and you get a deck you can present, save as PDF or download as .pptx. Atlarix updates a relic in place, changing only what you asked for. Open it, or send it however you share files.
  Cloud agent: what Atlarix makes to share is saved in relics/ and included in the pull request. Set relics: exclude to leave it out.
  Upload files to a web page. In the browser, Atlarix can put any file from your computer into a page's upload field, after you approve the card that shows the file's full path. It sends exactly the file the card showed.
  Tips while you work. A short tip about a feature you can use shows while Atlarix works. Turn it off in Settings or with /tips off.
  A CLI queue you can steer. With a message queued, Esc stops the turn and sends the queue now; a second Esc stops that one. ↑ on an empty box pulls the last queued message back to edit, images included. ctrl+s is gone. A message you send while /compact is running is queued and sent once it's done, instead of being lost.
  A / menu in the app. Type / at the start of a message to see the commands you can run, such as /bug, /debug and /review, plus the commands from your silks and mods.
  Silks and mods work the same everywhere. A silk's commands show up in the app, the CLI and your editor as soon as it's installed or turned on, with no restart. A mod's pane now docks beside the chat instead of covering the message box. In the CLI it docks beside the conversation, or below it in a narrow terminal. A pane that can't draw part of itself says which part and why.
  Mods with themes and bands. Mods can now give Atlarix a theme of their own (in the app) and add a band above the chat box (app and terminal).
  atlarix run output you can pipe. The final reply goes to stdout, and progress and logs go to stderr, so atlarix run "…" > answer.md saves just the answer.
  Fixes.
  - Signing in no longer holds up the app: its messages show in the window instead of a box you have to close, and opening the same sign-in link twice doesn't start a second sign-in. Sign in with a code no longer stalls on macOS.
  - Menus: the highlighted row is easier to read.
  - Thoughts no longer break words in the middle and start a new line for each chunk.
  - Declining a folder the agent asked to write to now tells it you said no, so it adjusts instead of retrying.
  - Screenshots no longer inflate the chat's context meter.
  - A pasted image the model can't see comes back to the box with its paste, not a label.
  - Windows: agent commands run correctly when your shell is PowerShell.
  - Windows: fixed a crash when signing in from the terminal.
  - Account page: shows how you signed in (GitHub, Google or email). VS Code's download link goes to /cli.
  - Shorter terms line: the sign-in terms line is shorter on every surface.
  - Quitting the CLI mid-turn no longer saves the turn twice or wakes the agent while it closes.
  - CLI popups stay centred after the terminal resizes at start-up.
  - Security fixes: tighter checks on connector sign-ins.
