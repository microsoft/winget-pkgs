License: Proprietary (freeware)
ShortDescription: A free autonomous space-battle screensaver for idle Windows desktops.
Description: |-
  AFK Wars Watch displays autonomous space battles with moving wireframes and drifting controls.
  It runs as a background application with its own idle detection, rather than a native .scr file.
  Watch is free. Take the Helm is a separate paid playable edition and is not included in this package.
  No separate Python or Java installation is required. Automatic startup at Windows sign-in is not added.
