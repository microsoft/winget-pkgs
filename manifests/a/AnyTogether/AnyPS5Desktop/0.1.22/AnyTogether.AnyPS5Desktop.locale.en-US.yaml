ShortDescription: PS5-style launcher for AnyPS5 that finds, unlocks and starts PS5 game dumps.
Description: |-
  AnyPS5 Desktop is the Windows and Linux port of the AnyPS5-ARM launcher, built with Flutter.
  It finds PS5 game dumps in a games folder, turns their executables into native Windows programs with the AnyPS5 engine (which the launcher downloads and keeps current) and starts them.
  Controls, settings, saves and trophies are kept per game, and a phone can be paired as a controller.
  It needs a CPU and GPU that AnyPS5 supports and decrypted copies of games you own.
