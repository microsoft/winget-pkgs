ShortDescription: Borderless desktop widget showing one live system metric with a scrolling graph
Description: 'Monitor Widget is a small borderless widget that sits on your desktop and shows a single system metric at a glance: a large percentage, a 60-second scrolling graph and a green to red color scale. Pick the metric you want from the right-click menu, drag the widget anywhere on any display, and let it start with Windows. It installs per user, needs no administrator rights and keeps its settings across updates.'
