ShortDescription: Enforce Architecture Decision Records as executable rules, for humans and AI agents.
Description: Archgate turns Architecture Decision Records into machine-checkable rules. ADRs are written as Markdown with YAML frontmatter, and each one can carry a companion TypeScript rules file that validates the codebase against the decision. The CLI runs those rules in CI and feeds condensed ADR briefings to AI coding agents so generated code follows the same architecture.
