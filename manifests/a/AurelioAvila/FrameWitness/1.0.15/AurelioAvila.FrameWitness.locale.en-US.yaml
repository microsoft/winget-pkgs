ShortDescription: Recover deleted photos and videos on Windows with visual review, hashes and dated findings.
Description: |-
  Frame Witness recovers deleted photos and videos on Windows and shows each find for visual review, with its SHA-256 hash, source offset and every date labelled with where it was read from.
  It reads 13 video and 6 photo formats, rebuilds fragmented video from its own index where that index survives, and records a coverage report of what was read, searched and failed.
  Analysis runs locally. A free account includes a quick scan of the first 8 GiB of a source, up to 100 results, previews and saving recovered files up to 1 MiB each; full scans and larger exports need a paid licence or the three-day free trial, available once per person and per computer.
  Overwritten, TRIM-erased or encrypted data cannot be recovered. Frame Witness is not a certified forensic product. Tested on Windows 11 (x64).
