ReleaseNotes: |-
  - The window opens at the same size as PC Tweaker and remembers where you left it; every screen fits 820 x 600.
  - Plans & pricing shows the plans straight away; subscribers see the price they actually pay.
  - New Support panel (contact, copy diagnostic info, open logs) and Manage subscription in the account menu (cancel at period end with an optional reason, or resume).
  - Interface polish: no accidental text selection, colours that follow the theme, stronger contrast on accent buttons.
