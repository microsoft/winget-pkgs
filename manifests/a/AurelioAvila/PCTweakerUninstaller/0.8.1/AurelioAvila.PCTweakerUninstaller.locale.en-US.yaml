ShortDescription: Removal Intelligence for Windows - remove software with clarity, not guesswork. Every program gets a Safe/Review/Keep confidence score with its reasons spelled out, and the exact command is shown before anything runs.
Description: PC Tweaker Uninstaller reads the Windows registry across all uninstall views (64-bit, 32-bit, per-user) and also lists Microsoft Store (MSIX) packages, rating every installed program's Removal Confidence from visible evidence - shared runtimes, drivers, launchers, missing publishers, broken uninstall entries. Before any removal, a Removal Brief shows the method, privileges, estimated space, and exact command that will run. Every removal leaves a local, exportable receipt in the Removal Ledger with disk space verified before/after. Includes in-app auto-update and one shared account with PC Tweaker.
