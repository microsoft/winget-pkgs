ReleaseNotes: |-
  - When the account service cannot be reached, the sign-in form says why, and account requests stop waiting after 30 seconds.
  - The administrator helper behind each machine-wide removal hands its result straight back to the app and writes nothing in your user folders.
  - French removal messages show their punctuation correctly again; updated components.
