ShortDescription: Review sensitive data in AI prompts and likely credential exposures in public GitHub repositories.
Description: Redaxa checks prompts for sensitive data and offers redaction before sharing with AI tools. On Windows, Pro and Business include focused local reviews of public GitHub repositories. Redaxa prioritizes likely API keys, tokens and credentials, identifies probable providers, groups repeated matches, separates examples from actionable findings and provides masked, redacted reports. Extended history and dependency scanning remains optional. Findings are possible exposures, not proof that a credential is valid or a complete vulnerability audit.
