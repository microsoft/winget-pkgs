ShortDescription: Review sensitive data in AI prompts and possible credential exposures in public GitHub repositories.
Description: Redaxa (formerly PromptShield) checks prompts for sensitive data and offers redaction before sharing with AI tools. Prompt checks are available on the web, Windows and a companion Chrome extension. On Windows, Pro and Business include local checks of public GitHub repositories, with grouped possible credential exposures, current-file and history context, masked values and redacted text reports. Repository checks identify possible exposures, not verified working keys or every vulnerability. Pro costs EUR 7.99/month or EUR 79.90/year; Business costs EUR 14.99/user/month or EUR 149.90/user/year. Eligible new subscribers can start a 7-day trial; a card is required. Subscriptions renew unless cancelled, and checkout is hosted by Stripe. Users sign in before starting checkout and explicitly confirm the purchase on Stripe.
