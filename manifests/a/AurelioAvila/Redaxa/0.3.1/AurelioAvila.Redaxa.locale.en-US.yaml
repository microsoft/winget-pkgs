ShortDescription: Catches personal data, secrets and financial details in your prompt before it reaches ChatGPT, Claude or any other AI tool.
Description: Redaxa (formerly PromptShield) scans text for emails, phone numbers, IP addresses, API keys and tokens, private keys, credit card numbers (Luhn-validated), IBANs (checksum-validated), crypto wallet addresses and more, then offers a redacted version safe to paste into an AI chat. The scan runs on request and is never logged or stored. Includes a companion browser extension for ChatGPT, Claude, Gemini, Copilot and Perplexity. Free to use; optional paid plans (Personal EUR 7.99/month or EUR 79.90/year; Business EUR 14.99/user/month or EUR 149.90/user/year) add organization policies, API keys and audit history. Subscriptions are billed by Stripe; users must sign in before starting checkout and confirm the purchase on Stripe's own hosted payment page.
