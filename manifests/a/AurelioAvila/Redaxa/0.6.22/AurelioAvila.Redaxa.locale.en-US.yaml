ShortDescription: Review sensitive data in AI prompts and likely credential exposures in public GitHub repositories.
Description: Redaxa checks prompts for sensitive data and offers a redacted version to review before sharing with AI tools. The free Windows app includes five prompt checks per day without an account; Windows prompt analysis runs on Redaxa servers. Pro and Business remove the daily prompt limit and add focused local reviews of public GitHub repositories, with likely API keys and tokens grouped into masked findings and redacted reports. Extended history and dependency scanning is optional. Review the suggested redactions and findings before relying on them. Findings are possible exposures, not proof that a credential is valid or a complete vulnerability audit.
