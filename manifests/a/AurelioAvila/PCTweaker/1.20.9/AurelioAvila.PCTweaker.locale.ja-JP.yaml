ShortDescription: Windowsを変える前に、変更内容を確認。Audio診断、スキャン結果、84個の設定を一か所で確認できます。48個はアカウント不要のFree機能、36個は任意の有料Pro機能です。
Description: |-
  Windowsを変える前に、変更内容を確認。Audio診断、スキャン結果、84個の設定を一か所で確認できます。48個はアカウント不要のFree機能、36個は任意の有料Pro機能です。

  - 変更前にAudio診断、スキャン結果、対応する設定を確認
  - 48個のFree設定はアカウント不要・利用期限なし。36個の追加設定は任意の有料Pro
  - 音声デバイスの形式、Bluetooth通話モード、マイク、Equalizer APOの状態を確認
  - 読み取り専用の10秒間DPC/ISRトレース。管理者権限が必要で、原因を断定するものではありません
  - 20項目のScan。結果を確認してから変更を選択
  - 変更履歴と、対応する設定の以前の値への復元
  - 削除済みファイルの回復やアプリの再インストールは復元の対象外

  Windows 10/11 x64対応。この日本語はパッケージ情報の翻訳です。アプリのUI言語は英語、イタリア語、フランス語、スペイン語、ドイツ語、ポルトガル語です。
