ShortDescription: Windows tuning for performance, gaming and privacy, with recorded changes and restore tools for supported settings.
Description: PC Tweaker helps you review Windows settings and hardware-based recommendations, apply selected changes, and restore supported settings from recorded values. It includes startup controls, gaming profiles, privacy settings, hardware monitoring and maintenance tools. Cleanup and repair operations have separate recovery limits. Free and Pro features are available.
