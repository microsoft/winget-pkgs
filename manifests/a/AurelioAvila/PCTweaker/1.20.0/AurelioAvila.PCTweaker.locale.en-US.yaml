ReleaseNotes: 'PC Tweaker 1.20.0 adds an Audio section. See every sound device in use with its real format (Hz, bits, channels), effects, spatial sound and Equalizer APO status, plus findings that explain what is wrong: a Bluetooth headset stuck in call mode, a muted or very quiet microphone, Equalizer APO installed but not active. New fixes: "Don''t lower my game during calls" (Windows lowers every other sound by 80% while a call app uses the mic) and "Fix Bluetooth volume control". Pro: keep HDMI audio or the sound chip awake so the start of a sound is not cut off, keep USB audio powered, and restart an audio device in one click. Check for crackles runs a 10-second driver latency trace against Microsoft''s limits. Every change is recorded and can be restored with one click. The Scan gets an Audio category. 84 controls.'
