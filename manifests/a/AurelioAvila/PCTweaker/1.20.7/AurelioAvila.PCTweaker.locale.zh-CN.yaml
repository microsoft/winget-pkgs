Description: |-
  先看清 Windows 的状态，再决定改什么。集中查看音频诊断、扫描结果和 84 项设置。48 项 Free 设置无需账户；另外 36 项及高级工作流程属于可选的付费 Pro。

  - 更改前查看音频诊断、扫描结果与受支持的设置
  - 48 项 Free 设置无需账户、无使用期限；另有 36 项及高级功能属于可选付费 Pro
  - 查看音频设备格式、Bluetooth 通话模式、麦克风和 Equalizer APO 状态
  - 10 秒只读 DPC/ISR 跟踪：需要管理员权限，结果不等于故障原因证明
  - 20 项 Scan 检查：先查看结果，再选择更改
  - 更改历史及受支持设置的原值恢复
  - 设置恢复不包含已删除文件恢复或已移除应用的重新安装

  支持 Windows 10/11 x64。这里的中文是软件包信息的翻译。应用界面支持英语、意大利语、法语、西班牙语、德语和葡萄牙语。
