Description: |-
  Windows를 바꾸기 전에 변경 내용을 확인하세요. Audio 진단, 검사 결과와 84개 설정을 한곳에서 살펴볼 수 있습니다. 48개 Free 설정은 계정이 필요 없으며, 추가 36개는 선택형 유료 Pro 기능입니다.

  - 변경 전 Audio 진단, 검사 결과와 지원되는 설정 확인
  - 48개 Free 설정: 계정 불필요, 기간 제한 없음. 추가 36개 설정은 선택형 유료 Pro
  - 오디오 장치 형식, Bluetooth 통화 모드, 마이크와 Equalizer APO 상태 확인
  - 10초 읽기 전용 DPC/ISR 추적: 관리자 권한 필요, 원인 확정용 검사 아님
  - 20개 항목 Scan: 결과를 확인한 뒤 변경 선택
  - 변경 기록과 지원되는 설정의 이전 값 복원
  - 삭제 파일 복구나 제거한 앱 재설치는 설정 복원 범위에 포함되지 않음

  Windows 10/11 x64 지원. 이 한국어는 패키지 정보의 번역입니다. 앱 UI 지원 언어는 영어, 이탈리아어, 프랑스어, 스페인어, 독일어, 포르투갈어입니다.
