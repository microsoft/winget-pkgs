ReleaseNotes: |-
  Redexa Social 1.10.2 gives Rivals a screen. Until now it did not have one.
  The feature was complete behind the scenes: the module that reads the public figures of channels you pick, the endpoints that add, list and remove them, the standings computed on every refresh, and the plan check that gates the numbers. None of it could be reached. The word never appeared anywhere in the interface, so the thing the paid plan sells could not be opened by anyone who had paid for it.
  - Follow up to three YouTube channels by handle or URL, see who you follow and when each was last read, and remove any of them.
  - Read the standings with your own row marked. Views per video is the column that compares fairly between channels of different sizes; totals only reward whoever has been publishing longest.
  - Only public figures are read, from your own computer, with the credentials you already connected. Nothing about who you are watching leaves this machine.
  - Who you follow and when it was last read stays visible on any plan, and removing never needs one. Only the numbers belong to Pro.
  The screen is translated in all six languages the application ships.
  Windows application, updater and compatibility launcher are signed by Aurelio Avila and timestamped. Code signing identifies the publisher; it does not guarantee acceptance by SmartScreen or antivirus reputation checks.
