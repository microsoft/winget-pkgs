ReleaseNotes: |-
  Redexa Social 1.11.5 makes the 3-day free trial easy to find and fixes the plan labels on Plans.
  - Plans opens with "Start your 3-day free trial" when this computer can still have one, shows "Trial — X days left" while it runs, and says plainly when it has been used.
  - Plans below the one you hold read "Included in your plan"; your own plan shows Current plan with Manage subscription.
