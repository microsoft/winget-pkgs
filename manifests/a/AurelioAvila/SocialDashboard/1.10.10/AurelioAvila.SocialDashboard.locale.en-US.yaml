ReleaseNotes: |-
  Redexa Social 1.10.10 adds charts and a clearer Diagnostics.
  - Overview shows audience and views over time, switchable, next to views per platform. The free plan sees the last seven readings; the Pro plan the full history.
  - Analytics adds views per post in publishing order, against your own average.
  - Diagnostics groups the same problem across accounts into one task that opens on click, with a health ring and per-platform status.
  - Light theme by default; the window is sized to the screen and remembers its position.
  - Account errors are explained in plain language, with the platform's message under "Technical details".
  Official Windows downloads require verified Aurelio Avila publisher signatures, trusted timestamps and the existing updater signature. Connected accounts and local user data are retained.
