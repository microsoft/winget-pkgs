ReleaseNotes: |-
  Updates no longer depend on other apps: setup closes only Tweaky Driver, never a driver installation in progress, installs the signed update and reopens the app.
  If an earlier update did not finish, installing 0.1.18 tidies up what it left behind and completes the update.
  Fixed a rare crash that could stop setup while it checked the installation folder's permissions.
  The scan now shows how much of the PC it covers, devices without a driver are also searched by their general model ID, and official NVIDIA Game Ready drivers are found for GeForce RTX 30, 40 and 50 Series laptop GPUs, more desktop cards and GTX 10 Series cards.
