ReleaseNotes: |-
  Pro keeps working on a PC whose clock runs ahead of the correct time.
  Clicking Scan in the first seconds after the app opens no longer fails because of the app's own startup checks.
  If the update check failed while the PC was offline, the app checks again as soon as the network is back.
  Settings no longer describes the released app as a development build, and the administrator parts of the app load Windows libraries only from the Windows system folder.
  Since 0.1.20, Tweaky Driver installs to C:\Program Files\Tweaky Driver as Tweaky Driver.exe; earlier installations move there by themselves when they update.
