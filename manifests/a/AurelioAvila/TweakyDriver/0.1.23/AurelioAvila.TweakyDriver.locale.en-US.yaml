ReleaseNotes: |-
  - Closing the window keeps Tweaky Driver in the notification area, the same way PC Tweaker does, so scheduled checks keep running. Click its icon to reopen it, or right-click it for Open Tweaky Driver and Exit Tweaky Driver.
  - Turn off Keep running in the background from the icon's menu if you prefer closing the window to quit. Your choice is saved.
  - Opening Tweaky Driver while it is already running brings its window back instead of saying it is already open.
  - Reopening the window from the notification area checks for app updates again.
  - The icon's menu and the notice shown the first time you close the window are in the language you chose in the app.
