ReleaseNotes: |-
  - Full scans are much faster again, and every device is still checked. On a test PC with 189 devices the first full scan took 2 minutes 44 seconds instead of 9 to 16 minutes, a scan repeated the same day 14 seconds instead of 4 to 7 minutes, and a scan the next day about a minute. Busy answers from the Microsoft Update Catalog are now asked again on a fresh connection, and devices with an update option appear by name while the scan runs.
