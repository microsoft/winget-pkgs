ReleaseNotes: |-
  Tweaky Driver now installs to C:\Program Files\Tweaky Driver as Tweaky Driver.exe instead of Driver Companion\driver-companion.exe. Existing installations move there by themselves with this update; settings, downloads, account and recovery data stay where they are, and an interrupted move puts the previous version back.
  At the end of a new installation, setup offers to start Tweaky Driver and to create a desktop shortcut, both ticked. Updates installed from inside the app skip that page.
  Desktop shortcuts and a taskbar pin named Tweaky Driver, the Start menu entry and scheduled scans that run while the app is closed follow the program to its new folder.
  If a Pro subscription stops because a payment failed or the plan ended, the app says so once, with a button to update the payment method or see the plans. Installed drivers stay installed and the Free allowance keeps working.
