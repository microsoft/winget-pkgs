ReleaseNotes: |-
  - Your plan, free trial and free scan are checked once and shared by the title bar, Account and Plans & pricing, instead of being asked again on every page change and every return to the window. Pages open straight away and no longer flicker while they check.
  - If the Tweaky Driver service can't be reached, the app keeps showing what it last knew, with a short "Couldn't refresh just now" note, and tries again on its own, waiting a little longer each time. The free trial and the plans stay on screen.
  - Coming back from the payment page still checks your subscription at once, and Refresh always asks the service.
