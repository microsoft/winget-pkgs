ReleaseNotes: |-
  - Intel chipset devices such as the SMBus and Serial IO controllers are fully checked again. Intel lists its chipset packages in the Microsoft Update Catalog with a deliberately old date (1968), and Tweaky Driver rejected that date, so the whole search for those devices failed and they showed as not fully checked.
