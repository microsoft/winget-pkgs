ReleaseNotes: |-
  - AMD Radeon RX graphics cards are now checked against AMD's own driver pages. On Windows 11, for 11 desktop card families from the RX 5500 XT to the RX 9070 XT, Tweaky Driver reads the card's official AMD product page and release notes and offers the recommended AMD Software: Adrenalin Edition package, also when Windows still uses its basic display driver or no driver at all. The AMD integrated-graphics check for Ryzen 7000/9000 desktops works again after AMD changed how it labels the recommended driver.
