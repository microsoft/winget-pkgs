ReleaseNotes: |-
  Pro and Lifetime accounts are recognised as soon as the app opens: the plan is checked at start, when the window regains focus and right after sign-in, so a paid account no longer sees the upgrade card or gets sent to Plans & Pricing.
  If a Pro account has a free place but this PC was never activated, the app now activates it automatically.
  The Account tab shows the actual plan (Lifetime, or the renewal or end date), whether this PC holds one of the two places, and an Activate button when it does not.
  Signing in and creating an account work on a PC whose clock runs behind by up to a day, and an unfinished plan check (offline or service unreachable) is reported instead of asking for Pro.
  Portuguese is now European Portuguese throughout, German uses the formal Sie everywhere, and several smaller display issues are fixed.
