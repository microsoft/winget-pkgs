ReleaseNotes: |-
  - Scans check every device again when the Microsoft Update Catalog is busy. Tweaky Driver now spaces out its catalog searches, because Microsoft stops returning search results for a few minutes when one PC searches too quickly. Because nothing is skipped any more, the first full scan takes longer on PCs with many devices.
  - Old driver packages built only for Itanium (IA64) PCs are now set aside as not meant for this PC, instead of being counted as failed checks.
  - Updated the secure-connection libraries used for sign-in, updates and downloads, and the app's interface libraries.
