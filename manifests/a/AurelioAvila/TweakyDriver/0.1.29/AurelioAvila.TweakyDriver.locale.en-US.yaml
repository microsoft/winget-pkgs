ReleaseNotes: |-
  - The Free plan is now one complete scan every 10 days, and you can download and install what that scan finds until the next one unlocks. It replaces the 3 driver downloads a month. The app shows when your next free scan unlocks.
  - The 3-day free trial of Pro is easy to find: "Start your 3-day free trial" sits in the title bar, on the scan page and in Plans & pricing, before you even sign in. While it runs, the title bar shows the time left.
  - The free scan is counted for your account and this PC by the Tweaky Driver service, so it needs a free account with a verified email. One account works in PC Tweaker, Uninstaller and Tweaky Driver.
  - Plans & pricing marks the plan you are on as "Current plan" and the plans it includes as "Included in your plan".
