ReleaseNotes: |-
  - Intel graphics, Wi-Fi and Bluetooth are now checked against Intel's own driver catalog, the one Intel Driver & Support Assistant uses. Tweaky Driver matches each device's exact hardware ID, compares the installed driver version with Intel's and offers Intel's package when it is newer or when no Intel driver is installed yet. Downloads are verified against Intel's signature, exact size and published SHA-1, and nothing is installed.
