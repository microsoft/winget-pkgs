ReleaseNotes: |-
  The window now opens at the same comfortable size as PC Tweaker and remembers where you left it. Plans & pricing opens straight on the plans, with a slim offer bar. A new Support entry sits in the sidebar, and the account menu now has Manage subscription: see your plan, renewal date and card, cancel at the end of the paid period (with an optional reason) or resume it. The Devices table shows all rows again at smaller window sizes, device statuses are translated in every language, and many small interface fixes.
