ReleaseNotes: |-
  Tweaky Driver now looks for updates on its own download server, dl.pctweaker.app, before GitHub. If that server has nothing to offer, the app checks GitHub exactly as before. Every update is still verified against the same signature before it is installed.
  The program's file properties now show the copyright notice, like the installer already did.
  Since 0.1.20, Tweaky Driver installs to C:\Program Files\Tweaky Driver as Tweaky Driver.exe; earlier installations move there by themselves when they update.
