ReleaseNotes: |-
  Billing: switching from annual to monthly no longer drops Pro, and Pro stays active while Stripe finalises a renewal. Devices stopped with error code 10 or 43 now get a repair offer when Windows Update has a matching driver, with the real device status shown after the install. Scan results appear while the Microsoft Update Catalog search is still running. Updated Tauri and the updater plugin to clear dependency security advisories.
