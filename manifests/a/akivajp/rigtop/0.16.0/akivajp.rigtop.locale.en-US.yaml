ShortDescription: System monitor for workstations, laptops and NAS, with a terminal UI and a native GUI, many hosts over SSH.
Description: |-
  rigtop shows CPU, memory, GPUs, storage health (SMART, RAID), network and processes, and raises alerts, in a terminal UI (rigtop) and a native GUI (rigtop-gui). It can watch many hosts over SSH without a daemon: it starts `rigtop --agent` on each through your own ssh.
  On Windows, temperatures, fans and CPU power come from LibreHardwareMonitor, which rigtop-gui can set up.
