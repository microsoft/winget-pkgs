# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

# Written by hand to packaging/winget/README.md and kept in sync with what was
# actually submitted, so the next release starts from the real thing rather
# than from a draft.
#
# InstallerType inno: the per-user Inno Setup installer release.yml builds
# around the bare exe (packaging/windows/). It never asks for administrator
# rights, so Scope is user and there is no ElevationRequirement. ProductCode is
# the installer's AppId with the _is1 Inno adds, which is how winget recognizes
# the installed copy. Commands only helps search here: the installer registers
# an App Paths entry for azzurro.exe, not a winget alias.
PackageIdentifier: Azzurro.Azzurro
PackageVersion: 0.2.0
InstallerType: inno
Scope: user
UpgradeBehavior: install
Commands:
- azzurro
ProductCode: jzbz.Azzurro_is1
ReleaseDate: 2026-10-06
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/jzbz/azzurro/releases/download/v0.2.0/azzurro-v0.2.0-x86_64-setup.exe
  # Taken from the release's PGP-signed SHA256SUMS rather than computed here,
  # so the hash winget pins is the one covered by that signature.
  InstallerSha256: 37CA7D266E4FEA0C4D4955A2FC0A39E54BB13015593C88FE35587301DCD30023
ManifestType: installer
ManifestVersion: 1.12.0
