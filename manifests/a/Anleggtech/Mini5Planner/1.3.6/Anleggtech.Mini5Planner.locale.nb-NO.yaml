ReleaseNotes: |-
  Terrengfølging (Pro) bruker nå Copernicus DEM GLO-30 for hele verden i stedet for ASTER. Panelet viser hvilken høydekilde som brukes, og utenfor Norge minner appen om god margin i bratt terreng.
  I Norge brukes fortsatt Kartverkets høydedata (1 m). Der Copernicus mangler data, brukes ASTER som før.
