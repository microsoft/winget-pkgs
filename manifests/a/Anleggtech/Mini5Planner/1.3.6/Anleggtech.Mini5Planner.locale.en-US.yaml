ShortDescription: Plan grid mapping missions for DJI drones and export KMZ waypoint routes for DJI Fly.
Description: |-
  Mini5Planner is a desktop flight planner for drone mapping and photogrammetry. Draw a polygon on the map, choose a single grid or double grid (crosshatch), set overlap, altitude, speed and gimbal angle, and export a WPML/KMZ waypoint mission that DJI Fly can run.
  It supports DJI drones flown with DJI Fly: DJI Mini 5 Pro, Mini 4 Pro, Air 3, Air 3S, Mavic 3, Mavic 3 Pro and Mavic 4 Pro, including setups with the DJI RC 2 where third-party flight apps cannot run. A built-in wizard explains how to transfer the mission to the DJI RC 2.
  Live statistics show ground sample distance (GSD), flight time, photo count, distance and battery use for the selected drone.
  The free version includes all drones and all grid modes. An optional one-time Pro license adds terrain following and battery splitting.
  Mini5Planner is an independent product and is not affiliated with or endorsed by DJI.
