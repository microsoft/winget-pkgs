ReleaseNotes: |-
  Terrain following (Pro) now uses the Copernicus DEM GLO-30 worldwide instead of ASTER. The panel shows which elevation source is used, and outside Norway it reminds you to keep a good margin in steep terrain.
  In Norway the app still uses Kartverket's 1 m elevation model. Where Copernicus has no data, ASTER is used as before.
