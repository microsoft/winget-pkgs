ShortDescription: Planlegg rutenett-flyvninger for DJI-droner og eksporter KMZ-ruter til DJI Fly.
Description: |-
  Mini5Planner er en flyplanlegger for kartlegging og fotogrammetri med drone. Tegn et polygon i kartet, velg enkelt eller dobbelt rutenett, still inn overlapp, høyde, fart og gimbalvinkel, og eksporter en WPML/KMZ-rute som DJI Fly kan fly.
  Støtter DJI-droner som flys med DJI Fly: DJI Mini 5 Pro, Mini 4 Pro, Air 3, Air 3S, Mavic 3, Mavic 3 Pro og Mavic 4 Pro, også med DJI RC 2, der flyapper fra andre ikke kan kjøres. En innebygd veiviser viser hvordan ruta overføres til DJI RC 2.
  Gratisversjonen har alle droner og alle rutemønstre. En valgfri engangslisens (Pro) gir terrengfølging og batterideling.
  Mini5Planner er et selvstendig produkt og har ingen tilknytning til DJI.
