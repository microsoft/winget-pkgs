ReleaseNotes: |-
  «Lim inn» ved Pro-nøkkelen finner nøkkelen også når e-postprogrammet har delt den over flere linjer og det står tekst rett under. Det gjelder også når hele e-posten limes rett inn i nøkkelfeltet, i siterte svar, og når teksten er kopiert fra PDF eller Word.
  Ellers er alt som i 1.3.4.
