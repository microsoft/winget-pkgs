ShortDescription: Send files and folders directly between your devices, end-to-end encrypted, no account.
Description: |-
  PeerPayload Connect sends files and folders straight from one device to another, on the same network or across networks.
  There is no account: each device makes its own key, and you pair devices once with a link or QR code and a safety code.
  Transfers try a direct connection, then a reversed one, then a relay, with mutual TLS end to end on all three.
  Big transfers can be paused and resumed from either side. Also available for Android and Linux.
