PackageIdentifier: AndrewNg.OpenWorker
PackageVersion: 0.1.7
PackageLocale: zh-CN
ShortDescription: 帮你完成日常任务的 AI
Description: |-
  帮你完成日常任务的 AI。OpenWorker 是一款开源的 AI 协同伙伴，它直接运行在你的桌面上，交付的是最终的工作成果，而不仅仅是对话：一份精美的文档、包含具体数字的 Slack 回复、更新后的日历，或是分类处理好的收件箱。
  它在你的本地机器上运行，且不绑定任何特定模型：你可以使用自己的 OpenAI、Anthropic、Google 或开源权重提供商的 API 密钥，也可以通过 Ollama 实现完全本地化运行。你的数据只通过你选择的模型和集成项离开机器。
