ReleaseNotes: |-
  OpenWorker v0.1.7
  New
  - Auto-compaction — long sessions keep going: older turns are summarized automatically instead of hitting the context limit. Your transcript is never changed.
  - More model providers — AWS Bedrock, Google Vertex AI, OpenRouter, and Meta Muse Spark join the picker, plus Kimi K3 via Together.
  - Token usage in the composer — per-session usage at a glance, with a full input/output/cache breakdown one click away.
  - Prompt caching on Anthropic models — cheaper, faster repeat turns.
  - Long pastes fold in the transcript behind a more/less toggle.
  Fixed
  - macOS no longer asks to "access data from other apps" when your workspace is a home folder.
  - Windows and cross-platform fixes to setup and search.
  Security hardening — this release includes a set of security fixes across network access, workspace trust, MCP configuration, and approval handling. Updating is recommended.
  Full Changelog: https://github.com/andrewyng/openworker/compare/v0.1.6...v0.1.7
