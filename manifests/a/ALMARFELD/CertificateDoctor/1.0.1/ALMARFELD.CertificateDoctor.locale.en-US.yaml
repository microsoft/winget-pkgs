PackageName: Certificate Doctor
PackageUrl: https://almarfeld.com/software/certificate-doctor/
License: MIT
LicenseUrl: https://github.com/AlinTibi/CertificateDoctor/blob/v1.0.1/LICENSE
ShortDescription: Inspect, check and convert certificate files locally on Windows.
Description: Certificate Doctor inspects certificate details, checks chains from provided files, flags expiry and weak algorithms, matches private keys to certificates and converts copies between PEM, DER, PKCS#7 and PKCS#12. HTML and JSON reports exclude private-key material and passwords. Processing is offline, with no uploads, accounts or telemetry. It does not check revocation, validate hostnames or evaluate trust against the Windows certificate store. Microsoft Edge WebView2 Runtime is required separately. The executable is not Authenticode signed.
