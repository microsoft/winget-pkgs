PackageIdentifier: ALMARFELD.CSVDoctor
PackageVersion: 1.0.0
PackageLocale: en-US
Publisher: ALMARFELD
PublisherUrl: https://almarfeld.com/
PublisherSupportUrl: https://almarfeld.com/support/
PackageName: CSV Doctor
PackageUrl: https://almarfeld.com/software/csv-doctor/
License: MIT
LicenseUrl: https://github.com/AlinTibi/CSVDoctor/blob/main/LICENSE
ShortDescription: Offline Windows tool for diagnosing and safely repairing CSV, TSV and delimited text files.
Description: |-
  Detect delimiters and encoding, inspect structural and Excel-related risks, review proposed repairs, and export a separate copy with a JSON report. Original files are not modified. CSV Doctor works offline with no telemetry or uploads. Microsoft Edge WebView2 Runtime is required separately.
  Input limits are 16 MiB, 100,000 records and 256 columns. CSV files cannot prevent Excel from later reinterpreting values. Formula-risk protection is optional and not universal. Windows binaries are not Authenticode signed.
Tags:
- csv
- tsv
