ShortDescription: Translate video subtitles, review batches and export new MKV or subtitle copies on Windows.
Description: |-
  SubFlow translates existing subtitle tracks or adjacent subtitle files using local Ollama or optional cloud providers with consent. It supports batch queues, glossary, translation cache and PGS OCR through Windows. Video/audio are not uploaded and source videos are preserved. FFmpeg/FFprobe are required separately; local translation also requires Ollama and a model. No models or sample videos are bundled. Cloud providers may require an account and charge fees. OCR and translation results require human review.
