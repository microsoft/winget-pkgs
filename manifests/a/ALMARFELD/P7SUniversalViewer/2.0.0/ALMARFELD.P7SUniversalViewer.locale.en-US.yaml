License: MIT
LicenseUrl: https://github.com/AlinTibi/p7s-universal-viewer/blob/main/LICENSE
ShortDescription: Open, inspect, verify and extract P7S digital-signature containers on Windows.
Description: |-
  A Windows utility for opening CMS/PKCS#7 signed containers, verifying each cryptographic signature, inspecting signer certificates and extracting original content locally. Supports attached and detached signatures. Signature integrity is separate from certificate trust and legal validity; revocation and trusted timestamps are not verified. Microsoft Edge WebView2 Runtime is optional and needed only for PDF preview.
