ShortDescription: Merge, split, organize, convert, protect and compress PDF files locally on Windows.
Description: |-
  PDF Toolbox provides local Windows tools to merge, split, extract, rotate and organize PDF pages,
  convert between PDFs and images, edit document metadata, add watermarks and page numbers,
  protect or unlock documents with valid credentials, and apply lossless PDF stream compression.
  Processing is offline, without uploads, telemetry or accounts. Exports create separate copies.
  The portable self-contained ZIP requires no separate .NET runtime or WebView2 installation.
  Windows binaries are not Authenticode signed. Keep originals and inspect exported copies;
  preservation of every advanced PDF feature cannot be guaranteed.
