ShortDescription: Review evidence-based Windows application leftovers and move supported items to reversible quarantine.
Description: App Cleanup Doctor is an offline Windows utility for reviewing possible leftovers from uninstalled applications. It correlates evidence before allowing supported items to be selected manually, previews a frozen cleanup plan and moves eligible files, folders and Startup shortcuts to reversible local quarantine with Undo support. Eligible orphan Run/RunOnce values can be backed up and restored. Services, scheduled tasks, uninstall inventory and general registry keys remain report-only. Permanent deletion and automatic cleanup are unavailable. Microsoft Edge WebView2 Runtime is required separately. The Windows executable is not Authenticode signed.
