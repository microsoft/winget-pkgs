ShortDescription: Free Windows network troubleshooting tool - live speed widget, what's wrong finder, security checkup and 100+ tools, no admin needed.
Description: |-
  AdeeboMeter is a local-first Windows network and PC companion. A small widget shows live download and upload speed; the full view tells you whether a problem is this PC, the Wi-Fi, the router, the provider or the site, in plain English.
  It includes What's wrong? (layer by layer diagnosis), a 42-check security checkup, a Traffic Lab for test packets, read-only SNMP v2c/v3, and 100+ engineer tools. It needs no admin rights, never listens on a port, and keeps its data on the PC.
