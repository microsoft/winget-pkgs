ShortDescription: Drag a file, tap a key, pick a format. A local file converter and file toolbox for Windows.
Description: |-
  PomeloO converts and edits files on your own PC: nothing is uploaded. While you drag a file in Explorer, tap Shift and a wheel of formats appears under the cursor; drop the file on one and the converted copy appears next to the original.
  275+ conversions (images incl. HEIC/AVIF/SVG, audio, video, GIF, PDF, Word, Markdown, EPUB, slides, spreadsheets, subtitles, archives incl. RAR), 34 tools (compress to a size, photo editor, annotate, crop, redact with face/text detection, trim/split/join, PDF merge/split/password/watermark/page numbers, OCR, searchable PDF and more), recipes, history with undo, copy text from the screen, and file transfer to and from a phone by QR code.
