ShortDescription: Inspect and interact with the visual tree of running Windows applications
Description: >-
  lvt is a Windows CLI and graphical viewer for inspecting the visual tree of
  running applications. It detects Win32, ComCtl, Windows XAML, WinUI 3, WPF,
  WinForms, Avalonia, and Chromium UI; can output visual or UI Automation trees;
  captures annotated screenshots; and supports UI interaction and MCP-based
  computer-use workflows.
