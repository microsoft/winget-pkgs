  - accessibility
  - automation
  - developer-tools
  - ui-automation
  - windows
  - winui
  - xaml
Documentations:
  - DocumentLabel: Documentation
    DocumentUrl: https://github.com/asklar/lvt/blob/v0.5.1/README.md
ReleaseNotes: |-
  New features:
  - Publish combined Viewer + CLI packages for x86, x64, and ARM64.

  Other changes:
  - Build architecture-matched Viewer apphosts and validate complete release layouts.
  - Require successful WinUI 3 projection generation in CI and release builds.
  - Modernize GitHub Actions and use repository-owned MSVC environment setup.
ReleaseNotesUrl: https://github.com/asklar/lvt/releases/tag/v0.5.1
InstallationNotes: Restart your terminal after installation before using lvt or LvtViewer.
