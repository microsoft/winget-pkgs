ShortDescription: 强大、快速、抗审查的代理工具。
Description: |-
  Hysteria 是一个强大、快速、抗审查的代理工具。
  🛠️ 功能齐全
  SOCKS5、HTTP 代理、TCP/UDP 转发、Linux TProxy、TUN，更多模式不断添加中。
  ⚡ 快如闪电
  基于魔改的 QUIC 协议，Hysteria 即使在最不稳定和容易丢包的网络环境中也能提供无与伦比的性能。
  ✊ 抗封锁能力
  协议旨在伪装成标准的 HTTP/3 流量，无论中间人还是主动探测，都很难分辨和封锁。
  💻 跨平台
  我们为所有主要的平台和架构提供构建。随处部署，随处使用。还有许多兼容的第三方应用。
  🔗 易于集成
  内置对自定义验证、流量统计和访问控制的支持，Hysteria 很容易集成到已有的后端中。
  🤗 开放友好
  我们有详尽的文档、规范和代码，供开发者参考、贡献和构建自己的应用。以及一个友好的社区。
Tags:
- vpn
- 代理
- 网络
ReleaseNotes: |-
  - ACL 改用基于 expr 的全新引擎
    - 规则现在以表达式的形式编写，通过 acl.rules 或 acl.rulesFile 设置。除目标地址和协议外，还可以根据客户端的验证 ID 和地址进行匹配，例如让不同用户走不同出站
    - 新增 hysteria acl test，用于测试某个请求会使用哪条规则和哪个出站
    - 旧版语法（acl.file 和 acl.inline）仍然可以使用。旧版规则可以混用在 acl.rules 中，也可以用 hysteria acl translate 转换
    - 修复旧版语法中从 0 开始的端口范围（例如 udp/0-100）会匹配所有端口的 bug
  - 优化 UDP 转发的处理开销，提升性能（小包上传提升约 30%）
  - quic-go 更新至 v0.65.0
