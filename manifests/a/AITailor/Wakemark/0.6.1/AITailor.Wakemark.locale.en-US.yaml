ShortDescription: "Agent streams your team reviews, gates and lands on your own server"
Description: |-
  Wakemark keeps each coding agent's work as a stream: the prompts, the agent's steps, every turn's changes, the comments and the reviews, tied to the branch and its commits. Your team reviews the stream where it happened, the checks and gates you choose decide when it may land, and a merge queue lands it on your main branch. It runs the agent you already use (Claude, Codex or Gemini) with your own login, keeps your code on your git server, and syncs through a team server you run yourself.
  
  It needs Git and Node.js with npx. Free under the Wakemark Licence, also for commercial use, for up to 10 active users per organization a month; larger teams buy a Wakemark Business licence.
