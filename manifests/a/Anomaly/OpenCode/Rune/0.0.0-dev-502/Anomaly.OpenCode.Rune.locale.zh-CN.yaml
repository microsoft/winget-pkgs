PackageIdentifier: Anomaly.OpenCode.Rune
PackageVersion: 0.0.0-dev-502
PackageLocale: zh-CN
ShortDescription: 用 Rust 在 Rune 引擎上重写的开源 AI 编程智能体桌面端。
Description: |-
  OpenCode 桌面端，用 Rust 在 Rune 引擎上从零重写，macOS、Windows 和 Linux 上都是原生实现。

  - Windfoil GPU 文字：直接从矢量轮廓在 GPU 上绘制每个字形的精确覆盖，缩放和移动时文字依然锐利。
  - 启动时不加载 Chromium：内置浏览器面板（Ctrl+Alt+B）按需惰性拉取独立的 CEF 边车，不开就不付这份开销。
  - 真原生引擎：Ghostty-VT 终端页签、虚拟化的语法高亮代码与分屏 diff、原生 GPU 生成式界面与矢量图、经 Vello 预览 Word/Excel/PowerPoint、本地 Hex 语音听写、带 mmap 草稿日志的崩溃安全 SQLite，以及 63 种语言和从右到左排版。
  - 0 毫秒的界面迭代：内置支持 --!strict 的 Luau 插件，配合 --plugin-hot 原地热重载，不用碰 rustc。
  - 无头之眼，零测试：按仓库自己的政策，没有任何自动化测试或 mock。二进制可以把任意场景或 111 幕的 playground 视图离屏渲染成 PNG（--snap），导出实时的元素树（--tree），或回放脚本化输入（--script）。
  - 一些古怪的东西直接内置：在新会话页签上把字标末尾的 e 往外拉，里面有东西；把它拉出来会把字母弹成一块 800 针的 3D GPU 板，还有带合成音效的打砖块。
