ShortDescription: 本地语音听写，在您的设备上完成转写，并粘贴到您当前使用的任何应用中。
Description: |-
  Hex 是适用于 Mac、Windows 和 Linux 的本地语音听写工具。按住按键、说话，它就会粘贴。Hex 在您的设备上转写，并粘贴到您所在的任何应用中。首次运行会下载语音模型；此后没有任何内容离开您的机器。
  Windows 版本是一个托盘应用，具备 WASAPI 采集、本地 transcribe.cpp 转写、全局快捷键以及代际安全的自动粘贴。日常功能包括实时麦克风、模型和快捷键设置，按住、点按和双击快捷键模式，粘贴上次听写、录音提示音、可点击穿透的 HUD、保留的历史记录、文本替换、常驻系统托盘以及每用户登录时启动。全局和上下文模式可以重写已完成的听写，然后运行有序的内置或用户自定义 TypeScript 转换。实验性功能位于侧边栏底部的 Labs 中。
  默认快捷键为 Ctrl+Space。在“按住”模式下，说话时按住两个键，松开 Space 即可转写并粘贴。在“切换”模式下，按 Ctrl+Space 开始，再按一次结束，或按取消快捷键（默认为 Escape）丢弃录音。Hex 在匹配时会占用该组合键，如果您在其他地方依赖该组合键，请在设置中重新绑定。“粘贴上次”默认为 Ctrl+Alt+V。
