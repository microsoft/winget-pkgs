ShortDescription: Local voice dictation that transcribes on your device and pastes into whatever app you are in.
Description: |-
  Hex is local voice dictation for Mac, Windows and Linux. Hold a key, speak, and it pastes. Hex transcribes on your device and pastes into whatever app you are in. The first run downloads a speech model; after that nothing leaves your machine.
  The Windows port is a tray application with WASAPI capture, local transcribe.cpp transcription, a global shortcut and generation-safe automatic paste. Its daily-use surface includes live microphone, model and shortcut settings, Hold, Tap and double-tap shortcut modes, Paste Last Dictation, recording tones, a click-through HUD, retained History, text replacements, a resident system tray and per-user Launch at login. Global and contextual Modes can rewrite completed dictation, then run ordered built-in or user-defined TypeScript transformations. Experimental features live in Labs at the bottom of the sidebar.
  The default shortcut is Ctrl+Space. In Hold mode, hold both keys while speaking and release Space to transcribe and paste. In Toggle mode, press Ctrl+Space to start and again to finish, or press the Cancel shortcut (Escape by default) to discard the recording. Hex consumes the chord while it matches, so rebind it in Settings if you rely on that chord elsewhere. Paste Last defaults to Ctrl+Alt+V.
