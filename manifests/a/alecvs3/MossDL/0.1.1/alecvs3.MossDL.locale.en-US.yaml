ShortDescription: All-in-one download manager for the whole download process.
Description: |-
  MossDL (MossDownloader) is a free, open-source download manager for Windows.
  Paste a page or file-host link and it finds the real file behind the page, skipping
  countdown timers, fake download buttons and ad redirects on supported hosts.
  It downloads with multiple connections, groups multi-part packages, pauses and
  resumes, and can route each download over a direct connection, system VPN,
  WireGuard, HTTP or SOCKS5 proxy. The MossDL Capture extension for Chrome and
  Firefox sends links from the browser to the app.
