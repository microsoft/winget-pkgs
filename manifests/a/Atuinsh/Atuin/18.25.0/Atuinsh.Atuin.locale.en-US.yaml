ReleaseNotes: |-
  Release Notes
  Bug Fixes
  - (ai) Parse SKILL.md frontmatter with CRLF line endings (#4758)
  - (ai) Resolve in-flight tools when the chat stream fails (#4759)
  - (ai) Don't re-prompt the model after server-side tool calls (#4310)
  - (daemon) Search index race conditions (#4730)
  - (mcp) Keep the Atuin for Teams tool list cached from the daemon, and keep it through a failed call (#4726)
  - (mcp) Tell Atuin for Teams which thread is calling, and load atuin_history up front (#4768)
  - (nushell) Make keybindings work in helix mode (#4738)
  - (opencode) Write handed-off tool calls as opencode 2's own shell, read, write and edit (#4665)
  - (pty-proxy) Don't spawn pty when piped (#4734)
  - (pty-proxy) Propagate outer terminal pixel size to inner PTY (#4619)
  - (setup) Let enter expand/close submenus (#4771)
  - (setup) Ignore comments in shell init files (#4772)
  - (threads) Don't offer agents atuin can't write to as --in targets (#4662)
  - (threads) Catch a Claude Code copy up past its own turn_duration line (#4733)
  - (threads) Keep omp background job results and notices (#4773)
  - (userio) Escape control characters in messages for the user (#4757)
  - Standardize path to atuin in external config (#4766)
  - Create the key file without a hard link on Android/Termux (#4767)
  Documentation
  - (readme) Rework the README around rendered demos
  - Adjust readme (#4747)
  Features
  - (config) Warn about and avoid setting unknown keys (#4727)
  - (setup) Make atuin setup the way to set atuin up
  - (setup) Further atuin setup improvements
  - (setup) Individually select arrow and checkbox (#4774)
  - (threads) Read content blocks of kinds a newer atuin added (#4735)
  - Move datetime handling to jiff, with DST-aware time zones (#4765)
  Miscellaneous Tasks
  - (ai) Remove the Atuin AI agent (#4764)
  - (theme) Remove theme.max_depth and theme.debug (#4755)
  - Update agent instructions (#4754)
  - Move release skill to .agents (#4775)
  Performance
  - (daemon) Update the search index in place on delete (#4743)
  Refactor
  - Ensure ai features are gated by "ai" crate feature (#4756)
  Testing
  - (common) Keep repo walk proptest clear of Windows device names
  atuin 18.25.0
  Install atuin 18.25.0
  Install prebuilt binaries via shell script
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/atuinsh/atuin/releases/download/v18.25.0/atuin-installer.sh | sh
  Install prebuilt binaries via powershell script
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/atuinsh/atuin/releases/download/v18.25.0/atuin-installer.ps1 | iex"
