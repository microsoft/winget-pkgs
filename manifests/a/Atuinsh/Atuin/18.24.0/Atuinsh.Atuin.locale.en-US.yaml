ReleaseNotes: |-
  Release Notes
  Bug Fixes
  - (ai) Saturate file-tracker mtimes and rebuild on new migrations (#4250)
  - (ai) Start the daemon before ai commands if autostart is enabled (#4269)
  - (ai) Add MCP list cache fields and a since filter for session list (#4294)
  - (ai) Only look up repos for this host's sessions in the resume picker (#4400)
  - (ai) Fit the resume picker's title to the version so a prerelease isn't cut off (#4406)
  - (ai) Correct large-file read guidance (#4355)
  - (ai-session) Read an unknown parent kind as None (#4301)
  - (ai-session) Count content-derived calls once per session lineage (#4314)
  - (ai-session) Keep compacted Claude and Pi sessions whole when restored from sync (#4357)
  - (ai-session) Link a Claude compaction that kept messages to the line before it (#4370)
  - (ai-session) Harden capture, sync and resume across agents (#4387)
  - (ai-session) Fix opencode 1.x resume capture, A→B→A catch-up, synced tail, and picker tty, keys and idle CPU (#4398)
  - (ai-session) Switch inside a merged run past a failed call without losing the run's earlier text (#4402)
  - (build) Drop atuin's implicit arboard feature so nix builds again (#610)
  - (config) Don't let a default ~/.atuin/config.toml hide the legacy config, and warn when one does (#4420)
  - (config) Avoid shadowing data dir, fix gaps in avoidance logic (#4421)
  - (daemon) Recover ai sessions in the background at boot (#4293)
  - (daemon) Pick up ai.capture_sessions changes without a restart (#4362)
  - (daemon) Run the daemonized daemon from / (#4358)
  - (daemon) Write the record store before history.db when a command finishes (#4361)
  - (daemon) Time out shell hook calls to an unresponsive daemon (#4360)
  - (daemon) Only restart a daemon older than the client (#4359)
  - (doctor) Fix sqlite error in atuin doctor (#4354)
  - (hook) Write absolute executable path to agent configs (#4044)
  - (pty-proxy) Fix forwarding of output to parent terminal under load (#4217)
  - (pty-proxy) Fix PTY proxy initialization in fish (#4224)
  - (pty-proxy) Preserve login shell status in init script (#4271)
  - (pty-proxy) Periodically touch the socket to prevent automatic deletion (#4366)
  - (scripts) Correct shebang prefix handling (#4416)
  - (sync) Give sync errors their full cause and HTTP status, and flag a non-Atuin sync_address (#4423)
  - (systemd) Stop pulling in systemd-networkd-wait-online (#4415)
  - (vendor) Find the repository root from the script's location
  - Timezone awareness during atuin search (#3762)
  - Handling of OSC 133 sequences in prompt (#4221)
  - Don't (re)start daemon on history end (#4229)
  - Fall back to saving history locally when the daemon can't be started (#4234)
  - Use github release proxy (#4297)
  - Improve "output capture disabled" message (#4296)
  - Literal out of range for usize (#4295)
  - Meaning of today in mcp since (#4300)
  - Atuin update --prerelease (#4429)
  Documentation
  - (ai) Describe continuing in another agent as carrying tool calls over (#4403)
  - (zinit) Fix bpick pattern, add wait/lucid ices (#3492)
  - Limit installation methods to those that install the latest version (#4219)
  - Remove information about dotfiles in support matrix (#4298)
  Features
  - (ai) List, read and richer search MCP tools for sessions (#4280)
  - (ai) Add atuin ai resume, a picker over agent sessions (#4311)
  - (ai) Resume sessions recorded on other machines (#4315)
  - (ai) Give every AI session a fixed UUIDv7 atuin id (#4326)
  - (ai) Show parent, root and children links as atuin ids (#4337)
  - (ai) Continue a session in another agent from atuin ai resume (#4325)
  - (ai) Fork a session from atuin ai resume (#4340)
  - (ai) Work out a session's heads on demand, with Codex rows linked to the row before (#4341)
  - (ai) Catch sessions up with sync on resume, and fork from another machine's branch (#4345)
  - (ai) Switch a diverged session's copy to another machine's branch on resume (#4350)
  - (ai) Capture tool calls as well as messages (#4352)
  - (ai) Capture and restore the diffs of agents' edits (#4369)
  - (ai) Filter session reads by query and role, rank substring history matches first (#4367)
  - (ai) Add atuin resume as short for atuin ai resume (#4382)
  - (ai) List forks as a tree under their root in the session picker, mark running forks, and name the provider in Codex rollouts (#4399)
  - (ai) Show the atuin id as ID and the harness's own as Harness ID in the resume picker's Inspect tab (#4401)
  - (ai) Session picker reader pane, two-line rows grouped by day, visible scopes, per-session actions and an in-list resume chooser (#4383)
  - (ai) Show atuin's MCP tool calls as 🐢 atuin in the session reader (#4411)
  - (ai) Rename AI sessions to threads: atuin threads, [threads] and threads.db (#4418)
  - (ai-session) Faster sidecar rebuilds, session grouping, and one search API (#4302)
  - (ai-session) Fast-forward a behind transcript to its synced head (#4344)
  - (ai-session) Search by message role and without subagents, and know a stateless MCP caller's own session (#4385)
  - (ai-session) Show short session ids, and select text with the mouse in the resume picker (#4404)
  - (ai-session) Capture sessions from when it's turned on, and atuin config enable ai-sessions (#4389)
  - (api-client) Add the atuin.api.v1 protos (#4312)
  - (common) Add BlockingPool, a cap on concurrent blocking work (#4242)
  - (daemon) Store daemon socket path in pidfile (#4253)
  - (i18n) Localize user-facing text with Fluent (#4233)
  - (mcp) Add atuin mcp install <agent> and per-agent setup docs (#4417)
  - (output) Add command_filter to drop output but keep history (#4268)
  - (pty-proxy) Switch from OSC 133 to Atuin-specific sequence (#4291)
  - (search) Add accept-cd and return-cd keymap actions (#4319)
  - (secrets) Add several new known secrets formats (#4364)
  - (server) Read the database password from db_password_file (#4425)
  - Read login password and key from env or stdin (#3498)
  - Enable workspaces by default (#1838)
  - Capture ai agent sessions into the store (#4212)
  - Automatically open login link (#4351)
  - Send atuin register's login link to the hub's signup page (#4353)
  - Config disable (#4349)
  - Unify all data in ~/.atuin (customizable with ATUIN_HOME) (#4380)
