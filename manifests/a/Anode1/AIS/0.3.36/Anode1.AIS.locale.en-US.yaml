ShortDescription: Save links, notes and passwords under your own tags. Offline, no account.
Description: >-
  AIS files a link, a note, a file path or a password under the keys you
  choose and recalls it by any of them. The store is plain text on your own
  machine: no server, no account, nothing leaves the computer. One native
  engine, under a megabyte, with a command line (ais), a local web GUI
  (ais --serve) and a small native window (ais-gui). The same index syncs
  with the Android and iPhone apps over the local network, and an MCP server
  (ais --mcp) gives an AI agent read access to it.
