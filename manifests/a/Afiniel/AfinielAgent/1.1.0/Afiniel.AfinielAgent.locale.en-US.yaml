ShortDescription: Personal AI agent that runs locally with LM Studio, from research and code to 3D models in Blender.
Description: |-
  Afiniel Agent is a personal AI agent for your desktop that runs on your own computer with a local model in LM Studio.
  It researches the web, reads and writes files, writes and runs code, connects to MCP tools and remembers what matters to you.
  It also builds 3D models in a live Blender session: it writes Blender Python scripts, renders previews and checks its own renders with a vision model.
