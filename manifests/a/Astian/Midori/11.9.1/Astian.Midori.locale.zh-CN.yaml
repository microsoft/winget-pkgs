PackageIdentifier: Astian.Midori
PackageVersion: 11.9.1
PackageLocale: zh-CN
ShortDescription: 一款轻量、快速且安全的浏览器，尊重用户隐私，内置广告拦截器、VPN 浏览等功能
Description: |-
  Midori Browser 以轻量、安全以及高度隐私著称，内置广告拦截器、VPN 浏览、私密搜索以及丰富的自定义选项。它是由 Astian 开发的、基于 Firefox 的浏览器。

  默认零遥测
  - 使用 Midori 无需注册任何内容：不需要邮箱、不需要账号，也不会留下任何你曾访问过的服务端记录。
  - 不会向公司服务器同步数据。

  原生跟踪拦截
  - 广告与跟踪器拦截器直接集成在浏览器引擎中，而不是事后安装的扩展组件；它会在请求离开设备之前对其生效。
  - 广告拦截、反跟踪、Never-Consent 与 IA Shield 默认全部开启。

  内置 VPN
  - Midori 在浏览器中直接内置 MidoriVPN，无需扩展或外部应用，在侧边栏一键即可启用 VPN 并选择服务器。

  Midori Center
  - Midori Center 集中管理浏览器设置：标签页外观、侧边栏、工作区、键盘快捷键以及隐私与 VPN 开关。

  100% 开源
  - Midori 的每一行代码都是公开的，可以阅读代码、验证其声明并派生该项目。
