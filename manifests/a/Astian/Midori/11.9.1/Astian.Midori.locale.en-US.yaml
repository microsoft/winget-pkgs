ShortDescription: A lightweight, fast, and secure browser that respects user privacy, with an ad blocker, VPN browsing, and more
Description: |-
  Midori Browser is known for being lightweight, secure, and extremely private, with a built-in ad blocker, VPN browsing, private search, and extensive customization. It is a Firefox-based browser developed by Astian.

  Zero telemetry by default
  - Use Midori without registering anything. No email, no profile, and no server-side record that you ever visited.
  - No sync to company servers.

  Native tracker blocker
  - The ad and tracker blocker is integrated into the engine, not an extension you install afterwards. It acts on outgoing requests before they leave the device.
  - Ad Blocking, Anti-Tracking, Never-Consent and IA Shield are all on by default.

  Built-in VPN
  - Midori includes MidoriVPN directly in the browser. No extensions or external apps are needed; activate your VPN with one click from the side panel and choose your server.

  Midori Center
  - Midori Center centralizes all browser settings: tab appearance, sidebar, workspaces, keyboard shortcuts, and Privacy & VPN toggles.

  100% open source
  - Every line of Midori is public. Read the code, verify the claims, fork the project.
