ReleaseNotes: |-
  Added Features
  - Mark SLES as a comprehensive distro [PR #3732 @willmurphyscode]
  - Store NVD SSVC decision points in a new v6 decorator table [PR #3725 @wagoodman]
  - Adding Locations column to html template which help with triaging [PR #3092 @santrancisco]

  Bug Fixes
  - sign release checksums with a sigstore bundle [PR #3759 @wagoodman]
  - chainguard osv package ecosystem should be package type [PR #3758 @kzantow]
  - include qualifiers for unaffected packages [PR #3734 @kzantow]
  - render TUI log lines on their own rows, with colors and a small header [PR #3735 @wagoodman]
  - match.dpkg.using-cpes (and match.rpm.using-cpes) is accepted but has no effect [Issue #3746] [PR #3747 @amitschendel]
  - embedded spaces in bin location breaks install.sh [Issue #2809] [PR #3738 @bIackr0se]
  - False positives: --add-cpes-if-none maps tomcat-embed-el to apache:tomcat CPE [Issue #3730]
  - match.rpm.using-cpes has no effect [Issue #3752] [PR #3753 @amitschendel]
  - Import metadata digest is not in the expected format [Issue #3388]
  - Issue Pulling DB update [Issue #3586]

