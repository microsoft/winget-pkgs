ReleaseNotes: |-
  Added Features
  - Expose distro-fixed dropped matches via ignoredMatches so --show-suppressed can surface them [Issue #3450] [PR #3705 @philroche]
  - Licensing: copyright owner missing, needed for Debian packaging [Issue #3501]

  Bug Fixes
  - fixes typo in cpe example input for cpe-direct scan [PR #3679 @zhill]
  - --by-cve: which advisory record survives the merge varies between runs [Issue #3630]

  Additional Changes
  - OpenVEX transformer drops the namespace from Go module PURLs [Issue #3680] [PR #3683 @arpitjain099]
  - Docs missing for include-aliases [Issue #3663] [PR #3671 @dev-rehaann]

