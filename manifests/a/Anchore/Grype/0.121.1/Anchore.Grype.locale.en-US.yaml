ReleaseNotes: |-
  Bug Fixes
  - extract the quality gate debug artifact outside the checkout [PR #3875 @wagoodman]
  - incorrect constraint for versionless purls in openvex [PR #3874 @kzantow]
  - report additional version-range records for a package [PR #3782 @jspilman]
  - report a package's vulnerability as added or removed only when its affected record set changes [PR #3784 @jspilman]
  - report the lowest overlapping AlmaLinux fix [PR #3783 @jspilman]
  - report fix date and kind changes under the package [PR #3781 @jspilman]
  - label db diff databases in the order they were provided [PR #3816 @bot190]
  - time out stalled db diff downloads [PR #3858 @wagoodman]
  - only remove db diff directories that grype created [PR #3828 @wagoodman]
  - make db diff --packages and --vulns include only what was requested [PR #3815 @bot190]

  Performance
  - index ignore rules by vulnerability ID [PR #3817 @juanjsebgarcia]
  - speed up db diff and reduce its memory and temp disk use [PR #3813 @bot190]

  Additional Changes
  - grype 0.119.0 allocates without bound on a CycloneDX machine-learning-model component with no purl and no CPE [Issue #3767]
  - add a directory for grype-specific match labels [PR #3849 @wagoodman]
  - let go-make own the go version and move images to debian13 [PR #3840 @wagoodman]

