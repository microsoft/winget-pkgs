ReleaseNotes: |-
  Added Features
  - OS End of life warnings should account for SupportEnd date from the distro release information [Issue #3230] [PR #3787 @tomersein]
  - Licensing: copyright owner missing, needed for Debian packaging [Issue #3501] [PR #3791 @wagoodman]

  Bug Fixes
  - fix(db-build) allow configuring sqlite cache size at db build time [PR #3814 @willmurphyscode]
  - Carry AlmaLinux fix dates onto replaced RHEL matches [PR #3773 @wagoodman]
  - carry fix availability through extended support fix merging [PR #3809 @bot190]
  - upgrade to golang.org/x/net v0.61.0 [PR #3802 @westonsteimel]
  - Swift Package Manager packages miss GitHub Swift advisories (searched by identity, not repository path) [Issue #3795] [PR #3713 @az-catch]

  Additional Changes
  - bump go-make module and action together [PR #3793 @wagoodman]

