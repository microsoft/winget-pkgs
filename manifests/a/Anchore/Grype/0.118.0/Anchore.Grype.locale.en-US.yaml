ReleaseNotes: |-
  Added Features
  - apk matcher does alias aware aggregation [PR #3634 @crosleyzack]

  Bug Fixes
  - prevent panic on portage versions without digits [PR #3655 @ashvinctrl]
  - grype vex does not match oci purl with repository_url [Issue #3657] [PR #3659 @spiffcs]
  - Old JVM version comparisons sometimes incorrect [Issue #2701] [PR #3583 @Eljees]
  - CVSSv4 calculation can produce incorrect vulnerability severity [Issue #3656]
  - Grype 0.90.0 DB update failed [Issue #3629]

