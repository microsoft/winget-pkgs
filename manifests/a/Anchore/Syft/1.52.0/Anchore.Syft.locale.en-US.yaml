ReleaseNotes: |-
  Added Features
  - passthrough-exact-format copies matching syft-json input unchanged [PR #5279 @juanjsebgarcia]

  Bug Fixes
  - bound what a compressed kernel module expands to [PR #5294 @wagoodman]
  - bound the decompressed members of a .deb archive [PR #5293 @wagoodman]
  - alpm mtree gzip unbounded processing [PR #5292 @wagoodman]
  - graalvm unbounded allocation [PR #5291 @wagoodman]
  - harden .NET PE/ELF parsing against malformed binaries [PR #5267 @wagoodman]
  - bound allocations from UPX-packed binary headers [PR #5195 @wagoodman]
  - Syft rpm-db-cataloger reports stale libssh version from a single-layer Rocky Linux 10 image [Issue #5247]
  - java-archive-cataloger returns unknown ver for uber-jars [Issue #5163] [PR #5164 @rezmoss]

