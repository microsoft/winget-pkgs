ReleaseNotes: |-
  Added Features
  - tighten source-distribution external refs [PR #5493 @wagoodman]
  - output source PURL as external reference [PR #5246 @swadaptive]
  - Full cataloging of archive contents [Issue #246] [PR #5260 @kzantow]

  Bug Fixes
  - hash each file once in the file digest cataloger [PR #5491 @wagoodman]
  - Support envoy binary various versions [Issue #5470] [PR #5476 @pujitha24]
  - Support istio binary various versions [Issue #5060] [PR #5121 @hsdfat]
  - CPE identifiers contain a wildcard in the CPE part field for packages discovered by the Bitnami cataloger [Issue #5123] [PR #5127 @vigneshakaviki]

  Additional Changes
  - Gradle lockfile comment line is catalogued as a package [Issue #5371] [PR #5372 @pujitha24]
  - use correct error variable in package load [PR #4983 @idhyt]
  - let go-make own the go version [PR #5464 @wagoodman]
  - preserve semver build metadata in ffmpeg version [PR #5452 @akshaver]

