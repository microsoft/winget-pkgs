ReleaseNotes: |-
  Bug Fixes
  - skip Linux release identification if there is nothing to parse [PR #5482 @caleballen]
  - use pointer receiver for FileResolver to enable reuse [PR #5483 @caleballen]
  - report dpkg packages listed in both status and status.d once [PR #5565 @spiffcs]
  - find license files under .dist-info/licenses (PEP 639) [PR #5496 @ToreMerkely]
  - sort uv.lock extras by name so the SBOM output is stable [PR #5468 @wleeaf]
  - keep single-character names in requirements.txt [PR #5469 @protonnegativo]
  - do not use libavcodec ABI versions as FFmpeg release versions [Issue #5548] [PR #5552 @Rudra184]
  - Support julia binary various versions [Issue #5061] [PR #5494 @26wv]
  - Bun classifier reports historical version text before the runtime banner [Issue #5553] [PR #5558 @sarankumar1325]
  - License normalization drops Classpath-exception-2.0 and uses AND instead of OR for Eclipse/GlassFish JARs [Issue #5009] [PR #5080 @Eljees]

