ShortDescription: Voice to text in any app. Press a hotkey, talk, and your words are typed where your cursor is.
Description: |-
  HyperVoice is a dictation hotkey for Windows. Press it in any app, talk, press it again, and the text lands at your cursor: an email, a chat message, a document, a code comment, a terminal prompt.
  Speech-to-text runs on your PC with Whisper speech models or NVIDIA Parakeet. Optional AI clean-up styles (email, chat message, notes, your own) are off by default; when used, the text (not the audio) is sent to an AI provider.
  Free: 500 words a day, no card.
