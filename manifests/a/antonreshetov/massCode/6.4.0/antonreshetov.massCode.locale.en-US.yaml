ReleaseNotes: |-
  Meet Torsher
  Torsher is an open-source, self-hosted media center for your TV. It runs in a Docker container on your own hardware and brings browsing, playback, and your media library together. You can start watching while a file downloads and follow shows to pick up new episodes automatically. Explore Torsher.

  massCode on Reddit
  The massCode subreddit is open. Share your setup, show off a theme, ask questions, or talk about how you use the app. Join r/massCode.

  Community Themes Gallery
  Browse themes by name or author, preview their colors, and install and apply them in one click from Settings → Appearance → Community Themes. You can also update or uninstall themes from the gallery. If you've edited a theme locally, massCode asks before replacing or removing it.
  To share a theme you've made, apply it and click Submit to Community. massCode opens a prefilled pull request on GitHub for you to review and submit.

  Custom Themes in System Mode
  Choose your own light and dark themes in Settings → Appearance. In System mode, massCode switches between your choices automatically when your operating system changes appearance. You can use built-in, custom, or community themes for either choice.

  Workflow Improvements
  - Added an MCP quickstart and practical workflows for using snippets, Markdown notes, and saved HTTP requests with a coding agent. Browse the MCP guides.
  - Updated the Japanese translation across the app.

  Fixes
  - The Notes dashboard graph preview displays the full graph, and labels no longer overlap. Long note titles wrap to stay readable.
  - The raw Markdown editor in Notes uses the available width and gives three-digit line numbers enough room.
  - Tag entry respects input method composition, so confirming a Japanese character candidate with Enter doesn't create a tag prematurely.
  - Math Notebook evaluates decimal commas and grouped numbers in expressions such as 2,50 + 1,25 and 1.234,56 + 1.
  - Math Notebook distinguishes modulo from percentages and simplifies speed multiplied by time to a distance.
  - Same-currency arithmetic and conversions with a manually specified exchange rate work when live rates are unavailable.
  - A calculation error in Math Notebook stays on its own line, and hovering over it shows the full message.
  - Math Notebook saves pending edits before quitting or switching vaults. Editing one sheet also preserves external changes to other sheets.

