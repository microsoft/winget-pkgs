ShortDescription: A file converter that lives at your cursor.
Description: |-
  Drag a file, tap right-click (or Shift) mid-drag, and drop it on a button in the wheel that pops up around your cursor.
  Converts images (PNG, JPG, WebP, HEIC, AVIF, SVG and more), video, audio and documents, and can resize, crop, compress and trim.
  Everything happens on your PC: nothing is uploaded, and the original file is never changed.
