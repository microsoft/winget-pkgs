ShortDescription: Free AutoCAD-style 2D CAD that opens and saves DWG and DXF.
Description: |-
  CADaddy is a free computer-aided design and drafting program that works the way AutoCAD users already do:
  a command line, object snaps, ortho and polar tracking, layers, dimensions, hatches, text, tables, blocks,
  dynamic blocks and external references (xrefs). It opens and saves DWG and DXF drawings, plots layouts to PDF
  and converts PDF drawings into editable DWG. No ads, no subscription, no account.
  AI assistants can drive it through its built-in Model Context Protocol (MCP) server.
