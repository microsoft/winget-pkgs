ShortDescription: A PS5-style Create button for Windows. Save the last minutes of gameplay, take screenshots and record with Alt + C or your controller.
Description: |-
  Capture Menu keeps the last 30 minutes of your game in a replay buffer. Press Alt + C, or Create / View on a
  PlayStation or Xbox controller, to open a bar over the game and save the last 15 seconds up to 30 minutes,
  take a screenshot or record. Press it twice to save the last 30 seconds without opening anything.
  Captures go into a folder per game, with a viewer, frame-exact trim, voice and game on their own tracks,
  and one-step copies for phones and Discord. Built on OBS Studio and FFmpeg, which are installed and set up
  for your PC. English and Arabic.
