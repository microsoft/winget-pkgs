ReleaseNotes: |-
  DesktopGo v1.0.5 🎉
  v1.0.5 是一次大版本迭代，带来 AI 智能整理、Everything 全局搜索、滚动分组布局三大核心能力，同时全面增强了图标系统与外观自定义，并对设置页和工程质量做了系统性重构。
  新功能 🚀
  - AI 智能整理助手：新增对话式 AI 面板，支持多协议流式模型接入，可展示模型思考过程并随时停止生成。AI 能分析桌面图标自动生成分组方案，整理结果以网格预览呈现、确认后应用；支持滚动分组智能整理，会话与快照在面板切换间保留。
  - Everything 全局搜索：快捷入口与本地文件混合搜索，按相关性与使用频率排序；一次性加载完整结果快照，大结果集滚动流畅无占位闪烁；支持方向键导航、平滑移动高亮，可配置最佳匹配目录与文件类型、目录清单图标库，并提供图标库管理入口。
  - 滚动分组布局：图标网格支持无限滚动分组、侧边栏紧凑布局与收起；外层与分组间拖拽重定向、组内排序、文件夹拖入自动打开/延迟关闭；FLIP 动画平滑重排，新增网格几何锁定机制防止 DPI 切换导致图标重排。
  - 图标系统全面增强：支持自定义图标源——网站图标提取（含 cookie 支持）、SVG 优化、主色提取、圆角裁剪、文字图标与颜色方案；新增图标编辑与 Windows 平台图标管理，可直接把系统图标拖入启动台。
  - 外观自定义：支持自定义背景图、全局主题色、背景蒙版浓度与模糊；启动台窗口统一透明背景与毛玻璃效果；多选拖框、Dock 线性预览等启动台交互继续完善。
  - 双语安装器：安装程序支持中英文双语界面与被动更新进度窗口。
  修复与优化 🛠️
  - 修复托盘图标缩放模糊与圆角锯齿。
  - 修复系统图标原生拖放注册、拖拽数据解析与拖放效果协商。
  - 修复导入图片不显示缩略图、导入快捷方式图标边框异常。
  - 设置窗口移除外框、修复表面层级与导航状态颜色、修复主题选中态颜色偏移。
  - 修复滑块文字与刻度重叠，统一表单控件聚焦边框与滑块数值字体。
  - 搜索稳定性：防止 Everything 旧回包污染后续查询、保留未匹配结果的提供方顺序、修复使用数据首次加载。
  - 体验细节：统一应用滚动条样式、全局字体接入主题变量并统一等宽栈、组件懒加载与错误边界兜底。
  工程与发布 📦
  - Rust 端建立零告警质量门禁（clippy 严格检查 + 文件/函数预算），按模块拆分 AI、搜索、图标、图标网格等职责，显著降低单文件复杂度。
  - 前端重整静态检查基线，拆分大型组件并清理 Hook 告警。
  - 新增提交规范与并行预检工作流（限时构建 + 千行文件门禁）。
  - 修复依赖扫描误扫构建产物的问题；测试构建发布流程改为独立草稿，便于发布前核对。
  本次发布已同步更新应用版本号与发布说明文件，满足现有 GitHub Actions 发布流程要求。
