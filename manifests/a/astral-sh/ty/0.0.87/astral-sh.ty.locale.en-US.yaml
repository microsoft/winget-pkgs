ReleaseNotes: |-
  LSP server
  - Clamp notebook cell positions to the end of the cell (#29307)
  - Fix deadlock when requests arrive before workspace configuration (#29303)
  - Fix notebook cell lookups after cells with cell magics (#29308)
  - Fix panic on completions past the end of a notebook's last cell (#29306)

  Diagnostic improvements
  - Add opt-in mismatched-sentinel-name rule (#27206)
  - Deduplicate identical argument type diagnostics (#29337)
  - Enable invalid-mutable-override by default (#29335)
  - Improve display of distinct string literal types (#29206)
  - Respect suppression of attribute override diagnostics (#29327)

  Core type checking
  - Check overrides of receiver attribute declarations (#28557)
  - Infer the default for definitely absent keys in closed TypedDict.get calls (#29136)
  - Leave room for later positional arguments when unpacking a variable-length argument (#29293)
  - Preserve minimum lengths of unpacked tuple unions (#29331)
  - Specialize bare generic class name with type[...] type context (#29248)

  Performance
  - Avoid constructing nominal complements (#29292)
  - Optimize system path equality (#29340)

