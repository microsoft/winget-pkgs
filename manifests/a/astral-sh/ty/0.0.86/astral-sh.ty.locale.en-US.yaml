ReleaseNotes: |-
  Bug fixes
  - Infer empty collection branches from nonempty literals (#29131)
  - Invalidate dependency metadata when environments change (#29126)
  - Preserve final attribute restrictions on composite types (#29135)
  - Preserve recursive structure in Annotated values (#29058)
  - Specialize inherited dataclass field converters (#29192)

  LSP server
  - Show documentation for annotation operators on hover (#29185)

  Core type checking
  - Check attribute and property override types (#28556)
  - Narrow tuple unions through truthiness and type checks (#29125)
  - Preserve literal types when consuming dictionary literals (#29145)
  - Preserve non-boolean comparison results for intersections (#28045)
  - Preserve receiver specializations when calling unions of bound methods (#29015)
  - Represent uninhabited truthiness explicitly (#28843)
  - Solve validity type context through constraint sets (#28909)

  Performance
  - Avoid recursion guards for non-generic nominal targets (#29202)
  - Check exact exclusions before intersection positives (#29195)

  Memory usage improvements
  - Share constraints in retained sequent maps (#28966)

  Other changes
  - Update the default Python version to 3.15 (#28792)
  - Update to Unicode 17 (#21229, #28784)
  - Always show fixes in the CLI (#27810)

