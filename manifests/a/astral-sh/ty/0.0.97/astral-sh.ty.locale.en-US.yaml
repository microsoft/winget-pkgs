ReleaseNotes: |-
  Bug fixes
  - Apply a cycle iteration cutoff across type inference (#30010)
  - Cap the size of inferred bytes literals during concatenation (#29942)
  - Django: support ForeignKey and OneToOneField as primary keys (#29785)
  - Fix a call hierarchy panic when expanding outgoing calls (#29964)
  - Handle decorators that replace overrides of final methods (#29961)
  - Ignore an empty VIRTUAL_ENV (#29973)
  - Preserve narrowed type variables in union inference (#29989)

  Diagnostic improvements
  - Lower severity of diagnostics on recoverable invalid globs (#29946)
  - Rename unresolved-import to import-not-found (#29960)

  Other changes
  - Document baseline support (#4897)
  - Document third-party library support. (#4879)
  - Pydantic: Respect extra-field configuration on settings models (#29902)
  - Reuse matching constraints at branch joins (#29875)
  - Reuse normalization of wide unions (#29874)
  - Skip empty diagnostic context for overloaded callables (#29959)
  - Speed up comparisons of deeply nested tuples (#29933)
  - Update PyCharm setup instructions for 2026.2 (#4914)

