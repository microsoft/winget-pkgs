ReleaseNotes: |-
  Bug fixes
  - Allow subclasses to restore hashability (#29471)
  - Avoid crashes when negating recursive aliases (#29429)
  - Avoid stack overflow for recursive descriptor setter checks (#29467)
  - Defer constructor type variable defaults (#29469)
  - Preserve bound receivers for strict signature checks (#29396)
  - Preserve read types for dynamic attributes (#29461)
  - Reject runtime_checkable on non-protocol classes (#29460)
  - Validate TypeAliasType keyword arguments (#29466)

  LSP server
  - Add return-type inlay hints (#29437)

  Other changes
  - Adopt stable macOS signing identifiers (#4743)
  - Avoid inserting inlay hints containing stub-only types (#29477)
  - Filter incompatible union members during union inference (#29344)
  - Infer ParamSpecs from call-wide constraints (#28828)
  - Mitigate pauses from clearing cached ASTs in more language server operations (#29232)
  - Report read-only keys when deleting, popping, or defaulting TypedDict items (#29441)
  - Support uv's nested module ownership metadata (#29436)

