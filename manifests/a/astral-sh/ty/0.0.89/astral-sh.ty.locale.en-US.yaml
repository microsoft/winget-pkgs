ReleaseNotes: |-
  Core type checking
  - Added support for return type inference for unannotated functions and methods (#29253).
    Return type inference is currently disabled by default. Enable it with the analysis.return-type-inference setting in pyproject.toml:
    [tool.ty.analysis]
    return-type-inference = "always"
    Or in ty.toml:
    [analysis]
    return-type-inference = "always"
    Please share your feedback, especially any problems you encounter, in the return type inference feedback issue.
  - Sync vendored typeshed stubs (#29402). Typeshed diff

  Bug fixes
  - Avoid a panic when negating dynamic type aliases (#29427)
  - Widen tuple literal lengths when other collection elements contain nested tuple types (#29147)
  - Report invalid Generic and Protocol arguments containing nested variadic type variables (#29146)

  Performance
  - Speed up generic class-pattern narrowing by skipping impossible intersection comparisons (#29240)

  Contributors
  - @carljm
  - @charliermarsh
  - @sharkdp
