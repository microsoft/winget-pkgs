ReleaseNotes: |-
  Breaking changes
  - Split incompatible TypeIs narrowings into two new rules (#29949)

  Bug fixes
  - Avoid exponential constraint search in generic constructor inference (#30474)
  - Check fixed prefixes when assigning ParamSpec callables to gradual Concatenate (#30470)
  - Fix stack overflow checking a generic base initializer (#30473)
  - Fix variance inference for frozen Pydantic models on 3.12 and earlier (#30452)
  - Preserve compatible overloads when partially binding a union argument (#30446)
  - Preserve fixed parameters when comparing gradual callables (#30509)

  LSP server
  - Report workspace diagnostics while scripts initialize (#30410)
  - Sync script environments when opening the file, when using diagnosticMode: "openFilesOnly" (#30381)

  Configuration changes
  - Add project-manager.script = "uv" (#30489)
  - Resolve script file settings independently of uv (#30407)

  Other changes
  - Auto-generate reference documentation for ty-extensions (#5056)
  - Handle TypedDict union pairs before other simplifications (#30516)

