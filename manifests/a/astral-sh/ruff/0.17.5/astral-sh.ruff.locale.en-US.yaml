ReleaseNotes: |-
  Released on 2026-11-12.

  Preview features
  - Redirect renamed rules (#30081)
  - [flake8-async] Implement `pytest-raises-exception-group` (ASYNC401) (#28772)
  - [flake8-logging-format] Mark G004 fix as unsafe (#30087)
  - [pylint] Implement `no-method-argument` (PLE0211) (#29748)
  - [refurb] Do not offer fix when `write` is nested in an expression (FURB103) (#29789)
  - [ruff] Add `renamed-rule` (RUF202) (#30079)
  - [ruff] Expand `redirected-noqa` to other suppression comments (RUF101) (#30078)

  Bug fixes
  - Avoid crashing when Ruff logs to a closed stderr pipe (#30209)
  - Fix fixes that add or remove a keyword argument with a parenthesized value (#30189)
  - [flake8-import-conventions] Avoid shadowing names when fixing import aliases (ICN001) (#30035)
  - [flake8-bugbear] Fix B010 autofix for parenthesized `setattr` calls (#30168)
  - [flake8-pyi] Fix PYI034 autofix for parenthesized `self` annotations (#30173)
  - [pyupgrade] Fix UP031 duplicating closing parentheses around the format string (#30172)

  Rule changes
  - [flake8-bugbear] Ignore frozen dataclass instantiations (B008) (#29231)

  Performance
  - Various performance improvements (#30375, #30211, #30368, #30259, #30354, #30115, #30133, #30132, #30358, #30135, #30369, #30351, #30352, #30347, #30379, #30328, #30329, #29446)

  Other changes
  - Fix FreeBSD source builds with libc 0.2.190 (#30176)
