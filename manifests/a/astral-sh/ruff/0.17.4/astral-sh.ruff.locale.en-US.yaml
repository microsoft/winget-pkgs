ReleaseNotes: |-
  Released on 2026-11-05.

  Preview features
  - [flake8-logging-format] Avoid behavior changes and syntax errors in fixes (G004) (#27419)
  - [security] Implement `tarfile-ignore-zeros-true` (#28680)

  Bug fixes
  - Accept a bare raise before a semicolon (#29761)
  - Allow match identifiers after a semicolon (#29760)
  - Fix panic on BOM-prefixed files in diagnostic renderer (#30017)
  - [flake8-simplify] Report collapsible `elif` clauses after a multi-statement `if` branch (SIM102) (#29814)

  Rule changes
  - Show more nonprinting characters in diagnostic fix diffs (#30062)

  Performance
  - Coalesce source slices when formatting attributes (#29841)
  - Collect return statements with a statement-only visitor (#29911)
  - [pyflakes] Defer value comparisons for repeated dictionary keys (F601, F602) (#29739)
  - Format node fields directly when comment handling is unnecessary (#29853)
  - Reduce formatter source-slice overhead (#29855)
  - Reuse a callee's qualified name across lint rules (#29916)
  - Skip invalid string character checks when the source contains none (#29883)
  - Use a Bloom filter for formatter comment lookups (#29852)
  - Use a concrete buffer for ordinary writes (#29819)

  CLI
  - Give `NO_COLOR` precedence in Ruff and ty diagnostics (#29898)
  - Honor `CLICOLOR=0` in Ruff and ty diagnostics (#29910)

  Documentation
  - Correct the documented `version` and `src` defaults for `ruff-action` (#29880)
  - [flake8-bugbear] Make B014 example error out-of-the-box (#29941)
  - [flake8-no-pep420] Document preview behavior (INP001) (#29764)
  - [isort] Expand I001 documentation (#29843)

  Other changes
  - [syntax-errors] Extend `__debug__` write check to attribute targets (#27908)
