ReleaseNotes: |-
  Released on 2026-10-15.

  Preview features
  - [pycodestyle] Don't treat `None`, `True`, or `False` as keywords (E271-E274) (#29322)

  Bug fixes
  - Fix dedent with multiple leading comments (#29382)
  - [flake8-pyi] Detect legacy positional-only parameters in `__new__` methods (PYI063) (#28502)
  - [flake8-pyi] Fix false positives on quoted annotations (PYI036) (#29274)
  - [perflint] Avoid invalid comprehension suggestions (PERF401, PERF403) (#29366)

  Rule changes
  - Treat more `collections` and `weakref` containers as mutable (#29213)

  Documentation
  - [flake8-import-conventions] Update default and example `aliases` (#29333)
