ReleaseNotes: |-
  Highlights
  - Flow: move between computers. Pair two computers running OpenLogi and the pointer and keyboard follow you across the screen edge, with host switching handled for you. Set it up from the new Flow window: pairing, placing the other computer, per-device channels and removal (#1100, #1101, #1102, #1103, #1104, #2261, #2268). Idle Flow connections now stay alive instead of timing out.
  - A reworked Actions Ring. Aim by direction instead of hitting a slot exactly; hold the trigger and release to pick; choose a small, medium or large ring per device; slots now float translucently with tailed labels.
  - Magic Mouse–style momentum scrolling. Optional per-device glide for a free-spinning smoothed wheel, with adjustable distance per notch, glide shape, max speed, length and repeat speed-up (#1994).
  - New hardware. Headset sidetone on the G535 (#2146) and support for the Spotlight receiver 046d:c53e (#2157).
  - Accessibility and GUI polish. Visible focus rings, named icon buttons, Escape closes dialogs, Ctrl shortcuts outside macOS, and better contrast throughout.
  - Platform fixes.
    - Linux: debounced mouse buttons and wheel (#2243, #2247).
    - Windows: wheel direction (#2292), vendor report routing (#2283), tray icon (#2297).
    - macOS: agent watchdog (#2302), camera reset (#2314).
    - Everywhere: input injection fixes (#2300, #2301) and Unifying offline slot names (#2310).

  Upgrade notes
  - The config schema moves to v11 to add the [flow] section. Once 0.9.0 saves your config, older OpenLogi builds will refuse to load it.
  - Flow needs OpenLogi 0.9.0 on both computers.
  Thanks to Ruchit M, Pawel, whurst121280, semmelrinde, minovap, corvus2606, Mark, Kaspar Janowsky and ClemMcFly for contributing to this release.

