ShortDescription: A native, local-first desktop app for configuring Logitech HID++ devices.
Description: |-
  OpenLogi is an independent, open-source desktop app for Logitech HID++ devices.
  It supports button remapping, DPI, SmartShift, battery status, and per-application
  profiles. Configuration is stored locally in plain TOML files, with no account or
  telemetry.
