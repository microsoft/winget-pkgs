Description: Local User and Group Management (lusrmgr) is a standalone Rust rewrite of akruhler/AccountManagement with an eframe/egui desktop GUI and read-only CLI. It manages local users, local security groups, built-in well-known security principals, weekly logon hours, and remote Windows machines across all Windows editions without requiring .NET Framework or external runtime libraries.
