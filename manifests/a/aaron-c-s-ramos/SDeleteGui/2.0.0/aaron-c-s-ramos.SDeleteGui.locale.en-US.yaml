ShortDescription: Windows Explorer context-menu manager and sequential batch runner for Microsoft Sysinternals SDelete.
Description: SDelete Gui adds, configures, and removes Secure Delete and Erase Free Space context menus in Windows Explorer for files, folders, and drives. It wraps Microsoft Sysinternals sdelete64.exe with a confirmation prompt, sequential multi-file execution, pass-count presets, and ISO-8601 audit logging.
