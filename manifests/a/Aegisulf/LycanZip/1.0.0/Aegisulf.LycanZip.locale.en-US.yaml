ShortDescription: An open-source, ad-free, lightweight archive manager for Windows.
Description: |-
  LycanZip creates and extracts zip, 7z, tar and tar.gz/xz/bz2 archives and opens rar and many older formats.
  Features: automatic filename-encoding detection (Big5, GBK, Shift-JIS, EUC-KR), smart extraction, split volumes,
  AES-256 encryption, a modern Windows 11 interface, and Explorer context-menu integration.
  Compression is provided by 7-Zip (LGPL, with the unRAR restriction).
