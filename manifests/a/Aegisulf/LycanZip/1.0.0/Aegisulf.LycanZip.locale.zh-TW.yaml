# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json
PackageIdentifier: Aegisulf.LycanZip
PackageVersion: 1.0.0
PackageLocale: zh-TW
Publisher: Aegisulf
PackageName: LycanZip
License: MIT
ShortDescription: 開源、無廣告、輕量的 Windows 壓縮與解壓縮軟體。
Description: |-
  LycanZip 可建立與解壓縮 zip、7z、tar、tar.gz/xz/bz2，並能開啟 rar 與許多舊式格式。
  特色：自動偵測檔名編碼（Big5、GBK、Shift-JIS、EUC-KR）、智慧解壓、分卷、AES-256 加密、
  現代化的 Windows 11 介面，以及檔案總管右鍵選單整合。壓縮引擎為 7-Zip（LGPL，另有 unRAR 限制）。
ManifestType: locale
