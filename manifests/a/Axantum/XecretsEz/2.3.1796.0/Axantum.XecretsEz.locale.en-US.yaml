ShortDescription: An easy to use free desktop zero-knowledge file encryption application.
Description: Xecrets Ez encrypts and decrypts files to protect your sensitive data with a password using strong AES-256 encryption. It is a cross platform GUI front for Xecrets Cli, available for Windows, macOS and Linux.
