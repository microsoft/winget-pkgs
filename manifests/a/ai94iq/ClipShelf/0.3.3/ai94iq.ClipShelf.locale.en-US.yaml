ShortDescription: A clipboard-history app for Windows that keeps copied text searchable and ready to paste.
Description: |-
  ClipShelf lives in the notification area and keeps the text you copy in an encrypted local history.
  Open a floating flyout with a global shortcut or a tray click, search your clips, and paste one back
  into the app you came from. Clips can be pinned, saved into categories that survive clearing and
  retention, locked behind a password, and exported to JSON or CSV.
