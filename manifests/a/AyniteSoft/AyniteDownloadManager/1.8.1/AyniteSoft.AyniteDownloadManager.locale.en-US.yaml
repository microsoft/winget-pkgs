ShortDescription: Free download manager and video downloader with multi-connection downloads, resume, 4K video, live stream recording and torrents.
Description: |-
  Aynite Download Manager (ADM) speeds up downloads by fetching each file over several connections, and resumes downloads that stop, even after a restart.
  It saves videos from over 1,800 sites in the quality you choose up to 4K, or audio as MP3 or M4A, records live streams, and handles torrents and magnet links, FTP and SFTP.
  A browser add-on for Chrome, Edge, Brave and Firefox puts a Download button on videos.
  ADM is free with every feature. The program shows one small ad, which keeps it free.
