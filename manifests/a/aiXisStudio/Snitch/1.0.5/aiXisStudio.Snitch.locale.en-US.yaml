ShortDescription: Real-time network traffic visualizer — see every connection your computer makes, 100% local, zero telemetry
Description: |-
  Snitch is a local-first, open-source network traffic visualizer. It shows every connection
  your machine makes on a live force graph and geolocated world map, with per-process
  attribution, anomaly detection, tracker lists, passive LAN discovery and a privacy score.
  The API binds 127.0.0.1 with token authentication; geolocation is fully offline.
  This package provides the backend CLI (run as Administrator; requires Npcap) — the UI opens in your browser.
