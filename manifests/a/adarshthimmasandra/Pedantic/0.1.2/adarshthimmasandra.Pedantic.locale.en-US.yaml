ShortDescription: Transform selected text anywhere in Windows with a global hotkey using Claude.
Description: |
  Pedantic is an always-running Windows system-tray application that rewrites the text you have selected in any application. Select text, press a global hotkey such as Ctrl+Shift+G, and the selection is replaced by a cleaned-up version produced by Anthropic Claude Haiku. Each user needs their own Anthropic API key.
