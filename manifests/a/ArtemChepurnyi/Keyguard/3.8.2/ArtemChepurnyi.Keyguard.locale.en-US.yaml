ReleaseNotes: |-
  New
  - Generator: Added ImprovMX email forwarder support.
  - Generator: Added Migadu email forwarder support.
  - Generator: Added mailcow email forwarder support.
  Improvements
  - UI: GPG and SSH settings screens now hide Custom and Misc filter sections.
  - Data: Updated translations.
  Fixes
  - Android: Fixed Keystore outages so encrypted storage is not wiped and vault data is not treated as lost.
  - Android: Fixed Watchtower security checks remaining at 0 after an update or reinstall (#1687).
  - Desktop: Fixed a memory leak after usage (#1683).
  - GPG: Fixed being unable to import a GPG key when a child key password is different from the main key password (#1684).
  - UI: Fixed the monochrome tint color so it does not degrade to cyan (#1682).
