ReleaseNotes: |-
  New
  - Vault: Added import from other password managers (#1650).
  - Sync: Added mTLS support (#819).
  - Desktop: Added an interface scale option to Appearance settings.
  - SSH agent: Added SSH bookmark fields for auto-configuring ~/.ssh/config.
  Improvements
  - Passkeys: Passkeys now support the WebAuthn PRF extension (#1651).
  - Attachments: Attachments can now be dragged out into file managers.
  - Attachments: Attachment preview now includes a JSON tree view.
  - Attachments: Attachment preview now supports .gz files.
  - SSH agent: Agent approval requests now support configuring a timeout duration.
  - SSH agent: Agent requests can now be configured to never ask for explicit approval.
  - UI: Approval requests for CLI access now include a request log.
  - GPG: Dropping files into GPG tools' tiles now selects the operation with the file pre-filled.
  - Data: Updated translations.
  Fixes
  - Android: Fixed popup autofill failing to show suggested logins while inline autofill works fine (#1652).
  - GPG: Fixed the agent so it supports s2k_count, UPDATESTARTUPTTY and SCD replies.
