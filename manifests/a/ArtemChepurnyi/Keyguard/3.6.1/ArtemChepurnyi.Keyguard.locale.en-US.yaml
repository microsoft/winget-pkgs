ReleaseNotes: |-
  Improvements
  - Linux: Flatpak now allows SSH and GPG auto-configure via a terminal command.
  - Attachments: Attachment preview now supports GPG certificates.
  - Attachments: Attachment preview now includes a CSV/TSV table mode.
  - Attachments: Attachment preview now supports many other text/archive file extensions.
  - Data: Updated translations, the list of websites with two-factor authentication, the public suffix list, account deletion links, and data access request links.
  Fixes
  - Wear OS: Fixed being unable to add an account on the watch version (#1577).
  - Desktop: Fixed clicking on an auto-suggested tag in the editor so it no longer resets field focus.
