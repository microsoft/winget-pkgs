Publisher: angelomarzocchi
PackageName: Doppio Audio
License: MIT
ShortDescription: Lo stesso audio su due o più cuffie Bluetooth contemporaneamente, con ritardo e volume sincronizzati.
Description: |-
  Doppio Audio fa uscire lo stesso audio di Windows su due (o più) cuffie Bluetooth, casse, uscite USB o HDMI insieme.
  Ogni uscita aggiuntiva ha il suo cursore del ritardo (0-1000 ms) con un tic di prova per sincronizzare le cuffie a orecchio,
  segue il volume e il muto di Windows della cuffia principale e resta allineata grazie alla correzione automatica della deriva.
  Portatile, senza driver, senza cavi audio virtuali e senza accesso a Internet. Resta nell'area di notifica e può avviarsi con Windows.
