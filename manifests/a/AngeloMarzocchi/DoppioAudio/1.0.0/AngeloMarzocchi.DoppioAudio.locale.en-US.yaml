ShortDescription: Play the same audio on two or more Bluetooth headphones at the same time, with delay and volume sync.
Description: |-
  Doppio Audio sends the same Windows audio to two (or more) Bluetooth headphones, speakers, USB or HDMI outputs at once.
  Each extra output has its own delay slider (0-1000 ms) with a test tick to sync the headphones by ear, follows the
  Windows volume and mute of the main headphones, and stays in sync thanks to automatic clock-drift correction.
  Portable, no drivers, no virtual audio cables, no network access. Runs in the notification area and can start with Windows.
