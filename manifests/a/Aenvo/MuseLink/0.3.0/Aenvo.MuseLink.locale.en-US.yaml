ReleaseNotes: |-
  - In-app auto-updater & synced changelog modals:
    - Minisign-verified in-app updates (Windows NSIS installer & Linux AppImage): Silent startup checks and manual About → Check for updates using static latest.json manifests and a compile-time pinned Minisign public key. Active connections stay up during download/verification, services cleanly stop (including managed Everything.exe on Windows) before restarting into the new version. Portable Windows, Linux .deb, and macOS builds check the same latest.json via SemVer for update alerts, release notes, and direct download links.
    - In-app Changelog & Release notes dialogs: Instant bundled rendering with background GitHub sync and automatic language selection (Japanese falls back to the English changelog).
  - Linux support (#3): Full file API (list / read / write / mkdir / search) and Tailscale / Cloudflare tunnel support on Linux (prebuilt AppImage & .deb).
  - macOS Universal support (#7): Native Apple Silicon & Intel prebuilt .dmg installer and .app.zip portable archive (compatible with macOS 14 Sonoma and earlier; minimum macOS 10.13 / 11.0). Automatically discovers /Applications/Tailscale.app CLI and Homebrew tools. Sandboxed command execution (exec) remains Windows-only.
  - Japanese (ja) localization (#8): Complete Japanese UI, system tray, Muse setup instructions, NSIS installer language, and README.ja.md with Japanese screenshots.
  ⚠️ Important note for macOS first launch: macOS packages are ad-hoc signed and not notarized with an Apple Developer ID. On first launch:
  1. Try opening MuseLink.app once, then open System Settings → Privacy & Security → Security and click Open Anyway.
  2. If macOS Sequoia (15+) still reports that the app "is damaged and can't be opened", run once in Terminal:
     xattr -dr com.apple.quarantine /Applications/MuseLink.app
  See CHANGELOG.en.md and the English quick start.
