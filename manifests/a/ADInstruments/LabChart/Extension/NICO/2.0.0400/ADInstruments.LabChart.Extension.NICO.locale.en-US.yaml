ShortDescription: The Non-Invasive Cardiac Output Add-On enables real-time estimation of Cardiac-Output from an NIBP (Non-Invasive Blood Pressure) channel.
Description: |-
  The Non-Invasive Cardiac Output Add-On enables real-time estimation of Cardiac-Output from an NIBP (Non-Invasive Blood Pressure) channel. It implements published and widely accepted algorithms and can estimate the following parameters: CO (Cardiac Output), SV (Stroke Volume) and TPR (Total Peripheral Resistance).
  It requires an ADInstruments or FMS NIBP device (such as the INL382 Human NIBP Nano System).
