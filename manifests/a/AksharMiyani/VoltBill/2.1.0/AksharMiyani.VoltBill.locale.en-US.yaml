ShortDescription: Console-Based Electricity Billing and Customer Management System Using C
Description: |
  VoltBill is an enterprise-grade, high-performance console-based electricity billing and customer management engine written in ISO C (C99/C11).
  Features multi-tier progressive slab billing, solar net metering, industrial power factor adjustment, dynamic runtime tariff editing,
  visual ASCII consumption charts, carbon footprint estimator, authentic ISO/IEC 18004 QR payments, Modbus RTU/TCP telemetry,
  and Under-Frequency Load Shedding (UFLS) grid protection.
  Developed by Akshar Miyani.
