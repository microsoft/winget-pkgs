ReleaseNotes: |-
  - Runtime & dependencies (#2566): Upgrade Electron to 45.5.0, pnpm to 12.23.0, and core UI/runtime dependencies.
  - Bundled aria2 1.37.0-motrix.26 (#2551, #2556): Allow dynamic CDN/mirror redirect targets when resuming or splitting HTTP downloads with matching source identity and validators.
  - Reliable HTTP Content-Length & resume (#2540, #2554): Disable http-accept-gzip globally and align metadata probes to identity encoding.
  - Direct magnet save directory (#2552, #2553): Keep direct magnet downloads in the selected save directory without an extra infoHash subfolder.
  - BitTorrent port migration (#2462, #2558): Migrate legacy default BT/DHT listening ports off 6881 to 21301/26701 while preserving custom ports.
  - Resilient aria2 startup probing (#2517, #2559): Retry transient OS file-lock/permission/timeout errors with bounded backoff during Windows antivirus scans.
  - Signed redirect resume verification (#2426, #2488, #2560): Ignore transient signed-URL query parameters across cross-origin redirects.
  - Bounded log & temp disk usage (#2532, #2561): Rotate motrix.log at 5 MiB at runtime and clean stale motrix-media-* temp directories on startup.
