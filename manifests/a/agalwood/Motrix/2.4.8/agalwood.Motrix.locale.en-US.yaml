ReleaseNotes: |-
  - Bundled aria2 1.37.0-motrix.27 (#2421, #2575): Clear aria2 in-memory DNS cache when async-dns changes via RPC and skip non-UP interfaces and non-routable IPv6 addresses in checkAddrconfig().
  - Auto DNS fallback on unreachable route errors (#2421, #2572): Automatically fall back to system DNS in auto mode on Windows WSAENETUNREACH/WSAEHOSTUNREACH and POSIX unreachable route errors.
  - Direct magnet metadata rebind & finalization (#2569, #2571): Resolve real torrent display names and output paths immediately after followedBy metadata transitions.
  - Synology DSM 7 directory identity (#2557, #2568): Avoid ctime fallback when birthtimeNs is unavailable on DSM 7 filesystems.
  - Symlinked desktop save directories (#2562, #2570): Canonicalize symlinked desktop saveDir paths before finalization.
  - Failed media temp directory cleanup (#2532, #2573): Clean up motrix-media-* temporary directories by default when media downloads fail.
