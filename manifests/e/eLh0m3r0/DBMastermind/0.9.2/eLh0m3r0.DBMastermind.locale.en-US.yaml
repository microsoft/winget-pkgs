Description: |-
  DB Mastermind is a free, open-source desktop database client for PostgreSQL, MySQL, MariaDB, SQL Server, SQLite, Oracle, DuckDB, ClickHouse and CockroachDB.
  It has a data browser with filters, a SQL editor, ER diagrams, a visual schema designer that generates migrations, a knowledge base per database, an AI assistant, and an MCP server for Claude Code, Codex and Cursor.
