ShortDescription: Free, open-source database client and data modeler with ER diagrams, a schema designer, an AI assistant and an MCP server.
Description: |-
  DB Mastermind is a free, open-source desktop database client and data modeler for PostgreSQL, SQL Server, Oracle, MySQL, MariaDB, SQLite, DuckDB, ClickHouse, CockroachDB, BigQuery and Trino.
  It has a data browser with filters, a SQL editor, ER diagrams, a visual schema designer that generates migrations, a data modeler that also opens DeZign for Databases projects, server activity, a knowledge base per database, an AI assistant, and an MCP server for Claude Code, Codex and Cursor.
