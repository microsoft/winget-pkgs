ReleaseNotes: |-
  - Improve inline diff UI performance.
  - llama.cpp 2.48.0 extension packs.
  - Fixed editor toolbar when an edited file is no longer available.
  - PDF previews now show comments and tracked changes.
  - Smoother cursor movement and click feedback during computer control.
  - Fixed gaps around pane content.
  - Fixed startup failures caused by corrupted legacy UI state.
  - Canvas export to PNG, SVG, and editable Excalidraw files.
  - New neutral switch colors and disabled styling.
  - Longer image-heavy sessions through automatic context compaction.
  - Clickable directory links in Markdown previews.
  - More polished PowerPoint layouts, typography, tables, charts, and image placement.
  - Fixed Arrow Up navigation in composer suggestions.
  - Image menus now include Copy Image and Save Image As.
  - Fixed lag when selecting cells in zoomed-out spreadsheet previews.
  - Sessions now appear in Cmd + P.
  - lms runtime installations now show installation progress.
  - Better syntax highlighting in the Markdown editor.
  - Cleaner PowerPoint generation with fewer layout and text-overlap issues.
  - Markdown previews now match transcript styling.
  - Session titles now match the language of your message.
  - Nicer skill preview lines for Introspection.
