ReleaseNotes: |-
  - Fixed skill installation dialogs failing to open in Settings.
  - Fixed LM Link failing to start in non-interactive Windows sessions.
  - Clearer errors when an engine requires disabled experiments.
  - llama.cpp 2.79.0 extension packs.
  - oMLX 0.5.0 extension packs.
  - Faster project file browsing in large folders.
  - Folder refresh in project and file-explorer menus.
  - Skill installation on remote devices.
  - File-listing progress for remote downloads.
  - Device settings shortcut in the remote-device sidebar menu.
  - Automatic retries for stalled or interrupted external-model replies.
  - Fixed unrecognized context-limit errors from external models.
  - Fixed assistants stopping unexpectedly after long chats were summarized.
  - Fixed remote-device and model selectors crowding the chat composer in narrow windows.
  - Fixed assistant-requested model and reasoning-level changes taking effect separately in running chats.
  - Assistant model and reasoning-level selection for new and existing chats.
  - Connected app setup on remote devices from host machine.
  - MCP server sign-in on remote devices through host machine’s browser.
  - Online-device count and Remote settings shortcut in the remote-control menu.
  - Clearer remote access and device network setup wording.
  - Fixed Remote onboarding skipping required account setup.
  - Fixed automatic downloads of incompatible runtime updates.
