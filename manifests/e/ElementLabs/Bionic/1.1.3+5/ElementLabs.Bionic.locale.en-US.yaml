ReleaseNotes: |-
  - Voice transcription for Linux.
  - llama.cpp 2.38.0 extension packs.
  - Clearer file and folder drag-and-drop flows in Project Files.
  - Agent-created images shown inline in conversations.
  - Allow narrower Bionic app window width.
  - Consistent dark Bionic app icon on macOS.
  - Fixed MLX downloads sometimes stuck at the end.
  - Clearer link colors in transcripts and Markdown previews.
  - Smoother LM Link connection states and remote model listings.
  - Model details when hovering over the collapsed model picker.
  - Classic theme when system dark mode is active.
  - More reliable non-ASCII output from PowerShell 5.1 commands.
  - New Bionic app icon options.
  - Fixed Office document tools failing to register.
  - Fixed circular symlinks causing file watching loops on Linux.
  - German, Spanish, French, Japanese, Brazilian Portuguese, and Traditional Chinese translations.
  - Request timeout controls for custom MCP servers.
  - Organization-managed MCPs for enterprise deployments.
  - MTP speculative decoding for more compatible models.
  - Consistent menus across Settings.
  - Dark-theme colors for dismiss buttons and skill references.
  - Fixed recent project ordering changing from background activity.
  - Fixed composer controls shifting when Send changes to Stop.
  - Fixed loading models with per-layer GGUF expert counts.
  - Fixed guidance dialog layouts with longer translations.
  - Fixed tall dialogs dragging the app window.
  - Fixed link menus appearing behind other content and cropped suggestion shadows.
  - YAML frontmatter shown as file details in Markdown previews.
  - Side editor access to files Bionic creates or edits when they need attention.
  - Voice transcription on Linux systems with NVIDIA GPUs.
