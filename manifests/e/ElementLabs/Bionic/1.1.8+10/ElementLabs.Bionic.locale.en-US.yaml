ReleaseNotes: |-
  Draggable Canvas panel
  Support for previewing Word documents, spreadsheets and presentations in-app
  Support for /v1/systemone Jev (TypeSafe AI) compatible endpoint
  Support for /v1/decisions OpenAI compatible endpoint
  Support for previewing HTML files
  Coexistence with LM Studio — Run both apps together; Bionic uses LM Studio for local model inference while LM Studio is running. Requires LM Studio 0.4.26 and newer.
  Decision model load settings, activity status, and cancellation controls.
  Decision model inference and management through the REST API.
  Fixed incorrect MCP connection status reported in chats.
  llama.cpp 2.53.0 extension packs.
  CUDA 13 support on Windows ARM.
  Fixed uneven loader dot spacing at compact sizes.
  Skills in their own composer suggestions category.
  New adaptive Bionic app icon on macOS.
  Fixed onboarding tips reappearing after being dismissed.
  llama.cpp 2.52.0 extension packs.
  Lower disk usage from project history.
  Localization: Bionic native menu items in the selected language.
  More consistent warning, success, and feedback colors.
  Composer suggestions grouped by result type.
  Fixed incorrect macOS versions in session environments.
  Better handling for messages with more than six image attachments.
  Clearer skill references in prompts and previews.
  Fixed side chat sidebar alignment.
  More reliable long sessions with image-aware context compaction that preserves the current environment.
  Localization: approval prompts and previews in the viewer’s language.
  llama.cpp 2.51.0 extension packs.
  Fixed unfinished links appearing while responses stream.
