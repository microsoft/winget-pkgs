ShortDescription: Windows 划词与截图翻译工具，译文出现在光标旁。
Description: |-
  选中文字按下 Ctrl+Alt+W，译文出现在光标旁；截图框选默认用本机 Windows OCR，图片不出本机。面向在 Windows 上阅读英文技术内容的程序员：报错、注释、命令、文档。
  - 划词：任意程序里 Ctrl+Alt+W，原剪贴板按序列号恢复。
  - 截图：Ctrl+Alt+Space 框选，默认本机 OCR 识别。
  - 工作台：Ctrl+Alt+O，左原文右译文，「要点」是独立视图。
  - 查词：Ctrl+Alt+Q，输入后 Enter 翻译。
  - 引擎：OpenAI 兼容、OpenAI Responses、Anthropic、Gemini、Ollama、LM Studio；未配置引擎时走 Google 公共翻译，可切换 MyMemory。
  - 安全离线模式：拦截所有外发请求，本机模型地址不受影响。
  - 主题跟随系统 / 浅色 / 深色，快捷键可在「设置 → 快捷键」重新录制。
