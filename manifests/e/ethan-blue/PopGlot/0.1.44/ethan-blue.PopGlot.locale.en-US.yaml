PackageIdentifier: ethan-blue.PopGlot
PackageVersion: 0.1.44
PackageLocale: en-US
ShortDescription: A Windows translation tool for selected text and screenshots.
Description: |-
  Select text and press Ctrl+Alt+W to read the translation next to the cursor. Screenshot capture uses the local Windows OCR engine by default, so images stay on your machine. Built for programmers reading English technical content on Windows: error messages, comments, commands and documentation.
  - Selection translation: Ctrl+Alt+W in any application, with the original clipboard content restored afterwards.
  - Screenshot translation: Ctrl+Alt+Space for a region capture, local OCR by default.
  - Workbench: Ctrl+Alt+O, source on the left and translation on the right, with key points as a separate view.
  - Dictionary lookup: Ctrl+Alt+Q, then Enter to translate.
  - Engines: OpenAI compatible, OpenAI Responses, Anthropic, Gemini, Ollama and LM Studio. Without a configured engine the free Google public translation route is used and can be switched to MyMemory.
  - Safe offline mode blocks every outbound request; local model endpoints are unaffected.
  - Theme follows the system, light or dark. Shortcuts can be re-recorded in Settings.
