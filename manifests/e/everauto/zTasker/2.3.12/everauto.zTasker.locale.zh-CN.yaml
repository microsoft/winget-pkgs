- 自动化
ReleaseNotes: |-
  新增：
  Http 请求任务，返回结果成功时前部添加 Success:标志，失败时有 Error 标志，方便复合任务里后续判断
  复合任务，数量和变量比较的地方，增加大于等于、小于等于选项
  复合任务，变量比较，增加时间、日期、日期时间，现在可以直接比较当前时间和指定时间
  输入分类，鼠标移动，增加显示轨迹选择设置

  改进：
  点击运行测试任务时，如果上一个任务在运行，会提示
  按 TAB 键现在可以在数字输入控件间顺利跳转
  下拉列表框，现在可以上下方向键和翻页键移动选择了
  下拉列表框，鼠标拖动滚动条时，如果在下拉框内部松开，不会关闭下拉框了

  修复：
  *多个任务设置同一个热键时，可能无法同时执行的问题
  复合任务->流程跳转，选择跳转到外部任务，确定时提示动作 ID 不存在的问题
  复合任务->输入源->数据->字符串->生成随机数，无法正确执行问题
  复合任务->条件检测，小键盘 Enter 无法检测是否按下的问题
  复合任务编辑时，子动作窗口按下回车后，关闭复合任务窗口的问题
  其它修复
