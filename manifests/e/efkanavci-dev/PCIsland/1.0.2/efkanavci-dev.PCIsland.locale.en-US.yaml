ShortDescription: A Dynamic Island-style command bar for Windows. Type what you want and it happens.
Description: |-
  PC Island is a floating pill at the top of the screen. Press Ctrl+Space or move the mouse near it and type commands
  like "open spotify", "volume 40", "timer 10 min" or "close tabs on chrome". It shows the song that's playing, has six
  frosted glass themes, learns your own words, and understands English and Turkish. An optional AI runs fully on your PC.
