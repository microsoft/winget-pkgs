ReleaseNotes: |-
  New Features:
  - Add ability to scan provisioned MSIX packages.
  
  Improvements:
  - Application scanning now uses the same account settings as deployment.
  - Improved managing MSIX packages with Network Administrator credentials.
  - Improved error diagnostics for database failures.
  - Added official compatibility support for Windows 11 version 26H2.
  
  Bug Fixes:
  - Fix errors when a collection filter contains installed software references.
  - Fix potential problem with installing MSIX dependencies.
  - Fix database consistency errors at SQLServer database migration from version 6.
  - Fix timeout errors when working with SQLServer database.
