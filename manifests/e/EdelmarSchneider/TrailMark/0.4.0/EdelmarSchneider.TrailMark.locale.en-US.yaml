ShortDescription: A fast, beautiful Markdown IDE that keeps up with your AI agents.
Description: |-
  TrailMark reads, navigates, follows and edits the Markdown documents your AI agents write, as a local wiki over a folder.
  It shows what changed live and since your last visit, finds anything to the section with Search everywhere, edits in a
  Visual or Source editor that rewrites only the blocks you changed, and is git-aware. An optional, local agent connection
  (MCP) lets any coding agent know what you are reading, and comments on passages give your agent a review list.
