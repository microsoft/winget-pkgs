ShortDescription: "Read what your AI writes. Write what it reads. A free, open-source Markdown app."
Description: |-
  PerMark opens any Markdown (.md) file as a clean page you can read and edit, keeps notes that save themselves, and lets you
  follow, review and steer what your AI agents write in a project folder. Changed passages glow as an agent writes, unread
  dots mark what changed since you last read it, and search finds any file or section. Edit looks like the page you read,
  diagrams and math included, and saving rewrites only the parts you changed. Spelling and grammar can be corrected with a
  small AI model that runs on your computer. Notes open with Ctrl+Shift+N. An optional, local agent connection (MCP) lets
  any AI agent know what you are reading. Works with any AI tool, or none. In 13 languages.
