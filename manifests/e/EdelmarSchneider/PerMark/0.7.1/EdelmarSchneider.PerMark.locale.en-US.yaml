ShortDescription: "Read what your AI writes. Write what it reads. A free, open-source Markdown app."
Description: |-
  PerMark opens any Markdown (.md) file as a clean page you can read and edit, keeps notes that save themselves, and turns a
  project folder into an IDE where you follow, review and steer what your AI agents write. Changed passages glow as an agent
  writes, unread dots mark what changed since you last read it, Search everywhere finds any file or section, and the Visual or
  Source editor rewrites only the blocks you changed. Notes open with Ctrl+Shift+N: no name, no folder, no save prompt.
  An optional, local agent connection (MCP) lets any AI agent know what you are reading. Works with any AI tool, or none.
