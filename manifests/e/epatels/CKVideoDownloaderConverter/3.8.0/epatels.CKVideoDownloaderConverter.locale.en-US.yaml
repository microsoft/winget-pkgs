ShortDescription: Download videos and audio from the web and convert media files
Description: |
  CK Video Downloader and Converter is a freeware Windows app for downloading videos and audio from the sites supported by yt-dlp and for converting media files with FFmpeg. It supports batch downloads, drag and drop of .url files, playlists, subtitles, browser cookies, a Windows Explorer right-click menu, built-in updates and dark/light themes. yt-dlp and FFmpeg are bundled.
