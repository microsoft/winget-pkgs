License: 'Proprietary'
ShortDescription: 'Keeps two folders in sync, safely: preview first, backups of everything replaced or deleted'
Description: |
  CK Sync keeps pairs of folders (local folders, pen drives, external disks, network shares) in
  step. It shows what it is about to do and why before it changes anything, keeps a backup of
  every file it replaces or deletes, and keeps both versions when a file changed on both sides. It
  can sync by itself on a schedule, even when nobody is logged in, and stops and asks when
  something looks wrong. It collects no usage data.
