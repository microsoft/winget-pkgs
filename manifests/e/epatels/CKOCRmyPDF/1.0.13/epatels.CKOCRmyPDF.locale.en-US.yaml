ShortDescription: 'Make scanned PDFs searchable: batch OCR for Windows with Tesseract, Ghostscript and every other tool bundled'
Description: |
  CK OCRmyPDF adds an invisible text layer to scanned PDFs and photos of documents, so you can
  search them, select text and copy from them. The page looks exactly as before. It is a graphical
  front end for the open-source OCRmyPDF engine, packaged with Tesseract, Ghostscript and the
  other tools it needs, so there is nothing else to install. Drag and drop whole batches or
  folders, watch a folder for new files, choose from more than 100 languages, produce PDF/A
  output, and set every OCRmyPDF option in a searchable window. It works offline by default.
  Tesseract is the default OCR engine; RapidOCR is included, and Google Cloud Vision can be
  switched on with your own API key (page images are then uploaded to Google). The ocrmypdf
  command is also installed for terminals and scripts. CK OCRmyPDF is independent of the OCRmyPDF
  project and not endorsed by it.
