ShortDescription: Make scanned PDFs searchable. Batch OCR for Windows with Tesseract, Ghostscript and everything else bundled.
Description: CK OCRmyPDF adds an invisible text layer to scanned PDFs and photos of documents so you can search them and copy text. It is a graphical front end for the open-source OCRmyPDF engine, with drag-and-drop batches, a watch folder, more than 100 languages, PDF/A output and every OCRmyPDF option. Works offline by default; Tesseract, RapidOCR (and optionally Google Cloud Vision) are the OCR engines. Everything is bundled, nothing else to install.
