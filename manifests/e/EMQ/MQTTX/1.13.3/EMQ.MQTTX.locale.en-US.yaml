ReleaseNotes: |-
  Release Note 🎉
  CLI Update Command · Last-Will Payload Formats
  MQTTX 1.13.3 adds an update command for MQTTX CLI and more payload formats for Desktop Last-Will messages. It also improves benchmark accuracy, connection recovery, and everyday Agent interactions.
  Features 🚀
  Update MQTTX CLI from the terminal
  Run mqttx update to update an existing CLI installation. Standalone binaries update in place, while Homebrew and npm installations use their package manager.
  More Last-Will payload formats
  Desktop Last-Will messages now support Plaintext, JSON, Base64, Hex, CBOR, and MsgPack. The selected format is saved with the connection and used to encode the message. Existing connections keep Plaintext as the default.
  Improvements and fixes 🛠
  CLI
  - Calculate benchmark publish and subscribe rates using the actual sampling interval.
  - Start workloads after an initial connection retry succeeds, and report active connections correctly.
  - Fix split-file replay stalling after a disconnect.
  - Use each connection's actual ClientId for %c in benchmark publishing and simulation topics.
  - Accept whitespace around MQTT version options.
  When upgrading, check subscriptions to topics that use %c.
  Desktop and Agent
  - Show more complete operation details on approval cards, including timed-publish intervals.
  - Require approval for deleting, clearing, and script operations in every permission mode.
  - Improve Agent replies, MCP tool-name handling, payload scripts, and desktop startup compatibility.
  - Correct Last-Will topics in connection history and Hex payload encoding with tabs or line breaks.
  Distribution and documentation
  - Publish SHA256SUMS with release downloads.
  - Improve Desktop CLI installation and update handling.
  - Refresh installation instructions and Desktop, Agent, and CLI guides.
  简体中文
  CLI 更新命令 · 遗嘱消息 Payload 格式
  MQTTX 1.13.3 新增 CLI 更新命令，并为桌面端遗嘱消息提供更多 Payload 格式，同时改进压测速率统计、连接恢复和 Agent 日常操作体验。
  新功能 🚀
  在终端更新 MQTTX CLI
  运行 mqttx update 即可更新已有的 CLI。独立二进制安装会原位更新，Homebrew 和 npm 安装则通过相应包管理器更新。
  更多遗嘱消息 Payload 格式
  桌面端遗嘱消息现已支持 Plaintext、JSON、Base64、Hex、CBOR 和 MsgPack。格式选择随连接保存，发送时按所选格式编码；已有连接默认保持 Plaintext。
  改进与修复 🛠
  CLI
  - 发布和订阅压测速率按实际采样时长计算。
  - 初次连接重试成功后正常启动任务，并正确统计活动连接。
  - 修复断线后拆分文件回放停滞的问题。
  - 压测发布与模拟主题中的 %c 使用各连接的实际 ClientId。
  - 支持 MQTT 版本参数前后的空白字符。
  升级后请检查使用 %c 的主题订阅。
  Desktop 与 Agent
  - 审批卡片展示更完整的操作信息，包括定时发布间隔。
  - 删除、清空和脚本操作在所有权限模式下均需批准。
  - 改进 Agent 回复、MCP 工具名称处理、Payload 脚本及桌面启动兼容性。
  - 修正连接历史中的遗嘱主题，以及带制表符或换行的 Hex Payload 编码。
  分发与文档
  - 发布下载产物时提供 SHA256SUMS。
  - 改进桌面端 CLI 安装和更新处理。
  - 更新安装说明以及 Desktop、Agent 和 CLI 指南。
