ShortDescription: Isolated desktops for shared computers in classrooms, internet cafés and offices.
Description: |-
  KiosQ turns every shared computer into isolated desktops. Each person works in their own desktop: their files, app settings and browser profile stay in their folder and nowhere else. Signing out closes every app and clears the clipboard; if someone walks away, the session closes itself after the idle time you choose.
  Includes guest mode, usage hours, allowed apps, storage quotas, shared folders with group permissions and versions, and access from your phone. No server and no IT staff needed. Free on one computer; Pro is billed per computer.
