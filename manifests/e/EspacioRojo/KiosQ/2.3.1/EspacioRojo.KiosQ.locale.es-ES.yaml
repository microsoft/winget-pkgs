ShortDescription: Escritorios aislados para equipos compartidos en aulas, cibercafés y oficinas.
Description: |-
  KiosQ convierte cada ordenador compartido en escritorios aislados. Cada persona trabaja en su propio escritorio: lo que guarda, la configuración de sus programas y el perfil del navegador se quedan en su carpeta y en ningún otro sitio. Al salir se cierran los programas y se vacía el portapapeles; si alguien se va sin salir, la sesión se cierra sola tras el tiempo que elijas.
  Incluye modo invitado, horarios, programas permitidos, cuota de espacio, carpetas compartidas con permisos y versiones, y acceso desde el teléfono. Sin servidor ni técnico. Gratis en un equipo; Pro se cobra por equipo.
