ShortDescription: Plays folders of videos and audio in order and remembers your place in every file.
Description: |-
  EVB Player turns a folder of numbered videos or audio files into a playlist: online courses, lectures, audiobooks or language practice. It plays the files in order, saves your position in each one, shows durations up front, and lets you reorder the playlist, star favorites and add tracks from other folders. Free and offline; nothing is uploaded.
