ReleaseNotes: |-
  EmEditor v26.2.9 is now available. This release focuses on stability and includes the fixes and improvements listed below. We recommend updating to the latest version for the best experience.
  - Fixed an issue where folders added to Favorites did not work correctly.
  - Improved performance when a network folder is specified in Favorites.
  - Fixed an issue where vertical lines could display incorrectly in Markdown Design View.
  - Fixed an issue where the GUID used by the Windows 11 modern context menu conflicted with another app.
  - Improved the workspace restoration behavior.
  - Fixed an issue with the message box displayed before subscription renewal.
  - Fixed various crashes, including one that could occur when saving extremely long lines.
  If you use the legacy MSI installer, select Help > Check for Updates to update EmEditor. If the update does not complete successfully, please download the latest version and run the installer manually. If you download the MSI installer directly, please verify that its digital signature is issued by Emurasoft, Inc.
  We recommend using the Microsoft Store version or the new MSIX installer. Updates for the legacy MSI installer are currently scheduled to end in March 2027. For more information, see FAQ: Store Version and New Installer (MSIX).
