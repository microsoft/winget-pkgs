ReleaseNotes: |-
  EmEditor v26.2.7 现已发布。本次版本着重于稳定性，并包含以下修复与改进。我们建议更新到最新版本以获得最佳体验。
  - 修复了在启用 DirectWrite 时，二进制（十六进制视图）可能显示为空白的问题。
  - 修复了多种崩溃问题，包括可能在使用资源管理器插件时发生的崩溃。
  如果你使用旧版 MSI 安装程序，请选择 帮助 > 检查更新 来更新 EmEditor。如果更新未能成功完成，请下载最新版本并手动运行安装程序。如果你是直接下载 MSI 安装程序，请确认其数字签名的颁发者为 Emurasoft, Inc.
  我们建议使用 Microsoft Store 版本或新的 MSIX 安装程序。旧版 MSI 安装程序的更新目前计划于 2027 年 3 月结束。更多信息请参阅常见问题：商店版与新安装程序（MSIX）。
