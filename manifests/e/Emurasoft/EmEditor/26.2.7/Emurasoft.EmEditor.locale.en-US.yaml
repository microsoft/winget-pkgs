ReleaseNotes: |-
  EmEditor v26.2.7 is now available. This release focuses on stability and includes the fixes and improvements listed below. We recommend updating to the latest version for the best experience.
  - Fixed an issue that caused the Binary (Hexadecimal View) to appear blank when DirectWrite was enabled.
  - Fixed various crashes, including crashes that could occur with the Explorer plug-in.
  If you use the legacy MSI installer, select Help > Check for Updates to update EmEditor. If the update does not complete successfully, please download the latest version and run the installer manually. If you download the MSI installer directly, please verify that its digital signature is issued by Emurasoft, Inc.
  We recommend using the Microsoft Store version or the new MSIX installer. Updates for the legacy MSI installer are currently scheduled to end in March 2027. For more information, see FAQ: Store Version and New Installer (MSIX).
