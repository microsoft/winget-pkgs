ReleaseNotes: |-
  今天，我们发布了 EmEditor v26.3。
  1. 面向超大文件的快速查看模式
  EmEditor 长期以来以能够打开超大文件而闻名，我们几乎在每个版本中都提升了打开和编辑大文件的性能。不过，当文件远大于你电脑的物理内存时，打开整个文件仍然需要时间，而且由于内存不足，电脑可能会变慢。在很多情况下，你打开超大文件（例如日志文件或数据库转储）只是为了查看、查找或筛选，并不需要编辑。
  在本版本中，我们为这类场景新增了 快速查看 模式。快速查看会以只读方式几乎瞬间打开超大文件，而无需将整个文件加载到内存中。EmEditor 会在后台查找各行的位置，并且只读取当前显示的行。即使 EmEditor 仍在查找行位置，你也可以在开始打开文件后立即跳到文档末尾。在找到行位置之前不会显示行号。
  大于 启用快速查看模式的最小文件大小（默认 4,096 MB）的文件会自动以快速查看模式打开，并且在以快速查看模式打开文件时会出现通知。你可以在 自定义 对话框的 高级 页面更改该大小。要在普通模式与快速查看模式之间切换，请在 编辑 菜单中选择 快速查看。你也可以在 大文件控制器 中选中 快速查看模式 复选框。
  1-1. 快速查看模式下可以做什么
  虽然快速查看模式为只读，但查看和分析超大文件所需的大多数功能都可用。
  - Pro 与 Free 版本均支持
    - 滚动、选择（包括垂直选择）、复制（包括 复制引用）、跳转 与 跳转至标记。
    - 显示高亮字符串、注释、引号字符串、标记、书签标记以及标尺。
    - 查找文本（包括正则表达式、数值范围 与 模糊匹配 选项），并统计匹配数。
    - 以不同编码重新加载（包括二进制视图），以及用不同编码或换行符 另存为。
    - 比较文档（包括与普通模式下的文档进行比较）。
    - 运行外部工具。
  - 仅 Pro 版本支持
    - 使用 查找 对话框进行提取、使用 批处理查找 对话框进行多重查找，以及使用 筛选 工具栏进行筛选与提取。
    - 使用 CSV 模式、大文件控制器、宏、插件以及 AI 菜单。
  请注意：在快速查看模式下，每个文档的书签数量上限为 100,000，并且 渐进式搜索 选项会被禁用。
  1-2. 即使文件大于物理内存也更快
  在快速查看模式下，打开、查找、筛选与提取超大文件的速度比上一版本快得多，即使文件远大于物理内存也是如此。在我们的测试中，筛选速度相比 v26.2 提升约 9 倍，提取速度提升超过 10 倍。如果你经常处理超大的日志文件或 CSV 文件，请试试快速查看模式。
  1-3. 宏与插件
  宏与插件也可以在快速查看模式下使用。现在，Document 与 Selection 对象中不会更改文档的属性和方法可以在快速查看模式下使用，并且我们为 Document 对象新增了 FastView 属性。对于插件开发者，我们为 EE_INFO 消息新增了 EI_GET_FAST_VIEW 参数，并新增了 EEID_FAST_VIEW 命令 ID。在快速查看模式下，会更改文档的属性、方法和消息将失败。
  我们还为 Document 对象新增了 Text 与 TextLength 属性，并为 WebBar 对象新增了 scrollBy 与 scrollTo 方法，以及 scrollX 与 scrollY 属性。
  2. 增强 ChatAI 功能
  2-1. MCP 连接器
  在本版本中，Makoto Emura 为 与 AI 聊天 插件加入了 MCP 连接器。MCP（Model Context Protocol，模型上下文协议）是一种将 AI 连接到外部服务的标准协议。通过添加 MCP 连接器，AI 在与你聊天时可以访问外部服务与数据。你可以在 设置 对话框中新增加的 MCP 连接器 页面中，使用 MCP 服务器的 JSON 配置来添加新连接器。目前仅支持 HTTP 服务器（不支持 STDIO 与 SSE 连接）。
  Makoto 还新增了 EmEditor 帮助页面 MCP 连接器。当你询问如何使用 EmEditor 时，AI 可以使用该连接器访问最新的 EmEditor 帮助页面。我们发现该 MCP 给出的答案比网页搜索工具更好。
  AI 过去较难完成的一个复杂任务例子是编写 EmEditor 宏，例如：“写一个 EmEditor 宏来计算第 2 列数值的总和。”有了 EmEditor 帮助页面 MCP 连接器，AI 现在可以参考宏帮助页面，编写更好的宏。
  EmEditor 帮助页面 MCP 也可在 ChatGPT 或 Claude 等其他应用中使用。请参阅这篇文章（英文），了解如何在其他应用中使用该 MCP 服务器。
  2-2. 按聊天分别设置 AI
  此前，提供商、模型等 AI 设置会在所有聊天之间共享。在本版本中，你可以为每个聊天分别更改 AI 设置。按聊天设置只对该聊天生效，修改它不会影响全局设置。例如，你可以在一个聊天中使用轻量模型，而在另一个聊天中使用推理模型。
  Makoto 还在聊天输入框中加入了 AI 模型与工具指示器。它会显示当前聊天所使用的 AI 模型与所选工具，点击模型名称会打开 设置 对话框。
  2-3. 需要 ChatAI 插件
  请注意：要使用包括 与 AI 聊天 在内的 AI 功能，除了 EmEditor 之外，你还需要安装 ChatAI 插件。商店版与新的安装程序版本（MSIX）已包含 ChatAI 插件，因此无需单独安装。
  3. 其他改进
  资源管理器 插件现在会使用 自定义 对话框中 窗口 页面所指定的对话框字体大小。
  我们希望你会对 Pro 与 Free 版本都感到满意。如果你有任何问题、功能需求或想法，请联系我们。
  感谢你一直以来对 EmEditor 的支持。
  —— Yutaka Emura
  更多详细信息（包括主要变更与截图）请参阅：“Version 26.3 新增特性”。
  如果你使用旧版 MSI 安装程序，请选择 帮助 > 检查更新 来更新 EmEditor。如果更新未能成功完成，请下载最新版本并手动运行安装程序。如果你直接下载 MSI 安装程序，请确认其数字签名由 Emurasoft, Inc. 颁发。
  Microsoft Store 版本预计将在接下来的几天内提供。我们建议使用 Microsoft Store 版本或新的 MSIX 安装程序。对旧版 MSI 安装程序的更新目前计划在 2027 年 3 月结束。更多信息请参阅：FAQ：商店版与新安装程序（MSIX）。
  如果你卸载旧的 MSI 版本并安装 Store 版或新的 MSIX 版，在文件资源管理器中右键单击时，上下文菜单中的“用 EmEditor 编辑”可能会出现两次。此时，新的商店版/ MSIX 版会弹出对话框提示你移除旧条目。
  如果我们未来发布小更新（v26.3.x），这篇博客文章可能会更新以包含这些变更。
