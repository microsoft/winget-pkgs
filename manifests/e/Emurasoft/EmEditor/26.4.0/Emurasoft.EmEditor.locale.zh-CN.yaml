ReleaseNotes: |-
  今天，我们发布了 EmEditor v26.4。
  1. 在快速查看模式下编辑超大文件
  在 v26.3 中，我们推出了 快速查看 模式，它无需将整个文件载入内存即可几乎瞬间打开超大文件。不过，快速查看模式是只读的，因此要编辑超大文件，你仍然需要切换到普通模式，并等待整个文件载入完毕。
  在此版本中，快速查看模式支持编辑。你可以在不将超大文件载入内存的情况下编辑它：输入、粘贴、撤消 和 重做、全部替换、使用多重选择，以及运行 插入、转换 和 排序 菜单上的大多数命令。在你保存之前，原文件不会发生变化。
  1-1. 合并编辑内容，或仅保存更改
  在快速查看模式下保存超大文件时，你可以选择保存方式：
  - 保存并立即合并 会将编辑内容写入文件。
  - 仅保存我的更改 会保持原文件不变，并将你的编辑内容保存到单独的差异文件中。下次打开该文件时，EmEditor 会载入差异文件并恢复你的编辑内容。
  差异文件还会保存行的位置，因此下次可以立即打开该文件。你可以使用新增的 保存差异、载入差异 和 放弃差异 命令（所有命令 菜单的 文件 > 差异 子菜单）来保存、载入和放弃差异文件。
  1-2. CSV 编辑、工作区与 FAST 指示器
  - 快速查看模式现在支持会更改文档的 CSV 命令，包括单元格编辑、拆分列、合并列、合并行、临时隐藏引号、隐藏列/取消隐藏列、重置列宽 以及 左对齐/居中对齐/右对齐（仅限 Pro 版）。
  - 快速查看文档现在会包含在工作区中，包括其未保存的编辑内容。
  - 状态栏上新增的 FAST 指示器和文档标签上的闪电图标表示该文档处于快速查看模式。双击该指示器可以在普通模式与快速查看模式之间切换。
  我们还在 自定义 对话框中新增了 快速查看 页面。启用快速查看模式的最小文件大小 设置已从 高级 页面移至此页面，你还可以选择保存超大文件时是否提示、是否仅将更改保存到差异文件，以及是否保存超大文件中行的位置。该页面还会列出差异文件，你可以删除它们。
  1-3. 宏与插件
  现在，在快速查看模式下可以使用 Document 与 Selection 对象中大多数会更改文档的属性与方法，并且我们在 Editor 对象中新增了 GetFastViewDiffPath 方法。对于插件开发者，现在在快速查看模式下可以使用大多数会更改文档的消息，我们还为 EE_INFO 消息新增了 EI_GET_FAST_VIEW_DIFF_PATH 参数，并新增了差异命令和 自定义快速查看 命令的命令 ID。
  1-4. 命令行选项
  我们新增了 /fast 和 /tail 命令行选项。即使文件小于 启用快速查看模式的最小文件大小，/fast 也会以快速查看模式打开文件；/tail 会以快速查看模式打开文件，并立即显示文件的末尾。/tail 等同于 /fast /l -1，我们相信它有助于快速查看超大文件（例如日志文件）的末尾部分。如果在配置属性的 文件 页面的 被其他程序更改时 下拉列表中选择 自动重新载入，每当其他程序更改文件时，文件都会自动重新载入，并且 EmEditor 会滚动到文件末尾，这对于监视正在写入的日志文件很有用。
  2. 更快
  在此版本中，EmEditor 启动更快，对超大文件的许多操作也大幅提速，尤其是在快速查看模式下。在我们的测试中，主窗口就绪的速度比 v26.3 快了 1.93 倍。在配备 16 GB 内存的 PC 上处理 48 GB 文件时，全部替换 快了约 5 倍，保存文件快了约 13 倍；由于差异文件中保存了行的位置，第二次打开该文件只需 0.02 秒。普通模式下的 排序 和 删除重复行 也分别快了约 6 倍和约 3 倍。
  3. 文件缩小 31%
  在此版本中，我们重新审视了 EmEditor 及其插件的代码和库，使几乎所有 EXE 和 DLL 文件都变小了。我们在每项更改前后测量了速度，只保留了在我们的测试中没有使 EmEditor 变慢的更改。EmEditor.exe 缩小了 57%，插件缩小了约 50% 到 75%。不再安装 pcre.dll、zlib1.dll、vccorlib140.dll 和 msvcp140.dll。EXE 和 DLL 文件总计缩小了 31%（便携版从 69,962 KB 降至 48,431 KB）。文件越小，载入越快，这也有助于加快启动速度。
  4. 其他改进
  - 启动窗口现在支持 App 主题 和 很暗 主题。
  - 宏现在以带签名 (BOM) 的 UTF-8 保存，而不是 UTF-16。
  - 使用同步文件夹进行同步现在更快、更可靠：EmEditor 不再发送未更改的设置，不再覆盖其他计算机发送的较新设置，并且在无法访问该文件夹时不会等待。由于 Windows 11 不再在计算机之间同步商店应用的漫游文件夹，已无法再通过 Microsoft 账户同步设置。如果你使用过此功能，请改用同步文件夹。
  - 工作区现在可以更安全地保存和加载。保存失败不再破坏之前的工作区，损坏的工作区或由较新版本保存的工作区不再被清除，并且包含多个窗口的工作区现在可以正确保存。
  - 我们新增了用于按计算机注册的 emeditor /register 和 emeditor /unregister 命令行选项，使同一台 PC 上的所有用户都可以使用同一个许可证（仅限 Pro 版）。注册信息 对话框现在会显示按计算机注册的电子邮件地址。
  - 与 AI 聊天 栏现在默认在左侧打开。
  - 商店和 MSIX 版本：EmEditor 现在会提议移除已卸载的 MSI 版本遗留的文件关联，这些关联曾导致 Windows 无法使用 EmEditor 打开这些文件。
  - 我们修复了若干问题，包括光标顺序不正确的多重选择导致的崩溃、显示含有大量组合字符的行时的崩溃，以及 排序 和 删除重复行 会丢失仅以 CR 结尾的行之后的空行的问题。
  5. 安全更新
  此版本解决了严重的安全问题 eMudhra Intermediate CA Compromise。为 语言服务器协议 (LSP) 功能附带的 Node.js 受此问题影响，因此我们已将其更新到 v26.12.1。我们扫描了 EmEditor 的源代码，未发现其他受影响的部分：EmEditor 使用 Windows 的 CA 证书，WebPreview 和 ChatAI 插件使用你的 PC 上安装的 Microsoft Edge。我们建议你使 Windows 和 Web 浏览器保持最新状态。
  我们希望你会对 Pro 与 Free 版本都感到满意。如果你有任何问题、功能需求或想法，请联系我们。
  感谢你一直以来对 EmEditor 的支持。
  —— Yutaka Emura
  更多详细信息（包括主要变更与截图）请参阅：“Version 26.4 新增特性”。
  如果你使用旧版 MSI 安装程序，请选择 帮助 > 检查更新 来更新 EmEditor。如果更新未能成功完成，请下载最新版本并手动运行安装程序。如果你直接下载 MSI 安装程序，请确认其数字签名由 Emurasoft, Inc. 颁发。
  Microsoft Store 版本预计将在接下来的几天内提供。我们建议使用 Microsoft Store 版本或新的 MSIX 安装程序。旧版 MSI 版本的更新检查器将于 2027 年 3 月 31 日 (UTC) 之后停用。在该日期之后，EmEditor 将不再检查更新，并且 检查更新 将不可用。更多信息请参阅：FAQ：商店版与新安装程序（MSIX）。
  如果我们未来发布小更新（v26.4.x），这篇博客文章可能会更新以包含这些变更。
