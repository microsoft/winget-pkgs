ReleaseNotes: |-
  EmEditor v26.2.6 is now available. This release focuses on stability and includes the fixes and improvements listed below. We recommend updating to the latest version for the best experience.
  - Removed the Associate with EmEditor button from the File page of the Customize dialog in the Microsoft Store and MSIX versions.
  - Fixed an issue where the status bar did not display Help messages when menu commands were selected.
  - Improved the message shown when EmEditor crashes because of an ATOK-related issue.
  - Improved the performance of the WordComplete plug-in.
  - Improved syntax coloring performance when files contain very long lines.
  - Fixed various crashes, including crashes that could occur in low-memory situations.
  If you use the legacy MSI installer, select Help > Check for Updates to update EmEditor. If the update does not complete successfully, please download the latest version and run the installer manually. If you download the MSI installer directly, please verify that its digital signature is issued by Emurasoft, Inc.
  We recommend using the Microsoft Store version or the new MSIX installer. Updates for the legacy MSI installer are currently scheduled to end in March 2027. For more information, see FAQ: Store Version and New Installer (MSIX).
