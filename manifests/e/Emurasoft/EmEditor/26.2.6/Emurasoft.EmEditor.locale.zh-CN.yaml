ReleaseNotes: |-
  EmEditor v26.2.6 现已发布。本次发布侧重于稳定性，并包含以下修复与改进。我们建议更新到最新版本以获得最佳体验。
  - 在 Microsoft Store 版和 MSIX 版中，从“自定义”对话框的“文件”页面移除了 与 EmEditor 关联 按钮。
  - 修复了在选择菜单命令时，状态栏不显示“帮助”消息的问题。
  - 改进了因 ATOK 相关问题导致 EmEditor 崩溃时显示的提示信息。
  - 提升了单词自动完成插件的性能。
  - 当文件包含超长行时，改进了语法着色性能。
  - 修复了多种崩溃问题，包括在低内存情况下可能发生的崩溃。
  如果你使用旧版 MSI 安装程序，请选择 帮助 > 检查更新 来更新 EmEditor。如果更新未能成功完成，请下载最新版本并手动运行安装程序。如果你直接下载 MSI 安装程序，请确认其数字签名由 Emurasoft, Inc. 颁发。
  我们建议使用 Microsoft Store 版本或新的 MSIX 安装程序。旧版 MSI 安装程序的更新目前计划于 2027 年 3 月结束。更多信息请参阅常见问题：商店版与新安装程序（MSIX）。
