ReleaseNotes: |-
  EmEditor v26.2.4 is now available. This release focuses on stability and includes the fixes and improvements below. We recommend updating to the latest version for the best experience.
  - Fixed a potential crash when opening multiple files simultaneously.
  - Fixed an issue introduced in v26.2.1 where it might not be possible to send an entire very large document to an external tool’s standard input.
  - To reduce download and installation failures, the Store and MSIX editions no longer include local Help in the package, consistent with other editions. If you need local Help, please download and install the separate Local Help installer.
  - Fixed the icon background color for the Store and MSIX editions.
  - Fixed some UI issues related to Dark Mode.
  If you use the legacy MSI installer, select Help > Check for Updates to update EmEditor. If the update does not complete successfully, please download the latest version and run the installer manually.
  The Microsoft Store version is expected to be available within the next few days. If you download the MSI installer directly, please verify that its digital signature is issued by Emurasoft, Inc.
  We recommend using the Microsoft Store version or the new MSIX installer. Updates for the legacy MSI installer are currently scheduled to end in March 2027. For more information, see FAQ: Store Version and New Installer (MSIX).
