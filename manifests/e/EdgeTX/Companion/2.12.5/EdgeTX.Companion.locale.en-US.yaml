ReleaseNotes: "We are pleased to offer EdgeTX \"Queen Anne's Revenge\" v2.12.5, the fifth maintenance release for 2.12, and is recommended for anyone already on 2.12.x. Highlights of this release include hopefully finally putting to rest a bootloader flash lockup that has been here since the OpenTX days, as resolving some bootloader flashing issues which were reported for the last couple of releases. Four more new handsets are added, and there are lots of little fixes for all radios, whether you have B&W or color screen, as well as one or two more fixes for things that could trigger emergency mode,  some translation updates, and a couple more tools for Lua authors to benchmark their scripts and widgets. \n\n\n> [!NOTE]\n> As with any firmware update, please ensure you back up your model and radio settings before updating, fully bench-test your models after updating, and report any issues you encounter.\n>\n> For MacOS users, Companion is now only compiled for MacOS 12 and above. Stay with v2.10.5 or earlier if you need support for an older version of MacOS.\n>\n> **Migration Information**\n> - If you have an old OpenTX Companion (`.otx`) file you need to convert or open, you will need to use EdgeTX Companion v2.10 or earlier.\n> - If you wish to upgrade from OpenTX 2.3 or EdgeTX 2.4/2.5, you must use either EdgeTX v2.8.x firmware or EdgeTX Companion v2.10.x.\n>\n> See the [EdgeTX Manual](https://manual.edgetx.org/installing-and-updating-edgetx) for more information.\n\n> [!WARNING]\n> If you are using a STM32 F2 based radio, EdgeTX v2.11 is the last release series to support these radios. Check [this list](https://hackmd.io/@edgetx/B12oQyQKye) or the [Supported Radios list](https://edgetx.org/supportedradios/) if you are unsure if this affects you. Because of this, EdgeTX v2.11 will continue to be supported alongside 2.12, 3.0, etc., with a focus on bug fixes.\n\n> [!TIP]\n> Radios based on STM32H7 MCUs update differently to older radios. To update the Flysky PA01, Flysky ST16, Jumper T15 Pro, Jumper T15-H7, Jumper T18H7, Jumper T22, RadioMaster GX15, RadioMaster TX15, RadioMaster TX16S MK3, Senduwing H17 and iFlight Commando 14, please follow the instructions in the [EdgeTX Manual](https://manual.edgetx.org/installing-and-updating-edgetx/updating-your-stm32h7-radio).\n\n## Changes\n\n### New Handsets\n• HelloRadioSky V15 (#7868)\n• Jumper T15-H7 (#7849)\n• Jumper T18 H7 (#7888)\n• Senduwing H17 (#7765)\n\n### 🚀 Features\n• make editing date & time easier (#7767)\n\n### 🐛 Bug Fixes\n#### 🎮 Firmware\n• excessive lua telemetry could cause an EM crash (#7773)\n• hangs during flashing firmware and possible firmware/bootloader corruption (#7415)\n• audio logic does not use all of the available buffers (#7689)\n• trim not applied when mix source is inverted (#7779)\n• long timer announced as \"1 hour 60\" before hour rollover (#7784)\n• debug info and CLI show incorrect free space for task stacks (#7856)\n• exFat directory handling (#7485)\n• HoTT out-of-bounds warning byte and null sensor lookup (#7777)\n• crsf：proper unsigned telemetry value support (#7066)\n#### 🖥️ Black & White Radio\n• potential Lua stack overflow in lcd.drawCombobox (#7775)\n#### 🎨 Color LCD Radio\n• label list may not display correctly when multiple labels are selected (#7756)\n• popup menu toolbar may be clipped if only two entries (#7801)\n• custom failsafe page layout and other tweaks (#7788)\n• labels for a model may get truncated in 'labels.yml' file (#7812)\n• bold font fallback for non-Latin languages (#7815)\n• model files may not import into Companion if widget name/option string, switch name, contains certain characters (#7831)\n• value widget text display may be clipped (#7852)\n• model yaml file may be needlessly saved when editing screen setup (#7795)\n• forced window scroll when using rotary encoder may not work on all screen sizes (#7871)\n#### 💻 Companion\n• restore rotary encoder mode options in radio settings (#7906)\n• update in-app updater's macOS asset filename pattern from osx to macos (#7754)\n• F16 and TX16S MK3 flex switches missing (#7810)\n• hide contrast setting for colour LCD radios (#7877)\n#### 📦 Other\n• gx15：missing internalgps wiring (#7747)\n• v12：add AUX1 serial port on UART4 (#7761)\n• pa01：audio unmute delay, module size options (#7778)\n• gx15：no sound when recording mic on prod radio (#7813)\n• tprov2：charging LED indicator regression in 2.12.x (#7833)\n• nv14:About page button overlap, AFHDS2A bind prompt, AFHDS2A on external bay (#7836)\n• tx16smk3：add missing Bluetooth power GPIO definition (#7855)\n• t15/t15pro：default SF to TOGGLE on T15 and T15 Pro (rather than 2POS) (#7870)\n• v14：blank OLED RAM before display on, mute amp at boot (#7899)\n\n### 📜 Lua\n• add lvgl.getPerf() and getCpuLoad() to read UI and CPU load (#7822)\n• serialGetPower/serialSetPower report power control on ports without it (#7879)\n• add luadoc annotations for the LVGL Lua API (#7771)\n• bound switch and curve lookups, fix Lua getSwitchInfo() and getFieldInfo() switches (#7826)\n\n### 🧹 Chores\n• german 🇩🇪 translation updates (#7785)\n• swedish 🇸🇪 translation updates (#7772)\n• hebrew translation updates (#7845)\n• display exfat compile option on version screen (#7857)\n• hide Ext. RAS row when no FrSky external module in use (#7840)\n• fix minor issues when moving controls to select a source (#7782)\n• replace the bitmaps in the calibration pages with generated UI (#7762)\n• reduce size of BOLD font data (#7750)\n\n**Full Changelog**：https://github.com/EdgeTX/edgetx/compare/v2.12.4...v2.12.5\n\nSee the [v2.12.0 Release notes](https://github.com/EdgeTX/edgetx/releases/tag/v2.12.0) for the full list of what is new for v2.12.0!\n\n## Known Limitations and Issues\n\n• Wireless Model Trainer and CRSF/ELRS - if using the Multi Protocol Module (MPM) as a wireless trainer in conjunction with CRSF/ELRS, do not go above 250 Hz, otherwise the MPM wireless trainer will be dropped. 250 Hz or below is stable.\n• Companion has had some substantial changes made to backend profile management and settings code via #6654 as well as a few other things in #6877 and #6892, so please ensure you double check everything is being read and written correctly when you first read and write profiles with this version of Companion, and generally when manipulating, copy and pasting models, etc, just in case anything snuck through.\n\n## UI/UX behavioral changes and/or new capabilities:\n• quick/main menu looks slightly different, due to the reversion of the EdgeTX 3.0 UI\n• quick/main menu is now themeable - you can configure the foreground (icon/label) and background colours (#6799)\n• model notes, when present, are shown as a tab in the model setup area\n• heli options, when enabled, are shown as a button at the bottom of the model setup page rather than as a tab\n• STM32F4：the UART speed for external CRSF modules has been limited to 3.75Mbps due to recommendation of the ExpressLRS developers (#6923)\n\n## Supported radios\nThe full list of supported radios and their support status can be viewed [here on the EdgeTX website](https://edgetx.org/supportedradios).\n\n## Installation Guide\nhttps://manual.edgetx.org/installing-and-updating-edgetx\n\n## Flash firmware via Chrome based browser\nhttps://buddy.edgetx.org/#/flash?version=v2.12.5\n\n## Language and Custom builds\nCustom prebuilt firmware is no longer available. However, the [CloudBuild option in EdgeTX Buddy](https://buddy.edgetx.org/) is here to allow you to build your own firmware, with just a few clicks. Additionally, EdgeTX Companion now also has some support for CloudBuild, and will automatically fetch firmware for a supported language when you use the \"Update components\" option. But you can still build your own firmware online [following this guide](https://github.com/EdgeTX/edgetx/wiki/Building-radio-firmware-in-a-web-browser-with-GitHub-CodeSpaces), request a specific build at #7357 or ask on Discord for someone to build one for you.\n\n## Contributors\nThank you to the following contributors who made this release possible!\n• @3djc\n• @CapnBry\n• @Danish-G00474572\n• @helloradiosky\n• @juricabi\n• @kilrah\n• @offer-shmuely\n• @ParkerEde\n• @pfeerick\n• @philmoz\n• @richardclli\n• @rotorman\n• @ulfhedlund"
