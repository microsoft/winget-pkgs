ShortDescription: Spotlight-style launcher for Windows. Win+Space to search apps, files and folders, or do math.
Description: |-
  Indicative brings macOS Spotlight to Windows. Press Win+Space, type, and press Enter to open apps (including Store apps), files and folders, evaluate math, or search the web.
  Results appear in a blurred acrylic panel grouped into Top Hit, Applications, Documents and Folders, and items you open often rank higher over time.
  Written in Rust and C against raw Win32 with no runtime dependencies. It uses about 0.5 MB of memory while idle and searches in well under a millisecond per keystroke.
