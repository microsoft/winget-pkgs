ReleaseNotes: "## Changelog\n\n• The Lua button now opens a download dialog with two options:\n    • **ExpressLRS Lua** from the new [ExpressLRS/Lua](https://github.com/ExpressLRS/Lua) releases：configuration tool, bind manager and widgets. Needs EdgeTX 2.12.1 or newer and ExpressLRS 3.5.4 or newer\n    • **Legacy script**：configuration tool only, for EdgeTX 2.11 or older and OpenTX\n• Update translations (thank you to all Crowdin translators!)\n\n## Which file do I need?\n\n• Windows (8, 10, 11)：`ExpressLRS-Configurator-Setup-1.8.5.exe`\n• Mac OS X (please\n  read [macOS install notes](https://github.com/ExpressLRS/ExpressLRS-Configurator#macos)):\n    • `ExpressLRS-Configurator-1.8.5-arm64.dmg` (Apple Silicon：M1 and newer)\n    • `ExpressLRS-Configurator-1.8.5-x64.dmg` (Intel Macs)\n• Linux (please read [linux install notes](https://github.com/ExpressLRS/ExpressLRS-Configurator#linux)):\n    • `expresslrs-configurator_1.8.5_amd64.deb` (Ubuntu, debian)\n    • `expresslrs-configurator-1.8.5.pacman` (Arch)\n    • `expresslrs-configurator-1.8.5.x86_64.rpm` (Red Hat, Fedora, CentOS)\n    • `flatpak install org.expresslrs.ExpressLRSConfigurator` (Flatpak distribution format)\n    • `expresslrs-configurator-1.8.5.zip` (others)"
