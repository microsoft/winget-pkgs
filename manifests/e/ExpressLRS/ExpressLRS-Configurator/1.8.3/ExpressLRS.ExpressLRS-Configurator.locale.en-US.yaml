ReleaseNotes: |-
    ## Changelog

    * Add native macOS arm64 (Apple Silicon) build and update bundled Python to 3.14.6 (thank you @silicongarage & @RobertoD91!)
    * Add binding phrase history for quickly reusing previous binding phrases (thank you @grzella!)

    ## Which file do I need?

    * Windows (8, 10, 11): `ExpressLRS-Configurator-Setup-1.8.3.exe`
    * Mac OS X (please
      read [macOS install notes](https://github.com/ExpressLRS/ExpressLRS-Configurator#macos)):
        * `ExpressLRS-Configurator-1.8.3-arm64.dmg` (Apple Silicon: M1 and newer)
        * `ExpressLRS-Configurator-1.8.3-x64.dmg` (Intel Macs)
    * Linux (please read [linux install notes](https://github.com/ExpressLRS/ExpressLRS-Configurator#linux)):
        * `expresslrs-configurator_1.8.3_amd64.deb` (Ubuntu, debian)
        * `expresslrs-configurator-1.8.3.pacman` (Arch)
        * `expresslrs-configurator-1.8.3.x86_64.rpm` (Red Hat, Fedora, CentOS)
        * `flatpak install org.expresslrs.ExpressLRSConfigurator` (Flatpak distribution format)
        * `expresslrs-configurator-1.8.3.zip` (others)
