ReleaseNotes: "## Changelog\n\n• Fix local builds of 2.4 GHz-only LR1121/LR2021 devices\n• Hide targets that newer firmware versions no longer support\n• Validate the `AUTO_WIFI_ON_INTERVAL` range and always show the allowed range\n• Security hardening：the local API server now listens only on localhost and needs a new auth token on each launch, build targets are sanitized, and PlatformIO no longer runs through a shell\n• Always show build logs in expert mode (thank you @grzella!)\n• Clarify the \"Passthrough\" flashing method description (thank you @grzella!)\n• Add Arabic language and right-to-left (RTL) layout support\n• Fix a typo in the Danger Zone description (thank you @Pencilvestr!)\n• Upgrade Electron to 44\n• Update translations (thank you to all Crowdin translators!)\n\n## Which file do I need?\n\n• Windows (8, 10, 11)：`ExpressLRS-Configurator-Setup-1.8.4.exe`\n• Mac OS X (please\n  read [macOS install notes](https://github.com/ExpressLRS/ExpressLRS-Configurator#macos)):\n    • `ExpressLRS-Configurator-1.8.4-arm64.dmg` (Apple Silicon：M1 and newer)\n    • `ExpressLRS-Configurator-1.8.4-x64.dmg` (Intel Macs)\n• Linux (please read [linux install notes](https://github.com/ExpressLRS/ExpressLRS-Configurator#linux)):\n    • `expresslrs-configurator_1.8.4_amd64.deb` (Ubuntu, debian)\n    • `expresslrs-configurator-1.8.4.pacman` (Arch)\n    • `expresslrs-configurator-1.8.4.x86_64.rpm` (Red Hat, Fedora, CentOS)\n    • `flatpak install org.expresslrs.ExpressLRSConfigurator` (Flatpak distribution format)\n    • `expresslrs-configurator-1.8.4.zip` (others)"
