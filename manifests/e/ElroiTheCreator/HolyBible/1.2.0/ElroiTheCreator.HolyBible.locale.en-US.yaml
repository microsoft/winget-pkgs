ReleaseNotes: |-
  Holy Bible (வேதம்) Desktop - Portable Windows Release v1.2.0
  🚀 Highlights & Features
  - Single Portable Executable (.exe): No installation or Python runtime required.
  - In-App Version & Auto-Update Check: Shows active application version in Settings and checks for new releases on startup.
  - AI Scripture Study: In-depth historical context, chapter overviews, and verse-by-verse exegesis.
  - AI Scripture Quiz & Theological Tutor: Daily trivia questions and dynamic AI-generated scripture quizzes.
  - Open-Licensed & Public Domain Dual-Corpus Support:
    - Protestant (66 Books): 1871 Tamil Old Version (Public Domain) + 1769 King James Version (Public Domain)
    - Catholic (73 Books): Tamil Indian Revised Version (IRV, CC BY-SA 4.0 by Bridge Connectivity Solutions) + 1752 Douay-Rheims Bible (Public Domain, including all 7 Deuterocanonical books)
  - 100-Day Read-Along Audio Bible: High-fidelity Microsoft Neural TTS with Deep Bass audio modulation and prefetching.
  - Christian Hymnals & Lyrics: 1,500+ worship songs with lyrics, volume filtering, and YouTube embeds.
  - Church Presenter Mode: Fullscreen projection slides with responsive typography.
  - Reading Plans & Bookmarks: Custom tracks with offline progress checkoffs and self-service cloud sync/deletion controls.
  - Privacy Policy & Licensing: PRIVACY.md • NOTICE.md • LICENSE
