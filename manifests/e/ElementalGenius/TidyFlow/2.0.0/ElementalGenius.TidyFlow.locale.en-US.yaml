ShortDescription: Automatic file organizer for Windows. Keeps your Downloads folder tidy.
Description: |-
  TidyFlow moves files out of your Downloads folder (or any folder you choose) into tidy destination folders based on their type.
  Preview what will happen before anything moves, organize with one click, on a schedule, or as soon as a download finishes, and undo any run from the history.
  Everything stays on your PC: no account, no telemetry, no network access.
