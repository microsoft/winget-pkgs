ShortDescription: Privacy-first universal voice keyboard
Description: |-
  Echo is a privacy-first voice keyboard. Press a hotkey, speak, and Echo
  transcribes your speech and types it into whatever application is focused.

  Transcription runs locally on your machine using Whisper by default, so audio
  never leaves your device. Cloud providers (OpenAI, Groq, Deepgram) are
  optional and opt-in.

  Also includes a configurable wake word, per-application profiles, a custom
  replacement dictionary, and a log of every outbound network request the app
  makes.
