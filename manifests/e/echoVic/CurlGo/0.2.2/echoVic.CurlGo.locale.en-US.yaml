ShortDescription: Open-source local-first API client for HTTP, SSE and WebSocket with environments, secrets in the macOS Keychain and curl, Postman and Bruno import.
Description: |
  CurlGo keeps requests and workspaces on the machine, with no account and no project setup. It supports a shared cookie jar, environments, global headers, {{name}} variables, per-environment secrets, assertions on status, headers, JSON fields and body, and import of curl commands and Postman v2.1 or Bruno collections. Collection scripts are never executed.
