ShortDescription: Open-source Markdown editor that keeps every file as plain .md, with in-place tables and images, KaTeX math, Mermaid diagrams and Word export.
Description: |
  Liubai opens straight into a page and keeps unsaved writing as a local draft. Tables and images are edited in place, and KaTeX math, Mermaid diagrams, GitHub alerts, folded details and footnotes are supported. It adds full-text search, wiki links with backlinks, 25 themes, focus mode and edit, split and read views, and exports to PDF, Word (.docx), HTML and a Markdown ZIP.
