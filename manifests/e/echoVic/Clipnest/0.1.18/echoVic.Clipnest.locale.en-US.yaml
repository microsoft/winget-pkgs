ShortDescription: Open-source keyboard-first clipboard history for macOS and Windows with search, snippets, pinned panels and on-device OCR for screenshots.
Description: |
  Clipnest records text, links, code and PNG images in SQLite with de-duplication and configurable retention. Press 1-9 to paste directly, search the full history, keep a panel pinned on screen, paste several items in the original order, and mask API keys, tokens and card numbers by default. Text inside screenshots is recognized on-device and added to search.
