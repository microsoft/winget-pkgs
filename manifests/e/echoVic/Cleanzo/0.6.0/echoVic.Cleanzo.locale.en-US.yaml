ShortDescription: Open-source cleaner for macOS and Windows that shows system and disk usage before removing caches, large files and idle build output.
Description: |
  Cleanzo groups junk into system, app and browser caches, update leftovers, developer tools and custom folders, and lets you stop at any point. It also understands AI and developer storage (Claude Code, Codex and TRAE sessions, Ollama, HuggingFace and LM Studio models, npm, pnpm, Bun, uv, pip, Cargo, Go and Xcode caches). Anything you remove can be restored from the Trash.
