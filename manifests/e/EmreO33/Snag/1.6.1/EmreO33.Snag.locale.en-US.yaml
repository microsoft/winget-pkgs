ReleaseNotes: |-
  What changed
  Snag now gets yt-dlp installed in more places: without administrator
  rights, behind a firewall, and on PCs where it would not even open.
  - Snag opens on PCs without working OpenGL. On some virtual machines,
    remote desktops and PCs with missing graphics drivers, 1.6.0 quietly
    showed no window at all. Snag now starts with Direct3D 12 when OpenGL is
    not available, and if neither works it says so instead of vanishing.
  - yt-dlp installs into a protected folder with one prompt. When Snag's
    yt-dlp folder is one only an administrator can write to, such as a
    portable copy in Program Files, Windows asks once and the whole install
    goes through. Everywhere else no administrator rights are needed.
  - A firewall no longer leaves you without yt-dlp. When Snag cannot
    reach GitHub directly and has no proxy set in its settings, it tries the
    proxy your computer is set to use. If that fails too, it says plainly
    what is in the way and offers to open yt-dlp's release page, so you can
    download it in your browser and pick the file in Snag. A picked file has
    to prove it is yt-dlp before it replaces anything.
  Windows
  - Snag-*-windows-setup.exe: the installer. Installs for you or for all
    users, adds a Start Menu entry, and uninstalls cleanly.
  - Snag-*-windows-portable.zip: portable. Unzip and run. It keeps
    everything in a data folder beside the executable and writes nothing else
    to the machine.
  - snag-windows-x86_64.exe: the bare executable.
  Linux
  - Snag-*-x86_64.AppImage: the recommended Linux build. Runs on any distro
    with glibc 2.35 or newer and integrates with your application menu. chmod +x it and run it.
  - snag-linux-x86_64: the bare binary. Needs glibc 2.39 or newer.
  macOS
  snag-macos-aarch64, a bare binary. Builds in CI but has not been run by
  anyone yet, so treat it as untested.
  Snag does not ship yt-dlp. On first launch it offers to download the current
  yt-dlp release from the yt-dlp project's own GitHub releases. ffmpeg is
  required separately and is not installed by Snag.
  Full Changelog: v1.6.0...v1.6.1
