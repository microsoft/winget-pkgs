ReleaseNotes: |-
  What changed
  Two smaller fixes that make Snag lighter to run.
  - Starting is quicker on PCs without working OpenGL. Since 1.6.1 Snag
    falls back to Direct3D 12 there, but it found that out again on every
    launch, which cost a few seconds each time. It now remembers, and tries
    OpenGL again once after each update, in case a new graphics driver has
    fixed it.
  - Pasting link after link no longer piles up work in the background.
    Snag looks up each link you paste to show its preview. A look-up for a
    link you had already replaced kept running for up to half a minute, using
    the network and a processor core for an answer nobody would see. It now
    stops as soon as a newer link takes its place.
  Windows
  - Snag-*-windows-setup.exe: the installer. Installs for you or for all
    users, adds a Start Menu entry, and uninstalls cleanly.
  - Snag-*-windows-portable.zip: portable. Unzip and run. It keeps
    everything in a data folder beside the executable and writes nothing else
    to the machine.
  - snag-windows-x86_64.exe: the bare executable.
  Linux
  - Snag-*-x86_64.AppImage: the recommended Linux build. Runs on any distro
    with glibc 2.35 or newer and integrates with your application menu. chmod +x it and run it.
  - snag-linux-x86_64: the bare binary. Needs glibc 2.39 or newer.
  macOS
  snag-macos-aarch64, a bare binary. Builds in CI but has not been run by
  anyone yet, so treat it as untested.
  Snag does not ship yt-dlp. On first launch it offers to download the current
  yt-dlp release from the yt-dlp project's own GitHub releases. ffmpeg is
  required separately and is not installed by Snag.
  Full Changelog: v1.6.1...v1.6.2
