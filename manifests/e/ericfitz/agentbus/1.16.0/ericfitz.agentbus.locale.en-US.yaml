ReleaseNotes: |-
  The TUI rail has five sections
  The rail used to list chat, memory and task channels in one "channels"
  list. It now has five sections, top to bottom: channels, memories, tasks,
  tags and sessions. Each section has a heading you can select: left
  collapses it, right expands it and enter toggles it. A row drops its
  section's general/, memory/ or tasks/ prefix. On a short terminal the
  rail drops the blank rows between sections, then shows at least one item
  of each section plus a combined "more" row. In the compose line, down on
  the last line clears the draft.
  Selected idle session rows keep their name
  A selected row now swaps any text color equal to its background for one
  that reads on it, so an idle session's name, a live session's context
  suffix and a channel's (off) marker stay visible.
  Bare agentbus
  Running agentbus with no arguments now prints the usage line and exits 0,
  like help. Unknown commands and bad flags still exit 2.
  Task lists expire after 14 days idle
  The default task_expiry_hours is now 336 (14 days), down from 720 (30
  days). task_idle_hours stays 168. An explicit setting keeps its value.
  Upgrading
  There is no schema change. Upgrade with winget upgrade ericfitz.agentbus
  (or scoop update agentbus, or rerun the install script), then restart
  harness sessions and agentbus tui.
  On the first maintenance tick after upgrading, every task list idle for
  more than 14 days is deleted with its tasks. To keep the old behavior, set
  "task_expiry_hours": 720 in config.json before upgrading.
  The Windows binaries in this release are not Authenticode-signed; they are covered by the signed SHA256SUMS and by build attestations.
