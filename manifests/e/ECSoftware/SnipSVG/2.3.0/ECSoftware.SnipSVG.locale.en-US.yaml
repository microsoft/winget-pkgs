ReleaseNotes: |-
  We are glad to announce the immediate availablility of SnipSVG version 2.3 for Windows and macOS!
  Changes in SnipSVG 2.3
  - Flipping of line and arrow objects did not work correctly when the line was rotated.
  - Full lasso selection on the canvas selected the picture frame, it now selects objects inside the picture frame (same as CTRL + A to select all).
  Download
  All downloads for Windows and macOS are available from the SnipSVG website.
