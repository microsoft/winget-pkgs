ReleaseNotes: |-
  We are glad to announce the immediate availability of Help+Manual and Translation Assistant v10.3. This update includes plenty of new stuff. We have implemented Markdown export, which dramatically improves the training of LLMs (large language AI models).

  Markdown for AI
  AI is all the rage at the moment and the documentation you create with Help+Manual is perfect for AI training. But not the HTML ouput. In fact, LLMs prefer content as simple and structured as possible. To train local LLMs, we have implemented a dedicated Markdown export in the list of publishing formats.
  But that’s not all. The regular Webhelp/HTML5 output is markdown-enabled as well! Help+Manual can optionally write a hybrid website that looks as it did before, but includes additional content in Markdown format. For an LLM which is crawling your website, the page looks entirely different: structured, clear, without headers, footers and additional HTML formatting. Just perfect for learning.
  We have put our own documentation online for a couple of months and the results are very encouraging. If you publish HTML documentation on your website, we recommend to switch it on.

  Help+Manual 10.3 Changes
  - Markdown export includes among publishing formats
  - HTML5/Markdown hybrid export included
  - SnipSVG v2.3 included
  - eViewer v5.8 included
  - DeepL Plugin: the popup menu for source and target language has grown so large, that it could not be displayed anymore on smaller monitors.
  - Markdown Import: When Markdown content is split into header and body, the header text is used as the document title. This affects the text in the TOC entries, because Markdown files never have an explicit document title, hence H&M always used the file name on the TOC.
  - HTML Export: bug fix with the conversion of SVG-to-HTML.
  - Word/DOCX Export: Paragraph and text style attributes are tested for case-sensitivity. If a para in H+M is formatted with “caption” but the style is defined as “Caption”, this makes no difference to H+M, but it does to Microsoft Word.
  - Insert Symbol: some (Wingdings) symbols added to the custom insert list were not correctly displayed and not correctly inserted. The invalid symbols resembled ANSI chars that could not be displayed with a regular font, such as the Wingdings char ➊.
  - Compiler logs (written to a log file) cleaned up and empty lines fixed.
  - Manual Designer: new inserted objects were misplaced and too large on screen resolutions > 100%.
  - Improved (equal) line spacing for items with sub-script entries.
  - Optical glitches with Dark Mode fixed.
  - The plugin for .SNAGX files sometimes extracted the wrong picture.
  Translation Assistant 10.3 Changes
  - DeepL Plugin: the popup menu for source and target language has grown so large, that it could not be displayed anymore on smaller monitors.
  - Shortcut CRLT+A to select all text did not work inside a table.

  All updates are available from our download page.
