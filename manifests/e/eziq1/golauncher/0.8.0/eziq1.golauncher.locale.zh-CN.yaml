ShortDescription: 类 Raycast 的 Windows 和 macOS 启动器，用 Go 编写。
Description: 在任何地方按 Alt+Space 搜索应用、命令、文件和算式。所有功能都是插件：带单位和汇率换算的计算器、剪贴板历史、用 Everything 搜索文件、Scoop 和 WinGet 软件包、系统命令、世界时钟、计时器、快速链接、AI 对话等，还能安装第三方插件。针对资源管理器当前目录和选中文字的操作。无头命令行 glctl 驱动同一个引擎。
