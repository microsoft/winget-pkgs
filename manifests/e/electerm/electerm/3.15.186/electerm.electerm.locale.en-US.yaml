ReleaseNotes: |-
  New features/UI/Updates
  - #4453 Enhance SSH tunnel form to display local and remote address dynamically
  - Add a separate SFTP channel for responsive file transfers and manage its lifecycle
  - Add close sequence and delay options for serial connections, support graceful exit
  - Support drag-and-drop reorder with directional indicators, now can drag to last position
  - Implement write coalescing and buffer management for terminal output
  - Mobile: Support long press terminal to show context menu
  - UI: Enhance file size display in file compare modal with byte count
  - Support code compare when select two files
  - Support terminal wrap toggle
  - UI: Improve terminal control toolbar UI in mobile mode
  Bug fixes
  - #4453 Fix default SSH tunnel value to 'forwardLocalToRemote'
  - Fix disk info check command in terminal info component
  - Fix responsive mode can not drag app issue
  - Fix previous search function in terminal search panel
  - UI: Fix fullscreen mode mobile UI
  - Restore Alt/Option+arrow word-move behavior lost in xterm 6.x (#4449) by @forever765
  - Fix use proxy sync data cause error issue (#4448)
  - Validate dispatched method names in dispatch-center and fs (#4447) by @arpitjain099
  - Mobile: Adjust input font size to prevent zoom issues
  - UI: Fix buttons UI when no session
  新功能/界面/更新
  - #4453 增强 SSH 隧道表单，动态显示本地和远程地址信息
  - 为响应式文件传输实现独立的 SFTP 通道并管理其生命周期
  - 为串口连接添加关闭序列和延迟选项，支持优雅退出
  - 支持拖放重排序并显示方向指示，现在可以拖到最后一个位置
  - 实现终端输出的写入合并与缓冲管理
  - 移动端：支持长按终端显示上下文菜单
  - 界面：在文件对比弹窗中增强文件大小显示，增加字节数
  - 支持选择两个文件时进行代码对比
  - 支持终端换行开关
  - 界面：优化移动端终端控制工具栏 UI
  Bug 修复
  - #4453 修复 SSH 隧道默认值，改为 'forwardLocalToRemote'
  - 修复终端信息组件中的磁盘信息检查命令
  - 修复响应式模式下无法拖动应用的问题
  - 修复终端搜索面板中上一次搜索功能的问题
  - 界面：修复移动端全屏模式 UI
  - 恢复 xterm 6.x 中丢失的 Alt/Option+方向键 单词跳转行为 (#4449)（由 @forever765 提供）
  - 修复使用代理同步数据导致错误的问题 (#4448)
  - 校验 dispatch-center 与 fs 中派发的方法名 (#4447)（由 @arpitjain099 提供）
  - 移动端：调整输入框字体大小以防止页面缩放
  - 界面：修复无会话时的按钮 UI
  Download下载: https://electerm.org
