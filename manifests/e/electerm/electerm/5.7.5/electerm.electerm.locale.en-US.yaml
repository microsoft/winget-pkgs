ReleaseNotes: |-
  Major updates
  - Support custom widget: extend electerm with your own widget, either a self-contained web UI or a config-driven panel that calls your own main process code, import widgets from the widget list, see examples at https://github.com/electerm/electerm-widget-examples
  - Quick command: support steps, a step can send text/keys, wait for output, ask for input, and steps can be grouped with a label (#4613) by @Jrjy3
  New features/UI/Updates
  - Terminal: support right click behavior options: context menu, paste or pass through (#4635)
  - Bookmark: improved multi-level bookmark tree UI (#4620)
  - RDP: support swap ctrl/cmd key in macOS
  - AI: add MiniMax regional presets (#4633) by @octo-patch
  - Server info table only shows 10 items at init, click show more button to show all (#4625)
  - Add reload/close button for failed connection
  - Default hide the new bookmark icon in the left sidebar
  Bug fixes
  - Fix local server port selection logic, avoid startup hang or failure when the port is not available
  - Close the SSH channel when a local-forward client resets before it opens, fix port forwarding may stuck (#4639) by @Pharex38
  - Fix RDP connection stability (#4624)
  - Fix MFA session auto reload issue
  - Fix widget instance list UI
  - Fix telnet inject shell issue (#4610)
  - Fix long tab titles blocking the titlebar drag area (#4621) by @Jrjy3
  - Resize the tab bar when a tab title changes width (#4623) by @Jrjy3
  - Fix monitor panel cover bookmark panel issue
  - Fix empty modal UI's extra borders
  - AI: fix read ftp file tool
  - Fix replay reasoning_content for deepseek thinking models
  - Avoid synthetic assistant turns after AI compression (#4632) by @nodlles
  - Security: fix Windows SFTP command injection (GHSA-ch82-q8wq-2gfv)
  重大更新
  - 支持用户自定义 widget：可以用自带界面的小应用，也可以用配置表单驱动的面板，调用自己的主进程代码，在 widget 列表里导入，示例见 https://github.com/electerm/electerm-widget-examples
  - 快捷命令：支持分步骤，每一步可以发送文本/按键、等待输出、询问输入，步骤还可以用标签分组 (#4613)（由 @Jrjy3 提供）
  新功能/界面/更新
  - 终端：支持右键行为选项：显示菜单、粘贴或直接透传 (#4635)
  - 书签：改进多层级书签树界面 (#4620)
  - RDP：macOS 下支持交换 ctrl/cmd 键
  - AI：添加 MiniMax 各区域预设 (#4633)（由 @octo-patch 提供）
  - 服务器信息表格初始只显示 10 项，点击显示更多按钮查看全部 (#4625)
  - 为连接失败添加重新加载/关闭按钮
  - 默认隐藏左侧栏的新书签图标
  问题修复
  - 修复本地服务端口选择逻辑，避免端口不可用时启动卡住或失败
  - 本地转发客户端在通道打开前重置时关闭 SSH 通道，修复端口转发可能卡住的问题 (#4639)（由 @Pharex38 提供）
  - 修复 RDP 连接稳定性问题 (#4624)
  - 修复 MFA 会话自动重载问题
  - 修复 widget 实例列表界面
  - 修复 telnet 注入 shell 问题 (#4610)
  - 修复过长标签标题遮挡标题栏拖动区域的问题 (#4621)（由 @Jrjy3 提供）
  - 标签标题宽度变化时重新计算标签栏宽度 (#4623)（由 @Jrjy3 提供）
  - 修复监控面板遮挡书签面板的问题
  - 修复空弹窗多余的边框
  - AI：修复读取 ftp 文件工具
  - 修复 deepseek 思考模型的 reasoning_content 重放问题
  - 修复 AI 压缩后产生多余 assistant 回合的问题 (#4632)（由 @nodlles 提供）
  - 安全：修复 Windows 下 SFTP 命令注入漏洞 (GHSA-ch82-q8wq-2gfv)
  Download下载: https://electerm.org
