ReleaseNotes: |-
  Major updates
  - Highlight keywords in large terminal output (#4577) by @Jrjy3
  - Support built-in keyword highlight presets (#4584) by @Jrjy3
  - Windows: system title bar as a theme-colored tab bar overlay (#4583) by @Jrjy3
  New features/UI/Updates
  - UX: file transfer panel now use click to toggle show/hide
  - UI: Now can click session stopped overlay to reload or kill session
  - Security: Make privateKey/certificate input more secure and add security warning for exported data
  - Upgrade electron to version 44
  - Improve app start time
  - MCP: support set terminal keepalive
  Bug fixes
  - #4592 Fix win key cause selection issue (#4594)
  - Fix file transfer 2G limit for no sftp server(use scp)
  - #4596 Support terminal bg image cover mode
  - #4595 Fix window drag resize logic
  - Fix every quick command step to run in the tab it started in (#4587) by @Jrjy3
  - Fix UI follows the title bar the window was created with (#4582) by @Jrjy3
  - #4575 Fix telnet login in some old device (#4576)
  主要更新
  - 终端大量输出中高亮关键词 (#4577)（由 @Jrjy3 提供）
  - 支持内置关键词高亮预设 (#4584)（由 @Jrjy3 提供）
  - Windows：系统标题栏作为主题色标签栏覆盖层 (#4583)（由 @Jrjy3 提供）
  - 升级 electron 至 44 版本
  新功能/界面/更新
  - 体验：文件传输面板现在通过点击切换显示/隐藏
  - 界面：现在可以点击会话停止覆盖层来重新加载或结束会话
  - 安全：增强私钥/证书输入的安全性，并为导出数据添加安全警告
  - 提升应用启动速度
  - MCP: 支持设置终端保活
  问题修复
  - #4592 修复 win 键导致的选择问题 (#4594)
  - 修复无 sftp 服务器时（使用 scp）文件传输的 2G 限制问题
  - #4596 支持终端背景图片 cover 模式
  - #4595 修复窗口拖动调整大小逻辑
  - 修复快捷命令各步骤在其启动的标签页中运行的问题 (#4587)（由 @Jrjy3 提供）
  - 修复界面跟随窗口创建时所用标题栏的问题 (#4582)（由 @Jrjy3 提供）
  - #4575 修复某些旧设备的 telnet 登录问题 (#4576)
