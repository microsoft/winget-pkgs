ReleaseNotes: |-
  New features/UI/Updates
  - New setting: mouse events require Alt key, off by default, plain drags stay local text selection while the wheel still scrolls tmux/vim history
  - UX: Support press and hold to repeat a key on the touch shortcut bar
  Bug fixes
  - Fix .vv file not opening when electerm is already running, double clicking a .vv file only brought the window to the front
  - Fix extra empty lines in the session log when a line ending arrives split across chunks or as a doubled \r\r\n (#4563) by @developerjillur
  - Fix shell integration script on OpenWrt, the injected prompt failed with __e_ps1: not found on every prompt of a nested shell
  - Security: Fix unsafe path resolve in remote to remote file transfer, a crafted remote file name could be written outside the destination directory
  - Security: Fix unsafe command execution from deep link and quick connect opts, dangerous session fields such as a pre-connect proxy command can no longer be set from an untrusted link
  新功能/界面/更新
  - 新增设置：鼠标事件需要按下 Alt 键（默认关闭），普通拖动仍为本地文本选择，滚轮仍可滚动 tmux/vim 历史
  - 体验：触屏快捷栏支持长按连续发送按键
  问题修复
  - 修复 electerm 已在运行时 .vv 文件无法打开的问题，双击 .vv 文件只会把窗口切到前台
  - 修复会话日志中出现多余空行的问题，行结束符被拆分到不同数据块或写成 \r\r\n 时不再多出一行 (#4563)（由 @developerjillur 提供）
  - 修复 OpenWrt 上的 shell 集成脚本，注入的提示符在嵌套 shell 中每次都会报 __e_ps1: not found
  - 安全：修复远程到远程文件传输中不安全的路径拼接，构造的远程文件名可能被写到目标目录之外
  - 安全：修复通过深度链接和快速连接参数执行不安全命令的问题，proxyCommand 等危险会话字段不再能由不可信链接设置
  Download下载: https://electerm.org
