ReleaseNotes: |-
  New features/UI/Updates
  - Support SSH agent forward in bookmark/quick connect settings
  - AI: Support auto compress, chat context is now compressed automatically before it overflows the model's window
  - UX: Add context menu icon for touch device in session toolbar
  - Widget: Support widget instance detail and instance log
  - Widget FTP server: Add pasv_url option and proper pasv_min/pasv_max range
  Bug fixes
  - Fix binary trzsz transfer, downloaded files would be corrupted with protocol text spliced in
  - Fix non-ASCII text garbled in the session log (#4562) by @developerjillur
  - Fix session log keeping only the last row of long lines (#4496) (#4561) by @developerjillur
  - AI: Fix cancel request logic
  - AI: Fix AI chat input lagging issue
  - UI: Fix AI preset UI in mobile mode
  新功能/界面/更新
  - 书签/快速连接设置支持 SSH 代理转发（agent forward）
  - AI：支持自动压缩，上下文超出模型窗口前会自动压缩，避免请求被拒绝导致对话中断
  - 体验：会话工具栏在触屏设备上添加右键菜单图标
  - 组件：支持查看组件实例详情和实例日志
  - 组件 FTP 服务：新增 pasv_url 选项，并正确设置 pasv_min/pasv_max 端口范围
  问题修复
  - 修复二进制 trzsz 传输，下载的文件中会混入协议文本导致损坏
  - 修复会话日志中非 ASCII 文本乱码的问题 (#4562)（由 @developerjillur 提供）
  - 修复会话日志只保留长行最后一行的问题 (#4496) (#4561)（由 @developerjillur 提供）
  - AI：修复取消请求逻辑
  - AI：修复 AI 对话输入卡顿问题
  - 界面：修复移动端 AI 预设界面
