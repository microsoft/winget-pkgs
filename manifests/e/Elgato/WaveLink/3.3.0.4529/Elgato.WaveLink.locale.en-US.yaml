ReleaseNotes: |-
  What’s new in Wave Link 3.3?

  🎙️ Corsair VOXARA Support
  Wave Link now supports the Corsair VOXARA USB gaming condenser microphone. Route it alongside your other inputs, activate Voice Focus to remove background noise and room reverb in real time, and customize its RGB lighting with Multi-Color, Solid Color, or Level Meter mode, or sync it across your setup with iCUE Murals.
  🔗 Discover VOXARA

  🛠️ Improvements & bug fixes
  - Fixed an issue where reordering your audio effects could leave you with no input sound until you disabled all effects or restarted Wave Link.
  - Wave XLR Pro: Fixed an issue where Wave Link could crash during the hardware/software mixer transition.

  Want to share feedback on Wave Link 3.3? Connect with us:
  - Leave a comment on our Subreddit
  - Chat with fellow community members on Discord
  - Hit up @elgato on X
  - Discover more on Explorer
  - Contact our Support Team
