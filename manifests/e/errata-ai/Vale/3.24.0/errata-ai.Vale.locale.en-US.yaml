ReleaseNotes: "This release adds `vale test`, a test runner for your rules. A rule that matches nothing still loads, runs, and reports success. You only find out it's broken when it misses something. Now each rule can carry its own test cases：a short document, and the alerts linting it should produce.\n\n    extends：existence\n    message：\"Consider removing '%s'.\"\n    tokens:\n      • perhaps\n    tests:\n      • name：flags a hedge\n        input：Perhaps we should ship.\n        want：|\n          1:1:House.Hedging:Consider removing 'Perhaps'.\n\nRunning `vale test` lints each case and shows a diff when the output doesn't match. A case can pin the exact output (`want`), check for part of it (`contains`), or check that something is left alone (`absent`). It can run one rule on its own or go through your project's configuration, and it can read its input as another format or through a View. `script` rules are tested the same way. `--coverage` fails any rule that no case makes fire, and the exit codes are built for CI.\n\nSee [Testing](https://docs.vale.sh/topics/testing) and the [announcement post](https://vale.sh/blog/testing-rules).\n\n## Changelog\n• 2ee78171 fix：A rule whose `tests` don't parse fails `vale test` instead of vanishing\n• 77da0b08 refactor：Typed errors, pattern errors at the token, and readable contexts\n• 634b321c fix：Errors show the real exit code, honor --no-color, and point at the config\n• db39c406 feat：`BasedOnStyles = NONE`, the spelled-out empty value\n• bc8b91d8 perf：Don't parse a file no rule can run on\n• c283a4dc feat：Conditional sections, `[glob if expr]`\n• 08923bdf feat：`vale test`, and install a package's own dependencies for it\n• 424f6e62 fix：Keep a fenced block skipped when both `pre` and `code` are in SkippedScopes\n• 84deb6c3 fix：Keep non-breaking and narrow spaces beside inline markup\n• 8cbda873 feat(code)：parse C# comments with the C# grammar (#1196)\n• 24f277bb test：add `vale test` cases"
