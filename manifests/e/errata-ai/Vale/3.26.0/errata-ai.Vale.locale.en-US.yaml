ReleaseNotes: "## Vale in the browser\n\nv3.26.0 is the first release that ships Vale as a WebAssembly module. It's the same engine as the CLI, built for a JavaScript host：a browser, a browser extension, or Node. It runs with no server and no filesystem.\n\nEach release now includes `vale_3.26.0_wasm.tar.gz`, which holds `vale.wasm` and the `wasm_exec.js` loader that matches it. The host passes the `.vale.ini` as a string and loads styles, vocabularies, and packages into an in-memory filesystem. Vale then lints:\n\n• Markdown, MDX, MyST, Quarto, Org, HTML, and plain text, natively.\n• YAML, JSON, and TOML, through Views.\n• AsciiDoc, XML, and any other converted format whose HTML the host produces with a JavaScript converter. `ValeConverterOptions` returns the arguments that make that HTML match what the CLI would produce.\n\n`ValeSuggest` resolves an alert's fixes, and `ValeResolveConfig` reports which rules each section turns on, turns off, or changes the level of. Source-code linting needs tree-sitter, which uses CGo, so it stays CLI-only.\n\nSee the [WebAssembly docs](https://docs.vale.sh/topics/wasm) for the full API. \n\n## Thank you, FLOSS/fund\n\nVale received a $10,000 grant from [FLOSS/fund](https://floss.fund/blog/second-tranche-2025-anniversary/) to support Vale's expansion to the web. Grants like this keep Vale free and independent. Thank you to FLOSS/fund for supporting open-source infrastructure.\n\n\n## Changelog\n• e2d4374b fix：Create bin/ before copying the wasm loader into it\n• 0897e7f2 fix：A sentence or title capitalization rule no longer slows with each exception\n• 8b9bfb97 feat：Resolve a configuration in the browser build\n• bd1c0ba3 fix：An ignored class covers an image's alt text\n• 305eba39 feat：string-config and in-memory entry points\n• 8e5de35a feat：A Config reads its assets through a filesystem of its own\n• 9eeba2d2 fix：Run a `Transform` stylesheet with no network, writes, or directories\n• 0f91a651 feat：Lint a converted format in the browser from the host's HTML\n• cb27bdeb feat：Build Vale for the browser"
