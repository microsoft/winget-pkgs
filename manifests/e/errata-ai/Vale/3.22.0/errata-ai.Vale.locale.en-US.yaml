ReleaseNotes: "## Spelling\r\n\r\n• `split：true` checks the parts of an identifier (`getHTTPResponse_v2` → `get`, `Response`) and reports each at its own position.\r\n• The engine now follows Hunspell's case model, compounding, and affix rules, and passes Hunspell's own test suite.\r\n• Suggestions come in Hunspell's order, and words from ignore files and vocabularies are offered ahead of dictionary words.\r\n• A loaded dictionary is shared across spelling rules.\r\n\r\n## Vocabularies\r\n\r\n• A section can set its own `Vocab`, which adds to the global one and gets `Vale.<Name>.Terms` and `Vale.<Name>.Avoid` rules.\r\n• A period in an entry is text, not a wildcard, and a phrase matches across a line wrap.\r\n• A `Vale.Terms` alert offers the entry's spelling as a fix.\r\n\r\n## Configuration\r\n\r\n• An empty `BasedOnStyles` clears a section's inherited settings; `UNSET` clears one rule or style.\r\n• A `[formats]` key can be a file name or a glob, not only an extension.\r\n• A scope can negate an inline element (`text.raw`, `paragraph.link`, and so on).\r\n• `TokenIgnores` and `BlockIgnores` apply to HTML and DITA.\r\n\r\n## Formats\r\n\r\n• MDX：indented blocks are never code, an expression followed by prose keeps the prose, one-line elements are linted, and alerts no longer land inside JSX tags.\r\n• DITA：all files in a run are converted in one toolkit call.\r\n• Jupyter notebooks are a format of their own.\r\n• Front-matter alerts are placed by the field's position.\r\n• URLs in code comments and RST are treated consistently.\r\n\r\n## Changelog\r\n\r\n• e109c062 fix：keep a URL out of prose in code comments and RST\r\n• 79a48752 feat：let a scope negate an inline element\r\n• cf161663 perf：convert a run's DITA files in one toolkit run\r\n• 68e022b4 feat：apply ignore patterns to DITA\r\n• f41bebb6 fix：cover a promoted RST title with the comment region written above it\r\n• 18dd8632 fix：apply a vale-off region to a footnote written inside it\r\n• 9bcbf9f9 test：pin a vale-off region after front matter and import lines (#1073)\r\n• 344fd9b0 fix：locate a block's later matches in that block, not in a later copy of its text\r\n• ec7e5f01 feat：match a vocabulary phrase across a line wrap, read a period as text, and offer the term as a fix\r\n• 0194fbbd feat：suggest from the project's own words\r\n• 49422de5 fix(mdx)：lint a one-line element's text as prose, and keep alerts out of JSX tags\r\n• 5ab91a5d fix：place front-matter alerts by the field's position, not by searching the file\r\n• dcf7f18c fix(mdx)：end an expression at its brace, keep prose after it, and parse indented blocks\r\n• 8a9fd38e fix：keep the whitespace before an inline comment, so the words around it stay apart\r\n• 7c61ce4f perf：bound the inline-markup lookahead by byte length, not a rune count of the whole context\r\n• 1e730195 fix：read a notebook cell's source with a tagless switch,\r\n• 9e661060 feat：let a section name its own vocabularies\r\n• fc513c5f perf：share a loaded dictionary across spelling rules, and take the regexp2 fold fix\r\n• f2785853 feat：lint a Vale rule by its message and description, not its patterns\r\n• 85992f2a feat：let a spelling rule split identifiers and check their parts\r\n• cb5885f4 feat：suggest in Hunspell's order, and score suggestions against its fixtures\r\n• 52094c78 fix：read affix headers with trailing fields, escaped slashes, any-script digits, and Turkic casing\r\n• 17417ac4 feat：honor `IGNORE`, convert input by the longest `ICONV` rule inside spell, and read ß as SS in all-caps under `CHECKSHARPS`\r\n• a4e2853d fix：read a `COMPOUNDRULE` as flags and operators, quote its words, and match a capitalized word lower-cased\r\n• bfd0b420 perf：resolve affixed words lazily from roots, and read dictionaries as Hunspell does: per SET, byte flags without FLAG, literal hyphens in classes\r\n• 06325d94 feat：adopt Hunspell's case model, and keep ignore-list words case-lenient\r\n• 54520592 feat：pass Hunspell's German compounding fixtures: `CHECKCOMPOUNDREP`, `COMPOUNDWORDMAX`, prefix strips, and circumfix pairing across levels\r\n• a770129c feat：apply `CHECKCOMPOUNDPATTERN`, with replacements, and keep an `ONLYINCOMPOUND` suffix off a compound's end\r\n• f1435080 feat：check compound position flags, permit and forbid flags, `ONLYINCOMPOUND`, `FORCEUCASE`, and word pairs\r\n• f9178fb7 feat：check compound boundaries, apply Hunspell's default BREAK rules, and forbid words per homonym\r\n• 25d8fbc7 test：run Hunspell's own fixtures as a conformance suite\r\n• c2d62437 feat：let an empty `BasedOnStyles` reset a file's inherited rule settings, and add `UNSET`\r\n• 6c2d99d9 feat：let a formats key name a file or a glob, not only an extension\r\n• 62d47db9 fix：accept the upper-cased form of a capitalized entry, and suggest in the word's case\r\n• f8ded8dd feat：let a caller observe each block and time each rule\r\n• cd86a3c6 perf：segment a file only when a sentence-scoped rule runs on it\r\n• cf649e6e chore：add commit msg hook\r\n• 2c3aa804 fix：`hasCaptureGroup` logic"
