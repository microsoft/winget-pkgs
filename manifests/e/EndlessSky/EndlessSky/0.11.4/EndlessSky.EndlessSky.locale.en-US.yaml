ReleaseNotes: "This is a stable release, focused on fixing bugs and making some other small improvements.\n\nBreaking changes:\n• A definition for an interface that has been previously loaded now adds to the previous definition instead of clearing it by default.\n\nBug fixes:\n• Fixed mission NPCs with cloaking devices remaining perpetually cloaked, using up all their fuel and making escort missions impossible to complete.\n• Externally docked fighters will no longer be drawn with engine flares and will use the carrier's cloak state.\n• Fixed various issues with the new Ka'het and Successor missions.\n  • Return to Meligara in the Ritilas system to continue the new Ka'het missions.\n  • The \"Destroy sensor probes\" mission from the Successors will clear itself from your active missions the next time you land on Qasa-Sija-Iri.\n• Fixed a potential soft-lock that could occur when giving the Unfettered the jump drive on your flagship when you have no other drives installed and there is no outfitter on the planet.\n\nContent and features:\n• Weapons that only have negative damage values will no longer provoke ships they hit.\n• While in the outfitter, it is no longer possible to move an outfit to cargo if it is larger than any single cargo hold from the available ships in your fleet.\n• Adjusted how play time is tracked. The game now tracks time per-pilot and globally instead of just per-save file. Time spent with the game open but without the game window in focus is now tracked separately as idle play time.\n• Added a button to the trading panel to move all outfits from cargo to storage.\n\nFor a complete list of changes, as well as further detail about the summarized changes, see the [changelog](https://github.com/endless-sky/endless-sky/blob/master/changelog). Special thanks to everyone who contributed to this release：@Amazinite, @beccabunny, @BobbyCobby, @brendanjones, @Daeridanii1, @goran-damjanovic, @LixiChronikouOriou, @papatonyhill, @Quantumshark, @Tern, @TheGiraffe3, @TomGoodIdea, @warp-core\n\nIf you are using the high-dpi plugin, you should download and install the [updated version](https://github.com/endless-sky/endless-sky-high-dpi/releases/tag/v0.11.4) that goes with this release.\n\n![patir b](https://github.com/user-attachments/assets/ef45f785-2245-45c3-a964-7a9d47254007)"
