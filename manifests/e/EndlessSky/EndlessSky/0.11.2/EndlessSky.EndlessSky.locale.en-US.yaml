ReleaseNotes: "This is a stable release, focused on fixing bugs and making some other small improvements.\r\n\r\nSome of the notable changes are:\r\n• Pacifist worlds in human space that do not offer tribute now have their own set of responses when it is demanded, as opposed to responding as if your combat rating is not high enough yet.\r\n• The player's cloak state will now persist in the save file. This means that if you land while cloaked, close, and reopen the game, you will still be cloaked when taking off, which was already the behavior if you landed while cloaked and then departed without having closed the game.\r\n• The shop UI now has a dropdown for selecting the number of items to buy, sell, or move.\r\n• Added a setting for globally modifying text alignment in paragraphs.\r\n\r\nAnd, some of the fixed bugs:\r\n• Using the \"Reload\" button in the main menu after dying no longer crashes.\r\n• The Successor wormhole can now be used when hostile to the Successors.\r\n• Various fixes and improvements to mouse controls when the \"Control ship with mouse\" preference is on.\r\n• Moved the planet description in the map panel down a little so it no longer overlaps with the system name when the game window is small.\r\n\r\nFor a complete list of changes, as well as further detail about the summarized changes, see the [changelog](https://github.com/endless-sky/endless-sky/blob/master/changelog). Special thanks to everyone who contributed to this release：@Amazinite, @apttie, @Daeridanii1, @Daniilik, @kaiboyjiang, @knarrff, @LazerLit, @mOctave, @RedTechGamer236, @thewierdnut, @ThrawnCA, @TomGoodIdea, and @warp-core.\r\n\r\nIf you are using the high-dpi plugin, you should download and install the [updated version](https://github.com/endless-sky/endless-sky-high-dpi/releases/tag/v0.11.2) that goes with this release.\r\n\r\n<img width=\"800\" height=\"400\" alt=\"image\" src=\"https://github.com/user-attachments/assets/084a2075-cc5b-4000-a043-a0e0157ae0ca\" />"
