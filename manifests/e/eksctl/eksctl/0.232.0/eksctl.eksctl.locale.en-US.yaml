ReleaseNotes: "## 🚀 Features\n  \n• Add elasticLoadBalancing to kubernetesNetworkConfig (#8909)\n• Add --cfn-disable-termination-protection flag to opt out of CloudForm… (#8900)\n\n## 🎯 Improvements\n\n• Scope IRSA trust for EBS/EFS CSI add-on roles to the add-on service account (#8924)\n• Add get and list secrets permissions to emr-containers role (#8915)\n• Use the EKS default Kubernetes version when --version is not set (#8905)\n\n## 🐛 Bug Fixes\n\n• Scope IRSA trust for EBS/EFS CSI add-on roles to the add-on service account (#8924)\n\n## 🧰 Maintenance\n\n• Fix/integration test failures (#8926)\n• Update coredns (#8883)\n• Remove go.mod replace pins and apply blocked dependency updates (#8918)\n• test：disable self-registration on the identity provider test's Cognito user pool (#8914)\n\n## Acknowledgments\n\nThe eksctl maintainers would like to sincerely thank @DerekFrank, @jupdec, @knottnt, @kprahulraj, @naclonts, @sapphirew, @siddharthkhialani, @michaelbeaumont, @rhaowang and Siddharth Khialani."
