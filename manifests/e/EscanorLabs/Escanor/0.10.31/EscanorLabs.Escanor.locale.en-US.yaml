ShortDescription: Desktop assistant for developers that watches your apps and helps fix what breaks.
Description: |-
  Escanor keeps your apps up. When a build or deploy breaks, it tells you what broke and why. After you approve, it fixes the problem on GitHub, Vercel, Netlify, Render or Google Cloud Run, checks the fix and shows you the proof.
  It runs on the AI you already use: your own Claude Code or Codex on this computer, or your own AI key. A code editor and terminal are in the same window, and your chats follow you between this computer and the Escanor phone app.
