ShortDescription: Mail app with instant local search for any IMAP mailbox, plus a command line.
Description: |-
  Ragdoll Mail keeps a full-text index of your IMAP mailbox on your own computer, so search
  answers at once, in Chinese and English, even when the mail server's own search is slow
  or misses words. It reads, replies, forwards and sends, and its command line lets scripts
  and AI agents search and draft mail. Nothing is sent without a person saying yes.
