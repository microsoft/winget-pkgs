ShortDescription: "Free desktop email for every account: Gmail, Outlook, Yahoo, iCloud, Zoho and IMAP in one window."
Description: |-
  Zackem is a free desktop email app with unlimited accounts. Gmail, Microsoft 365, Outlook.com, Yahoo, iCloud, Zoho and any IMAP account are shown together in one window or one at a time, and replies go out from the account the email came to.
  Your mail stays with your provider and on your own computer; Zackem runs no mail servers. Search works offline across every account. Optional AI (reply with AI, summaries, plain-language search) uses Zackem AI tokens or your own Claude, ChatGPT or Gemini account.
