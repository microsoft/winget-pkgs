ReleaseNotes: |-
  Bug fixes:
  - IDE integrations did not work on macOS if the JProfiler MCP server was running
  - IDE integrations: The connection between JProfiler and the IDE could be lost, for example, when macOS App Nap was active
  - VS Code integration: Fixed window activation with current Visual Studio Code versions on macOS
  - VS Code integration: Fixed profiling launches with string VM arguments and debug session cancellation during startup
  - VS Code integration: Fixed various source navigation problems, including lambdas compiled with Java 24+, generic types, multi-root workspaces and multi-release JARs
  - VS Code integration: Automatic JProfiler discovery through the PATH environment variable did not work on Linux
  - Fixed source navigation for proxy classes
  - AI probe: langchain4j embedding models that implement the EmbeddingModel interface with default methods, such as the OpenAiEmbeddingModel, were not intercepted
  - CPU profiling did not work for threads that were started before the VM initialization phase, for example, by other native agents
  - On Java 27, the internal "Master-Poller" system threads were not ignored in the CPU views
  - Fixed a race condition in the profiling agent when recording monitors
  - An error in a telemetry, for example, in a JMX telemetry, could stop all further telemetry recording
  - GC probe: The GC-specific flags for the parallel garbage collector were not shown correctly in the "GC flags" view
  - JavaScript origin tracking: The connection between the "JProfiler Origin Tracker" Chrome extension and the JProfiler UI could be lost after a period of inactivity
