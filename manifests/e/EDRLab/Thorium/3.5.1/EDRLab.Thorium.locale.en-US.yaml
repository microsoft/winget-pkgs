ReleaseNotes: |-
  Thorium Desktop reader version 3.5.1 was published on 02 September 2026.

  Here are links to the "technical" changelogs:
  - https://github.com/edrlab/thorium-reader/blob/develop/changelogs/CHANGELOG-v3.5.1.md
  - https://github.com/edrlab/thorium-reader/compare/v3.5.0...v3.5.1
  User-friendly release notes and a blog post are published on the https://www.thoriumreader.com website.
  Expand the 'Assets' section below to reveal the download links.
  - Note that the terms x64 and amd64 in the filenames refer to the Intel computer architecture (also sometimes known as x86_64, which includes both Intel and AMD chipsets).
  - The term arm64 refers to modern ARM hardware including Apple Silicon "M" computers.
  If in doubt:
  - Apple users should download the arm64 variant.
  - Windows / Linux users should download the x64 / amd64 variants, respectively.
  The application was built automatically on GitHub (Microsoft) servers. The build was recorded here:
  https://github.com/edrlab/thorium-reader/actions/runs/33608586429
