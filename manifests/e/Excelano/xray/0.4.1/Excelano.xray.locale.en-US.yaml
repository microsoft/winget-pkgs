  ## Install x-ray 0.4.1

  ### Install prebuilt binaries via shell script

  ```sh
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/excelano/xray/releases/download/v0.4.1/x-ray-installer.sh | sh
  ```

  ### Install prebuilt binaries via powershell script

  ```sh
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/excelano/xray/releases/download/v0.4.1/x-ray-installer.ps1 | iex"
  ```

  ### Install prebuilt binaries via Homebrew

  ```sh
  brew install excelano/tap/xray
  ```

