ReleaseNotes: |-
  - j with one address leaves the current line where it was
  - g/re/d leaves the line after the last deletion current
  - A delimiter that is not one ASCII byte is an error, not a panic
  - A UTF-8 file containing +ACI- can be saved in place
  - -s prints only what the commands ask for
  - End of input on a modified buffer warns, as q does
  - Exit nonzero when any command failed
  - A replacement of % alone repeats the previous replacement
  - s takes a count and p, l or n, and rejects any other suffix
  - s without its closing delimiter replaces to the end of the line
  - s///g anchors ^ once and skips an empty match after a real one
  - An escaped delimiter in s, g and v is the literal character
  - 0a appends at the top, and a or i past the end is an error
  - g and v mark lines, not line numbers
  - Keep CRLF line endings when a file is saved
  - Help lists every command, with the right default addresses
  - e warns before discarding a modified buffer, and a failed e keeps it
  - write, edit and read long forms, and no filename glued to w, e or r
  - wq writes the file and quits
  - Declares rust-version 1.88, so Cargo on an older toolchain says so instead of failing to compile
  - On macOS, install and upgrade with cargo install ved; the Homebrew formula and macOS downloads are retired
