ShortDescription: 'Attaches metadata to a file: a .slpc container holds the payload and its TOML description together'
Description: 'slipcase attaches metadata to a file without changing it. A .slpc container is a ZIP archive holding one payload file of any type together with a TOML document describing it, so that copying, moving, or sending the payload carries its metadata along. Five verbs: pack, unpack, repack, info, and validate. The format is specified independently of this tool, and ordinary ZIP utilities can read a container without it. This is the command-line tool; Slipcase Desktop is a separate application for the same containers.'
