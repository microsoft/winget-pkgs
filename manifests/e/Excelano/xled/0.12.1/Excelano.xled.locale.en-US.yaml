  ```sh
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/excelano/xled/releases/download/v0.12.1/xled-installer.ps1 | iex"
  ```

  ### Install prebuilt binaries via Homebrew

  ```sh
  brew install excelano/tap/xled
  ```

