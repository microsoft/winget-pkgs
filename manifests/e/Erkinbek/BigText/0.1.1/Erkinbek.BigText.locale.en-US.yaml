ShortDescription: Fast text editor for huge files (1-50+ GB) that never freezes.
Description: |-
  BigText opens, searches and edits text and log files of any size - 1 GB, 10 GB, 50 GB and more - without loading them into memory.
  The first screen of a 50 GB file appears in about 40 ms, plain-text and regex search run at 2.4-2.8 GB/s, and a 50 GB file uses about 107 MB of RAM.
  It supports replace across gigabytes, undo/redo, crash-safe atomic saving, UTF-8/UTF-16/Windows-1251/1252 encodings, a hex view, follow (tail) mode, syntax highlighting for logs, JSON, XML, CSV, SQL and INI, bookmarks, a split view and comparing huge files.
