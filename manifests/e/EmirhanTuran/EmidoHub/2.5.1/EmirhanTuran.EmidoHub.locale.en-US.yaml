ShortDescription: Free wireless file & photo transfer (iPhone/Android to PC), 60 FPS AirPlay screen mirroring, MP4 screen recorder, shared clipboard, and PC remote.
Description: |-
  Emido Hub is a 100% free, ad-free, offline-first wireless bridge between iPhone (iOS) / Android devices and Windows 10/11 computers.
  Connect instantaneously by scanning a QR code with your phone camera—no mobile app installation or cloud account required:
  - Bi-directional wireless file, folder, and 4K video transfer with optional local HEIC-to-JPG smart conversion
  - Built-in 60 FPS AirPlay screen mirroring receiver and watermark-free MP4 screen recorder
  - Universal shared clipboard for text, URLs, and screenshots
  - Wireless multi-touch PC trackpad, keyboard, media remote, and live document scanner camera
  - One-click Secure Tunnel QR fallback for restricted office, hotel, or university Wi-Fi networks
