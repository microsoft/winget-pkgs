ShortDescription: Free app that explains your YouTube channel statistics in plain language.
Description: |-
  Downloads your channel data through the YouTube Data and YouTube Analytics APIs with read-only access; it cannot change anything on your channel.
  Compares views, watch time, subscribers and engagement with the previous period, grades every video A-D against your own channel's videos and turns the data into concrete recommendations.
  Creates an Excel report you can filter and sort and a one-page PDF summary. Your data stays on your computer. Connects through a Google Cloud project you create yourself (one-time setup). Light and dark theme, 8 languages.
