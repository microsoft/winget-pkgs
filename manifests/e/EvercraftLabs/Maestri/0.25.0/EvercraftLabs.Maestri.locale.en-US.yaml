ReleaseNotes: |-
  What's New in Maestri 0.25.0
  New
  - Click or right-click a connection rope to focus either end or cut it. Connection ropes tangled under the click each get a row, and connection ropes to other floors and workspaces are named and can be cut there.
  - Drop a connection rope on a file to turn it into a note holding the file, on the canvas or from Maestri Remote.
  - Right-click a link in Maestri Chat or a note to copy its URL.
  - An image pasted or dropped with no file behind it is named Attached image.
  - Notes and portals an agent adds can go in free space instead of stacking, set in Settings > General > New Element Defaults.
  - Settings in the usage popover opens Settings > Agents > Usage.
  - The floor overview menu offers Copy Branch Name, Copy Path and Show in Explorer.
  - Agents can hand files to a page's file chooser in a portal.
  - Maestri Remote shows a note's images and takes pasted ones.
  Fixed
  - Copy Path on a floor copies the floor's own folder.
  - A file dropped into a note lands only in the note.
  - Empty or unreadable folders in the file tree no longer show an expand arrow.
  - A duplicated terminal shows its copied chat right away.
