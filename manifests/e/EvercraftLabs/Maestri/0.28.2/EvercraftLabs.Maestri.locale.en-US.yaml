ReleaseNotes: |-
  What's New in Maestri 0.28.2
  - Improved: floors in WSL workspaces now offer repository isolation, with worktrees made by the distro's own git.
  - Improved: images sent from Prompt Composer arrive together with your text, even large ones.
  - Improved: clicking a floor notification opens its workspace.
  - Improved: agents creating a floor in a large repository now wait for it to be ready.
