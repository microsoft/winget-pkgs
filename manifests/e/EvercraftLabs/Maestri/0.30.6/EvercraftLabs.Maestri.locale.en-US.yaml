ReleaseNotes: |-
  What's New in Maestri 0.30.6
  Improved
  - A long reply in chat scrolls into view as it arrives, until the message it answers reaches the top.
  - A message you send moves the conversation up smoothly as its bubble flies in, and lands fully in view.
  Fixed
  - Pictures whose path has a space or a parenthesis show in chats and notes.
  - A folder typed as ~ or starting with ~/ in New Workspace or Edit Workspace points to your home folder, including in workspaces you already saved that way.
  - A window minimized on one display comes back on that display.
