ReleaseNotes: |-
  What's New in Maestri 0.25.2
  New
  - Copy and paste on Android device portals: Ctrl+V types your clipboard into the device, and Ctrl+C copies the device's selected text back to your clipboard on emulators.
  Updated
  - Files you drop on the canvas or into a note are now linked where they are instead of copied into the workspace. Turn on Settings > Attachments > "Always copy files to workspace" to keep copying them, or use "Save in Maestri" on a linked file to copy just that one.
  - Settings now closes only with ✕ or Escape, so closing a menu inside it no longer closes Settings too.
  - When an agent account can't start on Windows, Maestri now says why: a script found first on PATH, a program that couldn't run, or a check that took too long.
  - Landing a floor now says when nothing was merged, and still reports what the land did when the floor can't be removed afterward.
  Fixed
  - Taps on foldable Android devices now land where you aim, and the portal no longer shows black bars around the screen.
  - Design on an Android device portal captures the screen more reliably.
  - A chat thread preview no longer stays open after you switch to another window.
  - Removing a floor while something is still writing to its folder no longer leaves it half emptied.
