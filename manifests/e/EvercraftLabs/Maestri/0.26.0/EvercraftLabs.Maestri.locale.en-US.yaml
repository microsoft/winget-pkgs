ReleaseNotes: |-
  What's New in Maestri 0.26.0
  Some are making noise with Dots and Bots. In Maestri, you start bands. And run the festival. 🎸
  New
  - Bands: select terminals and right-click Create Band, or right-click a terminal and choose Add to Band, to group agents into one node with a member list beside the live terminal of the member it shows. Drag a member to reorder it, out onto the canvas or straight into another band, and right-click the band to edit its name, icon and color, dissolve it or delete it with or without its terminals.
  - A band connects as one: a rope to a band reaches every member, and messages between members fly across its list.
  - Agents create and manage bands with maestri band and recruit --band, on any floor or workspace they reach, and maestri list shows each band with its members.
  - Agents give things a look with maestri arrange: a new name, an emoji icon or a color, for themselves, a Maestro's teammates and bands, and any unlocked note they reach. recruit, note create and band create take --icon and --color too.
  - A video sent or handed over in chat plays in place.
  Updated
  - Any agent can send you a notification with maestri notify, and @Notifications is in every agent's prompt composer.
  - maestri connect finds agents, bands, notes, fichários and portals by name, and no longer fails when they are already connected.
  - Drawing or cutting a rope to another workspace can be undone as one step.
  - Partitura previews show terminals, bands, notes and other nodes as they look on the canvas.
  Fixed
  - On Linux, a file you create or rename in the file tree can take any name the filesystem accepts.
