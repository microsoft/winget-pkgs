ReleaseNotes: |-
  What's New in Maestri 0.30.0
  New
  - Computer Use lets an agent in a Maestri terminal use other apps on your computer: read windows, click, type and choose menu items. Turn on Let agents use other apps in Settings > Agents > Control.
  - Each agent asks first for each app with Allow, Allow for 1 Hour or Don't Allow, with Stop and Revoke, and Bypass Permissions in Settings. Maestri itself is off limits.
  - Agents work in the background with your window in front and your keyboard left to you, several at once, each with a cursor showing its name.
  - From behind other windows, agents use a web browser, reading pages, clicking and filling forms, and select, delete, copy and paste in File Explorer.
  - Control mode, asked for separately, uses your real pointer and keyboard for what the background can't reach. Moving the mouse or typing pauses it, and pressing Escape three times stops it.
  - Agents in WSL and SSH terminals use the apps on the machine running Maestri.
  - Canvases and games, such as Paint, need control mode.
  Improved
  - Links in notes and chat keep the color of the text around them, with a full underline.
  Fixed
  - Fixed an issue where dragging in the minimap near an edge moved the view further and further out.
  - Fixed an issue where jumping to a terminal or workspace with 1-9 didn't work on keyboard layouts whose number row doesn't type digits.
