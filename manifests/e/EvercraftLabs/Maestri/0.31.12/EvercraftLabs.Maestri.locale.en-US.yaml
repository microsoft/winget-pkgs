ReleaseNotes: |-
  What's New in Maestri 0.31.12
  New in 0.31.12
  - In Batuta Search, Check and Ask reach the terminals on your other online computers, and Ask shows the chat when the terminal shows one.
  - Batuta Search offers Workspace Elements and All Elements, with the elements of your other computers.
  - Pasting into another computer's terminal uploads your copied files and pictures to that computer.
  - Pasting copied files into a terminal types their paths, as Linux paths in a WSL terminal.
  - Settings > About shows the build number beside the version.
  Updated in 0.31.12
  - A Maestri Box update is available: Update Now is in the Box's space popover and in Settings > Wire > Devices.
  - A terminal another computer creates on this one opens at this computer's default terminal size.
  - A band member you pick on another computer's canvas stays in front, also after switching workspaces or spaces.
  - The band toolbar's delete button reads Delete Active Terminal.
  - The delete shortcut deletes a selected file tree while its editor has focus.
  Fixed in 0.31.12
  - Clicks from another computer or an agent reach a frame from another site in a portal, such as a reCAPTCHA checkbox.
