ReleaseNotes: |-
  What's New in Maestri 0.20.2
  The biggest upgrade to Maestri Floors yet: a whole team, working in parallel, without stepping on each other.
  Floors now follow your code onto SSH, Docker and custom runtime workspaces on Linux and Mac, they're real git worktrees, and they speak pull requests from start to finish: open one from a floor, follow it all the way to the merge, or review anyone's on a floor of its own.
  New
  - Works where your code lives: floors now run in SSH and Docker workspaces, created on that machine right next to your project and cloned copy-on-write where the disk supports it (btrfs, XFS, bcachefs).
  - Land it your way: merge locally and watch the floor's work fly home to Ground, or send it up as a pull request. Maestri pushes the branch and opens it through GitHub's or GitLab's own CLI with your existing login, no tokens to paste and nothing stored. It follows reviews, checks and conflicts, one click hands a fix to an agent on that floor, and when you merge from Maestri the floor lands itself.
  - Review anyone's pull request on a floor of its own: pick an open pull request or paste its link, and Maestri checks it out on a fresh floor, ready to run, test and hand to an agent for a first review. Pushes go to the pull request when it's in your repository, and pull requests from forks get a read-only copy, so nothing lands in the wrong place.
  - Always know where things stand: floors now live in the sidebar, and agents post a status as they work (working, blocked, ready for review, done) with progress you can see at a glance. When a floor needs you, Maestri lets you know.
  - Hand off in one line: type @New Floor in a Maestro's composer and describe the task. Maestri creates the floor, staffs it with an agent and gets to work.
  - From your pocket: Maestri Remote now shows every floor with its status and pull request, and lets you create floors, review pull requests, merge, and send fixes to agents from wherever you are.
  - Your host, your rules: GitHub and GitLab work out of the box. Anything else is a small JSON file in your providers folder, with a guide written for you and your agents.
  Fixed
  - A new floor of a project with git submodules has its submodules checked out and ready to build, in local and remote workspaces.
  - An agent recruited into another workspace with maestri recruit --workspace appears in maestri list and answers maestri ask.
  - Unloading a workspace, deleting a workspace or quitting Maestri closes its terminals one at a time.
  - The usage meter never opens a sign-in page for a signed-out CLI running in WSL.
  - A tmux terminal never opens in the folder of a removed floor.
  - Workspaces exported without chat history import again instead of being rejected as not a valid Maestri workspace.
  - The maestri CLI works again in tmux panes that outlived an earlier Maestri launch.
  - Claude Code agents reply in Maestri Chat even when a long message arrives as pasted content.
  - Long messages to Codex agents in a local terminal are submitted instead of left unsent in the prompt.
  - Two messages sent to the same agent at once both arrive, one after the other.
  - Every table in a long chat reply or note renders.
  - The Hooks popover keeps long commands inside it, shortened to fit.
