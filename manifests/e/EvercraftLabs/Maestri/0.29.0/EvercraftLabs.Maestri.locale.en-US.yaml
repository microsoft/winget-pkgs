ReleaseNotes: |-
  What's New in Maestri 0.29.0
  New
  - New Floor can base a floor on another repository inside the workspace's folder with Based on, or work in a folder you already have with Use an Existing Folder, in remote workspaces too.
  - Delete Floor can keep the floor's folder, and the sidebar names a floor's repository beside its branch.
  - Agents can do the same with maestri floor create --from or --dir, maestri floor set-dir and maestri floor delete --keep-folder.
  - Ctrl+T opens New Terminal, except inside a terminal, where the program running there keeps it.
  - Turn on Copy text on select in Settings > Terminal > Advanced to copy text you select in a terminal as soon as you release the mouse.
  Improved
  - Floor errors appear in the app's language, and error dialogs open with the reason instead of an internal message.
  Fixed
  - Fixed an issue where partituras lost their connections. A partitura saved and not changed since gets them back; one edited, updated or exported in the previous three releases lost them and has to be recorded again.
  - Fixed an issue where Move File To could replace a note's text with an older version or leave the file empty, including when the note's own file was chosen.
  - Fixed an issue where a note could arrive empty in a partitura, a copy or a duplicate, and the New Partitura sheet listed a named note as untitled.
  - Fixed an issue where undo on the canvas could bring back older text in a note.
  - Fixed an issue where clicking a folder suggestion didn't fill the folder field.
  - Fixed an issue where triple-clicking a line in a terminal selected nothing when the canvas was zoomed.
  - Fixed an issue where a routine that couldn't be deleted said it couldn't be saved.
  - Fixed an issue where Open in VS Code from a WSL workspace didn't open the folder in VS Code's WSL mode.
  - Fixed an issue where agents running in PowerShell couldn't act on a portal's elements.
