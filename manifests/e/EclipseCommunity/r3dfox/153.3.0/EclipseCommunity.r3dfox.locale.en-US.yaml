ReleaseNotes: |-
  Now what is a -multi release you may ask? Well considering I disabled WebRTC in the last few release and Plasmafox builds and it caused multiple issues, I wanted to also build a release build with WebRTC enabled. However since I will not be doing 154+ (at least until e3k's rework catches up), I decided to rebuild all three brandings of builds, r3dfox, r3dfox ESR, and Plasmafox off of the ESR 153.3.0 source with WebRTC enabled. So if you wish to use all three brandings of browsers at the same time, you have them all up to date and with WebRTC enabled.
