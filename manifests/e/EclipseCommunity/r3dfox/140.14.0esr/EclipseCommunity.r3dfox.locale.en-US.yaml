ReleaseNotes: |-
  I'm pretty burnt out on everything but I was asked for this build and figured basic rebase why not. Except Mozilla removed GDI from ESR 140, and the bugzilla for it is restricted so idk why they did it. Because well GDI is big part of browser, I kept it for this build. They also did weird changes to image context menu items that conflicted with my changes and although I could see the bugzilla for it, I don't understand why they did it.
  Outside of that this is mostly just 140.11.0 patches rebased onto 140.14.0. I don't have the will to go through and port the later changes, especially so close to end of ESR 140 period. I did port a few easy things I saw though as I wanted new packager so I didn't need to repackage it.
