ShortDescription: Calculator for LED series resistors, blink circuits and constant current sources, with colour bands, schematic and step-by-step calculation.
Description: |-
  LedPreResistor works out the right series resistor for one or more LEDs. Enter the supply voltage, LED colour or forward voltage and the current you want. It picks the next higher standard value (E12, E24, E96) and shows the real current, power dissipation, suggested resistor rating, colour bands and a schematic with all values. A collapsible panel shows the calculation step by step.
  Further tabs calculate blink circuits (NE555, two-transistor multivibrator) and constant current sources (LM317, two transistors), also for a supply voltage range and several strings in parallel.
  Portable, English and German, open source.
