ShortDescription: Converts MP3 files into Traktor stem files (.stem.mp4) with drums, bass, other and vocals.
Description: |-
  StemMaker is a free, open-source Windows tool that splits MP3 files into four stems (drums, bass, other, vocals) using demucs and packs them into Traktor-compatible .stem.mp4 files.
  It runs locally on the CPU, supports batch conversion and comes with the StemPlayer add-on to check the result.
  On first start it downloads ffmpeg and the demucs AI model (SHA-256 checked) from their original sources.
