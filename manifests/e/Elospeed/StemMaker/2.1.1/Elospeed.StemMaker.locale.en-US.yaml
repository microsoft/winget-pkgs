ShortDescription: Converts your music (MP3, WAV, FLAC and more) into stem files (.stem.mp4) for Traktor and Mixxx.
Description: |-
  StemMaker is a free, open-source Windows tool that splits music files into four stems (drums, bass, other, vocals) using the Demucs model and packs them into .stem.mp4 files for Traktor Pro 3/4 and Mixxx 2.6 (beta).
  Since 2.0 the Turbo engine (ONNX Runtime) runs 6 to 10 times faster on the CPU and uses the graphics card via DirectML when it helps. It supports batch conversion of whole folders and comes with two add-ons: StemPlayer to check the result and StemTagger to edit title, artist and cover of stem files.
  On first start it downloads ffmpeg and the Demucs AI model (SHA-256 checked) from their original sources.
