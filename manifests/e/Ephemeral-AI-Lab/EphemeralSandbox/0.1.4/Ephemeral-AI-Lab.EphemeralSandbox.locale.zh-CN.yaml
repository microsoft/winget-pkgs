ShortDescription: 面向并行编码智能体的开源智能体沙箱基础设施。
Description: |-
  Ephemeral Sandbox 是面向多编码智能体团队的开源智能体沙箱基础设施。它不会让所有智能体共享同一个可写检出，而是在共享、不可变的层栈（LayerStack）之上，为每个智能体创建独立的写时复制工作区会话。命令在由持有者管理的 Linux 命名空间中运行，因此会话的文件系统和进程边界可以跨多次操作保持稳定。工作完成后，系统会把会话与最新共享头部进行比较，逐路径解决更改，并将结果作为一个原子层发布；如果更改集不能被接受，则不会发布任何内容。
  运维人员可以通过独立的 CLI、MCP 和可观测性接口检查命令、文件活动、资源使用情况和逐行归因。它适用于需要并行执行，同时保持隔离、可审查性和明确成果晋升流程的本地或 Docker 多智能体工作流。
