ReleaseNotes: |-
  1.5.3
  中文
  1.5.3 是一次小更新，重点照顾章数多和有坏生成记录的书：能打开、能导出备份，打开、导出和定稿都快了很多。出错时提示会说清真实原因和能怎么办，多数提示不再露出错误码或英文原文。设置和安装位置不变。用 1.5.3 打开过的作品会升级作品数据，之后 1.5.0 及更早版本打不开它，也恢复不了 1.5.3 导出的存档。
  长篇与坏记录的书：
  - 有读不出的 AI 生成记录的书照常能打开，并提示一次：正文没有受影响，这几条记录已停用，对应的生成不能继续或重试。
  - 某一章的审稿或修稿记录坏了，一般不再挡住升级、导出本地存档和云备份。坏记录不放进存档，能对上章节时提示写明是哪一章。
  - 章名带「？」「：」等标点的书，能导出本地存档、云备份和恢复副本。修稿写到输出上限后接着续写的章节，也不再让导出失败。
  - 作品文件夹里有 desktop.ini、Thumbs.db、.DS_Store，或有没归到任何角色的坏头像时，导出照常完成，这些文件不进存档。
  - 长篇也能开 AI 审稿，前文和设定不再算进审稿的大小上限。
  - 从备份恢复的书里，恢复前的审稿直接给出「重新审稿」，并说明原因。
  速度：
  - 导出本地存档和云备份移到后台，期间可以继续写，改动不进这次存档。导出按阶段显示进度，长篇导出快了很多。
  - 点「确认定稿」后立刻定稿。推理强度为「自动」或「关闭」且服务商支持时，定稿后整理要点和角色状态不让模型思考，下一章能更快开写。
  - 长篇打开时的升级和检查移到后台，超过半秒会提示「正在打开作品…」。老书第一次在新版打开要升级和整理旧记录，会更久，之后打开、预览、导出都更快。
  - Windows 上读写作品文件的每一步不再要等一两秒，点「写作此章」后更快发出请求。
  报错说清原因：
  - 打开作品失败时，分别说明作品文件损坏、被别的程序占用、没有权限或文件是空的，损坏时指向「项目备份」里的「从本地存档恢复副本」。
  - 书童被强制退出后马上重开，或打开时又点了这本书的封面，作品一般照常打开，打不开时说明原因。
  - 删除作品时有文件被别的程序占用，约 2 秒就说明原因，不再干等几分钟。新建失败也说明原因。
  - 导出、恢复副本和云备份失败时说清原因，例如文件不是完整存档、来自更新版本或磁盘满了，并给出下一步。
  - 启动时数据文件夹写不进去或磁盘满，启动页照实说明，不再说成外观偏好没加载。
  - 生成时网络出问题，提示分别说明是没连上模型服务、连接中途断了，还是连不上设置的代理。
  - 在「小说拆解与仿写…」里导入失败时，提示分别说明是文件不是 UTF-8 编码、单个文件超过 64 MB、系统不让打开，还是正被别的程序占用，并给出办法。
  - 大纲生成停下、恢复稿依据的内容改过、定稿后处理失败、知识库出错时都说明原因。其余报错显示通用说明，不露错误码。
  网络代理与连接：
  - 「网络代理」以前没有生效。现在开启后，模型请求、检索和云备份都经过代理，本机模型仍直连。以前开着「启用代理」却没开代理软件的，升级后会连不上。模型地址是 http:// 开头的非本机地址时，代理能看到 API Key。
  - 代理连不上或主机名查不到时，提示说明问题在代理，请检查主机地址和端口，或关掉「启用代理」。主机地址带 http:// 时不能保存。
  - 「测试连接」和「检查并重建向量索引」连不上时，按网络失败的原因说明，不再只显示 fetch failed。
  角色与人物状态：
  - 角色卡不再限 8 张。生成架构的角色名单没有上限，设定里点名的人物都会列入。导入原稿时其余人物分批补卡。
  - 定稿正文写两人回到你设定的关系时，例如「盟友」写成「冰释前嫌的盟友」，不再多出建议卡和冲突提示。
  - 审稿和修稿按被审的那一章读人物状态，指定从后面某章起生效的状态不会提前交给模型。
  设定与蓝图：
  - 设定页的基本设定和设定细则排到核心大纲之上，全部直接可改，不再收进「更多设定」。设定细则每行标出未填、AI 填写或 AI 扩写。
  - 蓝图页单章各栏随内容长高，不用在小框里滚动。章节要点按排版显示，点「编辑章节要点」才改原文。
  - 大纲逐章生成停在某一章时，恢复稿里只有写好的章节，被拒的回复放进「原始候选」。打开恢复稿直接「保存恢复大纲」，再「继续生成缺少的章节」就能接着写。
  正文编辑：
  - 选中正文续写、扩写时，模型能看到本章蓝图、人物、线索和选区前后的正文。续写结果插在选区之后，不再替换选区，并尽量不和后文矛盾或重复。设定文档里的续写照原文体裁写。
  - 修稿合并里逐段选的「用修稿」和手改的段落，离开这一章再回来或「稍后再合并」后都保留，「完成合并」按你的选择写入。
  请从本页下载 Windows x64、macOS Apple Silicon 或 macOS Intel 安装包。已安装旧版本的用户会在应用内收到更新提示；macOS 上提示会打开本页，需要手动下载新的安装包。
  Windows 安装包未签名。Mac 安装包使用 ad-hoc 签名，未获 Developer ID 签名和 Apple 公证。系统可能提示未知发布者或阻止打开。
  English
  1.5.3 is a small update for books with many chapters and books with damaged generation records. These books open and export, and opening, export, and finalization are much faster. Error messages now give the real cause and what you can do, and most no longer show error codes or raw English system text. Settings and the install location are unchanged. When 1.5.3 opens a project, it upgrades the project data. After that, 1.5.0 and earlier cannot open the project, and they cannot restore archives exported from 1.5.3.
  Long books and damaged records:
  - A book with AI generation records that cannot be read still opens, and a one-time notice says the chapter text is not affected and those records are disabled, so their generations cannot continue or retry.
  - A damaged review or refinement record in one chapter usually no longer blocks upgrade, Export local archive, or cloud backup. The damaged record stays out of the archive, and the notice names the chapter when it can be matched.
  - Books whose chapter titles contain punctuation such as ？ or ： can be exported, backed up to the cloud, and restored as a copy. A chapter whose refinement continued past the output limit no longer makes export fail.
  - If the project folder contains desktop.ini, Thumbs.db, or .DS_Store, or a damaged avatar that belongs to no character, export still finishes and leaves those files out of the archive.
  - Long books can run AI review. Earlier chapters and settings no longer count toward the review size limit.
  - In a book restored from a backup, a review made before the restore offers Review again and explains why.
  Speed:
  - Export local archive and cloud backup run in the background, so you can keep writing. Changes made meanwhile are not in that archive. Export shows its progress by stage, and long books export much faster.
  - Finalize now takes effect at once. When reasoning effort is Auto or Off and the provider supports it, the chapter notes and character-state updates after finalization run without model thinking, so you can start the next chapter sooner.
  - Long books upgrade and check in the background when they open. If opening takes more than half a second, the notice Opening the book… appears. The first open of an older book in this version upgrades it and tidies old records, so it takes longer. After that, opening, preview, and export are faster.
  - On Windows, each project file read or write no longer waits a second or two, so Write this chapter sends its request sooner.
  Error messages with real causes:
  - When a book fails to open, the message says whether the project file is damaged, held by another program, not permitted, or empty. For a damaged file, it points to Restore a copy from local archive under Project backup.
  - If you reopen Pagekin right after it was force-quit, or select the book's cover while it opens, the book usually still opens. If it cannot, the message explains why.
  - If another program holds a file when you delete a book, the message explains the cause in about 2 seconds instead of after minutes of waiting. A failed new book also explains the cause.
  - When export, Restore a copy from local archive, or cloud backup fails, the message gives the cause, for example a file that is not a complete archive, an archive from a newer version, or a full disk, and then the next step.
  - If the data folder cannot be written or the disk is full at startup, the startup page says so instead of blaming appearance preferences.
  - When generation hits a network problem, the message says whether the model service could not be reached, the connection broke off midway, or the proxy you set could not be reached.
  - When an import in Novel breakdown & imitation… fails, the message says whether the file is not UTF-8 text, a single file is over 64 MB, the system will not open it, or another program holds it, and then what to do.
  - Outline generation that stops, a recovery draft whose sources changed, a failed post-finalization step, and knowledge-base errors now explain the cause. Other errors show a general explanation instead of an error code.
  Network proxy and connections:
  - Network proxy had no effect before. When you turn it on, model requests, retrieval, and cloud backup go through the proxy. Local models still connect directly. If Use a proxy was on but no proxy software runs, requests fail after the update. If a model address starts with http:// and is not on this computer, the proxy can see your API key.
  - When the proxy cannot be reached or its host name cannot be found, the message says the problem is the proxy and asks you to check the host and port, or to turn off Use a proxy. You cannot save a host that starts with http://.
  - When Test connection or Check and rebuild vector index cannot connect, the message explains the network cause instead of only fetch failed.
  Characters and character states:
  - Character cards are no longer capped at 8. The character list from architecture generation has no upper limit and includes every character your setup names. When you import your own manuscript, the other characters get cards in batches.
  - When a final chapter brings two characters back to the relationship you set, for example 盟友 (allies) written as 冰释前嫌的盟友 (allies again after a quarrel), you no longer get an extra suggestion card or conflict notice.
  - Review and refinement read character states for the chapter under review. A state you set to start in a later chapter does not reach the model early.
  Setup and blueprints:
  - On the Setup page, Basics and Details sit above the Core outline and are all directly editable. They are no longer tucked behind More settings. Each row in Details shows Empty, AI-written, or AI-expanded.
  - On the Blueprint page, each chapter's fields grow with their content, so you do not scroll inside small boxes. Chapter notes show as formatted text, and Edit chapter notes switches to the raw text.
  - When chapter-by-chapter outline generation stops at a chapter, the recovery draft holds only the finished chapters, and the rejected reply moves to Original candidate. Open the recovery draft, select Save recovered outline, then Generate remaining chapters to continue.
  Chapter editing:
  - When you continue or expand selected text, the model sees this chapter's blueprint, characters, threads, and the text before and after the selection. Continued text goes after the selection instead of replacing it, and tries not to contradict or repeat what follows. Continuation in setup documents keeps the document's own style.
  - In the refinement merge view, the paragraphs you set to Revision and the paragraphs you edited by hand stay as they are when you leave the chapter and come back, or after Merge later. Finish merge writes your choices.
  Download a Windows x64, macOS Apple Silicon, or macOS Intel installer from this page. Users on an earlier version get an in-app update notice. On macOS, the notice opens this page, and you download the new installer manually.
  Windows installers are unsigned. Mac installers are ad-hoc signed, with no Developer ID signature or Apple notarization. Your system may show an unknown-publisher warning or block the app.
