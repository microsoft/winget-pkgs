ReleaseNotes: |-
  1.3.1
  中文
  1.3.1 起软件改名「书童」，英文名 Pagekin，原名「AI 小说作家」。这一版还修复了 1.3.0 发布后报告的一批问题。作品数据、设置和安装位置都不变。
  改名与新功能：
  - 窗口标题、书房、启动页和设置里的「关于与更新」改用书童 / Pagekin，并换上新的书页精灵标识和应用图标。关于页注明原名，方便认出这是同一个软件。
  - Windows 的开始菜单、桌面快捷方式和「应用和功能」显示「书童 Pagekin」。以前固定在任务栏上的旧图标升级后会失效，请取消固定，打开书童后重新固定一次。
  - macOS 上的应用名改为「书童」。把新的「书童」拖进「应用程序」后，旧的「AI 小说作家」会留在原处。作品和设置存放在应用之外，删除旧应用不影响它们。
  - 设置 → 写作 Skills 可以从本机导入：选择 Skill 文件夹或单个文件。SKILL.md 引用的文本文件会一起装入，检查卡列出并入和不会安装的文件。感谢 @qew4476 贡献最初的实现。
  - 设置的「常用」分组加入检索模型。AI 模型和检索模型标注「必需」，没有配置时显示「未配置」。
  修复：
  - 运行侧页切到「诊断」分页时，主区域不再被挤成一字一行。窗口不够宽时，侧页浮在内容区上方。
  - 「留作草稿，等我审稿」的批次写完后，改过前面某章再逐章定稿，之后继续写下一章不再保存失败。旧版本留下的已审稿稿件可以重新审稿、修稿，并作为前章继续写。
  - 生成失败时，运行卡片按界面语言说明原因，不再显示 Error invoking remote method 这类原始报错。
  - 情节大纲生成途中改了模型或设定时，会说明哪类来源变了、停在第几章，并给出「从第 N 章重新生成」。设置页保存一个正在被生成使用的模型前，会先确认。
  - 定稿后处理断流后，重试会重新请求模型。作者取消或总时长用尽的请求，在 AI 调用记录里记为已取消。运行侧页的 AI 调用记录现在包含主进程发出的全部请求。
  - 已写进正式大纲的批次不再列为可恢复。单章失败后再跑含这一章的批量创作，运行侧页仍列出它的恢复卡。
  - 架构页、大纲生成对话框、角色页、版本历史和启动页修复了十余处显示问题，包括只有序章的大纲、已删除稿件的提示、窄窗口下角色档案的排布。
  - 英文界面下，写稿、蓝图、角色卡等工作流的报错都显示英文；1024 宽窗口里角色名单页的按钮和下拉框完整显示。
  - 界面上的说明文字在浅色和深色下对比度都达到 WCAG AA 的 4.5:1。
  请从本页下载 Windows x64、macOS Apple Silicon 或 macOS Intel 安装包。已安装 1.1.0、1.2.x 或 1.3.0 的用户会在应用内收到更新提示；macOS 上提示会打开本页，需要手动下载新的安装包。
  Windows 安装包未签名。Mac 安装包使用 ad-hoc 签名，未获 Developer ID 签名和 Apple 公证。系统可能提示未知发布者或阻止打开。
  English
  Starting with 1.3.1, the app is renamed Pagekin (书童 in Chinese). Its former name was AI Novel Writer. This release also fixes a set of issues reported after 1.3.0. Project data, settings, and the install location are unchanged.
  Rename and new features:
  - The window title, library, startup screen, and Settings > About & updates use the Pagekin name, with a new page-sprite logo and app icon. The About page mentions the former name so you can recognize the app.
  - On Windows, the Start menu, desktop shortcut, and Apps & features show "书童 Pagekin". A taskbar pin from an earlier version stops working after the upgrade. Unpin it, open Pagekin, and pin it again.
  - On macOS, the app is now named 书童. After you drag the new app into Applications, the old AI 小说作家 app stays where it is. Projects and settings live outside the app, so deleting the old app does not affect them.
  - Settings > Writing skills can import from this computer. Choose a skill folder or a single file. Text files referenced by SKILL.md are installed with it, and the review card lists which files are bundled and which are not installed. Thanks to @qew4476 for the original implementation.
  - The Common settings group now includes Retrieval model. The AI models and Retrieval model pages are marked Required and show Not set until you configure them.
  Fixes:
  - Opening the Diagnostics tab in the run sheet no longer squeezes the main area into one character per line. When the window is narrow, the sheet floats over the content.
  - After a batch kept as drafts for review, editing an earlier chapter and then finalizing chapter by chapter no longer makes the next chapter fail to save. Reviewed drafts from older versions can be reviewed again, revised, and used as the previous chapter.
  - When generation fails, the run card explains the cause in the interface language instead of showing raw errors such as Error invoking remote method.
  - If the model or project setup changes while a plot outline is generating, the app says which source changed and where it stopped, and offers to regenerate from that chapter. Saving a model that a running generation uses now asks for confirmation first.
  - Retrying a finalization step after a dropped stream now sends a new model request. Requests cancelled by the author or by the total time limit are recorded as cancelled in the AI call log, and the log now includes every request the main process sends.
  - Batches already written into the official outline are no longer listed as recoverable. After a single chapter fails, a batch run that includes it still shows its recovery card.
  - More than ten display fixes across the architecture page, the outline generation dialog, the character pages, version history, and the startup screen. These include prologue-only outlines, notices for deleted drafts, and character profile layout in narrow windows.
  - In the English interface, errors from drafting, blueprints, character cards, and other workflows appear in English, and the cast page's buttons and role menu fit at 1024 px.
  - Secondary text meets WCAG AA contrast of 4.5:1 in both light and dark themes.
  Download a Windows x64, macOS Apple Silicon, or macOS Intel installer from this page. Users on 1.1.0, 1.2.x, or 1.3.0 get an in-app update notice. On macOS, the notice opens this page, and you download the new installer manually.
  Windows installers are unsigned. Mac installers are ad-hoc signed, with no Developer ID signature or Apple notarization. Your system may show an unknown-publisher warning or block the app.
