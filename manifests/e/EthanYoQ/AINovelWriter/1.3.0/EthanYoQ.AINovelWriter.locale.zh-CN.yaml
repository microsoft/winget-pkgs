ReleaseNotes: |-
  1.3.0
  中文
  1.3.0 把整个界面换成了新的「纸墨」写作界面，按写一本小说的顺序组织：设定、架构、蓝图、正文，再加上作品资料。旧的工作台界面和图片皮肤已移除。
  - 左侧流程脊按设定、架构、蓝图、正文排列，每一步显示完成情况；打开作品时落在最近在写的那一章。
  - 书房列出全部作品，可以新建、打开、移除最近记录、导入旧项目副本；首次启动直接进入空书房。
  - 架构页分四节显示状态，主按钮按当前状态在「AI 生成架构」「继续生成架构」和「下一步：章节蓝图」之间切换；角色名单与架构放在一起编辑。
  - 蓝图页的主按钮是「写第 N 章」，点开只出现一个小弹层，不再弹出大表单。
  - 正文单章视图里一章可以从待写走到定稿：写稿、审稿、按意见修稿、合并、定稿都在同一页完成。正文编辑器支持 Tab 插入两个全角空格，Esc 再按 Tab 离开编辑区。
  - 情节线索、知识库和版本历史合并为作品资料页，在资料页之间切换不会丢掉打开的正文标签。
  - 生成任务统一在运行侧页里查看：进行中、历史和诊断三个分页，可以取消、暂停批量、确认继续、复制或放弃恢复候选。顶栏显示运行进度。
  - 内容区使用标签页，可以同时打开多章与多页；关闭有未保存修改的标签前会确认。
  - 外观只保留浅色和深色。旧的 galaxy 主题迁成深色，paper 和 light 迁成浅色；旧皮肤目录原样保留，不再生效。
  - 中文和英文界面全部翻译，写一章的全过程可以只用键盘完成，途经的每个可操作元素都有焦点框。
  助手聊天入口在新界面中暂时隐藏，以后单独重新开放。
  请从本页下载 Windows x64、macOS Apple Silicon 或 macOS Intel 安装包。已安装 1.1.0 或 1.2.x 的用户会在应用内收到更新提示：Windows 可以在应用里直接下载并安装；macOS 上提示会打开本页，需要手动下载新的安装包。升级不改动作品数据，旧版外观偏好会自动迁移。
  Windows 安装包未签名。Mac 安装包使用 ad-hoc 签名，未获 Developer ID 签名和 Apple 公证。系统可能提示未知发布者或阻止打开。
  English
  1.3.0 replaces the whole interface with the new Paper and Ink writing interface, organized in the order a novel gets written: setup, architecture, blueprint, and prose, plus project references. The old Workbench interface and image skins are removed.
  - The workflow spine on the left lists setup, architecture, blueprint, and prose, with progress for each step. Opening a project lands on the chapter you were last writing.
  - The library lists every project. You can create, open, remove recent entries, and import a copy of a legacy project. First launch opens an empty library.
  - The architecture page shows the status of its four sections. Its main button switches between "Generate architecture", "Continue architecture", and "Next: chapter blueprint" based on that status. The character roster is edited alongside the architecture.
  - The blueprint page's main button is "Write chapter N". It opens a small popover instead of a large form.
  - The single-chapter view takes a chapter from unwritten to finalized on one page: drafting, review, revision from review notes, merging, and finalization. In the prose editor, Tab inserts two full-width spaces; press Esc then Tab to leave the editor.
  - Plot threads, the knowledge base, and version history are combined into project reference pages. Switching between them keeps open chapter tabs.
  - All generation runs are shown in one run sheet with In progress, History, and Diagnostics tabs. You can cancel, pause a batch, confirm continuation, and copy or discard recovery candidates. The title bar shows run progress.
  - The content area uses tabs, so several chapters and pages can stay open. Closing a tab with unsaved changes asks for confirmation.
  - Appearance offers light and dark only. The old galaxy theme migrates to dark; paper and light migrate to light. The old skin folder is left in place but no longer applies.
  - Chinese and English interfaces are fully translated. A whole chapter can be written with the keyboard alone, and every interactive element along the way shows a focus ring.
  The assistant chat entry is hidden in the new interface for now and will return separately.
  Download a Windows x64, macOS Apple Silicon, or macOS Intel installer from this page. Users on 1.1.0 or 1.2.x get an in-app update notice. On Windows, the app downloads and installs the update; on macOS, the notice opens this page, and you download the new installer manually. Upgrading leaves project data unchanged and migrates existing appearance preferences automatically.
  Windows installers are unsigned. Mac installers are ad-hoc signed, with no Developer ID signature or Apple notarization. Your system may show an unknown-publisher warning or block the app.
