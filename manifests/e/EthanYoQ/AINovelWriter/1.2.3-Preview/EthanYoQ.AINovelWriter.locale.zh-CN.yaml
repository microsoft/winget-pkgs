ReleaseNotes: |-
  1.2.3-Preview
  中文
  - 长篇创作资料提取角色卡时，若模型返回损坏的 JSON 且语法修复改写了事实，拒绝该修复结果并拆小批次重新生成。
  - 修复暂存头像后刷新角色资料，再次保存可能用旧草稿覆盖新资料的问题。
  - 修复章节蓝图人物输入中的分隔符消失问题，保留输入法组字过程。
  - 章节蓝图生成弹窗支持滚动，历史记录较多时仍可操作底部按钮。
  - 大纲输出过短且符合重试条件时，自动重试。
  - 新作品的数据库初始化在一个事务内完成，失败时回滚。
  - 书架支持移除最近打开记录，不删除作品文件。
  - 外观配置阻止启动时，可在提示页重置外观后继续。
  - 外观设置新增可选的“创作流程（预览）”界面，包含流程导航、页面标签、快捷搜索和运行状态。默认仍使用工作台。
  这是 1.2.2-Preview 的更新版。版本名保留 Preview，使用正式发行渠道。
  请从本页下载 Windows x64、macOS Apple Silicon 或 macOS Intel 安装包。旧版无法通过应用内更新识别此 Preview 版本。
  Windows 安装包未签名。Mac 安装包使用 ad-hoc 签名，未获 Developer ID 签名和 Apple 公证。系统可能提示未知发布者或阻止打开。
  English
  - Character extraction from long planning materials now splits the batch and generates again if the model returns malformed JSON and its syntax repair changes facts. The altered repair is rejected.
  - Fixed stale drafts overwriting refreshed character data when saving after staging an avatar.
  - Fixed disappearing separators in chapter blueprint character inputs and preserved input method composition.
  - The chapter blueprint generation dialog now scrolls, keeping its buttons reachable when the history is long.
  - Outline generation retries when the output is too short and meets the retry conditions.
  - New project database initialization now runs in one transaction and rolls back on failure.
  - The library can remove recent entries without deleting project files.
  - If appearance settings block startup, the error page offers an appearance reset.
  - Appearance settings now offer an optional Creative flow (preview) interface with workflow navigation, page tabs, quick search, and run status. Workbench remains the default.
  This updates 1.2.2-Preview. The version name retains Preview and uses the regular release channel.
  Download a Windows x64, macOS Apple Silicon, or macOS Intel installer from this page. Older versions cannot detect this Preview version through the in-app updater.
  Windows installers are unsigned. Mac installers are ad-hoc signed, with no Developer ID signature or Apple notarization. Your system may show an unknown-publisher warning or block the app.
