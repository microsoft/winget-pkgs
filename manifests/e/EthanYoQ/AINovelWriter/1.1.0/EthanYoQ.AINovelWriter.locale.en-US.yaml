ShortDescription: A local-first AI studio for long-form fiction.
Description: AI Novel Writer is a local-first AI novel writing studio designed to plan, draft, and refine long-form fiction. It organizes premise, characters, worldbuilding, chapter blueprints, drafting, review, and revision as a traceable writing workflow. You configure the model; your project material stays on your computer, with support for local and online models such as Ollama.
