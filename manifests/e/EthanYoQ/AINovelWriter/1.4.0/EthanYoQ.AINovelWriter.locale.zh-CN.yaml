ReleaseNotes: |-
  1.4.0
  中文
  1.4.0 新增选中文字按意见改写、分工模型，以及导入作者原稿时反推设定。大作品打开和运行侧页明显变快。还修复了备份往返、回退再定稿和重新生成蓝图时的数据问题。作品数据、设置和安装位置都不变。
  新功能：
  - 选中正文后，工具栏多了「按意见改」。写下改写要求，最多 2000 字，看过结果再决定是否采用。Ctrl/⌘+Enter 提交，Esc 取消。改写中断后恢复时，原来的要求还在。
  - 分工模型。在「设置 → 高级 → 分工模型」里，可以给规划、写稿、审稿、修稿、定稿后处理分别指定模型，没指定的跟随默认模型。其中「定稿后处理」只用于单章定稿后的首次后处理，批量写作的自动定稿、导入中的后处理和已跑过步骤的重试沿用原来的模型。修稿、剧情树和伏笔识别的对话框会预选该环节的模型。删除某个模型时，用到它的环节会一并改回跟随默认。
  - 导入作者原稿时，可以勾选「同时反推设定、架构、角色和蓝图」，默认勾选，并显示预估的 AI 消耗。反推只补空白，已有的设定、架构、文风和蓝图都不覆盖。和已有内容不同的结果列在运行卡片的「反推建议」里，可以逐条采用或全部采用。反推出的角色作为待处理的角色建议出现，不直接写进名单。
  - 在已定稿的章上回退再定稿后，旧定稿在版本历史里显示为「已被替换的定稿，只读」，仍可查看、复制和回退。
  改进：
  - 模型设置里，模型名称合并成一个输入框加候选列表。填好 base_url 和 API Key 后会自动获取端点的模型列表，也可以直接输入任意名称。切换服务商时，API Key 和模型名一起清空，旧 Key 不会发到新地址。保存按钮不可用时，会说明还缺哪些字段。
  - 连接测试超时后会停止等待，并提示检查网络或代理。云端模型等 30 秒，本机模型等 120 秒，原来要等满 300 秒。Gemini 3 选「关闭思考」时按该模型支持的最低一档发送，设置里注明 Gemini 3 无法完全关闭思考。
  - 本机检索模型不填 API Key 也能用于知识库导入、检索和重建索引。云端检索模型仍需要 Key。
  - 发送前不再按估算的长度拒绝请求。模型设置里填了较小的上下文窗口，也会照常发送。提示词真的超出模型长度时，卡片会说明原因，并建议换用上下文更长的模型，或精简本章要求和参考材料。
  - 导入小说时，请求次数和运行时长按全书的工作量定额。导入因请求次数或运行时长到上限停下时，会说明已保存了什么、下一步怎么做；导入作者原稿时不会再提示点不了的「重新开始」。
  - 定稿后处理里，重试也解决不了的失败不再显示「重试」，说明里写明该怎么处理。「重试失败步骤」只重跑能重试的步骤。角色状态字段冲突时，显示可读的说明。
  - 定稿写入角色状态后，角色页自动刷新，不用重开作品，未保存的编辑会保留。
  - 操作进行中切换界面语言后，之后出现的提示按新语言显示。英文界面的计数按单复数书写。
  - 断网或连接中途断开时，生成记录记为网络失败，不再记成服务商失败。
  - 打开作品期间，如果别的程序改动了作品文件，书童会拒绝打开，并提示关闭占用作品文件夹的程序后重试。
  - 运行时升级到 Electron 44，包含上游的安全修复。打开或保存文件时，对话框会从上次用过的文件夹打开。
  性能：
  - 150 章的作品，打开作品从约 8 秒降到约 0.5 秒，运行侧页从约 29 秒降到约 1 秒，蓝图页从约 20 秒降到约 0.15 秒。运行侧页开着写稿时，其他页面不再跟着卡住。
  - 单章写稿保存后，「可恢复」里不再留下候选卡。取消、失败或中断留下的候选可以点「不再显示」。
  修复：
  - 用备份在两台电脑间反复导出和恢复后，角色「当前状态」会变成「历史派生」，新章定稿时角色状态更新报来源冲突。现在打开作品时会自动修复，来源章节已删除的情况也包括在内。
  - 在已定稿的章上回退再定稿后，写下一章会被「重复记录」拦下。现在只保留一份当前定稿，打开作品时也会修复已有的重复定稿。
  - 重新生成蓝图时，已保存的作者指导和章节要点会被清空。现在新结果留空的字段保持原值。
  - 蓝图里某个字段为空时，输入框会残留上一章的文字，保存后可能写进本章。现在空字段显示为空。
  - 再次采用已经处理过的恢复稿时，提示「这份恢复稿已经处理过」，不再误报来源已变。
  请从本页下载 Windows x64、macOS Apple Silicon 或 macOS Intel 安装包。已安装 1.1.0、1.2.x 或 1.3.x 的用户会在应用内收到更新提示；macOS 上提示会打开本页，需要手动下载新的安装包。
  Windows 安装包未签名。Mac 安装包使用 ad-hoc 签名，未获 Developer ID 签名和 Apple 公证。系统可能提示未知发布者或阻止打开。
  English
  1.4.0 adds Revise with note for selected text, models by stage, and inference of settings when you import your own manuscript. Large projects open faster, and the run sheet loads faster. It also fixes data problems after backup round trips, after rolling back and re-finalizing a chapter, and when blueprints are regenerated. Project data, settings, and the install location are unchanged.
  New features:
  - When you select chapter text, the toolbar has Revise with note. Write an instruction of up to 2,000 characters, then review the result before you accept it. Press Ctrl/⌘+Enter to submit or Esc to cancel. If a revision is interrupted, recovery keeps your instruction.
  - Models by stage. Under Settings → Advanced → Models by stage, you can assign a model to planning, drafting, review, refinement, and finalization. Stages without an assignment use the default model. The finalization model applies only to the first post-processing after you finalize a single chapter. Auto-finalizing in batch writing, post-processing during imports, and retries of steps that already ran keep their original model. The refinement, plot tree, and foreshadowing dialogs preselect the model for their stage. When you delete a model, stages that used it switch back to the default.
  - When you import your own manuscript, you can select Also infer settings, architecture, characters, and blueprints. It is selected by default and shows the estimated AI usage. Inference only fills empty fields. It does not overwrite existing settings, architecture, writing style, or blueprints. Results that differ from existing content appear as Inferred suggestions on the run card, and you can adopt them one at a time or all together. Inferred characters appear as pending character proposals and are not added to the cast directly.
  - After you roll back a finalized chapter and finalize it again, version history shows the old final as Replaced final; read-only. You can still view it, copy it, and roll back to it.
  Improvements:
  - In model settings, the model name is one text box with a list of candidates. After you enter the base_url and API key, the app fetches the endpoint's model list automatically. You can also type any model name. Switching providers clears the API key and model name, so an old key is not sent to a new address. When Save is unavailable, the form lists the missing fields.
  - A connection test now stops waiting after a timeout and asks you to check your network or proxy. Cloud models get 30 seconds and local models get 120 seconds. Before, the test waited the full 300 seconds. When you turn off thinking for Gemini 3, the app sends the lowest level that the model supports, and settings note that Gemini 3 cannot turn thinking off completely.
  - Local embedding models work without an API key for knowledge-base imports, search, and index rebuilds. Cloud embedding models still need a key.
  - Requests are no longer refused in advance based on an estimated length. If you set a small context window in model settings, requests are still sent. If a prompt really exceeds the model's limit, the card explains why and suggests a model with a longer context, or a shorter chapter brief and less reference material.
  - When you import a novel, the request and run-time limits are sized to the whole book. If an import stops because the request or time limit was reached, the message says what was saved and what to do next. Imports of your own manuscript no longer point you to a Restart button you cannot use.
  - In finalization post-processing, failures that a retry cannot fix no longer show Retry, and the message says what to do instead. Retry failed steps reruns only the steps that can be retried. A character-state field conflict shows a readable explanation.
  - After finalization writes character states, the cast page refreshes without reopening the project, and unsaved edits are kept.
  - If you switch the interface language while an operation runs, later notices use the new language. Counts in the English interface use singular and plural forms.
  - When the network drops or a connection breaks mid-stream, the generation record says network failure instead of provider failure.
  - If another program changes the project files while a project opens, Pagekin refuses to open it and asks you to close the program that uses the project folder and try again.
  - The runtime is upgraded to Electron 44, which includes upstream security fixes. File dialogs open in the folder you used last.
  Performance:
  - For a 150-chapter project, opening the project drops from about 8 seconds to about 0.5 seconds, the run sheet from about 29 seconds to about 1 second, and the blueprint page from about 20 seconds to about 0.15 seconds. Other pages no longer stall while chapters are written with the run sheet open.
  - After a single chapter is written and saved, Recoverable no longer keeps a candidate card for it. Candidates left by a cancel, failure, or interruption have a Hide button.
  Fixes:
  - After repeated export and restore between two computers, a character's Current state could become history-derived, and character updates failed with a source conflict when a new chapter was finalized. Opening the project now repairs this, including when the source chapter was deleted.
  - After you rolled back a finalized chapter and finalized it again, writing the next chapter was blocked by a duplicate-record error. Each chapter now keeps one current final, and opening a project repairs existing duplicates.
  - Regenerating blueprints cleared saved author guidance and chapter notes. Fields that the new result leaves blank now keep their saved values.
  - When a blueprint field was empty, the text box could show the previous chapter's text, and saving could write it into the current chapter. Empty fields now stay empty.
  - Accepting a recovery draft that was already handled now says it was already handled, instead of reporting that the source changed.
  Download a Windows x64, macOS Apple Silicon, or macOS Intel installer from this page. Users on 1.1.0, 1.2.x, or 1.3.x get an in-app update notice. On macOS, the notice opens this page, and you download the new installer manually.
  Windows installers are unsigned. Mac installers are ad-hoc signed, with no Developer ID signature or Apple notarization. Your system may show an unknown-publisher warning or block the app.
