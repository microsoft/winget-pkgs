ReleaseNotes: |-
  ## What's new in v1.4.0

  ## Downloads

  - Recommended: `Envarly_1.4.0_x64-setup.exe`
  - Managed install: `Envarly_1.4.0_x64_en-US.msi`
  - Portable: `Envarly_1.4.0_x64-portable.zip`
  - Checksums: `SHA256SUMS.txt`

  ---

  ### Resizable panels

  - The sidebar and snapshots panel can now be resized by dragging their edge
  - Widths are clamped to a sensible minimum/maximum and persist across restarts

  ---

  ### Check command

  - New header tool: enter a command name (`node`) or a full exe path (including a path copied via Explorer's "Copy as path") to find out whether it resolves on the effective PATH
  - Detects shadowing — if a same-named file exists in more than one PATH directory, only the first one actually runs; the rest are flagged
  - When given a full path, tells you whether that exact file is the one that runs, is shadowed by another, or isn't on the effective PATH at all

  ---

  **Full changelog:** https://github.com/iray-tno/envarly/compare/v1.3.0...v1.4.0
