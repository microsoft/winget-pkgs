ReleaseNotes: |-
  ## What's new in v1.5.0

  ## Downloads

  - Recommended: `Envarly_1.5.0_x64-setup.exe`
  - Managed install: `Envarly_1.5.0_x64_en-US.msi`
  - Portable: `Envarly_1.5.0_x64-portable.zip`
  - Checksums: `SHA256SUMS.txt`

  ---

  ### Edit other accounts' variables

  - When running elevated, switch to any local account — including ones not currently logged in — to view and edit its per-user environment variables and PATH
  - The header's account picker shows "My variables" until you pick an account; switching swaps the sidebar's personal-scope list without touching System variables
  - PATH tooling (add/remove entries, the launch-time PATH banner) works against the selected account too, not just the current user

  ---

  ### Bug fixes

  - Header no longer overflows off-screen at narrow widths — low-priority items (Import/Export, Check command, GitHub, language, theme, Licenses) now collapse into a "⋯" menu, and the staged-changes indicator is a compact pill instead of two full-width buttons
  - Fixed three environment-diagnostics false positives: built-in Windows path variables (`PROGRAMFILES`, `PROGRAMFILES(X86)`, etc.) are no longer flagged as undefined, the noisy "expandable-without-reference" warning was removed, and access-denied paths (e.g. the System PATH's `WindowsApps` entry) are no longer reported as missing
  - Sidebar's copy-value icon now sits to the left of the scope badge instead of leaving an empty gap when not hovering

  ---

  **Full changelog:** https://github.com/iray-tno/envarly/compare/v1.4.0...v1.5.0
