ShortDescription: A fast GPU terminal for Linux, Windows and macOS, written in C# with Native AOT. Knows about git, GitHub, Neovim and coding agents.
Description: |-
  erikterm is a fast, native terminal built in C#: GPU-rendered, one small binary, and aware of the tools you run in it.
  Tabs, splits and windows (drag a tab into its own window and back with its programs still running), session restore,
  shell integration, the git branch and status of every pane and GitHub pull request and CI status in the tab bar,
  HarfBuzz shaping with ligatures and colour emoji, inline images (kitty graphics, iTerm2, sixel), the kitty keyboard
  protocol, and a built-in tmux emulation so coding agents can open their panes in it.
