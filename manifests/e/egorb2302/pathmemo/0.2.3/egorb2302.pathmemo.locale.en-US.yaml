ShortDescription: Disk space screener for Windows. Finds where the space went, and frees it safely.
Description: 'One self-contained exe with a window and a command line. It scans volumes (reading the MFT directly when run as administrator), shows the largest files and folders, explains the space no scan can see (restore points, WSL and Docker disks, hibernation), and suggests what is safe to delete by rule: developer caches, build output, temporary files. Deletion goes to a quarantine first and can be restored.'
