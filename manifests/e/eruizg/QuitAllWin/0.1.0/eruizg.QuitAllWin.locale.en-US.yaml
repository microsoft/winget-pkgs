ShortDescription: Auto-quit unused Windows apps after a configurable idle time.
Description: |-
  QuitAll-Win lives in your system tray, watches which apps you actually use,
  and gracefully closes the ones you have stopped using — freeing up RAM
  without making you think about it.

  Features:
  - Auto-quit apps unused for a configurable time (default 30 min)
  - Graceful close by default (apps can prompt to save unsaved work)
  - Optional force-quit for stubborn apps
  - Whitelist for apps that should never be auto-quit
  - Toast notifications on each auto-quit
  - Optional "Start with Windows"
  - Per-user installer (no admin required)
