ShortDescription: Hide selected Windows apps instantly with one hotkey, with nothing left in Alt+Tab or the taskbar.
Description: >-
  SnapAway is an open-source "boss key" for Windows. One global shortcut
  (Ctrl+F6 by default) hides only the apps you chose: they keep running, but
  disappear from the screen, the taskbar and Alt+Tab, while every other window
  stays exactly where it was and nothing is left behind in screen sharing. The
  same key brings the windows back in place. Selected apps can be muted while
  hidden. No account and no telemetry; 20 interface languages. The free plan
  hides up to 2 apps, and Pro is a one-time unlock made inside the app.
