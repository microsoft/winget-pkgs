ShortDescription: Audio-reactive auras drawn above the Windows desktop, made from the audio your PC is already playing.
Description: >-
  SonicAura opens a transparent, click-through overlay above the desktop,
  listens to the Windows audio loopback and turns what it measures (volume,
  bass, treble, note attacks and melodic direction) into movement. Any music
  service, browser, game or DAW works, with no microphone and nothing to set up.
  Auras can be previewed live, saved, exported and shared as presets, and the
  overlay steps aside on its own while a video plays or an app fills the screen.
  It stays out of screen recordings, draws few frames in low-CPU mode, and keeps
  everything local: no account, no telemetry, no advertising. Two auras and every
  core feature are free, with Pro as a one-time unlock.
