ShortDescription: A good-looking, full-featured Spotify TUI.
Description: |-
  sotto is a Spotify player for the terminal. It plays the music itself through Spotify Soloist and can also control the Spotify app, a phone or any other Spotify Connect device.
  It has synced lyrics, playlists and queue editing, themes, a command line and an MCP server for AI assistants. You need Spotify Premium.
