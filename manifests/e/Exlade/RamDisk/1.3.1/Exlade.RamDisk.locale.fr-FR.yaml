ShortDescription: Disques RAM gratuits pour Windows, dont les fichiers sont conservés après un redémarrage.
Description: |-
  Exlade RamDisk crée des disques en mémoire pour les compilations, les caches et TEMP. Un disque peut être créé au démarrage de Windows et garder ses fichiers d’un redémarrage à l’autre, être chiffré, s’agrandir à mesure qu’il se remplit et accueillir des dossiers de programmes déplacés dessus.
  L’outil en ligne de commande eramdisk et des modèles de stratégie de groupe sont fournis.
