Description: |-
  Exlade RamDisk створює диски в оперативній пам’яті для збірок, кешів і TEMP. Диск може створюватися під час запуску Windows і зберігати файли між перезавантаженнями, шифруватися, зростати в міру заповнення і приймати папки, перенесені на нього з програм.
  У комплекті утиліта командного рядка eramdisk і шаблони групової політики.
