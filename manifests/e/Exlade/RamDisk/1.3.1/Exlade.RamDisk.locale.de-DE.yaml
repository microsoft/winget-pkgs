Description: |-
  Exlade RamDisk erstellt Laufwerke im Arbeitsspeicher für Builds, Caches und TEMP. Eine Disk kann beim Start von Windows erstellt werden und ihre Dateien über Neustarts hinweg behalten, verschlüsselt werden, beim Füllen wachsen und Ordner aufnehmen, die aus Programmen auf sie verschoben werden.
