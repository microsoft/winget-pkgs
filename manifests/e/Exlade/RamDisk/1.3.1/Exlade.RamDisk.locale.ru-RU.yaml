Description: |-
  Exlade RamDisk создаёт диски в оперативной памяти для сборок, кэшей и TEMP. Диск может создаваться при запуске Windows и сохранять файлы между перезагрузками, шифроваться, расти по мере заполнения и принимать папки, перенесённые на него из программ.
  В комплекте утилита командной строки eramdisk и шаблоны групповой политики.
