ReleaseNotes: |-
  距 v3.2.0 一个多月，此前的改动只在夜间版里，这次正式发布。
  新版界面
  - 侧边栏、概览、视频浏览、内容库、创作者详情按新设计重做，并适配窄窗口
  - 去掉新旧界面切换，固定使用新版界面
  - 视频浏览的作者下拉在作者很多时不再卡顿
  多平台创作者
  - 添加创作者时按链接识别平台，创作者设置按平台区分
  - 接入哔哩哔哩：画质、音质新增「最高可用」并设为默认；修复只下音频时 Hi-Res / 杜比合并失败；充电专属和付费试看不再存成完整视频；CDN 卡住时换备用地址；接口全局限速，触发风控后停止同步并冷却 10 分钟
  - 接入快手：只有 HLS 地址的视频改用 mp4；粉丝数等按「万」解析；列表被限流后约 10 分钟从同一页接着翻；添加快手链接时提示风控
  - 下载数量限制新增计算方式：只看最新 N 个（默认，即原有行为），或跳过已下载的凑够 N 个；B 站改为跟随该设置
  对象存储（S3 兼容）
  - 新下载的作品自动上传，过保留期后本地只留封面，AI 分析需要原文件时自动取回
  - 迁移向导：上传 / 认领 → 核对云端 → 清理本地
  - 网络错误显示具体原因；修复大于约 12MB 的文件上传失败、并发取回原文件导致分析失败
  网络管理端
  - 新增可内置或独立部署的网络管理端：客户端用地址和 API Key 注册，管理端可浏览作品、管理用户和下载任务
  其它
  - AI 分析支持 Grok 订阅，在应用内用 xAI 账号登录
  - 定时同步统一排队，避免整点并发请求被风控
  - 脚本：收藏作品支持条数上限，新增取消收藏接口；收藏类接口改为直连优先，被拦时退回页面
  - 创作者列表行内的勾选框、开关和按钮不再顺带打开右侧详情
  What's Changed
  - feat: 可内置或独立运行的网络管理端 by @Everless321 in https://github.com/Everless321/dYm/pull/31
  - 单独部署的管理端改为 Next.js by @Everless321 in https://github.com/Everless321/dYm/pull/32
  - 管理端首页改为客户端列表，并补齐用户与任务操作 by @Everless321 in https://github.com/Everless321/dYm/pull/33
  - 图文预览改为左右翻页并播放原声 by @Everless321 in https://github.com/Everless321/dYm/pull/34
  - 管理端整体改成桌面端同款浅色界面 by @Everless321 in https://github.com/Everless321/dYm/pull/35
  - feat(ui): 按 untitled.pen 原型重构 dYm 界面 + 界面版本切换 by @devin-ai-integration[bot] in https://github.com/Everless321/dYm/pull/37
  - 按平台区分创作者设置，并接入哔哩哔哩下载 by @Everless321 in https://github.com/Everless321/dYm/pull/38
  New Contributors
  - @devin-ai-integration[bot] made their first contribution in https://github.com/Everless321/dYm/pull/37
