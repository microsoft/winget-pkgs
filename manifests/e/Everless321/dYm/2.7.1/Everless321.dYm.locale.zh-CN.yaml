ReleaseNotes: |-
  修复：视频播放时方向键会失灵
  标签管理里点开作品播放视频后，只要按过一次 → 或 ←，之后 ↑/↓ 就再也切换不了作品，按 Esc 也关不掉播放器——而且是永久失效，直到关掉重开。
  这是 v2.7.0 引入的问题，根源在播放器键盘模块的一处状态没有复位，会把后续按键全部拦截。现在改为完全接管键位，不再依赖它。
  改进：点按快进，长按倍速
  此前长按 → 会先快进一段再切到 2 倍速。现在是：
  - 点按 → 快进（客户端 10 秒 / 网页端 5 秒）
  - 长按 → 2 倍速播放，松手恢复，期间左上角有提示
  - 点按 ← 快退，长按 ← 连续快退
  - 空格 播放 / 暂停
  - ↑ / ↓ 切换作品，Esc 关闭播放器
  网页端也能用键盘调倍速了
  网页端的长按 2 倍速此前只能靠按住画面触发，用键盘看的时候完全发现不了。现在键盘长按 → 同样进倍速，两端操作一致。
  新增：自定义脚本支持定时执行
  在「自定义脚本」页给脚本设置 Cron 表达式即可定时运行，脚本改名或删除时计划会跟着处理。该功能需开启开发者模式后可见，未设置计划时不影响任何现有行为。
  Full Changelog: https://github.com/Everless321/dYm/compare/v2.7.0...v2.7.1
