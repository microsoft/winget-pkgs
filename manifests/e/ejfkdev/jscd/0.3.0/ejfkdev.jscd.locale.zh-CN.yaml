PackageIdentifier: ejfkdev.jscd
PackageVersion: 0.3.0
PackageLocale: zh-CN
ShortDescription: 通过静态解析把 bytenode 编译的 .jsc（V8 代码缓存）文件还原为 JavaScript。
Description: jscd 把 bytenode 编译的 `.jsc` 文件（V8 代码缓存）反编译回 JavaScript。它是一个无依赖的单一 Rust 可执行文件，只做静态解析：不需要改造过的 V8、不需要 Node 运行时、也不联网。它覆盖 Node 8.0.0 到 26.10.0 的每个版本（36 个 V8 小版本），遇到表格之外的 V8 会明确报错而不是猜测。两层优化把字节码的寄存器搬运折叠回可读的表达式，作用域槽位会被命名，内置对象通过只读堆的名称表还原。`--runtime` 会补上 `__runtime` 桩代码，让结果能在 Node 下运行；`--verify` 用 `node --check` 校验输出。
Tags:
