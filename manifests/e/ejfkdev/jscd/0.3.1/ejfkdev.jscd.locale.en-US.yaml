ShortDescription: Reverses bytenode-compiled .jsc V8 code cache files back to JavaScript through static parsing.
Description: 'jscd reverses bytenode-compiled `.jsc` files (V8 code cache) back to JavaScript. It is a single dependency-free Rust binary that parses statically: no patched V8, no Node runtime and no network. Every Node release from 8.0.0 through 26.10.0 (36 V8 minor versions) is identified, and a V8 outside the tables is a clear error rather than a guess. Two optimization layers fold bytecode register shuffling back into readable expressions, scope slots are named, and builtins are resolved through a read-only-heap name table. `--runtime` adds the `__runtime` stubs so the result runs under Node, and `--verify` checks it with `node --check`.'
