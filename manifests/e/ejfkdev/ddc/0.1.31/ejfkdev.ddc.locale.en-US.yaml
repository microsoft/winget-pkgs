ReleaseNotes: |-
  Fixes
  - MCP: strict clients (e.g. OpenCode) no longer reject tools/list — xyz-rust 0.4.9 suppresses non-object outputSchema/structuredContent and gates outputSchema by negotiated protocol version (issue #9)
  - listclasses pattern filter now matches dotted class names: any pattern containing dots (e.g. com.example) previously returned nothing on both CLI and MCP/REST
  Upgrade
  - xyz-rust 0.4.8 → 0.4.9
  Verification
  - All 10 MCP tools tested against a real 174 MB APK over both stdio and streamable-HTTP transports (20/20 OK); error paths, bad sessions, and concurrent calls verified
