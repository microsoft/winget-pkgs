ShortDescription: Sequential clipboard and keystroke auto-feed tool for Windows.
Description: |-
  FlowChain is a Windows resident tool for sending captured text to another app one line at a time. It is built for workflows where order matters, such as terminal commands, SSH/RDP work, QA form entry, SQL snippets, network device configuration, migration steps, and other repetitive operations that should not be pasted all at once.

  FlowChain can capture clipboard or selected text, split it into list items, track sent and unsent progress, lock the target window, use paste-based or literal keystroke delivery, send Enter or Tab after each line with AUTO ENTER, skip or back up through items, remove blank lines in one click, manage tabs, apply template variables, export send logs to CSV, and run as a portable Windows app.

  It also fits AI-assisted workflows: feed multi-step commands from ChatGPT, Claude, or GitHub Copilot straight into a terminal one line at a time, with an optional pre-send check that flags destructive commands (rm -rf, DROP TABLE, git push --force) and masks detected API keys/tokens before anything is sent.
