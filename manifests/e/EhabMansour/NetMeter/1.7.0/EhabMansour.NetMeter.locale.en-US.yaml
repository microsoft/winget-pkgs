ShortDescription: Network speed meter for the Windows 11 taskbar, with today's and this month's data usage on hover.
Description: |-
  NetMeter shows your live upload and download speed on the Windows 11 taskbar, next to the clock.
  Hover over it to see how much data you used today and this month (the same numbers as Windows
  Settings > Data usage) and which apps used the most. It follows the light/dark theme, hides in
  full-screen apps, and can start the month on your internet billing day.
