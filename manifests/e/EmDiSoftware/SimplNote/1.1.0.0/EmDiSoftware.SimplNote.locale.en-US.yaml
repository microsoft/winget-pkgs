ReleaseNotes: Smart dates in Quick Capture, a redesigned reminder popup with configurable intervals, a summary of unfinished tasks after Windows starts, a new Open button for moving through days with unfinished entries, an auto-growing Quick Capture window, a bilingual in-app guide, and improved Windows autostart registration.
