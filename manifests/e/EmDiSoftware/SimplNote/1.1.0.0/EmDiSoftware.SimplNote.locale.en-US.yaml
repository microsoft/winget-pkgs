ShortDescription: Minimalist daily notes and quick capture app for Windows.
Description: SimplNote is a minimalist Windows app for daily notes and quick capture. It supports date-based stickers, quick entry with smart dates, search across saved notes, configurable reminders about unfinished tasks, quick navigation to days that still have unfinished entries, a bilingual in-app guide, backup, import and export, and fully local storage without requiring an account.
