PackageIdentifier: EuropeanSpaceAgency.SNAP
PackageVersion: 13.0.0
PackageLocale: zh-CN
ShortDescription: 地球观测工具箱和开发平台。
Description: |-
  由 Brockmann Consult、SkyWatch 和 C-S 共同开发的哨兵应用程序平台（SNAP），是所有哨兵工具箱（Sentinel Toolboxes）的通用架构。
  得益于以下技术创新，SNAP 架构成为地球观测处理与分析的理想选择：可扩展性、便携性、模块化富客户端平台、通用地观测数据抽象、分块内存管理以及图形处理框架。
  功能亮点
  - 所有工具箱的通用架构
  - 即使是十亿像素级的图像，也能实现极快的显示和导航
  - 图形处理框架 (GPF)：用于创建用户自定义的处理链
  - 先进的图层管理，允许添加和操作新的叠加层，如其他波段的图像、来自 WMS 服务器的图像或 ESRI shapefile 文件
  - 丰富的感兴趣区域（ROI）定义，用于统计和各种图表绘制
  - 便捷的位掩码（Bitmask）定义与叠加
  - 使用任意数学表达式的灵活波段运算
  - 针对通用地图投影的精确重投影和正射校正
  - 使用地面控制点进行地理编码和纠正
  - 自动 SRTM DEM 下载和分块选择
  - 用于高效扫描和编目大型档案的产品库
  - 支持多线程和多核处理器
  - 集成 WorldWind 可视化
