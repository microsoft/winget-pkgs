ReleaseNotes: |-
  - Fix photo: one click makes dark, dull, noisy or slightly blurry phone photos brighter, cleaner and sharper
  - Recolour: click a colour in the picture and choose what it should become
  - New in 1.4: name plates and captions, wall clocks with cut-through numbers and a back plate, magnets of any size, more fonts, and one-click templates (coaster, ornament, keychain, fridge magnet, desk stand)
  - New in 1.3: cut the print to your subject automatically, crop and rotate with a focus area, and a new look for the whole app
