ShortDescription: Turn photos into multi-colour 3D prints for Bambu Studio and OrcaSlicer.
Description: |-
  TailWag Studio turns a photo into a multi-colour 3D print. It picks a few filaments, works out
  where to swap each one, shows a 3D preview of the predicted colours, and exports a ready-to-print
  .3MF project for Bambu Studio and OrcaSlicer, or an STL with a pause guide for any printer.
  It can cut the print to your subject automatically, add name plates, fix poor phone photos, and
  make coasters, ornaments, keychains, fridge magnets, wall clocks and desk stands. Colour
  predictions use Beer-Lambert and Kubelka-Munk models. The subject finder runs on your computer
  and your photos are never uploaded.
