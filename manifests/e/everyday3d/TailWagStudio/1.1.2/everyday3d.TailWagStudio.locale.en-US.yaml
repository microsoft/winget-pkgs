ShortDescription: 3D Filament Painting & TD Lithophane Engine for Bambu Studio and OrcaSlicer.
Description: |-
  TailWag Studio is a desktop application for multi-filament 3D painting and lithophane creation.
  It simulates optical layer blending using Beer-Lambert and Kubelka-Munk models, solves optimal
  filament palettes and layer swap heights, generates parametric 2.5D CAD frames and cutouts,
  and exports native Bambu Studio and OrcaSlicer .3MF project bundles.
