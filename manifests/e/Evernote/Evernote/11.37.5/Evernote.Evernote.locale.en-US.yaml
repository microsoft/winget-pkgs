ReleaseNotes: |-
  ✨ Features:
  - Date mentions can now be formatted like the rest of the text.
  - Improvements to speakers in transcription:
      - You can now see and assign speakers in the summary.
      - New buttons to move across speaker blocks.
      - A play button to start the audio from a specific speaker block.
      - Hover the "Speaker on" button to see the list of speakers.
  - Redesigned the Move note modal.
  - You can now drag multiple pages in the PDF editor.
  - New connector with Meta Muse.

  🛠️ Fixes:
  - Note "updated": moving a note, or adding/removing tags, no longer updates the note timestamp.
  - Fixed an issue where template import could fail.
  - Made transcription more reliable.
  - The Evernote icon in the macOS menu bar is now sharp on Retina displays.
  - Notes opened in a separate window no longer open larger than your screen when moved between monitors with different display scaling.
