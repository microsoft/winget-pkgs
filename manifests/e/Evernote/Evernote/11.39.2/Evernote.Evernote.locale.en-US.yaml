ReleaseNotes: |-
  ✨ Features:
  - You can now preview attached Markdown files as formatted text, and crop an image straight from the editor.
  - You can now apply text color and highlighting to mentions in a note, including notes, notebooks, stacks, spaces, and people.
  - Transcription recovery: if a transcription run fails, is interrupted, or the app closes mid run, Evernote now recovers the transcript saved on the backend.
  - Opening a note now reconciles audio recordings left stuck in the capturing state, so a dead recording no longer leaves an empty placeholder behind.

  🛠️ Fixes:
  - Fixed a bug in which What's New articles appeared in English for some languages
  - Live transcription no longer stops midway through a recording after you switch or connect an audio device.
  - The AI Assistant and other AI features are now available in notes opened in a new window.
  - Note titles in the Tasks list's Assigned note column are no longer cut off when there's room to display them.
  - Folders you connect in Settings > Sync Folder now always appear in the list, so you can choose where their files go.
  - Calendar colors now display correctly in the calendar picker when creating a new event.
  - When inviting people to a Space, typing a name or email now filters the people who already have access, and the window closes when you click outside it.
