ReleaseNotes: |-
  ✨ Features:
  - The PDF editor got a full refresh: a new page sidebar (delete, insert, reorder, rotate), merge and split PDFs, an eraser tool, and upgraded text formatting.
  - You can now create toggle lists from the formatting toolbar.
  - You can now see transcriptions for your older files too.
  - AI title suggestions now work also on notes that contain only attachments.
  - You can now use saved AI Prompts from the AI Assistant by typing "/" in the composer.
  - The AI Assistant can now interact with your comments: it can follow their instructions and create new comments.
  - The AI Assistant now shows the context it's working with at the top of the chat.
  - You can choose a transcription model with speaker recognition in Settings — our internal model, or an external provider.

  🛠️ Fixes:
  - Fixed an issue where search or navigation could unexpectedly return you to All Notes or show stale results.
  - Fixed AI Assistant edits not appearing correctly in notes with Tasks blocks.
  - Fixed calendar notification setup and controls so they better reflect your calendar connection and permissions.
  - Fixed recordings and live transcripts to recover more reliably and stay responsive.
  - Fixed AI Assistant created recurring tasks that could start overdue.
