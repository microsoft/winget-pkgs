ReleaseNotes: |-
  New features:
  - Tables are now more user friendly: resize and move images easily, spread out columns just the way you like, and experience a smoother copy and paste again with Excel and Google Sheets.
  - Image search just got smarter: uploaded images now get automatic captions, helping Semantic Search understand and find what's inside them. Select "Show caption" inside an image to see it.
  - You can now bulk select, rename and remove speaker blocks in audio transcriptions.

  Fixes:
  - When you link a note, the menu now highlights the first matching note instead of "Create new note". Press Tab if you did mean to create a new one.
  - Fixed an issue where live transcription could lose content during network interruptions.
  - Fixed an issue where note link previews could fail to show content.
  - Fixed an issue where tag suggestions in the note footer didn't match prefixes correctly.
  - Improved tag suggestion performance on large accounts.
  - Fixed an issue affecting callout formatting when deleting blank lines.
  - Fixed an issue where the AI Assistant button could overlap the editor status indicator.
  - Fixed Spaces directory table columns crashing and overlapping at narrow views, with space descriptions getting cut in the middle of a line.
