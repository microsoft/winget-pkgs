ReleaseNotes: |-
  ✨ Features:
  - Image and file annotation improvements: a Recent colors swatch that remembers your 8 most recently used custom colors, an Eyedropper tool to pick any color from the screen, text alignment, and some new animations and polished transitions.
  - You can ask the AI Assistant to rename an attachment or recording, and review the change before it is applied.
  - The calendar link suggestion after starting a recording now appears only for meeting recordings, skipping all day and multi day events.

  🛠️ Fixes:
  - A note is marked updated only when its content changes.
  - The tab bar no longer gets cut off when you zoom the interface in or out.
  - The in editor audio recorder bar no longer blocks clicks on the editor and tag menus.
  - Pressing Enter or Tab after typing part of a tag name now reliably adds your existing tag instead of a new, shortened one.
  - The Evernote logo is back in the Microsoft Store, Start menu, and taskbar on Windows.
