ReleaseNotes: |-
  ✨ Features:
  - The AI Assistant can read Word, PowerPoint, Excel, RTF, ODT, email, subtitle, calendar, contact, TIFF, and BMP files. Attach them to a chat and ask questions.
  - Favorites now appear in the slash menu.
  - Table cell menus include Delete Row and Delete Column; Markdown is now a code block language.
  - The redesigned release notes window lets you stop showing notes after each update.
  - Resize Tasks columns by dragging the dividers, and your widths are remembered.

  🛠️ Fixes:
  - Pictures in Word content now paste into notes, and attachments copied from the desktop app paste into Evernote Web.
  - AI Assistant duplicates notes with their attachments, not just the text.
  - Fixed a case in which opening a note triggered its updated date.
  - Print and PDF exports preserve Shift+Return line breaks and numbered list numbering.
  - Pinned notes remain in the Pinned section regardless of sort order.
  - Home: Completing a task no longer crashes the Tasks widget; right clicking a Notes card opens its menu.
  - Note list: Snippet view refreshes updated times live.
  - Search: Filter only queries skip Semantic search.
  - Calendar: The compact date picker follows your Start week on setting; pink calendars stay pink.
  - Duplicated notes use the duplication time as their creation date.
