ReleaseNotes: |-
  ✨ Features:
  - Following a recording is easier with the new audio player: a waveform for scrubbing, speaker avatars and pins, a playback speed selector, and editor controls that stay out of your way.
  - Live transcripts are now saved on the note. When you replay a recording, the transcript appears alongside the audio in a resizable panel, so you can read and listen at the same time.
  - Tasks in notes now show their priority and a description icon, like in the Tasks view.
  - Your next audio summary uses the prompt you picked last instead of resetting to the default.
  - Copy transcription is now in the audio player's overflow menu, under Transcription options.

  🛠️ Fixes:
  - AI title suggestions now also appear when you open a note in its own window.
  - Shared notebooks now show their notebook name in the note list instead of only "Shared with me".
  - Best Matches in search now honor advanced operators like tag and intitle.
  - Exported .enex files with special characters (like "&") in image captions now import correctly.
  - What's New articles now appear in your language, including Chinese.
