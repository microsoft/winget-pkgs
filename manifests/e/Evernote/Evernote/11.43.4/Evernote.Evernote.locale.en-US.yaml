ReleaseNotes: |-
  ✨ New features:
  - A refreshed editor that is easier on the eyes: more space between blocks, bigger text by default, cleaner bullets, and smoother toggles.
  - Your table of contents, your way: pick the background color, the text color and the bullet style.
  - Toggles, faster: type >> then Space to add one, nest them like bullet lists, and collapse a heading or every toggle at once with a shortcut.
  - Your recordings now have a Notes tab, so you can take notes while recording and have them included in the summary. In shared notes, collaborators can follow the live transcript while someone else records. Use the gear icon in the top right corner to choose your transcription model and set up automatic transcription.
  - Searching tags in the Tags view lets you reveal the nested tags around them.
  - You can now ask the AI Assistant to recolor your tags or nest them under a parent.

  🛠️ Fixes:
  - Recording a meeting in the browser now reminds you to stop once the calendar meeting has ended.
  - Edit tags shows again the tags already on your note in their own section above all your other tags.
  - Pasting keeps going when an attachment cannot be downloaded and tells you how many images were skipped; you can also paste into a table cell from the right click menu.
  - You can paste into an existing table cell again from the right click menu.
  - Notes with long audio recordings open faster, and clicking an audio card keeps the caret inside it.
  - Undo now restores a just rejected AI edit.
