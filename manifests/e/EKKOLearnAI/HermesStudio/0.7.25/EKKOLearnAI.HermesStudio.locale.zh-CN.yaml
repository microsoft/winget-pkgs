ReleaseNotes: |-
  更新重点
  - 新增 Cursor CLI，支持聊天、群聊、工作流和独立的 Studio MCP 配置。
  - 新增可配置的 JEV 记忆、技能、浏览器、群聊与工作流检查。
  - 增强浏览器批量操作、多标签页和大页面处理，改进桌面更新下载进度。
  - 修复 DSH 新版预置与插件配置兼容性、配置持久化和插件页面布局，同时保留旧版适配。
  - 修复聊天附件、长对话搜索、会话置顶、Hermes 更新与跨实例 MCP 路由等问题。
