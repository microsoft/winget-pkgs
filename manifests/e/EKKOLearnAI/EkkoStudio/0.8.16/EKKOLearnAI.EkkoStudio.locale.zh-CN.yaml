ReleaseNotes: |-
  Ekko Studio 0.8.16 更新日志
  日期：2026-11-05
  1. 群聊页面新增一次性停用与迁移提示，建议将现有工作转到 Bot；确认后在同源浏览器或桌面端记住并同步到其他标签页，不指定停用日期，也不自动迁移数据 (#3693)
  2. Bot 等待后台任务时由宿主暂停当前回合，减少重复查询耗尽模型步数；无浏览器连接时仍处理结果回传，并恢复中断、启动前停止及重启后的终态通知 (#3690)
  3. 任务详情中的人工续聊直接在原任务追加，无需先等待协调模型判断；结果回传携带本轮人工指令和附件，帮助 Bot 按最新要求理解结果，关联验收也保留该上下文 (#3691)
  4. 完善多轮 Bot 协作、阶段完成确认与停止状态恢复，保留原始结果并限制状态确认重试；允许当前协作 Bot 继续未完成任务，同时保留已完成同伴、路由、轮次和过期回调隔离 (#3675, #3680)
  5. 独立验收期间活动胶囊仅显示当前执行者；验收通过后同时展示开发与验收任务卡，各自打开对应执行，实时消息与重载历史保持一致 (#3682)
  6. 切换 Bot 或 Agent 对话时保留面板、宽度、工具页签及各 Bot 的 Agent 选择，工作区按用户显式开关保持；统一面板顺序、任务 Agent 身份和浏览器定位，并防止过期读取覆盖当前内容 (#3676)
  7. 桌面端语音输入使用服务端当前启用的本地或云端 STT 配置，缺少配置时引导设置；识别失败可重试，停止时保留最终文字并避免重复或过期回填，闲置提示可点击外部收起 (#3688)
  8. 排队消息正确解析文本和附件，预览展示附件文件名，纯附件消息也有内容；消息同时带有原生附件和序列化内容时只渲染一份附件 (#3668)
  9. 扩展管理提示词要求：安装、卸载或配置 Skill、MCP、Plugin 前，若未明确目标 Agent，先列出 Agent 并询问用户；取消或超时不代选，普通查询和使用已有扩展不受影响 (#3683)
  10. 修复 OpenCode 子进程继承过期 PWD、OLDPWD 导致相对路径偏离工作区的问题，统一进程工作目录、PWD 和 --dir 参数 (#3684)
  11. 修复桌面安装包中的更新源地址，指向 /latest 目录，使更新清单中的相对安装包路径能够正确下载，并增加配置检查 (#3677)
  12. 补充 Bot 协作回归验证：保留原有流程，不额外追加创建者汇报，不重放旧汇报队列，显式接收者仅接收一次，状态查询不触发额外操作；该 PR 的净改动仅为测试 (#3678)
  范围：v0.8.15（3f3cb7cc23cde8daccbffb243f9b2cd1a0c28481）→ 内容基线 d90b0257e47d2c62ff391cf3f3bf1361e1c0a0ef。共 13 个已合并 PR；#3678 的内部撤回仅保留测试净改动，#3673/#3674 未单独合并；发版准备 PR #3694。
  桌面 Hermes runtime 沿用 0.22.5，源码固定 v0.22.5 / bf0203a794a07aac3ff764972ab9087baa4e4f4e。Android 与 MCU 不在本轮范围。
