ReleaseNotes: |-
  Studio v0.8.18
  1. Person 对话新增置顶与取消置顶，置顶对话优先排列，各组内按最近活动排序；状态保存到数据库，刷新后保留 (#3704)
  2. 修复实时语音在回复完成、工具事件、断线重连或刷新重建消息时重复朗读的问题，保留本轮朗读进度与句子边界，加载旧历史不再误播；后续回合仍可正常朗读相同文本 (#3708)
  3. 宽屏侧栏与主内容区使用统一外轮廓圆角，消除交界处的内部弧形缺口；覆盖普通及 Agent 配置侧栏，保留区域圆角、显式零圆角、壁纸裁切与 RTL 镜像 (#3709)
  4. 完善 Hermes 0.23 浏览器兼容：通过上游包管理器准备固定版本 Chromium，使用相对路径清单并在打包搬移后复查；兼容旧版浏览器路径，初始化延迟加载的 MCP SDK，并按当前运行时提供的浏览器工具生成指引 (#3712)
  5. 完善 GitHub Copilot 插件准备与凭据保存，模型列表仅认可目标 profile 运行时可读取的凭据；登录绑定发起时的 profile，避免切换后写错位置，启动迁移尊重禁止自动安装与用户禁用插件的选择 (#3712)
  6. 运行时构建默认 Python 更新到 3.14.7、Node.js 更新到 26.13.0，拒绝复用版本不匹配的旧解释器缓存，并支持 Node 版本覆盖；默认 Hermes 仍为 0.22.5，本版不自动切换到 0.23 (#3712)
  7. 补充实时语音、对话置顶、Copilot 与运行时构建的定向测试；E2E 固定使用受当前 Playwright 支持的 Ubuntu 24.04，Windows ARM64 运行时验证支持指定 Hermes 源版本 (#3704, #3708, #3712)
