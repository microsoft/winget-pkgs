ReleaseNotes: |-
  Studio 0.8.28
  本版基于 1aa06a6be4cc705d2f3013ea0a069ff5d7e3ea17，上一正式版为 v0.8.27。
  - 新建文件或重命名时，如目标已存在会提示冲突。编辑器将文件保存到打开它时的 Profile 或工作区，保存期间继续输入的内容仍会标为未保存。 (#3865)
  - 工作区下载改为从磁盘流式传输。失效链接不会遮住同目录的其他文件，并发上传也会分别保留自己的文件。 (#3865)
  - 工作流和 Person 定时任务按所选时区计算下一次运行，支持闰日和夏令时切换。无效计划会暂停，其他计划继续运行。 (#3865)
  - 从浏览器点击 Person 完成通知，会打开对应会话。部署在子路径下的 Studio 也能正确跳转。 (#3865)
  - Ekko 更快地更新长会话的消息统计。兼容 OpenAI 的模型在已输出部分回答后报错时，Ekko 会显示上游错误。 (#3865)
  - 插件升级或卸载后会清理无需再保留的安装包，并保留可供回滚的版本。桌面内置浏览器可从部分损坏的索引中恢复可读的 Profile，并备份原索引。 (#3865)
  - 修复编辑 Bot 执行 Agent 时，已有 Hermes 预设的 HTTP 模型协议与当前 Provider 配置不同而导致保存失败的问题。 (#3863)
  - Hermes 和 Bot 的澄清答复会直接确认给提交者，即使刚重连或 Bot 正在处理另一条消息。过期问题会清除，临时失败后仍可重试。 (#3864)
  - 兼容的 App 可在打开聊天连接时一并请求恢复会话，减少断线重连时的往返。旧版 App 仍可沿用原有恢复流程。 (#3866)
  本版包含 #3865、#3863、#3864、#3866，经发版 PR #3868 合入。
