ReleaseNotes: |-
  Studio 0.8.27
  发布基线：f1288a95021caf2617d738d227cf84753dbb8d91；上一正式版：v0.8.26。
  1. 修复 npm 管理的 Coding Agent 升级时因指定版本而返回 HTTP 400 的问题，支持安装目标精确版本或 latest；回滚仍仅限 DSH，手动安装型 Agent 保留原有限制 (#3855)
  2. 修复中文及特殊字符 Provider 名称写入模型网关请求头时触发 ByteString 错误的问题，普通与流式推理均可使用；兼容旧请求头和含百分号的名称，无需迁移现有配置 (#3856)
  3. 模型代理凭据改为首次使用时按需恢复，避免启动时逐条扫描历史记录；合并同一凭据的并发恢复，恢复缓存最多保留 128 条，并校验当前账户、Profile 和模型权限，使用最新上游凭据 (#3857)
  4. 旧 Codex、Grok、Pi 代理配置通过一次性启动任务导入，首次升级仍需兼容扫描，保留原文件且不分配归属不明的共享凭据；重启后旧凭据与新续聊凭据可同时使用，冷凭据认证后继续支持较大请求体 (#3857)
  5. 兼容 CC-Switch 返回的 models[].slug 模型目录，覆盖 Studio 与 Profile 模型发现、手动获取、连接测试、刷新及恢复；优先使用数组形式的 data 和模型 id，过滤空标识并保留现有 Gemini 目录处理 (#3858)
  涉及 PR：#3855、#3856、#3857、#3858；发版 PR：#3859。
