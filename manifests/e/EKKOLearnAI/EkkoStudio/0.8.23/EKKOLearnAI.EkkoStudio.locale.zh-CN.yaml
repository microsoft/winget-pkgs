ReleaseNotes: |-
  Studio 0.8.23
  - 新增头像菜单中的导航栏设置，支持添加、移除、预览及拖拽或键盘排序，按账号保存，保存失败时恢复原顺序 (#3803)
  - Web 登录及桌面启动按已保存的导航顺序打开首个可用入口，保留显式链接和刷新目标，无可用入口时进入设置；插件导航需手动添加，停用后保留原顺序，恢复默认会移除插件快捷入口 (#3803)
  - 插件可调用宿主工作区选择器，支持目录浏览、手动路径及账号级收藏和最近记录，返回 Profile 与目录供插件使用；取消不新增最近记录，页面或 Profile 变化时关闭选择器 (#3797)
  - 插件安装支持公开 GitHub 仓库的 HTTPS 根链接，自动解析默认分支当前提交并固定来源，便于维护和回滚；选择的是默认分支源码，解析失败可重试或改用本地目录，安装仍需信任确认 (#3806)
  - 插件页面、工作区及设置视图可铺满可用内容窗口，由插件控制内部留白；文档、嵌套区域和文本框滚动条跟随 Studio 主题，保留宿主页头、导航及沙箱隔离 (#3805)
  - Agent 管理卡片统一高度，DSH 详细版本管理移入抽屉，支持精确版本安装与固定、安装最新版并解除固定及回滚；卡片保留状态和更新入口，删除增加确认，抽屉与卡片共享操作及错误反馈 (#3804)
  - 开发插件按文件路径和内容变化触发重建，修复相同内容保存或构建输出导致的重复重建、页面闪烁及表单丢失；构建期间的新编辑继续在后续检查中处理 (#3807)
  相关 PR
  #3797、#3803、#3806、#3805、#3804、#3807；发版准备 #3808。
