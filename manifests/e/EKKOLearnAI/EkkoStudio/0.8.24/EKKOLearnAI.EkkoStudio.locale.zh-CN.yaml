ReleaseNotes: |-
  Studio v0.8.24 中文更新说明
  日期：2026-11-15
  - 受信任插件新增入站 HTTP 拦截能力，可在认证和路由前改写已解析请求、修改响应或直接返回结果，支持优先级、流式内容及停用清理；不拦截出站请求、WebSocket 或已提交响应 (#3809)
  - OMP 改为独立分发，新安装的 Studio 不再捆绑或自动安装 OMP，可通过插件中心或开发链接安装和更新；已有安装快照、启停状态、配置及引擎文件保留 (#3820)
  - 插件页面实时同步 Studio 字体、间距、状态颜色及卡片、输入框和浮层主题，重置主题时清除旧覆盖 (#3820)
  - 插件页面、工作区、设置及 Agent 设置统一使用 Studio 页面容器的留白、圆角和阴影，保留 iframe 填满可用区域与内部滚动 (#3822)
  - 修复通过非 localhost 的 HTTP 地址访问时插件页面无法加载的问题，在 crypto.randomUUID 不可用时使用加密随机 UUID 兼容路径 (#3823)
  - 插件页面支持内嵌 data 和页面内 Blob 音视频播放，保留沙箱隔离与直接联网限制；有声播放需遵循用户交互及浏览器自动播放策略 (#3823)
  涉及 PR：#3809、#3820、#3822、#3823。
  完整版本对比：https://github.com/EKKOLearnAI/ekko-studio/compare/v0.8.23...v0.8.24
