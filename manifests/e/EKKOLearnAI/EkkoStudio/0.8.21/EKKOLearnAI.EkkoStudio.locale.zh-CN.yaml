ReleaseNotes: |-
  Studio v0.8.21
  日期：2026-11-11
  1. BOT 协作完成、手动停止或失败后，在发起聊天中保留记录卡片，点击即可查看各 BOT 的原始可见回复；桌面卡片与聊天左对齐，手机布局自适应 (#3746)
  2. 消息与协作卡片随会话一并恢复，支持统一分页和更早的协作记录；详情按实际执行轮次读取，仅显示当前账号、当前发起会话有权查看的内容，并遵循清空与删除历史的边界 (#3746)
  3. 阅读旧历史时，切换 BOT、重新连接和后台刷新保留阅读窗口；新回复与卡片更新合并，回到底部时重新加载最新内容，并限制历史缓存大小 (#3746)
  4. 将任务列表移入设置的“任务”标签页，保留原有任务操作和“协作”标签页，移除聊天顶部对应入口 (#3746)
  5. 为新版 App 提供可选的统一时间线及配套缓存协议，未启用的客户端继续使用原有消息分页；App 端配套更新单独发布 (#3746)
  6. 修复 OpenAI 兼容语音转写服务成功返回空文本或纯空白时误报 502 的问题，现按空转写成功返回；缺失或非法文本、上游 HTTP 错误和连接失败仍正常报错 (#3753)
  涉及 PR：#3746、#3753；发版准备：#3767。
