ReleaseNotes: |-
  更新内容
  1. 修复 Bot 派发后台任务后没有回复并误报“Agent returned no output”的问题；等待前正常生成、流式发送并保存回复，后台结果仍自动回传，任务与协作阶段保持进行中，达到步骤上限也能完成本轮收尾 (#3699)
  2. 等待后台任务时不再误触发完成铃声、完成通知或 App 完成推送，直接发送与恢复会话保持一致；保留防重复查询和结果回传去重，供应商返回空正文或违规工具调用时仍明确报错 (#3699)
  3. 个人 Bot 消息标题优先显示用户自定义名称，重命名后已有消息和新回复同步更新，重载后保留；未命名时使用本地化预设名称，头像与动画继续对应所选 Bot 外观 (#3700)
  涉及 PR：#3699、#3700；发版准备 PR：#3702。
