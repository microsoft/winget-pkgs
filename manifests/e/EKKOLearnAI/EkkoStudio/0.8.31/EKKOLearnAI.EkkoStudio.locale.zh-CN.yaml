ReleaseNotes: |-
  Studio 0.8.31
  本版基于 61cda7e6c1d0b7b17f6394a8c4f3822e6dd36944，上一正式版为 v0.8.30。
  - 部分依赖外部命令行工具的插件 Agent 会在未安装时提供安装指南，可直接从 Agent 列表打开。返回 Studio 或点击刷新后，列表会重新检查安装状态。 (#3902)
  - 插件 Agent 每轮回复结束后，聊天输入区会立即刷新会话的累计 Token 用量。全局模式优先使用 Agent 报告的用量，缺少时使用估算值。 (#3905)
  - 移除了打开 Studio 群聊时弹出的停用迁移提示。 (#3899)
  - 添加远程设备的弹窗会适应窄窗口。删除按钮及删除、切换设备的确认弹窗会沿用 Studio 主题主色。 (#3900)
  - 修复 macOS 桌面端连接服务失败后，恢复页面上的「重试」和「切换回本机（重启）」按钮可能无法点击的问题。 (#3901)
  - 修复桌面内置浏览器面板隐藏后，后台截图可能变得极小或空白的问题。Studio 和插件的后台截图会沿用最近一次有效的视口尺寸。 (#3904)
  本版经发版 PR #3908 合入。#3907 完整撤回了 #3906 的 Junie 图标改动。
