ReleaseNotes: |-
  Studio 0.8.30
  本版基于 66c13ec3b73830890314916871bfe9255a34bcd7，上一正式版为 v0.8.29。
  - 插件可为 Hermes 和 Ekko 的普通单聊生成上下文压缩摘要，覆盖自动压缩和手动压缩。插件未提供有效摘要时，Studio 会使用内置摘要器。 (#3891)
  - 群聊在后台生成滚动摘要时，如果没有当前请求账号，会使用仍有权限的房主账号选择 Provider，避免串用其他账号的模型配置。 (#3885)
  - 通过官方 Codex OAuth 调用模型时，网关按账号、Profile 和会话隔离会话标识与提示词缓存键，并让出站请求 ID 与最终缓存键保持一致。 (#3892)
  - 将 Responses 请求转为 Chat Completions 时，如果路由没有设置推理强度，会沿用请求中的有效设置。显式路由设置仍优先。 (#3884)
  - 修复 Codex 通过 Grok 的 Responses 接口在工具调用后续聊时，加密推理记录可能因格式不兼容而无法回放的问题。 (#3895)
  - 修复部分通过 Git 安装的 Hermes 在 Unix 上经多层启动脚本转发时，Studio 找不到 Python 环境、无法启动 Hermes Bridge 的问题。 (#3897)
  本版经发版 PR #3898 合入。
