Description: 本地优先的 AI 工作区，支持多 Agent 聊天、编码和可视化工作流。提供桌面应用和可自托管的 Web 控制台，支持 Hermes Agent、Ekko Agent，以及包含 Claude Code、Codex 在内的 14 种 Coding Agent 集成。在同一个工作区中管理对话、群组协作、语音、文件和设备。
