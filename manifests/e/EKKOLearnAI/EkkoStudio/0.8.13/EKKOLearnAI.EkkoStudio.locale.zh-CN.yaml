ReleaseNotes: |-
  Ekko Studio 0.8.13 更新日志
  日期：2026-11-03
  1. 个人助理 Agent 设置卡展示已保存的推理强度；任务活动使用服务端权威计数并保留所选执行的运行时身份，未知运行时显示中性图标 (#3641, #3634)
  2. Agent 任务对话改为桌面可调宽度的右侧分栏，支持键盘调整、宽度记忆及 RTL；工作区、终端和浏览器共用工具面板并跟随当前任务会话，窄屏使用浮层 (#3641)
  3. 恢复任务结果卡片的大号圆角 Agent 图标，保留活动胶囊与任务列表的小圆形头像 (#3640)
  4. 任务详情加入桌面展开收起和窄屏滑入滑出动效，关闭时立即取消请求和订阅，退场后清理状态，并适配焦点恢复、RTL 和减弱动态效果 (#3645)
  5. 新建 Bot 无需预选目录，自动按 Profile 和会话创建独立默认工作区；支持手动选择及清空后恢复默认，无效手动目录明确报错，创建失败保留草稿可重试；工作区入口精简为文件夹图标，既有绑定与文件保持不变 (#3651)
  6. 显式开启任务验收后，由宿主持久化推进开发、独立验收、原任务返修及同一验收任务复验；验收 Bot 阅读普通报告后登记逐项判断和真实证据，通过后才能完成任务，轮数、总时限、停止、重启恢复和幂等约束贯穿流程；旧周期保留原协议 (#3650)
  7. 修复跨 Bot 验收回传的 Execution not found 及过期回调干扰；统一活动胶囊计数与列表，已完成但仍待回传的任务可展开打开，较早的待处理任务不再被历史分页遮住；任务详情移除验收展开面板 (#3650)
  8. 个人助理设置抽屉标题改为本地化的“设置”，不再固定显示默认角色名称，保留内部页签和保存流程 (#3654)
  9. 清空旧测试集并精简历史覆盖率、分片及跨平台测试矩阵，保留 harness、类型检查、构建和产物校验；新增功能须补聚焦测试，最终由独立 Build、Test、E2E 工作流自动验证，E2E 上传浏览器报告；允许空集不等于业务回归已验证 (#3645, #3652, #3653)
  发布基线：v0.8.12 → 23f710c49ffe8f9b044b567d89fdcb58c7399289。共 9 个已合并 PR；#3634 的合并树无新增变更，内容已由 #3641 引入。区间内无独立回滚提交；CI 的阶段性调整按最终状态描述。
  桌面 Hermes runtime 沿用 0.22.5，源码固定 v0.22.5 / bf0203a794a07aac3ff764972ab9087baa4e4f4e。Android 和 MCU 不属于本次发版范围。
