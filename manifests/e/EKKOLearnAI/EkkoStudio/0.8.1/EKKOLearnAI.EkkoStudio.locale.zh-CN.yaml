ReleaseNotes: |-
  更新内容 / Changes
  1. 移除内置浏览器自动化主动获取原生焦点的行为，并将后台标签页渲染与主窗口焦点树隔离，减少对用户操作的干扰 (#3594)
  2. 浏览器配置并发保存使用独立临时文件，避免多实例写入冲突 (#3594)
  3. 完善个人助理任务路由提示：追加需求、修改和反馈优先查询并继续原任务，包括已完成任务，保留原 Agent 与对话上下文 (#3601)
  4. 补齐个人助理运行生命周期的静默状态同步；App 重连可恢复当前 Studio 进程内主会话的运行状态，支持同账户跨模型 Profile (#3602)
  5. 从实时请求恢复个人助理待审批与澄清交互，超时、取消或中止后撤回提醒；排除私有工作会话、归档会话及已失效请求 (#3602)
  6. 修复个人助理连续发送消息时的丢失、重复、乱序和一直排队问题；保留未确认输入，正确衔接排队消息与对话，刷新后保持顺序 (#3603)
  7. 按会话串行准备请求并提前预留执行位置，确保后续输入按提交顺序排队；异步准备或启动失败后释放位置并继续下一条 (#3603)
  8. 修复 Playwright 工作流重跑时的报告产物同名冲突，允许覆盖已有分片和合并报告 (#3602)
  9. 桌面默认 Hermes runtime 升级至 0.22.5，固定对应源码 tag 与提交，并对齐六个平台的已发布运行时资源，包含 Windows ARM64
  English
  1. Removed native focus acquisition from built-in browser automation and isolated background-tab rendering from the main window focus tree to reduce interference with user input (#3594)
  2. Browser profile saves use separate temporary files to avoid concurrent writes colliding across store instances (#3594)
  3. Improved assistant task-routing guidance: additions, changes and feedback first query and continue the original task, including completed tasks, preserving its Agent and conversation (#3601)
  4. Completed silent assistant run-state updates across the lifecycle; App reconnection restores live main-session state in the current Studio process across model Profiles in the same account (#3602)
  5. Restore pending assistant approvals and clarifications from live requests and withdraw reminders on timeout, cancellation or abort; exclude private workers, archived sessions and expired requests (#3602)
  6. Fixed missing, duplicate, out-of-order and stuck queued messages during continuous assistant input; preserve unacknowledged input, reconcile the queue with the transcript and retain order after refresh (#3603)
  7. Serialize request preparation per session and reserve execution slots early so later inputs queue in submission order; preparation or startup failures release the slot and advance the queue (#3603)
  8. Fixed report artifact name collisions when rerunning Playwright workflows by allowing existing shard and merged reports to be overwritten (#3602)
  9. Upgraded the default desktop Hermes runtime to 0.22.5, pinned its source tag and commit, and aligned published runtime assets for all six platforms, including Windows ARM64
  Downloads
  Desktop installers and updater manifests are attached after the six-platform desktop workflow completes. The desktop Hermes runtime is pinned to 0.22.5.
