ReleaseNotes: |-
  Studio 0.8.32
  本版基于 d7112d69c70043367755c8e7561ecf0937cee72c，上一正式版为 v0.8.31。
  - 修复模型网关转换请求协议时丢失提示缓存配置的问题，覆盖 Claude、Qwen OAuth 和官方 OpenAI Chat。OpenCode Go 和 Zen 的连续请求可复用同一会话标识。 (#3913)
  - 修复 Moonshot 的缓存命中数可能被记为零的问题。流式、非流式响应和 Ekko 用量统计会区分普通输入、缓存读取与缓存写入。 (#3913)
  - 更新 Studio 的中英文输出提示，让 Agent 在改动摘要和代码评审中使用绝对路径生成可点击的本地文件链接。 (#3919)
  - 修复从 Hermes 工作进程环境启动 Studio 时，可能连错 Bridge 并导致会话无法续接的问题。Studio 会识别继承的 Worker 端点并改用默认 Broker。 (#3915)
  本版经发版 PR #3920 合入。
