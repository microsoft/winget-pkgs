ReleaseNotes: |-
  更新内容
  日期：2026-11-02
  1. 个人助理活动胶囊同时展示后台任务和当前创建者发起的正常协作流程，支持展开预览、打开历史流程并定位；优化串行与并行节点连线、长名称、移动端及减少动态效果体验 (#3617)
  2. 将活动胶囊的键盘焦点提示收拢到展开箭头，保留任务、流程和 Bot 的独立焦点、键盘操作与主题适配 (#3630)
  3. 创建 Bot 时须选择已有工作区，之后可单独修改；协作继承并固定发起回合的目录，旧任务和计划保留原目录，原子迁移已有绑定且不移动文件；无效目录明确报错，不再回退到主目录，目录绑定不构成安全沙箱 (#3627)
  4. Bot 对话和执行 Agent 支持选择并保存模型接口协议；自动模式按 GPT 或 Claude 对话模型匹配 Responses 或 Anthropic Messages，保留显式选择并排除专用媒体模型，支持切换模型和刷新后恢复选择 (#3618)
  5. 个人助理新增账户共享的单次运行时限，默认 60 分钟，可设为 -1 不限时或 1–35791 整数分钟；新派发任务使用最新设置，运行中的任务保持原时限 (#3629)
  6. 精简任务详情标题旁的停止按钮，保留列表和输入框停止入口；加强任务插队的回合身份、停止确认及幂等校验，避免迟到或重复请求再次插队 (#3629)
  7. Bot 工作区、终端和浏览器在桌面使用可调宽度右侧分栏，在窄屏使用浮层；修复展开任务中的工具入口和会话绑定，显示执行 Agent 图标及任务总数 (#3635)
  8. 个人助理主会话在服务端过滤出站工具与思考原文，覆盖实时事件、恢复、历史和搜索摘要，保留审批、提问、任务卡及回执；兼容旧 App 分页并保留内部完整记录，旧 App 已缓存内容不会自动清除 (#3639)
  9. 完善个人助理需求拆解与逐项验证提示，保留功能清单、依赖和未完成项；执行 Agent 能力不明确或无人适合时，先向用户问询并等待指导 (#3642)
  10. 移除个人助理侧栏角色名称旁的日期，保留其他会话列表的日期和原有排序 (#3625)
  11. 修复局域网 HTTP 等非安全上下文中添加 Agent、计划、协作及任务操作无响应的问题，为个人助理流程提供 UUID 回退 (#3614)
  12. Profile 列表排除点开头目录，避免将 .deleted 墓碑目录显示为资源 Profile 或尝试打开其数据库 (#3615)
  13. 群聊撤回总结锚点之后的排队消息时，保留不受影响的已提交总结、锚点和评审；使进行中的总结失效并拒绝迟到结果写回，广播权威总结状态；已丢失总结不会自动恢复 (#3624)
  14. Studio ACP 控制请求和模型发现超时支持 EKKO_STUDIO_* 环境变量，并兼容 HERMES_* 旧名，优先使用首个有效值；默认保持 60 秒和 20 秒，补齐 Compose 转发及重启说明 (#3623)
  15. 中转入口和 Banner 更新为双十一活动视觉，展示充值加赠 11.11%、最高加赠 1111 额度的活动说明并链接活动页，适配全部语言、移动端及主题 (#3638)
  16. 已撤回后台会话在重连或回前台时对账运行状态的改动；#3620 的该项修复不包含在本版 (#3622)
  下载说明
  桌面安装包和 Web UI 产物由发布工作流上传。默认 Hermes runtime 为 0.22.5，首次启动时按平台下载。
