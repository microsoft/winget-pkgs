# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.9.0.schema.json
PackageIdentifier: Elrime.InteractiveProjectDesk
PackageVersion: 0.11.0
PackageLocale: en-US
Publisher: Elrime
PackageName: Interactive Project Desk
License: Proprietary
ShortDescription: Point the app at a code project and get an interactive 2D/3D board with plain-language explanations.
Description: |-
  Interactive Project Desk renders a code project as an interactive diagram:
  folders are blocks, files are leaves, imports are links. Hover a block for
  a plain-language explanation from your LLM of choice, ask questions about
  nodes or the whole project, and draw your own whiteboard schemes — in 2D
  or a 3D scene (with an optional ASCII look).
Tags:
  - developer-tools
  - code-analysis
  - visualization
  - diagram
