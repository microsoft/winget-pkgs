ShortDescription: Share Windows PC internet with Android over USB without root.
Description: |-
  USB Relay is a free Windows-to-Android USB reverse-tethering app with a native GUI,
  tray controls, optional startup and trusted-phone automatic reconnect.
  Public alpha. Android USB debugging and first VPN approval are required.
  Windows x64 and Android 10+; IPv4 TCP/UDP. General IPv6 and ICMP are not supported.
  Windows binaries are not Authenticode-signed. No gigabit performance is claimed.
