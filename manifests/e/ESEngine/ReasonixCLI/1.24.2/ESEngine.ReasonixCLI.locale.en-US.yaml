ReleaseNotes: |-
  会话持久化、对话滚动和 Windows 启动的稳定性与恢复改进。
  发布渠道：稳定版 · v1.24.2
  English → · 网页版完整更新日志 →
  使用攻略
  - 会话目录 — 了解会话目录如何组织恢复副本和逻辑会话。
  - 配置路径 — 配置文件位置和环境变量参考。
  概览
  Reasonix v1.24.2 — Reasonix Desktop 1.24.2
  会话持久化、对话滚动和 Windows 启动的稳定性与恢复改进。
  发布日期：2026-08-12
  重点内容
  - 恢复谱系现在显示为单个逻辑会话 — 恢复副本折叠为单个普通列表行，防止升级后出现重复会话。 (#8599)
  - 侧边栏不再因投影卡死而冻结 — 限制侧边栏读取和后台元数据同步，防止会话目录连接池饱和时永久冻结。 (#8594)
  - 异步行高变化时对话滚动稳定 — React Virtuoso 现在负责虚拟测量，防止 Markdown 或代码块加载完成时跳动。 (#8492, #8429, #8586)
  - Windows 启动不再闪现控制台窗口 — 启动时的 git 探测现在使用加固的命令包装器，隐藏控制台窗口。 (#8425)
  - 生命周期记录不再因 Windows 共享冲突而丢失 — 重命名和重读操作的重试逻辑确保多个实例同时启动时保留崩溃证据。 (#8550)
  - 投影 lineage 在升级和模型切换时重新绑定 — 当 lineage 键变化时保留上下文投影，避免恢复时全价压缩。 (#8390, #8400)
  - 恢复分支不再无限增长 — 防止误判 diverged 分支，并将深度上限隔离限制为每个写入者一个文件。 (#8444, #8430, #8457, #7982)
  改进
  - 会话目录现在使用一次性 v4 数据库 — 逻辑投影和恢复角色从权威内容重建，防止跨版本写入冲突。 (#8599, #8425)
  - Agent 状态重构以提高清晰度和安全性 — 协作者、配置和运行时生命周期分离，并通过保护测试防止意外状态更改。 (#8595, #8564, #8588, #8541, #8485, #8460, #8453, #8447, #8439)
  - 压缩失败记录在多次折叠中保留 — 投影重读现在保留工具执行细节，模型继续看到失败上下文。 (#8432)
  修复
  - 恢复副本分类恢复 — 隐藏已覆盖的恢复副本，减少重复会话。 (#8425)
  - Repolint 基线修正 — 生成的绑定从测量中排除，过时的预算重新同步。 (#8605, #8503, #8436)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
  致谢
  感谢本版本的贡献者：@SivanCola、@yingziisme、@esengine、@erphenheimer、@Drummerms
