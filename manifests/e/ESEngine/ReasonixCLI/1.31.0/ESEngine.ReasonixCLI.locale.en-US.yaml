  概览
  Reasonix v1.31.0 — 自动化工作区、可靠调度与工作区优化
  此版本引入了专用的自动化工作区并强化了计划任务执行，优化了工作区面板尺寸与状态管理，修复了侧栏会话索引不完整和输入框折行时短暂闪现“回到底部”的问题，并更新了问题报告渠道。
  发布日期：2026-08-20
  重点内容
  - 自动化工作区与可靠调度 — Heartbeat 现已升级为页面级自动化工作区，提供分组/平铺任务列表、搜索与筛选、可编辑详情面板、运行历史和会话导航。调度支持间隔、日历周期、cron 和时间窗口计划，并具备无损转换保护和本地化的下次运行描述。推荐模板以禁用的 ask 草稿形式打开，供用户在启用前审查。 (#8261)
  - 优化工作区面板宽度与状态管理 — 聊天面板现在可缩小至 400px，主题栏操作折叠进“更多”菜单，面板宽度统一并按项目记忆，工作区面板的滚动和面包屑也得到优化。 (#8748)
  - 长草稿可扩展已调整大小的输入框 — 手动调整过的输入框现在将已保存高度作为最小值；长草稿会继续展开，内容缩短后回到该基线，并仅在达到视口上限时启用内部滚动。 (#9142)
  - 修复侧栏会话索引不完整的问题 — 检测并修复持久化的就绪目录投影，当实时会话行数与已完成扫描总数不匹配时，从权威 JSONL 文件协调缺失的会话和主题行。 (#9164)
  - 输入框折行时不再闪现“回到底部” — 当输入框内容增长并折行、导致对话视口缩小时，尾部跟随会同步固定原生对话尾部，避免“回到底部”按钮闪现一帧，同时保持手动阅读和内容收缩时的原有行为。 (#9179)
  - 置顶区域标题优化 — 紧凑型工作台侧栏的“置顶”区域标题现在包含装饰性图钉图标和专用的非交互样式，与项目文件夹保持视觉对齐。 (#5899)
  新功能
  - 自动化工作区 — Heartbeat 现已升级为页面级自动化工作区，提供分组/平铺任务列表、搜索与状态/项目筛选、可编辑详情面板、持久化分割尺寸、运行历史和会话导航。 (#8261)
  - 灵活的调度选项 — 支持间隔、日历周期、cron 和时间窗口计划，并具备无损转换保护和本地化的下次运行描述。 (#8261)
  - 推荐模板以草稿形式打开 — 推荐模板以禁用的 ask 草稿形式打开，供用户在启用执行前审查提示词、范围和权限。 (#8261)
  改进
  - 工作区面板尺寸与状态 — 聊天面板可缩小至 400px，主题栏操作折叠进“更多”菜单，面板宽度统一并按项目记忆，工作区面板的滚动和面包屑也得到优化。 (#8748)
  - 已调整大小的输入框随内容增长 — 手动调整过的输入框会在长草稿下超过已保存的最小高度，内容缩短后回落，并继续遵守现有的视口高度上限。 (#9142)
  - 置顶区域标题 — 紧凑型工作台侧栏的“置顶”区域标题现在包含装饰性图钉图标和专用的非交互样式。 (#5899)
  - 问题报告渠道更新 — 问题表单现在列出 v2 和 v3 Studio 版本线，移除了 v1 并更新了自动标签。 (#9151)
  修复
  - 输入框折行时闪现“回到底部” — 当尾部跟随仍控制视口时同步固定对话尾部，避免输入框内容增长并折行、压缩可见对话高度时短暂闪现“回到底部”按钮。 (#9179)
  - 侧栏会话索引不完整 — 检测并修复持久化的就绪目录投影，当实时会话行数与已完成扫描总数不匹配时，从权威 JSONL 文件协调缺失的会话和主题行。 (#9164)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
