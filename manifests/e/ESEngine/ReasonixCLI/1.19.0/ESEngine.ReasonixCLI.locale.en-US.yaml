  概览
  Reasonix v1.19.0 — 新增提供商支持、加固会话与优化桌面体验
  此版本新增 DeepSeek Anthropic 与 Responses API 支持，改进模型轮询性能，加固会话持久性与权限处理，并修复多项桌面 UI 问题。
  发布日期：2026-08-01
  重点内容
  - 支持 DeepSeek Anthropic 兼容端点 — 新增可选的 DeepSeek Anthropic 兼容 Messages 端点预设，正确处理无符号推理块、纯文本输入和自动缓存。 (#7103)
  - 加固的 Responses API 支持 — 新增 Responses API 提供商类型，包括 DeepSeek 的无状态模式、正确的工具调用处理以及过期响应 ID 的自动重试。 (#7099)
  - 设置中模型列表加载更快 — 模型轮询现在批量进行并缓存，减少配置多个提供商时的卡顿。通过基于指纹的失效机制防止过期写入。 (#7094)
  - 会话与权限加固 — 修复了会话持久性、转向和权限处理中的多个回归，包括无头 Ask 的失败关闭和并行任务批次限制。 (#7077, #7074, #7078)
  - 桌面 UI 修复 — 修复了终端抽屉布局、决策卡片溢出，以及切换会话后粘贴文本和文件引用卡片的保留问题。 (#7072, #7069, #7064)
  新功能
  - DeepSeek Anthropic 预设 — 新增可选的 DeepSeek Anthropic 兼容端点预设。 (#7103)
  - Responses API 提供商类型 — 新增 Responses API 提供商类型，支持 DeepSeek 无状态模式。 (#7099)
  - ACP 监督者状态与硬覆盖 — 新增显式 ACP 运行时覆盖和会话状态报告。 (#7097)
  - DeepSeek V4 Flash 低推理档位 — 为 deepseek-v4-flash 开放 'low' 推理档位。 (#7102)
  - 富样式 Markdown 链接 — 在助手消息中为 GitHub、外部和邮件链接添加图标和简洁标签。 (#6976)
  改进
  - 模型轮询性能 — 批量并缓存模型轮询，防止过期写入。 (#7094)
  - DeepSeek 截断回复继续 — 使用助手前缀补全自动继续被截断的 DeepSeek 回复。 (#7101)
  - Gemini 思维签名保留 — 在函数调用中保留 Gemini 思维签名，包括旧格式。 (#7092)
  - 远程工作台 CLI 供给 — 通过 SSH 提供精确 CLI 版本，并验证下载。 (#7105)
  - 终端抽屉重新设计 — 终端现在是独立的底部抽屉，带有调整大小手柄和动画。 (#7072)
  - 稳定版/预览版发布历史分离 — 分离稳定版和预览版的发布历史。 (#7076)
  - Windows Terminal 真彩色检测 — 修复真彩色检测并统一颜色能力处理。 (#7053)
  修复
  - GLM Coding Plan 默认模型 — 修复 GLM Coding Plan Anthropic 预设的默认模型。 (#7113)
  - 诊断建议证据门 — 保留诊断建议而不削弱证据要求。 (#7086)
  - 会话持久性与转向 — 加固会话追加持久性和延迟转向准入。 (#7074)
  - 权限处理 — 使受保护执行可预测，包括无头 Ask 的失败关闭。 (#7078)
  - 行内数学策略 — 将行内数学分类迁移到 remark AST，修复货币与数学检测。 (#7073)
  - LaTeX 复制保留 — 复制渲染数学时保留原始 LaTeX。 (#7007)
  - 会话恢复与 Qwen 上下文限制 — 加固会话恢复并为 Qwen 预设应用按模型上下文限制。 (#6971)
  - 粘贴文本与文件引用卡片 — 切换会话后保留粘贴文本和文件引用内联卡片。 (#7064)
  - 右侧栏和状态栏数据持久化 — 切换会话后持久化最新执行器回合的上下文填充和令牌分解。 (#6995)
  - 决策卡片溢出 — 防止决策卡片溢出到状态栏后面。 (#7069)
  - 分离运行时重新附加 — 通过重新附加分离运行时修复快速切换会话。 (#6957)
  - 空 effort 级别编码 — 在工作区目录中将空 effort 级别编码为数组而非 null。 (#6992)
  - BranchMeta 范围固定 — 固定新会话的范围，防止项目到全局的错误分类。 (#6967)
  - Anthropic 风格用量回退 — 在 OpenAI 兼容响应中规范化 Anthropic 风格用量计数器。 (#6940)
  - 阻塞时重置空闲计数 — 在 [goal:blocked] 时重置 idleTurns，防止过早空闲拦截。 (#6960)
  - 过期报告清理年龄计算 — 从整个报告正文而非版本字段计算清理年龄，并要求 bug 标签。 (#7060)
  - 关闭旧报告前询问 — 在关闭无法确认的旧报告前询问报告者验证。 (#7058)
  - 发布验证请求 — 要求报告者在包含其修复的发布上验证。 (#7057)
