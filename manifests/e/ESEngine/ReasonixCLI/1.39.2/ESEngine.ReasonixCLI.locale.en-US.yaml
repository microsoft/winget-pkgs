  - [CLI] reasonix setup 保留你输入的 API Key 变量名 — 设置向导会询问 API Key 变量名，但此前总是把密钥存到自动生成的 REASONIX_CONNECTION_…_KEY 里。现在会使用你输入的名字；如果该变量已被其他提供方、配置项或环境占用，向导会说明被谁占用并请你重新输入；直接回车仍由 Reasonix 自动选择一个私有名字。 (#11005 by @esengine)
