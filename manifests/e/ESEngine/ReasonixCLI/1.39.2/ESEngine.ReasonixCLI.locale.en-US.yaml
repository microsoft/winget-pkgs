ReleaseNotes: |-
  桌面端与 CLI 修复：打不开或归档不掉的会话、切换会话后的实时流式显示、手动调用技能、设置向导的 API Key 变量名，以及中文 Windows 上的输出乱码。
  发布渠道：稳定版 · v1.39.2
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.39.2 — Reasonix 1.39.2
  桌面端与 CLI 修复：打不开或归档不掉的会话、切换会话后的实时流式显示、手动调用技能、设置向导的 API Key 变量名，以及中文 Windows 上的输出乱码。
  发布日期：2026-09-27
  Desktop 25 · CLI 14
  桌面端更新
  重点内容
  - [Desktop] 打不开、也删不掉的会话恢复正常 — 历史里同一条消息被记录两次的会话会打不开，也无法移到废纸篓，只提示一个笼统的错误。现在这类会话可以正常打开（以第一条为准，磁盘上的文件不会被改写）；文件损坏的会话也总能移到废纸篓，并给出明确提示；新的写入也不会再产生重复消息。 (#10893 by @esengine)
  - [Desktop] 归档的旧会话会从侧栏消失 — 归档 1.38 留下的「已恢复」旧会话时，会一次归档它的所有恢复副本，不会再归档一条又冒出下一条；被列在错误工作区下的旧会话（带分支标记的、或以原始文件名为标题的）也不会再卡在侧栏、既删不掉又不能置顶/重命名/打开。归档的内容都可以在归档列表里恢复。 (#10883 by @esengine, #11022 by @esengine)
  - [Desktop] 切换会话后回复重新实时流式显示 — 从旧话题路径打开的会话（例如在侧栏切换过去）在整轮结束前看不到任何思考或回答。现在会像 CLI 一样边生成边显示。 (#10973 by @esengine)
  - [Desktop] 缓存清理后仍能加载更早的历史 — 长会话里向上翻加载更早消息时，如果会话缓存已被清理且会话在打开后有过变化，不会再加载失败、重试也无效。 (#10997 by @KHG420)
  - [Desktop · CLI] 手动调用技能时，模型收到的内容与工具调用一致 — 只包含 /技能名 的消息（或桌面端输入框里单独的技能标签）现在与 run_skill 以同一种形式发给模型，你输入的参数也会单独标出。技能路由按你实际输入的内容判断，而不是技能正文：一个技能正文里提到另一个技能时，不会再让模型把两个都加载；句子中间出现「用 X 技能」之类的说法也不会再强制调用技能。 (#11007 by @esengine, #11023 by @KHG420)
  改进
  - [Desktop] 上下文面板的运行时间在长时间工具执行中持续计时 — 上下文面板和上下文环里的运行时间不再在两次模型请求之间停住，长会话显示的是真实运行时长。 (#10925 by @esengine)
  - [Desktop] 历史搜索能找到工具输出里的内容 — 历史面板的内容搜索现在也会匹配工具结果（例如 MCP 服务器列表失败的输出），并且每个会话只读取一次。 (#10938 by @esengine)
  - [Desktop] 启动较慢时侧栏会提示正在读取项目 — 项目列表返回之前，侧栏显示加载状态，而不是先闪一下「还没有项目」。 (#10979 by @KHG420)
  - [Desktop] 工作区内的符号链接会显示在文件面板中 — 文件面板和 @ 菜单会列出目标仍在工作区内的符号链接；悬空或指向工作区外的链接不显示，也无法预览。 (#10888 by @esengine)
  - [Desktop · CLI] 重新打开的会话读取保持快速 — 会话重新打开后，新消息会同步更新磁盘上的索引，之后读取不再从完整日志重建。 (#10977 by @KHG420)
  - [Desktop · CLI] Git worktree 中的沙箱拒绝会提示该放行哪些目录 — 在关联的 Git worktree 中，git add 因沙箱拦截主仓库的 Git 元数据而失败时，bash 会提示需要放行的最小目录，绝不会建议放行整个 .git 目录。 (#11003 by @KHG420)
  - [Desktop · CLI] 环境说明区分工具 shell 与你的登录 shell — 当你的登录 shell 是 fish 或 zsh 时，模型会知道它的 bash 工具仍然运行在 bash 中，给出的 shell 建议与实际执行环境一致。 (#10902 by @KHG420)
  修复
  - [Desktop] 远程 Ask 卡片只显示一次且可以提交 — 在 SSH 远程工作区里，智能体的提问会出现两张卡片且都无法提交。现在只显示一张，并能正常提交。 (#10914 by @esengine)
  - [Desktop] SSH 项目不再出现在输入框上方的本地文件夹菜单里 — 已固定的 SSH 项目曾被当作本地文件夹列出，选中就报错。现在它们只在侧栏的远程分组中出现。 (#10955 by @esengine)
  - [Desktop] 等待中的审批或提问只通知一次 — 桌面端每次重新同步标签页时，系统通知和机器人监听的聊天不会再重复推送同一个审批或提问。 (#10934 by @esengine, #10942 by @esengine)
  - [Desktop] 写入会话自己的临时目录不再请求扩大范围 — write_file 写入应用自有的会话临时目录时不再每次都弹出扩大写入范围的请求；其他目录仍走正常审批。 (#10890 by @KHG420)
  - [Desktop] 单个 ~ 不再被渲染成删除线 — 像 500~1000 这样的范围按原样显示；文字 仍是删除线。 (#10886 by @esengine)
  - [Desktop · CLI] 编辑含中日韩文字的 UTF-8 文件不再改动未编辑的字节 — 文件中有个别无效字节时，edit_file 等工具可能改写远离编辑处的字符。现在只有能原样往返时才把文件当作 GB18030 或 GBK 处理。 (#10892 by @esengine)
  - [Desktop · CLI] 中文 Windows 上的命令输出和 MCP 报错可以正常阅读 — bash 工具命令的输出和 MCP 服务器启动报错按控制台代码页正确解码，不再是乱码；在 UTF-8 字符中间被截断的输出也不会再整体显示成乱码。 (#10918 by @esengine, #10912 by @esengine, #10948 by @esengine)
  - [Desktop · CLI] 经 Responses 中转的工具调用能正常执行 — 中转服务丢掉单个工具调用的完成事件时，现在会按完成响应里列出的调用继续执行，而不是提前结束这一轮。 (#10924 by @esengine)
  - [Desktop · CLI] StepFun 预设带上上下文窗口 — StepFun 模型现在会显示上下文用量，并按 262144 token 的上限自动压缩；已安装但没有设置窗口的 StepFun 配置会自动补上。 (#10930 by @esengine)
  - [Desktop · CLI] 子代理留在你选择的提供方上 — 只写模型名、不带提供方的子代理，现在会在父会话的提供方支持该模型时留在同一提供方，而不是跑到第一个列出它的提供方。 (#10929 by @esengine)
  - [Desktop · CLI] OpenCode Go 的 minimax-m2.7 走正确的接口 — minimax-m2.7 只在 OpenCode Go 实际提供它的 Anthropic 接口上出现。 (#10961 by @esengine)
  - [Desktop · CLI] web_fetch 在 fake-ip 代理下可用 — 在 Clash 或 mihomo 的 fake-ip 模式下，web_fetch 不再拒绝所有公网站点；它会连接允许的地址，只解析到内网地址的主机仍会被拒绝。 (#10909 by @esengine)
  - [Desktop · CLI] 云盘目录下的项目能正常加载配置 — 在 Windows 上，位于 Box Drive 等云盘挂载目录中的工作区不再每次加载配置都报路径错误。 (#10904 by @esengine)
