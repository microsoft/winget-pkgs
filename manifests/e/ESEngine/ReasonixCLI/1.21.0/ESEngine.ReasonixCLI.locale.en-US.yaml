ReleaseNotes: |-
  此版本引入了结构化的 Shell 执行契约与分阶段错误报告，提升了提示缓存命中率与成本核算精度，并带来一系列 CLI 与桌面端改进——包括流恢复、会话临时文件持久化以及焕新的官网。
  发布渠道：稳定版 · v1.21.0
  English → · 网页版完整更新日志 →
  使用攻略
  - Shell 执行契约 — 了解 Reasonix 如何为每条命令报告 Shell 身份、退出阶段与验证状态。
  - 会话临时文件 — Bash 临时文件现在在会话内的多条命令间持久保留，并自动清理。
  - CLI 用量回执 — 现在可以在 TUI 中隐藏每轮 token/费用回执，同时保持用量统计活跃。
  概览
  Reasonix v1.21.0 — Reasonix 1.21.0：Shell 执行契约、缓存精度与 CLI 打磨
  此版本引入了结构化的 Shell 执行契约与分阶段错误报告，提升了提示缓存命中率与成本核算精度，并带来一系列 CLI 与桌面端改进——包括流恢复、会话临时文件持久化以及焕新的官网。
  发布日期：2026-08-06
  重点内容
  - 结构化 Shell 执行与分阶段错误报告 — Shell 命令现在携带内部元数据（Shell 身份、平台、退出码、失败阶段、变更风险、验证状态），在桌面端、CLI 和 ACP 中准确呈现错误。Provider 可见的工具 schema 保持不变。 (#7757)
  - 提示缓存命中率与成本精度提升 — 自适应 Anthropic 缓存 TTL 在空闲后延长缓存窗口，减少不必要的重写。缓存诊断现在正确归因变更，成本核算包含缓存写入溢价以实现准确计费。 (#7724, #7751)
  - 流中断恢复 — 中断的 Provider 流现在可原子重放最多五次，防止部分工具执行。桌面端、CLI 和 ACP 界面会回滚推测性输出，直到收到干净的终止事件。 (#7737)
  - 会话级 Bash 临时文件持久化 — Bash 临时文件现在通过私有会话目录在会话内的多条命令间持久保留，同时保持每条命令的沙箱隔离。自动轮换与清理防止泄漏。 (#7664)
  - CLI 打磨：滚动、补全与键盘操作 — 对话滚动现在正确跟随输出，斜杠命令补全被缓存以提升响应速度，键盘快捷键得到优化：Ctrl+Backspace 删除单词，Ctrl+Insert/Shift+Insert 处理剪贴板操作。 (#7706, #7690, #7656)
  - 桌面端：空白会话 Provider、待办面板与 Windows 快捷方式修复 — 复用的空白会话现在遵循默认 Provider。待办面板根据 todo_write 事件实时更新。因版本化升级而损坏的 Windows 快捷方式会被自动修复。 (#7736, #7709, #7752)
  - 移除 Goal token 硬上限 — 移除了每个 Goal 的 token 硬上限与请求准入中间件，防止工作提前暂停。轮次配额与无进展保护仍然有效。 (#7725)
  - SWE-bench Verified 评估模式 — e2ebench 现在支持 SWE-bench Verified，在官方评估镜像内运行 Agent 并限制网络出口，以获得诚实、可审计的分数。 (#7733)
  - 官网焕新：以 Agent 能力为先 — 着陆页现在以 Agent 的能力为先，展示真实任务回放、更新的功能卡片以及展示全部四种前端界面的新 Surfaces 区块。 (#7759)
  新功能
  - CLI：隐藏每轮用量回执 — 新增 [ui].show_turn_usage 配置，可在 TUI 中隐藏 token/费用回执，同时保持用量统计活跃。 (#7656)
  - CLI：版本元信息与 Shell 补全 — reasonix version --verbose/--json 显示提交与构建时间。Shell 补全注册表与实际解析器对齐。 (#7740)
  - CLI：Ctrl+Insert 复制与 Shift+Insert 粘贴 — 新增经典终端剪贴板快捷键：Ctrl+Insert 复制选中内容，Shift+Insert 通过原生剪贴板粘贴。 (#7656)
  改进
  - CLI：回退选择器显示真实用户提示并可滚动 — 回退选择器现在显示用户的原始输入而非组合后的 Provider 提示，并在长会话中于视口内滚动。 (#7656)
  - CLI：run --resume 接受机器会话 ID — 一次性 run --resume 现在除了文件系统路径外，还能解析不透明的机器会话 ID。 (#7656)
  - CLI：--profile 标志路由至交互式会话 — 无子命令的 reasonix --profile … 现在按文档正确路由至交互式会话路径。 (#7656)
  - CLI：诊断、密钥环迁移与 Reasonix-home 加固 — 启动诊断现在提供进度与有界恢复信号；密钥环迁移在超时或错误时安全停止；CLI 工具统一使用准确的 Reasonix home，并在报告中隐藏路径。 (#7663)
  - 桌面端：macOS 工作台侧边栏标题栏缩放 — 在 macOS 上双击工作台侧边栏上方的空白标题栏区域现在会触发原生窗口缩放。 (#4754)
  - Serve：为迟到的 SSE 客户端重放待处理提示 — 当浏览器在确认门控工具排队后连接到 reasonix serve 时，现在会重放待处理的批准提示。 (#7708)
  - 文档与国际化整合 — 整合文档更新，包括简体中文推理 Provider 参考、移除未使用的 i18n 键以及完成语言环境翻译。 (#7764)
  修复
  - 桌面端：修复 Windows 卸载注册项 — 从旧版 Tauri 安装升级不再留下可能删除当前安装的过期卸载条目。 (#7729)
  - 发布：容忍 npm 注册表可见性延迟 — 将 npm 注册表可见性窗口延长至 5 分钟，防止发布停滞。 (#7629)
  升级提醒
  - 无需手动迁移 — 可直接升级到 v1.21.0；现有配置与会话保持兼容。 (#7773, #7780)
  风险提示
  当前没有需要额外操作的已知风险。
