ReleaseNotes: |-
  桌面端可靠性与易用性改进，包括统一会话持久化、目标生命周期修复和安装程序更新。
  发布渠道：稳定版 · v1.38.8
  English → · 网页版完整更新日志 →
  使用攻略
  - 会话存储 v4 — 了解新的会话存储格式和迁移。
  - 会话 v4 实现报告 — 会话 v4 的详细实现报告。
  概览
  Reasonix v1.38.8 — Reasonix 1.38.8
  桌面端可靠性与易用性改进，包括统一会话持久化、目标生命周期修复和安装程序更新。
  发布日期：2026-09-14
  Desktop 21 · CLI 10
  桌面端更新
  重点内容
  - [Desktop · CLI] 统一会话持久化并支持大会话恢复 — 会话现在使用规范存储服务和新的 v4 格式，支持大会话恢复，不再受之前 128 MiB 重放上限限制。 (#10257)
  - [Desktop · CLI] 修复目标生命周期恢复与宿主控制 — 恢复后的目标会在续跑轮次中保留原有任务内容，并拒绝过期操作以保留用户暂停状态。 (#10249)
  - [Desktop] 优化桌面端模型与工作区导航 — 模型选择器现在提供提供商筛选、收藏和全目录搜索，工作区停靠栏为空时自动打开概览。 (#10196)
  - [Desktop] 修复桌面更新并精简原生安装包 — macOS 更新现在能正确解析应用包，原生安装包体积显著减小。 (#10194)
  新增
  - [Desktop · CLI] 统一会话持久化 — 会话现在使用规范存储服务和新的 v4 格式，支持大会话恢复，不再受之前 128 MiB 重放上限限制。 (#10257)
  - [Desktop] 模型选择器重新设计 — 模型选择器现在提供提供商筛选、收藏和全目录搜索。 (#10196)
  改进
  - [Desktop · CLI] 简化文件编辑与错误恢复 — 文件编辑会核对读取时观察到的版本；普通工具错误不再通过证据或恢复确认门禁阻塞后续工作。权限策略、沙箱和计划批准仍然生效。结果未知的外部操作会保留记录，不会自动重放。 (#10223, #10209, #10198)
  - [Desktop · CLI] 目标生命周期对齐 — 目标状态变更现在会拒绝过期操作，保留用户暂停状态，并防止多个续跑轮次重叠。 (#10247)
  - [Desktop] 慢启动时显示启动提示 — 快速启动直接打开应用；较慢的启动会显示轻量级启动提示。 (#10172)
  修复
  - [Desktop · CLI] 修复会话关闭与 Windows 恢复 — 修复会话关闭与后台状态读取之间的数据竞争。Windows 路径大小写变化会复用同一个会话写入器，会话切换失败后也会正确释放此前的文件句柄。 (#10263)
  - [Desktop] 修复便携包首次启动 — 首次启动迁移程序现在能按便携包内的正确文件名找到 CLI。 (#10214)
  - [Desktop · CLI] 目标生命周期恢复 — 恢复后的目标会在续跑轮次中保留原有任务内容，并拒绝过期操作以保留用户暂停状态。 (#10249)
  - [Desktop] 桌面更新和更小的安装包 — macOS 更新现在能正确解析应用包，原生安装包体积显著减小。 (#10194)
  - [Desktop] 安装程序重试扫描器锁定的文件 — Windows 安装程序现在会重试瞬态文件锁，并提供重试选项。 (#10219)
  - [Desktop] 直接启动可找到服务 — 直接启动 Reasonix.exe 现在能正确定位桌面服务。 (#10215)
  - [Desktop] Linux 包权限 — 修复 Linux 安装包的应用目录权限，普通用户可以正常读取并进入该目录。 (#10213)
  - [Desktop] 修复对话区拖动问题 — 对话区 no-drag 不再穿透 Electron 标题栏。 (#10154)
  CLI 端更新
  重点内容
  - [Desktop · CLI] 统一会话持久化并支持大会话恢复 — 会话现在使用规范存储服务和新的 v4 格式，支持大会话恢复，不再受之前 128 MiB 重放上限限制。 (#10257)
  - [Desktop · CLI] 修复目标生命周期恢复与宿主控制 — 恢复后的目标会在续跑轮次中保留原有任务内容，并拒绝过期操作以保留用户暂停状态。 (#10249)
  新增
  - [Desktop · CLI] 统一会话持久化 — 会话现在使用规范存储服务和新的 v4 格式，支持大会话恢复，不再受之前 128 MiB 重放上限限制。 (#10257)
  改进
  - [Desktop · CLI] 简化文件编辑与错误恢复 — 文件编辑会核对读取时观察到的版本；普通工具错误不再通过证据或恢复确认门禁阻塞后续工作。权限策略、沙箱和计划批准仍然生效。结果未知的外部操作会保留记录，不会自动重放。 (#10223, #10209, #10198)
  - [Desktop · CLI] 目标生命周期对齐 — 目标状态变更现在会拒绝过期操作，保留用户暂停状态，并防止多个续跑轮次重叠。 (#10247)
  修复
  - [Desktop · CLI] 修复会话关闭与 Windows 恢复 — 修复会话关闭与后台状态读取之间的数据竞争。Windows 路径大小写变化会复用同一个会话写入器，会话切换失败后也会正确释放此前的文件句柄。 (#10263)
  - [Desktop · CLI] 目标生命周期恢复 — 恢复后的目标会在续跑轮次中保留原有任务内容，并拒绝过期操作以保留用户暂停状态。 (#10249)
  升级提醒
  - [Desktop · CLI] 工具变更可能使提示缓存首次失效 — 旧证据工具的移除和工具描述变更会改变升级后的请求前缀，首次请求可能无法复用原有缓存；后续轮次保持稳定的工具顺序和前缀。 (#10223)
  - [Desktop · CLI] 会话迁移与降级说明 — 继续旧会话时会迁移到独立的 v4 目录，原始文件保持不变。旧版本无法读取新增的 v4 历史，请同步更新桌面端和 CLI。浏览或迁移会话不会自动续跑目标，也不会恢复执行批准。 (#10257)
  - [Desktop] 1.38.4 之前的客户端需要手动更新 — v1.38.3 或更早版本的桌面端无法在应用内更新，必须手动安装完整包。 (#10218)
  风险提示
  - [Desktop · CLI] 超大会话首次建立索引需要时间 — 参考测试中，1 GiB 历史的首次索引构建耗时约 115 秒。构建可以取消，该测量值不代表会话容量上限。 (#10257)
