  其他项目更新
  - [Service] 崩溃仪表板 1101 修复 — 限制 D1 分组详情读取并限制 facet 数量，防止 Worker 1101 错误。 (#9756)
  - [Site · Service] 网站 D1 查询优化 — 为论坛和注册表查询添加性能索引和 keyset 分页。 (#9752)
  升级提醒
  本版本无需手动迁移。
