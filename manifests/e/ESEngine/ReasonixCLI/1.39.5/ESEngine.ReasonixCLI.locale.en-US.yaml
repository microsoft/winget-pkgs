ReleaseNotes: |-
  项目配置与沙盒的安全加固、上下文整理不再无限等待，以及若干桌面端修复。
  发布渠道：稳定版 · v1.39.5
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.39.5 — Reasonix 1.39.5
  项目配置与沙盒的安全加固、上下文整理不再无限等待，以及若干桌面端修复。
  发布日期：2026-09-29
  Desktop 13 · CLI 8
  桌面端更新
  重点内容
  - [Desktop · CLI] 项目配置只能收紧你的设置 — 仓库里的 reasonix.toml 和 .reasonix/settings.json 不能再放宽沙盒、权限和审批设置，只能让它们更严格。项目声明的程序（钩子、语言服务器、模型服务商、shell、ripgrep 和浏览器路径）首次使用前需要你批准，声明或相关文件变化后会再次询问。在项目里选择的「总是允许」改为保存在你的 Reasonix 主目录，而不是写进仓库。 (#11209 by @esengine)
  - [Desktop · CLI] 上下文整理有时间上限，失败时保留原有上下文 — 接近上限的对话在整理时可能无限等待，因为服务端心跳一直让请求保持活跃。现在每次整理有统一的五分钟上限；摘要失败时保留最后一次确认的上下文，不再退回有损截断。 (#11171 by @SivanCola)
  改进
  - [Desktop] 保存权限规则时拒绝未知工具名 — 桌面设置不再保存像 deny = ["rm"] 这样不对应任何已注册工具、永远不会生效的规则，并给出应写成的 Bash(...) 形式；MCP 服务暂时断开时，它的工具名仍可保存。 (#11185 by @KHG420)
  - [Desktop · CLI] 模型请求失败的诊断信息在收尾和重启后保留 — 模型请求失败后，最终状态与失败分类在收尾时不再丢失，重新打开会话后仍能看到。发给模型的内容和重试策略不变。 (#11152 by @SivanCola)
  - [Desktop] 标题栏图标跟随主题配色 — 标题栏图标改用主题强调色，在深色主题下也清晰可见。 (#11188 by @esengine)
  修复
  - [Desktop] 路径相近的两个项目不再共用会话 — 像 front-end/app 与 front/end-app 这样的工作区会映射到同一个项目目录，一个项目里保存的会话可能出现在另一个项目中。现在新添加的项目若发生冲突会使用独立目录，已有项目保持不变。 (#11190 by @KHG420)
  - [Desktop] 归档旧会话时一并归档它的所有版本 — 归档旧版本留下的会话时，它的其他版本仍留在侧边栏，看起来像是归档后又出现。现在会一并归档所有版本。 (#11187 by @esengine)
  - [Desktop] 旧版 Linux 便携安装升级失败时恢复原版本 — Linux 便携版 1.18 至 1.19.2 的更新程序可能只解出部分文件。现在迁移程序会拒绝这种不完整的更新并恢复原版本，不再留下无法启动的安装。 (#11182 by @esengine)
  CLI 端更新
  重点内容
  - [Desktop · CLI] 项目配置只能收紧你的设置 — 仓库里的 reasonix.toml 和 .reasonix/settings.json 不能再放宽沙盒、权限和审批设置，只能让它们更严格。项目声明的程序（钩子、语言服务器、模型服务商、shell、ripgrep 和浏览器路径）首次使用前需要你批准，声明或相关文件变化后会再次询问。在项目里选择的「总是允许」改为保存在你的 Reasonix 主目录，而不是写进仓库。 (#11209 by @esengine)
  - [Desktop · CLI] 上下文整理有时间上限，失败时保留原有上下文 — 接近上限的对话在整理时可能无限等待，因为服务端心跳一直让请求保持活跃。现在每次整理有统一的五分钟上限；摘要失败时保留最后一次确认的上下文，不再退回有损截断。 (#11171 by @SivanCola)
  改进
  - [Desktop · CLI] 模型请求失败的诊断信息在收尾和重启后保留 — 模型请求失败后，最终状态与失败分类在收尾时不再丢失，重新打开会话后仍能看到。发给模型的内容和重试策略不变。 (#11152 by @SivanCola)
  升级提醒
  - [Desktop · CLI] 项目声明的程序需要批准一次 — 项目 reasonix.toml 或 .reasonix/settings.json 里声明的钩子、语言服务器、模型服务商、tools.shell.path、tools.search.rg_path 和 [browser] 设置，在你批准前不会生效：在项目目录运行 reasonix trust 查看（reasonix trust --yes 批准），或在桌面端的钩子设置里批准。只指向未批准项目服务商的模型设置会回落到你自己的设置。
  - [Desktop · CLI] 批准按文件夹分别记录 — 同一仓库的每个工作树、每个其他文件夹都需要分别批准。
  - [Desktop · CLI] 不再接受位于工作区内的程序路径 — tools.shell.path、tools.search.rg_path 和 browser.chrome_path 不能再指向工作区、临时目录、allow_write 目录或工具链缓存里的程序，请改为指向已安装的程序。
  - [Desktop · CLI] 沙盒、权限和代理设置只取你自己的配置 — 项目只能让 [sandbox] 和 [permissions] 更严格；permissions.mode、allow、allow_dynamic_bash、[network] 代理设置和默认工具审批模式都取自你的用户配置。项目里不再生效的设置会在加载时以警告列出。
  - [Desktop · CLI] 机器人只读取你自己的配置 — 不再读取项目 reasonix.toml 里的 [bot] 段，桌面端也不再把项目的 reasonix.toml 合并进你的配置。请把机器人设置移到用户配置中。
  风险提示
  当前没有需要额外操作的已知风险。
  下载与安装
  - 官网按平台下载
  - 查看完整差异
