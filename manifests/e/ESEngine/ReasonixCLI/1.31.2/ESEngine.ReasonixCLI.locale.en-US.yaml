ReleaseNotes: |-
  此版本修复了 Windows 上会话滚动问题，并通过一键配置路径简化了 OpenCode Go 的设置。
  发布渠道：稳定版 · v1.31.2
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.31.2 — 桌面稳定性与提供商配置改进
  此版本修复了 Windows 上会话滚动问题，并通过一键配置路径简化了 OpenCode Go 的设置。
  发布日期：2026-08-21
  重点内容
  - Windows 上稳定的会话滚动 — 通过统一行几何、测量缓存和快照验证，修复了长会话中向上滚动闪回的问题。为测试构建和设置 → 诊断添加了前端诊断功能。 (#9240)
  - 简化 OpenCode Go 配置 — OpenCode Go 现在与 DeepSeek 共享特色提供商级别，提供一键设置，包含安全基础路由和路由感知的输出预算。 (#9245)
  改进
  - OpenCode Go 设置流程 — 为 DeepSeek 和 OpenCode Go 添加了特色提供商设置流程，只需一个 API 密钥和安全基础路由。旧版、Anthropic、Responses 和 DeepSeek 搜索路由仍然可用。 (#9245)
  - 路由感知的输出预算 — 添加了路由/模型感知的输出预算，当提供商报告较低的完成限制时进行一次安全重试。流式请求在第一个输出事件后不会重试。 (#9245)
  修复
  - 会话滚动闪回 — 通过添加状态感知的行几何、会话范围的 LRU 测量缓存、快照验证以及在手动滚动期间禁用浏览器滚动锚定，修复了向上滚动闪回问题。 (#9240)
  - 前端诊断 — 为测试构建和设置 → 诊断添加了经过清理的前端诊断记录器，不导出文本、路径、稳定 ID 或会话标识符。 (#9240)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
  致谢
  感谢本版本的贡献者：@SivanCola
