  - 独立会话 — 了解独立会话的工作原理及其生命周期。
  - 管理页面 — 探索会话和归档的管理页面。
  - 对话记录架构 — 对话记录架构及其组件的详细信息。
  - Windows Agent Shell — 了解持久 PowerShell 如何在 Windows 上保留状态并报告命令完成情况。
  - Windows 安装程序验收 — Windows 安装程序构建的验收标准。
  概览
  Reasonix v1.38.10 — Reasonix 1.38.10
  此版本重点提升会话可靠性、Windows 升级与 Agent 执行、文件路径处理和对话记录稳定性。
  发布日期：2026-09-17
  Desktop 36 · CLI 2
  桌面端更新
  重点内容
  - [Desktop] 更可靠的会话管理 — 会话现在在重启后保持身份和历史记录，归档和回收站处理得到改进。 (#10440, #10396, #10437)
  - [Desktop] 更快的本地历史加载 — 切换标签页时，本地会话历史立即显示，无需等待运行时启动。 (#10414, #10423)
  - [Desktop · CLI] Windows 路径和升级修复 — 修复了 Windows 文件 URI、CLI 诊断、旧会话升级和安装程序身份问题。 (#10459, #10451)
  - [Desktop] 可展开会话与工作区上下文 — 侧栏现在每个项目或分组显示 5 个会话，可分批展开，新会话支持项目和分支上下文。 (#10426)
  - [Desktop] 重启后保留压缩上下文 — 压缩后的模型上下文现在在切换会话、重启和导入旧会话后仍然保留。 (#10430)
  - [Desktop] 修复用户消息历史分页 — 发送的消息在历史页面回收或确认超出可见窗口时不再重复或消失。 (#10438)
  新增
  - [Desktop] 统一模型凭据恢复 — 桌面端与 CLI 现在共享凭据槽、回执和恢复服务，防止缺失凭据进入新对话轮次。 (#10460)
  - [Desktop] 统一 Windows 桌面启动入口 — Reasonix.exe 现在是 Windows 的规范 GUI 入口，同时保留旧启动器的兼容性。 (#10439)
  - [Desktop] 后台对话通知 — 后台对话现在无需切换标签页即可播放提示音并显示通知。 (#10382)
  改进
  - [Desktop] 项目树展开与缓存逻辑 — 项目树现在使用五行初始窗口和五行增量，缓存失效与可见性分离。 (#10447)
  - [Desktop] 默认按创建时间排序 — 此版本首次启动时，现有工作台排序偏好一次性重置为创建时间。 (#10444)
  - [Desktop] 拦截 Windows 便携版共享目录启动 — 现在在 Electron 启动前拒绝从 UNC 和映射远程驱动器启动 Windows 便携版。 (#10442)
  - [Desktop] 修复目录迁移的未读基线 — 迁移的历史记录不再因占位读取基线而显示蓝色未读点。 (#10428)
  - [Desktop] 修复规范会话未读状态 — 未读状态现在只跟踪可见的终端助手结果，而不是元数据更改。 (#10424)
  - [Desktop] 本地会话持久化操作与运行时解耦 — 会话操作现在通过显式 SessionRef 解析，改进了标题 CAS 和生命周期防护。 (#10409)
  - [Desktop] 自动修复官方供应商协议与端点冲突 — 当 URL 唯一匹配目录路由时，现在会自动修复冲突的官方供应商协议/端点设置。 (#10411)
  - [Desktop] 按正式构建身份限制桌面更新器 — 更新器现在在 canary、preview、test、dev 和 prerelease 构建中禁用，自动检查限制为每六小时一次。 (#10406)
  - [Desktop] 统一会话归档、回收站与历史恢复 — 归档会话现在使用一个持久生命周期：正常会话 → 回收站 → 恢复或永久删除。 (#10396)
  - [Desktop] 完善旧版对话迁移并排除重复恢复副本 — 桌面升级现在跨代发现并整合旧版历史，不重复恢复副本。 (#10395)
  - [Desktop] 修复消息身份、工具状态与持久 PowerShell — 单次发送不再渲染两次，Windows Agent 执行使用带结构化完成的持久 PowerShell。 (#10392)
  - [Desktop] 将命令面板搜索移至侧栏底部 — 命令面板搜索操作从主题栏移至侧栏底部的第一个插槽。 (#10390)
  - [Desktop] 关闭最后一个标签页后自动收起工作区 — 关闭最后一个工作区标签页现在会收起整个右侧停靠栏，并将其空间返回给对话。 (#10388)
  - [Desktop] 修复迁移后会话 AI 重命名失败 — AI 重命名现在从规范持久历史中读取用户消息，修复了迁移对话的重命名失败。 (#10389)
  - [Desktop] 统一会话同步与完成机制 — 已完成、取消或重新连接的聊天不再丢失可见文本或显示过时的运行状态。 (#10385)
  - [Desktop] 暂停与恢复改为追加式终结 — 停止一个轮次并打开另一个对话不再导致持久历史不可读。 (#10383)
  - [Desktop] 恢复项目树并整合会话恢复修复 — 恢复了 ProjectTree 工作台侧栏，并整合了会话、历史、聊天显示和终端修复。 (#10380)
  - [Desktop] 升级 Desktop SessionID 会话架构 — 桌面规范会话现在仅按 SessionID 持久化，防止切换或重启后消失。 (#10326)
  修复
  - [Desktop] 保持迁移会话的身份并清除恢复后的错误提示 — 启动和继续读取历史时复用已迁移的会话身份，避免元数据刷新后重复导入。历史恢复成功后清除错误状态，不再残留错误的聊天警告。 (#10472)
  - [Desktop] 稳定 Windows 发版验证 — 修复了 Windows 验证缺陷，包括在 Windows 上运行仅限 POSIX 的测试和 shell 探测缓存污染。 (#10468)
  - [Desktop · CLI] 统一 PowerShell 冷启动握手预算 — PowerShell 现在从进程启动到连接接受和就绪帧接收有 30 秒预算。 (#10464)
  - [Desktop] 修复重开会话的历史缓存复用 — 规范历史窗口现在在同一会话以新标签 ID 重新打开时复用热驻留。 (#10423)
  - [Desktop] 串行化回收站恢复与永久删除 — 回收站删除现在在刷新、锁等待、重试和重启期间保留用户的原始确认快照。 (#10437)
  CLI 端更新
  重点内容
  - [Desktop · CLI] Windows 路径和升级修复 — 修复了 Windows 文件 URI、CLI 诊断、旧会话升级和安装程序身份问题。 (#10459, #10451)
  修复
  - [Desktop · CLI] 统一 PowerShell 冷启动握手预算 — PowerShell 现在从进程启动到连接接受和就绪帧接收有 30 秒预算。 (#10464)
  升级提醒
  - [Desktop] 会话注册表升级 — 首次启动时，现有会话将迁移到新的注册表格式。旧客户端无法编辑升级后的 v3 注册表。 (#10440)
  - [Desktop] Windows 安装程序身份 — 安装的测试构建有意替换同一产品并共享数据；便携构建保持程序文件独立。 (#10451)
  - [Desktop] 更新器限制 — 非稳定构建中更新器已禁用。稳定更新保持显式：检查仅读取元数据，下载/安装需用户操作后开始。 (#10406)
  - [Desktop] 降级需要新读取器 — 暂停/恢复更改后，降级需要保留新读取器或恢复完整的升级前备份。 (#10383)
  风险提示
  当前没有需要额外操作的已知风险。
