  概览
  Reasonix v1.19.7 — Reasonix v1.19.7
  此版本改进了子 Agent 结果处理，添加了服务端网页搜索控制，修复了多个桌面端和 Agent 问题，并包含多项稳定性和可用性增强。
  发布日期：2026-08-05
  重点内容
  - DeepSeek 服务端网页搜索控制 — 为 DeepSeek Responses API 添加了服务端网页搜索支持，包括流式生命周期事件和已完成搜索项的重放。在官方端点上默认启用，可显式关闭。在桌面端提供者设置中展示，并提供隐私、Token 用量和计费指导。 (#7466)
  - 保留并行子 Agent 完整结果 — 每个并行子 Agent 的结果现在存储在自己的记录中，防止截断。添加了只读分页器，用于无损检索子 Agent 结果。 (#7375)
  - 自定义提供者不再继承 DeepSeek 默认值 — 修复了用户定义的提供者会静默获取 DeepSeek 的余额 URL、价格表和上下文窗口的错误，该错误导致计费和压缩行为不正确。 (#7386)
  - 规划器在问答任务中不再产生重复答案 — 规划器现在能正确结束仅回答的轮次，而无需启动执行器，防止在纯问题/比较/分析任务中出现重复响应。 (#7504)
  - 桌面端：空会话不再劫持主题解析 — 修复了新创建的空会话可能永久优先于实际对话，导致真实记录在 UI 中无法访问的问题。 (#7494)
  - 自动研究证据块不再泄漏到显示的答案中 — 协议证据块现在在所有界面上从显示的助手答案中过滤掉，保持输出整洁。 (#7493)
  新功能
  - 将未知斜杠输入作为常规消息发送 — 未知斜杠命令现在作为常规模型轮次发送，而不是被终止，并提示命令未被识别。 (#7496)
  - 将 swift test 识别为交付验证命令 — Swift/SwiftPM 项目现在拥有用于交付最终确认的主机识别验证命令。 (#7480)
  改进
  - 将桌面风格移至通用设置首项 — 桌面风格选择器现在是通用设置中的第一项，以提高可见性。 (#7515)
  - 在读取边界清理存储的显示标题 — 会话/主题标题和预览中的旧版内部字符串现在在加载时被清理，防止原始包装器出现在历史记录和标签页中。 (#7501)
  - ACP 重放使用用户创作视图 — 重新打开会话现在重放用户创作视图，而不是原始持久化的传输形式，隐藏注入的瞬态块和协议标记。 (#7502)
  - 提高模型列表响应上限并添加截断检测 — 模型列表响应上限提高到 2 MiB，以适应大型提供者响应，并在溢出时提供明确错误。 (#7383)
  - 观测缺少进程内租约所有者的会话保存 — 为无租约会话保存增加了去重的结构化诊断，便于后续单写者约束覆盖合法写入方；本版本不改变保存行为。 (#7532)
  修复
  - 解析聊天会话时遵循持久化的 session_mappings — 通过使网关遵循持久化的会话映射，修复了机器人聊天分散为单轮会话的问题。 (#7531)
  - 恢复半开流停滞并容忍空 data: 行 — 修复了 OpenAI 兼容提供者中的流稳健性问题，包括看门狗停滞恢复和空心跳行的处理。 (#7374)
  - 在 serve 中切换模型后保持 ask 交互 — 重新启用了由模型或努力切换重建的控制器上的交互式批准和询问器连接。 (#7450)
  - 使聊天中的本地文件路径在 Windows 上可点击 — AI 在聊天回复中打印的文件路径现在在 Windows 上可点击，使用默认应用程序打开。 (#7465)
  - 在 hook 机器中从平台 Reasonix 主目录解析全局钩子 — 修复了 hook status/list 命令在配置了全局钩子时报告缺失的问题。 (#7441)
  - 在更新器中恢复被取代的待处理事务 — 通过从旧布局恢复有效的待处理事务，修复了从扁平到版本化 Windows 重新安装后应用内更新被阻止的问题。 (#7376)
  - 在 TUI 中每次退出手势时快照会话 — 通过确保每次退出时进行会话快照和租约最终确认，修复了某些 TUI 退出手势上的数据丢失问题。 (#7489)
  - 在 TUI 中编辑排队反馈时保留队列光标 — 修复了 TUI 中排队反馈编辑的问题，即输入替换文本会重置光标并追加而不是替换。 (#4916)
  - 在 macOS 上双击标题栏缩放 — 在 macOS 上双击自定义标题栏现在会触发窗口缩放，符合标准平台行为。 (#7473)
  - 记录 Windows 代理检测失败的原因 — 添加了 Windows 代理检测失败的调试日志，以帮助故障排除。 (#7474)
  - 更正桌面 README 中的 Windows 签名状态 — 更新了桌面 README，以反映 Windows 构建已进行 Authenticode 签名。 (#7475)
  - npm 恢复的发布工作流修复 — 修复了与 npm 恢复控制平面加载和暂存清理容忍度相关的发布工作流问题。 (#7482, #7478, #7477)
  升级提醒
  本版本无需手动迁移。
  风险提示
  - DeepSeek 网页搜索的隐私与计费 — 在 DeepSeek 官方 Responses 与 Anthropic 端点上，省略 web_search 现在会默认启用服务端搜索。搜索查询会发送给 DeepSeek，Token 用量或费用可能增加；如需退出，请设置 web_search = false。 (#7466)
