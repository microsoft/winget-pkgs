ReleaseNotes: |-
  此稳定版修复了多个用户报告的问题，包括钱包币种对齐、macOS 图标渲染、菜单裁剪和更新恢复。
  发布渠道：稳定版 · v1.19.1
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.19.1 — Reasonix 桌面端 v1.19.1
  此稳定版修复了多个用户报告的问题，包括钱包币种对齐、macOS 图标渲染、菜单裁剪和更新恢复。
  发布日期：2026-08-01
  重点内容
  - 钱包余额现已与所选币种一致 — 在设置中选择定价币种后，桌面状态栏现在会以该币种显示钱包余额。若无法提供匹配余额，则显示实际币种前缀（如 CNY），不进行隐式转换。 (#7160)
  - macOS 应用图标安全区域已恢复 — macOS 应用图标现在在 Dock 及其他系统界面中正确显示，符合预期设计。 (#7123)
  - 锚定浮层在布局期间保持可见 — 修复了锚定浮层（如能力等级和模型选择器）在打开后可能立即消失的问题。现在它们在计算最终位置前会保持在视口边缘可见。 (#7132)
  - 防止 GB18030 搜索协程泄漏 — 修复了在原生 GB18030 搜索达到 200 个匹配限制时可能发生的协程泄漏，提升长时间运行稳定性。 (#7147)
  - 自动恢复卡住的更新事务 — 若之前的更新尝试中断，应用现在会自动调和状态，消除“待处理更新已存在”错误并允许继续更新。 (#7149)
  - 输入框菜单现已完整显示 — 斜杠命令和提及菜单不再在输入框上方被裁剪，它们按预期展开至完整高度。 (#7128)
  修复
  - 钱包余额现已与所选币种一致 — 在设置中选择定价币种后，桌面状态栏现在会以该币种显示钱包余额。若无法提供匹配余额，则显示实际币种前缀（如 CNY），不进行隐式转换。 (#7160)
  - macOS 应用图标安全区域已恢复 — macOS 应用图标现在在 Dock 及其他系统界面中正确显示，符合预期设计。 (#7123)
  - 锚定浮层在布局期间保持可见 — 修复了锚定浮层（如能力等级和模型选择器）在打开后可能立即消失的问题。现在它们在计算最终位置前会保持在视口边缘可见。 (#7132)
  - 防止 GB18030 搜索协程泄漏 — 修复了在原生 GB18030 搜索达到 200 个匹配限制时可能发生的协程泄漏，提升长时间运行稳定性。 (#7147)
  - 自动恢复卡住的更新事务 — 若之前的更新尝试中断，应用现在会自动调和状态，消除“待处理更新已存在”错误并允许继续更新。 (#7149)
  - 输入框菜单现已完整显示 — 斜杠命令和提及菜单不再在输入框上方被裁剪，它们按预期展开至完整高度。 (#7128)
  升级提醒
  - 自动更新恢复 — 更新后，桌面应用将自动调和任何先前卡住的更新事务。您可能会在更新横幅中短暂看到“恢复中”状态。 (#7149)
  风险提示
  当前没有需要额外操作的已知风险。
