  概览
  Reasonix v1.21.2 — Reasonix v1.21.2：输出预算提升、缓存感知上下文与 Agent 加固
  此版本将输出预算提升至 128K，引入缓存感知上下文投影以更高效管理历史，通过工作实践策略加固 Agent 行为，并修复了文件工具、沙箱检测、钩子和更新等方面的诸多问题。
  发布日期：2026-08-07
  重点内容
  - 输出预算提升至 128K，并引入缓存感知上下文投影 — 支持 provider 的默认输出预算提升至 128K。缓存感知上下文投影将持久历史与模型可见请求分离，保留完整 canonical transcript，缓存状态仅用于成本策略。冷/热/未知恢复不再重写历史。 (#7839)
  - 工作实践策略加固 Agent 行为 — 新增工作实践策略，附加到每个系统提示中，确保 Agent 严格实现所请求的方法、不将临时文件留在仓库中，并根据变更规模调整验证范围。适用于所有运行，而非仅基准测试。 (#7779)
  - 流式性能提升：合并增量与按块解析 Markdown — 流式增量在到达前端前合并，减少 IPC 开销。Markdown 按已完成块解析而非每次 tick 解析，大幅降低典型回答的解析次数。每帧增量合并为每个标签页一次 reducer 处理，降低 UI 线程负载。 (#7889, #7890, #7892)
  - 文件工具通过 FileOverlay 路由，写入操作原子化 — 所有文件编辑工具（edit_file、multi_edit、delete_range 等）现在遵循宿主 FileOverlay，防止覆盖未保存的编辑器缓冲区。文件写入采用临时文件加重命名的原子操作，避免崩溃时损坏。 (#7872)
  - 沙箱检测探测可用性，而非仅检查 PATH 存在 — 在 macOS 上，现在通过最小配置文件探测 sandbox-exec 的可用性，正确报告在受限系统上不可用的情况（存在但无法应用沙箱），防止静默执行失败。 (#7807)
  - 自愈卡住的待更新事务与版本号归一化 — 卡住的应用内更新现在可自愈：过期的试用更新在 24 小时后自动提交，版本比较归一化前导 'v'，新增「放弃上次更新」按钮允许手动恢复。更新了恢复文档。 (#7820)
  - 防止仅推理停止后出现陈旧结果 — 子代理和规划器等内部消费者现在要求可见的最终答案。仅推理停止会触发有限重试，清理操作感知压缩，保留已完成的证据。Guardian 审查在空最终结果后安全关闭。 (#7817)
  - Windows 多来源 Hook 的 POSIX 脚本执行归一化 — Windows 上来自插件、项目和全局钩子的 POSIX shebang 脚本现在被检测并通过 Git Bash 执行。路径已归一化，Bash 依赖项对诊断可见。 (#7863)
  新功能
  - 带性能预算的 UI 延迟遥测 — 桌面版现在通过匿名计数器记录 UI 延迟指标（帧持续时间、输入延迟、Markdown 解析时间等），并附有文档化的性能预算。不收集消息内容。 (#7895)
  - 按任务轨迹记录与耗时归因 — CLI 和基准测试工具现在可以记录每个任务的事件轨迹（--trajectory），并将耗时归因于工具执行与模型思考。记录轨迹时，报告包含时间归因。 (#7885, #7886)
  - 工具结果时间戳用于耗时归因 — 工具结果现在携带绝对开始/结束时间戳，可重建回合时间分配。已取消或跳过的调用时间戳为零。 (#7882)
  改进
  - 代码检查与质量门禁扩展 — 函数大小和复杂度现在在 CI 中设限。文件大小上限扩展到 TypeScript。所有构建标签跨平台检查。采用并强制执行现代 Go 惯用法。 (#7862, #7879, #7837, #7831)
  - 错误比较加固 — 所有错误比较现在通过解包链使用 errors.Is/As，防止包装错误时静默失效。移除了手动解包辅助函数。 (#7834)
  - 注释风格清理 — 代码库中注释的分节横幅装饰已移除，repolint 中设为零容忍门禁。 (#7840)
  修复
  - 修复 CLI 指标接收器重复转发 — 修复了 --metrics 运行时每个事件被转发两次的错误，恢复单次转发行为。 (#7883)
  - 会话并发测试保持在竞态预算内 — 减少会话并发测试的规模，避免在竞态检测器下超时，同时保持重叠覆盖。 (#7821)
  - CLI 和 SSH 测试不再访问外部网络 — 无意中进行真实 API 调用或调用主机 SSH 的测试现已正确隔离。 (#7856)
  - PR 元数据门禁规则文档化并修正 — Documentation-impact 门禁现已文档化，并修正了拒绝值行以匹配实际执行。 (#7876)
  升级提醒
  - 卡住的更新自愈 — 如果您有卡住的待更新事务，若安装证据有效，将在 24 小时后自动提交。您也可以从设置中放弃它。 (#7820)
