ReleaseNotes: |-
  本次发布用统一的自适应标准策略取代执行模式，让桌面端流式输出与滚动更可靠，并强化了上下文恢复、会话所有权与提供商兼容性。
  发布渠道：稳定版 · v1.25.3
  English → · 网页版完整更新日志 →
  使用攻略
  - 自适应执行策略 — Reasonix 现在根据意图、风险、结构与约束逐轮推导策略，取代轻量、均衡与交付模式。
  - 会话所有权与恢复 — 会话写者被隔离，回溯采用分叉优先，恢复分支在重启后保持稳定。
  - 工具审批模式 — 按需写入授权让文件工具与 Bash 可请求工作区外目录的写入权限。
  概览
  Reasonix v1.25.3 — Reasonix v1.25.3：自适应执行、更流畅的流式体验与更稳健的恢复
  本次发布用统一的自适应标准策略取代执行模式，让桌面端流式输出与滚动更可靠，并强化了上下文恢复、会话所有权与提供商兼容性。
  发布日期：2026-08-16
  重点内容
  - 统一自适应执行策略取代轻量、均衡与交付模式 — Reasonix 不再要求选择执行模式。每轮根据意图、风险、结构与约束推导策略，并用于规划、验证与证据闭环。 (#8866)
  - 桌面端流式输出与滚动现已稳定 — 活跃轮次在虚拟列表外渲染，消除了 Windows 与 WebView2 上的闪烁、回跳与尾部丢失。待办面板实时更新。 (#8903, #8925)
  - 上下文溢出恢复持续推进 — 长工具轮次中反复出现的硬上下文溢出现在可在节省令牌的检查点后恢复，而不是报错中止。 (#8874, #8921)
  - 修复 DeepSeek Anthropic 推理回放 — 工具绑定的助手轮次现在会回放所需的思考块，避免后续请求出现 HTTP 400 错误。 (#8924, #7763)
  - 沙箱工具按需写入授权 — 文件工具与 Bash 可请求工作区外目录的写入权限，支持一次、会话、项目或拒绝等决策。 (#8884)
  新功能
  - 自适应标准执行策略 — 用根据意图、风险与结构逐轮推导的单一策略取代轻量、均衡与交付模式。 (#8866)
  - 按需写入授权 — 文件工具与 Bash 可请求工作区外目录的写入权限，支持一次、会话、项目或拒绝等决策。 (#8884)
  - 持续展开推理显示模式 — 新增显式的展开模式，使已完成的推理保持展开，并一致应用于助手消息、内联转录推理和子代理预览。 (#8732)
  - SCNet 提供商预设 — 新增国家超算互联网（SCNet）Token Plan 的内置预设，包括 OpenAI 兼容和 Anthropic 兼容端点。 (#8886)
  - 统一 AI 与 Agent 会话命名 — 新增缓存稳定的 set_session_title 能力和桌面端 AI 重命名操作，并在目录、历史记录和项目树中一致更新标题。 (#8920)
  改进
  - 桌面端流式输出与滚动稳定性 — 活跃轮次在虚拟列表外渲染，消除闪烁、回跳与尾部丢失；待办面板实时更新。 (#8903, #8925)
  - 上下文溢出恢复 — 反复出现的硬上下文溢出可在节省令牌的检查点后恢复，而不是中止。 (#8874, #8921)
  - 会话所有权与恢复 — 写者被隔离，回溯采用分叉优先，恢复分支在重启后保持稳定。 (#8878, #8923)
  - 事实驱动执行 — 普通请求直接进入执行器，规划仅用于显式计划、审批边界和目标启动；验证义务由具体工具调用生成。 (#8930)
  - ACP v1 Prompt 结果 — 就绪差距与受控暂停返回合规的 end_turn 结果；真实故障返回带脱敏原因的 JSON-RPC InternalError。 (#8916)
  - Windows 工作区监视 — 用每个工作区根目录的单个递归订阅取代逐目录监视，避免嵌套目录锁定。 (#8922)
  - 侧边栏新会话标题本地化 — 自动生成的默认标题现在会在侧边栏目录中按桌面语言本地化。 (#8824)
  - 普通任务质量差距 — 缺少验证证据不再中断普通变更；差距会在完成摘要中显示。 (#8901)
  - Windows 上 SSH 远程窗口框架 — 远程窗口现在保留原生操作系统框架，提供标题栏和窗口控件。 (#8913)
  修复
  - DeepSeek Anthropic 推理回放 — 工具绑定的助手轮次回放所需的思考块，避免 HTTP 400 错误。 (#8924, #7763)
  - 重启后保留压缩投影 — 重启后恢复有效的压缩投影，而不是回退到完整转录。 (#8923)
  - 清除 Windows 与策略阻断 — 修复 Windows 上无效的 TOML 夹具和阻止作用域保护的子句感知变更约束。 (#8934)
  - DOMPurify 安全固定 — 将 Mermaid 传递依赖的 DOMPurify 固定到已修复的 3.4.13，清除中等运行时 XSS 公告。 (#8935)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
