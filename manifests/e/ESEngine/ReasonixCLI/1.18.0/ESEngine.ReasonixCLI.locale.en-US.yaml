  概览
  Reasonix v1.18.0 — 上下文引擎 v2、内置终端与双发布渠道
  Reasonix 1.18.0 引入上下文引擎 v2、桌面端内置终端会话，以及公开的 Stable 与 Preview 双渠道；同时新增 Kimi K3、区域化人民币/美元计价与更完整的本地化，改善大型会话响应，并加固修复、授权、产物、遥测和发布链路。
  发布日期：2026-07-29
  重点内容
  - 上下文引擎 v2 — 全新的上下文引擎统一协调 CLI 与桌面会话的上下文预算、来源明细、压缩和模型感知限制。 (#7001)
  - 桌面端内置终端会话 — 桌面工作区现可创建和管理内置终端会话，支持选择 Shell、保留输出历史，并通过明确的“添加到聊天”操作传递内容。 (#6994)
  - Stable 与 Preview 双发布渠道 — 桌面版和原生 CLI 现提供独立的公开 Stable 与 Preview 渠道。预览版使用独立的预发布标识，同时与稳定版共享 1.18.0 基础版本。 (#6155, #6997)
  - 更安全的修复、授权与产物处理 — Guard 修复预览现与获批的精确状态绑定；动态 Bash 授权在所有权不明确时安全拒绝；后台任务产物路径会拒绝路径穿越。 (#6973, #6985, #6936)
  新功能
  - 官方 API 与 OpenCode Go 支持 Kimi K3 — Kimi K3 现已支持 Kimi 国内版、Kimi 全球版与 OpenCode Go；官方 API 具备原生视觉、1,048,576 token 上下文窗口和模型专用推理控制。 (#6921)
  - 区域化计价与更完整的本地化 — DeepSeek 官方用量可使用人民币或美元区域价格；CLI 输出包含结构化币种总额；更多桌面端与 Web 文案会跟随所选语言。 (#6945)
  - 机器接口支持项目根目录作用域 — Session、Task 与 Recovery 机器接口可通过 --project-root 选择项目，同时保留现有 --dir Session 存储目录契约。 (#6970)
  - 隐私友好的 CLI 遥测与崩溃报告 — CLI 诊断可上报经过限制与脱敏的可靠性信号，不包含提示词、响应、凭据或本地路径。 (#6984)
  改进
  - 可在输入框任意位置插入 Skill — 桌面端斜杠补全现在可在任务开头、中间或末尾插入 Skill 或 Subagent，并保留周围文本及结构化顺序。 (#6964)
  - 更可靠的模型默认值与配置保存 — 新会话会解析可用的已配置模型；CLI 无密钥启动会安全回退；保存配置时 MCP 条目仍保留在其所属来源中。 (#6999, #7002, #6913)
  - 大型会话响应性能 — 桌面端历史记录与会话处理会归档大型工具载荷并减少重复计算，避免大型会话卡顿。 (#6993)
  - 发布完整性与更快的 CI — Stable 与 Preview 发布现会校验候选提交身份、签名合约、渠道清单和各系统必需检查，同时跳过无关 CI 工作。 (#6944, #6997, #7022, #7023, #7025)
  修复
  - Goal 与 Agent 续跑可靠性 — Goal 首条消息现在可以正确调用 Skill，陈旧的编辑重试也不会在 Goal 续跑之间形成循环。 (#6991, #7012)
  - 干净可靠的标签页与会话切换 — 复用空白标签页时，不再于较新的导航操作之后恢复旧会话或工具数据。 (#6909)
  - Windows 桌面渲染与插件 Hook — Windows 会话内容现在可干净重绘、不再残留像素，插件 Bash Hook 也会检测正确的运行时。 (#7019, #6980)
  - 可信 Session 产物路径语义 — 产物路由在保留合法可信 Session 路径语义的同时，会拒绝控制字符重绑定并清除陈旧持久化绑定。 (#6937)
  升级提醒
  - Guard 自动化必须绑定已审阅预览 — 非交互执行 reasonix-guard apply-plan --yes 现在必须携带已审阅计划返回的 preview ID；交互式使用仍会自动绑定。 (#6973)
  风险提示
  当前没有需要额外操作的已知风险。
