ReleaseNotes: |-
  压缩决策弹窗、本地决策回执、统一扩展内核、原生任务监视器、有界子代理进度、Goal 安全完成、MiMo 与 DashScope Responses 修复、SSH 远程访问简化，以及多项桌面稳定性改进。
  发布渠道：稳定版 · v1.20.0
  English → · 网页版完整更新日志 →
  使用攻略
  - Extension Protocol v1 — 了解稳定的 JSON-RPC 边车协议、Plugin Manifest v1 和 Go SDK。
  - Goal 强制执行 — 新的 update_goal 工具与安全停止完成机制如何工作。
  - 子代理进度 — task、parallel_tasks 和 fleet 的有界进度转发。
  概览
  Reasonix v1.20.0 — 扩展内核、任务监视器与更安全的 Goal 完成
  压缩决策弹窗、本地决策回执、统一扩展内核、原生任务监视器、有界子代理进度、Goal 安全完成、MiMo 与 DashScope Responses 修复、SSH 远程访问简化，以及多项桌面稳定性改进。
  发布日期：2026-08-05
  重点内容
  - 统一扩展内核与 Extension Protocol v1 — 不可变运行时快照、故障原子重载、Plugin Manifest v1（提示词、主题、完全信任代码运行时）、稳定的 JSON-RPC 边车协议、拦截器调度、流式提供者适配器、结构化 UI 和 Go SDK。 (#7373)
  - 原生任务监视器 — 在 CLI 和桌面端原生监控代理任务，提供生命周期语义和会话范围摘要视图。 (#6998)
  - 有界子代理进度转发 — 转发 task、parallel_tasks 和 fleet 的结构化进度，不淹没父流。在桌面端渲染嵌套生命周期卡片，在 CLI 中提供稳定的子进程记录槽。 (#7372)
  - Goal 完成安全停止 — 用稳定的 update_goal 工具和纪元范围的每轮报告替换自由格式的 Goal 页脚标记。集中完成逻辑，带有界评估器、进度感知预算和暂停/恢复控制。 (#7519)
  - 压缩决策弹窗与本地回执 — 压缩页脚决策卡片布局，带有界滚动、密集操作行和溢出展示。将有界的 Ask、批准和恢复决策记录为本地记录回执。 (#7576)
  - 简化 SSH 远程访问 — 移除 Remote Workbench 协议和堆栈；重用 CLI/Serve 远程模型。桌面端通过 SSH 打开每主机原生 Web 子窗口。无密钥远程 Serve 设置，提供仅回环页面。 (#7528)
  - 使用 Primer 配色的模型用量图表 — 用 GitHub Primer 数据可视化双套分类调色板替换单色渐变。修复悬停时环形图溢出和键盘可访问性。 (#7503)
  - Extension 与任务监视器跨平台可靠性 — 让内容引用淘汰顺序保持确定，一致拒绝 Unix 与 Windows 绝对插件路径，稳定并行任务取消流程，并恢复任务监视器与远程提供者设置的可靠 Windows 验证。 (#7625)
  - MiMo 与 DashScope Responses 协议对齐 — 修复 MiMo 的多轮工具循环、推理往返、JSON 输出；修复 DashScope 第二轮 400 错误、全零用量抑制和供应商感知缓存 TTL。 (#7566, #7234, #7168)
  - 桌面稳定性修复 — 修复更新卡死与旧版 WebKit、遏制 macOS 别名修复启动崩溃、保持输入区溢出列表可读，并加固账号验证与社区流程。 (#7615, #7610, #7590, #7589)
  - SSH 断开后远程 Web 恢复 — 添加 SSH 断开、转发恢复和窗口重载的集成回归测试。记录瞬态中断行为。 (#7368)
  新功能
  - 统一扩展内核与 Extension Protocol v1 — 不可变运行时快照、故障原子重载、Plugin Manifest v1、稳定的 JSON-RPC 边车协议、拦截器调度、流式提供者适配器、结构化 UI 和 Go SDK。 (#7373)
  - 原生任务监视器 — 在 CLI 和桌面端原生监控代理任务，提供生命周期语义和会话范围摘要视图。 (#6998)
  - 有界子代理进度转发 — 转发 task、parallel_tasks 和 fleet 的结构化进度，不淹没父流。在桌面端渲染嵌套生命周期卡片，在 CLI 中提供稳定的子进程记录槽。 (#7372)
  - Goal 完成安全停止 — 用稳定的 update_goal 工具和纪元范围的每轮报告替换自由格式的 Goal 页脚标记。集中完成逻辑，带有界评估器、进度感知预算和暂停/恢复控制。 (#7519)
  - 消融子系统开关 — 通过共享词汇关闭子系统以进行受控实验。包括规划器、子代理、检索、证据和压缩。 (#7550)
  - 基准测试每个已解决任务的成本 — 在端到端报告中报告每个已解决任务的成本、每个已解决任务的令牌数、中位墙钟时间和失败类别细分。 (#7546)
