ReleaseNotes: |-
  此版本将网络搜索与主对话分离，增强协议恢复可靠性，并统一桌面管理页面。同时改进了链接菜单、更新重启稳定性、模型图像能力处理以及会话操作。
  发布渠道：稳定版 · v1.38.0
  English → · 网页版完整更新日志 →
  使用攻略
  - 管理页面 — 了解如何使用统一的设置、回收站和自动化管理页面。
  - 模型能力 — 了解模型能力的发现与覆盖方式。
  - 模型设置 — 使用新编辑器配置提供程序和模型设置。
  - 网络搜索 — 独立网络搜索功能的详细信息。
  概览
  Reasonix v1.38.0 — Reasonix 1.38：独立搜索、可靠恢复与统一桌面工作区
  此版本将网络搜索与主对话分离，增强协议恢复可靠性，并统一桌面管理页面。同时改进了链接菜单、更新重启稳定性、模型图像能力处理以及会话操作。
  发布日期：2026-09-05
  Desktop 17 · CLI 6
  桌面端更新
  重点内容
  - [Desktop · CLI] 独立网络搜索 — 网络搜索现在独立于主对话运行，拥有自己的恢复预算，并在缺少结构化来源时提供清晰报告。 (#9826)
  - [Desktop · CLI] 可靠的协议恢复 — 可恢复的协议错误现在支持通过桌面按钮、CLI /recover-context、Serve 和 ACP 从有效历史恢复一次，重启后保留恢复状态，并遵守取消操作。 (#9826)
  - [Desktop] 统一管理页面 — 设置、回收站和自动化现在使用全窗口管理页面，具有共享导航和焦点隔离，同时保持工作区挂载。 (#9821)
  - [Desktop] 无障碍富链接菜单 — 网络、GitHub 和邮件链接现在具有上下文菜单，提供打开/复制操作和紧凑的 GitHub 引用，并支持完整的键盘操作。 (#9824)
  - [Desktop] 稳定的更新重启 — 版本化更新现在通过永久启动器重启，更新横幅每小时及获得焦点时刷新，不会中断正在进行的操作。 (#9809)
  - [Desktop] 模型图像能力覆盖 — 图像能力未知的提供程序模型现在可以手动启用或禁用，官方协议限制优先。 (#9812)
  新增
  - [Desktop] 富链接上下文菜单 — 为网络、GitHub 和邮件链接添加了上下文菜单，包含打开、复制和紧凑引用操作。 (#9824)
  - [Desktop] 统一管理页面 — 设置、回收站和自动化现在使用全窗口管理页面，具有共享导航和焦点隔离。 (#9821)
  - [Desktop · CLI] 独立网络搜索 — 网络搜索与主对话解耦，拥有自己的恢复预算和报告。 (#9826)
  改进
  - [Desktop · CLI] 协议恢复加固 — 可恢复的协议错误现在支持通过桌面按钮、CLI /recover-context、Serve 和 ACP 从有效历史恢复一次，重启后保留恢复状态，并遵守取消操作。 (#9826)
  - [Desktop] 模型图像能力覆盖 — 添加了每个模型的自动/开/关图像输入控制，并改进了中转站的能力发现。 (#9812)
  - [Desktop] 恢复会话操作 — 复制、导出、终端和摘要操作现在可直接在主题栏中使用。 (#9810)
  修复
  - [Desktop] 更新重启稳定性 — 重启现在使用永久启动器，托盘身份和恢复更加可靠。 (#9809)
  - [Desktop] 自动化控件重叠 — 修复了打开自动化任务时控件重叠的问题，包括 Windows 标题按钮和 macOS 工作区切换。 (#9811)
  - [Desktop] macOS 工作区对齐 — 工作区选项卡现在与切换按钮共享标题行，防止在最小停靠宽度下重叠。 (#9810)
  CLI 端更新
  重点内容
  - [Desktop · CLI] 独立网络搜索 — 网络搜索现在独立于主对话运行，拥有自己的恢复预算，并在缺少结构化来源时提供清晰报告。 (#9826)
  - [Desktop · CLI] 可靠的协议恢复 — 可恢复的协议错误现在支持通过桌面按钮、CLI /recover-context、Serve 和 ACP 从有效历史恢复一次，重启后保留恢复状态，并遵守取消操作。 (#9826)
  新增
  - [Desktop · CLI] 独立网络搜索 — 网络搜索与主对话解耦，拥有自己的恢复预算和报告。 (#9826)
  改进
  - [Desktop · CLI] 协议恢复加固 — 可恢复的协议错误现在支持通过桌面按钮、CLI /recover-context、Serve 和 ACP 从有效历史恢复一次，重启后保留恢复状态，并遵守取消操作。 (#9826)
  升级提醒
  - [Desktop · CLI] DeepSeek 主对话默认协议 — 内置 DeepSeek 主对话恢复使用 Chat Completions，网络搜索独立使用官方搜索端点。一次性配置升级保留模型、思考等级、搜索偏好和显式自定义路由。 (#9826)
  风险提示
  - [Desktop · CLI] 恢复与降级边界 — 协议修复后，模型可能再次请求已经完成的只读工具。已验证的文件写入恢复可避免重复执行已满足的写入，但不能据此保证任意 shell 或 MCP 副作用不重复。旧客户端可读取普通历史，但无法执行新的恢复约束；请勿通过降级续跑尚未解决的协议故障。 (#9826)
