ReleaseNotes: |-
  桌面端与 CLI 的稳定性修复：更新后会话「消失」、Windows 窗口打不开、旧会话导入、钩子覆盖所有工具调用处，以及记忆安全。
  发布渠道：稳定版 · v1.39.1
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.39.1 — Reasonix 1.39.1
  桌面端与 CLI 的稳定性修复：更新后会话「消失」、Windows 窗口打不开、旧会话导入、钩子覆盖所有工具调用处，以及记忆安全。
  发布日期：2026-09-26
  Desktop 12 · CLI 6
  桌面端更新
  重点内容
  - [Desktop] 更新后会话「消失」的问题已修复 — 从 1.38 升级后，侧栏可能一条会话都不显示；如果上次停留在一个没发过消息的新对话上，还会一启动就报错。两者都已修复，会话目录的启动修复也会找回带分支会话的列表。会话内容本身一直都在。 (#10763, #10853)
  - [Desktop] 用过 1.38 沙箱的 Windows 电脑上窗口能正常打开了 — 1.38.8–1.38.10 的 Windows 沙箱可能在安装目录上留下一条访问权限，导致 Chromium 进程全部崩溃、窗口始终不出现。桌面端现在启动时会从自己的安装目录移除这类权限，被系统拒绝时会弹窗说明原因。 (#10858, #10853)
  - [Desktop] 打开和导入旧会话不再改动原始文件 — 从侧栏打开旧会话不再多出一行以文件名命名的重复条目；导入时原始文件保持不变，也不会再误报「旧来源有更新」。 (#10495, #10853)
  - [Desktop] 输入法回车不再关闭重命名输入框 — 当中文输入法使用回车结束组合时，会话重命名输入框保持打开，保留已保存的标题。 (#10836)
  - [Desktop · CLI] 读取失败时记忆操作保留索引 — 不可读的 MEMORY.md 不再导致保存或归档清除受管条目和手写笔记。 (#10833)
  - [Desktop · CLI] 工具钩子覆盖所有调用工具的地方 — 项目和全局工具钩子现在也作用于子代理（task、read_only_task、run_skill、read_only_skill）、规划器、reasonix review 和桌面端试运行；续跑的技能保持同一个钩子会话 ID。 (#10843, #10845, #10848)
  改进
  - [Desktop] 长提供方模型名称在两行内显示 — 将显示的模型名称限制为两行，并在悬停时显示完整名称。 (#10830)
  修复
  - [Desktop] 崩溃覆盖层可重启 Reasonix — 在崩溃覆盖层添加“重启 Reasonix”操作，并回退到页面重新加载。 (#10775)
  - [Desktop] 文件面板显示顶层 tmp/、bin/、stage/ — 工作区文件面板和监视器不再隐藏这些目录。 (#10774)
  - [Desktop · CLI] 中断轮次显示提供方错误 — 带有提供方错误的中断轮次现在显示错误文本，而不仅仅是通用通知。 (#10778)
  - [Desktop · CLI] 输入长度错误的上下文溢出检测 — 将“输入长度超过最大值”识别为上下文溢出，触发压缩。 (#10770)
  - [Desktop] 一次性的 reasonix -p 运行不再出现在侧栏 — 无头运行（包括智能体自己启动的）不再在侧栏留下以原始 ID 命名的永久条目。 (#10857)
  CLI 端更新
  重点内容
  - [Desktop · CLI] 读取失败时记忆操作保留索引 — 不可读的 MEMORY.md 不再导致保存或归档清除受管条目和手写笔记。 (#10833)
  - [Desktop · CLI] 工具钩子覆盖所有调用工具的地方 — 项目和全局工具钩子现在也作用于子代理（task、read_only_task、run_skill、read_only_skill）、规划器、reasonix review 和桌面端试运行；续跑的技能保持同一个钩子会话 ID。 (#10843, #10845, #10848)
  改进
  - [CLI] 模糊的 --resume 查询列出匹配项 — 无头恢复遇到多个匹配时，现在会列出候选项并建议使用 --resume 。 (#10782)
  修复
  - [CLI] 长会话的致命崩溃输出被捕获 — 运行时崩溃输出写入每个 PID 的文件，诊断日志轮转以保留最新条目。 (#10788)
  - [Desktop · CLI] 中断轮次显示提供方错误 — 带有提供方错误的中断轮次现在显示错误文本，而不仅仅是通用通知。 (#10778)
  - [Desktop · CLI] 输入长度错误的上下文溢出检测 — 将“输入长度超过最大值”识别为上下文溢出，触发压缩。 (#10770)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
