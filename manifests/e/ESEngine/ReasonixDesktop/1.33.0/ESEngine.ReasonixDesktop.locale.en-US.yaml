ReleaseNotes: |-
  此版本改进了 Shell 配置、远程凭据安全性、界面稳定性，并新增通知音量控制。
  发布渠道：稳定版 · v1.33.0
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.33.0 — Reasonix v1.33.0
  此版本改进了 Shell 配置、远程凭据安全性、界面稳定性，并新增通知音量控制。
  发布日期：2026-08-28
  Desktop 11 · CLI 0
  桌面端更新
  重点内容
  - [Desktop] 安全的跨平台 Shell 支持 — 新增进程级缓存的 Shell 清单，并支持确定性的 Git for Windows 发现。macOS 可解析 Bash、原生 zsh 和 POSIX sh；Linux 执行仍仅限 Bash。Git 被建模为独立能力。Windows 修复仅支持手动操作，macOS/Linux 修复指导仅提供复制命令。 (#9519)
  - [Desktop] 稳定的运行任务切换 — 修复了任务执行期间的界面抽动问题，通过在整个活动轮次生命周期内保持推理和进程披露展开，并使用单调高度下限稳定实时页脚提交。 (#9540)
  - [Desktop] 安全的远程凭据代理路由 — 远程本地代理路由现在保持稳定的作用域虚拟令牌，而桌面端持有真实提供商凭据。保存、清除或删除凭据会同步重建或撤销仅受影响的路由，被撤销的令牌返回 HTTP 401。 (#9542)
  - [Desktop] 可调通知音量 — 在声音设置中新增 0–100% 的通知音量滑块，默认值为 70%。所有通知声音现在通过一个主增益路由，将内置 WAV 资源标准化为一致的响度。 (#9535)
  新增
  - [Desktop] 通过明确的箭头打开向导主机建议 — 第一步的主机字段现在通过明确的箭头下拉菜单显示已保存的 SSH 连接，列出所有已保存的连接且不过滤，并附加非 22 端口。 (#9536)
  改进
  - [Desktop] 有界的会话索引重建生命周期 — 手动会话索引重建现在是有界且可等待的事务。更新或修复后，侧边栏不再卡在“整理历史记录 / 重建索引”状态。 (#9528)
  - [Desktop] 完成待办后自动收起面板 — 已完成的待办面板现在会在短暂停留后淡出，恢复会话时不会重新附加已完成的批次。 (#9529)
  修复
  - [Desktop] 过时的状态竞争不再导致崩溃 — 与 SSE 派生帧竞争失败的 /status 轮询现在被视为良性的过时快照，而不再表现为未处理的拒绝崩溃。 (#9541)
  - [Desktop] 可靠的内存历史索引 — 后台历史记录和会话索引现在使用相互隔离的内存 SQLite 数据库，历史记录排空会在报告完成前处理所有已登记根目录，避免在 Windows 负载下发生迁移冲突或漏掉重新扫描。 (#9557)
  - [Desktop] 等待高度恢复后的挂载覆盖 — 转录浏览器回放现在等待稳定的几何信息并在失败时保留范围样本，修复了 Windows WebView2 中可能暴露空白帧的竞争条件。 (#9551)
  - [Desktop] 绘制前修正空白高度回弹 — 在下一个可见帧之前，从原生滚动传递同步修正可恢复的空白转录回弹，防止空白帧。 (#9553)
  CLI 端更新
  本版本没有 CLI 相关功能、改进或修复，CLI 用户可按需跳过。
  升级提醒
  本版本无需手动迁移。
  风险提示
