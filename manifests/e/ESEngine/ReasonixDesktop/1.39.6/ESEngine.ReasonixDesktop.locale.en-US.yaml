  升级提醒
  本版本无需手动迁移。
  风险提示
  - [Desktop · CLI] 重发的请求在极少数竞态下可能被重复计费 — 空闲连接已断开后的重发最多一次。如果连接断开前服务商恰好已收到第一次请求，这一轮会被计费两次，预计不常见。 (#11271 by @esengine)
