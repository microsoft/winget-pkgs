  概览
  Reasonix v1.30.0 — Reasonix 1.30.0
  改进写入冲突处理，新增钉钉机器人适配器，并修复多项桌面端 UI 问题，提升长会话导航与流式体验。
  发布日期：2026-08-20
  重点内容
  - 更智能的写入冲突检测 — 写入冲突现在按实际文件路径判定，不再将整个工作区视为独占，允许不同文件的并发写入，同时仍对同一文件的写入进行串行化。 (#9137)
  - 钉钉机器人适配器 — 新增钉钉 Stream 适配器，支持 WebSocket 长连接、@提及门控、消息去重和会话 webhook 回复。 (#9116)
  - 稳定的长会话导航 — 修复 Windows 会话几何问题、高度回弹和历史导航问题，使长对话保持流畅且完全可导航。 (#9117, #9130, #9140)
  新功能
  - 钉钉机器人适配器 — 新增钉钉 Stream 适配器，支持 WebSocket 长连接、@提及门控、消息去重和会话 webhook 回复。 (#9116)
  改进
  - 更智能的写入冲突检测 — 写入冲突现在按实际文件路径判定，不再将整个工作区视为独占，允许不同文件的并发写入，同时仍对同一文件的写入进行串行化。 (#9137)
  - 供应商名称不可修改时提供更直观的置灰与提示样式 — 编辑已添加的自定义供应商时，供应商名称输入框现在会显示为禁用状态，并带有本地化提示，说明暂不支持修改名称。 (#9066)
  - 分组标题字号略大于普通会话标题 — 会话分组标题现在使用略大于会话标题的字号，改善层级和可点击区域。 (#9032)
  - 本轮验证打开改动面板摘要 — 完成通知现在包含可用的“本轮验证”按钮，打开改动面板并滚动到本轮验证摘要。 (#9102)
  - 探路写入不再触发交付警告卡 — 写入 /tmp 等临时目录不再计为交付工作，避免出现关于未验证项目更改的错误警告。 (#9096)
  修复
  - 保持完整历史对话可导航 — 历史对话现在完全可导航，旧页面自动加载，活动问题标记与滚动同步。 (#9117)
  - 修复会话高度回弹导致的反向跳动 — 防止 Windows WebView2 会话高度回弹导致活动阅读手势反向跳动多个屏幕。 (#9140)
  - 修复 Windows 长会话滚动跳变与空白 — 通过纠正过时的行几何处理，修复 Windows 长会话中的可见闪烁、跳动和视口不稳定问题。 (#9130)
  - 修复剪贴板无图片时 Ctrl+V 拦截纯文本粘贴 — 当剪贴板中没有图片时，Ctrl+V 现在会回退到文本粘贴，而不是显示错误通知。 (#9000)
  - 修复文件预览限高与行间距空白 — 修复桌面文件面板中代码预览的布局问题，包括行间距错误和大文件高度不足。 (#9001)
  - 修复思考中卡住、停止后才显示内容 — 添加备用停滞计时器，在 requestAnimationFrame 暂停时刷新流增量，防止出现卡在“思考中”的状态。 (#9045)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
