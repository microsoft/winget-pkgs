ReleaseNotes: |-
  此稳定版带来确定性规划、可靠的粘贴撤销、内嵌正则搜索和原生崩溃诊断。同时将 CLI 诊断与终端界面隔离，使提供程序重试可取消，解决会话所有权冲突，并强化插件 Hooks。安全改进包括所有 Windows 可执行文件的 Authenticode 签名、日志凭据脱敏，以及更新依赖项以关闭 12 项安全公告。
  English → · 网页版完整更新日志 →
  使用攻略
  - 用户指南 — Reasonix Desktop 的官方用户指南。
  - 用户指南（中文） — Reasonix Desktop 的中文用户指南。
  - 规范 — Reasonix 规范。
  - 规范（中文） — Reasonix 的中文规范。
  概览
  Reasonix v1.17.21 — 更智能的规划、更安全的执行与更可靠的桌面体验
  此稳定版带来确定性规划、可靠的粘贴撤销、内嵌正则搜索和原生崩溃诊断。同时将 CLI 诊断与终端界面隔离，使提供程序重试可取消，解决会话所有权冲突，并强化插件 Hooks。安全改进包括所有 Windows 可执行文件的 Authenticode 签名、日志凭据脱敏，以及更新依赖项以关闭 12 项安全公告。
  发布日期：2026-07-25
  重点内容
  - 代码预览中的内嵌正则搜索 — 新增正则开关，通过限时执行（Worker 超时）在代码视图中启用安全的模式搜索，并提供了完整的结果限制和错误处理。 (#6923)
  - Windows 上 Ctrl+Z 粘贴撤销 — 程序化粘贴操作现在按草稿跟踪事务历史，支持 Ctrl+Z 撤销粘贴，同时保留原生输入历史和富编辑器状态。 (#6571)
  - 原生崩溃诊断 — 捕获 Go 运行时致命输出并分类异常退出，采用有界 10 报告队列。包含 Windows 响应检查和崩溃 Worker 集成。 (#6900)
  - 确定性规划器路由 — 将布尔规划器开关替换为明确的规划-执行、规划-批准和仅规划路由，并支持轻/全规划深度和有界研究。 (#6918)
  - 默认信任 MCP 和 Hooks — 项目及已安装的 MCP 服务器和 Hooks 现在加载时无需单独信任确认，移除了信任状态。重复名称会确定性解析。 (#6889)
  - 减少 Auto 失败恢复打断 — 工具失败现在被视为执行可靠性信号而非任务范围批准边界，无关工作和只读诊断会自动继续。 (#6896)
  - 重构的代码预览搜索栏 — 全宽搜索工具栏替换为不遮挡代码的紧凑浮动弹窗，同时行号使用 content-box 尺寸正确对齐。 (#6910)
  - 代码字体在对话和文件预览中生效 — 排版设置中选择的代码字体现在正确应用于对话代码块和带行号的文件预览，覆盖浏览器默认值。 (#6925)
  - 提供程序重试可取消 — 重试状态被视为权威前台活动，因此停止按钮保持响应，过时的空闲快照无法隐藏取消控件。 (#6902)
  - 清晰的 CLI 诊断与原子会话恢复 — 交互式 CLI 诊断和插件标准错误现在写入私有有界日志，不再干扰 TUI；同时，恢复租约所有权与原地历史变更保持失败原子性。 (#6912)
  - 会话运行时所有权冲突已解决 — 每个规范会话现在有一个进程内的本地会话运行时所有者，防止在 Goal + Delivery 及重复标签页中出现误导性的“租约阻塞”错误。 (#6897)
  - 跨平台插件 Hook 执行 — 插件 Hook 执行契约现在正确保留显式 exec 与 shell 形式，复合 CMD/PowerShell 脚本原样传输且不重新渲染令牌。 (#6911)
  - 全部 Windows 可执行文件已签名 — Windows 安装程序中的每个载荷可执行文件现在均已 Authenticode 签名，防止安装或更新后 Windows Defender 隔离应用。 (#6904)
  - 错误日志脱敏 — 错误日志中的凭据和 URL 用户信息在写入前被屏蔽，解决了 CodeQL 警报并防止敏感数据泄露。 (#6924)
  - 依赖安全补丁 — 更新了 Astro、PostCSS、sharp、SVGO、DOMPurify 等依赖项，关闭了六个漏洞系列中的 12 个 Dependabot 警报。 (#6922)
  新功能
  - 代码预览中的内嵌正则搜索 — 添加带 Worker 超时的有界正则搜索，限制模式和源码长度，并设置结果上限。支持字面量和正则切换。 (#6923)
  - Ctrl+Z 粘贴撤销 — 按草稿跟踪程序化粘贴编辑，保留原生输入顺序。在右键菜单和快捷键目录中添加撤销/重做。 (#6571)
  - 原生崩溃诊断 — 捕获 Go 致命输出，分类退出并排队最多 10 份报告。包含生命周期信号和 WebView2 检查。 (#6900)
  - 确定性规划器路由 — 用显式路由（规划-执行、规划-批准、仅规划）和轻/全深度替换布尔开关。 (#6918)
  - 默认信任 MCP 和 Hooks — 移除项目 MCP 服务器和 Hooks 的启动确认。将安装持久化到 config.toml；确定性解析重复项。 (#6889)
  改进
  - 减少 Auto 失败恢复打断 — 将工具失败视为可靠性信号，允许无关工作继续。有界重试和简洁的恢复指引。 (#6896)
  - 重构的代码预览搜索栏 — 用浮动搜索弹窗替换全宽工具栏；通过 content-box 尺寸对齐行号。 (#6910)
  修复
  - 对话和文件预览中的代码字体 — 将配置的代码字体应用于对话代码块和带行号的预览，覆盖浏览器等宽字体。 (#6925)
  - 提供程序重试可取消 — 将重试视为前台活动，确保无论快照顺序如何，停止按钮始终可点击。 (#6902)
  - CLI 诊断与恢复所有权 — 将交互式诊断与终端隔离，并在运行时重建期间原子迁移恢复租约所有权。 (#6912)
  - 会话运行时所有权 — 每个会话强制单本地运行时所有者，防止重复构建和误导的租约错误。 (#6897)
  - 插件 Hook 执行契约 — 保留显式 exec/shell 启动模式，原样传输复合脚本。 (#6911)
  - Windows Authenticode 签名 — 签名所有载荷可执行文件，防止安装或更新后被 Defender 隔离。 (#6904)
  - 错误日志敏感信息泄露 — 从心跳和机器人控制器错误日志中脱敏凭据和 URL 用户信息。 (#6924)
  - 依赖安全更新 — 修补 Astro、PostCSS、sharp、SVGO、DOMPurify 等中的 12 个 Dependabot 警报。 (#6922)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
