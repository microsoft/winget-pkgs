  - 配置路径 — 记录了 request_url 与供应商配置。
  - 桌面崩溃诊断手册 — 跨平台崩溃诊断与运行时归因。
  - 目标执行（中文） — 更新了连续执行与 token 预算。
  - 指南 — 更新了执行设定与计费。
  - 历史搜索目录 — 可丢弃的 SQLite 历史搜索目录。
