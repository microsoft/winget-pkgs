  概览
  Reasonix v1.24.0 — Reasonix v1.24.0：连续目标、统一执行与桌面体验优化
  目标现在默认连续执行直至完成，并支持可选的 token 预算。执行设定（轻量/均衡/交付）取代工作模式，提供统一的工具面。桌面端新增崩溃诊断、精简的任务控制与改进的聊天区滚动。计费在全链路统一，支持多币种。
  发布日期：2026-08-11
  重点内容
  - 连续目标执行 — 目标现在持续运行直至完成、遇到用户/外部阻塞、显式停止或不可恢复的故障。移除了主机拥有的轮次、回合、挂墙时间和停滞计数暂停边界。新增可选的 goal_token_budget 以基于 token 进行限制。 (#8373, #8382, #7725, #8357, #8347, #8340, #8318, #8309, #8228, #8296, #8233, #8119, #4138)
  - 统一执行设定 — 用三种执行设定（轻量、均衡、交付）取代了经济/完整/交付工作模式，共享一个供应商可见的工具面。可通过 CLI /preset 或桌面菜单原地切换。 (#8275)
  - 多币种计费 — 计费现在将模型原币费用、官方区域价表估值和展示币种分离。在桌面端、CLI、ACP 和 Remote 中统一。 (#8058)
  - 桌面崩溃诊断 — 新增了面向 Windows 和 Linux 的跨平台崩溃诊断与运行时归因。具备故障开放基础设施和隐私受限的遥测。 (#8169)
  - 桌面聊天区滚动 — 稳定了原生聊天区滚动，修复了流式输出结束时的自动滚动固定问题，并改进了对可变高度内容的处理。 (#8264, #8291)
  - 精简任务控制 — 用一个可访问的停止流程替换了重复的停止/取消控件。本地化了任务生命周期展示。 (#8392)
  - 精确自定义供应商 URL — 自定义供应商设置现在使用一个精确的 API 地址字段，无需路径补全。新增 request_url 同时保留旧的 chat_url。 (#8386)
  - 上下文容量条准确性 — 将上下文容量条与压缩触发器对齐，修复了超限显示，并移除了过时的回退值。 (#8329, #8221, #8307)
  - 收件箱暂停恢复 — 本地化了暂停的收件箱错误，并为普通暂停队列提供了恢复横幅。恢复了孤立的进行中指导。 (#8270)
  新功能
  - 可丢弃的 SQLite 目录 — 集成了用于会话、历史搜索、用量和任务领域的可丢弃 SQLite 目录。权威数据保留在磁盘上；SQLite 位于缓存下，可安全删除。 (#8257)
  - 内容驱动的上下文维护 — 用单一的 compact_ratio（默认 0.85）取代了多阈值自动修剪/裁剪。检查点形态：稳定前缀 + 一个结构化摘要 + 最近的逐字尾部。 (#8244)
  - 文件树中用默认应用打开 — 在工作区文件树右键菜单中添加了“用默认应用打开”，并对菜单项进行了分组。 (#8220)
  改进
  - 消息操作悬停标签 — 默认将 Fork、Compress 和 Rewind 标签折叠为仅图标按钮，在悬停或聚焦时显示标签。 (#8387)
  - 能力设置错误提示 — 将能力设置中的原始活动工作错误替换为本地化的可操作指导。 (#8101)
  - 隐藏插件模型分组中的普通供应商 — 防止未命名空间的配置支持供应商出现在模型选择器的 PLUGIN 分组中。 (#8097)
  - 隐藏上下文检查点详情 — 移除了面向用户的上下文检查点详情块，保留后端行为。 (#8265)
  修复
  - Windows 上目录测试兼容性 — 修复了目录和权限测试以符合 Windows 语义，解决了 CI 失败问题。 (#8408)
  - 重复的 DeepSeek 迁移警告 — 阻止桌面会话切换时重复弹出误导性的 DeepSeek 迁移警告。 (#8269)
  - 完成回执中的内部路由污染 — 将内部能力路由排除在完成回执之外，防止咨询对话被错误分类。 (#8317)
  - 不可见的排队问题 — 修复了一个错误：排在另一个提示后面的问题不可见，通过先注册再排队解决。 (#8335)
  - WebView2 发版烟测外部化 — 从发布的 EXE 中移除了仅用于测试的 WebView2 烟测生命周期，将覆盖移至外部浏览器门禁。 (#8333)
  - Creation 外观概览主题色块 — 恢复了 Creation 外观概览中被压扁为 7px 条的 hero 主题色块。 (#7584)
  升级提醒
  本版本无需手动迁移。
