  升级提醒
  本版本无需手动迁移。
  风险提示
  - [Desktop] 归档很长的恢复链可能需要一段时间 — 恢复链里的每个快照都会单独归档（报告的案例里每个约 2 MB），几十个快照可能要花几十秒。期间其他操作可以继续；如果提示还有快照未完成，再执行一次即可。 (#11717 by @esengine)
