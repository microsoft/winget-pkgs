  其他项目更新
  - [Service] 崩溃报告存储迁移 — 将崩溃报告存储迁移到 Firebase，并加入审批、输出与容量保护。 (#9418, #9424, #9425, #9415, #9413, #9407)
  升级提醒
  - [Desktop] 现有主题元数据会自动迁移 — 现有工作区会在首次访问时迁移，并保留旧版 JSON 镜像以支持顺序降级与再次升级；无需手动操作。 (#9466)
  风险提示
  - [Desktop] 新工作区的降级边界 — 在 v1.32.0 中首次创建的工作区仅在 SQLite 中保存主题元数据。直接降级时可从会话元数据恢复标题，但无法保证创建时间或自动标题阶段完整恢复。请勿让新旧 Reasonix 版本同时写入同一工作区。 (#9466)
