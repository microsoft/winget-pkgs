  远程 SSH 工作区、持久有序的回合、更流畅的对话导航，以及更可靠的 Windows 与状态恢复体验。
  发布渠道：稳定版 · v1.32.0
  English → · 网页版完整更新日志 →
  使用攻略
  - 远程 SSH 工作区指南 — 了解如何连接远程 SSH 工作区、管理会话并使用后台回合。
  - CLI 参考 — 命令行界面文档和配置选项。
  - 配置路径 — Reasonix 存储配置和状态文件的位置。
  - 迁移指南 — 如何将现有工作区和数据迁移到最新版本。
  - 工具契约 — 工具模式和提供程序交互的详细信息。
  概览
  Reasonix v1.32.0 — 远程工作区与持久化回合
  远程 SSH 工作区、持久有序的回合、更流畅的对话导航，以及更可靠的 Windows 与状态恢复体验。
  发布日期：2026-08-28
  Desktop 25 · CLI 11
  桌面端更新
  重点内容
  - [Desktop · CLI] 远程 SSH 工作区 — 连接远程 SSH 工作区、精确恢复会话，并在切换会话时让繁忙回合继续在后台运行。 (#9369, #9317, #9319, #9368, #9367)
  - [Desktop · CLI] 持久化、有序的回合 — 有序的回合事件现在可跨中断与重启持久保存，并防止已接受的副作用被重复执行。 (#9409)
  - [Desktop] 更流畅的对话滚动与导航 — 稳定滚动表面所有权，并在目标完成绘制后再提交会话导航。 (#9493, #9422)
  - [Desktop] Windows 任务栏图标和选区渲染 — 恢复了任务栏图标并稳定了 Windows 上的对话选区渲染。 (#9364, #9473)
  - [Desktop · CLI] MCP 会话可靠性 — 将受管 MCP 会话迁移到官方 Go SDK，并正确调度通过 ACP 提供的宿主会话服务器。 (#9410, #9381)
  - [Desktop] 主题元数据迁移 — 将主题元数据迁移到 SQLite 以提高可靠性和恢复能力。 (#9466)
  新增
  - [Desktop · CLI] 远程 SSH 工作区 — 连接远程 SSH 工作区、精确恢复会话，并在切换会话时让繁忙回合继续在后台运行。 (#9369, #9317, #9319, #9368, #9367)
  - [Desktop · CLI] 持久化、有序的回合 — 有序的回合事件现在可跨中断与重启持久保存，并防止已接受的副作用被重复执行。 (#9409)
  - [Desktop] 单个会话归档 — 现在可以在项目树分组中安全归档单个会话。 (#9374)
  改进
  - [Desktop] 更流畅的对话滚动与导航 — 稳定滚动表面所有权，并在目标完成绘制后再提交会话导航。 (#9493, #9422)
  - [Desktop · CLI] 精简 MCP 能力发现 — 能力列表现在只摘要展示各 MCP 服务器，完整工具目录仍可按需检查。 (#9499)
  - [Desktop · CLI] 压缩比例范围 — 将最小 compact_ratio 降低到 0.30，以便更早进行压缩。 (#9158)
  - [Desktop · CLI] 更清晰的记忆能力指引 — 能力说明现在会解释何时以及如何使用 Reasonix 记忆工具。 (#9376)
  - [Desktop · CLI] 按客户端拆分的更新日志 — 更新日志现在分别展示桌面端与 CLI 变更，便于判断升级影响。 (#9397)
  修复
  - [Desktop] Windows 任务栏图标和选区渲染 — 恢复了任务栏图标并稳定了 Windows 上的对话选区渲染。 (#9364, #9473)
  - [Desktop · CLI] MCP 会话可靠性 — 将受管 MCP 会话迁移到官方 Go SDK，并正确调度通过 ACP 提供的宿主会话服务器。 (#9410, #9381)
  - [Desktop] 原子发布恢复会话 — 恢复后的会话投影现在会原子发布，避免目录出现部分更新状态。 (#9421)
  - [Desktop] 清晰可读的操作弹层 — 操作对话框和菜单现在使用不透明主题表面，确保内容始终清晰可读。 (#9404)
  - [Desktop] macOS 在 exFAT 上的自动更新 — 修复了 exFAT 文件系统上的自动更新。 (#9153)
  - [Desktop] Standard 待办停滞 — 通过添加有界的继续提示修复了 Standard 待办停滞。 (#9483)
  - [Desktop] 可靠的会话归档 — 会话归档现在可容忍短暂的本地锁交接，不会误报会话仍在使用中。 (#9502)
  - [Desktop] 主题元数据迁移 — 将主题元数据迁移到 SQLite 以提高可靠性和恢复能力。 (#9466)
  - [Desktop · CLI] WebSocket 依赖更新 — 将 gorilla/websocket 更新到 1.5.3。 (#9382)
