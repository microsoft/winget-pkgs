  升级提醒
  - [Desktop · CLI] 降级前先完成中断工具恢复 — 降级运行时前，请先检查并确认未决的工具执行结果。旧版程序不会执行新增的恢复保护；恢复元数据以增量方式保存，安全重试默认关闭。 (#10039)
  风险提示
  - [Desktop · CLI] OpenCode Go Responses 搜索限制 — 发布实测未能从 OpenCode Go DeepSeek Responses 路径取得已完成的原生搜索证据。联网搜索请使用已验证的 OpenCode Go Anthropic 路径。普通模型调用、工具回放和图片输入已通过；本版本不将 Responses 搜索标记为已验证。 (#10015, #10081)
