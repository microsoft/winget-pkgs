  概览
  Reasonix v1.38.5 — Reasonix v1.38.5
  Reasonix 桌面端迁移至 Electron，新增 DeepSeek V4.1 Flash 图片输入、OpenCode Go 提供商预设、持久工具恢复和独立 dock 标签。本版本包含 v1.38.3 以来的改动、macOS 签名与公证修复，以及 Windows 扩展关闭稳定性修复；v1.38.4 未公开发布。
  发布日期：2026-09-11
  Desktop 28 · CLI 9
  桌面端更新
  重点内容
  - [Desktop] Electron 桌面壳 — 桌面端改用 Electron 替代 Wails，由桌面壳管理窗口生命周期、缩放和浏览器面板。 (#9988)
  - [Desktop · CLI] DeepSeek V4.1 Flash 原生图片输入 — 官方 DeepSeek 提供商现支持 V4.1 Flash 原生图片输入及 2026-09-10 价格表。模型列表正确报告图片能力，成本报价使用新价格。 (#10062)
  - [Desktop] 持久工具恢复 — 中断的工具执行现在可以在桌面和远程会话中通过证据支持的操作进行恢复，包括检查、确认、拒绝和可选的安全重试。 (#10039)
  - [Desktop] 工作区隔离启动器与独立视图标签 — 右侧 dock 现支持文件、改动、上下文和宿主面板的可重复视图标签，每个视图独立恢复状态，并采用全宽标题栏。 (#10041)
  - [Desktop] 修复旧版远程 Serve 发送失败 — 远程会话连接旧版 Serve 时不再失败；状态探测现在能正确处理 HTML 索引响应。 (#10027)
  - [Desktop · CLI] 证据门禁不再重复工作 — 操作现在由宿主拥有，防止代理因证据或验证不匹配而重复工作。 (#10049)
  - [Desktop] 准确的回合指标与输入区实时读数 — 回合指标读数现在来自单一来源，对汉字字符的令牌估算更准确，并在输入区运行条中显示实时读数。 (#10059)
  - [Desktop] 硬件加速设置 — 新增持久化的 Electron 硬件加速设置，并提供针对黑屏和渲染故障的恢复覆盖。 (#10040)
  新增
  - [Desktop · CLI] DeepSeek V4.1 Flash 支持 — 官方 DeepSeek 提供商现支持 V4.1 Flash 原生图片输入及 2026-09-10 价格表。 (#10062)
  - [Desktop] 持久工具恢复 — 中断的工具执行可以在桌面和远程会话中通过证据支持的操作进行恢复。 (#10039)
  - [Desktop] 工作区隔离启动器与独立视图标签 — 右侧 dock 支持文件、改动、上下文和宿主面板的可重复视图标签，每个视图独立恢复状态。 (#10041)
  - [Desktop] 硬件加速设置 — 持久化的 Electron 硬件加速设置，并提供恢复覆盖。 (#10040)
  - [Desktop] Electron 桌面壳 — 桌面端改用 Electron 替代 Wails，由桌面壳管理窗口生命周期、缩放和浏览器面板。 (#9988)
  - [Desktop · CLI] OpenCode Go 提供商预设 — 新增 OpenCode Go curated 提供商预设，其路由、推理与搜索契约已迁移到当前内核。 (#10015)
  改进
  - [Desktop] 回合指标准确性与输入区实时读数 — 回合指标现在使用单一来源，汉字令牌估算更准确，并在输入区运行条中显示实时读数。 (#10059)
  - [Desktop] Electron 缩放归属与旧配置迁移 — 应用缩放使用版本化的 Electron 存储，并一次性导入旧版中由用户明确设置的缩放比例。 (#10014)
  - [Desktop] 外部链接协议限制 — 外部链接仅允许 http、https 和 mailto 协议。 (#10005)
  修复
  - [Desktop · CLI] Windows 扩展关闭稳定性 — 强制关闭扩展与正常进程回收现在只释放一次 Windows 进程跟踪句柄，避免后续清理误关已被其他对象复用的句柄。 (#10082)
  - [Desktop] 旧版远程 Serve 发送失败 — 远程会话连接旧版 Serve 时不再失败；状态探测能正确处理 HTML 索引响应。 (#10027)
  - [Desktop · CLI] 证据门禁不再重复工作 — 操作由宿主拥有，防止因证据或验证不匹配而重复工作。 (#10049)
  - [Desktop] macOS 应用签名顺序 — 在主程序与外层应用包完成签名前，先签名相邻的 Go 服务，修复本次发现的公证失败。 (#10078)
  - [Desktop] 完整的 Electron macOS 包签名 — 对 Electron 包中的所有嵌套代码对象（包括 Go 侧车和框架）进行签名，以通过公证。 (#10072)
  - [Desktop · CLI] 解耦读取覆盖与写入守卫 — 部分文件读取不再冻结独立工具和最终答案。 (#10038)
  - [Desktop] 恢复 104px 输入框默认高度 — 新配置文件现在再次使用紧凑的 104px 输入框高度。 (#9990)
  - [Desktop] 修复运行中输入控件可用性 — 运行中的本地桌面任务现在可以通过现有输入控件添加附件和引用。 (#9984)
  - [Desktop] 修复 catalog 关闭时状态刷新超时 — 历史目录关闭时会取消进行中的状态刷新，避免刷新工作超过目录工作线程的生命周期。 (#10013)
