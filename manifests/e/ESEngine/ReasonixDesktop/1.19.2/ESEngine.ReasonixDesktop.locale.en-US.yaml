ReleaseNotes: |-
  统一更新通道、自适应语法高亮以及多项代理可靠性修复。
  发布渠道：稳定版 · v1.19.2
  English → · 网页版完整更新日志 →
  使用攻略
  - 能力诊断指南 — 有关诊断和理解能力状态的全面文档。
  - 用户指南 — Reasonix 通用用户指南。
  - 规范 — Reasonix 技术规范。
  概览
  Reasonix v1.19.2 — Reasonix 1.19.2
  统一更新通道、自适应语法高亮以及多项代理可靠性修复。
  发布日期：2026-08-02
  重点内容
  - 统一更新通道 — 所有客户端现在使用单一的官方发布通道，消除特定于通道的控制，简化更新。旧通道值映射到官方发布并带有弃用提示。 (#7201)
  - 自适应语法高亮 — 代码和差异块现在适应浅色和深色主题，具有符合 WCAG 的对比度，提高在所有主题下的可读性。 (#7159)
  - 减少代理警告噪音 — DeepSeek 思考模式缺少推理内容警告现在被限频，以避免重复通知。 (#7109)
  - 改进交付就绪验证恢复 — 当模型在交付就绪中卡住时，代理现在提供具体的安全验证命令，减少失败的准备尝试。 (#7146)
  - MCP 服务器冷启动弹性 — 启动缓慢的 MCP 服务器不再陷入重启循环；它们在后台继续初始化，用户会收到稍后重试的提示。 (#7164)
  改进
  - 更新通道统一 — 客户端现在将所有旧通道值规范化为官方发布。已弃用的选项保持兼容并显示提示。 (#7201)
  - 主题自适应代码高亮 — 桌面和命令行中的代码界面现在遵循活动主题，所有表面（包括差异）上都有安全的对比度。 (#7159)
  修复
  - 限频缺失推理警告 — DeepSeek 思考模式下缺失工具调用推理内容的警告现在被限频为每个事件每 24 小时一次。 (#7109)
  - 交付就绪验证恢复 — 当模型在准备就绪上遇到困难时，代理现在用安全的验证命令引导模型，减少重试。 (#7146)
  - MCP 冷启动后台化 — 启动缓慢的 MCP 服务器在后台继续；用户会收到稍后重试的错误，而不是重复重启。 (#7164)
  升级提醒
  - 更新通道迁移 — 旧更新通道（stable、preview）已统一为官方发布通道。旧的 --channel 选项以及 reasonix upgrade stable/preview 命令仍然可用，但已被弃用并会显示提示。 (#7201)
  风险提示
  当前没有需要额外操作的已知风险。
