ReleaseNotes: |-
  此版本重点修复会话创建、导航和生命周期问题，提升性能，并改善整体桌面体验。
  发布渠道：稳定版 · v1.38.12
  English → · 网页版完整更新日志 →
  使用攻略
  - 浏览器运行时升级 — 了解升级后的浏览器运行时，包括新功能和诊断改进。
  - 编辑器控制 — 编辑器控制文档，包括队列编辑和引导。
  - 模型设置 — 模型设置、运行时验证和后台网关保留的详细信息。
  - 读取快照分页 — 有界读取快照如何稳定会话列表分页。
  - Windows Agent Shell — 在 Windows 上恢复 Git Bash 和 Shell 设置。
  - 历史启动加载 — 延迟历史会话加载和有界原生分页。
  概览
  Reasonix v1.38.12 — 桌面稳定性、会话生命周期与性能改进
  此版本重点修复会话创建、导航和生命周期问题，提升性能，并改善整体桌面体验。
  发布日期：2026-09-24
  Desktop 32 · CLI 5
  桌面端更新
  重点内容
  - [Desktop] 修复项目侧栏与会话切换一致性 — 移除后重新添加项目可恢复侧栏可见性，过期读取不再覆盖当前会话列表，原生历史记录可通过统一会话身份正常打开。 (#10699)
  - [Desktop] 简化会话创建与恢复 — 新建会话不再出现 target_changed 错误、无关恢复失败或残留输入。创建反馈现在归属于所选会话。 (#10697)
  - [Desktop] 修复历史会话协调 — 旧格式会话可直接打开，已采用的源不再显示为重复的不可用行。 (#10696)
  - [Desktop] 延迟历史加载，启动更快 — 历史会话加载从启动关键路径中移除，采用有界后台发现和原生分页。 (#10664)
  - [Desktop] 消除会话生命周期死锁 — 修复了清理与预览操作、AI 重命名和自动保存完成竞争导致的挂起。 (#10690)
  - [Desktop] 稳定的会话列表分页 — 有界读取快照防止过期游标错误，并在元数据更新期间保持分页稳定。 (#10621)
  - [Desktop · CLI] 模型更改后保留后台网关 — 保存模型设置不再在后台任务运行时阻塞后续消息。 (#10688)
  新增
  - [Desktop] 编辑并调整待处理消息顺序 — 待处理消息可就地编辑，并可用指针或键盘调整顺序。 (#10626)
  - [Desktop] 原生图形故障恢复 — 桌面端为重复的 GPU 故障或持续卡顿提供原生恢复对话框。 (#10644)
  - [Desktop] 统一内置 HTML 预览 — 本地 HTML 文件在任务绑定的内置浏览器标签页中打开，并支持响应式工作区交付。 (#10596)
  改进
  - [Desktop · CLI] 更新 DeepSeek 与 MiMo 模型选项 — 新建 DeepSeek 官方连接默认使用 deepseek-flash。MiMo 明确区分 API 与 Token Plan，并加入 V2.6 Pro、Flash，同时保留已有默认模型和用户选择。 (#10624, #10655)
  - [Desktop] 升级内置浏览器运行时 — 浏览器操作保留所属会话与页面框架，能力状态与实际绑定的运行时一致，并提供诊断导出以排查浏览器故障。 (#10615, #10635)
  - [Desktop] 减少聊天区重复渲染 — 流式输出不再使未更改的聊天记录行失效，减少渲染器长任务。 (#10691)
  - [Desktop] 侧栏刷新更安静 — 当存在常驻页面时，后台刷新不再闪烁加载指示器。 (#10683)
  - [Desktop] 简化归档会话管理 — 归档页面采用响应式列表/预览布局，恢复为主要操作。 (#10623)
  - [Desktop] 恢复完整会话轮次导航 — 轮次导航栏现在包含所有会话轮次，并支持有界分页。 (#10619)
  - [Desktop] 降低历史会话与多会话资源占用 — 缓存和合并减少会话切换期间的重复工作。 (#10603)
  - [Desktop] 延迟会话加载提示 — 快速会话切换不再闪烁加载界面。 (#10599)
  修复
  - [Desktop · CLI] 恢复 Windows Shell 与路径兼容性 — 恢复 Git Bash 与 Shell 设置，并统一 Junction 路径身份，避免同一项目的等价路径干扰升级恢复。 (#10617, #10656)
  - [Desktop · CLI] 修复手动压缩与重复提交 — 手动压缩正确识别可压缩历史并显示进度，阻止重复提交且保留所属会话回执；取消操作不再提交新的摘要投影。 (#10598, #10628, #10642)
  - [Desktop] 保留待处理消息与关闭恢复状态 — 待处理消息、完成回执及恢复后的工具结果保持归属于原会话；历史生命周期和关闭恢复保留原始会话记录。 (#10592, #10593, #10634, #10646, #10660, #10681)
  - [Desktop] 修复残留历史归档与分支 — 历史分支与残留归档和正式会话保持一致，已退役来源不再出现在侧栏，会话恢复避免产生重复身份。 (#10594, #10613, #10671, #10676, #10689, #10696)
  - [Desktop] 保持 macOS Dock 图标比例 — macOS 安装包中的应用图标在 Dock 中保持预期缩放比例。 (#10641)
  - [Desktop] 修复切换会话后的速率异常飙升 — 恢复的会话现在根据匹配的提供程序活动间隔测量输出。 (#10684)
  - [Desktop] 修复概览上下文与用量串会话 — 上下文用量不再从上一个会话泄漏。 (#10679)
  - [Desktop] 防止清空回收站后的幽灵会话 — 清空回收站不再为已清除的会话创建幽灵行。 (#10677)
  - [Desktop] 修复连续分叉后侧栏未显示 — 来自同一来源的连续分叉现在无需重启即可显示在侧栏中。 (#10673)
  - [Desktop] 修复切回运行中会话时思考错序 — 返回运行中的会话时，推理不再显示在用户消息上方。 (#10670)
  - [Desktop] 修复任务完成后工具结果重复显示 — 已完成的工具调用不再出现在最终答案下方。 (#10590)
  CLI 端更新
  重点内容
  - [Desktop · CLI] 模型更改后保留后台网关 — 保存模型设置不再在后台任务运行时阻塞后续消息。 (#10688)
  改进
  - [Desktop · CLI] 更新 DeepSeek 与 MiMo 模型选项 — 新建 DeepSeek 官方连接默认使用 deepseek-flash。MiMo 明确区分 API 与 Token Plan，并加入 V2.6 Pro、Flash，同时保留已有默认模型和用户选择。 (#10624, #10655)
  修复
  - [Desktop · CLI] 恢复 Windows Shell 与路径兼容性 — 恢复 Git Bash 与 Shell 设置，并统一 Junction 路径身份，避免同一项目的等价路径干扰升级恢复。 (#10617, #10656)
  - [Desktop · CLI] 修复手动压缩与重复提交 — 手动压缩正确识别可压缩历史并显示进度，阻止重复提交且保留所属会话回执；取消操作不再提交新的摘要投影。 (#10598, #10628, #10642)
  升级提醒
  - [Desktop · CLI] 主动压缩会更新会话上下文 — 即使关闭自动压缩，主动执行 /compact 也会按要求压缩历史，因此可能替换已缓存的会话前缀；自动压缩阈值保持不变。 (#10642)
  - [Desktop] 旧草稿已停用 — 旧的工作区草稿工作流已移除。现有的正式历史记录和未发送输入保持不变。 (#10677)
  - [Desktop] 恢复即时会话创建 — 新建会话现在立即创建独立的正式会话，并支持升级安全的输入恢复。 (#10650)
  风险提示
  当前没有需要额外操作的已知风险。
