  概览
  Reasonix v1.19.4 — 模型感知推理、可靠更新与 Windows 启动链路
  此版本新增基元律动提供商及面向 DeepSeek 与 GLM 的模型感知推理，加强推理与工具调用恢复，恢复 CLI 的 -c 续聊快捷参数，自动修复更新后的原生快捷方式图标，阻止远程 Profile 重同步循环，并修复 Scoop 使用的 Windows 启动链路，同时防止条件式 React Hook 顺序崩溃，让较长的决策详情可访问且不会撑出桌面窗口。
  发布日期：2026-08-03
  重点内容
  - 推理消耗保护 — 引入了客户端 128KB 推理守卫和可配置的每模型输出令牌预算。官方 DeepSeek 端点默认应用 32K 总输出预算。当流在最终使用记录到达前被取消时，客户端现在会估算令牌使用量，防止令牌失控并使成本更可预测。 (#7186)
  - 基元律动与模型感知推理 — 新增基元律动提供商预设，支持模型发现、14 个精选模型、视觉元数据和本地化桌面端品牌展示。DeepSeek V4 模型会提供其支持的推理强度，GLM 5/5.1/5.2 则使用官方 thinking.type 请求格式并保留提供商返回的推理历史；匹配的旧版网关配置也会自动识别。 (#7301)
  - 静默恢复工具调用推理缺失 — 移除了推理内容缺失的用户可见警告；代理现在在工具执行前静默重试请求，减少了干扰性警告并提高了代理可靠性。 (#7259)
  - 加速的崩溃仪表板与偏好设置 — 预计算了 30 天偏好去重，使该视图加载仅需 68 毫秒，而实时计算的 7 天视图需要 5.6 秒。删除了冗余数据库索引以加速仪表板聚合查询；首页头像也优化为 WebP 格式，以减小下载量。 (#7279, #7284, #7258, #7266)
  - 桌面端 React Hook 状态切换不再崩溃 — 修复了异步模型列表、内置到自定义提供商编辑器切换，以及工作区代码搜索从关闭到打开时的 Hook 顺序。生产构建现会强制执行 React Hooks 检查，在发布前阻止同类崩溃。 (#7195, #7310)
  - Windows 启动器解析目录联接 — 修复了 Windows 启动器以正确解析 Scoop 的'current'目录联接，防止通过 Scoop 安装时启动失败。 (#7275)
  - 统一 Windows 工作区标签栏 — 工作区侧边栏现在仅显示四个预期视图（概览、文件、变更、远程），移除了重复的终端标签页，并正确放置了 Windows 标题控件。 (#7270)
  - 更新后自动修复原生快捷方式图标 — Reasonix 现在会在升级后仅修复自身拥有且已过期的图标集成：Windows 版本目录中的快捷方式图标、损坏或过期的 macOS Finder 别名，以及 Linux 桌面图标缓存。健康、无关或自定义的集成会被保留，修复失败也不会阻止启动。 (#7296)
  - 远程 Profile 不再循环重同步 — 相同的远程 Profile 更新现在不会产生副作用，延迟到达的控制面响应无法恢复过期的运行时权威，运行时 epoch 也会完整通过 Desktop 桥接，从而正确拒绝已被替换运行时的事件。 (#7277)
  新功能
  - 推理消耗保护 — 增加客户端推理字节守卫和可配置的每模型输出令牌预算，以防止意外的令牌消耗。 (#7186)
  - 基元律动提供商预设 — 为基元律动新增模型发现、14 个精选模型、视觉元数据、本地化品牌展示，以及面向 DeepSeek 与 GLM 的模型专用推理行为。 (#7301)
  改进
  - 更快的崩溃仪表板与偏好设置 — 通过预计算 30 天去重和删除冗余索引来加速仪表板聚合查询；首页头像改用 WebP 以减小下载量。 (#7279, #7284, #7258, #7266)
  - 创作界面优化 — 精简了创作风格下的输入模式 pill，并将文件夹打开器移至工具栏最前，布局更紧凑协调。经典版和工作台风格保持不变。 (#7276)
  修复
  - 工具调用推理缺失恢复 — 工具调用推理内容缺失时会静默重试，避免用户可见警告并提升工具可靠性。 (#7259)
  - 条件式 React Hook 顺序崩溃 — 修复模型列表、提供商编辑和工作区代码搜索中的 Hook 顺序，并新增构建期 Hooks 检查门禁。 (#7195, #7310)
  - 较长的决策详情 — Ask、审批、计划、安全、清除上下文和恢复场景中的较长说明现在会使用感知溢出且支持键盘与触控的展开控件，同时保持后果提示和操作按钮可见。 (#7300)
  - Windows 启动器目录联接解析 — 启动器现在会解析 Scoop 的 current 目录联接，并可靠启动当前活动版本。 (#7275)
  - Windows 工作区标签页对齐 — 工作区侧边栏现在仅显示预期视图，并正确放置 Windows 标题栏控件。 (#7270)
  - 更新后的原生图标修复 — 在 Windows、macOS 与原生 Linux 包中修复 Reasonix 自有的过期快捷方式图标和别名，同时不覆盖健康的自定义设置。 (#7296)
  - 远程 Profile 重同步循环 — 将相同的 Profile 与 Goal 变更处理为无操作，并隔离过期的控制面响应与运行时事件。 (#7277)
  - CLI 续聊快捷参数 — 修复 -c，使其在交互式与无头 CLI 会话中正确等同于 --continue，不再因参数解析错误而静默退出。 (#7223)
