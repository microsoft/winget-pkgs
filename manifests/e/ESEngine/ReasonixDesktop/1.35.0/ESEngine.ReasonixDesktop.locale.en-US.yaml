  概览
  Reasonix v1.35.0 — Reasonix 1.35.0
  此版本带来隔离 Git Worktree 分叉、超长会话的分块摘要恢复、简化的会话恢复版本对话框，以及针对转录滚动、压缩和会话目录身份的众多稳定性修复。
  发布日期：2026-08-31
  Desktop 24 · CLI 11
  桌面端更新
  重点内容
  - [Desktop] 将会话分叉至隔离 Git Worktree — 现在可以从任意消息轮次将会话分叉到由专用 Git 工作树支持的新标签页，使探索性工作与源检出保持分离。共享工作区分叉仍然可用。 (#9645)
  - [Desktop] 使用分块摘要恢复超长会话 — 当单次摘要请求因输出截断或窗口溢出而失败时，/compact 现在会自动回退到分块摘要和树形归并，并在当前会话中安装可工作的压缩投影。 (#9632)
  - [Desktop] 简化的会话恢复版本 — 会话恢复现在以单一的延迟版本对话框呈现。被覆盖的恢复副本从普通历史中隐藏，并在回收站中归入折叠的“系统恢复数据”部分。 (#9630)
  - [Desktop] 稳定转录滚动和历史渲染 — 多项修复防止历史预置期间出现可见跳动，确保历史 Markdown 无需等待滚动到底即可渲染，并稳定同标签页尾部接管。 (#9643, #9653, #9655, #9584, #9585)
  - [Desktop · CLI] 提高压缩可靠性 — 自动摘要请求现在按配置的上下文窗口封顶，手动压缩可以摆脱超顶死锁，小型共享窗口保持可接受。 (#9582, #9474, #9669)
  - [Desktop · CLI] 统一会话目录路径身份 — 会话目录现在使用文件系统感知的身份键，防止在大小写不敏感的文件系统上出现重复条目，并在大小写敏感的文件系统上保留不同路径。 (#9618)
  - [Desktop] 失败会话可归档 — 最终失败的会话不再导致重启循环，并可通过常规 TrashTopic 路径归档。 (#9591)
  - [Desktop · CLI] 回滚选择器显示用户提示 — 回滚选择器现在正确剥离交错的组合前缀并记录原始提示，因此您可以看到自己的话语而不是注入的通知。 (#9637)
  新增
  - [Desktop] 将会话分叉至隔离 Git Worktree — 从任意消息轮次分叉到由专用 Git 工作树支持的新标签页。隔离分叉从已提交的 HEAD 创建 reasonix/delivery-* 分支和关联工作树。共享分叉保留当前目录和未提交的更改。源检出脏时阻止隔离创建，并要求提交/暂存或使用共享分叉。当先决条件不可用时，会话回退到共享工作区并显示可见通知。成功引用的隔离工作树注册为项目，关闭标签页或重启后仍可发现。 (#9645)
  - [Desktop] /compact 的分块摘要回退 — 当单次摘要请求失败时，/compact 自动将折叠拆分为可重放、指数大小且带重叠的块，总结片段，树形归并简报，并在当前会话中安装生成的 CompactionModeChunked 投影，无需第二次命令。 (#9632)
  改进
  - [Desktop] 简化的会话恢复版本 — 恢复安全网保留，但物理恢复副本概念从普通项目树和历史工作流中移除。仅在目录确认真实分歧谱系后显示一个非阻塞通知，通知和历史都通过相同的延迟会话版本对话框。被覆盖的副本从普通历史中隐藏，并在回收站中归入折叠的“系统恢复数据”部分。打开版本不会更改默认值；选择默认版本不会删除、覆盖、合并或使另一个分歧版本符合清理条件。 (#9630)
  - [Desktop · CLI] 自动摘要请求封顶 — 自动压力/溢出摘要对共享和未知网关进行封顶。未知网关遵循有效配置或学习到的窗口。共享/未知摘要的输出上限缩放为 min(8192, max(window/4, 512))，而独立窗口提供者保留完整的 8192 令牌上限。摘要执行使用与规划相同的专用协议储备，compaction.prepare 替换根据最终请求限制重新验证。 (#9582)
  - [Desktop · CLI] 手动压缩摆脱超顶死锁 — 超过上限时，手动压缩现在先修剪，使用安全前缀折叠，并运行最多 4 个批次的救援循环，每个批次携带先前的摘要，直到视图低于上限或没有平衡前缀剩余。低于上限时，手动语义不变。 (#9474)
  - [Desktop · CLI] 缩放共享窗口准入缓冲 — 普通共享窗口准入缓冲现在随有效上下文窗口缩放：1/128，下限 256 令牌，上限 8K。这使小型共享窗口保持可接受，并防止不必要的溢出折叠。 (#9669)
  - [Desktop · CLI] 会话目录中统一的文件系统路径身份 — 会话目录现在将原始访问拼写与文件系统感知的身份键分离，用于桌面和 CLI 目标、SQLite 唯一性、工作区关系、扫描、索引、墓碑、修复所有权和目录锁。在大小写敏感的文件系统上保留不同的 /Foo 和 /foo 条目，而在大小写不敏感的文件系统上合并等效拼写。一次性目录移至 v6.sqlite，模式迁移至 v10。 (#9618)
  - [Desktop] 失败会话可归档 — 最终会话恢复失败不再导致重启循环。过滤后的 desktop-tabs.json 快照立即持久化，最终失败的会话可通过常规 TrashTopic 路径归档，而不会绕过活动工作保护。 (#9591)
  - [Desktop · CLI] 回滚选择器显示用户提示 — 回滚选择器现在将交错的组合前缀剥离到固定点，并在无头运行路径中记录原始提示，因此标签显示用户自己的话语而不是注入的通知。 (#9637)
  修复
  - [Desktop] 稳定分页历史预置 — 复杂转录在预置较旧历史时不再出现可见跳动。修复通过稳定行键捕获可见阅读器锚点，在一个代际绑定租约下持有连续页面，在挂载覆盖稳定之前隔离阅读器校正，并通过现有的代际隔离滚动写入器路由唯一的物理校正。 (#9643)
  - [Desktop] 有界转录预置提交 — 历史预置几何提交现在具有独立于阅读器输入稳定的墙钟界限，防止重复向下滚动无限期推迟已覆盖的预置并阻止阅读器到尾部交接。 (#9653)
  - [Desktop] 稳定有界转录尾部确认 — 尾部稳定阶段/帧元数据在稳定构建中保持功能，因此有界同修订重试不会被去重。在将小型 WebView2 无操作残差视为可达尾部之前需要重复确认，而显式跳到底部仍探测理论物理范围。 (#9655)
  - [Desktop] 稳定同标签页转录尾部接管 — 同标签页模型接管和重连现在通过实际在此路径上运行的代际绑定尾部事务收敛。揭示代际更改同步使旧布局表面失效，传入的首项事务拥有尾部，滚轮意图取消延迟确认，因此阅读器永远不会被拉回。 (#9584)
  - [Desktop] 历史 Markdown 无需等待底部即可渲染 — 历史 Markdown 解析可以在阅读器位于转录底部上方时完成。MarkdownHistory 现在根据实际的 .transcript 滚动器对实际的 Virtuoso 行进行分类：有界尾部窗口内的答案立即渲染，视口外已挂载的长行立即渲染，与阅读器视口相交的长行保留完整回退，直到阅读器返回共享的原生可达底部。 (#9585)
  - [Desktop] 恢复发布包体预算余量 — 合并的隔离工作树启动图测量为 2454.719 KiB，并通过现有的一位小数棘轮保留 0.081 KiB 的显式余量。所有 gzip、块、区域设置和 CSS 预算保持不变。 (#9668)
  - [Desktop · CLI] kill_shell 归类为仅主机状态变更 — kill_shell 不再进入工作区写协调或等待目标作业的路径租约，防止在终止后台作业时出现自阻塞生命周期操作。 (#9587)
