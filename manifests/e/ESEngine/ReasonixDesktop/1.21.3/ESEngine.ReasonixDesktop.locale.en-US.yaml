ReleaseNotes: |-
  此版本为思考过程带来 Markdown 渲染，为自定义网关提供显式 Kimi K3 推理支持，新增存储路径展示与自适应无进展防护，并修复 Windows 安装位置、任务栏分组、重试导致的提前压缩以及流合并问题。
  发布渠道：稳定版 · v1.21.3
  English → · 网页版完整更新日志 →
  使用攻略
  - 自定义 Kimi K3 网关设置 — 了解如何配置自定义 OpenAI 兼容网关以使用 Kimi K3 推理协议。
  - 自定义 Kimi K3 网关设置（中文） — 了解如何配置自定义 OpenAI 兼容网关以使用 Kimi K3 推理协议。
  概览
  Reasonix v1.21.3 — Reasonix v1.21.3
  此版本为思考过程带来 Markdown 渲染，为自定义网关提供显式 Kimi K3 推理支持，新增存储路径展示与自适应无进展防护，并修复 Windows 安装位置、任务栏分组、重试导致的提前压缩以及流合并问题。
  发布日期：2026-08-08
  重点内容
  - 思考过程现在以 Markdown 渲染 — 推理面板、折叠轮次和子代理预览现在可以正确显示标题、强调、列表和代码块。推理完成后立即停止流式传输，隐藏内容保持轻量。 (#7940)
  - 存储路径可见，Windows 保留安装位置 — 设置中现在会以只读方式显示运行时实际使用的工作区、会话与记忆、缓存和扩展路径。Windows 安装与更新会继续使用用户现有的安装目录。 (#7942)
  - 自定义网关的显式 Kimi K3 推理 — 自定义 OpenAI 兼容网关现在可以在提供商编辑器中直接选择 Kimi K3 推理协议。推理历史得以保留，精选的 OpenCode Go 中继保持不变。 (#7903)
  - 修复 Windows 任务栏图标分组 — 从固定快捷方式启动现在会重用固定图标，而不是创建第二个图标。现有快捷方式会自动修复，0.53 版本保持独立身份。 (#7925)
  - 修复重试导致的提前压缩决策 — 自动压缩现在使用最新的单次请求提示大小，防止流中断导致多次尝试时过早折叠上下文。计费总额保持准确。 (#7930)
  - 自适应无进展防护取代固定轮次计数 — 代理现在仅在连续轮次未添加新证据时升级，任何进展都会重置。这可以防止在取得进展时进行不必要的提示和强制停止。 (#7915)
  - 流合并现在在热路径上生效 — 修复了接线问题，确保代理的令牌突发在到达前端之前正确合并，减少 UI 抖动和事件量。 (#7905)
  新功能
  - 自定义网关的显式 Kimi K3 推理 — 自定义 OpenAI 兼容网关现在可以在提供商编辑器中直接选择 Kimi K3 推理协议。推理历史得以保留，精选的 OpenCode Go 中继保持不变。 (#7903)
  改进
  - 思考过程现在以 Markdown 渲染 — 推理面板、折叠轮次和子代理预览现在可以正确显示标题、强调、列表和代码块。推理完成后立即停止流式传输，隐藏内容保持轻量。 (#7940)
  - 存储路径可见，Windows 保留安装位置 — 设置中现在会以只读方式显示运行时实际使用的工作区、会话与记忆、缓存和扩展路径。Windows 安装与更新会继续使用用户现有的安装目录。 (#7942)
  - 自适应无进展防护取代固定轮次计数 — 代理现在仅在连续轮次未添加新证据时升级，任何进展都会重置。这可以防止在取得进展时进行不必要的提示和强制停止。 (#7915)
  修复
  - 修复 Windows 任务栏图标分组 — 从固定快捷方式启动现在会重用固定图标，而不是创建第二个图标。现有快捷方式会自动修复，0.53 版本保持独立身份。 (#7925)
  - 修复重试导致的提前压缩决策 — 自动压缩现在使用最新的单次请求提示大小，防止流中断导致多次尝试时过早折叠上下文。计费总额保持准确。 (#7930)
  - 流合并现在在热路径上生效 — 修复了接线问题，确保代理的令牌突发在到达前端之前正确合并，减少 UI 抖动和事件量。 (#7905)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
