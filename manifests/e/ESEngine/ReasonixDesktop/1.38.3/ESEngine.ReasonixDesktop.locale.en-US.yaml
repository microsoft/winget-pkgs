  升级提醒
  - [Desktop · CLI] 升级由 Desktop 管理的旧版 Serve — 保存的配置与历史无需手动迁移。对于由 Desktop 管理的远程会话，不支持设置快照的旧版 Serve 需要在当前任务结束后升级或安全重连；保存设置不会强制终止当前任务。 (#9973)
  - [Desktop] 状态栏首次采用图标样式 — 新配置和已有配置首次采用图标标签。可在设置中切换回文字样式，此次迁移后的手动选择会被保留。 (#9958)
  风险提示
  当前没有需要额外操作的已知风险。
