ReleaseNotes: |-
  桌面端修复：会话用量统计清零、长轮次历史分页、远端会话切换、分叉会话和编辑目标，并部分修复迁移后会话消失的问题。
  发布渠道：稳定版 · v1.39.7
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.39.7 — Reasonix 1.39.7
  桌面端修复：会话用量统计清零、长轮次历史分页、远端会话切换、分叉会话和编辑目标，并部分修复迁移后会话消失的问题。
  发布日期：2026-10-02
  Desktop 7 · CLI 0
  桌面端更新
  重点内容
  - [Desktop] 切换会话后再切回来，用量统计不再清零 — 当前存储格式的会话没有保存用量快照，切换到别的会话再切回来后，请求数、令牌数、费用和已读文件记录都会归零。现在这些数据按会话保存，打开会话时恢复；文件缺失或损坏时回退为空，不会影响切换。 (#11621)
  - [Desktop] 远端会话忙碌时切换，消息和历史不再丢失 — 远端会话处于过渡状态时提交的消息可能直接失败，忙碌时提交的消息不会立刻出现在队列里，回到访问过的会话还要等完整历史加载。现在临时过渡会在保留消息和附件的前提下重试，排队的消息立即显示，运行中的会话在后台保持连接，访问过的会话先显示已有历史，再与权威历史对账。 (#11345, #11512 by @XTLine)
  修复
  - [Desktop] 被历史分页截断的长轮次可以折叠，滚到底部会自动加载最新一页 — 历史分页把一轮对话截成两半时，后半部分的工具卡片会一直展开且没有折叠按钮，直到前一页加载完。现在它和其他已完成的轮次一样可以折叠。加载更早的页面后，滚到窗口底部会自动请求下一页一次，折叠起来的长轮次不再看起来像对话结尾。手动按钮仍然保留。 (#11338)
  - [Desktop] 同一个会话第二次分叉后，工作区历史不再无法加载 — 分叉的来源是它的父会话目录，而一个来源只能登记一次。同一个父会话的第二次分叉会撞上冲突，导致工作区历史无法加载。现在来源已登记时会跳过重复登记。 (#11587, #11597)
  - [Desktop] 编辑目标改为应用内表单，不再点击后无反应 — 输入框里的「编辑目标」调用了桌面外壳不支持的浏览器输入框，点击后没有任何反应。现在改为内嵌表单，可以修改目标和最大轮数，并带校验。 (#11573, #11576)
  - [Desktop] 未登记项目里旧标签页的会话不再卡在工作区冲突（部分修复） — 迁移一个指向未登记项目目录的旧标签页时，会沿用标签页自己的范围，可能报「工作区冲突」。现在当会话记录的项目根目录与该目录一致时，范围取自会话记录；其他不一致仍会报告冲突。这只是 #11641 的部分修复：已被标记为冲突的条目不会自动清除，报告者的具体情况仍在调查。 (#11641, #11647)
  CLI 端更新
  本版本没有 CLI 相关功能、改进或修复，CLI 用户可按需跳过。
  升级提醒
  本版本无需手动迁移。
  风险提示
  - [Desktop] 部分迁移后的会话可能仍然缺失（#11641） — 本版本不会清除已经被标记为工作区冲突的恢复条目。更新后如果会话仍然缺失，请到 #11641 补充信息。 (#11641)
