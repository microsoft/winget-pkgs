ReleaseNotes: |-
  此版本恢复了提问提交与恢复流程，隔离了过期的桌面会话状态，统一了 Ask 与决策弹窗，并修复了 DeepSeek 周末计费。
  发布渠道：稳定版 · v1.38.1
  English → · 网页版完整更新日志 →
  使用攻略
  - 桌面提示身份 — 桌面提示卡片如何跨轮次、运行时和重连进行标识与隔离。
  - 会话恢复与并行 — Go 重写中统一的会话恢复与并行工作生命周期契约。
  - 工具契约 — 关于工具参数验证、能力恢复、软收敛、兼容性和缓存影响的双语指南。
  概览
  Reasonix v1.38.1 — 桌面稳定性与恢复修复
  此版本恢复了提问提交与恢复流程，隔离了过期的桌面会话状态，统一了 Ask 与决策弹窗，并修复了 DeepSeek 周末计费。
  发布日期：2026-09-06
  Desktop 18 · CLI 4
  桌面端更新
  重点内容
  - [Desktop] 恢复提问提交与状态恢复 — 精确的 Ask 回答不再因未挂起而失败，不可写的事件账本不再导致取消或提示解析死锁。键盘输入的自定义答案得以保留，Ask 草稿按标签页/运行时/轮次/提示身份隔离，后台恢复错误得到遏制。 (#9862)
  - [Desktop] 隔离过期提示卡片 — 延迟的 Ask 或决策卡片响应不再能超过创建它们的轮次或控制器。每个提示都绑定到 promptId、turnId、runtimeEpoch 和 kind，过期响应仅使匹配的身份失效。 (#9852)
  - [Desktop] 修复桌面会话状态竞态 — 会话不再在转录或运行时仍存在时显示为空或无法执行。来自先前会话绑定的延迟事件通过 runtimeEpoch 和 sessionGeneration 隔离被拒绝。 (#9842)
  - [Desktop] 统一 Ask 与决策弹窗 — 桌面 Ask 界面现在与 DeepSeek Harness 一致，具有紧凑的标题控件、逐题分页器、内联自定义答案、草稿恢复，以及用于审批、MCP 交互、运行时决策和扩展表单的共享视觉外壳。 (#9844)
  - [Desktop] 修复 Ask 自定义回答草稿丢失 — 选择建议选项不再清除自定义答案草稿。草稿按问题保留，并在重新打开自定义输入时恢复。 (#9840)
  - [Desktop] 修复主题栏打开器 key 冲突 — 切换项目不再在主题栏中留下重复的外部打开器控件。组件键独立命名空间化，以防止陈旧实例。 (#9836)
  - [Desktop · CLI] 修复 DeepSeek 周末峰值计费 — DeepSeek 峰值计费不再在周六和周日应用。计费表现在正确地仅适用于周一至周五。 (#9846)
  - [Desktop · CLI] 可恢复的工具参数错误 — 格式错误的工具参数现在报告为可操作的未执行错误，而不是升级为阻塞的权限样式状态。保守地检测冗余的顶层 arguments 包装器，并在不掩盖授权失败的情况下诊断可修复的 use_capability 信封错误。 (#9863)
  - [Desktop] 统一并行与会话恢复契约 — 恢复副本现在具有明确的版本身份和状态。恢复失败以挂起状态持久化，并提供本地化的重试指导，工作树生命周期负载标识源修订和所属任务/会话。 (#9848)
