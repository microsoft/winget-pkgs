  概览
  Reasonix v1.23.0 — Reasonix v1.23.0：更智能的上下文、更安全的委托与更流畅的桌面体验
  本次更新带来了统一的内容驱动上下文维护系统、带验收标准执行的结构化计划合约、有界对话轮次以及持久化会话收件箱。桌面端新增跨消息逻辑选区、工作区实时刷新和三模式思考过程展示。CLI 现在会询问上下文窗口大小并清晰报告失败。修复了大量压缩、令牌估算和委托相关的缺陷，使长会话更可预测且更具成本效益。
  发布日期：2026-08-10
  重点内容
  - 内容驱动的上下文维护 — 用单一的 compact_ratio 触发器取代了多阈值自动上下文修剪。系统现在会创建稳定的前缀、一个结构化摘要和最近的逐字尾部，保留缓存命中并降低成本。默认比率为 0.85。 (#8244)
  - 带验收标准的结构化计划合约 — 计划现在是具有稳定步骤标识的结构化记录。Agent 在完成轮次前会强制执行验收标准，计划审核者会收到变更差异。这确保了约定的结果确实得到满足。 (#8167, #8183, #8193, #8201, #8222, #8235, #8249, #8250)
  - 有界对话轮次 — 普通对话轮次现在默认上限为 100 个模型轮次，以防止失控循环。Goal 运行限制为 16 轮。系统还会检测结构性卡住状态，并以可恢复的 goal_stuck 状态暂停。 (#8185, #8228)
  - 持久化会话收件箱 — 排队的后续指令和引导指令现在在确认前会持久化到会话范围的收件箱中。这可以防止崩溃时丢失，并通过暂停审核和容量限制确保可靠恢复。 (#8061)
  - 跨消息逻辑选区（桌面端） — 跨多条消息选择文本现在使用逻辑选区模型，保持 DOM 有界，并从 Markdown、LaTeX、代码块和表格中生成可读的复制文本。单条消息选择仍为原生方式。 (#8224)
  - 三模式思考过程展示（桌面端） — 新增持久化的思考过程展示偏好：隐藏、摘要或自动（实时跟随）。适用于主 Agent、工作折叠区和子 Agent 预览。旧设置会自动迁移。 (#8103)
  - 工作区实时刷新（桌面端） — 工作区预览和变更视图现在会根据 Agent 变更事件、有界文件系统/Git 监视和修订协调立即更新，而无需等待轮次完成。 (#8102)
  - CLI 上下文窗口提示 — 自定义提供程序向导现在会询问上下文窗口大小，而不是默认假设为 128K 令牌。这可以防止在具有更大窗口的模型上过早压缩。 (#8124)
  - 委托合约与度量 — 子 Agent 委托现在是一个正式的合约，具有强制写入声明、主机裁决的完成和详细的成本度量。这提高了复杂任务的安全性和透明度。 (#8114)
  - 压缩与令牌估算修复 — 修复了多个导致过早或过度压缩的缺陷：输出预算导致阈值崩溃、基于字符的令牌估算、冷启动校准丢失以及上下文仪表不匹配。这些更改使长会话更可预测，并降低了 API 成本。 (#8199, #8205, #8207, #8210, #8221)
  - 失控循环预防 — 探索现在在连续六个只读轮次后不再将新颖性计为进展，从而允许无进展防护触发。结合轮次上限，这可以防止数小时无输出的徘徊。 (#8233)
  - 委托调用可见性 — 修复了委托的子 Agent 调用在对话记录中显示为顶级工作，以及拒绝被显示为成功的问题。现在子调用在其父级内部渲染，被阻止的命令会正确报告。 (#8246)
  - 桌面任务监视器计时器冻结 — 终端任务的已用时间显示现在会在正确的边界冻结，排队任务显示为破折号而不是将排队时间作为运行时间。 (#7655)
  - Windows 资源管理器文件夹打开 — 修复了“在文件资源管理器中打开”可能启动同级 .lnk 快捷方式而不是文件夹的错误。文件夹现在使用 explore 动词和尾部路径分隔符打开。 (#8010)
  - CLI 失败报告 — CLI 现在始终会解释运行失败的原因，即使使用 -p/--print 也是如此。以前，文本输出可能以代码 1 退出且 stderr 为空。 (#8212)
  - Windows 对话滚动闪烁 — 移除了 Windows 上不必要的全屏清除，该清除导致对话滚动时出现可见的闪烁和项目抖动。 (#8142)
  - 压缩中的证据保留 — 保留策略现在通过结构化状态正确识别工具失败，而不仅仅是文本前缀。这可以在压缩过程中保留特定的失败证据，而不会使投影大小翻倍。 (#8155)
  - 加固的桌面构建与审核门禁 — 强制执行原生 CSS 动画合约，添加了 WebView2 发版门禁，统一了 Wails CLI/库版本锁定，并移除了导致虚假 CI 失败的跨边界审核门禁。 (#8069, #8096, #8098, #8211)
  新功能
  - 内容驱动的上下文维护 — 单一的 compact_ratio 触发器，具有稳定的前缀、摘要和逐字尾部。默认 0.85。 (#8244)
  - 结构化计划合约 — 计划是具有稳定步骤 ID 的记录；在轮次完成前强制执行验收标准。 (#8167, #8183, #8193, #8201, #8222, #8235, #8249, #8250)
  - 有界对话轮次 — 对话默认 100 轮上限，Goal 运行 16 轮；结构性卡住检测，goal_stuck 暂停。 (#8185, #8228)
  - 持久化会话收件箱 — 持久化排队指令，具有崩溃恢复、容量限制和隔离挽救功能。 (#8061)
  - 跨消息逻辑选区（桌面端） — 任意已加载历史长度的逻辑选区；有界 DOM，从 Markdown/LaTeX/代码/表格中可读复制。 (#8224)
  - 三模式思考过程展示（桌面端） — 隐藏、摘要或自动（实时跟随）思考过程展示；旧版迁移。 (#8103)
  - 委托合约 — 正式的子 Agent 委托，具有强制写入声明、主机裁决的完成和成本度量。 (#8114)
  - OpenCode Go DeepSeek 预设 — 新增仅 Flash 的 Anthropic Messages 和 Responses API 预设，并启用网络搜索。 (#8105)
  - 上下文报告命令 — /context 现在显示窗口、阈值、上次维护过程和阻止原因。 (#8126)
  改进
  - 工作区实时刷新（桌面端） — 根据 Agent 变更、文件系统/Git 监视和修订协调立即更新。 (#8102)
  - CLI 上下文窗口提示 — 向导询问上下文窗口大小，而不是假设 128K。 (#8124)
  - 计划审核者差异 — 审核者收到计划变更的结构化差异，而不仅仅是两个渲染字符串。 (#8249)
  - 证据来源跟踪 — 基准测试现在度量委托独立性和锚点抵抗力。 (#8154)
  - 桌面构建加固 — 统一 Wails 版本锁定，Node 24/pnpm 10 对齐，非交互式安装。 (#8069, #8098)
  修复
  - 压缩阈值崩溃 — 输出预算不再导致所有阈值崩溃；最多保留窗口的 25%。 (#8199)
  - 令牌估算单位 — 冷估算使用字符数 × 0.25，而不是符文数；修复了 CJK 的 3 倍高估问题。 (#8205)
  - 会话切换时校准保留 — 提示令牌校准现在在会话重新绑定（标签切换、分支、回退）时保留。 (#8207)
  - 单一压缩触发器 — 工具结果维护仅在 compact_ratio 时运行，保留折叠点以下的缓存命中。 (#8210)
  - 上下文仪表准确性 — 仪表现在测量与压缩触发器相同的输入令牌，而不是上一轮的使用量。 (#8221)
  - 失控循环预防 — 探索新颖性在 6 个只读轮次后不再计为进展。 (#8233)
  - 委托调用可见性 — 子 Agent 调用在父级内部渲染；被阻止的命令正确报告为未运行。 (#8246)
  - 桌面任务监视器计时器 — 已用时间在终端状态冻结；排队任务显示破折号。 (#7655)
  - Windows 资源管理器文件夹打开 — 使用 explore 动词和尾部路径分隔符以避免 .lnk 劫持。 (#8010)
  - CLI 失败报告 — 始终解释运行失败的原因，即使使用 -p。 (#8212)
  - Windows 对话滚动闪烁 — 移除了 Windows 上不必要的全屏清除。 (#8142)
  - 压缩中的证据保留 — 保留策略使用结构化工具状态，而不是文本前缀；以最小的尺寸增加保留失败信息。 (#8155)
  - CI 偶发故障修复 — 增加了 Windows 测试和前端对话记录工具的超时时间，以防止误报失败。 (#8229)
  - Warp 终端滚动清除 — 旧版全重绘解决方法现在仅限于 Warp 终端。 (#8156)
  - Windows CI 解除阻塞 — 增加了测试超时时间，并修复了 Windows 上的会话收件箱/钩子测试。 (#8255)
