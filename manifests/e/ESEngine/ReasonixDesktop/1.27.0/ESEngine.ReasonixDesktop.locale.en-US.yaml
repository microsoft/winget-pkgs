  概览
  Reasonix v1.27.0 — Reasonix 桌面版 1.27.0
  此版本提高了会话导航的可靠性，新增按序批量签收与锚点安全门禁，并加固了桌面窗口生命周期恢复。
  发布日期：2026-08-17
  重点内容
  - 按序批量签收与锚点安全门禁 — 现在可以在一个提供方工具调用回合中进行多个有证据支持的 complete_step 调用，同时保持规范的 Todo 顺序、顺序主机推进、拒绝语义和幂等性。为 delete_range 添加了仅主机可见的模型文本观察和闭区间 SHA-256 指纹，并安全处理同批次读取、部分窗口、更改目标和无效锚点。 (#9046)
  - 可靠的会话导航与滚动所有权 — 修复了过期的会话导航，保留了向上阅读意图，使会话尾部收敛于原生几何，并修复了问题导航点击。跨会话导航现在同步隐藏源内容并显示本地化的加载界面。 (#9054, #9053, #9044, #9013, #9024)
  - 桌面窗口生命周期恢复加固 — 通过一个 App 拥有的生命周期路径协调主窗口呈现，在实时 StatusNotifier 注册上限制 Linux 关闭到后台，并将 Wayland 激活视为合成器确认。 (#9021)
  - 修复 Responses 缺少推理的工具回合 — 当提供方省略可选推理项时，恢复了 DeepSeek 和 MiMo Responses 工具回合，并具有努力感知的重放要求。 (#9052)
  - 工具结果缓存前缀稳定性 — 将每个提供方可见的工具结果保持在稳定的持久化 Content 表示上，限制为 32 KiB，同时在 RawContent 中保留完整的本地值。 (#9033)
  - macOS 工作区监听使用 FSEvents — 用 Apple FSEvents 替换了 macOS 的 fsnotify/kqueue 工作区后端，每个工作区监视根使用一个原生流，而不是随目录树增长的描述符。 (#9017)
  - 修复切换会话时项目树临时乱序 — 在运行时投影路径上保持单表面主题切换，并按精确会话路径索引已提交的转录/边车更改。 (#9016)
  - 未完成 todo 只在闭环回合阻塞 — 当部分完成的 todo 列表是跨回合工作状态时，普通开放回合现在正常结束，同时保留对 Goal、已批准 Plan 和严格义务回合的执行。 (#9026)
  新功能
  - 按序批量签收与锚点安全门禁 — 在一个提供方工具调用回合中进行多个有证据支持的 complete_step 调用，具有规范的 Todo 顺序、顺序主机推进、拒绝语义和幂等性。为 delete_range 添加仅主机可见的模型文本观察和闭区间 SHA-256 指纹。 (#9046)
  改进
  - 会话导航与滚动所有权 — 修复了过期的会话导航，保留了向上阅读意图，使会话尾部收敛于原生几何，并修复了问题导航点击。跨会话导航同步隐藏源内容。 (#9054, #9053, #9044, #9013, #9024)
  - 桌面窗口生命周期恢复 — 通过一个 App 拥有的生命周期路径协调主窗口呈现，在实时 StatusNotifier 注册上限制 Linux 关闭到后台，并将 Wayland 激活视为合成器确认。 (#9021)
  - Responses 缺少推理的工具回合 — 当提供方省略可选推理项时，恢复了 DeepSeek 和 MiMo Responses 工具回合，并具有努力感知的重放要求。 (#9052)
  - 工具结果缓存前缀稳定性 — 将每个提供方可见的工具结果保持在稳定的持久化 Content 表示上，限制为 32 KiB，同时在 RawContent 中保留完整的本地值。 (#9033)
  - macOS 工作区监听使用 FSEvents — 用 Apple FSEvents 替换了 macOS 的 fsnotify/kqueue 工作区后端，每个工作区监视根使用一个原生流，而不是随目录树增长的描述符。 (#9017)
  - 切换会话时项目树临时乱序 — 在运行时投影路径上保持单表面主题切换，并按精确会话路径索引已提交的转录/边车更改。 (#9016)
  - 未完成 todo 只在闭环回合阻塞 — 当部分完成的 todo 列表是跨回合工作状态时，普通开放回合现在正常结束，同时保留对 Goal、已批准 Plan 和严格义务回合的执行。 (#9026)
