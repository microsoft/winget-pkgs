ReleaseNotes: |-
  本次发布引入完成契约，使目标声明可对照收据进行核查。记忆功能新增激活、易变性、主题键和 CJK 双字检索。桌面端优化了会话切换性能、本地文件链接处理和输入法感知的 ESC 行为。智能体改进包括增量折叠摘要携带、压缩边界和推理调控器影子模式。
  发布渠道：稳定版 · v1.21.4
  English → · 网页版完整更新日志 →
  概览
  Reasonix v1.21.4 — Reasonix v1.21.4：记忆维度、完成契约与桌面体验优化
  本次发布引入完成契约，使目标声明可对照收据进行核查。记忆功能新增激活、易变性、主题键和 CJK 双字检索。桌面端优化了会话切换性能、本地文件链接处理和输入法感知的 ESC 行为。智能体改进包括增量折叠摘要携带、压缩边界和推理调控器影子模式。
  发布日期：2026-08-09
  重点内容
  - 完成契约：可核查的目标声明 — 目标完成现在携带可核查的声明。已验证的命令会与收据进行核对；无依据的声明会变成缺口。由主机生成的完成报告会显示缺失的证明，而不会强制进行验证循环。 (#8036, #8035)
  - 记忆维度：激活、易变性与主题键 — 事实可以固定到稳定前缀，或仅用于检索。易变性窗口（永久/稳定/易变）和过期日期控制新鲜度。主题键通过每个问题只允许一个活跃值来防止静默矛盾。 (#7996, #7998, #8014)
  - 桌面端：会话切换性能与本地文件链接 — 大型会话历史和快速主题切换不再阻塞渲染器。智能体输出中的本地文件路径可点击打开，右键菜单提供其他应用和文件管理器选项。 (#7999, #7985)
  - 智能体：增量折叠摘要携带与压缩边界 — 增量折叠现在逐字携带之前的摘要，恢复了 18 个丢失探针中的 17 个。压缩输入有边界，确保长会话始终可以折叠，防止会话卡死。 (#8031, #8021)
  - 桌面端：输入法感知的 ESC 与选区释放 — 在输入法候选窗口打开时按 ESC 不再取消正在运行的智能体回合。过时的聊天记录选区会在新点击时释放，添加到聊天操作在激活期间保留选区范围。 (#7919, #7988)
  新功能
  - 完成契约 — 目标完成声明现在可核查。主机生成的完成报告可识别声明与收据之间的缺口，使过早的“完成”声明透明化。 (#8036, #8035)
  - 记忆激活与主题键 — 事实可固定到稳定前缀或仅用于检索。主题键可防止同一主题出现矛盾事实。 (#7996, #8014)
  - 记忆易变性与过期 — 事实现在支持易变性窗口（永久/稳定/易变）和明确的过期日期，以控制新鲜度。 (#7998)
  - CJK 双字检索与写入时关键词 — 记忆检索现在使用 CJK 双字以改善匹配，事实可包含写入时关键词以实现语义桥接。 (#7994)
  - 显式上下文压缩工具 — 模型可调用的 compress 工具允许显式范围压缩，而无需重写规范记录。 (#8000)
  - MCP OAuth 与失败感知路由 — 远程 MCP 服务器的第一方 OAuth 授权，具有沙箱安全的凭据存储和失败感知的工具路由。 (#7932)
  - 代际安全的运行时组合 — 具有依赖图、生命周期状态和原子发布/提交的运行时组合，用于多会话隔离。 (#7902)
  - 懒加载思考摘要 — 折叠的推理轨迹现在显示预览行，完整的 Markdown 渲染延迟到展开时。 (#7966)
  - 桌面状态栏：TPS、缓存和输出令牌 — 可配置的状态栏项目显示回合吞吐量、缓存令牌计数和输出令牌。 (#6931)
  - 推理调控器影子模式 — 影子推理调控器在不强制执行策略的情况下测量探索阶段效率，为未来优化做准备。 (#7989, #7986, #7975)
  - 先验证再变更提示（实验性） — 环境门控的提示在多次盲目变更后鼓励验证，可供实验使用。 (#7952)
  - 验证债务遥测 — 影子遥测跟踪变更未验证的时长，为未来策略决策提供数据。 (#7947)
  - 研究委托的影子准入控制 — 研究委托调用的影子测量可识别不必要的子代理使用，而不会阻止。 (#7946)
  - 每轮认知遥测 — 轨迹摘要现在包括每轮令牌使用情况和慢轮统计，用于性能分析。 (#7943)
  - 影子结果评分器 — 影子评分器分解每轮结果（探索、验证、变动）以衡量进展质量。 (#7937)
  - 资格点反事实分叉框架 — 通过将相同状态分叉为对照组和处理组来进行因果实验的基础设施。 (#7958)
  - 验证压力基准测试套件 — 一个基准测试套件，用于测量 EBM 触发器在正面、中性和负面场景中的精度。 (#7953)
  - MemoryBench：配对记忆有效性套件 — 一个基准测试框架，通过反事实臂和使用点标记测量记忆效用增量。 (#8017)
  - CompactionBench：重复折叠的成本与保真度 — 一个基准测试，用于测量重复会话折叠的成本和信息丢失。 (#8024)
  - 实时飞行记录仪表板 — 一个本地仪表板，用于实时 e2ebench 运行，具有每轮跟踪和回放功能。 (#7979)
  - 检索 V2 影子 — 一个影子检索系统，具有 BM25F、代码符号和混合 CJK 分词，与生产 BM25 进行对比测量。 (#8025)
  - 会话召回索引与防崩溃写入器 — 记忆召回现在使用预构建索引，实现每轮零磁盘 IO，并通过原子文件写入确保持久性。 (#8028)
  - Goal 成为唯一长任务运行时 — Goal 现在是唯一的长任务状态机；AutoResearch 降级为只读兼容性读取器。 (#7959)
  - 推荐 DeepSeek Anthropic 接入 — 全新安装现在默认使用官方 DeepSeek Anthropic Messages 端点，并为现有配置提供旧版迁移。 (#7945)
  - 技能设置对齐 — 桌面技能设置现在与 MCP 模型匹配，隐式技能发现作为显式运行时策略。 (#7981)
  - 动画 Logo 变体 — 新的动画 SVG Logo 变体和更新的 README 横幅。 (#7954)
  - 网站 Hero 重设计 — 重新设计的首页 hero 安装部分，包含粒子效果、统一字体和更新的品牌资源。 (#7984)
  改进
  - 桌面会话切换性能 — 大型历史和快速主题切换不再阻塞渲染器，采用虚拟列表和基于 Worker 的 Markdown 解析。 (#7999)
  - 本地文件链接处理 — 智能体输出中的本地文件路径现在可点击以默认应用打开，并提供右键上下文菜单选项。 (#7985)
  - 增量折叠摘要携带 — 增量折叠现在逐字携带之前的摘要，恢复了大部分丢失的探针，并保持 O(1) 折叠成本。 (#8031)
  - 压缩输入边界 — 摘要器输入现在有边界，通过分区超大折叠防止会话卡死。 (#8021)
  - 记忆索引作用域限定 — 提供者可见的记忆索引现在使用作用域限定的引用并注释覆盖，与召回优先级保持一致。 (#8027)
  - 取消回合的桌面编辑操作 — 取消的回合现在通过重新加载权威历史来保留编辑、回退、分叉和摘要操作。 (#8001)
  - Goal 上下文工具加固 — 上下文相关工具现在在执行前进行门控，并修复了子代理隔离和迁移边界问题。 (#8007)
  - 崩溃恢复 WAL 感知 — 会话持久化现在受 CAS/WAL 保护，防止过时覆盖并确保状态单调。 (#7982)
  - 压缩折叠区域分区修复 — 折叠区域现在正确分区，防止用户声明的约束被丢弃。 (#8019)
  - MemoryBench 管道可观测性 — 修复了种子和审计转发错误，实现了第一个真实的内存效用基线。 (#8022)
  - 依赖升级 — 批量 Dependabot 升级桌面前端、网站和 Go 依赖。 (#8003)
  - CI 检查器和 Windows 超时修复 — 本地检查现在与 CI 匹配，Windows 冒烟测试超时增加以应对运行器差异。 (#8033)
  - 横向标识尺寸修复 — 通过声明 SVG 固有尺寸，修复了首页头部 Logo 渲染为大正方形的问题。 (#7997)
  修复
  - 输入法感知的 ESC 行为 — 在输入法候选窗口打开时按 ESC 不再取消正在运行的智能体回合。 (#7919)
  - 聊天记录选区释放 — 过时的聊天记录选区现在会在新点击时释放，添加到聊天操作在激活期间保留选区范围。 (#7988)
  - Windows 测试不稳定 — 加固了两个因 CI 运行器负载导致时序竞争而在 Windows 上失败的测试。 (#8015)
  - CI 红色测试确定性 — 通过门控 Unix 特定断言并在 Windows 上跳过，使三个 CI 红色测试跨平台具有确定性。 (#8048)
  升级提醒
  本版本无需手动迁移。
  风险提示
  当前没有需要额外操作的已知风险。
