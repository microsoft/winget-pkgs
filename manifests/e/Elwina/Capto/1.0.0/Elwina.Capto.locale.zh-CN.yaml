ShortDescription: 超轻量 Windows 屏幕录制工具
Description: Capto 是一款纯本地的 Windows 屏幕录制工具，Captura 的精神续作。支持显示器、窗口与区域采集，面向 Windows 优化的音视频采集路径。录制 MP4 时自动选用 NVENC / QSV / AMF，必要时回落到 libx264，也可以导出 GIF。内置点击高亮、按键显示、摄像头画中画、光标开关与实时预览。应用自带固定版本、可验证的 FFmpeg（capto-ffmpeg），并提供 JSON CLI（capto）让 agent 可以脚本化录制。MIT 开源，录制文件始终留在本机，绝不上传。
