ShortDescription: Ultra-light local Windows screen recorder
Description: Capto is a purely local screen recorder for Windows - the spiritual successor to Captura. Capture your display, a window, or a region with a Windows-first audio/video path. Records MP4 using NVENC/QSV/AMF automatically (libx264 fallback) and can export GIF. Includes click highlights, keystroke overlays, webcam picture-in-picture, cursor control, and live preview. A fixed, verifiable FFmpeg build (capto-ffmpeg) ships with the app, plus a JSON CLI (capto) so agents can drive recordings. MIT licensed. Your recordings never leave your machine.
