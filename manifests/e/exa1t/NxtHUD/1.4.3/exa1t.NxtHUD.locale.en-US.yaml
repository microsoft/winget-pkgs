ShortDescription: Fluent-style media, volume and lock-key flyouts for Windows 11, plus a taskbar now-playing widget, audio visualizer and system stats.
Description: |-
  NxtHUD is a lightweight tray app that replaces the Windows media and volume pop-ups with Fluent-style flyouts.
  It shows the current track with album art and playback controls when you press a media key, a volume flyout for the volume keys, and the new state when you toggle Caps Lock, Num Lock or Scroll Lock.
  On the taskbar it can show a now-playing widget with an audio visualizer, and CPU, memory, GPU, network and disk stats next to the clock.
  No administrator rights needed.
