ShortDescription: Offline-first open-source bookkeeping software — data never leaves your machine
Description: |-
  BOKI is an offline-first, open-source double-entry bookkeeping application.
  All data lives in a single local SQLite file: no cloud, no telemetry, and full
  functionality (posting, ledgers, financial reports) works without an internet
  connection.

  Core features:
  - Strict double-entry core: unbalanced vouchers cannot be saved (frontend and
    backend validation); approved vouchers are read-only
  - Financial statements: balance sheet, income statement, trial balance
  - Local-first intelligence: invoice OCR (PP-OCRv4) and voice bookkeeping
    (sherpa-onnx) run entirely on-device; optional local LLM via Ollama
  - Plugin architecture: 14 official plugins (invoice capture, payroll, treasury,
    receivables/payables, AI assistant and more), install and uninstall freely
  - Multi-company data isolation with role-based access control
  - Tech stack: Vue 3 + NestJS + SQLite + Electron
