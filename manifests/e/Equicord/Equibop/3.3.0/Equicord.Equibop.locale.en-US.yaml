ReleaseNotes: |-
  What's Changed
  Synced with upstream Vesktop (1.6.5 → 1.6.7).
  - Discord Titlebar is now Native Titlebar. Same option inverted, your setting carries over, but Windows now defaults to Discord's titlebar
  - Window shadow and rounded corners are now toggleable
  - Zoom with the numpad
  - Windows: screenshare no longer captures other participants' voices
  - Fixed the updater and the audio source picker
  - Updated venmic to 7.2.1
  - Linux: --enable-speech-dispatcher was removed upstream, re-add it under Launch Arguments if you use TTS
  Full Changelog: v3.2.2...v3.3.0
