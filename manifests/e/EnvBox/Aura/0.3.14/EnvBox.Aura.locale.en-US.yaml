ReleaseNotes: |-
  Aura v0.3.14
  本版本补齐本机 WMI/CIM 网卡 MAC 读取的 Profile 覆盖，新增 PowerShell 7 终端选项，并改善 MAC 审计和辅助进程启动失败反馈。同时包含 v0.3.13 开发版本的浏览器语言、时区缓存与子进程启动修复。
  Changes
  - 本机 Get-NetAdapter 和 Get-CimInstance 网卡查询现在返回 Profile 配置的 MAC。覆盖 Win32_NetworkAdapter.MACAddress、Win32_NetworkAdapterConfiguration.MACAddress，以及 MSFT_NetAdapter.NetworkAddresses 和 PermanentAddress。各接口保留原有地址格式；MAC 留空时仍返回宿主值。同步、异步查询以及对象克隆、序列化后的读取均纳入处理。
  - 终端宿主明确区分 Windows PowerShell 与 PowerShell 7。PowerShell 7 使用 pwsh.exe，支持从 PATH 和常规安装目录查找，并保存所选终端；未找到时明确报错，不会静默改用 Windows PowerShell。
  - MAC 审计区分 MAC 覆盖与 DNS 跟随宿主的情况，缓冲区大小查询不再被记录为成功覆盖。
  - Session 辅助进程启动失败时提供失败阶段、文件路径、系统错误码、进程 PID 和退出状态。系统返回安全软件阻止的错误码时，提示查看 Windows 安全中心保护历史。这项改动改善诊断信息，不代表已消除 Defender 检出。
  - Chrome/Edge 在 Compatibility 模式下启动的沙箱渲染进程收到父进程的固定 Profile 环境与语言参数，同时保留浏览器的受限令牌、沙箱启动属性和挂起状态。
  - 时区缓存访问同步；临时 Windows 枚举错误会在后续查询中重试。标准时间与夏令时间状态按当前真实 UTC 时间计算，不再固定为进程启动时的状态。
  - CreateProcessA 转换为 Unicode 时保留扩展启动属性及其他启动信息；无效结构或字符串转换失败明确返回错误。子进程审计补充成功创建的 PID 和失败时的 Windows 错误码。
  Validation
  - 在版本升级前的开发构建中，PowerShell 7、64 位与 32 位 Windows PowerShell 5.1 分别使用两套 MAC Profile，六次真实运行均成功；Get-NetAdapter 与 Get-CimInstance 返回配置值。
  - x64/x86 原生 Probe 各观察到 96 个非空 MAC 值，均与 Profile 匹配。WQL 查询、Session 复用、显式本机 DCOM Session、-InputObject 刷新、Clone 和原生 CIM 序列化验证通过。
  - 连续 1,100 次查询和 300 次 Session 创建、关闭正常完成；跨位数子进程继承正确。旧 Runtime 及混入旧 x86 DLL 的组合被拒绝，没有静默返回宿主 MAC。MAC 留空时返回宿主值，宿主查询结果在运行前后保持一致。
  - 版本化的 cargo check --workspace、工作区构建和正式 NSIS 安装包构建通过，程序文件版本为 0.3.14；9 个安装包输入的哈希与本次 Release 构建一致。独立 CPU 渲染器的已有检查通过。没有新增或修改测试用例。
  - 本地完整工作区检查在 Supervisor 通道项中断：正在运行的安装版 Supervisor 占用同一用户的唯一端点，测试拒绝了与预期不符的程序文件。未关闭该用户服务；发布流程要求同一提交通过干净 Windows CI 的完整工作区检查。
  - v0.3.13 的既有验证中，独立数据目录下的 Chrome 页面报告 Profile 的语言和时区，加载的 Runtime 哈希与开发构建匹配，宿主配置保持原值；相关构建和已有检查通过。
  Limitations
  本次 MAC 覆盖针对注入进程的本机 CIM 查询。真实远端机器查询的保留行为尚未实测；安装升级、GUI 保存后重开及从下拉框启动 PowerShell 7 的完整操作流程、长时间运行尚未验证。
  Defender 曾检出并隔离 Session Broker。现有事件无法确定具体触发行为，本版本不认定该检测为误报，也不宣称已解决检出问题。
  浏览器修复关闭了已验证的环境传播缺口，但原始的另一台机器重启 Chrome 后保留宿主语言、时区的问题尚未在本机复现。Compatibility 模式的沙箱渲染进程仍仅有部分原生环境覆盖，不通过该路径注入 Runtime DLL。既有 Chrome 验证中出现过 ERROR_ACCESS_DENIED（5）的独立注入失败，其具体目标尚未确定；注入完全失败仍拒绝启动。
