PackageIdentifier: EllmTree.Sval
PackageVersion: 153.7.0
PackageLocale: zh-CN
ShortDescription: 一款免费的 Firefox ESR 浏览器，提供工作区、Peek 快速预览和 Arc 导入。
Description: |-
  Sval 是免费的。你无需创建账户、交出电子邮箱，也无需填写“介绍一下自己”之类的调查问卷。
  Sval 基于 Firefox ESR 构建，这是 Firefox 的长期支持版本，稳定、维护完善，并定期获得安全更新。Ellm Tree 重做了 Firefox 的许多工作方式，以更好地满足用户：工作区、隐私控制、标签页整理、Peek 和 Quick Peek 快速预览、启动器、分屏、本地与自有云端同步、智能体工作区，还移除了你从未要求的内容，例如主页上的头条新闻、天气和付费合作伙伴链接。
  把 Sval 指向任意文件夹，例如 iCloud Drive、Dropbox、OneDrive、网络驱动器或 U 盘，再让你的其他设备指向同一个文件夹。标签页、工作区、标签组、收藏夹、历史记录和设置都会通过该文件夹同步，并以只有你的设备才持有的密钥进行端到端加密。Sval 不运行同步服务器。
  Sval 从 addons.mozilla.org 安装扩展程序。如果一个扩展程序能在 Firefox 中使用，它大概率也能在 Sval 中使用，包括 uBlock Origin 等 Manifest V2 广告拦截器。
  Sval 内置一个默认关闭的 MCP 服务器。开启智能体访问后，你已在使用的智能体便能操控 Sval。
