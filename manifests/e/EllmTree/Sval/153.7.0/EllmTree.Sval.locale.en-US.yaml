ReleaseNotes: |-
  New
  - Sval is now built with profile-guided optimization, and includes Mozilla's latest graphics and video fixes, so it runs faster.
  - Give a Workspace any color from the new color wheel, or make it see-through. Choose Edit Workspace to set its color and Transparency.
  - Drop a pin on another pin to make a pin folder. Pins and Favorites are now kept apart.
  - Favorites now sit in the Workspace panel's footer, and the Workspace strip can show each Workspace's name. The strip's settings are in Settings › Appearance.
  - HTTPS-Only Mode is now on. Sval opens the secure version of every site and warns you before a site that has none.
  - Pin Colorshift to the address bar with the pin on its row in the site settings menu.
  - A Peek now shows its downloads inside the Peek.
  - Agent Workspaces now show their apps' icons.
  - Your Sval Card now shows in About Sval.

  Fixed
  - Closing the selected tab now takes you back to the tab you saw last.
  - A page now keeps your reading position when the window gets narrower.
  - Sval no longer saves a crash dump while a private window is open.
