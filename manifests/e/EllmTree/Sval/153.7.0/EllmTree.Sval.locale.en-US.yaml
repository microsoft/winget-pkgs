ShortDescription: A free Firefox ESR-based browser with Workspaces, Peeks and Arc import.
Description: |-
  Sval is free. You don't create an account, hand over an email, or fill out a "tell us about yourself" survey.
  Sval is built on Firefox ESR, the long-term-support version of Firefox. It's stable, well-supported, and receives security updates regularly. Ellm Tree re-did much of how Firefox worked to better suit its users: Workspaces, privacy controls, tab organization, Peeks, Quick Peek, Launcher, Splits, local and your-cloud sync, Agent Workspaces, and removing the stuff you never asked for, such as top stories, weather, and paid partner links on the home page.
  Point Sval at any folder, like iCloud Drive, Dropbox, OneDrive, a network drive, or a USB stick, and point your other devices at the same folder. Tabs, Workspaces, groups, Favorites, history, and settings sync through that folder, end-to-end encrypted with a key only your devices have. Sval doesn't run a sync server.
  Sval installs extensions from addons.mozilla.org. If an extension works in Firefox, it likely works in Sval, including Manifest V2 ad blockers like uBlock Origin.
  Sval has a built-in MCP server that's off by default. Turn on agent access and the agent you already use can drive Sval.
