PackageIdentifier: egoist.Waku
PackageVersion: 0.1.20
PackageLocale: zh-CN
ShortDescription: 管理你所有编码智能体的原生应用。
Description: |-
  Waku 是一个快速的原生桌面应用，用于管理本地编码智能体。它使用 Rust 和 GPUI 构建，项目、会话和对话记录都保存在你自己的机器上。

  支持的智能体：Amp、Claude Code、Codex CLI、Cursor CLI、Fx、Grok Build、Kimi Code、OpenCode 和 Pi。Waku 会自动检测可用的 CLI，并使用各提供商的原生结构化协议和会话延续能力。

  亮点：
  - 在一个原生应用中管理项目和相互独立的智能体会话。
  - 从统一界面切换模型、推理投入和访问模式。
  - 在智能体工作时排队或引导后续消息。
  - 通过感知对话的检查点回退基于 Git 的任务。
  - 应用状态存储在本地，无需 Waku 账号或远程服务。
