ShortDescription: A native app for all your coding agents.
Description: |-
  Waku is a fast, native desktop app for working with local coding agents. It is built in Rust with GPUI and keeps projects, sessions, and transcripts on your machine.

  Supported agents: Amp, Claude Code, Codex CLI, Cursor CLI, Fx, Grok Build, Kimi Code, OpenCode, and Pi. Waku detects available CLIs automatically and uses each provider's native structured protocol and session continuity.

  Highlights:
  - Keep projects and independent agent sessions in one native app.
  - Switch models, reasoning effort, and access modes from a shared interface.
  - Queue or steer follow-up messages while an agent is working.
  - Rewind Git-backed tasks with conversation-aware checkpoints.
  - Store app state locally, with no Waku account or remote service required.
