ShortDescription: A big, bright, customizable mouse cursor for games with a hard-to-see cursor.
Description: |-
  EzCursor draws a large, high-visibility cursor over the games and apps you choose (for example Last Epoch, Path of Exile, Diablo, Grim Dawn) and hides the original cursor while the game is focused.
  Pick a color, shape and size, use ombre gradients and effects, make your own cursor with the built-in cursor maker, download new designs from the online library, and give each game its own profile.
  It is an external overlay: it does not modify game files or memory. Run games in Borderless or Windowed mode.
