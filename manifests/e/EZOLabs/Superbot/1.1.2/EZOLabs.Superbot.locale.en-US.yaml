ShortDescription: "superbot is your own AI agent. Anything you can do on your computer, it can do, fast: errands, business and personal admin, recurring tasks on a schedule. One agent across all your devices."
Description: |-
  superbot is your own AI agent: anything you can do on your computer, it can do, fast, and it runs your recurring tasks on a schedule across all your devices. Try it free in your browser, no account: https://superbot.gg/chat

  Ask it to turn your receipts into an expense sheet, sort your downloads folder every Friday, or watch a page and tell you what changes. Ask once and it sets the job up as an automation that runs on a schedule without you. Use it for business admin, personal admin and the busywork of your job. It works across all your devices: run your computer from your phone and pick up the same chats on desktop, phone and the web. It asks before it uses your computer.

  It also makes pictures, video, songs, 3D and apps, browses the web, and gives other agents one MCP tool for errands. For your other tools it gives one API key for the models on your account.
