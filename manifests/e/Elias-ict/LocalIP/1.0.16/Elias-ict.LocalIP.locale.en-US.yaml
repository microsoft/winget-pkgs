ShortDescription: Show computer name and local IP address on Windows
Description: LocalIP is a Windows support utility for network administrators.
  It shows the computer identity and local IPv4 address in a small floating
  window, clears a problematic LAN proxy, refreshes DNS and DHCP state, and
  deploys through a central share with Group Policy or a single installer.
