ReleaseNotes: |-
  # FlexDesigner 2.2.5

  This Windows 64-bit, Apple Silicon macOS and Linux 64-bit pre-release adds a new USB connection option and improves touch controls and firmware updates. It also includes the project editing, saving, and everyday-use improvements from 2.2.4, together with Flexbar 2.2.5 firmware.

  ## New in 2.2.5

  • Added a new USB connection option in Device Settings. Update your Flexbar firmware to use it.
  • Improved USB reconnection when a connection resumes or is reopened.
  • Fixed the right touch button triggering repeatedly while held.
  • Improved reliability when updating device firmware.

  ## Project Editing and Saving

  • Fixed images being lost after a failed crop, and improved image rotation and transparency handling.
  • Fixed layout refresh issues when moving keys into the drawer, cutting drawer items, or resizing spacers.
  • Fixed deleting one link to a shared page affecting other links, along with several undo and redo issues.
  • Fixed Cycle key title position and font size changes not appearing in the preview, and some cases where the displayed state did not match its action.
  • Improved project saving, page export, and compatibility with older projects. Edits made during a save now remain marked as unsaved, and opening an invalid project preserves your current work.
  • Improved autosave and project recovery after an unexpected exit to help preserve recent changes.

  ## Devices and Everyday Use

  • Improved device reconnection and project uploads, including fixes for operations getting stuck and duplicate device entries.
  • Improved device stability during extended use and repeated page switching.
  • Fixed some cases where touch controls or keys stopped responding after a page change.
  • Fixed fixed-bar controls stopping their updates after a page change, and dynamic controls not updating correctly inside drawers.
  • Fixed some 12-hour clock display issues and clock display problems in older projects.
  • Fixed red and blue being swapped in saved device screenshots.
  • Fixed the setup tour appearing again after it had been completed or skipped.
  • Improved app, website, and script actions with non-English text, spaces, and special characters. Script Test Run now shows whether execution succeeded or failed and prevents repeated clicks while running.
  • Fixed automatic page switching for the active application when multiple devices or matching rules were configured.
  • Fixed quitting the app changing the launch-at-login preference. App updates are now installed only after you explicitly confirm installation.
  • Fixed diagnostic upload consent not being remembered correctly. Withdrawing consent now stops uploads.
  • Fixed recognition of the numeric keypad's plus key.
  • Fixed some OBS screenshot and scene transition controls failing.

  ## Platform-Specific Improvements

  • **macOS:** Fixed some Touch Bar taps and touch releases being missed.
  • **macOS 27:** Fixed the Touch Bar emulator failing to resume after unlocking the Mac.
  • **macOS:** Fixed Paste actions in Clipboard and Sticker keys, and improved menu bar icon visibility.
  • **Windows:** Restored audio spectrum source selection and fixed saved selections switching to another device after a restart or disconnection.
  • **Windows:** Improved performance chart values and units, including fixes for zero values, large values, and unavailable readings.
  • **Windows:** Fixed some volume sliders not updating, along with incorrect initial media icons and playback progress displays.
  • **Linux:** Fixed the audio spectrum picking up microphone input instead of system playback, including when using Bluetooth audio devices.

  ## macOS Downloads

  Apple Silicon：use the `arm64.dmg` installer or `arm64.zip` archive. Intel Mac downloads are available in the [dedicated Intel repository](https://github.com/ENIAC-Tech/FlexDesignerIntelMac/releases/tag/2.2.5).

  The macOS application is Developer ID signed and Apple notarized. Installers require macOS 12 or later. This is a pre-release.

  ## Linux Downloads

  Linux 64-bit downloads are available as an AppImage and an Ubuntu/Debian package.
