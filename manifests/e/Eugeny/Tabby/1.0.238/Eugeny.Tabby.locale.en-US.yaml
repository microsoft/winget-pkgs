  - fix(terminal): unbounded O(n²) output buffer for tabs that were never focused by @meanaverage in #11722
  - fix(terminal): every closed tab leaks its terminal (WebGL cursor blink timer never disposed) by @meanaverage in #11720
  - fix(terminal): closed sessions leak via PTY IPC listeners (destroy() re-entrancy) by @meanaverage in #11719
  - fix(terminal): send current terminal size in the deferred initial resize by @anseltaft in #11760
  - fix(terminal): don't steal focus from modal dialog inputs by @siparker in #11745
  - fix(core): don't fire a hotkey twice for one keystroke by @bptrsn in #11769
