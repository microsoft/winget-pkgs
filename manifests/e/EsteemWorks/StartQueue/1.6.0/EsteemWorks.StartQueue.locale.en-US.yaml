ShortDescription: 'One startup order for every app that starts with Windows, with profiles and quiet starts.'
Description: 'StartQueue takes every app that starts with Windows into one list and starts them in your order after sign-in. Profiles by weekday and hours decide which apps start when, apps can start normally, minimized or in the background, and new autostart entries are noticed and taken over. It also shows what happened at the last sign-in and manages services. Free; the full feature set needs an installation with admin rights.'
