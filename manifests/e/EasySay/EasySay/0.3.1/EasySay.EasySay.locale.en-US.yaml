ShortDescription: Offline voice typing and transcription. Dictate into any app; speech is recognized on your computer.
Description: |-
  EasySay turns speech into text in any app: press a shortcut, speak, and the text is pasted where your cursor is.
  Recognition runs locally (Whisper, GPU-accelerated), so your voice never leaves the computer.
  It also transcribes meetings, audio and video files into text and subtitles, translates selected text,
  and turns spoken tasks into prompts for AI chats and image/video generators.
