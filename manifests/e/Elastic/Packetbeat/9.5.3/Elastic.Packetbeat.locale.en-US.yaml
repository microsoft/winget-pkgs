ShortDescription: Monitors the network and applications by sniffing packets
Description: |-
  Packetbeat is an open source network packet analyzer that ships the data to Elasticsearch. Think of it like a distributed real-time Wireshark with a lot more analytics features.
  The Packetbeat shippers sniff the traffic between your application processes, parse on the fly protocols like HTTP, MySQL, PostgreSQL, Redis or Thrift and correlate the messages into transactions.
  For each transaction, the shipper inserts a JSON document into Elasticsearch, where it is stored and indexed. You can then use Kibana to view key metrics and do ad-hoc queries against the data.
ReleaseNotes: |-
  Features and enhancements
  All
  - Update Go to 1.26.7. #52750
  Filebeat
  - Reduce filestream memory usage with multiple Filebeat receivers. #52326
  Packetbeat
  - Log Npcap installer diagnostic files on installation failure. #52667
  Fixes
  Filebeat
  - Fix the auditd filestream parser to emit unset for unset auid and ses fields. #52614
  - Fix CEL input panic on nil rate-limit fields and 429 retry hot-loop. #52684
  - Scope the aws-s3 polling state registry to the input's bucket. #52728 #52721
  - Log entity analytics sync interruption by input shutdown or reconfiguration at info level instead of error, and no longer mark the input as degraded. #52950 #52945
  Osquerybeat
  - Emit pack_name and query_name in Osquerybeat scheduled query results. #51781
  - Rename log key component to log.logger to prevent mapping conflict on Elasticsearch. #52912 #52888
  - Stamp space_id on Osquerybeat live query result and profile documents so results are visible in non-default Kibana spaces. #52915
  Packetbeat
  - Censor HTTP parameters for mixed-case hide_keywords entries. #52650
  - Fix bounds-check panics in Packetbeat TLS and Cassandra protocol parsers. #52870
  - Fix network flow collection under the Elastic Agent OTel runtime. #52932 #52931
