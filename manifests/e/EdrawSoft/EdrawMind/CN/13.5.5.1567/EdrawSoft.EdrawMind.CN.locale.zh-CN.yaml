ReleaseNotes: |-
  AI 导出：信息图/知识卡片
  功能入口：打开一份思维导图，点击右上角的【导出】，选择【信息图/知识卡片】
  告别排版烦恼，一键将结构化的思维导图转化为精美、专业的信息图/知识卡片海报。
  预设多种风格样式，随心选择！一键产出设计师级别的高级质感图片。

  AI 图像创作全新升级
  图像模式全新升级：一句话即可生成兼具设计感与高级质感的创意图片。功能入口：首页 > 万兴脑图 AI > 选择图像模式
  多样参数，灵活适配：支持选择生图模型与画面比例，轻松创作插画、海报、摄影等多类视觉素材，生成后一键插入导图节点。
  参考生成，对话修图：支持上传参考图、套用风格案例快速出图；只需输入修改需求，即可对图片局部进行智能调整。
