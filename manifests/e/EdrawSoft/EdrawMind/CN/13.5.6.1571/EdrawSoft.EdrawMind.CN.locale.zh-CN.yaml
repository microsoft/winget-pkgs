ReleaseNotes: |-
  AI 导出：思维导图一键转解说视频！
  功能入口：打开一份思维导图，点击右上角的【导出】，选择【AI 解说视频】
  一键生成： 只需点击生成，选好风格，思维导图化身动态解说视频。
  音色选择：自动识别导图层级与文本，生成自然流畅的分镜和解说语音，多种音色可选。
  立即体验，体验前所未有的知识表达新方式！

  手绘思维导图模式：新增浮动主题
  挣脱线框束缚，灵感自由安放！
  功能入口：打开手绘思维导图模式，双击画布空白处，即可创建浮动主题
  随心排版： 摆脱中心主题的强制连线，支持在画布任意空白区域双击创建独立节点。
  样式设置：形状、颜色、线条宽度 自由定义，和关系线搭配效果更佳！
