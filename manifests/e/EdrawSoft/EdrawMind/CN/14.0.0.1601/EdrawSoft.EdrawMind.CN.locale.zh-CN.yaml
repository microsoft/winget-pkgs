ReleaseNotes: |-
  一、AI 导出：思维导图一键转解说视频！
  功能入口：打开一份思维导图，点击右上角的【导出】，选择【AI 解说视频】
  一键生成： 只需点击生成，选好风格，思维导图化身动态解说视频。
  音色选择：自动识别导图层级与文本，生成自然流畅的分镜和解说语音，多种音色可选。
  立即体验，体验前所未有的知识表达新方式！

  二、手绘导图新增「讲解」模式
  功能入口：进入手绘导图文件，右上角点击“讲解”按钮
  一键生成讲解视频，由 AI 自动生成解说文案、配音、字幕，结合节点遍历镜头动画，快速分享导图思路。
  支持按节点手动讲解遍历，自动聚焦展示导图内容。

  三、AI 导出：信息图/知识卡片
  功能入口：打开一份思维导图，点击右上角的【导出】，选择【信息图/知识卡片】
  告别排版烦恼，一键将结构化的思维导图转化为精美、专业的信息图/知识卡片海报。
  预设多种风格样式，随心选择！一键产出设计师级别的高级质感图片。

  四、AI 导出：导出手绘脑图
  对导出界面进行了升级，新增【AI 导出】，通过 AI 能力将您的思维导图一键变成手绘思维导图！
  功能入口：编辑完思维导图后，点击右上角的【导出 - AI 导出 - 手绘思维导图】；
  （1）方式 1：转为手绘格式，生成一个手绘思维导图文件，适合二次编辑；
  （2）方式 2：通过图像大模型能力，直接生成手绘脑图的图片，适合直接交付。

  五、AI 创作首页全新升级 - 脑图 Agent
  （1）首页 UI 与 AI 创作入口优化，思维导图、PPT、文件总结等能力更集中，打开首页即可快速开始创作。
  （2）新增扣点标准说明和附件上传引导，支持格式、文件大小、点数消耗等信息更透明，使用更放心。
  （3）AI 对话中的历史输入支持一键复制，也可带回输入框重新编辑，常用提示词复用更方便。

  六、全新手绘思维导图模式上线！
  告别千篇一律的冰冷框架，带你重温思维导图创始人东尼 · 博赞（Tony Buzan）笔下最自然、有机的思维绽放！
  我们为您带来了全新的【手绘模式】，让每一次灵感记录都成为兼具知识沉淀与高颜值的艺术创作。
  （1）功能入口：在产品首页左下角，点击【手绘模式】切换按钮，即可切换到手绘模式。
  （2）功能说明：您可以随时切换回【专业模式】，在手绘模式下产品界面会发生改变，创建的手绘思维导图文件是全新的文件格式。

  七、手绘思维导图的特性
  打破传统排版的束缚，还原最真实的纸笔触感！
  （1）灵动线条，自由生长：所有的线条位置支持自由调整，长按“+”按钮即可自由拖拽出分支线条，就像在纸上画手绘脑图一样。
  （2）字随线动，自然呼吸：认搭配专属手绘字体，文字会随着分支线条的弧度自然弯曲贴合，视觉体验更具呼吸感。
  （3）随心点缀，图文并茂：支持便捷插入本地图片和官方插画，让您的知识图谱更加生动。
