ReleaseNotes: |-
  AI 对话生成解说视频，附件上传一键成片
  在 AI 对话框中描述讲解需求，或直接上传资料，AI 自动提炼重点、编排画面并生成配音与字幕，让知识材料快速变成完整的解说视频。
  （1）附件上传：支持同时上传最多 5 个文件，将现有资料转化为视频内容，减少手动整理。
  （2）精选案例：覆盖科普、职场、生活等主题，直观预览不同内容与风格，快速找到创作灵感。
  （3）一键同款：点击“做同款”即可应用案例提示词，按需修改后生成自己的解说视频。
  （4）按需定制：手绘、商务、粘土等风格随心搭配，自由选择比例、时长和音色，结合背景音乐与动态画面，打造更贴合需求的视频。
