ReleaseNotes: |-
  AutoCAD/Civil3D .bak Backup Files Created Conflict Copies
  - Users saving AutoCAD or Civil3D drawings saw frequent conflict copies of the .bak backup files created in the same folder, even when they were the only person working on the file. The issue became more prevalent with the AutoCAD 2026 save sequence, which introduced new file-operation patterns that were not fully handled by earlier releases.

  Files Intermittently Failed to Upload Through the Desktop App 
  - Users occasionally reported that files updated locally failed to upload to the cloud, most commonly when third-party antivirus software was actively scanning the Desktop App's directory and briefly locking its temporary upload chunk files.

  Duplicate Egnyte Drive Entries Appeared in Windows File Explorer 
  - Duplicate Egnyte Drive entries appeared in the Windows File Explorer navigation pane alongside the working mapped drive letters. The duplicate entries were non-functional (clicking them did nothing) while the actual mapped drives under This PC remained fully accessible. The issue could appear after user re-authentication or after an unclean Desktop App shutdown.

  SAS Batch Program Run Failed with "You cannot move or rename a file which is being uploaded" 
  - Users running SAS batch programs that update many files at high frequency (in the reported case, over 800 files, some 100–600 MB in size) intermittently hit the error "You cannot move or rename a file which is being uploaded". The issue occurred when SAS attempted to rename files while the Desktop App still held them for an in-progress upload.
