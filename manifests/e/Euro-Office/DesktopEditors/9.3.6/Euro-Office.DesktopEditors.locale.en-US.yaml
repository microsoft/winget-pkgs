ShortDescription: Free office suite with document, spreadsheet, presentation and PDF editors that works offline with the Office Open XML formats. Unsigned community build.
Description: |-
  Euro-Office Desktop Editors is a free office suite that combines text, spreadsheet, presentation and PDF editors and a diagram viewer.
  It allows creating, viewing and editing documents stored on your computer without an Internet connection, and is compatible with the Office Open XML formats .docx, .xlsx and .pptx.
  Euro-Office is a fork of the ONLYOFFICE open source code base.
  This package installs the unsigned community build; the signed distribution of the same editors is Nextcloud Office.
