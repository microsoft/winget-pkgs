ShortDescription: A high-performance, cross-platform desktop application for calculating and verifying file checksums.
Description: |-
  Rust Hash Sum is a high-performance, cross-platform desktop application for calculating and verifying file checksums. It is built with a Rust backend for maximum speed and a React frontend, and packaged with Tauri for a small bundle size and native performance.

  High-Performance Hashing: The Rust backend is optimized for speed, using memory-mapped files and up to 8 concurrent worker threads for rapid processing of large files and directories.
  Multiple Algorithms: Supports a wide range of hashing algorithms: MD5, SHA-1, SHA-256, SHA-384, SHA-512, SHA3-256, SHA3-512, BLAKE2b, BLAKE2s, BLAKE3 (multi-threaded), CRC32, CRC64-ECMA, and xxHash3.
  Advanced Folder Scanning: Recursively scan entire folders with real-time progress tracking, file counters, and the ability to cancel ongoing operations.
  Result Visualization: Folder scan results are rendered as interactive cards with per-algorithm copy buttons for quick access.
  Drag and Drop: Drag and drop files into the application to start hashing immediately.
  Hash Verification: Verify a file's integrity with strict input validation and instant comparison against known hashes.
  GPG Authenticity Checks: Dedicated tab for verifying detached GPG signatures with fingerprint validation.
  Save Reports: Export results to JSON or customizable CSV files, with options to toggle headers and exclude empty fields.
  Persistent Window State: Automatically remembers your window size and position between sessions.
  Light and Dark Mode: Fully responsive theme support.
