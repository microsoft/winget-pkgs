PackageIdentifier: rhashsum.RustHashSum
PackageVersion: 4.7.0
PackageLocale: zh-CN
ShortDescription: 一款高性能的跨平台桌面应用，用于计算和校验文件哈希值。
Description: |-
  Rust Hash Sum 是一款高性能的跨平台桌面应用，用于计算和校验文件哈希值。后端使用 Rust 编写以获得最快速度，前端使用 React，并通过 Tauri 打包，兼顾小巧体积与原生性能。

  高性能哈希：Rust 后端经过性能优化，使用内存映射文件与最多 8 个并发工作线程，可快速处理大型文件与目录。
  多种算法：支持 MD5、SHA-1、SHA-256、SHA-384、SHA-512、SHA3-256、SHA3-512、BLAKE2b、BLAKE2s、BLAKE3（多线程）、CRC32、CRC64-ECMA 与 xxHash3 等多种哈希算法。
  高级目录扫描：递归扫描整个文件夹，提供实时进度与文件计数，并可在扫描过程中取消。
  结果展示：目录扫描结果以卡片形式呈现，每种算法都带有独立的复制按钮。
  拖放支持：将文件拖入窗口即可开始计算哈希。
  哈希校验：对输入进行严格校验，并与已知哈希值即时比对以验证文件完整性。
  GPG 真实性校验：提供专用页签，用于校验分离式 GPG 签名并验证指纹。
  导出报告：可将结果导出为 JSON 或可自定义的 CSV 文件，支持切换表头与排除空字段。
  窗口状态记忆：自动保存并在下次启动时恢复窗口大小与位置。
  浅色与深色主题：完整的响应式主题支持。
