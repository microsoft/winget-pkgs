ShortDescription: Portable game launcher that finds Steam and non-Steam games and picks one at random.
Description: Shufflebox collects your Steam (all libraries) and non-Steam games from every drive into one searchable grid with real icons. A RANDOM button picks a game with a 5-second countdown to re-roll or launch. It includes favorites, hidden games, a desktop panel mode, 7 themes plus a color editor, and a tray icon.
