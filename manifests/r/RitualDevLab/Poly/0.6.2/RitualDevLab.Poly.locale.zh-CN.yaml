PackageIdentifier: RitualDevLab.Poly
PackageVersion: 0.6.2
PackageLocale: zh-CN
ShortDescription: 使用统一的命令行，在 Node.js、Python、Rust 与 Go 之间协调多语言依赖。
Description: |-
  Poly 是一款多语言软件包与依赖编排工具，使用统一的语法在 Node.js、Python、Rust 和 Go 之间添加、移除和同步依赖。它将通用的软件包请求转发到系统中响应最快的原生包管理器，并把依赖解析完全交给这些原生工具。

  主要特性：
  - 支持生态前缀简写与 PURL 规范，例如 npm:zod、pypi:fastapi、cargo:tokio 和 pkg:npm/...
  - 通过 poly.toml 定义多语言工作区，并行同步各成员的依赖
  - 生成复合锁文件 poly.lock，以 SHA-256 校验跟踪各原生锁文件的完整性
  - 通过 --frozen 开关实现零漂移持续集成，并通过 poly run 跨技术栈运行任务
  - 并行扫描过期依赖、引导式批量升级、OSV 漏洞审计与 SARIF 导出，并可用 poly fix 自动修复
  - 生成软件物料清单、检查许可证合规、导出 CycloneDX 与 SPDX，并使用 Ed25519 签名进行来源证明
  - 原生 Shell 自动补全、Docker 与 DevContainer 生成，以及 poly doctor 诊断套件
  - 通过 --agent 输出结构化 JSON，便于自动化与 AI 智能体使用
  - 默认使用本地缓存，并支持可选的远程缓存
