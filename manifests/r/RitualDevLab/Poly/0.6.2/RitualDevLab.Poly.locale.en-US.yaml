ShortDescription: Orchestrate polyglot dependencies across Node.js, Python, Rust, and Go with one command-line interface.
Description: |-
  Poly is a polyglot package and dependency orchestrator that uses one consistent syntax to add, remove, and synchronize dependencies across Node.js, Python, Rust, and Go. It routes universal package requests to the fastest native package manager available on the system and delegates dependency resolution to those native tools.

  Key features:
  - Ecosystem shorthand and PURL specifications such as npm:zod, pypi:fastapi, cargo:tokio, and pkg:npm/...
  - Polyglot workspaces defined by poly.toml, with parallel dependency synchronization across workspace members
  - Composite lockfile poly.lock that tracks the underlying native lockfiles with SHA-256 integrity verification
  - Zero-drift CI mode through the --frozen flag and cross-stack task running through poly run
  - Concurrent outdated scans, guided batch upgrades, and OSV vulnerability auditing with SARIF export and automatic remediation through poly fix
  - Software bill of materials generation, license compliance checks, CycloneDX and SPDX exports, and Ed25519 provenance attestation
  - Native shell auto-completions, Docker and DevContainer generation, and a poly doctor diagnostic suite
  - Structured JSON output for automation and AI agents through --agent
  - Local caching by default, with optional remote cache support
