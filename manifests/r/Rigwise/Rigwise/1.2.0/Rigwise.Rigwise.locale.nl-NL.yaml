ShortDescription: Laat zien wat je gaming-pc afremt, wat er gratis sneller kan en welke upgrade het meeste fps oplevert.
Description: |-
  Rigwise leest de hardware van je pc uit en laat zien welk onderdeel je games afremt.
  Eerst zoekt het naar gratis winst, zoals XMP of EXPO dat uit staat, geheugen in single channel of een oude BIOS.
  Daarna zie je welke upgrades op je moederbord en voeding passen, en wat ze opleveren.
  Rigwise leest alleen uit en verandert niets aan je pc.
