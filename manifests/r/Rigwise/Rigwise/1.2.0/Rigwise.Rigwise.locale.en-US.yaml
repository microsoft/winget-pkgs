ShortDescription: Shows what slows down your gaming PC, what you can speed up for free and which upgrade gives the most fps.
Description: |-
  Rigwise reads your PC's hardware and shows which part holds back your games.
  It first looks for free gains, such as XMP or EXPO being off, memory running in single channel or an old BIOS.
  It then lists the upgrades that fit your motherboard and power supply, with the expected gain.
  The app is in Dutch and reads hardware only; it changes nothing on your PC.
