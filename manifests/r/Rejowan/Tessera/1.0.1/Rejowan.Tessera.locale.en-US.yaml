ReleaseNotes: |-
  A fix release, written while moving a library of 564 packs and 141,609 files into 1.0.0.

  - Browsing no longer freezes: filtering packs by license or kind read every asset in the library
    to answer a question already written on the pack. It reads the pack now.
  - Scrolling is smooth: a large grid redrew every tile on every row the scroll crossed. It notices
    a new page rather than a new row.
  - Reading what your files contain is visible work, with a count and progress, and it takes the
    checksum a zip already records rather than working it out again.
  - Opening a 1.0.0 library in a newer version no longer throws away every checksum it had and
    spends the hour again.
ReleaseNotesUrl: https://github.com/ahmmedrejowan/tessera/releases/tag/v1.0.1
