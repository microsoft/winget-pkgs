ReleaseNotes: "Stable release v1.17.0.\nThe latest commit is 8ba380d83301e0a6dd26773089956ac8575cf493.\n\nRefer to the [action run](https://github.com/RimSort/RimSort/actions/runs/39174532233) that created this release.\n<!-- Release notes generated using configuration in .github/release.yml at 8ba380d83301e0a6dd26773089956ac8575cf493 -->\n\n## What's Changed\n### 🚀 Features and Improvements\n• feat：hide satisfied dependencies in Dependency Manager by default by @twstagg in https://github.com/RimSort/RimSort/pull/2536\n### 🐛 Bug Fixes\n• i18n：complete Brazilian Portuguese interface translations by @Kyo-70 in https://github.com/RimSort/RimSort/pull/2537\n### Miscellaneous Changes\n• fix：retain InstanceService reference so instance actions stay wired by @twstagg in https://github.com/RimSort/RimSort/pull/2540\n• fix：name the missing library when SteamCMD cannot execute on Linux by @twstagg in https://github.com/RimSort/RimSort/pull/2541\n• fix：distinguish GitHub rate limits and reuse the user's token in the update check by @twstagg in https://github.com/RimSort/RimSort/pull/2542\n• ci：make nix flake check the quality gate and publish a public cachix cache by @twstagg and @Adda0 in https://github.com/RimSort/RimSort/pull/2543\n• chore：adapt Qt object lifetimes to PySide6 6.12 and bump the dependency by @twstagg and @Adda0 in https://github.com/RimSort/RimSort/pull/2544\n\n• Special thanks to @Adda0 for the assistance given on all of the CI + Nix-related feedback & testing given. Additional thanks for maintaining the downstream nixpkgs package :rocket: \n\n**Full Changelog**：https://github.com/RimSort/RimSort/compare/v1.16.0...v1.17.0"
