ReleaseNotes: |-
  - Presets for every Sonar channel: Game, Chat, Media, Aux and Mic, each optionally with a device.
  - Favorite presets from GG appear automatically.
  - Cycling shortcuts Ctrl+Alt+F11 and Ctrl+Alt+F12, and Ctrl+Alt+1-9 to pick a preset by number.
  - New window with Settings and Help pages; instant notifications.
