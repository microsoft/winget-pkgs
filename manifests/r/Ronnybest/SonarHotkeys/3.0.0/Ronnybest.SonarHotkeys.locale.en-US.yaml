ShortDescription: Switch SteelSeries Sonar presets and devices for every channel with global hotkeys.
Description: |-
  SonarHotkeys is a tray app for SteelSeries Sonar. Every Sonar channel (Game, Chat, Media, Aux and Mic) gets its own presets, and each preset can switch a device too: speakers or headphones for the output channels, a microphone for Mic.
  Presets marked as favorites in SteelSeries GG appear by themselves. Ctrl+Alt+F11 changes the channel to cycle, Ctrl+Alt+F12 steps through its presets, Ctrl+Alt+1-9 pick a preset by number, and any preset can have its own shortcut.
  Requires SteelSeries GG with Sonar enabled. Not affiliated with SteelSeries.
