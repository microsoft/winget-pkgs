Publisher: Danil
PackageName: SonarHotkeys
License: MIT
ShortDescription: Переключение пресетов и устройств SteelSeries Sonar для любого канала глобальными горячими клавишами.
Description: |-
  SonarHotkeys — программа в трее для SteelSeries Sonar. У каждого канала Sonar (Game, Chat, Media, Aux и Mic) свои пресеты, и пресет может переключать устройство: колонки или наушники у каналов вывода, микрофон у Mic.
  Пресеты, отмеченные избранными в SteelSeries GG, появляются сами. Ctrl+Alt+F11 меняет канал перебора, Ctrl+Alt+F12 листает его пресеты, Ctrl+Alt+1-9 выбирают пресет по номеру, а у любого пресета может быть своё сочетание.
  Нужен SteelSeries GG с включённым Sonar. Проект не связан со SteelSeries.
