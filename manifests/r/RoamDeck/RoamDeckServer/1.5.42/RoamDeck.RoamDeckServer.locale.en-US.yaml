ShortDescription: The PC side of RoamDeck. Use your PC from your Android phone with real terminals, the live screen, voice typing and file transfer.
Description: |-
  RoamDeck Server runs on your PC and pairs once with the RoamDeck Android app through a QR code.
  From the phone you open real terminal windows on the PC, follow and answer coding agents, see every monitor live with mouse, keyboard and a one-hand touchpad, type by voice into any app, move files both ways and listen to the PC audio.
  The connection is direct and encrypted end to end, at home on Wi-Fi or on the go over 4G and 5G.
