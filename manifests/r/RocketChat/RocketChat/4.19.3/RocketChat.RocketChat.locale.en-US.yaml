ReleaseNotes: |-
  🐛 Fixes
  - German translation: with German as the system language, parts of the Settings window, the server information dialog and some window titles showed English text. The German file now has every string of the app. The server information dialog now uses the app language for its labels, expiration message and dates. The Settings, Downloads, Log Viewer and Document Viewer window titles are translated too. In English, the Settings window title is now "App settings - Rocket.Chat". (#3663, DMV2-48)
  - Click-to-call with copied phone numbers: the global call shortcut and tel:/callto: links now clean a phone number with the same rules. A (0) after a country code is removed (+49 (0)40 123456 dials +4940123456). An extension (ext. 23, x23, ;ext=) is no longer added to the number. Invisible formatting marks are removed, and full-width digits are converted. (#3662, DMV2-47)
