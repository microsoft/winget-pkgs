ReleaseNotes: |-
  Patch release on the 4.17.x line.
  🐛 Fixes
  - Video calls: SSO login popups complete the redirect again. Identity-provider login popups opened from the conference window (for example Pexip SSO) now open as sandboxed Electron child windows instead of the system browser, which restores the link back to the call so the login result reaches the conference. This hardens the popup handling introduced in 4.16.0, which did not cover IdP flows that depend on window.opener. (#3485)
  - Presence: users who are away stay away after a reconnection. On servers 7.10 and newer the desktop app no longer replaces the web client's own idle detection, and on every server version it re-asserts the current idle state once the websocket reconnects and login settles. Previously a scheduled websocket recycle could flip idle users back to online until the next OS idle transition. (#3490)

  ✨ Improvements
  - Reset window sizes and positions. A new action in Settings → Advanced and in the View menu clears the remembered bounds of the main, settings, downloads, log viewer and document viewer windows and recenters them at their default size. Also fixes main-window centering on displays where the work area is not an integer. (#3488)
