ReleaseNotes: |-
  🐛 Fixes
  - Desktop notifications on workspaces that load their scripts late: on some workspaces, the app's page script ran before the web client and stopped with process is not defined. Notifications then had no reply, no action buttons and no click routing to the workspace, and the integrations that read the web client's modules stayed off. The script now runs in that case. (#3650, DSK-242)
  - Logging in again after a logout: when you log out, the app clears the workspace data and reloads the page. On workspaces whose custom script blocks the page unload, that reload did not happen, and the next login could show "The application GUI just crashed" at the two-factor prompt or when the rooms loaded. The reload after a data clear now always happens. This also applies to "Clear cache", "Force reload with cache clear" and the reload after a server version change. (#3651, DSK-244)
