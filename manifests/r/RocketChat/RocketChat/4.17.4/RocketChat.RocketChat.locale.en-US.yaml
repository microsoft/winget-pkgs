ReleaseNotes: |-
  🐛 Fixes
  - The window now opens on every launch. If the window was hidden in the tray when the app last quit, the next launch restored that state and showed only the tray icon, which Windows can place in the notification-area overflow, so the app could look like it had not started. Launching the app now always opens the window. To start in the tray, for example from a login shortcut, add --start-hidden to the shortcut. (#3535)

  🔧 Internal
  - Startup logs the app version, the user data path, and how the main window's visibility was decided, to diagnose launches that show no window. (#3535)
