ReleaseNotes: |-
  ✨ Improvements
  - Turn the right-click menu on or off. A new View > Right-click menu option controls the app's own right-click menu inside workspaces. It is on by default. Admins can set "isContextMenuEnabled": false in overridden-settings.json to turn the menu off and lock the option. When the menu is off, the keyboard shortcuts for Cut, Copy and Paste still work. (#3692)
  - The video call page can keep its window open on close. When the user closes the video call window, the call page can now ask the user first, for example to hand the call over. A page that does not answer within 1 second, or that has no handler, does not stop the close. A second close within 5 seconds always closes the window. (#3691)
