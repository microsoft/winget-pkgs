ReleaseNotes: |-
  ✨ Improvements
  - Unread messages in the tray icon, as an option. New setting "Unread counter in tray icon" in Settings → General. When enabled, the tray icon shows the unread badge again (a dot, 1–9 or 9+ on Windows and Linux; a dot on macOS) instead of your presence status. It's off by default, so the 4.17 presence icon stays unless you turn it on. (#3484, #3522)
  - macOS: hide the unread number in the menu bar. New setting "Unread count in menu bar" (on by default) to show or hide the number next to the menu bar icon. The Dock badge is unchanged. (#3522)
