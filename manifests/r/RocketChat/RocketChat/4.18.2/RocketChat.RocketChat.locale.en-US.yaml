ReleaseNotes: |-
  🐛 Fixes
  - Video calls in the app on Mac App Store builds: Mac App Store builds now open video calls in the video call window. All other builds already did this. After the update, the "Video calls inside app" setting is on. You can turn it off in Settings > Video calls. (#3570, NV-88)
  - Reopen a video call that is already open: the app now focuses the video call window when you open the conference that it already shows. Before, the app closed the window and opened a new one, so you left the call and joined it again. (#3569, NV-86)
