ReleaseNotes: |-
  4.19.0

  ✨ Improvements
  - Support for the Rocket.Chat 9.0 web client: the 9.0 web client no longer includes Meteor's client packages. The desktop app used them to read the workspace state. The app now reads the window events of the web client (#3606) and the values that the web client sends through the desktop bridge (#3616). The unread badge, title, favicon, login state, user roles and Outlook credentials keep working on 9.0. Workspaces on 8.x and older keep the existing integration.
  - Tray presence through the web client contract: the tray shows the status and the custom status text with its end time. It also lists the custom statuses of the workspace. This needs a server that sends the presence contract. A status that you select in the tray uses the same flow as the user menu (#3604, #3612).
  - Badge from the web client: when the web client sends its own badge, the app uses it. The badge then follows the user's "Unread alert" preference (#3607).
  - Electron 43.8.1: updates Electron and blocks the compromised eMudhra intermediate certificates (#3614).

  🐛 Fixes
  - The app keeps the bridge calls that the web client makes before the workspace finishes loading. Before, an early title change could show "The application GUI just crashed", and the favicon, title and user roles could stay empty (#3608).
  - The workspace favicon loads from absolute URLs (#3610).
  - After the server refuses a status change, the tray shows the real status again (#3612).
  - The 8.x integration stops its setup check after setup is complete. Before, the check ran every second for the life of the page (#3613).
  - The app no longer adds a store listener on each state request, and it no longer sends updates to closed windows (#3611).

  🔧 Internal
  - A probe for the web client window events that the desktop app reads (#3605).
  - Contributor and agent documentation and tooling (#3471, #3571, #3575, #3576, #3603, #3618, #3619).

  Also included
  These fixes shipped earlier in the 4.18.1 to 4.18.5 patch releases:
  - A workspace that starts without a network recovers when the network comes back (#3560).
  - The video call window gets focus when it already shows the requested conference (#3569).
  - Video calls open in the internal window on Mac App Store builds (#3570).
  - Server information and settings load on Rocket.Chat 8.10, and copy works there (#3578).
  - The call window closes on leave for servers that read videoCallWindow (#3581).
  - Desktop notification actions report the ID of the button that the user clicked (#3582).
  - Status changes fall back to users.setStatus when the server removes setUserStatus (#3583).
  - Embedded players on server pages can go full screen (#3585).
  - Electron 42.11.17 with the revoked eMudhra certificates blocked (#3615).
