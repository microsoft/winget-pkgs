ReleaseNotes: |-
  🐛 Fixes
  - Workspaces with a self-signed or private-CA certificate: the supported-versions check now accepts the certificate that you trusted for the workspace. Before, the check ignored that trust and could not get fresh supported-versions data. Then the app could show a workspace with a newer server version as "unsupported". (#3646, DSK-238)
  - Workspaces behind a proxy: the supported-versions check now uses the same proxy settings as the workspace page. Before, with a proxy that only the http_proxy/https_proxy variables set, the check could not get fresh data. (#3646, SUP-1131)
  - New server releases: the supported-versions data from the server or the cloud can lag behind a release. The app no longer blocks the next release after the newest listed version until the data lists it (for example, 9.1 when the data ends at 9.0). Expired exceptions and versions further ahead stay blocked. (#3646)
  - Server URLs with a password that has a %: the supported-versions check now sends the password as written. (#3646)

  🔧 Internal
  - Fixed the upload of the macOS build artifacts to the test-build storage. (#3647)
