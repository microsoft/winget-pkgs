ReleaseNotes: |-
  4.18.0

  ✨ Improvements
  - Media indicators on workspace tabs: a tab shows when its workspace plays audio, and a click on the indicator mutes it (#3491). Tabs also show when the camera, the microphone, or screen sharing is in use (#3493).
  - Find in page: press Cmd+F (macOS) or Ctrl+F (Windows and Linux) to search the text of the current workspace (#3492).
  - Recovery for stuck workspaces: when a workspace stops responding or its page crashes, the app shows the failure view. The Reload button then starts the workspace again in a new process (#3533, #3556).
  - Conference calls in the video call window: conference call pages now open in the video call window (#3523). The workspace can control that window through the RocketChatDesktop API (#3510).
  - Settings window: the settings window now has a fixed size (#3504).
  - Web UI previews (Developer Mode): load the web UI build of a Rocket.Chat pull request into a workspace (#3525, thanks @ggazzo). You can also load the build of the develop branch (#3534, thanks @ggazzo). The app keeps a history of the builds and updates them in place (#3541, #3536, #3548).

  🐛 Fixes
  - macOS no longer asks for screen recording permission at startup (#3552).
  - go.rocket.chat deep links open the right workspace, and login matching works for http workspaces (#3518).
  - Windows notification quick replies now work after the user dismisses the notification (#3519).
  - "Restart to update" now quits and restarts the app on macOS (#3543).
  - The conference page no longer throws errors in the video call window (#3546).
  - Update channels: on the Stable channel, the app offers only stable releases. A change from the Alpha or Beta channel to Stable no longer offers an older version (#3555).

  🔧 Internal
  - Release builds run as one prepare job and seven parallel packaging jobs (#3513, #3532).
  - Faster pull request checks: sharded Jest and transpile-only ts-jest (#3511). PR artifact builds no longer run lint and tests again (#3512, #3524).
  - Removed dead code from the window migration and the video call bridge (#3514, #3515, #3516, #3517).
  - engines.node matches the devEngines floor (#3502).
  - Contributor and agent documentation and tooling (#3494, #3500, #3542, #3544, #3545).

  Also included
  These fixes shipped earlier in the 4.17.1 to 4.17.4 patch releases:
  - The main window opens every time the app starts (#3535).
  - An opt-in unread counter tray icon, and a macOS setting to hide the unread count in the menu bar (#3522).
  - The app starts when it cannot write its configuration file (#3507).
  - A way to reset saved window sizes and positions (#3488).
  - The app no longer overrides the web client's presence detection on servers 7.10 and later (#3490, thanks @ricardogarim).
  - Conference http(s) popups open as sandboxed child windows (#3485).
  - macOS release signing fix (#3499).
