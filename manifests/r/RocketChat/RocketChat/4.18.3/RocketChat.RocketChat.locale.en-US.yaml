ReleaseNotes: |-
  🐛 Fixes
  - Workspaces on Rocket.Chat 8.10: the app now reads the server version from the location that Rocket.Chat 8.10 uses. Before, on these servers the app reloaded the workspace two times at startup and then turned off its desktop integrations, such as the unread badge, the server icon and title, and presence. (#3578, CORE-2792)
  - Copy text and Copy link: copying from a message now works also when the app cannot finish connecting its desktop integrations to the workspace. (#3578, CORE-2792)
  - Server icon and title on Rocket.Chat 7.11 and later: the workspace tab now follows changes to the server favicon and site name. The previous code did not cover the settings location that 7.11 introduced. (#3578, CORE-2792)
