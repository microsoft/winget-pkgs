ReleaseNotes: |-
  🐛 Fixes
  - Leaving a video conference closes its window. On servers that read the videoCallWindow bridge name, the call window now closes when you leave the call. Before, it loaded the full Rocket.Chat app. (#3581)
  - Notification action buttons report the button you clicked. The "Join" button on an incoming conference invitation now sends its own action id to the web client, so the client starts the expected action. (#3582)
  - Status changes work on servers without setUserStatus. When the server no longer has the setUserStatus method, the app sets your status through users.setStatus. (#3583)
  - Fullscreen works for embedded players. The fullscreen button of embedded players, such as YouTube videos in messages, now opens fullscreen on server pages. (#3585)
