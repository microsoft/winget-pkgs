ShortDescription: Open-source desktop accounting for people coming from QuickBooks Desktop.
Description: |-
  Ironbooks is free, open-source accounting that works the way QuickBooks Desktop does. The
  company file is one file you can keep on your office file server, locked while someone is
  in it, with Ask to Come In and multi-user mode. Users and passwords belong to the company
  file, QuickBooks' keyboard shortcuts work throughout, and everything stays on your computer.
