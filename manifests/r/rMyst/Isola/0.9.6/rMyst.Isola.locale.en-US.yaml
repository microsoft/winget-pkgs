ShortDescription: A free Dynamic Island for Windows 10 and 11 that gathers music, notifications, timers and downloads at the top of the screen.
Description: |-
  Isola is a living island at the top edge of the screen. It shows the current track with its cover, controls and synced lyrics with word-by-word karaoke, Windows notifications with history, timers and downloads. It also has an iPhone-style home screen with controls and widgets, screenshots with text and QR recognition, a file shelf, clipboard history, notes, a launcher with a calculator and converter, six island styles and deep customization. Free, no subscriptions.
