ShortDescription: Бесплатный Dynamic Island для Windows 10 и 11. Музыка, уведомления, таймеры и загрузки у верхнего края экрана.
Description: |-
  Isola живёт у верхнего края экрана: текущий трек с обложкой, управлением и текстом песни с караоке по словам, уведомления Windows с историей, таймеры и загрузки. Ещё главный экран как пункт управления на айфоне с виджетами, скриншоты с распознаванием текста и QR, полка для файлов, история буфера обмена, заметки, лаунчер с калькулятором и конвертером, шесть стилей острова и глубокая настройка. Бесплатно, без подписок.
