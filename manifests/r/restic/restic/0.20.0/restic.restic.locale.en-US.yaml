ReleaseNotes: "Changelog for restic 0.20.0 (2026-11-19)\n=======================================\n\nThe following sections list the changes in restic 0.20.0 relevant to restic users. The changes are ordered by importance.\n\nSummary\n-------\n\n • Sec [#22178](https://github.com/restic/restic/issues/22178)：Fix ownership when `restore --ownership-by-name` cannot resolve names\n • Sec [#22180](https://github.com/restic/restic/issues/22180)：Reject duplicate or out-of-order node names during `restore`\n • Fix [#21977](https://github.com/restic/restic/pull/21977)：Don't crash on truncated key or config file\n • Fix [#22007](https://github.com/restic/restic/pull/22007)：Redact `swift` backend password in debug log output\n • Fix [#22051](https://github.com/restic/restic/issues/22051)：Reject empty repository location files\n • Fix [#22085](https://github.com/restic/restic/issues/22085)：Restore partially matching hard-linked files correctly\n • Fix [#22092](https://github.com/restic/restic/issues/22092)：Handle empty directories from older repaired snapshots\n • Fix [#22112](https://github.com/restic/restic/issues/22112)：Don't reset `stats` progress bar counters for every snapshot\n • Fix [#22120](https://github.com/restic/restic/issues/22120)：Improve error message when `prune` fails to list pack files\n • Fix [#22136](https://github.com/restic/restic/pull/22136)：Improve resilience of repository v2 upgrade rollback\n • Fix [#22163](https://github.com/restic/restic/pull/22163)：Error on too large numbers in `--keep-within*` durations\n • Fix [#22181](https://github.com/restic/restic/issues/22181)：Do not delete files in directories whose tree cannot be loaded\n • Chg [#22104](https://github.com/restic/restic/pull/22104)：Require Go 1.26.10 or newer\n • Enh [#3129](https://github.com/restic/restic/issues/3129)：Add JSON support to `prune` command\n • Enh [#5189](https://github.com/restic/restic/issues/5189)：Add option to disable AWS S3 dual-stack endpoints\n • Enh [#5248](https://github.com/restic/restic/pull/5248)：Add warmup support for `check` on the S3 backend\n • Enh [#5372](https://github.com/restic/restic/issues/5372)：Support specifying snapshot ID in `list packs` command\n • Enh [#5741](https://github.com/restic/restic/issues/5741)：Support Multi-Bucket Application Keys in the `b2` backend\n • Enh [#21845](https://github.com/restic/restic/pull/21845)：Handle missing pack files in `repair packs`\n • Enh [#21870](https://github.com/restic/restic/issues/21870)：Show excluded items during `backup` in verbose mode\n • Enh [#21883](https://github.com/restic/restic/pull/21883)：Handle corrupted pack files in `find --pack`\n • Enh [#21892](https://github.com/restic/restic/issues/21892)：Make `repair snapshots --forget` remove broken snapshots\n • Enh [#21937](https://github.com/restic/restic/pull/21937)：Reduce memory usage of the in-memory index\n\nDetails\n-------\n\n • Security #22178：Fix ownership when `restore --ownership-by-name` cannot resolve names\n\n   When restoring with `--ownership-by-name`, user or group names that could not be resolved on the restore host (or were not recorded in the snapshot) caused restic to change the owner of the restored file to UID/GID 0. Combined with restored setuid/setgid bits this could produce unintentional setuid-root files.\n\n   Restic now instead falls back to the numeric UID/GID stored in the snapshot and prints a warning when a name cannot be resolved.\n\n    [#22178](https://github.com/restic/restic/issues/22178) [#22185](https://github.com/restic/restic/pull/22185) \n\n • Security #22180：Reject duplicate or out-of-order node names during `restore`\n\n   A tree containing a symlink and a directory with the same name could let `restore` write through the symlink to files outside the restore target.\n\n   Restic now rejects trees whose node names are not strictly increasing during restore and reports an error instead of restoring such a snapshot.\n\n   Thanks to Mario Ramos (@marrionesa), calif.io, Zachariah Mithani (AploSec) and Manuel Riel (@m3nu) for reporting this.\n\n    [#22180](https://github.com/restic/restic/issues/22180) [#22190](https://github.com/restic/restic/pull/22190) \n\n • Bugfix #21977：Don't crash on truncated key or config file\n\n   Restic previously crashed with a slice bounds panic when the repository contained a key or config file that was shorter than the encryption overhead, for example after an upload was interrupted. Since every command has to read a key file, the whole repository became unusable until the file was removed.\n\n   This has now been fixed, and restic instead reports that the file is too short.\n\n    [#21977](https://github.com/restic/restic/pull/21977) \n\n • Bugfix #22007：Redact `swift` backend password in debug log output\n\n   Restic could previously write the OpenStack Swift backend password in clear text to the debug log when debug logging was enabled. The password came from the environment variables `OS_PASSWORD` and `ST_KEY`. It is now redacted.\n\n    [#22007](https://github.com/restic/restic/pull/22007) \n\n • Bugfix #22051：Reject empty repository location files\n\n   Previously, if the `--repository-file` option or `RESTIC_REPOSITORY_FILE` environment variable referred to a file that was either empty or contained only whitespace, restic used the current directory for the repository.\n\n   This has now been fixed, and restic instead reports an error in this case.\n\n    [#22051](https://github.com/restic/restic/issues/22051) [#22052](https://github.com/restic/restic/pull/22052) \n\n • Bugfix #22085：Restore partially matching hard-linked files correctly\n\n   When restoring over an existing file which had hard links and was partially different from the file in the snapshot, restic used to replace the file with an empty one but only restored the changed parts. The restored file then contained zero bytes in the unchanged parts. Restic now instead rewrites the whole file in this case.\n\n    [#22085](https://github.com/restic/restic/issues/22085) [#22086](https://github.com/restic/restic/pull/22086) \n\n • Bugfix #22092：Handle empty directories from older repaired snapshots\n\n   Since restic 0.19.0, snapshots containing empty directories written by older versions of `repair snapshots` could fail with `error decoding tree：expected [, got <nil>`.\n\n   This has now been fixed, allowing `prune`, `check` and `restore` to process the affected snapshots successfully.\n\n    [#22092](https://github.com/restic/restic/issues/22092) [#22117](https://github.com/restic/restic/pull/22117) \n\n • Bugfix #22112：Don't reset `stats` progress bar counters for every snapshot\n\n   The progress bar of the `stats` command previously reset its file, blob and size counters at the start of each snapshot, so the final progress line only showed the numbers for the last processed snapshot. These numbers varied between runs depending on the order in which snapshots were processed.\n\n   The progress bar now instead counts across all selected snapshots.\n\n    [#22112](https://github.com/restic/restic/issues/22112) [#22130](https://github.com/restic/restic/pull/22130) \n\n • Bugfix #22120：Improve error message when `prune` fails to list pack files\n\n   When listing the pack files of a repository failed during `prune`, for example due to a request timeout, restic printed the error together with a stack trace.\n\n   Restic now instead reports a short error message stating that listing the pack files failed.\n\n    [#22120](https://github.com/restic/restic/issues/22120) [#22124](https://github.com/restic/restic/pull/22124) \n\n • Bugfix #22136：Improve resilience of repository v2 upgrade rollback\n\n   When an upgrade from repository version 1 to version 2 failed, restic deleted the configuration file before writing the previous version of it back. If writing the old configuration file back also failed, the repository no longer had a configuration file and could not be opened.\n\n   Restic now writes the previous configuration back without deleting the file first on relevant backends.\n\n    [#22136](https://github.com/restic/restic/pull/22136) \n\n • Bugfix #22163：Error on too large numbers in `--keep-within*` durations\n\n   Restic used to crash with a stack trace when a number in a duration such as the one passed to `forget --keep-within` did not fit into an integer. It now reports an invalid argument instead.\n\n    [#22163](https://github.com/restic/restic/pull/22163) \n\n • Bugfix #22181：Do not delete files in directories whose tree cannot be loaded\n\n   When `restore --delete` failed to load or read the tree of a directory, for example because a pack file was missing, restic reported an error but then deleted all existing content of that directory in the target. Restic now disables deletion for the rest of the restore when a tree cannot be loaded.\n\n    [#22181](https://github.com/restic/restic/issues/22181) [#22189](https://github.com/restic/restic/pull/22189) \n\n • Change #22104：Require Go 1.26.10 or newer\n\n   Restic now requires Go 1.26.10 or newer to build, as the library used to access the B2 backend requires it.\n\n    [#22104](https://github.com/restic/restic/pull/22104) [#22121](https://github.com/restic/restic/pull/22121) \n\n • Enhancement #3129：Add JSON support to `prune` command\n\n   The `prune` command now supports the `--json` option for JSON output.\n\n    [#3129](https://github.com/restic/restic/issues/3129) [#5239](https://github.com/restic/restic/pull/5239) \n\n • Enhancement #5189：Add option to disable AWS S3 dual-stack endpoints\n\n   Restic used dual-stack endpoints for AWS regions that have them, with no way to opt out. VPC interface and gateway endpoints do not support dual-stack, so a repository reachable over a VPC endpoint could not be used.\n\n   Passing `-o s3.disable-dualstack=true` now keeps restic on the single-stack endpoint.\n\n    [#5189](https://github.com/restic/restic/issues/5189) [#22060](https"
