PackageIdentifier: Rinflow.Rinflow
PackageVersion: 0.0.1
PackageLocale: zh-CN
ShortDescription: 让 Windows 电脑和 Mac 共用一套键盘和鼠标。
Description: |-
  把指针移过屏幕边缘，就能接着操作下一台设备。同一局域网内的设备用六位数字码配对，
  所有连接都使用 TLS 1.3 加密。剪贴板里的文字、图片和文件可以随指针一起过去。
  可与 Rinflow for macOS 配合使用。
Tags:
- 键盘
- 鼠标
- 键鼠共享
- 剪贴板
