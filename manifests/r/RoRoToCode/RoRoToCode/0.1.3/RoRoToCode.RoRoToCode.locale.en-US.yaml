ShortDescription: Windows local coding agent for llama.cpp and GGUF models
Description: |-
  RoRoTo Code is a Windows desktop coding agent focused on running local GGUF models through llama.cpp.
  It reads GGUF file headers to estimate VRAM usage, recommends a context size, selects the CUDA, Vulkan
  or CPU backend, and manages the llama-server process lifecycle. Ollama, LM Studio, OpenAI-compatible
  APIs and Anthropic are also supported as model sources.

  At runtime the application downloads third-party components (llama.cpp, NVIDIA CUDA/cuBLAS/cudart
  runtime libraries and GGUF models). These are distributed under their own licenses, not under this
  project's MIT license. See the repository README for the full third-party notice.
