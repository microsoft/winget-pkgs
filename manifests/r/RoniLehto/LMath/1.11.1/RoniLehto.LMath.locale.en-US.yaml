  > [!WARNING]
  > ❗️ **Apple Silicon -käyttäjät** 🍎
  > 
  > L'Mathin arm64- eli Apple Silicon -versiota ei ole Applen vaatimusten mukaisesti notarisoitu ja allekirjoitettu, eli **se ei aukea ilman [pientä kikkailua](https://lehtodigital.fi/lmath/guide/user/installation/mac)**.
  >
  > Saat L'Mathin toimimaan seuraavasti (**Huom!** Käytä tätä kikkaa *vain* jos luotat täysin ohjelmaan, jota yrität avata!)
  > 1) Siirrä `LMath.app` normaalisti esim. /Applications -kansioon
  > 2) Avaa Terminaali (Ohjelmat &rarr; Apuohjelmat &rarr; Terminaali)
  > 3) Aja komento `xattr -d com.apple.quarantine "/Applications/LMath.app"` (muuta kansio ja "LMath.app" oikeaksi)
  > 
  > Tämän jälkeen ohjelman pitäisi aueta normaalisti.

