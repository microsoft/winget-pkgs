ReleaseNotes: |-
  中文部分 | English Message Below

  请注意：
  - 如果你是Windows 10用户且没有关闭Windows Defender Smartscreen，你有可能需要在打开应用后的Smartscreen拦截框中点击“更多信息”->“仍然允许”来运行wnr。原因很简单：取消这个拦截需要我们花费数百美刀购买证书。
  - 如果你是macOS用户，若出现“无法打开应用”警告，请遵照这个教程打开应用，原因同样是因为签名证书太贵，难以负担。此外，若出现 “已损坏，无法打开。 您应该将它移到废纸篓”报错，则请遵照另一个教程打开应用 。可能还应在终端中设置 xattr -cr /Applications/wnr.app。
  - 对 32 位系统的支持已经终止，因为几乎已经没有人再下载它们。

  更新内容：
  - 首页的工作和休息时间加了标签，也可以写「1小时」这类说法并看到换算。不能开始时会说明原因；打开专心模式会先告诉你这段时间会锁住屏幕。
  - 设置按使用场景重新排过，互相影响的选项会写在旁边，比如按比例休息、无限循环、自动开始默认任务。锁定模式的密码栏也理顺了。改语言或外观时会先问要不要重启。
  - WebDAV 现在更安全，并可以连家里或公司的内网服务器，远程文件夹也可以不填。

  下载链接：
  1. 蓝奏云高速下载
  2. 百度网盘链接备用（密码：i4ad）
  3. Scoop (Windows)
  scoop bucket add sushi https://github.com/kidonng/sushi
  scoop install sushi/wnr

  联系我：
  如果有任何功能建议或者疑问，请发邮件到scrisqiu@hotmail.com。

  English Part

  Tips for Windows Users:
  - Please note that if you've turned on Windows Defender Smartscreen, you may need to click [more info] and then [still allow] to run it, or to click [run anyway] for Windows 8. The situation is here because we cannot afford to buy a signing certificate which costs [hundreds of dollars].
  - Support for 32-bit systems has been discontinued, as almost no one downloads them anymore.

  Tip for macOS Users:
  - Please note that the macOS version is unsigned, so you may need to follow this guide in order to use.
  - If macOS reports wnr as "damaged", please follow this guide to get rid of this. If you are using newest macOS versions, it is reported that terminal script xattr -cr /Applications/wnr.app is also needed.

  Updated For:
  - Work and rest on the home screen are labeled. You can type things like "1 hour" and see the conversion. If a session cannot start, wnr says why. Turning on Focus first tells you that period will lock the screen.
  - Settings is rearranged by how you use it. Options that affect each other now say so on the spot, such as percentage rest, Infinity, and auto-starting the default plan. Lock mode is easier to turn on or off. Changing language or appearance asks before restarting.
  - WebDAV is now safer, and can now connect to a home or office intranet server. The remote folder can also be left empty.

  Downloads:
  1. GitHub Release here below
  2. Also available on Softpedia
  3. Scoop (Windows)
  scoop bucket add sushi https://github.com/kidonng/sushi
  scoop install sushi/wnr

  Contact Me:
  In case you have any suggestion or question, drop me a line at scrisqiu@hotmail.com.
  Roderick Qiu, @RoderickQiu
