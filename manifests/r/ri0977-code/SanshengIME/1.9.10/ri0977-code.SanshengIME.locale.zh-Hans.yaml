ShortDescription: Rime 小狼毫的五笔·拼音·英文混输增强版，带三向反查、简繁切换与自动调频
Description: |-
  三生输入法是在 Rime 小狼毫 0.17.4 基础上做的增强发行版：保留五笔、拼音、英文混输与简繁切换，增加三向编码反查、多音字注释、自造词与自动调频。
  安装器会自动识别已有的官方小狼毫或旧版三生，在原安装目录覆盖升级；词库、user.txt、打字记录与 Custom_phrase.txt 原样保留，旧配置先备份到 sansheng-backup-时间戳。
  三生与官方小狼毫共用同一套 TSF 组件，不能并存；装过官方版的机器由三生接管。
