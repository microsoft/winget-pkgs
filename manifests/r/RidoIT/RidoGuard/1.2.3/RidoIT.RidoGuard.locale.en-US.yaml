ReleaseNotes: |-
  First public release through the RidoGuard release channel.

  Added: Windows event log integration, exportable PDF hardening report, and a portable build
  alongside the installer.

  Changed: both builds now carry their own .NET 8 runtime, so there is no prerequisite to install
  and the installer completes unattended with no prompts.

  Fixed: firewall rules fail loudly instead of silently skipping on DNS resolution failure, DNS
  changes no longer report a false success, the performance optimizer counts only processes it
  actually trimmed, and a service handle leak is closed.
ReleaseNotesUrl: https://github.com/Ridocompany/ridoguard-releases/releases/tag/v1.2.3
InstallationNotes: RidoGuard requires administrator rights and will prompt for elevation on launch.
