ReleaseNotes: |-
  Ad blockers stay on while you're away.

  Keep a site active from the right-click menu on the RidoGuard icon in your browser's toolbar.
  Free RAM and away mode leave that site's tabs running.

  After updating, restart Chrome or Edge once to load the new extension.
