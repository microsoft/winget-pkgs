ReleaseNotes: |-
  Diagnose Device: checks interrupt load, cooling against the power budget, sensors, USB devices,
  drivers, drive health, firmware, screens and restore points. Where RidoGuard can fix a finding
  itself, it has a Fix this button, and any change is logged in the Audit Log. The cooling test
  works your graphics card and processor flat out for about a minute, with nothing to install.

  About screen with the version, links and a Check for updates button. The About menu opens it.

  The ridoguard command line tool ships in both downloads. Only its commands that change settings
  ask for administrator rights. The Audit Log can Roll Back to Last Change, which will list what it
  undoes and asks you. If you run it again, it'll revert to the session before. Any modification is
  logged.

  Light and dark themes are both readable. The first launch follows the Windows theme settings, the
  toggle preference is saved.

  Updates ask first. Nothing downloads until you click Download and install, and the startup check
  can be switched off.

  The drift banner lists which settings changed since a profile was applied.

  The Explorer sort fix no longer restarts Explorer in a loop, and Undo puts its changes back.

  Third-party notices ship with both downloads.

  Fixed: importing a saved profile applies it, the scheduled re-apply task runs, a refused restore
  point shows up whichever way you apply a profile, and the installer removes debug symbol files
  older versions left behind. Launch RidoGuard on the installer's last page works now. It failed
  with code 740.
ReleaseNotesUrl: https://github.com/Ridocompany/ridoguard-releases/releases/tag/v1.3.0
InstallationNotes: The RidoGuard window asks for administrator rights when it opens. The ridoguard command asks only for commands that change settings.
