ShortDescription: Your Claude Code agents, living in a tiny pixel-art office.
Description: |-
  A small desktop widget that shows your Claude Code sessions (and Codex, Gemini CLI and OpenCode) as pixel-art coworkers.
  You see at a glance who is thinking, typing, reading or running a command, who delegated work to sub-agents, and who is waiting for you.
  Everything runs locally: it reads the session transcripts on your computer and sends nothing anywhere.
