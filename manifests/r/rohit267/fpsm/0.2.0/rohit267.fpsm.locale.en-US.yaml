ShortDescription: Free, open-source FPS counter overlay and screenshot hotkey for Windows games, a Fraps alternative.
Description: fpsm shows the frame rate of DirectX 9-12, OpenGL and Vulkan games in a corner of the screen and saves a screenshot with a hotkey. It reads the frame events Windows publishes through ETW instead of injecting into the game, so nothing touches anti-cheat. One small exe, no installer, no telemetry.
