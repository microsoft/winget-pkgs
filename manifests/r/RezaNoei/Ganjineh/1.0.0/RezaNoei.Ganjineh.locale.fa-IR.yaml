PackageName: گنجینه
ShortDescription: مدیر رمز عبور آفلاین، فارسی‌محور و چندگاوصندوقی برای ویندوز.
Description: |-
  گنجینه یک مدیر رمز عبور آفلاین برای ویندوز است که با WPF و ‎.NET ساخته شده است.
  رمزها را در گاوصندوق‌های رمزنگاری‌شدهٔ محلی (SQLCipher و AES) نگه می‌دارد؛ رابط کاربری
  فارسی و انگلیسی با پشتیبانی کامل از چیدمان راست‌به‌چپ، کلید بازیابی، پشتیبان‌گیری
  رمزنگاری‌شده، ورودهای TOTP/HOTP، مولد رمز عبور و مرکز امنیت دارد.
