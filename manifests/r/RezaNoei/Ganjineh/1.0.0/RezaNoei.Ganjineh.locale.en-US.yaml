ShortDescription: Offline, Persian-first, multi-vault password manager for Windows.
Description: |-
  Ganjineh (گنجینه, "treasure") is an offline password manager for Windows built with WPF on .NET.
  It stores credentials in local encrypted vaults (SQLCipher + AES), supports full-disk offline
  operation, Persian and English UI with right-to-left mirroring, recovery keys, encrypted
  backups, TOTP/HOTP authenticator entries, a password/passphrase generator, and a security center.
