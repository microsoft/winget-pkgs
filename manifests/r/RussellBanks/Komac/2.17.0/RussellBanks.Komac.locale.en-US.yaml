ReleaseNotes: |-
  What's Changed
  Major changes⭐
  - Add support for Inno Setup installers up to 7.1.0
  - Add .appinstaller file support
  Fixes and other changes 🔧
  - Make PortableCommandAlias optional by @pl4nty in #1698
  - Add 64-bit roots to NSIS registry by @pl4nty in #1691
  - Default Publisher to GitHub owner by @pl4nty in #1699
  - NSIS WriteUninstaller don't use empty path by @pl4nty in #1701
  - Handle NSIS uninstaller path variables and reset working dir for each section by @pl4nty in #1703
  - Normalize backslashes in NSIS filesystem paths by @pl4nty in #1700
  - Fix architecture detection for multi-architecture zip installers by @UnownPlain in #1609
  - Normalize MSI DefaultInstallLocation by @UnownPlain in #1712
  - Detect MSI scope from install directory by @pl4nty in #1692
  - Save manifests on exit by @UnownPlain in #1715
  - Bump locale file manifest version when using komac submit by @UnownPlain in #1781
  - Autofill InstallLocation for WiX installers by @UnownPlain in #1782
  - Replace sync method with "Sync fork" API by @twz123 in #1754
  - Update GitHub REST API to 2026-03-10 by @UnownPlain in #1794
  New Contributors
  - @twz123 made their first contribution in #1757
  - @Dessalines39394 made their first contribution in #1844
