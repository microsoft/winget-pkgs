ShortDescription: Windows disk cleaner and storage analyzer with a duplicate finder and Recycle Bin, WinSxS and virtual disk tools.
Description: |-
  DriveSweep helps you reclaim disk space on Windows by finding temporary files, Windows Update leftovers, browser caches and app caches, then letting you review everything before it is moved to the Recycle Bin.
  It includes a fast NTFS drive scanner with an interactive folder breakdown, a duplicate file finder, a large files view, and tools for the Recycle Bin, WinSxS, hibernation and WSL or Docker virtual disks.
  Personal folders are never selected automatically, Windows system folders and other accounts are blocked, and an Always Keep list protects anything you choose.
  DriveSweep runs as a standard user and asks for Administrator rights only for system level tasks. All data stays on your PC; update checks are optional and off by default.
