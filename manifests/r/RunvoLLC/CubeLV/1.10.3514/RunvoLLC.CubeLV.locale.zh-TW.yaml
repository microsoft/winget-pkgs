ShortDescription: 打造你自己的自動化 App：一句話說出要自動化的工作，agent、插件、交件卡一次建好。
Description: |-
  打造你自己的自動化 App。用一句話說出要自動化的工作，CubeLV 畫出整支 App 的藍圖、把每個畫面畫給你看，按下開始就建好。
  之後每天照常運作：agent 照排程做每一步，插件把結果給你看，需要你決定的地方用交件卡等你。
  支援 Windows、Mac、網頁、iOS、Android 與多人共用。
