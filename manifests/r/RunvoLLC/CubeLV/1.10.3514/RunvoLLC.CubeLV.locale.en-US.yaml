ShortDescription: 'Build your own automation app: agents, plugins and handoff cards, built from one sentence.'
Description: |-
  Build your own automation app. Describe the job you want automated in one sentence. CubeLV draws the blueprint of the whole app, sketches every screen for you to see, and builds it when you press Start.
  Then it runs every day: agents do each step on a schedule, plugins show you the results, and where a decision is yours, a handoff card waits for you.
  Works on Windows, Mac, the web, iOS and Android, with shared workspaces.
