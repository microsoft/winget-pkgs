Description: |-
  自分だけの自動化アプリを、つくろう。自動化したい仕事を一言で伝えると、CubeLV がアプリ全体の設計図を描き、すべての画面を見せて、開始を押すと作ります。
  そのあとは毎日動きます。エージェントがスケジュールどおりに各ステップを実行し、プラグインが結果を見せ、判断が必要なところは引き継ぎカードが待ちます。
  Windows、Mac、Web、iOS、Android に対応、共有ワークスペースつき。
