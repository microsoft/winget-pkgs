ReleaseNotes: |-
  🔥【新功能】新增 Secret Scanner，支持在组织和团队维度发现、定位并处理明文敏感凭证风险
  🐞 解决使用 allOf 并开启严格模式时，响应校验结果异常的问题
  🐞 解决分享文档中 Additional properties 引用的数据模型未显示的问题
  🐞 解决分享文档中默认示例未显示的问题
  🐞 解决通过 API 导出 OpenAPI/Swagger 数据时，指定模块和标签后可能导出其他模块接口的问题
  🐞 解决生成代码时，跨模块引用的数据模型可能丢失的问题
  🐞 解决单个用例同步后未显示保存按钮，导致无法保存数据的问题
  🐞 解决 Apifox CLI 导出项目内指定目录接口时，可能导出全部接口的问题
  🐞 解决 Apple M1 芯片设备安装 legacy 包后，断开外接显示屏可能导致客户端自动退出的问题
  🐞 解决导入 EasyDoc 文件时，请求 Body 被识别为 form-data，导致多层级参数导入不完整的问题
  🐞 解决文档站中部分 Markdown 告示组件颜色显示异常的问题
