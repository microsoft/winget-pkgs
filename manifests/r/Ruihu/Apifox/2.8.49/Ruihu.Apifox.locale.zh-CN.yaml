ReleaseNotes: |-
  🔥【新功能】支持 All-in-One 导入，自动识别数据格式并校验 URL

  🔥【新功能】Apifox CLI 支持按模块增删改查、导入结果统计与调试用例创建

  ⚡️【优化】提升用户项目列表接口的响应速度

  ⚡️【优化】优化团队角色分配与订阅升级流程

  🐞 解决生成接口请求代码时 Basic Auth 引用的变量未展开、被直接 Base64 编码的问题

  🐞 解决编辑 Tab 未展开引用的组合模式（allOf）数据模型字段的问题

  🐞 解决项目克隆/复制后接口跨项目引用数据模型的问题

  🐞 解决多线程持续调用时 Mock 用量计算错误的问题

  🐞 解决 CLI 创建的调试用例鉴权类型在 Web 端显示为 No Auth 且不生效的问题

  🐞 解决 CLI 导入时 OpenAPI response 的 $ref 定义被静默丢弃的问题

  🐞 解决 CLI 重复导入时静默新建重复接口、以及删除资源后 deleteCount 统计为 0 的问题

  🐞 解决组织邀请时选择 Forbidden（加入组织但不分配团队角色）后生成邀请链接报 Invalid Parameter 的问题
