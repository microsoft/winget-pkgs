ReleaseNotes: |-
  RClone Manager v0.3.5
  This release adds an auto-start delay, makes Quick Runs and Workflows per-backend, rebuilds the workflow engine's structure, and fixes a batch of Android background and file-manager problems.
  Highlights
  - Auto-start delay. Profiles and Quick Runs with auto-start can now wait a set number of seconds after the app starts, which helps when the network, a VPN or another mount isn't ready yet. Off by default.
  - Per-backend Quick Runs and Workflows. They now belong to the selected backend, like its remotes and settings. Existing ones move to the Local backend.
  - Android background reliability. Fixes the crash after about six hours in the background and adds a battery-optimization banner and a notification when Android ends the app while keep-alive was running.
  Added
  - Auto-Start Delay: Profiles and Quick Runs with auto-start on can now wait a set number of seconds after the app starts. Off by default.
  Changed
  - Faster Startup: Removed repeated loading of caches and settings at startup. The wait for the rclone engine now
    starts at 25 ms and backs off instead of al
  - Per-Backend Quick Runs and Workflows: Existing ones become the Local backend's. A new backend starts empty unless Copy Quick Runs & Workflows names a source in the Add Backend dialog.
  - Workflow Engine: Split the 4,800-line with one handler per node kind, and reducedcopying and polling while a workflow runs. Stored workflows are unchanged.
  Fixed
  Android
  - Background Crash: The app no longer cin the background. The background service now uses the special-use foreground type, which Android 15 does not limit.
  - Background Reliability: Added a banner to exempt the app from battery optimization and a notification when Android ends the app while keep-alive was rwed every 30 minutes, and automatic cloudbackup no longer uploads rclone.conf.
  - Background Service and Updates: With "Run in Background" off, the service now stays up while jobs, mounts or serves are running. In-app updates work again on Android 9, 10 and some Android 13 builds.
  - File Manager: Saving shorter content the old ending, and creating a name thatalready exists picks "name (1)". Folders that fail to load show an error, browsing remotes no longer blocks the
    system, and mounted remotes are no longer ped text is saved as a file instead of beingdropped.
  - Release Build: Release shrinking remoh JNI, so the file manager roots,metered-connection banner, content:// downloads and opening folders in the system file browser did not work in the shipped APK.
  Workflows
  - Messages Are Translated: Run messages, step errors and execution log lines now follow the language setting in all ten languages.
  - Run Reliability: A workflow can only kend, a crashing node fails its own step, and finishing a run no longer overwrites edits made meanwhile. Fixes #312.
  - Stop and Cancel: A Stop node only ends scheduling, stopping interrupts waits immediately, and a stopped run reported as stopped rather than failed.
  - Steps and Triggers: Mount steps report a conflict when a different remote is mounted at the same point, unsupported nodes and unknown operators fail the step instead of passing, and only jobs of the selected backend start workflows. A running workflow keeps its Quick Runs across a backend switch.
  - Damaged Records: One unreadable stored workflow or Quick Run record is skipped and logged instead of hiding the others.
  General
  - Startup Stopped by a Missing Watch Folder: A file watcher that could not start, such as one on an unplugged drive, or a cron scheduler error no longer p.
  - Lower Background Activity: While the window is hidden, transfer statistics are requested every 11 seconds instead of every second.
  - Backend Names and Profile Collisions: Adding a backend whose name differs from another only by case, or matches Local's default profile, is rejected, since removing one could delete the other's settings on Windows and macOS.
  - Legacy Default Profile References: Operations no longer fail with Invalid rclone flags detected: default for remotes saved by 0.3.3 or earlier, and scheduled and workflow runs resolve the legacy default profile like manual runs. Fixes #330 and #336.
  Full Changelog: v0.3.4...v0.3.5
