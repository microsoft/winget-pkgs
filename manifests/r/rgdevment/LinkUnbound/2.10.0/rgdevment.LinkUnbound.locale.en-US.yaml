ReleaseNotes: |-
  LinkUnbound 2.10.0 - Move the picker where you like, and Microsoft Store updates come through
  Until now the picker stayed where it opened, browsers could only be ordered
  with the arrows, and a copy from the Microsoft Store could miss the update the
  Store had for it.
  - Drag the picker from the top, by the address or by the question, and
    LinkBear comes along. Next time it opens where you chose it to open.
  - In Browsers, drag a row to move it within its section. The arrows are still
    there for the keyboard.
  - If you installed LinkUnbound from the Microsoft Store, About shows the new
    version the Store has for you and installs it without leaving. If the Store
    is still bringing it, has it paused or has not offered it to you yet, it
    says so.
  - From the next update on, when Windows closes LinkUnbound to update it, it
    opens again in the background and your links keep arriving.
  What's Changed
  - feat(picker): carried by its head with the bear in tow, and browsers dragged into order in settings by @rgdevment in #93
  - fix(update): Store updates are offered whatever number comes with them, and the resident comes back after one by @rgdevment in #94
  - feat(news): what 2.10.0 brings, a picker you can drag, browsers ordered by dragging and Store updates by @rgdevment in #95
  Full Changelog: v2.9.0...v2.10.0
