ReleaseNotes: |-
  Connecting an AI agent to Tisty is lighter and clearer, with fewer tools to choose from, and agent hooks work smoothly on Windows, macOS and WSL2.
  - Everything your AI agent can do with Tisty is now organized into 15 clearer tools instead of 36, cutting the size loaded into every session by more than a third while keeping every capability.
  - Agents that still remember an earlier name are gently guided to the right replacement, without changing your tasks or documents.
  - Updating several fields on a task or organizing multiple documents at once now checks everything first, so a rejected request never leaves partial changes behind.
  - Built-in hooks run reliably across Windows, macOS and WSL2, including Antigravity CLI and Codex on Windows.
  - Tisty's bundled skills, in-app guide, help pages and security documentation are updated to match the lighter toolset.
  What's Changed
  - feat(mcp): consolidate 36 MCP tools into 15 domain tools with legacy moved redirects by @rgdevment in #41
  - docs(mcp): update SECURITY.md tool names and measured door weight figures by @rgdevment in #42
  - chore(skills): pin 15-tool skills from mcp-plugins by @rgdevment in #43
