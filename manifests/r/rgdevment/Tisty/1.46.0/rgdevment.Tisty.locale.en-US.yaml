ReleaseNotes: |-
  Tisty 1.46.0
  Languages others add wait for your review, and your AI agent remembers for less
  - When someone who edits your shared document adds a language, it waits as a proposal until you keep it or leave it out, and readers only see what you kept.
  - You review a language as Folio holds it, with who added it, its words and its pictures.
  - If a language you kept changes, its row says so and shows the new version against the one you approved.
  - What you left out stays aside, to review again whenever you like.
  - Readers see who translated and who reviewed each language someone else added.
  - Changing the edit link, or translating under someone else's, tells you first what will happen to those languages.
  - The day's counts open over all your lists and stop at +99, and each list has a menu of its own.
  - A document in many languages shows only the one you read and how many it has.
  - Connecting Tisty to your AI assistant costs a third less.
  - In assistants that show them, such as Claude Code or GitHub Copilot in VS Code, commands pick up where you left off, plan a task, look up how something was solved or keep a decision, and your documents can be mentioned with @.
  - The help and the guide tell how your agent picks up where it left off and keeps what it learns.
  What's Changed
  - feat(sharing): the owner reviews each language an editor adds, signed, and Folio keeps the word (contract 1.9.0) by @rgdevment in #684
  - feat(sharing): a link brings the languages the owner kept, reached by its review and weighed against Folio by @rgdevment in #685
  - feat(sharing): the owner joins by id the languages others added, lets go of lost ones, never cuts the map by @rgdevment in #686
  - feat(sharing): the owner signs its word on a language as shown, and it goes up with the anchor's version by @rgdevment in #688
  - feat(sharing): the owner reviews a language in the window, and whoever added it hears the owner's word by @rgdevment in #689
  - feat(ui): the day's counts open over every list and stop at +99, lists get a menu, the shrunk library a card by @rgdevment in #687
  - feat(ui): the library tree sits a touch inside its title by @rgdevment in #691
  - fix(sharing): an editor's entry is weighed against revocations, as the contract now says (1.9.1) by @rgdevment in #690
  - docs: the README and LEEME tell Tisty as the memory you and your AI agent keep, with real problems and fixes by @rgdevment in #692
  - feat(sharing): a kept language that changed says so to its owner and editor, and the owner reviews the changes by @rgdevment in #693
  - docs: the README and LEEME say local memory and context for you and your AI agent by @rgdevment in #694
  - docs: the help and the guide tell Tisty as memory and context for your AI agent, signed again by @rgdevment in #695
  - docs(mcp): the registry calls Tisty local memory and context for your AI agent by @rgdevment in #696
  - docs: the README, LEEME and help say an ordinary task list forgets, not Tisty's by @rgdevment in #698
  - feat(sharing): a language the owner left out stays aside to review again, and an anchor keeps within 64 words by @rgdevment in #697
  - docs: the help and README tell each real problem apart from what Tisty does about it by @rgdevment in #699
  - docs: the README and LEEME drop the Product Hunt badge until the next launch by @rgdevment in #702
  - feat(sharing): a kept language credits who translated and reviewed it, and edit-link and translate warn by @rgdevment in #700
  - refactor(mcp): connecting Tisty costs an agent a third fewer bytes, and a test keeps it from growing by @rgdevment in #701
  - docs: the savings and the cost of connecting are measured again after the lighter MCP door, JSON included by @rgdevment in #704
  - feat(ui): finishing a task shows its notice without Tisto's head and thumb by @rgdevment in #703
  - docs: the 1.46.0 news, and the help, PRIVACY and SECURITY tell how the owner reviews the languages others add by @rgdevment in #705
  - feat(mcp): slash commands for the common flows, and documents an agent can @-mention, outline first by @rgdevment in #706
  - docs: Tisto only peeks over the bar now, and finishing a task shows its notice with Undo for everyone by @rgdevment in #707
  - docs: the screens present Tisty as memory for you and your AI agent, lighter for the READMEs and the help by @rgdevment in #708
