ReleaseNotes: |-
  v1.49.0
  Everything you keep, joined in one network, and your agents' rules in one place
  - Type [[ in a document to link another one, and see who links to each document.
  - Cite any task inside a document as a live card you can tick, or write a new one right there.
  - Brainsty, in the sidebar, draws your documents, tasks, tags and files as one network you can search, filter and open.
  - Up close, each thing in the network shows as its own icon, with a card that says what it is and what points at it.
  - An amber curve shows what Tisty thinks is alike, and why, from rules and a fixed word list, never from AI.
  - The network turns slowly like a globe while lights walk its lines, and two switches make it still.
  - Each document keeps its earlier versions on your computer: see what changed and go back to one.
  - Every document has a link you can paste in a chat, your browser or your AI agent.
  - The Agents folder brings your AI agents' rules, skills and memory into Tisty, and can keep their files in sync.
  - Your AI agent can only propose a change to those rules, and nothing changes until you approve it.
  - Your AI agent finds what it needs with one search and reads only the part it needs.
  - Tisty can remind your AI agent, at the start and end of each turn, to keep its tasks up to date.
  - Hidden or dropped tasks and your diary stay out of the network and out of your agent's reach.
  - Settings is easier to find your way around: four groups, an overview that shows first what needs you, and a search for any setting.
  - Brainstorm is now called Ideas, with a light bulb of its own.
  - A folder, the Diary or Ideas can be hidden from the sidebar on this computer.
  What's Changed
  - feat(brain): Brainsty's base holds every document, page, task, tag and file, kept up in the background by @rgdevment in #817
  - feat(brain): the base ties what each document and task cites, mentions, hangs from, is tagged with and uses by @rgdevment in #818
  - fix(cache): each new task stops rebuilding the cache once another store wrote this machine's history by @rgdevment in #819
  - feat(mcp): an answer asks once whether the task the agent opened is up to date, with a switch in Settings by @rgdevment in #820
  - feat(brain): each document, page and task has a card: own facts kept by stamp, ties read from both ends by @rgdevment in #821
  - feat(docs): [[ links documents and their sections, with a preview and a panel of who links here by @rgdevment in https://github.com//pull/822
  - feat(assistants): a session starts with its open tasks, and a turn that wrote nothing in Tisty is handed back by @rgdevment in #825
  - feat(docs): any document cites a task as a live card, found from / and named beside the task it cites by @rgdevment in #823
  - fix(viewer): CodeMirror's styles move to their own sheet, so the light viewer no longer loads them by @rgdevment in #826
  - feat(mcp): tick leaves a task's state in one call, read brings it first, and a note can replace an earlier one by @rgdevment in #824
  - feat(docs): a new task written from / reads like the quick capture, is cited in place and born in its document by @rgdevment in #827
  - test(brain): Brainsty's first stage checked end to end: base, connections, card and links by @rgdevment in #828
  - feat(mcp): writes link what they name exactly, propose what is doubtful and ask what a picture shows by @rgdevment in #831
  - fix(mcp): the sidecar links the VC runtime statically, so it starts on Windows without the Visual C++ runtime by @rgdevment in #838
  - fix(app): the first-run card and sync texts speak as Tisty, not as a company by @rgdevment in #839
  - feat(agents): sync engine that keeps agent rules, skills and memory as documents and writes them byte for byte by @rgdevment in #834
  - fix(hooks): a push checks its names and subjects in a second, and a commit only what it stages by @rgdevment in #835
  - docs(guide): the agents guide and help say how hooks, the switches, a task state and signing work today by @rgdevment in #840
  - test(markdown): spaces inside the quotes stay out of what is named by @rgdevment in #842
