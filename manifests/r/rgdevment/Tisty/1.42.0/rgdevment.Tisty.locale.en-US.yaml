ReleaseNotes: |-
  Tisty 1.42.0
  You write with the Markdown out of the way, and your files open at once
  - Enter starts a new paragraph, the arrows go on from one block to the next, and the Markdown stays out of sight until you ask for it.
  - A Markdown file from disk opens in a light viewer of its own, without coming into your documents.
  - Windows open faster.
  - Widgets are now fixed views that run nothing. One with a script, buttons or links shows as code and tells you what does not belong.
  - On Windows, what you just typed is kept when the system closes Tisty, and from the next update on Tisty comes back by itself.
  - A Shared row beside each document leads to Folio, which hands it over with an encrypted link. If Folio has not opened yet, it tells you so and uploads nothing.
  - Before you share for the first time, Tisty explains your identity in plain words and lets you make it right there.
  - Your 24 words now say, wherever you see or type them, that nobody from Tisty or Folio will ever ask for them.
  - Tisty also installs with winget.
  What's Changed
