  - chore(contracts): 1.4.1 reads with aes-gcm 0.11, and what a reader or a writer does stays as it was by @rgdevment in #601
  - feat(window): a file from disk opens in a light viewer of its own, with Folio's look and up to 1 MB by @rgdevment in #600
  - refactor(window): the React window no longer carries the path for files, which the light viewer now reads by @rgdevment in #602
