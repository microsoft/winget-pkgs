  - fix(window): a first Edit on a Tisty not set up waits for the welcome, and the copy is made when it ends by @rgdevment in #606
  - chore(contracts): 1.4.3 keeps the AGPL and lets Folio include the contract under its own licence by @rgdevment in #608
