  - fix(tags): accents come off where a letter stands without them, and elsewhere the vowels stay by @rgdevment in #575
  - ci(contracts): a new version publishes itself once, and a pull request cannot change a package without one by @rgdevment in #576
  - feat(contracts): 1.0.1 adds a light entry for whoever checks in a page, and what Tisty sealed to open by @rgdevment in #578
  - ci(versions): meet the releases from 1.36.2 to 1.41.1, built from their tags by @rgdevment in #579
  - feat(sharing): a kept document reaches its sealed envelopes, Tisty reads as the contract says, and CI proves it by @rgdevment in #577
  - fix(contracts): a document's properties are read as far as the contract says, in Rust and in the window by @rgdevment in #581
  - fix(update): an update the Store offers is offered here too, whatever number comes with it by @rgdevment in #580
  - fix(window): Tisty comes back by itself after Windows closes it for an update, hidden if it was hidden by @rgdevment in #582
  - fix(window): what was just typed is kept when Windows closes Tisty for an update or a shutdown by @rgdevment in #583
  - feat(contracts): Tisty answers to tisty://open and tisty://edit alone, and folio leaves the contract by @rgdevment in #584
  - feat(contracts): a sealed document says who owns it, an editor signs with its token, and syncing is one button by @rgdevment in #585
  - perf(window): windows open without React's 300 ms wait, and reading no longer loads the editor by @rgdevment in #587
  - build(npm): the app and the packages install as one workspace with one lockfile, and nothing is published by @rgdevment in #586
  - fix(diagrams): a line break inside a label is drawn as a line break, not written out as
