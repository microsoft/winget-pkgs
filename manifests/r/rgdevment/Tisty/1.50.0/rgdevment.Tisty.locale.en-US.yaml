ReleaseNotes: |-
  v1.50.0
  Tisty's skills, in your agents, and the handover kept in the task
  - Tisty now comes with three skills that teach Claude Code, Cursor, Codex, GitHub Copilot and Gemini to work with it: pick up where you left off, leave the work ready for the next agent, and tidy up what you keep without deleting anything.
  - Turn them on in Settings › Agents, on each computer. They have their own switch, update with Tisty, and never write over a skill of yours.
  - When you connect an agent, its hooks come with it, with a tick to leave them out, and the same screen offers Tisty's skills; the agents you already had get both in one step, if you like.
  - A new hook asks your agent, once, whether what it was about to leave in a loose file or a task card of its own belongs in Tisty, and lets it go on if it insists. You can turn the hooks off whenever you like.
  - Ask your agent to “leave this ready for the next agent”, and where things stand, what was ruled out and the next step stay written in the task, for another agent, another account or you.
  - A step your agent says it finished counts apart everywhere, in the list, in Brainsty and in your documents, until you confirm it.
  - A task takes you straight to its journal, where your agent noted what it did.
  - Ask your agent what is pending and it answers at once, says how many tasks it leaves out and finds the ones in the inbox too. It also sees how long each document is before opening it, and a search puts the exact title first.
  - If an agent or its hooks lose Tisty because you moved or reinstalled it, the window tells you, and Fix all shows the files before writing and keeps two copies of each.
  - Fixing, adding or removing Tisty in an agent's settings is safer: it changes only its own part, asks first, and leaves alone what you set up your own way or what it could not read.
  - When you delete a rule or a skill from Agents, Tisty asks once whether to take it away from the agents that keep it too, with a backup.
  - After reinstalling, your encrypted cloud shows what is missing, step by step: reconnecting, and opening it with your phrase.
  - The window keeps answering while a cloud is reconnected, a backup is restored or a folder that does not answer is chosen.
  - The editor is steadier: many fixes to keys and the cursor, shortcuts that work with keyboards in other alphabets, and tables, diagrams and formulas inside a list or a quote drawn whole.
  - Documents read like a page: an easy column, the title first and the menu on that same row.
  - A document can wear a design, one of five or one of your own with its colors and its font, in light and in dark. It prints in the light colors, and it travels when you share the document.
  - If a save cannot write what you typed, Tisty keeps it aside so you can recover it.
  - The whole app says Agents instead of Assistants, and the help starts with what you want to do: on your own, with your agent, or with your files and privacy.
  - The privacy policy says which of your agents' files Tisty reads, when and why.
