ReleaseNotes: |-
  The GitHub release now also has FeatherWall-Setup.exe, a per-user installer. It adds the .NET 10 desktop runtime when it is missing, a Start menu entry, and an uninstall entry in Settings, Apps.

  The winget package is still the zip and works as before. The app now also handles the installer's install and uninstall steps, which only run for the Setup.exe install.
