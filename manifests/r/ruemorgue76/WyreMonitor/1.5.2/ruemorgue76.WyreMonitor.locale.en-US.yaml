ShortDescription: Hardware monitor that draws your PC as a circuit board and tells you in one sentence whether anything needs attention.
Description: |-
  WyreMonitor shows your PC as a circuit board drawing with live temperatures, fan speeds and loads, and sums up in one sentence whether anything needs attention.
  It has alerts, charts, a list view, a small always-on-top window, a reading on the tray icon, notifications and CSV export.
  A Windows service reads the sensors through LibreHardwareMonitor and the signed PawnIO driver (installed if missing) and serves them only on 127.0.0.1; the app shows them. No data leaves the PC.
