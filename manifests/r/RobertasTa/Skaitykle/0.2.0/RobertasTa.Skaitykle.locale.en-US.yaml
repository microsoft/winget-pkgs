ReleaseNotes: |-
  Four languages: Lithuanian, Russian (Dmitri), English (Cori) and German
  (Thorsten); the whole window switches to the chosen language. Voices are no
  longer bundled: they are downloaded per language on request and checked
  against SHA-256, so the installer is 80 MB instead of 196 MB. Voice and
  pronunciation list are kept per language. Fixed a Reginute artifact on
  spelled-out letters.
