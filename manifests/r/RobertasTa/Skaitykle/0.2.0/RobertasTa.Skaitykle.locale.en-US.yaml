ShortDescription: Offline text to MP3 in Lithuanian, Russian, English and German, with a speed slider, equalizer and pronunciation list.
Description: |-
  Paste text or open a .txt file and get an MP3 read aloud by a synthetic
  voice. Speech synthesis runs on your own computer with Piper voices: the text
  and the audio never leave it, there is no account and no subscription.
  Voices: Lithuanian Ingute and Reginute, Russian Dmitri, English Cori and
  German Thorsten, all from the official Piper voice catalogue. For Lithuanian
  the program adds its own reading recipe: a stress dictionary, and numbers and
  abbreviations read out as words. The window language follows the language
  you pick.
  A line "---" in the text splits the result into several MP3 files, for
  example one per slide. Speed, a seven-band equalizer, volume and the pause
  between paragraphs can be changed while a sample is playing. Each language
  has its own pronunciation list for terms and names.
  The installer (~80 MB) contains no voices. They are downloaded once, only for
  the languages you need (Lithuanian 128 MB, the others 64 MB each), and every
  file is checked against its SHA-256. Install with --interactive to tick the
  languages; a silent install starts in the Windows display language (English
  for other languages) and offers that language's voices. More languages can
  be added later in Settings.
  Not signed with a paid certificate, so Windows SmartScreen shows a warning on
  first run. The SHA-256 of every release file is published next to it.
