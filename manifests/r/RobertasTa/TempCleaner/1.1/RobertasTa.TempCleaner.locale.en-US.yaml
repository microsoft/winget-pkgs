ShortDescription: Transparent temp-file cleaner that shows its reasoning, previews every deletion, and keeps a full audit log.
Description: 'Temp Cleaner finds temporary-file locations on Windows and helps you clean them safely. Every location gets a risk colour (GREEN - safe to clean, YELLOW - confirm one by one, RED - view only, cleaning disabled), every skipped file is explained (AGE / LOCKED / JUNCTION), and every action is written to an audit log. Preview mode shows exactly what would be deleted before anything is touched. A right-click "What is this?" menu explains found programs via an offline 66-entry vendor knowledge base. One portable exe, English/Lithuanian UI, no installation, no telemetry, no network access. A companion to Windows built-in tools: it cleans the application cache jungles Storage Sense does not see.'
