ReleaseNotes: |-
  New ears: Lithuanian LT_ausys (kmynas v4, ONNX, CPU) instead of Paprika;
  Russian GigaAM v3 instead of Whisper large-v3; English unchanged. Lithuanian
  word errors 17.9 % vs 22.8 % on the author's commands and 10.2 % vs 32.4 % on
  long dictation; 0.05 s vs 3.0 s per command on the CPU. No GPU needed for
  Lithuanian and Russian. Microphone choice in the gear menu. Installer 95 MB.
