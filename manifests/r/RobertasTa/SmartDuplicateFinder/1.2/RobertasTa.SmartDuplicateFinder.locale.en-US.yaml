ShortDescription: Safe, portable duplicate file finder that never deletes your files.
Description: |-
  Finds duplicate files by content (MD5) and visually similar photos (perceptual hash).
  Two-phase scan with a guided candidate dialog and per-family time estimates.
  Results are colour-grouped by file family with a colour-coded Excel report,
  so you can clean up at your own pace. By design the program never deletes
  your files - the only optional deletion is invisible system junk
  (Thumbs.db, .DS_Store) verified by content signature before removal.
  One exe for all UI languages (English / Lithuanian, switchable in-app,
  first run follows the Windows language). Optional portable mode keeps all
  working files next to the exe and leaves no traces on the computer.
  Portable single exe: no installation, no ads, no telemetry, no network access.
