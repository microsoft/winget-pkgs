ShortDescription: Offline live voice interpreter, meeting secretary and language practice in one - through a speakerphone on the table.
Description: |-
  Three in one, running entirely on your own computer.
  Live voice interpreter: two people, two languages, one USB conference
  speakerphone on the table. The program listens, translates and speaks the
  translation aloud in the other language, both ways.
  Meeting secretary: switch off translation and it writes a transcript with
  timestamps plus a complete audio recording (FLAC). It announces aloud that it
  is recording and never summarizes - every word stays the speaker's own.
  Language practice: speak the language you are learning and see at once what
  the speech recognizer understood.
  Conversation and interface languages: Lithuanian, Russian, English, German.
  Lithuanian speech is recognized by Paprika (Kristijonas Jakubsonas); other
  languages by Whisper; translation by OPUS-MT; voices by Piper, including the
  Lithuanian voice Reginute.
  Speech models (about 2.5 GB) are downloaded once on first Prepare, only for
  the chosen languages; after that it works offline. An NVIDIA GPU is used if
  present (3.5 GB video memory for the interpreter, 1.4 GB for the secretary),
  otherwise it falls back to the CPU.
  Not signed with a paid certificate, so Windows SmartScreen may show a warning
  on first run. The SHA-256 of the installer is published with the release.
