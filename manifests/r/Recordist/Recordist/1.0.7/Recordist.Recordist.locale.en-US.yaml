ShortDescription: Meeting recorder that writes up your calls, with no bot in the call.
Description: |-
  Recordist records your own microphone and the call's sound, so nothing joins the participant list, on Zoom, Microsoft Teams, Google Meet, Webex or Slack huddles, whoever hosts. By default a card asks when a call starts, and nothing is recorded until you say yes.
  Every word is transcribed on-device, in dozens of languages, and Recordist never receives your audio. Notes link each decision and action item to the line it came from, Promises keeps what you owe and what you are owed, and the follow-up email arrives drafted for you to send.
  Free records, transcribes and searches every call with no time limit and no account. An open-source MCP server lets Claude, Cursor and any MCP client search your record.
