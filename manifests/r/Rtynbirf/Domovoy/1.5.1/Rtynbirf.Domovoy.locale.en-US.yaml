ShortDescription: Windows tweaker as a state, not an event.
Description: Domovoy is a Windows tweaking module built as a state machine instead of a bag of scripts - every change is an append-only ledger event with a snapshot taken before the change, per-feature undo, a drift sentinel with an opt-in auto-heal contour and honest effect verification probes. Dry-run is the default for every mutating command.
