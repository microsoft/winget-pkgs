# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: Rtynbirf.Domovoy
PackageVersion: 1.5.2
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/rtynbirf/domovoy-tweaker/releases/download/v1.5.2/Domovoy-1.5.2.zip
    InstallerSha256: "f0178b3ec8a8ab0fe19c7eda317fb94b268f003e6e852e1c07c7a43afe2e46aa"
    NestedInstallerType: portable
    NestedInstallerFiles:
      # The portable target is the compiled exe shim shipped inside the zip
      # (packaging/shim/DomovoyShim.cs, built by CI). winget-cli accepts
      # ONLY ".exe" for NestedInstallerType portable
      # (s_AllowedPortableFiletypes in ManifestValidation.cpp) - the earlier
      # Domovoy/domovoy.ps1 target was rejected by the winget-pkgs
      # validation pipeline (verdict 2026-11-03, fixed in v1.5.2).
      - RelativeFilePath: Domovoy/domovoy.exe
        PortableCommandAlias: domovoy
ManifestType: installer
ManifestVersion: 1.12.0
