PackageIdentifier: RCDevs.OpenOTPQuickSign
PackageVersion: 2.0.0.0
PackageLocale: zh-CN
ShortDescription: 适用于 Windows 的 OpenOTP 电子签名插件，支持异步签名请求和常驻签名服务。
Description: |-
  OpenOTP QuickSign 是适用于 Windows 的 OpenOTP 电子签名插件。它可以直接从 Windows 外壳对文档和文件进行签名，并支持 OpenOTP 中提供的全部四种签名类型。签名后的文档会自动从 OpenOTP 服务器取回，原始文件和签名文件保存在同一位置，签名文件名以“signed”作为后缀。
  版本 2 将右键自签名工具转变为完整的签名应用程序。您可以向其他用户异步请求签名，请求有效期最长为 30 天，并在带有“待处理”“已完成”“失败”和“已取消”选项卡的签名窗口中跟踪它们。应用程序常驻托盘，并通过 Windows 通知告知已完成、已拒绝或失败的请求。选择“为自己签名”仍会立即签名。
  计算机范围的 OpenOTPQuickSignService 处理所有 OpenOTP 调用，因此计算机 API 密钥和证书密码仅由该服务读取。管理员为每台计算机配置一次 OpenOTP 连接，而用户保留自己的偏好设置，包括签名文件后缀、签名有效期、通知和历史记录保留。
  OpenOTP SOAP API URL 必须可直接访问或通过反向代理 (WAProxy) 访问。需要已部署的 WebADM 和 OpenOTP 服务器、带有已注册推送令牌的 OpenOTP Token 移动应用程序，以及包含签名功能和签名额度的 OpenOTP 许可证。
