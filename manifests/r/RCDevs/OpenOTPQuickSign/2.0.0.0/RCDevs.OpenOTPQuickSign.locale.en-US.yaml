ReleaseNotes: |-
  This release transforms the application from a simple right-click self-sign tool
      into a full-fledged signature application. Almost everything is new:
      - Request signatures from other users: send an asynchronous signature request
        (valid up to 30 days) and the signed file arrives whenever the signer approves.
        Signing "For Myself" still signs immediately
      - New Signatures window tracking all your requests, with tabs for pending,
        completed, failed and cancelled/declined signatures; failed requests can be
        retried in one click
      - The application now stays resident in the tray: pending requests are tracked
        in the background and Windows notifications announce signed, declined or
        failed requests as they complete
      - New OpenOTPQuickSignService Windows service, installed with the application.
        All OpenOTP calls go through the service: the machine API key and certificate
        password are only ever read by the service, never by user processes
      - The OpenOTP connection is now configured once per computer, by an administrator.
        Users keep their own preferences (signed-file suffix, signature validities,
        notification and history retention settings)
      - Reworked context menu: "OpenOTP QuickSign" opens the main window with the
        selected files; direct self-sign verbs remain for one-click signing
      - Choose the output filepath of the signed file, including overwriting the original
      - Username autocompletion with domain suggestion and a recent-signers list
      - Refreshed visuals throughout: new dialogs, notifications, progress and
        configuration windows
      - Installing the application now requires an administrator consent (the service
        is registered machine-wide by the installation)
      - Requires Windows 10 version 2004 (build 19041) or later
