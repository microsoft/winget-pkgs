ShortDescription: OpenOTP electronic signature plugin for Windows, with asynchronous signature requests and a resident signing service.
Description: |-
  OpenOTP QuickSign is the OpenOTP electronic signature plugin for Windows. It signs documents and files directly from the Windows shell, and supports all four signature types available in OpenOTP. The signed document is retrieved automatically from the OpenOTP servers, and both the original and signed files are kept in the same location with the signed file name suffixed by "signed".
  Version 2 turns the right-click self-sign tool into a full signature application. You can request signatures from other users asynchronously, with requests valid for up to 30 days, and track them in a Signatures window with pending, completed, failed and cancelled tabs. The application stays resident in the tray and announces completed, declined or failed requests through Windows notifications. Signing "For Myself" still signs immediately.
  A machine-wide OpenOTPQuickSignService handles all OpenOTP calls, so the machine API key and certificate password are only ever read by the service. An administrator configures the OpenOTP connection once per computer, while users keep their own preferences for the signed-file suffix, signature validity, notifications and history retention.
  The OpenOTP SOAP API URLs must be reachable directly or through a reverse proxy (WAProxy). Deployed WebADM and OpenOTP servers, the OpenOTP Token mobile application with a registered push token, and an OpenOTP license that includes the signature feature with signature credits are required.
