ReleaseNotes: |-
  - Add pki_client_id_prefix regkey (empty by default) prepended to the resolved client id for smartcard/PKI logins,
      so a distinct WebADM client policy can target them. Applies to the certificate login and, when smartcard_mfa is
      enabled, the follow-up second-factor request. Set it to e.g. "pki_" to enable.
    - Update libfido2 from 1.15.0 to 1.17.0
    - Add experimental support for FIDO2 smartcards on PC/SC readers (contact or NFC, e.g. Token2 Badgeo cards),
      opt-in via the new fido_pcsc regkey (0 by default). When disabled, PC/SC readers are never probed.
      The card must already be on the reader when the FIDO challenge starts.
    - When no FIDO device is present at the start of a FIDO challenge in LogonUI, wait for one (re-enumerating
      periodically) instead of failing immediately, until the user presents a device, cancels, or the challenge
      session expires. Applies to security keys plugged in late.
      Only when FIDO is the only available option : with an alternative (e.g. FIDO or OTP challenge), it still
      fails fast so the alternative is reachable. New ENDPOINT_INFO_WAIT_FIDO_DEVICE customizable string.
    - FIDO keys with built-in user verification (e.g. fingerprint) no longer show a useless PIN field upfront.
      The PIN is now collected when the CTAP error codes report it necessary : PIN-only key with verification
      required (which previously failed even with a PIN), fingerprint blocked after too many mismatches, or a
      wrong PIN typed.
InstallationNotes: A deployed WebADM and OpenOTP server is required. After installation, configure the OpenOTP connection with the installer parameters or the configuration wizard.
