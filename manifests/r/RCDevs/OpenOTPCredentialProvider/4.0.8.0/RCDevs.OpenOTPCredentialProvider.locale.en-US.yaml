ShortDescription: Adds RCDevs OpenOTP multi-factor authentication to the Windows login experience.
Description: |-
  The OpenOTP Credential Provider for Windows integrates RCDevs OpenOTP multi-factor authentication into the Windows login process. It secures local logins, RDP access, smartcard authentication and privileged access prompts, with support for offline MFA, inline enrollment, FIDO2 keys, OTP and centralized policy control. Recent versions also capture event logs for users authenticated with OpenOTP and send them to the WebADM Framework.
  It operates on Windows Server editions with Desktop Experience or Core edition, and on computers joined to an AD domain or in a workgroup. A running WebADM and OpenOTP instance with network access to the OpenOTP web service is required.
