ShortDescription: 将 RCDevs OpenOTP 多因素认证集成到 Windows 登录体验中。
Description: |-
  OpenOTP Credential Provider for Windows 将 RCDevs OpenOTP 多因素认证集成到 Windows 登录过程中。它保护本地登录、RDP 访问、智能卡身份验证和特权访问提示，支持离线 MFA、内联注册、FIDO2 密钥、OTP 和集中策略控制。新版本还会捕获通过 OpenOTP 认证的用户的相关事件日志，并将其发送到 WebADM Framework。
  它可在带有桌面体验或核心版本的 Windows Server 上运行，也适用于加入 AD 域或处于工作组中的计算机。需要正在运行的 WebADM 和 OpenOTP 实例，以及到 OpenOTP Web 服务的网络访问。
Tags:
- fido2
- 二步认证
- 凭据提供程序
- 多因素认证
- 智能卡
InstallationNotes: 需要已部署的 WebADM 和 OpenOTP 服务器。安装后，请使用安装程序参数或配置向导配置 OpenOTP 连接。
