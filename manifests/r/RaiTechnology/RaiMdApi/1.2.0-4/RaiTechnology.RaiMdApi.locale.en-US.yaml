ShortDescription: "Rai market data API: C++, C, Java and .NET client libraries and sample programs for RaiMS, TIBCO RV, NATS and OMM/RSSL."
Description: |-
  Client SDK for the Rai market data API (libraimdapi). Installs the C/C++ headers and import library, raimdapi.dll, the Java bindings (raiapi2.jar, raimsg.jar) with their JNI libraries, the .NET binding (RaiApi2.dll) and the subscribe/publish/ping/replay sample programs in C++, Java and .NET. The API connects to RaiMS, TIBCO Rendezvous, NATS and OMM/RSSL providers. The .NET binding is also available as the RaiApi2 NuGet package.
