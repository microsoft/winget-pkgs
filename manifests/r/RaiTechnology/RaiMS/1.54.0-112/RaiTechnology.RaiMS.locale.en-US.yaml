ShortDescription: "Rai message service: a market data and messaging server speaking TIBCO RV, NATS, Redis and telnet protocols."
Description: |-
  RaiMS (ms_server) is a message service for market data and general publish/subscribe messaging. It bridges and serves TIBCO Rendezvous (7500), NATS (4222), Redis (6379) and a telnet console (2222) over a shared subject namespace, with peer-to-peer mesh transports between servers. The Windows package installs ms_server, ms_gen_key and the raisvc service wrapper, registers the RaiMS Windows service with an evaluation configuration and adds a firewall rule for the RV and NATS ports.
