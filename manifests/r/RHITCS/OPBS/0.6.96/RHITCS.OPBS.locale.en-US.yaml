ShortDescription: Free open-source disk imaging backup for Windows with Macrium image restore
Description: >-
  OPBS (Open Pickle Backup System) is a free, open-source disk imaging backup
  tool for Windows. It backs up entire disks or individual partitions with
  differential chains, AES-256-GCM encryption and zstd compression. It restores
  native .opbs images as well as Macrium Reflect 7/8 (.mrimg) and Reflect X
  (.mrimgx) images, including differential and incremental chains - and
  password-protected Reflect X images open with their passphrase. Features
  include read-only mounts, scheduled restore drills, bit-rot scrubbing with
  XOR parity, immutable repositories and a headless CLI.
