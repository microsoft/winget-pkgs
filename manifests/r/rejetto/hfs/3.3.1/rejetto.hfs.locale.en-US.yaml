ReleaseNotes: "• uploaders can delete their files (opt-out)\r\n• [admin/logs/ips：show number of requests](https://github.com/user-attachments/assets/db179279-9c5c-40db-8d1c-70d53f84bc72)\r\n• admin/internet：support for IP address certificates (no domain)\r\n• admin/logs/options：new \"debug\" toggle\r\n• admin/shared：removed the need to click the Apply button (on large screens)\r\n• [admin/options/frontend：Menu panel position (top or bottom)](https://github.com/user-attachments/assets/e13f8017-0739-40ae-8666-b1c030ab5e18)\r\n• allow user to not leave an unfinished upload (giving a temporary permission – default is 24h)\r\n• admin/options：multiple server_code\r\n• admin/options/networking：new outbound_interface setting #1254\r\n• admin/logs/options：new \"log host\" header setting #1241\r\n• [admin：multifilter for data-tables](https://github.com/user-attachments/assets/bb638691-3107-4046-9802-3a98dc2199b4)\r\n• admin/internet/geo：new \"ignore IP addresses\" setting\r\n• admin/options：divided options in tabs\r\n• admin/shared：see_without_probing for folders [#1259](https://github.com/rejetto/hfs/releases/tag/v3.3.0-beta2)\r\n• admin：faster loading on slow connections\r\n• admin/logs/console：include debug messages (if enabled)\r\n• plugins：exports.disableDefaultStyle\r\n• docker：HFS_INITIAL_ADMIN_PASSWORD\r\n• many bug fixes\r\n\r\n**Full Changelog**：https://github.com/rejetto/hfs/compare/v3.2.2...v3.3.1\r\n\r\ndifference with 3.3.0 is meaningful just to Docker users"
