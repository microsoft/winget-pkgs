ShortDescription: Command-line emulator of classic HP calculators
Description: 'saturnus emulates the HP 48SX, 48GX, 49G, 38G, 39G, 40G, 42S, 27S, 17BII, 17B, 28S and 19BII from their own ROMs. The command line runs a calculator without a window: it presses keys listed in a text file, saves the screen as text or a PNG, serves the serial port and looks up the built-in commands. No ROM is included.'
