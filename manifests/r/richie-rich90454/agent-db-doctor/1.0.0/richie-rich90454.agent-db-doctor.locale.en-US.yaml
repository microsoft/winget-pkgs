ShortDescription: A doctor for AI coding agent databases.
Description: |-
  Diagnoses, compacts, and reclaims the local databases and session stores that AI
  coding agents keep, and recovers what an interrupted write left behind. A
  diagnostic pass reports size, contents, and health without reading the data and
  is measured in milliseconds; reclaiming space takes a safety copy first and
  verifies the result afterwards; every destructive step asks before it acts.
