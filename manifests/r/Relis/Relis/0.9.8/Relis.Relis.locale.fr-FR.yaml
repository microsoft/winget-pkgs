ShortDescription: Correcteur d'orthographe pour Windows qui corrige le texte là où tu l'écris, d'un raccourci clavier.
Description: |-
  Relis corrige tes fautes directement dans ta fenêtre : messagerie, jeu, navigateur, mail ou document. Tu sélectionnes ton texte, Ctrl+Alt+C, c'est corrigé, et ton style reste le tien.
  Ctrl+Alt+X reformule un message en version soignée, et Ctrl+Alt+T le traduit en anglais (offre Illimité).
  Essai gratuit de 50 corrections, sans compte ni carte bancaire, puis abonnement à 2,99 € ou 5,99 € par mois.
