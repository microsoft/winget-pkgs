ShortDescription: A lightweight Windows utility for exchanging .NET RESX translations through XLSX workbooks.
Description: ResX Bridge is a free, open-source Windows utility that simplifies translation collaboration for developers working with .NET RESX resource files. Export resource strings and existing translations to protected, color-coded XLSX workbooks, share them with translators, and safely import completed translations back into your project. Features include automatic resource discovery, multiple resource families, selective language export, import previews, formatting placeholder validation, translation conflict detection, project-specific backups, and automatic rollback. ResX Bridge operates entirely locally and requires no accounts, subscriptions, cloud services, Microsoft Excel installation, or separate .NET runtime installation when using the self-contained release. Designed to complement existing localization tools rather than replace them. Export. Share. Import.
