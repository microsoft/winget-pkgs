PackageLocale: zh-CN
ShortDescription: 一套会计划、派发、审核、打回并汇总交付的多智能体工程工作流。
Description: |-
  大多数 AI 编程工具都是“一个对话框 + 一个智能体”：你看着它一步步工作，出错时只能从头开始，一旦任务变大，就会丢失上下文、责任归属和推进动力。
  JYY-Code 将单次请求升级为有组织的工程化运行：
  - 由协议强制执行，而非靠自觉。规划、调度、报告和评审均由运行时协议强制执行——子智能体只能报告，无法重写计划。拒绝任务时必须说明具体差距，且反馈会自动带入下一次调度。
  - 由状态支撑，而非靠记忆。计划以带版本控制的结构化文件形式持久化，并支持乐观并发写入；会话、快照和布告栏均存储在 SQLite (WAL) 中，因此在重启或切换频道后，运行可以精确恢复。
  - 由团队驱动，而非靠孤胆智能体。一个根智能体编排多达 20 个具有不同角色和模型的并行子智能体，通过共享布告栏进行协作——并在决策点引入结构化的人机交互提问。
  你交付一个单行目标；你得到经过评审、可审计的工程产出。
