ShortDescription: Fast, native Windows 10 / 11 download manager with multi-connection acceleration and HLS/DASH stream capture.
Description: |-
  Radium Download Manager is a lightweight, native C++20 and Win32 download manager for Windows 10 / 11.
  It combines an in-process HTTP/HTTPS segmented download engine with dynamic connection spawning and work-stealing range reuse, BitTorrent and FTP support, an out-of-process HLS/DASH stream pipeline (N_m3u8DL-RE and FFmpeg), and a Manifest V3 browser extension via Native Messaging.
