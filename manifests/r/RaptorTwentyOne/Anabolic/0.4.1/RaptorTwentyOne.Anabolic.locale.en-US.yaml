ShortDescription: Task Manager on steroids. A Windows task manager that stays responsive under load and shows who is doing what, and why.
Description: |-
  Anabolic is a Windows task manager that stays responsive when the machine does not, and answers who is doing this, and why, not only how much.
  An overview of the whole machine; processes as a tree, a list or by app, with quick filters; who ran on each CPU core and which process reads and writes which file on each disk; stutters with frame times and DPC/ISR time per driver; traffic per program with every connection, DNS lookup and development port; Process Monitor style activity recording from a kernel trace; a 7-day history; services, startup programs, per-program rules and game mode; and an optional MCP server for Claude and other AI assistants.
