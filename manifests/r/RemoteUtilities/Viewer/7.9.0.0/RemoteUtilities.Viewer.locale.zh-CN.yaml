ReleaseNotes: |-
  - [Host/Viewer] 终端模式：使用操作系统帐户登录。除了以系统或当前登录用户的身份运行 Shell 之外，现在还可以输入远程计算机上任意 Windows 帐户的用户名和密码，Shell 将在该帐户下运行，并使用该帐户的配置文件和环境。默认禁用；可在 Host 设置中启用（“终端：允许使用操作系统帐户登录”）。Agent 中不可用。
  - [Host/Viewer] 终端模式：Host 现在会报告可用的 Shell（命令提示符、Windows PowerShell，以及已安装时的 PowerShell 7）和用户上下文，Viewer 会根据该列表生成菜单。“当前用户”选项会显示已登录用户的名称。
  - [Host/Viewer] 终端模式：关闭终端窗口现在会停止 Host 上的 Shell（此前 Shell 进程会一直运行，直到重启 Host 服务）。改进了对大量控制台输出和会话关闭的处理。
  - [Host/Viewer] 通过剪贴板在计算机之间复制和粘贴文件。在一端复制文件或文件夹，然后在另一端使用 Ctrl+C / Ctrl+V 粘贴，双向均可，直接在远程会话中完成。适用于 Windows、Linux 和 macOS 版 Remote Utilities 的任意组合；遵循文件传输权限。
  - [Host/Viewer] 剪贴板：在 Linux 或 macOS 的 Host（或 Viewer）上复制的 HTML 内容现在可以在 Windows 上正确粘贴。
  - [Viewer] 从 RU Server 同步的许可证密钥：修复了在某些情况下重启 Viewer 后密钥丢失的问题；密钥被接受后在服务器上更改的许可证选项现在会应用到 Viewer；修复了重复的密钥提示。
  - [Agent] 新增“转换为 Host”按钮，可将便携版 Agent 转换为已安装的 Host，并保留 Internet-ID 和密码。
  - [Viewer] 更新了功能区和停靠面板（Windows 11 外观），更新了连接缩略图和会话窗口标签页；修复了高 DPI 显示器上标签页的缩放问题。
  - [Host] 当 Host 上的会话不再获得授权时，现在会通知 Viewer（供移动版 Viewer 使用）。
  - [Host/Viewer] 修复了希腊语、葡萄牙语和瑞典语的界面语言自动选择问题。
  - [Host/Viewer] 修订了界面文本；更新了翻译。
  - 小幅修复和改进。仍支持 Windows XP。
