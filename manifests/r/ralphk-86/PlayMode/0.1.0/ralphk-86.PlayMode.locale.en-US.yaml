ShortDescription: One switch between your dev setup and your gaming setup on Windows.
Description: |-
  PlayMode is a tray app that closes or freezes the dev and background apps you choose (WSL, Docker, IDEs, sync
  clients, VPNs, indexers) when you sit down to play, and brings back exactly what was running when you're done.
  It shuts WSL down cleanly, disconnects and reconnects Tailscale, asks before closing anything with live work in it,
  and never touches Windows' own processes. Optional service control stops chosen services without a UAC prompt on
  every switch.
