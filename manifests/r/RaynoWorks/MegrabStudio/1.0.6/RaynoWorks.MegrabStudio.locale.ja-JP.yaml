Description: |-
  Megrab Studioは、YouTube、ニコニコ動画、Bilibili、TikTok、Instagram、Xに対応したデスクトップ向け動画ダウンローダーです。
  URLを貼り付けるだけで動画情報を取得し、画質・形式を選んで保存できます。

  字幕の取得、ニコニコ動画のコメント取得、YouTube MusicのURLをアルバムアート・メタデータ付きの音声として保存する機能、複数URLのキュー処理とダウンロード履歴、ログインが必要な動画のためのアプリ内ブラウザーサインイン、Cookieを使用せず履歴にも残さないプライベートモードを備えています。

  基本機能を無料で使えるFreeプランと、全機能が使えるProプラン（月額／年額、30日間無料トライアル・トライアル終了後の自動課金なし）があります。
