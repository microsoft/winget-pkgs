ShortDescription: Video downloader for YouTube, Niconico, Bilibili, TikTok, Instagram and X.
Description: |-
  Megrab Studio is a desktop video downloader for YouTube, Niconico, Bilibili, TikTok, Instagram and X.
  Paste a URL to fetch video information, then choose the quality and format to save.

  Features include subtitle downloads, Niconico comment downloads, saving YouTube Music URLs as audio with album art and metadata embedded automatically, a multi-URL download queue with history, in-app browser sign-in for videos that require an account, and a private mode that uses no cookies and leaves no history.

  A Free plan is available. The Pro plan (monthly or yearly) unlocks the full feature set and includes a 30-day free trial with no automatic charge after the trial.
