ShortDescription: Нативный загрузчик для Windows с GUI и CLI на базе yt-dlp и aria2c
Description: |-
  SNATCH — нативный загрузчик для Windows, которому не нужен терминал: GUI (двойной клик) и CLI.
  YouTube и тысячи других сайтов — через yt-dlp; magnet/torrent и прямые HTTP/FTP-ссылки — через aria2c, с докачкой после обрыва. Загрузчики yt-dlp и aria2c ставятся сами с проверкой контрольных сумм. Один exe: без DLL, Python и Visual C++ Redistributable.
