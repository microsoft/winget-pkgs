ShortDescription: Native Windows downloader with GUI and CLI powered by yt-dlp and aria2c
Description: |-
  SNATCH is a native Windows downloader that needs no terminal: GUI (double-click) and CLI.
  YouTube and thousands of other sites via yt-dlp; magnet/torrents and direct HTTP/FTP links via aria2c, with resume on interruptions. The yt-dlp and aria2c engines install themselves on demand with checksum verification. A single exe: no DLLs, Python or Visual C++ Redistributable required.
