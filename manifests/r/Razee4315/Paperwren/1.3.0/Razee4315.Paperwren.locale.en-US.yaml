ShortDescription: A small, offline viewer for PDF and Office files that can also fill, sign, merge and split PDFs.
Description: |-
  Paperwren opens PDF, Word, Excel, PowerPoint, OpenDocument, RTF, EPUB, Markdown, CSV, text and image files.
  It also fills in and signs PDFs, and merges, splits and organizes them. Each tool saves a new copy.
  Everything happens on the device. The app has no network access, no account and no ads.
