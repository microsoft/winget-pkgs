ShortDescription: A fast, drop-in-compatible reimplementation of `dotnet format`, plus lint, affected, and build tooling.
Description: >-
  dotnet-fast is a native reimplementation of `dotnet format` focused on speed,
  plus a set of additional commands (lint, affected, build, bom, doctor, and
  more) for everyday .NET repository maintenance. It reads the same
  `.editorconfig` rules `dotnet format` does and is designed as a drop-in
  replacement for CI and local development, without requiring a full Roslyn
  build for every check.
