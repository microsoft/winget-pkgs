ShortDescription: A desktop KQL workbench for your Microsoft tenant
Description: |-
  Kustodian is a desktop KQL workbench for Microsoft Graph, Defender advanced hunting and Azure Resource Graph. It fetches
  Graph data and runs real KQL over it locally, showing the requests it will send before it sends them, while hunting and
  Resource Graph queries go straight to their services. Schema-aware completion, parameters, saved queries, charts and
  exports to CSV, JSON or Markdown, in one editor.
