ReleaseNotes: |-
  - 改进：在测试时，步进可跳过所有的 std::函数。
  - 改进：以正确的语法高亮颜色显示以''结尾的行。(https://en.cppreference.com/w/c/language/translation_phases.html)
  - 改进：代码分析器可正确分析以''结尾的行。 (https://en.cppreference.com/w/c/language/translation_phases.html)
  - 改进：撤销/重做时恢复光标和选择的位置.
  - 改进：QSynedit 可正确处理多字符按键输入。
  - 改进：正确展开多行宏。
  - 改进：正确分析指针数组。
  - 改进：选项->编译器->编译器配置集页中，链接选项->错误面板增加"访问未初始化的变量"选项（默认关闭).
  - 改进：创建文件失败时用对话框通知用户. (by C14147@github.com)
  - 改进：大幅优化"以 HTML 格式复制" / "以 HTML 格式导出"处理的速度.
  - 改进：默认配置下，用 Release 编译器配置集编译程序时会加入"-DNDEBUG"参数。
  - 改进：在文件中查找/查找编译器配置集/在项目中查找符号的应用时显示进度条。
  - 改进：可正确分析中的 std::views 定义。
  - 改进：可分析使用结构型实例进行结构化绑定的代码。
  - 改进：在文件中查找对话框中可以对项目文件名进行过滤。
  - 改进：windows 下如果 mingw32-make.exe 在内嵌的 manifest 信息中声明使用 utf8，会在编译项目时生成 utf8 编码的 makefile.
  - 改进：重新设计了初次运行对话框.
  - 改进：代码菜单中增加“重新解析代码”项。
  - 变化：配置->环境->性能对话框中的选项"当编译器隐藏时自动清理符号表”默认改为禁用。
  - 变化：提示列表只有在非空的情况下才会显示，以减少输入时的闪烁。
  - 变化：代码重新排版时不会清除断点和书签。
  - 变化：当鼠标移动到选中的内容上时，变为指针图标。
  - 修正：调用栈面板表格中总是多一个空行。
  - 修正：CPU 信息对话框中，反编译代码的首行内容丢失。
  - 修正：在注释整块内容时保持原有缩进.
  - 修正：在处理含不完整 lambda 式闪退。
  - 修正：当代码分析器正在工作时关闭或切换当前编辑器可能会导致死锁。
  - 修正：在未保存的新文件中无法跳转到定义/声明。
  - 修正：改变当前编辑器的文件类型时，未更新运行菜单中各菜单项的可用状态。
  - 修正：无法处理命令行启动参数中的相对路径。
  - 修正：不能正确补全#include 预处理指令中以''结尾的路径。
  - 修正：用空格替换整块注释时处理不正确。
  - 修正：删除"分析系统头文件"和"分析本地头文件"选项。
  - 修正：无法获取 clang 编译器的版本信息。
  - 修正：无法正确分析嵌套的"using namespace".
  - 修正：对嵌套括号的自动缩进计算错误。
  - 修正：当字符型字面量没有被单引号正确括起时，代码分析器可能导致程序闪退。
  - 修正：导出的 RTF 文件中的字符样式不正确。
  - 修正：对 auto 类型变量的类型推导不正确。
  - 修正：跳转到代码段的开始/结尾不能正常工作。
  - 修正：注释中'{'或'}'时，匹配括号不能正常工作.
  - 修正：CTRL+上/下翻页太慢。
  - 修正：在文件中查找对话框的“在子文件夹中查找”选项不起作用。
  - 修正：双击监视值时不能修改. (github #753)
  - 修正：无法修改监视表达式。
  - 修正：在结构浏览器面板中，被重载的方法会被重复显示。 ( github #755 )
  - 修正：代码分析器不能正确处理继承方法. ( github #755 )
  - 修正：无法选中 CPU 信息对话框中的内容。
  - 修正：无法全选/复制 CPU 信息对话框中的内容。
