ShortDescription: Ditado por voz com IA para Windows usando Whisper e LLMs
Description: |-
  Whisper App é uma ferramenta leve de ditado por voz com IA para Windows.
  Segure um atalho global (ex: Ctrl+Windows), fale e solte — o áudio é
  transcrito via Whisper (offline local ou nuvem), reformatado opcionalmente
  por um LLM (OpenAI, Anthropic, Groq, Gemini, xAI ou OpenRouter) e colado
  automaticamente no aplicativo em foco.

  Recursos:
  - Transcrição local (whisper.cpp, 100% offline) ou na nuvem (OpenAI/Groq)
  - Aceleração por GPU (NVIDIA, AMD, Intel Arc via DXGI)
  - Reformatação por LLM com 6 provedores
  - Adaptação de tom por contexto (detecta o app em foco)
  - Indicador visual flutuante com onda de áudio
  - Dicionário pessoal com rastreamento de frequência de palavras
  - Histórico de ditados pesquisável
  - Atualizações automáticas com assinatura digital
  - Menos de 7 MB de RAM em idle
