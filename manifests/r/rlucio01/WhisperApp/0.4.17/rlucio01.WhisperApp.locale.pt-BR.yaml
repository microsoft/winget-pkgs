ShortDescription: Ditado de voz com inteligencia artificial para Windows usando Whisper e LLMs
Description: |-
  O Whisper App e uma ferramenta leve de ditado por voz alimentada por IA para Windows.
    Pressione um atalho global, fale e solte. O audio e transcrito via Whisper
      (local offline ou nuvem), opcionalmente reformatado por uma LLM (OpenAI,
        Anthropic, Groq, Gemini, xAI ou OpenRouter) e colado automaticamente no
          aplicativo focado. Usa menos de 7 MB de RAM em repouso.
