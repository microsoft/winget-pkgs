ShortDescription: AI-powered voice dictation for Windows using Whisper and LLMs
Description: |-
  Whisper App is a lightweight AI-powered voice dictation tool for Windows.
  Hold a global hotkey (e.g. Ctrl+Windows), speak, and release — audio is
  transcribed via Whisper (local offline or cloud), optionally reformatted by
  an LLM (OpenAI, Anthropic, Groq, Gemini, xAI or OpenRouter), and
  automatically pasted into the focused application.

  Features:
  - Local transcription (whisper.cpp, 100% offline) or cloud (OpenAI/Groq)
  - GPU acceleration support (NVIDIA, AMD, Intel Arc via DXGI)
  - LLM-based text reformatting with 6 provider options
  - Context-aware tone adaptation (detects focused app)
  - Floating audio-wave overlay indicator
  - Personal dictionary with word frequency tracking
  - Searchable dictation history
  - Automatic updates with digital signature
  - Under 7 MB RAM usage at idle
