ReleaseNotes: |-
  该附件二进制文件为预编译供用户提前使用
  版本：v0.2.7
  日期：2026-08-22
  更新：v0.2.6...v0.2.7
  内容：
  1. 重新定义 combo dish 的概念与完整支持
     - 不再由维护者自定义 _setsrc()，而由框架提供核心流程
     - 纠正对多同一文件的多次修改备份
  2. 对内（代码）对外（用户）完全修订术语，统一 "餐厅比喻"
  3. 强化对 user define 的能力检测
  4. 维护者身份称呼变化
  5. 试验性增加 TOML 的部分解析能力
  6. 在 Windows 上 Release Mode 下均会编译图标
  换源方法(recipe):
  1. uv 现在能够对 python-install-mirror 进行换源
  2. 增加对 deb-src.list 的换源
  源：
  1. PyPI: 修复上交源与清华源
