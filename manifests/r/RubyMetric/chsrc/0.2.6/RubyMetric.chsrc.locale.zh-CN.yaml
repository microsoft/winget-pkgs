ReleaseNotes: |-
  该附件二进制文件为预编译供用户提前使用

  版本：`v0.2.6`
  日期：2026-07-25
  更新：https://github.com/RubyMetric/chsrc/compare/v0.2.5...v0.2.6
  内容：

  1. 支持 Windows Arm64 的预编译文件
  2. 支持检测更特殊的 Windows 环境
  3. Windows 上柔性检测 Python 微软商店占位符
  4. 移除 POSIX installer 中的 `awk` 依赖
  5. 强制实施 `user_define` 能力

  换源方法(recipe):
  1. 增加 APT 换源前的 `http(s)` 检测

  源：
  1. 修复 `Alpine` 的测速链接
  2. `Kali` 源: 新增华为源、移除阿里源

