ShortDescription: Lightweight portable Windows WASAPI loopback multi-output audio router.
Description: |-
  AudioSplit captures system audio from the current Windows default playback device via WASAPI loopback and routes it in parallel to multiple selected audio output devices simultaneously (speakers, headphones, HDMI/DisplayPort monitors, Bluetooth devices, etc.) without requiring any virtual audio cable.
  Includes per-device enable/disable, volume control, 0-1000 ms delay adjustment for Bluetooth/HDMI sync, adaptive clock-drift compensation, hot-plug device detection, and a system tray icon.
