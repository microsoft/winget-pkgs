ReleaseNotes: |-
  Agents can switch on event-driven automations
  An agent can now request event-driven workflows such as PR review and release pipelines, and you approve them with one click in chat. The CLI can turn on any workflow's triggers, and GitHub review tools handle large pull requests. These changes build on version 1.8.7. This release drops a database column the previous release still uses, so rolling back below 1.8.8 is not supported.
  Approve an agent's event-driven automation in chat
  create_trigger_activation no longer refuses a workflow whose tools are pinned to each event's repository or whose agent has unrestricted tools. The approval card says which repositories an event can target (for example, any repository in the activation's repos input) and says when an agent's tools are unrestricted. An event input that nothing bounds still cannot choose a workflow, preset or tool, and targets derived from it are shown as dynamic.
  Turn on a workflow's triggers from the CLI
  reliant trigger activate enables every trigger a workflow declares, or the ones you name, with the same choices as the app's Enable dialog: project, machine, inputs, connections and acting identity. reliant trigger deactivate pauses them. trigger list and trigger get now show each trigger's health.
  Review large pull requests through GitHub
  The pull request file list can omit diffs and filter by path, so a pull request with hundreds of files fits in one response. Reading a file through GitHub now allows files up to 64 KB, the same as reading a local file.
  Clearer automation refusals and validation
  When an agent's activation request is refused, it says why. GitHub-triggered activations are validated on the worker. Workflow validation reports changes that would break an existing activation.
  Background work keeps its machine awake
  A run that is held, for example waiting on a usage limit, keeps its machine awake while its background work runs. Older sibling threads of a chat now load, and an empty main thread pages correctly.
  Planned daemon restart drain removed
  The unused planned-restart drain is gone, along with the daemons.restart_status column. This migration breaks rollback: v1.8.5 through v1.8.7 read that column, so do not roll back below v1.8.8 without rolling forward again.
