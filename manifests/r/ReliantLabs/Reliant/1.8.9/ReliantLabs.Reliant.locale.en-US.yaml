ReleaseNotes: |-
  Workflows stay with their machine
  Synced workflows and presets are kept separately for each machine, and event-driven runs resolve their workflow on the target machine. Recovery and GitHub automation fixes make existing conversations and triggers more reliable.
  Keep each machine's workflows and presets
  Syncing one machine no longer replaces another machine's workflow and preset catalog. Triggers resolve their workflow on the machine they target.
  Recover workflows in the configured namespace
  Reset-and-replay recovery uses the configured Temporal namespace rather than assuming the default.
  Let issue-write GitHub automations update pull requests
  A bot with issue-write permission can label or comment on a pull request, matching GitHub's issue API permissions.
