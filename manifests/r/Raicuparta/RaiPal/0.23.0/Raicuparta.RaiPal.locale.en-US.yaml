ReleaseNotes: |-
  - New UI that makes things more compact but maybe you hate it!
  - Usability improvements for Steam Deck.
  - Some Wine fixes for Linux, especially on NixOS.
  - Fixed command line mods like Chihuahua not launching (sorry).
  - Native Linux games can now run BepInEx mods without needing any manual Steam launch options.
  - Support filtering non-installed Steam games by operating system. The OS filter is now split into executable OS and supported OS.
  - Now detecting Godot engine version for native Linux games.
  - Adding Rai Pal to Steam now adds artwork too.
  - Fix app failing to restart after an update on the AppImage Linux build.
  - Fix native Linux games sometimes failing to launch.
  - Fix selected game's mods not refreshing when changed in another tab.
  - Fix games being sorted case-sensitively.
