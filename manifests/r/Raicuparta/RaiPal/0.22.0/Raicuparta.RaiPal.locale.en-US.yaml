ReleaseNotes: |-
  - New rai-pal:// deep link protocol. Can be used to trigger mod install, uninstall, or run. Can also be used to share custom mod databases.
  - Support scanning entire folders for game exes. Can be slow though, so be careful!
  - Initial support for BepInEx mods in native Linux games (requires adding a custom launch param on Steam though, not done yet).
  - Manually-added games can now run on Linux using Wine if you have that installed in the system or via flatpak.
  - All new Rai Pal releases are now automatically pushed to WinGet. You can install Rai Pal via WinGet with winget install Raicuparta.RaiPal.
  - Now detecting GameMaker engine version for installed games.
  - Fix native Linux games failing to launch from the "Run Game Executable" button.
  - Better handling of systems with multiple Steam installations, or leftover Steam folders from old installations.
  - Add new filter for finding games compatible with specific mods (like finding all games compatible with UUVR).
  - Add filter for game operating system (Windows/Linux).
  - Filters can now be locked, so if you always have certain filters off you can lock them and the reset buttons won't affect them anymore.
  - Make it a bit easier to tell manually added games apart by showing folder names when needed.
  - Improvements to mod install progress indicators.
  - Improved Unreal Engine version detection.
  - Stop showing errors when checking for updates fails (seems to fail a lot randomly).
  - Generally reduce vague error notifications.
  - Better handling of a failed mod download and/or install. Will also retry installs in case it's a network blip.
  - Automatically retry mod downloads once when they fail, before actually considering that an error.
  - Fix mods that run via terminal (like Chihuahua) being invisible when running on Linux via Wine.
  - Fix some Unreal games missing architecture information (64 vs 32 bit).
  Download for Windows
  Download for Linux
