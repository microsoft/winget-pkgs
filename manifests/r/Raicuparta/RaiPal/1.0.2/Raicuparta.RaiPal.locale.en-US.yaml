ReleaseNotes: |-
  1.0.2:
  
  - Fix mods not being able to read Rai Pal authentication state (Discord login).
  - Fix some button clicks not registering when click starts on an unfocused window.
  - Fix filter reset button showing when there's nothing to reset.
  - Fix stale mod filter (mod filter checkboxes not always representing current mod database).
  - Reduce some of the log spam for easier debugging.
  - Small layout fixes.
  
  1.0.1:
  
  - Fix Epic games not being found with the new Windows Epic Games Launcher.
  - Fix unclear filters state when a game provider is uninstalled.
  
  1.0.0:
  
  - UI has been rebuilt from scratch with different tech. It's a lot faster, and uses way less RAM than before (we all need it).
  - Lots of general UI changes, hopefully mostly for the better.
  - New portable version for Windows. Doesn't require admin privileges, no installer, and all files managed by Rai Pal (like mods) are in the RaiPalData folder next to the Rai Pal exe.
  - Preparations for native MacOS support (there's a build you can test but doesn't do much yet).
