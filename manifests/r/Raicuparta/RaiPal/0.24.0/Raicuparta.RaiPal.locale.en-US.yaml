ReleaseNotes: |-
  - Added light mode (defaults to following your system theme).
  - Improved how mods are displayed and grouped, since the mod list keeps growing.
  - Added links to mod websites on the mods tab.
  - Added reinstall button for installed mods, nice for mod devs.
  - The "Uninstall all mods" button now cleans up a bit more trash left behind by the mods.
  - Linux: Added support for Amazon Games installed through Heroic.
  - Linux: Heroic games now show their release dates.
  - Refreshing the selected game now also refreshes its mods.
  - Selected game now auto-refreshes when focusing the Rai Pal window.
  - Improved clarity of pretty much every error message.
  - Add store page link to Epic games from Heroic.
  - Fixed Heroic game Wine prefix handling.
  - Fixed some Steam games missing their thumbnail.
  - Fixed executable detection for some Unreal Engine games.
