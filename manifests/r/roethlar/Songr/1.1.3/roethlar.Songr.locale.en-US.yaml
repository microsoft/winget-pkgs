# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
#
# Publisher deliberately does NOT match the Authenticode subject
# ("CN=Michael Coelho"). It matches the ARP Publisher value Windows displays
# and the publisher segment of PackageIdentifier, which is the pair winget's
# own consistency checks compare.

PackageIdentifier: roethlar.Songr
PackageVersion: "1.1.3"
PackageLocale: en-US
Publisher: roethlar
PublisherUrl: https://github.com/roethlar
PublisherSupportUrl: https://github.com/roethlar/songr/issues
PackageName: Songr
PackageUrl: https://github.com/roethlar/songr
License: MIT
LicenseUrl: https://github.com/roethlar/songr/blob/main/LICENSE
ShortDescription: Controller for a Roon music library
Description: |-
  Songr is a desktop and web controller for a Roon Core. It finds the Core on the
  local network and gives you browsing, search, playback controls and zone
  selection, either as a native desktop app or from any browser on the network.
Moniker: songr
Tags:
- audio
- controller
- music
- roon
- streaming
ReleaseNotesUrl: https://github.com/roethlar/songr/releases/tag/v1.1.3
ManifestType: defaultLocale
ManifestVersion: 1.12.0
