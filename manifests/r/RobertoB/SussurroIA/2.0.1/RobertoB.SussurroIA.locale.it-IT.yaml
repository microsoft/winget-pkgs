ShortDescription: Dettatura vocale per Windows che scrive nel campo in cui stavi gia' lavorando.
Description: |-
  Sussurro IA e' un programma di dettatura vocale per Windows. Tieni premuta una scorciatoia globale, parli, rilasci, e il testo trascritto viene inserito nel campo che aveva il fuoco: la mail che stavi scrivendo, la casella di ricerca, il terminale, il commento in un'altra applicazione. Non c'e' nessun blocco note da cui copiare.
  Una seconda scorciatoia consegna la stessa dettatura tradotta in inglese, spagnolo o tedesco, oppure riscritta come richiesta ben posta da dare a un modello linguistico.
  La stessa scorciatoia puo' anche salvare la dettatura come note invece di scriverla: vengono ordinate per titolo, categoria e scadenza, restano sul computer e le notifiche di Windows ricordano quando scadono. Se vuoi, le note possono partire verso un indirizzo HTTPS scelto da te; di default e' spento.
  Si detta in italiano. La trascrizione avviene nel cloud, con una chiave API tua per Groq o per qualunque endpoint compatibile con OpenAI, oppure sul tuo computer, con il motore whisper.cpp integrato e un modello che scegli di scaricare: in quel caso l'audio non esce dal computer. Traduzione, modo prompt, perfezionamento e riordino delle note mandano a Groq il testo trascritto, non l'audio. A chi ha realizzato il programma non arriva niente: nessuna telemetria, nessuna statistica d'uso, nessun controllo degli aggiornamenti.
  Alcune parole dette diventano quello che rappresentano: «a capo» manda a capo, «nuovo paragrafo» stacca, «emoji sorriso» inserisce un'emoji. Un dizionario personale aiuta con nomi e termini tecnici.
  E' una versione beta, gratuita e non open source. Non e' firmata con un certificato di code signing, quindi al primo avvio Windows SmartScreen mostra un avviso.
