ShortDescription: Claude 5-hour and weekly usage limits as a compact widget in the Windows taskbar.
Description: |-
  An unofficial taskbar widget for Claude subscribers; it is not affiliated with Anthropic. It docks into
  the Windows taskbar next to the tray icons and shows the 5-hour session and weekly usage limits as bars
  with percentages, hour/day ticks, a marker for the current time in each window, and how long until each
  limit renews plus the time it renews. Every element can be toggled from the right-click menu. It uses the existing
  sign-in of Claude Code on the same PC to query Anthropic's usage API, so no separate login or API key is
  needed. It follows the light/dark taskbar theme and display scaling, and uses about 3 MB of memory.
