ShortDescription: Claude 5-hour and weekly usage limits as a compact widget in the Windows taskbar.
Description: |-
  A small widget docked into the Windows taskbar, next to the tray icons, that shows your Claude
  rate limits: the 5-hour session and weekly bars with percentages, hour/day ticks, a marker for the
  current time in each window, and the time until each reset plus when it happens. Every element can
  be toggled from the right-click menu. It reads the login Claude Code stores locally, follows the
  light/dark taskbar theme and display scaling, and uses about 3 MB of memory.
