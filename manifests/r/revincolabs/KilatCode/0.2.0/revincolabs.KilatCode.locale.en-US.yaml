ShortDescription: Lightweight desktop app that runs the real Claude Code and Codex terminals side by side, with many accounts.
Description: |-
  Kilat Code runs the real Claude Code and Codex (ChatGPT) terminal UIs side by side in one window.
  Keep several Claude, ChatGPT and GitHub accounts signed in and switch between them without logging in again.
  When an account hits its usage limit, wait for the reset and continue automatically, or move the conversation to another Claude or ChatGPT account without losing context.
  Requires Git and the Claude Code CLI and/or the Codex CLI with your own subscription or API key.
  Kilat Code is an independent project, not affiliated with Anthropic or OpenAI.
