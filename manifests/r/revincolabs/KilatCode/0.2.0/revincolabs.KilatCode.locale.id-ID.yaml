Publisher: revincolabs
PackageName: Kilat Code
PackageUrl: https://kilat-code.vercel.app
License: Gratis
ShortDescription: Aplikasi desktop ringan untuk menjalankan terminal Claude Code dan Codex asli berdampingan, dengan banyak akun.
Description: |-
  Kilat Code menjalankan terminal Claude Code dan Codex (ChatGPT) yang asli, berdampingan dalam satu jendela.
  Simpan banyak akun Claude, ChatGPT, dan GitHub, lalu ganti akun tanpa login ulang.
  Saat akun kena limit, tunggu sampai reset lalu lanjut otomatis, atau pindahkan percakapan ke akun Claude atau ChatGPT lain tanpa kehilangan konteks.
  Butuh Git dan Claude Code CLI dan/atau Codex CLI dengan langganan atau API key sendiri.
  Kilat Code adalah proyek independen, tidak berafiliasi dengan Anthropic maupun OpenAI.
