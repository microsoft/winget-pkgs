ShortDescription: Measure how often AI-generated answers cite your website, from the command line.
Description: |-
  AI Citation Monitor is a Go-based command-line tool for measuring GEO (Generative Engine Optimization) and AEO (Answer Engine Optimization) outcomes. It runs a versioned set of questions against search-enabled AI APIs, stores citation evidence in SQLite, and reports visibility, competitor comparisons, and changes over time.

  Key features:
  - Citation tracking from provider response metadata instead of URLs guessed from answer text.
  - Brand and question visibility through brand mentions, per-question citation rates, and question coverage.
  - Competitor comparison measured under the same test conditions.
  - Historical trends compared across periods in daily, weekly, or monthly buckets.
  - Reproducibility through recorded question versions, model and API conditions, timestamps, and answer hashes, with optional retention of raw responses.
  - Provider integrations for OpenAI, Google Gemini, Anthropic Claude, Perplexity, and xAI Grok.
  - Local-first storage in SQLite with no hosted backend, machine-readable JSON output, stable exit codes, and CSV, JSON, and JSONL exports.

  The reported rates are sample-based observations of the configured questions, providers, models, stages, and runs. They do not represent every user's experience of AI search.
