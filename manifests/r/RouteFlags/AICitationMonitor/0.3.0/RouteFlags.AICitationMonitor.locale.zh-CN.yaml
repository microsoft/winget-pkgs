PackageIdentifier: RouteFlags.AICitationMonitor
PackageVersion: 0.3.0
PackageLocale: zh-CN
ShortDescription: 在命令行中测量 AI 生成的回答引用本站的频率。
Description: |-
  AI Citation Monitor 是一款基于 Go 的命令行工具，用于衡量 GEO（生成式引擎优化）与 AEO（答案引擎优化）的成效。它按版本化的一组问题调用具备搜索能力的 AI 接口，将引用证据保存在 SQLite 中，并输出可见度、竞品对比以及随时间变化的趋势。

  主要特性：
  - 引用追踪取自 AI 接口的响应元数据，而不是从回答文本中猜测出的链接。
  - 通过品牌提及率、各问题引用率与问题覆盖率衡量品牌与问题的可见度。
  - 在相同的测试条件下对比竞争对手域名。
  - 按日、周、月分桶对比各时间段的趋势。
  - 记录问题版本、模型与接口条件、时间戳和回答哈希，并可选保留原始响应，以保证结果可复现。
  - 支持 OpenAI、Google Gemini、Anthropic Claude、Perplexity 与 xAI Grok 等接口。
  - 以本地 SQLite 为主，无需托管后端，提供机器可读的 JSON 输出、稳定的退出码，并支持导出 CSV、JSON 与 JSONL。

  统计结果只反映所配置的问题、接口、模型、阶段与运行批次的抽样观察，并不代表所有用户看到的 AI 搜索排名。
