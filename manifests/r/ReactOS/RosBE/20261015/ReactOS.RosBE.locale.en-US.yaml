ReleaseNotes: |-
  ## RosBE v20261015

  ### Managed toolchain versions
  | Component | Version |
  |-----------|---------|
  | LLVM-MinGW | 20261007 |
  | LLVM-MinGW RISC-V (llvm-mingw-riscv24, not on PATH) | 20261007 (sjljeh/llvm-project@e2711a322f41) |
  | LLVM (llvm, every LiberNT Clang target, not on PATH) | 20261015 (sjljeh/llvm-project@720de9689193, AArch64,ARM,PowerPC,RISCV,X86) |
  | MinGW-GCC (ct-ng Canadian-cross) | 16.2.0 (v16.2 from ahmedarif193/mingw-gcc16.2) |
  | CMake | 3.31.6 |
  | Ninja | 1.12.1 |
  | WinFlexBison | 2.5.25 |
  | QEMU (Windows bundle) | 11.1.0 (20260811 build from qemu.weilnetz.de) |

  ### Install
  ```
  winget install ReactOS.RosBE
  rosbe install
  rosbe enable
  ```

