ReleaseNotes: |-
  What's new in v1.5.6
  🚀 New
  - Project Doctor now checks Android setups: projects with an Android export preset or Gradle build template get checks for the Android SDK (platform tools, build tools, command-line tools), the Java JDK version, the debug keystore, release keystores and the Android build template. Projects that only look mobile (Mobile renderer, ETC2/ASTC textures, screen orientation, touch emulation) get the same checks as notes, since many desktop games use the Mobile renderer too
  - Tests and lint in Build & Export: run GUT or gdUnit4 tests headless, gdlint, or a gdformat check with one click. Output streams to the built-in console, and Stop ends the run
  - New Addons window in the project menu lists every addon in res://addons with its version, author and whether it is enabled, and checks the Godot Asset Library for newer versions. Addons installed through GodotHub are matched exactly; others are matched by name. Updating moves the old addon folder to the Trash and restores it if the update fails
  - Windows: right-click GodotHub in the taskbar to open recent projects from the Jump List. macOS: right-click the Dock icon for the same list
  🐛 Fixes
  - Choosing a project under Open Recent in the tray menu now opens it. Before, nothing happened
  - Templates in your template scan folder now sync automatically at startup, when files in that folder change, and after pulling a cloud sync. Before, they only synced when you pressed Sync
  - Project sizes no longer stay out of date after files deep inside a project change
  - Project icons now update when you replace the icon file itself
  - The splash screen loading bar no longer flickers rapidly when Reduce Motion is on
  - The onboarding intro animation no longer keeps running in the background after you leave it
  - Fixed window and Discord status listeners that could be left behind after their part of the app closed
  ✨ Improvements
  - Faster startup: only the language you use is loaded, and rarely used dialogs load when first needed. The startup code is about half its previous size
  - The app stays smooth while Godot versions download. Download progress no longer redraws every page
  - Asset Library downloads send progress updates far less often and write to disk faster
  - Godot and export template downloads and installs use buffered disk access
  - Network requests share one connection pool and use compression, so GitHub and other online lookups respond faster
  - The Templates and Vault pages load their lists without briefly freezing the window
  - Project cards, the versions list and running-project timers redraw less often, which makes hovering and scrolling lighter
  - Status dot pulses, card entrance animations and tooltips use less GPU and CPU while looking the same
  - Background checks (git auto-fetch, console and export updates) pause while the window is hidden, and news and contributors are cached instead of fetched on every visit
  - Smaller and faster release builds
