  What's new in v1.3.6
  🚀 New
  - Changelog badge with shine animation on sidebar when new entries are added
  - Category pills on project cards showing the assigned category with a colored dot
  - Category filter dropdown in the Projects toolbar to filter by category
  - Click category pill on project card to change its category from a dropdown
  - Time tracking for individual projects
  - Dashboard view for you and your projects
  - Export and import time tracking data
  - PR by Spy-B: Continue adding the Arabic translation
  - PR by Edugamen: Start localizing the Spanish Language
  - Discord RPC support
  🐛 Fixes
  - Fixed several edge cases in the Git authentication flow
  - Portable .exe installs now show a clear 'manual update required' screen with a link to the latest GitHub release instead of failing silently
  ✨ Improvements
  - Default project sort changed to Recent instead of Categories
  - Re-did Git from scratch with a new sidebar that slides in from the right instead of an overlay
  - New UI: revamped titlebar with language menu, running projects chip and task tray
  - New UI: project cards revamp plus a new non-card layout
  - New UI: Settings view refactored to be more UX friendly
  - Major performance and code-quality refactor across the Rust backend
  - README: star history and supported languages sections, plus a new Contributing.md
  - Modals design unified across the app with a new header and footer design
  - New UI is now set as the default, with an option to switch back to the old UI in Settings → Appearance
  - New UI: Add Asset Store
  - New UI: Add Templates view
  - New UI: Add Godot News
  - New UI: Add Settings, Changelog and Updates from Dev view
  - Add Project Icon Scan Depth setting
