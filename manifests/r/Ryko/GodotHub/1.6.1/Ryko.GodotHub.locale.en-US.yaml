ReleaseNotes: |-
  What's new in v1.6.1
  New
  - Onyx integration: turn it on in Settings > Integrations, then send a finished export to Onyx with "Upload to Steam with Onyx" in the Build & Export window. Needs an up-to-date Onyx on Windows or Linux; Settings links to the download if it's missing or out of date
  Fixes
  - Linux: the whole window responds to clicks again. Clicks along the bottom and right edges, including the minimize, maximize and close buttons, no longer go through to the window behind GodotHub (#352)
  - Linux: the window no longer gets a little bigger every time GodotHub starts (#352)
  - Linux: the window can be resized again by dragging its edges and corners (#352)
  - Linux: resizing didnt persist, now it does (#352)
  - Linux: on Wayland, when GodotHub can't set up its graphics it now restarts itself through X11, and if that doesn't work it says what went wrong and what to try, instead of leaving a black window that can't be closed (#371)
  Improvements
  - Git sidebar: a commit message you've typed but not committed is kept when you close and reopen the sidebar, until GodotHub is restarted
  Known issues
  - Linux: When launching GodotHub, App itself may take a second to appear due to the workaround on fixing resize issue.
