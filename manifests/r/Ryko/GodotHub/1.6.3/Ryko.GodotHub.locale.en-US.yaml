  Window size or position not saved on Linux?
  On some Linux distros, GodotHub may not remember its window size and position after you close it, and the window can open at the wrong size or place. This comes from Flutter itself, not GodotHub. It can only be worked around inside GodotHub, and those workarounds could cause new window bugs for others, so GodotHub leaves it as it is for now.
  Requirements: Windows 10 or 11 (x64), macOS 12 or newer, or a 64-bit Linux desktop with GTK 3 and OpenGL ES. Need the last version for older systems? GodotHub 1.5.9 stays available.
