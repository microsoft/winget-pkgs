ReleaseNotes: |-
  What's new in v1.6.2
  New
  - Settings > Credits: hover "Built with" to see which Flutter and Rust versions your copy of GodotHub was built with
  Fixes
  - Linux: GodotHub no longer draws its whole window shifted left and down by about half its size on some systems, such as Fedora with Hyprland. The 1.6.1 packages were built with an older Flutter that caused it, so releases are now built with Flutter 3.50.1 (#377)
  Known issues
  - Linux: When launching GodotHub, App itself may take a second to appear due to the workaround on fixing resize issue.
