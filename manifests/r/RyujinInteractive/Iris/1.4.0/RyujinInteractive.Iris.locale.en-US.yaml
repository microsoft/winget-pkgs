ShortDescription: A video player and media center for Windows, powered by mpv.
Description: |-
  Iris is a video player and media center for Windows. It keeps your video folders as a library you can browse,
  search and sort into collections, and plays almost any format through mpv.
  It remembers where you stopped, can skip intros and silence, shows a preview when you hover the seek bar,
  and connects to Jellyfin and Stash servers.
