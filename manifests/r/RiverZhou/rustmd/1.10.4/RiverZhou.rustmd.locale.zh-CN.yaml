ShortDescription: 本地优先的 Markdown / HTML / CSV / TXT / JSON 笔记应用。
Description: |-
  rustmd 是一个本地优先的 Markdown / HTML / CSV / TXT / JSON 笔记应用。

  笔记就是普通文件夹里的文件：不需要导入、没有数据库、不用登录。直接编辑 HTML 源码，
  即可在应用内置 WebView 中预览整页效果（页面样式、脚本、本地资源和图表原生执行，
  无需外部浏览器）。Markdown 支持 MathJax、Mermaid 和代码高亮；CSV/TXT 有智能表格；
  JSON 有可折叠检查器。支持 HTML/PNG/PDF 导出、UTF-8/GBK/GB18030 自动解码、文件夹树、
  全文搜索、最近笔记库、置顶笔记库和多库同开。Rust + Tauri 2，GPL-3.0-or-later，
  中文 / English 界面。
