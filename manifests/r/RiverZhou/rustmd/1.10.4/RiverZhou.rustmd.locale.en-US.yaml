ShortDescription: Local-first Markdown, HTML, CSV, TXT and JSON notes for Windows, macOS and Linux.
Description: |-
  rustmd is a local-first notes app for Markdown, HTML, CSV, TXT and JSON.

  Notes are plain files in a folder you own: no import step, no database and no account.
  Edit HTML source and preview the fully rendered page in the app's built-in WebView
  (styles, scripts, local assets and charts run natively; no external browser required).
  Markdown supports MathJax, Mermaid and syntax highlighting; CSV/TXT get smart tables;
  JSON gets a collapsible inspector. HTML/PNG/PDF export, UTF-8/GBK/GB18030 decoding,
  folder tree, full-text search, recent and pinned vaults, multi-vault view.
  Built with Rust + Tauri 2, GPL-3.0-or-later, English and Simplified Chinese UI.
