ShortDescription: Free data recovery tool - undelete files, recover formatted drives and lost partitions, and repair damaged files.
Description: |-
  Recovery Advanced Free (RAF) is a free, open-source data recovery program with a Hebrew and English interface.
  It reads drives directly and read-only, and recovers deleted files from NTFS, ReFS, exFAT, FAT, ext2/3/4, XFS, btrfs, HFS+ and APFS,
  finds lost and deleted partitions, carves files by signature after formatting, opens disk images (VHD, VHDX, VMDK, E01), BitLocker drives and RAID arrays,
  and repairs damaged photos, videos, Office documents, PDF, ZIP, WAV and SQLite files.
