ShortDescription: A personal anime library manager for watching and tracking your collection in real time. Lightweight, powerful, and paws-itively fast. No waiting required!
Description: |-
  A pure JS BitTorrent streaming environment, with a built-in list manager.
  Imagine qBit + Taiga + MPV, all in a single package, but streamed real-time.
  Completely ad free with no tracking/data collection.
  Unlike qBit's sequential approach, seeking into data that hasn't been downloaded yet will prioritise downloading that data, instead of simply closing MPV.
Tags:
- anime
- streaming
- torrent
ReleaseNotes: |-
  - feat(manager): rework torrent page and card design
    - Improves torrent searching.
    - Adds sorting by name, size, progress, status, ratio, down/up speed, seeders, leechers, and eta.
    - By default, torrents are sorted by status + newest.
    - Adds filtering by status.
    - Improves performance of the manager page when you have many torrents.
    - Adds disk space visual.
  - feat(navigation): support alt+arrow and browser back/forward keys
  - feat(android): add media session controls and improve PiP handling
  - feat(android): setting to disable auto-fullscreen
  - feat(player): hold-to-speed-up playback (#180)
  - feat(electron): right-click context menu (#32)
  - feat(ui): native toast system
  - perf(ui): reduce renderer work
  - perf(client): show torrent status changes instantly
  - perf(subtitles): improve initial video load times
  - refactor(player): modularize player features
    - Fixed PiP cleanup and error handling
    - Missing aniskip chapters
  - fix(scrollbar): offset tracks near titlebar to avoid window controls
  - fix(theme): persist and apply custom CSS on startup (#178)
  - fix(cache): remove stale episode/range and season when updating
  - fix(results): ignore case when comparing hashes
  - fix(fetch): await mappings rate limit
  - fix(subtitles): support embedded fonts on older WebViews
  - fix(sections): hide dubs between unscheduled releases
  - fix(sections): hide subs between unscheduled releases
  - fix(ui): base font size
  - fix(mappings): fallback to mal ids for lookup
  - fix(navigation): prevent More button flicker
  - fix(notifications): skip unreleased episodes
  - fix(notifications): remove button requirement
  - fix(notifications): correct episode sort order
  - fix(extensions): make extension updates more reliable
    - Downloads and saves updated extension code before switching to a new version.
    - Keeps extension lists up to date when authors add or remove extensions.
  - fix(subtitles): handle metadata errors
  - fix(manager): sort completed by ratio and use cachedAt
  - fix(episode): preview stuck open after clicking behind prompt
  - fix(player): duplicate track name breaking subtitle selection
    - Improves track naming.
    - Fixes nested dropdowns breaking when duplicate keys are present.
    - Fixes subtitle cycling via keybind not saving the last selected subtitle to cache.
  - fix(player): track volume boost state with scroll wheel
  - fix(player): screenshot causing subtitles to jump
  - fix(player): prevent resume progress regression
  - fix(player): ignore stale media events after untracking
  - fix(player): skip track reselect when already active
  - fix(player): missing spacebar keybind icon
  - fix(player): clear stale error toasts
  - fix(client): improve ratio accuracy
    - Changes ratio to be based on the amount downloaded.
    - Ratio is now cached and restored between sessions.
  - fix(client): properly recover after crash
  - fix(client): guard against corrupted/empty torrent cache writes
  - fix(client): missing availability warning
  - fix(client): persist webtorrent tmp dir under Flatpak
  - fix(webtorrent): sanitize invalid characters in download paths
  - fix(webtorrent): update settings typo
  - fix(search): scrolling randomly getting stuck from background loads
  - fix(search): Japanese audio matching against English dub
    - Fixes incorrectly detecting Japanese dubs as English dubs in the search results, e.g. Tomb Raider King.
  - fix(resolver): add sanity check to episode ranges
  - fix(resolver): more series
  - fix(android): gyp config causing napi_get_cb_info dlopen failure
  - fix(android): missing utp-native
  - fix(android): modal safe area
  - fix(android): false reloads from tapping notifications
  - fix(electron): write EPIPE crash
  - fix(electron): missing tray icon on Flatpak
  - fix(electron): improve restoring window state
  - fix(electron): prompt manual update for Windows portable
  - fix(electron): skip torrent destroy wait if process was never started
  - fix(electron): flush pending cache writes before shutdown
  - chore(anilist): refine rate limiting and status handling
    - Reduces chances of hitting the rate limit and reduces errors from bursting
  - chore(ui): always show preview cards in viewport
  - chore(ui): general visual improvements
  - chore(ui): improve text selection
  - chore(ui): improve safe area
  - chore(client): remove unsupported secure override on Android
  - chore(player): disable instead of hiding last/next buttons
  - chore(android): bump to capacitor v8.5.2
  - chore(status): better outage info
  - chore(migrate): jikan to tenrai
  - chore(deps): bump to electron v42.11.0
    - Adds MPEG-2 codec support
  - chore(deps): drop unused
  - chore(deps): update
