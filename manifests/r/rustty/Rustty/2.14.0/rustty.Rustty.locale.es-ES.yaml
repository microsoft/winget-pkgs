ReleaseNotes: |-
  Cambiado
  - Los ficheros que importas o exportas los eliges tú, y solo esos. Temas, conexiones, runbooks, atajos, diagnósticos, instantáneas del monitor, historiales, bloques de comando, backups cifrados, la imagen de fondo del terminal, el ~/.ssh/config y los ficheros de mRemoteNG y Ásbrú pasan por el diálogo de ficheros del sistema como siempre, pero ahora ese diálogo lo abre el núcleo de la aplicación y no la interfaz. Lo que recibe la interfaz es la ruta y un permiso que vale para una sola operación —leer o escribir, no las dos— sobre ese fichero y durante quince minutos; si un enlace de la ruta se cambia después de elegirla para apuntar a otro sitio, la operación se rechaza. Hasta ahora bastaba que algo llegara a ejecutar código dentro de la interfaz para leer tus claves de ~/.ssh o reescribir cualquier fichero de tu usuario; ahora no puede tocar nada que no hayas elegido tú. No cambia nada de lo que ves: el mismo diálogo, los mismos pasos.
  - Los Include de ~/.ssh/config se leen solo dentro de ~/.ssh. Al importar tu configuración de OpenSSH, los ficheros incluidos se siguen leyendo solos si están en ~/.ssh (o en el ssh del sistema), y nunca si contienen una clave privada; un Include que apunte fuera aparece en la lista de lo que no se ha podido importar.
  - Los comandos locales se autorizan una vez en cada equipo. La primera vez que ejecutas un comando de tipo shell en un equipo, y cada vez que cambias su texto, aparece un diálogo del sistema con la orden completa: «Autorizar y ejecutar» lo recuerda en ese equipo y «Cancelar» no ejecuta nada. Los que ya tenías preguntan una vez tras actualizar. Es independiente de «Pedir confirmación», que sigue preguntando en cada ejecución si lo tienes activo. Hasta ahora la interfaz podía mandar a ejecutar cualquier orden; ahora solo puede pedir una que hayas autorizado.
  - Cada valor de un comando local llega como un único argumento, sin que el shell lo interprete. ${host}, ${var:…} y ${ask:…} viajan como variables de entorno, así que un valor con espacios, ;, | o $(…) se pasa tal cual y no ejecuta nada. ping -c 3 ${host} funciona igual que antes; si alguna plantilla contaba con que un ${ask:…} se partiera en varias palabras, ahora llega entero. Un ${host}, ${user} o ${port} que empiece por - se rechaza (se tomaría por una opción del programa), igual que un marcador justo detrás de \ o dentro de $'…'; en Windows, además, un valor con comillas o saltos de línea.
  - Bibliotecas al día: uuid, regex, thiserror y fontdb (que deja de arrastrar tres dependencias), las herramientas de desarrollo y las acciones de la integración continua. Sale del proyecto el paquete del diálogo de ficheros de la interfaz, que ya no se usa.
  Corregido
  - Los errores al importar conexiones, al leer un ~/.ssh/config o cuando un fichero elegido deja de estar disponible se muestran en el idioma de la aplicación; algunos salían siempre en castellano.
  Registro completo: CHANGELOG.md
