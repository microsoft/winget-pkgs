ReleaseNotes: |-
  Añadido
  - Chuleta de atajos de teclado (Ctrl+Shift+H, o desde la paleta de comandos): muestra todos tus atajos agrupados por contexto, con filtro y un enlace para editarlos.
  - La paleta de comandos enseña junto a cada acción el atajo que la lanza, y permite escribir usuario@servidor:puerto (o una IP) para conectar al momento; si ya tienes guardada una conexión a ese servidor, se usa esa.
  - El panel de archivos SFTP de un servidor detrás de un bastión conecta a través de él, igual que el terminal, y su registro muestra cada paso del salto. También respeta «Permitir cifrados antiguos», así que los servidores que solo admiten cifrados viejos abren en el panel como en el terminal.
  - Duración de los avisos en Preferencias → Apariencia: normal, larga o hasta que los cierres. Cada aviso tiene botón para cerrarlo y no desaparece mientras tiene el ratón o el foco encima.
  Cambiado
  - El modo zen también oculta la barra de estado inferior, y todo vuelve como estaba al salir. La ayuda del botón para salir nombra tu atajo, no el de fábrica.
  - La pantalla de inicio, el centro de actividad, el panel de túneles SSH, el menú del botón derecho del panel de archivos, su registro, los colores de carpeta y los avisos que incluyen un nombre o un error (abrir una carpeta, mover, renombrar o duplicar conexiones, reconectar, exportar, importar o restaurar copias) salen en el idioma elegido. Los lectores de pantalla anuncian en tu idioma los botones del lateral, de la ventana y del editor de notas.
  - Si el keyring del sistema rechaza guardar una contraseña, el aviso lo explica igual que la pestaña de sincronización. La prueba del proveedor de sincronización dice si ya había datos guardados, en lugar de un código interno.
  - Escape cierra solo la ventana de arriba: cerrar un desplegable o un diálogo secundario ya no cierra Nueva conexión ni Preferencias ni borra lo escrito, y la Papelera, el Centro de actividad, Salud, Diferencias y las preguntas al conectar también se cierran con Escape.
  - Al abrir un diálogo el foco entra en él y al cerrarlo vuelve a donde estaba; mientras está abierto, el teclado no se escapa al terminal ni los atajos actúan sobre las sesiones de detrás (el zoom de la interfaz sí funciona). Las confirmaciones de borrado empiezan en «Cancelar» y el lector de pantalla lee qué se va a borrar.
  - Los avisos se ven siempre por encima de cualquier ventana.
  - El texto de los botones, avisos y menús de color se lee bien en todos los temas, también en los claros y en los descargados, y el anillo de foco se distingue del fondo en todos ellos y también en «Cancelar» y en los demás botones secundarios.
  - El nombre de las pestañas siempre se ve, aunque lleven etiqueta de entorno o estén ancladas, y las pestañas General/Avanzado/Notas del formulario de conexión quedan fijas bajo la cabecera al desplazarse.
  - La interfaz deja de usar emojis: el inicio, Preferencias, las pestañas ancladas y las transferencias usan iconos propios.
  - Dependencias: russh 0.64.1 (correcciones de seguridad), sha2, libc, futures y el plugin de logs al día, y una acción del CI actualizada. crypto-bigint y ctutils resuelven dos avisos de seguridad sobre operaciones que deben tardar siempre lo mismo en la criptografía de SSH, y clipboard-win sube a una versión que no está retirada del registro.
  - Pruebas: más de cien pruebas nuevas, entre ellas el panel SFTP a través de un bastión real, servidores FTP que dejan de responder, known_hosts con comentarios, sincronizaciones con borrados deshechos y restauraciones, y la comprobación de textos sin traducir, que ahora vigila también las plantillas, los ternarios, los módulos y el HTML de la interfaz.
  Corregido
  - Seguridad: al conectar por Telnet, VNC o RDP, un host con caracteres extraños se rechaza; en Windows y macOS podía ejecutar otras órdenes al pulsar Conectar en una conexión importada o sincronizada. En Windows, abrir Telnet, el visor VNC del sistema o RDP por sus caminos alternativos vuelve a funcionar como se espera.
  - Seguridad: descargar desde el panel de archivos ya no puede escribir fuera de la carpeta elegida aunque el servidor dé un nombre con ruta.
  - Aceptar la nueva clave de un servidor que la ha cambiado ya no borra por error la entrada de otro servidor cuando known_hosts tiene comentarios, y los números de línea que se enseñan coinciden con los del fichero. Si known_hosts cambia mientras decides, Rustty no lo toca y te pide volver a conectar.
  - Si llegan a la vez varias preguntas de huella del servidor, de verificación en dos pasos o de contraseña, aparecen una detrás de otra en vez de cancelarse entre sí; pulsar Intro justo cuando aparece una huella o un certificado nuevo ya no los acepta sin querer, y si una pregunta caduca antes de responderla, la app lo avisa.
  - Que falle una conexión a través de un túnel ya no marca la sesión como caída ni bloquea el teclado, un túnel muy usado ya no deja de aceptar conexiones por un fallo pasajero, y los túneles dejan de aparecer como activos cuando su conexión se corta, se reconecta o se cierra. El tráfico de un túnel muestra el total de todas sus conexiones.
  - La reconexión automática vuelve a tener todos sus reintentos tras cada caída de una sesión que llevaba un rato funcionando, y reconectar una pestaña a mano ya no abre conexiones duplicadas y funciona también con RDP, VNC y Telnet; si cancelas, el aviso vuelve a «Sesión cerrada».
  - tmux en modo control: las ventanas ya no se quedan en blanco al cambiar de pestaña, al reengancharse a una sesión existente sus pestañas llevan el nombre real de cada ventana, Ctrl+Tab y Ctrl+1…9 ya no llevan a una pestaña vacía en la que lo tecleado podía cortar la conexión, reconectar recupera las ventanas, y cerrar en lote o «Desconectar todo» ya no deja pestañas imposibles de cerrar. Un servidor que manda una disposición anidada sin fin ya no puede cerrar la aplicación.
  - Panel de archivos: las transferencias en cola van a la carpeta que estaba abierta al lanzarlas aunque navegues a otra, y el aviso de que un fichero ya existe dice en qué carpeta; en Windows y macOS, descargar un fichero cuyo nombre solo cambia en mayúsculas pregunta antes de reemplazarlo; doble clic en un enlace a una carpeta entra en ella; y en Windows, subir de carpeta desde C:\Users lleva a C:.
  - Transferencias: cancelar una que esperaba turno la quita de la cola al momento sin dejar vacío el fichero del servidor; pausar o cancelar una carpeta frena también el fichero que se está copiando; cerrar la pestaña o el panel cancela de verdad lo que estaba en curso (el panel pide confirmación si hay algo en marcha, y salir del shell del terminal ya no lo cierra mientras transfiere); una descarga o subida SFTP cuyo fichero cambia de tamaño a mitad falla en vez de darse por buena cortada; y no se puede cambiar a sudo con transferencias en marcha, que se cortarían.
  - Las conexiones FTP y FTPS ya no se quedan colgadas para siempre si el servidor deja de responder, y el panel de archivos abierto y sin tocar ya no pierde la conexión con servidores que comprueban si el cliente sigue vivo.
  - Los perfiles FTP y FTPS con la contraseña en KeePass o en una credencial maestra conectan (antes el clic no hacía nada), y el panel de archivos abierto desde una sesión SSH usa el usuario con el que te conectaste («Conectar como…»).
  - Subir una carpeta demasiado grande para revisarla entera pide confirmación, por si contiene claves privadas, en vez de subirla sin avisar.
  - Sincronización: deshacer el borrado de una conexión, o restaurarla desde la Papelera, ya no hace que la siguiente sincronización la vuelva a borrar; restaurar una copia de la nube o importar una copia cifrada ya no se deshace en la siguiente; y editar una conexión o un atajo mientras se sincroniza ya no vuelve a la versión anterior al terminar.
  - Rotar la frase de cifrado de la sincronización vuelve a funcionar: decía siempre que las frases no coincidían.
  - Workspaces: importar conexiones de un workspace que este equipo no tiene lo crea con su nombre y se ven al momento; si otro equipo borra el workspace que tenías abierto, la barra lateral pasa a otro; «Eliminar workspace» del menú de la barra lateral funciona en Linux y macOS y pide escribir el nombre y permite Deshacer, como el resto de borrados; y en la vista «Todos los workspaces» plegar y desplegar cada uno funciona a la primera.
  - Arrastrar una conexión desde los resultados de búsqueda ya no la mueve sin querer a la raíz, y la barra lateral ya no se vuelve más lenta al arrastrar tras mucho rato de uso. Borrar una carpeta ya no muestra dos avisos seguidos.
  - La consola local: soltar ficheros del sistema sobre ella por fin escribe su ruta en el prompt (los nombres con caracteres de control se rechazan), y el borrador del editor de comandos se comparte entre consolas locales. La carpeta inicial de «Duplicar con cambios» por fin se aplica.
  - Un comando local que deja un programa en segundo plano termina enseguida y se puede cancelar, y la comprobación de salud de un workspace ya no congela la ventana mientras espera a los hosts que no responden.
  - En la versión Flatpak, la consola local tiene su terminal bien configurado, los comandos locales reciben los datos de la conexión y RDP con contraseña guardada conecta con FreeRDP 3.
  - Si cierras la pestaña de Google sin autorizar y vuelves a pulsar «Conectar cuenta», se abre un intento nuevo en vez de fallar durante tres minutos.
  - Línea de órdenes: la pregunta para confiar en un servidor sale en la terminal aunque redirijas la salida, sin ensuciarla; salir del shell remoto vuelve al instante sin pulsar Intro; resuelve las variables en el servidor, el usuario y el bastión igual que la aplicación; y las conexiones que actualiza rustty --import ya no las deshace la siguiente sincronización.
  - En macOS, los atajos se rotulan con la tecla que de verdad los lanza (Control), en vez de anunciar Cmd.
  - El tirador entre paneles divididos vuelve a enseñar su ayuda en lugar de un nombre interno.
