Description: Rustty es un cliente de terminal y gestor de conexiones multiplataforma, moderno y ligero. Soporta SSH, SFTP, FTP, FTPS y RDP, con terminal acelerado por GPU, panel de ficheros integrado, túneles SSH, snippets y paleta de comandos.
