ReleaseNotes: |-
  Añadido
  - La integración de shell de la consola local llega a fish y a PowerShell. Hasta ahora los bloques de comando, el aviso de comando largo y la carpeta actual solo funcionaban con bash y zsh; al activar «Integración de shell en la consola local» (Preferencias → Terminal) ya funcionan también en fish y en PowerShell. Como con los otros dos, Rustty no toca tus ficheros de configuración: arranca el shell con uno propio que se carga después del tuyo, así que un tema que dibuje el prompt —oh-my-posh, starship o el que sea— se respeta tal cual y sigue mandando él. En fish hace falta la versión 3 o posterior. En PowerShell, si tu directiva de ejecución no permite cargar el fichero, la consola abre igual, sin marcas y sin ningún error; y el instante en que empieza a correr un comando se detecta con PSReadLine, así que en una consola sin PSReadLine los bloques empiezan en el prompt en vez de en la salida.
  - Renombrar una ventana de tmux desde la propia pestaña. En una sesión en modo control, el menú del botón derecho de la pestaña incluye «Renombrar ventana tmux…». El nombre es el de la ventana en el servidor: lo verá cualquier otro cliente enganchado a esa sesión de tmux, y aparece al momento en la pestaña.
  Cambiado
  - Pantalla de inicio más ordenada. Los mensajes de «Favoritos» e «Historial» cuando no hay nada que enseñar comparten ahora la misma caja centrada y ocupan la tarjeta entera —el de Favoritos se quedaba a media anchura, pegado a la izquierda—, y las tres tarjetas quedan a la misma altura. «Nueva conexión» y «Consola del sistema» ya no se parten a media palabra: si no caben en dos columnas, se apilan. Los cuatro botones de «Empieza a trabajar» se reparten en una rejilla de columnas iguales en vez de caer tres arriba y uno suelto debajo. Y cuando no tienes ninguna conexión guardada, los dos accesos de la barra lateral («Añadir la primera» e «Importar de otro cliente…») son botones a todo lo ancho en lugar de dos enlaces subrayados de distinto tamaño.
  - Bibliotecas al día, incluida la de SSH (russh 0.63), que estrena certificados de clave de servidor. Rustty sigue comprobando la identidad del servidor por su huella en known_hosts, como siempre: si un servidor presentara un certificado firmado por una autoridad, la conexión se rechaza diciéndolo con todas las letras en vez de darlo por bueno.
  Corregido
  - Importar conexiones desde la línea de comandos ya no convierte un perfil de solo ficheros (SFTP, como un StorageBox sin terminal) en uno de SSH. Conservaba el tipo de los demás protocolos, pero ese lo cambiaba, y con él se perdía la marca que usa la propia línea de comandos para aceptarlo en --get y --put y para listarlo con su tipo.
  - En una consola local de Windows, la carpeta actual aparecía en la barra inferior con una barra de más delante de la unidad (/C:/Users/ana).
  Registro completo: CHANGELOG.md
