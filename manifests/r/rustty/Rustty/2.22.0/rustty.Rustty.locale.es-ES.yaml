ReleaseNotes: |-
  Añadido
  - Salto activo: elige una conexión SSH y todas las conexiones nuevas (SSH, el panel de archivos, SFTP, RDP, VNC y Telnet) saldrán por ella. Se pone desde la barra lateral, desde el menú de una conexión («Usar como salto activo») o desde la paleta, y por defecto se quita al cerrar Rustty.
  - El bastión de una conexión puede ser otra conexión guardada, que entra con su propio usuario, contraseña o clave, y los bastiones se pueden encadenar. La dirección escrita a mano sigue funcionando.
  - «Conectar a través de» en el menú de cada conexión, para ir una sola vez por otro salto o sin ningún salto, sin cambiar la conexión.
  - Las sesiones que van por el mismo salto comparten una sola conexión con él: una sola contraseña y una sola pregunta de huella, y se cierra sola tras un rato sin uso.
  - RDP, VNC y Telnet también pueden ir por un salto: Rustty abre un túnel en tu equipo y el cliente se conecta a través de él.
  - «Probar el salto» dice si el servidor del salto deja abrir túneles y qué cambiar si no.
  - Cada pestaña y la barra inferior muestran por dónde va la sesión, y la barra lateral indica si las conexiones nuevas salen directas o por un salto.
  - Preferencias → Saltos: mantener el salto activo al reiniciar, compartir la conexión con el salto entre sesiones y qué hacer con FTP, FTPS y WebDAV, que no pueden ir por un salto.
  - Cada conexión puede quedarse fuera del salto activo para siempre, útil para los equipos de tu red local.
  - La línea de órdenes sale por el salto activo y por el bastión de la conexión, con -J para elegir otro salto y --direct para ir sin ninguno.
  - Al importar ~/.ssh/config, un ProxyJump que nombra otro Host del mismo fichero queda enlazado a esa conexión.
  - Guía en la ayuda para usar un equipo Windows con OpenSSH Server como salto.
  Cambiado
  - Borrar una conexión que hace de bastión lo avisa, y «Deshacer» la vuelve a enlazar con las conexiones que la usaban.
  - En «Conectar con cambios», un bastión escrito a mano sustituye también al bastión guardado, en el terminal, en el panel de archivos y al reconectar.
  - Un Host repetido en ~/.ssh/config se importa una sola vez, como hace ssh.
  - Pruebas: casi un centenar de pruebas nuevas, entre ellas conexiones reales a través de uno y dos saltos con credenciales distintas, la conexión compartida, un salto que no deja abrir túneles y un destino que no contesta, y cuarenta comprobaciones nuevas de extremo a extremo por la interfaz, trece de ellas contra dos servidores SSH reales.
  Corregido
  - «Guardar y conectar» en una conexión VNC o Telnet abre su visor en lugar de intentar conectar por SSH.
  Registro completo: CHANGELOG.md
