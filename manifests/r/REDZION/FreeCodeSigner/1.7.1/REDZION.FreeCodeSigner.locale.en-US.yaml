ShortDescription: Free Windows utility for code signing and signature verification.
Description: Free Code Signer is a free Windows desktop utility for digitally signing files and verifying signatures. It supports Microsoft SignTool and the Windows Certificate Store, YubiKey/PIV, smart cards, HSM/PKCS#11 workflows, Azure Artifact Signing, Google Cloud KMS, Jsign and Java JAR signing. Features include batch signing, timestamping, certificate inspection, signature verification, reports and 25 interface languages.
