ShortDescription: Lossless Hi-Res FLAC Terminal Music Streamer, Multi-Platform Playlist Sync & Live Karaoke TUI
Description: |-
  EchoVena is an ultra-fast, standalone terminal music player and streaming suite written in Rust.
  It decouples track discovery and playlist management (Spotify & YouTube) from audio delivery,
  streaming bit-perfect lossless audio up to 24-bit / 192 kHz FLAC through a multi-provider
  waterfall queue while rendering live, word-synchronized karaoke lyrics at 60 FPS.
