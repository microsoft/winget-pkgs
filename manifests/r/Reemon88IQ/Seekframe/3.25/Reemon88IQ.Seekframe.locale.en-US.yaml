ShortDescription: Turns three.js / canvas HTML scenes and Blender files into MP4 videos for YouTube and Shorts.
Description: |-
  Seekframe (formerly Shadow) is a free Windows app that renders code-made scenes (one .html file with three.js or a 2D canvas, or a Blender
  .blend file) into finished MP4 videos: up to 4K, 30 fps, with sound, in 16:9 for YouTube and 9:16 for Shorts, with a
  quality check on every video. It can upload to your own YouTube channel, make a narrated scene from one idea with
  Claude (your own subscription through Claude Code), and its window is available in 11 languages.
