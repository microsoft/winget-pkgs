ReleaseNotes: |-
  - Updated memory chip mapping for AMD Radeon PRO W7900.
  - Add power limit sticky flags workaround for Arrow Lake-S.
  - Added several new ARM architectures.
  - Fixed chipset detection when AMD B650 chipset is used on expansion card.
  - Added Panter Lake-H 080.
  - Added reporting of ASIC Quality for newer NVIDIA GPUs.
  - Extended NVIDIA power rail descriptions.
  - Updated reporting of ASIC serial number on NVIDIA GPUs.
  - Added reporting of ASIC ECID and IDDQ for NVIDIA GPUs.
  - Enhanced sensor monitoring on ASUS ROG CROSSHAIR X870E GLACIAL and EDITION 20.
  - Added support of MPS MP2995, MP29005, MP29005A and MP29025 VRM/PWM.
  - Enhanced support of Nova Lake-E and Razor Lake-H/HX/S.
  - Added reporting of VBIOS project information and GOP version for NVIDIA GPUs.
  - Fixed automatic update of ARM64 version.
  - Fixed reporting of tREFmax in AMD ULL.
  - Updated Intel XMP 3.0 support.
  - Updated Intel PresentMon.
  - Added MAC/PHY temperature monitoring for several Aquantia/Marvell NIC adapters.
  - Enhanced support of NVIDIA Spark.
  - Added AMD Radeon RX 7500.
  - Added reporting board number and ID for NVIDIA GPUs.
  - Added reporting of GPU Hot Spot temperature for AMD Polaris.
  - Added monitoring of AMD B650 chipset temperature on expansion card.
  - Added monitoring of Sapphire PhantomLink temperature and status.
  - Added more Lisuan GPU models.
  - Fix a possible crash when switching OSD window types.
  - Set OSD window to be always topmost.
  - Updated JSON logging.
  - Updated Intel oneAPI/IGCL support.
  - Added reporting of Intel VT-d/AMD-Vi support and DMAr status.
