ReleaseNotes: |-
  - Added separate settings for Inner Bridging Flowrate, Inner Bridging Speed, and Inner Bridging Extrusion Width Percentage to enable fine-grained control of internal vs. external bridge structures.
  - Added support for alternating fill angles on support dense layers to improve support adhesion and stability.
  - Assembly Support for Arrange and Sequential Printing.
  - New Infill Type - Archimedean Chords.
  - Infill Anchor: Added a sparse infill anchor line length setting.
  - New Start Point Type - Aligned.
  - Extended Shell Infill Order: Added two new options to Shell and Infill Order: "Inner/Outer/Inner -> Infill" and "Infill -> Inner/Outer/Inner".
  - Support Painting Fill Mode - Overhang Only.
  - Support nozzle and Raft/Skirt/Brim nozzles now support being set to "Not Specified".
  - Travel paths have been split from one frame per path to one frame per step, enabling step-by-step animation playback and precise GCode line number positioning.
  - Added a 3D nozzle model display and speed display in FFF preview.
  - Refactored the SLS slicing algorithm, reducing peak memory to under 25% of previous versions.
  - Overall SLS slicing time reduced to under 40% of previous versions.
  - Significant speedup when arranging identical models.
  - Optimized the 3D packing algorithm, reducing peak memory by over 30%.
  - Significantly reduces computation time when using the Balanced packing strategy.
