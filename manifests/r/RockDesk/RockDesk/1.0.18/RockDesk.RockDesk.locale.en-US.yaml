ShortDescription: Remote desktop and remote control for people and AI agents. Connect to your other computers by a 9-digit ID, peer-to-peer, with no public IP or port forwarding.
Description: |-
  RockDesk gives every computer a 9-digit ID and connects them peer-to-peer, falling back to an end-to-end encrypted relay when a direct path is not possible. No public IP, port forwarding or VPN setup is needed.
  Features: remote desktop, terminal, file transfer and remote folder mounting, clipboard sync, TCP port forwarding, USB device forwarding, and a virtual network into the remote computer's LAN.
  For AI agents: the rds command line and the built-in MCP server (rds mcp) let Claude Code, Codex, Gemini CLI, DeepSeek Harness and other agents run commands, copy files, take screenshots and use the mouse and keyboard on your other computers.
  Install RockDesk on each computer you want to connect. Each new device gets a free trial.
  The installer is not code-signed yet: if Windows says "Windows protected your PC", click "More info", then "Run anyway".
