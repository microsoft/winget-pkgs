ShortDescription: 远程桌面和远程控制，也能给 AI 用：按 9 位 ID 点对点连接你的其它电脑，不用公网 IP，不用开端口。
Description: |-
  RockDesk（磐石远控）给每台电脑一个 9 位 ID，能直连就点对点，打不通自动走端到端加密的中继；不用公网 IP、端口映射，也不用配置 VPN。
  功能：远程桌面、终端、传文件和挂载远程目录、剪贴板同步、端口转发、USB 设备转发、内网穿透（虚拟网卡）。
  给 AI 用：命令行 rds 和自带的 MCP 服务（rds mcp）让 Claude Code、Codex、Gemini CLI、DeepSeek Harness 等 AI 在你的其它电脑上跑命令、传文件、截屏、点鼠标打字。
  要连的每台电脑都装 RockDesk；每台新设备有免费试用期。
  安装包还没有代码签名：Windows 提示「Windows 已保护你的电脑」时，点「更多信息」→「仍要运行」。
