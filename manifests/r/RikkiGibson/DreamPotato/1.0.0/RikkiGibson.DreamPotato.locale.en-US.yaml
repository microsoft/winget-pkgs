ReleaseNotes: |-
  DreamPotato has reached 1.0 (stable)! Thank you for all your support and encouragement as I have worked continually through this project.

  ### Hollycast Integrated Mode

  **See demo video**：https://www.youtube.com/watch?v=HkwDi5smav4

  DreamPotato now integrates with [Hollycast](https://github.com/OrangeFox86/Hollycast), a new fork of Flycast. This represents a big improvement to ease of use!

  > [!TIP]
  > Consider **downloading from the [Hollycast release page](https://github.com/OrangeFox86/Hollycast/releases)** instead. This will get you both Hollycast and DreamPotato at the same time, and with versions that are known to work with each other.

  The new integration allows:
  • Automatically launching DreamPotato and connecting back to Hollycast, for any number of Dreamcast ports. All you have to do is pick DreamPotato as the expansion device type in Hollycast.
  • Automatically using the VMU file from Hollycast. Even per-game VMU A1's "just work" in DreamPotato now. (fixes #12.)

  ### VMS Folder

  #41 added "Open Folder" and "Save as Folder" commands. This exposes the individual game saves in a folder on your hard drive, similar to Dolphin's "GCI Folder" support.

  This improves the experience of importing/exporting individual game saves on your VMUs. See https://github.com/RikkiGibson/DreamPotato#open-folder for details.

  ### Audio Improvements

  #46 improved audio accuracy, especially in Soul Calibur 3-in-1. You should notice a general improvement in clarity of the beeps and boops made by the emulated buzzer.

  ### App Icon

  We have a new app icon drawn by [@ruva](https://artistree.io/ruva)! The blocky programmer art we had before is no more.

  **Full Changelog**：https://github.com/RikkiGibson/DreamPotato/compare/v0.3.1...v1.0.0
