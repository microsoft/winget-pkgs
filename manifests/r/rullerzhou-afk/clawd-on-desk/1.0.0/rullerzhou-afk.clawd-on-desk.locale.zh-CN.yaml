Description: |-
  Clawd on Desk 是一款开源桌宠，通过动画显示 Claude Code、Codex、Cursor 等 AI 编程助手的工作、权限请求和任务完成状态，支持同时跟踪多个会话。

  内置 Clawd、Calico、Cloudling 三套主题，支持自定义主题、会话面板、可选权限气泡和本地活动小结。
