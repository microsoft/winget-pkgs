ShortDescription: Classic-looking, cross-platform GUI git client in the style of gitk and git gui.
Description: |-
  Git Journey (gitj) is a gitk-style repository browser and commit helper built on the Saudade toolkit.
  It has three screens: a gitk-style browse screen with the history graph, ref badges and a
  git show-style detail and diff pane; a git gui-style commit screen for staging changes and writing
  the commit message; and a review screen that shows everything a branch would bring in.
  Run gitj inside a repository, or pass a path, to open it. Changed images, including SVGs, can be
  compared graphically side by side, with swipe, onion skin and difference views.
