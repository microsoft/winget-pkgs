ShortDescription: Free, portable Windows toolkit for PC technicians, IT pros, and sysadmins.
Description: |-
  S.A.K. Utility is a free, open-source, portable Windows toolkit for PC technicians, IT pros, and sysadmins.
  It combines profile backup and restore, partition management, diagnostics, app deployment and removal, file and network tools, USB image flashing, email archive tools, and optional AI repair workflows.
  It runs as a standard user and asks for administrator rights when a task needs them.
  Settings, logs and reports stay in a "data" folder beside the program, and there is no telemetry.
  The AI Assistant is optional and uses your own OpenAI API key.
  Built and tested on 64-bit Windows 11. Windows 10 version 1809 or later meets the minimum requirements but is not part of release testing.
