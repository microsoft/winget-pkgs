PackageName: WinAppMigrator
ShortDescription: 'निःशुल्क, ओपन-सोर्स टूल, जो इंस्टॉल किए गए Windows ऐप को किसी अन्य PC के लिए एक इंस्टॉलर में बदल देता है, चाहे ऐप किसी खराब PC की ड्राइव पर हो, डिस्क छवि में हो, या किसी पुराने Windows 7 PC पर।'
Description: 'WinAppMigrator किसी Windows PC पर इंस्टॉल किए गए ऐप को एक ऐसे इंस्टॉलर में बदल देता है जिसे आप किसी अन्य PC पर चला सकते हैं। तब भी, जब ऐप आपके नेटवर्क पर किसी पुराने Windows 7 PC पर हो, खराब हो रही मशीन से निकाली गई ड्राइव पर हो, या ऐसी ड्राइव की छवि में हो, और मूल इंस्टॉलर कब का खो चुका हो।'
