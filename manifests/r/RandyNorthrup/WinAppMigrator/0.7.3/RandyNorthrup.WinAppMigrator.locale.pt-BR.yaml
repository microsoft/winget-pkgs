# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: pt-BR
PackageName: WinAppMigrator
ShortDescription: 'Ferramenta gratuita e de código aberto que transforma um aplicativo instalado do Windows em um único instalador para outro PC, mesmo a partir da unidade de um PC que não liga mais, de uma imagem de disco ou de um PC antigo com Windows 7.'
Description: 'O WinAppMigrator transforma um aplicativo instalado em um PC com Windows em um único instalador que você pode executar em outro. Mesmo quando o aplicativo está em um PC antigo com Windows 7 na sua rede, em uma unidade retirada de uma máquina que está parando de funcionar ou em uma imagem dessa unidade, e o instalador original já não existe há muito tempo.'
ManifestType: locale
ManifestVersion: 1.28.0
