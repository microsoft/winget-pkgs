PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: ar-SA
PackageName: WinAppMigrator
ShortDescription: 'أداة مجانية ومفتوحة المصدر تحوّل تطبيق Windows مثبتًا إلى برنامج تثبيت واحد لكمبيوتر آخر، حتى من محرك أقراص كمبيوتر لا يعمل، أو من صورة قرص، أو من كمبيوتر قديم يعمل بنظام Windows 7.'
Description: 'يحوّل WinAppMigrator تطبيقًا مثبتًا على كمبيوتر يعمل بنظام Windows إلى برنامج تثبيت واحد يمكنك تشغيله على كمبيوتر آخر. حتى عندما يكون التطبيق على كمبيوتر قديم يعمل بنظام Windows 7 عبر شبكتك، أو على محرك أقراص أُخرج من جهاز يتعطل، أو على صورة لمحرك أقراص كهذا، ويكون برنامج التثبيت الأصلي قد فُقد منذ زمن طويل.'
