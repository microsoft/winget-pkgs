# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: es-ES
PackageName: WinAppMigrator
ShortDescription: 'Herramienta gratuita y de código abierto que convierte una aplicación instalada en Windows en un único instalador para otro PC, incluso desde la unidad de un PC que ya no funciona, una imagen de disco o un PC antiguo con Windows 7.'
Description: 'WinAppMigrator convierte una aplicación instalada en un PC con Windows en un único instalador que puedes ejecutar en otro. Incluso cuando la aplicación está en un PC antiguo con Windows 7 de tu red, en una unidad extraída de un equipo que está fallando o en una imagen de esa unidad, y el instalador original ya no existe.'
ManifestType: locale
ManifestVersion: 1.28.0
