PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: it-IT
PackageName: WinAppMigrator
ShortDescription: 'Strumento gratuito e open source che trasforma un''app Windows installata in un unico programma di installazione per un altro PC, anche dall''unità di un PC guasto, da un''immagine disco o da un vecchio PC con Windows 7.'
Description: 'WinAppMigrator trasforma un''app installata in un PC Windows in un unico programma di installazione da eseguire in un altro PC. Anche quando l''app si trova in un vecchio PC con Windows 7 nella tua rete, in un''unità estratta da un computer che sta per guastarsi o in un''immagine di quell''unità, e il programma di installazione originale non c''è più da tempo.'
