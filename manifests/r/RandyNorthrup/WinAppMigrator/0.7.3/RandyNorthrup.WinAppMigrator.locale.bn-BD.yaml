PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: bn-BD
PackageName: WinAppMigrator
ShortDescription: 'বিনামূল্যের, ওপেন-সোর্স টুল, যা ইনস্টল করা একটি Windows অ্যাপকে অন্য পিসির জন্য একটিমাত্র ইনস্টলারে পরিণত করে, এমনকি নষ্ট পিসির ড্রাইভ, ডিস্ক ইমেজ বা পুরোনো Windows 7 পিসি থেকেও।'
Description: 'WinAppMigrator একটি Windows পিসিতে ইনস্টল করা অ্যাপকে একটিমাত্র ইনস্টলারে পরিণত করে, যা আপনি অন্য পিসিতে চালাতে পারেন। অ্যাপটি আপনার নেটওয়ার্কের কোনো পুরোনো Windows 7 পিসিতে থাকলেও, বিকল হতে থাকা কোনো মেশিন থেকে খুলে আনা ড্রাইভে থাকলেও, বা সেই ড্রাইভের ইমেজে থাকলেও, এবং মূল ইনস্টলারটি বহু আগে হারিয়ে গিয়ে থাকলেও।'
