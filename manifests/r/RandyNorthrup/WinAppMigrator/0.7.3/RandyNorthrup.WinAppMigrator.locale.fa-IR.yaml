PackageName: WinAppMigrator
ShortDescription: 'ابزاری رایگان و متن‌باز که یک برنامه نصب‌شده Windows را به یک نصب‌کننده برای رایانه دیگر تبدیل می‌کند، حتی از درایو یک رایانه ازکارافتاده، یک تصویر دیسک یا یک رایانه قدیمی با Windows 7.'
Description: 'WinAppMigrator برنامه‌ای را که روی یک رایانه Windows نصب شده است به یک نصب‌کننده تبدیل می‌کند که می‌توانید آن را روی رایانه دیگری اجرا کنید. حتی وقتی برنامه روی یک رایانه قدیمی با Windows 7 در شبکه شماست، روی درایوی است که از دستگاهی رو به خرابی بیرون آورده شده، یا روی تصویری از چنین درایوی، و نصب‌کننده اصلی مدت‌هاست از دست رفته است.'
