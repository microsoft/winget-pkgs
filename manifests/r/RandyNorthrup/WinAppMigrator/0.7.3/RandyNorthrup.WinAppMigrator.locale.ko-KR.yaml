PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: ko-KR
PackageName: WinAppMigrator
ShortDescription: '설치된 Windows 앱을 다른 PC용 설치 관리자 하나로 만드는 무료 오픈 소스 도구입니다. 고장 난 PC의 드라이브, 디스크 이미지, 오래된 Windows 7 PC에서도 만들 수 있습니다.'
Description: 'WinAppMigrator는 한 Windows PC에 설치된 앱을 다른 PC에서 실행할 수 있는 설치 관리자 하나로 만듭니다. 앱이 네트워크 건너편의 오래된 Windows 7 PC에 있거나, 고장 나기 시작한 컴퓨터에서 꺼낸 드라이브 또는 그 드라이브의 이미지에 있고, 원래 설치 관리자가 없어진 지 오래되었어도 가능합니다.'
ManifestType: locale
ManifestVersion: 1.28.0
