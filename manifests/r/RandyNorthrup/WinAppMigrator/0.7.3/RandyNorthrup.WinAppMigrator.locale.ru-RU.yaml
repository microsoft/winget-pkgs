# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: ru-RU
PackageName: WinAppMigrator
ShortDescription: 'Бесплатная программа с открытым исходным кодом, которая превращает установленное приложение Windows в один установщик для другого компьютера, даже с диска неработающего компьютера, из образа диска или со старого компьютера с Windows 7.'
Description: 'WinAppMigrator превращает приложение, установленное на одном компьютере с Windows, в один установщик, который можно запустить на другом. Даже если приложение находится на старом компьютере с Windows 7 в вашей сети, на диске, извлеченном из выходящего из строя компьютера, или в образе такого диска, а исходного установщика давно нет.'
ManifestType: locale
ManifestVersion: 1.28.0
