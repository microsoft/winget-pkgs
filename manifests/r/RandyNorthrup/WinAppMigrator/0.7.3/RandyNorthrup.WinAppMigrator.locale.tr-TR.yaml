PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: tr-TR
PackageName: WinAppMigrator
ShortDescription: 'Yüklü bir Windows uygulamasını başka bir bilgisayar için tek bir yükleyiciye dönüştüren ücretsiz, açık kaynaklı araç. Çalışmayan bir bilgisayarın sürücüsünden, bir disk görüntüsünden veya eski bir Windows 7 bilgisayardan bile.'
Description: 'WinAppMigrator, bir Windows bilgisayarda yüklü olan bir uygulamayı başka bir bilgisayarda çalıştırabileceğiniz tek bir yükleyiciye dönüştürür. Uygulama ağınızdaki eski bir Windows 7 bilgisayarda, bozulmakta olan bir makineden çıkarılmış bir sürücüde ya da böyle bir sürücünün görüntüsünde olsa ve özgün yükleyici çoktan kaybolmuş olsa bile.'
