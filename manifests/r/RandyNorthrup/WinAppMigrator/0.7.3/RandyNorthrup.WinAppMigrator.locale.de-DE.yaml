# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: de-DE
PackageName: WinAppMigrator
ShortDescription: 'Kostenloses Open-Source-Tool, das eine installierte Windows-App in ein einziges Installationsprogramm für einen anderen PC verwandelt, sogar vom Laufwerk eines defekten PCs, aus einem Datenträgerabbild oder von einem alten Windows-7-PC.'
Description: 'WinAppMigrator verwandelt eine App, die auf einem Windows-PC installiert ist, in ein einziges Installationsprogramm, das Sie auf einem anderen ausführen können. Auch wenn sich die App auf einem alten Windows-7-PC in Ihrem Netzwerk befindet, auf einem Laufwerk, das aus einem sterbenden Computer ausgebaut wurde, oder auf einem Abbild davon, und das ursprüngliche Installationsprogramm längst verschwunden ist.'
ManifestType: locale
ManifestVersion: 1.28.0
