PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: ja-JP
PackageName: WinAppMigrator
ShortDescription: 'インストールされている Windows アプリを、別の PC 用の 1 つのインストーラーにする無料のオープンソース ツールです。起動しなくなった PC のドライブ、ディスク イメージ、古い Windows 7 PC からも作成できます。'
Description: 'WinAppMigrator は、ある Windows PC にインストールされているアプリを、別の PC で実行できる 1 つのインストーラーにします。アプリがネットワーク上の古い Windows 7 PC にある場合も、故障しかけたコンピューターから取り外したドライブやそのイメージにある場合も、元のインストーラーがとうになくなっていても使えます。'
