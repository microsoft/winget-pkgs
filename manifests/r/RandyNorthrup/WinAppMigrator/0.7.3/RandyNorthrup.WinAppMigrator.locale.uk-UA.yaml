PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: uk-UA
PackageName: WinAppMigrator
ShortDescription: 'Безкоштовний інструмент із відкритим кодом, який перетворює інстальовану програму Windows на один інсталятор для іншого ПК — навіть із диска несправного ПК, з образу диска або зі старого ПК з Windows 7.'
Description: 'WinAppMigrator перетворює програму, інстальовану на одному ПК з Windows, на один інсталятор, який можна запустити на іншому. Навіть якщо програма розміщена на старому ПК з Windows 7 у вашій мережі, на диску, вийнятому з комп''ютера, що виходить з ладу, або на образі такого диска, а оригінального інсталятора давно немає.'
