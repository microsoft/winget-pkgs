PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: pl-PL
PackageName: WinAppMigrator
ShortDescription: 'Bezpłatne narzędzie o otwartym kodzie źródłowym, które przekształca zainstalowaną aplikację Windows w jeden instalator dla innego komputera, nawet z dysku niedziałającego komputera, z obrazu dysku lub ze starego komputera z systemem Windows 7.'
Description: 'WinAppMigrator przekształca aplikację zainstalowaną na jednym komputerze z systemem Windows w jeden instalator, który uruchomisz na innym. Nawet gdy aplikacja jest na starym komputerze z systemem Windows 7 w sieci lokalnej, na dysku wyjętym z psującego się komputera lub na obrazie takiego dysku, a oryginalnego instalatora dawno już nie ma.'
