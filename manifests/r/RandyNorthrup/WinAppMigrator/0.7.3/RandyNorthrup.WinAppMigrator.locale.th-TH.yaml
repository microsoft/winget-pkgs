PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: th-TH
PackageName: WinAppMigrator
ShortDescription: 'เครื่องมือฟรีและโอเพนซอร์ส ที่เปลี่ยนแอป Windows ที่ติดตั้งไว้ให้เป็นตัวติดตั้งเดียวสำหรับพีซีเครื่องอื่น แม้จากไดรฟ์ของพีซีที่เสีย อิมเมจดิสก์ หรือพีซี Windows 7 เครื่องเก่า'
Description: 'WinAppMigrator เปลี่ยนแอปที่ติดตั้งไว้บนพีซี Windows เครื่องหนึ่ง ให้เป็นตัวติดตั้งเดียวที่คุณเรียกใช้บนอีกเครื่องหนึ่งได้ แม้แอปจะอยู่บนพีซี Windows 7 เครื่องเก่าในเครือข่ายของคุณ บนไดรฟ์ที่ถอดออกมาจากเครื่องที่กำลังจะเสีย หรือบนอิมเมจของไดรฟ์นั้น และตัวติดตั้งดั้งเดิมหายไปนานแล้วก็ตาม'
