ShortDescription: 'Công cụ miễn phí, mã nguồn mở, biến một ứng dụng Windows đã cài đặt thành một trình cài đặt duy nhất cho PC khác, kể cả từ ổ đĩa của một PC đã hỏng, từ ảnh đĩa, hoặc từ một PC Windows 7 cũ.'
Description: 'WinAppMigrator biến một ứng dụng đã cài đặt trên một PC Windows thành một trình cài đặt duy nhất mà bạn có thể chạy trên PC khác. Kể cả khi ứng dụng nằm trên một PC Windows 7 cũ trong mạng của bạn, trên ổ đĩa tháo ra từ một máy sắp hỏng, hoặc trên ảnh của ổ đĩa đó, và trình cài đặt gốc đã mất từ lâu.'
