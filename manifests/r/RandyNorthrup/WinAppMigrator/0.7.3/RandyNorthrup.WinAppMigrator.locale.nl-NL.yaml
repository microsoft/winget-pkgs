PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: nl-NL
PackageName: WinAppMigrator
ShortDescription: 'Gratis opensourcetool die van een geïnstalleerde Windows-app één installatieprogramma voor een andere pc maakt, zelfs vanaf het station van een kapotte pc, een schijfkopie of een oude Windows 7-pc.'
Description: 'WinAppMigrator maakt van een app die op een Windows-pc is geïnstalleerd, één installatieprogramma dat je op een andere pc kunt uitvoeren. Ook als de app op een oude Windows 7-pc in je netwerk staat, op een station uit een computer die het begeeft, of op een schijfkopie daarvan, en het oorspronkelijke installatieprogramma al lang weg is.'
