# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: zh-CN
PackageName: WinAppMigrator
ShortDescription: '免费的开源工具，可将已安装的 Windows 应用转换为一个安装程序，供另一台电脑使用；即使应用位于无法启动的电脑的驱动器上、磁盘映像中或旧的 Windows 7 电脑上也可以。'
Description: 'WinAppMigrator 可将一台 Windows 电脑上安装的应用转换为一个安装程序，供你在另一台电脑上运行。即使该应用位于网络中另一台旧的 Windows 7 电脑上、从即将损坏的电脑中取出的驱动器上或这种驱动器的映像中，而且原始安装程序早已不见，也同样可以。'
ManifestType: locale
ManifestVersion: 1.28.0
