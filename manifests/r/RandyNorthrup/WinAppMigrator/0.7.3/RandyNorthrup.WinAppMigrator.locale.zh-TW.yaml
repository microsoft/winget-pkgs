# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: zh-TW
PackageName: WinAppMigrator
ShortDescription: '免費的開放原始碼工具，可將已安裝的 Windows 應用程式轉成一個安裝程式，在另一台電腦上使用，即使來源是故障電腦的磁碟機、磁碟映像或舊的 Windows 7 電腦也可以。'
Description: 'WinAppMigrator 會將一台 Windows 電腦上已安裝的應用程式轉成一個安裝程式，讓您在另一台電腦上執行。即使應用程式位於網路上的舊 Windows 7 電腦、從即將故障的電腦拆下的磁碟機，或該磁碟機的映像中，而且原始安裝程式早已不見，也一樣可以。'
ManifestType: locale
ManifestVersion: 1.28.0
