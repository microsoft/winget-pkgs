# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: RandyNorthrup.WinAppMigrator
PackageVersion: 0.7.3
PackageLocale: fr-FR
PackageName: WinAppMigrator
ShortDescription: 'Outil gratuit et open source qui transforme une application Windows installée en un seul programme d''installation pour un autre PC, même à partir du lecteur d''un PC hors service, d''une image disque ou d''un ancien PC sous Windows 7.'
Description: 'WinAppMigrator transforme une application installée sur un PC Windows en un seul programme d''installation à exécuter sur un autre. Même quand l''application se trouve sur un ancien PC sous Windows 7 de votre réseau, sur un lecteur retiré d''un ordinateur en fin de vie, ou sur une image de ce lecteur, et que le programme d''installation d''origine a disparu depuis longtemps.'
ManifestType: locale
ManifestVersion: 1.28.0
