ShortDescription: Move installed Windows programs to a new PC, even from a dead drive or an old Windows 7 PC, when the installer is gone.
Description: |-
  WinAppMigrator turns an installed Windows desktop app into one self-extracting installer you can run on another PC.
  Pick the app from this PC, from a drive pulled out of a dead machine, from a .vhd or .vhdx image of one, or from an old Windows 7 or later PC over your network through the signed WinAppMigrator Client.
  It captures the app's files, registry entries, services, drivers and runtimes, with its user data and license if you choose, and the installer checks hashes before and after it writes anything.
  WinAppMigrator runs elevated on Windows 10 and 11.
