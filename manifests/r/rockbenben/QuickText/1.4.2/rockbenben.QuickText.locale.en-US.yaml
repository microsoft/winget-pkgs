ReleaseNotes: |
  v1.4.2: fixes and small improvements over v1.4.0.
  - The long-text preview folds into a one-line strip instead of squeezing the results list; click it or press Ctrl+Space to expand it.
  - The hotkey capture keeps the Win key, so Win+S records the combination the UI promises.
  - The call-out hotkey and the capture hotkey can no longer be set to the same combination, and clearing the call-out key falls back to the default instead of locking you out of the app.
  - An empty name now disables the OK button instead of closing the dialog and doing nothing; surrounding spaces are trimmed.
  - The settings page now explains how an abbreviation expands (space, Tab, or Enter) and how to undo it (backspace), in all 18 languages.
  - The scrollbar thumb is thinner and is now visible in the light theme, where it used to be effectively invisible.
  - Also in this release: every control draws its focus, disabled and pressed states; the panel drops the category chip when it is narrow; right-to-left languages get mirrored tray and context menus; the editor marks the current line with a thin accent bar; and the wording of 16 languages was corrected.
  Full release notes: https://github.com/rockbenben/QuickText/releases/tag/v1.4.2
