ShortDescription: One app for all your RGB gear, whatever the brand.
Description: |-
  Lumen replaces the RGB side of Razer Synapse, Logitech G HUB, Corsair iCUE, SteelSeries GG, ASUS Armoury Crate and the other vendor apps with one small tray app. Every device sits on one canvas, drawn to scale, and a stack of effects runs across all of them as one motion; a paint layer colours individual keys.
  It also shows battery levels for wireless mice and keyboards, changes device settings such as DPI stages, polling rate and sleep timer on supported Razer, HyperX and Logitech devices, writes boot lighting to Razer devices with onboard memory, and turns the lights off when the PC sleeps or shuts down.
  Lighting goes through OpenRGB, which is bundled, so any device OpenRGB supports works. Lumen updates itself from GitHub Releases.
