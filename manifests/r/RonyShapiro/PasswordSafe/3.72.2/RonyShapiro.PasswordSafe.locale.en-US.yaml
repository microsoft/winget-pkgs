ReleaseNotes: |-
  Bugs Fixed in 3.72.2
  - GH1898 Arrow keys can now be used to navigate between Custom Value rows.
  - GH1892 Regression: In the Add/Edit dialog’s Basic tab, Alt-N (or the equivalent for non-English langauges) set the keyboard focus to the Notes field.
  - SF1636 Minor UI issues in Custom Values display (column width) and edit (use correct font).
  - SF1635 Values in password subset dialog are no longer truncated.
  - SF1614 The Find search bar’s visibility state is now consistently persistent.
  - GH1889 Regression: ‘Apply’ button now enabled only when a change is made to the entry.
  - GH1092 Regression: Last size and position maintained correctly across scaling other than 100%.

  New Features in 3.72.2
  - Users can now turn of the tooltips displayed in the Virtual Keyboard by clearing the new “Display Tooltips” checkbox. This is useful when the tooltips hide some of the buttons.
