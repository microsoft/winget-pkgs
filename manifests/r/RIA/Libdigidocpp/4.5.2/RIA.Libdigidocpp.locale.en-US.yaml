ShortDescription: The C++ library offering creating, signing and verification of digitally signed documents, according to XAdES and ASiC standards.
Description: |-
  Libdigidocpp is the C++ library offering creating, signing and verification of digitally signed documents, according to XAdES and ASiC standards.
  The ID-software is automatically configured to use RIA server access certificate and Time-Stamping Service, which is for personal purposes only. For any commercial use, you should enter into a contract with a service provider SK ID Solutions AS.
ReleaseNotes: |-
  We appreciate your feedback to www.id.ee.
  - Security fix: reject XAdES signatures in ASiC-E, BDOC and ADoc containers that do not reference every data file in the container; such signatures were previously accepted as covering unsigned data files (GHSA-q2rc-qw4c-8gv5).
  - Security fix: require id-kp-OCSPSigning extended key usage on OCSP responder certificates, except when the response is signed by the certificate's issuing CA (GHSA-vm5m-pv9w-mvm7, #745).
  Full Changelog: https://github.com/open-eid/libdigidocpp/compare/v4.5.1...v4.5.2
