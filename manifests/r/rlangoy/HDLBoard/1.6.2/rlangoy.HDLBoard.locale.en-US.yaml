ReleaseNotes: |-
  U/I improvements
  - Board I/O panels can be rearranged by dragging their frame. The order is saved in the project file.
  - Bouncy pushbuttons: the Pushbuttons menu has No Bounce (the default) and Bouncy. With Bouncy on, each press and release
  - Quick Fixes in the editor: a 💡 button, or Ctrl+., fixes common mistakes:
    - A missing package (for example unsigned without numeric_std) adds the right use clause, with library ieee; if it is missing.
    - A missing or misspelled begin in an architecture is inserted or replaced.
    - An architecture of an unknown entity gets the suggested entity name.
  - Update notice: a bell with a red badge appears when a newer release is out on GitHub. You can turn the startup check on or off in Settings > Updates. It is on by default in the Windows app and off in a browser.
  - The Windows app can run several copies at once. Each copy uses its own port, from 9010 to 9019.
  Improved
  - Clearer error messages for common VHDL mistakes:
    - A signal or other declaration placed after begin names the line it should move above.
    - An extra end names the line that already closed the architecture.
    - An architecture placed inside another architecture tells you where to end the first one.
    - An unknown entity suggests the nearest entity name in the project.
  - Errors caused by an earlier mistake name the nearest earlier mistake, not always the file's first error.
  - A message that does not fit after its line is shown on rows below the line, so you never have to scroll sideways to read it. Errors are scrolled into view after a run.
  - Pasting an architecture opens a Review pasted architecture dialog when its entity is unknown or the project already has an architecture with that name. You can replace the old architecture or delete the entity's other architecture, and the dialog shows which lines would be deleted.
  - At Start, duplicate architecture names, in one file or across files, are reported as warnings.
  - Settings > Pushbuttons can hide the Bouncy option. A teacher can set the startup default in settings.json (see docs/SETTINGS.md).
  - A new project names its top file and entity/module after the project, not the board, and opens that file in the editor.
  Fixed
  - In the Windows app, File > Exit no longer refuses the last save on its way out.
  - A port that Windows has reserved (Hyper-V/WSL) is skipped like a port already in use.
  - start-windows.cmd and stop-windows.cmd find the servers on Windows builds that report socket states wrongly.
  - After pasting text with Windows line endings (CRLF), the caret lands right after the paste.
  Install
  Windows:
  - Download HDLBoard-Setup-1.6.2.exe below and run it.
  - The installer is not code-signed, so Windows SmartScreen will warn that the publisher is unknown. Choose More info → Run anyway.
  - Launch HDLBoard from the Start menu or the desktop shortcut.
  VirtualBox - virtualbox.org
  Pre-built VirtualBox Appliance — HDLBoard.ova
  Ready-to-run VirtualBox image for HDLBoard — a VHDL IDE with interactive board simulation.
  Install:
  - Download HDLBoard.ova
  - Open VirtualBox → File → Import Appliance
  - Select the downloaded file → Import
  - Click Start to boot the VM
  - In a web browser, go to http://127.0.0.1/
  - Login: username: root / password: student2026 (please change it)
  Manual build
  To run HDLBoard in a browser, or to build it yourself, see BUILDING.md
  Linux
  - Download HDLBoard-1.6.2-linux-x86_64.AppImage below.
  - Open a terminal in the download folder and run:
    chmod +x HDLBoard-1.6.2-linux-x86_64.AppImage
    ./HDLBoard-1.6.2-linux-x86_64.AppImage
  - The AppImage is intended for 64-bit Intel and AMD Linux systems. Compatibility depends on your distribution.
  Ubuntu 24.04: If HDLBoard reports that FUSE is missing, install the required library and try again:
  sudo apt install libfuse2t64
  Known limitations
  - In the hosted app, files and edits are kept in memory only by default. Reloading resets the project to the starter files.
  - A design that divides the real 50 MHz clock down to a human-visible rate needs millions of simulated cycles per visible change and is impractical here. Use the optional CLOCK_500Hz port for a ready-divided clock. It is a simulator convenience, not a real board pin.
  - A waveform larger than 16 MiB is not recorded.
  - Update files renames ports only between Default, DE1-SoC and DE10-Lite. A change to or from Basys 3 or Nexys A7 renames nothing and lists the port names to use.
  - The update check needs internet access to api.github.com. Without it, no notice is shown.
  - Only up to ten copies of the Windows app can run at once (ports 9010–9019).
  Linux
