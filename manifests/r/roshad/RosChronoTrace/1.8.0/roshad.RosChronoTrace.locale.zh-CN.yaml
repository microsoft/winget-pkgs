ReleaseNotes: |-
  # v1.8.0

  ## 🌟 Highlights

  • 行为条编辑窗现在会根据后续记录自动选择合适的继续方式，减少重复按钮和手动判断。

  ## 🔄 Improvements

  • 没有后续行为条时，按钮显示“补齐并继续”，将原条目补齐到当前时间并继续计时。
  • 已有后续行为条时，按钮显示“从现在继续”，从当前时间新建相同标签、分类和颜色的行为并开始计时。

  **Full changelog:** [v1.7.0...v1.8.0](https://github.com/roshad/Ro-s-ChronoTrace/compare/v1.7.0...v1.8.0)
