ReleaseNotes: |-
  # v1.9.0

  ## 🌟 Highlights

  • 行为条的继续操作统一为“填补并继续”：使用所选行为填补最后一个行为条结束到当前时间的空白，然后立即继续计时。

  ## 🔄 Improvements

  • 即使点击的不是最后一个行为，也会从最后一个行为条结束处开始填补，不再直接从当前时间新开一段行为。

  **Full changelog:** [v1.8.0...v1.9.0](https://github.com/roshad/Ro-s-ChronoTrace/compare/v1.8.0...v1.9.0)
