ReleaseNotes: |-
  Remio Host 2.6.2 - your monitor keeps its resolution with
  "Keep screen on".

  - Fixed: connecting from a phone could needlessly switch this PC's
    display to a lower resolution (for example 1600x900 dropping to
    1280x720) even though the picture on the phone looked exactly the
    same. The display now keeps its own resolution and the stream
    simply scales to your device; it only changes when the connected
    device's screen is a genuinely different shape and matching it
    removes black bars.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v2.6.2-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
