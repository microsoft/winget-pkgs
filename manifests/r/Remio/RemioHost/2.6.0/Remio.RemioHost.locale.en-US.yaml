ReleaseNotes: |-
  Remio Host 2.6.0 - new "Keep screen on" option, a tray icon that
  survives Explorer restarts, and self-healing device registration.

  - New: Keep screen on (Screen & Power). A session shows live on this
    PC's own screen instead of the screen going dark - handy when you
    are at the PC while someone you trust works on it. The stream
    switches to the closest size this screen supports and everything is
    put back when the session ends. Takes effect on the next connection.
  - This PC now repairs its own listing: if it ever failed to appear in
    your device list (a network blip during sign-in could cause that,
    permanently), the host re-registers itself on the next start.
  - Fixed the tray icon vanishing for good after Windows Explorer
    restarted - it now comes back on its own.
  - Fixed the shortcut doing nothing when Remio Host was already
    running - it now brings the window to the front.
  - Fixed a file-transfer notification that could corrupt other apps'
    tray icons.
  - The "this screen turns off while streaming" notice now only appears
    when the screens will actually go dark.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v2.6.0-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
