ReleaseNotes: |-
  Remio Host 3.1.2 - Keeps full resolution on large, fast screens like iPad Pro instead of dropping to half, and stops some PCs from dropping off about every minute when Windows screen capture keeps failing. Devices stay connected while the picture recovers, Settings gains a Language choice, and with the latest Remio app you can pick 1x or 2x display scaling from your device.
ReleaseNotesUrl: https://github.com/remioapp/releases/releases/tag/v3.1.2-win
PurchaseUrl: https://remio.net/download.html
InstallationNotes: |-
  Remio Host installs to Program Files and registers a Windows Service (RemioHostSvc) that
  spawns the main app into your interactive session at sign-in. After install, look for
  the Remio icon in your system tray.
