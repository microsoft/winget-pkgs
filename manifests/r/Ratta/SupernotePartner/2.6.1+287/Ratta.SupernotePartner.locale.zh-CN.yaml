PackageIdentifier: Ratta.SupernotePartner
PackageVersion: 2.6.1+287
PackageLocale: zh-CN
ShortDescription: Supernote 设备的桌面伴侣应用，用于管理同步笔记与文档，并支持键盘共享。
Description: Supernote Partner 是 Supernote 设备的桌面伴侣应用。这款桌面应用可以管理同步的笔记与文档，并提供键盘共享等实用功能：将 Supernote 设备配对后开启键盘共享，在设备上新建 Word 文档，即可方便地使用电脑键盘输入。
Tags:
- supernote
- 同步
- 笔记
- 墨水屏
ReleaseNotes: |-
  新增：
  -【文件】支持在文件列表中显示文件同步状态
  -【同步】支持在 Windows 资源管理器中显示文件同步状态标记
  -【同步】支持设置同步目录

  优化：
  -【笔记】提高了导出 TXT 时的文字识别准确率
  -【文档】支持选择 PDF 中希伯来语等从右向左书写的文本

  修复：
  -【笔记】修复了在部分 Windows 系统语言环境下打开笔记时误提示文件损坏的问题
  -【摘录】修复了删除摘录后无法再次导入该摘录的问题
  -【To-Do】修复了部分待办无法正常同步的问题
  -【同步】修复了部分文件因文件名规则差异产生同步冲突的问题
  -【同步】修复了特定场景下仅修改文件名大小写时出现同步异常的问题
