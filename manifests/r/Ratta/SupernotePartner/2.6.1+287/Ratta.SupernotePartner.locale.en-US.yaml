ShortDescription: A companion application for Supernote devices that manages synchronized notes and documents and enables keyboard sharing.
Description: Supernote Partner is a companion application for Supernote devices. This desktop application allows you to manage synchronized notes and documents, and offers features like keyboard sharing — pair your Supernote device, enable keyboard sharing, create a Word document on your device, and conveniently type on your PC's keyboard.
