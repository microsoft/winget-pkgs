ReleaseNotes: |-
  v0.7.0 开始提供 Windows ARM64 安装版与免安装版，主程序、特权服务与任务管理器替换均在 ARM64 上原生运行。进程页新增 27 个可选列与“创建内存转储文件”“调试”两项操作；新增字节单位设置，任务栏监控支持垂直任务栏，有新版本时可发送 Windows 通知。本版还减少了界面静止时的重绘，并修复 Ryzen 9000 传感器、任务栏监控遮挡开始按钮、特权服务注册被删除后无法重新安装等问题。
  本版完整重写了文档站，各项功能的详细用法可前往文档站查看。
  破坏性变更
  - 列菜单：进程列表的表头右键菜单不再按分类显示或隐藏列。单击菜单中的“选择列…”，在对话框中选择要显示的列。
  新功能
  - Windows ARM64：提供 ARM64 安装版与免安装版，主程序、特权服务、管理员运行与任务管理器替换均原生运行，应用内更新按 ARM64 版进行。性能页显示 ARM64 处理器的厂商、型号、指令集与虚拟化状态，CPU 功耗取自 Windows 能量计量；暂不提供内核传感器。（#172）
  - 进程列：“选择列”对话框新增 27 个可选列，包括运行时长、内核与用户 CPU、上下文切换、共享工作集、分页池与非分页池、硬缺页，以及磁盘与 I/O 的读写次数和累计值。未选中这些列时，采样开销不变。
  - 详细信息面板：列出进程列表全部可选列的读数，资源与累计两节增加上下文切换、硬缺页与每秒请求次数，工作集、提交大小等读数后附峰值。“复制详细信息”同样包含这些项。
  - 内存转储与调试：单个进程的右键菜单新增“创建内存转储文件”与“调试”。转储文件写入临时文件夹，完成后通知给出路径；系统登记了即时调试器时，“调试”启动该调试器并附加到进程。（#169、#197）
  - 字节单位：“设置 → 数据与历史”新增“字节单位”，可选传统风格（默认）、二进制 IEC 或十进制 SI。内存、存储容量、传输速率、图表刻度与各监控的读数随之切换。（#156）
  - 垂直任务栏：任务栏位于屏幕左侧或右侧时，任务栏监控沿任务栏竖排读数，四种样式均有竖排布局，只显示放得下的几项。（#177）
  - 新版本通知：窗口隐藏在托盘或未处于前台时，安装版在新版本下载并通过校验后、免安装版在发现新版本时发送 Windows 通知，单击通知即打开更新对话框。在“设置 → 更新”中关闭“有新版本时发送通知”后，改为在窗口显示时于右下角提示。
  - 切换页面：Ctrl+Tab 与 Ctrl+Shift+Tab 切换到下一个或上一个页面，到末尾后从另一端继续。（#185）
  - 顶部导航：页面栏空间不足时，顶部导航的标签先收为图标，指针悬停显示页面名称与快捷键；仍放不下时，页面控件才移到下一行。（#87）
  - 文档站：完整重写全部文档。新增“入门”一节，包括快速入门、什么是 Argus、安装与更新，以及与系统任务管理器的对比；使用指南按界面拆分为进程、性能、服务与启动项、连接、历史等页面，并按代码核对、补全了说明。
  性能
  - 界面重绘：内容不变的可见窗口不再随每次屏幕刷新重绘。在 160 Hz 显示器上，Argus 设置页静止时每秒的 CPU 周期约减半；动画与滚动的呈现帧率不变。
  修复
  - 托盘图标：默认样式改为“应用图标”，避免“走势”在深色任务栏上难以辨认；“组件”页改用下拉框选择托盘图标的样式。（#178）
  - 任务栏监控：任务栏按钮居中时，读数不再遮住开始按钮与任务按钮，只显示放得下的几项。组策略禁用小组件时，不再为小组件按钮留出空白。
  - 桌面监控：开机或重新启动 Argus 后，已开启的桌面监控直接显示，无需重新开关。
  - Ryzen 9000：CCD 内有禁用核心的型号（如 Ryzen 9 9900X3D）不再显示“未识别的传感器表”，可读取 PPT、TDC 的当前值与上限。核心映射校验通过后，还显示每核温度、电压与 C0／C1／CC6 驻留比例。（#203）
  - GPU 与 CPU 读数：独立显卡休眠时，GPU 页保留最近读到的“最高核心频率”。开启内核传感器、后台刷新间隔为 30 秒时，CPU 功耗与有效频率不再时有时无，后台期间的历史记录也不再缺少这几项。
  - 特权服务与内核传感器：服务的注册被安全软件或清理工具删除后，可在 Argus 中直接重新安装，无需先重新启动 Windows。PawnIO 被卸载或设备被删除后，已安装的驱动不高于 2.2.0 时，重新开启内核传感器即可自动重装驱动。
  - 管理员运行：任务计划程序残留同名注册时，仍可开启管理员运行；注册被拒绝时，提示可能受到 360 等安全软件的拦截。错误提示中的错误码只显示一次，HRESULT 以十六进制显示。
  - 任务管理器替换：开启替换后，管理员账户单击“临时打开系统任务管理器”不再没有反应。Argus 无响应时，任务管理器入口改开系统任务管理器，不再多等一轮超时。
  - 从右向左的文字：进程名称、描述与搜索框中的阿拉伯文、希伯来文等从右向左书写的文字不再倒序显示。（#155）
  - 菜单与面板：靠近窗口底部展开的长子菜单，末项不再被窗口底边截去。详细信息面板按最长的名称调整名称栏宽度，“专用 GPU 内存”等名称不再折成两行。Mica 窗口关闭对话框时，卡片不再闪白。
  - 更新后的图标：安装或更新后，桌面快捷方式与固定到任务栏的 Argus 立即显示新图标，无需重新启动电脑。
  升级提示
  - 特权服务：通信协议仍为第 12 版。Ryzen 9000 读数、后台的内核传感器功耗、任务管理器替换的修复，以及 Windows 11 24H2 之前以标准权限运行时的磁盘读写次数，均在服务更新后生效。安装版升级时会更新已安装的服务；免安装版须在“设置 → 权限 → 特权服务”中单击“更新服务”。
  - ARM64 电脑上的安装版：0.6.0 在 ARM64 电脑上仍下载 x64 安装包，x64 安装程序会提示改用 ARM64 版并退出。须从官网下载 Argus_0.7.0_arm64-setup.exe，覆盖安装到原位置，设置与历史数据保留；此后可在应用内更新 ARM64 版。
  - ARM64 电脑上的免安装版：退出 Argus，改用 Argus_0.7.0_arm64.exe 替换原程序。已开启“允许以管理员身份运行”时，先关闭该选项，替换后从新版重新开启。
  - 托盘图标：此前未改过样式的托盘图标，升级后显示应用图标。需要实时显示 CPU 占用时，在“组件”页的“托盘图标”中选择“走势”“占比”或“数字”。
