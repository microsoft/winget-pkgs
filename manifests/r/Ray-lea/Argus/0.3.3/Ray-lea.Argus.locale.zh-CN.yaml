ReleaseNotes: |-
  本版新增界面缩放与字体大小设置，完善窗口和列表偏好的保存，并调整 GPU 占用统计。
  新功能
  - 界面缩放：在“设置 → 语言与外观”中自定义 80%–150% 的缩放比例，默认 100%，可输入 113% 等整数比例。
  - 字体大小：基础字号可在 11–20 px 范围内调整，默认 13 px；可与界面缩放组合使用，立即生效并自动保存，两项均可单独恢复默认值。
  修复
  - GPU 统计：尝试修复部分计算负载下整体占用偏低、采样恢复时出现异常尖峰，以及多显卡或多引擎汇总偏高的问题；补充进程引擎计数及可用的 NVIDIA 核心利用率，并显示统计来源。(#19)
  - 窗口恢复：退出后重新启动可恢复窗口大小、位置和最大化状态；最小化退出不会让下次启动停留在最小化状态，屏幕外窗口会移回可用显示区域。
  - 列表偏好：进程、服务、启动项和连接列表分别保存排序列与升降序，服务和连接页也会恢复已选筛选条件。
  - 偏好保存：界面偏好独立保存并兼容旧版缓存迁移，清理界面缓存后仍可恢复已保存的偏好。
  - 布局与窗口按钮：大字号或较高缩放下，工具栏和导航可适配窄窗口，并校正最大化按钮的响应区域。
  升级提示
  - 从 v0.3.x 升级保留现有设置和历史记录；旧版界面偏好在首次启动时自动迁移，无需手动重新设置。
