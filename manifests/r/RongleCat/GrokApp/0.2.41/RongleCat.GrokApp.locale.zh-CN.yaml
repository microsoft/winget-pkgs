ShortDescription: 本机 Grok Build 的桌面指挥台：会话、项目、媒体与自动化（Tauri 2 · 非官方）。
Description: Grok App 不是 xAI 官方产品。它把本机 Grok Build CLI（grok agent stdio）收成桌面工作台：会话、项目、权限、媒体预览与已安排任务。在终端里跑 grok 很强，但日常工作台还缺一块：多项目、多会话、权限条、富媒体预览、定时任务、中英文界面。Grok App 解决的就是「指挥台」问题：安装 App 并准备好 Grok Build CLI，添加项目、新建会话，连接 Agent 使用。
