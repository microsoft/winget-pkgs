ShortDescription: Desktop workbench for Grok Build CLI — sessions, projects, media, automations (Tauri 2 · unofficial).
Description: 'Grok App is not an official xAI product. It wraps the local Grok Build CLI (grok agent stdio) into a desktop workbench: sessions, projects, permissions, media previews, and scheduled tasks. Manage multiple projects and sessions, review permission requests, preview rich media, run scheduled tasks, and interact with the agent through a Chinese/English Tauri desktop interface.'
