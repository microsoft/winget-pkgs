ReleaseNotes: |-
  Bugfixes
  - Fixed a bug where read-only containers using secrets could fail to start (#30301).
  - Fixed a bug where podman exec could fail to set oom_score_adj as rootless user (#30245).
  - Fixed a bug where the podman machine start command could create a VM that cannot be connected to on Windows if the host was shut down or restarted when the VM was running (#29971).
