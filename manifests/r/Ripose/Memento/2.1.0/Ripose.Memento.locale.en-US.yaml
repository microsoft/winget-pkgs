ReleaseNotes: "For the best experience install [Noto Sans CJK JP](https://github.com/googlefonts/noto-cjk/raw/main/Sans/Variable/TTF/NotoSansCJKjp-VF.ttf) and [Kanji Stroke Order](https://drive.google.com/uc?export=download&id=1oyQoTB531tbhlYaOW7ugvutXZ7HSlJfW) fonts.\n\n# Change Log\n\n• Optionally show furigana above subtitles\n• Make `{furigana}` and `{furigana-plain}` only show furigana over kanji when possible\n• Add the option to set explicit dark and light themes on Windows and macOS\n• Improve glossary rendering\n  • Add support for `<details>` tags\n  • Add support for monochrome images\n• Switch render backend from OpenGL to D3D11 on Windows\n• Allow custom mpv OSCs to handle mouse inputs\n• Keep player maximized when exiting fullscreen instead of always returning to windowed\n• Fix JSON audio sources sometimes breaking the add to Anki button\n• Fix file type filtering in **Add Subtitle** @karolba \n• Fix black flashing when resizing the window on macOS\n\n# Important for macOS users\n• Streaming does not work out of the box. To enable streaming, [follow the steps for installing yt-dlp in the README.](https://github.com/ripose-jp/Memento#macos-streaming-video-doesnt-work)"
