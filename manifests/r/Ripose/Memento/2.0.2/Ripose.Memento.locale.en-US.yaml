ReleaseNotes: "For the best experience install [Noto Sans CJK JP](https://github.com/googlefonts/noto-cjk/raw/main/Sans/Variable/TTF/NotoSansCJKjp-VF.ttf) and [Kanji Stroke Order](https://drive.google.com/uc?export=download&id=1oyQoTB531tbhlYaOW7ugvutXZ7HSlJfW) fonts. *The default font has changed from **Noto Sans JP** to **Noto Sans CJK JP**. You should install this new font if you haven't already.*\r\n\r\n# Change Log\r\n\r\n• Fix search results not showing up after clicking a link then closing the popup\r\n• Fix rare issue where text could become misaligned with the stroke layer\r\n• Fix blank items being added to recent files\r\n• Fix incorrect margins on **Application** settings\r\n• Improve search speed for modifier and middle click search\r\n• Make pressing the modifier key instantly start a search\r\n• Move some files and settings to `XDG_DATA_HOME` and `XDG_CACHE_HOME` on Linux\r\n\r\n# Important for macOS users\r\n• Streaming does not work out of the box. To enable streaming, [follow the steps for installing yt-dlp in the README.](https://github.com/ripose-jp/Memento#macos-streaming-video-doesnt-work)"
