ShortDescription: "Plain-English PC diagnostics, Detective Mode, stress tests & branded PDF certs"
Description: "Find out why a PC is slow, overheating, crashing, or restarting — with Detective Mode, Ask RigCheck, self-checking stress tests, and branded customer PDF certificates. Detective Mode & Ask RigCheck: Pick what's wrong (like 'My PC is slow') or type your own question — RigCheck Pro investigates locally and gives you the likely cause in plain English, with a confidence score, real evidence, and clear next steps. Self-Checking Stress & Burn-In Tests: Run 1-minute checks or sustained burn-in tests on the CPU, graphics card, graphics memory (VRAM), and RAM. Every test checks its own results for errors and stops automatically if a part gets too hot. Branded Customer PDF Certificates: Export a clean, one-page diagnostic certificate and full PDF/CSV report featuring your own shop name and logo — ideal for PC repair workshops, system builders, and used-PC buyers or sellers. 0-100 PC Health Score & Before/After Proof: Clear scores for Cooling, Storage, Memory, and Upgrade Readiness, plus a health timeline and Before/After comparisons to prove a repair or upgrade worked. Five Diagnostic Tools in One App: Combines a stress tester, live temperature/sensor monitor, SMART drive-health checker, 30-day crash-log reader, and performance benchmark — and never guesses missing sensors. 100% Private on the PC: Scan results, crash logs, and customer reports stay on the computer — no account sign-up, no tracking, and no cloud uploads. Crash Detective, Power Analysis & Quiet PC Checks: Quickly trace unexpected restarts, blue screens, power/throttling drops, and noisy fans from the last 30 days of Windows logs. Honest Upgrade & Gaming Advice: See what is holding back performance or games, and check whether free RAM slots or storage upgrades make sense before spending money. Background Tray Alerts: Get warned early about overheating, stopped fans, failing drives, low Windows drive space, and blue screens. Full Hardware & Laptop Battery Checks: View searchable hardware specs, startup apps, driver health, and laptop battery wear/cycle counts. Buy once, keep forever (£9.99 one-time payment): use on 1 PC at a time (moveable to a new PC anytime, up to 3 moves in 30 days), for both personal and commercial/business use. Includes 1 year of free updates. After 1 year, RigCheck Pro keeps working forever — you just won't get newer updates unless you choose to buy another year of updates for £4.99 (completely optional, never auto-renews). Requirements: Windows 10 (1903+) or Windows 11 (64-bit only — not Mac), Windows Administrator rights required to read hardware sensors. All diagnostics run locally on the PC; internet required for activation and a quick licence check every 14 days."
