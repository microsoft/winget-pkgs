ShortDescription: Finds out why a PC is slow, hot, crashing or restarting, with self-checking tests and a branded customer certificate.
Description: "PC diagnostic tool for repair shops and enthusiasts. Gives the likely cause in plain English with the evidence and how sure it is. CPU, graphics card, graphics memory and RAM stress tests verify their own results and stop if a part overheats or a sensor drops out. Produces a report and a one-page certificate with the shop's name and logo, from one click or the command line. Before/After, health timeline and benchmarks compare the PC with itself. Tray alerts for overheating, a stopped fan, a failing drive, a full Windows drive and blue screens. Five tools in one: stress tester, sensor monitor, drive-health checker, crash-log reader and benchmark. £9.99 one-time licence for one PC at a time, with 12 months of updates. Requires Windows 10 (1903 or later) or Windows 11, 64-bit, administrator rights, and internet for activation and at least every 14 days."
