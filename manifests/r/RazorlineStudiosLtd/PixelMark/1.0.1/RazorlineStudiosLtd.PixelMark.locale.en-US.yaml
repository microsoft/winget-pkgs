ShortDescription: "Batch watermark photos & PDFs locally with AI/crop protection & EXIF scrubbing"
Description: "Watermark hundreds of photos and PDFs in seconds on your own PC — with AI/crop removal protection, CSV auto-fill, batch resizing, and one-click GPS/EXIF scrubbing. Smarter Watermark Protection: Shows you the best spot to place your watermark so people can't easily crop it out or erase it with AI tools — complete with a live Protection Score and a one-click boost. Watermark Whole Folders at Once: Drop in hundreds of photos (including subfolders) and process them all in one go while keeping your exact folder layout intact. Hide Private Info in One Click: Automatically remove hidden GPS locations, camera serial numbers, and hidden preview thumbnails so you never accidentally share your home or client's address. Auto-Fill Names, Dates & Codes: Automatically stamp different text onto each photo (such as client names, product codes, or dates) from a simple spreadsheet (CSV) or the photo's built-in details. Photos & PDFs in One App: Works with everyday photos, camera RAW files, and standard or password-protected PDFs (stamp every page or just the pages you choose). 100% Private & Local: Your photos and PDFs never leave your computer — no account sign-up, no adverts, and no cloud uploads. Easy Design Studio: Add text, logos, QR codes, shapes, shadows, glows, outlines, gradients, or tiled watermarks — with a live Before/After slider and Undo/Redo. Resize While You Watermark: Automatically resize batches of photos on export to save time. Save Reusable Brand Kits: Store your logos, custom fonts, colours, and layouts for one-click reuse (and export them to back up or move to another PC). Right-Click in Windows: Right-click any photo or folder in File Explorer to watermark it straight away. Built-In Safety Nets: Includes pause, resume, retry, automatic crash recovery, and warnings so you never accidentally overwrite your original photos. Wide Format Support: Reads JPEG, PNG, WebP, AVIF, TIFF, HEIC, camera RAW, and PDF. Saves to JPEG, PNG, WebP, AVIF, TIFF, BMP, GIF, and PDF. Buy once, keep forever (£9.99 one-time payment): use on 1 PC at a time (moveable to a new PC anytime), for both personal and commercial/business use. Includes 1 year of free updates. After 1 year, PixelMark keeps working forever — you just won't get newer updates unless you choose to buy another year of updates for £4.99 (completely optional, never auto-renews). Requirements: Windows 10 (1809+) or Windows 11 (64-bit only — not Mac), 8 GB RAM, ~200 MB free space. All file processing runs locally on your PC; internet required for activation and a quick licence check every 14 days."
