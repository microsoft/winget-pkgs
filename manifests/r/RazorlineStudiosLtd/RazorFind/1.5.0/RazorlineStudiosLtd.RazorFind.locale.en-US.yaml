ShortDescription: "Whole-drive file search in milliseconds with duplicate finder & folder sizes"
Description: "Find any file or folder on your PC the moment you start typing — with millisecond whole-drive search, true duplicate-content detection, real folder sizes, and zero ads or tracking. Instant Results in Milliseconds: Search entire drives as you type — no more waiting on slow default Windows search. True Duplicate File Finder: Finds identical-content duplicate files (even if they have different filenames) so you can quickly spot and clear wasted space. See Real Folder Sizes: Tick one box to calculate true folder sizes and instantly spot which folders are filling up your drive. Always Up to Date Automatically: Quietly picks up new, renamed, or moved files in the background without slowing your PC down. Searches All Drives & USBs: Search one folder, your whole PC, external USB drives, or network folders in one place. 100% Private & Offline: Everything stays on your computer — zero adverts, zero tracking, no account sign-up, and no licence key needed. One-Click Timeline Filters: Narrow down results to Today, Yesterday, Last 7 days, Last 30 days, This year, or Over a year ago. Smart Filtering & Clutter Control: Filter by file type, exact name, starts-with, whole word, or case sensitivity — plus one-click Skip hidden/system and folder exclusions. Quick Keyboard Actions & CSV Export: Open files, jump to their folder, copy files or full file paths straight from the keyboard, and export your results to a spreadsheet (CSV). Ready Straight Away: Self-contained installer with everything bundled inside (including .NET) — installs and works completely offline. Free to download and use for personal or commercial use — no licence key, no subscription, no adverts, no tracking, and no account required. Requirements: Windows 10 or Windows 11 (64-bit only — not Mac). Everything needed (including .NET) is bundled inside — installs and works completely offline."
