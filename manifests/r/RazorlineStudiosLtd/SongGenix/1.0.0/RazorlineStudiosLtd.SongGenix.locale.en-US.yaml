ShortDescription: "Create unlimited AI songs & WAV tracks locally with 30s previews & lyric repair"
Description: "Create unlimited full AI songs and backing tracks on your own PC — with 30-second preview expansion, single-line lyric repair, reference track remix/cover, and clean WAV export. No Monthly Fees or Credit Limits: Create as many full songs, jingles, and backing tracks as you like right on your own PC — powered by open, commercial-friendly AI models (ACE-Step 1.5). 30-Second Preview to Full Song: Test ideas fast as a 30-second preview, then expand your favourite take into a full-length song keeping the exact same voice, tempo, key, and feel. Fix Single Lines Without Starting Over: Spot a lyric you want to change? Edit just that line or choose a time range to regenerate it — without throwing away the rest of the track. Write From a Prompt, Your Own Lyrics, or Remix a Track: Describe a mood or style in plain English and let SongGenix write structured verses and choruses, paste your own lyrics word-for-word, create pure instrumentals, or remix/cover a reference track you own. Built-In Waveform Player & Live Lyric Highlight: Listen back right inside the app with live synced lyrics that highlight as the song plays (for English vocals), then export clean studio-quality WAV audio. 100% Private on Your PC: Your lyrics, ideas, and finished songs never leave your computer — no account sign-up, no adverts, and no cloud uploads. Full Musical Control: Pick the lead singer (male/female/auto), voice style, language, speed/quality, song length, tempo (BPM), musical key, and time signature. Quick Inspiration Tools: Stuck for an idea? Pick an example genre or click Surprise me with AI to spark a fresh song concept. Project History & Crash Recovery: Keeps every preview and full take saved with its exact settings so you can compare takes — plus automatic crash recovery so you never lose work. One-Click Local Setup: No coding or manual Python setup — SongGenix installs and configures its local AI music engine for you automatically on first launch. Buy once, keep forever (£19.99 one-time payment): use on 1 PC at a time (moveable to a new PC anytime), for both personal and commercial/business use. Includes 1 year of free updates. After 1 year, SongGenix keeps working forever — you just won't get newer updates unless you choose to buy another year of updates for £9.99 (completely optional, never auto-renews). Requirements: Windows 10 (2004+) or Windows 11 (64-bit only — not Mac), NVIDIA GeForce GTX 10-series or newer recommended (runs much slower on CPU), 16 GB RAM, ~32 GB free disk space (first launch downloads the ~30 GB AI engine & models). All music generation runs locally on your PC; internet required for activation, initial model download, and a quick licence check every 14 days."
