ShortDescription: A privacy-first media player for Windows 11 that plays almost any music or video file, stream or disc.
Description: Media player built on the VLC engine that plays nearly every video and music format, discs and network streams. PlaySmith Auto picks settings for each file, and AutoFix steps in only when playback goes wrong, keeping your place. YouTube, Vimeo, Twitch and SoundCloud links play in the player, up to 1080p, once the helper it needs is allowed. Smart Crop removes black borders and the best audio and subtitle tracks are picked automatically. Volume matching across playlists. Bass control, equaliser, speed with pitch kept, A-B repeat, bookmarks, a Play Next queue and resume. Ask This Video searches subtitles to jump to a moment. Mini player, fullscreen, cast to a TV and snapshots. No adverts, tracking or account. Requires Windows 11, 64-bit.
