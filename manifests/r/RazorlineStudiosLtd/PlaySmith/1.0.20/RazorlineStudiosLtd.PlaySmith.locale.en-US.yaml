ShortDescription: "Free VLC-powered media player with AutoFix, volume matching & TV casting"
Description: "Play almost any video, music file, disc, or stream on Windows 10 & 11 — with smart AutoFix, playlist volume matching, subtitle search, TV casting, and zero ads or tracking. Plays Almost Anything Straight Out of the Box: Built on the proven VLC engine with everything bundled inside — plays nearly every video and audio format, folders, discs, and network streams with no extra codecs to hunt down. Smart Auto-Settings & AutoFix: Automatically picks the best settings for each file. If a video ever stutters, AutoFix quietly steps in to smooth it out without losing your place. One-Click Volume Matching: Balances the loudness across your playlist so you never get blasted by a loud track or struggle to hear a quiet one. Ask This Video Subtitle Search: Search inside a video's subtitles (SRT/VTT) for any spoken word or phrase and double-click to jump straight to that exact moment. Smart Crop & Auto Track Picker: Automatically removes annoying black borders and selects the best audio and subtitle tracks for you. Watch Online Links & Cast to Your TV: Play YouTube, Vimeo, Twitch, and SoundCloud links up to 1080p (using the optional built-in helper), or cast videos straight to Chromecast and smart TVs on your home network. 100% Private & Ad-Free: Zero adverts, zero tracking, no account sign-up, and no licence key needed — just install and play. Sound & Speed Controls: Dedicated bass slider right on the main screen, full equaliser, and playback speed control that keeps voices sounding natural (pitch lock). A-B Repeat & Bookmarks: Loop any section of a video or song (great for learning music or languages) and save bookmarks to jump back to favourite scenes. Playlists, Play Next & Auto-Resume: Save and load playlists, queue up what plays next, shuffle/repeat, and pick up right where you left off. Always-On-Top Mini Player & Snapshots: Keep a small video window floating while you work, switch to fullscreen, or grab instant video snapshots. Easy, Clean Install: Installs without needing Windows administrator rights and never forces itself over your existing default apps unless you choose it. Free to download and use for personal or commercial use — no licence key, no subscription, no adverts, no tracking, and no account required. Requirements: Windows 10 or Windows 11 (64-bit only — not Mac). All required components (including VLC libraries and .NET) are bundled inside — works completely offline for your own media files."
