ShortDescription: "Colourise & restore black-and-white family photos locally with zero cloud fees"
Description: "Bring old black-and-white family photos back to natural colour on your own PC — with batch album colourisation & gentle restoration, 5 colour looks, and zero cloud uploads. Realistic Local AI Colourisation: Powered by the DDColor Large neural AI engine for natural skin tones and lifelike colours — with unlimited photos and zero per-photo fees. 100% Private for Family Archives: Your treasured family photos never leave your computer — no website uploads, no account sign-up, no adverts, and no tracking. Batch Colourise & Restore Whole Albums: Process entire folders of black-and-white photos in one go — either colourising them or running gentle restoration (clean-up, contrast, and sharpening) across the whole list. 5 Adjustable Colour Looks & Strength: Switch between Natural, Documentary, Historically restrained, Cinematic, and Warm nostalgia — and fine-tune the strength slider until your photo looks just right. Originals Are Never Overwritten: Always saves your colourised or restored photo as a new file, while keeping your original photo details (date taken, camera info, captions, and keywords) intact. Works With or Without an NVIDIA Graphics Card: Uses NVIDIA graphics cards for fast batch speeds, and automatically runs on your PC's processor (CPU) if you don't have one. One-Click Before & After View: Instantly compare the original black-and-white photo against the finished colour result. Right-Click in Windows: Open and colourise photos straight from Windows File Explorer. Handles High-Resolution Scans: Opens and saves JPEG, PNG, TIFF, and BMP photos — including large scanned archive photos. Simple, Clean Interface: Designed to be easy to use straight away with no complicated editing menus. Buy once, keep forever (£14.99 one-time payment): use on 1 PC at a time (moveable to a new PC anytime), for both personal and commercial/business use. Includes 1 year of free updates. After 1 year, AI ColourBack keeps working forever — you just won't get newer updates unless you choose to buy another year of updates for £7.99 (completely optional, never auto-renews). Requirements: Windows 10 (1809+) or Windows 11 (64-bit only — not Mac), 8 GB RAM, ~3.5 GB free disk space, NVIDIA GeForce GTX 10-series or newer recommended for fastest speeds (also runs on CPU). All photo processing runs locally on your PC; internet required for activation, one-time AI model download on first run, and a quick licence check every 14 days."
