ShortDescription: "Unlimited local AI images with FLUX.2, SDXL, Visual Memory & likeness checks"
Description: "Create unlimited AI images on your own PC — with FLUX.2 Klein & SDXL-Lightning, Visual Memory reference reuse, built-in likeness checks, and zero monthly credits. No Monthly Fees or Credit Limits: Stop paying £20+/month for online AI tools. Generate as many images as you like directly on your own Windows PC with no queues or per-image charges. Reuse the Same Person, Product, Place or Brand: Add reference photos to Visual Memory and insert an @token so your characters, products, and brand style stay consistent across new images. Built-In Likeness & Quality Checks: Automatically checks each finished image locally — including face likeness and visual similarity scores against your reference photos. Two Powerful Local AI Models (One-Click Setup): Switch between SDXL-Lightning for super-fast renders and FLUX.2 Klein for top quality (~25-45 seconds on a 12 GB RTX card). No coding — the app downloads and configures everything in one click. Smart Low-VRAM & Hardware Support: Automatically adjusts to your graphics card (including 4-bit Low-VRAM mode for cards under 14 GB) so you get the best performance without fiddling with technical settings. 100% Private on Your PC: Your prompts, reference photos, and finished images never leave your computer — no account sign-up, no adverts, and no tracking. Beginner-Friendly Simple Mode: Just type what you want to see in plain English, pick Square, Portrait, or Landscape, choose Fast, Balanced, or Best quality, and click Generate. Project History & Visual Branching: Every image saves its prompt, seed, and model automatically so you can compare results and build new variations from any favourite image. Automatic Crash & Power-Cut Recovery: Automatically saves your project progress so you never lose unsaved work. Extra Control When You Want It: Lock a seed to tweak details, list things to avoid (negative prompts), and export or open your images in one click. Resumable Model Downloads: If your internet drops during the one-time model download, PicGenix picks up right where it left off. Buy once, keep forever (£19.99 one-time payment): use on 1 PC at a time (moveable to a new PC anytime), for both personal and commercial/business use. Includes 1 year of free updates. After 1 year, PicGenix keeps working forever — you just won't get newer updates unless you choose to buy another year of updates for £9.99 (completely optional, never auto-renews). Requirements: Windows 10 (2004+) or Windows 11 (64-bit only — not Mac), NVIDIA GeForce GTX 10-series or newer (8 GB+ VRAM recommended; runs much slower on CPU), 16 GB RAM, up to 27 GB free disk space (~5 GB app, ~6.5 GB SDXL-Lightning, ~15 GB FLUX.2 Klein). All image generation runs locally on your PC; internet required for activation, one-time model download, and a quick licence check every 14 days."
