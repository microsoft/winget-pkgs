ReleaseNotes: |-
  - Wires between modules (talent tree): every module has 5 ports, dragging port-to-port draws a link with styling (thickness, line style, section/half/custom color, direct/orthogonal/curved routing).
  - Module pens and submodules: custom containers on the canvas, section buttons as mini-modules, contents tree manages folders, visibility and order.
  - Files on the canvas (opt-in): drop files/folders from Explorer - file tiles get a shell icon, dir portals show newest files, app tiles can watch live PID/CPU/RAM.
  - Canvas profiles: several independent maps side by side (Work / Gaming / ...), each with its own layout, wires and settings; profile files appear in the map contents tree.
  - Map as the desktop (desk host): map content in a child window under Progman, wallpaper shines between tiles.
  - Z-order submenu, normal vs edit context menus, grid + magnetize, "show hidden" ghosts.
  - winget install: every release is submitted to the Microsoft catalog automatically.
  - Fixes: wires connect on drop, "map contents" opens, all windows resizable, F11 true fullscreen.
