ReleaseNotes: |-
  - HUD in a window - tray menu "Window": any layout can run in a standalone window; "new" opens an extra window at once (multiple windows of the same layout work too). Title bar carries opacity/zoom sliders, fullscreen F11, maximize and a layout dropdown.
  - clickable buttons in the window - button/bartender nodes respond to direct clicks in the windowed render.
  - window is monitor-independent - a layout can show on the HUD surface and in a window at the same time; window state lives in the layout JSON "win" section.
  - brand assets in the install - brand/ folder incl. the transparent C logo; inspector img-src combo offers them as app: references.
  - props App.InstallDir / App.DataDir / App.BrandDir / App.Version - app paths and version straight onto the canvas.
  - FIX: OSD cards on the right monitor - mixed per-monitor DPI setups clamped cards onto the primary; placement is now native SetWindowPos in physical pixels.
  - FIX: more resilient monitor enumeration - geometry reads pinned to per-monitor DPI context; impossible overlap state re-reads once.
  - FIX: OSD card shows "HUD hidden" when the HUD is hidden via Ctrl+Alt+H.
