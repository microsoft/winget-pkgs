ReleaseNotes: |-
  - splash screen at startup - borderless rounded frame, 80% opaque, brand/logo.png (replaceable), live startup step list, magenta -> cyan gradient progress; toggle in Settings -> System.
  - installer Install scope page - Full / Minimal / Custom module set, saved across reinstalls.
  - installer Modules page - all 16 app atoms as checkboxes; SimHub gated by SimHub presence and the Tools set.
  - Component manager - feat atoms with quarter presets, data overrides, disabled module = offline + activation prompt, OC button and deeplinks.
  - content packs - catalog in the Manager (install/remove/seed), 4 bundled layout packs (.cpk) in the installer.
  - tray menu as a user-composable tree - tray.items, custom grp.N groups, sep.N separators, editable Tools subtree.
  - Dashboard page in Settings - dash*.json profiles, canvas options, per-type tile forms, instant save (~400 ms repaint); Dashboard in the tray menu.
  - dash cards - rows[]/cells[] schema, colored sections, tpl:* templates, pinned col/row cells.
  - two-level edit mode - tiles as bricks (grid snap drag, resize grip, toolbar) + element inspector inside the tile via tile els overrides.
  - FIX: dash compile y convention - graphics anchor bottom, text baseline; boxes no longer drift from content.
  - FIX: window title buttons rendered; fullscreen escape; tray-spawned windows register prop demand.
