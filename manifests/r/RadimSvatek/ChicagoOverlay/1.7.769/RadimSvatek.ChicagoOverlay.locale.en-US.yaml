ShortDescription: Telemetry and hardware monitoring layer - HUD overlay, fan curves with watchdog service, RGB, LAN dashboard, free-form module map
Description: |-
  Chicago Overlay is a freeware monitoring and control layer for Windows 10/11.
  It unifies SimHub telemetry and native hardware sensors (CPU, GPU, motherboard,
  voltages, fans, flow) into one property bus that can be drawn anywhere:
  a drag-and-drop HUD overlay, a live wallpaper under desktop icons, tray icons
  with mini-graphs, a LAN dashboard for phones, tablets and Raspberry Pi panels,
  RGB lighting and addressable LED matrices.
  Fan curves are guarded by a Windows service watchdog that returns fans to safe
  automatic control if the app or driver fails. A free-form spatial module map
  replaces nested settings menus - modules snap together, connect with wires and
  can optionally host file tiles and folder portals dropped from Explorer.
  Demand-driven pipeline computes only the sensors actually on screen.
