ReleaseNotes: |-
  - Guardian is a map module - standalone Guardian window (/guardian, menu entry, map tile): live service/process status, "as a Windows service" checkbox, restart/fans/RGB duties one by one and fallback duty.
  - "show hidden" checkbox on the map - hidden modules show as translucent ghosts at their original spot, clicking a ghost restores it in place.
  - Map gets a grid like the inspector's - a real square mesh with per-axis cell W x H, line width and a separate "magnetize to grid" checkbox.
  - Dragging a module off the canvas is now clamped; the canvas grows behind dragged modules and off-screen spots are rescued back to the edge.
