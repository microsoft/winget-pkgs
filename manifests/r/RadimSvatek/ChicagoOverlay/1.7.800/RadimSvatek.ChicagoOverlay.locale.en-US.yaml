ReleaseNotes: |-
  - Source Manager - a new window with a data-flow map: all sources on the left (SimHub, LHM, system, EQ, poller, hook, mqtt, hwinfo, voice, router, Elite, music, Plex, OBS, HA, printers, remote, guardian...), the props engine with prop count in the middle, outputs on the right (live link, LAN dashboard, LED/aura, stream sinks). Live states with a reason, green=active wires.
  - click a node = detail - channel ON/OFF, host/port/url/every editing straight from the channel JSON (atomic writes), buttons to the full channel editor; node positions drag and persist.
  - remote SimHub (engineer role) - the SimHub plugin gains an "App host" field: the driver enters your IP and telemetry flows over the LAN straight into your app; "LAN bind" checkbox on the app side (off by default).
  - needle node type - rotating PNG for custom dashes (steering wheel / gauge needles): any transparent image rotates around a cx/cy % pivot driven by a prop; min..max maps to a0..a1 degrees, steering beyond 360 deg works; smooth = ms exponential smoothing.
  - Source Manager everywhere - tray Sources item, Control Center actions card, module map tile, CLI /srcman and /obj.page.srcman.
  - FIX: windows opened from the tray menu or a pipe fell below normal windows - ShowRestored does a topmost bump after Activate.
  - CHG: tray and OC Sources unified - just data mode (Auto/Live/Demo), EQ engine and links to Channels/Manager/plugin; per-source checkboxes live in the Source Manager.
  - CHG: map "under icons" (desk) mode removed - Windows 11 24H2+ raised desktop does not render foreign windows under icons at all; hostmode: desk migrates to win.
