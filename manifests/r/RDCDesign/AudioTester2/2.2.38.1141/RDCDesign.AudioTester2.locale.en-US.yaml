ShortDescription: Scans music libraries and fully decodes every file to find corrupt audio
Description: |-
  AudioTester2 scans folders and drives and verifies that every audio file is structurally sound and that its audio decodes cleanly, not just that it opens.
  It supports FLAC, MP3, WAV, AIFF, MP4/M4A, Opus, Ogg Vorbis, APE, Musepack, Shorten and DSD, and checks cue sheets, playlists and checksum files for broken references.
  Results are kept in a database, so later scans only retest what changed and the whole library stays searchable.
