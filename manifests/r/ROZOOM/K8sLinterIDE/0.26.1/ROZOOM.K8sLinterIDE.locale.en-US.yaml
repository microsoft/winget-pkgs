ShortDescription: Desktop Kubernetes manager that runs on your machine and installs nothing in the cluster.
Description: |-
  ROZOOM is a desktop app for Kubernetes. It talks to the API server directly from your machine: no agent, operator or DaemonSet runs in the cluster.
  Connect a local cluster, an API server URL with a service-account token, or contexts from your kubeconfig, then work with workloads, Helm releases, RBAC and cluster health across every connected cluster.
  kubectl and Helm are bundled with the app.
