ShortDescription: Remote Connection Manager - SSH terminal, SFTP/FTP, Remote Desktop, VNC, RustDesk, tunnels and live server status in one window.
Description: |-
  REGTeches RC puts every server, PC and device you connect to in one window. It has a full-screen SSH terminal with
  auto-reconnect, a drag-and-drop SFTP/FTP/FTPS file manager, one-click Remote Desktop, VNC, RustDesk, web and PowerShell
  connections, SSH tunnels, jump servers, Wake-on-LAN, live status dots and a home Overview. No installer: it runs from
  one EXE and keeps its data (servers, settings, trusted host keys) next to it.
