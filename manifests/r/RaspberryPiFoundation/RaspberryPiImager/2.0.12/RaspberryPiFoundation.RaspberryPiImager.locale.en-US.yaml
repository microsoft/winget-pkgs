ReleaseNotes: |-
  Raspberry Pi Imager 2.0.12 includes:
  - Improved write reliability, including detection of incomplete downloads and prevention of false success messages after cancelled writes.
  - Enhanced OS customisation with improved Wi-Fi and WPA3 compatibility.
  - Improved Raspberry Pi Connect authentication and device configuration.
  - Better network detection and recovery in the embedded Raspberry Pi network installer.
  - Security hardening for privileged operations and file handling.
  - Improved Compute Module flashing and recovery.
  - Windows installer improvements and more reliable virtual disk handling.
  - User interface, accessibility and localisation improvements.
  - Updated Qt to version 6.11.2 and expanded automated testing.
  See the official release notes for Raspberry Pi Imager 2.0.12:
  https://github.com/raspberrypi/rpi-imager/releases/tag/v2.0.12
