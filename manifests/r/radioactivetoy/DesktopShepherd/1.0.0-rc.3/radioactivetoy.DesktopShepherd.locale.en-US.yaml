ShortDescription: Tidy, frosted-glass boxes for your Windows 11 desktop icons, plus widgets.
Description: |-
  DesktopShepherd puts translucent, frosted-glass boxes on your Windows 11 desktop. Boxes hold
  your desktop files, folders and shortcuts, or small widgets such as a clock, weather or a
  calendar. The boxes sit behind your windows, like the desktop itself, and the program uses
  very little memory and almost no processor time. No telemetry, no web engine; it never hooks
  into Explorer.
