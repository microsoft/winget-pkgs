ShortDescription: A very fast formatter, linter and code-health scorer for R, written in Rust.
Description: >-
  HoovR formats and lints R source and scores it against code-health budgets, from a
  single static binary with no R installation required. It targets parity with styler
  and air for formatting and with lintr for linting, and every parity and performance
  number it claims comes from a harness in its repository that anyone can re-run.
