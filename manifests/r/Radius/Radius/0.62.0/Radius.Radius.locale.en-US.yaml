ReleaseNotes: |-
  ## Announcing Radius v0.62.0

  Today we're happy to announce the release of Radius v0.62.0. Check out the [highlights](#highlights) below, along with the [full changelog](#full-changelog) for more details.

  We would like to extend our thanks to all the [new](#new-contributors) and existing contributors who helped make this release possible!

  ## Intro to Radius

  If you're new to Radius, check out our website, [radapp.io](https://radapp.io), for more information. Also visit our [getting started guide](https://docs.radapp.io/getting-started/) to learn how to install Radius and create your first app.

  ## Highlights

  ### Radius.Core is now the default for the CLI

  `rad env`, `rad app`, `rad init`, `rad workspace create`, and `rad resource list` now target the Radius.Core resource model without the `--preview` flag. The legacy `rad recipe register/unregister/list/show` commands are removed. Update any scripts that pass `--preview` or use those commands.

  ### Version-pinned Helm chart images

  The Helm chart now pins Radius component images to the full release version. Restarting pods no longer picks up later patches implicitly. Upgrade the chart to receive patched images. See [Upgrading](#upgrading-to-radius-v0620-rc1) for override behavior.

  ### Default Kubernetes recipe pack

  Radius now embeds a pinned Kubernetes Recipe Pack from the `/resource-types-contrib` repo and builds the default recipe pack from it, so new environments get a working set of Recipes out of the box. See the [Kubernetes Recipe Pack](https://github.com/radius-project/resource-types-contrib/tree/main/recipe-packs/kubernetes) in the repo for more details.

  ### Store Terraform recipe state in S3 or Azure Blob Storage

  Radius can now store Terraform recipe state in your own S3 bucket or Azure Blob Storage container instead of only in Kubernetes secrets. Learn more in the [Terraform state docs](https://docs.radapp.io/management/terraform-state/).

  ### Reliability improvements

  Many retry and robustness fixes make the CLI and deployments more resilient to transient failures. They cover Bicep recipe downloads, Terraform provider discovery, API server reads, and managed secret deletion. Azure resource deletion now selects supported API versions and deletes in dependency order. Radius type version skew warns before deployment. Digest-pinned Bicep recipe sources are supported.

