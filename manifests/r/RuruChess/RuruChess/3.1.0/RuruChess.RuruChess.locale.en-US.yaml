ShortDescription: Free open-source chess analysis, reference database, and live study app for Windows
Description: |-
  Ruru Chess is a free, open-source Windows chess application built for deep engine analysis, fast local reference databases, and live study with friends.

  Key features:
  - Engine Analysis & Reference Databases: Analyze with Stockfish, Leela (Lc0), and Maia, run full-game blunder checks, and search millions of games in your own local .pgn, .cbh, .cbv, and .si4 files (including .7z and .zip archives).
  - Live Analysis & Play with Friends: Play games together or share live analysis rooms with voice, camera, chat, teams, PGN sharing, and synced video.
  - PDF Book Importer: Turn PDF chess books into interactive playable games and exercises.
  - Opponent Prep & Training: Prepare for opponents and train tactics, endgames, strategy lessons, and opening repertoires.
  - Lichess & Chess.com Integration: Automatically sync and analyze your online games.
