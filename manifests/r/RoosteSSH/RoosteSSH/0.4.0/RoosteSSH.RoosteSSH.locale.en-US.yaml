ShortDescription: A fast, memory-safe SSH client with tabs, split panes, SFTP and port forwarding.
Description: |-
  Rooste SSH is an open-source SSH client written in Rust. It keeps saved sessions in a searchable
  manager and opens them in tabs and split panes, with an SFTP file panel, local, remote and SOCKS
  port forwarding, jump hosts, agent and X11 forwarding, a key generator and converter, a built-in
  SSH agent and scripting. Telnet, raw TCP and serial connections are supported too.
