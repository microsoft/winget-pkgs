ShortDescription: A small dashboard for HWiNFO, with warning lines and history.
Description: |-
  HW Deck shows the HWiNFO sensors you pick as tiles, an overview or a grid, with yellow and red warning lines, graphs up to 7 days back, game sessions and a bottleneck reading. It keeps watching from the tray.
  It reads HWiNFO's shared memory, so HWiNFO has to be running with Shared Memory Support turned on.
