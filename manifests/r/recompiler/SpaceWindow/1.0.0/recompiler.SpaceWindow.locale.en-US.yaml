ShortDescription: See where your disk space goes - a modern Windows 11 remake of the classic SpaceMonger.
Description: 'SpaceWindow draws everything on a drive or in a folder as a map: every file is a box sized by the space it takes on disk, nested inside the boxes of its folders, so the biggest space hogs are the biggest boxes on the screen. The same map can also be drawn as a pie chart, and the whole app can wear a theme such as Dracula. Point at anything to see what it is, double-click a folder to zoom in, and clean up straight from the map.'
