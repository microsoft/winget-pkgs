ShortDescription: Rechnungen einfach und komfortabel mit regibill versenden.
Description: regibill Desktop erlaubt Ihnen das einfache und komfortable Versenden von Rechnungen mittels regibill standard und regibill premium. Sie liefern die Rechnungen in ein Übergabeverzeichnis und regibill Desktop extrahiert per Knopfdruck die Empfängeradressen aus den PDF Dateien, registriert die Transaktionen und versendet die Rechnung per E-Mail (SMTP). Optional können Sie weitere Werte automatisch aus den PDF Dateien extrahieren (mit Regular Expressions) und diese dann im Nachrichtentext und dem Betreff verwenden. Weiterhin bietet es die Option PDF Dateien Seitenweise zu trennen. Die verwendeten E-Mail Texte können Sie dabei frei gestalten.
