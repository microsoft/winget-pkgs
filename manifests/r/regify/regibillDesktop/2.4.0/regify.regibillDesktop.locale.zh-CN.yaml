ShortDescription: 使用 regibill 方便快捷地发送发票。
Description: regibill desktop 让您能够通过 regibill standard 和 regibill premium 轻松便捷地发送发票。您只需将发票放入处理目录，regibill desktop 就会一键从 PDF 文件中提取收件人地址、注册交易并通过电子邮件（SMTP）发送发票。您还可以选择使用正则表达式从 PDF 文件中自动提取更多值，并将其用于邮件正文和主题。它还支持将 PDF 文件拆分为单页。所使用的邮件内容可以自由定制。
