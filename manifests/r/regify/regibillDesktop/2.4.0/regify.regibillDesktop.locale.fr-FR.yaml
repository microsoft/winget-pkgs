ShortDescription: Envoyez facilement et confortablement des factures avec regibill.
Description: regibill desktop permet d'envoyer facilement des factures d'une façon pratique en utilisant regibill Private et regibill Professionnal. Vous devez simplement fournir et déposer vos factures dans le dossier de traitement et regibill desktop va extraire l'adresse électronique du destinataire à partir du PDF, enregistrer les transactions et finalement envoyer les factures par e-mail (SMTP) en appuyant sur un seul bouton. Optionnellement, vous serez capable d'extraire automatiquement plus de données des fichiers PDF, en utilisant des expressions régulières, et en les insérant dans le sujet et corps du document. Une option de découpage d'un fichier PDF composé de plusieurs pages en plusieurs fichiers composé d'une seule page est aussi disponible. Les messages utilisés peuvent être adaptés librement à vos besoins.
