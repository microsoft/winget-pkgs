ShortDescription: Envoyez facilement et confortablement des bulletins de salaire avec regipay.
Description: regipay desktop permet d'envoyer facilement des bulletins de salaire d'une façon pratique en utilisant regipay. Vous devez simplement fournir et déposer vos bulletins de salaire dans le dossier de traitement et regipay desktop va extraire l'adresse électronique du destinataire à partir du PDF, enregistrer la transaction et finalement envoyer les factures par e-mail (SMTP) en appuyant sur un seul bouton. Optionnellement, vous serez capable d'extraire automatiquement plus de données des fichiers PDF, en utilisant des expressions régulières, et en les insérant dans le sujet et corps du document. Une option de découpage d'un fichier PDF composé de plusieurs pages en plusieurs fichiers composé d'une seule page est aussi disponible. Les messages utilisés peuvent être adaptés librement à vos besoins.
