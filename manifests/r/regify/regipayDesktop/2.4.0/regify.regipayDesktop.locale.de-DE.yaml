ShortDescription: Gehaltsabrechnungen einfach und komfortabel mit regipay versenden.
Description: regipay Desktop erlaubt Ihnen das einfache und komfortable Versenden von Gehaltsabrechnungen mit regipay. Sie liefern die Gehaltsabrechnungen in ein Übergabeverzeichnis und regipay Desktop extrahiert per Knopfdruck die Empfängeradressen aus den PDF Dateien, registriert die Transaktionen und versendet die Gehaltsabrechnung per E-Mail (SMTP). Optional können Sie weitere Werte automatisch aus den PDF Dateien extrahieren (mit Regular Expressions) und diese dann im Nachrichtentext und dem Betreff verwenden. Weiterhin bietet es die Option PDF Dateien Seitenweise zu trennen. Die verwendeten E-Mail Texte können Sie dabei frei gestalten.
