ShortDescription: Send payslips conveniently and securely using regipay.
Description: regipay desktop allows the easy and convenient sending of payslips using regipay. You deposit the payslips into the processing directory and regipay desktop will extract the recipient addresses from the PDF files, registers the transactions and sends the payslips via e-mail (SMTP) by pressing a single button. Optionally, you can automatically extract more values from the PDF files (using regular expressions) and use them in the message body and subject. It also offers you an option to split PDF files to single pages. The used e-mail messages can be adopted freely to your needs.
