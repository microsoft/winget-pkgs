ShortDescription: 使用 regipay 方便快捷地发送工资单。
Description: regipay desktop 让您能够通过 regipay 轻松便捷地发送工资单。您只需将工资单放入处理目录，regipay desktop 就会一键从 PDF 文件中提取收件人地址、注册交易并通过电子邮件（SMTP）发送工资单。您还可以选择使用正则表达式从 PDF 文件中自动提取更多值，并将其用于邮件正文和主题。它还支持将 PDF 文件拆分为单页。所使用的邮件内容可以自由定制。
