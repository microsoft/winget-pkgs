ShortDescription: Four simple video tools — make smaller, convert, trim, and extract audio. Free, fast, and on your device.
Description: |-
  Clip Squeezer is a free and open-source desktop utility that makes common video tasks simple:
  - Make smaller: Compress phone, screen-recording, or camera videos with simple quality choices.
  - Convert: Switch between MP4, MOV, MKV, WebM, and GIF without quality loss when possible.
  - Trim: Visual timeline trimming to cut setup time or unwanted sections before sharing.
  - Extract audio: Save audio tracks directly as MP3, M4A, or original stream quality.
  Everything runs locally on your device with FFmpeg handling the backend. No accounts, no ads, and nothing is uploaded to the cloud.
