ShortDescription: YouTube Music desktop app for Windows with an equalizer, synced lyrics, themes and global shortcuts.
Description: |-
  YouputDesk runs the real music.youtube.com, so Google sign-in and Premium work as usual, and adds a 10-band
  equalizer, synced lyrics, themes (including one that follows the album art), rebindable global shortcuts,
  ad alerts, a tray mini player, taskbar controls and optional Discord status. No accounts, analytics or tracking.
