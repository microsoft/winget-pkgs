ShortDescription: "Rons Data Compare: Compare tabular files"
Description: |
  Rons Data Compare compares and synchronizes two CSV or tabular text files on Windows.

  Match rows by order, by selected columns, or by key fields. Differences are marked at the row, column, and cell. Step through additions, deletions, and changes, and apply an update in either direction at cell, row, column, or dataset level. Each file keeps its own undo history.

  Search, replace, and sort while you review. Scroll lock keeps the two grids aligned. Import from a file or the clipboard.

  Files stay on the computer.

  Display language: English, German, French, Spanish, Portuguese, Italian, Dutch, Japanese, Simplified Chinese, and Korean.
