ShortDescription: "Rons Markdown Edit: Windows markdown editor"
Description: |
  Rons Markdown Edit is a Windows editor for markdown documents.

  Open .md and .markdown files in tabs, and work from a folder list. Apply headings, quotes, bullet lists, numbered lists, task lists, links, images, tables, code blocks, and horizontal rules. Bold, italic, strikethrough, and inline code apply to the selection. Preview HTML beside the document or below it. Find and replace, check links, and show line numbers or whitespace.

  Copy the selection as markdown or HTML. HTML on the clipboard can be pasted as markdown.

  Spelling dictionaries: English (United States, United Kingdom, and Canada), German, French, Spanish, Portuguese, Italian, Dutch, Japanese, Simplified Chinese, and Korean.

  Display language: English, German, French, Spanish, Portuguese, Italian, Dutch, Japanese, Simplified Chinese, and Korean.
