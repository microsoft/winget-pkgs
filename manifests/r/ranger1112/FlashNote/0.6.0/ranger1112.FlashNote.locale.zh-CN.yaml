ShortDescription: 按全局快捷键唤起的桌面速记悬浮窗，内容按日期保存为本地 Markdown 文件。
Description: 看文章、看视频时不打断思路的桌面速记小窗。按一下全局快捷键，小窗浮在当前窗口上方；写下想法，Ctrl+Enter 保存后窗口自动收起，焦点回到原来的文章或播放器。内容按日期追加到本地 Markdown 文件，不注册账号、不上传云端。支持全局唤起与无边框悬浮、两种保存方式、自动记录来源窗口标题、草稿不丢、可选 WebDAV 云同步、Markdown 模式、笔记历史（全文检索与编辑）、系统托盘、单实例运行、自动更新以及主题与背景不透明度调节。
Tags:
- markdown
- 笔记
- 速记
ReleaseNotes: |-
  下载

  | 版本   | 文件                             | 说明                                       |
  | ------ | -------------------------------- | ------------------------------------------ |
  | 安装版 | FlashNote_0.6.0_x64-setup.exe    | 双击安装，按当前用户安装，无需管理员权限   |
  | 便携版 | FlashNote_0.6.0_portable_x64.zip | 解压后直接运行 flashnote.exe，不写安装目录 |

  校验下载文件：
  Get-FileHash .\FlashNote_0.6.0_x64-setup.exe -Algorithm SHA256
  结果应与 SHA256SUMS.txt 中对应行一致。
  本次更新
  新增
  - 云同步新增「GitHub 仓库」方式：用自己的私有仓库当同步空间，与 WebDAV 共用同一套引擎（按日期文件、条目级合并、冲突副本）。版本用 Git 的 blob sha，删除可正常传播；每个变更文件一次提交。
  - 保存后自动提交到 Git：在设置里开启后，每次保存 / 编辑 / 删除以及每轮同步的新内容都会在笔记目录提交一次，可用 git log 回溯；只提交 *.md，不产生空提交，不 clone/push，也不接触远端凭据。首次开启可在设置里一键 git init。
  - 标签：正文里写 #工作、#idea 即被识别为标签，历史面板显示为圆角块，点一下按该标签筛选，再点一次取消。格式不变，仍是纯 Markdown，同步与外部编辑都不受影响。
  - 标签搜索按精确匹配：输入 #工作 不会带出 #工作台；普通关键词仍是子串匹配。
  - 历史面板的日期分隔行显示这一天文件的同步状态（已同步 / 待同步 / 有冲突副本），状态按日期文件的 local_sha256 与磁盘内容比对，随同步结束自动刷新（#64）。
  安全修复（包含原计划随 0.5.2 发布的修复）
  - 预览里的 <area> 链接不再能绕过拦截把主窗口导航到远程页面：新增全局 on_navigation 守卫，预览只保留 HTML profile，并剥离 area/map/SVG/表单控件与 class/id，防止 UI 伪装。
  说明
  - 支持 Windows 10 / 11，需要 WebView2 运行时（系统一般已自带）。
  - 安装包未做代码签名，首次运行可能出现 SmartScreen 提示，选择「更多信息 → 仍要运行」即可。
  - 便携版的自动更新会安装到 %LOCALAPPDATA%\FlashNote，届时会变成安装版；想保持纯便携请手动替换 flashnote.exe。
  - 完整变更见 CHANGELOG.md。
