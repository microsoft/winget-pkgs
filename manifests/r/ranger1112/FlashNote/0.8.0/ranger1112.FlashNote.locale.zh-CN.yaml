ShortDescription: 按全局快捷键唤起的桌面速记悬浮窗，内容按日期保存为本地 Markdown 文件。
Description: 看文章、看视频时不打断思路的桌面速记小窗。按一下全局快捷键，小窗浮在当前窗口上方；写下想法，Ctrl+Enter 保存后窗口自动收起，焦点回到原来的文章或播放器。内容按日期追加到本地 Markdown 文件，不注册账号、不上传云端。支持全局唤起与无边框悬浮、两种保存方式、自动记录来源窗口标题、草稿不丢、可选 WebDAV 云同步、Markdown 模式、笔记历史（全文检索与编辑）、系统托盘、单实例运行、自动更新以及主题与背景不透明度调节。
Tags:
- markdown
- 笔记
- 速记
ReleaseNotes: |-
  新增
  - 速记编辑器改为 CodeMirror 实时渲染：标题、有序/无序/任务列表、引用、代码块与分割线就地呈现，粗体、斜体、删除线、行内代码和链接同样生效；光标移到语法上时显示原始 Markdown 标记，源码原样保存、不做重写。底部新增「源码」开关。
  - 列表回车自动续写（有序编号递增、空白项一次回车退出），列表内 Tab / Shift+Tab 缩进；输入法组合期间不重算渲染。
  - 历史面板新增「续写」：一键把记录载入主编辑区继续写，保存时更新原记录；编辑区已有内容会先保存为新记录。原面板内行内编辑保留。
  修复
  - 切换历史、设置等面板时不再闪出底层窗口：面板淡入期间保留卡片底色，覆盖层只负责内容层。
  - 历史面板在触摸屏上纵向滑动时不再左右漂移；宽 Markdown 表格改为在自身内部横向滚动。
