ShortDescription: 按全局快捷键唤起的桌面速记悬浮窗，内容按日期保存为本地 Markdown 文件。
Description: 看文章、看视频时不打断思路的桌面速记小窗。按一下全局快捷键，小窗浮在当前窗口上方；写下想法，Ctrl+Enter 保存后窗口自动收起，焦点回到原来的文章或播放器。内容按日期追加到本地 Markdown 文件，不注册账号、不上传云端。支持全局唤起与无边框悬浮、两种保存方式、自动记录来源窗口标题、草稿不丢、可选 WebDAV 云同步、Markdown 模式、笔记历史（全文检索与编辑）、系统托盘、单实例运行、自动更新以及主题与背景不透明度调节。
Tags:
- markdown
- 笔记
- 速记
ReleaseNotes: |-
  下载

  | 版本   | 文件                             | 说明                                       |
  | ------ | -------------------------------- | ------------------------------------------ |
  | 安装版 | FlashNote_0.8.0_x64-setup.exe    | 双击安装，按当前用户安装，无需管理员权限   |
  | 便携版 | FlashNote_0.8.0_portable_x64.zip | 解压后直接运行 flashnote.exe，不写安装目录 |

  校验下载文件：
  Get-FileHash .\FlashNote_0.8.0_x64-setup.exe -Algorithm SHA256
  结果应与 SHA256SUMS.txt 中对应行一致。
  说明
  - 支持 Windows 10 / 11，需要 WebView2 运行时（系统一般已自带）。
  - 安装包未做代码签名，首次运行可能出现 SmartScreen 提示，选择「更多信息 → 仍要运行」即可。
  - 便携版的自动更新会安装到 %LOCALAPPDATA%\FlashNote，届时会变成安装版；想保持纯便携请手动替换 flashnote.exe。
  - 完整变更见 CHANGELOG.md。
