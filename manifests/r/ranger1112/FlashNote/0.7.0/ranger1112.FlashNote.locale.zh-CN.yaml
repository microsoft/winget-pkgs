ShortDescription: 按全局快捷键唤起的桌面速记悬浮窗，内容按日期保存为本地 Markdown 文件。
Description: 看文章、看视频时不打断思路的桌面速记小窗。按一下全局快捷键，小窗浮在当前窗口上方；写下想法，Ctrl+Enter 保存后窗口自动收起，焦点回到原来的文章或播放器。内容按日期追加到本地 Markdown 文件，不注册账号、不上传云端。支持全局唤起与无边框悬浮、两种保存方式、自动记录来源窗口标题、草稿不丢、可选 WebDAV 云同步、Markdown 模式、笔记历史（全文检索与编辑）、系统托盘、单实例运行、自动更新以及主题与背景不透明度调节。
Tags:
- markdown
- 笔记
- 速记
ReleaseNotes: |-
  新增
  - 可选应用锁：密码解锁，有效期可选 30 分钟 / 2 / 4 / 8 / 24 小时；标题栏与托盘均可立即上锁。锁定时界面与笔记、设置、同步等敏感命令都会被拦截；应用锁只保护界面，不加密磁盘上的笔记。
  修复
  - 同步：本地文件意外消失且远端版本令牌变化时，不再把远端唯一副本误删；「本地全部消失」安全阀把待恢复文件也计入。
  - 设置文件被杀软或同步盘短暂锁住时，本次运行不再用默认值覆盖原配置；读不出来时会提示「修改不会保存」。
  - OneDrive「按需文件」的云端占位符不再被误判为符号链接，保存与历史恢复正常。
  - Markdown 模式下正文里形如 - 10:00、### 10:00 的行不再被拆成新条目，删除幽灵条目也不会带走正文。
  - 托盘「打开今日笔记」拒绝符号链接；Git 自动提交只认真实 .git 目录，gitfile 重定向不再操作目录外仓库。
  - 笔记数量多时自动提交不再因 Windows 32K 命令行上限失败。
  - 合并结果超过 2 MiB 时改为保留冲突副本；同步警告会显示在状态行与悬停提示里。
  - 网络共享笔记目录的「定位」不再因 \\?\UNC\ 前缀失败。
  - WebDAV 回读校验不再无条件重写；Hash 版本复核后用 GET 的强 ETag 做条件删除/写入，降低覆盖并发编辑的风险。
  - 条目编辑保存期间的新输入不再丢失；重开设置面板不再清空未保存的同步表单；跨 DPI 多屏恢复使用保存位置所在显示器的缩放。
  - 清除同步密码时一并删除 0.5.x 旧凭据，避免迁移回退把已清除的密码重新搬回来。
  - NSIS 安装包与卸载程序改用应用图标，不再显示 NSIS 默认图标。
