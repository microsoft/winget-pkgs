PackageIdentifier: ranger1112.FlashNote
PackageVersion: 0.5.1
PackageLocale: en-US
ShortDescription: Desktop quick-note popover that saves entries to daily local Markdown files.
Description: A desktop quick-note popover that keeps your train of thought intact while reading articles or watching videos. Press the global hotkey and a small window floats above the current window; jot down the thought, save with Ctrl+Enter, and the window tucks itself away with focus back on the previous application. Entries are appended by date to local Markdown files with no account and no cloud upload. It offers two save modes, automatic source capture from the foreground window title, persistent drafts, optional WebDAV cloud sync, a Markdown block mode, a searchable note history panel, a system tray with quick actions, single-instance behavior, silent auto-update from GitHub Releases, and theme and background opacity options.
Tags:
- markdown
