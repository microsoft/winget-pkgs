ShortDescription: See which deleted files are still on a drive. Free demo of Shred and See.
Description: |-
  Deleting a file only crosses it off the file system's list; the bytes stay on the drive until something new lands on them. Shred and See Demo reads the file system's own bookkeeping (the NTFS master file table, FAT32 and exFAT directory entries) and lists the deleted entries it finds, with name, folder, size and date, and an info strip that says whether the drive is an SSD, whether TRIM is on and what that means. The demo scans and shows; the full version, sold separately, adds recovering the entries you select to another drive and overwriting the files you choose. No account, no network, no telemetry; nothing leaves your computer.
