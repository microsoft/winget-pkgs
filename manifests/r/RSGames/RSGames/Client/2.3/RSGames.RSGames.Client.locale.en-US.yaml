ReleaseNotes: |-
  Headline: Security update, Apple Silicon native support, Windows installer returns.
  What is new
  - Windows installer is back. Run the .exe, click through, get a Start menu shortcut and a real uninstaller in Programs and Features. A portable .zip is also available for advanced users.
  - Native Apple Silicon (M-series) Macs for the first time. One universal download runs natively on both Apple Silicon and Intel Macs.
  - Linux (x86_64) support returns. Self-contained download — no extra system packages required.
  - 32-bit Linux and 32-bit Windows are no longer supported. v2.2 remains available for users still on 32-bit systems.
  Voice chat
  - Better voice quality at lower bandwidth.
  - Voice chat now requires v2.3 or later. Players on older clients will see a prompt to update the first time they try to enable voice chat. Text chat, game protocol, and game sounds continue to work between mismatched versions.
  - New Audio Device Settings dialog (Ctrl+Alt+A). Pick which microphone and playback device voice chat uses, test the mic level, and save your choice for future sessions. Previously the client always followed the system default.
  Sound reliability
  - Slow logins get shorter after the first pass. The client now remembers which sound files have already been verified, so subsequent logins skip re-checking them.
  - Sound downloads recover from transient network errors and never leave a partially-downloaded file on disk.
  Security
  - Voice chat libraries updated to a newer supported version.
