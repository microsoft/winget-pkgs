ShortDescription: Free, lightweight game clipping for Windows & Linux
Description: |-
  Echo is a free, open-source game clip recorder. It keeps the last minutes of your game in a replay buffer using your graphics card's video encoder (NVIDIA, AMD or Intel), so your frame rate barely notices. Press one key or controller button and the moment becomes a clip, ready to trim, caption and share. Share links play right inside Discord. No ads, no account needed. It imports old clips from Medal, SteelSeries Moments and Outplayed, and backs up to Google Drive, MEGA, pCloud, Filen, WebDAV/SFTP/S3 or a NAS.
