ShortDescription: A karaoke player for the files you already own - KFN, CD+G, EMZ, LRC, MP4, AVI and audio.
Description: |-
  RocketKaraoke plays the karaoke files you already own: KaraFun KFN with lyrics and timing, CD+G with their pictures, EMZ and LRC, MP4 and AVI video, and plain audio, with nothing to convert.
  The words go on the room's screen, lit in time, while the host runs the queue on the laptop and singers send requests from their phones over Wi-Fi.
  It changes key and tempo, takes the voice out of a song and times lyrics to the voice.
  In a singing battle the program scores every note and ends the song on a podium.
  Free to sing with no time limit; a paid licence opens hosting.
