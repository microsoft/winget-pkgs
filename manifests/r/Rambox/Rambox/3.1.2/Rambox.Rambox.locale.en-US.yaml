ReleaseNotes: |-
  Changelog
  New
  - Focus mode: a timed focus session can be paused and resumed, from the Focus panel and from the tray, and stays paused after a restart. Infinite sessions show Stop instead.
  - Command Center: its shortcut can be turned off from the Shortcuts panel, which now shows the combination actually configured.
  - Console: support moved to Rambox's own help desk. Your requests and their history are in the console's Support section, also for accounts still on Rambox 2.
  - Console: "Custom permissions" lets a team member use a complete set of permissions of their own instead of their sub-team's, so Rambox 2 admins keep their admin access after moving to Rambox 3.
  - Sign-in: "Forgot your company ID?" on the enterprise sign-in emails you the company IDs and sign-in links of your organizations.
  Improvements
  - Custom apps accept intranet addresses (private IPs, ports, query strings, single-word hosts), and the URL field says why an address is rejected.
  - Proxy: an app's proxy button says which session profile it configures and how many apps that proxy will route.
  - Link rules: the editor refuses to save a rule that can never open a link, warns about rules that point to a missing app or are shadowed by another one, and says how many unfinished rows it discarded.
  - Deleting an app, a workspace or a session profile also deletes the proxy credentials it kept on your computer, and leftovers from earlier deletions are removed at startup.
  - Basic plan: the tray panel shows the Pomodoro starter with a PRO badge that opens the plans, instead of a starter that did nothing.
  - Moving from Rambox 2 with a saved session now asks you to sign in again, instead of signing you out with a license error.
  - Console: People marks the members who are still on Rambox 2, so admins can ask them to sign in and complete the move.
  - Console: team members who cannot manage teams see team and role names in People instead of IDs.
  - Console: deleting a sub-team explains that its members stay in the team and keep their custom permissions.
  - Console: "Subscribe" during an organization's trial asks for confirmation with the trial days left and, without a card on file, asks for one first instead of ending the trial.
  - Console: coupons valid for a single billing cycle disable the other cycles at checkout.
  - Sign-in: "Forgot password" on the personal sign-in takes enterprise accounts to their company's sign-in, instead of saying a reset email was sent.
  - Sign-in: accounts that still need to move to Rambox 3 are told so when signing in to the desktop app, instead of getting a server error.
  - Sign-in: Rambox Pro 1.x accounts are asked to contact support instead of getting a server error.
  - Sign-in: after signing in, Rambox only sends you on to its own addresses.
  - Sign-up: organization sign-up shows its progress and cannot be submitted twice.
  Fixes
  - Fixed the Command Center opening with Ctrl+K while typing in Slack and other apps. It now opens only with its own shortcut, Ctrl/Cmd+Shift+Space by default, which can be changed in the Command Center settings.
  - Fixed sidebar layout, tab position, density, app labels, the master password lock and the language shown in Settings going back to their defaults after a restart.
  - Fixed notifications sent by Rambox (announcements and account changes) not reaching the app since October 8.
  - Notification Center: Fixed clicking a notification that opens a link or a section not removing it, and notifications that open one of your apps showing the Rambox logo instead of the app's icon.
  - Fixed moving the mouse over the tray panel deleting the notifications under the cursor.
  - Fixed Tools > Clear local storage not clearing the shared session and the AI assistant's session.
  - Fixed a failed reorder of apps or workspaces staying on screen and disappearing on the next restart. The previous order now comes back and an error is shown.
  - Fixed removing an app or a workspace hanging without an error in some cases, or the app disappearing only to come back after a restart.
  - Fixed starting focus mode from the tray turning on "Infinite (no time limit)" for good, and the tray's Pause ending the session.
  - Fixed the timer of an infinite focus session staying frozen in the tray panel.
  - Fixed tooltips near the right edge of the window being squeezed into a narrow column, and the Extensions popover now opens leftwards from its button.
  - Fixed signing out sometimes leaving the session half-closed.
  - Fixed apps of a suite created during onboarding with its own session sharing sign-ins with the rest of your apps.
  - Fixed the workspace order being lost for some accounts whose workspace settings had never been saved.
  - Fixed an organization's license not updating when its trial ended, a card was added or the subscription was cancelled, until a member reopened the app.
  - Fixed the license of an organization moved to Rambox 3 breaking when its subscription renewed.
  - Fixed a move to Rambox 3 that was interrupted midway leaving the account unable to sign in. It can now be retried.
  - Linux: Fixed the Apps manager and Troubleshooting reporting low free memory on healthy machines.
  - Console: Fixed payments and billing failing with a server error after connecting a sign-in method or re-entering your password.
  - Console: Fixed a cancellation scheduled from the billing portal still showing as renewing, cancelling again failing, and Resume not stopping it.
  - Console: Fixed the organization billing portal offering to switch the organization to the personal Pro plan.
  - Console: Fixed invoice amounts of $1,000 or more being shown divided by 100.
  - Console: Fixed the "past due" message not saying that the card was declined.
  - Console: Fixed changing your email to an address with capital letters leaving the account inaccessible.
  - Console: Fixed saving a member without a team taking away all their permissions, and saving an old sub-team from the Rambox 2 panel emptying its permissions.
  - Sign-up: Fixed the name you corrected in the sign-up form not being used when signing up with Google or Facebook.
  - Sign-in: Fixed the sign-in page getting stuck on its spinner when the desktop sign-in could not continue to the console.
  - Website: Fixed the download buttons on rambox.app sometimes giving the Rambox 2.7.2 installer or the GitHub releases page instead of the latest installer for your system.
  Known bugs
  - Windows: right-clicking the tray icon can also open the Windows taskbar menu.
  - Linux (Snap): the app runs under XWayland and can look blurry on Wayland with fractional scaling.
