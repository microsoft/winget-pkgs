ReleaseNotes: |-
  Changelog
  New
  - Downloads show a notification as soon as they start, with a progress bar, the file name, how much has been downloaded and a Cancel button; when the download finishes it turns into "Download complete".
  - AI assistant: it can be turned off entirely ("I don't want to use AI") from its consent screen or from Settings > General, which hides its titlebar button, the side panel, the selection popover and "Ask AI" in the context menu.
  - Themes: every theme now has a Light / System / Dark selector, in Settings and in the onboarding, which replaces the separate "System" theme. Glossy, Slate and Darkest can be used in light and dark.
  - Console: a "Sign-in & security" section in My account to change your password, connect or disconnect sign-in methods, and request a "create a password" email for accounts without one.
  - Console: hover your avatar in My account to upload and crop a new profile photo.
  Improvements
  - Quick View: arrow keys navigate like WASD, clicking a card opens that app, and workspaces and cards show the same unread badges as the sidebar, with each workspace's own icon.
  - AI assistant: the consent screen explains that Rambox has no built-in AI and that the assistant opens the AI service you choose, signed in with your own account.
  - AI assistant: the "Ask AI" popover on selected text appears only after you accept the assistant's consent, and can be hidden from its own footer.
  - AI assistant: when the AI service is signed out, Rambox asks you to sign in to it in about a second, instead of after several seconds with a "the page may still be loading" warning.
  - The "high memory usage" suggestion is shown at most once every 30 minutes per app.
  - Organization themes follow your Light / System / Dark choice, and changes to the organization's colors apply without restarting.
  - Linux: the zip package extracts into a Rambox folder, like the tar.gz.
  - Console: the move to Rambox 3 wizard addresses an organization's admins as admins instead of as the owner.
  Fixes
  - macOS: Fixed the Save, Delete and close buttons of the workspace, app and settings panels not responding.
  - Fixed apps not loading in the background when there was a disabled workspace. Apps now load in sidebar order.
  - Fixed removing an app or moving it out of a tiles workspace leaving behind an empty tile that could not be removed. Existing broken tiles are repaired.
  - macOS: Fixed the "high memory usage" suggestion showing constantly.
  - Fixed the chosen theme changing after a restart, and dark themes staying light when following the system.
  - Fixed some preferences (AI assistant options, default link handling, waking hibernated apps) going back to their defaults on every start.
  - Basic plan: Fixed "Continue" failing in the workspace choice after deleting the workspace you had chosen.
  - AI assistant: Fixed questions and actions from the selection popover being lost when the panel was closed.
  - AI assistant: Fixed "Summarize" sending the previous selection after clicking a link.
  - AI assistant: Fixed questions from the selection popover being sent with a Spanish label whatever the app's language.
  - Downloads: Fixed "Open folder" being offered only when the folder had already been opened, and the file name showing its full path on macOS and Linux.
  - MCP: Fixed apps added through the MCP server being created without a URL.
  - Linux: Fixed the app crashing at startup when launched without flags (AppImage, from a terminal, tar.gz and zip).
  - Linux (deb, rpm, Snap): Fixed the app not starting because its install folder was only accessible to root.
  - Linux: Fixed the main window never appearing on some setups, staying behind the loading window.
  - Linux: Fixed signing in from the browser not returning to the app on AppImage, tar.gz and zip builds.
  Known bugs
  - Windows: right-clicking the tray icon can also open the Windows taskbar menu.
  - Linux (Snap): the app runs under XWayland and can look blurry on Wayland with fractional scaling.
