ReleaseNotes: |-
  Changelog
  New
  - Basic plan: when a trial or subscription ends, or an account moved from Rambox 2 lands on Basic, a wizard explains what Pro included and lets you choose, once, the workspace your plan keeps.
  Improvements
  - Rambox keeps working offline for up to 48 hours on the last license the server confirmed, with a countdown banner, and checks again as soon as the connection is back. While offline, only the license banner is shown.
  - Basic plan: apps in locked workspaces open their settings read-only and no longer count towards the app limit.
  - A disabled workspace can be selected in the sidebar and shows an Enable button; disabling the workspace you are in switches to that view right away.
  - Unified Search: disconnecting or deleting an app revokes Rambox's access at the provider (Google, Slack, GitHub, Notion, Asana and Discord), unless another app still uses the same account.
  - Unified Search: Google Calendar search covers every calendar in your list, including shared and subscribed ones.
  - Unified Search: the settings card says your data stays on your computer and links the privacy policy, and the provider sign-in tab always shows its address bar with the full URL.
  - Windows: a left click on the tray icon brings up Rambox, and a right click opens or closes the tray panel.
  - Console: an account that has not moved to Rambox 3 yet is taken to the move wizard before using the console; "Not now" signs you out.
  - Sign-in: signing in with an email or Google account that has no Rambox account takes you to sign-up with the email filled in, instead of "Invalid email or password."
  - Sign-in: "Resend email" on the verification page has a 60-second cooldown with a countdown, and asks you to wait a minute instead of showing a server error.
  Fixes
  - Fixed HTTPS certificate errors being ignored.
  - Fixed the telemetry opt-out not being honored by the app for personal accounts.
  - Fixed startup errors caused by settings saved by an earlier version.
  - Fixed a deleted workspace coming back in the sidebar after a plan change.
  - Fixed the license banner countdown not being shown.
  - Fixed the "subscription expired" dialog downgrading the license when you had just paid with it open.
  - Fixed an error when pressing Enter or Esc while renaming an app.
  - Fixed the proxy test in an app's settings not receiving the app's URL.
  - Windows: Fixed the tray panel and the Command Center flickering when shown.
  - Console: Fixed moving the account to Rambox 3 from the web signing you out right after.
  - Console: Fixed billing and checkout showing an error for accounts not yet moved to Rambox 3.
  - Sign-in: Fixed "Forgot password" sending several reset emails on repeated clicks.
  - Sign-in: Fixed sign-up failing for people who created their login in Rambox 2.7 but never finished the account.
  Known issues
  - Windows: right-clicking the tray icon can also open the Windows taskbar menu.
  - Linux: We are working to provide the installers ASAP.
