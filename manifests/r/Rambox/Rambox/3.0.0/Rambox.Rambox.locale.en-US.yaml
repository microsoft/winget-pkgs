ReleaseNotes: |-
  Changelog
  New
  - Rambox 3: a redesigned interface, with a new titlebar, sidebar and panels.
  - Themes: Default, Glossy, Slate, Darkest, Mint and Pink, each with a light and a dark variant.
  - Command Center: a floating launcher, opened with a global shortcut from anywhere, to jump to any app, workspace or action.
  - Tray panel: notifications, focus/pomodoro controls and quick actions from the system tray (menu bar on macOS).
  - Notification Center: the notifications of every app in one panel, newest first, with "clear all" and middle-click to dismiss.
  - AI panel: Claude, ChatGPT, Copilot or Gemini in a side panel, with the option to attach the content of the app on screen, and of other apps, to your question.
  - Concentration panel: focus sessions and a pomodoro timer, with ambient sounds and an optional full-window mode that keeps everything else out of reach until the session ends.
  - Quick View: all your apps in a grid, to glance at them and switch.
  - Unified Search: connect Gmail, Google Drive, Docs, Sheets and Calendar, Outlook, OneDrive, Teams, Slack, GitHub, Notion, Asana, Trello, Jira, Discord and WhatsApp, and search them from the Command Center.
  - Open links in installed apps: a link to a service you already have in Rambox can open in that app. Rules live in Settings → "Default apps for links", with * wildcards.
  - Address bar: an optional bar above each app with its URL and back, forward, reload/stop and home. Without it, those buttons live in the titlebar.
  - Sidebar: a new "Split" layout with workspaces and apps in separate bars, a resizable splitter, overflow menus, and drag and drop to reorder workspaces and to move an app to another workspace.
  - Hibernated apps can wake up as soon as you open them (new setting in General).
  - Windows: media controls (go to app, previous, play/pause, next) in the taskbar thumbnail while an app is playing.
  - Onboarding redesigned as a full-window flow, with a shorter tour and hint dots that explain each feature where it lives.
  - OS permissions: onboarding and Troubleshooting show the state of camera, microphone, screen sharing, location and Bluetooth, and ask for what is missing.
  - Remote Control (MCP): an optional setting to let an MCP client control Rambox.
  - Console: one billing page for personal and enterprise accounts, with plan changes, payment methods, multiple tax IDs and cancel/reactivate.
  - Console: change your account email, and sign out of all devices.
  - Console: a support portal to open and follow tickets.
  - Console: organization admins manage teams, sub-teams, their permissions and shared workspaces, and choose the organization's sign-in methods.
  - Sign-in: new sign-in and sign-up pages.
  Improvements
  - Sign-in now happens in your default browser instead of inside Rambox.
  - Billing and Profile open in the console in your browser, already signed in, instead of an embedded page.
  - Rambox asks the OS for camera and microphone only when an app actually needs them, and for screen recording before opening the screen picker.
  - Hibernated apps wake up on the page they were on.
  - Settings reorganized in vertical tabs.
  - One density setting now scales the whole app, not just the app tiles.
  - User profiles are shown as cards with how many apps use each.
  - Resource-usage suggestions have Hibernate, Reload and Disable buttons.
  - A pending update shows as a badge on the profile photo.
  - Pro features are marked with a PRO ribbon, also during the trial.
  - Signing out of all devices from the console now also signs out Rambox.
  - Enterprise members stay on the stable update channel.
  - Windows and Linux: new app icon, matching macOS.
  - Sign-in: enterprise invitees see the inviting organization's logo.
  Fixes
  - Fixed moving an app to another workspace corrupting the order of the workspace it left.
  - Fixed the proxy test reporting success for a proxy that cannot carry a request.
  - Fixed "Clear local storage" leaving behind the sessions of apps in tiled or disabled workspaces.
  - Fixed an app's error page being treated as a lost internet connection.
  - Console: Fixed the profile name and photo reverting to an old value after a page refresh.
  - Sign-in: Fixed a failed email/password sign-in taking a long time to show "Invalid email or password".
  End of Support
  - Signing in to Rambox 3 moves your account to the new Rambox 3 format. Once moved, Rambox 2 can no longer sign in with that account, and Rambox 2 windows left open on other computers are signed out.
  Known issues
  - Linux: We are working to provide the installers ASAP.
