ShortDescription: Search your own video and photo library by describing what is in each shot, fully on your computer.
Description: |-
  Reelary indexes every photo and every 2-second slice of every clip in a folder or on an external drive with a local vision model, so you can search in plain language and get the exact moments.
  It also searches text that appears in footage, builds a rough cut from a script, and exports an MP4 or an FCPXML / EDL project for Premiere Pro, Final Cut Pro or DaVinci Resolve. Footage is never uploaded.
  The free tier has no time limit and needs no account; Pro is a one-time purchase.
