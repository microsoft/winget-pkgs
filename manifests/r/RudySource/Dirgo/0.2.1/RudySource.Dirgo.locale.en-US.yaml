ShortDescription: Fast, local-first directory navigation for your terminal.
Description: >-
  Dirgo is a privacy-first directory navigator written in Rust. It indexes
  directories locally and provides fast command-line search, an interactive
  terminal picker, bookmarks, and filesystem actions. Windows supports the
  native CLI and picker, but not parent-shell directory changes yet.
