ShortDescription: 'Beta builds of Stoke, a desktop shell for Claude Code and other coding agents: every project, session and a docked browser in one window.'
Description: 'Stoke runs the real claude command in a terminal it owns, so skills, MCP servers, plugins, hooks and slash commands behave exactly as they do anywhere else. Around it: every project in a sidebar with past chats to resume, several sessions open as tabs, a docked browser the agent can read and click, how full the context window is and how much of the plan limit is gone, dictation, and a phone view that can drive a session. Other coding-agent CLIs run in it the same way. This package carries the prereleases. Stoke and Stoke Beta are the same app in the same folder, so installing one replaces the other.'
