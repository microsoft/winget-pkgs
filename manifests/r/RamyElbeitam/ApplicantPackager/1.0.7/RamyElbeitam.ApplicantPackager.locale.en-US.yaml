License: Freeware
ShortDescription: Finds job applications in your email and saves each applicant's CVs into its own folder.
Description: |-
  Applicant Packager scans Gmail, Outlook / Microsoft 365, Yahoo, IMAP or a local Thunderbird mailbox for job applications and saves each applicant's attachments into one folder per person, plus a spreadsheet of who applied for what. It can search inside PDF, Word and scanned CVs. Read-only and local: nothing is uploaded.
