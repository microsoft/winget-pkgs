ReleaseNotes: |-
  This is the first patch of 7.7.0. It's likely that another is coming relatively soon.

  # Changes since Rojo 7.7.0

  ## Fixes
  • Fixed a myriad of problems caused by paths being prefixed with `\\?\` on Windows
  • Rojo's plugin now handles blocking requests to `api.github.com` more gracefully

  ## Upgrading
  To install the Roblox Studio plugin, there are a few options:

  • Run `rojo plugin install` from the Rojo CLI
  • Download the attached `Rojo.rbxm` and place it into your Roblox Studio plugins folder
  • Install from [the Roblox plugin page](https://create.roblox.com/marketplace/asset/13916111004/Rojo)

  There are also multiple ways to install the Rojo CLI:

  ### With [Rokit](https://github.com/rojo-rbx/rokit)
  Add a line to the `[tools]` section in `rokit.toml`:

  ```toml
  rojo = "rojo-rbx/rojo@7.7.1"
  ```

  ### From GitHub Release
  Download one of the attached binaries on this release page!

  ### From Crates.io
  You can use Cargo (1.88.0+) to build the release yourself from crates.io:

  ```bash
  cargo install rojo --version 7.7.1
  ```
