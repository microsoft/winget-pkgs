ReleaseNotes: |-
  codexrig: sync your Codex CLI configuration across machines, and run several Codex logins side by side.

  The fifth rig does for the Codex CLI what claudeRig does for Claude Code. It copies your setup - config.toml and any named profile overlays, AGENTS.md, skills, prompts, rules - into a private git repo of your own, rewrites machine-specific paths so it lands correctly on a computer laid out differently, and refuses to publish anything that still looks like a credential.

  Your login is never in the backup. auth.json is excluded, and a value that looks like a token is replaced with a sentinel that a restore swaps back for the machine's own value. A restored machine runs `codex login` once for itself.

  Your conversations are not backed up unless you ask: `codexrig config set syncSessions true` turns rollouts on. Every surface says which mode the machine is in.

  Several logins on one machine: `codexrig account add` tracks the login you are signed in as, and `codexrig account run work` starts Codex as that one without disturbing the others, each in its own CODEX_HOME.

  Also in this release: `codexrig mcp get --json` emits the same object `mcp list --json` does, and `repo status` counts a chunked rollout once at the conversation's size rather than as a pile of parts.

  Full changelog: https://github.com/rigsmith/rigsmith/blob/v1.19.0/CHANGELOG.md
