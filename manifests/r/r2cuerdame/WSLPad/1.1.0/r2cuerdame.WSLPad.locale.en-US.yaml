License: MIT
LicenseUrl: https://github.com/r2cuerdame/WSLPad/blob/v1.1.0/LICENSE
ShortDescription: A small Windows companion for WSL.
Description: >-
  WSLPad is a Windows tray companion that makes hidden WSL state visible. It
  includes a dashboard, a dual-pane Windows and WSL file explorer, an
  interactive terminal, a dedicated Recovery workspace, environment health
  diagnostics, developer profiles, USB device inspection, and a read-only MCP
  server. System-changing commands are review-only or copy-only and never run
  automatically.
Moniker: wslpad
Tags:
  - developer-tools
  - file-manager
  - linux
  - system-monitor
  - terminal
  - windows
  - wsl
  - wsl2
ReleaseNotes: >-
  WSLPad 1.1.0 adds Environment Doctor, Developer Profiles, a dedicated Recovery
  workspace for backup, restore, clone and relocation, and an on-demand
  USB/usbipd device manager. System-changing commands remain review-only or
  copy-only and are never executed automatically.
ReleaseNotesUrl: https://github.com/r2cuerdame/WSLPad/releases/tag/v1.1.0
