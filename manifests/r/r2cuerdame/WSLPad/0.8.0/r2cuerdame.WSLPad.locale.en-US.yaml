License: MIT
LicenseUrl: https://github.com/r2cuerdame/WSLPad/blob/v0.8.0/LICENSE
ShortDescription: A small Windows companion for WSL.
Description: >-
  WSLPad is a Windows tray companion that makes hidden WSL state visible. It
  includes a dashboard, a dual-pane Windows and WSL file explorer, an
  interactive terminal, and a read-only MCP server. Recovery commands are
  prepared for review and are never run automatically.
Moniker: wslpad
Tags:
  - developer-tools
  - file-manager
  - linux
  - system-monitor
  - terminal
  - windows
  - wsl
  - wsl2
ReleaseNotes: >-
  Adds an explicit remote recovery check that separates distribution, DNS,
  network, and verified VS Code Server failures. Recovery is ordered from
  reloading one editor window through selected-distribution termination, with
  wsl --shutdown reserved for last.
ReleaseNotesUrl: https://github.com/r2cuerdame/WSLPad/releases/tag/v0.8.0
