  - windows
  - wsl
  - wsl2
ReleaseNotes: >-
  WSLPad 1.0.4 adds Tool Discover and a unified Update Center across apt, npm, Cargo, Homebrew, Snap, and Windows winget, expands the curated developer-tool catalog, and keeps install/update actions review-only in Console.
