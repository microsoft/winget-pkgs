ShortDescription: Syncs subtitles to a video's audio, in almost any language.
Description: >-
  SubSync Echo fixes subtitles that are out of sync with a video. It listens to what
  is said and moves every line to the moment it is spoken: anime and other Japanese
  films, English films, and subtitles in a different language from the audio.
  Everything runs on your own computer, with no graphics card, and nothing is uploaded.
