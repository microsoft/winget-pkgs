PackageVersion: 1.3.8
PackageLocale: en-US
ShortDescription: A music playback client that is compatible with both online and local music.
Description: Sollin is a cross-platform desktop music player built with Electron, React, TypeScript, Vite and Tailwind CSS. It focuses on local playback and online playback. Local playback covers the local library, playlists, lyrics, downloads and backups. Online playback relies on LX JS music source scripts that you import yourself.
