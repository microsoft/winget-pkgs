ShortDescription: Local-first writing environment for fiction authors.
Description: |-
  Writer Studio is a local-first desktop writing tool for fiction authors. Manuscripts stay on your disk in an open JSON format you can always read and move, with no account required and no cloud lock-in.

  Organize a book as Book, Acts, Chapters and Scenes, reorder them by drag and drop, and keep scene metadata such as point of view, date and time, tags and location. The rich text editor offers focus and zen modes, typewriter scrolling, split and multi-pane layouts, themes, and live word count and session statistics.

  The Book Wiki tracks characters, locations, plotlines and notes, including character cards with appearance, personality, motivations and relationships, structural character models, visual relationship graphs, and cross-book profiles for series writers.

  Writing support:
  - Native grammar and style proofreading tuned for literary prose, with spell checking, correction suggestions and inline highlighting.
  - Quick Jump and an IDE-style command palette, plus full-text and regular-expression search across the manuscript.
  - Daily word goals, streak counters, session timers and weekly writing statistics.
  - Scene snapshots, automatic hourly backups, crash recovery and Git-based version history.

  An optional AI assistant reads the entire manuscript, characters, notes and metadata, takes natural-language commands, and asks for approval before any structural change. It supports Anthropic, OpenAI and local Ollama models with your own API key, and the app is fully usable without AI.

  Manuscripts export to EPUB, DOCX, PDF, HTML, Markdown and TXT, with KDP, Kobo and Apple Books validation; EPUB, DOCX, Scrivener, Markdown and TXT can be imported. The interface is available in English and Russian.
