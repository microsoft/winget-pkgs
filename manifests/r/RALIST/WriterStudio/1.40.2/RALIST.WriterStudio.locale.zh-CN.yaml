ShortDescription: 面向小说作者的本地优先写作环境。
Description: |-
  Writer Studio 是一款本地优先的小说写作桌面工具。稿件以开放的 JSON 格式保存在你自己的磁盘上，随时可以读取和迁移，无需注册账号，也不依赖云端。

  可以按「书 → 幕 → 章 → 场景」组织稿件，拖拽调整顺序，并为场景记录视角、日期时间、标签和地点。富文本编辑器提供专注与禅模式、打字机滚动、分屏多面板布局、多种主题，以及实时字数和写作时长统计。

  Book Wiki 用于跟踪人物、地点、情节线和笔记，包括记录外貌、性格、动机与人物关系的角色卡片、结构化人物模型、人物关系图，以及供系列作品使用的跨书籍角色档案。

  写作辅助：
  - 面向文学文本的原生语法与风格校对，支持拼写检查、修改建议和行内高亮。
  - Quick Jump 与 IDE 风格命令面板，并支持全文和正则搜索。
  - 每日字数目标、连续写作天数、计时器和每周写作统计。
  - 场景快照、每小时自动备份、崩溃恢复和基于 Git 的版本历史。

  可选的 AI 助手会读取整部稿件、人物、笔记和元数据，接受自然语言指令，并在执行任何结构性改动前请求确认。支持 Anthropic、OpenAI 和本地 Ollama 模型，使用你自己的 API 密钥；不开启 AI 也能完整使用。

  稿件可导出为 EPUB、DOCX、PDF、HTML、Markdown 和 TXT，并支持 KDP、Kobo 和 Apple Books 校验；可导入 EPUB、DOCX、Scrivener、Markdown 和 TXT。界面提供英语和俄语。
