ShortDescription: Helper for the Titl browser extension, which shows on-time, private YouTube subtitles and translation, transcribed on your own computer with whisper.cpp.
Description: |-
  Titl shows subtitles for any YouTube video, even ones without captions, transcribed ahead of playback so every line appears on time. Translation runs on your device with Chrome's built-in translator.
  This helper downloads whisper.cpp and a Whisper model, registers itself with Chrome, Edge and Brave, and starts the speech server on your own computer when the Titl extension asks for it. Audio never leaves your computer.
