ShortDescription: A blazing fast ultra-light photo viewer replacement for Windows. Works similar to Picasa Photo Viewer.
Description: Fly Photos is one of the fastest photo viewers for Windows, designed as a modern replacement for the now-discontinued Google Picasa Photo Viewer. Built with WinUI 3, WinRT, and Win2D, it delivers smooth animations, instant startup, and an efficient viewing experience.
ReleaseNotes: |-
  ❤️ Support FlyPhotos' development by sponsoring or by downloading from Microsoft Store
  ✨ New Features & Improvements
  - Folder mode (Settings > Behaviour > Build photo list from). Fly can now build the photo list from the photo's folder instead of the Explorer window, sorted by name, date modified, date created or size, ascending or descending.
    - Live folder monitoring. Images that are added, removed or renamed on disk show up in the right place without reopening Fly. New files appear only after they are fully written. (#234)
    - Sibling folder navigation. Ctrl+PageUp / Ctrl+PageDown opens the previous / next folder that has images, which is handy for chapters or pages. (#267)
  - Fine zoom with Shift + mouse wheel. Zooms in small steps for precise framing. The step size can be set in Settings > Mouse (1-10%, default 2%). (#253)
  - Files with the wrong extension now open. Fly now checks the file's content as well as its extension, so files such as an AVIF saved as .webp open normally instead of showing "invalid file". Animated AVIFs saved as .heic now animate too. (#252)
  - Long values in the Photo info panel are collapsed (for example ICC tone curves). Click the ellipsis to expand them. Copy still copies the full text. (#252, #196)
  - The thumbnail strip bounces when you go past the first or last photo. (#270)
  - External app slots can be cleared. Long press an assigned slot in Settings to show a red X that removes it. (#259) Thanks to @SgtSwagrid for the suggestion!
  - Faster loading and other optimizations
    - High-quality loading of neighbouring photos now waits until the displayed photo is fully loaded.
    - Embedded RAW previews are decoded at preview size.
    - PSD thumbnails are read straight from the file's resources section.
    - HEIC/AVIF files without a thumbnail are decoded only once when first opened.
    - Disk-cache previews are resized on the GPU.
    - Photos are uploaded to the GPU without an extra memory copy.
    - The thumbnail strip draws its slots more efficiently.
    - Updated third-party dependent libraries.
  🐞 Bug Fixes
  - Fixed wrong colours (red and blue swapped) in DDS files. DDS now uses Microsoft's DirectXTex, which also adds support for BC4-BC7, sRGB and DX10 DDS textures. (#273)
  - Fixed bright fringes on the anti-aliased edges of SVG images. (#269) Thanks to @midlan!
  - The file name is now easy to read in light theme when it fades in over a dark photo. (#258) Thanks to @SgtSwagrid!
  ❓ FAQ
  Got questions, or running into an issue? Please check out our Frequently Asked Questions (FAQ) page for quick answers and troubleshooting steps.
  Thanks to everyone who reported issues and suggested improvements. Looking forward to your feedback on this release.
