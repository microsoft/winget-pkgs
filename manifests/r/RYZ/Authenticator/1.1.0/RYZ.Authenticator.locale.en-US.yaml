ShortDescription: Fast, Open-Source, Zero-Knowledge 2FA & TOTP Authenticator built in Rust and Tauri 2.0.
Description: >-
  RYZ Authenticator is a native, lightweight (~30 MB RAM), zero-knowledge Two-Factor Authentication (2FA)
  client for Windows, macOS, Linux, Android, and iOS. Built in Rust and Tauri 2.0 with XChaCha20-Poly1305
  and Argon2id envelope encryption, Windows DPAPI hardware binding, live camera & screenshot QR code scanning,
  1-step Google Authenticator migration import, and encrypted .ryzbackup offline exports.
