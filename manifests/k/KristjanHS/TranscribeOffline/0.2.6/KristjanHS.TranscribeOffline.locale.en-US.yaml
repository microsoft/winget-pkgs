License: MIT
LicenseUrl: https://github.com/KristjanHS/transcribe-offline/blob/main/LICENSE
ShortDescription: Offline Estonian and English speech-to-text on your own computer (faster-whisper, CPU).
Description: Transcribes audio files to .txt beside them, uploading nothing. The models and Python runtime (about 3.5 GB) are downloaded once by transcribe-offline-setup, each file verified against a pinned SHA-256; after that the app works with the network unplugged.
Tags:
- speech-to-text
- transcription
- whisper
- offline
- estonian
InstallationNotes: Run transcribe-offline-setup once in a terminal to download and verify the models (about 3.5 GB). It prints the folder; start the app with Transcribe.bat there.
