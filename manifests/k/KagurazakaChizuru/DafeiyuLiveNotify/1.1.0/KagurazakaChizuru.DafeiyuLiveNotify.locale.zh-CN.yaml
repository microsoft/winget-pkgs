ShortDescription: 开播自动往 QQ 群发 @全体成员 通知，并自动识别当前在玩什么游戏
Description: |-
  开播时自动往 QQ 群发 @全体成员 通知的 Windows 小工具。

  · 自动识别当前在玩什么游戏，写进通知里
  · 开播通知附一张直播间封面小图
  · 开播 30 分 / 1 小时各补一条二次提醒
  · 下播提示带本次直播时长和人气峰值
  · 直播间轮询 / OBS 推流事件 / 全局快捷键三种触发
  · 独立 QQ 副本双实例共存，不占用你自己的 QQ
  · 绿色免安装，零第三方依赖

  注意：本包不含 NapCat 和 QQ 本体。装好后还需要按使用文档把 NapCat 放到
  app\napcat\，并运行 app\_setup-qq-copy.ps1 生成私有 QQ 副本。
