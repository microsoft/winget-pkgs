ShortDescription: Krita is a professional FREE and open source painting program. It is made by artists that want to see affordable art tools for everyone.
Description: Krita is a FREE and open source painting tool designed for concept artists, illustrators, matte and texture artists, and the VFX industry. Krita has been in development for over 10 years and has had an explosion in growth recently. It offers many common and innovative features to help the amateur and professional alike.
