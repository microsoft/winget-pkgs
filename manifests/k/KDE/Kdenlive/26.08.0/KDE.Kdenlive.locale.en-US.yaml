ReleaseNotes: |-
  - Added snapping in the title editor
  - Added rounded corners on rectangles for titles
  - Added copy & paste title elements
  - Added option to replace the timeline clip when adding a new title clip
  - Introduced copy selection to new sequence
  - Added arbitrary rotation anchor for transform effect
  - Added auto-keyframe generation for additional effects
  - Added detect embedded MKV subtitle streams and display count in clip properties
  - Added Shift+Click for additive soloing on audio tracks
  - Introduced reorder timeline tracks
  - Added Add Markers at Gaps feature to Timeline menu
  - Added configuration of colors for clip types (video, audio, title, image, slideshow)
  - Added warning before deleting tracks that contain clips
  - Added insert clips to timeline using timecode metadata
  - Added setting for “Return playhead to start position on stop” in the timeline
  - Renamed and repositioned “Replace Timeline Clip” action
  - Added move clip marker with mouse
  - Added duplicate clip action
  - Added 6 new effects: gradientmap, baltan, lightgraffiti, avfilter curves, lagfun, pseudocolor
