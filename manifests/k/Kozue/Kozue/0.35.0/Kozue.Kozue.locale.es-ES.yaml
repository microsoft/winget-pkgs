ShortDescription: Lector de feeds (RSS, Atom, JSON Feed) para Windows que funciona sin servidor o con Miniflux y otros servicios RSS.
Description: |-
  Kozue es un lector de feeds para Windows. Puede descargar tus feeds en el PC sin ningún servidor, o sincronizarse con Miniflux, servicios con la API de Google Reader, Nextcloud News, Feedbin, Fever, NewsBlur y Tiny Tiny RSS.
  Tres paneles, línea de tiempo que recuerda dónde ibas, texto completo, lectura sin conexión, etiquetas, enlaces guardados, filtros, directos (YouTube, Twitch, radio) y un reproductor flotante para vídeos y podcasts que guarda la posición.
