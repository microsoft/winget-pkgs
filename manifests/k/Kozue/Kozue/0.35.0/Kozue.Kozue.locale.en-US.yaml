ShortDescription: Feed reader (RSS, Atom, JSON Feed) for Windows that works without a server or with Miniflux and other RSS services.
Description: |-
  Kozue is a feed reader for Windows. It can download your feeds on your PC without any server, or sync with Miniflux, Google Reader API services, Nextcloud News, Feedbin, Fever, NewsBlur and Tiny Tiny RSS.
  Three panes, a timeline that keeps your place, full text, offline reading, labels, saved links, filters, live streams (YouTube, Twitch, radio) and a floating player for videos and podcasts that remembers where you left off.
