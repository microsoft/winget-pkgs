ShortDescription: A fast desktop log viewer for searching and filtering multi-gigabyte log files.
Description: >-
  Log Lens is a desktop log viewer built for searching and filtering huge
  log files (tested up to multi-gigabyte, tens-of-millions-of-lines files)
  without loading the whole file into memory. Features nested boolean
  search groups (build expressions like (A OR B) AND C through the UI),
  multi-file merge into a single timestamp-sorted timeline, log-level and
  method-name coloring, automatic detection and pretty-printing of
  embedded JSON payloads, and cursor-drag text selection for copying
  results.
Moniker: loglens
