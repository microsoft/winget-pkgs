Description: >-
  KinetAios is a local-first, open-source (GPL-3.0) desktop app that runs multiple
  AI agent engines side by side in one window: a built-in ReAct loop (Direct
  V1/V2/V3), Claude Code, Codex and DeepSeek Harness. Switch engines per session,
  share long-term memory across engines (local SQLite/FTS5), use MCP client +
  server, 40+ agent tools and a plugin SDK. No account, no relay server, no
  telemetry — the app, history and memory index all stay on the local machine.
