ShortDescription: Local-first AI agent dashboard with multi-engine sessions, tools, and long-term memory
Description: |-
  KinetAios is a local-first AI agent dashboard for Windows and macOS.
  It runs multi-engine sessions with streaming answers, plus shell, file, web and memory tools.
  History and long-term memory are stored in a local SQLite database with FTS5-powered recall,
  and a global hotkey opens the quick panel.
  Engines include the built-in Direct ReAct agents plus hosted Claude Code and Codex CLI sessions.
