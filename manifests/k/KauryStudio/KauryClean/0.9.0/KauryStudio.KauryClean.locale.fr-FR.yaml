PackageName: Kaury Clean
PackageUrl: https://clean.kaury.studio/
License: Gratuiciel
ShortDescription: Un nettoyeur de PC Windows simple, beau et honnête.
Description: |-
  Kaury Clean n'efface que ce qui s'accumule pour rien (caches des applis et des navigateurs, fichiers temporaires, installeurs déjà utilisés) et montre chaque élément avant de nettoyer.
  Il montre aussi les applis au démarrage, celles qui prennent la mémoire, les programmes installés, les gros fichiers et les doublons, la place du disque, et lance les outils de réparation de Windows (DISM, SFC, chkdsk).
  Pas de nettoyage du registre, pas de faux « boost de RAM », ni pub, ni compte, ni télémétrie. Interface en français et en anglais.
