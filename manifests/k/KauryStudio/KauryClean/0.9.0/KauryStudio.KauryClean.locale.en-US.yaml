ShortDescription: A simple, beautiful and honest Windows PC cleaner.
Description: |-
  Kaury Clean only removes what piles up for nothing (app and browser caches, temporary files, installers already used) and shows every item before cleaning.
  It also lists startup apps, memory-hungry apps, installed programs, large files and duplicates, maps disk usage, and runs Windows' own repair tools (DISM, SFC, chkdsk).
  No registry cleaning, no fake RAM boosting, no ads, no account, no telemetry. English and French interface.
