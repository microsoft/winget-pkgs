ShortDescription: Keeps your Windows PC awake and nudges the mouse after it has been idle.
Description: |-
  A tray app with one Start button. While it runs, it keeps the PC from sleeping through a Windows
  power request and, after the PC has had no input for a while, moves the mouse a few pixels and
  back, so Windows, the screen lock and apps that watch idle time see activity. Pauses on battery,
  when locked or while presenting; schedules and quiet times; imports Move Mouse settings.
  Monitoring software can detect simulated input.
