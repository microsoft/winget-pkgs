ShortDescription: Put Windows Defender under your command with nag-free, granular Standing Orders for Windows 11.
Description: |-
  ShieldSheriff is a user-elected Windows Defender governor for Windows 11.
  It keeps Microsoft Defender under your granular Standing Orders (Real-Time Protection, Behavior Monitoring, IOAV, Script Scanning, Network Protection, Cloud Protection, and Sample Submission), silences Windows Security Center nags, auto-heals configuration drift, and supports timed or process-aware Deputy Stand-Down from the CLI, System Tray, or local Command Center UI.
