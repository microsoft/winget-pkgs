ShortDescription: Dims your monitors at sunset and brightens them at sunrise, automatically.
Description: |-
  Astro Dimmer is a small tray app that follows sunrise and sunset for your location and moves your external monitors between a daytime and a night-time brightness level.
  Each monitor gets its own levels, the change can be shifted earlier or later and faded gradually, and a taskbar panel offers a slider per screen.
  Works with monitors that support DDC/CI.
