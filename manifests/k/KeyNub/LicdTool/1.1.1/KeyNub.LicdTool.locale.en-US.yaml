ShortDescription: Command-line tool for the KeyNub USB license dongle.
Description: |-
  licd-tool lists and inspects KeyNub USB license dongles, proves that a dongle is genuine, reads and writes the license records it holds, reads and increments its monotonic counters, and encrypts data that only a dongle can decrypt. One executable with the KeyNub core library built in: no driver and no other library to install. For licence-issuing scripts, support and test benches; --json gives machine-readable output.
