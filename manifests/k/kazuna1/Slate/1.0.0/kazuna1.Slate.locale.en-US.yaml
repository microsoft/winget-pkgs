ShortDescription: Always-on desktop command bar. Press Win+Space, type a command, and it runs in a terminal.
Description: |-
  Slate is a command bar that lives on the Windows desktop and survives Win+D.
  Press Win+Space from any app, type any PowerShell command (your profile is loaded, so your own shortcuts work),
  and press Enter to run it in a new terminal that stays open. Includes folder-name Tab completion from zoxide,
  command history, and a fully themeable look with glow and animations.
