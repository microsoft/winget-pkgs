ShortDescription: Turn a Google Authenticator export QR code into otpauth:// URIs.
Description: |-
  otp-out reads the "Transfer accounts" QR code exported by Google Authenticator
  (a screenshot or the otpauth-migration:// link) and prints one standard
  otpauth:// URI per account, to add them to 1Password, Bitwarden, Aegis or any
  other authenticator. It runs offline and never writes the secrets to disk.
