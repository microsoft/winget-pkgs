ReleaseNotes: |-
  APISwitch v0.3.1 更新日志
  【新增 · 用量性能指标】
  用量监控在原有 Token 统计基础上，新增三项反映「跑得快不快、缓存省不省」的指标：
  - 缓存命中率：顶部卡片展示区间内命中占比，口径为
  命中 / (新增输入 + 命中 + 写入)，副标题标注命中与写入的 token 量
  - 输出速度：输出 token / 整轮耗时，单位 token/s
  - 首字耗时：从请求到首个产出内容的耗时
  - 三项目标同步落地在四个位置：顶部汇总卡片、调用明细每行、
  以及「按模型」「按供应商」下钻的每一行，配色统一（缓存紫 / 速度红 / 首字黄）
  - 调用明细由 7 列扩展为 10 列（时间 / 客户端 / 供应商 / 模型 / 输入 / 输出 /
  总量 / 缓存 / 速度 / 首字），缓存列让高缓存与零缓存的热点一目了然
  - 点击柱子下钻某天后，缓存 / 速度 / 首字随汇总卡片与明细一起切换为当天数据
  【新增 · 历史数据回填】
  解决老用户升级后性能指标全为 0 的问题：
  - 根因是缓存 / 耗时 / 首字为后加字段，而扫描按文件字节偏移增量推进，
  已消费过的文件不会重读，老数据里这些字段永远是 0，换版本也不会自己长出来
  - 用量监控窗口右下角新增「回填历史数据」按钮（亦有 --backfill-usage 命令行入口）
  - 流程：自动备份 usage.db（带时间戳）→ 清空事件表 → 作废全部扫描偏移 →
  全量重扫本地会话日志，一次补齐历史用量
  - 回填后弹窗报告写入行数、含缓存数据行数、含耗时数据行数，结果可验证
  - 备份文件保留在同目录，出事可手动还原
  【新增 · Codex 模型自动获取】
  - 勾选后保存时自动向供应商请求模型列表（GET /models）并写入 Codex 模型目录
  - 该供应商提供的全部模型随即出现在 Codex 的 /model 切换器里，无需手填
  - 拉取失败时给出可操作提示（检查 Base URL 与 API Key），并建议取消勾选后手动添加
  【新增 · 批量激活可取消】
  - 批量激活 Antigravity 账号限额时新增「取消批量」按钮
  - 取消后已激活的结果保留，按钮与提示文案即时反馈取消状态
  - 等待当前账号处理结束后即停止，不会打断进行中的激活
  【新增 · 客户端安全重启】
  修复"点了重启、提示成功，但客户端根本没起来"的问题：
  - 根因是 Codex / Claude 均为 MSIX 打包的 Electron 应用（装在 WindowsApps 下，
  一个应用有 9+ 个同名进程），直接强杀会留下单例锁与 MSIX 激活状态
  - 新流程：优雅关闭（只对有窗口的进程发关闭消息）→ 等其自行退出 →
  仍有残留才强制杀进程树 → 留足时间释放单例锁 / 命名管道 / MSIX 激活 →
  启动后验证新进程真实出现，未出现则重试一次
  - 返回真实结果，由调用方决定提示成功还是失败，绝不一味显示"已重启"
  【优化 · 网关性能采集】
  - 本地网关此前只记录 token 数，现补全三项性能指标，经网关的请求同样纳入统计
  - 首字打点：只在首个真正产出内容的 SSE chunk（推理 / 正文 / 工具调用）记录，
  不会把上游首包的 {"role":"assistant"} 空壳误算成首字
  - 缓存解析：同时兼容 OpenAI 的 prompt_tokens_details.cached_tokens 与
  Anthropic 的 cache_read_input_tokens / cache_creation_input_tokens
  - 整轮耗时：复用已有的 Stopwatch，此前已停止计时但未传入
  【优化 · 界面与交互】
  - 最小化回归标准行为：点标题栏「-」、点任务栏按钮、Win+Down 一律最小化到任务栏，
  任务栏保留该任务按钮；收进托盘仅保留给「关闭窗口」路径
  - 托盘图标左键恢复为「唤出 / 前置主窗口」
  - 界面语言切换覆盖新增的用量监控控件与回填流程，中英即时生效
  【修复】
  - 修复激活时弹出可见控制台窗口的问题：启动 agy.exe 时补上
  CreateNoWindow + WindowStyle=Hidden，并重定向 stdin 写入换行后关闭，
  CLI 的目录信任等提问读到 EOF 即按默认继续，绝不挂起
  - 修复配额倒计时在配额已恢复后仍显示过期重置时间的问题：
  改为以实时配额为准，只取已用尽配额桶的重置时间
  - 修复 Claude CLI 用量耗时跨会话文件串染的问题：
  计时起点改为按文件重置，避免用上一个会话残留的时间戳算出几小时的荒谬耗时
  - 修复 Codex 轮次计时字典可能无限增长的问题：增加 2 小时阈值清理与 5000 条硬上限
  - 修复扫描器并发写字典导致丢条目或遍历卡死的问题：
  ScanAll 会被主窗口与用量监控窗口各自触发，现加锁串行化
  【工程】
  - selftest 新增用量监控窗口渲染断言（ui_usage_monitor_render），
  覆盖新增的汇总卡片与调用明细列，防止 XAML 回归
  - 启动日志记录每次 CLI 调用的模型、参数、退出码与输出头部，便于定位激活失败
  - CLI 激活参数分级降级：用法错误（exit=2 / unknown option）自动逐级简化重试，
  429 / 鉴权 / 网络类错误直接返回真实原因，不再无意义重试

  APISwitch v0.3.0 更新日志
  【重磅新增 · 用量监控】
  全新的「用量监控」窗口，一站式掌握所有客户端的 Token 消耗：
  - 汇总卡片：总 Token / 输入 Token / 输出 Token / 请求数，一眼看清区间消耗
  - 每日趋势图：堆叠柱形图展示每日输入/输出消耗，自动补齐无调用日期，
  空闲日以空柱呈现，活跃与空闲一目了然
  - 点击柱子即选中当天：柱形变色高亮 + 柱顶显示当日总消耗，
  下方汇总卡片、供应商明细、客户端汇总、调用明细全部联动切换为当天数据；
  再次点击取消选择，点击其他柱子切换选择
  - 供应商明细：按供应商下钻到模型，可展开/收起
  - 客户端汇总：按 Codex / Claude CLI / Claude Desktop / OpenCode / Pi 分别统计
  - 调用明细：最近 400 条调用记录（时间、客户端、供应商、模型、入/出/总 Token），
  采用虚拟化列表，海量数据滚动与切换丝滑不卡顿
  - 模型汇总（跨供应商归并）：不同供应商对同一模型的命名差异（大小写、组织前缀、
  :variant 变体、日期快照后缀、-free 通道标记、Modal 部署长名）自动归一化合并，
  展开可见各供应商细分与原始模型名，48 个原始模型名归并为 26 组，统计不再割裂
  - 数据持久化至 SQLite，重启不丢，自动清理 90 天前旧数据
  【新增 · 本地会话扫描】
  应用未运行期间客户端产生的用量也能被统计：
  - 直接扫描本地会话文件（Codex ~/.codex/sessions、Claude Code ~/.claude/projects、
  Pi ~/.pi/agent/sessions、OpenCode opencode.db），增量扫描避免重复计数
  - 打开用量监控窗口时自动补扫，历史用量完整入库
  【新增 · 优美的日期时间选择组件】
  替换原有的手输日期文本框：
  - 自绘日历面板（月份翻页、周一开头、今天描边、选中填充）
  - 表盘式时间选择：点击或按住拖动即可实时切换时/分，指针与数值实时联动
  - 小时盘双环设计：外环 00–11、内环 12–23，24 小时一键可达
  - 分钟盘 60 个刻度，每 5 分钟一个数字，60 分钟全部可选
    • 时/分独立输入框，左右箭头快速步进，点框内文本展开对应表盘
    • 快捷区间「近一天 / 近一周 / 近 30 天」按完整自然日（0 点 ~ 23:59:59）计算，
    不再按打开时刻截断
  【优化 · 性能】
  - 用量监控所有 SQLite 查询移至后台线程执行，UI 线程零阻塞
  - 供应商明细、客户端汇总、调用明细三个列表全部接入虚拟化（容器回收），
  大幅降低切换标签页与滚动的卡顿
  - 每日趋势图重绘加入 120ms 防抖，拖动窗口大小时不再逐帧重算
  - Antigravity 标签页刷新逻辑异步化，点击切换不再卡顿
  （进程枚举、SQLite 读取、账号文件加载全部移出 UI 线程）
  - 修复 Antigravity 进程句柄泄漏：关闭 IDE 的轮询循环不再累积未释放的进程对象
  【修复】
  - 修复 Pi / Codex 用量记录中模型名与供应商为空的问题：
  增量扫描从字节偏移处继续时会丢失 model_change 跟踪状态，
  现改为按文件持久化模型/供应商状态，并优先采用每条消息自带的 provider/model 字段
  （实测存在率 100%）。修复后 222 条 Pi 记录、703 条 Codex 记录全部正确归类
  - 修复「近一天」实际显示两天数据的问题
  - 修复日期时间选择弹层点击内部元素即关闭、导致无法选择的问题
  【工程】
  - 启动日志加入大小轮转（超过 1MB 保留尾部 256KB），并加锁避免并发写错乱
  - 清理构建缓存约 331 MB（旧发布包、Debug 产物、WPF 临时工程残留）
  【说明】
  - Antigravity 为配额桶粒度，本地会话库与云端配额接口均不提供单次调用的
  Token 明细，因此用量监控不包含 Antigravity 的 Token 消耗；
  配额剩余百分比仍可在 Antigravity 标签页查看
  - 用量统计仅覆盖开启路由后走本地网关的流量与本地会话文件，
  纯直连模式的请求无法捕获
