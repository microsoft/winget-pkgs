ReleaseNotes: |-
  APISwitch is a lightweight, modern API provider and Google Antigravity official account management tool for AI coding assistants (Google Antigravity, Claude Code, Claude Desktop, Codex, OpenCode, Pi).
  🌟 Highlights in v0.1.1
  - Google Antigravity Account & Quota Management:
    - Seamless multi-account switching with credential snapshots and Antigravity Tools bidirectional synchronization.
    - Accurate quota tracking for Free (Starter) accounts directly via Google official endpoints (fixes earlier issues where used accounts incorrectly showed 100%).
    - Real-time dual quota metrics: Gemini Models & Claude / GPT models (Weekly base limits, remaining percentages, and refresh countdowns).
    - Clean, focused UI prioritizing official Google login and account onboarding.
  - Multi-Platform AI CLI Routing:
    - Full configuration switching for Claude Code, Claude Desktop, Codex CLI, OpenCode, and Pi.
    - High-performance local routing gateway (127.0.0.1:28888) with protocol bridging and model redirection.
  - Desktop Experience:
    - Modern Windows 10/11 Fluent UI with HarmonyOS Sans SC typography.
    - System tray resident menu with quick account switching and IDE launch shortcuts.
    - Built-in automatic update checking.
  📦 Downloads
  - Installer: APISwitch-Setup-v0.1.1.exe (Recommended: Modern Inno Setup installer, no UAC admin prompts required, desktop shortcuts, auto-update ready).
  - Portable: APISwitch-v0.1.1-win-x64.zip (Self-contained, no .NET installation needed, extract and run).
