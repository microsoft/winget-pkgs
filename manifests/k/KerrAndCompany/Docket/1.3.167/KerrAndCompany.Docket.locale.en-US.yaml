ShortDescription: Audit any website for SEO problems on your own PC. Free to try.
Description: |-
  Check Engine SEO (formerly Docket SEO) audits a website for SEO problems on your own computer. Type an address and it reads
  the site the way a search engine does: it follows the links, reads the pages and runs 99 checks across technical SEO, copy,
  conversion, brand, AI search visibility and campaign tracking. Then it gives you one ranked plan of what to fix. The audit
  runs on your PC, with no account. The free version needs no key and shows your score, how many problems each category has,
  and the top problem in full, with its fix. The paid version is a one-time purchase on checkengineseo.com.
