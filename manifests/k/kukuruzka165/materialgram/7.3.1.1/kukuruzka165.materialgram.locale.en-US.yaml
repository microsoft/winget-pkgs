ReleaseNotes: |-
  **Official changelog:**

  • Money.
  • Update emoji to Unicode 17.
  • Submit the rich messages editor with Ctrl+Enter.
  • Play audio tracks in a rich message as a playlist.
  • Improve screen reader support for message selection and the unread bar.
  • Add text tool with fonts, alignment and styles to the image editor.
  • Drop folders and file sets into a chat to send them as one archive.
  • Edit GIFs before sending them with a caption.
  • Rate a finished call with stars right in the call panel.
  • Make custom emoji out of video stickers.
  • Show a tooltip with the link for buttons in rich messages.
  • Show estimated result size in the video editor timeline.
  • Follow the scroll direction in swipe gestures.
  • Widen rich message bubbles to fit wide content.
  • Choose fitting quality for video autoplay in channels.
  • Disable gift messages for recipients who charge for messages.
  • Add emoji status actions to the custom emoji context menu.
  • Add slash menu with insertable blocks to the article editor.
  • Add ban and unban of users in channel direct messages.
  • Show reaction preview above the menu of who reacted list.
  • Highlight the search query when jumping to a found message.
  • Convert QuickTime videos to mp4 when sending them as GIFs.
  • Show who reacted preview next to the cursor.
  • Improve restoring of opened windows and chats on relaunch.
  • Don't hide content from screenshots while the app is passcode-locked.
  • Add welcome messages for groups and channels.
  • Add buttons and file blocks to rich messages.
  • Improve lists, tables and markdown pasting in the rich editor.
  • Add self-destruct timers and single view for photos and videos.
  • Add video profile photos for yourself, chats and channels.
  • Add video editor with trimming, quality and cover frame.
  • Add restoring of opened windows and chats on relaunch.
  • Add sending of music files in the attach menu.
  • Add new WEB proxy type to connection settings.
  • Add saving rich messages to HTML and importing them back.
  • Add custom prompt tab to AI editing in the article editor.
  • Add experimental Vulkan rendering option on Linux.
  • Add geometric shapes to the image editor.
  • Add better passkeys support on Windows, macOS and Linux.
  • Add undo for moving and resizing items in the image editor.
  • Extend chats list pull gesture to unread forum topics.
  • Allow muting forever by left click on the profile mute button.
  • Improve tables, tasks and titles in rich message previews.
