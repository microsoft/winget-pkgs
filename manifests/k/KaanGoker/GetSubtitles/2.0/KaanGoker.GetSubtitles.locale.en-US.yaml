ShortDescription: Subtitles for any video in 99 languages, on your own computer, with an editor to fix them.
Description: |-
  GetSubtitles makes subtitles for video and audio files in 99 languages with OpenAI's Whisper (faster-whisper), on your own computer.
  Check the lines on the video in the built-in editor and download them as .srt, .vtt or .txt. It can also translate the speech into English subtitles, and it has a mode for vertical videos.
  With an NVIDIA card, one button downloads the GPU support. The app opens in your browser.
