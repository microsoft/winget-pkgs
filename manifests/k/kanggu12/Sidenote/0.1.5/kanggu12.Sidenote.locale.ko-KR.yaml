# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.10.0.schema.json

PackageIdentifier: kanggu12.Sidenote
PackageVersion: 0.1.5
PackageLocale: ko-KR
ShortDescription: 화면의 문제를 읽고 풀이를 옆에 적어 주는 도우미
Description: |-
  Sidenote는 화면을 읽고 스피커 소리를 듣습니다. 연습 코딩 문제, 강의 자료 속 질문, 오류 로그 같은 문제가
  보이면 풀이를 브라우저의 패널에 적어 작업 옆에 보여 줍니다. Ollama로 내 GPU의 비전 모델이 모든 화면을 먼저 보고,
  어려운 문제만 이미 쓰는 클라우드 에이전트(Claude Code, Codex)에 보냅니다. 공부, 연습, 자기 일을 위해 만들었습니다.
Documentations:
- DocumentLabel: 사용 안내서
  DocumentUrl: https://github.com/kanggu12/sidenote/blob/main/docs/README.md
ManifestType: locale
ManifestVersion: 1.10.0
