ShortDescription: 拖拽即转的 Windows 桌面工具：把 PDF、Word、Excel、PowerPoint 等文档在本地转换成 Markdown。
Description: |
  基于开源项目 MarkItDown 的 Windows 桌面界面。把文件或整个文件夹拖进窗口（或用文件
  选择器挑选），每个文件在本地工作线程池里转换，逐文件显示状态与耗时，支持重试、取消
  与多选另存。转换出的 Markdown 默认写在源文件旁边，也可以在设置里指定固定目录。

  输入格式包括 PDF、Word、PowerPoint、Excel、CSV、HTML、EPUB、Outlook MSG、JSON、
  XML/RSS、Jupyter Notebook 以及纯文本等；音视频转写与图片 OCR 尚未实现。

  全部在本地完成：无需账号、无遥测、文档不会被上传，唯一的网络请求是可选的
  GitHub Releases 更新检查。界面提供简体中文与英文。

  本项目为独立项目，与微软无关；MarkItDown 作为依赖库使用。
