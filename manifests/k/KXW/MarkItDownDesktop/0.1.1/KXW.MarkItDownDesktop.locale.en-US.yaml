ShortDescription: Drag-and-drop desktop app that converts PDF, Word, Excel, PowerPoint and other documents to Markdown locally.
Description: |
  Windows desktop GUI for MarkItDown, the open-source document-to-Markdown converter.
  Drag files or whole folders onto the window (or use the file picker); every file is
  converted in a local worker pool, with per-file status, elapsed time, retry, cancel
  and multi-select save. Converted Markdown is written next to each source file by
  default, or to a fixed folder chosen in the settings.

  Input formats include PDF, Word, PowerPoint, Excel, CSV, HTML, EPUB, Outlook MSG,
  JSON, XML/RSS, Jupyter Notebook and plain text files. Audio/video transcription and
  image OCR are not implemented.

  Everything runs locally: no account and no telemetry, and documents are never
  uploaded. The only network request is an optional update check against GitHub
  Releases. The interface is available in Simplified Chinese and English.

  This is an independent project and is not affiliated with Microsoft; MarkItDown is
  used as a library dependency.
