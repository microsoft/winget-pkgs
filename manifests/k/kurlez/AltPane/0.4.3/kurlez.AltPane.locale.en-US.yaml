ShortDescription: A modern Alt+Tab replacement for Windows.
Description: |-
  AltPane replaces the Windows Alt+Tab switcher while it is running.
  It lists open windows on every monitor. The default order is focus time: windows you actually use come first, and rarely used or self-activating apps stay last.
  Switcher windows are created at startup and kept hidden so Alt+Tab can paint immediately.
