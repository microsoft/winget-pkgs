PackageIdentifier: kurlez.AltPane
PackageVersion: 0.4.3
PackageLocale: zh-CN
Publisher: kurlez
PackageName: AltPane
License: MIT
ShortDescription: 适用于 Windows 的现代 Alt+Tab 替换工具。
Description: |-
  AltPane 在运行期间替换 Windows 的 Alt+Tab 切换器。
  它在每台显示器上列出打开的窗口。默认按使用时长排序：真正用过的窗口在前，不常用或自己抢前台的应用排在最后。
  切换窗口在启动时创建并保持隐藏，因此按下 Alt+Tab 后可以马上显示。
