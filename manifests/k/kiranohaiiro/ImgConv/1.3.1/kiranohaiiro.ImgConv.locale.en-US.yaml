ShortDescription: Tiny offline image converter that makes photos fit a file-size limit from the right-click menu.
Description: |-
  ImgConv converts images to JPG, PNG, BMP, GIF or TIFF and automatically finds the best quality that fits a file-size limit (for example, under 490 KB for upload forms).
  Right-click a photo in Explorer, including the new Windows 11 menu, and pick a format. It opens JPEG XL, WebP, HEIC and AVIF, uses Google's jpegli encoder for JPG, removes location data, and never connects to the internet.
