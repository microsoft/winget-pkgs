ShortDescription: VISA library implementation for controlling instruments over GPIB, USB, LAN, and serial interfaces.
Description: |-
  KI-VISA is a VISA (Virtual Instrument Software Architecture) library conforming to the IVI Foundation VISA specification. It provides a common API for controlling measurement instruments over GPIB, USBTMC, LAN (VXI-11, HiSLIP, raw socket), and serial interfaces, and can be used with instruments from any vendor.
