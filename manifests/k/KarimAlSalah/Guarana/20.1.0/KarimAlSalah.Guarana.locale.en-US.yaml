ShortDescription: Open-source Switch 2 emulator tuned for integrated GPUs. Installs and updates the emulator for you. Bring your own keys, firmware and games.
Description: |-
  Guarana is a GPL-3.0-or-later fork of Lichii for Windows x64, tuned for integrated GPUs: Intel Arc first, then AMD Radeon.
  It focuses on even frame pacing, frame generation and fast boot.
  This package is the Guarana launcher. It installs per user without administrator rights, then installs, updates and checks the emulator.
  Guarana ships no keys, firmware, games or system files. You must supply your own, dumped from hardware you own.
  The project is independent and is not affiliated with Nintendo or the Lichii project.
