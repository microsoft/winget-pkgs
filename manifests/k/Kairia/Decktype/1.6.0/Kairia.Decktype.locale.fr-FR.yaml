ShortDescription: "L'éditeur de présentations natif IA : votre IA crée le deck dans vos modèles, vous le retouchez à la main."
Description: |-
  Decktype est un éditeur de présentations natif IA, indépendant de PowerPoint. Demandez votre deck à votre IA : il arrive dans vos modèles, et vous le retouchez à la main.
  Votre IA écrit le deck dans Claude ou ChatGPT avec le connecteur Decktype, ou avec Claude Code et Codex, reliés par « Connecter un agent… ». Structure, textes, chiffres et mise en page arrivent dans vos modèles : de vraies slides, pas une image figée.
  Cliquez sur un titre, changez une date, déplacez un bloc, au clavier et à la souris. Vos thèmes gardent votre charte graphique sur chaque slide. Importez un PowerPoint, exportez en PDF et PNG, présentez depuis l'application.
  Vos decks sont des fichiers .deck sur votre disque. Après une première connexion, l'éditeur fonctionne hors ligne. Le compte est gratuit, sans carte ; les offres facultatives Pro et Autonomous ajoutent l'export PowerPoint, le partage par lien, les brand kits et un assistant intégré.
