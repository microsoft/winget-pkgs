ShortDescription: "The AI-native presentation editor: your AI builds the deck in your templates, you refine it by hand."
Description: |-
  Decktype is an AI-native presentation editor, independent of PowerPoint. Ask your AI for a deck: it lands in your templates, and you refine it by hand.
  Your AI writes the deck in Claude or ChatGPT with the Decktype connector, or with Claude Code and Codex, linked through "Connect an agent…". Structure, text, figures and layout land in your templates: real slides, not a flat image.
  Click a title, change a date, move a block, with keyboard and mouse. Your themes keep your brand on every slide. Import PowerPoint, export PDF and PNG, present from the app.
  Your decks are .deck files on your disk. After a first sign-in, the editor works offline. The account is free, no card required; optional Pro and Autonomous plans add PowerPoint export, link sharing, brand kits and a built-in assistant.
