Description: "L'agent serveur Kabeen est le composant en charge de la collecte des informations sur l'infrastructure du système d'information : configuration de l'hôte, métriques système, programmes installés et processus en cours. Il se présente sous la forme d'un service système autonome à installer sur chaque serveur que l'on souhaite analyser dans Kabeen. Les données sont transmises au backend Kabeen via gRPC sur TLS, sur le port sortant 443/TCP uniquement."
