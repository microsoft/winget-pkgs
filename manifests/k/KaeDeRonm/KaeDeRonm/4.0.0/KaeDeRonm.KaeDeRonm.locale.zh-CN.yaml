ShortDescription: 现代化杀毒软件，支持多引擎扫描、实时防护与自我完整性保护。
Description: |-
  凯德荣（KaeDeRonm）是一款使用 Python + PySide6 开发的现代化杀毒软件。

  核心能力：
  - 扫描引擎：哈希匹配（MD5/SHA1/SHA256）、特征码匹配、Aho-Corasick 多模式加速、
    YARA 风格规则、启发式扫描（熵分析 / PE 异常 / Office 宏 / 脚本混淆 / 勒索特征）
  - 自研 KG 机器学习引擎（4.0 起正式接入扫描链路）
  - 实时防护：文件系统监控、进程与端口检测、注册表监控
  - 主动防御（HIPS）：可自定义规则引擎，拦截进程创建 / 文件写入 / 注册表改动
  - 自我完整性保护：注册 Windows 服务常驻守护，源码与配置被改动即自动恢复
  - 勒索软件回滚：检出勒索行为后自动从卷影快照还原被加密的文档
  - 隔离区与威胁通知中心
  - KD-LG 插件系统（.kdr 插件包，Ed25519 签名校验）
  - 完整中英双语界面
  - 云端病毒库同步与样本上报

  注：安装过程会注册两个 Windows 服务（自我保护服务、防御服务），
  用于在图形界面未运行时继续提供保护。
