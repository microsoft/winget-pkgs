ShortDescription: Kairos — write the rule once; list the dates. A small language for recurring schedules; exports .ics, JSON or TSV.
Description: |-
  Kairos is a small language for recurring schedules: paydays, business-day rules, "the second Tuesday", holiday-aware shifts, fiscal and ISO-week calendars.
  kairos.exe is the reference implementation's command-line tool, built from the same source as the npm package kairos-lang. It runs without installing Node.js.
  Use it to list the dates of a schedule for a range, to find the next occurrences, and to export them as .ics (calendar), JSON or TSV (Excel, PowerShell).
