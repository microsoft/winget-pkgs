PackageName: Kairos
ShortDescription: 決めたら、いつでも。繰り返しの予定を書くための小さな言語。規則を一度書けば、日付の一覧と .ics／JSON／TSV の書き出しが得られます。
Description: |-
  Kairos は繰り返しの予定（給料日・営業日の規則・第 2 火曜・祝日をよけるずらし・会計年度・ISO 週）を書くための小さな言語です。
  kairos.exe は参照実装のコマンドラインツールで、npm パッケージ kairos-lang と同じソースから作られています。Node.js を入れずに動きます。
  範囲内の日付の一覧・次の予定の取得・.ics（カレンダー）／JSON／TSV（Excel・PowerShell）への書き出しに使います。
