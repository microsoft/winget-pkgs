ShortDescription: Offline file sharing between Windows and Android over Wi-Fi or hotspot.
Description: |-
  BubbleDrop sends files, folders, photos, apps and text between Windows PCs and Android phones over your local Wi-Fi or a phone hotspot.
  Nothing goes through the internet, so it uses no mobile data and needs no account.
  Devices find each other automatically, every transfer needs your OK, and any browser can join through Web Share with a PIN.
