InstallationNotes: |-
  Requires Microsoft Store KikuTune 1.2.0 or later for Noise Control and AAP integration.
  The test-signed AAP driver requires Windows Test Mode and Secure Boot off.
  Use interactive installation to review and accept the driver requirements.
  Silent installation requires those prerequisites and the driver certificate trust to be configured already; it does not enable Test Mode or add certificate trust automatically.
  The installer is unsigned. See the Bridge guide before installation.
