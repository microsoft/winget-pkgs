PackageIdentifier: KikuLabs.KikuTuneBridge
PackageVersion: 1.2.0
PackageLocale: en-US
Publisher: KikuLabs
PublisherUrl: https://kikutune.com
PublisherSupportUrl: https://github.com/DarrosHere/KikuTune/issues
Author: Andrii Herasym
PackageName: KikuTune Bridge
PackageUrl: https://kikutune.com/bridge
License: Proprietary
LicenseUrl: https://kikutune.com/terms
PrivacyUrl: https://kikutune.com/privacy
Copyright: © 2026 Andrii Herasym
ShortDescription: Free companion for the KikuTune Microsoft Store app that adds the ten-band equalizer and, on supported AirPods, noise control.
Description: |-
  KikuTune Bridge adds the sound features the Microsoft Store edition of KikuTune cannot provide on its own: a ten-band equalizer with presets, preamp, balance and a limiter, kept separately for each pair of headphones. On supported AirPods it can also add Noise Cancellation, Transparency and Adaptive control from the PC.
Moniker: kikutune-bridge
Tags:
- airpods
- airpods-max
- airpods-pro
- audio
- beats
- bluetooth
- bluetooth-headphones
- equalizer
- headphones
- noise-cancellation
ReleaseNotesUrl: https://github.com/DarrosHere/KikuTune/releases/tag/v1.2.0
InstallationNotes: |-
  Requires KikuTune from the Microsoft Store.
  Installing with winget adds Bridge and the equalizer. Noise Control needs a test-signed driver that only installs with Windows Test Mode on and Secure Boot off; to add it, run `winget install KikuLabs.KikuTuneBridge --interactive` and follow the installer, or see the Bridge guide.
  The installer is unsigned, so Windows may show an unknown publisher warning.
Documentations:
- DocumentLabel: Bridge installation guide
  DocumentUrl: https://kikutune.com/bridge
