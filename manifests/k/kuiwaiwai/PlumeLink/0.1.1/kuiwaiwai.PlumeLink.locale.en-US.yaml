ShortDescription: Windows companion that turns an Android phone into a touchpad, directional remote, keyboard or microphone.
Description: |-
  PlumeLink turns an Android phone into a touchpad, directional remote or microphone for a Windows PC, and transfers files in either direction over the local network or a USB data cable. No account is required.

  Control options on the phone:
  - Touchpad: move, tap to click, hold to drag, scroll with two fingers and pinch to zoom.
  - Directional remote: navigate with a D-pad, confirm or cancel, hold a direction to repeat, and choose a dial size in Settings.
  - Keyboard and windows: send text to the focused PC field, find a window and switch to it.
  - Shortcuts and media: configure three shortcuts with icons, key combinations or editing, browsing, presentation and media presets.
  - Quick launch: open apps and folders configured under Preferences on Windows.

  In landscape, controls can be swapped between sides or hidden with focus mode, and up to eight custom shortcut plans can be saved per PC. System media actions work with players that support Windows media keys. Both apps support English, Simplified Chinese and Traditional Chinese, with light, dark and system themes.

  Files can be shared from the Windows file page and saved on the phone, or sent to the PC from PlumeLink or the Android system share menu after confirming the target PC, with a 2 GB limit per file.

  The phone microphone streams to a selected audio device on the PC. VB-CABLE routes that audio into websites or recording software; remote control and file transfers work without configuring the audio driver.

  Devices pair through a QR code or a six-digit pairing code on the same trusted network, with certificate confirmation. USB connections require Android USB debugging approval and PlumeLink pairing.
