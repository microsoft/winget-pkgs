ReleaseNotes: |-
  Highlights
  - Connect Android and Windows with a USB data cable for remote control, text, files and microphone audio. The Windows installer includes the USB connection component.
  - Refined native Android touchpad, directional remote, keyboard and file interfaces, with portrait and landscape layouts, customizable shortcut icons and saved shortcut plans.
  - Send files to your PC through Android’s system share menu.
  - Improved microphone connection handling, status guidance and audio-device diagnostics, with a VB-CABLE reinstall action on Windows.
  - Device management and USB lists use the phone’s system name where available and retain custom names set on the PC.
  Fixes
  - USB detection on Windows in non-ASCII paths, on first launch and alongside other ADB environments.
  - Android file-search keyboard pushing up navigation, landscape input overlap and microphone timer truncation.
  - Re-pairing a saved PC after a reinstall changes its identity or certificate. Verify it in the current connection without clearing trust for other PCs; old pairing tokens are not sent to a new certificate.
  - Layout and text improvements across English, Simplified Chinese and Traditional Chinese, light and dark themes, and compact and tablet layouts.
