PackageIdentifier: kuiwaiwai.PlumeLink
PackageVersion: 0.1.1
PackageLocale: zh-CN
ShortDescription: 把 Android 手机变成 Windows 电脑的触控板、方向遥控器、键盘或麦克风的电脑端程序。
Description: |-
  羽连 PlumeLink 可以把 Android 手机变成 Windows 电脑的触控板、方向遥控器或麦克风，也能通过局域网或 USB 数据线在两端互传文件，无需注册账号。

  手机端的遥控能力：
  - 触控板：移动、轻点点击、长按拖拽、双指滚动和双指缩放。
  - 方向遥控：使用方向键导航、确认或取消，长按方向可连续重复，并可在设置中选择转盘大小。
  - 键盘与窗口：向电脑当前聚焦的输入框发送文字，查找并切换窗口。
  - 快捷操作与媒体：配置三个快捷操作，可选图标、组合键或编辑、浏览、演示、媒体预设。
  - 快速启动：打开电脑端「偏好设置 → 遥控设置 → 电脑快捷方式」中配置的应用和文件夹。

  横屏时可以交换两侧控件布局，或使用专注模式腾出空间；每台电脑最多可保存八套快捷方案。系统媒体操作适用于支持 Windows 媒体键的播放器。两端均支持简体中文、繁體中文和 English，并提供浅色、深色和跟随系统主题。

  文件可以从电脑文件页共享后在手机保存，也可以在羽连中选择文件，或从其它 Android 应用使用「分享」发送，核对目标电脑后上传，单个文件上限 2 GB。

  手机麦克风会把声音送到电脑上选定的音频设备。通过 VB-CABLE 可将声音送入网站或收音软件；遥控和文件传输不需要配置该音频驱动。

  设备在同一可信局域网内通过二维码或六位配对码完成配对，并需核对证书。USB 连接需要允许 Android USB 调试并完成羽连配对。
