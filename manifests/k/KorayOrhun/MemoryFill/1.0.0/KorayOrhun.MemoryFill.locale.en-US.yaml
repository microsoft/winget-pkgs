ShortDescription: Locks a chosen amount of physical RAM to test applications under memory pressure.
Description: MemoryFill is a portable single-file Windows tool for developers and testers. Pick an amount of RAM (1-512 GB) and click Fill; the memory is committed and locked with VirtualLock in 256 MB chunks so it cannot be paged out, letting you observe how your application behaves when the machine runs low on memory. Stop at any time; releasing or closing the window frees everything instantly. No installer, no admin rights.
