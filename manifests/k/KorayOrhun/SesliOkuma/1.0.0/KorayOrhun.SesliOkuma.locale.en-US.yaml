ShortDescription: Reads the selected text aloud in any app with Ctrl+Alt+S (Turkish/English voices), from the system tray.
Description: Sesli Okuma is a small Windows 11 tray tool. Select text in any application and press Ctrl+Alt+S to hear it read aloud; press again to stop. A minimal settings panel lets you pick separate voices for Turkish and other languages, adjust speed and toggle start with Windows. Works with any SAPI voice; natural neural voices are available through the optional NaturalVoiceSAPIAdapter project.
