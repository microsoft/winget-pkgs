ShortDescription: A keyboard-playable homage to the 1989 arcade driving simulators - stunt track, traffic, ghost lap, two cars.
Description: GrudgeLap is a free, open-source driving game in the spirit of the 1989 arcade simulators. A four-speed flat-twelve or a seven-speed V8 with real engine recordings, a fork between a long speed route and a short stunt route with an open drawbridge, a vertical loop and a banked 180, dips, traffic in both directions, checkpoints against the clock, an instant replay after every crash, a hidden skid pad, a "1989 mode" and the grudge match against the ghost of your best lap. Windowed or full screen, keyboard only, no installer dependencies.
