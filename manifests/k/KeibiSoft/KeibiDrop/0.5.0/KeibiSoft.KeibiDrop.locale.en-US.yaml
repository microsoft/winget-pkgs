ShortDescription: Open another computer's folder over the internet as if it were local, and send files of any size, end-to-end encrypted.
Description: |-
  KEIBIDROP opens a folder on another computer over the internet as if it were a folder on your own computer. This mode is called Teleport: each file streams when an application opens it, so you work on a large folder without waiting for an upload or a download.
  KEIBIDROP also sends files between two devices with no account and no file size limit, and a dropped connection resumes where it stopped. The other person can use the app on Windows, macOS, Linux or Android, or join from a browser at https://web.keibidrop.com.
  Every connection is end-to-end encrypted with a post-quantum key exchange (X25519 and ML-KEM-1024). Teleport on Windows uses WinFsp, which this package installs with it.
