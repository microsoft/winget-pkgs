ShortDescription: Autocorrect that fixes typos as you type, judged by the keys around each slip on your keyboard.
Description: |-
  Unslip fixes the word you just typed when you press space or a full stop, weighing every word one slip away, keys next door first, on the keyboard that sent the keys (a standard keyboard or a KeBe).
  One Backspace straight after a fix puts your word back, and Unslip leaves it alone from then on.
  It stays out of code editors, terminals and password boxes, and out of Word, Outlook and Notepad, which correct words themselves.
  It never connects to the internet. It keeps only your settings, the number of words it has fixed and the words you told it to leave alone; uninstalling deletes them.
