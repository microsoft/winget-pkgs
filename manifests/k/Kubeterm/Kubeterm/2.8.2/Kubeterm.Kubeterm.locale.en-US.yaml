ShortDescription: An AI-assisted Kubernetes client for desktop and mobile.
Description: |-
  Kubeterm is a graphical Kubernetes client that connects directly to your clusters, with nothing to install cluster-side. It discovers kubeconfig files automatically, signs in natively to AWS EKS, Google GKE, Azure AKS and DigitalOcean, and authenticates any cluster through OIDC.

  Browse every resource type including custom resources, stream logs from multiple pods at once, exec into containers with a full terminal, browse a running pod's file system, forward ports and attach ephemeral debug containers. Helm releases have a full lifecycle with an Artifact Hub chart browser, and Argo CD and Flux CD application status is read straight from the cluster API.

  A built-in AI assistant reads live cluster state to investigate resources and explain failing workloads, using your own OpenAI, Anthropic, Gemini or DeepSeek key. Credentials stay in the platform keychain and are never transmitted to a Kubeterm server.
