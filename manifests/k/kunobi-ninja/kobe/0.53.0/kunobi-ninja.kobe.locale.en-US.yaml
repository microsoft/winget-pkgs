ShortDescription: CLI for the kobe cluster-pool operator — instant CI/dev Kubernetes clusters
Description: kobe is a Kubernetes cluster-pool operator for instant CI/dev cluster provisioning (k3k, k3s, k0s, CAPI). This CLI leases and manages clusters from kobe pools.
