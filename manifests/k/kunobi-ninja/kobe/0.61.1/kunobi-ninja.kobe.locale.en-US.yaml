ReleaseNotes: |-
  Kobe keeps logs and terminals usable when a long-lived sandbox fills its execution ledger. New execution requests receive a capacity error before they consume space needed for access and teardown.
  - Compact repeated execution identities while retaining every reservation and retry record.
  - Recover full legacy ledgers during access registration or gate closing.
  - Let existing reservations bind and finish even when the legacy ledger predates the admission budget.
  - Update TLS dependencies to patched releases.
  Operator upgrade
  Stop every older operator replica before starting v0.61.1. Use a coordinated restart across this format change: an older controller can quarantine a lease after a newer replica compacts its history. Pause automatic rollout while coordinating the upgrade. Drain leases with compact histories before rolling back to an older operator.
