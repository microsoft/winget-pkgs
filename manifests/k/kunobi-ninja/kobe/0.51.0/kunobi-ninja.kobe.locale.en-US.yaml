ReleaseNotes: |-
  Renames the general-purpose agent image to zondax/kobe-sandbox, preinstalls opencode and iputils-ping, trims the login banner, and lets SSH reach a lease by its pool-relative name.
  cargo install kobectl --locked --version 0.51.0
  What changed
  - Sandbox image rename: The image is published as zondax/kobe-sandbox (formerly kobe-agent-workspace). Existing SandboxPools continue working; update image: to docker.io/zondax/kobe-sandbox:v0.51.0 on your next rollout. Local builds use docker buildx bake sandbox. (#323)
  - Preinstalled tooling in sandbox: opencode (opencode-ai@latest) is preinstalled alongside Codex and Claude Code, versioned in /etc/kobe-sandbox-versions. iputils-ping is included for first-hop network diagnostics. (#323)
  - Branded login banner: Interactive logins print a single cyan line: kobe · sandbox · N CPUs (cgroup quota). The previous three-line lecture about env vars and GitHub issue numbers is removed. It respects NO_COLOR and TERM=dumb, and stays silent for non-interactive kobe exec. (#322, #323)
  - SSH proxy lease resolution: ssh kobe-<pool>-<name> now resolves a lease named <name> within <pool> in addition to whole-host aliases. Leases created via kobe lease --name dev are reachable over SSH directly. (#321)
  What this does not fix
  - nproc inside the sandbox container still reports the host CPU count rather than the cgroup quota (#272). kobe-runner sizes CARGO_BUILD_JOBS and RUST_TEST_THREADS from the real quota on every process it spawns, but tools that read /proc/cpuinfo or nproc directly still see the host count until a virtualization runtime like Kata is deployed.
  Full changelog: v0.50.1...v0.51.0
