ReleaseNotes: |-
  Kobe now works with machines you already reach over SSH. Save a host, run commands, forward ports, or open a shell. For Macs with Screen Sharing enabled, kobe vnc --host adds screenshots, clicks, typing, and the system VNC viewer.
  Install with Homebrew:
  brew install kunobi-ninja/kunobi/kobe
  Added
  - SSH hosts: kobe host set, list, and remove manage named machines in global or project configuration. exec, port-forward, and ssh use your system SSH configuration and keys. #403 by @jleni.
  - Mac Screen Sharing: VNC commands accept --host and connect over SSH. Passwords are resolved from 1Password, Keychain, environment variables, or commands; configuration stores the reference. #403 by @jleni.
  kobe host set mini --ssh ci@mac-mini --vnc-password "op://vault/Mac/password"
  kobe host exec mini -- uname -a
  kobe vnc screenshot --host mini -f mini.png
  Hosts are existing machines: Kobe does not reserve or recycle them. See the host guide for setup and commands.
  Contributors
  jleni
