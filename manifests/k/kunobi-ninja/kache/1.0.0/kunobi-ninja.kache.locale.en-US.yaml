ShortDescription: Content-addressed zero-copy build cache for Rust, C/C++ and more
Description: kache is a content-addressed, zero-copy build cache for Rust, C/C++ and more. It avoids file copies and wasted disk by hardlinking artifacts locally and sharing them via S3-compatible object storage.
