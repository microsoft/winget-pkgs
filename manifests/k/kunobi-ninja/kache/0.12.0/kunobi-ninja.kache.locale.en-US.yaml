ReleaseNotes: |-
  kache 0.12.0 — pluggable storage backends, and a cache that knows what things cost
  kache is a content-addressed build cache that plugs in as a RUSTC_WRAPPER (and a C/C++ compiler wrapper). 0.12.0 opens up where the cache can live (OpenDAL-backed S3 and filesystem remotes), teaches garbage collection what an entry actually costs to rebuild, and makes "why did this miss?" point at the crate that really changed.
  Why
  Two of the cache's oldest simplifications were starting to hurt. The remote layer was welded to one S3 SDK, so "put the cache on a plain shared filesystem" or "use a different object store" meant a rewrite. And eviction ranked entries purely by size — but on a real 52k-entry store, size correlates only loosely with rebuild cost (log-log 0.73), and the value-per-byte of an entry spans roughly 48x between crates, so size-only eviction throws away expensive-to-rebuild artifacts to keep cheap ones. 0.12.0 fixes both, and sharpens the diagnostics you reach for when a hit you expected turns into a miss.
  What's new
  - Pluggable remotes via OpenDAL. New S3 and filesystem remotes built on OpenDAL sit alongside the original backend, so the cache can live on a shared filesystem or a non-AWS object store without a bespoke integration — the payoff of the RemoteBackend trait extracted in 0.11.0.
  - Cost-aware eviction. GC now indexes each entry's compile_time_ms (already recorded in its metadata) so eviction can weigh what an artifact costs to rebuild, not just how big it is; it also records post-eviction demand via tombstones to learn from what it dropped.
  - why-miss points at the real culprit. When one crate's artifact changes, its extern:<name>=<hash> re-keys every crate above it, and the old report blamed all of them equally. why-miss now walks the extern chain to the crate that actually changed, instead of making you trace forty downstream crates by hand.
  - Lossless recovery from a corrupt index. The index is derived state — blobs plus each entry's meta.json are the source of truth — so a corrupt index is now quarantined and rebuilt from the store rather than discarded.
  - Executables cached by default on Linux. Linux embeds DWARF in the binary, so a restored executable debugs exactly like a freshly linked one; the old skip-by-default was paying a macOS-specific debuggability tax (Mach-O N_OSO) that doesn't apply on Linux.
  - Also: a Nix flake (checks, devShell, formatter, module), more cc flags classified so aws-lc-sys TUs cache, and a fix for RUSTSEC-2026-0213 (ammonia).
  These notes were drafted with LLM assistance and edited by the maintainers (@jleni, @emmanuelm41).
