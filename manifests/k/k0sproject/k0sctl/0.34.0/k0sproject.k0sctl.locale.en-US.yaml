ReleaseNotes: |-
  ## Breaking change

  • WinRM no longer sends a password over plain HTTP. A host with `winrm.password` and without `useHTTPS：true` now fails validation. This also applies with `useNTLM: true`. Set `useHTTPS: true`. To keep the old behavior, set
  `insecure：true`. `insecure` now means "allow an unprotected connection", not only "accept invalid TLS certificates". (k0sproject/rig#516)

  ## New features

  • Manage node labels and taints from the host config by @cvas22 in #1259
  • Allow per-host k0s config overrides by @cvas22 in #1285
  • Add a `logs` command to show the k0s service logs by @cvas22 in #1290
  • Block controller upgrades that skip a Kubernetes minor version by @cvas22 in #1260
  • Refuse to restore a backup onto a running cluster by @cvas22 in #1264
  • Warn about multiple controllers without a load balancer by @cvas22 in #1269

  ## Fixes

  • Stop retrying credentials that the host keeps rejecting by @100milliongold in #1211
  • Stop retrying when k0s refuses to create a join token by @cvas22 in #1281
  • Upgrade stopped workers when `--force` is given instead of rejoining them by @amlaban65 in #1270
  • Wait for the k0s PID to change after a worker upgrade by @kke in #1284
  • Detect the IPv6 primary address family with node-local load balancing by @itskyf in #1256
  • Treat an unset CPLB type as Keepalived by @twz123 in #1292
  • Keep leader-only SANs off other controllers when reusing an existing config by @kke in #1242
  • Improve how `--config` flag is generated in the `k0sctl kubeconfig` tip shown after apply by @blicknix in #1268
  • Close the GitHub API response body on every return path by @kke in #1249

  ### Fixes from rig v2.4.1

  • sudo with `Defaults requiretty` works again. k0sctl v0.32.0 to v0.33.1 could not use sudo on these hosts. k0sctl now runs sudo inside `script(1)` and logs a warning when it does. The host must have `script`. It is part of
  util-linux. On Alpine, install `util-linux-misc`. (k0sproject/rig#514)
  • Uploads to XFS are fast again. The upload block size came from the wrong stat field. On XFS, the default filesystem on RHEL and its derivatives, uploads could run with blocks of a few dozen bytes. (k0sproject/rig#467)
  • Uploads to Windows hosts are faster. They are sent in 4 MiB pieces instead of 32 KiB pieces. Overwriting a file on Windows now replaces all of the old content, and files larger than 2 GiB can be written. (k0sproject/rig#479,
  k0sproject/rig#482)
  • A silent SSH connection no longer stops k0sctl indefinitely. Commands and keepalives now time out when the connection stops answering. (k0sproject/rig#507, k0sproject/rig#510)
  • SSH connection errors show the text the server sent before its SSH version line, for example a connection limit message or a service on the wrong port. (k0sproject/rig#486)
  • ssh_config algorithm lists work as in OpenSSH. The `+`, `-` and `^` modifiers on `KexAlgorithms`, `Ciphers`, `MACs`, `HostKeyAlgorithms` and the related options now change the default list. Before, `+` could put the weakest
  key exchanges first, and `-` with a wildcard removed nothing. The `%l` and `%k` tokens are now expanded. (k0sproject/rig#513, k0sproject/rig#505)

  ## Other changes

  • Remove the rig v2 migration warning banner by @kke in #1278
  • Add a security policy by @kke in #1298
  • Build with Go 1.27.4 by @kke in #1299
  • Update dependencies：rig/v2 2.4.1, client-go and apimachinery 0.37.2, doublestar 4.10.7, go-diff 1.4.5, x/text 0.44.0

