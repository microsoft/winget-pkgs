ReleaseNotes: |-
  Script-drop hardening — toast delivery, first-run toast shortcut setup, and the self-update handoff now pass their PowerShell commands inline. WinTUI no longer writes transient .ps1 files for these operations and no longer uses -ExecutionPolicy Bypass; the rendered command line is validated against the Windows CreateProcess length ceiling before launch.

  - Process behavior is unchanged: hidden toast helper, self-update handoff console, and absolute PowerShell/winget path resolution all work exactly as before.
  - Cleanup of legacy handoff-*.ps1 files created by releases before v2.11.2 remains available in the Cleanup tab, relabelled as legacy data.
  - Diagnostics record a fixed operation name and transport, never command text; the self-update log still records the attempted winget command for post-mortem debugging.
  - No settings, cache, history, CLI, or keybinding changes; no dependency or Go toolchain changes — the binary delta is attributable to the transport hardening alone, and the Win32 syscall symbol set is identical to v2.11.1.
