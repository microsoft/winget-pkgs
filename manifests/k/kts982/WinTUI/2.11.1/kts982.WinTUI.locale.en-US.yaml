ReleaseNotes: |-
  Clipboard paste fix — pasting into the `/` filter and the `s` search overlay (Ctrl+V or right-click in the terminal) never worked in any prior version: the terminal delivers pastes as bracketed-paste events, which WinTUI's input routing silently discarded. Pastes now reach the focused text input, with overlays/modals correctly swallowing them, and multi-line clipboard content sanitized.

  - Security: golang.org/x/text 0.40.0 fixes GO-2026-5970 (infinite loop on invalid input, reachable via the text-rendering path — defense-in-depth); built with the Go 1.26.6 security toolchain.
  - Dependencies: charm.land/bubbles 2.1.1, golang.org/x/sys 0.47.0, mattn/go-runewidth 0.0.27 (terminal-accurate width for ZWJ/flag emoji and combining marks) — first dependabot-mediated refreshes, full CI validation. Zero new Win32 surface — the syscall symbol set is identical to v2.11.0.
  - Supply chain: first release with GitHub build-provenance attestations — a `wintui_provenance.intoto.jsonl` bundle ships with the release, and artifacts verify via `gh attestation verify <file> --repo kts982/wintui`. Repo-side, WinTUI now runs CodeQL, OpenSSF Scorecard (published), and a golangci-lint gate.
  - No breaking changes; settings.json, cache.json, and history.json are untouched.
ReleaseNotesUrl: https://github.com/kts982/wintui/releases/tag/v2.11.1
