  This project addresses a long-standing issue in Windows 7, 10, and 11, where windows get repositioned after events such as the system waking up, external monitor connections or disconnections, changes in monitor resolution, or during RDP reconnections.
Description: |
  This project addresses a long-standing issue in Windows 7, 10, and 11, where windows get repositioned after events such as the system waking up, external monitor connections or disconnections, changes in monitor resolution (e.g., exiting full-screen gaming), or during RDP reconnections. The code was forked from ninjacrab.com/persistent-windows.
ReleaseNotes: "## Summary of changes\n1. Create a new branch that strips off the webpage commander feature, checkout PersistentWindowsStrip5.77.zip  #314\n2. Merge Alt+Tab lag fix from @mann1x \n3. Fix powershell script error #469, #470\n4. Hide PowerShell window during execution of capture to disk, and flash PW icon to red instead #467\n5. Fix error to restore from disk due to non-ASCII characters in path #428 by @xuanmossdx \n6. Add Language menu to select a different translation\n   **The novel multi-language translation framework as well as the initial Chinese Simplified translation is contributed by @xuanmossdx \n   All language translations are contained in translations.json file(s). Copy the json file from install dir to local app data dir to make  customizations such as add a new language translation or modify the translation of an existing language.**\n7. Improved Webpage Commander reliability for Z and ~ command (to bring the background web browser window to foreground)\n\n## What's Changed\n• Fix Alt+Tab lag from synchronous WM_GETTEXT and VirtualDesktop COM probe by @mann1x in https://github.com/kangyu-california/PersistentWindows/pull/455\n• Skip Alt+Tab switcher and Task View overlays in WinEventProc by @mann1x in https://github.com/kangyu-california/PersistentWindows/pull/456\n• Capture minimized windows with their NormalPosition, not the parking rect by @mann1x in https://github.com/kangyu-california/PersistentWindows/pull/457\n• Skip MoveWindow when SetWindowPlacement already positioned the window by @mann1x in https://github.com/kangyu-california/PersistentWindows/pull/458\n• Move WinEvent fast filters outside captureLock so Alt+Tab survives batch restore by @mann1x in https://github.com/kangyu-california/PersistentWindows/pull/459\n• Preserve user-initiated captures in UndoCapture on session lock by @mann1x in https://github.com/kangyu-california/PersistentWindows/pull/460\n• Load UI strings from an editable translations file (extensible multi-language support) by @xuanmossdx in https://github.com/kangyu-california/PersistentWindows/pull/478\n\n## New Contributors\n• @xuanmossdx made their first contribution in https://github.com/kangyu-california/PersistentWindows/pull/478\n\n**Full Changelog**：https://github.com/kangyu-california/PersistentWindows/compare/5.76...5.77"
