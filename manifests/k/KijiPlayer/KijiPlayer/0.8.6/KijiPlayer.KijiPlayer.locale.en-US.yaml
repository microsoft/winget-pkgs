ShortDescription: Free, open-source music player for your local music and YouTube Music. No ads, no payments, no tracking.
Description: |-
  Kiji plays the music on your device and from YouTube Music, anonymously. Everything that is yours (the queue, playlists, history and downloads) stays on your device. Signing in is always optional.
  Three styles with your own color, font and background, an equalizer with presets, synced lyrics with word-by-word karaoke, a Library with artists, albums and folders, downloads to listen offline, playlist import and full backups. In English and Spanish.
  Kiji is built with the help of AI, and every change is reviewed and approved by a person.
