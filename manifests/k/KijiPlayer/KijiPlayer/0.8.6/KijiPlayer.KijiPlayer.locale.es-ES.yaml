PackageIdentifier: KijiPlayer.KijiPlayer
PackageVersion: 0.8.6
PackageLocale: es-ES
Publisher: Kiji Player
PackageName: Kiji Player
License: GPL-3.0-only
ShortDescription: Reproductor de música libre y de código abierto para tu música local y YouTube Music. Sin anuncios, sin pagos y sin rastreo.
Description: |-
  Kiji reproduce la música de tu equipo y de YouTube Music, de forma anónima. Todo lo tuyo (la cola, las listas, el historial y las descargas) queda en tu equipo. Iniciar sesión es siempre opcional.
  Tres estilos con tu color, tu fuente y tu fondo, ecualizador con presets, letras sincronizadas con karaoke palabra por palabra, Biblioteca con artistas, álbumes y carpetas, descargas para escuchar sin conexión, importar listas y copias de seguridad completas. En español e inglés.
  Kiji se programa con ayuda de inteligencia artificial, y cada cambio lo revisa y aprueba una persona.
ReleaseNotes: |-
  - Arreglado: en algunos teléfonos la notificación de música salía sin botones.
  - Arreglado: en Android 10 la música del teléfono no se reproducía.
