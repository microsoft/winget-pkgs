Description: "Cypher CV reads your CV the way applicant tracking systems do and scores it out of 10, with every point explained. It fixes what it can from your own words, asks you for the numbers and facts only you know, tailors the CV to a job without inventing skills, and exports Word and PDF files that keep your formatting. Everything runs on your computer: no account, no API key, no upload."
