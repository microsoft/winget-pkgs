ShortDescription: "Offline music and video player with a link downloader and an on-device vocal and instrument separator."
Description: "Cypher Music is a full offline media library — songs, albums, artists, playlists and videos, all scanned from the machine it runs on. On top of the player it carries two things most players do not: a downloader that pulls audio or video from hundreds of sites, and a vocal and instrument separator that pulls a finished track apart into its vocal and instrumental stems. Both of them run on your own computer or phone, with nothing uploaded anywhere."
