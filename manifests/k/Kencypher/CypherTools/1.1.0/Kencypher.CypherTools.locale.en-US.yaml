Description: "Cypher Tools is one toolbox for the file jobs that usually send you to a website: MP4 to MP3, Word to PDF, PDF to Excel, signing a PDF, shrinking photos, ZIP to RAR. Drop a file and it shows the tools that fit. All 68 tools run on your own device, with no account and no upload, and the result lands next to the original without touching it. On a PC it drives real engines: a bundled ffmpeg, Microsoft Office or LibreOffice, and WinRAR."
