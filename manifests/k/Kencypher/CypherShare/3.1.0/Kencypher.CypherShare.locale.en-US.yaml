ShortDescription: "Sends files and whole folders between your computers and your phone, at the full speed of your own network."
Description: "Cypher Share moves files and entire folder trees between Windows and Linux computers and Android phones on the same local network. Start it on two devices and they find each other by themselves: there is no account, no pairing code and no server in the middle. Pick what to send, tap the device, and the receiver decides what comes in. The data travels device to device over parallel connections and never leaves your network."
