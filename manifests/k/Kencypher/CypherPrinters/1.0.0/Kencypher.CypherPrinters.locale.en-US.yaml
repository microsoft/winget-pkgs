ShortDescription: "Finds your printers, checks each driver is right for the exact model, and installs a verified one."
Description: "Cypher Printers finds the printers connected over USB, Ethernet and Wi-Fi, works out the exact model, checks whether the installed driver is right for that model and your system, and installs a verified driver when one is missing. It never installs a driver just because the brand matches, and it goes online only to fetch a driver: through your package manager on Linux, or from Windows Update, the Microsoft Update Catalog and the manufacturer's own site on Windows."
