PackageIdentifier: kiri603.KiriReadest
PackageVersion: 0.9.106
PackageLocale: en-US
ShortDescription: An open-source ebook reader designed for foreign-language reading and learning.
Description: |-
  KiriReadest is an open-source ebook reader designed for foreign-language reading and learning, featuring AI-powered contextual definitions, cross-book vocabulary notes, and reading progress sync via WebDAV.

  AI contextual definitions: send the target word together with its sentence and surrounding context to an OpenAI-compatible model, so the explanation matches the meaning used in the original text instead of listing every dictionary sense.
  Cross-book vocabulary notes: saved words become shared entries that are marked and explained automatically in the books you open later.
  Multi-format reading: open EPUB, AZW3, MOBI, FB2, CBZ and PDF books with a bookshelf, annotations and highlight notes.
  Japanese-friendly reading: ruby annotations are excluded when selecting words, and the page-turn direction and the body text layout are configured separately.
  WebDAV progress sync: reading positions are merged by actual reading time so a new device continues where you stopped instead of overwriting progress with an older location.
