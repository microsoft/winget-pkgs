ReleaseNotes: |-
  新功能和修复
  - 书库可递归扫描所选文件夹及子文件夹，导入前支持全选和反选。
  - 翻译保存的单词笔记会显示在笔记本中。笔记本已打开时也会即时更新。
  - 改善 WebDAV 跨设备续读。退出阅读器时会先保存本地进度，再尝试同步该书的阅读位置。
  - 优化竖排阅读的翻页方向设置。
