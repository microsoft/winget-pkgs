Description: |-
  KiriReadest 是一款面向外语阅读与学习的开源电子书阅读器，支持 AI 语境释义、跨书单词笔记与 WebDAV 阅读进度同步。在继承多格式阅读、书库和批注能力的基础上，重点强化了语境查词与生词积累。

  AI 语境释义：把目标词、所在句子与上下文一起交给兼容 OpenAI 接口的模型，解释当前语境中的含义，而不是罗列词典义项。
  跨书单词笔记：翻译保存的单词会进入笔记本，在其他书中自动标记并显示同一释义，笔记本打开时也会即时更新。
  多格式阅读：支持 EPUB、AZW3、MOBI、FB2、CBZ 与 PDF，提供书库、目录、批注与划线笔记。
  更适合日语阅读：查词时排除 ruby 注音，翻页方向与正文排版分别设置。
  WebDAV 进度同步：按实际阅读时间合并阅读位置，退出阅读器时先保存本地进度再同步，避免被旧位置覆盖。
