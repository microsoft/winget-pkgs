ShortDescription: Local-first forensic log viewer for DFIR work
Description: A lean, local-first forensic log viewer for DFIR work. Parses log sources (AUL/.logarchive, EVTX, journald, and TOML-configurable text logs) into a normalized, taggable DuckDB timeline with a Splunk-inspired search syntax and a SQLite session layer for analyst tags. Rust + egui, no server, no cloud. Can run standalone or be handed evidence paths by crush.
