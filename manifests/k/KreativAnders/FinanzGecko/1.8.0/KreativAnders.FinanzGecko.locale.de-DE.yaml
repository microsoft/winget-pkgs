ShortDescription: Vermögenstracker — lokal, verschlüsselt, ohne Cloud und ohne Bank-Login.
Description: |-
  FinanzGecko zeigt dein Gesamtvermögen — nicht jede einzelne Buchung, sondern die Linie darunter.

  Einmal im Monat trägst du deine Kontostände ein, alle auf einer Seite. Den Rest erledigt die App:
  Verlauf, Verteilung, Kennzahlen und eine trendbasierte Prognose.

  FinanzGecko liest keine Konten aus — kein Online-Banking-Zugang, kein PSD2, keine Registrierung.
  Die Daten liegen AES-256-verschlüsselt auf deinem Rechner, der Schlüssel im Anmeldeinformations-
  speicher des Systems. Von sich aus geht die App nicht ins Netz.

  Kein Haushaltsbuch: einzelne Ausgaben und Kategorien erfasst FinanzGecko bewusst nicht.
