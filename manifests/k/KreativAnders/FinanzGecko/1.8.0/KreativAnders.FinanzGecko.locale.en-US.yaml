ShortDescription: Net-worth tracker — local, encrypted, no cloud and no bank login.
Description: |-
  FinanzGecko tracks your total net worth — not every transaction, but the line underneath them.

  Once a month you enter your account balances, all on one page. The app does the rest: history,
  breakdown by account type, key figures and a trend-based projection.

  FinanzGecko never reads your bank accounts — no online banking access, no PSD2, no sign-up. Data
  is stored AES-256 encrypted on your own machine, with the key in the operating system's
  credential store. The app makes no network connection on its own.

  Note: the user interface is German only.
