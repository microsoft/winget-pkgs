ShortDescription: Offline cost and limit monitor for Claude Code sessions
Description: |-
  Kanjo reads the Claude Code transcripts and status line readings on the computer it runs on. It prices each request at API list prices, breaks the cost down by project, model, subagent, skill, MCP server and tool, and forecasts from the recent pace when the 5-hour and weekly usage limits run out.
  It is a single executable that contains the collector, a local HTTP API and a web dashboard. It makes no outbound network connections and does not store prompt or response text. A model missing from its price table is reported as unpriced.
