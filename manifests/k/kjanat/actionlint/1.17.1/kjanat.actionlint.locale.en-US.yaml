ShortDescription: Static checker for GitHub Actions workflow files
Description: "actionlint is a static checker for GitHub Actions workflow files. It checks the workflow syntax, expression placeholders, the shell scripts in run: steps, and many other mistakes that only surface once a workflow runs. This is the kjanat fork, published separately from rhysd.actionlint."
