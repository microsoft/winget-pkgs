ShortDescription: A GPU-accelerated terminal for Windows that keeps your sessions alive.
Description: 'Nebula is a terminal emulator for Windows, built in Rust on a GPU-accelerated rendering core and designed around one idea: your terminal sessions are too valuable to die with a window. It pairs a tmux-style resident session model with a glass UI, an AI-CLI-aware sidebar, and a shell experience that works without extra setup.'
