PackageIdentifier: Kuddev.Pebrel
PackageVersion: 2.5.7
PackageLocale: zh-CN
ShortDescription: 一款 GPU 加速的 Windows 终端：关闭窗口不杀会话，重新打开，你的 claude 对话原样回来。
Description: Nebula 是一款 Windows 上的终端模拟器，以 Rust 编写，构建在 GPU 加速渲染内核之上，并围绕一个理念设计：终端会话太宝贵，不该随窗口一起消失。它把 tmux 式的常驻会话模型、玻璃质感界面、AI CLI 感知侧边栏和无需额外配置的 shell 体验组合在一起。
Tags:
- claude
- codex
- ssh
- 终端
ReleaseNotes: |-
  macOS、Linux 和 Android 下载为预览版。
  改进
  - 改进标签识别：标题前默认显示 Shell 或标签类型图标，占位宽度固定，运行状态仍在右侧。对应 #871。
  修复
  - 修复块级公式部分滚出屏幕后退回源码的问题。终端仍保留公式源行时，会继续显示可见部分。对应 #909。
  - 修复 LaTeX 下括号过短的问题，使它覆盖上方表达式。
  - 修复带标注的 LaTeX 箭头过短的问题，使箭杆按标注宽度伸展。
  - 修复行内公式刚好在终端行末闭合时，被下一行文字误判而不渲染的问题。对应 #772。
  - 修复切到空命令输出流时视图消失的问题。仍可切回其他输出流，复制空流不会覆盖剪贴板。对应 #900。
  - 修复退出分屏放大时，方向快捷键跳过相邻窗格的问题。
  - 修复 Linux 上共享 Codex 后台将对话关联到错误窗格的问题。对应 #633。
  - 修复 Windows 便携版误下无法使用的安装程序的问题。更新弹窗会提供对应架构的 ZIP。对应 #533。
  - 修复 Android SSH 重连时，原工作区停止后另起工作区的问题。仍在运行的工作区可重连到原 Shell。对应 #794。
  - 修复反色模式下不透明 Sixel 图像的背景颜色错误。
ReleaseNotesUrl: https://github.com/Kuddev/pebrel/releases/tag/v2.5.7
