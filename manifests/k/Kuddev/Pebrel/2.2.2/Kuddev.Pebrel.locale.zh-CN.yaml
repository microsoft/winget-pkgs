PackageIdentifier: Kuddev.Pebrel
PackageVersion: 2.2.2
PackageLocale: zh-CN
ShortDescription: 一款 GPU 加速的 Windows 终端：关闭窗口不杀会话，重新打开，你的 claude 对话原样回来。
Description: Nebula 是一款 Windows 上的终端模拟器，以 Rust 编写，构建在 GPU 加速渲染内核之上，并围绕一个理念设计：终端会话太宝贵，不该随窗口一起消失。它把 tmux 式的常驻会话模型、玻璃质感界面、AI CLI 感知侧边栏和无需额外配置的 shell 体验组合在一起。
Tags:
- claude
- codex
- ssh
- 终端
ReleaseNotes: |-
  本版更新 Windows、macOS 和 Linux；Android Preview 保持为已发布的 2.2.1。
  新增
  - 新增：文件树滚动时将当前祖先目录保持在顶部；可点击的面包屑显示末尾三级路径，更早的祖先目录通过列表菜单访问。
  - 新增：Git 历史在可用时显示作者头像，图片暂不可用或加载失败时显示姓名首字母。
  改进
  - 改进：内置体积较小的 Geist 可变字体用于英文界面；中文使用本机字体回退，不增加内置中文字库。终端字体偏好保持独立，路径等辅助信息继续使用等宽字体。
  - 改进：文件过滤框采用更柔和的颜色和清晰的“过滤文件……”占位提示，大小写、全词及正则选项的默认颜色更克制；路径和终端操作按钮在悬停时通过更明显的文字或图标颜色反馈，背景保持透明。
  - 改进：设置、SSH、Shell 与 Quick Jump 筛选、Git 视图、主题预览及导入导出的紧邻选项共用平滑滑动指示器；浮块跟随真实选项尺寸，快速反向时从当前位置继续，并遵循减少动态效果设置。
  - 改进：Shell 和 SSH 选择器调矮搜索栏，并增加筛选选项上方的留白。
  - 改进：命令管理器中的复制、编辑、删除操作在整行悬停或键盘聚焦时显示；移除三个点按钮，命令分组移动继续通过行右键菜单访问。
  - 改进：Git 增删行数达到 1,000 时使用保留一位小数的 k 单位，并保留正负号及原有颜色。
  - 改进：统一 Tab 标题、文件名及设置标签的字重和间距；Tab 文字继续读取原有界面字号偏好，无图标行不保留空白图标槽，Shell 类型使用纯文字标签。
  - 改进：完整回答阅读器的控件、提示、图片选择和图片错误跟随界面语言；切换语言保留回答原文及作者提供的图片说明，“复制原文”保留完整原始内容。 (#545)
  修复
  - 修复：Git 历史线路在相邻行之间连续连接，并采用更平滑的分支曲线。
  - 修复：Git 忽略的文件和文件夹名称保留斜体，普通界面标签避免出现意外加粗的中文。
  - 修复：较小界面字号下，Tab 的自定义色条与图标保持间距。
  - 修复：Windows 新建标签或分屏时会重建丢失的临时欢迎脚本，写入失败后可重试，避免持续使用失效的缓存路径。对应 #622。
  - 修复：macOS 的默认 GPUI 快捷键将 Control+K 等纯 Control 字符组合交给终端，使用 Command 快捷键执行对应界面操作；显式用户绑定及导航组合保留原有行为。对应 #656。 (#658)
  - 修复：带有尾随行数说明的本地文件链接可回退到实际存在的基础文件，也兼容终端截断后的说明；真实带括号的文件名仍优先匹配，本次不增加行号导航。对应 #619。 (#663)
