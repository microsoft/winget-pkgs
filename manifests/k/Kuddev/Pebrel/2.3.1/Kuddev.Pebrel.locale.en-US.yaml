ReleaseNotes: |-
  This maintenance release restores comfortable terminal text spacing while keeping supported character-art logos in proportion. It also makes the default interface font explicit and updates the approved sponsor presentation.
  Packages include Windows x64/ARM64 installers and portable ZIPs, macOS Apple Silicon/Intel builds, Linux x64 packages, an Android universal APK and the offline relay package. macOS, Linux and Android retain their Preview distribution labels.
  Fixed
  - Fix overly tight terminal text and list spacing by restoring the font height, baseline and default row padding from 2.2.2. Custom terminal fonts and explicit line-height settings remain available. (#783)
  - Fix stretched supported character-art logos, including the dense Braille/block and repeated-slash patterns used by Codex and Fastfetch, without compressing surrounding text or changing the terminal grid. Keep partially scrolled artwork complete and align selection, search highlights and link hit testing with its displayed position. (#787)
  - Fix the interface-font input to display the actual default, Geist, including after clearing a custom value. Interface and terminal font preferences remain independent. (#783)
  Improved
  - Improve the Sponsors page and both READMEs with the approved AIAPI logo, bilingual introduction and visit action. Existing provider settings and credentials are unchanged. (#789)
  - Improve the README badge layout with the official Trendshift badge and the XERJ contributor badge, removing redundant technology badges. (#782)
  - Improve Linux CI dependency downloads by using Ubuntu's official archive while retaining package signature checks and the existing native test matrix. (#787)
