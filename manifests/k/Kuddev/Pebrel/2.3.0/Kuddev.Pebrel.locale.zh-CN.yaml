PackageIdentifier: Kuddev.Pebrel
PackageVersion: 2.3.0
PackageLocale: zh-CN
ShortDescription: 一款 GPU 加速的 Windows 终端：关闭窗口不杀会话，重新打开，你的 claude 对话原样回来。
Description: Nebula 是一款 Windows 上的终端模拟器，以 Rust 编写，构建在 GPU 加速渲染内核之上，并围绕一个理念设计：终端会话太宝贵，不该随窗口一起消失。它把 tmux 式的常驻会话模型、玻璃质感界面、AI CLI 感知侧边栏和无需额外配置的 shell 体验组合在一起。
Tags:
- claude
- codex
- ssh
- 终端
ReleaseNotes: |-
  2.3.0 重点改进终端响应、SSH 稳定性、AI Agent 协作、原生内容阅读与 Android 使用体验。以下逐项整理从 2.2.2 到 2.3.0 的更新。
  本版提供 Windows x64/ARM64 安装包、macOS Apple Silicon/Intel 构建、Linux x64 软件包、Android 通用 APK 和离线中转包。所有包均为 2.3.0，macOS、Linux 与 Android 延续 Preview 分发标记。
  如果 2.2.2 提示更新准备失败，请保存工作，从托盘完整退出 Pebrel 后手动运行 Windows 安装包。已安装的 2.2.2 会先执行自身的进程检查，新安装包在此之前尚未运行。
  新增
  - 新增串口终端支持，可通过主机编辑器保存 serial:COM3,115200,8N1 等地址；保存、置顶、恢复和复制会话均保留串口参数，关闭窗格会中断待处理的读写。 (#630)
  - 新增 OSC 7501 revision 0.4 程序状态支持，可上报空闲、运行、完成、阻塞、错误、交互请求及进度；有效程序状态优先于 hook 和屏幕推断，连接故障仍优先显示。 (#691)
  - 新增 macOS 视频背景支持，可在终端后方静音循环播放；窗口隐藏、最小化、完全被遮挡或启用减少动态效果时暂停。 (#562)
  修复
  - 修复 Windows 更新准备被自身后台会话检测进程阻挡的问题，检查其他运行实例前先停止该进程，取消准备后恢复检测；其他应用实例仍需完整退出。 (#775)
  - 修复 Windows 可执行文件的版本信息残留问题，文件版本和产品版本统一为 2.3.0，与安装器及应用版本一致。 (8adcacfa)
  - 修复本地 Shell 启动失败或 WSL 发行版不可用时诊断信息丢失的问题，保留窗格、错误输出和重新选择 Shell 的恢复入口，避免最后一个窗口随即关闭。 (#742)
  - 修复“登录时静默启动”影响手动打开应用的问题，手动启动 Pebrel 时正常显示首个窗口。 (#583)
  - 修复 Monaco 的 fi/fl 连字产生空白字符格的问题，同时保留正常编程连字的连接效果。 (#638)
  - 修复普通 Shell 目录列表被误识别为多行公式的问题。 (#701)
  - 修复调整窗口大小后，旧鼠标悬停位置落在终端网格外时，表格链接检测可能导致崩溃的问题。 (#682)
  - 修复多个本地草稿并发保存到同一文件时互相覆盖的问题，发生竞争时提示文件忙，并保留未保存草稿。 (#585)
  - 修复 SFTP 源文件提前结束时仍可能将不完整下载当作成功的问题，检测到长度异常后明确报告失败。 (#732)
  - 修复默认 PowerShell 提示符在完整输出后多出空行的问题；没有末尾换行的输出仍保留必要间隔，自定义提示符继续遵循自身布局。 (#705)
  - 修复 TLS 证书信任风险，更新验证逻辑与内置根证书，拒绝经过已撤销信任的 emSign 中间密钥的证书链。 (#717)
  改进
  响应与资源占用
  - 优化连续输出时的重绘，在 8 毫秒窗口内合并刷新，减少大量终端输出产生的重复绘制。 (#675)
  - 优化空闲光标行为，静默 8 秒后保持可见常亮，恢复活动后继续闪烁，减少待机时的持续刷新。 (#675)
  - 改进 Agent 检测响应，将进程枚举移到界面线程之外，并缓存有界检测结果；过期的进程结果不会清除新到达的 hook 状态。 (#675)
  - 优化活动指示器绘制，复用未变化的终端内容；隐藏的状态图标停止请求动画帧。 (#694)
  - 改进手机镜像和 Runtime 命令响应，事件到达后立即唤醒界面处理。 (#760)
  - 优化 Runtime 读屏与 JSON 响应，将每条完整响应集中发送，减少反复小块写入连接的开销。 (#759)
  - 改进桌面终端应用的滚轮响应，合并同一次滚动手势的传输通知，并保留方向和滚动距离。 (#719)
  SSH 与文件传输
  - 完善内置 SSH 剪贴板图片上传，复用原窗格已认证的连接；及时报告 SFTP 拒绝，取消协商仅关闭所属通道。上传需要服务器支持 SFTP。 (#768)
  - 完善 SSH 文件输入，拖入本地文件或目录、粘贴系统复制的文件条目时，先上传再向原窗格插入带引号的远端路径；支持进度与取消，仅成功后插入路径。 (#748)
  - 完善上传目标处理，每批文件使用独立远端目录，保留已有同名文件并支持空目录；插入路径不会自动执行，也不会广播到其他窗格。 (#748)
  - 完善 SSH 断线反馈，保留已有终端输出，以终端文字显示故障原因；断线后可按 R 重连、按 Enter 关闭当前窗格。 (#730, #747)
  - 完善桌面 SSH 会话恢复，重连时回到原远端会话、窗口和窗格，保留所选可执行文件与命名 socket；原目标失效时回到登录 Shell，不创建替代会话。 (#761)
  - 改进 SSH 网络间歇下的画面稳定性，同步重绘未完成时保留上一完整画面，并合并已就绪输出，减少大段重绘中的画面跳动。 (#725)
  - 改进 SSH 大段输入处理，等待远端接收能力时仍持续读取输出，避免长文本粘贴过程中连接停滞。 (#728)
  - 优化桌面 SFTP 文件传输，批量处理本地磁盘读写，同时保留逐块取消能力。 (#732)
  - 完善 WSL 内的 SSH 目标补全，读取对应发行版、用户及配置中的 Host 别名与嵌套 Include，支持含空格和中文的配置路径。 (#707)
  AI Agent 与 hook
  - 完善 Agent hook 支持，增加 Qoder、CodeBuddy、Qwen Code、Droid 和 Antigravity 的可选本地集成，默认关闭，沿用统一活动状态与通知规则；这批集成仅支持本地安装。 (#518)
  - 完善 Hermes 接入，在 Agent 设置中展示 CLI 发现与进程检测状态，并提供交互启动入口；Hermes 生命周期 hook 尚不可用。 (#734)
  - 完善 Agent 状态恢复，在远端 hook 事件丢失时重新核对停滞任务，避免仅凭类似提示符的输出误判任务完成。 (#674)
  - 改进“等待输入”状态恢复，屏幕中的输入表单消失且连续快照不再匹配后，清除过期提示，避免运行中的任务一直显示为阻塞。 (#765)
  - 完善受支持 Claude 客户端的权限与失败通知，交互 hook 脱离控制终端时，可通过客户端的 terminal-sequence 回退机制交付事件。 (#764)
  - 改进 Windows Codex 会话检测，复用后台辅助进程，避免反复出现程序启动指针，同时继续刷新当前会话身份。 (#729)
  终端阅读与图片
  - 完善终端内 Markdown 阅读，支持的命令（包括普通 cat file.md）完成后可显示原生结果；文本可跨行选择、复制，并保留代码块与表格。 (#704, #705, #770)
  - 完善 JSON 阅读，支持选择文本、点击折叠和展开对象或数组、筛选内容，并为短数组和已折叠节点提供紧凑预览。 (#705, #770)
  - 完善 Git 差异阅读，显示文件头、增删计数、双列新旧行号并支持逐文件折叠；保留文本选择、横向滚动和完整 patch 复制，不支持的格式回退到原文。 (#706)
  - 完善长目录列表阅读，超过 20 行时折叠中间内容，前后各保留十行；展开后继续保留原始颜色、链接和文本选择。 (#705)
  - 完善 pebrel view 显式查看与管道使用，Windows 提供 pebrel.com 控制台入口，正确保留管道、等待和退出码行为；重定向时输出普通文本。 (#705)
  - 改进内容滚动与选择对齐，原生结果、图片、公式及后续提示符使用一致的纵向布局，链接与搜索高亮跟随实际显示内容。 (#705, #750)
  - 完善公式阅读，将每条横向滚动条保持在对应公式内，避免与相邻内容错位。 (#770)
  - 完善 OSC 1337 内联图片显示，在滚动、覆盖、擦除及屏幕切换时保持正确位置和顺序，已清除图片不会因延迟解码重新出现。 (#749, #316)
  - 改进 macOS 图片预览，依据解码后的实际尺寸处理指针缩放与拖拽。 (#585)
  字体与外观
  - 改进终端字符图形比例，在非整数显示缩放下保持所选字号；盲文图形使用连续点阵，并继续遵循显式行高与间距设置。 (#752, #770)
  - 完善字体自定义，在外观设置中提供独立的界面字体选择。 (#770)
  - 优化图标字体加载，使用独立打包的符号字体；选择其他文字字体时，无需仅为图标加载完整 Maple 字体，仍可按需选择 Maple。 (#770)
  - 改进背景透明度表现，终端与设置页一致应用不透明度，文字及对话框保持不透明。 (#698)
  - 完善标签栏外观配置，可在配置文件中使用 tab_bar_opacity 和 tab_bar_blur，单独设置侧栏及顶部标签的透明度与模糊效果；默认继承窗口外观。 (#751)
  - 改进侧栏图标反馈，悬停或选中时恢复原色，SSH 图标统一采用圆角终端轮廓；内置图标经无损压缩。 (#731, #726, #733)
  - 改进分段控件动画，快速反向切换时从当前显示位置继续过渡，并遵循减少动态效果设置。 (#684)
  工作区与交互
  - 完善分屏整理，可拖动标题栏拖拽柄交换窗格位置，保留会话、焦点、历史及布局比例；按 Escape 或切换标签可取消拖动。 (#458)
  - 完善标签跨窗口移动，即使在单屏最大化窗口中，也可按住 Alt 拖动标签拆成新窗口；拖入另一 Pebrel 窗口时显示停靠预览并合入目标窗口。 (#575)
  - 完善分屏布局提示，在侧栏、顶部标签及折叠侧栏标题中显示实际布局的轮廓缩略图；点击侧栏或顶部标签的缩略图可循环切换窗格焦点。 (#746)
  - 改进顶部标签滚动，支持横向与纵向滚轮，键盘切换时自动将所选标签滚动到可见位置。 (#694)
  - 完善窗口恢复，完整退出后保留普通窗口尺寸，在 Windows 上恢复到仍连接的显示器；显式网格和位置设置优先。 (#460)
  - 完善侧栏宽度调整，在窗口外释放鼠标也能结束调整或关闭操作；Escape 和窗口失去活动状态仍可取消拖动。 (#762)
  - 改进工具栏操作反馈，可用按钮显示手型指针；完善通知关闭操作，点击整张通知卡片即可关闭。 (#502)
  - 改进 macOS 标题栏间距，让右侧工具控件与窗口边缘保持留白。 (#502)
  输入、补全与历史
  - 完善本地 Windows PowerShell 多行粘贴，在受支持的 PSReadLine 提示符中交给当前编辑器处理；按 Enter 前保持可编辑，支持整体撤销，并保留用户按键绑定。 (#738)
  - 完善关闭“选中自动复制”后的右键操作：有选区时复制并清除选区，无选区时粘贴；Ctrl+右键打开菜单。 (#703)
  - 完善混合模式 Tab 补全，原生 Shell 显示预测文字时仍可打开历史列表。 (#444)
  - 改进桌面与 Android 命令建议，优先按使用频率、再按最近使用时间排序；桌面各建议入口保持一致，PowerShell 同一次提交不会重复计数。 (#754)
  - 完善历史管理，提供需要确认的“清空历史”，清理 Pebrel 的本地、WSL 和 SSH 命令记录并使应用各窗口的旧建议失效；保留保存命令与 Shell 自身历史，部分清理失败会明确报告。 (#736)
  - 改进 WSL 启动目录选择，让会话进入正确的来宾目录。 (#735)
  Android Preview
  - 完善移动端终端按键自定义，支持编辑组合键，并在应用重启后保留排列顺序。 (#713)
  - 完善移动端显示偏好恢复，重新进入窗格时保留终端缩放与自动换行设置，并让恢复后的缩放与实际画面保持一致。 (#713, #700)
  - 完善移动端多会话操作，可通过顶部切换器打开独立的本地或 SSH 标签，已有会话继续在后台运行。 (#715)
  - 完善移动端 SSH 故障恢复，应用运行期间重试暂时性故障，回到前台时探测停滞连接；重连保留当前标签与输入草稿。 (#715)
  - 完善移动端远端会话恢复，保留原会话、窗口、窗格、可执行文件和命名 socket；原目标失效时进入登录 Shell，不替换成其他同名会话。 (#757)
  - 改进移动端滚动，直接使用当前终端连接，合并相邻手势并保留滚动距离；浏览远端历史时保留实时输入位置，聚焦输入后返回实时窗格。 (#719, #715)
  - 改进移动端键盘及标签布局变化时的画面稳定性，保留上一完整同步画面，尺寸稳定后再提交最终终端大小，减少反复全屏重绘。 (#723)
  - 完善移动端附件上传，复用已认证的 SFTP，避免再次询问密码，并将上传操作绑定到发起它的终端。 (#711)
  - 优化移动端 SFTP 上传与下载，使用并发请求；传输中断后保留可见进度，等待连接恢复并从已确认进度继续，支持取消。 (#720)
  - 改进移动端字符图形比例与盲文连续点阵，完善紧凑行高下的文字绘制，避免重音符号和下伸笔画被裁切或覆盖。 (#756)
  网络、更新与自动化
  - 完善更新联网行为，自定义网络代理同时覆盖更新检查与下载安装包。 (#579)
  - 完善代理编辑，保留尚未输入完整的协议草稿，原样保存 socks5h://；将绕过列表以 no_proxy 传入新本地 Shell 和受支持的 WSL 环境，空列表会清除无关的继承值。 (#384)
  - 完善 Windows 管理员窗口更新，可安排安装器执行并按原权限级别恢复工作区；同时修复进程退出期间对空路径发起查询的问题。 (#699)
  - 完善 Runtime 分屏、缩放与窗格比例命令，在回复前提交可见终端布局，让紧接着到达的输入使用新的 PTY 尺寸。 (#769)
  - 完善 Runtime 客户端恢复，重启后重新发现常驻端点。 (#721)
  语言、设置与项目文档
  - 完善英文界面，覆盖工作区对话框、保存命令反馈、版本控制操作、会话恢复与导出及通知；切换语言时保留命令搜索内容和选区。 (#544)
  - 完善日语翻译，覆盖外观、应用图标、字体、快捷键与关于页面，并补齐滚动条可见性和裸键确认文案。 (#639)
  - 完善设置导航，在侧栏和搜索中隐藏 API 服务商入口，保留已有配置、Agent 设置及通知控制。 (#745)
  - 完善中英文项目 README，加入链接到项目镜像的 AtomGit Stars 徽章。 (#776, #777)
