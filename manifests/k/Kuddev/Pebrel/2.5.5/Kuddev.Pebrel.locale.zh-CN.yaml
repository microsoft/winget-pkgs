ReleaseNotes: |-
  macOS、Linux 和 Android 下载为预览版。
  修复
  - 修复 zsh 中按左右方向键或 Option+左右方向键后，鼠标点击无法定位光标的问题。对应 #963。
  - 修复 Markdown 和终端公式遇到不支持的 Unicode 控制符号时的崩溃，保留公式原文。对应 #911。
  改进
  - 改进 Linux 和 macOS 的 Agent 状态更新速度，连接到达时立即唤醒监听线程。
