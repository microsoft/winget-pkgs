PackageIdentifier: Kuddev.Nebula
PackageVersion: 1.3.1
PackageLocale: zh-CN
ShortDescription: 一款 GPU 加速的 Windows 终端：关闭窗口不杀会话，重新打开，你的 claude 对话原样回来。
Description: Nebula 是一款 Windows 上的终端模拟器，以 Rust 编写，构建在 GPU 加速渲染内核之上，并围绕一个理念设计：终端会话太宝贵，不该随窗口一起消失。它把 tmux 式的常驻会话模型、玻璃质感界面、AI CLI 感知侧边栏和无需额外配置的 shell 体验组合在一起。
Tags:
- claude
- codex
- ssh
- 终端
ReleaseNotes: |-
  新增
  - 新增经过校验的应用内 Windows 更新 — Nebula 可在后台下载名称精确匹配的官方 Windows x64 安装包，显示进度，校验大小、PE 文件头与 SHA-256，并在明确确认后才启动安装。
  修复
  - 修复自动更新版本检测；现在会读取真实的 GitHub 最新 Release，与当前运行版本比较后才显示提醒，同时继续遵守跳过版本与三天后提醒设置。
  - 修复更新通知在用户操作前消失；提醒会持续显示在右下角，下载完成或失败后，原通知会被带有下一步操作的新状态替换。
  - 修复更新与确认弹窗的几何位置和字体大小，使其与既有宽度、垂直位置及排版对齐，同时让遮罩点击、Esc 与取消按钮一致执行取消逻辑。
  - 修复终端不透明度拉到 100% 后，在旧版模糊设置规范化并重载时又回到 82%。
  - 修复按键映射页在快捷键列表上方留下大块空白。
  - 修复字体组弹层与下拉框分离；鼠标悬停在被截断的字体名称上时，现在会显示完整名称。
  - 修复侧边栏拖拽光标和宽度计算未对准可见分隔线；鼠标现在可直接在基线上开始拖动，无需偏向左侧。
  - 修复 Windows 用户主目录下的 PowerShell 当前目录上报。提示符仍可显示 ~，但文件与 Git 集成会收到绝对路径，并正确识别主目录下的仓库。
  改进
  - 改进更新流程，提供下载进度、重试、已校验、安装和失败状态，并在启动安装包前执行二次校验。
  - 改进工作区、分栏、标签、文件树与设置确认框的一致性，同时保留新组件点击外部区域取消的特性。
