PackageIdentifier: Kuddev.Nebula
PackageVersion: 0.9.0
PackageLocale: zh-CN
ShortDescription: 一款 GPU 加速的 Windows 终端：关闭窗口不杀会话，重新打开，你的 claude 对话原样回来。
Description: Nebula 是一款 Windows 上的终端模拟器，以 Rust 编写，构建在 GPU 加速渲染内核之上，并围绕一个理念设计：终端会话太宝贵，不该随窗口一起消失。它把 tmux 式的常驻会话模型、玻璃质感界面、AI CLI 感知侧边栏和无需额外配置的 shell 体验组合在一起。
Tags:
- claude
- codex
- ssh
- 终端
ReleaseNotes: |-
  新增
  - 新增窗口背景模糊（设置 → 外观），不透明度滑杆现在控制模糊之上的着色浓度。
  - 命令面板新增分组，每组上方有分节标题。
  - 命令面板新增「工作目录」分组，标题中显示当前聚焦终端所在路径。
  - 新增「复制路径」和「在文件管理器中显示」命令。
  - 新增「显示标签侧栏」和「拖动调整面板大小」命令，开启后带勾选标记。
  - 新增 SSH 连接页，展示解析、TCP、认证、打开会话四个阶段。
  - 新增侧栏和文件/ Git 抽屉的拖动调整大小（设置 → 交互，默认关闭）。面板拖到窗口边缘即关闭，宽度会被记住。
  - 新增侧栏 SSH 主机分节的拖拽分隔条。
  - 新增「启动时恢复上次标签页」开关（设置 → 高级 → 会话）。
  - 空闲标签右侧新增 shell 标签：pwsh、cmd、bash、WSL 发行版名或 ssh。
  - 侧栏「标签页」和「SSH 主机」标题新增数量角标，折叠箭头移到标题前。分节折叠时数量仍然可见。
  - 新增已注册 WSL 发行版到「浏览文件夹」对话框顶部。（#12）
  - 新增统一输入框组件，所有输入框的光标、选区、点击定位和快捷键行为一致。
  修复
  - 修复崩溃与正常退出分不清的问题，恢复后会说明上次是异常退出。
  - 修复连续三次启动失败后出问题的会话被覆盖的问题，现在保留为 session.crashed.json。
  - 修复 SSH 主机编辑器的文字和图标发糊。
  - 修复图标选择器透出下层表单文字。
  - 修复「测试连接」失败被压成一行截断，现在显示完整原因。
  - 修复转圈指示器的珠链感，以及活动标签上环的颜色不对。
  - 修复 codex 的「等你回答」徽章不亮。
  改进
  - 改进图标搜索框为正经输入框：点击定位、拖选、Home / End、Ctrl+A/C/V。
  - 改进新建 SSH 主机的默认认证方式为密码，不再是「自动」。
  - 改进侧栏行宽，名字和徽章的空间更足。
  - 改进浮层面板的底色，从窗口底色上提亮，深色主题下层次更清楚。
  - 改进「等你批准」徽章为琥珀色圆点，手掌图标重画好之前先下线。
