PackageIdentifier: Kuddev.Nebula
PackageVersion: 1.7.0
PackageLocale: zh-CN
ShortDescription: 一款 GPU 加速的 Windows 终端：关闭窗口不杀会话，重新打开，你的 claude 对话原样回来。
Description: Nebula 是一款 Windows 上的终端模拟器，以 Rust 编写，构建在 GPU 加速渲染内核之上，并围绕一个理念设计：终端会话太宝贵，不该随窗口一起消失。它把 tmux 式的常驻会话模型、玻璃质感界面、AI CLI 感知侧边栏和无需额外配置的 shell 体验组合在一起。
Tags:
- claude
- codex
- ssh
- 终端
ReleaseNotes: |-
  新增
  - 在“设置 → 终端 → 提醒”中新增“AI 消息弹窗”开关。关闭后收起已有的应用内 AI 卡片并停止显示新的卡片，同时保留系统通知和标签状态提示。对应 #107。
  - 新增本地和 SSH 文本文档编辑，支持保存、文件外部变更检查，并在保存失败时保留未保存的内容。
  - 新增可复用的终端布局，在独立窗口中打开并保留终端启动设置，不重放命令历史。
  - 新增从系统文件管理器向本地和 WSL 终端拖入文件，插入加引号的路径而不执行；SSH 会话所需的本地文件可通过“远程文件”上传。对应 #106。
  - 将内置主题选择器扩展为 15 套配色。新增 Catppuccin Frappé 和 Macchiato，与已有的 Latte、Mocha 补齐四款配色，同时包含 Breeze、Mint 及 Glass 浅色／深色主题。Glass 使用静态配色，不会自动开启背景模糊。
  修复
  - 修复终端圆角框线在部分字符尺寸和显示缩放下，与相邻直线错开一个物理像素的问题。
  - 避免 Grok 在新开的 Windows 本地终端中因错误启用旧控制台模式而隐藏点阵欢迎图案，同时保留用户显式设置的旧控制台覆盖值。
  - 修复 macOS 未配置 Shell 时，“默认 Shell”设置和新建终端菜单推荐 PowerShell 的问题。两处现在与终端后端共用宿主默认 Shell 解析。由 @YinBuLiao 在 #110 中贡献。
  - 修复不同 Shell 图标使设置菜单行高不一致的问题；没有品牌图片的 Shell 在新建终端菜单中也会显示图标。由 @YinBuLiao 在 #111 中贡献。
  - 缩短长通知和多行通知的预览，同时在日志中保留通知原文。普通驻留通知可点击卡片关闭。部分修复由 @YinBuLiao 在 #112 中贡献。
  - 改进浅色终端背景上的文字对比度，同时保留原本可读的配色。对应 #104。
  - 修复 macOS 从 Finder 启动、缺少语言环境变量时，“跟随系统”回退到英文的问题。
  - 修正 Antigravity 状态识别：普通回答不再误报为等待确认，实际的问题选择框和文件审核框能识别为等待输入。对应 #100。由 @821869798 在 #101 中贡献。
  改进
  - 默认关闭背景模糊，并使用 100% 不透明度，让主题按实色显示；保留用户已明确设置的模糊和不透明度。
  - 侧栏和文件区的默认分隔线在高缩放下保持单个物理像素宽度，并沿用主题分隔线颜色，让边界更轻。
  - 改进 Markdown 阅读，限制预览处理量，并共享后台公式渲染；不支持或超限的表达式保留源码。
  - 为代码和公式复制控件加入就地反馈，并将文档专注模式与系统全屏分开。
  - 文件树中被 Git 忽略的文件和目录使用斜体显示，便于区分。
  Windows 提供 Pebrel 安装器和 ZIP 便携包，不再提供旧名兼容安装器；依赖旧文件名的客户端可从 Release 页面下载 Pebrel 安装器完成更新。Linux x64 包以及 macOS Apple Silicon／Intel DMG 继续标记为 Preview。分子结构渲染仍处于禁用状态。
