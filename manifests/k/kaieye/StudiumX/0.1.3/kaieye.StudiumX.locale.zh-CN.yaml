ShortDescription: 本地优先的 AI 学习工作区，整合学习目标、课程讲义、资料资源、任务计划、专注计时与学习记录，借助 AI 提供个性化教学、路径规划与学习反馈。
Description: StudiumX 是一个以学习工作区为中心的桌面应用，将 AI 辅助教学、学习计划、专注任务、资源库和学习分析放入同一个本地工作流；学习目标、课程讲义、可信资源与学习记录保存在你自己的工作区中，而不是被普通聊天记录替代。支持持续的 AI 教学对话、学习计划与专注工作台、资源与课程管理，以及可配置的模型提供商与 MCP 扩展接入。本地优先、显式授权：不默认启用工作区 shell，不默认上传遥测数据；涉及写入、外部写入和特权操作的工具都要经过 effect 分类与审批策略。
