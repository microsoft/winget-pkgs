ShortDescription: A local-first AI learning workspace that brings study goals, course handouts, resources, task plans, focus timers, and learning records into one platform, with AI-powered personalized teaching, path planning, and learning feedback.
Description: 'StudiumX is a desktop application centered on the learning workspace, putting AI-assisted teaching, study plans, focus tasks, a resource library, and learning analytics into one local workflow. Study goals, course handouts, trusted resources, and learning records live in your own workspace instead of being replaced by ordinary chat history. It offers ongoing AI teaching conversations, a study planner and focus workbench, resource and course management, and configurable model providers with MCP extension support. Local-first with explicit authorization: workspace shell access is not enabled by default, no telemetry is uploaded by default, and tools that write, write externally, or require privileged operations all go through effect classification and approval policies.'
