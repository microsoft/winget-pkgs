ShortDescription: "Your Claude Code and Codex limits, always in view on Windows. Reads local usage logs, never your login."
Description: "Ringside is a small always-on-top meter for Windows. It shows how much of your Claude and Codex usage limits you have used and when each one resets, so a limit never catches you in the middle of a task. It never reads your login. Ringside only reads the usage numbers your apps already save on your PC, and it never sends your usage anywhere."
