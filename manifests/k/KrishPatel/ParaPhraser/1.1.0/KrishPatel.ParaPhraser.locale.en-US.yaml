ShortDescription: Fix grammar, rewrite, or format selected text in any Windows app with a shortcut.
Description: |-
  ParaPhraser is a Windows writing assistant that lives in the system tray. Select text in any app and
  press a shortcut to fix grammar, rewrite, shorten, or format it, then review the suggestion and
  replace the original in place. It works offline with Ollama on your own computer, or online with
  your own Anthropic, OpenAI, Google Gemini, or OpenRouter API key. It keeps no history.
