ShortDescription: An offline LDS scripture reader with notes, tags, search, and opt-in AI.
Description: |-
  Desktop Scriptures is an unofficial, offline-first desktop reader for the Bible, Book of Mormon,
  Doctrine and Covenants, and Pearl of Great Price, plus the Journal of Discourses, Lectures on Faith,
  and the Joseph Smith Translation. It has personal notes, tags, verse highlighting, a searchable
  Journal, keyword search, a Topical Guide, Word Study with the original Hebrew, Aramaic, and Greek
  words, cross-references, General Conference and Liahona citations, offline text-to-speech,
  cloud-folder sync, and opt-in AI-assisted search with an AI service you choose.
