ShortDescription: On-screen step-by-step tutorials in any Windows app, driven by an AI agent over MCP.
Description: |-
  An overlay that an AI agent (Claude Code or any MCP client) drives over MCP: it reads the app's interface
  (UI Automation, Windows OCR), highlights the right buttons right on top of it and walks the user through the
  steps, while the overlay notices what the user did and moves on by itself. It lives in the tray.
  Connect it to Claude Code with: claude mcp add --scope user tutorial-overlay -- tutorial-overlay --stdio
Moniker: tutorial-overlay
