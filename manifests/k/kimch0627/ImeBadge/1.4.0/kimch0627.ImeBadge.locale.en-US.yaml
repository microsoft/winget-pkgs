PackageLocale: en-US
Publisher: kimch0627
PackageName: ImeBadge
ShortDescription: Shows the Korean/English IME state as a small badge next to the text caret
Description: |-
  Before you type, ImeBadge tells you whether the keyboard is in Korean (Hangul) or English mode by
  drawing a tiny badge next to the text caret. Works with Win32 apps such as Notepad and Word and with
  Chromium/Electron apps such as Chrome, Edge and VS Code. Shape, position, size and colors are
  configurable, and the badge hides itself in full-screen apps or apps you exclude. No telemetry;
  the only network access is an optional update check.
