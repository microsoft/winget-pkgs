ReleaseNotes: |-
  Introduction
  In this release, we implemented refactoring to update dependencies and add new features.
  This release adds the kustomize edit add configuration and kustomize edit remove component commands. #6037 #6083
  The built-in OpenAPI schema is now loaded from a pre-compiled bundle embedded in the binary. #6190
  The schema itself is still based on Kubernetes v1.21.2, so the output of kustomize build is not expected to change. If you notice any difference, please file an issue.
  Feature
  #6037: feat: add support for 'kustomize edit add configuration' command
  #6083: Add kustomize edit remove component command
  fix
  #6263: fix: report an error when the fetched openapi schema is not JSON
  Dependencies
  #6075: update go 1.25.7
  #6078: bump go-git and x/crypt
  #6085: update otel lib to v1.40.0
  #6134: drop 'go-spew' dependencies and update dependencies
