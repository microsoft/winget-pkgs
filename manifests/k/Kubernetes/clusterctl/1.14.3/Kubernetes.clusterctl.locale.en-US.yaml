ReleaseNotes: "## 👌 Kubernetes version support\n\n• Management Cluster：v1.33.x -> v1.37.x\n• Workload Cluster：v1.31.x -> v1.37.x\n\n[More information about version support can be found here](https://cluster-api.sigs.k8s.io/reference/versions.html)\n\n## Changes since v1.14.2\n## :chart_with_upwards_trend：Overview\n• 16 new commits merged\n• 6 bugs fixed 🐛\n\n## :bug：Bug Fixes\n• CI：Bump machine to `highcpu-32` (#14225)\n• Cluster：Also set cluster-name label on Clusters without ClusterClass (#14310)\n• KCP：Fix race in KCP proxy DialContext (#14278)\n• KCP：Try to match etcd member to machine being deleted by KCP (#14263)\n• Machine/MachineSet：Gracefully handle not-found when resolving owner references (#14250)\n• Misc：Implement support for multiNamespaceInformer in controller util consistency store (#14290)\n\n## :seedling：Others\n• CI：Add verify for downloaded binaries (#14275)\n• CI：Improve Kubernetes version resolution (#14276)\n• clusterctl：Bump cert-manager to v1.21.2 (#14238)\n• Dependency：Bump grpc to 1.83.2 to address security advisories (#14243)\n• Dependency：Update Otel version to v1.45.0 (#14315)\n• e2e：Extend e2e tests to detect double rollouts (#14279)\n• Runtime SDK：Improve discovery (#14261)\n• Testing：Fix flaky TestReconcileControlPlane by reading the Cluster with the API reader (#14300)\n• Testing：Restore apiVersionGetter after unit tests (#14255)\n\n:book：Additionally, there has been 1 contribution to our documentation and book. (#14228) \n\n## Dependencies\n\n### Added\n_Nothing has changed._\n\n### Changed\n• github.com/grpc-ecosystem/grpc-gateway/v2：[v2.28.0 → v2.29.0](https://github.com/grpc-ecosystem/grpc-gateway/compare/v2.28.0...v2.29.0)\n• go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc：v1.43.0 → v1.45.0\n• go.opentelemetry.io/otel/exporters/otlp/otlptrace：v1.43.0 → v1.45.0\n• go.opentelemetry.io/otel/metric：v1.44.0 → v1.45.0\n• go.opentelemetry.io/otel/sdk/metric：v1.44.0 → v1.45.0\n• go.opentelemetry.io/otel/sdk：v1.44.0 → v1.45.0\n• go.opentelemetry.io/otel/trace：v1.44.0 → v1.45.0\n• go.opentelemetry.io/otel：v1.44.0 → v1.45.0\n• go.opentelemetry.io/proto/otlp：v1.10.0 → v1.11.0\n• golang.org/x/net：v0.57.0 → v0.58.0\n• google.golang.org/genproto/googleapis/api：3dc84a4 → 6ac0973\n• google.golang.org/genproto/googleapis/rpc：3dc84a4 → 6ac0973\n• google.golang.org/grpc：v1.83.1 → v1.83.2\n\n### Removed\n_Nothing has changed._\n\n_Thanks to all our contributors!_ 😊"
