ReleaseNotes: "## 👌 Kubernetes version support\r\n\r\n• Management Cluster：v1.33.x -> v1.37.x\r\n• Workload Cluster：v1.31.x -> v1.37.x\r\n\r\n[More information about version support can be found here](https://cluster-api.sigs.k8s.io/reference/versions.html)\r\n\r\n## Changes since v1.14.1\r\n## :chart_with_upwards_trend：Overview\r\n• 9 new commits merged\r\n• 1 feature addition ✨\r\n• 4 bugs fixed 🐛\r\n\r\n## :sparkles：New Features\r\n• Security：Add --tls-curve-preferences flag to manager options (#14194)\r\n\r\n## :bug：Bug Fixes\r\n• ClusterClass：Lifecycle hooks fix (#14180)\r\n• KCP：Avoid deleting learners after Node registration (#14208)\r\n• KCP：Deduplicate KCP preflightchecks (#14192)\r\n• KCP：Fix KCP rollout issue after upgrade from CAPI v1.11 (#14172)\r\n\r\n## :seedling：Others\r\n• Dependency：Bump google.golang.org/grpc + golang.org/x/crypto to fix CVEs (#14205)\r\n• e2e：Install the minimum required kind version for e2e test (#14186)\r\n\r\n:book：Additionally, there have been 2 contributions to our documentation and book. (#14178, #14183) \r\n\r\n## Dependencies\r\n\r\n### Added\r\n• cloud.google.com/go/auth：v0.18.2\r\n• github.com/google/s2a-go：[v0.1.9](https://github.com/google/s2a-go/tree/v0.1.9)\r\n• github.com/googleapis/enterprise-certificate-proxy：[v0.3.11](https://github.com/googleapis/enterprise-certificate-proxy/tree/v0.3.11)\r\n\r\n### Changed\r\n• cel.dev/expr：v0.25.1 → v0.25.2\r\n• github.com/GoogleCloudPlatform/opentelemetry-operations-go/detectors/gcp：[v1.32.0 → v1.33.0](https://github.com/GoogleCloudPlatform/opentelemetry-operations-go/compare/detectors/gcp/v1.32.0...detectors/gcp/v1.33.0)\r\n• github.com/googleapis/gax-go/v2：[v2.0.5 → v2.17.0](https://github.com/googleapis/gax-go/compare/v2.0.5...v2.17.0)\r\n• github.com/spiffe/go-spiffe/v2：[v2.6.0 → v2.7.0](https://github.com/spiffe/go-spiffe/compare/v2.6.0...v2.7.0)\r\n• go.opentelemetry.io/contrib/detectors/gcp：v1.43.0 → v1.44.0\r\n• go.opentelemetry.io/otel/metric：v1.43.0 → v1.44.0\r\n• go.opentelemetry.io/otel/sdk/metric：v1.43.0 → v1.44.0\r\n• go.opentelemetry.io/otel/sdk：v1.43.0 → v1.44.0\r\n• go.opentelemetry.io/otel/trace：v1.43.0 → v1.44.0\r\n• go.opentelemetry.io/otel：v1.43.0 → v1.44.0\r\n• golang.org/x/crypto：v0.53.0 → v0.56.0\r\n• golang.org/x/mod：v0.37.0 → v0.38.0\r\n• golang.org/x/net：v0.56.0 → v0.57.0\r\n• golang.org/x/sys：v0.46.0 → v0.47.0\r\n• golang.org/x/telemetry：59b4966 → 49f421f\r\n• golang.org/x/term：v0.44.0 → v0.45.0\r\n• golang.org/x/text：v0.40.0 → v0.41.0\r\n• golang.org/x/tools：v0.47.0 → v0.48.0\r\n• google.golang.org/genproto/googleapis/api：afd174a → 3dc84a4\r\n• google.golang.org/genproto/googleapis/rpc：afd174a → 3dc84a4\r\n• google.golang.org/grpc：v1.82.1 → v1.83.1\r\n\r\n### Removed\r\n_Nothing has changed._\r\n\r\n_Thanks to all our contributors!_ 😊"
