PackageIdentifier: kizemo.AlphaFileManager
PackageVersion: 3.9.1
PackageLocale: zh-CN
ShortDescription: 面向 Windows 与 Linux 的双栏文件管理器，支持 SFTP/FTP、目录比较同步、批量改名与解除文件锁定。
Description: |-
  Alpha File Manager 是一款面向 Windows 与 Linux 的双栏文件管理器，技术栈是 Tauri 2 + Rust + Vue 3。

  两侧文件窗格共用一个导航器：左侧目录树会跟着你正在用的那一格走，连上远程服务器也能展开成树。收藏按分类分组，常用目录一点就进。

  它说的是你真正在用的协议：SFTP、FTP 与 FTPS。目录比较会逐个文件、逐层目录说清楚到底哪里不同，然后才动任何东西，而且自己绝不删东西。

  另外还有：批量改名、文件比较与同步、压缩包查看器、快速预览面板，以及一个终端。

  当 Windows 拒绝删除某个文件时，右键菜单能处理：它会告诉你是哪个程序占着这个文件，并且可以把文件彻底删掉——先清只读位，再标记成「占用者一放手就消失」，最后兜底到「下次启动 Windows 时删掉」。

  3.9.1 版让「隐藏目录树」在重启后依然保持隐藏，并给扩展沙箱加上网络隔离，扩展代码不再能导入远程模块或访问网络。
