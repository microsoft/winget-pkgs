ShortDescription: One local catalog for all your Windows apps
Description: KesVio is a local-first Windows application catalog for discovering, organizing, searching, and launching desktop, Microsoft Store, Steam, and portable apps from one place. It automatically detects applications from multiple Windows sources, merges duplicate discoveries, supports favorites, saved filters, categories, and reusable scenarios for launching or closing groups of apps. Search works across app names, publishers, descriptions, paths, categories, common aliases, and an offline index of winget package names. KesVio works without an account or telemetry and keeps the application catalog and user preferences on the local computer.
