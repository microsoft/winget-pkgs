ShortDescription: Edit, validate and transform XML, XSD and JSON
Description: |-
  FreeXmlToolkit is a free desktop toolkit for working with XML and related formats.
  Open a file and switch between a text editor, a tree view and a graphical view.
  - XML editor with schema-aware IntelliSense, formatting and an XMLSpy-style grid
  - Visual XSD editor with type library, statistics and documentation generation
  - Validation against XSD 1.0/1.1 and Schematron, including Schematron Quick Fixes
  - XSLT 3.0, XQuery 3.1, XPath 3.1 and XProc 3.0 with Saxon and XML Calabash
  - PDF generation with Apache FOP and XML digital signatures
  - JSON editing with text, tree and grid views
