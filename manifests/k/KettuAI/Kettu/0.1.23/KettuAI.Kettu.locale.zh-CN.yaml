ReleaseNotes: |-
  每个智能体都能选常用模型，同一个账号里的配对请求在任何一台设备上都能确认，一个码能连多台电脑，问题报告不再带个人信息，联系我们里加了微信群。
  - 常用模型：设置 › 智能体 里每个智能体的页上有 常用模型：最多选四个、拖动排好顺序，模型菜单的首页就只列这些，其余在 更多模型 里；更多模型 底部的 自定义… 直接打开这里，恢复自动 回到自动挑选。(#2574)
  - 同一个账号里的配对：账号里的设备发来请求，在电脑上或你任何一台能用它的设备上都能确认，桌面应用、网页客户端和守护进程的 kettu requests 都可以；以第一个回答为准，有设备加入时每台设备都会收到通知。一台电脑也能用一个码连上账号里的多台电脑。(#2560)
  - 移除刚加入的设备：加入提示或系统通知里的 移除 会打开这台设备的页面，先问一次再移除，和设备列表一样。(#2569)
  - 问题报告：报告里的邮箱地址和主目录会被遮掉，主机日志只保留报告的时间段，也不带你给智能体起的名字。(#2567)
  - 联系我们：设置 › 关于 里加了微信群，点开是 kettu.sh 上的群页面。(#2570)
  - 手机上的网页客户端：长按链接时菜单里会显示链接预览。(#2568)
  - 修复：智能体报了两遍的命令，斜杠列表里只列一次 (#2565)；更新弹窗按小标题列出每项改动，不再露出 Markdown 标记，也不在句子中间截断 (#2572)。
