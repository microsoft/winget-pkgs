ReleaseNotes: |-
  Introduces per-turn cost breakdowns, single-turn file undo, thinking translation, manual agent delegation, browser element annotation, a Git branch graph with inline diffs, a bottom-dockable terminal, Pi branches and extension widgets, compact sidebar Activity view, custom desktop and project icons, conversation width and Chinese font controls, and automatic session resume after update restarts.
  What changed
  - Per-turn cost & token breakdown, single-turn file undo, thinking translation, and prompt cache notices: shows API-priced cost and per-model token breakdowns under replies (falling back to compact token totals when pricing is unavailable), adds single-turn file undo from each turn's changes card with preview diffs and disk digest conflict checks, adds on-demand translation for displayed thinking summaries with an Original / Translation toggle without altering stored history, and adds an opt-in Prompt cache drop notice under Settings › General. (#2998, #1918, #2991, #1789, #2995, #2548, #2971, #2810, thanks @akatsukiro)
  - Manual agent delegation, session-family navigation, and refined sub-session permissions & rounds: lets you pick another agent from the composer + menu (Delegate to agent…) to spawn a reporting child session, expands the session header into a Session group switcher with verifiable rolled-up tokens and cost, inherits the parent permission mode for agent-started sub-sessions in the same host and project while aligning permission ceilings and startup config sync, and labels multi-round child completion reports by round. (#2993, #2058, #2992, #2377, #2983, #2727, #2987, #2746, #2964, #2902, thanks @isyuah, @Yezh1i, @Ne1ther, @xiaolfeng)
  - Browser element annotation, artifact marquee selection, smarter popovers, comment management, and account isolation: adds Annotate mode in the built-in browser toolbar to pick page elements directly into the composer, adds drag marquee multi-element selection in artifact select mode, places artifact popovers outside highlight boxes and repositions them on scroll, reuses open element threads while adding comment/thread deletion and full list actions, and isolates account-owned artifacts and publish records by the signed-in account. (#2990, #1812, #2977, #2715, #2973, #2791, #2967, #2788, #2982, #2619, thanks @w-bytes, @xiaolfeng)
  - Git read-only branch graph, inline change diffs, and GitHub # issue/PR picker: adds a read-only Branch graph tab in the Git panel with commit history, forks, merges, ref badges, pagination, and commit file diffs, lets rows in Git › Changes expand inline diffs directly with a trailing Open full diff in tab button, and adds a # GitHub issue/PR picker in the composer along with repo-scoped #123 references in messages. (#2994, #2072, #2970, #2722, #2978, #2600, thanks @xiaolfeng)
  - Bottom-dockable terminal, Files panel selection notes, and desktop hover previews for file links: adds Move to bottom / Move to side docking for the terminal with a resizable height handle while keeping the live PTY and scrollback intact, adds selection-anchored Add note actions in the Files panel editor and rendered Markdown previews, and shows scrollable syntax-highlighted hover previews for file links and mention chips on hover-capable desktop devices. (#2988, #1917, #2985, #2522, #2969, #2731, thanks @xhbs, @xiaolfeng)
  - Pi branches, extension status & widgets, provider-grouped pickers, usage tracking, and native Edit from here: surfaces Pi extension status pills and scrollable text widgets inside sessions, adds native conversation branch browsing and switching inside Pi sessions, includes Pi sessions in global usage summaries and per-session model request details, groups Pi models by provider in model pickers, and enables native Edit from here rewind for Pi and Cline SDK. (#3000, #1837, #2997, #1835, #2966, #2811, #2962, #2926, #2979, #2698, thanks @Yezh1i, @sunCloud998)
  - Compact sidebar Search & Activity view, custom project icons, remote menu parity, and Web panel swipes: replaces the full-width sidebar search bar with compact Search and Activity icon buttons, adds custom project icons (built-in icons with preset colors or emoji), brings remote host project menus to parity with local actions (new session, terminal, worktree settings, archived sessions, and import), and adds horizontal swipe navigation between columns on narrow Web viewports. (#2976, #2563, #2980, #2705, #2963, #2929, #2972, #2748, thanks @Yezh1i, @akatsukiro, @xiaolfeng)
  - Custom desktop app icons, conversation width, code & Chinese font settings, and harness capability checklist: adds App icon (6 Kettu icon variants), Conversation width (Standard / Wide), Code size, and optional Chinese (optional) font settings for UI, replies, and code under Settings › Appearance, plus an 11-item Integration capabilities checklist for every agent under Settings › Agents. (#2968, #2877, #2981, #2718, #2984, #2104, #2975, #2576, #2996, #1938, thanks @maysilence, @kinhangliew-debug)
  - Automatic session resume after updates and enhanced remote host update lifecycle: automatically resumes interrupted local user sessions once after an immediate update restart (showing an inline warning and manual resume fallback when automatic resume is unsafe), and extends host-side remote update progress, busy-timing confirmation, and Windows installer confirmation tracking for mobile clients. (#2974, #2802, #2999, #2786, #2838, thanks @Ne1ther, @liuchaowei666)
  - Codex MCP http_headers discovery and site icon domain fallback: reads http_headers when discovering and importing remote Codex MCP servers so literal keys move safely into the key store and forward on requests, and falls back to the registrable domain when a subdomain has no site icon. (#2965, #2943, #2961, #2932)
  中文
  - 单轮费用与 Token 明细、单轮文件改动撤销、思考摘要翻译与 Prompt Cache 下降提醒：在每条回复下方展示按 API 定价计算的费用及分模型 Token 详情（无定价时回退展示紧凑 Token 汇总）；支持从单轮改动卡片预览差异并撤销该轮文件改动，执行前校验磁盘摘要与后续冲突；支持按需翻译思考摘要并在 原文 / 译文 间切换且不改写历史记录；在 设置 › 通用 新增可选的 Prompt Cache 命中下降提醒。(#2998, #1918, #2991, #1789, #2995, #2548, #2971, #2810，感谢 @akatsukiro)
  - 手动委派任务给其他智能体、同组会话导航与汇总、以及子会话权限与轮次完善：在输入框 + 菜单新增 委派给 Agent…，可直接指定智能体启动子会话并回报结果；在会话顶部扩展 同组会话 切换与可验证的 Token/费用汇总；允许同主机同项目下由智能体启动的子会话继承父会话权限模式并对齐权限上限与启动配置同步；为多轮子会话完成汇报区分轮次标记。(#2993, #2058, #2992, #2377, #2983, #2727, #2987, #2746, #2964, #2902，感谢 @isyuah, @Yezh1i, @Ne1ther, @xiaolfeng)
  - 内置浏览器页面元素标注、产物框选多元素、浮层外置与滚动重定位、评论管理与按账号隔离：在内置浏览器工具栏新增 标注 模式，点选页面元素直接引用到输入框；产物选择模式支持拖拽框选多个元素；产物浮层避开元素高亮框并随滚动动态重定位；点选已有开放评论的元素时复用原讨论串，同时补全评论/讨论串删除与列表操作；按当前登录账号隔离产物及其发布记录。(#2990, #1812, #2977, #2715, #2973, #2791, #2967, #2788, #2982, #2619，感谢 @w-bytes, @xiaolfeng)
  - Git 只读分支图、更改列表行内展开差异与 GitHub # Issue/PR 选择器：在 Git 面板新增只读 分支图 标签页，支持提交历史、分叉合并、引用徽章、分页加载与点击查看提交差异；点击 更改 列表文件行可直接展开行内差异预览，右侧按钮可 在标签页打开完整差异；在输入框支持 # 搜索引用当前 GitHub 仓库的 Issue/PR，并在消息中识别仓库内 #123 引用。(#2994, #2072, #2970, #2722, #2978, #2600，感谢 @xiaolfeng)
  - 终端底部停靠、文件面板选区写备注与桌面端文件链接悬浮预览：终端支持 移到底部 / 移回右侧 并可拖动调整底部高度，切换布局时保留运行中的终端进程与滚屏记录；在文件面板编辑器与 Markdown 预览选中文本后可点击 写备注 添加锚定备注；桌面端悬停回复里的文件引用与提及标签时可弹出带语法高亮的可滚动预览卡片。(#2988, #1917, #2985, #2522, #2969, #2731，感谢 @xhbs, @xiaolfeng)
  - Pi 会话分支切换、扩展状态与小组件、按供应商分组的模型选择、用量统计与原生「从这里重新编辑」：在会话内呈现 Pi 扩展状态胶囊与文本小组件；支持浏览并切换 Pi 原生会话分支；将 Pi 会话纳入全局用量总览与单会话模型请求明细；在模型选择器中按供应商分组展示 Pi 模型；为 Pi 与 Cline SDK 启用原生 从这里重新编辑 回退能力。(#3000, #1837, #2997, #1835, #2966, #2811, #2962, #2926, #2979, #2698，感谢 @Yezh1i, @sunCloud998)
  - 侧栏紧凑搜索与活动视图、自定义项目图标、远程项目菜单对齐与窄屏 Web 手势切换：将侧栏顶部搜索框收拢为紧凑的 搜索 与 活动 图标按钮；支持为项目自定义内置图标、预设配色或 Emoji；补齐远程主机项目菜单的新建会话、终端、工作树设置、已归档与导入会话操作；窄屏 Web 端支持水平滑动手势在侧栏、对话主区与右侧面板间切换。(#2976, #2563, #2980, #2705, #2963, #2929, #2972, #2748，感谢 @Yezh1i, @akatsukiro, @xiaolfeng)
  - 自定义桌面应用图标、会话宽度预设、代码字号与中文字体设置、以及智能体接入能力清单：在 设置 › 外观 新增 应用图标（6 款图标样式）、会话宽度（标准 / 宽版）、代码字号 及面向界面/回复/代码的 中文字体（可选） 设置；在 设置 › 智能体 为每个智能体提供 11 项 接入能力 清单与差距说明。(#2968, #2877, #2981, #2718, #2984, #2104, #2975, #2576, #2996, #1938，感谢 @maysilence, @kinhangliew-debug)
  - 更新重启后自动恢复会话与远程主机更新流程增强：立即重启安装桌面端更新后自动续接被中断的本地用户会话（无法安全自动恢复时展示行内提示与手动恢复入口）；完善主机端远程更新生命周期状态、忙碌时更新时机确认及 Windows 系统安装确认提示上报，供移动端客户端完整呈现。(#2974, #2802, #2999, #2786, #2838，感谢 @Ne1ther, @liuchaowei666)
  - Codex MCP http_headers 识别与站点图标主域名回退：发现并导入远程 Codex MCP 服务器时正确读取 http_headers，将明文密钥安全移入密钥存储并在请求中透传；子域名缺少站点图标时自动回退尝试其主域名图标。(#2965, #2943, #2961, #2932)
