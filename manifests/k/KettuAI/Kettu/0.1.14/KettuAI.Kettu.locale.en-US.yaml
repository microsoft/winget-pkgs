ReleaseNotes: |-
  Kettu 0.1.14 lets agents find and change Settings for you, use the terminals and browser pages you opened once you allow it, and set auto-compact for every harness that has it.
  What changed
  - Agents can look up any setting, take you to its row and change it: after your answer in a card, or at once in Full access, with a line to Undo it. Secrets are never shown, and sign-out or delete actions are never done for you. (#2039)
  - A terminal or browser page you opened can now be used by the agent once you allow it, from Reference in conversation in its tab's menu or from a card on its first use. Terminal tabs are named by what they run, and agents can name and rename them. (#2035, #2038, #2036)
  - Auto-compact in Settings › Agent takes any value you type, such as 272K or 85%, and every harness with a user-level setting for it gets one, in its own unit. (#2050)
  - Calls of Kettu's own tools read as what they do, such as "Find settings", instead of their internal names. (#2046)
  - No project has its own mark and a pin in the sidebar, and the Language picker shows each language's flag. (#2049, #2032)
  - The account menu shows how many reset credits a Codex account holds. (#2027)
  - Sessions on your other computers send system notifications, with the computer's name before the title. (#2056)
  - Site icons that are dark stay readable on the dark theme. (#2041)
  - A link to a project file shows as a file link on Windows paths and for files git ignores. (#2048)
  - An artifact's menu has Show in Finder (Explorer, the file manager). (#2081)
  - Fixes: the agent menu no longer grows over the macOS window buttons, the project menu always shows Open project and scrolls, and New session starts on the only agent a computer has. (#2086)
  - Fixes: Kilo Code shows its update and install method, the Harnesses list flags a version that does not work with Kettu, Add agent and Add host give focus back when closed, and install hints show their commands as code. (#2084, #2066)
  - Fixes: a forked OpenCode session's request records open again, importing a session its agent does not list fails clearly, kettu pair, kettu devices and kettu direct exit with the right code, and the daemon works on Node 22. (#2080, #2082)
  - Fixes: the web client's sidebar and terminal errors, the Overview view switcher's labels, a hovered project row's width, a workflow step's status on hover, and long words in dialog titles. (#2085, #2081, #2065)
