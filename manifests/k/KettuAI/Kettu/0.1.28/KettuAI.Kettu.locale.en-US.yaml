ReleaseNotes: |-
  Much smoother scrolling and switching in long sessions, Codex Fast and Ultrafast speed modes, verbatim user messages without accidental single-tilde strikethrough, full-height desktop browser previews with Fill pane mode, local Antigravity usage and context breakdowns, editable projects and cross-folder Codex imports, plus mobile sidebar and remote-host fixes.
  What changed
  - Smooth scrolling and faster switching in long sessions: eliminated per-scroll layout reads across off-screen messages, replaced the viewport bottom mask with compositor-only top and bottom fade overlays, switched long-thread virtualization to idle-only eviction, fixed Markdown table layout thrashing, removed per-item :has() popover checks, and enabled local tool content digests so threads with hundreds to thousands of entries scroll and switch cleanly. (#2794)
  - Codex Fast and Ultrafast speed tiers: dynamically reads all speed service tiers advertised by Codex models with segmented Standard, Fast and Ultrafast controls in the model picker, concise speed badges in the composer, and the /ultrafast slash command alongside /fast. (#2769)
  - Verbatim user messages and single-tilde path safety: sent user bubbles now render verbatim with Kettu chips and explicit fenced code blocks instead of full Markdown, and single-tilde paths or shell prompts (~/a, root@host:~#) no longer trigger strikethrough in agent replies or the document viewer. (#2771)
  - Full-height built-in browser preview and Fill pane mode: Desktop mode now keeps a 1280px logical width while stretching to fill the side panel height without empty letterbox space below the page, freezes viewport dimensions during active agent turns, and adds a Fill pane (100%) size mode. (#2768)
  - Local Antigravity usage, context breakdown and IDE imports: reads local Google Antigravity conversation stores read-only for Usage on this computer and session context breakdowns (hiding duplicate definition estimates when exact breakdowns are shown), and routes imported IDE sessions through --app-data-dir while guarding empty replays. (#2763, #2773, #2726, thanks @maysilence)
  - Mobile and touch sidebar actions stay visible: project folder + / ⋯, session ⋯, and fold arrows now remain visible on touch and narrow phone viewports even when mobile browsers report hover: hover, with proper right spacing and hidden keyboard shortcuts in phone layouts. (#2775, thanks @xiaolfeng)
  - Edit project names and folders, plus cross-folder Codex imports: rename projects or add and remove folders from the sidebar project menu, and import Codex sessions across folders. (#2761, #2759, thanks @Yezh1i)
  - Multiple skills, artifact attachments and New session improvements: attach multiple /skill chips in one message, attach existing artifacts from the + menu, switch local Git branches and use header tools directly from New session, and preserve the permission mode on new worktrees. (#2760, #2754, #2750, #2747, #2733, thanks @xiaolfeng, @akatsukiro)
  - Completed turn durations, compact context popover and sidebar polish: completed replies now show their turn duration, the context usage popover is more compact, idle sidebar rows with badges align flush right and slide on hover, and tall popovers and menus scroll within the viewport. (#2741, #2739, #2738, #2737, thanks @kcyu1010, @kinhangliew-debug, @xiaolfeng, @songxff)
  - Option to close the side panel with its last tab: added Settings › Appearance › Sidebar › Close the side panel with its last tab to collapse the side panel instead of showing the panel list when closing its final tab. (#2749)
  - Remote dev-server port preservation, multi-host usage and relay region names: forwarded remote dev servers prefer their original loopback port with safe conflict fallback and companion forward_ports CORS/WebSocket support, unified remote gh CLI routing, scoped multi-host plan limit cards by host and tray readings to the newest data, and displayed friendly region names in Settings › Remote access. (#2758, #2743, #2755, #2752, #2793, thanks @Leochens, @akatsukiro, @Ne1ther)
  - Workflow, Git, artifact, plugin, macOS and iPad device fixes: wake sleeping workflow step sessions and keep approved workflow snapshots, only emit opened-PR events when a tool actually creates a PR, fix reopened artifact comment state and popover navigation, route plugin network.fetch through the configured proxy, spawn the Electron Helper binary for ELECTRON_RUN_AS_NODE scripts on macOS, replace the removed xcdevice wait probe for Xcode 26+ / iPadOS devices, and recheck browser overlays on geometry changes. (#2753, #2734, #2742, #2740, #2751, #2735, #2757, #2729, thanks @akatsukiro, @xiaolfeng, @Elijah-s)
  中文
  - 长会话滚动与切换大幅提速：移除滚动时跨离屏消息的同步布局读取，将视口底部遮罩改为纯合成器上下渐隐层，将长会话虚拟卸载改为滚动静止后按需回收，消除 Markdown 表格布局抖动与逐项 :has() 样式重算，并在桌面本地会话启用工具内容摘要，显著缓解数百至数千条历史会话的滚动和切换卡顿。(#2794)
  - 支持 Codex 快速与极速模式：动态读取 Codex 模型声明的全部速度档位，在模型选择器内提供「标准 / 快速 / 极速」分段选择与输入框徽标，并新增 /ultrafast 斜杠命令与 /fast 互通切换。(#2769)
  - 用户消息所见即所得，修复单 ~ 误划删除线：已发送的用户消息气泡改为原样保留文本（支持 Kettu 芯片与显式围栏代码块），不再误把终端粘贴和普通符号当成 Markdown 渲染；同时全站修复单波浪线路径与提示符（如 ~/a、root@host:~#）被误加删除线的问题。(#2771)
  - 内置浏览器桌面视口撑满全高，新增「适应窗口」模式：桌面模式保留 1280px 逻辑宽度并按侧栏纵横比撑满全高，消除页面下方大片斜纹空白，Agent 操控期间锁定视口防点偏，并新增 100% 铺满的「适应窗口」模式。(#2768)
  - 本地读取 Antigravity 用量与精确上下文，修复 IDE 导入：只读解析本机 Google Antigravity 会话库以展示本机用量与精确上下文构成（有精确明细时自动隐藏估算区），并通过 --app-data-dir 正确导入 IDE 会话、防止空重放。(#2763, #2773, #2726，感谢 @maysilence)
  - 修复手机与触屏端侧栏操作按钮隐身：项目文件夹的 + / ⋯、会话 ⋯ 与折叠箭头在触屏和手机窄屏下始终可见（兼容同时上报 hover: hover 的移动浏览器），补齐双按钮右侧留白，并隐藏手机端侧栏和菜单内的快捷键提示。(#2775，感谢 @xiaolfeng)
  - 支持编辑项目名称与文件夹、跨文件夹导入 Codex 会话：可在侧边栏项目菜单中重命名项目或增删包含的文件夹，并支持跨目录导入 Codex 历史会话。(#2761, #2759，感谢 @Yezh1i)
  - 单条消息多选技能、附加产物与新建会话增强：支持在单条消息里同时选择多个 /skill，从 + 菜单直接附加已有产物，在新建会话页直接切换本地 Git 分支和使用顶栏工具，并在新建 worktree 时保留权限模式。(#2760, #2754, #2750, #2747, #2733，感谢 @xiaolfeng, @akatsukiro)
  - 显示回复耗时、紧凑上下文弹层与界面打磨：完成的回复底部显示耗时，上下文用量弹层更紧凑，带角标的空闲侧边栏行右对齐并在悬停时滑开，超长弹层与下拉菜单自动限高滚动。(#2741, #2739, #2738, #2737，感谢 @kcyu1010, @kinhangliew-debug, @xiaolfeng, @songxff)
  - 新增「关闭最后一个标签页时收起侧边栏」设置：在 设置 › 外观 › 侧边栏 新增开关，开启后关掉侧边栏最后一个标签页时直接收起侧边栏，不再停留在面板列表。(#2749)
  - 远程开发端口保留、多主机用量隔离与中继区域名称：远程开发服务器转发优先复用原本地端口并在冲突时安全回退且支持关联端口 forward_ports 的 CORS/WebSocket 转发，统一远程桌面 gh CLI 路由，按主机隔离无账号标识的多主机套餐限额卡片并让托盘优先显示最新读数，设置 › 远程访问 改以友好区域名展示官方中继。(#2758, #2743, #2755, #2752, #2793，感谢 @Leochens, @akatsukiro, @Ne1ther)
  - 工作流、Git、产物、插件、macOS 与 iPad 真机修复：工作流复用休眠步骤会话时安全唤醒并保留批准时的工作流快照，仅在实际创建 PR 时才生成「已创建 PR」事件，修复产物评论重新打开状态与卡片跳转，插件 network.fetch 走已配置代理，macOS 上 ELECTRON_RUN_AS_NODE 改用 Electron Helper 启动，替换 Xcode 26+ 移除的 xcdevice wait 探测以修复 iPadOS 真机控制，以及窗口几何变化时重检浏览器遮罩。(#2753, #2734, #2742, #2740, #2751, #2735, #2757, #2729，感谢 @akatsukiro, @xiaolfeng, @Elijah-s)
