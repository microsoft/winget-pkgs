ReleaseNotes: |-
  Brings full MCP library discovery, inspection, tool-change review, and terminal/app sharing, unified approval for repository settings, project archiving with history, collapsed folder status indicators, smarter session link routing and browser tab reuse, GitHub Stacked PR cards, plus key fixes for Antigravity, OpenCode, Windows terminals and updates, Harness version badges, composer skills, Usage viewports, and scrollable update dialogs.
  What changed
  - MCP library discovery, inspection, and tool-change review: discovers and imports existing MCP servers from installed agents and apps (moving credentials to the host keychain and avoiding duplicate same-name servers at startup), completes server pages with Overview, Tools, Calls, and Logs tabs (per-tool switches, per-project scope, 30-day call history, and masked stderr logs) plus session context popover controls, holds back new or changed tool definitions from manual, imported, and community servers until you accept them, and lets agents list, check, add, and switch library servers behind confirmation cards. (#2814, #2779, #2837, #2824, #2781, #2843, #2784, #2846, #2785, #2862, #2839)
  - Share Kettu's MCP library with terminal CLIs and desktop apps: lets you turn on Kettu's MCP library per terminal CLI and supported installed desktop app (such as Cursor, VS Code, Windsurf, and Zed) under Marketplace › MCP › Terminal and apps, with a preview plan, encrypted backups before editing, outside-change drift detection without silent overwrites, and one-click restore. (#2863, #2891, #2782)
  - Unified approval for repository settings and MCP servers: asks once per folder with a single card covering the repository's MCP servers and other project settings (hooks, plugins, commands, and variable or provider names without showing secret values), stores answers by content digest so changes ask again, and holds back or notifies on unapproved repository settings across supported agents. (#2871, #2879, #2623, #2783)
  - Project archiving and collapsed folder status indicators: archive projects from the sidebar while keeping their historical sessions and files intact—view retained sessions, restore, or remove them under Settings › Archived—and see an aggregated status dot at the end of collapsed project folders summarizing waiting, error, running, starting, and unread sessions. (#2895, #2830, #2880, #2834, thanks @Ne1ther, @Ariember)
  - Smarter session link routing, browser tab reuse, bare host:port links, and GitHub Stacked PR cards: routes session-associated links across the sidebar, Overview, GitHub cards, git pane, terminals, and citations through the shared link planner; opening links in the Session browser now activates an existing matching tab without reloading or opens a new tab instead of overwriting the current one; auto-links valid bare host:port addresses (IPv4, localhost, bracketed IPv6) in agent replies; and recognizes GitHub Stacked Pull Requests (/stacks/<number>) links with a dedicated icon and hover card. (#2861, #2848, #2888, #2858, #2881, #2864, #2890, #2844, thanks @xiaolfeng, @Yezh1i)
  - Antigravity background-idle state, account-switch session release, and reliable message syncing: aligns Antigravity sessions waiting on background work or timers with the calm background-idle state and fixes follow-up turn boundaries so interrupting background waits no longer duplicates messages; releases idle and prepared sessions automatically when an agent account changes (and defers active turns until idle) so sessions pick up fresh credentials instead of old-account limits; improves web and remote optimistic send echo matching by device and content fingerprint; deduplicates empty trailing turn-end lines; and surfaces exit causes and disk-full (ENOSPC) guidance when a host or agent stops unexpectedly. (#2873, #2845, #2855, #2850, #2832, #2897, #2893, #2849, #2833, #2896, #2870, #2860, #2841, thanks @akatsukiro, @Elijah-s)
  - Windows terminal cleanup, clean shutdown/update handling, and OpenCode custom models: fixes false busy detection on idle Windows terminals that blocked update restarts and adds Close all terminals to terminal tabs, session menus, and the sidebar; clears the running marker cleanly on Windows shutdown, logoff, and silent updates while hardening NSIS relaunch and shortcut refresh; and fixes OpenCode custom provider models on cold folders as well as Windows CLI path resolution for plan limits. (#2872, #2836, #2882, #2831, #2883, #2867, thanks @liuchaowei666, @maysilence)
  - Accurate Harness version checks and status badges: adds official release version checks for standalone and script-installed harnesses, distinguishes updateable releases from newer-version notices when no automatic update command applies, and stops showing false Up to date badges before a remote check succeeds. (#2892, #2876, thanks @TinyTigerPan)
  - Composer skill popover, multiline Tab suggestions, Usage picker, and scrollable dialogs: dismisses the skill popover cleanly after selecting a skill with inline badge feedback and wraps long Tab next-message suggestions across multiple lines; keeps the Usage date range picker and header controls inside narrow viewports without clipping; constrains update and quit dialogs to viewport height with a scrollable body and pinned action buttons; and caps merged toast notices and line counts. (#2894, #2851, #2874, #2886, #2875, #2847, #2825, #2866, #2856, thanks @kinhangliew-debug, @RainGoal)
  中文
  - MCP 库自动发现导入、详情监控与工具变更审核：自动扫描并导入已安装智能体和应用中的 MCP 服务器（密钥存入本机钥匙串，并在启动时避免重复拉起同名实例）；服务器详情页补齐 总览、工具、调用 与 日志 标签页（支持单个工具开关、按项目生效、30 天调用记录和脱敏 stderr 日志），并在会话上下文弹窗中提供状态查看、重连、登录与停用入口；对手动添加、导入及社区服务器的新增或变更工具定义自动扣下等待确认；同时允许智能体经由确认卡片查看、检查、添加和切换库内服务器。(#2814, #2779, #2837, #2824, #2781, #2843, #2784, #2846, #2785, #2862, #2839)
  - 向终端 CLI 与桌面应用共享 Kettu 的 MCP 库：在 市场 › MCP › 终端和应用 中可为各终端 CLI 及受支持的已安装桌面应用（如 Cursor、VS Code、Windsurf、Zed 等）一键启用 Kettu 的 MCP 库，开启前展示完整变更计划并加密备份原文件，检测外部改动且不擅自覆盖，关闭或恢复即可一键还原。(#2863, #2891, #2782)
  - 仓库与文件夹设置统一审批与隔离：首次打开含项目配置的文件夹时，通过单张卡片统一确认该目录的 MCP 服务器及其他项目设置（Hook、插件、命令、环境变量名与地址名等，不展示密钥值），按内容摘要保存决定（发生变更时重新询问），并在各受支持的智能体中隔离或提示未批准的仓库配置。(#2871, #2879, #2623, #2783)
  - 支持归档项目及折叠文件夹状态提示：支持在侧边栏归档项目并完整保留历史会话与本地文件，可在 设置 › 已归档 查看历史会话、恢复项目或移除；项目文件夹折叠后会在行尾展示汇总状态圆点，直观提示隐藏会话中的等待确认、出错、运行中、启动中与未读状态。(#2895, #2830, #2880, #2834，感谢 @Ne1ther, @Ariember)
  - 会话链接路由统一、会话浏览器标签复用、裸 host:port 与 GitHub Stacked PR 卡片：将侧边栏、总览、GitHub 卡片、Git 面板、终端与引用中的会话链接统一纳入链接打开规则；在 会话浏览器 中打开链接时优先切到已打开的匹配标签页而不重载，无匹配时新建标签页而不覆盖当前页；自动将回复中的合法裸 host:port（IPv4、localhost 与方括号 IPv6）转为可点击链接，并支持识别 GitHub Stacked Pull Requests（/stacks/<number>）链接与栈链悬浮卡片。(#2861, #2848, #2888, #2858, #2881, #2864, #2890, #2844，感谢 @xiaolfeng, @Yezh1i)
  - Antigravity 后台等待态对齐、切换账号自动释放会话与消息同步修复：Antigravity 等待后台任务或定时器时统一呈灰色后台闲置态，并修复期间发送追问时的轮次边界与消息重复问题；切换或退出智能体账号时自动释放空闲和预备会话（运行中会话待空闲后释放），避免旧会话继续报旧账号额度限制；按设备与内容指纹改进网页端和远程桌面端的乐观发送回显匹配，防止发送气泡滞留底部；去重空轮次末尾多余的耗时记录，并在进程异常退出或磁盘已满（ENOSPC）时展示清晰原因与指引。(#2873, #2845, #2855, #2850, #2832, #2897, #2893, #2849, #2833, #2896, #2870, #2860, #2841，感谢 @akatsukiro, @Elijah-s)
  - Windows 终端一键清理、关机/更新稳健性与 OpenCode 自定义模型修复：修复 Windows 空闲终端被误判为忙碌而阻塞更新重启的问题，并在终端标签页右键菜单、会话更多菜单及侧边栏菜单新增 关闭所有终端；修复 Windows 关机、注销或静默更新后误报上次意外退出的问题，并加固 NSIS 自动重启与快捷方式刷新；修复 OpenCode 冷启动文件夹时丢失自定义模型以及 Windows 下 CLI 路径解析导致额度读取失败的问题。(#2872, #2836, #2882, #2831, #2883, #2867，感谢 @liuchaowei666, @maysilence)
  - 修复 Harness 官方版本检测与「最新」状态徽章：为独立及脚本安装的 Harness 接入官方发布版本检测，清晰区分可更新版本、仅提示新版本与不可检测状态，消除未完成远程校验时误显示「最新」徽章的问题。(#2892, #2876，感谢 @TinyTigerPan)
  - 输入框技能弹窗、多行 Tab 建议、用量窄屏布局与可滚动更新弹窗：选中技能后立即收起候选弹窗并提供行内技能标签反馈，较长的 Tab 下一句建议自动换行展示不再被单行截断；修复 用量 页在较窄窗口下日期选择器左侧被遮挡与顶栏溢出问题；限制更新与退出确认弹窗在视口高度内、固定头部和底部操作按钮并允许中间区域滚动，同时限制底部合并通知的条目数与行数。(#2894, #2851, #2874, #2886, #2875, #2847, #2825, #2866, #2856，感谢 @kinhangliew-debug, @RainGoal)
