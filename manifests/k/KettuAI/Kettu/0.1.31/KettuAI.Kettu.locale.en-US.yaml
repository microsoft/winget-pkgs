ReleaseNotes: |-
  Introduces a unified composer live dock and wave-fill plan limit cards, richer mobile Live Activity states and quick options, faster session switching with Mermaid SVG caching and lag-free PDF preview, better Antigravity background task tracking, structured Codex configuration warnings, Mod+click local file opening, plus key fixes for project archiving, browser takeover cleanup, MCP entry restoration, and Windows PowerShell 7 detection.
  What changed
  - Unified composer live dock, wave-fill plan limit cards, and consistent writing indicator: replaces separate composer control bars and thread-tail running banners with a unified two-tier live dock and grouped upward popover, moves completed turn durations into the hover reply footer, redesigns sidebar and Context plan limit cards with four-tier seamless wave fills, unifies the streaming writing indicator so cards no longer trigger fallback flicker, and dims the background uniformly behind Settings. (#2959, #2951, #2937, #2945, #2923, #2913, #2908, thanks @xiaolfeng)
  - Full mobile Live Activity states, quick options, richer alerts, and delivery timings: extends desktop and daemon pushes to cover all five Live Activity states (waiting, error, running, plan limit, and recently ended), includes up to three quick options on waiting Live Activity cards (automatically stripped when Lock Screen details are off), adds agent and changed-file metadata plus opt-in plan-limit alerts, and records per-device answer, live update, and push delivery timings in local diagnostics logs. (#2935, #2952, #2957, #2950, #2772)
  - Mermaid SVG caching, preserved scroll position, and lag-free PDF preview: caches rendered Mermaid diagrams and defers uncached layout so switching back to diagram-heavy sessions stays instant, restores each session's saved scroll position on switch without flashing the bottom, and patches the PDF viewer to avoid unnecessary DOM writes while typing in the composer. (#2925, #2911, #2920, #2912, #2915, #2906, thanks @jintongxu, @hsjgsjs)
  - Antigravity background monitors, schedules, step tracking, and config stability: recognizes Antigravity monitor commands, one-shot timers, and recurring schedules in background status bars and the board, maps update_steps calls into the top-bar plan indicator, improves background-wait detection so sessions no longer look stuck spinning, and serializes per-session config updates so switching to full access no longer rolls back the selected thought level. (#2947, #2933, #2944, #2930, thanks @xiaolfeng, @akatsukiro)
  - Structured Codex configuration warnings with source locations and guidance: labels Codex configuration warnings by impact (deprecated, ignored, or invalid), shows the config layer and file location when reported, and offers direct actions to view or open the config file and jump to official Codex configuration docs. (#2914, #2907, thanks @xiaoyou222)
  - Mod+click local file links, sidebar session ID copy, and composer input polish: adds Cmd+click (macOS) / Ctrl+click (Windows/Linux) and Open with default app for local file links in replies (blocking directories and executables safely), adds Copy session ID to sidebar session menus, moves the caret to the start of the first line before recalling input history on Up Arrow, and clears accepted Tab next-message suggestions immediately on send. (#2905, #2865, #2924, #2919, #2948, #2921, #2909, #2903, thanks @Yezh1i, @sunCloud998, @Az0809)
  - Browser takeover cleanup, reliable cross-session replies, and board child tasks: releases browser takeover and notifies waiting agents immediately when closing the active browser tab or panel while dismissing control-held bubbles on outside clicks, preserves final replies when trimming long turns in cross-session history tools with paginated get_session replies scoped to the latest turn, and lists child sessions in the session board while hiding the redundant empty header. (#2942, #2927, #2946, #2931, #2928, #2917, #2918, thanks @xiaolfeng, @xiaoyou222)
  - Project archive crash fix, MCP entry restore with Devin Desktop, Windows PowerShell 7, and i18n polish: fixes a crash when archiving a project and cleans up split panes and drafts, restores original MCP config entries when removing a server from an agent or app under Marketplace › MCP › Terminal and apps while adding Devin Desktop support, detects Microsoft Store PowerShell 7 (pwsh.exe) App Execution Aliases on Windows instead of falling back to Windows PowerShell 5.1, and updates Remote access copy for Android phones alongside localized accessible button labels. (#2941, #2938, #2901, #2899, #2900, #2940, #2939, #2904, #2887, #2898)
  中文
  - 输入框统一活跃停靠栏、波浪式额度卡片与一致的流式回复提示：将输入框顶部的控制条与对话末尾的后台运行提示合并为最多两层的统一活跃停靠栏与分组上拉面板，并将回合耗时移入回复悬浮操作栏；侧边栏与 上下文 弹窗中的套餐额度卡片焕新为四档语义色无缝波浪填充；统一流式回复指示器以消除卡片穿插时的闪烁，并统一加深打开 设置 时的背景遮罩。(#2959, #2951, #2937, #2945, #2923, #2913, #2908，感谢 @xiaolfeng)
  - 移动端五态实时活动推送、快捷选项、通知元信息与投递耗时诊断：扩展桌面端与 daemon 的实时活动推送，覆盖等待操作、出错、运行中、额度用尽与刚完成五种状态；在等待态实时活动卡片上附带最多 3 项快捷选项（关闭锁屏详情时自动脱敏剥离）；为通知补充智能体与改动文件数元信息并支持可选的套餐额度提醒；在本地诊断日志中按设备记录响应、实时更新与推送的投递耗时。(#2935, #2952, #2957, #2950, #2772)
  - Mermaid 渲染缓存、切换会话保留阅读位置与 PDF 预览输入流畅化：缓存已渲染的 Mermaid SVG 图表并延迟未缓存图表排版，消除切回含复杂图表会话时的卡顿；普通切换会话时独立恢复各自阅读位置且不再闪跳底部；修补 PDF 预览组件，解决侧边栏打开 PDF 时在输入框快速打字卡顿的问题。(#2925, #2911, #2920, #2912, #2915, #2906，感谢 @jintongxu, @hsjgsjs)
  - Antigravity 后台监控与定时任务适配、步骤进度同步与完全访问配置稳定性：识别 Antigravity 的监控命令、单次定时器与周期定时任务并在状态栏和看板中展示实时进度，将 update_steps 映射至顶栏计划进度条，改进后台等待态判定以避免会话看似卡死；串行化单会话配置更新，防止切换完全访问模式重启时将已选思考强度回滚为旧值。(#2947, #2933, #2944, #2930，感谢 @xiaolfeng, @akatsukiro)
  - Codex 配置警告来源标注与处理指引：为 Codex 配置警告明确区分已弃用仍生效、已移除被忽略与配置无效回退默认三种影响级别，展示配置层级与文件行号位置，并提供一键查看或打开配置文件及跳转官方配置文档的入口。(#2914, #2907，感谢 @xiaoyou222)
  - 回复内本地文件默认应用打开、侧边栏复制会话 ID 与输入框交互打磨：支持通过 Cmd+左键（macOS）/ Ctrl+左键（Windows/Linux）或右键 使用默认应用打开 启动会话回复里的本地普通文件（安全拦截目录与可执行脚本）；在侧边栏会话菜单新增 复制会话 ID；输入框首行按上方向键先移至行首再翻阅历史；采纳 Tab 下一句建议并发送后立即清除残留占位提示。(#2905, #2865, #2924, #2919, #2948, #2921, #2909, #2903，感谢 @Yezh1i, @sunCloud998, @Az0809)
  - 浏览器接管关闭清理、跨会话最终回复保留与看板子会话展示：关闭智能体标签页或浏览器侧栏时立即结束接管并通知等待中的智能体，点击外部区域即可收起占用提示气泡；优化跨会话历史裁剪以优先保留最终回复，为 get_session 补充最新回合范围限定与长回复分页读取；右侧会话看板纳入子会话任务并在完全为空时隐藏多余头部。(#2942, #2927, #2946, #2931, #2928, #2917, #2918，感谢 @xiaolfeng, @xiaoyou222)
  - 修复归档项目白屏崩溃、MCP 还原与 Devin Desktop 支持、Windows PowerShell 7 识别及多语言完善：修复归档项目时触发的界面白屏崩溃并妥善清理分屏与新建草稿；在 市场 › MCP › 终端和应用 中将服务器移出某智能体或应用时自动还原原有配置条目（含密钥），并新增 Devin Desktop 支持；修复 Windows 下未能识别 Microsoft Store 安装的 PowerShell 7（pwsh.exe）而回退到 PowerShell 5.1 的问题；更新 远程访问 文案以涵盖 Android 手机，并补齐中文界面残留按钮的无障碍标签。(#2941, #2938, #2901, #2899, #2900, #2940, #2939, #2904, #2887, #2898)
