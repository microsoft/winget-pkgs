ReleaseNotes: |-
  Introduces Kettu Bots with a pure plugin-based external channel runtime, adds relay node speed ranking and manual node selection across host, desktop, and hosted web clients, restores a collapsible MCP servers section in the Context popover, and polishes hover card motion and outputs prefetching.
  What changed
  - Kettu Bots and plugin-based external channels: adds the Bots workbench, @bot mention chips, Markdown-rendered ROLE.md and Bot memory, Routine assignment, cross-computer dispatch, and a sandboxed plugin channel runtime (ws, network.custom, url settings, bots.bridge, kettu.connector) with dynamic channel cards and custom scope editing. (#3091)
  - Relay node speed ranking and manual selection: ranks official and self-hosted relay regions by measured latency on the host, desktop client, and hosted web client, and lets you manually pick a relay node with immediate switching while keeping direct LAN routes first. (#3078, #3088, #3026, #3049, thanks @Ariember, @songxff)
  - Context popover layout and collapsible MCP servers: fixes Context popover overflow and bottom-row clipping, hides the plan limits header when empty, and restores the per-session MCP servers section collapsed by default with attention dots and bounded scrolling. (#3069, #3080, #3064)
  - Hover card motion, portal tokens, and outputs prefetch: switches hover cards to native interruptible enter/exit transitions, fixes portal CSS tokens for artifact tiles in light and dark themes, and prefetches session outputs on pointer enter to avoid first-hover height jumps. (#3068, #3065)
  中文
  - Kettu Bots 与纯插件化外部渠道：新增 Bots 工作台、@bot 提及标签、默认 Markdown 渲染的 ROLE.md 与 Bot 记忆、定时任务分配、跨电脑任务派发，以及纯插件化渠道运行时（支持 ws、network.custom、url 设置项、bots.bridge 与 kettu.connector），并在 Bot 抽屉中动态渲染渠道卡片与自定义作用范围编辑。(#3091)
  - 中继节点测速排序与手动选择：主机、桌面客户端与托管网页端均支持按实测延迟为官方与自建中继节点排序，并可手动指定中继节点立即切换，同时始终优先局域网直连。(#3078, #3088, #3026, #3049，感谢 @Ariember, @songxff)
  - 上下文浮层布局修复与可折叠 MCP 服务器列表：修复上下文浮层内容溢出与底部行裁切问题，无套餐限额时隐藏空标题，并恢复默认折叠的会话级 MCP 服务器 区域（带异常提示点与限高滚动）。(#3069, #3080, #3064)
  - 悬浮卡片动效、浮层样式令牌与产物预加载：改用原生可打断的进出过渡动画，修复亮/暗色主题下浮层产物卡片的 CSS 变量，并在鼠标悬停时预加载会话产物以避免首次展开时的高度跳动。(#3068, #3065)
