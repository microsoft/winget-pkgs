ReleaseNotes: |-
  - Kettu 优先运行你自己安装且兼容的智能体程序，会跳过 PATH 上不可用的版本。设置里可以看到当前运行的是哪一份。
  - 安装窗口会显示来源、版本、安装位置、运行要求，以及能查到的包大小。智能体无法运行时会提示原因和处理方法。更新你自己安装的程序前会展示命令供确认，并改进了 Homebrew、WinGet 和带标签的 npm 安装支持。
  - macOS 灵动岛空闲时收回刘海，悬停或点击可展开。展开后可看到正在工作的子智能体，侧栏悬停时也会保留子智能体徽标。
  - Antigravity 的工具列表达到上限时，仍可通过统一入口调用已授权的 Kettu 工具。
  - 浏览器、终端、设备和电脑面板的控制条可以拖动，各自记住位置。修复通知遮挡网页和输入框菜单的问题，并为评论标记应用独立配色。
  - 智能体、Git、远程主机和后台服务的更多错误提示会随界面语言显示。
