ReleaseNotes: |-
  Google Antigravity signs in again on its own, plugins get their own icons and one page, and the Usage page is laid out as a grid.
  What changed
  - Google Antigravity no longer asks to sign in while agy is signed in: when agy refuses sessions because of a sign-in method it saved earlier, Kettu signs it in with the Google sign-in agy already holds, without opening a browser, and New session and the plan limits come back at once. Grok's weekly usage shows again. (#2601, #2629)
  - Each plugin shows its own icon: Marketplace rows, listing pages and installed plugins take the icon a plugin's version carries, before install too. (#2610)
  - A plugin's Marketplace page is its only home: once installed, the page shows its state, settings, notices, views, where it shows up and what its script may do, and installing lands there with what is missing marked; Settings › Plugins is gone, and plugin settings are found in Search. (#2608)
  - Usage page as one grid: plan limit cards show the time passed on each ring and when a window runs out ahead of its reset, with a card of upcoming resets, figures compared with the period before, a cost column and a token type tab in the breakdown, and a footnote on prices and sources. (#2621)
  - See when a Claude Code sign-in ends: the Agent page shows the date, and from six days before it the sidebar offers Sign in again and the agent menu tags the agent. (#2604)
  - Preview HTML files: a reply's file link, the file tab, the file tree and a turn's changes offer Preview, which opens the page in a browser tab of the side panel. (#2587)
  - The Files pane follows changes on disk: files created, edited or deleted outside Kettu show within about a second, in folders outside git too. (#2593)
  - Repository helper commands wait for your answer: a folder's own Claude Code helper commands, such as apiKeyHelper, wait on the same card as its hooks before they run. (#2602)
  - Check for updates while one waits to install: Settings › About can check again, so a newer release replaces the waiting one. (#2583)
  - Other drives on a Windows computer: the folder dialog for a Windows host lists its drives under This PC. (#2584)
  - Other fixes: the Context card counts MCP tools after a restart (#2594), slow pings no longer recheck every connection path every few seconds (#2589), and the browser's overlays follow the page as it moves (#2579).
