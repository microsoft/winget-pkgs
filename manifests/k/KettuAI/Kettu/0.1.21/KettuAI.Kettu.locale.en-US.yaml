ReleaseNotes: |-
  Next-message suggestions for every agent, conversation export, side by side diffs, ignored files in Files, live artifacts in the browser, and many fixes.
  What changed
  - Next message for every agent: after a turn, the empty composer suggests what you might say next for every agent, not only Claude Code; Tab fills it in. (#2533)
  - Export conversation: Export conversation… in a session's menu saves it as Markdown. (#2531)
  - Side by side diffs: a diff tab switches between Unified and Side by side, remembered on this device; diffs in the thread follow it when they are wide enough. (#2527)
  - Ignored files in Files: gitignored files and folders show dimmed in the tree, ignored folders start folded and are read when you open them, and Show ignored files hides them. (#2547)
  - Turn endings while Kettu is in front: when a turn ends, fails or waits for you in a session that is not on screen, a toast with Open tells you. (#2541)
  - Live artifacts in the browser: on app.kettu.sh and a self-hosted relay's web client, artifacts open live as on the desktop, with comments, editing, tweaks and presenting. (#2526)
  - Google Antigravity: add more Antigravity agents, each signed in to its own Google account (#2543); each request's speed and usage, and the Requests pane (#2478); Kettu's read-only tools no longer ask in Auto (#2485); a waiting switch to Full access shows, and stuck sessions recover (#2481).
  - Cline: /compact in Cline sessions. (#2534)
  - Plan limits: grouped by model in cards in the Context popover and the account card. (#2483, #2520)
  - Settings: Settings › About lists ways to contact us (#2501); the relay is one row of choices in Settings › Remote access (#2477).
  - Session top bar: the More tools menu is gone; Leave session moves to the title's menu. (#2479)
  - Web client: the "This page is not protected on the network" notice can be dismissed. (#2536)
  - Fixes: a plugin whose skill name is taken installs without that skill (#2532), and turning plugins off and on keeps what they add (#2500, #2502); agent archive downloads use your proxy (#2535); token counts include every model call of a turn for Goose and agents that report usage in pieces (#2538, #2503); simulators and emulators boot and clean up reliably (#2507, #2512, #2514, #2516); sidebar badges stay visible on hover and only one hover card shows (#2545); a long path no longer pushes Open out of another computer's folder dialog, and Mod+Enter opens (#2546); menus stay clear of the window's top bar (#2489); Markdown previews show relative images (#2490); reply tables size their columns by content (#2493); menus and dialogs show over a browser page (#2494); typing next to list and heading marks in documents (#2499); GitHub CLI found after the environment is read (#2505); Continue after a plan limit resets is kept per computer (#2504); Claude Code has the memory tools from the start (#2523).
