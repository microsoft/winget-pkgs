ReleaseNotes: |-
  Overview
  Keeper 18.6.0 (Web Vault & Desktop Electron) was a security-driven release with broad fixes across both platforms, covering critical vulnerability patches, password strength improvements, KeeperDrive/NSF enforcement fixes, PAM/Discovery enhancements, and a significant tech debt push. Both clients also saw substantial tech debt modernization with React upgraded to v19, Redux Toolkit introduced, and legacy dependencies including Bluebird and Moment.js replaced.4

  Key highlights:

  - Critical stored XSS patches across both platforms (Notification Center, Delete from Shared Folder dialog)

  - zxcvbn password strength scoring fully shipped across the Vault

  - Hardware security key support (FIDO/YubiKey) for 1FA, 2FA, and RBI sessions

  - Desktop: --ignore-certificate-errors removed; scoped certificate validation implemented

  - Desktop: YubiKey authentication reliability fixed across Windows, idle, and SSO scenarios

  - NSF sharing enforcement and sync bugs resolved

  - PAM/Discovery: NASCAR custom fields, session countdown timer, session recording deep links

  - React v19, Redux Toolkit, Moment.js → Day.js, Bluebird removed across both clients

  Connection Expiration Countdown Timer
  Users can now see a real-time countdown timer when an active PAM connection is approaching its access limit, giving them time to save their work and wrap up gracefully before the session ends.

  How it works:

  When a connection has 60 seconds or less remaining, two banners appear simultaneously:

  - Record Detail Banner — A warning banner appears directly on the record with a visual progress bar, showing the exact time remaining before access expires. This gives users immediate visibility from within the vault without needing to switch to the active connection window.

  - Connection Window Banner — A dismissible countdown banner also appears at the top of the active connection window itself. This banner can be minimized so it doesn't interfere with the working area, while still keeping the user informed that their session is about to end.

  Together, these notifications ensure users are never caught off guard by an unexpected session termination, reducing the risk of lost work and improving the overall experience for time-limited privileged access sessions.

