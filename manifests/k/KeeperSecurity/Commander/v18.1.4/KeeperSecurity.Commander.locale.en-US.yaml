ReleaseNotes: |-
  Commander 18.1.4
  Highlights
  - Improved CyberArk classic imports with richer account metadata retention and more resilient password-retrieval skip handling.
  - Added PAM service-management support for COM, DCOM, COM+, and SCOM.
  - Improved Nested Shared Folder (NSF) support across PAM workflows and eligible shared-folder discovery.
  Enhancements
  - list-sf --roe-eligible now includes eligible Nested Shared Folders and identifies each result as Classic or Nested.
  - CyberArk imports support selectively skipping team, role, or user processing with --skip.
  - PAM service listings now correctly render individual service entries in text output.
  - Service Mode treats first-time share invitations as successful, improving automation reliability.
  Fixes
  - Fixed NSF-backed PAM records reverting fields after pam tunnel edit, pam connection edit, and related updates.
  - Fixed NSF record loading in ls.
  - Fixed duplicate Active Directory binding during SCIM operations.
  Security and compatibility
  - Service Mode now blocks access to host filesystem paths, including local-file import/export and path-based command arguments.
  - SailPoint integration is now restricted to documented capabilities. enterprise-role / er, record ownership transfers, and certain enterprise-
    user operations are no longer permitted through SailPoint Service Mode integrations.
  Full Changelog: v18.1.3...v18.1.4
