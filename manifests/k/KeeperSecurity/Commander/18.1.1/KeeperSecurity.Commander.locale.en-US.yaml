ReleaseNotes: |-
  Commander 18.1.1 Release Notes

  Released: 2026-08-14

  New Features

  NSF Import Support — The import command now supports Nested Share Folder (NSF) records and folders, including permissions. 

  Improvements

  PAM tunnel diagnose — Fixed four diagnostic accuracy issues: GOV region server targeting for port-443 tests, region display for non-US servers, WebSocket tests now correctly fail on HTTP 4xx/5xx responses, and WebRTC sample color coding.
  Team name validation — Added validation when resolving team names during key fetching to prevent ambiguous UID-shaped strings from being misclassified as teams.
  API timeout — Default response timeout increased from 120 s to 300 s to align with backend timeouts.
  Correct Azure import library name — Fixed incorrect library reference for Azure imports.
  EPM SCIM user/group IDs — SCIM user and group output now includes the Id field.
  JSON output for additional commands — --format json is now supported for PAM list and info commands, and for record-history --action view. 
  Service command accepts service names — The service command can now be referenced by service name in addition to UID.

  Bug Fixes

  PAM RBI edit in NSF — Fixed pam rbi edit so that NSF RBI settings are correctly persisted via update_pam_record. 
  PAM workflow policy enforcement — PAM workflow admin commands are now blocked after the workflow-settings policy is revoked.
  Docker one-shot commands — Fixed Docker containers hanging indefinitely after executing one-shot commands; the container now exits with the wrapped command's status unless running in service mode or with KEEPER_KEEP_ALIVE set.
  Docker service setup ownership — Ownership is now required before Commander adopts existing Docker setup folders and KSM apps to prevent unintended takeover.

