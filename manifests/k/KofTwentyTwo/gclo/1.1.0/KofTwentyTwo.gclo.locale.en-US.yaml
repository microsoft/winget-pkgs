ShortDescription: Clone or update every repository of a GitHub organization in one pass.
Description: |-
  gclo (Git Clone Large Organizations) is a Windows 11 desktop app that mirrors every repository of a GitHub organization or user account into a local folder in one pass: it clones the repositories that are missing and fast-forwards the ones that already exist, with bounded parallelism and per-repository failure isolation. Personal access tokens are kept in Windows Credential Manager. The app updates itself from GitHub Releases.
