ShortDescription: Ultra-lightweight drag-and-drop shelf for Windows (Dropover / Yoink alternative) built with Rust & Tauri v2.
Description: |-
  StashIt is an ultra-lightweight, native drag-and-drop shelf for Windows 10 & 11 and part of the Kobalt Tools desktop ecosystem.
  It acts as a temporary holding shelf for files, images, URLs, and text snippets while you navigate between folders and workspaces. When idle, the app is 100% invisible.
  Summon the shelf right next to your mouse pointer via mouse shake while dragging (Shake), global hotkeys, double-tapping modifier keys, or edge docking drawer mode.
