ReleaseNotes: |-
  功能
  - 思考强度（thinking level）成为可选的统一概念：各提供商自己的字段——Anthropic 的 effort、Gemini 的 thinkingLevel（2.5 回落到 budget）、Ollama 的 think、把档位写进模型名的网关——统一在一处翻译成线上协议
  - 模型选择器旁边新增思考档位快速切换：显示当前生效的档位与"由谁决定"（本会话 / 本模型默认 / 提供商），Alt+D 沿档位阶梯步进；思考的布尔开关废弃
  - 每个模型都有可选档位，并且可以显式选择"不发送思考参数"，档位控件不再对未验证的模型整体失效
  - 回答完成后会说明这次思考花了什么：实际发出的档位、承载它的字段、端点报告的 reasoning token 数与耗时；端点没上报就写"未上报用量"，不编数字
  - 自建 / 自托管端点不再强制要求 API Key：新建提供商时按目录判定是否需要凭据，留空就按无密钥对待
  修复
  - 收起会话列表后，输入框撞到宽度上限就不再居中、贴靠左边缘；内缩改用 padding，宽度上限与消息列保持一致
  - 消息与输入框统一为同一个宽度上限，输入框跟着窗口一起变宽；思考档位菜单改为朴素样式，弹层不再透光
  - 命令行与外部工具调用在工具卡片那一行的预览改成可读的一句话，超长由所在行截断，不再显示截半的转义串
  - Gemini 的提供商行从未被匹配上，导致参数对话框把真实可选项藏了起来
  - 会话参数缺少停止序列时不再让每次发送都失败；参数在存储边界处清洗，而不是被直接信任
  - 回答里的"思考"行保留，去掉与之重复的聚合视图
  - macOS 上还有一条窗口事件路径会重入 Tauri 事件循环，导致 CPU 占满、初始化永远完不成
  - Agent 执行 shell 命令时按真正运行它的机器来规划，Linux / macOS 不再套用 Windows 的 shell 规则
  - 提示词预算按文本实际使用的语言估算长度，英文请求不再套用中文的除数
