ReleaseNotes: |-
  修复
  - 修复 0.7.0 启动后卡在"正在初始化模型服务"、窗口无法拖动、鼠标显示繁忙图标的问题。原因是 0.7.0 新增的窗口圆角逻辑在窗口事件回调里调用了 Tauri 的窗口查询接口，等于在事件循环内部再向事件循环投递消息并等待返回，形成持续的消息循环把主线程占满（进程 100% CPU），前端初始化因此永远无法完成。现在改为直接向 AppKit 查询窗口是否最大化/全屏，不再回调 Tauri。
