ShortDescription: 开源、轻量级、现代化。本地 AI 对话客户端，支持多提供商与本地模型。
Description: Chatless 是一个基于 Tauri 和 Next.js 构建的 AI 聊天桌面应用。支持多种 AI 提供商，可连接 Ollama 本地模型，支持文档解析和知识库功能。所有数据本地存储，保护用户隐私。应用轻量简洁、启动快速、资源占用少。
