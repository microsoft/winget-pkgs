ShortDescription: Free, open-source partition manager that shrinks, extends, creates and formats partitions safely.
Description: |-
  Windows Partition Manager shrinks, extends, creates, formats and deletes partitions, and explains why Windows refuses to shrink a volume by naming the files in the way.
  It plans several changes on paper before anything is written, analyses what uses the space on a drive, reads disk health (SMART), checks and optimizes volumes, and works with USB drives and VHD/VHDX virtual disks.
  Every change goes through the Windows Storage Management API; the program never writes raw sectors. Includes the wpm command-line tool.
