PackageIdentifier: kdlbs.KanDev
PackageVersion: 0.97.0
PackageLocale: zh-CN
ShortDescription: 用于编排多个编码智能体的 AI 看板与开发环境。
Description: |-
  Kandev 是一个用于编排多个编码智能体的 AI 看板与开发环境，支持审查智能体的变更并创建 PR。它可自托管，且无遥测。

  特性：
  - 多智能体支持 — Claude Code、Codex、GitHub Copilot、Gemini CLI、Amp、OpenCode、Cursor、Devin、Qwen、Kilocode、Pi、Kimi、AWS Kiro、Qoder、Trae、Grok、Antigravity 等。
  - 并行任务执行 — 同时启动和管理来自不同来源的多个任务。
  - 集成工作区 — 内置终端、带 LSP 的代码编辑器、Git 变更面板、嵌入式 VS Code 和聊天，汇聚在一个类 IDE 视图中。
  - 看板任务管理 — 拖拽式看板、列和工作流自动化。
  - 智能体工作流 — 每一步可混搭不同智能体的多步骤流水线，例如用一个智能体设计方案、另一个实现、第三个审查变更。
  - 自动化 — 按计划或 webhook 触发智能体任务，并可配置运行目标、上下文和并发。
  - 子任务 — 智能体可以派生从父任务会话恢复的子任务。
  - CLI 直通 — 进入原始智能体 CLI 模式，使用完整的原生 TUI。
  - 工作区隔离 — Git worktree 防止并发智能体相互冲突。
  - 多仓库任务 — 单个任务可跨越多个仓库，每个仓库有独立的 worktree、分支和 PR。
