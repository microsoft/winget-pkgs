ShortDescription: Drag a file, tap a key, pick from the ring. Convert, compress, trim and share files without opening an app.
Description: |-
  Poppy lives in the tray. Start dragging any file, tap Shift, Ctrl or Alt, and a ring opens under your cursor:
  Convert (PNG, WEBP, MP3, MP4, PDF, DOCX...), Tools (compress, trim, crop, rotate, merge, protect...) or
  Actions (share, shelf, copy, move, copy path, terminal). Drop the file on what you want.
