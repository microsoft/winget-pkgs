ShortDescription: Run coding agents in a sandbox, then review their changes like a pull request.
Description: |-
  Mudroom runs Claude Code, Codex, Gemini CLI, opencode, Aider or any command in a
  Linux container, on a copy of your project, with network access limited to the
  hosts you allow. Your real folder is never mounted. When the agent is done you
  read the diff, apply all of it, some files, some hunks or none, and undo any
  apply later. On Windows it needs Docker Desktop or Podman.
