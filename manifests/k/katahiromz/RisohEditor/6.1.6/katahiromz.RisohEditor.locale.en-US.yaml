ReleaseNotes: "• v.6.1.6 (2026-08-24)\r\n    • Minor UI/UX improvements.\r\n    • Added [Help] button to MConstantDlg.\r\n    • Fixed crash in MRadWindow::AlignSelection.\r\n    • Improved installer translation.\r\n    • Fixed EGA RES_delete crash.\r\n    • Fixed MEditAccelDlg bug (\"^A\" etc.). windres's ACCELERATORS bug on \"^A\" remains.\r\n    • Accelerated resource item handling.\r\n    • Fixed the incorrect display of the RISOHTEMPLATE resource name.\r\n    • Fixed RT_BITMAP importing, extracting, and saving.\r\n    • Don't quote resource names for MSVC compatibility.\r\n• v.6.1.6 (2026-08-24)\r\n    • UI/UXの軽微な改善。\r\n    • MConstantDlgに[ヘルプ]ボタンを追加。\r\n    • MRadWindow::AlignSelection で発生していたクラッシュを修正。\r\n    • インストーラーの翻訳を改善。\r\n    • EGA RES_deleteでのクラッシュを修正。\r\n    • MEditAccelDlgのバグ（「^A」など）を修正。windresの「^A」に関するACCELERATORSのバグは残ったまま。\r\n    • リソースアイテムの処理を高速化。\r\n    • RISOHTEMPLATEのリソース名の表示が間違っていたのを修正。\r\n    • RT_BITMAPのインポート、抽出、保存を修正。\r\n    • MSVCとの互換性を確保するため、リソース名を引用符で囲まないでください。"
