ShortDescription: Another free Win32 resource editor
Description: |-
  "RisohEditor" is a free resource editor for Win32 development, created by Katayama Hirofumi MZ.
  RisohEditor realized the ideal of resource editor. "Risoh" means "ideal" in Japanese.
  RisohEditor can add, edit, extract, clone and remove the resource data in EXE/DLL/RC/RES files.
  You can edit Windows resources (Dialogs, Menus, Icons, Cursors, String Tables, Message Tables etc.) by using RisohEditor.
