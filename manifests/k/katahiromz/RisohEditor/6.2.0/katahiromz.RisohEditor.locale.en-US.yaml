ReleaseNotes: "• v.6.2.0 (2026-09-10)\r\n    • Supported resource type \"TEXTFILE\".\r\n    • Supported \"UTF-16 (with BOM)\" and \"UTF-16 (without BOM)\" encodings.\r\n    • Supported adding \"XML\", \"XSLT\", \"SCHEMA\", \"REGINST\", and \"REGISTRY\" resource types.\r\n    • Supported resource types \"COLORNAMES\", \"FILERESNAMES\", \"ORIGFILENAMES\", and \"SIZENAMES\".\r\n    • Supported \"MultiSz\" and \"WORDs\" encodings.\r\n    • Deleted \"Use Microsoft MESSAGETABLE\" setting.\r\n    • Supported \"msstyles\" files.\r\n    • Supported importing RC files of Unicode path.\r\n    • Fixed MPathsDlg.\r\n    • Improved translation.\r\n    • Fixed the hourglass cursor.\r\n    • Fixed abnormal termination on ICON/BITMAP/STATIC controls.\r\n• v.6.2.0 (2026-09-10)\r\n    • リソース型「TEXTFILE」に対応。\r\n    • 「UTF-16 (BOMあり)」および「UTF-16 (BOMなし)」のエンコーディングに対応。\r\n    • 「XML」「XSLT」「SCHEMA」「REGINST」「REGISTRY」リソース型の追加に対応。\r\n    • リソース型「COLORNAMES」「FILERESNAMES」「ORIGFILENAMES」「SIZENAMES」をサポート。\r\n    • 「MultiSz」「WORDs」エンコーディングをサポート。\r\n    • 「Microsoft MESSAGETABLEを使用する」設定を削除。\r\n    • 「msstyles」ファイルに対応。\r\n    • Unicodeパスを持つRCファイルのインポートに対応。\r\n    • MPathsDlgを修正。\r\n    • 翻訳を改善。\r\n    • 砂時計カーソルを修正。\r\n    • ICON/BITMAP/STATICコントロールでの異常終了を修正。"
