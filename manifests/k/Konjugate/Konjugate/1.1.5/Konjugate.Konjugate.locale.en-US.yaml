ShortDescription: A graph-native simulation engine for building composable engineering simulations and digital twins.
Description: |
  An open-source graph-native simulation engine for building composable engineering simulations and digital twins. The objective is to simplify the process of modelling complex physical systems by representing them as networks of interconnected components, where components define states and interactions define the transport of quantities.

  Rather than requiring users to manually assemble large system-level formulations, this project explores an approach where systems are represented as graphs of interconnected components. Components define their states and properties, while relationships define the equations governing how quantities are transported and transformed.
