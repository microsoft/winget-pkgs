ShortDescription: Recover passwords for ZIP, RAR, 7-Zip, Office documents and PDF files.
Description: 'Krylack Password Recovery Suite recovers lost passwords across every kind of file it supports, in one Windows application. It covers ZIP, RAR and 7-Zip archives, Microsoft Office documents (Word, Excel, PowerPoint and Access) and PDF files, so it is the right choice when you deal with more than one kind of file, or simply want everything covered by a single license. Archives include ZIP (legacy ZipCrypto and modern WinZip AES), RAR (RAR3 and RAR5) and 7-Zip (AES-256). Office covers every version, from the fast legacy formats to the slow agile AES-256 in 2013 and newer. For PDF, the Suite recovers a forgotten open password and can instantly remove owner or permissions restrictions. Each format behaves as it does in its dedicated edition: older schemes are fast, while modern AES-based formats are slow to search by design, so strong passwords take longer and a GPU helps. It always tries the most likely candidates first, so short and human-chosen passwords are very recoverable; a long, truly random password on a modern format is the hard case that no recovery tool can promise to solve, met with GPU acceleration and the Smart and dictionary methods. Dictionary, Smart (mask and pattern) and brute-force methods are available for every format. It runs entirely on your own PC, so your files never leave your computer. It is for files you own or are authorized to open. A one-time purchase includes a perpetual license and free updates within the edition.'
