ShortDescription: Windowsのキー入力に合わせて、14種類の打鍵音を再生
Description: >-
  Klakkは、Windowsの普段のアプリでキー入力に合わせて、録音された打鍵音を再生します。
  同梱の14音源パックから音を選び、音量と出力先を調整できます。
  スピーカーやヘッドホンへ音を追加するもので、実物のキーボードの物理音や押し心地は変えません。
  14音源は https://tryklakk.com/ja/keyboard-sounds/ でインストール前に試聴できます。
  ブラウザー試聴はそのページ内の再生です。普段のアプリではデスクトップ版を試してください。
  初回起動から3日間、同梱の14音源を試せます。
  継続利用はWindows版US$4.49の一回払いと適用税です。定期購読はありません。
  公式サイトMac版とMac App Store版は、それぞれ別のライセンスです。
  対象はWindows 10/11のネイティブx64・ARM64版、バージョン1.4.1、内部リビジョン2026-10-11.1です。
  入力した文章や生のキー操作は送信しません。利用分析、ライセンス確認、更新確認には通信があります。
  開発者はLevinです。この日本語説明はAIを執筆・編集補助に使って作成しました。
ReleaseNotesUrl: https://github.com/levindong2026/klakk-downloads/releases/tag/v1.4.1-r20261011.1
