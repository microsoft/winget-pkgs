ReleaseNotes: |-
  アプリ内の操作・状態表示と、12形式のファイルアイコンを共通デザインに統一しました。ダークモードと、動きを減らす設定にも対応しています。
  書庫の検査で、処理が正常終了していても警告がある場合は、その警告を表示するようにしました。
  自動処理の実行中にアプリを閉じるとき、処理の停止を待って終了するようにしました。通常操作や右クリックの操作画面が開いている場合の案内も改善しました。
  パスワード入力と圧縮設定のダイアログで、Tab キーの移動が背景へ抜ける問題を修正しました。
  ZIP ではソリッド圧縮を使えない理由を表示するようにしました。7z に戻すと、それまでの設定を保持します。
  言語を切り替えたとき、表示済みの処理結果も現在の言語へ切り替わるようにしました。
