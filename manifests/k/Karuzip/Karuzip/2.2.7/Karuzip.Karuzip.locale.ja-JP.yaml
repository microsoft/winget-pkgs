ReleaseNotes: |-
  インターネットから取得した書庫を解凍すると、取り出したファイルにも「インターネットから取得した」印を付けるようにしました。保存先が印に対応していない場合は警告付きで完了します。
  パスワード付き ZIP を AES-256 で作成するようにしました。Windows 標準の展開機能では開けない場合があるため、圧縮画面に注意を表示します。
  8.3 形式の短い名前が既存の別の項目を指す場合、上書きせず、別の名前か、その名前が指すフォルダーの中へ保存するようにしました。
  ARC・SIT・ZOO などの古い形式で、日本語などの名前を含む書庫を一覧できない場合がある問題を修正しました。
  既存のフォルダーへ解凍するとき、解凍先のパスが長いと失敗する問題を修正しました。
  解凍後の確認に失敗したときの結果表示と、古い形式の処理でのメモリ使用量を改善しました。
