ShortDescription: Lightweight, ad-free file archiver for Windows with a Japanese user interface.
Description: |-
  Karuzip is a free, lightweight file archiver for Windows. The user interface is Japanese only. There are no ads, no bundled software and no data collection.

  - Extracts 320 file extensions (230 verified by automated tests, 12 verified with real-world files)
  - Creates ZIP, 7z, tar and gz archives (RAR creation is not offered, per the unRAR license)
  - Handles Japanese filename encodings correctly, with manual override (auto / UTF-8 / CP932 / GBK / Big5)
  - Extracts and creates password-protected archives (7z also encrypts filenames)
  - Extracts and creates multi-volume archives (.zip.001 / .part1.rar and similar)
  - Extract and compress directly from the Explorer context menu
  - File-count progress for large archives, plus selective extraction
  - Lists, searches and tests archive contents without extracting

  Karuzip bundles 7-Zip 25.01 and unar 1.8.1 unmodified as its engines.
