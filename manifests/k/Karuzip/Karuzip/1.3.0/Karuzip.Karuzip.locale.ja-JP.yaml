ShortDescription: 軽い・安心・広告なしの解凍/圧縮ソフト。ZIP・7z・RAR などをドラッグ＆ドロップや右クリックでかんたんに解凍できます。
Description: |-
  Karuzip（かるジップ）は、日本語環境向けの軽量な無料の解凍/圧縮ソフトです。広告・バンドルソフト・情報収集は一切ありません。

  - 解凍は 320 種類の拡張子に対応（うち動作検証済み 230 種類、実機ファイル検証済み 12 種類）
  - 圧縮は ZIP・7z・tar・gz ほかに対応（unRAR ライセンスにより RAR の作成は行いません）
  - 日本語ファイル名の文字化けに対応。文字コードの手動切り替えも可能（自動 / UTF-8 / CP932 / GBK / Big5）
  - パスワード付き書庫の解凍と作成（7z はファイル名も暗号化）
  - 分割書庫（.zip.001 / .part1.rar など）の解凍と作成
  - エクスプローラーの右クリックメニューから直接解凍・圧縮
  - 大きな書庫でも件数つきの進捗表示、必要なファイルだけを選んで解凍
  - 書庫の中身を解凍せずに一覧・検索、破損チェック

  解凍・圧縮エンジンとして 7-Zip 25.01 と unar 1.8.1 を改変せず同梱しています。
