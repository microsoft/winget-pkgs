ShortDescription: 文字化けした ZIP も、右クリックですぐ解凍。320 拡張子に対応する、広告なし・無料の解凍／圧縮ソフトです。
Description: |-
  Karuzip（かるジップ）は、日本語環境で迷わず使える無料の解凍・圧縮ソフトです。広告、バンドルソフト、アカウント登録、利用状況の収集はありません。

  - 解凍は 320 拡張子に対応（うち動作検証済み 230、実機検証済み 12）
  - 文字化けした ZIP は、解凍前に UTF-8 / CP932 / GBK / Big5 / EUC-KR へ切り替えてファイル名を確認
  - 書庫内の実画像サムネイル表示とスペースキー Quick Peek プレビューに対応
  - 右クリックメニューに「ここに解凍」「フォルダーに解凍」「中身を見る」と圧縮 3 項目（書庫だけを選んだときは圧縮項目を出しません）
  - 「名前.zip」「名前.7z」への即時圧縮、2ステップのフォルダー圧縮、同名時の連番保存
  - ZIP / 7z / TAR / GZIP / BZIP2 / XZ / WIM の作成に対応（RAR は解凍のみ対応）
  - パスワード付き ZIP / 7z の作成（12文字の安全なパスワード自動生成・案内文コピー対応）と解凍。入力したパスワードは保存しません
  - 端末内で完結する画像リサイズ・証明写真プリセット・PDF 軽量化／結合／分割ワークベンチを搭載
  - キャンセルや失敗時は、新しく作った途中出力だけを後始末
  - 表示言語は日本語・英語・韓国語を設定から切り替え可能（ライト／ダーク／システム連動テーマ対応）

  処理は端末内で完結します。解凍・圧縮エンジンとして 7-Zip 25.01 と unar 1.8.1 を改変せず同梱しています。
