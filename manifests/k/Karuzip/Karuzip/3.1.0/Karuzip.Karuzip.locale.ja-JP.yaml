ReleaseNotes: |-
  - 「澄・間（Sumi-Ma）」デザインへ刷新し、ダークモード「澄・夜」（ライト／ダーク／システム連動）を追加しました。
  - 書庫内の実画像サムネイル表示、スペースキーによる Quick Peek プレビュー、Mac 由来 __MACOSX の自動非表示、暗号化アーカイブ作成時の丁寧な案内文コピーに対応しました。
  - ホーム画面への PDF／画像ドロップから「画像とPDF」ワークベンチへ直通するスマート動線、出力先の自動設定とワンクリック保存、履歴書・パスポート等の証明写真プリセットを追加しました。
  - 2ステップで完了するフォルダー圧縮と、12文字の安全なパスワード自動生成を追加しました。
  - 実用 PDF 軽量化の互換性（ICCBased RGB・Predictor 対応）と一括処理時の出力先フォルダー自動準備を改善しました。
