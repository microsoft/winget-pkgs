ReleaseNotes: |-
  - Refreshed the interface with the calm Sumi-Ma visual design and added the Sumi-Yoru dark mode (Light, Dark, or System sync).
  - Archive browser upgrades: live image thumbnails inside archives, Spacebar Quick Peek preview before extracting, automatic hiding of macOS __MACOSX clutter, and one-click polite password-notice copy after creating encrypted archives.
  - Streamlined 3-step workflows: smart drag-and-drop routing from Home straight into the Images & PDF workbench, automatic output path setup with one-click save, ID photo resize presets, 2-step folder compression, and a built-in 12-character secure password generator.
  - Improved real-world PDF compression compatibility (ICCBased RGB and Predictor streams) and automatic batch output folder preparation.
