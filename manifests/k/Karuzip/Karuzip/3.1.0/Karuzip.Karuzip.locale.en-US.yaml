ShortDescription: A free, ad-free Windows archive and local PDF/image utility supporting 320 file extensions in Japanese, English, and Korean.
Description: |-
  Karuzip is a free archive and local media utility for Windows. It has no ads, bundled software, account requirement, or usage tracking.

  - Extracts 320 file extensions (230 verified by automated tests or samples, 12 verified on real Windows systems)
  - Switches filename encodings among UTF-8, CP932, GBK, Big5, and EUC-KR before extraction to fix garbled names
  - Previews live image thumbnails inside archives and supports Spacebar Quick Peek before extracting
  - Puts Extract here, Extract to folder, and View contents plus three compress actions in the Explorer right-click menu
  - Creates ZIP, 7z, TAR, GZIP, BZIP2, XZ, and WIM archives (extracts RAR archives without creating them)
  - Creates and extracts password-protected ZIP and 7z archives with a 12-character password generator and zero password persistence
  - Includes an offline Images & PDF workbench for image compression, ID photo presets, and PDF compression, merge, and split
  - Supports split archives (.zip.001, .7z.001, .part1.rar) and cleans up only newly created partial output after cancellation or failure
  - Full Japanese, English, and Korean interface with Sumi-Ma light and Sumi-Yoru dark themes

  Processing stays on the device. Karuzip bundles unmodified 7-Zip 25.01 and unar 1.8.1 binaries as archive engines.
