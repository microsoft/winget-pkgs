ShortDescription: Stateful replay of captured network sessions (Modbus, DNP3, MQTT, TLS) against live industrial devices.
Description: |-
  Livewire replays a recorded network exchange against a live device and reports whether the checked
  responses match the capture. It is built for reproducing field problems on SCADA and industrial
  equipment (Modbus, DNP3) and also handles HTTP/1, DNS, MQTT, FTP/FTPS, TLS, SSH, and plain TCP/UDP/ICMP.
  Stateful mode opens fresh sessions and adapts protocol state to the live responses; stateless mode
  resends raw frames. Pure Go, runs on Windows and Linux. Wire-mode capture on Windows needs Npcap,
  which this package does not install (see setup-windows.ps1 in the release).
