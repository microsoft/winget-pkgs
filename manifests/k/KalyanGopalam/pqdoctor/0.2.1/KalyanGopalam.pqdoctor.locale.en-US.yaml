ShortDescription: Why isn't this server post-quantum? Handshake-only TLS probes, the cause and the fix.
Description: pqdoctor checks whether a TLS, mail (STARTTLS) or SSH server negotiates post-quantum key exchange (X25519MLKEM768). When it doesn't, it works out why, from handshake-only probes, and prints the configuration change that fixes it for that server's software.
