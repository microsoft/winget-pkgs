ReleaseNotes: >-
  Beamer 1.5.4 fixes one bug in 1.5.3: the shortcut that moves you between machines could do nothing and leave your keyboard and mouse on the machine you were using. It changes nothing else. It uses the same wire version as Beamer 1.5.0 and pairs with earlier 1.5.x versions. Your pairings and settings stay as they are.
