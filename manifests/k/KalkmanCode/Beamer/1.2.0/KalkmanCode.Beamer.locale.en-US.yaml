ShortDescription: One keyboard and mouse for a Mac and a Windows PC over the local network, in either direction.
Description: |-
  Beamer lets one keyboard and pointing device drive a Mac and a Windows PC over the local network. Push the pointer off the shared edge and it carries on onto the other machine, or double-tap the trigger key to switch; the clipboard follows. Traffic stays on the LAN, encrypted and authenticated with a key derived from a shared token, and pairing is a six-digit code. Needs the Mac app on the other machine.
