ReleaseNotes: >-
  Beamer 1.5.2 adds a map of your paired machines with a ledger below it that says how each one is reached: the whole edge or chosen thirds of it, a corner, or none. It also adds per-machine sharing choices, and repairs pairings that the other machine has forgotten. It fixes typing from Linux, where no key press reached the other machine, and brings experimental KDE Plasma support, along with fixes for input recovery, shortcuts, crossing notices and special keys. It uses the same wire version as Beamer 1.5.0 and pairs with earlier 1.5.x versions. Your pairings and settings stay as they are.
