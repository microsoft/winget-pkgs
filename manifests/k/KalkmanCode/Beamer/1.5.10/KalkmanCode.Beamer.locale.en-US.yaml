ReleaseNotes: >-
  Beamer 1.5.10 adds a Windows portable package that needs no installer, keeps an explicitly chosen peer address through re-pairing and outages, stops fast mouse movement piling up behind a slower receiver, and gives clearer Windows firewall checks. It pairs with every 1.5 version, and your pairings and settings carry over.
