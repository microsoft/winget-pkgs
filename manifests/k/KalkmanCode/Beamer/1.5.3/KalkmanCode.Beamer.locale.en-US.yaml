ReleaseNotes: >-
  Beamer 1.5.3 hides the pointer on the machines you are not using, lets you take over a machine whose driver has gone idle, and lets each machine use several edges and corners, including edges that wrap round. Crossings now follow where screens actually touch, two machines nearby can pair by comparing six digits, and Linux gets a ready-made arm64 Flatpak. It uses the same wire version as Beamer 1.5.0 and pairs with earlier 1.5.x versions. Your pairings and settings stay as they are.
