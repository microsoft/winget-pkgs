ShortDescription: One keyboard and mouse for your Macs, Windows PCs and Linux machines over the local network.
Description: |-
  Beamer lets one keyboard and pointing device drive Macs, Windows PCs and Linux machines over the local network. Push the pointer off a shared edge and it carries on onto the next machine, or double-tap the trigger key to switch; the clipboard follows. Traffic stays on the LAN, encrypted and authenticated with a key derived from a shared token, and pairing is a six-digit code. Each machine runs Beamer.
