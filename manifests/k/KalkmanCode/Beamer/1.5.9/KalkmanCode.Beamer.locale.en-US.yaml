ReleaseNotes: >-
  Beamer 1.5.9 fixes a Windows startup failure with accented account names, cuts mouse lag that builds up on a slow receiver, makes clipboard sharing more reliable, improves accents from Windows to Linux, and adds Mouse only, Identify screens and an update notice. It pairs with every 1.5 version, and your pairings and settings carry over.
