# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Konvir.Konvir
PackageVersion: 0.10.0
MinimumOSVersion: 10.0.17763.0
InstallerType: exe
# Velopack installs under %LocalAppData%, so no elevation is asked for and none is needed.
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  # The same flag for both: --silent hides every dialog and also stops Konvir launching itself
  # when the install finishes, which is what an unattended install has to do.
  Silent: --silent
  SilentWithProgress: --silent
UpgradeBehavior: install
# What Konvir writes into Apps & Features. Without it winget cannot tell that a copy installed
# some other way is the same package, and `winget upgrade` would offer an install over it.
AppsAndFeaturesEntries:
  - DisplayName: Konvir
    DisplayVersion: 0.10.0
    Publisher: Konvir
ReleaseDate: 2026-10-23
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/KROWIEL/konvir/releases/download/v0.10.0/Konvir-win-Setup.exe
    InstallerSha256: 507F09269C8D6005FF07FC23875801703ADBFC8E61A6B4D487268416CD52D98B
ManifestType: installer
ManifestVersion: 1.12.0
