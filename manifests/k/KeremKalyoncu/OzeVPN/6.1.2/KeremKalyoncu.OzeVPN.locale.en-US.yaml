ShortDescription: Zero-dependency single-EXE Windows hybrid VPN powered by sing-box, native Cloudflare WARP WireGuard (TCP+UDP), and EU Tor.
Description: |-
  OzeVPN is a local, telemetry-free Windows desktop hybrid VPN packaged as a single standalone executable.
  It combines native Cloudflare WARP WireGuard (full Layer-3 TCP+UDP), EU Tor with Snowflake WebRTC bridges,
  smart split tunneling, opt-in LAN proxy sharing, live throughput telemetry, and a fail-closed Windows Firewall
  Kill Switch without accounts or external runtime dependencies.
