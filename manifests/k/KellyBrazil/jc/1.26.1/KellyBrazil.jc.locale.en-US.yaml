PackageIdentifier: KellyBrazil.jc
PackageVersion: 1.26.1
PackageLocale: en-US
Publisher: Kelly Brazil
PackageName: jc
License: MIT License
ShortDescription: CLI tool and python library that converts the output of popular command-line tools, file-types, and common strings to JSON, YAML, or Dictionaries. This allows piping of output to tools like jq and simplifying automation scripts.
ReleaseNotes: "• Add `apachectl` command parser\n• Add `ics` file parser\n• Add `conntrack` command parser\n• Add `nfsiostat` command parser\n• Add `nfsiostat-s` streaming command parser\n• Add `nftables` `nft` command parser\n• Fix `cksum` parser for lines with no filename\n• Fix `crontab` and `crontab_u` parsers to ignore whitespace-only lines\n• Fix `dpkg` parser for Unicode table header\n• Fix `fstab` parser to ignore whitespace-only lines\n• Fix `group` parser to ignore whitespace-only lines\n• Fix `gshadow` parser to ignore whitespace-only lines\n• Fix `ipconfig` parser to not warn for incompatibility on Windows\n• Fix `lsattr` parser to support e2fsprogs and support `x` and `m` flags\n• Fix `passwd` parser to ignore whitespace-only lines\n• Fix `plist` parser for deprecation warning for codecs.open()\n• Fix `shadow` parser to ignore whitespace-only lines\n• Binary builds for linux and macOS (x86_64 and ARM) now include the\n  python 3.14 runtime. Those executable files are now significantly smaller.\n  Windows builds still use python 3.10 runtime"
