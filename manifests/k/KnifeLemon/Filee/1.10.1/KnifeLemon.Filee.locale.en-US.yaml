ShortDescription: Free, open-source file converter. Hold a key, drag files and drop them on a format to convert them offline.
Description: |-
  Filee converts files on your own PC, without uploading them. Hold a key while dragging files and a donut-shaped menu of formats opens at the cursor; drop the files on one and the converted files are saved next to the originals. It also works from the File Explorer right-click menu, Send To and a keyboard shortcut.
  It covers 180 formats: images (including HEIC, PSD and camera RAW), PDF, Word, Excel and PowerPoint without Microsoft Office, Korean HWP/HWPX, e-books and comics, video and audio, archives, CAD drawings (DWG, DXF) and fonts. Large engines such as FFmpeg and LibreOffice are optional downloads.
