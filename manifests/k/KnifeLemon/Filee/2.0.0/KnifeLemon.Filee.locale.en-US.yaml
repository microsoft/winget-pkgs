ShortDescription: Free, open-source file converter. Hold a key, drag files and drop them on a format to convert them offline.
Description: |-
  Filee converts files on your own PC, without uploading them. Hold a key while dragging files and a donut-shaped menu of formats opens at the cursor; drop the files on one and the converted files are saved next to the originals. It also works from the File Explorer right-click menu, Send To, a keyboard shortcut, and with pictures and file links dragged straight out of a web browser.
  It covers 255 formats: images (including HEIC, PSD and camera RAW), PDF, Word, Excel and PowerPoint without Microsoft Office, Korean HWP/HWPX, OFD e-invoices, e-books and comics, video, audio and subtitles, data files (JSON, YAML, XML), maps (Shapefile, GeoJSON, KML, GPX), archives, CAD drawings (DWG, DXF), 3D models and fonts. Large engines such as FFmpeg and LibreOffice are optional downloads.
