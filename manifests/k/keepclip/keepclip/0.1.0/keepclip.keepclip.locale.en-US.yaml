ShortDescription: Save a video from a copied link, on Windows, with yt-dlp doing the work.
Description: |-
  Copy the link of a video, open keepclip from the Start menu and click Read link. Pick a quality by its size, and the file lands in your download folder. It works with the sites yt-dlp supports.
  keepclip is a small window that opens when you need it and closes once the file is saved, with nothing left running in the background. It needs no account, has no telemetry and shows no ads. On the first run it downloads yt-dlp, ffmpeg and Deno, about 150 MB, each from its official release and checked against its published SHA-256, and it keeps yt-dlp up to date. keepclip-cli does the same in a console.
  The window needs the WebView2 Runtime, which comes with Windows 11 and most Windows 10 computers.
  Download only what you have the right to keep.
