ShortDescription: Measured, reversible Windows 10/11 DPC latency and stutter tuner for gaming and real-time audio.
Description: Stutter Guard measures per-core wake latency and pins busy device interrupts (GPU, USB, audio interface, network) to dedicated first-thread cores based on CPU topology. It also aligns NIC RSS queues, enables MSI mode where safe, tunes power and USB/PCIe link states, audits known-bad drivers, and records every change to a write-ahead journal with an independent Safe Mode undo script.
