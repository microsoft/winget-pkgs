ShortDescription: A free, local-first markdown editor that reads like paper.
Description: 'Kolva Ink is a free markdown editor for Windows and Linux. The rendered view is the editor: click anywhere and type, or press Ctrl+E for the raw markdown. Plain .md files stay in your own folders, with wiki-links, backlinks, local search, callouts and whiteboards saved as plain files. Signed out, the only network request is a check for a newer version. AI is opt-in with your own API key (Anthropic, OpenAI, Google) or a local Ollama model. Sign in to a Kolva account and it becomes the Kolva desktop app.'
