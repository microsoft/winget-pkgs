ShortDescription: Local-first, encrypted desktop password manager with no account and no server.
Description: Kokos stores each vault as a single encrypted file on your own disk (XChaCha20-Poly1305, Argon2id). There is no Kokos account and no Kokos server. Synchronisation and the breach check are optional and off by default.
