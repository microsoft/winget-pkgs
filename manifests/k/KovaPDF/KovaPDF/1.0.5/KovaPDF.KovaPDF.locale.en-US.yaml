ShortDescription: "Edit, convert, compress and sign PDF files on Windows. Many tools work offline."
Description: |-
  KovaPDF for Windows puts the KovaPDF tools in a desktop app: edit, convert, compress, merge, split, sign and fill in PDF files, read the text of scans, and convert Bangla and Hindi text.
  Many tools run on your computer with no internet, so those files never leave it. Other tools use the same service as www.kovapdf.com, over an encrypted connection.
  Right click a PDF and choose Open with kovaPDF, or drag files onto the window.
  Free to use with no account: every tool works within a limited free allowance. Signing in raises the allowance, and paid plans remove it under fair use.
  The app keeps itself up to date and checks each update against its published fingerprint. Windows 10 and 11, 64 bit.
