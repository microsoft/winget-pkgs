ShortDescription: Local AI API Key hub — change once, every tool works
Description: AI Switch is a self-hosted local hub for managing AI API keys across developer tools. Store vendor keys in one place with search, tags, and batch import; health-check them with model-level endpoint detection and quality checks; and push verified keys to backends such as OpenClaw, OpenCode, Claude Code, Codex CLI, Cline, Aider, and Continue.dev. Broken keys are detected and removed automatically, and uninstalled tools are never written to.
