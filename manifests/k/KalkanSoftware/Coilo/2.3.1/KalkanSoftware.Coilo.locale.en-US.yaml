ShortDescription: 'Modbus TCP and RTU master for Windows: find every device, test each point safely, hand over a commissioning report.'
Description: |-
  Coilo is a Modbus master for commissioning and fault finding on Windows 10 and 11 (x64).
  It speaks Modbus TCP, Modbus RTU over RS-485/RS-232 and RTU over TCP. A slave ID scan finds every device on the line and detects baud rate and parity. Writes stay locked until you unlock them, and every write is read back. Polling, trends and diagnostics are built in.
  The free edition has no time limit. Coilo Pro (paid, per-seat licence) adds register map discovery, point lists, long-term recording, an RS-485 bus monitor, slave mode and a commissioning report.
  Coilo works offline and sends no telemetry.
