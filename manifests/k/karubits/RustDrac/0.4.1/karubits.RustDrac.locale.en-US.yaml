ShortDescription: Console launcher, address book and health viewer for Dell iDRAC 8/9 and Supermicro X11 BMCs
Description: |-
  Rust Drac opens the HTML5 virtual console of Dell iDRAC 8/9 and Supermicro X11 BMCs in a tab,
  keeps an address book of servers with their service tag or serial, shows health and the
  System Event Log over Redfish, checks every saved server for alarms in the background and
  exports health, SEL and BMC logs as a zip. Passwords are kept in the Windows Credential Manager.
