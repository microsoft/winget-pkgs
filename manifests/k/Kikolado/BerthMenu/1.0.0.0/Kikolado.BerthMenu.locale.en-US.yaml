ShortDescription: Your apps and search, one key away. A Start menu replacement and app launcher for Windows.
Description: |-
  BerthMenu opens with the Windows key or the taskbar Start button (or a shortcut of your choice) and shows the apps, files, folders and websites you pin, grouped into categories you arrange.
  Search finds installed apps, files, Windows settings, does quick math and can run commands or search the web.
  It doesn't patch Explorer: it runs as an ordinary tray app, so Windows updates don't break it, and exiting it gives you the normal Start menu back.
  Position, size, colors, frosted glass, icon tiles and animations are all adjustable, and settings can be backed up and moved to another PC.
