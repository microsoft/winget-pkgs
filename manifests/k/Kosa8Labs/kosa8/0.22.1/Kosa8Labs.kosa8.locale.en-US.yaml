ShortDescription: Secure sandboxes for AI agents, each a sealed microVM or container with keys kept outside.
Description: |-
  kosa8 runs AI agents, the code they write and the tools they call in sealed sandboxes, with API keys kept
  outside the sandbox and every step audited. This package installs the kosa8 command-line tool and kosa8d.
  On Windows, kosa8d runs sandboxes as gVisor containers on Docker (preview); the full engine runs in WSL2
  (kosa8 wsl setup). The CLI also drives kosa8 Cloud (kosa8 login) or a remote kosa8 host.
