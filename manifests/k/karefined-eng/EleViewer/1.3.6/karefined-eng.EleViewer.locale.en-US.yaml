ShortDescription: A local-first study workspace for PDFs, Markdown, and web research.
Description: EleViewer is a local-first study workspace that unifies your documents and web research. It features a Split-Screen Web Panel for side-by-side reading, Vaults with live background search, full Session Restore that remembers exactly where you left off, Persistent Bookmarks, and a Global Quick Note hotkey (Alt+E). Built for privacy and speed, EleViewer opens PDF, Word, Excel, PowerPoint, Markdown, CSV, and HTML files without any accounts, lag, or telemetry.
