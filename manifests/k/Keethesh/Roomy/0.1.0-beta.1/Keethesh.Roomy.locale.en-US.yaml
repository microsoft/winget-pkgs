ShortDescription: Disk space analyzer for Windows that shows what is filling your drive and explains unfamiliar folders.
Description: |-
  Roomy scans a drive or any folder on your PC and shows where the space went, with eight views including folders, a treemap and a sunburst.
  Select a file or folder to see a plain-language note on what it probably is and whether it is usually safe to remove.
  It also finds exact duplicate files by content, lists installed apps with their measured size, and compares snapshots to show what grew.
  Cleanup sends items to the Recycle Bin by default and refuses to touch core Windows locations.
  Scanning runs entirely on your PC and nothing about your files is uploaded.
