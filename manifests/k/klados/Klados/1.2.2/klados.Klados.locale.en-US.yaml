ReleaseNotes: |-
  - Editing is visible from the start. The Raw pane, where documents are edited, is now shown by default below Detail. If you've already arranged your panes, your layout is kept.
  - Commands that need Raw open it. Locate in Source, Soft Wrap, Focus Raw Source (Ctrl+3), Next/Previous Diagnostic (F8) and the palette's : line jump now show the Raw pane if it's hidden. Before, they did nothing.
  - Safer upgrades on Windows. If Klados is running when you install or uninstall, the installer asks you to close it, so Klados can ask about unsaved changes. Before, it closed Klados itself and unsaved edits were lost. Installers run without a window, as winget runs them, now stop with exit code 3.
  - Updated build and test tools to fix all available security advisories. None of them were part of the app itself.
ReleaseNotesUrl: https://github.com/mincowski/klados/releases/tag/v1.2.2
