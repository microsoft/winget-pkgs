ShortDescription: Drive Windows desktop apps from the command line, Playwright-style, through UI Automation.
Description: |-
  A Playwright-style command-line tool for driving Windows desktop applications (Win32, WinForms, WPF, UWP) through their UI Automation tree.
  A per-session background daemon holds the app's live tree and hands out short element refs; snapshot the tree, then click, fill, check, select or press keys by ref.
