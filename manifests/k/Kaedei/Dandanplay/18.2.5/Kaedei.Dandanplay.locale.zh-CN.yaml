ReleaseNotes: |-
  更新内容：
  - 新增了原生基于 D3D11 GPU 加速的 Anime4K 超分功能（VLC、EVR、FFmpeg 内核）；
  - 新增了对 PGS（.sup） 图片字幕格式的渲染支持；
  - 新增了对 VobSub（.sub+.idx）图片字幕格式的渲染支持；
  - 支持在 Windows 系统媒体控制面板（任务栏“快速设置”面板顶部的媒体播放控制条）显示播放状态并控制播放；
  - 远程媒体库支持通过域名连接 SMB 服务器；
  - 优化了右键菜单的样式；
  - mpv 内核现在不需要会员即可使用；
  - 修复了一个 EVR 内核字幕滤镜（DirectVobSub）与弹弹 play 字幕渲染器冲突的问题；
  - 修复了自动下载规则同步状态异常的问题；
  功能说明：
  - 此版本引入了基于原版 GLSL Anime4K 的完整等效移植版本，使用 C# + D3D11 在 GPU 上进行计算和渲染，将超分功能引入 VLC/EVR/FFmpeg 等内核；
  - 使用 FFmpeg 内核并开启 Anime4K 时可能会出现稍微卡顿的情况，请将内核的硬件加速设置修改为 DXVA2
