ShortDescription: A free, open-source SSH and SFTP client for Windows.
Description: |-
  easy-ssh is a desktop SSH and SFTP client for Windows. Save a host, port, user and folder, then connect in one click. The terminal and file manager share the same SSH connection.

  It also includes a Ctrl+K snippets palette, split panes, port forwarding, a key manager, jump hosts, auto-reconnect, tmux support and encrypted backup of hosts and snippets.

  Windows 10/11 (64-bit). macOS and Linux installers are coming soon.
