Description: Permissions Reporter is a fast, network-enabled NTFS permissions reporter and audit tool for Windows. It scans local drives, servers, and network shares and reports who has access to which files, folders, and shares, with interactive tree and table views, security metrics dashboards, principal and file owner reports, advanced filtering, report comparison, scheduling, and export to Excel, PDF, HTML, XML, CSV, and JSON formats. The Basic edition is free with no time limit; the Pro edition is a paid perpetual license that adds data export, advanced filtering, report comparison, the built-in scheduler, command-line automation, and email delivery.
