ShortDescription: Duplicate file finder and remover for Windows PCs, servers, and network storage
Description: Duplicate File Detective is a business-class duplicate file finder and remover for Windows. It scans local drives, network shares, NAS devices, and removable storage, identifying true duplicates by file content (CRC32, MD5, SHA-1, SHA-256, or SHA-512 checksums, with optional byte-for-byte verification), duplicate photos by visual comparison, duplicate music by audio tags, and duplicate documents by embedded properties. Features include a duplicate folder report, SmartMark assisted selection, safe move, zip, and delete processing with the option to replace duplicates with links to the original, duplicate file ownership reporting, scheduled reports with email delivery, command-line automation, and export to HTML, PDF, CSV, XML, and Excel formats. Duplicate File Detective is commercial software with a free 15-day trial.
