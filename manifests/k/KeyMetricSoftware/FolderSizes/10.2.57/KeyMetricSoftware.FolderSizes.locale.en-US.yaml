ShortDescription: Disk space analysis and reporting tool for Windows
Description: FolderSizes is a network-enabled disk space analysis and reporting tool for Windows. It reveals how storage is being consumed with interactive treemap, sunburst, and bar chart visualizations, detailed folder size views, and a wide range of file reports (largest, oldest, duplicate, and temporary files, file types, owners, attributes, and more). Features include file system snapshots, trend analysis, scheduled reporting, command-line automation, and export to HTML, CSV, Excel, PDF, and XML formats. FolderSizes is commercial software with a free 14-day trial.
