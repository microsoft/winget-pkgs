ShortDescription: The open source agentic coding CLI from the Kilo engineering platform, built for baseline x86-64 CPUs.
Description: Kilo is the standalone agent CLI of the Kilo agentic engineering platform, the open source coding agent for building, shipping, and iterating on software. This is the baseline build, targeting older x86-64 CPUs without newer instruction-set extensions. It plans, edits, and executes engineering work directly in the terminal with support for tree-sitter language parsing and sandboxed task execution.
