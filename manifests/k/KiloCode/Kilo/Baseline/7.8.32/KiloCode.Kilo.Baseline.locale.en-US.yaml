ReleaseNotes: |-
  VS Code
  7.8.32
  Patch Changes
  - #14982 fe67f44 Thanks @ykakade! - Prevent held keys and repeated close commands from confirming worktree deletion in Agent Manager. Use the Delete confirmation button or a separate Backspace or Delete press to confirm.
  7.8.31
  Minor Changes
  - #16342 182a5f9 - Change the Kilo telemetry preference from VS Code's About tab or the core telemetry API. Telemetry stays off if Kilo config, VS Code, or the environment disables it.
  7.8.30
  Minor Changes
  - #16080 54de37a - Retire the Mercury Edit 2 autocomplete models and Next Edit. Codestral is now the default autocomplete model, and saved Mercury or Inception selections use Codestral. The SDK no longer has client.kilo.edit, and @kilocode/kilo-gateway no longer exports ./edit or ./edit-prompt.
  Patch Changes
  - Updated dependencies [37b2900, 8a762f8, 54de37a]:
    - @kilocode/sdk@7.9.0
    - @kilocode/kilo-gateway@7.9.0
    - @kilocode/kilo-ui@7.8.29
    - @kilocode/plugin@7.8.29
    - @opencode-ai/ui@7.8.29
    - @opencode-ai/core@7.8.29
    - @kilocode/kilo-indexing@7.8.29
  CLI
  7.8.31
  Minor Changes
  - #16342 182a5f9 - Change the Kilo telemetry preference from VS Code's About tab or the core telemetry API. Telemetry stays off if Kilo config, VS Code, or the environment disables it.
  Patch Changes
  - #16346 f35ba50 Thanks @rgbkrk! - Fix Gemini requests failing when an MCP tool declares a nullable enum or a multi-type parameter.
  7.8.30
  Minor Changes
  - #16198 37b2900 - Expose hosted workspace change snapshots, revision-fenced per-file reads, explicit refresh, and verified linked-pull-request diffs through Session Host and the generated SDK.
  - #16184 8a762f8 - Expose hosted workspace pull request summaries and explicit refresh through Session Host, preserving partial observations and distinct authorization, connectivity, and rate-limit states.
  - #16080 54de37a - Retire the Mercury Edit 2 autocomplete models and Next Edit. Codestral is now the default autocomplete model, and saved Mercury or Inception selections use Codestral. The SDK no longer has client.kilo.edit, and @kilocode/kilo-gateway no longer exports ./edit or ./edit-prompt.
  Patch Changes
  - #15988 b69e4d6 - Fix Cloud Agent CLI authentication by exchanging login credentials for a Cloud Agent control token.
  - #16210 41b8ffa Thanks @WebReflection! - Update hono to 4.13.18 and @hono/node-server to 2.1.7 to fix security issues flagged by Dependabot alerts.
  - #15599 c153a86 - Create local and Cloud tasks from a unified Add menu in the JetBrains Agent Manager. Group Cloud workspaces, open them in the correct organization in your browser, close and reopen sessions, and delete whole workspaces with progress and retry. Allow Cloud workspaces without a profile, preselect and mark personal and organization default profiles, switch back to the default profile, show a standard border around the dialog prompt, and create a Cloud workspace with an empty prompt. Show submitted prompts immediately, show preparation progress while a Cloud workspace starts, wait for preparation to finish before loading chat history, and keep Cloud-generated session titles in sync in both the session header and the workspace list. Keep newly created Cloud workspaces visible while discovery catches up, and remove deleted ones immediately. Report setup failures with command output and retry even when chat history is unavailable, and show Cloud load failures in plain language with Retry for transient errors instead of Dismiss for permanent errors.
  - #16098 b11ecb4 - Show what Kilo Gateway charged as the session cost, and the provider's inference cost only for requests that use your own API key.
  - #16212 83e2ae6 Thanks @WebReflection! - Update node-forge to 1.4.3 to fix security issues flagged by Dependabot alerts.
  - #15987 2cf9750 - Keep questions open while background tasks finish so answers are not dismissed while typing.
  - Updated dependencies [37b2900, 8a762f8, 54de37a]:
    - @kilocode/sdk@7.9.0
    - @kilocode/kilo-gateway@7.9.0
    - @kilocode/plugin@7.8.29
    - @opencode-ai/tui@7.8.29
    - @opencode-ai/ui@7.8.29
    - @kilocode/kilo-indexing@7.8.29
    - @kilocode/kilo-telemetry@7.8.29
    - @kilocode/plugin-atomic-chat@7.8.29
    - @opencode-ai/server@7.8.29
  7.8.28
  Minor Changes
  - #15929 f15aff8 - Expose hosted workspace profile defaults through the Session Host API. Clients can create an empty hosted workspace without an initial prompt or profile, list personal and organization profiles with their default flags, and set or clear the personal default profile.
  Patch Changes
  - #15921 8116541 Thanks @zfralish! - Skip plugin tools whose arguments cannot be converted to JSON Schema instead of failing every prompt in the session
