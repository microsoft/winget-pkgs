ShortDescription: "MQTT sensor simulator: a window to edit, run and watch simulated sensors"
Description: |-
  Senzor simulates MQTT sensors, so you can test whatever consumes them: a dashboard, a backend
  that stores readings, a home automation setup. A template describes a kind of sensor once, and
  Senzor runs as many copies of it as you ask for, each with its own connection to your broker.
  It comes as a desktop window and as senzor-cli for terminals, Docker and CI; an AI agent can
  drive either over MCP.
