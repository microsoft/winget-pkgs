ShortDescription: Free, open source Windows optimizer. One click builds a plan for your PC, or pick from 87 tweaks, each explained and undoable.
Description: |-
  Framecalm tunes Windows 10 and 11 for games and everyday speed, and keeps a copy of everything it changes so you can put it back.
  One click builds a plan from your hardware, with a reason for every line. Or pick from 87 tweaks across power, graphics, network, input, background apps, services, look and feel, privacy and system, each showing the exact registry value it writes.
  A restore point is made first, every original value is saved and checked, and History can undo any change. No account, no ads, no telemetry.
