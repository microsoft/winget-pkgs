ShortDescription: Turns a Windows 11 PC into a clean, fast gaming PC that then maintains itself.
Description: |-
  Messiah removes Windows bloat, ads and telemetry, tunes the PC for games (power plan, monitors at their highest refresh rate, NVIDIA settings) and installs Steam, Discord and Chrome.
  Afterwards it maintains the PC by itself: drivers and app updates, crash detection, cleanup, and putting back any setting an update undid. Every change has a switch in its app, and it uninstalls cleanly.
  Note: it turns memory integrity (VBS) off for gaming performance - a small security trade-off, switchable in the app.
