ShortDescription: 'Голосовая диктовка для Windows: работает на компьютере, без интернета и подписок'
Description: >-
  Зажмите правый Ctrl и говорите — текст появится в любом окне Windows, со знаками
  препинания и цифрами. Распознавание идёт на самом компьютере на модели GigaAM v3
  от Сбера: она входит в установщик, поэтому интернет не нужен ни при установке,
  ни в работе, а голос и текст никуда не отправляются. Голассиста учится на ваших
  правках: поправьте имя, бренд или рабочий термин один раз, и дальше она будет
  писать это слово так, как нужно вам.
