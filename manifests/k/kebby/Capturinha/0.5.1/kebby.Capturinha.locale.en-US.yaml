ShortDescription: Real-time screen and audio capture for Windows using NVIDIA NVENC.
Description: |-
  Capturinha records the screen and audio on Windows in real time with NVIDIA NVENC.
  It focuses on frame-rate stability, encoding quality, and configuration, including HEVC, high-quality profiles, and HDR capture.
  Windows 10 version 1903 (64-bit) or later is required, and the display must be connected to an NVIDIA GPU.
Moniker: capturinha
Tags:
- capture
- nvenc
- recording
- screen-capture
- video
ReleaseNotes: |-
  - Added lossless HEVC profile
  - Frame timing fixes when the primary monitor's refresh rate is wonky
  - FFmpeg updated to 7.0
ReleaseNotesUrl: https://github.com/kebby/Capturinha/releases/tag/v0.5.1
InstallationNotes: |-
  WinGet installs BtbN.FFmpeg.LGPL.Shared.7.1 with this package. That shared build provides avcodec-61.dll, avformat-61.dll, avutil-59.dll, and swresample-5.dll on PATH.
  Open a new terminal after installation so the updated PATH is visible. Recording requires an NVIDIA GPU, and the screen must be connected to that GPU.
