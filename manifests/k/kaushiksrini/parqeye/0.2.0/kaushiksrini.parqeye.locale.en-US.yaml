ReleaseNotes: |-
  Release Notes
  Added
  - Support for large Parquet files with large row counts in the data preview (#43)
  - g/G shortcuts to jump to the top/bottom of the data preview (#43)
  - PyPI package and build workflow, so you can invoke uvx parqeye (#40)
  Fixed
  - Incorrect Min/Max aggregation in the Schema tab (#44)
  - Column file offset and distinct count now show N/A when not set in the file metadata (#46)
  - PyPI workflow builds for Linux manylinux_2_28 (#41)
  - add dtype-extension to support extension types and handle panics with the polars crate (#45)
  Changed
  - Lazily load page info to speed up startup (#32)
  Install parqeye 0.2.0
  Install prebuilt binaries via shell script
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/kaushiksrini/parqeye/releases/download/v0.2.0/parqeye-installer.sh | sh
  Install prebuilt binaries via Homebrew
  brew install kaushiksrini/parqeye/parqeye
  Install prebuilt binaries into your npm project
  npm install parqeye@0.2.0
