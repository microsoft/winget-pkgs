ShortDescription: Fast, good-looking disk space analyzer with a sunburst chart and duplicate finder.
Description: |-
  Ringfold shows where your disk space went and how much each folder takes.
  A native Rust engine scans drives in parallel; the app shows the result as an interactive sunburst chart and a sorted size list,
  breaks usage down by file type, lists the largest files and finds duplicates by content.
  Files can be opened, shown in Explorer or moved to the Recycle Bin (always with confirmation).
