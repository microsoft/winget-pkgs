PackageIdentifier: Kevin-Haus24.Ringfold
PackageVersion: 0.1.0
PackageLocale: ru-RU
Publisher: Ringfold contributors
PackageName: Ringfold
License: MIT
ShortDescription: Быстрый и красивый анализатор дискового пространства с кольцевой диаграммой и поиском дубликатов.
Description: |-
  Ringfold показывает, где и сколько занято места на диске.
  Движок на Rust сканирует диски параллельно, а приложение показывает результат интерактивной кольцевой диаграммой и списком по размеру,
  разбивает место по типам файлов, находит самые крупные файлы и дубликаты по содержимому.
  Файлы можно открыть, показать в Проводнике или переместить в корзину (всегда с подтверждением).
Tags:
