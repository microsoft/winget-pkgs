ShortDescription: Live usage limits and API spending for your AI tools, in the Windows tray.
Description: |-
  Gaugely shows how much is left of each AI subscription — Claude Code, Codex, Kimi Code and Google Antigravity — and what you are spending on the APIs of Anthropic, OpenAI, Kimi, OpenRouter and DeepSeek, as tray icons and an optional floating strip of gauges.
  It runs only on your PC, keeps API keys in the Windows Credential Manager and talks only to the official services. It is a fork of RateTray by nowrap.
