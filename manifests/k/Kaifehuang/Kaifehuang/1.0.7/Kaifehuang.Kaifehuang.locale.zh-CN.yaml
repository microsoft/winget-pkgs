ShortDescription: 新电脑开荒：批量装软件、C 盘划出新分区、带校验的文件转移
Description: >-
  面向个人装机场景的 Windows 桌面工具，三块功能：按清单批量安装常用软件（WinGet 或官网安装包）、
  把 C 盘缩小并在磁盘尾部新建分区（带预检与逐步进度）、把文件复制到新分区并逐文件 SHA-256 校验、支持中断续传。
  分区操作会请求管理员权限；程序本身按用户级安装，不需要系统级安装。
