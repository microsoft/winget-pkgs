ReleaseNotes: |-
  Features
  - 新增 WebDAV 文件访问：可在 Finder、资源管理器等客户端中管理「我的文件」和「共享文件」；管理员可控制使用范围，成员可单独创建、撤销和清理设备应用密码。
  - 文件页新增「协作文件」，集中查看会话、项目群聊和任务中的文件与图片，支持按来源、类型和发送人筛选；桌面客户端还可显示下载状态，并直接在本地文件夹中定位文件。
  - AI 助手新增悬浮按钮显示开关，可按当前设备隐藏浮球，同时保留快捷键和其他 AI 入口。
  - 系统设置重新整理分组与标签页，常用配置更容易查找；部门负责人视角默认开启，团队任务查看更方便。
  Bug Fixes
  - 关闭注册后会同步隐藏登录页注册入口，并完善关闭状态提示和登录切换动画，避免用户进入不可用的注册流程。
  - 修复已失效成员导致群聊人数显示变化的问题。
  - 修复系统设置中列模板、任务优先级输入框可能被意外清空的问题，并改善编辑体验。
  - 修复协作文件筛选栏、列表内容及文件页部分操作在窄屏下溢出或对齐不整齐的问题。
  - 延长在线授权请求等待时间，降低网络较慢时的失败概率。
  - 修复项目目录和静态文件权限异常可能导致安装、构建或网页资源访问失败的问题。
  - 优化仪表盘警告提示、移动端角标的位置与显示效果。
  Performance
  - 优化协作文件索引与缓存，减少重复加载，在文件较多时筛选和切换更流畅。
