ReleaseNotes: |-
  Features
  - 管理员可在网页上直接在线更新服务端：设置菜单与头像下拉新增「系统更新」入口，更新前需再次输入登录密码，并可查看实时进度、日志与结果；更新前会自动备份数据库，如有本地修改会中止以保护数据。
  - 工作报告、日历、我的收藏、最近打开、签到打卡等内置功能改由「系统功能」应用统一管理，可按需开启或关闭，关闭后入口会同步从应用中心、头像菜单和左侧导航中隐藏。
  - 项目页筛选支持多选组合：可同时按状态（含未计划）、标签、负责人筛选，并显示已选数量，支持一键清空；看板、列表、甘特图的筛选结果保持一致。
  - 项目列表模式下，分组选择下拉会显示各分组的任务数量。
  - 仪表盘视图切换合并为「列表｜四象限｜部门总览」，切换更直观。
  - 插件菜单支持自定义抽屉默认宽度，满足不同插件的展示需要。
  - AI 助手悬浮按钮的显示开关迁移到「应用 → AI 助手 → 个人偏好」中设置。
  - 客户端更新相关提示文案更清晰：统一标明「客户端」，更新按钮统一为「立即更新」。
  Bug Fixes
  - 修复自定义天数的周期任务到点后不断重复生成任务的问题，周期任务现在会按设定正常生成。
  - 修复桌面客户端在新标签页中打开分享文件（如 Excel 预览）时，提示「请登录后继续」或「身份已失效」的问题。
  - 修复项目列表模式下，「我的任务」中已有添加任务入口时仍误显示「暂无任务」的问题。
  - 修复搜索服务重启或暂时不可用时，AI 相关索引可能重复全量同步的问题。
  - 修复任务编辑器高度、成员选择器间距，并去除菜单项键盘聚焦时多余的边框与阴影，界面更整洁。
