ReleaseNotes: |-
  Features
  - 移动端设置页全新改版：顶部展示个人资料卡，设置项按类别分组并直接显示当前值，退出登录移到页面底部，查找和修改更方便。
  - 手机 App 查看图片和视频改为类似微信的预览方式，下拉即可关闭。
  - 消息长按菜单的复制功能简化为「复制」和「选择复制」，选择复制会打开全屏页面，方便只复制其中一部分文字。
  - 手机 App 里切换项目列表与项目详情，以及从应用进入设置、日历、文件时，页面改为从右侧滑入、返回时滑出，操作更顺手。
  - 切换到其他页面再返回时，会停留在之前浏览的位置，消息和通讯录分别记住各自的位置。
  Bug Fixes
  - 修复小米手机收不到 App 推送，以及 App 切到后台时出现空白 DooTask 通知的问题。
  - 修复 iOS App 无法连接通过公网 IP 或域名、以 http 方式访问的服务器的问题。
  - 修复 iOS 上加载历史消息时，正在进行的滑动会被打断的问题。
  - 修复 Safari 中加载失败的消息图片在滚动时反复重新加载的问题。
  - 修复移动端搜索消息时，顶部搜索栏四角出现圆角的问题。
  - 修复通讯录按部门查看时，长按联系人弹出菜单后仍会进入联系人详情的问题。
  - 修复文件页的多处显示问题：触屏点击后残留的高亮效果、窄屏下搜索框与标题挨得太近，以及列表高度显示不正确。
  - 修复全新安装后服务可能无法正常使用的问题。
  Performance
  - 手机上打开会话和任务详情更流畅：先播放打开动画，同时显示占位内容，不再卡顿或出现空白。
  - 消息列表滚动和长按弹出菜单更流畅，消息较多时也不会卡顿。
  - 项目看板更流畅：一列里的内容变化不再影响其他列，列头菜单在首次打开时才加载。
