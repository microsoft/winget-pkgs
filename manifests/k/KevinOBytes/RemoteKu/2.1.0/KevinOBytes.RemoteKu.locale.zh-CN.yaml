PackageVersion: 2.1.0
PackageLocale: zh-CN
License: 免费软件
ShortDescription: Roku 遥控器与实时 ECP 命令面板。
Description: |-
  以硬件为原型打造的快速 Roku 遥控器与实时 ECP 命令面板，支持 macOS、Windows 和 Linux。
  - 通用 Roku 搜索（⌘⇧S）：借助 Roku 原生的 /search/browse 协议，直接在桌面端跨全部流媒体频道检索内容。
  - 剪贴板直接粘贴并投送（⌘V）：把密码、网址或搜索文本从桌面剪贴板直接送进电视画面，并自动清理换行符。
  - 睡眠定时器与自动关机倒计时：在 15m、30m、45m、60m、90m 与 Off 之间切换，实时显示倒计时徽章，到期自动发送 PowerOff。
  - 触控板/鼠标滚轮音量手势：在拟真遥控器机身之上双指滚动即可平滑调节电视音量，130ms 节流并附带机械按键音效。
  - 自定义设备昵称与信号源标签：为多台 Roku 设备重命名（例如 "Living Room TV"），并自定义 HDMI 1–4、调谐器与 AV 标签（例如 "PS5"、"Apple TV"）。
  - 应用内更新检查：启动时在后台检查 GitHub Releases API，并以轻量提示条通知。
  - 悬浮画中画迷你遥控器（⌘⇧M）：把应用收起为小巧的口袋遥控器，悬浮在活跃窗口旁而不占用屏幕空间。
  - 并列式桌面命令面板：在桌面视图下，拟真遥控器与实时伴随面板并排显示，面板内含实时电视键盘、可搜索的频道启动器以及 Roku 电视信号源与电源控制。
  - 实时电视键盘（Lit_<char> 逐字投送）：直接用 Mac/PC 键盘把搜索词、用户名或密码输入到 Roku 屏幕上。开启实时投送后，每个字符（含退格与回车）都会在输入瞬间发送，也可以一次性发送整段文本。
  - 真实 Roku 频道图标与即时搜索：从 Roku 设备自动抓取并缓存官方频道封面（/query/icon/<appId>），支持即时筛选。
  - 可自定义的固定应用快捷键（★）：把最多 6 个常用已安装 Roku 频道（★）固定到遥控器机身的 6 个实体快捷键上。
  - 机械音效反馈与实体键盘操控：按键按下与抬起时合成可听见的机械点击声（可在顶栏开关），并把每一项遥控操作映射到笔记本实体键盘（W/A/S/D、方向键、Enter、Space、+/-）。
  - 实时“正在播放”信息栏：查询 /query/active-app 与 /query/media-player，显示当前频道、播放状态（PLAYING、PAUSED、SCREENSAVER）、实时进度条以及已播放/总时长（14:20 / 48:00）。
  - 长按连发：按住方向键（Up、Down、Left、Right）、Volume +/-、Channel +/- 或 Rewind/Fast Forward 即可连续重复。
  - 顶栏快速切换设备与 <150ms 即时重连：直接在顶栏胶囊（含迷你遥控器模式内）之间切换多台 Roku，并在启动时立即重连上次使用的 Roku，无需等待 SSDP 组播扫描结束。
  - 离线内置字体：本地打包 Space Grotesk、Plus Jakarta Sans 与 JetBrains Mono（tabular-nums），渲染清晰且零网络延迟。
  在应用内随时按 ? 或 ⌘/ 打开可交互的快捷键速查表。
