ShortDescription: A cassette deck for your PC, with real tapes, reels and hiss.
Description: |
  KASSETE is a desktop cassette deck for the music already on your PC. It turns
  a folder of audio files into a shelf of real tapes, with two sides, spinning
  reels, a counter, VU meters and a deck that can be opened up.

  Import your library, pick a shell and a deck, then play, flip, wind and
  re-tension. Ten deck models each have two real finishes; clear shells show
  the mechanism inside; wear and dirt accumulate as tapes are played. The Bench
  includes a pencil service animation for re-tensioning and winding back to the
  start.

  Everything stays local: no accounts, no streaming and no telemetry.
