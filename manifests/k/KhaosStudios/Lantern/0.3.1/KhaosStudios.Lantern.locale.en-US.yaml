ShortDescription: Control and synchronize monitor brightness across computers on your local network.
Description: |-
  Lantern provides native tray or menu-bar brightness controls for individual
  displays, each computer, and connected Windows PCs and Macs on a trusted local
  network. Hardware brightness support depends on the display, cable, and dock.
  Software dimming is available where supported. Optional phone control uses
  a separately enabled browser panel.
