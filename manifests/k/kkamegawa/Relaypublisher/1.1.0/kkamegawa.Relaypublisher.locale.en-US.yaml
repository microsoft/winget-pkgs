ShortDescription: Relaypublisher publishes winget-like YAML manifests as Microsoft Intune LOB apps from CI.
Description: Relaypublisher is a lightweight utility that publishes Nostr events to multiple relays at once, making it easy to distribute your notes across the network.It provides a simple command‑line interface for sending events, supports common Nostr message types, and allows you to configure relay endpoints through a JSON settings file. Relaypublisher is designed for users who want a minimal, scriptable tool for multi‑relay posting without running a full relay or client.
