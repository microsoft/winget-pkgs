ShortDescription: Free, open-source Windows 11 uninstaller and cleaner that explains every change and can undo it.
Description: |-
  Purgely uninstalls programs, Microsoft Store apps and portable apps (also several at once) and finds what they leave
  behind – folders, registry keys, services, scheduled tasks, startup entries, right-click menu entries, file types,
  firewall rules and PATH entries – with a plain explanation and a confidence for every item. It removes bloatware,
  turns off ads and suggestions in Windows, updates programs with Windows Package Manager, checks drivers from
  Microsoft and the PC maker, and offers repair tools. Everything is backed up first and can be restored from the
  Undo center. No ads, no account, no telemetry.
