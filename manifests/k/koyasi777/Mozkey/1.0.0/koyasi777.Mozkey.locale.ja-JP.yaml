ShortDescription: Mozcをベースにした、ローカルファーストの日本語入力ソフトウェア
Description: |-
  Mozkey（もずきー）はMozcをベースにした非公式の日本語入力ソフトウェアです。
  通常変換、遅延付きライブ変換、ローカルZenzによる文脈補正、縦書き入力、
  候補表示のカスタマイズ、柔軟なキー設定と学習制御に対応しています。
  IMEの通常動作では入力内容を外部サービスに送信しない設計です。
  Google日本語入力またはGoogleの公式製品ではありません。
