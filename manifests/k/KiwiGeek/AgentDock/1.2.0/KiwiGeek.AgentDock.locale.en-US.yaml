ShortDescription: A Windows 11 taskbar flyout for launching AI agents.
Description: |-
  Agent Dock is a Windows 11 taskbar flyout for launching AI agents. Click the pinned icon and an
  acrylic flyout opens above it; pick an agent and it starts. Command-line agents open in Windows
  Terminal in the folder you've chosen, and desktop agents just launch. Hovering an agent shows its
  plan usage and recent folders, and a usage overview suggests which agent has the most room left.
