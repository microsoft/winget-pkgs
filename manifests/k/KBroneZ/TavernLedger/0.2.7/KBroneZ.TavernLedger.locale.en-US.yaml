ShortDescription: "Free, open-source Hearthstone Battlegrounds tracker: every game, recaps, combat replays and an overlay."
Description: "Tavern Ledger keeps every Hearthstone Battlegrounds game you play, read from the game's own log: hero, place, health each round, the opponents you met and both boards at each combat. Each game has a recap and attack-by-attack combat replays, and the stats split Solo and Duos. An optional in-game overlay shows the last board you met from each opponent and the combat odds from the project's own simulator.\nBy default it also reads two values the game shows you, the lobby's tribes and your own rating, read-only from the game's memory; they stay on your PC and you can turn that off in Settings. This goes against the letter of Blizzard's rules, and the account at risk is yours. It never changes the game and never plays for you. Your games stay on your PC; uploading to tavernledger.net is off until you sign in and turn it on.\nThe app updates itself from the project's signed GitHub releases when you press Restart now.\nUnofficial fan project. Not affiliated with or endorsed by Blizzard Entertainment."
