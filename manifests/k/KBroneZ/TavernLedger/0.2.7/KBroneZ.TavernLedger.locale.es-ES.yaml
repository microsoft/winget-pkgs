ShortDescription: "Tracker gratuito y de código abierto de Campos de Batalla de Hearthstone: partidas, resúmenes, repeticiones y overlay."
Description: "Tavern Ledger guarda todas tus partidas de Campos de Batalla de Hearthstone, leídas del propio registro del juego: héroe, puesto, vida en cada ronda, los rivales con los que te cruzaste y los dos tableros de cada combate. Cada partida tiene su resumen y la repetición de cada combate ataque a ataque, y las estadísticas separan Solo y Dúos. Un overlay opcional en la partida muestra el último tablero que viste de cada rival y las probabilidades del combate según el simulador propio del proyecto.\nPor defecto también lee dos datos que el juego te muestra, las razas de la partida y tu propia puntuación, leídas de la memoria del juego sin escribir en ella; se quedan en tu PC y puedes desactivarlo en Ajustes. Esto va en contra de la letra de las normas de Blizzard, y la cuenta en riesgo es la tuya. Nunca modifica el juego ni juega por ti. Tus partidas se quedan en tu PC; la subida a tavernledger.net está desactivada hasta que inicias sesión y la activas.\nLa aplicación se actualiza sola desde las versiones firmadas del proyecto en GitHub cuando pulsas Reiniciar ahora.\nProyecto no oficial de fans. Sin afiliación con Blizzard Entertainment ni respaldo de esta."
