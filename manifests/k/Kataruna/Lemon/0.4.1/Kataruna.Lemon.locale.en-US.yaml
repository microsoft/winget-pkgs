ShortDescription: Drag-and-drop file converter with a pop-up conversion wheel.
Description: |-
  Lemon converts pictures, audio, video and documents. Drop files on its window, or shake the mouse while dragging
  files anywhere in Windows to open a wheel of formats and drop on one. It can also shrink PDFs and videos, resize
  pictures, cut out backgrounds with an AI model on your own PC, and run your own commands on dragged files, folders
  and links.
