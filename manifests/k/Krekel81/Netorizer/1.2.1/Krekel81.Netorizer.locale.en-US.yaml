InstallationNotes: Open a new terminal so the 'netorizer' command is on PATH. Run 'netorizer' with no arguments to launch the GUI, or pass flags to run a CLI scan - e.g. 'netorizer -p discovery --cidr 192.168.1.0/24'. Run 'netorizer --help' for all options.
