ShortDescription: Portable Windows network scanner
Description: 'Netorizer scans a subnet and inventories what it finds: live hosts, open ports, service banners, MAC vendors and hostnames. Names are resolved over DNS, SMB, NetBIOS, mDNS and LLMNR, all sent unicast so they work across VLANs. Ships as a single portable .exe with both a GUI and a CLI - no installer, no Npcap, no .NET runtime, and no administrator rights.'
