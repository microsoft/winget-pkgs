ShortDescription: A file explorer for Windows that never freezes.
Description: |-
  Arke is a GPU-rendered file explorer written in Rust. Listing, sorting, thumbnails, folder sizes,
  search and file operations run off the UI thread, so slow network shares and folders with
  100,000 files stay responsive. It searches the whole computer as you type from an NTFS index,
  searches inside files including PDF and Office documents, and has vertical tabs, split view with
  folder compare, a preview pane and Quick Look. No telemetry, no account, free and open source.
