PackageIdentifier: Koimsurai.Arke
PackageVersion: 0.1.0
PackageLocale: zh-TW
ShortDescription: 一個永遠不卡的 Windows 檔案總管。
Description: |-
  Arke 是用 Rust 撰寫、GPU 繪製的檔案總管。列出、排序、縮圖、資料夾大小、搜尋和檔案操作都不在介面執行緒上進行，
  慢速的網路共用和有 10 萬個檔案的資料夾也能保持流暢。它用 NTFS 索引邊打字邊搜尋整台電腦，也能搜尋檔案內容
  （包括 PDF 和 Office 文件），並提供直式分頁、可比較資料夾的分割檢視、預覽窗格和快速查看。沒有遙測，不需要帳號，免費開源。
Tags:
- 檔案總管
- 檔案管理
- 檔案搜尋
- 分頁
- 雙窗格
ManifestType: locale
