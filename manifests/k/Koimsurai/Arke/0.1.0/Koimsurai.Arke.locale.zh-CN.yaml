# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: Koimsurai.Arke
PackageVersion: 0.1.0
PackageLocale: zh-CN
ShortDescription: 一个永远不卡的 Windows 文件管理器。
Description: |-
  Arke 是用 Rust 编写、GPU 渲染的文件管理器。列出、排序、缩略图、文件夹大小、搜索和文件操作都不在界面线程上执行，
  慢速的网络共享和有 10 万个文件的文件夹也能保持流畅。它用 NTFS 索引边打字边搜索整台电脑，也能搜索文件内容
  （包括 PDF 和 Office 文档），并提供竖排标签页、可比较文件夹的分屏、预览窗格和快速查看。没有遥测，不需要账号，免费开源。
Tags:
- 文件管理器
- 资源管理器
- 文件搜索
- 标签页
- 双窗格
ManifestType: locale
ManifestVersion: 1.28.0
