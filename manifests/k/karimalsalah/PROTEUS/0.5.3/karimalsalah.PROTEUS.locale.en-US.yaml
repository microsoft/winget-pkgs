ShortDescription: GPU terminal that journals every session, sees every process, undoes shell commands and serves AI agents over MCP
Description: |-
  PROTEUS is a GPU terminal for Windows built for people and AI agents. It journals every session so any past
  moment can be rendered again, sees every process a session starts (with command line and exit code) through a
  Windows job object, keeps a content-addressed history of the working tree so a command can be undone, and is an
  MCP server that gives agents real terminal sessions to spawn, type into, wait on and see. It draws nothing and
  uses no CPU while idle. One self-contained exe.
