ShortDescription: Lightweight screen recorder for low-end PCs, with an interface that follows OBS Studio.
Description: |-
  Obs Lite records the screen or a window, desktop audio and microphone to H.264 MP4 with the GPU's hardware encoder (NVENC, Quick Sync or AMF), so it stays light on CPU and memory.
  It has a replay buffer, application audio capture, one webcam overlay, microphone noise suppression and recordings that survive a crash.
  It only records: no streaming, scenes or plugins. It is an independent project, contains no OBS code and is not affiliated with the OBS Project.
