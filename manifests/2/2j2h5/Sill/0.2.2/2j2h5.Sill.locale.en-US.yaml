ShortDescription: A terminal panel at the bottom of File Explorer, like the terminal panel in KDE Dolphin.
Description: |-
  Sill adds an integrated terminal to the bottom of File Explorer on Windows 11 and Windows 10, like the terminal panel in KDE Dolphin.
  Open PowerShell, Command Prompt (cmd) or Git Bash in the folder you are looking at, and File Explorer and the terminal follow each other's current folder.
  Ctrl+` opens and closes the panel. Sill extends File Explorer itself and installs per user without administrator rights.
  When a terminal you aren't looking at rings the bell, for example when an AI coding agent finishes, its tab shows a dot and the taskbar button flashes.
