# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: 2fame.LimeKit
PackageVersion: 0.3.0
PackageLocale: ru-RU
Publisher: 2fame
PackageName: LimeKit
ShortDescription: "Набор для настройки Windows, который можно отменить: живые обои и твики системы."
Description: |-
  LimeKit показывает видео, GIF, картинки и HTML-страницы вместо обоев рабочего стола, за значками, и содержит экран твиков Windows: Проводник, панель задач, «Пуск», оформление, советы и реклама Windows.
  Каждое изменение сначала записывается в журнал, поэтому его можно отменить точно: по одному твику, всё сразу или файлом .reg, который работает без LimeKit.
  Права администратора не нужны, меняются только настройки текущего пользователя, телеметрии нет.
InstallationNotes: |-
  LimeKit — переносимое приложение. Перед удалением пакета закрой LimeKit через трей («Выход»), открой настройки и нажми «Убрать LimeKit из системы»: твики откатятся, снимутся автозапуск и ассоциация файлов .limekit. Если удалить только пакет, всё это останется.
ManifestType: locale
ManifestVersion: 1.12.0
