PackageIdentifier: 2fame.LimeKit
PackageVersion: 0.3.0
PackageLocale: en-US
Publisher: 2fame
PublisherUrl: https://github.com/sweety1lime
PublisherSupportUrl: https://github.com/sweety1lime/limekit/issues
PackageName: LimeKit
PackageUrl: https://github.com/sweety1lime/limekit
License: GPL-3.0
LicenseUrl: https://github.com/sweety1lime/limekit/blob/v0.3.0/LICENSE
ShortDescription: "A Windows customization kit you can undo: live wallpapers and system tweaks."
Description: |-
  LimeKit plays video, GIF, image and HTML wallpapers behind the desktop icons, and has a screen of Windows tweaks for File Explorer, the taskbar, Start, appearance, and Windows tips and ads.
  Every tweak change is written to a journal before it is made, so it can be undone exactly: one tweak, everything at once, or as a .reg file that works without LimeKit.
  It needs no administrator rights, changes only the current user's settings and sends no telemetry.
  The interface is in Russian for now.
Tags:
- customization
- live-wallpaper
- tweaks
- wallpaper
- windows
ReleaseNotesUrl: https://github.com/sweety1lime/limekit/releases/tag/v0.3.0
InstallationNotes: |-
  LimeKit is a portable app. Before uninstalling the package, close LimeKit from the tray (Exit), open Settings and press «Убрать LimeKit из системы» (Remove LimeKit from the system). That undoes the tweaks and removes autostart and the .limekit file association. Removing the package alone leaves them in place.
