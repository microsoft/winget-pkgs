PackageIdentifier: 2716190547.ZMark
PackageVersion: 0.2.16
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 基于 Rust 与 GPUI 打造的原生本地 Markdown 编辑器、阅读器与 Mermaid 图表工作台。
Description: |-
  ZMark 是一款专注于本机文件、瞬时响应与原生排印质感的桌面 Markdown 与纯文本工作台，告别浏览器内核高内存占用与云端账号绑定。
  - GPU 原生桌面界面：采用 Rust 与 GPUI 构建，冷启动毫秒级响应，长篇技术文档、多代码块与复杂流程图滚动丝滑跟手。
  - 按语法块对齐的分屏预览：支持源码 / 分屏 / 预览三大视图随时切换，分屏模式下双侧按语法块位置精确对齐并平滑同步滚动。
  - 原生 Mermaid 图表与高清灯箱：无需外接浏览器，全本机将 Mermaid 流程图渲染为矢量 SVG；点击任意本地图片或流程图即可开启支持缩放与拖拽的高清灯箱。
  - 纯本地文件夹与草稿工作流：在一个侧栏里同时管理多个工作区文件夹、外部单文件与未保存草稿，数据完全保存在您的磁盘中。
Tags:
- markdown
- mermaid
- 图表
- 文本编辑器
- 本地优先
- 编辑器
ReleaseNotes: |-
  2026-11-28
  本版处理 GitHub issue #30（预览下编辑、多标签）：新增两个默认关闭的开关，一个是可选的标签条，一个是在预览中单击块进行就地编辑。同时修复了预览排版跳动、图片和图表加载、撤销历史等一批问题。
  新功能
  - 可选标签条（#30）：在「设置 > 编辑器与保存」打开「显示标签条」后，头部会按已打开的文档显示标签。点击切换，悬停显示 ×，有未保存改动时显示圆点，中键关闭，拖动可以调整顺序，双击当前标签改名。标签放不下时可以横向滚动，两侧有渐变提示。Ctrl+Tab / Ctrl+Shift+Tab 在文档间循环，macOS 用 Ctrl+1…9、Windows 和 Linux 用 Alt+1…9 按位置跳转，9 总是最后一个。这些快捷键在开关关闭时也可用。默认仍是无标签头部。
  - 预览中单击编辑（#30）：在「设置 > 编辑器与保存」打开「预览中点击编辑」后，在预览或分屏的预览侧单击段落、标题、列表、引用、表格或代码块，该块会就地换成它的 Markdown 源码编辑框，其他块保持渲染。撤销、自动保存和分屏源码侧与普通编辑共用，输入法照常可用。按 Esc、点击框外或把光标移出该块即退出并更新预览。拖动仍然是选择文字，链接、图片、复选框和复制按钮保持原有行为。代码块的编辑框会按语言实时着色。默认关闭。
  - 每个文档独立的撤销历史和位置：在文档间切换后，撤销和重做、光标、选区和预览滚动位置都会保留。后台文档的撤销历史合计上限 32 MiB，超出时先清最大的一份。
  - 选中状态滑动：头部的源码/分屏/预览切换、侧栏的文件/大纲页签、设置页的左侧导航、分段控件和开关，选中状态会滑向新选项，不再直接跳变。开启「减少动态效果」时直接切换。
  改进与修复
  - 欢迎页：「最近新增的功能」清单新增标签条、预览中编辑和快速打开文件（Cmd+O、侧栏的「打开文件或文件夹」、拖入窗口）三条引导，10 种语言同步。
  - 预览排版不再跳动：预览在同一帧内先量出可见块的真实高度再排版，重新解析、改行高、切换文档、调整窗口宽度时不再出现空行和跳动。图片和图表会记住上次的尺寸，再次加载时按原尺寸占位。
  - 文件夹展开收起：动画时长随展开的行数变化（160–450ms），长列表不再一闪而过。快速连点图标或行空白处会连续切换；双击名称仍是重命名。
  - Mermaid：图里以分号结尾的语句（例如 classDef a fill:#fff;、A --> B;）现在可以渲染，之前会报 UnexpectedToken。
  - 任务清单：预览中的复选框可以点击，会在源码里切换 [ ] / [x]，可撤销，勾选后立即更新。开着自动保存时，每次保存不再让标题闪一下。
  - 灯箱：滚轮和捏合缩放以鼠标位置为中心；缩放后图表高度不再闪一下。
  - 预览滚动：滚到底部后继续滚动，上部不再闪烁。
  - 预览行高：设置里的行高也作用于预览的正文、列表和代码块（默认 1.75 不变）。
  - 侧边栏：连续点击当前文件不再让预览频闪；置顶的图钉可以点击取消置顶，文件夹行的图钉移到行尾；文件夹右键菜单新增「新建文件」「新建文件夹」；大纲字号调到 13px。「在访达中显示」统一改为「在文件夹中显示」，并修复了 Windows 上点击没有反应的问题。
  - 后台文档从磁盘重新加载时会清空它的撤销历史，与当前文档一致。
  - 头部右侧的间距和右下角状态胶囊的圆角做了微调。
  已知限制
  - 块编辑里，点击位置换算成源码光标时，遇到 HTML 实体、转义字符或自动编号，可能偏几个字符。在编辑框里拖选不会自动滚动，也不支持中键列选。超过 24 KiB 或 600 行的代码块在编辑框里不着色。
  - 点击 Mermaid 图本身仍然打开灯箱；要编辑它的源码，点图两侧的空白处。
  - 标签条没有滚动箭头；标签拖到空白处放下不生效。
  - 首次加载的图片和 Mermaid 完成时，仍会让下面的内容下移一次。
  - Windows 上「在文件夹中显示」和 Alt+数字 快捷键，以及 macOS 上 Ctrl+Tab 是否被系统截走，需要在对应平台实机确认。
