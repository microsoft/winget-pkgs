- 编辑器
ReleaseNotes: |-
  2026-11-27
  本版处理 GitHub issue #27、#28、#29 的反馈：可分别选择正文和代码字体，修复从 Finder 打开文件时只显示欢迎页的问题，侧边栏和阅读栏宽度可以拖动调整，并重新整理了设置页。
  变更
  - 正文与代码字体（#27）：设置页可以从已安装字体中分别选择正文字体和代码字体，支持搜索。正文字体用于预览正文和整个界面，代码字体用于代码块和源码编辑器。选「系统默认」时使用平台默认字体，所选字体未安装时回退到平台默认字体。改字体后，编辑器折行和预览块高度会重新测量。
  - 从 Finder 打开文件（#28）：用「打开方式」或双击打开文件，冷启动和运行中都会直接打开该文件，不再停在欢迎页。
  - 灯箱缩放与平移（#28）：滚轮缩放方向跟随 macOS「自然滚动」设置。触控板支持捏合缩放和双指平移，Cmd + 滚动也能缩放，鼠标滚轮仍是缩放。
  - 欢迎页只显示一次（#28）：关闭欢迎页后，之后启动不再出现。可以在「设置 > 关于」里重新打开。欢迎页新增「最近新增的功能」一节，用可勾选的清单逐项引导字体、阅读宽度、侧栏宽度、置顶、灯箱手势和会话恢复，10 种语言同步更新。
  - 恢复上次会话：直接启动时会重新打开上次退出时开着的文件，并切回当时的文件。
  - 侧边栏（#28）：拖动侧边栏边缘可以调整宽度（180–480），双击恢复 250。在文件或文件夹的右键菜单中可以把它置顶到所在文件夹的最前面，重命名后置顶仍保留。
  - 阅读栏宽度：在预览中拖动正文栏左右边缘可以调整宽度（480–1600），双击恢复 760。「设置 > 编辑器」也提供 4 档预设。
  - 设置页重新整理：设置项按分组卡片排列，各控件样式统一。外观页的浅色、深色模式带窗口预览。「关于」页新增许可证入口，下载好更新后，检查更新按钮会变为「重启以更新」。
  - 许可证：ZMark 改为 MIT 或 Apache-2.0 双许可。macOS、Windows 和 Linux 安装包都附带许可证和第三方声明。
  - 性能测量（#29）：帧探针 ZMARK_FRAME_PROBE 新增拖选滚动、表格划词和窗口宽度调整三个场景，结果见 docs/plans/v0.2.15-plan.md。测量没有发现预览排版的明显瓶颈，#29 的优化项要先在报告问题的文档上复现再定。
  - 本机安装和应用内更新不再在「打开方式」菜单里留下多余的 ZMark 条目。
