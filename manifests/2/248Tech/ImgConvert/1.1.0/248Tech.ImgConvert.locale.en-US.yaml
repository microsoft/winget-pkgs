ShortDescription: Lightweight local GUI tool to batch-convert images between JPEG, PNG, WebP, GIF, TIFF, and HEIC.
Description: >-
  ImgConvert is a small, portable Windows GUI tool for batch-converting images
  between JPEG/JPG, PNG, WebP, GIF, TIFF/TIF, and HEIC/HEIF. Drag and drop
  files or folders, or paste a path directly. Includes an Explorer right-click
  "Convert To" menu, automatic EXIF orientation correction, a progress bar,
  and a light/dark theme toggle.
