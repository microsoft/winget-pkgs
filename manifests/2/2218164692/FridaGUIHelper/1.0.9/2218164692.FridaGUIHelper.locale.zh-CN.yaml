PackageIdentifier: 2218164692.FridaGUIHelper
PackageVersion: 1.0.9
PackageLocale: zh-CN
ShortDescription: 一个跨平台的 Frida 图形化辅助工具，用于管理设备、目标、脚本与 frida-server，完成 Android 注入工作流。
Description: Frida GUI Helper 是 Windows 上的 Frida 图形化辅助工具。它可以连接 ADB 设备、Attach 或 Spawn Android 目标，并管理可复用的运行配置（保存设备、包名或目标、注入模式、脚本快照、参数与 frida-server 路径）。它提供注入前环境检查、一键推送并重启匹配的 frida-server，并为每个会话保留独立的 stdout/stderr 日志、退出原因、退出码与运行时长。
