ReleaseNotes: |-
  Limitbar now shows Google's Antigravity limits beside Claude and Codex.
  Antigravity (Google's agy CLI with a Google AI Pro or Ultra sign-in) is a new built-in provider, AG. It draws two 5-hour pools: gem for Gemini models and 3p for the Claude and GPT-OSS models Antigravity also serves, with their reset times, and the tooltip shows the plan (Google AI Pro).
  It reads the sign-in agy keeps in Windows Credential Manager (gemini:antigravity) without refreshing or writing it; like the other built-ins it shows as idle once that token expires, until agy runs again.
  Signed-in PCs find it automatically; add { "provider": "antigravity" } to an explicit sources list.
