ShortDescription: Tiny Windows 11 taskbar widget that shows AI plan usage limits (Claude, Codex, Grok, Cursor) and any provider you add.
Description: |-
  Limitbar is a small native widget that docks inside the Windows 11 taskbar and shows how much of your AI plan limits you have used.
  Claude Code, Codex, Grok Build and Cursor Agent are detected automatically from their signed-in CLIs.
  Any other provider, API or quota can be added in the settings file as an http, command or file source, as many as you like, with custom labels, colours, bars and thresholds.
  One 0.55 MB exe with no runtime; it reads sign-ins read-only and never refreshes or logs tokens.
