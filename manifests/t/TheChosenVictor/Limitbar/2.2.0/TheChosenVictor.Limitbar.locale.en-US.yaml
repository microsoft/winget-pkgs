ReleaseNotes: |-
  Claude's new plan names: the tooltip and --probe say Ultra (formerly Max 20x) and Max (formerly Max 5x).
  No 5-hour bar where there is no 5-hour limit: a Claude source with the default bars draws only the weekly bar once its account has no 5-hour window; accounts that still have the limit keep both bars.
  install.ps1 starts Limitbar through Explorer, so the widget keeps running after the terminal that ran the script closes.
