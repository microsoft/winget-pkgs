ShortDescription: Tiny Windows 11 taskbar widget that shows AI plan usage limits (Claude, Codex, Grok, Cursor), any provider you add, and optionally this PC's CPU, memory and GPU load.
Description: |-
  Limitbar is a small native widget that docks inside the Windows 11 taskbar and shows how much of your AI plan limits you have used.
  Claude Code, Codex, Grok Build and Cursor Agent are detected automatically from their signed-in CLIs.
  Any other provider, API or quota can be added in the settings file as an http, command or file source, as many as you like, with custom labels, colours, bars and thresholds.
  An optional system source shows this PC's CPU, memory, GPU, disk and network load as Task Manager reports it, with the busiest processes in the tooltip.
  One 0.6 MB exe with no runtime; it reads sign-ins read-only and never refreshes or logs tokens.
