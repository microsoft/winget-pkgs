License: MIT
LicenseUrl: https://github.com/TheDeiw/Unity-project-CleanUp/blob/main/LICENSE
ShortDescription: Free up disk space taken by Unity project caches.
Description: |-
  Finds Unity projects in a folder, shows how much of each one is cache, and deletes the caches Unity can rebuild.
  Light clean removes the build cache (Library\Bee) without a reimport; full clean removes Library, Temp, obj and Logs.
  Assets, Packages and ProjectSettings are never touched, and projects open in the Unity Editor are skipped.
