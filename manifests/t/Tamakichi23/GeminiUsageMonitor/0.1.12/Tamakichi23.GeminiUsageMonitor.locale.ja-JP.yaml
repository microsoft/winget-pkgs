ShortDescription: Geminiの5時間枠と週次枠の残量をWindowsタスクバーに表示するアプリです
Description: >-
  Geminiの使用状況ページを読み取り、5時間枠と週次枠の残量・リセットまでの時間をWindowsタスクバーに表示する独立したアプリです。
  Geminiのページには動画生成専用の枠が表示されないため、動画生成も消費する共通枠を表示します。
  動作にはNode.js 22以降とGoogle Chromeが必要です。

PackageUrl: https://github.com/tamakichi23/Gemini-Usage-Monitor
ReleaseNotes: |-
  表示と更新機能を改善しました。
  - リセットまでの時間が長い場合も表示が切れないよう、タスクバー表示幅を拡張しました。
  - 二重にChromeを起動せず、既存の取得プロセスへ即時更新を依頼する通知領域メニューを追加しました。
  - Gemini使用量表示、アカウント切り替え、自動起動設定、ローカルプロファイルの動作を維持しています。
ReleaseNotesUrl: https://github.com/tamakichi23/Gemini-Usage-Monitor/releases/tag/v0.1.12
