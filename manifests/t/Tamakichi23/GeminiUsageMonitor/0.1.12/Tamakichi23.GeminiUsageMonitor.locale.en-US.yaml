ShortDescription: Displays Gemini five-hour and weekly quotas on the Windows taskbar
Description: >-
  An independent Windows taskbar app that displays the remaining shared Gemini
  five-hour and weekly usage quotas. A separate video-generation quota is not
  exposed by Gemini. Requires Node.js 22 or later and Google Chrome.

PackageUrl: https://github.com/tamakichi23/Gemini-Usage-Monitor
ReleaseNotes: |-
  Display and refresh improvements.
  - Widen the taskbar display so longer reset labels fit completely.
  - Add a tray-menu command that refreshes the existing collector without launching a second Chrome process.
  - Keep the Gemini quota display, account switching, startup controls, and local profile behavior.
