  - 感谢 @lanchengjiu 在 PR #70 中修复 Windows 项目归类和发送拒绝残留，原始提交 d62002b 保留在历史中。
  - 感谢 #67、#71 及回复阅读相关反馈；#46 的 Desktop 审查链接按上述边界处理。
