ReleaseNotes: |-
  本版扩展 Windows 网关的 WSL Codex / Claude Code CLI 接入，统一跨客户端新建项目，并完善回复阅读、消息队列和浏览器导航。桌面与手机 App 版本为 2.1.5，Android/iOS 构建号为 38。
  新增与改进
  - WSL Codex 与 Claude Code CLI：扫描并登记正在运行的发行版，在原 Linux 用户和配置目录中读取历史、显式继续或新建聊天；Codex 共用 APP / CLI / WSL 来源筛选，Claude 标注 CLI · WSL。按原生能力提供模型、推理、权限、Skill、审批、停止、文件、Git、附件、终端和通知；Codex 还支持原生 Goal 与持久队列。保留各环境的账号、工作目录、草稿、历史分页及操作回执；模型目录按身份缓存。被动浏览不唤醒已停止的发行版，关闭接入不退出原 CLI 任务，主题切换不重建 WSL Claude 会话。WSL 使用说明
  - WSL 账号与接入（实验性）：按发行版、用户和配置目录保存、导入及切换支持的 API 接入，并恢复原始文件配置。官方登录仍在原 WSL 完成；Windows 与 WSL 不自动同步凭据。切换前检查任务、审批、队列和未确认操作，空闲执行器正常交接，无法核验或外部工具管理的配置停止切换。此能力不保证所有账号与配置可用，尚未完成真实多账号全流程验证；保存或切换成功不代表上游认证成功。实验性账号说明
  - 跨客户端新建项目聊天：Codex App、本机/SSH CLI、WSL、Claude Desktop/CLI 和 DSH Desktop 共用运行环境及目录选择器，可选已有项目、浏览其他目录或在父目录中新建文件夹。沿用原生项目登记和权限；Claude 明确显示“创建并发送”，浏览目录本身不发送消息。新 SSH 目录、旧运行时及 DSH 连接器的能力边界见使用说明。
  - 回复审查、引用与附件：完整代码审查标记展示为可复制的审查卡，授权文件可打开并高亮对应代码行；后续操作按钮先追加到草稿，再由用户发送。Codex / Claude 支持消息和选中文字引用，保留原草稿并按会话恢复；图片预览可添加到当前聊天附件。文件引用和修改文件摘要提供受权限约束的位置链接，长摘要保留分页。codex://review 保留 Desktop 目标，识别到 GitHub PR 时提供网页入口；不承诺在手机复现 Desktop 专属审查状态。Mermaid 继续沿用已有预览能力。操作说明
  - 消息管理与多页面一致性（#71、PR #70）：在“更多 → 消息管理”中撤回未发送消息、原位编辑并保留附件和队列位置、调整网关实际发送顺序，以及核对或显式忽略未确认记录。已交给 Claude / DSH 原生客户端的队列仍由原客户端管理。修复明确拒绝发送后的残留与旧页面记录互相干扰；不清空其他页面请求，不自动重发未知结果，编辑冲突保留内容并支持重新打开管理器。消息管理
  - 返回与项目分组（#67、PR #70）：浏览器返回遵循聊天、工具与全屏层级，避免意外离开工作台；修复 Windows / UNC 项目归类，并按实际执行主机的路径规则分组。
  - 按需资源与弱网：聊天列表启动不再等待可选的文件和图表渲染器；打开对应功能时再加载，复用内容缓存并保留有限恢复。消息和配对等写入不自动重放。窄屏 WebKit 的 WSL 弹窗适配可用视区。
  - 客户端与手机生命周期：改善连接入口恢复、原生聊天输出与分页记录还原，保留客户端任务及接入身份；区分关闭 Bridge 接入、停止任务与退出桌面程序，避免误影响其他原生进程。
  贡献与反馈
