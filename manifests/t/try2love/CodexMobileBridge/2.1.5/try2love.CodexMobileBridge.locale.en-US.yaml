ReleaseNotes: |-
  v2.1.5 expands WSL CLI access, project creation, reply interactions and message management. Desktop/mobile version: 2.1.5, Android/iOS build 38.
  - WSL Codex and Claude Code: register running distributions and use their Linux user, configuration, account and workspace. Browse history, explicitly resume or create chats, and use native-supported models, reasoning, permissions, Skills, approvals, stop, files, Git, attachments, terminals and notifications. Codex also supports native Goal controls and durable queues. Preserve environment-scoped drafts, paging, receipts and identity-bound model caches. Passive reads do not wake stopped distributions; disconnecting Bridge does not quit original CLI tasks. Theme changes keep WSL Claude sessions intact. WSL guide
  - Experimental WSL account management: save, import, switch supported API connections and restore original file configuration per distribution/user/configuration directory. Official sign-in stays in WSL; Windows credentials are not synchronized automatically. Check tasks, approvals, queues and unconfirmed operations before graceful idle-runtime handoff; refuse unverifiable or externally managed configurations. Compatibility is not guaranteed, and real multi-account end-to-end validation remains incomplete. Saving or switching configuration does not establish upstream authentication. Account guide
  - New project chats: a shared environment/directory picker serves Codex App, local/SSH CLI, WSL, Claude Desktop/CLI and DSH Desktop. Browse existing directories or create a folder, retaining native registration and permissions. Claude explicitly uses Create and send. New SSH paths, older runtimes and DSH connector requirements retain the limits in the project guide.
  - Reply interactions: render complete code-review directives as copyable cards; open authorized code locations with line highlighting. Follow-up buttons append to the draft for explicit sending. Codex/Claude quotes preserve and restore scoped drafts, and image previews can add current-chat attachments. File citations and paged edited-file summaries link to authorized locations. Desktop review links retain their target, with a web action for recognized GitHub PRs; Desktop-only review state is not reproduced on mobile. Existing Mermaid preview remains available. Interaction guide
  - Message management and multiple pages (#71, PR #70): withdraw unsent messages, edit in place while retaining attachments and queue position, persist actual dispatch order, and reconcile or explicitly dismiss unconfirmed records. Claude/DSH native queues remain with their clients. Fix residual records after explicit rejection and interference from older pages. Preserve other pages' submissions, do not replay unknown outcomes, and retain conflicting edits for reopening. Message guide
  - Navigation and grouping (#67, PR #70): browser Back follows chat/tool/fullscreen navigation without unexpectedly leaving the workbench. Correct Windows/UNC project grouping using the execution host's path rules.
  - Resources and slow links: keep optional file/diagram renderers off chat-list startup, load them when needed, reuse cached content and retain bounded recovery. Writes are not replayed automatically. Fit WSL dialogs within narrow WebKit views.
  - Client and mobile lifecycle: improve connection-entry recovery and native-output/paged-history restoration while preserving task and connection identity. Keep Bridge disconnection, task stopping and desktop exit distinct.
  Install over the matching app without clearing data. Android retains its signing identity; iOS requires your own matching signing identity and app identifiers. Test apps remain separate. Refresh shared pages after updating the gateway; older Android apps may need More → Refresh page in the existing computer connection. WSL needs an installed, compatible native CLI; discovery neither installs nor automatically enables it. Experimental account configuration and simulated checks are not real multi-account authentication evidence. See verification coverage.
  Thanks to @we-worker for PR #64, with all eight original commits retained, and @lanchengjiu for PR #70, retaining original commit d62002b in ancestry. Thanks to reporters of #67, #71 and reply-interaction issues; #46 Desktop review links retain the limits above.
