ReleaseNotes: |-
  v2.1.7 improves mobile notifications, session organization and connection recovery. Desktop/mobile version: 2.1.7, Android/iOS build 40.
  - Android background notifications: optional reception while away from the app, with pause controls and improved notification navigation that preserves existing pages and drafts. Disabled by default. #47, PR #85.
  - Mobile preferences: choose notification sources per saved connection; unify light, dark and system themes on Android/iOS, improve iOS foreground notifications and refine the Android gateway menu. PR #85, PR #95.
  - Session organization: shared long-press, right-click and title menus for details, renaming, pinning, copying, projects and sections. Use native operations where supported and clearly label Bridge-only categories. Unknown writes are not replayed. PR #92, #77.
  - Project references and images: reference files/folders within the current host project without downloading them to the phone; preserve drafts and use each client's native attachment/reference format. Preview Claude/DSH history images on demand. #102, #99.
  - Chat reading: language labels and syntax highlighting with original-text copying; collapsible identified DSH context and shared running/approval/error status. Status indicators do not imply token streaming. #104, #101, #98.
  - Projects and DSH: remote workspace trust confirmation for supported Codex App/Claude Desktop Code connections, improved Codex SSH project registration/grouping, generic DSH plugin binding and separate native DSH Mobile links. #100, #91.
  - Optional reset outlook: third-party Codex reset information and optional reminders, disabled by default; not an official guarantee or personal account quota. PR #86.
  - Startup and remote recovery: fix Safari error attribution and failed-resource retries while retaining normal caching; isolate offline SSH hosts, add backoff/manual retry, and improve SSH models and Skill loading. #87, PR #88, #90.
  - Connection and sending: rebuild supported Desktop connections; reconcile accepted messages using receipts or matching durable native records without resending or discarding newer draft edits. Codex internal routing limitations remain tracked in #103.
  - Other fixes: WSL Codex timeline/write deadlocks, unanswered cards disappearing across turns, incorrect Claude model-identity errors, attachment picker recovery and connector compatibility. Restore display math immediately after prose. #94, PR #96, #99, #102. Explicit task failures/blocks can now trigger existing attention notifications (#47).
  Install over the matching app without clearing data. Retain Android signing and use matching iOS identifiers and your own signing identity. Update the gateway and mobile app, then refresh shared pages. Android background notifications require permission and remain subject to power management; iOS improvements cover foreground notifications, not new APNs background push. DSH compatibility depends on the client and running plugin. Bridge-only categories do not modify native clients. Archive limitations (#77), native routing limitations (#103) and experimental WSL account management remain. See verification coverage.
  Thanks to @heiqiu47 for PRs #85, #86, #92, #95; @mc373906408 (waken) for #88; and @littltstream for #96. Original author commits are retained. Thanks to the issue reporters and testers, including @SevenPwZ for #103.
