ReleaseNotes: |-
  本次更新完善手机通知和会话管理，增加项目文件引用与历史图片预览，并修复弱网发送、SSH 离线和部分桌面会话连接异常。桌面与手机 App 版本为 2.1.7，Android/iOS 构建号为 40。
  新增与优化
  - Android 后台任务通知：可手动开启后台接收，在离开 App 后继续接收任务提醒。点击通知返回聊天时复用已有页面和草稿，减少重复加载。默认关闭，可随时暂停。Issue #47 · PR #85
  - 通知来源与手机外观：按保存的连接地址分别启停任务提醒，减少多个入口重复通知；Android 与 iOS 统一支持浅色、深色及跟随系统。改善 iOS 前台通知，重新整理 Android 电脑选项菜单的分组、触摸区域和返回操作。PR #85 · PR #95
  - 统一会话菜单与分类整理：长按、右键或标题入口集中提供详情、改名、置顶、复制、项目和分区整理。支持原生操作时同步原客户端；Bridge 显示分类明确标注“仅在 Bridge 中生效”。菜单返回和下拉关闭保持一致；分类结果未确认时不重复提交。PR #92 · Issue #77
  - 引用宿主机项目文件：附件入口可选择当前项目内的文件或文件夹，追加到草稿后发送，无需下载到手机再上传。Codex、Claude 和 DSH 使用各自的附件或引用格式；支持的文件链接可进入已有文件页面定位和预览。Issue #102
  - 历史图片预览：Claude 与 DSH 的历史图片支持按需加载、预览和缩放，避免历史刷新反复传输原图。Issue #99
  - 聊天阅读与任务状态：代码块增加语言标签和语法高亮，保留原文复制；DSH 已识别的注入上下文默认折叠。聊天统一显示运行中、等待审批及异常状态；本版不将这些状态提示描述为逐字流式输出。Issue #104 · Issue #101 · Issue #98
  - 项目创建与信任确认：支持的 Codex App 和 Claude Desktop Code 接入可在远端确认工作区信任，明确展示环境与完整路径；完善 Codex SSH 项目登记和列表归类。取消后保留输入，信任确认不会自动发送首条消息。Issue #100
  - DSH 双路线接入：增加通用插件及显式实例绑定，手机 App 也可添加原生 DSH Mobile 链接。原生 Mobile 页面与 Bridge 统一聊天界面独立使用；兼容范围以客户端和插件版本核验为准。Issue #91
  - 可选 Codex 重置动态：增加第三方重置动态查询和可选提醒，默认关闭并标明数据来源；不代表官方承诺或个人账号的实际额度。PR #86
  问题修复
  - 修复 Safari 中部分无关脚本异常触发“工作台尚未加载完成”的问题，改善失败资源重试，同时保留正常请求的缓存复用。Issue #87 · PR #88
  - 隔离离线 SSH 主机的慢请求，避免拖慢本机会话连接、账号查询和通知；增加失败退避与手动重试。改善 SSH 模型目录与 Skill 的读取和缓存复用。Issue #90
  - 为部分 Codex Desktop 异常提供“重建连接”入口；失败后可进入应用管理，在任务保护和明确确认下处理原生应用。原客户端内部路由异常仍有恢复限制，继续由 Issue #103 跟踪。
  - 改善已提交消息的确认恢复：依据发送回执或匹配的原生持久记录核对，不自动重发；只清理对应已提交草稿，保留用户后续编辑。
  - 修复 Windows WSL Codex 的部分时间线与写入互相等待问题，以及跨轮次回答问题卡片后其他未答卡片消失的问题。
  - 修复 Claude 模型设置中部分错误的“账号已切换”提示，保留模型来源、账号隔离及思考强度信息；完善支持原生设置时的手动模型入口。
  - 修复紧接正文的块公式解析和渲染，保留 TeX 原文。Issue #94 · PR #96
  - 改善附件选择取消后的恢复、Claude 配置目录识别、DSH 接入组件升级兼容性和回复模型信息显示。Issue #99 · Issue #102
  - 增加任务明确失败或阻塞时的“需要你处理”提醒，复用现有通知策略与去重机制。Issue #47
