  - 感谢 @mc373906408（waken） 的 Safari 启动错误识别与失败资源恢复：PR #88。
  - 感谢 @littltstream 的块公式渲染修复：PR #96。
  - 原作者提交完整保留，整合调整另行记录。感谢相关 Issue 的建议和复测，以及 @SevenPwZ 对 #103 的故障反馈。
