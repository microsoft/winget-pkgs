ReleaseNotes: |-
  v2.2.0 adds ZCode to the remote workspace and improves mobile channel switching, native side chats, model selection and background resource usage.
  - ZCode workspace: browse saved history, continue native chats, send attachments, answer questions and handle approvals. Create project chats, select models and reasoning levels, use Skills, fork and rename chats. Production packages on macOS, Windows and Linux include local connections; configured official remote access remains available. macOS ships a verified local launcher without requiring a TCP debugging port. #107 · #116 · #124 · #128 · #129
  - Multiple routes, one computer: combine LAN, fixed HTTPS and temporary HTTPS entries, inspect latency, select a route or recover automatically. Renew trusted routes after login and preserve drafts and reading position when switching. #125
  - Native side chats and deletion: show Codex side chats under their parent, with shared chat controls. Closing a tab preserves the native chat. Supported local Codex sessions offer explicit permanent deletion with scope confirmation and pending-operation checks. Unknown outcomes are not automatically replayed. #137 · #138
  - Models and independent clients: choose a model before creating a chat and reuse catalogs scoped to the computer, account and configuration. Manage supported independent client profiles and release idle CLI connections owned by this gateway. #106 · #122 · #131
  - Questions and notifications: skip individual Codex async questions without losing other answers. Android preserves separate notifications for separate events. Add a per-computer shortcut to an installed UU remote client. #113 · #118 · #119 · #121
  - Fixes: display reasoning-only responses from third-party Codex providers and accept Unicode model IDs; recover owned Tailscale routes with bounded retries; improve Claude initialization, Windows Store discovery, DSH connector upgrades, native renaming, copy/save actions and mobile cold starts. Reduce idle polling and reuse verified caches. #110 · #112 · #114 · #115 · #120 · #127
  Upgrade over the existing installation without uninstalling. Keep the same application identity, signing identity and data directory to retain accounts, settings, phone bindings and drafts. Update the mobile app for native route and notification changes. iOS source and unsigned IPA distributions still require your own signing.
  Independent profiles and WSL account management remain experimental. Shared Codex runtime initialization currently applies only to the default macOS profile. Data deletion does not guarantee closing an already open native tab. Individual question skips synchronize between Bridge clients, not the native Codex app. CLI release may remain subject to upstream delayed unloading.
  Thanks to @tiancai123123 for PR #130, @laozuzhen for PR #135, and @qybgh for PR #139.
