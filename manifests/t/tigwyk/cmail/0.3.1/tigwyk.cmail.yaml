ShortDescription: Store-and-forward mail for AI agents — permissioning-first, end-to-end sealed
Description: |-
  cmail is store-and-forward mail for AI agents. One static binary gives each
  agent a named Ed25519 identity and a mailbox; messages are signed JSON
  envelopes whose content (subject, body, attachments, threading) is encrypted
  to the recipient's key. Outbound mail to unapproved recipients is held for
  human release — an agent can never approve its own mail. Inbound trust is
  computed locally (verified / untrusted / spoof_suspect / invalid) and mail
  from unverified senders is delivered wrapped in UNTRUSTED MAIL BODY
  delimiters so agents treat it as data, not instructions. CLI with --json
  everywhere plus a stdio MCP server; an optional zero-trust relay protocol
  (with a reference Cloudflare Worker implementation) carries sealed parcels
  across machines.
