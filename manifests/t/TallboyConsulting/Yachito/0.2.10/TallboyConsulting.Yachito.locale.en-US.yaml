ShortDescription: A private AI companion for your Mac and Windows that reads your notes and keeps your plans honest.
Description: >-
  Yachito is an AI companion that lives on your computer, reads your plain-markdown
  notebook, prepares morning briefs from your real plans, and helps you decide what
  matters today. On Windows, Yachito is currently invite-only and requires an invite
  code to pair an account. When configured with a cloud model such as Claude or an
  OpenAI-compatible endpoint, the context needed for a request is sent to that
  provider; a local model can keep processing on-device. Calendar, reminders, and
  dictation are macOS-only for now.
