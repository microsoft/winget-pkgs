ShortDescription: Voice typing for any app. Hold a key, talk, and cleaned-up text is pasted at the cursor.
Description: |-
  OpenTypeless is an open-source voice typing app. Hold a hotkey (Right Alt by default) and talk; your speech is
  transcribed and cleaned up (filler words removed, self-corrections resolved, punctuation fixed) and pasted where
  your cursor is. Bring your own API key: OpenRouter, OpenAI, Groq, SiliconFlow, DeepSeek or any OpenAI-compatible
  endpoint. It lives in the notification area and updates itself.
