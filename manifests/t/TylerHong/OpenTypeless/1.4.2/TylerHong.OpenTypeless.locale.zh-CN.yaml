PackageIdentifier: TylerHong.OpenTypeless
PackageVersion: 1.4.2
PackageLocale: zh-CN
Publisher: TylerHong
PackageName: OpenTypeless
License: MIT
ShortDescription: 在任何应用里语音输入：按住快捷键说话，整理好的文字直接粘贴到光标处。
Description: |-
  OpenTypeless 是一个开源的语音输入工具。按住快捷键（默认右 Alt）说话，语音会被转成文字并自动整理（去掉口头禅、
  处理说错改口、修正标点），然后粘贴到光标所在位置。使用你自己的 API Key：OpenRouter、OpenAI、Groq、SiliconFlow、
  DeepSeek 或任何兼容 OpenAI 的服务。常驻在任务栏通知区域，并会自动更新。
Tags:
