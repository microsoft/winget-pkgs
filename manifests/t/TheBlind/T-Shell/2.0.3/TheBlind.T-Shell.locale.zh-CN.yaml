ReleaseNotes: |-
  ✨新增：MCP 支持 SFTP 文件传输
  ✨新增：MCP 提供类型化会话能力
  ✨更新：会话搜索支持名称/IP 包含匹配，并增加搜索结果高亮
  ✨更新：优化 SSH 底部工具栏布局
  ✨更新：优化命令提示与历史命令搜索
  🐶修复：macOS 下终端按键偶发重复或无法输入
  🐶修复：SFTP 文件管理器首次打开时目录加载失败
  🐶修复：SFTP 文件预览与文件传输相关问题
  🐶修复：终端离线时仍持续进行资源轮询
