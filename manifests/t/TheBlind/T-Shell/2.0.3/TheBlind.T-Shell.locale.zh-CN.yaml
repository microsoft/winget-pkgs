Description: |-
  T-Shell（TheBlindShell）是一个可配置命令提示的终端模拟器和 SSH 客户端，目前只支持 Windows
  - 集成 SSH
  - 本机操作（设计中）
  - 定制主题和配色方案（设计中）
  - 快捷命令提示 一次编写,处处运行
  - 支持 Linux 中的终端如：bash、zsh
  - 支持 中文
  - 支持 SFTP
