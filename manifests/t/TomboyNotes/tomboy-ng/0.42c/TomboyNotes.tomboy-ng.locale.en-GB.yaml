ReleaseNotes: |-
  This release page contains tomboy-ng v0.42c. A beta release is not as well tested as a formal release, this one has a number of small bug fixes and introduces a new and seriously untested Sync Model, Misty. Further, we finally have the long awaited GTK3 version of tomboy-ng. Care is needed and if you spot a problem, PLEASE report it.
  Bug Fixes
  - when searching, an opening note should jump to term even if wrapped in inverted commas.
  - Bug when renaming a notebook.
  - Bug where a newline would be added at the end of certain notes
  - Occasional crash when starting github sync.
  - Better triple click to select a sentence.
  - Lots of changes to accommodate GTK3.
  New Features
  tomboy-ng-gtk3 - find it below, as a deb, tomboy-ng_0.42c-0_amd64GTK3.deb or tomboy-ngGTK3-0.42c-1.x86_64.rpm. Does need a distro dated later than, eg 2004.
  Misty - a stand alone webservice server that allows you to sync between tomboy-ng installs. At present, the server only runs on Linux and Windows but you can connect to it with tomboy-ng running on Linux, Windows or Mac (Mac tomboy-ng 0.42c yet to come). Its small, very easy to get running (compared to file sync) and fast (compared to github sync). It does only the sync part, does not offer a web based view of your notes (but I might add that, depending on feedback).
  Misty can be used in two modes, a very easy setup but very insecure mode (suited to secure home networks only) or a mode that uses SSL and a password and is reasonably secure. Please read the note file in the misty package carefully.
  Misty is a separate download, no installer, just a tarball containing the binary and a (tomboy) note file with instructions (Left click note and choose tomboy-ng). There is an arm32 (ie Raspberry Pi), an x86_64 linux or Win64 packages to download below. Misty requires at least tomboy-ng 0.42c or later, anything earlier than this does not offer Misty as a Sync choice.
  Read more about Misty here https://github.com/tomboy-notes/tomboy-ng/tree/master/experimental/Misty-Small but download it from here, the normal tomboy-ng (beta?) releases page.
  Above all else, remember Misty is a experimental package, be careful, take good backups (tomboy-ng makes that easy) and report what you find.
  Note : Github likes to hide some of the download files. Please click the word "Assets" immediately below here and, perhaps "Show all assets" below the list of download files if you don't see the one you want.
  History :
