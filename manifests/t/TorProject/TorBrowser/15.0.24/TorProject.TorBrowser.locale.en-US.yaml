ReleaseNotes: |-
  Windows Package Signature Issue
  The DigiCert EV code‑signing certificate we use to sign Windows installation packages expired on September 1st and is being renewed. This delay caused Windows users installing Tor Browser 15.0.21 and 15.0.22 from scratch to see “bad signature” warnings. As a temporary workaround, Windows users can install Tor Browser 15.0.20 (the latest correctly signed version) and rely on automatic updates (signed with a different key) to reach the current version. Users who prefer to download the latest version directly, ignoring the certificate expiration warning, can do so from the Tor Project distribution directory.

  New PGP subkey
  This release is signed using a new subkey. If you previously used GPG to verify Tor Browser downloads, you may need to refresh the Tor Browser signing key (0xEF6E286DDA85EA2A4BA7DE684E2C6E8793298290) in your local keyring. See the signature verification page for details.

  Send us your feedback
  If you find a bug or have a suggestion for how we could improve this release, please let us know.

