ShortDescription: A classic file manager experience for Windows 11, inspired by Thunar.
Description: |-
  WinThunar is a free, open-source file manager for Windows 11 inspired by Thunar, the Xfce
  file manager. It has a menu bar, location bar and side pane, plus tabs, split panes, a bulk
  rename with a preview, filtered search, Undo for file operations, and a PowerShell panel that
  follows the active folder. It is an independent implementation, not an official Thunar or
  Xfce project. Installed copies update themselves from GitHub Releases.
