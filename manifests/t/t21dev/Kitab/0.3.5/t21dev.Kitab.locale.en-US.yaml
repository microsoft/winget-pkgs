ShortDescription: A fast, native reader for PDF, EPUB, Markdown and comics.
Description: |-
  Kitab Reader is a free, open-source desktop reader for PDF, EPUB, MOBI, FB2, CBZ, XPS, TXT and Markdown.
  It is written in Rust and drawn on the GPU with GPUI, with MuPDF rendering the pages and no browser engine inside.
  It has tabs, a library with covers and collections, search, bookmarks, highlights and notes saved into PDFs,
  PDF forms, password-protected PDFs, digital signatures and printing. No account and no telemetry.
