ShortDescription: Lossless file compression with a command line and a desktop GUI.
Description: VectorZip squeezes files losslessly into its own .vzip format — LZ77 and Huffman coding in chunks, every chunk checked with CRC32 — and fails loudly if data is ever corrupt instead of handing back a partial file. One file is the whole tool, a command line for scripts and a desktop GUI for people, running portably with nothing to install. Free and open source.
