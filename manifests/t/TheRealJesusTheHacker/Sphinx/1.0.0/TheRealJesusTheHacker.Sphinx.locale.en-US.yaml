ShortDescription: Free ad and tracker blocker - every request gets questioned.
Description: Sphinx is Sentinel Safeguard's free ad and tracker blocker. On Windows
  it filters at the DNS level on your own machine - lookups for known ad and
  tracker domains are refused before anything loads, and everything else passes
  straight through. No remote servers, and your traffic never leaves your PC
  for filtering. It ships with a built-in blocklist of 71,491 domains, filter
  profiles, and list updates that only happen when you ask. One honest limit -
  ads served from the same domain as the content itself, like YouTube's, cannot
  be blocked at the network layer, by Sphinx or anyone. Uninstalling puts your
  saved DNS settings back first and aborts if it cannot verify them. Free and
  open source under MIT. Also available for Android and Debian.
