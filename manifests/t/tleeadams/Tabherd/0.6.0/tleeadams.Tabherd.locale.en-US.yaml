ShortDescription: A dashboard for your Claude Code and Codex sessions, showing which need you, which are working, and what they last said.
Description: |-
  Tabherd lists the coding agent sessions running on your computer, from Claude Code, Codex, GitHub Copilot CLI, OpenCode and Cursor CLI, and shows what each one is doing: which ones need you, which are working, and what they last said. It can go to a session's terminal tab, ask it to catch you up, show the tickets it's working on, and open new sessions in a repo or a to-do's folder. It's a desktop app with a window of its own, and it runs entirely on your computer. Tabherd is an independent project, not made or endorsed by Anthropic, OpenAI or GitHub.
