Description: |-
  Tabherd lists every Claude Code session running on your computer and shows what each one is doing: which ones need you, which are working, and what they last said. It can go to a session's terminal tab, ask it to catch you up, and open Claude in a repo or a to-do's folder. It runs entirely on your computer. Tabherd is an independent project, not made or endorsed by Anthropic.
