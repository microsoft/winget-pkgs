PackageLocale: zh-CN
ShortDescription: TypeScript 编译器（tsc）的 Rust 移植版本。
Description: |-
  ts-rust（又名 tsc-rs）是 TypeScript 7 编译器、类型检查器和语言服务器的实验性 Rust 移植版本。

  它保持与 `tsc` 相同的命令行、语言服务器和 API，因此可以作为 TypeScript 编译器的直接替换；`lib.*.d.ts` 库文件与可执行文件一同发布。
