ShortDescription: Rust port of the TypeScript compiler (tsc).
Description: |-
  ts-rust (aka tsc-rs) is an experimental Rust port of the TypeScript 7 compiler, checker, and language server.

  It keeps the same command line (`tsc`), language server and API, so it can be used as a drop-in replacement for the TypeScript compiler, and it bundles the `lib.*.d.ts` library files next to the executable.
