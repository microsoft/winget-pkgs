PackageIdentifier: Technicalflight.AiGuard
PackageVersion: 0.1.1
PackageLocale: en-US
ShortDescription: A local-first security gateway for AI traffic.
Description: AiGuard is a local-first security gateway for AI traffic. It takes over HTTPS traffic destined for AI services through a local MITM reverse proxy, replaces sensitive values such as ID numbers, phone numbers, bank cards, emails, API keys, and IP addresses with reversible placeholders before requests leave the machine, and streams them back into the real data locally when the AI reply arrives. The original text never leaves the machine and never touches disk, and seven risk signals such as error-message leaks and model-swap attacks are detected.
