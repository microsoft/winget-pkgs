ShortDescription: Launcher and scheduler - pin apps, scripts, folders and URLs, and run anything at a set time, on an interval or at startup.
Description: |
  FlowDesk is a unified task launcher and scheduler. Pin apps, scripts, folders, and URLs, organise them into categories, and schedule anything to run at a time or interval — with optional UAC elevation. Import and export your setup as JSON. Everything in one tight interface, nothing in the system tray you didn't ask for.

  Free for personal use; business or commercial use requires a paid license.
Moniker: tapatch-flowdesk
Tags:
- launcher
- app-launcher
- scheduler
- task-scheduler
- automation
- productivity
- shortcuts
ReleaseNotes: |
  - The admin helper only takes requests from FlowDesk itself, so other programs can't use it to run things as administrator
  - Stopping a flow only closes what that flow started, not every program with the same name (like all of Chrome)
  - Stopping one admin flow no longer stops your other admin flows
  - Imported flows get their own IDs, so starting or stopping one no longer affects another
