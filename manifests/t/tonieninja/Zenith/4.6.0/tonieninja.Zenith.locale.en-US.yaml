ShortDescription: Unofficial YouTube Music desktop player with synced lyrics, an EQ and a phone remote.
Description: Zenith is a free, open source desktop player for YouTube Music built with Tauri and Rust. It has synced lyrics with karaoke fill, a 15-band EQ, crossfade and gapless playback, offline downloads, Last.fm and Discord, and a phone remote over your local network. No ads, no telemetry. Not affiliated with Google or YouTube.
