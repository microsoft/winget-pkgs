Description: SpaceLens CLI scans Windows storage, builds a persistent SQLite index, and reports size, activity, classification, and verified duplicates. It cannot delete, recycle, move, or restore files. capabilities --json reports filesystem_mutation false. This is the optional CLI-only package. Do not install it alongside the complete tungcorn.SpaceLens product, which already includes this CLI.
