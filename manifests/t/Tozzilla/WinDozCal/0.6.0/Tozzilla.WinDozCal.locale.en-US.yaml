ShortDescription: Open source desktop calendar for Windows 11 with Google Calendar and CalDAV sync.
Description: |-
  WinDozCal is a local-first desktop calendar for Windows 11. It shows Google Calendar, CalDAV (Nextcloud, Radicale, Baïkal, iCloud and other standard servers) and purely local calendars side by side, works offline and syncs in the background.
  Day, Week, Month and Agenda views, drag and drop, recurring events, native notifications, system tray, quick add, ISO week numbers, public holidays and moon phases. Interface in English, Italian, Spanish, French and German.
  Tokens and passwords are stored only in Windows Credential Manager; there is no WinDozCal server and no telemetry.
