Description: Trancy Air 是一款以快捷键为核心的桌面翻译工具。选中句子或单词即可获得即时翻译，附发音、释义与例句；用自己的语言输入，一键原位替换为目标语言；按住快捷键说话，即可将语音转为译文。它还提供截图翻译、多 AI 引擎对比翻译、句子切分与语法分析、词卡收藏与口语跟读评分，并可与 Trancy Learning Center 同步。
