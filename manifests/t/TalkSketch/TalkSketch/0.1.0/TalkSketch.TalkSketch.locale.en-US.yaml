ShortDescription: AI meeting partner with live notes, decisions and a local whiteboard.
Description: >-
  TalkSketch listens to any audio on your laptop - Meet, Zoom, Teams, WhatsApp or a
  YouTube lecture - and writes structured notes while you talk. It captures system
  audio and your microphone locally, sends short chunks to a cloud speech-to-text
  service, and turns the transcript into decisions, action items, open questions and
  an Excalidraw board. No bot joins the call and your sessions stay on your disk.
