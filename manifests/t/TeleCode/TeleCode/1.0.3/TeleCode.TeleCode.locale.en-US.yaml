ShortDescription: A real terminal to your own computers, from your phone, tablet, browser, or another desktop.
Description: |-
  TeleCode gives you a real terminal to your own machines from any device. Install the host on the computers you want to reach and sign in; sessions keep running on the host even when you disconnect. Built for AI-agent workflows: one-tap launch for Claude Code and other coding CLIs, push notifications when an agent finishes or needs input, voice input, a file browser with live previews, and per-project workspaces. Connections are peer-to-peer where possible with an encrypted relay fallback, and end-to-end encrypted with the Noise protocol.
