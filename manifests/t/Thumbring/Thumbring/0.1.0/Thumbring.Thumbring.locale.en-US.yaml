ShortDescription: Mouse gestures and a radial action ring for Windows, on any mouse.
Description: |-
  Hold Forward and a ring of actions opens around the cursor. Hold Back and drag to run a gesture.
  A quick tap on either button still goes back or forward, as it always did.

  The ring has 8 slots, and each one holds an action or a folder with up to 9 actions. A gesture,
  like a ring action, can press a keyboard shortcut or a media key, open an app, a file, a folder
  or a URL, or run a built-in action (screenshot, emoji panel, File Explorer, lock screen).
  Profiles change the gestures in the apps you choose, and a settings window with a live preview
  edits the ring, the gestures, the buttons, the colors and the animation. Gestures and the ring
  can each use Back, Forward or the middle button, so a mouse without side buttons works too.

  Thumbring is light: a small program that sleeps until you hold a mouse button. It needs no
  account, collects nothing, makes no network connections, and it is free and open source.
