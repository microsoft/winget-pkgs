ShortDescription: Turn your HOTAS into a smart cockpit with virtual controls, macros, vJoy output and an in-game overlay.
Description: |-
  Trimcraft is an open source configuration tool for joysticks, throttles, pedals and button boxes in flight and space sims.
  Build virtual radios, toggles, momentary controls, counters and modes on top of your physical controls, recognise rotary encoders by their behaviour, and trigger keyboard and mouse macros, speech, sounds, volume and media keys, program launches, HTTP requests, Discord, Soundpad, Voicemeeter and vJoy actions.
  A transparent, click-through overlay shows your controls above the game. Trimcraft never injects into game processes, so it stays compatible with kernel anti-cheat.
  Early access: expect bugs and breaking changes between versions.
