ReleaseNotes: |-
  The Modular Foundations Upgrade
  This release is a big step toward a more modular, reliable OpenHuman—tightening core infrastructure, strengthening security boundaries, and improving the day-to-day desktop experience. 🎉
  Highlights
  Voice & realtime sessions 🎙️
  Voice got a major evolution: the local Whisper STT path was removed in favor of configurable hosted engines, ElevenLabs Scribe STT support landed, and realtime ElevenLabs voice gained a ton of stability polish—thread pinning, better failure messaging, longer background turn ceilings, and even mascot lip-sync during realtime calls. Along the way, voice internals were hardened with a tinyvoice extraction and fixes across capture/VAD/session handling.
  (#5489, #5536, #5546, #5547, #5550, #5549, #5554, #5557) — Thank you @Shanu, @YellowSnnowmann, and @senamakel!
  Memory system, extraction & policy guards 🧠
  Memory is being reshaped into a clean, vendor-backed subsystem: the memory surface was extracted into tinymemory, upgraded into a module-backed architecture, and expanded with new capability families (including chunks, retrieval, profile, and scoped retrieval). Just as importantly, guardrails tightened—MemoryGuard enforcement, allowlists, SSRF protections in sources, and better workspace/config scoping help ensure memory access stays policy-compliant and predictable.
  (#5446, #5470, #5480, #5487, #5490, #5512, #5564, #5566, #5587, #5608, #5620, #5639, #5657, #5575, #5531) — Thank you @senamakel, @Shanu, @YellowSnnowmann, and @M3gA-Mind!
  Desktop UI refresh & navigation polish 🖥️
  The desktop shell got a notable visual upgrade: a rebuilt “chrome + inset content card” layout, refreshed conversation list styling, improved header/fade behavior, and app-wide thin theme-tinted auto-hiding scrollbars. Navigation typography and selection styling were unified, and window restore/open behavior was tightened for a more consistent feel across launches.
  (#5442) — Thank you @graycyrus and @cyrus@tinyhumans.ai!
  Runtime & platform modernization ⚙️
  Core runtime work moved fast: the custom CEF runtime was removed in favor of upstream Wry, the event bus was replaced with tinybus, and the managed Node.js runtime was gated behind runtime-node. There’s also a deliberate cleanup of CDP-related surfaces (scanners/meet/transport) and a broad effort to keep builds and tests aligned with the new runtime foundations.
  (#5456, #5459, #5397, #5482, #5483, #5486) — Thank you @senamakel and @M3gA-Mind!
  Security, workspace boundaries & safer tooling 🔐
  This range includes several important hardening passes: keyring concurrency/race fixes, stronger workspace/path checks for policy files, safer handling of untrusted git/workspace configuration, and improvements to origin/workspace propagation across spawned agents and tools. The result is a safer runtime model with clearer boundaries and fewer “surprising” edge cases.
  (#5436, #5493, #5452, #5514) — Thank you @senamakel, @M3gA-Mind, and @YellowSnnowmann!
  Agents, coding capability & developer tooling 🤖
  Agent capability expanded with a coding-capable master agent and better embedder observability (including rooting turns in directories and improved turn/origin handling). Power users also get new tooling: model/provider CLI overrides, a new TUI “agent cockpit,” and foundational work toward native modules (including tinydocs and module host documentation).
  (#5460, #5465, #5532, #5535, #5491) — Thank you @senamakel!
  Web3 wallet module evolution 💳
  Wallet support moved decisively toward a module-driven future: tinywallet was introduced and iterated rapidly, signing flows were modernized, validation and transport were hardened, and multiple chains (EVM, Tron, BTC, Solana) saw refactors toward shared, attested primitives. This is a foundational shift toward safer, more consistent multi-chain behavior.
  (#5476, #5495, #5533, #5548, #5544) — Thank you @senamakel!
  Hosting tools & deployment workflows 🚀
  A new hosting domain arrived—letting you deploy a workspace to a real hosting provider—plus follow-on tooling for rollback, deployment history, and domain status. Debug output redaction and env handling improvements help keep hosting safer and easier to operate.
  (#5578, #5593, #5619) — Thank you @senamakel and @M3gA-Mind!
  Reliability, CI & release pipeline improvements 🧪
  There’s substantial investment in keeping CI and releases robust through big platform transitions: build-time phases, coverage correctness (including “presence” gating), Linux release unblocks, vendored submodule initialization in release Docker builds, and improved signing checks for updater artifacts. This also includes compatibility fixes like lowering the Safari build target so Wry renders properly on macOS 12.3+.
  (#5453, #5454, #5469, #5475, #5502, #5522, #5576, #5580, #5596, #5609, #5610, #5616, #5621, #5659, #5558) — Thank you @senamakel, @M3gA-Mind, and @YellowSnnowmann!
  Community & feedback experience 💬
  Feedback UX improvements surfaced quality tiers in the composer and made diffs easier to review, while tightening logging to avoid leaking raw error payloads. On the community side, GitHub Discussions and templates were added to help route questions, support, and show-and-tell into the right place.
  (#5431, #5569) — Thank you @CodeGhost21, @GhostScripter, and @senamakel!
  Flows upgrades & vendor updates 🧩
  Flows continued to mature with multiple TinyFlows upgrades (including host seam adaptations) and better shell authoring contracts. Several dependency/vendor bumps support the broader modularization work and keep the system aligned with the latest tiny-* stack.
  (#5520, #5529, #5537, #5543, #5555, #5577) — Thank you @oxoxDev and @sanil-23!
  Additional highlights 🔗
  A few more focused contributions round out this release with targeted fixes and improvements that are worth calling out. (#5571) — Thank you @Subharup Nandi!
  New Contributors
  - Thank you @M3gA-Mind — for hardening and modernizing the platform, including CDP surface removal, release pipeline fixes, and new hosting rollback/logs tooling. (e.g. #5482, #5593, #5609)
  - Thank you @oxoxDev — for upgrading and resyncing TinyFlows to keep the flows stack current. (e.g. #5520, #5555)
  - Thank you @sanil-23 — for bumping TinyFlows to the adaptive pin and keeping dependencies aligned. (#5577)
  - Thank you @Subharup Nandi — for strengthening CSP regression coverage with more precise, app-root-resolved assertions. (#5576)
  - Thank you @CodeGhost21 — for improving the feedback UI by surfacing quality tiers and tightening UX behavior around submission states. (#5431)
  Hope you’ll join our Discord too—there are exclusive roles and contributor rewards waiting for you.
