ReleaseNotes: |-
  The Files, Memory & Voice Power-Up
  This release is a big step forward in day-to-day usability: clearer files and sessions, a major memory evolution, and real-time voice agents—plus a ton of reliability and performance work across the stack. 🎉
  Highlights
  Files & project workspace clarity 🗂️
  Agent outputs now land in a visible Files folder, you can choose where that folder lives, and the app can surface those generated files directly in-place—making it much easier to find and use what your agent created. Large tool outputs are also handled more safely to keep projects tidy. (#6820, #6825, #6833, #6868, #6947) — Thank you @M3gA-Mind and @senamakel!
  Memory v2, imports, and safer organization 🧠
  Memory gets a major upgrade: engine-selectable memory v2, better lifecycle handling around each turn, and stronger portability when switching engines. The Memory UI and provider cards were modernized (including CortexDB), credits/free-period behavior is more consistent (with top-up prompts), and recall becomes time-zone aware.
  Imports and migrations are significantly hardened: clearer “building vs empty” states, smarter batching/retries, better failure visibility with retry controls, more reliable resuming, and improved document ingestion (PDF/Office). Organization also improves with connector-first filing, better GitHub scoping, optional attribution to senders, and multiple erasure/deletion correctness and privacy/security fixes. (#6841, #6843, #6855, #6869, #6873, #6874, #6875, #6892, #6901, #6924, #6949, #6993, #7011, #7012, #7013, #7014, #7034, #7029, #7035, #7036, #7038, #7041, #7043, #7063, #7085, #7089, #7090, #7091, #7094, #7096, #7100, #7102, #7103, #7104, #7105, #7106, #7107, #7108, #7109, #7110, #7111, #7112, #7113, #7114, #7122, #7123, #7126, #7128, #7129, #7130, #7131, #7134, #7137, #7138, #7139, #7142, #7143, #7144, #7146, #7147, #7149) — Thank you @M3gA-Mind, @senamakel, @CodeGhost21, @YellowSnnowmann, and @lorenzozanee!
  Live voice agents & voice foundations 🎙️
  Voice agents are now truly live: talk to Tiny in real time with tool support (including Gemini Live, ElevenLabs, and Sarvam), plus a redesigned Voice agents experience with service cards, settings modals, and app-wide toasts. Under the hood, voice-related inference components were also reorganized for a cleaner foundation. (#7046, #7092, #6840) — Thank you @senamakel!
  Chat UX upgrades & smoother conversation control 💬
  Chat gets a substantial UI uplift: working folder support, per-model thinking controls, real thread titles, richer sidebar context, and clearer run-state cues. Reliability improves too—Stop is more resilient, streaming works even without a progress sink, reply-language directives are consistently sent, and several web chat delivery edge cases are fixed. The app also adds translatable error copy and improves transcript storage formats. (#7048, #7045, #6916, #7088, #7097, #7098, #6844, #7087, #6881, #6883) — Thank you @senamakel and @M3gA-Mind!
  Agent intelligence, tool governance, and turn reliability 🧰
  Agents are more robust and predictable: improved tool calling defaults (JSON auto) with a setting, better “finish” verification, fewer false failure classifications, clearer file-read behavior, and multiple fixes around context compaction, reasoning bounds, iteration caps, and hosted-path correctness/telemetry. Tool policy/approval gates were reworked, per-turn tool withholding was added, and timed-out commands now terminate their whole process group.
  This also includes targeted fixes for web research budgets, credential scrubber behavior (including avoiding code redaction), handling HTTP status correctly, and improved orchestration behaviors. (#6910, #6909, #6963, #6965, #6966, #6967, #6968, #6969, #6971, #6972, #6973, #6974, #6975, #6976, #6977, #6980, #6992, #6889, #6856, #6879, #6884, #6945, #6946, #7117, #7118, #7119, #7120, #7140, #6865) — Thank you @senamakel and @sanil-23!
  Sessions, scheduling, connectors & integrations 🧩
  A new host-injected session store moves per-agent conversations outside the workspace, with follow-ups to ensure clean recovery and slot ownership. Scheduled (cron) runs can now deliver output back to the conversation that requested it. Composio and connectors were streamlined with direct-read paths, module routing improvements, and a configurable disabled mode—plus a deliberate removal of Composio→memory sync as memory evolves. (#7044, #7052, #7049, #6831, #6885, #6897, #6920) — Thank you @senamakel!
  Sandbox, Windows, and platform robustness 🛠️
  The Docker sandbox flow was reworked, local jail output is captured outside the project, and sandbox capability reporting and host switches are improved (including OPENHUMAN_SANDBOX=off). Windows sees key stability fixes around permission-state normalization and environment forwarding into sandboxed children. TinyComputer browser tasks are now runnable from the app, with additional improvements to reuse what completed tasks learned. (#6862, #6970, #6981, #6988, #6847, #6998, #7008, #7127) — Thank you @senamakel, @ajabaabaa, and @YellowSnnowmann!
  Models, routing, search, and local AI direction 🧭
  Routing and model selection were tightened across the UI and composer, including honoring provider picks and avoiding offering models/search tools that a session or offline profile can’t use. The tool-search path is expanded beyond the TinyHumans proxy, thinking-level controls are passed through to providers, and uploads are persisted with a preference for native multimodal input.
  The local AI story is also simplified: in-app model downloads and Ollama lifecycle management were removed, while continuing to support local inference via user-run endpoints. (#6978, #6996, #7004, #7026, #6908, #6911, #6987, #6858) — Thank you @SayrWolfridge, @sx4im, @obchain, and @senamakel!
  Internationalization & onboarding polish 🌍
  New locales landed (Japanese and Turkish), Arabic translations were improved with added Arabic README docs, and the overall translation catalog was significantly pruned for maintainability. Onboarding is also shorter and more accurate for the local path. (#6986, #7039, #7024, #6860, #7009) — Thank you @tjm8874, @moersoy, @taljeri, @graycyrus, and @senamakel!
  Release engineering, CI health, and build performance 🚀
  This range includes a massive internal modernization: waves of refactors moving functionality into shared “tiny*” libraries, vendor pin hygiene, and major dead-code/dependency pruning. CI and tests were stabilized (including clippy/layout gates), redundant tests were removed or consolidated, and performance improvements landed for both runtime and build outputs (including module bundling at build time on every platform).
  Release-specific work also improved macOS notarization of module bundles (with signature verification and tests), and headless deployments gained better keyring support. Benchmark tooling and docs expanded substantially, including a cross-harness rig and supporting runbooks and viewers. (#6828, #6829, #6830, #6832, #6834, #6835, #6837, #6838, #6845, #6846, #6848, #6849, #6850, #6851, #6852, #6853, #6854, #6857, #6859, #6861, #6863, #6864, #6866, #6867, #6871, #6872, #6876, #6877, #6878, #6880, #6882, #6886, #6888, #6890, #6891, #6894, #6895, #6896, #6898, #6899, #6900, #6903, #6904, #6906, #6907, #6912, #6913, #6914, #6915, #6917, #6918, #6919, #6921, #6922, #6923, #6928, #6929, #6930, #6931, #6935, #6937, #6942, #6943, #6944, #6948, #6982, #6989, #6995, #7015, #7017, #7018, #7019, #7021, #7027, #7028, #7031, #7033, #7054, #7050, #7058, #7060, #7065, #7070, #7072, #7079, #7081, #7121, #7124, #7125, #7115) — Thank you @senamakel, @M3gA-Mind, @fede-kamel, @lord-Rheagar, @shaurya703, @oxoxDev, @obchain, and @CodeGhost21!
  Docs & maintainability improvements 📚
  Docs were expanded and corrected across readmes, cloud deployment, benchmark runbooks, and GitBook content—alongside a broad cleanup effort to prune dead code, flags, assets, and dependencies for a healthier codebase. (#6997, #7068, #7069, #7075) — Thank you @tjm8874 and @graycyrus!
  Additional highlights 🔗
  A few more focused contributions round out this release with targeted fixes and improvements that are worth calling out. (#6979, #6994, #7093, #7095) — Thank you @senamakel and @M3gA-Mind!
