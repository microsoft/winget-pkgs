# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# Velopack's Setup.exe installs for the current user (%LOCALAPPDATA%\io.techspecs.ray.windows.x64)
# and Ray updates itself from then on. Windows lists it as "Ray Beta" with the patch version
# (4.0.16 for 4.0.16-beta.1), which is the PackageVersion here.
PackageIdentifier: TechSpecs.Ray
PackageVersion: 4.0.16
InstallerType: exe
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
  Log: --log "<LOGPATH>"
UpgradeBehavior: install
ProductCode: io.techspecs.ray.windows.x64
AppsAndFeaturesEntries:
  - DisplayName: Ray Beta
    Publisher: TechSpecs
    ProductCode: io.techspecs.ray.windows.x64
Installers:
  - Architecture: x64
    InstallerUrl: https://ray.api.techspecs.io/updates/v1/updates/latest?platform=windows&arch=x86_64&channel=beta&version=4.0.16-beta.1&redirect=true
    InstallerSha256: 434C084AF74BD49EF388FB9BDD8ADD7F35D45CD85E8DD5418698FF2F59BF7FBE
ManifestType: installer
ManifestVersion: 1.10.0
