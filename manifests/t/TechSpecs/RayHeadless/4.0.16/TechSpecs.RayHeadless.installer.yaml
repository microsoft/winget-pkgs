# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# The zip holds ray-headless-windows-x64\ with ray.cmd, ray-server.exe and ray-cli.exe beside
# the DLLs they load. A winget command link can't load those, so winget puts that folder on
# the user PATH instead (ArchiveBinariesDependOnPath): `ray` (ray.cmd), `ray-cli` and
# `ray-server` then work in a new terminal.
PackageIdentifier: TechSpecs.RayHeadless
PackageVersion: 4.0.16
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: ray-headless-windows-x64\ray-cli.exe
ArchiveBinariesDependOnPath: true
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.VCRedist.2015+.x64
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/techspecs/ray-headless/releases/download/4.0.16-beta.1/ray-headless-windows-x64-4.0.16-beta.1.zip
    InstallerSha256: D40E21D1D1F93E92575B578CAA997232D0A5B23B2728FABBC937D69256CE4F01
ManifestType: installer
ManifestVersion: 1.10.0
