ShortDescription: A local encrypted vault with optional MCP tools for approved secret use.
Description: |-
  Bossanova stores text, images, and imported .env fields in a local encrypted vault. It supports search, copying, encrypted backup and restore, and direct transfers between devices on the same local network.

  Optional MCP tools let a connected assistant use private values in approved HTTPS requests or program executions without returning those private values in tool responses. This does not isolate the receiving program or service, or prevent access through other files, memory, or the clipboard. Automatic cloud synchronization and team access controls are not provided.

  An account is required. Free includes 10 fields on one device. Plus supports 100 fields on two devices for USD 2.99 monthly or USD 23.88 annually; Pro supports unlimited fields on five devices for USD 5.99 monthly or USD 47.88 annually. Annual subscriptions are billed in one payment.
