ShortDescription: Private messenger with video calls. No phone, no email, no ads, no tracking.
Description: |-
  Tetatet is a private messenger with video calls for people who value their personal space.

  Privacy by default:
  - Only people you choose get your contact.
  - No phone number or email at sign-up.
  - No ads. No selling your attention. No behavior tracking.
  - End-to-end encrypted messaging.

  What you get:
  - 1-on-1 and group chats.
  - Video calls with one click.
  - Voice messages, files, photos and videos.
  - Works on Windows, macOS, iPhone, iPad, Android and in the browser - messages stay in sync.
  - Optional AI assistant for translation, summaries and search across your own messages.
