ShortDescription: 开源命令行 Agent：调查失败的 CI/CD 流水线，追踪根因，并把修好的补丁交给你审阅。
Description: |-
  OpenSRE 是一个面向 CI/CD 可靠性的开源 Agent。流水线变红时，它会调查这次运行、读取日志、验证各种假设，并把 CI 自身导致的问题与代码导致的问题区分开，然后推出一份等你审阅的修复。它设计为在你自己的基础设施上、用你自己的模型运行。

  为什么选择 OpenSRE

  - 更快从变红的构建中恢复：运行一失败它就开始调查。
  - 修根因，不只是重跑：它分辨 CI 侧与代码侧的失败，让你修对的东西。
  - 看清 CI 的代价：失败率、被不可靠 CI 耗掉的开发者工时，以及 main 分支红了多久。
  - 把资深经验给每个人：每位工程师都能得到同样深度的分析。

  不只是 CI/CD

  同一个 Agent 也能调查你整个技术栈里的生产事故。接入你在用的服务，例如 EKS、EC2、CloudWatch、Kubernetes、Grafana（Loki、Mimir/PromQL、Tempo）、Alertmanager、Datadog、Slack 和 GitHub，然后在交互 Shell 里描述事故，或把告警路由给它。OpenSRE 会自行挑选合适的工具，从日志和指标到 Pod 状态与部署历史。

  怎么运行

  - opensre 校验你的账号并启动交互 Shell。
  - opensre ask "why is checkout-api slow?" 在终端、脚本或 CI 任务中非交互地执行一轮 Agent。
  - opensre integrations setup 接入一个服务，opensre integrations verify 检查接入情况。
