ShortDescription: Open-source CLI agent that investigates failing CI/CD pipelines, traces the root cause and pushes a fix for you to review.
Description: |-
  OpenSRE is an open-source agent for CI/CD reliability. When a pipeline goes red it investigates the run, reads the logs, tests hypotheses and separates CI-caused failures from code-caused ones, then pushes a fix for you to review. It is built to run on your own infrastructure with your own models.

  Why OpenSRE

  - Recover from red builds faster: it investigates the moment a run fails.
  - Fix the cause, not just the rerun: it tells CI-side failures apart from code-side ones so you fix the right thing.
  - Know what CI is costing you: failure rate, developer hours lost to unreliable CI, and how long main stays red.
  - Senior-level context for everyone: every engineer gets the same depth of analysis.

  Not just CI/CD

  The same agent investigates production incidents across your stack. Connect the services you run, such as EKS, EC2, CloudWatch, Kubernetes, Grafana (Loki, Mimir/PromQL, Tempo), Alertmanager, Datadog, Slack and GitHub, then describe the incident in the interactive shell or route alerts to it. OpenSRE picks the tools that fit, from logs and metrics to pod state and deploy history.

  Running it

  - opensre validates your account and starts the interactive shell.
  - opensre ask "why is checkout-api slow?" runs one agent turn non-interactively from a terminal, script or CI job.
  - opensre integrations setup connects a service, and opensre integrations verify checks it.
