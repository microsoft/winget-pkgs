ReleaseNotes: |-
  Dia 1.7.0 for Windows brings faster launches, tidier tabs, custom shortcuts, and smoother Chat connections.

  Open Dia Faster
  Dia opens right away from your saved session and refreshes your account in the background.

  Exit Faster During Windows Updates and Shutdown
  Dia saves your data and closes promptly when Windows restarts for updates or shuts down. Normal quitting works the same as before.

  Customize Keyboard Shortcuts
  Set keyboard shortcuts to match how you work. Dia flags conflicts and saves your choices.

  Auto-Archive Inactive Tabs More Often
  Dia archives inactive tabs more often so they don't pile up. You can choose a longer threshold when you need tabs to stay around.

  Export Tabs, Profiles, and Groups to Markdown
  Export your tabs, profiles, and groups to Markdown to keep or share how you've organized your browsing.

  Preview Live Items and GitHub Pull Requests. Hover over live items to see their details. For pull requests, you also see checks, diff stats, and conflicts without opening them.

  Connect Tools Without Interrupting Chat
  Connect a tool while Chat keeps working. Chat then picks up where it left off using the new tool.

  More Reliable Connected Tools and Live PR Updates. Fewer reconnect prompts and steadier searches make connected apps more dependable, and pull request statuses stay current.

  See What Went into Your Morning Brief
  The Morning Brief footer now shows roughly how many items Dia read and which tools contributed.
