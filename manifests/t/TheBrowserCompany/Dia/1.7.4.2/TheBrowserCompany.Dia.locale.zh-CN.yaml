ShortDescription: Dia 是一款让工作日更美好的浏览器。无需开口提问就能得到答案，产出可直接分享的精美成果，并在最适合你工作日的浏览器中保持专注。
Description: Dia 是一款面向工作的 Chromium 浏览器，出自 Arc 背后的团队 The Browser Company of New York。它的 AI 助手能回答与已打开标签页相关的问题，连接 Figma、Google Chat 和 Atlassian 等工作应用，并产出可直接分享的成果。配置文件、嵌套标签组、实时文件夹和悬停预览让工作井然有序，导入器则可以把空间、收藏夹、固定的标签页、未固定的标签页、历史记录、密码和扩展程序从 Arc 迁移过来。这款浏览器免费，14 天试用期结束后，AI 功能需通过付费方案使用。
