ShortDescription: Dia is the browser for better days at work. Get answers without having to ask, produce beautiful ready-to-share outputs, and stay focused in the best browser for your work day.
Description: Dia is a Chromium-based browser for work from The Browser Company of New York, the team behind Arc. Its AI assistant answers questions about open tabs, connects to workplace apps such as Figma, Google Chat, and Atlassian, and produces ready-to-share outputs. Profiles, nested tab groups, live folders, and hover previews keep work organized, and an importer brings Spaces, Favorites, pinned tabs, unpinned tabs, history, passwords, and extensions over from Arc. The browser is free, with AI features available through paid plans after a 14-day trial.
