ReleaseNotes: |-
  What's new
  - unsupported TZID in iCal causes entire import to fail #11325
  - Handle redundant time zone info UTC and timestamp with Z at the end #11248

  Bugfixes
  - If start date is before given end date due to time zone difference, date displayed in event preview is misleading #11276
  - when end date is in a different time zone, user cannot specify a valid date in the event editor date picker #11266
  - When importing many events, only one event gets imported, with error message "ownerEncSessionKey already set" #11246
  - Events at midnight at event banner don't show up #11213
  - No error popup after setting end time before start time by selecting different start and end time zones #11210
  - Calendar does not update to reflect updated invitations to events from Google Calendar #11148
  - End date flickers and rapidly cycles through dates in event editor #10548
