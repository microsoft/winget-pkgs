ReleaseNotes: |-
  What's new
  - Weekdays of events in calendar invitation emails now displayed
  - Reminders from an email invitation are added for calendar events with default reminders set
  - Subscriptions to external calendars with "<username>:<password>" in the URL are now supported

  Bugfixes
  - Calendar now displays the correct age of contacts in birthday event previews
  - Birthday events are now displayed for contacts with birthdays on the 1st of the month
  - Calendar events attached to emails as .ics file are now always recognised as calendar attachments
