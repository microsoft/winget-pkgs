ReleaseNotes: |-
  Ceiling 1.5.37 is a maintenance release with more accurate spend and safer settings handling.

  ## Highlights

  - Added GPT-6 Astra local pricing so Codex cost stays correct after the model rollout.
  - Claude OAuth rate-limit backoff is now keyed per seat, so one account no longer throttles another.
  - Timed-out Kiro, Augment, and Vertex CLI fetches now kill their child processes instead of leaking them.
  - Vertex usage fetch failures report as errors instead of a false 0%.
  - Directory account ids are included in the capacity observation scope, so multi-account seats stay separate.
  - MCP `get_status` Cursor `remaining_percent` now matches the strip ranking.
  - An unparseable `settings.json` is quarantined instead of replaced with defaults.

  ## Docs

  The `serve` HTTP endpoints are now documented.
