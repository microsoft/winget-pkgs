ShortDescription: Find, flag and mask your personal data, everywhere on your PC. Local, fast, always in the background.
Description: |-
  piikey is a personal-data manager that runs in the background on your PC. It finds names, emails, phone numbers, IBANs, card numbers, addresses and other personal data, in four ways:
  - Mask what you send: for the sites and programs you choose, each value is swapped for a believable stand-in before it leaves your PC, and your real values are put back into the answer.
  - Flag what you type: the field you are typing in gets an outline when it holds personal data.
  - Map what you store: scan files and folders and see which of them hold personal data.
  - Manage what is kept: search, forget, export or wipe the vault, and gate scripts and CI with the CLI and the API.
  Detection, the stand-ins and the vault stay on your machine.
