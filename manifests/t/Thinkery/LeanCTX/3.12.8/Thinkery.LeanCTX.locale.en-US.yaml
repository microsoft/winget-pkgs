ShortDescription: Context gateway for AI systems that selects and compresses the context an agent reads before it reaches the model.
Description: LeanCTX sits between AI tools and the information they read. It selects task-relevant context, applies access and content controls before delivery, and records the context operations and delivery evidence it can observe. The open-source build runs locally through the command line, MCP, hooks and proxy paths, and leaves the agent loop and the model to you.
