ReleaseNotes: |-
  [2.1.2] - 2026-08-09

  Added
  - Cursor becomes a full citizen: live session state and your-turn alarms driven by Cursor's own completion signal, on top of the billing-cycle usage and plan it already reported.
  - Real-time file watching for Grok, Antigravity, and Cursor, so their sessions update on write rather than on the next scan tick.
  - Grok, Antigravity, and Cursor join the cost ledger and both report cards.
  - Alarm sounds gain a system ringtone tier.

  Changed
  - Antigravity replaces Gemini as the fifth provider; a stored Gemini selection migrates automatically. Its quota is read from the local language server, and resuming reopens the exact conversation.
  - Windows reaches 2.1.2 parity: the same five providers, the same live session state, released from the same tag as macOS.
  - Report cards: the rank block is retired, the monthly table caps to the top three models, and Claude Opus 5 is priced correctly.

  Fixed
  - The island could vanish and stay gone; three separate disappearance paths are closed, with a self-healing check behind them.
  - Cursor no longer spins forever without raising your turn.
  - Antigravity no longer fires mid-run: a turn only counts as finished on a planner response with no pending tool calls.
