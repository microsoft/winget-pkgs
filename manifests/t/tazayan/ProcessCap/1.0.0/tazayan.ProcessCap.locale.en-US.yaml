ShortDescription: Launch Windows applications with configurable CPU affinity and memory limits.
Description: >-
  ProcessCap launches a Windows executable inside a Windows Job Object and applies
  configurable processor-affinity and total job-memory restrictions to the application
  and its child processes. Limits apply immediately and do not require a system restart.
