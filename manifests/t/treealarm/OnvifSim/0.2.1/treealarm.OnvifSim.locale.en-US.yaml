ShortDescription: ONVIF IP camera simulator with fixed and PTZ cameras streaming RTSP video of a 3D world.
Description: |-
  Simulated ONVIF IP cameras for testing VMS, NVR and ONVIF client software without real hardware.
  Every camera is an ONVIF device on its own port (Device, Media, Media2, PTZ, Imaging, Events,
  WS-Discovery) with RTSP video (H.264 through the bundled ffmpeg, Motion JPEG) of a low-poly world
  drawn by a software renderer. PTZ heads move at their set speeds and the picture follows; analytics
  report the people walking in view in the ONVIF metadata track and as motion events. A browser
  editor places the cameras, buildings, roads and walkers.
