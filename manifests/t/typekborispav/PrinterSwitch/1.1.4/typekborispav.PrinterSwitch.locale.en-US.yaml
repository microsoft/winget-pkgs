ShortDescription: Share a USB printer through a Raspberry Pi and attach it to your Windows PC over USB/IP with one click.
Description: |-
  Printer Switch turns a Raspberry Pi (or another Debian-based box) into a print server for a USB printer,
  so every computer and phone on the network can print. When you need the printer as a real USB device -
  for the manufacturer's tools, toner levels, maintenance or firmware updates - one click in the
  notification area attaches it to your Windows PC over USB/IP inside an SSH tunnel, and one more click
  gives it back to the network.
