ReleaseNotes: "## Supported Platforms\r\n\r\n• Windows：10 1903 or later (x64 only)\r\n• Linux：glibc 2.33 or higher\r\n• macOS：13 or higher\r\n\r\nAll operating systems require video hardware supporting OpenGL 2.1 and GLSL 1.2 with current drivers installed.\r\n\r\n## Requirements\r\n\r\nWindows users please install the Microsoft Visual C++ Redistributable for Visual Studio 2015, 2017, 2019 and 2022:\r\n\r\n• [x64 version](https://aka.ms/vs/17/release/vc_redist.x64.exe) for running 64-bit TrenchBroom\r\n\r\n## Highlights\r\n\r\n### Sweep Tool\r\n\r\n<img width=\"640\" height=\"493\" alt=\"SweepTool\" src=\"https://github.com/user-attachments/assets/5e749573-6c80-4e88-930d-a5ea1595345e\" />\r\n\r\nThe sweep tool fills the gap between the selected brush faces and a copy of those faces, called the destination cap, with a run of brushes.\r\n\r\nContributed by @ummjackson.\r\n\r\n### Creating and Editing Quake 3 Patches\r\n\r\n<img width=\"592\" height=\"426\" alt=\"Screenshot 2026-07-24 at 23 56 22\" src=\"https://github.com/user-attachments/assets/c9809143-b3c1-4deb-9a6d-b0eab83e2b1a\" />\r\n\r\nA new control point tool allows you to edit the control points of Quake 3 patches like you normally edit brush vertices. Create patches from existing faces using `Edit > Patches > Convert Selection to Patches`. Adjust the numbers of control points without losing the patches' shape.\r\n\r\n### Arch Shape\r\n\r\n<img width=\"302\" height=\"339\" alt=\"Screenshot 2026-07-24 at 23 51 26\" src=\"https://github.com/user-attachments/assets/57e50797-6fb5-4137-a0b0-0eed4d1c6a5f\" />\r\n\r\nThe new shape for the shape builder tool allows you to create arches super quickly. Supports the same shape modifiers for cylinders as the other circular shapes.\r\n\r\nContributed by @ummjackson.\r\n\r\n### Extrude Tool\r\n\r\n<img width=\"360\" height=\"240\" alt=\"extrude\" src=\"https://github.com/user-attachments/assets/fcb0782a-f83d-4f3e-b3d4-2cd3db5b936d\" />\r\n\r\nThe extrude tool can now extrude brushes that share a face, or a portion of a face, simultaneously.\r\n\r\n### New Features\r\n• Add Sweep Tool by @ummjackson in https://github.com/TrenchBroom/TrenchBroom/pull/5321\r\n• Add an arch shape to the shape tool by @ummjackson in https://github.com/TrenchBroom/TrenchBroom/pull/5279\r\n• \"Flood fill\" select for coplanar faces by @ummjackson in https://github.com/TrenchBroom/TrenchBroom/pull/5299\r\n• Extrude opposite coplanar faces by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5348\r\n• Add a menu item to create new patches from selected faces by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5312\r\n• Introduce a tool to edit patch control points by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5307\r\n• Add controls to adjust the patch row and column counts to the control point tool by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5311\r\n\r\n### Other Improvements\r\n• Use trim sheets mode only when holding ctrl by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5343\r\n• Strip entities matching a pattern and drop an entity on export by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5347\r\n• Make grid lines adapt to the color of the fragment by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5358\r\n• Include patches in copied data by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5390\r\n• Add fly mode key configuration to keyboard preferences by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5289\r\n• Add support for a alternative shortcuts by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5293\r\n• Enable Valve 220 .map format support for Quetoo by @jdolan in https://github.com/TrenchBroom/TrenchBroom/pull/5300\r\n• Add \"All\" and \"None\" buttons to flags editor by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5317\r\n• Add a checkbox for toggling patches to the view options by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5320\r\n• Default to user data folder when saving a document by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5325\r\n• Improve handling of relative paths in compilation tasks by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5329\r\n• Add `Launch Engine` task to compile profiles by @aglitchman in https://github.com/TrenchBroom/TrenchBroom/pull/5308\r\n• Cache DiskFileSystem contents by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5338\r\n\r\n### Fixes\r\n• Fix crash on redo after collated control point / vertex drags by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5392\r\n• Fix crash when healing edges of degenerate brushes by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5373\r\n• Fix an assertion when reloading ZipFileSystem by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5424\r\n• Don't clear recent documents when loading a map from the commandline by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5298\r\n• Don't reload issue filters when map changes by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5316\r\n• Invalidate decal renderer data when materials are loaded by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5324\r\n• Don't accept non-bindable keys for shortcuts by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5326\r\n• Enable texture masking for m32 textures that contain non-opaque pixels by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5327\r\n• Fix orientation of Oriented-type sprites by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5330\r\n• Restore showing errors when loading game configs by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5350\r\n• Show paths for config files with errors during initialization by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5357\r\n• Fix loading RTCW models by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5351\r\n• Don't show an error about the lock file at first startup by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5394\r\n• Fix mojibake in Quake-encoded entity property text on Windows by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5391\r\n\r\n### Maintenance\r\n• Clarify AI policy by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5354\r\n• Update to Qt 6.10 by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5273\r\n• Only delete installed files during update by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5306\r\n• Don't seed the random number generator in every call to generateUuid by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5337\r\n• Add windows manifest by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5353\r\n• Fix non-ASCII path handling for TbMdlLibTest by embedding a UTF-8 code page manifest by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5355\r\n• Don't strip necessary dependencies from AppImage by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5366\r\n• Write a comment with the TB version and build ID into the map file by @kduske in https://github.com/TrenchBroom/TrenchBroom/pull/5419\r\n\r\n## New Contributors\r\n• @ummjackson made their first contribution in https://github.com/TrenchBroom/TrenchBroom/pull/5279\r\n• @bdunahu made their first contribution in https://github.com/TrenchBroom/TrenchBroom/pull/5292\r\n• @aglitchman made their first contribution in https://github.com/TrenchBroom/TrenchBroom/pull/5308\r\n\r\n**Full Changelog**：https://github.com/TrenchBroom/TrenchBroom/compare/v2026.1...v2026.2"
