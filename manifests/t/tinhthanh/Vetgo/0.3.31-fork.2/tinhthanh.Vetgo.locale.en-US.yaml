ShortDescription: Run coding agents on your own machines and watch them from one desktop app.
Description: |-
  Vetgo is the Windows build of a fork of Shipyard. It runs coding agents (Claude Code, Codex and others) on your own boxes: servers reached over SSH or Tailscale, this PC through WSL, or (Labs) Windows itself. One desktop app shows every agent, terminal and browser tab, and the app updates itself from the project's releases.
