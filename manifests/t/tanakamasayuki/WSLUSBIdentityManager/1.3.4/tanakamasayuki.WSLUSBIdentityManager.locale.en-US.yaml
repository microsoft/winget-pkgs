ShortDescription: Track which physical device is which when forwarding USB devices to WSL
Description: 'Works with usbipd-win to tell identical USB devices apart. A CH340 reports no serial number, and a bus id changes when hubs are re-enumerated, so this asks the board itself: an ESP32 by its eFuse MAC, a CH32 RISC-V part by its factory UUID through a WCH-Link. It shares, attaches and detaches devices, identifies them on arrival, and can attach matching devices to WSL automatically.'
