Description: |-
  Uma ilha dinâmica no estilo do iPhone para Windows 10 e 11, nativa em C# / WPF. Mostra música com letra, volume,
  sistema, timer com modo foco, notificações, reuniões com botão Entrar, tarefas e o que o GitHub Copilot e o
  Claude Code estão fazendo (com Permitir / Negar). O app Android aprova pedidos, troca arquivos, sincroniza a área
  de transferência e vira controle remoto do PC.
