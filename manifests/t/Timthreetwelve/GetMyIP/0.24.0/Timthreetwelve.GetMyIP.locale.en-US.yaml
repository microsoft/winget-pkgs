ReleaseNotes: |-
  Version 0.24.0 brings some new features 👀 and a couple of bug fixes. 🐛
  - New periodic refresh interval settings
  - New network adapters page.
  - New copy icon
  - x64 only
  - Large portions of the code have been rewritten for efficiency and reliability.

  Personal notes
  I've decided to take a step back from active development of Get My IP for a while so I can focus on my health and spend more time with the those who matter most to me.
  When I first started this project, I never imagined it would grow into what it has today. I'm incredibly grateful to everyone who has used it, contributed to it, and supported it over the years. At the same time, the project has become much larger and more demanding than I ever expected, and maintaining it has started to take a toll.
  Going forward, I'll continue to accept translation updates and will do my best to address any critical issues that arise, but otherwise development will be on hold. Maybe someday I'll take another stab at #201.
  I'd also like to mention that I was surprised to discover Get My IP is available through winget. I don't have any objection to it being there, and I understand that the MIT License permits redistribution. That said, I would have appreciated a quick heads-up or notification beforehand. It's not a major issue, but it would have been a nice courtesy.
  To whomever added Get My IP to winget, please update it for the current version.
  Finally, thank you to everyone who has supported the project over the years. Your feedback, bug reports, translations, contributions, and encouragement have meant more than you know.
  ❤️ Thank you.

  What's Changed since 0.23.2 ⭐
  - Refactor IP retrieval error handling into helpers by @Timthreetwelve in #274
  - Refactor refresh interval to flexible time spinner by @Timthreetwelve in #276
    - You can now set the periodic refresh interval anywhere from 10 seconds to 24 hours.
    - Keep in mind that the IP/Geolocation information providers have limitations on requests.
    - Navigate to Settings -> Automatic Refresh Settings to set the refresh interval.
  - Target x64 only; update publish profiles and installer; new icon by @Timthreetwelve in #277
    - Get My IP now targets x64 (64-bit) only.
  - Add copy-to-clipboard icon for DataGrid cell values. by @Timthreetwelve in #279
    - The copy-to-clipboard icon is optional. Navigate to Settings -> UI Settings -> Show copy icon by details to show/hide the icon.
    - This feature replaces the right-click to copy feature.
  - Add Roslynator analyzers by @Timthreetwelve in #280
  - Remove nullable Setting refs; enforce non-null access by @Timthreetwelve in #281
  - Refactor MainWindow access and window state handling by @Timthreetwelve in #287
  - Update icon by @Timthreetwelve in #288
    - I hope you like yellow.
  - Refactor refresh interval settings and UI (again) by @Timthreetwelve in #292
  - Refactor MainWindow_StateChanged async handling by @Timthreetwelve in #293
  - Remove null-forgiving operators and update method access by @Timthreetwelve in #294 and #298
  - Refactor window position saving; add debug toast shortcut by @Timthreetwelve in #299
  - Localize unknown IP placeholder by @Timthreetwelve in #301
    - Will now display Unknown (localized) instead of ?.?.?.?.
  - Add network adapters page by @Timthreetwelve in #303
  - Resolve code review items by @Timthreetwelve in #304
  - Reapply system theme on setting changes by @Timthreetwelve in #306
  - Preserve restored window bounds by @Timthreetwelve in #310
  - Add adapters localization by @Timthreetwelve in #314
  - Address items from code review by @Timthreetwelve in #315

