ShortDescription: Native, lightweight screensaver with the Omarchy animations and 41 terminal-style effects.
Description: Screensaver FX is a native Windows screensaver (.scr) written in Rust. It draws your own banner with the Omarchy screensaver animations plus dozens of new effects, uses about 5 MB of RAM and stops drawing while the display is off. The installer lets you customize the banner, colors and effects with a live preview.
