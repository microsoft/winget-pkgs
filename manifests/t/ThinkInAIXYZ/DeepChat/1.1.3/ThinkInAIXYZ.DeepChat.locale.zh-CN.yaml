ReleaseNotes: |-
  v1.1.3 (2026-10-09)
  - Added automatic two-way device sync, Codex-compatible Nowledge Mem integration, and a bundled optional Memcode memory plugin
  - Reference past conversations in native chats with @ or by dragging from the sidebar, so the agent can look up their content when needed
  - File references now show their paths, uploads sit in a collapsible attachment area, and the composer focuses on paste without opening the slash menu on URLs or paths
  - Compactly displayed token usage in the message toolbar, and redesigned scheduled tasks into a list-and-detail layout with templates, run history, and a leave guard
  - Added a ChatGPT sign-in option for OpenAI, plus search and an enabled-only filter in the connection-test model picker
  - Chat and workspace sidebar groups now show five recent conversations at a time, with Show more to load older conversations
  - Added inspectable memory evidence with lineage views, a dependent-memory review before editing or deleting, an opt-in judgment model that can prune stale tool results, and retries for failed reflections
  - Added support for Lody ACP client extensions, covering elicitation forms, plan and usage reporting, subagent events, and session steering
  - Added explicit Save and Cancel actions for API keys and service URLs, allowed custom providers to be saved without testing, and isolated workspace HTML and SVG previews from the app
  - Removed the built-in agent plan tool and plan progress panel while keeping existing plan tool records readable
  - Added the Cloudflare Workers AI, TypeSafe, Requesty, DemonRoute, FutureInfra, Y-API, Magpie, Opper, and AstrLink providers, plus SkyAccess and Cohesivity MCP server presets
  - Hardened skill discovery and worker loading, repaired auto-approve, flattened compatible tool schema intersections, and kept failed edits and references intact through retries, queues, copy, search, and export
  - Fixed non-ASCII conversation search, sidebar rows overlapping the header, reasoning effort conflicting with thinking budget, and device sync getting stuck while enabling
  - Updated Electron to 43.7.0, bundled Node.js to 24.21.0, improved in-app update-note readability, and refreshed the built-in model and ACP catalogs with dependency security fixes
  - 新增设备双向自动同步，以及与兼容 Codex 的 Nowledge Mem 插件集成，并内置可选的 Memcode 记忆插件
  - 原生对话支持用 @ 或从侧栏拖入历史会话，让 Agent 按需查阅之前聊过的内容
  - 文件引用显示路径，上传文件集中显示在可折叠附件栏中，粘贴时聚焦输入框，斜杠命令菜单不再在 URL 或文件路径上弹出
  - 在消息工具栏中紧凑展示 Token 用量，并将定时任务改为列表+详情布局，提供模板、运行历史与离开保护
  - 为 OpenAI 增加 ChatGPT 登录选项，服务商连接测试的模型选择器支持搜索和仅显示已启用模型
  - 侧栏的 Chat 与工作区分组每次显示五个最近会话，可通过“显示更多”加载更早的会话
  - 新增记忆证据检视与依赖记忆复核，支持启用判断模型清理过期工具结果，记忆反思失败后可继续重试
  - 支持 Lody ACP 客户端扩展：涵盖 elicitation 表单、计划与用量上报、子代理事件与会话引导
  - 修改 API 密钥和服务地址后可明确保存或取消，新建自定义服务商可跳过测试直接保存，并隔离工作区 HTML 和 SVG 预览
  - 移除内置 Agent 计划工具与计划进度面板，旧对话中的计划工具记录仍可查看
  - 新增 Cloudflare Workers AI、TypeSafe、Requesty、DemonRoute、FutureInfra、Y-API、Magpie、Opper 与 AstrLink 模型服务商，以及 SkyAccess 和 Cohesivity MCP 服务预设
  - 加固 Skill 发现与 Worker 加载，修复自动批准与合法工具 schema 被拒绝的问题，编辑失败时保留草稿，消息排队、重试、复制、搜索和导出时也会保留引用
  - 修复会话字面搜索中非 ASCII 文本匹配、展开侧栏 Chat 分组时会话行与标题重叠、推理强度与思考预算冲突，以及开启设备同步时一直加载的问题
  - 将 Electron 升级至 43.7.0、内置 Node.js 升级至 24.21.0，改善应用内更新日志阅读体验，并刷新内置模型与 ACP 目录及安全相关依赖
