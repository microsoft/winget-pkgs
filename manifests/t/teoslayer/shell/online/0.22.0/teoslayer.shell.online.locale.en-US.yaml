ShortDescription: A live browser link for any terminal process. Developed by Pilot Protocol.
Description: Share any terminal process in one command. The process stays on your machine. The CLI prints a browser link, password, and QR code. Terminal traffic is end-to-end encrypted by default. An agent can also observe a session through scoped MCP grants and, when specifically authorized, send input with host acknowledgement, human priority and duplicate protection. See MCP access and its decryption boundary. Control is off by default.
