ReleaseNotes: |-
  v0.22.0
  - Passive session pulse in open app terminals: recent output, quiet/unobserved state, unread output and bounded attention hints. No extra model calls or terminal subscriptions.
  - Owner-encrypted existing OpenCode titles and completed-response excerpts for opted-in, intentionally resumed conversations. Manual titles win. At most one publication per rolling day; no generated summary and no team delivery.
  - Recent MCP request activity in the game: real request lifecycle metadata, external-client arrows, and distinct delivery, cancellation and failure outcomes. Input delivery is not task completion.
  - Fixed legacy mouse-wheel reports in the app terminal. Byte-preserving input uses the same permission gates as keyboard input; read-only local scrollback remains usable.
  - Safer stale-connection, vault-lock, consent-change and account-refresh handling.
  Upgrade notes
  App migrations 020 and 021 are required. New host-side features require a newly started Go host; installing the CLI does not restart existing sessions. Browser-only pulse and scrolling fixes apply after refreshing the web app.
  Existing MCP control remains available through specific scoped grants. The team MCP gateway and external Jev supervision are not integrated in this release. Jev remains an isolated offline prototype.
  Verification
  474 root tests; 1568 app tests with 3 existing skips; 1707 PostgreSQL-backed app tests; Go race tests and vet; Chrome/Safari terminal and route checks; real-runtime encrypted MCP canaries. Release downloads include checksums for all supported targets.
