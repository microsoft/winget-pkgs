ReleaseNotes: |-
  The chat renderer now reads a coding agent's own record of the conversation instead of the screen it draws.
  A full-screen agent repaints a grid, so what a viewer held was one screenful of a projection: history was gone, the contents changed with the terminal's scroll position, and whether the agent was working had to be inferred from a spinner that never says it has stopped. Claude Code and OpenClaw both keep a machine-readable record of the same conversation on the host, written per message and per tool step while a turn is still running. The CLI follows that and sends it as its own frame, sealed with the session's cipher, so the relay forwards it without being able to read it.
  What travels is narrow: what was said, the name of a tool, and the questions an agent is waiting on. Thinking, tool inputs and attachments stay on the machine. A session that never runs an agent sends nothing.
  Questions an agent asks are now answered in the chat. They arrive with their options, are drawn as buttons, and pressing one answers the program's own menu.
  Also in this release: Shell Keep gets a larger field, a new HUD, training at the Forge and touch controls, with a fix for "Gather now" answering an internal error; and the stats dashboard shows how far new accounts get.
  Upgrading is worthwhile for anyone using the chat renderer with an agent: the host side of that feature ships in this binary.
  See the changelog for detail.
