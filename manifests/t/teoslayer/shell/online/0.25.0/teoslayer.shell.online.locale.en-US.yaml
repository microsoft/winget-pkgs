ReleaseNotes: |-
  Session summaries. Hover a session in app.shell.online to see what it is doing, without opening it.
  Added
  - Session summaries. Hover a session in the List or Board view (long-press on touch) to see a short summary. Off by default, owner-only and opt-in per session: shell permissions <id> --summaries=true, or the Summaries switch under Agent permissions. A session is summarised once each time it goes idle, and again only after new output.
  - Claude Code sessions are summarised on your machine from the conversation's own transcript and encrypted to your vault key. Nothing leaves in plain text. The binding follows /clear, /resume and handoff forks.
  - Other terminal sessions send redacted output, encrypted, to the shell.online summarizer: Qwen3-4B in an Intel TDX Confidential Space VM, with no tools and no internet access. The host sends nothing until it has verified the enclave's attestation and the signed image allowlist. The summary is encrypted to your vault key inside the enclave, and the service stores only ciphertext.
  Summaries are plain text with no links and may be wrong. Prompt-injection defences withhold anything that looks like a link, an account or login claim, or instructions. Only sessions started with 0.25.0 are covered. See docs/summaries.md for exactly what leaves your machine and the trust boundary.
