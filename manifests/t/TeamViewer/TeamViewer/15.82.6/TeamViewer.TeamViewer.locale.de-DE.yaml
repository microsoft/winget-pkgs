ReleaseNotes: |-
  New Features
  - Die TeamViewer Client- und Host-MSI-Pakete (64‑Bit) für ARM‑basierte Windows‑Geräte sind jetzt über das TeamViewer Remote Rollout-Setup zum Download verfügbar.
  - Gerätegruppen, die von Usern mit Tensor- oder TeamViewer ONE-Lizenzen erstellt wurden, werden jetzt standardmäßig auf Unternehmensebene verwaltet. Wenn diese Option in den Administratoreinstellungen aktiviert ist, haben Administrator:innen vollständige Transparenz über alle Gerätegruppen in der gesamten Organisation und können diese unabhängig von der Person, die sie erstellt hat, bearbeiten. So wird ein Verlust des Zugriffs durch das Offboarding von User verhindert.

  Improvements
  - Usergruppen können nun die Conditional Access‑Berechtigungen „Zugriff anfordern“ und „Zugriffsanfragen akzeptieren“ für den vorab genehmigten Zugriff auf Geräte und Gerätegruppen erhalten.
  - Die KI‑gestützte Tia‑Fehlerbehebung ist jetzt für Verbindungen zu verwalteten macOS‑Geräten verfügbar. Tia kann während Remote Support-Sitzungen Live-Diagnosen durchführen und genehmigte Maßnahmen zur Behebung ausführen, um Ursachen zu identifizieren und Probleme effizienter zu lösen.
  - Der Workflow für Conditional Access-Sitzungen wurde verbessert. User können einer Sitzung jetzt erst beitreten, nachdem der entfernte Teilnehmer verbunden ist und die Sitzung online ist. Auch die Erstellung von Sitzungen wurde vereinfacht, indem die Optionen zum Starten entfernt wurden.

  Bugfixes
  - Ein Fehler wurde behoben, der dazu führen konnte, dass TeamViewer unerwartet beendet wurde.
  - Ein Fehler wurde behoben, durch den Online‐ oder im Ruhezustand befindliche Geräte angezeigt wurden, wenn die Ansicht „Basisgeräte“ so gefiltert war, dass nur Offline‐Geräte angezeigt wurden.
  - Ein Fehler in Filebox wurde behoben, durch den Dateien ohne Dateiendung geöffnet werden konnten. Dies könnte zu einer fehlerhaften Dateiverarbeitung führen, wenn auf dem Remote-Gerät bereits eine Datei mit demselben Namen vorhanden ist.
  - Mehrere Path-Traversal-Schwachstellen wurden behoben, die eine lokale Rechteausweitung ermöglichen konnten. (Security Bulletin: TV-2026-1010).
  - Eine Race-Condition-Schwachstelle wurde behoben, die eine lokale Rechteausweitung ermöglichen konnte. (Security Bulletin: TV-2026-1010).
  - Eine Schwachstelle durch fehlerhafte Zugriffskontrollen, die die Ausführung von Remote-Code ermöglichen konnte, wurde behoben. (Security Bulletin: TV-2026-1010).
