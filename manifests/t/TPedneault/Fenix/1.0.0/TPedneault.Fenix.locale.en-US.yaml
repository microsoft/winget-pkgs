ShortDescription: A keyboard-first text editor, written from scratch in Rust.
Description: |-
  Fenix is a modal editor: Vim's editing grammar, with a SPC leader for everything else. It's GPU-rendered, and brings the tools of a working day into one window as pages you move between with the keyboard: projects, Git, a debugger, coding agents over the Agent Client Protocol, terminals, and sandboxed WebAssembly extensions from a signed store.
