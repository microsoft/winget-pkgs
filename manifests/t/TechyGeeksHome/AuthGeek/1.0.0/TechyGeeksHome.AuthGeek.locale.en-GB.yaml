ShortDescription: A desktop two-factor authenticator that keeps your codes in one encrypted file.
Description: >-
  AuthGeek generates TOTP and HOTP codes on the desktop and keeps every account in one encrypted file
  on the machine, with no account, no server and no sync. Accounts are added by pasting an otpauth
  link, by reading a QR code out of a picture, or by importing a Google Authenticator transfer link in
  one go, and any account can be shown as a QR code to move it to a phone. The vault is AES-256-GCM
  with the key derived by Argon2id, and encrypted backup, plain text export and restore are all built
  in and tested on every build.
