ShortDescription: 'Cleans up a recording on your own machine: noise, mains hum and levels.'
Description: >-
  SoundGeek writes a cleaned copy of a recording beside the original: steady background noise reduced,
  mains hum found and removed at whichever of 50 Hz or 60 Hz is actually present, rumble taken out,
  and loudness evened to a target measured to ITU-R BS.1770. Three strengths of cleanup are offered,
  from filtering that returns the file at its original sample rate to a speech model that is far
  stronger and returns 16 kHz mono. Everything happens on the machine, the original is only ever read,
  and the app reports what it changed in numbers.
