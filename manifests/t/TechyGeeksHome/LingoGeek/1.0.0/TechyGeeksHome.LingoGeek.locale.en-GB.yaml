ShortDescription: A document translator that runs on the machine, with no account and no character limit.
Description: >-
  LingoGeek translates Word documents, PDFs, SRT and VTT subtitles, Markdown and plain text on the
  machine itself, writing a translated copy beside the original rather than over it. Word structure
  is preserved: headings, bullet lists, tables, headers and footers. Subtitle cue numbers and
  timestamps are copied through unchanged. PDFs are read as text and written out as an editable Word
  document rather than a rebuilt layout. Around a hundred language pairs are available from the
  openly licensed Argos and OPUS-MT collections; a pack is downloaded once, between 40 and 80 MB, and
  works with no connection from then on. There is no account, no subscription and no monthly document
  allowance.
