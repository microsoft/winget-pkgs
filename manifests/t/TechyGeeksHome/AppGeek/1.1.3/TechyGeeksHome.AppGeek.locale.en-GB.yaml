ShortDescription: Update everything on your PC in one run, and install new software from a curated list.
Description: >-
  AppGeek reads the installed-programs registry and the Store package list, matches them against
  winget and shows what is out of date, then updates what you choose in one run. It also carries a
  browsable catalogue of common Windows software so setting up a new machine is a case of ticking a
  list. It never moves an application you already have: it reads how each one is actually installed
  and pins winget to that scope, and it refuses a match it is not certain about rather than installing
  the wrong package over a working app.
