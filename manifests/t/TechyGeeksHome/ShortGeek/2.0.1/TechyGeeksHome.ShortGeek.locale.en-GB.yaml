ShortDescription: Turns a script into a narrated, captioned vertical short, rendered on your own machine.
Description: >-
  ShortGeek takes a script you write or paste in and produces a finished 1080x1920 MP4 short. It
  narrates the script, burns in word by word captions timed from the voice, and can put a small
  screenshot on any beat. Backgrounds are drawn in code or are clips you supply; none of it is AI
  generated imagery. Rendering happens locally, and Python and ffmpeg are inside the installer. The
  default Edge voice sends the narration text to Microsoft's online speech service; an offline voice
  that sends nothing is also available.
