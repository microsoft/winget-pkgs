ShortDescription: A free, self-contained disk space analyser for Windows with exact and near-duplicate detection, search, batch rename, and snapshot comparison.
Description: |-
  DiskGeek scans your drives and shows exactly what's eating your space: list view and
  treemap view of disk usage, exact and perceptual-hash (near-duplicate) file detection,
