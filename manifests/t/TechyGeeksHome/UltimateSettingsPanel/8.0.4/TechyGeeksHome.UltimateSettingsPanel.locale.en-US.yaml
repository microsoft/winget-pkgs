ShortDescription: Around 280 Windows settings and tools behind one search box.
Description: |-
  Ultimate Settings Panel gathers the Windows settings pages, control panel applets and
  administrative tools that are otherwise scattered across the operating system, and puts them
  behind a single search box.

  Type what you want and press the button, rather than remembering whether a given setting now
  lives in Settings, in the old Control Panel, or behind a command nobody can recall. It covers
  Windows settings, Office, network and administrative tools.

  It is portable, so nothing is installed or written to the registry, and it does not check in
  over the network on launch.
