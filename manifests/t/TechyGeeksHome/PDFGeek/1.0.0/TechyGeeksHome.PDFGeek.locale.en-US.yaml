ShortDescription: A free, self-contained PDF toolkit for Windows - merge, split, rotate, watermark and password-protect PDFs entirely offline.
Description: |-
  PDFGeek does the everyday PDF jobs on your own machine, with none of the limits the web
  tools impose. Merge any number of files, split a document into single pages or fixed-size
  chunks, extract or remove pages using print-dialog ranges, rotate sideways scans, reorder
  a document, stamp a watermark across every page, and add or remove password protection
  with AES-128 encryption.

  Your documents never leave your computer, so there are no file-count caps, no hourly
  throttle and no subscription to lift them. No account, no telemetry, no bundled offers and
  no paid tier. Free to use at home and at work.

  Installs per-user by default, so no admin rights and no UAC prompt. Built on .NET 8 and
  Avalonia; requires Windows 10 or later, 64-bit.
