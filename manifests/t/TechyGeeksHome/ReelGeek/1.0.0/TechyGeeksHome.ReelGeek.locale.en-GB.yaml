ShortDescription: Turns a folder of photographs into a vertical video edit cut to a beat grid.
Description: >-
  ReelGeek builds a real edit rather than a slideshow. It reads photographs from a folder, cuts them
  against a tempo grid, gives every shot its own camera move and picks a transition to get out of it,
  then renders a 1080x1920 H.264 MP4 that uploads as it is to TikTok or YouTube Shorts. Everything is
  read from the disk and rendered on the processor, so nothing is uploaded anywhere, and there is no
  account, no watermark and no export limit.
