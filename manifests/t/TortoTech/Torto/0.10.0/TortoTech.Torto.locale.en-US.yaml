ShortDescription: A local-first ebook reader built around Focus Mode.
Description: |-
  Torto is a local-first ebook reader built around Focus Mode, where one meaningful passage is active at a time. Short units start at a fixed centered baseline so your gaze stays anchored, lists stay grouped with their introductory paragraph, and oversized tables or media scroll internally instead of being skipped.
  It opens large technical libraries quickly with low memory and applies Typst-grade line breaking and balanced hyphenation to English and CJK books. Footnotes, figures, tables and equations can be previewed in place, and a table can switch to an AI-generated chart.
  On desktop, text PDFs reflow locally and scanned PDFs can join the same workflow once a configured vision model produces a reflowable layer. AI chat, translation and semantic search work with OpenAI, Anthropic, Gemini, DeepSeek, Ollama, llama.cpp and custom compatible endpoints, and reading data can sync through WebDAV.
