ShortDescription: 一款以专注模式为核心的本地优先电子书阅读器。
Description: |-
  Torto 是一款本地优先的电子书阅读器，以专注模式为核心：同一时间只高亮一个有意义的段落。短段落固定在居中的基线上，视线不再上下跳动；列表与引导段落保持成组，超大的表格和媒体改为内部滚动而不是跳过。
  它能以很低的内存开销打开大型技术书库，并对中英文书籍采用 Typst 级断行与均衡连字符。脚注、图表、表格与公式可在原位预览，表格还能切换为 AI 生成的图表。
  桌面端支持本地重排文字版 PDF，配置视觉模型生成可重排层后，扫描版 PDF 也能进入同一阅读流程。AI 对话、翻译与语义搜索兼容 OpenAI、Anthropic、Gemini、DeepSeek、Ollama、llama.cpp 及自定义兼容端点，阅读数据还可通过 WebDAV 同步。
