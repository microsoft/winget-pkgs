ShortDescription: 基于 Rust 与 Svelte 5 构建的高性能键盘效率启动器，集成 Everything 文件搜索、WASM 插件、剪贴板历史与屏幕截图。
Description: |-
  Tomoyo (Tomoyo Launcher) 是一款开源的高性能键盘效率启动器，使用 Rust 与 Svelte 5 构建，定位为跨 Windows 与 Linux 平台、可高度扩展的本地效率工具。

  主要特性：
  - 快速启动应用程序，并原生集成 Everything SDK 实现毫秒级本地文件检索。
  - 内置剪贴板历史记录、标注级屏幕截图、快捷系统命令、数学计算及单位/汇率换算。
  - 基于 WebAssembly (WASM) 的安全沙箱插件体系（tomoyo-wasm-sdk）与细粒度权限控制。
  - 多窗口架构与 Fluent Mica 视觉体验，兼具低内存占用与高响应速度。
