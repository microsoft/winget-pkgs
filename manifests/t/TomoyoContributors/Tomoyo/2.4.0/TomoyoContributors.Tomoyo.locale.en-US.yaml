ShortDescription: Keyboard-driven cross-platform application launcher written in Rust with Everything search, WASM plugins, clipboard history, and screen capture.
Description: |-
  Tomoyo (Tomoyo Launcher) is an open-source, keyboard-driven productivity launcher written in Rust and Svelte 5, built as a fast, extensible alternative to PowerToys Run, uTools, Alfred, and Raycast across Windows and Linux.

  Key Features:
  - Application launching, Windows/Desktop search, and Everything SDK native file search integration.
  - Clipboard history, precision screen capture with annotation, system commands, math calculator, and unit/currency conversion.
  - WebAssembly (WASM) sandboxed plugin system (tomoyo-wasm-sdk) with host RPC capability permissions.
  - Multi-window architecture with hardware-accelerated Fluent Mica/vibrancy styling and low idle memory footprint.
