ShortDescription: "Tenax 命令列：為 Postgres、MySQL 與磁碟區提供 Kubernetes 備份與秒級時間點還原。"
Description: |-
  Tenax 將你在 Kubernetes 上執行的 Postgres、MySQL 資料庫與磁碟區備份到你自己的 S3 儲存貯體，即時傳送每一次變更，並可將任意一秒還原到一次性沙箱中。所有資料在離開叢集前都會加密。

  tenax CLI 與叢集中的 Tenax 溝通：列出備份與可還原區間，將資料庫或磁碟區還原到精確的一秒，開啟沙箱與查詢，比較版本，並開啟 Web 主控台。
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.3
InstallationNotes: "用 `tenax version` 檢查安裝；`tenax console` 開啟目前 Kubernetes 內容中 Tenax 的 Web 主控台。"
