ShortDescription: "Kommandozeile für Tenax: Kubernetes-Backups und sekundengenaue Wiederherstellung für Postgres, MySQL und Volumes."
Description: |-
  Tenax sichert die Postgres- und MySQL-Datenbanken und Volumes, die Sie auf Kubernetes betreiben, in Ihren eigenen S3-Bucket, überträgt jede Änderung sofort und stellt jede beliebige Sekunde in einer Wegwerf-Sandbox wieder her. Alles wird verschlüsselt, bevor es den Cluster verlässt.

  Die tenax-CLI spricht mit dem Tenax in Ihrem Cluster: Sie listet Backups und das Wiederherstellungsfenster, stellt eine Datenbank oder ein Volume sekundengenau wieder her, öffnet Sandboxes und Abfragen, vergleicht Versionen und öffnet die Webkonsole.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
