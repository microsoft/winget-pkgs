ShortDescription: Command line for Tenax, Kubernetes backups and point-in-time restore for Postgres, MySQL and volumes.
Description: |-
  Tenax backs up the Postgres and MySQL databases and the volumes you run on Kubernetes to your own S3 bucket, streams every change as it happens, and restores any second into a throwaway sandbox. Everything is encrypted before it leaves the cluster.

  The tenax CLI talks to the Tenax installed in your cluster: it lists backups and the restore window, restores a database or a volume to an exact second, opens sandboxes and queries, compares versions, and opens the web console.
