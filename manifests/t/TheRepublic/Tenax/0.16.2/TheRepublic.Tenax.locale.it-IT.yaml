ShortDescription: "Riga di comando di Tenax: backup su Kubernetes e ripristino al secondo per Postgres, MySQL e volumi."
Description: |-
  Tenax esegue il backup, nel tuo bucket S3, dei database Postgres e MySQL e dei volumi che esegui su Kubernetes, trasmette ogni modifica appena avviene e ripristina qualsiasi secondo in una sandbox usa e getta. Tutto viene cifrato prima di lasciare il cluster.

  La CLI tenax parla con il Tenax installato nel tuo cluster: elenca i backup e la finestra di ripristino, ripristina un database o un volume a un secondo esatto, apre sandbox e query, confronta versioni e apre la console web.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
