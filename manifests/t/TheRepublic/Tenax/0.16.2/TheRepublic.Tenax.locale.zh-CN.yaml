ShortDescription: "Tenax 命令行：为 Postgres、MySQL 和卷提供 Kubernetes 备份与秒级时间点恢复。"
Description: |-
  Tenax 将你在 Kubernetes 上运行的 Postgres、MySQL 数据库和卷备份到你自己的 S3 存储桶，实时传输每一次变更，并可把任意一秒恢复到一次性沙箱中。所有数据在离开集群前都会加密。

  tenax CLI 与集群中的 Tenax 通信：列出备份和可恢复窗口，把数据库或卷恢复到精确的一秒，打开沙箱和查询，比较版本，并打开 Web 控制台。
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
