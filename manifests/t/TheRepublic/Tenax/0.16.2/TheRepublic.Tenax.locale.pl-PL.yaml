ShortDescription: "Wiersz poleceń Tenax: kopie zapasowe w Kubernetes i przywracanie z dokładnością do sekundy dla Postgres, MySQL i wolumenów."
Description: |-
  Tenax tworzy kopie zapasowe baz Postgres i MySQL oraz wolumenów działających w Kubernetes we własnym buckecie S3, przesyła każdą zmianę od razu i przywraca dowolną sekundę w jednorazowym sandboksie. Wszystko jest szyfrowane, zanim opuści klaster.

  CLI tenax rozmawia z Tenaxem zainstalowanym w klastrze: wyświetla kopie i okno przywracania, przywraca bazę lub wolumen do dokładnej sekundy, otwiera sandboksy i zapytania, porównuje wersje i otwiera konsolę webową.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.2
InstallationNotes: "Sprawdź instalację poleceniem `tenax version`; `tenax console` otwiera konsolę webową Tenaxa z bieżącego kontekstu Kubernetes."
