ShortDescription: "Línea de comandos de Tenax: respaldos en Kubernetes y restauración a cualquier segundo para Postgres, MySQL y volúmenes."
Description: |-
  Tenax respalda en tu propio bucket S3 las bases de datos Postgres y MySQL y los volúmenes que ejecutas en Kubernetes, transmite cada cambio en cuanto ocurre y restaura cualquier segundo en un sandbox desechable. Todo se cifra antes de salir del clúster.

  La CLI tenax habla con el Tenax instalado en tu clúster: lista respaldos y la ventana de restauración, restaura una base de datos o un volumen a un segundo exacto, abre sandboxes y consultas, compara versiones y abre la consola web.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.2
InstallationNotes: "Comprueba la instalación con `tenax version`; `tenax console` abre la consola web del Tenax de tu contexto de Kubernetes actual."
