ShortDescription: "Tenax のコマンドライン: Postgres、MySQL、ボリュームのための Kubernetes バックアップと秒単位のリストア。"
Description: |-
  Tenax は Kubernetes で動かしている Postgres と MySQL のデータベースとボリュームを自分の S3 バケットにバックアップし、すべての変更を発生と同時に転送し、任意の 1 秒を使い捨てのサンドボックスに復元します。データはクラスターを出る前にすべて暗号化されます。

  tenax CLI はクラスター内の Tenax と通信し、バックアップとリストア可能な期間の一覧、データベースやボリュームの秒単位のリストア、サンドボックスとクエリ、バージョンの比較、Web コンソールの起動を行います。
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.2
InstallationNotes: "`tenax version` でインストールを確認できます。`tenax console` は現在の Kubernetes コンテキストの Tenax の Web コンソールを開きます。"
