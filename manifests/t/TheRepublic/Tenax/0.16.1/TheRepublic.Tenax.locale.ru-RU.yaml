ShortDescription: "Командная строка Tenax: резервные копии в Kubernetes и восстановление на любую секунду для Postgres, MySQL и томов."
Description: |-
  Tenax сохраняет базы Postgres и MySQL и тома, работающие в Kubernetes, в ваш собственный бакет S3, передаёт каждое изменение сразу и восстанавливает любую секунду в одноразовой песочнице. Всё шифруется до того, как покинет кластер.

  CLI tenax работает с Tenax в вашем кластере: показывает копии и окно восстановления, восстанавливает базу или том на точную секунду, открывает песочницы и запросы, сравнивает версии и открывает веб-консоль.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.1
InstallationNotes: "Проверьте установку командой `tenax version`; `tenax console` открывает веб-консоль Tenax из текущего контекста Kubernetes."
