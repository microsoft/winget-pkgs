ShortDescription: "Linha de comando do Tenax: backups no Kubernetes e restauração de qualquer segundo para Postgres, MySQL e volumes."
Description: |-
  O Tenax faz backup, no seu próprio bucket S3, dos bancos Postgres e MySQL e dos volumes que você roda no Kubernetes, transmite cada mudança assim que ela acontece e restaura qualquer segundo em um sandbox descartável. Tudo é criptografado antes de sair do cluster.

  A CLI tenax conversa com o Tenax instalado no seu cluster: lista backups e a janela de restauração, restaura um banco ou volume em um segundo exato, abre sandboxes e consultas, compara versões e abre o console web.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.1
InstallationNotes: "Confira a instalação com `tenax version`; `tenax console` abre o console web do Tenax do seu contexto atual do Kubernetes."
