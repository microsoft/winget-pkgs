ShortDescription: "Ligne de commande de Tenax : sauvegardes Kubernetes et restauration à la seconde pour Postgres, MySQL et les volumes."
Description: |-
  Tenax sauvegarde dans votre propre bucket S3 les bases Postgres et MySQL et les volumes que vous exécutez sur Kubernetes, diffuse chaque modification dès qu'elle se produit et restaure n'importe quelle seconde dans un bac à sable jetable. Tout est chiffré avant de quitter le cluster.

  La CLI tenax dialogue avec le Tenax installé dans votre cluster : elle liste les sauvegardes et la fenêtre de restauration, restaure une base ou un volume à la seconde près, ouvre des bacs à sable et des requêtes, compare des versions et ouvre la console web.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.1
InstallationNotes: "Vérifiez l'installation avec `tenax version` ; `tenax console` ouvre la console web du Tenax de votre contexte Kubernetes actuel."
