ShortDescription: "Tenax 명령줄: Postgres, MySQL, 볼륨을 위한 Kubernetes 백업과 초 단위 복원."
Description: |-
  Tenax는 Kubernetes에서 실행하는 Postgres·MySQL 데이터베이스와 볼륨을 여러분의 S3 버킷에 백업하고, 모든 변경을 발생 즉시 전송하며, 원하는 1초를 일회용 샌드박스로 복원합니다. 모든 데이터는 클러스터를 떠나기 전에 암호화됩니다.

  tenax CLI는 클러스터의 Tenax와 통신하여 백업과 복원 가능 구간을 보여 주고, 데이터베이스나 볼륨을 정확한 초로 복원하며, 샌드박스와 쿼리를 열고, 버전을 비교하고, 웹 콘솔을 엽니다.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.1
InstallationNotes: "`tenax version`으로 설치를 확인하세요. `tenax console`은 현재 Kubernetes 컨텍스트에 있는 Tenax의 웹 콘솔을 엽니다."
