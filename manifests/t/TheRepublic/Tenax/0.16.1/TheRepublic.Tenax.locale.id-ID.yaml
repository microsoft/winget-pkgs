ShortDescription: "Baris perintah Tenax: cadangan Kubernetes dan pemulihan ke detik mana pun untuk Postgres, MySQL, dan volume."
Description: |-
  Tenax mencadangkan basis data Postgres dan MySQL serta volume yang Anda jalankan di Kubernetes ke bucket S3 milik Anda, mengalirkan setiap perubahan saat terjadi, dan memulihkan detik mana pun ke sandbox sekali pakai. Semuanya dienkripsi sebelum keluar dari klaster.

  CLI tenax berbicara dengan Tenax di klaster Anda: menampilkan cadangan dan jendela pemulihan, memulihkan basis data atau volume ke detik yang tepat, membuka sandbox dan kueri, membandingkan versi, dan membuka konsol web.
Tags: [kubernetes, postgres, mysql, backup, restore, pitr, disaster-recovery, database, s3, cli]
ReleaseNotesUrl: https://github.com/republic-global/tenax-cli/releases/tag/v0.16.1
InstallationNotes: "Periksa instalasi dengan `tenax version`; `tenax console` membuka konsol web Tenax dari konteks Kubernetes Anda saat ini."
