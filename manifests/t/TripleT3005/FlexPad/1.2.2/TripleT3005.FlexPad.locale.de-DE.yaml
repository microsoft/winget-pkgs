Description: |-
  FlexPad ist ein frei konfigurierbares Makro-Pad auf Basis des ESP32-S3, das als USB-Tastatur und Mediensteuerung arbeitet.
  In der Desktop-App platzierst du Taster und Drehgeber auf einer Fläche, weist GPIO-Pins und Makros zu und überträgst Konfiguration und Firmware per USB auf das Gerät.
  Einmal eingerichtet, funktioniert das Gerät ohne die App.
