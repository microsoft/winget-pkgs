ShortDescription: Configurator for FlexPad, a freely configurable macro pad based on the ESP32-S3.
Description: |-
  FlexPad is a freely configurable macro pad based on the ESP32-S3 that acts as a USB keyboard and media controller.
  The desktop app lets you place push buttons and rotary encoders on a canvas, assign GPIO pins and macros, and transfers the configuration and firmware to the device over USB.
  Once configured, the device works without the app.
