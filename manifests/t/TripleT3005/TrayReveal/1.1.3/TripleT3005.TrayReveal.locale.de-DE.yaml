ShortDescription: Hält die Tray-Icons von Windows 11 sichtbar, indem es neue Symbole im Infobereich automatisch einblendet.
Description: |-
  Windows 11 versteckt jedes neue Tray-Icon im Überlaufmenü und bietet die Option „Immer alle Symbole anzeigen“ nicht mehr an.
  TrayReveal bringt sie zurück: eine kleine Tray-App, die neue Symbole im Infobereich sofort einblendet oder alle sichtbar hält, mit Ausnahmen für einzelne Apps.
  Sie läuft als Standardbenutzer, schreibt nur in HKCU und hat keine Telemetrie.
