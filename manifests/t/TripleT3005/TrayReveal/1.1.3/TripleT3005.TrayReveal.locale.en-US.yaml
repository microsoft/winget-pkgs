ShortDescription: Keeps Windows 11 tray icons visible by showing new notification area icons automatically.
Description: |-
  Windows 11 hides every new tray icon behind the overflow menu and no longer offers the "Always show all icons" option.
  TrayReveal brings it back: a tiny tray app that shows new notification area icons right away or keeps all of them visible, with exceptions for single apps.
  It runs as a standard user, writes only to HKCU and has no telemetry.
