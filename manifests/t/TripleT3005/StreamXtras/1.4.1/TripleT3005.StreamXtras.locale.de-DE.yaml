ShortDescription: Schlanke, selbst gehostete Extras für deinen Stream in OBS – Chatbox, Alerts und mehr.
Description: |-
  StreamXtras ist eine kostenlose, selbst gehostete Alternative zu gehosteten Overlay-Diensten für OBS.
  Eine kleine Begleit-App läuft im Infobereich und stellt eine Chatbox mit Emotes von Twitch, 7TV, BetterTTV und FrankerFaceZ, Alerts, Ziele, letzte Ereignisse, Top-Emotes und Text-to-Speech bereit, dazu eine lokale Einstellungsseite mit Live-Vorschau.
  Kein Konto bei einem Drittdienst, kein Tracking.
