ShortDescription: Lightweight, self-hosted extras for your stream in OBS – chat box, alerts and more.
Description: |-
  StreamXtras is a free, self-hosted alternative to hosted overlay services for OBS.
  A small companion app runs in the system tray, serves a chat box with Twitch, 7TV, BetterTTV and FrankerFaceZ emotes, alerts, goals, recent events, top emotes and text-to-speech, and provides a local settings page with live preview.
  No account with a third-party service, no tracking.
