ReleaseNotes: |-
  AI is ripping. Finally got around to clearing out some long-standing issues, formalize a grammar (though it's still wip), fix a bunch of corner cases, tedious issues, etc. I'm focusing on 2 things:
  1. Performance -- across size of build (mainly for client-side/JS use case), size of output, and speed. All 3 have advanced significantly in this release, somewhat near capabilities of public frontier models. We'll revisit when the Reimann Hypothesis-solving generation of models come out.
  2. Animations. I make a lot of 3b1b-type explainer videos to understand things in my day-to-day work and the quality is tempermental. There's a 3b1b library for their animations but it didn't work well for me and I've removed it from my prompts. I'm more motivated to do well here for my own use case, so I want to make animations in D2 really nice throughout the 0.10 series of releases.
  I plan to cut a 1.0 soon finally. There'll be more one-time breaking changes like consolidating casing/hyphenation (e.g. sequence_diagram to sequence-diagram).
  AI-generated changelog:
  Features 🚀
  - Animated transitions. Set animate-duration to animate styles, gradients, text decorations, grid edits, and sketch shading in SVG or GIF. It defaults to zero. animate-interval sets the minimum time per board. Timing · Grid examples
  Cache stampede source
  - TALA step animations. Small edits can preserve node positions and routes across steps and scenarios. Connections draw in, groups move between containers, trailing SQL rows slide in or out, and sequence messages travel to their receivers. Animated steps and source · Go API
  Warning
  Animated transitions are in alpha. Send feedback or suggestions.
  - Language server. Run d2 lsp for live diagnostics, completion, and formatting in your editor. Go to definition, find references, and rename shapes across open diagrams and their imports. In VS Code, install the official extension with code --install-extension d2lang.d2lang. VS Code guide · Other editors
  - MCP server. Run d2 mcp to let an AI client look up D2 syntax, check diagrams, and render PNG, SVG, or text. Starting with v0.10.0, stable releases publish io.github.d2lang/d2 to the official MCP Registry after the PyPI package ships. Set up Codex or Claude Code · Registry listing manifest
  - ELK. Set elk-algorithm in the diagram. New options control edge routing, layer placement, tree ordering, and spacing. Compare algorithms · Layered options
  - Configuration. Set scale and force-appendix in vars.d2-config, and dagre-nodesep and dagre-edgesep in vars.d2-config.data. Export options · Dagre spacing
  - Connections. Crossing lines now leave a transparent gap in the back line where there’s room. #3011
  - Themes. Select light and dark themes by name, for example theme-id: Terminal or --dark-theme dark-mauve. Themes
  - Syntax. Use unquoted labels like cost $5 and #oncall, colors like #abc, and names like R&D. Variables can use keyword names, and nested shapes can be named layers, scenarios, or steps. Punctuation · Hash-prefixed labels and keyword names
  - Formatter. d2 fmt README.md formats D2 fences in Markdown. Use d2 fmt --check --diff README.md to show a diff in CI. Formatter options
  - Installation. Run the CLI with uvx d2lang, or install it in CI with d2lang/setup-d2@v1. Windows x64 now has a -user.msi installer for users without administrator rights. uv and uvx · GitHub Actions · Windows
  - Linux packages. Install a specific GitHub release with APT on Debian or Ubuntu (amd64, arm64) or DNF on Fedora or RHEL (x86_64, aarch64). Download the matching .deb or .rpm and pass its local path to the package manager. Debian and Ubuntu · Fedora and RHEL
  - Language reference. Explore the grammar with railroad diagrams, EBNF, and parser conformance cases. Download the docs as Markdown, by page or in one file. Grammar reference · Conformance cases · Page index · Full text

