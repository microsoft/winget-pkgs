  - TALA aligns connections across containers, centers parallel branches, packs hierarchies more tightly, and routes larger diagrams. #3034 · #2986 · #3025
  - Grids balance row widths with grid-rows alone and column heights with grid-columns alone. Grid layouts
  - Exports. Repeated renders reuse bundled font measurements and subsets. Animated SVG connections respect prefers-reduced-motion. Multiboard exports preserve user edits, roll back on failure, and give reserved or nonportable board names hashed filenames. Links between boards follow the new paths. Font caching · #2976 · #2900
  - File and image access. Exports validate image contents and sizes. Use --allow-private-network for trusted internal images or --allow-local-files=false to disable local reads by diagrams. Go callers must set CompileOptions.FS to enable imports. Image access is configured separately. Go import options · Image options
  - Watch mode authenticates browser sessions through the URL printed by d2 --watch. #2910
  - Installation. Standalone installs verify SHA-256 checksums. Add --verify-provenance to verify signed builds locally. Source builds require Go 1.27.4 or newer. Go module installs report the installed D2 version in the CLI, LSP, and MCP server. Installer verification · Build from source

  Bugfixes ⛑️
  - CLI exports. Navigating the watch preview keeps the complete export on disk. Watch resolves Windows imports relative to their diagram. Links open boards with dotted names in SVG, PDF, and PowerPoint. The CLI preserves the source when input and output identify the same file. Text export honors source-selected TALA, and D2_STDOUT_FORMAT selects the format for stdout. #3076
  - Dagre. Containers keep the same dimensions across runs. Nested diagrams with connections between sibling containers can now render when Dagre previously failed during ordering or edge routing. Deterministic layouts · Nested diagrams
