ShortDescription: Takes a decision apart, down to the assumptions holding it up.
Description: |-
  Doti is an offline thinking tool. You write three sentences on an auto-organising board — AGENT, ACTION, PURPOSE — and every word in them becomes clickable. Click one to define it; the definition becomes its own card, and the words inside it are clickable too, as deep as you want to go. At the leaves, because-statements chain back to the assumption underneath.
