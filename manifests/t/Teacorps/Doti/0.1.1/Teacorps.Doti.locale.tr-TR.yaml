Description: |-
  Doti çevrimdışı çalışan bir düşünme aracı. Kendiliğinden düzenlenen bir panoya üç cümle yazarsınız: ÖZNE, EYLEM, AMAÇ. Bu cümlelerdeki her sözcük tıklanabilir olur. Birine tıklayıp tanımını yazarsınız; tanım kendi kartına dönüşür, o karttaki sözcükler de tıklanabilir. İstediğiniz kadar derine inebilirsiniz. En uçta, alttaki varsayıma bağlanan “çünkü” cümleleri yer alır.
