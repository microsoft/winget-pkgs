ShortDescription: Static code-hotspot prioritization and LLM-assisted refactoring CLI.
Description: |-
  isw statically ranks the files of a project by EPU, a prioritization indicator built
  from code-level signals (loops, nesting, branching, database and HTTP calls, duplicated
  blocks) and each file's share of the code, so developers know where to look first. It
  can drive a developer-supervised LLM agent to refactor those files, logs every
  suggestion and its outcome, and measures real duration, CPU and RAM with `isw measure`.
  EPU is not an energy measurement. Distributed as a single self-contained binary.
