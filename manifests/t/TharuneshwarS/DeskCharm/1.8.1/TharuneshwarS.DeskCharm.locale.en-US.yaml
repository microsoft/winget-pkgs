ShortDescription: A nazar for your desktop, calm for your day. A small, private desktop companion with a swinging charm, desk visitors and gentle calm tools.
Description: |-
  DeskCharm hangs a charm (a nazar, a temple bell, Ganesha, a lucky elephant and more) from the top corner of your screen. It swings as you move past, and you can grab, fling and squeeze it.
  Desk visitors walk along your taskbar to remind you to drink water, stretch, breathe or take a break. Calm tools include guided breathing, a focus timer with tasks, break and eye-rest reminders, mood check-ins, your own reminders with streaks, counters and insights.
  Everything stays on your PC: no account, no analytics, no tracking. Free, with an optional one-time lifetime Pro licence.
