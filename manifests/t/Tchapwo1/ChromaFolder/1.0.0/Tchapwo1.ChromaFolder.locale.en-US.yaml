ShortDescription: Color-code any Windows folder directly from File Explorer with zero telemetry and 0 MB background RAM.
Description: |-
  ChromaFolder is a lightweight, offline-first desktop utility that lets you assign distinct colors
  to folders directly from the Windows File Explorer context menu.

  Features:
  - Six vibrant, hand-tuned folder colors (Red, Blue, Green, Yellow, Orange, Purple)
  - 1-click Reset to default Windows folder appearance
  - 0 MB background RAM: executes on-demand with zero daemon processes
  - Zero telemetry or analytics: 100% private and offline
  - Zero UAC elevation required: installs cleanly in user space
