ReleaseNotes: |-
  Tera Term (Ver 5.7.1), TTSSH (Ver 3.7.1)
  主な変更点
  - PPK 形式の秘密鍵（DSA, RSA, ECDSA）が正しく読み込まれない問題を修正した。 (issue #1536)
  - LibreSSL 4.3.3 へ差し替え、ARM64 で特定の場合に SSH 接続できない不具合が解消された。 (issue #1567, issue #1554)
  - インストーラーで現在のユーザー用にインストールした時、.ttl などの拡張子の関連付けや、ssh などの URL の関連付けが行われない不具合を修正した。 (issue #1562)
  すべての変更については、変更履歴を確認してください。
  https://teratermproject.github.io/manual/5/ja/about/history.html#teraterm_5.7.1
  Major changes
  - Fixed an issue where private keys in PPK format (DSA, RSA, and ECDSA) were not loaded correctly. (issue #1536)
  - Upgraded LibreSSL to 4.3.3, resolving an issue where SSH connections could fail in certain cases on ARM64. (issue #1567, issue #1554)
  - Fixed an issue where file extension associations such as .ttl and URL associations such as ssh were not registered when the installer installed Tera Term for the current user only. (issue #1562)
  To check all changes, see the changelog.
  https://teratermproject.github.io/manual/5/en/about/history.html#teraterm_5.7.1
