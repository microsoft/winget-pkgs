ReleaseNotes: "### Tera Term (Ver 5.7.0), TTSSH (Ver 3.7.0)\n\n主な変更点\n\n• シリアル送信時の送信サイズ制限を実装した。 (issue #1000)\n• TeraTerm Menu のメモリ上のパスワード保護を強化した。 (issue #1293)\n• TTXttyrec, TTXttyplay の再生・録画機能を強化した。 (issue #1388, #1326, #1487, #1405)\n• \"全てのユーザー用にインストール\" / \"現在のユーザー用にインストール\" を選択できるようにした。 (issue #1156)\n\nすべての変更については、変更履歴を確認してください。\nhttps://teratermproject.github.io/manual/5/ja/about/history.html#teraterm_5.7.0\n\n-----\nMajor changes\n\n• Implemented send size limit for serial transmission. (issue #1000)\n• Enhanced password protection in memory for TeraTerm Menu. (issue #1293)\n• Enhanced the recording and playback features of TTXttyrec and TTXttyplay. (issue #1388, #1326, #1487, #1405)\n• Installer shows dialog to choose between \"Install for all users\" and \"Install for me only\". (issue #1156)\n\nTo check all changes, see the changelog.\nhttps://teratermproject.github.io/manual/5/en/about/history.html#teraterm_5.7.0\n\n-----\n• installer\n  <a href=\"https://github.com/TeraTermProject/teraterm/releases/download/v5.7.0/teraterm-5.7.0-x64.exe\"><img alt=\"teraterm-5.7.0-x64.exe\" src=\"https://img.shields.io/github/downloads/TeraTermProject/teraterm/v5.7.0/teraterm-5.7.0-x64.exe\"></a>\n  <a href=\"https://github.com/TeraTermProject/teraterm/releases/download/v5.7.0/teraterm-5.7.0-x86.exe\"><img alt=\"teraterm-5.7.0-x86.exe\" src=\"https://img.shields.io/github/downloads/TeraTermProject/teraterm/v5.7.0/teraterm-5.7.0-x86.exe\"></a>\n  <a href=\"https://github.com/TeraTermProject/teraterm/releases/download/v5.7.0/teraterm-5.7.0-arm64.exe\"><img alt=\"teraterm-5.7.0-arm64.exe\" src=\"https://img.shields.io/github/downloads/TeraTermProject/teraterm/v5.7.0/teraterm-5.7.0-arm64.exe\"></a>\n• portable ZIP\n  <a href=\"https://github.com/TeraTermProject/teraterm/releases/download/v5.7.0/teraterm-5.7.0-x64.zip\"><img alt=\"teraterm-5.7.0-x64.zip\" src=\"https://img.shields.io/github/downloads/TeraTermProject/teraterm/v5.7.0/teraterm-5.7.0-x64.zip\"></a>\n  <a href=\