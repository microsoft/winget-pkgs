# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.10.0.schema.json

# winget manifest set for Tide (PackageIdentifier: Tide.Tide).
#
# First-time submission (only needed once):
#   1. wingetcreate new https://github.com/code-with-current/tide
#      (point it at the latest release; it infers installer type + SHA)
#   2. Review the generated manifests, then: wingetcreate submit <dir>
#      This opens a PR to microsoft/winget-pkgs.
#   3. Once merged, `winget install Tide.Tide` works globally.
#
# After the first merge, subsequent releases bump automatically via
# .github/workflows/release-pkgs.yml (wingetcreate update ... --submit).
#
# Markers filled by packaging/render.mjs: VERSION, VERSION_WINGET, SHA256_EXE.
# These three files belong in a single version directory:
# manifests/t/Tide/Tide/<PackageVersion>/.

PackageIdentifier: Tide.Tide
PackageVersion: "0.1.2.0"
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.10.0
