ReleaseNotes: |-
  GestureSign V2 18.2.9

  • 基于开发者预览 0.4，包含本地意图学习与实验性 AI 否决功能。
  • 接入 AMD NPU：NPU 执行线性计算，CPU 完成归一化、Sigmoid 和精度复核，界面明确显示实际后端。
  • 修复已安装 AMD 推理组件未就绪时检测不到 NPU、WindowsApps 路径导致编译失败、工作目录写入受限的问题。
  • 硬件初始化或数值验证失败时自动回退 GPU / CPU。
  • MSI 和便携版均包含本地 AI 推理组件；AMD 官方运行时按目标电脑环境准备，不包含个人训练模型或样本。

  下载：
  • GestureSign-V2-18.2.9-x64.msi：安装版。
  • GestureSign-V2-18.2.9-x64-portable.zip：便携版，解压后运行 GestureSign.WinUI.exe。
  • GestureSign-IntentDlc-18.2.9-win-x64.zip：配套组件离线包，完整安装版和便携版已内置。
  • SHA256SUMS.txt：下载校验值。

  运行环境：Windows x64，.NET 10 Desktop Runtime、Windows App SDK Runtime。使用 NPU 还需兼容的 AMD NPU、驱动及 Windows ML 官方执行提供程序；可在程序中点击“准备 NPU / GPU 组件”。

  验证：AMD Ryzen AI Z2 Extreme 上通过 1559 组输入测试；包含初始化共 1562 次 NPU 执行。最终分数相对 CPU ONNX 最大误差约 0.000000894。其他 NPU 型号尚未完成实机验证。

  说明：当前为 NPU + CPU 混合验证实现，最终使用 CPU 复核后的分数，不代表纯 NPU 推理或性能提升。AI 否决仍是实验功能。
