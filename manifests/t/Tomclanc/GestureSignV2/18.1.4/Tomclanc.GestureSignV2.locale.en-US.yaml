ReleaseNotes: |-
  - Expanded the interface, settings, editors, dialogs, update notifications, and tray menu to 90 Windows language and regional variants.
  - Added right-to-left layout for Arabic, Persian, Hebrew, Urdu, and Uyghur.
  - Fixed mouse gesture capture potentially continuing to intercept clicks in games and handheld interfaces.
  - Improved Kando migration so upgrades preserve existing components and user settings; downloads automatically select x64 or ARM64.
