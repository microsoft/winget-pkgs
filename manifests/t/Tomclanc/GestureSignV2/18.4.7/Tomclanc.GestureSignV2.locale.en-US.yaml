ReleaseNotes: |-
  - Synchronize AI veto controls with confirmed engine state and allow veto-off during training.
  - Reduce false vetoes for strong two-finger curved templates while retaining Smart Close and scrolling safeguards.
  - Fix elevated configuration pickers and disabled-task startup state reporting.
  - Update optional learning components to 18.4.7 and add translated AI status labels in 90 locales.
