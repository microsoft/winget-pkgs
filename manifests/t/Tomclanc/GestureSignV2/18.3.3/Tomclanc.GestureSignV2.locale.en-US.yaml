ReleaseNotes: |-
  - Fix independent multitouch drawing and stroke ordering during recognition.
  - Preserve first-finger right-click positioning and display all saved gestures.
  - Integrate Japanese translations and improve UI localization.
  - Download the latest stable Kando for the correct architecture; add managed updates with rollback.
  - Provide slim x64 and ARM64 installers and portable archives using shared runtimes. Kando remains an optional download.
