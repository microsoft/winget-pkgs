ReleaseNotes: |-
  - Run multiple commands per gesture in sequence, with delays and ordering controls.
  - Bind drawn gestures independently to left, middle and right mouse buttons.
  - Add mouse button and wheel combinations without drawing.
  - Fix stale touchscreen contact release handling.
  - Localize new controls in all 90 supported locales; AI and Kando remain optional.
