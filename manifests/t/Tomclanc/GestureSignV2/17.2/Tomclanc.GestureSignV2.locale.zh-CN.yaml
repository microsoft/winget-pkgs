ReleaseNotes: |-
  - 修复部分触摸屏及 OLED 设备无法触发手势的问题，改进原始触控数据包与触点 Tip 状态解析。
  - 完善便携版识别和卸载流程，可正确关闭相关进程并清理便携目录。
  - 卸载程序新增 Per-Monitor V2 高 DPI 适配，修复 200% 缩放下的布局裁切。
  - 卸载程序支持系统深色 / 亮色标题栏、圆角按钮和主题化圆角进度条。
  - 卸载程序标题栏、任务栏及 Alt+Tab 统一显示 GestureSign V2 图标。
