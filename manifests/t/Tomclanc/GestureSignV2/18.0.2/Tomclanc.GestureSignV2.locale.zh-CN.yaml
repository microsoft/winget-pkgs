ReleaseNotes: |-
  - 新增智能新建标签页，适配浏览器、资源管理器、Windows 终端、VS Code 和新版记事本。
  - 改进 H3C MegaBook 等设备的双指触摸屏识别，可合并分散上报的触点帧。
  - 记录触点抬起时的最终坐标，修复只报告起点和终点的设备无法识别边缘滑动方向的问题。
  - 从托盘暂停识别后，设置页面会变淡并禁用，同时显示恢复入口。
