ShortDescription: A Windows 11 focused rebuild of GestureSign for touchpad and mouse gestures.
Description: GestureSign V2 is a Windows 11 focused rebuild of the classic open-source GestureSign project. It supports touchpad gestures, touchscreen gestures, mouse gestures, gesture trails, per-app actions, ignore rules, tray controls, Smart Close, Smart New Tab, and bundled Kando radial menu quick actions.
