ReleaseNotes: |-
  - 修复触摸屏边缘动作可能错误回退到对侧边缘的问题；右侧滑动不会再触发仅绑定在左侧的动作，上下边缘也会按实际起始边缘严格匹配。
  - 调整鼠标动作的位置选项文案，明确区分“第一个触点”和“最后一个触点”，并分别提供按下、抬起位置。
  - 开启“移动鼠标”后，可以选择对应触点作为鼠标移动和右键等操作的目标位置，原有配置继续兼容。
