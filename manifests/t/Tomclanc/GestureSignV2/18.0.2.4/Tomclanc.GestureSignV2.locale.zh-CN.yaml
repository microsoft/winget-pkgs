ReleaseNotes: |-
  - 新增按动作选择触摸屏、触控板、鼠标和笔设备。
  - 改进近乎同时落下的双指触摸屏点按，并在当前手势第一根手指松开的位置发送右键。
  - 修复鼠标动作偶尔复用上一次手势坐标的问题。
  - 保持双指绘制手势的完整轨迹识别，避免点按逻辑提前触发。
  - 改进 H3C MegaBook 等设备的触点分帧、抬起同步和轨迹顺序处理。
