ReleaseNotes: |-
  - Fix the first Set Command click after startup and preserve action bindings during settings refresh.
  - Resolve current actions automatically after configuration reloads.
  - Add repeated-click protection, recovery diagnostics and action-selection regression tests.
  - Complete UI catalogs for 90 locales and fix Traditional Chinese / Korean fallback paths. Machine-assisted supplements still need native review.
