ShortDescription: Local-first SSH connection manager with embedded terminal, SFTP, port forwarding, and serverless P2P sync.
Description: |-
  TerminalLynx is a local-first, cross-platform SSH connection manager for Windows, macOS, and Linux.
  It provides an embedded SSH terminal, SFTP file browser, local/remote/SOCKS5 port forwarding, ProxyJump chains, saved command snippets, and encrypted peer-to-peer device and team synchronization over QUIC without relying on a cloud backend.
