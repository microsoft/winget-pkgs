ReleaseNotes: |-
  - 进程管理默认勾选信任进程（避免老是问为啥没有进程）
  2. 上网防护调整成拦截 DNS，而不是拦截页面（因为部分场景 IP 反向识别域名会存在 CDN 冲突，导致误拦截一些网站）
  3. 在开启 HVCI 的时候，不注入 PPL 进程，避免出现错误日志
  4. 文件事件去掉无效的远程地址（0.0.0.0）
  5. 文件访问添加重命名的拦截，避免通过重命名修改路径绕过
  6. 修复切换了工作区后，托盘还是显示旧工作区的问题
