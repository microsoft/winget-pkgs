ReleaseNotes: "## Highlights:\r\n• Adds support for the new PaddleOCR v3.7.0 version with improved accuracy for Chinese, English, Japanese and Latin languages. Other languages also profit from the improved detection model.\r\n• Adds option to save OCR detection/recognition images annotated with the detected boxes/text (currently limited to PaddleOCR), useful for reviewing or debugging OCR results\r\n• Adds Drag and Drop Support (Currently limited to Windows due to an upstream issue on Linux)\r\n• Adds option to disable frame stitching for better OCR accuracy\r\n• Adds Copy CLI command to clipboard feature\r\n• Adds option to reset settings back to default\r\n\r\n## Additional notes:\r\n• Fixed a crash of the video preview of the GUI caused by a few select video files\r\n• Fixed a mistake in the available PaddleOCR language list in the GUI\r\n• Improved performance if a brightness threshold was applied\r\n• Quite a few optimizations were done to shrink down the GUI and CLI executable size\r\n\r\n## Notes:\r\n• Utilizes standalone version of PaddleOCR from https://github.com/timminator/PaddleOCR-Standalone\r\n• Utilizes standalone version of Chrome-Lens-OCR from https://github.com/timminator/Chrome-Lens-OCR\r\n• Linux version requires glibc 2.35 or newer (can be checked by running `ldd --version` in a terminal)\r\n\r\n## Download Tips:\r\n• Windows:\r\n   • CPU version：\r\n      [VideOCR-CPU-v1.6.0-setup-x64.exe](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-CPU-v1.6.0-setup-x64.exe)\r\n   • GPU version:\r\n      [VideOCR-GPU-v1.6.0-CUDA-11.8-setup-x64.exe](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-GPU-v1.6.0-CUDA-11.8-setup-x64.exe) (Nvidia 10 Series graphics cards)\r\n      [VideOCR-GPU-v1.6.0-CUDA-12.9-setup-x64.exe](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-GPU-v1.6.0-CUDA-12.9-setup-x64.exe) (Nvidia 16 - 50 Series graphics cards)\r\n• Linux:\r\n   • CPU version：\r\n      [VideOCR-CPU-v1.6.0-Linux.7z](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-CPU-v1.6.0-Linux.7z)\r\n   • GPU version:\r\n      [VideOCR-GPU-v1.6.0-CUDA-11.8-Linux.7z](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-GPU-v1.6.0-CUDA-11.8-Linux.7z)  (Nvidia 10 Series graphics cards)\r\n      [VideOCR-GPU-v1.6.0-CUDA-12.9-Linux.7z.001](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-GPU-v1.6.0-CUDA-12.9-Linux.7z.001)  (Nvidia 16 - 50 Series graphics cards)\r\n      [VideOCR-GPU-v1.6.0-CUDA-12.9-Linux.7z.002](https://github.com/timminator/VideOCR/releases/download/v1.6.0/VideOCR-GPU-v1.6.0-CUDA-12.9-Linux.7z.002)  (Nvidia 16 - 50 Series graphics cards)"
