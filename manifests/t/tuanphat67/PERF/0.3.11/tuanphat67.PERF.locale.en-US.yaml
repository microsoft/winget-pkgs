ShortDescription: Lightweight hardware monitor for Windows with illustrated themes and an always-on-top overlay.
Description: |-
  PERF shows CPU, GPU, RAM, storage, fans, battery and network readings in one window, with five illustrated themes,
  an always-on-top click-through mini overlay you can place anywhere, live temperature on the tray icon, heat, battery
  and disk alerts, top apps by CPU, GPU and RAM, CSV session recording, one-click updates and a temporary CPU cool-down
  that always restores your power plan. English and Vietnamese interface.
