ShortDescription: Pauses and resumes your music automatically based on VALORANT match events
Description: "VibePause automatically pauses your music when a VALORANT round starts and resumes it when you die, buy, or return to the lobby, so you don't have to dive for the volume mixer mid-match. It has no overlay, no game injection, and no memory reading: it reads a local log file, uses Windows' built-in OCR to detect eliminations entirely in memory, and controls Windows media playback directly. You can configure each match event independently in either Pause mode or Volume mode, and the main window shows what's currently playing with full media controls built in."
