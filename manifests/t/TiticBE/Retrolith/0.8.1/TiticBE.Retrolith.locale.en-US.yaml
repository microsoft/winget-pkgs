ShortDescription: Retro game collection manager for Windows, based on DAT files.
Description: |-
  Retrolith checks your ROMs against reference DATs (TOSEC, No-Intro, Redump, MAME, FinalBurn Neo) or your own catalogs,
  files them into the official zips, fetches info and media from ScreenScraper, and syncs your lists to Recalbox,
  Batocera, MiSTer and LaunchBox. It contains and downloads no games.
