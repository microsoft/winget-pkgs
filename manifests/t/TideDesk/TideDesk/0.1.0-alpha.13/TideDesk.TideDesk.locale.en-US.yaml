ShortDescription: Remote desktop for Windows with sound, direct between your computers, no account.
Description: |-
  TideDesk lets you see and control another Windows computer and hear what it plays.
  Sessions go directly between the two computers, encrypted with QUIC and TLS 1.3, and are never relayed through a server.
  Connect by device ID or address with an access code; no account is needed.
  Free for personal use; work use needs a licence (see https://tidedesk.app/pricing/).
  This is an early alpha.
