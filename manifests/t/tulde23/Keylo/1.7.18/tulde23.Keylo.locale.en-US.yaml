ShortDescription: Secrets manager that lets AI agents use your API keys and tokens without seeing them.
Description: |-
  Keylo keeps your API keys, passwords and tokens on your PC, protected by your Windows account, and
  hands them to the commands that need them, never to the AI agent that runs those commands. Agents
  connect through its MCP server, values are redacted from command output, uses outside an agent's
  access key need your approval with Windows Hello, and every use is logged.
