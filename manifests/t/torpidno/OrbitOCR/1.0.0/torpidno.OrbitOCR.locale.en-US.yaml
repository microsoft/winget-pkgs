ShortDescription: Circle to Search for Windows - offline screen OCR and visual search
Description: >-
  OrbitOCR is a free, open-source screen OCR and visual search utility for Windows 10/11.
  Press a global hotkey to freeze and dim the entire desktop, then click or drag over any
  recognized text to copy it or search it on Google, or draw a freehand circle around any
  image to search it with Google Lens. Text recognition runs entirely on-device using the
  OCR engine built into Windows, so there is no cloud OCR, no telemetry, and no external
  runtimes such as Tesseract or Python. It ships as a portable single executable with no
  installer and no admin rights required.
