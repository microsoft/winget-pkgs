PackageIdentifier: TsubasaTommy.OptimizeImageFolder
PackageVersion: 0.2.0
PackageLocale: ja-JP
Publisher: TsubasaTommy
PackageName: Optimize Image Folder
License: MIT
ShortDescription: 写真フォルダを画質の劣化なしで JPEG XL に変換します。待機中のリソース使用はゼロです。
Description: |-
  ピクチャ フォルダを監視し、追加された写真を画質の劣化なしで JPEG XL に変換します。
  JPEG は元の JPEG にバイト単位で戻せる形で再圧縮し、PNG・TIFF・BMP・ロスレス WebP は完全ロスレスで変換します。
  元ファイルを消す前に、毎回変換結果を検証します。待機中は CPU を使いません。
  インストーラーは Microsoft 公式の無料拡張「JPEG XL Image Extension」(Windows 11 24H2 以降) も入れられるので、エクスプローラーやフォトでそのまま表示できます。
ManifestType: locale
ManifestVersion: 1.28.0
