ShortDescription: Converts photo folders to JPEG XL without any quality loss, using no resources while idle.
Description: |-
  Watches your Pictures folder and converts new photos to JPEG XL without any quality loss.
  JPEGs are recompressed so the identical JPEG can be rebuilt byte for byte; PNG, TIFF, BMP and lossless WebP are encoded losslessly.
  Every conversion is verified before the original is removed. While idle the agent uses no CPU.
  The installer can also install Microsoft's free JPEG XL Image Extension (Windows 11 24H2 and later) so Explorer and Photos can show the files.
