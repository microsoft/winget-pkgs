ShortDescription: Drag a file, give it a little shake, and convert it from a radial menu under your cursor.
Description: |-
  SATF (Shake And Throw Files) shows a small radial menu right under your cursor when you shake a file you're dragging (or press Alt+Shift+Space).
  Drop the file on a format to convert images, PDFs, Office documents, video and audio; merge several files into one PDF, split a PDF, zip files, or extract archives.
  Quick edits too: rotate, resize, compress, squeeze under a target size, remove location and camera info, stack images, rotate PDFs.
  A floating Shelf lets you collect files and drag them out together. Everything runs locally: no account, no uploads.
