ReleaseNotes: |-
  新功能
  - 备份管理支持配置并预览备份运行目录模板，备份历史支持按筛选结果全选与批量删除 (contributed by @eryajf) (PR #8511)
  - 新增 AI 面板全局切换快捷键，打开 AI 助手时可自动恢复最近对话 (contributed by @eryajf) (PR #8504)
  - MySQL 支持同时选中多张表批量设置自增起始值 (contributed by @leekeep) (PR #8412)
  - Redis Hash 详情行的复制菜单支持复制字段、值或字段加值 (contributed by @Abeautifulsnow) (PR #8503)
  - 新增外部 SQL 文件大小上限设置，默认 200 MiB，最高可配置至 4096 MiB (PR #8500)
  改进
  - 默认查询超时从 30 秒提高到 60 秒，降低长查询被提前取消的情况
  - 优化侧边栏已保存 SQL 树与导出元数据的加载性能，减少重复开销
  - 优化标签分组栏的渲染性能，标签数量较多时更流畅
  修复
  - 修复打开较大 Redis Hash/Set 集合 key 详情时长时间卡顿的问题
  - 修复数据表重新加载后侧边栏定位失败的问题
  - 修复 Elasticsearch 查询结果超过 10000 行后分页数据不正确的问题
  - 修复 Hologres 等 PostgreSQL 系分区父表首次打开字段为空、需手动刷新的问题
  - 修复 Oracle 跨 schema 同义词的字段类型与注释无法显示的问题
  - 修复 SQL Server 2000 修改数据保存时报连接已关闭的问题 (contributed by @zipg) (PR #8492)
  - 修复 JDBC 使用自定义 MySQL 驱动时查看表 DDL 丢失注释、索引和字符集信息的问题 (contributed by @1320209572) (PR #8488)
  - 修复 MCP 工具权限设置缺少批量执行工具权限项的问题 (contributed by @1320209572) (PR #8443)
  - 修复 MCP 连接更新或删除后连接池未刷新、复用旧凭据的问题 (contributed by @1320209572) (PR #8455)
  - 修复设置列格式化后数据表首次打开时列宽未按格式化内容计算的问题
  - 修复结果表格启动初始化未完成时提前触发列宽刷新导致报错的问题
  - 统一查询结果各导出入口的图标语义，导出统一使用上传图标 (contributed by @DASungta) (PR #8274)
  - 修复经典样式标签内容换行时标签栏被撑高为多行的问题
  - 修复标签栏提示内容的换行与布局显示异常的问题 (contributed by @eryajf) (PR #8508)
  赞助信息
  - 赞助伙伴 Jalapeno Cloud 平台已上线 GLM 5.3 模型，DBX 内通过 Jalapeno Cloud AI 预设可直接调用，点此访问
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.8 拉取。
