ReleaseNotes: |-
  新功能
  - MCP 资源组访问范围与权限继承 — MCP 权限支持按资源分组配置访问范围并逐层继承，覆盖分组、连接、数据库三个层级，MCP 管理页面信息架构同步重构，配置更清晰。 (contributed by @eryajf) (PR #8288)
  - SQL 标识符引号开关 — 编辑器设置新增「生成 SQL 标识符引号」开关，控制新建查询与侧边栏生成的 SQL 是否为表名、模式名等标识符添加数据库方言引号。 (contributed by @eryajf) (PR #8289)
  - 结构比较忽略大小写 — 结构比较新增「忽略表名大小写」与「忽略字段名大小写」选项，跨库或跨环境对比时仅大小写不同的对象不再被误判为新增或删除，默认保持大小写敏感。 (contributed by @0verme) (PR #8280)
  - 表信息面板固定显示 — 表信息面板支持固定并持久化设置，固定后切换数据表时自动展示表信息。 (contributed by @eryajf) (PR #8272)
  - SQL INSERT 导出模式 — SQL INSERT 导出支持选择「批量追加」（多行共用一条 INSERT）或「每行独立」（每行一条完整 INSERT）输出模式，默认沿用批量模式保持旧行为。 (contributed by @0verme) (PR #8262)
  - AI 跳过 TLS 证书校验 — 自定义、OpenAI 兼容与 Anthropic 兼容型 AI 服务支持跳过 SSL 证书校验，自签名或私有 CA 的内网 AI 网关可直接接入。 (contributed by @Resheba) (PR #8180)
  - 华龙 AI 预设 — AI 服务新增合作伙伴华龙 AI（HuaLongAI）预设，可快速获取 API Key 接入。 (commit 450d9fb9e)
  - 虚谷服务器监控仪表盘 — 虚谷数据库连接新增只读服务器仪表盘，展示数据库版本、在线节点、会话与活跃事务、表级锁等待、节点 CPU 负载与磁盘读写、缓冲池/SGA/交换区内存等运行状态。 (commit 3e82d6d65)
  - MQTT 消息 Payload 搜索 — MQTT 控制台消息列表新增按 Payload 内容过滤的搜索框，实时显示匹配条数与总数。 (commit 53be33c86)
  - MCP Qoder 配置 — MCP 配置页新增 Qoder 客户端接入配置模板，可一键复制使用。 (contributed by @onceMisery) (PR #8253)
  - 连接树方向键导航 — 侧边栏连接树支持 ↑/↓ 在可见行间移动选中、→ 展开或进入子节点、← 收起或回到父节点，懒加载与分组持久化行为与点击箭头一致。 (contributed by @xiaomizhou2) (PR #8226)
  改进
  - IRIS 大结果集查询性能 — 提高 IRIS JDBC 查询预取行数，近十万行量级的查询耗时大幅下降，数据量越大差距越明显。 (commit cbaccb3a3)
  - Redis 隐式扫描有界化 — Key 浏览与值搜索触发的隐式扫描改为有界扫描，大数据量库不再无限制加载导致界面卡顿。 (contributed by @ordinary-s) (PR #8249)
  修复
  - 多表 JOIN 结果编辑 — 修复多表 JOIN 查询结果只读的问题：ON 子句括号解析修正，字段更新按源表路由并在同一事务内提交，两张表的字段均可编辑提交，多源结果同时禁用不支持的 INSERT/DELETE。 (contributed by @zipg) (PR #8270)
  - 输入法组合期 Enter/Tab — 中文输入法候选框打开时按 Enter 确认候选词或 Tab 不再被补全弹层拦截，SQL 内容不再被污染。 (contributed by @dienaso) (PR #8268)
  - ORDER BY 别名误报 — SELECT 投影别名（如 ORDER BY total）不再被 SQL 语义诊断误报为 Unknown column，ORDER BY/GROUP BY/HAVING 中可见的别名均被识别。 (contributed by @zipg) (PR #8259)
  - T-SQL 临时表高亮 — SQL Server 临时表名（#temp）正确分词并参与语法高亮。 (commit 27369a40d)
  - 补全替换范围 — 接受补全候选时正确替换已输入的前缀，不再在前缀之后重复拼接。 (commit 68b1c4e97)
  - 大整数精度 — 超出 JS 安全范围（±2^53-1）的 BIGINT/超大整数值以字符串传输到前端，网格完整显示每一位数字并保持数值排序，结果不再与 Navicat 等工具不一致。 (commit 5acc5f7e8)
  - 共享结果面板鼠标收起 — 查询标签页共享结果面板的收起按钮恢复生效，收起后可用浮动按钮重新展开，执行查询时自动展开。 (contributed by @Lem26) (PR #8221)
  - 未执行查询的结果面板收起 — 新建查询尚未执行时共享结果面板不再强制常驻，可通过收起按钮隐藏。 (contributed by @q396921921) (PR #8239)
  - 自动刷新保持编辑器选区 — 结果自动刷新期间不再清除 SQL 编辑器原生选区，光标与输入恢复正常。 (contributed by @hanxuanyu) (PR #8245)
  - 特殊页面分组标签栏 — 分组标签栏统一迁移到设置、驱动管理等特殊页面工作区，标签栏在不同位置与折叠状态下的展示和尺寸恢复正确，对象源码标签不再预载空结果网格。 (contributed by @eryajf) (PR #8263)
  - 列模式特殊页空白 — 标签栏左/右侧列模式下关闭设置或驱动管理标签后再次打开，内容区不再显示空白。 (contributed by @q396921921) (PR #8234)
  - AI 深链接劫持设置 — 使用过一次 AI 供应商「一键添加到 DBX」深链接后，后续每次打开设置不再被强制跳回 AI 配置页并进入编辑态。 (contributed by @q396921921) (PR #8227)
  - 浏览对象筛选保留 — 浏览对象标签页的搜索筛选在切换标签页后保留，不再被清空恢复为全部对象。 (contributed by @q396921921) (PR #8238)
  - 侧边栏横向滚动异常 — 开启「允许侧边栏横向滚动」后，使用库内表搜索不再导致连接列表出现异常长滚动条、深色背景块甚至内容滚出可视区。 (contributed by @q396921921) (PR #8248)
  - 单库连接 Schema 筛选 — OceanBase Oracle 等单数据库连接的工具栏 Schema 选择器正确应用勾选筛选，未勾选的 Schema 不再出现；user@tenant 登录时自身 Schema 始终可选。 (commit 859841699)
  - 粘贴新行清空自增列 — 网格中复制行后粘贴到新增空白行时自动清空自增/identity 列，提交不再报主键冲突，与「复制行」行为一致。 (contributed by @q396921921) (PR #8251)
  - Mongo JSON 预览面板 — 修复列宽计算遗漏导致 Mongo JSON 预览面板被裁剪为不可见的问题，面板恢复显示且拖拽手柄恢复可用。 (contributed by @q396921921) (PR #8232)
  - Mongo 集合筛选与排序保留 — 文档集合的筛选条件和排序在切换标签页后保留，不再丢失。 (commit da03c1f0c)
  - XLSX 小数位显示 — XLSX 导出按小数位数为数值单元格匹配数字格式，0.3500000 等声明的精度在 Excel 中完整显示，不再被 General 格式截断为 0.35。 (commit 290576cb4)
  - PostgreSQL 存储过程 DDL — 探测不到 pg_get_function_identity_arguments 的兼容分支（如腾讯 TBase）上，含 DEFAULT 参数的存储过程/函数查看 DDL 不再报 Object source not found。 (contributed by @q396921921) (PR #8281)
  - PostgreSQL 9 外键兼容查询 — 外键兼容元数据查询改写为无 LATERAL 形式，PostgreSQL 9.3 之前的版本上比较架构不再报错。 (commit c0d0a62fa)
  - PostgreSQL 9 序列查询回退 — 比较架构在 PostgreSQL 9 上读取序列改用旧版系统目录回退，不再触发 500 报错。 (contributed by @q396921921) (PR #8230)
  - Oracle 空间字段查询 — 原生驱动连接下 SDO_GEOMETRY 列以 WKT 文本返回，查询含空间字段的表不再直接崩溃报错。 (contributed by @q396921921) (PR #8228)
  - Oracle 行迭代异常恢复 — 遍历结果集的 panic 被捕获并转为错误返回，自定义类型等意外字段不再导致整个 Oracle agent 无响应。 (commit dca6d0e5f)
  - Oracle SDE 字段占位 — 含 SDE 自定义字段的查询在 extproc 调用失败（ORA-28595）时回退为占位值，其余列正常返回。 (commit 295db2903)
  - 达梦自增主键插入 — 无权限读取自增元数据的普通账号通过 DDL 回退识别 identity 列，数据表格插入行不再「填与不填都报错」。 (contributed by @q396921921) (PR #8271)
  - 达梦普通用户 Schema 列表 — 普通权限账号浏览对象时可列出全部 Schema，不再缺失。 (commit b9ea54350)
  - Kingbase 多主机集群连接 — 多主机集群连接串逐端点尝试并支持每主机独立端口，集群访问不再因端口解析失败而连不上。 (commit 260c6710d)
  - Cassandra 物化视图 — 表清单上报物化视图并与普通表区分，同时跳过数据库端排序，浏览不再缺视图或受限。 (contributed by @dienaso) (PR #8265)
  - 跨库数据比较大小写 — 源/目标列与主键按大小写不敏感匹配，SQL Server → Oracle 等大小写约定不同的数据库之间数据比较不再报无公共列。 (contributed by @dienaso) (PR #8264)
  - 虚谷导出合成 Scope — 数据库导出的 Schema 选择列表不再包含 Public 同义词、定时任务等协议级合成节点。 (contributed by @mapan0424) (PR #8260)
  - SQLite 加密 SSH 提示 — SSH 隧道传输下保留 SQLCipher 密码输入框并显示明确的限制提示，不再隐藏后报出误导性的无关错误。 (contributed by @q396921921) (PR #8252)
  - Redis 子树按需加载 — 查看多层 Key 时子树填充改为有界并按需续载，不再全量加载拖垮集群。 (commit 2f63c34ff)
  - Redis 大小徽标自动刷新 — 详情面板开启自动刷新时同步更新大小徽标，不再停留在打开 Key 时的旧值。 (contributed by @q396921921) (PR #8050)
  - StarRocks 清空表 — 清空表数据改用 TRUNCATE TABLE，不再生成 StarRocks 不支持的无 WHERE DELETE 而报错。 (commit 42fb2a48a)
  - ZooKeeper SQL 查询入口 — 移除 ZooKeeper 不支持的 SQL 查询能力，新建查询不再直接报错。 (commit 0b9ddff19)
  - Redshift 多字节文本崩溃 — 以多字节字符开头的文本单元格不再触发非字符边界切片 panic，Windows 下不再出现崩溃退出。 (commit 641f82c96)
  - 批量传输连接池恢复 — 目标库出现一次瞬时连接失败后自动重建连接池，批量多表传输不再从失败点起剩余表级联失败。 (contributed by @q396921921) (PR #8241)
  - Oracle 系传输长度单位 — 从按字符计长度的源库传输到 Oracle 系目标时固定为 (n CHAR) 字符长度单位，多字节文本不再因目标按字节计长而报长度不够；Oracle 系源库保留原有单位语义。 (commit 51d340eb9)
  - 达梦表注释传输 — 表传输到达梦时同步生成表/列注释 DDL，注释不再丢失。 (commit 7390cf668)
  - 比较架构整数显示宽度 — MySQL 整数列的显式显示宽度差异（如 int(11) vs int(15)）被正确识别并生成同步脚本。 (contributed by @q396921921) (PR #8240)
  - 跨方言 VARCHAR 长度 — Kingbase/PostgreSQL 到 MySQL 系目标比较架构时，无长度的 character varying 自动补默认长度，不再生成缺长度的非法 DDL 导致 ERROR 1064。 (contributed by @q396921921) (PR #8244)
  - SSH ProxyJump 多跳 — 隧道测试与真实连接跟随 ~/.ssh/config 的 ProxyJump 跳板链路，配置了跳板机的 Host 别名可正常连通。 (contributed by @q396921921) (PR #8261)
