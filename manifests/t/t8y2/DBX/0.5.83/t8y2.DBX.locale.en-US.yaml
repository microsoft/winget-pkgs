ReleaseNotes: |-
  新功能
  - SQL Server 活动跟踪 — 新增 SQL Server 活动跟踪面板，可查看会话与查询活动 (contributed by @zipg)
  - RocketMQ 原生 Go 实现 — 将 RocketMQ 驱动从 Java Agent 迁移为原生 Go 实现，无需依赖 Java 环境即可连接
  - Meilisearch 原生支持 — 新增 Meilisearch 原生文档数据库支持
  - 达梦用户和角色管理 — 达梦连接支持用户与角色管理 (contributed by @GIWTO)
  - MySQL 侧边栏触发器 — MySQL 对象树中展示触发器
  - Oracle 同义词展示 — Oracle schema 树中展示同义词
  - MongoDB SOCKS5 代理 — MongoDB 连接支持 SOCKS5 代理
  - MongoDB 通用命令执行 — MongoDB 支持通用 runCommand 命令执行 (contributed by @CN-Scars)
  - Redis 键列表全选 — Redis 键列表支持全选操作 (contributed by @onenewcode) (closes #6007)
  - Kafka 分区绝对偏移量 — Kafka 支持将单个分区重置到绝对偏移量
  - 连接密码不保存选项 — 连接配置支持选择不保存密码，降低凭据残留风险 (contributed by @Abeautifulsnow) (closes #5935)
  - 网格按数据类型着色 — 数据网格按数据库类型为单元格着色 (contributed by @eryajf) (closes #3332)
  - 网格多行文本扁平化 — 网格单元格多行文本扁平化为单行显示，浏览更紧凑 (contributed by @ptma) (closes #5980)
  - 转置视图保留元数据 — 网格转置视图保留列类型、注释与索引指示 (contributed by @jeeinn)
  - 配置编辑器自动换行 — 配置编辑器支持自动换行 (contributed by @eryajf) (closes #6012)
  - MyBatis 集合参数展开 — SQL 支持 MyBatis foreach 集合参数展开 (contributed by @zipg)
  - MyBatis XML 比较实体解码 — SQL 解码 MyBatis XML 比较实体
  - 点号花括号参数名 — SQL 支持点号分隔的花括号参数名
  - PostgreSQL 序列名补全 — regclass 字面量中补全序列名
  - Oracle 字符长度单位 — Oracle 保留字符长度单位
  - 达梦克隆表保留索引 — 达梦克隆表时保留索引
  - 虚谷结构化错误报告 — 虚谷驱动上报结构化 agent 错误 (contributed by @mapan0424)
  - 虚谷公有同义词展示 — 虚谷公有同义词在独立作用域中展示 (contributed by @mapan0424)
  - 虚谷包成员分组 — 虚谷对象包成员节点分组组织展示 (contributed by @mapan0424)
  - MCP 复制连接配置 — MCP 支持复制完整连接配置
  - MCP 连接分组路径 — MCP 连接列表包含分组路径
  - RabbitMQ 队列消息数排序 — RabbitMQ 队列消息数支持排序
  改进
  - 限制大表结果内存 — 限制大字段表数据页内存占用，避免大表查询占用过多内存 (contributed by @zipg) (closes #5683)
  - Web 缓存表元数据 — Web 端缓存列、索引、外键等常用元数据操作，提升性能 (contributed by @zhwq1216)
  - Windows 离线下载 — 文档站新增 Windows 离线下载选项并澄清离线安装说明
  修复
  - SQL 文件关联与列表选择 — 修复保存文件关联和列表选择状态丢失的问题 (contributed by @zipg)
  - 备份计划缺失数据库 — 修复编辑备份计划时未丢弃已不存在数据库的问题
  - Oracle 自定义 JDBC 执行计划 — 修复自定义 JDBC 驱动无法生成执行计划的问题
  - 结构对比视图定义 — 修复结构对比未比较公共视图定义的问题
  - SSH 新隧道认证 — 修复新建隧道时 agent 认证失效的问题
  - 进程列表取消查询 — 修复取消查询时误关闭会话的问题
  - 编辑器语句栏运行 SQL — 修复从语句栏运行提示 SQL 失效的问题
  - 唯一值生成 — 修复未遵守显式唯一值生成策略的问题
  - 悬浮 DDL 复制空格 — 修复悬浮 DDL 复制时丢失语义空格的问题 (contributed by @q396921921) (closes #5732)
  - 带引号标识符表预览 — 修复表结构预览无法解析带引号标识符的问题 (contributed by @q396921921) (closes #5983)
  - SSH 主机密钥提示层级 — 修复主机密钥提示被连接对话框遮挡的问题 (contributed by @q396921921) (closes #5989)
  - TDSQL 代理指令 — 修复 TDSQL 代理指令丢失的问题
  - SQL Server TOP 分页 — 修复分页未遵守 TOP 行数限制的问题
  - SQL Server hierarchyid 类型 — 修复 hierarchyid 类型查询结果处理异常的问题
  - MongoDB 旧版代理写入 — 修复旧版 agent 无法执行 insertMany 写入的问题
  - MongoDB 集合导出 — 修复集合视图无法导出全部文档的问题
  - Oracle DATE 时间值 — 修复 JDBC 丢失 Oracle DATE 时间值的问题
  - IoTDB 会话握手 — 修复会话握手误包含 tree 数据库的问题
  - 网格非空预览行 — 修复未显示首个非空单元格预览行的问题
  - 网格滚动重置 — 修复替换查询结果时滚动位置未重置的问题
  - 网格分页大小 — 修复达到查询结果上限时分页大小丢失的问题
  - 网格复制错误 — 修复复制失败时未显示结构化错误的问题
  - MySQL 字符串别名 — 修复字符串引号的可编辑列别名无法使用的问题
  - MySQL 函数补全 — 修复 MySQL 函数建议缺失的问题
  - MySQL 排序规则恢复 — 修复传输时不支持的 MySQL 排序规则无法恢复的问题
  - MySQL 空间值 — 修复传输时 MySQL 空间值丢失的问题
  - MySQL 单过程调用 — 修复单过程调用结果丢失的问题
  - MySQL 仪表盘轮询 — 修复仪表盘轮询未固定到单一客户端会话的问题
  - MySQL 二进制十六进制显示 — 修复二进制十六进制显示与空值处理异常的问题 (contributed by @zipg)
  - 旧版 WebView 兼容 — 修复旧版 WebView 下部分功能显示异常的问题 (contributed by @wzlstudy)
  - 达梦重建失败保留索引 — 修复达梦重建失败时索引丢失的问题
  - 达梦列类型选项 — 修复达梦列数据类型选项不全的问题
  - 达梦表 DDL 拆分 — 修复达梦复用表 DDL 未正确拆分的问题
  - 达梦点号空格 — 修复达梦 SQL 末尾孤立句点空格丢失的问题 (contributed by @zipg)
  - Kingbase 目录 OID 回退 — 修复 Kingbase 目录 OID 不可用时异常的问题
  - 存储过程脏源码标签 — 修复存储过程脏源码标签丢失的问题 (contributed by @q396921921) (closes #6003)
  - 保存 SQL 外部同步 — 修复外部同步编辑被覆盖的问题
  - GaussDB M 模式视图 DDL — 修复 GaussDB M 模式无法获取视图 DDL 的问题 (contributed by @AndrewDi)
  - GaussDB M 模式用户管理 — 修复 GaussDB M 模式用户管理不可用的问题 (contributed by @AndrewDi)
  - 连接多选操作 — 修复连接多选与活跃连接批量关闭异常的问题 (contributed by @zipg)
  - MQTT 消息输入框调整 — 修复 MQTT 消息输入框高度无法调节的问题 (contributed by @Jinmoli)
  - Hive 叶子列标签 — 修复查询结果叶子列标签丢失的问题
  - Hive 会话协议 — 修复未使用兼容旧版会话协议的问题
  - 搜索匹配居中 — 修复搜索匹配未在视口居中显示的问题 (contributed by @q396921921) (closes #5520)
  - 全角格式化错误 — 修复全角字符导致格式化错误时 SQL 丢失的问题 (contributed by @q396921921) (closes #5988)
  - 未加载表展开 — 修复未加载的定位表被强制展开的问题 (contributed by @q396921921) (closes #5850)
  - SQL 格式化配置导出 — 修复桌面端格式化配置导出按钮失效的问题 (contributed by @q396921921) (closes #5918)
  - 结构 SQL 预览防抖 — 修复结构 SQL 预览更新未防抖的问题
  - 结构可编辑网格 — 修复可编辑网格控件未扁平化的问题
  - SQLite 批量导入 — 修复 SQLite 批量追加事务异常的问题
  - 列表高亮统一 — 修复列表悬浮、选中与右键高亮状态不一致的问题 (contributed by @zipg)
  - MySQL 添加列位置 — 修复添加列位置未保留的问题
  - JDBC 例程元数据缺失 — 修复浏览对象时缺少例程元数据导致异常的问题
  - MCP SQL 中央策略 — 修复 MCP 确认 SQL 未遵守中央策略的问题
  - Java 代理嵌套输出 — 修复 Java 代理嵌套 bin 输出未忽略的问题 (contributed by @CN-Scars)
  - 超时输入限制 — 修复连接与查询超时输入限制不正确的问题 (contributed by @zipg) (closes #5944)
  - 连接搜索激活 — 修复连接搜索结果展示及打开行为异常的问题 (contributed by @DASungta) (closes #5938)
  - DuckDB 表重命名 — 修复 DuckDB 无法重命名表的问题 (contributed by @onenewcode) (closes #4532)
  - AI 回复旧版 WebView — 修复 AI 回复在旧版 WebView 下不可见的问题 (contributed by @wzlstudy)
  - MiniMax 推理加固 — 修复 MiniMax 推理与工具重放异常的问题 (contributed by @CN-Scars)
  - PostgreSQL 9.x 表 DDL — 修复 PostgreSQL 9.x 无法生成表 DDL 的问题
  - PostgreSQL always identity — 修复传输时 always identity 值丢失的问题
  - Web 导入上传限制 — 修复表导入未遵守上传限制的问题
  - XLSX 数字单元格 — 修复 XLSX 数字单元格未安全缩放的问题
