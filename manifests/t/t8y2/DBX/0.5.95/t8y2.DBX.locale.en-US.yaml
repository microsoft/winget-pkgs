ReleaseNotes: |-
  新功能
  - SQLite RC4 Legacy 加密数据库 — 支持打开 SQLCipher 4/3/2/1 与 RC4 Legacy 加密的 SQLite 文件，拖入加密数据库自动提示输入密码并重试，连接设置统一为「SQLite 加密密码/密钥」。 (contributed by @zipg) (PR #7179)
  - Redis Key 搜索模板 — 支持在连接或全局设置中维护 Key 模板（支持 {$占位符}），聚焦搜索框即可从下拉选取，Key 模式搜索改为仅回车触发。 (contributed by @wzlove) (PR #7180)
  - MongoDB 对象浏览器 — 左侧树点击数据库节点即可在右侧打开对象浏览器，支持按名称搜索集合，与 MySQL 交互一致。 (contributed by @gaoruiqiang2017) (PR #7182)
  - XLSX 注释表头 — 对象浏览器和侧边栏表导出 XLSX 时可选择字段注释作为表头，元数据获取失败自动回退字段名。 (contributed by @eryajf) (PR #7183)
  改进
  - MySQL 存储过程语法诊断 — 编辑器本地标出参数列表尾逗号、过程内非法 RETURN 等错误，不再对合法语法误报。 (contributed by @zipg) (PR #7133)
  - 活跃连接入口提示 — 「仅显示活跃连接」入口状态点居中显示：无活跃连接为普通圆环，存在活跃连接变绿色实心点。 (contributed by @zipg) (PR #7197)
  修复
  - MySQL 全库导出 — 修复表数量较多时元数据读取失败或 Desktop 进程直接退出（连接池代际竞态 + 导出调用栈过深）。 (contributed by @CN-Scars) (PR #7172)
  - DuckDB CURRENT_DATE 运算 — 自动改写 CURRENT_DATE ± 数字 字面量绕过内置引擎 binder bug，修复视图查询超时 / worker 退出。 (contributed by @q396921921) (PR #7177)
  - Kingbase 网格编辑 — 查询结果页编辑/删除未限定 schema 的表时按 search_path 解析真实 schema，修复「关系不存在」报错。 (contributed by @ordinary-s) (PR #7181)
  - PostgreSQL bytea 导出 — bytea 字段以 decode(...,'hex') 形式导出，修复导出文件重灌后二进制内容错乱膨胀。 (commit ef9d0b804)
  - PostgreSQL 9.x 表 DDL — 批量外键等 DDL 元数据查询兼容 PostgreSQL 9.2 及更早版本，修复旧版本仍无法查看表 DDL。 (commit 988fa1aab)
  - PostgreSQL 视图源码 — 查看视图源码时限定了 search_path，表引用带模式名前缀，与实际定义一致。 (commit 151172f81)
  - SSH 命名用户路径 — SSH Agent Socket、私钥等共享路径支持 ~username 形式展开到对应用户主目录。 (contributed by @CN-Scars) (PR #7135)
  - 引号标识符表名补全 — Oracle、达梦等双引号标识符内输入时正确触发表名补全建议。 (commit 9b4f94cbb)
  - SQL 补全 Tab 接受 — 恢复候选未预选时 Tab 接受首个候选，新增「自动选中首个补全候选」设置，补全设置集中为独立板块。 (contributed by @zipg) (PR #7187)
  - 输入法组合中快捷键 — 输入法未上屏时不再误触发 SQL 执行快捷键，修复 Windows 下应用异常重载。 (contributed by @0verme) (PR #7132)
  - 筛选输入原生右键 — WHERE / ORDER BY 条件编辑框恢复系统原生复制粘贴右键菜单。 (contributed by @0verme) (PR #7130)
  - macOS 右键蓝色遮罩 — 查询结果右键任一行不再出现全选蓝色遮罩（WKWebView 幽灵合成层，改为双画布交替绘制）。 (contributed by @klinge1011) (PR #7127)
  - macOS 选区大小写快捷键 — 修复 Shift+Option+U/L 无法转换 SQL 选区大小写、快捷键录入被 Option 字符污染的问题。 (contributed by @zipg) (PR #7193)
  安装
  - Windows 安装包代码签名 — x64 与 Windows 7 版本的应用及安装程序经 TrustAsia Authenticode 代码签名并附带时间戳，降低 SmartScreen 与安全软件误报；ARM64 版本暂不签名。 (PR #7195)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.5.95 拉取。
