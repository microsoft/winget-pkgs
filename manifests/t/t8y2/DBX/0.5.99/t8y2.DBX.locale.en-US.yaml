ReleaseNotes: |-
  新功能
  - SQLite SSH 远程文件 — 桌面端 SQLite 连接支持附加 SSH 跳板，直接打开 Linux 文件主机上的远程 SQLite 文件：按主机架构上传短生命周期 worker 在远端读写，无需把 .db 拷回本机；支持备份到本机与从本机还原，首次上传会征求同意，可选会话使用、持久保存或预放置二进制。 (contributed by @64673a) (PR #7561)
  - Elasticsearch 深分页 — ES/Easysearch 文档浏览与 SQL 查询通过 PIT + search_after 支持超过 1 万条的深分页，跳页与「导出全部数据」可持续拉取，旧版本自动回退 from/size。 (contributed by @Lan-zk) (PR #7477)
  - Xugu 计划任务管理 — 虚谷连接侧边栏新增「计划任务」节点，可从 ALL_JOBS 浏览并管理 DBMS_SCHEDULER 调度任务。 (contributed by @mapan0424) (PR #7593)
  - MCP 全局查询超时 — MCP 访问策略新增全局查询超时（秒）：留空继承连接设置、0 不限制、正值覆盖所有 MCP 查询，修改后下一次查询即生效。 (contributed by @Abeautifulsnow) (PR #7518)
  - SQL 文件树管理 — 文件树支持新建、重命名、删除 SQL 文件，重命名同步更新已打开标签页与关联数据库目标，后端校验路径范围防止越界。 (contributed by @eryajf) (PR #7527)
  - 备份压缩与历史筛选 — 计划/立即备份新增 gzip 输出（.sql.gz），SQL 恢复支持读取压缩文件；备份配置的连接/数据库列表支持搜索，历史可按连接搜索并按触发方式与状态组合过滤。 (contributed by @eryajf) (PR #7577)
  - SQL 补全批量勾选插入 — SELECT 字段列表与 INSERT 列位补全支持勾选多个字段一次性插入，INSERT 自动生成对应 VALUES 占位符，支持 Space 勾选与方向键导航。 (contributed by @eryajf) (PR #7543)
  - 12 小时制时间格式 — 网格日期时间格式新增 YYYY-MM-DD hh:mm:ss A，时区显示规范化（如 Asia/Calcutta 显示为 Asia/Kolkata）。 (contributed by @eryajf) (PR #7567)
  改进
  - AI 长回复流畅度 — AI 流式输出增量按批次发送到界面，降低高频 IPC 开销，长回复期间编辑器保持响应。 (commit d424ea38f)
  - 导出期间响应性 — 导出核心任务移至阻塞线程池执行，大数据量导出不再占用异步运行时线程。 (commit d1046d54f)
  - 大 JSON 值浏览 — Redis 值视图与 Meilisearch 文档页的 JSON 树虚拟化渲染，超大文档不再卡顿。 (commit e690298dc)
  - 网格搜索性能 — 数据网格搜索减少内存分配，大结果集搜索更流畅。 (commit 21f8221d9)
  - 驱动下载进度节流 — Agent/驱动下载进度事件按整百分比或时间间隔发送，慢速连接下减少无效刷新开销。 (commit c305325e3)
  - 侧边栏与工具栏交互反馈 — 连接列表定位、筛选与正则开关及工具栏更新检测、SQL 库、SQL 文件树、历史、AI、主题、设置等入口补充点击与状态动画；连接名称与分组字重分级（仅登录用户模式加粗），外观设置改为等宽两列布局；全部动画支持 prefers-reduced-motion。 (contributed by @zipg) (PR #7656)
  - 登录用户标识 — Oracle 系连接（Oracle、达梦、OceanBase Oracle 模式）在连接树中加粗显示当前登录用户的模式，多用户库中快速确认身份。 (contributed by @0verme) (PR #7594)
  - Schema Diff 比较进度 — 结构比较过程显示实时进度与下一步指引，比较期间不再无反馈等待。 (contributed by @0verme) (PR #7565)
  - 跳转列键盘导航 — 跳转列弹窗支持方向键选择、回车跳转并自动聚焦搜索框，数据页输入框内也可直接触发快捷键。 (contributed by @eryajf) (PR #7531)
  - DDL 对话框拖动 — 「查看 DDL」对话框支持拖动标题栏移动，便于查看被遮挡内容。 (contributed by @eryajf) (PR #7532)
  - 筛选列搜索位置 — 列筛选下拉的搜索框移至下拉顶部，边框、焦点态与无障碍标签优化。 (contributed by @eryajf) (PR #7528)
  - 总行数刷新入口 — 表数据页精确总行数刷新按钮移至「总计」标签旁，位置更直观。 (contributed by @zipg) (PR #7522)
  - Xugu 公共同义词标识 — 虚谷侧边栏「公共同义词」根节点改用蓝色链接图标，与真实模式区分。 (contributed by @mapan0424) (PR #7595)
  - MongoDB 建库确认 — MongoDB 新建数据库前预览实际执行的命令并确认后创建，接入生产环境与只读保护。 (contributed by @eryajf) (PR #7526)
  修复
  - 长文本单元格悬浮编辑器 — DOM/Canvas 模式下双击长文本稳定打开悬浮编辑器，底部行编辑时编辑器保持可见，编辑器内滚动不再穿透数据表。 (contributed by @zipg) (PR #7617)
  - WHERE/ORDER BY 撤销串联 — 表数据页 WHERE 与 ORDER BY 输入框维护独立撤销/重做栈，快捷键不再触发其他输入框或网格的撤销。 (contributed by @zipg) (PR #7626)
  - 复制 NULL 单元格 — 单元格、整行、TSV 与详情路径复制 NULL 时输出空字段，粘贴回网格仍可恢复 NULL。 (contributed by @xiaou61) (PR #7631)
  - 逗号数字区域解析 — 网格编辑含单组逗号的数字（如 114,870）按区域格式规范化，千分位去逗号、小数分隔符保留语义，避免数据库静默截断存储。 (contributed by @CN-Scars) (PR #7634)
  - 转置视图长文本编辑 — 转置视图中长文本编辑框不再被行高裁剪，与普通视图样式一致。 (contributed by @0verme) (PR #7555)
  - 工具栏执行选区 — 点击工具栏执行按钮时保留按钮按下瞬间的 SQL 选区，不再因焦点变化执行错误范围。 (contributed by @eryajf) (PR #7530)
  - 关闭连接后标签页复活 — 关闭连接按策略清理的表数据、对象浏览与结构页签，在快速重连或恢复会话时不再重新出现。 (contributed by @0verme) (PR #7591)
  - AI 生成 SQL 追加 — 「应用到编辑器」改为追加到末尾而非覆盖，已存在的相同 SQL 块与重复点击不再重复追加。 (contributed by @debugzhao) (PR #7525)
  - Schema Diff 部署脚本一致性 — 当前对象的部署脚本预览随点击更新，全部部署脚本按勾选集合重新生成，聚焦与选中 SQL 状态分离；生成失败或为空时阻止执行过期 SQL。 (contributed by @0verme) (PR #7552)
  - 旧内核桌面端兼容 — macOS 12 / 旧 Safari WKWebView 下修复一批问题：弹窗宽度被压回 24rem、多库执行弹窗因空值崩溃无法关闭、关系图全屏画布塌缩、代码截图与 AI 代码块无高亮，并改进 SQL 表名着色与字段气泡暗色类型色。 (contributed by @wzlstudy) (PR #7557)
  - Windows 资源管理器定位 — 「在文件夹中显示」对含空格路径正确定位并选中文件，不再退回打开文档文件夹。 (commit f489db4f0)
  - Linux AppImage 启动 — AppImage 在 Fedora 44 等组合下自动禁用 DMABUF 渲染器改用共享内存渲染，修复 WebKitWebProcess 崩溃；用户显式配置优先。 (contributed by @Hanwn) (PR #7541)
  - dbx-cli MySQL 查询崩溃 — CLI 启动时安装默认 rustls CryptoProvider，修复查询 MySQL 时进程 panic。 (contributed by @mmorella-dev) (PR #7536)
  - MySQL 新建事件 — 侧边栏「事件 → 新建事件」正确打开事件编辑器，重复创建与编辑间不再复用旧草稿状态。 (contributed by @0verme) (PR #7556)
  - Oracle 11g 存储过程参数 — 执行存储过程弹窗的参数查询改用稳定引号别名，Oracle 11g 不再报 ORA-00923；同一查询路径覆盖达梦与 OceanBase(Oracle 模式)。 (contributed by @zipg) (PR #7599)
  - PostgreSQL 只读用户外键 — 外键元数据改从 pg_catalog 系统目录读取，仅授予 SELECT 的只读角色也能看到外键。 (contributed by @difagume) (PR #7537)
  - 瀚高查询分页 — HighGo 查询改用 LIMIT OFFSET 分页，大表查询不再全量拉取导致性能差。 (contributed by @amwps290) (PR #7524)
  - OceanBase(Oracle 模式) 视图 DDL 预览 — 编辑器悬浮预览对单行视图 DDL 进行格式化，不再挤成一整行无法阅读。 (contributed by @0verme) (PR #7596)
  - InfluxDB 兼容查询 — 1.x 兼容接口返回多个 series 时合并展示并将 tag 提升为结果列，同时兼容仅允许带 database 查询的 InfluxDB 网关。 (contributed by @zipg) (PR #7598)
  - SQL Server 触发器编辑 — 表结构编辑器支持新增、编辑、删除 AFTER / INSTEAD OF 触发器，多事件触发器聚合展示并显示启用状态。 (contributed by @zipg) (PR #7600)
  - SQL Server sql_variant CTE 崩溃 — WITH 查询返回 sql_variant 列时自动改写为 NVARCHAR(MAX)，保留 CTE 声明、注释与 ORDER BY 语义，不再触发驱动崩溃。 (contributed by @zipg) (PR #7535)
  - SQL Server SET 高亮 — 查询编辑器中 SET 恢复关键字样式高亮。 (contributed by @s1oopX) (PR #7550)
  - GBase JDBC 数据传输 — GBase JDBC 连接出现在数据传输连接列表，按 MySQL 兼容族支持表数据传输，元数据缺失时回退连接配置数据库。 (contributed by @zipg) (PR #7601)
  - Doris 系连接传输可选 — Doris/SelectDB/StarRocks 连接在数据传输对话框保持可选并保留 MySQL 对象类型，不再从连接列表消失。 (commit eba4e95a0)
  - SSH 配置覆盖连接参数 — 本机 ~/.ssh/config 主机别名不再静默覆盖连接中手动填写的 SSH 用户名与端口；旧版导入连接保持原有别名解析行为。 (contributed by @zipg) (PR #7558)
  安装
  - Windows Server 2012 R2 — Win7 离线安装包改用经 Server 2012 R2 实机验证的 WebView2 Loader（1.0.902.49）与 Fixed Runtime 109 组合，Windows Server 2012 R2 可正常安装并启动，不再误报找不到 WebView2 Runtime。 (contributed by @mr-dadong) (PR #7529)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.5.99 拉取。
