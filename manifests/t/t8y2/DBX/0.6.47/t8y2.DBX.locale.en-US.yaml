ReleaseNotes: |-
  新功能
  - Cloudflare D1 和 Turso 连接支持 HTTPS/SOCKS 代理与自定义 CA 证书，代理同时支持显式配置和环境变量 (contributed by @lxk955) (PR #12534)
  - 结果网格支持把选中行复制为 SQL DELETE 和 INSERT 语句，便于生成回滚脚本 (contributed by @lxk955) (PR #12518)
  - 查询结果导出的文件名来源可配置，支持按结果标签或标签页标题命名 (contributed by @lxk955) (PR #12525)
  - OpenCode CLI 提供方支持 OpenCode 2，可自动探测版本或手动指定，不再对 2.x 传入已移除的 --pure 参数 (contributed by @lxk955) (PR #12546)
  - 编辑器新增快捷键直接打开连接、数据库和 Schema 选择器（默认 Cmd/Ctrl+Alt+C/D/S，可在设置中自定义） (contributed by @SaifAqqad) (PR #12538)
  - 结构对比部署新增出错继续选项，单条语句失败时可选继续执行剩余脚本 (contributed by @Xcylway) (PR #12545)
  改进
  - 对象浏览器新增设置，可关闭选中对象时自动打开详情面板 (contributed by @lxk955) (PR #12559)
  - 结果标签页新增设置，可关闭点击标签页固定结果的交互 (contributed by @Xcylway) (PR #12555)
  - 结果面板底部的 SQL 语句栏支持开关显示 (contributed by @eryajf) (PR #12520)
  - 侧边栏活动连接显示主机和端口，多连接同名时更易区分 (contributed by @dienaso) (PR #12536)
  - 查询标签页改用查询文件图标，与对象浏览器、表数据标签区分更直观 (contributed by @hanxuanyu) (PR #12471)
  - 删除行工具栏按钮改用红色危险样式，与不可恢复操作语义一致 (contributed by @yaoxinghuo) (PR #12535)
  修复
  - 查询结果中重名列的表头自动加序号区分，SQL 生成、排序和导出仍使用原始列名 (contributed by @Xcylway) (PR #12548)
  - 数据生成的时间列严格遵循设定的起止时刻，预览与实际生成一致 (contributed by @Jarvis636431) (PR #12556)
  - CSV 导出统计数字有效位数时跨小数点合并计算，接近 Excel 精度上限的长小数不再被误判 (contributed by @Jarvis636431) (PR #12554)
  - 网格搜索会检查被显示截断省略的完整单元格内容，命中截断点之后的行不再被过滤隐藏 (contributed by @ericbyz) (PR #12508)
  - 外键导航支持跳转到同连接其他数据库的引用表（如 MySQL 跨库外键） (contributed by @lxk955) (PR #12505)
  - 标签页重名序号只按同类型标签计算，查询标签不再与对象浏览器或表数据标签共用编号 (contributed by @lxk955) (PR #12500)
  - SQL 格式化不再把无分号分隔的多条语句合并到一行 (contributed by @zipg) (PR #12530)
  - 默认 DBX 排版遵循换行分号（newlineBeforeSemicolon）设置，分号前的空行样式与所选风格一致 (contributed by @lxk955) (PR #12499)
  - MCP 工具的 object 输入模式始终发布 properties 字段，DashScope、DeepSeek 等严格校验的网关不再拒绝工具调用 (contributed by @lxk955) (PR #12492)
  - 插件市场源地址含分支 tree 路径时版本链接正确跳转到对应 GitHub Release 页 (contributed by @lxk955) (PR #12521)
  - 关闭停靠终端所在标签页时释放对应插件连接，listConnections 可显示工作台标题 (contributed by @jinpy666) (PR #12544)
  - 数据传输到 Oracle 系目标时布尔值映射为 NUMBER(1)，不再生成目标不支持的布尔建表类型 (contributed by @yiqiui) (PR #12491)
  - openGauss 数据传输到 PostgreSQL 目标时去掉 pg_get_tabledef 附带的压缩等存储参数，建表不再报错 (contributed by @dienaso) (PR #12524)
  - MySQL 查询结果通过只读探测判定数据耗尽，禁用翻到底后的下一页按钮 (contributed by @eryajf) (PR #12522)
  - MySQL 编辑器补全存储过程参数和局部变量 (contributed by @zipg) (PR #12532)
  - MySQL 图形化编辑索引改为 ALTER TABLE 重建，不再生成不受支持的语句 (contributed by @CN-Scars) (PR #12498)
  - Mycat 代理连接可正常列出数据库和表 (contributed by @zhongtait) (PR #12450)
  - 达梦表 DDL 和导出包含列注释 (contributed by @lxk955) (PR #12511)
  - 达梦自增列表数据编辑不再生成 IDENTITY_INSERT 语句 (contributed by @lxk955) (PR #12488)
  - GBase 8s 扩展列类型从 sysxtdtypes 正确解析，不再显示为布尔 (contributed by @lxk955) (PR #12496)
  - Firebird 例程和触发器整体作为单个语句处理，正文不再被误拆执行 (contributed by @lxk955) (PR #12537)
  - Redis 集群连接遵循配置的连接超时，不再使用驱动默认值 (contributed by @CN-Scars) (PR #12487)
  - OceanBase 用户名中的 @ 租户分隔符在界面上原样显示，复制的连接串仍可还原 (contributed by @efeire) (PR #12447)
  - SQL Server 原生驱动跟随 TDS 路由重定向，路由部署下不再连接失败 (contributed by @lxk955) (PR #12503)
  - SQL Server（传统驱动）在新版服务器上读回表和列注释 (contributed by @yiqiui) (PR #12493)
  - SQL Server 及更多方言支持在对象树中启用和禁用触发器 (contributed by @lxk955) (PR #12512)
  - PostgreSQL 读回列可空性改为直接查 pg_catalog 并正确处理域名类型，不再 join information_schema.columns (contributed by @lxk955) (PR #12513)
  - PostgreSQL 连接中断时日志包含底层 I/O 错误原因，便于定位网络问题 (contributed by @jeff377) (PR #12502)
  - 神通数据库复制表时保留表和列注释 (contributed by @lxk955) (PR #12506)
  - Vastbase 等驱动返回空结果集向量为 null 时按空处理，UPDATE ... FROM 等操作不再报反序列化错误 (contributed by @Xcylway) (PR #12547)
