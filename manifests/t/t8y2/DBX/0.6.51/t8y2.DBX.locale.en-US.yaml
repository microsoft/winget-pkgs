ReleaseNotes: |-
  赞助信息
  - HuaLongAI（华龙算力）国模百亿补贴：DeepSeek等模型低至 0.8 折，谷价 0.4 折，GPT 模型不降智 0.15 倍率，注册入口
  新功能
  - SQL 格式化新增可配置规则：独立列表换行、WHERE/JOIN ON 逻辑换行、代码空行与行宽等均可自定义，设置面板支持实时预览，默认关闭 (contributed by @efeire) (PR #12772)
  - 编辑器新增「执行全部 SQL」工具栏按钮和 Alt+X 快捷键 (contributed by @lxk955) (PR #12778)
  - Vim 模式新增 :dbx 系列命令，可在命令行直接执行 DBX 操作并支持 vimrc 映射 (contributed by @youmin1017) (PR #13044)
  - 水平标签栏新增可选的「两行分组」布局，第一行显示分组、第二行显示当前分组标签 (contributed by @yaoxinghuo) (PR #12905)
  - Redis 支持在键前缀目录节点上单独刷新，无需重载整棵数据库树 (contributed by @caichangqing1120) (PR #13050)
  - AI 助手生成结构上下文时会读取连接的 Database Docs 备注，表和列的业务含义无需写入数据库注释即可提供给模型 (contributed by @Abeautifulsnow) (PR #12705)
  - 插件商店显示每个插件的安装量，并支持按安装量排序 (contributed by @peakxy) (PR #13083)
  - SQL 文件面板支持键盘导航（方向键选择、Enter 打开、F2 重命名），并可设置单击或双击打开文件 (contributed by @eryajf) (PR #13076)
  改进
  - SQL 补全设置新增「启用序列补全」开关，可关闭序列对象与 NEXTVAL/CURRVAL 候选 (contributed by @lxk955) (PR #12632)
  - 数据网格的大表预览提示条新增「不再提示」，隐藏后仍可从工具栏入口加载当前页完整文本 (contributed by @yiqiui) (PR #12928)
  - 大表预览提示条的「不再提示」与关闭按钮收拢到横幅右侧，并改进完整文本入口的悬浮提示文案 (contributed by @zipg) (PR #13097)
  - 执行 INSERT、UPDATE、DDL 等无结果集语句时，底部面板自动切换到「摘要」页签以显示执行状态 (contributed by @Xcylway) (PR #12344)
  - 批量执行多条语句时自动打开摘要视图，逐条展示执行进度 (contributed by @yiqiui) (PR #13017)
  - 未选择连接时执行 SQL 会弹出连接选择提示，不再直接报查询错误 (contributed by @lxk955) (PR #12858)
  - Ctrl+P 快速打开新增「连接范围」下拉，可将对象搜索限定在单个连接内 (contributed by @JefferyJu) (PR #12871)
  - SQL Server 连接支持在主机字段直接填写端口（host,port、host:port、tcp: 前缀等形式） (contributed by @lxk955) (PR #12813)
  - MySQL 补全新增 AES_ENCRYPT 和 AES_DECRYPT 函数建议 (contributed by @enilu) (PR #12849)
  - 对象悬浮查找（Ctrl/Cmd+点击）的范围扩展到存储过程和函数，与表的行为一致 (contributed by @Mo-Moore) (PR #12797)
  - 存储过程、函数和包支持从右键菜单直接进入编辑，并修正编辑按钮误显示「编辑视图」的问题 (contributed by @lxk955) (PR #12631)
  - SQL Server 表结构编辑器支持外键的新增、编辑和删除 (contributed by @Totopo27) (PR #12996)
  - 复制行为 SQL DML 时默认附带数据库限定名，避免粘贴到其他会话时指向错误的库 (contributed by @lxk955) (PR #12581)
  - 数据生成器新增当前 Unix 时间戳（秒和毫秒）选项 (contributed by @lxk955) (PR #12950)
  - 结果表格新增「清除记住的列宽」操作，一键恢复自动列宽计算 (contributed by @lxk955) (PR #12915)
  - 标签页连接颜色可设置为仅作用于活动标签 (contributed by @lxk955) (PR #12990)
  - SQL 文件执行弹窗新增「执行完成后关闭」选项 (contributed by @lxk955) (PR #12919)
  - 侧边栏新增「显示用户与权限入口」设置，可隐藏不需要的账号管理节点 (contributed by @eryajf) (PR #13054)
  - 生产环境标记改为对齐行尾的红色盾牌，数据表顶部工具栏改为「连接 / 数据库 › 表名」面包屑，长表名不再挤占操作按钮 (contributed by @hongshuo-wang) (PR #12998)
  - 导入向导字段映射中，跳过的列在预览里以删除线和弱化样式标识 (contributed by @lxk955) (PR #12959)
  - 沿菜单上下浏览相邻二级菜单时不再等待斜滑保护延迟，展开更跟手 (contributed by @zipg) (PR #12958)
  - Navicat 无状态 HTTP 隧道拒绝事务操作时的错误提示更清晰，并指引改用 TCP HTTP 隧道 (contributed by @303562915) (PR #13073)
  - 数据库级「导入数据」弹窗标题不再误显示为「导入表数据」 (contributed by @yiqiui) (PR #13047)
  - 「侧边栏数据库列表上限」设置更名为「Redis 数据库列表上限」，并说明其仅作用于 Redis 连接 (contributed by @xiaou61) (PR #12984)
  - 应用启用字体抗锯齿，改善各平台文字渲染效果 (contributed by @erjin-zhi) (PR #11093)
  修复
  - Linux：GNOME X11 会话下主窗口恢复为不透明渲染，修复窗口透明、只有鼠标经过区域被绘制的问题 (contributed by @technicalors) (PR #12750)
  - 隐藏工具栏「检查更新」入口后，应用不再继续静默检查更新和后台下载，更新红点不再出现 (contributed by @yiqiui) (PR #11059)
  - 设置页按 Ctrl+S 现在应用设置草稿，不再误提示「SQL 已保存」 (contributed by @yiqiui) (PR #13048)
  - Windows 启动和安装时自动清理 MCP 更新残留的 dbx-mcp.exe~RF*.TMP 临时文件 (contributed by @zipg) (PR #13010)
  - SQL 库按修改日期排序不再打乱文件夹与查询的层级关系 (contributed by @onenewcode) (PR #11800)
  - 从历史记录恢复 SQL 改为在新查询标签打开，不再覆盖当前编辑器中正在编写的内容 (contributed by @lxk955) (PR #12979)
  - PostgreSQL 存储过程体内双击可正常选中单词，不再一次性选中整个过程体 (contributed by @lxk955) (PR #12993)
  - 光标位于引号标识符内时补全菜单不再为空 (contributed by @hongshuo-wang) (PR #12024)
  - 「补全后插入空格」在光标后是换行符或位于多语句中间时也能正确插入空格 (contributed by @thailoc-dev) (PR #12948)
  - WHERE 等表达式补全中，引用表的列排在数据库序列之前 (contributed by @thailoc-dev) (PR #12952)
  - MySQL、SQL Server 等非折叠方言的补全保留目录中的表名和模式大小写，避免大小写敏感表查询失败 (contributed by @thailoc-dev) (PR #12947)
  - 关闭「生成 SQL 时添加引号」后，Oracle、达梦和 DB2 的标识符大小写设置不再被忽略 (contributed by @onenewcode) (PR #13005)
  - 右键「新建查询」和 SELECT 模板遵循设置的关键字大小写 (contributed by @thailoc-dev) (PR #12949)
  - SQL 格式化正确缩进存储过程体内的 BEGIN/END、IF、LOOP 语句块 (contributed by @yiqiui) (PR #13015)
  - Oracle 替换变量（&name / &&name）执行前会弹出参数输入对话框 (contributed by @lxk955) (PR #12634)
  - jdbc、hive 通用连接上执行 PL/SQL 存储过程不再按分号错误拆分导致报错 (contributed by @lxk955) (PR #12578)
  - 右键编辑器中未限定模式的对象名时优先按当前模式解析，不再把视图误当作同名表处理 (contributed by @dienaso) (PR #13018)
  - 分页表格中编辑单元格不再丢失 Ctrl+F 搜索结果 (contributed by @lxk955) (PR #12910)
  - 结果表格全选（Ctrl/Cmd+A）时不再高亮表头和行号栏，高亮范围与实际复制范围一致 (contributed by @hongshuo-wang) (PR #12853)
  - 字体或密度变更后保留手动调整的列宽，仅重新计算自动列宽 (contributed by @lxk955) (PR #12913)
  - PostgreSQL 大值预览单元格参与保存前先加载完整值，历史回滚 SQL 不再包含截断的预览文本 (contributed by @jeff377) (PR #13024)
  - 折叠标签栏（图标栏）可直接关闭后台标签，不再需要先切换过去 (contributed by @xiaou61) (PR #12983)
  - 自定义侧边栏菜单取消勾选「用户与权限」等分组项后现在会真正隐藏 (contributed by @xiaou61) (PR #12989)
  - 表节点的列、索引等虚拟分组不再错误套用到子节点导致树层级错乱 (contributed by @lxk955) (PR #12974)
  - 标签较多时切到设置页再切回后，设置页标签不再从标签栏消失 (contributed by @hongshuo-wang) (PR #12025)
  - MQTT 控制台新增或编辑订阅时不再覆盖已填写的发布 Topic (contributed by @ma123456mai) (PR #11842)
  - Ctrl+P 快速打开不再把文件名与目录元数据拼接出的字符串误判为匹配结果 (contributed by @heeeex100) (PR #13080)
  - 连接表单自动去除主机、用户名、数据库名首尾的多余空白，避免复制粘贴导致的连接失败 (contributed by @imhyuk-huno) (PR #12936)
  - MySQL：连接池取连接超时遵循「连接超时」设置，元数据、DDL、取消查询等路径不再固定 5 秒 (contributed by @yiqiui) (PR #12924)
  - PostgreSQL（TBase）：数值列改用文本协议读取，修复查询结果显示 NULL 的问题 (contributed by @jeff377) (PR #11803)
  - PostgreSQL：结构对比不再因存储过程定义携带模式限定名而全部误报为已修改 (contributed by @jeff377) (PR #12012)
  - MySQL：结构对比生成的 ADD COLUMN 保留列的字符集和排序规则，避免二次对比误报 (contributed by @jeff377) (PR #11810)
  - GBase 8s：对象浏览器正确显示视图，生成 SQL 不再携带不被接受的 owner 前缀 (contributed by @lxk955) (PR #12510)
  - Kingbase：无法识别的列身份元数据降级为普通默认值，不再导致表无法打开 (contributed by @thailoc-dev) (PR #12946)
  - Kingbase：普通用户「查看视图源码」改用目录函数获取定义，不再报 NULL 转换错误 (contributed by @Ezreal-byte) (PR #13027)
  - Nacos 2：修复普通用户填写 public 范围后默认命名空间配置不显示的问题 (contributed by @lok1688) (PR #13061)
  - Oracle：流式导出改用 ROWNUM 分页，普通查询导出不再报「不支持流式导出」 (contributed by @lxk955) (PR #12943)
  - Oracle：结构传输复用的建表 DDL 不再携带源表空间属性，避免目标端 ORA-01950 配额错误 (contributed by @jeff377) (PR #11966)
  - OceanBase Oracle 模式：午夜日期值改用显式 TO_DATE 生成，修复非 ISO 日期格式环境下的 ORA-01858 (contributed by @Tong-bit-art) (PR #12904)
  - 数据传输：MySQL 到 Oracle 系目标正确映射 bigint/tinyint 类型，避免建表 ORA-00900 (contributed by @dienaso) (PR #12991)
  - 数据传输：唯一键上的 MySQL 自增列不再生成含 AUTO_INCREMENT 的非法建表语句 (contributed by @Tong-bit-art) (PR #12988)
  - 备份保留策略清理旧备份时同步删除变空的运行目录 (contributed by @jeff377) (PR #12902)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.51 拉取。
