ReleaseNotes: |-
  新功能
  - SSH 隧道支持 OpenSSH ProxyCommand 跳板命令，经 nc、cloudflared 等方式访问的堡垒机主机也能建立隧道 (contributed by @zipg) (PR #11013)
  - 比较数据支持保存、重命名、复制和删除配置，源目标连接、库表与匹配字段无需每次重选 (contributed by @zipg) (PR #11010)
  - 首页新增隐私安全展示模式，默认不显示连接统计、连接名称与 SQL 历史，可在设置中切换回工作区概览 (contributed by @eryajf) (PR #10927)
  - 标签栏新增按连接、数据库、表分组的三层层级模式，并修复多库多表场景下层级连线错乱的问题 (contributed by @eryajf) (PR #10982)
  - 结构编辑器为字段类型和各类索引启用统一配色，右键字段可直接创建主键、唯一、全文等索引，新建 MySQL 索引自动使用简短稳定的名称 (contributed by @weekhy) (PR #10974)
  - Web 模式新增退出登录按钮，工具栏和设置的安全区域均可安全退出当前会话 (contributed by @lxk955) (PR #11008)
  - SQL 编辑器新增全部折叠和全部展开快捷键、工具栏按钮与右键菜单，长脚本可一键收起展开 (contributed by @lxk955) (PR #10990)
  - SQL 编辑器新增切换大小写快捷键，首次转为大写、再次转回小写，字符串与注释内容保持不变 (contributed by @lxk955) (PR #11022)
  - 代码片段补全触发键支持配置为 Tab、空格或两者皆可 (contributed by @lxk955) (PR #11023)
  - 编辑器右键菜单新增执行计划入口，格式化 SQL 在选中文本时仅格式化选中部分 (contributed by @lxk955) (PR #11017)
  - 主题自定义新增当前行、选区、光标、行号背景等编辑器界面颜色配置 (contributed by @lxk955) (PR #11005)
  - 数据表格斑马纹背景支持在设置中关闭，恢复统一底色显示 (contributed by @lxk955) (PR #10971)
  - 数据表格斑马纹行背景颜色支持自定义 (contributed by @lxk955) (PR #10868)
  - 新增单元格详情默认以弹窗打开的设置，查看长 JSON 等内容不再受分栏空间限制 (contributed by @lxk955) (PR #11021)
  - 右键执行的截断表、清空数据、删除表操作现在记录到 SQL 执行历史，单个与批量操作均覆盖 (contributed by @lxk955) (PR #11002)
  - 新增设置控制默认数据库是否固定在侧边栏顶部，可恢复按字母排序查找 (contributed by @lxk955) (PR #10991)
  改进
  - 编辑器等宽字体栈加入中文字体回退，Windows 上中文不再回退为宋体显示 (contributed by @lxk955) (PR #11012)
  - 格式化 SQL 后保持光标位置，不再跳转到文档开头
  - 编辑器工具栏、应用工具栏和数据网格的按钮悬停提示显示对应快捷键 (contributed by @lxk955) (PR #11018)
  - 删除行等危险操作确认弹窗默认聚焦确认按钮，可直接回车确认 (contributed by @lxk955) (PR #11014)
  - Web 模式工具栏左上角显示 DBX 品牌标识 (contributed by @lxk955) (PR #11011)
  - DBX Web 启动入口支持 -h 和 --help 查看可用选项，并补充 RUST_LOG 日志排查指引 (contributed by @eryajf) (PR #10976)
  - SQL 文件列表排序跟随侧边栏连接顺序，按连接定位文件更直观
  修复
  - 修复 Windows 上卸载或更新脚本型插件时派生进程未终止导致的拒绝访问错误 (os error 5) (contributed by @0verme) (PR #10619)
  - 修复页面刷新后恢复的插件工作台标签页停留在需要重新加载提示的问题，现在可静默自愈 (contributed by @jinpy666) (PR #11015)
  - 修复 Web 和 Docker 部署下偶发连接列表加载失败后被清空、恢复的标签页全部消失的问题，启动加载增加有界重试 (contributed by @jinpy666) (PR #11016)
  - 插件市场安装与更新遇到网络断流时自动重试，不再整单失败 (contributed by @Abeautifulsnow) (PR #10999)
  - 修复查询页限定 schema 时插件结果视图丢失 schema 导致表名解析失败的问题 (contributed by @Abeautifulsnow) (PR #10981)
  - 修复 macOS 上独立 MCP 进程反复弹出钥匙串授权对话框的问题，并在升级安装时校验包身份 (contributed by @caichangqing1120) (PR #10992)
  - 修复 MCP 存储无法打开时静默退出的问题，现在以协议错误明确报告 (contributed by @basil-k-aji-dev) (PR #11000)
  - 修复 Redis MCP 会话中 FLUSHDB 在默认读写策略下未经确认直接清空数据库的问题，现在与 FLUSHALL 一致需要完全访问权限 (contributed by @basil-k-aji-dev) (PR #10998)
  - DBX Web 在 MCP 启动配置无效时明确报错，不再静默失败
  - Firebird 连接支持配置字符集，修复 ISO8859_1/NONE 历史库中文显示乱码的问题 (contributed by @zipg) (PR #10993)
  - DB2 查询分页改用服务端分页语句，翻页之间释放游标会话占用的锁
  - DB2 查询结果延迟加载 LOB 大字段，包含大对象列的查询不再被整体拖慢
  - 修复 JDBC (AS/400) 连接未经过传输层的问题，SSH 隧道和代理现在对 AS/400 连接同样生效
  - 修复 MongoDB 补全被字符串或注释中形似命令的文本误导而解析错集合、丢失 find 链的问题 (contributed by @thailoc-dev) (PR #11001)
  - 修复 MongoDB 导出 CSV 时 Extended JSON 值被拆成多列、重新导入后数据损坏的问题 (contributed by @thailoc-dev) (PR #11009)
  - 修复 SQL 导出中 SUB 字节在 ClickHouse 与 Snowflake 方言下误写为 \Z 导致导入损坏的问题，改用十六进制转义 (contributed by @Tong-bit-art) (PR #10975)
  - 修复自定义主题列表为空时主题下拉丢失自定义入口的问题 (contributed by @lxk955) (PR #11003)
  - 修复部分主题下数据网格右侧空白区域与表格底色不一致的双色分界问题 (contributed by @lxk955) (PR #10980)
  - 修复侧边栏双击激活模式下双击已展开节点无法折叠的问题 (contributed by @lxk955) (PR #10983)
  - 屏蔽 Shift+Esc 组合键，避免误触打开浏览器或 WebView 任务管理器打断操作 (contributed by @lxk955) (PR #10987)
  - 补齐并改进日语翻译，统一术语和片假名长音写法 (contributed by @cwatanab) (PR #11020)
  - 大型关系图改为虚拟化渲染，表和连线数量很多时不再卡顿
  - 查询结果可编辑性元数据预检超时预算扩展到所有数据库，慢元数据不再阻塞结果展示，此前仅 Oracle 和虚谷有此保护
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.33 拉取。
