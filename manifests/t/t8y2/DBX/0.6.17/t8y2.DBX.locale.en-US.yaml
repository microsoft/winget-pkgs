ReleaseNotes: |-
  新功能
  - 新增更新中心，集中管理 DBX 客户端、数据库驱动、JDBC、MCP 与插件的更新检查，支持一键全部更新 (contributed by @zipg) (PR #9458)
  - SQL Server 表结构新增约束页签，可查看主键、唯一、外键、检查与默认值约束 (contributed by @zipg) (PR #9581)
  - MongoDB Shell 支持 db.getSiblingDB() 切换数据库 (contributed by @thailoc-dev) (PR #9455)
  - MongoDB Shell 支持 db.createCollection() 和 db.dropDatabase() (contributed by @thailoc-dev) (PR #9494)
  - MongoDB Shell 支持 db.collection.renameCollection() 重命名集合 (contributed by @thailoc-dev) (PR #9496)
  - MongoDB 文档过滤器新增范围与列表类运算符 (contributed by @zipg) (PR #9523)
  - MongoDB 筛选与排序栏支持字段名补全 (contributed by @onenewcode) (PR #9483)
  - MongoDB 编辑器输入时实时校验 Shell 命令，错误与风险命令以下划线提示 (contributed by @thailoc-dev) (PR #9490)
  - Redis 侧边栏数据库列表支持配置展示上限，超限后可继续加载 (contributed by @q396921921) (PR #9500)
  - 侧边栏支持嵌套虚拟表分组，可拖拽整理并批量移动表 (contributed by @alex-1263) (PR #9088)
  - 数据网格支持增量冻结列与解冻单个冻结列 (contributed by @eryajf) (PR #9553)
  - 打开数据表时的默认排序方式可配置，支持数据库排序与当前页排序 (contributed by @eryajf) (PR #9463)
  - 复制为 INSERT 语句支持可选的库名/schema 限定前缀 (contributed by @eryajf) (PR #9464)
  - SQL 补全列选择器支持全选与取消全选 (contributed by @zipg) (PR #9560)
  - SQL 编辑器支持 CTE 列的语义化导航 (contributed by @tianyifeng-druid) (PR #9456)
  - 新增 SQL Server 习惯的空格确认补全可选设置，默认关闭 (contributed by @zipg) (PR #5706)
  - QuickOpen 支持全局文件内容搜索 (contributed by @gggaiitx) (PR #9533)
  - Nacos 配置编辑器支持 YAML 诊断 (contributed by @0verme) (PR #9552)
  - 数据比较支持按表配置匹配列 (contributed by @0verme) (PR #9555)
  - Meilisearch 多选下拉支持搜索过滤选项 (contributed by @eryajf) (PR #9551)
  - 插件连接支持 SOCKS5 代理路由，SSH 隧道下 Kafka 等多端点协议可通达全部节点 (contributed by @jinpy666) (PR #9562)
  - 插件连接生命周期与会话标签体验改进，支持同连接多会话标签编号与字体主题即时同步 (contributed by @xddcode) (PR #9501)
  - 插件中心已安装插件支持置顶 (contributed by @CHNHJF) (PR #9492)
  - MCP 的 dbx_execute_query 返回行数上限可配置 (contributed by @Abeautifulsnow) (PR #9540)
  - MCP 执行的 SQL 记入查询历史 (contributed by @caichangqing1120) (PR #9535)
  - 插件沙箱界面现跟随应用字体设置，字号与字体实时同步 (contributed by @jinpy666) (PR #9590)
  改进
  - 统一表结构与表属性面板各页签的滚动条样式，并修复字段页高度不足时无法竖向滚动 (contributed by @gggaiitx) (PR #9476)
  修复
  - macOS 按住按键正常重复输入，不再弹出重音字符选择器或吞掉快速按键 (contributed by @jinpy666) (PR #9572)
  - 修复 MySQL 显式配置的 group_concat_max_len 不稳定生效，连接表单补充相关提示 (contributed by @zipg) (PR #9582)
  - 修复 MySQL 在 DELIMITER 指令行执行时相邻语句未被执行 (contributed by @zipg) (PR #9520)
  - 修复 MySQL 执行单语句 BEGIN 后一直占用 autocommit 读快照的问题 (contributed by @zipg) (PR #9541)
  - 修复 PostgreSQL 文本协议查询中布尔列显示为 t/f 文本而非布尔值
  - 修复 PostgreSQL XML 列预览报错，现转换为文本展示 (contributed by @amwps290) (PR #9478)
  - SQL 文件导入的临时禁用关系约束选项对 PostgreSQL/GaussDB/openGauss 生效 (contributed by @hanhvs) (PR #9509)
  - SQL 文件导入的临时禁用关系约束选项对 SQL Server 生效 (contributed by @hanhvs) (PR #9509)
  - 修复 MongoDB 本地值筛选在更改页大小后丢失 (contributed by @zipg) (PR #9564)
  - 修复 MongoDB 全量导出未按网格可见列投影 (contributed by @eryajf) (PR #9565)
  - Redis 集合编辑器行列标签完成本地化 (contributed by @zipg) (PR #9557)
  - 修复 Oracle 补全未给区分大小写的标识符加引号 (contributed by @dienaso) (PR #9558)
  - 修复 Oracle MERGE 语句中独立成行的 UPDATE SET 被误切分并误报解析错误 (contributed by @dienaso) (PR #9559)
  - 修复 Oracle 星号展开丢失标识符引号语义 (contributed by @q396921921) (PR #9462)
  - 修复 Oracle 建表列定义中 DEFAULT 子句未置于 NOT NULL 之前 (contributed by @mr-dadong) (PR #9498)
  - 修复 GBase 8s 新增行加载默认值时未使用实际 SQL 模式 (contributed by @New2Niu) (PR #9481)
  - 修复达梦编译视图后对象浏览器未刷新 (contributed by @luckyguanxin) (PR #9497)
  - 修复虚谷表导入功能不可用 (contributed by @mapan0424) (PR #9554)
  - 修复虚谷自增列未参与数据生成 (contributed by @mapan0424) (PR #9561)
  - 修复人大金仓空连接未优先使用出厂默认测试数据库 (contributed by @zipg) (PR #9548)
  - 修复 OceanBase Oracle 模式引号标识符大小写被改变 (contributed by @Mo-Moore) (PR #9495)
  - 修复 Elasticsearch 旧集群 /_sql 返回 405 时未改用 PUT 重试 (contributed by @zipg) (PR #9517)
  - 修复 GaussDB 等数据库 BLOB 单元格只能显示十六进制，现支持按 UTF-8/GBK 文本预览 (contributed by @0verme) (PR #9545)
  - 修复 MQTT 消息列表切换或刷新后未自动回到最新消息 (contributed by @q396921921) (PR #9460)
  - 修复 SQL 补全在语句终止符前追加多余空格 (contributed by @zipg) (PR #9563)
  - 修复 SQL 补全首字符无前缀匹配时未回退到包含匹配 (contributed by @zipg) (PR #9534)
  - 修复点击补全列表行时已选列丢失 (contributed by @q396921921) (PR #9459)
  - 修复 SQL 补全将 SELECT 星号误判为乘号 (contributed by @q396921921) (PR #9461)
  - 修复右键粘贴含 CRLF 的剪贴板文本时报选区越界 (contributed by @zipg) (PR #9576)
  - 修复拖拽选择时选区高亮错位 (contributed by @jasonchen8068) (PR #9515)
  - 修复截断显示的大值单元格无法进行查找替换，替换前按完整值校验匹配 (contributed by @caichangqing1120) (PR #9521)
  - 修复表结构编辑器缺少可拖拽的纵向滚动条 (contributed by @zipg) (PR #9585)
  - 修复关闭生成 SQL 时包含数据库名设置后表 DDL 仍携带库名/schema 限定 (contributed by @zipg) (PR #9511)
  - 修复 SQL 预览弹窗内容溢出与滚动穿透 (contributed by @eryajf) (PR #9468)
  - 修复分页导出各页未按列名对齐导致的字段错位 (contributed by @zipg) (PR #9583)
  - 修复高精度数字导出 XLSX 后精度丢失，现以文本形式保留 (contributed by @dienaso) (PR #9507)
  - 修复数据比较采样重叠导致的源表重复键误报 (contributed by @0verme) (PR #9503)
  - 修复插件连接保存后连接/查询超时的全局继承选项回退为当前连接 (contributed by @jinpy666) (PR #9579)
  - 修复插件安装或回滚后工作台标签未刷新 (contributed by @CHNHJF) (PR #9469)
  - 插件 CLI 打包兼容 CARGO_BUILD_TARGET 交叉编译产物路径 (contributed by @zipg) (PR #9556)
  - 离线导入单项失败不再中断整包，报错附带系统错误码详情 (contributed by @zipg) (PR #9539)
  - 驱动管理的系统 Java 优先从 JAVA_HOME 识别，找不到时提示实际探测详情 (contributed by @zipg) (PR #9543)
  - MCP 授权流程最后一步隐藏导航，避免误返回 (contributed by @Abeautifulsnow) (PR #9470)
  - MCP 对 db.getSiblingDB() 等跨库 MongoDB 命令补充校验，数据库范围与只读策略不再被绕过
  - 更新失败提示补充失败步骤与安装包路径信息 (contributed by @zipg) (PR #9532)
