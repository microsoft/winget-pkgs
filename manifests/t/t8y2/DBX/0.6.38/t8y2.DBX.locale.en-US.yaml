ReleaseNotes: |-
  新功能
  - 查询结果支持直接导出到其他数据库 (contributed by @eryajf) (PR #11362)
  - 结果集批量新增行时显示进度并支持取消，粘贴多行时自动扩展行 (contributed by @caichangqing1120) (PR #11343)
  - 支持复制单列多行数据的原始文本 (contributed by @zipg) (PR #11498)
  - 点击结果集底部的聚合统计值即可复制 (contributed by @Abeautifulsnow) (PR #11494)
  - DB2 支持查看估算执行计划 (contributed by @Rendegou) (PR #11485)
  - MySQL 建表时支持设置自增起始值 (contributed by @eryajf) (PR #11476)
  - OceanBase Oracle 模式对象树显示对象注释并支持按注释搜索 (contributed by @efeire) (PR #11448)
  - OceanBase Oracle 模式新增约束只读页 (contributed by @efeire) (PR #11450)
  - 数据传输任务保留运行历史记录 (contributed by @0verme) (PR #11303)
  - 新增关闭窗口快捷键 Shift+Mod+W (contributed by @lxk955) (PR #11084)
  改进
  - 连接树支持紧凑行密度设置 (contributed by @lxk955) (PR #11082)
  - 支持自定义结果集十字光标高亮颜色 (contributed by @lxk955) (PR #11078)
  - MQ 主题列表支持手动调整列宽并持久化 (contributed by @zipg) (PR #11366)
  - 数据导入时列名不匹配默认改用按位置映射 (contributed by @lxk955) (PR #11305)
  - 优化 PostgreSQL 查询结果行处理性能，未配置文本编码的连接不再逐行解码列名
  修复
  - 修复结果集加载全部后仍重复请求已取尽数据的问题 (contributed by @dienaso) (PR #11341)
  - 修复结果集无列时底部导出菜单未隐藏的问题 (contributed by @lxk955) (PR #11164)
  - 修复转置视图排序循环无法回到原始顺序的问题 (contributed by @eryajf) (PR #11363)
  - 修复结果集导航未遵循结果标签显示模式设置的问题 (contributed by @lxk955) (PR #11489)
  - 修复切换编辑器标签页时视口与选区相互串扰的问题 (contributed by @lxk955) (PR #11478)
  - 修复插入值提示附近无法拖拽选择的问题 (contributed by @eryajf) (PR #11295)
  - 修复 SQL 排版格式化未遵循关键字大小写设置的问题 (contributed by @lxk955) (PR #11404)
  - 修复侧栏搜索未将已置顶表排在最前的问题 (contributed by @HighBigSky) (PR #11484)
  - 修复导航定位时数据库与工作区标签页切换不正确的问题 (contributed by @eryajf) (PR #11298)
  - 修复表结构编辑器扩展属性列宽不足导致标签显示不完整的问题 (contributed by @peakxy) (PR #11367)
  - 修复选项搜索未优先精确与前缀匹配的问题 (contributed by @lxk955) (PR #11304)
  - 修复复合外键结构比对误报与同步 SQL 生成错误的问题 (contributed by @ordinary-s) (PR #11297)
  - 修复图表 y 轴已选列不显示勾选指示的问题 (contributed by @lxk955) (PR #11306)
  - 修复粘贴表数据量大时被客户端超时中断的问题 (contributed by @zipg) (PR #11385)
  - 修复备份窗口不记住上次备份目录的问题 (contributed by @HighBigSky) (PR #11346)
  - 修复部分 GitLab 实例代码片段下载失败的问题，改用实例 API 下载 (contributed by @caichangqing1120) (PR #11421)
  - 修复功能受限的 WebDAV 服务无法云同步的问题，现支持 ZIP 快照方式
  - 修复 MongoDB 命令诊断把 JS 辅助行错误归因到命令的问题 (contributed by @yiqiui) (PR #11339)
  - 修复 MCP tools/list 与 resources/list 响应缺少完整结果类型元数据的问题
  - 修复 PostgreSQL / openGauss 原生连接不支持历史文本编码参数导致旧编码数据乱码的问题 (contributed by @zipg) (PR #11482)
  - 修复 MySQL 脚本重复 DELIMITER 指令导致执行崩溃的问题 (contributed by @zipg) (PR #11473)
  - 修复 MySQL 视图 CASE/REPLACE 函数格式化无反应的问题 (contributed by @zipg) (PR #11335)
  - 修复 Oracle 慢字段元数据阻塞自动提交查询的问题 (contributed by @zipg) (PR #11401)
  - 修复 Oracle 查看执行计划时 PLAN_TABLE 读写不一致的问题 (contributed by @zipg) (PR #11333)
  - 修复 Oracle 与 OceanBase Oracle 模式 DBLink 与 q 字面量参数扫描的问题 (contributed by @efeire) (PR #11390)
  - 修复 Oracle 查询 panic 后连接未释放的问题 (contributed by @ordinary-s) (PR #11299)
  - 修复 OceanBase Oracle 模式切换连接后当前 schema 未初始化的问题 (contributed by @efeire) (PR #11383)
  - 修复 SAP HANA 漏读 _SYS_BIC 建模视图及视图计数为 0 的问题 (contributed by @zipg) (PR #11434)
  - 修复 SQL Server 查询已含 TOP 或 OFFSET-FETCH 时分页包装隐式追加排序导致报错的问题 (contributed by @Tong-bit-art) (PR #11492)
  - 修复 SQL Server 集合运算与 FOR JSON 查询分页处理遗漏的问题 (contributed by @Tong-bit-art) (PR #11490)
  - 修复 SQL Server 旧版兼容驱动不完整返回批次结果和错误的问题 (contributed by @zipg) (PR #11359)
  - 修复低于 7.4 的 Redis 上含二进制键名或字段名的 hash 查询 TTL 详情失败的问题，现先用安全参数探测 HTTL 支持 (contributed by @zipg) (PR #11381)
  - 修复 SunDB 对象树未按 schema 加载表导致表数量为 0 的问题 (contributed by @zipg) (PR #11361)
