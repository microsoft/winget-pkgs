ReleaseNotes: |-
  新功能
  - Oracle 新增 OCI（thick）驱动模式，Windows 上可通过独立 Agent 配合 Instant Client 连接，并支持配置 NLS_LANG 与 TNS_ADMIN (contributed by @yangziyu1230) (PR #10806)
  - 虚谷数据库新增活动事务管理，SYSDBA 登录时可查看并终止活动事务 (contributed by @mapan0424) (PR #10809)
  - Neo4j 节点查询结果自动将节点属性展开为独立列，属性列支持排序、筛选和导出 (contributed by @HandSonic) (PR #10836)
  - MongoDB 查询标签页支持打开、拖入和另存 .js 脚本文件，并保持当前连接与数据库上下文 (contributed by @lxk955) (PR #10866)
  - Redis 大值支持下载完整内容，超过预览上限的 string 与 kvrocks bitmap 可保存为 .txt 或 .bin 文件 (contributed by @eryajf) (PR #10748)
  - SQL 编辑器按方言补全内置函数，为 Oracle、PostgreSQL、DuckDB、Hive、Spark、Trino 等 30 余个方言补齐函数签名 (contributed by @HighBigSky) (PR #10760)
  - ClickHouse SQL 补全新增 FINAL 等修饰符关键字提示 (contributed by @sxhjlzl) (PR #10830)
  - 查询结果新增打开方式，可将当前结果或选中行导出为 XLSX，或在浏览器中打开支持搜索、字段过滤和表头排序的网页预览 (contributed by @eryajf) (PR #10816)
  - 多结果集新增批量操作，支持批量复制查询 SQL、复制单表 INSERT 语句以及批量导出 XLSX (contributed by @eryajf) (PR #10832)
  - 查询结果页签命名方式可配置，支持来源表名、结果序号和 SQL 语句上方注释 (contributed by @eryajf) (PR #10789)
  - 数据表格支持多字段排序，可选择多个排序字段、升降序并拖动调整优先级 (contributed by @hewenkkkkk) (PR #10807)
  - 单元格详情和值编辑器支持自动换行，长内容按容器宽度换行并跟随全局编辑器换行设置 (contributed by @lxk955) (PR #10881)
  - 筛选和条件批量编辑的列选择支持按列注释匹配，输入中文注释也能找到对应字段 (contributed by @OOMEcho) (PR #10759)
  - 表结构编辑器支持选择并复制字段列，可粘贴到 Excel 等表格软件 (contributed by @eryajf) (PR #10845)
  - 整库 SQL 导出新增 INSERT 写出模式，支持批量追加或每条记录生成一条独立 INSERT 语句 (contributed by @eryajf) (PR #10828)
  - 结构比对支持逗号分隔的多条表排除规则，任意规则命中即跳过该表 (contributed by @OOMEcho) (PR #10782)
  - 连接保活检测到断线时通知侧边栏即时更新连接状态，不再一直显示在线 (contributed by @Abeautifulsnow) (PR #10765)
  - 插件 API 的 openWorkbench 支持指定在标签页打开，底部停靠面板中的插件可切换到标签页展示 (contributed by @jinpy666) (PR #10781)
  - 插件支持动态右键菜单，可在菜单打开时解析可见性、启用状态和子菜单，动态工作台动作也能以对话框形式打开 (contributed by @fanmmy) (PR #10786)
  - AI 技能选择器新增全选和取消全选控件 (contributed by @HandSonic) (PR #10860)
  - 为生产环境的数据展示区域增加与编辑器一致的水印，并优化 SQL 格式化使 SELECT 投影按字段换行、CASE WHEN 保持紧凑 (contributed by @eryajf) (PR #10818)
  - SQL 库搜索结果显示匹配行片段，双击可跳转到文件中的对应行 (contributed by @lxk955) (PR #10883)
  - SQL 格式化对齐 SELECT 别名，AS 关键字按投影列表中最长表达式对齐 (contributed by @onenewcode) (PR #10864)
  - 新增印尼语（Bahasa Indonesia）界面翻译 (contributed by @cunkz) (PR #10869)
  - 查询编辑器滚动条悬停时加宽并提亮，与数据表格滚动条观感一致且更易点击 (contributed by @sberry007) (PR #10884)
  - 快捷键设置页支持折叠和展开作用域分组，便于浏览长列表 (contributed by @eryajf) (PR #10887)
  - SQL 文件面板标题新增问号提示，说明其展示的是通过打开文件夹引入的磁盘 .sql 文件并直接写回原文件 (contributed by @zipg) (PR #10767)
  修复
  - 修复云同步备份/恢复弹窗取消某组全选后父复选框仍勾选、与子项和选择计数不一致的问题 (contributed by @Rendegou) (PR #10889)
  - 修复从数据网格复制单元格时未中和电子表格公式的问题，防止粘贴进 Excel 后执行恶意公式 (contributed by @Tong-bit-art) (PR #10892)
  - 修复点击加载全部时超过单次请求行数上限（默认 10 万行）就提前停止的问题，大表可完整加载到末行 (contributed by @dienaso) (PR #10800)
  - 修复转置视图无法按列名排序的问题，新增按字段名首字母升降序排列并保持字段值、类型与注释对应 (contributed by @eryajf) (PR #10882)
  - PostgreSQL/openGauss 脚本兼容 \set ON_ERROR_STOP、\echo 等安全 psql 控制命令，并保留遇错停止语义 (contributed by @zipg) (PR #10885)
  - 修复 PostgreSQL 备份导出将外键内联进 CREATE TABLE、外键成环时恢复失败的问题，外键改为在文件尾部延迟重建 (contributed by @dxqlovestudy) (PR #10776)
  - 修复 SQL Server 表在结构编辑器中无法添加、更换和删除主键的问题 (contributed by @dxqlovestudy) (PR #10785)
  - 修复 OceanBase Oracle 模式连接的表右键菜单缺少重命名的问题 (contributed by @agammann) (PR #10753)
  - 修复 MongoDB aggregate() 和 count() 后补全建议 limit、sort 等实际会被拒绝的游标方法的问题 (contributed by @thailoc-dev) (PR #10850)
  - 修复 MongoDB $lookup、$graphLookup 和 $unionWith 联表位置补全采样错误集合字段的问题 (contributed by @thailoc-dev) (PR #10851)
  - MongoDB 阶段补全不再提示子管道中会被拒绝的 $out、$merge 等阶段 (contributed by @thailoc-dev) (PR #10852)
  - 修复 MongoDB 脚本 use 切换数据库后补全仍列出原数据库集合和字段的问题 (contributed by @thailoc-dev) (PR #10853)
  - 修复 MongoDB $setWindowFields、$densify 和 $fill 阶段体内补全词表错误的问题 (contributed by @thailoc-dev) (PR #10854)
  - 修复 IRIS 将 Contains 运算符 [ 误当作方括号标识符、导致后续 SELECT 语句无法独立运行的问题 (contributed by @zipg) (PR #10876)
  - 修复 GBase 8s 表结构 DDL 中 VARCHAR2 长度显示为 UNKNOWN(63) 的问题，保留实际长度 (contributed by @zipg) (PR #10875)
  - 修正虚谷数据库能力声明与实际实现不一致的问题，对象源码等已实现功能在连接中正确开放 (contributed by @mapan0424) (PR #10834)
  - 修复 Neo4j 标签网格首次加载不显示属性列、属性类型保存与回滚丢失等问题，并按支持的操作收敛右键菜单和快捷键 (contributed by @HandSonic) (PR #10831)
  - 修复连接部分老式堡垒机时在认证开始前即被断开的问题，ext-info/strict-kex 标记移至 kex 算法列表末尾 (contributed by @cyqdev) (PR #10827)
  - 修复 SQL Server ZIP 导入不增量输出语句导致整包累计后超时、以及多文件导入语句互相串扰的问题 (contributed by @hanhvs) (PR #10632)
  - 修复 PostgreSQL 美元引用字符串中的写关键字被误判为写操作的问题 (contributed by @Yi-111-a) (PR #10805)
  - 修复视图在结构编辑器中加载为 CREATE TABLE 的问题，现在显示 CREATE OR REPLACE VIEW 定义 (contributed by @muhamadsyahrulmubarok) (PR #10794)
  - 修复单表 SQL 导出未遵循「生成 SQL 时包含数据库名」设置的问题，导出脚本恢复到其他库不再失败 (contributed by @dxqlovestudy) (PR #10787)
  - 修复选区仅包含标点连接的字面量时大小写转换不生效的问题 (contributed by @dienaso) (PR #10779)
  - 修复数据标签页右键菜单缺少复制的问题，复制的数据标签使用独立结果并保留筛选与分页设置 (contributed by @OOMEcho) (PR #10777)
  - 修复更新中心完成驱动或 JDBC 组件更新后驱动管理页面仍显示待更新状态、需重开页面的问题 (contributed by @zipg) (PR #10769)
  - 避免 Linux 桌面端启动时对 KDE 密钥库重复探测，密钥库暂时锁定或访问失败时复用同一次结果 (contributed by @eryajf) (PR #10877)
  - 补全西语翻译缺失的 347 个界面键并修复嵌套层级错误 (contributed by @difagume) (PR #10848)
  - Web 版将连接文档注释路径限制在允许的根目录内，修复任意文件写入漏洞，并可通过 DBX_DOCS_NOTES_ROOTS 配置额外目录 (contributed by @jinpy666) (PR #10539)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.30 拉取。
