ReleaseNotes: |-
  新功能
  - 插件商店支持通过 URL 直接安装插件包
  - AI 助手支持同时选择多个数据库并进行跨库查询 (contributed by @eryajf) (PR #8984)
  - SQL 编辑器支持将选中 SQL 以带语法高亮的富文本格式复制 (contributed by @zouchao) (PR #8982)
  - 查询结果标签页支持按 SQL 注释命名 (contributed by @Eve-z1) (PR #9026)
  - 数据网格表头右键菜单支持隐藏选中列 (contributed by @Abeautifulsnow) (PR #9003)
  - Elasticsearch 支持自定义 CA 证书与双向 TLS (mTLS) 连接 (contributed by @yimiaoxiehou) (PR #8969)
  - openGauss 支持 A 兼容模式下的 Package (contributed by @amwps290) (PR #9033)
  - OceanBase Oracle 模式的表 DDL 导出支持追加对象授权语句 (contributed by @Mo-Moore) (PR #9051)
  - 架构比较支持命名配置的保存与加载，并提供切换、重命名、删除、复制、导入等管理能力 (contributed by @Mo-Moore) (PR #9009)
  - Redis 危险命令拦截设置支持持久化保存并可在面板中切换 (contributed by @eryajf) (PR #8981)
  改进
  - 插件市场目录优先使用 R2 源并在失败时自动回退，提升市场加载可靠性
  - 插件市场新增社区维护提示横幅与插件开发文档入口，并优化卡片展示
  - PostgreSQL 系数据传输新增 COPY 快速通道，提升大数据量传输速度 (contributed by @zccat) (PR #9028)
  - MySQL 数据网格批量删除合并为 IN 语句执行，减少大批量删除的执行开销 (contributed by @CHNHJF) (PR #8995)
  - Oracle 视图源码优先从 ALL_VIEWS 读取，提升视图源码加载速度 (contributed by @zipg) (PR #9049)
  - MongoDB 数据筛选按输入位置提供查询操作符建议 (contributed by @thailoc-dev) (PR #9038)
  - 插件开发 SDK 新增帧式二进制传输与共享流桥接能力
  - 插件脚手架 CLI 更新内置 Go SDK，并修复 Windows 下 Go 工作区路径与后端模块构建隔离问题
  修复
  - 修复保存的连接凭据含不可见字符导致连接失败的问题，现自动清理 (contributed by @CHNHJF) (PR #9056)
  - 修复按方言生成 SQL 时误移除必要标识符引号的问题 (contributed by @zipg) (PR #9042)
  - 修复 SQL 字面量包含分号时查询结果不可编辑的问题 (contributed by @onenewcode) (PR #9024)
  - 修复执行 DDL 后持久化元数据未失效导致表结构展示过期的问题 (contributed by @soddygo) (PR #9077)
  - 修复打开对象源码时加载期间无标签页反馈的问题，现立即显示加载中的标签页 (contributed by @Abeautifulsnow) (PR #9072)
  - 修复 MongoDB contains 筛选不支持数值类型的问题 (contributed by @zipg) (PR #9092)
  - 修复 Oracle SELECT * 查询结果不可编辑的问题 (contributed by @Eve-z1) (PR #9059)
  - 修复架构比较未加载 Oracle 命名空间选项的问题 (contributed by @Eve-z1) (PR #9065)
  - 修复 Oracle 结果集跳转指定分页偏移不生效的问题 (contributed by @zipg) (PR #9004)
  - 修复关闭标识符引号选项后 Oracle 普通标识符仍被加引号的问题 (contributed by @zipg) (PR #9006)
  - 修复数据对比生成 Oracle 抽样 SQL 不符合方言导致执行失败的问题 (contributed by @0verme) (PR #9010)
  - 修复 PostgreSQL 数据传输目标 Schema 已存在时报错的问题，现复用已有 Schema (contributed by @zipg) (PR #9063)
  - 修复 GBase 8s 表管理 SQL 携带 owner 限定符导致执行失败的问题 (contributed by @New2Niu) (PR #9029)
  - 修复虚谷 __DBX_ROWID 辅助列在元数据加载后重新显示的问题 (contributed by @zipg) (PR #9001)
  - 修复 MCP 批量执行结构化结果的包装格式问题 (contributed by @Eve-z1) (PR #9069)
  - 修复超大数据量 XLSX 导出文件损坏的问题，现启用 ZIP64 扩展 (contributed by @zipg) (PR #9079)
  - 修复大结果集 JSON 查询导出失败的问题，现改为流式导出，并允许 Web 版导出 TXT (contributed by @zipg) (PR #9071)
  - 修复 CSV 导出时间类型值被公式包装导致无法直接使用的问题 (contributed by @zipg) (PR #9021)
  - 修复不支持的数据库仍显示数据页签导入入口的问题 (contributed by @Abeautifulsnow) (PR #9023)
  - 修复数据生成对 JSON 列生成非法字面量导致 MySQL 写入失败的问题 (contributed by @CHNHJF) (PR #9031)
  - 修复空白字符可视化中单个空格缺少标记的问题 (contributed by @eryajf) (PR #9085)
  - 修复查询执行摘要过窄时无法横向滚动的问题 (contributed by @zipg) (PR #9084)
  - 修复可调整面板可被拖拽至过窄的问题，最小宽度提升至 240px (contributed by @Eve-z1) (PR #9030)
  - 修复经典标签样式顶部边框重复显示的问题
  - 修复编辑器设置弹窗滚动条位置不当的问题
  - 修正关于页导入/导出图标的语义 (contributed by @onenewcode) (PR #8992)
  - 修复空工作区中特殊页面标签页无法显示与切换的问题 (contributed by @eryajf) (PR #9000)
  - 修复插件工作台刷新与启动引导失效的问题
  - 修复插件内嵌工作台启动时主题闪烁的问题
  - 修复多处插件集成稳定性问题 (contributed by @jinpy666) (PR #9054)
  - 修复 Web 版插件连接未路由到插件宿主的问题
  - 修复旧版原生 Agent 无法在 Windows 7 运行的问题，统一改用 Go 1.20.14 构建 (contributed by @zipg) (PR #9052)
  - 修复 Windows 7 下 WebView2 渲染异常恢复失效的问题，恢复时附加 --disable-gpu 参数 (contributed by @zipg) (PR #9040)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.13 拉取。
