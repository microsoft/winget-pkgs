ReleaseNotes: |-
  新功能
  - SQL 快捷操作 — 在设置中配置 SQL 模板快捷键，编辑器中选中表名后按快捷键即可执行 ${table} 替换后的 SQL（如 SELECT COUNT(*) FROM ${table}）。 (contributed by @Mo-Moore) (PR #7469)
  - SQL 脚本导入 — 数据导入新增 SQL 格式：方言感知解析 INSERT INTO ... VALUES，兼容 MySQL DELIMITER、PostgreSQL 美元引用等语法，无法无损导入的构造会被明确拒绝，并支持选择文件编码。 (contributed by @mr-dadong) (PR #7380)
  - 只读连接临时开写 — 只读连接执行写操作时可选择 1 或 5 分钟临时开写，到期或手动锁回后自动恢复只读，持久只读设置不受影响。 (contributed by @fanchenggang) (PR #7379)
  - JOIN 结果删除行 — 查询结果的删除能力独立开放：JOIN 查询在能唯一识别可写源表且主键完整映射时支持删除行，DISTINCT、聚合等场景保持只读。 (contributed by @zipg) (PR #7378)
  - 拖拽列名进编辑器 — 查询结果网格的列头可直接拖入 SQL 编辑器插入列名，支持多列按序插入并按方言智能加引号。 (contributed by @cdredfox) (PR #7372)
  - 多语句执行默认视图 — 新增设置项，多语句批量执行结果默认展示「数据表」或「执行摘要」可配置。 (contributed by @eryajf) (PR #7488)
  - 默认事务提交模式 — 设置 → 编辑器新增全局默认事务提交模式（自动提交/手动事务），新打开的查询页按默认值启动。 (contributed by @Abeautifulsnow) (PR #7460)
  - 数据页禅模式 — 数据标签页新增禅模式快捷切换（默认 Ctrl/Cmd+Shift+F12），临时隐藏侧栏、AI 面板与辅助面板，退出后恢复布局。 (contributed by @eryajf) (PR #7400)
  - SQL 参数一键清空 — SQL 参数填写弹窗新增「清空参数值」操作，保留参数类型与历史，不触发执行。 (contributed by @0verme) (PR #7468)
  - DDL 视图内搜索 — 表结构编辑器的 DDL 页支持 Ctrl/Cmd+F 搜索、高亮与正则/大小写切换。 (contributed by @0verme) (PR #7433)
  - 网格十字线高亮 — 新增行列十字线高亮设置（默认关闭），横向滚动时当前行/列保持可辨识。 (contributed by @Abeautifulsnow) (PR #7417)
  - 联合唯一键引用显示值 — 字段引用显示值配置支持两列联合唯一键（以非空等值条件固定另一列），字典表 (key, value) 类唯一约束可直接使用。 (contributed by @zipg) (PR #7382)
  - 精确行数重新统计 — 状态栏显示精确总行数时提供内联重算按钮，无需重新执行查询。 (contributed by @difagume) (PR #7435)
  - 新建连接选择分组 — 新建连接时可选择所属分组（含「未分组」），从分组入口新建时自动带入。 (contributed by @zipg) (PR #6186)
  - PG 系表约束查看 — PostgreSQL、Kingbase、Vastbase、openGauss 表结构支持查看约束信息。 (contributed by @amwps290) (PR #7445)
  - Hive/Inceptor 存储过程浏览 — Hive/Inceptor 连接可从系统视图浏览存储过程与函数。 (contributed by @Mo-Moore) (PR #7371)
  - MCP 消息队列发送工具 — MCP 服务新增向消息队列 topic 发送消息的工具。 (commit 659fb7f33)
  改进
  - Oracle 首次查询提速 — 冷缓存下索引元数据预检最多等待 1 秒，慢元数据不再阻塞首次查询，完整元数据转后台加载缓存。 (contributed by @zipg) (PR #7414)
  - MySQL 自增值编辑与字段快捷键 — 表级自增编辑入口移至字段「自增」选项旁，未保存的新增字段即可填写下一个自增值且大整数无精度损失；字段快捷键并入按钮悬浮提示，新增 Cmd/Ctrl+Delete 删除字段。 (contributed by @zipg) (PR #7410)
  - 配置导出密码短语加固 — 导出密码短语仅保存在会话内存、重启自动清空；取消保存或写入失败不再误报成功。 (contributed by @mr-dadong) (PR #6684)
  - 行号栏垂直对齐 — 编辑器行号与内容行的垂直对齐更整齐。 (contributed by @eryajf) (PR #7497)
  - 折行语句行号对齐 — 折行语句的行号锚定首个视觉行，不再在折行块内居中错位。 (contributed by @eryajf) (PR #7509)
  - AI 供应商标签本地化 — 「自定义」等 AI 供应商标签随界面语言显示。 (commit 36a7b7bd3)
  修复
  - Windows 隐藏主窗口恢复 — 企业安全软件环境下进程与托盘已启动但主窗口不可见时，启动恢复流程可自动找回主窗口。 (contributed by @zipg) (PR #7491)
  - Linux AppImage 输入法 — AppImage 内置 Fcitx5/IBus GTK 输入法模块，修复较新发行版上无法输入中文等文字的问题。 (contributed by @CN-Scars) (PR #7493)
  - PostgreSQL search_path — 不再覆盖连接配置的多 schema search_path，切换 schema 时仅将目标 schema 前置并保留其余配置。 (contributed by @zipg) (PR #7436)
  - PostgreSQL WITH 语句行数与 CTE 补全 — WITH 包裹的 UPDATE/DELETE 正确返回受影响行数；CTE 内裸列名补全不再强制加前缀。 (contributed by @q396921921) (PR #7428)
  - PostgreSQL 时间戳本地排序 — 网格本地日期排序对微秒精度、时区偏移与 infinity 的时间戳解析更确定，排序结果稳定。 (commit e5572ead7)
  - 瀚高扩展列表 — HighGo PostgreSQL 的扩展列表可正常显示。 (commit 89086cc22)
  - MySQL 导出连接池 — 导出期间健康探针短暂超时不再误判连接池失效并反复重建，导出不再中断。 (contributed by @zipg) (PR #7434)
  - MySQL 可空 timestamp 建表 — 建表/改表 DDL 为可为空的 timestamp 字段显式补全 NULL 关键字，避免 ERROR 1067 或被静默改为 NOT NULL。 (contributed by @q396921921) (PR #7426)
  - DRDS/PolarDB-X 索引元数据 — 索引元数据查询遇到 EXPRESSION 列不存在的 TDDL 错误时自动回退，打开表结构不再报错。 (commit 7ad05b178)
  - Oracle 11g 数据比较分页 — 数据比较分页改用 11g 兼容写法，不再报错。 (commit 80224ab1d)
  - Oracle 字典视图缺失降级 — 受限账号缺少字典视图时，表、列、主键、索引等元数据自动降级 DatabaseMetaData 获取。 (contributed by @StaravenX) (PR #7432)
  - 达梦旧版连接 URL — 旧版本 DBX 生成的达梦连接 URL 自动规范化，升级后可直接连接。 (commit 2467d212d)
  - 达梦多网卡主机连接 — 为达梦驱动打开 java.net 模块，多网卡地址/IPv6 场景连接不再报 InaccessibleObjectException。 (commit d4245f0d5)
  - 达梦结构 DDL 列类型大写 — 结构 DDL 中列类型统一大写显示。 (commit bd6c780ab)
  - Kingbase 标识符引号 — schema 上下文 SQL 遵循驱动配置的标识符引号，含大写/特殊字符的标识符不再报错。 (commit f83f707fb)
  - Kingbase 大结果导出分页 — 大结果集导出分页稳定，不再中断。 (commit b09c6f4f2)
  - SQL Server 传输自增列 — 数据传输启用 IDENTITY_INSERT，自增列数据可正常写入。 (commit 74ffab29c)
  - SQL Server 旧版本传输分页 — 表传输分页改用 ROW_NUMBER()，SQL Server 2008 R2 及更早版本不再因 OFFSET ... FETCH 报错。 (commit 6a6e5fbad)
  - OceanBase(Oracle 模式) 传输分页 — 表传输分页改用 ROWNUM，不再报错。 (commit e996f8aef)
  - OceanBase(Oracle 模式) 删除 Schema — 删除 schema 改用 DROP USER CASCADE，与 OceanBase 的用户模型一致。 (commit e4dc5bace)
  - Doris 导出快照回退 — Doris 拒绝只读一致性快照语法时自动回退，导出可正常完成。 (commit 4636788f4)
  - Hive2 JDBC 连接 — 通过注册驱动直连，其他驱动抛出异常不再中断连接；目录元数据失败时回退 SHOW DATABASES。 (contributed by @Mo-Moore) (PR #7370)
  - InterSystems IRIS 行数统计 — 简单单表查询的精确行数直接注入 COUNT，不再生成派生表别名，避免 IRIS JDBC :%qpar 参数化报错。 (commit 1498b2731)
  - Kafka 主题列表超时回退 — 主题描述请求超时时返回主题名称列表，不再整体失败。 (commit 17e2573fb)
  - r-nacos 手动范围连接 — 命名空间目录端点不可用（如启用 API 鉴权）时支持手动填写展示范围完成连接；Nacos 高级设置页可正常滚动。 (contributed by @eryajf) (PR #7431)
  - MCP TLS 连接 — 初始化时安装 rustls CryptoProvider，修复 MySQL TLS 连接 panic 导致 MCP 连接关闭。 (contributed by @zipg) (PR #7438)
  - 空参数占位符保留 — SQL 参数选择空原始值时保留占位符原文，不再静默变为空值或 NULL。 (contributed by @xiaou61) (PR #7457)
  - 时间戳毫秒补齐 — 网格中 1–2 位小数秒的时间戳显示补齐为三位，完整精度值不变。 (contributed by @xiaou61) (PR #7456)
  - 结果替换滚动重置 — 编辑器重新执行 SQL 替换结果后，网格滚动位置重置到顶部，不再停留在旧偏移。 (commit e8d6370b1)
  - 定位标签页展开分组 — 定位标签页时自动展开已折叠的侧边栏分组。 (commit 4eeeafa85)
  - 对话框边缘裁剪 — 对话框栅格轨道钳制与页脚换行，宽语言文案（如西语更新按钮、长篇发布说明）不再被裁剪。 (contributed by @Abeautifulsnow) (PR #7367)
  - 非法 UTF-8 数据预览 — 外部驱动表预览遇到非法 UTF-8 字节时去掉包装投影自动重试，预览不再失败。 (commit 22305b7d0)
  - 备份排除规则匹配 — 库名与 schema 同名（常见于 PostgreSQL）时，db.schema.table 形式的排除规则正确匹配，计划备份不再误备份被排除的表。 (contributed by @q396921921) (PR #7425)
  安装
  - Windows ARM64 与卸载程序签名 — Windows ARM64 安装包及 NSIS 卸载程序纳入 TrustAsia Authenticode 代码签名并统一校验，全部 Windows 桌面产物均为签名状态。 (commit bcc64274e)
