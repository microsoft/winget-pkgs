ReleaseNotes: |-
  赞助信息
  - 赞助伙伴 HiAPI 入驻，提供图片、视频、音频及文本模型 API（GPT Image 2.5 等），新用户注册赠 200 Credits、充值送 10% 积分，注册入口
  新功能
  - 插件商店新增详情浏览、作者筛选以及已安装插件的工作台入口 (contributed by @eryajf) (PR #11774)
  - 侧边栏新增按列名和注释搜索数据库结构 (contributed by @1gcat) (PR #11748)
  - SQL 编辑器新增行滚动快捷键、结果集空列隐藏以及多语句执行错误位置映射
  - 结果集筛选取值支持直接从当前页获取候选值 (contributed by @lxk955) (PR #11739)
  - 数据网格生成值新增「当前日期时间（毫秒）」 (contributed by @HighBigSky) (PR #11659)
  - 查询结果页签布局优化，并支持鼠标中键关闭 (contributed by @lxk955) (PR #11744)
  - 侧边栏搜索支持按 Enter 直接打开首个匹配项 (contributed by @yiqiui) (PR #11746)
  - 复制尚未加载完整的结果集时会给出提示 (contributed by @yiqiui) (PR #11752)
  - SQL 编辑器支持按名称排除指定自动补全项 (contributed by @yiqiui) (PR #11751)
  - 新建主键时支持自定义主键名称 (contributed by @yiqiui) (PR #11768)
  - 索引列选择器中的未选列按字母排序展示 (contributed by @yiqiui) (PR #11757)
  - SQL 文件执行失败时支持导出和复制失败语句详情 (contributed by @Abeautifulsnow) (PR #11753)
  - 分组右键菜单支持自定义一级操作和排序 (contributed by @zipg) (PR #11564)
  - 新增 PackyCode 合作伙伴 AI 服务预设
  改进
  - 索引编辑器渲染与列选项查询性能优化 (contributed by @lxk955) (PR #11763)
  修复
  - 启用多数据库的 Valkey 集群现在可以正常显示和操作非 db0 的逻辑数据库 (contributed by @CN-Scars) (PR #11776)
  - Oracle 分组查询不再因注入隐藏 ROWID 导致第二次执行报错 (contributed by @lxk955) (PR #11775)
  - 修复 OceanBase Oracle 中对包含反斜杠结尾字符串或 q'…' 字面量的查询点击列排序时会追加第二个 ORDER BY 导致报错的问题 (contributed by @Tong-bit-art) (PR #11771)
  - 达梦、Oracle 与 OceanBase Oracle 的参数替换和变量展开不再误吞数据库链接和 SQL 函数模板 (contributed by @Grapexh) (PR #11676)
  - PostgreSQL 表结构编辑器支持修改列的标识属性（identity）并生成对应 ALTER 语句 (contributed by @lxk955) (PR #11756)
  - SQL 风险扫描现在会正确处理 PostgreSQL E'…' 转义字符串 (contributed by @Tong-bit-art) (PR #11759)
  - SQL 风险扫描现在会扫描 Oracle q'…' 替代引用字符串 (contributed by @Tong-bit-art) (PR #11762)
  - PostgreSQL/openGauss 历史编码文本解码失败时保留原文并继续查询，不再使整条 SELECT 失败 (contributed by @zipg) (PR #11647)
  - Oracle JDBC 连接凭据中的特殊字符不再被破坏 (contributed by @zipg) (PR #11612)
  - 数据网格可预览 Oracle BLOB 单元格中以文本存储的内容 (contributed by @lxk955) (PR #11750)
  - 通过 JDBC 连接 SQL Server 时，含自定义 schema 的数据库同时列出 dbo 等内置 schema (contributed by @lxk955) (PR #11077)
  - 传输到 SQL Server 时复用的 DDL 现在会重定向到目标 schema 并修正注释所有者 (contributed by @dienaso) (PR #11650)
  - DuckDB 多语句拆分不再被 Windows 路径字符串和 E'…' 字符串破坏 (contributed by @onenewcode) (PR #11652)
  - 以分号结尾的 SQL 中 GROUP BY / ORDER BY 引用投影列别名不再被误报为 Unknown column (contributed by @lxk955) (PR #11769)
  - 单表导出的默认文件名改用表名 (contributed by @onenewcode) (PR #11770)
  - Redis 大 Hash 搜索不再因空页提前停止，并可优先返回精确匹配字段 (contributed by @Rendegou) (PR #11680)
  - 修复 Firebird 表触发器加载和源码查看失败的问题 (contributed by @lxk955) (PR #11754)
  - 并发创建相同连接池时保留已有连接池，避免重复建连 (contributed by @jeff377) (PR #11629)
  - MCP 已保存的权限例外在所有连接模式下可见并支持编辑 (contributed by @zipg) (PR #11618)
  - 复制结果页签时保留独立的筛选与排序规则 (contributed by @zipg) (PR #11628)
  - 切换 SQL 结果集子页签时保留滚动位置与选中状态 (contributed by @zipg) (PR #11521)
  - 工具栏关闭「检查更新」后不再显示更新按钮 (contributed by @1gcat) (PR #11740)
  - Linux 主窗口默认使用不透明背景以避免闪烁和内容消失，透明浮动窗口改为按需开启
  - 侧边栏页签的连接颜色显示对齐 (contributed by @eryajf) (PR #11766)
  - 备份计划表单滚动时关闭并隐藏游离的连接选择弹层 (contributed by @lxk955) (PR #11767)
  - Format SQL 没有效果时会说明原因，不再无任何反馈 (contributed by @hongshuo-wang) (PR #11761)
  - 快捷键设置的冲突角标现在跟随搜索结果统计 (contributed by @Abeautifulsnow) (PR #11663)
  - 提亮数据网格当前行背景色以提高可见度 (contributed by @peakxy) (PR #11664)
