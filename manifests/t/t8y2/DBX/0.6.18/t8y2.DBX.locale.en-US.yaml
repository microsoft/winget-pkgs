ReleaseNotes: |-
  新功能
  - MySQL 进程列表新增「终止会话」，可直接关闭目标连接 (contributed by @zipg) (PR #9706)
  - 进程列表支持 Shift 多选会话 (contributed by @zipg) (PR #9716)
  - 进程列表支持一次终止多个选中的会话
  - MongoDB 支持通过旧版 Agent 执行数据库备份与恢复 (contributed by @thailoc-dev) (PR #9633)
  - OceanBase（Oracle 模式）支持序列、同义词与数据库链接 (contributed by @efeire) (PR #9600)
  - OceanBase（Oracle 模式）支持图形化执行计划 (contributed by @efeire) (PR #9611)
  - OceanBase（Oracle 模式）区分执行阶段耗时与客户端等待耗时 (contributed by @efeire) (PR #9612)
  - Meilisearch 支持创建索引 (contributed by @eryajf) (PR #9621)
  - Meilisearch 支持导入 JSON 文件，并支持按筛选结果或全部文档导出 (contributed by @eryajf) (PR #9627)
  - Vastbase（海量数据库）支持数据传输 (contributed by @zipg) (PR #9615)
  - MCP 固定会话支持 MySQL 本地事务，新增 begin/commit/rollback 工具并按调用返回事务状态 (contributed by @xcstatus) (PR #9602)
  - SQL 文件执行、数据对比、历史补偿与多库执行支持手动事务 (contributed by @efeire) (PR #9635)
  - SQL 编辑器支持显示空白字符（空格/Tab/换行） (contributed by @q396921921) (PR #9619)
  - 执行 SQL 文件对话框支持直接粘贴文件路径 (contributed by @q396921921) (PR #9624)
  - 断开或删除连接时可选择保留 SQL 页签与固定页签 (contributed by @javalover123) (PR #9618)
  - 关系图卡片显示表注释与字段注释 (contributed by @zipg) (PR #9748)
  - 关系图导出 DBML/Mermaid 时包含表与字段注释
  - 表设计器新增「复制全部列名」，一次复制整表字段名 (contributed by @zipg) (PR #9730)
  - 从其他表复制字段的对话框显示注释与默认值 (contributed by @zipg) (PR #9724)
  - 深链支持按 ID 更新已保存连接 (contributed by @klinge1011) (PR #9756)
  - 支持自建 GitLab 的代码片段同步 (contributed by @caichangqing1120) (PR #9726)
  - QuickOpen 支持打开独立插件工作台
  - AI 生成回答时滚动到底部按钮显示旋转状态环 (contributed by @Abeautifulsnow) (PR #9695)
  - 插件中心已安装页签支持检查并更新插件，可单个更新或一键全部更新 (contributed by @Abeautifulsnow) (PR #9763)
  - 插件下载改为流式写入且可随时取消，完成后原子替换，中断不再留下损坏文件
  - 插件工作台新增 fileTransfer 桥接，网页端插件可接收本地文件与系统拖拽文件 (contributed by @jinpy666) (PR #9759)
  - 插件 Host API 开放只读执行计划获取能力 (contributed by @0verme) (PR #9692)
  改进
  - SQL 脚本导入改为流式解析，取消 100 MB 文件大小限制 (contributed by @zipg) (PR #9780)
  - 更新中心组件更新改为后台运行 (contributed by @zipg) (PR #9679)
  - 组件更新完成后自动关闭更新中心 (contributed by @zipg) (PR #9610)
  - 插件中心下载控制请求不再随选中数量增长，大量选中时更流畅
  - AI 伙伴服务默认模型更新
  修复
  - 修复 MySQL 字段名开头与结尾的空格被截断 (contributed by @q396921921) (PR #9669)
  - 修复 MySQL 兼容数据源列元数据丢失前导空格导致含空格字段无法编辑 (contributed by @zipg) (PR #9686)
  - 修复旧版本 MongoDB 调用 AI 元数据工具获取字段时报 Unknown method，改为推断集合字段
  - 修复 MongoDB 备份/恢复遇不可读游标或 Agent 版本过旧时未尽早报出明确错误 (contributed by @thailoc-dev) (PR #9785)
  - 修复 Redis 账号无 PING/INFO 权限时被误判连接失败 (contributed by @zipg) (PR #9628)
  - 修复 Redis 编辑器执行命令时未跳过注释行 (contributed by @thailoc-dev) (PR #9607)
  - 修复 AI 经 MCP 连接 Redis 时直接执行命令报无权限，现先引导选择数据库
  - 修复 Oracle 克隆新表时触发器 body 提取失败导致 ORA-04079 与半成品新表 (contributed by @zipg) (PR #9770)
  - 修复 Oracle 表格保存字符串时反斜杠被翻倍 (contributed by @q396921921) (PR #9737)
  - 修复 Oracle 补全未遵循「标识符添加引号」设置 (contributed by @q396921921) (PR #9746)
  - 修复含局部过程/函数的 Oracle 匿名块被错误拆分执行 (contributed by @q396921921) (PR #9656)
  - 修复 Oracle 管理类 DDL 被诊断误报语法错误 (contributed by @zipg) (PR #9632)
  - 修复 OceanBase（Oracle 模式）与 Oracle CLOB 保存字符串时反斜杠仍被翻倍
  - 修复 OceanBase（Oracle 模式）网格保存与切换目标时的手动事务问题 (contributed by @efeire) (PR #9606)
  - 修复 OceanBase（Oracle 模式）首次查询未限制结果页大小 (contributed by @efeire) (PR #9605)
  - 修复 OceanBase（Oracle 模式）字典降级读取的视图定义未正确保存 (contributed by @efeire) (PR #9604)
  - OceanBase（Oracle 模式）执行计划预计耗时标签完成本地化 (contributed by @efeire) (PR #9704)
  - 修复 Doris 外部 catalog 下查询未使用 catalog 内真实数据库 (contributed by @q396921921) (PR #9741)
  - 修复 Doris/StarRocks 外部 catalog 非限定名查询的列注释与可编辑性元数据解析不到
  - 修复 Meilisearch 网格工具栏遮挡首个字段 (contributed by @q396921921) (PR #9696)
  - 统一 Meilisearch 任务时间格式化与本地化展示 (contributed by @eryajf) (PR #9764)
  - 修复 Meilisearch 连接误显示通用新建查询入口 (contributed by @eryajf) (PR #9614)
  - 修复 SQL Server 补全缺少 DECLARE 等 T-SQL 关键字 (contributed by @zipg) (PR #9629)
  - 修复 SQL Server 复制/导出的 INSERT 未包裹 SET IDENTITY_INSERT 导致标识列回放报 544 错误 (contributed by @zipg) (PR #9768)
  - 修复 SQL Server INTERSECT/UNION/EXCEPT 分页只限制第一个分支导致结果行数错误 (contributed by @q396921921) (PR #9718)
  - 修复 SQL Server 导出 DDL 时复合外键被拆分导致同名约束重复 (contributed by @q396921921) (PR #9743)
  - 修复 SQL Server 双击临时表名时未选中 # 前缀 (contributed by @q396921921) (PR #9703)
  - 修复 SQL Server 导出 DDL 丢失外键 ON DELETE/ON UPDATE 动作，REFERENCES 未带 schema 限定
  - 修复 SQL Server 结构对比未按元数据容量扇出请求导致 metadata pool is busy (contributed by @0verme) (PR #9601)
  - 修复 H2 多会话与 AUTO_SERVER 连接下的数据库文件锁冲突 (contributed by @HandSonic) (PR #9747)
  - 修复虚谷连接未选择数据库时失败，现要求连接前先选择数据库 (contributed by @mapan0424) (PR #9668)
  - 修复达梦/DB2 等大小写折叠方言补全未遵循「标识符添加引号」设置
  - 修复 INSERT 列名提示重复投影中已有别名 (contributed by @zipg) (PR #9574)
  - 修复查询编辑器查看 DDL 时未按数据库类型解析格式化方言 (contributed by @zipg) (PR #9673)
  - 修复垂直布局与非手动排序模式下的标签拖拽排序失效 (contributed by @eryajf) (PR #9762)
  - 修复清空搜索后对象组已加载分页未恢复 (contributed by @zipg) (PR #9713)
  - 修复虚拟表分组与平铺行混排排序时的置顶/置底跳变 (contributed by @zipg) (PR #9682)
  - 修复虚拟表分组在对象树刷新后排序失效
  - 修复清空对象缓存时逐表发送删除请求，大 schema 下改为按前缀批量删除避免请求风暴
  - 双击视图直接打开数据页签，修复双击导致源对象被意外取消勾选 (contributed by @yaoxinghuo) (PR #9626)
  - 修复多 schema 关系图导出的卡片位置与画布不一致 (contributed by @zipg) (PR #9625)
  - 修复数据传输到 Oracle 系目标时 NUMBER(p,s) 精度丢失 (contributed by @zipg) (PR #9787)
  - 修复数据传输写入已存在目标表时未按目标表字段名大小写匹配 (contributed by @zipg) (PR #9566)
  - 为仅支持 CBC 的老旧 SSH 服务端补充 AES-CBC 兜底算法 (contributed by @zipg) (PR #9680)
  - 修复驱动与插件列表过长时无法在弹窗内滚动 (contributed by @HighBigSky) (PR #9666)
  - 修复手动管理组件后更新中心状态未同步 (contributed by @zipg) (PR #9702)
  - 修复组件更新后各入口状态未同步刷新 (contributed by @zipg) (PR #9646)
  - 修复按 UI contribution 声明的插件结果视图无法打开 (contributed by @0verme) (PR #9599)
  - 修复宿主版本未知时插件引擎门禁误拦截插件 (contributed by @dienaso) (PR #9622)
  - 修复插件批量模式取消后未退出批量模式 (contributed by @yiqiui) (PR #9638)
  - 修复 JSONL 插件协议单行上限与 binary 帧不一致导致大结果集报错 (contributed by @zipg) (PR #9677)
  - 修复 AI 数据库选择器长名称提示与布局问题 (contributed by @AkenClub) (PR #9681)
  - 修复 AI @ 引用表未按输入框所选数据库列出 (contributed by @q396921921) (PR #9617)
