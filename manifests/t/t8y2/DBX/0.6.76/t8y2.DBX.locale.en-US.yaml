ReleaseNotes: |-
  新功能
  - MySQL 与 MariaDB 支持重命名数据库
  - MySQL 数据网格复制行为 SQL 时支持生成 REPLACE INTO，键冲突时替换原记录 (contributed by @ThugKd) (PR #15768)
  - MySQL 表 DDL 查看支持复制时省略表级 AUTO_INCREMENT 起始值 (contributed by @ThugKd) (PR #15763)
  - PostgreSQL 连接自动识别 Greenplum 6/7，DDL 生成包含分布键与 AO 存储选项，并支持经典目录分区浏览 (contributed by @Mo-Moore) (PR #15650)
  - PostgreSQL 数据筛选新增不区分大小写的包含模式，使用 ILIKE 匹配 (contributed by @ombimo) (PR #15715)
  - Oracle 侧边栏包成员点击直接打开包体并定位到实现位置 (contributed by @ZHAOGS0217) (PR #15588)
  - Oracle 包成员列表支持右键执行过程，可输入参数并预览 PL/SQL 调用 (contributed by @zipg) (PR #15825)
  - Oracle PL/SQL 调试支持 OUT REF CURSOR 参数，结束后以表格预览游标结果 (contributed by @zipg) (PR #15833)
  - Firebird 视图支持编辑并保存定义，生成 CREATE OR ALTER VIEW (contributed by @zipg) (PR #15826)
  - SQL Server 侧边栏存储过程分组新增「新建存储过程」入口，自动填入 T-SQL 模板 (contributed by @ThugKd) (PR #15760)
  - Kafka 消费者组面板支持删除选中的消费者组及其已提交位点 (contributed by @ThugKd) (PR #15774)
  - MCP 新增只读查询工具 dbx_query，计划模式与数据探查不再触发写权限确认 (contributed by @tw2066) (PR #15625)
  - MCP 的 Nacos 历史配置支持按版本号读取正文，并附带来源 IP、操作者等审计字段 (contributed by @ThugKd) (PR #15765)
  - AI 图表新增散点图、热力图、漏斗图和象形柱图类型，折线/柱状图支持面积、阶梯、堆叠与参考线 (contributed by @Abeautifulsnow) (PR #14691)
  - AI 历史会话支持置顶，常用会话不再随时间沉底 (contributed by @Abeautifulsnow) (PR #14370)
  - 连接配置支持按连接自定义环境水印的文字、字号和颜色 (contributed by @jiejie1133) (PR #15780)
  - 插件新增宿主观测总线与 host.observe 权限，可订阅查询、连接、AI、传输等宿主事件 (contributed by @Abeautifulsnow) (PR #15280)
  - SQL 编辑器支持配置表补全时使用的首选别名 (contributed by @ThugKd) (PR #15863)
  - SQL 编辑器中 Ctrl/Cmd 点击表别名可跳转到该别名在 SQL 中的声明处 (contributed by @ThugKd) (PR #15762)
  - 标签双击行为设置新增「不执行操作」选项 (contributed by @ThugKd) (PR #15839)
  - 表数据支持把当前筛选和排序保存为默认条件，重新打开时自动应用 (contributed by @ThugKd) (PR #15772)
  改进
  - SQL 自动补全默认激活延迟从 500ms 降至 50ms，已保存的 500ms 旧值自动迁移
  - 界面渲染性能优化，降低编辑器选区布局与全局合成层开销
  - 插件面板 UI 加载提速：启动时不再预热面板内容，base64 改为原生解码
  - Oracle 高延迟链路上 DBX 自身元数据读取明显提速，跳过 DBMS_OUTPUT 排空与多余的 schema 切换 (contributed by @ZHAOGS0217) (PR #15776)
  - MongoDB 查询结果加载减少 BSON 拷贝与网格开销 (contributed by @thailoc-dev) (PR #15751)
  - MongoDB 补全输入复用已计算的掩码脚本文本，降低每次按键解析开销 (contributed by @thailoc-dev) (PR #15698)
  - MongoDB 含大量正则字面量的查询解析大幅提速 (contributed by @thailoc-dev) (PR #15830)
  - MongoDB 输入 db 时补全当前库的集合名称 (contributed by @thailoc-dev) (PR #15687)
  - TDengine 超级表子表改为按需加载，无过滤条件时不再全量扫描超级表
  - MySQL NO PAD 二进制排序规则的文本列生成行谓词时不再包裹 BINARY，避免破坏索引使用
  - SQL 参数弹窗点击外部不再关闭，可在弹窗打开时查看和复制编辑器内容 (contributed by @AndreasK79) (PR #15552)
  - SQL 参数弹窗中被截断的参数名悬停可查看全文，便于区分同前缀长参数 (contributed by @parade0393) (PR #15887)
  - 表数据表头拖拽立即生效预览新顺序，保存与确认行为可按需选择 (contributed by @ThugKd) (PR #15847)
  - 表格查找和筛选现在也匹配已加载的长文本预览，能命中视口中可见的文本 (contributed by @ThugKd) (PR #15770)
  - 执行 SQL 文件的目标数据库选择框支持搜索过滤 (contributed by @ThugKd) (PR #15758)
  - PolarDB MySQL 版预设明确标注为 PolarDB (MySQL)，与 PostgreSQL 版区分 (contributed by @xiaou61) (PR #15666)
  - 巴西葡萄牙语界面补齐近期版本缺失的翻译，回退英文的文案恢复本地化 (contributed by @saskuati-dev) (PR #15786)
  - AI 预设列表更新：HuaLong 注册赠送额度提升至 $2，AstraFlow 企业版介绍文案更新
  修复
  - SQL*Plus 风格的 EXEC/EXECUTE 语句改按匿名块执行，可直接运行
  - Oracle 包源码内 Ctrl/Cmd 点击子程序名不再打开空编辑器，按所属包正确解析 (contributed by @ZHAOGS0217) (PR #15835)
  - Oracle 带 schema 的表引用不再误报 unknown column，字典大小写缓存与诊断读取统一 (contributed by @sx4im) (PR #15885)
  - Oracle 小写 schema 引用同一张表时字段悬停恢复显示，语义诊断不再误报缺失字段 (contributed by @seaways1015-afk) (PR #15842)
  - 大小写折叠方言下补全不再给未加引号的表别名额外加双引号，避免执行报 ORA-00904 (contributed by @Acd-kk) (PR #15790)
  - Oracle 保存包体后不再因默认 EDITIONABLE 子句误报定义不一致，例程源码指纹与定位修正 (contributed by @ZHAOGS0217) (PR #15775)
  - 升级 godror 驱动，修复耗时查询固定报 ORA-03156 超时且忽略连接超时配置的问题 (contributed by @Acd-kk) (PR #15533)
  - MySQL 连接 URL 带客户端时区参数时不再覆盖数据库会话时区，SELECT NOW() 返回服务器时间 (contributed by @Acd-kk) (PR #15864)
  - ShardingSphere 等分库代理上带 GROUP BY 查询的总行数不再重复累加错算 (contributed by @Acd-kk) (PR #15733)
  - 不支持 COM_RESET_CONNECTION 的代理上查询不再反复新建连接，关闭后后端连接正常释放 (contributed by @Acd-kk) (PR #15639)
  - MySQL 网格生成的 SQL 字面量转义换行符，复制粘贴回编辑器不再静默改变存储文本 (contributed by @defia) (PR #15671)
  - PostgreSQL 库中不存在 public schema 时查询不再报 22023，search_path 只保留实际存在的 schema (contributed by @xiaou61) (PR #15652)
  - Kingbase bit 列按位串显示为 0/1，不再显示 0x00/0x01 (contributed by @zipg) (PR #15711)
  - Kingbase 表结构变更保留 schema 限定名，搜索路径有同名系统表时不再指向错误对象 (contributed by @ThugKd) (PR #15773)
  - Vastbase G100（Oracle 兼容 A 模式）对象树不显示包，现支持列出包与包体 (contributed by @xiaou61) (PR #15573)
  - ArgoDB 侧边栏不显示表注释，现从 system.tables_v 自动补全 (contributed by @bigdogcome) (PR #15814)
  - GaussDB 支持 SM3 密码认证方式登录
  - SAP HANA 新建表支持新增字段，已有表支持设置主键并正确处理 NOT NULL (contributed by @zipg) (PR #15822)
  - SQL Server 2005 空 schema 元数据改用目录视图解析，建表后刷新表结构不再报 OBJECT_SCHEMA_NAME 错误 (contributed by @zipg) (PR #15771)
  - 达梦表已存在但 SQL 补全不提示表和列的问题修复，补全检索改用轻量字典查询 (contributed by @Acd-kk) (PR #15647)
  - IoTDB 带别名的时间聚合结果按时间戳类型返回，别名扫描正确识别 IoTDB 名称字符
  - InfluxDB 空结果省略 values 字段时不再报 missing field values (contributed by @CN-Scars) (PR #15691)
  - ClickHouse 连接测试改用 POST 发送查询，兼容会重置 GET 查询的代理环境 (contributed by @AyhamJo7) (PR #15661)
  - H2 文件连接测试和保存时不再丢失 JDBC URL 参数 (contributed by @CN-Scars) (PR #15684)
  - MQTT 连接保存时订阅列表不再被旧配置覆盖丢失 (contributed by @ThugKd) (PR #15757)
  - 含集合操作派生表的查询恢复显示列注释 (contributed by @bigdogcome) (PR #15689)
  - Linux WebKitGTK 下 Ctrl+X 不再一次剪切两行 (contributed by @sx4im) (PR #15884)
  - T-SQL 中 END 后接下一行 IF 不再误判为 END IF，BEGIN…END 折叠与配对高亮恢复 (contributed by @zipg) (PR #15785)
  - 接受补全替换未知对象文本后不再把整段插入语句标红
  - SQL 补全激活延迟对粘贴、删除和输入法输入统一生效，设置中的延迟数值框可正常编辑 (contributed by @zipg) (PR #15634)
  - 部分加载结果集中复制选中行时提示不再谎报「已复制已加载的 N 行」 (contributed by @chukui2005) (PR #15640)
  - 数据网格搜索框在输入法组字期间不再抢走按键，避免误跳转 (contributed by @iQNRen) (PR #15637)
  - 「定位到列」面板中调用查找快捷键时焦点保持不丢 (contributed by @imcman) (PR #15738)
  - 转置视图导出选中记录的 Markdown 与视图布局一致 (contributed by @imcman) (PR #15743)
  - 全局搜索输入法回车上屏不再误触发打开结果 (contributed by @zipg) (PR #15783)
  - AI 助手的插件工具只使用会话附加连接和目标连接，不再触达无关的运行中插件连接 (contributed by @Abeautifulsnow) (PR #14084)
  - 数据生成器文本主键生成长度适配的十六进制 ASCII 标识符，不再填充随机语句 (contributed by @ThugKd) (PR #15756)
  - 插件连接「保存并连接」后正确打开插件工作台窗口 (contributed by @jinpy666) (PR #15791)
  - 对象浏览器工具栏变窄时数据库和 Schema 标签保持可读，长名称以省略号截断 (contributed by @ThugKd) (PR #15759)
  - 更新对话框底部控件在正常宽度下不再重叠 (contributed by @sanketpatel32) (PR #15707)
