ReleaseNotes: |-
  新功能
  - 新增 GBase 8c 连接类型，通过 agent 路线连接南大通用 openGauss 内核 (contributed by @xiSage) (PR #12456)
  - macOS 上可检测并一键授权 dbx-mcp 访问钥匙串，授权后会验证对后台启动持续生效，MCP 工具调用不再报 SECRET_KEY_UNAVAILABLE
  - 连接新增空闲自动断开设置，空闲超过设定秒数后自动断开并保留已打开的查询标签与结果 (contributed by @HighBigSky) (PR #12152)
  - 手动事务的空闲回滚超时支持按连接配置（30–86400 秒，默认 300 秒）
  - 对象浏览器和数据库列表新增紧凑九宫格视图，列表模式支持配置显示字段 (contributed by @eryajf) (PR #12415)
  - 结果网格支持复制列注释 (contributed by @HighBigSky) (PR #12469)
  - RocketMQ 连接支持 Proxy gRPC 方式发送消息，Proxy-only 部署无需配置 NameServer (contributed by @admxj) (PR #12430)
  - 数据网格新增布尔列文本显示设置，可切换 true/false 与 1/0 两种写法 (contributed by @yiqiui) (PR #12288)
  - 可编辑网格在最后一行按 ↓ 直接新增行，Esc 撤销新增行 (contributed by @Abeautifulsnow) (PR #12425)
  - 代码片段支持按周期自动上传到 GitHub、Gitee 和 GitLab，默认每 30 分钟 (contributed by @ma123456mai) (PR #12057)
  - AI 设置页新增 Magpie 配置导入入口 (contributed by @ma123456mai) (PR #12173)
  - 计划备份新增永久保留选项 (contributed by @lxk955) (PR #12375)
  - MongoDB 集合新增清空集合操作，与删除集合一起收纳进危险操作菜单 (contributed by @eryajf) (PR #12370)
  - MongoDB 连接表单识别 Atlas 集群主机名时提示一键切换 mongodb+srv:// URL (contributed by @thailoc-dev) (PR #12398)
  - 单元格详情编辑器对超长单行值自动折行显示 (contributed by @yiqiui) (PR #12409)
  - 对象浏览器搜索支持省略对象名称中的下划线 (contributed by @eryajf) (PR #11643)
  改进
  - GBase 8s 拆分为独立的数据库类型入口，不再混在 GBase 通用入口下，存量 8s 连接自动迁移
  - GBase 8c 连接内置厂商 JDBC 驱动，无需再手动准备驱动 jar
  - 连接对话框把 GBase 8c 归入 GBase 分组入口
  - MCP 授权界面从分步向导改为分区标签页
  - SQL 格式化默认采用 DBX 排版并对齐字段与别名，已保存的 Classic 选择保留 (contributed by @ma123456mai) (PR #12066)
  - 多表 JOIN 结果的表头列注释立即显示不再等待索引判定，表头类型显示长度/精度（如 varchar(50)） (contributed by @Mo-Moore) (PR #12423)
  - 插件市场详情弹窗内容可滚动，更新历史按版本折叠并可跳转 GitHub Release (contributed by @yiqiui) (PR #12401)
  - 单元格详情编辑器打开 JSON 值时自动格式化，无需先手动点击 Format JSON (contributed by @Xcylway) (PR #12433)
  - 选中列时把导出选中列的格式选项提前到导出菜单首组 (contributed by @eryajf) (PR #11778)
  修复
  - 界面缩放较高时设置页底部的恢复默认/关闭/应用按钮不再被挤出窗口不可点击 (contributed by @HmEJ) (PR #12443)
  - 主窗口恢复时检测到低于最小尺寸的损坏记录自动回退默认大小，不再被残留的 0×0 记录卡成小窗
  - Redis 模糊搜索的 keyspace 感知扫描预算真正生效，大 keyspace 下不再只扫约 5 万键就停止 (contributed by @yiqiui) (PR #12468)
  - Redis 编辑连接的显示数据库选择器为元数据探测增加超时，服务端不响应时不再无限等待导致弹窗卡死 (contributed by @Xcylway) (PR #12435)
  - 跳转到越界页后加载全部并转到末行改为从第一行完整重载，不再静默丢失剩余行 (contributed by @dienaso) (PR #12325)
  - 跳页状态下加载全部完成首段重载后继续读取剩余分块，不再停在首批上限 (contributed by @lxk955) (PR #12434)
  - 数据表格 ORDER BY 补全默认选中第一项，按 Enter 直接接受 (contributed by @eryajf) (PR #12365)
  - 切换标签页返回后数据库浏览器保持滚动位置 (contributed by @lxk955) (PR #12436)
  - MySQL 文本类 BLOB 单元格复制为解码后的文本，与网格预览一致 (contributed by @Tong-bit-art) (PR #12420)
  - PostgreSQL 无主键表通过 tableoid/ctid/xmin 物理行定位符编辑，所有列完全相同的重复行也能安全更新和删除 (contributed by @onenewcode) (PR #12380)
  - GaussDB 全局索引的索引列不再显示 tableoid 等系统列 (contributed by @AndrewDi) (PR #12403)
  - DuckDB 查询的计算列正确上报列类型，金额等数值列导出 xlsx 不再变成文本列 (contributed by @lxk955) (PR #12417)
  - Databend 表数据编辑保存改为无事务方式，不再报 Transactions are not supported (contributed by @hongshuo-wang) (PR #12027)
  - 数据传输到 H2 目标时 DATETIME 列映射为 TIMESTAMP，建表不再报 Unknown data type (contributed by @Sowevo) (PR #12431)
  - GBase 8s / Informix 通用 JDBC 连接点击数据库不再报 getSchemas 方法不支持 (contributed by @yiqiui) (PR #12397)
  - OceanBase Oracle 模式执行匿名 PL/SQL 块后返回 DBMS_OUTPUT 输出 (contributed by @efeire) (PR #12439)
  - OceanBase Oracle 序列 NEXTVAL/CURRVAL 查询不再被包进 ROWNUM 包装导致 OBE-02287 (contributed by @jeff377) (PR #12386)
  - OceanBase Oracle 模式约束编辑修复预检查询、CHECK 读回误报和 UNIQUE 不支持的 ENABLE VALIDATE 后缀 (contributed by @efeire) (PR #12385)
  - Oracle / OceanBase Oracle 过程体中 DECODE 等连续 CASE 表达式不再被误判截断 CREATE PROCEDURE (contributed by @Mo-Moore) (PR #12400)
  - MongoDB 编辑器接受 mongosh 风格的 Int32、Long、Double、Decimal128 构造器 (contributed by @thailoc-dev) (PR #12394)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.46 拉取。
