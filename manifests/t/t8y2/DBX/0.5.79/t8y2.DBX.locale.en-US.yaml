ReleaseNotes: |-
  新功能
  - Grok CLI AI 提供方 — AI 面板新增 Grok CLI 本地 CLI 提供方，无需 API Key 即可使用，支持路径/环境变量配置、MCP 隔离的 headless 运行、模型列表与连接测试，并支持低/中/高推理强度切换。 (contributed by @chenow9)
  修复
  - Excel 导入保留空字符串默认值 — 从 Excel 导入数据时默认保留空字符串，空单元格可正确使用列的默认值。 (closes #5329)
  - 查询结果表头多余 NULL 标记 — 移除查询结果表头中内联的多余 NULL 标记。 (contributed by @zipg)
  - PostgreSQL 兼容数据库连接崩溃 — 修复连接 PostgreSQL 兼容数据库时可能崩溃的问题。 (contributed by @zipg)
  - JSON 详情双击选词不进编辑 — 修复 JSON 详情视图双击选词时误进入编辑模式的问题。 (contributed by @zipg)
  - 批量生成值后保存快捷键失效 — 修复批量生成值后保存快捷键失效的问题。 (contributed by @zipg)
  - 设置读取失败覆盖用户配置 — 修复设置读取失败时覆盖用户配置的问题。 (contributed by @zipg)
