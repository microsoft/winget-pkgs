ReleaseNotes: |-
  新功能
  - 新增 Apache CouchDB 数据源支持，可创建连接、浏览数据库与文档数据并执行查询 (contributed by @saefulrahman) (PR #11068)
  - 表右键菜单新增模型生成，可从表结构生成 TypeScript、Zod、Pydantic、Go、Rust、Java、C# 等 15 种语言与校验框架代码，支持语法高亮预览和自定义模板 (contributed by @eryajf) (PR #11076)
  - 数据传输仅结构模式新增执行前 SQL 预览，可先确认目标库将要执行的结构语句再开始传输 (contributed by @0verme) (PR #11066)
  - 插件工作台新增独立浮窗承载方式，可置顶常驻并停靠到屏幕边缘，适合播放器、快捷选择器等小组件 (contributed by @onceMisery) (PR #11064)
  - 查询图表支持在柱状图和折线图上显示数据标签，直接读取每个数据点的数值 (contributed by @lxk955) (PR #11067)
  - SQL 编辑器新增行尾多光标，可一次在多行行尾同时输入 (contributed by @eryajf) (PR #10880)
  - 工具栏新增立即同步入口，无需进入设置即可触发同步 (contributed by @eryajf) (PR #10898)
  - CREATE TABLE 和 ALTER TABLE 中的列类型支持自动补全 (contributed by @lxk955) (PR #11073)
  - 侧边栏双击字段或索引直接打开表结构编辑器并定位到目标项，单击定位数据列的行为保持不变 (contributed by @eryajf) (PR #11075)
  - 侧边栏对象树显示存储过程和函数的注释 (contributed by @lxk955) (PR #11063)
  - 对象浏览器为处于无效状态的存储过程、函数、视图显示失效标记和状态徽标 (contributed by @lxk955) (PR #11062)
  - Oracle 数据库链接移至侧边栏底部独立分组，并支持显示/隐藏切换 (contributed by @lxk955) (PR #11060)
  - 点击侧边栏列可在数据网格中快速定位该列 (contributed by @lxk955) (PR #11042)
  - 新增执行计划默认视图设置，可预设画布、树、摘要、表格或原始文本 (contributed by @lxk955) (PR #11049)
  - 函数补全支持配置参数示例 (contributed by @lxk955) (PR #11051)
  - 输入完整的 SQL 关键字时也提供大小写转换补全，where、order by、group 等全词输入可补全为关键字标准写法 (contributed by @lxk955) (PR #11048)
  - 保存到 SQL 库对话框新增新建文件夹按钮 (contributed by @lxk955) (PR #11025)
  - SQL 库文件夹新增排序选项 (contributed by @lxk955) (PR #11026)
  - SQL 库文件右键菜单新增新建查询入口 (contributed by @lxk955) (PR #11028)
  - 新增导出完成后自动打开所在文件夹的设置项 (contributed by @lxk955) (PR #11056)
  - 导出记住上次导出目录，并支持设置常用导出目录 (contributed by @lxk955) (PR #11029)
  - Web 模式品牌标识位置支持配置或隐藏 (contributed by @lxk955) (PR #11057)
  - 标签页最大宽度支持自定义 (contributed by @lxk955) (PR #11047)
  - 下拉选择框支持直接键入文字筛选和匹配选项 (contributed by @lxk955) (PR #11034)
  改进
  - 驱动包更新改为 zstd 增量下载，基于本地缓存的旧版本重建新包，驱动升级下载量从整包数十 MB 缩小到几 MB (PR #11074)
  - 首页默认展示工作区概览，上一版本默认进入的介绍页不再强制，仍可在设置中切换
  - 补全印尼语翻译，覆盖数据字典、内置文档和 Meilisearch 管理界面 (contributed by @cunkz) (PR #10920)
  - 数据表格布尔复选框样式改进，浅色和深色主题下显示更清晰 (contributed by @lxk955) (PR #11027)
  修复
  - 修复 JDBC 连接（如 IBM i AS/400）上存储过程和函数不显示参数结构并提示 Object source is not supported 的问题
  - 修复 Linux KDE 上应用启动时因 Secret Service 密钥项锁定而报错的问题，重试时自动解锁
  - 修复 MongoDB 经 SSH 隧道连接副本集时未遵循 directConnection 参数导致连接失败的问题 (contributed by @thailoc-dev) (PR #10916)
  - 修复 MongoDB 补全 new Date() 等构造函数时未替换已输入的 new 导致内容重复的问题 (contributed by @thailoc-dev) (PR #11036)
  - 修复 MongoDB 通过 db["name"] 方式访问的集合无法补全的问题 (contributed by @thailoc-dev) (PR #11039)
  - 修复 MongoDB $elemMatch 补全未给出其可用查询操作符的问题 (contributed by @thailoc-dev) (PR #11035)
  - 修复 MongoDB 在非游标结果后输入点号仍弹出无关补全建议的问题 (contributed by @thailoc-dev) (PR #11038)
  - 修复 MongoDB 更新补全未提供 $comment、未跳过已使用的键、$set 值位置仍给出字段建议的问题 (contributed by @thailoc-dev) (PR #11040)
  - 修复 MongoDB 采样推断的日期和 ObjectId 字段在补全中未标注 BSON 类型的问题 (contributed by @thailoc-dev) (PR #11037)
  - 修复 DB2 补全未限定列名时未按登录 schema 解析的问题 (contributed by @Tong-bit-art) (PR #11061)
  - 数据网格行定位支持唯一键并新增虚拟唯一键设置，无主键的表也能安全读取大字段完整值、更新和删除行，DB2 大字段延迟加载同步生效
  - 修复选择 SQL 文件后目标数据库被重置丢失的问题 (contributed by @lxk955) (PR #11065)
  - 修复查询历史面板宽度异常，并将特殊页面与侧边栏布局隔离 (contributed by @lxk955) (PR #11055)
  - 修复 macOS 调整窗口大小时左上角红绿灯按钮跳动的问题 (contributed by @zipg) (PR #11033)
  - 修复深色模式和 IDE 主题下背景图片不显示的问题 (contributed by @lxk955) (PR #11030)
  - 修复导出 HTML 在 Excel 中打开时单元格内容被当作公式求值的问题 (contributed by @Tong-bit-art) (PR #11031)
  - 修复未先点击数据网格时编辑表结构快捷键无效的问题 (contributed by @lxk955) (PR #11032)
  安装
  - 修复 Nix 构建的 pnpm 依赖哈希不匹配问题
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.34 拉取。
