ReleaseNotes: |-
  赞助信息
  - 华龙算力AI中转站喜迎中秋国庆活动：充值 88 元得 100 元额度，每人限 1 单，活动入口
  新功能
  - 主窗口与分离出的标签窗口支持窗口置顶 (contributed by @Mo-Moore) (PR #10001)
  - 侧边栏表分组扩展到视图、存储过程、函数、触发器等全部对象容器，均可建组、拖拽和持久化 (contributed by @alex-1263) (PR #9890)
  - SQL 编辑器新增自动换行工具栏按钮，长语句可一键折行显示 (contributed by @caichangqing1120) (PR #9949)
  - 数据网格列筛选面板新增「自动适配列宽」，一键按内容撑开全部列 (PR #9862)
  - MongoDB 查询结果网格支持直接删除选中的文档行 (contributed by @onenewcode) (PR #9951)
  - MongoDB 库表视图的行数与占用大小列在使用 legacy Agent 的连接上也能正常显示 (contributed by @thailoc-dev) (PR #9925)
  - 插件可以把选中数据发送到内置 AI 面板分析，会话保留在面板中可继续追问和导出 (PR #9157)
  - 插件 API 支持在侧边栏表节点上注册自定义右键菜单项 (contributed by @0verme) (PR #9923)
  - Nacos 新增全局内容替换，支持跨 Data ID 预览差异、发布校验与可回滚的批次历史 (contributed by @xiaochouwei) (PR #9328)
  - 数据库导出补充触发器与事件对象 (PR #9930)
  - DDL 生成「去掉存储属性」选项对 Oracle 生效 (PR #9932)
  - SQL 编辑器支持折叠 IN/VALUES 等值列表，并可从行号槽快速执行选中语句 (contributed by @jasonchen8068) (PR #10037)
  改进
  - 打开数据表或执行 SQL 时后台预热会话池，建连接与表结构加载并行，首次加载明显更快，执行摘要也改为上报用户实际等待的耗时 (PR #9623)
  - 表信息 DDL 搜索改为在已渲染内容上打标记，长 DDL 逐字搜索不再反复重新着色 (PR #9926)
  - 大型 SQL 脚本执行不再重复全量扫描语句范围，长脚本执行更流畅
  - SQL 文件执行对话框在进度刷新时缓存预览高亮，长文件执行中界面不再反复重渲染
  - SQL 自动补全的语句块扫描限定在当前活动语句，大脚本中补全不再卡顿
  - 查询结果缓存编码减少重复数据拷贝，大结果集下内存与 CPU 开销更低
  - 提高数据行选中态的颜色对比度，选中单元格边框加深并与主题色对齐 (contributed by @leekeep) (PR #8603)
  修复
  - MySQL 执行 EXECUTE 动态语句的结果集不再被丢弃 (PR #10016)
  - MySQL 存储过程支持手动刷新，保存失败时不再丢失编辑前的原过程 (contributed by @Mo-Moore) (PR #9965)
  - MySQL 表行数统计禁用会话级缓存，对象列表行数恢复后能正常刷新 (PR #9927)
  - MySQL 兼容不支持 utf8mb4 的老服务端，建连不再报 Unknown character set (PR #9929)
  - MySQL 执行 USE 语句后标签页库名跟随会话切换 (PR #9961)
  - MySQL 自动提交标签页新增可选设置，开启后跨次执行保留显式事务，不再静默回滚用户的 START TRANSACTION (PR #9784)
  - MySQL 连接 Gaea 中间件时 group concat 初始化解析失败会自动重试 (contributed by @caichangqing1120) (PR #9999)
  - MySQL 连接 Doris、PolarDB-X 等拒绝 group concat 设置语句时自动降级重试，不再直接连接失败
  - PostgreSQL 同步 DDL 时保留表达式索引完整定义与索引键排序 (PR #10011)
  - PostgreSQL/openGauss 连接保留 Oracle 风格例程体，GaussDB/openGauss A 兼容实例的存储过程不再执行报错 (PR #9928)
  - SQL Server 执行 IF/ELSE 控制流批次不再被拆散，整批保持在同一执行范围 (PR #9758)
  - MongoDB 在使用 legacy Agent 的连接上提供重命名集合操作 (contributed by @thailoc-dev) (PR #9924)
  - 只读连接执行含 REPLACE()/INSERT() 标量函数的查询不再被误判为写操作 (PR #10007)
  - 数字开头的不加引号表名（如 01_table）不再被判为只读，悬停也能正常显示表结构 (PR #10020)
  - 克隆表与粘贴表结构的兜底 DDL 改用布尔假谓词，瀚高、Kingbase 等 PG 系引擎不再建表失败 (PR #10013)
  - 数据传输到 Oracle 语法族目标时文本类型改用 CLOB，Oracle→OceanBase、MySQL→Oracle 建表不再报错 (PR #9933)
  - 数据传输开始确认对话框不再重复显示 MySQL 数据库名 (contributed by @onenewcode) (PR #9969)
  - 数据库导出的元数据预取按会话池实际容量收敛并发，慢链路上不再整表丢失结构 (PR #10029)
  - AI 聊天面板标题与会话重命名保持同步 (contributed by @Abeautifulsnow) (PR #10023)
  - 插件文件句柄改为 UUID 字符串端到端传递，桌面端文件选择与拖拽上传不再报 unknown plugin file handle (contributed by @jinpy666) (PR #9983)
  - 有可用更新时工具栏更新入口保持可见 (PR #9991)
  - 插件更新被连接或操作阻断时显示具体原因 (PR #9987)
  - 重启后待执行的插件更新不再被恢复连接流程阻断 (PR #9958)
  - 组件更新进行期间工具栏不再重新出现更新按钮 (PR #9943)
  - 错误提示不再泄漏内部 Agent 错误载荷，界面报错信息更清晰 (PR #9998)
  - 侧边栏搜索结果不再保留连接下的数据库链接等工具入口，未打开的连接不再误显示为已展开 (contributed by @yaoxinghuo) (PR #10002)
  - 垂直标签栏拖动调整宽度时实时跟随鼠标位置 (contributed by @jeeinn) (PR #10006)
  - 重名标签页的数字编号一次性分配，关闭标签后其余标签不再重新编号 (PR #9953)
  - 数据网格批量编辑输入 NULL 关键字时按 SQL NULL 写入 (contributed by @dienaso) (PR #9995)
  - 数据网格横向滚动时缓冲列不再跳动错位
  - 外观设置切换主题或下拉选项时不再连续卡顿
  - 背景图模式下反色文字保持不透明，弹窗文字不再与背景重合 (PR #9948)
  - MQTT 连接对话框最大报文大小标签完成本地化 (contributed by @Abeautifulsnow) (PR #9947)
  - 修复只读手动事务被空闲回收后误提示「事务已自动回滚」的问题 (contributed by @zipg) (PR #10035)
  - 修复同一查询窗口内多条 INSERT 语句只有第一条显示字段对应提示的问题 (contributed by @zipg) (PR #10039)
  - 修复人大金仓与 MySQL 的 bit 列显示为 0x00 的问题，现按位串展示 (contributed by @zipg) (PR #10042)
  - 修复数据传输到 MySQL 5.7 目标端时因缺少视图依赖支持而失败的问题 (contributed by @zipg) (PR #10038)
