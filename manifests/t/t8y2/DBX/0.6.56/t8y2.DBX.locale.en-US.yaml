ReleaseNotes: |-
  赞助信息
  - Jalapeno Cloud：Step 5 Preview 已上线，10/26–11/2 限时五折，DeepSeek V4 Flash 0731 低至 2 折，GLM-5.3、Step 5 Preview、DeepSeek V4.1 Flash 五折，活动入口
  新功能
  - Oracle 与 OceanBase Oracle 支持 PL/SQL 调试，可设断点、单步执行、查看变量与栈帧、监视表达式并查看调用输出 (contributed by @efeire) (PR #13448)
  - MongoDB 查询页签新增可选的 SQL 模式，把支持的 SQL 子集编译成 shell 命令后执行，并可复制生成的命令 (contributed by @M-Tesla) (PR #11955)
  - 执行 SQL 文件支持按位置引用本地脚本，用 -- @include "shared/seed.sql" 先执行依赖文件，并限制目录范围与嵌套深度 (contributed by @CSXFanMeng) (PR #13432)
  - 数据比对结果支持导出差异到 XLSX，差异表各占一个工作表并附变更明细列 (contributed by @HighBigSky) (PR #13375)
  - 支持从 MySQL 向虚谷建表并传输数据，也可追加或覆盖写入已存在的兼容表 (contributed by @mapan0424) (PR #13486)
  - PostgreSQL bytea 列支持文本预览与单元格内编辑，与 MySQL、Oracle 的二进制列行为一致 (contributed by @lxk955) (PR #13418)
  - 分组后的视图与物化视图支持组内搜索 (contributed by @yiqiui) (PR #13393)
  - 新增设置项，可关闭连接后自动展开对象树，避免元数据对象多的库在连接瞬间卡顿 (contributed by @HighBigSky) (PR #13376)
  - 新增外观设置「字体平滑」，默认关闭并保持现有渲染效果 (contributed by @yiqiui) (PR #13389)
  - 补全列表在按下 Tab 会填充的那一行显示 Tab 键帽提示 (contributed by @hongshuo-wang) (PR #13516)
  改进
  - 退出软件时若有后台任务在运行会先确认，并可选择等待完成或中断任务，数据传输执行日志保留最近 500 行 (contributed by @HighBigSky) (PR #13377)
  - 「复制连接信息」新增「密码（原文）」项，便于把未编码的密码粘到其他软件 (contributed by @jinpy666) (PR #13391)
  - 编辑器会为当前数据库预取补全用的表信息，切换数据库时丢弃过期的补全结果
  - Hive JDBC 更新到 4.2.1 (contributed by @renovate[bot]) (PR #13480)
  - ZooKeeper 更新到 3.9.6 (contributed by @renovate[bot]) (PR #13488)
  - Commons Lang 更新到 3.21.0 (contributed by @renovate[bot]) (PR #13446)
  修复
  - 修复 Oracle 与 OceanBase Oracle 的独立索引 DDL 在明确 schema 下丢失对象身份、触发器存在时生成不完整的问题 (contributed by @efeire) (PR #13442)
  - 修复 Oracle 同名的跨 owner 索引被误判为不存在、以及约束关联索引匹配错误的问题 (contributed by @efeire) (PR #13443)
  - 修复 JDBC 延迟读取的 CLOB 把未知字节数报成固定 64 MiB 的问题 (contributed by @efeire) (PR #13444)
  - 修复执行 SQL 文件时 Oracle 的合并 INSERT 使用了不支持的语法，导致每批失败并逐条重放的问题 (contributed by @hongshuo-wang) (PR #13500)
  - 修复虚谷与虚谷之间传输时 CLOB 空字符串被当成单字节内容、与 SQL NULL 混为一谈的问题 (contributed by @mapan0424) (PR #13518)
  - 修复 GaussDB 传输到同库其他 schema 或同名 schema 时误报目标表已存在、schema 不存在的问题 (contributed by @lxk955) (PR #13397)
  - 修复侧边栏搜索时表过滤条件失效、被过滤的表仍然出现的问题 (contributed by @caiyq925-cell) (PR #13478)
  - 修复搜索连接名后数据库节点无法展开、需要重新加载才恢复的问题 (contributed by @onenewcode) (PR #13477)
  - 修复数据库节点下重复出现表分组目录层级的问题 (contributed by @lxk955) (PR #13400)
  - 修复数据表刷新后索引元数据加载失败时表变为只读、无法新增的问题 (contributed by @thailoc-dev) (PR #13476)
  - 修复带筛选条件时编辑单元格会让视图跳回第一个匹配列的问题 (contributed by @lxk955) (PR #13399)
  - 修复 MySQL 保留字作为列名时自动补全未加反引号、生成无效 SQL 的问题 (contributed by @AndreasK79) (PR #13387)
  - 修复 SQL Server 编辑器中小写关键字在按空格时没有确认补全、未转成大写的问题 (contributed by @lxk955) (PR #13398)
  - 修复会话面板自动刷新在连接或查询失败后仍持续重试的问题 (contributed by @lcq928) (PR #13501)
  - 修复插件连接表单中只含空格的必填密码被当作未填写、保存按钮不可点击的问题 (contributed by @jinpy666) (PR #13507)
  - 修复 OpenCode 2 的模型发现与连接测试因传入不支持的 --verbose 参数而失败的问题 (contributed by @ericbyz) (PR #13457)
  - 修复 Trino 在系统时区为 GMT+08:00 这类自定义偏移时首条查询报时区不支持的错误 (contributed by @ericbyz) (PR #13467)
  - 修复输入法组合被意外中断后编辑器快捷键失效的问题
  - 修复查询返回 0 行后耗时显示与停止按钮消失的问题
  - 修复 SQL 文件面板滚动时吸顶的文件夹标题被树节点覆盖的问题
  - 修复 OceanBase 对象浏览器不显示触发器与事件的问题
  - 修复 Firebird 建表语句中 DEFAULT 排在 NOT NULL 之后导致的语法错误
  - 修复 SQL Server 例程元数据带有分组后缀、影响部分对象显示的问题
  - 修复 MySQL 表刷新后行标识丢失、编辑定位错行的问题
  - 修复 Oscar 表数据分页未使用 LIMIT、大表翻页缓慢的问题
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.56 拉取。
