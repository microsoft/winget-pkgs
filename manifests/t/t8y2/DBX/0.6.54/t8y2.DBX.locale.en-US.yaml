ReleaseNotes: |-
  新功能
  - Oracle / OceanBase Oracle 的 DDL 查看与复制统一为「紧凑 SQL」「存储属性」「独立索引」三种选项，并可单独查看索引 DDL (contributed by @efeire) (PR #13386)
  - Oracle / OceanBase Oracle 结构比较支持 PACKAGE 与 PACKAGE BODY 的规格、包体受控比较与迁移，含依赖顺序、编译错误与执行后的读回校验 (contributed by @efeire) (PR #13326)
  - Redis 危险操作确认框改为提供可直接执行的命令，按原始字节保真转义，集群下按哈希槽分批执行，不再只是文字说明 (contributed by @lxk955) (PR #12917)
  - Kafka 消息浏览器新增从指定时间开始读取，按分区时间戳定位起始偏移 (contributed by @yiqiui) (PR #12501)
  - 消息队列支持解析 Thrift 二进制消息体并展示为可读字段 (contributed by @colabhoangbui2110) (PR #13318)
  - openGauss 支持执行计划按钮，使用纯文本 EXPLAIN 构建计划树 (contributed by @yiqiui) (PR #13342)
  - 数据表格选区统计新增最小值、最大值与去重计数 (contributed by @yiqiui) (PR #13339)
  - TSV 复制支持与 CSV 一致的公式转义、表头位置等选项，并支持名称与描述两行表头 (contributed by @yiqiui) (PR #13346)
  - SQL 占位符支持方括号写法（如 [${name}]），可在变量语法设置中单独开关 (contributed by @HighBigSky) (PR #13378)
  - 设置中可直接调整全局连接超时与查询超时，连接失败提示处提供修改超时的快捷入口 (contributed by @HighBigSky) (PR #13380)
  - 连接深链可选择免确认直接保存，按新建连接与带 id 的更新链接分别设置 (contributed by @javalover123) (PR #13384)
  - SQL 编辑器右键菜单新增复制当前语句，与选中当前语句共用同一范围计算 (contributed by @yiqiui) (PR #13338)
  改进
  - 结果标签栏中点击已固定的结果可直接取消固定，不必再打开右键菜单 (contributed by @yiqiui) (PR #13337)
  - 垂直标签栏配色与顶部栏保持一致，当前标签的选中态更清晰 (contributed by @yiqiui) (PR #13341)
  - 导入进行中的进度显示源文件名，便于确认当前处理的是哪个文件 (contributed by @caiyq925-cell) (PR #13335)
  - 界面文字恢复使用系统原生字体渲染，不再强制灰度抗锯齿
  - 执行 SQL 文件时进度区域自动进入视野，向上滚动后不再抢回滚动位置 (contributed by @Gaiokane) (PR #13379)
  修复
  - 修复切换结果标签导致数据表格重新挂载时，未提交的编辑内容丢失、保存状态不显示的问题
  - 修复 Doris 与 StarRocks 复合 UNIQUE KEY 表无法识别行标识、无法编辑数据的问题 (contributed by @lxk955) (PR #13385)
  - 修复 Doris 与 StarRocks 的 UNIQUE KEY 列被误标为主键，导致建表语句、导出、传输和 ER 图显示错误键信息的问题
  - 修复 PostgreSQL 新建查询时跨 schema 的表未加 schema 限定、可能命中同名表的问题 (contributed by @yiqiui) (PR #13340)
  - 修复 Greenplum 与 Cloudberry 无主键表打开数据页时报无法获取系统列的问题 (contributed by @yiqiui) (PR #13343)
  - 修复 ClickHouse 执行 WITH ... INSERT 语句报错、写入被当作查询处理的问题 (contributed by @lcq928) (PR #13327)
  - 修复 MySQL Preferred TLS 在服务端不支持 TLS 1.2/1.3 时未回退、连接失败且报错难以判断原因的问题 (contributed by @caichangqing1120) (PR #13294)
  - 修复插件分组标签丢失图标和分组名的问题 (contributed by @Ezreal-byte) (PR #13292)
  - 修复列筛选输入以 0 开头的值时被当作数字比较、文本列匹配不到结果的问题 (contributed by @dienaso) (PR #13107)
  - 修复侧边栏表分组中未在当前页加载的分组成员不可见的问题 (contributed by @ordinary-s) (PR #13331)
  - 修复 AI 智能修复 SQL 报错时上下文缺少失败语句本身的问题 (contributed by @ordinary-s) (PR #13333)
  - 修复 Kafka 元数据超时后消费者组列表变空的问题 (contributed by @ordinary-s) (PR #13334)
  - 修复删除连接后保留的数据与结构标签提示找不到连接配置的问题 (contributed by @javalover123) (PR #13356)
  - 修复表结构草稿在元数据刷新失败时被丢弃的问题 (contributed by @efeire) (PR #13345)
  - 修复查询返回超大结果集时传输失败且没有明确提示的问题，并对 LOB 快照改为按需读取 (contributed by @efeire) (PR #13353)
  - 修复插件页签中操作系统拖拽文件时拿不到拖拽位置的问题 (contributed by @lxk955) (PR #13383)
  - 修复插件工具返回值缺少 resultType 字段、新版 MCP 客户端拒绝结果的问题 (contributed by @Rendegou) (PR #13328)
