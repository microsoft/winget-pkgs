ReleaseNotes: |-
  赞助信息
  - Jalapeno Cloud：Step 5 Preview 已上线，10/26–11/2 限时五折，DeepSeek V4 Flash 0731 低至 2 折，GLM-5.3、Step 5 Preview、DeepSeek V4.1 Flash 五折，活动入口
  新功能
  - DynamoDB 支持原生 PartiQL 查询，可选、插、改、删，按 NextToken 分页读取 (contributed by @CSXFanMeng) (PR #13528)
  - 支持导入 Another Redis Desktop Manager 的 .ano 连接配置 (contributed by @CSXFanMeng) (PR #13527)
  - MCP 整合为统一的接入方式、能力与权限管理，提供能力目录、资源分层授权和高危调用确认 (contributed by @eryajf) (PR #12907)
  - 侧边栏搜索新增表名匹配模式选择，可关闭宽松匹配，输入 101 不再匹配 1001 (contributed by @Abeautifulsnow) (PR #13612)
  - SQL 库页签右键菜单新增定位当前文件 (contributed by @lxk955) (PR #13686)
  改进
  - 从选中表打开 ER 图时只加载相关外键闭包，大 schema 下打开速度明显加快 (contributed by @poncosh) (PR #13606)
  - 横向标签分组用淡底聚焦样式区分当前分组，折叠数量徽标更醒目 (contributed by @zipg) (PR #13675)
  - ClickHouse 补全对非 ASCII 与中文标识符自动加反引号，不再生成无效 SQL (contributed by @lxk955) (PR #13688)
  - 转置视图的字段信息列支持拖拽调整宽度 (contributed by @lxk955) (PR #13695)
  - 移除「连接后自动展开对象树」设置项，连接节点改为始终展开，与 v0.6.55 及更早行为一致 (contributed by @zipg) (PR #13614)
  - Snowflake JDBC 驱动更新到 3.28.0 (contributed by @renovate[bot]) (PR #13098)
  - Maven Core 更新到 4.0.0-rc-7 (contributed by @renovate[bot]) (PR #11927)
  - 前端依赖 npm minor/patch 批量更新 (contributed by @renovate[bot]) (PR #13636)
  修复
  - 修复 Windows 7 / Server 2012 R2 的 legacy 离线包点击数据库连接即崩溃的问题，恢复 8 MiB 主线程栈 (contributed by @zipg) (PR #13672)
  - 修复 Oracle 11g 手动事务标签页导出结果为 xlsx 时报不支持流式导出的问题 (contributed by @zipg) (PR #13648)
  - 修复 Oracle 查询含对象类型列（如 SDO_GEOMETRY、ST_GEOMETRY）时驱动 panic、连接不可用的问题 (contributed by @thailoc-dev) (PR #13526)
  - 修复 Oracle 连接失败时发出多条 TCP 连接、触发第三方安全客户端连续弹框的问题 (contributed by @zipg) (PR #13662)
  - 修复 Oracle 读取对象类型列响应解码失败后重试仍报 TTC 错误的问题 (contributed by @jeff377) (PR #13693)
  - 修复通用 JDBC 连接 SQL Server 时 T-SQL 控制流批次仍被按分号拆分、BEGIN TRANSACTION 报错的问题 (contributed by @caiyq925-cell) (PR #13681)
  - 修复带行列限制的 CTE 查询无法按列排序、误报需改为单条 SELECT 的问题 (contributed by @caiyq925-cell) (PR #13690)
  - 修复 openGauss 数据迁移预检失败、classid 类型不匹配的问题 (contributed by @FrankChan8) (PR #13694)
  - 修复达梦把用户写的 LIMIT 当成行数上限、查询结果被截断的问题 (contributed by @yiqiui) (PR #13619)
  - 修复 DuckDB 结果分页与加载全部时出现重复或漏行、排队取消影响其他查询的问题 (contributed by @Acd-kk) (PR #13633)
  - 修复 MySQL bigint 主键与数值列按字符串排序、顺序错误的问题 (contributed by @lxk955) (PR #13691)
  - 修复 PostgreSQL 备份还原后外键缺少 ON DELETE/UPDATE 动作与延迟选项、恢复数据违反外键的问题 (contributed by @lcq928) (PR #13625)
  - 修复 MySQL 外键仅 RESTRICT 与 NO ACTION 差异被误判为变更，以及结构比较在 Web 版读取元数据不稳定的问题 (contributed by @alanslengkoan) (PR #13524)
  - 修复选择「忽略此版本」后更新对话框仍提示该版本可升级的问题 (contributed by @xiaou61) (PR #13643)
  - 修复导入结束后看不到当前源文件、无法确认刚导入哪个文件的问题 (contributed by @xiaou61) (PR #13627)
  - 修复通用 JDBC 连接 MySQL 时导入使用双引号标识符、写入失败的问题 (contributed by @jeff377) (PR #13617)
  - 修复 Windows 上 SSH 隧道的 ProxyCommand 辅助程序反复闪出命令行窗口的问题 (contributed by @xiaou61) (PR #13630)
  - 修复侧边栏长对象名触发横向滚动后搜索控件溢出、被裁切的问题 (contributed by @zipg) (PR #13658)
  - 修复 MCP 安装残留的临时目录与二进制副本长期堆积在 .dbx/bin 的问题 (contributed by @hongshuo-wang) (PR #13019)
  - 修复 Redis 的 SQL 文件页签显示数据库名而非文件名的问题
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.59 拉取。
