ReleaseNotes: |-
  赞助信息
  - 「重生为职场龙傲天之我有半价 buff」：Jalapeno Cloud 半价提供 GLM 5.3 与 DS V4.1 Flash，可叠加多充多送 20% 加赠，活动入口
  新功能
  - 网格导出支持按列格式化输出，导出的 CSV、JSON、XLSX 与表格显示格式一致 (contributed by @lxk955) (PR #11945)
  - 侧边栏新增快捷键（默认 F4）直接打开当前选中对象的表结构编辑器 (contributed by @lxk955) (PR #12037)
  - 表结构编辑器中按 F5 即可刷新当前表结构 (contributed by @kkwangxx) (PR #11858)
  - 标签页支持用 Ctrl/Cmd+Shift+T 或右键菜单重新打开最近关闭的标签页 (contributed by @lxk955) (PR #11651)
  - 数据网格视图选项新增「全局冻结首列」，横向滚动时保持首列固定 (contributed by @eryajf) (PR #11633)
  - 递增 ID 生成支持补零位数、自定义前缀和后缀，并实时预览生成效果 (contributed by @lxk955) (PR #11937)
  - JSON 值编辑器支持节点折叠，折叠箭头改用统一的 SVG 图标，避免在部分字体下显示为空框 (contributed by @lxk955) (PR #11938)
  - 快捷键搜索新增「录制按键」模式，按下组合键即可筛选出绑定该键的操作 (contributed by @Abeautifulsnow) (PR #11949)
  - OceanBase Oracle 模式的 SQL 补全支持建议序列名以及 NEXTVAL/CURRVAL 伪列 (contributed by @lxk955) (PR #12073)
  - SAP HANA 支持表重命名和表结构编辑，包括新增、删除、重命名列和修改列类型、默认值、可空性 (contributed by @zipg) (PR #12036)
  - Redis 值查看器搜索统一高亮和导航，并新增大小写、正则开关以及单项和全部替换 (contributed by @eryajf) (PR #12039)
  - MQTT 消息右键支持复制 Payload、复制 Topic 和删除本地消息记录 (contributed by @ma123456mai) (PR #11988)
  - MQTT 新增/编辑订阅弹框支持按标题栏拖动 (contributed by @ma123456mai) (PR #11942)
  - 设置中显示 WebDAV 最近一次成功同步的时间，按同步目标分别记录 (contributed by @ma123456mai) (PR #12065)
  - AI 设置新增配置导入入口，可通过 CC-SWITCH 插件导入已有 AI 配置 (contributed by @ma123456mai) (PR #9365)
  - 生产环境徽章支持配置显示范围（连接、库/模式或表/对象），侧边栏滚动固定上下文的交接更准确 (contributed by @zipg) (PR #11995)
  改进
  - MongoDB 查询的总数统计与查询本身并发执行，慢查询下总耗时由两者之和降为两者较大值 (contributed by @thailoc-dev) (PR #11978)
  - 横版标签栏只有选中的标签保留连接色底色，开启连接分组后更容易定位当前标签 (contributed by @zipg) (PR #12060)
  修复
  - macOS 应用图标不再跟随应用主题切换，Dock 和 Finder 中保持稳定显示
  - 最大化窗口重启后恢复到原所在的显示器，不再错位到其他屏幕
  - 数据对比结果被截断时不再允许选中执行同步，避免生成不完整的同步 SQL
  - 便携版数据迁移密钥可跨设备保留，换电脑后不再误报数据安全升级
  - Oracle 系语句切分不再在 WITH FUNCTION 内联声明的内部分号处截断，达梦执行此类语句不再报语法错误 (contributed by @yiqiui) (PR #12080)
  - Oracle、OceanBase Oracle、达梦、YashanDB、Oscar 等 Oracle 系方言不再把字符串中的反斜杠当作引号转义，含反斜杠结尾字符串的批次不再被错误拆分 (contributed by @lxk955) (PR #11951)
  - 结果网格选区的 SUM 和 AVG 对 BIGINT、DECIMAL 按精确十进制计算，不再出现末位进位错误 (contributed by @jeff377) (PR #12078)
  - CSV/JSON/XLSX 导出保留 CLOB 列的格式化结果，不再被后端完整原值覆盖 (contributed by @efeire) (PR #12069)
  - Oracle 和 OceanBase Oracle 的 SQL 导出改用原始值构造，BLOB 数据回放不再报 ORA-01465 (contributed by @efeire) (PR #12069)
  - Oracle 和 OceanBase Oracle 表结构编辑不再丢失 FLOAT 二进制精度、NUMBER 精度和负 scale 等数值参数 (contributed by @efeire) (PR #12042)
  - OceanBase Oracle 常规表结构克隆保留主键、索引、默认值、非空和注释，不再退化为 CTAS 丢结构 (contributed by @efeire) (PR #12042)
  - 数据传输到 Oracle 目标复制显式 id 后自动把 identity 序列重置到最大值之后，避免后续自增插入与已复制数据冲突 (contributed by @Tong-bit-art) (PR #12001)
  - Oracle 连接 URL（含密码）复制时密码中的 ^ 等字符保持可读，粘贴到其他软件后凭据一致 (contributed by @zipg) (PR #12020)
  - SAP HANA 执行含过程体的 ALTER/CREATE PROCEDURE、FUNCTION、TRIGGER 不再被内部分号截断报 257 语法错误 (contributed by @zipg) (PR #11997)
  - Trino 查看表 DDL 改用 SHOW CREATE TABLE，不再丢失 WITH 子句中的物理布局定义 (contributed by @hongshuo-wang) (PR #11991)
  - SUNDB 生成的编辑和查询 SQL 不再给简单标识符加双引号，编辑数据保存不再报表或视图不存在 (contributed by @hongshuo-wang) (PR #12002)
  - GaussDB M 模式下统计总行数不再因派生表别名被双引号包裹而报语法错误 (contributed by @AndrewDi) (PR #12040)
  - 达梦账号缺少 DBMS_OUTPUT 权限时自动降级跳过初始化，不再阻断用户自己的 CALL/BEGIN/EXEC 语句 (contributed by @hongshuo-wang) (PR #11959)
  - 用 Neo4j 连接类型可直连单实例 Memgraph，且不再向其发送不支持的默认库名 (contributed by @hongshuo-wang) (PR #11975)
  - Excel/CSV 导入数字类型列时接受带千分位的数值如 123,456，文本列保持原样 (contributed by @hongshuo-wang) (PR #11999)
  - MongoDB 集合网格编辑 Int32 和 Double 字段不再被保存成 Int64，类型保持不变 (contributed by @thailoc-dev) (PR #11950)
  - SSH 隧道密钥认证未填路径时自动按 OpenSSH 默认顺序回落到本机默认私钥 (contributed by @hongshuo-wang) (PR #11965)
  - Oracle 系方言中 @dblink 链接不再被误识别为绑定参数或被同名变量替换 (contributed by @efeire) (PR #11780)
  - 手工事务提交不再重复请求同一事务，批量执行补齐超时传递、取消跟踪和回滚后的连接回收 (contributed by @efeire) (PR #11780)
  - 前一条 SQL 缺少分号时自定义代码片段也能正常弹出补全菜单 (contributed by @lxk955) (PR #11936)
  - 按 F7 不再触发浏览器自带的光标浏览确认弹窗，并在编辑器设置中新增光标浏览开关 (contributed by @lxk955) (PR #11934)
  - 列查找面板打开期间保留搜索词和匹配列表，连续跳转列不再重复输入 (contributed by @eryajf) (PR #12035)
  - 右键菜单的复制和导出子菜单项继承父项图标，不再出现空白图标槽 (contributed by @zipg) (PR #11867)
  - 查询区域高度较小时生产水印自适应切换为单行或单个显示，不再文字重叠 (contributed by @zipg) (PR #12047)
  - MQTT 消息列表改为独立卡片展示并增加间距，时间戳统一为本地 YYYY-MM-DD HH:mm:ss 格式 (contributed by @ma123456mai) (PR #11984)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.43 拉取。
