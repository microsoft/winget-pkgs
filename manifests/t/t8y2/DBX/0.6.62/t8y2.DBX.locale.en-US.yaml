ReleaseNotes: |-
  新功能
  - 连接参数新增可视化编辑器：独立弹窗内搜索、编辑参数并查看说明，支持重复参数、原始文本模式和敏感值隐藏，通用 JDBC 连接可读取驱动属性元数据 (contributed by @zipg) (PR #13892)
  - MySQL 数据导出新增「省略表名中的数据库前缀」选项，INSERT 语句中的表名不再携带 db. 前缀 (contributed by @yiqiui) (PR #13601)
  改进
  - Elasticsearch/EasySearch 的 REST 请求体支持 JSON 语言，提供语法高亮、嵌套折叠和语法诊断，执行内容保持不变 (contributed by @OOMEcho) (PR #10749)
  - 数据网格底栏的选中统计精简为单项指标（默认求和），其余指标收进弹出面板，所选指标自动记住并在重启后沿用 (contributed by @zipg) (PR #13951)
  - 更新被配置弹窗阻止时明确指出需要关闭的对话框名称（包括弹窗位于其他窗口的情况），不再显示笼统的「请先完成当前配置编辑」 (contributed by @zipg) (PR #13907)
  - PostgreSQL 原生查询错误信息附带 SQLSTATE 错误码，便于对照定位问题 (contributed by @imcman) (PR #13922)
  - 选择自定义或系统 Java 时，驱动管理对话框隐藏 Dbx 托管的 JRE 运行时列表，避免展示与当前选择矛盾的条目 (contributed by @yiqiui) (PR #13949)
  - 侧边栏搜索结果不再显示原生作业和用户权限管理等管理入口节点 (contributed by @yaoxinghuo) (PR #13916)
  修复
  - 修复 JDBC 分页查询收尾时回滚 DROP TABLE、CREATE TABLE AS 等语句的问题，此前显示执行成功但改动实际未生效 (contributed by @dienaso) (PR #13709)
  - 修复已知总行数大于已加载行数时首屏被误判为完整结果、「导出全部数据」只导出已加载页的问题 (contributed by @misxzaiz) (PR #13878)
  - 修复 Windows ARM64 版打开查询页即因主线程栈溢出闪退（0xC00000FD）的问题 (contributed by @Acd-kk) (PR #13918)
  - 修复 MySQL 导入 SQL 文件时文件内 SET NAMES utf8 将连接切换为三字节字符集、中文和 emoji 写入报 ERROR 1366 或变成 ???? 的问题 (contributed by @MomentarySixthSense) (PR #13946)
  - 修复 MySQL 分区表生成数据时产生不属于任何分区的值、插入报 ERROR 1526 的问题 (contributed by @zipg) (PR #13910)
  - 修复 MySQL 等无 schema 数据库在生成数据的外键参数中表和列下拉列表为空的问题 (contributed by @yiqiui) (PR #13948)
  - 修复 Oracle US7ASCII 数据库中按 GBK 等历史编码存储的中文读取为 ???? 的问题，新增连接级遗留编码兼容选项 (contributed by @zipg) (PR #13799)
  - 修复 Oracle 未安装 Spatial 组件时查询 SDO_GEOMETRY 表报 ORA-04067 的问题，改为以占位符读取几何列 (contributed by @jeff377) (PR #13919)
  - 修复 Oracle 通过数据库链接（TABLE@LINK 及指向链接的同义词）查看表结构不显示列信息的问题 (contributed by @jeff377) (PR #13758)
  - 修复 openGauss MySQL 兼容模式无法查看表索引的问题，限定名改用 textcat 拼接以兼容未开启 pipes_as_concat 的实例 (contributed by @thailoc-dev) (PR #13932)
  - 修复 Spanner SEARCH 全文索引被渲染为 UNIQUE INDEX、生成 DDL 无法执行的问题 (contributed by @dienaso) (PR #13931)
  - 修复达梦克隆表时确认的目标表名被强制转为大写的问题 (contributed by @zipg) (PR #13909)
  - 修复表名为 apply 时被误当作 APPLY 表运算符、FROM apply 之后不再提示 WHERE 等子句关键字的问题 (contributed by @ericbyz) (PR #13889)
  - 修复 JDBC 别名补全丢失表 schema、从错误的 schema 加载列的问题 (contributed by @zipg) (PR #13861)
  - 修复 MCP 严格客户端因 Nacos 注册实例 metadata 以布尔 schema 发布而拒绝整个 tools/list 响应的问题 (contributed by @lcq928) (PR #13893)
  - 修复 AI 插件工具待审批卡片被长回复滚出视野、找不到批准入口的问题，审批卡固定在输入框上方并在取消请求时同步清理 (contributed by @imcman) (PR #13905)
  - 修复选中多条 SQL 执行后手动事务等无语句编号的结果不显示成功或失败标识的问题 (contributed by @Acd-kk) (PR #13913)
  - 修复仅调整排版的内置 SQL 片段不再按当前数据库方言转换、SQL Server 下仍插入 LIMIT 语法的问题 (contributed by @seaways1015-afk) (PR #13936)
  - 修复侧边栏搜索结果中的表首次展开无反应、下级对象不显示的问题 (contributed by @yiqiui) (PR #13953)
  - 修复编辑或查看 Redis 连接时切换页签界面卡死的问题 (contributed by @onenewcode) (PR #13863)
  - 修复 Redis 键列表后台补全类型和过期信息失败导致进行中的扫描中止的问题 (contributed by @Gaiokane) (PR #13868)
  - 修复设置页无待保存改动时「应用并关闭」按钮置灰、看似无法关闭的问题 (contributed by @yiqiui) (PR #13950)
  - 修复 PostGIS 空间字段提示文案换行导致表结构编辑器排版错位的问题 (contributed by @thailoc-dev) (PR #13864)
ReleaseNotesUrl: https://github.com/t8y2/dbx/releases/tag/v0.6.62
