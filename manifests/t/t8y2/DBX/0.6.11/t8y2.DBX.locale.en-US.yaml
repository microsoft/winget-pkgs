ReleaseNotes: |-
  新功能
  - MySQL 备份恢复新增「指定表」模式，恢复 SQL 备份文件时可搜索并勾选要恢复的表，仅执行选中表的结构、索引与数据。(contributed by @CSXFanMeng) (PR #8894)
  - 表结构编辑器为 PostgreSQL 系列数据库的 geometry/geography 列新增几何子类型下拉与 SRID 输入，直接生成 geometry(Point,4326) 形式的列定义。(contributed by @Tara8573) (PR #8841)
  - 侧边栏连接与数据库节点右键菜单新增「复制连接信息」，支持按连接 URL、JDBC URL、DSN、psql 命令等多种格式直接复制。(contributed by @zouchao) (PR #8731)
  - 数据库导出与表 SQL 导出支持按大小分卷并打包为 ZIP，避免生成单个过大的 SQL 文件且不会截断语句。(contributed by @hanhvs) (PR #8808)
  - Redis 键浏览器新增搜索历史，方便快速重复查找键名。(contributed by @jeeinn) (PR #8838)
  - 侧边栏数据表节点现在显示字段、索引、外键、触发器等元数据分组的实际数量。(contributed by @tdog54646) (PR #8607)
  - Elasticsearch / Easysearch 索引的别名显示在原名同一行，可直接按别名搜索并打开索引。(contributed by @onenewcode) (PR #8837)
  - 数据网格单元格详情新增转换预览，支持时间戳、JSON/XML 格式化、Base64 与 URL 编解码及整数进制转换，可单独复制且不改写原值。(contributed by @eryajf) (PR #8783)
  - SQL 编辑器新增表别名及其引用位置的高亮。(contributed by @eryajf) (PR #8796)
  - 数据网格筛选支持只应用单条结构化筛选条件，无需先凑齐完整条件组。(contributed by @eryajf) (PR #8800)
  改进
  - 优化标签栏分组定位、分组色条与数据库对象图标的显示效果。(contributed by @zipg) (PR #8856)
  - 表结构编辑器触发器页签改为「列表 + 详情」布局，触发器较多时无需长距离滚动即可定位和编辑。(contributed by @CHNHJF) (PR #8862)
  - 大表数据传输的超时改为进度感知的空闲预算，keyset 分页扩展到 MySQL、SQLite、SQL Server 家族，持续流式读取的大表不再被总时长超时中断，并修复大 batch 被截断的问题。(contributed by @HolyeTyrone) (PR #8824)
  - 切换查询标签页时保留最近使用的标签页界面缓存，来回切换不再重新挂载编辑器，更快且保留浏览状态。
  修复
  - 修复按下含 Shift 的标点组合键时快捷键按位移后的字符记录的问题，现统一按未位移的基础键记录。(contributed by @thanadon-dev) (PR #8892)
  - 修复按 Escape 关闭补全后代码片段占位符导航丢失的问题。(contributed by @eryajf) (PR #8895)
  - 修复 Kafka 订阅管理中重置游标失败后错误信息覆盖订阅列表、以及关闭弹窗后旧请求影响新订阅上下文的问题。(contributed by @eryajf) (PR #8898)
  - MongoDB 补全支持在 $in 等数组内建议扩展 JSON 值。(contributed by @thailoc-dev) (PR #8876)
  - MongoDB 补全不再把 $date 等扩展 JSON 包装键误识别为字段建议。(contributed by @thailoc-dev) (PR #8821)
  - MongoDB 查询与筛选支持 UUID、BinData、Timestamp、MinKey、MaxKey 等 shell 字面量。(contributed by @thailoc-dev) (PR #8861)
  - MongoDB shell 命令支持 db["collection"] 方括号写法访问集合。(contributed by @thailoc-dev) (PR #8805)
  - 修复切换标签页后过期的格式化/压缩请求被重放到新编辑器的问题。(contributed by @Abeautifulsnow) (PR #8881)
  - 修复 GBase 8s MySQL 兼容模式下 bigint unsigned 等列类型识别错误的问题，并升级内置 JDBC 驱动。(contributed by @New2Niu) (PR #8875)
  - AI 助手对服务商临时性故障增加自动重试，并提供失败原因的诊断信息。(contributed by @Abeautifulsnow) (PR #8871)
  - 修复 AI 回复中内联围栏代码块不渲染的问题。(contributed by @Eve-z1) (PR #8840)
  - 修复 MCP 数据库范围中手动添加的数据库条目保存后丢失或不可见的问题。(contributed by @Conastin) (PR #8849)
  - MCP 选定数据库范围下允许执行 PL/SQL 匿名块。(contributed by @Conastin) (PR #8850)
  - 修复 MCP 数据库范围选择器未连接实例就列举数据库导致失败的问题，现在会先建立连接。(contributed by @Conastin) (PR #8848)
  - 修复 SQL Server 2000 连接不稳定与字段注释缺失的问题，legacy Agent 禁用 JDBC 连接池并改从 sysproperties 读取注释。(contributed by @zipg) (PR #8868)
  - 修复 SQL Server 行数据中 varchar 字节不符合排序规则导致数据不可读的问题，解码失败的值现在保持可见。(contributed by @thanadon-dev) (PR #8823)
  - 修复数据网格可视化筛选条件在重启后丢失的问题。(contributed by @onenewcode) (PR #8845)
  - KV 与 etcd 键浏览器的错误提示不再暴露内部 Agent 错误数据。(contributed by @thanadon-dev) (PR #8865)
  - 修复超长单元格值在详情编辑器中显示为空的问题。(contributed by @0verme) (PR #8784)
  - 修复连接旧版 SSH 服务器时无法协商 SHA-1 group exchange 算法导致隧道失败的问题。(contributed by @thanadon-dev) (PR #8780)
  - Doris 补全与高亮支持 MATERIALIZED 关键字。(contributed by @CHNHJF) (PR #8814)
  - 修复自定义 SQL 片段在部分场景不出现在补全列表中的问题。(contributed by @Eve-z1) (PR #8832)
  - 修复 Redis Cluster（代理）环境对 Hash 字段 TTL 命令不支持时报错的问题，现在会自动容忍该限制。(contributed by @zipg) (PR #8782)
  - 补充「检查更新」状态缺失的多语言提示文案。(contributed by @eryajf) (PR #8825)
  - 修复 MySQL 表结构中 DEFAULT_GENERATED 默认值表达式列无法复制的问题。(contributed by @eryajf) (PR #8790)
  - 修复 openGauss 数据传输未走 PostgreSQL 方言路径导致批量建表失败的问题。(contributed by @zccat) (PR #8689)
  - 修复 Redis 发布订阅面板切换或关闭后挂起连接未释放的问题，退出时现在会彻底关闭连接。
  - 优化查询结果的导航切换与编辑器滚动性能。(contributed by @eryajf) (PR #8779)
  安装
  - 修复 Linux AppImage 包内图标符号链接失效的问题。(contributed by @eryajf) (PR #8788)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.11 拉取。
