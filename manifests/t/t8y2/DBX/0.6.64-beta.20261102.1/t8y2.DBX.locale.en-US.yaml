ReleaseNotes: |-
  新功能
  - 新增 Beta 与稳定版双更新渠道：可选择接收每日构建的 Beta 预览版更新，验证通过的 Beta 会晋升为稳定版 (contributed by @eryajf) (PR #13821)
  - 侧边栏折叠后，鼠标停留在窗口左边缘即可临时展开浮层，移开后自动收起，保留原有搜索和树节点状态 (contributed by @r9yn) (PR #14040)
  - MQTT 已保存的主题订阅支持设置别名，列表同时显示别名和原始 Topic，并可按别名搜索 (contributed by @imcman) (PR #13818)
  - 侧边栏搜索新增「精确匹配对象名」可选项 (contributed by @imcman) (PR #13884)
  改进
  - 超过 2 MB 的大 SQL 文档改用流式分词器高亮，并按语句逐条解析，保留代码块折叠和表名着色
  - 降低编辑器输入、大表列表侧边栏（搜索、过滤、加载更多、固定项）和数据网格表头的渲染开销，大文档和大表列表下更流畅
  - 缩小启动包体积：CodeMirror、shiki 和较重的对话框改为按需加载
  - 更新日志按版本懒加载，不再一次拉取完整列表
  - 导入的 SQL 文件不是单表脚本时，导入对话框提供转到 SQL 文件执行器的入口
  - 插件被判定为不兼容时，插件详情会列出具体的兼容性检查错误，不再只显示「已阻止」 (contributed by @eryajf) (PR #14060)
  - Windows 缺少或损坏 WebView2 运行时的启动提示，改为打开官网下载页，不再指向固定的安装包链接
  修复
  - 修复 Beta 或晋升自 Beta 的版本中，所有插件因 DBX 版本要求检查失败而被阻止、无法打开的问题 (contributed by @eryajf) (PR #14060)
  - 修复 Docker/Web 版同时打开第三个插件工作台后，插件调用一直挂起的问题 (contributed by @thailoc-dev) (PR #14045)
  - 修复外部工具修改表结构后，表属性和 DDL 页仍显示旧定义的问题，且不会覆盖尚未保存的草稿 (contributed by @lcq928) (PR #14016)
  - 修复 DOM 数据网格中，搜索命中的行离开可视区域时不会滚动到该行的问题 (contributed by @thailoc-dev) (PR #14028)
  - 修复 MySQL ALTER TABLE ... COMMENT 语句被误报语法诊断的问题 (contributed by @imcman) (PR #13961)
  - 修复保存表结构后侧边栏中的列信息没有刷新的问题 (contributed by @heeeex100) (PR #13850)
  - 修复粘贴的连接 URL 中含有 # 的密码或库名被截断、其后内容被静默丢弃的问题
  - 修复数据传输在开始处理第一张表之前取消响应迟缓的问题
  - 修复 SQL 压缩和 JSON 格式化在大输入下耗时过长的问题
  - 修复 AI 输入框上下文控件换行时图标被挤压的问题 (contributed by @khalil-shao) (PR #13957)
