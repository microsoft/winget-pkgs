ReleaseNotes: |-
  新功能
  - 新增插件框架，支持在应用内加载和管理插件，并提供配套的插件开发与发布流程 (PR #8963)
  - 插件支持在清单中声明自定义图标，并显示在标签页和目录树中
  - MongoDB 支持 Compass 风格的集合数据导入与导出 (contributed by @onenewcode) (PR #8938)
  - Zookeeper 支持 TLS 加密连接 (contributed by @yimiaoxiehou) (PR #8977)
  - Oracle 支持 DBLink 的 SQL 补全、连接树展示与管理 (contributed by @zipg) (PR #8945)
  - 新增 Doris/SelectDB 的 SQL 补全与语义诊断 (contributed by @zipg) (PR #8902)
  - 数据库对比支持同构库之间的存储过程/函数结构对比 (contributed by @Mo-Moore) (PR #8873)
  - Redis 支持批量设置 Key 过期时间 (contributed by @0verme) (PR #8906)
  - SQLite 表结构编辑器支持配置自增主键 (contributed by @eryajf) (PR #8949)
  - 数据网格新增空白字符可视化显示开关 (contributed by @eryajf) (PR #8890)
  - 统一标签组织入口并优化折叠侧栏的自适应显示 (contributed by @eryajf) (PR #8924)
  - 界面缩放时展示当前缩放比例提示，并将最小缩放降至 70% (contributed by @eryajf) (PR #8925)
  - 瀚高（HighGo）数据库现已支持数据传输 (contributed by @0verme) (PR #8952)
  - AI 供应商新增智谱 GLM 预设 (contributed by @CHNHJF) (PR #8905)
  改进
  - 改进关于页面的支持信息与调试日志布局 (contributed by @zipg) (PR #8900)
  修复
  - 修复 HAVING 子句无法引用查询列别名的问题 (contributed by @dienaso) (PR #8953)
  - 修复部分数据库上 HAVING 别名被误解析的问题，现按方言限制别名可见范围 (contributed by @dienaso) (PR #8988)
  - 修复 MySQL 中 GET DIAGNOSTICS 目标变量被误解析的问题 (contributed by @thanadon-dev) (PR #8934)
  - 修复 SQL Server 克隆表时未重建主键的问题 (contributed by @dienaso) (PR #8954)
  - 修复 SQL Server 克隆表主键约束名过长或重复的问题 (contributed by @dienaso) (PR #8989)
  - 修复 SQL Server 执行 FOR JSON 查询被分页改写导致失败的问题 (contributed by @zipg) (PR #8980)
  - 修复 SQL Server 覆盖传输时自增列写入失败的问题 (contributed by @zipg) (PR #8911)
  - 修复选择 Schema 后 SQL Server 未限定表名导致执行失败的问题 (contributed by @zipg) (PR #8951)
  - 修复达梦数据编辑时反斜杠被重复转义的问题 (contributed by @zipg) (PR #8972)
  - 修复 PostgreSQL 时间值未按会话时区显示的问题 (contributed by @0verme) (PR #8968)
  - 修复 PostgreSQL 关闭连接后默认库连接池未释放的问题 (contributed by @zipg) (PR #8978)
  - 修复 PostgreSQL 表数据预览失败的问题，现自动回退重试 (contributed by @PanSHIgg) (PR #8967)
  - 修复 PostgreSQL 传输时丢失分区约束的问题 (contributed by @zipg) (PR #8908)
  - 修复 PostgreSQL 自增序列被重复创建的问题 (contributed by @zipg) (PR #8909)
  - 修复 MongoDB 单元格 NULL 显示与内联编辑的问题 (contributed by @zipg) (PR #8955)
  - 修复 MongoDB 标签切换后本地列筛选条件丢失的问题 (contributed by @zipg) (PR #8891)
  - 修复 Oracle 11g 视图分页首屏性能与排序问题 (contributed by @zipg) (PR #8961)
  - 修复 Oracle 架构比较生成错误的删除索引语句的问题 (contributed by @zipg) (PR #8910)
  - 修复 Kingbase 数据传输时扫描不支持的模式对象的问题 (contributed by @zipg) (PR #8907)
  - 修复工具栏执行未使用手动选中 SQL 的问题 (contributed by @0verme) (PR #8960)
  - 修复未绑定事务模式的标签页未应用默认事务模式的问题 (contributed by @dienaso) (PR #8957)
  - 修复 SQL 解析完成前表名高亮丢失的问题 (contributed by @dienaso) (PR #8959)
  - 修复 SQL 编辑器表名高亮丢失的问题 (contributed by @zipg) (PR #8944)
  - 修复 SQL 编辑器标签切换后滚动位置丢失的问题 (contributed by @zipg) (PR #8943)
  - 修复 SQL 编辑器横向滚动条过粗的问题 (contributed by @zipg) (PR #8941)
  - 修复 Vim 模式方向键移动卡顿的问题 (contributed by @zipg) (PR #8904)
  - 修复带时区的 Now 默认值在数据网格中不同步的问题
  - 修复 NULL 单元格弱化显示不一致的问题，现统一不按类型着色 (contributed by @zipg) (PR #8958)
  - 修复对象列表纵向滚动条超出视口以及悬停时缺少横向滚动条的问题 (contributed by @dienaso) (PR #8903)
  - 修复侧边栏搜索索引在表树刷新前构建导致结果过期的问题 (contributed by @eryajf) (PR #8974)
  - 修复本地表搜索结果置顶状态在索引重建后丢失的问题 (contributed by @eryajf) (PR #8970)
  - 统一插件等特殊标签页的激活高亮样式
  - 修复插件标签页关闭异常并消除加载时的闪烁
  - 修复恢复的插件标签页立即自动加载的问题，现改为手动刷新后再加载
  - 修复插件市场卡片网格布局丢失的问题
  - 修复 Linux 下深链接与打开文件无法传递到应用的问题 (contributed by @anandghegde) (PR #8976)
  - 修复 Windows 下复制 SQL 未使用 CRLF 换行的问题 (contributed by @thanadon-dev) (PR #8986)
  - 修复 CSV 导出写入的强制文本标记导致文件无法重新导入的问题 (contributed by @thanadon-dev) (PR #8914)
  - 修复时间字段经 CSV 导出后无法重新导入的问题 (contributed by @zipg) (PR #8912)
  - 修复 MCP 旧客户端执行多语句脚本失败的问题 (contributed by @zipg) (PR #8975)
  - 修复清空积压失败时错误未显示在确认弹框中的问题 (contributed by @0verme) (PR #8928)
  - 修复重新打开表结构时使用过期缓存元数据的问题 (contributed by @PanSHIgg) (PR #8922)
