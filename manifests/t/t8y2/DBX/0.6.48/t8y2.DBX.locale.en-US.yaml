ReleaseNotes: |-
  新功能
  - 大表预览支持按页加载完整文本，顶部提示条可一键展开当前页被截断的长文本单元格 (contributed by @zipg) (PR #12599)
  - 插件新增连接枚举能力，声明 host.connections:read 权限后可获取不含主机名、账号等敏感信息的连接列表 (contributed by @lxk955) (PR #12610)
  - 插件工作台可读取和更新自身标签页标题 (contributed by @lxk955) (PR #12607)
  - 编辑器新增 Neo4j Cypher 原生语法补全 (contributed by @HandSonic) (PR #12618)
  - 编辑器新增 NebulaGraph nGQL 原生语法补全 (contributed by @HandSonic) (PR #12619)
  - AI 生成 SQL 的应用目标编辑器可配置，支持当前标签页、首个匹配标签页或每次新建标签页 (contributed by @lxk955) (PR #12569)
  - AI 模型选择器中手动输入的模型可删除，默认项和自动发现的模型保持受保护 (contributed by @lxk955) (PR #12566)
  - 数据网格的列元数据显示位置可配置，选中列信息可放在底部状态区，转置表和查询结果可用独立信息列显示类型、可空性和注释 (contributed by @onceMisery) (PR #12495)
  - 全局文件内容搜索支持预览、复制和就地编辑匹配文件，SQL 文件列表新增定位当前文件 (contributed by @wushuang3625) (PR #12088)
  - 单元格详情面板支持按 Escape 关闭 (contributed by @eryajf) (PR #11639)
  - 新增波兰语（pl-PL）界面语言 (contributed by @Akuczaku) (PR #11726)
  改进
  - 更新中心批量升级驱动时恢复显示单个驱动的下载进度和批量完成计数 (contributed by @lxk955) (PR #12620)
  - 结构面板中的索引草稿按关键列列表排序 (contributed by @Xcylway) (PR #12551)
  修复
  - 保存后再次编辑大值单元格不再基于截断副本提交，MySQL、PostgreSQL、DB2 长文本和 JSON 不会被截断写回 (contributed by @thailoc-dev) (PR #12574)
  - 输入法组合输入期间不再提交或取消单元格编辑 (contributed by @zipg) (PR #12627)
  - 悬停查看列内容时的搜索不再造成界面卡顿 (contributed by @lxk955) (PR #12611)
  - UI 缩放比例下网格画布不再模糊 (contributed by @lxk955) (PR #12616)
  - SQL 文件保存成功后显示完成提示并自动关闭对话框 (contributed by @lxk955) (PR #12612)
  - 网格高亮的滚动条补偿与自动换行对齐保持同步 (contributed by @lxk955) (PR #12621)
  - 未进入编辑状态时按 Delete/Backspace 清空选中单元格而不是删除整行 (contributed by @lxk955) (PR #12622)
  - 网格快照导出不再裁剪最后一行 (contributed by @lxk955) (PR #12567)
  - 本地回环 AI 请求绕过环境变量和系统代理直连，并正确识别 [::1] 等 IPv6 回环地址 (contributed by @Rendegou) (PR #12572)
  - 输出视图因执行中的服务器消息切到消息页后，查询产出结果集时自动切回结果页 (contributed by @lxk955) (PR #11832)
  - SQL 补全补充 timestamptz 等 PostgreSQL 数据类型 (contributed by @lxk955) (PR #12570)
  - SELECT 字段行尾注释保持在字段同一行 (contributed by @zipg) (PR #12624)
  - GNOME 桌面默认启用浮动窗口透明边框，恢复圆角、阴影和调整手柄，其他桌面保持不透明窗口 (contributed by @cseda-gullivernet) (PR #11847)
  - Cmd+P 搜索插件连接后回车或点击可正常打开对应页面 (contributed by @eryajf) (PR #11924)
  - MySQL 结构传输新增替换已有对象模式，可更新目标端同名视图、存储过程、函数、触发器和事件 (contributed by @onenewcode) (PR #12609)
  - 数据传输把显式自增列保留为 PostgreSQL IDENTITY，不再丢失自增定义 (contributed by @Tong-bit-art) (PR #11992)
  - GaussDB 作为传输源时复用的表 DDL 按语句拆分执行，建表不再报 cannot insert multiple commands into a prepared statement (contributed by @dienaso) (PR #12589)
  - Vastbase 连接的 current_schema() 返回空时连接信息调用不再失败，MySQL 兼容模式下不再生成非法 SQL (contributed by @zhukj125) (PR #12590)
  - Kingbase 连接的 current_schema() 返回空时连接信息调用不再失败 (contributed by @zhukj125) (PR #12584)
  - Kingbase 导出对话框支持选择并导出视图、序列、存储过程和函数等非表对象 (contributed by @lxk955) (PR #12577)
  - GBase 8s 列默认值和表 DDL 清理系统表填充的 NUL 字符，编辑器不再显示 [NUL] 标记 (contributed by @lxk955) (PR #12580)
  - Doris 和 StarRocks 唯一键模型的表导入支持更新已有行选项 (contributed by @lxk955) (PR #12562)
  - GoldenDB 查询执行优先使用服务器端分页，不再对分布式分片发起全表扫描 (contributed by @lxk955) (PR #12564)
  - GoldenDB 结果列重名时排序改为原位 ORDER BY 改写，不再触发 1060 重复列名错误 (contributed by @lxk955) (PR #12579)
  - 达梦 TIMESTAMP/TIME 列恢复精度显示 (contributed by @zipg) (PR #12623)
  - 达梦字段重命名改用 ALTER COLUMN ... RENAME TO 语句 (contributed by @zipg) (PR #12625)
  - Redis 字符串预览的 GETRANGE 请求分段不超过 64 KiB，TongRDS 等实施跨度限制的服务器上大值预览不再报错 (contributed by @Tong-bit-art) (PR #11797)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.48 拉取。
