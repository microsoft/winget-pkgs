ReleaseNotes: |-
  新功能
  - Kafka 连接在 SSL / SASL_SSL 下支持 TLS 客户端证书认证，可填写客户端证书与私钥的 PEM 路径 (contributed by @pengwow) (PR #13894)
  - MQ 消息浏览和订阅预览新增「解码」开关，勾选后尝试解析 Thrift 二进制载荷，默认显示原始内容 (contributed by @colabhoangbui2110) (PR #13745)
  - 设置中的代码片段列表支持多选、批量删除、搜索过滤和 Shift 连选 (contributed by @AndreasK79) (PR #13885)
  - SQL 编辑器支持行书签，用 Ctrl/Cmd+F2 或点击行号左侧书签栏切换，F2 / Shift+F2 在书签间跳转 (contributed by @PanSHIgg) (PR #13057)
  - SQL 文件面板中的非 SQL 文件改用系统默认应用打开，不再按 SQL 脚本读取 (contributed by @lxk955) (PR #12769)
  - 导出菜单新增把本次全部结果集堆叠进单个 XLSX 工作表的动作，每个结果块依次输出标题行、列头行和数据行 (contributed by @HighBigSky) (PR #13372)
  - Oracle JDBC 连接支持进程列表 (contributed by @lxk955) (PR #13711)
  - 侧边栏连接名后可显示「服务器:端口@账号」小字，便于区分多服务器、多账号连接，默认关闭 (contributed by @caiyq925-cell) (PR #13321)
  - 新增「聚焦结果表格」和「聚焦 SQL 编辑器」两个可配置快捷键，可纯键盘完成查询、查看和复制结果 (contributed by @Acd-kk) (PR #14013)
  - 数据表格「视图选项」新增默认导出方式和隐藏工具栏文字开关，默认导出方式同时作用于侧边栏、对象浏览器和数据库导出 (contributed by @efeire) (PR #13854)
  - MCP 服务器设置新增 Google Antigravity 客户端配置模板 (contributed by @wnyr) (PR #13975)
  - 设置 → 外观新增「标签双击行为」，可选择重命名标签或关闭标签 (contributed by @eryajf) (PR #13357)
  - 文档浏览器的筛选栏新增停用开关，可临时忽略筛选条件而不清空已填写的条件 (contributed by @spiritlord) (PR #13812)
  - 设置 → 编辑器新增「批量插入字段时包含注释」开关，关闭后批量勾选字段不再附带注释 (contributed by @JASON-QWeb) (PR #14046)
  - 存储过程与函数编辑支持保存前预览本次更新将生成的 SQL (contributed by @CSXFanMeng) (PR #14088)
  - MongoDB 查询编辑器支持运行 shell JavaScript 脚本，循环、变量和辅助函数可围绕 db 调用执行 (contributed by @thailoc-dev) (PR #11128)
  - 插件新增 window.dbxPlugin.openUrl，经宿主确认后可打开插件声明过的外部网址 (contributed by @CSXFanMeng) (PR #14089)
  改进
  - 整行选中使用更深的颜色，与单元格选区覆盖的浅色提示区分开 (contributed by @mr-dadong) (PR #7571)
  - 开启连接分组显示后，查询页的分组路径保留首尾分组并按剩余空间截断，连接详情浮窗也更紧凑 (contributed by @hanxuanyu) (PR #13497)
  - 「导出数据库」默认显示在数据库、Schema、表和视图的一级右键菜单 (contributed by @zipg) (PR #14112)
  - 表结构编辑器的「复制其他表字段」补上 Ctrl/Cmd+Shift+C 快捷键 (contributed by @dd-xiaozhi) (PR #13924)
  - SQL 结果列头的悬停提示显示该列来源的限定列名，例如 public.users.email (contributed by @xiaou61) (PR #14066)
  - 结果表格分页区在已知总页数时显示「共 X 页」，切换每页行数后同步更新 (contributed by @imcman) (PR #13865)
  - 结果状态栏同时显示查询返回的列数 (contributed by @heeeex100) (PR #14100)
  - Deepin 25 在 UI 缩放下 Canvas 结果文字不再模糊 (contributed by @arnann) (PR #11961)
  - 连接行的 PROD 标记与备注重新对齐 (contributed by @MingZhe1008) (PR #13838)
  修复
  - 修复只读连接误拒 SET @var、SET NAMES、SET search_path 等安全会话变量语句的问题 (contributed by @lxk955) (PR #12768)
  - 修复 PostgreSQL 数据库 SQL 导出丢失 PostGIS 空间值 SRID 和维度的问题 (contributed by @CN-Scars) (PR #13914)
  - 修复 Oracle 对象浏览器「全部」视图不显示表和视图注释的问题 (contributed by @jeff377) (PR #14099)
  - 修复在新窗口保存查询后主窗口 SQL 库列表看不到文件的问题 (contributed by @Acd-kk) (PR #14003)
  - 修复横向滚动 SQL 编辑器时行号与代码文本重叠的问题 (contributed by @lxk955) (PR #11923)
  - 修复未限定的表名无法获得外键连接条件建议的问题 (contributed by @saefulrahman) (PR #12017)
  - 修复 Kingbase 视图 DDL 导出丢失视图和字段注释的问题 (contributed by @jeff377) (PR #14110)
  - 修复状态栏 SQL 过长时挤掉总记录数显示的问题 (contributed by @onenewcode) (PR #13272)
  - 修复 MySQL 5.0 上索引元数据查询报 1054 错误、无法比较架构的问题 (contributed by @dienaso) (PR #14101)
  - 修复侧边栏操作错误提示被后续成功提示覆盖的问题 (contributed by @imcman) (PR #13927)
  - 修复 AI 回复被输出上限截断后缺少「继续生成」入口、输出 Token 超限直接报错的问题 (contributed by @Acd-kk) (PR #14079)
  - 修复 PostgreSQL 分区很多的 schema 中表根显示不全、需要反复「加载更多」的问题 (contributed by @Tong-bit-art) (PR #14002)
  - 修复 SQL 诊断把客户端占位符 @packetcode 误报为未知列、把 MySQL 的 #{x} 及后续 SQL 当作注释的问题 (contributed by @Acd-kk) (PR #14036)
  - 修复 SQL 文件树、内容搜索和快速打开不跟随符号链接的问题 (contributed by @lcq928) (PR #14009)
  - 修复打开 SQL 文件会替换当前查询、不新建查询标签的问题 (contributed by @imcman) (PR #13928)
  - 修复 MQTT 使用客户端证书认证时账号密码凭据丢失的问题 (contributed by @jingouzhui) (PR #13816)
  - 修复开启「自动选择侧边栏活动节点」后刚折叠的连接、库或表被重新展开的问题 (contributed by @ericbyz) (PR #14071)
  - 修复 Oracle PL/SQL 编译失败却显示成功、不提供行号和错误信息的问题 (contributed by @jeff377) (PR #13996)
  - 修复新建 MySQL 表无法选择表级字符集与排序规则的问题 (contributed by @imcman) (PR #14032)
  - 修复 Xugu 数据传输和导入时字符串字面量中的反斜杠被翻倍的问题 (contributed by @mapan0424) (PR #13980)
  - 修复 MySQL 表名含全角括号时编辑器截断表名、无法识别表和跳转的问题 (contributed by @Mo-Moore) (PR #14116)
  - 修复 SQL 关键字拼写错误会中断整条语句的引用诊断、错误标记不明显的问题 (contributed by @Acd-kk) (PR #13982)
  - 修复文件导入结束后已打开的表数据不刷新、需要重新打开的问题 (contributed by @gibbsfreeenergy) (PR #13977)
  - 修复 Oracle 宽表含 XMLTYPE 列时 date 解码反复失败的问题 (contributed by @jeff377) (PR #14004)
  - 修复 SQL Server 三段式表名丢失数据库名、跨库查询误报未知表的问题 (contributed by @thailoc-dev) (PR #13959)
  - 修复 SQL Server 在 CROSS/OUTER 与 APPLY 之间有注释时丢失 APPLY 表补全上下文的问题 (contributed by @ericbyz) (PR #14061)
  - 修复 Dameng 低版本初始化作业环境后一直显示未就绪、重复报 -2124 对象已存在的问题 (contributed by @zipg) (PR #14105)
  - 修复 SQL Server 隐式存储过程调用不返回结果集的问题 (contributed by @jeff377) (PR #14072)
  - 修复从备份恢复后 SQL 库不刷新、需要重启才能看到文件的问题 (contributed by @tiktalk945) (PR #14073)
