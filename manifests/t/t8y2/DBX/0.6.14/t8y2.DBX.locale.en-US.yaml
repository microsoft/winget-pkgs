ReleaseNotes: |-
  新功能
  - 插件市场支持通过 dbx:// 深度链接直接拉起桌面端安装插件包
  - MongoDB 支持 estimatedDocumentCount 估算集合文档数量，并支持 db.stats 与 db.serverStatus 服务器状态查询 (contributed by @thailoc-dev) (PR #9233)
  - MongoDB CSV 导入支持编辑自动推断的列类型 (contributed by @onenewcode) (PR #9102)
  - AI 助手支持重命名会话并增强数据库选择 (contributed by @eryajf) (PR #9228)
  - 数据比较支持一键重新比较，并清晰区分源库与目标库 (contributed by @zipg) (PR #9215)
  - Ctrl+F 搜索支持按当前焦点区域路由到对应的搜索框 (contributed by @zipg) (PR #9209)
  - 查询消息支持跳转到 PostgreSQL 报错位置 (contributed by @amwps290) (PR #9184)
  - 侧边栏本地表搜索支持匹配表注释 (contributed by @CHNHJF) (PR #9146)
  改进
  - 优化插件中心列表展示，新增网格/列表视图切换、描述悬浮提示与主页快捷入口 (contributed by @zipg) (PR #9220)
  - 插件市场卡片新增官方认证标识，并优化操作按钮展示
  - 插件宿主新增 host.saveFile 桥接能力，支持插件触发文件保存
  - 优化自动更新下载策略，检测到新版本时自动替换已下载的过期安装包，并将更新通知开关迁移至设置
  - 优化查询结果序列化路径，减少大结果集内存拷贝，提升查询响应速度
  - 完善 DuckDB 的 SQL 关键字补全 (contributed by @zipg) (PR #9214)
  修复
  - 修复 PostgreSQL 系数据库建表因连接中断误报失败的问题，现会核实表是否已实际创建 (contributed by @zipg) (PR #9221)
  - 修复 PostgreSQL 导出 DDL 时外键未限定 Schema、级联删表语句不完整的问题 (contributed by @zipg) (PR #9178)
  - 修复 PostgreSQL 无结果集语句的 NOTICE 消息不显示的问题 (contributed by @amwps290) (PR #9142)
  - 修复 Oracle 数值列查询结果不可编辑的问题 (contributed by @onenewcode) (PR #9143)
  - 修复 Oracle SQL 中 # 号标识符被截断的问题 (contributed by @zipg) (PR #9206)
  - 修复 MongoDB find/aggregate 后无法链式调用 .toArray() 与 .pretty() 的问题 (contributed by @thailoc-dev) (PR #9103)
  - 修复 MongoDB 执行失败时仅提示通用命令信息的问题，现展示具体错误 (contributed by @thailoc-dev) (PR #9155)
  - 修复 OceanBase Oracle 模式下无法手动控制事务的问题 (contributed by @zipg) (PR #8084)
  - 修复 GaussDB MERGE 语句范围识别不完整的问题 (contributed by @zipg) (PR #9203)
  - 修复 SQL Server 存储过程消息被当作结果集展示的问题，现统一显示在消息区域
  - 修复 SQL Server 导出脚本中自增列 INSERT 未包装 IDENTITY_INSERT 的问题 (contributed by @CHNHJF) (PR #9182)
  - 修复 DB2 遇到非法字符数据时报错中断的问题，现自动容错解码 (contributed by @bigdogcome) (PR #9194)
  - 修复 GBase 8s 标识符被误加反引号导致执行失败的问题 (contributed by @yiqiui) (PR #9151)
  - 修复 Cassandra SQL 补全误提示表别名的问题 (contributed by @thanhthai3010) (PR #9136)
  - 修复 Redis 本地键搜索在粘贴完整键名时结果异常的问题
  - 修复 MySQL VARBINARY 单元格中 GBK 编码文本预览乱码的问题
  - 修复数据网格中未提交的新增行在列筛选后不可见的问题 (contributed by @eryajf) (PR #9230)
  - 修复数据网格重新加载前未刷新表元数据导致列信息过期的问题 (contributed by @soddygo) (PR #9156)
  - 修复转置表格视图中列跳转失效的问题 (contributed by @zipg) (PR #9195)
  - 修复复制查询结果生成 INSERT 语句时列别名丢失的问题
  - 修复刷新连接时对象缓存未等待失效导致元数据展示过期的问题 (contributed by @soddygo) (PR #9114)
  - 修复独立 JRE 离线包无法导入的问题 (contributed by @zipg) (PR #9204)
  - 修复支持 Schema 的数据库生成 SQL 时未遵循“包含数据库名”设置的问题 (contributed by @CHNHJF) (PR #9123)
  - 修复新建视图未遵循标识符引号设置的问题 (contributed by @CHNHJF) (PR #9145)
  - 修复焦点位于连接列表空白区域时 Ctrl+F 无法定位到侧边栏搜索框的问题 (contributed by @zipg) (PR #9234)
  - 修复快捷键捕获输入框在中文占位符下宽度不足显示不全的问题 (contributed by @Abeautifulsnow) (PR #9192)
  - 修复恢复默认快捷键后仍停留在快捷键捕获状态的问题 (contributed by @Abeautifulsnow) (PR #9158)
  - 修复 macOS 下 Cmd+H 隐藏窗口快捷键被替换的问题 (contributed by @Abeautifulsnow) (PR #9129)
  - 修复工具栏在宽度阈值附近拖拽时闪烁的问题 (contributed by @zipg) (PR #9172)
  - 修复垂直标签栏下插件标签页布局错乱的问题
  - 修复拖拽调整面板大小时经过插件内嵌页面卡顿的问题
  - 修复 AI 对话中连续长内容不换行溢出的问题 (contributed by @zipg) (PR #9227)
  赞助信息
