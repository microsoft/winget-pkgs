ReleaseNotes: |-
  新功能
  - 表数据页底部 SQL 可点击打开对话框，完整查看、复制或临时编辑，并可将草稿一键打开到独立的新查询标签页 (contributed by @eryajf) (PR #13187)
  - SSH 隧道认证支持按指纹选择 ssh-agent 中的指定密钥，并遵循 ~/.ssh/config 的 IdentitiesOnly/IdentityFile 设置，agent 内密钥较多时不再因超出服务器认证次数上限而连接失败 (contributed by @wzw1990) (PR #13157)
  - Redis 键详情新增插件解码选项，可选择已安装的解码插件，把应用特定的二进制值在本面板内显示为 JSON 或文本 (contributed by @Chow-Code) (PR #13154)
  - SQL 补全新增 CockroachDB 专属的关键字与函数支持 (contributed by @Pius-x) (PR #13169)
  - SQL 补全新增 Spanner 的关键字与函数支持 (contributed by @dienaso) (PR #13136)
  - 查询工具栏的连接选择器显示连接的完整分组路径，鼠标悬浮连接名称可预览连接详情 (contributed by @hanxuanyu) (PR #13155)
  改进
  - 侧边栏多选表行改用持续的蓝色高亮和内嵌标记，焦点移出树或配置连接色后依然清晰可辨 (contributed by @heeeex100) (PR #13113)
  - 多语句执行摘要的进度条和表格铺满整个结果面板，不再只挤在左侧留出大片空白 (contributed by @eryajf) (PR #13188)
  - 移除结果区域外圈的连接色描边，保留连接色点等标识，配置鲜艳连接色时视觉更柔和 (contributed by @eryajf) (PR #13195)
  - 分组标签选中态只保留一条分组色底线，非活动标签底线弱化、分组标题文字改用中性色，多个彩色分组里更易辨认 (contributed by @zipg) (PR #13196)
  - MySQL 补全补齐 SHOW BINARY LOGS、SHOW BINLOG EVENTS 语句和 REGEXP/RLIKE 运算符 (contributed by @yiqiui) (PR #13133)
  - 侧边栏表搜索复用内存和持久化索引缓存，不再每次搜索都重新加载对象树，搜索更快也不会反复闪断 (contributed by @poncosh) (PR #13062)
  修复
  - Linux：MCP 状态检测调用用户 shell 时改为在独立进程会话中执行，交互式 shell 无法再通过终端作业控制挂起 DBX 进程 (contributed by @hoangph-34) (PR #13198)
  - PostgreSQL：导出表 DDL 将标准命名序列的 nextval 默认值还原为 serial/bigserial 类型，恢复建表不再因序列缺失而失败 (contributed by @dienaso) (PR #13112)
  - 开启「自动保留查询结果」后，刷新、自动刷新、翻页和数据库排序在当前结果标签页原地更新，不再每次都新增结果标签不断堆积 (contributed by @zipg) (PR #13178)
  - Linux：新增「窗口透明效果」设置，透明边框导致窗口频闪（如 Fedora）时可将其关闭，应用并重启后生效 (contributed by @AspBamboo) (PR #12975)
  - Redis：兼容 TongRDS 等对 GETRANGE 越界严格拒绝的内核，String 键详情不再空白，读取失败时面板会显示原因并提供重试 (contributed by @Gaiokane) (PR #13123)
  - 设置导出导入覆盖明暗主题模式和桌面偏好（托盘图标、关闭行为、图标主题等），备份往返不再丢失这些设置 (contributed by @caiyq925-cell) (PR #13186)
  - jdbc 通用连接上的 DuckDB：不再下发 DuckDB JDBC 不支持的 loginTimeout/connectTimeout 属性，连接不再建立失败 (contributed by @heeeex100) (PR #13161)
  - SQL 文件面板新增文件、重命名或刷新后保持当前滚动位置，不再跳回顶部 (contributed by @yiqiui) (PR #13124)
  - SQL Server：编辑视图保存时正确改写带前导注释的源码为 ALTER VIEW，不再生成 ALTER 与 CREATE 并存而无法执行的脚本 (contributed by @yiqiui) (PR #13125)
  - 「多语句执行默认视图」改回数据表后，再次执行多条查询不再被强制切回摘要页 (contributed by @eryajf) (PR #13127)
  - 补全中与输入完全匹配的候选（如 sel 匹配 select * 片段）排在置顶序列之前，Tab 不再误插入序列名 (contributed by @yiqiui) (PR #13132)
  - Kafka：消费组列表加载整体受单一截止时间约束，部分协调器缓慢时不再拖死后续 Topics 请求和整个连接 (contributed by @thailoc-dev) (PR #13139)
  - 达梦：中文 Windows 上按 GBK 解码 dexp/dimp 输出，导入失败时能看到工具自身的错误原因，不再只有退出码提示 (contributed by @thailoc-dev) (PR #13143)
  - MySQL：结果导出前重放批次中的 SET @用户变量语句，「导出全部」不再因导出会话缺少变量而产出空文件 (contributed by @thailoc-dev) (PR #13144)
  - AI 助手：聊天中选择数据库后模型返回的 SQL 固定在该库上执行，不再回落到连接的默认库 (contributed by @Abeautifulsnow) (PR #13182)
  - SQL Server：结果行数达到上限后立即停止读取并放弃剩余结果流，只取前几百行的大结果集查询不再耗时十几秒 (contributed by @zipg) (PR #13101)
  - Windows：启动时区分 WebView2 运行时缺失/损坏与安全软件拦截，缺失或损坏时引导安装离线包，拦截场景改用有界兼容启动阶梯逐级重试，不再一律误判为杀软拦截 (contributed by @zipg) (PR #13036)
  - macOS：更新后「重启 DBX」改经 LaunchServices 打开应用包，修复重启后所有局域网数据库连接报 No route to host 的问题 (contributed by @zipg) (PR #13135)
  - MySQL：取消查询、兼容驱动元数据、对象源码等剩余路径的超时遵循连接配置，不再固定 5 秒 (contributed by @zipg) (PR #13100)
  - Hologres：无主键表的定位器降级覆盖首次单击打开与刷新路径，单击表不再报错 (contributed by @ericbyz) (PR #13007)
  - 数据对比同步插入后重置自增序列（PostgreSQL setval、SQL Server IDENTITY_INSERT），同步后的普通插入不再主键冲突 (contributed by @BrydonJ) (PR #12760)
  - PostgreSQL：连接配置的 search_path 含连字符等标识符时正确加引号，连接不再因此建立失败 (contributed by @lcq928) (PR #13165)
  - 光标停在表别名点号后（如 WHERE u.）时也能异步拉取列候选，列补全不再时灵时不灵 (contributed by @ericbyz) (PR #13162)
  - PostgreSQL/openGauss/GaussDB：数据库注释改从共享目录读取，执行 COMMENT ON DATABASE 后对象浏览器能正常显示注释 (contributed by @Acd-kk) (PR #13094)
  - MariaDB：UUID 列以可读文本显示和编辑，不再显示十六进制串且保存报 Incorrect UUID value (contributed by @lxk955) (PR #12920)
  - WebDAV 自动上传记住上次上传时间，未到间隔就关闭应用不再重置倒计时导致自动上传永不触发 (contributed by @lxk955) (PR #11921)
  赞助信息
  - HuaLongAI（华龙算力）国模百亿补贴：DeepSeek等模型低至 0.8 折，谷价 0.4 折，GPT 模型不降智 0.15 倍率，注册入口
