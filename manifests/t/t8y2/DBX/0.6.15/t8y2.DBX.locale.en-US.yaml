ReleaseNotes: |-
  新功能
  - MongoDB 支持 BSON 格式的数据库备份与恢复 (contributed by @HandSonic) (PR #9181)
  - MongoDB 支持 replaceOne 替换文档操作 (contributed by @thailoc-dev) (PR #9257)
  - 数据传输支持 H2 表数据迁移 (contributed by @HandSonic) (PR #9345)
  - GBase 8s 创建数据库时支持选择 locale 与字符集 (contributed by @yiqiui) (PR #9274)
  - DB2 支持以十六进制预览二进制大对象（BLOB）列 (contributed by @eryajf) (PR #9224)
  - 新增应用更新自动下载开关，更新提醒与自动下载解耦 (contributed by @eryajf) (PR #9340)
  - 驱动商店支持按安装状态筛选内置驱动 (contributed by @onenewcode) (PR #9312)
  - SQL 文件执行支持导入分片打包的 SQL ZIP 压缩包 (contributed by @hanhvs) (PR #8877)
  - 快捷键设置按作用域分组展示，并标注快捷键冲突级别 (contributed by @Abeautifulsnow) (PR #9213)
  - 数据网格支持临时调整每页行数，并可按需设为默认值 (contributed by @eryajf) (PR #9272)
  - MCP 客户端配置新增 WorkBuddy 模板
  - 插件宿主新增 host.copy 桥接能力，支持插件写入系统剪贴板
  改进
  - 优化 SQL 编辑器输入性能，编辑大段 SQL 时不再每次按键对整个文档重新解析语句
  - AI 助手为 OpenAI Responses API 启用会话级提示词缓存，提升缓存命中率 (contributed by @eryajf) (PR #9235)
  - MongoDB 大数据量导出改为服务端 find 游标流式读取，导出更稳定 (contributed by @onenewcode) (PR #9271)
  - 设置的交流群入口新增飞书群
  修复
  - 修复 Iris/Caché 关闭分隔标识符时 schema 限定查询报错的问题 (PR #9348)
  - 修复 MySQL 查询末尾 \G 后缀无法执行的问题 (contributed by @zipg) (PR #9349)
  - 修复 Web 版响应式代理导致标签页持久化冻结的问题
  - 修复 GBase 8s 无法创建数据库及打开混合字符集数据库的问题 (contributed by @yiqiui) (PR #9250)
  - 修复 GBase 8s 字符集探测偶发失败的问题，现增加重试、超时与白名单校验 (contributed by @yiqiui) (PR #9276)
  - 修复 SQL Server 2000 预登录连接重置时未回退兼容驱动的问题 (contributed by @zipg) (PR #9334)
  - 修复 SQL Server 2000 展开数据库节点时连接风暴触发火绒误报的问题 (contributed by @zipg) (PR #9185)
  - 修复 GaussDB 执行 SQL 后 schema 清理报错的问题 (contributed by @zipg) (PR #9305)
  - 修复 MongoDB update 命令静默丢弃未知选项的问题，现直接报错提示 (contributed by @thailoc-dev) (PR #9284)
  - 修复 Redis 模糊键搜索未保留用户输入通配符的问题 (contributed by @Tara8573) (PR #9322)
  - 修复 Redis 连接 URL 导入时数字库索引与 redis-cli 参数解析错误的问题 (contributed by @zouchao) (PR #9295)
  - 修复数据表编辑保存失败时错误信息显示为 [object Object] 的问题 (contributed by @zipg) (PR #9347)
  - 修复数据传输转换目标表名大小写时丢失分区定义的问题
  - 修复 SQL 补全误为 DELETE 目标表添加别名的问题 (contributed by @onenewcode) (PR #9238)
  - 修复插件类型连接误显示“导出全部数据库”入口的问题 (contributed by @eryajf) (PR #9236)
  - 修复插件类型连接编辑页显示不适用的生产保护选项的问题
  - 修复非安全上下文（如 HTTP 访问 Web 版）下 crypto.randomUUID 不可用导致功能报错的问题 (PR #9342)
  - 修复已保存的 SQL 标签页清空内容后无法再次保存的问题 (PR #9341)
  - 修复 SQL 编辑器失焦滚动后点击会拉出旧光标选区的问题 (contributed by @SumilerJR) (PR #9311)
  - 修复 MySQL/PostgreSQL 手动事务无未提交变更时仍显示提交/回滚按钮的问题 (contributed by @Abeautifulsnow) (PR #9287)
  - 修复全局查询超时时间被重复叠加翻倍的问题 (contributed by @zipg) (PR #9331)
  - 修复 AI 供应商连接测试结果在多次编辑间相互串扰的问题 (contributed by @zipg) (PR #9339)
  赞助信息
  - 赞助伙伴星图 AstraFlow 限时福利：新用户在 UCloud 星图大模型平台 注册并完成实名认证（需邮箱注册以接收算力券）后，可领取 50 元算力金
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.15 拉取。
