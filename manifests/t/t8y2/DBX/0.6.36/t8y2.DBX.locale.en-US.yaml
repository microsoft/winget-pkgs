ReleaseNotes: |-
  新功能
  - 数据传输支持按表设置传输条件（可填 WHERE 条件或完整 SELECT，仅 MySQL / PostgreSQL 系列源库可用），并按目标库写入限制自动控制写入批次大小 (contributed by @WGW-LJY) (PR #10849)
  - 新增全局后退 / 前进导航，可在最近访问的页面和数据库对象之间快速切换 (contributed by @eryajf) (PR #11117)
  - Redis 连接支持配置默认 key 过滤条件，打开键浏览器时自动应用 (contributed by @eryajf) (PR #11184)
  - MongoDB 查询结果支持按行、列和单元格区域进行细粒度导出 (contributed by @thailoc-dev) (PR #11157)
  - 导入数据时支持为目标表选择目标 schema (contributed by @lxk955) (PR #11167)
  - SQL 客户端变量 @set 的值支持多行文本 (contributed by @lxk955) (PR #11147)
  - SQL 编辑器支持通过快捷键和右键菜单选中当前语句 (contributed by @HighBigSky) (PR #11199)
  - SQL 编辑器新增 GROUP BY 违规检查，未包含在 GROUP BY 或聚合函数中的列会实时标记，WHERE 条件补全支持回车确认 (contributed by @dafeng-001) (PR #11211)
  - WHERE 条件编辑器新增 SQL 语法建议 (contributed by @lxk955) (PR #11144)
  - 数据网格支持将剪贴板数据直接粘贴为新增行，无需预先创建空行 (contributed by @YANGAIJUNZHE) (PR #11145)
  - 数据网格支持一键隐藏所有行取值都相同的列 (contributed by @lxk955) (PR #11146)
  - 数据网格列菜单支持高亮重复值和空值 (contributed by @lxk955) (PR #11153)
  - JSON 单元格详情查看器支持代码折叠和行号显示 (contributed by @lxk955) (PR #11168)
  - 数据网格支持按 F2 快捷键编辑当前焦点单元格 (contributed by @lxk955) (PR #11176)
  - 导出完成后可在完成提示中直接在文件管理器里显示导出文件 (contributed by @lxk955) (PR #11070)
  - 导出对话框会记住上次使用的导出选项，且对象列表按名称排序 (contributed by @lxk955) (PR #11134)
  - 插件系统暴露稳定的贡献实例标识 contributionId，供插件区分和管理多个贡献实例 (contributed by @0verme) (PR #11140)
  改进
  - 通过编辑器左侧装订线按钮执行 SQL 后默认将光标定位到该语句起始位置并聚焦编辑器，可在编辑器设置中关闭 (contributed by @lxk955) (PR #11149)
  - WHERE 条件编辑器的语法建议按数据库方言过滤，并移除了不适用的运算符 (contributed by @lxk955) (PR #11165)
  - 表结构编辑器的复选框不再动态显示"是 / 否"标签，界面更简洁 (contributed by @lxk955) (PR #11150)
  修复
  - 修复网格以 SQL 形式复制数据时未应用提取器"包含数据库名"选项的问题 (contributed by @HighBigSky) (PR #11206)
  - SQL Server 生成 INSERT 脚本时省略不可显式插入的 timestamp/rowversion 列和计算列 (contributed by @dxqlovestudy) (PR #10780)
  - PostgreSQL 表结构传输现在会同步传统 INHERITS 继承的父表 (contributed by @Tara8573) (PR #10859)
  - 修复网格生成 SQL 时对 PostgreSQL 系和 Oracle 类目标库错误转义反斜杠的问题，现在保持字面量 (contributed by @Tong-bit-art) (PR #11213)
  - 修复 SAP HANA 配置数据库名后 schema 和表视图不显示的问题 (contributed by @zipg) (PR #11210)
  - SQL 补全信息弹窗现在使用编辑器配置的字体 (contributed by @basil-k-aji-dev) (PR #11183)
  - 修复 PostgreSQL 旧版本缺少 pg_sequence 系统表时序列对象源码获取失败的问题 (contributed by @yiqiui) (PR #11170)
  - 修复数据传输将显式清空的对象选择误当作默认值处理的问题 (contributed by @0verme) (PR #11181)
  - 修复分隔符注释导致 SQL 代码折叠卡死的问题 (contributed by @joseph-kang777) (PR #11171)
  - 修复数据传输对 Oracle 系和 SQLite 目标库错误转义反斜杠的问题，现在保持字面量 (contributed by @Tong-bit-art) (PR #11177)
  - 关闭 SQL 参数输入对话框后结果区域保持原有滚动位置 (contributed by @yaoxinghuo) (PR #11178)
  - 结构对比和数据对比的连接选择器现在按数据库类型过滤可选连接 (contributed by @eryajf) (PR #11182)
  - PostgreSQL 例程对象源码获取前探测 prokind 支持，兼容不支持该列的旧版本 (contributed by @yiqiui) (PR #11166)
  - 修复打包后插件工作台中嵌套动态 import 的模块 URL 被改写导致加载失败的问题 (contributed by @0verme) (PR #11143)
  安装
  - Windows 安装器在安装或更新目标目录受保护时自动请求管理员提权，避免写入失败 (contributed by @zipg) (PR #11185)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.36 拉取。
