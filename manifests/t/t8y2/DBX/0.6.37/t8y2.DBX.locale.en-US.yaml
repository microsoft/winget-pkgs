ReleaseNotes: |-
  新功能
  - AI 内置服务商预设新增 AstraFlow
  - Neo4j 查询结果支持图形化展示，可直接查看和编辑节点与关系 (contributed by @HandSonic) (PR #11217)
  - NebulaGraph 查询结果支持图形化展示，可直接查看和编辑节点与关系 (contributed by @HandSonic) (PR #11293)
  - AI Skills 改为按需加载，请求时附带 Skill 列表并由 use_skill 工具按需加载，也可允许 AI 自动选用 Skills (contributed by @Abeautifulsnow) (PR #11227)
  - 新增全局快捷键，可一键断开所有数据库连接 (contributed by @yaoxinghuo) (PR #11289)
  - WebDAV 同步设置支持自定义 User-Agent，兼容仅允许特定客户端访问的网关
  - 表结构编辑器支持编辑 MySQL 生成列的表达式和 VIRTUAL/STORED 存储方式 (contributed by @StormTian) (PR #11252)
  - MCP 的连接列表现在返回每个连接已保存的备注 (contributed by @ninggc) (PR #11259)
  - 插件快捷栏支持通过右键菜单切换各快捷方式的显示 (contributed by @eryajf) (PR #11268)
  - 数据库和表浏览器的右键菜单新增更多数据库操作入口 (contributed by @eryajf) (PR #11280)
  - MCP 服务在同一端口同时响应新旧两代 MCP 协议，有状态和无状态客户端均可直接连接 (contributed by @KeaneQy) (PR #11218)
  修复
  - 修复 Caché 数据库默认库表列表无法加载的问题，表元数据改由 Agent 分页获取，不再进行全量 JDBC 目录扫描
  - 修复 Nacos 配置语法校验把注释误判为语法错误的问题，诊断信息现在仅作提示 (contributed by @eryajf) (PR #11292)
  - 修复 Oracle SQL 格式化未把 SUBSTRB 等字节和码点函数变体按函数处理的问题 (contributed by @Totopo27) (PR #11294)
  - 修复 PostgreSQL 外部表生成注释 SQL 缺少 FOREIGN 关键字的问题，现在生成 COMMENT ON FOREIGN TABLE (contributed by @dxqlovestudy) (PR #11249)
  - 修复 Nacos 2.x 登录响应中 token 以字符串包装在 data 字段返回时无法解析、连接失败的问题 (contributed by @dxqlovestudy) (PR #11263)
  - 修复 Oracle 在表结构编辑器新增列时勾选 NOT NULL 仍生成可空列的问题 (contributed by @jeff377) (PR #11255)
  - 修复 SQL Server 删除带默认约束的列时报错的问题，现在先删除默认约束再删除列 (contributed by @jeff377) (PR #11261)
  - 修复结构比对进行中断开连接后后台任务反复重建连接并残留会话的问题，现在会停止比对并释放连接池 (contributed by @zipg) (PR #11266)
  - 修复 SSH 主机密钥确认弹窗中焦点环被裁剪的显示问题 (contributed by @dxqlovestudy) (PR #11269)
  - 修复 MongoDB 集合右键菜单无法打开数据页签的问题 (contributed by @eryajf) (PR #11270)
  - 修复 MySQL 为 BLOB、TEXT、GEOMETRY 和 JSON 列设置字面量默认值时生成非法 SQL 的问题，现在会明确拒绝 (contributed by @jeff377) (PR #11273)
  - SunDB 的 schema 和表结构信息改用 JDBC 驱动 DatabaseMetaData 获取，元数据获取更准确 (contributed by @zipg) (PR #11274)
  - 修复 Oracle 执行计划在 PLAN_TABLE 为提交即清空的临时表时报 "cannot fetch plan" 的问题，现在在同一事务内写入和读取计划 (contributed by @zipg) (PR #11276)
  - 修复 SQL Server 含 # 临时表或反斜杠字符串等无法定位 ORDER BY 的语句分页改写后生成非法 SQL 的问题，此类语句现在改用 ROWCOUNT 封顶执行 (contributed by @Tong-bit-art) (PR #11284)
  - 修复 MongoDB 查询不存在的集合时静默返回空结果的问题，现在会明确提示集合不存在 (contributed by @thailoc-dev) (PR #11201)
  - 修复查询结果导出 INSERT 语句时丢失 owner schema 前缀的问题 (contributed by @0verme) (PR #11237)
  - 修复 SQL 补全未把 WITH 子句 CTE 名称作为表名候选的问题 (contributed by @Tong-bit-art) (PR #11219)
  - 修复 SQL Server 字段与 * 混合查询的总行数统计忽略 WHERE 条件、显示整表行数的问题 (contributed by @zipg) (PR #11239)
  - 修复网格生成 SQL 时未转义 NUL 和 SUB 控制字符导致 mysql 客户端截断脚本的问题 (contributed by @Tong-bit-art) (PR #11160)
  - 修复 Firebird 通过 ISO8859_1 连接存储的 GBK 文本和字段注释乱码的问题 (contributed by @zipg) (PR #11221)
  - 修复 PostgreSQL bytea 字段预览大小显示和二进制下载异常的问题 (contributed by @onenewcode) (PR #11223)
  安装
  - Windows 安装器新增安装失败诊断信息，并在无法自动完成时提供手动安装入口 (contributed by @zipg) (PR #11283)
  - 下载页面的 Agent 和 JRE 下载链接现在匹配当前系统架构，避免下错版本 (contributed by @zipg) (PR #11285)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.37 拉取。
