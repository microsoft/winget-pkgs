ReleaseNotes: |-
  新功能
  - 历史面板新增统一的 MCP 调用历史，与 SQL 查询历史并列展示，支持工具筛选、详情查看与独立的保留条数设置 (contributed by @eryajf) (PR #10344)
  - 数据导入窗口支持收起为后台任务继续执行，可随时展开查看进度与结果 (contributed by @ma123456mai) (PR #10343)
  - 数据导入新增「跳过重复行」选项，可按唯一键跳过已存在的记录 (contributed by @Maaran-dev) (PR #10355)
  - MongoDB 命令补全补齐集合方法的选项键提示 (contributed by @thailoc-dev) (PR #10351)
  - MongoDB 命令补全支持 bulkWrite 操作及其字段 (contributed by @thailoc-dev) (PR #10368)
  - AI 面板支持插件维度的推荐问题，插件 Agent 对话可使用当前连接提供的实时工具数据 (contributed by @eryajf) (PR #10364)
  - 数据库浏览器新增右键菜单，数据库名称优先展示，大小与字符集等元数据随后加载 (contributed by @eryajf) (PR #10367)
  - 用户管理中创建与编辑 PostgreSQL、StarRocks 用户时支持表级权限选择，无需手动执行授权命令
  - SQL 补全新增 schema 限定设置，表名补全可选始终携带模式名前缀
  - 结果表格新增列宽布局设置，支持自适应宽度与原始宽度切换
  - 表格选中区域支持按数据提取器配置直接导出到文件
  - DuckDB 表结构编辑支持重命名列
  - SQL 编辑器工具栏新增「新结果页执行」按钮，可将执行结果固定到新的结果页签
  - 数据表格页面支持快捷跳转到对应表结构页面
  - MQTT 消息预览支持按条收起消息负载，长消息不再占满消息区域
  - 插件 API 新增剪贴板图片与媒体 URL 能力，插件可展示图片内容
  - 插件使用的连接配置发生变更后自动重连，不再需要手动断开重连
  改进
  - AI 对话重发消息前增加确认，避免误触重发 (contributed by @eryajf) (PR #10348)
  - Oracle 与 PostgreSQL 执行 SQL 前不再发送连接健康检查探测查询，减少执行前的额外往返
  - 筛选的条件与文本视图应用筛选后不再自动折叠，可继续调整筛选条件
  - 筛选规则的操作按钮增加悬浮提示，并允许删除最后一条规则
  - 插件 manifest schema 补齐 command 与 menus 贡献点定义，插件清单编写与校验不再误报 (contributed by @jinpy666) (PR #10341)
  修复
  - PostgreSQL 分区树批量选择列的元数据查询增加 information_schema 兜底，主视图不可用时不再失败 (contributed by @zipg) (PR #10332)
  - Oracle 识别带 @dblink 后缀的表引用，别名投影改写恢复生效，不再触发驱动异常 (contributed by @zipg) (PR #10335)
  - 达梦表结构按声明的字符/字节单位显示列长度，编辑 CHAR 列不再误按 BYTE 处理 (contributed by @zipg) (PR #10349)
  - 达梦无主键表保存或删除行时不再把二进制 LOB 列拼入行谓词 (contributed by @zipg) (PR #10333)
  - 达梦查看表 DDL 的元数据查询显著提速，不再长时间加载
  - Vastbase 复制表结构时保留主键、唯一约束与索引 (contributed by @zipg) (PR #10352)
  - 人大金仓与 Vastbase 表的序列可正常查看 (contributed by @zipg) (PR #10356)
  - IoTDB JDBC 连接参数 rpc_compress 被正确识别，不再报未知参数 (contributed by @CN-Scars) (PR #10363)
  - Redis 集合值分页按负载大小设界，打开含大字段值的哈希等集合不再长时间无响应 (contributed by @thailoc-dev) (PR #10350)
  - Kafka Broker 使用 IP 直连并启用 SASL 时跳过反向 DNS 解析，Windows 下连接不再超时失败
  - Excel 导入跳过只有样式的空白行，不再产生全 NULL 数据行 (contributed by @zipg) (PR #10365)
  - 生成测试数据时唯一约束列默认启用去重，不再撞唯一索引 (contributed by @zipg) (PR #10370)
  - MCP HTTP 服务修复回环地址 ::1 配置下保存并启动失败的问题，设置页操作合并为单个「保存并应用」按钮 (contributed by @eryajf) (PR #10357)
  - pnpm 安装的 MCP 服务器更新时使用 @latest，更新后不再停留在旧版本 (contributed by @zipg) (PR #10369)
  - MCP 本地桥接完整读取大请求体、拒绝浏览器跨站请求并收紧端口文件权限，大批量 SQL 经桥接执行不再被截断 (contributed by @jinpy666) (PR #10339)
  - MCP 桥接的插件工具调用固定绑定连接所属插件，连接凭据不再可能流向其他插件 (contributed by @jinpy666) (PR #10338)
  - 插件安装器改为真正原子写入，失败回滚不再删除插件唯一副本 (contributed by @jinpy666) (PR #10340)
  - 插件市场权限徽标过长时自动换行，窄面板下不再溢出 (contributed by @eryajf) (PR #10362)
  - 插件 fileTransfer.write 传输独立 ArrayBuffer 时内容正确送达 (contributed by @jinpy666) (PR #10346)
  - 网格条件栏连续输入合并为一步撤销，收起条件栏时不再丢失后续输入 (contributed by @zipg) (PR #10371)
  - 网格条件栏规则文本换行时插入符与文本对齐 (contributed by @zdzfeer) (PR #9410)
  - 保存数据提取器配置后显示成功提示，不再看似点击无反应 (contributed by @zipg) (PR #10359)
  - schema 列表加载缓慢时对象标签页先显示对象内容，不再长时间空白 (contributed by @zipg) (PR #10372)
  - 打开超大源码对象（如大型 Oracle PACKAGE）时限制自动分析范围，不再长时间无响应
  - 调试日志改为批量写入，开启后不再造成界面卡顿 (contributed by @zipg) (PR #10375)
  - 点击页签栏空白处不再触发窗口拖拽，窗口不再漂移到点击位置
  - 侧边栏双击打开浏览对象不再偶发无响应，搜索后的数据库激活状态保持正确
  - 韩语下「跳转到页码」占位符不再显示字面量 {page} (contributed by @zipg) (PR #10373)
  - 设置搜索命中「启用调试日志」时跳转到开关所在的「关于」页签 (contributed by @zipg) (PR #10358)
  - 多客户端共用同一服务端时保存连接不再互相删除对方的连接 (contributed by @zipg) (PR #10347)
  - dbx doctor 将「存储打开失败」与「connections 表缺失」区分报告，不再误导排查 (contributed by @zipg) (PR #10334)
  安装
  - Linux AppImage 恢复 Wayland 原生支持，不再强制 GDK_BACKEND=x11，Wayland 会话下可正常初始化 GTK
  - AppImage 打包排除宿主机显示库（libwayland、libxkbcommon 等），避免捆绑构建机库版本引发运行异常
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.25 拉取。
