ReleaseNotes: |-
  赞助信息
  - Jalapeno Cloud：GLM-5.3 限时 3 折（10 月 19 日至 25 日），Step 5 已上线，活动入口
  新功能
  - 查询结果标签、结果集标签和结果区边框显示来源连接配置的颜色，便于区分测试与生产等不同环境的连接 (contributed by @CSXFanMeng) (PR #10823)
  - SQL 编辑器补全支持按表和列的注释搜索，中文注释、拼音首字母和英文注释文本均可匹配 (contributed by @lxk955) (PR #12629)
  - 对象和数据库浏览器的紧凑卡片宽度可在 160、200、240 像素间选择（默认 160），两个浏览器共享该设置 (contributed by @eryajf) (PR #12721)
  - SQL 补全列表支持 Ctrl-N/P 上下选择补全项 (contributed by @Xcylway) (PR #12698)
  - 查询结果列宽按 SQL 文件记忆，手动调整的列宽跨会话和跨标签页保留 (contributed by @lxk955) (PR #12641)
  - 华为 DWS 连接支持查看 Estimated Plan 预估执行计划 (contributed by @0verme) (PR #12644)
  - 数据传输新增目标列名转大写选项
  改进
  - 设置页语言选项的国旗图标改用内置 SVG 渲染，Windows 上不再依赖系统 emoji 字体，各平台显示一致 (contributed by @Ezreal-byte) (PR #12715)
  - 深色主题下工作台内层面板改用不透明边框和更清晰的圆角，面板轮廓不再难以分辨 (contributed by @cseda-gullivernet) (PR #12600)
  - 「跳转列」目标列表按用户调整后的列顺序显示，与网格和字段面板保持一致 (contributed by @hongshuo-wang) (PR #11862)
  - MongoDB、Redis、etcd、ZooKeeper 等自带表单的连接类型补齐「保存密码」开关，取消勾选后密码不再写入本地密钥存储 (contributed by @zipg) (PR #12597)
  - Redis 连接 TLS 设置支持配置 CA 证书与客户端证书，可连接私有 CA 或启用双向认证的实例 (contributed by @zipg) (PR #12598)
  - 表格中选择自动刷新间隔后立即开始刷新，无需再单独点击开始自动刷新 (contributed by @Acd-kk) (PR #12758)
  - 布尔值文本显示设置同时应用于单元格编辑下拉和详情面板，与网格显示保持一致 (contributed by @zipg) (PR #12626)
  - 「在数据库中查找」数据模式改为批量获取列并合并探测语句，显著减少跨进程往返；Oracle 家族 CLOB 列改用 DBMS_LOB 全量匹配，超长内容不再报 ORA-22835 (contributed by @Lan-zk) (PR #12689)
  修复
  - 长按执行快捷键不再对同一标签页重复触发并发执行，执行计时和加载状态不再永久卡住 (contributed by @lxk955) (PR #12703)
  - 多语句查询按语句应用分页限制，并区分展示当前页 SQL 与实际执行 SQL (contributed by @eryajf) (PR #12684)
  - Web 端断线重连后保留插件侧边栏会话，文件和 SSH 操作不再报无活动连接 (contributed by @jinpy666) (PR #12662)
  - PostgreSQL MERGE 语句格式化按子句边界换行，不再逐词一行 (contributed by @zipg) (PR #12595)
  - 快速开始页最近连接打开查询时带入连接默认 schema，未限定表名的查询不再报对象不存在 (contributed by @zipg) (PR #12596)
  - 中文输入法在表信息悬浮搜索框内组合输入时不再关闭悬浮窗、丢失已输入内容 (contributed by @thailoc-dev) (PR #12762)
  - 反引号、双引号、方括号包裹的 SQL 标识符按标识符着色，不再与字符串字面量同色 (contributed by @lxk955) (PR #12630)
  - SQL 语义分析的文本范围统一为包含式结尾列，诊断高亮不再多包含尾随的分隔符 (contributed by @lxk955) (PR #11779)
  - 手动统计总行数不再显示整表刷新遮罩，进度只在结果栏显示，统计期间表格仍可选中复制 (contributed by @zipg) (PR #12653)
  - Oracle 家族文本型 BLOB 复制为解码文本，与网格预览一致而不是十六进制 (contributed by @Tong-bit-art) (PR #12679)
  - 无语句序号的批量删表结果按计划一一对应，单表删除成功后不再误报操作失败 (contributed by @lxk955) (PR #12685)
  - DB2 查询结果翻页改用游标分页，不支持 OFFSET 子句的旧版服务端不再报 SQLCODE -104 (contributed by @zipg) (PR #12764)
  - 触发器启用/禁用后侧边栏图标状态即时更新，手动刷新表不再丢失表级触发器 (contributed by @lxk955) (PR #12670)
  - 表级触发器分组刷新只加载当前表的触发器，Firebird 触发器支持启用/禁用和新建模板 (contributed by @lxk955) (PR #12664)
  - 关闭自动打开详情后点击其他对象，已打开的详情面板同步切换，不再停留在旧对象 (contributed by @lxk955) (PR #12697)
  - 侧边栏弹窗或内联重命名关闭后键盘焦点回到原位置，可继续键盘操作 (contributed by @Xcylway) (PR #12699)
  - 未分组的横版标签保留用户显式配置的连接底色，连接颜色设置不再失去效果 (contributed by @zipg) (PR #12756)
  - 指针斜滑经过相邻菜单项时不再误切换或关闭已展开的二级菜单 (contributed by @hongshuo-wang) (PR #12739)
  - 连接树底部显示端点行时插件快捷栏列表高度不再塌缩为标题行 (contributed by @yaoxinghuo) (PR #12604)
  - 插件快捷入口位于连接树底部时，切换插件显示状态不再错误隐藏快捷栏 (contributed by @onenewcode) (PR #12659)
  - openGauss 查看表索引修正兼容 SQL 的 JOIN 顺序，不再报 syntax error at or near "LEFT" (contributed by @lxk955) (PR #12686)
  - GaussDB 索引查询保持 opclass JOIN 在 WHERE 之前，索引列表加载不再报语法错误 (contributed by @yiqiui) (PR #12690)
  - CockroachDB 刷新表列表时为 schema 占位符补充 ::text 转换，不再报 could not determine data type of placeholder
  - InfluxDB 1.x 查看测量结构改为展示只读描述，右键查看 DDL 不再失败
  - standalone Redis 大集合「加载更多」游标限定在本连接内，点击后不再报游标无效或无响应 (contributed by @lxk955) (PR #12648)
  - SQL Server、达梦 IDENTITY 自增列传输到 MySQL 家族目标保留 AUTO_INCREMENT，省略 id 的插入不再失败 (contributed by @Tong-bit-art) (PR #11994)
  - Doris、StarRocks 目标按 BIGINT 门槛保留自增列并跳过同列 DEFAULT，建表不再被拒绝 (contributed by @Tong-bit-art) (PR #12691)
  - MySQL auto_increment 源列传输到 Doris、StarRocks 不再生成不被支持的 INT AUTO_INCREMENT (contributed by @Tong-bit-art) (PR #12713)
  - DATETIME 列传输到 Oracle、OceanBase Oracle 模式目标映射为 TIMESTAMP，建表不再报 OBE-00900/ORA-00902
  - SQL 导入允许 NOW()、CURRENT_TIMESTAMP 等无参时间表达式由数据库执行，预览阶段不再报不支持 (contributed by @Xcylway) (PR #12688)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.49 拉取。
