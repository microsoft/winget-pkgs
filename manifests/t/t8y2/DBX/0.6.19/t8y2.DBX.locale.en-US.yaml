ReleaseNotes: |-
  新功能
  - 新增 Apache Solr 连接支持，可浏览 Core、查看 Schema 字段、执行文档查询与增删改，并提供 REST 控制台 (contributed by @yaoxinghuo) (PR #9850)
  - MySQL 用户权限编辑支持数据库级与表级的可视化授权 (contributed by @HighBigSky) (PR #9744)
  - MongoDB 旧版 Agent 连接支持集合统计与新建数据库 (contributed by @thailoc-dev) (PR #9893)
  - MongoDB 旧版 Agent 连接支持 findOneAndUpdate、findOneAndReplace 与 findOneAndDelete (contributed by @thailoc-dev) (PR #9838)
  - MongoDB 旧版 Agent 连接支持 distinct 查询 (contributed by @thailoc-dev) (PR #9884)
  - MongoDB 库表视图显示集合占用空间并支持按大小排序 (contributed by @zipg) (PR #9810)
  - PostgreSQL 与 Kingbase 支持查看分区表详细信息并管理分区 (contributed by @amwps290) (PR #9812)
  - Excel 批量建表导入支持勾选要导入的工作表 (contributed by @tdog54646) (PR #9910)
  - MCP 固定会话支持通过环境变量 DBX_SESSION_IDLE_TTL_SECS 配置空闲超时 (contributed by @tdog54646) (PR #9909)
  - 查询历史保留条数支持在设置中配置 (contributed by @tdog54646) (PR #9908)
  - 表属性抽屉新增「表信息」页签，集中查看表基本信息与体积统计 (contributed by @sxhjlzl) (PR #9876)
  - SQL 编辑器新增「跳转到行」，可输入行号快速定位（Ctrl+G / ⌘⌥G） (contributed by @zipg) (PR #9799)
  - Oracle 执行报错时按错误消息中的行列位置定位错误并锚定光标 (contributed by @zipg) (PR #9804)
  - AI 支持以只读方式附加用户级 Codex 兼容的 SKILL.md 文件作为补充指令 (contributed by @Abeautifulsnow) (PR #9906)
  - DDL 结构视图新增「查看数据」入口 (contributed by @zipg) (PR #9790)
  - 插件工作台 UI 资源改经 dbx-plugin:// 协议加载，使用相对路径分包的插件恢复懒加载与字体加载
  - 插件 Host API 新增 storage 桥接，插件可持久化读写独立的数据目录
  改进
  - 表结构编辑器的列网格改为虚拟渲染，大表滚动更流畅
  - 名称相同的标签页自动添加数字后缀，便于区分 (contributed by @zipg) (PR #9913)
  - 更新中心无可用更新时隐藏客户端页签 (contributed by @zipg) (PR #9912)
  - 导出 SQL 时每条数据行单独成行，便于阅读与比对 (contributed by @zipg) (PR #9836)
  修复
  - 修复 MySQL group_concat_max_len 会话设置被下调覆盖服务端更高配置 (contributed by @zipg) (PR #9795)
  - 修复 SQL Server 结构对比遇到 tinyint 外键时报错退出 (contributed by @zipg) (PR #9842)
  - 修复 SQL Server 临时表补全返回数据库内部临时名 (contributed by @zipg) (PR #9871)
  - 修复 SQL Server 存储过程体内 DECLARE 缺少数据类型时未提示语法错误 (contributed by @zipg) (PR #9792)
  - 修复 Oracle 关闭「标识符添加引号」时大小写敏感标识符被去掉引号 (contributed by @zipg) (PR #9793)
  - 修复达梦表数据复制粘贴到含标识列的表时失败 (contributed by @yiqiui) (PR #9899)
  - 修复 Meilisearch 索引侧栏显示实例总大小而非索引自身大小 (contributed by @zipg) (PR #9891)
  - 修复 Meilisearch 索引创建报错信息过长时溢出界面，改为在对话框内换行展示 (contributed by @eryajf) (PR #9858)
  - 修复 Cassandra 集合类型值展示不是合法 CQL 字面量 (contributed by @thanhthai3010) (PR #9846)
  - 修复通用 JDBC 连接表格翻页未下发 rowOffset 导致分页无效 (contributed by @zipg) (PR #9791)
  - 修复 OceanBase 表数量超过一千后表名悬停预览失效 (contributed by @efeire) (PR #9802)
  - 修复 MCP 批量查询结果未遵守 cell_char_offset / cell_char_limit 设置 (contributed by @zipg) (PR #9922)
  - 修复 AI 数据库选择按钮在库列表加载完成前显示「选择数据库」占位文案 (contributed by @CHNHJF) (PR #9825)
  - 修复插件 Plan API SQL 检查的关键字边界误判 (contributed by @0verme) (PR #9859)
  - 修复复用 result-view 的插件工作台上下文未刷新 (contributed by @0verme) (PR #9805)
  - 修复插件 result-view 上下文使用整个编辑器 SQL 而非实际执行的语句 (contributed by @0verme) (PR #9806)
  - 修复关闭插件页签时借用的宿主连接被错误释放 (contributed by @0verme) (PR #9816)
  - 修复 Windows 上插件重命名偶因文件锁占用失败，现自动重试
  - 修复「查看源码」后保存存储过程写错目标对象 (contributed by @zipg) (PR #9853)
  - 修复 SQL 诊断刷新后输入插入点错位导致 Redis 参数输入异常 (contributed by @zipg) (PR #9796)
  - 修复编辑态下压缩 JSON 后无法再次格式化 (contributed by @zipg) (PR #9841)
  - 修复数据网格生成保存与复制 SQL 时未遵循「生成 SQL 时包含数据库名」设置 (contributed by @zipg) (PR #9817)
  - 修复单元格编辑失焦提交后抢回焦点，单击 SQL 编辑器无法直接粘贴 (contributed by @zipg) (PR #9797)
  - 修复表设计器操作列图标悬停提示缺少动作名称 (contributed by @zipg) (PR #9916)
  - 修复检索时未展开数据库的对象分组不可见，及同表名多库只显示一个 (contributed by @zipg) (PR #9905)
  - 修复库表视图工具栏过窄时搜索框与筛选控件重叠 (contributed by @zipg) (PR #9798)
  - 修复查询结果导出文件名未沿用结果标签页名称 (contributed by @zipg) (PR #9919)
  - 修复数据比较结果被页脚遮挡无法滚动到底 (contributed by @zipg) (PR #9857)
  - 修复结构对比部署脚本未按外键依赖排序导致同步中途失败 (contributed by @zipg) (PR #9794)
  - 修复快捷键改键后因格式未归一化导致设置无法保存 (contributed by @zipg) (PR #9897)
  - 修复客户端包已下载时更新中心「更新全部」无响应 (contributed by @zipg) (PR #9821)
  - 修复滚动型对话框在壁纸背景下透出底层内容 (contributed by @zipg) (PR #9888)
