ReleaseNotes: |-
  新功能
  - SQL 补全支持未执行的 CREATE TABLE / ALTER TABLE 等 DDL 的本地派生结构，无需先执行即可补全表和字段 (contributed by @zenisann) (PR #14994)
  - 新增 SQL 补全自动激活延迟设置，默认 500ms，对齐 DBeaver 行为 (contributed by @dienaso) (PR #15380)
  - 光标位于 SQL 的 BEGIN/END 关键字时高亮同一代码块的两端 (contributed by @ThugKd) (PR #15506)
  - 代码片段支持 VS Code 风格的 $0 最终光标位置占位符 (contributed by @AndreasK79) (PR #14211)
  - SQL 编辑器右键菜单可直接将选中语句添加为代码片段 (contributed by @AndreasK79) (PR #14212)
  - 新增「切换行注释并移到下一行」可配置快捷键，便于连续注释多行 (contributed by @ThugKd) (PR #15527)
  - 提交活动事务的操作支持自定义快捷键，默认 Shift+Ctrl/Cmd+C (contributed by @AndreasK79) (PR #14311)
  - 单元格详情面板新增「引用行」页签，原地预览外键指向的行 (contributed by @x-labb) (PR #15419)
  - BLOB 文本查看弹窗支持切换为沙箱 HTML 渲染预览 (contributed by @ThugKd) (PR #15400)
  - SQL 结果单元格支持插件值解码扩展点，可在网格中解密业务密文字段 (contributed by @seaways1015-afk) (PR #14326)
  - 设置新增全局数字千分位开关，逐位保留 BIGINT 和 DECIMAL 精度 (contributed by @ThugKd) (PR #15402)
  - 单元格详情转换预览新增「文本 → Unicode 转义」 (contributed by @ThugKd) (PR #15170)
  - 智能复制支持为单列选区单独配置格式（单行、SQL IN 列表、JSON 等） (contributed by @ThugKd) (PR #15530)
  - 新增可配置的 Alt+1..5 快捷键，一键复制当前结果集第一行指定列的值 (contributed by @AndreasK79) (PR #14313)
  - 可编辑单元格右键新增「将文本粘贴到此单元格」，多行文本可作为内容存入单格 (contributed by @ThugKd) (PR #15171)
  - 网格选中多个单元格时 Ctrl/Cmd+D 用左上角单元格的值填充选区 (contributed by @ThugKd) (PR #15177)
  - 表结构字段行支持复制 DDL，并可在目标表结构网格中粘贴导入字段定义 (contributed by @ThugKd) (PR #15179)
  - 数据传输支持为每张源表设置目标表名 (contributed by @x-labb) (PR #15417)
  - 侧栏普通视图支持复制/粘贴，直接发起同方言的结构或数据传输 (contributed by @ThugKd) (PR #15540)
  - 架构比较支持一次比较多个 Schema，结果按 Schema 切换展示 (contributed by @BrydonJ) (PR #14410)
  - 数据比较支持全局与按表的忽略列，仅忽略列有差异的行单独计数 (contributed by @woniuxia) (PR #14544)
  - 表数据导入对话框支持保存和复用列映射模板 (contributed by @x-labb) (PR #15422)
  - 连接导入支持 SQLark 配置备份 (contributed by @knqiufan) (PR #14820)
  - 执行 SQL 文件对话框支持直接新建目标数据库 (contributed by @x-labb) (PR #15420)
  - SQL 库与 SQL 文件面板支持按连接分组的显示模式 (contributed by @eryajf) (PR #15443)
  - SQL 文件面板支持拖拽移动文件到其他目录，外部文件变更实时同步 (contributed by @Acd-kk) (PR #14620)
  - 连接可继承所在分组的颜色，独立设置的颜色优先 (contributed by @ThugKd) (PR #15508)
  - 标签页右键新增可搜索的「近期打开的表」选择器，支持绑定快捷键 (contributed by @ThugKd) (PR #15532)
  - 多行平铺标签支持设置行数上限（1-10 行或不限） (contributed by @ThugKd) (PR #15401)
  - 主工具栏支持固定「更多」菜单中的操作并拖拽排序，新增最近关闭标签页入口 (contributed by @ThugKd) (PR #15142)
  - 新建数据库用户时可一键生成 24 位强密码 (contributed by @ThugKd) (PR #15172)
  - 用户管理显示并筛选 MySQL 与 OceanBase（MySQL 模式）账号锁定状态，MySQL 同时显示密码过期标记 (contributed by @CSXFanMeng) (PR #15452)
  - PostgreSQL 序列新增属性查看与编辑（PG 10 及以上） (contributed by @imcman) (PR #15281)
  - PostgreSQL 侧栏支持重命名 Schema，联动刷新缓存与可见性配置 (contributed by @ThugKd) (PR #15544)
  - MySQL 表右键菜单新增表维护动作（Analyze / Check / Optimize / Repair Table） (contributed by @x-labb) (PR #15415)
  - SQL Server 连接在 trustServerCertificate=false 时校验服务器证书，支持 sslrootcert 与 hostNameInCertificate 参数 (contributed by @amwwgjj) (PR #14672)
  - 达梦包和包体源码页显示成员面板，可按成员跳转到对应声明 (contributed by @ThugKd) (PR #15390)
  - InfluxDB 连接支持 API 路径前缀，反向代理子路径部署可直接连接，influxdb:// URL 可粘贴 (contributed by @Gaiokane) (PR #14643)
  - 支持 Oracle 到虚谷（Xugu）经验证的表结构和数据传输，未验证的类型显式报错 (contributed by @mapan0424) (PR #13847)
  - DuckDB 执行计划支持估算计划（EXPLAIN） (contributed by @0verme) (PR #14899)
  - SQLite 执行计划支持估算计划（EXPLAIN QUERY PLAN） (contributed by @0verme) (PR #14885)
  - 插件中心不再向不满足主机版本要求的 DBX 提供需要更新版本的插件更新 (contributed by @Abeautifulsnow) (PR #13896)
  改进
  - 执行 SQL 语句时跳过不可能匹配的完整 SQL 解析，加速大批量 INSERT 导入和脚本执行 (contributed by @b84330808) (PR #15127)
  - 降低 SQL 编辑器连续输入和拖拽选择的开销，改善大脚本下的输入延迟
  - Quick Open 启动时复用连接树索引，大幅减少后台索引构建开销 (contributed by @ThugKd) (PR #15512)
  - Doris DDL 弹窗先显示服务端原文，格式化改为按需执行，打开大表 DDL 不再等待 (contributed by @ThugKd) (PR #14988)
  - MySQL 对象详情改为渐进加载并支持失败重试，先显示名称再后台补齐统计与详情 (contributed by @CN-Scars) (PR #14396)
  - 备份调度器空闲时心跳写盘节流为每 30 秒一次，减少无谓磁盘写入 (contributed by @ThugKd) (PR #15385)
  - SQL 参数对话框内按 Enter 直接执行查询 (contributed by @AndreasK79) (PR #15478)
  - 分隔文本转换对话框内按 Enter 确认 (contributed by @AndreasK79) (PR #15476)
  - 大小写转换快捷键扩展到网格内联编辑器和表结构文本输入框 (contributed by @ThugKd) (PR #15176)
  - 双击补全列表中的字段直接插入该字段 (contributed by @ThugKd) (PR #15505)
  - 手动事务等待提交或回滚时也在工具栏显示事务状态圆点 (contributed by @ThugKd) (PR #15457)
  - 折叠的编辑器菜单中执行类动作固定排序并接入菜单自定义 (contributed by @eryajf) (PR #15363)
  - 从已保存的 Oracle 存储过程/函数源码标签页发起调试时携带对象模式、名称与类型 (contributed by @ThugKd) (PR #15458)
  - 查询结果网格与 SQL 编辑器的滚动条样式统一 (contributed by @CSXFanMeng) (PR #15453)
  - 表头排序按钮旁新增下拉箭头，点击即可选择数据库或当前页的排序方式 (contributed by @ThugKd) (PR #15392)
  - 条件筛选与文本筛选视图中显示本地值筛选摘要
  - SQL 库保存新查询的默认文件名带连接名称前缀，便于区分来源 (contributed by @ThugKd) (PR #15383)
  - MCP dbx_execute_query 普通调用返回 structuredContent.result，与批量执行和事务会话对齐 (contributed by @dienaso) (PR #15156)
  - MCP 元数据与列表类工具补充 structuredContent 结构化结果，Agent 不再需要解析 Markdown 文本 (contributed by @LwClick) (PR #15224)
  - MCP Nacos 与 Consul 工具补充 structuredContent 结构化结果 (contributed by @xiaou61) (PR #15202)
  - 历史记录中 MCP 调用详情以独立 SQL 块展示调用语句，支持语法高亮和复制 (contributed by @x-labb) (PR #15300)
  - MCP 被启动配置强制只读拦截写入时，错误信息明确指出需检查客户端启动配置 (contributed by @SuLea-IT) (PR #15335)
  - SQL 文件 TXT 失败日志的运行摘要显示实际结束时间 (contributed by @lyinglyingl) (PR #15208)
  - Web 版 SQL 执行错误改以 422 状态码返回，不再计入服务端 5xx 故警 (contributed by @caiyq925-cell) (PR #14309)
  - 「导出到数据库」的目标连接选择器与相邻选择器样式统一，长连接名不再截断 (contributed by @saskuati-dev) (PR #15536)
  - Kafka 旧驱动缺少 Broker 配置 RPC 时给出明确的驱动兼容性提示 (contributed by @ThugKd) (PR #15445)
  - 补全插件中心西班牙语翻译缺失的 22 处文案 (contributed by @0scar07) (PR #15479)
  - 补全葡萄牙语（巴西）通用翻译 (contributed by @saskuati-dev) (PR #15542)
  修复
  - 修复 MySQL 连接池换代后首次刷新误报 MYSQL_CLIENT_SESSION_LOST 的问题 (contributed by @dienaso) (PR #15240)
  - 修复 MySQL 查询结果全选后导出 SQL UPDATE 只导出当前页的问题 (contributed by @jingouzhui) (PR #15371)
  - 修复 MySQL 查询结果全量导出在临时表上报 1146 的问题，可判定只读的查询借用源会话导出 (contributed by @ThugKd) (PR #15399)
  - MySQL 数据导入支持 b'...' / B'...' 位字面量写入 BIT 列 (contributed by @lxk955) (PR #13074)
  - 修复 GoldenDB 对 COM_PING 无响应导致连接和测试连接超时失败的问题 (contributed by @wyeye) (PR #15516)
  - 修复 PostgreSQL 经事务级连接池写入时偶发 prepared statement does not exist 报错 (contributed by @ThugKd) (PR #15449)
  - 修复 PostgreSQL 文本协议路径下小于 1 的 numeric 结果缺少前导零的问题 (contributed by @LwClick) (PR #15234)
