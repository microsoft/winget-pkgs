  - 修复 MongoDB 复合 _id 文档删除未命中的问题 (contributed by @ThugKd) (PR #15446)
  - MongoDB 查询结果按全局日期格式和时区设置显示 BSON 日期 (contributed by @ThugKd) (PR #15447)
  - 修复 MongoDB 子文档单元格详情未修改也被标记修改、提交后写入转义字符串的问题 (contributed by @ThugKd) (PR #15382)
