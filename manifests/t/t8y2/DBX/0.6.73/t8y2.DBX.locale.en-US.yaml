  - 数据比较向 Oracle 生成新增行 INSERT 时每语句单行，修复多行 VALUES 触发的 ORA-00933 (contributed by @xiaou61) (PR #15450)
  - 修复 Oracle 系目标「导出到数据库」对话框把 Schema 当数据库列出、目标 Schema 只能手工输入的问题，Schema 改为可搜索下拉 (contributed by @Acd-kk) (PR #15336)
