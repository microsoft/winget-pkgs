ReleaseNotes: |-
  新功能
  - InterSystems Caché 支持 — 新建连接的内置关系型数据库列表新增 InterSystems Caché，驱动开箱即用，无需手动配置 JDBC 即可连接并浏览表结构与数据。 (commit 8b8c0b807)
  - 编辑器标签页按数据库分组 — 编辑器标签页支持按所属数据库分组展示，多库并行编辑时标签更清晰，可在编辑器设置中开关。 (contributed by @eryajf) (PR #8207)
  - 结构比较手动表映射 — 结构比较支持手动映射源库与目标库中不同名的表，不再只能按同名匹配，异构迁移对比更灵活。 (contributed by @0verme) (PR #8208)
  - 列筛选面板宽度可调 — 网格列筛选面板支持拖动调整宽度，可为筛选条件和数据展示分配合适空间。 (contributed by @eryajf) (PR #8196)
  改进
  - Redis Fetch All 收尾性能 — Fetch All 完成时改用增量收尾，大批量 Key 拉取结束后界面与滚动不再长时间无响应。 (contributed by @CN-Scars) (PR #8198)
  修复
  - 特殊页面隐藏全部标签栏 — 打开设置或驱动管理页时工作区保持挂载、仅隐藏面板内容，分组标签栏不再整体消失导致无法回到编辑器，特殊页标签同时改用经典平铺样式。 (commit 789d65d3d)
  - 特殊页面标签并入编辑器标签栏 — 设置/驱动管理页签不再单独占一条标签栏：未激活时附加在当前分组的标签栏中，激活时应用级标签栏以模式图标和非激活样式展示已打开的编辑器标签，作为回到编辑器的鼠标路径。 (commit c66a699aa)
  - 工具栏无法切换目标数据库 — 从工具栏切换连接/数据库/Schema 时按目标标签页解析，选中数据库实例新建查询后可正常切换目标库，不再误作用到其他标签页。 (commit 46afd0dd5)
  - 数据筛选无响应 — 数据网格中的执行 SQL 操作按目标标签页解析，数据筛选等相关操作恢复正常。 (commit cae4c5fde)
  - 标签溢出弹窗搜索 — 在标签溢出弹窗中搜索时不再过滤顶部标签栏已显示的标签。 (contributed by @Lem26) (PR #8201)
  - 标准 SQL 方言关键字高亮 — 通用 JDBC、IRIS/Caché、H2、DB2 等基于 StandardSQL 的方言恢复 SELECT/WHERE 等关键字与类型高亮，不再显示为普通标识符。 (commit ffe1e58fb)
  - 内置 SQL 函数高亮 — count、date_format 等内置 SQL 函数在编辑器各主题中恢复函数样式高亮。 (contributed by @q396921921) (PR #8182)
  - MySQL 系方言反斜杠转义高亮 — MySQL/MariaDB/Doris 及 Hive/Impala/Spark/Databend 等方言的编辑器高亮启用反斜杠转义，含转义引号的字符串不再被错误截断，与语句拆分语义保持一致。 (contributed by @wnyr) (PR #8181)
  - 单元格编辑器重复全选 — 单元格编辑器聚焦时只全选一次文本，再次点击定位光标不再重新全选覆盖手动选择。 (contributed by @zipg) (PR #8085)
  - 窄面板单元格详情布局 — 单元格详情面板在窄窗口及与其他面板并排时按可用空间响应式布局，内容不再溢出或挤压。 (contributed by @0verme) (PR #8200)
  - 文档弹窗关闭按钮遮挡 — 数据库文档弹窗标题为关闭按钮预留空间，关闭按钮不再遮挡标题内容。 (contributed by @0verme) (PR #8199)
  - 导出日期时间精度 — CSV 导出以文本保留完整时间精度，XLSX 改用毫秒格式，流式导出时间戳不再丢失毫秒/微秒。 (contributed by @q396921921) (PR #8162)
  - 宽松模式导出失败明细 — 宽松模式导出中个别对象失败时，完成提示逐项列出失败对象与原因，不再显示为整体成功。 (commit f661ff7ff)
  - 超大 SQL 文件打开 — 编辑器无法加载的超大 SQL 文件自动转入流式 SQL 文件执行器并给出提示，超大导出文件不再无法导入。 (commit 4cc6d0959)
  - macOS 12 启动崩溃 — 命名风格转换器移除旧 WebKit 不支持的 lookbehind 正则，macOS 12 等旧系统 WebView 启动不再崩溃。 (commit b8becde86)
  - 达梦唯一索引 DDL — 唯一约束背后的索引改用 ALTER TABLE ADD/DROP CONSTRAINT 生成 DDL（与主键一致），独立 CREATE UNIQUE INDEX 的行为不变。 (contributed by @q396921921) (PR #8170)
  - Oracle JDBC 星号展开补全 — JDBC 连接 Oracle 时字段补全解析当前 schema，SELECT * 展开可正确列出当前用户的表字段。 (contributed by @q396921921) (PR #8206)
  - 外部 JDBC 驱动表 DDL — 未识别类型的外部/自定义 JDBC 驱动查看表 DDL 时生成通用 DDL，不再报「DDL not supported for this database type」。 (commit 3be523b2f)
  - Redis Fetch All 视口保持 — Fetch All 完成后保持当前滚动位置与展开状态，不再跳回顶部。 (contributed by @CN-Scars) (PR #8204)
