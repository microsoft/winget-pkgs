ReleaseNotes: |-
  新功能
  - openGauss 开启表数据导入能力，数据页工具栏、对象浏览器与侧边栏的导入入口现在可用 (contributed by @zipg) (PR #12895)
  - 数据网格手写 WHERE 输入框在列名后支持补全运算符，并按列类型提供日期、布尔等类型化取值候选 (contributed by @hongshuo-wang) (PR #12879)
  - Oracle 与 OceanBase Oracle 支持无效对象筛选与批量编译，以及会话与锁管理 (contributed by @efeire) (PR #12773)
  - Oracle 与 OceanBase Oracle 的过程、函数和程序包支持查看双向依赖明细 (contributed by @efeire) (PR #12770)
  - 数据网格高级复制新增 DbUnit XML、PHP 数组、HTML 双 MIME 等格式，并支持配置列元数据复制与对象全限定名 (contributed by @efeire) (PR #12777)
  - 表详情列面板支持复制所选列名及带表头的元数据 TSV (contributed by @efeire) (PR #12771)
  - MySQL 连接支持 Navicat HTTP 隧道（ntunnel_mysql.php），适配无 PHP-FPM 的 CGI/FastCGI 主机 (contributed by @303562915) (PR #12494)
  - AI 助手新增选项，可选择是否在上下文中附带查询结果预览，默认关闭 (contributed by @lxk955) (PR #12776)
  - SQL 编辑器新增上一条、下一条语句及跳转到语句起始位置的导航快捷键 (contributed by @PanSHIgg) (PR #12754)
  - 侧边栏支持 F5 快捷键（可配置）刷新连接列表与数据库 (contributed by @lxk955) (PR #12780)
  - 表与对象容器右键菜单支持直接新建表分组，无需先选中表 (contributed by @lxk955) (PR #12781)
  - 本地值筛选支持按出现数量筛选，例如 count>1 筛重复、=1 筛唯一 (contributed by @lxk955) (PR #12628)
  - 连接分组右键菜单支持一键打开组内全部连接 (contributed by @lxk955) (PR #12844)
  - SQL 文件面板支持名称搜索过滤与 A-Z/Z-A 排序 (contributed by @lxk955) (PR #12840)
  - AI 助手选中的技能标签支持一键折叠与展开，不再占用对话区域 (contributed by @lxk955) (PR #12864)
  改进
  - 新增 MiniMax 配置默认使用 M3.1 Flash 模型，并支持 low/medium/high/xhigh/max 推理力度 (contributed by @octo-patch) (PR #12885)
  - 设置搜索补齐约 90 项遗漏配置与关键词，展示全部匹配结果，并支持嵌套子页导航与定位 (contributed by @eryajf) (PR #12743)
  - H2 连接 URL 输入框显示 jdbc:h2 格式占位符，不再误显 postgresql 示例 (contributed by @lxk955) (PR #12866)
  - MQTT 控制台消息轮询默认间隔调整为 1s，并支持 1/2/3/5s 刷新间隔选择 (contributed by @lxk955) (PR #12851)
  - 片段密语已在本机安全保存时隐藏密码显示按钮，避免出现无效果的控件 (contributed by @thanadon-dev) (PR #12847)
  - 查询执行期间切换结果视图时，忙碌遮罩中的已耗时显示保持连续 (contributed by @yiqiui) (PR #12842)
  - 查询出错或取消后重新执行时正常显示执行时长 (contributed by @lxk955) (PR #12767)
  - 分组右键菜单中「关闭数据库连接」默认置于数据库一级菜单首位 (contributed by @zipg) (PR #12875)
  - 页签栏重命名从 SQL 库打开的查询时，新名称同步到已保存的 SQL 文件 (contributed by @lxk955) (PR #12831)
  - 分组标签栏中当前激活的标签页增加主色调上缘高亮，多分组下更易定位 (contributed by @lxk955) (PR #12540)
  - Windows 7 离线包为 WebView2 109 启用现代颜色支持，主题、背景与高亮颜色更接近现有样式，可用环境变量回退 (contributed by @zipg) (PR #12761)
  - Kingbase 兼容模式探测不再依赖单一 catalog，按 SYS settings、PG settings 与 SHOW 顺序多路探测 (contributed by @HandSonic) (PR #12822)
  - Kingbase 探测到的兼容模式完整传递到连接元数据，前端可稳定读取 (contributed by @HandSonic) (PR #12823)
  - Kingbase 连接与重连在就绪前刷新兼容模式，避免沿用过期模式 (contributed by @HandSonic) (PR #12827)
  - Kingbase 编辑器按连接兼容模式配置语法、补全、诊断与格式化 (contributed by @HandSonic) (PR #12834)
  修复
  - 达梦原生导出/导入（dexp/dimp）规整参数文件中的 Windows 路径与引号，并在失败时展示工具真实输出，不再只报 did not report success (contributed by @yiqiui) (PR #12872)
  - 虚谷数据传输在 Agent RPC 超时后丢弃受影响会话并可恢复继续，不再中断失败 (contributed by @mapan0424) (PR #12832)
  - Kingbase 查询与 SQL 文件处理使用当前连接的兼容模式分句，不再拆开存储过程内部语句 (contributed by @HandSonic) (PR #12825)
  - Kingbase 结构化索引保留表达式、INCLUDE 列、排序与过滤条件，重建索引不再丢失语义 (contributed by @HandSonic) (PR #12806)
  - Kingbase 生成列与 identity 列元数据完整保留，不再误导出为普通 DEFAULT (contributed by @HandSonic) (PR #12805)
  - 数据传输到 DuckDB 目标保留源端 decimal 精度，修复宽数字 Conversion Error (contributed by @jeff377) (PR #12882)
  - SQL Server 仅在显式选择 Schema 时才限定未限定表名，连接默认、恢复页签或保存 SQL 带入的 Schema 不再引发 Invalid object name (contributed by @zipg) (PR #12819)
  - Kingbase 识别 jdbc:kingbase8/83/86 等 release JDBC URL，不再当作原生 DSN 透传导致连接失败 (contributed by @HandSonic) (PR #12815)
  - 导入含空白工作表的 Excel 工作簿时保留工作表选择并禁用空表任务，不再因预览空表直接失败 (contributed by @ericbyz) (PR #12738)
  - MongoDB 集合表格保存编辑后保持滚动位置与选中，不再跳回第一行 (contributed by @thailoc-dev) (PR #12810)
  - Kingbase 变量替换、参数抽取与批量执行使用当前兼容模式，避免误识别参数或拆分多库事务 (contributed by @HandSonic) (PR #12833)
  - Kingbase 语句边界保留过程块、临时表与 PG #>> 等 hash 操作符的执行范围 (contributed by @HandSonic) (PR #12828)
  - 内联 EXPLAIN 之后的查询不再被并入 EXPLAIN 语句，修复执行报语法错误 (contributed by @lxk955) (PR #12824)
  - TDengine 超级表折叠重开后保留已加载子表列表与计数，并优化大表树加载与重开性能 (contributed by @CN-Scars) (PR #12759)
  - 无主键表行定位器被引擎拒绝时自动降级为普通查询，修复 Hologres 单击无主键表报错 (contributed by @ericbyz) (PR #12687)
  - 复制行粘贴到新行时空字符串保持为空字符串，不再被写成 NULL (contributed by @yiqiui) (PR #12748)
  - SQL 文件执行全程固定同一会话，修复含 BEGIN/COMMIT 的文件跨连接执行导致的锁等待与卡死 (contributed by @dienaso) (PR #12725)
  - Redis 数据库置顶在修改别名与重连后保持有效 (contributed by @lxk955) (PR #12765)
  - 侧边栏搜索结果在折叠再展开后不再被清空 (contributed by @zhukj125) (PR #12766)
  - Oracle TNS 连接明文导出保留 TNS_ADMIN 目录，重新导入后无需重新配置 (contributed by @yiqiui) (PR #12723)
  - 数据库连接「显示全部」后系统数据库保持可见
  - 在数据库中查找首次执行时自动继续扫描剩余未扫描的表，不再提前停止
  - Phoenix 手动 classpath 接受旧版直接客户端 jar，不再误报驱动未安装
  - MySQL 存储过程源码页签执行 CREATE 时先删除再重建例程，修复修改 MySQL 8 存储过程失败
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.50 拉取。
