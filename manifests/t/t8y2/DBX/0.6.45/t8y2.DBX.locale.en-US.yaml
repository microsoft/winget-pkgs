ReleaseNotes: |-
  赞助信息
  - 用 DeepSeek 开发？多一个选择，也能少花一点：10 月 16 日起为期一周，Jalapeno Cloud 的 DeepSeek-V4-Flash-0731 限时 2 折，活动入口
  新功能
  - 新安装和未显式设置过的用户默认使用紧凑标签页标题，已明确选择完整标题的老用户通过设置迁移保留原选择 (contributed by @zipg) (PR #12311)
  - 数据网格列筛选的候选值随其他已生效筛选条件联动收敛，本地筛选和数据库筛选均支持 (contributed by @eryajf) (PR #12369)
  - 筛选面板新增自定义运算符排序对话框，可按数据库类型持久化调整运算符顺序 (contributed by @zipg) (PR #12362)
  - GaussDB 连接的 query_dop 并行设置同步应用到行数统计和分页 SQL，与主查询一致 (contributed by @AndrewDi) (PR #12300)
  - 单元格详情支持 base64 二进制内容内联预览，自动识别格式并可直接保存为文件 (contributed by @dbin0123) (PR #12210)
  - Oracle 与 OceanBase Oracle 表结构编辑器支持主键、CHECK/UNIQUE、外键约束和索引的编辑，执行前复核对象状态 (contributed by @efeire) (PR #12345)
  - 标签页右键菜单新增"保存全部标签"，一次保存所有有改动的标签 (contributed by @lxk955) (PR #12352)
  - MySQL 批量保存多个相同值的改动时把主键合并为 IN 条件，不再生成 DBA 难以接受的长 OR 链 (contributed by @Abeautifulsnow) (PR #12334)
  - 表结构编辑器的插入预设字段在编辑已有表时也可使用，不再仅限建表模式 (contributed by @lxk955) (PR #12335)
  - 执行 SQL 文件支持选择文件编码（自动检测、UTF-8、GBK、UTF-16 LE、UTF-16 BE），无需预先转码，预览与执行保持一致 (contributed by @eryajf) (PR #12285)
  - Redis 连接的高级设置支持配置值预览大小上限（1–65536 KiB，默认 64 KiB），较大的值不必再下载查看 (contributed by @zipg) (PR #12089)
  - MongoDB 查询编辑器支持 db.createView 以及用户和角色相关 shell 辅助命令 (contributed by @thailoc-dev) (PR #12234)
  - 数据传输支持按任务配置单次操作超时（秒），流式读取按无进展时间计算，不限制任务总时长
  - 侧边栏表的"克隆"操作直接打开复制为新表对话框，自动带入源表
  - MySQL 兼容连接（MariaDB、TiDB、OceanBase、TDSQL、PolarDB、GreatSQL、GoldenDB、Dolt 等）支持设置 AUTO_INCREMENT
  - 侧边栏附加信息新增"注释 + 对象大小"组合选项，同时查看对象含义与占用空间 (contributed by @eryajf) (PR #11796)
  - 每个连接的数据库提供持久化的默认查询文件 default.sql，自动保存并可从侧边栏或对象浏览器快速打开 (contributed by @eryajf) (PR #12221)
  - 待执行 SQL 预览面板支持拖拽调整大小 (contributed by @eryajf) (PR #12217)
  - 数据网格"跳转列"搜索支持模糊和精确匹配切换，便于从 id 等字段中定位目标列 (contributed by @eryajf) (PR #12216)
  改进
  - 分开展示布局按各行实际溢出状态收缩工具栏，WHERE/ORDER BY 输入区变窄时收起固定标签，把空间还给输入框 (contributed by @zipg) (PR #12276)
  - GaussDB / openGauss 加载列元数据时跳过内核必定报错的 modern 查询层，新表首次加载不再多等一次失败往返 (contributed by @xuchaoqaq) (PR #12339)
  - 数据网格状态栏的总行数操作改为下划线文字样式，不再被误认为刷新按钮 (contributed by @zipg) (PR #12245)
  修复
  - 自定义运算符排序对话框中 PostgreSQL 连接正确显示数据库名称，不再显示原始标识 postgres
  - 窄窗口下单元格详情底部面板的元数据列可正常收窄，跳转列面板贯穿表格与详情区不再留白 (contributed by @eryajf) (PR #12366)
  - SAP HANA 的 SQLScript 过程体包含相邻嵌套 CASE 表达式时不再被错误拆分为多条语句 (contributed by @zipg) (PR #12349)
  - 数据库排序为排序列追加主键决胜键，分页时同值行的顺序保持稳定 (contributed by @jeff377) (PR #12309)
  - 设置页有未应用修改时关闭标签页会先弹出确认，不再直接丢弃 (contributed by @efeire) (PR #12354)
  - 新增行中未触碰的空行不计入待提交数量和 SQL 预览，可直接删除 (contributed by @hanxuanyu) (PR #12351)
  - macOS 从完全退出状态通过连接深链启动时首次即能连接，不再需要投递两次链接 (contributed by @CN-Scars) (PR #12346)
  - SQL 预览面板中 Ctrl+C 真正复制所选内容，不再提示已复制但剪贴板为空 (contributed by @yiqiui) (PR #12341)
  - DuckDB 表的批量单元格修改改为无事务方式保存，不再报无法提供可回滚事务的错误 (contributed by @lxk955) (PR #12342)
  - 单行标签条上近满宽标签加溢出箭头时不再以每秒约 60 次闪烁 (contributed by @da-daken) (PR #12313)
  - Nacos 配置并排对比中注释文字在差异底色上清晰可读 (contributed by @eryajf) (PR #12312)
  - GaussDB A 模式未选择 schema 时也能加载列注释、主键和可编辑性等元数据 (contributed by @xuchaoqaq) (PR #12315)
  - 表数据刷新时表头索引标识不再反复消失又出现 (contributed by @xuchaoqaq) (PR #12316)
  - 标准 INSERT 导出时 PostgreSQL 数组列按数组字面量写入，导出文件可正常回放 (contributed by @jeff377) (PR #12319)
  - 数据库导出时剥离 MySQL 系统对象的 DEFINER 子句，目标环境缺少同名账号时视图等对象也能正常还原 (contributed by @HighBigSky) (PR #12330)
  - 复制含密码的连接 URL 时密码中的等号保留字面量，粘贴到不做百分号解码的工具后仍与保存的一致 (contributed by @xuchaoqaq) (PR #12333)
  - SunDB 大小写混用的表名通过驱动重试正确解析元数据，不再被误判为只读 (contributed by @zipg) (PR #12336)
  - 连接对话框切换页签后页签列表位置保持不变 (contributed by @iskyrainy) (PR #12257)
  - SQL Server 复制选中行为 INSERT/UPDATE 时超过 4000 字符的长文本不再被静默截断 (contributed by @xiaou61) (PR #12261)
  - Kingbase 的 time 类型列显示和导出为时分秒，不再带出 0000-01-01 零日期前缀 (contributed by @xiaou61) (PR #12262)
  - 排序构建器产生的排序也写入排序历史，清除后可从历史恢复 (contributed by @yiqiui) (PR #12273)
  - 达梦表结构编辑器可以查看和修改触发器正文、触发时机与事件 (contributed by @xuchaoqaq) (PR #12252)
  - 共享插件目录的桌面端与独立 MCP 宿主协调清理插件进程，Windows 回滚或卸载不再报拒绝访问错误 (contributed by @Ezreal-byte) (PR #12279)
  - CodeBuddy 供应商图标替换为官方 Logo (contributed by @mr-dadong) (PR #12284)
  - 时间戳文本包含全角数字等多字节字符时不再导致解析崩溃，按普通文本处理 (contributed by @Jacob-9909) (PR #12244)
  - InfluxDB 的"统计总行数"跨 field 列正确计数，不再无反应 (contributed by @Conastin) (PR #12250)
  - Oracle 结构同步仅存在于源库的表时，全部 DDL 引用（外键、索引等）都改写为目标 schema，不再残留源 schema (contributed by @jeff377) (PR #12248)
  - 右键菜单的二级子菜单增加指针安全缓冲区，斜向滑向子菜单途中不再意外关闭 (contributed by @hongshuo-wang) (PR #12233)
  - 拖动网格滚动条到底部后会正确触发无限滚动加载后续数据
  - 应用工具栏的新建查询按最近聚焦的侧边栏上下文创建，与侧边栏入口行为一致
  - 转置视图点击已完整可见的字段行不再滚动到顶部 (contributed by @Unclechan97) (PR #12222)
  - 未保存密码的连接被主动关闭后即遗忘本次会话的临时密码，重新打开时重新询问 (contributed by @CN-Scars) (PR #12223)
  - 自托管 Web 静态目录模式设置正确的 Cache-Control 响应头，入口页重新验证、assets 长缓存 (contributed by @CN-Scars) (PR #12220)
  - Redis、Kafka、etcd 和 RabbitMQ 页面的自动刷新控件交互与样式统一 (contributed by @eryajf) (PR #12218)
  - Oracle / OceanBase Oracle 执行过程时正确绑定 OUT 和 IN OUT 参数，带输出参数的过程不再报错 (contributed by @jeff377) (PR #12215)
  - MySQL 对含重复列名（如 SELECT id, t.* FROM t）的查询分页和排序不再报 Duplicate column name 错误 (contributed by @jeff377) (PR #12214)
  - etcd 连接隐藏通用"新建查询"入口和不适用的右键动作，不再误导 (contributed by @eryajf) (PR #12212)
  - 结构搜索的表注释命中使用独立结果预算不被字段命中挤掉，并覆盖 TDengine (contributed by @HighBigSky) (PR #12193)
  - 更新 Databricks JDBC 驱动至 3.4.3，修复驱动的多个安全问题 (PR #12209)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.45 拉取。
