ReleaseNotes: |-
  新功能
  - SQL Server 支持手动事务，可手动开始、提交、回滚事务，并兼容 SQL Server 2000 旧驱动 (contributed by @Rendegou) (PR #11100)
  - 虚谷数据库支持可视化估算执行计划 (contributed by @mapan0424) (PR #11118)
  - 执行计划结果支持导出为文件 (contributed by @poncosh) (PR #11120)
  - JSON 格式的执行计划结果在只读编辑器中展示并支持一键复制 (contributed by @saefulrahman) (PR #11123)
  - MySQL 数据库右键菜单新增清空所有表数据，按外键依赖顺序执行并汇报每张表结果 (contributed by @eryajf) (PR #11110)
  - Redis 键列表支持鼠标拖拽框选多个键 (contributed by @eryajf) (PR #11115)
  - MongoDB 查询补全支持嵌套查询操作符和选项建议 (contributed by @thailoc-dev) (PR #11113)
  - 数据网格新增可固定的列查找侧栏，可按名称快速定位目标列 (contributed by @eryajf) (PR #11116)
  - 数据网格支持按住 Alt 键用鼠标滚轮横向滚动 (contributed by @lxk955) (PR #11131)
  - SQL 编辑器支持选择打开和保存 SQL 文件时使用的编码 (contributed by @eryajf) (PR #11108)
  - 新增打开连接时直接进入查询页的设置项 (contributed by @eryajf) (PR #11097)
  - 插件可按插件粒度授权图形引擎所需的 unsafe-eval CSP 权限 (contributed by @onceMisery) (PR #11087)
  - 云同步备份选择对话框支持批量选择和分组控制 (contributed by @yaoxinghuo) (PR #11088)
  - 查询结果工具栏新增查看表 DDL 的快捷入口 (contributed by @eryajf) (PR #11090)
  - 表结构侧边栏支持预览选中列的 DDL 语句 (contributed by @eryajf) (PR #11091)
  - SQL 库支持复制粘贴查询文件，重命名时输入框自动聚焦 (contributed by @eryajf) (PR #11092)
  - SQL 导出新增保留原始语言选项，导出时解码 \uXXXX 转义 (contributed by @hanhvs) (PR #11080)
  - SQL 格式化支持配置逗号位置为前置或后置 (contributed by @lxk955) (PR #11081)
  - 仅结构传输新增执行计划摘要，执行前可查看计划概览 (contributed by @0verme) (PR #11111)
  改进
  - 数据网格"加载全部"不再受单次请求行数上限约束，可加载超过上限的数据集 (contributed by @lxk955) (PR #11096)
  修复
  - 修复旧版 JDBC 驱动（如 jTDS 连接 SQL Server 2000）getSchemas 重载缺失时抛 AbstractMethodError 导致结构加载失败的问题 (contributed by @thanadon-dev) (PR #11129)
  - 修复 Oracle q'' 自定义引号字符串在语句拆分时被从中间截断的问题 (contributed by @Tong-bit-art) (PR #11132)
  - 修复支持嵌套块注释的方言（如 PostgreSQL）在语句拆分时提前结束注释导致拆分错误的问题 (contributed by @Tong-bit-art) (PR #11121)
  - 修复光标所在语句识别未遵循方言引号与 -- 注释规则导致执行范围划分错误的问题 (contributed by @kevin9327) (PR #11083)
  - 修复语句拆分一律按 MySQL 规则将反斜杠视为引号转义的问题，PostgreSQL 等方言仅在 E'' 字符串中生效 (contributed by @Tong-bit-art) (PR #11102)
  - 修复 PostgreSQL 含反斜杠的数组字面量生成 SQL 时未按转义字符串（E''）引用的问题 (contributed by @kevin9327) (PR #11094)
  - 修复 PostgreSQL 统计信息被清零（pg_stat_reset、pg_upgrade 等）后行数估算误显示为 0 的问题，此时回退使用 reltuples (contributed by @yiqiui) (PR #11098)
  - 修复 PostgreSQL 导出 SQL 时自增列 identity 值与序列当前状态丢失的问题 (contributed by @Ethereal49) (PR #11095)
  - 修复执行 SQL 后编辑器视口被滚动重置的问题，光标原本可见时保持视口不变 (contributed by @yiqiui) (PR #11125)
  - 修复首页介绍页多项细节（logo 尺寸、导入来源选择等），并改进设置搜索结果的高亮定位 (contributed by @zipg) (PR #11136)
  - 修复数据网格跳转到超出已知总行数的页时总行数显示不准确的问题，现会重新核对精确总数 (contributed by @yiqiui) (PR #11099)
  - 修复 SQL 风险分级与 AI 执行策略扫描未按方言解析注释和字符串转义、可能把写操作误判为只读的问题 (contributed by @Tong-bit-art) (PR #11101)
  - 修复生产环境保护扫描未按连接方言解析注释与转义（如 SQL Server 的 # 临时表、PostgreSQL 的反斜杠）导致漏判写操作的问题 (contributed by @Tong-bit-art) (PR #11103)
  - 修复前端生产环境 SQL 扫描未使用连接方言词法规则、与后端安全判定不一致的问题 (contributed by @Tong-bit-art) (PR #11119)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.35 拉取。
