ReleaseNotes: |-
  新功能
  - 新增星环 Transwarp Inceptor 数据源，支持元数据浏览、SQL 执行、表结构编辑、数据导入与传输，建表可配置分区、分桶、存储格式与事务表 (contributed by @HandSonic) (PR #10521)
  - 云同步新增选择性备份与恢复，连接与 SSH、共享隧道、保存的 SQL、个人设置、敏感信息、插件数据和工作区布局均可按需勾选备份或恢复 (contributed by @ma123456mai) (PR #10500)
  - DuckDB 连接的表导入新增 Parquet 格式，可预览并导入 Parquet 文件 (contributed by @Abeautifulsnow) (PR #10473)
  - SQL 文件导出支持选择列，可只导出部分字段
  - SQL 库中的文件支持批量修改所属连接与数据库
  - AI 对话新增独立字体设置，可单独调整会话内容字体
  - 内置 AI 智能体新增 Redis 只读工具，可在对话中查询已连接 Redis 的数据 (contributed by @Abeautifulsnow) (PR #10510)
  - 插件的 MCP 工具可在内置 AI 与外部 dbx MCP 服务器中选用，外部服务器以统一前缀暴露插件工具 (contributed by @jinpy666) (PR #10376)
  - 编辑器标签页按连接显示颜色，手动配置的连接颜色优先，未配置时按连接稳定生成 (contributed by @eryajf) (PR #10529)
  - 编辑器新增双击字符串选择模式设置，可选「整段内容」或「单个单词」 (contributed by @zipg) (PR #10424)
  - 数据表筛选条件的值输入框新增数据库候选值下拉，支持搜索、多选与全选 (contributed by @hewenkkkkk) (PR #10405)
  - SSH 连接读取 ~/.ssh/config 时支持 Include 指令，覆盖相对、绝对、glob 与嵌套形式 (contributed by @zipg) (PR #10498)
  - MongoDB 补全为字段到值映射参数提示可接受的候选值 (contributed by @thailoc-dev) (PR #10466)
  - 插件新增设置快捷入口，拖动面板时自动避让屏幕边缘 (contributed by @Ezreal-byte) (PR #10452)
  改进
  - OceanBase Oracle 模式的 CSV 导入改用 INSERT ALL 批量写入，导入速度显著提升 (contributed by @yangziyu1230) (PR #10509)
  修复
  - Manticore 索引元数据查询语法修正，索引信息正常加载 (contributed by @CN-Scars) (PR #10530)
  - PostgreSQL 编辑 timestamp 列精度时保留时区属性，timestamptz 不再降级为 timestamp
  - 重启后恢复的 PostgreSQL 表数据标签页保留 schema 限定标识，结果提交保存不再报 relation 不存在
  - PostgreSQL 被外键引用的独立唯一索引不再被误判为约束索引，备份导出不再遗漏该索引 (contributed by @zipg) (PR #10493)
  - PostgreSQL 表行数显示改用实时估算并在统计过期时自动刷新，不再停留在旧缓存值 (contributed by @zipg) (PR #10479)
  - Oracle 执行 SQL 文件时保留已选 schema，「数据库选择无效」报错消除
  - 分卷 ZIP 中的 SQL 脚本跨分卷语句完整保留，不再被截断丢失 (contributed by @hanhvs) (PR #10489)
  - PL/SQL 匿名块按分号拆分时保留双引号标识符，达梦存储过程执行不再报错 (contributed by @zipg) (PR #10445)
  - Neo4j 按服务端版本选择节点标识函数，4.x 与 3.5 打开表数据恢复正常 (contributed by @zipg) (PR #10514)
  - 单机 Neo4j（Bolt 3）在路由报错时自动回退直连，连接恢复正常 (contributed by @zipg) (PR #10447)
  - MongoDB 无 listDatabases 权限时回退显示账号已授权的数据库 (contributed by @zipg) (PR #10511)
  - MongoDB 补全在无参数模型的参数位置不再给出错误建议 (contributed by @thailoc-dev) (PR #10421)
  - SQL Server 二进制列导出为 0x 十六进制字面量，导回不再报隐式转换错误 (contributed by @zipg) (PR #10450)
  - SQL Server 存储过程中声明的局部变量支持补全
  - StarRocks CSV 导入保留 JSON 数组内容，不再被错误转义
  - Cassandra 表数据与导出改用游标分页，多页数据翻页不再报错
  - Cassandra 物化视图正确返回 DDL 定义
  - kvrocks 的 bitmap 与 HyperLogLog 键可正常查看值 (contributed by @HighBigSky) (PR #10416)
  - DB2 连接忽略连接信息中误留的驱动注册 id，连接不再报 ClassNotFoundException (contributed by @zipg) (PR #10440)
  - 大型 SQL 文件的语法分析移出输入路径，编辑大文件不再卡顿
  - SQL 补全在 select 列表中的函数调用内也能建议列名
  - FROM、JOIN 等表引入位置的关键字补全修正 (contributed by @mr-dadong) (PR #10430)
  - SQL 格式化保留括号包裹的 UNION ALL 分支，不再被整体丢弃 (contributed by @zipg) (PR #10481)
  - 编辑器全选后点击空白处可正常取消选区 (contributed by @zipg) (PR #10491)
  - Cursor 配色主题的选中背景加深，选中文本更易辨认 (contributed by @mr-dadong) (PR #10465)
  - CSV/TSV 导出 NULL 默认写为 \N 且提供设置项，空字符串导回不再被还原成 NULL (contributed by @zipg) (PR #10508)
  - 「CSV NULL 表示」设置说明改为直接描述两种写法，不再指代旧版本 (contributed by @zipg) (PR #10525)
  - datetime、date、time 单元格编辑期间 Ctrl+S 可正常提交并保存 (contributed by @zipg) (PR #10519)
  - 「复制全部列名」不再带出网格内部的主键辅助列 (contributed by @zipg) (PR #10485)
  - 网格加载耗时统一保留一位小数，加载中与完成后显示不再跳动 (contributed by @zipg) (PR #10443)
  - 数据生成的手机号长度不超过列定义长度，MySQL 等短字符列生成数据不再失败
  - 插件市场卡片完整显示插件名称 (contributed by @ma123456mai) (PR #10523)
  - 插件市场卡片自适应窄面板与矮窗口布局 (contributed by @Lan-zk) (PR #10444)
  - MCP 中创建、复制或删除连接后，桌面端连接列表即时同步刷新 (contributed by @Ezreal-byte) (PR #10531)
  - MCP 桥接收到完整请求后立即处理并返回，不再等待额外数据导致调用端超时 (contributed by @CN-Scars) (PR #10494)
  - AI 输入区控件在窄面板下自适应收纳，不再溢出 (contributed by @eryajf) (PR #10528)
  - 数据传输中被隔离的代理会话自动续期且无需重放，OceanBase 间长任务不再中断
  - 窄窗口下设置页可滚动，驱动管理「存储」标签页内容不再被裁掉 (contributed by @zipg) (PR #10428)
  - 「双击字符串选择」设置去掉冗余的「（默认）」标注，下拉宽度自适应 (contributed by @zipg) (PR #10513)
  - 超宽的单行提示气泡自动换行，长标题不再被截断 (contributed by @zipg) (PR #10453)
  - 不支持数据库切换的插件标签页不再显示数据库提示 (contributed by @OOMEcho) (PR #10433)
  - 驱动运行时的停止提示改为「关闭关联连接」，不再仅指数据库连接 (contributed by @OOMEcho) (PR #10469)
  安装
  - 新增 fnOS 应用包（FPK），Release 资产提供 DBX Web 的飞牛 OS 安装包与校验文件 (PR #10389)
  赞助信息
  - Jalapeno Cloud 24 小时闪购：充 $50 到账 $80（多送 60%），9 月 30 日仅此一天，当天充值满 $50 一律返 60% 额度，活动入口
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.27 拉取。
