ReleaseNotes: |-
  新功能
  - SQL 文件面板的搜索支持匹配文件内容，命中行以带行号和高亮的片段展示，点击可直接定位到对应位置 (contributed by @Abeautifulsnow) (PR #13060)
  - MySQL 表结构编辑器支持粘贴逗号分隔的字段定义或多条 ALTER TABLE 语句，预览确认后一次性加入当前表草稿 (contributed by @eryajf) (PR #13229)
  - 数据库备份新增 Navicat .nb3 格式的备份与恢复，并支持导入、恢复 DBX 之外创建的备份文件 (contributed by @FrederykAbryan) (PR #13210)
  - Elasticsearch 连接新增 API Key 认证方式，支持直连和 Kibana 代理传输 (contributed by @seth-shi) (PR #13230)
  - SSH 隧道层支持固定本地端口，连接打开期间其他本地工具可复用 DBX 已建立的隧道 (contributed by @HabibAlmaula) (PR #13013)
  - 外部 SQL 文件面板支持同目录拖拽排序，提供手动、名称升序和名称降序三种模式并本地持久化 (contributed by @eryajf) (PR #13322)
  - 关联磁盘文件的查询标签新增「在 SQL 文件列表中定位」右键菜单，可在文件面板中展开并高亮对应文件 (contributed by @eryajf) (PR #13079)
  - SQL 编辑器查找面板新增全字匹配开关，可与大小写和正则开关组合使用 (contributed by @xiaou61) (PR #13297)
  - SQL 编辑器及单元格详情等编辑器支持触控板双指捏合缩放字号 (contributed by @kkwangxx) (PR #13260)
  - Oracle 数据页为 CLOB/BLOB 列提供有界预览，大 LOB 表打开更快，双击单元格可加载完整值 (contributed by @Conastin) (PR #13105)
  - Oracle 系数据库（Oracle、OceanBase Oracle、DM）新增 TYPE 与 TYPE BODY 的浏览、受控编辑、删除和依赖迁移 (contributed by @efeire) (PR #13070)
  - Oracle 系数据库新增 Schema 级索引管理入口，可集中搜索、新建和编辑索引 (contributed by @efeire) (PR #13069)
  - Oracle / OceanBase Oracle 表属性与源码详情新增对象关系查看，包括双向依赖、双向外键和子对象 (contributed by @efeire) (PR #13068)
  - Oracle / OceanBase Oracle 例程接入结构比较工作流，支持严格比较、受控部署与执行后的可信读回 (contributed by @efeire) (PR #13089)
  - Oracle / OceanBase Oracle 进程列表新增会话诊断，可查看 SQL 来源、执行计划、统计等待和长操作 (contributed by @efeire) (PR #13104)
  - 虚谷数据库之间的数据传输支持视图、存储过程、函数、触发器、包、序列和同义词等选定对象，按依赖顺序规划执行 (contributed by @mapan0424) (PR #13231)
  改进
  - SQL 库与 SQL 文件面板的搜索统一提供「文件 / 内容」两种范围，默认按文件名过滤，不再将名称与正文命中混在一起 (contributed by @eryajf) (PR #13244)
  - 数据比较读取 SQL Server 与 PostgreSQL 大表改为按键值分页，不再每页重复扫描前序行，并将默认分页大小提升到一万行 (contributed by @BrydonJ) (PR #13300)
  - 大批量数据比较与同步不再长时间阻塞界面，差异列表改为虚拟滚动、SQL 安全分析移入 Worker 执行 (contributed by @ordinary-s) (PR #13323)
  - MySQL 自动分页取消额外的下一行探测，避免带日期函数等过滤条件的查询在末页扫描大量数据导致迟迟不出结果 (contributed by @Acd-kk) (PR #13256)
  - 系统 Java 版本低于 21 时启动 JDBC 插件，现在会明确提示需要 Java 21 并给出检测到的版本与路径，不再只报插件退出 (contributed by @lhxone) (PR #13262)
  - Redis 严格服务同时禁用 STRLEN 时，字符串预览快速失败并返回原始错误，不再重复发送必然被拒的请求 (contributed by @Gaiokane) (PR #13214)
  - SQL 补全在 FROM 表引用后输入 wh 等前缀时，WHERE、GROUP BY 等子句关键词排在函数和过程之前 (contributed by @Abelo9996) (PR #13207)
  - 连接悬停详情中的服务端版本统一显示 v 前缀（如 v8.0） (contributed by @Acd-kk) (PR #13213)
  - 标签页详情悬浮提示改用与侧边栏信息卡一致的主题样式 (contributed by @eryajf) (PR #13304)
  - 数据表格列头字段信息提示框改用主题感知配色，改善浅色主题下字段类型文字的可读性 (contributed by @eryajf) (PR #13295)
  - 左侧连接树支持横向滚动与 Shift＋滚轮平移，长名称、注释和附加信息可以查看完整内容 (contributed by @eryajf) (PR #13215)
  修复
  - 修复右键导出结果集时把整个编辑器文档当作单条查询、导致多语句（含 CTE）文档导出被拒绝的问题，现在只导出右键所在的语句
  - 修复导出 CSV 等电子表格兼容格式时负数被公式转义、在 Excel 中显示为文本的问题 (contributed by @Totopo27) (PR #13325)
  - 修复 Redshift 查看表 DDL 报 pg_foreign_table 不存在、查看存储过程定义报 prokind 列不存在的问题 (contributed by @Tong-bit-art) (PR #13324)
  - 修复 Oracle 手动事务下查询结果跳转末页或上一页时重复显示首页、总数误判的问题 (contributed by @ordinary-s) (PR #13316)
  - 修复 Oracle 表包含 SDO_GEOMETRY 等空间类型列时打开数据页或执行分页查询报 TTC 错误的问题 (contributed by @Tong-bit-art) (PR #13248)
  - 修复 MySQL 修改表字符集时预览整表重建脚本、保存失败（错误 1050）的问题，现在只生成 DEFAULT CHARACTER SET 变更 (contributed by @Xcylway) (PR #13257)
  - 修复 MySQL 例程定义开头的外层标签（如 run:BEGIN、lbl:LOOP）被误认为命名参数、执行时弹出参数对话框并可能破坏定义的问题 (contributed by @lcq928) (PR #13247)
  - 修复金仓存储过程列表为空、带 INOUT 参数的过程被误分为函数、同名重载在树中合并及源码查看歧义的问题 (contributed by @Ezreal-byte) (PR #13053)
  - 修复 WITH（CTE）查询结果点击列头排序时提示不支持全量排序的问题，现在将 ORDER BY 追加到主查询 (contributed by @Abelo9996) (PR #13205)
  - 修复 SQL Server 向其他数据库传输数据时 varchar(max)/nvarchar(max) 建表报错、timestamp/rowversion 列写入失败的问题 (contributed by @Abelo9996) (PR #13199)
  - 修复 SQL 补全在 JOIN ... ON 条件完成后输入 w 时 WHERE 等子句关键词不在候选列表前排的问题 (contributed by @xiaou61) (PR #13298)
  - 修复 JDBC 连接按表注释搜索过滤时匹配不到结果的问题，现在表名和注释都参与匹配 (contributed by @Totopo27) (PR #13108)
  - 修复 GaussDB 100（Zenith）通过通用 JDBC 连接时侧边栏无法获取 schema、表、列和索引等元数据的问题 (contributed by @lhxone) (PR #13253)
  - 修复 HighGo（MySQL 协议）表数据预览因不支持 left() 函数而报错的问题，失败后自动改用无 left() 包装的预览重试 (contributed by @dienaso) (PR #13246)
  - 修复 PostgreSQL 结构比较将 timestamp 与 timestamp(6) 等默认时间精度视为不同类型、生成多余 ALTER COLUMN 的问题 (contributed by @jeff377) (PR #13218)
