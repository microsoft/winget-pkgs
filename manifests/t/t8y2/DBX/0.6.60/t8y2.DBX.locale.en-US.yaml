ReleaseNotes: |-
  赞助信息
  - Jalapeno Cloud × DBX 优惠即将下线：限时五折等活动仅剩 2 天，平台还有更多折扣与上新模型，活动入口
  新功能
  - MCP 插件工具面实现零配置：声明 external_tools 的插件只读级工具默认可用、连接访问按保护级别缺省授权，安装插件后无需手工配置即可调用，已保存的策略始终优先 (contributed by @jinpy666) (PR #13789)
  - 表格导入新增「出错时继续」开关，失败行逐行重试并报告具体错误，不再因个别行失败中止整批导入 (contributed by @Abeautifulsnow) (PR #13790)
  - 更新中心新增更新日志页签，可随时查看各版本的变更记录 (contributed by @spiritlord) (PR #13810)
  - 数据网格字段筛选弹窗新增「显示选中」，可只保留当前搜索匹配的字段并隐藏其余字段 (contributed by @eryajf) (PR #13367)
  - SQL 库和 SQL 文件面板记住目录展开状态，关闭重开后不再恢复折叠 (contributed by @lxk955) (PR #13740)
  - PostgreSQL 新建表界面支持创建外部表，可选择或输入外部服务器并配置 FDW 选项 (contributed by @Acd-kk) (PR #13766)
  - Kafka 连接支持 dbx:// 深链接预填，host/port、bootstrap_servers 与认证参数可直接带入新建连接表单 (contributed by @Chow-Code) (PR #13770)
  - 备份计划选择数据库改为可视化展示：选中数量徽标、芯片式快速移除、仅看选中过滤和批量选择 (contributed by @lxk955) (PR #13792)
  - MySQL 连接新增只读兼容编码模式（GBK/GB18030/BIG5，默认关闭），可读取 latin1 文本列中保存的遗留编码字节 (contributed by @CN-Scars) (PR #12602)
  - SAP HANA 支持表数据导入
  改进
  - CockroachDB 补全支持 SHOW 语句上下文并按方言区分关键字范围 (contributed by @Pius-x) (PR #13269)
  - 结果导出菜单按格式分组并明确「选中行/当前页/全部结果」导出范围，连接高级页可按连接控制数据库链接、原生作业、用户与权限入口 (contributed by @efeire) (PR #13600)
  - 转置视图默认显示字段类型与注释，悬停始终可查看，并提供工具栏开关 (contributed by @lxk955) (PR #13705)
  - 配置高透明壁纸时，页内搜索输入框聚焦后改用不透明背景，文字不再难以辨认 (contributed by @lxk955) (PR #11583)
  - Linux 文件对话框改用 XDG Desktop Portal，KDE 等桌面使用原生文件选择器并支持地址栏输入路径 (contributed by @onenewcode) (PR #6981)
  - Redis 字符串预览越界时的错误信息会说明长度读取失败的具体原因 (contributed by @Gaiokane) (PR #13273)
  - 侧边栏搜索的匹配方式选项收进「排序与筛选」菜单、Redis 导入文案缩短，搜索框可用宽度增加 (contributed by @zipg) (PR #13682)
  - Kafka 图标更换为 Apache Kafka 官方标志，深色主题下更清晰 (contributed by @lxk955) (PR #13785)
  - 查询结果消息区支持点选、拖选和全选复制，长输出可完整复制 (contributed by @zipg) (PR #13777)
  - 表结构编辑器字段搜索支持忽略下划线和驼峰的模糊匹配，与其他选择器一致 (contributed by @MingZhe1008) (PR #13768)
  - 手动事务中的结果导出无法分页时，错误提示明确指出原因是手动事务占用连接 (contributed by @hongshuo-wang) (PR #13519)
  修复
  - 修复 Oracle 原生作业页面因 Go 驱动缺少 connection_info 而无法加载的问题 (contributed by @zipg) (PR #13769)
  - 修复驱动不支持 connection_info 时原生作业直接报运行时标识失败的问题，改为回退会话用户信息 (contributed by @lxk955) (PR #13748)
  - 修复 Oracle 包体成员与多行表达式的格式化缩进错乱问题 (contributed by @imcman) (PR #13798)
  - 修复超大 PL/SQL 包体编译前拆分耗时数分钟的问题，改为线性时间拆分 (contributed by @thailoc-dev) (PR #13666)
  - 修复 OceanBase Oracle 模式下无法查看包体实现的问题 (contributed by @lxk955) (PR #13716)
  - 修复 SQL Server 无主键表保存时 rowversion/timestamp 二进制值被写成带引号字符串、报转换错误的问题 (contributed by @gibbsfreeenergy) (PR #13270)
  - 修复 MySQL 克隆大表缺少后台进度与取消入口、完成后已打开数据页仍显示为空的问题 (contributed by @zipg) (PR #13788)
  - 修复 openGauss MySQL 兼容模式双击表报语法错误的问题，标识符引号按兼容模式推导 (contributed by @Tong-bit-art) (PR #13803)
  - 修复 Windows 上达梦 dexp/dimp 导出因文件路径形式被拒、创建导出文件失败的问题 (contributed by @Tong-bit-art) (PR #13797)
  - 修复 TDengine 子表过多时侧边栏分页被单个超级表的子表占满、其余超级表不显示的问题 (contributed by @lxk955) (PR #13753)
  - 修复 PostgreSQL 关键字样式表名（如 apply、filter）导致字段补全丢失的问题 (contributed by @lcq928) (PR #13751)
  - 修复 Oracle 系 JDBC 连接的数据库浏览器页面不显示 schema、提示无数据库的问题 (contributed by @lxk955) (PR #13721)
  - 修复 JDBC 列补全把父表名中的下划线和百分号当通配符匹配、返回其他表字段的问题 (contributed by @efeire) (PR #13802)
  - 修复 JDBC 外部驱动连接多行编辑保存时报不支持批量事务的问题 (contributed by @dd-xiaozhi) (PR #13775)
  - 修复 Redis 哈希/集合首次加载更多只取到溢出缓冲区零星条目、不足一整页的问题 (contributed by @lxk955) (PR #13102)
  - 修复 Redis 键列表操作区在扫描结束后消失、无法继续加载或重新扫描的问题，并补齐全量扫描键的类型与过期信息 (contributed by @Gaiokane) (PR #13752)
  - 修复编辑连接保存后 Redis 数据库别名和默认 schema 被清空的问题 (contributed by @Acd-kk) (PR #13096)
  - 修复数据对比固定 30 秒超时、大表必然失败的问题，改为遵循连接的查询超时设置 (contributed by @dienaso) (PR #13364)
  - 修复数据网格清空数值单元格后被保存为 0 而非 NULL 的问题 (contributed by @MomentarySixthSense) (PR #13772)
  - 修复刷新丢弃排序后列头排序图标仍点亮、与实际数据顺序不符的问题 (contributed by @HighBigSky) (PR #13371)
  - 修复跳转列搜索结果排序不当、模糊子序列匹配排在真正前缀匹配之前的问题 (contributed by @lxk955) (PR #13103)
  - 修复多个查询结果时「导出全部数据」只导出当前分页、丢失其余结果的问题 (contributed by @misxzaiz) (PR #13782)
  - 修复导出取消后后台迟迟不确认结束时任务无法移除、后续队列被卡住的问题，提供风险确认后的人工恢复 (contributed by @efeire) (PR #13805)
  - 修复同日重复执行备份计划时因 dbx 自身清理了日期目录而报目录缺失、运行失败的问题 (contributed by @dienaso) (PR #13722)
  - 修复远端检查返回无更新时已下载的升级包失去安装入口、更新角标无法消除的问题 (contributed by @Tong-bit-art) (PR #13793)
  - 修复 Ctrl+H 逐项替换跳过匹配、只替换第 1、3、5… 个的问题 (contributed by @lxk955) (PR #13732)
  - 修复自动别名补全确认后把正在输入的表名替换成别名缩写的问题 (contributed by @lxk955) (PR #13757)
  - 修复 Ctrl/Cmd+滚轮缩放幅度过大、单次滚动字号直接跳到上限的问题，并显示缩放百分比 (contributed by @L494264Tt) (PR #13759)
  - 修复中文输入法和小键盘除号键下 Ctrl+/ 行注释快捷键无效的问题 (contributed by @lxk955) (PR #13778)
  - 修复插件终端内 Ctrl+W 被宿主关闭标签页抢占、无法删除单词的问题 (contributed by @Evvvvvvvan) (PR #13664)
  - 修复同时打开多个插件标签页时非激活页几何尺寸塌陷、切回后界面停留在角落的问题 (contributed by @lxk955) (PR #13771)
  - 修复全局搜索只搜索活动连接、遗漏其他已连接数据库同名表的问题 (contributed by @spiritlord) (PR #13763)
  - 修复「总是选中打开项」设置不生效、切换标签后侧边栏高亮不动的问题 (contributed by @lxk955) (PR #13706)
  - 修复按类型过滤侧边栏时未加载的连接和分组被清空、无法展开任何连接的问题 (contributed by @lxk955) (PR #13762)
  - 修复排序模式下连接分组和嵌套分组不参与排序的问题 (contributed by @lxk955) (PR #13743)
  - 修复附加数据库文件后选中状态残留、新附加的数据库不高亮的问题 (contributed by @heeeex100) (PR #13277)
  - 修复对象浏览器未应用侧边栏已保存的名称过滤器、被过滤对象仍显示的问题 (contributed by @jingouzhui) (PR #13767)
  - 修复删除数据库被其他会话阻塞时直接显示引擎原始错误、看不出原因的问题 (contributed by @thailoc-dev) (PR #13746)
  - 修复侧边栏横向滚动时提示框定位到可视区域外、悬浮到编辑器上的问题 (contributed by @lxk955) (PR #13723)
  - 修复连接与分组行不遵守「允许侧边栏横向滚动」设置、备注挤压行内控件的问题 (contributed by @zipg) (PR #13781)
  - 修复非活动标签分组的标题不随标签一起变暗、无法分辨活动分组的问题 (contributed by @yiqiui) (PR #13390)
  - 修复关闭活动标签后其他分组被自动展开、折叠状态意外丢失的问题 (contributed by @ayang875) (PR #13761)
  - 修复置顶文件夹标题遮挡面板分隔线的问题 (contributed by @lxk955) (PR #13703)
  - 修复对象类型过滤器过多时挤压搜索输入框、几乎无法输入的问题 (contributed by @lxk955) (PR #13704)
  - 修复 MCP 权限页签栏出现多余纵向滚动条的问题 (contributed by @TaroXin) (PR #13680)
  - 修复表结构编辑器不同数据类型行高不一致、无单位字段行被压扁的问题 (contributed by @lxk955) (PR #13699)
  - 修复混合显卡（核显 + NVIDIA 独显）Linux 笔记本上误禁用 DMABuf 渲染、界面滚动卡顿的问题 (contributed by @sedax90) (PR #13365)
