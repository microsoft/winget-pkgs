ReleaseNotes: |-
  新功能
  - MCP 执行高风险 SQL 前会在桌面端弹窗确认 (contributed by @caichangqing1120) (PR #10296)
  - 支持一次复选多个连接同时备份 (contributed by @peakxy) (PR #11507)
  - 连接支持配置空闲超时，按设定时间回收连接池中的空闲连接 (contributed by @lxk955) (PR #11130)
  - 结果集转置支持只作用于选中行并保留选区范围 (contributed by @eryajf) (PR #11514)
  - SQL 格式化设置新增经典版式风格可选 (contributed by @Abeautifulsnow) (PR #11395)
  - SQL 文件标签页新增定位当前打开文件的按钮 (contributed by @ninggc) (PR #11499)
  - 批量选择列插入 SELECT 时逐行附带列注释 (contributed by @lxk955) (PR #11590)
  - AI 内置服务商预设新增 HiAPI，AstraFlow 预设更新为免费额度领取入口
  - Firebird 新增对象管理器 (contributed by @zipg) (PR #11529)
  - 虚谷数据库之间支持原生表传输 (contributed by @mapan0424) (PR #11508)
  - OceanBase Oracle 模式支持为无主键表添加主键 (contributed by @efeire) (PR #11393)
  - OceanBase Oracle 数据生成支持 INSERT ALL 批量写入 (contributed by @efeire) (PR #11388)
  改进
  - WebDAV 自动上传间隔上限放宽至最长一年，并按小时/天单位友好显示 (contributed by @ma123456mai) (PR #11655)
  - SQL 关键字补全优先给出尚未配对的关键字组合，如 CROSS JOIN、ORDER BY (contributed by @lxk955) (PR #11585)
  - 表自动补全遵循格式化设置的标识符大小写 (contributed by @lxk955) (PR #11524)
  - 云同步选择对话框优化交互并修正凭证数量统计 (contributed by @yaoxinghuo) (PR #11488)
  修复
  - 修复结果集多段加载全部时提前终止的问题 (contributed by @lxk955) (PR #11591)
  - 修复 WHERE 字段建议首项未默认选中的问题 (contributed by @eryajf) (PR #11515)
  - 修复用户手动断开的连接被管理面板等页面自动重连的问题 (contributed by @Abeautifulsnow) (PR #11598)
  - 修复新建 SQL 编辑器未继承当前活动上下文的问题 (contributed by @0verme) (PR #11596)
  - 修复手动事务的旧提交结果误清空新事务会话的问题 (contributed by @efeire) (PR #11426)
  - 修复 Excel 流式导入未按自定义标题行和前置空单元格偏移解析的问题 (contributed by @lxk955) (PR #11593)
  - 修复导入 DataGrip 连接时用户名未带出且回退默认值无提示的问题 (contributed by @lxk955) (PR #11510)
  - 修复传输覆盖目标表时未先清空外键关联子表数据的问题 (contributed by @jeff377) (PR #11526)
  - 修复 macOS 备份通知显示错误文本的问题，现显示应用名称 (contributed by @ma123456mai) (PR #11599)
  - 修复 MCP 自动更新完成后工具栏更新按钮未保持隐藏的问题 (contributed by @zipg) (PR #11532)
  - 修复 Linux 无边框窗口圆角、阴影和边缘调整把手未绘制的问题 (contributed by @cseda-gullivernet) (PR #11142)
  - 修复 MongoDB 插入和复制文档时自定义 _id 未保留的问题 (contributed by @lxk955) (PR #11586)
  - 修复 MySQL 批量选择列插入时列名未加引号的问题 (contributed by @eryajf) (PR #11528)
  - 修复 SQL 编辑器 INSERT 模板字符串占位符超出列声明长度的问题 (contributed by @xiaohuowa) (PR #11411)
  - 修复 Kingbase V8 缺少表大小函数时表大小无法显示的问题，现回退按页估算 (contributed by @eryajf) (PR #11410)
  - 修复 Kyuubi 切换连接数据库时未使用引擎标识符引号的问题 (contributed by @lxk955) (PR #11520)
  - 修复 PostgreSQL json 与 jsonb 单元格未保留服务端原始文本的问题 (contributed by @RealDewKJ) (PR #11516)
  - 修复 SQL Server 2005 及以上使用旧版兼容驱动时无法读写表和列注释的问题 (contributed by @jeff377) (PR #11661)
  - 修复 Oracle DBLink 判定误吞普通表达式和 DDL 参数的问题 (contributed by @efeire) (PR #11588)
  - 修复 Oracle 手动事务会话未应用当前 schema 的问题 (contributed by @jeff377) (PR #11399)
  - 修复 Oracle 补全缺少序列与伪列支持的问题 (contributed by @lxk955) (PR #11589)
  - 修复 Oracle 伪列被语义诊断误报为未知列的问题 (contributed by @onenewcode) (PR #11506)
  - 修复 Oracle 显示数据库链接选项的关闭偏好未持久化的问题 (contributed by @jeff377) (PR #11419)
  - 修复 OceanBase Oracle 模式含通配符或 ROWID 的查询分页偏离原结果游标的问题 (contributed by @efeire) (PR #11587)
  - 修复 OceanBase Oracle 模式 ROWID 查询定位与行映射错误的问题 (contributed by @efeire) (PR #11389)
  - 修复 OceanBase Oracle 模式模板与补全丢失必要引号的问题 (contributed by @efeire) (PR #11392)
  - 修复 OceanBase Oracle 模式列字符单位与 NUMBER 负 scale 信息丢失的问题 (contributed by @efeire) (PR #11391)
  - 修复 OceanBase Oracle 传输不支持 Upsert 和新表注释的问题 (contributed by @efeire) (PR #11387)
  - 修复数据网格表元数据加载与查询 DDL 未使用当前可见 schema 的问题 (contributed by @lxk955) (PR #11518)
  - 修复结构页签切换后水平滚动条消失的问题 (contributed by @zipg) (PR #11582)
