ReleaseNotes: |-
  赞助支持
  - Jalapeno Cloud × DBX 新用户福利 — 经产品内专属入口注册即送 $1 额度，自动到账。点此访问
  - 联名充值加赠 — 充值享 20% 额外赠送，可与 GLM 5.2 五折同享。活动时间 9 月 1 日 – 11 月 1 日。
  - 全场普惠折扣 — DS V4 Flash 官网 2 折（9 月 6 日截止）、GLM 5.3 Flash 五折（9 月 13 日截止），所有用户可享。
  新功能
  - InfluxDB 3.x 引擎 — InfluxDB 连接卡片新增 3.x 版本选项，通过 HTTP /api/v3/query_sql 直接查询和浏览时序库，无需额外重型依赖。 (contributed by @Clarence404) (PR #7744)
  - ArgoDB 连接类型 — 新增 ArgoDB（星环 Inceptor）连接类型，通过 system.procedures_v / system.functions_v 浏览存储过程与函数目录，原生 Hive 行为保持不变。 (contributed by @wangfengxiang) (PR #7680)
  - SQL Server 2000 兼容 — 完善 SQL Server 2000 的连接、TLS 回退、查询、分页、筛选、搜索、补全与导出兼容路径；legacy 通道使用 jTDS 1.3.1，并修复空 varchar 显示为全 NUL 字符和存储过程查看源码报错。 (contributed by @zipg) (PR #7581)
  - Xugu 表空间与数据文件 — 虚谷连接树新增只读「表空间」与「数据文件」节点，可直接查看存储布局元数据，权限不足时自动降级不影响连接树加载。 (contributed by @mapan0424) (PR #7655)
  - DML 变更预览 — 编辑器对 INSERT/UPDATE/DELETE 新增「预览」操作：改写为只读 SELECT 展示将被影响的行，并附带展示变更后新值的 new_value 列，执行前即可核对影响范围。 (contributed by @doersa) (PR #7716)
  - 标签栏布局配置 — 标签栏支持上、下、左、右四个位置，侧边标签栏支持纵向滚动与按标签名/连接名搜索；可按数据库类型或连接分组，按手动顺序、创建时间或标签名排序，设置持久化保存。 (contributed by @eryajf) (PR #7570)
  - 侧边栏批量操作 — 多选表/视图后支持批量复制表名（可配置分隔符与是否带 schema）、多表数据导出（每表一文件）、合并查看 DDL 与生成 SELECT/INSERT/UPDATE/DELETE 模板、拖入编辑器、同 schema ER 图聚焦、数据库导出预填与 Add to AI。 (contributed by @Mo-Moore) (PR #7639)
  - 更新后台下载 — 点击下载后立即关闭更新弹窗，下载在后台进行并在工具栏图标显示实时进度环；空闲时自动静默安装并提示重启生效，有任务运行时提示已就绪待手动安装，不再原地等待。 (contributed by @debugzhao) (PR #7424)
  - MCP Streamable HTTP 与细粒度授权 — 桌面端 MCP 新增 Streamable HTTP 服务的启停、监听地址、远程白名单与 Token 轮换配置，提供客户端接入信息复制与诊断日志；权限控制细化到工具、连接与数据库范围，并支持按连接覆盖执行权限。 (contributed by @eryajf) (PR #7597)
  - Elasticsearch 索引管理操作 — 索引右键菜单新增查看 Mapping、Settings、Stats 与清空索引数据（只删文档、保留 mapping/settings/别名）；通配模式节点需原样输入模式名确认，部分分片失败时展示冲突与失败计数。 (contributed by @onenewcode) (PR #7633)
  - AI 自定义请求头 — API 型 AI 服务支持配置自定义请求头，应用于模型发现、连接测试、聊天与 Agent 请求，满足网关认证与租户路由需求，非法名称与保留头会被拦截。 (contributed by @eryajf) (PR #7688)
  - Jalapeno Cloud AI 预设 — AI 服务新增合作伙伴 Jalapeno Cloud 预设，可直接获取 API Key 快速接入。 (commit 6a7ea4ae9)
  - Kafka 消息展示顺序 — Kafka「消息」与「监控」页新增「时间顺序」选择器，可在已加载消息中即时切换最新优先/最早优先，不重新请求 Broker、不清空筛选。 (contributed by @CN-Scars) (PR #7683)
  - SSH 隧道独立测试 — 连接编辑页「隧道/代理」新增「测试 SSH 隧道」按钮，只验证代理、HTTP 隧道与跳板链路，不连接数据库，便于单独排查隧道配置问题。 (contributed by @zipg) (PR #7743)
  - SQL 文件名过滤 — SQL 文件面板新增设置按钮，可用正则配置显示的文件名过滤条件（默认 *.sql），支持查看其他扩展名的文件。 (contributed by @andystenhe) (PR #7629)
  - 查询结果继承列格式化 — 查询结果列记录数据库/模式/表来源并自动继承对应物理字段的格式化配置，列头显示生效标识，联表同名表不再误用规则。 (contributed by @eryajf) (PR #7579)
  改进
  - 数据库查找全表扫描 — 「在数据库中查找」将原先 200 张表的总量上限改为单批扫描量，支持继续扫描下一批或一次扫描全部剩余表，展示完整表数与真实进度，停止后可从断点续扫不重复。 (contributed by @zipg) (PR #7724)
  - DDL 按需刷新 — 「查看 DDL」弹窗新增「每次打开时刷新 DDL」开关，对象浏览器与表信息面板搜索框旁新增刷新按钮，可按页签刷新 DDL/字段/索引/外键/触发器；默认保持 24 小时缓存行为不变。 (contributed by @zipg) (PR #7437)
  - INSERT 列名提示扩展 — INSERT 列名对齐提示扩展到 INSERT ... SELECT，目标列与投影表达式逐列对应；修复 PostgreSQL DISTINCT ON 提示锚点错位等问题，编辑器工具栏新增提示快捷开关（默认开启）。 (contributed by @Mo-Moore) (PR #7727)
  - 表结构 Hover 搜索 — SQL 编辑器表名悬浮表结构新增搜索框，按列名/内容大小写不敏感匹配并高亮滚动定位，输入与快捷键隔离，不额外请求数据库。 (contributed by @0verme) (PR #7590)
  - 表名 DDL 悬浮预览开关 — 编辑器设置新增表名悬浮 DDL 预览开关（默认开启），支持搜索与恢复默认值。 (contributed by @eryajf) (PR #7670)
  - 编辑器设置预览置顶 — 字体设置实时预览固定在设置面板顶部，使用未保存设置即时重测，搜索时自动卸载避免竞态，预览区域限高并独立滚动。 (contributed by @eryajf) (PR #7609)
  - 详情弹框方向键浏览 — 行详情支持 ↑/↓、列详情支持 ←/→ 连续切换查看相邻行/列，按当前显示顺序导航、首尾安全停止，输入框内按键不被劫持。 (contributed by @0verme) (PR #7641)
  - 关闭左侧标签页 — 标签栏右键菜单新增「关闭左侧标签页」，与既有「关闭右侧标签页」对称；固定组与常规组分别处理，激活标签被关闭时由目标标签接管。 (contributed by @guoziyangnb) (PR #7687)
  - SQL 库一键折叠 — 右侧 SQL 库面板新增全部折叠按钮，且默认以折叠状态打开，文件较多时更易导航。 (contributed by @Abeautifulsnow) (PR #7483)
  - 网格工具栏自动紧凑 — 结果工具栏宽度不足时自动切换紧凑模式收起编辑操作，空间恢复后自动还原，窄窗口不再溢出。 (contributed by @eryajf) (PR #7627)
  - 对象浏览遵循激活方式 — 「单击数据库时浏览对象」调整为「激活数据库节点时浏览对象」，统一跟随侧边栏单击/双击激活设置；关闭开关后仍可通过右键菜单打开浏览对象。 (contributed by @wojiukankan) (PR #7684)
  - 非表对象隐藏统计列 — 对象浏览器在视图、存储过程等非表分类隐藏始终为空的行数/大小列及对应排序，「表」与「全部」分类保持不变。 (contributed by @zipg) (PR #7714)
  - Schema 与表图标区分 — 侧边栏 schema 图标改为琥珀色，与绿色表图标明显区分，PostgreSQL public 等场景不再混淆。 (contributed by @0verme) (PR #7755)
  - 侧边栏 Cmd/Ctrl+R 刷新 — 侧边栏获得焦点时支持 Cmd/Ctrl+R 刷新选中节点，与 F5 等效。 (commit 1f274c57e)
  - SQL 保存目标提示 — 工具栏保存按钮悬浮提示区分「保存到 SQL 库」与「保存到原文件」，打开 SQL 文件时指向更明确。 (commit c4cdcbc48)
  修复
  - 多结果窗口加载遮罩 — 同一查询标签页的多个结果窗口中，仅正在执行的结果显示 loading 遮罩，切换到已完成的结果不再被误遮罩。 (contributed by @0verme) (PR #7732)
  - 取消危险 SQL 后视口保持 — 在危险操作确认弹窗点击「取消」后，编辑器光标与滚动位置不再跳回顶部。 (contributed by @0verme) (PR #7705)
  - 危险 SQL 确认执行焦点恢复 — 确认执行危险 SQL 后 CodeMirror 光标与滚动位置不再重置到第一行，关闭动画期间快速重开弹窗也不会丢失或抢占焦点。 (contributed by @1320209572) (PR #7734)
  - 多行粘贴自动扩充 — 在预先新增的空白行区域框选粘贴超过当前行数的数据时自动创建剩余行，不再截断后半部分。 (contributed by @0verme) (PR #7712)
  - 结果窗口本地过滤保留 — 多结果窗口之间切换后各自保存的本地列过滤不再被缓存恢复重置，也不会互相污染。 (contributed by @0verme) (PR #7759)
  - 表数据分页行数上限 — 表数据分页不再被查询结果最大行数限制（如 10 万行）错误截断，深分页可访问全部数据且不再误标 truncated。 (contributed by @0verme) (PR #7701)
  - 分页排序全量执行 — 分页表格点击字段排序时按数据库全量结果从第一页重新执行，不再与当前页局部数据混淆，SQL 查询结果排序同步修复。 (contributed by @0verme) (PR #7689)
  - 克隆行紧邻源行 — 复制/克隆的行（含多行）插入到源行正下方并保持原有顺序。 (contributed by @xiaou61) (PR #7630)
  - 关系图搜索框吞字符 — 数据库关系图搜索框修复受控状态冲突导致的字符丢失，可正常连续输入。 (contributed by @0verme) (PR #7691)
  - SQL 文件侧边栏定位 — 保存的 SQL 文件重新打开后恢复 schema 信息，「在侧边栏中定位」对 PostgreSQL/SQL Server 等独立 schema 层引擎恢复生效。 (contributed by @q396921921) (PR #7749)
  - macOS 桌面端交互 — 修复退出时窗口闪红帧（macOS 12）、非激活窗口首次点击无响应（需点两下）、按钮按下无视觉反馈三个问题。 (contributed by @wzlstudy) (PR #7580)
  - 视图选项弹窗溢出 — 视图选项弹窗内容超出屏幕时限制在视口内并可滚动查看。 (contributed by @eryajf) (PR #7589)
  - macOS 导出目的地校验 — 数据库导出目的地改用持久卷 UUID 标识，系统重启或 APFS 卷重新挂载后不再误报「不同文件系统」，保留计划任务 fail-closed 安全语义。 (contributed by @CN-Scars) (PR #7668)
  - Windows 便携版数据迁移 — 切换数据目录时将设置、编辑器状态与代码片段等表纳入用户数据判断，仅包含设置/片段的源数据库不再被误判为空导致恢复默认。 (contributed by @zipg) (PR #6771)
  - MySQL VARBINARY 复制 — 保存 token/编码字符串等文本内容的 VARBINARY 值复制为原始字符串，不再输出 0x 十六进制。 (contributed by @0verme) (PR #7605)
  - MySQL 二进制 dump 导入 — 含 _binary '...' 原始字节字面量的 MySQL dump 可正常导入执行，字节无损转换为 X'HEX'，不再报「无效的 SQL 文件编码」。 (contributed by @zipg) (PR #7682)
  - MySQL 传输静默丢列 — 外键 DDL 改写只剥离真正的 CONSTRAINT 外键行，列注释提及 FOREIGN KEY 的列定义不再被误删；结构传输同样执行结构一致性校验，目标缺列不再假报成功。 (commit 5d6f66777)
  - PostgreSQL NUMERIC 精度 — 任意精度 numeric（含数组与 300+ 位超大数值）按原始精度解码展示，不再经浮点转换丢失尾数。 (commit 4d3d64bd3)
  - KingBase 无时区时间 — 无时区的 timestamp/date/time 列使用日期格式化后不再被错误标记为 UTC 时刻而多加 8 小时偏移。 (contributed by @q396921921) (PR #7735)
  - GaussDB 传输字段引用 — 目标为 GaussDB/openGauss 的传输新增「引用目标字段名」开关，关闭后普通字段名不加引号、由数据库折叠小写，后续查询无需持续带引号；保留字与特殊字符仍自动引用。 (contributed by @zipg) (PR #7607)
  - Oracle 新建表标识符 — 新建表的普通表名/字段名/主键/索引默认不加双引号，避免产生大小写敏感对象；含空格、特殊字符或关键字的标识符仍自动引用。 (contributed by @0verme) (PR #7693)
  - Oracle 列定义语法诊断 — 编辑器识别 NOT NULL 位于 DEFAULT 之后的非法列定义并红线提示（Oracle 及 OceanBase Oracle 模式）。 (contributed by @0verme) (PR #7643)
  - Oracle 数据比较选库 — connection-root schema 模式的 Oracle/JDBC 连接在「比较数据」对话框改用 schema 填充选择下拉，不再为空无法选择表。 (contributed by @0verme) (PR #7476)
  - SQL Server 临时表总行数 — 查询引用局部临时表 #temp 时总行数统计复用查询标签页会话，不再报 Invalid object name '#temp'；跳转末页与手动事务场景同步修复。 (contributed by @0verme) (PR #7756)
  - SQL Server 聚合列标题 — 未显式指定别名的聚合/计算表达式（如 COUNT(*)、SUM(amount)）恢复列标题，列宽不再被压得过窄。 (contributed by @0verme) (PR #7718)
  - SQL Server sql_variant 排序闪退 — 查询包含 sql_variant 且 ORDER BY 字段不在结果列时不再崩溃，无法迁移排序时内层保留 TOP (100) PERCENT 排序、外层仍转换为 NVARCHAR(MAX)。 (contributed by @zipg) (PR #7578)
  - SQL Server legacy 探测 CTE 前缀 — sql_variant 结果类型探测改写保留 WITH/CTE 前缀，legacy 路径上含 CTE 的查询不再失败。 (commit 19be19472)
  - SQL Server 展开全部失效 — 表节点「展开全部」在对象数量超过 1000 时恢复生效，TOP/ROW_NUMBER 分页不再把探测请求的 1001 条截断为 1000 条。 (contributed by @0verme) (PR #7585)
  - Elasticsearch 深分页兼容 — ES 7.10–7.11 等支持 PIT 但不支持 _shard_doc 的集群自动回退 from/size 分页，修复升级 v0.5.99 后索引查不出数据的回归；文档浏览、SELECT 快路径与 SQL 翻译三条链路统一修复。 (contributed by @onenewcode) (PR #7722)
  - Elasticsearch JSON 键补全 — Query DSL 键补全不再多出闭合引号，并自动带出对象/数组/标量值骨架。 (contributed by @onenewcode) (PR #7587)
  - Elasticsearch 只读保护误报 — 开启只读保护后 POST /{index}/_search 等 REST 读请求不再被判定为写操作弹出「临时解锁写入」对话框。 (contributed by @onenewcode) (PR #7669)
  - Redis 大值预览防崩溃 — 大型 String 值（如数十 MiB 的 Bloom 过滤器数据）改为 64KiB 有界只读预览并显示真实总大小，不再整值读入导致内存暴涨和 Windows WebView 崩溃。 (contributed by @zipg) (PR #7733)
  - Redis Hash 字段更新兼容 — Redis 6.x/7.0/7.2 下修改 Hash 字段值或重命名字段不再误报 hash field update failed，7.4+ 的字段 TTL 保留语义不变。 (contributed by @0verme) (PR #7608)
  - IoTDB 1.3.x 聚合结果 — IoTDB 1.3.x 聚合查询结果列与别名正确对齐，max_time 等时间列格式化显示。 (commit 613c4f7ca)
  - RocketMQ 消费者组搜索 — 消费者组按总数分页加载，超过 500 条后位于后续分页的消费者组也可搜索到。 (contributed by @0verme) (PR #7736)
  - Windows SSH SQLite 路径 — Windows 客户端通过 SSH 打开远端 Linux SQLite 文件时按 Linux 语义校验 /... 绝对路径，不再被误判为非绝对路径。 (contributed by @zipg) (PR #7710)
  - MQ 连接 URL 行 — Kafka/RocketMQ/RabbitMQ/Pulsar 等 MQ 类型连接隐藏顶部的 URL 输入行，不再显示错误的 PostgreSQL 占位示例。 (contributed by @hhktony) (PR #7582)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.0 拉取。
