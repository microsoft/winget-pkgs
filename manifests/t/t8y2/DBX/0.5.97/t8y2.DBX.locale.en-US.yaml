ReleaseNotes: |-
  新功能
  - 网格选区截图 — 数据网格右键即可截取选中的单元格区域、整行或整列，生成 PNG 可复制到剪贴板或导出文件，支持深浅主题、字段名/类型/描述、转置与紧凑布局等配置。(contributed by @hanxuanyu) (PR #7352)
  - 网格筛选新模式 — 列筛选新增「以…开始」「以…结束」两种条件模式。 (commit d85816c3e)
  - 网格右键刷新 — 数据网格右键菜单新增「刷新」，无需回到侧边栏即可重载数据。 (commit c153ca8f5)
  - 快速条件栏着色 — 数据网格 WHERE 快速条件栏按关键字、字段、值分色显示，条件更易读。 (contributed by @sxhjlzl) (PR #7214)
  - 可见数据库通配符过滤 — 「可见数据库」设置支持 * 等通配符模式，一次匹配多个数据库。 (commit d06f62f9f)
  - AI 会话后台任务 — AI 助手会话改为后台任务运行：多条提问排队串行执行、每个运行有状态跟踪，应用重启后可恢复未完成的运行，流式输出增量持久化，长任务期间编辑器保持响应。 (contributed by @Abeautifulsnow) (PR #7255)
  - 补全预选首个候选 — SQL 补全默认选中第一个候选，回车/Tab 直接接受，减少按键。 (contributed by @zipg) (PR #7309)
  - SQL 格式化保留空行 — 新增设置项，格式化 SQL 时可保留原有空行。 (contributed by @eryajf) (PR #7324)
  - 表结构编辑器字段快捷操作 — 支持快捷新增字段与复制现有字段。 (contributed by @eryajf) (PR #7326)
  - XLSX 导出自动筛选 — 导出 XLSX 时可选择在表头包含自动筛选器。 (contributed by @eryajf) (PR #7364)
  - 数据传输交换源/目标 — 传输对话框中间新增交换图标，一键互换源与目标连接。 (contributed by @GIWTO) (PR #7316)
  - 更多数据源服务端版本 — ZooKeeper、Redis、MongoDB、Meilisearch、VictoriaMetrics、Kafka、Nacos 连接现在显示服务端版本等元信息。 (contributed by @eryajf) (PR #7292)
  - 连接侧栏与设置布局优化 — 连接侧栏工具区与编辑器设置页布局重排，入口更精简直观。 (contributed by @zipg) (PR #7307)
  - Redis Hash 字段编辑 — Hash 成员详情中可直接编辑字段名与值，后端单条 Lua 原子完成重命名/更新，保留原字段 TTL 并防止覆盖已有字段。 (contributed by @onenewcode) (PR #7140)
  - Oracle 手动事务状态优化 — 手动提交模式下执行纯 SELECT 等只读语句时不再弹出事务提示，工具栏在事务干净状态下隐藏提交/回滚按钮，行为对齐 PL/SQL Developer。 (contributed by @Abeautifulsnow) (PR #7334)
  - 达梦 DM6 连接 — 支持通过自定义 JDBC 驱动连接达梦 6 数据库。 (contributed by @zipg) (PR #7202)
  - GaussDB psql 控制命令 — 匿名块执行支持 \set 等 psql 风格控制命令。 (contributed by @zipg) (PR #7100)
  - MySQL 存储引擎管理 — 支持查看和修改表存储引擎。 (contributed by @zipg) (PR #7203)
  - SQLite RC4 Legacy 恢复（桌面端） — 桌面端恢复基于 SQLite3 Multiple Ciphers 的 RC4 Legacy 加密数据库支持（含 SQLCipher 4/3/2/1 自动探测），同时修复 Web/Docker 端 GNU/musl 构建链接问题。 (contributed by @zipg) (PR #7286)
  改进
  - HTTP 隧道查询延迟 — 隧道 PHP worker 改为自适应轮询，活跃流量下消除每回合约 200ms 等待；此前打开一张 26 行 MariaDB 表需 30 秒以上，现在接近直连速度。 (contributed by @ordinary-s) (PR #7315)
  - 数据传输大规模对象列表 — 对象选择列表虚拟化渲染，库中对象极多时传输界面不再卡死。 (contributed by @0verme) (PR #7298)
  - Kafka 消费组加载 — 消费组订阅合并为一次后端往返，消费组列表加载显著提速。 (contributed by @0verme) (PR #7256)
  - Oracle 大存储过程源码读取 — 大型存储过程/包源码读取提速。 (contributed by @zipg) (PR #7204)
  修复
  - Oracle 大数字显示 — 大整数 NUMBER 列不再渲染为科学计数法。 (contributed by @q396921921) (PR #7284)
  - Oracle 默认 ORCL 数据库 — 连接配置的默认 ORCL 数据库正确生效。 (contributed by @zipg) (PR #7299)
  - Oracle 大值重载 — 大字段值改用 ROWID 包裹的查询重新加载，CLOB 等大值可正常展示与复制。 (commit afcfa59d0)
  - Oracle 数据比较选表 — JDBC 数据比较异步加载元数据期间不再丢失已选的源端表。 (contributed by @zipg) (PR #7328)
  - Oracle 超大包体卡死 — 查看超大 Oracle 包体源码时不再滚动卡死。 (contributed by @q396921921) (PR #7270)
  - Oracle JDBC 元数据显示 — 通过 Maven 安装 ojdbc 时自动附带 orai18n，修复 ZHS16GBK 等多字节字符集下表注释等元数据无法显示。 (commit e6d25b016)
  - OceanBase(Oracle 模式) 字段补全 — 无 Schema 连接下别名字段补全恢复正常。 (contributed by @zipg) (PR #7260)
  - 达梦 6 模式列表 — 缺少 ALL_USERS 视图的达梦 6 等 JDBC 连接回退标准 getSchemas 接口，展开模式列表不再报「无效的表或视图名」。 (contributed by @StaravenX) (PR #7311)
  - MySQL 结构同步 — 结构同步收敛执行并在完成后刷新元数据，不再出现同步后状态不一致。 (contributed by @zipg) (PR #7201)
  - MySQL 导入裸 VARCHAR — 导入建表时目标为 MySQL 的裸 VARCHAR 类型自动补默认长度，建表不再失败。 (contributed by @q396921921) (PR #7323)
  - PostgreSQL 仅结构传输索引 — 仅传输结构时保留索引定义。 (contributed by @0verme) (PR #7330)
  - PostgreSQL / MySQL 内置函数高亮 — 部分内置函数恢复语法高亮。 (contributed by @q396921921) (PR #7253)
  - SQL Server 架构比较 — 补全架构比较的原生 T-SQL 生成：表、列、默认约束、索引、外键、序列、触发器、注释扩展属性、删除语句及跨库类型转换，并生成可回滚 SQL。 (contributed by @Cherrs) (PR #7168)
  - SQL Server 日期函数补全 — DATEDIFF/DATEADD 等函数补全提示 datepart 参数。 (contributed by @zipg) (PR #7329)
  - Elasticsearch 索引分页 — 打开索引时分页 size 按 max_result_window 自动裁剪，超出上限不再报错。 (contributed by @q396921921) (PR #7250)
  - Redis Key 树展开状态 — 刷新 key 列表后分组保持展开状态。 (commit 10df1b07d)
  - Redis 分组子树加载 — 展开分组时按前缀定向扫描填充子树，搜索能命中的键在树中正常显示。 (commit 4b4b4ac2d)
  - Redis 集群扫描公平性 — 集群模式下按 master 轮询公平扫描，不再出现个别分片 key 被遗漏。 (contributed by @CN-Scars) (PR #7277)
  - Redis WITHSCORES 结果 — 控制台中 ZRANGE 等 WITHSCORES 结果 member/score 正确配对显示。 (contributed by @q396921921) (PR #7265)
  - MongoDB 负载均衡连接 — loadBalanced=true 的 URI（OCI Autonomous Database、DocumentDB 等）不再被强制单直连。 (contributed by @LDQONJ) (PR #7235)
  - Kafka 跳过证书校验 — 连接设置中的「跳过证书校验」选项实际生效。 (contributed by @zipg) (PR #7200)
  - DuckDB WAL 清理 — DuckDB worker 空闲关闭时执行 shutdown checkpoint，WAL 及时合并清理，数据库文件状态一致。 (commit 8475c84d4)
  - SQL 补全子句识别 — 子句检测先屏蔽字符串与注释，修复 WHERE/FROM 补全被字面内容误判。 (contributed by @q396921921) (PR #6774)
  - 替换快捷键 — 严格匹配修饰键，其他快捷键不再误触发替换。 (contributed by @0verme) (PR #7297)
  - 编辑器惯性滚动 — 触控板惯性滚动不再误触发字号缩放。 (contributed by @zipg) (PR #7199)
  - 编辑器设置实时预览 — 预览示例改为只读并说明示例中的拼写错误为演示用，修复修改示例后「应用」按钮置灰。 (commit 7231c4161)
  - DOM 结果集无限滚动 — 内容不足一屏的 DOM 结果集不再被误判到底而触发多余加载。 (commit d2326acb8)
  - 网格悬停状态 — 双 Canvas 交替绘制时鼠标悬停高亮不再丢失。 (contributed by @eryajf) (PR #7317)
  - 网格搜索截断提示 — 结果含服务端截断的长文本/JSON 值时，搜索栏给出提示，说明匹配数可能少于 SQL 查询。 (commit 71344c637)
  - 结构比较表列表 — 比较前刷新两侧表列表，避免使用已失效缓存导致结果过期。 (contributed by @0verme) (PR #7321)
  - 结构比较删除组 — 源端与目标端都存在的表不再被错误列入目标端删除组。 (commit 8382d85e1)
  - 结构比较横向滚动 — 左右两侧结果区横向滚动恢复同步。 (contributed by @0verme) (PR #7278)
  - 自引用外键跨库比较 — 自引用外键不再被误判并写入错误的引用数据库。 (contributed by @q396921921) (PR #7305)
  - 部署 DDL schema 限定 — 生成的部署 SQL 将 CREATE TABLE/VIEW 的 schema 限定符改写为目标端 schema，目标库无同名 schema 时也能执行成功。 (contributed by @q396921921) (PR #7296)
  - 数据生成默认值 — 列默认值不再覆盖用户设定的生成规则。 (contributed by @zipg) (PR #7327)
  - SQL 库删除确认文案 — 删除弹窗确认按钮改用明确的「删除」文案。 (contributed by @onenewcode) (PR #7347)
  - 侧边栏可见数据库 — 删除仅剩的可见数据库后侧边栏树正确刷新，不再残留空节点。 (contributed by @q396921921) (PR #7234)
  - ER 图 PNG 导出 — 导出尺寸钳制到画布上限，超大关系图导出 PNG 不再失败。 (commit 138e48d34)
  - 旧 WebView 兼容 — 修复 macOS 12 等旧版 WebView 下弹窗样式异常，以及代码截图剪贴板/PNG 中行号全为 1 的问题。 (contributed by @wzlstudy) (PR #7340)
  - Windows 桌面端 SQLite 链接 — 修复 Windows 桌面端构建时 SQLite 链接失败，保障 Windows 安装包正常产出。 (contributed by @zipg) (PR #7313)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.5.97 拉取。
