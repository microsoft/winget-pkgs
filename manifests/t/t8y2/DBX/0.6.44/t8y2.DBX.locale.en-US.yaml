ReleaseNotes: |-
  赞助信息
  - 赞助伙伴 HuaLongAI（华龙算力）感恩回馈老用户：10 月 19 日上午 10 点在其企业微信群抽奖，奖品为一台 vmiss CN.HK.BGP.Basic 主机（有效期至 2027-05-16），活动入口
  新功能
  - 新增 StarRocks 数据库支持，可连接执行 SQL 并在表结构编辑器中管理表、分区与桶布局 (contributed by @AspBamboo) (PR #11687)
  - 新增泰语界面 (contributed by @PingSunn) (PR #11935)
  - 表结构编辑器支持跨连接、跨数据库复制字段 (contributed by @eryajf) (PR #12137)
  - 数据库结构搜索同时匹配表注释，按注释内容也能找到对应的表 (contributed by @HighBigSky) (PR #11860)
  - OceanBase Oracle 模式的表、视图、过程和函数重命名会先生成变更预览再执行，并支持包另存为 (contributed by @efeire) (PR #12144)
  - Oracle 连接新增用户与权限管理页面，可直接管理账号和授权 (contributed by @efeire) (PR #12005)
  - 达梦的 SQL 补全支持像 Oracle 一样建议序列 (contributed by @yiqiui) (PR #12161)
  - MQTT 消息 Payload 查看器新增全部展开和全部折叠操作 (contributed by @onlytl) (PR #12186)
  改进
  - 内置 MCP 服务的全部静态工具声明工具注解，MCP 客户端可以正确识别只读等工具属性 (contributed by @yiqiui) (PR #12185)
  - 达梦查询先执行语句、再按需加载冷元数据，减少执行前的等待 (contributed by @zipg) (PR #12149)
  - MongoDB 查询带显式 limit 且一页可容纳时跳过总数统计请求，少一次往返 (contributed by @thailoc-dev) (PR #12165)
  - SQL 补全的序列和变量候选项显示对应类型图标 (contributed by @yiqiui) (PR #12116)
  - 界面与设置中 CodeBuddy Code CLI 的名称统一 (contributed by @mr-dadong) (PR #12133)
  - 设置中默认事务模式的说明文案明确其仅对支持手动事务的数据库连接生效 (contributed by @Rendegou) (PR #12180)
  修复
  - Windows 上应用内更新安装前会先关闭后台备份、Redis Pub/Sub 和查询运行时，避免更新进程强制退出时残留占用
  - 过大的网格导出图片自动降低缩放比例完成导出，不再直接报错拒绝
  - MySQL 无主键表数据标签页的虚拟唯一键按加载时的作用域保存，重新打开后不再要求重复选择唯一键 (contributed by @jeff377) (PR #12207)
  - PostgreSQL 数据库导出时索引 DDL 延迟到函数定义之后生成，避免回放时索引依赖的函数尚未创建 (contributed by @jeff377) (PR #12205)
  - AI 面板执行 SQL 操作后会显示执行结果和错误信息，不再静默失败 (contributed by @Abeautifulsnow) (PR #12199)
  - macOS 上 SSH ProxyCommand 中的 Homebrew 辅助命令可以正确解析路径 (contributed by @CN-Scars) (PR #12197)
  - 标准 INSERT 导出按各数据库方言正确引用标识符，含保留字或特殊字符的表名、列名导出后可以正常回放 (contributed by @yiqiui) (PR #12191)
  - SQL Server 连接设置 encrypt=false 时不再对无 SSL 能力的实例强制加密，连接不再被卡住 (contributed by @guoxdxdxd) (PR #12151)
  - 更新 JDBC 驱动目录前先停止相关插件进程，避免驱动文件被占用导致替换失败 (contributed by @fangzhengjin) (PR #12183)
  - DB2 查询结果编辑正确解析表名和 schema 大小写，保存不再因大小写不匹配失败 (contributed by @Rendegou) (PR #12181)
  - 插件（如 S3 Browser）读取剪贴板图片不再被权限拒绝 (contributed by @yiqiui) (PR #12171)
  - 查看表 DDL 在 SQL Server 2005 上可以正常工作 (contributed by @yiqiui) (PR #12159)
  - 标签栏在「打开的标签」按钮与新建查询按钮之间增加间距，不再贴在一起 (contributed by @difagume) (PR #11922)
  - PostgreSQL 函数先输出 notice 再返回结果集时，执行完成后回到结果视图而不是停留在消息输出 (contributed by @hongshuo-wang) (PR #12059)
  - Oracle 内置函数查询（如 SELECT LENGTH(1) FROM dual）被正确证明为只读，不再错误显示提交/回滚按钮 (contributed by @Abeautifulsnow) (PR #12062)
  - Vim 普通模式下使用输入法不再把组合过程的文本插入编辑器 (contributed by @zipg) (PR #12061)
  - 向量数据库查询结果的字段按响应来源正确保留，不再因响应结构差异丢失或错位 (contributed by @CN-Scars) (PR #12084)
  - Oracle 表结构编辑补齐触发器的新增和删除等操作 (contributed by @thailoc-dev) (PR #11799)
  - AI 对话模式按会话独立保存，切换会话不再沿用上一次的模式 (contributed by @Abeautifulsnow) (PR #12139)
  - PostGIS 几何单元格导出 INSERT 时按原 SRID 生成 ST_GeomFromEWKT 回放，保留坐标系信息 (contributed by @yiqiui) (PR #12140)
  - 一次性返回全部行的查询结果固定为单页显示，不再提供只会重复相同结果的翻页 (contributed by @jeff377) (PR #12141)
  - SAP HANA 表右键重命名入口生效，表结构编辑支持查看和修改列注释 (contributed by @zipg) (PR #12134)
  - CC-SWITCH 导入的多个 AI 配置文件保持各自内容，不再被互相覆盖成同一份 (contributed by @ma123456mai) (PR #12138)
  - 多数据库合并查询结果的列合计按精确十进制计算，数值不再出错 (contributed by @jeff377) (PR #12091)
  - 正则数据生成器生成的值保证匹配所配置的正则表达式 (contributed by @yiqiui) (PR #12101)
  - 新查询执行期间保留上一条结果和结果操作按钮，慢查询下不再消失 (contributed by @zipg) (PR #12104)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.44 拉取。
