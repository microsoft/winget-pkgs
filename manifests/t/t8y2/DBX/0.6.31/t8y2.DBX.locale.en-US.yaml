ReleaseNotes: |-
  新功能
  - 插件 AI 文本生成能力扩展，新增流式输出与中途取消、按生成/改写/分类的任务预设模板，以及带数据预览并可记住本次工作台确认结果的授权对话框 (contributed by @jinpy666) (PR #10928)
  - 数据库备份和计划备份新增「精确选择表」模式，可按数据库和模式加载表清单并搜索、批量勾选，表名中的星号、逗号和点号保持字面含义 (contributed by @zipg) (PR #10900)
  - SQL Server 时态表的交互式 DDL 完整保留 GENERATED ALWAYS、HIDDEN、PERIOD、系统版本控制和历史表关联，历史表定义中注明所属时态表 (contributed by @zipg) (PR #10913)
  - 导入无标题的 CSV、TSV、分隔文本和 Excel 到已有表时，源列按目标字段顺序自动映射，不再需要逐列手动选择 (contributed by @CSXFanMeng) (PR #10822)
  - 数据视图表头的连接名和「库名@模式」胶囊改为可点击，可回跳对应连接或对象浏览器并复用已有标签页 (contributed by @onceMisery) (PR #10899)
  - MongoDB 字段补全改为从随机采样的 100 个文档学习集合结构，仅存在于较新或较少文档中的字段和更深的数组元素也能被建议 (contributed by @thailoc-dev) (PR #10902)
  - MongoDB 补全支持 show dbs、createUser 和旧版 insert 辅助命令 (contributed by @thailoc-dev) (PR #10904)
  - MongoDB 筛选条件中运算符的值位置按运算符语义建议合适的取值，例如 $exists 提示 true/false (contributed by @thailoc-dev) (PR #10906)
  - MongoDB 更新语句的 arrayFilters 和 $pull 条件位置补全字段名与查询运算符 (contributed by @thailoc-dev) (PR #10907)
  - MongoDB find 投影中字段对象值位置补全 $elemMatch、$meta、$slice 投影运算符 (contributed by @thailoc-dev) (PR #10908)
  - MongoDB 聚合表达式内补全字段引用与变量，$concat、$add 等操作符的参数位置可直接选择字段 (contributed by @thailoc-dev) (PR #10910)
  - MongoDB dropIndex、dropIndexes 和 hint 位置补全集合的实际索引名及对应键模式 (contributed by @thailoc-dev) (PR #10911)
  修复
  - 修复重复恢复云同步选中配置时共享隧道配置触发唯一键冲突、导致恢复失败的问题 (contributed by @Rendegou) (PR #10931)
  - 修复多个弹窗堆叠时最上层可见弹窗无法关闭、界面无响应的问题 (contributed by @eryajf) (PR #10846)
  - 修复本地值筛选面板中长单元格值的标签被截断、无法辨认的问题 (contributed by @zipg) (PR #10912)
  - 修复刷新数据后仍显示过期手动行数的问题，刷新时清除旧的总行数统计 (contributed by @zipg) (PR #10905)
  - 修复导入列映射下拉框在暗色模式下配色不可读的问题 (contributed by @lxk955) (PR #10879)
  - 修复 CREATE OR REPLACE 语句中 OR 后优先提示 REPLACE 字符串函数而非关键字的问题 (contributed by @zipg) (PR #10878)
  - 修复导出 ANSI SQL 字符串字面量时反斜杠被错误转义的问题，影响 SQL Server、Oracle、SQLite、DuckDB 等非 MySQL 系方言的导出脚本 (contributed by @hanhvs) (PR #10930)
  - 修复 JDBC 连接启用表名包含/排除规则时先分页后过滤、匹配表落在前 1000 张之外就丢失的问题 (contributed by @zipg) (PR #10909)
  - 修复 PostgreSQL 查看表 DDL 时主键列顺序与实际建表语句不一致的问题
  - 修复通过 JDBC 连接 PostgreSQL 时通用连接未绑定所选数据库、多库多模式显示异常的问题
  - 修复 DuckDB 读取会话时区时触发 ICU 扩展自动加载、拖慢查询启动的问题
  - 修复升级后旧版持久化的 JDBC 驱动类自定义别名失效、Teradata 等连接报错的问题
  - 修复 JDBC 连接内嵌 H2 本地文件数据库时多会话争用导致打开表数据报文件锁定错误的问题
  - 修复 InterSystems（Caché/IRIS）查询结果整数值丢失精度的问题
  - 修复 GoldenDB 无法获取原生表 DDL 的问题，表结构页签可正常显示建表语句
  - 修复 JDBC 连接对象树中发现的 schema 未保留、每个 schema 下显示相同表列表的问题
  - 修复 Agent 类型连接在 Agent 恢复后数据库枚举因会话不可用而失败的问题，枚举改走独立元数据连接池
  - Agent 对象统计改用独立临时元数据会话，避免统计请求干扰前台元数据和 DDL 加载
  - 修复 macOS 上查询编辑器长选区（包括执行期间保持的选区）导致选区错乱和输入异常的问题
  - 修复 macOS 独立 dbx-mcp 每次升级后因签名身份变化重复请求钥匙串授权的问题，发布产物改用稳定 Developer ID 签名并校验完整性
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.31 拉取。
