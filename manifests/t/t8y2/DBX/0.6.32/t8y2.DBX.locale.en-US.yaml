ReleaseNotes: |-
  新功能
  - 「配置数据提取器」新增更多选项：SQL INSERT 的表名和字段名可加引号，日期时间值可选择数据库原生格式或带引号字符串格式（YYYY-MM-DD HH:mm:ss），预览同步生效
  - 数据传输支持 InterSystems IRIS 和 Caché 作为传输源和目标
  - 数据库查找支持以标签页方式打开，可同时保留多个查找任务 (contributed by @lxk955) (PR #10936)
  - Redis 值查看自动识别 JSON 内容并格式化显示 (contributed by @yiqiui) (PR #10934)
  - SQL 库打开和导入保存的 SQL 时自动关联目标数据库，按文件夹已有文件、当前标签页或连接默认数据库推断，不再固定为空库 (contributed by @lxk955) (PR #10959)
  - 查询标签页标题显示当前模式和目录作用域，便于区分不同作用域下的查询 (contributed by @lxk955) (PR #10958)
  - 侧边栏支持快捷键断开连接，按键可在设置中自定义 (contributed by @lxk955) (PR #10967)
  - 侧边栏「复制显示路径」操作扩展到全部数据库类型 (contributed by @lxk955) (PR #10969)
  - 对象浏览器中表和视图的右键菜单新增「在侧边栏定位」
  - 新增设置项「打开时重新加载已恢复的表数据」，进入恢复的表数据标签页时自动重新加载，等同于按刷新 (contributed by @difagume) (PR #10956)
  改进
  - 表格导出在导出前的行数统计阶段也支持取消，界面取消入口响应更及时
  - 导出连接配置对话框改为按侧边栏分组树形展示，支持展开分组勾选连接 (contributed by @onenewcode) (PR #10933)
  - PostgreSQL 建立连接时并发竞速已解析的地址，多地址主机上连接建立更快更稳 (contributed by @sx4im) (PR #10957)
  - 查询结果网格的画布表面翻转仅在后备存储尺寸变化时执行，减少滑动时的无谓重绘和卡顿
  - 网格错误提示横幅改为通栏宽度并弱化正文文字，错误信息更醒目易读
  - 插件贡献面板卡片排版整理，徽章行过长时自动折叠
  修复
  - 修复 DB2 查询含大 LOB/BLOB 列时预览读取完整内容、内存占用暴涨导致卡顿的问题，大对象预览改用 SUBSTR 截断
  - 修复通过代理连接 ClickHouse 时 TLS 主机名丢失导致握手失败的问题 (contributed by @ree4pwn) (PR #10799)
  - 修复 DuckDB 附加（ATTACH）数据库中的表使用两段式表名时无法解析列的问题，列信息浏览与补全恢复正常
  - 修复 Sybase（JDBC 连接）视图模块无法查看 DDL 语句的问题，视图定义改为按系统目录顺序加载拼接
  - 修复 SQL Server 克隆表时表注释和字段注释丢失的问题 (contributed by @zipg) (PR #10886)
  - 修复 Snowflake 补全只解析默认数据库、非默认库模式下表名无法补全的问题，补全现按实际数据库和模式命名空间解析
  - 修复 OceanBase Oracle 模式含重复列的 SELECT 分页时报错的问题，分页改写保留重复列投影
  - 修复 OceanBase（Oracle 模式）对象元数据缺少包体（PACKAGE BODY）、包体无法正常显示的问题
  - 修复 Vastbase（海量数据库）修改用户密码时无法提供旧密码的问题，修改自身密码后旧连接凭据立即失效并提示输入新密码重新连接
  - 修复 Redis 无法查看 Kvrocks 中旧编码 hash 类型的问题，hash 操作兼容旧编码
  - MongoDB 集合表格的合计统计计入类型化 BSON 数值列，负数沿用原语义不计入 (contributed by @xcrong) (PR #10964)
  - 修复 Qdrant 查询编辑器误用 SQL 语法高亮和补全的问题，改为关闭不适用的 SQL 语言特性
  - 修复当前页导出 XLSX 时 SQL 工作表未使用当前页实际查询语句的问题，SQL 工作表格式同步修正 (contributed by @lxk955) (PR #10952)
  - 修复 Web 端导出 XLSX 时各工作表自身的自动筛选设置被全局开关覆盖的问题 (contributed by @Totopo27) (PR #10939)
  - 修复全选长 SQL 后编辑器滚动明显卡顿的问题 (contributed by @zipg) (PR #10951)
  - 修复复制负数纯数字文本单元格时被误加公式防护前缀的问题，以负号开头的整串数字原样复制
  - 补全多语言界面缺失的翻译键并清理已失效的键，避免界面显示原始键名
  - 修复深色主题切换回浅色后背景壁纸透明度丢失、悬浮提示未恢复正常配色的问题
  - 修复保存 SQL 到 SQL 库遇重名文件时冲突的问题，保存时自动顺延编号并提示 (contributed by @zipg) (PR #10970)
  - 修复插件集合变化后工作台 HTML 缓存未失效、插件界面显示旧内容的问题 (contributed by @Abeautifulsnow) (PR #10962)
  - 修复插件卸载时文件无写入权限导致卸载失败的问题，关闭时同步回收插件 sidecar 进程 (contributed by @Totopo27) (PR #10943)
  - 修复 Agent 类型连接启动时偶发瞬时退出导致连接打开报错的问题，改为自动重试
  - Web 版收到 Ctrl+C 或 SIGTERM 时立即完成关停并退出，不再长时间挂起 (contributed by @Totopo27) (PR #10954)
  > 国内下载：如果 GitHub 下载较慢，可从 CNB 镜像 下载桌面端安装包，Docker 镜像从 docker.cnb.cool/dbxio.com/dbx:v0.6.32 拉取。
