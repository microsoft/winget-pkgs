ShortDescription: 'Native desktop SSH workspace: terminal, SFTP/SCP, port forwarding, VNC and RDP desktops, and an AI assistant in one window.'
Description: Motty is a free, open-source SSH client written in Go that puts a terminal, a file panel, port forwarding and jump chains, VNC and RDP remote desktops, and an AI assistant in one native window. There is no Electron runtime and no embedded browser. Host keys are verified against Motty's own known_hosts before any credential is sent, and the vault is AES-256-GCM with its key in the system secret store.
