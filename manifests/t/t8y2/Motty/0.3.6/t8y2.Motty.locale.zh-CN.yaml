ReleaseNotes: |-
  新功能
  - 新增笔记库：在终端侧栏里写 Markdown 笔记，支持新建、导入导出、搜索和文件夹，随配置一起同步。
  - 连接面板里可以选中多台主机，一次连成十二格工作区。
  - 标签按顺序编号，按住编号快捷键再按 1–9 直接跳到对应标签。
  - 文件传输窗口增加目录树，目录只在展开时读取，双击两侧对应目录后可以同步浏览。
  - 代码片段可以归组，片段页和终端里的片段选择器都按组显示，搜索也会匹配组名；命令首尾的空格不再被吃掉。
  - 同一地址上的多台主机只要名字不同就能同时保存，跳板机上挂多个目标不再只能存一个。
  - 主机列表支持批量选择，也可以按名称或 IP 排列显示顺序。
  - 在命令行上点击可以把 shell 光标移过去，正在运行的程序和全屏程序不受影响，可在设置里关掉。
  - MCP 增加 terminal_start/terminal_poll/terminal_stop，长命令在可见终端里跑起来后立刻返回任务号，之后按偏移读新输出；保留下来的输出也能分页读取。
  - MCP 可以列出代理已获授权访问的已保存主机。
  - 列出模型和请求补全走不同地址的服务商，可以单独填写模型列表地址。
  - 本地 shell 改为读取 /etc/shells 并直接搜索标准安装路径，csh、tcsh、ksh、dash 和 Homebrew 装的 shell 都能选到；Windows 上也能找到装在自定义目录的 Cygwin。
  - 设置里界面字体的名字显示在选择按钮旁边。
  改进
  - 拆分终端默认改为 macOS 的 Command+D / Shift+Command+D，其它平台为 Control+Shift+D / Control+Shift+E，不再占用系统的隐藏与窗口快捷键；旧的默认值会迁移一次，自己改过的和片段里用到的保持不变。
  - 命令补全补全到多个候选的共享前缀，历史匹配按最近使用时间排序。
  - 主机分组筛选后仍保留子分组层级，可以逐级往下钻。
  - 钉住的分组在筛选 chip 上显示星标。
  - 调试页面改成一个真正的代码编辑器，敲字、移动、选择、滚动、行号和括号匹配都走框架实现，光标按主题的颜色闪烁。
  - 主机的导入按钮在导入和导出两个用途下都有明确的可访问名称。
  修复
  - 指针移出窗口且没带坐标时，终端拖选不再清掉已选内容。
  - 已经结算完的传输不再继续占着它的路径，紧接着的同一路径操作不会被告知"请等待它结束"。
  - 在连接面板里编辑主机时，面板不再被关掉。
  - AI 抽屉里目标触发器在菜单打开时不再跑到菜单上方。
