ReleaseNotes: |-
  新功能
  - 支持从 XPipe 保险库导入主机（SSH、RDP、VNC），密码和密钥仍加密保存在原工具里。
  - 支持从 Xterminal 本地仓库导入 SSH 主机、文件夹和登录后命令。
  - 在 sudo、su 和 SSH 密码提示处可以直接选择已保存的身份或密码，不必先配置自动填充规则。
  - 端口转发可以设置为连接主机时自动启动，默认关闭。
  - 命令补全列表会加入当前主机的快捷命令，不再只显示路径、历史和公共目录。
  - 设置中可以选择六种应用 Logo 配色，应用内、窗口和系统图标一起更新。
  改进
  - 终端日志高亮补上 INFO、DEBUG、TRACE 等内置日志级别颜色。
  - 在主题菜单里悬停配色即可实时预览终端颜色。
  - 资源监控改用仪表盘图标，侧边栏入口的指针会随资源占用扫动。
  - 文件保存时显示加载指示。
  - 各对话框的表单行高与间距统一，行与行不再相贴或间隙不一。
  修复
  - 用外部编辑器保存的文件能可靠同步回远端，失败会重试，远端变化会提示冲突。
  - 主机修改探测策略后，新开的标签页按当前策略拨号，不再借用旧连接而丢失延迟和目录跟随。
  - 长快捷命令在保存和加载时不再被截断。
  - 打开工具栏编辑器时会自动滚动到最后一行。
  - 标签页只在认证策略（方法、身份、agent）相同时复用连接，避免用错密码或密钥。
  - 远程日志使用会话的 sudo 权限读取，开启 sudo 后能查看系统日志。
  - 设置标签页也能在窗口栏上拖动排序。
  - rz 重复发送 ready 时，不再重复提示下一个文件。
  - 下载同名文件前会先询问是否替换。
  - 更新对话框显示真实的安装步骤，安装期间窗口保持响应，开始替换后不再提供取消。
  - 文件页的保存操作显示为一个 split button，两半共用一个表面和外侧圆角。
  - sudo 密码输入框与其他密钥对话框尺寸一致，不再双倍高和光标居中。
