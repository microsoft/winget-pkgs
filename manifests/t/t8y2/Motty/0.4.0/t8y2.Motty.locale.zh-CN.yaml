ReleaseNotes: |-
  新功能
  - AI 设置里可以筛选、排序并固定探测到的模型。
  - Workspace 支持为主机添加初始化命令，并可从卡片快捷编辑。
  - SFTP 面板可以计算所选文件夹的大小。
  - 标签栏内容溢出时显示悬停滚动条。
  - 终端下拉菜单可以隐藏本地 shell。
  - 网络路径变化时，Motty 会自动重连受影响的会话。
  - 资源监控页显示登录会话。
  - Windows 上未托管的便携版可以使用应用内更新。
  - AI 模型支持设置推理强度，并可针对单个模型覆盖。
  - 打开的本地标签会从上次所在文件夹开始。
  - 窄窗口下的文档对比改为上下堆叠，不再压缩可编辑结果。
  - 主机列表新增隐私模式，可隐藏主机名称和连接信息，适合演示或录屏。
  改进
  - 远程桌面会话会关闭本机输入法，避免与远端输入法互相干扰。
  - 网关主机只允许交互式会话时，连接不再被系统探测命令断开，并可在主机对话框里手动开启“仅交互会话”。
  修复
  - 跳板路径按实际连接顺序显示。
  - 关闭标签编号显示后，数字跳转快捷键仍然生效。
  - 修复 AI 回复里泄漏的工具调用标记，包括推理内容和没有启用工具的回合。
  - RDP 服务器在认证后关闭连接时，不再误报为密码错误或丢弃已保存的密码。
  - 命令面板对话框中的控件重新响应键盘。
  - 提交 AI 提供商表单失败时，自动把焦点移到出错字段。
  - 笔记的“更多操作”菜单保持贴住所在行。
  - 未保存笔记的退出对话框重新响应鼠标点击。
  - 创建 SFTP 目录时，把“目标已存在”错误翻译成可读提示。
