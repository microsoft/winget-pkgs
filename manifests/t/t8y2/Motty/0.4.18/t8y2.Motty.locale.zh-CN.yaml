ReleaseNotes: |-
  新功能
  - 远程桌面（RDP）主机可以单独开启“允许旧版 TLS”；连接因握手失败时，失败页提供一键“用旧版 TLS 重试”，老旧的 Windows 主机也能连上。
  改进
  - 没有 shell 集成的会话（如 OpenWrt 的 BusyBox ash、dash）也能弹出命令补全列表。
  - 导入 WindTerm 时，嵌套分组、登录后自动执行的命令和同一堡垒机地址下的多个会话都会保留。
  - 系统编辑器保存的文件没有传到服务器时，面板和通知里会提示失败，再次打开会和服务器上的文件比对。
  修复
  - 监控详细概览的内存卡片显示已用和总量。
  - 调整窗口大小后，输入先于提示符重绘到达时不再擦掉提示符。
  - 放大窗口时，清屏后的终端内容不再被历史行顶回屏幕。
  - 修复笔记页 Markdown 工具栏文字互相重叠、目录树标题没有居中的问题。
  - SFTP 里指向文件夹的符号链接排在文件夹之后、文件之前。
  - 修复 AI 服务商列表里行内按钮点击无响应的问题。
