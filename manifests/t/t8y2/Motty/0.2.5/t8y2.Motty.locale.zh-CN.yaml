ReleaseNotes: |-
  新功能
  - SSH 主机表单新增「测试连接」：不保存也能按当前填写的内容试连，并说明走到哪一步——已连接、可达但未验证，或失败原因。
  - SSH 主机可以设置「登录后命令」，每个新 shell 就绪后自动输入一次，且不进入历史和广播。
  - 自动填充规则页新增 sudo 与 su 预设，创建规则时预填内容；规则仍默认关闭，首次发送前会征询确认。
  - 导入支持 Netcatty 导出的 CSV，SSH 与 Telnet 会话会变成主机；明文保存的密码不会被导入，导入后请删除该文件。
  - 关键字高亮支持从文本文件导入规则，并报告导入了多少条、跳过了多少条。
  - 命令补全的内联建议在本机历史没有匹配时，会用你在其他主机上输入过的命令。
  - 导入对话框新增「导入指南」链接，说明每个客户端从哪里导出文件。
  改进
  - 删除自动填充或高亮规则前会先确认，并说明固定文本是否会从保险库一并删除。
  - macOS 安装镜像打开后是拖放窗口：背景带箭头，把 Motty 拖进「应用程序」即可。
  修复
  - 终端里先于服务器回显显示的预测输入不再加下划线，只做灰显，慢速链路上不会像卡住的光标。
  - RDP 会话按窗格大小和显示缩放请求桌面并原样绘制，文字不再发虚，改变窗格后会跟随调整。
  - 已保存的 RSA 主机密钥重新连接时仍会提供 ssh-rsa，只支持 ssh-rsa 的设备不会报「没有共同的主机密钥算法」。
  - WebDAV 上传到服务器不允许创建的文件夹时会指出该文件夹，而不是只报 409。
