ReleaseNotes: |-
  新功能
  - 窗格可以用工具栏按钮或 Cmd/Ctrl+Shift+M 最大化，在标签页之间切换时保持，重启后也会恢复。
  - 退出时可以选择保留、丢弃或每次询问是否在下次启动时恢复窗口。
  - 关闭仍有会话的窗口前会先确认，可以在设置里关掉这个询问。
  - 双击会话标签页可以重命名或复制，具体动作在设置里选择。
  - 文件面板删除前可以选择普通删除或强制删除，删除过程中显示进度。
  - 远端工具的进程与容器表格可以拖动列宽，双击分隔条按内容自适应。
  - 终端菜单新增“打开所在目录”，可以直接在文件管理器中打开当前目录。
  - 快捷命令侧栏可以拖动内侧边缘调整宽度，宽度在重启后保持。
  改进
  - SFTP 目录树会在文件夹内容变化后自动刷新，已展开的层级保持展开。
  - 快捷命令侧栏改排在终端工具栏内侧，右侧工具栏重新贴住窗口边缘。
  修复
  - 在历史命令中上下翻动时，自动补全列表不再弹出挡住输入。
  - 在终端徽标、分栏工具和仪表盘等位置打开的菜单与下拉列表跟随触发控件，不再错位。
  - 在密钥链列表里用方向键选择时，选中项不再被重置。
  - 开启“启动时复用已打开的会话”后，连接已打开的主机或启动时打开会话会切到现有会话，不再重复建立连接。
  - 自动图标的 RDP 主机显示 Windows 标记，不再是通用显示器图标。
