ReleaseNotes: |-
  新功能
  - 主机支持嵌套分组，可重命名、新建子分组、移动整个分组、置顶和排序；删除分组时可以把主机转到其他分组。
  - 主机和标签的右键菜单可以复制连接名称，或连接地址和端口。
  - 工具栏图标可以自定义停靠位置（顶部、左右侧的上下组、底部的左右组），可以隐藏和拖拽排序，并能一键恢复默认布局。
  - 设置里可以调整侧边与底部工具栏的大小（小、中、大）。
  - 快捷键可以删除某个绑定，删除后显示「—」；「恢复默认」移到了设置页的页头。
  - RDP 桌面支持全屏，并可显示服务端报告的网络延迟；设置 → 终端 的「显示延迟」也作用于 SSH 终端。
  - 主机检测到 NAS、路由器或 Linux 发行版时，会显示对应品牌的标记。
  改进
  - 连接颜色只保留在标签和主机标记上，终端、文件和监控的标题栏改为中性配色。
  - 关于页的链接改用各品牌的标记。
  - 关闭标签页后会把内存归还给系统。
  - 终端控制序列的解析和滚动更快。
  修复
  - 快捷命令编辑器里未确认的输入法预编辑不会再被保存。
  - 文件面板打开时，Escape 仍会发送给终端。
  - RDP 在服务器拒绝 SPNEGO 时改用原始 NTLM，Windows 登录不再失败。
  - 退格后中文等宽字符仍留在原来的字符格上。
  - 在表单外点击不会再清掉已经输入的内容。
  - 快捷键录制框的关闭按钮只在悬停到自己时高亮。
