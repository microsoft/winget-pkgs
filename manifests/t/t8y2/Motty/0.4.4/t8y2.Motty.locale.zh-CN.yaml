ReleaseNotes: |-
  新功能
  - 终端可以按矩形选择并复制一块文本。
  - 在终端输入 cd、cat 等路径命令时，候选列表会列出当前目录的文件和文件夹；服务器走 SFTP，本地终端读本机文件系统并支持 WSL 路径。
  - 远程桌面主机可以选择「使用标准 RDP 安全」连接只提供该安全层的老服务器；连接前询问密码，状态栏标注连接未加密。
  改进
  - 命令补全的三种模式改为「仅快捷键」「自动列表」「行内建议」，说明写清各自何时打开列表。
  - 路径候选跟随补全模式打开，文件夹与文件用不同图标区分；点击候选项即可接受，终端的焦点不会丢失。
  修复
  - 修复 Windows 本地 shell（Git Bash、Cygwin 等 ConPTY 会话）里内联建议已显示、按右方向键或 End 却无法接受的问题。
  - 修复 0.4.3 连接 Windows 11 24H2、Server 2025 远程桌面时认证后被服务端断开、并提示密码可能错误的问题。
  - 修复 WebDAV 网盘在下载地址返回签名重定向时无法下载的问题。
  - 修复远程桌面主机编辑仍然显示远程编码选项的问题。
