ReleaseNotes: |-
  新功能
  - 工作区新增主栏+右侧、主栏+底部和标签切换三种布局；标签切换一次只显示一个终端，用顶部标签切换。
  - 布局菜单里把卡片拖到另一张卡片的边缘就能自由分栏，运行中的工作区里拖终端标题栏到另一个终端的边缘也可以，拖到中间则互换位置。
  - 中键点击标签可以直接关闭。
  - 代码片段支持手动排序和多行命令。
  - 多台主机可以共用同一个保存的密码，在设置的安全页统一管理，改一次对所有用到它的主机生效。
  - 代码片段可以通过 Gitee 同步。
  - 可以在设置里配置终端双击选词的分隔符。
  - 新建标签的选择器里，本地 shell 收成一组。
  改进
  - 工作区顶栏的按钮字号统一为 13，顶栏更矮。
  - 多个窗口同时打开时，AI 助手的设置会同步。
  - 终端的列宽和行高改为字体自身的度量，Windows 上 Consolas 不再显得松散。
  - 悬停和焦点的外观与框架统一。
  修复
  - Telnet 和串口会话里的设备命令按原样发送，不再被套上 shell 包装。
  - 远程桌面可以接收服务器端复制的文件。
  - 窗口实时缩放时，本地终端保持响应。
  - 打开终端查找栏时不再收起侧栏。
  - 第一次收进状态区时会给出说明。
  - 原生全屏下的工作区行为与远程桌面保持一致。
