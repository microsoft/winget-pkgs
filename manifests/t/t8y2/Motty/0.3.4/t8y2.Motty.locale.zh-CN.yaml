ReleaseNotes: |-
  新功能
  - 发现新版本时用提示条和窗口栏按钮提醒，不再弹出对话框打断正在做的事。
  - 慢速连接上一开始输入就显示文字，不必等一个来回。
  - 关闭还连着主机的会话前先确认。
  - 分屏打开的新 shell 起始于被拆分那块 shell 所在的目录。
  - 双击分屏的标题栏可以重命名，命令面板里也能改。
  - 在 sudo 提示处直接填入已保存的密码。
  - 双击按词、三击按整行选择，按住继续拖也是按词或按行。
  - 设置里可以调整终端行间距和光标粗细。
  - AI 面板显示请求活动、耗时和 token 用量。
  - 远程桌面里按住一个键会持续重复，RDP 不再只输入一次。
  改进
  - 每个窗口各自记住自己的标签、分屏、位置和大小；重开程序时按上次的窗口逐个恢复，新窗口从空白开始而不是复制前一个窗口的标签。
  - 更新提示改成窗口栏上的绿色圆环加实心箭头。
  - 命令补全的树只在用到时构建，打开程序少占约 10 MB。
  - 应用图标按 512 像素保留，少占约 3 MB。
  修复
  - 图标和紧随其后的空白不再被并进同一次绘制，Windows 和 Linux 上 Nerd Font 图标不被裁掉，电源线箭头旁不再出现浅色竖线。
  - 客户端退出后 motty mcp-serve 也会结束，Windows 上安装程序不会再因为 motty.exe 被占用而失败。
  - 断线重连后把终端交还新开的 shell，不再把鼠标移动当成输入。
  - 光标停在窗口外继续拖动时，滚动速度保持原样，不再减半。
  - 目录只读但文件可写时，SFTP 直接就地保存远程文本。
  - 程序被中断后留下的鼠标上报、备用屏幕和 kitty 键盘标志在提示符处收回。
  - Windows 上自动更新重启后主窗口不再隐藏。
  - 终端里 Shift+Insert 粘贴、Ctrl+Insert 复制。
  - 带修饰键的 Enter 组合编码一致。
  - AI 面板附加很长的粘贴文本时限制在 4 MiB。
