ReleaseNotes: |-
  新功能
  - 主机可以把交互终端改用 mosh 承载：切换网络、丢包或漫游时保持会话，慢链路上先显示输入的字符。需要在远端安装 mosh-server 并放行 UDP。
  - 文件面板支持在本机与服务器之间复制、粘贴文件。
  - 端口转发可以经主机的终端中继：服务器拒绝转发通道时，在主机上运行中继命令承载字节流，中继失败时页面会说明原因和解决办法。
  - 设置里的界面文字大小改为按像素调整，可逐级增减并一键恢复默认。
  - 分屏里的每个窗格都在自己的栏上带有关闭按钮，不必先切换过去或回到共享栏。
  改进
  - 恢复中或正在连接的分屏窗格不再占用旁边实时终端的宽度；共享栏保持在原位，工具在窗格可用前显示为禁用。
  修复
  - 修复 SFTP 文件面板的文件夹操作按钮与其它按钮挤在同一行的问题。
  - 修复在主机「移动分组」选择框上滚动鼠标不能切换目标分组的问题。
  - 修复恢复的 AI 对话里审批按钮被长对话挤出面板、盖住输入框的问题。
  - 修复 Windows 上无法识别 Microsoft Store 版 PowerShell 7 的问题。
  - 修复分屏切换焦点时，窗格栏上的名称和连接信息左右跳动的问题。
  - 修复在嵌套 shell 中无法补全命令的问题。
