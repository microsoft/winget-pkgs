ReleaseNotes: |-
  新功能
  - 可以导入 WinSCP 站点。
  - 在代理路由对话框里直接新建路由主机。
  - 命令片段侧栏可以停靠在左侧或右侧。
  - 终端右键菜单可以复制选中内容，或把它发送到终端。
  - 终端支持鼠标中键粘贴。
  - 文件编辑器支持配置文件格式化与代码折叠。
  - 回滚行数可以调到 50,000 和 100,000 行，设置里按步进调整。
  改进
  - 上传含大量小文件的文件夹时，SFTP 速度更快。
  - 默认提供 group exchange 密钥交换，能连上只支持该算法的服务器。
  修复
  - 关闭命令片段选择器后，键盘焦点回到终端。
  - 调整终端大小时，行号栏保持稳定，并按各个终端分别计算宽度。
  - SSH 重连后，文件传输窗口自动重连。
  - 终端内程序设定光标形状时，保留用户自己选的形状。
  - Caps Lock 会发送到远端会话。
  - 休眠抑制不再卡住界面。
  - SFTP 并发传输遇到 SSH_FX_FAILURE 时，自动回退为串行传输。
  - 刷新按钮按下后，不再出现键盘焦点环。
