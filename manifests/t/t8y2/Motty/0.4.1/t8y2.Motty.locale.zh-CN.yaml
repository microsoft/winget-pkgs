ReleaseNotes: |-
  新功能
  - 快捷命令列表可以展开行尾箭头查看完整多行命令，指针停留时也会弹出预览；删除前会先确认。
  - AI 助手的本地 Agent 后端新增 Pi CLI 支持。
  - 没有终端标签时，端口转发可以自行建立后台 SSH 连接来启动。
  - 主机标签可以在设置里集中管理。
  - 笔记窗口可以用源码模式打开，并记住上次使用的模式。
  - 终端在 su 的密码提示旁会列出已保存的密码，选中后才发送。
  - 终端配色新增 Snazzy 方案。
  - Workspace 可以选择本机的任意终端。
  - SFTP 多选后可以移动到另一个文件夹，名称保持不变。
  - 笔记可以打开系统交给 Motty 的 Markdown 文件。
  改进
  - Windows 本地终端改用随安装包提供的现代 ConPTY，改善默认颜色和同步刷新。
  - 主机网格按已占用列的最宽卡片排布，拖动窗口时卡片宽度不再跳变。
  - 工具栏的延迟读数留出更宽位置，高延迟数值不再被截断。
  - 移动主机到分组时改为层级菜单，可以直接选择任意层级。
  - 笔记侧栏的展开状态按标签页分别保存。
  - 笔记侧栏去掉多余空隙，并新增关闭按钮。
  - SFTP 文件面板的空白处右键菜单保留目录操作。
  修复
  - 修复 New Host 窗口从 VNC 切换到 RDP 时闪退的问题。
  - 松开组合键后不再把标签切回原来的终端。
  - 右键复制后清除选区，下一次右键可以直接粘贴。
  - 切换标签时不再误报笔记的后台输出提醒。
  - 保存主机失败时对话框保持打开并显示原因，不再丢失已填内容。
