ReleaseNotes: |-
  新功能
  - 文件传输可以按页签或独立窗口打开，并可选择本机或服务器显示在左侧；文件属性面板显示路径、类型、大小、修改时间、权限、所有者和链接目标。
  - 文件传输支持自定义编辑器：用选择的程序打开本地文件，远程文件会先下载，保存后同步回服务器。
  - 文件过滤可以搜索子文件夹，并显示匹配数量、已读取数量和无法读取的文件夹数。
  - 会话日志记录完整生命周期（开始、主机密钥、认证、结束与恢复），可按结果筛选，并能重新打开会话、定位主机、复制记录信息，支持多选。
  - 标签页可选水平（顶部）或垂直（左侧栏）布局，垂直标签可自动收起，并可把同一服务器的连接聚合在一起。
  - 设置 → 通用 可以选择界面字体，窗口、菜单和设置页都会使用它。
  - 远程桌面可以「只显示画面」，隐藏顶栏和状态栏。
  - 资源监控支持 macOS 主机和本机终端。
  - 备份与同步新增「测试连接」，并可从远端备份恢复本机设置；恢复前会保留一份安全副本。
  - 跳板路由可以「通过跳板主机的终端中转」，适用于只提供 shell 的堡垒机。
  改进
  - 新增界面文字大小（小、标准、大），窗口和设置页一起缩放。
  - 终端工具栏在工作区共用，位置可选左侧或右侧，操作跟随当前分屏。
  - SFTP 上传改为滑动窗口的流水线写入，上传更快。
  - 资源监控缓存仪表盘图表、只绘制可见的行；macOS 不再显示空的每核心区块。
  - 更换终端字体时可以预览，确认后才会保存。
  修复
  - 修复内置命令补全目录的更新，并审计目录内容。
  - SFTP 删除文件夹时会连同其中所有内容一起删除，并先要求确认。
