ReleaseNotes: |-
  新功能
  - 支持 FIDO2 安全密钥（sk-* 密钥）登录，PIN 与口令在窗口中输入。
  - 支持 Kerberos 认证（macOS、Windows、Linux）；Linux 需要系统已安装 libgssapi_krb5。
  - 工作台左侧新增会话管理面板，可搜索已保存的主机，双击或回车即可在新标签页中打开。
  - 多行文本粘贴前会先在对话框中预览确认，也可以逐行发送；可在终端设置中关闭确认。
  - SFTP 上传或下载因连接断开中止后，重新连接即可续传；传输中心保留该任务，失败的任务可以重试。
  - 本地标签页可以按其运行的编码助手命名。
  - SFTP 工具栏可以通过右键菜单自定义。
  改进
  - AI 助手的步数上限改为可输入的步进器，范围 1–500，默认 30。
  - AI 助手在引用的其他连接上执行操作时，是否免审批由自动运行范围决定；高危操作仍需输入确认词，工具卡片会显示目标连接。
  - 全局传输中心的信息密度与队列排序更清楚。
  - 双栏 SFTP 的传输队列与进度详情重新整理。
  - 快捷命令与本地代理的图标更容易区分。
  - 设置页滚轮滚动更平滑。
  - 查找栏的控件收拢为一个全宽输入框。
  修复
  - 修复 SSH 终端连接后首个提示符所在行被清空、页面异常刷新的问题。
  - 修复 ZMODEM 传输结束时多余字节被显示为乱码的问题。
  - 修复“编辑”菜单中的“查找”打开查找栏后，焦点仍停留在终端的问题。
  - 修复编辑主机时保存一次性验证码密钥，并同时提交已保存密码会导致程序卡死的问题。
  - 修复选择“私钥”认证后无法继续服务器要求的 OTP / 键盘交互式二次认证的问题。
  - 修复 AI 执行命令后，左侧输出条中断、只显示当前屏幕的问题。
  - 修复 top 等程序清屏后，之前的输出从滚动历史中消失的问题。
  - 修复 Windows 上覆盖安装正在运行的 Motty 时，因 conpty.dll 被占用而中止的问题。
  - 修复 SFTP 传输写入被 shell 拒绝时，要等到超时才报错的问题，现在会立即失败。
  - 修复网关不响应 shell 请求时，标签页一直停在连接页的问题。
  - 修复响应较慢但仍在线的连接被保活检测误判为断开的问题。
  - 修复 SFTP 未选中文件行时历史快捷键无效的问题。
  - 修复服务器日志无法在终端工具栏中调整位置的问题。
