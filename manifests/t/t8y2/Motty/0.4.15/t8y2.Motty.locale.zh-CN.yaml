ReleaseNotes: |-
  新功能
  - 支持从 FinalShell 的数据目录导入主机与分组；其保存的密码经过加密，导入只包含连接信息。
  - RDP 远程桌面可以播放远端的声音，输出到本机的默认播放设备；可在主机设置中按主机关闭。
  - 会话管理面板成为可管理的树：可以直接新建分组、拖拽主机与分组、复制粘贴、移动到分组。
  修复
  - 修复 SFTP 上传断线续传时重复读取已发送内容的问题。
  - 修复 SFTP 上传续传时可能误用另一来源留下的部分文件、导致内容被截断的问题。
  - 修复下载长文件名时文件名被过度截断的问题。
  - 修复 Linux 上远程监控在 /bin/sh 等非 bash 环境下采样失败的问题。
  - 修复终端中打印过快的程序会把输出无限堆积、最终耗尽内存的问题。
  - 修复 mosh 连接中打印过快的程序会让输出无限堆积、最终耗尽内存的问题。
  - 修复 Windows 上无法从选定安装中解析 Pi 启动器的问题。
  - 修复 shell 集成安装期间连接断开时，激活命令的回显被显示到屏幕的问题。
  - 修复 shell 集成激活行延迟到达时，回显出现在屏幕上的问题。
  - 修复 AI 助手停止请求可能一直停在“正在停止”的问题，并释放其占用的连接。
  - 修复撕下的窗口与首个窗口共用编号，导致托盘菜单项冲突的问题。
  - 修复笔记保存失败时没有提示、之后无法继续编辑的问题。
  - 修复代码片段里的 Go 模板字段被当作片段变量、在运行前要求填写的问题。
  - 修复从命令栏发送快捷命令后焦点没有回到终端的问题。
  - 修复文件面板没有跟随终端目录变化的问题。
  - 修复命令栏没有横跨内容区宽度的问题。
  - 修复主机列表里长主机名被截断、地址被挤掉的问题。
  - 修复 AI 上传在得知文件大小后才显示进度的问题。
