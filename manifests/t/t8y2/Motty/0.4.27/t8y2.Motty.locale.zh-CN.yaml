ReleaseNotes: |-
  新功能
  - 支持导入 Tabby 的 SSH 会话和保险库。
  - 监控新增 GPU 视图，并按需采集每台主机的数据。
  - 主机搜索框新增清除按钮。
  - 本地文件和文件夹可以在系统文件管理器中显示。
  - 进程与容器窗口支持“关闭标签页”快捷键。
  改进
  - “已打开时不再新增”默认关闭：双击已打开的主机会再开一个标签页，需要时可在“设置 → 连接”里重新开启。
  - 终端里 Ctrl+Backspace 按词删除。
  - 终端执行命令后，SFTP 文件视图和目录树会自动刷新。
  - 保存文档时的进度提示更明显。
  - 进程与容器窗口的标题与入口名称一致。
  - macOS 上支持 PAC 代理配置。
  修复
  - 笔记重命名后不再误报“名称为空”而阻塞导航。
  - 从资料库抽屉切换笔记时能正确切换。
  - 拖拽上传后，文件夹列表和各个视图会自动刷新。
  - 模型筛选和排序控件在窄窗口里不再溢出。
  - VNC 远程桌面剪贴板正确支持 UTF-8 文本。
  - SFTP 上传无法完成时，错误提示会说明是哪一步失败。
  - 打开“保持窗口”提示时界面会及时刷新。
