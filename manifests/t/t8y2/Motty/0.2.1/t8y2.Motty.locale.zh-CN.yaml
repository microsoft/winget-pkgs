ShortDescription: 原生桌面 SSH 工作台：终端、SFTP/SCP、端口转发、VNC 与 RDP 远程桌面、AI 助手都在一个窗口里。
Description: Motty 是一款用 Go 编写的原生桌面 SSH 客户端，把终端、SFTP/SCP 文件传输、端口转发与跳板链、VNC 与 RDP 远程桌面以及 AI 助手放在同一个窗口里，不使用 Electron，也没有内嵌浏览器。主机密钥会在发送任何凭据前完成校验，保险库使用 AES-256-GCM 加密，密钥保存在系统密钥库中。
