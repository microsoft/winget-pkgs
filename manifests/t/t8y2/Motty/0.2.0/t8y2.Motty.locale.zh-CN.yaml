ReleaseNotes: |-
  新功能
  - 可以新建监控面板，把多台 SSH 主机的 CPU、内存、磁盘和网络放到一屏。
  - 面板支持简洁和详细视图、分组筛选、拖动排序，以及采集间隔和保留时长。
  - 面板可以开始和停止采集，失败能重试，并直接从面板打开终端。
  - 远程发来的响铃会播放系统提示音，设置里可以关闭。
  - 终端链接默认要按住 Cmd/Ctrl 才打开，普通点击改为选中复制。
  - 设置里可以恢复「普通点击打开链接」的旧行为。
  - 备用屏滚轮默认开启，在 less、vim 里滚动会发送方向键。
  - 终端标签可以跟随程序的 OSC 0/2 标题，改过名的标签不受影响。
  - macOS 上 Command+←/→/Delete 会按 Ctrl+A/E/U 发送。
  - 主机表单的密码框有了显示/隐藏按钮，并新增单把密钥的口令字段。
  - 口令和验证码密钥改为跟随主机保存，改地址不会丢，删主机一起删。
  改进
  - 密码库不再使用主密码：密钥存进系统密钥链，没有时（和便携版）存在程序旁的 vault.key。
  - 旧版用主密码保存的数据首次启动会弹窗转换一次，之后旧版本无法再打开这份数据。
  - 终端滚动条只在指针悬停时出现，键盘滚动后会亮一秒。
  - 监控面板的翻页键可以滚动整页，采集开销也更低。
  修复
  - 选区拖到终端外会自动滚动并继续扩展，滚动时选区不再消失。
  - 很长的选区改用 OSC 52 分块复制，不再复制失败。
  - 输出还在解析时不再弹出待发送确认。
  - macOS 上 zsh 的跨会话历史不再丢失。
  - 助手输入框里的 Option/Command 编辑键生效。
