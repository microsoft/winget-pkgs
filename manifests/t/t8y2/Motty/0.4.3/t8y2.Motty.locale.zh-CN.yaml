ReleaseNotes: |-
  新功能
  - 主机可以拖动排序，拖动时显示落点。
  - 主机卡片显示 SSH、RDP、VNC 等连接类型标签。
  - 主机可以指定远程字符集，终端按所选编码显示输出。
  - 终端补全建议旁显示接受建议的快捷键，点击可以更换。
  - 文件面板可以开启「跟随终端目录」，随终端切换文件夹。
  - 快捷命令列表可以用快捷键打开。
  - 搜索框打开时会选中原有内容，直接输入即可替换。
  - 可以在会话标签的菜单里通过 SSH 隧道打开浏览器。
  - AI 助手的输入框可以引用笔记作为上下文，并搜索、编辑笔记。
  - 文件、笔记和远程工具窗口使用统一的标题栏，可以拖动并避开窗口按钮。
  改进
  - 停靠的 AI 面板限制在侧栏与窗格之间，不再与侧栏连成一片。
  - AI 输入框的按钮在窄面板里换行排列，不再超出边界。
  - AI 模型选择按会话记住，切换会话不会串用，也不改动默认设置。
  修复
  - 文件传输窗口的本地一侧现在可以删除文件。
  - 修复传输请求重复堆积时应答到旧请求、导致传输卡住的问题。
  - 修复导入的 SSH 配置忽略 keepalive 和 IdentityFile、证书限制的问题。
  - 修复在搜索框输入 host:port 时把已保存的远程桌面当作 SSH 连接打开的问题。
  - 修复连接 Windows 7 和 Server 2008 R2 远程桌面时认证后立即断开的问题。
  - 修复通过 NLA 连接 libfreerdp 3.x 服务端（如 Ubuntu 24.04 的 GNOME Remote Desktop）时认证失败的问题。
  - 修复 AI 面板变窄后批准与拒绝按钮被挤出视图的问题。
  - 修复 AI 批准按钮被卡片背景遮住、几乎看不见的问题。
  - 修复远程工具窗口的浮层无法接收点击的问题。
  - 默认下载目录在文件面板和传输中心都生效。
  - 传输中心的卡片控件不再超出列表边界。
  - 修复停用的工具无法拖动排序的问题。
