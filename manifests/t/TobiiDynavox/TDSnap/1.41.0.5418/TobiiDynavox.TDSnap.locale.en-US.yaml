ShortDescription: AAC communication software with eye gaze, touch and switch-enabled page sets for people with speech and language disabilities.
Description: |-
  TD Snap is a flexible software offering professionals and families a choice of evidence-based page sets. It comes with a set of powerful tools and resources to empower people with speech and language disabilities to communicate.

  Success looks different for everyone. TD Snap offers a suite of eye gaze, touch and switch-enabled page sets to meet different communication needs and preferences, including Core First, Express, and Text page sets.

  All TD Snap page sets come with a powerful set of tools to help simplify editing and enrich communication:
  - Editing: an intuitive editing tool to help customize buttons to meet a communicator's unique needs
  - Search: a search bar to locate words and symbols with an easy-to-follow path to find them
  - Visual supports: visual schedules, timers, and scripts to help with receptive language and self-regulation
  - Quick phrases: a set of commonly used pre-programmed phrases for typical daily situations
  - Diversity: settings to customize skin tones and hair colors across the symbols of a page set
  - myTobiiDynavox: a cloud-based resource for backing up, sharing, and connecting content with your communication team
