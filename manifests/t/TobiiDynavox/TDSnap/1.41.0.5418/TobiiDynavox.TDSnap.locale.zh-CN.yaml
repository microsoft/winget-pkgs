ShortDescription: 一款 AAC 辅助沟通软件，提供可通过眼控、触控和特殊开关控制来使用的沟通页面集，帮助有言语语言障碍的人士自由表达。
Description: |-
  TD Snap 为有言语语言障碍的人士提供一套专业的 AAC 辅助沟通解决方案，实现沟通无障碍。支持触控、眼控和特殊开关控制，满足用户不同的需求。

  成功沟通的形式因人而异。TD Snap 提供一系列眼控、触控和开关页面集，满足不同用户的沟通需求与偏好，包括 Core First、Express 和 Text 等页面集。

  每套 TD Snap 页面集都自带一组强大的工具，帮助简化编辑并丰富沟通：
  - 编辑：直观的编辑工具，帮助按沟通者的独特需求自定义按钮
  - 搜索：搜索栏可查找词语与符号，并提供易于跟随的查找路径
  - 视觉支持：视觉时间表、可视计时器与剧本等工具，帮助接受性语言与自我调节
  - 快捷短语：预设的常用短语，便于在日常情境中快速表达
  - 多元化：可自定义符号的肤色与发色等外观设置
  - myTobiiDynavox：云端资源库，用于备份、分享素材与页面，并与沟通团队协作
