ReleaseNotes: |-
  DeskBox 1.5.6 is a feature update: widgets now belong to the display they sit on with per-combination layouts that reflow elastically across scales, backup restores adapt to the machine they land on, widgets can be dressed up (icons, backgrounds, panorama), the settings window got an information-architecture pass, and a pre-release file-safety audit round closed every reachable data-loss path.
  Released on October 12, 2026.
  Highlights
  - Widgets belong to their display. Dragging a widget to a screen makes that screen its home; every combination of connected displays keeps its own arrangement. Unplugging moves its widgets to a remaining screen after a short grace period (or collapses them into capsules); replugging returns every widget to its exact spot. A new Displays page identifies screens, pins layouts in one click, and sets the default display for new widgets.
  - Layouts reflow elastically across scales. Profiles record sizes and anchors per display instead of raw pixels, so 1080p ↔ 4K switches, remote sessions, and DPI round-trips reflow the arrangement instead of stretching widgets or leaving gaps; Windows-side changes (primary switches, rearrangement, full-screen games, late docks) no longer shuffle widgets at all.
  - Restores adapt to the machine. A full restore onto another PC or account re-registers startup per the backup's state, rebases account-local paths into the current profile, and reports what was adapted; Store-edition restores complete instead of failing at relaunch.
  - Dress up your widgets. Emoji or image icons, per-widget backgrounds with fit and dim, border styles, three global background modes (material, unified image, or a panorama where each widget frames its own slice), and a text-shadow toggle.
  - Record your own hotkeys. A press-to-record editor accepts any Win / Ctrl / Alt / Shift combination or a lone F1–F24 key — including chords Windows reserves, like Win+V or Alt+Space.
  - A tidier Settings window. Low-frequency settings fold into accordions, pages put fundamentals first, sections slide in and out like Windows' own Settings, destructive actions ask before acting, and notifications deep-link to the settings page they concern. The file-stacking page is reorganized into reveal mode and automatic-stacking accordions with the master switch retired.
  - Safer storage migration. Moving files into managed storage is copy-verified with preview, per-phase progress, and resumable retry; originals are never deleted.
  - Run quietly. Silent startup keeps DeskBox hidden until the first tray click or hotkey; elevated launches explain the drag-and-drop restriction and offer a one-click restart at normal privileges.
  - File-safety hardening. A three-round pre-release audit found zero P0 paths and fixed every reachable data-loss path: unconfirmed restores are discarded, deletions honor the Recycle Bin promise on every volume type, and attachment removal can only touch managed copies.
  - Memory and CPU housekeeping, plus a run of retail-only AOT fixes (weather overlay, cursors, transparency advisory, cloud-backup password box) and feedback-driven repairs (Win10 drag-outs, tray double-click, WeChat/QQ clipboard images, cross-volume import honesty).
  Platform: Windows App Runtime 2.5.1, .NET 10.0.12, and the Windows 10 floor drops to build 19041 (version 2004).
  See CHANGELOG.md for the complete list.
