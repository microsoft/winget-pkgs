ReleaseNotes: |-
  DeskBox 1.5.6 是一次功能大版本：格子归属所在显示器、每种显示器组合独立布局并随缩放弹性重排，备份还原适配落地机器，格子支持图标/背景/全景装扮，设置窗口完成信息架构梳理，发版前文件安全审计关闭了全部可达数据丢失路径。
  2026 年 10 月 12 日发布。
  主要更新
  - 格子归属显示器。 拖到哪块屏就归属哪块屏，每种显示器组合各自记住摆放；拔屏后宽限迁移（或收胶囊），插回精确归位。新「显示器」页支持识别、一键固定布局、指定新格子默认屏。
  - 布局随缩放弹性重排。 档案按每屏参考系记录尺寸与锚点，1080p↔4K、远程会话、DPI 往返按弹性规则重排；切主屏、重排显示器、全屏游戏、晚到扩展坞都不再打乱格子。
  - 还原适配本机。 整包还原到另一台电脑或账户时自启按备份状态重注册、账户本地路径迁入当前用户并说明适配项；商店版还原不再在重启环节失败。
  - 装扮你的格子。 表情/图片图标、每格背景图（契合+明暗）、边框样式、三种全局背景模式（跟随材质/统一图片/全景取景）、文字阴影开关。
  - 快捷键自己录。 按住即录，Win/Ctrl/Alt/Shift 任意组合或单独 F1–F24，Win+V、Alt+Space 等系统保留组合也能录入。
  - 更清爽的设置窗口。 低频设置收进风琴、页面基础项靠前、Windows 式滑入转场、危险操作先确认、通知深链直达；文件叠放页重组为展开方式+自动叠放两风琴，总开关退役。
  - 更安全的收纳迁移。 先复制后校验：预览、分阶段进度、可恢复重试，源文件绝不自动删除。
  - 安静运行。 静默启动隐藏到首次唤回；提权启动说明拖拽限制并一键降权重启。
  - 文件安全加固。 发版前三轮审计零 P0，修复全部可达数据丢失路径：未确认还原丢弃、删除在所有卷类型兑现回收站承诺、附件移除只碰托管副本。
  - 内存与 CPU 治理、零售 AOT 修复一批（天气遮罩/光标/透明提示/云备份密码框）与反馈驱动修复（Win10 拖出、托盘双击、微信 QQ 剪贴板图片、跨盘导入诚实收尾）。
  平台：Windows App Runtime 2.5.1、.NET 10.0.12，Windows 10 支持下限降至 19041（2004 版）。
  完整条目见 CHANGELOG.md。
