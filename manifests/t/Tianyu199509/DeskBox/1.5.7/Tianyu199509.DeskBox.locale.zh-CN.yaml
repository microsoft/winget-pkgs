ReleaseNotes: |-
  DeskBox 1.5.7 是可靠性与打磨更新：托盘退出后进程必定结束（部分机器上退出后曾残留后台进程并持续吃内存）、修复 Windows 10 拖出设置卡片、对话框重新跟随应用主题、桌面整理规则行恢复可点击。
  2026 年 10 月 13 日发布。
  主要更新
  - 退出可靠性。 从托盘退出后进程必定结束。在系统"应用退出"握手机制失灵的机器上（典型为 UAC 完全关闭且资源管理器以管理员运行的 Windows），退出后曾残留一个后台进程：托盘消失、再次启动也正常，但残留进程慢慢吃内存，还带着右键菜单代理一起驻留（反馈 555/556）。现在所有退出路径都带延迟强制结束保底，提权提示窗与搜索弹窗也随退出关闭；直装版与商店版同享修复。
  - Windows 10：拖出卡片保住标题。 「设置 → 文件格子 → 文件拖放行为 → 拖出格子时」卡片在 Windows 10 上丢失标题与问号提示，说明文字还会撑坏卡片或在高缩放窄窗口下溢出边界；现改为在标题下方描述区渲染，任意宽度与缩放安全换行，Windows 11 不变。
  - 对话框跟随应用主题。 桌面整理的放弃确认、预览卡、热键录制弹窗此前在应用主题覆盖与系统主题不一致时取错颜色；现按各自窗口主题解析，规则行随主题切换重建配色。
  - 规则行恢复可点击。 1.5.6 转换时同时带入的残留箭头（双箭头）与吞点击守卫已修复，并由契约测试钉住。
  完整条目见 CHANGELOG.md。
