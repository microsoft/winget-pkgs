Description: 无限画布是一款面向图片、视频、音频全能创作的开源 AI 创作工作台。它把画布编排、AI 图片/视频/音频生成、参考图编辑、对话助手、提示词库和素材沉淀放在同一个界面里，支持多画布项目、3D 导演台运镜、全景图生成、摄像机控制、生图工作台、创作工作流和画布 Agent，并兼容 OpenAI 接口及多种 API 服务。
