ShortDescription: Open-source AI creation workbench integrating an infinite canvas, agent, director console, panorama, AI image generation, image editing, video generation, and canvas orchestration, compatible with OpenAI interfaces and various API services
Description: Infinite Canvas is an open-source AI creation workbench for image, video, and audio creation. It brings canvas orchestration, AI image/video/audio generation, reference image editing, chat assistant, prompt library, and asset management into one interface, with support for multi-canvas projects, a 3D director console, panorama generation, camera control, an image generation workbench, creation workflows, and a canvas agent. It is compatible with OpenAI interfaces and various API services.
