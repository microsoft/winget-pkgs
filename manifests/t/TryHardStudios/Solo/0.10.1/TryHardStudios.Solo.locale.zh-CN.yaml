ShortDescription: 编码智能体的元编排层。
Description: |-
  Solo 是编码智能体的元编排层：一个可编程的控制平面，让 Claude、Codex、OpenCode、Pi、自定义智能体和你的开发工具链协同工作。可以让 Codex 派生 Claude 和 OpenCode、拆分工作、共享上下文并汇总结果，全程无需离开工作区。
  第一天起无需改变你的工作方式：先从一个安静的原生终端工作区开始，逐步加入你每天使用的开发工具，然后在需要时让智能体在同一个环境中工作。Solo 在 macOS 和 Windows 上四个项目以内免费。
