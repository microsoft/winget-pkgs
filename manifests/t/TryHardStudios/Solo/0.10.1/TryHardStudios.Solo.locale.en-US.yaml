ShortDescription: The meta-harness for coding agents.
Description: |-
  Solo is the meta-harness for coding agents: a programmable control plane where Claude, Codex, OpenCode, Pi, custom agents, and your dev stack work together. Ask Codex to spawn Claude and OpenCode, split the work, share context, and bring the result back — without leaving the workspace.
  Start with a calm, native terminal workspace instead of changing the way you work on day one. Add the parts of your dev stack you use every day, then let agents work in the same environment whenever the job calls for them. Solo is free for four projects on macOS and Windows.
