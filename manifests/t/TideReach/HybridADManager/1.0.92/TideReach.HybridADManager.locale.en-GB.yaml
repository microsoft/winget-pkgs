ShortDescription: The Active Directory admin tools in a browser, with Entra ID merged in. Users and Computers, Sites and Services, Domains and Trusts, DNS and Group Policy in one web console.
Description: |-
  Hybrid AD Manager replaces the RSAT snap-ins with one web console. It installs as a Windows service on a domain controller or member server and is used from any browser.

  Active Directory Users and Computers, Sites and Services, Domains and Trusts, DNS and Group Policy Management each have their own tab, laid out the way the Microsoft consoles are, so nobody needs retraining. An Entra ID tenant can be connected and is merged into the same view: every account shows whether it is synced, cloud-only or on-premises only, and a synced user opens the same full property sheet from either side.

  All thirteen property tabs are included, among them a full Security tab with an Advanced ACL editor for object and property-level entries, Dial-in, Published Certificates and the Attribute Editor.

  Administrators sign in with their own Active Directory accounts, so every change is made with the permissions Active Directory already gives them and is recorded in an audit log. The console serves HTTPS using a certificate you install, talks LDAPS to your domain controllers, and sends nothing anywhere: no agents on workstations, no database, no telemetry.

  The free edition included in this package has every tool read-only, with lists capped at 15 items per container. A licence key enables writes and full lists.
