PackageIdentifier: Tyro.TerminalAdapter
PackageVersion: 1.3.05
PackageLocale: zh-CN
License: 专有软件
ShortDescription: 用于让销售终端（POS）系统与 Tyro EFTPOS 收款终端通信的适配器程序。
Description: |-
  Tyro Terminal Adapter（TTA）是 Tyro 提供的程序，销售终端（POS）系统和诊所管理软件（PMS）通过它向 Tyro EFTPOS 收款终端发送交易请求并接收返回结果。需要将 TTA 安装在运行 POS 或 PMS 软件的计算机上，再把 Tyro EFTPOS 终端与适配器配对，两个系统之间才能传递消息。
  安装完成后，Tyro Terminal Adapter 会出现在 Windows 控制面板中。在该程序中确认默认商户 ID（Merchant ID）和终端 ID（Terminal ID），选择配对模式，然后在收款终端上开始配对。
  Tyro 说明该软件需要 .NET Framework 2.0；较新的 Windows 版本需要通过启用 .NET Framework 3.5 Windows 可选功能来获得该组件，并且安装时需要管理员权限。
