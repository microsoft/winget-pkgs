ShortDescription: Program that lets point-of-sale systems communicate with Tyro EFTPOS terminals.
Description: |-
  Tyro Terminal Adapter (TTA) is Tyro's program that point-of-sale (POS) and practice management (PMS) systems use to send transaction requests to and from Tyro EFTPOS machines. It is installed on the computer that runs the POS or PMS software, and the Tyro EFTPOS terminal is then paired with the adapter so the two systems can exchange messages.
  After installation, the Tyro Terminal Adapter appears in the Windows Control Panel, where the default Merchant ID and Terminal ID are confirmed and a pairing mode is selected before pairing is started from the terminal.
  Tyro states that the software requires .NET Framework 2.0, which newer Windows versions enable through the .NET Framework 3.5 Windows feature, and that installation requires administrator access.
