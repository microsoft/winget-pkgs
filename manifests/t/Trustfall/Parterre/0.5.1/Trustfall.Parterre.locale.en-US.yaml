ShortDescription: A standalone, TortoiseGit-style revision graph viewer for git repositories.
Description: |-
  parterre draws the branches and tags of a git repository as a compact revision graph, in the
  style of TortoiseGit's Revision Graph, and lets you rearrange it by hand. From the graph you
  can browse the log, compare commits, and view file diffs and blame. It uses the git command
  line, which is installed with it.
