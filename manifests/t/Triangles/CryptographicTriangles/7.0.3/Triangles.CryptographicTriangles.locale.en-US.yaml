PackageIdentifier: Triangles.CryptographicTriangles
PackageVersion: 7.0.3
PackageLocale: en-US
Publisher: Triangles
PublisherUrl: https://cryptographic-triangles.org
PackageName: Cryptographic Triangles (tri7)
License: MIT
ShortDescription: Cryptographic Triangles (TRI) node + wallet — tri7 Rust rewrite with PoS staking, Tor and I2P, encrypted messaging, and a built-in explorer.
Description: |-
  Cryptographic Triangles (TRI) is a privacy-focused cryptocurrency
  featuring Proof-of-Stake consensus, Tor v3 onion routing AND I2P
  (dual-network, first-class), encrypted peer-to-peer messaging (smsg),
  and a built-in local block explorer. tri7 is the modern Rust rewrite
  of the original 2014 client (Hash9 algorithm), with a lightweight
  daemon (tri7d) and an egui wallet GUI.
