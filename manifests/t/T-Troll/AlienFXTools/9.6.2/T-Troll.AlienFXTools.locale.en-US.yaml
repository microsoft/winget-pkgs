ReleaseNotes: "# **Important!** If you are using tools for the first time, please read the [Beginner's guide](https://github.com/T-Troll/alienfx-tools/wiki/How-to-start-(Beginner's-guide)) and [AlienFX-GUI readme](https://github.com/T-Troll/alienfx-tools/blob/master/Doc/alienfx-gui.md) to configure its concept and operation principle.\n\n### `Fan-SDK_V1.zip` has binaries built against older fan control versions; use it only in case you know what you're doing (or have Aurora R7). Check [the readme](https://github.com/T-Troll/alienfx-tools/blob/master/alienfan-tools/alienfan-SDK/aliefan_v1.md) file inside the archive first to configure it to work!\n\n### Changes in this release:\n\n`Lights control SDK`:\n• A bunch of bugs fixed for APIv6 (Monitors). It should work correctly now.\n• Bug fixed in light action set for APIv1-v3 (older systems). A single-light set should work better.\n• Code optimization：all light-related tools are smaller in size.\n\n`AlienFX-GUI, AlienFan-GUI`:\n• CPU modes now per-profile (and update Windows defaults for power plan).\n  • It will not be restored after the Windows power plan changes until the profile is selected again.\n  • Old settings are removed; please set it up again (both for system and custom fan profiles)!\n• Bug fixed：Power mode can not be set correctly after a profile change.\n• Other small fixes and optimization.\n\n`Other changes`:\n• `AlienFX-CLI` added to Fan SDK v1 build."
