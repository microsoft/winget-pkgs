ReleaseNotes: |-
  【0.11.2】
  新增
  - 统计卡片可以修改统计口径。
  - 统计卡片可以自己挑：点「编辑卡片」，从卡片库加入、移除、拖动排序。
  - AI 总结支持手动修改。
  修改
  - AI 总结的日报改成时间线，周报改成一周的热力图，点某一天可以看当天的日报。
  - 增强了深色模式下，深色图标的对比度。
  - 增强了深色模式下，文字、按钮、背景和图表的对比度。
