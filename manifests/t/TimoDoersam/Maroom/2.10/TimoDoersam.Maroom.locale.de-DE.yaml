PackageIdentifier: TimoDoersam.Maroom
PackageVersion: "2.10"
PackageLocale: de-DE
Publisher: Timo Dörsam
PackageName: Maroom
License: MIT
ShortDescription: Eigene Desktop-Symbole auf jedem virtuellen Desktop von Windows 11.
Description: |-
  Maroom gibt jedem virtuellen Desktop von Windows 11 eigene Desktop-Symbole an eigenen Positionen.
  Dazu kommen der Wechsel mit den Maus-Seitentasten oder Alt+1/Alt+2, das Verschieben von Fenstern
  auf einen anderen Desktop (Alt+Shift+1/2 oder über das Fenstermenü) und eine kurze Einblendung beim Wechsel.
  Installation pro Benutzer ohne Administratorrechte.
