ShortDescription: Your own desktop icons on every Windows 11 virtual desktop.
Description: |-
  Maroom gives every Windows 11 virtual desktop its own desktop icons in their own positions.
  It also switches desktops with the mouse side buttons or Alt+1/Alt+2, moves windows to another
  desktop (Alt+Shift+1/2, or from the window menu) and shows a short overlay when switching.
  Per-user install without administrator rights.
