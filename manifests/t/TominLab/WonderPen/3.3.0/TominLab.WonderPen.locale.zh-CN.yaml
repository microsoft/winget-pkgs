ReleaseNotes: |-
  ## 思维导图

  - 白板新增「思维导图」卡片类型，并支持切换为大纲视图
  - 思维导图支持导出为图片、PDF 文件

  ## 界面与自定义

  - 调整界面布局，左右边栏中的工具支持拖拽调整位置，并可设置为纵向或横向显示
  - 目录树右键菜单支持自定义
  - 编辑器选中文本后浮出的工具栏按钮支持自定义
  - 多标签视图新增「临时标签」模式

  ## 编辑器与写作

  - 编辑器支持使用亮色光标（自定义光标）

  ## 优化与修复

  - 修复系统开启「减少动画效果」时，目录列表最后一项会滚动回弹的问题
  - 一些细节改进和小问题修复
