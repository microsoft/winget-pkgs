ReleaseNotes: |-
  ## Mind Maps

  - Added a new Mind Map card type to the Whiteboard, with support for switching to an Outline view
  - Mind maps can now be exported as images or PDF files

  ## Interface & Customization

  - Updated the interface layout: tools in the left and right sidebars can now be reordered by dragging and displayed vertically or horizontally
  - The context menu in the document tree can now be customized
  - The floating toolbar that appears when text is selected in the editor can now be customized
  - Added a new Temporary Tab mode to the multi-tab view

  ## Editor & Writing

  - The editor now supports a light-colored cursor with custom cursor options

  ## Improvements & Fixes

  - Fixed an issue where the last item in the document tree would bounce back when the system's Reduce Motion setting was enabled
  - Various minor improvements and bug fixes
