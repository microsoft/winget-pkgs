ReleaseNotes: |-
  New Features

  The following are new features included in Tenable Agent 11.2.4:
  - Agents linked to Tenable One Vulnerability Management and Tenable Nessus Manager can now use agent profile settings to determine how often they check in for plugin updates.
  Security Updates
  The following are security updates included in Tenable Agent 11.2.4:
  - Updated expat to 2.10.0.
    For more information, see the Tenable Product Security Advisory.
  Bug Fixes
  | Bug Fix                                                                                         | Defect ID |
  | ----------------------------------------------------------------------------------------------- | --------- |
  | Fixed an issue where corruption of the plugins library database did not trigger a health event. | 02503126  |
  Upgrade Notes
  - You can upgrade to the latest version of Tenable Agent from any previously supported version.
  - If your upgrade path skips versions of the Tenable Agent, Tenable recommends reviewing the release notes for all skipped versions to learn about new features and bug fixes.
  - If you are connecting to Tenable One Vulnerability Management through Tenable Nessus scanners, Tenable Agents, Tenable One Web App Scanning scanners, or Tenable Network Monitors (NNM) located in mainland China, you must connect through sensor.cloud.tenablecloud.cn instead of sensor.cloud.tenable.com.
