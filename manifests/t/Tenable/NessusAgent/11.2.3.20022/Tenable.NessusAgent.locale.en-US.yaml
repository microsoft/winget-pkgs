ReleaseNotes: |-
  Bug Fixes
  | Bug Fix                                                                                                                                                           | Defect ID                    |
  | ----------------------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------------- |
  | Fixed an issue that prevented health alerts from triggering when agents entered a plugin update failure loop.                                                     | 02503126                     |
  | Fixed an issue in which the automatic upgrade process failed to install the continuous assessment module on Windows, which generated critical health alerts.      | 02523161, 02541857, 02505736 |
  | Fixed a race condition between a “declared version” taking effect on the agent and “disable agent updates” taking effect in Tenable One Vulnerability Management. | 02508030                     |
  Supported Platforms
  The following are supported platform updates made in Tenable Agent 11.2.3:
  - Removed support for Debian 11.
  - Removed support for Kali Linux.
  Upgrade Notes
  - You can upgrade to the latest version of Tenable Agent from any previously supported version.
  - If your upgrade path skips versions of the Tenable Agent, Tenable recommends reviewing the release notes for all skipped versions to learn about new features and bug fixes.
  - If you are connecting to Tenable One Vulnerability Management through Tenable Nessus scanners, Tenable Agents, Tenable One Web App Scanning scanners, or Tenable Network Monitors (NNM) located in mainland China, you must connect through sensor.cloud.tenablecloud.cn instead of sensor.cloud.tenable.com.
