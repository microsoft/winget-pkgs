ReleaseNotes: |-
  New Features

  The following are the new features included in Tenable Nessus 10.12.7:
  - Agents linked to Tenable One Vulnerability Management and Tenable Nessus Manager can now use agent profile settings to determine how often they check in for plugin updates.
  Security Updates
  The following are security updates included in Tenable Nessus 10.2.7:
  - Updated expat to 2.10.0.
  - Fixed an issue where a low-privileged user can inject HTML into scan report pages.
    For more information, see the Tenable Product Security Advisory.
  Bug Fixes
  | Bug Fix                                                                                                                                                                    | Defect ID                                                                                                              |
  | -------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | ---------------------------------------------------------------------------------------------------------------------- |
  | Fixed an issue where compressing agent plugin databases larger than 2 GiB failed silently, producing an empty plugin archive that prevented agents from receiving plugins. | 02575565, 02576314, 02580843                                                                                           |
  | Fixed an issue where a library upgrade caused the show button in HTML reports to stop working.                                                                             | 02583936, 02586490, 02590910                                                                                           |
  | Fixed an issue where the Tenable Nessus scheduled cleanup deleted an ongoing triggered scan.                                                                               | 02473945                                                                                                               |
  | Fixed an issue where scans trusted invalid results from reverse DNS (rDNS) lookups.                                                                                        | 02542576, 02545827, 02555664, 02564663, 02576919, 02578250, 02547222, 02561357, 02548372, 02553205, 02559248, 02596180 |
  Upgrade Notes
  - Tenable One Vulnerability Management FedRAMP environments support Tenable Nessus scanners versions 10.5.0 and later.
  - If you are connecting to Tenable One Vulnerability Management through Tenable Nessus scanners, Tenable Agents, Tenable One Web App Scanning scanners, or Tenable Network Monitors (NNM) located in mainland China, you must connect through sensor.cloud.tenablecloud.cn instead of sensor.cloud.tenable.com.
  - You can upgrade to the latest version of Tenable Nessus from any previously supported version.
  - If your upgrade path skips versions of Tenable Nessus, Tenable recommends reviewing the release notes for all skipped versions to learn about new features and bug fixes.
  - If you want your scanners to update to the newest version before the GA date automatically, set your Tenable Nessus Update Plan to Opt in to Early Access releases.
  - If you want to update your scanners to the latest version before the GA date manually, disable automatic updates so the scanner does not automatically downgrade to the previous version.
