ReleaseNotes: |-
  Changed Functionality and Performance Enhancements

  The following changes are included in Tenable Nessus 10.12.5:
  - Manual plugin updates for both Tenable Nessus and Tenable Nessus Manager now require the signature file to process plugin updates. This change does not impact Tenable Security Center plugin updates, Tenable Nessus Manager's agent plugin updates, or Tenable Nessus application updates.
  Security Updates
  The following are security updates included in Tenable Nessus 10.12.5:
  - Fixed multiple memory-safety flaws in the plugin file loader.
  - Fixed an out-of-bounds memory access in the plugin execution engine's logic.
  - Fixed a denial-of-service condition where a crafted plugin file could trigger a crash-restart loop.
  - Fixed an out-of-bounds read in the plugin file parser that could expose internal scanner memory in diagnostic output.
  - Fixed a double-free memory corruption that could be triggered by a crafted plugin.
  - Fixed a vulnerability where plugin archives pushed through the legacy update channel were installed without signature verification. Uploaded plugin archives are now required to carry a valid Tenable signature before they are extracted or loaded.
  - Fixed a SQL injection vulnerability in the scan policy import functionality.
  Supported Platforms
  The following are supported platform updates made in Tenable Nessus 10.12.5:
  - Added support for Alma Linux 10.
  Upgrade Notes
  - Tenable One Vulnerability Management FedRAMP environments support Tenable Nessus scanners versions 10.5.0 and later.
  - If you are connecting to Tenable One Vulnerability Management through Tenable Nessus scanners, Tenable Agents, Tenable One Web App Scanning scanners, or Tenable Network Monitors (NNM) located in mainland China, you must connect through sensor.cloud.tenablecloud.cn instead of sensor.cloud.tenable.com.
  - You can upgrade to the latest version of Tenable Nessus from any previously supported version.
  - If your upgrade path skips versions of Tenable Nessus, Tenable recommends reviewing the release notes for all skipped versions to learn about new features and bug fixes.
  - If you want your scanners to update to the newest version before the GA date automatically, set your Tenable Nessus Update Plan to Opt in to Early Access releases.
  - If you want to update your scanners to the latest version before the GA date manually, disable automatic updates so the scanner does not automatically downgrade to the previous version.
