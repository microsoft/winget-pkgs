  What's Changed
  Highlights
  - Tabular Editor now starts on machines with App Control / WDAC "Dynamic Code Security" enabled. Costura.Fody has been removed and dependency DLLs (TOMWrapper, Antlr4.Runtime, FastColoredTextBox, Newtonsoft.Json, WindowsAPICodePack, etc.) are now shipped alongside TabularEditor.exe instead of being loaded from embedded resources. Fixes #1175, #1227, #1337, #1340 (3acc8c6)
    - If you use the portable version, make sure to extract all files from the zip, not just TabularEditor.exe.
  - Updated to Microsoft.AnalysisServices (TOM) 19.117.0. TOMWrapper has been regenerated, adding Column.FullTextIndexingBehavior (CL 1708) and related property constants. New models now default to compatibility level 1706, the highest level supported by Fabric. (10ea5c8)
  - User-Defined Function (UDF) support: JSON serialization of UDFs by @mlonsk in #1343 (also coming to TE3 soon)
  Best Practice Analyzer
  - Added UserDefinedFunction and Calendar rule scopes, matching Tabular Editor 3 so rule files remain interchangeable. The unused Remarks property on rules is replaced by LearnMoreUrl, and FixExpression is only serialized when it has content. (f9aa0fb)
  - The rule editor now offers compatibility levels 1500 and 1560 in the minimum compatibility level dropdown, and correctly saves the selected level for both new and existing rules. (8ea1156)
  Bug fixes
  - Fixed unhandled NullReferenceException when connecting to a database fails while another model is already loaded, e.g. when selecting the local instance of a live-connected Power BI report. The previously loaded model now stays intact and only the connection error is shown. Fixes #1339 (fbeecb3)
  - Fixed AddExternalMember incorrectly creating the role member (#1319) by @mlonsk in #1333
  - Fixed header parsing issue where hyphens were excluded (#1324) by @mlonsk in #1325
  - Update DaxFormatterProxy to use the new API endpoint by @albertospelta in #1341
  Other changes
  - Add DatabasePage user control for sorting server databases in the connect dialog by @andrew-mee in #1328
  - Selected API updates by @mlonsk in #1334
  New Contributors
  - @andrew-mee made their first contribution in #1328
