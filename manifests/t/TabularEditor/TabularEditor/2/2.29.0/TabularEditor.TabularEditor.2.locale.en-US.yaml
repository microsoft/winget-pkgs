  - Windows installer: TabularEditor.2.29.0.Installer.msi
    - SHA256: A0225FB96285A195E7F3FEB5E15AAA5E3927D6C3547375A30A1A7A5C3489C9EB
  - Portable version: TabularEditor.2.29.0.zip
