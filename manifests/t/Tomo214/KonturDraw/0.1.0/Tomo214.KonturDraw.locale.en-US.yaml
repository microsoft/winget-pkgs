ShortDescription: Free vector editor for tattoo stencils and logos, with a CorelDRAW-style workflow and .cdr import.
Description: |-
  KonturDraw is a free desktop vector editor for tattoo stencils and logos.
  It follows the familiar CorelDRAW layout and keyboard shortcuts and opens .cdr files.
  Trace photos and sketches to centerline or outline vectors, edit nodes, weld, trim and intersect shapes,
  set exact sizes in millimetres and print 1:1 or mirrored for transfer paper.
  Exports SVG, PDF (CMYK, bleed, crop marks), PNG, DXF and HPGL.
  Not affiliated with Corel Corporation.
