ShortDescription: Secure artifact fetch-and-relocate tool with an embedded OCI registry.
Description: |-
  Secure artifact fetch-and-relocate tool with an embedded OCI registry.
  Tobby fetches OCI assets — container images, Helm charts, AI models,
  and files — and carries them across isolated network zones, from
  connected, through restricted, down to fully air-gapped environments.
Moniker: tobby
Tags:
  - oci
  - registry
  - air-gap
  - mirror
  - supply-chain
  - containers
  - helm
  - sbom
ReleaseNotes: |-
  Milestone 7 — finishing, documentation and acceptance.
  - Consumption aids: the source-to-destination mapping table and a generated registries.yaml.
  - Scoped, time-bounded vulnerability exceptions, OpenVEX input and a read-only effective policy.
  - Provenance per repository, and two opt-in hardening switches.
  - Diagnostic bundle, clock plausibility check, a normative state directory with backup and rebuild.
  - Supervision kit: metrics, alert rules and a dashboard.
  - The embedded registry serves the OCI 1.1 Referrers API.
  - The complete bilingual documentation is served by the instance itself, offline.
  - Breaking: the recipe API group is now recipe.tobbyfetch.dev; one instance per state directory.
  Full changelog: https://github.com/tobby-fetch/tobby-fetch/blob/v0.7.0/CHANGELOG.md
ReleaseNotesUrl: https://github.com/tobby-fetch/tobby-fetch/releases/tag/v0.7.0
