ReleaseNotes: |-
  [0.18.1] — 2026-11-26
  Added
  - Drop font folders straight into a collection. While you drag fonts,
    folders or ZIP archives over the window, the drop screen now also lists your
    collections. Drop on one and the fonts are added to the library and to that
    collection in one go, including fonts that were already in your library.
    Drop on New collection to create one named after the folder; the name
    can be changed before you confirm it.
  Fixed
  - A font with many styles couldn't be collapsed again. Pressing on a card
    made the whole card shrink slightly as a click effect. On a card with 72
    styles open, that moved its top by about 40 pixels, so the styles button
    slid away from under the mouse and the click selected the card instead of
    closing the list. Cards no longer shrink when pressed. Selecting a very tall
    card also no longer jumps the view to its bottom end.
    Reported by teherauto. (#55)
  - Cards in the grid weren't lined up on the left. Switched-off fonts were
    drawn one percent smaller than active ones, so in a large library with both
    kinds mixed, the left edges of the cards zig-zagged. All cards are now the
    same size.
