ShortDescription: ИИ-помощник для подготовки презентаций PPTX из Markdown и других источников по корпоративному шаблону
Description: |-
  elec-pres собирает презентации PPTX из Markdown, таблиц (CSV, XLSX) и документов (DOCX, TXT) по корпоративному шаблону.
  Результат открывается в Р7-Офис и PowerPoint без восстановления. Презентацию можно экспортировать в PDF.
  Проекты elec-pres (.epres) открываются двойным щелчком.
