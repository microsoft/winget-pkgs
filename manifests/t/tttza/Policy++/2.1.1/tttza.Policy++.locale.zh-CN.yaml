PackageIdentifier: tttza.Policy++
PackageVersion: 2.1.1
PackageLocale: zh-CN
ShortDescription: 在所有 Windows 版本上搜索、查看和编辑本地组策略管理模板。
Description: |-
  用于搜索、查看和编辑本地组策略（管理模板/ADMX）的工具。本项目是 Fleex255 的 PolicyPlus 的分支，增加了额外功能并采用了现代化的 UI。

  - 搜索与显示：按名称、描述、策略 ID 或注册表路径快速搜索，并查看目标操作系统、支持版本和应用程序目标等技术细节。
  - 编辑与保存：切换“已启用”“已禁用”或“未配置”，编辑枚举、数值、字符串、多行文本和列表元素，并将改动排入临时的“待处理”列表以批量保存。
  - 共享与迁移：导出和导入 .reg 文件，一键复制名称、策略 ID 或注册表路径，并将模板层级路径复制为易读文本。
  - 切换来源：用户或计算机的本地 GPO、每用户 GPO、独立 POL 文件、离线用户配置单元或实时注册表。
  - ADMX 载入：加载 Microsoft 管理模板及其语言文件。
Tags:
- admx
- gpo
- 注册表
- 组策略
