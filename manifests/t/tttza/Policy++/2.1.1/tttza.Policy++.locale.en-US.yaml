ShortDescription: Search, view and edit Local Group Policy administrative templates on every Windows edition.
Description: |-
  A tool to search, view and edit Local Group Policy (Administrative Templates/ADMX). This is a fork of Fleex255's PolicyPlus with additional features and a modernized UI.

  - Search and display: fast search by name, description, policy ID or registry path, with technical details such as target OS, supported on and application target.
  - Edit and save: toggle Enabled, Disabled or Not Configured, edit enum, numeric, string, multi-line text and list elements, and queue changes in a temporary Pending list to save in batch.
  - Share and migrate: export and import .reg files, copy a name, policy ID or registry path in one click, and copy the template hierarchy path as readable text.
  - Switch sources: local GPO for user or computer, per-user GPO, standalone POL files, an offline user hive or the live registry.
  - ADMX ingestion: load Microsoft administrative templates and their language files.
