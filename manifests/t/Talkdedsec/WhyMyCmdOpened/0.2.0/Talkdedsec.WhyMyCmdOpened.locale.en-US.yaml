ShortDescription: Finds out what launched a console window, hours after it closed.
Description: |-
  A console window flashed on your screen and vanished. Task Manager is empty by the time
  you look and Process Monitor only tells you that something ran, never why.

  wymcmd answers the question you actually have: which scheduled task, registry key,
  service, document or click started that console, with the command line, the parent
  chain, the signature status and a confidence rating. It answers it for launches that
  happened while wymcmd itself was not running, by rebuilding the history from what
  Windows already recorded - the Security log, Task Scheduler, Prefetch, BAM and
  UserAssist - and optionally from an ETW black box that Windows starts at boot.

  No resident process and no CPU while idle.
