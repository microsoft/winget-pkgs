ReleaseNotes: |-
  - MCP 的 get_memo 和返回完整正文的 list_memos 现在默认只提供 Markdown 正文。依赖 contentJson 或 contentText 的集成可传入 format="all"，继续获取原有字段。
  - MCP 关键词搜索命中笔记正文时，会附带最多 200 字的匹配片段。
  - 公开分享页的初始 HTML 现在将笔记标题和正文的语言标记为未知，并正确标注页面自带的英文文案。感谢 @dkoryto 的 #816。
  关联 Issue：#819, #814, #818
