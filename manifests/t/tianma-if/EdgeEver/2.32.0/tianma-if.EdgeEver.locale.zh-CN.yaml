ReleaseNotes: |-
  - 桌面端可以在 Antigravity 独立版与 agy CLI 之间切换，也可以清除自定义可执行文件路径。感谢 @yulei666（#878）。
  - Android 笔记内的图片使用缩略图，全屏查看和下载仍使用原图。感谢 @flipcyde101（#875，关联 #869）。
  - 海报渲染改由服务端通知，减少客户端空闲时的请求。自托管用户请先升级服务端，再升级桌面端。Docker 反向代理需转发 /api/v1/poster-render/events 的 WebSocket 升级请求。
  - 公开分享页的大纲会完整显示长标题，点击一次即可跳转。分享笔记本支持按标题升序或降序排列，标题中的数字按自然顺序排序。
  - Web 和桌面端表格按内容调整列宽，交替行底色更清晰。感谢 @geekqq（#884）。
  - Windows 上混排日文和拉丁字母的标题字重更一致。感谢 @Golden007-prog（#890）。
  关联 Issue：#892, #886, #887, #888
