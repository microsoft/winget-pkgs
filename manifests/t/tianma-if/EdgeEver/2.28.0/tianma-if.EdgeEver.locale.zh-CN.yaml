ReleaseNotes: |-
  - 复制富文本到知乎等平台时，保留可编辑公式、图库全部图片和动图，并支持将普通图片与 Mermaid 图表上传到所选图床。
  - 新增支持深色模式的玫瑰红正文配色。
  - 修复图片上传时的光标与预览稳定性，并让图库工具栏保持在编辑器可见范围内。
  - 修复杂志封面中的标点和英文单词断行。
  - 优化第三方笔记导入入口、平台标识和操作提示，并更新导入指南。
