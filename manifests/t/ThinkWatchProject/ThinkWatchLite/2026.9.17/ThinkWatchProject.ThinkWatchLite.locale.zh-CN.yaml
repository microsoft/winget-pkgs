ShortDescription: 本地 AI API 网关，显示每个请求的费用、由哪个上游处理以及发送了哪些内容。
Description: |-
  ThinkWatch Lite 在通知区域运行一个本地 AI API 网关。Claude Code、Codex 以及其他使用 Anthropic、OpenAI、Gemini API 的客户端把请求发给它，Lite 显示每个请求的费用、由哪个上游处理及其原因，以及随请求发送的内容。
  它可以把支持的客户端接入网关并在之后还原，在多个上游之间路由，并对发出的请求做脱敏。
