ShortDescription: A local AI API gateway that shows what each request cost, which upstream served it, and what was sent.
Description: |-
  ThinkWatch Lite runs a local AI API gateway from the notification area. Claude Code, Codex and other clients of the Anthropic, OpenAI and Gemini APIs send their requests to it, and Lite shows what each request cost, which upstream served it and why, and what was sent along with it.
  It can point supported clients at the gateway and restore them afterwards, route between several upstreams, and redact secrets in outgoing requests.
