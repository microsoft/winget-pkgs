ShortDescription: Deep Windows debloater and software removal toolkit
Description: |-
  Scans every place Windows keeps installed software — the registry uninstall
  keys in both 32- and 64-bit views, UWP/MSIX packages, packages provisioned
  on the image, services, scheduled tasks and autostart entries — then removes
  what you do not need.

  Every item is classified Safe, Caution or Critical against a bundled rule
  set. Critical system components (Defender, the shell, core services, shared
  runtimes, device drivers) cannot be removed at all. Caution items need an
  explicit per-item confirmation.

  Before anything is changed the tool creates a System Restore Point and
  exports a .reg backup of every registry key it will touch, plus a script to
  re-import them. If the restore point cannot be created, the run is cancelled
  rather than proceeding unprotected.

  Interface in Vietnamese and English.
