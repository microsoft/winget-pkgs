ShortDescription: Manage OpenSSH hosts, groups, and identities from a single TOML file via Qt6 GUI, Textual TUI, and CLI.
Description: |-
  SSHCnfgr manages OpenSSH host configurations, groups, and SSH identity profiles
  from a single TOML file (~/.ssh/sshcnfgr.toml) and generates clean OpenSSH configs
  containing only enabled hosts. Includes a Qt6 desktop GUI, a Textual TUI, a Click CLI,
  duplicate detection with optional DNS checks, and automatic timestamped backups.
