ShortDescription: Zero-bloat Windows 10/11 CD, DVD & Blu-ray burning, C2/AccurateRip audio ripping, and multi-disc archival studio.
Description: |-
  IgnisDisc Optical Studio is a native Windows 10/11 optical disc authoring, audio ripping, and multi-disc archival suite built on .NET 10, Windows IMAPIv2 COM, and direct SCSI Pass-Through (MMC-5).
  Features include ISO 9660 + Joliet + UDF 1.02 Bridge compilation, Multi-Session CD/DVD authoring, Dual BIOS + UEFI El Torito bootable image generation, Red Book DAO/TAO Audio CD burning with CD-Text, Secure C2 + AccurateRip audio extraction to WAV/FLAC, DVD-Video IFO/BUP sector-aligned mastering, and Multi-Disc Archive Studio with SHA-256 manifests and PAR2 parity recovery.
