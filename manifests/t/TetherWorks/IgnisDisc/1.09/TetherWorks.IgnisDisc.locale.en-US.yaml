ShortDescription: Free, open-source CD/DVD burner, audio CD ripper with AccurateRip, and multi-disc archiver for Windows.
Description: |-
  IgnisDisc burns data discs, ISO images and audio CDs, rips audio CDs to WAV or FLAC with AccurateRip verification, and archives large folders across several discs with SHA-256 manifests and optional PAR2 recovery data.
  It also burns albums from .cue sheets and playlists, copies discs, makes bootable BIOS + UEFI discs, and burns or converts Nero, Alcohol 120% and CloneCD images. It includes a desktop app and a command-line tool (ignisdisc-cli).
  It burns through Windows' built-in burning service (IMAPIv2); CD-Text and test writes are not available on physical drives yet.
