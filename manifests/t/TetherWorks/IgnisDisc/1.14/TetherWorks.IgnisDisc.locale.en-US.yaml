ShortDescription: Free, open-source CD/DVD burner, audio CD ripper with AccurateRip, and multi-disc archiver for Windows.
Description: |-
  IgnisDisc burns data discs, ISO images and audio CDs, rips audio CDs to WAV, FLAC, MP3, Opus or AAC with AccurateRip verification (MP3 and Opus use the optional ffmpeg download), and archives large folders across several discs with SHA-256 manifests and optional PAR2 recovery data.
  It also burns albums from .cue sheets and playlists, copies discs, makes bootable BIOS + UEFI discs, and burns or converts Nero, Alcohol 120% and CloneCD images. It includes a desktop app and a command-line tool (ignisdisc-cli).
  It burns through Windows' built-in burning service (IMAPIv2) by default. An experimental writer that sends drive commands itself (off by default) adds CD-Text, ISRC codes, test writes and sessions added to open discs; it has been tried on one drive model so far, and every burn it makes is read back and compared.
