ReleaseNotes: |-
  Provider and media support
  - Kenari: named free chat and image routes, credential validation, exact-model identity checks, and empty-response protection. Free routes use a shared renewable daily account allowance; the adapter never retries a paid alias.
  - Mistral: Voxtral transcription through the existing audio-transcriptions endpoint, including multipart uploads and normalized responses.
  - Includes the onomeo response-model identity guard merged since v0.16.9.
  The separately signed catalog update adds 25 model routes, re-enables two, and disables one unsupported route (net +26 enabled). Model rows are not seeded by this release. Premium catalog access remains immediate; Free access remains subject to the existing 30-day gate. NVIDIA developer endpoints retain their development/testing-only caveat.
  Update the app to use the new adapters. Desktop installers and stable Docker images are built from this release tag.
  Existing local disabled-model preferences remain respected; re-enabled catalog routes can be enabled manually on installations where they are still disabled.
