ReleaseNotes: |-
  NovAI daily-free chat support
  - Add chat and streaming support for GLM 4.6V Flash and GLM 4.1V Thinking Flash through the existing NovAI provider.
  - Normalize leading reasoning and nested answer envelopes while preserving streaming, tool deltas and retry information.
  - Reject mismatched model identities so the router can fail over safely.
  - Keep existing NovAI video support and the Premium-immediate / Free-after-30-days catalog policy unchanged.
  The separately published catalog enables the two NovAI chat entries and disables three retired onomeo free routes: codestral-latest, ministral-14b-latest and qwen-flash-character. Net enabled change: -1. Existing rows are retained.
  NovAI free models share a daily allowance. GLM 4.6V Flash passed live adapter checks in both modes. The thinking model returned the correct answers and identity in both modes; final formatting normalization is regression-tested, but a post-fix live repeat was blocked by the account's daily quota.
  Upgrade desktop or pull the stable Docker image to use the new adapter.
ReleaseNotesUrl: https://github.com/tashfeenahmed/freellmapi/releases/tag/v0.16.17
