ReleaseNotes: |-
  Includes JamAI Base chat and embeddings with separate PAT and Project ID setup fields, plus the Intel macOS release fix.
  Fixes the Apple CloudKit connection failure documented in actions/runner-images#14924 by using HTTPS over TCP on signed Intel GitHub runners. Notarization, ticket validation, Gatekeeper checks, native-backend smoke tests, and update-metadata verification remain required.
  Validation before merge: all Node 20/22/24 CI jobs, both Docker architectures, all four desktop builds and combined Mac metadata checks passed. Full local server, CLI, dashboard and desktop regression suites, lint, builds and 60-locale checks passed.
  The catalog is already published with 15 additions and 2 disabled routes (net +13). This release does not change catalog data or the existing Premium-immediate / Free-after-30-days policy. Update the app to use the new JamAI adapter.
  This release supersedes the stalled v0.16.13 desktop draft; existing tags are unchanged.
  PRs: https://github.com/tashfeenahmed/freellmapi/pull/1764 and https://github.com/tashfeenahmed/freellmapi/pull/1767
