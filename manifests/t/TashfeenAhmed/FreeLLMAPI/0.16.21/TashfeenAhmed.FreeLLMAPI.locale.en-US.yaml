ReleaseNotes: 'Adds tested FreeInference DeepSeek V4 Flash support for chat and streaming while retaining exact response-model validation. Upgrade to use the new DeepSeek catalog route. Existing signed catalog delivery, local model preferences, and the 30-day Free/Premium rollout remain unchanged. Catalog publication is handled separately after release verification. Includes PR #1834.'
