ReleaseNotes: |-
  Adds Meldport chat for GPT-6 Luna’s free alias. The adapter requests promotional funding only, checks the response’s funding and model identity, and supports streaming. Meldport GLM is not enabled.
  Adds keyless OVHcloud Solaria-3 transcription for English PCM16 WAV uploads. Existing OVH Whisper transcription continues to use its original endpoint.
  Model availability follows the existing signed catalog: Premium immediately on publication, Free after 30 days. No changes to existing model routing or catalog eligibility.
ReleaseNotesUrl: https://github.com/tashfeenahmed/freellmapi/releases/tag/v0.16.33
PurchaseUrl: https://freellmapi.co/pricing
InstallationNotes: Open the app, then copy the unified API key shown in the tray popover and add your provider keys on the Keys page before pointing a client at the local /v1 endpoint.
