ReleaseNotes: |-
  This release fixes a misleading key error and makes the direct Windows download easy to find again.
  - Keys: providers that can't check a key without spending quota (Free.ai and others) now show a grey note instead of a red error. Nothing is wrong with the key; it stays "unchecked" until it serves its first request, then turns healthy. (#1545, #2146)
  - Windows: the README links the Setup .exe and the portable .zip again, next to the Microsoft Store, with steps for when the Store fails or SmartScreen warns. (#2141, #2145)
ReleaseNotesUrl: https://github.com/tashfeenahmed/freellmapi/releases/tag/v0.16.51
PurchaseUrl: https://freellmapi.co/pricing
InstallationNotes: Open the app, then copy the unified API key shown in the tray popover and add your provider keys on the Keys page before pointing a client at the local /v1 endpoint.
