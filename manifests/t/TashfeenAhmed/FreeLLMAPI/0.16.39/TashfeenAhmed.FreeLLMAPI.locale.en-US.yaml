ReleaseNotes: |-
  Puter now supports five additional signed-catalog chat routes: Gemini 3.7 Flash, GPT-4o mini, Qwen3.5 Flash, Qwen3.5 27B and Qwen3.5 35B-A3B. Each is pinned to its exact native model, with ordinary and streaming chat verified through the app. The provider's monthly credit pool is shared across models. Catalog availability follows the existing tier schedule; this release does not enable models on its own.
