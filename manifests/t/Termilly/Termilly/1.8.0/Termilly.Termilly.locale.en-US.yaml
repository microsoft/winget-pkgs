ShortDescription: Terminal manager for Windows, macOS and Linux, with workspaces, sessions that come back after a restart, and Claude Code and Codex in view.
Description: |-
  Termilly is a workspace-based terminal manager. It groups your terminals by project, brings them back after a
  restart with their output, and shows which coding agent (Claude Code or Codex) is waiting on you.
  PowerShell, cmd, Git Bash, WSL, SSH, serial ports and network consoles run side by side, with one search across
  terminals, command history and output, saved snippets, a Git window, and a termilly command and MCP server for
  scripts and agents.
