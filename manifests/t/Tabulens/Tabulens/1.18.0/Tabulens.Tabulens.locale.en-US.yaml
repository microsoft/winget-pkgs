ShortDescription: View, filter and convert DBF, Excel, CSV, SPSS, Stata and other tables locally — files never leave your PC.
Description: |-
  Tabulens opens tables from dozens of formats in one window: DBF (dBase, FoxPro, Clipper, shapefile attributes), Excel (XLSX, XLS, XLSB), ODS, CSV and fixed-width text, XML, JSON and GeoJSON, Parquet, SQLite and GeoPackage, Microsoft Access, SPSS, Stata and SAS transport files, and tables inside ZIP archives. Filter, search, group, build pivot tables, compare two files, check values and export to Excel, CSV or JSON.

  Everything is processed on your computer: the program is a single portable file, needs no installation and works offline. The free edition has no time limit; a one-time Pro license lifts the limits on export size, printing, tabs and batch conversion.
