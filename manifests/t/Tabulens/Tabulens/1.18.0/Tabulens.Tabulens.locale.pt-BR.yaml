ShortDescription: Veja, filtre e converta tabelas DBF, Excel, CSV, SPSS, Stata e outras localmente — os arquivos não saem do PC.
Description: |-
  O Tabulens abre tabelas de dezenas de formatos numa só janela: DBF (dBase, FoxPro, Clipper, atributos de shapefile), DBC do DATASUS, Excel, ODS, CSV e texto de largura fixa, XML, JSON e GeoJSON, Parquet, SQLite e GeoPackage, Access, SPSS, Stata e SAS, arquivos SPED e microdados do IBGE com o input SAS, e tabelas dentro de ZIP. Filtre, pesquise, agrupe, compare dois arquivos e exporte para Excel ou CSV.

  Tudo é processado no seu computador: um único arquivo, sem instalação, funciona sem internet. A edição gratuita não expira; a licença Pro, paga uma vez, remove os limites de exportação e impressão.
