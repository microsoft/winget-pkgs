ShortDescription: DBF-, Excel-, CSV-, DATEV-, SPSS- und Stata-Tabellen lokal ansehen, filtern und umwandeln – ohne Upload.
Description: |-
  Tabulens öffnet Tabellen aus Dutzenden Formaten in einem Fenster: DBF (dBase, FoxPro, Clipper, Shapefile-Attribute), Excel, ODS, CSV und Festbreitentext, DATEV-Exporte (EXTF/DTVF), XML, JSON und GeoJSON, Parquet, SQLite und GeoPackage, Access, SPSS, Stata und SAS sowie Tabellen in ZIP-Archiven. Filtern, suchen, gruppieren, zwei Dateien vergleichen und nach Excel oder CSV exportieren.

  Alles wird auf Ihrem Rechner verarbeitet: eine einzige Datei, keine Installation, funktioniert offline. Die Programmoberfläche ist auf Englisch. Die kostenlose Edition läuft unbegrenzt; eine einmalige Pro-Lizenz hebt die Grenzen bei Export und Druck auf.
