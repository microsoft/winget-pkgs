ShortDescription: 'Vea, filtre y convierta tablas DBF, Excel, CSV, SPSS, Stata y otras en local: los archivos no salen del PC.'
Description: |-
  Tabulens abre tablas de decenas de formatos en una sola ventana: DBF (dBase, FoxPro, Clipper, ContaPlus, atributos de shapefile), Excel, ODS, CSV y texto de ancho fijo, XML, JSON y GeoJSON, Parquet, SQLite y GeoPackage, Access, SPSS, Stata y SAS, ficheros bancarios Norma 43 y SEPA (camt.053, pain.001), SAF-T y tablas dentro de ZIP. Filtre, busque, agrupe, compare dos archivos y exporte a Excel o CSV.

  Todo se procesa en su ordenador: un único archivo, sin instalación, funciona sin conexión. La edición gratuita no caduca; la licencia Pro, de pago único, quita los límites de exportación e impresión.
