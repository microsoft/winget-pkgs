ReleaseNotes: >-
  v1.1.0 bringt die neu gestaltete Oberfläche "Klare Fläche v2" mit dunklem, hellem und
  System-Design, automatischer High-DPI-Anpassung, einer zentralen Ordner-Übersicht
  (Gefährlich, Verdächtig, Ungeprüft, Unauffällig), ehrlicher Kennzeichnung
  passwortgeschützter Archive sowie einer klaren Offline-Optionen-Ansicht.
