ShortDescription: 100 % lokale, standardmäßig offline arbeitende Dateisicherheits-Prüfung für Windows (PDF, Office, E-Mail, Archive).
Description: >-
  Malaz prüft verdächtige Dokumente, Rechnungen, E-Mails (.eml/.msg), Archive, Skripte,
  Bilder und Programme direkt auf dem eigenen Windows-PC — komplett ohne Cloud-Upload,
  ohne Telemetrie und ohne Konto. Ideal für DSGVO-sensible Dateien, die nicht an fremde
  Online-Scanner hochgeladen werden dürfen. Kombiniert lokale Tiefenprüfung mit
  Windows Defender, ClamAV und YARA und erklärt jeden Befund verständlich.
