ShortDescription: Offline-by-default desktop file security triage for Windows (PDF, Office, email, archives, executables).
Description: >-
  Malaz is a native, offline-by-default desktop security triage tool for Windows 10/11.
  It inspects suspicious PDFs, Office documents, emails (.eml/.msg), archives, scripts,
  images, and executables locally on your PC with zero cloud uploads and zero telemetry.
  Malaz combines format-aware static analysis with local multi-engine scanning
  (Windows Defender, ClamAV, YARA) and explains findings in plain language while never
  reporting unchecked or password-protected files as clean.
