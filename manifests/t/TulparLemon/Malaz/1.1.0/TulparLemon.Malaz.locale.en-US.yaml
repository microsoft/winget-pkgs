ReleaseNotes: >-
  v1.1.0 introduces the redesigned "Klare Flaeche v2" PySide6 desktop interface with Dark,
  Light, and System themes, automatic High-DPI and screen-size adaptation, unified Folder
  Overview with 4 status KPIs (Dangerous, Suspicious, Unchecked, Clean), recursive
  completeness tracking for nested archives/emails, and an opt-in offline-by-default
  Options view.
