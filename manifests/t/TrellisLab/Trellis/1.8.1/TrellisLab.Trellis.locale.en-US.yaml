ReleaseNotes: |-
  ## Fixes

  • The interactive HTML viewer no longer shows a cluttered subgraph legend in the corner; the tag legend still covers filtering and highlighting.
  • Scrolling in the interactive HTML viewer now pans the diagram instead of zooming it. Use ctrl/cmd+scroll to zoom at the cursor, shift+scroll to pan horizontally, and arrow keys, +/-, or 0 to pan/zoom/reset from the keyboard.
