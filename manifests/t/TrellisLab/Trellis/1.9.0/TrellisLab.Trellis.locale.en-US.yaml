ReleaseNotes: |-
  ## New features

  • Trellis Flow in VS Code：a new Trellis icon in the activity bar finds the C4 models and Mermaid sequence diagrams in a folder, and steps through a sequence on top of the C4 diagram. Each message lights up the nodes and relations it uses, with the rest fading out; participants missing from the C4 model are drawn as dashed temporary nodes and messages with no relation as dashed edges, with "did you mean" hints. Trellis Flow is part of the paid license: without one the Trellis view shows a short demo, a link to the website and how to enter a license key.
  • Trellis Flow follows your edits：saving the sequence or C4 file keeps you on the same message, pauses playback and asks before reloading, and keeps the last valid version on screen when a file has a syntax error. A reload bar offers Reload and Show changes, new, changed and removed messages are tagged in the sequence, and your zoom level is kept.
  • The Trellis sidebar uses native VS Code panes (Source, C4 Model, Sequences, Validation) with collapsible headers, count badges, hover actions and the built-in Ctrl/Cmd+F filter.
  • The Flow diagram follows your VS Code theme：`trellisFlow.theme` picks a light or dark Trellis theme automatically, reuses `trellis.theme`, or uses a theme you name.
  • Highlighted nodes keep their own colour, so a Person and a Container in the same step stay easy to tell apart, on light and dark themes alike.
  • Follow step only moves the view when the current step is out of sight, pans the shortest distance, and zooms out when the step does not fit. Dragging or zooming stops the animation.
  • The mini sequence diagram shows Mermaid notes on the lifelines, and draws `loop`, `alt`, `opt`, `par`, `critical`, `break` and `rect` blocks as nested, foldable sections. The step card lists the notes and enclosing blocks of the current step, with links to their source lines.
  • Async messages (`-)` and `--)`) are drawn as fire-and-forget calls with a hollow arrowhead instead of being treated as returns.
  • Participant names stay pinned above the mini sequence diagram while you scroll through the steps.
  • The mini sequence diagram font size, font weight and line width are configurable (`trellisFlow.sequenceFontSize`, `sequenceFontWeight`, `sequenceLineWidth`), and lifelines spread over the full column width.
  • The Flow details column can be resized by dragging; its width is kept when you switch tabs. The activity bar shows the Trellis logo, which follows your theme.
  • Anonymize diagrams before sharing them in bug reports：`trellis anonymize` replaces every name and label with a random word of the same length while keeping the diagram's structure and syntax, and checks that the result still parses to the same diagram. The same word always gets the same replacement, so references stay intact. Works for flowchart, class, ER, C4 and architecture diagrams. Part of the paid license.
  • VS Code can anonymize too：Anonymize Diagram in Place (undoable), Copy Anonymized Diagram, and Save Anonymized Diagram… for `.mmd` files and Markdown mermaid blocks.
  • `%% trellis c4role <role>` above a plain `Container` or `Container_Ext` draws it with a custom container shape in Trellis, while other Mermaid renderers still show a standard container.

  ## Improvements

  • Diagram types Trellis does not lay out itself (sequence, gantt and others) are previewed with Mermaid.js 12 in VS Code, so they match Mermaid's current default look.

  ## Fixes

  • `ContainerFrontend` and `ContainerApp` read their arguments in the same order as other C4 containers：technology before description. Diagrams with three or more arguments now show them in the right place.
  • Comments starting with `%%` followed by non-ASCII text no longer crash render and validate.
  • The VS Code preview recovers by itself after an internal rendering error instead of staying broken until the preview is reopened.
  • The Pandoc filter now recognises `architecture-beta` diagrams and diagrams that start with frontmatter or `%%` comments. When a diagram needs a license you do not have, HTML output falls back to a PNG image, or to Mermaid CLI if PNG is not available either.
  • On Windows, `trellis preprocess` writes image links with forward slashes (`img/diagram_1.svg`), so the preprocessed Markdown shows its diagrams in Pandoc, GitHub and other Markdown tools.

  ## Documentation

  • The README describes Trellis Flow.
  • Docker examples use the Docker Hub images `trellislab/trellis-cli` and `trellislab/trellis-pandoc`, and explain how to pass `TRELLIS_KEY` and keep the license in a volume so each container run does not use a new seat.
