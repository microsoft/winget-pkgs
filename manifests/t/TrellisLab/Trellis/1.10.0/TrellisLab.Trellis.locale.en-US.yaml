ReleaseNotes: |-
  ## Fixes

  • Trellis Flow shows the colour of `rect` blocks even when a caption follows it, for `rgb()`, `rgba()`, `hsl()`, `hsla()` and `#hex` colours. Blocks without a colour are drawn in light gray.
  • `rect` blocks accept CSS colour names such as `rect Aqua`, as in Mermaid. Rect chips in the step card use a light tint of the block colour, so their text stays readable.
  • The Flow details column keeps the width you chose after switching to another tab and back, instead of shrinking to its minimum.
  • The online editor on the Trellis website loads reliably after a new release：browsers no longer mix cached files from the previous version with the new ones, which made it fail to start.
