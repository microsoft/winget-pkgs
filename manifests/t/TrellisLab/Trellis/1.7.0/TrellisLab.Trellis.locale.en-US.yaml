ReleaseNotes: |-
  ## New features

  • Node and edge labels now support markdown formatting (bold, italic, line breaks) using backtick-quoted strings, matching Mermaid's label syntax.
  • VS Code preview's Mermaid.js fallback diagrams now match Trellis's own color theme, so they stay readable in both light and dark VS Code themes.
  • Discord invite is now available site-wide (website, editor, CLI `--help`, READMEs), and new releases are announced automatically in Discord.

  ## Fixes

  • Fixed the VS Code preview piling up stale error overlays on top of the diagram when editing invalid diagram syntax.
