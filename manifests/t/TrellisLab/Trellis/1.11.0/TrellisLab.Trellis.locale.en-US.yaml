ReleaseNotes: |-
  ## New features

  • Emoji in labels：emoji, including combined sequences such as flags, skin tones and family emoji, are now sized as a single character, so boxes fit their labels instead of leaving extra space.
  • The VS Code preview, PNG export and the online editor load the emoji font only when a diagram contains emoji, so emoji show up in PNG images without making the extension bigger.
  • Region-based C4 layout (opt-in)：set `c4_diagram = "Regions"` under `[placement]`, or add a `%% trellis focus` command, to arrange C4 diagrams by how elements are connected rather than by element type alone. On our sample diagrams this cuts edge crossings from 27 to 9 and shortens edges by a third. Default output does not change.

  ## Improvements

  • Labels with accented or other non-ASCII letters (such as `ő`) are no longer drawn wider than needed.
  • `validate` warns when a `%% trellis focus` command is ignored because C4 placement is set to `Default`, and when `$c4ExternalAxis` is used with region-based layout, where it has no effect.

  ## Fixes

  • Emoji in PNG output render as coloured emoji instead of empty boxes. Labels mixing text and emoji keep their normal font, and certain emoji no longer cause rendering to crash.

  ## Documentation

  • README describes region-based C4 placement and how to turn it on, with an example image.
