Description: |-
  TZNSECVIRUS to aplikacja desktopowa (Rust + WebView) do pelnego skanowania
  bezpieczenstwa komputera z analiza AI.

  Jednym przyciskiem uruchamia kompletny pipeline:
    1. Kontrole systemu - Microsoft Defender, firewall, UAC, Secure Boot,
       BitLocker, RDP, SMBv1, otwarte porty, autostart, zadania, plik hosts
    2. VPN - wykrywanie adapterow i profili (WireGuard/OpenVPN/Tailscale),
       stan tunelu, publiczne IP
    3. Skan katalogow - najczesciej infekowane miejsca z heurystyka
       (podwojne rozszerzenia, skrypty w Autostarcie, wysoka entropia,
       sygnatury skryptow, podejrzane nazwy)
    4. Panel AI - kilka modeli jednoczesnie analizuje raport i wydaje
       wspolny werdykt oraz liste czynnosci do sprawdzenia

  Dodatkowo: skaner dowolnej sciezki z ocena AI czy plik jest zlosliwy,
  czat z asystentem AI znajacym stan komputera oraz automatyczne
  czyszczenie danych przy kazdym uruchomieniu.

  Dostawcy AI: darmowe API bez klucza, xkiro.com lub lokalna Ollama.