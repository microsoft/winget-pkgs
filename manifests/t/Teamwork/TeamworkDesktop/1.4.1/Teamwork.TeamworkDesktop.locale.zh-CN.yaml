ShortDescription: 在桌面端直接启动 Teamwork.com。
Description: |-
  Teamwork.com 桌面应用把项目工作放在独立窗口中运行，而不是再多一个浏览器标签页。
  - 易于访问：桌面应用启动更快，也可以设为开机启动，从打开电脑的那一刻就准备就绪。
  - 减少干扰：不必再淹没在浏览器标签页里，桌面应用帮助你专注于手头的任务，减少上下文切换，同时关注最重要的工作。
  - 专业且适合客户沟通：无需在浏览器中翻找，用专属空间在会议中展示项目信息，把重点放在真正重要的工作上。
