ShortDescription: Batch photo scanning for flatbeds. Every print on the glass is saved as its own cropped, straightened file, with its back paired to its front.
Description: |-
  FrontBack Scanner turns a flatbed into a batch photo scanner. Lay four, six, a dozen prints on the glass, scan once, and it finds each photo, straightens it, turns it right side up, trims the bed away and saves it as its own full-resolution file.

  Flip the pile over and scan again: every back is paired with the front it belongs to, so the handwriting on the back of a photo is saved right beside it.

  It also stitches prints and album pages larger than the glass from overlapping passes, and splits photos out of bed scans you already have (those originals are only read, never changed).

  Works with any scanner that has a Windows (WIA) driver: USB, network or shared. Free, with no account, no upload and no watermark. Everything runs on your PC.
