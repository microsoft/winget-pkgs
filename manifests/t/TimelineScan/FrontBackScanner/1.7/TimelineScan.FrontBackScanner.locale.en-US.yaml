ReleaseNotes: |-
  Auto-detect now uses two learned region detectors to spot difficult layouts, including touching prints and pale photos. They vote independently, and FrontBack only changes the proven geometric detection when both learned models agree, so uncertain cases keep the established result.

  Both models run entirely on your PC. No scan or photo is uploaded.

  Help is one key away now. Press F1, or use the ? button in the toolbar, and the guide opens in your browser.
