ReleaseNotes: When another app is holding your scanner, FrontBack now says so. It used to report that the scanner was already scanning, or that it could not be found. It now names the scanning apps that are open, such as Windows Fax and Scan or your scanner maker's app, so you know what to close, and a Retry button tries again without restarting FrontBack.
