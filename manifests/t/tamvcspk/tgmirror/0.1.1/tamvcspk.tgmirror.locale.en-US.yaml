ShortDescription: Clone a Telegram channel you joined into another channel (MTProto, Telethon).
Description: 'CLI tool that clones a Telegram channel, group or forum you have joined into another one(existing or newly created; forum topics are mapped topic to topic), using your own TelegramAPI credentials (MTProto, via Telethon). One account, run by hand as an ordinary command(clone copies at once, Ctrl+C stops it): no background daemon, no schedule. Filter what getscloned by media type, hashtag, regex, date/ID range or size; pause/stop/resume withcheckpoints, then run again for a delta that only copies new messages. Also supports backingup a source to a local directory and restoring it to a channel later.'
Moniker: tgmirror
