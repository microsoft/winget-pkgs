ShortDescription: Windows tray app for direct Bluetooth control of Philips Hue Bluetooth lights. No Hue Bridge needed.
Description: |-
  Glowtray is an independent Windows tray app for direct Bluetooth control of selected Philips Hue Bluetooth lights, without a Hue Bridge.
  It offers brightness, white tone, color, scenes and effects from a compact panel, plus automations based on what your PC is doing (lock/unlock, idle, sunrise/sunset, programs), f.lux sync, global hotkeys and usage stats.
  Not affiliated with Signify or Philips.
