ReleaseNotes: |-
  新功能
  - 本次更新重点改善长对话、图片处理和日常使用体验，让启动、聊天和升级更加顺畅。
  优化
  - 长对话更连贯：修复使用技能、网页端和聊天平台继续对话时，部分历史内容未正确带入的问题；优化自动摘要，减少长对话中断。
  - 多图、大图处理更完善：放宽图片大小和数量的固定限制，改善连续读图及重启后重新读取图片的体验。实际可处理范围取决于所选模型和电脑资源。
  - 对话用量显示更准确：修复切换会话、重启和自动摘要后，用量显示不一致的问题，并完善缓存用量统计。
  - 保护正在输入的草稿：修复 AI 回复结束时，意外清空新输入内容的问题。
  - 启动更快，进度更清楚：优化主窗口加载，新增数据升级和内置运行环境准备进度，方便了解当前启动状态。
  - 长篇思考内容浏览更流畅：优化加载和滚动表现，保留完整内容及原有展开、收起操作。
  - Windows 升级更稳妥：修复更新时安装路径处理异常，改善更换安装目录时对聊天记录、设置和工作空间数据的保留。
  - 运行环境配置更灵活：支持切换内置、系统已安装或手动指定的 Git/Git Bash，并清楚展示当前使用状态。
  - 其他稳定性改进：修复首次配置模型时的部分凭据问题，完善技能导入、后台任务通知恢复和异常诊断。
  修复
  - 修复打印与界面显示问题：恢复安装版打印功能，修复网页预览内容被截断、技能与 MCP 设置列表无法正常滚动，以及内置浏览器缩放错位的问题。
