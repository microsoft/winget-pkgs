ReleaseNotes: |-
  优化
  - Excel 预览升级：支持单元格样式、合并单元格、冻结窗格、常见公式、图表和图片；选中区域可直接添加到对话，携带单元格位置、数值和公式。
  - 新增 DeepSeek 联网能力：内置网页搜索与正文抓取，可在渠道设置中启用，复用 DeepSeek 官方渠道密钥。
  - 新增 MiniMax H3 图像与视频生成：支持图片生成、参考图输入，以及视频生成任务。
  - 完善模型配置：更新阿里、火山、腾讯、智谱、阶跃、MiMo 等服务商套餐的接口、模型列表和密钥入口；优化额度、重置时间及错误提示；修复删除模型后被自动补回的问题。
  - 调整审批倒计时：默认权限下取消超时自动拒绝；自动审批、完全权限模式保留 5 分钟超时拒绝；计划审查 5 分钟后自动执行，重复调用 120 秒后自动提醒。
  - 改善任务运行稳定性：重构运行内核，完善停止、恢复、并发和子任务收尾；增加内存不足时等待恢复的处理，修复部分模型请求、OCR 缓存及运行环境问题。
  - 加强安全与安装兼容性：完善工作区路径访问限制、凭据保护和日志脱敏；改善 Windows 原生模块签名检查及旧安装残留恢复。
  - 优化界面体验：技能商店显示上传者昵称；工作区切换与新建按钮仅在会话页显示；修复选区引用工具栏越界，并移除旧任务编排入口。
