ShortDescription: Desktop AI agent that turns one prompt into real files
Description: |-
  Tokeny is a free-to-download desktop AI agent for Windows, macOS and Linux. Bring your own API key (built-in channels include DeepSeek, Qwen, Kimi, Zhipu GLM, MiniMax and SiliconFlow, plus custom OpenAI/Anthropic-compatible endpoints).
  Every conversation is bound to a local workspace folder: within permission rules the agent reads, creates and edits files there, so results land on disk. Built-in skills turn a prompt into PPT, Excel and Word files and research reports. It also connects to MCP servers, runs cron-based scheduled tasks, lets several agents split a job, and asks for approval before risky operations.
  Model usage is billed by your chosen provider.
