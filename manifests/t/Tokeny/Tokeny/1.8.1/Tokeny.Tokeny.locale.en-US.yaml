ReleaseNotes: |-
  Improvements
  - Excel preview: cell styles, merged cells, frozen panes, common formulas, charts and images; a selected range can be added to the conversation with cell positions, values and formulas.
  - DeepSeek web access: built-in web search and page fetching, enabled in channel settings and reusing the official DeepSeek channel key.
  - MiniMax H3 image and video generation: image generation, reference-image input and video generation tasks.
  - Model configuration: updated endpoints, model lists and key entry points for Alibaba, Volcano Engine, Tencent, Zhipu, StepFun, MiMo and other provider plans; clearer quota, reset-time and error messages; deleted models are no longer added back automatically.
  - Approval timeouts: no automatic rejection on timeout in default permission mode; auto-approve and full-access modes keep a 5-minute timeout; plan review proceeds after 5 minutes; repeated calls trigger a reminder after 120 seconds.
  - Task stability: rebuilt runtime kernel with better stop, resume, concurrency and sub-task cleanup; waits for recovery when memory runs low; fixes for some model requests, OCR cache and runtime environment issues.
  - Security and installation: stricter workspace path access, credential protection and log redaction; improved Windows native module signature checks and recovery from leftover old installations.
  - Interface: the skill store shows uploader nicknames; workspace switch and create buttons appear only on the session page; the selection quote toolbar no longer overflows; the old task orchestration entry was removed.
