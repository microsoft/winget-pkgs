ShortDescription: 能读写本地文件、交付 PPT 和表格的桌面 AI Agent
Description: |-
  Tokeny 是一款桌面 AI Agent，支持 Windows、macOS 和 Linux，软件免费下载。填入自己的模型 API Key（内置 DeepSeek、通义千问、Kimi、智谱 GLM、MiniMax、硅基流动等渠道，也能接 OpenAI / Anthropic 兼容的自定义地址）后，它能在本地工作空间里读写文件，按一句话生成 PPT、Excel、Word 和报告，还能接 MCP 工具、跑定时任务。高风险操作会暂停，等你确认后再执行。
  模型费用由你选择的服务商按量计费。登录后另有可选的 Tokeny 内置模型会员和点数，不是必需。
