ReleaseNotes: |-
  新功能
  - Tokeny 1.8.0 重点提升会话管理、长对话稳定性和 Windows 升级体验，并减少不必要的后台 Token 消耗。
  优化
  - 新增会话批量管理：支持多选、按分组选择和批量删除会话，工作空间管理增加全选操作。
  - 减少后台消耗：移除自动整理历史会话功能，不再后台扫描旧对话生成摘要；已有长期记忆、原始会话和用量记录保留。
  - 增强断网恢复：临时断网、DNS 异常或连接重置后，支持自动重试并恢复任务，保留已完成的工具操作；等待期间可随时停止。
  - 改善长对话与模型兼容性：修正摘要输入、思考和输出的预算分配，防止过期压缩结果覆盖已修改的会话；完善 Claude 思考参数及历史思考块兼容处理。
  - 准确呈现执行结果：工具执行失败不再显示为成功，历史记录保留真实结果；错误提示更准确地区分配额耗尽与账户余额不足。
  - 优化 Windows 启动与升级：修复升级后仍打开旧程序、旧自启动入口残留的问题；安装前重新检查最新版本，减少正常启动时的数据库检查开销。
  - 改善 Bot 与诊断可靠性：修复引用资料内容更新后无法正常投递的问题，完善首次遥测初始化、未确认事件补发及下载统计去重。
  修复
  - 修复中文输入体验：解决输入法确认候选词时误发送、草稿丢失及补全干扰问题，优化过长技能命令的显示。
