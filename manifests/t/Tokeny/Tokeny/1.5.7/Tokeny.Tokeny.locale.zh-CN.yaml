ReleaseNotes: |-
  新功能
  - 自 1.5.6 正式版以来的更新，主线是带来全新的「会诊」多模型协作模式，内嵌浏览器整体重构为更安全的沙箱架构并让 AI 能直接诊断预览页面，同时终端和浏览器扩展各迎来一批实用增强：
  - 会诊模式（Mixture of Agents）：输入 /moa 即可让多个模型为你的问题"会诊"——一位主答模型负责输出，若干顾问模型在后台并行给出参考意见，主答综合后再作答。对话中会实时出现会诊卡片，每位顾问的状态和建议全文一目了然，运行中自动展开、完成后收起。顾问组合可以在设置里保存为多个预设随时切换；费用统计会把顾问和主答分开记账，同一个模型也能看清各花多少。后台小任务（自动改标题、摘要压缩等）不会偷偷动用会诊，成本不会悄悄翻倍。
  - AI 页面诊断：新增一组预览诊断工具，AI 可以查看内嵌浏览器页面的控制台日志、DOM 结构、截图、加载失败的网络请求，还能模拟手机等设备尺寸、直接点击页面元素排查问题——页面出错时让它"自己看一眼"就行。这些工具对你手动打开的外网标签页同样可用，且不再需要逐项审批。
  - 终端增强：终端输出里的网址现在可以直接点击、在内嵌浏览器打开（0.0.0.0 会自动识别为本机地址）；新增 Ctrl+F 终端内容搜索；渲染切换到 GPU 加速，长输出更流畅；修复 emoji 和组合字符宽度错位的问题；终端里的程序现在可以写入系统剪贴板。
  - 浏览器扩展剪藏：浏览器扩展新增"保存本页到库"，一键把当前网页转成 Markdown 存进「库」的"网页剪藏"文件夹，重名自动加序号；保存成功后应用会自动弹出并定位到新剪藏的内容。扩展图标同步换上了应用 logo。
  优化
  - 其他改进：计划（plan）模式的工作流程改为五阶段规划范式，拆解和执行更规范；修复内嵌浏览器偶发的页面被误关闭、预览深链接（如 /#/dashboard）丢失的问题；清理了「知识库」并入「库」之后残留的旧的叫法。
  修复
  - 模型修复：修复 Token Plan 套餐类模型 ID 被错误改写、导致提示模型不存在的问题，套餐模型的识别改为统一规则驱动；Kimi K3 Coding Plan 套餐端点现在正确映射到套餐专用模型；修复「库」的后台采集引用了已删除或未启用渠道的模型时反复报 404 的问题；修复部分 MCP 服务因认证头被强行加上 Bearer 前缀而连接失败的问题。
  重构
  - 内嵌浏览器重构：内嵌浏览器整体重写为沙箱架构，预览页面运行在隔离环境中，弹窗拦截、下载审批、越权访问都有了统一把关。工作区静态预览改用专属安全协议加载；AI 启动的本地开发服务（如 localhost:3000）现在可以直接在内嵌浏览器里打开，https 的本地服务也支持。
