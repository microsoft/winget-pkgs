ReleaseNotes: |-
  新功能
  - 自 1.6.0 正式版以来的更新，主线是全新的外观自定义和对话内任务编排，并修复了「库」编辑、模型工具调用的一批问题：
  - 外观自定义：设置新增「外观」板块。嫌麻烦可以直接用顶部六套快速搭配一键换装；也可以逐项自由组合——配色主题、界面壁纸、输入框背景都支持自定义和导入自己的图片。字体、字号、缩放、控件圆角等也集中在同一处调节。
  - 输入框伙伴：输入框旁可以养一只小伙伴——小橘猫、章鱼、彩虹云等七款形象可选，大小和活动方式可调，不需要也能关闭。
  - 搭配分享：调好的一套外观可以导出成 ZIP 备份或分享；拿到别人的方案文件，一键即可完整应用。
  - 对话内任务编排：面对多阶段、需要交叉汇总的复杂任务，AI 现在可以编制一张任务图——没有依赖的步骤并行推进，凑齐输入的步骤再启动，最后综合得出结论。启动前会展示授权卡片，节点数量、预算一目了然，可随时查询进度或取消；不需要此能力可在设置里整体关闭。
  - 「库」内直接编辑：文档和笔记现在可以直接在「库」的详情页修改，无需再跳转到别处。文件被外部改动时会提示你选择保留哪份，没保存成功的草稿也会临时保留，不再悄悄丢内容。
  优化
  - 模型工具调用修复：修复 Anthropic、MiniMax 等渠道在多轮工具调用中回复中断或报错的问题；工具返回的图片不再丢失，会投递给支持识图的模型；修复从剪贴板粘贴文件到对话偶发失败的问题。
  修复
  - PDF 与搜索修复：修正 PDF 正文提取的断词和换行，减少文字粘连；启动时自动修复缺失正文索引的文档，减少资料入库后只能搜到标题、搜不到正文的情况。
