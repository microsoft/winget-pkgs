ReleaseNotes: |-
  新功能
  - 这一版新增了拍照、打印和长文本附件，升级了多模型会审，也重点改善了长对话、任务执行和启动体验。
  - 在对话中拍照、打印 开启「内网设备」插件后，可以让 AI 协助打印文档和图片，打印前预览并选择页码、份数、单双面等。也可以拍照或录制短视频交给支持视觉的模型分析。拍摄内容直接回到当前任务，附加说明一起展示，衔接更自然。摄像头每次使用都需要授权，短视频通过采样画面分析。
  - 多模型会审更灵活 可以选择每轮咨询一次，或在遇到复杂问题时按需请多个模型提供建议，减少不必要的重复等待。会审建议与结果会保留，方便回看和核对。
  - 大段文字自动整理成附件 粘贴超过 5,000 字符的文字时，自动转为可预览的文本附件，避免输入框被长文占满。发送前可以查看全文、补充要求，让 AI 按需读取和检索。
  - 上下文用量显示更一致 统一按「最近模型输入」展示上下文占用。切换会话或重启后恢复对应统计，修复工具内容分类和显示不一致的问题，减少数字突然变化带来的困惑。
  优化
  - 长对话的信息保留更合理 调整历史工具结果的保留方式，减少仅因进入下一轮对话就过早截短内容的情况；同时完善长对话和子任务的上下文处理，降低任务中途失败的概率。
  - 启动和大项目打开更顺畅 优化启动加载顺序，让主题、模型清单等准备好后再进入主界面，减少主题闪烁和内容稍后才出现的情况。大项目减少无关目录扫描，并修复 Windows 下工作空间删除时的部分文件占用问题。
  - 任务内核优化，长任务更稳定 优化任务启动、暂停、恢复和结束时的状态管理，修复恢复后仍在执行的任务被误清理等问题；减少后台维护对正在执行任务的干扰，并完善超时处理、工具调用和子任务上下文管理，降低长时间运行时意外中断、状态残留的概率。
  修复
  - 任务执行与数据恢复更稳 修复切换会话、恢复任务、授权后继续执行时的部分状态异常，改善不同会话之间的任务与待办隔离，并加强自动备份和异常退出后的恢复处理。
  - 多处界面细节优化 修复输入框伙伴遮挡菜单、思考强度滑块操作异常等问题，改善小屏幕上的打印窗口布局，并调整渠道充值入口的位置与显示。
  - 多模态读图更连贯 修复多轮对话中图片历史传递不完整的问题，让后续追问能够更好地结合前面的图片。优化图片占用上下文的方式，降低连续读图时过快挤占对话空间的情况。实际识图能力取决于所选模型。
