ReleaseNotes: |-
  新功能
  - 会话支持分组和拖动排序。将相关会话归到同一组，支持折叠、改名和自由排序，管理多个任务更方便。
  - 不同会话之间可以引用内容。将其他会话拖入输入框，即可作为当前对话的参考。后续发送消息时会自动更新引用内容，减少重复解释背景。
  - Office 文档支持查看历史版本。Word、Excel、PowerPoint 文件可切换查看修改前后的内容，修复变更预览显示“无差异内容”的问题。
  - 资料入库和整理更方便。支持批量上传、选择入库目录，同名文件可选择覆盖、自动改名或取消。新用户提供默认分类目录，并加强文件移动、改名和覆盖失败时的恢复保护。
  优化
  - 文件变更记录更完整。改进脚本生成文件及连续多轮修改的追踪，修复变更列表遗漏、文件数量与版本历史不一致等问题。支持逐个或批量接受、回退，刷新后保留处理状态。
  - 文件编辑和预览更顺畅。新建 Markdown 后可直接开始编辑；修复 HTML 预览不自动更新、刷新按钮无效的问题，并改善内嵌页面的缩放显示。
  - 对话和任务执行更稳定。优化长篇思考内容的显示，改善技能、网页和消息渠道中的上下文衔接；修复重复调用确认后未正确暂停、任务结束通知遗漏等问题。
  - 启动、升级和界面体验优化。启动时显示数据升级和运行环境准备进度；改善 Windows 安装与升级流程，并修复打印、设置页面滚动及旧外观资源失效等问题。
  修复
  - 库中中文搜索更准确。修复会话记录和资料搜索异常，支持使用中文词句中的部分内容查找，减少明明存在却搜不到的情况。
  - 技能和插件运行更可靠。修复技能启停状态、资源访问和插件安装不完整的问题；完善执行前确认、拒绝操作及执行后通知，减少配置已开启却未生效的情况。
