ReleaseNotes: |-
  Fixed（修复）
  - 运行面板 PID 显示：启动/重启脚本后显示「PID undefined」（字母）而非真实进程号——启动后补拉主进程状态，显示真实进程 id
  - 弹窗容器聚焦光环：输出窗口等弹窗打开时按 Shift，出现系统默认 focus 边框（并曾导致窗口圆角被压成直角）——显式 tabindex 容器清除聚焦光环/默认 outline；全局 focus ring 不再强制圆角（光环跟随元素自身圆角）
  - 抽屉指示器箭头偏移：侧边栏抽屉（任务/运行/Issues）底部小三角用写死百分比定位（12%/46%/80%），按钮宽度随文字变化导致箭头不居中——实测激活按钮中心精确对齐（切换/窗口 resize 时重新对齐）
