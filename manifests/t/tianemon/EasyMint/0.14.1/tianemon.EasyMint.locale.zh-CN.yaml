ShortDescription: 围绕 Pi Coding Agent 构建的开源 AI 编程 Harness
Description: EasyMint 是一个开源 AI 编程 Harness——围绕 Pi Coding Agent 构建的桌面应用，在其之上提供图形化界面、多 Agent 协作与项目引导，覆盖从需求采集到成品交付的完整链路。面向编程新手，可通过对话引导完成需求采集、原型确认与技术方案确认，以点选和对话的方式驱动开发；面向开发者，则提供多 Agent 协作、会话管理与跨设备迁移等能力，作为日常的 AI 编程工作台。项目文件与会话数据全部存储本地，支持项目脚本一键检测、运行与监控。
