# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: tianemon.EasyMint
PackageVersion: 0.30.2
PackageLocale: en-US
ShortDescription: Open-source AI coding harness built on Pi Coding Agent
Description: >-
  EasyMint is an open-source AI coding harness built as a desktop application around the Pi Coding
  Agent engine. It adds a graphical interface, multi-agent collaboration, and project guidance on top
  of the agent, covering the full path from requirement gathering to a finished deliverable.
  Beginners can drive development through guided conversation with prototype and technical-plan
  confirmation, while developers get multi-agent collaboration, session management, and cross-device
  migration for daily AI-assisted work. Data handling: project files, sessions and settings are stored
  locally, and there is no account, telemetry or cloud service. EasyMint is an AI agent, so to answer
  a request it sends conversation content — your prompts, the project context, the files and command
  output it reads, and optionally images — directly to the AI provider you configure, and that
  provider's privacy and retention policies apply. The agent can read and modify project files and
  execute shell commands; a per-session permission mode (read-only / standard / full access) controls
  the scope, with system critical locations, privilege escalation and persistence mechanisms refused
  in all modes. Provider API keys are stored in plain text under ~/.easymint/ (MCP OAuth credentials
  are encrypted with the OS keychain).
PrivacyUrl: https://github.com/tianemon/EasyMint/blob/main/PRIVACY.md
