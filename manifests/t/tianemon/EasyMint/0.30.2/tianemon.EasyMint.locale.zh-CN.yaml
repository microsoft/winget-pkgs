ShortDescription: 围绕 Pi Coding Agent 构建的开源 AI 编程 Harness
Description: EasyMint 是一个开源 AI 编程 Harness——围绕 Pi Coding Agent 构建的桌面应用，在其之上提供图形化界面、多 Agent 协作与项目引导，覆盖从需求采集到成品交付的完整链路。面向编程新手，可通过对话引导完成需求采集、原型确认与技术方案确认，以点选和对话的方式驱动开发；面向开发者，则提供多 Agent 协作、会话管理与跨设备迁移等能力，作为日常的 AI 编程工作台。数据处理：项目文件、会话与设置存储在本地，无账号体系、无遥测、无云服务；应用为 AI Agent，为回答请求会把对话内容、注入的项目上下文、读取到的文件与命令输出以及可选图片，直连发送给用户自行配置的 AI 供应商，供应商的隐私与数据保留政策随之适用。Agent 可读写项目文件并执行 shell 命令，范围由会话级权限模式（只读 / 标准 / 完全访问）约束；供应商密钥明文存于 ~/.easymint/（MCP 的 OAuth 凭据经系统钥匙串加密）。
