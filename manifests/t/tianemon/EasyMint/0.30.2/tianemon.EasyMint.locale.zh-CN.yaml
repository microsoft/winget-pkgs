ReleaseNotes: |-
  Changed（调整）
  - 费用显示口径写清楚了：估算费用改为两位小数并带 ≈，鼠标悬停可看到换算算式（美元 × 汇率）；汇率收成一处常量，附来源与报价日
  Fixed（修复）
  - 委派给子 Agent 的用量计入会话统计：此前子会话的调用账单照收但不计入统计，用过委派时会话费用会系统性偏低
  - 用户消息里的图片不再把气泡撑宽：发送宽截图时气泡被撑到最大宽度、右侧留一片空白，现在气泡宽度贴合图片
