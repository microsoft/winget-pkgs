ReleaseNotes: |-
  Added（新增）
  - 原生 Pi 扩展管理：设置 →「插件」新增「扩展」列表，可发现原生 Pi 与 EasyMint 的用户级、项目级扩展；确认启用后可在完全访问模式的新会话使用扩展的工具、事件与命令，并可在列表中停用或查看加载错误
  Changed（调整）
  - 隐私与数据说明公开：新增 PRIVACY.md，逐条写明发给 AI 供应商的内容范围、权限三档各自允许什么、凭据的存储方式，以及「无账号、无遥测、无云服务」
  Fixed（修复）
  - 窗口大小与位置会被记住：关掉应用再打开时，恢复你上次调整过的窗口大小、位置与是否最大化
