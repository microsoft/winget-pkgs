ShortDescription: Free, open-source screen recorder and editor for Windows
Description: |-
  usee records a screen, a window or an area and turns it into a video that looks edited: the camera zooms in where you click, follows the pointer and can turn in 3D toward each action.
  It draws a smooth cursor with click effects, sets the picture on a background with padding, rounded corners and a shadow, adds words, arrows, boxes and privacy blur, and exports MP4 up to 4K.
  Everything stays on your computer: usee has no account and no telemetry, and it never uploads your recordings.
