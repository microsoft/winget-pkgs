ShortDescription: A free, open-source screenwriting app that never loses your work.
Description: |-
  Cold Open is a free, open-source screenwriting app. It reads and writes Fountain and
  Final Draft-compatible .fdx files, lays out pages the same way on every computer, and
  writes every keystroke to a crash journal before it shows on screen, so a crash never
  loses work. It needs no account and works offline.
