ShortDescription: Explore executables, objects, and libraries and their debug information (PE, ELF, Mach-O, WebAssembly; PDB, DWARF).
Description: 'hexcavator reads any executable, object, or library (PE, ELF, Mach-O, WebAssembly) with its debug information (PDB, DWARF): its headers, symbols, types, sources, data, and disassembly; why each function and datum is there and what refers to it; and where its bytes go, with measured recommendations to make it smaller. It also serves all of this to editors and AI agents.'
