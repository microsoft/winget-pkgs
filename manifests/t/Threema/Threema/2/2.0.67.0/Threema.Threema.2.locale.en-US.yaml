ReleaseNotes: |-
  Improvements:
  - Context menus can be opened in text field to access OS-level features
  - Additional media can be pasted in the media sharing dialog
  - Performance improvements for large message databases
  Fixes:
  - Fixed a bug where message edits could be applied on the secondary device even if the change was sent by a group member other than the author of the original message
  - Fixed a bug related to the “block unknown” option
  - Fixed a bug that, under certain circumstances, allowed multiple choices in single-choice polls
  …and various under-the-hood changes and improvements
