ShortDescription: Cool Again Shell, a Bash-language shell for Windows with its Unix tools built in
Description: |-
  cash runs Bash scripts as a native Windows program, with the Unix tools scripts need
  built in: coreutils, awk, sed, bc, find, xargs, ps, tput, iconv and more. The installer
  is per user and needs no admin; it adds a Windows Terminal profile and, by default, puts
  the bundled tools on PATH for editors and scripts outside cash. Upgrade with
  cash --update.
