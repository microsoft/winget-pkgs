ShortDescription: Cool Again Shell, one binary with Bash 5.3 and the Unix tools built in, native on Windows
Description: |-
  cash.exe is one binary with Bash 5.3 and the Unix tools scripts need built in: coreutils,
  awk, sed, grep, find, xargs, tar, zip, 7z, top, lsof and about 250 in all, every one a
  native Windows program, so a bare Windows machine gets a complete Bash. The installer
  is per user and needs no admin; it adds a Windows Terminal profile and, by default, puts
  the bundled tools on PATH for editors and scripts outside cash. Upgrade with
  cash --update.
