ReleaseNotes: |-
  Fixed
  - On a Mac, Yames can hear your instrument again. The installed app never asked for the microphone, so the Practice Coach and the timing score heard only silence. macOS now asks whether Yames may use the microphone, and Yames appears under System Settings › Privacy & Security › Microphone. Thanks to @withgod for the fix.
  - "Check for updates" in Settings can be pressed again after a check. Before, it disappeared for the rest of the session once a check came back.
  - The update banner in Settings no longer overlaps the panel below it.
