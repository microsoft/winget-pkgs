ReleaseNotes: |-
  What's Changed
  - GHSA-7g97-4pmr-2vrq is published: its row in SECURITY.md, 96 days exposed by @devdoc83 in #174
  - A plugin's hook watches a project that has no policy, and stands down where the project wires its own: termaxa hook --plugin by @devdoc83 in #175
  - A redirection is a write however it is spelled: echo x &> .claude/settings.json and echo x > ".claude"/settings.json are refused again, and a path rule sees &>, >&, <> and a quote inside a target by @devdoc83 in #176
  - A directory its tool has moved is guarded like the one it replaces: CLAUDE_CONFIG_DIR, CODEX_HOME and TERMAXA_HOME are followed by the file-tool guard, the path rules and the string rules by @devdoc83 in #177
  - A line is judged as each shell that can run it reads it: echo x > .ter\maxa/policy.yaml, echo x > $'.cl\x61ude/settings.json' and r\m -rf / are refused as bash reads them, and on Windows a caret and a backtick as cmd and PowerShell read them by @devdoc83 in #178
  - A word is judged as the shell opens it: echo x > .clau[d]e/settings.json, echo x > .claud{e..e}/settings.json and zsh's echo x > .claud(e)/settings.json are refused as the file they write, and a cd goes where its pattern goes by @devdoc83 in #179
  - v0.22.0: a write is judged however the shell spells it, and a plugin's hook watches a project that has no policy by @devdoc83 in #180
