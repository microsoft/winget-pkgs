ShortDescription: Type Linux, Windows or PowerShell commands on any OS; polysh translates them, flags and all.
Description: >-
  polysh is a small, offline shell that understands Windows cmd, Linux/macOS sh and
  PowerShell commands and rewrites each one for the OS you're on, including flags,
  pipes, chains, redirection and environment variables. It prints every translation
  before running it, and never guesses at flags it doesn't understand.
