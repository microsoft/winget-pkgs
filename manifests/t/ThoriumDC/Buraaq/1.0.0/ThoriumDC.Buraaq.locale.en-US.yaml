ShortDescription: Write like Python. Run like C. Native systems language with LLVM.
Description: >
  Buraaq is a self-hosted systems programming language from Thorium DC.
  You write .bq; LLVM emits a native binary. No garbage collector on the default path.
  This package installs the Windows CLI and stdlib sysroot. Clang/LLVM is also required
  (winget install LLVM.LLVM).
