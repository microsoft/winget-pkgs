ShortDescription: Options trading desk for Interactive Brokers traders.
Description: |-
  Tented is a desktop app for options traders who trade through Interactive Brokers.
  Every open trade gets its own page with P&L, Greeks and a risk graph, and a plan with a target and stop that Tented watches in the background.
  Build trades from live option chains, compare scenarios, and record them in a journal with a performance view.
  Desk, an assistant, models adjustments and explains them; it never places orders.
  Requires a free Tented account and market data from TWS or IB Gateway. Free during the beta.
