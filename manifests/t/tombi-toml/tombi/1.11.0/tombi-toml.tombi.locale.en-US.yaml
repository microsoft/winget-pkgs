ReleaseNotes: |-
  <!-- Release notes generated using configuration in .github/release.yml at v1.11.0 -->
  
  ## What's Changed
  ### 🚨 Breaking Changes
  * feat(cli): exit with an error when warnings or errors are logged by @ya7010 in https://github.com/tombi-toml/tombi/pull/2431
  * feat(cli)!: add -q/-qq to lower the log level by @ya7010 in https://github.com/tombi-toml/tombi/pull/2442
  * fix(cli): reject -vvv like -qqq by @ya7010 in https://github.com/tombi-toml/tombi/pull/2444
  ### 🦅 New Features
  * Add dependency group completion for pyproject.toml by @ya7010 in https://github.com/tombi-toml/tombi/pull/2412
  * feat(config): support extending shared configs by @ya7010 in https://github.com/tombi-toml/tombi/pull/2418
  * feat(extension-tombi): complete file paths in extends by @ya7010 in https://github.com/tombi-toml/tombi/pull/2437
  * refactor(schema-store): return the parsed value from the cached HTTP client by @ya7010 in https://github.com/tombi-toml/tombi/pull/2441
  ### 🐝 Bug Fixes
  * fix: avoid duplicate extends pattern diagnostic by @ya7010 in https://github.com/tombi-toml/tombi/pull/2433
  * fix(extension-tombi): report every extends loading error as a diagnostic by @ya7010 in https://github.com/tombi-toml/tombi/pull/2440
  ### 🛠️ Other Changes
  * docs: update TOML structure for extension lint rules in configuration.mdx by @ya7010 in https://github.com/tombi-toml/tombi/pull/2411
  * fix: exclude own group from include-group completion by @ya7010 in https://github.com/tombi-toml/tombi/pull/2415
  * refactor: remove AST dependency from extension completion by @ya7010 in https://github.com/tombi-toml/tombi/pull/2416
  * feat: complete workspace member dependency names in pyproject by @ya7010 in https://github.com/tombi-toml/tombi/pull/2417
  * feat: complete declared names in pyproject and Cargo.toml by @ya7010 in https://github.com/tombi-toml/tombi/pull/2419
  * fix: complete workspace dependency names in pyproject arrays by @ya7010 in https://github.com/tombi-toml/tombi/pull/2421
  * fix: exclude names already listed in pyproject and Cargo.toml lists by @ya7010 in https://github.com/tombi-toml/tombi/pull/2422
  * fix: insert commas when completing array items by @ya7010 in https://github.com/tombi-toml/tombi/pull/2423
  * fix: keep comments when inserting a comma before a new array item by @ya7010 in https://github.com/tombi-toml/tombi/pull/2424
  * test: cover an existing comma after the cursor in array item completion by @ya7010 in https://github.com/tombi-toml/tombi/pull/2425
  * fix: warn when tombi.toml is placed in the user config directory by @ya7010 in https://github.com/tombi-toml/tombi/pull/2427
  * style: fix biome import order in vscode extension by @ya7010 in https://github.com/tombi-toml/tombi/pull/2430
  * fix: re-select Language Server binary on restart by @ya7010 in https://github.com/tombi-toml/tombi/pull/2429
  * fix: log user mistakes as errors and degraded fallbacks as warnings by @ya7010 in https://github.com/tombi-toml/tombi/pull/2432
  * fix(config): resolve extends against the same base directory as schemas by @ya7010 in https://github.com/tombi-toml/tombi/pull/2436
  * feat(config)!: accept only an array for extends by @ya7010 in https://github.com/tombi-toml/tombi/pull/2435
  * feat(extension-tombi): report missing extends, schema and catalog targets alike by @ya7010 in https://github.com/tombi-toml/tombi/pull/2434
  * perf(schema-store): avoid parsing validated JSON twice by @ya7010 in https://github.com/tombi-toml/tombi/pull/2438
  * fix(extension-pyproject): include build-system.requires in workspace member references by @ya7010 in https://github.com/tombi-toml/tombi/pull/2443
  
  
  **Full Changelog**: https://github.com/tombi-toml/tombi/compare/v1.10.0...v1.11.0
