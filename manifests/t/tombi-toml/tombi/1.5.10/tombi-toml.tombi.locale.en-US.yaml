  <!-- Release notes generated using configuration in .github/release.yml at v1.5.10 -->
  
  ## What's Changed
  ### 🛠️ Other Changes
  * fix: route file:// resolution through tombi_fs and share wasm workspace injection by @ya7010 in https://github.com/tombi-toml/tombi/pull/2227
  * feat(tombi-lib): add shared core crate for format/lint by @ya7010 in https://github.com/tombi-toml/tombi/pull/2228
  * feat(tombi-lib): add PyO3 bindings and python/tombi-lib package by @ya7010 in https://github.com/tombi-toml/tombi/pull/2229
  * feat(tombi-lib): add napi-rs Node.js binding and npm packaging by @ya7010 in https://github.com/tombi-toml/tombi/pull/2230
  * feat(tombi-lib): add formatSync/lintSync to the Node.js binding by @ya7010 in https://github.com/tombi-toml/tombi/pull/2232
  * ci(npm): publish the Node.js library as @tombi-toml/lib and tombi-lib by @ya7010 in https://github.com/tombi-toml/tombi/pull/2233
  * refactor(npm): rename @tombi-toml/tombi to @tombi-toml/cli by @ya7010 in https://github.com/tombi-toml/tombi/pull/2234
  * docs: add tombi-lib documentation for Python and Node.js by @ya7010 in https://github.com/tombi-toml/tombi/pull/2231
  * ci(pypi): build and publish tombi-lib to PyPI by @ya7010 in https://github.com/tombi-toml/tombi/pull/2235
  * fix(deps): bump fast-uri to 3.1.7 and undici to 7.29.1 by @ya7010 in https://github.com/tombi-toml/tombi/pull/2237
  * ci(wasm): avoid double wasm builds and parallelize lib/lsp jobs by @ya7010 in https://github.com/tombi-toml/tombi/pull/2238
  * feat(wasm-lib): restore TombiWasmError as deprecated alias of TombiError by @ya7010 in https://github.com/tombi-toml/tombi/pull/2239
  * docs: highlight Python code and clarify tombi-lib vs tombi-wasm-lib by @ya7010 in https://github.com/tombi-toml/tombi/pull/2240
  * fix(lsp): complete $key for tables with additionalProperties: true by @ya7010 in https://github.com/tombi-toml/tombi/pull/2241
  * fix(lib): unify tombi-lib and wasm-lib interfaces by @ya7010 in https://github.com/tombi-toml/tombi/pull/2242
  * fix(wasm-lib): keep Diagnostic.source_file as a deprecated alias by @ya7010 in https://github.com/tombi-toml/tombi/pull/2243
  
  
  **Full Changelog**: https://github.com/tombi-toml/tombi/compare/v1.5.8...v1.5.10
