ReleaseNotes: |-
  <!-- Release notes generated using configuration in .github/release.yml at v1.7.0 -->
  
  ## What's Changed
  ### 🛠️ Other Changes
  * feat(cli): add --diagnostics-format and --diagnostics-file by @ya7010 in https://github.com/tombi-toml/tombi/pull/2250
  * refactor: keep Span through diagnostics and convert to Range with LineIndex at the output boundary by @ya7010 in https://github.com/tombi-toml/tombi/pull/2254
  * perf(formatter): only scan the last line in current_line_width by @ya7010 in https://github.com/tombi-toml/tombi/pull/2255
  * perf(document-tree): avoid O(n^2) scan in Table::merge for key-value tables by @ya7010 in https://github.com/tombi-toml/tombi/pull/2256
  * perf(formatter): memoize exceeds_line_width to fix exponential time on nested arrays by @ya7010 in https://github.com/tombi-toml/tombi/pull/2257
  * fix(deps): bump brace-expansion, dompurify and fast-uri overrides by @ya7010 in https://github.com/tombi-toml/tombi/pull/2258
  * perf: build a per-tree header index to remove O(n^2) sibling header walks by @ya7010 in https://github.com/tombi-toml/tombi/pull/2260
  * refactor: keep JSON positions as Span and convert with LineIndex at the output boundary by @ya7010 in https://github.com/tombi-toml/tombi/pull/2261
  * perf: scan JSON bytes, stream tokens into the parser and share parsed containers by @ya7010 in https://github.com/tombi-toml/tombi/pull/2263
  * perf: borrow the source and LineIndex instead of reference-counting them by @ya7010 in https://github.com/tombi-toml/tombi/pull/2262
  * test: keep the issue-2164 fixture valid and pass the invalid text inline by @ya7010 in https://github.com/tombi-toml/tombi/pull/2264
  
  
  **Full Changelog**: https://github.com/tombi-toml/tombi/compare/v1.6.1...v1.7.0
