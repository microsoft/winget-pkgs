Description: Traycer is a shared workspace — the nerve center for agentic coding. Run multiple AI coding agents (Claude Code, Codex, OpenCode, Cursor) side by side and let them communicate with each other while sharing files, artifacts, and history. Built-in skills cover plan, execute, review, and explain, and multiplayer collaboration lets your team work in the same workspace.
