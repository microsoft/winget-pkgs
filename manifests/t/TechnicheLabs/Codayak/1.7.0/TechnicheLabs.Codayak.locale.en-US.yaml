ShortDescription: Free Windows AI coding workbench for .NET teams that builds, tests and proves every change.
Description: Codayak is a free Windows AI coding workbench for .NET and C# teams. It turns tickets into acceptance criteria, shows the blast radius of a change, writes and builds code, runs your unit tests, SQL and UI tests, reviews pull requests in Azure DevOps and GitHub, and proves each change with a trust report. It uses your existing LLM provider API keys (Anthropic, OpenAI, Google, xAI, MiniMax, Moonshot, Zhipu) or any OpenAI-compatible endpoint, including local models.
