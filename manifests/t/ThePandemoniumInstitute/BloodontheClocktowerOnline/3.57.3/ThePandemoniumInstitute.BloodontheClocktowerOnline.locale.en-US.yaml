ReleaseNotes: "• 🌟 improved speaking indicator visuals\r\n• 🌟 \"Is the X\" (i.e. Drunk) reminders now also affect Storyteller bluff character selection\r\n• 🌟 Receiving grimoire access as a spectator will now also clear your own reminders / grimoire, to prevent reminders from being duplicated.\r\n• 🌟 going to Grimoire reveal will now cancel any currently running timer\r\n• 🐛 fixed report file attachments not being shown on Safari (thanks Exorre)\r\n• 🐛 fixed dead players without a ghost vote token being unable to vote with a Voudon in play (thanks Vaiva & Jimmy)\r\n• 🐛 changing your name or pronouns on the user settings now also updates the preview (thanks adamcactus)\r\n• 🐛 fixed session meta hover text not showing the session creator any more (thanks adamt1g3r)\r\n• 🐛 fixed lobby layout on super-wide screens (thanks Hillshum)\r\n• 🐛 fixed text chat input field selection on Firefox (thanks A concerned Townsfolk)\r\n• 🐛 Grimoire access will only be removed at the end of the reveal now, rather than the start (thanks pinkyShy)\r\n• 🐛 limited visible Storyteller name length on public lobby list  \r\n• 🐛 fixed homebrew scripts causing an error if they contain characters without an ID\r\n• 🐛 fixed private chat request race condition that could lead to infinite chat subsequent chat requests (thanks Aesterias)"
