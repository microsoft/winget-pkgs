ReleaseNotes: "• 🌟 added a \"Do not disturb\" and \"Invisible\" state to the friends list to allow playing without friend notifications / being seen as online\n• 🌟 colorblind mode now also affects text chat character icon emojis\n• 🌟 sessions with blocked players will now have a red \"join\" button rather than a red background colour\n• 🌟 changed default English date formats in the app from `mm/dd/yyyy` to `mmm d, yyyy` (ie. \"Nov 17, 2026\") to reduce confusion\n• 🌟 adding the \"X\" reminder to the Xaan will now trigger a \"this player is poisoned\" warning on all Townsfolk players' wake interface\n• 🌟 the block list now allows you to block someone directly via their user ID\n• 🐛 fixed quickly reloading the app still triggering a \"friend has joined a session\" notification (thanks kieran.py)\n• 🐛 removing the Pope from the game will now remove extra characters from the bag (thanks TQ Bradley)\n• 🐛 fixed opening a user profile when a different user profile is already open (thanks Numbers)\n• 🐛 fixed language dropdown going outside the window on Chrome\n• 🐛 fixed changing a character alignment through the character pop-up not always propagating properly to other STs / spectators (thanks BattleYak)\n• 🐛 fixed ignoring already accepted friend requests in additional browser tabs (thanks Numbers)\n• 🐛 fixed friends list custom image avatars not being rendered properly (thanks Dex & Eniter) \n• 🐛 spectators no longer see the \"Request private chat\" entry in the main menu (thanks Koem)\n• 🐛 fixed a race condition that prevented the session list from loading after trying to join a non-existent session (thanks @hasonfilip)\n• 🐛 the Grimoire Reveal phase will now show the correct start time rather than the time when whe game began (thanks vavaboom)\n• 🐛 users whose friend requests you have ignored can now be properly blocked directly (thanks meta5574)"
