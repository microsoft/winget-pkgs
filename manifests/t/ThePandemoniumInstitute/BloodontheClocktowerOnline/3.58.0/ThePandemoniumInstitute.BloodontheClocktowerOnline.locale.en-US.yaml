ReleaseNotes: |-
  We've (finally!) added friends list to the app - one of the most requested features so far, and a natural fit for a social deduction game as well. But what does that mean, you ask?
  You will now be able to send anyone you meet in the app a friend request, either directly through their user profile, or by entering their app user ID in the friends list pop-up, that you can open from any place in the app with a press of the default shortcut："F" for "Friends".

  On that pop-up, there will be a list of confirmed friends, incoming and outgoing friend requests and blocked players. For friends and blocked players, you will now be able to save a personal (only visible to you) note, by clicking on their profile and then on the little pen and notepad icon next to the friend / block entry there.
  What does it mean exactly to be friends with someone? You will get a notification whenever your friend goes online on the app or joins a session. You can also invite them to your (private) session and ask them to invite you to theirs. Only public sessions will be shown directly on the friend list screen and notifications can be muted altogether or just for a select few "friends". But that's not all! As a special treat for the upcoming Halloween, we've added a new nameplate border to the app, that anyone that makes at least 10 friends on the app will receive - but only until the end of October! And there might even be another, special secret emote you can unlock, if you become friends with the right people... :smiling_imp:

  <img width="500" alt="image" src="https://github.com/user-attachments/assets/de3f3230-bbb7-4a1a-ad84-e5ec315256b9" />

  • 🚀 friends lists have been added to the app! (default shortcut：F) you will get notifications when your friends are online and join games and can invite each other to your/their games
  • 🌟 added special Halloween promotion - you get a unique nameplate when you've made 10 friends on the app
  • 🌟 added support for saving a personal text note for each friend / blocked user
  • 🌟 added Norwegian (Bokmal) and Polish game translations
  • 🌟 transparent "marked for death" shrouds will now also be visible to spectators with Grimoire access
  • 🐛 fixed dead players still showing up in monochrome when in a private chat (thanks xlifenova & Alyssa)
  • 🐛 fixed invisible private chat when coming from a public chat (thanks Horse & the others)
