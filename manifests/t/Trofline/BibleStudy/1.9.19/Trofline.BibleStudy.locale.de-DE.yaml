ShortDescription: Kostenloses, quelloffenes Bibelprogramm, läuft offline und ohne Konto.
Description: |-
  BibleStudy ist ein kostenloses Programm zum Lesen, Vergleichen und Studieren der Bibel.
  Viele freie Übersetzungen nebeneinander, Griechisch und Hebräisch Wort für Wort,
  Suche in der ganzen Bibel, eigene Markierungen, Notizen und Dokumente,
  Bibelstunden mit den eigenen Materialien vorbereiten, Handouts drucken und Verse am Beamer zeigen.
  Alles bleibt auf dem eigenen Rechner; kein Konto, kein Tracking.
