ShortDescription: Free, open-source Bible study software that works offline, with no account.
Description: |-
  BibleStudy is a free Bible study program for reading, comparing and studying Scripture.
  Read many free translations side by side, go back to the Greek and Hebrew word by word,
  search the whole Bible, keep highlights, notes and documents in your own vault,
  prepare a Bible study with your materials, print handouts and show verses on a projector.
  Everything stays on your computer; no account, no tracking.
