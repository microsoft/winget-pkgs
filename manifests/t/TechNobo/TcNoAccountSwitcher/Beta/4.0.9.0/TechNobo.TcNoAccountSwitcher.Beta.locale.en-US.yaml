ReleaseNotes: |-
  TcNo Account Switcher Banner
  Reporting bugs:
  This software underwent a major rewrite. Even though I've done my best to find & debug issues, some may have slipped through.
  Please report any and all bugs, as well as steps to recreate them into the Issues, or the #bug-report channel under TCNO ACCOUNT SWITCHER section on the Community Discord.
  Installation & Use
  This program can be run directly from TcNo-Acc-Switcher.exe - No install required.
  Should you wish to install use TcNo.Account.Switcher.Installer.exe
  Required Runtimes
  We've shrunk the program a LOT to just 1 file and minimal runtime dependencies.
  (Windows): WebView2 Runtime which is likely already installed.
  For a portable installation (eg. on a USB) see THIS.
  Things not working? See the FAQ
  New in this version
  Added:
  - Battle.net Authenticator (Similar to Steam Guard) support with setup, recovery, backups, and account linking.
  - Support for the new Epic Games Launcher while retaining legacy launcher support. #552
  - Interface scaling options from 75% to 200% in Theme settings.
  Fixes:
  - Improved account saving, switching, and recovery after failed operations.
  - Restored migration of saved accounts from the legacy .NET version.
  - Fixed EA and Ubisoft session handling, account detection, and launcher restarts. #514 #545
  - Fixed Battle.net account login resets, Discord session saving, and Tarkov account detection. #548 #546
  - Preserved cached account details and images when offline.
  - Restored legacy game shortcuts and fixed account shortcut icons.
  - Fixed update handling, startup freezes, and WebView2 resource leaks.
  New in 4.0+
  - MASSIVE rewrite. Ditched .NET for Go - A natively compiled language which means much faster performance, fewer dependencies (it's just a single file now), and WAY less memory usage. We've also moved to Wailsv3 which while Chromium-based uses far less RAM and resources than Electron and even our previous CEF/WebView2 implementation. 17-40MB RAM usage vs 76-400MB previously.
  - Single executable (no more tray, server, client and wrappers).
  - Steam switcher is much faster, collects profile images (+ animated ones) with Mini Profiles and more!
  - Discord (+ PTB & Canary) now get username/profile images from local files. MUCH better UX.
  - Fixed & improved switcher for almost everything. Oculus is now Meta Horizon Link and Delta Force: Hawk Ops -> Delta Force.
  - Removed switcher for Genshin Impact & Honkai Star Rail as they seem to rely on other markers this app can't control for logged-in account status.
  - NEW: Tags feature. Apply tags to sort and filter accounts on all platforms, plus expiry for tags like weekly CS2 drops.
  - NEW: Steam Guard (Full SDA cross-compatability) - Approve transactions, trades, recovery & more + functionality like swapping/searching accounts by game and more!
  - NEW: Accounts can have custom images; Just drag and drop images onto accounts
  - NEW: Drag and drop behavior for adding shortcuts to the game/app bar. Just drag in a shortcut or application.
  - NEW: Type anywhere to search. Platforms, Accounts & more.
  - Context menu improvements.
  - NEW: leveldb support for custom platforms & support for multiple default install paths.
  - NEW: Full controller and keyboard navigation and use support. Great a11y.
  Full Changelog: 2025-11-20_03...v4.0.1
  This software values your privacy. Please see the Privacy Policy & Disclaimer.
