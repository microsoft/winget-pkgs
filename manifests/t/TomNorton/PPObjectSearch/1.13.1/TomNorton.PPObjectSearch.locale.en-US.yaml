ShortDescription: Keyword search of the objects in a Power Platform / Dataverse solution.
Description: |-
  A Windows desktop app for keyword-searching the objects in a Power Platform / Dataverse
  solution. Connects with interactive OAuth, defaults to the environment's default solution, lists
  every object with a filterable object type column, and links each name straight into the maker
  portal. It also compares solutions and reference data between environments, checks a solution's
  readiness to deploy, and shows dependencies, flow run history and recent changes.
  The ppos command line is a separate package: TomNorton.PPObjectSearch.CLI.
