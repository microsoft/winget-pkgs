ShortDescription: Read-only Power Platform solution checks for pipelines - diff, reference-data compare and readiness.
Description: |-
  ppos runs the read-only checks a pipeline wants before promoting a Power Platform / Dataverse
  release: the solution components missing from either environment (diff), a saved reference-data
  comparison (compare-data), and a deployment readiness check (readiness). Nothing it does writes
  to an environment. Exit codes make a pipeline step fail exactly when there is something to look
  at. It can sign in as an app registration to run unattended.
  It is the command line of the Power Platform Object Search desktop app (TomNorton.PPObjectSearch).
