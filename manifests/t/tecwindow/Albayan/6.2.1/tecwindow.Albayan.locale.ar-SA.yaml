ReleaseNotes: "## الإصدار 6.2.1\r\n\r\nيحتوي هذا التحديث على مساهمة من المجتمع وتحديثات أمنية هامة للملحقات وإكمال إصلاح خطأ سابق.\r\n\r\nنوصي بتثبيت هذا التحديث للحصول على آخر التحسينات.\r\n\r\n• تم إجراء تعديلات على تفسير السعدي، يشمل توفير تفاسير مفقودة لبعض الآيات، إزالة وسوم HTML ومسافات زائدة، تصحيح التنسيق الذي كان يتسبب بعرض تفسير آية مختلفة عن الآية الحالية، جزيل الشكر للأستاذ عبد الله سعد @abdullahsaad27 على هذه المساهمة. [(9)](https://github.com/tecwindow/albayan/pull/9).\r\n• تم إصلاح خطأ كان يتسبب بفشل فتح نافذة الإعدادات في حال تمت استعادة الإعدادات الافتراضية، وذلك بسبب مسار التنزيلات.\r\n• تم إجراء تحسينات برمجية على ميزة نسخ رابط إصدار البيان ليتم إنشاء رابط الإصدار الحالي بشكل تلقائي.\r\n• تم تحديث ملحقات البيان ومن ضمنها ملحقات تحتوي على ثغرات أمنية في إصداراتها السابقة. نوصي بتثبيت التحديث للحصول على أحدث التحسينات.\r\n• تم تحديث إصدار Python المستخدم إلى أحدث إصدار متاح Python 3.14.7."
