License: 免费软件
ShortDescription: 免费的 Windows x64 VNC 查看器，支持多标签会话与连接历史。
Description: |-
  VNC4FREE 是一款用于连接已运行 VNC 服务端的 Windows x64 桌面查看器，支持标准 RFB 3.3、3.7 和 3.8 会话，包括传统 VNC 密码认证，并可连接普通 TCP、TLS、WebSocket 与加密 WebSocket 端点。
  地址书中保存了连接配置、分组、收藏与搜索功能，最多可在 16 个标签页中打开会话，并提供按键发送、只读模式、剪贴板传输、全屏以及 PNG 截屏。
