ShortDescription: Free, open-source desktop app for Claude Code, Codex, Gemini CLI and Grok.
Description: |-
  Alchemist Coder is a desktop app for coding agents. It indexes the history of Claude Code, Codex, Gemini CLI and Grok Build on your computer, with full-text search, and shows every conversation as a tree of agents and subagents with live status, tokens and cost.
  Give work to your own organization of agents: a coordinator plans the assignment, you approve it, and each agent works in its own git copy. Automations run routines on a schedule from a flow diagram an agent draws from your words, and can ask you on your phone through your own Telegram bot.
  It also has an Arena where several agents solve the same task, a Board, a Git tab in plain words, an editor and a terminal. The free Community edition runs agents on local models (Ollama, LM Studio).
