ReleaseNotes: |-
  新增
  - 聊天侧栏置顶专家；业务流程专家；技能与技能包导出 ZIP
  - 记忆页可手改用户档案与强记忆，冲突转入审核
  - 技能、工具与团队的决策模型；通道插件；模型健康切换
  - 对外 Agent MCP 网关；ONNX 模型可离线加载
  修复
  - 无路径搜索不再打满主机内存；失败回合会正常结束
  - 云端专家结束态、未安装插件提示，以及对端模型与知识库显示
  - 用量显示专家名；定时任务会话有标题；文件描述符与 accept 日志
  - Docker 外部数据库重启、知识库运行时与安装后重启提示
  - Embedding 与 rerank 分开识别；飞牛 beta 可升级并保留浏览器驱动
  - 安装向导在已有用户后不再签发令牌
  变更
  - 用户消息的复制、编辑按钮一直显示
  - 升级 octop-memory 1.0.2、octop-harness 1.0.4、octop-gateway 1.0.3
