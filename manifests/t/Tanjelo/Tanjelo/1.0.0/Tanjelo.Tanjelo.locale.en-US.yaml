ShortDescription: Convert and edit files straight from File Explorer, offline.
Description: >-
  Select files in File Explorer, press Ctrl+Shift+Space, and pick what they should become from the menu at the mouse
  pointer. Tanjelo converts images, PDFs, video, audio, Office documents, Markdown, EPUB and archives, has tools such as
  compress, crop and redact, and editors for PDF pages, photos and video. Results go beside the original, which is never
  overwritten, and everything runs offline. The tanj command does the same from scripts.
