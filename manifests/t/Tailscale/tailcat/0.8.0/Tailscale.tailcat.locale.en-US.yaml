  - 038415d swift: commit the TailcatKit scheme xcodebuild builds with
  - ecdbd1f cmd/tailcat: serve Unix-domain sockets
  - f216f3e tool/updateflakes: always hash the vendor tree
  - a3f969d cmd/tailcat: add serve --qr to print the address as a QR code
  - 2d52774 cmd/tailcat: reject port 0 and invalid bare target ports
  - df95d7b cmd/tailcat: add serve --log access log
  - 7dda987 tailcat: support SSH local TCP forwarding to loopback
  - e99a945 tailcat: close netcheck STUN sockets when PickBestRegion returns
  - c14b171 internal/capi: keep connection addresses after half close
