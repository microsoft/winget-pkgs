ShortDescription: A launcher for Commander Keen and its mods
Description: |-
  BloogBase plays the Commander Keen games and close to a hundred community mods with a single click.
  It downloads DOSBox Staging and the free shareware episodes, finds the games you own on Steam and GOG,
  installs mods from a curated list or any KeenWiki page, keeps every game's and mod's saves apart and
  safe, and never touches your original game files. An unofficial fan project.
