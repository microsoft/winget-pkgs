PackageIdentifier: transporthummel.BloogBase
PackageVersion: 1.0.0
PackageLocale: de-DE
Publisher: transporthummel
PackageName: BloogBase
License: MIT
ShortDescription: Ein Launcher für Commander Keen und seine Mods
Description: |-
  BloogBase spielt die Commander-Keen-Spiele und fast hundert Mods der Community mit einem Klick.
  Es lädt DOSBox Staging und die kostenlosen Shareware-Episoden herunter, findet deine Spiele von Steam
  und GOG, installiert Mods aus einer kuratierten Liste oder von jeder KeenWiki-Seite, hält die
  Spielstände jedes Spiels und jeder Mod getrennt und sicher und rührt deine Originaldateien nie an.
  Ein inoffizielles Fanprojekt.
ManifestType: locale
