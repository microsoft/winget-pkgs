PackageIdentifier: the-snowpear.OMPStudio
PackageVersion: 0.2.12
PackageLocale: en-US
ShortDescription: A desktop GUI and arrangeable workbench for the oh-my-pi (omp) AI coding agent.
Description: |-
  OMP Studio is a cross-platform desktop GUI and arrangeable workbench for the oh-my-pi (omp) AI coding agent on Windows, macOS, and Linux. It brings parallel conversations, plan approvals, subagents, Git / worktrees, files, a terminal, a managed browser, computer use, MCP / Skills, and model configuration into a single window — talking directly to the Runtime through a typed Studio Bridge without scraping TUI text, parsing ANSI output, or simulating keystrokes.
  Drag workbench conversations and tools into windows, snap them into split layouts, dock them to any side, or pin them as independent system windows. You can run several conversations side by side, each with its own tools.
  Flexible Workbench
  Conversations, tools, and web pages share the same window system: float, snap, split, group, minimize, or pin as standalone OS windows. Layouts restore across restarts.
  Typed Bridge
  The UI communicates with the Runtime via query / command / event. The renderer never receives tokens, process handles, or native paths; unknown mutations fail closed.
  All-in-One Local Capabilities
  Git / worktrees, files, terminal, managed browser, computer use, SSH / WSL 2 workspaces, LAN mobile access, Time Travel, BTW asides, evaluation, and voice dictation all live inside the workbench — no hopping between a TUI and a pile of web pages.
