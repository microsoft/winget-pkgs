Description: |-
  OMP Studio 是 oh-my-pi（omp）AI Coding Agent 的跨平台桌面 GUI 与可视化工作台（支持 Windows、macOS 与 Linux）。将多会话并行对话、审批、子 Agent、Git / Worktree、文件、终端、托管浏览器、电脑操作（Computer Use）、MCP / Skills 与模型配置放进同一扇窗口，通过类型化的 Studio Bridge 直接对接 Runtime，不解析 TUI 文本或 ANSI 输出，也不模拟按键。
  工作台里的对话和工具都可以拖成窗口、吸附分屏、停到任意一侧，或钉成独立系统窗口。 你可以同时开几场对话，每场各带自己的工具。
  自由的工作台
  对话、工具和网页使用同一套窗口：浮动、吸附、分屏、成组、最小化，或钉成独立系统窗口。布局在重启后恢复。
  类型化 Bridge
  界面通过 query / command / event 与 Runtime 通信。Renderer 拿不到 token、进程句柄或本机路径；未知写操作一律失败关闭。
  一站式本机能力
  Git / Worktree、文件、终端、托管浏览器、电脑操作、SSH / WSL 2 工作区、局域网手机访问、Time Travel、BTW、评测与语音输入都在工作台内，不必在 TUI 和一堆网页之间切换。
