ReleaseNotes: |-
  1. Agent 多步操作优化：优化 Agent 多步骤任务执行能力，提升操作连贯性与执行效率。
  2. 终端快捷指令分组：新增快捷指令分组功能，方便用户对常用指令进行分类管理。
  3. AI 对话历史记录：右侧 AI 面板支持保存历史对话，方便后续查看与继续交流。
  4. 文件编辑体验优化：优化文件编辑器光标定位及操作体验。
  5. Windows 文件操作优化：优化 Windows 文件复制、粘贴功能，提升文件操作体验。
  6. MFA 验证问题修复：修复 MFA 验证过程中 CPU 占用异常的问题。
  7. RDP 连接问题修复：修复 RDP 连接时需要重复输入密码的问题。
  8. Telnet 连接问题修复：修复 Telnet 会话退出后无法在当前终端重新连接的问题，无需重新打开终端。

  备注
  截止本次版本针对历史反馈已全部完成评估与处理，官网原有反馈记录将统一清理。部分暂未采纳的优化建议并不代表我们永久放弃这些需求。如果后续您仍然有相关需求，欢迎再次提交，我们会结合实际使用场景、用户需求及产品规划进行综合评估，酌情安排优化。
