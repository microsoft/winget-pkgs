ReleaseNotes: |-
  1. 修复使用 rz、sz 传输文件时鼠标指针不可见的问题。
  2. 修复通过 rz 上传可执行文件后文件损坏的问题。
  3. 降低 Linux 版本的 GLIBC 依赖要求，提升对较旧系统的兼容性。
  4. 新增快捷键上传文件功能。
  5. 修复 Arch Linux 下 AppImage 版本点击登录按钮后卡死的问题。
  6. Android 端新增 WebDAV 同步支持。
  7. 修复会话编码菜单的编辑异常。
  8. 尝试修复部分 Windows 11 用户无法打开本地终端的问题。
  9. 支持 RDP 远程桌面与本机之间双向复制文件。
  10. 修复登录内网旁路由时报错的问题。
  11. 修复切换应用时终端画面闪烁的问题。
  12. 优化终端字体配置，修复字体设置不生效及 Shell 提示符图标无法正常显示的问题。
  13. 修复创建本地 CMD、PowerShell 终端时报错的问题。
  14. 修复设置背景后，选中内容难以辨认的问题。
  15. 修复设置背景图后空格显示异常、目录列表对齐错乱及右侧文件栏遮挡终端内容的问题。
  16. 修复系统缩放及高 DPI 场景下鼠标拖拽位置偏移的问题。
  17. 修复 iStoreOS 相关兼容性问题。
  18. 修复添加新主机页面的显示异常。
  19. 修复本地 PowerShell 终端反复执行 clear 后出现渲染异常的问题。
  20. 修复终端高亮显示异常的问题。
