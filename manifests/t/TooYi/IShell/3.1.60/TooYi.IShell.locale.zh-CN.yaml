ReleaseNotes: |-
  1. 优化自定义 AI 模型接入流程，新增模型后可直接保留配置。
  2. 修复 macOS 上传文件时错误沿用本机用户和用户组的问题，默认使用远端登录账号。
  3. 目录同步支持设置默认规则，并可批量应用到多台主机。
  4. 优化传输列表的操作体验。
  5. 修复光标样式修改后不生效的问题。
  6. 会话断开后保留已有终端日志。
  7. 优化服务器名称与 IP 地址的显示。
  8. Telnet 会话支持将日志保存到文件。
  9. 修复显卡信息检测失败的问题。
  10. 修复 Scrollback 行数设置不生效的问题。
  11. 优化运行流畅度及大量日志场景下的性能。
  12. 完善多语言翻译与界面文案。
  13. 串口调试支持切换 UTF-8、GBK 编码，减少乱码。
  14. 修复未开启系统监控时无法使用文件管理的问题。
  15. Docker 管理中新增主机切换功能。
  16. 重启应用后恢复上次的窗口大小。
  17. 修复新建主机时编码设置无法持久化的问题，并支持在终端中直接切换编码。
  18. 修复部分路由器在 3.1.58 版本中通过 SSH 连接后立即断开的问题。
  19. 修复浅色主题下切换窗口后字体变细的问题。
  20. 修复开启系统监控面板后，密码认证成功却立即断开连接的问题。
  21. 支持为不同分组分别设置标签。
