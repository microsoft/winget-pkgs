ShortDescription: Delete folders with hundreds of thousands of files in seconds instead of minutes
Description: |-
  Turbo Delete is a fast alternative to deleting with Windows Explorer, made for folders with many small
  files like node_modules, build output, old IDE caches or %TEMP%. It deletes files in parallel and does
  not use the recycle bin.

  - Adds "Turbo Delete" to the Explorer context menu of folders and files. A selection of several items
    is deleted after a single confirmation.
  - Command line: turbo-delete [--contents] [--confirm] <path>...
  - Junctions and symlinks are removed as links, their targets are never touched.
  - Files in use are skipped and reported, drive roots are refused.
  - Installs per user, no admin rights needed.
