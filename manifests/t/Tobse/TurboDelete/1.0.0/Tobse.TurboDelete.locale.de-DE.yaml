PackageIdentifier: Tobse.TurboDelete
PackageVersion: 1.0.0
PackageLocale: de-DE
Publisher: Tobse
PackageName: Turbo Delete
License: Apache-2.0
ShortDescription: Löscht Ordner mit Hunderttausenden Dateien in Sekunden statt Minuten
Description: |-
  Turbo Delete ist eine schnelle Alternative zum Löschen mit dem Windows Explorer, gemacht für Ordner mit
  vielen kleinen Dateien wie node_modules, Build-Ausgaben, alte IDE-Caches oder %TEMP%. Dateien werden
  parallel gelöscht, nicht in den Papierkorb.

  - Fügt „Turbo Delete“ zum Explorer-Kontextmenü von Ordnern und Dateien hinzu. Mehrere markierte
    Elemente werden nach einer einzigen Rückfrage gelöscht.
  - Kommandozeile: turbo-delete [--contents] [--confirm] <Pfad>...
  - Junctions und Symlinks werden als Verknüpfung entfernt, ihr Ziel bleibt unangetastet.
  - Dateien in Benutzung werden übersprungen und gemeldet, Laufwerkswurzeln werden verweigert.
  - Installation pro Benutzer, ohne Admin-Rechte.
InstallationNotes: |-
  Der Eintrag „Turbo Delete“ steht im klassischen Kontextmenü von Ordnern und Dateien
  (Windows 11: „Weitere Optionen anzeigen“ oder Umschalt+F10). Für turbo-delete ein neues Terminal öffnen.
