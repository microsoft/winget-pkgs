ReleaseNotes: "## tldraw offline v1.21.0\n\nThis release makes files full of large photos much faster to work with, keeps editing smooth while file previews render, and helps agents catch their own layout mistakes.\n\n## What’s New?\n\n### Faster files with large photos\n\nImage files sensibly resize to smaller copies when relevant  to help maintain performance. The copies are made in the background the first time an image is seen. Until a copy is ready you see the original, exactly as before, so nothing is ever slower to appear. The original stays in the file, and exports and copy-as-image still use it.\n\nOn a shared file, guests now load these smaller copies from the host instead of downloading each multi-MB original. The host starts making them as soon as an image is added, so most are ready before anyone opens it. The copies are cached on disk (up to 500 MB) and the oldest are cleared out automatically.\n\n### Preview thumbnails render separately while editing\n\nFile thumbnails now render in a separate hidden window, not the one you're editing. They also wait until you've stopped using the app for a few seconds, and stop as soon as you start again. Editing a large file no longer freezes while its thumbnail updates. A preview is only redrawn when the file has actually changed, so opening a file doesn't trigger a new render. \n\n## Improvements\n\n• Agents are now told when a shape fails to render. Agents notice a broken shape instead of saying they are finished.\n• Agents catch text sitting across a panel's border, and shapes sticking out of the frame they belong to.\n• Agents place shapes inside a frame using the frame's own coordinates, so cards no longer land outside their column and get cut off.\n• A file script that fails to import now shows as an error in its status, instead of reading as applied while the file is broken.\n\n## Bug Fixes\n\n• Fix a script written just after its workspace opens sometimes never running on Windows."
