ShortDescription: A local whiteboard for you and your agents.
ReleaseNotes: "This release improves multiplayer boards：better security via window isolation, minimized windows keep syncing, and a few fixes to copy/paste, embedded media, and app version mismatches.\r\n  \r\n  ## Improvements\r\n  \r\n  • Minimized and hidden windows keep syncing and saving, so a shared board doesn't pause when its window goes to the background.\r\n  • Joining a board shared from a different app version now says which side needs to update, instead of a generic error.\r\n  • Boards from other people are safer to open：each window's content is isolated from the rest of your machine.\r\n  • Weekly upgrade of the tldraw SDK, keeping the editor in step with [tldraw.com](http://tldraw.com/).\r\n  \r\n  ## Bug Fixes\r\n  \r\n  • Fix editor windows sometimes opening blank when launching the app or opening several files at once.\r\n  • Fix pasted videos not playing for everyone in a shared board, including for the person who pasted them.\r\n  • Fix images pasted as PNG coming back at the wrong size.\r\n  • Fix image exports showing a broken-image icon in place of embedded images.\r\n  • Fix edits to a file reopened right after closing it not saving reliably.\r\n  • Fix the missing hover highlight in the people menu on shared boards."
ReleaseNotesUrl: https://github.com/tldraw/tldraw-offline/releases/tag/v1.14.0
