ShortDescription: A local whiteboard for you and your agents.
ReleaseNotes: "## tldraw offline v1.19.1\r\n\r\nThis release brings commenting to tldraw offline and improves how agents work on the canvas\r\n    \r\n## What’s New?\r\n    \r\n### Comments\r\n\r\nEvery file now supports comments, the same commenting you know from [tldraw.com](http://tldraw.com/). Pick the comment tool from the toolbar (or press c) to add a comment and then reply and resolve threads as you work A new “comments” button in the top right corner opens a sidebar with every comment thread in the file. Comments are saved in the file itself, so they come back when you reopen it, and sync to everyone on a shared file.\r\n\r\nComments aren’t just for humans - agents can take part too. \r\n    \r\n## Improvements    \r\n• Agents now build buttons as locked controls, so the first click runs the action instead of selecting the shape.\r\n• Agents arrange shapes using the editor's own align, stack, and distribute commands  to make edits more stable.\r\n• Agents measure a shape's edges from its real geometry instead of guessing"
