ShortDescription: A local whiteboard for you and your agents.
ReleaseNotes: "This release lets document scripts better handle ephemeral changes, improves script behavior on shared files, and streamlined app updates.\r\n\r\n## What's New?\r\n\r\n### Animations don't block saving\r\n\r\nDocument scripts can now create short term changes that don’t impact the file state and get you caught in a permanent saving loop. The previous save behavior for shapes continue to exist is unchanged.\r\n\r\n### Faster rejoins on shared files\r\n\r\nJoining a shared file used to re-download its whole script bundle every time. The app now keeps the script files it already has — only files whose contents changed are downloaded again — and what it keeps survives quitting and reopening the app, so rejoining a file you've visited before gets you to the canvas sooner.\r\n\r\n### Improvements\r\n\r\n• The app checks for updates about every four hours while it stays open, not only when you open it.\r\n• Updates now download only the parts that changed instead of the full ~150 MB payload.\r\n• Cleaned up the loading screen while you were connecting to a shared file to make it more obvious that you were actively connecting.\r\n\r\nBug Fixes\r\n\r\n• Fixed a bug where closing the last visible window could leave the app running with no window at all. Now it brings the welcome screen back.\r\n• Cancelling a join while the file was opening no longer occasionally opens the file anyways."
ReleaseNotesUrl: https://github.com/tldraw/tldraw-offline/releases/tag/v1.15.0
