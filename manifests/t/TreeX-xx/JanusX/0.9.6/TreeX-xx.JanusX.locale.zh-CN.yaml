ReleaseNotes: |-
  本次更新完善工作区数据管理，新增 CPA 与 Docker 可选插件，并优化插件设置和桌面通知体验。
  更新亮点
  - 集中管理工作区数据：配置与运行日志保存到应用数据目录，支持旧数据迁移、工作区重新定位和失联数据恢复。
  - 按需安装官方插件：CPA 改为可选插件，新增实验性的 Docker 管理插件，支持本机、已有 WSL 和专用 WSL2 环境。
  - 更清晰的插件管理：增加搜索、卡片浏览与折叠详情，集中展示常用操作。
  体验优化
  - 数据管理按用途分组，迁移前可查看来源、目标与处理范围，支持批量迁移符合条件的工作区。
  - 解除最后一个工作区关联后，私有数据保留 30 天恢复期；未知文件保留。
  - CLI 使用独立启动 Hook，提供旧 Hook 的预览与主动清理。
  - 桌面通知同步主题，改善连续替换与重新显示时的稳定性。
  问题修复
  - 修复弹窗显示时可能打断输入焦点的问题。
  - 修复连续通知替换时可能显示旧内容的问题。
  - 改善 Docker WSL 启动窗口与代理转发。
  升级须知
  - 旧工作区通过升级提示或「设置 → 数据管理」主动迁移。迁移处理应用配置与日志，不迁移项目源码、工程 Notes 或构建产物。
  - 自动还原点已移除。 主动迁移会清理旧还原点及已迁入应用目录的副本，需要保留的内容请提前备份。当前 Island 文件差异查看保留。
  - 移除 Laya、旧产物工作区、旧知识库界面与调用、旧 Wiki、知识卡片及旧任务执行界面；个人记忆、当前文件预览与任务执行后端继续保留。
  - Blueprint 配套版本仍为 1.0.8。CPA 与 Docker 是可选插件，安装应用不会自动安装这些插件；实际可用包以插件目录为准。
  - Windows 主程序未进行 Authenticode 签名。
  已知限制
  - Docker 管理仍为实验功能，真实引擎兼容性和插件完整分发验收尚未全部完成。
  - 工作区迁移暂不支持远程工作区；正式安装器跨版本升级、物理慢盘与长期使用仍需进一步验证。
  查看完整变更
