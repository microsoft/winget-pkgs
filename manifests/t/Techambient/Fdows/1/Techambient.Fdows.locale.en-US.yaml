ReleaseNotes: |-
  Initial Release (Version 1)

  Steps to use
  - Download the f-dows_v1.exe below.
  - Place f-dows_v1.exe that you have downloaded to somewhere highly reachable (eg. Desktop)
  - Run the f-dows_v1.exe and it will launch the store.
  Note: This is a standalone and portable EXE, meaning no setup is required, just double click to use!!

  Full List of Supported Systems
  - Windows 11 (Full Apps Support)
  - Windows 10 (Limited Apps Support)
  - Windows 8 / 8.1 (Limited Apps Support)
  - Windows 7 (Limited Apps Support)
  - Windows Vista (Store preview only)
  - Windows XP (Store preview only)
  - Windows Me / 2000 (Store preview only)
  - Windows 98 (Store preview only)
  - Windows 95 (Store preview only)
