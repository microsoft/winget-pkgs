ShortDescription: A free, open-source desktop Git client that runs coding agents side by side.
Description: |-
  GitDesk is a desktop Git client built on the git you already have.
  It shows every repository on one page, with a commit graph, line-by-line staging, conflict resolution, interactive rebase and Undo.
  It runs coding agents such as Claude Code, Codex or Gemini CLI side by side, each in its own worktree and branch.
  No account and no telemetry.
