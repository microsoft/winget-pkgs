ShortDescription: Real-time effects for your microphone on Windows.
Description: |-
  Build a chain of effects, hear what each one does, and every app that uses your mic gets the processed sound.
  Includes dynamics (gate, expander, compressor, de-esser, auto-gain, maximizer, limiter), tone (filters, a parametric EQ over a live spectrum, exciter, bass enhancer, convolver) and fun effects (pitch shift, harmonizer, autotune, reverb, delay, bit crusher).
  In direct mode the effects run inside the Windows audio engine on the microphone itself, so there is nothing to reconfigure in other apps.
  Presets can be imported from EasyEffects, Equalizer APO and AutoEQ. No account, no telemetry, no update checks.
