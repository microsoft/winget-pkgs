ShortDescription: Your game library, backlog and a gaming journal that fills itself while you play.
Description: |-
  LastSave is a free Windows app for PC gamers. It brings every game you own into one library and launcher (Steam, Epic Games, GOG, Xbox, installed games and emulators), keeps your backlog on a board, and logs your sessions on its own while you play, with screenshots, clips and notes saved from an in-game overlay.
  Your library is stored on your own PC, and the app updates itself.
