ReleaseNotes: |-
  Features
  - backup: 新增同步文件夹备份位置，支持 iCloud、OneDrive、Dropbox 等 (68941ec)
  - macos: 支持从 Finder 打开文件夹到本地终端 (22e62eb)
  - terminal: 支持通过路径参数在指定目录打开本地终端 (174e7ce)
  - files: 可设置默认下载目录，双窗格本地侧从下载目录开始 (129fdba)
  - terminal: 新增清屏快捷键与本地清屏 (8250874)
  Bug Fixes
  - terminal: 指定目录打开本地终端时遵守应用锁，重启不再重复打开 (a313f4e)
  - sidebar: 重新打开后保持分组上次的展开或收起状态 (ef7c874)
  - shortcuts: Windows 上终端里按录制的 Alt+数字切换标签不再响提示音 (ac71ec6)
  Style
  - website: 优化顶部导航栏与内容背景融合及滚动半模糊效果 (2c12fd3)
