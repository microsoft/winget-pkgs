ReleaseNotes: |-
  Features
  - mcp: 复制访问令牌时标记为机密剪贴板内容 (4bb5678)
  - rail: 支持自定义右侧栏显示的工具 (fa79361)
  - monitor: 显示登录会话、GPU 进程与系统版本 (b820efb)
  - terminal: 支持命令行内建议与路径补全列表 (0e938a0)
  - files: 支持在服务器之间直接复制文件与文件夹 (d546ceb)
  - session: 网络变化后立即重连并回到原文件夹，传输时保持唤醒 (aec96e4)
  - tabs: 支持按序号切换、中键关闭、标签颜色与标题来源 (dcdac49)
