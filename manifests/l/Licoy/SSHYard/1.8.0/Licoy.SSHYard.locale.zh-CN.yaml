PackageIdentifier: Licoy.SSHYard
PackageVersion: 1.8.0
PackageLocale: zh-CN
PackageUrl: https://sshyard.com/zh-hans/
ShortDescription: 内置 AI 助手的原生 SSH 与 SFTP 客户端。
Description: SSHYard 是一款免费开源的原生 SSH 与 SFTP 客户端，支持 macOS、Windows 与 Linux。它不依赖 WebView 而自行绘制界面，把分屏终端、远程文件管理、内置 AI 智能体、主机密钥管理与连接审计整合在一起。安装面向当前用户执行，无需管理员权限。
