ReleaseNotes: |-
  Features
  - rdp: 远程桌面以窗格打开在标签页中 (47eba7c)
  - rdp: 接通桌面会话、输入和自动重连 (7fd3ffe)
  - rdp: 协商图形能力并支持动态通道和剪贴板 (2583057)
  - rdp: 实现远程桌面授权交换 (230493f)
  - rdp: 实现加密握手、通道连接和证书信任 (74cfee3)
  - rdp: 添加位图、指针与输入编解码 (c5e0019)
  - hosts: 保存和验证远程桌面主机配置 (630810d)
  - rdp: 添加远程桌面键位映射 (fd2556e)
  - hosts: 密钥登录可附加保存的密码，支持要求密钥+密码的服务器 (f6cf91e)
  - workspace: 分屏的窗格可拆回独立标签页 (2ddfae3)
  - files: 远程文件可用外部编辑器编辑，保存后自动上传 (#99) (9ea2284)
  - terminal: 新增断线快速重连快捷键并在状态条提供保存输出 (#98) (d3a70d2)
  - workspace: 支持多窗口，标签页与窗格可移到新窗口或拖出成窗 (ee21d92)
  Bug Fixes
  - rdp: 远程桌面窗格无按键的文本照常输入，连接数计入桌面 (c4bb87a)
  - rdp: 兼容 xrdp 的登录标志、授权告警、压缩标志和剪贴板填充 (d8e5270)
  - shortcuts: macOS 菜单栏不再截走 ⌘R 重连与 ⌘=/⌘-/⌘0 缩放 (3dbef91)
  Performance
  - terminal: 降低每帧构建开销，缓解主机较多时打字卡顿 (#97) (b8bbca1)
  Documentation
  - 说明支持 RDP 远程桌面 (73b0c3e)
  Tests
  - rdp: 覆盖 xrdp 互通修复，修正重连测试收尾的竞态 (ff198e2)
  - hosts: 验证远程桌面密码复用加密存储 (c97315e)
  - files: 外部打开测试按本地副本查找编辑会话 (c37833b)
  - menu: 菜单栏快捷键测试仅在 macOS 运行 (205d848)
  - terminal: 修复重连测试在 Windows 上未释放凭据存储锁 (36b9199)
  Chores
