ShortDescription: Command Code subscription reverse proxy with OpenAI/Anthropic-compatible endpoints.
Description: CommandCodeGo Manager is a desktop app that reverse-proxies a Command Code subscription into OpenAI-compatible (/v1/chat/completions, /v1/responses) and Anthropic-compatible (/v1/messages) endpoints for any harness or SDK. It includes a Chinese web administration interface with a dashboard, live request logs, usage statistics, model lists, key management, device fingerprint inspection, and settings. The service keeps running in the background with a tray icon after the window closes.
