PackageIdentifier: learningdog1.CommandCodeGoManager
PackageVersion: 0.2.16
PackageLocale: zh-CN
ShortDescription: Command Code 订阅反向代理，提供 OpenAI/Anthropic 兼容端点。
Description: CommandCodeGo Manager 是一款桌面应用，把 Command Code 订阅额度反代为 OpenAI 兼容（/v1/chat/completions、/v1/responses）与 Anthropic 兼容（/v1/messages）端点，供任意 harness 和 SDK 使用。自带中文 Web 管理界面（仪表盘、实时日志、用量统计、模型列表、密钥管理、设备指纹、设置）。关闭窗口后服务在后台继续运行（托盘常驻）。
Tags:
