ShortDescription: Mirror an iPhone or iPad to Windows over AirPlay, then record or restream it. No capture card, no cable, and no app to install on the phone.
Description: |-
  AirMirror Pro is an AirPlay receiver for Windows. An iPhone or iPad mirrors to your PC over the
  local network using the AirPlay support already built into iOS, so there is nothing to install on
  the phone and no capture card or cable is involved.

  The PC decodes in hardware and shows live frame rate, latency and dropped-frame counts in the
  status bar, so you can tell at a glance whether a problem is the PC, the network or the phone.
  Recording and screenshot capture are built in, and a Clean Window mode presents the video with no
  surrounding interface for capturing into OBS without cropping.

  Free to use: mirroring is never timed, and free recordings stop at five minutes and carry a
  watermark. A licence removes both. The AirPlay engine runs in a separate process and its source
  is available under GPLv3.

  Not affiliated with Apple Inc. AirPlay is a trademark of Apple Inc.
