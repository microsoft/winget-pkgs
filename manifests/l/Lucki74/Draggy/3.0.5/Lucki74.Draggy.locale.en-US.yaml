ShortDescription: Free, open source AI assistant and coding agent for Windows. Runs local models, no account needed.
Description: |-
  Draggy is a desktop AI assistant and coding agent for Windows. You can run models on your own PC or connect it to a cloud provider with your own key. It needs no account and has no subscription.
  In Code mode, Draggy works inside a project folder. Each file change shows up as a diff you can undo, and tools run under one of four permission modes.
  It comes with a catalogue of MCP servers you switch on from Settings, and can connect to remote MCP servers over HTTP with OAuth.
