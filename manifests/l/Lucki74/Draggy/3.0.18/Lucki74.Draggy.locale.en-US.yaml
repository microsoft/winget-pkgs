ShortDescription: A free, open source AI assistant and coding agent that runs local models without an account.
Description: |-
  Draggy is a desktop app that chats, browses the web and works in your project folders. Open models run on your own computer through an embedded llama.cpp engine, and you can also connect external runtimes or cloud APIs.
  The coding agent reads, edits and runs commands in a project folder. It shows every change as a diff you can undo and works under one of five permission modes.
  Draggy has no account and no telemetry.
