ReleaseNotes: |-
  uxplay-windows has completly been rewritten from scratch! It's now a fully featured app that uses uxplay as a library
  New features and changes:
  - Bonjour Print Service for Windows is no longer required! mDNSResponder is now compiled and used instead.*
  - AirPlay Buetooth Discovery, which should make find and pair your device easier (thanks to upstream work done by UxPlay developers)
  - New Qt6 GUI
  - Select which Direct3D Renderer to use (D12 or D11, automatic by deafult)
  - Force Fullscreen (must select a renderer)
  - UNTESTED arm64 support (i have made a github action to build it, and seems to work but i have no arm64 device to test the software with) (#15)
  - Portable releases (mDNSResponder still needs to install Bonjour Service, which requires Administrator permissions) (#24)
  - Blue icon (#23)
  - Video stream window gets renamed (#10)
  issues with libraries should mostly be fixed hopefully, i've tested uxplay-windows on both intel and amd graphics, a̶n̶d̶ ̶s̶o̶o̶n̶ ̶i̶'̶l̶l̶ ̶a̶l̶s̶o̶ ̶t̶e̶s̶t̶ ̶n̶v̶i̶d̶i̶a̶ nvidia works too
  Thanks for using uxplay-windows! If you have any problem running my software please open an issue and i'll try to work on it whenever i have the time to ❤️
  *If you already installed BPSfW, you can still use that but I'd recommend to just remove it and use the one that uxplay-windows ships with. Apple's Bonjour is 15yo software!
