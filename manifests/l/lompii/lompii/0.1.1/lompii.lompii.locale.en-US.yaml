ShortDescription: A private visual library for everything that inspires you. Save from anywhere, find it by describing it.
Description: |-
  lompii is a desktop app that remembers what inspires you. Save images, page captures, quotes and snippets from your browser with one right-click.
  Each save gets a title, summary, tags and colour palette automatically. Later, type what you remember and lompii finds it by how it looks and what it means.
  No account and no lompii server: your library and its search stay on your computer. Bring your own AI key or run fully offline with Ollama or LM Studio.
