ReleaseNotes: |-
  Bewertung und Folgenstand erreichen die Shelf jetzt tatsächlich — und die
  Synchronisation sagt endlich, was sie überträgt.
  Neu
  - Das verbundene Konto steht in den Einstellungen. Bisher zeigte die App nirgends, mit welchem Konto sie bei der Shelf angemeldet ist. Das fällt erst auf, wenn es das falsche ist: Bewertungen kommen dann zwar an, tauchen in der Shelf aber nicht auf, weil dort nach dem angemeldeten Nutzer gefiltert wird. Unter Verbindung stehen jetzt Name, E-Mail und Kennung, dazu ein Knopf zum erneuten Prüfen. Läuft die Anmeldung ab, steht das im Klartext da (#116).
  - Die Installation lässt sich freiwillig mitzählen. Ein Schalter unter Updates, standardmäßig aus. Eingeschaltet fährt bei der ohnehin stattfindenden Versionsabfrage eine zufällige Kennung und die installierte Version mit — an movieshelf.info, nicht an deine Shelf, ohne Bezug zu deinem Konto und ohne IP-Adresse. Beim ersten Start wird einmal gefragt, mit "Nein" als Vorauswahl (#118).
  Behoben
  - Die Vorschau verschwieg, was zur Shelf geht. Unter "Desktop → Shelf" stand nur der Titel, ohne ein Wort dazu, was sich ändert — der Absatz mit den geänderten Feldern fehlte in dieser Liste, während die Gegenrichtung ihn längst hatte (#117).
  - Offene Bewertungen galten als "keine Änderungen". Bewertung und Folgenstand hängen bewusst nicht am Zeitstempel des Films, sonst löste jeder Sternklick eine vollständige Übertragung aus. Dadurch fielen sie aus der Zählung: die Seite meldete "Aktuell", obwohl etwas anstand. Beide erscheinen jetzt in der Vorschau, Folgen je Serie zusammengefasst (#117).
  - Fehlermeldungen zu Folgen nannten eine Datenbank-Kennung. Statt "Folge 4711" steht dort jetzt die Serie mit dem Folgentitel (#117).
  Intern
  - Die winget-Einreichung trägt die Release-Notizen je Sprache nach. komac kennt dafür keinen Schalter und schreibt sie nur ins Standard-Locale, das seit 1.0.0 englisch ist — ohne diesen Schritt stünde deutscher Text in der englischen Manifest-Datei. Feature-Releases brauchen dafür ab jetzt einen Abschnitt in CHANGELOG.en.md (#115).
  Hinweis: Bewertung und Folgenstand setzen die Shelf ab 2.41.2 voraus. Bis
  dahin schlug das Übertragen fehl beziehungsweise kam beim Abgleich nie an.
