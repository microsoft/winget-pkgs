Description: MovieShelf Desktop verwaltet deine Film- und Seriensammlung lokal, reichert sie mit Metadaten an, zeigt sie in Poster-, Listen- und Tabellenansicht und synchronisiert sie mit deinem MovieShelf-Konto.
