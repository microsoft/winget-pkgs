ShortDescription: Validate SEPA / ISO 20022 payment and bank statement XML files against the XSD schemas, plus plausibility checks.
Description: |-
  SEPA Validator checks SEPA payment files (pain.001, pain.008, pain.002, pain.007) and bank statements (camt.052, camt.053, camt.054) against the ISO 20022, German DK and Swiss SPS XSD schemas you import, and adds plausibility checks the schema cannot express: control sums, IBAN check digits, past dates, duplicate EndToEndIds and statement balances.
  It shows a live, filterable validation log with a formatted XML viewer, an overview and transaction list with CSV export, and can generate synthetic camt.053 statements from a payment file. Everything runs locally; no file leaves your machine. The XSD schemas are not bundled and must be imported once.
