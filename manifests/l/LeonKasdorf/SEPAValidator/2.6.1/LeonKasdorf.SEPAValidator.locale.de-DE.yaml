# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: LeonKasdorf.SEPAValidator
PackageVersion: 2.6.1
PackageLocale: de-DE
Publisher: Leon Kasdorf
PackageName: SEPA Validator
License: MIT
ShortDescription: SEPA-Zahlungsdateien und Kontoauszüge (ISO 20022 XML) gegen die XSD-Schemas prüfen, mit zusätzlichen Plausibilitätsprüfungen.
Description: |-
  SEPA Validator prüft Überweisungen und Lastschriften (pain.001, pain.008) sowie Kontoauszüge (camt.052, camt.053, camt.054) gegen die XSD-Schemas von ISO 20022, Deutscher Kreditwirtschaft und Swiss Payment Standards. Zusätzlich findet er Fehler, die das Schema nicht erkennt: Kontrollsummen, IBAN-Prüfziffern, Datum in der Vergangenheit, doppelte EndToEndIds und Salden von Kontoauszügen.
  Alles läuft lokal, keine Datei verlässt den Rechner. Die XSD-Schemas werden nicht mitgeliefert und einmalig importiert. Die Oberfläche ist englisch.
Tags:
- bank
- kontoauszug
- lastschrift
- sepa
- ueberweisung
- xml
ManifestType: locale
