ShortDescription: 一款 AI 增强的桌面应用，带来更紧凑、更专注的浏览循环。更少混乱，更多流畅。
Description: |-
  Noi 以交互优先的工作流刷新带来更紧凑、更专注的浏览循环。支持多窗口管理，让并行工作区并排运行；会话隔离让上下文保持干净、分离、可预期；本地优先的数据让历史记录、提示词和设置都留在设备上。
  Noi 内置 AI 对话提示词管理，便于组织、复用和迭代工作流；内置终端可快速执行本地命令、脚本和工具；noi CLI 命令可从 Claude Code、Codex、Gemini CLI 等工具控制 Noi；并提供多种主题与视觉风格，适配不同的使用习惯。
