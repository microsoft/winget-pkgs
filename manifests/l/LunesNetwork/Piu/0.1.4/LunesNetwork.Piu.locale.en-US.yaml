ShortDescription: Peer-to-peer encrypted messenger that works without the internet, with a built-in LUNES wallet.
Description: |-
  Piu is a messenger where messages travel from device to device, end-to-end encrypted, with no central server and no need for the internet.
  Piu Desktop joins the Piu mesh over the local network (LNNP) and keeps encrypted envelopes in a store-and-forward queue until they reach their destination.
  It also includes a LUNES wallet. Free and open source (AGPL-3.0).
