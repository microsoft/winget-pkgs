ShortDescription: Spot ghost jobs before you waste time applying. A private, local app that scores job postings and shows you why.
Description: 'Envoy is a local Windows desktop app for job seekers. It scores how likely a job posting is a waste of your time (a ghost job) and shows the evidence behind every score. It keeps a scoreboard of your hunt: ghosts dodged, hours saved, your streak, and your application-to-response rate. It also includes a human-gated apply copilot that tailors your resume and fills application forms while you review and submit, and a job search that reads public ATS feeds. Everything runs on your machine and your data stays there.'
