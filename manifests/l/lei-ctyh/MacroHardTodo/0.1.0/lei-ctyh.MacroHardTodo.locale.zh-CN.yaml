ReleaseNotes: |-
  首个公开版本发布。
  Added
  - 核心任务管理：自定义列表、列表分组与拖拽排序、固定默认「任务」清单、子步骤（支持勾选进度与「提升为任务」）、截止日期/时间、系统通知提醒、重要星标、重复规则（含工作日/自定义/逾期一键跳转当前周期）、标签、本地附件与备注。
  - 智能视图：我的一天（含欢迎卡片与右侧可开合「建议」面板）、重要、计划内（按已逾期 / 今天 / 明天 / 接下来 5 天 / 以后分组）、全部（按列表分组）、已完成（独立归档与恢复）。
  - 高频交互：任务右键菜单（含移动到列表自适应子菜单与快捷键 Ctrl+T / Ctrl+D / Delete）、列表右键菜单、全局搜索、底部快速添加栏、系统托盘与全局快捷键 Ctrl+Alt+T。
  - 主题与暗色模式：浅色 / 深色 / 跟随系统三种模式；14 套 CC0 高清实景摄影壁纸 + 14 套纯色主题 + 本地自定义图片；暗色模式下纯色主题自动转为深灰底 + 主题前景强调色，壁纸主题采用深灰半透明磨砂胶囊与中性强调色。
  - 独立设置中心：个人资料（自定义昵称/副标题/头像）、常规偏好（新任务位置、星标置顶、完成提示音、删除确认、每周起始日、智能列表显隐与自动隐藏空列表、今天到期自动进我的一天）、开机自启、关闭最小化到托盘、自动清理已完成任务。
  - 数据主权与同步迁移：本地自动保存、最近 21 天每日备份、JSON / CSV 导入导出；WebDAV 多端同步（坚果云 / Nextcloud / 群晖预设、时间戳合并、墓碑删除、可选 AES-256-GCM 端到端加密）；Microsoft To Do 一键迁移向导（Microsoft Graph 设备码登录）。
  - 工程与发版流水线：GitHub Actions CI（前端类型检查/单测/构建 + 三平台 Rust 检查）与多平台 Release CD（Windows NSIS 中文安装向导 & 便携 zip、macOS arm64/x64 DMG、Linux AppImage/DEB、SHA256 校验），新增 npm run bump 一键版本号同步脚本。
