ShortDescription: Universal Multi-Cloud Object Storage Manager for AWS S3, Google Cloud Storage, and S3-compatible services.
Description: |-
  UniBucket is a cross-platform desktop application for managing AWS S3, Google Cloud Storage, Cloudflare R2, MinIO, Backblaze B2, DigitalOcean Spaces, and other S3-compatible object storage services from one unified interface.
  Features include visual grid/list browsing, built-in previewers (images, PDFs, Word, Excel, Markdown, and code), an integrated Monaco code editor, batch metadata editing, and background transfer management with local-first credential encryption.
  Includes a 30-day free trial.
