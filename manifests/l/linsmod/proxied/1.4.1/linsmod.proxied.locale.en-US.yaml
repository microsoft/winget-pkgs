ShortDescription: A system tray application to sync Windows proxy settings to development tools
Description: >-
  proxied is a system tray application that allows you to control system-level proxy settings directly from the taskbar and syncs them to development tools. It enables/disables Windows system proxy with real-time Windows settings sync via registry monitoring, supports proxy groups for quick switching, and syncs proxy settings to Git (Windows), Gradle, WSL Git, and environment variables. The application also supports optional startup with Windows.
