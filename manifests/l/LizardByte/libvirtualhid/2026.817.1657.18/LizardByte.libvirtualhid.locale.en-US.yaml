ShortDescription: Cross-platform C++ virtual HID library.
Description: |-
  libvirtualhid provides a platform-neutral C++ API for creating virtual input devices. The primary target is gamepad
  input for remote streaming hosts and other low-latency applications, with keyboard, mouse, touchscreen, trackpad, and
  pen tablet support available where the platform backend supports those device types.

  Consumers work with portable concepts such as runtimes, device profiles, normalized gamepad state, output callbacks,
  and device nodes. Platform-specific details such as Linux uhid/uinput or the Windows UMDF/VHF driver package stay
  behind backend implementations.
