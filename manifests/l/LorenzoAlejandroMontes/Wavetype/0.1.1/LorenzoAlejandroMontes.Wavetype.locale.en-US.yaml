ShortDescription: Press a hotkey, talk, and clean, punctuated text lands in whatever app you are typing in.
Description: |-
  Wavetype turns speech into finished text in any Windows app. Press Win+Ctrl, talk, and press it again: filler words are removed, punctuation and lists are added, and the text is pasted into the field you were typing in, whether that is an editor, a browser, Slack or a terminal.
  While you speak, a card next to the caret shows the words as they are recognized.
  Select text and press the same hotkey to rewrite it by voice: make it shorter, turn it into a list, translate it.
  Dictation works in English, Italian and Spanish, with automatic language detection.
  Speech recognition and clean-up run on Groq with your own API key, which is free to create; the first launch walks you through getting one. On first launch Wavetype also downloads a speech model of about 475 MB for the live preview.
