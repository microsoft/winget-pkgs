ShortDescription: Fast native download manager for Windows with yt-dlp support.
Description: |-
  OpenDM is a native download manager for Windows built with Rust and Tauri.
  It downloads direct and HLS streams with parallel segments and resumable
  parts, handles YouTube through its bundled yt-dlp tooling (downloaded at
  first use), lives in the tray, and can receive links from a browser
  extension via native messaging.
Moniker: opendm
Tags:
- download-manager
- yt-dlp
- youtube
- hls
- tauri
ReleaseNotes: |-
  - Windows Job Object tree-kill: pause/delete reliably stops yt-dlp (bootloader + worker)
  - Tray Exit stops all running downloads and background jobs before exit
  - Compact view for the downloads list (persisted preference)
  - Fragment (.part/.ytdl) cleanup on job removal
  - --no-playlist for YouTube downloads; light theme fix
