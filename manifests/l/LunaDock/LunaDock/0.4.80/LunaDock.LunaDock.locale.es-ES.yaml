ReleaseNotes: |-
  - La isla, como en el iPhone: Elige su forma en Ajustes › Isla dinámica: el notch de siempre o una isla flotante, una cápsula separada del borde con todas las esquinas redondeadas.
  - Volumen en la isla: Al abrir la isla con música, debajo de los controles hay una barra de volumen: arrástrala o púlsala, y el altavoz pequeño silencia.
  - Sin música, la isla en calma: Si no suena nada, la isla se queda negra del todo, sin el cuadrado pequeño que a veces se quedaba, y al abrirla dice solo «Nada sonando».
