ReleaseNotes: |-
  - Launchpad: All your apps full screen, in pages, over the frosted desktop. Type to filter; scroll or arrows to change page. From the ☾ menu, search, a hot corner or a shortcut.
  - Record your screen: Ctrl+Shift+5: pick an area, a window or the whole screen and it records to MP4. The island shows the time and a stop button; the video is saved to Videos › Captures.
  - Minimized windows in the dock: Like on macOS: when you minimize, the window’s thumbnail appears next to the Trash with its app icon. One click puts it back.
  - Focus modes: Work, Gaming and Sleep: they silence notifications (except the apps you allow) and can hide the dock. Manually from Control Center or the bar, on a schedule, or automatically while gaming.
  - Quick Look: Select a file in File Explorer or on the desktop and press Space: images, videos, PDFs, text and code without opening them. The arrows switch files.
  - Your monitors’ brightness: Control Center now changes the brightness of desktop monitors (via DDC/CI), one by one and by name.
  - Microphone and camera in use: An orange (microphone) or green (camera) dot in the bar while an app uses them, plus a notice in the island when it starts. Hover to see which app.
  - Search finds more: Files on your PC (with the Windows index), emoji and symbols in color (“heart”, “arrow”, “euro”) and colors (“#1e90ff”). Shift+Enter on a file shows it with Quick Look.
  - Color picker: Copy the color of any point on screen with a magnifier: click for the hex code, Shift+click for rgb().
  - Keep on top: Window › Keep on top keeps any window always visible, like a video or a calculator.
  - Your devices’ battery: New widget with the battery of your Bluetooth mouse, keyboard, headphones or phone.
  - Where is my key?: If the purchase email doesn’t arrive, your two keys are always in your Polar portal: Settings › License › Open portal.
