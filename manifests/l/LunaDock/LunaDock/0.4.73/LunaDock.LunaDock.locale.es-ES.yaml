ReleaseNotes: |-
  - Launchpad: Todas tus apps a pantalla completa, por páginas, sobre el escritorio esmerilado. Escribe para filtrar; rueda o flechas para pasar de página. Desde el menú ☾, la búsqueda, una esquina activa o un atajo.
  - Graba la pantalla: Ctrl+Mayús+5: elige una zona, una ventana o la pantalla entera y se graba en MP4. La isla enseña el tiempo y un botón para parar; el vídeo se guarda en Vídeos › Capturas.
  - Ventanas minimizadas en el dock: Como en macOS: al minimizar, la miniatura de la ventana aparece junto a la papelera con el icono de su app. Un clic la devuelve a su sitio.
  - Modos de concentración: Trabajo, Juego y Dormir: silencian los avisos (salvo las apps que permitas) y pueden esconder el dock. A mano desde el Centro de control o la barra, por horario o solos al jugar.
  - Vista rápida: Elige un archivo en el Explorador o el escritorio y pulsa Espacio: imágenes, vídeos, PDF, texto y código sin abrirlos. Las flechas cambian de archivo.
  - Brillo de tus monitores: El Centro de control ya cambia el brillo de los monitores de un sobremesa (por DDC/CI), uno por uno y con su nombre.
  - Micrófono y cámara en uso: Un punto naranja (micrófono) o verde (cámara) en la barra mientras una app los usa, y un aviso en la isla al empezar. Al pasar el ratón, qué app es.
  - La búsqueda encuentra más: Archivos de tu equipo (con el índice de Windows), emojis y símbolos en color («corazón», «flecha», «euro») y colores («#1e90ff»). Mayús+Intro sobre un archivo lo enseña con la vista rápida.
  - Cuentagotas: Copia el color de cualquier punto de la pantalla con una lupa: clic para el código hexadecimal, Mayús+clic para rgb().
  - Mantener encima: Ventana › Mantener encima deja cualquier ventana siempre visible, como un vídeo o una calculadora.
  - Batería de tus aparatos: Widget nuevo con la batería del ratón, el teclado, los auriculares o el móvil Bluetooth.
  - ¿Dónde está mi clave?: Si no te llega el correo de la compra, tus dos claves están siempre en tu portal de Polar: Ajustes › Licencia › Abrir portal.
