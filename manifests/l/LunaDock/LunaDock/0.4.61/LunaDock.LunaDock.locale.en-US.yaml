ReleaseNotes: |-
  - Color themes: nine themes that tint the Dock, the menu bar and the menus and change the accent color, plus your own accent, tint, edges, shine and Dock rounding.
  - A real moon: the moon in the start animation is now a smooth crescent with soft tips and a bit of depth, also on the menu bar button.
  - Comet trails: the star and the moon leave thin, curved, tapering trails, and the arrival at the menu bar logo is a softer flash.
  - NovaDock is now called LunaDock: new name and new icon, a moon with a star. Your settings, dock, widgets, island and license stay as they were.
  - New start animation: the star sweeps the menu bar and the moon the Dock, and they meet in the logo.
  - Websites in the Dock: add any web page with its own icon.
  - Import the apps pinned to the Windows taskbar.
  - The Windows taskbar can be hidden, hide by itself or stay visible.
  - Customizable keyboard shortcuts: show or hide the Dock, Start menu, Preferences, standby screen and quick notes.
