ReleaseNotes: |-
  - Temas de color: nueve temas que tiñen el dock, la barra y los menús y cambian el color de acento, y además tu propio acento, tinte, bordes, reflejo y redondeo del dock.
  - Una luna de verdad: la luna de la entrada ya es una media luna lisa, con las puntas suaves y algo de volumen, también en el botón de la barra.
  - Estelas de cometa: la estrella y la luna dejan estelas finas, curvas y afiladas, y la llegada al logo de la barra es un destello más suave.
  - NovaDock ahora se llama LunaDock: nuevo nombre y nuevo icono, una luna con una estrella. Tus ajustes, el dock, los widgets, la isla y tu licencia siguen como estaban.
  - Nueva animación de entrada: la estrella recorre la barra y la luna el dock, y se juntan en el logo.
  - Webs en el dock: añade cualquier página con su propio icono.
  - Importa las apps ancladas a la barra de tareas de Windows.
  - La barra de tareas de Windows puede ir oculta, esconderse sola o quedarse visible.
  - Atajos de teclado a tu gusto: mostrar u ocultar el dock, menú Inicio, Preferencias, pantalla de reposo y notas rápidas.
