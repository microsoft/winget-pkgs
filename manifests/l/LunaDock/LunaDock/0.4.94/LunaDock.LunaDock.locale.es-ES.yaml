ShortDescription: Un dock estilo macOS, una barra superior y una isla dinámica que sustituyen a la barra de tareas de Windows.
Description: |-
  LunaDock sustituye la barra de tareas de Windows 10 y 11 por un escritorio al estilo de macOS:
  - Dock: apps fijadas y abiertas con ampliación fluida, vistas previas de ventanas, pilas de carpetas, webs, papelera y widgets. Puede quedarse visible o esconderse cuando una ventana lo tapa.
  - Barra superior: menú de la app, app activa, reloj y calendario, bandeja del sistema, volumen, centro de control y decenas de widgets opcionales (uso del sistema, tiempo, música, red y más).
  - Isla dinámica: lo que suena con carátula y controles, indicadores de volumen y brillo, y una bandeja temporal para guardar archivos y arrastrarlos a otro sitio.
  - Pantalla de reposo: como la pantalla de bloqueo del Mac, con un reloj enorme de cristal, el tiempo y tu música.
  - Calendarios: tus eventos de Google, Outlook o iCloud en la barra, con avisos y «Unirse» de un clic.
  - Notificaciones: los avisos de Windows como banners limpios arriba a la derecha, y un centro de notificaciones agrupado por app.
  - Tu estilo: superficies Liquid Glass, Desenfoque u Opaco, modo claro y oscuro, temas de color y color de acento, animaciones de ventana, atajos de teclado y configuración por monitor.

  LunaDock adapta sus animaciones al equipo y no necesita permisos de administrador. Al cerrarlo, la barra de tareas de Windows vuelve al momento (atajo de emergencia: Ctrl+Alt+Mayús+Q), y al desinstalarlo Windows queda como estaba.

  Prueba gratuita de 14 días. Después hace falta una licencia de pago único (incluye tu clave y otra de regalo para otra persona u otro equipo tuyo; cada clave se activa en un equipo, todas las actualizaciones incluidas), que se compra en la web de LunaDock.
