ReleaseNotes: |-
  - Actualizar sin salir de LunaDock: La versión nueva se descarga en segundo plano y la isla te enseña el progreso. Cuando está lista, pulsa Reiniciar: se instala en unos segundos y LunaDock vuelve a abrirse solo.
  - Arrastrar archivos, con vida: Al pasar un archivo por la isla, su borde corre y una luz lo sigue; al soltarlo, cae dentro y aparece en la bandeja. Al sacarlo, una miniatura te acompaña hasta donde lo dejes.
  - Portal: tus archivos viajan: Mientras envías o recibes, la vista previa del archivo se deshace en polvo en un lado y se va formando en el otro, en la isla y en la web de Portal.
  - Webs del Panel siempre a mano: Gmail, WhatsApp y las demás webs ocupan toda la tarjeta, se abren solas y conservan la sesión y la página al cerrar el Panel. Cada tarjeta adapta su contenido a su tamaño, con animaciones más suaves.
  - Acerca de este equipo, renovado: Una tarjeta compacta con tu equipo dibujado y el procesador, la gráfica, la memoria y Windows de un vistazo. «Más información…» la amplía con el informe completo.
  - Cristal en el Explorador de Windows: Experimental: en Ajustes › Explorador elige Liquid Glass o Translúcido para las carpetas del Explorador de Windows. «Como Windows» lo deja como estaba.
