ReleaseNotes: |-
  - Update without leaving LunaDock: The new version downloads in the background and the island shows the progress. When it’s ready, press Restart: it installs in a few seconds and LunaDock opens again on its own.
  - Dragging files, brought to life: Drag a file over the island and its border flows while a light follows it; drop it and it falls into the tray. Drag it out and a thumbnail follows you to wherever you drop it.
  - Portal: watch your files travel: While you send or receive, the file’s preview dissolves into dust on one side and forms on the other, on the island and on the Portal web.
  - Panel websites always at hand: Gmail, WhatsApp and other websites fill the whole card, open on their own and keep your session and page when you close the Panel. Each card scales its content to its size, with smoother animations.
  - About This PC, redesigned: A compact card with your PC drawn in and its processor, graphics, memory and Windows at a glance. “More Info…” expands it into the full report.
  - Glass for Windows File Explorer: Experimental: in Settings › File explorer, choose Liquid Glass or Translucent for Windows File Explorer folders. “Like Windows” leaves it as it was.
