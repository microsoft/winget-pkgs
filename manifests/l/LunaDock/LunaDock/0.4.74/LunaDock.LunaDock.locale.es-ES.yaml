ReleaseNotes: |-
  - Responder desde los avisos, de verdad: El aviso ya no se cierra mientras escribes la respuesta: lo que escribes va al aviso de la app y lo ves en el de LunaDock. Intro envía y Mayús+Intro hace un salto de línea.
  - Más ligero: LunaDock gasta menos: ya no está mirando todo el rato lo que pasa en el sistema, espera a que Windows avise (ventanas minimizadas, micrófono y cámara, avisos). Menos memoria para los iconos y sin fugas.
  - Launchpad más rápido: Se abre al instante sobre tu escritorio de verdad, prepara solo la página que ves y recuerda los iconos entre una vez y otra.
  - Esquinas activas más fiables: Responden aunque LunaDock esté ocupado. Con dos monitores también funcionan las esquinas que dan al otro: desliza el ratón por el borde de arriba o de abajo hasta la esquina.
  - Escribir sin esperas: Las teclas de volumen se escuchan en un hilo propio: escribir en cualquier programa ya no espera a LunaDock.
