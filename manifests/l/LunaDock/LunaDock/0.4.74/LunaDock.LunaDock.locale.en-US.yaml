ReleaseNotes: |-
  - Replying from notifications, for real: The notification no longer closes while you type your reply: what you type goes to the app's notification and you see it in LunaDock's. Enter sends and Shift+Enter adds a new line.
  - Lighter: LunaDock uses less: it no longer keeps checking what is going on in the system, it waits for Windows to tell it (minimized windows, microphone and camera, notifications). Less memory for icons and no leaks.
  - Faster Launchpad: Opens instantly over your real desktop, only prepares the page you see and remembers the icons from one time to the next.
  - More reliable hot corners: They respond even when LunaDock is busy. With two monitors, the corners that face the other one work too: slide the pointer along the top or bottom edge into the corner.
  - Typing without waiting: The volume keys are handled on their own thread: typing in any app no longer waits for LunaDock.
