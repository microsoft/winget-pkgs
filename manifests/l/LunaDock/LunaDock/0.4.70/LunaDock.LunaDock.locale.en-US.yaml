ReleaseNotes: |-
  - The Dock, on the left or right: In Preferences › Dock › Position. It hides toward its edge, menus and previews open beside it, and the Genie effect flows sideways into the icon.
  - All windows: Like Mission Control: your windows as live thumbnails, side by side. From the ☾ menu, a shortcut or a hot corner.
  - Hot corners: Move the pointer into a corner to see all windows, the desktop, Start, notifications, the standby screen… In Preferences › General.
  - Mac-style app switcher: Alt+Tab with large icons that switches apps, and Alt+` between the same app’s windows. Turn it on in Preferences › General.
  - Window tiling: Window › Move & Resize: halves, quarters, fill, center and return to the previous size, also with shortcuts.
  - Live activities in the island: A running Pomodoro, timer or download shows in the island; hover for more detail and controls.
  - Reply from notifications: Messaging notifications with a reply field now use LunaDock’s design: “Reply”, type and it’s sent.
  - Notification counts and recent apps in the Dock: Each app’s notification count on its icon, and the apps you closed last stay at hand to open again.
  - Clipboard history: A widget with what you copied last (text, images and files) to copy it again. Only on this PC and until you quit LunaDock.
  - More Dock tiles: Digital clock, analog clock, weather and battery, the size of an icon.
  - Each Dock, its own apps: With two displays, each Dock can show only the apps open on its own display. In Preferences › Displays.
  - Menus that are always readable: The glass of menus, panels and notifications darkens or lightens just enough for what’s behind it.
  - One purchase, two keys: Every purchase includes your key plus a gift key, for someone else or another PC of yours. In Preferences › License and updates you can see which PC it is activated on and release it to use it on another one.
  - Back from sleep, everything in place: When you unlock or wake your PC, the bar, the Dock and the island stay where they were, without replaying the entrance or getting stuck halfway. Notifications wait until you unlock and hot corners don’t fire on their own.
  - Trial or license, at a glance: A badge in Preferences and in About LunaDock tells you whether you are on the trial (and how many days are left) or already have the license; when you activate it, LunaDock celebrates with you.
