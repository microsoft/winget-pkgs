ReleaseNotes: |-
  - El dock, a la izquierda o a la derecha: En Preferencias › Dock › Posición. Se esconde hacia su borde, los menús y las vistas previas salen al lado, y el Genio va de lado hacia el icono.
  - Todas las ventanas: Como Mission Control: tus ventanas en miniatura, en vivo y sin solaparse. Desde el menú ☾, un atajo o una esquina activa.
  - Esquinas activas: Lleva el ratón a una esquina para ver todas las ventanas, el escritorio, Inicio, las notificaciones, la pantalla de reposo… En Preferencias › General.
  - Selector de apps estilo Mac: Alt+Tab con iconos grandes que cambia de app, y Alt+º entre las ventanas de la misma app. Se enciende en Preferencias › General.
  - Ventanas en mosaico: Ventana › Mover y redimensionar: mitades, cuartos, llenar, centrar y volver al tamaño de antes, también con atajos.
  - Actividades en la isla: El Pomodoro, un temporizador o una descarga en marcha se ven en la isla; al pasar el ratón, con más detalle y botones.
  - Responder desde los avisos: Los avisos de mensajería con campo para responder ya salen con el diseño de LunaDock: «Responder», escribes y se envía.
  - Avisos y apps recientes en el dock: El número de notificaciones de cada app sobre su icono, y las últimas apps que cerraste se quedan a mano para volver a abrirlas.
  - Historial del portapapeles: Un widget con lo último que copiaste (textos, imágenes y archivos) para volver a copiarlo. Solo en este equipo y hasta que cierres LunaDock.
  - Más baldosas para el dock: Reloj digital, reloj de agujas, el tiempo y la batería, del tamaño de un icono.
  - Cada dock, sus apps: Con dos monitores, cada dock puede enseñar solo las apps abiertas en su pantalla. En Preferencias › Pantallas.
  - Menús que siempre se leen: El cristal de menús, paneles y avisos se oscurece o se aclara lo justo según lo que haya detrás.
  - Una compra, dos claves: Cada compra trae tu clave y otra de regalo, para otra persona u otro equipo tuyo. En Preferencias › Licencia y actualizaciones ves en qué equipo está activada y puedes liberarla para usarla en otro.
  - Al volver del reposo, todo en su sitio: Al desbloquear o volver de la suspensión, la barra, el dock y la isla siguen donde estaban, sin repetir la entrada ni quedarse a medias. Los avisos esperan a que desbloquees y las esquinas activas no se disparan solas.
  - Prueba o licencia, a la vista: Una pastilla en Preferencias y en Acerca de LunaDock te dice si estás de prueba (y cuántos días quedan) o si ya tienes la licencia; al activarla, LunaDock te lo celebra.
