ReleaseNotes: |-
  - Mapa 3D del mundo: En el Panel, un globo con relieve y edificios en 3D. Busca cualquier lugar, acércate y muévete con el ratón o con WASD.
  - Bolsa, mercados y Trade Republic: Tu lista de valores con gráficas, análisis y los principales mercados, y tu cartera de Trade Republic en su web oficial, dentro del Panel.
  - Tu banco en el Panel: Conecta BBVA u otro banco con Enable Banking (gratis para tus cuentas) y mira saldos y últimos movimientos. Solo lectura: inicias sesión tú en tu banco.
  - Más tarjetas para el Panel: Hábitos, Noticias y Pausas saludables, y más de 20 tarjetas nuevas en el catálogo: el tiempo por horas, cripto, descargas, apps que más consumen…
  - Cada tarjeta en su sitio: Arrastra o cambia el tamaño desde cualquier esquina: las tarjetas ya no se montan encima ni se mueven solas, y el menú ··· se lee bien siempre.
  - Burbujas para moverte por Ajustes: Al desplazarte, unas burbujas junto a la barra te enseñan todos los apartados y en cuál estás; un clic te lleva. Y un botón de volver más claro.
  - Cristal en toda la isla: Con Liquid Glass, «Nada sonando» y los avisos cortos de la isla también son de cristal. Y el selector de apps estilo Mac sale siempre en tu monitor principal.
