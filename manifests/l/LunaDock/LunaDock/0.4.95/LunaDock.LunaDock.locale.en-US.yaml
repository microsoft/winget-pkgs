ReleaseNotes: |-
  - 3D world map: In the Panel, a globe with 3D terrain and buildings. Search for any place, zoom in and move around with the mouse or WASD.
  - Stocks, markets and Trade Republic: Your watchlist with charts, analysis and the major markets, plus your Trade Republic portfolio on its official web app, right in the Panel.
  - Your bank in the Panel: Connect BBVA or another bank with Enable Banking (free for your own accounts) and see balances and recent transactions. Read-only: you sign in to your bank yourself.
  - More cards for the Panel: Habits, News and Healthy breaks, plus 20+ new cards in the catalog: hourly weather, crypto, downloads, top apps…
  - Every card in its place: Drag or resize from any corner: cards no longer overlap or move on their own, and the ··· menu is always readable.
  - Bubbles to get around Settings: As you scroll, bubbles next to the scrollbar show every section and where you are; one click takes you there. Plus a clearer back button.
  - Glass across the island: With Liquid Glass, “Nothing playing” and the island's short notices are glass too. And the Mac-style app switcher always opens on your main monitor.
