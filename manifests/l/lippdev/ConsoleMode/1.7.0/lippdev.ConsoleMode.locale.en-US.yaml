ShortDescription: Turn your Windows PC into a console on the TV with one click.
Description: Console Mode focuses your TV, turns off or hides the other monitors, switches audio to HDMI and launches Steam Big Picture, Playnite fullscreen or Xbox mode. When you quit Big Picture or Playnite, your desktop layout is restored automatically.
