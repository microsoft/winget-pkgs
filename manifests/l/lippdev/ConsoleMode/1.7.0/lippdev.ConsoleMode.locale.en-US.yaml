ReleaseNotes: |-
  What's new
  - One interface, made like a console's: Console Mode now has only the Console interface, which also works with the mouse and the keyboard. Home shows your launchers in a row, with their official logos, over your game art; the font is Inter, the default background is Aurora and the title bar follows. The first time you open it, a guided tour walks through everything and moves on by itself. If you prefer the old interface, there is Legacy, at the end of this list. (#162, #164, #165, #169, #182, #184, #194)
  - Your apps on Home: any .exe (RetroArch, another launcher…) becomes a tile through +, with the program's icon and name and optional arguments; if it is only a launcher that starts the real program and quits, the session follows that program. ☰ (OPTIONS on PlayStation) or a right click on the tile takes the app off Home. (#161, #185, #198)
  - Per-game profiles: each Steam game remembers its own resolution, HDR, FPS limit and audio output, saved from the session menu while the game runs. (#170)
  - Session menu outside console mode: with Console Mode open (even only in the tray), the menu shortcut opens the Session menu without starting any launcher or game, to use the PC from the couch: open windows, volume, screen, audio, ControlFS, JoyChromium and the mouse through the controller. Turn it off in System → Controller. (#185)
  - Task View shortcut: a controller shortcut that does what Win + Tab does, already on with Select + X. With an Xbox controller Windows moves the selection; with a PlayStation controller, Console Mode does. (#188)
  - Browser (JoyChromium) in the session menu, right below ControlFS: it opens over the game, is driven with the controller and installs from there if missing. (#175, #181)
  - The desk comes back whole: the desktop icons return to their places after the session, the mouse pointer gets out of the way when the launcher shows up and goes back to where it was, and if the app closes or the PC shuts down mid-session, the next start restores screens, audio and the rest. (#167, #177, #178)
  - Wake the PC with the controller: System → Controller shows whether the Xbox Wireless Adapter, Bluetooth or a wired controller can wake the PC from sleep, and Turn on enables it for them. Together with Enter when a controller connects, the center button wakes the PC straight into console mode. (#168)
  - Opening and sounds: when it opens, the Console Mode logo "powers on" with an entrance sound (now and then, as a surprise, an opening inspired by the Xbox 360 or the PS4); moving, confirming, going back and switching tabs have new sounds. System → App picks the style and turns the opening or the sounds off. (#183, #184)
  - Console scale: the interface and the Session menu always take the same share of the screen, with Windows at 100 %, 150 % or 200 % and at 1080p, 1440p or 4K. (#185)
  - Notices on the game screen slide in from the right, show how long is left and leave the same way; option lists fade at the edges when there is more that way and show where you are. (#185)
  - Controller battery in the session menu and in the top bar, and a diagnostics report to copy in System. (#159, #160)
  - The update notice shows the version's highlight in the app's language, when there is a changelog in it. (#158)
  - Console Mode Legacy, for those who prefer the old interface: in the same release, ConsoleModeLegacy-Setup-x64.exe and ConsoleModeLegacy-Portable-x64.exe are Console Mode 1.6.2 as it was, with the Desktop and Console interfaces and TV control. It opens with the settings you already have and keeps the ones only this version uses, so you can go back and forth without losing anything. It is frozen: no new features, no fixes, and it never offers an update. To come back, install the current version over it. (#200, #202)
  Changes
  - Home: clicking a launcher (or pressing A on it) only picks what will open; Play now is what starts. (#193)
  - The Desktop interface leaves the app: everything it did is in the System tab. It lives on in Legacy. (#184)
  - TV control (Google TV / Android TV over the network) stays out of 1.7: the TV category leaves the System tab and sessions no longer turn the TV on or put it in standby. The settings of anyone who set it up are kept, and in Legacy it keeps working. (#195)
  Fixes
  - Playnite: starting a game no longer ends the session when Playnite hides its own window ("Minimize after game startup", which the Selene theme turns on). (#191)
  - Screens: when Windows renames the screens during a session, the chosen resolution goes to the TV and going back to the PC turns the right screens on and off. (#191)
  - System and Session: after picking an option from a list, or closing it with B, the focus stays on the same row. (#196)
  - Audio output The one that shows up when connecting: it also works when the TV's output was already on before the session. (#180)
  - Controllers: a stick that reads off-center from the start no longer leaves the menu "scrolling up by itself". (#180)
  - Settings: config.json keeps the settings this version doesn't know instead of dropping them on save; it is what lets you switch between this version and Legacy without losing anything on either side. (#201)
  Downloads
  - Installer: ConsoleMode-Setup-x64.exe — installs the app and offers shortcuts and starting with Windows.
  - Portable: ConsoleMode-Portable-x64.exe — a single executable; keeps its data in the ConsoleMode_Data folder next to the file.
  Legacy
  Prefer the old interface? Console Mode Legacy is 1.6.2 as it was, with the Desktop and Console interfaces. It opens with the settings you already have and keeps the ones only the current version uses, so you can switch back and forth. It is frozen: no new features, no fixes, and it never offers an update. To come back, install the current version over it.
  - Legacy installer: ConsoleModeLegacy-Setup-x64.exe
  - Legacy portable: ConsoleModeLegacy-Portable-x64.exe
  🇧🇷 Notas em português: CHANGELOG.md
