ShortDescription: Hold a key, scroll or swipe to move Lightroom Classic Develop sliders
Description: |-
  Lumerist is a small app plus an Adobe Lightroom Classic plug-in. Hold a key and turn the mouse wheel or swipe on the touchpad, and a Develop slider moves while you keep looking at the photo. There are also keys for nudges, Lightroom commands, presets, macros and masks, and a palette for presets and mask tools.
  It needs Adobe Lightroom Classic 12 or later. Free and open source (GPL-3.0); it runs entirely on your computer, with no account and no telemetry.
