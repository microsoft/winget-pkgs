  Commit Message
  🚀 LobeHub Release (20260728)
  Release Date: July 28, 2026
  Since v2.2.11: 92 merged PRs · 17 contributors
  This weekly release makes Agent work easier to review and recover, with structured verification, broader model access, clearer completion feedback, and a smoother desktop experience.

  ✨ Highlights
  - Acceptance review flow — Open focused checks, review structured metrics and charts, and accept or reject delivery from one unified surface. (#17566, #17631, #17633, #17650)
  - Chat image generation — Let chat models discover image models, inspect parameters, start generation, and follow generation status through a built-in tool. (#15332)
  - More model access — Use a ChatGPT subscription through device authorization, run Claude Opus 5, and select the latest Gemini Flash models. (#17527, #17582, #17608, #17433)
  - Agent work visibility — Turn generated files into durable Works, summarize edited files, and notify users when long Agent runs finish. (#17423, #17331)
  - Desktop file preview — Preview local HTML work with its relative assets while keeping file access inside the approved project root. (#17545)

  🏗️ Agents, Tasks, and Verification
  - Unified Task criteria, check results, focused review comments, and accept or reject actions across desktop and mobile. (#17631)
  - Added versioned structured verification data for metric comparisons, curves, scatter plots, heatmaps, SOTA tables, and grouped bar charts while retaining the raw evidence. (#17633)
  - Kept shorter Acceptance checklists flat, grouped only larger lists, and protected owner-only run history in shared views. (#17650)
  - Kept scheduled runs visible in active conversations and triggered recall for success-like completion states, including auto-repair outcomes. (#17473, #17613)
  - Preserved human-intervention message ancestry after server-runtime rehydration so submitted or skipped responses stay attached to the requesting assistant. (#17628)
  - Synchronized Task editor state and grouped retries, and restored image paste in the browser runtime. (#17585, #17644)

  🤖 Models and Generation
  - Added ChatGPT subscription authentication through the Codex OAuth device flow and a provider-scoped Responses runtime. (#17527)
  - Added Claude Opus 5 runtime and model-card support, including adaptive-thinking defaults and summarized thinking display. (#17582, #17608, #17620)
  - Sanitized replayed reasoning for Anthropic-compatible providers so missing text and foreign signatures do not break cross-model conversations. (#17629)
  - Added Gemini 3.6 Flash and Gemini 3.5 Flash-Lite, preserved Google image resolution when aspect ratio is automatic, and corrected range-priced GPT model costs. (#17433, #16677, #16991)
  - Added a built-in chat image-generation tool that reuses the existing model discovery, generation, and status pipeline. (#15332)

  🖥️ Desktop and User Experience
  - Added Preview and Source modes for local HTML files, including project-scoped asset resolution for CSS, JavaScript, images, fonts, audio, and video. (#17545)
  - Moved the Working Sidebar behind a shared feature boundary and filtered OS metadata, dependency directories, caches, generated artifacts, and editor backups from project files. (#17646)
  - Rendered gitignored project files in the Agent file browser and retained desktop browser webviews in the renderer. (#17517, #17513)
  - Unified development tools in a bottom DevDock and restored React DevTools through a standalone desktop bridge. (#17499, #17602)
  - Preserved Windows PATH order when locating Claude Code and Codex, and simplified terminal controls and Topic context menus. (#17381, #17609, #17642)

  🔒 Security and Reliability
  - Security: Kept local HTML preview resources inside the approved project root after symlink resolution. (#17545)
  - Reliability: Restored correct provider error handling for Ollama and woke registered-only gateway connections during sync. (#17344, #17536)
  - Reliability: Removed layout animation jank from the generation Topic grid while preserving tooltip behavior. (#17661)
  - Reliability: Restored CI translations and English fallback, guarded calculator null values, and made tool-name compression fully disable when configured with a zero limit. (#17605, #17588, #17530)

