PackageIdentifier: lanxiuyun.Catrace
PackageVersion: 26.8.6
PackageLocale: en-US
ShortDescription: 'A small tool that helps you balance work and rest: sedentary reminder, water check-in, and agent notifications.'
Description: 'Catrace quietly watches your activity in the background (it only detects mouse and keyboard activity — no screen capture, no reading what you do) and reminds you to stand up and rest when you have been working continuously for too long. Two reminder modes are supported: notification cards (floating cards with postpone/skip actions and a rest liquid-ball timer) and fullscreen reminders (with customizable background image, fit mode, and overlay opacity). You can customize the work window and rest-detection durations, and set water reminders at your own interval that only interrupt you while active. Custom plugins and agent notifications are supported.'
