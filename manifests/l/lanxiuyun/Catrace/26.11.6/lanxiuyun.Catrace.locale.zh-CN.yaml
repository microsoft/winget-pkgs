ShortDescription: 帮你平衡工作与休息的小工具：久坐提醒 · 喝水打卡 · Agent 通知。
Description: Catrace 在后台观察你的活动状态（只检测鼠标键盘活动，不偷拍屏幕、不读取你在做什么），发现你连续工作太久就会提醒你站起来休息一会儿。支持两种提醒模式：通知提醒（右下角浮动通知卡片，支持推迟、跳过与休息液体球计时器）与全屏提醒（可自定义背景图片、适配方式和遮罩透明度）。可以自定义工作时长和休息判定时长，也可以按设定间隔提醒喝水，只在你活跃时打扰。支持自定义插件与 Agent 通知。
