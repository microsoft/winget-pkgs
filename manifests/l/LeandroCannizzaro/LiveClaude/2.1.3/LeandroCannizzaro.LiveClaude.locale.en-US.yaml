ShortDescription: Supervisor and desktop app that keeps Claude Code Remote Control and Cursor My Machines workers running.
Description: |-
  LiveClaude keeps Claude Code Remote Control servers and Cursor My Machines workers alive on
  this machine. It runs one long-lived process per session and restarts it after a crash, at
  sign-in, and after a reboot, as a Windows scheduled task or a Windows service.

  The desktop app creates, edits and removes sessions, shows live state and logs, and embeds a
  real pseudo console so workspace trust, the Remote Control confirmation and signing in happen
  inside the app. You can also attach to a running process and type into it.

  Written in C# on .NET 10. Not affiliated with Anthropic or Cursor.
