ShortDescription: Clean, transparent open-source Minecraft launcher with mods and modpacks from Modrinth and CurseForge, isolated instances, and Microsoft or offline accounts. No telemetry.
Description: |-
  Lucerna is a clean, transparent open-source launcher for Minecraft: Java Edition. No telemetry, no ad injection, no hidden processes, no bundled adware.

  It browses mods, resource packs, shaders, datapacks, modpacks and server plugins from Modrinth, CurseForge, FTB, ATLauncher, Hangar and Vanilla Tweaks, and supports Fabric, Quilt, Forge and NeoForge. Every Minecraft install lives in its own isolated instance, and several instances can run at once. Lucerna can also host your own servers. Microsoft / Xbox Live sign-in and offline play are equal options. The interface is in English and Russian.

  Java and the game files come straight from Mojang and are never modified. Lucerna is not an official Minecraft product and is not approved by or associated with Mojang or Microsoft.
