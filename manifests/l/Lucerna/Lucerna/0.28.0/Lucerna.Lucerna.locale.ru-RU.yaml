ShortDescription: Чистый и прозрачный лаунчер Minecraft с открытым кодом. Моды и сборки с Modrinth и CurseForge, отдельные профили, вход через Microsoft или офлайн. Без телеметрии.
Description: |-
  Lucerna — чистый и прозрачный лаунчер Minecraft: Java Edition с открытым кодом. Без телеметрии, без встроенной рекламы, без скрытых процессов и без навязанных программ.

  Лаунчер ищет моды, ресурспаки, шейдеры, датапаки, сборки и плагины для серверов на Modrinth, CurseForge, FTB, ATLauncher, Hangar и Vanilla Tweaks и поддерживает Fabric, Quilt, Forge и NeoForge. Каждая установка Minecraft живёт в своём отдельном профиле, и несколько профилей можно запускать одновременно. Ещё Lucerna умеет запускать собственные серверы. Вход через Microsoft / Xbox Live и офлайн-игра — равноправные варианты. Интерфейс на русском и английском.

  Java и файлы игры скачиваются напрямую у Mojang и никогда не изменяются. Это не официальный продукт Minecraft: он не одобрен Mojang или Microsoft и не связан с ними.
