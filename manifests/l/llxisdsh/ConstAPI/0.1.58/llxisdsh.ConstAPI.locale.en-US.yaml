ShortDescription: A desktop gateway that connects AI tools to API providers, subscriptions, and local models.
Description: CONST API provides OpenAI Responses / Chat Completions, Anthropic Messages, and Gemini API interfaces behind one local endpoint. Add API keys, supported subscriptions, or OpenAI-compatible local servers as model channels, connect tools such as Codex, Claude Code, and OpenCode, and inspect channel health, model availability, usage, and errors. Local use needs no account; the hosted Model Marketplace requires a CONST account.
