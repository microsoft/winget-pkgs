ReleaseNotes: |-
  This release reorganizes the code behind dezoomify-rs without changing the basic way you use the command-line tool.
  The practical changes are:
  - Zoom levels are listed consistently from smallest to largest, with clearer labels and more accurate dimensions.
  - Discovered image titles are kept when files are saved, so output names are less likely to fall back to generic names.
  - Custom request headers now take precedence as expected, and connection timeouts are applied correctly.
  - The retired PFF servlet format was removed because it no longer has a verifiable live deployment.
  The release includes updated Linux, macOS, and Windows downloads. No new image format was added in this release.
