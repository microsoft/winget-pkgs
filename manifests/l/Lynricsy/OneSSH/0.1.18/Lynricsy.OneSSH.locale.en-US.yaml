PackageIdentifier: Lynricsy.OneSSH
PackageVersion: 0.1.18
PackageLocale: en-US
ShortDescription: Centralized SSH gateway for AI agents with MCP access, credential custody, fine-grained authorization, and full auditing.
Description: 'OneSSH is a centralized SSH gateway written in Go: a single binary that provides stateless Streamable HTTP MCP, OAuth 2.1 authorization, a management API, a live activity stream, and a browser terminal. SSH private keys and passwords are stored encrypted with AES-256-GCM and never leave the gateway; agents reach remote hosts through revocable tokens bound to specific hosts and permissions, and every call and permission denial is recorded in the audit log.'
