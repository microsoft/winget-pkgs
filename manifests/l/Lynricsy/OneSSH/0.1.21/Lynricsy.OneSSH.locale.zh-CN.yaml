ShortDescription: 面向 AI Agent 的集中式 SSH 网关，提供 MCP 接入、凭据托管、细粒度授权与全程审计。
Description: OneSSH 是用 Go 编写的集中式 SSH 网关：单个二进制同时提供无状态 Streamable HTTP MCP、OAuth 2.1 授权、管理 API、实时活动流和浏览器终端。SSH 私钥与密码经 AES-256-GCM 加密存储，凭据不出网关；Agent 通过绑定主机与权限范围的令牌访问远端主机，令牌随时可撤销；每次调用与权限拒绝均写入审计日志。
