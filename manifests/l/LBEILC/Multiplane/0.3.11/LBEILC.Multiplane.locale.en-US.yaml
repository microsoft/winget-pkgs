ReleaseNotes: |-
  Display fixes for the Jobs page and the tray. Only the desktop app changed; the renderer is the same as 0.3.10, so there is no npm release.
  Desktop app
  - Progress numbers no longer doubled. The rolling-number styles were not loaded, so frame counts, speed, elapsed and remaining time on the Jobs page and in the tray were drawn twice side by side (for example 10,82510,825). The styles now ship with the app.
  - Latest frame preview stays visible. In the Preview tab of a running render, the latest finished frame turned into a broken image after its first update, because the refreshed image address was still HTML-escaped. It now keeps updating.
  - Rolling numbers line up. A broad style rule in the job list and the tray shifted rolling numbers about 2.5 px above the text next to them. And because progress updates arrive many times a second, fast-changing digits were interrupted mid-roll and looked stuck halfway, like superscripts. Each number now finishes its roll before moving to the latest value (about 0.6 s at most), and always ends on the last value it received. With reduced motion turned on, numbers still update instantly.
