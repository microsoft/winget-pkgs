ReleaseNotes: |-
  Fixes for the desktop app's video preview and Settings page. The renderer is unchanged from 0.3.8, so there is no new npm release.
  Desktop app
  - Seeking in the preview works. In longer videos, dragging the timeline, stepping one frame, or jumping to the start or end snapped back to the first frame, because the app served video files without byte-range support and only the part already loaded could be seeked. The app now answers range requests, so any frame can be reached right away.
  - The play button pauses. During playback the play button was redrawn on every frame, so a click on it was lost and only clicking the picture paused. It now changes only when playback starts or stops.
  - Settings polish. "Notify when a job finishes" is a switch like "Host renders in Multiplane", and empty path fields show their hint in the interface font instead of a fallback font.
  - The failure banner's description uses the secondary text colour, as in the design.
