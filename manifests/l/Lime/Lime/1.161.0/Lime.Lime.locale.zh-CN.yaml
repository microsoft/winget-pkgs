ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.161.0
  新功能
  - 工作台新增 PDF、DOCX、工作簿和演示文稿的原文件预览、位置批注与会话反馈；工作簿和演示文稿支持已实现范围内的编辑与保存。
  - 扩展插件市场来源管理、远程插件获取、插件共享与访问范围配置，统一桌面、CLI 与 App Server 的插件合同。
  - 新增 App Server 账号与云端请求接口，统一桌面登录、账号状态同步及退出流程。
  修复
  - 修复矮窗口中首页输入区和底部控件被裁切的问题。
  - 退出应用时等待 App Server 异步停止，完善桌面进程的关闭流程。
  - 修复专业文件字节摘要计算可能导致预览或批注初始化失败的问题。
  - 修复工作区切换、文件预览与批注提交中的状态归属、迟到响应和文件版本冲突处理。
  - 完善 MCP、实验功能与媒体服务设置的未保存更改保护，以及开发者和媒体设置的搜索定位。
  - 调整 App Server 请求超时与诊断，完善插件刷新、安装身份及 Hooks 生命周期处理。
  优化与重构
  - 主导航采用折叠后仍保留的图标栏、上下文侧栏和共享标题栏；简化首页，移除旧推荐入口，保留 Banner 与独立输入区。
  - 完善输入区工作树提交、执行范围交接和后台会话恢复状态同步。
  - 插件技能内容预览通过共享 App Server 合同读取，增加查询缓存、请求去重和账号切换时的缓存隔离。
  - 消息队列支持拖拽和键盘重排，复用现有队列协议与会话状态。
  - 专业文件按格式拆分预览、编辑和批注职责，共享文件读取、保存与会话提交入口；移除被替换的工作区预览路径。
  - 账号凭证集中由 App Server 持有，移除 Renderer 中重复的会话令牌与退出入口；同步五语言界面资源。
  测试与质量
  - 扩充专业文件解析、编辑保存、批注、队列重排、设置导航、账号和插件的定向回归及 Electron 验证场景。
  - 同步 App Server 协议 schema、生成客户端、命令目录、CLI 消费者与边界守卫。
  - 更新运行时依赖准备、能力范围与测试证据记录。
  文档
  - 更新专业文件、插件重构、设置草稿、队列交互及共享后端的架构和执行计划；完整 GUI 对齐及未验收能力继续按领域计划跟踪。
  其他
  - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.161.0。
  完整变更：v1.160.0 → v1.161.0
