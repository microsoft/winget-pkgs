ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.164.0
  新功能
  - 增加异步用户输入面板，支持问题草稿、答案编辑、提交恢复及跨回合状态投影。
  - 增加线程目标与目标附件流程，支持新会话目标提交、草稿恢复和附件关联。
  - 完善工作区文件树、文件菜单、上下文操作和文本编辑入口，统一文件打开目标与侧面板行为。
  - 优化侧栏会话分组、分页、个人资料、帮助和快捷键入口，统一导航区块与可见状态。
  - 增加记忆状态、引用和分阶段输出的 App Server 及 GUI 投影能力。
  修复
  - 修正异步输入、取消、续接、完成和冷恢复过程中的 Thread/Turn/Item 身份与终态。
  - 修正消息、推理、网页搜索和工具历史在增量、快照、上下文压缩、分叉及模型切换中的持久化与展示。
  - 修正文件、技能、命令和消息引用的解析、提交、预览关闭与导航恢复。
  - 修正 Electron 文件 shell、IPC、主进程退出、窗口目标和工作区操作的边界行为。
  - 清理已退役的对话导入、旧 OEM 云端引用和重复命令入口，避免生产路径继续依赖废弃 owner。
  优化与重构
  - 将 Composer、目标输入、请求用户输入、文件树和侧栏交互拆分为聚焦模块，复用现有 current runtime、App Server 和工具执行边界。
  - 收敛 canonical history、runtime snapshot、memory store 和 projection 流程，减少重复转换与兼容分支。
  - 更新协议 schema、客户端合同、命令目录、治理规则和跨平台发布脚本，保持生成物与消费者同步。
  测试与质量
  - 补充异步用户输入、线程目标、消息历史、快照恢复、文件树、侧栏、Composer、Electron IPC 和 App Server 的定向回归。
  - 更新五语言资源、GUI fixture、协议合同、Rust owner 测试、真实 Electron smoke 与发布工作流护栏。
  - 保留发布证据、REA 记录和执行计划，明确 current 主链及尚未覆盖的 live provider、打包平台边界。
  文档
  - 更新架构、治理、Codex GUI 对齐、运行时快照、Composer、侧栏、文件操作和异步输入执行计划与研究账本。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.164.0。
