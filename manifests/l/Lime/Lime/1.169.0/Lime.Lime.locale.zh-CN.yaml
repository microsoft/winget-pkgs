ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.169.0
  新功能
  - 浏览器增加设备预设、自定义视口尺寸与缩放控制，完善页内查找、新标签地址草稿和页面焦点交接。
  - 浏览器设置增加历史访问分组、搜索和批量删除，集中管理下载目录、站点权限与 Agent 浏览准入。
  - 设置增加用户与项目配置层查看、受管来源和约束展示，并通过版本校验保存可写配置。
  - 本地环境设置支持项目环境文件、平台专属 setup/cleanup 与动作配置编辑，并保留版本冲突时的草稿。
  - 浏览器增加受站点权限和逐次审批约束的当前页面 CDP 命令执行。
  - 增加新聊天推理强度默认值和可选档位设置，遵循模型能力与配置作用域。
  - 增加归档聊天批量清理，以及 Node/Python 工具运行环境的诊断、安装与取消接口。
  修复
  - 设计批注首次保存或发送时采集修改后的页面，保持截图、草稿版本与编辑器事件顺序一致，拒绝过期结果。
  - 原生网站权限请求校验页面、来源、标签与控制身份，导航或控制权变化时撤销待处理授权。
  - 配置变更统一串行写入，保留用户与项目层版本冲突检查，避免旧页面覆盖新配置。
  - 命令取消时保留进程退出事件和已捕获输出，环境脚本取消后保留可恢复的工作树。
  - 修复文件预览兜底标题与 MIME 类型说明的五语言文案。
  - Web 搜索统一处理禁用、缓存与实时访问策略，并在工具执行前落实网络和沙箱约束。
  优化与重构
  - 精简独立知识库、资源管理窗口、旧统计与开发实验设置，以及创作上下文拼接子链；图片输出继续复用工作区预览。
  - 清理无消费者的图库与独立素材入口、专用存储及接口，保留现役图片和视频任务、工作区文件与预览能力。
  - 删除无消费者的项目写作人设与平台发布配置实现，新库不再创建对应旧表，保留存量数据。
  - 浏览器准入、配置约束与工具环境继续复用现役配置、App Server 和工具 owner，同步协议、生成客户端及五语言资源。
  测试与质量
  - 扩展浏览器设备、批注截图、历史、原生权限、配置层、推理默认值与工具环境的定向回归及真实进程夹具。
  - 本版交付已实现增量；完整浏览器原生能力、参考视觉及双平台打包验收继续以专项计划为准。
  文档
  - 同步架构图、命令边界、浏览器专项计划与发布执行记录。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.169.0。
  完整变更：v1.168.0 → v1.169.0
