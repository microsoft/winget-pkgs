ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.160.0
  新功能
  - 设置新增内容搜索，可定位网页搜索、记忆和外观等页面的具体字段与内部页签，并保留未保存更改保护。
  - 插件目录、详情、安装和 CLI 入口统一使用市场与插件身份，Skills、MCP 和 Apps 复用共享配置及安装状态。
  - 完善会话工作目录、服务档位与审批审核者在创建、恢复和分叉过程中的传递与持久化。
  修复
  - 修复动态工具宿主在连接断开与会话恢复后的状态清理和重新接管。
  - 加强 Skills 根目录监听、插件配置保存与安装状态一致性，避免多入口产生不同事实源。
  - 修复 macOS 公证已接受后遇到临时票据装订网络故障的发布恢复，并保留签名与公证失败诊断。
  优化与重构
  - CLI、TUI 与桌面继续收敛到同一 App Server 协议、运行时和会话投影，拆分连接、历史、恢复及工作目录职责。
  - 直接替换旧插件协议和目录直装入口，移除旧 mock 与过期文档，不保留双轨实现。
  - 拆分记忆与外观设置的展示组件，复用搜索、导航、草稿和配置 owner；同步五语言界面资源。
  测试与质量
  - 扩充插件市场、审批、服务档位、远程工作目录、动态工具和 Skills 的协议及运行时回归。
  - 增加设置搜索、内部页签定位、未保存导航与五语言测试，并更新真实 Electron 场景。
  - 同步协议 schema、生成客户端、命令目录与旧入口回流守卫。
  文档
  - 更新共享后端、插件重构、设置搜索的架构图、能力地图与验收记录；完整远端插件市场和整体 GUI 对齐仍按原计划推进。
  其他
  - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.160.0。
  完整变更：v1.159.0 → v1.160.0
