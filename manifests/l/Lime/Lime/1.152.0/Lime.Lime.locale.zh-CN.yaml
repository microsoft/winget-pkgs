ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.152.0
  新功能
  - TUI 状态栏、终端标题和 /status 新增真实 token 用量与上下文百分比；普通输入框底栏也可显示上下文剩余量，并适配 Vim 与窄终端布局。
  - 空输入框连续按两次 Esc 可浏览、回退并编辑历史输入，保留文本标记、图片和 Skill/Mention 引用；回退保留当前线程，不回滚工作区文件，也不会自动发送输入。
  修复
  - 修复推理摘要在完成和历史恢复后重复追加的问题，保留增量文本中的空白，确保流式正文与持久化结果一致。
  - 恢复运行中回合时继续显示末尾推理摘要，并接收没有开始事件的后续增量；重连和加载旧页保持当前进度，已结束回合不会被迟到事件重新打开。
  - TUI 默认只显示推理摘要，原文不会替代缺失摘要、污染运行状态或进入历史导出；摘要详情保留段落、链接和窄屏缩进，避免重复显示活动标题与空占位。
  - 历史分页读取失败时保留阅读位置和草稿，并支持重试；历史回退后的刷新失败会阻止提交，避免使用过期上下文。
  - 用量显示区分未观察到的数据与真实零值，拒绝旧回合通知覆盖当前回合；状态栏和标题配置统一保存规范名称并去重。
  优化与重构
  - 恢复、重连、会话预览和导出统一使用 App Server 分页历史与回合事实，直接替换重复读取路径；旧 Legacy 会话仍可读取，回退明确提示不支持。
  - 拆分推理投影、通知处理、历史浏览和底栏布局，复用结构化输入恢复与用量格式化，继续共享 Desktop/CLI/TUI 的 App Server 与 canonical Thread/Turn/Item 主链。
  - 更新 updater 分发流程，使用分片上传并核对对象大小与摘要；上传失败会阻断发布，全部安装包通过后再上传更新索引。
  测试与质量
  - 扩展五语言用量、历史回退、分页、推理摘要和状态栏的定向回归，以及真实 PTY/stdio 场景。
  - 桌面推理专项夹具验证摘要先于最终回答出现、展开后只显示一次且隐藏原文，同时保留完整 read model；Skills 与专家夹具改用当前可见侧栏入口。
  - 发布门禁结果与未验证平台范围以本版本发布执行计划为准。
  文档
  - 更新 TUI 操作说明、命令边界、架构图、Codex 对齐执行计划与结构 inventory。
  其他
  - 发布版本统一为 1.152.0；历史发布说明通过 Git 历史和 GitHub Release 查询。
  完整变更：v1.151.0 → v1.152.0
