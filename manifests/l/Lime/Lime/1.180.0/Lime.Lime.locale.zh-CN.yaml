ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.180.0
  新功能
  - 增加会话内查找、打开项目及侧边聊天快捷操作，完善空会话欢迎页。
  - 会话标题菜单支持在新窗口打开、移动到项目及确认删除。
  - 右侧面板提供来源汇总、展开查看和完整来源页面。
  修复
  - 修复 Enter 发送成功后草稿未清空的问题，继续保护发送失败和发送期间的新输入。
  - 修复模型配置入口点击导致导航参数异常，以及会话自定义指令未传入运行时的问题。
  - 修复长会话中本地投影和落盘耗时导致的模型请求超时误判。
  - 修正回合耗时错误使用整个会话创建时间的问题，并收紧历史变更的会话身份校验。
  - 完善 Windows 插件卸载、缓存锁冲突及终端恢复测试的处理。
  优化与重构
  - 增量持久化会话历史，避免反复写入完整回合和克隆全部事件；恢复旧日志时逐条校验、重放并释放中间快照。
  - 将冷恢复读取放入后台工作线程，空队列查询避免加载完整历史，并优化开发构建中的日志编码热点。
  - 统一 MCP 配置、服务身份、目录及分页处理，沿现有工具和权限边界接入。
  - 收敛模型路由与聊天服务模块，移除已退出构建图的重复 crate，保留 Lime 多模型、多协议及自有服务边界。
  - 调整侧栏、输入框、设置、定时任务和插件页的布局与交互。
  测试与质量
  - 基础 DeepSWE 会话取得真实完成终态，任务定向测试 126/126 通过；原始测试本机重放评分 reward=1。
  - 补充草稿清理、指令传递、历史重放、回合计时及真实 Electron 会话恢复回归。
  - 固定 amd64 评分镜像在本机 QEMU 环境停滞，本机评分不替代该镜像的验收结果。
  - 各平台安装、签名和更新产物以本版 Release 流水线结果为准。
  文档
  - 更新源码对齐范围、MCP 与模型路由归属，以及基础会话验证和发布记录。
  其他
  - 应用、CLI、Rust workspace 与 Cargo 锁文件版本统一为 1.180.0。
  - 官方发布平台为 macOS arm64/x64 与 Windows x64。
  完整变更：v1.179.0 → v1.180.0
