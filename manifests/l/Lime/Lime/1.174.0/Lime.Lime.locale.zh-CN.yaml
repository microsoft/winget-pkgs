ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.174.0
  新功能
  - 增加自有云桌面入口：支持阿里云 ECS/无影生命周期管理、连接已有桌面，以及隔离的远程任务窗口。
  - 增加 Linux guest 安装与运行包、认证 WebSocket 连接，以及加密归档、恢复和对象存储传输。
  修复
  - 未登录时在会话模型选择器中隐藏 Lime Hub，登录后恢复可用模型。
  - 修复回复期间权限模式控件文字重影，保留清晰的禁用状态。
  - Provider 凭据默认使用受访问权限保护的文件存储，系统密钥库改为显式选择；凭据不可读时提示重新保存 API Key。
  - 对齐模型能力来源、MCP 表单校验与 OAuth 保存，修正模型列表和 Windows 更新验收中的过期预期。
  - Windows 更新验收从已发布且包含完整安装包的正式版本选择升级基线，避免被没有产物的草稿版本阻断。
  - 修复云桌面共享工具函数混入组件导出导致的前端质量检查失败。
  - 批量注册和释放技能文件监听路径，修复 macOS 会话启动与关闭时反复重建原生监听造成的阻塞。
  - 修复 MCP OAuth 未授权状态被误判为已登录、认证按钮不显示的问题。
  - 恢复侧栏专家广场入口，以及专家、Skills 和插件页面之间的项目作用域。
  - 修复云运行时安装完成与状态读取之间的竞态，避免界面提前停止轮询。
  - 显式释放 Computer Use 控制锁，避免并发启动的子进程短暂保留已结束的控制租约。
  - 保留模型目录提供的基础指令与多 Agent 消息配置，避免被内置默认模板覆盖。
  - Windows 卸载时清理 Electron 通知创建的自有开始菜单快捷方式，避免安装目录已删除但入口仍残留。
  优化与重构
  - 调整首页、上下文侧栏、定时任务、Skills 和插件目录布局，并同步五语言文案。
  - 收敛文件搜索、权限与路径处理，清理旧会话 DAO、重复仓储和无消费者的 embedding 实现。
  - 更新 Rust HTTP/TLS、异步运行时、压缩归档、MCP 与终端依赖，并补齐许可证材料。
  - 修复 SQLite、OpenSSL 与 MCP SDK 安全公告，适配当前 MCP 类型和 SQLite 备份接口。
  测试与质量
  - 真实 Electron 的 hello 会话已取得完成回复，canonical Turn 为 completed，用户与助手 Item 已持久化。
  - 增加权限控件禁用态、原生窗口与页面视口一致性及主内容铺满窗口的 Electron 回归检查。
  - Cloud 完整产品验收尚未完成；真实远程模型任务、第三方登录与跨环境恢复仍需继续验证。本机检查不代表 Windows、Intel Mac 或正式安装包验收完成。
  文档
  - 更新凭据存储说明、云桌面计划、架构边界、协议与源码来源记录。
  - 增加无影 Windows 云电脑测试 skill，支持候选同步、桌面取证和资源收尾。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.174.0。
  完整变更：v1.173.0 → v1.174.0
