ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.172.0
  新功能
  - 新增桌面权限引导，可检查授权状态、打开系统设置并重新检测；设置页支持再次打开引导，配套覆盖五种界面语言。
  - Computer Use 支持按策略为原生应用和 WPS 保存持续授权，并在会话与回合间按目标重新校验。
  修复
  - 修复内置浏览器恢复时导航状态丢失、重复挂载覆盖当前页面及原生图片显示问题。
  - 图片生成工具等待实际任务结果后再完成，取消与超时同步取消任务；实时消息和历史恢复共用媒体内容投影。
  - 修复 MCP 工具展示与消息分组，保留服务来源和独立工具条目，减少重复协议内容。
  - 完善 macOS 与 Windows 原生输入、光标呈现及用户介入处理。
  优化与重构
  - 收敛 Computer Use 原生宿主、Chrome 和 Office 的执行边界，移除旧 Chrome Bridge 服务与重复命令入口。
  - Electron 发行包使用构建后的 JavaScript bundle 和显式原生资源，打包前校验运行依赖闭包。
  测试与质量
  - 补充浏览器导航恢复、桌面权限、媒体投影、持续授权及跨平台原生宿主回归。
  - 清理过时聊天夹具、专用场景后端及对应逻辑；现役恢复、草稿和浏览器测试共用精简基础设施。
  - 更新 Electron、CLI、Computer Use 和图片生成的验证夹具与打包资源守卫。
  文档
  - 同步桌面权限、浏览器恢复、媒体投影与发行输入的架构说明。
  - 更新 Chrome 扩展说明、隐私政策和提交流程。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.172.0。
  完整变更：v1.171.0 → v1.172.0
