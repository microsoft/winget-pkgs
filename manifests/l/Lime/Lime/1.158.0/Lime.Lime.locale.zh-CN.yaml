ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.158.0
  新功能
  - 输入框草稿持久化保存，支持首页及不同工作区、会话间隔离，并在重启后恢复富文本和资源引用。
  - 代码块增加语言选择、搜索、自动识别与语法高亮，保留结构化编辑和 Markdown 提交。
  修复
  - 修复新建会话、首次发送和会话切换时草稿误绑定、旧内容回流或新编辑被清空的问题。
  - 按运行时实际接受结果处理输入：提交被拒绝时保留草稿，停止后恢复原输入，迟到回执不覆盖新草稿。
  - 修复技能试用等入口提交后未切换到实际会话，以及发送后编辑器恢复可编辑状态的问题。
  优化与重构
  - 统一草稿协调、桌面持久化和侧栏草稿投影，移除旧草稿事件、重复状态与被替代的导航实现。
  - 设置页面使用统一章节定义，收敛菜单、加载和分类逻辑；页头返回恢复进入设置前的会话，首页入口保持独立，并复用媒体设置提示生命周期。
  - 保持 GUI 与共享 App Server 的业务边界，草稿持久化复用 Electron Host，不建立第二套会话历史。
  测试与质量
  - 扩充草稿保存、冷恢复、首次发送、停止恢复、导航和输入接受结果的回归覆盖。
  - 增强真实 Electron fixture 的退出检查、构建新鲜度和资源字节验证。
  - 同步代码块与设置的五语言文案及回归覆盖。
  文档
  - 更新 GUI 架构、草稿与代码块分析、设置导航审计和结构对齐账本，区分已交付能力与后续范围。
  其他
  - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.158.0。
  完整变更：v1.157.0 → v1.158.0
