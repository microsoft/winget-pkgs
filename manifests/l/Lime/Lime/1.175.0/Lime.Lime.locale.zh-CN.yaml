ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.175.0
  新功能
  - Cloud 桌面增加购买推荐、网络准备、系统镜像选择和安装进度；供应商授权与费用确认分别处理。
  - 增加 Cloud 桌面重连、归档迁移、恢复密钥和定时释放界面，沿原操作记录恢复安装与传输状态。
  - 会话支持历史前进后退、标签页、已归档会话管理，以及从指定回合创建分支。
  - TUI 扩展配置、Hooks、Skills、快捷键面板，以及推理强度和权限配置选择器。
  修复
  - 改进 Cloud Guest 上传隧道、启动就绪检测与窗口导航，补充安装关闭、重连和失败恢复处理。
  - 修复会话复制、重试、未读与置顶状态同步，完善变更文件查看和删除交互。
  - 为回合与侧面板增加渲染错误隔离，减少局部错误对会话操作的影响。
  - 完善权限审批后的终态通知及 Windows 受限执行的权限计划处理。
  优化与重构
  - 账号、专家内容、技能和远程插件改用现役 Cloud 契约，移除旧插件分享协议及其消费者。
  - 改进本地凭据加密与归档身份校验，并同步 App Server schema、生成客户端和五语言资源。
  - 网页搜索支持通过环境配置指定 Bing 与 Google 搜索端点。
  测试与质量
  - 补充 Cloud 安装、传输、恢复、远程插件和会话交互回归，以及 TUI 公共协议与终端场景。
  - 发布流水线从同版本 Linux runtime 打包 Cloud Guest，在桌面与 CLI 制品构建成功后公开 Release。
  - Cloud 全链路与跨平台实机验收继续以对应执行计划为准，本版本不将局部测试视为完整验收。
  文档
  - 更新中英文 README、Lime 品牌展示、Cloud 使用说明和现役架构与命令边界。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.175.0。
  完整变更：v1.174.0 → v1.175.0
