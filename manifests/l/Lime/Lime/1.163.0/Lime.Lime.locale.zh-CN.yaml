ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.163.0
  新功能
  - 统一首页与会话 Composer，支持原生选择文件、文件夹和图片，并在 Sources 面板查看与添加会话资料。
  - 合并上下文建议入口，支持通过 +、@ 和技能引用选择文件、技能与命令，并保留结构化引用和草稿恢复。
  - 工作区文件树接入共享右侧面板，提供多标签文本编辑、语法高亮、搜索和保存，以及未保存内容的关闭保护。
  - 整合后台终端列表和终端标签，支持切换会话中的终端并查看持续输出。
  修复
  - 修正会话输入提交与排队处理，完善显式续接、取消和正常完成的状态及历史记录。
  - 修正工具历史在截断、上下文压缩和会话分叉中的关联与预算处理，保留调用及输出的可追溯关系。
  - 修正多协议流式工具调用的身份和参数解析，改善 Gemini 与 Responses 的历史转换。
  - 保留 Responses 原生推理项的摘要、加密内容和顺序，支持会话冷恢复，并修正中断响应在同一回合中的续接。
  - 保留原生消息阶段，修正流式消息完成与回合终态之间的投影，避免将未知阶段推断为最终回答。
  - 修正完成消息快照的公开通知与持久化，确保无增量或仅收到部分增量时，实时视图与冷恢复仍显示完整正文。
  - 同步推理项完成快照，正确区分缺少正文与显式空内容，并保持摘要、正文及恢复视图一致。
  - 完善消息中的文件、技能和命令引用，以及预览标签关闭后的导航恢复。
  - 修正原生文件打开、附件草稿恢复、侧栏导航和面板尺寸变化时的交互。
  优化与重构
  - 收敛 Composer 布局、命令和附件控制，移除旧工具栏、独立图片附件实现及重复文件管理入口。
  - 统一文件编辑、预览、终端和摘要的侧面板标签与生命周期，沿用当前 App Server 和工具执行边界。
  - 将工具与原生响应历史统一到现有模型历史边界，拆分调用参数和会话输入提交逻辑，减少重复实现。
  测试与质量
  - 补充会话续接、中断、完成、工具历史、原生附件、文件编辑与后台终端的回归和公共 JSON-RPC 场景。
  - 同步五语言界面资源、命令契约和 Electron 测试夹具。
  - 修正共享侧栏与外部进程流式测试夹具，增强 macOS 公证票据临时断连和 Windows 自动更新导航的发布验证。
  文档
  - 更新架构、桌面行为证据及 GUI、运行时和插件执行计划，保留尚未完成的对齐范围与验证边界。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.163.0。
  完整变更：v1.162.0 → v1.163.0
