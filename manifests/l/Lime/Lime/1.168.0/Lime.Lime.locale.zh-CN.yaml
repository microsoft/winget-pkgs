ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.168.0
  新功能
  - 浏览器批注增加元素、区域和文本选择，支持附图、标记显隐、原图查看及 CSS/文本设计预览，并沿会话提交反馈。
  - 增加浏览器下载管理页，支持搜索、分页、进度展示、文件操作及中断恢复；Agent 可按历史访问权限查询浏览记录。
  - 增加存储用量查看与分类清理，集中管理本地缓存和历史数据。
  - 增加浏览数据清理，可按支持的时间范围处理历史、下载记录、站点数据和缓存，并明确提示不支持的选项与部分失败。
  - 增加新聊天的回复详细程度与推理摘要默认配置，支持聊天和回合覆盖，并遵循模型实际能力。
  - 增加 Git 与工作树设置、受管理工作树清单及清理操作，支持自定义快捷键。
  - 语音设置增加听写词典、历史记录与音频回放，集中管理麦克风、模型和处理偏好。
  - MiniMax M Plan 默认使用 M3.1 Flash，更新官方订阅入口和模型目录，并支持 Flash/M3 的图像输入识别。
  - 按官方当前资料更新 OpenAI、Claude、Gemini、Kimi、GLM、Qwen、DeepSeek、Grok 与 MiMo 的新建配置默认值和内置模型元数据，同步图片能力与上下文窗口。
  修复
  - 浏览器权限保存时校验配置版本与字段旧值，避免旧界面覆盖新权限，保存失败保留编辑草稿。
  - 加强批注页面与编辑器身份、导航失效、输入焦点和草稿版本校验，防止过期操作回流。
  - 记忆提取遵循会话来源偏好，统一全局指令读取与编辑入口。
  - 已解决的服务端交互通知不再被误报为未知事件；缩小请求分发的异步栈占用。
  优化与重构
  - 将设置整理为个人、集成与编码分组，统一页面控件与搜索导航，精简重复记忆和 Soul 设置入口。
  - 拆分浏览器批注、设计预览、审批和下载职责，保持既有 Electron、App Server 与 RuntimeCore 主链。
  - 同步协议、生成客户端和简体中文、繁体中文、英语、日语、韩语资源。
  - 清理过时模型目录、旧 OAuth 默认配置及三个接口中的重复模型表；SenseNova 与 Submodel 使用账户可用模型，移除未核实的旧推荐值。
  测试与质量
  - 扩展批注、设计预览、下载恢复、权限冲突、听写、工作树及设置导航回归与真实进程夹具。
  - 本版交付已实现增量；完整原生浏览器能力及完整 Codex GUI 对齐继续以专项验收为准。
  文档
  - 更新架构、命令边界、浏览器专项记录及发布验证计划。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.168.0。
  完整变更：v1.167.0 → v1.168.0
