ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.153.0
  新功能
  - CLI exec 支持恢复与分叉会话：可按 ID、精确名称或最近会话选择，保留共享历史与分叉关系；支持图片输入、--output-schema 和成功后的最终消息文件。
  - CLI exec review 支持审查未提交改动、相对分支的改动、指定提交或自定义指令，通过共享 review/start 执行并使用同一终端输出合同。
  - 增加共享原始推理显示配置。GUI/TUI 默认只显示摘要，显式开启后展示原文；CLI 可独立隐藏推理输出。
  - TUI 输入框增加推理强度提示、一次性动画和状态栏过渡，并支持关闭动画。
  修复
  - 修复分叉会话缺失后续通知，以及冷恢复后再次分叉的投影身份冲突，保留历史 Turn/Item 身份和源会话内容。
  - 修复桌面推理夹具中的重复 Item；实时显示、重载与历史恢复使用同一身份和完整内容，摘要与原文按配置分别展示。
  - 修复补全弹窗对修饰 Enter、重复按键和控制键的处理，避免误提交或抢占编辑操作；空补全列表可正常接纳和关闭。
  - 修复空输入框的左方向键导航，尊重编辑器/Vim 按键重绑与解绑，并同步底栏提示。
  - 修复终端测试读取多字节文本时的分片解码，并让选择、排序和退出验证等待实际屏幕状态。
  优化与重构
  - 非交互 CLI 执行迁入独立 exec owner，统一工具、计划、错误、用量和推理输出；JSONL 使用机器事件，stdout/stderr 保持清晰职责。
  - 恢复、分叉、stdin 编码处理与最终消息输出复用共享合同；失败或中断时保留原有输出文件，文件写入失败明确返回错误。
  - 文件与技能补全弹窗迁至各自领域目录，推理动画、投影和分叉恢复拆分为独立模块；桌面、CLI 和 TUI 继续共享 App Server 与 canonical Thread/Turn/Item。
  - 延续上一版 Windows 发布门禁修复，确保真实入口执行，并强制上传必要发布证据。
  测试与质量
  - 补充共享配置、推理显示、CLI 机器事件与打包 schema、会话分叉和 TUI 补全/动画回归。
  - 扩展真实 stdio、PTY、npm launcher 和 Electron 夹具，覆盖身份、冷恢复、图片字节、结构化输出合同与终端恢复。
  - 本版实际发布门禁结果和未验证平台范围记录在发布执行计划中。
  文档
  - 更新 CLI/TUI 操作说明、npm 包文档、共享配置、命令边界、架构图和 Codex 对齐结构 inventory。
  其他
  - 发布版本统一为 1.153.0；历史发布说明通过 Git 历史和 GitHub Release 查询。
  完整变更：v1.152.0 → v1.153.0
