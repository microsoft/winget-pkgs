ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.155.0
  新功能
  - TUI 支持按回答、代码块和显示源块进行语义复制，并提供状态复制选择器、Markdown/HTML 格式与窄屏按键提示。
  - 历史阅读和复制模式支持吸收分页内容，保留阅读位置、鼠标选区和分组快照，加载旧消息后可继续导航或返回最新内容。
  - 共享 App Server 为命令提供读取、搜索和目录列表动作，实时通知、会话恢复与历史分页使用同一份投影。
  修复
  - 修复连续 ASCII/IME 输入、短 IME 前缀后的 Tab 和断线草稿编辑；输入突发处理先于绘制，减少调度延迟造成的正文分段。
  - 修复终端缩放与外部编辑器归还后的布局和首键处理；tmux 漏发尺寸通知时可自动重排画面。
  - 修复异步复制、图片粘贴和跨页面反馈的归属，避免晚到结果影响新会话、选区或草稿；原生剪贴板所有权由统一 worker 保持。
  - 命令生命周期保留实际执行 argv、工作目录和 process identity，轮询与 stdin 续接共用原调用事实；准备失败、静默命令和输出尾部均保持一次开始/完成。
  - 修复终端交互记录在完成或恢复时丢失的问题，实时、读取、分页和进程重启后的冷恢复共享完整快照。
  优化与重构
  - 统一终端 geometry、输入时钟、绘制门禁、剪贴板调度与阅读快照的 owner，直接替换重复入口。
  - 收敛命令解析、执行会话和 canonical 投影，拆分大型模块；GUI、CLI 与 TUI 继续共用 App Server 和 RuntimeCore。
  测试与质量
  - 扩充命令实际执行、CLI stdio、TUI PTY、历史分页、剪贴板和 tmux 缩放回归，覆盖 canonical 身份、一次完成和终端恢复。
  - 发布验证使用固定候选与独立构建产物；平台证据按实际运行范围记录，Windows/Linux 原生剪贴板及 live provider 不由 macOS 结果代替。
  文档
  - 同步全局架构、命令边界、TUI 结构清单与执行计划，记录 current owner、删除路径和剩余验收范围。
  其他
  - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.155.0。
  完整变更：v1.154.0 → v1.155.0
