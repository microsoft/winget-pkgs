ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.171.0
  新功能
  - 增加 Computer Use 设置、适配器安装与授权管理入口，扩展共享 App Server 下的 Chrome、Excel/Office 接线与 CLI 资源打包。
  - 增加 macOS Computer Use 光标与 Windows 光标资源，以及 Chrome 扩展会话、标签组和五语言界面。
  修复
  - 修复会话浏览器选中标签与页面地址的持久化恢复，完善导航及站点权限处理。
  - 修复中文 Markdown 链接识别，调整 MCP 工具活动与消息时间线展示。
  - 完善应用退出清理、工具输出转换、模型目录元数据与基础聊天协议默认能力处理。
  优化与重构
  - 外观统一为浅色、深色与跟随系统，删除自定义主题、皮肤、随机切换及首页装饰。
  - 清理旧个人风格配置、档案页面及重复 Skills 入口，同步协议、生成客户端、设置搜索与五语言文案。
  - 调整会话侧栏、输入区和本地会话页面，保留 Lime 品牌、多模型、专家广场与消息渠道边界。
  测试与质量
  - 更新浏览器恢复、工具输出、Computer Use、Chrome/Office 与界面定向回归和验证夹具。
  - 按用户要求优先提交、打标签并推送；本轮验证及未执行的 GUI、Rust、跨平台打包验收见发布执行记录，不代表完整平台验收通过。
  文档
  - 同步架构、命令边界、源码对齐规则与相关执行计划。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.171.0。
  完整变更：v1.170.0 → v1.171.0
