ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.167.0
  新功能
  - 浏览器网页与 Files、Changes 共用工作区标签，增加网址输入、页面查找、设备视口与原生菜单交互。
  - 增加网页批注与截图上下文，可将选中的页面内容和反馈交给会话。
  - 增加浏览历史管理及浏览器偏好、下载和 Agent 站点权限配置。
  修复
  - 文件点击直接打开磁盘或会话存储中的原件，正确处理空文件、同名路径和异步切换。
  - 修正文件批注重开、定位和编辑草稿保留，以及工具文件按钮和变更审阅的目标路径。
  - 加强浏览许可与危险网页操作的分阶段审批，拒绝过期控制权、重复 token 和跨作用域请求。
  优化与重构
  - 将文件预览、目录状态和宽度交互收敛到 Files，移除重复 Canvas 预览和无人调用的文件打开入口。
  - 拆分浏览器 Host 的页面、历史、权限、批注与覆盖层职责，同步 Electron IPC、typed gateway 和命令目录。
  - 浏览器和文件交互文案覆盖简体中文、繁体中文、英语、日语和韩语。
  测试与质量
  - 扩展浏览器权限、历史、标签身份、文件路径、批注和编辑生命周期的回归与真实 Electron 场景。
  - 完整原生密码、自动填充、资料导入、扩展生态及完整 Codex GUI 对齐仍以专项计划的实际验收为准。
  文档
  - 更新浏览器、Files 和共享运行时的架构、实施边界与专项验证记录。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.167.0。
  完整变更：v1.166.0 → v1.167.0
