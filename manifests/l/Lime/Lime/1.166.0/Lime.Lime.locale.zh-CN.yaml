ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.166.0
  新功能
  - 新增实验性的本地线程存储后台压缩，可压缩闲置历史并在继续对话时恢复写入；默认关闭，通过统一 App Server 合同管理。
  - 浏览器偏好支持控制链接打开位置，聊天中的链接、网站产物和原生浏览器标签复用同一打开流程。
  修复
  - 修正历史读取中的浮点耗时精度变化，避免后台命令结束后归档线程被完整性校验错误拒绝。
  - 修正线程归档、恢复和回滚中的文件移动、时间戳与历史读取边界，保持同一线程的持久化身份。
  - 完善网站产物与本地 HTML 的打开行为，保留来源标签、工作区上下文和迟到导航保护。
  - 修正文件预览、Markdown 链接、浏览器偏好和键盘快捷键设置中的交互与测试覆盖。
  优化与重构
  - 将线程归档、元数据和压缩维护拆入现有领域模块，统一 writer 锁与维护任务，避免压缩与活跃写入竞争。
  - 将输出浏览收敛到工作区侧面板，移除重复的工作台文件面板、标签状态和旧 selector。
  - 同步 Electron IPC、公共 JSON-RPC schema、TypeScript/Rust 客户端与命令目录。
  测试与质量
  - 扩展后台压缩、线程生命周期、链接打开、网站标签和浏览器偏好的定向回归与真实进程验证。
  - 完整 Codex 对齐、TUI、live provider 及其他未执行场景仍以专项记录的实际验收边界为准。
  文档
  - 更新共享运行时、线程存储与 GUI 结构的架构和执行记录，保留历史失败及未关闭问题。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.166.0。
  完整变更：v1.165.0 → v1.166.0
