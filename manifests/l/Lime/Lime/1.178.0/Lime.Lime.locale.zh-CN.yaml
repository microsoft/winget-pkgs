ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.178.0
  新功能
  - 工作区增加 Git 提交、分支创建、逐行归属查看，以及 Pull Request 创建、打开、状态查询与合并操作。
  - 增加全局命令菜单、文件搜索、聚焦入口与听写交互，完善桌面快捷键。
  - 内置浏览器支持从 Chrome 导入扩展、历史记录与 Cookie，增加扩展工具栏与快捷键操作。
  - 设置增加通知分组和独立扩展管理，联系人自动填充支持多条邮箱、电话与地址。
  修复
  - 完善会话路径解析、未读状态、工作区文件侧栏与审阅状态同步。
  - 修正实时语音能力与模型连接的处理，补充公共 JSON-RPC 回归。
  - 修复桌面构建输入追踪与渲染产物处理，完善工作区 Git 操作的失败反馈。
  优化与重构
  - 同步 Git 工作流的 App Server 协议、JSON Schema、生成客户端与桌面消费者。
  - 更新补丁应用、命令解析、安全判定与执行策略实现，并接入 CLI 和 App Server 进程加固。
  - 精简桌面导航与设置，删除专家广场、消息渠道及旧版浏览器自动填充实现。
  - 同步简体中文、繁体中文、英文、日文和韩文界面资源。
  测试与质量
  - 增加 Git、命令菜单、文件搜索、Chrome 导入与通知设置回归。
  - 发布验证、平台打包、签名、公证与更新结果记录在本次执行计划和 Release 流水线中。
  文档
  - 更新仓库产品边界，取消专家广场与消息渠道的保留例外，并记录本次发布范围与验证。
  其他
  - 应用、CLI、Rust workspace 与 Cargo 锁文件版本统一为 1.178.0。
  - 官方发布平台为 macOS arm64/x64 与 Windows x64。
  完整变更：v1.177.2 → v1.178.0
