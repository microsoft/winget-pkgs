ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.159.0
  新功能
  - 设置页新增未保存更改保护，覆盖记忆、网页搜索、环境、执行策略、个人资料和服务商配置，离开前可继续编辑或放弃草稿。
  修复
  - 设置保存只合并实际编辑的字段，避免覆盖其他设置；保存失败、在途新编辑和语言切换时保留输入。
  - 修复从设置返回会话时输入框未恢复，以及初始技能表单被导航重置清除的问题。
  - 设置章节、返回和首页动作使用统一导航，恢复实际会话并避免重复执行一次性启动意图。
  优化与重构
  - 拆分设置页的草稿生命周期、配置合并和展示组件，统一导航保护与安全错误提示。
  - 个人资料聚焦显示名称和简介，增加输入限制与换行归一化，移除旧标签、完成度、头像和邮箱展示及未使用字段。
  - 复用现有配置与 App Server 边界，保持会话、运行时和持久化的唯一职责归属。
  测试与质量
  - 扩充未保存导航、字段合并、失败保稿、在途编辑、会话恢复和五语言回归。
  - 增强真实 Electron 设置导航、保存、冷启动读回与正常退出检查，并同步构建新鲜度和证据护栏。
  - 增加 Rust 个人资料序列化回归，确保已移除字段不再写回配置。
  文档
  - 更新设置导航、配置草稿、个人资料结构的架构图、分析账本与验证记录，明确本地资料编辑和后续公共身份能力边界。
  其他
  - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.159.0。
  完整变更：v1.158.0 → v1.159.0
