ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.179.0
  新功能
  - 增加快速记录、截图入口与侧边聊天面板，完善全局听写和桌面导航快捷键。
  - 插件目录卡片显示内置插件版本，便于核对安装内容。
  修复
  - 修复新迁入依赖的安全审计问题，升级凭据加密、缓存、DNS 与本地用户核验依赖。
  - 修复 Windows 插件安装缓存重命名与并发修改锁的处理，完善安装状态和用户目录隔离。
  - 修正 Windows CLI 执行策略测试的线程栈、平台依赖与终端路径处理。
  - 完善补丁应用、远端文件修改与执行权限边界，统一补丁解析和应用入口。
  优化与重构
  - 迁入并适配上游 shell、sandbox、执行服务、协议、状态与历史存储等基础模块，沿现有 App Server 与工具边界接入。
  - 统一文件搜索、HTTP/TLS、路径与基础工具模块，删除被替换的补丁、命令解析和沙箱重复实现。
  - 增加 AccountProvider 契约，继续使用 Lime 自有账号服务，保留多模型、多协议与多模态 Provider 边界。
  - Rust 工具链更新为 1.100.0，同步 workspace 依赖和发布构建配置。
  测试与质量
  - 补充桌面快捷键、快速记录、截图、侧边聊天与插件安装回归。
  - 完善 Windows 打包验证的用户数据隔离、构建依赖和平台差异处理。
  - 验证范围与结果记录在本次执行计划及 Release 流水线中。
  文档
  - 更新源码迁移、现役模块归属与能力差距记录。
  其他
  - 应用、CLI、Rust workspace 与 Cargo 锁文件版本统一为 1.179.0。
  - 官方发布平台为 macOS arm64/x64 与 Windows x64。
  完整变更：v1.178.0 → v1.179.0
