ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.162.0
  新功能
  - 统一窗口页头与工作区标签，整合会话动作和右侧面板入口，支持分隔条拖动与键盘调整。
  - 新增基于会话事实的摘要面板与固定偏好，让会话概览和工作区内容共用当前状态。
  - 支持远端插件及逐技能启停，列表和预览共享账号偏好，保存后重新读取安装事实。
  修复
  - 修正 Responses 流式工具调用的身份关联与终态去重，避免将参数事件识别为额外调用。
  - 修正工具历史截断、预算和读取结果投影，保留工具调用与输出的关联及原始记录。
  - 上下文压缩改为由当前模型生成摘要，补齐取消、持久化及分叉历史的相关处理。
  - 修正会话分叉导航的草稿作用域提交，避免父子会话草稿相互影响。
  - 加强插件偏好操作的账号隔离、失败保留和刷新处理；需要 Apps 授权的技能保持受控禁用。
  优化与重构
  - 收敛远端插件目录、详情与安装事实的来源，保持本地运行时配置和远端账号偏好的领域边界。
  - 以共享页头、标签和摘要实现替换旧任务中心标签与 Activity 面板，删除首页无消费的回调和派生状态。
  - 将上下文压缩、历史归一化、Hook 生命周期等逻辑拆入现有领域模块。
  测试与质量
  - 补充工作区布局、摘要固定、插件偏好、工具调用身份与历史预算回归，以及相关 Electron 和公共 JSON-RPC 场景。
  - 同步五语言界面资源及受影响的契约和夹具。
  文档
  - 更新架构图、桌面结构证据和运行时、插件专项执行计划，保留未完成范围及验证边界。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.162.0。
  完整变更：v1.161.0 → v1.162.0
