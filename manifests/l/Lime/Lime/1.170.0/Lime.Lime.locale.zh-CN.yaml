ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.170.0
  新功能
  - 插件设置整合插件、Skills 与 MCP 管理，增加 Hooks 配置入口，并同步设置搜索与导航。
  - 常规设置补充消息发送按键、关闭窗口确认与任务运行期间防休眠偏好，完善语言选择和快捷键序列编辑。
  - 本地环境增加会话菜单中的环境选择、最近动作、setup 编辑与动作执行入口。
  - 浏览器补充地址建议与菜单、站点设置、页面输入、选择和拖拽，以及持续 CDP 事件通道。
  - 增加 Computer Use 配置、适配器状态、授权、撤销与执行租约的共享协议和工具接线；完整平台能力仍按专项计划验收。
  修复
  - 修复浏览器首次打开时的工作区与原生页面接线，并加强 CDP 事件来源、站点权限及应用网络策略校验。
  - 完善本地环境脚本的 shell 环境继承、执行状态与会话动作接线。
  - 本地 custom tool 按显式模型能力与实际 Responses wire 支持启用，支持 Lime 自有 endpoint；远端托管工具继续独立校验服务条件。
  - 收敛模型协议标识与错误类型命名，保留明确支持的第三方应用配置及 Skills 安装目标。
  优化与重构
  - 将执行策略及必要的绝对路径依赖接入 Lime 现役 Rust owner，保留源码来源与许可证记录。
  - 重组插件、MCP、Hooks 与本地环境相关组件，清理被替代的入口，并同步 App Server schema 和生成客户端。
  - 同步中文简体、中文繁体、英文、日文与韩文界面资源。
  测试与质量
  - 扩展浏览器、窗口偏好、快捷键、本地环境、Computer Use 与模型协议的定向测试和真实进程夹具。
  - 本地检查与尚未执行的平台、打包及 GUI 验收边界见本版执行计划；本发布说明不代表完整 Computer Use 或全平台验收通过。
  文档
  - 更新架构、命令边界、源码迁移记录与相关执行计划。
  其他
  - 应用、CLI 与 Rust workspace 版本统一为 1.170.0。
  完整变更：v1.169.0 → v1.170.0
