ShortDescription: 给中文创作者用的开源 AI 内容工作台
Description: |-
  Lime 是一个开源的 Electron 桌面端 AI 内容工作台，面向中文创作者、品牌运营、研究型写作者和小团队，覆盖 AI 写作、选题研究、素材管理、提示词沉淀、知识库和多模型创作流程。

  你可以把它理解成一个更适合长期创作的 AI 工作台：
  - 不是只问一句、答一句，而是围绕一个项目持续推进
  - 不是每次都重新找资料、重新写提示词，而是把参考、风格和做法沉淀下来
  - 不是生成完就散落在聊天记录里，而是把结果保存起来，下一次还能继续用
  - 不是绑定某一家 AI 服务，而是让你使用自己已经配置好的模型能力
  如果你经常在收藏夹、文档、聊天工具、图片工具和模型后台之间来回切换，Lime 想帮你把这些动作收回到同一个创作空间里。

  你可以用 Lime 做什么
  - AI 写作与内容创作：写公众号文章、小红书笔记、视频脚本、播客提纲和直播话术
  - 资料研究与知识整理：整理网页、笔记、截图、访谈和历史材料，生成报告或简报
  - 选题分析与内容复盘：拆解爆款案例、竞品内容、发布节奏和表达风格
  - 提示词管理与风格复用：保存常用写法、品牌语气、选题方法和团队模板
  - 多模态创作准备：生成图片提示词、封面方向、演示稿结构或网页草稿
  - 多模型工作流：使用自己配置的 AI 服务商和模型，在同一个任务里持续修改、扩写、压缩或换平台发布
ReleaseNotes: |-
  Lime v1.154.0
  新功能
  - 新增顶层 lime review，支持审查未提交改动、相对分支的改动、指定提交或自定义指令，复用共享 review/start 和终端输出。
  - TUI 问答与 MCP 表单使用统一文本编辑能力，保留每题/字段草稿、游标和长粘贴正文；支持回访修订、未回答确认和完整备注提交。
  - 外部编辑器等待期间保留 TUI 可见画面，返回后恢复输入、光标和终端模式；成功编辑可清空草稿。
  修复
  - 修复 ASCII 与 IME 字符连续输入的顺序，以及问答备注快速粘贴中的 Enter/Tab、长正文展开和切题保存。
  - 修复外部编辑器命令解析中的空参数、引号与反斜杠处理，使用平台解析器并提供五语言错误提示。
  - 修复跨目录恢复会话后外部编辑器仍使用启动目录的问题，临时正文跟随当前会话目录。
  - 修复 MCP 在 arbitrary-precision JSON 特性下漏分派标准进度通知；线程所属连接的显式工具调用保留表单交互 owner 与调用 scope。
  - 修正 Windows Terminal Shift+Enter 解码与 Console 输入模式恢复；平台专有行为仍需 Windows 实机验证。
  优化与重构
  - 优化终端绘制调度并启用布局缓存，避免重复输入接线和长期保留第二份画面状态。
  - 统一问答备注编码、兜底选项和确认键位，Vim 空主输入框的 / 可进入命令补全。
  - 收敛外部编辑器、MCP 表单和问答的 owner，直接替换旧解析与交接入口，保持 GUI/CLI/TUI 共用业务后端。
  测试与质量
  - 扩充真实 CLI stdio、TUI PTY、MCP 表单与外部编辑器可见帧回归，覆盖 canonical 身份、一次响应、输入/图片和终端恢复。
  - 终端门禁冻结本地构建产物并保留运行时兄弟文件，避免共享 target 重编译干扰测试；修复专用 MCP 场景组合路由。
  - Windows CI 使用精确的 current App Server filesystem/timeout 用例，并拒绝零测试伪绿。
  文档
  - 同步 CLI/TUI 操作说明、架构与命令边界、结构清单和执行计划；修复 Docs/Pages 生成与部署配置。
  其他
  - 桌面应用、CLI npm 包与 Rust workspace 版本统一为 1.154.0。
  完整变更：v1.153.0 → v1.154.0
