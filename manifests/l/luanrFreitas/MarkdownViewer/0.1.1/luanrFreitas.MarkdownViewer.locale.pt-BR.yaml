# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.6.0.schema.json
PackageIdentifier: luanrFreitas.MarkdownViewer
PackageVersion: 0.1.1
PackageLocale: pt-BR
Publisher: luanrFreitas
PublisherUrl: https://github.com/luanrFreitas
PublisherSupportUrl: https://github.com/luanrFreitas/MarkdownViewer/issues
PackageName: Markdown Viewer
PackageUrl: https://github.com/luanrFreitas/MarkdownViewer
License: GPL-3.0-or-later
LicenseUrl: https://github.com/luanrFreitas/MarkdownViewer/blob/master/LICENSE
ShortDescription: Dê duplo clique num arquivo .md e leia formatado na hora — sem editor, 100% offline.
Description: |-
  O Markdown Viewer é um app leve para Windows que renderiza arquivos .md como
  HTML formatado assim que você os abre, sem precisar de editor e sem depender
  de internet. Ele se associa aos arquivos .md/.markdown, suporta Markdown no
  padrão GitHub (tabelas, listas de tarefas, blocos de código com destaque de
  sintaxe, imagens), atualiza a visualização automaticamente quando o arquivo
  é alterado em disco e mantém uma lista dos últimos arquivos abertos.
Tags:
