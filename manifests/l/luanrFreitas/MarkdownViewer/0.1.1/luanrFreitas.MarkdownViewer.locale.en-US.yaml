# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.6.0.schema.json
PackageIdentifier: luanrFreitas.MarkdownViewer
PackageVersion: 0.1.1
PackageLocale: en-US
Publisher: luanrFreitas
PublisherUrl: https://github.com/luanrFreitas
PublisherSupportUrl: https://github.com/luanrFreitas/MarkdownViewer/issues
PackageName: Markdown Viewer
PackageUrl: https://github.com/luanrFreitas/MarkdownViewer
License: GPL-3.0-or-later
LicenseUrl: https://github.com/luanrFreitas/MarkdownViewer/blob/master/LICENSE
ShortDescription: Double-click a .md file and read it formatted instantly — no editor, fully offline.
Description: |-
  Markdown Viewer is a lightweight Windows desktop app that renders .md files as
  formatted HTML the moment you open them, with no editor and no internet
  connection required. It associates itself with .md/.markdown files, supports
  GitHub-Flavored Markdown (tables, task lists, syntax-highlighted code blocks,
  images), reloads automatically when the open file changes on disk, and keeps
  a list of recently opened files.
