# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# Installer-Manifest fuer das MSI aus dem Release-Workflow.
# Zielort: manifests/l/LeonAchteresch/l8db/<PackageVersion>/LeonAchteresch.l8db.installer.yaml
#
# Artefaktname: Tauri/WiX benennt das MSI "<productName>_<version>_<arch>_<language>.msi",
# der Windows-Job in .github/workflows/release.yml baut ohne --target, also x64:
#   l8db_<version>_x64_en-US.msi
# (Der NSIS-Installer l8db_<version>_x64-setup.exe wird zwar ebenfalls gebaut und
#  vom Updater bevorzugt (updaterJsonPreferNsis: true), fuer winget ist das MSI aber
#  die robustere Quelle: feste ProductCode-/Upgrade-Semantik statt NSIS-Heuristik.)
#
# PRO RELEASE ZU AKTUALISIEREN: PackageVersion, InstallerUrl, InstallerSha256, ReleaseDate.
# InstallerSha256 unten ist ein PLATZHALTER. Ermitteln mit:
#   Get-FileHash .\l8db_0.1.0_x64_en-US.msi -Algorithm SHA256
# oder komplett automatisch:
#   wingetcreate update LeonAchteresch.l8db --version 0.1.0 --urls <installer-url>

PackageIdentifier: LeonAchteresch.l8db
PackageVersion: 0.4.1
InstallerLocale: en-US
MinimumOSVersion: 10.0.17763.0
