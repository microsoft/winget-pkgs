ReleaseNotes: |-
  DeepRant 2.0.3
  游戏内嘴臭交流，自动翻译多语言。
  - 修复 #69：Dota 2 原位翻译无法复制。恢复旧版选择整条聊天的方式，读取原文与准备“翻译中”占位均使用全选，不再依赖行首 / 逐字选择。模型返回后仍只核验当前选区，文字、选区或焦点改变就停止替换。
  - Dota 2 使用方法：主页选择 Dota 2 场景，输入方式选 自动 或 原位翻译；在游戏聊天框输入原文后按翻译快捷键，检查译文再自己发送。无需切换输入浮窗。日常文档仍先选中文字并使用日常模式。
  - 修复 #65：设置读取失败导致所有页面报错。兼容旧模型缓存中的界面状态；真正无法解析的配置可在主窗口确认后，先完整备份设置，再恢复默认值。备份失败不重置，系统凭据库的 Key 保留，界面显示备份位置。
  - 三平台安装包与签名更新归档沿用现有验收链；macOS 使用同组织 Developer ID 签名、公证与装订，全部平台校验后公开。
  正常设置、个人 Key、自定义提示词、快捷键与原版游戏录屏保留；显式恢复默认值会重置设置，原始文件留在备份中。macOS 需允许辅助功能输入，Windows 应与游戏使用相同权限级别。Dota 2 游戏现场及 #65 报告者配置尚待玩家确认，不把自动回归与安装验收视为游戏实测。
