ReleaseNotes: |-
  DeepRant 2.0.1
  游戏内嘴臭交流，自动翻译多语言。
  - 处理 #64：星际公民 / Star Citizen。选择“星际公民”与“自动”输入，快捷键默认打开原生游戏输入浮窗，不依赖复制游戏聊天框中的文字。
  - 先在游戏中打开空聊天框，再触发快捷键；在浮窗中写消息、翻译并确认回填，最后自己发送。保留船名、航点、职业与频道交流语境，日常模式和手动选择的输入方式不变。
  - 输入使用现有 Rust 系统接口，保留原窗口身份与焦点核验。没有修改游戏文件、游戏 hook 或自动发送；EAC 兼容与游戏现场由玩家验收，不能把系统安装测试当成反作弊认证。
  - 三平台安装包与签名更新归档重新生成，沿用 CCBaga 的发布验收链；macOS 使用同组织 Developer ID 签名、公证与装订，全部平台校验后公开。
  原有设置、个人 Key、自定义提示词、快捷键与原版游戏录屏保留。首次使用请填写自己的模型 Key；macOS 需允许辅助功能输入。游戏现场与视觉效果由玩家验收。
