ShortDescription: Офлайн-конвертер файлов в трее — тащите файл, нажмите Пробел и бросьте его на формат.
Description: |-
  DropWheel — бесплатный офлайн-конвертер файлов для Windows 10/11, живёт в трее.
  Тащите файл, нажмите Пробел — под курсором появится колесо форматов; бросьте файл на сектор,
  и рядом с исходником появится сконвертированный файл. То же колесо открывается из пункта
  «Конвертировать…» в контекстном меню проводника. Фото (HEIC, AVIF, WebP, JPG, PNG), видео и звук, GIF,
  PDF (склеить, разбить, страницы в картинки), архивы и документы. Внутри — ffmpeg, ImageMagick, qpdf,
  poppler и 7-Zip. Без регистрации и телеметрии, исходный файл не меняется.
