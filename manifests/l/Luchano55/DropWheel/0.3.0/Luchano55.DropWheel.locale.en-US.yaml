ShortDescription: Offline file converter in the tray - drag a file, press Space, drop it on a format.
Description: |-
  DropWheel is a free offline file converter for Windows 10/11 that lives in the tray.
  Drag a file, press Space and a wheel of formats appears under the cursor; drop the file on a sector
  and the converted file appears next to the original. The same wheel opens from "Convert..." in the
  Explorer right-click menu. Photos (HEIC, AVIF, WebP, JPG, PNG), video and audio, GIF, PDF (merge,
  split, pages to images), archives and documents. Built on ffmpeg, ImageMagick, qpdf, poppler and 7-Zip,
  which are bundled. No account, no telemetry, the original file is never changed.
