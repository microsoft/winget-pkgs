ReleaseNotes: |-
  Zevria v0.4.0
  Desktop and terminal transcripts now share bulk folding behavior. You can change thinking effort without losing the current conversation’s reasoning history and configure service tiers separately for each Responses model.
  Breaking Changes
  - Root Build’s edit, write, and delete can now operate outside the startup workspace; restrict OS permissions if you relied on the old workspace boundary.
  - Desktop’s ⇧⌘R folds earlier content once instead of keeping a final-outputs-only view on; run it again to fold newly added content.
  - Responses tiers are no longer sent for token counting or compaction; existing tier settings still apply to generation.
  Features
  - Fold individual messages, blocks, and ranges in Desktop, or use the same bulk fold actions as in the terminal.
  - Open the session-only model and thinking-effort picker with Alt+M in the terminal or ⌃⌘M on Desktop.
  - Set service_tier for each Responses model in models.jsonc; omit it to inherit the provider tier or set it to null to opt out.
  Bug Fixes
  - Changing only thinking effort now preserves native reasoning and conversation history.
  - Valid Plan titles and question option labels are no longer rejected solely for word count.
  Improvements
  - Bulk folding hides thinking in the newest turn’s final eligible entry without hiding its answer.
  - First-run templates use gpt-6.2-astra for Plan and Build and gpt-6.2-sol for Review, without rewriting existing settings.
  Build and Dependencies
  - The exact-version Desktop Markdown parser override avoids the unused-patch warning on locked CLI installs.
  - Release CI verifies the bytes of uploaded assets against that run’s build bundle.
  - Standalone archives contain the CLI only; the macOS Desktop app is built from source.
