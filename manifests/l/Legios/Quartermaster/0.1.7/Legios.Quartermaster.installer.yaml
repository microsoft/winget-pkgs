  # JavaScript. La arquitectura la pone el Node de la máquina.
  - Architecture: neutral
    InstallerUrl: https://github.com/legiosai/quartermaster/releases/download/v0.1.7/quartermaster-0.1.7-setup.exe
    InstallerSha256: 7E913C9F6C2DA6EB42E63E408FC29CEB247E75F489517A5F54B7E8E103CF89AA
ManifestType: installer
ManifestVersion: 1.6.0
