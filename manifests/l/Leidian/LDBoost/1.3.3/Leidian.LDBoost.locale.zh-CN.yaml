Description: |-
  雷电加速器是一款游戏网络加速工具，无需开通会员或观看广告即可使用加速服务。

  系统要求：Windows 10 或 Windows 11，Intel/AMD 64 位操作系统（x64）。

  通过智能路由算法接入全球加速节点，优化游戏网络连接，帮助降低延迟，改善网络波动、丢包和掉线问题。

  提供一键加速，支持 PUBG（绝地求生）、Apex、CS2、英雄联盟、Dota 2、永劫无间、彩虹六号、战地系列等热门游戏。

  使用过程中遇到问题或有任何建议，可通过客户端内的意见反馈联系我们。
