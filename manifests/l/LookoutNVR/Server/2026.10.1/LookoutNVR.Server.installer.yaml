# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
PackageIdentifier: LookoutNVR.Server
PackageVersion: 2026.10.1
InstallerType: inno
Scope: machine
ElevationRequirement: elevationRequired
InstallModes:
  - interactive
  - silent
  - silentWithProgress
# The recorder is framework-dependent on BOTH shared frameworks in its runtimeconfig.json:
# Microsoft.NETCore.App and Microsoft.AspNetCore.App. The ASP.NET Core runtime package does not
# carry the base runtime, so both are listed. Runtime.10 alone installs a service that cannot start.
# No SDK: that is a build tool, never needed on the box that runs the recorder.
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.DotNet.Runtime.10
    - PackageIdentifier: Microsoft.DotNet.AspNetCore.10
    - PackageIdentifier: Microsoft.VCRedist.2015+.x64
      MinimumVersion: 14.40.0.0
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/LookoutNVR/downloads/releases/download/v2026.10.1/LookoutNVR-Server-2026.10.1-x64.exe
    InstallerSha256: 1DD374150C7BE0D1BE61AC9090060DCF64C74F104E85CB835AF5987CD5E8B31F
    InstallerSwitches:
      Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
      SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART
      InstallLocation: /DIR="<INSTALLPATH>"
      Log: /LOG="<LOGPATH>"
    UpgradeBehavior: install
    # Matches the installed product by its Add/Remove Programs key (the Inno AppId), not by
    # publisher or display name. That is what keeps `winget upgrade` working for existing
    # customers if the company, the publisher string or the download host ever changes.
    ProductCode: '{A7E3F4B1-9C2D-4E6A-B8F0-1D3E5A7C9B2F}_is1'
ManifestType: installer
ManifestVersion: 1.9.0
