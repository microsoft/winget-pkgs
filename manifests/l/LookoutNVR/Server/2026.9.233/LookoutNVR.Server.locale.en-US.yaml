ShortDescription: AI-powered network video recorder with real-time object detection.
Description: |-
  LookoutNVR is a self-hosted network video recorder with built-in AI object
  detection. It records unlimited IP cameras over RTSP, detects people,
  vehicles and animals locally on your own hardware, and keeps everything on
  your own disks. Nothing is uploaded and no account is required.

  This package is the recorder, which runs as a Windows Service. It installs
  the LookoutNVR Desktop viewer alongside it so the machine can watch its own
  cameras; to watch from another PC, install LookoutNVR.Desktop there.

  - Unlimited IP cameras (RTSP, ONVIF discovery)
  - AI object detection running locally, no cloud and no subscription
  - Continuous recording with configurable retention, plus per-camera
    "keep everything for N hours, then events only"
  - Detection zones, per-camera classes and confidence
  - Push notifications via ntfy, email alerts
  - WebRTC live streaming, hardware-accelerated decoding where available
  - Everything needed is bundled, including FFmpeg and the detection model
