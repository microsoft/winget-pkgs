ShortDescription: Desktop viewer for a LookoutNVR server - live wall, playback and event review.
Description: |-
  The LookoutNVR desktop client. Connects to a LookoutNVR server on your network
  and gives you the live camera wall, recorded playback with a scrubbable
  timeline, and event review with AI detections.

  Install it on any Windows 11 PC that watches the cameras; the server is a
  separate package (LookoutNVR.Server) and only needs installing once.

  - Live wall with per-camera health
  - Smooth (WebRTC) live, or snapshot fallback
  - Recorded playback, zoom, frame and clip export
  - Event review with detection filters and a motion heatmap
