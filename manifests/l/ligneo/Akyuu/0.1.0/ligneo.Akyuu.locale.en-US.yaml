ShortDescription: Desktop anime tracker that syncs with AniList, Kitsu and MyAnimeList
Description: |-
  Akyuu is an open-source desktop anime tracker. It detects the anime videos you watch on your
  computer and synchronizes your progress with AniList, Kitsu or MyAnimeList. It helps you manage
  your anime library, follow the season, share watched episodes and download new ones.
  Akyuu is a fork of Taiga by Eren Okka.
