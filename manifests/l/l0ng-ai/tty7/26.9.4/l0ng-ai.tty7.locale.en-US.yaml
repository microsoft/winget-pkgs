- remote
- sftp
- ssh
- terminal
ReleaseNotes: |-
  tty7 installs tty7-server on a remote host by itself — download it by hand only for an offline box. SHA-256 for every file: checksums.txt
  Want the latest fixes before the next release? Try the nightly build.
  What's new
  The built-in code editor grows into a real one: language servers, multiple cursors, git change markers, a symbol outline, a split view, quick open and a redesigned find bar with replace. The whole window was redesigned, settings moved into a window of their own, and the command palette became Search Everywhere, with tabs for terminals, past agent sessions, hosts and commands.
  The right panel gains a GitHub tab for issues and pull requests, including a pull request's checks and reviews. Tabs can be put to sleep to free their memory, and files dropped onto a remote pane are uploaded there. Qoder CN, Prime Agent and Empryo join the supported agents.
  New Contributors
  - @CodeHourra made their first contribution in #957
  - @kalpakprod made their first contribution in #975
  Full changelog — 18 added, 18 changed, 4 removed, 19 fixed
  Added
  - Language servers in the code editor: diagnostics, hover, completion, go to definition (#1002)
  - Multiple cursors, git change markers, symbols and a split in the code editor (#1002)
  - Quick open, Go to Line, New File and Save As in the code editor (#984)
  - Find in files, from the right panel's Files tab
  - A GitHub tab in the right panel for issues and pull requests
  - A pull request's checks, reviews and merge state in the GitHub tab (#1000)
  - The GitHub tab tries every signed-in gh account (#987)
  - Put a tab to sleep to free its memory, and wake it where it was (requested by @showyourlucky in #762)
  - A file pasted or dropped into a remote pane is uploaded there (#1004)
  - Quick launch for the coding agents on your PATH (requested by @CodeHourra in #955)
  - The New Tab menu names the agents you actually run (requested by @CodeHourra in #955)
  - Reorder the active tab from the keyboard
  - Switch a port forward off without losing its rule (requested by @junyi-deep in #439)
  - Windows file paths are links, quoted paths may contain spaces, and links offer Open with Default App (requested by @lgc653 in #965)
  - A link a table wrapped inside its cell opens whole (#1001)
  - Qoder CN CLI support (by @ArnoChenFx in #988)
  - Prime Agent and Empryo are recognised; Antigravity reports its status (by @kalpakprod in #975)
  - A working agent's status dot blinks
  Changed
  - The window is redesigned (#973, #993)
  - Settings open in a window of their own, rebuilt (#973)
  - The command palette is now Search Everywhere, with tabs
  - Resume a past agent session from Search Everywhere
  - Search sits in the middle of the title bar (#990)
  - The code editor's header, menus and find bar match the rest of the window (#1005, #992)
  - Agent status catches interrupts, stale turns and permission prompts (#1003)
  - Every confirmation is tty7's own dialog, and failures say what failed (#985)
  - Every pick-one setting is a dropdown
  - The mouse wheel no longer zooms the font by default
  - The command-line ghost suggests what you ran last, not what you ran most
  - The sidebar groups tabs by repo automatically; pin what you want to keep (#955)
  - The New Tab menu names three shells, not every one the machine has
  - Saved SSH hosts live in servers.json (requested by @leoatchina in #911)
  - tty7 exec runs a command in an existing pane and returns its result (requested by @rrpolanco in #839)
  - tty7 send reads from stdin or a file, and can paste (requested by @rrpolanco in #838)
  - Changed files in source control can be filtered and shown as a tree (requested by @junyi-deep in #473)
  - The shell prompt can have its own cursor shape (requested by @rrpolanco in #958)
  Removed
  - The Window & Tabs settings page (folded into General)
  - The Open diff preview from sidebar counts setting
  - The By repo or folder grouping mode and "Group Automatically"
  - Editing a saved host's authentication, proxy, forwarding and advanced options in Settings (#973)
  Fixed
  - A host with Compression yes prints again (reported by @RedwindA in #997)
  - The OpenCode plugin loads on OpenCode 2.x (reported by @ArnoChenFx in #999)
  - The code editor no longer loses edits (#984)
  - Typing Chinese through an input method no longer crashes the code editor (#993)
  - Selecting text in rendered Markdown no longer blanks it out (#991)
  - The character under the cursor no longer disappears in vim and Neovim (reported by @leoatchina in #966)
  - Nerd Font icons from a fallback font come out at the text's size (reported by @rrpolanco in #866)
  - The Processes and Ports sections see the pane's shell on a busy Mac (reported by @zcyc in #731)
  - A Files tree on a WSL distro stays in step with it (reported by @zt449569708 in #942)
  - The quit confirmation on Linux is no longer cut off (reported by @XuJinNet in #920)
  - Fork no longer picks up the previous agent's session id (by @CodeHourra in #957)
  - Quick launch finds agents outside the GUI's bare PATH
  - Chinese UI copy reads like Chinese (reported by @Sealt in #980)
  - Return runs the top row after a search that found nothing
  - A typed ssh -p 2222 me@box is no longer offered as an address
  - Windows no longer freeze for a round trip when a remote watch closes
  - A burst of pane output no longer holds up the UI
  - A command named in the search leads over a session that mentions it (#985)
  - Menu items bound to Return or Tab show the right shortcut on macOS (#973)
  Every entry above is written up in full in CHANGELOG.md.
