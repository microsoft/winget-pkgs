- remote
- sftp
- ssh
- terminal
ReleaseNotes: |-
  tty7 installs tty7-server on a remote host by itself — download it by hand only for an offline box. SHA-256 for every file: checksums.txt
  Want the latest fixes before the next release? Try the nightly build.
  What's new
  Settings was reorganised around what is being configured, its search results can be edited in place, and the SSH host editor finally takes a password, a key file and its passphrase. A remote host's tty7 server can now be updated from the command palette, and Windows gets a portable mode that keeps its data beside the executable.
  Most of the release is fixes: an SSH password prompt that kept coming back, full-screen programs losing their modes or their screen across a reconnect or workspace switch, function keys, stuck tab titles, and missed resizes. The Windows builds no longer need the Visual C++ redistributable. CodeBuddy, Qoder and Crush join the supported agents.
  New Contributors
  - @netcatty made their first contribution in #878
  - @fish2lab made their first contribution in #880
  - @akhenakh made their first contribution in #881
  - @doitian made their first contribution in #895
  - @wenlingang made their first contribution in #898
  Full changelog — 14 added, 11 changed, 37 fixed
  Added
  - Update the tty7 server here or on the remote host from the command palette (#931)
  - The SSH host editor takes a password, a key file and its passphrase (#875)
  - CodeBuddy CLI support; Cursor CLI reports its session and status (#936, requested by @lgc653 in #892 and @rrpolanco in #741)
  - The Info panel says how far away a remote pane's shell is (#862)
  - Download a file from a remote workspace's tree (#937, requested by @jerryokk in #723)
  - Windows portable mode keeps its data beside the executable (#941, requested by @netcatty in #852)
  - Next / Previous Tab step to the neighbouring tab without the switcher (#934, requested by @rrpolanco in #867)
  - macOS stroke thickening can be turned off (#939, requested by @xiaozhaodong in #720)
  - Markdown preview and word wrap in the code panel are bindable actions (#935, requested by @swaynehales in #754)
  - Put an orphaned pane back on screen with tab new --pane %N (#831, reported by @xAlisher in #716)
  - tty7 capture --tail N (#855, reported by @rrpolanco in #841)
  - Qoder CLI support (by @WhiteDG in #873)
  - A Pi pane reports that it is waiting for you (by @netcatty in #878)
  - Crush support (by @akhenakh in #881)
  Changed
  - Settings is organised around what is being configured, and search results can be edited (#915)
  - One colour and icon system for the native chrome; agent marks get their brand colour back (#914, #916)
  - A keybinding in config adds a chord beside the default instead of replacing it (#887, reported by @rrpolanco in #868)
  - Workspaces are numbered in a stable order (#938, requested by @Morphone0429 in #760)
  - Panel text stays readable across themes and sizes (#933)
  - An SSH connection proves its remote server once, not once per pane (#824, reported by @qiudaomao in #695)
  - The Windows builds no longer need the Visual C++ redistributable (#907, reported by @ra9fael in #902)
  - Control dialect v10, so remote hosts pick up this release's daemon fixes (#930)
  - The SFTP Files panel opens at the shell's current directory (#932, requested by @loinky in #826)
  - The prompt editor starts input on its own row when the prompt leaves too little room (#940, requested by @imeilige in #767)
  - The Close Pane / Tab menu item is labelled Close (#910)
  Fixed
  - The ssh password prompt stops coming back after a reconnect (#827, #924, reported by @sparklive in #820)
  - A pane back from a workspace switch keeps its full-screen program (#832, reported by @Infiniverse in #711)
  - A restored pane no longer types mouse reports into its new shell (#853, reported by @hhdebb in #850)
  - Full-screen programs keep their terminal modes across a reconnect, and remote :wq lands where typed (#828, reported by @shihuaidexianyu in #774)
  - Panes opened after a restart or update keep Local Network access on macOS (#917, reported by @jgrund in #909)
  - F1–F12 reach the shell (#835, reported by @steelywing in #834)
  - A tab stops wearing the title of a program that has exited (#908, reported by @rrpolanco in #889)
  - Unread badges only mark turns you have not seen (#888, #890, reported by @rrpolanco in #870)
  - A symlinked config file stays a symlink (#918)
  - One bad keybinding line no longer resets the file, and Alt+1..9 can be unbound (#906, reported by @leoatchina in #901)
  - A tty7 retired to the tray comes back from the Dock (by @fish2lab in #880)
  - Reaching for ⌘ mid-flick no longer zooms the font to its minimum (by @wenlingang in #913)
  - The prompt gets its cursor shape back when a program exits (#922, reported by @rrpolanco in #837)
  - Narrowing a pane under a prompt leaves one clean prompt (#929, reported by @coolmanj in #654)
  - A resize whose echo went missing is sent again (#923, reported by @rrpolanco in #893)
  - A replay never starts in the middle of an escape sequence (#927, reported by @404KSG in #857)
  - A tab comes back to the pane focus was last in, including after un-zooming (#854, #921, reported by @rrpolanco in #843 and #869)
  - Shift+Enter and Ctrl+J insert a newline in native Windows Codex (by @doitian in #895)
  - Leaving an ssh session no longer leaves ^U at the prompt (by @spragginsdesigns in #877)
  - Holding Backspace in a WSL pane gives one steady bell flash (#884, reported by @seahoe in #874)
  - Dim text stays readable on light themes (#886, reported by @AaronNick in #858)
  - tty7 wait --until free answers on remote and SSH panes (#856, reported by @rrpolanco in #840)
  - tty7 capture no longer returns nothing after a resize (#855, reported by @rrpolanco in #841)
  - The Ports panel says when it could not look (#830, reported by @zcyc in #731)
  - Joining an existing workspace keeps its name; the machine tree keeps earlier copies (#831, reported by @xAlisher in #716)
  - The Files panel lists a WSL pane's directory (#925, reported by @zt449569708 in #896)
  - Native SSH tabs group by their remote folder (#926, reported by @rrpolanco in #891)
  - A fullscreen window on Windows and Linux drops its dead window buttons (by @hhdebb in #864)
  - An agent's spinner is taken off the tab title it writes (by @hhdebb in #865)
  - font_fallbacks applies to panes already open (by @hhdebb in #879)
  - The terminal is reported as the focused element to assistive clients (by @hhdebb in #872)
  - A GitHub rate limit on the update check says when to retry (by @ayamir in #861)
  - The Agents settings row caps a long failure note again (by @wenlingang in #898)
  - Keybinding action names stay on one line in Settings (#928, reported by @XuJinNet in #919)
  - A docked document takes the window's right edge on macOS
  - The file tree sits on the right panel's rail (#859)
  - The docs explain why a shell started by hand stops reporting its directory (#825, reported by @hardboydu in #698)
  Every entry above is written up in full in
  CHANGELOG.md.
