ShortDescription: 一个终端工作台：持久会话、远程工作与编码智能体。
Description: tty7 是一款用纯 Rust 编写、基于 Zed 的 gpui 渲染、内核取自 Alacritty VT 的终端工作台。它提供退出与重启后依然存活的持久会话、编辑器级的输入体验、原生 SSH 配置（含 SFTP 与端口转发）、远程工作区，以及对 Claude Code、Codex 等编码智能体的感知面板，并附带可脚本化的 CLI 与 skills 能力。
