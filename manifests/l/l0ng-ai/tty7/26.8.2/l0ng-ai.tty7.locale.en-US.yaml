ReleaseNotes: |-
  tty7 can now update itself on every platform it ships on, the GUI speaks English, Simplified Chinese and Japanese, and a wheel mouse scrolls smoothly instead of jumping a notch at a time. Windows got the most attention by far: ConPTY resize semantics, a whole-window hang after a remote reconnect, updates that reported success and left the old build, and a pane that could not see a freshly installed command. Eighty-seven pull requests, seven of them from first-time contributors.
  Added
  - Update tty7 without leaving the app, on macOS and Windows alike (by @ayamir in #309, by @ArnoChenFx in #330)
  - Stable and Nightly are separate update channels, so a Nightly is never walked back onto Stable (#386)
  - A proxy for tty7's own traffic — config field, system proxy, or environment (by @shihuaidexianyu in #367)
  - The GUI speaks Simplified Chinese and Japanese (by @shihuaidexianyu in #303, by @cwatanab in #372)
  - tty7 wait blocks until a pane's agent needs input, finishes its turn, or dies (by @yetone in #248)
  - An orchestration skill for Claude Code, installed from Settings → Agents (#248)
  - Smooth scrolling for wheel mice, on by default (#382)
  - The switcher is two columns, and Ctrl+Tab raises it as an MRU tab switcher (#380)
  - Every shell tty7 can find is in the new-terminal menu, plus one you name (by @ArnoChenFx in #311)
  - Optional Windows Explorer context menus, registered from the installer (by @ArnoChenFx in #310)
  - tty7 <dir>... opens a tab per directory (by @ArnoChenFx in #308)
  - Oh My Pi (omp) is a first-class agent (#405, reported by @Hanser0521 in #376)
  - Clickable desktop notifications that reveal the pane they came from (by @shihuaidexianyu in #373)
  - A bell mode that both flashes and rings (by @shihuaidexianyu in #357)
  - A toggle to rescue bright ANSI colors a theme makes illegible (by @ArnoChenFx in #413)
  Changed
  - The About page is about the app again; the CLI toggle moves to Agents (#350, #358)
  - The Outline right panel is gone (#375, requested by @shihuaidexianyu in #374)
  - Chinese terminology corrected throughout — worktree is no longer the word for workspace (#334, #417)
  - Kitty graphics frames cost one copy less on the way to the atlas (by @ayamir in #388)
  - The close-confirmation setting is gone; closing with live panes always confirms (#383)
  - macOS declares its privacy intents, so a pane's child gets one grant instead of repeated prompts (by @Gabyran in #323)
  Fixed
  - Maximizing a Windows pane no longer shreds it (#415, #419)
  - The whole window no longer hangs after a remote workspace reconnects (#407)
  - A Windows update that reported success and left the old build (#403)
  - A newly installed command works in the next pane, without restarting tty7 (#349, reported by @yhzhu99 in #333)
  - Switching workspaces no longer destroys live sessions (#410)
  - Windows panes can answer a background-color query, so light/dark UIs render right (#360)
  - A second cursor no longer blinks in the wrong place on Windows (#362)
  - Windows toasts are tty7's, not PowerShell's (by @shihuaidexianyu in #340)
  - Scoop shims work again under a hardened Windows shell broker (by @ArnoChenFx in #292)
  - A pane's last line of output no longer loses the race with its exit on Windows (by @ArnoChenFx in #292)
  - A resumed agent keeps the flags it was launched with, on Windows (#406)
  - Codex hook commands work under PowerShell (by @shihuaidexianyu in #298)
  - Tab in a WSL pane completes paths again, over the distro's \\wsl$ share (#408, #418)
  - A WSL machine can restart and replace its server (#417)
  - Pasting a screenshot into an SSH or remote pane works, on every platform (by @shihuaidexianyu in #338, #399)
  - The mismatch dialog replaces the server binary instead of just restarting it (by @shihuaidexianyu in #352)
  - Remote server errors appear under the machine they came from (by @shihuaidexianyu in #354)
  - An SSH remote install uses the bundled server before reaching for the network (by @shihuaidexianyu in #344)
  - A server that is only a control dialect behind is noticed at launch, and described correctly (#384, #387, #389)
  - Arrow keys reach ncurses apps in the form they asked for — htop stops renicing (#366, reported by @hak0 in #361)
  - A right-click goes to the application when mouse reporting is on (#347)
  - $SHELL names the shell the pane actually runs (#348, reported by @nohzafk in #342)
  - The login shell is read from passwd, so chsh takes effect without logging out (#278)
  - A forwarding .bash_profile no longer sources .bashrc twice (#279)
  - The macOS locale fallback sets LANG, so bash stops warning per category (#280)
  - Three defects in the inline completion menu: escaping, spent menus, and a remote pane scanning the local PATH (#276)
  - macOS editing shortcuts reach a foreground TUI (by @loscoy in #304)
  - Ctrl-E accepts a ghost suggestion on the first try (by @vkingw in #329)
  - No stray ^U after interrupting an agent (by @shihuaidexianyu in #312, reported by @fuchen in #305)
  - ANSI dim text and text decorations render (#288, #289)
  - Powerline separators have no seam, and their caps read as circles (by @ArnoChenFx in #336, by @cwatanab in #335)
  - Sidebar text, the caret and hairlines get a contrast floor (#400)
  - Smooth scroll steps are aligned with presented frames (by @ArnoChenFx in #414)
  - A new tab lands in its repo group on the first frame (by @ArnoChenFx in #411)
  - Settings hover highlights respond immediately (by @ArnoChenFx in #313)
  - The terminal's own context menu and search bar are translated (#401)
  - tty7 no longer panics on launch under Wayland on a slow VM
  - The Windows system proxy is honoured by remote-server downloads, not just by the update check (by @shihuaidexianyu in #364)
  New Contributors
  - @ArnoChenFx made their first contribution in #292
  - @shihuaidexianyu made their first contribution in #298
  - @loscoy made their first contribution in #304
  - @Gabyran made their first contribution in #323
  - @vkingw made their first contribution in #329
  - @yhzhu99 made their first contribution in #332
  - @cwatanab made their first contribution in #335
