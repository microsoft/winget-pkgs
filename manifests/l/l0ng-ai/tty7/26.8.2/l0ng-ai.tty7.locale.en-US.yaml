ShortDescription: 'A terminal workbench: persistent sessions, remote work, and coding agents.'
Description: tty7 is a terminal workbench written in pure Rust and rendered on Zed's gpui with a VT core from Alacritty. It offers persistent sessions that survive quitting and rebooting, editor-grade input, native SSH profiles with SFTP and port forwarding, remote workspaces, agent-aware panes for Claude Code, Codex and similar CLIs, and a scriptable CLI with skills.
