ReleaseNotes: OpenIDEA 0.1.55 新增 Django 与 pytest fixture 支持、Python Debug Server、用 cProfile 分析 Python 运行、Plots 工具窗口显示 matplotlib 图表、Jupyter Variables、从版本控制或本地目录安装包、DuckDB SQL 与附加 catalog、Database Output 工具窗口、数据源文件夹、MDX 与缩进语法 Sass，以及远程主机资源面板。另外修复了 Windows 上读取剪贴板时的崩溃（0xc0000374）、切换输入法时拼音留下音节空格、macOS 从保存的窗口状态恢复为全屏等问题。
