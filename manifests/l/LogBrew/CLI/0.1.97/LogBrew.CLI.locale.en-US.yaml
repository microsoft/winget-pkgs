ShortDescription: Set up error monitoring in your app and read issues, traces, and logs from the terminal.
Description: |-
  The logbrew command sets up the LogBrew SDK in your project with one command,
  then lets you read issues, stack traces, distributed traces, and logs from the
  terminal. Add --json to any command so scripts and AI agents can read the output.

  LogBrew is error monitoring, performance monitoring, and log management in one
  tool, with a generous free tier and no card needed.
