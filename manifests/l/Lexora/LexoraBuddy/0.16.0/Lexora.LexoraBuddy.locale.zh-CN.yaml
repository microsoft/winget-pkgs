ReleaseNotes: |-
  这个版本的重点是 Lexora Office 与文档工作流。围绕 Office 插件，我们补齐了文件打开方式、内容引用、插件附带技能、剪贴板与本地文档存储等能力，将文档编辑、引用提问和 AI 任务交付串联起来，让伙伴不只是在对话中讨论文件，也能参与实际的文档处理。
  此外，本版本新增可自定义的陪伴贴纸与通知音效，并继续打磨任务阅读、伙伴协作和浏览器使用体验。
