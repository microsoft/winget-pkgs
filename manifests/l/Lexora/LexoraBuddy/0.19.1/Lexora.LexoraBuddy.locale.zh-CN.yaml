ReleaseNotes: |-
  这是 0.19.0 的补丁版本。上个版本带来了伙伴向用户提问的能力，但提问卡片的样式与交互还没达到我们期望的效果，因此很快推出了这次更新：重新打磨卡片布局与视觉层级，支持逐题切换作答，让问题更聚焦、填写更从容。
  此外，我们也处理了一些性能问题，改善长对话阅读与分屏拖拽的流畅度，并修复补充消息延迟显示、编辑和重新生成后的加载与阅读位置问题。
  这些体验仍有进一步打磨的空间，我们会在后续版本中持续改进。
