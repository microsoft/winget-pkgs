ReleaseNotes: |-
  这次主要完善 多伙伴协作的交接与续做：伙伴可以沿用之前的上下文和结果，继续补充、修改或返工；按需传递材料、直接交流必要信息，减少重复交代。执行详情也会分别展示任务要求、交付依据与核验结论，方便查看工作进展。
  同时修复伙伴身份识别、协作等待和任务完成反馈的问题，改善 @伙伴 的定向消息与独立调度，并完善历史报告读取、结果操作和用量展示，让多个伙伴一起工作时少一些相互干扰。
