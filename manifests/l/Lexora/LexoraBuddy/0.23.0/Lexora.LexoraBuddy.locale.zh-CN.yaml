ReleaseNotes: |-
  从 9 月底写下初稿，断断续续打磨了一个多月，最近两周又密集推进了一波。现在，终于支持用手机远程控制电脑上的任务了！当前仅支持 Android（如果 iOS 用户较多，欢迎向我反馈，我会根据大家的需求加快适配进度）。
  🛠️ 桌面界面与任务执行分离
  这次把桌面界面和任务执行拆开了。Lexora Core 在电脑后台独立运行，桌面端和手机连的是同一个服务。桌面启动更快，退出时也可以选择保留后台服务，让正在跑的任务继续。
  📱 Android 远程任务管理
  在手机上可以新建任务、查看进度，并给正在运行的任务补充指令。收到审批或提问通知时，点开即可进入对应任务处理。
  在桌面端 设置 → 移动设备 开启连接，用 Android App 扫码配对。支持局域网和 Tailscale；任务仍在电脑上跑，所以电脑得在线，Lexora 后台服务也得开着。
