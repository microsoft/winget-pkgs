ShortDescription: 具备插件、内置浏览器、工作区文件与本地模型支持的桌面 AI Agent。
Description: Lexora 是在真实桌面实践中自我演化的个人 AI Agent。它不局限于代码助手的角色，也能陪你整理资料、打磨作品、安排日常。你说出目标，它持续推进，让文字成为工作、创作与生活的起点。
