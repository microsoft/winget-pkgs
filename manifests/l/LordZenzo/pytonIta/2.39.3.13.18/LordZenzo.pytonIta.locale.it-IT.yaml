Description: |-
  pytonIta è un vero interprete Python 3.13 (pitonit) che capisce le parole chiave italiane, con file .pit e oltre 150 moduli di libreria con nomi italiani. PitStudio, l'ambiente di sviluppo, è scritto in pytonIta stesso: editor, progettista di finestre, programmazione a mattonelle, debugger, gestore di database, assistente AI, 24 lezioni e strumenti per audio e video (ffmpeg e VLC non sono inclusi). Gratuito; il codice è visibile ma non può essere modificato né ridistribuito in versione modificata.
