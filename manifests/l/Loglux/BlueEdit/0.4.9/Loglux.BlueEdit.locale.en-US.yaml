ShortDescription: A fast console text editor for writing, mathematics and code.
Description: |-
  BlueEdit is a console text editor for Markdown notes, LaTeX mathematics and code, in the terminal you already use (Windows Terminal, a console, a session over SSH), with menus and F-keys.

  - Markdown with a live preview (markup hidden except on the caret's line) and a reading mode; tables aligned, images shown as pictures.
  - LaTeX formulas as Unicode, display formulas laid out over several rows, or typeset as pictures in Windows Terminal.
  - Spelling with the dictionaries Windows has; grammar and style from the checker you choose (LanguageTool, Harper, a local or a cloud language model). Typing never waits for them.
  - Code: highlighting, completion, errors and definitions from language servers.

  The command is `be`. The installer is for the current user, without administrator rights.
