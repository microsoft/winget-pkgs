ShortDescription: A file viewer for the terminal that also reads PDF, DjVu, FB2 and EPUB books, drawn as Sixel graphics.
Description: |-
  Peekel is a file viewer for the terminal that also reads books. It shows a picture, an SVG, the start of a Word, Excel, PowerPoint or OpenDocument file, and a card for any other file; and it reads PDF, DjVu, FB2 and EPUB books (and HTML pages) page by page, with their contents, a search in the text and the place you stopped at kept. It draws with Sixel graphics in the terminal's own cells, so it works in Windows Terminal and over SSH.

  - Two or three pages side by side, the contents of the book, a search in the text, and every book opens where you left it.
  - FB2 and EPUB are laid out into pages by the viewer itself, and the size of their text is yours to choose.
  - A card for any other file: a font in its own letters, a program's version and icon, what is inside an archive, a torrent.
  - Every reader has limits on size and depth; a broken file gives a message, not a crash.

  The command is `peekel`.
