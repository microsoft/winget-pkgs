ShortDescription: A tiny Windows app for YouTube Music that lets you listen together with friends.
Description: |-
  Encore is a free, open-source desktop app for the official YouTube Music website, built on the WebView2 engine in Windows (about 4 MB).
  Listen along with friends in sync (song, position, pauses and skips), with end-to-end encrypted sync messages. Friends can join from a code, a link, or the Listen along button on your Discord status.
  It also has a mini player, media key, taskbar and tray controls, Discord Rich Presence, and a volume that remembers its level.
  Not affiliated with Google or YouTube.
