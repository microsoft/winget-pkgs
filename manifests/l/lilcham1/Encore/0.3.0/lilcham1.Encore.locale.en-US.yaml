ShortDescription: A tiny Windows app for YouTube Music that lets you listen together with friends, even ones on Spotify.
Description: |-
  Encore is a free, open-source desktop app for the official YouTube Music website, built on the WebView2 engine in Windows (about 4 MB).
  Listen along with friends in sync, follow a friend who listens on Spotify (through Discord or Last.fm), play Spotify playlists as your YouTube Music queue, scrobble to Last.fm, and show what you play on Discord.
  It also has a mini player, media key, taskbar and tray controls, and a volume that remembers its level.
  Not affiliated with Google or YouTube.
