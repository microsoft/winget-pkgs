ShortDescription: LaMotte WaterLink 水质检测仪的桌面配套软件：固件更新、USB 采集测试结果并桥接 Solutions Pro。
Description: WaterLink Connect 2 是 LaMotte 提供的免费 Windows 应用，用于为旗下先进的水质检测仪推送固件更新、通过 USB 连接采集测试结果，并在检测仪与 WaterLink Solutions Pro 之间充当桥梁。它支持通过 USB 连接 LaMotte Spin 系列检测仪、DC1500 和 SMART3 比色计，运行于 Windows 10 和 11（x86/x64；不支持 ARM 架构 CPU）。
