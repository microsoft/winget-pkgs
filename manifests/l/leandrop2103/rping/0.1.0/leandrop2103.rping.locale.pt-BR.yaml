ShortDescription: Utilitário de ping moderno e de alto desempenho em Rust para Windows com saída colorida e timestamps.
Description: |
  Reimplementação moderna, ultrarrápida e com saída colorida em pt-BR do utilitário ping para Windows e Linux escrita em Rust.
  Possui suporte a ICMP sem elevação de privilégios (sem UAC), resolução em microssegundos no cálculo de RTT,
  carimbos de data/hora (timestamps -t e -th), compatibilidade com argumentos clássicos do Windows (-n e -l) e tamanho ultracompacto (~590 KB).
