ShortDescription: Modern high-performance ping utility in Rust with ANSI color output and timestamps.
Description: |
  A modern, high-performance, cross-platform ping utility written in Rust.
  Features unprivileged native Windows ICMP probing via IP Helper API (iphlpapi.dll),
  true microsecond RTT precision, timestamps (-t and -th), hybrid argument compatibility (-c/-n, -s/-l),
  and a tiny standalone binary (~590 KB).
