ShortDescription: A Windows desktop GUI to manage WireGuard peers on a server over SSH, plus local tunnel hosting.
Description: |-
  WireGuard Manager (WireGuard 管理台) is a Windows desktop application for managing WireGuard peers.
  It connects to your existing server over SSH and lets you view, add, edit and delete peers in a standard
  wg0.conf, showing a QR code for each client, applying changes with `wg syncconf` (hot reload) and rolling
  back automatically if the new config fails to apply. It also hosts local tunnels on the same machine
  (connect / disconnect / live throughput graph) and can install WireGuard on a fresh server with one click.
  The whole app is a single file and requires no Python installation.
