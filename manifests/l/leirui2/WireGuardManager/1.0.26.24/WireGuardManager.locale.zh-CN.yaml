ShortDescription: Windows 桌面版 WireGuard 管理工具，通过 SSH 可视化增删改服务器 wg0 的 peer。
Description: |-
  WireGuard 管理台（WireGuardManager）是一个 Windows 桌面版 WireGuard 管理工具：通过 SSH 直接管理
  服务器上 wg0.conf 里的 peer（查看、增删改、二维码、热加载、失败回滚），同时托管本机隧道
  （连接 / 断开 / 实时速率）。它不需要在服务器部署 Web 面板、Docker 或数据库，直接操作你已有的
  标准 wg-quick 配置，另附「一键装服务端」。单文件免安装，开源。
