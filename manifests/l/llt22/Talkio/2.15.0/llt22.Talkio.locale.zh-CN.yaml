ReleaseNotes: |-
  更新内容
  新功能
  - 群聊顺序发言和随机发言支持跳过当前 AI，并自动继续下一位。
  - 托管讨论期间也可跳过当前 AI，不会终止后续参与者或讨论轮次。
  交互与稳定性
  - 仅在当前 AI 后仍有待发言成员时显示跳过按钮。
  - 单聊、最后一位 AI 和并行回复保持原有行为。
  - 跳过时保留当前 AI 已生成的部分内容；停止生成仍会终止整轮。
  - 切换、删除或清空会话时同步清理跳过状态。
