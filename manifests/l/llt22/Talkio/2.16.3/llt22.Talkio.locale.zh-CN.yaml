ReleaseNotes: |-
  🐛 Bug Fixes
  - 修复 Poe 等提供商在自动获取模型列表后校验失败的问题。 部分提供商对未知上下文窗口的模型返回 context_length: null，此前会被校验拦下，导致模型列表刷新失败、界面显示获取失败。现在允许该字段为空，并按"未知上下文长度"处理。
  - 修复图片/工具能力探测与模型健康检查的请求被接口拒绝的问题。 探测请求把输出 token 上限设为 8（健康检查为 1），低于 OpenAI Responses API 的下限 16，导致请求直接报错，能力探测和健康检查误判为失败。三个请求点统一提到 16，并抽成一个常量。
  📦 其他
  - 为模型列表解析补充回归测试，覆盖 context_length 缺失、为 null、以及正常数值三种情况。
