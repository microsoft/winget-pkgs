ReleaseNotes: |-
  更新内容
  新功能
  - 聊天记录完整备份与恢复（#25）
    - 完整备份现在包含配置、会话、消息和消息块，可用于重装系统或更换设备后的数据迁移。
    - 恢复过程使用事务和配置快照回滚，写入前会校验备份结构并明确提示覆盖风险。
    - 继续兼容旧版 2.0 配置备份。
    - 供应商及语音 API 密钥不会写入备份文件。
  - 聊天记录长截图导出（#21）
    - 支持将完整会话导出为 PNG 长截图，不再受页面最近 200 条消息限制。
    - 正确渲染 Markdown、代码块、推理内容和图片。
    - 超长会话自动拆分为带编号的多张 PNG；Android 支持一次分享多个分片。
  - 群聊能力增强
    - 支持为群聊成员设置自定义昵称。
    - 支持成员禁言、工具调用审批和成员级用量统计。
  - 模型与供应商能力增强
    - 引入统一模型运行时和事件流，增强 OpenAI、Anthropic、Gemini 等供应商的兼容性。
    - 增加数据化 Provider Profile、模型目录和原生 Gemini 适配。
  安全与稳定性
  - 供应商密钥迁移到系统凭据存储，并补强 Android 本地凭据保护。
  - 修复清空聊天记录后仍残留生成任务和占位消息的问题。
  - 修复生成中止、错误分类、工具调用审批和供应商请求链路中的多项边界问题。
  - 修复依赖安全告警。
  升级说明
  - 完整备份恢复会替换当前设备上的全部聊天记录，操作前建议先导出当前数据。
  - API 密钥不包含在备份中，迁移设备后需要重新填写。
