ReleaseNotes: |-
  Nomo v0.7.3｜原生打印、主页收藏与编辑改进
  更新总结
  - Windows、macOS 和 Linux 支持从「文件 → 打印…」打印当前文档，包括未保存的修改。
  - 主页支持收藏文档和文件夹。打开收藏的文件夹可展开文件树并定位到对应目录。
  - 设置新增独立「快捷键」页。代码块支持自动换行、段首围栏补全和块内全选。
  - 上下方向键按视觉行移动。公式新增 \(...\) 行内写法和 \[...\] 块级写法。
  - macOS 安装版从本版起支持应用内更新，Windows 和 macOS 的更新下载支持镜像回退。
  打印与快捷键
  - 使用「文件 → 打印…」或 Ctrl+P（macOS 为 ⌘P）打印当前编辑版本。打印稿使用浅色排版。Windows 和 macOS 提供系统打印预览，Linux 的预览入口取决于桌面打印服务。
  - 在「设置 → 快捷键」可按命令或按键搜索，筛选已修改或未设置的命令，录制、删除或恢复绑定。每条命令最多绑定三个快捷键。菜单和工具栏会显示实际生效的快捷键。
  主页与收藏
  - 点击主页文档或文件夹卡片上的星标即可收藏，也可从工作区文件树的目录右键菜单收藏文件夹。主页侧栏顶部集中显示收藏，清除最近记录时仍可访问收藏项目。
  - 点击收藏的文件夹会打开相应工作区，沿路径展开文件树并滚动到目标目录。在应用内重命名项目时，收藏路径会同步更新。
  代码、公式与排版
  - 代码块顶部可独立切换自动换行，原始行号和文件内容保持原样。换行和展开状态在当前文档会话中保留，并同步到双栏。
  - 在所见即所得模式的普通段落行首输入第三个反引号，会按默认语言补全围栏，光标进入代码正文。光标在代码块内时，Ctrl+A（macOS 为 ⌘A）选中当前块的代码正文。
  - 首次打开已有文件时，光标默认落在第一行末尾。上下方向键按屏幕上的折行移动，尽量保持横向位置。按住 Shift 可从原选区锚点继续扩选。
  - 简化代码块、公式、图表、目录、注释和表格控件的线条和按钮样式。短代码块按实际行数显示。
  - 在美元符号公式之外，行内公式支持 \(...\)，块公式支持 \[...\]。复制公式源码时保留原有定界符。感谢 @RefirmSaky 的贡献。#109
  - 缩放 Mermaid 图时可沿用已有位图，直到新图就绪。公式和图表的位图被回收后仍保留排版尺寸，进入可见区域时按需恢复。
  - 改进中西文混排的标点断行和悬挂，统一同一等宽字体下正文、代码块和源码视图中的箱线字符宽度。
  窗口、恢复与数据管理
  - 侧栏开合时，正文与主页卡片随可用宽度调整，减少布局跳动。Windows 使用一个应用级托盘图标，可从托盘菜单打开指定窗口。macOS 修复中文输入法候选框位置，并对齐标题栏两侧边距。
  - 迁移旧版工作区时，优先保留原生布局，再导入容量内最新的旧布局。其余旧布局中的未保存草稿仍可从恢复入口访问。
  - 编辑提交失败时保留待提交的输入，可重试。关闭文档时会明确提示是否放弃未保存的修改。
  - 「设置 → 高级 → 应用数据」可分别恢复默认偏好和清除使用数据。清除使用数据会移除最近记录、工作区、未保存草稿、历史和缓存，保留设置与主题。Windows 安装版卸载时可选择同时清除应用数据。
  - 启动时自动回收已退出会话的旧派生索引，以及 Windows 上过期且未占用的更新安装包。
  更新与安装
  - 从本版起，安装在可写位置的 macOS Apple Silicon 正式版 Nomo.app 可在应用内下载更新，确认后重启安装。
  - 检查更新优先访问 GitHub，官方 API 不可用时可从 gh-proxy 读取发布信息。Windows 和 macOS 安装版下载遇到连接问题或长时间无进度时可尝试镜像，下载后按发布信息校验大小和 SHA-256。
  - Linux 的 DEB 和 RPM 可分别构建。发行包移除调试符号，并补充运行时依赖声明。#128
