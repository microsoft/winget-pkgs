ReleaseNotes: |-
  v0.5.0 → v0.5.1 更新总结
  - 新增 Markdown 选区动态统计，可在状态栏实时查看选区的行数、词数、字数、字符数和预计阅读时间。
  - 支持长代码块展开与收起，并修复列表正文复制时附带序号的问题。
  - 优化 Markdown 行内标记编辑与中文输入体验，修复光标被分隔符吸附、分隔符遮挡输入以及 GitHub 主题代码块选区遮挡问题。
  - 修复编辑器缩放时的滚动闪烁与视角漂移，并提升深色主题语义色的对比度。
  - 统一文件与文件夹的窗口打开路由，修复 macOS 关闭到托盘后无法重新打开窗口的问题。
  - 完善 macOS 系统主题跟随、快捷键展示、加粗输入、应用图标构建与 Homebrew 安装支持。
  - 修复自动更新开关持久化，统一原生端语言设置，并优化关于页项目入口和平台支持信息。
  - 项目许可证调整为 AGPLv3。
