Description: Nomo is a WYSIWYG, real-time rendering, and distraction-free Markdown editor for macOS and Windows. With a minimalist design, it delivers a smooth live preview experience, supporting mixed text and images, code blocks, inline code, math blocks, inline math, multiple diagram types, document outlines and table-of-contents navigation, plus VS Code-like file management. Documents can be exported to HTML or PDF in one click.
