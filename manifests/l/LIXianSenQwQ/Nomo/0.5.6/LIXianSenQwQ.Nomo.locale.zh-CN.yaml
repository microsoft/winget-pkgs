ReleaseNotes: |-
  v0.5.5 → v0.5.6 更新总结
  - 新增编辑器快捷插入菜单，默认在行首或空格后输入 / 调出，支持键盘选择内容类别与样式，并可在设置中关闭或修改触发符号。
  - 文件树新增键入定位、匹配高亮和临时匹配提示，方便快速定位文件与文件夹。
  - 修复隐藏资源管理器后 Markdown 小窗空白的问题，优化小窗进出切换、窗口位置与尺寸恢复，以及任务栏状态切换。
  - 完善专注模式下侧栏的展开、收起动效与焦点管理。
  - 修复表格保存丢失，使用嵌入 HTML 保留无表头、合并单元格等普通 Markdown 表格无法表达的结构，并修复 HTML 锚点转义问题。
  - 修复多行公式中 $$ 与首尾公式内容同行时的解析问题。
  - 完善编辑器节点的输入法组字、编辑态与只读状态协调，以及保存、导出和目录、脚注更新处理。
  - 更新桌面、文件关联、托盘及各平台打包图标资源，优化图标描边；应用内 Logo 保留原有造型，更新弹窗支持浅深色主题图标。
