Description: Nomo 是一款所见即所得、即时渲染、无干扰的 Markdown 编辑器，支持 macOS 与 Windows。它采用极简设计，提供流畅的实时预览体验，支持图片与文字混排、代码块、行内代码、公式块、行内公式、多种图表、文件大纲与目录导航，并内置类似 VS Code 的文件管理能力。文档可一键导出为 HTML 或 PDF。
