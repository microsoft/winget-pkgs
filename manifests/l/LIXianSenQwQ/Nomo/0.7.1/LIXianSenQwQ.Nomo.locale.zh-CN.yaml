ReleaseNotes: |-
  Nomo v0.7.1｜文件夹工作区与编辑体验更新
  更新总结
  - 重新打开文件夹时，恢复该目录上次的标签、编辑模式和阅读位置。
  - 支持锁定单篇文档，也可设置为默认以只读方式打开已有 Markdown。
  - 改善 Markdown 和 HTML 表格的自动列宽及长行内代码折行，优化 GIF 播放。
  - 恢复主窗口的位置、大小和最大化状态，支持一键还原 100% 缩放。
  主页与工作区
  - 主页的文件夹卡片显示文档缩略图，支持拖动排序。文件树中的文档可拖入其他目录。
  - 从主页打开文件夹可直接进入该目录的工作区。恢复时会记住标签顺序、活动文档、编辑模式和阅读位置。
  - 删除在其他窗口打开的文件时，可以先将未保存的修改另存为副本。
  编辑与排版
  - 点击右下角的锁图标可切换当前文档的编辑锁。锁定后仍可选中、复制、查找和导出。在「设置 → 文件与窗口」中可开启「打开已有 Markdown 时默认只读」。
  - 在所见即所得模式中，点击段落或标题左侧悬停时出现的短竖线，即可选中整段。
  - Markdown 和 HTML 表格根据内容与可用空间分配列宽，长行内代码可在单元格内折行。HTML 标题可从大纲跳转，语义视图按 HTML 规则折叠容器内多余的换行和缩进。
  - GIF 优先显示首帧，正文、表格和大图预览中的动画仅在可见时播放。
  窗口与平台修复
  - 再次启动时恢复主窗口的位置、大小和最大化状态。「显示」菜单可分别控制侧栏、大纲和右下角工具。「实际大小」将缩放恢复到 100%。
  - Windows 安装器修复高 DPI 下界面模糊的问题。覆盖安装发现目标 Nomo 正在运行时，会提示保存文档并确认退出后继续。
  - macOS 修复偏好设置窗口的按钮重叠和快捷键显示问题。
