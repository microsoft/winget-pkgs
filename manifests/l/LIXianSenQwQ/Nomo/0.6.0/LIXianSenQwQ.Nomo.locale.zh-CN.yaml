ReleaseNotes: |-
  v0.5.6 → v0.6.0 更新总结
  - 初步支持 Word（.docx）导出，保留标题、列表、表格、链接和脚注，内嵌图片，并将公式与 Mermaid 图表转换为图片；实际字体替换与分页由 Word/WPS 决定，仍待实机验收。
  - 新增 Emoji 补全与表情选择器，支持冒号短代码建议、中英文搜索和分类浏览。
  - 完善 HTML 与 PDF 导出样式和分页，共享正文样式，改进图片资源处理、导出快照与精细排版协调。
  - 优化表格自动列宽，并统一编辑器、精细排版和导出中的表格布局处理。
  - 大纲面板支持从顶部拖动、记忆位置及恢复默认位置。
  - 新增顶层段落与标题的整段选择入口，修复选区背景白缝、行尾空白覆盖、高度跳变及点击纸面留白后残留选区等问题。
  - 修复正文输入时未变化的 HTML 预览与图片被重复重建导致的跳动，保留预览 DOM，并正确处理内容修改、撤销重做及编辑器重新挂载。
  - 修复空任务项回车取消、嵌套列表退出，以及任务列表下方空行退格恢复任务标记的问题。
  - 修复空白标签页自动聚焦与留白点击，统一源码和语义模式的滚动条位置，并支持 H1–H6 HTML 标题的 align 对齐。
  - 优化多标签资源生命周期、按需渲染与缓存管理，减少隐藏编辑区、后台标签和屏幕外代码、图表的重复初始化与渲染开销。
