ReleaseNotes: |-
  Linux release assets
  - CLIProxyAPI_<version>_linux_<arch>.tar.gz is the default Linux build. It supports dynamic library plugins and is built against a GLIBC 2.17 baseline.
  - CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz is the portable Linux build for musl-based or older systems such as OpenWrt. It does not support dynamic library plugins.
  FreeBSD release assets
  - CLIProxyAPI_<version>_freebsd_aarch64_no-plugin.tar.gz is the FreeBSD arm64 build. It is built without CGO and does not support dynamic library plugins.
  Changelog
  - fix(gemini): hide trailing text thought signatures from responses timeline (510c9c8f)
  - fix(codex): restore dotted collaboration tool names in multi-agent v2 (82f4f370)
  - fix(antigravity): default to short connections and harden connection pool lifecycle (fixes #5494) (d5397905)
  - Merge pull request #5596 from sususu98/fix/issue-5494-antigravity-idle-conns (f19d6da0)
  - fix(codex): simplify complex tool schema unions and detect empty incomplete responses (bf20b999)
  - feat(claude): support structured output via system prompt instructions (4f038099)
  - fix(wsrelay): preserve queued frames during terminal message delivery (7871a5a9)
  - fix(codex): preserve service tier and cache write tokens in openai responses (8696585c)
  - fix(codex): explicitly default function tool strict to false (d01516c1)
  - fix(codex): recover omitted tool namespaces in openai responses (03a054e3)
  - fix(codex): sanitize invalid tool name characters for upstream compatibility (bee20b99)
  - fix(codex): recognize retryable server errors for bootstrap failover (ba7e5583)
