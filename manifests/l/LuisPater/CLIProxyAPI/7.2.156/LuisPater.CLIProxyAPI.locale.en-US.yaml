  - feat(plugin): add host session affinity lookup callback (0796d6d1)
  - fix(claude): emit trailing usage chunk and aggregate stream usage (a59b1764)
  - feat(codex): support model-level quota cooling (b064b832)
  - fix(translator): strip unsupported unicode property escape patterns from tool schemas (e56abd56)
  - fix(schema): inspect patternProperties keys and avoid Unicode escape fast-path bypass (37ce368c)
  - Merge pull request #5677 from sususu98/fix/codex-tool-schema-pattern (db011593)
  - feat(management): add endpoint to refresh auth files (60e5b8bd)
  - feat(auth): propagate canonical session id for custom header expansion (3bf787fc)
  - fix(auth): classify terminal upstream auth failures as non-retryable errors (aedc9e6a)
  - feat(codex): add support for gpt-image-2.5 models (d1a024e9)
