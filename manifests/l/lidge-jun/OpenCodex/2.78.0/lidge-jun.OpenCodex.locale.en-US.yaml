ReleaseNotes: |-
  Published to npm as @bitkyc08/opencodex@2.78.0 with dist-tag latest.
  New Features
  - Add native pool preference with explicit opt-out precedence (#6562)
  - Audit catalog writes with bounded private records (#6560)
  - Heal lost catalog rows only from the idle owner (#6563)
  - Icon theme switch sharing a row with the zoom stepper (#6579)
  - Name the holder when the runtime mutation lease is busy (#6512)
  - Group the sidebar into eight rows and tidy the Claude surface (#6593)
  - Make existing management workflows discoverable (#6526)
  - Add live provider management and safe editor apply (#6528)
  - Add model ordering and routing editor workflows (#6535)
  - Complete account policy and runtime settings workflows (#6539)
  - Complete integration recovery and maintenance workflows (#6542)
  - Complete observation and explicit-key API workflows (#6545)
  - One-page Claude Code settings and Desktop model roles (#6596)
  - Show the missing-store remedy in the dashboard (#6597)
  Bug Fixes
  - Promote scoped caller conversation headers (#6554)
  - Retain bounded conversation trajectories (#6557)
  - Preserve bounded large headers in picker relay (#6551)
  - Qualify child trajectories by supplied parent (#6565)
  - Share reset replay grants across translated sends (#6555)
  - Preserve deferred and inline native tool names (#6552)
  - Preserve native Claude requests across pooled dispatch (#6559)
  - Require saved config authority for routed removal (#6553)
  - Bind catalog writes to home ownership and intent (#6558)
  - Preserve additional tool outputs during replay (#6576)
  - Say why a dropped chatgptDesktop block reads as off (#6486)
  - Honor consented credits after included quota exhaustion (#6572)
  - Default config flags-only calls to show (carry #6483) (#6585)
  - Release Anthropic refresh intent after a proven-unsent DNS failure (#6586)
  - Report the spent primary, not the fallback's own refusal (#6564)
  - Skip non-executable POSIX PATH entries in readiness checks (#6493)
  - Preserve reasoning defaults after settings normalization (#6577)
  - Wait for a complete Bun before restarting onto a replaced package tree (#6569)
  - Keep Unix autostart shims off package-manager paths (carry of #6301) (#6589)
  - Guard standalone update restart with exact replacement verification (#6556)
  - Write DSH routes to the Desktop profile patch it reads (#6522)
  - Explain Codex shim overlay migration and activation in status and doctor (#6607)
  - Show account health actions, paid-credit consent, and empty-list next steps (#6611)
  - Correct help and CLI reference text and show declared flags in leaf help (#6609)
  - Stop-first manual reinstall guidance; refresh shim, update-failed, and ZCode guide text (#6619)
  - Keep inference ports independent of management ingress (#6601)
  - Normalize native upstream session aliases (#6588)
  - Short sidebars, Claude sidecar rows, Save errors and legacy #debug after the GUI regroup (#6612)
  - Keep armed test processes out of the real Codex home (#6591)
  - Serve the Desktop picker over HTTP/2 so SSE streams cannot starve claude.ai (#6511) (#6610)
  - Stop echoing values in claude desktop apply argument errors (#6618)
  - Keep Claude Desktop role selects inside the Models card (#6625)
  - Integration dialog starts on Close; client status failure offers Retry (#6623)
  - Name ocx start when integration preview finds no running proxy (#6622)
  - Reject arguments to uninstall and redact credential values in argument errors (#6608)
  - Honest exit codes and JSON receipts for config, alias, health, update; validate provider add before saving (#6614)
  - Name the real cause and next action in restart, update, and management refusals (#6615)
  Documentation
  - Record 2.77.0 candidate acceptance and publication (#6561)
  - Close the CLI update restart unit with its delivery outcome (#6595)
  - Sync Connect, Claude settings and DSH profile-patch guides with the dashboard (#6613)
  Chores
  - Open dev at 2.78.0 before releasing 2.77.0 (#6549)
  - Compact the test-layout fixture to restore ratchet headroom (#6583)
  - Isolate provider fixture DNS and bound child lifetime (#6578)
  - Guard Kilo symlink regression on Windows (#6405)
  - Make audio device refusal and login child import portable to Windows (#6599)
  - Make the startup-proxy refresh test hold on Windows (#6600)
  - Make catalog audit and provider proxy fixture robust on Windows; state unhealthy in-place shim status (#6602)
  Other Changes
  - 2.78.0 (#6632)
