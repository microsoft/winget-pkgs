ReleaseNotes: |-
  Published to npm as @bitkyc08/opencodex@2.86.0 with dist-tag latest.
  New Features
  - Add Modelflare API-key preset (#7037)
  - Let Codex own the native main refresh when a supported binary exists (#7048)
  - Infer custom-provider context windows from model metadata (#7024)
  - Expose declared Ultra Fast in the desktop speed picker (#6927)
  - Add provider-independent advisor runtime (#5955)
  - Add opt-in Windows desktop compatibility controls (#6079)
  - Configure CLI tier defaults and explicitly apply user settings (#6934)
  - Add Qoder client integration and config export (#5950)
  - Antigravity direct lane for Chat (no internal Responses hop) (#7080)
  - Gemini 4 Argon + per-account Antigravity lineup (CLI UA for Argon, 4.6/5.5 by account roster) (#7071)
  - Antigravity direct lane for Messages, on by default (#7081)
  Bug Fixes
  - Isolate diagnostic servers from live Codex restart (#7018)
  - Bound managed config reads and writes (#7029)
  - Preserve home guards in isolated child environments (#7023)
  - Require stable numeric health sentinel endpoints (#7031)
  - Support an opt-in minimum output-token budget (#7028)
  - Parse code-mode declarations in bounded linear time (#7025)
  - Terminate requests on negotiated model scope denial (#7026)
  - Bound overflow parsing and batch replay scrubs (#7020)
  - Safely unlink generated profiles (#7021)
  - Verify PATH ancestry and reject temporary app bundles (#7022)
  - Serve the in-flight token when a native main save is refused (#7035)
  - Preserve distinct Desktop aliases with effort fallback (#7007)
  - Let the Codex shim run under OpenCodex Desktop without a competing proxy (#6971) (#7032)
  - Credit smd-submitted Start at Login job on macOS (#7019) (#7033)
  - Recover runTurn keys on scoped 401/429 failures (#6992)
  - Preserve Mistral typed text and thinking blocks (#7047)
  - Preserve tool catalog boundaries across inbound wires (#7030)
  - Reject non-regular Desktop configuration reads (#7036)
  - Bound default bootstrap file reads (#7039)
  - Offer Ultrafast for GPT-6 Astra and GPT-6.1 Sol in the speed picker (#7050)
  - Recognize TypeScript Agent SDK client identity (#7059)
  - Avoid false doctor integrity failure on checkpointed WAL history (#7060)
  - Recognize standalone MSI installs in CLI checks (#7063)
  - Timestamp and rotate managed service logs (#7064)
  - Carry ChatGPT launcher, SOCKS5 TLS deadline and 429 triage docs (#7055, #7056, #6925) (#7065)
  - Accept authorized social device grants and quarantine desktop Bad credentials (#7053, #7054) (#7062)
  - Preserve shim ownership across APFS reboots (#7061)
  - Accept the shared freeform fallback field at the exec gate (#7049) (#7069)
  - Forward context management for native Claude clients (#7042) (#7067)
  - Recover through launchd/systemd before an unsupervised fallback (#7043) (#7074)
  - Rebuild large request-history indexes on a worker thread (#6990) (#7070)
  - Answer the main hard lock as a usage limit, clamp retry to pool recovery (#7046) (#7076)
  - Dashboard update restarts through launchd/systemd before an unsupervised fallback (#7043) (#7078)
  - Remove the shared root causes of flaky Windows CI (#7107)
  - Promote dev 494c50d02f to main as 2.86.0 (#7110)
  Chores
  - Open dev at 2.85.0 before releasing 2.84.0 (#7014)
  - Preserve generation diagnostics and wait for tray probe readiness (#7038)
  - Run only the fast ubuntu subset on PRs; cross-platform matrix on push to dev/main (#7052)
  - Cross-platform CI manual-only on dev (drop dev push); document CI policy (#7057)
  - Preserve release-on-cancel admission (#7034)
  - Remove PackyCode sponsorship (#7072)
  - Stale-ledger build case fails on Windows (ino + 1 loses precision) (#7087)
  - Shared-probe cases leak the native-main claim into teardown on Windows (EBUSY) (#7088)
  - Stub the in-handler pre-route prime so Windows teardown can remove CODEX_HOME (#7091)
  Other Changes
  - Open dev at 2.86.0 before releasing 2.85.0 (#7093)
  - 2.85.0 (#7094)
