ReleaseNotes: |-
  Published to npm as @bitkyc08/opencodex@2.100.9 with dist-tag latest.
  New Features
  - Read-only client connection view and Claude first-party preview (#9108)
  - Validate inline edit sources without decoding them (#9072)
  - List local Claude Code sessions (#8992)
  - Reuse parsed tool ranges in completed answers (#9068)
  - Per-account diagnostics with eligibility, refresh outcome and cooldown (#9109)
  - Add quota-only failover and a same-model guard (#9089)
  - Persist API-key cooldowns across restarts (#9107)
  - Manage quota-only failover from the API and CLI (#9090)
  - Add Spanish dashboard and README (#8706)
  - Opt in to batching private ACL restrictions (#8996)
  - Per-account routes for Codex pool accounts (#9113)
  - Add fallback presets and a route preview to the Combo editor (#9091)
  - Add SWE-2.1 to the Devin provider (#9127)
  - Carry video input where a wire publishes it, refuse it everywhere else (#9131)
  - OpenAI Videos wire for images.videoProvider and public /v1/videos (#9128)
  Bug Fixes
  - Let the Combos page scroll past suggested combos (#9105)
  - Name a configured Ultrafast tier like the native one (#9104)
  - Check the stop deadline after reading the idle task state (#9058)
  - Give the post-restart relay check room for SSH setup (#9095)
  - Retire a carried monthly window when Plus reports its 5-hour window (#9097)
  - Send x-opencode-session in opencode-go completion test (#9079)
  - Stop an update wedging on its own teardown receipts (#8960) (#9062)
  - Explain a missing Windows scheduled task on start (#9043)
  - Keep an explicit provider proxy authoritative over process NO_PROXY (#9112)
  - Limit new sessions while preserving active conversations (#9065)
  - Bound pending tool data in translated streams (#9067)
  - Report consumed quota share in the per-account quota table (#9077)
  - Learn exact refusals for registered native models (#9050)
  - Write the loopback placeholder key for the keyless listener (#9071)
  - Serve ocx link status over the local control socket on Windows (#8998) (#9022)
  - Apply caller model scope to the selected helper (#9061)
  - Sanitize Claude Code 429 trigger phrases for gemini-4-neon (#9081)
  - Accept the context route in Desktop observation (#9099)
  - Rewrite official Claude Code CLI opener for Cognition (#9080)
  - Degrade unsupported original image detail on Z.AI Responses (#9048) (#9049)
  - Verify service owners when WMI evidence is missing (#9027)
  - Fix checked stop on localized Windows Task Scheduler states (#9041)
  - Restore guarded stop cleanup with native Windows owner proof (#8933)
  - Share schema normalization budgets across tool definitions (#9063)
  - Refresh Neuralwatt models, reasoning replay and usage prices (#9036)
  - Rebind API-key cooldown persistence to the surviving server's home (#9125)
  Documentation
  - Proxy upstream catch-up roadmap (#9106)
  - Point reporters to the supported dev branch (#9059)
  - Explain native compaction replay across model changes (#9044)
  - Describe preview version names and ordering (#9073)
  - Restore Spanish parity for adapters and Codex integration notes (#9122)
  Chores
  - Stabilize Link preflight and standalone stop checks (#9064)
  - Move pool-account failure helpers into core-combo-failure (#9088)
  - Drop orphaned docstring at end of restore.ts (#8973)
  - Isolate sticky selection from the header-timeout fixture (#9070)
  - Follow the per-endpoint inherited receipt count in the sibling stop oracle (#9114)
  Other Changes
  - Add AI/ML API as a built-in provider (#8919) (#8935)
