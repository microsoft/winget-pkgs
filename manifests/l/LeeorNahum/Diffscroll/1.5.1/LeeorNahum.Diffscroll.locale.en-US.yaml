ShortDescription: A directory-scoped live Git diff viewer.
Description: Point Diffscroll at a folder or a file and every pending Git change there renders as one smooth, syntax-highlighted scroll in a real window, submodule content included, read-only. The view stays live, refreshing as you save while holding your reading position. A global hotkey opens the changes you are looking at, Explorer entries open a selected folder or file, and the diffscroll command also compares two files, two folders, or two commits.
Moniker: diffscroll
Tags:
- developer-tools
- diff
- diff-viewer
- git
- version-control
ReleaseNotes: |-
  Windows now lists the publisher of Diffscroll as Leeor Nahum in Installed apps, the name on the installer's signature.

  Since 1.5.0, opening a folder or a file inside a repository shows only the pending changes at or under it, windows left open when Diffscroll ends unexpectedly are offered back, and diffscroll --list prints each open window.
