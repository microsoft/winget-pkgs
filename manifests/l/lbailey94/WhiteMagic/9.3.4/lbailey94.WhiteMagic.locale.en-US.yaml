ShortDescription: Local-first memory, recall, and continuity engine for AI agents (MCP).
Description: |-
  WhiteMagic is a local-first memory and continuity engine exposed over the Model Context Protocol (MCP): durable memory creation, lexical and vector recall, session record/replay, and a complete backup, verification, and restore path. No telemetry by default and no required cloud service.

  The package installs the `wm` CLI and MCP server (`wm serve`, JSON-RPC over stdio) plus diagnostics (`wm doctor`, `wm stats`). An optional hosted lane is available at https://mcp.whitemagic.dev/mcp.
