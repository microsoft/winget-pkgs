ShortDescription: Native Windows 11 hardware monitor extension for PowerToys Command Palette and Dock.
Description: >-
  Thermo is a lightweight, Windows 11-native hardware temperature and system monitoring extension for PowerToys Command Palette and the PowerToys Dock.
  Features real-time CPU Package & Core Average temperature monitoring, GPU Core temperature, CPU and GPU utilization, and physical RAM tracking.
  Includes authentic Segoe Fluent Icons and independent dock widgets that can be enabled, disabled, and repositioned on the Dock individually.
