# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
# Generated by scripts/new-package-manifests.ps1 — edit the template, not the output.
#
# InstallerType zip + NestedInstallerType portable means winget unpacks the archive and puts the
# app on the user's PATH. RelativeFilePath assumes the flat archive layout produced by
# scripts/build-portable-zip.ps1 (Zush.Windows.App.exe at the archive root).
#
# ArchiveBinariesDependOnPath: true makes winget add the install directory to PATH instead of
# creating a symlink in the WinGet Links directory. Zush.Windows.App.exe is a .NET apphost that
# looks for Zush.Windows.App.dll next to the path it was invoked through, so when it starts via
# the Links symlink it looks in the Links directory and fails. winget-pkgs validation of 3.12.0.0
# showed exactly that: Links\zush.exe exited with "The application to execute does not exist:
# '...\WinGet\Links\Zush.Windows.App.dll'" (0x8000809A).
#
# With this setting, released winget clients (up to 1.29.x) ignore PortableCommandAlias: the
# command on PATH is `Zush.Windows.App`. Clients built from winget-cli after PR #6308 also create
# a `zush.exe` hardlink next to the app, so `zush` works there. Keep the alias for that.
#
# Portable installs do not create a Start menu shortcut. That is expected for this package type.

PackageIdentifier: Lirikpro.Zush
PackageVersion: 3.15.0.0
MinimumOSVersion: 10.0.19041.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: Zush.Windows.App.exe
    PortableCommandAlias: zush
ArchiveBinariesDependOnPath: true
ReleaseDate: 2026-10-22
