ShortDescription: ssh, scp and sftp that answer the password or key passphrase prompt from a stored secret
Description: sshc runs the OpenSSH client that ships with Windows and answers its login password or SSH key passphrase prompt from a stored secret, using OpenSSH's own SSH_ASKPASS hook. It is a single executable with no dependencies such as sshpass or expect, and passes every ssh, scp and sftp option through unchanged.
