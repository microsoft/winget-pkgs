ReleaseNotes: |-
  Version 0.84.0
  ✨ New
  - Added desktop conversation round navigation for quickly browsing and jumping between rounds in long sessions.
  - Added support for Google Antigravity and updated multiple ACP coding agents.
  🐛 Fixes and Improvements
  - Improved Codex history imports to avoid unexpectedly resuming old threads while viewing their history.
  - Fixed path and argument handling when Kimi and other ACP agents run commands and tools on Windows.
  - Improved the preferences layout in narrow windows, first-run status indicators, and the macOS Dock icon.
  - Fixed light-mode rendering on the website and startup failures in some browsers.
