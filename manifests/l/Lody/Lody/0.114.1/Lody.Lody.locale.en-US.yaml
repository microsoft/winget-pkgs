ReleaseNotes: |-
  Version 0.114.1
  ## ✨ New features
  - EverMe is now available as an account-wide memory provider. Install it with one click or set it up manually.
  - The experimental Today outline brings notes, to-dos, and session mentions onto one page. Turn an item into a task, focus on a branch, expand your selection in stages, or edit several items at once. On desktop, open Today in its own window alongside your session.
  - Organize sessions into Focus, Later, and Settled in the new Status view. Snooze a session for one or three hours, or drag it back into Focus.
  - Group pinned sessions and arrange them by hand. Choose which groups to show on each device or start a session directly inside a group. The sidebar scrolls as you drag a session near the edge.
  - Press ⌘/Ctrl + 1–9 to switch among the first nine visible sessions. Expand longer lists one page at a time.
  - Link or unlink a GitHub PR from a session, hand a linked PR to Auto delivery, and see merge feedback in the sidebar.
  - Open a session’s working directory in Finder or File Explorer from its menu. Modifier-click a URL in the terminal to open it in your browser.
  - Preview attachments in the session side panel and adjust video playback speed.
  - Press Up or Down in an empty composer to recall sent messages. Customize shortcuts for model search, thinking effort, and the attachment menu.
  - Codex adds an Ultrafast speed option. You can now sign in to Antigravity remotely from Lody.
  - In Lody Agent settings, view and refresh the models available from a custom endpoint and set the default model, thinking effort, and autonomy for new sessions. The Prompt and Agent Role editors have also been redesigned.
  - Let Lody run a long command in the background. When it exits, the session receives the result and continues. Session editors can also manage automations on shared machines.
  - Export and import workspaces from desktop Settings → Data or the CLI. Members of the destination workspace get read-only access to content imported from another workspace.
  ## 🐛 Fixes and improvements
  Fixed conversation quote actions appearing above modal dialogs.
  Fixed production packaging arguments for the Windows and Linux stable installers.
  The archive now opens as a single list, so you can browse older sessions without expanding groups.
  The composer respects your interface font size. Prompt shortcuts also work when editing a sent message.
  Click a session mention in a sent message to open that session. Markdown links to sessions in the current workspace also open inside Lody.
  Composer submenus stay on screen in narrow windows. The mention menu hides Issue and PR categories for projects without a linked GitHub repository.
  Background windows no longer mark sessions as read unexpectedly. Reordering Focus also preserves the unread state of a session that just returned from Later.
  Open windows retain their own sidebar views when you collapse a group or change a filter in another window.
  Stopping a send keeps queued messages as drafts you can edit and send yourself. A single “continue” resumes a turn interrupted by a restart.
  Fixed newly created sessions getting lost after a crash and files missing from the workspace changes list.
  Previews stay open when you switch away from a session and return. Fixed large local HTML previews and project assets or redirects failing to load in previews.
  Remote file searches run on the machine hosting the files. GitHub branches load a page at a time to reduce waiting in large projects.
  Fixed empty command and skill menus in Antigravity, and sessions still showing as working after background tasks ended.
  Fixed the entire Magpie model catalog failing to load when a model supplied custom reasoning-effort values or a long list of input types.
  Agent connections, Claude usage queries, desktop connections, and automations use your configured proxy. You can also continue desktop sign-in in your browser.
  Fixed the lody command being unavailable in the terminal after a standalone installation. An explicit reinstall activates the newly installed daemon version.
  Desktop startup is faster, the CLI daemon uses less memory, and long sessions load their history more efficiently when reopened.
  Thanks to YangtzeSeventh, Kina, samzong, biny, Astro-Han, peanuts022, Jackey-Z, and songtianlun.
