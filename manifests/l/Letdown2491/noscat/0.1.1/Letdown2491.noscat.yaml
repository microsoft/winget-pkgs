ShortDescription: Like netcat, but over a Nostr-native mesh - npub-addressed tunnels, no root, no accounts
Description: |-
  noscat gives every machine a self-generated Nostr identity (a keypair) and
  tunnels encrypted traffic between machines by that identity. Direct
  end-to-end encryption over UDP with NAT hole punching; Nostr relays are
  only the discovery channel. Includes tailnet (MLS group) scoping, file
  transfer with resume, and TCP port forwarding.
