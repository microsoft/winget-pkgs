ShortDescription: Like netcat, but over your own device mesh: npub-addressed, end-to-end encrypted, no root, no accounts
Description: |-
  noscat joins your devices into a private mesh. Each device has its own
  self-generated Nostr identity (no account). Membership is a Marmot (MLS)
  group carried by Nostr relays, so every member can verify who is in the
  mesh and any member can manage it; there is no coordinator. Data goes
  device to device over FIPS, an end-to-end encrypted overlay keyed by the
  same identities, with QUIC streams on top: file transfer with resume,
  chat, clipboard sharing and TCP port forwarding, all in userspace.
