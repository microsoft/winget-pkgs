ShortDescription: Orchestrate multiple AI coding agents across multiple projects from a single terminal.
Description: |-
  orkai is a terminal interface that runs and supervises Claude Code, Codex and other AI coding agents, plus plain terminals, across many projects from a single screen.
  It shows which agents are working, waiting for you or done, alerts you when one needs you, keeps every agent alive when the interface is closed or updated, can give each agent its own git worktree and can be opened from a phone.
