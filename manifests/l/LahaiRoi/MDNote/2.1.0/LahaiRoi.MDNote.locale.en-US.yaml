ShortDescription: Lightweight Markdown and TXT editor for Windows with a formatted (WYSIWYG) view.
Description: MDNote opens like Notepad and lets you write Markdown in a formatted view without typing syntax, while saving standard .md files. It also has a Live mode (raw syntax only on the caret line), a source mode, a TXT mode with line numbers and many encodings, table editing, and recovery of unsaved text. No network access, no data collection.
