ReleaseNotes: |-
  This release also added the rpm package for the first time.
  Please note a breaking change in the CLI when sending files.
  - feat: make sending checksums opt-in
  - feat: format timestamps using system date and time settings
  - feat(cli): send text using --text, including input from stdin
  - feat(cli)!: replace --file with the send command for sending files and directories
  - security: limit simultaneous incoming connections to prevent resource exhaustion
