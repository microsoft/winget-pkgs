ShortDescription: Sync your Medal clips between gaming PCs.
Description: |-
  Medal Sync is a free, open-source Windows companion for Medal. It records to an
  SSD-cached virtual drive, keeps the clip library on your own NAS, disk or cloud
  drive, and hands it from PC to PC. Each PC keeps its own Medal login and
  recording settings. Not made by or affiliated with Medal.
