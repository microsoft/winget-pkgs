ReleaseNotes: |-
  Desktop installers for Hiroba v0.5.0.
  After installing, open an invite link or point the app at your server.
  Server self-hosting: docs/SELF_HOSTING.md
  English
  - Screen sharing now carries your computer's sound. The people watching hear what you play: a video, music, a listening exercise. On Windows, tick the audio option in the picker. On a Mac this needs macOS 13 or later. What Hiroba itself plays is left out, so nobody hears their own voice coming back.
  - Your camera stays on while you share your screen. Viewers see your face in the corner of your screen, or in the strip, and can click it large.
  - Missed calls stay on the roster. A call that timed out or was withdrawn, or that came while you were in do-not-disturb or another call, marks the caller's row with the time and a count. Its button calls back; × dismisses it. The count also shows on the Dock badge and on the members tab of the phone layout.
  - Hiroba can open when you sign in to your computer. It turns on from your first entry (a toast says so) and can be turned off in the settings panel. A launch at login comes up minimised and walks into the office by itself, muted.
  日本語
  - 画面共有に PC の音声が乗るようになりました。動画や音楽、リスニング教材の音がそのまま相手に届きます。Windows では共有時のダイアログで音声のチェックを入れてください。Mac は macOS 13 以降が対象です。Hiroba 自身の再生音は除くので、相手の声が相手に戻ることはありません。
  - 画面共有中もカメラをつけたままにできます。見ている側には画面の隅か一覧に顔が出て、クリックで大きくできます。
  - 不在着信が一覧に残るようになりました。呼び出しが時間切れや取り消しで終わったときや、取り込み中・別の通話中にかかってきたときは、相手の行に時刻と回数が付きます。ボタンで折り返し、× で消せます。回数は Dock のバッジとスマホ表示のメンバータブにも出ます。
  - PC へのサインイン時に Hiroba を自動で開けるようになりました。最初の入室で有効になり(トーストでお知らせします)、設定パネルで切れます。自動起動では最小化で立ち上がり、ミュートのままオフィスに入ります。
  Español
  - Compartir pantalla ahora lleva el sonido de tu equipo. Quienes miran oyen lo que reproduces: un vídeo, música, un ejercicio de comprensión auditiva. En Windows, marca la opción de audio en el selector. En Mac hace falta macOS 13 o posterior. Lo que reproduce el propio Hiroba queda fuera, así que nadie oye su propia voz de vuelta.
  - La cámara sigue encendida mientras compartes pantalla. Quienes miran ven tu cara en la esquina de tu pantalla, o en la tira, y pueden ampliarla con un clic.
  - Las llamadas perdidas se quedan en la lista. Una llamada que caducó o se retiró, o que llegó mientras estabas en «no molestar» o en otra llamada, marca la fila de quien llamó con la hora y un contador. Su botón devuelve la llamada; × la descarta. El contador aparece también en el Dock y en la pestaña de miembros del diseño para móvil.
  - Hiroba puede abrirse al iniciar sesión en tu equipo. Se activa con tu primera entrada (un aviso lo indica) y se desactiva en el panel de ajustes. Al abrirse así arranca minimizado y entra solo en la oficina, en silencio.
