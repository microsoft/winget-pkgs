ShortDescription: A simple, lightweight markdown editor offering all the features you could ever need.
Description: |-
  Nib is a markdown editor that shows the formatting instead of the syntax: headings, bold,
  lists, tables, code and math are styled in place as you type, so there is no split pane and
  no preview to keep in sync. Notes are plain .md files on disk, opened and saved where you
  put them, with no library or vault to import into.
  Themes are single CSS files dropped into the config folder, every edit is snapshotted so a
  bad change can be undone later, and the same editor runs in the browser at nibeditor.com.
