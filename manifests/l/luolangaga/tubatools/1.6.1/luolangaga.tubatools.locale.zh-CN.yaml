ReleaseNotes: |-
  图吧工具箱CE v1.6.1
  > 官方网站：https://tubawinui3.cn
  > 官方下载：https://tubawinui3.cn/download
  > GitHub 仓库：https://github.com/luolangaga/tubatool
  >
  > ⚠️ 请认准上述官方渠道下载。任何其他网站提供的所谓"破解版"、"绿色版"、"精简版"均非官方发布，可能包含恶意软件！
  ✨ 新功能
  - 跑分历史回顾：新增“历史对比”窗口，打开即自动展示最近一次测试的完整成绩明细。左侧为历史时间线，点击任意记录可查看该项的 CPU、GPU、内存、硬盘、浏览器等各分项得分，并支持与上一次成绩自动对比（上涨/下跌/持平），还可将历史记录载入主页导出报告，或单条删除、两步确认清空全部。
  - 下载队列多线程支持：下载中心现在支持多个任务同时并行下载，不再逐个排队，多个工具或引擎可以一起下载，大幅缩短等待时间。
  - 格式转换接入 OfficeCLI 渲染引擎：Word、Excel、PPT 等 Office 文档在转换为 PDF 或图片时，会优先使用一个新的“文档渲染引擎”进行真实逐页渲染，保留原始排版、表格、图片、复选框、页眉页脚等细节。该引擎可单独下载（约 33MB，一次性下载，之后完全离线使用），也可在转换时自动下载；未安装时自动回退到原有内置引擎。
  - 精简版支持独立工具包：精简版（Lite）不再强制下载完整内核包，首次启动更轻快；若发行包同时提供精简工具包（Tools_Lite.zip），精简版用户可以下载更小的精简包。
  🎨 界面改进
  - 产品名称全面更新为“图吧工具箱CE”：所有窗口标题、托盘提示、通知消息、水印、测试报告等位置均更新为“图吧工具箱CE”。
  - 数字素养测试体验升级：题目选项顺序会随机打乱，避免固定答案位置；长选项文本支持鼠标悬停走马灯滚动展示，不再被卡片截断；题目内容也进行了优化更新。
  - 硬件信息多设备显示默认换行：当存在多个同类型硬件（如多块硬盘、内存条）时，默认使用换行分隔显示，不再堆在一行内，信息更清晰易读。
  - 网速测试界面增加单位切换：测速结果支持在 Mbps 与 MB/s 之间切换显示，满足不同用户习惯。
  - Windows 镜像下载页面重构：系统镜像下载页面（UUP dump）全新设计，版本列表、语言选择、版本选择更清晰，并提供更多可选项（如包含更新、清理临时文件、集成 .NET 3.5 等）。
  - 格式转换页面增加文档渲染选项：在转换设置中新增文档参数的清晰度、页码范围、渲染模式（自动/原生/HTML）以及 JPG 质量等自定义选项，满足高级用户需求。
  ⚡ 性能优化
  - 游戏监控悬浮窗近零空闲开销：悬浮窗渲染改为增量渲染模式，只有数据变化时才重新绘制，空闲时几乎不占用 CPU，最大程度降低对游戏帧数的影响。
  - 下载队列多线程并行：多个下载任务同时进行，充分利用带宽，整体下载效率更高。
  - 精简版启动更快：精简版不再强迫下载内核工具包，首次启动可直接使用内置工具，无需等待大文件下载。
  🐛 问题修复
  - 修复安装到 Program Files 时 WebView2 数据目录写入失败：某些情况下工具箱安装在 Program Files 等受保护目录时，内置网页组件（WebView2）无法初始化并弹出“无法读取和写入其数据目录”错误。现已将数据目录固定到用户本地应用数据目录，问题解决。
  - 修复部分内存品牌映射不正确：更正了三星、美光、金士顿、海力士、英睿达、芝奇、科赋等内存品牌的识别码映射，硬件信息中的内存品牌显示更加准确。
  - 修复游戏监控悬浮窗文本残留问题：当悬浮窗数值从长数字变为短数字（如从 “120 FPS” 变为 “9 FPS”）时，旧字符残留导致显示重叠的问题已修复。
  - 修复硬盘监控页面因单个硬盘读取失败而崩溃：现在某一块硬盘读取失败时，仅在该硬盘卡片上标记“读取失败”并显示错误原因，不会影响其他硬盘信息的展示，页面不再整体崩溃。
  - 修复工具列表重复卡片问题：某些用户自定义排序配置中重复的记录导致工具页面出现重复卡片，现已去重。
  - 修复精简版首次启动弹出下载内核包提示：精简版用户之前首次启动会看到不必要的内核包下载提示，现已按需判断，仅当用户曾下载过内核包时才检查更新。
  - 修复工具目录下未收录工具被错误显示：工具箱目录中未被正式收录的工具（如一些自行放入的第三方工具）不再出现在工具列表中，列表更纯净。
  - 修复长选项文本溢出卡片：数字素养测试中较长的选项文字会溢出卡片边界，现已采用走马灯滚动显示并限制单行，界面更整齐。
  🔧 其他改进
  - 题库内容更新：数字素养测试的题目和正确答案解析进行了修订，包括对 Steam 下载、显卡插线、软件卸载、安装路径等题目的表述优化，部分题目替换或调整，使内容更准确、更贴近实际。
  - 系统镜像下载功能重构：改进与 UUP dump API 的对接，提升版本、语言、版本信息的解析稳定性，并增加对更新包、Server 等特殊版本的正确分类。
  - 硬件品牌识别扩展：新增支持更多显示器面板厂商识别（如海信、日立、海尔、三菱、美格、微星、TCL 等），提升硬件信息检测覆盖范围。
  - 社区工具安全提示更新：下载社区工具时的免责提示文本同步更新为“图吧工具箱CE”。
  - 错误报告窗口标题更新：错误报告窗口标题同步更新品牌名。
