  > ⚠️ 请认准上述官方渠道下载。任何其他网站提供的所谓"破解版"、"绿色版"、"精简版"均非官方发布，可能包含恶意软件！
  ✨ 新功能
  - Steam 工具箱：全新推出 Steam 工具箱，提供 Steam 社区/商店/图片等服务的网络加速，支持一键启用/停用，自动恢复 hosts 文件；同时新增 Steam 游戏时长挂卡功能，可模拟游戏在线状态。
  - 局域网设备扫描：新增局域网设备检测工具，可列出同一网络下的设备，识别设备类型、厂商、MAC 地址，区分本机、网关和随机 MAC 设备，支持对可疑设备进行“踢除”操作。
  - 窗口管理器：新增窗口管理工具，可对任意窗口进行无边框、置顶、隐藏、还原、全屏、最大化、最小化、关闭等操作，方便多窗口管理和游戏优化。
  - 硬件排名定位：在性能排行榜页面新增“本机型号”卡片，显示本机 CPU/GPU 在排行榜中的具体位置，点击可快速跳转到对应条目。
  - AI 助手集成：支持通过命令行方式让外部 AI 助手（如 Claude、Codex 等）查询本机硬件信息（CPU、传感器、磁盘等），返回 JSON 格式数据，方便自动化运维和诊断。
  - WiFi 密码查看增强：支持解析 WPA3 等新型加密的 WiFi 配置文件，并生成二维码分享；修复了特殊字符转义问题，分享更准确。
  🎨 界面改进
  - 压力测试页面：新增“打开 HWMonitor”按钮和提示文本，建议用户使用 HWMonitor 查看更准确的温度、功耗数据；开始烤机时自动尝试打开 HWiNFO（若已安装）。
  - 首页搜索体验：搜索框获得焦点时自动显示建议；提交搜索时自动刷新结果并高亮选中；按 Esc 关闭后再次聚焦可恢复显示；搜索结果支持直接启动内置工具，外部工具根据状态自动下载或启动。
  - 图标系统升级：大量界面图标替换为彩色 SVG 图标，在高对比度模式下自动切换为原生单色图标，提升视觉一致性。
  - 对话框样式统一：所有系统对话框采用新的统一样式，与整体 WinUI 3 风格更协调。
  - 仪表盘功能卡片：背景改用半透明亚克力材质，在浅色/深色主题下显示更自然。
  ⚡ 性能优化
  - 启动后台任务延迟调整：图标缓存清理延迟至启动后 45 秒，硬件信息预热延迟至 20 秒，日志和临时文件清理延迟至 60 秒，减少开机启动阶段的磁盘和 CPU 占用，提升启动响应速度。
  🐛 问题修复
  - FurMark 启动路径：修复 FurMark 安装在包含中文或特殊字符的路径下无法启动的问题，现在会自动创建纯英文目录联接（不复制文件），确保 FurMark 正常启动，同时不影响原始文件。
  - 桌面快捷方式：修复从包含中文路径的目录创建桌面快捷方式时目标路径错误的问题，快捷方式现在使用 ASCII 路径，确保其他工具正常识别。
  - 搜索结果竞态：修复搜索结果提交时可能因异步竞态导致显示过期结果或无法打开工具的问题。
  - AI 配置存储：修复 AI 配置存储文件损坏时可能导致密钥丢失的问题，现在会自动从备份恢复，并弹出提示通知用户。
  - MSIX 打包版本号：修复 MSIX 打包版本号与应用内版本号不一致的问题，确保更新提示准确。
  - WiFi 密码解析：修复 WiFi 密码解析中 XML 转义字符和特殊字符处理不正确的问题。
  🔧 其他改进
  - 证书阻止列表更新：新增 360 浏览器、金山、爱奇艺、瑞星、迅雷等多家厂商 2026 年 5 月最新版数字证书，提升对流氓软件的拦截能力。
  - 隐私政策更新：明确数据收集和使用范围，符合最新隐私合规要求。
  - 赞助入口：新增支付宝和微信赞赏码入口，支持用户赞助开发。
