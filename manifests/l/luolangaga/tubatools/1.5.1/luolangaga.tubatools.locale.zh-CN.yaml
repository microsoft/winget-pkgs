ReleaseNotes: |-
  图吧工具箱WinUI3 v1.5.1
  > 官方网站：https://tubawinui3.cn
  > 官方下载：https://tubawinui3.cn/download
  > GitHub 仓库：https://github.com/luolangaga/tubatool
  >
  > ⚠️ 请认准上述官方渠道下载。任何其他网站提供的所谓"破解版"、"绿色版"、"精简版"均非官方发布，可能包含恶意软件！
  ✨ 新功能
  - AI 快速提问助手：在标题栏新增了 AI 助手按钮，点击即可弹出快速提问窗口。支持直接输入问题、选择“新电脑验机”“电脑卡顿”“内存优化”等常用提问，还支持查看历史对话、新建对话、跳转完整版助手和 AI 设置，让你在不离开主页的情况下快速获取硬件建议。
  - 360 驱动大师纯净版支持：工具箱现在可以自动识别并启动 360 驱动大师纯净版，方便你一键检测和更新硬件驱动。
  - 同硬件排行榜点击查看详情：在跑分页面的同硬件排行榜中，点击任意条目即可弹出该跑分的详细报告，查看完整测试数据。
  - 延迟测试图片库更易用：CPU 核心延迟测试图片浏览现在支持滚动自动加载更多图片，不再需要一次性等待全部加载；图片查看时支持双指缩放，细节一览无余；图片下载后会自动缓存，再次打开速度大幅提升。
  🎨 界面改进
  - 标题栏布局调整：标题栏新增了 AI 快速提问按钮，与下载队列按钮并列排放，界面更紧凑。
  - 排行榜名次上色：跑分排行榜前三名现在以金银铜专属颜色高亮显示，名次更醒目。
  - AI 助手对话区域加宽：完整版 AI 助手对话框的消息气泡最大宽度增加，内容排版更舒展，减少换行，阅读更舒适。
  - 工具视图全宽显示：打开任意工具后，内容区域现在会自动占满可用宽度，不再局限在固定宽度内，宽屏下的体验更好。
  - 设置页增加操作提示：自定义工具管理页面新增提示文字“更改分类顺序后，需要重启软件才会生效”，避免调整后产生疑惑。
  ⚡ 性能优化
  - 主页启动速度提升：优化了首页标签栏（如“CPU检测”“内存测试”等快捷标签）的加载逻辑，减少了不必要的重复刷新，软件启动和切换页面时响应更快。
  - 延迟测试图片加载更流畅：图片列表改为分批次加载，第一屏立即显示，滚动时动态补充，大幅降低初次打开图库的等待时间；本地缓存也避免了重复下载，再次浏览几乎秒开。
  🐛 问题修复
  - 修复 GPU 名称欺骗在设备管理器不生效的问题：改写了显卡名称修改模块的底层查找逻辑，现在能够正确覆盖系统注册表中所有显示位置（包括 DeviceDesc、FriendlyName 等），任务管理器和设备管理器中看到的显卡名称会准确变为你自定义的名称。
  - 修复延迟测试图片下载失败：针对部分网络或数据源下延迟测试图片无法加载或超时的问题，增加了多条备用下载链接和重试机制，大幅提高图片加载成功率；超时错误提示也更具体。
  - 修复收藏夹工具图标不更新的问题：收藏页中的工具图标现在会跟随工具列表的变化同步更新，不再需要重启软件才能刷新。
  - 修复部分宽屏下工具视图显示不完整：改进了工具内容页的布局方式，现在无论窗口如何调整大小，工具界面都能完整铺开并正常显示。
  🔧 其他改进
  - AI 助手浮窗快捷跳转：从快速提问窗口可以一键跳转至完整版 AI 助手或直接进入 AI 设置页面，配置更高效。
  - 增强延迟测试图片下载稳定性：重构了图片下载流程，支持多地址竞速下载，优先返回最快可用的图片，并对下载请求进行去重，减少不必要的网络流量。
