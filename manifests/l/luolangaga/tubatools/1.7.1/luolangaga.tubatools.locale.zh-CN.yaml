  > ⚠️ 请认准上述官方渠道下载。任何其他网站提供的所谓"破解版"、"绿色版"、"精简版"均非官方发布，可能包含恶意软件！
  ✨ 新功能
  - 本地AI试炼场（全新内置工具）：不联网也能玩 AI——在电脑本地部署并运行模型：LLM 对话（Phi-3.5 / Phi-4 mini，多轮会话、历史可保存）、图像分类（ResNet-50）、目标检测（DETR / YOLO，支持摄像头与屏幕实时检测，可调置信度 / IoU / 类别过滤与自定义绘制规则）、图像特征对比（CLIP）。模型库一键下载（含国内镜像）或本地导入；自动选择 NPU / GPU / CPU 加速并显示当前运行设备，可在「引擎与设备」中安装各厂商加速包。推理组件不随安装包分发——首次使用时自动下载（带进度条），之后离线可用；不使用 AI 工具时零加载、零占用。
  - 文件占用查看（全新内置工具）：查看指定文件 / 目录正被哪个进程占用，展开可看每个进程持有的具体路径，并一键结束占用进程；支持加入资源管理器右键菜单（Win11 新菜单 / 经典菜单），修复了扫描卡死与句柄泄漏问题。
  - 句柄清理（全新内置工具）：扫描全系统句柄占用与疑似泄漏进程，一键安全清理指向已删除文件的失效句柄，缓解长期开机后越来越卡的顽疾。
  - 环境变量（全新内置工具）：查看与编辑用户 / 系统环境变量，PATH 支持逐条可视化编辑；保存前自动备份、保存后广播刷新，改完立即生效（对标 PowerToys Environment Variables）。
  - 内存管理（全新内置工具）：查看内存占用与细分容量（缓存 / 池 / 提交分不同口径展示）、简单整理缓存；分步迁移分页文件（虚拟内存）到其他磁盘，支持备份与恢复。
  - 连接手机（全新内置工具）+ 手机端 App：手机通过局域网（扫码 / 配对码 / IP）连接电脑——在手机上看电脑硬件配置与屏幕截图、实时硬件监控（自选监控项与曲线、FPS）、远程执行 PowerShell 命令、用 winget 安装软件，还能与电脑互传文字、图片和文件；配套安卓手机端「图吧工具箱手机助手」（安装包见下方下载表）。
  - PE 兼容版：新增独立的「图吧工具箱PE兼容版.exe」（单文件、免安装、无需 .NET），使用 Win32 + GDI 轻量前端，为 Windows PE / 精简系统准备；支持全部工具 / 分类浏览、搜索、工具启动、收藏与硬件信息，随便携包一起分发。
  - 关闭到系统托盘：设置新增选项（默认关闭；首次使用向导与「连接手机」会引导开启）——开启后点关闭按钮不再退出，而是留在托盘继续运行，避免误关闭后重启还要重新检测一遍硬件；双击托盘图标恢复窗口，右键可退出（托盘退出、注销 / 关机等场景会正常退出）。
  - 单实例运行：不再允许多开——重复启动（含桌面快捷方式、右键菜单唤起）会激活已运行的窗口并直达对应页面。
  - 恢复工具：首页新增「恢复工具」，扫描 Tools 目录找回未登记或丢失的工具并重新登记。
  - 工具显示管理：设置中可停用内置工具、控制哪些工具出现在开始菜单与 Windows 搜索（默认全部保留）。
  - 发送匿名使用数据（默认开启，可在设置中关闭）：发送匿名运行信息（版本 / 架构 / 系统版本）与错误日志，用于统计活跃用户与定位崩溃；不含个人信息，关闭后立即停止采集并清除待传数据。
  🎨 界面改进
  - 硬件详细信息页重做：15 个信息分区改为瀑布流参数卡片，每个分区配彩色图标，空分区自动隐藏；宽屏自动更多列，内容不足时自动铺满一屏，不再出现大片空白。
  - 内置工具彩色图标：全部内置工具换用 Fluent 风格双色矢量图标，桌面快捷方式也使用同款图标。
  - 设置页更新：「常规」区新增关闭到托盘、常用推荐、匿名使用数据、工具显示管理等开关；「常用」页顶部的推荐工具板块可一键隐藏。
  - 手机连接界面优化：配对流程更清晰（二维码 + 配对码 + 连接地址一目了然）。
  - 图标加载更顺滑：工具卡片图标分批加载、切换页面即时取消，滚动与翻页不再出现图标「蹦出来」的迟滞。
  ⚡ 性能优化
  - 「低配模式」（设置新增，取代原「快速模式」）：禁用动画与启动预加载，进一步降低老电脑上的资源占用。
  - 工具图标加载优化：图标加载支持取消与并发控制，快速切换页面不再堆积后台任务，内存占用更低。
  - 安装包体积更小：AI 推理组件改为按需下载（见上），未使用 AI 工具时不加载、不占内存。
  - 跑分排行加载更流畅：修复排行榜加载卡顿问题。
  🐛 问题修复
  - 修复工具卡片可能重复（issue #197）：跨分类的工具副本不再出现重复卡片。
  - 修复设置项搜索定位：通过全局搜索打开设置项后，能准确定位到对应卡片。
  - 修复显卡天梯图无法刷新：修正 GPU 分类数据源地址，并增加备用源。
  - 修复无法删除已提交的跑分记录。
  - 修复「一键三烤」在部分环境下报错。
  - 修复文件占用查看卡死：含卡死副本句柄回收、PID 复用识别、结果快照与续跑去重等多项稳定性修复。
  - 修复复制内容到剪贴板偶发失败：复制操作失败会自动重试。
  - 修复 PE 兼容版主题与 GDI 文本渲染问题。
  🔧 其他改进
  - 移除 AI 助手：AI 助手页面、顶栏吉祥物、快捷提问、浏览器自动化与技能等 Agent 能力、AI 设置（提供商 / API Key / 模型配置）整体移除；「本地AI试炼场」保留并独立可用。
  - 移除组件测试页及其设置入口。
  - 清理原版图吧工具箱遗留文件：移除已失效的下载地址、启动脚本等残留。
  - 随包工具更新：HWiNFO（x64 / ARM64）更新至随包最新版。
  - 补充第三方声明：明确 GPL 适用范围，新增 THIRD-PARTY-NOTICES 第三方组件声明。
  - 补充大量自动化测试：覆盖本地AI试炼场、句柄清理、环境变量、硬件详情、工具图标加载等模块，降低后续版本把老问题改回来的风险。
