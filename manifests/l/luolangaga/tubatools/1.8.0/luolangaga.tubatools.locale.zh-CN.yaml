  ✨ 新功能
  - 全新的炫酷硬件信息展示页
    新增了全新的硬件信息展示页面，以更直观、美观的方式呈现 CPU、GPU、内存、磁盘等关键硬件的详细参数，并采用了全新的视觉设计。
  - 内置屏幕工具
    新增内置的“屏幕工具”，无需额外下载即可使用：
    - 提供暖色、冷色、柔和、明亮、对比度等多种屏幕色彩预设，可一键调节色温。
    - 支持手动调整 Gamma、亮度、对比度，并可实时预览效果，确认后才会真正应用。
    - 可检测当前显示器的色域覆盖情况，并生成对应的 ICC 色彩配置文件，帮助改善色彩准确性。
    - 附带屏幕坏点检测等辅助功能。
  - 内存信息展示更详细
    硬件信息的内存部分现在除了显示容量、频率等常规参数外，还新增了理论速度和位宽等信息，帮助用户更全面地了解内存性能。
  - 联机工具告别登录，操作更简单
    游戏联机助手现已改用免登录方案（EasyTier），不再需要注册或登录任何账号。现在只需创建一个房间码，将房间码分享给朋友即可快速组网联机，大幅降低了使用门槛。
  - 驱动存储管理（可能为新增内置小工具或页面）
    新增了驱动存储管理能力，可以列出系统驱动存储中的驱动包，区分新旧版本，并支持导出或清理不再使用的旧驱动，帮助释放磁盘空间（具体入口以应用内实际情况为准）。
  - 运行日志查看器与系统托盘原生支持
    新增了运行日志查看器，用户可以在程序内直接查看运行日志，方便排查问题；同时托盘图标改为原生实现，交互更稳定。
  - 手机连接优化
    手机端连接功能增强：局域网发现更稳定，支持自动重连，生成的二维码更准确，扫码连接更顺畅。
  🎨 界面改进
  - 整体界面视觉效果优化
    对界面进行了多轮视觉打磨，包括颜色、间距、阴影和 3D 效果等，整体观感更加精致、流畅。
  - CPU-Z 数据源硬件信息界面优化
    当使用 CPU-Z 作为数据源时，硬件信息页面的排版和展示方式得到了优化，信息更清晰易读。
  - 内存详细信息展示模式优化
    优化了内存详细信息的展示模式，使各项参数排列更合理，阅读体验更好。
  - 工具按钮文字更准确
    修复了工具列表中已安装工具仍显示“下载”按钮的问题。现在，只要本地已存在启动文件，按钮就会显示“打开”，避免误导用户重复下载。
  - 移除“真”徽章
    去掉了部分兼容界面中的“真”字徽章，使界面更简洁。
  - 更新一批工具图标
    更新了大量内置工具的图标，使其风格更统一、更美观。
  - 修改 QQ 群文案
    调整了应用内展示的 QQ 群相关文字信息。
  - 删除不必要的显示器信息查看工具
    移除了一个功能重复或不再需要的显示器信息查看工具，让工具列表更精简。
  ⚡ 性能优化
  - 日志系统优化，减少磁盘占用
    后端日志现在会自动滚动，单个日志文件超过 1MB 后自动轮转，避免日志文件无限膨胀。同时，高频的调试信息不再写入磁盘文件，只显示在控制台，显著降低了日志对磁盘空间的占用。
  - 剪贴板复制更流畅
    优化了复制硬件信息到剪贴板的失败重试逻辑。当剪贴板被其他程序暂时占用时，会自动快速重试；遇到永久性错误则立即返回，不再无谓等待，避免了复制操作卡顿或闪退。
  - 游戏监控诊断噪音降低
    后台游戏监控的诊断日志记录频率从约 30 秒一次降低到约 5 分钟一次，减少了后台日志写入量，降低了资源消耗。
  - PE 环境硬件检测更高效
    对 PE 兼容版中的硬件信息检测模块进行了底层重写，直接调用系统接口，不再依赖传统的管理组件，在 PE 环境下检测速度更快、内存占用更低，兼容性也更好。
  🐛 问题修复
  - 修复 MSIX 内核更新失败问题
    修复了在部分特殊磁盘（如内存盘、加密盘）上安装内核更新时失败的问题，错误提示也更友好，现在会明确指出可能的原因（如磁盘不支持文件加密）。
  - 修复游戏联机必须登录的问题
    旧的联机方案要求用户登录账号，且经常出现“卡在启动”或“登录失败”的提示。新方案彻底移除了登录步骤，改用房间码直接连接，避免了账号相关的各种连接故障。
  - 修复手机连接二维码不准确的问题
    优化了二维码生成逻辑，修复了部分情况下扫码无法正确连接或识别错误的问题。
  - 修复硬件信息复制闪退
    修复了在硬件信息页点击复制“运行时间”等信息时，因剪贴板被占用而导致的闪退问题。现在会自动重试，失败也不会导致程序崩溃。
  - 修复工具按钮显示错误
    已安装的工具不再显示为“下载”，而是正确显示“打开”。
  - 修复某些硬件检测失败或数据不准确的问题
    通过底层 WMI 查询的改进，提高了硬件信息检测的稳定性和准确性，尤其在 PE 环境下能够更可靠地获取显示器等硬件信息。
  🔧 其他改进
  - 更新了一批内置工具
    整体的内置工具目录或定义进行了批量更新，可能包含新增工具、调整分类或更新版本等（具体变动已体现在新功能和界面改进中）。
  - 第三方声明文件更新
    更新了第三方组件声明文件（THIRD-PARTY-NOTICES），确保合规信息准确。该改动对用户无直接感知。
  - 测试覆盖率提升
    新增了大量自动化测试用例，覆盖显示器色彩、驱动管理、游戏联机、剪贴板重试、硬件检测等模块，有助于提高软件整体稳定性和后续更新质量（对最终用户间接有益）。
