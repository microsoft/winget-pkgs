ReleaseNotes: |-
  图吧工具箱WinUI3 v1.5.0
  > 官方网站：https://tubawinui3.cn
  > 官方下载：https://tubawinui3.cn/download
  > GitHub 仓库：https://github.com/luolangaga/tubatool
  >
  > ⚠️ 请认准上述官方渠道下载。任何其他网站提供的所谓"破解版"、"绿色版"、"精简版"均非官方发布，可能包含恶意软件！
  ✨ 新功能
  - 新增**烤机（压力测试）**功能：现在可以对电脑进行 CPU 单烤、GPU 单烤（调用 FurMark）或一键双烤。支持自定义烤机时长，实时显示温度、占用率、频率、功耗等指标，并自动记录曲线；烤机结束后可导出详细的 HTML 图表报告。
  - 新增电脑评分系统：根据硬件配置自动评估电脑性能，并以环形仪表盘直观展示评分结果和健康状态（正常/良好/较差/报废）。
  - 新增节能工具：支持静默启动节能模式（通过计划任务），在不打扰使用的情况下自动优化系统电源管理，降低整机功耗。
  - 新增视频处理器工具：方便进行视频格式转换等操作。
  - 新增一键验机快速检测流程，帮助用户快速核对新机硬件配置。
  - 下载工具时新增二次确认：避免误操作，点击下载后需要再次确认才能开始下载。
  - 工具自动更新检查：启动时会自动检查已安装工具的更新，并在主窗口弹窗提示，支持一键全部更新，更新完成后有状态提示。
  - 新增英文版 README，方便海外用户了解项目。
  🎨 界面改进
  - 新增烤机专用界面，包含实时监控仪表盘、可交互曲线图表、操作按钮和运行日志，数据展示清晰直观。
  - 新增环形健康仪表盘，以多彩圆弧显示评分，颜色随分值变化，视觉效果醒目。
  - 新增微型折线图控件，可用于在详情页展示温度、频率等历史曲线趋势。
  - 主窗口底部新增信息条，用于显示工具更新的进度和结果（成功/进行中/失败）。
  - 导航栏新增烤鸡分类图标，分类入口更易识别。
  - 优化了工具分类排序，工具列表和标签更合理，部分工具已调整至更合适的类别。
  - 改进了下载队列的显示样式。
  - 设置页面新增与烤机、节能、评分等相关的选项入口。
  - 硬件详情页的信息布局得到优化，展示更清晰。
  ⚡ 性能优化
  - 启动速度大幅提升：主题和字体加载改为异步执行，减少启动时的阻塞，冷启动响应更快。
  - 硬件信息预加载：启动时并行采集硬件数据，进入硬件页面即点即看，无需等待。
  - 烤机监控性能优化：采样数据自动限制数量并启用降采样，长时间烤机也不会造成界面卡顿或内存暴涨。
  - 工具图标缓存清理：启动时在后台完成过期缓存清理，避免占用额外磁盘空间的同时不影响前台操作。
  🐛 问题修复
  - 修复了与 FurMark 配合使用时可能导致的烤机异常停止问题。
  - 修复了 GitCode 平台工具下载链接解析错误，确保工具包能正常获取。
  - 修复了 GitCode 认证流程异常，解决了下载工具时可能出现的认证失败问题。
  - 修复了部分工具（文件名包含 64 或 _64）无法被自动识别为 64 位版本的问题，现在程序能够正确匹配并启动最佳架构的工具。
  - 修复了商业库授权相关错误。
  - 修复了构建和部署过程中的多个问题，改善了安装包和更新分发的稳定性。
  - 修复了性能报告因数据积累过多导致界面卡顿的问题。
  - 修复了 MSIX 打包版本无法检测工具更新的问题，现在所有版本均支持工具自动更新。
  - 修复了节能工具后台静默启动时可能弹出主窗口的问题。
  🔧 其他改进
  - 更新了 Everything 工具至 1.5.0.1418b 版本。
  - 更新了 Ventoy 工具至 1.1.17 版本。
  - 更新了 HWInfo 硬件检测工具。
  - 更新了中文本地化翻译。
  - 优化了软件自身的自动更新逻辑，在网络按流量计费时不再自动下载更新包。
  - 改进了节能工具的静默启动机制，仅通过计划任务触发时才进入后台模式。
  - 优化了工具之间的依赖关系处理。
  - 改进了 AI 助手服务的推荐准确性。
  - 删除了部分不再维护或重复的工具条目。
  - 添加了全面的单元测试，增强软件稳定性。
