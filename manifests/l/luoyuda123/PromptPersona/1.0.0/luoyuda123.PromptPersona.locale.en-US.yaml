ShortDescription: Offline desktop app that turns a 12-question interview into a reusable AI persona and system prompt.
Description: PromptPersona asks 12 fixed questions about identity, tone, taboos and output preferences, then writes a system prompt you can paste into any OpenAI-compatible chat, coding agent or local model. It saves persona.json (stable dim1-dim12 keys) and persona_system.txt locally, supports 10 UI languages including Arabic RTL, and runs with the Python standard library and Tkinter only. No account, no cloud sync, no telemetry.
