PackageIdentifier: LostPing.Sandcastle
PackageVersion: 1.3.2
PackageLocale: fr-FR
Publisher: LostPing
PackageName: Sandcastle
License: GPL-3.0-or-later
ShortDescription: Une interface conviviale pour Windows Sandbox.
Description: |-
  Sandcastle rend Windows Sandbox simple : préparez vos bacs à sable dans un éditeur au lieu d'écrire des fichiers
  .wsb à la main, puis démarrez-les d'un clic. Des programmes comme 7-Zip ou Firefox peuvent être installés
  automatiquement dans le bac à sable.
  Nécessite Windows 10/11 Professionnel, Entreprise ou Éducation avec Windows Sandbox activé.
