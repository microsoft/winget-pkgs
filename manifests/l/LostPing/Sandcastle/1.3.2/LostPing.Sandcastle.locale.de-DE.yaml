ShortDescription: Eine einfach bedienbare Oberfläche für Windows Sandbox.
Description: |-
  Sandcastle macht Windows Sandbox einfach: Sandboxen im Editor zusammenstellen statt .wsb-Dateien von Hand zu
  schreiben, und mit einem Klick starten. Auf Wunsch sind Programme wie 7-Zip oder Firefox gleich mit installiert.
