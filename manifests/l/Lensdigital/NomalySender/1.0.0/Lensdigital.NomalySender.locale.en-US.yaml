ShortDescription: Streams what this PC plays to Nomaly on the Apple Vision Pro.
Description: |-
  Nomaly Sender lives in the taskbar's corner and sends what this PC plays - everything, or one app such as Spotify
  or a browser - over the home network to Nomaly on the Apple Vision Pro, which plays it in its world. The headset
  finds the PC by itself (DNS-SD), and each new headset is asked about before it may listen.
