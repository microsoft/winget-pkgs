ShortDescription: Media center for Windows, Android and Android TV, compatible with the open addon protocol.
Description: Lumen is a media center built around its own playback engine (mpv and FFmpeg with every LGPL decoder, hardware decoding, TrueHD and Atmos support). It speaks the open addon protocol, so the addons you already use install from their manifest URL; Lumen ships no content sources of its own. Browse and search across every addon at once, keep a library and watch history, download for offline viewing, use a phone as a remote, and sync your library across devices with end-to-end encryption and no account. Available in 26 languages.
