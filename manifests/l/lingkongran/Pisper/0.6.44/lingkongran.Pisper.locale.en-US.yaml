PackageIdentifier: lingkongran.Pisper
PackageVersion: 0.6.44
PackageLocale: en-US
ShortDescription: A desktop and terminal workbench for running several AI coding agents in parallel, with sessions grouped by who needs you, who is running and who is done.
Description: Pisper organizes several AI coding agents into a workbench that runs for the long haul. Each agent has its own session, folder, model and permissions. The sidebar groups them into Needs you, Running and Recent, so you can see at a glance who is waiting for you and allow or deny risky commands in place. Desktop, terminal and phone run the same kernel, and sessions, memory and settings stay on your own devices. It supports session-tree branching and per-turn rewind, approval and permission rules, sub-agents, browser and Computer Use control, running work on another machine over SSH, and tools, plugins and MCP.
