ShortDescription: 同时运行多个 AI 编码代理的桌面与终端工作台，会话按需要你、运行中、已完成分组，手机可连接同一内核。
Description: Pisper 把多个 AI 编码代理组织成一个长期运行的工作台。每个代理有自己的会话、目录、模型和权限；侧栏按“需要你、运行中、最近”分组，谁在等你批准一眼可见，高风险命令就地允许或拒绝。桌面、终端与手机运行同一套内核，会话、记忆和配置只保存在你自己的设备上。支持会话树分支与按轮回退、审批与权限规则、子代理、浏览器与 Computer Use 操作、经 SSH 在另一台机器上运行任务，以及工具、插件和 MCP。
