ShortDescription: 用于启动本机 DeepSeek Harness（DSH），并通过系统 OpenSSH 安全连接远程 DSH 的桌面工具。
Description: DSH Tunnel 可以启动本机 DSH，也可以为远程 DSH 建立本地 SSH 隧道，并在默认浏览器中打开对应的 WebUI。支持保存和管理多个远程 DSH 主机，通过 SSH 本地端口转发安全访问远程 WebUI，可同时连接多个 DSH 并为每个连接分配独立的本地端口；连接可用后自动打开默认浏览器，并可通过 Windows 系统托盘快速操作。首次连接可在界面中核对目标设备的 SSH 主机指纹，并自动生成应用专用 SSH 密钥。
