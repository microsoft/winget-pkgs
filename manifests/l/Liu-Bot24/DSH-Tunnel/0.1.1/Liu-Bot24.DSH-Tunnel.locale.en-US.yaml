PackageIdentifier: Liu-Bot24.DSH-Tunnel
PackageVersion: 0.1.1
PackageLocale: en-US
License: Freeware
ShortDescription: A desktop utility for launching DeepSeek Harness (DSH) locally and securely connecting to remote DSH instances through the system OpenSSH client.
Description: DSH Tunnel can launch a local DSH instance, create local SSH tunnels to remote DSH instances, and open the corresponding WebUI in your default browser. Save and manage multiple remote DSH hosts, securely access remote WebUIs through SSH local port forwarding, connect to multiple DSH instances at the same time using independent local ports, open the default browser automatically when a connection is ready, and access common actions from the Windows system tray. On first connection you can verify the SSH host fingerprint of the target device in the interface, and the app generates a dedicated SSH key pair automatically.
