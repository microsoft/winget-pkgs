ReleaseNotes: "Fixed and improvements:\n• Update Apache to the latest version 2.4.69-261002-Win64-VS18\n• Update PHP 8.3 to the latest version, 8.3.36 (Critical Security Fixes)\n• Update Nginx to the latest version 1.30.6\n• Update Node.js 22 LTS to the latest version 22.23.4\n• Update Composer to the latest version 2.10.3\n\nNotes:\n• To use Laragon's bundled **PHP, Node.js, and Python** in any Terminal, code editor, or IDE, simply click  **Tools > PATH > Add Laragon to PATH**.\n\n• Smoothly upgrade from older version of Laragon to Laragon 8:\nPlease follow this guide：https://github.com/leokhoa/laragon/discussions/1059 \n\n• Smoothly update to the latest version of Laragon：Just download and run  **`LaragonUpdater.exe`**\n\nLaragon supports both versions of phpMyAdmin:\n1. **Menu > MySQL > phpMyAdmin**：phpMyAdmin 5\n7. **Menu > MySQL > phpMyAdmin6**：phpMyAdmin 6 - This version works with PHP 8.4+\n\n![image](https://github.com/user-attachments/assets/c8e00fc3-4ec5-4717-8d66-ffa5d81398c2)"
