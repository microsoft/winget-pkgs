ReleaseNotes: |-
  New features
  - A password manager can now answer a site's sign-in prompt, so the browser's own username-and-password box no longer interrupts.
  Bug fixes
  - Signing in to Google no longer stops at "this browser or app may not be secure".
  - 1Password, Bitwarden and LastPass can be installed again.
  - G.U. Wallet updates itself again.
  - A passkey sign-in no longer leaves the page spinning.
  - An extension that is switched off can be removed again.
  - Right-click menu items no longer act on the wrong window when several windows are open.
  Improvements
  - The browser engine was updated to a newer Chromium.
