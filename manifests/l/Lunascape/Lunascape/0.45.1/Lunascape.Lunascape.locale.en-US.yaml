ReleaseNotes: |-
  New features
  - Importing from another browser is now one dialog (Cmd+I): Chrome brings bookmarks, passwords and cookies; any other browser its bookmarks.
  - The password manager can fill a page from its toolbar popup, and its on-page suggestions can be picked with the keyboard.
  - The AI sidebar is a setting under Settings > Extensions, and its model list keeps up with each provider.
  Bug fixes
  - The browser no longer freezes with a core pinned at 100%.
  - Google no longer keeps asking you to sign in after an import from Chrome; duplicated cookies are repaired at the next launch.
  - Deleting site data answers as soon as cookies and storage are gone, instead of looking frozen while the cache is cleared.
  - A mailto: or tel: link set to open in a new tab no longer leaves an empty tab behind.
  - "Add to Lunascape" appears on the Chrome Web Store in every account, not only the first.
  - An extension's options page opens from its menu again.
  - Sign-in flows that open a blank tab and then send it to the provider no longer leave that tab blank.
  Improvements
  - Starting up is quicker: only what the first window needs is opened first, the rest loads behind it.
  - A new window appears within about 300 ms; it no longer waits on a font fetched from Google.
  - More Chrome extensions work unchanged: tab zoom and navigation, language detection, search, extension management and the debugger interface.
  - A crash report now reaches us on the next launch.
  - The MCP fill tool can type into rich-text editors such as ChatGPT, Claude, Gemini and Notion.
