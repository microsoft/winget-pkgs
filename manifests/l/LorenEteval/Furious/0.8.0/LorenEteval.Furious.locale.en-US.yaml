ReleaseNotes: |-
  Features
  - UI: Introduced a page-based Fluent interface with dedicated Home, Log, Subscriptions, Metrics, and Settings pages, plus System, Light, and Dark themes.
  - Subscriptions: Added dedicated management with synchronization status, profile filtering, Update Selected/All, reassignment, and multi-selection ordering.
  - Metrics: Added live and historical traffic graphs, configurable traffic accumulation, endpoint details, and an optional map.
  - External Core: Added managed profiles for trusted local executables, including arguments, environment variables, working directories, proxy endpoints, and optional Tun2socks integration.
  - TUN: Added native TUN support for Xray-core and Hysteria 2. See TUN Mode wiki
  - Protocols: Added SIP002 Shadowsocks and SOCKS URI support, alongside expanded Hysteria 2 options including Gecko, ECH, and Realm.
  - Logs: Added unified category filtering and regular-expression search.
  Fixes
  - Stability: Prevented memory leaks by using weak references so the application does not retain object references indefinitely.
  - Subscriptions: Updating a subscription now invalidates its pending and active tests, clears old results, and prevents stale results from reaching updated profiles.
  - Speed Test: Fixed multi-profile download tests starting serially or with noticeable delays; admitted tests now start concurrently.
  - Security: Prevented credential-bearing command-line arguments, subscription URLs, profile and QR data, and proxy configuration values from being written to diagnostics.
  - Linux: Fixed missing Flatpak dependencies and removed incompatible or unused Qt plugins from packaged applications.
  - Assets: Hardened Xray asset downloads so incomplete or invalid files cannot replace verified assets.
  Improvements
  - Subscription preparation now runs outside the GUI thread with bounded workers, batched persistence, coalesced notifications, and isolated per-subscription failures.
  - Connection startup is now asynchronous and cancellable, with staged readiness checks and automatic rollback.
  - Ping and TCPing use bounded background processing, endpoint deduplication, and identity-safe stale-result handling.
  - Large-volume application and core logs now use bounded storage and incremental rendering.
  - QR export is incremental, cancellable by closing the export window, and limited to the first 50 eligible profiles.
  - Theme transitions, shared Home and Settings controls, keyboard focus, table selection, and move operations were polished.
  Dependencies
  - Python 3.13.15
  - Go 1.26.7: Xray-core v26.7.28
  - Go 1.26.7: hysteria2 v2.12.2
  - Added Windows arm64 release. See Release Artifacts wiki
  Full changes
  Features
  - UI: Reworked the application into a page-based Fluent interface with dedicated Home, Log, Subscriptions, Metrics, and unified Settings pages.
  - Themes: Added selectable System, Light, and Dark appearance modes.
  - Plugins: Introduced a capability-based plugin architecture supporting contributed protocols, editors, runtimes, subscription decoders, settings, and navigation pages.
  - Plugin Management: Added an interface for discovering and configuring installed plugins.
  - External Core: Added managed profiles for trusted local executables with structured arguments, environment variables, working directories, shutdown timeouts, HTTP and SOCKS endpoints, and optional application-managed Tun2socks.
  - Subscriptions: Added a dedicated management page with synchronization status, Update Selected/All, profile filtering, profile reassignment, and multi-selection Move Up/Down actions.
  - Metrics: Added Xray-core and Hysteria 2 traffic statistics, historical graphs, configurable collection and accumulation, endpoint information, and a themed map where Qt WebEngine is available.
  - Logs: Added a unified log page with category filters, regular-expression search, highlighting, copy/save actions, and configurable automatic scrolling.
  - TUN: Added optional native TUN support for Xray-core and Hysteria 2 while retaining application-managed Tun2socks as the default.
  - Shadowsocks: Added an interoperable SIP002 URI codec with metadata, Unicode, IPv6, and round-trip support.
  - SOCKS: Added URI import support for socks, socks4, socks5, and socks5h, with Xray SOCKS runtime integration.
  - Hysteria 2: Expanded support for Gecko obfuscation, ECH, Realm links, port hopping, congestion control, and other current advanced options.
  - Server Management: Added Move to Top, Move Up, Move Down, Move to Bottom, duplication, and Move To Subscription actions with multi-selection support.
  Fixes
  - Stability: Fixed a deterministic Windows access violation during application shutdown after asynchronous connection startup.
  - Qt Lifetimes: Fixed deleted-wrapper and premature-destruction failures involving workers, windows, models, timers, bound callbacks, and packaged applications.
  - Startup: Fixed stale startup callbacks and ensured failed, cancelled, or superseded connection attempts release only their own resources.
  - Subscriptions: Fixed auto-update lifecycle handling, transaction boundaries, synchronization-state reporting, and partial batch failures.
  - Subscription Tests: Successful synchronization now clears test results for the affected subscription, removes pending jobs, cancels active speed tests, and discards stale Ping and TCPing results.
  - Profile Identity: Reordering or moving profiles now preserves valid work, while editing, deleting, or replacing profiles invalidates obsolete asynchronous results.
  - Speed Test: Fixed concurrent download tests being serialized by blocking core-readiness waits.
  - Test Workers: Fixed deleted TestDownloadSpeedWorker access when subscriptions were updated during active testing.
  - TUN: Fixed native TUN ownership, cancellation, state synchronization, and switch-animation behavior.
  - Flatpak: Correctly disables unavailable TUN functionality inside the Flatpak sandbox.
  - Flatpak Dependencies: Bundled the required double-conversion library and removed unused PDF, TIFF, WebP, and incompatible EGLFS plugins that introduced unresolved dependencies.
  - Nuitka: Fixed missing protocol-editor imports and tightened packaged runtime data.
  - Security: Removed credential-bearing command-line arguments, subscription URLs, share links, imported QR contents, PAC/configuration values, environments, and core documents from diagnostics.
  - Xray Assets: Added validation and digest checks before replacing existing GeoIP and GeoSite files.
  - Editors: Preserved unknown or newer protocol values during editing and fixed Hysteria 2 Realm server display.
  - Windows: Bounded System Proxy and runtime shutdown operations to avoid indefinite exit waits.
  - Geometry: Hardened main-window geometry restoration, including the macOS default-size fallback.
  - Exit Handling: Added confirmation when exiting without an available system tray.
  - UI State: Preserved focus, current item, selection, and active-profile identity across sorting and multi-row move operations.
  Improvements
  - Architecture: Reorganized shared responsibilities around controllers, repositories, services, plugin capabilities, and stable domain identities.
  - Connection Startup: Replaced nested event-loop waiting with a cancellable staged Qt transaction covering core startup, endpoints, DNS, TUN readiness, and runtime survival.
  - Subscription Performance: Moved large payload decoding, parsing, normalization, and validation off the GUI thread.
  - Subscription Batching: Added bounded preparation workers, batched persistence, coalesced notifications, stale-result rejection, and per-subscription failure isolation.
  - Server Testing: Added bounded Ping concurrency and a dedicated Qt networking thread for TCPing with adaptive concurrency and endpoint deduplication.
  - Dual Stack: Improved TCP probing across IPv4 and IPv6 endpoints.
  - Download Testing: Added concurrent scheduling with identity-safe cancellation while retaining the single-threaded API for programmatic callers.
  - Log Performance: Added generation-based bounded storage, incremental delivery, lazy rendering, progressive highlighting, viewport preservation, and reliable tail following.
  - Core Output: Improved high-volume output draining while keeping shutdown bounded.
  - QR Export: Added incremental bulk generation, stable profile snapshots, isolated failures, close-to-cancel behavior, and a 50-profile safety limit.
  - Theme Switching: Added a smooth 500 ms cross-fade with a reduced-animation path.
  - Shared Controls: Synchronized connection, System Proxy, routing, and TUN state across Home and Settings.
  - Accessibility: Improved widget-scoped shortcuts, keyboard navigation, focus retention, and complete switch-track interaction.
  - Packaging: Expanded native release coverage across Linux x86-64 and arm64, macOS Intel and Apple silicon, Windows 7 amd64, Windows 10 amd64, and Windows 10 arm64.
  - Release Validation: Added architecture checks and installation-time dependency verification inside finished Flatpak bundles before publication.
  - Compatibility: Pinned compatible native build dependencies, including Go 1.26.7 for Windows 7 builds and zxing-cpp below version 3.
  - Testing: Expanded unit, Qt interaction, lifecycle, stress, very-heavy, packaging, and benchmark coverage.
  - CI: Updated actions/setup-go and actions/setup-python to v7 by @dependabot in #162 and #163.
  - Documentation: Refreshed project guidance and fixed the README star-history chart by @OctoBored in #164.
