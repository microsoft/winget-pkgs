ShortDescription: 'Benchmark gratuito per PC: processore, memoria, SSD, IA locale e scheda grafica in unità reali, in 3D dal vivo, con classifica online.'
Description: |-
  lightBench misura il processore (un core e tutti i core), la memoria e le cache, l’SSD, l’IA locale
  (token al secondo di un piccolo modello con architettura Llama sul processore) e la scheda grafica (WebGPU)
  in unità reali, mostra ogni test dal vivo in 3D e confronta il risultato con altri sistemi su lightbench.ch.
  Un test standard dura circa 11 minuti. Non serve un account; il caricamento è facoltativo e viene chiesto
  prima del test. Senza desktop l’intero test funziona anche nel terminale: lightbench --cli
