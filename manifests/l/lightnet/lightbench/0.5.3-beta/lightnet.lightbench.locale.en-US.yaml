ShortDescription: 'Free PC benchmark: CPU, RAM, SSD, local AI and graphics card in real units, live in 3D, with an online leaderboard.'
Description: |-
  lightBench measures the processor (single and multi-core), memory and caches, the SSD, local AI
  (tokens per second of a small Llama-architecture model on the CPU) and the graphics card (WebGPU) in real
  units, shows every test live in 3D and compares the result with other systems on lightbench.ch.
  A standard run takes about 11 minutes. No account is needed; uploading a result is optional and asked
  before the run. Without a desktop the whole test also runs in the terminal: lightbench --cli
