ShortDescription: 'Benchmark PC gratuit : processeur, mémoire, SSD, IA locale et carte graphique en unités réelles, en 3D en direct, avec classement en ligne.'
Description: |-
  lightBench mesure le processeur (un cœur et tous les cœurs), la mémoire et les caches, le SSD, l’IA locale
  (jetons par seconde d’un petit modèle à architecture Llama sur le processeur) et la carte graphique (WebGPU)
  en unités réelles, affiche chaque test en direct en 3D et compare le résultat avec d’autres systèmes sur lightbench.ch.
  Un test standard dure environ 11 minutes. Aucun compte n’est nécessaire ; l’envoi du résultat est facultatif
  et demandé avant le test. Sans bureau, tout le test fonctionne aussi dans le terminal : lightbench --cli
