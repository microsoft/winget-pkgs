ShortDescription: 'Kostenloser PC-Benchmark: Prozessor, Arbeitsspeicher, SSD, lokale KI und Grafikkarte in echten Einheiten, live in 3D, mit Online-Rangliste.'
Description: |-
  lightBench misst Prozessor (ein Kern und alle Kerne), Arbeitsspeicher und Caches, SSD, lokale KI
  (Token pro Sekunde eines kleinen Modells mit Llama-Architektur auf dem Prozessor) und Grafikkarte (WebGPU)
  in echten Einheiten, zeigt jeden Test live in 3D und vergleicht das Ergebnis auf lightbench.ch mit anderen Systemen.
  Ein Standard-Lauf dauert rund 11 Minuten. Ein Konto ist nicht nötig; das Hochladen ist freiwillig und wird
  vor dem Lauf abgefragt. Ohne Desktop läuft der ganze Test auch im Terminal: lightbench --cli
