ShortDescription: Find any photo, screenshot or PDF on your Windows PC by what's in it. Private and local.
Description: |-
  LinkLore keeps what you capture (pages, photos, PDFs, receipts, songs, videos) as chains in an encrypted vault on your own PC,
  and finds any of it by meaning or by the words inside pictures and PDFs, including your Documents, Desktop, Downloads and
  Pictures folders. Rest your mouse on a result to see it full size without opening it. Local by default: nothing you capture
  leaves unless you send it. Free core with no account.
