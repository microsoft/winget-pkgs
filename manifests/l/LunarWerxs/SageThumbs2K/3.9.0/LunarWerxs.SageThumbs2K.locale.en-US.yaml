  <details>
  <summary><b>Read more: everything in 3.9.0</b></summary>
  
  - **Screenshots save in HDR: PNG HDR and JPEG XR HDR.** Settings Γû╕ Screenshot files Γû╕ Save screenshots as now offers two HDR formats that keep an HDR monitor's full brightness and colour instead of the 8-bit picture: PNG HDR (16-bit, BT.2020 colours and the PQ curve, tagged as the new PNG standard describes) and JPEG XR HDR (the format Windows' Game Bar saves HDR screenshots in). Arrows, text and other marks keep the look they had in the editor. A capture from an ordinary screen saves in these formats too. Thanks to spider623 for the idea (#67).
  - **Each divider in the right-click menu can be switched off.** Settings Γû╕ Right-click menu Γû╕ Edit menu items now has a tick box next to every divider line, as it has next to every item. Clear one and the menu draws no line there; the row keeps its place in the list, so it can be ticked again later. Thanks to justdeek on Discord for the idea.
  - **Pick the checkerboard's colours.** Settings Γû╕ Appearance Γû╕ Checkerboard colours sets the two colours of the checkerboard behind see-through pictures: Automatic (the light squares, as before), Dark, so a white logo or icon stands out, or CustomΓÇª, which opens the Windows colour picker for each colour. The same colours draw the checkerboard in thumbnails, the right-click preview and Quick preview. Thanks to Geijoh for the idea (#69).
  - **Done in Edit menu items applies the menu straight away.** Done (or closing the window) saves the list and the next right-click shows it. It used to only close the window, and the change waited for Settings' own Save. Thanks to justdeek on Discord.
  - **Quick actions on the main menu leave the SageThumbs 2K submenu.** With "Show quick actions in the menu" on, Convert, Resize and Rotate now sit on the main right-click menu only, on both the Windows 11 menu and the classic one, instead of being listed a second time inside the SageThumbs 2K submenu. Thanks to justdeek on Discord for the idea.
  - **Dragging rows in Edit menu items moves them.** Dragging an item or a divider in the list did nothing at all: the list sends its drag to the Settings window it was made in, and Settings only listened while the list was still its own child, which it stops being once the editor opens. Rows now move where they are dropped. Thanks to justdeek on Discord.
  - **The custom action's switch shows whether its hotkey is on, and turns it off.** Settings Γû╕ Quick action opened with "Enable custom action" off even while a hotkey was bound, with the action and hotkey still live under it, so the hotkey kept running the action. The switch now opens on when a hotkey is bound; switching it off greys both out and Save unbinds the hotkey, so it stops firing. Thanks to justdeek on Discord.
  - **Space and Check selected reach every selected file type.** In Settings Γû╕ File types, Space over several selected rows, and the right-click Check selected, Uncheck selected and Toggle selected, changed only the first few dozen formats and skipped the rest.
  - **HDR screenshots keep the screen's real brightness.** On an HDR monitor, a screenshot came out too bright: windows and the desktop were blown out to white and mid-tones looked faded, because the capture ignored Windows' "SDR content brightness" setting. It now reads that setting for each monitor, so ordinary windows come out exactly as they look, and only what is brighter than them (HDR video, games) is rolled off toward the monitor's peak, keeping its colour instead of turning white (#67).
  - **JPEG 2000 files with a far-off tile grid show their picture.** A JPEG 2000 file may place its picture and tile grid billions of pixels from the origin. SageThumbs read such a file's tile edges wrongly and drew it black. It now draws the same picture as the file without the offset.
  - **Illustrator files with several artboards show each artboard whole.** The thumbnail of a file with up to four artboards cut each artboard to fill its square and pushed them together, so the artboards blended into one confusing picture and a mark in the middle of one could stretch into a band. Each artboard is now drawn whole in its own cell, with a thin outline round it, so the thumbnail reads as separate pages.
  - **The format badge and checkerboard show on every file type.** With the format badge or the transparency checkerboard on, some types still showed Windows' plain thumbnail with neither (PNG on some PCs, JPEG on others), because the file type's own entry named Windows' built-in thumbnailer and Windows asks that entry first. While the badge or checkerboard is on, SageThumbs now takes that entry over for your account only, and gives it back when you turn both off or uninstall, and pictures Explorer had already cached without the badge are redrawn (at your next sign-in, or straight away from the refresh offer after an update). Opening Settings checks again, so a default program you pick later is covered too. `st2k doctor` says when a type is still drawn by Windows and how to fix it (fixes #66).
  - **The format badge shows on long extensions, tiny pictures and cloud files.** Measured over every format SageThumbs reads, three kinds of file still went without the badge. A file whose extension is longer than five letters got none: it now gets a short label (`.aseprite` reads ASE, `.blend12` BLEND, `.sldprt` SLDPR). A picture too small or too thin for the badge (a 32 by 16 PPM, a tiny PSD, a narrow strip) got none: it now sits in the middle of its tile with the badge in the tile's corner. And in OneDrive and other sync folders, a file kept only online showed the cloud's thumbnail without the badge: the badge now goes on that too.
  - **A format badge picked during setup shows on thumbnails.** Choosing "A SageThumbs format mark" on setup's Thumbnail corner page turned off Windows' own type icon but drew no badge, so every thumbnail had an empty corner until the setting was changed in Settings. Thumbnails now follow the choice made in setup.
  - **Explorer comes back after Rebuild thumbnail cache and Repair file associations.** Now and then the taskbar and desktop disappeared and stayed gone: Explorer had only half closed, so it was never started again. SageThumbs now gives Explorer a few seconds, finishes closing it only once its taskbar is gone, and starts it again (fixes #68).
  - **The desktop no longer flashes during setup.** Setup and the welcome screen could both restart Explorer at the same moment, so the screen flashed between black and an empty desktop. A restart now waits for one already running to finish.
  - **`st2k doctor` no longer flags .ico files by mistake.** It reported a failure for .ico files because of a leftover Windows entry that points at nothing and that Explorer ignores.
  
  </details>
  
