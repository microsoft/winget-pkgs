  ## TL;DR
  
  **≡ƒ⌐╣ Fixed**
  
  - **MPEG-2 videos whose slices start mid-row get thumbnails**
  - **Updating no longer stops on "Unable to execute file ... CreateProcess failed; code 32"**
  
  <details>
  <summary><b>Read more: everything in 5.0.1</b></summary>
  
  - **MPEG-2 videos whose slices start mid-row get thumbnails.** The MPEG decoder now reads slices that start partway through a row of macroblocks (H.262 section 6.3.17.1), as conformance streams and some encoders write them. Such a video used to keep its stock icon.
  - **Updating no longer stops on "Unable to execute file ... CreateProcess failed; code 32".** Setup runs the app it has just copied to set up the classic context menu and the other per-user steps. When another program, usually an antivirus scanning the new file, still had it open, Windows refused to start it and setup showed that error at "Setting up the classic context menu...". Setup now waits, for up to 30 seconds and with a status line saying what it waits for, until the file is free, then carries on.
  
  </details>
  
