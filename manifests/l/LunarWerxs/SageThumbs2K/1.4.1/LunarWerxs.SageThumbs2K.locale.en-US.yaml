ReleaseNotes: |-
  What's changed
  This one rolls up 1.4.0 and 1.4.1.
  New
  - Read the text off your screen. The screenshot editor has a Copy text (OCR) button
    (Ctrl+T): drag a region and the words land on your clipboard and in a small editable
    window. Bind Settings ▸ Screenshots ▸ Custom action ▸ Copy text on screen (OCR) to a hotkey
    for a one-key version with no editor at all. Small on-screen type reads cleanly now.
  - Copy text (OCR) in Quick preview too. Press Space on a file and click it. Works on every
    format SageThumbs opens, not just the ones Windows understands, including Photoshop files,
    camera RAW and scans. On a multi-page PDF it reads the page you're looking at.
  - Send feedback without leaving the app. A Send feedback button in the About box sends a
    suggestion, bug report or format request straight to the developer, no GitHub account needed.
    An email address is optional; leave it out and the message still arrives.
  Fixed
  - Huge OpenEXR files now get thumbnails. A 12K VFX frame with PIZ compression used to show
    nothing at all: too big to load, so no thumbnail, no preview, no Quick preview. EXRs are now
    read straight off the file and shrunk as they're read, so size stops mattering. A 445 MB
    12288×6480 frame that produced nothing before thumbnails in a few seconds, and ordinary EXRs
    got about 6× faster on a 12K file with a fraction of the memory.
  - Widening the Quick preview window re-wraps the text. Rendered documents sat in a
    fixed-width column, so dragging the window wider only added empty space at the sides. The text
    column follows the window now.
  - Chinese, Japanese and Korean text files are readable again. Quick preview assumed UTF-8, so
    GBK/GB18030, Shift-JIS, Big5 and EUC-KR files came up as a wall of replacement characters. The
    encoding is worked out now, including UTF-16 without a byte-order mark.
  - Chinese, Japanese and Thai text wraps instead of running off the edge. Those languages
    don't put spaces between words, so a paragraph was treated as one enormous word and got cut
    off. It wraps to the panel now, and follows the usual typesetting rules: a full stop won't be
    pushed to the start of a line, an opening bracket won't be stranded at the end of one.
