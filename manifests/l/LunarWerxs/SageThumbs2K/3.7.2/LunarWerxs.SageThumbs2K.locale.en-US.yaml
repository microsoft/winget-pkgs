  ## TL;DR
  
  **≡ƒåò New**
  
  - **Quick preview has a taskbar button**
  
  **≡ƒ⌐╣ Fixed**
  
  - **Comic thumbnails no longer pick the back cover or a variant cover**
  
  <details>
  <summary><b>Read more: everything in 3.7.2</b></summary>
  
  - **Quick preview has a taskbar button.** The Space-bar preview now shows on the taskbar and in Alt+Tab, so a preview that ends up behind another window, a playing video included, can be brought back with one click. Pressing Space in Explorer while the preview is hidden behind it, or minimized, brings the preview back instead of closing it unseen.
  - **Comic covers: the back cover and variant covers no longer win.** With "Prefer a cover image" on (the default), a CBZ, CBR or CB7 whose pages included a back cover, a variant cover, a covers gallery or even a page named "Discovery" could show that page as its thumbnail, because any name containing "cover" won. Only a page named as the front cover leads now, and other covers go to the back, so the setting no longer has to be turned off for those books (which lost the cover on books whose cover is named `cover.jpg`).
  
  </details>
  
