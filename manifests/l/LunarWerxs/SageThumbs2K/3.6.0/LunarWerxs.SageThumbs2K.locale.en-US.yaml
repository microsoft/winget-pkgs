  ## TL;DR
  
  - **Photoshop thumbnails no longer fill your temp folder**, and what older versions left there is cleaned up (fixes #56)
  - **Big Photoshop files get their thumbnails** (fixes #55)
  - **PDFs with a few bytes before their header get thumbnails** (fixes #59)
  - **You choose what double-clicking the tray icon does** (fixes #58)
  - **Press Space to preview works straight after installing**
  - **The Quick preview's Upload button asks first**, and is off until you allow it
  
  <details>
  <summary><b>Read more: everything in 3.6.0</b></summary>
  
  - **Photoshop thumbnails no longer fill your temp folder** (fixes #56). Every PSD thumbnail could leave a copy of the file in `%TEMP%`, sometimes with hundreds of MB more beside it; one user's reached 100 GB. Each ImageMagick run now gets its own temp folder, deleted the moment the run ends. The files earlier versions left behind (ImageMagick's `magick-...` files over an hour old that nothing has open) are cleaned up after you install this version, and again whenever a thumbnail next needs ImageMagick.
  - **Big Photoshop files get their thumbnails** (fixes #55). A thumbnail asked for the whole document at full size, so a large layered file could run out of time and show nothing, while Space, which allows longer, previewed it fine. A thumbnail now reads the picture at the size it shows.
  - **PDFs with a few bytes before their header get thumbnails** (fixes #59). Some systems put bytes in front of a PDF's `%PDF-` header; every PDF reader opens such a file, Windows' own included, but SageThumbs looked for the header only at the very first byte.
  - **You choose what double-clicking the tray icon does** (fixes #58): Settings > Advanced > **Double-click tray icon** takes a screenshot (still the default), opens Settings, or does nothing.
  - **Send feedback asks you to promise you are not being a jerk.** Send stays greyed out until you tick the box. The email field is labelled just "Email (optional)" now.
  - **Press Space to preview now works straight after installing.** Quick preview used to start off, so most people never found it. A new install turns it on, unless another Space-bar previewer (QuickLook or Seer) is already there, since two would fight over every press of Space. The welcome window still lets you switch it off, and an upgrade keeps your setting.
  - **The Quick preview's Upload button no longer uploads on one click.** It is off until you turn on **Allow uploading from the preview** (Settings Γû╕ Quick preview); until then a click says why nothing happened and offers to open that page. Once it is on, it names the file and asks before every upload, with Cancel as the default answer.
  - **With "Close when the preview loses focus" on, the preview's own dialogs no longer close it.** Saving a page, printing, or answering the Upload question used to count as clicking away, which closed the window and its dialog together.
  - **The buttons on the "Keep these settings everywhere" banner have clean corners.** Each one showed a notch of the page colour at its corners against the banner's tint.
  - **Settings text that was cut off in other languages now fits.** The screenshot hotkey's "Stopped" status on the Screenshots page was cut short in 12 languages, and a label too long for a 220-pixel box dropped onto its own line even with room to spare beside its field.
  - **One more damaged JPEG XL file that could crash the thumbnail host no longer does.** A `.jxl` whose progressive passes leave part of the picture for no pass to decode stopped the JPEG XL decoder dead; it is now an ordinary decode error, so the file shows the normal icon and the files around it keep their thumbnails.
  - **The Theme setting moved to Settings > Appearance**, under "SageThumbs windows". It was on the Quick preview page, which had grown past the bottom of the window.
  
  </details>
  
