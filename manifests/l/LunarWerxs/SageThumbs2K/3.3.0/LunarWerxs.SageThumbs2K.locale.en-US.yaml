  ## What's changed
  
  - **Twelve more file types get thumbnails (361 in all):** Valve game textures (`.vtf`) and Khronos KTX textures (`.ktx`), animated cursors (`.ani`), SIXEL terminal graphics (`.six`/`.sixel`), AVIF image sequences (`.avifs`), the preview AutoCAD and BricsCAD save inside a `.dxf`, XMind mind maps (`.xmind`), Visio templates and stencils (`.vstx`/`.vssx`), and the icon inside NuGet (`.nupkg`) and Visual Studio / VS Code (`.vsix`) packages. A DXF, stencil or package that carries no picture keeps its usual icon.
  - **Big Photoshop files get a sharp picture everywhere.** A `.psd` or `.psb` over about 256 MB showed the small, blurry preview Photoshop saves inside it, in Explorer, the preview pane and Quick preview alike. SageThumbs now reads the full picture straight off the disk, only the parts it needs, so a document of any size is sharp; one saved with "Maximize compatibility" off is drawn from its layers. Reported in #46.
  - **Very big files of many other types get their picture too.** Past about 256 MB, PDF and Illustrator files, EPS, older Word, Excel, PowerPoint, Visio and Publisher files, 3ds Max and SolidWorks files, RAR and 7-Zip archives and comics, 3D models (STL, OBJ, PLY), FITS images, JPEG 2000, and huge TIFF (BigTIFF included), PPM, PGM and TGA scans showed the plain icon, an empty preview pane or nothing in Quick preview. They are now read straight off the disk, only as far as the picture needs.
  - **Windows Media Audio (`.wma`) files show their album cover in Explorer and the preview pane.** They share their container with Windows Media video and were taken for a video with no picture, so the cover never showed there, at any size.
  - **FITS astronomy images show their stars.** SageThumbs reads them itself now, with the contrast stretch astronomy software uses, instead of drawing most of them nearly black, and a file that keeps its picture in a later section shows it too.
  - **TIFF files with a colour profile keep their colours** when Windows' own decoder reads them, which it does for every TIFF past 256 MB; they came out slightly off.
  - **Bundled ImageMagick updated to 7.1.2-31**, picking up fixes for the security issues published since 7.1.2-29, among them heap over-writes that crashed it on crafted files and several ways around its safety policy. It only ever runs as a separate, time-limited process.
  - **Large DjVu pages need less memory** to thumbnail, from the updated DjVu decoder.
  - **Smaller fixes:** an e-book whose cover image carries a lazy-loading placeholder shows the real cover; JPEGs with padding bytes before their camera data get their embedded thumbnail again; an empty `.ts` file opens as text in Quick preview instead of as a broken video; Redo with nothing to redo no longer stops Undo from bringing back a deleted annotation; and a file picked in Everything with a very long path is used whole instead of cut short.
  - **Uploaded links now say when they expire.** Each free host deletes files on its own schedule, from 3 hours (uguu.se) to 3-100 days (x0.at), and a link never said which. The upload window now shows each link's expiry, and a new **Recent uploads** list (upload window, Settings > Screenshots, or the tray menu) keeps every link with the time it has left. `st2k upload` prints the expiry too, and `st2k upload-history` lists every link. Suggested by a user.
  - **Closing the "Check for problems" window no longer closes Settings with it**, along with any change you had not saved yet.
  - **3D scans in PLY format thumbnail correctly.** Binary PLY files that store a colour or a normal beside each point, which is what most 3D scanners and photogrammetry tools write, drew as a jumble of triangles; they now draw as the model. A binary PLY with a face of more than 64 corners (a cylinder's cap saved as one polygon) no longer loses every face after it.
  - **Damaged or deliberately malformed files can no longer crash or stall the thumbnail process.** A handful of crafted JPEG XL, 7-Zip, RAR, TIFF, Photoshop, STL and TGA files could make it run out of memory or keep it busy for minutes; each is now refused or cut off, and a normal file draws exactly as before.
  - **Screenshot editor: Delete, then Undo, brings the shape back.** Undo after deleting an annotation used to remove a second, different annotation instead. The toolbar's Undo and Ctrl+Z now do exactly the same thing, and the editor stays open if handing the capture to Upload or text recognition fails, so the annotated capture is not lost.
  - **Shortcuts imported from another PC, or brought in by settings sync, survive Save.** A shortcut that is not in the built-in list was replaced by the first one in the list the next time you pressed Save.
  - **Quick preview fixes.** An email whose HTML contains a `<header>` no longer loses everything after it. An HTML file with `%` in its name opens that file. A folder with a huge number of files no longer stalls its info card. A precision touchpad zooms an image one step per notch instead of racing through the zoom levels. Find no longer keeps the previous file's results when you type while the next file loads. A database table that is both long and wide now says both. A very tall PDF page no longer asks for a gigantic picture.
  - **DDS textures whose sides are not powers of two** now take their smaller mip levels from the right place in the file.
  - **JPEG 2000 images that do not start at the corner of their canvas** (an image offset, which some scanners and mapping tools write) drew as noise; they now draw the picture.
  - **The preview pane shows Dr Halo (`.cut`), MacPaint (`.mac`), Wavefront (`.rla`), ZX Spectrum (`.scr`), Scitex CT (`.sct`) and PlayStation (`.tim`) images.** Their thumbnails worked, but the pane stayed empty: these formats carry nothing to recognise them by, and only the thumbnail told the decoder which format it was reading.
  - **A video recording that is still being written, or was preallocated on disk,** gets its thumbnail: a transport stream (`.ts`, `.m2ts`, `.mts`) with empty space after its last frame used to get none.
  - **Older Excel workbooks (`.xls`) show their preview in the preview pane** instead of an empty pane, and no longer come up empty now and then in Quick preview on a busy PC. **HEIF and AVIF image sequences** read only their first picture for a thumbnail instead of every frame, which took long enough to leave the preview pane blank.
  - **Closing Settings while a sync upload is finishing** hides the window at once instead of leaving it frozen for a few seconds, and the welcome window's "Get started" no longer freezes while Explorer restarts to show file-type badges.
  - **Uninstalling also removes the log and the update-check file** from your own profile, and no longer leaves a re-register entry behind when it runs before a pending restart.
  - For the few installations on a business licence: the reminder before the evaluation ends shows again (it opened Quick preview instead).
  
