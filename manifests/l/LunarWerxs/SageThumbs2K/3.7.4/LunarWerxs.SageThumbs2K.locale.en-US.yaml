  ## TL;DR
  
  **≡ƒ⌐╣ Fixed**
  
  - **No "PNG" mark on Store apps' icons**
  - **A crafted zstd archive can't exhaust memory**
  - **Right-click Upload asks first**
  - **Online-only cloud files are never downloaded for a thumbnail**
  
  <details>
  <summary><b>Read more: everything in 3.7.4</b></summary>
  
  - **No "PNG" mark on Store apps' icons.** With the corner set to the SageThumbs format mark, a file with no picture of its own showed its program's icon stamped "PNG" when that program came from the Microsoft Store: text and `.ini` files opened by Notepad, `.7z` archives opened by NanaZip, songs without cover art opened by Media Player. Windows draws those icons from a PNG inside the app, and SageThumbs marked that picture as if it were your file. Those icons now stay unmarked. Use Settings, Rebuild thumbnail cache once after updating to clear marks Windows already saved.
  
  - **A crafted zstd archive can't exhaust memory.** A tiny zstd-compressed entry inside an archive could make the built-in zstd decoder ask for several gigabytes at once (RUSTSEC-2026-0344). The decoder is now 0.9.1, which caps each block's output, so such a file fails cleanly instead.
  
  - **Right-click Upload asks first.** "Upload (copy link)" puts your files on a free public website, and it sits just under the Copy items, so one misread click shared a file. It now names the file (or says how many) and asks, with Cancel as the default, the way the Quick preview's Upload button already does. The extra hotkey set to Upload asks the same way; `st2k upload` on the command line does not.
  
  - **Online-only cloud files are never downloaded for a thumbnail.** In a OneDrive, Synology Drive or other sync folder, a file marked to download when opened could be read, and so pulled down, just to draw its thumbnail. It is now left to the cloud app like every other online-only file.
  
  - **Licence page in the installer.** It now says who needs a work licence (charities, schools and government offices stay free) and names one buy link. The app's Buy, Renew and move-licence links open the same public go.lunarwerx.com address the site uses.
  
  </details>
  
