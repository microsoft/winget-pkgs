  ## TL;DR
  
  **≡ƒ⌐╣ Fixed**
  
  - **Update notices no longer pop up and disappear a second later**
  
  <details>
  <summary><b>Read more: everything in 5.2.2</b></summary>
  
  - **Update notices stay on screen.** When Windows held a SageThumbs notice back (another notification on screen, Do not disturb, or the burst right after you sign in), the notice was taken down on a timer that had started before it appeared, so it could vanish a second after showing. Each notice now gets its full time from the moment Windows shows it. The screenshot helper's notices (update available, licence reminder, the warning about a program running as administrator) also no longer replace each other: they now show one after another. And the update check no longer runs in two or three places at once when you sign in, so you get one "update available" notice, not several.
  
  </details>
  
