  ## TL;DR
  
  - **The right-click menu is in groups again, most-used first**
  - **The screenshot editor can blur and crop**
  - **Screenshots save as PNG, JPEG or WebP, under a name you choose**
  - **The right-click preview fits its box on a scaled display** (fixes #61)
  - **Updating from inside the app installs, even while other programs use SageThumbs files** (fixes #60)
  - **Big scanned-book PDFs get their covers** (fixes #59)
  - **Photoshop files saved without a preview image get thumbnails** (fixes #55)
  - **CMYK Photoshop files and CMYK JPEGs show their true colours**
  
  <details>
  <summary><b>Read more: everything in 3.7.0</b></summary>
  
  - **The right-click menu is in groups again, most-used first.** Since 2.0.0 the SageThumbs submenu had lost every divider and read as one long list. Its groups show again, in a new order:
    - Convert, Resize and Rotate.
    - Making a picture smaller to send.
    - Copying and sharing.
    - Combining files.
    - Organizing them.
    - Looking at a picture.
    - Setting it as a wallpaper, lock screen or folder icon.
    - **If you never rearranged the menu, you get the new order**, even if you pressed OK in Settings before. Older versions saved the order on every OK, so it never changed again and each new entry landed at the bottom. If you did rearrange it, your order stays, and new entries join their own group.
    - **Compress to size** and **Save frame as image** can now be hidden and moved in Settings > Right-click menu > Edit menu items, like every other entry.
    - **Save frame as image** shows only when the selection holds a video.
  - **The screenshot editor can blur and crop.**
    - **Blur** (`G`, beside Pixelate) softens a region. Its strength is a setting (Settings > Screenshots > *Blur strength*, 2 to 40 px, 12 by default). To hide text, Pixelate is still the safe choice, and the tooltip says so: a light blur can leave words readable.
    - **Crop** (`X`) keeps the part you drag: the rest is shaded, Enter crops, Esc cancels, and Ctrl+Z brings the rest back. Copy, Save, Upload and Copy text (OCR) all use the cropped picture.
  - **Screenshots save as PNG, JPEG or WebP, under a name you choose.** A new Settings page, **Screenshot files**, holds everything about the saved file: the format, its quality, the name, and the Ctrl+S folder (moved there from Screenshots). *Save screenshots as* picks the format: PNG stays the default, JPEG has its own quality setting and lays a transparent picture on white, and WebP keeps every pixel. *Screenshot file name* takes a template: `{yyyy}` `{MM}` `{dd}` `{HH}` `{mm}` `{ss}` `{ms}` for the capture's date and time, `{app}` for the program that was in front (or `Desktop`), and `/` or `\` for subfolders, which are created when needed. The default gives the same names as before. Characters Windows does not allow in a file name are left out, and a name Windows reserves (`CON`, `NUL`, ΓÇª) gets a `_` in front. The editor's Save, Ctrl+S and the quick-save hotkey all follow both settings; Copy still puts a plain picture on the clipboard.
  - **The right-click preview is drawn once on a scaled display** (fixes #61). At a display scale above 100%, Windows drew the preview tile a second time over the first, so its captions overlapped or were cut off and the size read "3 KB KB". SageThumbs now draws the tile itself, sized for the display's scale. As on PCs with a menu skin, the menu that holds the preview then uses the light classic style; Settings > Right-click menu > *Menu preview* can turn the preview off.
  - **Copy text (OCR) reads a slashed zero as 0.** Windows' text recognizer reads the slashed zero some fonts draw as `├╕` or `├ÿ`. Inside a word that also has a digit in it (`1├╕24`, `ID-4├ÿ7`), it now comes out as `0`; a word with no digit (`S├╕ren`) keeps its letter.
  - **Updating from inside the app installs, even while other programs are using SageThumbs files** (fixes #60). If any program SageThumbs could not close (an antivirus, a service, a program in another Windows session) had one of its files open, the update gave up without a word: the setup window appeared, vanished, and you were still on the old version. Setup now moves files that are in use aside instead of closing anything, finishes any it cannot move on the next restart, and never closes your programs. If an update ever does fail, the next time you open Settings it tells you, with setup's own reason and its log, and offers the download page.
  - **Updating from inside the app, fixed in more places:**
    - When an update leaves a file for the next restart (because a program was using it), updating again before that restart now tells you to restart Windows first. It used to start setup, which stopped on a "previous installation was not completed" message, out of sight of a silent update, and never finished. Removing SageThumbs before that restart no longer lets the restart put the file back.
    - On a PC once set up for business use and later for personal use, an update could stop to ask "Continue with Personal use?", and an unattended install (winget, an administrator's silent deployment) waited on that question for ever. Setup now asks it only when you run setup yourself.
    - The notice after an update says when a restart is still needed to finish it, instead of only "you're now on" the new version.
    - Cancelling setup while it copied files could leave SageThumbs without its ImageMagick engine. Setup no longer offers Cancel once it has started copying.
    - The "update available" notification opens Settings where you install it (the portable copy: the download page). Clicking it used to do nothing.
    - The download no longer gives up after eight minutes on a slow connection.
    - When GitHub is limiting requests from your network, the updater says so and to try again later, instead of reporting that there is no installer for your PC.
    - A standard Windows account that cannot approve the administrator prompt is told that an administrator has to install the update. It used to be told nothing.
    - A PC whose clock was once set ahead no longer stops checking for updates until that date comes round.
    - The portable copy no longer offers to install an update it cannot install, and no longer leaves a scheduled update check on the PC it ran on.
    - Closing Settings during an update download no longer stops the update without a word.
    - The updater's messages, its progress window and its notices are in your language.
  - **Big scanned-book PDFs get their covers** (fixes #59). A PDF over 256 MB with more than about 190 pages, each page its own scan (most scanned books), never got a thumbnail: Windows' PDF engine looks at every page when it opens a document, and SageThumbs ran out of its read allowance before the engine had seen them all. The same books now draw their first page, reading less than a tenth as much of the file to do it. `st2k doctor` on a file this big now checks it the way Explorer reads it, instead of reporting it unreadable.
  - **Photoshop files saved without a preview image get thumbnails** (fixes #55). A PSD written by another program, or by Photoshop with image previews turned off, was handed whole to ImageMagick, which decoded every layer and ran out of time on a big layered file, while Space showed it fine. SageThumbs now draws these with its own Photoshop reader, as Space does, and asks ImageMagick only for the finished picture when it has to: a 24 MB layered test file went from no thumbnail to one in a fraction of a second. The `._` files a Mac leaves beside your pictures are no longer logged as errors.
  - **The Quick preview's Upload button asks its question instead of closing the preview.** In 3.6.0 a click showed a busy cursor for a few seconds and then the preview window was gone, with uploading switched off or on: the question it opens crashed before it could appear. It now says uploading is off and offers the setting, or, once you have turned it on, asks before uploading. The same fault closed the About window when it offered to renew an update licence; that offer now appears too.
  - **3D models in OBJ files of more than a few thousand points get thumbnails.** Blender, Maya, MeshLab and ZBrush write every point of a model before its first face, and SageThumbs only recognised an OBJ file when a face appeared in its first 64 KB, so nearly every real model stayed a blank icon. It now recognises a file whose opening is OBJ through and through.
