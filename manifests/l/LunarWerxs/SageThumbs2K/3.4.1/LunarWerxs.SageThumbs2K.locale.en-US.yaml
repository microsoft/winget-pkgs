  ## TL;DR
  
  - **AVIF thumbnails can no longer freeze Explorer** or your taskbar icons, and no longer need a Store extension
  - **Double-click the Quick preview to go full screen**
  - **No more cut-off buttons or labels**, in any language or display scaling (fixes #48)
  - **EXR and HDR pictures show at their true brightness** instead of looking dim
  - **Olympus and Panasonic portrait photos show upright**
  - **A damaged JPEG XL file can no longer crash the thumbnail host**
  
  <details>
  <summary><b>Read more: everything in 3.4.1</b></summary>
  
  - **AVIF thumbnails can no longer freeze Explorer.** Asking for several AVIF thumbnails at once (opening a folder of them, or scrolling quickly) could hang Windows' thumbnail host for good, and with it every thumbnail and taskbar icon until you signed out. SageThumbs now reads AVIF with its own decoder instead of Windows' AV1 extension, in a separate helper process, so a damaged file cannot take Explorer down either. AVIF no longer needs the AV1 Video Extension from the Microsoft Store, its colours no longer change when that extension updates itself, and a 12-megapixel AVIF thumbnails in about a fifth of a second.
  - **Rename with pattern shows its Rename and Cancel buttons again** (fixes #48). The dialog was laid out for more room than its window left once the title bar was taken out, so the button row sat below the bottom edge with only a sliver showing. Every SageThumbs dialog now grows to fit its own buttons and fields, so none of them can cut a control off, at any display scaling or text size.
  - **Buttons and labels no longer cut off in other languages.** A check that opens every window in all 36 languages at 100, 150 and 200% scaling found translated text clipped in a dozen places: the Screenshots and Right-click menu buttons in Settings, a Quick preview label, Sort into folders by tag, Files to folder, the Rename button, the Convert report's Open folder, Convert's watermark Opacity label, the Send feedback dialog and the About box. Those controls now size themselves to their text, and a long label moves above its field instead of being cut.
  - **EXR and other HDR pictures no longer look dim.** A picture with nothing brighter than normal white (most EXR renders and conversions, and HDR photos without highlights) now shows at its true brightness instead of about three quarters of it, and in an HDR photo with bright highlights the brightest one is now pure white. HDR JPEG XL, AVIF, HEIC and TIFF files of an ordinary scene now look the same as their standard versions.
  - **Olympus and Panasonic photos taken in portrait now show upright.** Their `.orf` and `.rw2` files mark the rotation the same way every other camera does, under a slightly different file header that SageThumbs did not recognise, so the rotation was ignored.
  - **Double-click the Quick preview to go full screen.** Double-click a picture, a PDF page or a video to fill the screen, and double-click again (or press Esc) to go back. F11 still works once the preview has focus. Fit/100% zoom, which used to share the double-click, is on **Ctrl+0**.
  - **The wrong installer now says which one to get.** Running the regular (x64) installer on a Windows on ARM PC, or the ARM64 one on a regular PC, already stopped before installing, but only named a processor type. It now tells you to download the other installer and where to find it.
  - **A damaged JPEG XL file can no longer crash the thumbnail host.** The ways a broken `.jxl` could stop the JPEG XL decoder dead (a colour setting with no profile equivalent, an LF frame at the deepest level, smoothing asked for on subsampled colour) are now ordinary decode errors: the file shows the normal icon and the files around it keep their thumbnails.
  
  </details>
  
