  ## TL;DR
  
  **≡ƒåò New**
  
  - **3MF files without a saved picture show their model**
  
  **≡ƒ⌐╣ Fixed**
  
  - **3D models no longer look see-through**
  - **Bambu Studio and OrcaSlicer 3MF files show their picture**
  - **Backup and template files name the right thumbnail source**
  - **The File types list shows every extension in full**
  - **The File types list's Category column is in your language**
  - **The File types list's How column no longer cuts off translated labels**
  
  <details>
  <summary><b>Read more: everything in 3.8.0</b></summary>
  
  - **3MF files without a saved picture show their model.** A 3MF from a CAD program, or a bare model file, carries only the 3D model and no picture of it, so it got no thumbnail, or a texture or other stray image from inside the file. The model is now drawn, the same way STL files are, including the multi-part files Bambu Studio and OrcaSlicer write. When the file does carry a slicer's picture, that picture is still what you see.
  - **3D models no longer look see-through.** STL, OBJ and PLY thumbnails were drawn from below the model, and mirrored, so a solid print showed its underside and read as a hollow, see-through shell. They are now drawn from above and in front, the way a slicer shows them, with shading that follows the light, so a solid looks solid.
  - **Bambu Studio and OrcaSlicer 3MF files show their picture.** These slicers save their preview as the first plate's render rather than the `thumbnail.png` other slicers use. SageThumbs missed it and showed another image from the file, a nearly empty mask the slicer uses for clicking on objects, so the thumbnail came out blank and see-through. The plate's render is now shown.
  - **Backup and template files name the right thumbnail source.** The Settings format list and `st2k formats` said Blender's auto-save backups (`.blend1` to `.blend32`), SketchUp backups (`.skb`), Photoshop `.psdt` and `.pdd` files and Affinity templates (`.aftemplate`) were fully decoded. Like the files they are copies of, they show the preview stored inside, and they now say so. The thumbnails themselves are unchanged.
  - **The File types list shows every extension in full.** Its columns had fixed widths that did not grow with Windows display scaling, so at 150% or 200% the checkbox took up most of the Extension column and extensions were cut to `.apΓÇª` or `bΓÇª`. Extensions now always show in full, in every language and at every scaling, and the other columns size themselves to what they hold. You can still drag the dividers, and double-clicking one fits that column to its contents.
  - **The File types list's Category column is in your language.** It said Image, Ebook, Audio and so on in English whatever language SageThumbs was set to. It now follows your language in all 36 that SageThumbs speaks, and the search box above the list finds a format by its category in your language or in English.
  - **The File types list's How column no longer cuts off translated labels.** In 24 languages some How labels ran up to three times as wide as the English ones, mostly the "(OS codec)" note on video rows, so they ended in "...". They now use the short forms each language's own software uses (OS, SO, ╨₧╨í, τ│╗τ╗ƒΦºúτáüσÖ¿ and so on), and every one fits.
  
  </details>
  
