  ## TL;DR
  
  **≡ƒ⌐╣ Fixed**
  
  - **Big Affinity files get thumbnails**
  - **Big DjVu books get thumbnails**
  
  <details>
  <summary><b>Read more: everything in 3.7.3</b></summary>
  
  - **Big Affinity files get thumbnails.** An Affinity document (`.af`, `.afphoto`, `.afdesign`, `.afpub`) over 256 MB showed no thumbnail, which is common for layered work brought over from Photoshop. Affinity stores its preview at the end of the file, so SageThumbs now reads just that part, however big the file is. The Quick preview of such a file works too.
  - **Big DjVu books get thumbnails.** A multi-page DjVu file over 256 MB, such as a book scanned at high resolution, showed no thumbnail. SageThumbs now reads the book's page list and draws the first page alone, however long the book is. The Quick preview works too.
  
  </details>
  
