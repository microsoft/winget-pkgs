  <details>
  <summary><b>Read more: everything in 5.0.0</b></summary>
  
  - **Atari ST DEGAS and Tiny pictures get thumbnails.** DEGAS (`.pi1`, `.pi2`, `.pi3`), DEGAS Elite compressed (`.pc1`, `.pc2`, `.pc3`) and Tiny (`.tny`, `.tn1`, `.tn2`, `.tn3`) pictures, in all three ST resolutions, are read by SageThumbs 2K's own decoder, with each picture's own palette. DEGAS Elite files saved without the colour-animation block at the end, as many are, read too.
  
  - **Commodore 64 Koala Paint and FLI pictures get thumbnails** (`.koa`, `.kla`, `.fli`), read by SageThumbs 2K's own decoder in the C64's colours.
  
  - **GIMP brushes, image hoses and patterns get thumbnails** (`.gbr`, `.gih`, `.pat`): the brush or pattern itself, and an image hose's first brush.
  
  - **Seven more classic image formats get thumbnails**, each read by SageThumbs 2K's own decoder: wireless bitmaps (`.wbmp`), Nokia over-the-air bitmaps (`.otb`), MTV ray-tracer pictures (`.mtv`), Dune AAI (`.aai`), AVS X (`.avs`), slow-scan television (`.hrz`) and X Window dumps (`.xwd`).
  
  - **Windows app packages and Chrome extensions show their own icon.** `.appx`, `.msix`, `.appxbundle` and `.msixbundle` show the logo the package manifest names (a bundle, the logo of the app inside it), and `.crx` shows the icon the extension's manifest names, however large the extension is. A package without one keeps the stock icon.
  
  - **Text files can show their first page as a thumbnail, off by default.** With text thumbnails turned on in Settings, `.txt`, `.md`, `.json`, `.xml`, `.log`, `.csv`, `.ini`, `.reg` and `.rtf` files show their opening lines drawn as a page, and `.nfo` and `.diz` files are drawn in the DOS code page they were written in, so their block art lines up. Off, these types are left to Windows as before.
  
  - **More names for formats SageThumbs 2K already reads:** JPEG (`.jif`, `.jfi`, `.pjpeg`, `.pjp`, and the camera `.thm` preview), BigTIFF (`.btf`, `.tf8`), SGI (`.rgb`, `.rgba`, `.int`, `.inta`), Sun raster (`.im1`, `.im8`, `.im24`, `.im32`), `.epsf`, Illustrator templates (`.ait`), Amiga HAM (`.ham`, `.sham`), Office themes (`.thmx`), OpenDocument drawing templates (`.otg`) and Radiance `.pic`. Radiance pictures (`.pic` and `.hdr`) whose header has a line ahead of the `#?RADIANCE` signature, as some renderers write it, now read as well.
  
  - **GoPro `.lrv`, Matroska 3D `.mk3d` and transport-stream `.m2t` / `.trp` videos get frame thumbnails**, read the way their parent formats (MP4, Matroska and MPEG transport streams) are.
  
  - **Quick preview has a Show in folder button.** It opens the file's folder in Explorer with the file selected.
  
  - **Quick preview reloads the picture when the file changes on disk, and F5 reloads it by hand.** Save the file in an editor and the preview shows the new version, at the zoom and scroll you had. A file still being written is waited for, so a half-saved file is never shown.
  
  - **Settings warns when Explorer is set to show icons instead of thumbnails.** When Windows' own "Always show icons, never thumbnails" box (Folder Options, View) is ticked, no program's thumbnails show, which looks like SageThumbs 2K is broken. Settings now says so under every page, and Fix it turns the setting off. If Explorer puts it back, Folder Options opens on its View tab so you can untick the box yourself.
  
  - **Settings shows a short What's new note once after an update**, with a link to that version's release notes. Dismiss hides it until the next update; a fresh install never shows it.
  
  - **Settings Γû╕ File types can show only the file types you have ticked** (#85). A new switch, **Show only the selected file types**, lists just the ticked formats, so checking what is selected no longer means scrolling the whole list; the search box still narrows it. A type unticked while the switch is on keeps its row until the switch is turned off, so the list does not jump while you edit. It changes only the view, never which types are ticked.
  
  - **A smaller install.** The translations are stored compressed, and only the language in use is unpacked, once, when a SageThumbs 2K program starts. The command-line tool carries its own icon, so the install folder no longer holds a loose icon file; an upgrade removes the old one. The command-line tool `st2k.exe` is now a small launcher that runs the engine already inside `SageThumbs2K.exe`, so the install carries one copy of the engine instead of two. Every command, script and the MCP server work as before, through a symlink to `st2k.exe` too. A copy of `st2k.exe` on its own, away from `SageThumbs2K.exe`, now stops with one line saying so: link to the installed `st2k.exe` instead, or put the install folder on your `PATH`. If the `SageThumbs2K.exe` beside it is older (an update still waiting on a restart), `st2k` says so in one line instead of opening the Settings window.
  
  - **The picture tile in the right-click menu is drawn once.** When a label in the SageThumbs submenu was wider than the picture, Windows could draw the tile twice, side by side. The tile now takes the width of the widest label and shows once.
  
  - **Escape and Cancel close the thumbnail-cache rebuild questions in Settings without rebuilding.** The questions now offer Cancel, which Escape and the close box answer, and Cancel is the default button, so pressing Enter declines too. Only OK or Yes starts the rebuild and the Explorer restart that comes with it.
  
  - **3MF files built only from beams get thumbnails.** A 3MF whose parts are beam lattices, with no ordinary triangle mesh, is drawn as solid rods and balls.
  
  - **3MF beam lattices with `ballmode="all"` get a ball at every beam end**, as the Beam Lattice specification says, instead of only where a ball is listed.
  
