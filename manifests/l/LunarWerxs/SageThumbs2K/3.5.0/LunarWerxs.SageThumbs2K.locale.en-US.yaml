  ## TL;DR
  
  - **10-bit anime videos ("Hi10p") get thumbnails** (fixes #52)
  - **Format marks are one size on every thumbnail, with sharp letters** (fixes #50), and stay clear of the film strip on widescreen videos (fixes #51)
  - **The format mark stays visible after you change a file type's default program** (fixes #54)
  - **7-Zip and RAR archives and comics with big pictures get thumbnails** (fixes #53)
  - **DVD rips and other videos with non-square pixels show at their proper shape**
  - **JPEG XL pages keep their text**, and CMYK JPEG XL images open
  - **The Quick preview says why a video has no sound or picture** (fixes #49)
  
  <details>
  <summary><b>Read more: everything in 3.5.0</b></summary>
  
  - **10-bit H.264 videos ("Hi10p", common for anime) now get thumbnails** (#52). Windows has no decoder for them, so SageThumbs decodes them itself.
  - **Videos stored with non-square pixels show at their proper shape.** DVD rips and recordings stored at 720├ù480 or 720├ù576 are shown at 4:3 or 16:9, as players show them, instead of squeezed or stretched. Video thumbnails also no longer carry the thin band of padding some codecs store past the edge of the picture.
  - **Format marks are the same size on every thumbnail, with smooth, sharp letters** (#50). The mark followed each picture's shape, so a square picture got twice the mark of a widescreen video frame or a book cover, and its letters turned jagged and blurry once Explorer resized the thumbnail.
  - **On widescreen videos the format mark no longer hides under Explorer's film-strip border** (#51).
  - **The format mark stays visible after you pick a new default program for a file type** (#54). A program such as Readest puts its own icon in that corner, and choosing it after SageThumbs was set up let the icon cover the mark.
  - **7-Zip and RAR archives whose first picture is larger than 8 MB now get thumbnails** (#53), as zip and tar archives already did. That includes `.cb7` and `.cbr` comics with big scans.
  - **JPEG XL thumbnails keep their text.** The reference encoder saves repeated letters in a screenshot or a lettered comic page once and stamps them into place, and the thumbnail skipped that step, so pages came out with most of their text missing and speech bubbles empty. It now draws them.
  - **CMYK JPEG XL images get thumbnails.** They failed to open at all before.
  - **Very tall JPEG XL images, such as webtoon strips, usually thumbnail about three times faster.**
  - **The Quick preview now says why a video has no sound or no picture** (#49). Windows has no decoder for DTS sound at all, and HEVC, AV1 and VP9 video need extensions from the Microsoft Store, so such a video used to play in silence or show a still frame with no explanation. Codec packs such as K-Lite cannot fill the gap, because they plug into a different part of Windows than the one the preview plays through. The title bar now names what is missing, for example "No sound: DTS isn't supported by Windows".
  - **At very high display scaling (500%), the welcome window's descriptions no longer lose their last line.**
  
  </details>
  
