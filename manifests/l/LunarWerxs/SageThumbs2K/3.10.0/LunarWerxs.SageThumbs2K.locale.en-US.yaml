  <details>
  <summary><b>Read more: everything in 3.10.0</b></summary>
  
  - **Adobe Flash (.swf) movies get thumbnails.** A Flash movie used to keep the plain file icon. SageThumbs now draws the movie from its own shapes, gradients and pictures, with no Flash Player and no script run. A movie that opens on a "loading" screen is shown as the first frame that has something on it, so the thumbnail is the movie's picture rather than an empty background. Text in a font the movie does not carry, and movies packed with LZMA, are not drawn yet. Thanks to TOM-PIC for the report and the sample (#70).
  - **Add and remove dividers in Edit menu items.** Right-click a row in Settings Γû╕ Right-click menu Γû╕ Edit menu items for Add divider above, Add divider below and, on a divider, Remove divider. There was no way to add a divider before. The Check, Uncheck and Toggle selected entries, which did nothing a click on the tick box did not, are gone from that list's menu.
  - **Edit menu items saves only on Done.** Cancel, Escape and the window's X now throw the edit away and put the list back the way it was when the window opened. In 3.9.0 the X saved everything, so there was no way to back out of a change.
  - **One Reset in Edit menu items brings back the whole factory menu.** Reset order only put the rows back in order and left the ticks alone. Reset now restores the order, the ticks and the dividers, and like every other edit it takes effect on Done.
  - **Edit menu items explains itself above the list.** The help text was a tooltip that followed the mouse over every row and the scrollbar; it is now a line of text above the list.
  - **Store apps' icons stay as they are: no badge, no checkerboard, never blank.** Windows draws the icons of Store apps (Calculator, Notepad, Media Player and the like) on the taskbar, in Start and in Explorer, including the small file-type icon in a thumbnail's corner, by asking the PNG thumbnail handler for the app's logo, and SageThumbs is that handler. With the format badge or the checkerboard on, those icons got them too, and with SageThumbs' thumbnails switched off they could come out blank. SageThumbs now recognises an app's own icon and hands it back untouched, whatever its settings say.
  - **Dragging a row in Edit menu items keeps the list where it was scrolled.** Every drop sent the list back to the top. It now stays put, and dragging to the top or bottom edge scrolls the list a row at a time.
  - **A divider dragged beside another stays until Done.** A divider dropped next to another divider, or at the very top or bottom, vanished on the spot. It now stays while you edit, and Done tidies doubled dividers and dividers at either end.
  - **Escape closes Edit menu items.** Escape did nothing; it now cancels like the X. During a drag it drops only the drag.
  - **Settings comes back to the front when Edit menu items closes.** Closing the editor could leave another program in front instead of Settings.
  - **The list in Edit menu items fills its window.** A selected row's highlight stopped well short of the scrollbar.
  
  </details>
  
