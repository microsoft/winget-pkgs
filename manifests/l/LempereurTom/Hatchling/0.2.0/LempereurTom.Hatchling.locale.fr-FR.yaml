ShortDescription: Extracteur et créateur d'archives ZIP, 7z et RAR, avec une interface et un menu clic droit façon WinRAR. Extrait les grosses archives sur place, avec peu d'espace libre.
Description: |-
  Hatchling est un fork open source non officiel de HatchZip. Il extrait les archives sur place : l'archive est raccourcie au fur et à mesure que les fichiers en sortent, donc il suffit d'avoir la place des fichiers extraits, pas celle de l'archive en plus.

  Il ajoute la création d'archives ZIP et 7z (mot de passe AES-256, volumes, suppression des fichiers après archivage), un menu clic droit au premier niveau de Windows 11, une fenêtre principale organisée comme celle de WinRAR et une interface en français.

  Il lit les ZIP, 7z, RAR, tar, tar.gz, tar.xz et les archives fractionnées. Par défaut, « Extraire ici » supprime l'archive pendant l'extraction ; « Extraire ici (garder l'archive) » la conserve.
