ShortDescription: ZIP, 7z and RAR extractor and archiver with a WinRAR-style window and context menu. Extracts huge archives in place, with little free space.
Description: |-
  Hatchling is an unofficial, open-source fork of HatchZip. It extracts archives in place: the archive shrinks as files come out, so only the space for the extracted files is needed, not the archive on top.

  It adds creating ZIP and 7z archives (AES-256 password, split volumes, delete files after archiving), a top-level Windows 11 context menu entry, a WinRAR-style main window and a French interface.

  It reads ZIP, 7z, RAR, tar, tar.gz, tar.xz and split archives. By default "Extract here" removes the archive while extracting; "Extract here (keep archive)" keeps it.
