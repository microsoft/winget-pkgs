ShortDescription: A PDF reader for long documents, with citation previews, split view, read aloud, highlights, notes, and dark pages that keep pictures in colour.
Description: |-
  Lampka is a PDF reader for long documents such as theses, papers, reports and bundles. Follow a citation and come straight back, or read two parts side by side. At night the pages go dark while charts and photos keep their colours.

  Reading and study
  - Citation, figure and link previews, with Back returning you to where you were.
  - Split view shows the same document twice, so the text can sit beside its footnotes, references or exhibits, and links can open in the other pane.
  - Read aloud uses the computer's own voices offline, follows along sentence by sentence, skips headers and citation numbers, and remembers where you stopped.
  - Page numbers follow the document's own page labels, so "see page xii" or "A-14" takes you to the right page.
  - A reading ruler marks the lines you are on, or dims everything else.
  - Highlights, notes and bookmarks are stored by Lampka and can be exported as Markdown; the PDF itself is never modified.
  - A single page can be turned sideways to read a wide table, and printing uses your reading colours.
  - Comments and replies left in a PDF by other readers are shown with the text they refer to.

  Comfort and layout
  - Six reading themes (Day, Sepia, Dusk, Night, Midnight and Amber), dark pages that keep figures in colour, evening mode, and custom themes that can be shared as a small file.
  - A library that remembers your place in every document and recognises documents by their contents, so your place and notes survive renaming or moving the file.
  - Fit the page width or the whole page, two-page view, find with match counts, contents, bookmarks and Back.
  - Reading progress, notes and settings can sync between computers through your own cloud storage, such as OneDrive, Dropbox or Google Drive.
  - Settings, library and notes can be exported as one file and moved to another computer.

  Privacy
  Lampka works offline and needs no account. It does not send anything about you, your computer or your reading, shows no adverts, and follows the printing and copying restrictions set in a PDF. Your PDFs stay where you keep them and are never changed.
