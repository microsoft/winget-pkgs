ShortDescription: 面向长文档的 PDF 阅读器，支持引用预览、分屏阅读、离线朗读、高亮与笔记，深色页面下图表仍保留原有色彩。
Description: |-
  Lampka 是一款面向长文档的 PDF 阅读器，适合阅读学位论文、学术论文、报告和合订文档。可以跟随引用跳转后直接返回原来的位置，也可以并排阅读同一文档的两个部分；夜间页面转为深色，而图表和照片仍保留原有色彩。

  阅读与研读
  - 引用、插图和链接预览，点击跳转后用「返回」即可回到原来的位置。
  - 分屏视图可同时显示同一文档的两处内容，让正文与脚注、参考文献或附表并列显示，链接可以在另一侧窗格打开。
  - 离线朗读使用电脑自带的语音，逐句跟随，跳过页眉和编号引用，并记住停止的位置。
  - 页码沿用文档自身的页标签，因此「见第 xii 页」或「A-14」都能定位到正确的页面。
  - 阅读标尺可以标出当前行，或淡化其他内容。
  - 高亮、笔记和书签由 Lampka 保存，可导出为 Markdown；PDF 文件本身不会被修改。
  - 可单独旋转某一页以阅读宽表格，打印时使用你的阅读配色。
  - 显示其他读者在 PDF 中留下的批注和回复，并关联其所指的正文。

  舒适性与版面
  - 六种阅读主题（Day、Sepia、Dusk、Night、Midnight、Amber）、保留图形色彩的深色页面、夜间模式，以及可作为小文件分享自定义主题。
  - 书库会记住每份文档的阅读位置，并按内容识别文档，因此重命名或移动文件后进度与笔记仍然保留。
  - 支持按页宽或整页适配、双页视图、带匹配计数的查找、目录、书签和返回。
  - 阅读进度、笔记和设置可通过你自己的云存储（如 OneDrive、Dropbox、Google Drive）在各电脑之间同步。
  - 可将设置、书库和笔记导出为一个文件并迁移到其他电脑。

  隐私
  Lampka 可离线使用，无需账号。它不会发送有关你、你的电脑或你阅读内容的任何信息，不含广告，并遵守 PDF 中设定的打印与复制限制。你的 PDF 保留在原处，且不会被修改。
