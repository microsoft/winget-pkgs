ShortDescription: A modern desktop launcher and mod manager for Vintage Story.
Description: |-
  Story Forge is a modern desktop app for Vintage Story players, designed to make switching between game versions, modpacks, servers, and accounts effortless.

  Features include version management with a resumable download queue, optional Optimum performance builds, one-click imports from other launchers, mod browsing and lifecycle tools (enable/disable, presets, dependency installs, update checks), modpack support, server favourites and hosting tools, deep links (storyforge://install?mod=<id>), pack locks with SHA-256 verification, and a built-in auto-updater.
