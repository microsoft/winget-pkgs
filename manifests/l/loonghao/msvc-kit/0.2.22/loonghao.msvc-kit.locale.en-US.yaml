ReleaseNotes: |-
  Fix original VS2015 toolchain layout discovery and x86/x64 host-target selection. Add explicit existing SDK roots with --sdk-dir and bounded early Windows 10 SDK tool-layout fallback. Preserve modern exact-version selection and source-compatible APIs. Legacy selection is fixture/CLI tested; real VS2015/early-SDK compilation was not verified. This release does not certify Unity IL2CPP or PyOxidizer builds. See msvc-kit PR #199 for details.
