ShortDescription: Peer-to-peer file transfer and chat between friends, end-to-end encrypted.
Description: |-
  P2P Share lets friends chat and send each other files of any size directly, without any server storing them, over end-to-end encrypted connections that cross NATs (iroh, QUIC).
