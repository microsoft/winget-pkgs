ShortDescription: 免越狱的 iPhone 定位模拟控制台，电脑通过苹果调试通道注入位置
Description: |
  Tsursport iOS 是一个 Windows 桌面控制台，通过苹果的开发者调试通道（DeveloperDiskImage / DTX）
  把定位数据注入到 iPhone，不越狱、不安装 App、不需要签名。

  功能包括：地图上点选折线画路线、配速 0.8–15 m/s 实时调节、开始/暂停/断点继续、
  五步设备向导（驱动 → 信任 → 隧道 → 遥控 → 核对）、无设备时的演练模式、
  以及一键恢复真实定位。

  依赖说明：连接真机需要预先安装苹果驱动 Apple Mobile Device Support，
  并在 iPhone 上信任电脑、开启开发者模式；iOS 17 及以上的 RSD 隧道由程序自动建立。
