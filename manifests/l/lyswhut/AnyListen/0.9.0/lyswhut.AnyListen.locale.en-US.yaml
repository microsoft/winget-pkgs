ReleaseNotes: |-
  Added
  - Added a Show Current Song Playback Progress in Taskbar option under Settings > Playback Settings (#279).
  - Added a Classic Lyrics Window Width Scale setting to adjust the lyrics window width, located under Settings > Desktop Lyrics Mode Settings.
  - Added a Song Source Switching feature, available from the right-click menu for songs in the song list.
  - Added the built-in Inter Variable font as the preferred default font (#278).
  - Added a Horizontal Alignment option for Classic Desktop Lyrics under Settings > Desktop Lyrics Settings > Classic Lyrics (#299).
  - Added Song Position Adjustment, available from the song list context menu (#302).
  - Added a Convert Chinese Lyrics to Traditional Chinese option for playback and downloaded Chinese lyrics, located under Settings > Playback Settings (#333).
  - Added Keyboard Shortcut Settings under Settings > Keyboard Shortcut Settings.
  Improved
  - Improved window border rendering when using native system windows on Windows (#230).
  - Improved multiline desktop lyrics mode so that the active line's line spacing is no longer scaled when scaling is disabled.
  - Improved remote song data parsing logic to increase song tag parsing speed and success rate.
  Fixed
  - Fixed an issue where the file save dialog API could not select folders (#285).
  - Fixed lyrics display issue when switching songs (#284).
  - Fixed an issue where some lyrics did not wrap properly.
  - Fixed an issue where the multi-line lyrics window could not be freely resized when desktop lyrics dynamically switched from Classic Lyrics Mode to Multi-line Lyrics Mode.
  - Fixed an issue with setTimeout-related APIs in the extension-isolated API environment (#301).
  - Fixed an issue where fullscreen mode was unavailable on Windows (#291).
  - Fixed an issue where the window was not displayed on Linux when using Wayland.
  - Fixed an issue where the Auto-play Music on Startup option did not work (#339).
  - Fixed an issue where data could not be read from some WebDAV servers (#359).
  - Fixed an issue where the font dropdown could not be opened in certain cases (#361).
  - Fixed an issue where some lyrics could overflow the interface (#366).
  Changed
  - Prioritized binding the local resource server to IPv4 addresses (#290).
  Extension System
  - Updated the extension engine version to 1.4.0.
  - Added a readme field for extension plugins; when provided, its content is rendered as Markdown and displayed on the extension details page.
  - Added gzip and gunzip APIs in the zlib module.
