PackageIdentifier: lyswhut.AnyListen
PackageVersion: 0.9.0
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 跨平台私人音乐播放服务
Description: |-
  跨平台私人音乐播放服务
  功能
  - 添加并播放本地歌曲（标准播放列表和本地列表）
  - 添加并播放存储在 WebDAV 上的歌曲（远程列表）
  - 在线歌曲元数据匹配（封面、歌词；通过扩展管理器安装相关扩展）
  - 实验性音频效果
  - 卡拉 OK 歌词和标题栏歌词
Tags:
- 专辑
- 播放器
- 歌单
- 歌手
- 歌曲
- 音乐
- 音频
ReleaseNotes: |-
  新增
  - 新增 「在任务栏上显示当前歌曲播放进度」 选项，位于 设置 > 播放设置（#279）。
  - 新增 「经典歌词窗口宽度系数」 设置，用于调整歌词窗口宽度，位于 设置 > 桌面歌词模式设置。
  - 新增 「歌曲换源」 功能，可在歌曲列表中通过歌曲右键菜单使用。
  - 新增内置 「Inter Variable」 字体作为首选默认字体（#278）。
  - 经典桌面歌词新增 「水平对齐方式」 选项，可在 设置 > 桌面歌词设置 > 经典歌词 中调整（#299）。
  - 新增 「歌曲位置调整」 功能，可在歌曲列表右键菜单中使用（#302）。
  - 新增 「将播放与下载的中文歌词转换为繁体」 选项，位于 设置 > 播放设置（#333）。
  - 新增 「快捷键设置」，位于 设置 > 快捷键设置。
  优化
  - 优化 Windows 下使用原生系统窗口时的窗口边框显示效果（#230）。
  - 优化桌面歌词多行模式，未启用缩放时不再缩放激活行的行距。
  - 优化远程歌曲数据解析逻辑，提高歌曲标签解析速度与成功率。
  修复
  - 修复文件保存弹窗 API 无法选择文件夹的问题（#285）。
  - 修复切换歌曲时的歌词显示问题（#284）。
  - 修复某些歌词不换行的问题。
  - 修复桌面歌词从 「经典歌词模式」 动态切换到 「多行歌词模式」 时，多行歌词窗口无法自由调节大小的问题。
  - 修复扩展隔离 API 环境的 setTimeout 相关 API 异常问题（#301）。
  - 修复 Windows 下无法全屏的问题（#291）。
  - 修复 Linux 下使用 Wayland 时窗口不显示的问题。
  - 修复 「启动后自动播放音乐」 选项不生效的问题（#339）。
  - 修复无法读取某些 WebDAV 服务端数据的问题（#359）。
  - 修复在某些情况下无法打开字体下拉列表的问题（#361）。
  - 修复某些歌词显示溢出界面的问题（#366）。
  变更
  - 本地资源服务器优先绑定到 IPv4 地址（#290）。
  扩展系统
  - 扩展引擎版本更新至 「1.4.0」。
  - 新增扩展插件 「readme」 字段；填写后，其内容将以 Markdown 语法渲染并显示在扩展详情页。
  - 在 「zlib」 模块中新增 「gzip」 与 「gunzip」 API。
ManifestType: locale
ManifestVersion: 1.12.0
