PackageIdentifier: lyswhut.AnyListen
PackageVersion: 0.8.0
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 跨平台私人音乐播放服务
Description: |-
  跨平台私人音乐播放服务
  功能
  - 添加并播放本地歌曲（标准播放列表和本地列表）
  - 添加并播放存储在 WebDAV 上的歌曲（远程列表）
  - 在线歌曲元数据匹配（封面、歌词；通过扩展管理器安装相关扩展）
  - 实验性音频效果
  - 卡拉 OK 歌词和标题栏歌词
Tags:
- 专辑
- 播放器
- 歌单
- 歌手
- 歌曲
- 音乐
- 音频
ReleaseNotes: |-
  新增
  - 新增歌曲列表排序方式 「按曲目编号」 选项（#152）。
  - 新增 「数据同步」 功能，支持将数据同步到 WebDAV，可在 设置 > 数据同步 中使用。
  - 新增 「备份与恢复」 功能，支持将列表数据导出到或导入本地，并支持导出为 txt、csv 格式，可在 设置 > 备份与恢复 中使用。
  - 新增本地 「strm」 类型文件支持，当前仅支持 HTTP 协议的歌曲链接（#227）。
  - 桌面歌词新增 「经典歌词」 模式。
  - 在 「托盘菜单」 中新增 「桌面歌词」 相关控制。
  - 新增 WebDAV 数据同步的 「记录调试日志」 选项。
  - 新增 APP、扩展服务 等日志输出界面。
  - 新增 「启用调试日志」 开关，位于 设置 > 其他设置，默认关闭。
  - 在本地列表设置中新增 「忽略权限错误」 选项，当遇到歌曲无法被扫描到但普通列表仍可添加并播放时，可以启用该设置（#265）。
  优化
  - 优化歌曲封面加载逻辑，修复某些情况下封面不显示的问题（#225）。
  - 初步新增 「远程列表」 与 「在线列表」 的定时自动同步功能，当前固定为每天上午 11 点同步一次（#264）。
  - 优化自动换源匹配机制。
  修复
  - 修复在某些情况下移动歌曲时可能导致保存的顺序不对的问题。
  - 修复歌词时间标签解析问题。
  - 修复歌词偏移功能异常的问题。
  - 修复播放速率功能异常的问题。
  - 修复播放在线列表时的播放列表同步问题（#225）。
  - 修复 macOS 全屏窗口状态可能不同步的问题（#257）。
  - 修复 macOS 更新媒体控制栏信息时的进度条显示问题（#256）
  - 修复输入框在某些字体下下划线不显示的问题（#258）。
  - 修复 Windows 非透明模式下退出全屏时窗口大小未恢复的问题（#261）。
  - 修复代理服务在代理某些资源时报错的问题（#263）。
  - 修复本地歌曲信息更新时的冲突问题。
  变更
  - 桌面歌词默认使用 「经典歌词」 模式，如需切换回原来的多行模式，可前往 设置 > 桌面歌词设置 > 歌词模式 进行切换。
