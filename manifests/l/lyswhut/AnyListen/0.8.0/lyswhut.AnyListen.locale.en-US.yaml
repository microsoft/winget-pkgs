ReleaseNotes: |-
  Added
  - Added a Track Number sorting option for song lists (#152).
  - Added a Data Sync feature with support for syncing data to WebDAV, available under Settings > Data Sync.
  - Added a Backup & Restore feature with support for exporting or importing list data locally, and exporting to txt and csv formats, available under Settings > Backup & Restore.
  - Added support for local strm files. Currently, only song links over HTTP are supported (#227).
  - Added Classic Lyrics mode for Desktop Lyrics.
  - Added Desktop Lyrics controls to the Tray Menu.
  - Added a Record debug logs option for WebDAV data synchronization.
  - Added logging output views for the app and extension service.
  - Added an Enable Debug Logging toggle under Settings > Other Settings. Disabled by default.
  - Added an Ignore Permission Errors option in Local List Settings. If some songs cannot be scanned but can still be added to and played from regular lists, you can enable this option (#265).
  Improved
  - Improved song cover loading logic and fixed an issue where cover images were not displayed in some cases (#225).
  - Added initial support for scheduled auto-sync for Remote Lists and Online Lists. It is currently fixed to run once daily at 11:00 AM (#264).
  - Improved the automatic source-switching matching logic.
  Fixed
  - Fixed an issue where moving songs could result in an incorrect saved order in some cases.
  - Fixed an issue with lyric timestamp tag parsing.
  - Fixed an issue where the Lyric Offset feature was not functioning correctly.
  - Fixed an issue where the playback speed feature was not functioning correctly.
  - Fixed a playlist synchronization issue when playing online lists (#225).
  - Fixed an issue where full-screen window state on macOS might not sync correctly (#257).
  - Fixed an issue where the progress bar could display incorrectly when updating media control bar information on macOS (#256).
  - Fixed an issue where the underline in input fields could disappear with certain fonts (#258).
  - Fixed an issue where the window size did not restore after exiting fullscreen in Windows non-transparent mode (#261).
  - Fixed an issue where the proxy service threw errors when proxying certain resources (#263).
  - Fixed an issue where local song metadata updates could conflict.
  Changed
  - Desktop Lyrics now defaults to Classic Lyrics mode. To switch back to the previous multi-line mode, go to Settings > Desktop Lyrics Settings > Lyrics Mode.
ReleaseNotesUrl: https://github.com/any-listen/any-listen-desktop/releases/tag/v0.8.0
