ReleaseNotes: |-
  Added
  - Added a Follow System Light/Dark Mode option for the tray icon under Settings > Other Settings. When enabled, the icon color follows the system's light or dark mode.
  - Added a Save as Regular Playlist button to song lists in the Online Resources section. Selecting it creates a regular playlist and adds the songs to it.
  - Added an Automatic Sync option to online list settings. Disabled by default.
  - Added Play and Remove buttons for songs in playlists (#385).
  Improved
  - Improved the Add Songs dialog with a horizontal layout and more playlist information.
  - Improved the lyric scaling animations on the Now Playing page and in desktop lyrics.
  Fixed
  - Fixed an issue where scrolling the mouse wheel over a number input changed both the input value and the page scroll position (#298).
  - Fixed frame drops on Linux Wayland (#386).
  - Fixed an issue where the desktop lyrics window size changed unexpectedly on Windows when display scaling was not set to 100% (#387).
  - Fixed a conflict between local keyboard shortcuts and text input in input fields (#388).
  - Fixed an issue where playback position was calculated incorrectly when adding songs to Play Next (#389).
  - Fixed inaccurate lyric progress positioning at certain font sizes (#391).
  Changed
  - Clicking Play all now automatically switches the play mode to List loop (#379).
  - Updated the default settings for the Now Playing page: set the Lyrics Font Size to 80, and disable Bold Lyrics and Delayed Scrolling.
  - Online lists no longer sync remote lists automatically by default, including previously created lists. To enable automatic syncing for a list, turn it on in that list's settings.
