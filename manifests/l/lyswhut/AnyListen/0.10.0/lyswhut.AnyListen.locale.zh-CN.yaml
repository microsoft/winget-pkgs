PackageIdentifier: lyswhut.AnyListen
PackageVersion: 0.10.0
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 跨平台私人音乐播放服务
Description: |-
  跨平台私人音乐播放服务
  功能
  - 添加并播放本地歌曲（标准播放列表和本地列表）
  - 添加并播放存储在 WebDAV 上的歌曲（远程列表）
  - 在线歌曲元数据匹配（封面、歌词；通过扩展管理器安装相关扩展）
  - 实验性音频效果
  - 卡拉 OK 歌词和标题栏歌词
Tags:
- 专辑
- 播放器
- 歌单
- 歌手
- 歌曲
- 音乐
- 音频
ReleaseNotes: |-
  新增
  - 新增 「跟随系统亮暗模式」 选项，位于 设置 > 其他设置。启用后，托盘图标颜色会随系统亮暗模式切换。
  - 在线资源板块的歌曲列表中新增 「收藏为普通列表」 按钮，点击后会创建一个普通列表，并将当前列表中的歌曲添加到该列表。
  - 在线列表设置新增 「自动同步」 选项，默认关闭。
  - 播放列表新增歌曲 「播放」 和 「移除」 按钮（#385）。
  优化
  - 优化 「添加歌曲」 弹窗，采用横向布局并展示更多歌单信息。
  - 优化播放详情页与桌面歌词的歌词缩放动画效果。
  修复
  - 修复在数字输入框上滚动鼠标滚轮时，输入框数值和页面滚动位置同时改变的问题（#298）。
  - 修复 Linux Wayland 下的掉帧问题（#386）。
  - 修复 Windows 显示缩放比例不为 100% 时桌面歌词窗口大小意外改变的问题（#387）。
  - 修复本地快捷键与输入框输入冲突的问题（#388）。
  - 修复添加歌曲到稍后播放时播放位置计算异常的问题（#389）。
  - 修复特定字体大小设置下歌词定位进度不准确的问题（#391）。
  变更
  - 点击 「播放全部」 时会自动将播放模式切换为 「列表循环」（#379）。
  - 调整播放详情页默认设置：将 「歌词字体大小」 设为 80，关闭 「加粗歌词」 和 「延迟滚动」。
  - 新创建的在线列表和已有在线列表默认不再自动同步远程列表。如需自动同步某个列表，可在该列表的设置中启用。
