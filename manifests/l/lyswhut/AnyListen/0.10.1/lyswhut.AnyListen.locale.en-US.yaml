ReleaseNotes: |-
  Improved
  - The app now automatically selects the last-selected playlist on startup (#401).
  - Improved the click interaction for items in the dropdown under the top search box (#415).
  Fixed
  - Fixed an issue where using the keyboard shortcut to open Search unexpectedly activated list multi-selection mode.
  - Fixed an issue with checking the availability of local playlist paths.
  - Fixed an issue where the song count shown in playlist lists could differ from the actual count.
  - Fixed an issue where deleting the currently selected playlist could cause the UI to freeze (#417).
  - Fixed an issue where songs could not be read when local file names contained ? (#420).
  - Fixed an issue where some lyric timestamp tags were parsed incorrectly.
  - Fixed numerous bugs. Thanks to @xinghui79 for the contribution.
  Changed
  - Desktop lyrics now use Multi-line Lyrics mode by default.
