PackageIdentifier: lyswhut.AnyListen
PackageVersion: 0.10.1
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 跨平台私人音乐播放服务
Description: |-
  跨平台私人音乐播放服务
  功能
  - 添加并播放本地歌曲（标准播放列表和本地列表）
  - 添加并播放存储在 WebDAV 上的歌曲（远程列表）
  - 在线歌曲元数据匹配（封面、歌词；通过扩展管理器安装相关扩展）
  - 实验性音频效果
  - 卡拉 OK 歌词和标题栏歌词
Tags:
- 专辑
- 播放器
- 歌单
- 歌手
- 歌曲
- 音乐
- 音频
ReleaseNotes: |-
  优化
  - 程序启动时自动选中上次选中的歌单（#401）。
  - 优化顶部搜索框下拉列表项的点击交互体验（#415）。
  修复
  - 修复使用快捷键打开搜索时意外进入列表多选模式的问题。
  - 修复本地列表路径可用性检查异常的问题。
  - 修复歌单列表中显示的歌曲数量可能与实际数量不一致的问题。
  - 修复删除当前选中的列表时可能导致 UI 卡死的问题（#417）。
  - 修复本地文件名包含 ? 时歌曲无法读取的问题（#420）。
  - 修复某些歌词时间标签解析错误的问题。
  - 修复大量 bug，感谢 @xinghui79 提供的 PR。
  变更
  - 桌面歌词默认使用 「多行歌词」 模式。
