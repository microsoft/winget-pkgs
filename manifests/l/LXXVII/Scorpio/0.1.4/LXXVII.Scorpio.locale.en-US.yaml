ShortDescription: A light crosshair overlay that shows only over your games and never touches them.
Description: |-
  Scorpio draws a crosshair in a small transparent window over the game. It never opens the game's process, reads its memory, injects code or installs global hooks.
  It shows only over games, keeps a crosshair per game, hides while you aim, reads CS2-style crosshair codes, and can show the crosshair in OBS. One small process, about 7 MB of memory and nearly no CPU while idle.
  Scorpio updates itself between games.
