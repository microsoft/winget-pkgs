  - docs: fix README typos, align bilingual content and update metadata by @EricZhou05 in https://github.com/lbjlaq/Antigravity-Manager/pull/3579
  - fix(proxy): reduce downstream SSE heartbeat interval to 3s to prevent client disconnect during deep thinking by @EricZhou05 in https://github.com/lbjlaq/Antigravity-Manager/pull/3578
