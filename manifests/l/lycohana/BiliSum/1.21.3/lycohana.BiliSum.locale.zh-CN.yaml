ReleaseNotes: |-
  v1.21.3
  主要版本信息
  紧急修复正式安装包的后端版本识别错误。v1.21.2 安装包已撤回；请使用 v1.21.3，桌面、后端和托管运行时将报告一致版本。
  紧急修复
  - 在冻结后端中携带应用版本元数据，修复安装后 /health 等后端版本信息回退为 0.0.0 的问题。
  - 冻结程序优先使用自身分发元数据，避免附近源码目录中的 VERSION 文件掩盖打包缺陷。
  - Windows、macOS Intel 和 Apple Silicon 构建均在发布前执行独立数据目录冷启动检查，要求后端版本匹配本次发行版本，且服务及托管运行时达到就绪状态。
  包含的功能与体验更新
  本修复版同时包含上一轮更新：
  - 存储迁移：安装目录选择、空间预览、文件校验、数据库与 JSON 路径更新、新位置启动验证和失败恢复；支持旧版嵌套数据目录，保留未选择的导出目录。
  - 一次性定时：在首页右侧菜单设置本次执行时间，支持分 P 和合集批量，普通开始按钮仍立即执行。
  - LLM 失败续跑：保存转写与分段，修正配置后仅重跑 LLM，沿用同一任务，支持重启恢复。
  - 自定义摘要提示词预设、Web / Docker Markdown 与图片 ZIP 下载，以及桌面内置 uv 安装。
  - 修复迁移预览权限错误、长路径溢出、迁移进度丢失及暗色模式按钮、更新提示和版本行样式。
  - 保留 Gemini 与 OpenAI 兼容网关 JSON / SSE / NDJSON 处理，区分鉴权与暂时性错误。
  使用说明
  - 已下载 v1.21.2 的用户请升级至本版本。
  - 定时执行需要应用或服务保持运行；休眠和关机期间不会唤醒系统。
  - 迁移通过验证前保留旧数据，未迁移或已变化的内容不会被直接清理。
  完整变更：v1.21.1…v1.21.3
