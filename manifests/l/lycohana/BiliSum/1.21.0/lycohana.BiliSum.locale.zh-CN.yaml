  - PR #137 合集视图与批量调度修复：Python 全量测试 486 passed, 1 skipped，合集定向测试 15 passed。
  - PR #137 的 CI 已通过 Python/CLI/桌面端验证、Windows 打包、macOS 打包、Docker 镜像构建和桌面包变更检测。
  - 桌面端相关变更已执行 typecheck、桌面测试、renderer build 和 git diff --check。
