ShortDescription: Compare two disks or folders
Description: GEMINUS compares two disks or two folders and shows side by side what is identical, what changed and what exists on one side only. Differences can then be copied, moved or deleted by dragging them between the two columns. It reads file contents when asked to, keeps working on slow or damaged disks, and can check the physical health of the drives before comparing them.
