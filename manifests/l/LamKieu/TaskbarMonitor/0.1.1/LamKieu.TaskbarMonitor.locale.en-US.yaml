ShortDescription: Shows CPU, GPU, VRAM and RAM usage on the Windows taskbar.
Description: |-
  A lightweight system monitor that shows CPU, GPU, VRAM and RAM usage right on the Windows taskbar.
  Click it to open a detail panel with per-thread CPU load, memory and commit charge, per-engine GPU load,
  VRAM for every graphics adapter, and 60-second history graphs.
  Single portable executable written in Rust; no driver and no admin rights required.
