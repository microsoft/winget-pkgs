ReleaseNotes: |-
  Overview
  Citavi 7.4.1 is a maintenance release. It fixes a problem that could remove PDF attachments from a project when the project was archived or copied, restores a number of commands that had stopped working in Citavi 7.3, and resolves several Word Add-In issues that affected long documents. AI Summary and Key Findings now work with a Citavi Database Server license, the Citavi Picker works again in Chrome, signing in to Citavi Web is more reliable, and cloud projects are faster.
  This release contains no new features. All Citavi 7.4 users should install it.
  What’s fixed
  Desktop — Projects and attachments
  - Archiving a project, saving a copy of a project, or copying a project to the cloud no longer removes PDF attachments and their cover images from the original project in rare cases.
  - Creating a cloud project is more reliable on slow connections.
  - Changes made in Citavi Web appear immediately in an open cloud project in Citavi Desktop.
  Desktop — References, knowledge items, and find full texts
  - Quotations and comments can be dragged from the Quotations & comments tab onto categories, keywords, and groups in the References view again.
  - Reference types can be dragged into the favorites area of the Choose reference type dialog again, so the favorites list can be personalized as intended.
  - Find full text downloads considerably more open-access PDFs from PubMed Central.
  Desktop — Import, export, and the bibliography
  - File > Import > Import from a file containing tabular data creates references again when importing from Excel, SQLite, and delimited text files (CSV, tab-separated, semicolon-separated).
  - Group bibliography > Create new grouping creates a new grouping set without an error message, and selecting an existing grouping set activates the set you clicked rather than the one below it.
  Desktop — Interface and languages
  - Accented characters (é, è, à, ù, â, and others) are displayed correctly again in the French interface.
  Desktop — AI features
  - AI Summary and Key Findings can be used with a Citavi for DBServer license.
  - Where AI features have been switched off by an administrator, via the MSI Assistant or the registry, the View > AI Assistant menu entry is hidden and the Ctrl+4 shortcut no longer opens AI Search.
  Citavi Web
  - Signing in is more reliable. Users who saw a permanently spinning or blank page after authenticating, and had to use a private browsing window to get in, can sign in normally.
  - The team chat is working again. The chat button is active when other project members are online, messages are delivered in both directions between Citavi Web and Citavi Desktop, and clicking the button when nobody else is online shows the expected hint.
  - Quotations created in Citavi Web are stored correctly and appear as formatted text in Citavi Desktop instead of showing the underlying markup.
  Cloud performance
  - Cloud projects open and respond faster, particularly outside Europe.
  Word Add-In / Citavi Assistant
  - Working in long documents is noticeably faster. Changes made in Citavi are applied to the open document in proportion to what actually changed, rather than reformatting the whole document and rebuilding the Citavi task pane every time.
  - Adding a highlight or annotation to a PDF in Citavi Desktop is faster and more stable while a large Word document is open.
  - Documents no longer grow unnecessarily. The information Citavi stores inside each citation has been reduced. Existing documents slim down as their citations are rewritten.
  - Citing a second contribution from a book or legal commentary that has already been cited works correctly, and the parent reference is added to the bibliography once.
  - Knowledge items in the Knowledge tab appear in the same order, including subheadings, as they do in Citavi Desktop.
  Citavi Picker
  - The Citavi Picker works again in Chrome. ISBNs and DOIs on a page are recognized, and clicking the Picker symbol opens the panel as expected.
  - References can be imported from search-result and listing pages again. The Picker panel previously stopped responding.
  - In Chrome, clicking the Picker symbol while a PDF is open offers to import the PDF. Chrome no longer exposes its built-in PDF viewer to extensions, so the Picker now recognizes a PDF by its address and content type.
  - ScienceDirect references can be imported again in Firefox, including from Google Scholar results.
  - The Picker extension icon has been updated to the current Citavi branding.
  Citavi Database Server
  - The Citavi DBServer Manager application uses the current Citavi icon, matching Citavi Desktop.
