ShortDescription: Quick desktop viewer for NumPy .npy and .npz files, with image, histogram, line plot and table views. For Windows, Linux and macOS.
Description: |-
  npyquick is a small, practical viewer for inspecting NumPy .npy and .npz array files without writing a notebook or launching a full IDE. Open files from the terminal or the file manager and inspect common scientific data layouts immediately. It provides several views chosen automatically from the array:

  - Image view for 2D grayscale and RGB arrays, with zoom, pan, colormap and brightness control, and a draggable cross-section profile.
  - Histogram view with linear or log-scaled counts, robust range selection, and NaN / Inf reporting.
  - Line plot view for 1D signals and paired (x, y) arrays.
  - Table view as a fallback for higher-dimensional, scalar, or empty arrays.
