ReleaseNotes: 'Each Cursor account now keeps its own sign-ins for MCP servers connected through npx mcp-remote, such as Atlassian (Jira and Confluence). Before, they shared one login across all your accounts. After updating, sign in to those MCP servers once more in each account, and quit and reopen your Cursor account windows. Sessions Pro for Cursor now also updates itself: it tells you when a new version is out and installs it in one click.'
