ShortDescription: Run several Cursor accounts side by side, each in its own window with its own sign-in.
Description: |-
  Sessions Pro for Cursor opens each of your Cursor accounts (work, personal, a client) in its own Cursor
  window, so you do not have to sign out and back in to switch. Every account keeps its own sign-in, chats,
  settings and extensions, each window is titled with its account name, and a tray icon switches between them.
  It needs Cursor installed. All features work during a free 1-hour preview that starts once an account signs
  in to Cursor; after that a one-time license is needed.
  Independent app, not affiliated with Anysphere, Inc.
