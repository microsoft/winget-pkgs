ShortDescription: Run several ChatGPT and Codex accounts side by side in the ChatGPT desktop app, each in its own window with its own login.
Description: |-
  Sessions Pro for Codex opens each of your ChatGPT accounts (work, personal, a client) as its own copy of the
  ChatGPT desktop app, so you do not have to sign out and back in to switch. Every account keeps its own login,
  chats, Codex threads, projects and Codex command line, and each window is titled with its profile name.
  It needs the ChatGPT desktop app (with Codex) installed. All features work during a free 1-hour preview that
  starts once a profile is signed in; after that a one-time license is needed.
  Independent app, not affiliated with OpenAI.
