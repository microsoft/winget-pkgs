ShortDescription: 'Free, open-source Hi-Res music player: bit-perfect playback, native DSD, DLNA'
Description: |-
  RustMusic is a free, open-source desktop music player built for audiophiles.
  It plays FLAC, ALAC, WAV, AIFF, MP3 and DSD (DSF/DFF) files with bit-perfect exclusive output (WASAPI), native DSD over DoP, gapless playback and ReplayGain.
  It manages large libraries with a tag workshop (MusicBrainz and Deezer lookups), synced lyrics and a built-in DLNA server, plays to UPnP/DLNA and AirPlay devices, and can act as a remote for Onkyo, Pioneer and Integra amplifiers.
