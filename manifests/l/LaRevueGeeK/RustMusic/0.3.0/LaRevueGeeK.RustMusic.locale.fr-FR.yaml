PackageLocale: fr-FR
Publisher: LaRevueGeeK
PackageName: RustMusic
License: GPL-3.0
ShortDescription: 'Lecteur de musique Hi-Res libre et gratuit : lecture bit-perfect, DSD natif, DLNA'
Description: |-
  RustMusic est un lecteur de musique libre et gratuit, pensé pour les audiophiles.
  Il lit les fichiers FLAC, ALAC, WAV, AIFF, MP3 et DSD (DSF/DFF) avec une sortie exclusive bit-perfect (WASAPI), le DSD natif en DoP, l'enchaînement sans blanc et le Replay Gain.
  Il gère les grandes bibliothèques avec un atelier de tags (MusicBrainz et Deezer), les paroles synchronisées et un serveur DLNA intégré, lit sur les appareils UPnP/DLNA et AirPlay, et pilote les amplis Onkyo, Pioneer et Integra.
