PackageIdentifier: lollipopkit.serverbox
PackageVersion: 1.0.1962
PackageLocale: zh-CN
ShortDescription: 服务器状态与工具箱，内置 SSH 终端、SFTP 和容器管理
Description: ServerBox 通过 SSH 或 monitor 代理监控服务器，并在一个应用中提供终端、SFTP 文件管理、容器、进程和服务管理、虚拟化（libvirt、Proxmox VE）以及远程桌面。
Tags:
- sftp
- ssh
- 服务器
- 监控
- 终端
ReleaseNotes: |-
  新增
  Section titled “新增”
  - App 与 Monitor 的 MCP 服务：App 内置本地 MCP 服务器，可对外提供主机与设置能力；Monitor 新增带 API Token 认证及按 IP / Token 限流的 MCP 端点。
  - 扩展 BMC（Redfish）管理：支持读取与清空事件日志、查看硬盘列表与故障预测状态、设置启动项覆盖、挂载与弹出虚拟介质，以及开关定位指示灯。
  - SSH Agent 与跳板机连接复用：支持使用本机 ssh-agent 密钥认证、向终端会话转发 SSH Agent，以及通过跳板机已有的 OpenSSH ControlMaster 建立连接。
  - Agent 敏感信息脱敏：在 Agent 将上下文发送给模型前，自动脱敏密钥、Token 和密码等敏感信息。
  - Monitor 备用地址与分设备历史指标：支持为 Monitor 连接配置备用地址，并按自定义时间范围查询各设备的历史指标。
  - 服务器状态分享与 Swap 分区详情：支持将服务器状态生成海报图片或文本分享；展示每个 Swap 分区的大小、占用与优先级。
  变更
  Section titled “变更”
  - macOS 统一为非沙盒版本：停止 Mac App Store 沙盒版构建并移除相关分支与提示。
  - iOS 本地 Linux 环境迁移至新的用户态引擎（iul）。
  - 交互统一与优化：全应用弹窗统一为底部面板；各处改用支持搜索、标签筛选和排序的统一服务器选择器；底部导航栏按窗口宽度自适应显示标签数量。
  - Agent 对话：折叠展示工具调用，并优化流式输出时的滚动跟随。
  - 增强本地数据库向前兼容能力：旧版本可打开其能识别的新 schema 数据库。
  - 升级至 Flutter 3.50。
  修复
  Section titled “修复”
  - 支持从 hwmon 读取 CPU 温度，不再仅依赖 thermal zones。
  - 修复断连后 Agent 回复丢失的问题，并在 iOS 上申请后台时间以完成回复。
  - 修复 Redfish 重复返回同一虚拟介质槽位时界面显示重复项的问题。
  - 修复非正方形发行版图标导致列表标题未对齐的问题。
  - 避免后台同步与关闭连接阻塞页面退出。
  - 修复路由切换时主题背景闪烁或消失的问题。
  - 修复终端屏幕常亮未遵循设置的问题。
