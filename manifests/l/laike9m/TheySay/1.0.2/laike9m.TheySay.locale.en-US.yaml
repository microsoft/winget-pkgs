ReleaseNotes: |-
  TheySay v1.0.2
  Multi-column desktop dashboard for monitoring Twitter / X accounts, Threads profiles, and Discord channels side by side in real time.
  Bug Fixes & Improvements
  - Fix Twitter / X login redirect loop & Google OAuth sign-in (#4):
    - Replaced hardcoded legacy Chrome 131 User-Agent strings with a runtime-matched Chrome User-Agent derived from Electron's native Chromium version across all sessions, login windows, OAuth popups, and background webviews.
    - Aligned outgoing Sec-CH-UA Client Hints headers, disabled Blink AutomationControlled, and added main-world navigator.userAgentData / window.chrome compatibility so Google OAuth (accounts.google.com) and X password/SSO login flows complete cleanly without triggering browser verification loops or BotGuard blocks.
  - CI: Added Linux (ubuntu-latest + Xvfb) end-to-end Electron integration tests alongside Windows (windows-latest).
