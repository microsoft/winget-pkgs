ReleaseNotes: |-
  TheySay v1.1.0
  Multi-column desktop dashboard for monitoring Twitter / X accounts, Threads profiles, and Discord channels side by side in real time.
  Features & Improvements
  - Unlimited Local Message History (better-sqlite3 SQLite Persistence):
    - All scraped tweets, Threads posts, and Discord messages are now stored indefinitely in a local SQLite database (theysay.db in WAL mode) without 20/40-message truncation.
    - Seamless automatic one-time migration from legacy localStorage caches; switching accounts, handles, or profiles preserves every archived message.
  - Interactive 4×4 Grid Layout Picker, Asymmetric Layouts & Card Close:
    - Replaced fixed presets with a Google Docs-style 4×4 visual grid picker supporting all 16 rows × cols combinations (1×1 through 4×4).
    - Added per-card close (×) buttons and upward top-edge resize handles (n / nw) so you can craft and persist custom asymmetric layouts.
  - Horizontal Block-Swap Dragging:
    - Dragging a card horizontally (including taller 2×1 / 3×1 cards onto stacked 1×1 cards, shorter cards onto taller cards, or wide 2×2 cards) now swaps matching horizontal card blocks directly into each other's positions instead of pushing cards vertically up or down.
  - Multi-Step Layout Undo & Redo:
    - Press Cmd+Z / Ctrl+Z to step back up to 50 layout changes (drags, resizes, card closes, grid preset switches, and profile imports), and Cmd+Shift+Z / Ctrl+Shift+Z / Ctrl+Y to redo.
  - Super Follow Detection & In-App X Article Reading:
    - Added structural creator-subscription / member-only tweet detection and an in-app detail modal that hydrates full long-form Super Follow posts and X Articles with inline charts directly inside TheySay.
  - Link Title Resolution Improvements:
    - Rejects 404/error webpage titles and adds a reliable X status title fallback.
ReleaseNotesUrl: https://github.com/laike9m/TheySay/releases/tag/v1.1.0
