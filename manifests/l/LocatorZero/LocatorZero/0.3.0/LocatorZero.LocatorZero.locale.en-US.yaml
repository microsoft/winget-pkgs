ShortDescription: Find any file, folder, web page or open tab by name, and free up space from duplicates. Private and offline.
Description: |-
  LocatorZero answers one question: where does it live? Type a few letters and see every place a file, folder,
  web page or open tab lives: this computer, USB, external and network drives, cloud folders and every browser.
  It asks before it searches each place, never connects to the internet, and keeps no copy of what it finds.
  Deleted something by mistake? Search the Recycle Bin by name and restore it, after you confirm.
  Clean up finds duplicate and large files, shows every copy on a map, and moves the extras to the Recycle Bin
  only after you confirm.
ReleaseNotes: Recycle Bin search with Restore (asks first, never overwrites). Kind chips with counts and grouping by type, place or folder. Search filters (ext:, size:, modified:, type:). Connected drives with free space. Ctrl+Shift+Space opens LocatorZero from any app.
