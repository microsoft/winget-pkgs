PackageIdentifier: Leochens.DomainBuddy
PackageVersion: 0.1.0
PackageLocale: en-US
ShortDescription: A local, cross-platform DNS management desktop app that brings domains and DNS records from multiple cloud providers into one interface.
Description: Domain Buddy is a local, cross-platform DNS management desktop application. It consolidates domains and DNS records from multiple cloud providers into a single interface, with support for DNSPod, Cloudflare, Volcano Engine DNS, and Aliyun DNS — a fit for individual developers and small teams who use several DNS services and do not want to switch consoles constantly. Sensitive credentials are kept in the operating system credential store, and DNS requests go directly to each provider's official HTTPS endpoints.
