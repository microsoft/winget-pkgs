ShortDescription: 本地运行的多平台域名解析管理桌面应用，将多家云服务商的域名与解析记录集中到一个界面中管理。
Description: Domain Buddy 是一个本地运行的多平台 DNS 管理桌面应用。它把多个云厂商的域名与解析记录集中到一个界面中，支持 DNSPod、Cloudflare、火山引擎 DNS 与阿里云 DNS，适合同时使用多家 DNS 服务、又不想频繁切换控制台的个人开发者和团队。敏感凭据保存在操作系统凭据库中，DNS 请求直接发往各服务商的官方 HTTPS 接口。
