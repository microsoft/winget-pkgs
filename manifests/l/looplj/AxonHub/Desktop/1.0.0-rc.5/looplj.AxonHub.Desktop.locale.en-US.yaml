ShortDescription: The desktop edition of AxonHub, an all-in-one AI gateway and development platform.
Description: |-
  AxonHub Desktop is the desktop edition of AxonHub, an all-in-one AI development platform that provides a unified API gateway, project management, and comprehensive development tools. The desktop app bundles the AxonHub server and its management panel, so you can run the platform locally and manage API keys, channels, and models from a single window.
  Core features:
  1. Unified API: OpenAI- and Anthropic-compatible interface with automatic API translation lets you use one API format to access any supported model provider.
  2. Tracing / Threads: Thread-aware tracing captures full request timelines for deep observability and faster debugging.
  3. Fine-grained Permission: RBAC-based policies help teams govern access, usage, and data segregation precisely.
  4. Adaptive Load Balancing: Intelligent multi-strategy load balancing automatically selects optimal AI channels based on health, performance, and session consistency.
  5. Desktop panel: Manage keys, channels, and models directly from the desktop application.
