PackageVersion: 1.0.0-rc.4
PackageLocale: zh-CN
ShortDescription: AxonHub 桌面版，集 AI 网关与开发平台于一体。
Description: |-
  AxonHub Desktop 是 AxonHub 的桌面版本。AxonHub 是一个 All-in-one AI 开发平台，提供统一的 API 网关、项目管理和全面的开发工具。桌面应用内置 AxonHub 服务器与管理面板，可在本地运行平台，并在同一个窗口中管理 API 密钥、渠道与模型。
  核心特性：
  1. 统一 API Unified API：兼容 OpenAI 与 Anthropic 的接口，配合转换管线实现模型互换与映射，无需改动现有代码。
  2. 追踪 / 线程 Tracing / Threads：线程级追踪实时记录完整调用链路，提升可观测性与问题定位效率。
  3. 细粒度权限 Fine-grained Permission：基于 RBAC 的权限策略，帮助团队精细管理访问控制、配额与数据隔离。
  4. 自适应负载均衡 Adaptive Load Balancing：智能多策略负载均衡，自动选择最优 AI 渠道，确保高可用性和最佳性能。
  5. 桌面面板：直接在桌面应用中管理密钥、渠道与模型。
