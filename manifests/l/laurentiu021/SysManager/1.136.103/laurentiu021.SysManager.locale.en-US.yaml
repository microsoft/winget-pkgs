ReleaseNotes: |-
  [1.136.103] - 2026-11-03
  Recent Changes leaves out a failed install on Windows in any language, and keeps updates with their own program.
  Fixed
  - On Windows in any display language but English, Recent Changes listed a Windows Installer install or removal that
    failed as a program installed or removed. It read the status from the record's message, which is in the display
    language, and took a message it could not read for a success. It now reads the status from the values Windows puts
    into the message, the same in every language, and leaves out a record whose status cannot be read.
  - Recent Changes paired an updated program with the first removed one of the same publisher and the same name once
    every number was taken out. Two versions of one program side by side, updated together, could each be listed as an
    update of the other, and two programs whose names differ by a number, a game and its sequel, were one program
    updated. An update now replaces an old name with its version numbers in the same places, the closest version among
    several, and a tie is listed as an install and a removal rather than guessed. Both were there since the tab first
    shipped, in 1.125.0.
  Verify the download
  Get-FileHash .\SysManager-v1.136.103.exe -Algorithm SHA256
  Expected SHA256: BD8A6FAE415346821DC60C02E12CF5F214B6D8F7CDB2FBE793B9EABB08A8CBE8
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Code signing is planned through the SignPath Foundation,
  which provides free certificates to open-source projects, with signing performed by
  SignPath.io. Until then, the SHA256 above and the build
  attestation below are what establish that a download is the genuine build.
  Code signing policy
  This release is not code-signed. The team roles, release-approval process and
  privacy policy required by the SignPath Foundation programme
  are documented in advance under Code signing
  policy. That
  documentation is a prerequisite for applying, not evidence of a certificate. The
  attribution line naming SignPath as the signing provider will appear here once a
  certificate is actually issued.
  This program will not transfer any information to other networked systems unless
  specifically requested by the user or the person installing or operating it. Two checks
  run on their own when SysManager starts: the version check against the GitHub Releases
  API, at most once a day, and the Dashboard's app-updates alert, which asks winget. The
  About tab can switch off either. Everything else that uses the network runs only when you
  use it. Full
  privacy policy.
