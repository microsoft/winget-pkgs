ReleaseNotes: |-
  [1.65.3] - 2026-08-13
  The app does a little less work before its window appears. Four of the Network tabs were being built at launch even if you never opened them, and one of them read a file from disk every single time.
  Fixed
  - Ping, Traceroute, Speed Test and Network Repair were prepared at every launch. Every other tab waits until you open it — that change was made precisely so starting the app does not run forty tabs' worth of setup first. These four had been left out, and Speed Test's setup reads your saved speed-test history from disk, so that read happened on every start whether or not you ever visited the tab. They now load on first open like the rest.
  - Each of those four tabs was being created twice. The app builds its parts through a shared registry, but these four were also constructed by hand next to it — so two copies of each existed and the registered ones were never used. There is now one of each.
  Verify the download
  Get-FileHash .\SysManager-v1.65.3.exe -Algorithm SHA256
  Expected SHA256: 9D14EE423BA8B190706757259690B0438A9D1FA2928577388B299C9E33E87CE9
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Code signing is planned through the SignPath Foundation,
  which provides free certificates to open-source projects, with signing performed by
  SignPath.io. Until then, the SHA256 above and the build
  attestation below are what establish that a download is the genuine build.
  Code signing policy
  This release is not code-signed. The team roles, release-approval process and
  privacy policy required by the SignPath Foundation programme
  are documented in advance under Code signing
  policy. That
  documentation is a prerequisite for applying, not evidence of a certificate. The
  attribution line naming SignPath as the signing provider will appear here once a
  certificate is actually issued.
  This program will not transfer any information to other networked systems unless
  specifically requested by the user or the person installing or operating it. Full
  privacy policy.
