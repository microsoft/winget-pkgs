ReleaseNotes: |-
  [1.57.3] - 2026-08-06
  Fixed
  - Bulk Installer now explains why an install failed. It wrote things like "Failed (exit 1618)" into the row, or the raw Windows error text — neither of which tells you what to do. The same numbers were already being translated into plain sentences on the Uninstaller tab, so that translation is now shared: "Another installation is already in progress — wait for it to finish and try again", "Access denied — retry and accept the installer's Windows UAC prompt", and so on. If a PC does not have App Installer at all, all three app tabs now say so in the same words instead of one of them showing an internal error.
  - Switching the Bandwidth Monitor chart between ranges no longer risks an error. Changing the range while another change was still loading could have both of them redraw the graph at the same time, which could fail instead of drawing. Only one redraw runs at a time now.
  Verify the download
  Get-FileHash .\SysManager-v1.57.3.exe -Algorithm SHA256
  Expected SHA256: EA6CCBB0CEA7CF2F3B3ED79557384FE5C2C46E885386342B984DB7FF49D133E5
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.57.3.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.57.3.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
