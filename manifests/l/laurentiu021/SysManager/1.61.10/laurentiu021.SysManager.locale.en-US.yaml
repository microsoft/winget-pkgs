ReleaseNotes: |-
  [1.61.10] - 2026-08-11
  The Services tab can now actually filter by the things it always claimed to — including the gaming
  recommendations, which are the reason the list is more useful than the one in Windows.
  Fixed
  - Five of the Services tab's nine filters had no button. Filtering by status (Running / Stopped) and by gaming recommendation (Safe to disable / Keep enabled / Advanced) was fully written and working, but nothing on screen could select it — the only chips were Safe, Caution, Critical and All, so those five could be reached only from a debugger. The README promised both anyway: "filter by status (Running/Stopped) … gaming recommendation". All nine are now chips, grouped under Safety / Status / For gaming so the two different meanings do not get confused: safety answers "will turning this off break Windows", the gaming recommendation answers "is it worth turning off for games". Each chip shows how many services it matches, so you can tell before pressing it, and the row reflows on a narrow window instead of clipping.
  - The "N services (M running)" line could disagree with the list under it. Those two numbers were recalculated only by a full refresh, while everything else on the tab recalculated on every search keystroke and every filter press. So after typing in the search box, the header still described the previous scan. Every count on the tab is now worked out in one place, at the same moment.
  Verify the download
  Get-FileHash .\SysManager-v1.61.10.exe -Algorithm SHA256
  Expected SHA256: 0EF48946D817378DA242EADB87552F99EFA0529F4C02B8F081B2C491EEE290DC
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Code signing is planned through the SignPath Foundation,
  which provides free certificates to open-source projects, with signing performed by
  SignPath.io. Until then, the SHA256 above and the build
  attestation below are what establish that a download is the genuine build.
  Code signing policy
  Free code signing provided by SignPath.io, certificate by
  SignPath Foundation. Team roles, the release-approval process
  and the privacy policy are documented under Code signing
  policy.
  This program will not transfer any information to other networked systems unless
  specifically requested by the user or the person installing or operating it. Full
  privacy policy.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.61.10.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.61.10.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
