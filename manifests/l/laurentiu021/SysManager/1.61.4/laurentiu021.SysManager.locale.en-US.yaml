ReleaseNotes: |-
  [1.61.4] - 2026-08-11
  The Tune-Up card no longer shows a drive as plainly "Healthy" while the headline above it warns
  you about that same drive.
  Fixed
  - Quick Tune-Up showed the wrong wording for each drive. The per-drive line in the Tune-Up result showed a bare status word — "Healthy", "Warning" — instead of the full plain-English summary the rest of the app shows, such as "Healthy — 38 °C · wear 2% · 4210 h on". On a drive that genuinely needed attention that produced an amber "1 recommendation" heading sitting directly above a row reading simply "Healthy", so the card contradicted itself. It now shows the same sentence everywhere, which is also the text the colour beside it was always derived from.
  - Running the project's own tests rewrote your "check for updates at startup" setting. This affects only people who build and test SysManager themselves, not normal use. The About tab remembers whether you want the startup version check, and the tests had no way to point that at a scratch folder — so every test that built the About tab wrote to your real setting file. That is the same problem fixed for four other files in 1.60.1, 1.61.1 and 1.61.2, arriving through the one route those fixes did not cover. Fixed the same way, plus a test that fails if it ever comes back.
  Verify the download
  Get-FileHash .\SysManager-v1.61.4.exe -Algorithm SHA256
  Expected SHA256: DD1FF34D517A8C0861AE23923761C410B6BA762DB5D7A25F91A308130C977EBA
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Code signing is planned through the SignPath Foundation,
  which provides free certificates to open-source projects, with signing performed by
  SignPath.io. Until then, the SHA256 above and the build
  attestation below are what establish that a download is the genuine build.
  Code signing policy
  Free code signing provided by SignPath.io, certificate by
  SignPath Foundation. Team roles, the release-approval process
  and the privacy policy are documented under Code signing
  policy.
  This program will not transfer any information to other networked systems unless
  specifically requested by the user or the person installing or operating it. Full
  privacy policy.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.61.4.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.61.4.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
