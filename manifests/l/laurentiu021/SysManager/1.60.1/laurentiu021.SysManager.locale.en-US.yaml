ReleaseNotes: |-
  [1.60.1] - 2026-08-10
  Running the project's own test suite no longer overwrites your choice about whether app
  icons may be fetched from the web.
  Fixed
  - The test suite quietly changed one of your settings. In the Bulk Installer you can allow app icons to be loaded from the web — off unless you turn it on, because the app is local-first. That choice lives in a small file in your profile, and the project's automated tests were writing to that file rather than a scratch copy: five of them flip the setting while checking the download behaves correctly. So running the tests left the setting at whatever the last one happened to set, and the value you had picked was gone. Nothing about the app itself was wrong — but if you build and test SysManager yourself, this was silently editing your own configuration, and the same tests could also write into your real icon cache. Both now use a temporary folder.
  Verify the download
  Get-FileHash .\SysManager-v1.60.1.exe -Algorithm SHA256
  Expected SHA256: 68CAB08F65751E2B68F5CE75D9B81363F6626A497C161758465BC2CA436DF6DD
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.60.1.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.60.1.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
