ReleaseNotes: |-
  [1.58.0] - 2026-08-10
  Added
  - You can now turn off the version check that runs when SysManager starts. There is a new checkbox on the About tab — "Check GitHub for a new version when SysManager starts". It is on by default, because that check is how you hear about a fix, but it is now yours to switch off. When it is off, nothing goes out until you press "Check for updates" yourself. Either way, nothing about you or your PC is ever sent: SysManager only asks GitHub's public releases page which version is newest.
  Changed
  - That check now runs at most once a day instead of on every launch. Opening and closing SysManager a few times used to ask GitHub twice each time, which could hit the limit GitHub allows for anonymous requests — after which the About tab reported an error for no real reason. Pressing "Check for updates" or "Retry" still asks immediately, every time.
  Verify the download
  Get-FileHash .\SysManager-v1.58.0.exe -Algorithm SHA256
  Expected SHA256: 6F3C7D64C104A86F2D0B93A4BF7B17B092C49A6B3AA8757106FA9A5A6D693CF1
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.58.0.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.58.0.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
