ReleaseNotes: |-
  [1.57.5] - 2026-08-06
  Fixed
  - Closing SysManager to the tray now actually stops it working in the background. Closing the window hides it rather than quitting — that is the default — but whichever tab was open kept checking your PC once a second for as long as it stayed on: re-listing every running process, or re-measuring network traffic and writing it to disk. Nothing was on screen to show it. Those checks now stop when the window is hidden or minimised and pick up again when you bring it back, so a PC left on all day is no longer doing invisible work. The background recording that is meant to keep running while hidden — the resource history graph, and the dark-mode schedule — is untouched.
  Verify the download
  Get-FileHash .\SysManager-v1.57.5.exe -Algorithm SHA256
  Expected SHA256: CD1CAFA411A34B952F7E24F60B21DCC949E5B33B05569C9CAC099CE402F73C9C
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.57.5.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.57.5.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
