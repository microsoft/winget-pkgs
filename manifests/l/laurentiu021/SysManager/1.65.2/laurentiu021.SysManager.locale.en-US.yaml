ReleaseNotes: |-
  [1.65.2] - 2026-08-13
  Sizes and counts now use the same decimal point everywhere in the app. If your Windows is set to a language that writes numbers with a comma — Romanian, German, French, Finnish and most of Europe — the same screen could show "1.5 GB" in one place and "1,5 GB" right next to it.
  Fixed
  - Two different decimal marks on one screen. A previous release made the shared size and speed formatter always use a point, but the numbers written directly into sentences still followed the Windows regional setting. On a comma locale that produced a visible mismatch — a size from one code path and a boot time from another, side by side, punctuated differently. Boot times, disk sizes, memory figures, download speeds, VRAM, drive temperatures, the tray tooltip and the exported system report all now match.
  - Thousands were grouped differently depending on the language. A file count of 1610 was shown as "1,610", "1.610" or "1 610" depending on the regional setting, and the space variant is a non-breaking space that does not survive a copy-paste. Counts in Deep Cleanup, Disk Analyzer, Duplicate Finder, Browser Cleaner, the Shortcut Cleaner, the Uninstaller and the File Shredder are now consistent, including in the activity log they write.
  Verify the download
  Get-FileHash .\SysManager-v1.65.2.exe -Algorithm SHA256
  Expected SHA256: 02B3223930D7217915D31D0019C9E5E40F0429B1AB414B7844A9627B0AFAC682
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Code signing is planned through the SignPath Foundation,
  which provides free certificates to open-source projects, with signing performed by
  SignPath.io. Until then, the SHA256 above and the build
  attestation below are what establish that a download is the genuine build.
  Code signing policy
  This release is not code-signed. The team roles, release-approval process and
  privacy policy required by the SignPath Foundation programme
  are documented in advance under Code signing
  policy. That
  documentation is a prerequisite for applying, not evidence of a certificate. The
  attribution line naming SignPath as the signing provider will appear here once a
  certificate is actually issued.
  This program will not transfer any information to other networked systems unless
  specifically requested by the user or the person installing or operating it. Full
  privacy policy.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.65.2.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.65.2.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
