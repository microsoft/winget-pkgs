ReleaseNotes: |-
  [1.58.3] - 2026-08-10
  Fixed
  - The Traceroute tab no longer lies about whether it is running. Ping and Traceroute look like two separate tabs with their own Start and Stop buttons, but behind them sits one shared monitor. So pressing Stop on Ping silently killed a running auto-trace while Traceroute still showed "Stop auto-trace" and claimed it was running — and pressing Start on Ping quietly began tracing every target while Traceroute still offered to start it. Both tabs now read the same state, so whichever one you use, the other tells you the truth.
  Verify the download
  Get-FileHash .\SysManager-v1.58.3.exe -Algorithm SHA256
  Expected SHA256: FCA846DB53DCD88E9BFA2CA261A0168222AB01A02C56D6F5B52BB24CB8C84874
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.58.3.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.58.3.sbom.json, a CycloneDX inventory of
  every dependency resolved for this build.
