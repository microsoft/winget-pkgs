ShortDescription: Wi-Fi scanner with channel, signal and security analysis.
Description: |-
  LV24 WiFi Explorer scans nearby Wi-Fi networks and explains what they mean:
  per-channel occupancy, signal history, overlapping BSSes, security mix and
  actionable diagnostics. Snapshots can be saved, compared and exported.
  The desktop app runs on macOS, Windows and Linux; the core, backend and CLI
  are published as MIT-licensed npm packages.
