ReleaseNotes: |-
  Win 顺 0.14.0：搜 WSL、保留图片原格式和 GIF 动图、备份设置换电脑，拖放圆盘改为按键呼出。WinShun 0.14.0: search WSL, keep original image formats and animated GIFs, move settings to another PC, and open the drop ring with a key.
  新功能 · What's new
  - 🐧 WSL 文件搜索：设置 › 搜索范围 › 网络与 WSL，选择 Linux 发行版的用户目录、项目文件夹或粘贴路径。文件名、拼音和首字母一起搜；发行版停止时保留已有结果，恢复运行后自动更新。
    WSL file search: add a home or project folder under Settings › Search scope › Network & WSL. Search names and pinyin alongside local files. Indexed results remain available while a distribution is stopped and update when it runs again.
  - 🔍 搜索范围和类型可配置：可以选择收录的磁盘或文件夹、自定义文件类型筛选，设置程序优先显示的扩展名；搜索结果可分别显示或隐藏修改日期和文件大小。收藏文件夹可选择用 Tab 进入，默认仍切换范围。
    Choose what to search and show: select disks or folders, customize file type filters and preferred application extensions, and toggle modification dates and file sizes independently. Tab can enter a favorite folder; scope switching remains the default.
  - 📋 保留图片原格式和 GIF 动图：剪贴板记录可保留 PNG、JPEG、GIF 的原始数据，GIF 在预览里播放；拖出、粘贴到文件夹或通过 MCP 读取时沿用保存的格式。只有位图数据时仍保存为 PNG。
    Original images and animated GIFs: clipboard entries retain PNG, JPEG and GIF data, with animated previews. Dragging out, pasting into a folder and MCP reads preserve the saved format; bitmap-only copies are stored as PNG.
  - 🧳 备份导出与换电脑恢复：设置 › 高级 › 备份，导出 ZIP，在新电脑上从备份恢复；不必先开启自动备份。恢复前检查备份内容并保存当前配置，恢复失败时回滚。插件密码需重新填写，自定义路径请检查是否适用于新电脑。
    Export and restore settings: export a ZIP under Settings › Advanced › Backup and restore it on another PC without enabling automatic backups first. Contents are validated and current settings saved before restoring, with rollback on failure. Re-enter plugin secrets and check machine-specific paths afterward.
  - 🎯 拖放圆盘改为按键呼出：按住文件或拖着文件时按 Esc 下方的反引号键（`），常用文件夹围在指针周围，朝目标拖动即可放入；不再依赖晃动文件。收藏文件夹的名称会随圆盘布局避让。
    A key opens the drop ring: while holding or dragging files, press the backtick key below Esc. Favorite folders appear around the pointer; drag toward a destination. The shake gesture is replaced by this explicit shortcut.
  - 📄 复制的内容直接存成文件：资源管理器里的“粘贴为文件”支持文字、图片和文件内容，也可以在设置里配置这项功能。
    Paste as a file in Explorer: save copied text, pictures or files directly from a folder, with configuration in Settings.
  - ✏️ 更灵活的截图标注：新增曲线和可编辑路径，支持调整节点；荧光笔可选不同绘制模式，标注保存后还可以重新编辑。
    More flexible screenshot annotations: curves and editable paths with adjustable nodes, plus highlighter drawing modes. Saved annotations can still be reopened for editing.
  - 🧩 现有社区插件库：设置 › 插件 › 插件库连接 WinShun-plugins，可安装和更新社区插件，也提供创建插件和 AI 开发提示入口。
    Community plugin library: Settings › Plugins › Plugin library uses the existing WinShun-plugins repository, with installation, updates, plugin templates and development prompts.
  修复与改进 · Fixes and improvements
  - 修复搜索框、对话框旁搜索条在显示器或窗口切换后偶尔只剩图标的问题；复用窗口时等待首帧绘制完成再显示，诊断日志补充显示器和字体状态。
    Fix intermittent icon-only launcher and dialog search windows after display or window changes; reused windows wait for their first frame, and diagnostics include display and font state.
  - 剪贴板窗口隐藏后释放空闲预览和识别资源；改进图片方向、尺寸和格式校验，限制过大图片的解码。
    Release idle clipboard preview and recognition resources when hidden; improve image orientation, size and format checks and bound oversized image decoding.
  - 改进网络路径、WSL 路径和链接文件夹的收录与查询；更新中英文说明及设置文案。
    Improve indexing and queries for network paths, WSL paths and linked folders; update Chinese and English documentation and settings text.
