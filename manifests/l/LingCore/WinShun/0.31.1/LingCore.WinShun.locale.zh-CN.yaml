ReleaseNotes: |-
  Win 顺 0.31.1 修好了界面字体选“霞鹜文楷”常规体不生效的问题，并让诊断日志在截图卡住时记下原因。
  新功能 · What's new
  - 🔤 界面字体：霞鹜文楷常规体可以用了 在 设置 › 外观 选“霞鹜文楷”，以前预览不对、重启后是别的字体，现在就是它。原因是这个字体文件里的名字写法特殊，Win 顺 按名字找不到它；现在改为直接找到字体文件加载。同样的问题还影响 Windows 单独列出的字重（Noto Sans SC Medium、Bahnschrift Light、Cascadia Code SemiBold 等），以前选了不生效，现在都能用（#325）。
    Interface font: LXGW WenKai regular works Choosing 霞鹜文楷 in Settings › Appearance gave a wrong preview and another font after a restart. The font file names itself in an unusual way and WinShun could not find it by name; it is now loaded from its file. The same went for weights that Windows lists on their own (Noto Sans SC Medium, Bahnschrift Light, Cascadia Code SemiBold…): they had no effect before and now work (#325).
  改进与修复 · Improvements and fixes
  - 截图卡住时记下原因：有用户遇到按下截图键后黑屏或卡一两秒。原因还没找到，这一版先让诊断日志在卡住的那一刻记下程序正在做什么（需要把“截图与录屏”插件更新到 1.1.17）。再遇到时，到 设置 › 高级 › 诊断日志 导出诊断日志发给我们即可。
    Capture stalls are recorded with their cause: some users see a black screen or a stall of a second or two after the capture key. The cause is not known yet; from this version the diagnostics record what the program was doing at that moment (update the Screenshot and recording plugin to 1.1.17). If it happens again, export the diagnostics in Settings › Advanced › Diagnostics and send them to us.
  - 主程序的“界面卡住”记录现在带上系统函数的名字，更容易看出卡在哪。
    The main program's record of an interface that stopped answering now names the system call it was in.
