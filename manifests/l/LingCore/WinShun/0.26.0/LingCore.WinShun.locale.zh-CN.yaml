ReleaseNotes: |-
  Win 顺 0.26.0 让应用可以排成一屏图标来挑：打开“应用”标签，常用的、收藏的或全部应用一格格列出来。新的云备份插件把设置自动传到 WebDAV 或 GitHub 私有仓库；ArcGIS“添加数据”这类程序自己画的选文件窗口，教一次就能用搜索框和 Ctrl+G；资源管理器标签页会在下次登录后打开上次的标签页。闲置很久再按快捷键也立刻出来，安装和更新在文件被别的程序占着时不再卡住。另外修复设置窗口最大化后发黑、搜索框不接收输入、Directory Opus 菜单里按键变成搜索等问题。 WinShun 0.26.0 can lay the apps out as a screen of icons: turn on the Apps tab for the most used, the favorites or all of them. A new Cloud Backup plugin keeps the settings on a WebDAV server or in a private GitHub repository; a file window a program draws itself, like ArcGIS's "Add Data", takes the search bar and Ctrl+G once it has been shown to WinShun; Explorer tabs brings the tabs from last time back after a logon. The box appears at once however long WinShun sat idle, and an install or update no longer stalls on files another program holds. Fixes include the settings window going black when maximized, the box taking no letters, and a key in a Directory Opus menu starting a search.
  新功能 · What's new
  - 📱 “应用”标签 在 设置 › 结果列表 打开“显示‘应用’标签”，范围标签的最后多一个“应用”：应用排成图标网格，搜索框下面选看常用的、收藏的还是全部（Ctrl+Tab 切换，会记住）。方向键选、Enter 打开，打字照样按名字、拼音、首字母找；鼠标移到图标上点星标就收藏。默认关着（感谢 @w3c0929，#296）。
    Apps tab "Show the Apps tab" under Settings › Result list adds a last scope, Apps: a grid of icons, with chips under the box for the most used, the favorites or all of them (Ctrl+Tab, remembered). Arrows pick, Enter opens, and typing matches by name, pinyin and initials; the star on a hovered tile keeps it as a favorite. Off by default (thanks to @w3c0929, #296).
  - ☁️ 云备份插件 没有同步网盘、只有一个 WebDAV 地址（坚果云、Nextcloud、NAS）或 GitHub 私有仓库时，从插件库装“云备份”：填好地址和账号，设置变了自动上传，每处保留最近 10 份。换电脑时输入 cloud，在一份备份上按 Enter 再确认一次就恢复。密码存在 Windows 凭据管理器里；公开仓库不会上传（#276）。
    Cloud Backup plugin For a WebDAV address (Nextcloud, a NAS, 坚果云) or a private GitHub repository instead of a synced folder: install Cloud Backup from the plugin library and fill in its card. Changed settings are uploaded by themselves, the last 10 kept at each place; on another PC type cloud and press Enter on a backup, then once more, to restore it. Passwords stay in Windows Credential Manager, and nothing is uploaded to a public repository (#276).
  - 🪟 程序自己画的选文件窗口 有的软件选文件用的不是 Windows 的“打开”“另存为”，而是自己画的窗口（比如 ArcGIS 的“添加数据”）。先打开那个窗口，到 设置 › 打开 Win 顺 › 对话框 › 程序自己的选文件窗口 点“识别窗口”，五秒内切回去、把光标点进填文件名的框。之后搜索框、Ctrl+G 和自动转过去在它上面一样能用。规则存在数据文件夹的 dialogs.json 里，可以自己改。前提是那个窗口本来就能“粘一条路径、回车就过去”；本机没有 ArcGIS，这一条是用替身窗口验证的（#272）。
    File windows programs draw themselves Some programs pick files in a window of their own instead of a Windows dialog (ArcGIS's "Add Data"). Open it, click "Learn a window" under Settings › Open WinShun › Dialogs, and within five seconds switch back and click into the box that takes the file name. From then on the search bar, Ctrl+G and going there by itself work on it. The rules live in dialogs.json in the data folder. It needs a window that already goes to a path typed into its box; no ArcGIS is installed here, so this was verified with stand-in windows (#272).
  - ⚡ 隔多久呼出都快 以前 Win 顺 闲置 20 秒后把全部内存还给系统，下次按快捷键要把窗口用的部分一点点读回来，内存紧张时能慢到一两秒。现在只还用不着的部分，留下搜索框和剪贴板要用的（任务管理器里闲置时显示三四十 MB，以前约 5 MB）。本机实测，闲置后按快捷键到看见窗口：57–73 毫秒降到 38–57 毫秒；内存紧张时 108 毫秒降到 35 毫秒（#280）。
    Quick to appear however long it sat WinShun used to give back all its memory after 20 idle seconds, and the next press read the window's part back piece by piece, a second or two when memory was short. Now only what is not needed goes (Task Manager shows 30–40 MB idle instead of about 5). Measured here from the hotkey to the window being seen after sitting idle: 57–73 ms down to 38–57 ms, and 108 ms down to 35 ms short of memory (#280).
  - 🤖 命令行装插件，给 AI 助手的 Skill ws plugin list | search | install | enable | disable | remove 在终端里管理插件，AI 助手也能替你装；要你点头的事（插件要的权限、没人审核过的包、卸载）仍由你在 Win 顺 的窗口里点。npx skills add LingCore/WinShun 给 Claude Code、Codex、Cursor 等装上三个 Skill：用 ws 搜文件、写插件、改 Win 顺 本身（#250、#251）。
    Plugins from the command line, skills for AI assistants ws plugin list | search | install | enable | disable | remove manages plugins from a terminal, for an AI agent too; what needs your yes (a plugin's permissions, an unreviewed package, a removal) is still asked in WinShun's own window. npx skills add LingCore/WinShun installs three skills for Claude Code, Codex, Cursor and the like: searching with ws, writing a plugin, working on WinShun itself (#250, #251).
  - 📏 搜索框显示几行自己定 设置 › 外观 › 搜索框显示行数，4–20 行，默认 8 行；屏幕下方放不下时自动少显示几行。
    Rows in the search box Settings › Appearance › Rows in the search box, 4 to 20, 8 by default; fewer where the screen has no room below.
  - 🌐 网页搜索：按 Tab 补全关键词 关键词记不全时，打它的一部分或网站名字（b、“百度”），选中那一行按 Tab，搜索框补成 baidu ，接着打要搜的词（#303）。
    Web search: Tab completes the keyword With a site's row found by a part of its keyword or by its name (b), Tab puts baidu in the box for the words to follow (#303).
  - 🧩 插件开发 新权限 winshun:backup：插件可以让 Win 顺 导出、恢复设置备份（只在插件自己的数据文件夹里），云备份插件就是这样做的。C++ SDK 的 tool() 可以在工作线程里调用。
    For plugin authors A new permission, winshun:backup: a plugin can have WinShun export and restore its settings backup, within the plugin's own data folder, as Cloud Backup does. The C++ SDK's tool() may be called from a worker thread.
  改进与修复 · Improvements and fixes
  - 安装和更新：别的程序占着 Win 顺 的文件时（比如某个插件的进程关不掉），更新不再卡在“正在准备安装”或失败；实在装不了时，通知里会说是哪个程序占着（#300，以及此前的 #68、#97、#274）。
    Installs and updates: with a program holding WinShun's files (a plugin's process that would not end), the update no longer sits on "Preparing to Install" or fails; when it truly cannot go on, the notice names the program in the way (#300, after #68, #97 and #274).
  - 设置窗口最大化后不再整片发黑（#301）。
    The settings window no longer goes black when maximized (#301).
  - Win 顺 以管理员身份运行、接管了开始菜单打字时，搜索框一闪就没、再打开又不接收输入的问题（#299）。
    Run as administrator with Start menu typing taken over, the box no longer leaves at once and then takes no letters (#299).
  - Directory Opus 里开着“直接打字搜索”时，右键菜单里按字母（比如 D 删除）仍归菜单，不再弹出搜索框（#311）。
    With typing to search on in Directory Opus, a letter pressed in its context menu (D for Delete) is the menu's again (#311).
  - 搜索面板：只有各列比列表宽时才显示横向滚动条，底部不再白留一条空（#310）。
    Search panel: the horizontal scroll bar shows only while the columns are wider than the list, with no strip kept clear under the rows (#310).
  - 预览：一个读不出来的文件（共享断了、硬盘休眠）不再让后面的文件都卡在“正在读取…”；过 5 秒会提示这个位置可能没有响应（#307）。
    Preview: a file that does not read (a share gone, a disk asleep) no longer keeps every later file on "Reading…"; after five seconds the window says its place may not be answering (#307).
  - 搜索框的 Logo 和拖动手柄有时拖不动，要重启 Win 顺 才好的问题。
    The logo and the grip of the search box could stop dragging the window until WinShun was started again.
  - 插件的命令和结果用 ph: 图标名时显示成空白文件图标的问题。
    A plugin's rows and commands with a ph: icon showed the blank file icon.
  - 导出的诊断包现在带上截图插件自己的记录（每次截图用了多久、显卡和显示器刷新率），方便排查黑屏、指针不见这类问题。
    The exported diagnostics package now includes the screenshot plugin's own journal (each capture's times, the graphics cards and refresh rates).
  插件库更新 · Plugin library updates

  | 插件 · Plugin                         | 新版本 · Version                                      |
  | ------------------------------------- | ----------------------------------------------------- |
  | 云备份 · Cloud Backup                 | 1.0.0（新 · new）                                     |
  | 资源管理器标签页 · Explorer tabs      | 1.1.0                                                 |
  | 截图与录屏 · Screenshot and recording | 1.1.12                                                |
  | 图片文字搜索 · Image text search      | 1.0.12                                                |
  | 网页搜索 · Web search                 | 2.0.2                                                 |
  | 局域网传输 · LAN transfer             | 1.0.7（11 月 12 日已发布 · published on 12 November） |

  - 云备份 1.0.0 需要 Win 顺 0.26.0；权限为设置备份、网络和通知。
  - 资源管理器标签页 1.1.0 记住开着的资源管理器窗口和标签页：在插件设置里打开“开机后打开上次的标签页”（默认关），下次登录后自动回来，标签页、窗口位置照原样，已经开着的不重复打开；也可以随时输入 标签页 选“打开上次的标签页”（#273）。权限没有变化。
  - 截图与录屏 1.1.12 鼠标不动时截图界面的指针不再消失；截图界面改用更稳的显示方式，减少个别显卡上按下快捷键时黑一下；第一次截图更快；按住鼠标拖动时方向键也能一个像素一个像素地挪（Shift 为 10 像素）。
  - 图片文字搜索 1.0.12、网页搜索 2.0.2 跟进主程序的共用代码和说明，没有各自的功能变化。
  - 局域网传输 1.0.7 可以在插件卡片上打开“自动接收”，默认关（#303）。
  Cloud Backup 1.0.0 needs WinShun 0.26.0 and asks for the settings backup, the network and notifications. Explorer tabs 1.1.0 remembers the open File Explorer windows and tabs: with "Open the tabs from last time after logon" on (off by default) they come back after the next logon, and the keyword tabs opens them on request (#273); its permissions are unchanged. Screenshot and recording 1.1.12 keeps the pointer when the mouse is still, presents its overlay in a way that avoids a black flash on some graphics cards, is quicker to its first capture, and moves the pointer with the arrow keys while a button is held. Image text search 1.0.12 and Web search 2.0.2 follow the host's shared code and text. LAN transfer 1.0.7 can accept what is sent without asking, off by default (#303).
  当前发布的验证范围见 0.26.0 发布验证记录。
  See the 0.26.0 release validation record for the verification scope.
