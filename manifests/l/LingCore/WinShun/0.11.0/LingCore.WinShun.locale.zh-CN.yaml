ReleaseNotes: |-
  Win 顺 0.11.0：自带截图，能贴在屏幕上、识别文字，还能按图里的字找回截过的图；打“蓝牙”“深色”“音量”直接开关；剪贴板想留多少条都行，开在光标上方时上下翻过来；应用搜索更像任务栏，常打开的排在前面。WinShun 0.11.0: a built-in screenshot tool that pins captures on the screen, reads their text and finds past screenshots by the words in them; type Bluetooth, dark mode or volume to switch them on the spot; the clipboard keeps as many entries as you like and flips over above the text cursor; app search works like the taskbar's, and what you often open comes first.
  新功能 · What's new
  - 📸 自带截图：默认关，在设置 › 插件的“截图”卡片上打开，再录一个快捷键（不录也行，从托盘菜单点“截图”）；想让 PrtScn 键也截图，打开“用 PrtScn 键截图”，关掉就恢复系统原来的设置。截图时点选窗口、按钮，或拖出一块；Enter 复制，截图也进剪贴板历史，图里的字能搜，Ctrl+S 存成文件；F3 贴在屏幕上，可以拖动、缩放、调透明度；“识别文字”把图里的字取出来，“用它搜索”放进 Win 顺 的搜索框。搜索框里打 jt 加空格，按图里的字找截过的图；图片文件和剪贴板里的图片，右键“贴到屏幕”也能贴。
    A built-in screenshot tool: off by default; turn it on with the Screenshot card under Settings › Plugins and record a shortcut (or use Screenshot in the tray menu). Take screenshots with PrtScn lets the PrtScn key take them too, and turning it off restores the system's own setting. Click a window or a control, or drag an area; Enter copies it, into the clipboard history as well, where the words in it can be searched, and Ctrl+S saves it; F3 pins it on the screen to drag, zoom and fade; Read text lifts its words out, and Search for it puts them in WinShun's search box. jt and a space in the search box finds past screenshots by the words in them, and Pin to screen in the menu of a picture file or a clipboard picture pins that too.
  - 🤖 AI 助手也能用截图：在设置 › AI 助手里打开“允许 AI 读取剪贴板历史”，AI 也能拿到 Win 顺 截过的图和图里识别出的文字；“允许 AI 请求截屏”默认关，打开后 AI 每次要截屏，屏幕上都会弹出确认窗口，你点“允许”才截。
    Screenshots for AI assistants: with Allow AI to read the clipboard history on under Settings › AI assistants, AI clients get WinShun's screenshots and the text read in them too; Let AI ask for a screenshot is off by default, and once on, every request puts a confirmation on the screen, and nothing is taken until you click Allow.
  - 🎚️ 系统开关：打“蓝牙”“深色”“音量”，结果行的右端直接显示现在是开还是关；Enter 就地切换，搜索框不关，Ctrl+Enter 打开对应的设置页。能开关的有深色模式、显示隐藏的文件、显示文件扩展名、蓝牙、WLAN、音量和静音、保持唤醒。“关蓝牙”“静音”“音量 30”一步到位，Alt+← / Alt+→ 把音量减、加 5；“保持唤醒 1 小时”“保持唤醒 到 18:00”到点自动结束。
    System switches: type Bluetooth, dark mode or volume and the row shows whether it is on; Enter flips it in place with the box left open, and Ctrl+Enter opens its settings page. Dark mode, hidden files, file extensions, Bluetooth, WLAN, volume and mute, and keep awake; bluetooth off, mute and volume 30 act in one step, Alt+← / Alt+→ turn the volume down or up by 5, and awake 1h keeps the PC awake for an hour.
  - 📋 剪贴板想留多少条都行：设置 › 剪贴板 › 保留里的“最多保留”可以选 300 条、500 条、无限，也可以自己填一个数（10～100000）；选无限时只按保留时间删除，“固定”和分组里的一直保留。以前最多只能留 300 条，现在默认就是 300 条（#32）。
    Keep as much clipboard history as you like: Keep at most under Settings › Clipboard › Keeping offers 300, 500 or No limit, or any number typed in (10–100000); with no limit only their age removes entries, and pinned and grouped ones always stay. It used to stop at 300, which is now the default (#32).
  - 🔃 剪贴板跟着光标翻过来：光标靠近屏幕下边时，剪贴板开在放得下更多行的一边，不再挤在光标下面只露三行；开在光标上方时上下翻过来，搜索框和最新的一条挨着光标，越往上越早，方向键照屏幕上的方向走。在设置 › 剪贴板里，“搜索框位置”可以选靠近光标或远离光标，不想翻转就关掉“开在光标上方时翻转”（#38）。
    The clipboard flips over above the cursor: low on the screen, it opens on the side of the text cursor where more rows fit, instead of three rows squeezed under it; opened above, it is turned upside down, with the search box and the newest entry by the cursor, older ones further up, and the arrow keys going the way they point. Under Settings › Clipboard, Search box position puts the search box near the cursor or away from it, and Flip when opening above the text cursor can be turned off (#38).
  - ⌨️ 剪贴板里直接打拼音：剪贴板窗口不抢焦点，粘贴才能回到原来的地方，所以输入法在里面组不了字；直接打拼音就能搜中文，tupian 找到“图片”。现在在中文输入法下单按 Shift，会提示这一点（#42）。搜索之后，列表里不再留下重叠的旧行（#43）。
    Pinyin in the clipboard: the clipboard window takes no focus, so that a paste goes back where it belongs, and no input method composes in it; type pinyin straight away to find Chinese, tupian finds 图片. Pressing Shift alone under a Chinese input method now says so (#42). After a search, no leftover rows are drawn over the list (#43).
  - 🧭 应用搜索更像任务栏：vscode、vs code 找到 VS Code；wx、weixin、微信 找到微信（便携版也行）；ps、ppt、wps 这些常用简写打全了就能找到；cmd 先出命令提示符，不再被开发者命令行挤下去。
    App search like the taskbar's: vscode and vs code find VS Code; wx, weixin and 微信 find WeChat (the portable one too); common short names such as ps, ppt and wps work when typed in full; cmd puts the Command Prompt first, no longer pushed down by the developer command prompts.
  - 🥇 常打开的排在前面：Win 顺 记得你打了什么字、打开了哪一项；下次打同样的字，或者开头一样的字，常打开的那一项排在最前，很久没打开的慢慢往后。设置里关掉“记住打开过的项目”就不再记，“清除最近使用记录”会一起清掉。
    What you often open comes first: WinShun remembers what you typed and what you opened; type the same again, or the start of it, and the item you often open comes first, while ones left alone for long slowly fall back. Turning off Remember what you open stops it, and Clear recent items clears this too.
  - 📄 内容索引可开可关：新装的 Win 顺 默认不建内容索引，内容 直接读文件来搜（慢一些）；内容 范围搜索框下面那一行的右端有“内容索引”开关，点一下就打开，关掉会清空索引。默认大小上限调小为文本和日志 2 MB、源代码 1 MB、数据和网页 2 MB、文档 50 MB：超过的文件很少，要读的却少了很多。第一次建索引时，直接放着 500 个以上同类文件的文件夹（多是生成的文档、翻译文件）放到最后读，一个也不跳过；PDF 也读得快了 5%～7%。
    The content index, on or off: a new install starts without a content index, and Content reads the files as it searches (slower); the Content index switch at the right end of the row under the search box in Content turns it on, and off again, which clears it. The default size limits are smaller: 2 MB for text and logs, 1 MB for source code, 2 MB for data and web pages, 50 MB for documents, which leaves out few files but much of what there is to read. On a first build, folders holding 500 or more files of one kind (mostly generated documentation and translations) are read last, none skipped; PDFs are read 5–7% faster.
  - 🛠️ 其他改进：任务栏搜索框的结果窗口改为在任务栏上方淡入淡出，不再从任务栏后面滑出，用 TranslucentTB 这类透明任务栏时不再透出来、留下残影；150% 缩放下任务栏搜索框的边框四边一样粗；用 SVG 代码画的网站图标，再编辑时框里还是那段代码，可以接着改；英文界面补全了 内容 那一行的开关和提示；从 VS Code 的终端或扩展里启动的 Win 顺，打开 VS Code 等 Electron 应用时没反应，现在修好了。
    Other improvements: the taskbar search box's window fades in and out above the taskbar instead of sliding from behind it, so a see-through taskbar (TranslucentTB) no longer shows it through or keeps a ghost of it; at 150 % the box's edge is equally thick all round; a site icon drawn from SVG code shows that code again when the shortcut is edited; the English interface now has words for the switch and tips in the Content row; WinShun started from VS Code's terminal or an extension opens VS Code and other Electron apps again.
  升级提示 · Upgrading
  内容索引只在新装时默认关。从旧版升级上来的，原来开着的还开着，关着的还关着。
  The content index starts off only on a new install. Upgraded from an older version, it stays on if it was on, and off if it was off.
  内容搜索的默认大小上限调小了：文本和日志 2 MB、源代码 1 MB、数据和网页 2 MB、文档 50 MB（以前是 16、2、4、100 MB）。没改过的换成新的默认值，自己改过的保持不变。超过上限的文件搜完会提示，点一下就能搜。
  The default size limits of content search are smaller: text and logs 2 MB, source code 1 MB, data and web pages 2 MB, documents 50 MB (were 16, 2, 4 and 100 MB). Limits you never changed take the new defaults; ones you set stay. Files over the limit are offered after a search, one click away.
  装回旧版之前：剪贴板的“最多保留”如果选了 500 条、无限或大于 300 的数，先改回 300 条或更少，否则旧版会删掉多出来的条目（无限会被当成 10 条；“固定”和分组里的不受影响）。搜索历史里新记下的“打了什么字”，旧版会丢掉，打开过的记录还在。
  Before going back to an older version: if the clipboard keeps more than 300 entries (500, No limit or a larger number), set it to 300 or fewer first, or the older version deletes the rest (it takes No limit as 10; pinned and grouped entries are kept). The texts typed before opening things, now kept in the search history, are dropped by an older version; what was opened stays.
  截图还没在几台缩放不同的显示器上、开着 HDR 时实际测过，遇到问题请到 GitHub Issues 反馈。
  Screenshots have not been tried yet across monitors with different scaling, or with HDR on; if something goes wrong there, please report it on GitHub Issues.
