ReleaseNotes: |-
  Win 顺 0.27.0 让“内容”搜索也能用正则表达式，还能写 马上|立即 找几个词里的任意一个。Bandizip、7-Zip、WinRAR 的“选择解压路径”窗口下面有了搜索框；自己的命令可以用关键词后面的字先搜文件，再把选中的那个交给程序；插件库里的插件安装前就能看说明。截图可以直接输入选区的宽高、锁定比例，QQ 的圆点二维码也读得出来。另外可以在桌面上直接打字搜索、把范围标签合成一个按钮、关掉结果行的删除按钮、记住哪些程序要以管理员身份运行。 WinShun 0.27.0 brings regular expressions to the Content search, and now|soon for either of some words. The extraction path windows of Bandizip, 7-Zip and WinRAR get the search bar; a command of your own can find files with the words after its keyword and take the one you pick; a plugin in the library shows its README before it is installed. A capture can be given a typed width and height or a locked shape, and QQ's round, dotted QR codes are read. Also: typing on the desktop to search, the scope tabs as one button, result rows without the delete button, and programs remembered as run as administrator.
  新功能 · What's new
  - 🔎 内容搜索：正则表达式，几个词有一个就行 在“内容”里输入 马上|立即，找到含其中任意一个词的文件；会议 马上|立即 是有“会议”并且有后两个之一。词前面加 regex:（或 re:）就是正则表达式，如 regex:1[3-9]\d{9} 找手机号；按 Ctrl+R 打开正则模式后每个词都是表达式。表达式在一行之内匹配，默认不分大小写，写错了会说明原因。表达式里有固定的字（合同编号[A-Z]\d+）时，开着内容索引和搜普通的词一样快；一个固定的字都没有（\d{11}）就要把文件挨个读一遍。ws grep 和 AI 工具的 search_content 同样支持。图片文字搜索、按意思搜索两个插件的结果不在此列（#295）。
    Content search: regular expressions, and either of some words In Content, now|soon finds the files with either word; meeting now|soon needs "meeting" and one of the two. A word after regex: (or re:) is a regular expression, as in regex:1[3-9]\d{9}; in regex mode (Ctrl+R) every word is one. An expression matches within a line, any case by default, and a broken one says why. With some fixed text in it, an expression is as fast as a word when the content index is on; with none (\d{11}) every file is read. ws grep and the AI tool search_content take the same. The Image text search and Search by meaning plugins' rows are not covered (#295).
  - 🗜️ 解压软件的“选择解压路径”也有搜索框 Bandizip 的“选择解压路径”、7-Zip 的“提取”和 WinRAR 的解压窗口下面出现搜索框：搜到文件夹按 Enter，路径填进它的路径框（Bandizip 的文件夹树跟着展开），Ctrl+G 也能用，“确定”仍由你点。Bandizip 7.36 用真实程序验证；本机没有 7-Zip 和 WinRAR，这两个用替身窗口验证。
    The search bar under archivers' extraction path windows Bandizip's "Select a path to extract", 7-Zip's Extract and WinRAR's extraction window take the bar: Enter on a folder writes it into their path box (Bandizip's tree follows), Ctrl+G works too, and OK stays yours. Run against the real Bandizip 7.36; 7-Zip and WinRAR are not installed here and were checked with stand-in windows.
  - ⌨️ 命令：关键词后面的字用来搜文件 给自己的命令（要含 {query}）打开“关键词后面的字用来搜索文件”，默认关。之后输入 code 我的项目，列出“我的项目”搜到的文件和文件夹，在一行上按 Enter 就把它的完整路径交给命令，底栏写明“用“…”打开”。最后一行是命令本身，照原样传入输入的字；输入的是一个存在的路径时它排最前（感谢 @a18ccms，#319）。
    Commands: the words after the keyword find files A command of your own with {query} can be given "The words after the keyword find files" (off by default). code my project then lists the files and folders my project finds, and Enter on one hands its full path to the command; the footer says what will open it. The command's own row, which takes the words as they are, comes last, or first when they are a path that exists (thanks to @a18ccms, #319).
  - 🧩 插件库：安装前看说明，卡片更清爽 插件库里还没装的插件多了“说明”，点开就是它自带的说明文档，下载后核对 SHA-256 再显示。作者、权限、审核状态收进名字旁边的 “i”，鼠标停上去才显示，卡片上只留名字、简介和按钮；已下载、等下次启动换上的新版本会在已安装的卡片上标出来（感谢 @ra9fael，#304）。
    Plugin library: the README before installing, quieter cards An entry not yet installed has Readme, which shows the plugin's own README, checked against its SHA-256. Who made it, what it may do and how it was reviewed moved into an "i" beside the name; a newer version already downloaded for the next start is marked on the installed card (thanks to @ra9fael, #304).
  - 🖥️ 在桌面上直接打字搜索 在 设置 › 打开 Win 顺 › 对话框 打开“在桌面上直接打字搜索”，默认关。点一下桌面后直接打字，就弹出搜索框搜整台电脑。给图标改名、右键菜单开着、按着 Ctrl、Alt、Win 时不触发（#314）。
    Type on the desktop to search With "Type to search on the desktop" on (Settings › Open WinShun › Dialogs, off by default), a key typed on the desktop opens the box to search the whole PC. Not while an icon is renamed or a menu is open, nor with Ctrl, Alt or Win held (#314).
  - 🎛️ 搜索框更简洁 设置 › 外观 › 尺寸与布局 的“范围标签”选“合并”，搜索框右边的“全部 / 文件 / 内容”合成一个写着当前范围的按钮，点一下或按 Tab 切到下一个。“纯净搜索模式”也搬到了这里：打开后右上角的“搜索历史”“展开面板”两个按钮一直隐藏，快捷键照常可用（#185、#244）。
    A plainer search box Scope tabs › Merged under Settings › Appearance › Size and layout turns All / Files / Content into one button naming the current scope; a click or Tab goes to the next. Pure search mode moved to the same place and now keeps the history and expand buttons hidden while you type as well; their shortcuts still work (#185, #244).
  - 🛡️ 记住以管理员身份运行 打开 设置 › 使用记录 的“记住以管理员身份运行”（默认关）：一个程序用 Ctrl+Shift+Enter 运行过一次，以后按 Enter 也以管理员身份运行，这一行标着“管理员”，底栏的提示也会写明；右键选“以普通权限运行”改回（#313）。
    "Run as administrator", remembered With the setting on (Settings › Usage history, off by default), a program run once with Ctrl+Shift+Enter runs as administrator on Enter from then on; its row says Admin and the footer says so too. "Run with normal rights" in its menu makes Enter plain again (#313).
  - 🗑️ 结果行的删除按钮可以关掉 设置 › 结果列表 的“显示删除按钮”，默认开。关掉后文件那一行不再有垃圾桶，别的按钮照旧；要删除时右键 › 更多选项（感谢 @shanqiang2016，#316）。
    Rows without the delete button "Show the delete button" under Settings › Result list, on by default. Off, rows of files end without the bin; the others stay, and More options in the right-click menu still deletes (thanks to @shanqiang2016, #316).
  改进与修复 · Improvements and fixes
  - 在资源管理器里直接打字弹出的搜索框：不再先闪一下文件夹里的内容再换成搜索结果；变高时不再有一帧黑块；位置紧贴文件列表的角，不压住滚动条（#234）。
    The box a key typed in File Explorer opens no longer lists the folder for a moment before the results, shows no black part for a frame while growing, and sits right in the corner of the file list without covering its scroll bars (#234).
  - 收藏的关键词只打开头几个字（cmda 打到 cm）也能找到；运行过的命令会出现在最近项目里（#313）。
    The start of a favorite's keyword (cm of cmda) finds it; a command that was run is listed among the recent items (#313).
  - Shift+Space 可以录成快捷键了（剪贴板、插件等各处的快捷键）；Shift 加别的键仍然不行，因为那是在打字（#294）。
    Shift+Space can be recorded as a shortcut (the clipboard's, plugins' and the others); Shift with any other key still cannot, since that types (#294).
  - 剪贴板窗口钉住、别的程序在前面时，“加备注…”打不了字的问题（#267）。
    "Add a note…" took no typing while the clipboard window was pinned with another program in front (#267).
  - 品牌样式的浅色列表里，选中的那一行比鼠标悬停的还不明显的问题（#267）。
    In the brand style on a light list, the chosen row read weaker than the row under the pointer (#267).
  - 正则模式的 .* 标记在“内容”里也显示；设置里说明太长的提示会换行，不再伸出窗口。
    Regex mode's .* key shows in Content too; a long tip in the settings wraps instead of running out of the window.
  插件库更新 · Plugin library updates

  | 插件 · Plugin                         | 新版本 · Version |
  | ------------------------------------- | ---------------- |
  | 截图与录屏 · Screenshot and recording | 1.1.13           |
  | 图片文字搜索 · Image text search      | 1.0.13           |

  - 截图与录屏 1.1.13 点选区旁边的尺寸，或按 F，打开尺寸面板：直接输入宽和高；点锁可以锁定比例，之后拖动、拖小方块、Shift+方向键都保持形状；下面一列常用尺寸和比例可以自己增删。还没框选时按 F 选一个尺寸，就在鼠标处得到这么大的选区（感谢 @ra9fael，#308）。二维码识别升级到 zxing-cpp 3.1.1，读不出来时会放大再读一次：QQ 的圆定位点、圆点二维码，142 张真实图片从读出 116 张提高到 140 张，缩到四分之一大小时从 82 张提高到 118 张（#305）。权限没有变化。
  - 图片文字搜索 1.0.13 跟进主程序的共用代码，没有自己的功能变化。
  - 插件库现在把每个插件的说明文档放在索引旁边，所以 0.27.0 能在安装前显示“说明”；旧版本的 Win 顺 不受影响。
  Screenshot and recording 1.1.13: click the size by the selection, or press F, for a panel that takes a width and a height, locks the shape through drags, handles and Shift+arrows, and lists sizes and shapes you can add to and remove; before selecting, F and a size make a selection of that size at the pointer (thanks to @ra9fael, #308). QR reading moves to zxing-cpp 3.1.1 and reads a picture again drawn larger when nothing was found: of 142 real pictures of QQ's round, dotted codes 140 are read instead of 116, and 118 instead of 82 at a quarter of their size (#305). Its permissions are unchanged. Image text search 1.0.13 follows the host's shared code. The library now keeps each plugin's README beside its index, which is what 0.27.0 shows before installing; older versions of WinShun are not affected.
