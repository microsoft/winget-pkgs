ReleaseNotes: |-
  Win 顺 0.53.0：收藏夹能收藏快捷键，打关键词就按下一组键；解压就用的便携软件也能搜到，应用可以起别名（#505）；拖文件时的收藏圆盘多了“收藏”，拖上去就收藏（#505）；“打开”“另存为”对话框旁的搜索框默认又搜整个电脑，“当前文件夹优先”改成可选（#507）；另有鼠标手势按组合键在 WPS 里不灵（#472）、“内容”里图片行 Ctrl+C 复制的是文字（#448）、独占全屏游戏里剪贴板面板一闪就收起（#452）等修复。
  新功能 · What's new
  - ⌨️ 收藏快捷键：记不住、按着别扭的组合键，起个关键词收藏起来。在 设置 › 收藏夹 › 添加快捷键 填名称和关键词，点“快捷键”框后按下组合键（Win 键的组合也能录）。比如关键词 xj、快捷键 Ctrl+Shift+N：在资源管理器里打开搜索框，只打 xj 按 Enter，资源管理器里就新建了一个文件夹。按键发给打开搜索框之前正在用的窗口；从文件夹菜单（双击空白处）里点它，发给那个资源管理器窗口。以管理员身份运行的窗口收不到普通程序发的按键，这时弹通知说明，不会按到别处。旧版 Win 顺 读到这种收藏会原样保留。
    Favorite shortcuts: give a key combination you can never remember a keyword. Under Settings › Favorites › Add shortcut, name it, give it a keyword, click the Shortcut box and press the keys (Win combinations too). With the keyword xj and Ctrl+Shift+N, opening the search box over File Explorer and typing just xj and Enter makes a new folder there. The keys go to the window you were using before the search box opened; from the folder menu (double-click empty space), to that Explorer window. A window running as administrator does not take keys from normal programs: a notification says so instead of pressing them elsewhere. Older versions keep such favorites as they are.
  - 📦 便携软件也能搜到，应用可以起别名（#505）：解压就能用的软件不在开始菜单里，以前搜不到。在 设置 › 搜索范围 › 应用 加上放它们的文件夹，里面的程序就和开始菜单里的应用一样能搜、能打开，也会进“常用”；一个软件一个文件夹的，只取和文件夹同名的那个程序，卸载、更新这类辅助程序不列。程序自带的说明也搜得到（打“防撤回”找到 RevokeMsgPatcher.exe）。在结果里右键应用选 设置别名（或选中按 F2），给它起个好记的名字，原来的名字照样能搜到。起过别名的、加进来的软件都列在同一页，可以改名、还原、隐藏。
    Portable programs and aliases (#505): programs you only unzipped are not in the Start menu, so they were not found. Add their folders under Settings › Search scope › Apps and their programs are found, opened and counted among the frequent ones like Start menu apps; in a folder per program only the one named after the folder is taken, and uninstallers, updaters and other helpers are left out. A program's own description is searched as well. Right-click an app and choose Set alias (or press F2) to give it a name of your own; its original name still finds it. Named and added programs are listed on the same page, to rename, restore or hide.
  - ⭐ 拖文件时的圆盘上直接收藏（#505）：拖着文件按 ` 叫出收藏圆盘后，下面那行再往下多了一个“收藏”，拖到它上面松开，拖着的文件和文件夹就加进收藏夹，文件本身不动；新收藏的文件夹，下次叫出圆盘时就在上面。拖的都已经收藏过时它变成“取消收藏”。一次最多 10 项。还没收藏文件夹时，圆盘会提示把文件夹拖到“收藏”上。
    Favorite from the drop pie (#505): the pie that ` brings up while dragging files has a Favorite chip under its status line. Let go on it and what you drag is added to the favorites, the files staying where they are; new favorite folders are on the pie the next time. When all of it is among the favorites already it reads Unfavorite. At most 10 at a time. With no favorite folders yet, the pie says to drop one on Favorite.
  改进与修复 · Improvements and fixes
  - “打开”“另存为”对话框（#507）：0.52.0 把对话框旁的搜索框改成先列当前文件夹里的，看起来和 Ctrl+Shift+D（只搜当前文件夹）差不多，在“另存为”里想转到别处时反而碍事。现在默认又和搜索框一样搜整个电脑；设置 › 系统整合 › 对话框 的“搜索的范围”可以选“整个电脑”“当前文件夹优先”或“只搜当前文件夹”。Ctrl+Shift+D 在“只搜当前文件夹”和你选的那种之间切换，菜单里写着“搜索整个电脑”或“也搜其他位置”。
    Open and Save dialogs (#507): 0.52.0 made the bar beside them list the dialog's folder first, which looked much like Ctrl+Shift+D (this folder only) and got in the way in Save As, where you search to go elsewhere. By default it searches the whole PC again, as the search box does; 搜索的范围 under Settings › Integration › Dialogs offers the whole PC, current folder first or current folder only. Ctrl+Shift+D switches between the folder alone and the one you chose, and the menu says which.
  - 鼠标手势（#472，鼠标手势 2.3.0）：手势设成 Ctrl+↑、Shift+↑ 这类组合键时，WPS 里只当成按了方向键：Ctrl、Shift 按下和松开几乎在同一瞬间，WPS 检查时它们已经松开了。现在组合键会按住一小会儿再松开，WPS 和别的程序里都正常。另外每个手势可以写自己的提示文字：在设置窗口里点动作，弹出面板最下面填“上移段落”这样的话，画手势时轨迹旁就显示它，列表里也用它当标题；触发角、摩擦边、快捷键也一样。
    Mouse gestures (#472, Mouse gestures 2.3.0): a gesture set to Ctrl+Up or Shift+Up only moved the caret in WPS: Ctrl or Shift went down and up at once, and WPS looked after they were up. The keys are now held a moment before they go up, in WPS and everywhere else. A gesture can also have hint text of its own: click its action in the settings window and write, say, "Move paragraph up" at the bottom of the panel; the hint by the trail and the gesture's row show it. Hot corners, rubbed edges and shortcuts too.
  - “内容”里的图片、文档行（#448）：图片文字搜索、按意思找给出的行代表一个图片或文档，以前按 Ctrl+C 复制的却是识别出的文字。现在和“全部”“文件”里一样当文件本身用：Ctrl+C 复制文件，Ctrl+Shift+C 复制完整路径，Ctrl+Enter 打开所在位置，也能直接拖出去；识别出的文字在右键菜单的“复制文字”里。
    Image and document rows in Content (#448): rows from Image text search and Search by meaning stand for a picture or document, yet Ctrl+C copied the recognised text. They now act as the file, as in All and Files: Ctrl+C copies the file, Ctrl+Shift+C its full path, Ctrl+Enter opens its folder, and the row drags out; the text is under 复制文字 in the menu.
  - 剪贴板（#452）：在独占全屏的游戏里呼出剪贴板，游戏退出全屏、切回桌面的那一下，面板会被当成“点了别处”而收起，来不及选。现在打开后几秒内遇到这种情况，面板把前台拿回来留在屏幕上；点别的程序、按开始菜单或 Alt+Tab 照旧收起。
    Clipboard (#452): opened over a game in exclusive full screen, the panel went within a second as the game left full screen and took the front back, as if you had clicked elsewhere. For a few seconds after opening, it now takes the front back and stays; another program, the Start menu or Alt+Tab still close it.
  - 应用：开始菜单子文件夹里新装的程序，有时要等很久才搜得到（NTFS 在上一级的列表里记的是旧时间），现在按文件夹自己的时间判断，很快就能搜到。
    Apps: a program newly installed into a Start menu subfolder could take long to be found (NTFS keeps an old time for the folder in its parent's listing); the folder's own time is read now.
  - 翻译、按意思找（翻译 2.4.1、按意思找 1.2.2、本地模型 1.0.1）：设置卡片只列所选服务要填的几项。以前所有服务共用一个“接口地址”，留着别家的地址时，选“本地模型”会把请求发到那里、报 401；现在本地模型只连本机。按意思找的各家云服务各存各的密钥，切换服务不会把这家的密钥发给那家。
    Translate and Search by meaning (Translate 2.4.1, Search by meaning 1.2.2, Local models 1.0.1): a card lists only what the chosen service needs. All services shared one endpoint field, and an address left there from another service sent the local model's requests there (401); the local model now always stays on this PC. Each cloud service of Search by meaning keeps its own key, so switching never sends one service's key to another.
  - 录快捷键：录收藏快捷键时，导航键、符号键和小键盘的键都能认出名字；设全局快捷键时不再收小键盘的键，以前按小键盘的 0 会录成主键盘的 0。
    Recording keys: navigation, sign and number-pad keys are named when recording a favorite shortcut; a hotkey no longer takes a number-pad key, which it used to record as the main row's.
  - 诊断信息（#506）：诊断包的显示部分多记系统缩放、任务栏缩放和是否远程会话，方便查任务栏图标大小不对这类问题。
    Diagnostics (#506): the display part of a diagnostics package now has the system and taskbar scale and whether it is a remote session, for problems such as a wrongly sized taskbar icon.
