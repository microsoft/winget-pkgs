ReleaseNotes: |-
  Win 顺 0.18.0 带来图片文字搜索、网页搜索插件、签名插件更新、快捷键总览和更紧凑的设置，改进截图、预览、剪贴板与输入交互。休息提醒支持手动暂停，翻译新增 AI 词典和更多服务。WinShun 0.18.0 adds image text search, optional web search, signed plugin updates, a shortcut overview and grouped settings, with improvements to capture, previews, clipboard and keyboard input. Break reminders gain manual pause, and translation gains an AI dictionary and more services.
  新功能 · What's new
  - 🖼️ 图片文字搜索插件 支持图片、扫描及混排 PDF、Office 文档内嵌图片的离线文字索引。选择目录后后台增量识别，预览高亮命中位置，也能向主程序提供内容搜索结果。最低要求 Win 顺 0.18.0。
    Image text search indexes images, scanned and mixed PDFs, and images embedded in Office documents locally, with incremental indexing, highlighted previews and content-search integration. Requires WinShun 0.18.0.
  - 🌐 网页搜索迁入插件库 在网页搜索插件卡片管理网站、关键词、图标和建议，保留旧配置和自定义网站。停用后保留配置，重新启用后继续使用。网页搜索 2.0.0 需要本版主程序。
    Optional web search manages sites, keywords, icons and suggestions from its plugin card, preserving existing custom sites and settings. Web search 2.0.0 requires this host version.
  - 🧩 签名索引与插件后台更新 校验索引签名后检查更新，无新增权限的更新可后台准备，新增权限时由用户确认。插件页和托盘显示可更新数量，保留原有设置与开关状态。
    Signed plugin updates verify the index before preparing background updates. Added permissions require consent, with update counts in settings and the tray, preserving settings and enabled states.
  - ⌨️ 快捷键总览与设置分组 搜索窗口提供快捷键面板，设置按任务分组，Tab 导航和滚动位置更稳定。搜索支持 Ctrl+J/K 导航，预览支持中键、跟随悬停和文字选择。
    Shortcut overview and grouped settings make commands easier to find, with stable keyboard navigation and scrolling. Search supports Ctrl+J/K, middle-click previews, hover following and text selection.
  - 📸 截图和保存改进 增加选区精调和保存选项，录屏可切换选区或全屏。改进画笔、贴图菜单、截图热键注册及空闲内存占用，截图期间排除自身工具窗口。
    Capture improvements add precise region controls and save options, area or full-screen recording, smoother strokes, themed pin menus, hotkey registration and lower idle memory usage, while keeping capture controls out of captured frames.
  - ⏸️ 休息提醒手动暂停 可一直暂停到手动恢复，重启程序或电脑后仍保持。原有 1 小时、3 小时定时暂停继续可用。
    Manual break pause lasts until resumed, including across application and computer restarts, alongside the existing timed pauses.
  - 📖 翻译与 AI 词典 dict 单词 显示音标、词性、释义和例句，结果标明由模型生成。支持微软 Translator 及 DeepSeek、豆包／火山方舟、腾讯混元预设。改词时取消旧请求，成功结果缓存 5 分钟，日志提供耗时和状态码。
    Translation and AI dictionary provide labeled model-generated definitions and examples, Microsoft Translator support, and presets for DeepSeek, Doubao / Volcengine Ark and Tencent Hunyuan. Superseded requests are canceled and successful results cached, with timing diagnostics.
  修复与改进 · Fixes and improvements
  - 修复截图快捷键单项注册失败影响其他组合、图形插件输入法受限及录屏工作进程权限问题。
    Fix isolated capture hotkey failures, input-method restrictions in graphical plugins and recording-worker permissions.
  - 改进剪贴板独立缩放、滚动后的快捷编号、Shell 弹窗避让、远程同步异常文本过滤和诊断信息。
    Improve independent clipboard scaling, shortcut numbers after scrolling, placement beside Shell flyouts, filtering of corrupted remote-sync text and diagnostics.
  - 改进数字键按下／释放配对、被系统拒绝后的钩子重试、静默控制台启动，以及拖放圆盘辅助进程恢复。
    Improve number-key press/release pairing, hook retries, silent console launching and drop-ring helper recovery.
  - 改进资源管理器及 Directory Opus 输入搜索、提升权限的文件对话框、文本命中定位到编辑器行号，以及内容索引日志丢失后的核对。
    Improve Explorer and Directory Opus typing search, elevated file dialogs, opening text matches at their editor line and recovery after lost index journals.
  升级与验证范围 · Upgrade and validation scope
  网页搜索和图片文字搜索的新包需要 0.18.0。截图新版也需要本版宿主提供的新工具。其他官方插件按各自清单要求安装。安装与更新需要权限时仍先确认，更新保留设置和原有启用状态。
  The new web search, image text search and capture packages require WinShun 0.18.0. Other official plugins use their manifest's minimum version. Permission consent, settings preservation and enabled-state preservation continue to apply.
  图片文字搜索与社区 OCR Studio 的默认关键字均为 ocr。同时安装时，在插件卡片更改其中一个关键字，例如 imgocr。
  Image text search and the community OCR Studio both use ocr by default. When installing both, change one keyword in its plugin card, for example to imgocr.
  翻译取消及快速改词使用本地隔离 HTTP 服务与真实插件协议验证。第三方付费服务的实际耗时与账户配置未在本次使用用户密钥实测，响应时间仍受网络和服务影响。AI 词典由模型生成，需要自行核对释义。Windows 10、特定显卡和用户原环境仍需对应环境复测。本次完整结果见发布验证记录。
  Translation cancellation and rapid edits are checked with an isolated local HTTP server and the real plugin protocol. Paid service latency and account configuration were not tested with user credentials. Network and provider latency still apply, and model-generated definitions need review. Windows 10, specific GPUs and original reporter environments require their own validation. See the linked release-validation record for the measured scope.
