ReleaseNotes: |-
  Win 顺 0.15.0：框选区域录 MP4 和 GIF，自定义搜索面板的列，调整剪贴板宽度，改进文件管理器配合与截图操作。WinShun 0.15.0: record regions as MP4 or GIF, customize search columns, resize clipboard history, and improve file manager integration and screenshot controls.
  新功能 · What's new
  - 🎥 区域录屏与 GIF：截图框选区域后，点“录屏”或按 Ctrl+R，选择 MP4 或 GIF。支持倒计时、暂停、继续、连续再录一段，以及画质、鼠标指针和点击高亮设置。MP4 可选系统声音与麦克风，两项默认关闭；GIF 不含音频，生成时显示进度。保存位置可选，控制条不录入画面。
    Region recording and GIFs: select a screenshot region, then choose Record or press Ctrl+R. Record MP4 or GIF with countdown, pause/resume, another take, quality options, cursor and click highlights. MP4 optionally captures system audio and microphone, both off by default; GIF is silent and shows export progress. Choose the save folder; recording controls stay out of the output.
  - 📊 搜索面板的列由你决定：Ctrl+E 展开后，右键列头选择显示内容，拖动调整顺序和宽度。新增类型、创建时间、所在文件夹和来源；布局自动保存，也能恢复默认。插件提供的日期和大小也能显示、排序和筛选，旧插件仍兼容。
    Customizable search columns: right-click a header in the Ctrl+E panel to choose columns; drag to reorder or resize them. Add type, creation time, parent folder and source. Layouts persist and can be reset. Plugin dates and sizes participate in display, sorting and filtering, with older plugins remaining compatible.
  - 📋 剪贴板更好调整：关闭预览时拖动右边缘改变面板宽度，双击边缘恢复默认；文字随界面大小调整。复制的图片文件也显示缩略图，双击粘贴时避免预览抢先展开。
    A more adjustable clipboard: drag the right edge with the preview closed to resize the panel, or double-click it to reset. Text follows the UI size setting. Copied image files gain thumbnails, and double-click paste cancels a pending preview.
  - 📂 更多文件管理器配合：Directory Opus 可单独开启“直接打字搜索”，跟随双栏中正在操作的文件夹，打开或定位结果回到原面板；默认关闭。Ctrl+G 新增 OneCommander，使用活动面板的路径。
    More file manager integration: optionally type to search in Directory Opus, following the active pane and returning opened or located results there. It is off by default. Ctrl+G adds OneCommander using the active pane's folder.
  - ✏️ 截图操作更顺手：工具条可拖动，样式面板跟着移动；可以设置截图保存目录和“贴上最近一次截图”的快捷键。长截图默认手动滚动，需要时再开启自动滚动。
    More convenient screenshot controls: drag the toolbar together with its style panel, choose a screenshot save folder and assign a shortcut to pin the latest capture. Scrolling capture defaults to manual scrolling, with automatic scrolling available when enabled.
  - 🎨 外观与收藏命令：界面大小设置增加效果预览；Windows 10 增加应用绘制的圆角选项。收藏命令可自动选择图标，也能自选图标。
    Appearance and favorite commands: preview the UI size setting, use application-drawn rounded corners on Windows 10, and choose automatic or custom icons for favorite commands.
  修复与改进 · Fixes and improvements
  - 改进剪贴板不抢焦点时的键盘转发；诊断包增加转发次数、放行原因和错误码，不记录具体按键或搜索词。若仍遇到无法输入，可从设置 › 高级导出诊断日志。
    Improve clipboard keyboard forwarding without taking focus. Diagnostic exports include routing counts, bypass reasons and error codes, without logging keys or search text.
  - 改进创建时间等文件元数据在本地磁盘、文件夹扫描、索引服务和插件结果中的传递、保存与排序。
    Improve propagation, persistence and sorting of creation times and other metadata across local disks, folder scans, the index service and plugin results.
  - 更新 README、使用说明、中英文插件协议和 SDK 示例。社区插件继续使用现有的 WinShun-plugins 仓库。
    Update the README, user guide, Chinese and English plugin protocols and SDK examples. Community plugins continue to use the existing WinShun-plugins repository.
