ReleaseNotes: |-
  Win 顺 0.35.0 带来鼠标手势插件：按住右键画一下就能后退、关窗口、叫出搜索框；收藏可以排成一格格图标，搜索结果里的视频直接在预览里播放，排序多了“打开最多”，长截图也能横着截。软件内更新从这一版起只下载变了的部分，下一次更新起生效。另外可以用指定浏览器打开网页搜索、单击就预览、记住搜索面板是否铺满屏幕，文件夹菜单和直接打字在 Clover、360 文件夹的标签页里也能用。
  新功能 · What's new
  - 🖱️ 鼠标手势（新插件） 插件库里的“鼠标手势”：按住右键画一下，向左后退、向右前进、向上到顶、向下到底，右下关窗口、左下最小化，上下叫出 Win 顺 的搜索框；每个手势可以改成别的动作、按键或打开某个东西，还能加最多 6 笔的手势。单按右键菜单照常出来，全屏程序和列出的程序里不起作用。
    Mouse gestures (new plugin) "Mouse gestures" in the plugin library: hold the right button and draw. Left goes back, right forward, up to the top, down to the bottom, down-right closes the window, down-left minimizes, up-down opens WinShun's search box; each can do another action, send keys or open something, and gestures of up to 6 strokes can be added. A plain right click still brings its menu; full-screen and listed programs are left alone.
  - 🔲 收藏排成图标 设置 › 结果列表 › 收藏的样式选“图标”，没打字时收藏就排成搜索框下的一格格图标，名字在下面；按住拖动换位置，键盘方向键、右键菜单、预览、多选都和列表里一样。
    Favorites as icons Under Settings › Results › Favorites style pick Icons: with nothing typed, favorites become a grid of tiles under the box, names beneath. Hold and drag to reorder; arrow keys, the menu, preview and multi-select work as on rows.
  - 🎬 预览里放视频 MP4、MOV、MKV、AVI、WMV、TS、WebM 在预览里直接播放，下面有播放暂停、拖动进度、静音和音量，用 Windows 自带的解码，有显卡就硬件解码。
    Videos play in the preview MP4, MOV, MKV, AVI, WMV, TS and WebM play right in the preview, with play/pause, seeking, mute and volume underneath, decoded by Windows itself, on the graphics card where it can.
  - 📊 排序：打开最多 第九种排序，从 Win 顺 里打开次数最多的排在最前，其余按匹配程度。
    Sort: Opened most A ninth sort puts what you have opened most often from WinShun first, the rest by best match.
  - ↔️ 长截图可以横着截 左右滚动的内容（宽表格、时间轴）拼成一张宽图；面板上的“竖向/横向”按钮切换，开头时也会自己判断方向（截图与录屏 1.1.23）。
    Sideways long screenshots Content that scrolls left and right (wide tables, timelines) comes out as one wide picture; the panel's Vertical/Horizontal button turns it, and it picks the direction by itself at the start (Screenshot and recording 1.1.23).
  - ⬇️ 增量更新 软件内更新只下载和当前版本相比变了的文件，常常只有完整安装包的几分之一，对不上时自动改下完整包。0.35.0 是第一个带这功能的版本，从下一次更新起生效。
    Delta updates The in-app update downloads only what changed since the version you have, often a fraction of the full installer, and falls back to the full package if anything does not match. 0.35.0 is the first version with it, so it takes effect from the next update.
  改进与修复 · Improvements and fixes
  - 用指定浏览器打开网页搜索：网页搜索插件的设置里选 Windows 默认浏览器、装着的哪个浏览器，或者任意程序。
    Web searches in a chosen browser: in the web search plugin's settings pick Windows' default browser, one of the installed browsers or any program.
  - 点击结果多了“单击预览”：单击选中并显示预览，双击或回车打开。
    A third click mode, Click to preview: one click selects and previews, a double click or Enter opens.
  - 回到上次的位置：设置里打开后，再次用同样的词打开搜索框，停在上次那一行，列表也滚到原来的位置（默认关，#361）。
    Reopen where you left off: when on, opening the box again on the same words comes back to the row you left, the list scrolled as it was (off by default, #361).
  - 钉住的搜索框可以不在最前：设置 › 结果列表 › 操作习惯里关掉“钉住时在最前”，别的窗口就能盖住它，按快捷键再叫回来。
    A pinned box need not stay on top: turn off "Stay on top when pinned" and other windows can cover it; the shortcut brings it back.
  - 搜索面板的“铺满屏幕”按钮：标题栏多了铺满屏幕 / 还原大小（F11 照旧），下次打开记得是否铺满。
    Fill the screen in the search panel: the header has Fill screen / Restore (F11 as before), remembered for the next panel.
  - Clover 和 360 文件夹的标签页里：双击空白处的文件夹菜单和直接打字搜索也能用了。
    Clover and 360 Folder tabs: the folder menu on a blank double click and typing to search work there too.
  - 书签插件读 Firefox：Firefox 各个配置文件的书签和历史记录都能搜到，LibreWolf、Zen 之类指定 places.sqlite 即可（书签 2.2.0，更新时会请你确认读文件的权限）。
    Bookmarks from Firefox: bookmarks and history from every Firefox profile, and LibreWolf, Zen and the like by naming their places.sqlite (Bookmarks 2.2.0; the update asks you to confirm its file-reading permission).
  - 检查更新更及时：每 10 分钟问一次（没变时几乎不占流量），新版本在发布后一天内分批提示；重要更新会马上提示。
    Updates noticed sooner: WinShun checks every 10 minutes (almost no traffic when nothing changed); a new version is announced to everyone within a day, an important one at once.
  - 插件启动失败时说清原因：提示里写出 Windows 自己的错误说明，日志里记下程序和工作目录。
    Plugin start failures say why: the message carries Windows' own error text, and the log names the program and working folder.
  - 拾穗计划里加入 QQ 群：“进官网反馈”旁边多了加入 QQ 群的二维码和群号。
    Join the QQ group from 拾穗计划：a QR code and group number beside the feedback button.
