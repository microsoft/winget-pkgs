ReleaseNotes: |-
  Win 顺 0.33.0 让文件夹菜单一列列并排展开；贴图可以原地编辑；截图翻译有了自己的快捷键，框选前按 Tab 只框整个窗口；winshun:// 链接能从网页、笔记里打开搜索框或设置；界面大小多了一档“密集”；搜索框里按 Tab 一层层进文件夹，Ctrl+Backspace 退回来；文件右键菜单可以复制 SHA-256。另外“另存为”对话框旁的搜索框不再乱跳，对话框最大化时停在屏幕底部的任务栏上，不挡标题和地址栏。
  新功能 · What's new
  - 🗂️ 文件夹菜单一列列并排展开 在文件夹菜单里，鼠标在一个文件夹上停一下（或按 →），右边就展开一列，列出里面的文件夹，可以一列列往下走，前面的列都留着，来时那一行一直高亮；右边放不下时改向左展开。鼠标斜着移向新的一列，路过的行不会被打开（#348）。
    Folder menu columns side by side Rest the pointer on a folder in the folder menu (or press →) and a column opens beside it with the folders inside; go on column after column while the earlier ones stay, the row you came from highlighted. Where the screen ends on the right they open to the left, and moving diagonally toward a new column opens none of the rows you pass (#348).
  - ✏️ 贴图原地编辑 贴图按 E 或右键“编辑”，不再打开新窗口，工具条直接长在贴图上；Enter 换成改好的图，Esc 保持原样。点一下贴图停一会儿，屏幕左下角列出它能用的按键，? 或 F1 随时显示 / 隐藏（截图与录屏 1.1.19，#343）。
    Edit a pin where it is E, or Edit in a pin's menu, no longer opens a window: the toolbar grows on the pin itself; Enter puts the edited picture on the pin, Esc leaves it as it was. Click a pin and pause, and its keys are listed in the bottom-left corner; ? or F1 shows or hides them (Screenshot and recording 1.1.19, #343).
  - 🌐 截图翻译有自己的快捷键 在截图设置“快捷键”里录一个“截图翻译”的键（默认不设），按下后拖选一块或单击窗口，松开鼠标译文就贴在原来的位置，不用再点工具条（截图与录屏 1.1.19，#356）。
    Screenshot translation on a hotkey Record a “Translate screen region” key under Shortcuts in the capture settings (none by default); press it, drag over an area or click a window, and on release the translation sits where the words were, with no toolbar to click (Screenshot and recording 1.1.19, #356).
  - 🪟 框选前按 Tab 只框整个窗口 和 Snipaste 同一个键：窗口里的按钮、输入框不再单独框出来，再按一次恢复；选择会记住，识别屏幕文字和截图翻译时也能用。框选前 Shift+方向键一次挪 10 像素（截图与录屏 1.1.19，#360）。
    Tab outlines whole windows only The key Snipaste uses: before selecting, the buttons and boxes inside windows are no longer picked one by one, and Tab again brings them back; the choice is kept and works when reading or translating text on screen too. Shift+arrow keys move the pointer ten pixels at a time before a selection (Screenshot and recording 1.1.19, #360).
  - 🔗 winshun:// 链接 网页、Obsidian 这类笔记软件、桌面快捷方式里的 winshun://search/关键词 点一下就打开搜索框并搜好，winshun://settings/appearance 这样的链接直接打开设置的某一页。链接从不打开文件；设置 › 打开 Win 顺 › 对话框里可以关掉（默认开）（#358）。
    winshun:// links A winshun://search/words link in a web page, a notes app such as Obsidian or a desktop shortcut opens the search box with those words searched; one such as winshun://settings/appearance opens that page of the settings. Links never open files; turn them off under Settings › Open WinShun › Dialogs (on by default) (#358).
  - 📏 界面大小“密集” 设置 › 外观 › 界面大小多了“密集”一档：搜索框每条结果只占一行，名字和灰色的文件夹排在同一行，一屏看得更多（#352）。
    Dense interface size Settings › Appearance › Interface size has a Dense step: each result in the search box takes one line, the name and its grey folder side by side, so more fit on the screen (#352).
  - ↪️ Tab 一层层进文件夹，Ctrl+Backspace 退回来 用 ↑ ↓ 选中搜到的文件夹按 Tab，搜索框就变成它的路径、列出里面的东西，接着打字就在里面找；Ctrl+Backspace 退回一层，原来的搜索词和范围都回来（#361）。
    Tab into folders, Ctrl+Backspace back out Pick a folder found with ↑ ↓ and press Tab: the box holds its path and lists what is in it, ready to search there; Ctrl+Backspace comes back a level, with the words and the scope searched before (#361).
  - 📄 搜索面板“内容”里单击只选中 内容详情开着时，单击列表里的文件只选中它、右边跟着换，双击或 Enter 才打开，看匹配不用一个个打开文件；F11 让面板铺满屏幕，再按一次还原（#354）。
    A click only selects in the panel's Content With the content details open, a click on a file selects it and the details follow; a double-click or Enter opens it, so the matches can be read without opening the files. F11 fills the screen with the panel, and again puts it back (#354).
  - #️⃣ 文件右键菜单复制 SHA-256 搜索框里文件行的右键菜单多了“复制 SHA-256”，点一下摘要就进了剪贴板；“复制 MD5”“复制 SHA-1”在小工具卡片上打开（小工具 1.2.0，感谢 ra9fael，#345）。
    Copy a file's SHA-256 from its menu A file row's right-click menu has Copy SHA-256, which puts the digest on the clipboard; Copy MD5 and Copy SHA-1 are switched on from the Tools card (Tools 1.2.0, thanks to ra9fael, #345).
  改进与修复 · Improvements and fixes
  - “另存为”旁的搜索框不再乱跳：选“自动”时，对话框下面放不下两行结果，搜索框就跑到旁边去；对话框最大化时它压在顶部，挡住标题和地址栏。现在只要放得下搜索框本身，它就一直贴在对话框下面，列表往上展开；对话框很高或最大化时，它停在屏幕底部的任务栏上（最宽 800，托盘和时钟还露着），和 Listary 一样（#362）。
    The bar by Save As dialogs no longer jumps about: on Auto it moved beside a dialog that left no room for two rows under it, and over a maximised dialog it covered the title and the address bar. It now stays under the dialog while the bar itself fits there, its list opening upward; under a tall or maximised dialog it sits over the taskbar at the bottom of the screen (at most 800 wide, the tray and clock still in view), as Listary does (#362).
  - 小工具 1.2.0 修了一批毛病（感谢 ra9fael，#345）：GiB / MiB / KiB 严格按 1024 换算，数据大小的说明换成中文；时间戳保留毫秒，微秒、纳秒也认；5!、80*15%、0xff 能直接算；sha384、sha512 可用，网络路径（\\服务器\共享\文件）也能算哈希，文件不存在会说清楚；带点的文字（比如 a.b）按文字算哈希，不再报“找不到文件”；清空计算记录前先确认，确认行上按 Shift+Enter 保留记录。
    Tools 1.2.0 fixes (thanks to ra9fael, #345): GiB / MiB / KiB are strictly 1024-based and the data-size notes are localised; timestamps keep their milliseconds and microsecond and nanosecond ones are read; 5!, 80*15% and 0xff calculate directly; sha384 and sha512 are there, network paths (\\server\share\file) hash too and a missing file is said plainly; text with a dot (a.b) is hashed as text instead of "no such file"; clearing the calculation history asks first, and Shift+Enter on that row keeps it.
  - 搜索面板的 Ctrl+Shift+1…5 能切换标签了：以前在 Windows 上按了没反应；面板铺满时也对齐到像素（#354）。
    Ctrl+Shift+1…5 switch the panel's tabs: they did nothing on Windows before; the panel filling the screen lines up to the pixel too (#354).
  - 搜索框底部的按键提示：窄的搜索框里，Ctrl+Enter 的提示先让位，Enter 一直看得见。
    Key hints at the foot of the search box: in a narrow box the Ctrl+Enter hint gives way first, so Enter stays in view.
  - 插件设置里有范围的数字用滑块：插件清单里的 number 设置写了 min 和 max（可再写 step、unit），设置卡片上就是滑块加输入框，超出范围的值自动拉回（#359）。C++ 插件 SDK 可以改自己的设置、打开自己的设置窗口（感谢 ra9fael，#347）；files 触发可以用 "if" 只在某个开关打开时出现在右键菜单里。
    Sliders for plugin numbers with a range: a number setting with min and max in a plugin's manifest (step and unit too) is a slider with a box on its card, and values out of range are brought back in (#359). The C++ plugin SDK can change the plugin's own settings and open its own settings window (thanks to ra9fael, #347); a files trigger can show in the right-click menu only while a switch is on, with "if".
  - WinGet 安装说明：README 和使用说明写了用 winget 安装、更新、卸载的方法（感谢 ra9fael，#336）。
    WinGet docs: the README and the guide show how to install, update and uninstall with winget (thanks to ra9fael, #336).
  插件库更新 · Plugin library updates
  - 截图与录屏 1.1.19 截图翻译快捷键（#356）、贴图原地编辑和按键卡片（#343）、框选前 Tab 只框整个窗口（#360）、Shift+方向键挪 10 像素，窗口跟着新的“密集”界面大小变。权限不变。
    Screenshot and recording 1.1.19: the translation hotkey (#356), editing a pin in place and its key card (#343), Tab for whole windows only (#360), Shift+arrows by ten pixels, and the windows follow the new Dense size. Permissions unchanged.
  - 图片文字搜索 1.0.18 用 Win 顺 0.33.0 的共用代码重新打包，界面跟着新的“密集”界面大小变；需要主程序 0.33.0。权限不变。
    Picture text search 1.0.18: rebuilt with WinShun 0.33.0's shared code, following the new Dense size; requires WinShun 0.33.0. Permissions unchanged.
  验证范围 · Verification
  本版在开发机上把正式版 0.32.0 用应用内更新真实升级到 0.33.0（50.7 秒），新版本以普通权限启动，索引服务、开机自启、设置和搜索历史都在；安装程序在文件被占用的五种情形下的安装和升级也都实测通过。改动涉及的自动测试全部通过。“另存为”旁搜索框的新位置（#362）用真实的另存为对话框实测过普通、贴着屏幕底部和最大化三种情形；文件右键菜单的哈希项和卡片开关这次没有在真实右键菜单里点过，靠自动测试覆盖；没有在干净的 Windows 10 虚拟机里试首次启动。
  On the development PC, a released 0.32.0 was really updated to 0.33.0 through the in-app update (50.7 s); the new version started with normal rights, and the index service, autostart, settings and search history were intact. Installing and upgrading with files held in five different ways also passed. The automated tests for the changes all passed. The new place of the bar by Save As dialogs (#362) was tried with a real Save As dialog: in the middle of the screen, reaching its bottom, and maximised. The hash items of the file menu and their card switches were not clicked in a real right-click menu this time and rest on the automated tests; a first start on a clean Windows 10 virtual machine was not done.
