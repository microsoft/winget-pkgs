ReleaseNotes: |-
  Win 顺 0.23.0 新增第四种界面风格“液态玻璃”，右键 Logo 可以一键回位，搜索范围在重启后保留。以管理员身份运行的程序在前面时，F1、PrintScreen 等单键快捷键也能用；“包括 U 盘和移动硬盘”现在也涵盖自称固定磁盘的移动硬盘。插件卡片可以直接向作者反馈问题，带管理员权限的插件也能复用 Win 顺 的 Qt。另外修复退出卡顿、便携版更新回滚、卸载后 Win+V 失效等问题。 WinShun 0.23.0 adds a fourth interface style, Liquid Glass, one-click logo actions and a search scope that survives restarts. Plain hotkeys such as F1 and PrintScreen work while an administrator's window is in front, and the USB drives option now covers external disks that report themselves as fixed. Plugin cards can send problems straight to the plugin's author, and elevated plugins can use WinShun's Qt. Fixes include slow exits, rolled-back portable updates and Win+V not returning after uninstall.
  新功能 · What's new
  - 🫧 液态玻璃界面风格 外观页新增第四种界面风格：Windows 原生亚克力背景配克制的玻璃表面，浅色深色都有。两个滑块调节透明度和清晰度，拖动时即时预览；窗口不在前台时也保留亚克力效果。
    Liquid Glass style Appearance offers a fourth interface style: Windows' native Acrylic behind restrained glass surfaces, in light and dark. Two sliders set transparency and clarity with a live preview, and the Acrylic stays visible while the window is inactive.
  - 🖱️ 右键 Logo 一键回位 在 设置 › 结果列表 › 操作习惯 › 右键 Logo 的行为 中，可以把右键从位置菜单改为直接靠上、居中或回到上次拖动的位置。Logo 的提示会写明当前动作；每种风格都有看得见的拖动手柄。
    One-click logo actions Under Settings › Result list › Habits, a right click on the logo can go straight to the top, the center or the last dragged position instead of opening the position menu. The tooltip names the action, and every style shows visible drag grips.
  - ⌨️ 管理员窗口在前时的单键快捷键 以管理员身份运行的程序在前面时，不带修饰键的 F1–F24 和 PrintScreen 快捷键（例如截图键）也能触发，需要安装索引服务。便携版或 Scoop 安装的索引服务版本较旧时，会提示一键更新。
    Plain hotkeys over administrators' windows F1–F24 and PrintScreen without modifiers, such as a screenshot key, now fire while a program run as administrator is in front. This needs the index service. Portable and Scoop copies with an older service offer a one-click update.
  - 🧭 记住搜索范围 自己选的范围（全部、文件、内容或某个类型）在下次启动时恢复。临时输入的前缀、插件结果不会改变它；开着“每次打开时清空搜索”时仍从“全部”开始。
    Search scope remembered The scope you chose (All, Files, Content or a kind) comes back at the next start. Typed prefixes and plugin rows do not change it, and Clear the search on every opening still starts in All.
  - 💽 移动硬盘也算外接盘 “包括 U 盘和移动硬盘”现在也涵盖自称固定磁盘的移动硬盘和高速 U 盘（USB、1394 连接）。关掉这项时它们不进索引、不被占用，火绒等先检查占用的弹出工具不再被挡住。
    External disks count as external The USB drives option now also covers external hard disks and fast USB sticks that report themselves as fixed (USB or 1394). With the option off they are neither indexed nor held open, so eject tools that check open handles first are no longer blocked.
  - 🧩 插件问题找作者 别人写的插件由作者维护。插件卡片的“…”菜单新增“向作者反馈问题”，直接打开作者仓库的 Issues；没写主页的插件，“主页”打开插件库登记的仓库。插件库条目的版本号旁也有主页链接。
    Plugin problems go to their authors Plugins by others are maintained by their authors. A card's "…" menu now has Report a problem to the author, which opens the Issues of the plugin's repository. A plugin without a homepage gets its listed repository as Homepage, and library entries link to their homepage beside the version.
  改进与修复 · Improvements and fixes
  - 带 elevated 权限的插件也能声明 runtime.qt: "host" 复用 Win 顺 的 Qt。以管理员身份运行时只使用 Win 顺 自己文件夹里的 Qt；清单需写 "minWinShun": "0.23.0"。插件库对带 exe/dll 的社区包自动标为“未审核的原生插件”收录，安装和每次更新仍由用户确认。
    Plugins with the elevated permission can declare runtime.qt: "host" too. As administrator only the Qt in WinShun's own folder is used; such manifests need "minWinShun": "0.23.0". The plugin library now labels community packages with exe or dll files as unreviewed native instead of refusing them, and users still confirm each installation and update.
  - 新增“再次打开时恢复预览”（设置 › 结果列表 › 文件快速预览），关掉后搜索框收起时预览一起关闭。常驻插件同时运行的上限可选 4、8、16 或不限。从结果切换到的文件夹窗口会记入最近文件夹。
    Restore preview on reopen can now be turned off so the preview closes with the launcher. The number of resident plugins kept running can be 4, 8, 16 or unlimited. A folder window switched to from the results is remembered among recent folders.
  - 修复“最近使用”开着时退出要等 15 到 50 秒：读取 Windows 最近使用的快捷方式时不再解析其目标，失效的网络位置不会拖住退出。
    Exiting no longer waits 15 to 50 seconds with Recent folders on: Windows' recent shortcuts are read without resolving their targets, so a gone network location cannot hold up the exit.
  - 便携版在“管理员直读”下应用内更新后不再退回旧版本。卸载时如果 Win 顺 接管过 Win+V 或 Win+S，会重启资源管理器让快捷键立即恢复，有文件夹窗口开着时先询问。
    An in-app update of a portable copy under administrator reading no longer rolls back. When uninstalling gives Win+V or Win+S back, File Explorer is restarted so they work at once, asking first if folder windows are open.
  - 插件执行动作后打开的窗口能正常来到最前面。安装插件时遇到残留的插件文件夹会询问处理方式，卸载失败时插件保持完整。开发者日志的插件筛选在插件多时改为下拉列表。
    A window a plugin opens after an action now comes to the front. Installing over a leftover plugin folder asks what to do, and a failed uninstall leaves the plugin whole. The developer log's plugin filter becomes a dropdown when there are many plugins.
  - 软件渲染下拖放圆盘等待时也能被拖动发现；对话框旁两行结果的间距更均衡；搜索历史弹窗宽度贴合内容；Python 安装管理器的解释器解析修复；剪贴板链接在浏览器打开前再次确认是网址。功能图标统一使用 Phosphor。
    The waiting drop pie is found by drags under the software renderer, two-line dialog results are better spaced, the search history popup fits its content, Python install manager interpreters resolve correctly, and clipboard links are checked again before opening in a browser. Function icons consistently use Phosphor.
  插件库更新 · Plugin library updates

  | 插件 · Plugin                         | 新版本 · Version |
  | ------------------------------------- | ---------------- |
  | 截图与录屏 · Screenshot and recording | 1.1.9            |
  | 图片文字搜索 · Image text search      | 1.0.9            |

  截图 1.1.8 起，长截图、图片文件和剪贴板图片贴到屏幕时保留原图像素，比屏幕大的按适配比例显示，放大不再发糊（#269，感谢 csdjk）；1.1.9 让贴图拖选文字的提示不再挡住文字（#258）。图片文字搜索 1.0.9 支持液态玻璃风格。两者都可在旧版 Win 顺 上更新，最低版本分别为 0.18.0 和 0.22.0。
  Since capture 1.1.8, long screenshots, picture files and clipboard pictures are pinned at their own pixels, fitted when larger than the screen and sharp when zoomed (#269, thanks to csdjk); 1.1.9 keeps the text pick's hint off the words (#258). Image text search 1.0.9 follows the Liquid Glass style. Both update on earlier WinShun versions, requiring 0.18.0 and 0.22.0 respectively.
  当前发布的验证范围见 0.23.0 发布验证记录。插件开发者请同步查看中英文插件文档和 SDK 开发说明。
  See the 0.23.0 release validation record for the verification scope, and the plugin documentation and SDK development guide for integration details.
