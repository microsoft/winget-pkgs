ReleaseNotes: |-
  Win 顺 0.42.0 带来剪贴板同步（新插件）：在自己的几台 Windows 电脑和 Mac（Mac 顺）之间，这边复制、那边直接粘贴文字、图片、文件和文件夹，端到端加密，不用账号也没有服务器。OneCommander 里也能直接打字搜索了；截图可以跨屏框选；新的“粘贴为纯文本”快捷键在任何程序里都能用；搜索框的阴影可以调浅或关掉；插件关键字后面按 Shift+Tab 改成按名字搜；剪贴板里的图片可以点开看大图；鼠标手势可以设一个快捷键，选中文字后按它就翻译，浏览器里也能用。正则搜索快了很多，空文件夹的标记挪到名字后面，Windows 10 1809（LTSC 2019）上也能录屏了，国内可以从 CNB 镜像下载。
  新功能 · What's new
  - 🔁 剪贴板同步（新插件，插件库）：在自己的几台 Windows 电脑和装了 Mac 顺 的 Mac 之间同步剪贴板，这边复制，那边直接粘贴文字、图片、文件和文件夹。
    - 第一次配对：在新的那台上打 同步，会列出“附近的「…」”，按 Enter 请求加入（也可以直接输入对方的地址）；另一台弹出请求，两边显示同一串 6 位数字时同意就行。和 Mac 顺 一样，开着同步就能收到请求，同一台设备 8 秒内只能请求一次，不想被打扰可以在插件设置里关掉。不在同一个网段（比如走 Tailscale）也可以在一台上选“复制邀请码”，粘贴到另一台的 同步 后面。
    - 文件：别的设备复制了文件，右下角提示一下，不会自己下载（和 Mac 顺 一样）；在 同步 里按 Enter 接收并放进剪贴板，直接粘贴，按 Ctrl+Enter 存到“下载”并在资源管理器里选中。想让小文件自己过来，可以设一个自动接收的大小。收下来的文件修改时间和原来一样。路由器隔开、连不上第二条连接时，自动改走已经连着的那条。
    - 安全：每台设备之间端到端加密（X25519 + AES-256-GCM），不用账号，也不经过任何服务器；移除一台设备会换掉全组的密钥。密码管理器复制的内容不同步。
    - 组里的设备上按 Enter 把剪贴板只发给它，Ctrl+Enter 连按两次移除它；可以暂停同步。和 Mac 顺 用同一套协议（ShunSync v1），双方用同一份测试向量核对过。
    Clipboard sync (new plugin, in the plugin library): copy on one of your Windows PCs or Macs running Mac 顺，paste on another: text, pictures, files and folders. Pair once: on the new device, the other's "… nearby" row in sync (or its address), and agree on the other when both show the same six digits; as with Mac 顺，requests are taken whenever sync is on (once in 8 s per device; it can be turned off). Across networks (Tailscale), the invite code from Copy the invite code works too. Files copied elsewhere are offered with a notification, not downloaded by themselves (as Mac 顺): Enter receives them onto the clipboard, Ctrl+Enter into Downloads; a size to receive by itself can be set. They keep their modification times. When a router keeps a second connection from opening, files come over the one already open. End to end encrypted (X25519 + AES-256-GCM), no account, no server; removing a device changes the whole group's key. Password managers' copies stay put. Enter on a device sends it the clipboard alone, Ctrl+Enter twice removes it; sync can be paused. The same protocol as Mac 顺 (ShunSync v1), checked against the same test vectors.
  - 📂 OneCommander 里直接打字搜索：在 设置 › 系统整合 › 文件管理器 打开“在 OneCommander 里直接打字搜索”（默认关），文件列表有焦点时输入字母或数字，就用 Win 顺 搜这一栏的文件夹，代替 OneCommander 自带的“起始：”筛选。搜索框出现在这一栏文件列表的右下角，打开文件夹就在原来那一栏里转过去；侧栏、标签、工具栏有焦点时，以及改名、地址栏里的输入，都照常交给 OneCommander。
    Type to search in OneCommander: turn it on in Settings › Integration › File managers (off by default). Letters or digits typed in a file list search that pane's folder with WinShun instead of OneCommander's own "starts with" filter; the box sits in that list's bottom-right corner, and a folder opened goes to the same pane. Keys in its sidebar, tabs and toolbars, renaming and the address bar stay OneCommander's.
  - 🖥️ 跨屏截图：选区可以从一块屏幕拖到另一块，或把选区、选区的边拖过去；滚轮滚过“整个屏幕”再滚一格，就框住所有屏幕，单击全选。截出来的图是每块屏幕自己的像素拼在一起（缩放不同也不糊），没有屏幕的地方是黑的。长截图和录屏不支持跨屏，会提示（截图与录屏 1.1.30，#409）。
    Screenshots over several monitors: a selection can be drawn from one monitor onto another, or dragged across; one wheel step past the whole screen outlines every monitor and a click takes them all. The picture is each monitor's own pixels side by side, whatever its scaling, black where there is no monitor. Long screenshots and recording say they need one monitor (Screenshot and recording 1.1.30, #409).
  - 📋 粘贴为纯文本的快捷键：在 设置 › 剪贴板 › 呼出剪贴板 里设一个快捷键（默认没有），在任何程序里按下，就把剪贴板里的内容去掉格式再粘贴，和 PureText 一样；剪贴板历史关着也能用（#408）。
    A key to paste as plain text: set one under Settings › Clipboard (none by default); pressed in any program it pastes the clipboard's text without its formatting, as PureText does, with the history off too (#408).
  - 🌗 搜索框阴影：觉得搜索框四周发黑，可以在 设置 › 外观 里选“浅”或“无”。“浅”只在 Windows 11 的圆角窗口上有；Windows 只给带阴影的窗口画圆角，所以选“无”时搜索框变成直角。搜索面板和其他窗口照常有阴影（#412）。
    Search box shadow: if the edge around the search box looks dark, choose Light or None in Settings › Appearance. Light is there on Windows 11 with round corners; Windows rounds only windows with a shadow, so with None the box has square corners. The search panel and other windows keep theirs (#412).
  - 🔍 剪贴板看大图：预览里点一下图片（或者搜索框空着时按空格），就在剪贴板旁边弹出大图，按屏幕能放下的大小显示；滚轮放大缩小，双击看原始大小，放大后可以拖着看，↑ ↓ 换条目时跟着换，Esc 关闭。复制的单个图片文件在预览右上角点放大镜。图片里识别出的文字默认收起，点“图中的文字”展开，下次还记得；收起时照样能按图里的字搜到图（#414）。
    Pictures large in the clipboard: click a picture in the preview (or press Space with nothing typed) and it opens large beside the clipboard, as big as the screen has room for; the wheel zooms, a double click shows its actual size, a zoomed picture can be dragged, ↑ ↓ follow the entries and Esc closes it. A copied picture file has a magnifier in its preview's corner. The text read in a picture is folded until you unfold "Words in the picture" (remembered); the search still finds the picture by it (#414).
  - 🖱️ 选中文字后按快捷键翻译（鼠标手势 2.1.0）：在手势设置窗口“选中文字时”一页下面录一个快捷键（比如 Ctrl+Alt+T），选中一段字按它就翻译，动作也可以改成复制、网页搜索等。浏览器、VS Code、微信里也能用：读不到选中的字时，Win 顺 替你按一下 Ctrl+C，读完马上把剪贴板原样放回去，Win 顺 自己的剪贴板历史里不会多一条（Windows 自带的 Win+V 历史会记下这段字）。快捷键被别的程序占着时标成红色。
    A shortcut for selected text (Mouse gestures 2.1.0): record one at the bottom of the 选中文字时 page of the gestures window (e.g. Ctrl+Alt+T); select some text and press it to translate, or have it copy, search the web and so on. It works in browsers, VS Code and WeChat too: where the selection cannot be read, WinShun presses Ctrl+C for you and puts the clipboard back at once, with no new entry in its own clipboard history (Windows' own Win+V history keeps the words). A shortcut another program holds is shown in red.
  - ⌨️ 关键字后按 Shift+Tab 改成搜名字：打 disk ??? 会交给关键字是 disk 的插件；这时按 Shift+Tab，关键字加上引号（"disk" ???），就变成按名字搜。底部提示和快捷键面板里都写着（#411）。
    Shift+Tab after a plugin keyword searches names: disk ??? goes to the plugin whose keyword is disk; Shift+Tab quotes it ("disk" ???) and the box searches names instead. The footer and the shortcuts panel say so (#411).
  改进与修复 · Improvements and fixes
  - 正则搜索快多了：正则模式下先按表达式里一定会出现的那段字筛一遍名字，再跑正则；300 万个名字上 disk.* 从 1 秒多到 6 毫秒，打字时列表不再一下下变灰（#411）。
    Regex search is much faster: names are first narrowed by the plain text every match must contain, then the expression runs; disk.* over 3 million names went from over a second to 6 ms, so the list no longer greys out at every key (#411).
  - 空文件夹、空文件的标记挨着名字：“空文件夹”“空文件”改成名字后面的小标签，选中的那一行也看得到（#391）。
    The empty tag sits by the name: Empty folder / Empty file is a small tag right after the name, on the selected row too (#391).
  - 当 Everything 用时回答完整：别的程序通过 Everything 接口问一个超过 20 万个文件的文件夹，以前只拿到前 20 万个，总数也少算；现在给全部，只按回答的大小（512 MB）封顶（#399）。
    Whole answers as Everything: a program asking for a folder of more than 200 000 files got the first 200 000 and a total that small; it now gets them all, capped only by the answer's size (512 MB) (#399).
  - Windows 10 1809（LTSC 2019）上能录屏了：以前一开始录就提示“录屏失败：不支持此接口（0x80004002）”；现在系统的新录屏接口用不了时，改用老办法读屏幕，画面和鼠标指针照常录进去。录屏出错时的提示会写明是哪一步失败的（截图与录屏 1.1.30）。更正：0.34.2 的说明写“1809 到 1909 上录屏……现在能录”，实际上那时只修好了 1903 到 1909，1809 到这一版才能录。
    Recording on Windows 10 1809 (LTSC 2019): it failed at once with "不支持此接口 (0x80004002)"; where Windows' newer capture cannot start, the screen is now read the older way, pointer included, and recording errors name the step that failed (Screenshot and recording 1.1.30). A correction: the 0.34.2 notes said recording worked on 1809 to 1909; only 1903 to 1909 did then, and 1809 does from this version.
  - 鼠标手势：在浏览器里按住右键滚滚轮切标签页，第二下起不再失灵：在 Edge、Chrome 等浏览器的网页上按住右键滚滚轮，第一下能切到下一个标签页，接着浏览器就失去焦点，再滚也切不动；现在一直滚一直切（鼠标手势 2.1.0）。
    Mouse gestures: the wheel with the right button held keeps switching browser tabs: over a page in Edge, Chrome and other Chromium browsers, the first notch switched the tab and then the browser lost the focus, so the next ones did nothing; every notch switches now (Mouse gestures 2.1.0).
  - 文件夹菜单的完整路径也听“悬停提示”的：在 设置 › 外观 关掉“悬停提示”后，文件夹菜单里停在一行上不再弹出完整路径；名字太长被截断的那一行仍会显示。菜单的其他功能不变（#413）。
    The folder menu's full paths follow Hover tips: with Hover tips off in Settings › Appearance, resting on a folder menu row no longer brings up its full path, except on a row whose name is cut off. The rest of the menu is unchanged (#413).
  - 截图卡住时记得更全：截图遮罩出来后卡住时，诊断记录里多记下那一刻屏幕刷新和桌面合成是否也停了、显卡是否重置过，导出诊断时再带上显示器、显卡驱动的相关设置和系统日志里的显卡事件，下次能直接从记录里找到原因（截图与录屏 1.1.30，#325）。
    More recorded when a screenshot stalls: when the overlay hangs, the capture's record now says whether the screen's refresh and the desktop's composition stopped too and whether the graphics were reset; an exported diagnostics package adds the monitors, the graphics drivers' relevant settings and the graphics events in the System log, so the cause can be read from the record (Screenshot and recording 1.1.30, #325).
