ReleaseNotes: |-
  Win 顺 0.10.0：界面可以换成直角，和 Windows 10 一样；序号按住 Ctrl 才显示，列表更清爽；管理员窗口里也能双击 Ctrl；VBA 宏的“浏览文件夹”也有搜索框；StartAllBack 的经典任务栏也能放搜索框；出了问题可以一键导出诊断日志。WinShun 0.10.0: square corners as in Windows 10; the row numbers show while Ctrl is held, for a cleaner list; double Ctrl works in administrator windows; the search bar comes to VBA's "Browse For Folder" box; the search box fits StartAllBack's classic taskbar; one click exports diagnostic logs when something goes wrong.
  新功能 · What's new
  - ◻️ 圆角或直角：设置 › 外观 › 圆角里选“直角”，窗口、菜单、按钮、输入框和任务栏搜索框都不带圆角，和 Windows 10 一样；Windows 10 上一直是直角。
    Rounded or square corners: pick Square under Settings › Appearance › Corners and windows, menus, buttons, input boxes and the taskbar search box lose their rounded corners, as in Windows 10; on Windows 10 they are always square.
  - 🔢 序号按住 Ctrl 才显示：结果图标上的 Ctrl+1～Ctrl+9 平时不显示，按住 Ctrl 一下就淡入，松开就消失；Ctrl+1 照样直接打开第一行。设置 › 结果列表 › 序号提示里可以改成一直显示或不显示，剪贴板的 Alt+1～Alt+9 也一样。目录、日期这些辅助文字也改小了一号，名字更醒目。
    Row numbers while Ctrl is held: the Ctrl+1–Ctrl+9 on the result icons stay hidden until you hold Ctrl, and fade out when you let go; Ctrl+1 still opens the first row straight away. Settings › Result list › Number key hints shows them always or never, for the clipboard's Alt+1–Alt+9 too. Folders and dates are a size smaller, so the names stand out.
  - ⌨️ 管理员窗口里也能双击 Ctrl：以前在管理员身份运行的程序、部分输入法窗口里双击 Ctrl 没反应，现在由索引服务帮忙收听，Win 顺 本身仍是普通权限。
    Double Ctrl in administrator windows: double Ctrl used to do nothing over programs run as administrator and some input method windows; the index service now listens for it there, while WinShun itself keeps normal rights.
  - 📂 “浏览文件夹”对话框也有搜索框：VBA 宏、Shell.Application.BrowseForFolder 和老程序弹出的那种只有一棵文件夹树的对话框，下面也有 Win 顺 的搜索框，Ctrl+G 转到资源管理器正开着的文件夹。32 位 Office 也行，论坛上的需求。
    A search bar for "Browse For Folder": the box with nothing but a folder tree that VBA macros, Shell.Application.BrowseForFolder and older programs show now gets WinShun's search bar, and Ctrl+G goes to the folder open in File Explorer. 32-bit Office too; asked for on the forum.
  - 🔎 任务栏搜索框更灵活：装了 StartAllBack 或 ExplorerPatcher 的经典任务栏也能放 Win 顺 的搜索框；搜索框可以单独用，也可以和 Windows 搜索并存，隐藏 Windows 搜索、接管 Win+S、开始菜单里打字都是各自的开关；放在开始按钮右边空间不够时，搜索框先缩短，再变成标签或图标。
    A more flexible taskbar search box: it fits the classic taskbar of StartAllBack and ExplorerPatcher too; it works on its own or alongside Windows search, with hiding Windows search, taking over Win+S and typing in the Start menu as separate switches; right of Start with little room, it gets shorter first, then turns into a label or an icon.
  - 🩺 一键导出诊断日志：索引很慢或出了问题时，到设置 › 高级 › 诊断日志点“导出诊断日志”，把 WinShun-diagnostics.zip 发给开发者就行。里面是版本、系统、磁盘、索引进度和错误，不含设置、剪贴板、搜索历史和文档正文；日志有大小上限，7 天不用自动清理。
    Diagnostic logs in one click: when indexing is slow or something is wrong, click Export diagnostic logs under Settings › Advanced › Diagnostic logs and send the WinShun-diagnostics.zip. It holds the version, system, disks, indexing progress and errors, never your settings, clipboard, search history or document text; the logs are capped in size and cleared after 7 days unused.
  - 🌐 网站图标可以直接编辑 SVG：网页搜索的编辑窗口改为居中、更紧凑；网站图标可以粘贴 SVG 代码当场改，复制了 SVG 时自动填进去，写错了会提示，旁边就是预览。
    Edit a site's SVG icon: the web shortcut editor opens centred and more compact; a site's icon can be pasted as SVG code and edited on the spot, SVG on the clipboard fills in by itself, mistakes are pointed out, and the preview sits beside it.
  - 🛠️ 其他改进：选“文件”时下面那排类型和窗口一起展开、收起，不再先跳一下；第一次打开搜索框时的卡顿去掉了；搜索框的图钉、展开按钮和剪贴板的按钮更大更好点；结果列表、剪贴板、对话框旁的搜索框和预览里，滚轮滚动统一顺滑，文字始终落在整像素上更清晰；设置里的“结果列表”分成几个标签页，文件管理器选项放不下时自动换行；系统关闭了动画时，Win 顺 也不播动画。
    Other improvements: the row of kinds under Files opens and closes together with the window, with no jump first; the stall on the first opening of the search box is gone; the pin and expand buttons and the clipboard's buttons are larger and easier to hit; the result list, the clipboard, the dialog search bar and the preview scroll alike under the wheel, with text kept on whole pixels and sharper; the Result list settings are split into tabs, and the file manager choices wrap when they don't fit; with animations turned off in Windows, WinShun doesn't animate either.
