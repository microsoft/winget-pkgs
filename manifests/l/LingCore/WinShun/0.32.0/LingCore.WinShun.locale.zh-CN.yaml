ReleaseNotes: |-
  Win 顺 0.32.0 让结果可以用右键拖到资源管理器，选复制还是移动；对话框旁的搜索框改成和搜索框一样“回车打开、Ctrl+Enter 转到”；指向别的磁盘的目录链接会自动收进索引；插件库能看每一版的更新内容；截图翻译可以用其他翻译插件；关键字命令能边打边列出文件。还修了文件夹菜单自己一层层钻进去、选文件夹时路径变成乱码、资源管理器标签页在部分电脑上不合并等问题。
  新功能 · What's new
  - 🖱️ 右键拖出结果 在搜索结果、大图标、搜索面板或剪贴板里，按住右键把文件拖到资源管理器，松开时弹出资源管理器自己的菜单：复制到这里、移动到这里、创建快捷方式，或者压缩软件的“解压到这里”。右键点一下不拖，还是原来的右键菜单（#338）。
    Drag results out with the right button From the results, the large icons, the search panel or the clipboard, drag a file with the right button into File Explorer, and on release Explorer's own menu asks what to do: copy here, move here, create a shortcut, or an archive tool's "extract here". A right click without moving still opens the row's menu (#338).
  - 📂 对话框旁的搜索框：回车打开，Ctrl+Enter 转到 在“打开”对话框旁边搜到一个文件，回车（或按数字键）直接打开它，Ctrl+Enter 只转到它所在的文件夹并选中，和搜索框、Listary 的习惯一致。AutoCAD 自己的打开窗口和 Windows XP 样式的打开窗口也一样。“另存为”、选文件夹的窗口和以管理员身份运行的程序里，回车仍是转过去、填好名字（#353）。
    The bar by file dialogs: Enter opens, Ctrl+Enter goes there A file found in the bar by an Open dialog now opens with Enter (or its number key), and Ctrl+Enter only goes to its folder and selects it, as in the search box and Listary. AutoCAD's own Open window and Windows XP style Open dialogs do the same. Save As, folder pickers and programs run as administrator still go there and fill in the name with Enter (#353).
  - 🔗 目录链接自动收进索引 用 mklink 建的目录链接、目录联接或挂载的文件夹，指向的地方本来不在索引里（没选的磁盘、没有盘符的分区、没设置的网络共享）时，会自动按链接所在的路径收录并跟踪变化，之后新建的链接也一样，不用再手动添加。最多 256 个（#350）。
    Directory links indexed by themselves A directory link, junction or mounted folder made with mklink that leads to what is indexed nowhere else (a disk not chosen, a volume without a letter, a share not set up) is now indexed under the link's own path and followed live, links made later too, with nothing to add by hand. At most 256 (#350).
  - 📝 插件库里看更新内容 带更新说明的插件，名字旁边多了一个“更新内容”按钮，点开就是这一版改了什么，看完可以在同一个窗口里安装或更新（#337）。
    What's new in the plugin library An entry with release notes has a What's new button beside its name: it shows what that version changed, and the same window installs or updates it (#337).
  - 🌐 截图翻译可以用其他翻译插件 截图翻译不再只认官方的“翻译”插件，别的插件只要说明自己能翻译就能用：先问官方的，没设好服务或没翻成功就换下一个。翻译插件装了但关着时，会直接说明并给一个按钮打开它（#340）。
    Screenshot translation through other translators Screenshot translation no longer needs the official Translate plugin alone: any plugin that says it can translate is used, the official one first, the next when one has no service set up or fails. A translator installed but switched off is said so, with a button that turns it on (#340).
  - 📄 关键字命令边打边列出文件 插件里打开程序的关键字命令可以设成按输入的词找文件或文件夹：比如快捷跳转插件 1.2.0 里，code 项目名 列出名字匹配的文件和文件夹，回车用 VS Code 打开；np 名字 列出文件，回车用记事本打开（#344）。
    Keyword commands list files as you type A plugin's keyword command that opens a program can look the typed words up as file or folder names: in the Go to plugin 1.2.0, code project lists matching files and folders and Enter opens one in VS Code; np name lists files and opens one in Notepad (#344).
  改进与修复 · Improvements and fixes
  - 文件夹菜单不再自己一层层钻进去：鼠标停在箭头上进入子文件夹后，新页面同一位置如果又是箭头，过一会儿就会再进一层，一直钻到底。现在页面换过之后，鼠标不动就不会再展开，动一下照常（#348）。
    The folder menu no longer walks down by itself: after a rest on an arrow opened a subfolder page, an arrow at the same place on the new page opened the next after a moment, all the way down. Now a page that changed under a pointer at rest opens nothing until the pointer moves (#348).
  - 文件夹菜单换页时不再跳到鼠标下面：在屏幕下方打开时，第一页翻到鼠标上方，换到短一点的页面（收藏夹、子文件夹）却掉到了鼠标下面。现在每一页都和第一页顶边对齐，返回时回到原处。收藏夹也可以像最近文件夹一样直接显示在菜单里（设置 › 打开 Win 顺 › 对话框 › 文件夹菜单，0–10 个）（#349）。
    Folder menu pages keep their place: opened near the screen's foot, the first page flips above the pointer, but a shorter page (favorites, subfolders) dropped below it. Every page now keeps the first page's top, and going back returns it. Favorites can also be shown directly in the menu, as recent folders are (Settings › Open WinShun › Dialogs › Folder menu, 0–10) (#349).
  - 选文件夹时路径不再变成乱码：从“百度网盘同步空间”这类入口选文件夹，有的软件交回来的是乱码路径，Win 顺 照着它新建了文件夹，备份就存进了乱码文件夹里。现在选的时候会换回真正的路径，已经存成乱码的备份文件夹和索引文件夹启动时自动改回来；以前多出来的乱码文件夹可以直接删掉。另外把整个程序里读写文字的地方查了一遍，插件输出、录屏日志、老版本 Ditto 导入等处也不会再出乱码（#346）。
    No more garbled paths from folder pickers: picked through an entry such as Baidu Netdisk's sync space, some shell extensions hand back a garbled path, and WinShun made a folder by it, so backups went into a garbled folder. The real path is now taken at the pick, and a backup or index folder already saved garbled is put right at start; a garbled folder left from before can be deleted. Text handling was checked across the whole program too: plugin output, recording logs and old Ditto imports no longer garble either (#346).
  - 当作 Everything 时，排除的文件夹也收进索引：开着“让其他软件把 Win 顺 当作 Everything 搜索”时，“不搜索的文件夹”照样收进索引，Total Commander 这类软件才算得出这些文件夹的大小；Win 顺 自己的搜索照旧不显示它们。整个排除的磁盘仍然不收（#351）。
    Excluded folders indexed when answering for Everything: with "Let other programs search WinShun as Everything" on, the excluded folders are indexed all the same, so Total Commander and the like can count their sizes; WinShun's own searches still leave them out. Whole drives excluded stay out (#351).
  - F2 改名的输入框不再盖住原名：输入框放到名字下面（列表到底时放上面），改的时候原来的名字一直看得见（#335）。
    Renaming with F2 leaves the old name in sight: the box now sits under the name (above it at the end of the list), so the name being changed stays visible (#335).
  - 应用 › 运行里也有 Win 顺 自己的窗口：开着的设置窗口等现在也列在“运行”里，可以从这里切过去（#341）。
    Apps › Running lists WinShun's own windows: an open Settings window and the like are listed under Running and can be switched to from there (#341).
  - 截图设置里列出全部按键：截图设置“按键”页下面列出截图时和编辑图片时的其他固定按键，和工具条上“全部按键”看到的一样，补上了漏掉的 F 键（#342）。
    The capture settings list every key: under the changeable keys, the Keys page now lists the capture's other keys and the editing window's, the same rows as All keys on the toolbar, with the missing F key added (#342).
  - 任务栏搜索框不再偶尔跑到托盘旁边：图标居中、搜索框放在左边时，任务栏重新排列的那一下可能被读成“空的”，搜索框整个跑到托盘旁边，几秒后才回来。现在这种读数不算数，搜索框留在原处。
    The taskbar box no longer jumps beside the tray now and then: with centred icons and the box on the left, the taskbar rearranging itself could read as empty, sending the box beside the tray for a few seconds. Such a reading no longer counts and the box stays.
  - 资源管理器标签页 1.1.3：有的电脑上新开的文件夹窗口一直不并成标签页，诊断日志里写着“1 known, 0 able”。原因是读不到资源管理器进程的权限级别时（安全软件常常不让读），插件把它当成了“比自己权限高”而跳过。现在按资源管理器平常的级别处理；日志也会写明每个窗口没被选中的原因（#331）。
    Explorer tabs 1.1.3: on some PCs new folder windows never became tabs, the diagnostics saying "1 known, 0 able". When Explorer's integrity level could not be read (security software often refuses), the plugin took it as above its own and skipped the window. It now counts as Explorer's usual level, and the log says why each window was passed over (#331).
  - 截图工具条上编号工具图标里的“1”按字形居中了。
    The 1 in the capture toolbar's numbering icon is centred by its ink.
  - 写插件的人：清单里加 "translate": "<命令 id>" 就能给截图翻译用；零代码的 run.program 可以加 "suggest": "files" | "folders" | "paths"，按输入的词列出文件给用户选。说明见 docs/plugins.md。
    For plugin authors: "translate": "<command id>" in a manifest makes the plugin a translator for screenshot translation; a zero-code run.program may set "suggest": "files" | "folders" | "paths" to list files found for the typed words. See docs/plugins.md.
  插件库更新 · Plugin library updates

  | 插件 · Plugin                         | 新版本 · Version |
  | ------------------------------------- | ---------------- |
  | 截图与录屏 · Screenshot and recording | 1.1.18           |
  | 图片文字搜索 · Image text search      | 1.0.17           |
  | 资源管理器标签页 · Explorer tabs      | 1.1.3            |
  | 翻译 · Translate                      | 2.2.3            |
  | 快捷跳转 · Go to                      | 1.2.0            |

  装了这些插件、并开着插件库的“自动更新”时，它们会自己更新。
  Installed plugins update themselves while automatic updates are on in the plugin library.
  - 截图与录屏 1.1.18 截图翻译可以用其他翻译插件，翻译插件关着时直接提示打开（#340）；设置里列出全部按键（#342）；编号工具图标居中。权限不变。
    Screenshot and recording 1.1.18: screenshot translation through any translator, and a switched-off one is offered to be turned on (#340); every key listed in the settings (#342); the numbering icon centred. Its permissions are unchanged.
  - 图片文字搜索 1.0.17 用 Win 顺 0.32.0 的共用代码重新打包，用法没有变化；主程序也要升到 0.32.0。
    Image text search 1.0.17: rebuilt with WinShun 0.32.0's shared code; nothing else changes. The app needs 0.32.0 as well.
  - 资源管理器标签页 1.1.3 读不到资源管理器的权限级别时不再跳过它的窗口（#331）；主程序也要升到 0.32.0。权限不变。
    Explorer tabs 1.1.3: windows whose Explorer level cannot be read are no longer skipped (#331). The app needs 0.32.0 as well. Its permissions are unchanged.
  - 翻译 2.2.3 声明自己能给截图翻译用；用法不变。
    Translate 2.2.3: says it can translate for screenshot translation; nothing else changes.
  - 快捷跳转 1.2.0 code 名字 列出文件和文件夹、np 名字 列出文件，回车用对应的程序打开（#344）；要 Win 顺 0.32.0 才会列出，旧版本里照旧直接运行。
    Go to 1.2.0: code name lists files and folders and np name lists files, and Enter opens one with that program (#344); the lists need WinShun 0.32.0, older versions run the command as before.
  验证范围 · Verification
  本版在开发机上把正式版 0.31.1 用应用内更新真实升级到 0.32.0（索引服务一起更新），新版本以普通权限启动，设置和历史都在；安装程序在文件被占用的五种情形下的安装和升级也都实测通过。改动涉及的自动测试和界面检查全部通过。资源管理器标签页（#331）和乱码路径（#346）没能在这台电脑上照报告的样子复现，是按诊断日志和报告人的回答修的；这次没有在干净的 Windows 10 虚拟机里试首次启动。
  On the development PC, a released 0.31.1 was really updated to 0.32.0 through the in-app update (the index service with it); the new version started with normal rights, settings and history intact. Installing and upgrading with files held in five different ways also passed. The automated tests and interface checks for the changes all passed. The Explorer tabs case (#331) and the garbled paths (#346) could not be reproduced on this PC as reported; they are fixed from the diagnostics and the reporter's answers. A first start on a clean Windows 10 virtual machine was not done this time.
