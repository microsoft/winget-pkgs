ReleaseNotes: |-
  Win 顺 0.22.0 新增搜索词历史、已打开窗口切换和纯净搜索模式，补齐剪贴板分组查找、悬停预览、双击动作和界面字体选择。插件说明可在应用内阅读，社区原生插件安装与更新增加审核状态确认，原生 Qt 插件可以声明复用宿主运行时。搜索面板与部分行操作按需创建，并修复 Windows 用户目录重定向、粘贴失败和预览交接等问题。 WinShun 0.22.0 adds query history, switching to matching open windows, a minimal empty search mode, clipboard group search and hover previews, configurable double-tap actions and interface fonts. Plugin guides open inside the app, community native packages carry review and installation consent, and native Qt plugins can opt into the host runtime. The search panel and some row actions are created on demand, with fixes for redirected Windows folders, failed pastes and preview handoff.
  新功能 · What's new
  - 🕘 搜索词历史 时钟按钮列出最近 100 条已完成的搜索词，默认 Ctrl+↑ / Ctrl+↓ 翻阅。设置中可改成 Alt+↑ / Alt+↓ 或关闭，支持删除单条及清空历史，翻阅结束可恢复草稿。
    Query history The clock button lists the last 100 completed searches. Use Ctrl+Up / Ctrl+Down, choose Alt+Up / Alt+Down in settings, or turn the keys off. Delete individual entries, clear the list, and return to the draft you were editing.
  - 🪟 切换到已打开的窗口 在“全部”范围按匹配程度搜索时，匹配当前窗口标题或程序名的结果优先显示，按 Enter 切换到该窗口。最小化的窗口也可搜索。
    Switch to an open window In All, sorted by relevance, matching window titles and program names appear before ordinary results. Enter activates the selected window, including a minimized one.
  - ✨ 纯净搜索与合并范围 可让空搜索框只保留输入栏，输入后恢复操作和结果。另可合并“全部”和“文件”，在“全部”直接按文件类型筛选。两项均默认关闭。
    Minimal empty search and merged scopes Keep just the input bar while the query is empty, with controls and results returning as you type. A separate option merges All and Files so file kinds can be filtered in All. Both options start off.
  - 📋 剪贴板分组查找与悬停预览 Ctrl+G 按分组名称查找，Enter 进入分组，Esc 返回之前的查询。鼠标停留在条目上可查看文字或图片，移入预览后可继续阅读。
    Clipboard group search and hover previews Use Ctrl+G to find a group by name, Enter to enter it, and Esc to return to the previous query. Rest the pointer on an item to preview text or a picture, then move into the preview to keep reading.
  - ⌨️ 双击动作与直接打开面板 双击 Ctrl、Alt 或 Shift 可选择呼出搜索框、剪贴板或支持宿主通知的已启用插件动作。完整搜索面板可分配独立快捷键，面板的筛选侧栏可随时收起。
    Double-tap actions and a direct panel hotkey Assign a modifier double tap to search, clipboard history or a compatible enabled plugin action. Give the full search panel its own hotkey and collapse its filter sidebar when you need more room.
  - 🎨 界面字体和紧凑菜单 外观页可选择界面字体；文件夹菜单、结果右键菜单和下拉菜单跟随界面大小。文件夹菜单还可设置直接显示多少个最近或已打开的文件夹。
    Interface fonts and compact menus Choose the interface font in Appearance. Folder menus, result context menus and dropdowns follow the interface size. Choose how many recent or open folders to show directly in the folder menu.
  - 🧩 插件说明和审核状态 在设置中阅读插件附带的说明。插件库显示审核状态，未审核的社区原生插件在首次安装及每次更新时单独确认，并提供查看来源的入口。
    Plugin guides and review status Read a plugin's bundled guide inside settings. The library shows review status, and unreviewed community native packages ask for consent on installation and every update, with a link to their source.
  改进与修复 · Improvements and fixes
  - 大索引的新块按私有内存预算使用临时文件映射，索引预热、压缩和快照保存减少额外分配。启动时遵循已保存的管理员直读选择。
    Large indexes use temporary file-backed blocks within a private-memory budget, with fewer extra allocations during warming, compaction and snapshot saves. Startup follows the saved administrator-read preference.
  - 搜索面板、部分筛选控件和行操作按需创建。运行状况页集中显示当前状态，简化了近期事件区域。
    The search panel, some filters and row actions are created on demand. Health focuses on the current state with a simpler layout.
  - 文件预览交接到内容详情的“预览”标签页时保持完整文档布局。切换搜索范围会清理旧结果的浮动预览，靠近屏幕边缘时预览摆放更稳定。新增预览跟随选择的设置。
    Document layout is retained when the floating preview is handed to the content pane. Scope changes clear the old floating preview, placement near screen edges is steadier, and preview-follow behavior is configurable.
  - 优化常用结果的学习排序、紧凑文件夹搜索和剪贴板图文排列。剪贴板按键发送失败时显示原因，并对可安全处理的标准文本控件尝试单次粘贴回退。
    Learned ranking, compact folder search and mixed clipboard rows are improved. Failed paste input reports a reason, with a single fallback for supported standard text controls.
  - Ctrl+G 接入 Tessoa 的当前目录查询，需要 Tessoa 0.22.0 或更新版本。
    Ctrl+G can query the active folder in Tessoa 0.22.0 or newer.
  - 修复 Windows 下载、桌面等用户目录重定向后的路径处理。LocalSend 默认下载目录尚未创建时，会在系统指定位置创建接收目录。
    Redirected Windows user folders, including Downloads and Desktop, are handled correctly. LocalSend creates a missing default receive folder at the location specified by Windows.
  - 插件原生窗口可声明 runtime.qt: "host" 和 runtime.qtVersion，复用宿主 Qt 6.12 运行时。支持范围、最低版本和部署要求见插件文档。
    Native plugins can declare runtime.qt: "host" and runtime.qtVersion to use the host's Qt 6.12 runtime. The plugin documentation describes supported modules, minimum versions and deployment requirements.
  插件库更新 · Plugin library updates

  | 插件 · Plugin                         | 新版本 · Version |
  | ------------------------------------- | ---------------- |
  | 截图与录屏 · Screenshot and recording | 1.1.7            |
  | 图片文字搜索 · Image text search      | 1.0.8            |
  | 按意思找 · Search by meaning          | 1.0.4            |
  | 局域网传输 · LAN transfer             | 1.0.6            |
  | 休息提醒 · Break reminder             | 1.1.1            |
  | 资源管理器标签页 · Explorer tabs      | 1.0.2            |
  | 浏览器书签 · Browser bookmarks        | 2.0.3            |
  | 翻译 · Translate                      | 2.2.1            |
  | 网页搜索 · Web search                 | 2.0.1            |

  截图 1.1.7 修复独立预览的中文宿主路径加载，截图与图片文字搜索同步新版共享界面代码，其余原生包同步 0.22.0 的版本资源和各自已合入的改动。网页搜索、图片文字搜索和资源管理器标签页的新包最低要求 Win 顺 0.22.0。休息提醒已有“暂停 1 小时”，翻译已有按服务分别保存密钥，本版一并提供这些独立更新。
  Capture 1.1.7 fixes host Qt loading from Unicode paths in independent previews. Capture and image text search include the updated shared UI. Other native packages are rebuilt with 0.22.0 version resources and their merged changes. The new Web search, Image text search and Explorer tabs packages require WinShun 0.22.0. This release also brings the independently published Pause 1 hour action for breaks and per-service translation keys.
  当前发布的验证范围见 0.22.0 发布验证记录。插件开发者请同步查看中英文插件文档和 SDK 开发说明。
  See the 0.22.0 release validation record for the verification scope, and the plugin documentation and SDK development guide for integration details.
