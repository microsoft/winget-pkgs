ReleaseNotes: |-
  - No longer runs as administrator: WinShun runs with your normal rights, and the “WinShun Index Service” installed with it reads the NTFS master file table and change journal, so indexing is as fast as before; no UAC prompt at login or when you open it, and what you open from it is not elevated (#21). To run it as before, pick “Direct (administrator)” under Settings → Search scope → Drives → Index access.
  - AutoHotkey keeps working in the search window: AutoHotkey remaps and hotkeys stopped while the search window was open, because of the keyboard hook WinShun set for Ctrl+1–9; it is gone and the number keys still work (#10, #9). A chord another program holds is struck through on the icons, with a tip saying why.
  - Folder menu on a double click: double-click the blank space of a File Explorer folder or the desktop for favorite, recent and open folders; pick one and the same window goes there. It never takes the focus; arrows, Enter and Esc work (#22). It steps aside while Listary runs and can be turned off.
  - “Search here with WinShun” on right-click: on folders, a folder's blank space and drives (under “Show more options” on Windows 11); the search window opens with that folder typed, so what you type next is searched in it (#20).
  - Content search inside one folder: annual report abc/ searches only folders named abc; all of them, listed under the box, and Shift+Tab picks one. Or right-click a folder in the results → Search contents in this folder.
  - Better text recognition in copied pictures: recognition now uses PaddleOCR (PP-OCRv6), still on your PC and offline, and reads numbers, small print and screenshots far better than Windows' own. Pictures already in the history are read again once.
  - Settings backup and restore: choose a folder under Settings → Advanced (a synced folder makes it a cloud backup); settings, favorites, dialog pins, your own web icons and plugins are backed up as they change, the last 10 kept, ready to restore (#17).
  - Search by meaning (plugin, off by default): with the “Search by meaning” plugin on, ? last year's expense rules finds a document that says “travel cost requests”. It uses the model you pick: Ollama or LM Studio on your PC uploads nothing; for SiliconFlow, Model Studio, OpenAI and others you enter your own key, kept in Windows Credential Manager, and before the first run it says how much text would be sent and waits for your Enter.
  - Portable data travels with it: the unzipped copy keeps settings, history and index in the data folder beside it, so the whole folder can move to a USB stick or another PC; on its first start it copies in what this PC already has (#19).
  - Clipboard: pinned first, and your own order: the ⇅ at the end of the tab row puts pinned items first; drag the handle, press Ctrl+↑/↓ or use Move up / Move down to reorder.
  - Monochrome taskbar icon, three sizes: under Settings → Appearance, the tray and taskbar box icons can be monochrome, and the interface comes compact, standard or roomy.
  - Hard disks stay quiet: on PCs with hard disks, the first content index reads gently while you use the computer and speeds up when you step away; the tray menu shows its progress.
  - Other improvements: Tab only switches All, Files and Content, Shift+Tab the kinds (#16); a whole drive such as D:\ in the excluded folders works again (#17); bookmarks show their site's icon (#17); switching to Content answers at once; the index and clipboard are saved before Windows shuts down; clipboard pictures can be dragged into a folder as PNG files, named by when they were copied (thanks @nivooz1519-coder, #18); memory drops sooner while unused.
