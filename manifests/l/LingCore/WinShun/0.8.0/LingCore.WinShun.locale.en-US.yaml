PackageIdentifier: LingCore.WinShun
PackageVersion: 0.8.0
PackageLocale: en-US
ShortDescription: Windows search launcher with pinyin file search, document full-text search, clipboard history and an MCP server.
Description: 'WinShun (Win顺) is a free, open-source Windows search launcher and an alternative to Everything and Listary. Double-tap Ctrl to open the search box: find files and folders by pinyin, search the text inside Word, Excel and PDF documents, browse clipboard history instead of Win+V, search in dialogs and on the taskbar, extend it with plugins, and expose it to AI assistants through a MCP server. An optional index service reads the NTFS master file table and change journal, so WinShun itself runs with normal user rights and nothing it launches is elevated. Requires a 64-bit Windows 10 (version 1809 or later) or Windows 11.'
