ReleaseNotes: |-
  Win 顺 0.31.0 让文件夹菜单可以一层层走进子文件夹，计算器会记下算过的账，Directory Opus、Total Commander 和 es.exe 可以把 Win 顺 当作 Everything 来搜。搜索时占用的内存少了约两成，还修了剪贴板窗口不接按键、对话框切回来不跟着转、连按两次 Win+E 出两个窗口这几个问题。
  新功能 · What's new
  - 📂 文件夹菜单里走进子文件夹 在资源管理器或桌面空白处双击弹出的文件夹菜单里，文件夹那一行的末尾多了一个箭头：鼠标在箭头上停一下（或点箭头、按 →），菜单就列出它里面的文件夹，可以一层层往下走，← 返回上一层。不用先转过去再找（#170）。
    Subfolders in the folder menu In the menu that a double-click on blank space in File Explorer or on the desktop brings up, a folder's row now ends in an arrow: rest the pointer on it (or click it, or press →) and the menu lists the folders inside, level after level; ← goes back up. No need to go there first and look (#170).
  - 🧮 计算记录 算完按 Enter 复制结果，这条算式就记下来。之后只打 =，记录一行一条列出来（结果、算式、时间，最新的在上），几笔账可以互相核对；正在打新算式时，之前的记录也列在结果下面。在某条记录上：Enter 再复制结果，Ctrl+Enter 复制“算式 = 结果”，Tab 把算式放回输入框接着改，Shift+Enter 删除这一条，最下面一行可以清空。记录保留最近一个月、最多 200 条，只存在本机。
    Calculator tape A sum whose result you took with Enter is kept. Type = alone to list them, a row each (result, sum, time; newest first), to check one figure against another; they also show under a sum being typed. On a row: Enter copies the result again, Ctrl+Enter copies "sum = result", Tab puts the sum back in the box to go on from, Shift+Enter removes the row, and the last row clears them all. The last month is kept, 200 rows at most, on this computer only.
  - 🔎 让其他软件把 Win 顺 当作 Everything Directory Opus、Total Commander 这类软件自带“用 Everything 搜索”。在 设置 › 打开 Win 顺 › 对话框 打开“让其他软件把 Win 顺 当作 Everything 搜索”（默认关）后，这些搜索就由 Win 顺 的索引来回答，不用再装 Everything；命令行的 es.exe 和基于 Everything SDK 的小工具也一样。能搜文件名里的词、"带空格的词"、!排除、a | b、通配符、指定文件夹、ext:、size:、dm:、regex: 等，结果带大小和时间。Everything 自己在运行时仍由它回答，Win 顺 不抢（#40）。
    Answering for Everything Directory Opus, Total Commander and the like have a "search with Everything" of their own. Switch on "Let other programs search WinShun as Everything" in Settings › Open WinShun › Dialogs (off by default) and those searches are answered from WinShun's index, with no Everything installed; the command line's es.exe and tools built on the Everything SDK work too. Words in names, "a phrase", !exclude, a | b, wildcards, a folder, ext:, size:, dm:, regex: and more are understood, and results carry sizes and times. While Everything itself is running it goes on answering; WinShun does not take over (#40).
  - 🔤 界面字体列表里直接搜 设置 › 外观 的界面字体列表有了自己的搜索行：打字体名字的一部分，用方向键或 Page Up / Page Down 在匹配的字体里走，Enter 选中。
    Search in the interface font list The interface font list in Settings › Appearance has a search row of its own: type part of a font's name, move through the matches with the arrow keys or Page Up / Page Down, and take one with Enter.
  改进与修复 · Improvements and fixes
  - 搜索时占用的内存少了约两成：在一台有 225 万个文件的电脑上，搜过第一个词之后占用从 152 MB 降到 113 MB，连续搜几轮之后从 175 MB 降到 142 MB，搜索速度不变。原因有四处：图标文字不再连带加载电脑里装的所有字体，每个线程不再各留一块 64 KB 的缓冲，字体文件直接映射而不是整个读进内存，索引把搜索时要读的部分和其余部分分开存放。
    About a fifth less memory while searching: on a PC with 2.25 million files, memory after the first query went from 152 MB to 113 MB, and after several rounds of queries from 175 MB to 142 MB, at the same search speed. Four causes: icon text no longer pulls in every font installed, threads no longer keep a 64 KB buffer each, font files are mapped instead of read whole into memory, and the index keeps what a search reads apart from the rest.
  - 剪贴板窗口开着却不接按键：有人反馈剪贴板窗口开着时，打的字进了后面的网页或聊天窗口，窗口自己的按键也没反应（#86）。我们没能照原样复现，但堵上了三条会走到这种状态的路：等光标位置的那一小会儿里换了前台窗口、别的窗口没打招呼就到了最前面、按键钩子不再被系统调用。之后还遇到的话，请导出诊断日志，里面新增的三个计数能说明是哪一种。
    The clipboard window was up but took no keys: a report that with the clipboard open, typing went to the web page or chat behind it and the window's own keys did nothing (#86). We could not reproduce it as reported, but three ways into that state are closed: the window in front changing during the short wait for the text caret, another window coming to the front unannounced, and the key hooks no longer being called by Windows. If it still happens, please export the diagnostics; three new counts in it say which it was.
  - 界面卡住时，诊断日志记下它当时在做什么：界面超过 2 秒没有反应时，诊断日志会记下卡了多久、是在忙着算还是在等什么，以及当时停在程序的哪一处（只有模块名和位置，没有文件夹、文字和按键）。这样“卡死后从任务管理器结束”的情况也能查到原因（#111）。
    What the interface was doing when it stopped answering: when the interface does not answer for more than 2 seconds, the diagnostics now record how long, whether it was computing or waiting, and where in the program it was (module names and offsets only: no folders, text or keys). A run ended from Task Manager while stuck can now be looked into (#111).
  - 对话框切回来时，每次都转到文件管理器的文件夹：对话框设成“从文件管理器切回来时再转”后，只有在你离开期间文件管理器的文件夹变过才会转；直接点一个本来就开着目标文件夹的窗口再回来，对话框不动。现在每次回来都转到文件管理器最前面的那个文件夹，除非对话框刚才已经被送到过那里（#334）。
    A file dialog goes to the file manager's folder every time you come back: set to go "when you come back from the file manager", a dialog went only if the file manager's folder had changed during the visit, so picking a window already showing the wanted folder did nothing. Now it goes to the folder in front there every time, unless that is where the dialog was last sent (#334).
  - 资源管理器标签页 1.1.2：连按两次 Win+E 出两个窗口的原因找到了：第一个窗口在最前面时再按 Win+E，新窗口被当成“在资源管理器里主动要的新窗口”（和 Ctrl+N 一样）而保留。现在 Win+E 打开的窗口一律并成标签页；最前面的窗口已经显示着同一个位置时，再加一个标签页（#331）。
    Explorer tabs 1.1.2: the cause of two windows from two presses of Win+E is found. With the first window in front, the second counted as a window asked for from File Explorer (as Ctrl+N is) and was kept. A window opened by Win+E now always becomes a tab, and when the window in front already shows the same place it gets one more tab (#331).
  - 识别屏幕文字后可以不显示结果卡片：截图设置“快捷键”分类里新增“识别后显示结果卡片”（默认开）。关掉后，识别到的文字直接复制，不再弹出卡片；只有没识别到文字时才提示（截图与录屏 1.1.16）。
    Reading screen text without the result card: a new switch, "Show the result card after reading", on the hotkeys page of the capture settings (on by default). Off, the text is copied and nothing is shown; only finding no text is still said (Screenshot and recording 1.1.16).
  - 文件夹菜单：鼠标一步移到箭头上、或点过一个箭头之后，子文件夹页面也能正常打开，不会自己跳到下一层。
    Folder menu: a subfolder page also opens for a pointer that arrives on the arrow in one step, and after a click on an arrow the next page no longer opens by itself.
  - 写插件的人：query 的 params 里带 "source": "command" 时，这次查询来自 AI 助手或 ws 命令行，而不是用户在搜索框里打的；只该给用户自己看的内容（比如使用记录）不要放进这种回答里。说明见 docs/plugins.md。
    For plugin authors: "source": "command" in a query's params means the query came from an AI assistant or the ws command line, not from the user typing in the search box; leave out what only the user should see (such as their history). See docs/plugins.md.
  插件库更新 · Plugin library updates

  | 插件 · Plugin                         | 新版本 · Version |
  | ------------------------------------- | ---------------- |
  | 截图与录屏 · Screenshot and recording | 1.1.16           |
  | 图片文字搜索 · Image text search      | 1.0.16           |
  | 资源管理器标签页 · Explorer tabs      | 1.1.2            |

  装了这些插件、并开着插件库的“自动更新”时，它们会自己更新。
  Installed plugins update themselves while automatic updates are on in the plugin library.
  - 截图与录屏 1.1.16 “识别屏幕文字”可以不显示结果卡片；窗口占用的内存更少。权限不变。
    Screenshot and recording 1.1.16: Read text on screen can go without its result card; its windows use less memory. Its permissions are unchanged.
  - 图片文字搜索 1.0.16 用 Win 顺 0.31.0 的共用代码重新打包，窗口占用的内存更少，用法没有变化；主程序也要升到 0.31.0。
    Image text search 1.0.16: rebuilt with WinShun 0.31.0's shared code; its window uses less memory and nothing else changes. The app needs 0.31.0 as well.
  - 资源管理器标签页 1.1.2 Win+E 打开的窗口一律并成标签页（#331）；主程序也要升到 0.31.0。权限不变。
    Explorer tabs 1.1.2: a window opened by Win+E always becomes a tab (#331). The app needs 0.31.0 as well. Its permissions are unchanged.
  验证范围 · Verification
  本版在一台干净的 Windows 10 22H2 虚拟机上做了全新安装和首次启动，在开发机上把正式版 0.30.0 用应用内更新真实升级到 0.31.0。新功能用自动测试和真实程序验证：当作 Everything 用 es.exe 和 Directory Opus 试过，Total Commander 没有试；计算记录在真实搜索框里的界面这次没有看到，验证的是插件本身。剪贴板不接按键（#86）和界面卡住（#111）没能照报告的样子复现，这版是按可能的原因修的，并让诊断日志能说明情况。
  This version was installed and started for the first time on a clean Windows 10 22H2 virtual machine, and a released 0.30.0 was really updated to 0.31.0 through the in-app update on the development PC. The new features were checked with automated tests and the real program: answering for Everything with es.exe and Directory Opus, not with Total Commander; the calculator tape was checked in the plugin itself, not seen in the real search box this time. The clipboard taking no keys (#86) and the interface stopping (#111) could not be reproduced as reported; likely causes are fixed and the diagnostics now say what happened.
