ReleaseNotes: |-
  Win 顺 0.19.0 带来演示白板、资源管理器标签页插件和 Scoop 安装，插件可以跟随 Win 顺 的管理员权限运行。截图按键可以自己设，图片文字搜索不用加 ocr 就能出现在第一屏，并能读出更多 PDF 和图片；设置窗口打开更快。WinShun 0.19.0 adds a presenter and whiteboard, an Explorer tabs plugin and Scoop installs, and lets plugins follow WinShun's administrator rights. Capture keys can be changed, image text matches appear on the first screen without ocr and more PDFs and pictures are read, and the settings window opens faster.
  新功能 · What's new
  - 🖍️ 演示和白板 在正在使用的桌面上直接画：画笔、荧光笔、箭头、形状、文字、序号和激光笔，W / K 切到白板或黑板，Esc 让鼠标穿透到下面的程序。托盘 截图 › 演示 / 白板 或输入 cap 白板 打开；快捷键默认不设，可在截图设置里录一个。需要截图插件 1.1.0。
    Presenter and whiteboard draws on the live desktop with pens, highlighter, arrows, shapes, text, numbers and a laser pointer. W / K switch to a white or black board, and Esc lets clicks through. Open it from the tray (Screenshot › Presenter / whiteboard) or with cap whiteboard; it has no hotkey until you record one. Requires the capture plugin 1.1.0.
  - 🗂️ 资源管理器标签页插件 新打开的文件夹窗口自动并成已有窗口里的一个标签页；文件夹已经开着就切过去。按住 Ctrl+Shift 打开的仍是单独窗口，输入 tabs 可以暂停。从插件库安装，需要 Win 顺 0.19.0。
    Explorer tabs plugin turns new folder windows into tabs of an existing window and switches to a folder that is already open. Ctrl+Shift still opens a separate window, and tabs pauses it. Install it from the plugin library; requires WinShun 0.19.0.
  - 🛡️ 插件跟随管理员权限 Win 顺 以管理员身份运行时，声明了 elevated 的插件在你点一次“确认”后也以管理员身份运行，这样才能操作管理员窗口；Win 顺 不是管理员时不会弹出 UAC。插件文件被改动过会退回普通权限，等你重新确认。
    Plugins can follow administrator rights. When WinShun runs as administrator, a plugin that declares elevated runs elevated after one confirmation, so it can work with elevated windows. WinShun never asks for UAC when it runs unelevated, and a modified plugin falls back to normal rights until confirmed again.
  - 📦 Scoop 安装和更新 用 Scoop 装的是便携版，数据放在 Scoop 的 persist 里；更新提醒里点“用 Scoop 更新”，卸载时先取消开机自启和右键菜单。
    Scoop installs use the portable package with data kept in Scoop's persist folder. The update reminder offers "Update with Scoop", and uninstalling takes back autostart and Explorer menu entries first.
  - ⌨️ 截图按键可以自己设 贴图、保存和贴图窗口里的按键可在截图设置的“按键”页修改，只有真的被别的快捷键占用时才拒绝。WASD 可以移动指针，截图时会提示当前可用的按键，工具条分成两行，截图设置改成卡片布局。
    Changeable capture keys: the pin, save and pin-window keys can be changed on the capture settings' Keys page and are refused only when another hotkey really holds them. WASD moves the pointer, capture shows the keys available now, the toolbar has two rows and the capture settings use cards.
  - 🖼️ 图片文字搜索更全 在“全部”里不用输入 ocr，前 3 条图片文字结果就排在第一屏。能读出文字是画出来的 PDF 页、倒过来的页面、长图和大页面，以及 JFIF、GIF、HEIC、AVIF 图片；中间有空格、繁体字和一两个字的词也能搜到。修复插件装好后读不了 PDF 的问题，升级后只补读以前漏掉的文件。
    Better image text search: in All, the first three picture-text matches appear on the first screen without ocr. Pages with drawn text, upside-down pages, long pictures and large pages, plus JFIF, GIF, HEIC and AVIF pictures, are now read, and matches work across spaces, traditional characters and one- or two-character words. Installed copies can read PDFs again, and upgrades read again only what was missed before.
  - ⚡ 设置窗口打开更快 第一次打开只建当前这一页，其余页面随后再建；关掉后再打开几乎是立即出现。
    Faster settings: the first open builds only the page shown and the rest afterwards, and reopening is almost instant.
  修复与改进 · Fixes and improvements
  - 没有管理员权限的账户安装时，默认选“只为我安装”，不再卡在要管理员密码的提示上；管理员账户仍默认为所有用户安装，升级沿用原来的安装方式。
    Setup now suggests "Install for me only" on accounts without administrator rights, so it no longer stops at a password prompt. Administrators still get "for all users" first, and upgrades keep the existing install mode.
  - 没装索引服务时，以管理员身份运行的程序在最前面会让双击 Ctrl 失灵。现在第一次遇到这种情况时会提示一次，告诉你改用组合快捷键（便携版还可以直接去装索引服务）。
    Without the index service, double Ctrl cannot work while a program run as administrator is in front. WinShun now says so once and suggests the combination hotkey, or installing the index service on portable copies.
  - 预览窗口始终放在启动器旁边，不再盖住结果名称（#186）。资源管理器右键菜单和“粘贴为文件”跟随 Windows 的显示语言（#190）。
    The preview window stays beside the launcher and no longer covers result names (#186). Explorer menu entries and Paste as file follow Windows' display language (#190).
  - 插件页的更新数字只算需要你处理的更新，开发中的副本不算；插件页顶部会提示可更新的插件，“只看可更新”和数字一致（#188）。
    The plugin update count includes only updates that need you and skips copies in development. A notice at the top of the Plugins page lists them, and "Updatable only" matches the count (#188).
  - 启动器底部的按键提示和快捷键帮助按钮可以关掉，截图的完整键盘帮助按钮也可以隐藏（#185）。输入 cap 能找到截图插件自己的命令。
    The launcher's footer key hints and shortcut help button can be turned off, as can capture's full keyboard help button (#185). cap finds the capture plugin's own commands again.
  - 剪贴板缩略图在后台解码，滚轮滚动停在整行上不回弹，悬停预览出现得更快；图标按像素网格绘制，更清晰。
    Clipboard thumbnails decode in the background, wheel scrolling settles on whole rows without bouncing back, hover previews appear sooner and icons are drawn on the pixel grid for sharper edges.
  升级与验证范围 · Upgrade and validation scope
  截图插件 1.1.0 和图片文字搜索 1.0.3 与本版一起在插件库发布，开着自动更新时会在后台更新。资源管理器标签页需要 elevated 权限，安装和以后新增权限的更新都要你确认。图片文字搜索 1.0.3 需要 Win 顺 0.19.0；还在用 0.18.0 的话，已经装好的 1.0.2 照常能用，新装要先升级 Win 顺。截图插件 1.1.0 可在 0.18.0 上使用，但 cap 白板 这类搜索要 0.19.0 才能找到。
  The capture plugin 1.1.0 and image text search 1.0.3 are published to the plugin library with this release and update in the background when automatic updates are on. Explorer tabs asks for the elevated permission, so installing it, and any later update that adds permissions, needs your confirmation. Image text search 1.0.3 requires WinShun 0.19.0; on 0.18.0 an installed 1.0.2 keeps working, and a new install needs WinShun 0.19.0 first. Capture 1.1.0 runs on 0.18.0, but searches such as cap whiteboard need 0.19.0.
  演示白板在单显示器 150% 缩放下实测，多显示器、100% 缩放和录屏或会议软件同时使用的情况尚未覆盖。资源管理器标签页在测试文件夹里实测，资源管理器先加载“主文件夹”，开成标签页通常需要约 1.5 秒。本次完整结果见发布验证记录。
  The presenter was tested on one monitor at 150% scaling; multiple monitors, 100% scaling and use alongside recording or meeting software are not covered yet. Explorer tabs was tested in test folders; because Explorer loads Home first, a new tab usually takes about 1.5 seconds. See the linked release-validation record for the measured scope.
