ReleaseNotes: |-
  Win 顺 0.9.0：搜索框按 Ctrl+E 展开成能筛选、能按列排序的搜索面板；Alt+P 预览文件；在资源管理器里直接打字就能搜；图片、视频在结果里显示缩略图；第一次建内容索引快得多。WinShun 0.9.0: Ctrl+E grows the search box into a panel with filters and sortable columns; Alt+P previews a file; typing in File Explorer searches that folder; pictures and videos show their thumbnails in the results; the first content index builds much faster.
  新功能 · What's new
  - 🔍 搜索面板：结果太多时按 Ctrl+E 或点搜索框右上角的小按钮，同一个窗口展开成面板：左边按范围、类型、修改时间、大小、位置筛选，右边名称、路径、大小、修改时间四列，点列头排序；什么都不输入也能按条件浏览整个索引，比如列出所有大于 1 GB 的文件。size:>10mb、dm:7d 这类写法直接打在搜索框里也行。
    Search panel: with too many hits, press Ctrl+E or the small button at the box's corner and the same window grows into a panel: filters down the left (scope, kind, date modified, size, folder), name, path, size and date modified columns on the right with sortable headers. With nothing typed it browses the whole index by those filters, every file over 1 GB for instance. size:>10mb and dm:7d work in the box too.
  - 👀 预览文件：在结果上按 Alt+P（或右键“预览”）看一眼图片、文本、Word、Excel、PowerPoint、PDF，搜索框不关；上下键换一个文件，再按 Alt+P 或 Esc 关掉。后台开着 QuickLook 或 Seer 时交给它们。
    Preview: Alt+P on a result (or Preview in its menu) shows pictures, text, Word, Excel, PowerPoint and PDF without closing the search box; the arrows move to the next file, Alt+P again or Esc closes it. QuickLook or Seer, when running in the background, shows it instead.
  - ⌨️ 在资源管理器里直接打字搜索：在文件列表里随意打字，Win 顺 就带着打的字在这个文件夹里搜，和 Listary 一样；中文输入法照常组拼音，Esc 回到资源管理器。默认关，在设置 › 打开 Win 顺 里打开。
    Type to search in File Explorer: type in a File Explorer file list and WinShun searches that folder for what you typed, like Listary; Chinese input methods compose as usual, and Esc goes back to File Explorer. Off by default; turn it on under Settings › Open WinShun.
  - 🖼️ 结果里显示缩略图：图片、视频、PDF 等直接显示缩略图，代替类型图标，对话框旁的搜索框里也一样；设置 › 结果列表里可以关（#27）。
    Thumbnails in the results: pictures, videos, PDFs and the like show their thumbnail instead of their type's icon, in the search box and beside file dialogs; Settings › Result list can turn them off (#27).
  - 📌 钉住搜索框：按 Ctrl+T 或点右上角的图钉，点别处、打开文件后搜索框都不收起，Esc 关闭；按住左边的放大镜拖动窗口，单击它打开设置。
    Pin the search box: Ctrl+T or the pin at its corner keeps it up through clicks elsewhere and opened files; Esc closes it. Drag the window by the magnifier on the left; click the magnifier for the settings.
  - 🌐 网页搜索建议：baidu 显卡 下面直接列出百度的联想词，Enter 搜它，Tab 填进框里；百度、必应、B 站、淘宝自带，自己的网站也能填建议接口，设置里可以关。网站图标可以选 SVG 文件，或直接粘贴 SVG 代码。
    Web search suggestions: baidu 显卡 lists Baidu's suggestions below; Enter searches one, Tab puts it in the box. Built in for Baidu, Bing, Bilibili and Taobao, your own sites can be given a suggestion address, and the settings can turn them off. A site's icon can be an SVG file or pasted SVG code.
  - ⚡ 第一次建内容索引快得多：索引服务直接从磁盘读文本文件，Windows Defender 不再一个个检查，测试机上从 337 秒降到 35 秒。
    A much faster first content index: the index service reads text files straight from the disk, so Windows Defender no longer scans them one by one: 337 s down to 35 s on the test machine.
  - 🖱️ Shift+右键是 Windows 自己的菜单：在结果上按住 Shift 右键（或菜单里的“更多选项”），出现和资源管理器里一样的完整右键菜单，选中几行也行；复制、剪切、删除之后搜索框不关（#26）。
    Shift+right-click for Windows' own menu: Shift+right-click a result (or More options in its menu) for the full context menu File Explorer shows, for one row or several; after copy, cut or delete the search box stays open (#26).
  - 🥇 程序优先：搜 curl，curl.exe 排在文件夹 curl 和 curl.h 前面；优先哪些类型在设置 › 结果列表 › 优先显示的文件类型里改（默认 exe、bat、cmd、ps1、msi）。
    Programs first: curl lists curl.exe before the folder curl and curl.h; which types go first is yours to change under Settings › Result list › File types shown first (exe, bat, cmd, ps1 and msi to begin with).
  - 🗂️ 文件夹菜单用快捷键弹出，支持更多文件管理器：给文件夹菜单设一个快捷键，在任何窗口里按：资源管理器、桌面、Directory Opus、Total Commander、XYplorer 和“打开”“另存为”对话框里，选中的文件夹就在那个窗口里打开（#25）。Directory Opus 里双击空白处也能弹出，Win 顺 替你在 Opus 的设置里加好命令；Ctrl+G 也认 XYplorer，打开文件夹还可以交给你填了命令的任意文件管理器（#23）。
    Folder menu on a shortcut, more file managers: give the folder menu a shortcut and press it in any window: in File Explorer, on the desktop, in Directory Opus, Total Commander, XYplorer and Open / Save dialogs the folder picked opens in that window (#25). A double click on blank space in Directory Opus brings it up too, with WinShun adding the command to Opus's settings for you; Ctrl+G knows XYplorer, and folders can open in any file manager whose commands you enter (#23).
  - ↔️ 长文件名看得全：名字放不下时在中间缩短，扩展名留着；鼠标停在这一行上，显示完整的名字、位置、大小和时间。拖动搜索框的左右边缘可以调宽，宽度会记住。
    Long names in full: a name that does not fit is shortened in the middle, keeping its extension; rest the pointer on the row for the full name, location, size and times. Drag the search box's left or right edge to widen it; the width is remembered.
  - 🔎 任务栏搜索框可以只显示图标：和 Windows 搜索一样三选一：搜索框、图标和标签、仅图标；放在开始按钮右边时，和 TranslucentTB 一起用也行。
    Taskbar search as an icon only: as with Windows' own search, a search box, an icon and label, or the icon alone; right of Start it now works alongside TranslucentTB.
  - 📋 剪贴板单击就粘贴，图片缩略图更大：设置 › 剪贴板里打开“单击粘贴”，像 Windows 自带的那样点一下就贴，用手机远程操作电脑时方便；打开“大图片缩略图”，截图里的字不打开预览也看得清。
    Clipboard: click to paste, larger pictures: turn on Click to paste under Settings › Clipboard and one click pastes, as in Windows' own history, handy when driving the PC from a phone; Large picture thumbnails makes the words in screenshots readable without the preview.
  - 🎛️ 双击 Ctrl 可以只认左边或右边：PowerToys 的“查找鼠标”或 Listary 占着一边时，可以让 Win 顺 用另一边，设置里会说谁占着；按着 Alt 时按 Ctrl 不再算作双击。
    Double Ctrl on the left, the right or either: when PowerToys' Find My Mouse or Listary has one side, WinShun can take the other, and the settings say who has it; Ctrl pressed while Alt is held no longer counts as a tap.
  - 🛠️ 其他改进：Shift+Tab 改为往回切换全部、文件、内容，类型和内容的文件夹改用 Ctrl+Tab / Ctrl+Shift+Tab 切换（#29）；可以设成每次打开时清空搜索，不输入时也可以什么都不列、只留收藏（#24）；内容搜索的大小上限能小到 KB，直接打 50k、1.5m、2g 也行（#28）；文件夹空白处的右键菜单里又有“用 Win 顺 搜索此处”了；拖动别的程序的对话框时，旁边的搜索框先藏起来，不再拖慢它，Win 顺 设置里选文件夹的对话框也不再带它；修改时间比现在晚一天以上的文件，按时间排序时排在最后；剪贴板列表用滚轮滚动更顺滑。
    Other improvements: Shift+Tab now steps back through All, Files and Content, and the kinds and content folders moved to Ctrl+Tab / Ctrl+Shift+Tab (#29); the search can start empty each time it opens, and the empty box can list nothing but favorites (#24); content size limits go down to whole KB, and 50k, 1.5m or 2g can be typed in (#28); “Search here with WinShun” is back on a folder's blank space; the search bar beside another program's dialog hides while the dialog is dragged, so it no longer slows the drag, and stays off the folder pickers in WinShun's own settings; files dated more than a day ahead sort last by date; the clipboard list glides under the mouse wheel.
