ReleaseNotes: |-
  Win 顺 0.43.0：钉住的搜索框（Ctrl+T）变成普通窗口，任务栏上有它的按钮，Alt+Tab 能切到，也能最小化；结果里右键可以默认弹出系统菜单；索引和不搜索的文件夹可以直接输入路径，支持 %USERPROFILE% 这样的环境变量；双击空白处的文件夹菜单可以把收藏夹、最近和已打开的文件夹直接列在第一层，收藏的应用归成一组随手展开折叠；贴图后图里的字可以直接拖选复制，Shift+C 复制全部文字；截图编辑时按 Esc 先退出当前工具，方便回去改之前的标注。Directory Opus 的“此电脑”里也能弹出文件夹菜单，对话框旁的搜索框可以设成点进去不列常用位置，搜索框和剪贴板关闭时淡出，弹出更快。还修好了索引服务安装失败（错误 5）和几个插件窗口没有边框的问题。
  新功能 · What's new
  - 📌 钉住的搜索框是个普通窗口了：按 Ctrl+T 钉住后，任务栏上多一个它的按钮，Alt+Tab 里也能切到；点任务栏按钮或按 Win+D 最小化，再按呼出快捷键、点按钮或再按一次 Win+D 就回到原来的位置。最小化时从任务栏关掉它，下次照常打开。取消钉住就变回原来的样子，不用另外设置（#418）。
    The pinned search box is a window of its own: pinned with Ctrl+T, it gets a taskbar button and shows in Alt+Tab; its button or Win+D minimizes it, and the shortcut, the button or Win+D again brings it back where it stood. Closed from the taskbar while minimized, it opens as always next time. Unpinned, it is what it was; no new setting (#418).
  - 🖱️ 右键默认弹出系统菜单：在 设置 › 结果列表 › 操作习惯 打开“默认使用系统右键菜单”（默认关），在结果里的文件、文件夹上右键，直接弹出 Windows 的右键菜单，Shift+右键 才是 Win 顺 自己的菜单。应用、插件、网页这些没有系统菜单的行照旧弹 Win 顺 的菜单；菜单键和 Shift+F10 也跟着互换，Ctrl+O 仍是 Win 顺 的菜单（#420）。
    The system context menu by default: turn on 默认使用系统右键菜单 in Settings › Results (off by default) and a right click on a file or folder brings up Windows' own menu, Shift+right click WinShun's. Apps, plugins and web rows, which have no system menu, keep WinShun's; the Menu key and Shift+F10 swap too, and Ctrl+O stays WinShun's menu (#420).
  - 📁 索引和不搜索的文件夹可以直接输入：设置 › 搜索范围 › 文件夹 里“索引的文件夹”和“不搜索的文件夹”都多了输入框，粘贴路径就能添加（带引号、用正斜杠都行），也可以写 %USERPROFILE%\Documents、%TEMP% 这样的环境变量。写法原样保存，换电脑、换用户名照样对；鼠标停在上面显示实际的路径。“不搜索的文件夹”里只写一个名字时，会提示到“名称和类型”里设（#421）。
    Folders to index or skip can be typed: both lists in Settings › Search scope › Folders have a box to paste a path into (quotes and forward slashes are fine), environment variables such as %USERPROFILE%\Documents or %TEMP% included. They are kept as written, so they still fit on another PC or user; resting on one shows the real path. A bare name among the folders to skip points you to 名称和类型 (#421).
  - 🗂️ 文件夹菜单直接列在第一层：在资源管理器里双击空白处弹出的菜单，收藏夹、最近的文件夹、已打开的文件夹可以各自选“二级菜单”“前几个”或“全部”：“全部”直接列在第一层，多了可以滚动，各组之间有分隔线。收藏的应用归成一组，在菜单里点一下就展开或折叠，下次还记得；还可以选收藏夹里显示哪几类（文件夹、文件、应用、系统设置、自定义命令）。在 设置 › 系统整合 › 文件管理器 › 文件夹快捷菜单 里设。
    The folder menu at its first level: in the menu a double click on blank space brings up, favorites, recent folders and open folders can each be a submenu, the first few, or all of them at the first level (scrolling when there are many), with a line between groups. Favorite apps are a group of their own, unfolded or folded with a click in the menu and remembered; and you can choose which kinds of favorites it lists (folders, files, apps, settings, commands of your own). In Settings › Integration › File managers › 文件夹快捷菜单.
  - 📌 贴图里的字直接选（截图与录屏 1.1.31）：贴图出来后在后台自动识别图里的文字，鼠标移到字上变成文字光标，按住拖动就选中，Ctrl+C 或 T 复制，Ctrl+A 全选；拖空白处或按住 Alt 拖仍是移动贴图，Esc 先取消选中。选了字时右键菜单最上面是“复制选中文字”和“复制图片”。不想要可以在 截图设置 › 贴图 关掉“贴图后自动识别文字”。
    Select the words in a pin (Screenshot and recording 1.1.31): a pin's words are read in the background, so the pointer turns into a text cursor over them and a drag selects; Ctrl+C or T copies, Ctrl+A selects all. Dragging blank space or with Alt held still moves the pin, and Esc clears the selection first. With words selected, the menu starts with Copy selected text and Copy picture. Turn it off with 贴图后自动识别文字 in the capture settings' Pin page.
  - 📋 一键复制贴图里的全部文字（截图与录屏 1.1.31）：在贴图上按 Shift+C，或右键选“复制全部文字”，就把图里所有的字复制下来，和截图时的 Shift+C 一样；已经识别过的立刻复制。剪贴板文字贴的图、正显示译文的贴图直接复制那段字，不再识别。按键可以在截图设置里改（#423）。
    Copy all the words in a pin (Screenshot and recording 1.1.31): Shift+C on a pin, or Copy all text in its menu, copies every word in it, as Shift+C does while capturing; words already read are copied at once. A pin of copied text, or one showing its translation, copies that text without reading it again. The key can be changed in the capture settings (#423).
  - ✏️ 截图编辑时 Esc 一步一步退（截图与录屏 1.1.31）：正拿着画笔、文字这些工具时按 Esc，先放下工具回到选择；选中了标注时先取消选中；再按才放弃标注或关闭编辑。不用再去点一下工具按钮，就能选中之前画的标注接着改。文字框在编辑时、文字工具开着时都能直接拖动（#415）。
    Esc steps back while editing a screenshot (Screenshot and recording 1.1.31): with a tool such as the pen or text in hand, Esc puts it down; with annotations selected, it deselects them; only then does it drop the annotations or close the editor. So an earlier annotation can be picked and changed without clicking the tool off first. Text boxes can be dragged while being edited and while the text tool is on (#415).
  - 🔎 任务栏搜索框挤不下时先变窄：任务栏空隙不够时，搜索框先缩成一个窄一些的输入框，还是点它直接打字，实在放不下才换成“图标和标签”或“仅图标”。设置里会说明现在自动收窄成了哪种，减少几个任务栏图标后自动展开。
    The taskbar search box narrows first: when the taskbar is short of room, the box first becomes a narrower one you still type into, and only then icon and label or the icon alone. The settings say when it has narrowed and to what; it widens again once there is room.
  - 💬 对话框旁的搜索框点进去可以不列常用位置：“打开”“另存为”对话框旁的搜索框，什么都没打时点进去会马上列出文件管理器里开着的文件夹、收藏和最近的位置。不想这样，在 设置 › 系统整合 › 对话框 关掉“点进来就列出常用位置”（默认开），或者在搜索框的右键菜单里关；关了以后要打字才列，按 ↓ 也能列出来（#417）。
    The dialog bar can wait for typing: clicked into with nothing typed, the box beside Open and Save dialogs lists the folders open in file managers, favorites and recent places at once. Turn off 点进来就列出常用位置 in Settings › Integration › Dialogs (on by default), or in the box's own menu; then it lists only once you type, or press ↓ (#417).
  - 📂 Directory Opus 的“此电脑”里也能弹出文件夹菜单，中键也行：以前在 Opus 的“此电脑”里双击空白处没反应；现在“此电脑”和普通文件夹里双击、中键单击都能弹出（看“触发方式”设的是哪个）。以前设置过的要点一下“更新”（见上面）。取消设置和卸载时，Opus 原来的中键设置会放回去（#416）。
    The folder menu in Directory Opus's This PC, and on the middle click: a double click on blank space in Opus's This PC did nothing; there and in folders, the double or the middle click now brings it up, whichever 触发方式 says. Set up before? Click Update once (above). Removing it, or uninstalling, puts Opus's own middle click back (#416).
  改进与修复 · Improvements and fixes
  - 索引服务装不上（错误 5）：从便携版安装索引服务时，如果这台电脑的 Program Files 权限被改过，以前只试一个位置，闪一下黑框就报“错误 5”。现在依次试 Program Files、ProgramData、Program Files (x86) 里不允许普通程序写入的位置，安装时不再闪黑框；都不行时设置里说明是哪里的权限不对，service.log 里也记下来（#424）。
    The index service would not install (error 5): installing it from the portable edition on a PC whose Program Files permissions had been changed tried one place, flashed a console window and said "error 5". It now tries protected places in Program Files, ProgramData and Program Files (x86) in turn, with no console window; when none will do, the settings say whose permissions are wrong, and service.log records it (#424).
  - 插件窗口的边框、阴影和圆角回来了：鼠标手势的设置窗口、开发者工具和图片文字搜索的窗口在 Windows 11 上没有边框和阴影、四角是直的，现在和设置窗口一样（鼠标手势 2.1.1、开发者工具 1.0.3、图片文字搜索 1.0.28，#419）。
    Plugin windows have their frame back: the mouse gestures' settings window and the windows of Dev tools and Picture text search had no border or shadow and square corners on Windows 11; they look like the settings window now (Mouse gestures 2.1.1, Dev tools 1.0.3, Picture text search 1.0.28, #419).
  - 选中文字快捷键带 Alt、Win、Shift 时不再误触（鼠标手势 2.1.1）：松开按键后，浏览器不再把焦点跳到右上角的“…”按钮，程序不再打开菜单栏，Win 不再打开开始菜单，Shift 不再切换输入法。UI 自动化读到的选中是空的（比如 QQ 里选中了聊天消息、焦点还在输入框）时，也改为替你按 Ctrl+C 读；终端窗口里不按 Ctrl+C（免得中断正在运行的命令），mintty、PuTTY 用 Ctrl+Insert。
    The selected-text shortcut with Alt, Win or Shift (Mouse gestures 2.1.1): letting go of it no longer moves a browser's focus to its "…" button, opens a program's menu bar, opens Start (Win) or switches the input method (Shift). Where UI Automation reads an empty selection (QQ with a message selected and the focus still in the input box), Ctrl+C is pressed for you as elsewhere; never in a terminal (it would interrupt what runs there): mintty and PuTTY get Ctrl+Insert.
  - 搜索框和剪贴板关闭时淡出，弹出更快：关闭时淡出；从搜索框打开设置时，等搜索框淡出再打开设置，不再在半透明的搜索框后面闪一下。弹出动画缩短到约 0.14 秒，从第一帧起就是云母背景。Windows 里关了“动画效果”，界面里的分段按钮、选中行这些小动画也一起关掉。
    The search box and clipboard fade out, and come in quicker: closing fades them out; Settings opened from the search box waits for it to be gone instead of flashing behind it. The opening slide takes about 0.14 s, with Mica from the first frame. With Windows' animation effects off, the small transitions inside (segmented buttons, the selected row) are off too.
  - 截图文字识别气泡和别的窗口一致：识别结果气泡的标题字号、背景和关闭按钮改成和文字识别面板一样（截图与录屏 1.1.31）。
    The OCR bubble matches the other windows: its heading, surface and close button are those of the OCR panel (Screenshot and recording 1.1.31).
