ReleaseNotes: |-
  Win 顺 0.46.0：截图能直接盖在全屏播放的商店应用（媒体播放器等）上，播放器不再先退出全屏；长截图和录屏有了自己的快捷键，还能只用一个字母（#455）。新插件“窗口置顶”用 Win+Ctrl+T 把任意窗口钉在最前。搜索面板多了“名称”筛选（#457），内容搜索能直接写 *.docx、ext:py 限定文件，在文件夹窗口的搜索框里 Tab 补全子文件夹（#454）。空闲时占的内存更少（#459），链接型文件夹不再显示成空文件夹（#460），按意思找插件能看到索引进度、随时暂停（#458），搜索框的 Logo 可以关掉（#433），插件库能把不感兴趣的插件收起来（#442）。
  新功能 · What's new
  - 🎬 截图盖在全屏的媒体播放器上，播放器不用退出全屏：装着索引服务时，商店应用（媒体播放器的视频等）全屏时按截图键，截图界面直接出现在画面上面，复制、直接保存、取消之后播放器照旧全屏，不会闪出控制条和任务栏。要弹出新窗口的操作（另存为、贴图、识别文字、二维码、长截图、录屏等）才先让播放器退出全屏，另存为之后会切回全屏。没有索引服务时（比如便携版），仍按 1.1.35 的办法：先退出全屏，复制、保存或取消后再切回去（截图与录屏 1.1.36）。这条新路径按开发者的决定未在真实全屏播放器上实测就随版发布，遇到问题请反馈。
    Screenshots over a full-screen media player, which stays full screen: with the index service installed, the capture shows right over a Store app in full screen (a Media Player video and the like), and after copying, saving straight away or cancelling the player is still full screen, without its controls or the taskbar flashing up. Actions that open windows of their own (Save As, pin, text recognition, QR codes, long screenshots, recording and the like) take the player out of full screen first; after Save As it goes back. Without the index service (the portable edition, for one) it works as in 1.1.35: out of full screen, and back after copying, saving or cancelling (Screenshot and recording 1.1.36). This new path ships, as the developer decided, without a run on a real full-screen player; please report anything odd.
  - ⌨️ 长截图、录屏有自己的快捷键，也能只用一个字母：截图设置 › 按键 › 截图时 里可以改长截图（Ctrl+L）和录屏（Ctrl+R）的键，截图中的键也可以设成单个字母（比如 L），手不用离开鼠标。截图自己要用的字母（W A S D R F C G H Q I Z）不能占用，正在输入文字时字母照常打字（#455）。
    Keys of their own for long screenshots and recording, a single letter too: under Screenshot settings › 按键 › 截图时 the long screenshot (Ctrl+L) and recording (Ctrl+R) keys can be changed, and capture keys may be a single letter (such as L), so the hand stays on the mouse. Letters the capture needs itself (W A S D R F C G H Q I Z) are refused, and while typing a text a letter is just a letter (#455).
  - 📌 新插件“窗口置顶”：Win+Ctrl+T 把当前窗口放在所有窗口最前，再按一次取消（快捷键可改）；在搜索框输入“置顶”或 top 列出打开的窗口，已置顶的排在前面，Enter 切换。窗口顶部会短暂显示结果，做不到时（管理员窗口、没有响应）说明原因。从插件库安装。
    New plugin, Always on top: Win+Ctrl+T keeps the current window above all others and a second press takes it off again (the key can be changed); typing 置顶 or top lists the open windows, those on top first, and Enter switches one. A note at the window's top says what happened, or why it could not (an administrator's window, not responding). Install it from the plugin library.
  - 🔤 搜索面板的“名称”筛选：筛选里多了“名称”，分“开头是”“结尾是”“不包含”三格，填什么就按原样找，不用记语法；“结尾是”对带不带扩展名都算（#457）。
    A 名称 filter in the search panel: the filters have 名称 with three boxes, 开头是 (starts with), 结尾是 (ends with) and 不包含 (leaves out); what you type is taken as it is, no syntax to remember, and the end counts with or without the extension (#457).
  - 📄 内容搜索直接写出要找哪些文件：在要找的字旁边写 *.docx、ext:py;js、报告*.pdf 或 !*.min.js，只读这些文件，比如 年度报告 *.docx、TODO ext:py;js。筛选条最前面用漏斗图标显示认出的条件，点它或“不限”就从搜索框里去掉。ws grep 和 AI 助手的内容搜索也一样。加了引号或在正则模式下仍按文字找。
    Content search told which files to read: beside the words, *.docx, ext:py;js, 报告*.pdf or !*.min.js say which files are read, for example 年度报告 *.docx or TODO ext:py;js. The strip shows what was understood first, with a funnel; a click on it or on 不限 takes the words out of the box. ws grep and the AI assistants' content search take the same. In quotes, or in regex mode, it is text.
  - 📁 文件夹窗口里的搜索框按 Tab 补全：在资源管理器窗口旁的搜索框里输入子文件夹名字的一部分（比如 C0，或者 C001\E00 再往下一层），Tab 补全；用方向键选中文件夹就进到里面。Ctrl+Backspace 回到窗口所在的文件夹（#454）。
    Tab completes in a folder window's search box: typed in the box beside a File Explorer window, part of a subfolder's name (C0, or C001\E00 a level down) is completed by Tab, and a folder chosen with the arrows is stepped into. Ctrl+Backspace comes back to the window's folder (#454).
  - 📊 插件能在卡片上显示进度，按意思找可以暂停：常驻插件可以在 设置 › 插件 的卡片上显示正在做什么、进度条和按钮。按意思找 1.0.6 用它显示已处理多少文件、还要多久，可以“暂停”“继续”（重启后也记得），等你确认时有“开始”；卡片上的进度要 Win 顺 0.46.0（#458）。
    Plugins show their progress on their cards; Search by meaning can pause: a resident plugin can show what it is doing, a progress bar and buttons on its card under Settings › Plugins. Search by meaning 1.0.6 shows the files done, the time left, 暂停 / 继续 (kept across restarts), and 开始 while it waits for your yes; the progress on the card needs WinShun 0.46.0 (#458).
  改进与修复 · Improvements and fixes
  - 空闲时内存更少：为快速打开预留的内存最多 64 MB（以前搜索框和剪贴板各留各的，一上午能涨到一两百 MB），运行状况页单独显示为“快速打开预留”。设置窗口关掉半分钟后，看过的页面会释放，只留第一页，再打开一样快。诊断包里也写明内存用在哪里、什么拦着它释放（#459）。
    Less memory at rest: what is kept for a quick opening is at most 64 MB (the search box and the clipboard used to keep their own, growing to one or two hundred MB in a morning), shown on the health page as 快速打开预留. Half a minute after the settings window is closed, the pages you looked at are let go, all but the first, and it opens as fast as before. The diagnostics package also says where the memory is and what keeps it from going back (#459).
  - 链接型文件夹不再显示为空文件夹：指向别处的目录联接和符号链接，以前在结果里标成“空文件夹”，现在不标了（#460）。
    Folders that are links are not called empty: junctions and symbolic links to folders were marked 空文件夹 in the results; no longer (#460).
  - 拼音缩写也能关机、重启：输入 gj、guanji（关机）、cq（重启）、sm（睡眠）、xm（休眠）、zx（注销）时，对应的一行按匹配程度排，不再排到所有应用后面；照旧要再按一次 Enter 才执行。
    Pinyin initials for shutting down and restarting: gj, guanji (关机), cq (重启), sm, xm and zx now rank the command by how well it matches instead of behind every app; it still needs a second Enter.
  - 索引服务装不上时说清楚原因：设置里写明是哪个文件夹、哪里的权限不对、属于谁，并给出修复那一个文件夹的命令，一键复制（#426）。
    When the index service cannot be installed, the reason is given: the settings name the folder, what is wrong with its permissions and whose it is, and show the commands that put that one folder right, with a copy button (#426).
  - 搜索框的 Logo 可以关掉：设置 › 结果列表 › 操作习惯 › 搜索框显示 Logo。关掉后文字从原来 Logo 的位置开始；钉住时多一个图钉键，点一下取消钉住（#433）。
    The search box's Logo can be switched off: Settings › Result list › 操作习惯 › 搜索框显示 Logo. Off, the words start where the Logo was; a pinned box shows a pin key, a click unpins (#433).
  - 插件库里“不感兴趣”：没装的插件卡片上有个眼睛按钮，点了就收起来；筛选旁的计数能列出收起的插件，再点眼睛放回来。直接搜插件名照样找得到（#442）。
    不感兴趣 in the plugin library: a tile of a plugin you have not installed has an eye to put it away; the count beside the filter lists those, where the eye brings one back. Searching for a plugin by name still finds it (#442).
  - 贴图收在屏幕顶边时能左右拖：收到顶边的小标签可以沿着顶边拖到别处，停在屏幕两端，松在另一个标签上就排在它旁边；单击仍在原处展开（#456）。
    A pin tucked at the top edge can be dragged along it: the tab slides left and right along the edge, stops at the screen's ends and goes beside another tab when let go over one; a click still opens it where it was (#456).
  - 资源管理器图片右键菜单：“贴到屏幕（Win 顺）”回到图片菜单的最上面一组（0.45.0 把它挪到了最下面）；WebP、HEIF、AVIF 照样有。
    File Explorer's picture menu: 贴到屏幕（Win 顺） is back with the picture's own commands at the top (0.45.0 had moved it to the bottom); WebP, HEIF and AVIF keep it.
  - 菜单文字：贴图和托盘菜单的文字和其他菜单一样大，最宽的一项不再被截断。
    Menu text: the pin and tray menus' words are as large as the other menus', and the widest item is no longer cut short.
  - 录屏编码参数：画质档位同时给出量化参数，NVIDIA 显卡的画面不变；AMD 显卡改按明确的码率录，避免画质档位不生效。日志里记下编码器实际采用的设置（截图与录屏 1.1.36）。
    Recording encoder settings: each quality now also gives the quantizer, leaving NVIDIA output unchanged; AMD cards record at an explicit bitrate so the quality tiers take effect. The log records what the encoder actually holds (Screenshot and recording 1.1.36).
  - 截图里按 Enter 又是复制了：上一次截图点过“保存”或保存旁的下拉箭头后，下一次截图按 Enter 会打开另存为或保存菜单，而不是复制；现在每次截图开始时键盘都回到截图本身，Tab 仍能走到工具栏按钮（截图与录屏 1.1.36）。
    Enter copies again in a screenshot: after Save or the arrow beside it had been clicked in one screenshot, Enter in the next opened Save As or the save menu instead of copying; each screenshot now begins with the keys on the capture itself, and Tab still reaches the toolbar's buttons (Screenshot and recording 1.1.36).
  - 全屏游戏里剪贴板面板自己消失：每次面板隐藏都记下原因，便于下次排查（#452）。截图工具栏的“贴图”“识别文字”按钮在 1.1.34 已修好。
    The clipboard panel hiding by itself over a full-screen game: each hide now records why, for the next diagnosis (#452). The screenshot toolbar's 贴图 and 识别文字 buttons were fixed in 1.1.34.
  - 插件开发：C++ SDK 新增 registerHotkeys / hotkey，由 Win 顺 代插件注册全局快捷键；协议新增 winshun/status 通知，插件可在卡片上显示进度和按钮。
    Plugin development: the C++ SDK has registerHotkeys / hotkey, global shortcuts registered by WinShun for a plugin; the protocol's new winshun/status notification puts a plugin's progress and buttons on its card.
