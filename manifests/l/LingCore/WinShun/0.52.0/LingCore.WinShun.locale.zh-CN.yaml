ReleaseNotes: |-
  Win 顺 0.52.0：“打开”“另存为”对话框旁的搜索框先列出对话框所在文件夹里的；保持唤醒可以设成合上盖子也不睡眠（#503）；设置窗口少占内存，关掉后内存真的还回去，Windows 内存紧张时闲着的 Win 顺 也会让出内存（#500）；另有索引服务装不上时给的命令改对了（#504）、品牌色彩和轻拟物质感在 125% 缩放下光标不见了（#501）、模糊匹配时收藏被猜中就排最前等一批修复。
  新功能 · What's new
  - 📂 对话框旁的搜索框先找对话框所在的文件夹：“打开”“另存为”旁的搜索框以前按匹配程度搜整个电脑；现在和在资源管理器里打字一样，先列出对话框正显示的文件夹和它下面的，再列其他位置的。对话框停在 D:\Program Files 时打 2.2，先看到这里的 RevokeMsgPatcher.v2.2，不会被别处一堆带 2.2 的文件挤下去。收藏照样排最前，收藏的关键词照样能用。想只搜这个文件夹，按 Ctrl+Shift+D，或到 设置 › 系统整合 › 对话框 把新加的“搜索的范围”改成“只搜当前文件夹”。
    The file dialog's bar looks in the dialog's folder first: the bar beside Open and Save As used to search the whole PC by match alone; now, as when typing in a File Explorer window, what lies in the folder the dialog shows (and below it) comes first, then everything else. With the dialog in D:\Program Files, 2.2 shows RevokeMsgPatcher.v2.2 there first instead of burying it under 2.2 files from elsewhere. Favorites stay on top and their keywords work. To search only that folder, press Ctrl+Shift+D, or set the new 搜索的范围 under Settings › Integration › Dialogs to 只搜当前文件夹.
  - 💤 保持唤醒时合上盖子也不睡眠（#503）：想合盖听歌、下载，在 设置 › 插件 的“系统开关”卡片里打开“保持唤醒时合盖也不睡眠”（默认关）。保持唤醒期间，当前电源计划的合盖动作临时改成“不采取任何操作”（插电和用电池都改），保持唤醒结束、退出 Win 顺 或关掉这个开关时改回原来的；Win 顺 意外退出的话，下次启动时改回。这期间你自己在 Windows 里改过的合盖设置保持你的。合盖动作由管理员统一设定的电脑改不了，那一行用红字说明；台式机不受影响。放进包里前记得先结束保持唤醒（系统开关 1.2.0）。
    Keep awake with the lid closed (#503): to listen or download with the lid shut, turn on 保持唤醒时合盖也不睡眠 on the System switches card under Settings › Plugins (off by default). While the PC is kept awake, the active power plan's lid action is "Do nothing", plugged in and on battery; it is put back when keep awake ends, WinShun exits or the setting is turned off, and at the next start after a crash. A change you make to the lid action meanwhile is kept. Where an administrator's policy sets the lid action it is left alone and the row says so in red; desktops are not touched. End keep awake before the laptop goes into a bag (System switches 1.2.0).
  改进与修复 · Improvements and fixes
  - 内存（#500）：设置窗口每一页用到的界面零件少了三分之一，平时看不到的部分（闪烁提示、焦点框、开关的光晕、按钮尾巴上的图标等）第一次要用时才做出来，图标从五个对象变成一个；十页全部打开过，100% 缩放下从 273 MB 降到 213 MB，200% 下从 320 MB 降到 270 MB。设置窗口关掉后，它占的内存真的还给系统：Windows 的默认堆不还释放的内存，现在改用分段堆；隐藏着的窗口半分钟后放掉自己的显卡资源（集成显卡占的是内存）。关掉一阵子后比 0.51.0 少约 130 MB。以前内存用到 80% 以上时，Win 顺 闲着也一点都不还（#471），开着大型软件时几百 MB 一直占着；现在用到 70% 以上时照样还，只留下次打开搜索框和第一次搜索要用的那部分，截图插件也只留常用的部分。
    Memory (#500): the settings pages are made of a third fewer objects; parts hardly ever shown (the flash, focus rings, a switch's glow, a button's trailing icon and so on) are made the first time they are wanted, and an icon is one object, not five. Every one of ten pages opened takes 213 MB at 100 % instead of 273, and 270 MB at 200 % instead of 320. Closed, the settings window really gives its memory back: the default Windows heap kept what was freed, so WinShun now asks for the segment heap; and the hidden window lets go of its graphics resources after half a minute (memory, on an integrated card). Closed a while, that is about 130 MB less than 0.51.0. With 80 % or more of the memory in use, an idle WinShun used to give nothing back (#471), sitting on hundreds of MB while a large program ran; from 70 % it gives back again, keeping only what the next opening and first search need, and the screenshot plugin only its hot pages.
  - 搜索：开着“始终模糊匹配”时，只是模糊猜中的收藏不再排到最前，只是模糊猜中的应用也排在名字对得上的文件后面；以前就是打这几个字选过的那一个照样排前面（0.51.0 只改了应用打分，tim 在收藏了 System Informer 时仍排错）。在文件夹里打字搜到 pwsh.exe、cmd.exe 这样的程序文件，按 Enter 也开在这个文件夹里，不只是应用那一行（#430）；Visual Studio 开发者命令提示符这类带参数的终端快捷方式照原样打开。“内容”范围里，当前行和鼠标停着的行的按钮不再盖住修改时间和“第 N 行”。
    Search: with fuzzy matching always on, a favorite only guessed no longer goes to the top, and an app only guessed comes after files named as typed; the one chosen for those letters before keeps its place (0.51.0 fixed the app score only, so tim was still wrong with System Informer among the favorites). Typing in a folder, Enter on a program file found as such (pwsh.exe, cmd.exe) opens it in that folder too, not only the app row (#430); a terminal shortcut with arguments of its own, such as the Visual Studio developer prompt, opens as it is. In the Content scope, the current and the hovered row's buttons no longer cover the modified time and 第 N 行.
  - 界面：品牌色彩和轻拟物质感在 125% 缩放下，空的搜索框里看不到闪烁的光标，点了像没点上：光标落在半个像素上，正好被裁掉。现在光标对齐到整像素，四种外观的输入框都一样（#501）。
    Interface: at 125 % the Brand colours and Soft tactile styles showed no caret in the empty search box, so a click seemed not to take: the caret stood half a pixel in and was clipped. It now sits on a whole pixel, in all four styles' fields (#501).
  - 索引服务：因为文件夹权限装不上索引服务时，设置里一次列出从盘根往下所有有问题的文件夹，给的修复命令也改对了：以前的 icacls /grant:r 留下了原来的修改权限，照着做还是装不上（#504）。盘根不再因为“删除”权限被算作有问题。“只为我安装”的版本不带索引服务，设置里也不再显示这一行。
    Index service: when folder permissions stop the index service from installing, the settings list every such folder from the drive root down at once, and the commands to fix them now work: the old icacls /grant:r left the old modify rights in place, so the install still failed (#504). A drive root no longer counts as a problem for its delete right. Copies installed for you only, which have no index service, no longer show its row.
  - 设置：在设置里搜“文件浏览器”“默认文件管理器”或“Q-Dir”，能找到 系统整合 › 文件管理器（#475）。
    Settings: searching the settings for 文件浏览器，默认文件管理器 or Q-Dir finds Integration › File managers (#475).
