ReleaseNotes: |-
  Win 顺 0.34.2 修了较早的 Windows 10 上的几处问题：托盘图标几乎看不见、深色标题栏不生效、菜单“强制浅色”不起作用、录屏直接失败、截图排除自己窗口时变成一块黑。
  改进与修复 · Improvements and fixes
  - 较早的 Windows 10 上的几处显示问题：Windows 10 1809 上单色托盘图标画成黑色、几乎看不见，现在按系统的深浅色画；1809 到 1909 上深色标题栏不生效，现在生效；1809 上菜单的“强制浅色”不起作用，现在起作用。
    Display fixes on older Windows 10: on 1809 the single-colour tray icon was drawn black and nearly invisible, and now follows the system's light or dark theme; dark title bars now work on 1809 to 1909; forcing light menus now works on 1809.
  - 较早的 Windows 10 上的截图和录屏：1809 到 1909 上录屏一开始就失败，现在能录；Windows 10 上截图直接用系统的老办法截，不再先试一遍新办法再退回来；2004 之前截图时排除 Win 顺 自己的窗口会变成一块黑，现在不再这样（截图与录屏 1.1.22）。
    Screenshots and recording on older Windows 10: recording failed at once on 1809 to 1909 and now works; on Windows 10 a screenshot goes straight to the older capture method instead of trying the new one first; before 2004, leaving WinShun's own windows out of a screenshot no longer turns them into a black block (Screenshot and recording 1.1.22).
  插件库更新 · Plugin library updates
  - 截图与录屏 1.1.22 较早的 Windows 10 上的录屏、截图和深色标题栏。权限不变。
    Screenshot and recording 1.1.22: recording, screenshots and dark title bars on older Windows 10. Permissions unchanged.
  - 图片文字搜索 1.0.21 较早的 Windows 10 上的深色标题栏；需要主程序 0.34.2。权限不变。
    Picture text search 1.0.21: dark title bars on older Windows 10; requires WinShun 0.34.2. Permissions unchanged.
  验证范围 · Verification
  修复在 Windows 10 22H2 虚拟机上试过启动和截图，都正常。只在 2004 之前才会走的那几处没有对应的机器可测，系统开关、HDR 和长截图这次也没有测。安装程序在文件被占用的五种情形下的安装和升级实测通过；这次没有在开发机上做应用内更新的真实升级。
  The fixes were tried on a Windows 10 22H2 virtual machine: WinShun starts and takes screenshots normally. The parts that run only before 2004 had no machine to try them on, and the system switches, HDR and long screenshots were not tried this time. Installing and upgrading with files held in five different ways passed; a real in-app update on the development PC was not done this time.
