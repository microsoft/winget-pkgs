ReleaseNotes: |-
  Win 顺 0.50.0：截图新增“公式识别”，框住一个公式按 Shift+F，转成 LaTeX，可以复制成 Word 公式、Markdown 或 Typst，模型在本机运行；电脑内存紧张时，呼出搜索框和第一次搜索不再卡上几秒（#471）；鼠标手势可以按住 Ctrl、Alt、Shift 画出另外的手势（#472）；文件类型的扩展名填 *，就只分文件和文件夹；关机、重启这些命令归到“系统开关”插件（#477）；四种外观里选中的行都更醒目（#474）。
  新功能 · What's new
  - 🧮 公式识别：截图选好区域后按 Shift+F（或点工具条上的“公式”；贴图上按 Shift+F 或右键“识别公式”；编辑窗口里点“公式”），旁边打开“公式识别”窗口：上面是原图和认出来的公式，下面是 LaTeX 源码，改源码公式跟着变。右边选复制成 LaTeX、Markdown、Word 公式（粘进 Word 就是能接着改的公式）或 Typst，选过的下次沿用；Ctrl+Enter 复制并关掉。“导出”把公式复制成图片，或存成 PNG、SVG。识别模型约 115 MB，第一次用时在窗口里点“下载模型”，或到 设置 › 剪贴板 › 记录 › 公式识别模型 下载；识别在本机进行，图片不上传（截图与录屏 1.1.40）。
    Formula recognition: after selecting an area, press Shift+F (or Formula on the toolbar; Shift+F or 识别公式 on a pin; Formula in the picture editor) and the 公式识别 window opens beside it: the picture and the formula as read, and its LaTeX below, with the drawing following your edits. Copy it as LaTeX, Markdown, a Word equation (pasted into Word, an equation you can keep editing) or Typst, the choice kept for next time; Ctrl+Enter copies and closes. Export copies the drawing as a picture or saves PNG or SVG. The model, about 115 MB, is downloaded the first time from the window or under Settings › Clipboard › Record › 公式识别模型；reading happens on this PC and the picture is not uploaded (Screenshot and recording 1.1.40).
  - ⌨️ 按住 Ctrl、Alt 或 Shift 画手势（#472）：同一个手势按着这些键画是另一个手势，比如平常 → 是前进，按住 Shift 画 → 设成切到下一个标签页。在手势画板上按着键画就录下来，组合手势也能带键；按着的键要正好一样才算。没设带键手势的地方，Shift+右键菜单、Ctrl+右键拖动照旧是程序自己的。设了组合手势的键，按住不动多久都会等第二个键，不再提前当成单击放过去（#436）（鼠标手势 2.2.0）。
    Gestures with Ctrl, Alt or Shift held (#472): drawn with these keys held, a gesture is one of its own: → forward, and Shift + → the next tab, say. Hold them while drawing on the pad to record one, chords included; only the very keys set count. Where none is set, Shift + right click's menu and Ctrl + right drag stay the program's. A button with a chord set waits for the second one however long it is held, instead of going through as a click (#436) (Mouse gestures 2.2.0).
  - 🗂️ 只分文件和文件夹：嫌“文件”里的类型分得太细，在 设置 › 结果列表 › 类型与筛选 › 文件类型 删掉不要的，再加一个类型，扩展名填 *（*.* 也行），这排就只剩“不限 / 文件夹 / 文件”。选它列出所有文件，没有扩展名的也算，不列文件夹；再打 ext:pdf 照样能缩小。
    Just files and folders: a kind whose extension is * (or *.*) under Settings › Result list › File types is every file, with or without an extension, and no folder; delete the kinds you do not want and the strip reads No limit / Folders / Files. ext:pdf typed still narrows it.
  改进与修复 · Improvements and fixes
  - 内存紧张时呼出和搜索不再卡（#471）：以前 Win 顺 闲着 20 秒就把内存还给 Windows。内存宽裕时没问题；可内存用到八九成时，还回去的内存马上被别的程序占走，下次呼出和第一次搜索只能从硬盘一页页读回来，在忙的电脑上一次搜索要四五秒。现在系统内存用到 80% 以上时，Win 顺 和截图、手势等插件闲着也先不归还，宽裕了再还；真缺内存时 Windows 会自己收回。按快捷键呼出时还会先把文件名索引成块读回内存。设置 › 运行状况 在这种时候会写“系统内存已用 N%，闲着时先不归还”。
    No more lag at the hotkey when memory is tight (#471): WinShun used to give its memory back to Windows after 20 seconds idle. With room to spare that is harmless; with memory 80–90 % used, other programs take it at once and the next opening and first search read it back from the disk page by page, seconds on a busy PC. Now, while Windows has 80 % or more in use, WinShun and its plugins (screenshot, gestures and the rest) keep their memory while idle and give it back once there is room again; Windows still takes it if it really runs short. The hotkey also reads the file name index back in large blocks first. Settings › Health says so while it holds.
  - 关机、重启等命令归到“系统开关”插件（#477）：关机、重启、睡眠、休眠、锁屏、注销这几行现在随“系统开关”插件提供，插件卡片里可以关掉“搜索结果里的电源命令”。以前开着“搜索系统设置”的，升级后插件已经开着，用起来和以前一样；新装的要到 设置 › 插件 › 已安装 启用“系统开关”。gj 这种拼音首字母找到的关机行，排在名字就以这几个字母开头的文件和文件夹（比如文件夹 GJ）后面。
    Power commands come with the System switches plugin (#477): shut down, restart, sleep, hibernate, lock and sign out are now part of System switches, whose card can turn off 搜索结果里的电源命令. If 搜索系统设置 was on, the plugin is on after the upgrade and nothing changes; on a new installation, enable System switches under Settings › Plugins › Installed. 关机 found by pinyin letters such as gj now comes after files and folders whose names start with those letters (a folder GJ).
  - 外观（#474）：键盘选中的行、选中的卡片和标签，在四种外观的浅色、深色下都和悬停、列表底色分得开，暗淡或分辨率低的屏幕上也看得出；浅色下次要的文字颜色加深，选中行上也看得清。搜索框里的按键在“密集”行高和文件夹窗口里不再被压扁，文字不被截掉（#480）。截图和贴图的按键提示用菜单的字号，小屏幕上也看得清。
    Look (#474): the row chosen with the keyboard and chosen cards and chips stand clear of the hovered row and the list in every style, light and dark, on a dim or low-resolution screen too; secondary text is darker in light, readable on a chosen row. The search field's keys keep their height in 密集 rows and folder windows instead of being cut off (#480). Capture and pin key hints take a menu's type size.
  - 搜索：只打了一个插件关键字（后面没空格）时，Shift+Tab 也改成搜文件名，不再跳到“内容”（#479）；在文件夹窗口里打 子文件夹\再下一层，还没进索引的文件夹也能 Tab 补全（#454）；.skills 这类放满链接的文件夹里，每个链接都列出它指向的内容，.agents、.claude、.config 里的链接也读（#460）。
    Search: with a plugin keyword typed alone (no space after it), Shift+Tab searches names instead of jumping to Content (#479); typed in a folder's window, subfolder\deeper completes with Tab even where the folder is not indexed yet (#454); in a folder of links such as .skills, each link lists what it leads to, and the links in .agents, .claude and .config are read too (#460).
  - 快捷键：反作弊保护的游戏（比如对战平台上的魔兽争霸 3）里，“不响应的程序”、全屏和游戏检查以前认不出它，双击快捷键、剪贴板和截图快捷键照样弹出来；现在认得出程序名，设置照常生效（#121）。
    Shortcuts: in a game guarded by anti-cheat (Warcraft III from a battle platform, say), the programs to leave alone and the full-screen and game checks could not tell what it was, so the double tap and the clipboard's and screenshot's hotkeys still came up; its program is now known by name and the settings apply (#121).
  - 剪贴板：在条目上按 Ctrl+C 后到 Photoshop 里自己按 Ctrl+V，贴的就是这一张，不再是上一张（#432）；大图里换到下一张时原图先留着，读好后一下换上，不再闪黑或显示“正在加载”（#414）；搜索框空着时提示“点这里用输入法”，点一下就能用输入法打中文（#470）。
    Clipboard: Ctrl+C on an entry and then Photoshop's own Ctrl+V pastes that picture, not the one before (#432); in the large view the next picture replaces the one before in one go, with no black flash or 正在加载 (#414); the empty search box says to click it for the input method (#470).
  - 截图：贴图快捷键可以设成和“贴到屏幕”同一个键：截图时按它就把选区贴到屏幕，编辑窗口在前面时贴正在编辑的图，其余时候照旧贴剪贴板里的图（#469）。
    Captures: the 贴图 hotkey may be the 贴到屏幕 key: pressed while capturing it pins the selection, with the editor in front the picture being edited, and otherwise the clipboard's picture as before (#469).
  - 插件：Win 顺 更新后还在核对文件时，“按意思找”不再把已经建好的索引藏起来或丢掉没核对到的文件（#458，按意思找 1.1.1）；“压缩包搜索”和“按意思找”在 Windows 10 上闲着也归还内存（#478，压缩包搜索 1.0.1）。
    Plugins: while WinShun is still checking its files after an update, Search by meaning no longer hides the index it built or drops the files not checked yet (#458, Search by meaning 1.1.1); Archive search and Search by meaning give their memory back while idle on Windows 10 too (#478, Archive search 1.0.1).
