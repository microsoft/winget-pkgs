ReleaseNotes: |-
  Win 顺 0.34.0 让字母直达可以换键、换字母，还能用 Shift+字母点一行上的按钮；贴图上鼠标从哪个角进来，那个角就有关闭按钮；设置里可以关掉搜索框的弹出动画；下拉菜单的滚动条能拖了。另外 Total Commander 通过 Everything 接口能看到文件夹大小，用“遍历”建索引的磁盘也能收录目录链接，以管理员身份运行时软件内更新后仍回到管理员身份。
  新功能 · What's new
  - 🔤 字母直达可以换键、换字母 设置 › 结果 › 字母直达里选用哪个键叫出字母（跟数字键相同、Ctrl、Alt 或 Shift），用哪些字母、什么顺序也能改，可以带数字，比如只用左手够得着的 QWERTASDFGZXCVB12345。搜索框里 Shift+字母选中那一行，它的按钮上再出现字母，按字母就是点那个按钮，删除要按两次（#357）。
    Letter jump: your key, your letters Under Settings › Results › Letter jump choose the key that shows the letters (the number-key one, Ctrl, Alt or Shift) and which letters to use in what order, digits allowed, such as the left-hand QWERTASDFGZXCVB12345. In the search box Shift+letter selects that row and puts letters on its buttons; the next letter presses one, and delete asks twice (#357).
  - ✖️ 贴图角上的关闭按钮 鼠标移到贴图上，从哪边进来，那一侧的角上就出现一个圆形关闭按钮，点一下关掉，不用右键。最外角照样能拖着缩放；贴图太小、收起或选择文字时不显示（截图与录屏 1.1.20）。
    A close button in a pin's corner When the mouse comes onto a pin, a round close button appears in the corner on the side it came in from; one click closes the pin, no menu. The outermost corner still resizes; small, collapsed and text-picking pins show none (Screenshot and recording 1.1.20).
  - ⚡ 可以关掉弹出动画 设置 › 外观 › 弹出动画关掉后，搜索框一按就出现在原位，关闭也不再淡出（默认开）（#365）。
    The open animation can be turned off With Settings › Appearance › Open animation off, the search box appears in place at once and closes without fading (on by default) (#365).
  改进与修复 · Improvements and fixes
  - Total Commander 能看到文件夹大小：开着 Everything 接口时，TC 设成“只用 Everything 算文件夹大小”以前一个也看不到，现在每个文件夹都有；文件夹里有个刚写入、还读不到大小的文件，也不再让整个文件夹显示未知（Win 顺 自己的“≈ 大小”同样）（#364）。
    Total Commander gets folder sizes: with the Everything interface on and TC set to take folder sizes only from Everything, none showed before; now every folder has its size, and one file just written whose size cannot be read yet no longer makes the whole folder unknown (WinShun's own "≈ size" too) (#364).
  - “遍历”方式的磁盘也收录目录链接：以前只有读主文件表的磁盘才找 mklink 建的链接；现在遍历时找到的、之后新建的链接都会收录。诊断包里写明找到几个链接、哪些收了、其余为什么没收（只记盘符和种类，不记路径）（#364）。
    Directory links on walked disks: links made with mklink were looked for only where the MFT is read; disks indexed by walking now take them too, during the walk and as they are made. The diagnostics say how many links were found, which were taken and why the others were not (drive letters and kinds only, no paths) (#364).
  - 以管理员身份运行时更新后仍是管理员：软件内更新装好后，Windows 会再问一次管理员权限，回到原来的身份，用到管理员身份的插件不再悄悄失效（从更早的版本升级上来的那一次还是普通权限）（#363）。
    An update started as administrator comes back as administrator: after an in-app update Windows asks once more, so plugins that need administrator rights keep working (the update from an older version still comes back with normal rights once) (#363).
  - 下拉菜单的滚动条能拖了：字体选择和各个下拉菜单原来只有一条不能拖的滚动指示，现在和其他列表一样，能拖、能点。
    Drop-down menus get a scroll bar you can drag: the font picker and the other drop-down menus had an indicator that could not be dragged; they now have the same scroll bar as the other lists.
  - 匿名统计用户数：每天最多一次告诉 lcstp.com 这台电脑在用 Win 顺，只发送电脑标识的单向哈希（不能还原）、版本号和 Windows 版本，不发任何文件、搜索或设置；设置 › 高级 › 发送匿名统计可以关。“拾穗计划”页上每个作品显示用了它的人数。
    Anonymous user count: at most once a day WinShun tells lcstp.com that this PC uses it, sending only a one-way hash of the computer's ID (it cannot be reversed), the version and the Windows version, never files, searches or settings; turn it off under Settings › Advanced › Send anonymous statistics. The 拾穗计划 page shows each work's number of users.
  插件库更新 · Plugin library updates
  - 截图与录屏 1.1.20 贴图角上的关闭按钮，下拉菜单可拖的滚动条。权限不变。
    Screenshot and recording 1.1.20: the close button in a pin's corner and the drop-down scroll bar. Permissions unchanged.
  - 图片文字搜索 1.0.19 用 Win 顺 0.34.0 的共用代码重新打包；需要主程序 0.34.0。权限不变。
    Picture text search 1.0.19: rebuilt with WinShun 0.34.0's shared code; requires WinShun 0.34.0. Permissions unchanged.
  - 资源管理器标签 1.1.4（0.33.0 之后已发布）诊断里写明一个窗口为什么被当作看不见（#331）。
    Explorer tabs 1.1.4 (published after 0.33.0): the diagnostics say why a window counts as invisible (#331).
  验证范围 · Verification
  本版在开发机上把正式版 0.33.0 用应用内更新真实升级到 0.34.0（49.6 秒），新版本以普通权限启动，索引服务、开机自启、设置和搜索历史都在；安装程序在文件被占用的五种情形下的安装和升级也都实测通过。改动涉及的自动测试全部通过；字母直达和 Total Commander 文件夹大小在 Windows 10 虚拟机里实测过。以管理员身份运行时的更新（#363）要从 0.34.0 再升级时才能真实走一遍；没有在干净的 Windows 10 虚拟机里试首次启动。
  On the development PC, a released 0.33.0 was really updated to 0.34.0 through the in-app update (49.6 s); the new version started with normal rights, and the index service, autostart, settings and search history were intact. Installing and upgrading with files held in five different ways also passed. The automated tests for the changes all passed; letter jump and Total Commander's folder sizes were tried on a Windows 10 virtual machine. An update started as administrator (#363) can only be really tried when updating from 0.34.0 onward; a first start on a clean Windows 10 virtual machine was not done.
