ReleaseNotes: |-
  Win 顺 0.12.0：截图能在图上标注（箭头、文字、序号、打码），标过的图以后还能再打开接着改；没有管理员权限的电脑也能装（“只为我安装”，只索引你选的文件夹）；框选后双击、右键、中键、侧键各做什么由你定；剪贴板能清掉已经不存在的文件、Ctrl+A 全选、用眼睛按钮开关预览；搜索结果能按名称、文件夹、类型、大小排；双击 Alt 也能打开。WinShun 0.12.0: mark up screenshots with arrows, text, numbers and redaction, and open them again later to keep editing; install it on a PC without administrator rights ("for me only", indexing just the folders you choose); choose what a double click, right, middle and side buttons do after you pick an area; the clipboard can drop entries for files that are gone, selects all with Ctrl+A and shows its preview with an eye button; results sort by name, folder, type or size; and double Alt can open it too.
  新功能 · What's new
  - ✏️ 截图能标注，还能再编辑：框好区域后，工具条上有矩形、椭圆、箭头、直线、画笔、荧光笔、文字、序号、打码九个工具（按 R E A L P M T N B，或 1–9）；画完的东西可以拖动、改形状、改颜色和粗细，Ctrl+Z 一步步撤销。打码是真的盖住，马赛克、模糊、纯色都还原不出来。复制、保存、贴图用的都是标过的图。标过的图以后还能再打开接着改：搜索框里 jt 找到它按 Shift+Enter，或在剪贴板历史里、贴图上右键“编辑”（普通图片也行）；编辑窗口能缩放、平移、裁剪，可以多选、用吸管取色，被裁掉和被打码盖住的原图还在。按 Esc 放弃标注时 10 分钟内能在托盘菜单里找回来。
    Mark up screenshots, and edit them again: once an area is chosen, the toolbar has nine tools: rectangle, ellipse, arrow, line, pen, highlighter, text, number and redaction (R E A L P M T N B, or 1–9); what you draw can be moved, reshaped and restyled, and Ctrl+Z steps back. Redaction really covers: mosaic, blur and solid cannot be worked back out. Copy, save and pin all use the marked-up picture. Open one again to keep editing: find it with jt in the search box and press Shift+Enter, or right-click Edit in the clipboard history or on a pin (any picture works). The edit window zooms, pans and crops, selects several marks, and has a color picker; the original under a crop or a redaction is still there. If you drop the marks with Esc, the tray menu brings them back for 10 minutes.
  - 🏢 没有管理员权限也能用（#52）：安装程序现在会问装给“所有用户”（要管理员同意，带索引服务，最快）还是“只为我”（不要管理员权限，不装索引服务）。“只为我安装”时，Win 顺 只索引你选的文件夹：在 设置 › 搜索范围 › 文件夹 里添加，一开始是桌面、文档、下载、图片这些常用位置，也可以直接从资源管理器把文件夹拖进去。选中的文件夹里的改动实时跟上，每天再整个核对一遍（也可改成每小时、每 4 小时、只在启动时）。输入的文件夹不在索引里时，搜索框会提示，“这次也搜它”只搜这一次，“加入索引”以后一直收录。内容搜索照样能用，只是慢一些。开机自启在不能建计划任务时改用登录项。
    Works without administrator rights (#52): Setup now asks whether to install for all users (an administrator approves it; comes with the index service, the fastest) or for you only (no administrator, no index service). Installed for you only, WinShun indexes just the folders you choose: add them under Settings › Search scope › Folders, starting with the desktop, documents, downloads, pictures and the like, or drag folders in from File Explorer. Changes in them are followed live, and everything is checked again once a day (or hourly, every 4 hours, only at start). When the folder you type is not indexed, the search box says so: "Search it this time" looks there once, "Add to the index" keeps it. Content search still works, only slower. Autostart uses a login entry where a scheduled task cannot be made.
  - 🖱️ 框选后的鼠标操作（#46）：区域选好后，双击左键、右键、中键、鼠标侧键（后退、前进）各做什么，在 设置 › 插件 › 截图 的“框选后的鼠标操作”里分别选：复制并关闭、保存、贴图、识别文字、取消截图，或什么都不做；右键默认是“后退”，回到重新框选。
    Mouse buttons after you pick an area (#46): what a double left click, the right, middle and the two side buttons do is set under Settings › Plugins › Screenshot, Mouse actions after choosing an area: copy and close, save, pin, read text, cancel, or nothing. The right button steps back to choosing again by default.
  - 📋 剪贴板更好管（#54 #55 #47）：复制过的文件后来被删了，那一条标“已不存在”，可以在 设置 › 剪贴板 里选自动隐藏或自动清理（固定的和分组里的不动，拔掉的 U 盘不算）；Ctrl+A 选中列出来的全部，行菜单里的“删除全部”一次清掉，Ctrl+Z 能恢复；每一条旁边多了个眼睛按钮，点一下开关预览，预览开着时鼠标停在哪一行就预览哪一行，预览窗口也更宽，中间的竖线可以拖着调。
    A clipboard that is easier to keep (#54 #55 #47): when a copied file is later deleted, its entry says "no longer there", and Settings › Clipboard can hide it or clean it out by itself (pinned and grouped entries stay; a pulled-out USB drive does not count); Ctrl+A picks every listed entry, Delete all in the row menu clears them at once, and Ctrl+Z brings them back; an eye button opens and closes the preview, which shows the row under the mouse while it is open, and it is wider, with the line beside it draggable.
  - 🔀 结果能按名称、文件夹、类型、大小排（#44）：底栏的“更多”里选；Ctrl+S 仍在最匹配、最新、最早之间换。输入了文件夹路径时，里面的内容也照选的顺序排。怕点错的话，在 设置 › 结果列表 里把“点击结果”改成双击打开。
    Sort by name, folder, type or size (#44): pick from More in the footer; Ctrl+S still cycles best match, newest and oldest. With a folder path typed, its contents follow the chosen order too. If you click by mistake, Settings › Result list can make a result open only on a double click.
  - ⌨️ 双击 Alt 也能打开（#53）：设置 › 打开 Win 顺 的“双击哪个键”可以选 Ctrl 或 Alt。只认单独按下又放开的 Alt，Alt+Tab 这类组合不算。
    Press Alt twice to open (#53): Settings › Open WinShun, Key to press twice, takes Ctrl or Alt. Only an Alt pressed and released on its own counts; Alt+Tab and the like do not.
  - 🤖 AI 帮你设置 Win 顺：AI 助手（通过 MCP）能看到 Win 顺 的设置，帮你开关功能、调数值。对 AI 说“帮我设置 Win 顺”，它会先问几个问题。默认每次改之前先弹窗问你，写明改什么、为什么，点“允许”才改；改完屏幕右下角告诉你，几秒内能撤销。开机自启、索引方式、网站搜索这几项不管怎么选都会先问。设置 › AI 助手 里可以改成“直接修改”或“不允许”。
    AI helps you set up WinShun: AI assistants (through MCP) can read WinShun's settings and switch features or change values for you. Tell the AI "set up WinShun for me" and it asks a few questions first. By default every change asks you first, saying what and why, and nothing changes until you click Allow; a notice at the bottom right then offers Undo for a few seconds. Start with Windows, index access and web shortcuts always ask. Settings › AI assistants can switch this to Change directly or Don't allow.
  - 🗂️ 文件管理器和资源管理器：支持 Pulse（Ctrl+G、文件夹菜单、打开文件夹，#41）；资源管理器里直接打字搜索时，选中的文件夹在同一个标签页打开，接着打字再往里一层，Shift 右键菜单的字母键也不再被抢走（#37 #39）；双击空白处的文件夹菜单可以选列哪几类：收藏的、最近的、别的窗口里的（#51）；“用 Win 顺 搜索此处”不再把名字相近的文件夹（F1 和 F11）混在一起（#49）。
    File managers and Explorer: Pulse is supported (Ctrl+G, the folder menu, opening folders; #41); typing to search in File Explorer opens the folder you pick in the same tab, so typing again goes one level deeper, and the keys of the Shift+right-click menu are no longer taken away (#37 #39); the folder menu can list only the groups you want: favorite, recent, folders in other windows (#51); "Search here with WinShun" no longer mixes up look-alike folders such as F1 and F11 (#49).
  - 🔒 索引服务更安全：便携版装索引服务时，会把服务程序复制一份放进 %ProgramFiles%\WinShun Service（只有管理员能改），不再让系统服务直接从下载、桌面这类普通程序能改的文件夹里运行。以前装过的便携版，设置里会提醒，点“修复”换到安全的位置。
    A safer index service: when a portable copy installs the index service, it puts a copy of the service program in %ProgramFiles%\WinShun Service, where only administrators can change it, instead of running a system service from a folder such as Downloads or the desktop that ordinary programs can change. A portable copy registered earlier gets a warning in the settings and a Repair button.
  - 🛠️ 其他改进：任务栏搜索框只放在一个固定的位置（图标居中时在最左边，靠左时在托盘左边），“开始按钮右边”的位置取消了（#35）；按 Esc 关搜索框时，开着的预览下次打开还在（#33）；设置 › 搜索范围 里可以填不想搜的文件类型（例如 WPS 的 .wbk 备份），它们不再出现在结果里；安装后，用目录联接（junction）搬过家的程序，比如 Scoop 的快捷程序、搬到别的盘的 WSL，不再提示“不受信任的装载点”打不开（#50）；设置页上的拾穗计划页脚感谢收录 Win 顺 的网站；设置窗口、搜索框、剪贴板和截图里改了几十处小地方：文字不再被截断、边框和滚动条落在整像素上、英文界面补全。
    Other improvements: the taskbar search box has one fixed place (the taskbar's left end with centred icons, left of the tray with left-aligned ones); the spot right of the Start button is gone (#35); after Esc closes the search box, an open preview is still there next time (#33); Settings › Search scope has a list of file types to leave out (such as WPS's .wbk backups), which then stay out of the results; after Setup, programs reached through junctions, such as Scoop shims or WSL moved to another drive, no longer fail with “untrusted mount point” (#50); the Gleaning page in the settings thanks the sites that list WinShun; dozens of small fixes in the settings, search box, clipboard and screenshots: text no longer cut off, borders and scroll bars on whole pixels, more of the English interface filled in.
  升级提示 · Upgrading
  升级后原来的索引方式不变：装了索引服务的，还是索引整个磁盘；“只索引选中的文件夹”只在“只为我安装”或你自己选了以后才生效。已经为所有用户装了 Win 顺 的电脑上，再运行“只为我”的安装程序会提示直接用现有的那份；反过来也一样，要先卸载另一份。
  Your index access stays as it was: with the index service installed, the whole disks are still indexed; "only the chosen folders" applies only on a "for me only" install or once you pick it. On a PC where WinShun is installed for all users, a "for me only" Setup tells you to use that copy instead; likewise the other way round, uninstall the other copy first.
  任务栏搜索框原来放在“开始按钮右边”的，升级后改放到固定的位置；设置里不再有这个选项。便携版以前装过索引服务的，到 设置 › 搜索范围 › 磁盘 点“修复”，把服务程序换到受保护的位置（需要管理员同意一次）。
  A taskbar search box that sat right of the Start button moves to the fixed place, and the option is gone. If a portable copy installed the index service earlier, click Repair under Settings › Search scope › Drives to move the service program to a protected place (an administrator approves it once).
