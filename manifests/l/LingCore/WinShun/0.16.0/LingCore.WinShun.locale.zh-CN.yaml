ReleaseNotes: |-
  Win 顺 0.16.0：软件内一键更新、和手机互传文件（LocalSend）、大图浏览、网络位置和 WebDAV 的内容搜索、按住快捷键翻剪贴板、录屏显示按键，图标统一换成 Phosphor，并修复快捷键偶尔没反应等许多问题。WinShun 0.16.0: in-app updates, LAN transfer with LocalSend, a large-icons view, content search on network and WebDAV locations, hold-to-step clipboard history, keys shown while recording, Phosphor icons throughout, and many fixes, including hotkeys that sometimes did nothing.
  新功能 · What's new
  - ⬆️ 软件内更新（GitHub #69）：从这个版本起，有新版本时在提醒里点“下载并安装”（便携版是“下载并更新”），Win 顺 自己下载、核对 SHA-256 后安装并重新打开，设置和索引都保留。检查新版本连接 lcstp.com，可以在设置 › 高级里关掉。
    In-app updates (#69): from this version on, click “Download and install” (“Download and update” for the portable copy) when a new version is announced; WinShun downloads it, checks its SHA-256, installs it and starts again, keeping settings and index. The check contacts lcstp.com and can be turned off in Settings › Advanced.
  - 📡 局域网传输（默认关，GitHub #113）：和同一个网络里开着 LocalSend 的手机、电脑互传文件和文字，不用服务器和账号。在设置 › 插件里打开“局域网传输”；别人发来时先问你，输入 传 收发，或在结果上右键“用局域网发送…”。
    LAN transfer (off by default, #113): send files and text to and from phones and PCs on the same network running LocalSend, with no server or account. Turn on LAN transfer in Settings › Plugins; you are asked before anything is received. Type ls to send and receive, or right-click a result › Send over LAN….
  - 🖼️ 大图浏览（GitHub #94）：搜索面板右下角切换“列表 / 大图”，图片、视频和 PDF 显示缩略图，旁边的滑块或 Alt+滚轮调整大小。
    Large icons (#94): switch the search panel between a list and thumbnails at its bottom right; resize them with the slider beside it or Alt+wheel.
  - 🔎 搜索更顺手：支持 OR（报告 | 总结）和正则表达式（regex:）（GitHub #93）；可以跳过一些文件名，默认跳过 Office、WPS 的 ~$ 临时文件（GitHub #132）；在资源管理器里打字搜索时，当前文件夹里的排在最前，Ctrl+D 只搜这个文件夹（GitHub #110）。
    Better searching: OR (report | summary) and regular expressions (regex:) (#93); skip file names, by default the ~$ temporary files of Office and WPS (#132); typing in File Explorer lists the current folder first, and Ctrl+D keeps to it (#110).
  - 🌐 网络位置：WebDAV 文件夹（NAS 的 WebDAV、坚果云这类网盘）可以加进来一起搜；网络和 WSL 位置可以单独打开“搜索文件内容”（GitHub #114）。NAS 重启或网络恢复后，共享文件夹会自己连回来（GitHub #116）。
    Network locations: add WebDAV folders (a NAS's WebDAV, cloud drives such as Jianguoyun) to the search; turn on “Search file contents” for a network or WSL location (#114). NAS shares reconnect by themselves after a restart or an outage (#116).
  - 📋 剪贴板：可以按住快捷键里的 Ctrl、Alt、Shift 或 Win 连按往下选，松开就粘贴，和 Ditto 一样（GitHub #107）；“粘贴后保持位置”让列表顺序不变（GitHub #122）。两项都在设置 › 剪贴板，默认关。
    Clipboard: hold the shortcut's Ctrl, Alt, Shift or Win and press again to step down the list, release to paste, as in Ditto (#107); “Keep the place after pasting” keeps the order (#122). Both are in Settings › Clipboard, off by default.
  - ✏️ 截图与录屏：录屏时可以在角落显示按下的快捷键和鼠标按键（GitHub #98）；文字标注可以加描边（GitHub #101）；在 HDR 屏幕上可同时保存一份 HDR 图片（.jxr，默认关，GitHub #133）；放大镜可以关掉；按 C 复制颜色后截图自己结束；保存后点通知就在文件管理器里选中这张图（GitHub #99）。
    Screenshots and recording: show the shortcuts and mouse buttons pressed in a corner while recording (#98); outline annotation text (#101); also save an HDR picture (.jxr, off by default) on HDR screens (#133); turn the magnifier off; C copies the color and ends the capture; click the saved notification to see the file selected (#99).
  - 💬 对话框：以管理员身份运行的程序，它们的“打开”“另存为”对话框也能直接跳转（安装版，GitHub #104）；对话框旁的搜索条跟着对话框，不再挡住别的窗口（GitHub #95）。
    Dialogs: the Open / Save dialogs of programs running as administrator now jump too (installed version, #104); the search bar stays with its dialog without covering other windows (#95).
  - ⚙️ 更多设置：自定义命令可以静默执行、以管理员身份运行（GitHub #112）；网络代理（GitHub #84）；搜索框旁的 Logo 可以关掉（GitHub #109）；再次按下快捷键时可以收起或展开为面板（GitHub #100）。
    More settings: custom commands can run silently or as administrator (#112); a network proxy (#84); the logo beside the search box can be hidden (#109); pressing the hotkey again can close the box or expand it to the panel (#100).
  - 🎨 图标：全部换成随程序带的 Phosphor 图标，在各版本 Windows 上都一样，老 Windows 10 上不再显示成一个汉字。
    Icons: all icons now come from the bundled Phosphor set and look the same on every Windows; old Windows 10 no longer shows a Chinese character in their place.
  修复与改进 · Fixes and improvements
  - 双击 Ctrl、剪贴板快捷键有时没反应（GitHub #111、#134）：别的程序正忙、刚从睡眠唤醒时也能打开。请更新后试用；仍出现时，在设置 › 高级 › 诊断日志里导出发给我们。
    Double Ctrl and the clipboard hotkey sometimes did nothing (#111, #134): they now open while another app is busy or right after waking from sleep. Please try it; if it still happens, export the diagnostics from Settings › Advanced.
  - 在开始菜单里直接打字时字母顺序会乱（GitHub #66），搜狗输入法下打字（GitHub #103）：改进了交接，请试用。
    Letters typed into the Start menu could arrive out of order (#66), and typing with Sogou input (#103): the hand-over is improved; please try it.
  - 打新词时要等好几秒（GitHub #115）：搜名字不再等文件内容扫描。
    New words could take seconds (#115): name searches no longer wait for content scans.
  - 点“检查更新”后界面卡住（GitHub #96）；安装时 AI 工具占着文件（GitHub #97）；Win+S、Win+Shift+S 关掉后还给 Windows（GitHub #102）；右键菜单在窗口左上角崩溃（GitHub #106）；剪贴板窗口变白（GitHub #120）；插件的长文字显示完整（GitHub #117）；计算器支持减法（GitHub #123）；收藏圆盘的说明改成“数字 1 左边那个键”（GitHub #127）；复制文件时 WPS 粘贴成路径（GitHub #130）；旧版 Seer（如 2.8）按 Alt+P 不出预览时，改用 Win 顺 自己的预览（GitHub #131）。
    Freeze after Check for updates (#96); files held by AI tools during setup (#97); Win+S and Win+Shift+S go back to Windows when switched off (#102); a crash on right-clicking a window's corner (#106); a white clipboard window (#120); long plugin text shown in full (#117); subtraction in the calculator (#123); the drop ring's description now says “the key left of 1” (#127); WPS pasting a path instead of copied files (#130); with an old Seer (such as 2.8) that shows nothing on Alt+P, WinShun's own preview takes over (#131).
  - Windows 10 上双击文件夹空白处的菜单（GitHub #45）：增加了对经典文件列表的识别，请试用。
    The double-click folder menu on Windows 10 (#45): classic file lists are recognised; please try it.
  - 插件：插件里的“打开”要有“启动程序”权限才能起程序；插件新版本要更多权限时会再问你；用 uv 安装的 Python 也能运行插件。
    Plugins: a plugin's “open” starts programs only with the “processes” permission; a newer version asking for more permissions asks you again; Python installed with uv runs plugins.
  - 更新 README、使用说明和中英文插件文档。
    Update the README, user guide and Chinese and English plugin documents.
