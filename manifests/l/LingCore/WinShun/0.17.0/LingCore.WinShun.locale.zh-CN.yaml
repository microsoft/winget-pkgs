ReleaseNotes: |-
  Win 顺 0.17.0：更轻的主程序、按需安装的截图与录屏等插件、两页首次设置、ws 命令行、五标签文件内容详情，以及搜索、剪贴板、多屏窗口和录屏的改进。WinShun 0.17.0: a smaller core, optional screenshot and recording plugins, two-page first-run setup, the ws command line, five-tab content details, and improvements to search, clipboard, multiple monitors and recording.
  新功能 · What's new
  - 🧩 主程序与可选插件分开：截图与录屏、局域网传输、按意思搜索、休息提醒、翻译和浏览器书签按需安装。设置 → 插件 → 插件库中“安装并启用”，需要权限时先确认；拒绝后保留安装、保持关闭。升级会尝试恢复原来开启的功能及设置，离线失败后可以重试或从本地包恢复。
    Optional plugins: install screenshots and recording, LAN transfer, semantic search, break reminders, translation and browser bookmarks from the existing plugin library. Install and enable asks for required permissions first; declining keeps the plugin installed and disabled. Upgrade recovery retains settings and can retry after an offline failure or use a local package.
  - 🚀 两页首次设置：先选搜索与打开方式，再选剪贴板和截图，最后确认才统一生效；也可以稍后设置。已有配置升级不会重复弹出。
    Two-page first-run setup: choose search and opening behavior, then clipboard and capture, and apply the choices together. Set it up later if preferred; existing profiles are not prompted again.
  - ⌨️ ws 命令行：终端或能执行命令的 AI 助手可用 ws find 搜文件、ws grep 搜内容、读取文字和操作允许访问的剪贴板。和 MCP 共用连接及文件夹权限，默认关闭。设置 → AI 助手 → 权限 → 命令行可启用，并检查 PATH；便携版也可直接运行 bin/ws.exe。
    ws command line: search names with ws find, content with ws grep, read text and access permitted clipboard features from a terminal or a shell-capable AI assistant. It shares MCP's connection and folder permissions and is off by default. Enable it and check PATH in Settings → AI assistants → Permissions → Command line, or run the portable copy's bin/ws.exe directly.
  - 📄 文件内容详情：摘要、命中、正文、预览、报告五个标签，支持匹配筛选、命中导航、正则和大小写选项，保留原文上下文，并可复制或导出报告。自动内容补搜只读取已有索引缩小后的候选；尚未核对的文件有明确入口切到直接内容搜索。
    Five-tab content details: Summary, Hits, Text, Preview and Report, with filtering, match navigation, regex and case options, original context, copying and report export. Automatic content lookup stays bounded by existing indexes; files not yet checked have an explicit route to direct content search.
  - 📋 剪贴板窗口可调整宽高：边缘与四角都能拖动，尺寸自动记住；预览、底栏翻转及小屏临时适配继续可用。新增选择导出及与 LocalSend 插件的直接发送衔接。贴图优先使用当前剪贴板里的图片，无图片时回到最近截图；原截图的标注仍可继续编辑。
    Resizable clipboard: drag edges or corners and keep the size, including preview, flipped layout and temporary fitting to smaller screens. Export selections or send through the LocalSend plugin. Pin the current clipboard picture first, falling back to the last capture while retaining its editable annotations.
  - 🔎 搜索与菜单更顺手：快捷编号默认常显在左侧独立列，已有编号显示设置继续保留；英文程序名支持单词／驼峰首字母，类型条件可放在独立词的位置，正则支持 re:。文件夹菜单增加分组、图标、命令和当前目录终端入口，托盘菜单跟随主题。
    Search and menus: shortcut numbers are visible by default in a separate left column while existing display choices are preserved. Program names support word and camel-case initials, type conditions work as separate words, and regex accepts re:. Folder menus gain groups, icons, commands and terminals for the current folder; the tray menu follows the app theme.
  - 🎥 录屏控制与工作进程：准备、录制、保存状态更紧凑；采集、编码和 GIF 转换由独立工作进程执行，启动失败或无进展时提供兼容回退及错误反馈，失败尽量保留已产生的文件。MP4 / GIF 的暂停、继续和再录一段保留。
    Recording controls and worker process: compact ready, recording and saved states; capture, encoding and GIF conversion run in a separate process, with compatible fallback and error feedback on failed or stalled startup. Completed media is retained when possible, with pause, resume and record-again for MP4 and GIF.
  修复与改进 · Fixes and improvements
  - 修复搜索窗口在双屏接缝处突然横移整个窗口宽度的问题；拖动中可以跨屏，松手后继续按原规则归位（#111）。
    Fix the launcher's whole-window jump at a monitor seam; it can span displays while held and fits after release (#111).
  - 补充普通权限圆盘触发、原始输入注册、OLE 目标和辅助进程状态诊断；修复首次开启失败后的重试及管理员模式的辅助进程路径（#150）。
    Add drop-ring activation, Raw Input, OLE target and helper diagnostics, with retry and elevated-host helper fixes (#150).
  - 修复开始菜单中的控制台程序启动、连续减法／除法触发、Ditto 导入的禁止删除属性、映射盘优先定位及快捷键交互等问题。
    Fix console-app launching from Start, chained subtraction and division, Ditto protection flags, mapped-drive navigation and hotkey interaction.
  - 公开安装资源增加镜像回退、损坏内容校验和取消处理；标准安装版、便携版、OCR 组件与插件下载分别验证。
    Add mirror fallback, invalid-content checks and cancellation handling for public installation resources, covering Setup, portable, OCR and plugin downloads.
  - 改进 Windows 原生边框、阴影、桌面与文件夹菜单，以及自定义文件管理器／对话框衔接。
    Improve native window frames and shadows, desktop and folder menus, and custom file-manager and dialog integration.
  升级提示与验证边界 · Upgrade notes and validation limits
  截图等原来开启的功能升级后会从插件库恢复，需能访问下载源；暂时连不上时可在设置中的恢复入口重试。新配置的可选功能按首次引导和权限确认启用，AI／命令行连接不会因升级自动打开。官方原生插件最低要求 Win 顺 0.17.0，不覆盖已发布的同版本插件附件。
  Previously enabled optional features are recovered from the plugin library after upgrade, requiring access to a download source; retry from the recovery row when needed. First-run choices and permission consent control new optional features. AI and command-line connections are not enabled by upgrading. Official native plugins require WinShun 0.17.0.
  本机 Windows 11 已完成构建、自动回归、独立配置中的实际程序验证和双屏人工复测。报告者 Windows 10 的设置跨屏停顿、圆盘原始失败环境、特定 AMD 录屏环境及模糊显示反馈仍需继续跟踪；本次不据本机通过就宣称这些原环境全部解决。详细范围见发布验证记录。
  Builds, automated regressions, isolated production-app checks and manual dual-monitor checks were performed on Windows 11. The reported Windows 10 settings-window stall, original drop-ring failure, specific AMD recording environment and blur report still require their original environments; local passes do not establish those cases as resolved.
  感谢 @csdjk 的 PR #152，以及提交复现信息和参与复测的用户。Thanks to @csdjk for PR #152 and everyone who supplied reproductions and tested the changes.
