ShortDescription: 免费开源的 Windows 快速搜索启动器：拼音搜文件、全文搜索 Word/Excel/PDF、剪贴板历史与 MCP 服务。
Description: Win顺（WinShun）是一款免费、开源的 Windows 快速搜索启动器，可作为 Everything 与 Listary 的替代方案。双击 Ctrl 唤出搜索框：用拼音搜索文件和文件夹、搜索 Word/Excel/PDF 的正文内容、用剪贴板历史代替 Win+V、在对话框和任务栏里搜索、通过插件扩展能力，并以 MCP 服务接入 AI 助手。可选的索引服务负责读取 NTFS 主文件表和变更日志，因此 Win顺 平时以普通用户权限运行，由它打开的程序也不提权。需要 64 位的 Windows 10（1809 或更新版本）或 Windows 11。
