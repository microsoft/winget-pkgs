ReleaseNotes: |-
  What's Changed
  CLI, CDP & Automation
  - feat(cli): serve one CDP session over Chromium's remote debugging pipe by @sicko7947 in #2247
  - refactor(types): extract renderer Inspector commands and native replies #3038
  Accessibility & Semantic Export
  - feat(ax,fetch): show semantic link URLs using computed roles by @iatsuk in #3084
  Files, Downloads & Clipboard
  - fix(downloads): stream retained and authorized Blob downloads #2968
  - feat(clipboard): implement native clipboard event payloads #2912
  - fix(files): support directory uploads and relative file paths #2953
  - fix(file-api): read FileList.item from bounded native data #3050
  Fetch, XHR & Networking
  - fix(worker): own intercepted fetch and XHR loads natively #2964
  - fix(beacon): capture the Navigator request owner before conversion #3068
  - fix(fetch): copy Request headers through the internal list #3062
  - fix(xhr): complete current requests when streamed bodies fail #3059
  - fix(preload): emit load for non-stylesheet HTTP error responses #3053
  - fix(referrer): snapshot the creator policy for initial child Documents #3035
  Workers & Service Workers
  - fix(service-workers): match serialized scope URL prefixes #2539
  - fix(workers): handle internal module evaluation promises #3058
  DOM, HTML, Forms & Navigation
  - fix(page): unify document load-delay invalidation by @lanyue-llk in #2802
  - fix(input): checkpoint native keyboard callbacks #3007
  - refactor(navigation): use native NavigationDestination slots #3045
  - fix(events): synchronize legacy mouse modifier state #3051
  - refactor(touch): share native TouchEvent construction and conversion #3063
  - refactor(dom): share native attribute-node method dispatch #3000
  - refactor(forms): serialize FormData from native control state #2995
  - refactor(parser): share HTML tree sink session initialization #3002
  - fix(parser): batch tree-builder text before DOM mutations #3060
  - fix(forms): share the native option nearest-select algorithm #3041
  - refactor(forms): construct lifecycle events without author hooks #3030
  Web API, WebIDL & Native Bindings
  - refactor(webapi): extract native catalog and DOMRect bindings #1600
  - refactor(webapi): extract geometry and standalone value bindings #3040
  - refactor(webapi): extract platform error and value bindings #3044
  - refactor(webapi): extract event payload bindings #3049
  - refactor(webapi): extract audio, performance and navigator values #3054
  - refactor(webapi): extract event constructors and RTC signaling #3067
  - refactor(webapi): complete direct Web API binding extraction #3083
  - refactor(webapi): extract constructor values and codec ownership #3086
  - refactor(webapi): share UI event constructors and payload state #3088
  - fix(webidl): isolate HTML constructor proxy trap lookup #3043
  - refactor(xhr): construct trusted events in the receiver realm #3066
  - refactor(indexeddb): share prototype event handler bindings #2998
  CSS, SVG & Layout
  - fix(svg): prevent filter-region overflow from aborting layout (MOL-599) #2983
  - fix(cssom): share computed style reads across receiver realms #3055
  - fix(style): clip embedded svg elements to their viewport by @iatsuk in #3082
  Testing & CI
  - test(ci): increase CLI timing budgets and limit concurrent browser tests #2993
  - test(cli): stabilize navigation recovery and deadline regressions #2996
  - ci: dedicate Nextest runners and halve test parallelism #3001
  - test(ci): stabilize redirect, idle, and IndexedDB timing #3028
  - fix(ci): repair Worker Network smoke and loading oracle #3072
  - ci: retry artifact uploads with exponential backoff #3085
  Documentation
  - docs(readme): add Web Fetch benchmark results with Webstone reproduction by @lanyue-llk in #3031
  - docs(readme): restructure the Benchmark section around an overview and Web Fetch charts by @lanyue-llk in #3034
  - docs: use the complete round Moli icon in banners #3074
  New Contributors
  - @iatsuk made their first contribution in #3082
