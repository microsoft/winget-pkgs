ReleaseNotes: 'Release 1.1.21 concentrates on security, isolation and cookie policies: request headers are validated and CDP identities randomized, CORP is enforced before redirect and response delivery, CSSOM integrity is validated before installing, agent isolation stays independent of creator policies, and an age-aware Lax-by-default request policy plus native SameSite contexts apply to cookies. Storage persists cookies and localStorage in partition SQLite databases, and IndexedDB releases finished transaction resources.'
