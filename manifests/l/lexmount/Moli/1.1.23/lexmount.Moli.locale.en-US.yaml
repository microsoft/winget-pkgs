ShortDescription: Headless browser engine for AI agents.
Description: Moli is an open-source headless browser engine written in Rust for AI agents. Layout and painting run only on demand, so a single binary fetches pages and exports HTML, Markdown, JSON, semantic trees, screenshots or PDF, and serves CDP, WebDriver Classic and WebDriver BiDi without requiring a separate ChromeDriver, geckodriver or browser installation.
