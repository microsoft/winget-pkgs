ShortDescription: Grab on-screen text straight to your clipboard with one hotkey. Local offline OCR for Windows.
Description: |-
  SnapText is a lightweight Windows tray utility: press a hotkey, drag a box around any on-screen text (video subtitles, sentences, URLs) and it is already in your clipboard when you release the mouse.
  Recognition runs fully offline with bundled PP-OCRv5 ONNX models (strong on Chinese), with Windows OCR as a fallback. QR codes and barcodes inside the selection are decoded automatically. UI in English, Japanese and Chinese.
