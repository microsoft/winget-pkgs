  Backported Features
  - Bounded hyperbolas: Draw hyperbola arcs from two foci and start/end points, with snapping, tangent construction, transformations, and trimming. Bounded arcs can be saved and read through rational DXF spline conversion. #2827
  - Right-to-left MText: Backported drawing-direction support in the MText editor, including direction handling when importing DWG and preserving the RTL setting when saving and reopening LibreCAD DXF files. #2553
  - CJK fonts and localization: Added Noto Sans SC, Noto Sans TC, and WenQuanYi Micro Hei fonts; corrected LFF glyph loading/saving across the Unicode code-point range to avoid truncated or misidentified glyphs. Includes Lao language support, updated Japanese and Traditional Chinese translations, and other translation corrections. #2991, #2729, #2735, #3143
  - Small-display layouts: Improved main-window and dock fitting on small screens, with compact default right-dock widths and layout adjustments when the available screen area changes. #2989, #3149
  Critical Fixes
  - Undo/Redo and entity ownership: Fix crashes and unintended changes when property dialogs or modify tools encounter generated text/dimension geometry or block children, and make re-filleting corners safe for Undo/Redo. #2878
  - Clipboard and library blocks: Preserve layers and nested block definitions during copy/paste, restore Undo for Cut, guard against recursive block references, and prevent empty or incorrect library imports caused by block-name collisions. #2930, #3147
  - Hatch reliability and area: Avoid assertions or hangs on degenerate boundary edges, retain valid hatches containing duplicate edges, and correctly subtract holes when computing hatch area. #2856, #2858, #2859
  - Snapping and intersections: Prevent recursive snapping crashes inside filled hatches, correct ellipse vertex snapping and scale-sensitive circle/ellipse intersections, and keep hyperbola trimming and previews on the intended branches. #2671, #2946, #3148
  - Drawing appearance and text: Preserve ByLayer/ByBlock pen inheritance when splitting entities or editing line properties, keep entity visibility independent of layer freezing, restore missing text display, and retain leading-space indentation in MText. #3054, #2949, #2740, #3062
  - Printing and conversion: Correct Linux/CUPS landscape orientation and page margins, improve print-preview state and PDF hairline output, and honor --outfile consistently in dxf2png and dxf2svg. #2674, #2745, #2802
  - Reader and tool stability: Fix sanitizer- and static-analysis findings, including a use-after-free in Tangent Orthogonal, unsafe binary DXF/DWG value reads, invalid debug-format handling, and out-of-range view-coordinate conversions. #3036, #3057
  - Release packaging: Match Windows installers to the executable architecture, correct numeric installer version metadata, build Snap from the release checkout instead of the old pinned version, and preserve draft status during CI asset uploads. #3070, #3155
