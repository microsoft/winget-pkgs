ReleaseNotes: |-
  ## v0.30.0

  • **Quote commands no longer open a WebSocket.** One-shot quote commands now use the HTTP REST quote API：`quote`, `depth`, `brokers`, `trades`, `intraday`, `kline`, `static`, `calc-index`, `capital`, `participants`, `trading`, `warrant`, `option`, `portfolio`, plus the quote lookups in `sharelist` and order previews. Output is unchanged. Commands start faster because no WebSocket handshake is needed. The TUI and `longbridge serve` still use the WebSocket.
  • **API errors now show the business code and a trace id**, for example `Error：API error (code 301604): no quote access` followed by `trace_id: …`. The previous form was `WebSocket error (status=7, code=…)`. If a script parses these messages, update it.
  • **`option chain <SYMBOL> --date <DATE>` works again.** In v0.29.0 it failed with `404000 api not found`.
  • The chat TUI adapts its colors to the terminal's light or dark theme (#330).

  **Full changelog**：https://github.com/longbridge/longbridge-terminal/compare/v0.29.0...v0.30.0
