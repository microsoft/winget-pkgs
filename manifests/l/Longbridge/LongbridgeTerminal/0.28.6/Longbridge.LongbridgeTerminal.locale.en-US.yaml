ReleaseNotes: |-
  ## What's changed

  • **`statement export` now exports legacy statements and reports download failures** — earlier (pre-migration) statements are no longer silently skipped; they're fetched and included, and any per-file download failure is surfaced instead of being swallowed (#324).
  • **`order executions` JSON carries the full execution record, and `--history` paginates over the v3 `execution/all` endpoint** — JSON output now includes `order_id`, `trade_id`, `symbol`, `side`, `price`, `quantity`, `trade_done_at`. With `--history`, fills are filtered by execution time and paginated to completion (no longer capped at 1000) (#321).
  • **Standardized data-center region wording in command and flag help** — help text consistently says "AP accounts" / "US accounts" (#318).
