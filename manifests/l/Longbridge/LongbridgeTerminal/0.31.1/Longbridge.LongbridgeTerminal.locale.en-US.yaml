ReleaseNotes: "## v0.31.1\n\n• **Unknown symbols are errors, with a fix you can use.** `quote`, `static` and `calc-index` now exit non-zero when a symbol does not resolve. Symbols that do resolve are still printed on stdout. Every suggestion is checked before it is shown, so the CLI never recommends a spelling that is just as empty:\n  • `DJI.US` → Did you mean \".DJI.US\"?\n  • `BRK-B.US` → Did you mean \"BRK.B.US\"?\n  • `tesla.US` → no security matches; use the ticker symbol (e.g. TSLA.US), not the company name.\n  • `TSLA.US` with no quote access → the symbol exists but returned no data; check `longbridge auth status`.\n\n  If a script relied on exit 0 with an empty or partial result, check the exit status or stderr instead, and don't discard stdout on a non-zero exit (#340).\n• **`depth`, `brokers`, `trades`, `intraday`, `kline` and `kline history`** add the same suggestion under the server's `invalid symbol` error.\n• **Symbols are case-insensitive.** `tsla.us` works everywhere a symbol is accepted.\n• **`403308` says what to grant.** When a command needs a permission your login did not include (e.g. \"Account & Positions\" for `portfolio`, \"Watchlist\" for `watchlist`), the error names it and tells you to run `longbridge auth login` and tick it on the consent screen.\n• **`--format json` errors are JSON**, including \"not logged in\". stderr carries `{\"error\"：{\"code\", \"message\", \"trace_id\", \"hints\", \"symbols\"}}`. Each `symbols` entry has a stable `status` (`no_data`, `suggest`, `unknown`, `unchecked`), so scripts don't need to parse the message. Usage errors (unknown flag) are still clap's text, exit code 2.\n\n**Full changelog**：https://github.com/longbridge/longbridge-terminal/compare/v0.31.0...v0.31.1"
