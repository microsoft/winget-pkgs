ReleaseNotes: |-
  ## v0.31.2

  • **`portfolio` USD values are correct for HKD-anchored exchange rates.** When an account's exchange-rate table is anchored on HKD (paper trading accounts today), HKD holdings were multiplied by the HKD/USD rate instead of divided, overstating `market_value_usd`, `total_pl` and `total_today_pl` by about 7×. They are now converted correctly (#344).
  • **Currencies quoted only against HKD are converted through HKD.** SGD, CNY and CNH holdings in an HKD-anchored table were passed through unconverted under a USD label.
  • **No more silent pass-through.** When no rate links a holding's currency to USD, `market_value_usd` is `null` and the overview's `total_pl` / `total_today_pl` are `null` (shown as `-` in the table and TUI), instead of the unconverted amount. If a script reads these fields, handle `null`.

  **Full changelog**：https://github.com/longbridge/longbridge-terminal/compare/v0.31.1...v0.31.2
