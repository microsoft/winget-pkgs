ShortDescription: MicYou is a powerful tool that turns your Android device into a high-quality microphone for your PC.
ReleaseNotes: |-
  What's Changed
  iOS 支持
  配合 MicYou for iOS 1.1.2 使用。新增的协议字段向后兼容，旧版 Android 与 iOS 客户端可照常连接。
  - 连接后显示对方是 iOS 还是 Android 设备，Android 客户端同步上报平台 by @ChouChiu in f319bdd
  - iPhone / iPad 可通过 USB 数据线连接：USB 模式下经 usbmuxd 自动连上手机，只连 iPhone 时无需安装 adb（Windows 需安装 iTunes，Linux 需安装 usbmuxd） by @ChouChiu in c1b8096
  - 连接期间每秒向手机发送往返延迟、抖动与丢包率，iOS 端在传输界面显示 by @ChouChiu in 1327613
  桌面端
  - USB 模式改为只监听 127.0.0.1 且不再广播 mDNS，Wi-Fi 下的手机无法连上为数据线启动的服务 by @ChouChiu in c1b8096
  - 重新支持 Intel Mac，纯 Rust VM 替代 ort/ONNX Runtime，PureVox6/AEC7 权重编译期内嵌 by @OrientCOMPASS in #366
  - 安装程序分离 CLI/TUI 快捷方式 AUMID，安装时放行 Windows 防火墙 by @OrientCOMPASS in #361
  - 安装选项增加手动配置防火墙的说明，引导用户选择自动配置 by @OrientCOMPASS in fcf8205
  - 修复 Windows 端串流后音量环动画持续卡顿 by @OrientCOMPASS in #367
  插件
  - 撤销 v2.1.0 中原生插件初始化失败后跳过 deinit 与压缩包解压限额，保留市场插件 ID 校验 by @OrientCOMPASS in #364
  文档与维护
  - README 加入 iOS 客户端 by @ChouChiu in 5d78d30
  - 补充 iOS USB 连接与链路统计的说明 by @ChouChiu in 51f0d08
  - MirrorChyan 工作流指向 MicYou-Dev 组织 by @ChouChiu in 6a34e09
