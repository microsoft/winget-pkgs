ShortDescription: Hardware monitoring dashboard for CPU, GPU, memory, temperatures, network and disks.
Description: |-
  HardViz is a modular hardware monitoring dashboard. Gauges, streaming charts,
  sensor tiles and a top-process list sit on a drag-and-drop grid you can
  rearrange, duplicate and resize. A compact always-on-top overlay fits in a
  corner of a second monitor or over a game, and `hardviz-tui` draws the same
  readings in any terminal. Five themes, per-core CPU, history export to CSV.
  Nothing is sent over the network unless you turn on the update check.
  Reads CPU temperature through the bundled LibreHardwareMonitor on Windows.
