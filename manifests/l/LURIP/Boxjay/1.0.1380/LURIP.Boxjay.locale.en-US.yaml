ShortDescription: Email client with a unified inbox, calendar, tasks and boards.
Description: |-
  Boxjay is a desktop email client for Windows, macOS and Linux. It brings all your accounts into one inbox and adds a calendar, tasks, contacts and boards. A screener lets you decide who can reach your inbox, and a warning appears above suspicious messages. Messages and passwords stay on your computer.
  Boxjay is free to use. Boxjay Pro is an optional paid upgrade bought on boxjay.com: about 25 USD per year, or 49-69 USD as a one-time purchase.
