ShortDescription: Merge images & videos into live photos for smartphone galleries
Description: |
  livephotobox is a command-line utility for merging image and video files into live photos compatible with HUAWEI, Samsung, Google, Apple, Xiaomi, and vivo gallery applications. A live photo is a single file containing both a still image and a short video — when viewed in a supported gallery, the video plays automatically.
