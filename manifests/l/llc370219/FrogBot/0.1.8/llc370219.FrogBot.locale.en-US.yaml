PackageVersion: 0.1.8
PackageLocale: en-US
ShortDescription: Self-hosted AI assistant platform server
Description: FrogBot is a self-hosted AI assistant platform you install on your own server. Up to 32 bots are independent in conversation, tasks, memory, secrets, schedules and workspace. Each bot has a chat layer backed by a fast model and a background executor that reads and writes files and runs commands through an OpenAI-compatible API or an existing Codex CLI, Claude Code, Pi, Grok CLI or Antigravity CLI subscription.
