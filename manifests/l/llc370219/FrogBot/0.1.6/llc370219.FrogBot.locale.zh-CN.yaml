Description: FrogBot 是一个装在你自己服务器上的 AI 助理平台。最多可创建 32 个 Bot，它们的对话、任务、记忆、密钥、定时计划和工作区相互独立。每个 Bot 的聊天层用快模型交流与汇报，后台执行器负责读写文件与执行命令，可接入任意 OpenAI 兼容 API，也可使用已有的 Codex CLI、Claude Code、Pi、Grok CLI 或 Antigravity CLI 订阅。
