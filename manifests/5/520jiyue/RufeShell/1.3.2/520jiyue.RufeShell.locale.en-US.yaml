ShortDescription: SSH and local terminal workbench for remote server operations.
Description: |-
  RufeShell is a native Rust and Tauri 2 workbench for day-to-day remote operations. It combines tabbed SSH and elevated local shells, dual-pane SFTP synchronization, live host telemetry, and container or service management in a single window, without a Java or Electron runtime.

  Core capabilities:
  - SSH and local terminals: multi-tab russh client with password and OpenSSH private key authentication, host key fingerprint verification, auto reconnect, and native Windows ConPTY tabs for PowerShell, CMD, and WSL, including per-tab Administrator elevation through a UAC bridge.
  - Command productivity: command history with recall, search, and deduplication, grouped command snippets with template variables, terminal output search, copy-on-select, and log export.
  - SFTP file management: dual-pane local and remote comparison with batch sync, context-menu file operations, Linux chmod editing, a remote text editor with binary protection and optional .bak backups, and a resumable transfer queue with optional SHA-256 verification.
  - Host operations: customizable telemetry sidebar for CPU, memory, swap, network throughput, disk usage, top processes, and mounts, threshold alerts, remote process and systemd service control, a Docker container panel, and visual management of local, remote, and dynamic SOCKS5 SSH port forwarding.
  - Desktop experience: single-instance mode with system tray, seven synchronized light and dark themes, and a switchable English and Simplified Chinese interface.
  - Security and storage: connection profiles do not store plain-text passwords; credentials are kept in Windows Credential Manager, servers are verified through SHA-256 fingerprints in known_hosts, and in-app updates verify Ed25519 signatures before installation.

  Native Windows ConPTY local terminals and UAC elevation controls are Windows-only. Remote SSH, SFTP, telemetry, port forwarding, and host operations features are also available on other desktop platforms.
