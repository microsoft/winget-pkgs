PackageIdentifier: 520jiyue.RufeShell
PackageVersion: 1.3.2
PackageLocale: zh-CN
ShortDescription: 面向远程服务器运维的 SSH 与本地终端工作台。
Description: |-
  RufeShell 是一款基于 Rust 与 Tauri 2 的原生运维工作台，将多标签 SSH 与本地提权终端、SFTP 双栏同步、主机实时遥测以及容器与服务管理整合到同一个窗口中，无需 Java 或 Electron 运行时。

  核心能力：
  - SSH 与本地终端：基于 russh 的多标签客户端，支持密码与 OpenSSH 私钥认证、主机密钥指纹校验、断线自动重连，以及 PowerShell、CMD 与 WSL 的 Windows 原生 ConPTY 标签页，可通过 UAC 桥接按标签页提权运行。
  - 命令效率：命令历史支持调用、搜索与去重，命令片段支持分组与模板变量，另含终端输出搜索、选中即复制与日志导出。
  - SFTP 文件管理：本地与远端双栏比对及批量同步、右键菜单文件操作、Linux 权限（chmod）编辑、带二进制保护与可选 .bak 备份的远程文本编辑器，以及支持断点续传与可选 SHA-256 校验的传输队列。
  - 主机运维：可自定义的遥测侧边栏展示 CPU、内存、Swap、网络吞吐、磁盘、Top 进程与挂载点，支持阈值告警、远程进程与 systemd 服务管理、Docker 容器面板，以及本地、远端与动态 SOCKS5 SSH 端口转发的可视化管理。
  - 桌面体验：单实例与系统托盘、七套同步的深浅色主题，并支持中英文界面切换。
  - 安全与存储：连接配置不保存明文密码，凭据统一托管于 Windows 凭据管理器，服务器通过 known_hosts 中的 SHA-256 指纹校验，应用内更新在安装前验证 Ed25519 签名。

  Windows ConPTY 本地终端与 UAC 提权能力仅适用于 Windows；远程 SSH、SFTP、主机遥测、端口转发与主机运维等功能在其他桌面平台同样可用。
