PackageLocale: es-MX
Publisher: VCORPS LLC
PackageName: 53ON Harness
License: MIT
ShortDescription: Un arnés de IA con memoria propia, en tu PC. Cada chat usa su propia IA, de la nube o local.
Description: |-
  53ON Harness es una app de escritorio que le da a tu IA manos, ojos y voz en tu propia PC.
  Cada chat puede usar un modelo distinto: Claude, GPT, Gemini, Qwen o un modelo local. Funciona con Claude Code, sigue funcionando sin internet una vez guardadas sus páginas y tiene tema claro y oscuro.
  Su memoria, MemoriaBios, copia cómo funciona la memoria humana: elige qué guardar, olvida con una curva y duerme. MemoriaBios y los demás complementos se bajan firmados desde 53on.com; la memoria viene con un plan de 53ON. Este caparazón es de código abierto (MIT).
