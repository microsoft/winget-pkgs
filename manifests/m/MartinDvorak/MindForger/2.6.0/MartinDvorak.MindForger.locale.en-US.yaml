ReleaseNotes: |-
  rel-260-screenshot
  This minor MindForger release brings editor minimap, find Note by metadata, hierarchical recent Notes, associations colorized by score, Mermaid diagrams upgrade, beautiful Windows UX and revamped AUR package for Arch Linux.
  - Editor
    - Editor minimap - narrow strip on the right side of Note and Notebook editors shows the overview of the edited text in syntax highlighting colors w/ the visible part of the text marked - click it to jump.
    - Note and Notebook editor is wider than the Notebook outline shown next to it - the outline/editor ratio is newly 40%/60%.
    - Editor line numbers can be hidden in Preferences.
    - Light theme editor syntax highlighting newly uses vivid, high contrast colors (e.g. italic text was nearly black).
  - Find and navigation
    - Find Note by Metadata shows Notes in a table w/ name, size (text bytes), reads, writes, created and modified columns which can be used for sorting to find the biggest, oldest or most visited Notes.
    - Recent Notes view shows the history as a tree where consecutive Notes from the same Notebook are grouped under the Notebook.
    - Recent Notes view toggle to show Notes which were recently viewed or edited, or edited only.
    - Opened Notebook shelf shows the shelf name in the table header.
    - Esc leaves the command palette and gives focus to the next component in the view.
  - Mind inspired features
    - Associations panel bars are colored green/orange/red by the association score.
  - HTML preview
    - Mermaid diagrams upgraded from mermaid.js 7.1.0 to 12.2.0 - new diagram types (mindmap, timeline, gitGraph, quadrant, ...) and syntax newly work, diagrams follow dark/light HTML theme.
    - Note view shows Note tags under the Note title - aligned w/ Notebook description view which shows Notebook tags under the title.
  - Windows
    - Native theme newly uses the Windows palette: selected rows in Notebook/Note tables, outline tree, enabled status bar ADLMSTW diodes, ...
    - Native theme editor newly has VSCode light inspired Markdown syntax highlighting.
    - Editor font is never smaller than the application font (from Monospace to Consolas), UI newly follows Windows display scaling including fractional factors.
    - Application font (Notebook and Note names in tables and outline tree, command palette, ADLMSTW diodes, Note name and buttons in the editor, ...) is newly Windows UI font (Segoe UI 9pt like menu) - it used to be smaller and it was tiny when MindForger was started after display scaling had been changed (e.g. 100% > 300% on 4K) without signing out.
  - Distributions
    - Arch Linux - upstream reference PKGBUILD for the AUR mindforger package (Qt WebKit) is newly maintained in build/arch/ and verified in an Arch Linux Docker container.
    - MindForger can be built w/ CMake 4 (e.g. on Arch Linux) - the bundled cmark-gfm newly requires CMake 3.5 and all maintained build scripts pass CMake 4 compatibility.
  - Fixes
    - Menu and main toolbar icons are newly darkened on light menus/toolbar (native and light themes) on Windows, Linux and macOS to be readable.
    - Blurry menu and toolbar icons on Linux and macOS HiDPI displays (4K, Retina, scaling set by QT_SCALE_FACTOR) - icons are rendered in device pixels.
    - Native theme on Linux and macOS (light mode) had no editor syntax highlighting - it newly follows OS light/dark palette.
    - macOS native dark theme colors todo tasks in the editor (previously they were black, i.e. invisible) and in progress tasks are orange.
    - Editor syntax highlighting no longer shows underscores inside words (e.g. this_is_function_name_) as italic, and bold requires non-whitespace before the closing * (e.g. aaa *bbb * ccc is not bold).
    - Find Notebook by Name (Ctrl-Shift-B) finds only Notebooks which are on the shelf when a Notebook shelf is opened.
  Ubuntu PPA | Debian PPA | Fedora COPR | Windows nightly builds
  Download MindForger
