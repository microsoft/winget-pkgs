ShortDescription: Arabic desktop home for AI coding agents (Claude Code, Codex, Kimi Code) with full right-to-left rendering.
Description: |-
  Satr runs AI coding agents that live in the terminal — Claude Code, Codex, Kimi Code and OpenAI-compatible providers — behind an Arabic desktop interface that renders right-to-left text correctly, including an embedded Arabic-aware terminal, an isolated web preview, permission dialogs in Arabic, session browsing, and file diffs.
  Each engine is used with your own subscription or API key through the vendor's unmodified binary; Satr stores no credentials and sends no telemetry.
