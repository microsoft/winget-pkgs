Description: |-
  «سطر» يشغّل وكلاء البرمجة الذكية التي تعيش في سطر الأوامر — Claude Code وCodex وKimi Code والمزوّدين المتوافقين مع OpenAI — خلف واجهة سطح مكتب عربية تعرض النص من اليمين إلى اليسار بشكل صحيح، مع طرفية مدمجة تفهم العربية، ومعاينة ويب معزولة، ومربعات أذونات بالعربية، ومتصفح جلسات، وعارض فروقات.
  كل محرّك يُستعمل باشتراكك أو مفتاحك أنت عبر ثنائي المزوّد غير المعدَّل؛ «سطر» لا يخزّن أي اعتماد ولا يرسل أي بيانات استخدام.
