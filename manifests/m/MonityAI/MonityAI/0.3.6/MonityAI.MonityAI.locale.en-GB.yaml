ShortDescription: Free local-first website change monitoring, uptime checks and browser tests.
Description: |-
  Monity Desktop is a free website-monitoring app for Windows and macOS that runs entirely on your own computer. It watches pages for changes, checks that sites are up and tests that sign-up, login, search or checkout still works, with no account, no subscription and no credits.

  Page changes: watch a whole page, one element or an area for text or visual changes, as often as every 5 minutes, with a picture of exactly what changed.
  Uptime: website, keyword, port, DNS and email monitors, checked as often as every 30 seconds. A failure is checked twice more before you are told.
  Tests: check that sign-up, login, search or checkout still works, step by step, with a picture of each page.
  Datasets: collect rows from many pages, such as products and prices, and see which are new, changed or gone, then export to CSV, Excel, JSON or Markdown.

  Checks start from your own computer, so local addresses work: your dev server, your router, or a site on your VPN. For pages behind a login, sign in once in Monity's own browser and the session stays on your computer. The app sends no error reports and no usage data, and your monitors and their history stay on your machine. Close the window and checks carry on from the system tray.

  Alerts arrive as desktop notifications, email through your own mail server, Discord, Microsoft Teams or a webhook. AI is optional: connect Claude Code, Codex, Ollama, a built-in model that runs offline, or your own OpenAI-compatible key, and Monity describes each change in plain words and sets monitors up on request. Claude Code, Codex and other MCP clients can create and review monitors through Monity's local MCP server.

  Heartbeat monitors for cron jobs, public status pages, checks from a second location and a dataset's live Google Sheet link are not in the desktop app, because they need an address the internet can reach or Monity's servers.
