PackageIdentifier: MonityAI.MonityAI
PackageVersion: 0.3.6
PackageLocale: zh-CN
License: 免费软件
ShortDescription: 免费的本地优先网站变化监控、可用性检查与浏览器测试工具。
Description: |-
  Monity Desktop 是一款免费的网站监控应用，在 Windows 与 macOS 上完全在本机运行。它会监视页面变化、检查网站是否可访问，并测试注册、登录、搜索或结账流程是否仍然可用，无需账号、无需订阅、也不消耗额度。

  页面变化：以最短 5 分钟的频率监视整个页面、单个元素或某一区域的文本与视觉变化，并给出变化位置的截图。
  可用性：网站、关键字、端口、DNS 与邮件监控，最短每 30 秒检查一次；发现故障后会再检查两次才通知你。
  测试：逐步检查注册、登录、搜索或结账流程是否仍然可用，每一步都附带页面截图。
  数据集：从多个页面收集商品、价格等行数据，并查看哪些是新增、变化或消失的，可导出为 CSV、Excel、JSON 或 Markdown。

  检查从你自己的电脑发起，因此本地地址同样可用：开发服务器、路由器，或 VPN 内的网站。需要登录的页面只需在 Monity 内置浏览器中登录一次，会话会保留在本机。应用不会发送错误报告或使用数据，监控项与历史记录都留在你的电脑上；关闭窗口后检查仍会在系统托盘中继续运行。

  告警可以通过桌面通知、经由你自己的邮件服务器发送的邮件、Discord、Microsoft Teams 或 Webhook 送达。AI 为可选功能：接入 Claude Code、Codex、Ollama、内置的离线模型或你自己的 OpenAI 兼容密钥后，Monity 会用平实的语言描述每一处变化，并按需创建监控项。Claude Code、Codex 及其他 MCP 客户端也能通过 Monity 的本地 MCP 服务器创建和查看监控项。

  面向 cron 任务的心跳监控、公开状态页、从第二个地点发起的检查，以及数据集的 Google 表格实时链接不在桌面应用之中，因为这些功能需要公网可访问的地址或 Monity 的服务器。
