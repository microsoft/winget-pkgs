# winget installer manifest for the Mash CLI, filled by packaging/render.py.
# The release zip holds two programs; winget puts each on PATH by its alias.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: MashHQ.Mash
PackageVersion: 0.2.3
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: mash.exe
    PortableCommandAlias: mash
  - RelativeFilePath: mash-server.exe
    PortableCommandAlias: mash-server
Commands:
  - mash
  - mash-server
# The programs are built against the Visual C++ runtime for their architecture.
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/mashhq/mash/releases/download/v0.2.3/mash-x86_64-pc-windows-msvc.zip
    InstallerSha256: 0081D06831741E154F365ECD24A8F82D5F516F92DACB9ECD6A21A04249E6628B
    Dependencies:
      PackageDependencies:
        - PackageIdentifier: Microsoft.VCRedist.2015+.x64
  - Architecture: arm64
    InstallerUrl: https://github.com/mashhq/mash/releases/download/v0.2.3/mash-aarch64-pc-windows-msvc.zip
    InstallerSha256: 2C25CC229FB4B4BD0A39014725F1BDDA93DAA8D1661A788703D6CB98D4ECEBA2
    Dependencies:
      PackageDependencies:
        - PackageIdentifier: Microsoft.VCRedist.2015+.arm64
ManifestType: installer
ManifestVersion: 1.10.0
