ShortDescription: Offline, keyboard-driven daily task manager for the terminal.
Description: |-
  Tasker keeps one task list per calendar day. Unfinished work never disappears: open tasks from
  past days resurface in today's view as Overdue, still pinned to their original day. Deadlines get
  their own Due today and Missed due sections, tasks carry tags you can filter by, and each task
  has a live timer that survives restarts.

  It is a single binary with no accounts, no network and no server - everything lives in one local
  SQLite file. A month-grid calendar jumps between days, a Summary reads out the shape of the day,
  and the same storage backs a non-interactive CLI for capture, search, export and machine-readable
  output.
