ShortDescription: End-to-end encrypted clipboard sync between Windows and Android.
Description: |-
  ClipBridge synchronizes text you copy between Windows PCs and Android phones. Text is end-to-end encrypted (ECDH P-256, HKDF-SHA256, AES-256-GCM) before it leaves a device; the relay only forwards encrypted messages and cannot read them.
  Pair devices with a QR code and an 8-character verification code. A PC can pair with up to 8 devices, and text received from one is forwarded to the others. If a device is offline, the relay keeps the latest encrypted message for up to 24 hours. An optional local history is encrypted on the device.
  No ads, analytics or telemetry. The Android app is available on Google Play.
