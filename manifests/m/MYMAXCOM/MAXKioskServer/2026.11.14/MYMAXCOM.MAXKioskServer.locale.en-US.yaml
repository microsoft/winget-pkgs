ShortDescription: The surau information screen on the TV and the surau's MAXCOM server on a Windows PC at the surau.
Description: |-
  MAX Kiosk Server turns a Windows PC at the surau into your surau's MAXCOM box. MAXCOM is a digital notice board and live broadcast system for suraus and mosques. It is free and open source.
  The MAXCOM box shows the surau information screen on the TV all day (prayer times, azan and iqamah countdowns, kuliah, announcements, posters, funds and videos) and runs the surau's MAXCOM server on the PC itself, so the surau's data stays at the surau and the screen keeps running when the Internet is down. It also receives a live broadcast from a committee member's phone or the surau's IP camera and can send it to the surau's YouTube channel.
  Content is managed with the MAX Admin Client phone app. Needs Windows 10 or 11 64-bit and administrator rights. A silent install uses the surau name "Surau" and the screen type "kongsi" (shared PC); both can be changed later. Guide: https://mymaxcom.my/
