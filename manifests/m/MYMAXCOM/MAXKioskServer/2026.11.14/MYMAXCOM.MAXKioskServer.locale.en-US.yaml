ReleaseNotes: |-
  Videos played right away or once a day after a prayer's zikir; a clearer, louder live broadcast; the Windows box Mic-in gets microphone access at setup; one joined recording after the broadcast; phone numbers optional; automatic box names; security and reliability improvements.
