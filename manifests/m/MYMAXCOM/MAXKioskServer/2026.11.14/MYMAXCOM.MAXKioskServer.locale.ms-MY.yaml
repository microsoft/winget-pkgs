ShortDescription: Skrin maklumat surau di TV dan pelayan MAXCOM surau pada komputer Windows di surau.
Description: |-
  MAX Kiosk Server menjadikan komputer Windows di surau sebagai kotak MAXCOM surau anda. MAXCOM ialah sistem papan maklumat digital dan siaran langsung untuk surau dan masjid. Perisian ini percuma dan sumber terbuka.
  Kotak MAXCOM memaparkan skrin maklumat surau di TV sepanjang hari (waktu solat, kiraan detik azan dan iqamah, kuliah, pengumuman, poster, tabung dan video) dan menjalankan pelayan MAXCOM surau pada komputer itu sendiri, jadi data surau disimpan di surau dan skrin terus berjalan walaupun Internet terputus. Ia juga menerima siaran langsung dari telefon AJK atau kamera IP surau dan boleh menghantarnya ke saluran YouTube surau.
  Kandungan diurus dengan aplikasi telefon MAX Admin Client. Perlukan Windows 10 atau 11 64-bit dan hak pentadbir. Pemasangan senyap menggunakan nama surau "Surau" dan jenis skrin "kongsi"; kedua-duanya boleh diubah kemudian. Panduan: https://mymaxcom.my/
