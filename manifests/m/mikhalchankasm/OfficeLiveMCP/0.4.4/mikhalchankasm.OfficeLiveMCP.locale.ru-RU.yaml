# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: mikhalchankasm.OfficeLiveMCP
PackageVersion: 0.4.4
PackageLocale: ru-RU
Publisher: mikhalchankasm
PackageName: Office Live MCP
License: MIT
ShortDescription: MCP-сервер, через который ИИ-агенты работают с уже открытыми на рабочем столе Excel и Word.
Description: |-
  Office Live MCP подключает ИИ-агентов (Claude, Cursor, Codex, ZCode и другие MCP-клиенты) к Excel и Word, уже
  открытым на этом компьютере. Изменения сразу видны на экране, пока вы работаете рядом с агентом. Нужен настольный
  Excel и/или Word (проверено на Microsoft 365). Тихая установка не подключает агентов: используйте
  Пуск → Office Live MCP → Подключить к агентам или интерактивную установку (winget install -i).
ReleaseNotesUrl: https://github.com/mikhalchankasm/office-live-mcp/releases/tag/v0.4.4
