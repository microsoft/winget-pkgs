ReleaseNotes: |-
  Changes
  - 2026-07-25 Fix documentation folder finding via DOOMTOOLS_DOCPATH in the GUI (Issue #189).
  DECOHack
  Changed for 0.48.1
  - Changed DECOHack will warn about certain EdNums having reserved use in other ports. (Issue #192)
  DoomMake
  Changed for 0.37.0
  - Fixed Doing a clean on a new project when files are not deleted will result in an error condition and list the files not deleted.
  - Fixed Running an editor target on a new project will now attempt to build the project before checking if things were built.
  WadTex
  Changed for 1.5.6
  - Added [GUI-TextureEditor] Patch copy/paste between textures (or same texture) (Enh. #173).
  - Added [GUI-TextureEditor] Clicking on a patch in the texture canvas will select it (Enh. #173).
  - Added [GUI-TextureEditor] Canvas export of texture (Enh. #173).
