ReleaseNotes: |-
  Source filters
  Added support for network streams whose "Content-Type" field contains an additional "codecs" parameter.
  MP4Splitter
  Added support for Dolby Vision in AV1 ('dav1').
  MpaDecFilter
  Added support for MS ADPCM and IMA ADPCM.
  MPCVideoDec
  Fixed hardware decoding for older Intel graphics.
  Expanded support for Dolby Vision in AV1 ('dav1').
  yt-dlp
  Fixed detection of the VP9 video codec for some video hosting services.
  Protocol "http_dash_segments" is not supported.
  Player
  Fixed remembering the title of the entry in the playlist for URLs processed by yt-dlp.
  Fixed getting icon for file properties window when path length is 260 or more characters.
  The "Use Blur Behind effect" setting has been removed because it does not work correctly.
  Added the ability to speed up video by long-pressing the left mouse button.
  Fixed text in the file name field in saved thumbnails.
  Added the ability to use the Ctrl+BackSpace keyboard shortcut to delete the last word in the command, history, and playlist filter fields.
  Various interface fixes.
  Installer
  Updated MPC Video Renderer 0.10.7.
  Added Vietnamese translation (by vuanhvu11982-afk).
  Updated German translation (by Klaus1189).
  Updated Romanian translation (by Andrei Miloiu).
  Updated Japanese translation (by tsubasanouta).
  Updated Korean translation (by Hackjjang).
  Updated Turkish translation (by cmhrky).
  Updated Hungarian translation (by mickey).
  Updated Bulgarian translation (by jekovcar).
