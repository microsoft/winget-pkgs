ReleaseNotes: |-
  - New features:
    The user interface is translated into 44 languages, chosen from the Language menu; MicroDicom uses the language of Windows until you choose another one.
    Added support for languages written from right to left (Arabic, Hebrew and Persian): the windows are mirrored, but the images are not.
    Added fusion to the 3D view: a PET is shown as a coloured MIP over the CT rendering and follows the window of its 2D view.
    PET series are windowed from 0 to a percent of the highest value of the series, or to an SUVbw. They have their own window presets and open with 0 - 25 %.
    PET series show the same values in all views: the series, the Coronal, Sagittal and oblique MPR, the fusion and the 3D use the same window, and the MPR shows SUVbw.
    The 3D of a PET opens as an inverted MIP and takes the window of the PET in 2D.
    The Edit Windowing dialog has the minimum and maximum of the window, so a PET window can be typed as 0 - 5 SUVbw.
    Window presets are kept per modality: the CT presets are shown only on CT images, and a custom preset can be saved for all images or for one modality.
    The default CT window presets have shorter names, and new presets were added: Angio, Subdural, Stroke, Temporal bone, Spine and Postmyelo. The Windowing menu shows up to 20 presets.
    The CT table is hidden in the 3D view also when the patient touches it, as on the cradle of a PET/CT.
    The studies of a patient are sorted by date, from older to newer.
    The thumbnails in the DICOM browser use the default window of the file, and PET thumbnails are inverted as in the viewer.
    The license dialog has a link to renew the maintenance when the license doesn't cover the version.
    The registration wizard explains what counts as commercial use.
    Updated the user manual.
  - Defect fixing:
    Fixed the import of a ZIP file whose name has no .zip extension into the local database.
    Fixed Delete image in the local database: the file is removed, and a series or study left empty is removed too.
    Fixed the status of a study in the local database, which was lost after Reindex or after editing tags.
    Fixed the editing of DICOM tags of a series, study or patient: a failed save is shown, a repeated edit reaches all images, and the tags of the active image stay after Apply.
    Fixed the old item left in the DICOM browser after editing a tag that changes the patient, study or series.
    Fixed the DICOM browser after a refresh that found no files, e.g. after the folder was removed or the CD ejected.
    Fixed the frame count in the DICOM browser for a multi-frame image that is still loading.
    Fixed the window of an image without window center and width in the file.
    Fixed the inversion of a PET MPR when the MPR of a CT beside it is changed.
    Fixed the MPR of rotated series whose pixels are not square.
    Fixed duplicate names of window presets in the Options.
    Fixed multiple crashes, among them crashes in printing, 3D, 3D MPR, fusion, anonymizing, structured reports, JPEG 2000 images and large images.
