ShortDescription: AI-AGI 智能体规范监视器 —— 非侵入式外置监护本机 AI 智能体的行为规范
Description: 猫盾是一款独立的 Windows 桌面监护软件（不是杀毒软件）。它不修改任何智能体代码，而是从外部持续监视本机 AI 智能体、自动化脚本与工作流的行为：装完自动全盘发现本机 AI/AGI 资产并纳入监控；按七条底线规范做四级处置（观测/预警/拦截/封禁）；为用户批准的智能体签发限时限目录限权限的任务许可证；高危动作（执行系统命令、批量外发、隧道）二次确认；对文件删除区分「用户本人删除」与「AI/程序删除」——用户删除放行并留痕、AI 删除留证据并询问用户。全程可审计，个人用户终身免费。
