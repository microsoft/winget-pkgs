License: MIT OR Apache-2.0
LicenseUrl: https://github.com/meh7an/allot#license
ShortDescription: Coordinates heavy jobs between the Claude Code sessions on one machine.
Description: |-
  Allot is a small local daemon with a CLI, an MCP server and a tray app. Claude Code sessions ask it
  for a lease before a build, test suite, benchmark or training run, and wait their turn when the
  machine is busy, instead of all compiling at once.
  The setup installs Allot for the current user in %USERPROFILE%\.allot, sets up Claude Code (the
  MCP server, hooks, skill and CLAUDE.md rule), and starts the tray app at sign-in.
Moniker: allot
