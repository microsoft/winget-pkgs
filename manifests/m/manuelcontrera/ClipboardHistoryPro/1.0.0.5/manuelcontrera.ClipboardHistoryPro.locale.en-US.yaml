ShortDescription: Raycast-style 30-day clipboard history with Pantone color cards, source app logos, and instant pasting for Command Palette.
Description: |-
  Clipboard History Pro brings seamless, privacy-first clipboard management into Microsoft PowerToys Command Palette.
  Features include:
  - 30-day retention with zero CPU overhead using a local SQLite WAL engine.
  - Raycast-style Pantone color card previews with CMYK, RGB, and HSL formats.
  - Source application identification with official 16x16 app logo badges.
  - Context menu actions (Ctrl+K) to open copied images in the default Windows photo viewer.
  - Favicon resolution for copied links.
  - Minimalist list view and rich details side panel.
  - 100% offline, local storage, password manager safe.
