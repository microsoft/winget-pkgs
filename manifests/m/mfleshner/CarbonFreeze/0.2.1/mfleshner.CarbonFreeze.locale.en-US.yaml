ShortDescription: Keep several saves for games that only support one, and swap between them in one click.
Description: CarbonFreeze keeps multiple independent save profiles for games that only keep one save, and swaps between them by renaming the save folder. The outgoing save is zipped before every swap and nothing is deleted without a backup. Steam games are picked from a list and the save folder is detected automatically for most of them.
