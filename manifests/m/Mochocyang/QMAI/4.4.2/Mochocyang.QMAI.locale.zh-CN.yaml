ShortDescription: 面向长篇小说的记忆型 AI 写作桌面系统。
Description: |-
  青幕AI写作不是普通的 AI 聊天写作工具，而是一套长篇小说记忆型写作系统，专为 200 万～300 万字量级的连载小说创作设计。核心理念是：写前自动提取上下文，写后自动沉淀章节记忆，图谱追踪关系变化，审查系统防止崩坏，人工确认最终定稿。
  大纲体系拆成总纲、卷纲、章纲三级并逐级细化，每一级都能同时产出 Markdown 文本与可视化 HTML。章节记忆摄取后通过 BM25、向量与图谱混合检索召回，角色灵魂系统保持人物性格一致，六维审查提示设定漂移，剧情推演室用多智能体黑板对剧情进行推演。
  需要自行配置至少一个大语言模型 API（支持 OpenAI 兼容接口、Ollama 等），工程与资料保存在本机。
Tags:
- 人工智能
- 写作
- 剧情推演
