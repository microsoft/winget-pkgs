ShortDescription: Free, open source HTTPS debugging proxy and Fiddler Classic alternative for Windows, macOS and Linux.
Description: "VioLens shows you every HTTP and HTTPS request your browsers and apps make, and lets you pause, change and replay them. It's built to replace Fiddler Classic: it opens SAZ and HAR files, runs CustomRules.js-style FiddlerScript, and supports AutoResponder rules, breakpoints, the Composer and .NET extensions. It runs on Windows, macOS and Linux, is free for any use under the MIT license, and isn't affiliated with Progress or Telerik."
