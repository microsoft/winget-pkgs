ReleaseNotes: |-
  There have been some BTC and USD donations in the past several months and years. I very value these things and let me say it is not because of their monetary aspect. It is because that's a proof that you - users - value and cherish RSS Guard and use it regularly.
  https://rssguard.readthedocs.io/en/stable/donations.html
  Thank you.
  Added:
  - Feed and article searches can now be set to run only after pressing Enter. (#2277)
  - The Settings window now reopens the section that was selected last. (#2365)
  - Article filters can now be moved five positions at a time with Shift, or directly to the top or bottom with Ctrl. (#2320)
  - Added icons to more commands and context-menu actions.
  - Feed-list deletion confirmations now identify the selected item and show how many feeds and folders it contains. (#2396)
  - Article filter scripts can now retrieve matching stored articles and inspect their custom data.
  - Generated JSON, RSS, Atom and RDF feeds can now attach persistent custom data to their articles.
  - Individual feeds can now be left out of global unread counters. (#1955)
  Fixed:
  - Saving an image from an article now writes the complete image and suggests its actual filename instead of always using image.png. (#2399)
  - The visual article-filter generator now uses safer defaults and warns about filters which would discard every newly downloaded article. (#2397)
  - Article limits changed through "Edit child feeds" now apply correctly to all selected feeds, including recursive edits. (#2392)
  - Feed list filtering now remains responsive with very large feed trees.
  - Processing existing articles with filters now remains fast when many articles are ignored.
  - Database operations no longer repeatedly reapply connection settings that are already active.
  - Updating large batches of articles now requires far fewer database queries.
  - Windows taskbar feed-fetching errors are now highlighted independently of unread article counts.
  - Cloudflare and similar website anti-DDoS checks now work more reliably. (#2351)
  - Google Reader API accounts now receive read-state changes made in other clients when "Download unread articles only" is enabled. (#2385)
  - Article filters now process batches of downloaded articles much faster, especially when several filters are assigned to a feed.
  - Stopping feed fetching no longer blocks the application while active downloads are finishing. (#2375)
  - Opening the first article in the WebEngine viewer on Windows no longer briefly flashes the main window.
  - Paused tray icon now respects the configured monochrome or colored appearance. (#2373)
