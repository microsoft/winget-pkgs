ShortDescription: Offline design and video studio with design pages, a video timeline, presentations, infinite canvas and whiteboards in one local workspace.
Description: |-
  dika.studio Community Editor is a complete creative production environment for design and video.
  It brings visual design, motion, presentations, infinite canvas, whiteboards and a full video
  timeline into one workspace, with no cloud project or subscription required.

  Projects and media stay on the machine. Designs can be built from text, shapes, images, freehand
  drawing, crop, masks, filters and effects as single pages, multi-page work, slide decks, infinite
  scenes or whiteboards. The same project can move from canvas to timeline, where clips, graphics,
  text and audio are arranged and exported as H.264 MP4 directly through WebCodecs and mp4-muxer,
  without a render server or a separate ffmpeg installation.

  Background removal, magic select, upscaling and Whisper subtitles run on the local machine, so
  source images and audio are not uploaded for processing. Work imports and exports as PNG, JPG,
  PDF and SVG, and saves as .dika for editable structure or .dikapack for structure and media
  together.

  The source is available under the Business Source License 1.1. Each version converts to AGPL-3.0
  four years after publication; the current release is source available, not open source.
