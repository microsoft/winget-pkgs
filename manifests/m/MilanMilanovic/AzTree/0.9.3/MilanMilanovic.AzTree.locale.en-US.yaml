ReleaseNotes: |-
  The map and the side panel are easier to read. The accent is a neutral grey instead of Compute's amber, and Color by change uses red and blue instead of red and green, so colour-blind readers can tell growth from drops; flat spend is no longer coloured as a drop. Only the boxes behind the rows Worth a look shows are hatched, a box shows its name only when enough of it fits, and the whole bill drops "of bill 100%" and the monthly pace that repeated Azure's forecast. The executables now come with a build attestation: check one with gh attestation verify <file> --repo milanm/aztree.
  Install with pipx install aztree or dotnet tool install -g aztree, or download the executable for your system below. The downloads aren't signed yet: Windows and macOS ask once before running them, and a few antivirus engines flag the Windows executable, as they do many Python tools packed with PyInstaller. Check that a download was built here with gh attestation verify <file> --repo milanm/aztree, or install with pipx, which runs the plain Python source.
