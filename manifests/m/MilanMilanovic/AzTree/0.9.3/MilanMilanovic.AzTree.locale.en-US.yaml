ShortDescription: See where your Azure money goes, as a treemap in one offline HTML page.
Description: aztree reads your Azure costs through Cost Management and draws them as a treemap, with what grew, what to fix, Advisor tips and this month's forecast. It needs the Azure CLI (az login) or a token in AZURE_ACCESS_TOKEN.
