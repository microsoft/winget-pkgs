ShortDescription: Dosyaları parçalara bölüp daha hızlı indiren ücretsiz, açık kaynak bir IDM alternatifi.
Description: |-
  Shardload, Windows ve Linux için Internet Download Manager tarzında bir indirme yöneticisi. Her
  dosyayı aynı anda birkaç bağlantıyla indirir, çökmeden sonra kaldığı yerden sürer; eklentisiyle
  tarayıcının (Chrome, Edge, Firefox ve diğerleri) indirmelerini devralır; YouTube ve pek çok
  siteden video, HLS/DASH yayınları, torrent, magnet, FTP ve SFTP indirir. Kategoriler, kuyruk,
  zamanlayıcı, hız sınırı ve yapay zekâ asistanları için MCP sunucusu. Reklam, deneme süresi ya da
  hesap yok.
