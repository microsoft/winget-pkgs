ShortDescription: A free, open-source IDM alternative that splits files into parts to download faster.
Description: |-
  Shardload is a download manager for Windows and Linux in the spirit of Internet Download Manager.
  It downloads each file over several connections at once and resumes after a crash, takes over the
  browser's downloads (Chrome, Edge, Firefox and others, through its extension), saves videos from
  YouTube and many other sites, HLS/DASH streams, torrents, magnet links, FTP and SFTP. Categories, a queue, a
  scheduler, speed limits and an MCP server for AI assistants. No ads, no trial, no account.
