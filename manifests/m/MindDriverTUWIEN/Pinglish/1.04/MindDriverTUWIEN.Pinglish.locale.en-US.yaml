ShortDescription: Type Persian in Latin letters, or just speak it, and get proper Persian script.
Description: |-
  Pinglish converts Pinglish / Finglish (Persian written in Latin letters, such as "salam chetori?")
  into Persian script ("سلام چطوری؟") as you type. Click any word to pick another spelling from a
  list of alternatives. Text conversion runs offline on your PC.
  Optional: speak Persian into the microphone and see the text appear live. Speech is sent to Google
  for recognition only while the mic is on, and can be turned off during installation.
