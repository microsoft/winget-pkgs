ReleaseNotes: |-
  跨平台抓包 / 代理工具，通过 JavaScript 插件实时修改请求与响应、Mock 和断点调试。
  新增功能
  - 全新的根证书安装引导：包含 Windows / macOS / iOS / Android / Firefox 等详细的图文教程并支持当前平台一键安装，启动时如果未安装根证书自动弹窗引导
  - 新增 Linux AppImage 安装包（x64，要求系统 glibc >= 2.39，如 Ubuntu 24.04+ 系统），下载后授予执行权限即可运行
  - 关于界面新增第三方许可声明，headless 版可以通过命令参数 -licenses 查看
  优化改进
  - 设置界面支持分类导航与搜索（支持 Ctrl/Cmd + K 快速搜索）
  - 「导入服务端证书」移至设置的「HTTPS 解密」分类下
  - 断点编辑器改为按需加载，减小初始化加载的前端体积
  - 桌面框架升级至 Wails v3.0.0 正式版
  问题修复
  - 修复 HTTP 协议版本号展示错误的问题（客户端请求与上游响应的协议版本分开显示，HAR 导入导出同样保留）
  - 修复流式响应进行中状态码与协议版本没有展示的问题
  致谢
  - 感谢 IIce 关于 Linux 安装包的意见
  - 感谢 75905pfkc 关于 Firefox 安装指引的意见
