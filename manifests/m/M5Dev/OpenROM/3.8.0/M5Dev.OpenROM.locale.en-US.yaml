ShortDescription: Universal Retro Gaming Toolkit — convert, patch, and manage ROMs offline
Description: |-
  OpenROM is a free, open-source Universal Retro Gaming Toolkit.
  Convert disc images (CHD, CSO, RVZ, XISO), apply and build ROM patches
  (IPS, BPS, UPS, PPF, xdelta3, DCP, SSP), rename ROMs against No-Intro
  and Redump DATs, edit Dreamcast IP.BIN, and more — all offline.
  Includes a full headless CLI (openrom-core) for automation and scripting.
