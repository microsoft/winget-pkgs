ReleaseNotes: "**Features:**\r\n• #8015 [FEATURE REQUEST] Account icons：usability, custom selection, and bank logos\r\n• #8401 wx3.3.3\r\n• #8297 Enchancements in database API\r\n• #8287 Currency Manager, add apostrophe ' to the \"Grouping char\"\r\n• #8279 Warning messages when compiling on Windows 11\r\n• #8260 Modified Payee-PayeeTrend.grm (with Select input)\r\n• #8239 New string translation macros\r\n• #8229 Update to wxWidgets v3.3.2\r\n• #8175 [regression] User interface language\r\n• #7870 Make reconciled balance disappear on home screen if you want it to\r\n• #8404 Fix：Clang compiler support, warnings removed\r\n• #8339 Translate \"Cash Ledger\"\r\n• #8320 Add selection between accounts and account types in summary of accounts report\r\n• #8314 Add filtering for accounts and time period in summary of accounts report\r\n• #8241 Move OK/CANCEL button locations on transaction dialog\r\n• #8221 Dashboard updates and corrections\r\n• #8219 Journal Panel additional functionality\r\n• #8195 fix(#8191)：package wxWidgets translations\r\n• #8088 Add tooltips to toolbar configuration buttons\r\n• #8072 Clarify CSV field labels for real and unreal gains\r\n• #7994 Feature：Toolbar and Navigator configuration and custom account types\r\n• #7962 Added the option to export stocks and added the option to limit the exported transactions/stocks between 2 dates (issue#7810)\r\n\r\n**Bugfixes:**\r\n• #8276 Crash on startup with existing databases in 1.9.3.0 on Windows bug\r\n• #8431 Cannot jump from Transaction Report to account list\r\n• #8432 Wrong \"Selected transactions total\" with multi-currency database\r\n• #8390 Bug：Asset account view cannot be hidden in navigator configuration\r\n• #8364 Create a scheduled transaction from an existing transaction (category and tags are missing)\r\n• #8352 csv delimiter \"|\" give Bad allocation Error\r\n• #8324 OFX Error\r\n• #8311 Column width resizing is not saved\r\n• #8309 Non riesco a stampare\r\n• #8292 License dates are still wrong\r\n• #8274 Error opening a new database\r\n• #8268 Context menu right‑click causes crash in Currency Manager\r\n• #8265 Payee Report - All = incorrect results\r\n• #8262 Performance issue on v1.9.3 Beta\r\n• #8257 App crashes when selecting a closed Bank Account\r\n• #8254 Attachments will no longer be displayed in the transaction overview\r\n• #8225 Missing translation 1.9.3 Béta version\r\n• #8192 Time stamp for “Scheduled Transactions” is missing when entering manually\r\n• #8176 Account deletion does not work\r\n• #8169 Notes and color field are in the wrong place in \"transaction report\"\r\n• #8140 Reconcile window opening balance may be incorrect if future transactions are displayed in checking panel\r\n• #8130 Accounts Balance - Yearly Report Closed accounts\r\n• #8124 Date Range issues\r\n• #8118 Update Account Name in Account View\r\n• #8116 [Reconcile account] Number formats\r\n• #8087 Dashboard does not show Last N days\r\n• #8057 GUI：Misprint at Stock Portfolio Overview (Tips, English)\r\n• #8000 Reconcile dialog calculator not working on MacOS\r\n• #7240 Homepage Import/Export CSV Link\r\n• #8413 Column handling fixes and refactor\r\n• #8403 Fix：Correct display of disabled buttons under Linux/GTK\r\n• #8400 Fix：display configured names in panel haeders and navigator edit dialog\r\n• #8359 Reconcile dialog - update sums after edit\r\n• #8349 Fix regression introduced with \"refine TrxDialog\"\r\n• #8335 Fix new account type always defaulting to Checking\r\n• #8306 Fix currency related crashes during new database creation\r\n• #8253 Fix segmentation fault\r\n• #8247 Misc Fixes and updates\r\n• #8245 Two (minor) Bugfixes\r\n• #7997 Qif import fixes\r\n• #7706 ERROR PRINTING TRANSACTIONS\r\n• #7685 Transaction Report Settings Are Not Saved"
