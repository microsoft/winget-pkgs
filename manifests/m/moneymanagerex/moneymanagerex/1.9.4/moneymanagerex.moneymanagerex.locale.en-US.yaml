ReleaseNotes: "Mainly bug fixes found after v1.9.3 release.\r\n\r\n**Note：There is a balance calculation issue with this release when using date range filters, see https://github.com/moneymanagerex/moneymanagerex/issues/8509 a fix will be available shortly, if this is causing issues then please revert to v1.9.3**\r\n\r\n**Features:**\r\n• #8448 Transaction dialog takes 5s to open; not data-bound\r\n• #5697 Allow transactions to be filtered based on attachments\r\n\r\n**Bugfixes:**\r\n• #8506 Creating a new database fails with 'SQL logic error[1]：near \"Oman\": syntax error' when UI language is French\r\n• #8497 MMEX V1.9.3 crashes when creating an HTML model for a new report.\r\n• #8485 Investment ->New Filter ===> Crash\r\n• #8475 Assets Value\r\n• #8471 Creating a new database fails with \"SQL logic error：near \"Africa\": syntax error\" when UI languageis Italian\r\n• #8467 Can't move a column\r\n• #8455 All dates are not all dates\r\n• #8428 CSV Import：\"Color\" checkbox does not enable the color selector"
