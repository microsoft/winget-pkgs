ShortDescription: Free, open-source download manager for Windows — segmented downloads, resume, browser capture, video and torrents.
Description: >-
  Matt Download Manager is a free, open-source (GPL-3.0) download manager for Windows 10 and 11.
  It downloads files over several connections, resumes interrupted transfers, captures downloads
  from Chrome, Edge, Brave, Opera, Vivaldi and Firefox, downloads video pages (yt-dlp is kept
  current automatically), handles torrents and magnet links, and adds a scheduler, queues,
  categories, speed limits and 86 interface languages. The installer is per-user (no administrator
  rights), a portable ZIP is available, and the program updates itself from idm.teachermatt.com.
  No ads, no trackers, no account and no licence key.
