ShortDescription: 高性能 · 本地优先 · 全平台剪贴板管理器。
Description: Clipboard Desktop 是一款高性能、跨平台、本地优先的剪贴板管理工具。它在后台静默运行，持续记录剪贴板历史；通过全局热键（默认 Alt+V）一键唤起，支持全文搜索（含中文分词）、图片 OCR 文字识别、收藏、编辑、快速粘贴等操作。支持文本、链接、图片、文件四种内容类型，智能内容识别与富文本带格式粘贴，Tantivy 全文检索引擎与 N-gram 中文分词，PP-OCR 本地离线文字识别。所有数据存储在本地，不包含任何遥测或上传行为，OCR 完全离线运行，无需联网。
Tags:
- 剪贴板
ReleaseNotes: |-
  重要通知：同步系统属内侧功能，不保证跨版本可用性，建议仅尝鲜
  Clipboard Desktop v1.4.0
  剪贴板桌面管理工具，Windows 原生剪贴板监控、全文搜索、OCR 识别、多引擎支持
  Released: 2026-08-15

  版本说明
  v1.4.0 的核心是一套完整的跨设备同步系统：新增 S3 兼容对象存储与 WebDAV 两种同步后端，支持端到端加密（同步密码保护 baseline / oplog 载荷与资源对象）、真正的 AWS SigV4 签名、增量快照 / 段传输与按需物化远程资源；后台自动同步 worker 原子应用远端变更，并在应用后刷新本地历史。同步层经过大量安全加固（拒绝不安全备份文件名、保护资源路径与完整性、持久化稳定设备标识、从检查点恢复丢失历史）。此外新增自然语言日期搜索过滤（今天 / 昨天 / 本周 / 本月）、CSV 导入、可配置的敏感内容过滤（正则 + 采集面板 UI）、最近使用默认排序；设置系统重构为通用 SettingEntry 组件，并补全 Linux 平台的剪贴板文件路径 / HTML / RTF 采集。发布流程改为纯本地，构建仅由 GitHub Actions 在打 tag 后执行。
