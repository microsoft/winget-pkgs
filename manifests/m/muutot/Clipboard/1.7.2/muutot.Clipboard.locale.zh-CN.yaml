ShortDescription: 高性能 · 本地优先 · 全平台剪贴板管理器。
Description: Clipboard Desktop 是一款高性能、跨平台、本地优先的剪贴板管理工具。它在后台静默运行，持续记录剪贴板历史；通过全局热键（默认 Alt+V）一键唤起，支持全文搜索（含中文分词）、图片 OCR 文字识别、收藏、编辑、快速粘贴等操作。支持文本、链接、图片、文件四种内容类型，智能内容识别与富文本带格式粘贴，Tantivy 全文检索引擎与 N-gram 中文分词，PP-OCR 本地离线文字识别。所有数据存储在本地，不包含任何遥测或上传行为，OCR 完全离线运行，无需联网。
Tags:
- 剪贴板
ReleaseNotes: |-
  Clipboard Desktop v1.7.2
  同步与安全加固、Linux AppImage 修复、存储与搜索可靠性提升
  Released: 2026-09-29

  新功能
  同步
  - 瞬时 S3 失败自动重试 — 按有界退避策略重试瞬时 S3 故障，减少偶发网络抖动导致的中断 | 1f0ed00
  存储管理
  - 资源目录所有权标记常显开关 — 所有权标记从隐藏文件升级为设置中始终可见的开关 | f3a2fe5
  - 从设置认领所有权标记 — 用户可在设置界面直接认领资源根目录的所有权标记 | c4f123c
  诊断
  - 分级日志诊断 — 新增带级别阈值的诊断日志，可在设置中控制输出阈值 | aa141d3
  详情面板
  - 主题化编辑器右键菜单 — 编辑时隐藏预览操作按钮，提供与应用主题一致的右键菜单 | 442c739

  安全加固
  - 密钥零化 — 派生的同步密钥与 DPAPI 明文使用后立即清零 | 1e2265a
  - 本地 API 回环 ACL — Windows 回环令牌应用仅所有者可访问的 ACL | af113f7
  - 拒绝非回环明文 http S3 端点 — 防止同步数据经明文通道外泄 | 70ef184
  - OCR 模型下载校验 — 上游模型下载钉扎并验证 SHA-256 | 772458d
  - 空静态资源作用域 — 阻止暴露安装目录内机密文件 | c175ed8
  - 不可信图片解码限额 — 防解压炸弹攻击 | a765989
  - CF_HDROP 缓冲区按查询分配 — 防止剪贴板文件列表溢出 panic | 2900a7c
  - 超大文件入库前拒绝并清理暂存 — 暂存失败同样清理 | 44bfe4d

  同步可靠性
  - 打包块大小边界收紧 — 写入侧同样限制打包块存储大小，要求打包块匹配磁盘剩余字节 | e99eb81 ecd29fe
  - S3 响应体内存上限 — 内存中的 S3 对象读取与响应体均硬性限制在协议上限内，超限时报告组件而非 panic | 8af6330 0df511f 55db26c
  - 拉取跳过游离段键 — 遇到陌生段键时跳过而非中止整个拉取 | e8e2bdb
  - 单个超大记录放行 — 每个打包块允许一条超大记录，大条目可正常发布 | 5dd2362
  - 打包批惰性折叠 — 应用期内存驻留恒定为一个块，解码先于事务打开 | 0d0d78d df6c9e1

  修复
  发布构建
  - 修复 Tauri Rust crate 与 npm 包 minor 版本漂移导致全部平台构建失败 — 发布流程升级 Cargo.lock 后 npm 侧 @tauri-apps/api、@tauri-apps/plugin-dialog 未同步，tauri CLI 一致性检查拒绝构建；本次对齐两侧版本，并让发布脚本在打 tag 前校验一致性，漂移即失败并给出修复命令 | 5e24d92 e753eb6
  - 修复 AppImage 在 root 挂载沙箱下 Permission denied — tauri-bundler 以 770 权限保存 AppRun 启动器，firejail 与 AppImage 官方目录测试以其他用户运行时启动即失败（tauri-apps/tauri#16155）。发布工作流现预置 755 权限、SHA-256 钉扎的启动器，并新增构建后权限门禁，任一文件权限受限即失败 | a27dbc7
  CI
  - 删除 rust-cache 不存在的 env-cache-key 输入 — 默认 env-vars 前缀已覆盖 RUSTFLAGS 与 CARGO_PROFILE_*，缓存键行为不变；checkout/setup-node 升级到原生 node24 版本；前端 node_modules 缓存改用 setup-node 内置 npm 缓存 | bb6c8e5
  - 两段式发布流程可通过脏树门禁 — 发布文件集合白名单化，Pass 1 的预期产物不再触发拒绝 | 820a339
  - 全部平台构建成功后才发布 GitHub Release — 三平台独立构建臂改为草稿发布，由 publish 任务统一转正 | 30766c4
  - 脏工作区拒绝发布 | 98a3dd2
  - CI 覆盖所有分支与 PR，同步工作流钉扎 actions 与 Python 依赖 | 811a681 61581a2
