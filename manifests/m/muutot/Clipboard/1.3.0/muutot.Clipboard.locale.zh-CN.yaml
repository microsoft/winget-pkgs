ShortDescription: 高性能 · 本地优先 · 全平台剪贴板管理器。
Description: Clipboard Desktop 是一款高性能、跨平台、本地优先的剪贴板管理工具。它在后台静默运行，持续记录剪贴板历史；通过全局热键（默认 Alt+V）一键唤起，支持全文搜索（含中文分词）、图片 OCR 文字识别、收藏、编辑、快速粘贴等操作。支持文本、链接、图片、文件四种内容类型，智能内容识别与富文本带格式粘贴，Tantivy 全文检索引擎与 N-gram 中文分词，PP-OCR 本地离线文字识别。所有数据存储在本地，不包含任何遥测或上传行为，OCR 完全离线运行，无需联网。
Tags:
- 剪贴板
ReleaseNotes: |-
  剪贴板桌面管理工具，Windows 原生剪贴板监控、全文搜索、OCR 识别、多引擎支持
  Released: 2026-08-06

  版本说明
  v1.3.0 聚焦「标签管理」与「图标自定义」：新增完整标签系统（标签注册表、管理面板、彩色标签、卡片 / 详情内联编辑、Ctrl+T 快速加标签、主窗口联动）；图标支持彩色模式与逐图标自定义颜色；剪贴板新增 RTF 富文本采集与粘贴、双击粘贴、悬停粘贴子菜单、卡片 #N 序号角标；更新源可切换 GitHub / GitCode，并支持导入 PPaste 备份。同时优化历史分组与筛选的后端分页、标签索引与来源图标查询性能，并修复导入、DIB 解码、自触发守卫、软删除复活等一系列健壮性问题。
