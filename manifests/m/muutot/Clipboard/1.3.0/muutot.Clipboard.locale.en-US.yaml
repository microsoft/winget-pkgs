ShortDescription: A high-performance, local-first, cross-platform clipboard manager.
Description: Clipboard Desktop is a high-performance, cross-platform, local-first clipboard manager. It quietly runs in the background and keeps recording your clipboard history; a global hotkey (Alt+V by default) summons the launcher with full-text search (including Chinese word segmentation), image OCR text recognition, favorites, editing, and quick paste. It handles four content types — text, links, images, and files — with smart content recognition, rich-text formatted paste, a Tantivy full-text search engine with N-gram Chinese tokenization, and local PP-OCR text recognition. All data stays on your machine with no telemetry or uploads, and OCR runs fully offline without network access.
