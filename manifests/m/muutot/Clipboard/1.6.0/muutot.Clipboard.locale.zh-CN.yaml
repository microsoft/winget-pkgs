  - 热键管线 — 全局/窗口分发统一到动作注册表，消息循环就绪握手后再 stop-join，stop 等待与超时收敛 | 71d2e58 09f0343 4043fb2 440c8ca 9bc8067 0e94c0a 79f2fb6
