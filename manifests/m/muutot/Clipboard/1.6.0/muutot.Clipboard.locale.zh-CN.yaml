  - 采集与缩略图 — 监控线程 panic 落盘日志并丢弃已死的隐私事件，静默死亡后允许重启，缩略图队列先排序再启动并始终停止 worker，spawn 错误返回而非 panic | 0c35125 d9dfd60 615ac4e 6c6c84f b306d9f
  - 关闭流程 — 毒化锁可恢复以保证每个 worker 停止，自动同步 stop 等待收敛，锁状态消息不再重复 poison 后缀 | 7e960c9 0879b52 756c835 9a7ab77
  - 存储 — 容量与截断告警仅统计可驱逐行，VACUUM INTO 路径不再翻倍反斜杠，数据目录迁移可重试，读写改用 immediate 事务，tagged 插入保持 item_tags 对齐，编辑文本清陈旧富内容，手动清理沿用孤儿文件宽限期 | b49b66a 7a988d0 956afbc 616e636 361559b c36af68 c9454c6 149857e f5c9dd5
  - 搜索与列表 — 日期区间按日历算术处理 DST，本地日期边界失效缓存，列表偏移与单页上限解耦，虚拟高度复用前校验签名，分页到 trim 上限即停 | e6f4829 ad05ff8 68b9b54 5e44f1e 4551daa
  - OCR — 详情页到达终态即停轮询，轮询按派生 id 与类型守卫，状态加载脱钩止 IPC 循环，模型选择同步配置变体，安装检查校验摘要，OAR_HOME 串行化，tesseract 识别加超时，worker 重启前先放配置锁 | d45078b deb3d2d 60e6a17 254ebc1 d9513d3 9f53890 d0c1828 4b80254 8c000b0
  - 同步 — 资源字节上下限收敛到可用窗口，空文件路径回退 resource_path，历史 GC 跳过非 segment 键 | 87f99d6 a476324 de0cdbf
  - 前端状态 — 条目更新扇出到详情视图与搜索缓存，删除/批量走 four-copy 漏斗，批量流保持搜索缓存与详情，方向键不出可编辑区，空选落首行，详情 tab/文件重置按条目 id，DatePicker 月份与星期头对齐 | 059b0b3 8b1e37b 8c9355f ec3ff19 2259476 156b9e0 44ae534 b89830a 3e957ca
