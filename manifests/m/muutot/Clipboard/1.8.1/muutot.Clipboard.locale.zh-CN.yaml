ShortDescription: 高性能 · 本地优先 · 全平台剪贴板管理器。
Description: Clipboard Desktop 是一款高性能、跨平台、本地优先的剪贴板管理工具。它在后台静默运行，持续记录剪贴板历史；通过全局热键（默认 Alt+V）一键唤起，支持全文搜索（含中文分词）、图片 OCR 文字识别、收藏、编辑、快速粘贴等操作。支持文本、链接、图片、文件四种内容类型，智能内容识别与富文本带格式粘贴，Tantivy 全文检索引擎与 N-gram 中文分词，PP-OCR 本地离线文字识别。所有数据存储在本地，不包含任何遥测或上传行为，OCR 完全离线运行，无需联网。
Tags:
- 剪贴板
ReleaseNotes: |-
  Clipboard Desktop v1.8.1
  同步命名空间轮换（加密换钥/前缀迁移）、远端资源垃圾回收、批量多选一次粘贴、首次运行引导，以及一轮全量代码审计后的批量正确性加固
  Released: 2026-10-27

  新功能
  同步
  - 命名空间轮换 — 一键把同步前缀与密钥轮换到新命名空间：物化全部资源、引导发布完整本地状态、写入轮换指针、再删除旧命名空间；崩溃与取消在任意步骤都安全 | 6a46e5fa 3aa481a2 6185f075
  - 轮换拒绝与恢复 — 已轮换前缀在任何命名空间解析之前即拒绝同步运行，防止陈旧设备分叉；本地配置提交失败时原地重试并在错误中给出手工恢复指引 | 23d1cc3a ca9a805c
  - 远端资源垃圾回收 — 可选开启的远端资源清理，宽限窗口锚定到存储端时钟，删除判定不受本机时钟偏移影响 | 5790fe01 e8dd80c7 1f598478
  - S3 凭据加固 — 内存中的 S3 凭据零化处理，端点校验、scope 变更与密钥库重试一并加固 | 5ee64e8f 81712059
  界面与操作
  - 批量栏重构与一次粘贴 — 多选卡片显示粘贴顺序编号，批量栏显示条目总数，多选内容按顺序一次性粘贴到目标应用 | 51d9834a 6750e068 eb20c669
  - 首次运行引导 — 新用户引导页覆盖核心操作，并支持从设置回放 | fb0e1893
  - 本地 API 随启动自启 — 本地 HTTP API 随应用启动并发布端口，无需手动开启 | fa0ca08d
  - 右键菜单组件化 — 通用 AppContextMenu 组件统一各处上下文菜单 | 16fcf885
  安装与打包
  - 安装包元数据 — 补全发布者、版权与主页信息；AppImage 打包前校验 appimagetool | eeae9b1d 8fdbc555

