  - 语言手动切换 — 详情面板内按条目手动切换代码语言并持久化记忆；换行行号与行框对齐修复 | 71bcb8d0 aae5c41d 5d027ea7 74d9952e b0b199bd
  查找与快捷键
  - 详情内查找 — Ctrl+F 在详情面板内查找定位；收藏快捷键默认改绑 Ctrl+G，老用户已有绑定自动保留 | fb19e23b 2e344323 621ab2a2 f6d0fdfc
