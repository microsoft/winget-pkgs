ReleaseNotes: |-
  v0.12.0 更新内容
  ✨ 新功能
  设置窗口
  - 设置搜索：侧栏顶部新增搜索框，可以搜所有页面的设置项。跳转时会自动展开所在的折叠分组，并高亮目标设置项。(感谢 @Tokisaki-Galaxy，#1207；#1232)
  - 检查更新时直接下载安装包：按 GitHub、国内镜像的顺序依次尝试，下载完成后会校验文件。(感谢 @Tokisaki-Galaxy，#1211)
  - 万象语法模型支持在线更新：有新版本时，下载按钮会变成「更新」。(感谢 @jsfaint，#1146，修复 #1145)
  - 切换全拼和双拼后立即生效，不用再重启输入法。(感谢 @Tokisaki-Galaxy，#1184)
  AI 与翻译
  - 「AI 与云联想」页重新设计：明确区分联想方式和服务商，翻译功能复用 AI 配置时，和 AI 页读的是同一份设置。(感谢 @Tokisaki-Galaxy，#1156, #1159)
  - 新增 Ollama 服务商，不需要填 API Token。(感谢 @houko，#1136)
  - 本地模型可以用了：response_format 改为可选的策略，LM Studio、vLLM、Ollama 等本地服务不会再因为强制要求 JSON 格式而拒绝请求。(感谢 @Tokisaki-Galaxy，#1241)
  - AI 请求失败时会显示具体原因，比如 HTTP 状态码和服务端返回的错误信息、超时、返回格式不对，不再一律显示成「未返回译文」。(感谢 @Tokisaki-Galaxy，#1233)
  - 候选翻译新增「阿里云机器翻译」。(感谢 @yayoinoyume，#1147，相关 #780)
  - Jev 可以在 Token 为空时请求不需要 Key 的接口。(感谢 @Carnivorec，#1166)
  皮肤
  - 悬浮工具栏图片模式：整个工具栏可以用一张背景图，按钮摆在图上；透明的地方可以点穿。装饰图上也可以叠加显示一个候选词。(感谢 @Arisaema-erubescens，#1046)
  - 图片模式下，按钮可以自带底图并自动排列：关掉某个按钮后，它的底图一起隐藏，后面的按钮会补上空位。(#1152)
  - 不以 canvas 为基底的 v2 皮肤不再被误报为「无效皮肤」，只会提示哪些字段没有生效。(感谢 @houko，#1131)
  输入
  - 双拼下「Shift+Enter 上屏转换后的全拼」可以在设置中关闭，避免打大写字母时手还按着 Shift 就按了回车。(感谢 @imluyg，#1196，修复 #1102)
  - 语音识别完成时如果没有可以输入的地方，会弹出一张卡片保留识别结果，可以一键复制全文。(感谢 @chr331，#1120)
  - 快捷键页补上了「Ctrl+数字上屏译文」的说明。(感谢 @Ten-Shine，#1249)
  🐛 问题修复
  丢字和卡顿
  - 修复机械硬盘上的丢字和卡顿：选词后写词库不再每次都等磁盘写完，WAL checkpoint 推迟到停止打字之后执行。(感谢 @Tokisaki-Galaxy，#1221，相关 #1012)
  - 后台的输入法实例不会再抢走前台输入框的候选。(感谢 @yanmuq，#1168)
  - 部分应用里候选窗被误判为没有位置而不显示的问题已修复。(感谢 @ouchihao，#1113，相关 #618)
  输入准确性
  - 全拼长句里有多处手误时也能纠正。纠错开关拆得更细。(感谢 @jsfaint，#1169)
  - 整句联想不再用多音字的生僻读音造句，比如 tai'zhuan'qian'le 不再首选「大赚钱了」。(#1123)
  - 只输入一个 n 时，首选是「你」而不是「嗯」；置顶过的前缀候选不会被重新挤掉。(感谢 @cxk1993，#1144；@ouchihao，#1112，相关 #1107)
  - 繁体模式下，U 模式拆字反查的候选不做简转繁，比如「干」不会变成「幹」。(感谢 @enshulv，#1227，相关 #908)
  - 词库导入和搜索时保留用户用空格分开的音节，比如 gong an 不再被拒绝导入。(感谢 @ouchihao，#1224，修复 #1117)
  - 符号读音改为从 msime-dictionary 的符号名称表读取。(感谢 @houko，#1247)
  设置窗口和其他
  - 关闭对话框时（比如删除快捷短语）不会再崩溃。(感谢 @ouchihao，#1179；@Tokisaki-Galaxy，#1199, #1205，相关 #1114)
  - 「重启输入法」按钮不会再卡在「重启中」。(感谢 @jsfaint，#1231；@Tokisaki-Galaxy，#1184)
  - 下拉列表的滚动条可以拖动，也可以点轨道翻页。(感谢 @enshulv，#1209, #1210)
  - 「游戏兼容」改名后，系统设置和语言栏里显示的名称也会跟着变。(感谢 @Tokisaki-Galaxy，#1218)
  - 语音锁定之后，长按快捷键偶尔失灵的问题已修复。(感谢 @chr331，#1081，修复 #1037)
  - 用 Inno Setup 7 打包时，覆盖安装不会再要求关闭一长串程序。(#1154)
  🔧 开发与构建
  - 新增 Nightly 通道：每周一、三、六从 develop 自动构建，使用固定的自签名证书，只需要导入一次信任。(感谢 @Tokisaki-Galaxy，#1153, #1252, #1253)
  - 新增 Dev build workflow：贡献者不用装 vcpkg、Boost、Inno Setup 就能拿到可以安装的测试包。(感谢 @Tokisaki-Galaxy，#1103)
  - 新增开发容器配置和更详细的贡献说明。(感谢 @Tokisaki-Galaxy，#1238)
  - 全拼纠错表改为编译期常量，启动时不再临时构造。(感谢 @jsfaint，#1189)
  - 按键延迟改用高精度时钟计时。(感谢 @luojiyin1987，#1089, #1091，修复 #1088、#1090)
  - README 精简，详细内容移到 docs/。(#1226)
  - 新增布朗熊演示皮肤（只放在仓库里，不进安装包）。
  📦 安装包减半
  - 安装包从约 128 MB 降到约 61 MB。词库改为在安装时由文本源数据生成，不再把 SQLite 二进制文件打进安装包；生成失败时会中止安装，并把详细信息写到 logs\dictionary-build.log。(#1254)
  - Trigram 整句用的语言模型 sc.lm（约 24 MB）改为在设置页按需下载，下载后立即生效，不需要重启。(#1254)
  - 升级时，旧版附带的 sc.lm 会自动挪到新的模型目录，不需要重新下载；开过 Trigram 整句的老用户，升级后这个开关会保持开启。新安装默认关闭 Trigram 整句。(#1254)
  📚 词库：接入万象拼音完整词库
  - 全拼词库改用万象拼音的完整词库，词条量和词频都大幅更新。除了基础词库，还包括诗词、地名、名人、医学、药品、化学、物种、艺人、多音字、错音等 15 个分类词库。(词库仓库 msime-dictionary#97，#1254)
  ⚠️ 升级须知
  - Trigram 整句和效果优先神经整句的模型都需要在设置页下载。升级用户原来的模型会自动保留；新安装需要手动下载。
  🙏 感谢
