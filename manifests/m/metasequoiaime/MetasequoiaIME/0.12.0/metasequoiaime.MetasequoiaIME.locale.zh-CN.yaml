    - @Tokisaki-Galaxy：设置搜索、检查更新直接下载、AI 页重做、本地模型兼容、失败原因提示、机械硬盘丢字修复、Nightly 和 Dev build 通道等
    - @jsfaint：万象模型在线更新、全拼长句纠错、纠错表编译期化、重启按钮修复
    - @ouchihao：候选窗定位、前缀候选排序、对话框崩溃、词库音节分隔
    - @houko：Ollama 服务商、v2 皮肤提示、符号读音
    - @enshulv：下拉列表滚动条、U 模式繁体
    - @chr331：语音结果复制卡片、语音快捷键修复
    - @Arisaema-erubescens：工具栏图片模式
    - @yanmuq：后台实例抢焦点修复
    - @imluyg：Shift+Enter 开关
    - @yayoinoyume：阿里云机器翻译
    - @cxk1993：单字母首选修复
    - @Carnivorec：Jev 免 Key 接口
    - @luojiyin1987：高精度计时
    - @Ten-Shine：快捷键提示
  - 问题反馈：#618、#780、#908、#1012、#1037、#1088、#1090、#1102、#1107、#1114、#1117、#1145 的各位报告者
