ReleaseNotes: |-
  水杉输入法 v0.9.5
  更新日志
  ✨ 新功能
  V 模式：数字转中文和计算（默认开启）
  - 输入 V 加数字，候选里会出现中文读法、大写数字、金额和千分位写法。例如 V123 给出「一百二十三 / 壹佰贰拾叁 / 壹佰贰拾叁元整 / 一二三」，V123.45 给出「壹佰贰拾叁元肆角伍分」。(#629)
  - 也可以直接算式子：支持 + - * / 和括号，例如 V1+2*3 给出 7 和 1+2*3=7。(#629)
  - 双拼下用大写 V 触发，全拼下大小写 v 都可以。只有 V 后面紧跟数字或 ( 才会进入 V 模式，输入 vip 等不受影响。(#629)
  T 模式可以输入指定的日期和时间
  - 按 Shift+T 后，除了 rq / sj / xq，还可以直接输入数字。可以输入日期（20241225、2024/12/25、12/25）、年月（2024/12）、时间（9:05、14:30:00），或者日期加时间，候选会给出对应的各种格式。之前学到的格式顺序、置顶和固定位置都继续有效。(#626，对应 #531)
  全拼纠错更聪明（感谢 @jsfaint 打下基础，#592）
  - 两种读法同样常见时，按整句是否通顺来决定排序。例如 banzheng 在「我在……的地方等着」这样的上下文里，会优先给出「办证」。(#592)
  - 原来纠不出来的手误现在也能纠了：按到离得较远的键，或者多插了一个字母。(#592)
  - 拼写本身合法、但其实打错了的输入也能纠正：
    - 换位：ziazheliya → 在这里呀，jioa → 叫
    - 多打一个字母：jiuzheeyang → 就这样
    - 漏打一个字母
    (#622, #623)
  - 修复纠错候选选词后剩下字母或者多吞字母的问题。例如 buuhui 选「不会」后会剩下一个 i，现在一次就能上屏。(#623)
  - 只有真正被采用的纠错候选才会带 * 标记；这个标记也可以在设置页「输入」里关闭。(#623, #631)
  - 拼写本身就是一个完整的词时，这个词保持在第一位。例如 yongan 不再把「勇敢」排在「永安」前面。(#622)
  双拼辅助码
  - 直接辅助码（默认关闭）：不需要引导键，音节后面直接输入辅码。三码（双拼加第一位辅码，比如 uia）会自动识别；四码单独输入时直接定字，在句子中间要在后面补 /（比如 uiab/），也可以把第二位辅码改成大写来结束（比如 uiaB）。(#619, #630)
  - 句中辅助码新增「大写字母」触发方式：在完整音节后输入大写字母，相当于输入反引号再加这个字母。例如 ulpbXihfa 等于 ulpb`xihfa。(#620)
  - 直接辅助码和句中辅助码不能同时开启：设置页打开其中一个，另一个会自动关闭。(#621)
  - 带辅助码的输入串，用 Ctrl+←/→ 和 Ctrl+Backspace 时按「音节」和「辅码段」整段移动或删除，不再一个字母一个字母地处理。(#627)
  其他
  - 托盘语言栏右键菜单新增「输入方案」子菜单，可以在全拼、双拼和五笔之间快速切换。(#625)
  ⚡ 性能
  - D2D 候选窗绘制更快：卡片阴影只计算一次，然后拉伸到需要的尺寸；候选文字的排版在多帧之间复用。打字时每帧的 CPU 耗时，p90 从 1.3 ms 降到 0.55 ms，p99 从 2.1 ms 降到 0.9 ms。偶尔出现的 2～5 ms 画面提交阻塞也基本消失了。(#628)
  - 按键路径更轻：没开混排时不再每次按键都复制整份候选列表；全拼前缀不再计算肯定会被丢弃的 Google 整句；神经网络重排完成后，最多只排一次重新查询。(#628)
  - 神经网络打分的词表投影改用 AVX2，键盘模型单次打分从 49.7 ms 降到 44.7 ms，桌面模型从 294.5 ms 降到 274.8 ms。(感谢 @luojiyin1987，#617)
  🐛 问题修复
  - 输入统计中，零散输入的那天不再算出离谱的速度（比如实测出现过 2503 字/分）。(感谢 @jsfaint，#614，修复 #613)
  - 有更新的神经网络重排请求时，后台不会再把它丢掉。(#592)
  🙏 感谢
  - 贡献者：
    - @jsfaint：全拼纠错的上下文消解和生成式纠错、输入速度统计修复
    - @luojiyin1987：神经网络词表投影的 AVX2 加速
  - 问题反馈：@Neptrue-Lin (#531)、@jsfaint (#613)
