ReleaseNotes: |-
  v0.11.0 更新内容
  🎨 界面全面改为 Direct2D
  - 去掉了 WebView2。候选窗、悬浮工具栏、托盘菜单和设置窗口现在全部用 Direct2D 原生绘制，不再需要安装 WebView2 Runtime。设置窗口重写成了原生界面，打开更快，滚动更顺滑。(#999, #1001, #1002, #1013)
  - 设置窗口：
    - 滚轮滚动更平滑，滚动的行数跟随系统设置。
    - 打开时先显示启动动画，等配置加载完再淡入，不会再先显示全拼又跳到双拼。启动动画可以在「关于」页关闭。
    (#1045)
  - 「输入」页移到「外观」页前面，打开设置时默认显示「输入」页。(#1028)
  - 设置窗口会跟随系统的深色或浅色主题切换。(感谢 @Komeiji-Shiki，#1023，相关 #936)
  - 统计页新增「首词命中率」，即首选候选被直接选用的比例。(感谢 @jsfaint，#963)
  🖼️ 皮肤
  - 皮肤 schema v2：支持九宫格贴图面板，以及可以伸出面板的装饰图片。(感谢 @Tokisaki-Galaxy，#903，修复 #750)
  - 新增全贴图基底 canvas。候选窗支持九宫格、分层挂件和 APNG / GIF 动图；设置页预览中动图也会播放。(#1014, #1028)
  - 亚克力与云母材质：候选卡片下面可以垫一层系统的毛玻璃效果。(#1033)
  - 内置皮肤改为由皮肤清单定义，设置页的预览和真实候选窗用同一套绘制代码，显示效果完全一致。(#1061)
  - 新增内置皮肤「微信绿（卷轴）」：横排候选右端有展开按钮，展开后可以上下滚动浏览更多候选。(#1061)
  - 安装包新增附带的皮肤：
    - 「绿叶」（贴图皮肤，带浅色面板）
    - 「云母 Mica」
    - 「亚克力 Acrylic」
    - 「夜樱」（展示 v2 皮肤全部能力的示例）
    - 「首道-蓝」（感谢 @jsfaint）
    (#918, #1018, #1055, #1076, #1077)
  - 社区皮肤使用 system、shuishan、light、paper、night、ink 作为基底时，不用再手动修改就能加载。(感谢 @houko，#1003)
  - 外部皮肤只在自己声明支持的布局和主题下生效。(感谢 @Tokisaki-Galaxy，#946)
  - 悬浮工具栏的拖动条颜色统一跟随皮肤的强调色。(#1055)
  - 「微软」皮肤的候选尺寸、选中条和翻页箭头收紧，和其他皮肤更协调。(#934)
  - 皮肤用到的图片不会再一直被输入法占用，制作皮肤时改完图片可以直接保存覆盖。(#1017)
  ✨ 新功能
  输入
  - S 模式符号输入：按 Shift+S 后可以输入希腊字母、数学符号、带圈数字、罗马数字、箭头、单位、货币等。可以按万象的分组码查找（比如 xl 是希腊字母，sx 是数学符号），也可以按 typst 的符号名查找（比如 alpha、infinity）。(#1047，相关 #795)
  - 符号混输（默认关闭）：输入的编码完全匹配时，符号会混进候选。比如 shuminghao 出《》，xi 出 ξ。(#1047, #1050)
  - U 模式改为部件拆字反查：输入一个字各组成部分的拼音（比如 ririri 出「晶」），候选旁边会显示带声调的读音。原来的 Unicode 码位输入已经移除。(感谢 @jsfaint，#973，修复 #971)
  - 五笔也支持 T 模式（日期时间）和 V 模式（数字转中文、计算）。(感谢 @jsfaint，#942)
  - 可以自定义哪些键输出顿号：在 \ 和 / 中任选，至少保留一个。新安装两个都开启；升级用户保持原来的行为，只有 \ 输出顿号。(#1071)
  - 双拼末尾辅助码新增「间接」触发方式：可以用反引号、分号或大写字母作为引导键，后面跟一到两位辅码。句中辅助码在设置页单独成为一个区域。(#1068)
  - 英文候选模式、全半角切换、中英文标点切换的快捷键都可以自定义，也可以清空，避免和 Rider、VS Code 等软件的快捷键冲突。(感谢 @chr331，#985)
  - 中文模式下的英文补全可以出现不同的词形（比如 worked、working），首页的英文候选数量可以设为 1～3 个。(感谢 @lsy9966303 #980，#1010)
  - 外观设置新增「横向候选强制单行」：打开后，横排候选只有超出屏幕宽度才换行。(#1056，相关 #805)
  - 可以隐藏任务栏语言栏上的中/英、全半角、标点按钮。这些按钮在「每个应用使用不同输入法」时会和微信等图标互相挤来挤去。(感谢 @Ten-Shine，#943)
  候选翻译
  - 翻译服务商新增「AI 辅助」，直接使用 AI 辅助里已经配好的接口地址、密钥和模型。翻译设置改为只选一个服务商。(感谢 @Tokisaki-Galaxy，#876，修复 #867)
  - 按 Ctrl+1～9 上屏当前页第 1～9 个候选的译文。(感谢 @Ten-Shine，#1036)
  - 新增「显示词性」开关和「只显示单条释义」开关。(感谢 @laiduo12345，#915；#1048)
  AI 与云联想
  - 设置页的「AI 辅助」改名为「AI 与云联想」，云联想开关也移到这一页。(#1062)
  - 新增 Jev（TypeSafe）服务商：从已有的本地候选里挑出推荐项，并标上〔Jev〕。(感谢 @MisakaZentai，#1030)
  - 可以自己添加任意数量的 OpenAI 兼容服务商。DeepSeek 的思考参数改为按接口地址判断是否发送，DeepSeek 的位置填成其他服务的地址时，请求不会再被拒绝。(感谢 @alayahbridge319-boop，#996)
  - 适配 OpenAI 推理模型的请求参数（GPT-5 及之后的模型、o 系列）。(感谢 @luojiyin1987，#968，修复 #882)
  - AI 联想候选的徽标可以从 🤖 换成 🐳。(感谢 @cxk1993，#948)
  语音输入
  - 录音提示条在任何状态下都能关掉：可以点取消按钮、按 Esc 或者右键。没说话导致识别失败时，不再弹出必须手动关闭的对话框。(感谢 @alayahbridge319-boop，#996)
  游戏兼容
  - 修复 CS2、Dota 2、三角洲行动等游戏里的问题：加载不了输入法、看不到候选、独占全屏下打字黑屏、开着输入法启动游戏崩溃。帮助页新增「游戏兼容（CS2 / Dota 2）」开关，打开后由游戏自己绘制候选。(#925)
  - 我的世界基岩版中，候选窗固定显示在左上角，不再先在右下角闪一下；修复 Java 版等游戏里按 Caps Lock 后，工具栏显示的大小写状态不对。(#932, #933)
  📚 词库（msime-dictionary）
  - 和万象共有的单字和词语，词频都按万象对齐。(msime-dictionary#84)
  - 新增万象符号表，以及标点符号的读音。(msime-dictionary#83)
  - 补全了两版五笔的多字词和人工词条。(msime-dictionary#85)
  - 出厂词库不再附带内置的快捷短语，你自己添加的快捷短语不受影响。(#1057)
  - 换了新的出厂词库后，升级时会重新计算用户调频的权重，旧词库的调频结果不会再压住新的词频。(#1049)
  ⚡ 性能
  - Server 常驻内存明显减少：
    - 候选窗、工具栏和托盘菜单共用一个 D3D 设备，约省 20 MB。
    - U 模式的拆字表从 12.6 MB 降到 3.9 MB。
    - 没开语音时不再常驻音频设备。
    (#1078)
  🐛 问题修复
  稳定性
  - 修复服务端短暂卡顿时丢字：等待提交结果的上限从 300 ms 放宽到 1500 ms，等待期间宿主程序仍然能正常重绘，不再丢掉已输入的内容，也不会卡住宿主。(感谢 @jsfaint，#982, #1019，相关 #1012)
  - 修复小鹤双拼输入 zjle 时 Server 崩溃的问题。(#1064，修复 #1063)
  - Server 重启后自动重连时，可以恢复中文输入。(感谢 @Tulipe1735，#912，相关 #911)
  - 开始选词之后，候选的顺序和高亮位置保持不变，不会被云、AI 或神经重排的结果打乱，避免按空格上屏了别的词。(感谢 @Komeiji-Shiki，#1022，修复 #896)
  输入准确性
  - 纯简拼不会再被当成手误纠错，比如 nbn 首选「能不能」。(感谢 @jsfaint，#881)
  - 关掉纠错开关后就真的不纠错了；「多打一个字母」类纠错只保留误按相邻键的情况。(感谢 @jsfaint，#889)
  - 简拼结尾的组合可以纠正误按相邻键，同时不再给出离谱的远键读法。(感谢 @jsfaint，#1009，修复 #1008)
  - 支持 xvan、jvn 等 ü 的完整写法。(感谢 @ouchihao，#994，修复 #803)
  - 〔万象〕整句不再出现同音乱码。(感谢 @jsfaint，#883)
  - 表情和颜文字按完全匹配优先排序，比如 ku 优先给出 😢 和 😭，不再先给 😅。混输时只有整串完全匹配才出 emoji。(感谢 @jsfaint，#989；#1050，修复 #988)
  - 光标移到拼音的第一个音节内部时，候选窗不再消失。(感谢 @jsfaint，#940)
  - 日语：
    - 分段选词不会再吞掉后面的输入。(感谢 @Komeiji-Shiki，#1020，修复 #944)
    - 临时日语 R 模式可以输入长音符「ー」。(感谢 @xiaolingxiaoying，#1000，修复 #786)
    - 日文候选不会再被写进拼音词库。(#907，相关 #869)
  - Caps Lock 开启时按住 Shift 打出的小写字母，会直接交给应用程序。(感谢 @ouchihao，#976，修复 #901)
  界面与安装
  - 翻译失败后，下次输入会重新请求翻译，不会在 8 分钟内一直没有译文。(感谢 @Komeiji-Shiki，#1021，修复 #854)
  - 悬浮工具栏和托盘菜单的阴影边缘不再残留旧画面。(#1073)
  - 候选最后一页已满、但没有更多候选时，「下一页」箭头会变灰。(#1070，修复 #1069)
  - 升级时保留 custom_translations.txt。(感谢 @Ten-Shine，#1035)
  - 升级不再关闭老用户的候选词翻译。(#884)
  - 安装时云候选的选择会保存到最终的数据目录。(感谢 @luojiyin1987，#972)
  🔧 开发与构建
  - 发布流程接入 SignPath 测试签名。(感谢 @houko，#920–#924)
  - 新增按键路径上模型路径解析耗时的基准测试。(感谢 @luojiyin1987，#846)
  - 更新 OpenCC 和 GitHub Actions 依赖。(#1015, #1016)
  ⚠️ 升级须知
  - 不再需要 WebView2。之前选择 WebView2 候选窗或 WebView2 设置窗口的用户，升级后会自动改用 Direct2D，相关配置项已经删除。
  - U 模式不再支持 Unicode 码位输入，改为部件拆字反查。
  - TSF DLL 的安装位置改为 System32\IME\MetasequoiaIME\，这是 CS2 等游戏加载输入法的要求。升级时会清理 Program Files 下的旧版本目录。
  - skins\default 每次安装都会被整份覆盖。如果你手动改过内置皮肤的清单，升级后会被恢复成出厂版本。
  - 出厂词库不再附带内置快捷短语，你自己添加的快捷短语会保留。
