    - @Tokisaki-Galaxy：用户数据同步的传输层、自动更新修复、模糊音调频
    - @imluyg：数字键 0、右键菜单避让屏幕边缘、微软双拼 lt/nt
    - @enshulv：繁体记住写法
    - @Arisaema-erubescens：皮肤按排布覆盖与 round/space 平铺
    - @Yu-DaTouX：亚克力和云母皮肤下文字跳动
    - @Neptrue-Lin：混输默认值、清理配置
  - 问题反馈：@ZhangEnlin (#1373)、@Leroy-X (#1099)、@LeoBlackMT (#1170、#1172)、@Mambo-Senpai (#1351)、@awyc (#908)，以及通过反馈表提交 #1399、#1414、#1466 的用户
