ReleaseNotes: |-
  v0.14.0 更新内容
  ✨ 新功能
  数据与同步
  - 用户数据同步（WebDAV / S3）：在设置的「同步」页填好坚果云这类 WebDAV，或 S3 兼容存储（MinIO、R2、B2、OSS 等），就能把配置、用户词、字母词、输入统计上传成快照，再在另一台电脑上恢复。恢复是合并，不会冲掉之后的改动，每台设备会保留最近几份快照。目前需要手动上传，自动上传还没做。(感谢 @Tokisaki-Galaxy，#1449、#1489、#1490)
  - 词库页打开就有内容：「词库」和「快捷短语」一打开就列出你自己加过或改过的词条，最近改的排在前面，不用再先搜索。(感谢 @jsfaint，#1437)
  - 快捷短语支持多行文本：正文框可以写多行，Enter 换行，Ctrl+Enter 保存，适合写 Markdown 提示块这类模板。候选里只显示第一行，末尾带一个 ↵。上屏时整段连同换行一起写入，QQ 等 Electron 程序里排版也不会乱。(感谢 @jsfaint，#1410)
  - 快捷短语的搜索框可以切换「前缀匹配」和「精确匹配」。(#1534)
  语音
  - 本地离线语音识别：语音输入新增「本地模型（离线）」，用本机识别，录音不离开电脑，也不需要 Token。有中英流式、中英整句、SenseVoice 快速整句、Fun-ASR-Nano 高精度四种模型可选，在设置页按需下载（134 MB～842 MB）。新装默认用本地模型，老用户仍保持豆包。(#1460)
  - 语音输入没准备好或出错时，改用不抢焦点的提示卡片，「打开设置」会直接跳到语音页。(#1464)
  输入
  - 繁体模式记住你选的写法：选过「台灣」，下次打 taiwan 第一个就是「台灣」；选回默认写法，就恢复按地区排序。(感谢 @enshulv，#1237)
  - 打字时 Home / End 可以跳到预编辑串的开头和结尾。(#1479)
  - 双拼下的 U、S、T 模式按双拼方案解码：U 拆字（小鹤 Ukz → 口）、S 符号（小鹤 Slq → 六）、T 日期时间（小鹤 Tuijm、微软 Tx;qi）都能用双拼打，微软、搜狗、紫光等方案的 ; 也能打进去。(#1467、#1473，修复 #1099，相关 #1399)
  - U 模式显示读音和多音字：有读音的拆字从约 19% 提高到约 47%（CJK 基本区 99.7%），多音字最多显示两个读音，比如「长 zhǎng / cháng」。(感谢 @jsfaint，#1497，修复 #1496)
  - 拼音加加辅助码覆盖完整大字符集：码表从 7968 字扩到 21327 字，覆盖 GBK 和词库里的生僻字。(感谢 @jsfaint，#1483，修复 #1481)
  - DR Dict 词典联动（默认关闭，在「高级」页打开）：候选右键菜单可以「查词典」；Ctrl+Shift+Enter 查高亮的候选，Ctrl+Alt+Enter 查预编辑串，弹窗开在光标处。需要安装 DR Dict。(#1517)
  词库
  - 拼音词库改用 msime-dictionary 整理好的 pinyin-next：在万象全部词表（包括上游删掉的联想词、人名）的基础上，再补上雾凇有、万象没有的词，约 37 万行，权重都记为 1，排在同音的万象词后面。(#1529、#1536)
  外观与设置
  - 可以切换 Win+Space 里显示的输入法图标：内置「水杉」和「水杉 v2」两款，也可以导入自己的 PNG、JPG、ICO 或 SVG。应用时需要 UAC 授权，重启「Windows 资源管理器」后生效。(#1507)
  - 设置新增「高级」页：默认输入法、网络代理、游戏兼容、日志、导出和导入用户数据等，从「帮助」和「关于」页挪到这里。(#1507)
  - 新增「云母-通透」「亚克力-通透」皮肤；悬浮工具栏也会跟随皮肤用上亚克力或云母材质。(#1508、#1486)
  - 候选皮肤可以按横排、竖排分别设置：九宫格贴图、内边距、外留白、挂件、最小宽度等都能分开配，九宫格平铺新增 round 和 space 两种方式。(感谢 @Arisaema-erubescens，#1371、#1458)
  - 设置页「外观」「皮肤」里的候选窗预览，会按当前方案显示对应的预编辑串和候选（全拼、双拼、五笔、日文）。(#1492)
  - 系统的 MessageBox 弹窗都换成了和设置窗口一致的自绘界面。(#1464)
  ⚡ 性能与体验
  - 神经整句模型换成 rerank-v2：速度档和效果档都换了新模型，速度和原来一样，首选更准。已经下载过效果档的用户会在设置页看到「有新版本可用」，点「更新」即可，更新前继续用旧模型。(#1493)
  - 候选不再闪动，异步结果更快上屏：打 photon 时第二位不再闪一下；du 的 °、ue 的 UEFI 这类混输候选不会出现之后又被刷掉；云、AI、重排的结果一到就显示，不再固定晚约 120 ms。(感谢 @jsfaint，#1424、#1422；#1523)
  - 中英混输时，如果整串正好是一个英文词（比如 markdown），就不再给出拼凑出来的整句猜测。(感谢 @jsfaint，#1471)
  🐛 问题修复
  自动更新
  - 修复后台自动更新从来没有运行过的问题；「检查更新」现在会走你设置的代理，下载慢或中断时可以续传，安装前会重新核对摘要和签名。(感谢 @Tokisaki-Galaxy，#1366)
  - 后台下载好的更新改成在「关于」页点「立即安装」，不再在输入框里弹窗打扰你。另外修复了从设置页拉起的安装程序走到「安装」那一步时向导直接消失的问题。(#1455)
  输入
  - 有候选时按数字键 0，不会再清空预编辑串。(感谢 @imluyg，#1495，修复 #1414)
  - 微软双拼的 lt、nt 正确解成「略」「虐」，不再被当成两个简拼。(感谢 @imluyg，#1494，修复 #1351)
  - 模糊音候选选中后能正常调频，不再被猜出来的整句挡住。(感谢 @Tokisaki-Galaxy，#1137，相关 #1172)
  - 双拼整句做首选时，也能补出更长的词（小鹤 hduhugmk → 第二位「海上生明月」）。(#1527，修复 #1526)
  - 语音流式上屏改用 TSF 焦点判断输入目标，在 WebView2 程序里，以及 Chrome、Edge 新窗口第一次使用时，都能实时写入预编辑串。(#1525，修复 #1524)
  界面
  - 候选的右键菜单会避开屏幕边缘，靠近屏幕底部时，子菜单会往上或往左展开。(感谢 @imluyg，#1495，修复 #1373)
  - 候选窗贴着屏幕右边缘时右键候选，横排候选不会再折成两行。(#1520，修复 #1519)
  - 亚克力、云母皮肤下，候选文字不会再每按一个键就上下跳一像素。(感谢 @Yu-DaTouX，#1416)
  - 候选的选中条宽度跟随字号缩放。(#1470，修复 #1469)
  - 托盘菜单的阴影改成和候选框一致的柔和阴影。(#1488，修复 #1487)
  设置窗口
  - 文本框全选后再用输入法打字，会替换选中的文字；光标粗细统一，多行框的首行不再贴着上边。(#1462，修复 #1461)
  - 侧栏搜索框的 × 清空按钮恢复可用。(#1530)
  - 「输入法图标」的图标和单选圆圈对齐。(#1532)
  🔧 开发与构建
  - 本地打包支持只构建、不安装，并且不再改写 msime_setup.iss。(感谢 @jsfaint，#1425)
  - 新增 scripts/format.ps1（锁定版本的 clang-format）和 scripts/test-server-local.ps1（在隔离的数据目录里跑测试）。(感谢 @jsfaint，#1438)
  - 设置页在建页阶段不再向宿主发请求，并加了测试守住这条规则。(感谢 @jsfaint，#1439)
  - 贡献文档补充了拆分 PR 的规则。(感谢 @jsfaint，#1426)
  - 多行上屏的拆分逻辑抽成纯函数，并补上了测试。(感谢 @jsfaint，#1412)
  - 删除没有用到的配置项 study_english_word。(感谢 @Neptrue-Lin，#1432)
  - SQLite 升级到 3.54.1，OpenCC 升级到上游最新版。(#1539、#1361)
  ⚠️ 升级须知
  - 新装默认值有变，老用户升级保持原样：新装默认打开符号、快捷短语、日期时间混入候选，去掉候选第三位的「📅日期」入口，语音默认用本地模型。升级的用户这几项保持原来的设置，想用的话可以在设置里手动打开。(感谢 @Neptrue-Lin，#1430、#1431；#1538)
  - 0.13.2 及更早版本收不到自动更新提示：旧版的后台更新从来没有运行过，请在设置的「关于」页点「检查更新」，或者直接下载安装包。从这一版开始，自动更新才会正常工作。
  - 换了输入法图标后，要重启「Windows 资源管理器」，Win+Space 里才会显示新图标。
  - 词库变大了，安装时生成词库会多花一点时间。
