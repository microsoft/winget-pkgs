ReleaseNotes: |-
  v0.11.1 更新内容
  这是一个小更新，主要修复「关于」页显示的版本号不对。
  🐛 问题修复
  - 「关于」页显示正确的版本号：之前升级后，「关于」页一直显示旧的 v0.0.6，检查更新也拿这个旧版本做比较。现在版本号在构建时写入程序，「关于」页、检查更新和安装包使用同一个版本号。(感谢 @houko，#1084)
  ✨ 新功能
  - 横排候选时，用左右方向键移动高亮（默认关闭）：在「快捷键」页「翻页方式」中打开「左 / 右（横排时移动候选项）」后，效果和搜狗输入法类似：
    - 光标在拼音末尾时，→ 移到下一个候选，← 移到上一个候选；高亮已经在第一个候选时再按 ←，才开始移动拼音光标。
    - 光标在拼音中间时，→ 先把光标移回末尾，再按才开始移动高亮。
    - 竖排候选和 Ctrl+←/→ 的行为不变。
    (#1080，修复 #779、#895)
  🙏 感谢
  - @houko：修复「关于」页版本号
  - 问题反馈：#779、#895 的报告者
