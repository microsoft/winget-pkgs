ShortDescription: 在任何设备的浏览器里，低延迟连接你的 PC
Description: YiLink 是一款基于 WebRTC 的 P2P 串流远程桌面/游戏串流工具，体验对标 Parsec / Moonlight。无需安装客户端，打开链接或扫码即可开始。
