ShortDescription: Tiny tray utility for screen brightness and color temperature.
Description: |-
  Screen Lighting Control (SLC) dims each display below its hardware minimum and warms the screen at night,
  following the sun for your city. It moves the real backlight first (DDC/CI or laptop panel), then gamma, then a
  black overlay. One ~0.7 MB exe with no runtime, no admin rights, no network and no telemetry; a panic hotkey and
  crash recovery make sure you are never left in the dark.
