ReleaseNotes: |-
  v1.7.11
  v1.7.11 adds a macOS terminal command and fixes Assembly syntax highlighting.
  terminal command (macOS)
  - Open Markdown from Ghostty, Codex, or any terminal with marka open notes.md.
  - Use marka open --wait notes.md to wait until the file's tab closes or the app quits. Saving alone does not finish the wait, and closing the tab is not an approval signal for an agent.
  - Install the command from Help or the command palette's install marka command action. The installer creates ~/.local/bin/marka without changing shell settings or replacing unrelated commands.
  - Setup instructions, copyable examples, and PATH troubleshooting are on the website.
  fixed
  - Highlight instructions and comments in asm code blocks in light and dark themes (#201). Thanks @arijit4 for reporting this.
  - Keep an unsaved tab and its waiting terminal clients open when you cancel closing the tab.
  - Report file-open failures to waiting clients and complete waits reliably when the app quits.
  macOS app name
  - New macOS bundles are named marka.app for a cleaner Finder and Open With name. The product remains marka.md, with the same bundle ID and saved data.
  - In-app updates preserve the existing application folder name. If Finder still shows marka.md.app, quit normally, rename it to marka.app in Applications, and reopen it. Keep any existing destination and leave the signed bundle's contents unchanged. Reinstall the terminal command after moving or renaming the app.
  - The terminal command is macOS-only in this release. Windows and Linux retain their existing app names.
  notes
  - Signed updater artifacts remain enabled for all supported desktop platforms.
