ShortDescription: A dual-pane terminal file manager with Vim-style navigation, Lua configuration, and rich previews.
Description: |
  Commander Wolf is a keyboard-driven terminal file manager with two independent panels.
  It provides file operations, Oil-style directory editing, local and recursive search,
  and previews for source code, images, audio, video, and documents.
  Themes, styles, key bindings, and commands can be customized through Lua.
