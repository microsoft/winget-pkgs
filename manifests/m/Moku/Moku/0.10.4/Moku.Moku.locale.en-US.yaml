ReleaseNotes: "# Moku v0.10.4\r\n**Released:** August 22, 2026\r\n> \"Getting ready for the next chapter.\"\r\n\r\n## Improvements\r\n• Added series context menu options to move downloads up/down in the queue\r\n• Collapsed the downloads queue by series, with a new dropdown, confirmation modal, and reorder context menu\r\n• Collapsed series history, reordered tabs, and added per-series deletion\r\n• Replaced chapter list pagination with a smooth scrollbar view\r\n\r\n## Bug Fixes\r\n• Fixed a navigation softlock when unmounting the browse route\r\n• Fixed library filter persistence and updated the Recently Read API\r\n• Fixed GraphQL tracking-unlink call to use RecordID\r\n• Fixed the MangaPreview add-folder scroll handler\r\n• Fixed reader-to-tracker sync\r\n• Removed content-filter source influence on unrelated results\r\n• Fixed the version comparison function in About settings\r\n• Fixed the search-all filter looping back to default, and search-tab-dependent concurrency pinging\r\n\r\n## Notes\r\n• Prepares the app for the upcoming Tsunagu backend migration — updating in place from 0.10.4 to 0.10.5+ will require a manual migration step\r\n• Dropdown menu portal rework still in progress (#102)\r\n• \"Update All\" button issue still under investigation (#105)\r\n• App data wipe on update still under investigation (#104)\r\n• Downloads recognition on open still under investigation (#103)\r\n\r\n**Full Changelog:** https://github.com/moku-project/Moku/compare/v0.10.3...v0.10.4"
