ReleaseNotes: "# Moku v0.12.0\r\n**Released:** September 12, 2026\r\n> \"Authentication is here.\"\r\n\r\n## Highlights\r\n• **Authentication support**, along with auth consolidation across the app\r\n• **AniList library import**, letting users pull their AniList manga and anime lists directly into Moku, including import as library stubs without a source\r\n• **Tachiyomi backup support** for importing existing backups\r\n\r\n## New Features\r\n• Added an AniList library import modal with language selection and anime support\r\n• Added Tachiyomi backup support\r\n• Added a PKGBUILD for git based Moku builds\r\n\r\n## Improvements\r\n• Split tracker migration logic for more reliable handling\r\n• Streamlined the resume banner layout in the Tracker Import Modal\r\n• Improved language selection in import modals\r\n• Improved AnimePlayer UX\r\n• Fixed the extensions switch for better UX\r\n\r\n## Bug Fixes\r\n• Fixed the download directory setting\r\n\r\n## Notes\r\n• Auth is newly added, please report any issues encountered\r\n• Cloudflare/Flaresolverr support is functional but pending broader user testing\r\n• Anime player upscaling is still work in progress and untested\r\n• Dropdown menu portal rework still in progress (#102)\r\n• \"Update All\" button issue still under investigation (#105)\r\n• App data wipe on update still under investigation (#104)\r\n• Downloads recognition on open still under investigation (#103)\r\n\r\n## New Contributors\r\n• @Gregorein made their first contribution with AniList library import in #124\r\n\r\n**Full Changelog:** https://github.com/moku-project/Moku/compare/v0.11.5...v0.12.0"
