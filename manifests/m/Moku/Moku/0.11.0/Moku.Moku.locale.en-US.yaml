ReleaseNotes: |-
  # Moku v0.11.0
  **Released:** September 3, 2026
  > "Tsunagu."
  
  ## Highlights
  - **Full migration from Suwayomi to Tsunagu** as Moku's backend, the foundational change this release has been building toward
  - Support for **Tachiyomi / Aniyomi / LNReader extension systems**, so existing extension repos can be added directly
  - Library updates now work reliably end to end
  - AniList is currently the only supported tracker, with more planned
  
  ## New Features
  - Redesigned onboarding flow for new users
  - Refactored Storage Settings for clearer configuration
  - Added Server Settings, including early (pending user testing) Flaresolverr/Cloudflare support
  - Added content filtering to exclude unwanted results from search and browse
  - Redesigned Stats page and added download prioritization controls
  - Added metadata matching to help align series across sources
  - Added placeholder cover images and new Novel Reader settings
  - Manga previews now use content based display logic
  
  ## Improvements
  - Reworked MediaPreview and HomeStage extension ID handling, with related patches
  - Persisted cover image switching so selections stick between sessions
  - Various formatting fixes across the app, including the Tag tab (work in progress)
  - Cleaned up UI quirks in Settings, Recent, and About pages
  - Improved AnimePlayer bottom bar zoom configuration
  
  ## Bug Fixes
  - Fixed missing ZipFS handling
  - Fixed extension image stubs so placeholders render correctly
  - Fixed various Tsunagu launch issues (with added debug logging to help catch remaining ones)
  
  ## Notes
  - Auth is still under active development
  - Cloudflare/Flaresolverr support is functional but pending broader user testing
  - Dropdown menu portal rework completed (#102)
  - "Update All" button issue completed (#105)
  - **Data will not migrate over from Suwayomi.** We recommend erasing all existing data before updating to this version
  
  **Full Changelog**: https://github.com/moku-project/Moku/compare/v0.10.5...v0.11.0
