ShortDescription: Screenshot and screen recording tool for Windows. One hotkey, straight to the clipboard.
Description: |-
  Press Ctrl+Q, select a region, and the capture is on the clipboard before the overlay closes.
  Hover a window and click to capture exactly that window. Ctrl+Shift+Q records a region with microphone and system audio.
  Floating preview cards can be dragged into any app. A built in studio adds markup (arrows, text, redaction, crop) and framing.
  Recordings can be trimmed and exported as MP4, WebM, GIF or animated WebP.
  No cloud, no account, no subscription.
