ShortDescription: Every coding agent session as a tile on the Windows desktop, lit when it needs you.
Description: |-
  Horadric shows every coding agent session you have running as a small tile on the Windows desktop, grouped by project.
  A tile turns amber when its agent needs you, and a click opens the real CLI in a real terminal.
  Works with Claude Code, Codex and Grok Build. Written in Rust on Win32 and Direct2D.
