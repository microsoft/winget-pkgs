ReleaseNotes: |-
  Zapret GUI 3.1.1

  Теперь можно включать Zapret только для выбранных вами приложений!

  Основные изменения
  - Добавлены режимы обхода:
  - весь трафик;
  - выбранные приложения;
  - только выбранные списки.
  - Добавлен обход трафика отдельных приложений через модифицированный medvedeff-winws.
  - Добавлен каталог приложений с поддержкой установленных программ, запущенных процессов и импорта .exe.
  - Добавлена потоковая обработка больших списков с атомарным объединением и проверкой данных.
  - Добавлена миграция пользовательских данных со структуры версии 3.0.0:
    - старые списки;
    - настройки;
    - пользовательские стратегии;
    - файлы runtime.
  - Flowseal Core обновлён до версии 1.10.4.
  - Другие незначительные изменения.

  Telegram Mode
  - Обновлён TG WS Proxy с версии 1.6.5 до 1.11.4.
  - Добавлены и улучшены:
    - HTTP/2 и Cloudflare-прокси;
    - пулы соединений;
    - резервные worker-процессы;
    - watchdog и автоматический перезапуск listener;
    - обновление доменов;
    - статистика соединений;
    - обработка конфликтов портов;
    - безопасный запуск и остановка прокси.

  Ai DNS
  - Добавлена система выбора и проверки relay-серверов.
  - Добавлены официальные и зеркальные источники.
  - Добавлен офлайн-набор relay-серверов.
  - Реализованы кэширование, атомарное обновление и восстановление последней рабочей конфигурации.
  - Добавлена проверка некорректных, приватных и прямых Google Frontend-адресов.
  - Улучшены загрузка, повторные попытки и поддержка HTTP/2/DoH.
  - Добавлена миграция старых блоков hosts.

  ⚠️ Внимание ⚠️
  Для реализации работы по приложениям была модифицирована утилита winws, она называется medvedeff-winws и используется только в режиме фильтрации трафика - "Приложения". Для режима "Весь трафик" используется старый механизм, который и был до этого обновления.
  Я не знаю как может отреагировать ваша система/антивирус на модифицированный medvedeff-winws, поэтому советую применять стандартный набор подготовки:
  - Добавить ZapretGUI.exe и всю папку C:\Users\user\ZapretGUI в исключения антивируса.
  - Если возникают проблемы на запуске, то по классике, удаляете всю старую папку C:\Users\user\ZapretGUI (Сохранив свои списки, если они вам нужны), затем заново запускаете ZapretGUI.exe.
  - Естественно нажимаем Да или Разрешить на всех окнах UAC которые появляются. Они должны появиться только один раз при первом запуске программы.

