ShortDescription: Download manager that takes over browser downloads, fetches files in parallel segments and downloads videos with yt-dlp.
Description: Windows port of Mesut Cevik's open-source macOS download manager. A browser extension (Chrome, Edge, Brave, Opera, Firefox) hands downloads to the app, which asks where to save them, fetches them over several connections, resumes after a restart and downloads videos, playlists and subtitles with the bundled yt-dlp and FFmpeg. Speed limit, sleep or shut down when the queue is done, built-in updates.
