Description: |-
  MinePDF 是一款本地优先的「个人 PDF 知识库」桌面应用，形态类似 Obsidian，专注于 PDF 文档的管理、阅读与知识整理。支持与本地目录双向同步的文件夹树、快速 PDF 渲染、高亮标注、标签筛选、Markdown 笔记（含截图插入与 LaTeX）、书签跳转、分屏阅读、全局搜索与临时阅读区，所有数据保存在本机 Documents\MinePDF。
