  11.7.1 - 2026-11-15
  Ghostex 11.7.1 is out. Sessions no longer wake up and spend your usage on their own after a usage limit or a restart, long chats are compacted before they carry on, workers under a coordinator stop sending you notifications, the project picker and the browser bar show each computer's own logo, sidebar extensions arrive, and Settings search finds only real matches.
  🔋 Usage after a limit or a restart
  - Sessions stay put after a usage limit: with Switch accounts and no saved account, a session at its limit stays stopped and nothing is typed into it. After a restart, a limit wait asks "Continue after the limit reset?" with Continue and Not now, and while it waits a card shows the time and a Stop button. A message Ghostex sends by itself now says so (#608).
  - Threads stopped by a restart wait for you: a coordinator's threads that were cut off when Ghostex closed show a red dot ("Stopped when Ghostex closed"), and the coordinator shows one card with Carry on and Not now. Turn on Resume sessions after a restart to let them carry on by themselves (#608).
  - Compact first, save usage: the Continue and Carry on cards have a Compact first box, ticked for chats above the size in Settings > Agents > Claude Code > Compact chats above (200K by default), so a long chat is summarised before it re-reads everything after a break. Claude, Codex, Grok and Cursor.
  - Workers are compacted before their coordinator returns: when a coordinator messages a thread whose prompt cache has expired and whose chat is above that size, Ghostex compacts it first, then delivers the message. Turn it off with Compact workers before a coordinator returns to them.
  🧭 Coordinators
  - Workers stop notifying you: a coordinator's thread that finishes, asks a question, gets stuck or ends on an error tells its coordinator instead of you, and only shows its red or pink dot. Approvals and blocked accounts still reach you, and a worker's approval opens on the coordinator. Settings > Notifications > Workers (Off, Silent or Sound) brings them back. On the computer and the phone.
  - A clearer Workers popover: running work and threads that need you come first, finished ones fold into one line, and each row shows the agent's logo, a two-line preview and its work item.
  - Threads named in the chat look calmer: a thread's name is text with a faint dotted underline, no frame, with a dot only while it works or needs you, in messages, on Message from and to cards and in the chat box. Clicking a name for another computer's session opens it there.
  🖥️ Computers
  - Each computer wears its own logo: pick Apple, Windows, Tux, Ubuntu, Debian, Fedora, Arch or Red Hat as a computer's icon, or let it show its own system's logo; every computer you connect sees the same icon.
  - A new project picker: each project is one line with its own icon (or its letter on a coloured tile), and its computers sit in columns as their logos, with a computer that isn't connected shown faint. The browser's address bar also shows only the logo of the computer a page loads from, with its name on hover.
  - Remote connections when two computers share an id: Ghostex now tells this computer apart from a remote that happens to share its short server id, and says why agents can't reach it, thanks to @banozz0.
  🧩 Extensions
  - Sidebar extensions: an extension can add its own mode beside Bots, sections above or below the projects, a side panel and its own pages, and can ship an agent skill you choose to install with it.
  - The Store shows more before you install: each extension's real icon, README and changelog, and a GitHub link for community extensions. Store pages load faster.
  🐧 Linux and Windows
  - Omarchy and Hyprland: dragging a Ghostex window follows the pointer without black flashes, Ghostex's own windows can be moved by their top strip, and double-clicking it maximizes and restores the window.
  - Copy and paste in text boxes on Linux with Ctrl+Shift+C and Ctrl+Shift+V, so Superwhisper and Omarchy's Super+C and Super+V reach the chat box.
  - Windows finds your editors for Open In: Zed, VS Code, VS Code Insiders, VSCodium, Cursor, Trae, Kiro, Antigravity and JetBrains IDEs installed on Windows now show up and open.
  🩹 Fixes and polish
  - Terminals open when macOS blocks a copied helper: source builds that macOS won't let run from Ghostex's session folder fall back to the app's own copy instead of hanging (#619), thanks to @banozz0.
  - Settings search finds only real matches: searching "spaces" no longer lists every page with "workspaces" or "Monospace" in it. On the computer and the phone.
  - Annotate in Files keeps its buttons in the file's header instead of a floating toolbar.
  - A new session shows in the sidebar: opening a session unfolds its collapsed section, group and project so its row is visible.
  - The phone's tab swipe holds when your finger drifts down, and hovering a pinned coordinator shows the same buttons as any other row.
