  11.11.1 - 2026-11-19
  Ghostex 11.11.1 is out. A calmer chat header, Grok Bot set up from Settings with no terminal and able to pass your answers on to your agents, CLIProxyAPI hubs as the place new sessions start with their usage in the sidebar, signed-out accounts shown in amber, Live pages, click-to-toggle Settings rows, and Workspaces fixes for remote projects.
  💬 Chat
  - A calmer chat header: it keeps the chat's and project's own controls (Start, Open, Commit, Work, the context ring and the panel toggles), and a ⋯ menu holds Grok Bot, Claude, Voice, Share and Open in a popup. Pin any of them from its ⋯ row and unpin it with a right-click; a control in use stays in the header while it is.
  - Ghostex pages are now Live pages, on the page card, in Settings > Chat > Open Live pages in, the Resources list and Help. Only the name changes.
  - Opening a Live page that waits to be seen takes it out of the counts (the bell, the sidebar dot, Needs you and the dock), and its dock row and Work card stay until you dismiss it or mark it seen.
  - The chat box stays usable while a private secret card is open: typing goes to the card until you click into the chat box, and text there that looks like a key or token needs a second Send.
  - More commands get Copy and Paste in terminal: a program Ghostex doesn't know counts when a flag or a path follows it, and a script run from here (./run.sh build) counts with any argument. A command too wide for its line is shortened from its start, so its end stays visible.
  - A command in the floating ask panel's title or status line gets Copy and Paste in terminal too, and Ctrl+Insert on Windows and Linux, or Ctrl+Shift+C on Linux, copies the panel's selection.
  - Busy chats use far less power: a fold animation whose row scrolled away no longer redraws the window every frame, and with Faster rendering off the Quiet View loader no longer lays out the chat 30 times a second.
  🤖 Grok Bot
  - Set up Grok Bot from Settings > Grok Bot, with no terminal: a checklist ticks off each step as Ghostex sees it, from finding the Grok Bot app and adding the published Ghostex bot to pasting its webhook and the test note.
  - Grok Bot can pass your answers on to your agents: ghostex agents send --as-user sends a message as you, and it ends with "Sent via Grok Bot" (or "Sent from the terminal") so you can tell where it came from. A message one agent sends another always names the agent that sent it.
  - The two Grok extensions have clearer names: Grok Bot Embed shows grok.com in the header, and Grok Bot Integration lets Grok Bot control Ghostex. Integration is on by default with its switch at the top of the Grok Bot page; turned off, your agents' notes wait until you turn it back on.
  👤 Accounts
  - A CLIProxyAPI hub can be where new sessions start: pick it in the New sessions start on rule in Settings > Accounts, or with start-thread --account <hub>. A session's automatic title, Generate Commit Message and Catch me up run on its hub too.
  - Hub accounts get usage meters at the bottom of the sidebar, with Show usage in the sidebar in each account's pane. A login that is also a Claude Swap or Codex Swap account shows once, and each account's usage is read at most every 15 minutes.
  - ghostex accounts hub list|add|update|remove adds a hub from a terminal, reading its keys only from a file or standard input.
  - A hub that is down says so: a session asked to start on it says why and to pick another account, one that only follows New sessions start on starts on the account Auto would pick, and a hub session's error card says Can't reach the hub.
  - Hub fixes: usage reads no longer fail with 429, a pasted management.html address works, a Claude session on a hub gets its key on Windows, a hub session runs the real claude or codex even when your shell has a function of that name, parallel launches on one hub no longer break each other, a hub's keys are never sent to a new address (changing it asks for them again), and agents started in your home folder can't read a hub's key files.
  - A signed-out account shows in amber: its sidebar card's numbers (or its logo for Gemini, Cursor and Copilot), the chat box's account mark and the model pill, with a tooltip naming the computer it's signed out on. A computer that stops answering fades its cards instead, and they clear as soon as it reconnects.
  📂 Sidebar and workspaces
  - A remote computer's project has Move to workspace too, so it can move into any workspace and back, and a project added with Add Project on a remote computer joins the workspace of the window you added it from instead of Personal.
  - Folding a coordinator's threads while one of them is the open chat switches the window to the coordinator's chat, as a click on its row does.
  - Ask Ghostex AI's chats show under Main Hub, even with the Main Hub extension off, instead of as a project of their own.
  🧩 Extensions and Settings
  - A click anywhere on a Settings row or card with one switch toggles it, extension cards included, and Space or Enter toggles a focused row. An installed extension's card opens its page from its name or the Details chevron.
  - Workspaces moves to Settings > Extensions > Experimental. Its switch keeps its value, and while it's off nothing of Workspaces shows.
  - The Git extension is retired: the Store no longer offers it and an installed copy is removed. The header's Commit button and its Git popover are Ghostex's own and stay.
  - An extension's dialog can always be closed with the X on its corner or Escape, so one with no close button of its own no longer stays on screen.
  - The Work items extension (0.3.1) leaves the left sidebar: its Work list there is gone, and the Work button and Work panel stay.
  - Settings > Extensions lists the catalog even when one entry can't be read, and an installed extension it can't read is skipped and reported once.
  🧭 Agents and coordinators
  -  --body-file - reads a message from standard input for ghostex agents send, agents create, the main coordinator's send and coordinator start-thread, so text with backticks or $ can go through a quoted heredoc without the shell running it.
  🪟 Windows
  - An inline page window shrunk to a strip grows back to a usable size, and a hidden one stays hidden instead of coming back unclickable.
  🩹 Fixes and polish
  - Screen readers and automation tools can press the Work button, sidebar menu rows and a Work card's More actions, and Needs you rows and Work cards are named after their to-do.
