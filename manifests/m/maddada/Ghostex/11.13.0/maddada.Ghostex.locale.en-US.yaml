  11.13.0 - 2026-11-21
  Ghostex 11.13.0 is out. Ask Ghostex AI greets you with a welcome card and helps you set up, a tidier rail and sidebar, Hide Space, Mark as read in the dock, Fetch latest models, a new default dark look, linked Live pages you can answer, Screenshot mode, Claude limit resets, and a long list of fixes.
  ✨ Ask Ghostex AI
  - Chief of Staff is now Ask Ghostex AI, everywhere you see it: its sidebar row and Main Hub pin, the rail button, Settings, menus, notifications and Help. A chat you renamed yourself keeps your name; ghostex chief still works.
  - Ask Ghostex AI is where Ghostex starts: Main Hub and Ask Ghostex AI are on by default (unless you turned Main Hub off yourself), and it runs on your default agent's best model at High (newest Opus, GPT Sol or Gemini Neon), unless you picked one by hand.
  - Nothing is spent until you press Start: its first message waits on the Start card, and its first reply greets you with a getting-started form (projects, theme, settings, phone, computers, Boosts and Autopilot).
  - A welcome card in its empty chat: a ghost with a clipboard, First steps that tick themselves off as you add a project, sign in an agent, start one and pair a phone, and prompts to try; once you are set up it says "Hi again!" with what is going on. A prompt only fills the chat box, on a new line after what you already typed.
  - Antigravity is a full choice in setup, beside Claude and Codex: Install, a sign-in check with a Sign in button for its Google sign-in, and the default agent pick. Ask Ghostex AI on Antigravity answers the folder question for its own chat without leaving your home folder trusted for every Antigravity session.
  - On the phone, the Ask Ghostex AI row starts it on your default agent with "Start here".
  🧭 Rail and sidebar
  - The rail's top row: with the rail on, Toggle sidebar is the rail's first button and stays put whether the sidebar is shown or hidden; on macOS the window buttons sit over the sidebar, and the notifications bell sits at the top left of the sidebar's top bar.
  - Rest on the rail to peek: with the sidebar hidden, resting the pointer on the rail's top half slides the sidebar out, and its bottom half slides out the Agents Panel; a quick click on an icon opens only that icon.
  - A cleaner rail: no border on its right, a divider line between the rail and the docked sidebar up to the window's top, a plain person or bag icon for the workspace, the app's own flower for Main Hub and Ask Ghostex AI, and outline pins in its ⋯ menu. The rail is for agents and hubs: side panel views and Notifications are off it (pin them from ⋯), and Main Hub steps off while the Unified sidebar shows Ask Ghostex AI.
  - Roomier sidebar spacing: a 52pt rail with larger buttons, taller session rows, sentence-case headings and clearer gaps between groups.
  - Pointing at the rail's usage button shows your account cards at the sidebar's foot until the pointer leaves them; a click still pins them.
  - The work area is always framed, as a card inside the window on every platform; the Frame the work area setting is gone.
  - The project menu follows the session menu: tiles for Rename Project, Add Worktree, New Terminal and New Tab, then Copy, Organise, Hide and More.
  - Session details opens like the Work panel, on the chat's right at the same width, docked or floating; opening one while the other is open swaps them in place.
  - Files & Links is the new name of the session menu tile and the Files card.
  🗂️ Spaces and workspaces
  - Hide Space: a Space's menu has Hide Space, which takes it off the Spaces row on every computer and phone; Sort & Filter > Show Hidden draws it dimmed with Unhide Space.
  - Space and computer tiles show their status as a small dot in the top-right corner instead of a large dot over the bottom edge.
  - Workspaces keep to themselves: a Space or project another computer files in your Work workspace no longer shows (empty) in Personal.
  - Switching workspace and back returns to the same Space and chat.
  💬 Chat
  - Fetch latest models: a refresh button at the right end of the model picker's search row reads the agent's model list again, on the computer and the phone. The Antigravity tab lists Gemini 4 Neon and both Orchestrator planners.
  - Switch agent before the first message, in place: picking another agent's model in a session that has no conversation yet (a new thread, a coordinator before Start) switches that same session and keeps your draft, instead of offering a handover. Switch Account does the same.
  - Mark as read in the dock: a Needs you row leads its buttons with Mark as read (an open envelope), except on a row that asks you a question.
  - Custom Boosts: a Boost you just made shows in the * picker without reopening the chat, and a custom Boost row in the Boost menu has an Edit button on hover.
  - "2 held notes went in with this message" now shows under a message from another agent too, on the computer and the phone.
  - The question tag pill is a softer pink.
  📄 Live pages
  - Linked pages work: a Live page's links to the HTML files beside it open those pages (they could 404), switch pages inside the phone's page view, and a link to this computer from a remote computer's page stays on the tunnel.
  - Sections you can answer: a section opened from a page's link answers to the same agent as the page, so its answers and Mark as read reach that agent, and it waits in the dock once opened until you answer it or mark it as read. Retiring a page also retires its sections.
  - A retired page stops waiting everywhere, in every chat that shows it, Needs you, the dock, the phone and the sidebar, not only in the session that published it.
  🎨 Looks
  - A new default dark look: a new install's dark mode is Inkstone, a muted blue-black with paper-white text and a cinnabar accent, instead of pure black. Your current look stays as it is.
  - No theme changes your fonts, and the other agent-made looks (Firefly Forest, Ember Forge, Synthwave '84, Polar Night, Orchid Dusk) are calmer in the same way as Inkstone.
  - Screenshot mode: one switch in Settings > Accounts (or Toggle Screenshot Mode in the command palette) masks every email, names accounts "Account 1, 2…", hides the account tiles and the other workspaces' names, and shows an amber chip at the sidebar's foot until you turn it off. It never syncs.
  👤 Accounts
  - Claude limit resets everywhere: ghostex accounts, Session details, the sidebar tile, the new-session picker and the phone show how many limit resets each Claude account has left.
  - Use a limit reset automatically (Autopilot, off by default): when a session is stuck at its account's limit and Anthropic confirms it, Autopilot can spend one of that account's resets. Only you can turn it on.
  - An account with an issue shows a small amber dot on its icon instead of turning its name and numbers amber (sidebar, chat model pill, Settings > Accounts and the phone).
  🤖 Agents and coordinators
  - Lead links go two levels deep: a main lead, its sub-leads and their sessions, and a lead always gets the reply its linked session finished with (#701).
  - ghostex agents create takes --model and --effort, and ghostex clear-command says "sent, not confirmed yet" when it can't confirm (#700).
  - ghostex agents wait-reply waits for an agent's next reply (or one holding given text) and exits with a clear message on timeout.
  - Sending from Grok Bot as you works and is labelled "Sent via Grok Bot", and a send from outside any session tells you the exact --as-user command.
  - More agents know they run in Ghostex: Antigravity, Grok Build, OMP, Copilot, Kiro, CodeBuddy and Qoder sessions get Ghostex's note, which now also asks every agent to link what it mentions and keep the images it shows in Ghostex's image folder.
  - A coordinator's first message is safer: it shows once after Start on Antigravity, reaches Codex at Full access, and is never typed after a turn you started yourself in the terminal.
  - ghostex debug show-modal opens a one-time pop-up (like Meet the rail) again for a look, without changing whether it was shown.
  ☁️ Cloud Boxes and extensions
  - Instabox Cloud Boxes boot again when Easy Connect is off on the guest, and a box whose boot fails is stopped at its provider instead of left running (#698).
  - Choosing a Codex account with Tab keeps your Cloud Box choice (#699).
  - Turn Main Hub and GBots on for a connected computer from Settings > Extensions, so Ask Ghostex AI starts there (#695).
  - Installing skills no longer makes folders for agents you don't have (#696).
  🩹 Fixes and polish
  - Next and Previous Session (Ctrl+Tab) keep working when the selected session is asleep (#697), thanks to @roypadina.
  - The Notifications dropdown always opens under the bell you clicked.
  - The workspace tile's menu opens with VoiceOver (VO-Shift-M) and other accessibility tools.
  - A page opened read-only from its file says that no agent sent it, so nothing was sent.
  - Tooltips in the model picker stay on one line and fit their text under glass.
  - Reading Antigravity's model list no longer leaves scratch folders in Antigravity's trusted list.
