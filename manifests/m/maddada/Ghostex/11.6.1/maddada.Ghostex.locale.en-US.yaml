  11.6.1 - 2026-11-13
  Ghostex 11.6.1 is out. Codex on Windows recovers when it quits, model lists read live from each agent, a coordinator on any agent with a clearer setup, fewer coordinator notifications, a limit card that can continue on Opus, folded sent answers, and many fixes, on the computer and the Android app.
  🤖 Agents and models
  - Codex recovers when it quits early: a Codex that quits before its first message shows "Codex isn't running" with Restart, and a message you send then restarts it and goes through. (#595)
  - Model lists come from each agent: the model menu for Claude Code, Cursor and Antigravity now matches what the agent itself offers, read from its own model picker, with older versions under Legacy models (GPT-5.6 Terra, Opus 5 and Sonnet 5 are back there), and Antigravity lists Gemini 4 Carbon.
  - Amp picks its model in Amp: Amp's model pill says "Pick the model in Amp" and opens Terminal view.
  - Gemini CLI is no longer supported: it leaves Settings > Agents, the New session menu, setup and the Agents Hub. Antigravity CLI runs Google's Gemini models.
  🔐 Accounts and limits
  - The limit card says why it didn't switch and can continue on Opus: when no account has room, the card names the model ("No account has room for Fable 5.2"), says in one sentence why each other account is out and when it continues, and offers to continue on another model with room ("Continue with Opus 5.5 on ST"). A Fable session that runs out on every account continues on Opus by itself; turn that off with Settings > Accounts > Claude rules > Continue on Opus when Fable runs out. On the computer and the phone.
  - Usage shows right after a reset is used: the usage popup, sidebar meters and Settings > Accounts show a Claude account's new limits at once, and clicking "Updated … ago" in a Claude or Codex usage popup reads that account again (Refresh now).
  🧭 Coordinators
  - Pick a coordinator's agent after the form: New Coordinator no longer asks for agent, model and effort; Next opens the agent picker, "Pick the coordinator's agent", with every agent you have, on the computer and the phone. Any agent can now run a coordinator.
  - A coordinator on a weaker setup says so: a coordinator on a model or effort that may make it work worse shows an amber "Coordinator quality may be degraded" pill with why and Hide for this chat, and tells you once. A coordinator that drifts from its playbook is reminded in its next message.
  - Coordinators notify you only for what needs you: a coordinator finishing a turn no longer notifies; only a turn that adds a question, a Needs you item or a Blocked item does.
  - Codex's own reviewer is no longer an approval for you: an approval Codex's reviewer decides no longer shows as your approval card, and the Approvals pill is red while a thread's approval waits on you. (#597)
  - Workers shows each thread's work items: a second line of item pills (two, then +N), with a hover card for the item's status, steps and asks and the thread's last report; a click shows the item in the Work panel.
  - Idle threads are left alone: a thread that ended its turn with a background shell still running counts as idle, so it no longer gets "no new output" nudges or stall reports.
  - The How to use note reads in two short lines under its pill.
  💬 Chat
  - Your sent answers fold to one line: the page's or form's name, "3 answered · 1 skipped" and a button that opens the page again; opened, each question shows once by its tag with its answer and note. On the computer and the phone.
  - Select text to reply: selecting text in the conversation shows a small bar with Copy, Add to Chat and Reply.
  - Up recalls your sent messages: Up in the chat box steps back through this chat's sent messages like a shell history, and never fails with "The agent already took this message".
  - Pictures and files move with a paste across computers: a picture or file pill pasted into a chat on another computer gets its file copied there, so the agent can open it.
  - A "could not deliver" notice reaches a busy agent as soon as its input box is ready, instead of waiting for a turn end that may never come.
  - The ? pill no longer opens an empty popup for a question a work item also asks.
  🛡️ Autopilot
  - Autopilot answers approval cards by default: Answer approval cards is on when Autopilot is on (a choice you made stays), and Autopilot never approves anything for a read-only thread.
  🩹 Fixes and polish
  - Drag another computer's sessions in the sidebar between Pinned, Sessions and Parked, and reorder them among the pinned ones.
  - Popovers open at their full height and fade in, instead of opening small and growing.
  - Every drag shows the same see-through ghost as a dragged sidebar session.
  - Settings is quieter: section subtitles that repeated what the switches say are cut or shortened.
  - The Grok logo is as large as Claude's in the chat header, sidebar, pickers and Settings.
  - A tool call card opened inside a Quiet View card fills its width, without the line beside its rows. On the computer and the phone.
  - The Beads view's Tree and Board read the same project, a narrow panel fits a new bead, the search and links, the divider width is kept, links show whole on hover, and failed syncs are logged (#599), thanks to @sebastianarena.
  - An iPhone keeps a busy computer's connection instead of reconnecting about every minute, a busy computer says what Reset connection does, and the phone's kept logs scrub names as they are written (#596, ghostex-mobile #39), thanks to @sebastianarena.
