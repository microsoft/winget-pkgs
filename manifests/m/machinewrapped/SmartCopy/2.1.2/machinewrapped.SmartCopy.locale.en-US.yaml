ReleaseNotes: |-
  New: Multi-select in the directory tree. Ctrl+Click / Shift+Click to select several folders, then Space to check or uncheck them all. The file list follows the most recently selected folder.
  Fixed (Windows): Drive type, free space and same-volume detection used the drive root, so a folder behind a junction, mount point or directory symlink was treated as being on the drive it sits under. A source or destination could be given the wrong drive type (e.g. an HDD shown as an SSD, or a network share as a local disk), copy and move fit checks could use the wrong drive's free space, and an atomic move could be attempted between folders that share a drive letter but live on different physical volumes. These are now resolved from the folder itself.
  Improved: Mapped drives, UNC paths and Linux network mounts are now shown as Network rather than Unknown, and UNC destinations on Windows now get free-space checks.
  What's Changed
  - Classify the volume a folder resolves to, and report network storage by @machinewrapped in #161
  - Resolve free space and volume identity through junctions and mount points by @machinewrapped in #160
  - Support multi-select in the directory tree by @machinewrapped in #162
  - Consolidated dependency update by @machinewrapped in #149
  - Bump the microsoft-extensions group with 5 updates by @dependabot[bot] in #153
