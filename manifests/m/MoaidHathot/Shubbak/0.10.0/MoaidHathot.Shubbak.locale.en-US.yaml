InstallationNotes: |-
  Nothing is running yet, and there is no config until you write one. In a new terminal
  (this one has the PATH it started with):

      shubbak config init          write a starter config: keys, the bar, the palette
      shubbak-wm                   start the window manager now
      shubbak autostart enable     and have it start at logon from now on

  Installed the default way, Shubbak lives in Program Files and can tile windows that
  belong to elevated programs. Installed with --scope user it is a portable copy under
  your profile and cannot; run shubbak-wm elevated if you need those tiled.

  Getting started: https://github.com/MoaidHathot/Shubbak/blob/v0.10.0/docs/getting-started.md
