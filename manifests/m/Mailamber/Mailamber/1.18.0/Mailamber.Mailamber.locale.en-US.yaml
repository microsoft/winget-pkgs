ShortDescription: Email client where your mail stays on your devices, with read receipts, tracker blocking and AI.
Description: |-
  Mailamber is an email client for Windows and Android that keeps your mail on your devices instead of a third-party cloud.
  It works with Gmail, Outlook, Yahoo, iCloud and any IMAP/SMTP provider, including Italian certified email (PEC) with paired receipts.
  Features include a unified inbox, read receipts and link click tracking, remote tracker blocking, snooze, templates, scheduled sending, server-synced drafts and an AI writing assistant.
  The Free plan is free forever; Plus and Premium add more mailboxes, devices and AI credit.
