ReleaseNotes: |-
  v0.15.4 Highlights
  Product updates
  Subscription
  - You can now subscribe from the desktop app. Before, the desktop app showed no subscription. Only the web app sold it. One-time Flux packs work as before.
  Account and sign-in
  - AIRI no longer signs you out after a short network drop, a slow server, or an offline start. Before, any failed token refresh removed your sign-in for good. Now only a real rejection from the server signs you out.
  - After a long time offline, the account page could show "listAccounts failed" and stay stuck. It now refreshes your sign-in by itself. If your sign-in really ended, it asks you to sign in again.
  - Sign-out now ends your session on the server too. It is also faster: the app clears your local sign-in at once and finishes the server steps in the background.
  - To link a new sign-in method, such as Steam or another social account, you now need a fresh sign-in. If your session is too old, the account page shows "Sign in again".
  - New accounts get a generated avatar by default, so you no longer see an empty circle.
  Subscription and Flux
  - The subscription is now the main way to get Flux, and one-time Flux packs are a top-up. Every entry and the page title say Subscription.
  - What you see depends on your account. When you are signed out, AIRI shows no Flux UI. When you are signed in, entries show your Flux balance or your plan.
  - If you got Go or Plus as a promotion, you now also get the Flux that comes with the plan. Before, the plan showed as active but no Flux arrived.
  Characters and voice
  - Module settings pages, such as consciousness, speech, and vision, now change your global defaults. Each character keeps its own choices on its card. Before, these pages saved the choice only on the active character.
  - A character that uses a different speech model of the same provider now speaks with its own voice. Before, some of its replies got no voice.
  Desktop app
  - The update status and the release notes on the About page have a new design. It is easier to see if an update is ready and what it changes.
  Browser extension
  - When you watch a video, the extension now tells your character about it once. Before, one video could start two or three notifications, and some were about the previous video.
  Error reports
  - The desktop app, the web app, the mobile app, and the sign-in pages can now send error reports to help us fix crashes. They follow the same data collection switch as product analytics, so you can turn both off in one place.
  To developers
  - @proj-airi/ui-trace and @proj-airi/ui-timeline are now published to npm with the other trace packages (trace-kit, timeline-canvas, stream-kit).
  To contributors
  - App pages in analytics now report under an origin for each installed app, so web, desktop, and mobile page views stay apart.
  - The Steam sign-in callback now checks the signed return address, as the OpenID 2.0 specification requires.
  Full Changelog: https://github.com/moeru-ai/airi/compare/v0.15.3...v0.15.4
