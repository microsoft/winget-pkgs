ShortDescription: A free auto clicker and visual macro recorder for Windows.
Description: |-
  Macronaut records what you do with the mouse and keyboard and plays it back. It
  is an auto clicker with a repeat interval and a stop hotkey, and a macro
  recorder that turns a recording into a readable list of steps you can edit,
  reorder and re-run.

  Everything is built by clicking, not by writing code. Macros are saved as plain
  JSON files you can read, back up and share.

  Macronaut runs entirely on your machine. There is no account and no usage
  tracking. It checks for updates, and it
  can send a crash report -- but only if you agree when it asks, and never your
  scripts, your keystrokes or anything on screen.

  It is free software under the GNU GPL, and the complete source is published,
  so you can read exactly what it does with your keyboard and build the same
  executable yourself.
