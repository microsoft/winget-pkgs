Description: Chirpity 是您识别鸟类鸣声的终极伙伴。Chirpity 专为夜间迁徙（Nocmig）爱好者和生物声学研究人员设计，彻底改变了从海量音频文件中审查鸟鸣声的过程。凭借尖端的机器学习技术，Chirpity 提供了两种选择：知名的 BirdNET 模型，以及专为夜间飞行鸣叫（NFC）优化的定制化 Nocmig 模型——确保识别结果精准符合您的特定需求。通过直观的审查、标记和管理功能，Chirpity 为您节省了宝贵的时间与精力。
