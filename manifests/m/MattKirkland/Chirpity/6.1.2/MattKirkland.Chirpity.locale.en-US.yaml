ReleaseNotes: |-
  What's changed
  - FFmpeg bumped from v4.4 to a custom build of v7.1. Saves ~150MB on disk
  - As playback nears the end of a file, if a period less than the visible spectrogram window remains, the window slides to the end of the file rather than zooming to the length of the remaining audio
  Bug fixes
  - Summary is updated after species' deletion
  - Detection rank is calculated after list exclusion
