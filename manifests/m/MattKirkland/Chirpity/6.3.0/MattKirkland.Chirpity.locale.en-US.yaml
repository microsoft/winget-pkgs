ReleaseNotes: |-
  What's Changed
  - A much improved spectrogram shows finer details
  - The initial spectrogram default for split channels is now true
  Bug fixes
  - Selection analysis is now consistent across all models
  - Raven export offsets account for files without results
  - Issues affecting playback at the end of a file are resolved
  - Save to archive is again disabled during analysis
  - Fixed an issue preventing analysis after removing / importing a custom model
  - When "split channels" is not enabled, the spectrogram shows a down-mixed mono version of the file, not just the left channel
