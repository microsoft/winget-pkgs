ShortDescription: Recognizes bird vocalizations in audio recordings.
Description: Chirpity is your ultimate companion for identifying bird vocalisations. Designed with Nocmig enthusiasts and bioacoustic researchers in mind, Chirpity revolutionises the process of reviewing extensive audio files for the presence of avian sounds. Powered by cutting-edge Machine Learning, Chirpity offers the choice between the well-known BirdNET and a bespoke Nocmig model - finely tuned for Nocturnal Flight Calls - ensuring identification tailored to your specific needs. With intuitive features for reviewing, tagging, and organizing detected calls, Chirpity saves valuable time and effort.
