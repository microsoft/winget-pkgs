ReleaseNotes: |-
  Shotoshot now speaks 15 languages. Pick yours when installing, or switch anytime from the menu.
  Searching an image on Google now opens the results in your language, not just in English.
  The tool in your hand lights up blue, and your drawing colour sits in a white ring.
