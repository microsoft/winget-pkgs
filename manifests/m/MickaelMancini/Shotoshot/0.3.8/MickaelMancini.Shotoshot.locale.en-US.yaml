ShortDescription: Screen capture and annotation where arrows, shapes and text stay editable.
Description: |-
  Press a key, drag a region and annotate the frozen screen with arrows, shapes, text, pencil,
  highlighter and a paint bucket. Every object stays editable until you copy or save, and an
  editable .shoto image (a real PNG) keeps them for later. Also draws live over the screen while
  presenting, with keys and clicks shown, and writes notes on the desktop under the icons.
  Light resident process, no telemetry, no network request of its own. Available in 15 languages.
