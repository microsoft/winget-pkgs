PackageName: iRacing Discord Presence
PackageUrl: https://github.com/MAlaali/iRacing-Presence
License: Freeware
ShortDescription: Shows your iRacing session (series, session, position, car, track, time left) on your Discord profile.
Description: |-
  A small tray app that reads iRacing's live telemetry and shows what you're doing on your Discord
  profile: series, session, race moments (last lap, caution, finished), your position, car, track,
  time left, iRating and conditions, with pictures of your car and the track. It can also post
  your race results to a Discord channel. Not affiliated with iRacing or Discord.
