ReleaseNotes: |-
  7-Zip ZS 26.05 - v1.5.7 - Release 1
  Compression versions in this release:
  - Brotli Version 1.2.1
  - Fast LZMA2 1.0.1
  - Lizard Version 2.1
  - LZ4 Version 1.10
  - LZ5 Version 1.5
  - Zstandard Version 1.5.7
  - XChaCha20/XChaCha20-Poly1305 Version 1.0.0
  - AES+XChaCha20-Poly1305 (AXP) cascade cipher, Version 1.0.0
  - AES+XChaCha20+Ascon (AXA) cascade cipher, Version 1.0.0, Ascon Version 1.3
  - XChaCha20+AES+AEGIS (XAA) cascade cipher, Version 1.0.0
  What's Changed
  - Minor improvements of handlers and coders for brotli, lz4, lz5, lizard and zstd;
  - Update 7-Zip to v26.05;
  - Some bugs and vulnerabilities were fixed, particularly:
    - fixes brotli buffer overflow GHSA-9v8h-qqgm-4m35 (CVE-2026-111497, decoder out-of-bounds write)
  - Added new encryption algorithms (cascade ciphers) and key derivation algorithms
  - New icons Windows 11 style
