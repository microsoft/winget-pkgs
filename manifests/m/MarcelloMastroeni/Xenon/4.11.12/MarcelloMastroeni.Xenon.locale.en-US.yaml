ShortDescription: A dashboard for a second screen with PC stats, media and audio controls, calendar and widgets, all running on your PC.
Description: |-
  Xenon puts a dashboard for your PC on whatever spare screen you have: a second monitor, a touchscreen, a CORSAIR Xeneon Edge, or a phone or tablet on the same Wi-Fi (beta).
  It shows CPU, GPU and memory load and temperatures, controls media and volume, mutes the microphone, and keeps your calendar, notes and weather in view. Pages, themes and widgets can be rearranged.
  The dashboard is served by a local server on 127.0.0.1:3030. There is no account, and every feature that goes online is listed on the privacy page.
