ShortDescription: تفريغ صوتي داخل مايكروسوفت وورد، يعمل دون اتصال بالإنترنت. يحوّل الصوت والفيديو إلى نص في مستندك باختصار من لوحة المفاتيح، بلا اشتراك وبلا رفع للملفات.

Description: |-
  يحوّل صدى أي تسجيل صوتي أو مرئي إلى نص مكتوب داخل مستند مايكروسوفت وورد
  المفتوح عندك. اضغط الاختصار، اختر الملف، ويُدرج النص عند مؤشر الكتابة.

  كل شيء يعمل على جهازك. لا يُرفع الصوت إلى أي مكان، ولا يحتاج حسابًا ولا مفتاح
  خدمة، ولا يوجد حد لعدد الدقائق ولا لحجم الملف، ويعمل دون اتصال بالإنترنت بعد
  تنزيل نموذج التعرّف على الكلام.

  المزايا:
  - يتعرّف على اللغة تلقائيًا، في أكثر من تسعين لغة، بأخذ عيّنات من مواضع
    مختلفة من التسجيل والتصويت عليها، فالملف الذي يبدأ بموسيقى أو بتحية بلغة
    أخرى يُقرأ بشكل صحيح.
  - يتعامل مع التسجيلات الطويلة بأي مدة. يُحفظ التقدّم على القرص باستمرار،
    فالملف المتوقّف يُكمل من حيث توقّف بدلًا من البدء من جديد.
  - طابور لعدة ملفات، وإلغاء عمل لا يمنع بدء عمل آخر.
  - يُدرج النص في وورد كعملية تراجع واحدة، ويضبط اتجاه القراءة من اليمين لليسار
    للعربية، ويضع المؤشر في أول النص.
  - واجهة بالعربية أو الإنجليزية، قابلة للتبديل من الإعدادات.
  - مُصمّم ليكون قابلًا للاستخدام بالكامل من لوحة المفاتيح ومع قارئات الشاشة
    NVDA و JAWS.

  لا يحتوي المثبّت على نموذج الكلام. بعد التثبيت، افتح الإعدادات ونزّل النموذج
  الذي تريده؛ يُحفظ في ملف المستخدم، فالترقية أو إعادة التثبيت لا تُعيد تنزيله.

  مبني على نموذج Whisper من OpenAI. يتطلّب مايكروسوفت وورد 2016 أو أحدث،
  وحوالي 6 جيجابايت من الذاكرة أثناء التفريغ.

