ReleaseNotes: |-
  First release.

  - Transcribes audio and video into Microsoft Word from a keyboard shortcut
  - Automatic language detection, locked per file so it cannot change mid-way
  - Resumes an interrupted recording instead of starting over
  - Job queue, with a visible list and a cancel that does not block new work
  - English and Arabic interface, and spoken progress for screen reader users
  - Speech models are downloaded from settings, not bundled

