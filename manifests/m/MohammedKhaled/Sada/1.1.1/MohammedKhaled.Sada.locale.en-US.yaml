ReleaseNotes: |-
  Voice typing: press Ctrl+Shift+D in any text box, speak, press it again, and
  the words appear where the cursor is. Everything still runs on your own
  machine - there is no account, no key and nothing sent anywhere.

  - Dictate into any application, not only Word: Notepad, a browser, a message
    box in Teams or WhatsApp. Word still gets one undo step for the whole
    insertion and the right reading direction; everywhere else the text is
    pasted and your own clipboard is put straight back
  - The text goes to the window you started dictating in, even if something
    else takes the foreground while it is being transcribed
  - A password box is refused out loud rather than filled
  - One language per recording, detected over the whole of it, with the reading
    direction following it - Arabic from the right, English from the left
  - Each job starts on its own line with a blank line before it, so running
    several no longer runs the text together
  - Whatever is playing is paused for the length of the recording, because the
    microphone hears the music too
  - The model can be freed from memory, from the tray or after every dictation,
    and loads itself again when you next dictate
  - Sada can start with Windows, as a shortcut in your Startup folder that you
    can see and delete
  - A log file beside your settings, so a problem can be explained without
    being reproduced. It records what failed, never what you dictated
  - The program window closes with Escape, Alt+F4 or Ctrl+W and stays closed,
    and it opens with a welcome listing every command and its shortcut
  - The tray icon shows at a glance whether Sada is ready, working or
    recording, and its menu lists every job and what became of it
  - Your corrections list from Settings is applied to dictation. It was written
    and documented and never actually ran

