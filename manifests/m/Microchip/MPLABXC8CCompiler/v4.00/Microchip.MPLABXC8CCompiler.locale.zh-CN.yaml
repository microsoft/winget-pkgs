Description: MPLAB® XC8 C 编译器是一款强大的优化编译器，可将 ISO C 代码转换用于 8 位 PIC® 和 AVR® 微控制器的高效汇编语言指令。无论您使用的是低成本的基本型 PIC 器件，还是高性能的 PIC18 或 AVR 器件，MPLAB XC8 C 编译器都能帮助您设计出满足设计目标的产品。
