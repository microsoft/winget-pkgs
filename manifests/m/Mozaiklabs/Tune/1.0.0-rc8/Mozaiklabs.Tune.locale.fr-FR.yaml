PackageName: Tune
ShortDescription: Serveur musical installé chez vous, avec une interface web pour votre bibliothèque et l'écoute multiroom.
Description: |-
  Tune Server est un serveur musical qui tourne sur votre propre ordinateur. Il indexe votre bibliothèque
  locale (FLAC, DSD et autres formats), la diffuse vers des sorties audio locales et réseau regroupées en
  zones, et se pilote depuis un navigateur (http://localhost:8888) ou les applications Tune Remote.
  Gratuit pour un usage personnel non commercial, sous Business Source License 1.1.
