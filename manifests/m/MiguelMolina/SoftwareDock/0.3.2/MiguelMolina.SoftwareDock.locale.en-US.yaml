ShortDescription: The software on your PC, one click from the taskbar — and one tool call from your AI agent.
Description: |-
  Software Dock lives in the notification area and opens a panel with everything that is installed,
  what can be updated, what is running and how much it uses, and a search box over the WinGet and
  Microsoft Store catalogs. Update one app or all, uninstall several at once, manage startup apps,
  clean up leftovers, get alerts for exploited vulnerabilities and keep a backup that restores a new
  PC with winget import. The same capabilities are exposed as an MCP server for AI agents.
