ReleaseNotes: |-
  正式版 1.0.0 です。v0.8.0 からの変更は小さく、データファイル・設定ファイルの形式は変わりません。
  - 起動中に出る画面（スプラッシュ）を新しいアプリアイコンに合わせて作り直しました
  - 登録・編集画面のフォルダ取込の「取り込まれるもの」に、種類ごとのアイコンを出すようにしました
  - サードパーティのライセンス表記に著作権表示と本文を載せ、インストール先の exe の横に置くようにしました
  詳しくはリリースノートのリンクを見てください。
