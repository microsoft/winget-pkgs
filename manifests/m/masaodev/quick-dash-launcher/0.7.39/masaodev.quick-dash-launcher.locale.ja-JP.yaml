ReleaseNotes: "## 更新内容\n\n管理画面の詳細編集とワークスペースの確認ダイアログを、メイン画面の登録・編集と同じく独立したウィンドウで開くようにしました。データファイルやワークスペースファイルの形式に変更はありません。\n\n### 管理画面\n\n• **アイテム管理の ✏️ 詳細編集を独立したウィンドウで開く**ようにしました。種類のプルダウンでウィンドウ操作・クリップボード・ウィンドウ配置を選んだときも同じです。管理ウィンドウの中にモーダルを重ねるのをやめ、メイン画面と同じ登録・編集フォームを使います\n  • 「更新」で閉じた内容はこれまでどおり未保存の変更として一覧に反映し、「変更を保存」で確定します。キャンセル・Escape で閉じたときは何も変わりません\n\n### ワークスペース\n\n• **グループの削除・アーカイブの確認を独立したウィンドウで行う**ようにしました。確認のためにワークスペースを広げることはなくなり、ワークスペースのサイズと位置は変わりません\n• 切り離しウィンドウでグループの削除・アーカイブを選んでも、確認が出ず何も起きなかった問題を直しました\n• 切り離しウィンドウからアイテムの編集や確認を開いたとき、「メインと連動して隠す」の設定で切り離しウィンドウが隠れることがある問題を直しました\n\n### メイン画面\n\n• 登録・編集ウィンドウの「⚡ 試しに実行」で、実行中にピンモードを一時的に切り替えるのをやめました（登録ウィンドウが開いている間はメインウィンドウが隠れないため不要になりました）\n\n### 内部\n\n• 子ウィンドウの生成・表示・破棄を共通化し、使われていない処理とスタイルを削除しました\n• PR とmain への push で、型チェック・lint・単体テストを GitHub Actions で実行するようにしました\n• 実際のウィンドウを動かしていた仮想デスクトップのテストを、DLL を差し替えた単体テストに置き換えました\n\n## インストール方法\n\n### インストーラー版\n`QuickDashLauncher-Setup-0.7.39.exe` をダウンロードして実行してください。\n\n### ポータブル版\n`QuickDashLauncher-0.7.39.exe` をダウンロードして任意の場所に配置してください。インストール不要で直接実行できます。\n\n## ライセンス情報\nこのソフトウェアはMITライセンスの下で公開されています。\n依存パッケージのライセンスについては、`THIRD-PARTY-NOTICES.md`を参照してください。"
