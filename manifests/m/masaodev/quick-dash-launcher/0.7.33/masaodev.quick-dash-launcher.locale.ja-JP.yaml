ReleaseNotes: |-
  ## 更新内容

  管理画面・入力画面の不具合修正と、内部構成の大規模な整理です。画面の見た目と操作方法に変更はありません。

  ### 不具合修正

  • **アイテム管理の保存時の「整列・重複削除を実行」チェックボックスが効いていなかった**問題を修正しました。これまでは 1 回目の保存ではチェックを外しても整列・重複削除が行われ、2 回目以降はチェックを入れても行われませんでした
  • **アイテム管理で取込元フィルタを「自動取込のみ」「手動登録のみ」にすると、検索ボックスが効かなかった**問題を修正しました。今後はフィルタと検索語を併用して絞り込めます
  • **ワークスペースのアイテム編集画面のメモ欄で改行できなかった**問題を修正しました
  • 入力画面（モーダル）で、入力中にフォーカスがモーダル本体へ移ってしまうことがある問題を修正しました

  ### 内部

  • メインプロセスの構成を整理しました（データファイル・アイコン処理をサービス層へ分割、ウィンドウ共通処理の集約、画面へ公開する API の型を実装と一本化し未使用の API を削除）
  • 設定画面・アイテム管理画面・登録画面を部品に分割しました（見た目は分割前後で一致することを確認済み）
  • ワークスペースファイルの読み込み処理の重複をまとめました（読み込み結果は変更前と一致することを確認済み）
  • 単体テストを追加し、E2E テストがまれに失敗する原因（ウィンドウの取り違え）を修正しました

  ## インストール方法

  ### インストーラー版
  `QuickDashLauncher-Setup-0.7.33.exe` をダウンロードして実行してください。

  ### ポータブル版
  `QuickDashLauncher-0.7.33.exe` をダウンロードして任意の場所に配置してください。インストール不要で直接実行できます。

