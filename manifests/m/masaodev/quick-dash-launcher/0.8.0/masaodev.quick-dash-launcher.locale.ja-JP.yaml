ReleaseNotes: "## 更新内容\n\nv0.7.39 の後に出したベータ版（v0.8.0-beta.1〜beta.35）をまとめた正式版です。Quick Dash Launcher CLI（`qdl`）・英語表示・セット・ワークスペースの参照・WSグループ・エクスポートとインポート・アップデートの確認を足し、画面の言葉と見た目をそろえました。データファイル・ワークスペースファイル・設定ファイルの形式が変わります。初めて起動したときに自動で変換し、変換前のファイルはバックアップに残します（下の「ファイル形式の変更と自動の移行」を参照してください）。\n\n### Quick Dash Launcher CLI（qdl）\n\n- 起動中の Quick Dash Launcher に、ターミナルや AI から依頼する `qdl` コマンドを同梱しました。基本設定の「qdl コマンドを使えるようにする」をオンにすると PATH に入ります。結果は JSON で返し、変更は開いている画面にすぐ反映してトーストで知らせます（F5 は不要です）\n- ランチャーのアイテム・タブとデータファイル・セットの行・ワークスペースとグループとアイテム・設定（`qdl settings get|set`）を扱えます。`qdl open` でアイテムを開き、`qdl show` で画面を出せます。`--dry-run` で書き込まずに結果を確かめられます。使い方は `qdl help` で出ます\n- Quick Dash Launcher が起動していなければ、`qdl` が起動してから処理します。Windows PowerShell 5.1 向けに、日本語を `\\uXXXX` で出す `--ascii` も用意しました\n\n### 英語表示と画面の言葉\n\n- 基本設定に「表示言語」（自動・日本語・English）を足しました。すべての画面と CLI の応答が英語になります。README は英語版（`README.md`）を用意し、日本語版は `README.ja.md` に移しました\n- 日本語の言葉もそろえました。主なものは「メインウィンドウ」→「ランチャー」、「アイテム表示名」→「表示名」、「親フォルダー」→「親フォルダ」、「アクティブにする」→「前面に出す」です\n- ボタンを主操作・補助・危険な操作の 3 種類にそろえ、トーストを「白いカード＋色の帯＋種類の印」にそろえました。OS 標準のダイアログは、アプリのダイアログとトーストに置き換えました\n- アプリアイコンを新しいデザイン（青の角丸に白い Q）にしました\n\n### セット（旧グループ・旧ウィンドウ配置）\n\n- 種別「グループ」と「ウィンドウ配置」を「セット」1 つにまとめました。行ごとに開くもの・対象ウィンドウ・ウィンドウ位置を持ち、開くだけ・開いて並べる・動かすだけのどれにもできます\n- 開き方は「順番に開く」「同時に開く」から選べます。実行中は行ごとの進み具合と失敗の理由を出し、途中で止められます\n- 編集画面の「＋ ウィンドウを追加」で開いているウィンドウを選んで行にし、「📍 ウィンドウ位置を更新」で今の位置に取り直せます。記録したウィンドウ位置は、画面の並びを縮めた図に重ねて見られます\n- 行に名前を付けられ、「📌 全デスクトップに表示」も設定できます。ウィンドウを記録するときは、タイトルの末尾（アプリ名とバージョン）を外した一部一致で保存します。アプリを更新しても見つかります\n\n### ウィンドウ切り替えとウィンドウ検索\n\n- 単一アイテムのウィンドウ切り替えを、セットの行と同じ「対象ウィンドウ」「ウィンドウ位置」の欄にしました。「🔍 開いているウィンドウから選ぶ」でまとめて入れられます\n- パスを空にして対象ウィンドウだけを持つ「パスの無い単一アイテム」を作れます。開いていればそのウィンドウへ切り替え、開いていなければ何もしません。種別「ウィンドウ操作」は廃止しました\n- ウィンドウ検索で複数のウィンドウを選び、まとめて閉じる・全デスクトップに表示・別の仮想デスクトップへ移動できるようにしました。exe 名でも検索に当たります\n- 別の仮想デスクトップのウィンドウを選ぶと、そのデスクトップに切り替えてから前面に出します。名前を付けたデスクトップは「2: 仕事」のように番号と名前で出します\n\n### ワークスペースと切り離しウィンドウ\n\n- ランチャーのアイテムをワークスペースへ足すと、既定で「参照」になります。名前・パス・メモはランチャーのアイテムから取るので、ランチャーで直すと両方に反映します。参照のカードには小さな矢印が付きます\n- コピーにしたいときは「📄 ワークスペースにコピーを追加」を使うか、Ctrl を押しながらドロップします。「🚀 ランチャーへ移して参照にする」でワークスペースのアイテムをランチャーへ移せ、タブの右クリックの「🔗 ランチャーのアイテムとつなぐ…」で今あるコピーをまとめて参照にできます\n- 「未分類」の欄をやめ、普通のグループにしました。アイテムを足す・移すときは入れるグループを選びます。Ctrl+V の貼り付け先は、最後にクリックしたグループ（枠で示します）です\n- グループの右クリックに「➕ アイテムを追加」「すべて開く」「グループを複製」「🪟 別のウィンドウに切り離す」を足しました。アイテムの編集画面は、ランチャーの登録・編集画面と同じ形にしました\n- 📌 の決まりを、ランチャー・ワークスペース・切り離しウィンドウでそろえました。📌 なしはランチャーと一緒に出て一緒に隠れます。📌 のクリックで表示固定、右クリックで常に最前面にします。× は 📌 があっても閉じます\n- ワークスペースと切り離しウィンドウは、既定でランチャーと同じディスプレイに出ます。ワークスペースを開いていたかを覚え、再起動しても戻します。ランチャーのヘッダーに ⭐（ワークスペース）のボタンを置きました\n- 切り離しウィンドウとワークスペースは、ディスプレイの端だけでなくほかのウィンドウにも吸着します。拡大率が 100% でない画面で、吸着のたびに少しずつ広がっていた不具合も直しました\n\n### ランチャー\n\n- 検索欄の左にモードの目印（🔍／🪟）を出し、ウィンドウ検索中は縁などを紫にしました。0 件のときは、ほかのタブに合うものと取込の入口を案内します\n- 設定に「メモも検索する」「全角と半角を区別しない」「ひらがなとカタカナを区別しない」「よく使う順に並べる」を足しました（どれも既定はオフ）。検索欄の右クリックから検索履歴を選べます\n- 右クリックに「🛡️ 管理者として実行」（Ctrl+Shift+Enter）と「🗑️ 削除」を足しました。アイテムの設定「常に管理者として実行」もあります\n- キー操作を足しました。F2 で編集、Ctrl+C でパスのコピー、PageUp・PageDown で 1 画面分の移動、Shift+F10 で右クリックのメニューです。一覧の下に操作のヒントを出します\n- 種別「WSグループ」を足しました。ワークスペースのグループをランチャーの一覧と検索に 1 件ずつ並べ、選ぶとそのグループの切り離しウィンドウを開きます。アイテム管理の「＋ アイテムを追加」の ▼ の「🪟 ワークスペースのグループを検索に出す」から作ります\n- パス欄の「変換 ▾」で、URL をブラウザの新しいウィンドウ・アプリのウィンドウ・シークレットで開く形に書き換えられます\n- アイテムを開けなかったときは、理由をエラーのトーストで知らせます\n\n### アイテム管理と取込\n\n- タブとデータファイルを、アイテム管理の中で追加・名前の変更・並べ替え・削除できるようにしました。ツールバーは 1 段にまとめました\n- 列ごとの絞り込みと並べ替え、列の出し入れと幅の保存を足しました。メモ・最終起動・起動回数の列も出せます\n- 「CSV に書き出す」「CSV から取り込む」で、すべてのタブのアイテムを CSV で直せます。id で照合し、取り込む前に変更の内容を確かめられます\n- アプリ取込とブックマーク取込を、一覧にチェックを入れて取り込む画面に作り直しました。ブックマーク取込はブラウザのフォルダの木から選べ、そのままブックマーク自動取込のルールにもできます\n- ブックマーク自動取込は、増えた・変わった・無くなったものだけを反映します。取り込んだアイテムに付けたメモやアイコンが、次の取込で消えなくなりました\n- 登録・編集画面のパス欄に、ファイル・フォルダを選ぶボタンを足しました。フォルダ取込では「🔍 プレビュー更新」で取り込まれるものを確かめられます\n\n### 初回設定と設定\n\n- 初回設定を「ようこそ」「ホットキー」「試してみる」「仕上げ」の 4 ステップにしました。ほかのアプリが使っているホットキーを選ぶと、その場で知らせます\n- 設定の「既定値に戻す」を枠ごとにしました。基本設定は「起動と更新」「ランチャー」「検索」「Quick Dash Launcher CLI」「詳細」の節に分け直しました\n- 「詳細」に「アプリに Quick Dash Launcher の環境変数を引き継ぐ」を足しました（既定はオン）。オフにすると、アイテムをスタートメニューから開いたときと同じ環境変数で開きます\n- 設定フォルダの `logs\\main.log` に動作の記録を残すようにしました。不具合の報告のときに添えてください\n\n### アップデートの確認・エクスポートとインポート\n\n- 新しいバージョンが出たら知らせるようにしました。1 日 1 回 GitHub のリリース一覧を確かめ、トーストとトレイのメニューで知らせます。入れ替えはご自身で行います。基本設定の「アップデートを自動で確認する」「ベータ版も確認する」で切り替えられます（Store 版では動きません）\n- 設定タブの「💾 バックアップ」に「エクスポートとインポート」を足しました。データと設定を zip 1 つにまとめ、別の PC や別の配布形式へ移せます。インポートの前のデータは `_pre-import` のスナップショットに残し、そこから元に戻せます\n- 新しいバージョンの Quick Dash Launcher が書いたファイルを古いバージョンで開いたときは、表示だけして書き込みません。知らない項目も消さずに残すので、同期フォルダで別の PC と共有していても欠けません\n\n### ファイル形式の変更と自動の移行\n\n初めて起動したときに、次の変換を 1 回だけ自動で行います。変換前のファイルは、バックアップの設定がオフでも設定フォルダの `backup\\` に残します。\n\n- 旧グループ・旧ウィンドウ配置は、セットに変換します（データファイルとワークスペースファイルの両方。変換前は `backup\\<日時>_pre-set-migration\\`）\n- 単一アイテムのウィンドウ切り替えの旧形式（`windowConfig`）は新しい形に、ウィンドウ操作のアイテムはパスの無い単一アイテムに変換します。id は変わらないので、セットやワークスペースからはそのまま使えます（変換前は `backup\\<日時>_pre-window-migration\\`。セットへの変換と同時なら上の 1 つにまとめます）\n- workspace.json（version は 2.0 のまま）に参照アイテム（`type: \"ref\"`）が増えました。グループに入っていなかったアイテムは、各ワークスペースの「未分類」グループへ移します\n- settings.json に `settingsVersion`（今は 1）が増えました。固定位置のキーは `windowFixedPosition`・`workspaceFixedPosition` に、設定「自動表示」「一緒に隠す」は新しい 📌 の決まりに読み替えます。今の表示位置と動きは変わりません\n- データファイルに種別 `wsgroup` が増えました。設定フォルダには `item-usage.json`（起動の記録）・`update-check.json`・`path-type-cache.json`・`logs\\` が増えます。`README.md`・`schemas\\`・`last-load-report.json` は作らなくなりました（既にあるものは消しません）\n- **変換したファイルは v0.7.39 では正しく読めません**（参照のアイテムは表示されません）。v0.7.39 に戻すときは、上のバックアップのファイルを使ってください\n\n### 注意事項\n\n- 表示名を「Quick Dash Launcher」（単語をスペースで区切る）に変えました。exe 名（QuickDashLauncher.exe）・設定フォルダ・自動起動のショートカットは変わらないので、今の設定とデータはそのまま使えます\n- 同じ名前の exe・ショートカットのアイコンの取り違えを直したため、更新した後の最初の 1 回だけ、exe・ショートカットのアイコンを取り直します。ランチャーに出る「アイコンがまだ無いアイテム」の［取得する］を押してください\n- ポータブル版は、1 ファイルの exe をやめて ZIP 版にしました。データは既定でインストーラー版と同じ `%APPDATA%\\quick-dash-launcher` に置くので、1 ファイルの exe から移ってもそのまま使えます。exe の横にデータを置きたいときは、初回設定でポータブルモードを選びます\n- 正式版とベータ版を同じ PC で使うときは、ベータ版を ZIP 版のポータブルモードにしてください（同じデータを 2 つで使うと、後から起動した方は理由を出して終わります）\n- アプリ取込・ブックマーク取込の取込先の既定が、新しいデータファイルから「選んでいるタブの先頭のデータファイル」に変わりました\n- セットのウィンドウ位置のある行は、既定で置いたウィンドウを前面に出しません（旧ウィンドウ配置から変換した行も同じです）。前面に出したい行は、行の詳細で「前面に出す」を「出す」にしてください\n- ブックマーク自動取込のルールの名前・URL の条件は「その文字を含む」だけになり、正規表現は使えなくなりました。サブフォルダはいつも含めます\n- フォルダ取込で表示名の前後に付ける文字は、入力したとおりにつなぎます。以前のように `: ` や括弧を自動で足さないので、元の見た目にしたいときは設定の値に含めてください\n- ウィンドウ切り替えの「カーソルがあるモニターの中央に配置」は廃止しました"
