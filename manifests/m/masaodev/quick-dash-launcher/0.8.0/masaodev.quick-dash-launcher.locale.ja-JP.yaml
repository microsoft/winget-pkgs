ReleaseNotes: "v0.7.39 の後のベータ版（v0.8.0-beta.1〜beta.35）をまとめた正式版です。\n- Quick Dash Launcher CLI（qdl）、英語表示、セット、ワークスペースの参照、WSグループ、エクスポートとインポート、アップデートの確認を追加しました\n- データファイル・ワークスペースファイル・設定ファイルの形式が変わります。初めての起動で自動変換し、変換前のファイルはバックアップに残します\n- 表示名を「Quick Dash Launcher」に変えました（exe 名・設定フォルダは変わりません）\n- 更新後の最初の 1 回だけ、exe・ショートカットのアイコンを取り直します\n詳しくはリリースノートのリンクを見てください。"
