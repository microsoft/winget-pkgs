License: MIT
ShortDescription: 樹莓派區網管理工具：自動掃描、內建 SSH 終端機、遠端桌面。
Description: |-
  piscout 會找出區網裡的樹莓派，在同一個視窗內提供 SSH 終端機與遠端桌面，
  並有多台總覽與批次操作，也能把 Raspberry Pi OS 燒錄到 SD 卡。
  遠端重灌是進階功能，預設關閉。介面支援繁體中文與英文。
