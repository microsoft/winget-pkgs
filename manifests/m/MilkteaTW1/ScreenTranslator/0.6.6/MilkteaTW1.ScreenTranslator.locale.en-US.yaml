ShortDescription: Free on-screen translator that draws the translation over the original text.
Description: |-
  Screen Translator reads the text on your screen with the system OCR and draws the translation
  right over each text block, so you can keep using your computer normally. It translates with
  Google or DeepL, or fully offline with Argos packs or TranslateGemma. Includes shortcuts, a region
  picker, a game/video mode and speech translation. The interface is available in English and 繁體中文.
