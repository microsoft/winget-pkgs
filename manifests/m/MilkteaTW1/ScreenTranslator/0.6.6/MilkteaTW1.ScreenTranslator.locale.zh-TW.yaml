PackageIdentifier: MilkteaTW1.ScreenTranslator
PackageVersion: 0.6.6
PackageLocale: zh-TW
Publisher: MilkteaTW1
PackageName: Screen Translator
License: MIT
ShortDescription: 免費的螢幕翻譯工具,把譯文直接蓋在原文上。
Description: |-
  Screen Translator 用系統內建的 OCR 讀取畫面上的文字,把譯文直接畫在每一段原文上,
  不需要切換視窗。可用 Google 或 DeepL 翻譯,也能用 Argos 語言包或 TranslateGemma 完全離線翻譯。
  內含快速鍵、框選區域、遊戲/影片模式與語音翻譯。介面支援繁體中文與英文。
