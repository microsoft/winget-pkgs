ShortDescription: Terminal text editor that opens everything - code, Markdown, CSV/XLSX, DOCX, PDF, certificates.
Description: |-
  dmEdit is a full-screen text editor for the terminal. It edits source code and configuration files
  with syntax highlighting for 48 languages, and shows almost any file sensibly: Markdown and HTML
  rendered, CSV / XLSX / ODS as tables, DOCX / ODT / EPUB as text, PDF text, certificates as readable
  reports, images as coloured text art, binaries as a hex dump.
  Every command is in a palette (Alt+P), with the keys other editors use; multi-caret, regex find and
  replace, find in files, macros, bookmarks, git gutter, autosave with crash recovery. The manual is
  built in (Help > Documentation, or dmEdit --help-doc).
