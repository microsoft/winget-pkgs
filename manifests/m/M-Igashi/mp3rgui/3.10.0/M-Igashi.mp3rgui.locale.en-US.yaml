ShortDescription: GUI for lossless MP3/AAC volume adjustment - a modern mp3gain / aacgain replacement written in Rust
Description: |-
  mp3rgui is the graphical interface for mp3rgain, a lossless MP3 and AAC volume normalizer.
  It adjusts the volume of MP3 and AAC (M4A/MP4 and raw ADTS) files without re-encoding, with ReplayGain 1.0, ReplayGain 2.0 or EBU R128 track and album analysis, drag and drop of files and folders, clipping prevention and undo.
