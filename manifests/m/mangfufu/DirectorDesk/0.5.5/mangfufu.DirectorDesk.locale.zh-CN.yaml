ShortDescription: 面向 AI 短剧与视频创作的三维预演工具。
Description: 导演台（DirectorDesk）是面向 AI 短剧与视频创作的三维预演工具。用白模搭建场景、安排人物走位与摄影机运镜，预览并导出参考视频与配套提示词，交给视频生成模型。支持内置 AI 助手与 MCP 外部 Agent 直接编辑工程。
