ReleaseNotes: |-
  更新
  - AI 可以一次查找多类资产、检查多个时刻的构图，并按操作查阅简明帮助。
  - 截图、导出和生成预览时，AI 可以等当前任务完成后继续。
  - 大型场景操作更流畅。耗时操作会在对应按钮上显示处理状态。
  - 改善 Linux 在使用软件渲染时的三维启动。
  - 随软件附带导演台 Skill 1.2.3。
  Windows 提供安装包和便携 ZIP。Linux 提供 AppImage 和 tar.gz。
  Changes
  - AI can look up several kinds of assets, check composition at multiple times, and get focused help for specific operations in one request each.
  - AI can wait for screenshots, exports, and previews to finish before continuing.
  - Large scenes are more responsive during editing. Buttons show when an operation is in progress.
  - Improved 3D startup on Linux systems that use software rendering.
  - Includes DirectorDesk Skill 1.2.3.
  Windows builds are available as an installer and a portable ZIP. Linux builds are available as an AppImage and a tar.gz archive.
