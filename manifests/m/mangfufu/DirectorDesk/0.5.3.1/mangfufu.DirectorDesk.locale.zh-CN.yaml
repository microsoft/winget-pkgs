ReleaseNotes: |-
  本次更新
  - 更新视频反推的显卡兼容支持，加入 RTX 50 系列所需环境。
  - 已有视频反推配置可直接重新配置，复用已下载模型。
  - 新安装默认将模型放在软件目录，也可自行选择位置。
  - Windows 安装版更新和卸载时保留视频反推数据。
  - 包含视频反推、人物外形替换、镜头联系表、预览缓存及构图辅助线。
  从 0.5.3 升级后，请进入「视频反推 → 设置」，点击「重新配置」。已有模型会复用，不需要先删除。
  0.5.3 已撤回，本版包含其新增功能与本次修正。
  视频反推基于 Human3R，需要 NVIDIA 显卡；模型仅限非商业使用，商用需另行取得授权。
  提供 Windows 安装版、免安装版与 Linux AppImage、tar.gz，以及独立 Skill 包。
