ReleaseNotes: |-
  - 更新人物外形与基础动作，支持选中关节调整姿势和记录关键帧。
  - 新增重力、碰撞、惯性、布娃娃及定时受力，提供物理演示场景。
  - 新增对象编组、对齐、阵列和用户布景库，常用布景可保存、复用与分享。
  - 新增工程历史版本，可命名保存方案并在重启后恢复。
  - 新增人物与群演地面自动避障，可安排错峰通行。
  - 新增插件安装与启停，支持扩展创作工具和画面效果，提供自由曲线示例。
  - 扩展 AI 与 MCP 操作范围，支持直接打开、导入、保存和导出工程，减少文件选择弹窗。
  - 改进 AI 连续编辑与会话保存，完善双模式配套提示词；修复部分工具调用失败。
  - 优化编辑性能和文件操作，改善撤销、自动恢复与批量导出重试。
