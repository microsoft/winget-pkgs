ShortDescription: A modern, beautiful, and fully-featured web dashboard for Mihomo (Clash Meta), available as a cross-platform desktop app with a bundled kernel
Description: metacubexd is the official web dashboard for Mihomo (Clash Meta). The desktop app bundles the dashboard with the mihomo kernel and a local agent, providing real-time traffic monitoring and statistics, proxy group management with latency testing, connection tracking and management, a rule viewer with search functionality, live log streaming, and 32 selectable themes with user color overrides. The dashboard is also available as a hosted panel or an all-in-one Docker server.
