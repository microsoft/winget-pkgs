Description: metacubexd 是 Mihomo（Clash Meta）的官方网页仪表盘。桌面应用内置 Mihomo 内核与本地代理服务，提供实时流量监控与统计、带延迟测试的代理组管理、连接跟踪与管理、支持搜索的规则查看器、实时日志流，以及 32 种可选主题和自定义配色。该仪表盘也提供托管面板和一体化 Docker 服务器两种部署方式。
