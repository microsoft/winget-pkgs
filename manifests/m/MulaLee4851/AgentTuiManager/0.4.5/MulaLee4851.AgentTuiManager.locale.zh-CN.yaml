ShortDescription: AI Coding Agent 控制中心：多 Agent 总览、集中审批、安全自动放行与异常恢复。
Description: Agent TUI Manager 是面向 AI Coding Agent 的控制台与值班室：在一个窗口同时查看多个 Claude Code / Codex，集中处理工具审批，把重复出现的低风险操作学习为自动批准规则，自动恢复异常退出的 Agent，并可选通过钉钉 Stream 远程值班。会话仍归官方 CLI，不锁定数据，卸载后可继续使用 claude --resume 或 codex resume。
