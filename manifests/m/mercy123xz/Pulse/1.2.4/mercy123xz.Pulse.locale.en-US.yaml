ShortDescription: A fast, native music player for Windows, written in Rust.
Description: |-
  Pulse is a free, open-source music player for Windows. Most PC music apps are a web browser in disguise; Pulse is native Rust, so it stays light enough to leave open next to a game.
  Search any artist or song, browse charts, keep a library of liked songs, albums and playlists, and import playlists from Spotify, YouTube and SoundCloud. Synced lyrics, a 6-band equalizer, crossfade, gapless playback, themes, a Gaming mode and Discord Rich Presence. No ads, no account needed.
