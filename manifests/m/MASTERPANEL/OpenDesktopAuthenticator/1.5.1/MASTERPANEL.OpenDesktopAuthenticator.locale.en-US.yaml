ShortDescription: A maintained, open-source Steam Desktop Authenticator alternative by MASTERPANEL LLC.
Description: |-
  Open Desktop Authenticator (ODA) is developed and published by MASTERPANEL LLC.
  It is an independently developed, free and open-source alternative to Steam
  Desktop Authenticator (SDA) for generating Steam Guard codes and managing Steam
  trade and market confirmations on a desktop computer.

  ODA supports importing SDA .maFile files without modifying the originals and
  storing account secrets in an encrypted, passphrase-protected local vault.
  Optional automatic confirmation is off by default. No ODA account or cloud
  synchronization is required.

  ODA is not affiliated with or endorsed by Valve. Keeping an authenticator on
  the same computer as Steam does not protect it from a compromised computer.
