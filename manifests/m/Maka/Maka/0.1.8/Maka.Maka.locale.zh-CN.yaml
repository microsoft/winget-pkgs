ShortDescription: 一个本地优先的 Agent 工作台：工具、权限、产物和可恢复的进度全程保持可见。
Description: Maka 是一个本地优先的 AI 桌面助手，它不只回答问题。在受控权限下，它可以检查项目、执行工具、生成产物，并把模型消息、工具调用和长程任务进度保存为可恢复的运行事实。会话、设置与运行记录默认保存在本机；模型连接由你选择——云 API、本地模型或兼容网关。桌面应用、终端 TUI、非交互 CLI 与 Headless runner 使用同一套 Runtime。
