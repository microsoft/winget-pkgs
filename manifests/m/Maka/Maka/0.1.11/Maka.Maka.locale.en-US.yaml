ShortDescription: A local-first Agent workspace where tools, permissions, artifacts, and durable progress stay visible.
Description: Maka is a local-first AI desktop assistant that does more than answer questions. With controlled permissions, it can inspect projects, execute tools, produce artifacts, and preserve model messages, tool calls, and durable-task progress as recoverable execution facts. Sessions, settings, and run records stay on your machine by default; you choose the model connection — a cloud API, a local model, or a compatible gateway. The same Runtime is available through the desktop app, terminal TUI, non-interactive CLI, and Headless runner.
