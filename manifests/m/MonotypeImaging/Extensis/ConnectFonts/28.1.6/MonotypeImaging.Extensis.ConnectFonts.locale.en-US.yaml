Description: Monotype Connect (formerly Extensis Connect) is a font management platform that brings font discovery, licensing, and management into a single connected experience. The Connect desktop application replaces Suitcase Fusion and adds web-based font activation, so fonts can be activated on any device without installing the font files. It supports full font families from Adobe, Monotype, and partner foundries, and integrates with desktop and web applications.
