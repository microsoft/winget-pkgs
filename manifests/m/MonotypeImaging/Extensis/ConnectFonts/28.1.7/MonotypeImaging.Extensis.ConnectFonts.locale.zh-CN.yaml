ShortDescription: 一个用于发现、授权、整理和激活字体的字体管理平台。
Description: Monotype Connect（原名 Extensis Connect）是一个字体管理平台，将字体发现、授权和管理整合为统一的互联体验。Connect 桌面应用程序取代了 Suitcase Fusion，并增加了基于 Web 的字体激活功能，因此无需安装字体文件即可在任何设备上激活字体。它支持来自 Adobe、Monotype 及其合作伙伴字库的完整字体家族，并可与桌面及 Web 应用程序集成。
