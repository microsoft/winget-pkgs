ShortDescription: Full-text desktop search for Windows that indexes locally and ranks results in milliseconds.
Description: |-
  Mo-Search maintains a local index of the files and locations you choose and returns ranked results without uploading indexed content to a Meauxsoft cloud service. It searches file names, paths, and indexed text, ranks matches, and includes an integrated viewer.

  The installer also includes MoContext, a local MCP server that lets compatible AI clients search and read the Mo-Search index on this PC. Mo-Search 26.0 is a 40-day trial of the full product; a 365-day license is $50. 9.50 remains a separate installed product.
