ShortDescription: The MuteMe companion application for your MuteMe
Description: |-
  MuteMe is peripheral device used for those that engage in virtual meetings:
  - MuteMe uses our patent-pending technology and is the first illuminated button to both control your microphone AND sync with the conference application tool of your choice.
  - MuteMe lets you and others around you know when you are in a meeting and when you are muted/unmuted. This is ideal when working from home or when you get numerous interruptions.
  - MuteMe allows you to customize your color selection for each status. We are keeping folks preferences and visual impairments in mind. Today, there are 8 color options (including LED off).
  - MuteMe has numerous other features like sleep mode, brightness control, push-to-talk, push-to-mute, etc which make it the #1 tool ensuring you sound professional and are responsive when you want to be in virtual meetings.
ReleaseNotes: |-
  We're pleased to announce the release of MuteMe version 0.28.3. This is a major release featuring smarter resource usage with significantly reduced RAM and background CPU usage, a major overhaul of the Microsoft Teams and Zoom controllers, and fixes for Microsoft Teams on macOS and Discord synchronization on both Windows and macOS.
  #423 – Lazy-Loaded Audio Helpers with Adaptive Idle Shutdown
  Helper processes are now loaded only when they are actually needed, and they shut themselves down automatically after periods of inactivity. This applies across the board: audio helpers on macOS and Windows, microphone-in-use detection, and all of your conference app controllers (Zoom, Teams, WebEx, Discord, OBS, FaceTime, GoToMeeting, and Amazon Chime). This significantly reduces memory usage and background CPU consumption when the helpers aren't needed. We've also added safeguards to make sure your microphone never gets stuck muted when helpers restart or shut down.
  #424 – Microsoft Teams on macOS – Mute Stops Working Until Restart
  Fixed an issue where the Microsoft Teams controller on macOS could stop responding to mute/unmute commands until the app was restarted. The controller now recovers automatically if it loses its connection during extended use, keeping mute state accurate throughout long meetings and across meetings.
  #427 – Teams & Zoom Controller Overhaul – Windows & macOS
  We've significantly reworked the Microsoft Teams and Zoom controllers on both platforms. On macOS, the Teams controller was substantially rewritten for more accurate meeting detection, and a looping issue was fixed where mute state could ping-pong between the app and Teams. On Windows, both the Teams and Zoom controllers received a new centralized state policy and status callback system for more reliable mute synchronization, along with improved performance and better handling of window states. The macOS Teams and Zoom controllers now also renew their accessibility connections periodically, keeping the connection healthy during long meetings so mute control never silently stops working.
  #426 – Discord Synchronization Fixes – Windows & macOS
  Reworked the Windows Discord controller with improved state handling to fix synchronization issues between your MuteMe device and Discord, including more reliable mute state detection and recovery when Discord's window state changes. We also fixed minor Discord synchronization issues on macOS, with improvements to the native controller's state handling and reliability.
  #425 – Device Controller Runner Process Improvements
  Device controller runner processes were reworked for better reliability and memory reporting. Hardware processes now start only when a MuteMe device is connected and shut down automatically when it's disconnected — with one device connected, the app runs two hardware processes instead of eight.
  #428 – Smaller Downloads
  Test files are no longer included in packaged builds, making the app download slightly smaller.
  Update your software today to enjoy these improvements!
