ShortDescription: The MuteMe companion application for your MuteMe
Description: |-
  MuteMe is peripheral device used for those that engage in virtual meetings:
  - MuteMe uses our patent-pending technology and is the first illuminated button to both control your microphone AND sync with the conference application tool of your choice.
  - MuteMe lets you and others around you know when you are in a meeting and when you are muted/unmuted. This is ideal when working from home or when you get numerous interruptions.
  - MuteMe allows you to customize your color selection for each status. We are keeping folks preferences and visual impairments in mind. Today, there are 8 color options (including LED off).
  - MuteMe has numerous other features like sleep mode, brightness control, push-to-talk, push-to-mute, etc which make it the #1 tool ensuring you sound professional and are responsive when you want to be in virtual meetings.
ReleaseNotes: |-
  This is a feature release focused on new features, bug fixes, and performance improvements.
  #413 – Micro Mode (MuteMe+ Feature for Hardware Owners)
  Ultra compact mute button view - a new minimal view mode perfect for multitasking while keeping your mute status front and center.
  #415 – Welcome Screen Overhaul
  Completely redesigned the welcome screen with improved navigation, better visuals, and an enhanced onboarding flow for new users.
  #416 – Light/Dark Theme for All Popups
  Extended the light/dark theme preference to apply consistently to all popup windows throughout the application including settings and notifications.
  #417 – macOS Automation Permissions Check
  Added a new permissions check service specifically for macOS automation permissions required for meeting detection and mute control.
  #411 – macOS Teams Meeting Detection
  Fixed an issue where the macOS Microsoft Teams controller was falsely detecting active meetings and remaining latched even when no meeting was in progress.
  #422 – Preferences Not Persisting
  Fixed an issue where user preferences set during the Welcome Screen setup were not being properly forwarded when transitioning to the main application.
  #414 – macOS Controller Performance
  Switched Webex, Zoom, and Discord controllers on macOS to an event-driven architecture with adaptive polling. This significantly reduces CPU usage when these apps are open, idle, or minimized.
  #327 – Device Controller Improvements
  Added memory monitoring and leak-test tooling to device controllers. This improves stability and helps identify memory issues before they become problems. We also fixed and improved some issues with Discord.
  Update your software today to enjoy these improvements!
