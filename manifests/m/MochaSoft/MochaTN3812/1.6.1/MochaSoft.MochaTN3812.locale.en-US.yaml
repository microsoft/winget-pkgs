ReleaseNotes: |-
  - Makes the app ready for iAccess Printer Host-Based Security. When a session is made, tn3812 will send user and password encrypted with SHA1 : https://ibm-power-systems.ideas.ibm.com/ideas/IBMI-I-4808
    If the User ID/password is not valid an error message window will pop up.
    Older AS/400 OS versions will just ignore the request, and work normally.
