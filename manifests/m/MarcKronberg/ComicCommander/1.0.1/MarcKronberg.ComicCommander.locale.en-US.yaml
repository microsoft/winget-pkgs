ShortDescription: Comic browser with cover thumbnails and a built-in reader
Description: |-
  Comic Commander shows your comic library (CBZ, CBR, CB7, CBT, PDF, also ZIP, RAR, 7z and TAR) as a wall of covers
  or on a wooden bookshelf and opens the books in a built-in reader: single page or continuous, zoom modes, rotation,
  manga mode and full screen. Metadata from ComicInfo.xml, series and folder views, reading progress per book.
  Comic folders are only read, never written. Free and open source (MIT).
