ShortDescription: Upload files and screenshots to your own S3-compatible storage and copy a shareable link.
Description: |-
  Aktar is a free, open-source notification area app that uploads files and screenshots to your own S3-compatible storage (Amazon S3, Cloudflare R2, Backblaze B2, DigitalOcean Spaces, MinIO, Wasabi and others) and copies a shareable link to the clipboard.
  No account, no servers, no telemetry: files go straight from your PC to your bucket.
  Features include drag and drop, a global upload shortcut, watched folders, expiring uploads, temporary links, short links, a bucket browser with thumbnails and a "Send to" / right-click entry in File Explorer.
