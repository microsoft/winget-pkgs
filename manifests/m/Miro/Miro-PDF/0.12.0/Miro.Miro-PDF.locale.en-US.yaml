ReleaseNotes: |-
  Caution
  Breaking changes
  From this release onwards we have implemented modes, allowing for different keybinds at different times in the program. This means that you should update your config file if you have any, have a look at default.conf for the new syntax.
  The old config will work but produce deprecation warnings.
  What's Changed
  - Revamped rendering for low levels of zoom. Leads to better performance when showing many pages. This also fixed some clipping issues after ZoomFit.
  - Rotate individual or all pages (suggested by @AyoungDukie)
  - Fix CJK filenames in the Recent menu by @oiahoon in #153
  - Improve performance by caching page bounds on large files by @vincent-uden in #160
  - Overview mode by @vincent-uden in #163
  - Presentation mode
  - Parse and build trees of comments and replies from text and other annotations by @vincent-uden in #166
  - Comment sidebar by @vincent-uden in #169
  - Path for mupdf-sys build.rs specifically to fix file permission issue in nix by @vincent-uden in #170
  - Reduced stutter in extremely long documents during panning
  New Contributors
  - @oiahoon made their first contribution in #153
  Full Changelog: v0.11.1...v0.12.0
