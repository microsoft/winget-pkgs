ShortDescription: Temperature monitoring and fan control from your phone.
Description: |-
  A web panel served by the PC itself: CPU, motherboard and GPU temperatures, power, clocks, charts of the last
  10 minutes to 7 days, the motherboard's fan curves and the GPU fan. On the local network, a phone gets in only
  after pairing with a QR code shown on the PC. Runs as a Windows service with a tray icon.
