ReleaseNotes: |-
  Welcome to Deceive v1.18.0! This release fixes/adds support for the new Unreal Engine TFT client and has some other miscellaneous fixes. You will need to update if you plan on playing TFT, as older versions will not hide your status when playing TFT in the new client.
  Bug Fixes/Improvements
  - Fix status not being hidden when playing TFT (thanks @Tin97).
  - Add support for the standalone TFT client as launch option and add a TFT button in the launch dialogue.
    - Currently, pressing the TFT button will just open the TFT section within the League client. Once Riot finishes the migration to the standalone UE-based TFT client, Deceive will automatically open the new client instead.
  - Deceive now directly launches target game on startup game again, instead of only launching the Riot Client.
  - Deceive now only sends the "Welcome to Deceive" chat messages the first time you launch Deceive, instead of on every launch (thanks @lotusflowr).
  This version of Deceive should work properly for standard/unmodified installs of League of Legends, Legends of Runeterra, VALORANT, Teamfight Tactics, and 2XKO. If you encounter any issues, please let me know on the Discord.
  As always, Windows may complain about the executable coming from an untrusted source. You can mitigate this warning by pressing More Info, followed by Run Anyway. If you want to be completely sure that Deceive is safe, you can also download Visual Studio and compile from source yourself.
  If your antivirus blocks Deceive, please let us know in the Discord so we can submit a sample. Deceive contains no viruses (obviously), but some virus scanners may incorrectly detect common pieces of code that are also used in malware.
