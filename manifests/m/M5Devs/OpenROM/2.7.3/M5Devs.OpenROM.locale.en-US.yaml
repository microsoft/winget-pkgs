ShortDescription: Universal Retro Gaming Toolkit — convert, patch, compress and manage ROMs
Description: |-
  OpenROM is a free, open-source Universal Retro Gaming Toolkit.
  Convert, patch, compress, and manage your retro ROM collection.
  Supports PS1, PS2, PSP, Xbox, GameCube, Wii, Dreamcast, Saturn, Sega CD and more.
  Includes ROM patching (IPS, BPS, UPS, xdelta3), ZIP/7Z compression,
  header removal, M3U playlist generation, and a full headless CLI.
  Runs 100% offline. No telemetry. No accounts required.
