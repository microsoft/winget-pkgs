Description: OpenROM is a free, open-source Universal Retro Gaming Toolkit. Convert, patch, compress, and manage your retro ROM collection. Supports PS1, PS2, PSP, Xbox, GameCube, Wii, Dreamcast, Saturn, Sega CD and more. Includes ROM patching, ZIP and 7Z compression, header removal, M3U playlist generation, and a full headless CLI. Runs 100% offline with no telemetry.
