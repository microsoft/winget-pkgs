PackageName: Mevise WinWatch
PackageUrl: https://winwatch.app/
License: Proprietary
ShortDescription: Tray app that checks Windows privacy settings and tells you when one changes back. Fixing settings needs Pro.
Description: |-
  Mevise WinWatch sits in the notification area, checks Windows privacy settings every five minutes and tells you when a setting is no longer private.

  Free:
  - Checks in the Balanced profile, including diagnostic data, advertising, search, app permissions, Microsoft Edge policies and firewall status
  - Alerts when a setting changes
  - Accepting a detected change you want to keep, which stops its alerts
  - Camera, microphone and location use from the last 24 hours
  - Undo of WinWatch's changes and restore from its backup file

  Pro (a license is required after a 30-day trial that works offline):
  - Sets exposed settings back to private after you confirm
  - The full set of checks, including AI feature policies, and custom checks
  - Baseline of services, scheduled tasks, startup items, installed apps and network settings
  - Change history, including what changed around a Windows update
  - Seven-day camera, microphone and location log, diagnostic connection view, firewall blocks and status reports

  WinWatch needs no account. If you turn on update checks, it requests a release file from winwatch.app. With Pro, WinWatch looks up Microsoft's diagnostic host names through your DNS server. On Windows Home and Pro editions some diagnostic data is still sent when that setting shows as private.
Moniker: winwatch
Tags:
- camera
- microphone
- monitor
- privacy
- telemetry
- tray
InstallationNotes: WinWatch is installed for your Windows account. Start it from the Start menu.
