  - feat: 支持 iOS 后台下载 @Aftera1n (#1442)
  - feat: 支持在 iOS 上打开数据目录 @Aftera1n (#1440)
  - feat: 增强扩展 API @monkeyWie (#1413)
  - feat: 使用 Blob HTTP 传输替代 gblob @monkeyWie (#1407)
  - feat: 为外部下载添加 Android 对话框模式 @Locon213 (#1362)
  - feat: 扩展支持 WebView @monkeyWie (#1359)
