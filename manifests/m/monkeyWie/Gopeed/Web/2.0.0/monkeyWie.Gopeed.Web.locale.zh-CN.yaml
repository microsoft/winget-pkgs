ShortDescription: 开源、轻量、原生，支持（HTTP、BitTorrent、Magnet 等）协议下载。
Description: Gopeed（全称 Go Speed），直译过来中文名叫做够快下载器（不是狗屁下载器！），是一款由 Golang+Flutter 开发的高速下载器，支持（HTTP、BitTorrent、Magnet）协议下载，并且支持全平台使用。除了基本的下载功能外，Gopeed 还是一款高度可定制化的下载器，支持通过对接 APIs 或者安装和开发扩展来实现更多的功能。
Tags:
- 下载
- 下载器
ReleaseNotes: |-
  Gopeed 2.0.0 正式发布！历经 8 个多月的开发和测试，共合入 132 个 PR，由 33 位贡献者共同完成，涉及近 16 万行代码改动。
  - 🎨 全新 UI — 更现代的视觉设计，布局更清爽，好看也更顺手。
  - 🪟 桌面多窗口 — 支持在独立窗口新建任务，也能为单个下载弹出进度窗。
  - ⬇️ 更多下载协议支持 — 新增 FTP 和 HLS（M3U8）下载。
  - 🧩 扩展引擎增强 — WebView 支持独立会话和代理，内置 FFmpeg，可直接合并音视频。
  - 📋 任务管理升级 — 新增任务组和自动目录分类，批量下载更容易整理。
  - 🤖 AI 集成 — 通过 MCP 接入 AI 助手，用自然语言创建、查询和管理下载任务。
  - 🛠️ Bug 修复与稳定性 — 修复了大量 Bug，提升了 HTTP 和 BitTorrent 下载的稳定性。
  感谢每一位参与开发、测试和反馈的社区用户，赶紧升级体验吧！
  以下是本次更新的详细内容。
  🆕 新功能
  - feat(ui): 桌面端支持独立下载进度窗 @w19996 (#1650)
  - feat(tray): 托盘菜单新增打开下载目录的入口 @ArtemChikolaev (#1681)
  - refactor(ui): 改进高级选项和设置操作的反馈 @monkeyWie (#1661)
  - feat(ui): Web 端通过弹窗创建任务，统一各平台创建任务入口，并支持点击应用标识返回首页 @monkeyWie (#1633)
  - feat(tasks): 将扩展文件夹下载聚合为一张任务卡片，统一显示进度并支持分组操作；批量创建接口改为返回 {taskIds, parentId?} @wufeng5702 (#1594)
  - feat(protocol): 新增 FTP、FTPS 和 FTPES 下载，支持目录下载、分段传输和断点续传 @silasmariusz (#1569)
  - feat(download): 支持按文件扩展名自动保存到分类目录，并提供可编辑的扩展名规则，默认关闭 @wufeng5702 (#1572)
  - feat(http): 对长度未知的下载使用扩展提供的文件大小作为估算值 @monkeyWie (#1599)
  - refactor: 移除代理 API，将 Tracker 订阅交由后端管理，为应用更新添加 SHA-256 校验，并改进 GitHub 镜像回退；旧 Tracker 和镜像配置不自动迁移 @monkeyWie (#1596)
  - refactor(downloader): 资源解析接口改为仅接收请求参数，下载选项需在创建任务时传入 @monkeyWie (#1595)
  - feat(bt): 新增 BitTorrent DHT 和 PEX 开关，重启应用后生效 @junkerderprovinz (#1555)
  - feat(download): 新增 HTTP 文件校验、MCP 下载速度与进度工具、暂停 Webhook 事件及命令行校验参数 @Ashish6298 (#1542)
  - feat(ui): 直接从 GitHub 检查扩展更新，统一更新入口，并显示本地扩展文档 @monkeyWie (#1535)
  - feat(task): 记录任务完成时间，并在任务详情中显示 @monkeyWie (#1536)
  - refactor(ios): 简化持续处理任务的启动流程，并与实时活动共用任务事件解析逻辑 @UltraGeek0102 (#1547)
  - feat(extension): 支持在任务启动和错误处理事件中通过 task.meta.req 修改请求参数 @monkeyWie (#1538)
  - feat(http): 通过批次平方增长加快 HTTP 下载连接扩张 @monkeyWie (#1530)
  - feat(extension): 提供宿主环境信息和 WebView 页面事件 @monkeyWie (#1527)
  - feat(flutter): 为桌面下载通知添加操作按钮 @monkeyWie (#1524)
  - feat(media): 支持将媒体输入暂存到磁盘，并报告数据生成进度 @monkeyWie (#1520)
  - feat(webview): 支持代理及按扩展管理 WebView 配置文件生命周期 @monkeyWie (#1517)
  - feat(extension): 新增 FFmpeg WASM 运行时 @monkeyWie (#1512)
  - feat(hls): 新增原生 HLS（m3u8）下载支持 @shenbururen (#1515)
  - feat(ios): 支持 iOS 26+ 持续处理任务与实时活动 @UltraGeek0102 (#1514)
  - feat(ui): 突出创建任务入口，并为空列表添加快捷操作 @monkeyWie (#1505)
  - feat(native): 统一桌面端和移动端的原生 API 异步回调调用机制 @monkeyWie (#1476)
  - feat: 添加 MCP 支持 @monkeyWie (#1471)
  - feat: 将原生通信迁移至 FFI @monkeyWie (#1457)
