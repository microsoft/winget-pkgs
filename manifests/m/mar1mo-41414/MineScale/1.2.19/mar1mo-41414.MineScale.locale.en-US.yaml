ReleaseNotes: |-
  MineScale-Java v1.2.19
  ホストがエラーも出さずに無音で止まる現象の原因を、次に起きたとき確実に突き止めるための診断を入れた版です（v1.2.18 を試す予定でしたら、こちらを使ってください）。

  追加
  - panic をログに記録（スレッド名・ソースの行・メッセージ）。これまで Windows の GUI では、バックグラウンドの panic が完全に無音でした。
  - GUI: セッションが異常終了したら画面に表示します（internal error: the session crashed）。これまでは動いて見えていました。
  - 生存確認: GUI は 10 秒ごとに alive をログに記録します。無音になったとき、「プロセスは生きていて何かが止まっている」のか「プロセスごと消えた」のかが区別できます。
  - GUI のログファイルは、画面に出さない詳細（DEBUG）まで記録します（ホールパンチの経過など）。

  v1.2.18 の内容も含みます
  ホールパンチが失敗してもセッションを終了しない／一時的な UDP エラーを無視する／止まったセッションを GUI に表示する。

  更新のお願い
  ホストとジョインの両方を更新してください（特に Windows のホスト）。サーバーの更新は不要です。
  再現したら、ホストとジョインの両方のログファイル（docs/TROUBLESHOOTING.md に場所があります）を見せてください。
