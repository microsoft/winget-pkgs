ReleaseNotes: |-
  新功能
  - 单渠道多绘图模型：一个渠道可挂载多个绘图模型，每个模型独立配置尺寸、质量、思考强度、比例、分辨率与专属提示词；生成时按「显式参数 > 命中模型 > 渠道默认」解析。
  - 桌宠聊天：宠物窗口新增聊天，可读取会话历史并以对话记录作为背景，内置多款宠物角色，新增动画速度设置。
  - 绘图工作台提示词优化：一键优化提示词，优化中可取消，成功后一键还原；不会自动触发出图。
  - 提交详情卡片：补齐变更文件数，支持跳转 GitHub / GitLab 远端提交，并可一键记录到备忘录。
  改进
  - 重试可观测性：chat / anthropic / gemini / interactions / responses / 视觉 / 模型列表等全部路径统一重试留痕，serverError 关键词补齐 Cloudflare 5xx 系列。
  - 重试提示显示「N 秒后重试」实时倒计时，不再对着最长 30 秒的退避盲等。
  - 辅助请求（摘要、提交信息、提示词优化、主题取色、代码审阅）固定重试 3 次，后台任务失败更快。
  - 侧边栏会话树：子代理与 Workflow 合并为同一个展开按钮，树形刷新与主会话列表解耦。
  - 绘图图库、工具卡片与设置面板的装饰性 emoji 统一替换为 lucide 图标。
  修复
  - 修复永久性 400 参数错误被无限重试：纯数字关键词改为数字边界匹配，会话 ID 中的随机数字不再被误判为 5xx 状态码。
  - 修复输入栏插件 Action 状态文案闪现与残留，仅保留转圈与还原按钮。
  - 修复任务历史持久化与页脚快照串用：暂态写入失败自动重试，页脚快照按回复身份隔离。
  - 修复文件追踪与终端命令并发时的误判：冲突窗口不再阻断文件写入，改为标注污染租约。
  - 恢复 Chromium 默认的遮挡节流（移除 backgroundThrottling: false），修复会话流式期间 alt+tab 切换窗口卡顿。
