ReleaseNotes: |-
  新功能
  - 持久记忆：新增 memory MCP 服务支持条目级持久记忆——代理可按项目保存/搜索/列出/更新/删除记忆条目，记忆自动注入系统提示；设置页新增记忆管理面板，删除会话时同步清理关联记忆。
  - 侧边栏折叠快捷键：新增左右侧边栏折叠/展开快捷键。
  改进
  - Windows 窗口控制栏合并进入顶栏（TopBar），Plus 按钮重构为可复用组件。
  - MCP 添加弹窗的 JSON 编辑器支持语法高亮与容错粘贴解析。
  - 成功提交后重置输入框高度。
  修复
  - 删除会话时清理孤儿检查点快照目录。
  - 系统设置写入改为在缓存失效后执行（宠物设置改为乐观更新），修复读取旧值的问题。
