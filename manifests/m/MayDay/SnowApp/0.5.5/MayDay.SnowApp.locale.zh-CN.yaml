ReleaseNotes: |-
  新功能
  - 会话绑定 API 档案：插件可通过新增的 conversations.setApiProfile 写入动作与 conversations.create 的 apiProfile 选项把会话绑定到指定 API 档案，后台发送沿用该档案，子代理一并继承。
  - 编辑区右键菜单：编辑区支持右键剪切/复制/粘贴/全选，命令由主进程执行，不可用项自动置灰。
  - 使用指南浮层菜单：侧边栏「使用指南」按钮改为浮层菜单，可直接进入快捷键指南与更新日志。
  - 模型选择器分组：折叠展示时按品牌分组显示。
  - 思考档位「极高」：支持的模型新增 Extra High 思考档位。
  - 回复预测完善：预测请求的 token 用量计入所在会话，并按会话缓存预测结果，切换会话后仍可复用。
  改进
  - 工具纠错逻辑抽成共享执行器，子代理与 Workflow 节点与主会话一样具备工具失败自动纠错，纠错后的调用重新走各自的授权流程。
  - 自动压缩统一收敛到共享闸门，主循环、子代理循环与 Workflow 节点的所有请求入口处理一致；压缩失败改为专门提示并保持可见。
  - 右面板收起时加号菜单跟随展开按钮保留，终端滚动条样式与全局统一。
  修复
  - 空的待定助手消息改为隐藏占位，消除多余间距。
  - 任务历史保存改用 IMMEDIATE 事务与写锁。
  - 检查点根目录变更后清理派生路径缓存；发布内容寻址对象时去除继承的只读属性。
  - 文件快照先解析条目类型，跳过目录与不存在路径，避免无意义的处理错误。
  - Windows 进程树按创建时间校验父子关系，避免 pid 复用把无关子树合并进来。
