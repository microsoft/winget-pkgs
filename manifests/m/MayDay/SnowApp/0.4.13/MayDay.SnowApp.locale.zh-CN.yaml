- mcp
- ssh
- 终端
- 聊天
ReleaseNotes: |-
  新功能
  - 会话工作树：会话可绑定独立 Git 工作树执行——工具调用、文件变更监听、检查点回滚、diff 追踪与子代理 / 工作流级联全部隔离在工作树内，多个会话并行开发互不干扰；Git 面板新增工作树管理卡片（新建、删除、脏状态标记、打开终端或文件管理器），输入框底栏可随时切换会话绑定，分支选择器支持分支与工作树混合搜索。
  - 多远程与分支管理：推送 / 拉取支持选择远程仓库并设置上游（-u）；分支列表显示领先 / 落后计数与消失标记；分支统一右键管理（复制、切换、创建分支、重命名、安全删除，当前分支与任何工作树已检出的分支受保护）。
  - 工具卡片全面升级：Bash 渲染真实 ANSI 彩色输出，数据库查询结果为可交互表格（过滤、排序、导出 CSV），文件读写代码高亮，LSP 结果卡片支持批量语义、符号大纲与悬停提示，图片理解新增专属卡片；外部 MCP 工具获得通用增强卡片（表格 / JSON 树 / 文档视图、智能分类与一键复制）。
  - 系统日志查看：新增系统日志工具卡片与只读 config-logs-read 工具，可按级别、模块、时间与会话筛选，提供应用级统计摘要并对敏感字段脱敏；会话菜单新增「复制会话 ID」。
  - 内置浏览器历史：内置浏览器记录访问历史并用于地址栏补全；浏览器设置新增「历史记录」面板（搜索、单条删除、清空、重新打开）。
  - LSP 批量语义查询：语义工具支持一次查询多个符号 / 文件，完成 11 个工具的参数契约与动态提示词注入，并优化 Go 接收器方法匹配与工作区 TypeScript 解析。
  改进
  - 手机远控：「文件变更」面板改由原生检查点计算（含 SSH），新增变更摘要、增删行数与主 / 子代理归属；内置 frpc 隧道组件被杀毒软件拦截时给出排查引导。
  - 侧栏图标悬停播放描边动画，聊天流式滚动跟随更稳定；会话标题与列表中的标签（文件、图片、提交、引用等）折叠为可读文本。
  - 功能页（备忘录 / 项目记忆 / 定时任务）支持拖拽调整双列宽度；MCP 面板中已禁用的服务器仍可查看工具。
  - Git 提交图与悬停提示显示完整提交信息，文件读取卡片的行号渲染优化；确认气泡改用自定义下拉组件。
  - 消息复制按钮统一为通用组件（支持复制 Markdown / 纯文本与压缩摘要）；文件提及弹窗新增「停止输入后开始 AI 搜索」等待提示，API 档案的请求方式显示提供方图标。
  修复
  - 修复 MCP 外部服务器重复握手与探测等待：发现缓存延长至 5 分钟，旧式服务器协商结果被记忆并直接走 legacy 握手，不再重复发现扫描（#172）。
  - 修复 Windows 下 electron-builder 打包 EPERM 失败（新增修复脚本），并固定 Electron 打包版本。
  - 修复工作树边界情况：删除已绑定会话的工作树自动级联解绑、运行中的会话禁止重新绑定，存储写锁加固。
  - 修复终端交互：无命令打开时仅创建标签页，xterm 快捷键不再重复触发复制 / 粘贴；统一 Linux 桌面名称配置。
