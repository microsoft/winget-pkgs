ReleaseNotes: |-
  新功能
  - 独立窗口：右侧面板标签页与会话可在独立窗口中打开，并与主窗口实时同步，同时新增相应快捷键。
  - OAuth 配额面板：订阅类渠道在 API 设置中显示剩余配额，面板可折叠并记住展开状态。
  - 系统默认应用打开：资源管理器中的文件可用系统默认应用打开。
  - /help 命令：新增使用指南，快速了解内置命令与功能。
  - 工具调用看门狗：监控工具调用是否停滞，并在卡片上显示决策模型的判定结果。
  - API 密钥显示开关：API 密钥输入框支持显示与隐藏。
  改进
  - 每次 MCP 调用均受单次超时限制。
  - 代码库索引的嵌入维度可留空。
  - 插件输入栏 Action 移除常驻的差异 / 预览按钮，「还原」收进更多菜单。
  - 绘图模型及其能力改由各渠道的模型配置驱动。
  - 连接建立阶段增加空闲超时，并限制重试参数的范围。
  修复
  - 修复 Windows 构建时 Linux 安装脚本被打包为 CRLF 换行的问题。
