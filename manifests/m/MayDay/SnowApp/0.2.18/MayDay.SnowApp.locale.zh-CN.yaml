ReleaseNotes: |-
  改进
  - 流式渲染 CPU 优化：显著降低流式渲染期间主进程与渲染进程的 CPU 占用——Markdown 流式渲染降频至约 10fps（超过 100KB 的超长文本进一步降至 3fps）、流式指标（token 数/耗时）改为每 250ms 合并更新、用户消息栏滚动计算用 rAF 合并、大面毛玻璃移除（仅小元素保留）。
  - 恢复后台节流：移除全局禁用后台定时器节流 / 渲染进程后台化的开关，窗口隐藏或最小化后不再全速运行 rAF 与动画（macOS 上也不再阻止 App Nap）；流式 IPC 事件仍实时到达，后台 AI 会话不受影响。
  - 系统设置读取缓存：Rust 层为系统设置读取新增 200ms TTL 缓存，团队身份轮询、YOLO 模式检查等高频路径不再每次读取都打开数据库连接并解析 schema。
  修复
  - 团队身份轮询死循环：修复团队摘要 hook 中 identity 依赖导致 load 回调重建、每秒触发 7-28 次身份 IPC 的死循环，此前主进程 CPU 持续高位。
