ReleaseNotes: |-
  新功能
  - 消息导航搜索：用户消息导航支持「最新在前 / 最早在前」切换，可模糊搜索并高亮匹配片段、显示时间戳，方向键即可选择，打开时自动定位到当前消息。
  - 消息导航快捷键：Mod+Shift+J 打开或关闭消息导航。
  改进
  - 极简模式复用并缓存编辑差异统计，虚拟列表高度与实际行高对齐，进场动画不再随重挂载重播，会话不再跳动；工具卡只按名称分组，等待操作时不再在分组里进出。
  - 手动新增的 API 档案排到第一行。
  修复
  - Anthropic 助手回合改为按原始顺序保存内容块并原样回放，交错思考（interleaved thinking）的回合不再因重构而失败。
  - 程序化发送后同步输入区的模型选择，之后手动发送不再回落到档案默认模型。
