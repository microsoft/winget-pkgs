ReleaseNotes: |-
  新功能
  - 关闭行为设置：通用设置新增「关闭 Snow App 时」选项，可选每次询问（默认）、直接退出或最小化到托盘。
  - 设备尺寸管理：浏览器设置支持自定义设备显示尺寸列表。
  - 浏览器截图恢复在工具卡片中内联显示，点击可放大查看。
  改进
  - 内置浏览器重构为单 webview 扁平标签模型：右侧面板标签即浏览器标签页，每个标签对应独立实例，面板结构更精简。
  - SSH 目录使用固定 Server 图标，激活状态以行高亮表示。
  修复
  - 回退全局 User-Agent 修改，恢复 Google 登录。
