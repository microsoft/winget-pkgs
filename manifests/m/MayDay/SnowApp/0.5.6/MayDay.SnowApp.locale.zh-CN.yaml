ReleaseNotes: |-
  新功能
  - 子代理运行持久化：派发、恢复、取消与完成统一走持久化运行记录（运行、父任务、请求回执与父收件箱均落库），运行可跨重启恢复并在侧边栏可见，回滚与删除需通过显式门禁。
  - 按次派发执行模式：用户设置只作为默认值，activate/continue 可按次传入 executionMode 覆盖；Workflow 节点只允许同步派发子代理。
  - 多引擎网页搜索：单一搜索引擎改为多选列表，所选引擎并行检索，结果去重后按本地相关性评分重排；新增站点限定、时间范围、语言与单次指定引擎等选项，并加入 Brave、Google、Startpage、Seznam、Yahoo、Yep 引擎。
  - 插件自定义登录面板：OAuth 服务商可声明 panel，在登录弹窗内接管登录界面（不再自动打开浏览器），由新增的 api.oauth 驱动，authorize 变为可选。
  - Repo Wiki 支持 SSH 远程：SSH 远程工作区可通过只读视图（文件树快照、指纹、Git 元信息）生成 Wiki。
  - 浏览器面板快捷键：浏览器面板聚焦时 mod+shift+a 把当前标签页分享给 Agent、mod+shift+e 拾取元素；Ctrl/Cmd+D 改为切换项目浏览器。
  - 输入框右键菜单统一：各窗口（主窗口、宠物窗口、独立面板）的输入框共用同一套右键编辑菜单。
  - 图片描述缩略图灯箱：图片描述工具卡的缩略图可点开大图，Esc、关闭按钮或点击遮罩关闭。
  改进
  - 请求级系统/开发者文本移到请求尾部，使缓存前缀在运行状态通知与子代理唤醒后依然有效；子代理工具集保持稳定，无委派历史时不再注入宿主账本段。
  - 模型选择器恢复为平铺列表（撤销品牌分组）。
  - layered 与 flush 主题的头部与侧边栏间距收紧；图片预览窗口改为纯展示，点击图片芯片查看大图。
  - 手机远控的子代理工具结果与同步/异步语义对齐桌面端契约。
  破坏性变更
  - 插件不再能绑定会话 API 档案：移除 conversations.setApiProfile 与 conversations.create 的 apiProfile 选项（可写动作 212 → 210）。会话档案绑定统一由运行期会话身份/归属校验负责，插件写域不再暴露这条未经校验的第二入口。
  修复
  - 以 ~/ 开头的文件链接先展开家目录再做绝对路径判断，家目录引用恢复解析。
  - 应用日志写入失败不再打断已提交的业务操作（原生同步抛错被捕获）。
  - LSP 优雅关闭顺序调整为 shutdown、exit、wait、kill。
  - 手机端授权/提问卡片默认折叠为 44px 窄条，不再遮挡正文。
