ReleaseNotes: |-
  新功能
  - WorkFlow 持久化与断点续跑：运行状态与画布跨重启持久化，中断或失败后可续跑且进度不丢失；图拓扑校验收敛到 Rust 层统一实现，归档/删除等操作同步清理运行记录，避免幽灵进度。
  - Skill 编辑：Skill 设置面板支持直接编辑 Skill 配置，并加固 GitHub Skill 安装。
  - 思考阶段统计：跨所有提供商流测量思考阶段 token 数与耗时并持久化；ThinkingBlock 重构——实时时长/token 读数、完成自动折叠、平滑跟随滚动。
  - mod+i 聚焦输入框：新增 focusInput 快捷键聚焦聊天输入框。
  改进
  - Agent 消息流新增入场动画与折叠/展开高度过渡。
  - 聊天滚动条自动隐藏，悬停或滚轮时显示。
  - 代码块复制优化，新增复制状态图标。
  - 工作流节点只读工具自动放行，无需逐项授权确认。
  - 侧边栏多选模式排除运行中的会话。
  修复
  - 修复并行会话检查点归属错误，无关文件不再泄漏进当前会话的回滚列表。
  - 修复 Windows 路径大小写导致的检查点清单异常。
  - 修复项目切换往返后运行中会话从列表消失（#118）。
  - 修复滚动到底部时的「跟随到底部」行为与 favicon 重复绑定监听器。
