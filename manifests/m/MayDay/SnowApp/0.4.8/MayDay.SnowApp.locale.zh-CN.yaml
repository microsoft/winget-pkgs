ReleaseNotes: |-
  新功能
  - 插件可写能力：插件运行时新增 api.write——201 个写动作覆盖备忘录、项目记忆、定时任务、图像库相册、会话、项目与分组、系统交互（通知 / 剪贴板 / 打开目录）以及浏览器数据、SSH、远控、配置等域；每个动作需声明对应隐私范围，元数据目录同步展示可写能力与授权状态。
  - 设置搜索：设置侧栏新增搜索框，可检索全部设置项并逐层进入目标标签页、闪烁高亮命中条目；全局搜索移除重复的设置分组。
  - 快捷键增强：新增可搜索的快捷键帮助浮层（默认 mod+/）与按钮内联快捷键徽章；关闭「仅前台生效」的动作改由主进程全局注册，窗口失焦也能触发；新增 mod+shift+y 切换消息时间显示。
  - Horizon 与 Tesseract 主题：两套无边紧凑主题（各含明暗配色），带微交互与标志性头部条纹。
  - 终端字号与路径拖放：终端支持字号调整（设置面板或 Ctrl/Cmd + 滚轮），拖入文件即在光标处插入路径（按 shell 自动加引号转义）。
  - 提问分组卡片：同一批 askUserQuestion 调用合并为一张分组卡片，逐题作答、各自独立状态；手机端同步支持。
  - 消息时间戳：用户消息、AI 回复、思考块与工具卡可按需显示创建时间（时钟图标 + 完整时间悬停提示）。
  改进
  - Markdown 渲染改为块级增量：worker 只在安全边界（代码围栏闭合、$$ 成对、handoff 配对）切块，主线程只重建变化块、尾块原地追加文本，长回复流式渲染不再整段重算。
  - 聊天流式跟随改为内容增长的同帧即时钉底，去掉平滑动画；运行汇总条拆分为独立组件。
  - 面板拖动缩放改写 DOM 变量并在松手后一次性提交状态，拖动期间不再逐帧重渲染界面。
  - 侧栏折叠面板（子代理、Workflow 节点）改为懒加载：收起即卸载，展开先渲染骨架再填充内容。
  - 备忘、项目记忆、定时任务与插件由模态框改为独立懒加载页面。
  - grep-search 增加超时与取消：超时的搜索会终止后台线程并尽快返回。
  - 外发请求尾部保护：Gemini 不接受以模型轮结尾的请求，出站前丢弃无可见文本的模型轮，必要时追加「Continue.」用户轮。
  修复
  - 修复 /clear 命令参数传递错误，以及待发消息状态中空 projectId 的处理。
  - 检查点容错增强：单个文件读取失败不再拖垮整批 diff 与回滚，缺失对象降级跳过，并跳过 Windows 保留设备名。
