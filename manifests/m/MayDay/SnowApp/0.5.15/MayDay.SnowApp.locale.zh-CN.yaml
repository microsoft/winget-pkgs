- 终端
- 聊天
ReleaseNotes: |-
  新功能
  - 提交信息生成提示：提交框中已有的文字会作为提示传给 AI 生成提交信息（可指定语言、语气或作为草稿），桌面与手机端均支持。
  - 插件图标统一：插件图标支持 lucide:名称、http(s) 与 data:image 地址；OAuth 服务商图标缺失时回退到插件列表图标，市场条目从仓库 plugin.json 读取图标（缓存 30 天，离线也能显示）。
  改进
  - 工具插件在项目内默认停用，需显式启用后才注入工具与加载 Skills；插件详情新增可折叠的工具与 Skills 清单。
  - 记忆工具合并为统一的 memory-manage，通过 action 区分操作。
  - 归档列表的表头（搜索与多选工具栏）固定在滚动区域之外。
  - 手机 Git 面板移除左右滑动翻页，改为点击切换。
  修复
  - 弹窗内按 Esc 不再触发中断会话快捷键，且只关闭最上层弹窗。
  - 插件工具卡片不再回退为未本地化的工具名。
