ReleaseNotes: |-
  新功能
  - 终端 GPU（WebGL）渲染：终端新增 GPU 加速渲染，可在设置中的终端面板开关。
  - 用户脚本本地导入：浏览器设置支持从本地文件导入用户脚本，配置值解析容错，异常数据不再导致失效。
  改进
  - 窗口处于后台时计划任务保持运行，不再随窗口状态中断。
  - 内置浏览器 User-Agent 统一为标准桌面 Chrome，移除应用名与 Electron 标识。
  修复
  - 修复数据库恢复流程中的数据丢失隐患，并同步归档表的 schema 列。
  - 内置 workflow 服务器补充显示名映射。
