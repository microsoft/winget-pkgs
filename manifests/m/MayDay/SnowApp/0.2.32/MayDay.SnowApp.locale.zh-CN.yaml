ReleaseNotes: |-
  新功能
  - 文件变更自动刷新：文件查看器监听磁盘变更并自动重新加载；编辑器有未保存修改时改为提示，可选择重新加载或忽略。
  - 代码折叠：文件查看器支持按缩进折叠代码块，折叠处显示隐藏行数，定位到被折叠的行时自动展开。
  - 内置服务说明：MCP 面板与设置列表展示内置服务的描述。
  改进
  - 检查点存储改为分片布局（检查点按日期、对象按内容 id 前缀分片），旧数据在启动时原地整理。
  - 思考块交互简化为收起与全部展开两种状态。
  - 运行摘要的模型图标改用品牌图标。
  - 侧边栏分区折叠与 Git 文件列表的分组/折叠加入平滑动画。
