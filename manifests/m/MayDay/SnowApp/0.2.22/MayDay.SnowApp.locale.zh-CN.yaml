- 终端
- 聊天
ReleaseNotes: |-
  新功能
  - Tampermonkey 兼容用户脚本引擎：内置浏览器支持 Tampermonkey 兼容的用户脚本，浏览器设置页新增「用户脚本」标签，支持列表、启用、编辑器、搜索安装等管理功能。
  - userscripts 配置作用域：config MCP 工具新增 userscripts 作用域，AI 可创建/更新/启停/删除脚本并管理 GM_* 值（支持 sourcePath 与 raw 两种格式）。
  改进
  - 聊天滚动重构：加载历史消息时元素锚定滚动恢复、进出迟滞缓冲避免挂载/卸载振荡、占位符→内容过渡锁定高度防止滚动塌陷，滚动时滚动条瞬态显示。
  - Markdown 渲染器缓存增至 256 项，全块重建时保留滚动位置；视口虚拟化精简。
  修复
  - 修复聊天滚动抖动与冗余布局写入。
  - 修复终端浅色主题样式。
  - 修复禁用用户脚本的竞态（先落库再刷新缓存）；过期异步快照不再覆盖新快照。
