ReleaseNotes: |-
  新功能
  - Computer Use 工具：支持鼠标、键盘与屏幕截图操作，自动检查 macOS 辅助功能与屏幕录制权限；配套 perform-actions 动作链工具，可一次执行多步操作。默认关闭，可在 MCP 设置中启用。
  - 内置浏览器书签栏：支持添加、管理与快速打开书签，并显示网站图标。
  - 设备显示尺寸：内置浏览器可按设备尺寸显示页面。
  - 内置浏览器 Cookie 自动备份，降低登录状态丢失风险。
  修复
  - 修复 macOS 26 上键盘布局 API 在后台线程调用导致的偶发闪退（相关调用统一转发至主队列执行）。
  - 修复并行激活子代理会话时的数据库锁冲突（子会话创建写事务改为串行）。
  - 修复计划任务运行日志的列偏移。
  - 用量趋势图缺失日期补 0，时间轴不再跳过无数据的天。
