ReleaseNotes: |-
  改进
  - Computer Use 截图标记鼠标光标位置并返回其坐标，修正 macOS 光标坐标读取。
  - 图片代理支持磁盘绝对路径，回复中按绝对路径引用的图片可正常显示。
  修复
  - 修复 Chat Completions 下带图片的工具消息破坏工具调用配对导致请求失败的问题：图片改为直接挂载到工具消息，不再插入额外的 user 消息。
