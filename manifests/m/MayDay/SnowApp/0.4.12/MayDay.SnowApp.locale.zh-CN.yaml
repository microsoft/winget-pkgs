ReleaseNotes: |-
  新功能
  - 插件网络请求 api.net.fetch：插件运行时新增外部 HTTP 请求能力，由主进程发出（跟随代理设置、绕过 CORS、不携带 Cookie），返回状态码、响应头与响应体，网络失败经 error 字段返回而不抛异常；ESM 与 iframe 插件均可用，元数据目录新增「网络」子标签页。
  - 隐私范围说明弹窗：插件与脚本的隐私声明改为可点击的琥珀色徽标，点开即「隐私范围」弹窗，逐项说明各 scope 的用途、解锁的元数据域（字段级声明精确到字段）与可写能力，并标出声明位置。
  - 客户端脚本图标：脚本元数据支持 @icon / @iconURL（@icon64 / @icon64URL 作为回退），可填 lucide:图标名、http(s) 地址或 data URI，脚本列表按图标展示。
  改进
  - 洛可可主题的表单弹窗补上同款框饰：描金内框、页眉玫瑰花饰与徽记、页脚饰带。
  - 插件元数据的 Git 身份改由专用仓库身份接口提供（读取仓库 git config 与 origin 远程地址），不再依赖本地团队身份。
  修复
  - 修复 Gemini 模型历史函数调用丢失参数的问题：历史中以顶层 args 保存的 functionCall 能正确还原，签名部分回放时不再用空参数覆盖完整参数（#170）。
