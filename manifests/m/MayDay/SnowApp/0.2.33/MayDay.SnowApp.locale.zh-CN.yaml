ReleaseNotes: |-
  改进
  - 输入区渠道/模型/思考强度/Fast Mode 选择改为内存态统一存储，发送时才落库；切换会话后未发送的选择不再丢失。
  - 思考块进行中显示单行实时预览；内容区收起动画结束后再卸载，兼顾过渡动画与内存释放。
  - 跨项目通知覆盖尚未落库的运行中会话，切走项目后新会话不再从「其他项目」区块消失。
