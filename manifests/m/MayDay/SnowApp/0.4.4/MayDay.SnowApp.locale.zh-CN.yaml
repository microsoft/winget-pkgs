ReleaseNotes: |-
  新功能
  - 插件系统：从本地目录安装插件，为右侧面板扩展自定义面板（同一插件面板复用同一标签页）；插件在隔离 iframe 中运行，安装时列出其声明的权限范围（API 密钥、系统提示词、会话、日志等），支持启用 / 禁用、重读清单、在文件夹中显示与卸载；未安装插件时可直接描述需求，由 AI 读取插件文档完成创建与安装。
  - 决策模型（TypeSafe / Jev）：API 配置新增「决策模型」页，统一管理判定型模型（Base URL 自动 / 自定义、模型名、API Key、启停）。代码库代理审查可选用它逐条判定搜索结果相关性；敏感命令可开启决策模型辅助，命中规则时先由模型判定能否直接执行，并支持托管执行。
  - 应用锁：以 4-8 位 PIN（加盐哈希存储）锁定应用，每次启动与窗口失焦后（可设延迟，也可手动立即锁定）需要验证；绑定谷歌身份验证器后可用 6 位动态码兜底解锁，连续输错有次数限制与冷却。锁定仅遮挡界面，后台会话继续运行。
  - 会话置顶：置顶会话并入会话列表顶部，支持拖拽排序。
  - filesystem-copy 工具：AI 可复制（或剪切）文件的行区间并插入 / 覆盖到目标位置，SSH 远程项目同样可用，聊天与手机端提供对应工具卡片。
  - Responses WebSocket 模式：API 配置新增开关，改用 WebSocket 传输替代 SSE，并在多轮之间复用同一条连接。
  - 其他：右侧面板浏览器标签可右键在系统浏览器中打开；「关于」页新增开源协议、隐私说明与免责声明；API 配置支持删除选中项。
  改进
  - 回滚按检查点链合并：先新建后编辑的文件在回滚时被删除，而不是退回上一版内容。
  - 记忆工具卡片支持展开查看条目摘要。
  - 聊天记录加载新增骨架屏，滚动跟随逻辑重构。
  - 文件变更面板纳入 filesystem-copy 产生的改动。
  移除
  - 移除第三方配置导入（Codex / Claude Code / OpenCode）及对应设置页，原插件市场由新的插件系统取代。
