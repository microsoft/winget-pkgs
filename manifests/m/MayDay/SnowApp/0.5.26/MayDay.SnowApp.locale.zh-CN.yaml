ReleaseNotes: |-
  新功能
  - 项目目录迁移：本地项目菜单改为「迁移」，可选择新文件夹、先预览受影响的数据再确认迁移，并查看或撤销过去的迁移记录。
  - 手机端设置：会话列表底部新增设置入口，可切换工具调用与思考在会话中的呈现方式（经典 / 简洁 / 极简），选择保存在本机。
  - 全局圆角：主题设置新增圆角开关与滑块（0–24px），覆盖当前预设自带的圆角并即时预览；调到 0 即为完全直角。
  - 插件逐轮模型覆盖：conversations.sendMessage 与 conversations.create 支持可选 model、basicModel、thinkingStrength，只作用于当轮请求，不改动 API 档案；create 会回显本轮所用模型。
  改进
  - 侧边栏历史分组标题的顶部内边距收窄。
