ReleaseNotes: |-
  新功能
  - 工作流节点自动压缩：节点 token 达到阈值时自动压缩上下文并继续运行。
  - 右侧面板全屏与浮动卡片：拖动右侧面板超过最大宽度并悬停 500ms 显示遮罩提示，松手进入全屏；全屏聊天可浮动为卡片，浮动头部复用 TopBar 的 TODO 与代码库同步指示器；工作流画布删除（右键/Backspace）统一改为二次确认，确认后显示撤销提示条（Ctrl/Cmd+Z 恢复，10 秒后淡出）；工作流连线增加方向箭头与加粗样式；标签页支持中键快速关闭（Git 固定标签除外）；空聊天快捷卡片与输入框 ModelSelector 随容器宽度渐进收缩，极窄时不再溢出。
  - 项目合集成员支持拖拽调整顺序。
  - 备忘录列表支持最新/最旧排序切换。
  修复
  - 修复流式输出期间滚动位移误判导致「钉底跟随」被静默关闭的问题，窗口重新可见时自动恢复钉底。
  - 修复右侧面板全屏展开/收起过渡时右缘的临时窗口跳动。
  - 修复空聊天快捷卡片跨断点收窄时的错位与变形。
