ReleaseNotes: |-
  新功能
  - 后台异步上下文压缩：上下文压缩改为在后台执行，不再阻塞代理循环；压缩期间产生的消息顺延到压缩点之后，尾部任务消息与进行中的工具结果一并纳入摘要。新增异步压缩配置文件开关，自动压缩最低阈值提高到 30%。
  - 记忆作用域切换：已有记忆可在项目记忆与跨项目全局记忆之间迁移，项目记忆编辑器提供作用域选择器，会话记忆面板提供快捷迁移操作。
  - Anthropic 快速模式：开启快速模式后，Anthropic 请求携带 speed: fast 与 fast-mode-2026-02-01 beta 头；桌面模型选择器、移动端模型面板与 API 设置均可切换，Anthropic 仅提供关闭 / 快速两档。
  - filesystem-copy 删除模式：mode=delete 可直接删除源文件的行范围，不再粘贴到任何位置。
  改进
  - 极简模式下，连续的同名工具调用折叠为一组，并显示调用次数。
  - 思考强度与快速模式改为独立图标按钮，点击直接展开子菜单。
  - 脚本未声明图标时，脚本列表复用插件市场入口图标。
