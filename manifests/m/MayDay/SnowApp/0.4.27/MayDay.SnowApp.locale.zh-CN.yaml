ReleaseNotes: |-
  新功能
  - 远程文件传输：SSH 远程文件支持上传与下载，提供传输面板并处理同名冲突；远程文件预览新增刷新按钮。
  - 资源管理器上传：本地文件可上传到任意文件夹。
  - HTML 实时预览：新增 HTML 渲染工具，可在会话内实时预览页面。
  - 多图背景轮播：主题背景支持多张图片轮播，切换时淡入淡出并记住当前图片。
  - 会话控制扩展：应用控制新增会话的创建、发送、激活与中止。
  - 记忆批量管理：备忘录支持 AI 删除记忆及批量操作。
  - 用户脚本请求改写：对话框请求代理层支持用户脚本改写请求与响应。
  改进
  - 滚动到底部按钮点击时增加动画反馈；侧边栏指南改为带提示的纯图标按钮。
  - 内置桌宠不可安装，也不可覆盖。
  - OAuth 订阅身份请求头迁移到请求头方案中统一管理。
  修复
  - 修复 SSH 仓库在变更区打开文件时误按本地路径读取的问题。
  - 修复新建会话时设置侧边栏内容未收起的问题。
