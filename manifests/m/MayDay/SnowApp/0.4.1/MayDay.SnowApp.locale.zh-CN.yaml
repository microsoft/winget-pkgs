ReleaseNotes: |-
  新功能
  - 代码库同步取消：进行中的代码库增量同步可取消——关闭开关或切换项目时真正停止 Rust 中运行的嵌入任务。
  - 项目 MCP 模式指示：项目 MCP 面板为禁用模式（WorkFlow / 代码库索引 / Plan）显示状态指示，说明工具为何未加入模型请求。
  - 手机端压缩可视化：手机远控页面新增上下文压缩进度与摘要卡片。
  改进
  - 远控桥接移除字段截断，向手机端发送完整工具参数与结果。
  - image-describe 在主模型支持视觉时优先使用主模型。
  - 用户消息栏包含上下文压缩消息。
  - 侧边栏重名目录消歧。
  修复
  - 修复免确认白名单中历史工具名（terminal-execute）静默失配的问题。
  - MCP 服务器配置读取时敏感字段（env/headers）脱敏。
  - 修复工作区重定位后「Project MCP scope setting identity does not match」报错（读取时自愈回写）。
  - 修复 https MCP 服务器连接失败（rmcp 启用 TLS）。
  - 修复输入区未就绪时远控输入配置变更失败的问题。
  - 修复 image-describe 工具注册名的重复前缀。
