ReleaseNotes: |-
  新功能
  - 窗口置顶按钮：TopBar 新增图钉按钮，一键切换窗口置顶，置顶时使用最高层级，不被其他应用遮挡。
  - 侧边栏条目改为紧凑列表，并调整列表项图标的默认颜色。
  - 右侧面板标签列表改用自定义浮动滚动条。
  - TODO 工具卡片新增打开 TODO 面板的入口。
  改进
  - todo-manage 的会话 ID 改由分发层自动注入，不再依赖模型传参，会话隔离更可靠。
  - 改进 Git 推送/拉取的输出捕获，失败且无详细输出时给出网络与仓库配置提示。
