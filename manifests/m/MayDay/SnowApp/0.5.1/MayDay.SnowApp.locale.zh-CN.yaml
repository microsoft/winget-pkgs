ReleaseNotes: |-
  新功能
  - 模型连接测试：决策、嵌入与重排模型页面新增「测试连接」，并展示连接状态列（耗时、HTTP 状态、向量维度），结果跨重启保留。
  - 工具卡片简洁风格：工具调用可切换为紧凑的 chips 风格，Ctrl/Cmd+Shift+U 切换并记住选择，快捷键帮助中同步列出。
  - 浏览器原生 UA：内置浏览器改用与本地真实浏览器版本对齐的标准 Chrome/Edge UA，不再带 Electron 标识。
  改进
  - 模型调用失败不再静默：重排失败回退向量排序，决策模型不可用时说明为何改用 LLM 审查或人工确认。
  - 代码库索引保留每个项目最近一次失败记录；系统日志面板支持按模块筛选。
  - 数据与图片库迁移改为不可关闭的进度弹窗，显示目标路径，并支持取消回滚。
  - 复制用户消息会保留应用内的 chip，粘贴外部纯文本则保持原样。
  - 移除「超立方」预设（已选中的旧配置平滑回退到「无界」）；「无界」改用翡翠绿主色与中性灰阶，浅色底色调整为暖瓷白。
  修复
  - 修复平铺布局顶栏分栏与分隔线的问题。
  - 去掉浏览器 MCP 工具 schema 中的 anyOf/oneOf 组合约束，避免严格渠道拒绝。
