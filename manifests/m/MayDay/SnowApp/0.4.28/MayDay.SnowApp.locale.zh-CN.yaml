ReleaseNotes: |-
  新功能
  - 工具调用自动纠错：工具调用失败时由基础模型给出修正参数并重试同一次调用（最多 3 次，每次重新授权），修正过程以可展开的纠错树呈现，重启后仍可还原；默认开启，可在加号菜单切换。
  - ROLE 规则覆盖内置提示词：全局与项目 ROLE 编辑器新增「覆盖内置提示词」开关，开启后规则整体替换内置模板（Plan / Goal / WorkFlow / WorkTree 模式仍保留各自引导）。
  - 开发者工具入口：加号菜单新增「开发者工具」，可直接打开当前窗口的 DevTools。
  - 搜索站点图标：网页搜索结果展示各站点图标。
  - 快速设为默认配置：模型下拉列表中可通过图钉按钮将任意 API 档案设为默认启用。
  改进
  - 待发送消息改为紧贴输入框上沿的标签式卡片。
  - 右键菜单、下拉框增加分组分隔线，提及弹窗的键鼠交互更顺畅。
  - 全局禁用的 MCP 工具在项目层级以只读方式展示；图像生成执行模式改用 CustomSelect。
  修复
  - 修复大图附件导致的流式超时：图片自动降采样到 1568px，首字节等待窗口随请求体大小缩放（默认空闲超时改为 60 秒）。
  - 修复 OAuth 模型列表拉取未像 API Key 渠道那样重试的问题。
