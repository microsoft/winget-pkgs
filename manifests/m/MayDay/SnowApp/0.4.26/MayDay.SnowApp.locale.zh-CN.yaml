ReleaseNotes: |-
  新功能
  - 图像生成异步任务：生成批次与任务持久化存储，异步模式立即返回回执，全部任务结束后以一条批次摘要唤醒会话；新增执行模式设置（自动 / 同步 / 异步），Rust 端实现真实的上游并发限制。
  - 远控 SSH2 隧道：手机远控支持可选的 SSH2 隧道连接。
  - 插件网络授权：插件外发请求需声明 network 隐私授权（未声明时市场给出警告），并可在渲染端直接建立 WebSocket / HTTP 连接。
  - 插件会话操作：插件可向会话发送用户消息、创建空会话并切换激活到指定会话。
  - 视觉请求遵循会话：识图与绘图读图改按会话解析 API 文档、自定义请求头与系统提示词，与主流程保持一致。
  - 自定义系统提示词全模块生效：用户配置的系统提示词集成到各 API 模块。
  - 独立窗口细节：独立窗口记住上次大小；关闭独立面板最后一个标签页时新增二次确认。
  修复
  - 修复保存 OAuth 档案时旧快照覆盖库内最新令牌的问题。
  - 修复本地工作区参数中 ~ 主目录未展开的问题。
  - 修复从资源管理器打开终端时 SSH 路径缺少主机前缀的问题。
  - 清理 Git 工作树中的无效与孤立记录。
