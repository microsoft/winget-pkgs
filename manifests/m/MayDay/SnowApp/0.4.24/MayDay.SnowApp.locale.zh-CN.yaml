ReleaseNotes: |-
  新功能
  - 任务管理器性能面板：进程、性能趋势、LSP 服务与监控告警分为标签页，提供 60 秒趋势，并可按会话精确停止或重启 LSP 服务。
  - 插件工具调用渲染器：ESM 插件可为匹配的工具调用提供自定义卡片，渲染失败时回落到通用卡片；Anysearch 桌面端卡片改由其独立插件提供。
  - 面板 MCP 访问提示条：浏览器与终端面板在 MCP 未开启时显示提示条，支持跳转开启；「不再提示」为应用级全局设置。
  - 桌宠动画作为主题背景：主题背景可直接使用桌宠动画。
  - 插件二进制响应：api.net.fetch 支持 responseType: "arraybuffer"，以 base64 返回原始字节，由插件自行解码。
  改进
  - 参数与目标均未变化的重复只读调用直接复用上次结果；仅连续重复 3 次才判定为死循环并中止。
  - 工具授权与提问卡片支持 Ctrl/Cmd+Enter 快速提交；Bash 工具卡片可向交互式程序直接发送回车。
  - LSP 会话复用符合条件的 gopls 工作区，并定期回收空闲会话，受会话数与冷启动预算约束。
  - 插件输入栏操作在悬浮面板切换、会话切换时仍继续运行，草稿在后台会话中同样持久化。
  - 插件元数据新增 processes（任务管理器进程树）域，app 域的 processMemoryBytes 已移除。
  - 紧凑主题细化悬停、选中、禁用与键盘焦点反馈；顶部栏适配 macOS 原生全屏布局。
  修复
  - 修复 Anthropic 订阅登录端点、请求头与思维链显示问题。
  - 修复每日用量趋势图悬停位置与选中点错位的问题。
  - 修复后台浏览器标签页截图卡住的问题。
