ReleaseNotes: |-
  新功能
  - 本地数据清理：设置新增「数据清理」，按分类扫描本地占用（检查点快照、上传附件、图片库、主题背景图、宠物资源、浏览器状态、应用日志），可按时间档位（7 / 15 / 30 / 90 天或全部时间）勾选删除；扫描与删除均在 Rust 侧执行，不阻塞界面。
  - 回滚目标列表：双击 ESC 打开历史消息列表，可直接选择回滚到某一轮（含上下文压缩摘要行），超出已加载分页窗口的旧目标会按需加载。
  改进
  - 生成提交信息时 Git 输入框转为只读并跟随最新流式分片滚动，高度改由 CSS 随内容自适应。
  - 会话归档列表下隐藏导入按钮。
  修复
  - 修复弹窗内按 ESC 冒泡关闭外层弹窗的问题（弹窗改为逐个显式开启 ESC 关闭）。
  - 修复工具 schema 缺少 required 时请求被 400 拒绝（如 browser-create）。
  - 修复 Linux AppImage 更新 404：打包时固定 AppImage 文件名，并在发布前校验更新清单与打包产物一致。
