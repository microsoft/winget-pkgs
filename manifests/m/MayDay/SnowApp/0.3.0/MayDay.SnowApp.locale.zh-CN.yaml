ReleaseNotes: |-
  新功能
  - 品牌图标：模型选择器与搜索引擎选择器的选项和标签增加品牌图标。
  改进
  - 优化工具结果节流与思考块渲染性能。
  - 禁止删除存在运行中会话的项目。
  - 会话运行期间锁定 plus 菜单的模式开关，防止误切换。
  - 记忆管理弹窗增加删除入口。
  - 流式光标扩充旋转类图标选项。
  修复
  - 修复书签文件夹菜单可能超出视口的问题：空间不足时自动翻转方向并限高，窗口缩放时跟随重定位。
