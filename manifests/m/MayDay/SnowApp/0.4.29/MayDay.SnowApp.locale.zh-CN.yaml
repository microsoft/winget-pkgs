ReleaseNotes: |-
  新功能
  - 可点击文件路径：聊天内容中的文件路径可直接点击，在右侧面板打开本地或 SSH 远程文件。
  - 隔离 HTML 预览：HTML 代码块与文件工件在隔离环境中预览，新增缩放控制、共用语法高亮与响应式面板布局。
  - 流式光标图片 / 画布类型：流式指示器除圆点与图标外，支持任意图片（含 GIF）与 JavaScript Canvas 绘图脚本。
  - 定时任务关闭应用后执行：可由系统计划程序在后台唤起应用执行，错过的任务在下次启动时补跑。
  - 隐私脱敏增强：支持逐条关闭内置规则与自定义正则脱敏规则，并新增数据库连接串脱敏规则。
  - 残留数据清理：可扫描并清理已移除项目的会话、归档、快照、记忆等残留数据。
  - 开机自启：通用设置新增开机自动启动开关。
  改进
  - 手机远控新增 /api/live 实时通道，增量推送状态。
  - 发给模型的历史请求自动瘦身：图片超出预算时省略最旧的，TODO 结果去掉时间戳并折叠已完成项（本地数据不变）。
  - 浏览器 MCP 的契约与调试器生命周期更稳健。
  - 自定义窗口框架扩展到 Linux。
  - 删除或归档的会话增加墓碑标记，防止晚到的持久化将其重建。
  修复
  - 修复文件提及弹窗的事件穿透，以及模型名换行显示不完整的问题。
  - 修复运行计时起点丢失的问题。
  - 修复图像生成 b64_json 为空时未回退到 URL 的问题。
  - 修复 API 配置列表为空时自动写入默认配置的问题。
