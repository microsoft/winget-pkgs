ReleaseNotes: |-
  新功能
  - 洛可可玫瑰主题：新增洛可可风格主题预设（明暗两套），卷草纹、饰带、徽记等装饰素材与衬线展示字体，并配套专属像素 logo 动画。
  - Diff 行内评论：可在 diff 中按行评论（旧 / 新代码侧），支持编辑、删除、复制、单条或批量发送到输入框、一键清空；行内容变化标记「行内容已变化」，未匹配评论集中提示，超大 diff 自动停用评论；评论按项目 + 文件持久化。
  - Diff 视图偏好：单列 / 双列 / 自动换行可切换，右侧面板与会话内 diff 共享并记住选择。
  - 验证器解锁手机远控：绑定谷歌身份验证器后，手机在局域网 / 公网远控页可用 6 位动态码代替配对令牌解锁。
  - 项目网格拖拽分组：项目网格视图支持把项目拖入合集或拖回未分组区域，直接在视图内整理分组。
  改进
  - LSP 安装状态校正改为首次进入 LSP 设置探测时执行一次，启动不再探测子进程；种子服务器按 PATH 中是否可执行决定默认启用，Windows 下探测不再弹控制台窗口。
  - 会话内 diff 的视图切换按钮固定在可视区右上角，横向滚动不再跟随移动。
  - 技能工具卡片结构化展示技能 ID、名称、来源、路径、允许工具与技能内容，并显示加载状态。
