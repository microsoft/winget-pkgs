ReleaseNotes: |-
  新功能
  - 侧边栏会话悬停卡片：悬停会话显示完整标题、置顶状态、相对时间与所属项目，取代原来的标题跑马灯；任何弹窗打开时卡片自动隐藏。运行中的会话标题带流光效果，侧边栏收起时徽标仍保持可见。
  - 输入框高度可调：拖动输入框上沿把手调整高度，继续上拖可展开为大屏输入（下拉把手或按 Esc 收起）。
  - 结构化只读文件预览：表格文件（calamine）与 SQLite 数据库按真实结构预览——窗口化行数据、字段类型与合并区域；PPTX 按放映顺序提取标题与文本块，DOCX 由原始字节交给渲染层呈现；无法预览时给出本地化原因，并提供「用系统应用打开」「在文件夹中显示」等出口，同时保留「抽取文本」视图入口。
  - 敏感命令拒绝转人工确认：决策模型托管开启时可勾选「拒绝时仍让我确认」——判定允许仍直接放行，判定拒绝则转为人工确认；确认卡片标注你正在覆盖模型判定，判定结果写入系统日志。
  改进
  - WorkFlow 手动编排直达执行：编排器发送后不再经 AI 转交，直接写入用户消息与 workflow-workflow-generate 工具调用（免授权弹窗），会话中立即出现工作流卡片，点「确认执行」即可运行；执行结果照常回传 AI 继续总结或续跑。用户消息改为折叠的 WorkFlow 标签（流程名 + 节点 / 连线数，悬停查看节点清单）加备注，不再显示指令文本与 JSON 载荷；会话标题在工作流执行后的真实回复完成时生成，摘要输入已折叠 chip 标签，不再把 base64 载荷喂给标题模型。回滚编排提交的消息时不再往输入框塞入无法识别的标签，而是重新打开编排器并按图快照还原画布、流程名与备注。
  修复
  - 修复 Responses 渠道「默认 / 关闭」档位不生效：后端对 config_json 深合并会保留省略键的旧值，现改为显式写入 verbosity 与 fast mode。
