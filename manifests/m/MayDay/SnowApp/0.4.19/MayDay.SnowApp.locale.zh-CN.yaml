ReleaseNotes: |-
  新功能
  - ChatGPT 订阅登录：OAuth 登录新增 ChatGPT（订阅计划）服务商——走官方 Sign in with ChatGPT 流程，浏览器完成授权后本地回调自动返回，渠道以订阅额度调用官方 Responses API。
  - Goal 模式自动续跑：Goal 模式开启时，若本轮停止仍有未完成的待办，自动向 AI 追发续跑提示（列出未完成项与剩余 Token 预算），直到全部待办完成才结束。
  改进
  - 三语言（简中 / 繁中 / 英文）本地化全面落地：渲染层新增共享翻译出口 tGlobal，覆盖模块级代码、注入脚本与事件回调；聊天区、工具卡片与内置工具徽标、右侧面板与侧边栏、团队协作模块、手机远控以及主进程原生 UI（托盘菜单、下载对话框与通知、webview 右键菜单、宠物菜单）全部接入词条；日期时间格式跟随 App 语言，切换语言后托盘与移动端文案即时更新。
  修复
  - 修复空响应（上游正常收尾但零输出）无迹可寻：终态判定与落库标记（empty_response / retry_exhausted）、每次重试的原因日志、重试次数与上游错误写入消息并在重载后回填，回复显示统一的「重试已耗尽」提示卡，不再渲染空白气泡。
  - 修复用户主动取消被误记为上游空响应：取消与失败保留各自终态，并新增迁移清理历史脏数据。
  - 修复重试元数据新增列导致的消息查询列索引错位（历史会话分页加载失败、打开后内容区空白），归档库同步补列。
  - 修复发送新提示词后历史回答的 Markdown 原文 / 复制 / 派生分支按钮集体消失，改为仅屏蔽当前运行的最后一条消息。
  - 修复待发送模式标签被截断与图片缩略图变形。
