ReleaseNotes: |-
  新功能
  - 会话删除显示真实进度：批量删除会话时由原生存储层按实际完成的工作量推送进度（准备、删除图片、删除会话数据、清理附件四个阶段），不再只显示转圈；删除确认弹窗、多选工具栏与侧边栏会话行（列表与树视图）均显示进度。
  改进
  - OAuth 订阅渠道的模型列表与配额查询改用档案绑定的请求头方案，不再写死身份请求头：方案中的值优先，缺失的请求头用默认值补齐，令牌与账号 ID 始终取自当前凭据；客户端版本从方案的 User-Agent 解析，解析不到时回退内置版本。
  - Codex 默认模型更新为 gpt-6-luna，Antigravity 默认模型更新为 gemini-3.1-pro-high；ChatGPT 模型列表解析兼容 data 数组与其他 id 字段名。
  - 快速滚动时用户消息导航暂停可见区高亮计算、滚动停下后再统一刷新，并推迟加载更早的消息，滚动更流畅。
  修复
  - 修复长会话滚到顶部后翻不出更早消息的问题：向前翻页的游标保证每轮严格推进，卡住的在途标志会被识别并复位，翻页完成信号丢失时也能自愈。
  - 修复流式内容增长过渡被打断后视口停留在旧高度、裁掉内容并压缩滚动区间的问题。
