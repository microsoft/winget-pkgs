Description: Snow App is a developer-focused desktop application that integrates AI-powered chat, terminal emulation, SSH remote management, Git tooling, and a built-in browser panel into a single unified workspace. It leverages a Rust native module for performance-critical operations such as SQLite storage, AI streaming, file watching, and HTTP requests. Additional capabilities include MCP support, AI image generation, a skills system, hooks, sub-agents, codebase semantic search, and AI-driven terminal sessions.
