ReleaseNotes: |-
  新功能
  - Token 限定的代码库分块：新增可配置的 token 上限，防止代码库分块时上下文过大冲击模型。
  改进
  - 隐私遮蔽与 Mermaid 序列化：增强隐私遮蔽覆盖，更可靠地保护敏感数据；Mermaid 图表现已正确序列化，渲染一致。
  - 代码库开关图标区分：代码库设置开关使用不同图标，视觉区分更清晰。
  - 绘图参数下拉框：将绘图参数下拉框移入自定义弹出层，改善交互体验与布局一致性。
  修复
  - 子代理回滚防护：修复子代理会话中可能触发回滚操作的问题，防止意外状态变更。
  - 首条消息回滚恢复：修复首条消息回滚后会话输入配置未正确恢复的问题。
