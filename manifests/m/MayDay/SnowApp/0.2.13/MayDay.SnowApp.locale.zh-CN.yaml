ReleaseNotes: |-
  新功能
  - 项目集合：新增项目集合功能，支持拖拽操作。
  改进
  - 交互状态管理：增强推理文本处理与状态管理，每次循环重置迭代流式指标。
  - 模糊编辑自动补缩进：模糊编辑搜索与替换内容自动补齐缺失缩进。
  - UI 优化：新建会话视图挂载时同步草稿内容并聚焦输入框；工具栏分隔符合并；右面板最大比例调大；表单对话框输入对齐修复。
  修复
  - Chip 插入位置：修复外部失焦后 chip 插入位置错误。
  - Mermaid 代码块格式：移除 Mermaid 示例中多余的代码块标签。
  - 图片生成错误信息：修复图片生成配置检查错误信息中缺失的 format!()。
