ReleaseNotes: |-
  What's new in 0.1.171
  Bots
  - Bots check back later: a bot can set itself a reminder to look at something again, instead of waiting in the chat.
  - Hand-offs show who is working on what, so you can see the status of work passed between bots.
  - A bot working on a cloud computer keeps its engine between turns, so its next reply starts sooner.
  Spending
  - Usage charts in Spending, shown in Simple mode too.
  Sharing
  - Share and import polish: the product name, plain taglines, folder pictures, and Share in Advanced mode.
  Speed
  - Faster replies: Codex turns stay warm, Claude starts ahead of your message, and threads and new bots load lighter.
  - Smoother chat while a reply streams: saved rows hold still, rooms draw one bubble per update, and long lists and tables no longer slow down as they grow.
  - Switching bots shows the newest messages first.
  - Long chats stay light however far you scroll back.
  Fixes
  - The CLI login card shows above Settings and other dialogs.
  - Portuguese (Brazil): the usage charts are translated.
