ReleaseNotes: |-
  What's new in 0.1.151
  Claude Fable 5.2
  - Fable 5.2 is in the model picker. Choose it for any Claude bot. It has a 1M-token context and is cheaper than Fable 5.1.
  One simple app
  - Simple is now the only mode. Everything you use every day is in one place, with fewer settings to look through. Bot sharing as a preset, your organization's shared skills, and where an installed bot came from are all in Simple now.
  Your secrets, where bots can use them
  - A Vault page. See and manage what's saved in one place. Secret and sign-in cards offer Use a saved one, so you don't paste the same thing twice.
  - 1Password secrets by name. Link a password manager, and a bot can use a secret from a vault it's allowed to read, without the value being saved or shown.
  Small things that help
  - Folder links open in Finder or Explorer. Click a folder linked in a chat on the desktop app and it opens in your file manager.
  - Connected apps come back on a fresh install. Connect the same Composio project key on a personal install and your earlier apps return, without connecting each one again. Team Clouds always start fresh.
  - Preview Markdown attachments. See them formatted, or switch to the raw text.
  - Edit a bot's memory as text. If it changed while you were editing, you're told before anything is overwritten.
  - Webhook reports get their own chat. On desktop and self-hosted, webhook and app-event results go to a "Results" chat instead of piling into your latest conversation.
  - Dreams only save what you said. A saved fact now has to quote you, and its numbers, paths and links have to come from that quote.
  - Linux servers find a browser. They use a compatible installed browser, or download Chrome when needed.
  - Reset saved keys. If the app can't read its saved keys at launch, Connected apps offers a reset. The old file is set aside, not deleted.
  Fixes
  - A chat can't get stuck on "Working". Answering Allow on a "use your computer" card could leave a chat marked busy with nothing running, and Stop couldn't clear it. Stop now always frees a chat that nothing is running in, and stuck chats free themselves.
  - Computer control recovers by itself. On macOS 26, a keyboard shortcut could crash the helper that controls your computer, and the bot's tools disappeared until you restarted the app. The helper is updated on macOS and Windows and now restarts itself, and the tools come back on their own.
  - Moving to My Cloud only moves this computer's own workspace. The move used to carry whichever local environment was open at the time, and could finish without your bots.
  - Your Cloud can change address without confusing your computer. The desktop app now recognises its Cloud by identity, so it stays connected if the Cloud moves.
