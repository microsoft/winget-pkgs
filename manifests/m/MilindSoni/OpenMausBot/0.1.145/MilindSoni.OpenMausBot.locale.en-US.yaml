ReleaseNotes: |-
  Highlights
  - Phone connection: when you set a phone to "Wi-Fi and Tailscale only" (or back), the phone hears about it straight away inside its encrypted connection, so it shows the right status instead of "asleep or offline". A phone that never finishes pairing is cleaned up after 5 minutes. (#4695)
  - Email sends with any provider, and says why when it can't. (#4696)
  - OpenCode: one thread per folder in a shared process, fixing the mid-turn "capability has expired" error; the model list refreshes on its own. (#4698, #4699, #4706)
  - Chat engine mounts every tool of an MCP server, within each provider's real tool limit. (#4701)
  - Cloud computer: a failed start tells the bot why, and starts wait long enough. (#4709)
  - Voice notes are kept on every turn ending, and files a thread parked are delivered when its turn settles. (#4700, #4711)
  - Rooms can show pages, apps and widgets, view-only. (#4612)
  - Four states the app could get stuck in are fixed. (#4648)
  What's Changed
  Other changes
  - A sign-in the app sees only in a status read ends the engine's signed-out hold by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4681
  - My Cloud reaches MCP servers on the person's lent Mac or PC by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4640
  - Own server: the installer upgrades Debian 12's old Docker and adds AppArmor's tools itself by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4622
  - Own server: the home's secrets in a read-only file, and CAP_SYS_ADMIN only for the hidepid remount by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4589
  - Fix four states the app could get stuck in by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4648
  - Antigravity sign-in on a Cloud: deliver a pasted redirect inside the bot box by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4678
  - Pages, apps and widgets in rooms, view-only by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4612
  - Email: sending works with any provider, and says why when it doesn't by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4696
  - OpenCode: the model list refreshes on its own, on OpenCode 2 too, and from Venice's own list by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4698
  - Chat engine: mount every tool of an MCP server, and use each provider's real tool limit by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4701
  - OpenCode: one thread per folder in a shared process (fixes mid-turn "capability has expired") by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4699
  - Phones hear a routes change inside their session before the relay acts by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4695
  - Keep recorded voice notes on every turn ending; speak how failed turns ended by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4700
  - OpenCode 1: discovery no longer leaves the catalog lock held, so a refresh gets past it by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4706
  - Cloud computer: a failed start tells the bot why, and starts wait long enough by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4709
  - Land every file a thread parked when its turn settles; log where voice notes park by @milind-soni in https://github.com/milind-soni/OpenMausBot/pull/4711
  - chore(release): bump version to 0.1.145 by @github-actions[bot] in https://github.com/milind-soni/OpenMausBot/pull/4708
