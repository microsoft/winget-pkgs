ReleaseNotes: |-
  What's new in 0.1.186
  Apps
  - Four sample apps to try: Ledger, Cohorts, Corridor and Rowfall are in your apps list. Each is marked Sample and can be removed for good.
  - Add to Desktop: put a saved app on your Desktop from its menu.
  - Fixed: the menu on an app card was cut off.
  Bots and pages
  - What's new shows once more, with new slides for Apps and for publishing your bots, then the Cloud and Team. If you already have a Cloud or a team, you see what changed for you.
  - Publish a bot from its ⋯ menu. Publish now opens its choices right there: Publish to community, Your GitHub repo, your team's templates, Save folder or Download. The template is made at once, with no message to the bot first.
  - Shared templates leave out switched-off skills, and list them under Left out.
  - In a room, a bot the first answer @mentions can save its own skill.
  - A file open beside a conversation comes back when you return to that conversation.
  This computer and My Cloud
  - My Cloud's bots open right here. Clicking a bot that lives on My Cloud opens its chat in the same window. You can read, send, stop, start a new conversation and open the files it sent. Its settings and model are still changed on My Cloud's page, one click away in the bot's menu.
  - My Cloud's bots get their own section in the sidebar when your bots are shown together. Drag them into any order or into any department, and they stay where you put them.
  - Lighter on the network in the background. With the window hidden or minimised, the app checks in with your MausBot account less often and backs off if the service is busy.
  Sidebar and menus
  - The + menu is no longer cut by a dark band when the sidebar list is scrolled.
  - A department's ⋯ menu is shorter and clearer: Add bots, Rename department, Settings for all bots…, Pause, Mark all as read, Share and Delete. Its icons no longer disappear next to long labels, and Move up / Move down are only on the phone, where you can't drag.
  - Department order is the same on every device for owners and admins.
  Signing in
  - Signing an AI in on a Cloud is more dependable.
    - A sign-in that's refused or cut short now says why and lets you start again straight away, instead of sitting on "Waiting…".
    - Pasting the code Claude emails you now says to use the longer code from Claude's page instead.
    - ChatGPT shows the "turn on device code sign-in" step up front and again after a refusal.
  - The browser sign-in names the right AI.
  - The Devices check says where to sign in for the relay, and that it is separate from Your account.
  - Saved logins fill more sign-in pages, such as addresses ending in /login.html.
  Models and providers
  - OpenAI-compatible models:
    - A reply cut at the output limit is continued and shown as one message, instead of failing.
    - A stream the provider cuts is retried, also after earlier tool steps.
    - Two conversations switching the same model's route at once no longer fail.
    - An added server at its own address keeps its own models.
  - Text-only models (such as Z.ai GLM): an image in the conversation no longer makes every later message fail.
  - Claude:
    - An older Claude CLI starts a fresh session when the bot's instructions change.
    - Claude Opus 5.5 (1M) through a gateway now uses its full 1M context.
  - Codex:
    - A conversation nearing the provider's instruction limit moves to a fresh session.
    - The model list is read once more before falling back to the built-in list.
    - The update card updates the copy the app actually runs.
  - Cursor: no longer clears its own sign-in when a session starts, and keeps the full model list on a slow start.
  - Grok: a provider's brief throttle reads as a rate limit, not the plan's quota.
  - Devin: works with an API key.
  - DeepSeek Harness: found again in the Windows desktop app.
  - Gemini and Antigravity: compacted tool lists keep every list field's item type.
  - MCP:
    - A server whose start check only timed out stays on, unless that happens three times in a row.
    - Servers that can't sign in apps say why on the Sign in card.
  Lending this computer
  - Windows: lend the whole C:\ drive, and allow edits on your whole home folder, each after a clear warning. Hidden files, Library, AppData and the app's own data stay out of reach.
  - A server's own Settings page has "Choose what it can use".
  Self-hosted servers
  - A server you host yourself can take its licence from a file. It picks up a new or renewed licence within a minute or two with no restart, and keeps working for 14 days past a licence's end date before paid features switch off.
  Fixes
  - Chief:
    - A Chief that retries its own failed request is woken with the result.
    - Retrying a busy teammate's thread now waits in that thread's queue instead of failing.
  - Backup AIs: bot settings refuse a backup AI that could never take over the bot's work.
  - Typing stop: "stop @Todo" in a room no longer stops the bot you're talking to.
  - Routines: a scheduled run waits while an earlier run of the same routine is still working.
  - Team backups: keep cron and limit-reset routines.
  - Goal runs: ask the coordinator again when its reply is malformed.
  - Results: a result the store couldn't save is kept and retried.
  - Windows: helper windows no longer flash a console.
  - Safety check: shell commands are read more strictly.
  - Titles: written in the conversation's language.
  - Inbox: opens faster.
  - Linked files outside a bot's folder: a file link to one can be opened, except hidden files, key and credential files, the Keychain and browser profiles.
