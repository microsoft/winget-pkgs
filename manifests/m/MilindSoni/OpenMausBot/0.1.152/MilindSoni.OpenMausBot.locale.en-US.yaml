ReleaseNotes: |-
  What's new in 0.1.152
  Advanced mode is back
  - Choose Simple or Advanced again. The switch is back in the app. If you were on Advanced before 0.1.151, you're put back on it.
  Starter: as many bots as you like
  - No more stopping at 5 bots on Starter. Create any number; 5 stay awake at a time and 2 work at once, as the plan page says. A bot made past the five starts paused, and one tap swaps it in for the one you use least. Nothing you're using is ever paused to make room.
  ModelGo
  - ModelGo is a new AI provider. Add a ModelGo API key in Settings and pick from the models your key offers. ModelGo sponsors MausBot, and you'll see a one-time card about it.
  Teams
  - Each person's own view. On a team, unread marks, notifications and bot order are yours alone.
  - See who's here. See who is online and who has a shared chat open.
  - Connection health for admins. A Team Cloud tells its admins how each connection is really doing.
  Your computer and your Cloud
  - See what's keeping this computer from your Cloud. The app now says what is in the way instead of only failing to connect.
  - Lent computers survive a Cloud waking up. Your Cloud waits for them to come back, and work handed on from your own line keeps the computer you lent.
  - Phone & devices explains an ended secure link. If an older phone app's link has ended, the desktop says why and what to do: update the phone app and pair again.
  Small things that help
  - Ollama shows as Ollama. Its own mark, the models you've pulled, and a plain reason when it can't answer.
  - Memory lock notice. You're told the moment a bot's memory locks, with an Allow card.
  - MCP sign-ins. The app says which MCP server needs a sign-in, and Test no longer passes when every call is refused.
  - AI provider keys are kept in the desktop's encrypted store.
  - Connected apps with your own key. With your own Composio key, connected-app traffic stays off the managed service.
  Security
  - A stronger bot sandbox on Clouds and shared servers. Five fixes close ways a bot's files could affect the server outside the sandbox: server files named on a command line, background engine work and app connections, programs and npm or git settings in the home folder, and the server's own model-list checks for Pi, OpenCode, Hermes, DeepSeek and Muse.
  Known issue
  - On a server with the sandbox on, an engine installed only in the home folder can show as "not installed". Reinstall it from Settings.
