ReleaseNotes: |-
  Lighter and quieter. A workspace with unread bots no longer burns CPU while nothing is happening, the app loads about a third less code at launch, and the server sleeps when nothing is due.
  - Quiet when idle: unread mascots hold still, and the server stops waking up several times a second.
  - Loads less: only your language loads, the rail is its own small page, and the panels you rarely open load when you open them. A screen's first open can take a moment longer, up to about a second on a Cloud page right after it starts.
  - Fewer redraws and writes: long chats reopen faster, messages stop redrawing when something unrelated changes, and the server writes to disk far less while a bot works.
  - Small servers: idle engines close sooner on machines with 1.5 GB of memory or less, and Node's memory limit follows the machine's.
  - Local models: tool calls work even when they arrive as text, a model that loops gets stopped, Ollama gets a big enough context window, and bots on local models get the short tool list.
  Very long chats still use a lot of memory when scrolled to the top. That's next.
