ReleaseNotes: |-
  What's new in 0.1.153
  Burst mode
  - Give a bot a big job and let it split the work. Type /burst, or let the bot offer it: it previews the parts, runs them side by side and gives you one result. Every plan has it, with more parts at once on bigger plans.
  Models and engines
  - Ollama, found for you. MausBot finds Ollama running on your computer and adds it in one click, shows the models you've pulled, and lets you turn a model's thinking off or pick its level.
  - Reasoning levels for OpenAI and OpenRouter API models.
  - Star a model to keep it at the top of its provider.
  - Amazon Bedrock as a way to run Claude.
  - New models without an update. The model list now refreshes by itself.
  My Cloud
  - Choose which bots move to My Cloud. With two or more bots you pick, or move everything.
  - Big workspaces finish moving, including on slow connections.
  - Open one of your computers from another over Tailscale, and see why when it can't connect.
  - Bots know which of your computers they can use, and say so when one is away.
  Phones
  - A clear notice when an older phone app stops connecting away from Wi-Fi. Update the app on your phone, then open it once on the same Wi-Fi as your computer. Phone & devices has a Pair again button if you need it, and your bots now give the same answer.
  - Self-hosted servers can pair a phone through MausBot's relay, with no domain or open port. Start the server with --relay. It is new: tell us how it goes.
  Hand-offs and Inbox
  - Finished hand-offs get a line in your Inbox.
  - Work waiting on you gets one reminder after a day and closes after three, instead of waiting forever.
  - An approval nobody answered stays in your Inbox until you decide.
  Apps and secrets
  - Suggested apps to connect, and bots can search the app catalog.
  - MCP server secrets are kept in the Vault, and your saved secrets travel with you when you send a workspace to My Cloud.
  - Emailed one-time codes fill in by themselves when a bot is allowed to read that mailbox.
  Chats and rooms
  - Start fresh. Reset a chat's context from its actions menu.
  - Pin a bot's page to the sidebar.
  - Rooms follow their Chief of Staff, and tell you when the Chief isn't in the room.
  - The rail takes a click at once.
  - Attach .xmind mind maps.
  Self-hosting
  - One command installs a server on a fresh Ubuntu machine, with HTTPS on your domain.
  - A stable channel, and an update that backs up first and goes back by itself if the new version doesn't work.
  - HTTPS survives a server restart. If you run the Docker setup, run docker compose up -d after pulling, not only a restart.
  - Sign-in lists: people you added in Settings while an empty environment setting was overriding it now take effect at the next start. Check the list before you update.
  Other
  - The ModelGo card now shows on your first launch of this version if you haven't seen it.
  - MausBot can tell you about news with a card, without an app update. Set OMB_DISABLE_ANNOUNCEMENTS=1 to turn it off.
  - Traditional Chinese is fully translated.
  Fixes
  - Starter: the list of paused bots no longer disappears when it changes.
  - A turn that needs a Local VM's tools stops when the VM offers none, as before.
  - A turn carries on when one optional MCP server dies.
  - The bot sandbox keeps more server settings away from bots.
  - Length refusals tell a bot how to shorten and try again.
  - An expired Claude sign-in is recognised, with one notice a day naming the bots that can't run.
