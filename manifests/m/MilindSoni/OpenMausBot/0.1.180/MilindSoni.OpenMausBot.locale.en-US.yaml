ReleaseNotes: |-
  What's new in 0.1.180
  Bots and work
  - Skill Burger is a small pill in chat. It stays closed while the bot works; tap it to see the steps. Every saved burger now works in every chat and with every bot (existing ones are moved over once, none lost), and a run stops before starting if it needs an app that isn't connected, with the bot offering to connect it.
  - Skill Burger works for team runs. When a bot hands work to other bots, the card shows the run the way a person would describe it: the inputs, who was asked what, what came back, and the check that decided it was done. You can change an input or untick a step before saving. A burger saved from a team run now really runs again. Burgers also show as a small pill in chat, and every burger works in every chat.
  - See and stop each hand-off. While bots work, a row above the message box shows each exchange (for example "Pepper ⇄ Engineer · working…"). Click one to open that exchange, with its status and its own Stop, which stops that hand-off without stopping your conversation.
  - One-off hand-off threads tidy themselves up. A thread a bot opens just for one hand-off closes and is archived once its result is back. Standing threads, and threads you pinned, filed or wrote in, stay open.
  - A bot's main conversation is marked and stays put. It shows a "Main" mark, sits first in thread lists, and no longer moves when another thread is busy. A message to it never waits behind the bot's other threads.
  - Typing while a question waits answers it. If a bot is waiting on a question that takes words, what you type is the answer. Questions with only buttons still need a tap.
  - Rooms follow "Sending while a bot works", like one-to-one chats. When a bot can't take the message mid-turn, it quietly waits its turn.
  - Mark as unread sticks, on the open chat too, after a reload and in a second window.
  - A send to a busy standing thread runs beside the busy turn instead of waiting.
  - Morning brief: Outlook emails open in Outlook.
  Looks and chat
  - Settings → Features. Two switches: Skill Burger (on by default) and Thread tabs (off by default). On a Team Cloud only admins see them, and they apply to the whole team. With Skill Burger off it's hidden everywhere; saved burgers stay and come back when it's on again.
  - Thread tabs. Switch them on and a bot's threads show as tabs in the top bar: pinned threads first, a live dot on running ones, ✕ archives (with Undo), + starts a new one, double-click renames.
  - Thread tabs look cleaner: the sidebar and the top bar are one surface, the chat sits in it as a card, the open tab flows into it, and every button in the top bar lines up.
  - Pinned threads show right under their own bot in the sidebar; the separate "Pinned threads" box at the top is gone.
  - Ctrl+Tab and Ctrl+Shift+Tab switch between a bot's threads, pinned ones first.
  - Switch threads from the top pill. With tabs off, click the thread name in the top pill to see all of that bot's threads and switch between them; arrow keys and Enter work too.
  - Fluffy avatars. Each bot's avatar can be Flat or Fluffy, with a fur coat drawn by Open Bot Avatar 0.4.0. Flat avatars look better too: their eyes follow the body's shape, and the mug's and rocket's mouths are no longer cut off.
  - An Unread group in the sidebar. Bots with unread messages gather at the top, newest first, and go back to their place once read.
  - A quieter server switcher at the top of the sidebar.
  - Archived conversations no longer light a bot's unread dot or bump folder counts.
  - The sidebar is faster: a change in one bot no longer redraws every row.
  - Team map: lines between bots show hand-offs as they run (Running, Queued) and which bots share a room.
  - A wait's follow-up shows as a quiet note on the bot's side, not as your own message.
  - ⌘K → "Toggle light/dark", and the quote card follows the design rules.
  - Simple mode no longer shows a conversation's "#412" link chip.
  - Settings search keeps you in Simple mode; an Advanced setting opens in place, marked.
  Devices and computers
  - Settings → Devices, redesigned. This computer is at the top with its bots; everything else sits in Phones, Computers, and Clouds and your own servers. Each device says how it is doing, a device that needs something has the button on it, and bots show on the device they work on. A VPS server opens its editor (name, memory, cores) from its card.
  - Let your own server's bots use this computer. One switch: "Let its bots use this computer", on the Connect form, the server's row, its Devices card and the Screen panel. Both the app and the server need 0.1.180. It works for a server that is yours alone, while the app is open.
  - Phone: the back button steps back inside the app (panels, previews, the bot list) instead of leaving it.
  - A paired phone can set your AI keys and sign engines in, over the encrypted connection only.
  - Computer use on a Mac needs macOS 15 or later, and now says so.
  - Linux: Fedora and other non-Ubuntu Wayland desktops are pointed to a cloud desktop.
  Models and providers
  - Antigravity can now run on Google's own CLI. New setups use it. If you already use Antigravity, nothing changes until you choose Switch to Google Antigravity CLI on its card in Settings → AI; you then sign in with Google once more. Where Antigravity is in use, MausBot now installs Google's CLI by itself.
  - OpenRouter bots in Advanced mode can choose the model their memory upkeep uses.
  - Codex: the "ultra" reasoning level on models that offer it, and every fast service tier.
  - Grok: memory upkeep runs on the bot's own model (no more payment errors from Grok's default).
  - Hermes can use Auto-accept edits.
  - Cursor: a reply that ends with a failed model call now fails the turn, so routines retry it.
  - Pi reports its prompt size, so it can compact long conversations.
  - List prices for the current GPT-6, Gemini 4 and Cursor models.
  MausBot Cloud
  - Settings → Storage shows what is filling your Cloud's disk, by kind and by bot, and a quiet line in the sidebar tells you when it passes 80% and 90%. Owners and admins only.
  - A browser that uses too much memory no longer freezes the whole Cloud. When memory is nearly gone, that one browser is closed and its task stops with a clear message; everything else keeps running.
  - After a restart caused by running out of memory, the task that was using the browser is not started again by itself. Send the message again to retry.
  - Bots save their work to git. When a project has a git remote you work in, bots commit their work and push it to one branch of their own, reusing that branch. They never push to the default branch or force-push.
  Fixes
  - Sidebar: dragging a bot into a new order works while another bot is busy or waiting.
  - Copy and Download conversation include the whole history; Markdown exports close an unfinished code block.
  - Data grid: copied rows keep tabs and line breaks inside cells.
  - Search keeps one-character words, such as "Contract 7" or a one-character name.
  - Typing with an input method (Chinese, Japanese and others): confirming a word with Enter no longer sends a phone sign-in code or saves a department memory entry.
  - A safety check now catches -Recurse written after a long dash.
  - A home profile copy is never deleted unless the workspace really has all of it.
  - MCP: servers strict about protocol versions work, sign-in apps can return to a fixed https address, and a refused tool call names what was wrong.
  - Clearer refusals when a connected app has several accounts and the call names none.
  - Check for updates really checks again, and says when the check failed.
  - Rooms: no "Chief is absent" notice when a Chief is in the room.
  - Windows Local VM accepts the WSL workspace path for any runtime; Linux rpm install docs match the downloaded file.
  - Italian is complete and corrected.
  - Many smaller reliability fixes from contributors.
