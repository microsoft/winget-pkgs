ReleaseNotes: |-
  Bots work on several threads at once. One bot can now run as many conversations side by side as its machine has room for, and teams get plainer words and clearer limits.
  - Parallel threads: on a MausBot Cloud, memory decides how many run at once, and a turn past that says "Waiting for memory" and starts by itself. On your own computer it's one thread per 2 GB of memory, from 3 to 16. Starter Clouds run one thread per bot at a time, and a bot's own hand-offs never wait behind it.
  - Who said what: every line a bot reads now says who sent it and whether it's a request or just information, so a relayed "yes" can't answer a question meant for someone else.
  - Teams: "Looked after by", two simple sharing choices, one inbox list, and refusals that name who can share a bot. A team export now leaves out members' private chats.
  - You menu: shows the address you're signed in with, and has Sign out.
  - Threads from outside work: a thread opened by work that came in from outside now stays with that work.
  - Also: a bot can open a thread on itself on another model, social post previews with local videos, a Google Gemini preset, hiding providers you don't use, and fixes for local VMs, Windows and input methods.
  Known issues, fixed next: signing out from this computer's page can leave a Cloud's session in the window, so don't rely on it to clear a shared computer yet. A My Cloud you added by hand can stay on the rail after sign-out. And with a team or a second Cloud, the You menu can show no address right after sign-in until you restart.
