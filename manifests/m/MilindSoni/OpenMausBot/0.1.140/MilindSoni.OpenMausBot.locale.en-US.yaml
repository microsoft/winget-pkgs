ShortDescription: 'An open source Grok Bot alternative: a team of AI bots in a chat app on your own machine'
Description: OpenMausBot, sold as MausBot, is a local-first chat app for running a team of AI agents on your own machine with your own API keys. Each bot gets its own computer, you pick a model per bot, and tasks, automations and connected apps stay on your account.
