ReleaseNotes: |-
  What's new in 0.1.181
  Bots and work
  - Skills on all your bots. Put a skill on every one of your bots in one step, from the Skills list or by asking your Chief. Bots made later get it too, each bot can switch it off, and a bot that moves to My Cloud keeps it. On a Team Cloud it reaches only your own bots.
  - GitHub sign-in. A GitHub row in Apps, and a Connect GitHub card when a bot's push fails for lack of access. Bots on My Cloud can then push to a branch of their own, never the default branch and never with a force-push.
  Devices and computers
  - Settings → Devices is now one page for phones, computers, Clouds and your own servers. Adding or fixing a device opens in the page instead of in dialogs stacked on top of each other, "Phone & devices" is folded in, and a small map at the top shows what is connected.
  - Devices: a notice at the top names what needs you, each device has one row of actions, and adding a phone or computer explains each step.
  - Private network (Tailscale) is one row with one switch, "Let my other computers connect", and it tells you the single next step for where you are.
  - Phone alerts when the app is closed are on by default once a phone is paired (iPhone app 2.0.1 and later; Android later): approvals, questions, sign-ins and finished replies, with only the bot's name on the lock screen.
  - Moving a bot to My Cloud says what changes for it before you confirm, such as its folder on this computer, a local model, or the teammates it hands work to.
  Models and providers
  - Codex: several ChatGPT accounts on a Cloud. Each account signs in with a device code and keeps its own login, with its own email and sign-out in Settings.
  - Codex: group chats no longer fill your Codex history. Room messages used to leave a saved Codex chat each, titled "Context from OpenMausBot…". They no longer do.
  - Claude on a custom endpoint stays under the 20-image limit. On an Anthropic-compatible endpoint set in Settings, older images in a long conversation are folded away so new requests are not refused. Anthropic's own service is unchanged.
  - ModelGo is in the main Providers list in Settings → AI, right after Google Gemini, instead of under More providers. New installs see ModelGo's sponsor card again on their first launch, after the first reply.
  - Antigravity CLI: bots keep their team, browser and connected-apps tools from the first message.
  - Bots know how to connect an engine. When a bot lists the models it can use, it now sees why an engine can't run yet and how to connect it, for example that Antigravity signs in with a Google account and needs no API key. A local model is listed once, not under several engines.
  MausBot Cloud
  - A busy Cloud no longer looks unset. When a Cloud is under heavy load, a check that can't finish no longer shows the "connect an AI" setup page; it says plainly that the Cloud is too busy right now.
  - A new Cloud's first look at your apps tries again if it fails, and a bot that moved in from your computer is greeted as itself instead of being offered the inbox setup.
  - On a My Cloud, each bot reaches only its own AI account's sign-in, not other engines' or accounts' logins.
  Fixes
  - The desktop app starts faster: some start-up checks wait until after the window is up, and engines warm up ahead of your first message.
  - Skill Burger runs are steadier: replays keep their working folder, stop on a failed app step, resume cleanly after errors, re-send only unsent teammate requests, and refuse an outdated undo. They also keep files with the same name in different folders apart, and keep every append step.
  - Routines: with the safety floor on, a routine whose reply was already delivered completes, marked partly done, when the only steps that failed afterwards were ones the floor blocked. Any other failure after the reply still fails the run.
  - Thread tabs: in Midnight the frame around the tabs is darker so the tab curves read clearly, and in Simple mode the sidebar buttons line up with the tabs.
  - Settings: old links to Activity or Skills open a useful page instead of an empty one, and Settings search no longer offers a section that can't be used here.
  - Docs: the Bot API guide links to a community app built on it.
