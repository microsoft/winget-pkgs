ReleaseNotes: |-
  What's new in 0.1.158
  Bots can change app settings for you
  - Ask a bot to change a setting and it does it, with an Undo in the chat.
  - You can make MausBot a regular bot if you don't want it as your helper.
  Rooms and teams
  - Point at a member's page from inside a room.
  - Set up many bots at once: a Chief can edit up to 40 bots in one go and add a rule to each.
  - A Chief in charge of every department gets new departments automatically.
  - Fork a conversation from any message to try a different direction without losing the original.
  Voice
  - Listen with your ElevenLabs key, and speak Thai through Eleven v3.
  Phone
  - A pairing link says when it only works on the same Wi-Fi.
  - Phones without admin rights can read a bot's Data.
  - Phone tools can run several known steps in one call.
  Browser and engines
  - The built-in browser can use a SOCKS5 proxy and a chosen locale.
  - Project skills are always on.
  - A custom ACP engine can opt in to steering a turn while it runs.
  - DeepSeek Harness starts from the desktop app on Windows.
  Apps
  - BubblaV has a card in Plugins.
  - A remote MCP server's protocol errors are named, instead of "Remote MCP request failed".
  Automations
  - Open an automation from anywhere on its row.
  - A routine's report collects the files from the turn that sent them.
  - A one-time schedule's time zone is read from its offset.
  Fixes
  - Settings pages no longer show a white block behind their header.
  - Windows tray: Quit works from the lending icon.
  - New chat: Enter or Escape that picks an IME candidate no longer starts or closes a chat.
  - The shared Local VM: a turn waiting behind someone's hold stays waiting until the hand-over.
  - An OpenCode Go limit is scoped to current prices, so free models aren't held back.
  - Simplified and Traditional Chinese are filled in further.
  - When asked for a claude.ai Artifact, a bot says it isn't available and offers its own page.
