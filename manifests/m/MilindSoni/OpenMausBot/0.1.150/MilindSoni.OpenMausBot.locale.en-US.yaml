ReleaseNotes: |-
  What's new in 0.1.150
  Clouds finish restores and stay responsive
  - A restore on My Cloud finishes by itself. Restoring a backup, or moving this computer's workspace to My Cloud, used to wait on "Fully quit MausBot…", which a Cloud can't do. My Cloud now restarts its own server right after the restore and shows progress while it comes back.
  - The turn queue stays fast when many bots wait. Checking who goes next takes time in proportion to the number waiting, not its square, so a busy Cloud keeps answering.
  - A Claude turn is never sent twice once one of its model calls has answered.
  - Routines save a run's progress once per window, not after every step, so long runs write far less.
  - Paired phones and desktops get large bot lists without stalling.
  A calmer, clearer app
  - Polish pass. One corner-radius scale, clearer headings and lighter icons. A reply with a table or code is now one bubble instead of three boxes of different widths.
  - Pages open beside the chat. A bot's page shows as a small card with Open page. The large view keeps the message box usable, so you can talk about the page while looking at it. You can also save a page as a file.
  - Simple mode does more. The everyday settings that needed Advanced are now in Simple: what a bot may do without asking, reply style, per-bot notifications, who can see a bot, the cloud computer picker and Android.
  - Rules for every bot. One field next to About me holds instructions every bot follows, and bot instructions keep a history with Undo.
  - Memory tidies itself. Upkeep moves finished work logs out of memory, and never touches lines that read like rules you gave. A bot that loads a lot every turn shows Tidy memory.
  - New Aurora and Diwali skins.
  Bots and connections
  - A bot can open a thread on another model, including one from another provider, pick it from a short list, and get the result back.
  - Secrets typed into a bot's card are kept in the Vault, for that bot only, so it can use them again without asking. They are always masked in transcripts and logs.
  - A mailbox that reads but can't send gets a card in the chat for its outgoing server.
  - ChatGPT plan turns use your own Codex setup and skills, with their sign-in kept separate.
  - AgentMail, AgentPhone, Vapi and Telnyx connect with API keys.
  - Public HTTPS MCP servers can be added without an approval step when access is below Full.
  - Connect to a server says why it's grey, for example when macOS blocks local network access, and offers a Tailscale pairing button when that route is on.
  - Model IDs of an added OpenAI-compatible server can be changed after adding.
  Fixes and smaller changes
  - Full screen watches a bot's screen without taking control, and you can take over from the viewer.
  - ⌘⇧N starts a new thread with the selected bot.
  - Sent and attached files share one 100 MB limit. Previews stay at 25 MB.
  - Chinese input: IME handling, thread search, mentions, the slash menu, punctuation and sentence boundaries.
  - Automations filter by department, and a waiting run can be cancelled.
  - Older usage-limit notices are marked as past once their reset time has gone.
  - Linux shows which libraries Chrome needs when they are missing.
