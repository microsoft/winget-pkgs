ReleaseNotes: |-
  What's new in 0.1.147
  Meeting notes
  - Paste a Google Meet, Microsoft Teams or Jitsi link and a bot joins the call as a guest. It names itself, says in the chat that it's taking notes, and leaves when asked.
  - Ask it questions during the call with @notes. When the call ends it posts a Meeting notes card: summary, decisions, action items and the full transcript with who said what.
  - A calendar routine can send it to your meetings automatically.
  - On a Cloud plan, transcription is included. Elsewhere, use your own ElevenLabs, Groq or OpenAI key, or a local Whisper model.
  Fixes
  - "Internal service failure (session/new, LocationNotFoundError)" on a Cloud: fixed. OpenCode chats on a Cloud failed in every conversation after a bot's first one; each conversation now reaches its own folder.
  - Phone connection: a second relay server now shares the load.
