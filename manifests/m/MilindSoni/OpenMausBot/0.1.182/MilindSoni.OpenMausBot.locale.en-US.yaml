ReleaseNotes: |-
  What's new in 0.1.182
  Bots and work
  - This computer and My Cloud, together. If you have a personal Cloud, bots on this computer and on your Cloud show in one list, know about each other and can hand each other work. A one-time note explains it and has a switch to turn it off.
  - Group chats show their threads as a feed, with the open thread beside it. "+" starts a new thread.
  - Close a finished group-chat thread. Anyone in the chat can close one, a new reply reopens it, and bots close their own when the work is done. Reply counts follow the branch you are viewing.
  - Starting a group chat is simpler: pick the bots and start chatting.
  - Inbox says why each item is there, splits into For you and Activity, and reading something no longer moves rows.
  - Set as main thread is in the chat's ⋯ menu (and in the bot panel in Simple mode), and a bot offers it when you say you now work in another thread.
  - 👎 is quiet: it no longer posts or starts a turn; the bot reads it in its next turn. 👍 still means "go ahead".
  - See who asked what. When one bot hands work to another, the receiving bot's chat shows a line such as "Mochi asked me: Octopus facts" that opens that work.
  - The line under a working bot says what it is working on.
  - A bot asked to reach another bot no longer leaves the request in your Inbox and waits forever, and a bot asked about one that lives in your other place says where it lives.
  - A bot publishes a page with a public link only when you want others to open it, and says the link is public.
  - Bots can set or clear their own main thread when you ask them to.
  - Delete closed threads in one step from a bot's menu. Pinned and reopened threads are kept.
  - Type /archive or /delete in the message box to archive (with Undo) or delete the open conversation. /fork is no longer offered in a blank new chat.
  - A message stopped because an AI was signed out runs by itself once that AI is signed in again, and its notice says so.
  - Check before done: answers sent back for fixing fold into one line, so only the final answer shows in full.
  - Threads started by a hand-off are named by the message, not by the "[From …]" note.
  Looks and chat
  - Suggested replies. After a bot replies, the empty message box shows one faded line you might send next; Tab fills it. On by default in Settings → Features.
  - What's new, in one place. A short centred tour with three slides shows the new MausBot Cloud, Team plans and ModelGo, each with a short clip of the app. Everyone sees it once.
  - Antigravity accounts sit on one card in Settings → AI, like Claude's and ChatGPT's.
  - The thread switcher shows for every bot with two open threads, including threads another bot opened and the main thread.
  - Thread tabs (Settings → Features) show for every bot, even with one thread, so the tab strip's + is always there.
  - Templates look like the ready-made bots, with every bot's real face. A one-bot template now joins your bots list instead of becoming its own department.
  - Publishing a template keeps your details private. Local paths, emails, phone numbers and your computer's user name are removed before anything leaves your computer, the card says what was removed, and anything that looks like a key or token stops the publish. Only the template's own fields are sent, never a bot's connections, starter memory or approval level, and pictures lose their location and camera details. A new "Published by" field credits you by the name you choose.
  - Inbox: filter Active Threads and Finished by bot or room and by status, and each conversation shows its bot's picture.
  - Bot panel: What it remembers, Skills, Working folder and Routines are rows on Details, and ended conversations fold into "Ended (N)".
  - The sidebar keeps its order: a bot no longer jumps into an "Unread" group. Unread and waiting show as dots, and a folded department shows a count.
  - Avatars: two new finishes, Matte and Metallic, and small fluffy avatars no longer show a thin line while they animate.
  - ModelGo sits in the top three of Settings → AI → Providers.
  - Streaming replies are lighter: they no longer redraw every message, the tab strip or the page's styles.
  - After a reload, the conversation the app reopens stays unread until you open it.
  - Departments have Move up and Move down in their menu, and menus show the New thread shortcut.
  - A text or log file a bot links in a reply opens in the side preview.
  - Pages a bot shows can read that bot's data and keep their own state when they ask for it. Reads are read-only, and pages in group chats or published pages get neither.
  Devices and computers
  - Windows dictation uses Windows' newer speech when the older recognizer doesn't know your language. With Windows' Online speech recognition on, Windows sends that audio to Microsoft.
  - Scheduled report notifications have their own switch in Settings → Notifications, so you can keep routine reports while chat replies stay quiet.
  - Desktops on your own servers stop after 8 hours unused, never while a bot works on them or you're watching.
  - Update all in Settings → Devices updates every server this app may update, then the app itself, after one confirm that lists what changes.
  - "Your Chrome" works again on Chrome 144 and newer on macOS and Linux.
  - Signed-in sites lists your real sign-ins apart from ad and tracker cookies, which fold away and can be cleared.
  - You can remove a paired phone while phone access is asleep.
  - Tailscale on Headscale, or without MagicDNS, now says so instead of "signed out".
  - Windows: dictation and calls say when Windows has no speech recognizer for your language, and Antigravity runtimes left running after a crash are stopped at start.
  - iPhone: the browser bar colour accepts only valid colours.
  - Phone pairing on Linux says when the firewall is blocking it.
  Models and providers
  - Antigravity CLI: every one of the bot's tools fits under the CLI's size limit, so none go missing. Each account keeps its own Google sign-in on CLI 1.5.16 (accounts that were using the computer's shared sign-in sign in once more), and when Google's quota runs out the fallback model takes over.
  - Gemini: the bot's tools fit the CLI's tool budget.
  - Backup AIs can each keep their own reasoning level, used when they take over.
  - DeepSeek Harness: "Approve for me" keeps dsh's sandbox and reviews requests to go outside it (dsh 0.2.2-rc.2 and later), and approval cards show what the call does.
  - Hermes remembers "Always allow" for a tool on an MCP server its own config marks untrusted.
  - Voice: the voice server address can be seen, changed and cleared in Settings → AI → Other services.
  - Kiro bots can open images you paste; Antigravity bots receive files a teammate handed them; Pi (omp) turns no longer hang when omp fails before it starts.
  MausBot Cloud
  - While your Cloud is being updated the app says so, instead of failing to load.
  - A Cloud whose clock fell behind after sleeping corrects it by itself.
  - A bot that hits the per-bot desktop limit says so.
  Fixes
  - The mascot no longer gets stuck showing its "!".
  - Simple mode stays Simple. A bot asked to change a setting only Advanced mode shows changes it without switching the app to Advanced. Bots switch modes only when you ask for Simple or Advanced by name.
  - Skill Burger: a saved file step can no longer write through a link out of the conversation's folder; recorded file edits, Pi writes and pages on the cloud computer replay; number rules ignore missing values.
  - Data: relative paths load from the conversation's folder, temporary tables are found, live views show current statistics, and charts handle infinity.
  - Skill imports from GitHub use your connected GitHub sign-in, for a higher rate limit.
  - Brief: two emails from the same sender no longer confuse the card's buttons.
  - Work waiting on several secret cards resumes on each one you save, and a steered message is no longer sent twice.
  - Thread links open a thread that isn't loaded yet, and say when a thread is gone.
  - Bots' tools no longer break on messages holding rare line-separator characters.
  - Sign-in and CLI check requests have a size limit.
  - Many smaller reliability fixes from contributors.
