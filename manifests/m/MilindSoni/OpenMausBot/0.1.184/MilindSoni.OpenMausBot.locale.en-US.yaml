ReleaseNotes: |-
  What's new in 0.1.184
  Bots and pages
  - Local apps. Save a page a bot made as an app and open it in its own window without the chat. To install one on your computer, open the app, then choose Install on this computer from its menu.
  - Pages a bot shows can use the connected apps they ask for, through your own connection.
  Models and providers
  - Antigravity CLI: connected apps no longer lose tools. The CLI allows a bot only so much tool text in total, and with many connected apps (Drive, Docs, Photos…) it quietly left out the biggest ones. Every tool's description is now shortened as needed so they all fit.
  Fixes
  - A Cloud no longer freezes after you delete conversations with many attachments. Cleaning up their files now runs one pass at a time, off the main work, and is safe if the Cloud restarts part-way.
  - One saved key with a stray character can no longer take a Cloud down. Keys are trimmed when saved and when read, and a request that still can't be sent fails on its own instead of stopping the server.
  - Export full backup no longer stops on files it can't carry. Python environments, a bot's browser profile, and links in a bot's folder that point outside it or to nothing are left out, and the backup says how many it left out.
  - Bots give the right directions for moving to the Cloud. The move to My Cloud is for a Cloud of your own. A Team plan's Cloud belongs to the team: there's no one-step move into it, your computer's bots keep working where they are, and bots from another app can be brought into the team from the team Cloud's Settings → Import & export.
