ReleaseNotes: |-
  Extractors
  - Additions
    - [febri] add support (cb#554)
    - [instagram] add reposts extractor
    - [instagram] add highlights-covers extractor (cb#559)
  - bunkr
    - support bunkr.sx and bunkr.lv domains (pr#565)
  - deviantart
    - support da-poll content elements (pr#562)
    - support /status-update/ URLs
    - support extracting status updates from HTML
  - facebook
    - fix KeyError: 'set_id' (cb#247)
  - hentai2read
    - update extractors (cb#569)
  - hentaihere
    - update extractors (cb#570)
  - instagram
    - implement fetching full metadata for all tagged & reposts results (cb#578)
  - lensdump
    - fix extractors (cb#563)
  - newgrounds
    - support two-factor codes during login (cb#572)
    - fix extraction of certain /art/ images
    - fix Adult Content warnings
    - detect NG Guard challenge responses
  - pawchive
    - fix KeyError: 'name' (cb#576)
  Downloaders
  - http
    - optimize file signature checks
  Miscellaneous
  - [common] improve JSON-LD extraction
  - [config] exit on invalid default config files when GDL_CONFIG_STRICT environment variable is set (cb#575)
  - include certifi version in --verbose output
  - include formatted cookies in write-pages=all output
