ReleaseNotes: |-
  Extractors
  - Additions
    - [E621] support blep.art (cb#597)
    - [E621] support hmofa.gallery (cb#597)
    - [E621] support floofgens.net (gh#9885 pr#625)
    - [onlyhaven] add dm & user-dms extractors (cb#481)
    - [shimmie2] support bittersweetcandybowl.com/candybooru (cb#590)
    - [twitter] add reposts & articles extractors
    - [tw6] add support (cb#606 gh#9306)
    - [tistory] add support (cb#619 gh#285 gh#286)
  - Removals
    - [shimmie2] remove booru.cavemanon.xyz
    - [twitter] remove timeline extractor
  - E621
    - accept /popular URLs (pr#617)
  - deviantart
    - fix extraction of mature-rated literature posts (cb#623)
    - improve folder name matching (gh#9876)
  - facebook
    - fix username extraction when logged in
  - girlswithmuscle
    - detect Anubis challenge pages (cb#618)
  - imagechest
    - fix galleries with more than 40 files
    - improve error handling
  - imagepond
    - support plural /videos/ URL pattern (pr#602)
  - imxto
    - fix & refactor file extraction (cb#604 cb#608 gh#9873)
  - instagram
    - detect subscriber-only stories via audience fallback (pr#599)
    - fix base64 decode issue in share links (pr#585)
    - fix issues with "cursor": false (gh#9874)
    - improve error messages (gh#9872)
    - remove for (;;); guards in API responses (gh#9872)
  - iwara
    - support ecchi.iwara.tv URLs (gh#9861)
  - livedoor
    - support USER.livedoor.blog URLs
  - luscious
    - update GraphQL queries (cb#587 gh#9868)
    - warn about 1000 file limit for guest users (cb#275)
  - onlyhaven
    - add include option (cb#481)
    - fix download URLs (cb#588 gh#9857)
    - fix pagination (gh#9857)
  - pawchive
    - fix hash extraction (cb#610 gh#9878)
  - reddit
    - support video comment embeds
  - tiktok
    - skip video-only DASH formats (gh#9764 pr#614)
  - tw6
    - add files option (cb#606)
  - twitter
    - update API endpoint query hashes & parameters
    - improve ondemand.s.…a.js key extraction (cb#603 gh#9867)
    - support /verified_followers & /followers_you_follow
    - fix IndexError when using guest token (gh#9867)
    - prevent potential KeyError: 'name' on retweets (cb#474)
    - prevent playlist downloads with "videos": "ytdl" (cb#615)
    - refactor background extractor logic (cb#598)
  Downloaders
  - http
    - add sleep-retries option (gh#9870)
    - include 429 in retry-codes default (gh#9837)
  - ytdl
    - restore _ytdl_index functionality (cb#615)
  Post Processors
  - metadata
    - add errors option (cb#589)
  Cookies
  - fix Firefox 142+ expiry timestamps (gh#9855)
  - fix handling of empty Chromium profile paths (gh#9882)
  Documentation
  - document input file format (gh#9154)
  - document supported environment variables
  Options
  - add --config-strict (cb#575)
  Miscellaneous
  - allow accessing extractor/job/path/keywords values in unsupportedfile formats
