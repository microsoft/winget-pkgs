ReleaseNotes: |-
  What's new
  - Added new setting: "Isolate tag matches in list". By default, when your input text matches a tag, results include both tagged keywords and standard text matches. Enabling this setting restricts the list strictly to tagged keywords when a tag match is found. You can enable this under Settings > List tab (or via listisolatetags in executor.ini).
  Fixes
  - Fixed auto calculations not triggering under certain conditions related to having suggestions enabled for input.
  - Fixed an issue where if dismissing input assist while having auto-completed input text, the current input would not auto-complete properly.
