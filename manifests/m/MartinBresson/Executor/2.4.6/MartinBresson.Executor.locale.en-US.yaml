ReleaseNotes: |-
  Improvements
  - Changed the font size in Keyword Editor and Settings from 9pt to 10pt, to match many modern Windows apps. There's a setting guifontsize if you prefer a smaller font. Info on setting here.
  - Added import option "Always hide existing keywords on open", available on the import dialog.
  Fixes
  - In certain Incognito modes tags would not be displayed as expected.
