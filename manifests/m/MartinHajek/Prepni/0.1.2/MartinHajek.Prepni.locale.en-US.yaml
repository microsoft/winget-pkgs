ShortDescription: Double-tap Shift to retype text typed in the wrong keyboard layout.
Description: |-
  Přepni is a small tray utility for people who switch between keyboard layouts. When text comes out in the
  wrong layout, double-tap Shift: the last word (or the selected text) is retyped as if typed in the other
  layout and the keyboard switches. Each further double Shift takes one more word. Works in both directions
  and with any pair of installed layouts. Keeps only the last few words in memory, writes nothing to disk and
  sends nothing over the network.
