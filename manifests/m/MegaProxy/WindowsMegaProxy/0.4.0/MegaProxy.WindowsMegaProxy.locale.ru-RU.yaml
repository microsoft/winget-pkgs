# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json
PackageIdentifier: MegaProxy.WindowsMegaProxy
PackageVersion: 0.4.0
PackageLocale: ru-RU
Publisher: MegaProxy
PackageName: MegaProxy
ShortDescription: Направляйте трафик приложений Windows через HTTPS, SOCKS5, SSH и MASQUE-прокси.
Description: |-
  MegaProxy — открытый прокси-клиент для Windows 10 и 11. Направляйте весь трафик или выбранные соединения через собственные прокси-серверы по правилам для приложений, папок, доменов и IP-адресов.
  Поддерживаются HTTPS и SSH Jump, импорт и экспорт конфигураций, подписки, DNS-over-HTTPS, диагностика соединения и проверка скорости. Включены стабильное и экспериментальное сетевые ядра.
  Прокси-серверы и учётные данные не предоставляются. Для установки требуются права администратора, в том числе для персональной установки. При необходимости установщик скачивает закреплённую версию .NET рядом с приложением и устанавливает компонент Windows OpenSSH Client.
ReleaseNotesUrl: https://github.com/andre487/WindowsMegaProxy/releases/tag/v0.4.0
ManifestType: locale
ManifestVersion: 1.28.0
