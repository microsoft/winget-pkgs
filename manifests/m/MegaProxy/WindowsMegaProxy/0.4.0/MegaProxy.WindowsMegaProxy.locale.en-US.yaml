ShortDescription: Route Windows applications through HTTPS, SOCKS5, SSH and MASQUE proxies.
Description: |-
  MegaProxy is an open-source proxy client for Windows 10 and 11. Route all applications or selected traffic through your own proxy servers using application, folder, domain and IP rules.
  Supports HTTPS and SSH Jump connections, configuration import/export and subscriptions, DNS-over-HTTPS, connection diagnostics and speed tests. Includes stable and experimental proxy cores.
  Proxy servers and credentials are not included. Installation requires administrator privileges, including for the personal installation. Setup downloads a pinned app-local .NET runtime and prepares Windows OpenSSH Client when missing.
