License: Proprietary

ShortDescription: Windows media manager and downloader.

Description: >-
  MediaForge is a Windows media manager and downloader built around a staged
  desired-state workflow. Users can organize folders and media, review pending
  changes, and apply the complete set with Save Changes. The application
  includes local folder scanning, persistent staging, undo, duplicate
  protection, background downloads, search, sorting, and integration with
  yt-dlp and FFmpeg.

