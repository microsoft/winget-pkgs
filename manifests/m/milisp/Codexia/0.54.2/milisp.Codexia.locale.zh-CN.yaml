PackageName: Codexia
ShortDescription: 面向 Claude Code 与 Codex 的轻量级智能体工作站
Description: |-
  直接使用你现有的 Claude 订阅或 ChatGPT 套餐——无需 API Key。

  组建你的 Bot 团队——拥有记忆与定时任务的长期 AI 协作者。在一个工作区中管理 Claude Code、Codex 和 Agent Client Protocol（ACP）智能体，支持 git worktree 与远程控制。

  Bot 是一个拥有自己项目、人设、记忆和权限的命名智能体——你可以像对待同事一样给它发消息，它会在你专注别处时持续工作。

  - 受到强制执行的信任级别：只读、写入前询问或自主——由智能体的操作系统沙箱保障，而不仅是提示词
  - 持久记忆：每个 Bot 跨对话和重启记住上下文
  - 例程：为 Bot 安排自主运行的提示词（每天、工作日、每 N 小时）；结果进入其历史记录，并带有未读标记和系统通知
  - Bot 相互协作：一个 Bot 可以把任务交给另一个 Bot 并使用其答案
  - 你的 MCP 服务器：为每个 Bot 选择可用的服务器
  - 无需安装：keke 智能体随 Codexia 内置发行
