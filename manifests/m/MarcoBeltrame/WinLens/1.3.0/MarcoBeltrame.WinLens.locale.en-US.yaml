ShortDescription: Translate any text on your Windows screen, in place.
Description: |-
  WinLens translates the text on your screen and draws the translation right over the original, matching the background and font.
  It uses OCR, so it works on games, images, PDFs and any desktop app, not just web pages.
  Press a global hotkey to translate the current screen, or drag a region to translate just that area.
  Google Translate works out of the box; LibreTranslate and local AI models (Ollama, LM Studio) are also supported.
