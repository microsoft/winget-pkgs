ShortDescription: Modern, 100% ad-free, open-source Neo-Brutalist music player for offline listening.
Description: |-
  Euphony Music is a modern, high-performance, open-source music player built with Flutter, Riverpod, and Drift SQLite for Android, Windows, macOS, and Linux.

  Key Features:
  - Zero Ads & Zero Tracking: Complete privacy with no user accounts, no subscriptions, and zero telemetry.
  - Material 3 & Neo-Brutalist UI: High-contrast slab borders, hard offset shadows, and expressive typography.
  - Fast Local Caching: Powered by Drift SQLite for instantaneous library search and persistent playlists.
  - High Fidelity Audio: Playback support for MP3, FLAC, WAV, AAC, and OPUS local audio files.
  - Native Media Controls: Seamless background playback, lock screen controls, and notification panel media controls.
