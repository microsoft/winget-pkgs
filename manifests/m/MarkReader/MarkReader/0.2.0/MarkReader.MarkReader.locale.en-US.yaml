ShortDescription: A fast, lightweight desktop Markdown reader that renders exactly like VS Code's preview.
Description: |-
  MarkReader is a free, open-source desktop app for reading Markdown files without opening an editor.
  It renders documents the same way Visual Studio Code's Markdown preview does, with GitHub tables, task lists, syntax highlighting, KaTeX math and Mermaid diagrams.
  Open files by double-clicking, drag and drop, or from the terminal, browse a folder in a sidebar, and see the view update live when a file changes.
  It is about 5 MB, runs offline and has no telemetry.
