ShortDescription: Keep Windows software up to date across WinGet, Scoop, Chocolatey, npm and installed apps.
Description: UpdateForge finds installed software on Windows, checks WinGet, Scoop, Chocolatey, npm and the Microsoft Store for newer versions, and updates it on demand or on a schedule. It also lets you search and install packages from all enabled managers, and includes a tray app, command line and package bundle export/import.
