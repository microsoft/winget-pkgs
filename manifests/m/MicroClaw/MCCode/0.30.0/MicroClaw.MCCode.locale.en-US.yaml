ShortDescription: A terminal coding agent that works directly in your repository and verifies its edits with your project's own checks
Description: |-
  MicroClaw Code (mccode) is a terminal coding agent. It opens the repository that contains the current directory and runs the MicroClaw Agent Engine in it: a full-screen TUI for interactive work, or -p for one non-interactive task. It reaches the engine only through the public microclaw-sdk.

  Core capabilities
  - Full-screen terminal interface with plan, ask, and auto permission modes
  - Diffs with hunk-level review, and approvals before edits are applied
  - Automatic build and lint verification of the changes it makes
  - Sessions that can be continued or resumed, with checkpoints and persistent memory
  - Themes, layered settings with allow / ask / deny rules, and Claude Code-compatible hooks
  - Model configuration kept in ~/.mccode, separate from the MicroClaw Server

  MicroClaw Code and the MicroClaw Server are separate products. Each installs, updates and uninstalls on its own, and neither reads the other's configuration, data or MICROCLAW_* / MCCODE_* variables.
