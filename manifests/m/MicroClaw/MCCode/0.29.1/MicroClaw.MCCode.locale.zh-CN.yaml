ShortDescription: 直接在代码仓库中工作的终端编码智能体，使用项目自带的检查来验证它所做的修改
Description: |-
  MicroClaw Code（命令为 mccode）是一个终端编码智能体。它会打开当前目录所在的代码仓库，并在其中运行 MicroClaw 智能体引擎：既可以用全屏终端界面进行交互式工作，也可以用 -p 参数执行单个非交互式任务。它仅通过公开的 microclaw-sdk 访问引擎。

  核心功能
  - 全屏终端界面，支持规划（plan）、询问（ask）和自动（auto）三种权限模式
  - 展示差异并支持按代码块逐块审阅，应用修改前先征求批准
  - 自动运行项目的构建与 lint 检查，验证自己做出的改动
  - 会话可以继续或恢复，并提供检查点与持久化记忆
  - 支持主题、带 allow / ask / deny 规则的分层配置，以及兼容 Claude Code 的钩子
  - 模型配置保存在 ~/.mccode 中，与 MicroClaw Server 相互独立

  MicroClaw Code 与 MicroClaw Server 是两个独立的产品，各自安装、更新和卸载，互不读取对方的配置、数据或 MICROCLAW_* / MCCODE_* 环境变量。
