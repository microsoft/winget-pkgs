ShortDescription: Visual boards for notes, to-dos, pictures and links, on a free canvas or written as a page.
Description: |-
  SweetBoard puts notes, to-do lists, pictures, links, columns, tables and drawings on a free canvas, and shows the same board as a page you can write in, with one switch.
  It works offline and without an account, backs your boards up every day, keeps a version history of every text, and lets AI apps such as Claude work on your boards through MCP.
  An account adds sync with your phone and other computers, sharing and live co-editing.
