ShortDescription: Explain any lockfile change before you merge it
Description: |-
  lockvet reads a lockfile diff (working tree, commits, a GitHub/GitLab/Bitbucket/Gitea/Azure DevOps pull request URL, or two SBOMs) and explains it: what bumped, which jumps are major or downgrades, what becomes vulnerable and what a bump fixes (OSV.dev), how old each incoming release is, deprecations, license changes, and the dependency chain that pulls each transitive change in. 25 lockfile formats plus CycloneDX/SPDX SBOMs. Terminal, Markdown, JSON, and SARIF output; --fail-on turns it into a CI gate.
