ShortDescription: Complete private-school management on Windows, 100% offline.
Description: FasoÉcole Bureau runs an entire private school from one Windows PC, with no internet connection at all - enrolments, school fees, receipts, unpaid balances, grades and report cards, attendance, timetables and expenses. Built for schools in Mali and West Africa, it offers role-based access (director, secretary, accountant, teacher), a multi-workstation mode over the school local network, PDF documents branded with the school logo, stamp and colour, and automatic daily backups. Activation is by licence key issued by the publisher.
