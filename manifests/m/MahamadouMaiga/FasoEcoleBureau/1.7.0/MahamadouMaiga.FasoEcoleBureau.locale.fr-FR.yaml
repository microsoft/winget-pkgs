ShortDescription: La gestion complète de votre école privée, 100 % hors-ligne, sur Windows.
Description: FasoÉcole Bureau gère toute l'école privée depuis un ordinateur Windows, sans aucune connexion internet - inscriptions, frais de scolarité, reçus, impayés, notes et bulletins, absences, emplois du temps et dépenses. Pensé pour les écoles du Mali et d'Afrique de l'Ouest, il propose des rôles protégés (directeur, secrétaire, comptable, enseignant), un mode multi-postes sur le réseau local de l'école, des documents PDF au logo, au tampon et à la couleur de l'école, et des sauvegardes automatiques quotidiennes. L'activation se fait par une clé de licence fournie par l'éditeur.
