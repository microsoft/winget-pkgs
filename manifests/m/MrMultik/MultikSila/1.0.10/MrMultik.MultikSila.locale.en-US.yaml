ShortDescription: A simple, powerful VPN client — a sing-box and Xray GUI.
Description: |-
  Multik Sila is a VPN client built with Flutter on top of the sing-box and Xray engines.
  It imports subscriptions by link, file, text or QR code (plain link lists, Clash YAML and
  sing-box JSON), supports VLESS with REALITY and xhttp, VMess, Trojan, Hysteria2 and
  Shadowsocks, and can run as a system proxy or as a system-wide TUN VPN. Split tunnelling
  sends Russian sites direct and everything else through the VPN, with ad blocking,
  per-app and custom rules. Both engines update themselves.
