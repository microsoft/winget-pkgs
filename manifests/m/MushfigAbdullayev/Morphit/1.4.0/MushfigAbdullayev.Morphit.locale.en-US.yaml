ShortDescription: Convert any file on Windows with one gesture. Hold Ctrl, drag a file and let go on a format, fully offline.
Description: |-
  Morphit converts files where they already are. Hold Ctrl and drag a file a little in File Explorer, on the desktop or out of an Outlook e-mail, and an orbit of formats opens under the cursor; let go on one and the result is saved next to the original, which is never changed.
  It handles pictures (including HEIC and AVIF), PDF (merge, split, compress, pages, password, stamp, watermark, OCR), Word, Excel and PowerPoint to and from PDF (using the installed Microsoft Office), PDF to Word or Excel, video, audio and archives. Tools include scanning phone photos into A4 PDFs, hiding personal data, removing metadata and chaining steps into recipes; morphit-cli covers scripts and batch jobs.
  Morphit contains no network code: no uploads, no accounts, no telemetry and no update check. Ghostscript, FFmpeg, 7-Zip and Tesseract OCR ship inside the installer.
