ShortDescription: An open-source native desktop client for Douyin and Hongguo short dramas.
Description: |-
  MyDouyin is an open-source native desktop client for Douyin and Hongguo Short Dramas on macOS and Windows 10/11. Built with Go and the MyGo UI framework, it combines Douyin browsing and Hongguo short-drama playback in a single window and draws its interface natively instead of wrapping Chromium or Electron, and instead of running the Hongguo app inside an Android emulator.

  Douyin mode: browse the Orbit feed, watch live rooms, and read or post comments and danmaku. Public content can be watched without signing in.
  Hongguo mode: watch free Hongguo short dramas and animated dramas on the desktop without logging in, with episode following, rankings, categories, search and actor pages.
  Native hardware playback: Media Foundation with D3D11 GPU textures on Windows and AVFoundation on macOS, so no FFmpeg binaries or paid Windows Store HEVC extension are required.
  Built-in decryption: pure Go streaming ISO-BMFF CENC decryption for Hongguo media, plus native HEIC and HEIF cover decoding.
  Local and private: credentials, follow history and preferences stay on the machine, with no telemetry or analytics collection.
  Lightweight updates: signed delta hot updates reduce the download size of routine upgrades.
