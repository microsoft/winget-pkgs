ReleaseNotes: |-
  - 播放时不再熄屏：抖音视频、直播与红果短剧播放期间保持屏幕常亮，不必再去调电源与显示设置；「听抖音」时只防止电脑睡眠、允许熄屏；暂停、播放出错或离开播放页后恢复系统原有的休眠设置。
  - 修复清晰度按钮显示与实际不符：选了 4K 后滑到没有 4K 的视频，按钮会显示实际播放的档位（如 1080P），不再一直显示 4K；你的清晰度偏好保持不变，遇到有 4K 的视频仍按 4K 播放。
  - 红果短剧切集加上滑动动画：滚轮、方向键、「上一集 / 下一集」以及播完自动进入下一集时，与抖音一样上一集上滑离开、下一集从下方滑入，不再硬切。
  - 设置页重新设计：改为左侧导航分页（播放、弹幕、红果短剧、账号、更新），弹窗加宽到 720×520，按组放进圆角卡片，行距加大、说明精简，不再需要滚动；在红果模式打开设置时直接定位到「红果短剧」页；签名服务地址与 Token 在输入框失去焦点、切换页面或关闭设置时自动生效，去掉了重复的「应用配置」按钮。
