ReleaseNotes: '- 修复弹幕滚动一顿一顿、忽快忽慢的问题：弹幕位置改为按每一帧自身的时间计算，不再受弹幕层在一帧内绘制早晚（144 Hz 下实测 09 毫秒）的影响。同一条弹幕每帧移动距离从在 0.52 像素之间跳动变为稳定在约 1.25 像素，抖音点播、抖音直播与红果短剧弹幕均生效。'
