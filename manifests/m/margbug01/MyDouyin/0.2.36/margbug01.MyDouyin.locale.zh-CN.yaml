PackageIdentifier: margbug01.MyDouyin
PackageVersion: 0.2.36
PackageLocale: zh-CN
ShortDescription: 开源原生抖音与红果短剧桌面客户端。
Description: |-
  MyDouyin 是一款使用 Go 与 MyGo 界面框架构建的开源原生桌面客户端，在一个窗口内同时提供抖音（MyDouyin）与红果短剧（MyHongguo）两种模式，支持 macOS（Apple Silicon）与 Windows 10/11（x64）。它直接原生绘制界面并调用系统硬件解码，不使用 Electron 或常驻 Chromium 内核，也无需安卓模拟器即可在电脑观看红果短剧。

  抖音模式：刷引力场、看直播、浏览评论与弹幕，支持免登录观看公开内容，也可在应用内扫码登录后点赞、评论与同步历史。
  红果短剧模式：电脑端免登录观看免费短剧与漫剧，包含剧集评论、弹幕、续播、榜单、分类、搜索与演员主页。
  原生硬解：Windows 使用 Media Foundation 配合 D3D11 GPU 纹理，macOS 使用 AVFoundation，无需 FFmpeg 可执行文件，也无需付费的 Windows 商店 HEVC 扩展。
  内置解密：纯 Go 流式 ISO-BMFF CENC（AES-128-CTR）解密红果媒体，并支持 HEIC/HEIF 封面原生解码。
  本地与隐私：登录凭证、追剧记录与偏好设置仅在本机运行和存储，不收集任何遥测或统计信息。
  轻量更新：支持签名增量热更新，常规升级只需下载较小的差异包。
Tags:
