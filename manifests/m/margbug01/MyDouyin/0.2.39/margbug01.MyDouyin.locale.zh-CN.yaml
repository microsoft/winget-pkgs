ReleaseNotes: |-
  - 新增合并重复弹幕：同一句在飞过屏幕期间只出一条，后面跟一个次数胶囊，如「来了 ×12」。次数越多颜色越热：2–9 金黄、10–49 橙、50 以上抖音红。判断同一句时不看空格、标点和大小写，「来了」「来了！」「来 了～」算一句。直播里后到的重复会让次数实时增长。抖音点播、直播和红果短剧都生效，默认开启。
  - 新增弹幕屏蔽词：「设置 → 弹幕 → 过滤」里输入词、回车添加，点词旁的 × 删除；含这些词的弹幕不再显示，不分大小写，只保存在本机。播放器的弹幕设置里也加了「合并重复」开关和「屏蔽词」入口。自己发的弹幕不受合并和屏蔽影响。
