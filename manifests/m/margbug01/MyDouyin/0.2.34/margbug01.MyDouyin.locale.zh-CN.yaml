ReleaseNotes: |-
  - 修复设置页下拉选择弹窗背景透明，与下层选项文字重叠的问题：在设置弹窗内恢复不透明的弹窗主题底色，清晰度及全部弹幕样式下拉框在深色和浅色模式下均以实底显示。
  - 优化弹幕滚动流畅度与清晰度：取消 60 fps 分频上限，改为按显示器原生刷新率（如 144 Hz / 120 Hz）仅重绘弹幕层，消除每 0.5 秒一次的节奏掉帧卡顿；同时通过 GPU 亚像素平移渲染每条弹幕，消除整像素吸附和 8 方向描边相位抖动，单帧分配减少约 90%。
