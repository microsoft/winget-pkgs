- 红果短剧
ReleaseNotes: |-
  - 新增 MyTikTok 模式（感谢 @uttogg，#6）：左上角品牌菜单选「MyTikTok」或按 ⌘3 / Ctrl+3 进入，和 MyDouyin、MyHongguo 并列。可以刷 For You、关注和直播，看评论、点赞、收藏、关注、发评论，切回抖音时两边的页面和账号各自保留。
  - 视频自带的多语言字幕会显示在画面上，外语字幕默认自动译成中文；文案下方有「查看翻译 / 查看原文」。两个开关在「设置 → 播放 → 字幕」。
  - TikTok 自动使用系统代理（macOS 的网络代理设置、Windows 的 Internet 选项），也可以在 MyTikTok 里的「设置 → 账号 → TikTok 网络」手动填 http:// 或 socks5:// 代理。这个代理只给 TikTok 用，抖音和红果短剧不受影响。
