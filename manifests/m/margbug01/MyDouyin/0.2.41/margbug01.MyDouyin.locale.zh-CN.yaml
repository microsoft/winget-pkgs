ReleaseNotes: |-
  - 新增跳过直播（感谢 @learningman852，#9）：「设置 → 播放 → 跳过直播」打开后，推荐、关注、朋友、精选、引力场和搜索里不再出现直播间，已经载入的直播间也会立即拿掉；侧栏的「直播」页不受影响。在视频流里刷到直播间时，底栏多一个「跳过直播」按钮，点一下就开启并跳到下一个视频。连着几批拉到的都是直播时会停下提示，再点一次左侧栏即可刷新。
  - 弹幕播放更省电：每条弹幕只画一次，飞行时整条平移，弹幕多、描边重的时候 GPU 占用从三成左右降到一成左右，CPU 也少了三到四成。弹幕仍按屏幕原生刷新率滚动，描边、投影、半透明和次数胶囊看起来和以前一样。
