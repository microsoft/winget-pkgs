ShortDescription: Saves every new lecture slide from your screen automatically.
Description: |-
  SNapp (Every Slide. One Place.) watches your screen during lectures and saves each new slide as an image, cropped to the slide.
  It skips duplicates, pauses while a video plays, can start and stop on a class schedule, and offers a phone remote over local Wi-Fi.
  Slides can optionally be backed up to Google Drive, sorted by date. It runs quietly in the system tray.
