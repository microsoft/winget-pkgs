ShortDescription: Tray app that sends PC hardware sensors to Home Assistant via MQTT with auto-discovery.
Description: |-
  A lightweight Windows tray app that publishes CPU, GPU, RAM, drive, network and battery sensors
  via MQTT with native Home Assistant discovery, or as JSON over UDP, TCP and Serial
  (e.g. for an ESP32 status display). Sensors are read via LibreHardwareMonitor.
  Runs elevated, because CPU temperature and power need LibreHardwareMonitor's kernel driver.
