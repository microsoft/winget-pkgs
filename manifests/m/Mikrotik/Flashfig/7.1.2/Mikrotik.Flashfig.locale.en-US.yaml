ShortDescription: Flashfig is a MikroTik tool for fast and automated configuration of RouterBOARD devices during production.
Description: |-
  Flashfig is a MikroTik tool that lets you quickly apply a predefined configuration to RouterBOARD devices over the network, which is especially useful for provisioning many devices during production.

  Flashfig runs on a Windows computer and serves a configuration to a device that boots from the network (Etherboot). When the device starts up in Etherboot mode and reaches the Flashfig server, the prepared configuration is written to the device.

  The Flashfig version should match the RouterOS version you intend to deploy.
