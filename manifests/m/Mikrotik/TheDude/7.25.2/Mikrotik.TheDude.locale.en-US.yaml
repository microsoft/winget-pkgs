ReleaseNotes: |-
  What's new in 7.25.2 (2026-11-20):

  *) bgp - fix BGP VPN filters not applying comment, bgp-igp-metric and bgp-weight;
  *) bgp - fix BGP VPN import filters not applying distance, scope and target-scope;
  *) bgp - fix ROUTE-REFRESH messages not being counted in session statistics;
  *) bridge - fix dual-bond hosts being dropped when an MLAG peer is lost;
  *) bridge - fix incorrect root-path-cost calculation in MLAG when the root bridge is on a single-connected port;
  *) bridge - fix LACP system ID not being synchronized when bonds are created before MLAG;
  *) bridge - fix MLAG restarting when hardware offloading is re-enabled;
  *) bridge - fix packets being looped back to a dual-connected bond in MLAG setups;
  *) bridge - rate-limit MLAG FDB sync warnings and include the failing MAC and VID;
  *) certificate - fix services continuing to use the previous certificate after ACME renewal;
  *) console - fix import failing on routing table references in exported configuration (introduced in v7.25);
  *) discovery - fix LLDP neighbor version and board not being shown (introduced in v7.25);
  *) discovery - process CDP version 2 frames;
  *) dns - improve service stability on HTTP/2 DoH connections;
  *) ethernet - fix interface names changing after reboot with a USB Ethernet adapter on mmips devices;
  *) ethernet - improve stability on RB5009 devices;
  *) evpn - fix VNI staying stopped after an EVPN instance parameter change;
  *) hotspot - fix flash prefix being added to html-directory on devices without flash storage;
  *) ipsec - fix IKEv2 peers disconnecting when viewing installed SAs in WinBox;
  *) ipsec - fix policies remaining in the invalid state after adding another policy (introduced in v7.25);
  *) ipsec - fix state sequence errors with UDP traffic on TILE devices;
  *) ipsec - fix xfrm interface creation;
  *) ipsec - improve stability with Qualcomm crypto accelerator, also for ovpn;
  *) ipsec - improve stability with the safexcel accelerator;
  *) ovpn - improve stability during session teardown;
  *) ovpn - restore hardware AES-GCM acceleration on Alpine devices;
  *) pim - improve stability (introduced in v7.25);
  *) rip - fix the default route not being advertised with originate-default=always (introduced in v7.16);
  *) route - fix automatic router-id selection picking an inactive /routing/id entry;
  *) route - fix incorrect ping behavior with VRF routing tables;
  *) route - fix routing process getting stuck after moving a routing rule;
  *) route - fix traffic not passing through dynamically leaked VRF-Lite routes;
  *) routing-filter - fix deleting large BGP communities with a regexp-only community list;
  *) switch - fix DHCP clients not binding with dhcp-snooping enabled on CRS1xx/2xx series switches;
  *) switch - fix incorrect STP port state after reboot;
  *) system - improve stability (includes CVE-2026-63887, CVE-2026-64320, CVE-2026-68431);
  *) system - update the device-mode allowed downgrade versions;
  *) usb - fix USB 1.1 devices not working on Tilera CCR devices;
  *) webfig - fix IP address field edits not being saved (introduced in v7.25);
  *) webfig - fix missing entries in the wireless frequency list (introduced in v7.25);
  *) webfig - fix QuickSet name displaying as "undefined" (introduced in v7.25);
  *) webfig - fix Terminal not opening on first load (introduced in v7.25);
  *) wifi - improve stability when disabling an AP with multiple connected stations;
  *) wifi-mediatek - fix station connect failures after an AP band switch (introduced in v7.25);
  *) wireguard - ignore leading and trailing whitespace in peer public keys;
