ShortDescription: Local-first 多设备 AI 项目工作台：统一管理项目、worktree、终端、文件、Git、Mobile Workbench 与自动化交付。
Description: cc-partner 是一款 local-first 多设备项目工作台。它不替模型写代码，而是把本机与局域网远端的项目、worktree、终端、文件、Git、浏览器预览和自动化任务放进同一条可见流程：Agent 在推进，你随时知道它做到哪、卡在哪、接下来怎么交付。它通过 Project → Worktree → Window → Pane 建立清晰边界，在 Workbench 中持续展示终端、会话与阻塞，并可通过 Mobile Workbench 在手机上查看和接手同一项目；Orchestrator 保存验证证据，串起修复、复核、commit、push 与 merge 的交付闭环。
