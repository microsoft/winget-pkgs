ShortDescription: A local-first multi-device project workbench for AI coding workflows, bringing projects, worktrees, terminals, files, Git, Mobile Workbench, and automated delivery into one visible flow.
Description: cc-partner is a local-first, multi-device project workbench. It does not write code for models; instead it puts projects, worktrees, terminals, files, Git, browser previews, and automation tasks on local and LAN-remote devices into one visible flow, so you always know what an agent is doing, where it is stuck, and how it will deliver. Project → Worktree → Window → Pane boundaries keep terminals and branch state clear, the Workbench continuously shows terminals, sessions, and blockers, and Mobile Workbench lets you view and take over the same project from your phone. The Orchestrator keeps validation evidence and closes the delivery loop from fixing and reviewing to committing, pushing, and merging.
