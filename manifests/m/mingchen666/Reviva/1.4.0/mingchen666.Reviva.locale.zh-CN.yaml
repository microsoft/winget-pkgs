ReleaseNotes: |-
  v1.4.0 版本全新发布
  ✨ 本次更新
  1. Reviva 官网发布——> Reviva 官网
  2. 新增知识卡片和学习指南两大创作工具
  3. 优化语音模型配置，支持添加模型功能
  4. 新增语音输入能力，在对话工作台即可支持语音输入，懒人免打字(beta)
  5. 新增图像生成编辑模型配置
  6. 对话输入框支持隐藏显示附件、wiki 知识库、语音输入，tokens 计数器、消耗时间等，更强的自定义能力
  7. 支持 agent 自动安装 skill(支持 github 的 url、作者/仓库名、本地路径/ZIP 导入等，支持更新删除等功能)
  在输入框输入如帮我安装 https://github.com/xx/xxx 这个 skill 到 Reviva agent 即会自动安装到本地
  8. 减少对话过程中 agent 的工具审批同意次数，提升用户体验，可在 "设置-偏好设置-工具审批" 里面设置
  9. 优化一些页面 ui
  🚀 主要能力
  - 以 Agent 为核心的本地 AI 学习工作台
  - 支持切换 Agent、共享上下文和自定义 Agent
  - 支持本地文档、文件夹、 Wiki 知识库和外部知识库对话
  - 支持 Office、PDF、图片、URL、音视频等资料处理
  - 支持音视频转录、关键帧提取和媒体内容问答
  - 支持测验、闪卡、思维导图、知识图谱、图表、PPT、播客和深度研究
  - 支持笔记、Wiki 知识沉淀和全局 Agent 记忆
  - 支持自定义模型、OCR、语音输入和数据备份
  📦 下载安装
  请根据自己的系统和处理器架构下载对应安装包：

  | 平台            | 文件                                 | 下载                      |
  | --------------- | ------------------------------------ | ------------------------- |
  | Windows x64     | Reviva-Windows-1.4.0-x64-Setup.exe   | GitHub Release · 夸克网盘 |
  | Windows ARM64   | Reviva-Windows-1.4.0-arm64-Setup.exe | GitHub Release · 夸克网盘 |
  | macOS Intel x64 | Reviva-Mac-1.4.0-x64-Installer.dmg   | GitHub Release · 夸克网盘 |
  | macOS ARM64     | Reviva-Mac-1.4.0-arm64-Installer.dmg | GitHub Release · 夸克网盘 |

  夸克网盘链接会打开安装包目录，请选择与系统和处理器架构对应的文件。
  完整安装说明请查看项目 README。
  升级前建议先通过 Reviva 的备份功能保存重要数据。
  从旧版本升级时：
  1. 退出正在运行的 Reviva
  2. 建议备份本地数据库和重要资料
  3. 下载并安装 v1.4.0
  4. 启动后检查模型、工作目录和 Agent 配置
  💬 反馈与交流
  感谢所有参与测试、反馈问题和提供建议的用户。
