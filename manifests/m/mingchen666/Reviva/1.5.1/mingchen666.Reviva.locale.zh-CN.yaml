ReleaseNotes: |-
  v1.5.1 发布
  ✨ 本次更新
  2. 新增化学、数学、物理三个讲解视频技能，支持把题目生成带中文配音和动画的讲解视频，已适配平台并绑定到对应学习助手与教学教研助手，感谢原作者的开源！
