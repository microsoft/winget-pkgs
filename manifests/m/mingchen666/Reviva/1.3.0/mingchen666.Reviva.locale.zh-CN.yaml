ReleaseNotes: |-
  v1.3.0 版本发布
  ✨ 本次更新
  1. 新增支持用户自定义外部知识库（基于 KBP 协议）
  Reviva 现已内置 KBP（Knowledge Base Protocol），让 AI 直接检索你的私有文档来回答问题。KBP 仅约定“查询-返回”标准接口，几乎所有提供搜检索 API 的知识库系统均可接入。
  支持的接入方式：
  - Dify / FastGPT：填入 API Key 即可一键获取知识库列表。
  - MCP 服务器：自动发现已有 MCP 检索工具，零配置。
  - 自定义知识库：粘贴 http 请求/响应示例，AI 自动解析生成适配配置。
  对话体验与安全：
  - 侧边栏可选择启用检索。
  - API Key 存储在本地。
  ⚠️ Beta 说明：该功能目前处于 Beta 阶段，核心场景已可用。如遇异常或报错欢迎提交 Issue 反馈。
  2. 优化一些页面的布局与交互细节等
  3. 新增新手教程页面，帮助新手用户快速了解核心功能与操作流程
  4. 用户对话消息支持知识库选中态渲染
  5. 新增内置 teacher-skill，6 大内置 agent 已经绑定
  🚀 主要能力
  - 以 Agent 为核心的本地 AI 学习工作台
  - 支持切换 Agent、共享上下文和自定义 Agent
  - 支持本地文档、文件夹、 Wiki 知识库和外部知识库对话
  - 支持 Office、PDF、图片、URL、音视频等资料处理
  - 支持音视频转录、关键帧提取和媒体内容问答
  - 支持测验、闪卡、思维导图、知识图谱、图表、PPT、播客和深度研究
  - 支持笔记、Wiki 知识沉淀和全局 Agent 记忆
  - 支持自定义模型、OCR、语音识别、权限控制和数据备份
  📦 下载安装
  请根据自己的系统和处理器架构下载对应安装包：

  | 平台            | 文件                                 | 下载                      |
  | --------------- | ------------------------------------ | ------------------------- |
  | Windows x64     | Reviva-Windows-1.3.0-x64-Setup.exe   | GitHub Release · 夸克网盘 |
  | Windows ARM64   | Reviva-Windows-1.3.0-arm64-Setup.exe | GitHub Release · 夸克网盘 |
  | macOS Intel x64 | Reviva-Mac-1.3.0-x64-Installer.dmg   | GitHub Release · 夸克网盘 |
  | macOS ARM64     | Reviva-Mac-1.3.0-arm64-Installer.dmg | GitHub Release · 夸克网盘 |

  夸克网盘链接会打开安装包目录，请选择与系统和处理器架构对应的文件。
  完整安装说明请查看项目 README。
  升级前建议先通过 Reviva 的备份功能保存重要数据。
  从旧版本升级时：
  1. 退出正在运行的 Reviva
  2. 建议备份本地数据库和重要资料
  3. 下载并安装 v1.3.0
  4. 启动后检查模型、工作目录和 Agent 配置
