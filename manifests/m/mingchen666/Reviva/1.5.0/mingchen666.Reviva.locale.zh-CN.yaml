ReleaseNotes: |-
  v1.5.0 发布
  ✨ 本次带来重大更新
  1. 新增新手教程导航链接（新手小白不会使用的可以看这个）
  2. 新增微信 ClawBot，扫码即可连接对话，方便管理(beta)
  3. 新增全局字体自定义设置
  4. 优化一些主题 ui 和修复一些字体颜色，改善 ui
  5. 添加模型后支持自动启用
  6. 模型配置页面支持一键启用和禁用模型
  7. 支持添加自定义模型服务商，选择请求协议、填写名称即可创建自定义模型服务商
  8. 修复 powershell 和 cmd 命令执行全部拦截问题
  9. 新增 Linux 系统安装包支持
  10. 调整 Reviva 关闭最小化托盘菜单，默认显示
  11. 清除工具无效开关
  12. 优化完善 PPT 创作工具
  13. 修复笔记文件夹级联恢复
  14. 新增支持回收站类型：任务记录，对话分组
  15. 新增外部知识库源腾讯 ima 知识库
  16. 默认模型页面 ui 选择器优化
  17. 修复 Mac 打包不内置 officeCLI 问题
  18. 更新 office 相关工具
  19. 完善优化一些页面 ui
  20. 修复一些其他问题……
  升级前建议先通过 Reviva 的备份功能保存重要数据。
  从旧版本升级时：
  1. 退出正在运行的 Reviva
  2. 建议备份本地数据库和重要资料
  3. 下载并安装 v1.5.0
  4. 启动后检查模型、工作目录和 Agent 配置
  💬 反馈与交流
  感谢所有参与测试、反馈问题和提供建议的用户。
  如果遇到问题，请提交 GitHub Issue
  如需交流合作，可以联系作者。
  Reviva 用户交流群
