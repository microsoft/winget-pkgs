ReleaseNotes: |-
  v1.1.0 版本发布
  ✨ 本次更新
  1. 新建学习成长画像功能(beta)
  成长画像模块用于跨对话维护用户的长期学习连续性，让核心 Agent 根据相关画像提供更合适的学习、辅导、复习和能力成长支持。
  2. 新增主题系统，内置 7 套主题随意切换，同时支持用户自定义 css 主题(beta)
  3. 支持自定义 skill 功能，支持导入和创建等。使用前需要配置 skill 默认模型
  5. 新增通用学习助手内置 agent
  6. 优化用量消耗统计可视化
  7. 优化本地网关页面 ui
  8. 删除 beta 相关逻辑和组件
  9. 新增支持：清除系统缓存和临时文件
  9. 调整一些字体按钮大小
  10. 其他更新……
  🚀 主要能力
  - 以 Agent 为核心的本地 AI 学习工作台
  - 支持切换 Agent、共享上下文和自定义 Agent
  - 支持本地文档、文件夹和 Wiki 知识库对话
  - 支持 Office、PDF、图片、URL、音视频等资料处理
  - 支持音视频转录、关键帧提取和媒体内容问答
  - 支持测验、闪卡、思维导图、知识图谱、图表、PPT、播客和深度研究
  - 支持笔记、Wiki 知识沉淀和全局 Agent 记忆
  - 支持自定义模型、OCR、语音识别、权限控制和数据备份
  📦 下载安装
  请根据自己的系统和处理器架构下载对应安装包：

  | 平台            | 文件                                 | 下载                      |
  | --------------- | ------------------------------------ | ------------------------- |
  | Windows x64     | Reviva-Windows-1.1.0-x64-Setup.exe   | GitHub Release · 夸克网盘 |
  | Windows ARM64   | Reviva-Windows-1.1.0-arm64-Setup.exe | GitHub Release · 夸克网盘 |
  | macOS Intel x64 | Reviva-Mac-1.1.0-x64-Installer.dmg   | GitHub Release · 夸克网盘 |

  macOS 当前仅提供支持 Intel x64 版本。
  夸克网盘链接会打开安装包目录，请选择与系统和处理器架构对应的文件。
  完整安装说明请查看项目 README。
  升级前建议先通过 Reviva 的备份功能保存重要数据。
  从旧版本升级时：
  1. 退出正在运行的 Reviva
  2. 建议备份本地数据库和重要资料
  3. 下载并安装 v1.1.0
  4. 启动后检查模型、工作目录和 Agent 配置
  💬 反馈与交流
  感谢所有参与测试、反馈问题和提供建议的用户。
  Reviva 仍会持续更新维护。如果遇到问题，请提交 GitHub Issue
  Reviva 用户交流群
