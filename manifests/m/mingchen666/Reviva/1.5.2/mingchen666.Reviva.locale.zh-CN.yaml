ReleaseNotes: |-
  v1.5.2 发布
  ✨ 本次更新
  1. Wiki 知识库升级
  - 新增 Agent 提案审核队列，集中查看和审阅 Agent 提交的 Wiki 修改建议
  - 支持查看提案前内容、后内容、diff、原因、来源和证据
  - 支持拒绝、确认和应用提案
  - 应用前需二次确认，高风险提案需显式勾选确认
  - 新增检索评估面板，展示 Recall@5/10、MRR、引用有效率
  - 支持手动运行评估，查看搜索/引用/覆盖/Lint 健康分
  - Agent 只能提交提案，不能确认、应用或改评估集
  - 页面基线变化后旧提案自动拒绝，防止误覆盖
  - 已有 Wiki 内容不自动改写，无需数据库迁移，旧库可直接升级
  - 修复提案审核队列不显示、已确认提案无法应用等问题
  注如遇到报错请向作者反馈
  2. 修复 fs is not defined 报错问题
  升级前建议先通过 Reviva 的备份功能保存重要数据。
  从旧版本升级时：
  1. 退出正在运行的 Reviva
  2. 建议备份本地数据库和重要资料
  3. 下载并安装 v1.5.2
  4. 启动后检查模型、工作目录和 Agent 配置
  💬 反馈与交流
  感谢所有参与测试、反馈问题和提供建议的用户。
  如果遇到问题，请提交 GitHub Issue
  如需交流合作，可以联系作者。
  Reviva 用户交流群
