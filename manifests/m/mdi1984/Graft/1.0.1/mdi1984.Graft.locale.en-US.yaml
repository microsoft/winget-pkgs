ShortDescription: An opinionated git client for Windows, built around worktrees and reviewing what your coding agents did.
Description: |-
  Graft is a fast git client for Windows. Every worktree sits in the sidebar with its changes, so you can review an agent's work before it becomes a pull request, comment on lines and copy the comments back to the agent, try the result in your main folder, and clean up finished branches and worktrees in one go.
  It runs your own git.exe for everything that changes the repository, so hooks, config and Git Credential Manager keep working.
