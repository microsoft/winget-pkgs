ReleaseNotes: |-
  本次更新带来钩子（Hooks）、下一句建议和更灵活的定时任务，Agent 提问方式可按习惯自由切换，还新增了自动模式，内置浏览器支持多设备预览，后台任务进度随时可查。让常用流程自动完成，任务进展更清楚。
  新增与优化
  - 钩子（Hooks）上线：在「设置 › 插件 › 钩子」中设定命令，Agent 会在任务关键环节自动执行，可全局生效或只对某个项目生效。
  - 下一句建议，帮你想好：回复结束后输入框会给出一句接着发送的建议，按 Tab 填入、Enter 发送，可在「设置 › 通用 › 偏好设置」中开启。该功能默认关闭，Beta 期间仅对有效订阅用户的官方模型生效，自定义模型（BYOK）不会生成建议；生成建议会计入所选模型的用量。
  - 定时任务更灵活：定时任务可以接着在已有对话中执行，也新增了只执行一次的「不重复」选项。
  - 多设备网页预览：内置浏览器打开「设备预览」，就能在覆盖电脑、平板、手机的 13 个预览选项间切换，查看网页效果。
  - 后台任务看得见：后台运行的任务集中显示在任务概览中，进度随时可查、可随时停止，完成后会提醒你。
  - Agent 提问，按你的节奏来：在「设置 › 通用 › 提问设置」中可选阻塞、跳过或自动。自动模式会判断问题轻重，关键问题等你回答，其余自动跳过继续做。
