ReleaseNotes: |-
  MiniMax Code 产品焕新
  - 全新视觉体验：品牌与产品视觉焕新，优化交互细节，让日常使用更加顺畅。
  - Agent 能力升级：优化 Computer Use、Mini App、自定义界面外观、Git Graph 面板及 Agent 实时执行动态等体验。
  - M Plan 上线：承接并拓展 Token Plan 的订阅能力，订阅价格与文本使用额度保持不变，部分档位支持包括 H3 在内的 MiniMax 全系列模型。

  限时活动
