  - 国庆七日不限量：10 月 1 日至 7 日，所有已订阅用户在 MiniMax Code 内使用 M3.1-Flash-Preview 不限量。
  - 老用户积分回馈：本次更新发布后 24 小时内，为所有 Token Plan 用户发放额外积分福利。
