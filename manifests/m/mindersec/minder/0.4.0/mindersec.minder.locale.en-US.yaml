ReleaseNotes: |
  Minder v0.4.0 includes a number of client improvements alongside minder ruletest improvements and a large push on test coverage from a wave of new contributors, thank you!

  ## Client Changes
  This client release aims to standardize the routing of minder CLI output: structured output (tables, JSON, YAML, etc) will be printed to stdout, while other output and prompts will be printed to stderr. This is intended to make it simpler to incorporate minder into shell pipelines.

  ## New Features
  The CLI’s parsing of various YAML resources has been standardized and tightened, to flag typos and incorrect key locations, which affected a few rules in https://github.com/mindersec/minder-rules-and-profiles. In addition, the content available for ruletest output has been improved by separating the message, error details, and printed output fields for separate comparison.

