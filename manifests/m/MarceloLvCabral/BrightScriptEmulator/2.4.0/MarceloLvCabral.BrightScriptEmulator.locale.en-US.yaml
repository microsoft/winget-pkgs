ReleaseNotes: |-
  This release brings several new features and bug fixes to the BrightScript Simulator. Highlights include the new **Remote Screen** service for WebRTC video streaming, ECP rendezvous tracking for debugging, an 'Allow Remote Access' setting to restrict network services, and a new target command in the debug server. It also includes various bug fixes for the console, startup logic, and window sizing.

  See the **BrightScript Simulation Engine** v2.4.0 [full changelog](https://github.com/lvcabral/brs-engine/releases/tag/v2.4.0) for all the language and framework new features and improvements.

  ## New Features

  - Added the **Remote Screen** service: streams the simulator display to a browser on the local network over WebRTC, with an on-screen Roku remote, keyboard mapping, text entry and a screenshot download — see the [documentation](docs/remote-access.md#remote-screen). by @lvcabral in #322
  - Added 'Allow Remote Access' setting to restrict network services to localhost by @anupamme in #314
  - Implemented Live rendezvous logging via brs-engine API & ECP endpoints by @lvcabral in #320
  - Implemented ECP rendezvous tracking by @lvcabral in #323
  - Added target command handler to debug server by @lvcabral in #325
  - Added ability to copy file path to clipboard by clicking status bar text by @lvcabral in #326
  - Added option to clear console on startup and implement trigger in engine events by @lvcabral in #331

  ## Bug Fixes

  - Fixed: align localStorage key so 'don't show again' checkbox persists by @lvcabral in #317
  - Fixed: drop remote connections on local-only toggle and document the setting by @lvcabral in #318
  - Fixed: restore minimum window size overridden by custom-electron-titlebar by @lvcabral in #319
  - Fixed: reverted ECP rendezvous tracking IPC calls linked with the Debug service by @lvcabral in #321
  - Fixed: console buffer losing warning/error coloring when editor opens late by @lvcabral in #327
  - Fixed: startup race between queued app launch and auto-start logic by @lvcabral in #328
  - Resolved npm audit findings without breaking minimatch@3 chain by @lvcabral

  ## Testing & Tooling

  - Run ESLint and Prettier as a CI job, fix pending lint errors by @lvcabral in #329

  ## Dependency Bumps

  - Bump fast-uri from 3.1.4 to 3.1.5 by @dependabot in #324
  - Bump js-yaml from 4.3.0 to 4.3.1 by @dependabot in #330

  ## New Contributors
  - @anupamme made their first contribution in #314

  Full Changelog: https://github.com/lvcabral/brs-desktop/compare/v2.3.0...v2.4.0
