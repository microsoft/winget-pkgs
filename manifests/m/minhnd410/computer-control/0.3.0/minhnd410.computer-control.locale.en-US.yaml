ShortDescription: Cross-platform desktop and mobile-simulator automation with an MCP server
Description: |-
  A C++20 core for driving a desktop and the phones on it, shipped as an MCP
  server with a static library for embedding.

  On Windows it uses SendInput for keyboard and mouse, InjectTouchInput for real
  multi-touch contacts, UI Automation for the element tree, and GDI for capture.
  Coordinates carry an explicit space, so per-monitor DPI scaling is handled
  rather than approximated.

  Note for WSL users: a Linux build inside WSL cannot control the Windows
  desktop - WSLg is one-directional. Install this Windows package and have WSL
  launch it over interop.
