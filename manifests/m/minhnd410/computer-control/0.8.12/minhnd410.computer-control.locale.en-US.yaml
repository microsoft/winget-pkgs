ShortDescription: Cross-platform desktop and mobile-simulator automation with an MCP server
Description: |-
  A native MCP server for desktop and mobile automation across Windows, macOS,
  and Linux. It provides screenshots, input, accessibility queries, window and
  app control, gestures, and simulator or mirrored-device control.

  On Windows it uses SendInput for keyboard and mouse, InjectTouchInput for
  touch contacts, UI Automation for the element tree, and GDI for capture.
  Coordinates carry an explicit space so per-monitor DPI scaling is handled.

  WSL users should install this Windows package to control the Windows desktop
  and launch it from WSL through Windows interop.
