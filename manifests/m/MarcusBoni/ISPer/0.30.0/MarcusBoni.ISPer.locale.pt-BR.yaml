ReleaseNotes: |-
  As reuniões ganham lugar. A tela Projetos organiza todas elas por projeto,
  no lugar das pastas do Gerenciador de Arquivos, e toda reunião sai com o
  projeto ou o ISPer pergunta qual é. "Otimizar" limpa a transcrição ao lado
  da original, e a reunião vai pronta para outro agente de IA num toque. O
  banco passa para a versão 11 (uma cópia da versão anterior é guardada antes
  de migrar).
  Adicionado
  - A tela Projetos. Um item novo na barra lateral reúne as suas reuniões
    por projeto, no lugar das pastas: cada projeto mostra quantas reuniões e
    quanto tempo teve, as tarefas abertas, o que se validou nas reuniões e as
    reuniões por mês com o começo do resumo; clicar abre na Biblioteca. "Sem
    projeto" junta as que faltam organizar, com "Mover para…" em cada uma, e
    dá para excluir do histórico com Desfazer.
  - Reunião pronta para agente. "Copiar para agente" na Biblioteca copia a
    reunião inteira em Markdown para colar noutro agente de IA: cabeçalho com
    data, projeto e participantes, uma linha explicando quem é "Eu" e
    "Participante N", o resumo, o que foi validado no Copilot, as notas, os
    momentos e as falas com horário (na versão que está na tela). A exportação
    "Agente" grava o mesmo arquivo com um nome padronizado: data, projeto e
    assunto.
  - Otimizar a reunião. Na Biblioteca, "Otimizar" pede à IA uma versão
    limpa de cada fala: sem hesitações, repetições e falsos começos, com os
    erros de transcrição corrigidos e o trecho ambíguo marcado com [?], sem
    mudar o que foi dito. A original continua guardada; o alternador
    Otimizada/Original troca a tela, e copiar e exportar levam a versão que
    está nela. O assistente cita a fala limpa. O banco passa para a versão 11
    (uma cópia da anterior é guardada antes de migrar).
  - Projetos na tela. Em Configurações → Projetos você cria, renomeia,
    dá cor e apelidos e arquiva os seus projetos, e traz do OptTime só os que
    escolher (um de mesmo nome é ligado, não duplicado). A Biblioteca mostra o
    projeto de cada reunião, filtra por projeto (ou pelas sem projeto) e deixa
    escolher, trocar ou confirmar o projeto sugerido; as tarefas abertas da
    reunião acompanham. O Hoje ganha o selo, o seletor e o filtro de projeto
    nas tarefas.
  - Toda reunião com projeto, ou a pergunta. A reunião sem convite (a
    chamada avulsa, o áudio importado, a gravação do celular) também ganha o
    projeto quando o nome ou um apelido aparece no título. Sem certeza, o aviso
    de "reunião salva" diz "sem projeto" e abre a reunião para você escolher.
  Corrigido
  - O aviso de "gravação transcrita" mostrava {actions} cru no texto.
  Segurança
  - url 2.5.9: corrige o estouro de pilha em Url::origin() com endereços
    blob: aninhados (RUSTSEC-2026-0592).
