ShortDescription: Animated desktop wallpapers for Windows that rest when you work.
Description: |-
  Sarab plays videos, GIFs, web pages and pictures behind your desktop icons on every display.
  It freezes the wallpaper when an app covers the screen, the laptop runs on battery, or the screen is locked, so it stays light on old PCs.
  English and Arabic, light and dark themes.
