ShortDescription: Run several accounts of the same app at once on Windows, each in its own isolated instance.
Description: |-
  Mezi opens Windows apps in isolated instances. Each instance keeps its own logins, settings and cache, so you can keep a personal and a work account of apps like Claude, ChatGPT, Discord or VS Code open side by side.
  It also includes Mezi Box (beta), its own sandbox where apps can only write inside the instance.
  The free plan allows up to 2 instances per app, 5 apps and 1 open instance at a time. The optional Mezi Pro subscription removes these limits.
