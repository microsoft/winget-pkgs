ReleaseNotes: |-
  - Clone (Pro): create an instance from the app you already use, with its logins and settings.
  - Mezi Pro with a 7-day free trial: a card is required, and you aren’t charged if you cancel before the trial ends.
  - Better security: the installed Mezi no longer accepts outside debugging and checks the integrity of its own files.
  - Fixed the automatic update progress bar.
