ShortDescription: Use várias contas do mesmo app ao mesmo tempo no Windows, cada uma na sua própria instância isolada.
Description: |-
  O Mezi abre aplicativos do Windows em instâncias isoladas. Cada instância guarda os próprios logins, configurações e cache, então você pode deixar uma conta pessoal e outra do trabalho de apps como Claude, ChatGPT, Discord ou VS Code abertas lado a lado.
  Também inclui a Mezi Box (beta), um sandbox próprio em que os apps só conseguem gravar dentro da instância.
  O plano grátis permite até 2 instâncias por app, 5 apps e 1 instância aberta por vez. A assinatura opcional Mezi Pro remove esses limites.
