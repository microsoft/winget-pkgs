ShortDescription: EPA SWMM model editor with 2D overland flow and storm sewer design. Free 30-day trial.
Description: >-
  AquaSWMM (formerly StormSewer) designs and analyses gravity storm sewer networks: Rational method
  hydrology, Manning capacity for circular, box, elliptical and arch conduits,
  and a standard-step gradually-varied HGL/EGL backwater profile with junction
  losses and tailwater. It includes HEC-22 inlet interception with bypass
  carryover between structures, standard-pipe auto-sizing against velocity and
  percent-full criteria, and NOAA Atlas 14 rainfall import.

  Networks can be drawn over a scaled background image or imported from
  Hydraflow STM, DXF, or LandXML. Reports export as a submittal PDF with a title
  block on every page, ruled pipe, structure and inlet schedules, a scaled plan,
  and a profile with elevation and station axes; HTML, DXF, LandXML, and custom
  CSV report templates are also supported.

  It is also an editor for EPA SWMM models: map, property sheet, attribute
  tables and every project dialog with undo, run on the installed EPA engine,
  results on the map, profiles and plots, 2D overland flow on a DEM with 1D-2D
  coupling at manholes, inlets, channel banks and outfalls, GIS import and
  export, scenarios and calibration.

  Commercial software with a free 30-day trial (no card). Without a licence key
  it opens in viewer mode: models and results open and display, while running,
  saving and exports need the trial or a licence. Releases up to 0.11.0 remain
  GPL-3.0-or-later.
