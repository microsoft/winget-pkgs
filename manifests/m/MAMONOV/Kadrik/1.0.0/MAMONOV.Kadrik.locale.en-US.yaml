ShortDescription: Drop a video and Kadrik extracts sharp frames (photos) for you.
Description: >-
  Kadrik is a small, simple Windows tool. Drag a video into the window and it
  cuts it into sharp frames (photos). It detects scene changes and keeps the
  clearest frames. Everything runs locally on your computer and nothing is sent
  anywhere. This is a 3-day demo with full features; the full version is
  available at evgeniymamonov.com.
ModerationDisclaimer: >-
  Demo version limited to 3 days. The full license is sold on the author's
  website.
