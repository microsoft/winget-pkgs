ShortDescription: Offline speech-to-text for Windows. Dictate and get text instantly.
Description: >-
  Diktik (VoiceNote) is a small, simple Windows tool that turns your speech into
  text. It works fully offline on your computer, so nothing is sent anywhere.
  Just speak and get your words as text you can copy and save. This is a demo
  with full features; the full version is available at evgeniymamonov.com.
