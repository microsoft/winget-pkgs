ShortDescription: One machine, many Claude & Codex accounts. Work, personal, clients, kept apart.
Description: |-
  keepapart gives each of your Claude Code and Codex accounts its own isolated profile
  (CLAUDE_CONFIG_DIR / CODEX_HOME), so work, personal and client accounts never mix and
  can run side by side. You log in with the official CLIs; keepapart never reads, copies
  or moves credentials and makes no network calls.
