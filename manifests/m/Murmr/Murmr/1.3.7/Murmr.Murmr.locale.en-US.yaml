ShortDescription: Private AI dictation that runs locally. Unlimited and free for life.
Description: |-
  Murmr is AI dictation that runs entirely on your own computer. Press a key, talk, and clean text appears wherever your cursor is.
  Dictation is unlimited and free for life, works offline, and your voice never leaves your machine. Free includes a Style Picker (Raw, Polished, Casual, Formal, Concise), searchable dictation memory, Obsidian-compatible notes, and .txt/.docx export.
  An optional one-time Pro upgrade adds a personal dictionary, direct-to-notes dictation, lookup anywhere, summaries, media transcription and subtitles, text-to-speech, and Ask AI.
