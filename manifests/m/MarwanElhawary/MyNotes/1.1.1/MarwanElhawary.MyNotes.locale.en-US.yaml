ShortDescription: Sticky notes for Windows in Arabic and English, with to-do lists, reminders and an encrypted password vault.
Description: |-
  My Notes (ملاحظاتي) is a free sticky-notes app for Windows, fully in Arabic and English.
  Notes with rich text, tables and pictures; to-do lists with due dates, reminders, repeats and subtasks;
  a "My day" view of every task; colour-highlighted code notes; quick search from anywhere;
  an encrypted password vault (AES-256) with two-factor codes, a security report and breach check;
  earlier versions of every note, daily backups, printing and Markdown export; optional sync between your PCs;
  dark mode and signed automatic updates. Installs per user, no administrator rights needed.
