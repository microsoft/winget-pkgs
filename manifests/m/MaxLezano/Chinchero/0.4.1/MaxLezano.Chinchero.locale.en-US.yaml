ShortDescription: "Free digital corkboard for Windows: pin notes, photos, lists and stickers and connect them with strings."
Description: |-
  Chinchero is a free, open source digital corkboard. Pin sticky notes, photos, links, files, lists and stickers on boards, connect them with strings like a detective board, and organize ideas, projects, studies or trips in boards and sheets.
  It works offline, keeps everything on your PC and updates itself. The interface is in Spanish.
