ShortDescription: 面向译员的计算机辅助翻译（CAT）环境。
Description: |-
  memoQ translator pro 是一款运行于 Microsoft Windows 的计算机辅助翻译工具，由译员为译员设计，帮助所有从事翻译、编辑和审校工作的人员提升效率与质量。

  复用您的翻译
  借助 memoQ translator pro，您可以在翻译过程中自动复用以往的翻译、创建术语表、添加参考资料、使用联想输入，并从许多其他资源中获取建议。

  术语库
  无需离开当前翻译界面，即可向术语库添加单词和表达。只需一次击键，便可轻松导入表格或外部术语库文件。如果您手头只有纯文本，memoQ 还能为您自动提取潜在术语。
  此外，memoQ 会在翻译中自动高亮术语——同样只需一次击键即可直接插入译文术语。如果您使用了未包含在术语库中的术语，系统会发出警告；若需要替换某些内容，您还可以一次性在多个文档中批量查找并替换文本。

  翻译记忆库
  您无需对任何内容进行重复翻译。由于所有句段都会保存在翻译记忆库中，memoQ 会记住您翻译过的每一个句段。当相同或相似的句段再次出现时，memoQ 便会提供先前的翻译。
  为保证检索结果的绝对精准，memoQ 的翻译记忆库在双语方向上都会保留上下文信息，并存储文档名称、作者和创建日期等附加信息。
  若要查找单词或短语，可以在翻译界面中直接调用语境检索。memoQ 不仅能指出该表达在翻译记忆库中的位置，还能推测其在完整译文句段中对应的翻译。

  提高效率
  如果您需要重用旧文档，可以将其添加到 LiveDocs 并用作参考资料。
  当您同时拥有源文档及其对应译文时，LiveDocs 是您的理想之选。添加双语文档对后，memoQ 会立即对其进行对齐，并从对齐的文档中提供匹配内容。
  LiveDocs 还可以让您将双语文件当作翻译记忆库使用，为整篇文档提供预览与上下文信息。不仅如此，LiveDocs 甚至能让单语文本文档发挥价值。虽然单语文件不包含译文，但您可以通过语境检索在其中查找相应的表达。
  The Muse 为您提供出色的联想输入体验。它通过现有的翻译资源（翻译记忆库和 LiveDocs）进行训练。完成训练后，The Muse 会在您键入时自动预测接下来的几个词。这能显著加快翻译速度——更棒的是，您并不需要海量的翻译数据即可投入使用。

  协作
  借助 memoQ translator pro，您可以与任何使用 memoQ server 的公司展开合作。只需直接接收客户从 memoQ server 发来的任务，即可轻松获得更多项目！即使您的客户使用其他翻译环境也完全不成问题——memoQ 可以兼容并接收绝大多数主流翻译工具的项目包。
