ShortDescription: Offline budget planner and expense tracker for Windows. No account, data stays on your PC.
Description: |-
  Personal Finance Intelligence (PFI) is a native Windows app for budgets, expenses, debt payoff and investments.
  Import bank statements (CSV, OFX/QFX, QIF, CAMT.053), let categories learn from your own choices, plan budgets
  and savings goals, compare debt payoff strategies, and forecast cash flow. Everything is stored in one local
  SQLite file; there is no account and no cloud. English, French and Arabic.
