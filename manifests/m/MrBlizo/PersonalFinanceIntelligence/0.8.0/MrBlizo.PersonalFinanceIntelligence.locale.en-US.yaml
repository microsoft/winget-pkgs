ShortDescription: Free envelope budget app for Windows and Android. No account; your data stays on your devices.
Description: |-
  Personal Finance Intelligence (PFI) is a free, open-source budget app for Windows with a companion Android app.
  Give every dollar a job with envelope budgeting, import bank statements (CSV, OFX/QFX, QIF, CAMT.053) with
  learned categories and duplicate checks, or fetch new transactions automatically with your own SimpleFIN Bridge
  (US/Canada) or Enable Banking (Europe) access. Track goals, bills, debts and investments, and forecast cash flow.
  Data is stored in one local SQLite file; optional sync is end-to-end encrypted through your own OneDrive or
  Google Drive. English, French and Arabic.
