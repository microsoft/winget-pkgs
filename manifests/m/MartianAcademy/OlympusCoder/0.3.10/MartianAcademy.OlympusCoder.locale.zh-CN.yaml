PackageIdentifier: MartianAcademy.OlympusCoder
PackageVersion: 0.3.10
PackageLocale: zh-CN
ShortDescription: 统一管理所有 ACP 编码代理的桌面应用，支持共享项目记忆、多代理编排、内置代码工作台以及端到端加密的手机访问。
Description: |-
  Olympus Coder 是一款本地优先、开源的桌面与无头（headless）工作区，用于运行 Agent Client Protocol（ACP）编码代理。它用一个原生界面统一接管 Claude Code、Codex、Antigravity、Gemini CLI、Qwen Code、OpenCode、Ollama 等编码 CLI，并提供共享项目记忆、并行代理编排、内置代码工作台和端到端加密的手机访问。

  多代理 ACP 中枢与共享的 ~/.olympus 记忆
  - 可以在对话中随时切换代理并交接工作：在 Antigravity 中排查问题，在 Claude Code 中实现，再让 Codex 在同一会话里给出只读的第二意见，此前的目标、对话轮次和改动文件都会随之传递。
  - ~/.olympus 下的两级持久化记忆：所有代理共享 MEMORY.md、INSTRUCTIONS.md、BUGS.md、AGENTS.md、技能与各代理的会话记录，不再分散在各自的厂商目录中。
  - 可将兼容的代理指向 Anthropic/OpenAI 兼容网关，密钥保存在操作系统钥匙串中；也能通过 ACP 的 session/list 与 session/load 导入已有的 CLI 会话。

  对话时间线、批注与语音
  - 可折叠的时间线把思考过程、文件读取与修改、搜索、MCP 调用和子代理收进同一条记录中。
  - 统一的媒体查看器可缩放浏览对话中的图片、视频、PDF 和附件，并按原始分辨率烘焙批注，同时为代理生成坐标说明。
  - 支持排队发送后续消息、干预正在执行的一轮、自动补全代理的斜杠命令、跟踪上下文占用并压缩会话。
  - 语音听写可使用系统语音、本地 whisper.cpp、OpenRouter 或自建 OpenAI 兼容转写服务；主题、密度、排版均可调整。

  内置代码工作台、Git 工作树与检查点
  - CodeMirror 6 多标签编辑器，支持语法主题、Markdown 与 KaTeX 预览、未保存缓冲区感知，以及可分离的工具窗口。
  - 每轮对话的 shadow-git 检查点提供工作区快照、逐轮差异和一键撤销重做，且不会改动 .git；同时集成 Git 暂存、分支和独立的 Worktree 会话。
  - 多标签 WebGL 终端、重启后仍然保留的常用命令、自动处理端口冲突，以及内置的 localhost 网页预览。

  并行编排与实时任务监控
  - 内置 olympus MCP 服务器，让主导代理派生并行的子会话、在触发配额限制时转向或更换模型、运行常驻终端并管理周期性计划任务。
  - 统一的 Tasks 面板同时观察 Olympus 子会话、原生 CLI 子代理和子进程，显示实时的 CPU 与内存占用，并提供暂停、恢复和停止控制。

  手机与浏览器访问
  - 从 320px 起的响应式手机界面，可通过同一 Wi-Fi 网络或 AES-256-GCM 端到端加密中继访问，支持实时审批、文件编辑、Git 与 PTY 终端。
  - 使用 scrypt 哈希的应用密码保护本地与远程会话，macOS 上还可用 Touch ID 解锁。
