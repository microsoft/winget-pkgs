ReleaseNotes: |-
  Antigravity: Chrome actions and sub-sessions work again

  - Antigravity quietly switches off any MCP tool whose definition is larger than about 650 bytes. Five Olympus tools had grown past that, so in Antigravity chats they failed with tool … is not enabled for server olympus_…:
    - browser_act (click, type, scroll and so on in your Chrome)
    - spawn_subsession, configure_subsession and message_subsession
    - save_schedule
  - All Olympus tools are now well under that size, and a test keeps them there. Checked against a real Antigravity run.

  Everything from v0.3.9 is included (one media viewer with mark-up, Windows npm Claude Code detection, Chrome Web Store extension support).
