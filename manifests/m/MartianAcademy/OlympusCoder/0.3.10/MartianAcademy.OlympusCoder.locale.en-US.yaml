ShortDescription: One desktop app for every ACP coding agent, with shared project memory, multi-agent orchestration, a built-in code workbench and end-to-end encrypted phone access.
Description: |-
  Olympus Coder is a local-first, open-source desktop and headless workspace for Agent Client Protocol (ACP) coding agents. One native workspace covers Claude Code, Codex, Antigravity, Gemini CLI, Qwen Code, OpenCode, Ollama and other coding CLIs, with shared project memory, parallel orchestration, a built-in code workbench and end-to-end encrypted phone access.

  Multi-Agent ACP Hub and shared ~/.olympus memory
  - Switch agents mid-chat and hand work across them: investigate in Antigravity, implement in Claude Code, and ask Codex for a read-only second opinion in the same thread, with prior goals, turns and touched files carried over.
  - Two-tier persistent memory under ~/.olympus: every agent shares MEMORY.md, INSTRUCTIONS.md, BUGS.md, AGENTS.md, skills and cross-agent session transcripts instead of separate vendor folders.
  - Point compatible agents at Anthropic/OpenAI-compatible gateways with operating-system keychain encryption, and import existing CLI sessions through ACP session/list and session/load.

  Chat timeline, media markup and voice
  - A collapsible timeline folds thoughts, file reads and edits, searches, MCP calls and sub-agents into one strip.
  - A shared media viewer zooms and pans chat images, video, PDFs and attachments, and bakes annotations at full resolution with a coordinate legend for the agent.
  - Queue follow-up messages, steer a running turn, autocomplete agent slash commands, track context usage and compact the thread.
  - Dictate with system speech, local whisper.cpp, OpenRouter or a custom OpenAI-compatible transcription server, and tune themes, density and typography.

  Built-in code workbench, Git worktrees and checkpoints
  - A CodeMirror 6 multi-tab editor with syntax themes, Markdown and KaTeX preview, unsaved-buffer awareness and detachable tool windows.
  - Per-turn shadow-git checkpoints give working-tree snapshots, per-turn diffs and one-click undo/redo without touching .git, alongside integrated Git staging, branches and isolated worktree chats.
  - Multi-tab WebGL terminals, saved commands that persist across restarts, automatic port-conflict resolution and an embedded localhost web preview.

  Parallel orchestration and live task monitoring
  - A built-in olympus MCP server lets a lead agent spawn parallel sub-sessions, steer them or switch models on quota limits, run persistent terminals and manage recurring schedules.
  - One Tasks panel watches Olympus sub-sessions, native CLI sub-agents and child OS processes with live CPU and memory meters plus pause, resume and stop controls.

  Phone and browser access
  - A responsive phone UI from 320px screens over the same Wi-Fi network or an AES-256-GCM end-to-end encrypted relay, with live approvals, file editing, Git and PTY terminals.
  - Protect local and remote sessions with a scrypt-hashed app password, and unlock on macOS with Touch ID.
