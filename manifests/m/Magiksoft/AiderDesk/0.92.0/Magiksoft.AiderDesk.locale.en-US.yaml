ReleaseNotes: |-
  Highlights
  🖼️ Local Markdown Image Rendering with Interactive Previews
  When agents output Markdown images referencing local files in your workspace, AiderDesk now renders inline image thumbnails directly inside assistant responses. Clicking any thumbnail opens an expanded preview modal with zoom and pan controls, making it effortless to inspect visual artifacts, generated diagrams, and UI mockups. The image preview server works seamlessly across both desktop and browser sessions.
  📊 Cost-by-Model Breakdown in Usage Dashboard
  The Usage Dashboard now pairs token statistics with an interactive cost-by-model pie chart. Gain instant visual visibility into how your API expenditures are distributed across different models and providers over time, helping you audit expenses and make data-driven decisions on model routing.
  🧭 Severity-Colored Log Markers in Message Map
  The message map sidebar now features severity-colored markers for log entries (info, warn, error). Hovering over any marker displays an instant log preview tooltip, and clicking it scrolls straight to the relevant message in the thread. Navigating long agent runs and diagnosing tool warnings or task errors is now faster than ever.
  🔌 New First-Class Providers: OpenLLM & Atlas Cloud
  We have expanded first-class LLM provider integrations with built-in support for OpenLLM (Thanks @apewithllm) and Atlas Cloud (Thanks @binyangzhu000-sudo), bringing out-of-the-box model catalogs, streaming, and tool compatibility to both ecosystems.
  🧩 Updates to Extension API
  Extension authors get a powerful set of new capabilities in this release:
  - getTaskStates - Support for registering custom task states and workflows (used by the new Custom Task Statuses extension).
  - getTaskDataDir - Direct access to a task-isolated persistent directory on TaskContext for storing task-specific data and caches outside the repository working tree.
  - Private Input Dialogs & Bash Setup - APIs to request sensitive credentials via secure dialogs and configure environment hooks per command (powers the new Sudo Password extension).
  - Tool Cancellation - Added cancellation support to the onToolFinished extension hook so extensions can clean up resources gracefully when runs are interrupted.
  - Transpilation Caching - Extension startup loading is faster thanks to on-disk caching of transpiled files.
  ⚡ Configurable MCP Server Scope & Connection Sharing
  Managing Model Context Protocol (MCP) servers is now significantly more efficient with configurable server scopes (project, task, global). Previously, every active task spawned its own separate MCP server processes. Now, stdio MCP servers share a single process per project by default, drastically cutting memory and process overhead across multiple tasks. Remote HTTP servers default to global scope, while file-manipulating servers can be scoped to task to isolate execution to the task's worktree. Server processes are automatically released when tasks or projects close. Learn more in the MCP Servers documentation.
  Other Changes
  - Performance & Database:
    - Improved database write performance by enabling SQLite WAL mode and normalized synchronization, reducing UI freezes and stutters under concurrent agents.
    - Accelerated extension loading on startup by caching transpiled files on disk.
    - Improved application shutdown speed by disabling unintended OpenTelemetry metrics and log exporters and introducing a structured shutdown controller with tracked cleanup stages.
  - Task Management:
    - Accelerated task list loading by loading archived tasks only on demand, and persisted filter selections per project.
    - Added task ID search matching to the task sidebar search filter.
    - Fixed task sidebar date grouping to preserve the year for older tasks rather than grouping them under current-year days.
    - Fixed inactive and failed tasks resuming on restart, cleaned up stale recovery journals, and ensured redo interrupts active runs.
  - Git & Worktrees:
    - Fixed amend commits including unselected staged changes instead of respecting selected files.
    - Fixed commit message generation excluding selected untracked files.
    - Added copy branch name action to Git branch dropdown menus.
    - Silenced misleading Git warnings when worktree directories were removed during background file refresh.
    - Improved app focus responsiveness by limiting Git refreshes strictly to active tasks and skipping redundant checks.
    - Prevented agent conflict resolution from staging unresolved files or reporting false success after agent errors.
  - UI & Messaging:
    - File path links in messages now resolve accurately against the active worktree, opening locally on desktop and offering file downloads in browser mode.
    - Fixed manual skill commands running without a prompt and ensured the user's triggering message renders before skill activation.
  - Observability & Providers:
    - Fixed Langfuse tracing when LANGFUSE_HOST contains trailing slashes (Thanks @Haarris).
    - Updated OpenCode Go endpoints and model routing.
  - Internationalization:
    - Fixed missing German translations in main-process messages (Thanks @GPT-AGI).
  🧩 Extensions
  - agent-browser: Browser automation tools for agents powered by Chrome and Chrome DevTools Protocol (CDP), featuring accessibility-tree snapshots, interactive element refs, typing, clicking, and visual screenshots.
  - Custom Task Statuses: Define and configure custom task states, labels, and badges to match your team's workflow.
  - Sudo Password: Securely provide sudo credentials to agent commands through private input dialogs without leaking passwords into chat history or terminal logs.
  - LSP: Rewritten with automatic language server installation, awaited diagnostics synchronization, and bounded resource limits.
  - Tree Sitter Map: Background prewarming with an initialization progress banner, cancel/retry controls, compact tag caching, and fast repository map generation.
  - Cursor SDK: Improved model alias resolution.
  - Programmatic Tool Calls: Improved tool name compatibility, accepting alternative separators and resolving collision-suffixed names.
  ❤️ Support AiderDesk: If AiderDesk makes your development workflow better, consider sponsoring Magiksoft on GitHub to help support ongoing development and maintenance!
  💡 We'd love your feedback and contributions! Found a bug, have an idea, or want to submit a PR? Help us make AiderDesk even better on GitHub. Happy coding! 🚀
