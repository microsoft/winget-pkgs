ReleaseNotes: |-
  Highlights
  🗂️ Extension UI Placement: Workspace Sidebar Sections
  Extensions can now embed custom UI components directly into the workspace sidebar using the new workspace-section component placement. Sidebar sections are drag-and-drop reorderable and can be collapsed or hidden, allowing extensions to integrate custom dashboards, monitors, and workflow tools right alongside your project files and git controls.
  🔄 Dynamic Model Fallback & Extended Agent Loop Hooks
  The onAgentStepFinished extension hook received major enhancements with error-step interception, execution step metadata, loop continuation control (continue), and runtime model switching (modelId). This powers the brand new Model Fallback extension, which seamlessly catches rate-limit errors (HTTP 429), quota exhaustion, and subscription entitlement failures to continue the active agent run on a configured secondary model without dropping context or repeating tool calls.
  🗜️ On-Demand Context Compaction & Smarter Edit Notes
  Managing large conversation contexts is now more direct and reliable. A new compact button right next to the token usage bar lets you trigger compaction or smart compaction on demand whenever you choose. Additionally, smart compaction now summarizes previous file edits into consolidated user-side notes rather than synthetic assistant messages, preventing models from mistakenly mimicking placeholder syntax instead of calling actual file edit tools.
  🔐 Cross-Origin MCP OAuth & Streamlined Authentication
  Connecting to remote Model Context Protocol (MCP) servers secured by OAuth is now smoother and more reliable. This update introduces cross-origin OAuth issuer discovery, distinct "Reopen sign-in" and "Start over" controls to recover from interrupted auth flows, and cleanly styled callback landing pages for a frictionless sign-in experience.
  🧩 Redesigned Extensions Settings with Source Filtering & README Dialogs
  Discovering and managing extensions is significantly refreshed. Extensions settings now feature source filtering (Official, Community, Custom), a compact extension list with update-aware version badges, and an integrated README details dialog so you can explore an extension's features and documentation before installing.
  📱 Responsive Mobile Diff View & Workspace UX Polish
  Reviewing code changes on mobile devices is now a first-class experience: the Updated Files diff modal features a responsive portrait layout with slide-in drawers for file selection and change requests. In addition, project tabs reveal close buttons on hover with close confirmations, deleted files display clear strikethrough styling in the diff tree, and the Memories list in settings now includes instant content search.
  Other Changes
  - Extension API:
    - Added skill activation to the extension TaskContext API for external agent integrations.
    - Added workspace-section UI component placement for extensions to render reorderable and hideable sections in the workspace sidebar.
    - Extended the onAgentStepFinished extension hook with error-step dispatch, step metadata, loop continuation control (continue), and mid-run model switching (modelId).
  - Context & Token Management:
    - Added a compact button next to the token usage bar to manually trigger conversation compaction (compact or smart compact).
    - Improved smart compaction of file edits to use a consolidated user-side note instead of synthetic assistant messages, preventing models from imitating placeholder syntax instead of calling edit tools.
  - Model Providers & MCP:
    - Added cross-origin MCP OAuth issuer discovery, separate reopen/start-over sign-in controls, and styled OAuth callback pages.
    - Updated the ClinePass model list with newly available models, removed deprecated ones, and refreshed reference pricing.
    - Fixed tool follow-ups failing on OpenCode Go Luna and Muse models.
  - Headless & Docker Deployments:
    - Added app version resolution for headless and docker deployments across telemetry, versions API, OpenCode Go User-Agent, and the AIDER_DESK_VERSION environment override.
    - Added AIDER_DESK_DISABLE_RECOVERY environment flag to suppress automatic task recovery and startup journal cleanup in secondary instances.
    - Fixed headless npm install crashing at startup with "Cannot find module 'electron'".
  - UI & Navigation Polish:
    - Improved the updated files diff modal to be usable on portrait mobile with slide-in file and change request drawers.
    - Redesigned Extensions settings with source filtering (Official, Community, Custom), a compact extension list, and an in-app README details dialog.
    - Improved project tabs to reveal the close button on hover with a confirmation dialog, and added a close button to the mobile project menu.
    - Added content search to the memories list in memory settings and improved its layout with a fixed-width scope select and scrollable page.
    - Added strikethrough styling for deleted files in the Updated Files tree.
    - Widened file path tooltips in tool messages to fit long paths without clipping.
    - Fixed task sidebar menus and submenus not following their task items when scrolling.
    - Fixed Git branch submenus appearing outside the viewport on small screens.
  - Task Management & Performance:
    - Fixed application shutdown timing out and forcing exit when projects with initialized tasks were open, by disposing extensions after project cleanup and skipping interrupts for idle tasks.
    - Fixed "Thinking..." indicator remaining visible when opening tasks completed from another client.
    - Fixed tasks hanging on load when an extension asks a question during worktree creation.
  - Skills & Agent Tools:
    - Renamed bundled creator skills to create-agent and create-extension and added matching slash-command aliases (/create-agent, /create-extension).
  🧩 Extensions
  - A2UI: Render interactive UI cards (forms, option pickers, confirmation modals, sliders) directly in task chat using the open A2UI protocol, complete with round-trip action feedback and the /a2ui-demo command.
  - Model Fallback: Automatically switch to a secondary fallback model when the active model hits rate limits (HTTP 429), exhausted quotas, or subscription entitlement errors.
  - Questions: Added the ask_question tool with interactive multiple-choice options, allowing agents to ask structured questions in chat, plus a redesigned options UI.
  - Reasoning Selector: Now persists thinking effort selection per provider and model.
  - Providers Quota: Added quota support for llmapi.ai and daily free energy monitoring for Neuralwatt.
  - OpenAI Codex: Added support for gpt-6.2 and gpt-6.1 models.
  - Agent Browser: Updated screenshot tool to accept a clean filename parameter instead of a path.
  - Cursor SDK: Restored skill activation support.
  ❤️ Support AiderDesk: If AiderDesk makes your development workflow better, consider sponsoring Magiksoft on GitHub to help support ongoing development and maintenance!
  💡 We'd love your feedback and contributions! Found a bug, have an idea, or want to submit a PR? Help us make AiderDesk even better on GitHub. Happy coding! 🚀
