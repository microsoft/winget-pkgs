ReleaseNotes: "## Performance\n\n• Cached regexes are looked up before compiling in `regexpCompileCached`：https://github.com/johnkerl/miller/pull/2292\n• The CSV reader skips the per-field key lookup when the header has no duplicates：https://github.com/johnkerl/miller/pull/2291\n• The JSON writer skips the escape loop for strings that need no escapes：https://github.com/johnkerl/miller/pull/2321\n\n## Bug fixes\n\n### Input handling\n\n• UTF-8 BOM handling is fixed for gzipped CSV input：https://github.com/johnkerl/miller/pull/2278\n• A leading UTF-8 BOM is now stripped for TSV and CSV-lite：https://github.com/johnkerl/miller/pull/2281\n\n### Time and date functions\n\n• `fsec2hms` and `fsec2dhms` carry rounded fractional seconds correctly：https://github.com/johnkerl/miller/pull/2282\n• `strptime` and `gmt2sec` now work for dates outside the int64 nanosecond range：https://github.com/johnkerl/miller/pull/2285\n• File-backed `TZ` values are supported：https://github.com/johnkerl/miller/pull/2247\n\n### String functions\n\n• `strmatchx` reports starts and ends as UTF-8 character positions, not byte positions：https://github.com/johnkerl/miller/pull/2287\n  Follow-up docs and generated-file regeneration：https://github.com/johnkerl/miller/pull/2288\n\n### Number formatting\n\n• `fmtnum` now picks its formatter from the conversion verb, not from the end of the format string：https://github.com/johnkerl/miller/pull/2295\n  Follow-ups：https://github.com/johnkerl/miller/pull/2297\n• `fmtnum` and `--ofmt` accept the C verbs `%i`, `%u`, `%D` and `%U`：https://github.com/johnkerl/miller/pull/2298\n\n### Integer arithmetic\n\n• `int ** int` is computed exactly rather than through float64 where possible：https://github.com/johnkerl/miller/pull/2296\n  Extra unit-test cases (`5**0`, `MinInt64**1`)：https://github.com/johnkerl/miller/pull/2299\n• Integer zero divisors no longer cause a panic in `./`, `madd`, `msub`, `mmul` and `mexp`：https://github.com/johnkerl/miller/pull/2300\n• `mexp` results are reduced for exponents 0 and 1：https://github.com/johnkerl/miller/pull/2301\n• `abs`, `ceil`, `floor`, `round` and `sgn` stay exact for ints above 2**53：https://github.com/johnkerl/miller/pull/2309\n• Unary minus of the minimum int, and `roundm` on large ints, are fixed：https://github.com/johnkerl/miller/pull/2311\n\n### Other\n\n• `arrayify` leaves its input unchanged：https://github.com/johnkerl/miller/pull/2317\n  Same for the `Mlrval.Arrayify` receiver：https://github.com/johnkerl/miller/pull/2320\n• On Windows under Git Bash or MSYS2, `sh` is now found on the `PATH`：https://github.com/johnkerl/miller/pull/2289\n• The `mand.mlr` magnitude calculation is fixed：https://github.com/johnkerl/miller/pull/2257\n\n## Documentation, build and release tooling\n\n• Doubled `cd` in the library-setup docs is fixed：https://github.com/johnkerl/miller/pull/2276\n• Prepipe commands that take flags are now quoted in help examples：https://github.com/johnkerl/miller/pull/2275\n• `LICENSE.txt` is identified as BSD-2-Clause for GitHub's licensee：https://github.com/johnkerl/miller/pull/2241\n• The releaser script uses Draft rather than Pre-release：https://github.com/johnkerl/miller/pull/2261\n• `make -C man build` fails when `groff` is missing or the manpage pipeline fails：https://github.com/johnkerl/miller/pull/2302\n  Regenerated with the new `groff` version：https://github.com/johnkerl/miller/pull/2303\n• `creach` is no longer used in docgen：https://github.com/johnkerl/miller/pull/2313\n• `~/.mlrrc` is suppressed in `make docs`：https://github.com/johnkerl/miller/pull/2316\n• Go version is now 1.26.10：https://github.com/johnkerl/miller/pull/2274\n• YAML dependency switched to `go.yaml.in/yaml/v3`：https://github.com/johnkerl/miller/pull/2319\n\n## Dependency bumps (Dependabot)\n\n• `github.com/klauspost/compress` 1.20.0 to 1.20.4：https://github.com/johnkerl/miller/pull/2258, https://github.com/johnkerl/miller/pull/2269, https://github.com/johnkerl/miller/pull/2304\n• `golang.org/x/term` 0.46.0 to 0.48.0：https://github.com/johnkerl/miller/pull/2264, https://github.com/johnkerl/miller/pull/2305\n• `golang.org/x/text` 0.42.0 to 0.44.0：https://github.com/johnkerl/miller/pull/2262, https://github.com/johnkerl/miller/pull/2306\n• `golang.org/x/sys` 0.49.0 to 0.50.0：https://github.com/johnkerl/miller/pull/2294\n• `pault.ag/go/debian` 0.21.0 to 0.21.4：https://github.com/johnkerl/miller/pull/2279, https://github.com/johnkerl/miller/pull/2284, https://github.com/johnkerl/miller/pull/2310\n• `github.com/lestrrat-go/strftime` 1.2.0 to 1.2.1：https://github.com/johnkerl/miller/pull/2283\n• `goreleaser/goreleaser-action` 7.2.3 to 7.3.0：https://github.com/johnkerl/miller/pull/2270\n• `actions/upload-artifact` 7.0.1 to 7.0.2：https://github.com/johnkerl/miller/pull/2266\n• `actions/setup-go` 7.0.0 to 7.1.0：https://github.com/johnkerl/miller/pull/2318\n• codeql-action group updates：https://github.com/johnkerl/miller/pull/2259, https://github.com/johnkerl/miller/pull/2265, https://github.com/johnkerl/miller/pull/2272, https://github.com/johnkerl/miller/pull/2280, https://github.com/johnkerl/miller/pull/2290, https://github.com/johnkerl/miller/pull/2293\n\n## New Contributors\n\n• @fzlzjerry made their first contribution in https://github.com/johnkerl/miller/pull/2247\n• @kvnloo made their first contribution in https://github.com/johnkerl/miller/pull/2241\n• @dcadolph made their first contribution in https://github.com/johnkerl/miller/pull/2276\n• @Boulea7 made their first contribution in https://github.com/johnkerl/miller/pull/2278\n• @youdie006 made their first contribution in https://github.com/johnkerl/miller/pull/2281\n• @ChandraChaan made their first contribution in https://github.com/johnkerl/miller/pull/2282\n• @shaurya703 made their first contribution in https://github.com/johnkerl/miller/pull/2285\n• @b84330808 made their first contribution in https://github.com/johnkerl/miller/pull/2287\n• @ptweezy made their first contribution in https://github.co