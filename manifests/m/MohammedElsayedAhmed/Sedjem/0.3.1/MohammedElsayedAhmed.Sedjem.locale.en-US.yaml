ShortDescription: Transcripts of Egyptian Arabic–English meetings and calls, made on your own computer, with each speaker told apart by voice.
Description: >-
  Sedjem transcribes recordings of meetings and calls in Egyptian Arabic mixed with English on your
  own computer, and labels each speaker by voice. It runs open speech models that keep English terms
  in English (Cohere Transcribe Arabic, a whisper-medium fine-tune for code-switching, and Whisper
  large-v3), or a hosted service that you choose, with your own API key. Transcripts play in step
  with the audio, can be corrected, compared between models and kept in versions, and export as
  plain text, SRT or WebVTT subtitles, Markdown or JSON. It also transcribes YouTube videos and
  playlists, and answers assistants such as Claude over MCP. The models are downloaded from inside
  the app, and a graphics card is used when one works.
