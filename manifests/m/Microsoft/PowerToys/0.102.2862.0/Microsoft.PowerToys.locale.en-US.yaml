  Highlights
  - Advanced Paste: Added a headless CLI for built-in and saved custom actions, with file, stdin, and clipboard workflows.
  - Command Palette: Added a full-screen preview picker for compact-mode vertical positioning.
  - Command Palette: Fixed startup failures in launched apps caused by an inherited Windows App SDK runtime-directory override.
  - Command Palette: Fixed blank details panes when extensions replace a content page's details.
  - New+: Fixed context-menu memory leaks and improved template destination and path handling.
  - Settings: Preserved module enablement preferences when modules cannot load or settings reads fail.
  Advanced Paste
  - Added a headless CLI to run built-in and saved custom actions without opening the UI, with file, stdin, or clipboard input and file, clipboard, or text-only stdout output; AI actions use providers configured in Settings and honor existing policies in #50834 by @MuyuanMS and @Copilot
  - Updated the Advanced Paste CLI for System.CommandLine 2.0, preserving existing commands, aliases, output formats, and help-like option values in #51230 by @LegendaryBlair and @Copilot
  Command Palette
  - Replaced compact mode's vertical-position slider with a full-screen preview picker supporting drag, scroll, and keyboard controls, while reserving room for expanded search results in #51011 by @jiripolasek
  - Fixed blank details panes when extensions replace a content page's details, initializing new content and detaching the previous details in #51231
  - Fixed startup failures in applications launched from Command Palette by preventing them from inheriting its Windows App SDK runtime-directory override in #51235 by @jiripolasek
  New+
  - Improved template creation with more robust destination-folder and long-path handling, and corrected the option to hide Windows' built-in New menu in #51142 by @Arslan-TR
  - Fixed a memory leak in File Explorer when repeatedly opening New+ context menus on Windows 10 and Windows 11 in #51152 by @Arslan-TR
  Settings
  - Preserved module enablement preferences when modules fail to load, saved changes for missing settings entries, and avoided settings resets caused by shutdown-time or failed-read saves in #50897 by @daverayment, @LegendaryBlair, and @Copilot
  Development
  - Restored SDK-generated assembly metadata in official Command Palette and Advanced Paste builds, preserving resource-language, platform, and internal-access declarations without changing the intended version values in #51098 by @Copilot
  - Advanced the Command Palette package version to 0.13 in #51232
  - Updated shared CLI parsing to System.CommandLine 2.0.1, including rejection of invalid Image Resizer unit and fit values and clearer FancyZones argument errors in #50884 by @Copilot
  - Refined PowerDisplay's persisted models and capability collections to address analyzer warnings while preserving saved-data compatibility in #50732 by @matthudson
  - Enabled stricter C++ standards conformance by default and corrected affected native declarations, while retaining explicit Keyboard Manager and installer exceptions in #51062 by @Copilot
  The existing stable warning policy is unchanged: #51065 has not been reapplied. The official-build metadata fix is included, but this preview does not restore the earlier analyzer-warning escalation.
