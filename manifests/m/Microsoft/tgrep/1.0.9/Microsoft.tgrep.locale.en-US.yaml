ShortDescription: Trigram-indexed grep with a client/server architecture for fast regex search.
Description: tgrep is a trigram-indexed grep with a client/server architecture for fast regex search in large codebases. It pre-builds a trigram index so a search only touches the files that could match, and a background server watches for file changes so subsequent searches stay fast. It is integrated into GitHub Copilot CLI to power fast grep searches across large repositories.
