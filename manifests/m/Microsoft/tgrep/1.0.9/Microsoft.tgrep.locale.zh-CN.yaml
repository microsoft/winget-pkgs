ShortDescription: 基于三元组索引、采用客户端/服务器架构的快速正则搜索工具。
Description: tgrep 是一款采用客户端/服务器架构的三元组索引 grep 工具，用于在大型代码库中快速执行正则搜索。它预先构建三元组索引，让搜索只触及可能匹配的文件；后台服务器会监视文件变化，让后续搜索保持极速。它已被集成到 GitHub Copilot CLI，用于在大型仓库中执行快速 grep 搜索。
