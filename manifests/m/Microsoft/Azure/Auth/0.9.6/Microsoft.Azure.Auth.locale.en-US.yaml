ShortDescription: A CLI wrapper for performing Microsoft Entra ID (Azure AD) authentication.
Description: AzureAuth is a CLI wrapper for performing Microsoft Entra ID (Azure AD) authentication. It makes use of MSAL for authentication and caching, and is designed for authenticating and returning an access token for public client applications. It acts like a credential provider for Azure DevOps and any other public client application. Not to be confused with "Microsoft Authenticator".
