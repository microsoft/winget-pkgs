66\r\n• CanonicalRequest：Updates from Shadow-Mode Rollout by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/368\r\n• Append failing eBPF dependency status to GPA service start failure error message by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/370\r\n• Fix stale formattedMessage.message when StatusState transitions to Error by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/371\r\n• Fix TCPPortScalabilityScenario Test by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/374\r\n• core unify ebpf for linux & windows by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/373\r\n• Fix the rust-clippy and bloat issues for rust-1.97 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/376\r\n• Fix Linux extension exits 0 without writing status file on enable by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/372\r\n• Add evt_listener into windows_events module. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/375\r\n• Update the doc only for Innovation-7.2-zero-copy-splice.md by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/377\r\n• Add etw_listener to help capture ebpf-for-windows tracing events. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/378\r\n• Add unknown words. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/380\r\n• Prepare release 1.0.47 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/379\r\n• Add tdh.dll as expected for etw_listener thread. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/381\r\n• Fork to main：Add tdh.dll as expected for etw_listener thread by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/382\r\n• KD-3 · Trailing carriage return (`%0D`) on a `client_id` query value (`CANON_CTRL`) by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/369\r\n• Add mintdh.dll to cover the loaded modules test in WS2019 by @Zhidon