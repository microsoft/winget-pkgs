n• Bump the github-actions group with 9 updates by @dependabot[bot] in https://github.com/Azure/GuestProxyAgent/pull/393\n• Add parameter ipv6DualStackSupported for IMDSPingTest.ps1 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/394\n• update eBPF-for-Windows to v1.5.0 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/391\n• Use short-lived user cache for proxy authorization decision by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/395\n• Donot error out if authorize_connect6 not found in legacy eBPF program by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/398\n• TelemetryEventsRefactor：Move redact_secrets to the sequential background consumer by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/399\n• Bump the github-actions group with 2 updates by @dependabot[bot] in https://github.com/Azure/GuestProxyAgent/pull/403\n• secret_redactor refactor：set DFA size limit and serializing the searches in secret-redactor thread by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/400\n• WindowsEventWriter Refactor：Move windows event writer to async background thread by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/401\n• Report eBPFSvc, GuestProxyAgent service status, and surface eBPF/GPA … by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/396\n• Make add connection summary as background operations. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/405\n• skip redirector policy udpate in update_redirector_policy if proxy sever has not started yet. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/404\n• Start proxy_server on a dedicated Tokio runtime by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/402\n• Update logging for linux memory usages by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/406\n• Prepare build for 1.0.49 release by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/407\n• Extra windows memory leaking fixes. by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/409\n• Bump streetsidesoftware/cspell-action from 9.0.1 to 9.1.0 in the github-actions group by @dependabot[bot] in https://github.com/Azure/GuestProxyAgent/pull/408\n• telemetry_event to use serialized_size instead of to_xml().length by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/410\n• Clearing regex cache due to memory usage exceeding limit by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/411\n• Report per-service product version in EbpfStatus, separated by pipe by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/412\n• Prepare build for release 1.0.50 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/413\n• Bump the github-actions group with 2 updates by @dependabot[bot] in https://github.com/Azure/GuestProxyAgent/pull/414\n• FIX：Get the correct UID from bpf_get_current_uid_gid by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/416\n• Cache version in ServiceStatusInfo; gate eBPFSvc requirement on Core/… by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/417\n• Prepare release 1.0.51 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/418\n• defer service-level message override until service-level status is error by @srikrishnaveturi in https://github.com/Azure/GuestProxyAgent/pull/419\n• Prepare build 1.0.52 by @ZhidongPeng in https://github.com/Azure/GuestProxyAgent/pull/421\n\n## New Contributors\n• @danfiedler-msft made their first contribution in https://github.com/Azure/GuestProxyAgent/pull/390\n\n**Full Changelog**：https://github.com/Azure/GuestProxyAgent/compare/1.0.48...1.0.52"
