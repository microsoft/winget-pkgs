ShortDescription: কমান্ড লাইন থেকে অ্যাপ্লিকেশন প্রকল্প কনফিগার করুন এবং Microsoft Store-এ প্যাকেজ প্রকাশ করুন।
Description: Microsoft Store CLI ডেভেলপারদের অ্যাপ্লিকেশন প্রকল্প কনফিগার করতে এবং Microsoft Store-এ MSIX বা MSI/EXE প্যাকেজ প্রকাশ করতে সাহায্য করে। এটি কমান্ড লাইন থেকে Microsoft Store API ব্যবহারের সুযোগ দেয় এবং স্বয়ংক্রিয় প্রকাশনার কার্যপ্রবাহ সমর্থন করে।
