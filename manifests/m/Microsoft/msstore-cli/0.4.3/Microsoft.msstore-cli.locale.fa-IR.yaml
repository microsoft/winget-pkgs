Description: Microsoft Store CLI به توسعه‌دهندگان کمک می‌کند پروژه‌های برنامه را پیکربندی و بسته‌های MSIX یا MSI/EXE را در Microsoft Store منتشر کنند. این ابزار دسترسی به APIهای Microsoft Store را از خط فرمان فراهم می‌کند و از گردش‌کارهای انتشار خودکار پشتیبانی می‌کند.
