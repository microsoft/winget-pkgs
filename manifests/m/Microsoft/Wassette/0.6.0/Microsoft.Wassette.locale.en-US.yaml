ReleaseNotes: |-
  ## Highlights

  ### Runtime

  Wasmtime updated to 47.0.3 (#733). The wasi-http integration was rewritten onto Wasmtime's new hooks API, and outbound requests are dispatched through the standard path. Policy enforcement behaves as before: a request to a host outside the component's policy is refused, and a request with no host is rejected as invalid.
  Permission errors no longer report a stale network denial after a later request has been allowed (#733).
  The MCP implementation (rmcp) was updated to 3.1.1 (#738).

  ### Breaking changes

  Docker deployment support has been removed (#708). The Dockerfile, the prebuilt Dockerfile, the docker-compose example, and the Docker deployment documentation are all gone. Run the binary directly, or install it with a package manager.
  The install script moved out of the repository root to `scripts/install.sh` (#711). Any bookmarked or scripted reference to the old root URL will stop working, see Installation below.
  Justfile recipes that depended on the removed Dockerfile were deleted (#747).

  ### Installation

  Homebrew no longer needs a tap. The formula is in homebrew/core, so `brew install wassette` is all it takes (#745).
  The install script now lives at `scripts/install.sh` rather than the repository root (#711). See Install below for the current command.

  ### Security

  Wasmtime was bumped to 36.0.13 for RUSTSEC-2026-0222 (#731), then superseded within this release by the move to 47.0.3 (#733).
  A stale advisory ignore for `paste` was dropped, so the audit reflects the real dependency set (#732).
  GitHub Actions are pinned to full-length commit SHAs (#722).

  ### Project structure

  Crates moved from `src/` into `crates/` (#712).
  Agent guidance was reorganized into docs and skills (#710), and the `rules/` directory was removed (#713).
  Changelog tooling was simplified and towncrier removed (#714, #715).
  Disabled agentic workflows were removed (#734).

