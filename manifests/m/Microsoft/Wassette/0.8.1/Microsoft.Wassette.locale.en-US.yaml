ReleaseNotes: "# Wassette v0.8.1\n\nThis patch release hardens the boundary between component acquisition and host\npermissions, makes policy-free execution deny environment access by default,\nand updates audited runtime dependencies.\n\n## Security and permissions\n\n• OCI artifacts containing publisher-supplied policies are rejected by default.\n  After reviewing a policy, a direct operator can activate it explicitly with\n  `wassette component load <OCI-URI> --trust-bundled-policy`; automated and\n  agent-facing load paths remain fail closed.\n• Components without an attached policy no longer receive configured environment\n  values or stored secrets. Deployments that relied on ambient inheritance must\n  grant each required environment variable explicitly.\n• Rejected OCI policy loads preserve the previously installed component, policy,\n  metadata, and precompiled cache.\n\n## Maintenance\n\n• Updated Wasmtime, quinn-proto, and rustls to patched releases.\n• Updated example policies and workflows to document the explicit permissions\n  required by each component.\n\n\n<!-- Release notes generated using configuration in .github/release.yml at 4ccdba57168068bdeb7f046fe24e85d5ee252125 -->\n\n## What's Changed\n• Fix CI with the Wasmtime 48.0.3 upgrade by @yoshuawuyts with @Copilot in https://github.com/microsoft/wassette/pull/836\n• Make MCP Inspector tests use the in-memory secret store by @asw101 in https://github.com/microsoft/wassette/pull/887\n• Require explicit approval for OCI-bundled component policies by @asw101 in https://github.com/microsoft/wassette/pull/888\n• Deny component environment access when no policy is attached by @asw101 in https://github.com/microsoft/wassette/pull/889\n• chore(release)：bump version to 0.8.1 by @asw101 in https://github.com/microsoft/wassette/pull/890\n\n\n**Full Changelog**：https://github.com/microsoft/wassette/compare/v0.8.0...v0.8.1\n\n## Downloads\n\n### Linux\n• [AMD64 (tar.gz)](https://github.com/microsoft/wassette/releases/download/v0.8.1/wassette_0.8.1_linux_amd64.tar.gz)\n• [ARM64 (tar.gz)](https://github.com/microsoft/wassette/releases/download/v0.8.1/wassette_0.8.1_linux_arm64.tar.gz)\n\n### macOS (Darwin)\n• [AMD64/Intel (tar.gz)](https://github.com/microsoft/wassette/releases/download/v0.8.1/wassette_0.8.1_darwin_amd64.tar.gz)\n• [ARM64/Apple Silicon (tar.gz)](https://github.com/microsoft/wassette/releases/download/v0.8.1/wassette_0.8.1_darwin_arm64.tar.gz)\n\n### Windows\n• [AMD64 (zip)](https://github.com/microsoft/wassette/releases/download/v0.8.1/wassette_0.8.1_windows_amd64.zip)\n• [ARM64 (zip)](https://github.com/microsoft/wassette/releases/download/v0.8.1/wassette_0.8.1_windows_arm64.zip)\n\n## Install\n\n### All Platforms (Shell Script)\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/microsoft/wassette/main/scripts/install.sh | WASSETTE_GITHUB_REPO=microsoft/wassette bash\n```\n\nThis will detect your platform and install the latest `wassette` binary to your `$PATH`.\n\n## Usage\n```bash\n# Local MCP client integration (stdio)\nwassette run\n\n# Remote MCP server (Streamable HTTP)\nwassette serve\n```"
