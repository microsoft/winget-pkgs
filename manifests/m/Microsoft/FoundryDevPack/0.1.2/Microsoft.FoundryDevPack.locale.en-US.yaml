PackageIdentifier: Microsoft.FoundryDevPack
PackageVersion: 0.1.2
PackageLocale: en-US
Publisher: Microsoft Corporation
PublisherSupportUrl: https://github.com/microsoft/foundry-toolkit/issues
Author: Microsoft Corporation
PackageName: Microsoft Foundry DevPack
PackageUrl: https://github.com/microsoft/foundry-toolkit
License: Microsoft Azure License
LicenseUrl: https://github.com/microsoft/foundry-toolkit/blob/main/devpack-installer/LICENSE
Copyright: Copyright (c) Microsoft Corporation
ShortDescription: Sets up prerequisites for Microsoft Foundry development.
Description: Microsoft Foundry DevPack ensures the Azure CLI and Azure Developer CLI are present, then installs the azd Foundry extension, the microsoft-foundry agent skill, the Foundry Toolkit VS Code extension, and the Microsoft Foundry Copilot plugin when their host applications are available.
Moniker: foundry-devpack
Tags:
- ai
- azure
- developer-tools
- foundry
- pre-release
InstallationNotes: |-
  To verify or repair your setup, run:
    winget repair --exact --id Microsoft.FoundryDevPack

  If Azure CLI or Azure Developer CLI was removed, restore package dependencies with:
    winget install --exact --id Microsoft.FoundryDevPack --force

  Microsoft Foundry DevPack is ready for CLI, VS Code, and Copilot development:
  - az, azd and azd ai
      Scaffold, deploy, evaluate, and automate from the terminal.
  - Microsoft Foundry Skill
      Give coding agents reusable guidance for Foundry workflows.
      Location: ~/.agents/skills/
      Location: ~/.claude/skills/ (if Claude Code is available)
  - Microsoft Foundry Toolkit for Visual Studio Code
      (If VS Code is available)
      Build, test, evaluate, and deploy from Visual Studio Code.
  - Foundry Canvas (preview)
      (If GitHub Copilot is available)
      Design and deploy hosted agents with a guided Copilot canvas.
      Location: ~/.copilot/installed-plugins/

  NEXT STEPS:
  - Ask your coding agent: "Create a Foundry hosted agent."
  - Run the command directly: azd ai agent init
ManifestType: defaultLocale
