ShortDescription: Sets up prerequisites for Microsoft Foundry development.
Description: Microsoft Foundry DevPack ensures the Azure CLI and Azure Developer CLI are present, then installs the azd Foundry extension, the microsoft-foundry skills, the Foundry Toolkit VS Code extension, and the Microsoft Foundry Copilot plugin when their host applications are available.
Moniker: foundry-devpack
Tags:
- ai
- azure
- developer-tools
- foundry
- pre-release
InstallationNotes: |-
  To verify or repair your setup, run:
      winget repair --exact --id Microsoft.FoundryDevPack

  If Azure CLI or Azure Developer CLI was removed, restore package dependencies with:
      winget install --exact --id Microsoft.FoundryDevPack --force

  WHAT'S INCLUDED

  - Foundry command-line tools
    Azure CLI, Azure Developer CLI (azd), and the Foundry extension for azd (azd ai).
  - Microsoft Foundry Skill
    ~/.agents/skills/
    ~/.claude/skills/ (if Claude Code is available)
  - Microsoft Foundry Toolkit for Visual Studio Code (if applicable)
  - Foundry Canvas (preview) for GitHub Copilot App (if applicable)
    ~/.copilot/installed-plugins/

  Learn more about the Foundry DevPack at https://aka.ms/foundrydevpack

  GET STARTED

  Build with Foundry your way using the CLI, a coding agent, VS Code, or the GitHub Copilot app.
  - Run `azd ai agent init` to create a Foundry hosted agent.
  - Ask your coding agent: "Evaluate my agent and improve its instructions."
  - Open Foundry Toolkit in VS Code (vscode://ms-windows-ai-studio.windows-ai-studio/create_agent)
  - Open Foundry Canvas in GitHub Copilot App
