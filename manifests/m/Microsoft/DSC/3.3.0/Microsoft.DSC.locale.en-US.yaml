ReleaseNotes: "## What's changed\r\n\r\nThese release notes describe updates to DSC since the `v3.3.0-rc.2` release.\r\n\r\nThis document includes the following sections:\r\n\r\n• **Added** for changes that improve or add functionality without breaking existing usage.\r\n• **Fixed** for changes that resolve a bug in existing behavior.\r\n• **Documentation** for changes that only affect documentation.\r\n• **Maintenance** for changes that affect the project or internals without changing the user experience.\r\n\r\nEach section has one or more subsections describing the area that the change affects:\r\n\r\n• **CLI** for changes that affect the user eperience when invoking `dsc` itself.\r\n• **Engine** for changes that affect the DSC engine, configuration documents, and manifests.\r\n• **Resources** for changes that affect specific DSC resources.\r\n• **Server** for changes that affect DSC when running as a JSON-RPC/MCP server.\r\n• **Bicep extension** for changes that affect the Bicep extension.\r\n\r\nFor the **full changelog**, see https://github.com/PowerShell/DSC/compare/v3.3.0-rc.2...v3.3.0\r\n\r\n### Added\r\n\r\n#### CLI\r\n\r\n• (GH-1393) Rename `--version` to `--required-version` for resource commands by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1610\r\n\r\n#### Engine\r\n\r\n• Add support to pass resource version to adapter by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1645\r\n• feat：remove experimental flag `format()` by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1648\r\n• feat：implement export filter functionality for resource exports by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1621\r\n• Use JSON Schema defaults in synthetic test get_diff by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1670\r\n• Ignore write-only properties in schema-aware diffs by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1674\r\n• Add support for adapted resource manifests to indicate required security context by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1701\r\n\r\n#### Resources\r\n\r\n• feat：Add `--what-if` for `Microsoft.Windows/UpdateList` by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1616\r\n• (GH-1563) Enhance the PSScript resources by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1657\r\n• Add scoped unspecified firewall rule handling and allow empty rules by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1671\r\n• Update Firewall manifest to declare implementsPretest by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1682\r\n• Add Group Policy template adapter by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1686\r\n• Add Windows environment variable resource by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1675\r\n• Add Microsoft.Filesystem.File/Content resource by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1676\r\n\r\n#### Server\r\n\r\n• (GH-1696) Add --what-if in MCP server tools by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1697\r\n\r\n#### Bicep extension\r\n\r\n• Fix bicep extension to require transport to be specified otherwise return error by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1721\r\n\r\n### Fixed\r\n\r\n#### Engine\r\n\r\n• Fix nested diff w/ schema and schema cache miss by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1680\r\n\r\n#### Resources\r\n\r\n• fix：add support for preserving quoted group names in sshd_config by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1639\r\n• Fix registry resource what-if for non-existing key by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1692\r\n\r\n### Documentation\r\n\r\n• docs：add `Microsoft.DSC/Include` reference documentation by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1649\r\n• (DOCS) Update changelog for 3.2.* releases by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1578\r\n• docs：Add reference documentation for `Microsoft.OpenSSH.SSHD/Windows` by @Gijsreyn in https://github.com/PowerShell/DSC/pull/934\r\n• docs：Add extensions reference documentation by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1661\r\n• docs：Sync fixes from Microsoft Learn by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1664\r\n• docs：Sync fixes from Microsoft Learn (part two) by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1677\r\n\r\n### Maintenance\r\n\r\n• Add code review instructions derived from PR feedback patterns by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1646\r\n• Fix clippy rule violation by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1688\r\n• Update `dsc.exe` to have single process exit point by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1693\r\n• (GH-538) Enhance schema export functionality and add error handling for duplicate paths by @Gijsreyn in https://github.com/PowerShell/DSC/pull/1672\r\n• (GH-538) Define transforms for `Option<T>` by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1702\r\n• Pin GitHub Actions to full-length commit SHAs by @danfiedler-msft in https://github.com/PowerShell/DSC/pull/1710\r\n• Localize dsc-lib tracing and standardize builds by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1720\r\n• Change copilot code review from instruciton to skill by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1718\r\n• (MAINT) Always rebuild for updated translations by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1711\r\n• (AI) Update schema guidance for code review by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1715\r\n• Update code coverage report to always add comment even if failures by @SteveL-MSFT in https://github.com/PowerShell/DSC/pull/1714\r\n• (CI) Update Rust workflow for PR events by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1719\r\n• (GH-538) Set URI and docs keywords for `DscRepoSchema` types by @michaeltlombardi in https://github.com/PowerShell/DSC/pull/1699\r\n\r\n## New Contributors\r\n\r\n• @danfiedler-msft made their first contribution in https://github.com/PowerShell/DSC/pull/1710"
