ReleaseNotes: "## What's Changed\r\n• wslc：add --size to inspect for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41489\r\n• Add wslc container restart command by @beena352 in https://github.com/microsoft/WSL/pull/41435\r\n• init：fix dhcpcd option name in bridged-mode config by @DesertRatUa in https://github.com/microsoft/WSL/pull/41538\r\n• Host plugin Plan9 shares as the session user by @benhillis in https://github.com/microsoft/WSL/pull/41548\r\n• Fix virtiofs bind mounts exposing files as root-owned (#40719) by @halter73 in https://github.com/microsoft/WSL/pull/40733\r\n• wslc：match docker prune semantics (confirmation prompt, -f aliases --force) by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41455\r\n• wslc：add --all to image list for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41456\r\n• wslc：add --details to container logs for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41467\r\n• Don't fail the installation if DeprovisionMsix() fails by @OneBlue in https://github.com/microsoft/WSL/pull/41453\r\n• wslc：add --size to container list for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41477\r\n• wslc：add --all-tags to push for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41500\r\n• Fix build issue for wslsettings, and add more logging to the pipelines by @florelis in https://github.com/microsoft/WSL/pull/40388\r\n• Validate variable-length message strings by @benhillis in https://github.com/microsoft/WSL/pull/41567\r\n• Fix WSLC fallback gateway collision by @benhillis in https://github.com/microsoft/WSL/pull/41547\r\n• Reduce expected distro termination log noise by @benhillis in https://github.com/microsoft/WSL/pull/41541\r\n• CLI：Add global options to root help, adjust options usage by @dkbennett in https://github.com/microsoft/WSL/pull/41534\r\n• wslc：add docker --quiet to image load, image push and container cp by 