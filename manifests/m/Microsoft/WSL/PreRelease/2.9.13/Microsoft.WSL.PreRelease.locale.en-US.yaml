ReleaseNotes: "## What's Changed\r\n• Fix activating a stopping service treated as OOM by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41460\r\n• Set distributionStartTimeout to 2 minutes in the tests to solve distribution start timeouts errors by @OneBlue in https://github.com/microsoft/WSL/pull/41583\r\n• Enable RedirectionGuard process mitigation by @benhillis in https://github.com/microsoft/WSL/pull/41542\r\n• Updates Ubuntu latest LTS images by @cnihelton in https://github.com/microsoft/WSL/pull/41465\r\n• diagnostics：improve collect-wsl-logs for analysis (summary.json, README, profile info, WSL/guest state) by @benhillis in https://github.com/microsoft/WSL/pull/40776\r\n• Move security model under technical documentation by @benhillis in https://github.com/microsoft/WSL/pull/41605\r\n• Fix typos by @antonkesy in https://github.com/microsoft/WSL/pull/41589\r\n• Don't stop parsing linux config files on invalid lines by @OneBlue in https://github.com/microsoft/WSL/pull/41606\r\n• wslc：add --all-tags to pull for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41494\r\n• Added WSL container to OOBE by @craigloewen-msft in https://github.com/microsoft/WSL/pull/41402\r\n• Pre merge Localization strings prior to GA by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41585\r\n• wslc：keep image list json CreatedSince locale-invariant by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41609\r\n• Warn on an escaped CR in wsl.conf instead of dropping it silently by @Dev-next-gen in https://github.com/microsoft/WSL/pull/41591\r\n• Set a restricted ephemeral port range for test case ConsommeTests::PortZeroBindIsTracked by @OneBlue in https://github.com/microsoft/WSL/pull/41616\r\n• CLI：Global option scopes for nested commands (related to compose support) by @dkbennett in https://github.com/microsoft/WSL/pull/41546\r\n• Change default relay  buffer size to 64KiB by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41603\r\n• Fix redirect stdout and stderror to the same file overlapping by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41611\r\n• Move installer log collection after repro by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41620\r\n• wslc：add --digests to image list for docker parity by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41457\r\n• Localization change from build：157843092 by @OneBlue in https://github.com/microsoft/WSL/pull/41630\r\n• Explicitely return SOCKET from WSLCPluginAPI_ProcessGetFd() by @OneBlue in https://github.com/microsoft/WSL/pull/41626\r\n• In mirrored mode, handle route update as add instead of replace by @FetoiuCatalin in https://github.com/microsoft/WSL/pull/41391\r\n• Add wslc events command by @beena352 in https://github.com/microsoft/WSL/pull/41608\r\n• Don't fail the UnitTests::Warnings test case if GlobalSecureAccess VPN is running by @OneBlue in https://github.com/microsoft/WSL/pull/41638\r\n• Wait for wslservice to be started when running tests by @OneBlue in https://github.com/microsoft/WSL/pull/41639\r\n• Create new namespaces for distro cgroups by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41512\r\n• Fix unnecessary delay in the port tracking loop by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41472\r\n• wslc：add --follow-link to cp by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41501\r\n• Disable unstable bind cap test and re-enable Loopback test that was incorrectly disabled by @FetoiuCatalin in https://github.com/microsoft/WSL/pull/41648\r\n• Move objects shared by wslc.exe and the tests to src/windows/common by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41619\r\n• Fix various protocol parsing issues by @OneBlue in https://github.com/microsoft/WSL/pull/41637\r\n• Localization change from build：157980831 by @OneBlue in https://github.com/microsoft/WSL/pull/41647\r\n• Add WSLC network lifecycle events by @beena352 in https://github.com/microsoft/WSL/pull/41576\r\n• Fix potential out of bound access when pretty-printing string field in init messages by @OneBlue in https://github.com/microsoft/WSL/pull/41664\r\n\r\n## New Contributors\r\n• @antonkesy made their first contribution in https://github.com/microsoft/WSL/pull/41589\r\n• @Dev-next-gen made their first contribution in https://github.com/microsoft/WSL/pull/41591\r\n\r\n**Full Changelog**：https://github.com/microsoft/WSL/compare/2.9.12...2.9.13"
