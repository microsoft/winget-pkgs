ReleaseNotes: |-
  ## What's Changed
  • Fix the security model link in SECURITY.md by @xThreeh in https://github.com/microsoft/WSL/pull/41835
  • Fix RLCPlus distribution manifest formatting by @benhillis in https://github.com/microsoft/WSL/pull/41841
  • Update GitPython to resolve Dependabot alerts by @benhillis in https://github.com/microsoft/WSL/pull/41840
  • Fix CaseSensitivityDeepNesting test build failure by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41849
  • Reorganize test/windows into common/, wsl/, and wslc/ by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41661
  • Fix e2fsck return code 1 treated as failure in resize by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41720
  • Clarify architecture and development commands in Copilot instructions by @benhillis in https://github.com/microsoft/WSL/pull/41843
  • Add WSLC volume events by @beena352 in https://github.com/microsoft/WSL/pull/41831
  • Fix incorrect AAAA DNS resolution for static DNS records causing resolution failure in musl by @OneBlue in https://github.com/microsoft/WSL/pull/41859
  • Fix race condition causing potential use-after-free in NatNetworking by @OneBlue in https://github.com/microsoft/WSL/pull/41850
  • Acquire m_instanceLock before calling _ValidateDistributionNameAndPathNotInUse() by @OneBlue in https://github.com/microsoft/WSL/pull/41855
  • Make the store publish stage opt-in by @OneBlue in https://github.com/microsoft/WSL/pull/41857
  • Remove the gate before publishing nuget packages, and rename to avoid confusion by @OneBlue in https://github.com/microsoft/WSL/pull/41858
  • Fail consommé bind() requests that fail in Windows by @OneBlue in https://github.com/microsoft/WSL/pull/41856
  • Don't add swiotlb=force with the hv_pci swiotlb pool by @Hekzory in https://github.com/microsoft/WSL/pull/41829
  • Fix potential crash caused by error during session initialization by @OneBlue in https://github.com/microsoft/WSL/pull/41887
  • Add a /hyperv to triage hyper-v issues by @OneBlue in https://github.com/microsoft/WSL/pull/41885
  • Localization change from build：160297307 by @OneBlue in https://github.com/microsoft/WSL/pull/41890
  • Increase the default commited stack size to 64KB by @OneBlue in https://github.com/microsoft/WSL/pull/41888
  • Suppress systemctl is-system-running polling error messages by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41881
  • Disable unsafe move constructors in ScopedMultiRelay by @OneBlue in https://github.com/microsoft/WSL/pull/41897
  • Wait for the drvfs initialization thread to exit before destroying WslCoreVm by @OneBlue in https://github.com/microsoft/WSL/pull/41895
  • Fix potential use-after-free in the stdin relay thread by @OneBlue in https://github.com/microsoft/WSL/pull/41894
  • Release resources that could call callbacks before returning from HcsVirtualMachine's constructor on failure by @OneBlue in https://github.com/microsoft/WSL/pull/41908
  • Clarify volume event comments by @beena352 in https://github.com/microsoft/WSL/pull/41889
  • Add wslc cp alias for wslc container cp by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41902
  • Fix potential starvation in COMImplClass::Disconnect() by @OneBlue in https://github.com/microsoft/WSL/pull/41912
  • Use repository NuGet configuration for out-of-tree builds by @tunabirgun in https://github.com/microsoft/WSL/pull/41916
  • Fix a potential use-after-free between plugin calls and WSLCSessionManagerImpl's destruction by @OneBlue in https://github.com/microsoft/WSL/pull/41911
  • Add missing synchronization around load WinHttp proxy methods by @OneBlue in https://github.com/microsoft/WSL/pull/41909
  • Fix missing synchronization on m_httpProxyStateTracker access by @OneBlue in https://github.com/microsoft/WSL/pull/41907
  • Fix potential deadlock in between VM exit callback and session shutdown by @OneBlue in https://github.com/microsoft/WSL/pull/41910
  • Fix potential use-after-free in EpollWatcher by @OneBlue in https://github.com/microsoft/WSL/pull/41896
  • Match docker -v parsing：LTR spec parser, shared validation, config-v… by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41905
  • Mount bind volumes during cp on non-running containers by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41906
  • reap sub processes during shutdown to unblock systemd by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41899
  • Fix incorrect srwlock usage when initializing drvfs by @OneBlue in https://github.com/microsoft/WSL/pull/41925
  • Fix potential deadlock in WSL1 instance termination by @OneBlue in https://github.com/microsoft/WSL/pull/41922
  • Fix potential use-after-free if the WSLC VM is killed while the last session COM reference is being released by @OneBlue in https://github.com/microsoft/WSL/pull/41946
  • Try smaller port ranges when mirrored mode cannot allocate ports by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41880
