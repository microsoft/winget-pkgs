  • Fix potential hang while waiting for timezone thread by @OneBlue in https://github.com/microsoft/WSL/pull/41926
  • Run DCAT release jobs on a custom pool by @florelis in https://github.com/microsoft/WSL/pull/41961
  • Fix potential deadlock + use-after-free in WatchForExitedProcesses by @OneBlue in https://github.com/microsoft/WSL/pull/41928

