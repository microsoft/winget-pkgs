  • Fix wslc inspect for slash-prefixed container names by @beena352 in https://github.com/microsoft/WSL/pull/41923
  • Fix WSLC GPU hook execution and library discovery by @kvega005 in https://github.com/microsoft/WSL/pull/41886
  • Fix NAT relay listener lifetime across active connections by @metajack in https://github.com/microsoft/WSL/pull/41948
  • Warn when nested virtualization capability detection fails by @benhillis with @Copilot in https://github.com/microsoft/WSL/pull/41942
  • Fix potential hang when a distribution is terminated while waiting on OOBE by @OneBlue in https://github.com/microsoft/WSL/pull/41924
  • Fix race condition in Signal() / ResizeTty() process logic by @OneBlue in https://github.com/microsoft/WSL/pull/41929
