ReleaseNotes: |-
  ## What's Changed
  • Update issue template for WSLC by @dkbennett in https://github.com/microsoft/WSL/pull/41778
  • Run the nightly tests on Windows Server 2025 by @OneBlue in https://github.com/microsoft/WSL/pull/41760
  • Localization change from build：159470205 by @OneBlue in https://github.com/microsoft/WSL/pull/41800
  • Fix various issues preventing the ModernOOBE test from running multiple times on the same test_distro by @OneBlue in https://github.com/microsoft/WSL/pull/41781
  • Remove unused delay-load options by @benhillis in https://github.com/microsoft/WSL/pull/41804
  • Disable pushing to the store by default by @OneBlue in https://github.com/microsoft/WSL/pull/41782
  • Scope down the ephemeral port range in various consommé tests by @OneBlue in https://github.com/microsoft/WSL/pull/41805
  • Fix race condition in LifetimeManager by @OneBlue in https://github.com/microsoft/WSL/pull/41807
  • Use DistroFileChange instead of going through wsl.localhost by @OneBlue in https://github.com/microsoft/WSL/pull/41810
  • Explicitely setup impersonation when instanciating IWslSupport by @OneBlue in https://github.com/microsoft/WSL/pull/41815
  • Wait for bound ports to be released by the port relay in the tests by @OneBlue in https://github.com/microsoft/WSL/pull/41817
  • Support reading the wslc image build context from stdin by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41765
  • Update Microsoft.WSL.Kernel to 6.18.54.1 by @chessturo in https://github.com/microsoft/WSL/pull/41822
  • Add logic to reject commands with extra arguments by @OneBlue in https://github.com/microsoft/WSL/pull/41821
  • Improve wslc event filters by @beena352 in https://github.com/microsoft/WSL/pull/41809
  • Make the binfmt mount writable by @OneBlue in https://github.com/microsoft/WSL/pull/41808
  • Match container and network filters across event types by @beena352 in https://github.com/microsoft/WSL/pull/41818
  • Fix incorrect wsl.conf warnings being displayed when creating a new distribution by @OneBlue in https://github.com/microsoft/WSL/pull/41820
  • Convert EnsureCaseSensitiveDirectoryRecursive to iterative traversal by @benhillis in https://github.com/microsoft/WSL/pull/40347


