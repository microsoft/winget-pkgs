ReleaseNotes: |-
  ## What's Changed
  • Don't write to the install log file if it's a reparse point or a directory by @OneBlue in https://github.com/microsoft/WSL/pull/41705
  • Use the latest ESRP signing key code by @OneBlue in https://github.com/microsoft/WSL/pull/41640
  • Fix ipv4 forwarding when both v4 and v6 ports are listening by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41672
  • Refactor event stream cancellation waits by @beena352 in https://github.com/microsoft/WSL/pull/41696
  • Don't expect the brd module logline to stabilize the CustomDmesgOutput test case by @OneBlue in https://github.com/microsoft/WSL/pull/41714
  • Fix：update drvfs gid uid after default uid is set in oobe by @chemwolf6922 in https://github.com/microsoft/WSL/pull/41521
  • Update WSLC SDK API documentation by @florelis in https://github.com/microsoft/WSL/pull/41677
  • Expose kernel headers and perf to distributions by @benhillis in https://github.com/microsoft/WSL/pull/41400
  • Use iterators in FromJson to avoid copies by @OneBlue in https://github.com/microsoft/WSL/pull/41641
  • Use a retry with timeout in HostPortCantBeBoundByGuest by @OneBlue in https://github.com/microsoft/WSL/pull/41728
  • Don't fail configuring the consommé loopback adapter when ipv6 is disabled by @OneBlue in https://github.com/microsoft/WSL/pull/41729
  • Enable experimental sparse VHD creation by @benhillis in https://github.com/microsoft/WSL/pull/41726
  • Update Microsoft.RemoteDesktop.Client.MSRDC.SessionHost to version 1.2.7391 by @benhillis in https://github.com/microsoft/WSL/pull/41730
  • Fix WSL container event timestamps by @beena352 in https://github.com/microsoft/WSL/pull/41717
  • Revert "Enable RedirectionGuard process mitigation" by @OneBlue in https://github.com/microsoft/WSL/pull/41744
  • Add --format json to wslc events by @beena352 in https://github.com/microsoft/WSL/pull/41734
  • Update the DACL to only allow access to the user when creating virtual disks by @OneBlue in https://github.com/microsoft/WSL/pull/41678
  • Fix race condition and potential use-after-free on system distro & init port access by @OneBlue in https://github.com/microsoft/WSL/pull/41762
  • Enable automatic vNUMA for large WSL VMs by @benhillis in https://github.com/microsoft/WSL/pull/41741
  • Exclude wslc.exe and wslcsession.exe from custom LSP providers by @OneBlue in https://github.com/microsoft/WSL/pull/41767
  • Reuse EmptyObject for HCS NUMA configuration by @benhillis in https://github.com/microsoft/WSL/pull/41768
  • Implement container health notifications to wslc events by @OneBlue in https://github.com/microsoft/WSL/pull/41763
  • Replace TableOutput with TableData model and TableRenderer by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41700
  • refactor container cp task to be simpler and move logic to container service and common filesystem helpers by @ggarzia-MSFT in https://github.com/microsoft/WSL/pull/41668
  • Use a fallback gateway if no ipv4 gateway is available in consommé networking by @OneBlue in https://github.com/microsoft/WSL/pull/41779
  • Record Docker die and stop events with parity by @beena352 in https://github.com/microsoft/WSL/pull/41770
  • Restore the logic to re-create the WSL binfmt_misc entry if it's overriden by systemd-binfmt by @OneBlue in https://github.com/microsoft/WSL/pull/41780

  ## New Contributors
  • @pswartzclan made their first contribution in https://github.com/microsoft/WSL/pull/41323

