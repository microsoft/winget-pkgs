ShortDescription: 用于识别、移除或更新 Windows 上 .NET 安装的命令行工具。
Description: |-
  .NET 安装管理器（DNIM）用于识别、移除和更新 Windows 设备上的 .NET 安装，主要面向需要清理设备上存在漏洞的 .NET 副本以满足合规目标的组织。
  DNIM 以单文件 .NET 控制台应用程序的形式发布，运行 dnim --help 可查看命令列表。它能够检测受管理的 .NET 安装，包括 SDK、运行时和 ASP.NET Core 模块，并在校验所用更新源元数据签名后执行移除或更新。
