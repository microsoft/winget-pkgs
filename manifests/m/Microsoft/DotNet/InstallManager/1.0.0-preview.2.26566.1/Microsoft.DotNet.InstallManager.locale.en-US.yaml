ShortDescription: A command-line tool to identify, remove, or update .NET installations on Windows.
Description: |-
  The .NET Install Manager (DNIM) identifies, removes, and updates the .NET installations on a Windows device. It is aimed mainly at organisations that need to clear vulnerable .NET copies from their devices to meet compliance targets.
  DNIM ships as a single-file .NET console application; run dnim --help for the command list. It detects managed .NET installs, including SDKs, runtimes and ASP.NET Core modules, and validates the signing of the release metadata it relies on before removing or updating them.
