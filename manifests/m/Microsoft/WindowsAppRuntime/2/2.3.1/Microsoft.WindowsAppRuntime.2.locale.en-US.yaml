Description: |-
  The Windows App SDK provides a unified set of APIs and tools that you can use to build modern Windows apps.

  This package's .exe installs the «MicrosoftCorporationII.WinAppRuntime.Main» (Windows App Runtime Main), «MicrosoftCorporationII.WinAppRuntime.Singleton» (Microsoft Windows App Runtime Singleton), and «Microsoft.WinAppRuntime.DDLM» (Microsoft Windows App Runtime DynamicDependency LifetimeManager) MSIX files, and also installs them for other architectures supported by the system (e.g. installs both for x64 and x86 on an x64 system.)

  Not to be confused with Microsoft.WindowsApp.
