Description: |-
  A standalone installer for the Microsoft Windows App Runtime DynamicDependency LifetimeManager.

  Normally, this is installed as a part of the regular «Microsoft.WindowsAppRuntime.2» package. However, the direct MSIX installers offer more granular control, as they allow non-admin installations, allow installing on a per-architecture basis, allows managing it separately from the Main and Singleton runtimes, and also helps settle things like what «Microsoft Windows App Runtime DynamicDependency LifetimeManager» is in the system's lists of installed apps.
