ReleaseNotes: |-
  DXC Release Highlights
  This release of the DirectX Shader Compiler (DXC) includes HLSL language updates, SPIR-V backend improvements, compiler correctness and stability fixes, and corrections to the Windows and Linux release packages.

  HLSL Language
  - Updated [unroll(N)] behavior for HLSL 202x so the count acts as a partial-unroll hint rather than limiting loop iterations.
  - Added the -Whlsl-2026-compat warning group to help identify compatibility issues introduced by HLSL 2026.
  - Improved diagnostics for invalid resource-containing casts and removed legacy effects syntax from HLSL 202x.

  SPIR-V Backend Improvements
  - Expanded support for inline SPIR-V attributes and globallycoherent resource-heap accesses.
  - Corrected code generation for buffer-pointer bitfields, raw-buffer alignment, and older SPIR-V versions.
  - Fixed crashes involving RayQuery type shadowing and static members of constant and texture buffers.

  Compiler Quality and Stability
  - Fixed derivative operations being incorrectly moved into divergent control flow.
  - Fixed several crashes and assertions involving templates, dynamic resource heaps, and ray-payload member methods.

  Release Packaging (Regressions)
  - Fixed Windows ARM64 import libraries so native ARM64 applications can link against dxcompiler.lib.
  - Corrected the Linux release archive to contain only shipping files, which includes the expected headers again.

  More Details
  This DXC release is also available as the Microsoft.Direct3D.DXC NuGet package.
  For the complete itemized list of changes and technical details, see ReleaseNotes.md.
