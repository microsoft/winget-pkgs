ShortDescription: Command line tool for building XACT-style wave banks for use with DirectXTK for Audio.
Description: XWBTool is a command line tool used to build XACT-style .xwb WaveBank files. These can be loaded using the DirectX Tool Kit for Audio (part of DirectX Tool Kit for DX11 / DX12) with the WaveBank class.
