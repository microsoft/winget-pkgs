PackageIdentifier: Microsoft.AppInstaller
PackageVersion: 1.29.280.0
PackageLocale: am
PackageName: የመተግበሪያ ጫኝ
ShortDescription: ተጠቃሚዎች በ Windows 10 እና Windows 11 መሳሪያዎች ላይ የግል ኮምፒዩተሮችን እንዲያገኙ፣ እንዲጭኑ፣ እንዲያሻሽሉ እና እንዲያዋቅሩ የሚያስችል ኃይለኛ የትእዛዝ መስመር መሳሪያ ለ Windows ጥቅል አስተዳዳሪ (WinGet) እንደ ማቅረቢያ ተሽከርካሪ ሆኖ ያገለግላል።
Description: |-
  የ Microsoft መተግበሪያ ጫኝ ተጠቃሚዎች የመተግበሪያ ጥቅሎችን በድርብ ጠቅታ በጎን እንዲጭኑ በመፍቀድ የ Windows መተግበሪያዎችን መጫን ቀላል ያደርገዋል—የ PowerShell ስክሪፕቶችን ወይም የትእዛዝ መስመር መሳሪያዎችን ማስኬድ አያስፈልግም። እንደ የመተግበሪያው ስም፣ አታሚ፣ ስሪት፣ የማሳያ አርማ እና የተጠየቁ ችሎታዎች ያሉ ቁልፍ የጥቅል ዝርዝሮችን ያቀርባል፣ የመጫን ተሞክሮን በማሳለጥ እና ችግሮች በሚፈጠሩበት ጊዜ አጋዥ የስህተት መልዕክቶችን ያቀርባል።

  መተግበሪያ ጫኝ ለዴስክቶፕ የግል ኮምፒዩተሮችን ይገኛል እና በ Microsoft Store በኩል ይሰራጫል። እንዲሁም ተጠቃሚዎች በ Windows 10 እና Windows 11 መሳሪያዎች ላይ የግል ኮምፒዩተሮችን እንዲያገኙ፣ እንዲጭኑ፣ እንዲያሻሽሉ እና እንዲያዋቅሩ የሚያስችል ኃይለኛ የትእዛዝ መስመር መሳሪያ ለ Windows ጥቅል አስተዳዳሪ (WinGet) እንደ ማቅረቢያ ተሽከርካሪ ሆኖ ያገለግላል።
