PackageIdentifier: Microsoft.AppInstaller
PackageVersion: 1.29.280.0
PackageLocale: ca-ES-valencia
PackageName: Instal·lador de l'aplicació
Description: |-
  L'instal·lador de l'aplicació de Microsoft simplifica la instal·lació d'aplicacions Windows permetent que els usuaris transmeten localment paquets d'aplicacions amb un doble clic, sense necessitat d'executar scripts del PowerShell o eines de línia d'ordres. Presenta detalls clau del paquet, com ara el nom de l'aplicació, l'editor, la versió, el logotip de la pantalla i les capacitats sol·licitades, la simplificació de l'experiència d'instal·lació i l'enviament de missatges d'error útils quan sorgeixen problemes.

  L'instal·lador de l'aplicació està disponible per a ordinadors de taula i es distribueix mitjançant el Microsoft Store. També serveix com a vehicle de lliurament per a l'Administrador de paquets del Windows (WinGet), una poderosa eina de línia d'ordres que permet als usuaris descobrir, instal·lar, actualitzar i configurar aplicacions en dispositius Windows 10 i Windows 11.
