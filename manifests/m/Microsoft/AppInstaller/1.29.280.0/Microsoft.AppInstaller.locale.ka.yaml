PackageName: აპის ინსტალატორი
Description: |-
  Microsoft-ის აპების ინსტალატორი ამარტივებს Windows პროგრამების ინსტალაციას, რაც მომხმარებლებს საშუალებას აძლევს, გვერდიგვერდ ჩატვირთონ აპების პაკეტები ორმაგი დაწკაპუნებით — არ არის საჭირო PowerShell სკრიპტების ან ბრძანების ხაზის ხელსაწყოების გაშვება. ის წარმოადგენს პაკეტის ძირითად დეტალებს, როგორიცაა: აპის სახელი, გამომცემელი, ვერსია, საჩვენებელი ლოგო და მოთხოვნილი შესაძლებლობები, ამარტივებს ინსტალაციის გამოცდილებას და პრობლემების წარმოქმნისას გაწვდით შეცდომის შესახებ დამხმარე შეტყობინებებს.

  აპების ინსტალატორი ხელმისაწვდომია სტაციონალური კომპიუტერებისთვის და ვრცელდება Microsoft Store-ის საშუალებით. აგრეთვე, ის მუშაობს, როგორც მიწოდების საშუალება Windows-ის პაკეტების მმართველისთვის (WinGet) —მძლავრი ბრძანების ხაზის ხელსაწყოსთვის, რომელიც მომხმარებლებს საშუალებას აძლევს, აღმოაჩინონ, დააყენონ, გადაიყვანონ ახალ ვერსიაზე და დააყენონ აპლიკაციების კონფიგურაცია Windows 10 და Windows 11 მოწყობილობებში.
