PackageIdentifier: Microsoft.AppInstaller
PackageVersion: 1.29.280.0
PackageLocale: nb
PackageName: Appinstallasjonsprogram
ShortDescription: Et kraftig kommandolinjeverktøy som gjør det mulig for brukere å oppdage, installere, oppgradere og konfigurere programmer på Windows 10- og Windows 11-enheter.
Description: |-
  Microsoft Appinstallasjonsprogram forenkler installasjon av Windows-programmer ved å la brukere installere app-pakker direkte med et dobbeltklikk – uten å måtte kjøre PowerShell-skript eller kommandolinjeverktøy. Det viser viktige pakkedetaljer som appnavn, utgiver, versjon, visningslogo og forespurte funksjoner, noe som effektiviserer installasjon og gir nyttige feilmeldinger når det oppstår problemer.

  Appinstallasjonsprogram er tilgjengelig for stasjonære datamaskiner og distribueres via Microsoft Store. Det fungerer også som hjelpemiddel for levering for Pakkebehandling for Windows (WinGet), et kraftig kommandolinjeverktøy som gjør det mulig for brukere å oppdage, installere, oppgradere og konfigurere programmer på Windows 10- og Windows 11-enheter.
