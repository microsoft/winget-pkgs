ReleaseNotes: |-
  ## What's Changed
  • Fix Capitalize in GetManifestForRegisteredProvider event names by @jdu2600 in https://github.com/microsoft/perfview/pull/2481
  • Update .NET SDK To 10.0.402 by @brianrob in https://github.com/microsoft/perfview/pull/2494
  • Fix `GetManifestForRegisteredProvider` returning wrong event details for `EventlogClassic` events. by @jdu2600 in https://github.com/microsoft/perfview/pull/2482
  • Label GetManifestForRegisteredProvider's string table with CurrentUICulture by @jdu2600 in https://github.com/microsoft/perfview/pull/2488
  • Reduce ETLX conversion memory with compact stack indexes by @JeremyKuhne in https://github.com/microsoft/perfview/pull/2485
  • Use bulk copying in GrowableArray.RemoveRange by @JeremyKuhne in https://github.com/microsoft/perfview/pull/2489
  • Select Processes Before Building ETL And EventPipe Stack Sources by @brianrob in https://github.com/microsoft/perfview/pull/2496
  • Fix Unsigned Integer Decoding In TDH Payloads by @brianrob in https://github.com/microsoft/perfview/pull/2495
  • Honor StopProcessing in EventPipeEventSource by @pcshrosbree in https://github.com/microsoft/perfview/pull/2497
  • Validate Scenario Export Output File Names by @brianrob in https://github.com/microsoft/perfview/pull/2504
  • Skip Predefined Template Lookups For Unrelated EventPipe Providers by @brianrob in https://github.com/microsoft/perfview/pull/2503
  • Avoid Allocating Predefined Dynamic Parser Lookup Keys by @brianrob in https://github.com/microsoft/perfview/pull/2502
  • Increase File-Backed Serialization Buffer To Reduce ETLX Write Overhead by @brianrob in https://github.com/microsoft/perfview/pull/2505
  • Fix Hidden PDB Trust Dialog After Switching Applications by @brianrob in https://github.com/microsoft/perfview/pull/2507
  • Fix reserved keyword threshold in GetManifestForRegisteredProvider by @jdu2600 in https://github.com/microsoft/perfview/pull/2509
  • Validate Event Payload Fields, Strings, Arrays, And Related-Activity GUIDs
  • Validate BPerf Session Headers, Compressed Blocks, And Decompression Bounds
  • Require Complete CTF Reads And Validate Array Sizes And Payload Lengths
  • Bound Captured Packet Headers And TCP Options While Preserving Non-IP And Fragment Handling
  • Validate PE Cache Ranges And Require Complete Pointer Reads
  • Decode Kernel TCP Connection IDs And Sequence Numbers According To Event Version

