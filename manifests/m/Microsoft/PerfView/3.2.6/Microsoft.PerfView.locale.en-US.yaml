ReleaseNotes: "## What's Changed\r\n• Fix StackOverflow on malformed EventPipe object type length by @brianrob in https://github.com/microsoft/perfview/pull/2444\r\n• Fix AccessViolation on malformed MethodILToNativeMap entry count by @brianrob in https://github.com/microsoft/perfview/pull/2445\r\n• Fix infinite loop in LinuxPerfScriptEventParser on truncated sched_switch lines by @brianrob in https://github.com/microsoft/perfview/pull/2446\r\n• Support TraceLogging formatting hints by @chwarr in https://github.com/microsoft/perfview/pull/2443\r\n• Improve Keyboard Focus Indicator Contrast by @brianrob in https://github.com/microsoft/perfview/pull/2448\r\n• Enable Escape key dismissal for PerfView help by @brianrob in https://github.com/microsoft/perfview/pull/2450\r\n• Fix Main Window Keyboard Focus Order by @brianrob in https://github.com/microsoft/perfview/pull/2449\r\n• Add Accessible Label To Directory Search Field by @brianrob in https://github.com/microsoft/perfview/pull/2447\r\n• Add support for showing stacks from selected events by @paulusakademius in https://github.com/microsoft/perfview/pull/2418\r\n• Fix Crash Opening OS Heap Allocation Stacks by @brianrob in https://github.com/microsoft/perfview/pull/2453\r\n• Bump version to 3.2.6 by @brianrob in https://github.com/microsoft/perfview/pull/2454\r\n• Improve Stack Names For Dynamically Generated JIT Helpers by @brianrob in https://github.com/microsoft/perfview/pull/2455\r\n\r\n## New Contributors\r\n• @chwarr made their first contribution in https://github.com/microsoft/perfview/pull/2443\r\n\r\n**Full Changelog**：https://github.com/microsoft/perfview/compare/v3.2.5...v3.2.6"
