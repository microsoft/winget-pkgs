ShortDescription: 在员工本机以本地人在环助手的方式，在你的浏览器中执行 Matterway 技能。
Description: 'Matterway Assistant 是 Matterway（AI 原生运营平台，2025 年 10 月被 Cognizant（Nasdaq: CTSH）收购）的本地组件。Assistant 运行在员工自己的电脑上，让技能可以直接在浏览器中执行，使用户经验与自动化在同一个任务上协同工作。技能在托管的 Web 应用 Matterway Console 中编写、部署与监控，由 Assistant 以当前登录用户的权限在本机执行；另提供 Chrome / Edge 浏览器扩展作为替代的执行路径。必要时可开启匿名化遥测，在团队维度统计使用情况。'
