ShortDescription: Runs Matterway skills in your browser from the employee machine as a local, human-in-the-loop assistant.
Description: 'Matterway Assistant is the local component of Matterway, the AI-native operations platform acquired by Cognizant (Nasdaq: CTSH) in October 2025. The Assistant runs on the local machine of the employee and enables the execution of skills in the browser, so user expertise and automation work together on the same task. Skills are authored, deployed and monitored in the Matterway Console, the hosted web application, and the Assistant carries them out locally using the same rights as the logged-in user. A Chrome or Edge extension is offered as an alternative execution route. Optionally, anonymized telemetry can be enabled to track usage patterns at the group level.'
