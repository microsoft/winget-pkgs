ShortDescription: Reopens your apps, terminals, folders and Docker containers after a power cut.
Description: |-
  Session Restore remembers what you have open (VS Code, terminals with Claude Code, File Explorer
  folders, Docker containers and any app you add) and reopens it all after a power cut or crash.
  With a UPS or laptop battery it saves your session and hibernates the PC before the power runs out.
  It also keeps hidden git backups of uncommitted work, shows which program uses a port, and checks
  that other Windows accounts can't read your secrets. It never connects to the internet, and it shows
  exactly what it reads before it starts.
