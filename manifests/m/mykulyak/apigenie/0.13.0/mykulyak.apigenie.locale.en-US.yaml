Author: Andriy Mykulyak
PackageName: API Genie CLI
PackageUrl: https://api-genie.dev
License: Freeware
LicenseUrl: https://api-genie.dev/legal/license
ShortDescription: Tools for OpenAPI, AsyncAPI, GraphQL and gRPC development, with code generators, a mock server and a catalog
Description: |-
  One package installs the five command-line tools of API Genie: apigenie lints, formats, diffs,
  bundles and tests API descriptions (OpenAPI, Swagger 2.0, AsyncAPI, GraphQL, Protobuf);
  apigenie-generator generates clients and servers; apigenie-server runs a mock server and
  validating proxy; apigenie-catalog builds the API catalog of a repository; and apigenie-mcp is an
  MCP server for coding agents.
Moniker: apigenie
