  - tauri
ReleaseNotes: |-
  Editor quick tools: copy any note as Markdown, ==highlight== marker, insert today's date,
  collapsible note-list pane (Ctrl+Shift+B), editor font size cycling, and a reopen-last-note
  setting that starts you where you left off.
