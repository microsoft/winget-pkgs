ShortDescription: A cozy, 100% offline notes desk for Windows.
Description: >-
  NookNook is a cozy, 100% offline notes desk for Windows 10 and 11. Markdown notes with live
  preview, tasks with reminders and repeats, a kanban board, an offline meeting recorder,
  insights with streaks, and optional AI chat with your own API key. All data stays in one
  local SQLite file - no accounts, no cloud, no telemetry. Free and open source under MIT.
