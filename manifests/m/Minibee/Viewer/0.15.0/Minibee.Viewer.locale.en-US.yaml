ShortDescription: 'A tiny Second Life client: a TypeScript / HTML / CSS interface running in a WebView, with a native Rust core (Tauri) doing the heavy lifting underneath. A lightweight buzz into the infinite grid.'
Description: 'A tiny Second Life client: a TypeScript / HTML / CSS interface running in a WebView, with a native Rust core (Tauri) doing the heavy lifting underneath. It does chat, IM (1:1, group, and conference), events, search, radar, map, land, the Destination Guide, and teleport. What it does not do is render the 3D world. Minibee is the friend who comes to the party to talk to people and check the map, not to admire the furniture. Using Minibee requires an existing Second Life or compatible-grid account and connects to the selected grid''s services. The Windows desktop build supports purchasing Linden Dollars (L$) with real money through Linden Lab''s billing service.'
