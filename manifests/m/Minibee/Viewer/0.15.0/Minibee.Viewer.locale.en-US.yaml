  Built for Minibee Viewer 0.15.0. On Windows, winget install Minibee.Viewer is available via WinGet; direct builds are unsigned and will stay that way (SmartScreen may warn - use More info -> Run anyway). On Android, install from Google Play when possible; the APK is for sideloading (full app with L$ buying). The .aab is the Play edition bundle: to comply with Play's virtual-currency billing policy it cannot buy L$ in-app (spending your balance works normally).
  How to verify a download
  Compare the SHA-256 above with a local hash of the file you downloaded:
  certutil -hashfile path\to\installer SHA256
  sha256sum path/to/installer
  On macOS, shasum -a 256 path/to/installer works too. Abbreviated checksums are middle-truncated. A VirusTotal scan link appears under the files the release workflow submitted there (the recommended installers and the APK); the analysis shows up once VirusTotal has processed the file.
