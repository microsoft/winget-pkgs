ShortDescription: Shows the song playing on Spotify, with synced lyrics, as OBS overlays.
Description: |-
  Spotify Now Playing runs in the system tray and serves OBS browser-source overlays for the song you are playing:
  a now playing card with several layouts, and synced lyrics from LRCLIB with a background that follows the album cover.
  It reads Spotify Desktop (and optionally other players) through the Windows media controls, so no login is needed.
  It also writes text files for OBS, keeps a song history, and has a built-in chat bot that answers !song on Twitch and YouTube.
