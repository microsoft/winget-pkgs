PackageIdentifier: Moductus.Moductus
PackageVersion: 0.4.0
PackageLocale: pt-BR
Publisher: Gustavo Cremonez
PackageName: Moductus
License: MIT
ShortDescription: Suíte de utilitários para Windows, open source, em processo único, acionada por teclado.
Description: |-
  O Moductus coloca utilitários de sistema a uma tecla de distância. Uma única hotkey líder (Ctrl+Alt+M por padrão) seguida de uma letra abre qualquer módulo, e cada superfície aparece e some sem virar mais uma janela para gerenciar.
  Módulos: Awake, Peek, Ports, Scratch, Palette, Clips, Freeze, Shelf, Mic, Links, Kill e Timer.
