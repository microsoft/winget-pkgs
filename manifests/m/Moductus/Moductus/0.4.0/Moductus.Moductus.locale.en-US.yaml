ShortDescription: Keyboard-driven suite of Windows utilities in a single lightweight process.
Description: |-
  Moductus puts system utilities one keystroke away. A single leader hotkey (Ctrl+Alt+M by default) followed by a letter opens any module, and every surface appears and disappears without becoming another window to manage.
  Modules: Awake (keep the PC awake), Peek (live floating window thumbnail), Ports (list busy local ports and kill the owner), Scratch (auto-saving drop-down notepad), Palette (launcher, calculator, file finder and clipboard transforms), Clips (clipboard history), Freeze (frozen screen with ruler, color picker, magnifier and OCR), Shelf (temporary file tray), Mic (microphone mute), Links (junctions and symlinks by drag), Kill (end a frozen window) and Timer (pomodoro in the tray icon).
