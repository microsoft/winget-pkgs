ShortDescription: Monitor NVIDIA GPU memory and free it by closing the processes that hold it.
Description: |-
  VRAM Zero shows NVIDIA GPU memory usage in real time, sorts the processes using the GPU
  into local AI tools, non-essential applications and critical system processes, and lets
  the user close the ones they choose after confirmation. It relies on nvidia-smi, makes no
  network connections and stores no data.
