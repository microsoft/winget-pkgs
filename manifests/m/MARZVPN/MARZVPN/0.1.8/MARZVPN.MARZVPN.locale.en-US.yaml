ShortDescription: Public Beta Windows app for the MARZ VPN service (VLESS + REALITY).
Description: |-
  MARZ VPN for Windows is the official desktop app of the MARZ VPN service, built on sing-box with VLESS + REALITY. Sign in with Telegram or email, choose a location and connect with one button.
  This version is a public Beta.
  A MARZ VPN subscription or free trial is required to connect.
  The app installs the MarzVpnHelper Windows service, which manages the VPN tunnel and the Kill Switch. Installing the app does not turn on the VPN or the Kill Switch.
  The Kill Switch is on by default while the VPN is connected: if the VPN drops, internet traffic is blocked until it reconnects. While it is on, the local network and hotel Wi-Fi sign-in pages do not work.
  MARZ VPN Desktop is free software under GPL-3.0-or-later; the MARZ VPN service itself is a commercial subscription.
Moniker: marzvpn
Tags:
- kill-switch
- proxy
- reality
- sing-box
- vless
- vpn
ReleaseNotes: |-
  - Settings has "Check for updates" and shows your version. The app also checks at start, at most once a day, and only opens the download page; it never downloads or installs anything by itself.
  - Windows is still a Beta. The installer has no digital signature yet, so SmartScreen may warn.
  - After an update the VPN is off until you turn it on in the app. A silent update refuses to run while the VPN is on (exit code 3); add /ALLOWVPNOFF to allow it.
ReleaseNotesUrl: https://github.com/amberfield2931/MARZ-VPN-Apps/releases/tag/stable-2026-11-05-2
InstallationNotes: After an update the VPN is off until you turn it on in the app. If the internet does not come back, see RECOVERY.txt in the program folder.
