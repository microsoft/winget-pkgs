Description: "TGit is a Git CLI wrapper that tracks your development activity and sends it to a \nreal-time dashboard. It supports tenant isolation for team/company privacy.\n\nFeatures:\n- Wraps all git commands transparently\n- Tracks commits, pushes, status checks, and more\n- Real-time dashboard showing developer activity\n- Tenant isolation for multi-company environments\n- Azure Cosmos DB backend for scalability\n"
