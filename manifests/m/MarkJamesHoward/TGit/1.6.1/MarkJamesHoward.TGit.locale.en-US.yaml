ReleaseNotes: |-
  ## TGit v1.6.1

  Git CLI wrapper with activity tracking dashboard.

  ### Installation

  **Windows (winget):**
  ```powershell
  winget install MarkJamesHoward.TGit
  ```

  **Cross-platform (.NET tool):**
  ```bash
  dotnet tool install --global TGit
  ```

