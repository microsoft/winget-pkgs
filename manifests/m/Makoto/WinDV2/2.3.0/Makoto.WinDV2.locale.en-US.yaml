ShortDescription: Capture DV video from a camcorder over FireWire and record it back to tape.
Description: |-
  WinDV 2 captures DV video from a camcorder or deck over FireWire (IEEE 1394) into AVI files, and records AVI files back to tape.
  It is a modernized version of Petr Mourek's WinDV 1.2.3, with a Windows 11 interface, 64-bit support, VCR controls, a free-space check and automatic stop at the end of the tape.
  Settings from the original WinDV carry over.
