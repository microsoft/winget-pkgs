ShortDescription: A small Windows tool for moving DV video between a camcorder and disk over FireWire (IEEE 1394), for capturing to AVI and recording back out to tape.
Description: WinDV 2 captures DV video from a camcorder over FireWire (IEEE 1394) into type-1 or type-2 AVI files, with automatic scene splitting on timecode discontinuities and date/time-based filenames, and records AVI files back out to DV tape, optionally concatenating several files into one continuous recording. It is a modernized continuation of Petr Mourek's original WinDV.
