ReleaseNotes: "Monghoul 1.12.2\r\n\r\nLinux gets an AppImage, and with it the automatic updates every other platform already had. It\r\nalso gets its icon back：the desktop entry pointed at an icon that was never installed, so Linux\r\nhas been showing a placeholder in the launcher since March. The rest tightens how queries run and\r\nchanges how often Monghoul confirms your licence. Most of that is edge cases you are unlikely to\r\nhave met.\r\n\r\n## New\r\n\r\n• **AppImage for Linux** — Monghoul now ships an AppImage beside the .deb and .rpm, and it updates itself the way the Windows and macOS builds do.\r\n\r\n## Fixed\r\n\r\n### Linux\r\n\r\n• **The launcher shows the Monghoul icon** — The desktop entry named an icon that was never installed, so the .deb and .rpm showed a generic placeholder.\r\n\r\n### Query and Results\r\n\r\n• **Stopping a query is more reliable** — Stop and the query timeout now reach some operations that kept running after you asked them to stop.\r\n• **Write protection is applied more consistently** — A protected connection refuses writes on every route a query can take to the database.\r\n• **A query that overruns its timeout says so** — The result reports the timeout instead of reporting success."
