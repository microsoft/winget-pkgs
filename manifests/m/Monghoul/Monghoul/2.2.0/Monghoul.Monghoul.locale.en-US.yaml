ReleaseNotes: |-
  Monghoul 2.2.0

  Monghoul 2.2.0 adds sign-in with OIDC for MongoDB. A Pro connection opens your identity provider's page in the browser, stores no password, and can keep the sign-in between app starts. The rest of the release improves what 2.1.0 added. The table dialogs stop when you ask, Refresh All reaches every open level of the tree, and paging through a large result reads the right rows. Dialogs now read their field names to a screen reader, and every list of suggestions works from the keyboard. SQLite BOOLEAN columns edit with true and false, and a greyed Run button says why.

  ## Highlights

  • **OIDC sign-in for MongoDB** — A Pro connection signs in through your identity provider's page in the browser, and Monghoul stores no password.
  • **Stop works in the table dialogs** — Create Table, Add Column and Create Index stop while Monghoul still checks the change.
  • **Refresh All reaches every open level** — It covers a collapsed connection, the rows you open while it runs, and every Redis row.
  • **Paging reads the right rows** — Previous rows and Next rows hold after a larger fetch size and past an oversized row.
  • **Keyboard and screen reader support in dialogs** — Each field reads its label, and suggestion lists take the arrow keys and Enter.
  • **A greyed Run or Explain says why** — The tooltip names what holds the button back.
  • **A clearer Redis key browser** — A key row starts with its type, Go to key has its own button, and the edit actions are buttons.

  ## New

  • **Sign in to MongoDB with OIDC in your browser** — A Pro connection can use MONGODB-OIDC：Monghoul opens your identity provider's page, stores no password, and shows the wait with Open the page again and Cancel.
  • **Stay signed in to an OIDC connection** — Stay signed in keeps the sign-in between app starts, encrypted like a saved password, and the connection menu's Sign Out forgets it.
  • **SQLite BOOLEAN columns edit with true and false** — A column declared BOOLEAN offers true and false and writes 1 and 0, and a cell that holds another value edits as text and keeps it.
  • **Open a Redis module-type key in the console** — A key with no view of its own has an Open in Console button that puts its info command in a console tab and runs nothing.

  ## Improved

  • **A greyed Run or Explain says why** — On MongoDB and SQL tabs the tooltip of a greyed Run or Explain names what holds it back, such as no code, no database or a running query.
  • **An error shows as a message and its reason** — A failed run, stop, tab or favorite action shows a short message with the server's text under it, not one long line.
  • **ClickHouse Order by takes picked columns** — A pick in Create Table's Order by adds the column to the key, so a key of several columns needs no typing.
  • **Calendar for PostgreSQL domain columns** — A column whose type is a domain over a date or a timestamp opens the calendar, and a domain over a boolean or an enum offers its choices.
  • **SQLite STRICT tables take only strict types** — Create Table and Add Column list only the types a STRICT table takes, and Add Column checks the type and takes a blob or a bracketed literal as a default.
  • **A typed page size can pass 1,000** — The page size field of a result takes a typed number up to 10,000, on every engine; it stopped at 1,000.
  • **Softer control borders in dark themes** — The boxes of inputs and secondary buttons are less bright in every dark theme; light themes keep their contrast.
  • **Redis key browser has a clearer layout** — A key row starts with its type, Go to key has its own button (Ctrl+G), New Key opens beside the list, and Rename and the row edits are buttons.

  ## Accessibility

  • **Form fields have names for screen readers** — Each text box, select and suggestion field of a dialog reads its own label, and a required field says required.
  • **Suggestion lists work from the keyboard** — In every field that suggests values, the arrow keys move through the list, Enter picks a suggestion, and a screen reader hears each one.
  • **Next rows and Previous rows keep the keyboard focus** — After a window read the focus returns to the button or the Rows per fetch choice you used.
  • **Colour picker selection is readable in every theme** — The selected No Color row and the Apply Custom Color button meet the contrast limit in every built-in theme.

  ## Fixed

  ### SQL

  • **A table dialog's Stop works during the check** — A Stop in Create Table, Add Column or Create Index stops the change while Monghoul still checks it, over a slow link or an SSH tunnel too.
  • **A read that writes is refused the same way** — In an open PostgreSQL transaction, a later window of a read that calls a writing function gets the same refusal as the first window.
  • **Next rows and Previous rows read the right window** — After a larger Rows per fetch, Previous rows no longer reads the shown rows again, and a row over the size limit is named and no longer blocks the rows after it.
  • **A hidden result view keeps the apply toast** — With Table hidden in the Interface settings, the outcome of an apply shows in a toast again.
  • **No Column or Index rows on SQLite virtual tables** — The menu of an FTS5 or R*Tree table no longer offers New Column and New Index, which SQLite refuses.

  ### Sidebar

  • **Refresh All reaches every open level** — Refresh All lists the open levels under a collapsed SQL or Redis connection and the rows you expand while it runs, and Shift+F5 works on every Redis row.
  • **Palette refresh leaves a disconnected connection** — Refresh all open connections no longer connects again a SQL or Redis connection you disconnected and left open in the tree.
  • **A data-only COMMIT no longer lists the tree again** — A PostgreSQL COMMIT of data changes, or an ANALYZE whose outcome is unknown, no longer makes every open level of the tree list again.

  ### Workspace

  • **Closing a panel works for every panel** — A panel closes whenever another panel is open, the first one too, and moving the last tab out of a panel removes it in older workspaces.
  • **The footer stays in view under the server banner** — The warning banner and the app share the window's height, so the banner no longer pushes the footer under the window's edge.

  ### AI access

  • **A new palette sets the editor's base** — An MCP theme update that turns the background light or dark sets the editor's base to match.
