ShortDescription: Syncs the listening port of qBittorrent, Transmission, Deluge, or Nicotine+ with the VPN-assigned port, and imports media files into Plex-compatible library folders
Description: |-
  qbPortWeaver is a Windows system tray application that keeps the listening port of qBittorrent, Transmission, Deluge, or Nicotine+ synchronized with the port assigned by ProtonVPN, PIA, or any NAT-PMP capable VPN gateway or router.
  It monitors the VPN's forwarded port on a configurable interval, updates the client automatically when the port changes, verifies the port is reachable, and can recover the VPN connection automatically when port detection fails. Nicotine+ is driven through a small bridge plugin that qbPortWeaver installs, so its port changes while the client keeps running. A Status panel shows the live sync chain, recent port changes, and session statistics, and a built-in Media Manager can import media files into Plex-compatible library folders.
