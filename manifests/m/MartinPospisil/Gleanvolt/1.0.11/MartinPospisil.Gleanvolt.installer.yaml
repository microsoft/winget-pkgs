# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: MartinPospisil.Gleanvolt
PackageVersion: 1.0.11
# The release ships a zip, not an installer: a self-contained, single-file build that needs no .NET
# and writes nothing outside its own directory. WinGet installs it as a portable, which is what it is.
InstallerType: zip
NestedInstallerType: portable
ReleaseDate: '2026-10-13'
Installers:
- Architecture: x64
  NestedInstallerFiles:
  # The zip contains exactly one top-level directory, named for the runtime identifier. That is
  # deliberate in release.yml, and this path depends on it.
  - RelativeFilePath: win-x64\Gleanvolt.Worker.exe
    PortableCommandAlias: gleanvolt
  InstallerUrl: https://github.com/mpospisil/gleanvolt/releases/download/v1.0.11/gleanvolt-1.0.11-win-x64.zip
  InstallerSha256: 1571FD3B7F521B85CBE06A3E050F8356F341A0A134391D0219EF93ABC6A0F7B0
ManifestType: installer
ManifestVersion: 1.12.0
