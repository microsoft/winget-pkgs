ShortDescription: Terminal y estación de trabajo DevOps/Cloud nativa en Rust (GPUI) para Windows con soporte multi-shell, Cloud, Docker, SFTP y agentes IA.
Description: |-
  Umbra es una aplicación de terminal y estación de trabajo DevOps/Cloud nativa para Windows construida en Rust con GPUI y alacritty_terminal.
  Incluye pestañas PTY multi-shell (PowerShell, Busybox Linux, Zsh + Oh My Zsh, Git Bash, WSL 2), consola GCP/AWS con Danger Mode en PROD, QuickEdit con SFTP y ocultamiento de secretos, panel Docker, monitor de sistema/puertos e integración de agentes IA (OpenCode, Antigravity, Claude Code, Codex CLI) con alertas visuales filtradas de ruido ANSI.
