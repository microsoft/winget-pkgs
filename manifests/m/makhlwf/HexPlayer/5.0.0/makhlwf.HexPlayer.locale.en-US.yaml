  HexPlayer v5.0.0
  What's New in Version 5.0.0
  - Experimental Full Linux Support:
    - Native packages for Ubuntu/Debian (.deb) and Fedora/RHEL (.rpm), plus portable standalone tarballs (.tar.gz).
    - Universal single-command installer (�ash install.sh) with distribution auto-detection and accessibility audit (--check-accessibility).
