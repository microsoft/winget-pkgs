ReleaseNotes: |-
  - Introduce the virtual machine settings user experience based on XAML for creating and editing virtual machine configurations, including supported runtime settings. (Thanks to gpt-6.1-sol medium @ pi agent.)
  - Introduce support for copying virtual machine screenshots to the clipboard. (Thanks to gpt-6.1-sol max @ pi agent.)
  - Introduce virtual machine video recording support with MP4 output. (Audio recording requires Windows Server 2022 or later Host OS.) (Thanks to gpt-6.1-sol max @ pi agent.)
  - Introduce support for switching keyboard navigation redirection at runtime. (Thanks to gpt-6.1-sol medium @ pi agent.)
  - Introduce support for restoring the virtual machine window size to match the configured display resolution. (Thanks to gpt-6.1-sol medium @ pi agent.)
  - Try to fix shutdown blocking not working properly via registering the shutdown blocking reason during main window creation. (Thanks to gpt-6.1-sol medium @ pi agent.)
  - Fix a possible mismatch between the virtual machine window enhanced session button state and the actual Hyper-V session mode in use. (Thanks to gpt-6.1-sol medium @ pi agent.)
  - Refactor the file open and save dialog implementations. (Thanks to gpt-6.1-sol max @ pi agent.)
  - Update Mile.Windows.Helpers to 1.0.1427.
  - Update documents.
