ReleaseNotes: |-
  I'm excited to announce that we've released NanaZip 7.0, version 2609.2 (7.0.1843.0), now available for download.
  Note: Read NanaZip Technical Focus from Kenji Mouri to clarify some future directions of NanaZip.
  Starting with NanaZip 7.0, NanaZip follows a rolling release model. Read https://github.com/M2Team/NanaZip/blob/main/Documents/Versioning.md#release-tags for more information.
  Release Notes
  Note: These notes also cover the corresponding preview release.
  - Add fix for wrong password on all Zip archives. (Contributed by dinhngtu.)
  - Update Brazilian Portuguese translation. (Contributed by maisondasilva.)
  - Use Mile.DotNet.Helpers instead of Mile.Project.Helpers.
  - Update Mile.Mobility to 1.1.678.
  - Update Mile.Windows.Internal to 1.0.3729.
  - Update Mile.Detours to 1.0.2442.

