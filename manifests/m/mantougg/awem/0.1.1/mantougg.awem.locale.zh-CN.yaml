PackageIdentifier: mantougg.awem
PackageVersion: 0.1.1
PackageLocale: zh-CN
ShortDescription: 跨平台 AutoWonder 执行器管理应用：单一 Go 二进制即常驻 daemon + 内嵌 Web 页 + CLI 子命令。
Description: |-
  awem（AutoWonder Executor Manager）是跨平台（Windows / Linux / macOS）的本机 AutoWonder 执行器管理应用。单一 Go 二进制 = 常驻 daemon + 内嵌 Web 页 + CLI 子命令；AI 用 CLI 维护，人用 Web 页维护。
  它用结构化配置 + 进程守护 + 统一视图替代散落的手工 bash 脚本：崩溃自动拉起采用 1s→5m 指数退避，每个执行器有独立的按大小滚动日志与保留策略，总览把本地进程状态与平台 ONLINE / BUSY / OFFLINE 状态并列展示。
  本地 API 仅绑定 127.0.0.1，使用随机 token 鉴权，校验 Host / Origin 防 CSRF，输出中令牌恒掩码。
ReleaseNotes: |-
  自 v0.1.0 以来的变更，按功能块列举：
  总览展示改造（一期，design §9）
  - Tab 框架上线（本期仅「列表」一个 tab，选择记入 URL hash #tab=list，刷新保持）
  - 平铺 ⇄ 树形切换：项目 → 小队 → 执行器；多小队执行器重复叶子且选择状态同步；
    有项目无小队归「未分配小队」；「未归属」组固定排最后；组行含复选框与在线徽标
  - 详情页运行时间带：默认 24h 窗口，状态区间 + 崩溃 ✕ 标记，点击穿透定位日志并暂停跟随
  总览批量操作
  - 多选：行复选框、表头全选/半选、树形组行全选/半选（按执行器标识去重）
  - 批量启动（无确认）/ 停止 / 删除（须确认，确认正文写具体数量与名称）
  - 删除含运行中项时整批阻止并提示先停止；部分失败时 Toast 汇总成功/失败数量与原因，
    成功项自动取消勾选
  平台联动与列展示
  - 平台联动对齐真实平台协议（只读轮询 ONLINE/BUSY/OFFLINE + 漂移检测）
  - 总览新增「所属项目」「所属小队」两列与执行器中文名（副行等宽标识名）；未联动时自动隐藏归属列
  体验修复
  - 详情页/添加预览 null.length 白屏：parsed.passthrough 恒输出 []
  - 总览表格宽度：内容区最大宽 1200→1440px，联动 11 列时操作列不再被横向滚动裁切
  - 批量操作条并入常驻工具行（行高锁定 32px），出现/消失不再顶动表格
  - 版本号缺省自动取 git describe，本地构建横幅不再显示 0.0.0-dev
  文档
  - 观测页设计定稿（决策#17）与 ui-guidelines 新增 Tabs/树形列表/时间带/SVG 图表/指标卡规范
  - 补齐开发导向文档：AGENTS.md 架构速查与提交前检查清单、docs/dev-guide.md、各包 doc.go
  已知余量 / 未验证项
  - macOS/Windows 真机验证未做（T10，暂停）
  - T11-F4 十六条决策核对表待用户复核
