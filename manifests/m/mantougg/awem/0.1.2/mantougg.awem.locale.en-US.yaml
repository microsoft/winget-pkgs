ShortDescription: AutoWonder executor manager that runs as one Go binary daemon with a built-in web page and CLI.
Description: |-
  awem (AutoWonder Executor Manager) is a local AutoWonder executor manager for Windows, Linux, and macOS. A single Go binary is a resident daemon, an embedded web page, and a set of CLI subcommands: AI agents maintain executors through the CLI while people use the web page.
  It replaces scattered hand-written shell scripts with structured configuration, process supervision, and one unified view. Crash restart uses exponential backoff from 1 second to 5 minutes, each executor gets its own size-rolled log file with a retention policy, and the overview shows local process state beside the platform ONLINE, BUSY, and OFFLINE state.
  The local API binds only to 127.0.0.1, authenticates with a random token, checks Host and Origin headers, and masks tokens in output.
