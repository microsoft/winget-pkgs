ShortDescription: A 2D raising-simulation game engine with a Qt editor and Windows and Web players.
Description: |-
  RaisingEngine provides the Raising Studio Qt editor, a deterministic C++ simulation runtime, and Windows and Web game export. Designers and LLM tools edit the same validated project data.
  This is an unsigned authoring preview with Korean, English and Japanese editor languages. It includes the required application runtimes; a separate Qt SDK or Node.js installation is not required. Keep game projects and saves outside the installation directory.
