PackageIdentifier: miandbits.RaisingEngine.Preview
PackageVersion: 0.1.0-preview.3
PackageLocale: ja-JP
Publisher: RaisingEngine contributors
PackageName: RaisingEngine Preview
License: MIT
ShortDescription: QtエディターとWindows・Webプレイヤーを備えた2D育成シミュレーションゲームエンジン。
Description: |-
  RaisingEngineは、Raising Studio Qtエディター、決定論的なC++シミュレーションランタイム、Windows・Web向けゲームの書き出し機能を提供します。デザイナーとLLMツールが同じ検証済みプロジェクトデータを編集できます。
  韓国語・英語・日本語に対応した署名なしの制作プレビューです。Qt SDKやNode.jsを別途インストールする必要はありません。ゲームプロジェクトとセーブデータはインストール先とは別のフォルダーに保存してください。
Documentations:
