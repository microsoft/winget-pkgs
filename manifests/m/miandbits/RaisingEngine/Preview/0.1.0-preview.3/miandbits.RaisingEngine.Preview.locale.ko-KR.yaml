PackageIdentifier: miandbits.RaisingEngine.Preview
PackageVersion: 0.1.0-preview.3
PackageLocale: ko-KR
Publisher: RaisingEngine contributors
PackageName: RaisingEngine Preview
License: MIT
ShortDescription: Qt 편집기와 Windows·웹 플레이어를 제공하는 2D 육성 시뮬레이션 게임 엔진.
Description: |-
  RaisingEngine은 Raising Studio Qt 편집기, 결정론적 C++ 시뮬레이션 런타임과 Windows·웹 게임 내보내기를 제공합니다. 디자이너와 LLM 도구가 같은 검증된 프로젝트 데이터를 편집합니다.
  한국어·영어·일본어 편집기를 포함하는 무서명 제작 프리뷰입니다. 별도 Qt SDK나 Node.js 설치가 필요하지 않습니다. 게임 프로젝트와 저장 파일은 설치 폴더 밖에 보관하세요.
Documentations:
