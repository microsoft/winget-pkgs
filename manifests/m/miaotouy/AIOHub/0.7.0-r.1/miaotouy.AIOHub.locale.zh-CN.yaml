ShortDescription: AI 平台应用，提供多种实用的开发和日常工具，以及高可控性的 LLM 交互。
Description: |-
  一个基于 Tauri + Vue 3 + TypeScript 开发的桌面端枢纽应用，提供多种实用的开发和日常工具。

  🌟 旗舰功能：LLM 智能对话
  AIO Hub 的聊天功能是一个专为复杂任务和深度探索而设计的、高度可定制的对话式 AI 工作空间。
  🌐 开放的模型生态 (Open Model Ecosystem)
  无缝集成，灵活扩展。
  - 多服务商支持：原生支持 OpenAI, Anthropic (Claude), Google (Gemini), Cohere, DeepSeek 等多家主流 LLM 供应商。并且通过兼容 OpenAI API 的接口（如 Ollama, LM Studio, Llama.cpp），轻松接入和管理本地运行的语言模型。
  - 自定义端点：支持为所有已集成的服务类型（如 OpenAI, Claude, Gemini 等）添加自定义 API 端点，具备极高的可扩展性。
  - 可视化模型管理：在设置中可以集中管理所有模型的元数据，定义其能力（如视觉、工具使用），并在工具中根据任务需求（如“需要视觉能力”）进行智能筛选。
  🌳 双视图对话管理 (Dual-View Conversation Management)
  在传统的线性列表与创新的非线性图谱之间自由切换，满足不同场景的需求。
  - 传统线性视图 (Linear List View)
    - 极致性能：基于 @tanstack/vue-virtual 实现虚拟滚动，轻松处理包含数千条消息的超长会话，始终保持流畅。
    - 熟悉的体验：经典的自上而下消息流，符合直觉，上手零成本。
    - 消息导航器：配备了快速跳转（到顶部/底部）和新消息提示功能。
    - 精细化控制：消息的悬浮工具栏支持复制、编辑、重新生成、创建分支、上下文分析、禁用消息等多种功能，实现对会话的深度控制。
  - 非线性对话图谱 (Non-linear Conversation Graph)
    - 无限画布：由 Vue Flow + D3.js 驱动，将对话历史呈现为可交互的树状网络。
    - 双布局引擎：提供清晰层级的树状布局和动态物理模拟的力导向布局，并支持一键切换。
    - 高级节点操作：启用/禁用分支、查看详情、复制内容、删除子树。
    - 自由的结构重组：通过拖拽连接线“嫁接”分支，自由重组对话流，所有结构操作均支持撤销/重做。
    - 可视化辅助：内置小地图、缩放/平移控件和活动分支高亮，在复杂的对话网络中也能轻松导航。
  🛠️ 专业级上下文工程 (Prompt Engineering)
  完全掌控发送给模型的每一个 Token。
  - 上下文分析器：开发者级调试工具。清晰地查看最终发送给 LLM 的完整 Prompt、历史消息、Token 消耗和原始请求体。
  - 高级上下文注入：引入了声明式的消息注入策略，可以精确控制预设消息在上下文中的位置（如“倒数第二条”或“某个锚点之前”），并支持导入 SillyTavern 角色卡和预设，无缝复用社区资源。
  - 宏系统 (Macro System): 在 Prompt 中使用 {{user}}, {{time}}, {{random::...}} 等动态宏，构建强大的自动化工作流。
  - 智能体 (Agents): 智能体的核心是预设消息序列，它允许你将一系列 System, User, Assistant 消息（包括特殊的“用户档案”和“聊天历史”占位符）组合成一个可复用的模板。通过拖拽调整顺序、启用/禁用特定消息，可以构建出高度定制化的对话开场或上下文，并支持导入/导出和社区分享。
  - 动态智能体切换：与传统聊天应用中“一次会话绑定一个助手”的模式不同，AIO Hub 将会话与智能体彻底解耦。你可以在同一段对话中随时切换智能体，让“代码专家”帮你写代码，再无缝切换到“文档专家”帮你写注释，使对话能够围绕“任务”本身而非某个固定的“助手”展开。
  - 用户档案 (Personas): 预设多个用户身份（如“高级架构师”、“代码审查员”），随时切换，让 AI 更懂你的角色和需求。
  🖼️ 多模态交互 (Multi-modal Interaction)
  - 文件上传与引用：拖拽或粘贴图片、PDF、TXT 等文件到聊天窗口。文件将被资产管理器统一处理，方便在聊天中引用，以实现“总结这份 PDF”、“分析这张图表”等高级功能。
  - 视觉模型支持：完美配合 Gemini, Claude, GPT-5, Qwen-VL 等多模态模型的视觉识别能力。

  ✨ 核心亮点
  🖼️ 自由窗口管理
  打破传统布局限制。
  - 组件级分离：不仅是工具，连聊天输入框、对话区域都可以被拖拽成为独立的浮动窗口。
  - 状态同步：所有分离窗口共享同一个状态源，在一个窗口操作，所有窗口实时更新。
  - 记忆功能：自动记住所有窗口的位置和大小。
  🎨 极致视觉体验
  - 原生特效：支持 Windows Mica / Acrylic 和 macOS Vibrancy 毛玻璃特效。
  - 动态壁纸：支持视频/图片轮播壁纸，配合 CSS 混合模式 (Blend Modes)，打造沉浸式工作台。
  - 深度定制：内置 CSS 编辑器，支持实时修改应用样式的每一个细节。
  🧩 强大的插件系统
  - JavaScript 插件：轻量级 UI 扩展，即写即用。
  - Native 插件 (Rust): 高性能后端扩展，通过 DLL 动态加载。
  - Sidecar 插件：支持任意语言编写的独立进程插件。

  🚀 效率工具集
  📊 Git 仓库分析器 (Git Analyzer)
  基于 Rust git2-rs 的高性能分析工具
  - 无依赖：不依赖系统 Git 命令，直接读取 .git 数据库，速度极快。
  - 流式分析：采用流式传输技术，秒开大型仓库，实时渲染提交图表。
  - 多维可视化：贡献者热力图、提交频率图、代码行数统计。
  👁️ 智能 OCR (Smart OCR)
  多引擎融合的文字识别方案
  - 多引擎切换：支持 VLM (GPT-4o)、Windows Native (离线快)、Tesseract.js (纯前端)。
  - 智能切图：独创的长图切片算法，自动识别空白区域切割长截图，大幅提升识别率。
  - 批量处理：支持多图并发识别和结果导出。
  📦 资产管理器 (Asset Manager)
  应用级的资源中心
  - 统一索引：集中管理所有工具产生的图片、文档和媒体文件。
  - 自动去重：基于内容哈希 (SHA-256) 的自动去重机制，节省存储空间。
  - 高性能：Rust 后端驱动的快速索引和筛选，支持无限滚动。
  🎨 正则表达式应用器 (Regex Applier)
  双引擎正则处理工具
  - 实时预览：前端 JS 引擎提供毫秒级的输入反馈。
  - 批量处理：后端 Rust 引擎处理大规模文件修改，性能强劲。
  - 规则链：将多个正则替换组合成一条处理流水线 (Pipeline)。
  📝 富文本渲染引擎 (Rich Text Renderer)
  专为 LLM 流式输出打造的高性能渲染方案
  - 零闪烁流式渲染：采用增量 Diff 算法和 Patch 系统，完美解决流式输出时的抖动问题，带来打字机般的丝滑体验。
  - 深度混合排版：自研解析器，完美支持 Markdown 与任意深度 HTML 标签的混合嵌套。
  - 丰富的交互组件：
    - 代码块：集成 Monaco Editor，提供专业级的高亮、折叠和字体控制。
    - 思维链：原生支持 <think> 标签，以可折叠的动态组件展示 LLM 的思考过程。
    - 图表与公式：内置 Mermaid 图表（支持缩放/独立窗口）和 KaTeX 数学公式渲染。
  - MD 样式编辑器 (Style Editor):
    - 所见即所得：针对标题、段落、引用、代码等每一种 Markdown 元素提供独立的实时预览面板。
    - 全掌控：可精细调整字体、颜色、边距等 CSS 属性，打造独一无二的阅读体验。
    - 灵活性：支持一键启用/禁用自定义样式，或重置为系统默认，随心切换。
  🛠️ 更多实用工具
  - JSON 格式化：智能格式化和美化 JSON 数据，支持语法高亮和错误提示，可一键发送至聊天窗口进行分析。
  - Token 计算器：估算文本 Token 数，支持多种分词模型。
  - 颜色提取器：屏幕取色、图片色板分析。
  - 文本差异对比：基于 Monaco Editor 的专业级 Diff 工具。
  - 目录树生成：生成项目结构树，支持 .gitignore 过滤。
  - 以及更多工具……
ReleaseNotes: |-
  AIO Hub 0.7.0-r.1
  本次更新汇总自上次发布的 0.6.6-r.2 以来的累计改动。期间部分测试版本因 CI/CD 配置问题未能发布，这里合并介绍这段时间新增的功能、体验改进与修复。
  更新重点
  - 知识体系重构：思绪（Recall）与知识文档（Knowledge）分开管理，新增检索管线、资料工作台与旧数据迁移引导。
  - 对话与模型配置增强：支持斜杠命令、自定义工具栏、按用户回合压缩上下文，以及虚拟渠道主备组合。
  - 子智能体与后台任务：支持任务派遣、进度查看、追加指导、停止任务与跨窗口同步。
  - Git 工作台扩展：新增分支泳道图、仓库全景、文件与内容搜索、媒体差异预览，以及统一标签创建与推送。
  - 多媒体工具升级：媒体生成支持全局任务队列，FFmpeg 新增序列帧合成，字幕 OCR 支持本地视频离线识别。
  知识资料与思绪检索
  - 原知识库拆分为「思绪（Recall）」与「知识文档（Knowledge）」，分别管理记忆条目和来源文档。
  - Recall 使用 SQLite 持久化，支持语义、标签与关联联想等多种候选召回，提供检索管线预设、阶段编辑、评分与运行诊断。
  - Knowledge 新增资料工作台，支持文件导入、目录来源同步、持久导入任务、分块与向量化、文档标签和检索过滤。
  - 聊天支持显式引用资料；智能体可通过已授权的检索工具查询资料，知识库访问支持全局开关。
  - 嵌入模型增加身份与向量空间配置，便于确认向量复用条件，降低切换模型后混用向量的风险。
  - 重做备份与恢复格式，兼容旧版思绪备份，并支持将旧版思绪备份转换为 Knowledge 文档。
  - 新增旧数据检测、迁移确认、执行进度与结果报告；迁移后默认保留旧目录，清理操作需单独确认。
  - 修复删除资料后的全文索引残留、数据变更后检索缓存失效，以及资料库路径随数据目录迁移的问题。
  LLM 对话
  - 输入框支持 / 斜杠命令、拼音检索与分组快捷操作。
  - 输入工具栏支持自定义布局、排序与右侧状态显示；输入面板可展开、收起，并可设置重复点击时的行为。
  - 新会话草稿支持持久保存与刷新恢复，新增工具栏新建会话入口。
  - 支持单会话完整 JSON 导入与导出，携带关联附件和上下文参数。
  - 消息支持排队、等待、生成与停止控制；增加自动重试 HTTP 状态码白名单。
  - 上下文可按用户回合压缩，改进连续压缩时旧摘要的继承与展示。
  - 可选将 VCP 上游响应拆分为多个消息节点，默认关闭；补齐分段消息的推理状态与耗时统计。
  - 消息用量展示补充缓存命中信息，发送前图片 Token 预估考虑压缩与缩放结果。
  - 优化长会话虚拟列表、阅读位置保持、气泡操作栏与工具调用展开布局；批量会话管理支持内容搜索与高亮。
  - 修复会话保存、删除与恢复的一致性，加载时可修正意外中断的生成状态；流式响应中断后保留已接收内容。
  - 修复消息重试受父节点角色限制、分段消息与排队消息分支冲突、话题自动命名触发时机，以及消息底部裁剪等问题。
  模型、渠道与参数
  - 渠道支持原生导入导出、New API「复制连接信息」导入，以及多格式模型 ID 批量添加。
  - 支持模型执行协议的手工分配与探测结果应用，聚合渠道可配置默认协议路由。
  - 新增虚拟渠道组合，统一管理主备模型执行与回退；下游工具保留显式模型绑定。
  - 更新模型元数据规则、预设和能力识别，模型刷新前可预览变化；增加智能体模型参数与上下文配置页。
  - 统一输出预算，并按模型能力过滤采样参数，减少不适用参数造成的请求失败。
  - 接入 audio.cpp 本地音频渠道与专用语音转写端点，补充 OpenRouter 图像、视频、语音及 Decisions 协议适配。
  - 增加 TypeSafe AI System One 决策渠道，并更新 DeepSeek、Claude、GPT、Gemini、GLM、Agnes 与 Jev 等模型适配。
  - 修复 Azure 渠道运行时适配、配置导入误报，以及 Key 健康状态与连接测试行为不一致的问题；凭据全部不可用时给出明确错误。
  智能体、子智能体与工具审批
  - 新增子智能体交互工具与内置子智能体，按需提供可用能力，并支持并发与调度配置。
  - 后台任务中心支持任务派遣、状态查询、追加指导与停止操作；主会话展示关联任务卡片和真实发送者。
  - 伴生视图可查看后台任务上下文与实时进度，任务状态支持跨窗口同步。
  - 工具审批支持 JEV 决策模型与普通 LLM 审批引擎，可按配置自动处理风险明确的请求，并将需要判断的请求交给用户。
  - 后台任务接入工具审批；人工审批默认持续等待，支持配置超时，并在会话销毁或断线时清理待处理请求。
  - 智能体资产支持短描述生成与批量补全，卡片增加描述与悬浮提示；修复打包导入、升级恢复和覆盖更新时的名称保留。
  - Skill 概览采用双栏布局，集中展示说明、脚本与权限，改善嵌套滚动体验。
  - 加固文件路径沙箱、VCP 文件传输、工具策略修改确认与脚本执行边界。
  Git 工作台
  - 新增仓库全景概览、分支泳道图与工作区文件名、内容搜索。
  - 支持查看提交文件变更、提交详情与远端跳转；差异视图增加导航、未更改区域折叠和首处改动定位。
  - 提交与暂存差异支持图片、音频等媒体预览；支持预览标签页与 Alt 临时预览。
  - 补齐右键操作，区分未跟踪文件的删除与放弃操作，增加更改总览与打开仓库目录入口。
  - 每个仓库可配置 AI 提交提示词、提交语言与外观颜色；生成提交信息改用差异内容，并支持中止生成。
  - 新增统一标签创建与推送弹窗。
  - 修复仓库拖拽排序、历史刷新时列表消失、差异编辑器销毁与分支加载问题，移除 HEAD 历史统计的 5,000 条上限。
  媒体生成、转写与网页提炼
  - 媒体生成支持全局并发任务队列与自动清理，新增任务列表视图切换。
  - 新增多模态快捷提示词库与光标位置插入；生成时可继续编辑草稿，附件随会话保存，输入框支持展开与收起。
  - 提示词优化支持携带参考图，视频与音乐任务可展示上游轮询进度，结果下载支持独立超时设置。
  - 改善重新生成、取消、失败详情与资产导入后的刷新，修复部分任务长期停留在处理中或入库中的问题。
  - 转写增加模型拒绝与异常输出提醒，清理复读、占位行和额外说明，修复总开关与活跃任务过滤行为。
  - 网页提炼新增 Jina 云端提取、DeepSeek 搜索与网页抓取，支持自动选择 DeepSeek 渠道；引入 Defuddle 提取并增强文档转换，接入统一代理配置。
  - 工具可按需读取和发送本地媒体，聊天附件支持更多媒体占位形式。
  视频、字幕与图像工具
  - FFmpeg：新增序列帧合成工作区，支持刷新与拖入；简单模式可选择 CPU 或 GPU 编码。增加原始分辨率预设、片段裁剪、关键帧吸附和积木式自定义参数编辑，完善单文件进度、输出命名与覆盖保护。
  - 实时字幕 OCR：新增本地视频离线识别工作台，支持字幕行内编辑、时间轴吸附、监视器操作与区域预览；屏幕 OCR 增加图像滤镜和原图对比，改善多实例状态与截图稳定性。
  - 色彩整理：支持目录扫描、批量图片与 SVG 代表色分析、缩略图筛选和自定义分类归档；亮度阈值可设置 1–4 档，并支持拖拽微调与预设管理。
  - 画板：新增星形工具、形状绘制快捷键与 PNG 导出到剪贴板。
  - 文档预览：增加 WPS 与 OpenDocument 格式支持。
  文件、自动化与系统体验
  - 本地文件操作增加复制、移动、重命名、元数据读取与搜索，完善规则编辑和实时审计；长路径错误提示更简洁。
  - 目录搜索增加资源限制与完整取消流程；符号链接搬家增加空间、权限预检与事务式回滚。
  - 数据筛选增加纯文本模式，支持随机删行、按目标行数随机保留和按关键字保留。
  - 窗口自动化使用中心坐标系，支持前台、后台两种键鼠操作模式。
  - Token 计算器支持导入 ZIP、TAR、TAR.GZ 格式的 Hugging Face tokenizer，增加 DeepSeek V4.1 视觉输入估算。
  - 主页新增最近使用工具与可拖拽快捷入口；设置页调整为分组两级导航。
  - Windows 安装器支持自定义数据目录，重新安装时展示已安装版本与待安装版本。
  - 版本说明支持历史浏览、搜索与当前版本识别；通知中心支持分页加载。
  - 改善主题、弹层焦点、Escape 关闭、通知层级和工具可见性设置的保存；修复 Windows 打开文件所在目录失败与日志滚动丢失。
  - 富文本渲染增强工具请求、转义围栏、附件卡片和主题变量兼容，缺失图片显示带资源信息的占位提示。
  - 插件增加 Sidecar API v3、结构化诊断与平台验证，改善进程重启后的状态隔离。
  升级前请留意
  - 建议先备份重要会话、智能体和知识数据，再从 0.6.6-r.2 升级。
  - 检测到旧知识数据时，请按迁移引导完成确认与校验。旧目录默认保留；确认数据完整后，可在清理步骤回收空间。
  - 将旧版思绪备份转换为 Knowledge 文档属于单向转换，请保留原始备份。
  - 升级后如需调整模型协议、主备组合或输出预算，可在渠道与模型设置中检查对应配置。
