ShortDescription: A robot diagnostics, log review/analysis, and data visualization application for FIRST teams.
Description: AdvantageScope is a robot diagnostics, log review/analysis, and data visualization application for FIRST teams developed by Team 6328. It reads logs in WPILOG, Hoot (CTRE), REVLOG (REV Robotics), Road Runner, CSV, NI DS log, and RLOG file formats, plus live robot data viewing using NT4, Phoenix, RLOG, or FTC Dashboard streaming. AdvantageScope can be used with any WPILib project, but is also optimized for use with our AdvantageKit log replay framework. Note that AdvantageKit is not required to use AdvantageScope.
