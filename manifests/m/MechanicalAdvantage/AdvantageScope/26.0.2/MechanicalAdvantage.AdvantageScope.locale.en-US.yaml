ReleaseNotes: |-
  This is the final release of AdvantageScope for 2026 and includes several minor bug fixes. Documentation is available online or by clicking the 📖 icon in the app. Feedback, feature requests, and bug reports are welcome on the issues page.
  - Fixed automatic video synchronization for 2026 matches (#489, @blaze-developer)
  - Fixed crashing when opening large REVLOG files (#512, @rylanmoseley)
  - Fixed calculation of integrated values on stepped line graphs with AdvantageKit logs (#504, @blaze-developer)
  - Added support for Kelvin units to fix parsing of temperature values in WPILib base units (#484, @blaze-developer)
