ShortDescription: A native Windows terminal built for AI coding agents
Description: |-
  WagTerm is an independently maintained fork of agwinterm by Boris Kudriashov,
  inspired by umputun's agterm. It provides workspaces, split sessions, agent
  status indicators, a scriptable local control API, session restoration, and
  a native Win32 and Direct2D interface.
  Agent hooks, shell integration, CLI PATH integration, and default-terminal
  registration are opt-in. The installer is per-user and self-contained.
