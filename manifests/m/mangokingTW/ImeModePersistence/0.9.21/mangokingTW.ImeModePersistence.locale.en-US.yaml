ShortDescription: Windows tray utility for IME mode persistence and per-app input-language binding.
Description: >-
  ImeModePersistence keeps the IME conversion mode consistent across windows and
  binds a chosen input language per application. Its flagship use case is keeping
  the Chinese IME controllable in games such as Helldivers 2. Autostart runs
  unelevated; use the tray's "Restart as administrator" for sessions that need to
  reach an elevated, anti-cheat-protected game.
