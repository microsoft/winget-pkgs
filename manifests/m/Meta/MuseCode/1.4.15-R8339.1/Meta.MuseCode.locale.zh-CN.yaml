ShortDescription: Meta 面向终端与 CI 的编程智能体，内置审批、沙箱、会话与多智能体编排。
Description: |-
  Muse Code 是 Meta 为终端与 CI 打造的编程智能体，为 Muse Spark 构建。
  在任意项目里运行它，它会规划、编辑并执行命令来完成任务；从第一次运行起就默认开启审批与操作系统沙箱。不带子命令时进入交互式终端界面，直接给一句提示词即可开启会话，也可以使用 resume、exec（单条提示词的无头执行）、config、serve、schema 等子命令。
  会话会被保留，方便接着上一次继续；多个智能体也能协同编排完成同一个任务。改动会先进入待审批状态，而不是静默落盘；智能体默认在平台沙箱内运行。
