ShortDescription: Meta's coding agent for the terminal and CI, with approvals, sandboxing, sessions and multi-agent orchestration.
Description: |-
  Muse Code is Meta's coding agent for the terminal and CI, built for Muse Spark.
  Run it in a project and it plans, edits, and runs commands to do a task, with approvals and an OS sandbox on from the first run. With no subcommand it opens an interactive terminal TUI; pass a prompt to start a session, or use a subcommand such as resume, exec for one headless prompt, config, serve or schema.
  Sessions are kept so a previous one can be resumed, and several agents can be orchestrated on one task. Changes are staged for approval rather than applied silently, and the agent runs inside the platform sandbox by default.
