ShortDescription: Screen annotation for Windows where every mark stays an editable vector object.
Description: |-
  Edivect lets you draw directly over your screen and edit the annotations later.
  Arrows, text, shapes, dimensions, stamps and blur stay editable vector objects:
  move, restyle, group and layer them, with undo and redo. Freeze the screen,
  use a whiteboard or blackboard, measure in real units with CAD-style snapping,
  and export to PNG/JPG, the clipboard or an editable project.
  Portable, offline, no account, no telemetry, no administrator rights.
