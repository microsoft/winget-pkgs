  - 조직 기능이 관리자 콘솔에서는 아직 제한 공개지만 CLI 조회는 정상임을 안내
  - 에이전트는 약관·정책을 초안(DRAFT)까지만 만들고 발행은 사람이 하도록 스킬 문서에 규칙 추가
  - service main read의 약관 목록에는 노출 중인 약관만 포함됨을 명시
  - 설치 문서의 Gemini CLI 확장 설치를 Antigravity CLI(agy plugin install)로 갱신
