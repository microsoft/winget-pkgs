ShortDescription: The *arr for games. Request a title and ROMarr finds, downloads, verifies and files it into your game library.
Description: |-
  ROMarr searches the indexers you configure through Prowlarr, hands the best release to qBittorrent, SABnzbd or NZBGet, verifies what arrived against No-Intro and Redump, and files the game into RomM, Gaseous, Retrom or a plain folder tree for LaunchBox, Playnite, RetroArch and ES-DE.
  The Windows app bundles its own Python backend and WebView2 runtime. It runs ROMarr on this PC (loopback only) or connects to a ROMarr server elsewhere on your network.
  ROMarr includes no games or BIOS files.
