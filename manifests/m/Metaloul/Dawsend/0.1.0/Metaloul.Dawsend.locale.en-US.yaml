ShortDescription: Sends your DAW's sound (ASIO) to a regular Windows output, so screen sharing can hear it.
Description: |-
  You play through an ASIO audio interface and want Discord, OBS or any screen share to hear your DAW. ASIO bypasses Windows audio, so they hear nothing.
  Dawsend fixes that: put the Dawsend plugin (VST3 or CLAP) on your track, and the small app next to the clock plays the track's sound on the Windows output of your choice.
  No virtual cable, no driver, no default device to change. Several tracks at once, each with its own volume and mute; clock drift between the audio interface and Windows is compensated continuously.
