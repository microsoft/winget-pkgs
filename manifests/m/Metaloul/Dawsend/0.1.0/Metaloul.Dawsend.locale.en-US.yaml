ReleaseNotes: |-
  First public release.
  - The Dawsend plugin (VST3 and CLAP) sends a track's sound to the Windows output of your choice, so Discord or OBS can hear it during a screen share.
  - Several tracks at once, each with its own volume and mute.
  - Automatic compensation of the clock drift between the audio interface and Windows.
  - Tray app with meters, master volume and limiter.
  - Signed updates offered by the app.
  - English and French.
