ShortDescription: Envoie le son de ton DAW (ASIO) vers une sortie Windows normale, pour que le partage d'écran l'entende.
Description: |-
  Tu joues avec une carte son en ASIO et tu veux que Discord, OBS ou un partage d'écran entende ton DAW. L'ASIO contourne le son de Windows : ils n'entendent rien.
  Dawsend règle ça : le plugin Dawsend (VST3 ou CLAP) sur ta piste, et la petite appli près de l'horloge joue le son de la piste sur la sortie Windows de ton choix.
  Pas de câble virtuel, pas de pilote, pas de périphérique par défaut à changer. Plusieurs pistes à la fois, chacune avec son volume et sa coupure ; l'écart d'horloge entre la carte son et Windows est compensé en continu.
