InstallationNotes: DX Manager를 사용하려면 .NET Framework 4.6.2 이상, Android 개발자 옵션, USB 디버깅이 필요합니다. 최초 ADB 인증에는 데이터 통신이 가능한 USB 연결이 필요합니다. DX Companion은 번들에 포함되지만 사용자가 요청할 때만 설치됩니다.
