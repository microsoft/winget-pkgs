ReleaseNotesUrl: https://github.com/maze-mei/DX-Manager/releases/tag/v2.5.0
InstallationNotes: Requires .NET Framework 4.6.2 or later and a compatible Galaxy phone with Developer options enabled. Connect through authorized USB debugging or Android wireless-debugging pairing. The optional bundled DX Companion requires Android 13 or later and is installed only on request. Experimental 120 FPS keeps the phone screen on and requires a heat, battery, and OLED warning confirmation before each start.
