ShortDescription: Manage Samsung DeX virtual displays and scrcpy app windows on Windows.
Description: DX Manager manages independent Samsung DeX and single-app windows for multiple Galaxy phones over USB or wireless ADB. It includes scrcpy 5.0.1 with automatic hardware-decoder selection, optional official DX Companion 2.1.6 for recovery and bidirectional file transfer, light and dark themes, daily update notifications, and experimental maximum 120 FPS.
Moniker: dxmanager
