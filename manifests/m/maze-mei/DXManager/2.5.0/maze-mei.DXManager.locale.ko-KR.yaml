InstallationNotes: .NET Framework 4.6.2 이상과 개발자 옵션을 켠 호환 Galaxy 휴대폰이 필요합니다. 승인된 USB 디버깅 또는 Android 무선 디버깅 페어링으로 연결합니다. 선택형 동봉 Companion은 Android 13 이상이 필요하며 요청할 때만 설치합니다. 실험적 120 FPS는 휴대폰 화면을 켜두며 실행마다 발열·배터리·OLED 경고를 확인해야 합니다.
