ShortDescription: Windows에서 Samsung DeX 가상 디스플레이와 scrcpy 앱 창을 관리합니다.
Description: 여러 Galaxy 휴대폰의 Samsung DeX와 단일 앱 창을 USB 또는 무선 ADB로 독립적으로 관리합니다. 하드웨어 디코더를 자동 선택하는 scrcpy 5.0.1, 복구·양방향 파일 전송용 정식 DX Companion 2.1.6, 밝음·다크 테마, 하루 한 번 업데이트 알림과 실험적 최대 120 FPS를 제공합니다.
