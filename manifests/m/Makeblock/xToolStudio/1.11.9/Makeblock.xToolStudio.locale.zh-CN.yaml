PackageIdentifier: Makeblock.xToolStudio
PackageVersion: 1.11.9
PackageLocale: zh-CN
License: 专有软件
ShortDescription: xTool 激光切割雕刻机设计与管理系统软件
Tags:
- 激光
- 激光切割
- 激光雕刻
ReleaseNotes: |-
  通用
  1. 连接体验优化：重构修复逻辑与交互，更有效的解决发现设备及连接设备的问题。
  2. 新用户引导优化：打通从软件启动到首次加工的新设备完整引导流程。本期支持 P2S、P3、 F1 Ultra、 F2 系列。

  编辑器
  1. 项目文件封面预览：支持在本地文件夹中查看 .xs 项目的封面，找文件时更容易辨认。
  2. 拼装结构检测与提示：在编辑器中导入或缩放拼装结构图纸、应用材料厚度时，系统会检测并提示相关问题，帮助你及时调整设计。
  3. 重叠元素检测：快速查找并选中局部重叠路径，按需删除多余元素。
  4. 虚线功能：支持将描边设置为虚线，也支持将切割路径加工出易撕线、折痕等虚线效果。
  5. 栅格化/合并：使用栅格化功能可将矢量图形、文字、图片或其组合转换为图片，并将当前可见效果合并；使用合并功能可将多个图片合成一张图片，并将所有图片效果固定。
  6. 图片替换：支持将已有图片的内容快速替换为导入图片、素材库图片、我的空间图片或画布上的其他图片。
  7. 裁剪到边缘：将有透明边缘的图片，一键智能裁剪至包围图片内容的最小矩形区域。
  8. 我的空间支持批量导入：在编辑器侧边栏的「我的空间」中可一次导入多个文件。
  9. 智能排料优化：所有排料模式均支持「统一对象尺寸」，可将多个对象调整为相同尺寸后统一排版。
  10. 可自定义框选方式：在编辑器设置中选择适合自己操作习惯的框选方式。
  11. 打印切割对象拆分：支持将打印切割对象组拆分为可独立编辑的打印切割对象。
  12.  3D Photo 优化：优化点云模型生成效果，支持在生成结果页调整点间距、图像处理模式和反色，并可在画布上切换查看原始模型与简化模型。

  材料参数
  1. 加工模组/激光光源推荐：根据所选材料及加工类型，推荐适合的加工模组或激光光源；当前模组/光源不建议使用时，支持手动确认切换。
  2. 材料选择优化：官方材料新增“不建议加工”信息，提前了解不同加工模组或激光光源下不建议使用的加工类型，降低加工失败风险。

  xTool O1 多材质打印机
  1. 智能蒙版：新增批量填充，一键将图案填入多个相似形状。
  2. 加工统计：支持按日、周、月查看加工任务的墨水用量和花费，并导出 PDF 或 Excel 报表。
  3. 按灰度出墨：UV 打印时，白墨、光油和荧光墨支持根据图片亮度控制出墨量，制作渐变效果。
  4. 墨水浓度：UV 打印支持分别调整白墨、光油和荧光墨的浓度，更灵活地控制打印效果。
  5. 半透明效果优化：白墨和光油根据位图透明度调整出墨量，改善半透明边缘的过渡效果。
  6. 高喷风险检测：打印前检查材料高度差，根据风险提示开启高落差打印或调整材料。
  7. 全包裹打印：旋转附件支持左右两侧独立设置外扩尺寸，改善物体边缘的打印覆盖。

  xTool X1
  1. Fiber、MOPA 和 UV 光源支持垂直出光，用于矢量填充和位图雕刻。
  2. 彩雕新增焦点抬升设置。
  3. 新增振镜开关光延迟及填充间隙补偿设置。
  4. 材料测试阵列支持更多参数。
  5. 浮雕加工支持走边框。
  6. 优化 20W 蓝光自动找焦，新增外部光源检测。
  7. 大幅面位图加工时，新增高度补偿提醒。
  8. 优化测距提示，帮助选择合适的测距位置。
  9. 优化智能优化流程，新增材料选择引导

  xTool C1
  1. 透明材料颜色：材料颜色新增「透明」选项，切割对象在画布上仅显示轮廓，便于对位。
  2. 图片加工扩展：图片支持直接按轮廓切割，并支持画笔绘制、热烫压印和压痕转印。

  Bug 修复
  1. 修复了 C1 烫金笔调整线宽后，加工时未应用新线宽的问题。
  2. 修复了 C1 圆盘刀在部分情况下无法切透材料的问题。
  3. 修复了 C1 设备初始化和整机精度校准可能失败的问题。
  4. 优化了 C1 12 in × 12 ft 画布的显示效果。
  5. 修复了 F2U UV 部分情况下打点时间实际只按设定值的一半生效的问题。
  6. 修复一些已知问题。
