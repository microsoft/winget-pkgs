PackageIdentifier: Makeblock.xToolStudio
PackageVersion: 1.8.14
PackageLocale: zh-CN
License: 专有软件
ShortDescription: xTool 激光切割雕刻机设计与管理系统软件
Tags:
- 激光
- 激光切割
- 激光雕刻
ReleaseNotes: |-
  软件通用
  1. 新增项目笔记：可随项目记录操作经验与注意事项，下次打开或加工前自动提醒，避免重复踩坑（仅 xs 文件支持）
  2. 我的空间全面升级：新增本地空间，可对本地项目 / 素材快速管理，并将云端、本地、收藏素材汇于一处统一管理

  编辑器
  1. 新增变形功能：通过预设形状或自定义参数，对文字、图像实现弯曲、拱形、扭曲及透视效果
  2. 新增图案填充：将图片以多种排布方式自然填充到图形中，快速做出重复纹理（仅 M2 及打印设备支持）
  3. 重构节点编辑工具组：拆分出 Select / Add / Delete / Break 四个独立工具，路径编辑更清晰高效
  4. 新增线段修剪工具：一键清理交叉路径间的多余线段
  5. 支持将对象设为变量：对象内容随列表数据自动变化，一次排版即可批量加工不同设计，特别适合夹具场景
  6. 优化画布操作体验：移动、旋转、缩放时对象半透明显示便于对齐；缩放支持吸附
  7. 优化偏移功能：新增精度调节项，可按需在处理速度与精细度间取舍

  材料参数
  1. 支持本地保存与离线使用：无网络环境也能保存和使用材料参数
  2. 升级材料管理：本地与云端参数双向同步，支持导入、导出、批量删除，导出新增 .mxs 格式（含参数及关联效果图）
  3. 新增材料参数分享：可分享已保存或本次加工用的参数设置，优质分享有机会展示在首页「材料参数」板块，供更多用户参考

  设备
  1. 支持全新的多功能打印机：xTool O1 omni printer
  2. 支持多设备联动：O1 可与 P3、M1 Ultra、S1 实现先打印后切割的联动加工（P2S、P2、M2 即将支持）
  3. M2 新增一键生成切割轮廓：一键为位图 / 矢量图增加异形、矩形、圆形、心形等轮廓，并支持二次编辑
  4. M2 支持气泵气流按元素设置：气流控制参数移入参数面板，可为不同加工元素分别设置气流（需固件 40.141.010.3 及以上）
  5. P3 支持加工视频一键剪辑分享：加工录制的视频可一键剪辑后分享至 Instagram、Facebook 等社交媒体
  6. F2 支持自动模式：关盖后自动完成对焦、背景刷新、材料二维码识别，并将画布元素居中到耗材轮廓内，真正即放即创（需 024 及以上固件）
  7. 新增旋转附件实时小窗预览：P3 / M2 使用 RA3 自动建模编辑时，小窗实时显示图案在物体表面的位置，配合中轴辅助线，对位更轻松
  8. 优化平面预览：切割统一展示切穿后的真实效果，新增层选择器与爆炸视图逐层看清复杂图形，耗材预览增加厚度信息
  9. 新增玻璃内雕效果预览

  Bug 修复
  1. 修复部分场景下提取轮廓导致软件崩溃的问题
  2. 修复了钥匙扣生成器图纸导入 studio 加工方式不匹配的问题
  3. 修复了 Apparel Printer 部分场景下文件传输慢的问题
  4. 修复了特定文件预估时间生成慢的问题
  5. 修复了其他已知问题
