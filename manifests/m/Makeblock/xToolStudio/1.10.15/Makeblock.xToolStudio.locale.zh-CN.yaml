PackageIdentifier: Makeblock.xToolStudio
PackageVersion: 1.10.15
PackageLocale: zh-CN
License: 专有软件
ShortDescription: xTool 激光切割雕刻机设计与管理系统软件
Tags:
- 激光
- 激光切割
- 激光雕刻
ReleaseNotes: |-
  通用
  1. 全新首页：支持通过关键词或图片搜索案例、生成器和 Hubs；支持使用 Atomm AI 生成可雕刻、切割、打印的图案，或可激光切割拼装的 3D 结构。
  2. 新用户引导优化：打通从软件启动到首次加工的完整引导流程。（本期仅支持 M2、O1、X1，且仅面向首次安装软件的新用户）

  编辑器
  1. 框选优化：从左向右框选完全包含的对象，从右向左框选所有接触选框的对象。
  2. 导入增强：支持批量导入文件及 HEIC 照片，DXF 文件可保留原始填充。
  3. 批量调整尺寸：支持统一调整多个选中对象的尺寸。
  4. 坐标调整&缩放优化：支持切换坐标原点，按住 Option/Alt 键可从中心缩放。
  5. 侧边栏优化：侧边栏支持全屏展开，优化素材浏览与操作体验。
  6. 智能排料优化：新增自动填充、多板材拍照排料、手动绘制排料及排除区域，并支持共边合并。
  7. 浮雕模式优化：支持 16 位深度图，层数上限提升至 1024 层，新增清洗层。
  8. 图像雕刻优化：新增原图直出模式。

  材料参数
  1. 社区材料共享：支持查看社区用户分享的材料，一键应用材料及加工参数。
  2. 材料网格测试阵列优化：新增「其他恒定参数」，支持查看和编辑行列外的固定参数。
  3. 首页-材料设置：无需连接设备，即可在首页创建材料并保存多组加工参数。

  设备
  1. 拍照提取（M2、P3、P2S、P2）：支持拍照识别图案，自动提取可用于切割的轮廓路径。
  2. 光栅卡加工（O1 Omni Printer）：新增专属加工模式，扫描识别卡片位置、尺寸及 LPI，无需测试图或手动对位。
  3. 内雕预设模型：支持选择官方预设玻璃模型，自动获取尺寸，快速配置折射率和加工位置。
  4. 内雕焦点补偿：支持玻璃幅面焦点补偿，改善大幅面玻璃加工时焦点高度不一致的问题。
  5. 白墨缩印（Apparel Printer / Plus、Omni Printer）：支持为每个元素单独设置白墨缩印尺寸。
  6. Mockup 升级：支持创建自定义模板。

  Bug 修复
  1. 修复一些已知问题。
