ShortDescription: Proxy client for filtered networks — VLESS and Reality, Hysteria2, TUIC, Trojan, Shadowsocks and WireGuard.
Description: |-
  Mythaia Pro is a proxy client with its own protocol stack, written in Kotlin: VLESS with Reality, Vision and XHTTP, VMess, Trojan, Shadowsocks, Hysteria2, TUIC, AnyTLS, NaiveProxy, WireGuard and SOCKS5.
  It runs as a system proxy (SOCKS5 and HTTP on one port) or sends all traffic through a Wintun adapter, picks the fastest server of a group on its own and downloads subscriptions through domain fronting when the panel's domain is blocked.
  Free and open source under GPL-3.0, with no ads, no analytics and no account.
