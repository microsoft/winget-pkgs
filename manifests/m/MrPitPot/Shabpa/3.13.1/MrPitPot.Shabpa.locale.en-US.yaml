ShortDescription: A local-first Windows assistant for shutdown schedules, gaming overlay, downloads, files and health.
Description: |-
  Shabpa is a free, open-source Windows utility that works entirely on your PC. It schedules shutdown, sleep and restart
  (with a cancellable countdown), watches network and CPU to power down when a download finishes, shows a gaming overlay,
  manages scheduled launcher downloads, tracks tasks and focus time, backs up folders, checks system health and updates,
  and cleans the microphone with RNNoise. Nothing is sent anywhere unless you switch a feature on.
