ReleaseNotes: |-
  What's Changed
  - Fix admin UI double-prepending origin when AppConfig.BaseURL is absolute by @jbn2336mz in #54
  - Always pass opts to generated service methods by @jbn2336mz in #55
  Generated service methods take the options argument for every operation, including endpoints that declare no parameters. Those endpoints used to be handed only a context, which put response generation and the raw HTTP request out of reach exactly where the spec was thinnest.
  Handlers now look the same across a whole API. The generate-then-tweak workflow, request headers, and cookies are available everywhere, and adding the first parameter to an endpoint no longer changes its handler signature.
  Breaking change
  Regenerating an existing service breaks compilation of hand-written service files that implement parameterless endpoints. Add the options argument to those methods, and drop the interface assertion near the top of the file if it is still there. The compiler points at every spot.
  Runtime behavior is unchanged, and endpoints that already received options are untouched.
  Full Changelog: v2.7.5...v2.8.0
