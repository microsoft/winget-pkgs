ReleaseNotes: |-
  What's Changed
  - Share OpenAPI overlays between services by @jbn2336mz in #59
  Overlay sources can now point outside a service's own setup directory: a shared
  file, an absolute path, or a URL. Several sources apply in order, so a shared
  overlay can carry corrections common to an API while a service adds its own on
  top, with the service's entries winning.
  Remote overlay sources referenced by URL previously failed the build and now
  work.
  No configuration changes. Existing services behave as before and pick this up on
  their next generation, which also makes them self-contained: a generated service
  carries its overlay content rather than reading it back at startup.
  Full Changelog: v2.8.2...v2.8.3
