ShortDescription: Offline PDF editor for Windows in English and Arabic. Edit, sign, convert, OCR and protect PDFs without uploading them.
Description: |-
  MadPDF is a PDF editor that runs entirely on your Windows PC. Files are never uploaded and no account is needed.
  Edit text and images, add comments and markup, fill and sign forms, combine, split, rotate and reorder pages, create PDFs from Office files and images, and export back to Word, Excel or PowerPoint.
  OCR recognises English and Arabic text in scans and photos. The interface is available in English and Arabic, with full right-to-left layout and correct Arabic shaping.
  It also protects and redacts documents, adds digital signatures with timestamps and long-term validation, checks and converts to PDF/A and PDF/X, and offers print tools such as Output Preview, separations and overprint simulation.
  Creating PDFs from Office files needs the free LibreOffice on the same PC.
