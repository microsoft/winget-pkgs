ShortDescription: Network scanner for Windows that finds every device, IP camera and firewall on a LAN, maps the network and audits its security.
Description: |-
  Madconfig is a network scanner and IP scanner for IT technicians, MSPs, network admins and CCTV installers.
  Press Scan and in about a minute it lists every device on the subnet with IP, MAC, vendor and hostname, using ICMP, ARP, mDNS, NetBIOS and TCP probes so devices that ignore ping still show up.
  Devices are sorted into firewalls, routers, cameras, computers, NAS, printers, phones and IoT. IP cameras and NVRs are found by vendor and by RTSP and DVR ports.
  It also includes a live topology map, a security audit with a score out of 100, a per-site login vault keyed by MAC address and encrypted with Windows DPAPI, new-device alerts, ping, traceroute, DNS lookup, port scan, Wake-on-LAN, and PDF, HTML and Excel reports.
  Free 5-day trial with every feature unlocked; after that a licence key is needed.
