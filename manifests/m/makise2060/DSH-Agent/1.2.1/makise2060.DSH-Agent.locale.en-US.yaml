ShortDescription: A desktop WebView wrapper for DeepSeek Harness that launches dsh web in a native window.
Description: DSH Agent wraps the DeepSeek Harness Web UI into a standalone desktop application. Double-click the icon and start using it directly, with no need to open a terminal, run dsh web, or visit a URL in a browser. It launches the dsh web service in the background, and provides environment checks, one-click dsh installation, version updates, and a plugin marketplace. Closing the main window keeps the dsh service running in the system tray.
