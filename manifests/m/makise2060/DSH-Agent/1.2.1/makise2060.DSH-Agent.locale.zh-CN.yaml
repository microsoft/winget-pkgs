ShortDescription: DeepSeek Harness 桌面 Webview 包装器，一键启动 dsh web，在原生窗口中直接使用。
Description: DSH Agent 将 DeepSeek Harness 的 Web UI 包装为一个独立桌面应用。双击图标即可使用，无需打开终端、输入 dsh web、再手动在浏览器中访问 URL。应用自动在后台启动 dsh web 服务，并提供环境自检、一键安装 dsh、版本更新与插件市场功能；关闭主窗口后 dsh 服务继续在系统托盘中运行。
