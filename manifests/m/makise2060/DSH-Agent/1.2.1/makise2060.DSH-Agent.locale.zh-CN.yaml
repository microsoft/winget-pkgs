ReleaseNotes: |-
  📦 DSH Agent v1.2.1
  本次更新：系统托盘常驻与多项稳定性改进。自本版本起专注 Windows 平台。
  🆕 新增
  - 系统托盘常驻：关闭主窗口不再退出应用，dsh 服务在后台继续运行。托盘菜单支持「打开主窗口 / 重启 dsh 服务 / 退出」，左键单击托盘图标直接唤起
  - 关闭行为三选：点击窗口关闭按钮时，可选择「退出（停止 dsh）/ 最小化到托盘 / 取消」，并可勾选"记住选择"（取消操作不会被记住，避免误关）
  - 单实例：重复启动应用时会唤起已有窗口，不再产生多个实例
  🔧 改进
  - 防白屏：窗口改为前端就绪后显示，前端异常时 4 秒强制显示兜底，不再出现"窗口不存在"的假死感
  - 设置锁残留自动清理：dsh 异常退出后残留的设置写锁会在下次启动前自动清理，修复"设置无法保存、主题被弹回"类问题
  - CI 精简：发布流程只构建 Windows 安装包，构建更快更稳
  📋 前置要求
  - Windows 10+
  - Node.js ≥ 22（dsh 运行时依赖）
  - dsh：npm install -g @deepseek-ai/dsh（App 内也可一键安装）
  - WebView2 Runtime（Win11 已内置）
