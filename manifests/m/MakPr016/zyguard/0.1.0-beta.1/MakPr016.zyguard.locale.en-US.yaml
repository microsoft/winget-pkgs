ShortDescription: A from-scratch, GPU-accelerated local inference engine and TUI chat client for the LFM2.5 model family.
Description: >-
  zyguard is a from-scratch LLM inference engine written in Rust, running
  entirely on Vulkan compute shaders via wgpu. It ships two binaries: zyguard,
  a CLI (run / chat / tools / bench), and zyguard-tui, a terminal chat UI with
  a model picker, live RAM/GPU graphs, and saved conversations.
