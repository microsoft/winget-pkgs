ShortDescription: AI agent desktop client for Windows that plans a task, asks for approval, then carries it out on your own PC.
Description: |-
  MOOGH is an AI agent desktop client for Windows 10 and 11 (64-bit). Describe a task in plain language and MOOGH plans the steps, asks for your approval, then carries it out on your own PC: organising files, running commands, fixing code, and handling routine automation.

  Approval is per action, so the agent never receives blanket control of the machine, and MOOGH records what it ran so a session can be reviewed afterwards. There is no subscription; pricing is pay-per-use with top-ups from 1 USD.
