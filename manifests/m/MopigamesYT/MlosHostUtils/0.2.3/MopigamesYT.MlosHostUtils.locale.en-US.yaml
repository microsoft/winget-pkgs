ShortDescription: USB passthrough agent for the PC you stream from with Moonlight OS.
Description: |-
  The host PC half of USB passthrough for Moonlight OS. One static binary,
  no dependencies. Moonlight OS tells it which USB devices are plugged into
  the thin client; it installs a USB/IP client if the PC has none, and makes
  those devices appear on this PC as if they were plugged in here.
Moniker: mlos-host-utils
Tags:
- moonlight
- usb
- usbip
- passthrough
- game-streaming
ReleaseNotesUrl: https://github.com/MopigamesYT/moonlight-os/releases/tag/v0.2.3
InstallationNotes: |-
  One more step, from an Administrator terminal:

      mlos-host-utils install

  That installs a USB/IP client if this PC has none, starts the agent at
  boot, opens its port on private networks, and prints the pairing code to
  type into Moonlight OS.
