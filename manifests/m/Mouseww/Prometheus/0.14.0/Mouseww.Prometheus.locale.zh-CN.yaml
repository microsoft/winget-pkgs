ReleaseNotes: |-
  新功能
  - 文件上传：对话里可以附加 Word、Excel、PPT、PDF、txt、HTML、压缩包等任意文件（单个与总计 20MB、最多 10 个）。文件存入服务器临时目录，并把路径告诉模型，由模型用自己的工具读取。
  - 文件下载：上传的文件、Agent 用 write/edit/read 处理的文件，以及回复里提到的文件路径都带下载按钮；浏览器支持时可直接写入磁盘，不受大小限制。只能下载工作目录和上传目录里的文件。
  - 第三方 Agent 一键安装：设置里的 Claude Code、Codex、OpenCode 未安装时可一键安装到 Prometheus 自己的目录，无需重启。
  - 长会话加载更快：打开会话只加载最近几轮，向上滚动再按需加载；超大的工具输出先截断，展开后按需取完整内容；鼠标悬停会话时提前打开；PI 对话的 API 失败重试次数提高到 6 次。
  修复
  - 修复手机端新建会话选择 Claude Code 后发消息又变回 PI 的问题。
  - 修复 Claude Code、Codex、OpenCode 的权限确认弹窗、/ 命令与技能列表缺失，补上 Codex、OpenCode 的计划模式。
  - 修复 Windows 上通过 npm 安装的 OpenCode 无法启动（spawn ENOENT）。
  - 修复更新时 node.exe 被残留子进程占用导致安装不完整的问题。
  - 输入框中 PI 的图标由 π 改为 PI。
