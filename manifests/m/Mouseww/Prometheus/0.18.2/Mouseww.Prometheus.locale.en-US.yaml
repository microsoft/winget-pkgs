PackageIdentifier: Mouseww.Prometheus
PackageVersion: 0.18.2
PackageLocale: en-US
License: Freeware
ShortDescription: An open-source, fork-friendly AI agent workbench.
Description: |-
  An open-source, fork-friendly AI agent workbench: one kernel, four entry points — terminal / desktop / web / Android.
  TUI, desktop GUI (Tauri), web and Android share the same server and the same wire protocol, so a session continues anywhere. Gateways, knowledge bases, tools, commands, HTTP routes and UI panels are all contributed through definePlugin — even the built-in features are plugins.
