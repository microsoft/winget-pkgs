ReleaseNotes: |-
  Prometheus v0.10.5
  网络访问新增 Cloudflare 一键公网地址和二维码扫码连接，平台管理支持记住密码。
  变化
  - 设置 → 网络访问：一键开启 Cloudflare 临时隧道，无需域名、反代或 DDNS；首次使用自动下载 cloudflared，需先设置登录密码。
  - 网络访问页显示公网/局域网地址二维码；连接页新增「扫码」按钮（Android 增加相机权限）。
  - 添加平台时可勾选「记住密码」，切换平台自动登录。
