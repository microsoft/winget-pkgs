ShortDescription: 源码公开、可二次开发的 AI Agent 工作台：终端 / 桌面 / Web / 安卓四种入口。
Description: |-
  Prometheus 是一个源码公开、可二次开发的 AI Agent 工作台：同一个内核，终端 / 桌面 / Web / 安卓四种入口。
  TUI、桌面 GUI（Tauri）、Web、安卓共用同一套服务端与协议，会话随处可续。网关、知识库、工具、命令、HTTP 路由、UI 面板全部通过 definePlugin 贡献，连内置功能也是插件。
