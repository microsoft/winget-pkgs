ReleaseNotes: |-
  新增
  - 多平台同步：在「设置 → 多平台」里，可在当前平台与另一个已保存的平台之间拉取或推送 AI 网关（含密钥）、后台设置、项目和会话，每一项都可选；只复制、不删除，会话每个只复制一次
  - 自动同步（需主动开启，默认关闭）：应用打开并连接时按设定间隔同步，会话只同步上次之后有改动的，每次最多 20 个
