ReleaseNotes: |-
  新功能
  - 侧边栏可拖拽调整宽度：拖动侧边栏右边缘即可改宽（220–560px），双击恢复默认，聚焦后可用左右方向键微调；宽度会记住，手机端抽屉不受影响
  优化
  - 独立工作树面板更精简：对话还没有改动时不再显示；有改动时折叠成一行白话说明（如「已改 3 个文件，待合并到项目」），分支名和同步提示移到展开后的说明里
