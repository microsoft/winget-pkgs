ReleaseNotes: |-
  新增
  - 错误日志（内置插件，可在设置里关闭）：设置里新增"错误日志"页，记录服务端与插件输出的错误和警告（含未捕获异常），可按错误/警告筛选、复制、清空；重启后保留最近 500 条。密钥、令牌等敏感内容会先打码再保存。
  修复
  - 压缩上下文后，压缩之前的历史会话在界面里消失：现在整条历史仍然可见，压缩以一条"上下文已压缩"分隔线显示在发生的位置；发给模型的上下文不变。
