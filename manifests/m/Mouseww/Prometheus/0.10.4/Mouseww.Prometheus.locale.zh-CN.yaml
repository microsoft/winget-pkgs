ReleaseNotes: |-
  Prometheus v0.10.4
  「运行环境」页签在 Tauri 应用（非远程模式）里始终显示，不再依赖列表是否加载成功。
  变化
  - 页签显示条件改为同步判断，加载卡住或失败时也能进入页面看到错误。
  - 先加载运行环境列表，再订阅进度事件，二者互不等待。
