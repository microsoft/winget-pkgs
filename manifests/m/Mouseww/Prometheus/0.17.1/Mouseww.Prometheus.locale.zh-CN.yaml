ReleaseNotes: |-
  修复
  - 启动动画在 Windows 关闭“动画效果”时只显示静止画面：现在只由 设置 → 外观 里的“界面动效 / 启动动画”开关控制，不再跟随系统的“减少动画”。
  - 桌面版启动动画中的火焰显示为黑色：颜色改由样式表提供，不再被桌面端内容安全策略拦截。
