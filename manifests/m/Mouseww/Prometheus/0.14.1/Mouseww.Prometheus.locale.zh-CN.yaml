ReleaseNotes: |-
  新功能
  - Agent 设置里新增「同步会话」：把 Claude Code、Codex、OpenCode 自己保存的工作区和会话同步到 Prometheus。
  修复
  - 修复桌面端和手机端文件无法下载的问题：改为由系统浏览器通过一次性链接下载。
  - 修复 Claude Code 搭配 Prometheus 网关的模型新建会话时报 “No conversation found with session ID” 的问题。
