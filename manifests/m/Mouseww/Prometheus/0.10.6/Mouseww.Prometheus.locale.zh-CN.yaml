ReleaseNotes: |-
  Prometheus v0.10.6
  新增任务完成系统通知，修复公网地址下载失败，并整理通用设置顺序。
  变化
  - 通知：每轮任务结束时发送系统通知（Windows、macOS、Android、浏览器），首次开启请求权限；可在设置 → 通用 → 通知里开关，并可选仅在后台时通知。
  - Cloudflare 公网地址：下载 cloudflared 改用 curl 并自动使用环境/系统代理；网络类失败会提示检查网络后重试。
  - 网络访问页的局域网二维码标明为局域网地址。
  - 通用设置按「外观 → 对话 → 通知 → 工作区 → 窗口 → 更新 → 关于」重新排序。
