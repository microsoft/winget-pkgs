ReleaseNotes: |-
  新功能
  - IM 通道：个人助理可接入 Telegram、飞书、QQ、企业微信，在「设置 → IM 通道」里配置。每个发消息的人在个人空间有自己的对话，运行只读，且必须在允许名单内才会被处理
  - 普罗成为一个对话组：侧边栏的「普罗」可随时新建对话；个人空间主页直接发消息会开启新对话，不再沿用同一个
  修复
  - 安卓：声明并申请局域网访问权限（附近设备 / 本地网络），修复新版 Android 上本地模式连不上局域网设备的问题（需重新安装并允许权限）
  说明
  - 飞书、企业微信的回调路径 /plugins/*/hook/* 不要求登录，由插件按平台签名校验
  - 个人微信无官方接口，未内置
  - IM 通道尚未用真实账号验证
