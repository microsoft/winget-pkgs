ReleaseNotes: |-
  修复
  - 压缩阈值设置找不到了：上一版把滑块放在「自动压缩上下文」开关后面，开关关着就完全看不到，看起来像功能没做
    - 现在这一项始终显示，自动压缩关闭时置灰并说明「重新开启后按此比例压缩」
  - 滑块拖动后可能不保存：原先只在鼠标松开时写入，在滑块外面松开、或用键盘/触摸操作时，数字变了却没存下来
    - 改为变更即保存（带短暂防抖），各种操作方式都生效
  说明
  - 若你用的是桌面安装版，需要更新到本版本才能看到；源码运行的话重新构建前端即可
