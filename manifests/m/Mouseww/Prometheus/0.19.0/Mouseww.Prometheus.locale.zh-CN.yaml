ReleaseNotes: |-
  新增
  - 内置浏览器：右侧面板新增“浏览器”标签（标题栏地球图标）。Agent 和你用同一个浏览器：它打开的页面你能实时看到，也可以随时点“接管”自己操作，再交还给它。页面在服务端的 Chromium 里渲染，画面推流到面板，所以应用的菜单、弹窗不会被页面盖住；Web、远程访问和手机客户端都能用。
  - Agent 新增 8 个浏览器工具：打开网页、管理标签、读取页面、点击/填写、按键、截图、等待、执行脚本。读取页面返回带编号的无障碍树，操作后只返回变化；密码框的值不会发给模型。
  - 手机连电脑上的 Prometheus 时，网页按手机版排版并接收真实触摸（点按、滑动、双指缩放）；可在浏览器设置里关闭。
  - 手机本机模式也能用内置浏览器：在面板里点“安装浏览器组件”，会把 Chromium 装进应用自带的 Linux 环境（约 125 MB，外加一次性的基础系统和系统库）。该部分尚未在真机上验证。
  - 浏览器使用独立的浏览数据，与日常浏览器隔离；支持 Chrome / Edge / Brave / Chromium，没有时可一键下载 Chrome。支持中文输入法、下拉框、右键菜单、JavaScript 对话框、文件上传和下载。
  - 插件新增向客户端推送数据流的能力（ctx.stream），支持二进制帧和背压。
