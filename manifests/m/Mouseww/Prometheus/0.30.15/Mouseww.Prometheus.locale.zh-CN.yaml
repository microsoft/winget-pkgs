ReleaseNotes: |-
  修复
  - 修复 bash / powershell 命令卡住被自动中止后对话直接停止的问题：现在中止后会自动通知模型并让它换一种方式（加 timeout、非交互参数、后台运行等）继续完成任务，连续最多自动恢复 3 次，用户发新消息后重新计数
  - 修复 bash / powershell 命令偶发卡死导致对话无限等待：新增空闲探测，每 30 秒检查一次，连续 10 分钟没有任何输出变化才中止；有下载、安装等持续输出的命令会继续等待
