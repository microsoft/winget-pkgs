ReleaseNotes: |-
  修复
  - 会话权限模式：重新打开会话时恢复它上次所在的模式（如 Auto），不再每次回到「默认」；没有记录的旧会话套用设置里的默认权限
  - 个人空间侧栏：「主页」移到顶部导航区，不再混在对话列表里；「普罗」主对话作为列表第一行回来，只在真正打开时高亮
  - 个人/工作切换：「工作」图标改为跟随主题色，不再固定为蓝色
