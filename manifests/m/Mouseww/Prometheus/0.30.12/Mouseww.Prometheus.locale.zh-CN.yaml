ReleaseNotes: |-
  修复
  - 修复隐私面罩让模型回复里出现占位符的问题：回复和工具参数里的占位符现在会换回真实内容再显示和保存
  - 修复重发消息的两个问题：消息没有收到回复时重发会把同一条消息发两遍；重发被拒绝（如没有可用模型）时消息会从当前对话里消失
  - 修复个人空间主页输入框：用输入法打字时按回车选词会直接发送半句话；新建对话失败时可能把消息发进别的对话；发送失败会覆盖正在输入的新内容
