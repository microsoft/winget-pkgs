ReleaseNotes: |-
  修复
  - 修复隐私面罩加密信息回显错误的问题
  改进
  - 隐私占位符改用统一的密钥与算法（HMAC）生成：密钥在每个人安装时自动生成并保存在本机，同一内容始终得到同一个占位符
  - 占位符缩短为 8 位（如 {{PHONE_7K2M9XQA}}），旧的长占位符仍可还原
  - 修复流式回复中占位符结尾的 } 被拆开时无法还原的问题
