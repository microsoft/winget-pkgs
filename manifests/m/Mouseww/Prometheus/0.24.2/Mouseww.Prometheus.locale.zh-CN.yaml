ReleaseNotes: |-
  修复
  - 个人空间主页的对话框现在是真输入框：可以直接打字，回车发送，自动带着这句话进入普罗的对话
    - 此前它只是个长得像输入框的按钮，点一下会跳页，看着像能打字其实不能——这次修掉了
  - 点技能胶囊会把示例请求填进输入框并聚焦，可以先改再发，不再直接跳页
  - 发送按钮在没输入内容时置灰；输入法选词时按回车不会误发
  - 对话打不开时保留已输入的文字并提示，不会默默丢掉
  说明
  - 对话框仍是页面的主体，上方一排技能胶囊，下方工具栏带附件入口
  - 深色、浅色与各套皮肤均已适配
