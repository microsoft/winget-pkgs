ReleaseNotes: |-
  新增
  - 个人助理（内置插件，可在设置里关闭）：侧边栏"新对话"下面新增"个人助理"，永远回到同一条长期对话。它有自己的家目录（可编辑的 persona.md 和 notes/ 笔记），问答、规划、记录自己办；需要动项目时把一个明确的任务派到该项目里另起一次运行，对话里显示成"派活"卡片（项目、结果、实际权限，可进入子对话）。
  - 派活权限由宿主限定，不会高于当前对话的权限模式；无人值守的对话派出去的活一律只读。
  - 渠道入口 POST /plugins/assistant/inbound（沿用服务器登录）：只读、一次一条、限流，可接 IM 机器人或手机快捷指令。
  - 每日简报：对助理说"每天几点给我简报"，到点只读生成并存到 notes/。建定时任务前会先问你。
  - 桌面宠物"普罗"（插件）改用这条主线：双击说话就是对个人助理说话，桌宠和主界面只有一份历史。
  - 插件接口：openSession、sessionExists、sessionAccess、callPlugin，runAgent 支持 parentSessionId（权限上限）和 sessionId（在已有对话里继续）。工具结果的 details 会传到界面。
  改进
  - 托盘右键菜单改为由应用自己绘制，与应用内菜单风格一致。
