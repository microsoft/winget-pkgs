ReleaseNotes: |-
  新增
  - 流程支持循环：不需要新的循环节点，让「条件」节点的一条分支连回前面的步骤，另一条分支连到循环外作为出口
    - 条件满足时，从回连的步骤起把循环体重新跑一遍，上一轮的输出通过 {{prev}} 和 {{节点 ID}} 带过去，直到条件不再满足才继续往下走
    - 同一步骤最多完成 20 次，超过会报错终止，避免死循环
    - 保存时检查：环里没有条件节点、或条件没有通向循环外的出口，会标出具体节点
    - 画布上回边画成向上的虚线弧，循环过的步骤显示 × 次数
  - 步骤报错后可以继续：失败的运行实例不再直接作废，可以在同一个实例上「重试失败步骤」或「跳过并继续」
    - 取消、应用关闭而中断的实例同样可以继续，被打断的那一步会重做
    - 入口在画布进度条、运行实例列表，对话里的 flow_run 也可以传 runId 续跑
  - 每次运行是一个独立的运行实例：带独立 id，并记下启动时的流程图
    - 「运行记录」改为「运行实例」，每行显示 id、状态、循环次数，点开即可在画布上查看该次运行的进度
    - 流程之后改过，也能按当时的图回看
  改进
  - 新对话页的草稿按工作区分开保存：在一个项目里写的内容不会出现在另一个项目的输入框里；发送后不再留下已发出的文字
  - 流程的自动排版会忽略回边，带循环的流程不会被挤成一列
  说明
  - 旧的运行记录没有保存当时的流程图，继续运行时使用当前的流程定义
  - 运行实例仍保留最近 60 条
  - 若你用的是桌面安装版，需要更新到本版本才生效；源码运行的话重新构建前端与服务端即可
