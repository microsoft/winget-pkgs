ReleaseNotes: |-
  改进
  - 「通用设置」拆成三个页面，不再一页装二十来项：
    - 通用：默认工作区目录、默认权限模式、目标轮数，以及窗口与更新
    - 外观：语言、主题、配色皮肤、动效、启动画面、对话区宽度
    - 对话：自动压缩、发送方式、回车发送，以及完成提醒
  - 三个页面排在一起，常用设置仍在最前面；只是把「怎么长这样」和「对话怎么进行」从「通用」里拿出来了
  - 各分页标题与说明同步更新，一眼知道这一页管什么
  说明
  - 只是把控件换了位置，没有改动任何设置项的值或存储位置，之前的配置原样保留
  - 移出「通用」后，通知权限的提示状态也跟着搬到了「对话」页
