  MailBrief מתחבר לכל תיבת דואר (התחברות עם Google או Microsoft, או IMAP) ורץ כולו על המחשב שלך.
  תדריך שבועי, דף „היום שלי”, קבלות לאקסל חודשי עם שער יציג, זיהוי פישינג וחיוב כפול, ביטול מנויים בלחיצה,
  מנוע אוטומציות, Google Calendar ו-Tasks, וסיכום יומי במייל. מושהה אוטומטית בשבת ובחג.
