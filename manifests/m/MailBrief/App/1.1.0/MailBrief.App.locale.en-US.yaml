ShortDescription: A local, rule-based mail assistant for Windows (Hebrew) - weekly brief, receipts to Excel, automations. No AI, no cloud.
Description: |-
  MailBrief connects to any mailbox (Gmail and Outlook sign-in, or IMAP) and runs entirely on your computer.
  It writes a weekly Hebrew brief, shows a "My day" page, saves receipts to a monthly Excel file with Bank of Israel rates,
  spots phishing and double charges, offers one-click unsubscribe, a trigger -> conditions -> actions automation engine,
  Google Calendar / Tasks, and pauses automatically on Shabbat and Yom Tov. Rule-based: no AI and no cloud service.
