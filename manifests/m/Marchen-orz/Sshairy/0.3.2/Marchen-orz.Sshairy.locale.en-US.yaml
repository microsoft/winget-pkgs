ShortDescription: A lightweight native SSH client with terminals, SFTP, tunnels and an AI assistant.
Description: |-
  Sshairy is a lightweight, native SSH client for Windows, macOS and Linux. Terminals, dual-pane SFTP, port forwarding and server monitoring share one native window with tabs, splits and panels, and it carries no Chromium, WebView or browser runtime.
  Hosts are grouped with tags, pins and search, with password and key authentication, jump hosts and restored layouts. AI is part of the workflow: Airy can turn a sentence into a command, read context, check servers and carry out the work, with host-key verification and OS-backed credential storage.
