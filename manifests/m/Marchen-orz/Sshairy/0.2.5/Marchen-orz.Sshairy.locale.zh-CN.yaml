PackageIdentifier: Marchen-orz.Sshairy
PackageVersion: 0.2.5
PackageLocale: zh-CN
ShortDescription: 轻量原生 SSH 客户端，集终端、SFTP、隧道与 AI 助手于一体。
Description: |-
  Sshairy 是一款面向 Windows、macOS 和 Linux 的轻量原生 SSH 客户端。终端、双栏 SFTP、端口转发与服务器监控共用一个原生窗口，支持标签、分栏与面板，不携带 Chromium、WebView 或任何浏览器内核。
  主机可以按分组、标签、置顶和搜索来管理，支持密码与密钥认证、跳板机和布局恢复。AI 也是 SSH 工作流的一部分：把任务交给 Airy，或把一句话变成命令，它会读取上下文、检查服务器并执行工作，同时提供主机密钥校验和由系统保管的凭据存储。
