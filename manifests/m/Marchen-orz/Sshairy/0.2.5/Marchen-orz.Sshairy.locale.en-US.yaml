ReleaseNotes: |-
  本版本新增外部 Agent（MCP / Skill）接入和单实例运行，并改进更新提醒、动效设置与文件面板，按模块整理如下：
  外部 Agent 接入（MCP / Skill）
  - 设置中新增「MCP / Skill」：本机 MCP 服务默认关闭，只监听 127.0.0.1，每个客户端使用独立令牌（bc36ea2）
  - 支持 Claude Code、Codex、Zcode 与 DeepSeek Harness：每个客户端一个图标开关，点亮即写入连接配置和 Skill，关闭时作废令牌并清理配置（4282a78、1953210）
  - 外部客户端与 Airy 共用主机目录和五项固定只读诊断：系统摘要、磁盘容量、进程、监听端口、服务状态；不开放任意命令、文件或终端（bc36ea2、1953210）
  - 三档审批：模型审核、主机确认（默认）、范围内自动。悬停可看各档说明，自动档的主机范围在选择框中勾选，支持一键全选（1953210、9698173）
  - 调用审计按操作列出时间、客户端、工具、主机和结果（9698173）
  应用
  - 只保留一个运行实例。Windows 上再次启动会恢复已有窗口并将其带到前台（fb72b46、1d8e15c、9b082a6）
  设置与更新
  - 运行期间每 30 分钟静默检查新版本，有更新时顶栏出现提示，点击即可查看更新日志（ab06b2f、a9fc315）
  - 外观可选关闭、轻量、完整三档动效，系统要求减少动效时最多使用轻量档（2b7f8eb）
  - 修复关闭动效时点击设置分类无法跳转的问题（0d09d44）
  - 更新日志支持中英逐行交替的写法（ab38966）
  文件与界面
  - 终端命令后文件面板在后台重读目录，只有内容或所在目录真的变化时才显示刷新进度条（4b53309、c78164f）
  - 顶栏新建标签按钮垂直居中（ec7e3db）
  This release adds external agent access (MCP / Skill) and single-instance launching, and improves update reminders, motion settings and the files panel, grouped by area below:
  External agents (MCP / Skill)
  - A new "MCP / Skill" section in Settings: the local MCP server is off by default, listens only on 127.0.0.1, and gives each client its own token (bc36ea2)
  - Claude Code, Codex, Zcode and DeepSeek Harness are supported: each client has one icon toggle that writes its connection config and Skill when lit, and revokes the token and cleans up when turned off (4282a78, 1953210)
  - External clients share Airy's host directory and its five fixed read-only diagnostics: system summary, disk capacity, processes, listening ports and service states. Arbitrary commands, files and terminals are not exposed (bc36ea2, 1953210)
  - Three approval modes: model review, confirm hosts (default) and automatic within scope. Hover a mode to read what it does; the automatic scope is picked in a host chooser with select all (1953210, 9698173)
  - The audit lists each operation with its time, client, tool, host and result (9698173)
  App
  - Only one copy runs at a time. On Windows, launching again restores the open window and brings it to the front (fb72b46, 1d8e15c, 9b082a6)
  Settings & Updates
  - While the app runs it quietly checks for a new release every 30 minutes; when one is out, a hint appears in the title bar and opens the release notes (ab06b2f, a9fc315)
  - Appearance now offers Off, Light and Full motion. A system reduced-motion request limits motion to Light (2b7f8eb)
  - Fixed settings section navigation when motion is disabled (0d09d44)
  - Release notes may pair each Chinese line with its English line (ab38966)
  Files & Interface
  - After a terminal command the files panel rereads the directory in the background and shows the refresh bar only when the listing or the directory really changed (4b53309, c78164f)
  - The new-tab button is vertically centered in the title bar (ec7e3db)
