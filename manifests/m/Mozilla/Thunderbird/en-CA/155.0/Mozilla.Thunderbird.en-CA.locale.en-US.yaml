  fixed
  Mark and Tag menu bar items were disabled in search results
  fixed
  Quick Filter ignored address book display names shown in message lists and headers
  fixed
  Attachment filters could disappear or return no results in global search
  fixed
  Body search failed for quoted-printable messages ending on a soft line break
  fixed
  Failed encrypted send did not preserve draft
  fixed
  Failed account setup left an incoming server that blocked account recreation
  fixed
  Removing an account did not remove its OAuth token from the password manager
  fixed
  Account Hub prompted for calendar credentials immediately after successful login
  fixed
