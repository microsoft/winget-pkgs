ShortDescription: Sccache is a ccache-like tool. It is used as a compiler wrapper and avoids compilation when possible. Sccache has the capability to utilize caching in remote storage environments, including various cloud storage options, or alternatively, in local storage.
ReleaseNotes: |-
  sccache 0.20.1

  Summary
  sccache 0.20.1 is a bug-fix release for users of the GitHub Actions cache.
  - GHA: the server failed to start with the GHA backend when the cache was rate-limited
    (#3064). The retry on temporary GHA errors added in 0.20.0 also applied to the startup storage
    check, which could keep retrying past the client's 10s startup timeout. That retry has been
    removed (#3067), so rate-limited (429) requests fail right away again instead of being retried,
    as they did before 0.20.0. If rate limits still get in the way at startup, set
    SCCACHE_SKIP_CACHE_CHECK=1 to skip the storage check.
  - fix some clippy warnings #3058
ReleaseNotesUrl: https://github.com/mozilla/sccache/releases/tag/v0.20.1
