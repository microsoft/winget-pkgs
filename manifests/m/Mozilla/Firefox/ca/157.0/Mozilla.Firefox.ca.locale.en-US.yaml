ReleaseNotes: |-
  Version 157.0, first offered to Release channel users on September 29, 2026

  New
  - 
    Firefox's biggest visual refresh in years is now available, with a modernized look across the browser toolbars, sidebar, menus and individual features, built with our updated design system. It also includes:
    - New built-in themes with light and dark versions, to personalize the look of Firefox in one click.
    - A new compact mode that reduces toolbar and tab spacing to leave more room for web content, useful on smaller screens and in split-screen layouts.
  - WebRTC video calls can now use hardware AV1 decoding on devices that support it, instead of always decoding AV1 video in software.
  - Firefox now shows a warning in the site information panel (the shield icon in the address bar) and in Settings when it has been set up to record its encryption keys, which could let other software on the computer read encrypted web traffic.
  - Firefox Suggest now offers suggestions in the address bar in Austria, Belgium, Czech Republic, Denmark, Finland, Hungary, Ireland, Luxembourg, Netherlands, Norway, Poland, Portugal, Slovakia, Spain, Sweden, and Switzerland. They can be controlled in the Firefox Suggest settings. Learn more.

  Fixed
  - Fixed video from phones and tablets appearing sideways or upside down in WebRTC calls.
  - Fixed the address bar searching for the typed text instead of opening the selected suggestion when a page was still loading, such as shortly after Firefox started.
  - Fixed some HDR videos encoded in 8-bit color formats looking dull and gray on Windows instead of displaying in HDR.
  - Improved audio and video synchronization when repeatedly changing the playback speed of videos, for example on YouTube.
  - Fixed the Vertical Tabs sidebar not reappearing when the cursor moves to the edge of the screen in full screen mode.
  - Fixed an issue on Windows where making a video full screen would leave the Windows taskbar showing over the video.
  - Various security fixes.

  Changed
  - Pressing Tab now moves focus straight to the text field of the address bar and search bar instead of stopping on the search engine button first. The button can still be reached with Shift+Tab.
  - Amazon is no longer included as a built-in search engine. It can still be added as a custom search engine in the search settings. Learn more.
  - The updated sidebar is now enabled for everyone. Anyone still using the previous sidebar will keep a similar layout, with the panel switcher at the top of the sidebar. Additionally, the “Show sidebar” option has been removed from Settings.
    While we continue to refine the new design, the previous sidebar version can still be restored by setting sidebar.revamp to false in about:config. This also turns off vertical tabs. The preference will remain available until the end of 2027.
  - Web page alert(), confirm() and prompt() dialogs, the color and date pickers, and form autocomplete drop-downs now match the page's light or dark color scheme.

  Enterprise
  - You can find information about policy updates and enterprise-specific bug fixes in the Firefox for Enterprise 157 Release Notes.

  Developer

  Web Platform
  - Firefox now supports the at-rule() function for @supports. This allows authors to detect browser support for specific at-rules, such as @supports at-rule(@scope).
  - Firefox now supports the chain value for the CSS overscroll-behavior property.

  Community Contributions
  - With the release of Firefox 157, we are pleased to welcome the developers who contributed their first code change to Firefox in this release, 21 of whom were brand new volunteers! Please join us in thanking each of these diligent and enthusiastic individuals, and take a look at their contributions:
