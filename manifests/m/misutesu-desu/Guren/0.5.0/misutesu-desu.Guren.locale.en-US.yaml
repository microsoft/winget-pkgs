ShortDescription: Fast photo viewer. Zoom and pan stay put when you switch photos.
Description: |-
  Guren is a photo viewer written in Rust. Photos are decoded on background threads and the neighbours of the current photo are prepared ahead of time.
  Zoom and pan stay the same when you move to the next photo, so a burst of shots can be compared at the same spot. It opens JPEG, PNG, WebP, GIF, BMP, TIFF and ICO, and plays animated GIF, WebP and PNG.
