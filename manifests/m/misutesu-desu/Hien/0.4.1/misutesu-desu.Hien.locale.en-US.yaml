ShortDescription: Fast notepad with find, replace and insert word. Notes are plain text files.
Description: |-
  Hien is a notepad written in Rust. Notes are plain .txt files in %APPDATA%\Hien\notes and save on their own shortly after you stop typing.
  It has instant search across notes, find and replace, and an insert word tool that puts another word before or after every match.
