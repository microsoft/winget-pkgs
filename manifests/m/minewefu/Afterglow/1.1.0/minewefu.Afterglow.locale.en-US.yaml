ShortDescription: Open-source tuning and monitoring for NVIDIA RTX GPUs, with no kernel driver and no telemetry
Description: |-
  Afterglow is an MIT-licensed tuning utility for NVIDIA RTX GPUs: core and
  memory overclocking with driver-validated ranges, clock-lock undervolting
  (including a measured voltage/frequency curve on RTX 50, where NVIDIA blocks
  the curve APIs), per-fan curves with hysteresis and zero-RPM, full
  monitoring including memory-junction temperature on RTX 50, FPS and
  frametime metrics via ETW present tracing, a burn test with bit-exact error
  detection, per-game auto profiles, a scriptable CLI, and a Model Context
  Protocol server for AI-agent tuning. All hardware access goes through
  NVIDIA's userland driver interfaces - no kernel driver, no injection, no
  telemetry, no account.
