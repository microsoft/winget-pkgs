ShortDescription: Free, offline transcription and subtitles for audio and video, with speaker labels and YouTube downloads.
Description: |-
  Whisper Transcriber Suite turns audio and video into text and subtitles on your own computer. It runs Whisper speech models locally (faster-whisper by default, plus whisper.cpp and NVIDIA Parakeet), can download from links with yt-dlp, and writes SRT, VTT, DOCX, PDF and other formats, with speaker labels. No account and no cloud: your audio never leaves your computer.
