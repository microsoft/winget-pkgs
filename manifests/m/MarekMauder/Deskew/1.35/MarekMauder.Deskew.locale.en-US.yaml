ShortDescription: Command line tool and GUI for deskewing scanned text documents
Description: |-
  Deskew straightens scanned text documents. It detects text lines with a Hough transform and
  rotates the image so that the lines are horizontal. Blank pages and pages without text lines are
  recognized and left as they are. Reads and writes PNG, JPEG, TIFF (including BigTIFF), BMP, QOI
  and more, and can write a JSON report for scripts. The package has the command line tool (deskew)
  and the GUI frontend (deskewgui).
