ShortDescription: A tiny desktop pet that chases your cursor in a transparent, click-through overlay.
Description: |-
  Desktop Pet is a small open-source desktop companion (dog, cat, fox or rabbit) that follows your mouse around the screen, sits down when it catches up, and falls asleep if you leave it alone. It lives in a fully transparent, click-through window, so it never steals focus or gets in the way of your work. No network access, no data collection.
