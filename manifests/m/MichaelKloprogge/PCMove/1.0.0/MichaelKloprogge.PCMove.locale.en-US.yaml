ShortDescription: Move your programs, files, Wi-Fi networks and settings from your old Windows PC to a new one.
Description: Packs up your programs (reinstalled with winget), personal files, Wi-Fi networks, settings, desktop background and browser bookmarks on the old PC, and unpacks them on the new one, never overwriting a file. What no program can move for you becomes a short checklist with a button for each step. The old PC is only read from. In English, Dutch, German, French, Spanish, Italian and Polish.
