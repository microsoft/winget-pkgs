ShortDescription: Get your old Windows PC ready to sell or give away.
Description: Checks that nothing of yours is left behind (folders not in OneDrive or a PC Move backup, mail files, other drives, browser profiles that are not signed in, BitLocker, the Windows licence), lists the licences and accounts still tied to the PC from the installed programs, writes the specs for the buyer, and walks you through Windows' own reset. It only reads from the PC. In English, Dutch, German, French, Spanish, Italian and Polish.
