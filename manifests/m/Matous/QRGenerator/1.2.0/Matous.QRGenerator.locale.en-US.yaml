ShortDescription: QR code generator and reader with a password generator.
Description: |-
  QR Generator creates QR codes for links, text, e-mail, phone numbers, SMS, contact cards (vCard / MeCard), Czech QR payments (SPAYD), locations, Wi-Fi, calendar events, social networks and Bitcoin. Every code is test-scanned after each change, with a warning when the contrast is too low.
  Codes can have custom colors and gradients, a transparent background, a logo in the center, a header and different dot and corner shapes. It also creates codes in batches and keeps templates and history. Export to PNG (up to 4000 px, 300 DPI), SVG, the clipboard or print.
  The built-in QR reader decodes a code from an image or a screenshot, and the password generator creates random passwords, memorable passphrases and usernames. The interface is in Czech and English.
