ReleaseNotes: |-
  DSH Desktop 1.0.6（正式版 · 随包内核换代）
  本版是正式版：进入 GitHub 的 releases/latest，客户端右上角 ⋯ 菜单的在线更新检查轮询的正是
  latest，所以存量用户会收到推送。v1.0.6 只换随包内核与适配层：0.2.1-rc.1 → 0.2.1-rc.2，
  Rust 壳 / 契约 / sidecar 零改动，内置插件在册仍是 29 条。
  🎯 本版重点
  1. 内核换代 0.2.1-rc.1 → 0.2.1-rc.2：pin / vendor / 锁文件三线同改，352 份离线 tgz
     （339 个 dsh 包 + 13 个框架件），337 处依赖声明与锁内条目全为 rc.2。
  2. 新增 DeepSeek-V4.1-Flash-1017 模型适配（新包 dsh-client-ui-deepseek-model-label-1017）。
  3. 新增 DeepSeek Search & Fetch API（新包 dsh-web-deepseek-api）：网页搜索设置页多出
     「启用新版 Web 搜索 API」开关与第二个地址字段「搜索 API 地址」，追加 /search 或 /fetch；
     dsh-web-search-deepseek 请求体加 thinking: { type: "disabled" } 并重写错误文案。
  4. 补丁层 62 项不变，只重锚一处：patch-web-search-baseurl 的设置页文案半边按 rc.2 新字节重录，
     provider 半边（基址归一化 + 协议契约指引）一字未动；其余 61 项在 rc.2 上原位生效。
  5. v1.0.5 的修复继续生效：自动压缩弹窗不清草稿、壳进程闪退根治（退出闸门 / 孤儿内核收割 /
     会话退出标记）、Windows 资产补齐与发布门禁、HTTP 405、{{cwd}} 消息装配、引导页「开始设置」、
     文件拖入、余额开关、macOS 设置写入与别名链接修复等。
  🔁 内核换代明细
  - pin 与 vendor：scripts/compat/kernel-pin.json 改 0.2.1-rc.2 / dsh-v0.2.1-rc.2
    （exact pin，禁止浮动）；vendor/dsh-kernel/ 换成 352 份离线 tgz（339 个 dsh 包 +
    13 个框架件）。rc.1 的 337 个 dsh 包全在，新增
    @deepseek-ai/dsh-client-ui-deepseek-model-label-1017 与 @deepseek-ai/dsh-web-deepseek-api。
  - 锁与依赖：package.json 337 处依赖声明（336 deps + 1 devDep）与 package-lock.json
    同批重生成，锁内 352 个 file: 条目、339 个 dsh 条目 version 全为 0.2.1-rc.2；
    validate-pin → ✓ dsh-v0.2.1-rc.2（offline-tarball）。
  - 补丁层：62 项、合计写入 75 处。首次 npm ci 实测写入 74 处 / 失配 1 项（即 web-search
    client 半边），重锚后增量写入 1 处 / 失配 0，二次运行写入 0（幂等）；patch-surface verify
    → 85 个被干预文件与快照一致、零漂移。
  - 基线锁：ta6-baseline-matrix 的版本键换 0.2.1-rc.2（pristine 闭包 352 包），矩阵与 rc.1
    逐项相同——43 changed / 14 root / 5 target-absent，零 anchor-missing、零 already、零 THROW。
  - 内置插件：在册 29 条，无增删；peers 判定 0 DENIED、入口可见性 0 缺失、
    dsh.client 声明 0 落空（详见 dsh-desktop/docs/builtin-plugins-inventory.md 的 rc.2 复核段）。
  🛠 v1.0.5 已修复的内容在本版继续生效（简述）
  - 自动压缩弹窗不再清空草稿：dsh-auto-compact / dsh-change-review 0.1.2 在替用户提交前
    先过「草稿为空 + 会话空闲」两道闸门；不满足就等，不消耗冷却、不弹误导提示。
  - 壳进程闪退 / 自动重启根治：退出闸门 + 窗口路径 panic 隔离、孤儿内核收割、panic 完整回溯、
    会话退出标记、托盘重启竞态修复。
  - 其余：HTTP 405、{{cwd}} 消息装配失败、引导页卡「开始设置」、文件拖入、余额开关、
    macOS 设置写入与 profile 别名链接等，详见 v1.0.5 的发布说明。
  📦 随包内置插件清单（在册 29 条，本版无增删）
  - 本版无插件版本变动：与 v1.0.5 完全相同，含 dsh-auto-compact 0.1.2、
    dsh-change-review 0.1.2、dsh-builtin-manager 0.2.0、dsh-goal-completion 0.1.0、
    dsh-prompt-optimizer 2.4.0、dsh-prompt-custom 0.5.0、dsh-better-sidebar 0.24.2、
    dsh-basics-panel 0.4.2、dsh-workspace-anchor 0.1.1 等，共 29 条。
  ✅ 验证（2026-10-18 实测基线）
  - Node 侧：scripts/test/ 206 个测试文件，npm test = 2277 例 / 0 fail / 0 cancelled
    （pass 2268 / skip 9；skip 逐条是环境缺料，如 pristine 夹具缺第三方模型包、本机无兄弟仓库克隆）。
  - 兼容三闸：check-syntax 通过；validate-pin → ✓ dsh-v0.2.1-rc.2（offline-tarball）；
    patch-surface verify → 85 文件与快照一致、零漂移；补丁层 62 项（root 14 + file 48）。
  - Rust 侧：gnu 链配对实跑（RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu +
    --target x86_64-pc-windows-gnu）709 passed / 0 failed / 4 ignored（8 个 crate / 36 个 target）；
    本次壳代码零改动，属回归复跑。
  - 安装布局冒烟 smoke-installed.sh（手拼布局 + 全隔离 DSH_HOME/DSH_TAURI_USERDATA，绝不跑真安装器）
    在 rc.2 payload 轮次 PASS：boot 五步全 OK、29 条内置插件在册、镜像进 profile 的包数达标、
    ✓ 插件加载零致命错误、page-error 总数 0、杀壳后残留监听 0。
  - 隔离内核实机（全新 DSH_HOME / DSH_TAURI_USERDATA）：boot 五步全绿（3.8s）、web 起服，
    真发一条消息过了提示词装配期（隔离 home 无密钥，止步于 no API key for provider route），
    unknown prompt variable / failed to load / pending (waiting for 均为 0。
  已知问题
  - dsh-synapse（会话地图）：重启或切换会话时历史回填可能出现空档——宿主下线了 Session 上的
    events 属性而插件仍读旧字段（不报错、不崩溃）。已登记在内置插件台账 §5.5，本版按裁定未处置。
  - 两个便携包都不含内置 Node：包内 resources/dsh-desktop/vendor/node/ 是空目录，完整便携版与轻量便携版
    实为同一份 payload（实测两包条目数逐字节相同）。内核解析链因此回落「系统 Node ≥22」——
    用便携版请先装 Node 22+，否则启动会走到清晰报错路径。该缺口自 v0.5.7 起长期存在，安装版不受影响。
  - Windows ARM64：payload 内原生模块仍是 x64 prebuild，靠 Windows 11 模拟层兜底，标为实验性产物。
  - 升级安装会先静默卸载旧版：安装器按注册表定位旧安装目录并装回原位置，用户数据（会话、配置）不动；
    若本机有正在运行的实例，请先退出——托盘常驻时内核 node 仍持有已加载映像，覆盖同名文件可能被系统拒绝。
