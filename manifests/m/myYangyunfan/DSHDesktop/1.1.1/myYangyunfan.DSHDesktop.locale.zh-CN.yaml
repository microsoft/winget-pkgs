ReleaseNotes: |-
  DSH Pack 1.1.1（补丁版 · 侧栏「编队」页崩溃修复 + 内置件升到 npm latest + 随包内核 0.2.2-rc.5）
  本版是正式版：进入 GitHub 的 releases/latest，客户端右上角 ⋯ 菜单的在线更新检查轮询的正是
  latest，所以存量用户会收到推送。Rust 壳与界面零功能改动，在册插件仍是 33 条。
  🎯 本版重点
  1. 侧栏「子代理 / 编队」页崩溃修复（用户报障）：打开该页只看到一条错误条而不是编队板，控制台是
     Cannot read properties of undefined (reading 'map')。根因是宿主契约漂移——内核 0.2.2 起 agentTeam
     投影不再携带成员列表（TeamProjection 只剩 { enabled, tasks, failure? }，upstream upgrade-guide
     v0.2.1-rc.2「agentTeam.members is removed」），而我们的侧栏仍按 0.1.7 形状读 team.members.map(…)；
     更隐蔽的是内核 teamProjectionDefinition.init 让每个会话都发这条投影，所以
     team === undefined 那道守卫从未生效。修法照上游口径：enabled === false 读成「这个会话没有团队」，
     名册改为「Lead 行 + subagentCatalog 直接子项」，任务板照旧读 team.tasks——一条团队线只有一个
     名册来源，不再有两份可以互相矛盾。这修的不是「新版宿主」——0.2.2-rc.5 的投影形状与 rc.2 一致，
     崩溃从换代那天起就在。
  2. 随包内核 0.2.2-rc.3 → 0.2.2-rc.5（2026-11-19）：对我们是补丁级——家族名清单逐名相同、
     60 条补丁零失配、判定矩阵 60/60 逐项不变、vendor/dsh-kernel/ 仍是 388 份（375 dsh + 13 框架件，
     56,540,180 字节，退役 0 / 新增 0）。patch-surface 只有 7 个文件因上游自改字节而漂移、marker 全在位，
     重取快照（94 文件 / 87 家族）后 verify 复绿；锁文件 388 条全部 file: 解析。
  3. 内置件升到 npm latest：本版把 7 件内置件更新到 npm 最新（详见下表），其中 dsh-toolbox-ui
     一路从 1.10.1 升到 1.14.0（上游 2026-11-22 15:13 发布，含 ToolSearch 有限用途提示 + 混合搜索批次
     加载承诺修复）。dsh-better-sidebar 仍是 0.24.2（本地重建件，见下），billion-context 仍是 0.1.213
     （上游 0.1.216 仍缺 #5961 修复）。
  4. 应用内「检查更新」补齐四件内置件：dsh-pocket / dsh-easyrewrite / dsh-context /
     ds-harness-remote 四件此前查不到更新——不是没新版，是更新源唯一表漏登记。UPDATE_SOURCES 由
     8 条补到 12 条（扣掉 2 条排除后生效 10 条），四条坐标逐个按 npm latest 复核为
     2.13.2 / 3.1.0 / 0.87.0 / 0.6.7，与本机在册版本一致，所以补完不会凭空冒出「有新版」的假提示。
  📦 内置件版本表（本版实际随包）

  | 插件               | 版本    | 本版变化（对比 v1.1.0）                                                 |
  | ------------------ | ------- | ----------------------------------------------------------------------- |
  | dsh-toolbox-ui     | 1.14.0  | 1.10.1 → 1.13.0 → 1.13.2 → 1.14.0（上游已自带让位修复，本地 fork 已撤） |
  | dsh-pocket         | 2.13.2  | 2.12.0 → 2.13.2                                                         |
  | dsh-free-search    | 0.9.80  | 0.9.39 → 0.9.80                                                         |
  | dsh-context        | 0.87.0  | 0.83.0 → 0.87.0                                                         |
  | ds-harness-remote  | 0.6.7   | 0.6.4 → 0.6.7                                                           |
  | dsh-easyrewrite    | 3.1.0   | 3.0.1 → 3.1.0                                                           |
  | dsh-plugin-shop    | 0.9.4   | 0.9.3 → 0.9.4                                                           |
  | dsh-better-sidebar | 0.24.2  | 不动（本地重建件：vendored 上游 + 常驻左栏等自研补充）                  |
  | billion-context    | 0.1.213 | 不动（上游 0.1.216 仍不含 #5961 修复）                                  |

  🔧 其他修复
  - MCP 面板不再「让位给内核运行时包」：dsh-toolbox-ui 的让位检测原先只要条目名同时含 mcp 与
    manager 就判成竞争面板，于是内核那条 @deepseek-ai/dsh-mcp-manager 被误认，面板当场停用、用户彻底
    失去 MCP 界面（内核并没有 MCP 界面）。改为排除 @deepseek-ai/* 运行时提供方 + 只对在跑条目让位；
    该修复已由上游 1.13.0 自带，本仓 fork 退役，回归锁 unit-toolbox-yield-detector 改咬上游形态。
  - 脚手架不再生成已删除的注入 id：dsh-super-injector 的模板曾给新建插件写
    @deepseek-ai/dsh-client-runtime（该包 rc.2 起已被上游删除），注入 id 解析不到 → 新插件客户端半边永久
    pending，而构建与 boot 全绿。已移除，并新增全仓哨兵 unit-plugin-client-inject-resolvable。
  - 文档：新增 PRIVACY.md（WinGet 审核要求）；数据目录说明统一为 Tauri 版实路径 dsh-desktop。
  ✅ 验收
  - npm test：2269 例 / pass 2260 / skip 9 / fail 0（skip 全是环境缺料：pristine 缺可选子代理运行时、
    无真实网络、无特权建符号链接等）。
  - patch-deps：写入 72 处 / 失配 0 / 失败 0 / 降级 0 / 告警 0 / 共 60 项。
  - patch-surface verify：94 文件 / 87 标记家族无漂移。
  - validate-pin：dsh-v0.2.2-rc.5（0.2.2-rc.5，offline-tarball）通过。
  - unit-patch-output-parsable：109 个被干预产物逐个 CJS+ESM 双形态编译，零 SyntaxError。
  - 打包路径墙（本机预演）：3095 个文件，安装态最长 152/240、构建期 170/258，越线 0。
  - check-syntax.js：全部入口文件语法检查通过。
  ⬆️ 升级须知
  - 覆盖安装不会动 %APPDATA%\dsh-desktop 与 ~/.dsh（会话、设置、插件清单都在那里）。
  - 上一版起「内置件」已可在应用内更新（设置 → 插件 → 内置插件）；本版把这四件也接进了更新源，
    存量用户升级到本版之后，它们的后续更新就能正常收到提示。
  - 若你曾手工改过 assets/plugins/ 下的内置件，覆盖安装会回到随包版本——自定义请放进 profile。
