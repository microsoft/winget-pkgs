ShortDescription: Turns a PowerPoint deck's speaker notes into a narrated MP4, offline.
Description: |-
  Deck Narrator turns the speaker notes of a PowerPoint deck (.pptx) into a narrated MP4 video.
  Each slide is shown while a natural-sounding voice reads its notes, and slide animations are
  stepped through with [click] markers. It runs fully offline: the Kokoro-82M voice model and
  voices are included. It has a window (Start menu: Deck Narrator) and a command line
  (deck-narrator), and draws slides with PowerPoint, or with LibreOffice when PowerPoint isn't installed.
