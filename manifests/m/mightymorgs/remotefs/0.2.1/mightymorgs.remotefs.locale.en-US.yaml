ShortDescription: Manage local, SMB and NFS files through a browser
Description: |-
  remotefs provides a browser-based filesystem manager and JSON API for local
  folders, SMB shares and NFS exports. It supports password sign-in, uploads,
  editing, copy/move/delete, favourite locations, CIDR scanning and staged
  multipart ZIP downloads. Filesystem operations follow the configured policy
  and server permissions. The portable package includes Python and libnfs.
