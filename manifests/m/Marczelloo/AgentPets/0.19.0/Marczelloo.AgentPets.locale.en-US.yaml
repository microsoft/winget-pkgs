ShortDescription: Animated pets in the Windows taskbar for your coding agents
Description: |-
  Agent Pets puts a small animated pet in the Windows taskbar for every coding agent session: Claude Code, Codex,
  opencode and others. Each pet shows what its agent is doing (thinking, using a tool, waiting for you, done),
  with notifications, rate limits, subagents and usage statistics. Everything stays on your computer.
