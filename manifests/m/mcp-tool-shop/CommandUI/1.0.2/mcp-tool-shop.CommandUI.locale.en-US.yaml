ShortDescription: AI-native shell environment with semantic command review
Description: CommandUI is a desktop shell that combines a real terminal with AI-powered semantic input. Describe intent in natural language, review generated commands before execution, and build reusable workflows. Built with Tauri v2, React 19, and Ollama for local-first AI planning.
