ShortDescription: Screenshots and GIF/MP4 screen recording for Windows, in a 2.2 MB installer.
Description: |-
  winshotx is a free and open source screenshot and screen recording tool for Windows 10 and 11,
  a lightweight alternative to the built-in Snipping Tool. It captures a region over a frozen
  screenshot with a 6x pixel magnifier that shows the exact colour in hex, snaps to system
  windows, and records that region to GIF or MP4 at 15, 30 or 60 fps through Windows Graphics
  Capture. The editor trims the recording frame by frame with A and B marks and exports to GIF,
  MP4 or PNG, to disk or to the clipboard.
  Nothing is downloaded at runtime: MP4 is written by Media Foundation in hardware and the GIF
  encoder is pure Rust, so there is no bundled FFmpeg. It installs for the current user only, so
  it never asks for administrator rights, and it lives in the system tray with no window of its
  own. There is no account, no telemetry and no uploads.
  The interface is in Spanish.
