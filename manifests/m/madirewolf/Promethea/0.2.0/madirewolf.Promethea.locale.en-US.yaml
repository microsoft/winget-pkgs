ShortDescription: A fast, uncluttered BitTorrent client for Windows, built on libtorrent.
Description: |-
  Promethea is a free and open-source BitTorrent client built on libtorrent. It opens in a simple layout that shows what's running and what's stopped; a Detailed layout adds every status filter, tags, trackers, peers and a speed graph.
  It has built-in search through qBittorrent-compatible search plugins, RSS feeds with download rules, a torrent creator, sequential download, file priorities, categories and tags, scheduled speed limits, an IP filter and a web UI. No ads, accounts or telemetry.
