ShortDescription: The Linux notify-send command for Windows. Show desktop notifications from the command line.
Description: |-
  notify-send shows native Windows notifications from the command line, with the same options as libnotify's notify-send on Linux: urgency, expire time, app name, icons, hints, replacing a notification, waiting, and buttons that print the action chosen.
  Each app name gets its own entry in the Windows notification settings. It needs no Start menu shortcut, background service or administrator rights, and works the same from PowerShell, Command Prompt, Git Bash, WSL, scripts and scheduled tasks.
