ShortDescription: The macOS caffeinate command for Windows. Keep the PC awake, and the display on, from the command line.
Description: |-
  caffeinate keeps your PC awake, and the display on if you like, while a command runs, until a process exits, for a set time, or until you press Ctrl+C.
  It takes the same options as the macOS command (-d, -i, -m, -s, -u, -t, -w), so scripts and habits carry over. It uses Windows power requests, which the system drops as soon as caffeinate ends, even if it is killed, and it shows up in powercfg /requests with the command it keeps the PC awake for.
