License: MIT
LicenseUrl: https://github.com/marler8997/anyzig/blob/HEAD/LICENSE
ShortDescription: A zig executable that runs any version of zig, picked per project.
Description: |-
  anyzig is a zig version manager, not zig itself. It installs as `zig` and runs the version of zig
  each project asks for: the version comes from the `build.zig.zon` in the current or a parent
  directory (`.minimum_zig_version`, or `.zig_version` if present), or from the first argument,
  e.g. `zig 0.13.0 build`. Versions are downloaded on first use. `zig any ...` runs anyzig's own
  commands.
Moniker: anyzig
Tags:
- zig
- version-manager
- compiler
ReleaseNotesUrl: https://github.com/marler8997/anyzig/releases/tag/v2026_10_23
InstallationNotes: |-
  anyzig provides the `zig` command. If the zig.zig package is also installed, the two packages
  replace each other's `zig`: uninstall zig.zig first. Any other `zig` earlier in PATH takes
  precedence over anyzig.
ManifestType: defaultLocale
