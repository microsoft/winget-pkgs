ShortDescription: LLM API proxy that sends the same prompt once, fails fast and caps spend.
Description: |-
  orchestrator sits in front of an OpenAI-compatible or Anthropic API. It deduplicates identical prompts so a repeated prompt costs one upstream call, puts a bounded queue, a circuit breaker and per-call timeouts in front of the provider so outages fail fast, and caps spend.
  Point OPENAI_BASE_URL at http://127.0.0.1:8080/v1 and existing OpenAI clients go through it with no code change. Works with OpenAI, Anthropic, llama.cpp and vLLM; `orchestrator --provider echo` runs offline with no key.
