ShortDescription: Free Teamfight Tactics helper that tells you when to save, level up or roll.
Description: |-
  A small always-on-top window for Teamfight Tactics (TFT). It reads your gold, level and HP from the game's own local Live Client Data API (127.0.0.1:2999) and tells you when to save, level up or roll down, what level to aim for, and when the next augment, carousel and PvE round come.
  No login and no API key. Board, shop, items and augment choices are not in Riot's local API, so those panels stay empty in a real game.
  Not affiliated with or endorsed by Riot Games.
