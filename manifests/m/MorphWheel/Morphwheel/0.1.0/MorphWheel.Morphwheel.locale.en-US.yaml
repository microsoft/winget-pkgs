ShortDescription: Shift-drag a file in Windows File Explorer, drop it on a radial wheel, get it converted.
Description: |-
  Morphwheel converts files from File Explorer. Start dragging a file, press Shift, and a radial
  wheel appears at the cursor. Drop the file on a slice to convert it. The source file is never
  modified, moved or overwritten: every conversion is a new file beside it. Image conversion is
  built in (to JPG, PNG, WebP, AVIF, PDF and ICO, or a smaller copy), HEIC input is an
  opt-in download, and plugins add more targets.
