ShortDescription: Every port on this machine, and where it came from
Description: |-
  A terminal program that shows every listening port on this machine together
  with the thing that started it: the agent, editor, terminal or container, the
  project directory, whether it is reachable from off the machine, and whether
  it looks abandoned. No web UI, no dashboard, no server, and it opens no
  listening socket of its own.

  Windows note: CPython on Windows ships without curses, and portlist is a
  curses program. This package installs the source and a shim, so it needs
  Python 3.9 or newer on PATH plus the windows-curses wheel
  (pip install windows-curses). "pipx install portlist-tui" installs both in
  one step and is the simpler route.
