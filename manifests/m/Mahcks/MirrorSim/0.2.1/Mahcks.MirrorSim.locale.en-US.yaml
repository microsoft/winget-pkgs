ReleaseNotes: |-
  v0.2.1 fixes a receiver startup failure on some Windows PCs, removes a misaligned camera cutout from the preview and captures, and resolves security advisories in MirrorSim's dependencies.
  - Receiver startup: if Windows blocks the usual ports (socket error 10013 or port in use), MirrorSim now starts on a free port instead of failing.
  - Dynamic Island: MirrorSim no longer draws its own fixed-size island over the mirrored screen or framed captures.
  - Video recovery: the preview waits for the next full frame and resumes on its own after a stream interruption.
  - Adds a bounded diagnostics history included in support exports.
  - Updates Vite, rustls, the Tauri updater and related dependencies to resolve security advisories, and pins AirPlayServer runtime v0.5.1.
ReleaseNotesUrl: https://github.com/Mahcks/MirrorSim/releases/tag/v0.2.1
InstallationNotes: Open MirrorSim, start listening, then choose MirrorSim from Screen Mirroring in iPhone Control Center. The iPhone and PC must be on the same local network.
