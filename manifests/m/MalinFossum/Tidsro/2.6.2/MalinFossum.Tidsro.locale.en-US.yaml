ReleaseNotes: |-
  A silent uninstall no longer waits on a question. A fix-only release for the uninstaller.
  - The uninstaller asked whether to also delete your alarms, settings and log even under /SILENT and /VERYSILENT, so an uninstall run by a script or a package manager stopped on a prompt nobody was there to answer.
  - A silent uninstall now never asks and keeps the data in %AppData%\Tidsro. Uninstalling from Windows Settings still asks, as before.
