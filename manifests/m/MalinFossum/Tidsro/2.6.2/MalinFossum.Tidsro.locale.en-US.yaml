ShortDescription: A calm, dark-mode-first desktop timer and alarm for Windows.
Description: |-
  Tidsro is a calm, dark-mode-first desktop timer for Windows: countdown timers and clock-time alarms that nudge you with a quiet corner card instead of a flashy notification.
  Alarms fire once or repeat on the weekdays you choose, each with an optional label, sound and 5-minute warning, and a Week tab lays the repeating ones out as a timetable.
  Tidsro runs in the system tray, installs without admin and keeps your timers and settings on your own machine.
