ShortDescription: An AI helper for your servers — describe the problem, it checks and fixes, you see every step
Description: >-
  MyAITerm is an AI helper for your servers. Describe what you need in plain
  words — "the website is down", "the disk is full" — and it connects to your
  machine, checks the problem and proposes fixes. Commands run only after you
  approve, and every step is recorded for review. Includes an SSH terminal,
  SFTP file management and browser remote access to machines behind NAT.
  You can also plug in your own AI key — no account needed.
