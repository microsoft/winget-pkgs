ShortDescription: Image annotation tool for bounding boxes and polygons.
Description: |-
  Bounding Box Editor is a desktop application for annotating objects in images with rectangular and polygonal bounding boxes, e.g. to create training data for object detection.
  Annotations can be imported and exported in the Pascal VOC, YOLO, JSON and CSV formats, and boxes can be predicted by a TorchServe or LitServe inference server.
