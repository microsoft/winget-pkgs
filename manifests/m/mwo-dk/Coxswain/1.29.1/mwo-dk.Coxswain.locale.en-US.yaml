Description: Coxswain is a two-panel file manager for the desktop, with an F-key bar and a keyboard-first layout. It finds files by name, by the text inside them and by what they are about, previews documents, data, images and code, shows git status and history, opens archives as folders, and finds duplicates. Online-only cloud files are never downloaded unless you open one. A terminal app with the same keys is the package mwo-dk.Coxswain.Terminal.
