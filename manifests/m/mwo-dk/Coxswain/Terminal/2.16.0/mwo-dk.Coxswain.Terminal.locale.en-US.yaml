Description: 'The terminal app of Coxswain: two panels and the F-key bar in any terminal, with search by name, by the text inside files and by meaning, git status and history, archives as folders, and a viewer for databases and Parquet. Start it with coxswain or cox. The desktop app is the package mwo-dk.Coxswain.'
