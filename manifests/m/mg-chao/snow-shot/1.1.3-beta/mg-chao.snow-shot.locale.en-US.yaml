ReleaseNotes: |-
  一、新功能
  1. 标注与导出：新增可搜索、保存、删除和复用的绘图模板；识别结果可保存为源文件。
  2. 工具栏与绘制：绘图工具栏支持自定义分隔符、撤销和重做的位置；自由绘制截图区域使用笔画稳定处理，减少指针抖动。
  3. AI 与界面：自定义 AI 模型增加推理支持，更新 Snow Shot 图标；macOS 上应用不再显示在 Dock 中。
  二、问题修复
  1. 截图与画布：修复选区变化时控制柄未及时重绘，以及跨过选区边框拖动画布时操作中断的问题。
  2. 贴图：恢复剪贴板文字时使用当前主题，并兼容缺少可选字段的贴图数据。
  三、性能与构建
  1. 构建检查：增加 Windows 的 Clang 可移植性诊断。
  2. 版本：Snow Shot 更新至 1.1.3-beta。
  > macOS 安装包仍使用临时签名。替换应用后若系统权限未生效，请在“系统设置 → 隐私与安全性”中重新启用“屏幕与系统音频录制”和“辅助功能”权限。
  What's Changed
  - fix(overlay): preserve canvas drags across selection border by @mg-chao in #1386
  - fix(pinned): use current theme for restored clipboard text by @mg-chao in #1387
  - fix(pinned): tolerate missing optional payloads by @mg-chao in #1388
  - feat(custom-ai): add reasoning support for custom models by @mg-chao in #1389
  - build(clang): add Windows portability diagnostics by @mg-chao in #1390
  - feat(annotation): add reusable draw templates by @mg-chao in #1391
  - feat(export): save recognition results as source files by @mg-chao in #1392
  - feat(icons): refresh Snow Shot custom icon set by @mg-chao in #1393
  - feat(macos): hide Snow Shot from the Dock by @mg-chao in #1394
  - fix(screenshot): repaint selection handles during region changes by @mg-chao in #1395
  - feat(toolbar): make separator and history actions configurable by @mg-chao in #1396
  - feat(freehand): share stroke stabilization with region selection by @mg-chao in #1397
  - build(snow-shot): bump version to 1.1.3-beta by @mg-chao in #1398
