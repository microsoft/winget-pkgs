ReleaseNotes: |-
  ## 中文

  - 滚动截图拼接更快，保存 PNG 图片所需的时间也更短。
  - 从剪贴板贴图时，图片显示更稳定，打开时也更少闪烁。
  - 文字识别结果在不同视图中复制更顺手。选中文本时可复制选中内容，也可以用“复制全部”获取完整结果。

  ## English

  - Scrolling screenshots stitch faster, and PNG images save more quickly.
  - Images pinned from the clipboard display more reliably, with less flicker when they first appear.
  - Text recognition results are easier to copy across views. Copy a text selection or use Copy All to get the full result.

  ## 下载指南 / Download guide

  Snow Shot 是完整版，Windows 离线安装包内含文字识别组件。Snow Shot Mini 的下载包更小，手动识别文字时会按需下载模型。便携版解压即可运行。应用会自动使用所需的 `-update.zip` 文件。

  Snow Shot is the full edition. Its offline Windows installer includes text recognition components. Snow Shot Mini is a smaller download and fetches text recognition models on demand. Extract the portable ZIP to run the app. The app uses `-update.zip` files for updates.

