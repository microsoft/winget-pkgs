  Snow Shot includes all features. Snow Shot Mini is a smaller download with capture, annotation, pinning, collages, recording, and manual text recognition. The same files are available on [Gitee](https://gitee.com/mg-chao/snow-apps/releases/tag/v1.6.1_snow-shot).

