  ## macOS 快速安装 / Quick install

  复制任一命令到终端。Apple Silicon 用户如果要安装 Mini，在命令末尾加上 `--edition mini`。

  Copy either command into Terminal. To install Mini on Apple Silicon, append `--edition mini`.

  **Gitee**

  ```sh
  curl -fsSL --proto '=https' --proto-redir '=https' -o install-snow-shot-macos.sh https://gitee.com/mg-chao/snow-apps/releases/download/v1.6.1_snow-shot/install-snow-shot-macos.sh && /bin/bash install-snow-shot-macos.sh
  ```

  **GitHub**

