  ## macOS 快速安装 / Quick install

  复制任一命令到终端安装 Snow Shot。Apple 芯片用户可以在命令末尾加上 `--edition mini` 安装 Snow Shot Mini。

  Copy either command into Terminal to install Snow Shot. On Apple Silicon, append `--edition mini` to install Snow Shot Mini.

  **Gitee**

  ```sh
  curl -fsSL --proto '=https' --proto-redir '=https' -o install-snow-shot-macos.sh https://gitee.com/mg-chao/snow-apps/releases/download/v1.6.8_snow-shot/install-snow-shot-macos.sh && /bin/bash install-snow-shot-macos.sh
  ```

  **GitHub**

  ```sh
  curl -fsSL --proto '=https' --proto-redir '=https' -o install-snow-shot-macos.sh https://github.com/mg-chao/snow-shot/releases/download/v1.6.8_snow-shot/install-snow-shot-macos.sh && /bin/bash install-snow-shot-macos.sh
  ```
