ReleaseNotes: |-
  ## 中文

  - 触发截图后，选区和工具栏出现得更快。
  - 截图选区可显示网格辅助线，方便对齐。画线时按住 Ctrl（Mac 上为 ⌘），端点可吸附到附近的线条端点。
  - 编号、气泡、形状和箭头上的文字可分别设置样式，应用会记住你的选择。
  - 文字识别结果为表格时，可通过右键菜单复制选中的单元格。

  ## English

  - The selection and toolbar appear faster when you start a screenshot.
  - Show grid guides around the screenshot selection for easier alignment. Hold Ctrl (⌘ on Mac) while drawing to snap to nearby line endpoints.
  - Set separate text styles for number markers, speech bubbles, shapes, and arrows. The app remembers your choices.
  - Right-click selected cells in a text recognition table to copy them.

  ## 下载指南 / Download guide

  Snow Shot 是完整版，Windows 离线安装包内含文字识别组件。Snow Shot Mini 的下载包更小，手动识别文字时会按需下载模型。便携版解压即可运行。应用会自动使用所需的 `-update.zip` 文件。

  Snow Shot is the full edition. Its offline Windows installer includes text recognition components. Snow Shot Mini is a smaller download and fetches text recognition models on demand. Extract the portable ZIP to run the app. The app uses `-update.zip` files for updates.

