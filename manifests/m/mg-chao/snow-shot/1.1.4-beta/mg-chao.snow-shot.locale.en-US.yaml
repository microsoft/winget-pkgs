ReleaseNotes: |-
  一、新功能
  1. 截图：取色器新增相对坐标显示，并支持切换物理像素与逻辑像素读数。
  2. 关于页面：新增 QQ 支持群组，并提升更新面板的稳定性。
  二、问题修复
  1. 截图与捕获：截图捕获遵循光标显示设置；恢复 OCR 结果上无需点击的悬停光标更新；工具提示覆盖相邻触发元素时保留悬停状态。
  2. 贴图：识别内容上的控件保持可点击；受控交互后保留指针路由。
  3. 录制：macOS 音频流中禁用光标捕获；录制浮层保持在截图界面之下。
  4. 窗口选择：Windows 窗口边界包含标题栏。
  5. 更新器：启动 IPC 不再触发提权。
  三、性能与构建
  1. 截图性能：降低坐标显示的更新开销。
  2. 版本：Snow Shot 更新至 1.1.4-beta。
  > macOS 安装包仍使用临时签名。替换应用后若系统权限未生效，请在“系统设置 → 隐私与安全性”中重新启用“屏幕与系统音频录制”和“辅助功能”权限。
  What's Changed
  - fix(capture): honor cursor setting for screenshot captures by @mg-chao in #1401
  - fix(snow-ui-selector): include title bars in Windows window bounds by @mg-chao in #1402
  - fix(popup): preserve hover when tooltip overlays adjacent trigger by @mg-chao in #1403
  - fix(ocr): restore hover cursor updates without clicks by @mg-chao in #1404
  - feat(screenshot): add relative coordinates to color picker by @mg-chao in #1405
  - fix(pinned): keep controls clickable over recognition content by @mg-chao in #1407
  - fix(macos): keep recording overlays below screenshot surfaces by @mg-chao in #1408
  - fix(recording): disable cursor capture in macos audio streams by @mg-chao in #1412
  - fix(pinned): preserve pointer routing after controlled interactions by @mg-chao in #1413
  - fix(updater): avoid elevation during startup IPC by @mg-chao in #1414
  - feat(about): add QQ support groups and stabilize update panel by @mg-chao in #1415
  - build(snow-shot): bump version to 1.1.4-beta by @mg-chao in #1417
