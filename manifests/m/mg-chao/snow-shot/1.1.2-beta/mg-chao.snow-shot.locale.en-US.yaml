ReleaseNotes: |-
  一、新功能
  1. 多区域截图：支持在截图中添加或扣减选区，并加入对应图标和快捷键。
  2. 贴图管理：新增已关闭贴图历史、贴图管理入口、完整图像预览与销毁快捷键，改进贴图窗口的恢复和清理。
  3. 标注与更新：支持沿箭头路径拖动文字标签；仅检查更新模式发现新版本时会通知用户。
  二、问题修复
  1. 截图与导出：自动保存遵循已配置的图像格式，重新截图时排除可见的取色器，并修复圆角阴影、显示器边界与选区快捷键问题。
  2. 贴图与界面：修复 Windows 上贴图控制按钮的悬停状态和选区轮廓显示，调整侧边栏空白区域及像素尺寸单位文字。
  3. macOS：加强截图区域快捷键及系统集成，并启用本地 Crashpad 崩溃记录。
  三、性能与构建
  1. 性能：缓存缩略图、延后贴图清理，减少拖动箭头文字时的排版工作，并在截图完成后释放选区预览缓存。
  2. 版本：Snow Shot 更新至 1.1.2-beta。
  > macOS 安装包仍使用临时签名。替换应用后若系统权限未生效，请在“系统设置 → 隐私与安全性”中重新启用“屏幕与系统音频录制”和“辅助功能”权限。
