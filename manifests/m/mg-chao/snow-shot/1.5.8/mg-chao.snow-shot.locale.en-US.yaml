  ## macOS 快速安装 / Quick install

  将任一命令复制到终端。Apple Silicon 用户安装 Mini 时，在命令末尾加上 `--edition mini`。

  Copy either command into Terminal. To install Mini on Apple Silicon, append `--edition mini`.

  **Gitee**

  ```sh
  curl -fsSL --proto '=https' --proto-redir '=https' -o install-snow-shot-macos.sh https://gitee.com/mg-chao/snow-apps/releases/download/v1.5.8_snow-shot/install-snow-shot-macos.sh && bash install-snow-shot-macos.sh
  ```

  **GitHub**

