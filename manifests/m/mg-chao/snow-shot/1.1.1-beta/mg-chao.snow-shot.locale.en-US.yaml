ReleaseNotes: |-
  一、新功能
  1. 历史记录：可从历史记录直接贴图，并保留截图时的选区位置；新增贴图与更多操作，同时支持单独配置展示图像压缩。
  2. 截图与导出：支持在截图时隐藏选区工具栏，并可配置截图质量和压缩率。
  3. 标注与托盘：新增可调节的箭头头部比例，以及安全重启应用的托盘操作。
  二、问题修复
  1. macOS：修复截图叠层输入、选区单位、窗口定位和托盘中键操作，并改进安装包签名。
  2. 贴图与历史记录：修复分数缩放时的像素偏移和截图内容变化，保留历史记录贴图的桌面位置。
  3. 界面与更新：稳定取色器提示层、文本装饰和箭头边界，并修复更新时的注册表权限处理。
  三、性能与构建
  1. 性能：减少 macOS 桌面捕获中的全帧拷贝与初始化开销，并减少截图装饰的无效重绘。
  2. 版本：Snow Shot 更新至 1.1.1-beta。
  > macOS 安装包仍使用临时签名。替换应用后若系统权限未生效，请在“系统设置 → 隐私与安全性”中重新启用“屏幕与系统音频录制”和“辅助功能”权限。
