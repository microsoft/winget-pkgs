ReleaseNotes: |-
  一、新功能
  1. MCP 集成：新增 Snow Shot 自动化接口，支持通过 MCP 客户端控制截图、编辑、导出等操作。此功能可在“设置 → 系统”中启用。
  二、问题修复
  1. 文字编辑：修改单项文字属性时保留其他混合样式；修复画布文字重绘时出现的空白区域。
  2. 截图与贴图：改进剪贴板、导出和贴图窗口的交互稳定性。
  3. 快捷键：坐标显示切换改为 Ctrl+P。
  4. 更新器：应用已缓存更新前重新检查当前版本；检查失败时停止安装。
  三、构建
  1. 版本：Snow Shot 更新至 1.1.5-beta。
  > macOS 安装包仍使用临时签名。替换应用后若系统权限未生效，请在“系统设置 → 隐私与安全性”中重新启用“屏幕与系统音频录制”和“辅助功能”权限。
  What's Changed
  - feat(mcp): add Snow Shot screenshot automation bridge by @mg-chao in #1411
  - fix(updater): recheck release before applying cached update by @mg-chao in #1419
  - fix(text): preserve mixed styles when editing text properties by @mg-chao in #1420
  - fix(text): prevent gaps during canvas text repaint by @mg-chao in #1421
  - fix(shortcuts): change coordinate toggle to Ctrl+P by @mg-chao in #1422
  - fix(snow-shot): harden clipboard, export, and pinned-window behavior by @mg-chao in #1423
  - build(snow-shot): bump version to 1.1.5-beta by @mg-chao in #1425
