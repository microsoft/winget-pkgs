ReleaseNotes: |2-
  ## 一、新功能
  
  1. **截图识别**：新增自动二维码识别和 LaTeX 公式识别，并支持调整 OCR 检测器的图像缩放比例。
  2. **录屏与贴图**：支持从反方向拖动调整录屏区域和贴图边框。
  3. **分发**：新增 WinGet 自动提交流程，并为稳定版准备 Homebrew 分发流程。
  
  ## 二、问题修复
  
  1. **macOS 交互**：修复窗口关闭快捷键、刘海屏安全区域的画布范围、置顶贴图的层级，以及 Retina 屏幕上的光标步进。
  2. **截图与录屏**：修复跨显示器边界的输入处理、截图资源清理，以及录屏时意外生成的媒体附属文件。
  3. **识别与翻译**：限制 LaTeX 上传图像的尺寸，并允许具备视觉能力的模型用于文字翻译。
  4. **界面**：改进 macOS 物理按键快捷键处理，并补全确认对话框操作的本地化。
  
  ## 三、构建
  
  1. **版本**：Snow Shot 更新至 `1.1.6-beta`。
  
  > macOS 安装包仍使用临时签名。替换应用后若系统权限未生效，请在“系统设置 → 隐私与安全性”中重新启用“屏幕与系统音频录制”和“辅助功能”权限。
  
  ## What's Changed
  
  * fix(snow-shot): localize confirmation dialog actions by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1433
  * feat(ocr): add configurable detector image scaling by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1434
  * fix(recording): stop writing implicit media sidecars by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1435
  * fix(capture): clean up worker and restored image resources by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1436
  * feat(qr): add automatic screenshot QR recognition by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1437
  * fix(macOS): support standard Close shortcut across windows by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1438
  * fix(overlay): preserve full-display canvas across safe areas by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1439
  * fix(translation): allow vision-capable models for text translation by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1440
  * fix(pinned): keep topmost macOS pins above system chrome by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1441
  * feat(release): add Snow Shot Homebrew distribution by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1442
  * feat(release): automate Snow Shot WinGet releases by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1444
  * feat(ocr): add LaTeX formula recognition by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1445
  * fix(cursor): normalize Retina steps and restore pinned tool cursor by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1446
  * fix(latex): cap uploaded image dimensions to worker limits by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1447
  * fix(shortcuts): dispatch macOS commands by physical key by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1448
  * fix(screenshot): preserve input at display boundaries by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1449
  * feat(resize): support crossed recording and pinned borders by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1450
  * build(snow-shot): bump version to 1.1.6-beta by @mg-chao in https://github.com/mg-chao/snow-apps/pull/1451
  
  **Full Changelog**: https://github.com/mg-chao/snow-apps/compare/v1.1.5-beta...v1.1.6-beta
