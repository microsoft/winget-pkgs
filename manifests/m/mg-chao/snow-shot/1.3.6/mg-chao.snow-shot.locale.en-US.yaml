ReleaseNotes: |-
  Snow Shot / Snow Shot Mini 1.3.6
  What's new / 更新内容
  - Faster screenshot workflows: apply actions to multiple captures, queue exports, and copy the saved file or its path or open its folder from the save result. / 支持批量处理截图、排队导出，并可在保存完成后复制文件、复制路径或打开所在文件夹。
  - Tables that paste correctly (Full): open recognized tables in your spreadsheet app, with more reliable formatting and default fonts when copying or exporting. / 识别的表格可直接在表格软件中打开；改善复制、导出的格式和默认字体。
  - Clearer recordings: show mouse-wheel scrolling alongside keyboard and mouse effects. / 录屏支持显示鼠标滚轮操作，演示过程更清晰。
  - More comfortable capture and annotation: customize selection-border effects, let the global canvas toolbar fade when the pointer moves away, and manage history and pinned images more easily. / 可自定义选区边框效果；全局画布工具栏在鼠标移开后淡出；截图历史和贴图管理更方便。
  - Better macOS alignment: annotations stay aligned when the screen's safe area changes. / 修复 macOS 屏幕安全区域变化时的标注错位。
  Choose your download / 下载指南
  Snow Shot includes all features. Mini keeps capture, annotation, pinning, stitching, recording, and manual OCR, with fewer advanced recognition and translation features. / 完整版提供全部功能；Mini 保留截图、标注、贴图、拼图、录屏和手动 OCR，精简高级识别与翻译功能。
