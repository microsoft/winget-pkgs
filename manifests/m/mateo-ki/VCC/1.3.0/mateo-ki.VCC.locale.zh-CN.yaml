PackageIdentifier: mateo-ki.VCC
PackageVersion: 1.3.0
PackageLocale: zh-CN
ShortDescription: Windows 桌面代理订阅客户端，内嵌 mihomo / sing-box / xray 内核，并对外提供本地 HTTP API。
Description: VCC 是 C++20 编写、使用原生 Qt 6 Widgets 界面（不是 Webview 套壳）的 Windows 桌面代理客户端，负责收集订阅与节点、真实握手测速、按规则分流跑代理，同时对外提供一个本地 HTTP API。订阅源支持 HTTP(S) 拉取与条件请求、失败重试和定时自动拉取，以及 Gist 发现与 Telegram 频道抓取；节点解析支持 `ss` `vmess` `vless` `trojan` `hysteria2`（`hy2`）`socks5` 与带鉴权的 `http(s)` 分享链接，以及 Clash / Clash Meta 的 YAML 配置和混排的裸文本。mihomo、sing-box、xray 三种内核会自动检测本地版本并在缺失时从 GitHub Release 下载（可选加速镜像），内核子进程挂进 Windows 作业对象，主程序被强杀时不会留下还在监听端口的孤儿内核。接管方式有系统代理与 TUN 两种，分流模式五种，支持故障自动切换、规则命中统计、实时上下行速率曲线、活跃连接表、内核日志、系统托盘、单实例互斥与五套主题；`--headless` 可只跑 API 不开界面。
