ShortDescription: Windows proxy subscription client with mihomo, sing-box and xray kernels and a local HTTP API.
Description: VCC is a Windows desktop proxy client written in C++20 with native Qt 6 Widgets rather than a webview. It collects subscription sources and nodes, measures latency with real handshakes, routes traffic through a proxy kernel according to rules, and exposes a local HTTP API. Sources support conditional HTTP requests, retries and scheduled refresh, plus Gist discovery and Telegram channel fetching. Parsed node types include `ss`, `vmess`, `vless`, `trojan`, `hysteria2`/`hy2`, `socks5` and authenticated `http(s)` share links, together with Clash and Clash Meta YAML configuration and mixed plain text. The mihomo, sing-box and xray kernels are detected locally and downloaded from GitHub releases when missing, and their child processes are placed in a Windows job object so a killed client leaves no listener behind. Traffic can be taken over through the system proxy or TUN, with five routing modes, automatic failover driven by configurable probes, per-rule hit statistics, live throughput graphs, an active connection table, kernel logs, a system tray, single-instance mutual exclusion and five themes. `--headless` runs the API without the interface.
