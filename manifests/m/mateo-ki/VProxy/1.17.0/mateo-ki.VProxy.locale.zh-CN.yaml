ReleaseNotes: |-
  🚀 VProxy v1.17.0 发布说明 / Release Notes
  🎉 VProxy v1.17.0 正式发布！本版本为重要里程碑大版本，重点带来核心架构升级与内核精简化、控制台纯净视觉重构（彻底告别双模式切换）、节点与订阅源工具栏 27px 几何高度与紧凑圆角全量对齐、运行时出站探活精度增强，以及依赖项特性剪裁与二进制编译深度瘦身：
  🛠️ 核心架构与内核选路重构
  - 内核体系精简升级：彻底移除过时的 Shoes 内核编译器与维护链路，代码库全面瘦身，软件聚焦支持工业级 5 大主流高性能代理内核：Mihomo / Sing-box / VP-Core / Xray / Meow；
  - 智能自动选路演进：调整协议自动选路策略，原 Shoes 偏好的 snell 协议平滑回退优先由工业级成熟的 Mihomo 承接，自动兜底链同步更新为 Mihomo ↔ Sing-box → VP-Core → Meow → Xray，网络连通更稳定；
  - 测试与资产全面优化：安装器安装/卸载脚本、内核检测与基准测试套件同步移除残留内核进程清理与配置定义，杜绝系统资源浪费。
  🎨 控制台视觉重构与空间优化
  - 告别臃肿，拥抱极简纯净：彻底下线控制台冗余复杂的「完整模式」，全面统一为清晰直观、轻量呼吸感的现代仪表盘视图；
  - 外观设置清理：外观设置面板同步移除「控制台 UI 模式」切换选项，消除多模式维护带来的认知负担与状态割裂；
  - 微距级留白精调：
    - 链式代理卡片：前置节点行上间距优化 +5px，避免前置/后置行与标题拥挤；
    - 出站模式卡片：微调「规则 / 全局 / 直连」胶囊切换栏上下留白，减少 8px 冗余边距，视觉排布更协调居中。
  📐 节点与订阅源工具栏几何统一
  - 全控件 27px 几何高度基准：节点列表与订阅源视图中的所有按钮（新建、拉取、导入/导出、测速、维护清理、Gist 发现等）、搜索框、筛选胶囊与下拉框，全面对齐 27px 统一高度与统一圆角弧度；
  - 消除文字底部截断：优化控件内边距与垂直对齐测量逻辑，彻底根治此前在特定系统缩放或字体渲染下按钮底部文字偶发微量裁切的问题；
  - 状态筛选胶囊升级：订阅源视图状态胶囊（全部 / 启用 / 停用 / 拉取失败 / 无节点）支持高亮选中态、统一内边距与无缝包裹，视觉反馈更轻快灵动。
  ⚡ 探活与连通性增强
  - 直接出站探活模块升级：增强 proxy_probe 探活管线，优化对冷启动延迟与多协议特征的二次校验，杜绝虚假连通；
  - 简化测速内核机制：隐藏网络设置中冗余的「测速内核」手动选择器，统一由系统按节点协议智能自动分配最佳探活内核（Mihomo / Sing-box / Xray 各展所长），杜绝因手动指定无并发探针能力的内核造成测速全部超时失效；
  - 自愈守护增强：针对异常退出的内核进程提供更具鲁棒性的清理机制，确保节点快速恢复可用。
  📦 依赖瘦身与构建体积优化
  - 依赖特性精准裁剪：深度清理 tokio、rhai、sqlx 等大型基础依赖库的臃肿默认特性，按需启用异步运行时组件，消减无用宏展开与中间编译开销；
  - Release 配置升级：优化 Release Profile 为 opt-level = "s" + lto = "thin" + panic = "abort"，在保障桌面端极速响应与低延迟的同时，有效收敛发布包与安装包体积。
