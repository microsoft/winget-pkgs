ReleaseNotes: |-
  🚀 VProxy v1.16.18 发布说明 / Release Notes
  🎉 VProxy v1.16.18 正式发布！本版本重点带来测速可用节点自动导出与调度抽屉筛选增强、出站探活冷启动与 45s 周期自愈解降级、端口映射失效治理与 sing-box 模式修复，以及内核运行中热更新全面解禁：
  ⚡ 测速导出与调度抽屉增强
  - 可用节点自动导出：测速完成（非手动取消）后自动将连通的有效节点 (latency_ok=1) 导出为独立 URI 文件（落盘于 data/exports/可用节点-<时间戳>.txt），可直接导入其他客户端或复用于自动化脚本；
  - 调度抽屉批量测速：策略组调度抽屉筛选栏新增「⚡ 测试 (N)」按钮，支持一键针对当前筛选命中（地区/名称/订阅源）的节点发起并发测速，共享主界面进度与取消控制；
  - 订阅源多重过滤：筛选栏新增订阅源下拉（全部源 / 指定订阅源），与地区、名称筛选无缝叠加生效。
  🛡️ 进程自愈与降级恢复机制
  - 45s 周期自愈解除降级：出站探活降级后，后台看门狗每 45 秒自动重试活性复查，节点网络抖动恢复后自动解除降级，不再需要手动重启代理；
  - 出站探活冷启动重试：针对冷启动时（冷 DNS/初次握手偏慢）探活超时的节点，自动间隔 4 秒重试一次，重试通过按运行中处理，避免冷节点被误判死；
  - 杀进程与崩溃启动自愈：检出残留指纹时保护代理配置，确保非正常杀进程或崩溃残留的系统代理在下次启动时自动恢复连接；
  - 出站真实连通性二次确认：204 探活后再向内核确认主出站真实活性，杜绝假绿。
  🔌 端口映射失效治理与内核配置修复
  - 同名节点智能改绑：当端口映射绑定的节点 ID 变动时，自动按名称智能匹配同名最新节点并双写持久化更新；
  - 失效显式标记与告警：端口映射列表中明确显示「⚠ 失效」，映射目标未解析时跳过监听并告警，杜绝静默回落走主节点；
  - 全局 Toast 提示中心：错误提示停留 10 秒、普通提示 6 秒，自带防抖去重与右上角浮动锚定；
  - sing-box Both 模式修复：mode.has_tun() 让 Both 模式同时正确生成 tun 与 mixed inbound。
  🔄 内核管理与状态链路
  - 内核运行中热更新：解除内核卡片上「立即更新」的历史门禁，全面支持运行中直接热更新内核并自动重启生效；
  - 统一 kernel_serving() 判据：修复降级运行时连接审计抽屉、流量统计、规则页被误判为「未启动」导致数据消失的缺陷；
  - 双层日志与崩溃快照：内核异常退出时自动快照日志尾部至 logs/kernel-crash-*.log；引入 tracing 双层日志（控制台 + 7 天滚动文件），GUI 增加「打开日志目录」直达入口。
  🎨 界面与平台细节
  - 幽灵标题栏自愈：修复 Windows 窗口最小化恢复时的幽灵标题栏问题（实测到幻影非客户区才动态剥离 WS_CAPTION）；
  - 订阅源表单重构：订阅源添加/编辑表单升级为现代内联报错与全宽布局。
