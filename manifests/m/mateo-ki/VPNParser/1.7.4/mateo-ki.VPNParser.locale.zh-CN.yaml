ReleaseNotes: |-
  🚀 VPN Parser v1.7.4 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.7.4！此版本是一次里程碑式的跨平台安全隔离与交互调优大版本。全面攻克了 Linux（Fedora / GNOME / niri / DMS）环境下的 6 项系统级难题（内核进程安全隔离、TUN 权限机制、GSettings 原生系统代理自动配置与 Unix Socket 单实例平滑唤醒）；同时对控制台进行了全新视觉升级，将图表 Tab 更名为「汇总图表」，核心分布卡片高度扩增 60px 并全面支持分流策略组接口一键折叠展开。

  🌟 新特性与核心更新
  📊 1. 控制台视觉中枢升级与卡片自适应
  - 「汇总图表」定位更清晰：控制台原「图表」Tab 正式更名为「汇总图表」；
  - 核心分布卡片高度增加 60px：
    - 「全网延迟阶梯频谱分布」与「节点协议组成分布」外层高度严格对齐扩充至 164px（净高 144px）；
    - 协议分布环形图放大：尺寸由 68×68 扩大为 96×96（半径 37px，环宽 9.5px，中心节点计数与文本字号增大，视觉更具饱满冲击力）；
    - 延迟频谱指示条加粗：高度由 8px 加粗到 13px，整体比例舒展典雅；
  - 消除 Tab 切换跳动（零像素偏差）：彻底剔除可用节点页原有多余的间距，使「汇总图表」与「可用节点」首个卡片顶部绝对定格在同一个 Y 坐标（间距恒为 8.0px）；
  - 分流策略组接口默认折叠：
    - 「分流策略组」各分组下的所有节点接口默认全部折叠收起，卡片保持精致单行高度；
    - 头部右侧提供 ▶ 展开接口 (N 个) 胶囊按钮，点击即刻丝滑展开或收起，告别密密麻麻的按钮瀑布。

  🐧 2. Linux 平台安全与系统级体验专项调优 (Fedora / GNOME / niri / DMS)
  - 内核清理安全隔离（杜绝误杀第三方客户端）：
    - 进程清理新增 /proc/<pid>/exe 路径与 cmdline 特征强校验，严格仅清理本程序受管目录下的内核；
    - 绝不误杀 用户电脑上正在运行的 Clash Verge、v2rayA、nekoray 等第三方客户端内核；
  - TUN 授权引导与 Wayland 崩溃根治：
    - 严禁引导用户使用 sudo 启动 GUI，避免 Wayland 拒绝授权及数据目录错乱；
    - 针对内核二进制文件提供精确的 sudo setcap cap_net_admin,cap_net_raw+ep <kernel_path> 授权方案；
  - GSettings Linux 桌面系统代理原生支持：
    - 为 Linux 平台实现基于 GSettings（org.gnome.system.proxy）的系统代理自动开启与无缝还原，让 Fedora / Ubuntu / Debian / niri / DMS 下的浏览器与桌面应用均能一键自动走代理；
  - Unix Domain Socket 单实例互斥与平滑唤醒：
    - 废弃粗暴终止旧实例的做法，改用 Unix Domain Socket 发送唤醒指令激活已有前台窗口并优雅退出，保护正在运行的代理与数据库写入；
  - 平铺窗口管理器（niri / Hyprland）自适应排版：
    - 窗口最小保护尺寸优化为 820 × 520，控制台策略组与调度按钮支持响应式折行，避免半屏平铺时元素溢出。
