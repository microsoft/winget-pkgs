ReleaseNotes: |-
  🚀 VPN Parser v1.6.3 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.6.3！此版本正式带来了全套 Linux 桌面跨平台发行包、自动发布 CI/CD 流水线强化，以及全新的仪表盘视觉与构建文档。

  🌟 新特性与核心更新
  🐧 1. Linux 平台全套发布包正式就绪 (Full Linux Desktop Packaging)
  现在 Linux 用户无需自行从源码编译，即可直接下载并运行我们官方构建的打包产物：
  - AppImage (.AppImage)：
    - 跨发行版独立便携包，自带完整运行依赖，在 Ubuntu / Debian / Fedora / Arch / openSUSE 等主流 Linux 发行版上赋予可执行权限即可直接双击运行！
    - 完整集成应用图标（SVG/PNG）、.desktop 桌面规范与桌面启动器支持。
  - DEB 安装包 (.deb)：
    - 原生支持 Debian、Ubuntu、Linux Mint、Pop!_OS、Deepin 等 Debian 系系统，使用 sudo dpkg -i 即可标准安装并注册系统菜单。
  - RPM 安装包 (.rpm)：
    - 原生支持 Fedora、RHEL、CentOS、Rocky Linux、openSUSE 等红帽/SUSE 系系统，使用 sudo rpm -Uvh 或 dnf install 即可安装。
  - 本地一键打包工具：
    - 新增 scripts/build_linux_packages.sh 与 scripts/build_linux_packages.ps1，支持在 Linux 或 Windows WSL 环境下一键生成全套 Linux 三大安装包。
  🔄 2. GitHub Actions 多平台自动化发布流水线
  - 打版本 Tag 时，GitHub Actions 自动化流水线现已升级为多平台并行发布：
    - Windows Runner 负责编译并产出安装向导 (-windows-x64-setup.exe) 及 SHA-256 校验列表；
    - Linux Runner 负责在 Ubuntu 纯净容器中编译并自动打出 .AppImage、.deb、.rpm 三大安装包；
    - 自动合并挂载到同一个 GitHub Release，一站式提供各平台下载。
  🛡️ 3. 测试与跨平台稳定性增强
  - 修复了 Linux CI runner 环境下孤儿进程守护测试因 inode 文件释放延迟引发的 ExecutableFileBusy (ETXTBSY) 偶发竞态，保证全测试集 100% 稳定通过。
  - 增强了 Linux 平台下桌面环境（X11 / Wayland）下的渲染回退兼容性与核心守护进程回收能力。
  📖 4. 文档与界面形象升级
  - README 仪表盘展示图更新：使用最新高精实机运行截图，直观展示实时上下行吞吐折线图、24 小时连通性柱状图及多协议节点状态。
  - 详尽的 Linux 构建指南：在 README 中补齐了从依赖安装到 AppImage/deb/rpm 制作的完整指南。

