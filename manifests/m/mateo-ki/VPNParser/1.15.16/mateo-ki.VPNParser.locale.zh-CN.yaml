ReleaseNotes: |-
  🚀 VPN Parser v1.15.16 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.15.16！本版针对控制台仪表盘与订阅管理交互进行了全面细节打磨，正式支持策略组调度抽屉节点卡片全功能右键菜单与双击切换、系统代理与 TUN 模式一键齿轮直达网络设置抽屉，并优化订阅列表对齐与状态卡呼吸间距：
  🎛️ 调度方式抽屉：节点卡片右键菜单与双击切换
  - 全功能右键上下文菜单：策略组调度抽屉内的节点卡片全面支持右键交互，提供「🚀 设为活动出口 / 设为活动节点」、「ℹ️ 查看详情」、「⚡ 测速节点」、「🛡️ IP 检测」、「📋 复制节点名称」、「📋 复制节点地址」及「🔒 锁定为出口（自动转手动）」等全套操作。
  - 模式智能衔接：在自动调度模式（延迟选优/负载均衡）下右键设为出口或锁定出口，系统自动将该策略组无缝切为「手动指定」并应用生效。
  - 双击直达出口：双击任意非活动节点卡片即可快速切换出口，免除多步操作。
  - 卡片提示增强：悬浮 Tooltip 补充右键与双击快捷指引，并精准标注当前活动出口状态。
  ⚙️ 控制台仪表盘：网络设置齿轮直达
  - 系统代理 & TUN 模式卡片齿轮：控制台底部的「系统代理」与「TUN 模式」卡片右上角增加轻量设置齿轮图标，鼠标悬停具备柔和衬底与指向手势反馈，点击一键唤起右侧网络设置抽屉（DNS 协议与 TUN 虚拟网卡配置）。
  📐 视觉排版与交互体验精修
  - 订阅源列表行垂直居中：订阅源表格各列单元格统一实行左右排版与垂直居中对齐（row_h = 40px），彻底解决进度条与文本在纵向上高低不一的参差感。
  - 订阅源全行空白右键菜单：优化网格内部命中测试与交互事件响应范围，整行任意空白区域（列间距、尾部余白）均可直接右键弹出操作菜单，告别必须精确寻找文字右键的痛点。
  - 状态卡片元素微距优化：拉开控制台状态卡片国旗地区方块与出口 IP/节点名称的横向间距，并增大右上角连接状态文本与呼吸绿点的安全间距，避免紧密挤压。
