ReleaseNotes: |-
  🚀 VPN Parser v1.14.0 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.14.0！本版带来了重磅新协议扩展、智能内核自适应防护、自定义 User-Agent 以及终端代理深度联动升级：
  ✨ 新特性与核心升级
  - 全协议扩展解析与编译导出（TUIC / SSR / WireGuard / Hysteria v1）：
    - 新增支持 tuic://（支持 QUIC UUID、拥塞控制 BBR/CUBIC、ALPN 与 UDP Relay 模式）；
    - 新增支持 ssr:// / shadowsocksr://（完整 Base64 编码解析 host、port、protocol、obfs、password 及 URL 参数）；
    - 新增支持 wireguard:// 与 wg://（解析 private_key、public_key、reserved 预留字段、preshared_key 及多 CIDR 地址）；
    - 新增支持 hysteria://（v1 协议与已有 v2 统一解析支持）；
    - 以上所有新增协议均已全链路接入 SQLite 存储、Mihomo / Sing-box 双内核配置生成、以及多格式导出。
  - 遇到不支持的协议默认退回 Mihomo（全自动平滑保活）：
    - 当您在状态栏或偏好中指定了特定代理内核（如 Xray、Shoes 或 Meow），而当前节点采用的协议该内核暂不支持时，系统不再报错中断，而是自动、平滑地回退到全协议工业级成熟的 Mihomo 启动代理；
    - 若在 TUN 模式下选择了不支持 TUN 的内核（如 Xray 或 Shoes），系统同样自动平滑回退至 Mihomo，状态栏透明提示，确保网络永不断连。
  - 自定义 User-Agent 支持与防封禁预设：
    - 新建订阅源弹窗与全局 Ctrl+V / Cmd+V 快速导入支持自定义 User-Agent，内置主流客户端预设（clash.meta、clash-verge/v1.7.7、sing-box/1.9.0、v2rayN/6.42、ClashforWindows/0.20.39 等）；
    - 默认以 clash.meta 发起拉取，解决机场面板拦截 403 及非标准协议节点被截断为纯 SS 的问题。
  - Meow 代理超时熔断与 XHTTP/TUN 深度预检：
    - 深度排查并解决 Meow（meow-rs）代理连接全网超时的痛点：针对其不支持 SplitHTTP / xhttp 传输层、Cloudflare ECH 加密握手以及 Windows TUN 环路缺陷，增加启动前智能重定向至 Mihomo；
    - 运行时连通性验证若检测到 Meow 握手超时，自动触发熔断器，无感切换至 Mihomo 瞬间恢复网络。
  - 终端代理与 Git 全局代理深度打通：
    - 开启「终端代理」时，除了写入用户环境变量（大写+小写）外，自动配置 Git 全局代理（git config --global http.proxy）；
    - 无论终端是开启代理前还是开启后打开，git clone / git pull 均可即时生效；
    - 修复 TUN 模式下跳过终端代理的问题，并在仪表盘与设置面板支持即时热开关与退出安全还原。
  - 网卡 Fake-IP 残留 DNS（198.18.0.1）自愈清理：
    - 将 198.18.0.1 纳入网卡残留死回环 DNS 监控与网络检测工具箱，彻底消除虚拟网卡残留 DNS 造成的全系统断网。
  - 本地 YAML 路径支持与文件导入增强：
    - 全局 Ctrl+V 直接识别本地路径 YAML，新建订阅源支持本地文件选择器与图标，解决 macOS/Windows 本地配置文件无缝导入。
  - 桌面图标尺寸优化：重新精修并导出多尺寸应用图标（包含 16/24/32/48/64/128/256），视觉更细腻协调。
