ReleaseNotes: |-
  🚀 VProxy v1.16.7 发布说明 / Release Notes
  🎉 VProxy v1.16.7 正式发布！本版本重点重构了控制台仪表盘的自适应排版体系，彻底解决了完整版与简易版下的卡片裁切、间距与重叠问题，并全面修复了单节点测速点击暂停/停止后无法即时熔断的缺陷：
  🎨 仪表盘：完整版与简易版像素级精细自适应重构
  - 根治出站模式胶囊与链式代理截断：
    - 提升完整版第 3 行基准行高至 148.0px（总高 168.0px），为出站模式分配 62.0px、链式代理分配 101.0px；
    - 出站模式三段式胶囊切换器（规则 / 全局 / 直连）圆角完整圆润呈现，四边留白匀称，彻底消除文字截断；
    - 链式代理“后置”节点选择行与卡片底边拥有充裕安全边距，垃圾桶清理图标与按钮边框完整呈现，绝不贴底。
  - 差异化自然间隙与绝对几何定位：
    - 完整版两卡之间拥有精确的 5.0px 上间距，子模块紧凑统一；
    - 简易版出站模式高度调整为 82.0px，两卡间距优化为舒展自然的 8.0px，告别割裂空旷感；
    - 采用绝对几何定位渲染两张子卡片，彻底免疫 scope_builder 自动收缩光标导致的子卡片叠盖缺陷。
  - 标题对齐与节点区垂直居中：
    - 出站模式与链式代理标题均直接对齐卡片顶端，与左侧服务状态、分流规则及右侧策略组标题严格处于同一水平基准线；
    - 链式代理下方节点选择区（前置与后置）根据卡片可用空间自适应垂直居中，上下留白高度对等。
  - 底栏防重叠与文字清晰度治理：
    - 收敛底栏各卡片高度与边距，在 1.2x 等高 DPI 缩放下依然与底部状态栏保留充足安全呼吸间隔；
    - 强化 CentralPanel 及所有卡片的嵌套裁切保护 (ui.clip_rect().intersect(...))，彻底杜绝内容越界绘制；
    - 移除底栏标题双次偏移绘制的伪加粗逻辑，彻底消除字符重影与模糊。
  ⏹ 测速体验：全链路即时熔断与停止
  - 单节点流式测速取消令牌全接入：
    - 在 speedtest_one_download 的 Ping 探测、Download（拉流工作协程与 48 轮高频采样）及 Upload（上传工作协程与 40 轮采样）以及落库前全链路增加 cancel_token 探测；
    - 用户点击“⏹ 停止测速”时，底层网络拉流瞬间 break 退出，不再消耗多余网络流量与带宽；
    - 在消息中枢 poll.rs 中自动拦截丢弃已取消采样的通道残留帧，同步复位 UI 忙碌状态，彻底杜绝点击停止后界面仍跑完全程的缺陷。
