ReleaseNotes: |-
  🚀 VPN Parser v1.15.19 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.15.19！本版重点在控制台状态卡片增设「活跃连接」快捷直达图标，并对底栏系统代理与 TUN 模式卡片进行了视觉净化微调：
  🔌 状态卡片：新增「活跃连接」快捷入口
  - 状态卡右上角直达图标：在控制台主状态卡片内核管理图标旁新增「活跃连接」快捷图标（插头），点击直接滑出右侧「网络连接与 DNS 审计」抽屉；
  - 连接态感知与动态计数：图标悬停即时透出当前活跃连接总数与审计提示，有活跃流量时高亮强调色，无连接时沉稳收敛，洞察网络状态快人一步；
  - 全功能连接审计体系：抽屉内包含连接列表、进程带宽归集与实时 DNS 解析记录三大视图，支持按主机/进程一键搜索与精准批量断开。
  🎨 仪表盘底栏：系统代理与 TUN 模式卡片视觉净化
  - 移除右上角冗余齿轮图标：彻底去除控制台底栏「系统代理」与「TUN 模式」卡片右上角重复堆叠的 17px 小齿轮，根除双入口视觉杂乱感；
  - 保留左侧大图标高效直达联动：完全保留点击卡片左侧图标（盾牌 / 火箭）直接滑出右侧「网络设置」抽屉的能力，配合鼠标手形指针、悬停加深背景与强调色描边高亮反馈，操作更直观顺手；
  - 排版呼吸感回归：卡片右侧回归单一明确的开关控件，文字与状态展示空间更加从容规整。
