ReleaseNotes: |-
  🚀 VPN Parser v1.15.6 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.15.6！本版带来全新的三维度流量统计抽屉、统一配置备份与全量迁移，以及系统代理 / TUN 运行中热切换（不断连接），并新增管理员启动与开机自启动能力：
  📊 全新流量统计抽屉（节点 / 域名 / 软件进程）
  - 一键呼出：上传 / 下载速率卡片右上角新增迷你柱状图统计入口，点击右侧滑出流量统计抽屉，并自动定位到对应方向（下载优先 / 上传优先）排序；
  - 三个维度排行：节点流量统计 / 域名流量统计 / 软件进程流量统计，一行一个条目，直观回答"流量都跑给谁了"；
  - 实时增量统计：每拍增量累加累计上下行流量，活跃条目带绿点指示并显示实时上下行速率与活跃连接数；
  - 排行可视化：Top 1 / 2 / 3 金银铜排名徽标、相对最高值进度条对比、占比百分比；
  - 排序与检索：综合 / 下载优先 / 上传优先三种排序（并列按连接数、再按名称稳定序），支持按节点名/协议/服务器、域名、进程名关键词搜索；
  - 概览与清理：顶部三列概览卡（累计总流量、维度特有中卡、实时活跃连接），各维度独立清空统计。
  💾 统一配置备份与全量迁移（Unified Profile）
  - 统一 Profile Schema v1：订阅源集合、自定义节点（协议归一化）、统一分流路由 / DNS / TUN / 模式、软件全局偏好一次性归一化抽象；
  - 一键备份：导出完整 YAML 配置至 data/backups/ 目录并自动复制到剪贴板；
  - 完整还原：从本地文件选择统一配置文件导入，无损恢复全部配置；
  - 设置页新增「统一配置备份与全量迁移」专属区块与状态反馈。
  🚀 系统代理 / TUN 运行中热切换（不断连接）
  - 代理运行中改 TUN / 系统代理不再重启内核进程：
    - Mihomo：PATCH /configs 只提交 tun 段差量，内核即时创建 / 删除 Wintun 网卡与路由；
    - VP-Core：重新编译全量配置后 PUT /configs 热重载，内核按 tun.enable 差量同步入站；
    - 其余内核（SingBox / Xray / Shoes / Meow）无运行时 TUN API，自动安全回退整进程重启；
  - 热切换生效后就地更新运行状态（进程未重启、已建立连接不中断）；TUN 状态变化后出口归属自动静默复核一遍。
  ⚙️ 以管理员方式启动 + 开机自启动
  - 以管理员方式启动软件（TUN 模式推荐）：在窗口创建前完成提权决策，UAC 批准后由提权实例直接接管（普通实例不闪窗）；取消 UAC 时本次会话内提示"以普通权限运行"，不再重复弹窗；
  - 开机自动启动：同步 HKCU Run 注册表键（无需提权），每次启动自动对账，软件挪动位置后自动跟进当前 exe 路径；设置开关保存即时生效；
  - 设置页新增两个开关及本次会话提权状态提示。
  🌐 网络抽屉与内核兼容性
  - 系统代理 / TUN 两种接管方式合成单行胶囊分段选择器，与出站模式胶囊同构；
  - Linux 环境自检：GNOME gsettings 全局代理可用性与 CAP_NET_ADMIN 权限就绪状态实时提示（含授权命令指引）；
  - VP-Core 编译器同样注入境内 DoH 污染免疫规则（GEOSITE,google/youtube 置于首条 GEOIP,CN 之前，随内核 geosite.dat 自动下载直接生效）。
  🎨 仪表盘视觉修复
  - 修复上传 / 下载速率卡片：统计按钮与标题行间距过大、波形图被推出卡片裁切显示不全的问题（区块间距全部显式化，波形图按剩余空间自适应填满）；
  - 修复状态卡片右上角状态圆点与内核管理图标贴死、缺少间距的问题。
