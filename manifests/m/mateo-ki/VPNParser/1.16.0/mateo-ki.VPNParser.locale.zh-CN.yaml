ReleaseNotes: |-
  🚀 VProxy v1.16.0 发布说明 / Release Notes
  🎉 欢迎使用 VProxy v1.16.0！本版本是项目发展史上的一次重大里程碑升级：正式确立 VP 家族品牌核心 —— VProxy，完成核心业务逻辑与 GUI 视图彻底解耦（零逆向依赖无头核心库），引入跨平台 C-ABI FFI 导出层与全新无头 CLI 实用子命令体系，并对全平台安装包与数据兼容进行无缝迁移：
  🏷️ 品牌重构：正式升级为 VProxy（VP 家族中枢）
  - 告别单一解析器定位，迈向现代化代理工作台：
    - 项目名称由原本狭义的 vpn-parser 全面更名为 VProxy，深度契合 VP 生态（vp-core 底层内核 + vproxy 枢纽工作台）；
    - 命令行名称、二进制可执行文件统一更新为 vproxy（Windows 对应 vproxy.exe）；
    - 桌面应用标题栏、窗口 ID、关于页与系统托盘同步焕新为 VProxy。
  - 100% 零心智负担的平滑迁移兼容：
    - 运行时与数据层内置向下兼容迁移逻辑：若新安装目录下未找到 vproxy.db，将自动承接历史 vpn-parser.db 与配置目录，老用户直接升级绝不丢失任何订阅源、测速历史或分流规则；
    - 进程互斥与守护清理逻辑同时兼容检测 vproxy.exe 与旧版 vpn-parser.exe，安装包覆盖升级时自动完成平滑接管。
  🧩 架构跃迁：核心层与 GUI 彻底解耦 (Headless Core)
  - 标准无头共享库架构：
    - 新增 src/lib.rs 顶级入口，将订阅解析、节点模型、6 大代理编译器（Mihomo / Sing-box / VP-Core / Meow / Xray / Shoes）、Rhai 脚本引擎、分流路由与进程管理等 24 个模块作为纯 Rust 库标准导出；
    - 斩断全部逆向视图耦合，GUI 模块被严格约束在 feature = "gui" 条件编译下；
    - 完美支持 cargo check --no-default-features 纯无头极速构建，适用于路由器、服务器与容器守护运行。
  🔌 原生跨端：C-ABI 动态/静态库导出 (FFI)
  - 多语言与移动原生环境支持：
    - Cargo.toml 开启 ["rlib", "cdylib", "staticlib"] 复合编译输出，可直接生成 vproxy.dll / libvproxy.so / libvproxy.dylib 与静态归档库；
    - 提供标准 C 头文件 include/vproxy.h，标准化导出版本查询、订阅解析、节点计数、6 大内核配置编译及阻塞 TCP 延迟测速等原生 C 接口；
    - 新增独立 Python ctypes 测试验证脚本 examples/ffi_demo.py，全面打通 Android (JNI)、iOS (Swift/Obj-C)、鸿蒙 (C/NAPI) 与动态语言脚本的跨端调用能力。
  💻 实用命令：全新无头 CLI 子命令体系
  在命令行模式下提供强大便捷的实用子命令，支持标准管道流处理与格式转换：
  - vproxy export（多格式转换与导出）：
    - 支持将订阅链接、本地文件或单行 URI 快速导出转换为指定格式：clash (Clash/Mihomo 代理列表 YAML)、base64 (标准 Base64 订阅文本)、uris (单行链接列表) 以及 json (节点完整属性)；
  - vproxy parse（轻量快捷解析）：
    - 快速解析订阅链接，支持彩色表格或原始 JSON 输出；
  - vproxy compile（一键内核配置编译）：
    - 在无图形界面环境下，将节点配置直接编译为目标内核（Mihomo / Sing-box / VP-Core / Xray / Shoes / Meow）的高性能生产配置；
  - vproxy ping（极速网络连通性探测）：
    - 命令行直接进行 TCP 握手测速。
  🎨 细节体验与分发打包
  - 全局字符串常量收敛架构 (src/constants/)：
    - 采用模块化目录拆分法创建 src/constants/ 体系（brand, network, platform, proxy），消除全模块硬编码魔法字面量，统一重导出；
  - 老版本平滑无缝升级机制 (Dual-Publish Compatibility)：
    - Windows/Linux/macOS CI 流水线引入镜像双发机制，在产出 vproxy-* 资产的同时自动镜像发布 vpn-parser-* 兼容资产与双份 SHA-256 哈希，保障老版本客户端检查更新零 404；
    - Inno Setup 安装向导自动终止旧进程树与常驻内核，精准寻址历史目录全量平迁 data/ 资产并接管注册表开机自启；
    - Linux deb 与 rpm 元数据引入 replaces/conflicts 与 obsoletes 规范，实现包管理器原生平替老版本；
  - 仪表盘对称美学：
    - 微调仪表盘「链式代理」卡片高度增加 7px（88px → 95px），使其与相邻的「分流规则」及「系统服务」卡片高度完美对齐；
  - 全平台安装包升级：
    - Windows Inno Setup 安装包、便携绿色版 Zip、Linux deb/rpm/AppImage、macOS Universal DMG 及 Scoop 清单同步迁移至 vproxy 标准。
