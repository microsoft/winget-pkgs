PackageIdentifier: mateo-ki.VPNParser
PackageVersion: 1.13.0
PackageLocale: zh-CN
ShortDescription: Windows 桌面程序：采集订阅、解析成节点、跑代理，并把代理质量实测出来。
Description: VPN Parser 是用 Rust + egui 编写的 Windows 桌面程序，负责采集免费或自建订阅、解析成节点、跑代理，并把代理质量实测出来。订阅入口包括带 `YYYY-MM-DD` 日期占位符的订阅 URL、Gist 搜索页发现，以及 Telegram 频道预览（裸节点链接和订阅链接两类都取，节点只增不删）。解析支持 `ss` `vmess` `vless` `trojan` `hysteria2/hy2` `socks5` `http(s)` 分享链接，以及 Clash / Clash Meta YAML、Base64 与混合文本。延迟以经内核访问 Google `generate_204` 的真实握手为准，24 小时出口健康条按实测绘制，而不是看内核上报的状态。Windows 上它同时管理系统代理、TUN（提权交接后只保留一个实例）和终端 `HTTP_PROXY` 环境变量，按 exe 路径添加防火墙允许规则，支持单实例互斥与托盘，记录出口切换历史并按天统计规则命中，同时提供强制 bearer 鉴权的本地 HTTP API 与 mihomo / sing-box / xray 配置导出。安装包不含内核，内核缺失时由程序按需下载。
Tags:
- clash
- sing-box
- 代理
- 出口健康
- 测速
- 节点解析
- 订阅
ReleaseNotes: |-
  🚀 VPN Parser v1.13.0 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.13.0！本版深度重构并增强了节点测速管线与批测容错隔离机制，提供测速任务随时中断控制，彻底移除伪下载测速，并大幅提升 Windows 与跨平台运行稳定性：
  ✨ 新特性与测速管线重构
  - 测速任务随时中断控制（CancellationToken）：
    - 测速运行期间，状态栏/操作栏的“全部测速”按钮实时切换为高亮醒目的红色“停止测速”按钮；
    - 点击“停止测速”即可在任意阶段（DNS 解析、TCP 预筛选、多内核真实代理握手）安全中断任务并回收子进程资源，杜绝测速卡住无法停止；
  - 批次二分隔离回退机制（Binary Split Fallback）：
    - 为 Sing-box、Xray 与 Shoes 内核全面引入自适应批次二分隔离回退；
    - 批次中任意单一节点配置损坏或解析失败时，系统自动对半拆分二分探测，精准隔离坏节点，彻底杜绝坏节点株连导致整批 64 个正常节点被误判失败；
  - Sing-box WireGuard 批测规则修正：
    - 解决 endpoints 与 outbounds 标签不匹配导致的 Sing-box 启动校验失败，确保出站标签在路由规则中严格对应；
  - DNS 投毒与污染容错：
    - 识别国内常见的 GFW 投毒保留 IP 与 Bogon 假地址，被污染的节点域名在 TCP 预筛选阶段不再被误杀淘汰，自动放行进入内核阶段交由远程 DoH 权威解析救活；
  - 修正与默认关闭 dedup_egress（同落地物理剪枝）：
    - 默认关闭物理落地剪枝以确保所有节点均能正常测速；
    - 手动开启时采用 IP:Port:Protocol:SNI:Path:Credential 综合特征聚类，彻底消除 Anycast CDN（如 Cloudflare 共享 IP）或中转节点被错误合并误判的隐患；
  - 彻底移除裸 HTTP 伪下载测速并精简预筛管线：
    - 彻底删除了原先通过裸 TCP 向专有代理端口发送明文 GET / 的伪测速模块与噪音流量，TCP 预筛专注高效地负责网络连通性与握手延迟初筛；
    - 界面移除误导性的假下载测速选项，避免混淆认知。
  🛠️ 稳定性与系统级自愈
  - 关机与异常退出自愈系统代理（SetConsoleCtrlHandler）：
    - 注册 Windows 控制台控制处理程序，在接收到系统注销、关机、关闭窗口等事件时，原子化触发直连重置注册表，彻底杜绝异常关机导致下次开机断网；
  - 多内核 YAML Override 分流规则转译：
    - 自定义 YAML 分流规则（Override Rules）全面打通多内核转译适配；
  - WSL2 (Ubuntu Linux) 跨平台测试环境深度兼容：
    - 优化单元测试端口监听策略，完美适配 WSL2 NAT 模式下的回环网络转发，Linux 与 Windows 全量 439+ 项测试均 100% 绿色通过。

  🚀 VPN Parser v1.12.0 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.12.0！本版正式集成 Meow 内核（Mihomo 的 Rust 高性能重写），支持 TUN 模式网卡自动化、本地文件订阅源、共享连接池及万级探针性能优化：
  ✨ 新特性与内核集成
  - 集成 Meow 内核：新增集成高性能 Rust 代理内核 Meow（支持 Shadowsocks/VMess/Trojan/VLESS），内存占用仅 ~28MB，速度与稳定性兼备；
  - Meow TUN 虚拟网卡模式：打通 Meow 的 TUN 模式，提权 runner 自动配置 Wintun 网卡 DNS 指向 198.18.0.2（fake-ip 网段），退出时自动还原 DHCP；
  - 本地文件订阅源支持：订阅源支持读取本地文件路径（file://... 或普通绝对/相对路径），并在新建源弹窗中明确说明与引导；
  - 工作模式动态切换：在代理运行中点击状态栏「TUN」或「系统代理」开关，自动保存配置并平滑重启代理生效；
  - 五内核基准测试：万级节点并发探针对比测试就绪，覆盖 Mihomo / Sing-box / Xray / Shoes / Meow 五大内核；
  - 网络资源优化：核心轮询与存活检查接入共享 HTTP Client 连接池，避免频繁创建连接导致系统句柄耗尽。
  🛠️ 体验与稳定性优化
  - 内核选择下拉菜单优化：放宽下拉宽度并将高度上限提升至 330px，完整展示 6 个内核选项，避免“自动选择”被卷出可视区；
  - WebRTC 防护与工作模式状态联动：修复 TUN 模式下状态联动展示。

  🚀 VPN Parser v1.11.1 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.11.1！本版修复部分订阅在 Shoes 内核下无法启动的问题：
  🛠️ 缺陷修复
  - Shoes 因 GEOIP,LAN 类别不存在而拒启（DAT category "LAN" not found）：
    - 订阅里常见的 GEOIP,LAN,DIRECT / GEOSITE,LAN,DIRECT 写法，在 Loyalsoldier geo 库里
      对应类别叫 private，直传会让 Shoes 拒绝整个配置、代理起不来；
    - 现在编译配置时自动映射 LAN → private（mihomo / Shoes 两个编译器都接入），语义不变；
    - 新增类别存在性防护：编译前直扫 dat 库（大小写不敏感，与内核判定一致），
      库里确实没有的类别对应规则自动丢弃——该规则本来也匹配不上，不再拖垮整个代理；
    - geo 分流库的就绪检查从"仅 Mihomo"扩展到全部内核，Shoes 首次启动也会自动补库。
  - 连接表规则徽标修正：Shoes 返回的标量规则带 JSON 引号（如 "0.0.0.0/0"），
    兜底规则此前显示成 IP-CIDR("0.0.0.0/0")，已正确显示为 MATCH。

  🚀 VPN Parser v1.11.0 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.11.0！本版正式集成 Shoes 多协议代理内核（仪表盘可直接切换），并修复其分流规则编译中的严重缺陷：
  ✨ 新功能
  - 运行内核下拉选择：仪表盘状态卡"协议"右侧新增内核选择器（自动选择 / Mihomo / Shoes / Sing-box / Xray），支持运行中热切换并持久化保存；
  - Shoes 内核完整集成：订阅节点编译为 Shoes 配置（VLESS/VMess/Trojan/Shadowsocks/AnyTLS/Reality），支持下载更新、批量测速与 Clash API 流量统计。
  🛠️ 关键缺陷修复
  - Shoes 误拦全部 HTTPS（ERR_EMPTY_RESPONSE 根因）：
    - QUIC 拦截规则此前被译成裸 destination_port: 443，而 Shoes 规则无 TCP/UDP 维度，导致所有未命中前置域名规则的普通 HTTPS 网站被静默拦截；现按语义整体跳过；
    - 多谓词规则（如 STUN 端口列表 + 端口段）拆分为多条平铺规则，规避 Shoes any: + no_resolve 组合缺陷；
    - VLESS Reality 节点识别增强：兼容 reality-opts 内嵌公钥写法与空 pbk 字段（不再把普通 TLS 误判为 Reality）；
    - WebSocket + TLS 节点自动兜底 alpn_protocols: ["http/1.1"]，规避 CDN 边缘 HTTP/2 协商破坏 WS 握手；
    - 局域网直连规则补齐 no_resolve，防止境内 DNS 污染抢先解析境外域名。
  - 策略组切换防护：Shoes 仅暴露 PROXY 主策略组，切换其它子组前先校验组是否真实存在，不再触发内核 404 报错；启动代理后的待应用调度选择延迟到内核上报组列表后再执行。
  🎨 界面优化
  - 连接分流规则徽标归一化：Shoes 返回的原始规则 JSON（local-mixed (root): {...}）提炼为与 Mihomo 一致的标准徽标（GEOSITE(cn)、DOMAIN-SUFFIX(...)、MATCH 等），目标列直接显示 PROXY / DIRECT；
  - 节点质量分档校准：质度徽标与延迟着色按隧道实测场景放宽为 优≤300ms / 良≤800ms / 差>800ms，全库延迟频谱条同步调整为 200/500/1000 分档，不再把可用节点一律判成"质度差"。

  🚀 VPN Parser v1.10.1 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.10.1！本版主要修复 TUN 模式启动体验与仪表盘状态卡出口归属检测的稳定性：
  🛠️ 缺陷修复与体验优化
  - TUN 模式启动体验修复：
    - 修复代理启动及 TUN 提权启动瞬间会错误弹出“IP 检测”对话框的问题；
    - 移除状态切换过程中的非必要弹窗调用，保证无感纯净启动。
  - 仪表盘出口画像（机房/住宅）稳定性增强：
    - 接入 egress_risk_view 综合画像视图，支持“检测中”过渡状态以及服务器节点归属兜底呈现；
    - 出口 IP 探测在代理刚启动建联瞬间若遇内核尚未完成 outbound 握手，增加 1.5 秒自动重试，确保“机房/住宅”与落地组织信息稳定呈现。

  🚀 VPN Parser v1.10.0 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.10.0！这一版带来全新的 Apple 雅致风格仪表盘 (Dashboard v4)、策略组调度抽屉、系统代理与 TUN 模式双开，以及 Windows 便携版免安装打包。

  🌟 本版核心更新
  🖥️ 1. 全新仪表盘 v4 (Apple 雅致设计语言)
  - 视觉风格升级：对齐 Apple macOS 设计规范，采用 14px 优雅圆角卡片、极细微边框 #E3E6EB、低饱和柔和底衬与层次分明的大字排版。
  - 现代化布局：
    - 第 1 行（核心态势）：状态大卡（带拟物启停大圆按钮、动态运行时长、出口 ASN/ISP 归属、协议胶囊、真实机房/住宅质量检测、IPv4/IPv6 探测）与上传/下载速率卡（实时流速、峰值监控、累计流量与平滑折线波形）。
    - 第 2 行（服务与策略）：
      - 服务连通性：真实并行异步探测 Google、ChatGPT、GitHub、YouTube 连通状态与延迟，带服务专属图标，点击可直接打开对应网站；
      - 分流规则：实时呈现广告拦截、国内直连、流媒体解锁与兜底规则的命中统计；
      - 出站模式：规则模式、全局代理、直接连接三段式胶囊切换；
      - 策略组：展示核心策略组当前激活节点及其延迟。
    - 第 3 行（底部控制台）：终端代理（支持一键复制命令）、端口代理（混合端口）、局域网代理（自动探测并展示本机真实局域网 IP）、系统代理、TUN 模式五卡水平对齐控制。
  🗂️ 2. 策略组调度抽屉 (Policy Group Drawer)
  - 点击策略组卡片即刻滑出占半屏宽度的调度抽屉，支持 4 种调度方式切换：延迟选优、故障转移、负载均衡、手动指定。
  - 手动指定模式直接调用完整可用节点池，支持双列瀑布流、国旗代码徽标、国家/地区快捷筛选与关键词检索。
  - 支持在代理未启动状态下预选目标节点，启动时直接以该节点生效。
  ⚡ 3. 系统代理 + TUN 模式双开
  - 支持系统代理 (L7) 与 TUN 模式 (L3) 同时启用，两者具备独立开关状态。
  - Windows 下双开模式自动接入管理员权限 UAC 提权流程，确保驱动与网络接管平滑执行。
  📊 4. 恢复独立「活跃连接」审计标签页
  - 独立展示「连接列表 / 进程带宽 / DNS 记录」三项详细表格，优化过滤与搜索体验，去除冗余操作列。
  🔍 5. 默认显示与界面优化
  - 界面默认字体缩放调整为 120%，文字清晰易读。
  - 窗口默认尺寸规范为 1280 × 800（中屏），精简冗余尺寸配置选项。
  📦 6. GitHub Actions 增加 Windows 便携版打包
  - 持续集成发布脚本整合为 windows.yml。
  - 发布时自动打包输出 vpn-parser-v1.10.0-windows-x64-portable.zip 免安装便携版，配合安装包双通道分发。

  📐 验证与测试
  - 测试用例：全量单元测试 418 passed / 0 failed（9 ignored）。
  - 打包验证：安装包（Inno Setup）与便携版 ZIP 压缩流程均通过校验，生成完整 SHA-256 校验清单。
