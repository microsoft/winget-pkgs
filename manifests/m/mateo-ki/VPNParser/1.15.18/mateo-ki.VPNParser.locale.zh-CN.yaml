ReleaseNotes: |-
  🚀 VPN Parser v1.15.18 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.15.18！本版重点强化了网络测速弹框的直连与代理状态感知，并全面打通系统代理与 TUN 模式图标一键直达网络设置抽屉：
  ⚡ 网络测速：新增测速模式指示与动态指引
  - 智能模式透出：在网络测速弹框的「路由规则」下方增设「测速模式」状态行，实时识别代理运行状态；
  - 状态感知与着色：
    - 代理测速（代理运行中）：亮起醒目 Apple 蓝（#007AFF），悬浮提示“代理内核运行中：测速数据流经由当前节点代理出站转发”；
    - 直连测速（代理未启动）：呈现警示琥珀金（#F59E0B），悬浮提示“代理内核未启动：测速数据流由本机网络直接连接测速服务器”；
  - 大表盘测速按钮协同提示：左侧圆弧测速主表盘下方的「开始节点测速」大按钮同步动态透出当前走的是代理中继转发还是本机直连，消除用户认知模糊。
  ⚙️ 控制台底栏：系统代理与 TUN 模式图标一键直达网络抽屉
  - 图标点击联动：控制台底栏「系统代理」（盾牌图标）与「TUN 模式」（火箭图标）全面支持点击直接滑出右侧「网络设置」抽屉（DNS 协议与 TUN 虚拟网卡配置）；
  - 悬停质感与手势增强：鼠标悬停在卡片左侧图标区域时，图标圆角底色加深高亮并带有优雅强调色描边，光标切换为手形指针，并提示“点击打开网络设置抽屉（DNS 协议与 TUN 虚拟网卡配置）”；
  - 独立开关防误触：右侧启停开关与左侧图标事件物理隔离，保障高频开关代理时零误触。
