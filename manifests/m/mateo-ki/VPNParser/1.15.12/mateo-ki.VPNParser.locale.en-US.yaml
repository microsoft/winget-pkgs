ShortDescription: Windows proxy client that collects subscriptions, parses nodes, runs a proxy kernel and measures real exit quality.
Description: VPN Parser is a Windows desktop application written in Rust and egui that collects free or self-hosted subscriptions, parses them into nodes, runs traffic through a proxy kernel, and measures the quality of that traffic. Sources can be ordinary subscription URLs with a `YYYY-MM-DD` placeholder, Gist search results, or Telegram channel previews. Parsed share links cover `ss`, `vmess`, `vless`, `trojan`, `hysteria2`/`hy2`, `socks5` and authenticated `http(s)`, plus Clash and Clash Meta YAML, Base64 and mixed plain text. Latency comes from a real handshake through the kernel against Google `generate_204`, and the 24-hour exit health bar is drawn from measured results rather than the reported kernel state. On Windows it manages the system proxy, TUN mode with an elevation hand-off, and terminal `HTTP_PROXY` variables, adds per-executable firewall allow rules, keeps a single instance, records failover history, counts rule hits per day, and offers a bearer-authenticated local HTTP API together with mihomo, sing-box and xray configuration export. Proxy kernels are not bundled; the application downloads them when they are missing.
