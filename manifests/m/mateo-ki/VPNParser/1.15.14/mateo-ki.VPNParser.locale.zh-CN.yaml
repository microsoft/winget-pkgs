ReleaseNotes: |-
  🚀 VPN Parser v1.15.14 发布说明 / Release Notes
  🎉 欢迎使用 VPN Parser v1.15.14！本版正式将“未分组”全面升级重命名为“导入节点”，数据库既有数据自动平滑迁移，并联动更新所有筛选、编辑与清空交互：
  🏷️ 全面重命名为「导入节点」
  - 清晰规范命名：本地单节点与剪贴板导入节点池统一展示为「导入节点」，出处语义更加直观规范。
  - 平滑兼容迁移：数据库初始化与版本升级时自动将历史默认名称“未分组”无损迁移为“导入节点”，若用户已自定义修改名称则完全予以尊重保留。
  - 下拉筛选与检索支持：节点池订阅源下拉菜单首位展示「导入节点」，搜索框智能支持“导入节点”、“未分组”、“自建”、“剪贴板”多关键字匹配。
  - 右键维护与表单联动：右键菜单专属操作升级为「🗑️ 清空导入节点」，弹窗标题同步调整为「编辑导入节点 / 本地节点池」。
