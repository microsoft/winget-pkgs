ShortDescription: Send files between your PCs and phones directly, with no cloud in the middle.
Description: |-
  NetShare moves files between Windows PCs and phones on the same Wi-Fi or cable network, with no internet needed.
  PCs find each other automatically, and phones connect by scanning a QR code in the browser, with no app to install.
  Received files are checked so you know they arrived intact. Chat, clipboard sharing and short-lived share links are included.
  Pro adds Online rooms to send files to a PC anywhere over the internet, Cloud Drop for recipients who are offline
  (files delete themselves within minutes), and no file-size limit. Every install starts with a 14-day trial of all features;
  after that, nearby sharing stays free for files up to 100 MB.
  NetShare Pro (US$5 a month or US$48 a year, per PC) is bought inside the app under Settings > License > Subscribe,
  through Paddle. NetShare activates itself within a minute of payment, with no key to copy.
