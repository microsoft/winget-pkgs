ReleaseNotes: |-
  MediaInfoLib source code has been audited by several security researchers and private individuals.
  Thank you to Yazan Balawneh (CyStack), Feng Ning (Innora), TristanInSec, Gareth Davidson (bitplane),
  Stanley Tang, Brandon Barrante, Erik White, Miklos Juhasz, iliasabk, buzz, mega-wli, cjee21,
  and many others for their reports and/or patches.
  + Update of Turkish translation, thanks to umablognot
  + Update of Czech translation, thanks to Michal Várady
  + Update of Portuguese (Brazil) translation, thanks to Fúlvio Alves
  + Update of Russian translation, thanks to  solokot
  + Windows GUI: Fix missing translation for some UI elements
  + macOS GUI: Add close button in Compare view's header
  + Android GUI: avoid to ask for geolocation data access many times
  + Android GUI: fix of a couple of crashes while migrating from Rx Java to Kotlin Coroutines, thanks to cjee21
  + Conformance checker: update with more precise error messages, sponsored by Austrian Mediatek
  + Conformance checker: tolerate common padding patterns found in some files, sponsored by Austrian Mediatek
  + MXF: cross-check header and footer values for timecode tracks, prioritizing the footer value
  + MXF: support more ARRI camera metadata, thanks to Luis Gómez Gutiérrez
  + Global performance improvement when analyzing files with uncommon file extensions or junk files
  + HEVC: support interlaced content, thanks to Torbjörn Einarsson
  + HEVC: detect CBR and report nominal bitrate
  + AV2: support v1.0.0 streams, thanks to cjee21
  + MP3: support gapless files, thanks to hat3k
  + MOV/MP4: support Auro CS layout information, thanks to almirus
  + DTS:X: support supplemental channel layout, thanks to almirus
  + EIA-608/708: report maximum number of characters per line
  + TTML: report maximum number of characters per line
  + MOV: support chpl version 0
  + ELF: support RISC-V
  + GIF: support XMP and loop count, thanks to cjee21
  + GIF: support animated GIFs
  + I2632, ApeTag: handle cover images, thanks to cjee21
  x I2690, TAR: improve parsing of the TAR header to avoid more false positives
  x I2706, MPEG-TS: fix infinite loop with some partial packets at the end of the file
  x I2670, DVD-Video: preserve IFO stream languages after VOB merge, thanks to wastaken7
  x I2589: fix MediaInfoList_Open file options not being used with the DLL API
  x MXF: fix failure to detect sparse content in Teletext or OP47, thanks to MaxEliaserAWS
  x DTS: move DTS:X objects to their own field, matching Dolby Atmos
  x Opus: fix 5.0 support and center-channel ordering, thanks to Puella Purpura
  x MP3: detect headerless VBR after parsing finishes, thanks to Bernard Wiesner
  x MP3: fix reconstructed settings for LAME CBR 256 and 320 kbps, thanks to hat3k
  x MP3: clean up some LAME version values
  x MOV: fix mapping for Apple language tags >= 95
