ShortDescription: A media player for Windows powered by VLC, with synced lyrics, an equalizer, playlists and internet radio.
Description: |-
  OrkaPlayer plays audio and video through the VLC engine, so there are no codec
  packs to hunt down. Song lyrics scroll in time with the music, karaoke style,
  found online or read from a .lrc file. It has a ten band equalizer, playlists in
  tabs with search and sorting, internet radio, audio CDs, an A-B loop, a sleep
  timer that fades out, and an oscilloscope drawn from the audio itself.
