ShortDescription: Turns an existing app repository and UI snapshots into scene-by-scene prompts and reference images ready to paste into video-generation AIs.
Description: AppPromoVideo is a desktop tool for making promotional videos of your own software with video-generation AIs. Point it at an app repository and a few UI screenshots, and it produces a scene-by-scene brief - copy lines, motion and video prompts, and reference images in which the real screenshots are composited onto AI-generated backdrops, so the product UI stays faithful to the original. The output is meant to be pasted directly into an image-to-video service; the tool does not render the video itself. Code analysis is delegated to a locally installed LLM CLI, and reference images can be generated with OpenAI Images, Gemini, or a local ComfyUI.
