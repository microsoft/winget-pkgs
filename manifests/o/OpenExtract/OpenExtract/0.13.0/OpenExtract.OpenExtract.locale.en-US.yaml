ShortDescription: Free, open-source app that gets your text messages, photos and voicemails off your iPhone backup and makes them searchable.
Description: |-
  OpenExtract reads the iPhone and iPad backups that iTunes or the Apple Devices app saves on your computer,
  including encrypted backups when you know the password. Browse, search and export text messages and iMessages,
  photos and videos, voicemails, call history, contacts, notes and Safari history, or see it all on one timeline.
  Everything runs on your computer: nothing is uploaded, no account is needed, and there are no strings attached.
