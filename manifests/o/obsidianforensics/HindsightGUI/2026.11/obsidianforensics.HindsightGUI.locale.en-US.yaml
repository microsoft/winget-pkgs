  • Make the log level selectable instead of always DEBUG by @dchaudhari7177 in https://github.com/RyanDFIR/hindsight/pull/351
  • Say what was not parsed for Firefox extensions by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/404

