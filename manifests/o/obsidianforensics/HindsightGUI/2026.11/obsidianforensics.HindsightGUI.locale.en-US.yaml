ReleaseNotes: |-
  <img alt="hindsight-2026.11-header" src="https://hindsig.ht/content/images/2026/11/hindsight-2026.11-header.png" />


  ### **Read more on the new features at https://hindsig.ht/blog/hindsight-v2026-11-etags-hashes-and-leveldb-recovery**


  ## Upgrading
  • Python 3.11 or newer is now required (was 3.9).
  • `pip install pyhindsight` now works on its own. `ccl_chromium_reader` is bundled, so the separate install step is gone.
  • Relative `-l` and `--temp_dir` paths now resolve from the working directory, and the default log is written there too. The packaged executables still write next to themselves.
  • The log no longer records DEBUG lines by default. The level is now selectable.
  • Timestamps are written with the precision their source has, so precision now varies between artifacts.

  ## What's Changed
  ### 🚀 Features
  • Bundle ccl_chromium_reader so pip install works by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/381
  • Add artifact filtering and test coverage for selectable browser artif… by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/298
  • Decode server file time and size from download and cache ETags by @sujayadkesar in https://github.com/RyanDFIR/hindsight/pull/376
  • Decode more ETag formats and check hashes against sent bytes by @akhil-dara in https://github.com/RyanDFIR/hindsight/pull/380
  • Hash cache bodies and File System backing files by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/316
  • Recover LevelDB records past damage, and report it in every LevelDB parser by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/383
  • Detect the Chrome version from each database's meta table by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/364
  • Separate IndexedDB database from object store, and keep the value structured by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/317
  • Write session windows and tab/window IDs to JSONL and SQLite by @RyanDFIR in https://github.com/RyanDFIR/hindsight/pull/386
