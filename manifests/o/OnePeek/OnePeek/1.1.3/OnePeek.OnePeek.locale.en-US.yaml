ShortDescription: Lightweight offline file viewer for 120+ formats including DWG, DXF, STEP, STL, PSD, CDR, AI, CAJ, DICOM, and Office documents.
Description: |-
  OnePeek is a lightweight, privacy-focused offline file viewer that opens over 120 file formats in a single portable executable without installing multi-gigabyte commercial suites.

  Supported formats:
  - 2D & 3D CAD: DWG, DXF (interactive layer toggles), STEP/STP, IGES/IGS, BREP, STL, 3MF, OBJ, GLB, GLTF, FBX, and PLY with 360-degree orbit, ViewCube snapping, and wireframe mode.
  - Design Proofs: CorelDRAW (CDR, CMX), Adobe Photoshop (PSD, PSB with layer inspection), and Adobe Illustrator (AI).
  - Medical & Academic: DICOM (DCM), NIfTI (NII, NII.GZ), and NRRD volumes with Axial/Coronal/Sagittal slicing, Window/Level presets, and 3D bone volume rendering, plus CNKI CAJ/NH/KDH academic papers.
  - Documents, E-Books & Archives: PDF, DOCX/DOC, XLSX/XLSB/CSV, PPTX/PPT, EPUB, MOBI, AZW3, ZIP/APK/JAR archives, common images, Markdown, and 35+ code formats.

  All parsing and rendering run 100% locally on your device with no cloud uploads, ads, or sign-in required. Images, Markdown, plain text, and source code remain permanently free, while specialty formats include a 7-day full-feature trial followed by an optional one-time lifetime license.
