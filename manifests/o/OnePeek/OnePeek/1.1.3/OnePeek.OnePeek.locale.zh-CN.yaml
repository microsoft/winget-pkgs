ShortDescription: 轻量纯本地万能文件查看器：单文件绿色免装，秒开 DWG/DXF 图纸、STEP/STL 三维模型、PSD/CDR 设计原稿、知网 CAJ、DICOM 医学影像与 Office 等 120+ 格式。
Description: |-
  OnePeek 是一款轻量、注重隐私的离线万能文件查看器，无需安装几十 GB 的商业套件或担心文件上传泄密，单个绿色可执行程序即可本地查看超过 120 种格式。

  支持的核心格式：
  - 二维 / 三维 CAD：DWG、DXF（支持交互式图层开关）、STEP/STP、IGES/IGS、BREP、STL、3MF、OBJ、GLB、GLTF、FBX 与 PLY（360 度旋转、视角方块、线框模式与包围盒尺寸）。
  - 设计与矢量原稿：CorelDRAW（CDR/CMX）、Photoshop（PSD/PSB 分层视图）与 Illustrator（AI）。
  - 医学影像与学术文献：DICOM（DCM）、NIfTI（NII/NII.GZ）与 NRRD 三视图切片及实时 3D 骨骼体渲染；知网 CAJ、NH、KDH、TEB 文献。
  - 文档、电子书与压缩包：PDF、DOCX/DOC、XLSX/XLSB/CSV、PPTX/PPT、EPUB、MOBI、AZW3、ZIP/APK/JAR 免解压直看，以及常用图片、Markdown 与 35+ 代码高亮。

  全部解析与渲染均 100% 在本地完成，零广告、零云端上传、无需登录。常规图片、Markdown 与文本代码永久免费，专业格式提供 7 天全功能免费试用，期满可选一次性买断授权。
