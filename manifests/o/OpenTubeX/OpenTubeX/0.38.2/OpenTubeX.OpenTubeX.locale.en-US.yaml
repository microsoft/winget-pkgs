ReleaseNotes: |-
  Highlights

  - Profiles can now keep their data, their settings, or both separate. With separate data, a profile has its own subscriptions, history, playlists, and queue. With separate settings, changes only apply to it, so a car profile can hide comments and live chat while sharing your subscriptions. (#3291, #3471, #3359, #3509)

  New features

  - Watched comments of yours now also notify you when the video's creator hearts them.
  - Typing @ in a comment or reply suggests people from the comments, and mentions now link to their channels on YouTube, including the one a reply to a reply starts with. (#3275, #3312)
  - Grayscale can now leave downloaded videos in color, while other videos and images turn gray. (#3239, #3280)
  - RSS feed episodes and videos from other sites can now be added to the queue. The queue also shows while they play and moves on to the next item when one ends. (#3310)
  - RSS feeds now handle podcasts. Find shows in the Apple Podcasts directory, import or export your feeds as OPML, and listen to episodes with their title and cover. Feeds now show all their items, not only the latest 50. (#3069, #3426, #3283, #3431)
  - Twitch livestreams now play without Twitch's ads, and also play on iPhone and iPad. (#3204, #3286)
  - A new Twitch page in the navigation lists the most watched categories and live streams and searches Twitch. Category pages list live streams, videos, and clips, which you can filter by language and sort. Twitch searches on the Search page can now find categories too. (#3284, #3438)
  - The bottom navigation bar can now show only the current page's label, besides showing all labels or none. (#3296, #3317)
  - A new Distraction Free option hides the video title in full window and full screen, whether the video plays or is paused. The player menu then opens the video information instead. (#3299, #3317)
  - Subscriptions now also show videos that your channels made together with another channel that uploaded them. You can turn this off in the subscription settings. (#3366)
  - When you're signed in to YouTube, the comment filters can show only the loaded comments and replies written by your channels, along with the comments your replies answer. (#3322)
  - A new UI Density setting makes lists, menus, the side bar, and Settings more compact or more spacious. It replaces Compact Settings Categories. (#3378)
  - Incognito tabs keep the videos you watch and the searches you make out of your history and recommendations, and they are never restored or synced. Open one from the tab bar or from a video's menu. (#3323, #3325)
  - When you're signed in to YouTube, you can comment on posts and reply to and rate their comments, vote in polls and see the results, answer quizzes, and like or dislike posts. (#3414)
  - Right-clicking or long-pressing a channel name or avatar now lets you subscribe to or unsubscribe from the channel. (#3339, #3354)
  - A new setting under Appearance lets you click the icon of a tab with a playing or paused video to pause or resume it without switching to that tab. (#3327, #3330)
  - You can now pick subscription feeds, such as videos and live streams, that refresh together when you refresh one of them. (#3328, #3333)
  - The player menu can now mirror the video, which makes dance, workout, and instrument tutorials easier to follow. Turn on Mirror Video under Player Controls in the Player Settings to add it. (#3432, #3435, #3529)
  - A new Distraction Free setting hides the reason and the feedback buttons under each video in Recommended for you on Home. (#3447, #3450)
  - Hovering the taskbar button now shows Previous, Rewind 10 seconds, Play/Pause, Forward 10 seconds, and Next buttons for the video playing in that window. (#3428, #3309)
  - You can hide the refresh errors of a subscribed channel, for example one that was terminated but might come back. It still refreshes, and its errors can be shown again in its subscription settings. (#3337, #3482)
  - A new Distraction Free setting hides videos you have already watched from search results and recommendations, and autoplay skips them. (#3473, #3480)
  - Choose the order of the tabs on the Subscriptions page, for example to put the New feed first, in Customize interface. (#3338, #3483)
  - The player menu can now rotate videos that were recorded sideways or upside down. Turn on Rotate Video under Player Controls in the Player Settings to add it. (#3452, #3484, #3529)
  - Playlist downloads can skip videos: uncheck them under Videos in the download dialog. (#3345, #3486)
  - Comments can be sorted by Timed, which shows comments about a moment in the video as playback reaches it. (#3498)
  - Press and hold Subscriptions in the navigation to refresh your subscription feed in the background without leaving the current page. (#2961, #3506)
  - Signing up for sync now gives you a random 12-word recovery phrase as your privacy passphrase and asks you to confirm a few of its words, so your encrypted sync data is protected by a passphrase nobody can guess. You can still choose your own passphrase with Use custom passphrase instead. (#2911, #3547, #3563)
  - You can now pick an app icon from the same palettes as the tray icon. On Windows, it also changes pinned taskbar shortcuts and your own Start menu and desktop shortcuts. (#3511, #3517)
  - The Download entry in the menus of videos and playlists now lists your download templates to start a download right away. Customize… opens the download dialog. (#3568)
  - Video descriptions, channel descriptions, and community posts in other languages can now be translated, like comments. The new Translation section in General settings turns translations on or off for comments, descriptions, and posts separately. (#3584, #3588)

  Improvements

  - The player's options menu responds faster when you open it, move between its views, and close it, especially on slower devices or while the app is busy. (#3247, #3252)
  - The Channels page now also lists the channels you follow on other platforms, which moved there from the subscription settings, with a selector that can show every platform together. Pasting a channel's address into its search field follows the channel. (#3351, #3253, #3355)
  - Your YouTube sign-in, sync server credentials, and proxy, Yattee, and Invidious passwords are now encrypted with your system's keychain when one is available, and Invidious instances get username and password fields. On another device or an older version, you enter them again. (#3251, #3278)
  - Live streams with live captions, such as news channels, now also play in up to 4K with the built-in engine, and can be rewound with their captions. (#3252)
  - The app no longer downloads spellchecker dictionaries from Google. Text fields no longer underline misspelled words. (#3282)
  - When Rumble asks you to verify that you're human, for example while you use a VPN, you can now do that in the app instead of getting an error. (#3208, #3285)
  - Like in browsers, "Open in a New Tab" now opens the tab in the background, so you can queue up several videos without leaving the current page. (#3245, #3279)
  - Opening a video no longer changes your watch history. It joins the history once it has played for a few seconds or you seek in it, so checking back on the comments leaves your history and saved position as they were. (#3321)
  - The player's pop-ups for volume, speed, seeking, and zoom have a new look, and volume and brightness changes now show a level bar. (#3349)
  - With the local API, links in video descriptions now show the video title, channel handle, or profile name after an icon instead of the full URL. Descriptions also list the people mentioned and the podcast a video belongs to. (#3344)
  - Settings has a new look, with colored icons for categories and sections and a shorter category list without descriptions. (#3361, #3364, #3369, #3381)
  - The Stats page has a new design. The summary cards are neutral with an icon each, the daily chart is a smooth curve that marks today, and the weekly bars are rounded and highlight the current week. (#3353)
  - The fullscreen side panels now use your theme's colors instead of a fixed palette. With a light theme, they stay dark so they remain readable over the video. They animate again when you open, close or rearrange them, and resize more smoothly. (#3346, #3394)
  - Notifications now open their video, post, or stream in a new tab, so the page you were on stays open. (#3329)
  - The mini player's buttons have a new look, the play button changes shape between playing and paused, and all buttons fade out together during playback. (#3382, #3442)
  - The Zoom, Volume Boost, and Sleep Timer menus now have a slider like the playback speed menu, so you can pick values between the presets, including sleep timers of up to two hours. (#3370, #3406)
  - Full Width view no longer stretches each video across the whole window on larger screens, and Thumbnail Size now changes how wide the videos get. (#3391)
  - The notification center now also keeps finished and failed downloads, available updates, failed tool updates, blocked syncs, and YouTube sign-outs and subscription changes, so they stay around after their pop-up is gone. (#3379)
  - New upload notifications skip videos that are already in your watch history, including ones you watched on another device. (#3409)
  - Managing automatic downloads now opens right away with many subscriptions, and loads more channels as you scroll. (#3363)
  - Video and channel links you paste into the search bar now appear in your search history with the video title or channel name, and typing part of that name finds them again. (#3292, #3335)
  - Create a subscription group straight from a channel's subscription settings, with that channel already in it. (#3357)
  - Pinned channels and playlists can be dragged into a new order in the side navigation, or by their grips in the More menu on phones. Pinned playlists keep that order instead of following the Playlists page. (#3453, #3463)
