ReleaseNotes: |-
  More improvements

  - Choose from 16 new themes, including Tokyo Night, Rosé Pine, Kanagawa, Ayu, One Dark, Carbonfox, and Catppuccin Macchiato with 14 selectable accent colors. (#1220)
  - Smoother scrolling and mini-player dragging/resizing with Android native playback, plus larger touch resize targets that keep the initial grab position. (#1282)
  - Choose from 30 theme-inspired Android app icons under Appearance → App icon. (#1285)
  - Added an option to keep videos playing in the mini-player when navigating away or switching tabs on desktop and Android. (#1295, #1299)
  - Hide the startup splash and curtain reveal with a new switch in Distraction Free settings. (#1268, #1274)
  - Add a startup option to open your landing page while keeping previous tabs unloaded in the background. (#1283)
  - Geist is the new default app font. Roboto remains available in Theme settings. (#1272)
  - Phone menus and forms now offer larger touch controls, searchable pickers, and draggable watch panels, with player options that fit inside the video. (#1296, #1307)
  - Sync per-channel subscription feed types, daily video limits, and members-only visibility across devices. (#1310, #1328)
  - Mark subscription videos as unseen from their context menu while keeping playback progress. (#1314, #1322)
  - Select whole tab groups, choose their icons, and close the Tab Organizer by pressing its shortcut again. (#1326)
  - The mobile bottom navigation now hides when scrolling down and reappears when scrolling up. (#1313, #1329)
  - Swipe down on the Android video player to keep watching in the mini player while browsing, then swipe up to return. (#1312, #1336)
  - Keep Android mini-player controls visible while scrolling, and share links through native macOS and Windows menus. (#1332, #1333)
  - Videos now keep playing in the mini player when you navigate away by default. (#1334)
  - Follow your Android phone’s Material You palette with the new Dynamic colors theme. (#1298, #1340)
  - Repeated fast-forward and rewind presses now show the accumulated seek amount in the on-screen indicator. (#1351, #1352)
  - Keep subscription feeds refreshed while desktop windows are closed, and use your selected backend settings for Android background refreshes. (#1359)
  - Try six additional bundled fonts with live font-name previews and a grouped font picker. (#1358)
  - Larger touch targets for search results and settings categories, with more space between settings header buttons. (#1341, #1355)
  - Add an optional Lights Off player toggle that dims the app around your video and remembers its state in each tab. (#1364)
  - Customize how long the interface stays visible during fullscreen playback in Distraction Free settings, with consistent spacing between slider values and their units. (#1363)
  - Removed the three-dot menu on video cards and unified it into the right-click context menu. You can get it back by enabling “Show video menu button” in Appearance settings. (#1360, #1361)
  - Repair missing history metadata and incorrect live badges with the new Repair History button. (#1383)
  - Control playback from the tray, toggle the window with a click, and choose whether minimizing or closing sends it to the tray, including minimizing on KDE Wayland. (#1380)
  - Mark videos as fully seen to fill their watch progress, from the video menu or a configurable thumbnail action. (#1378)
  - Read YouTube’s AI video summaries below the description, or hide them in Distraction Free settings. (#1384)
  - Reopen recently closed windows with Ctrl+Shift+N. You can change the shortcut in Settings. (#1379)
  - Select mobile tabs with checkboxes to close them together, or close tabs before, after, or other than the current tab. (#1419)
  - Remove saved channel settings directly from the watch page or quick playback speed bar. (#1409, #1417)
  - Lights off and end-of-video recommendations now fade smoothly into view, with a fade out when lights off is disabled. (#1412, #1416)
  - The app header's sync indicator can now be hidden from Distraction Free settings, and its visible animation is smaller and slower. (#1457)
  - Copy the current video, channel, playlist, hashtag, or post URL with Ctrl+Shift+C, or Cmd+Shift+C on macOS. (#1418)
  - Improved Android playback and browsing performance, with lower memory use in long feeds and more responsive download controls. (#1464)

  Fixed bugs

  - Connection warnings now follow device connectivity, and subscription failures appear in one compact summary with copyable details for every affected channel. (#1276)
  - Open downloaded files on Android without a false “file could not be found” error, and fix retrying, pausing, cancelling, and removing downloads. (#1270)
  - Premiere titles and metadata now use the same theme colors as other videos. (#1277)
  - Fixed chapter centering after copying a timestamp, using the keyboard, or selecting a chapter. (#1271)
  - Fixed replaying finished videos on Android, with a replay button below recommendations or in the center when recommendations are hidden. (#1280)
  - Play downloaded videos and audio without an internet connection, including on Android. (#1266, #1275)
  - Fixed incorrect publication dates on videos after their premieres finish. (#1281)
  - Fix Shorts subscription refreshes for channels whose automatic YouTube Shorts playlist is unavailable. (#1289)
  - Channel pictures and video and playlist card thumbnails now retry failed loads automatically. (#1287)
  - Detect offline connections more reliably, avoid offline startup errors, and keep a full-width connection banner clear of notifications. Internet connectivity checks can be disabled in Privacy settings. (#1291)
  - Fixed a square hole appearing in the Android mini-player when scrolling during a playback backoff countdown. (#1300)
  - Prevent audio/video desynchronisation when YouTube serves mismatched edits across video formats. (#1263, #1269)
  - Keep background videos scheduled to load after restarting the app while the selected video is still loading. (#1290)
  - Fixed thumbnail progress showing 100% for partially played videos marked as watched, including when Watch Percentage Threshold is set to 0%. (#1294, #1297)
  - Improved security by restoring browser origin protections and isolating YouTube player-script execution. (#1273)
  - Keep the connection banner at the bottom when mobile settings or sheets cover the navigation bar. (#1305)
  - Show the timeout indicator on failed-channel notifications after subscription refreshes finish. (#1306)
  - Keep the comments loading spinner visible when scrolling to load more comments on desktop. (#1339)
  - Hovering a comment reply connector now highlights its connected thread, and only the top-level thread shows a hide-replies button. (#1320)
  - Scrollbars in mobile dialogs and menus stay in place during swipes. (#1317, #1335)
  - Fixed toast notifications being hidden or misplaced during fullscreen video playback on Android. (#1324)
  - Downloaded videos and audio no longer show an offline warning while seeking, and sync waits for connectivity instead of timing out while offline. (#1344)
  - Keep Android video centered and aligned during scrolling, and move the global progress bar with the hiding bottom navigation. (#1350)
  - Remove the redundant OpenTubeX suffix from other-device tab titles in the phone tab switcher. (#1316, #1321)
  - Fixed Android seekbar thumbnail previews appearing behind the playback controls. (#1338)
  - Subscription refreshes on Android now continue after dismissing the app from recent apps. (#1330)
  - Fixed overflowing mobile context menus and cramped channel lists. (#1353)
  - Reduced stuttering while subscription feeds refresh with synced seen-video marks. (#1342, #1354)
  - Restore missing channel names and links in subscription Shorts feeds after refreshing. (#1356)
  - Fixed Android subscription refreshes freezing after the app is dismissed from recent apps. (#1357)
  - Fixed videos failing to load or showing missing metadata when YouTube omits parts of its response. (#1366)
  - Fixed chat replay messages disappearing when playback updates are delayed. (#1367)
  - Handle newer YouTube description, loading, interstitial, and comment responses without parser errors. (#1343)
  - Reduce lag when live chat replay delivers many messages at once. (#1373)
  - Stopped newly synced videos with unknown durations from being labeled LIVE and preserved known video durations during history sync. (#1372)
  - Fixed Electron listener warnings when many video tabs are open. (#1374)
  - Prevent playback token generation from corrupting special characters in YouTube configuration values. (#1371)
  - Android videos now return to fullscreen after player reloads, including SABR recovery. (#1377)
  - Fixed live chat failures and repeated parser warnings caused by newer YouTube response formats. (#1381)
  - Fixed mobile layouts and scrollbar bounds, custom-theme deletion and preview zoom, playlist menus, channel tab avatars, toast wrapping, player touch targets, and Android fullscreen playback. (#1376, #1382)
  - Fixed wrapping, overflow, and excessive spacing in mobile settings and search results. (#1387)
  - Up Next recommendations no longer appear empty briefly after the loading placeholders disappear. (#1415)
  - Keep the disconnected indicator clear of vertical tabs. (#1408)
  - Improve mobile playback transitions and touch controls, and support saved YouTube sessions for more reliable Android downloads. (#1375, #1390, #1393, #1394, #1395, #1396, #1403, #1404, #1405, #1406, #1422)
  - Fixed descriptions with video tags, games, or license information expanding automatically without More/Less controls. (#1411)
  - Downloads now show preparation and processing phases instead of appearing stuck at a percentage. Clearing download history preserves queued and paused downloads. (#1424, #1425)
  - Keep the subscription cache compact during long desktop sessions to prevent slow startup after an interrupted shutdown. (#1427)
  - Fixed Android search overlays, offline channel settings and return from background playback, with clearer queue previews, wrapping summary text and notification categories. (#1458)

  - Hide unavailable statistics and network actions during offline playback while preserving local controls. (#1462)
  - Collaboration videos now show all channel avatars in an overlapping row in grid and list views. (#1460)
  - Home recommendations now show filled thumbs for your feedback and keep disliked videos visible until you refresh the feed. (#1461)
