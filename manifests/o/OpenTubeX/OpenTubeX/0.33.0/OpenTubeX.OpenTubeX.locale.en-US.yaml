ReleaseNotes: |-
  Highlights

  - Navigate OpenTubeX with a standard gamepad, including menus, sliders, playback, and back controls. (#970, #984)
  - Use the customizable Home page to resume videos and see recent subscriptions, queues, playlists, downloads, reminders, and weekly watch activity. (#855, #988)

  More improvements

  - Use browser-style shortcuts on internal links: middle-click opens a background tab, Ctrl-click or Cmd-click opens an active tab, and adding Shift opens a new window. (#847, #935)
  - Comments and replies can now be translated into the app language, with a Distraction Free setting to hide translation buttons. (#4292, #936)
  - Channel avatars now appear beside channel names in video and playlist results, with an option to hide them in Distraction Free settings. (#938)
  - Search loaded comments, filter comments from the video creator, and keep personal comment pins at the top. (#861, #889, #939)
  - Keep a mini player on screen while switching tabs. (#827, #937)
  - Pair a device to enhanced-privacy sync by scanning a QR code or entering a text code, without re-entering account credentials or the privacy passphrase. (#914, #943)
  - Age-restricted and unlisted videos now show labeled badges with icons below the watch-page title. (#949)
  - See your SponsorBlock submissions, contributed segment skips, and time saved in the SponsorBlock panel. (#953)
  - yt-dlp playback can now provide auto-generated and translated captions when the selected backend has none. (#950)
  - Let yt-dlp use configured playback cookies for every video to request account-only formats. (#959)
  - Update alerts now appear as notifications that can be dismissed until the app restarts. (#962)
  - Added a searchable tab organizer with tab groups, bulk actions, and recently closed tab history. (#859, #964)
  - Custom themes can now be shared directly from the theme editor through a pre-filled GitHub Discussion. (#977)
  - The New subscriptions feed can now switch between combined sections or tabs. (#974)
  - Repeat a selected part of a video with draggable A-B markers, player-menu controls, and configurable keyboard shortcuts. (#858, #989)

  - Fill missing interface translations with optional AI-generated completions. (#978, #983)
  - You can now adjust mouse-wheel and touchpad scroll speed from 25% to 300% in Appearance settings. (#944)
  - Playlist view type can now be changed from Quick settings alongside the video view type. (#1009)
  - Save YouTube playlists as read-only bookmarks in Your Playlists. (#1012, #1013)

  Fixed bugs

  - SponsorBlock settings no longer overlap neighboring controls when changed-setting highlights are enabled. (#932)
  - Playlist loading failures can now be retried, and large Invidious playlists load later pages without duplicate videos. (#865, #871, #883)
  - Fixed Trending category switches showing results or refresh state from a different pending request. (#872, #886)
  - Neighboring tabs now animate smoothly when rearranging vertical tabs on slower systems. (#946)
  - Opening Downloads with Ctrl+J no longer reloads the active tab. (#947)
  - Playback settings controls now stay evenly aligned and wrap cleanly at narrow window sizes and non-default UI scales. (#955)
  - Prevented player keyboard shortcuts from firing while typing in focused settings selects. (#956)
  - Comments with no likes now show 0 instead of NaN. (#952)
  - The tabbed subscriptions New feed now marks only the active category as seen and keeps its header controls usable at narrow widths. (#981)
  - Keep the Quick settings avatar clear of wider scrollbars. (#968, #982)
  - SponsorBlock automatic skips now trigger more promptly on slow or heavily loaded systems. (#995)
  - Timelinks now keep resolved tab titles after restart, and paused or background videos no longer start playing unexpectedly. (#997)
  - Sync failures now show a toast when Sync settings is not open. (#1000)
  - Fixed videos failing to open when the system timezone is configured through /etc/localtime. (#991, #992)
  - Improved the onboarding tutorial and added color previews to theme selectors. (#999)
  - Live chat replays no longer omit messages returned alongside chat metadata, continue showing stale messages after seeking, or stop retrying early after playback changes. (#1001)
  - Full-window video mode now hides the page scrollbar and keeps the page at its original position. (#998)
  - Mobile YouTube links now open inside the app. (#1003)
  - Upcoming premiere titles now follow the Main Text color in custom themes. (#1002, #1005)
  - Comment filters now keep thread lines aligned and let you open creator replies from retained parent comments. (#1011)
  - Settings with an incomplete two-column toggle row now place the remaining option on the language's starting side. (#1010)
  - Video metadata now wraps cleanly below channel names on narrow result cards. (#1014)
  - Removed the redundant About option from the mobile navigation. (#1022)
  - Stop repeated YouTube parser warnings for collaborator avatars and newer video title headers. (#1021)
