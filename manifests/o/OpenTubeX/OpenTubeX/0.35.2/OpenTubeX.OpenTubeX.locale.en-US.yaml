ReleaseNotes: |-
  Highlights

  - Experimental iPhone and iPad support, with downloadable IPAs and sideloading instructions. (#1571)

  More improvements

  - Account activity now shows which synced items changed and uses readable names for setting choices. (#1557, #1558)
  - Back up and restore profiles, playlists, history, watch statistics, and settings in one ZIP file. (#1433, #1560)
  - Scheduled stream reminders can now sync between devices. (#1562, #1563)
  - Playlist playback skips private and members-only videos by default. The behavior can be turned off in Playback settings. (#1567, #1568)
  - Cast videos to compatible DLNA or UPnP devices from the desktop player. (#1564, #1569)
  - On phones in portrait, Shorts actions open in bottom sheets while the video keeps playing. (#1577)
  - Mobile select options now open in a centered dialog. (#1576)
  - Mobile gestures now give subtle haptic feedback when player and tab actions complete. (#1591)
  - Swipe between mobile tabs even when the next tab is unloaded; its preview appears until it loads. (#1587)
  - The SponsorBlock whitelist can now be managed inside settings (#1586)
  - Apply pin, unpin, load, unload, and reload actions to selected tabs on mobile. (#1589)
  - Playing videos now stay in a mobile bottom bar with channel details while browsing. (#1598)
  - Shorts player controls now also support the new frosted-glass finish. (#1582)
  - Loading tabs now show a pulsing indicator in the tablet tab strip and phone tab organizer. (#1616)
  - Scroll long subscription feeds more smoothly on desktop. (#1622)
  - Play subscriber-only Twitch VODs when the standard extractor cannot access them. (#1628)
  - Android APK downloads are smaller while retaining FFmpeg, yt-dlp, and the existing playback features. (#1626)
  - Ctrl+Alt+middle-click a link to open it in an unloaded background tab. (#1638, #1639)
  - Channel About now shows links to creators’ websites and social profiles. (#1647)
  - Watch 360° videos by dragging the player to look around, while clicking still plays or pauses. (#1449, #1640)
  - Hide or show channels directly from channel-link context menus. (#1636, #1641)
  - Search completed downloads by title or channel, filter by format or date, and sort by date or file size. (#1659, #1665)
  - Stop playback at the end of the current chapter with the sleep timer. (#1655, #1663)
  - Temporarily pause channel and phrase block lists from settings or Quick Settings without deleting entries. (#1637, #1645)
  - Hide end-screen recommendations without hiding recommendations elsewhere. (#1672, #1664)
  - Shorts now keep the last three videos buffered at their playback positions and preload streams for the next three, making navigation faster. (#1669)
  - The video player, captions, and watch-page skeletons follow UI Roundness, player control pill spacing is consistent, and enabled comments show a loading skeleton. (#1677)
  - External media loading screens now match the player layout, and audio players show available artist names and channel avatars. (#1679)
  - Reduce overlay scrollbar overhead while scrolling, especially on slower systems. (#1684)
  - Tab reordering is more responsive on slower desktop systems. (#1681)
  - Reduces CPU and memory overhead with large playlists and many tabs, and makes changing scrollbar visibility faster. (#1687)
  - Android Back gestures now preview player docking and closing drawers or dialogs. Paused and loading videos stay available when navigating away. (#1689)

  Fixed bugs

  - Pasted external media links with trailing spaces now open the media page. (#1553)
  - Centered the mobile SponsorBlock highlight button and removed stray dots from fullscreen video information. (#1566)
  - Android mini-player videos stay aligned with their controls after zooming. (#1570)
  - Keep the subscription feed refresh button beside its update status on small screens. (#1572)
  - The Replay icon now appears when seeking to the end of a paused video with End. (#1574)
  - Android uses the WebView player again for smoother Watch scrolling and mini-player transitions while keeping background audio and lock-screen controls. (#1573)
  - Mobile panels open to the original video position while the mini player is active. (#1580)
  - Leaving a video no longer waits for a SABR backoff countdown to finish. (#547, #1585)
  - The video follows the first downward swipe smoothly when docking to the mini player. (#1595)
  - The SABR countdown stays visible above the mobile play button while taps still control playback. (#1599)
  - Tags, games, and license details now appear in collapsed video descriptions. (#1602)
  - Watch no longer shows the previous page underneath when the connection drops. (#1614)
  - Enter fullscreen when turning an Android device sideways, even with system auto-rotate off. (#1605, #1613)
  - Fixed accidental scrolling when tapping beside mobile scrollbar handles. (#1610, #1611)
  - Desktop subscription refreshes stay responsive with large subscription lists. (#1623)
  - The app window appears sooner when starting with a large profile. (#1627)
  - Offline watch pages show other downloads and restore recommendations and transcripts after reconnecting. (#1635)
  - Playback settings now fill balanced columns in reading order. (#1646)
  - Avoid prolonged waits after failed SABR responses and retry incomplete video segments. (#1649)
  - Fullscreen side panels return to the page when opening another tab exits fullscreen. (#1644)
  - Channel playlist tabs now load TV shows and show their season counts. (#1666, #1667)
  - Prevent HTML event handlers from running while reading video descriptions. (#1670)
  - Show saved-video and premiere-notification states in mobile menus using the selected accent color. (#1673)
  - Fixed uneven padding around the header logo highlight. (#1676)
  - Opening videos in background tabs from subscriptions is smoother on slower devices. (#1675)
  - Show the full playlist picker and correctly spaced information separators in the YouTube-style Shorts player. (#1678)
  - Reduce pauses when videos animate into the mini player and back on slower desktops. (#1682)
  - Keep loaded comments, recommendations, transcripts, chat messages, and SponsorBlock segments available when the connection drops. (#1688)
