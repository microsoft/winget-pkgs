ReleaseNotes: |-
  Highlights

  - Focus settings have a new Digital Wellbeing tab with a grayscale mode, daily watch time and Shorts limits, break reminders, and a bedtime reminder that can silence upload notifications. (#2330, #2562, #2577, #2596)

  More improvements

  - The Playlists icon in the navigation, tabs, and page headings is now outlined to match the other navigation icons. (#2549, #2563)
  - Subscription groups can now have an icon, shown beside the group's name in the group tabs and the subscribe button's group list. (#2493, #2566)
  - You can now choose how many search history entries and suggestions the search bar shows before its list scrolls, from 5 to 50, in Appearance settings. (#2548, #2572)
  - Chapters now have a loop button that repeats the chapter with A-B repeat. Press it again to stop. (#2557, #2568)
  - You can keep the window open when you close its last tab. Turn off "Close window when closing the last tab" in General settings, and a new tab opens in its place. (#2541, #2569)
  - Follow creators from other platforms through RSS and Atom feeds, for example from an RSSHub instance, in an optional RSS tab on the Subscriptions page. Turn it on in the subscription settings. (#2560, #2574)
  - YouTube playlists, including saved ones, now have the "Search for Videos" field. Searching loads the rest of the playlist so the results cover every video. (#2561, #2571)
  - The actions below a video stay in one row of evenly sized buttons on narrow screens, and the actions that don't fit move to a More options menu. (#2575)
  - Caption font size and background opacity have sliders again, in the captions menu next to common values and in the settings. Font sizes go from 50% to 400% and opacities from 0% to 100%, both in 5% steps. (#2579, #2580)

  - Caption settings show color swatches, and the sample caption previews each option as you hover over or move through it. (#2567)
  - Place each player control on the control bar, in the player menu, or nowhere, and reorder the player menu. Resolution, playback speed, audio tracks, loop, screenshot and chapters can now go on the control bar, and you can hide any player menu entry, such as ambient mode, the sleep timer or captions. (#2547, #2582, #2598)
  - Screenshots can be saved as JPEG XL. The format picker now lists legacy and modern formats separately. (#2490, #2573)
  - When the video actions below the player share a narrow row, the download button now sits at the end, after the More button.
  - Afrikaans, Esperanto, and Urdu are now available as display languages. (#2600)
  - The Distraction Free settings category is now called Focus, and every settings category describes what it contains more accurately. (#2596)

  Fixed bugs

  - Dropdown menus, tooltips, and color pickers in the settings window now open next to their button in Firefox instead of off to the side. (#2553)
  - Captions keep one size at font sizes other than 100%, instead of growing word by word and spilling past their background. (#2556, #2559)
  - Video lengths past 24 hours now include days, such as 1:01:01:01, matching the player. (#2558, #2565)
  - The tab bar now scrolls to the active tab when the app opens, when you switch tabs with the keyboard, and when you open a new tab, so the active tab stays visible. (#2570)
  - Tooltips now stay where they open instead of following the pointer, and appear centered below buttons and navigation items. (#2576)
  - The reminder button on upcoming videos is filled with the accent color again while a reminder is set, so it's easy to tell on from off. (#2581)
  - The audio track menu no longer resets while a video plays, so dragging its scrollbar keeps scrolling. (#2589, #2590, #2591, #2592, #2593, #2588)
  - Menus no longer end with an empty separator line, for example the More menu of a YouTube playlist. (#2595)
  - The player menu in the Customize interface preview now looks like the real one, with centered tiles, and shows a list when the grid layout is turned off. (#2598)
  - Channel About pages now show links whose address leaves out https://. (#2600)
  - The default playback speed is now rounded to two decimal places, so changing the speed step no longer leaves values such as 1.1500000000000001. (#2600)
  - When using Invidious, the arrow keys now reach the About tab on channel pages. (#2600)
