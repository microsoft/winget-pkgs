ReleaseNotes: |-
  Improvements

  - The update prompt and store listings now leave out changes that only affect other platforms. (#2512)
  - Mono Audio plays both audio channels in both ears, for videos whose sound only comes out of one side of your headphones. Turn it on in Player settings, or enable Show Mono Audio Toggle to switch it from the player menu. (#2511)
  - The preferred video codec setting in Advanced settings is now available on every device, and its tooltip explains how AV1, VP9 and H.264 differ in data use, battery use and resolution. (#2508, #2519)
  - Comments from channels you're subscribed to now show a person-with-checkmark badge instead of the OpenTubeX logo, and the badge also appears when using Invidious. (#2525)
  - Options in the player's captions menu now opens a Style page for the font, text color and opacity, size, background color and opacity, edge style, and position. Player settings offer the same options and stay in sync, but vertical position and edge color are no longer available. (#2534, #2546)
  - Videos in the built-in player start loading up to a second sooner. (#2535)

  Fixed bugs

  - Twitch VODs list all of their qualities in the quality menu again, instead of only the one that's playing, and start in your default quality even when that's the source quality. (#2516, #2527)
  - Ending a SponsorBlock segment at the end of a video no longer fills in an end time past the video's length. (#2513, #2515)
  - Videos from sites such as Dailymotion no longer fail with "Cannot read properties of null (reading 'includes')" right after they start loading. (#2510)
  - Paused videos no longer repeat the server countdown and reload when YouTube stops sending media after the first minute. (#2509)
  - Dropdown menus, tooltips, and other popups in Firefox now open next to their button on scrolled pages instead of somewhere else on the screen. (#2520)
  - Seeking during playback no longer plays a split second of audio at the new position twice. (#2528)
  - When the tabs in the top or bottom tab bar overflow, they now sit centered in the bar with equal space above and below, instead of hugging one edge. (#2529)
  - Buttons such as Cancel in pop-up messages are now readable with light themes. (#2526)
  - A horizontal scrollbar no longer flashes when a Short returns from the mini player. (#2533)
  - Creating or editing a subscription group opens quickly even with many subscriptions, and the scrollbar no longer jumps while scrolling through its channels. (#2524)
  - Videos in the built-in player stop buffering after about a minute much less often. (#2530)
  - When YouTube blocks a video for signed-out users because it features minors, the error message now says so instead of only suggesting an IP block. (#2534)
  - Copying a playlist or adding several videos to a playlist at once no longer fails when a video has collaborators. (#2534)
  - Downloaded videos no longer get stuck loading until you seek when "Buffer Before Playing" is set above 0, for example with the Smooth Playback buffering preset. (#2532, #2537)
  - The hint for videos that need cookies now points to Settings → Advanced → External Software → yt-dlp Cookies. (#2514)
  - Videos in the queue now sit centered in their rows, with even spacing and thumbnails aligned to the drag handles, even beside long titles. (#2538, #2540, #2542)
  - Verified and official artist badges now stay beside the end of long channel names instead of wrapping onto a line of their own. (#2544)
