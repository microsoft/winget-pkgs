ReleaseNotes: |-
  More improvements

  - Queued videos now show their length, music badge, views and upload date like playlist videos. A ⋮ menu moves or removes them, and dragging slides the other videos aside. (#2331)
  - Removed the "Match top bar with main color" setting, which made the header hard to read with many themes (#2338)
  - Added configurable SponsorBlock submission shortcuts, with ; to start or end a segment and ' to open the submission menu. (#2351, #2356)
  - The buttons below the video are easier to tap on touch screens (#2364)
  - Quick Settings now start with playback speed and watch history instead of language, region, main color and thumbnail size. If you never customized Quick Settings, you get the new set automatically. (#2370)
  - DeArrow now has its own section in Add-ons settings, and SponsorBlock's excluded channels only appear while SponsorBlock is enabled. (#2371)
  - Player settings are now grouped into sections, and long select labels are no longer cut off (#2378)
  - The date, views and category below the video now use icons, like video cards. (#2389, #2393)
  - Tooltips now use your theme's colors, font and corner rounding instead of the plain system style (#2392)
  - F-Droid, SideStore, Flatpak and FlatPark listings now show what's new in each stable release, and the deb, rpm and AUR packages include it as their changelog (#2402)
  - Dragging the seek bar shows a strip of frames around where you'll land, and fullscreen swipe-to-seek now shows the same seek bar preview instead of a popup in the middle of the screen. (#2391, #2409)
  - Round icon buttons, such as Share, Refresh and the download actions, now use soft tinted backgrounds instead of bright filled circles with shadows (#2420)
  - On Android, links from other sites shared with OpenTubeX now open with yt-dlp, and video links from popular sites such as Instagram, TikTok and Reddit can open directly in the app (#2407)
  - Show verified and official artist badges, YouTube's search spelling corrections, the music credited in a video, shared community posts, information panels under videos, hashtag video and channel counts, and a Music tab on Trending (#2421)
  - On Android, syncs now finish while the app is in the background, changes made while it is hidden reach your other devices without reopening it, and returning to the app no longer shows a false "Sync failed: timed out" message. (#2432)
  - Press B to add the current video to your quick bookmark playlist or remove it, and Shift+S to save it to a playlist (#2431, #2433)
  - Hashtag pages have a Shorts tab that keeps loading more Shorts (#2436)
  - While dragging the seek bar, pull up past the middle of the strip of frames to seek precisely through longer videos, drag back down to return to normal seeking, and press Esc to cancel the drag. (#2437)
  - Choose how much video loads ahead, stays loaded for rewinding, and must load before playing, with Data Saver, Default and Smooth Playback presets in Settings → Advanced → Buffering (#2424, #2434)
  - New Always use backup media server setting in Advanced settings loads videos from YouTube's backup server right away, for example when your internet provider's cache is often slow (#2422, #2441)
  - Import Playlists can import several YouTube Takeout playlist CSVs at once, with their original titles and descriptions when you also select playlists.csv (#2450)
  - New Pause on Stream Recovery setting: when the player recovers from a stream error, it pauses and keeps the error on screen with a Copy button until you dismiss it (#2198, #2451)
  - The Android and iOS apps keep tab thumbnails and channel avatars after a restart and show them offline, and you can see and clear this cache in Storage settings (#2452)
  - The Seek history menu shows how long ago you left each position. (#2465)
  - The Add to playlist prompt shows which videos you're adding, and its search, switches and sort fit in one row (#2461)
  - Recommended for you now draws on your whole watch history and saved videos instead of repeating suggestions based on the same few videos, and uses more specific searches and topic labels (#2464)
  - The comment filter and reload buttons are now the same size as the refresh button on the subscriptions pages (#2476)
  - On Android, background tabs now stay loaded until memory runs low (adjustable in Advanced settings), tab previews no longer turn black while a page is loading, and the tab organizer button no longer stays highlighted after you pick a tab. (#2481)
  - The Playback speed, Zoom, Volume boost and Theatre mode tiles in the player menu are highlighted while they are changed from their defaults (#2484)
  - Sync finishes faster after small changes, and with an updated sync server, a watch history edit uploads only that entry instead of your whole history (#2488)
  - The "Playing in Picture-in-Picture" message is now larger, centered on the player and shown with an icon (#2504)

  Fixed bugs

  - Pinching on Android no longer zooms the app interface with WebViews such as Vanadium (#2326, #2328)
  - With the custom title bar, middle-clicking the empty tab strip opens a tab again on Windows, maximized Settings no longer puts buttons under the window controls, the screen's top edge reaches the tabs of a maximized window, and the window controls no longer cover a Full Window video on Windows (#2327, #2329)
  - Android: Fullscreen entered by rotating the phone stays on when the next video starts (#2332, #2333)
  - The resolution menu lists every codec a video is available in, including ones your device can only decode in software, such as AV1 on GPUs without AV1 decoding. (#2335)
  - Keep video tab titles when a channel loads behind the video, and restore channel names when returning to their pages (#2340)

  - Fixed missing comments and video descriptions when Android restores an open video at startup. (#2336, #2339)
  - Fixed repeated player reloads, videos failing to load without thumbnail previews, and broken channel lists when video or TV-show details are incomplete. (#2349)
  - Fixed comment sorting and reload buttons looking enabled while offline. (#2346)
  - Retry timed-out stream format checks before completing playlist preloading. (#2343, #2348)
  - Fixed overflowing playlist thumbnail controls with a three-dot menu for reorder and remove actions. Playlist videos now show icon-labeled metadata like the queue and retain available view counts. Playlist positions appear in the top-left corner of each thumbnail. (#2342, #2347)
  - Fixed unnecessary SABR player reloads caused by split stream headers and limited buffering of oversized stream responses. (#2355)
  - Fixed gray watch-page action icons so they use the light or dark theme foreground color. (#2352, #2354)
  - Videos played through Invidious no longer show a false age-restricted badge (#2366)
  - Fixed Load More on Home stopping after 96 videos, downloaded playlist videos streaming online after Next, missing Shorts notifications on Android while the app is closed, missing notifications for channels outside the active profile, SRT files with dot timestamps failing to load, playlist searches carrying over to the next playlist, Yattee error toasts on videos with comments turned off, and hidden windows not returning from the macOS Dock. (#2367)
  - The description's "...more" and copy buttons no longer show through the share menu and other video toolbar menus (#2374)
  - With theatre as the default viewing mode, chapters, the transcript and SponsorBlock open below the video again when the watch page has no sidebar (#2373)
  - Swiping between tabs on the app bar no longer makes the incoming page jump to a different scroll position on Android (#2365)
  - Subscribing to a channel no longer opens its subscription settings when you only have one profile. (#2377)
  - The player preview in Customize interface now shows the center play button and the player menu while playing, and matches the compact controls and menu on phones and narrow windows (#2376)
  - Videos on Android and iOS no longer wait up to 25 seconds for a SABR countdown before they start playing. (#2395)
  - On narrow screens, the buttons below the video now split into one row per group instead of wrapping with a stray divider (#2397)
  - Android: yt-dlp playback works after a fresh install even when GitHub limits update requests, because the app bundles a current yt-dlp and updates it without GitHub's rate-limited API (#2398, #2399)
  - Tab Organizer previews on Android no longer miss channel banners and avatars that load after the page. (#2403)
  - Fixed Android downloads and other yt-dlp features disappearing when the saved download history file was empty (#2405, #2408)
  - Videos now start when YouTube's assigned media server doesn't respond, for example an unreachable cache at your internet provider, because OpenTubeX switches to the backup server YouTube names (#2401)
  - Volume, brightness and speed indicators appear over the video instead of the middle of the screen when the queue or another side panel is open in fullscreen (#2390, #2394)
  - Links in update release notes open in your browser again, and imported settings, backups and remote content are handled more safely. Download templates and the IP block recovery script are no longer exported, backed up or synced (#2425)
  - Fixed a thin line of the page showing between the minimized player and the navigation bar on Android when UI Scale isn't 100% (#2423, #2435)
  - Fixed YouTube Takeout ZIP imports finding no data when the export was in a language other than English (#2438)
  - Linux: OpenTubeX no longer shows a main process error when the desktop session starts it while D-Bus is still slow, such as when KDE Plasma restores the previous session at login, and KDE Wayland minimize detection now recovers in that case (#2440)
  - Links in prompts, fullscreen player panels and expanded Super Chat messages open in your browser, and theme author links open once and follow your External Link Handling setting (#2439)
