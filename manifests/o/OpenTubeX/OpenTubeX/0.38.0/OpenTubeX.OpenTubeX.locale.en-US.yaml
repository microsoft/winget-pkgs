ReleaseNotes: |-
  Highlights

  - Follow channels on Twitch, SoundCloud, PeerTube, Rumble and Odysee without an account. Their uploads appear in a Platforms tab and the New feed, their channels and playlists open in the app, search covers these platforms, and you can be notified when a Twitch channel goes live. (#1398, #3113)

  New features

  - A new Auto Load Comments setting controls whether comments load automatically, separately from Auto Load Next Page for feeds and other lists. (#2821, #2845)
  - Double-click the mini player to return to the full player. (#2823, #2849)
  - A new Font Size setting in Appearance and Quick Settings makes text larger or smaller without zooming the rest of the interface. (#2811, #2843, #3080)
  - Links in descriptions, comments, and elsewhere are now underlined only on hover. To always or never underline them, change Link Underlines in Appearance settings. (#2816, #2844, #3080)
  - A new "Show seek bar filmstrip" setting in Player Settings brings back the single thumbnail when you drag the seek bar or swipe to seek. (#2743, #2862)
  - Channel pages have a switch to hide watched videos, shorts, and live streams. (#2810, #2869, #3080)
  - The Custom Theme Editor can now change the background of thumbnail badges, like the duration and Watched labels, so you can make them lighter or transparent and see more of the thumbnail. (#2676, #2879, #3080)
  - A new Distraction Free setting, Hide Playlist Stats, hides the video count, last updated date, and total duration on playlist pages. (#2813, #2881)
  - Digital Wellbeing's grayscale can now apply to videos and images only, so the interface keeps its colors. (#2742, #2878, #3080)
  - Rewind on Resume in Player Settings jumps back a few seconds when you resume a paused video, so you don't lose track of what was happening. You can also make it skip short pauses. (#2828, #2885, #3080)
  - You can now sign in to a self-hosted sync server through its single sign-on (OIDC) provider, such as Authelia, if the server is set up for it. (#2362, #2883, #3080)
  - Notifications you read, remove, or clear now sync between your devices. Reading one in the app also removes it from the system's notifications, and opening or swiping away a system notification marks it read. (#2725, #2887, #2925)
  - Playlists can be pinned to the top of the Playlists page from their context menu. Pinned playlists stay above the others, whichever sort order you choose. (#2876, #2903, #3080)
  - Storage settings have a clearer layout with a usage bar. Watch history retention moved to Privacy settings, where saved searches can now also be removed automatically after a set number of days. (#2480, #2906, #3019, #3080)
  - The tray icon has a new monochrome style that turns white or black to match your taskbar, menu bar, or panel. (#2940, #3080)
  - Scrolling down a video page now pins the full-size player to the top when there's room, such as on phones in portrait or on vertical monitors, and shows the mini player otherwise. Two choices, "When scrolling down" and "When leaving a video", replace the three mini player switches. (#2427, #2939, #3080)
  - Playlists have a new option to remove each video once you watch it from the playlist, using your watched percentage threshold. (#2426, #2989, #3080)
  - To darken the app behind dialogs and menus without blurring it, which is lighter on less powerful devices, change Dialog Background in Appearance settings. (#3005, #3006, #3080)
  - Pasting a video link into the search bar now shows the video's thumbnail, title, channel, and length before you open it, and channel links and handles show the channel's avatar and name. Links are no longer sent to the search suggestion service. (#3008, #3080, #3067)
  - Focus settings can blur videos, playlists, channels, and posts matched by your block lists instead of hiding them. Click a blurred item to show it. (#3030, #3080)
  - Videos loaded with the Local API that are louder than most now play at a lower volume, reducing volume differences between videos. Turn this off with Normalize Loudness in Player Settings. (#3025)
  - A new experimental Faster Subscription Refresh setting in the Subscription settings skips reloading channels without new uploads. In exchange, view counts and other details of those channels update less often. (#3032, #3112)
  - A new Always show DeArrow badge setting keeps the DeArrow button visible on videos whose title or thumbnail DeArrow changed, so you can spot them at a glance. The button now shows the DeArrow logo. (#3028, #3080)
  - You can now host the OpenTubeX web app yourself with Docker Compose, with its own Invidious server or without one. The new OpenTubeX Local API browser extension lets the web app, including the web demo, load videos straight from YouTube. (#2388, #2677, #3048, #3052)
  - Click Scrollbar Track to Scroll, a new Appearance setting, scrolls about a page when you click a scrollbar outside its handle. (#668, #3055)
  - Once a video or other item in a feed or result list has focus, the arrow keys move between items. M marks a new item as seen, or toggles watched on an item already seen. You can change the M shortcut in Keyboard Shortcuts. (#3034, #3062)
  - The Profile Manager has a search field for a profile's channels, and profiles with many subscriptions open without freezing. (#3095)
  - You can now sign in with a YouTube account to like videos, comment, keep your subscriptions and playlists in sync with YouTube, and see your YouTube recommendations on Home. Google can restrict accounts that use unofficial apps, so only use an account you can afford to lose. (#1064, #3136, #3106, #3141)

  Improvements

  - OpenTubeX now checks for updates every few hours while it runs, not only at startup. (#2833)
  - Deleting items in the app, such as the last video of a playlist, no longer stops sync to ask for confirmation. When sync does stop to prevent data loss, Sync settings now shows the affected items right away and offers to keep them instead of deleting them. (#2812, #2847, #3080)
  - Channel tabs that don't fit on one row now open from a More tab instead of scrolling sideways. On phones, the channel search button sits next to Subscribe. (#2852, #3080)
  - The Picture-in-Picture window now reopens where you left it and at the same size, even after restarting OpenTubeX. On Linux, this needs KDE Plasma. (#2826, #2851, #2863)
  - Copying a playlist opens the playlist picker right away. Copying, adding missing videos from the source playlist, and removing unavailable videos keep running after you leave the playlist, show their progress, and report when they finish. (#2781, #2856, #3080)
  - While a video page waits to reach YouTube or your API server again, it now says so and offers a Retry now button instead of showing only the loading placeholder. A playing video that loses YouTube resumes where it stopped instead of reloading the page. (#2872, #2978)
  - The buttons in the middle of the player no longer sit on dark circles. With "Display Play Button In Video Player" on, desktop players also show Previous and Next beside play/pause when a playlist or queue has a video before or after the current one. (#2825, #2880)
  - Changing the search filters on a search results page now searches again with the new filters, so you no longer have to repeat the search. (#2908)
  - Channel pages, the Channels page, and Channel Settings show each channel's handle, and searching your channels, Channel Settings, and subscription groups also finds channels by handle. (#2884, #2905, #3080)
  - Live streams now play in up to 4K with both playback engines, instead of stopping at 1080p, and the built-in engine can rewind them and premieres. (#2923, #2977)
  - The playlist picker lists playlists as compact rows on phones and when Video View Type is set to List, so several fit on screen at once. On phones, the search options sit behind a filter button. (#2928, #3080)
  - Download file name templates now have to stay inside the download folder. Absolute paths, "..", "~", "$", and raw yt-dlp "%(...)" fields are rejected; use the {title}, {author}, and other listed fields instead. (#2933)
  - The first time the external player starts with new custom arguments, OpenTubeX shows them and asks before running it. (#2933)
  - Paths to yt-dlp, FFmpeg, the external player, the IP block recovery script, the cookie file, and the download folder are now chosen with Browse and can no longer be typed or pasted. Browser profiles still accept a name; choose a profile folder with Browse. (#2933)
  - Additional yt-dlp arguments no longer accept --parse-metadata, --replace-in-metadata, --metadata-from-title, --compat-options, or --trim-filenames, which could move downloads out of the download folder or turn off yt-dlp's file type checks. (#2933)
  - Themes are now chosen on one page that previews each theme: pick System default, Light, or Dark, then the light and dark themes, with the color and accent settings alongside. (#2984, #3080)
  - Saved playlists now sort by when their channel last updated them, and a new button on the Playlists page refreshes them all at once. (#2875, #2991, #3080)
  - A live stream reminder that came due less than an hour before you opened the app now notifies you instead of disappearing. (#2998)
  - The tutorial for new users now offers to import your data first, lets you pick a theme, start page, region, and playback and privacy options, and can be replayed from About. (#3007, #3080)
  - Settings sync now carries each playlist's options, such as adding new videos to the top and shuffling by default, so a playlist plays the same way on all your devices. (#3010)
  - Playlist downloads now show which video is downloading, such as "Video 3 of 12", with its title. (#3011, #3022, #3080)
  - Titles in lists and grids can now be limited to one, two, or three lines, or shown in full, instead of only switching the two-line limit on or off. (#3020, #3080)
