ReleaseNotes: |-
  Highlights

  - YouTube Music audio tracks and audio-only formats now use a dedicated artwork player with an optional visualizer. (#393, #1035)
  - There is early Android app support now with Local API playback, notifications, deep links, picture-in-picture, full-screen swipe gestures, background playback and subscription refresh. When using sync tab sessions are now also stored separately per device with an option to open tabs from other devices or have them synced together. (#1049)

  More improvements

  - Choose date and time formats independently of the app language. (#969, #1027)
  - Choose which feed types each subscribed channel may show, set a daily video limit, and opt into members-only videos when yt-dlp playback cookies are configured. (#550, #846, #1036)
  - Added a test toast button beside the toast position setting. (#1040)
  - Manage signed-in sync devices, rename them, review system details, revoke sessions, and change your sync password. (#942, #1042)
  - Search history can now save the same query with different filters and restore each preset exactly. (#526, #1043)
  - Subscription New feed tabs now show which categories have unseen content and let you mark a category as seen from its context menu. (#1047)
  - Preload upcoming yt-dlp videos automatically or cache an entire playlist before watching. (#1045, #1053)
  - Customize which basic controls appear in Quick Settings from the Appearance settings. (#1046, #1059)
  - Batch-edit subscription display and playback preferences, and add subscribed channels directly to Saved Channel Settings. (#1060)
  - Automatic Picture-in-Picture on minimize now works on KDE Plasma Wayland. (#1075)
  - You can now assign a keyboard shortcut to open the tab organizer. (#1076)
  - Customize which destinations appear in the navigation bar, and reorder them from Appearance settings. (#1092)
  - Configure up to eight concurrent yt-dlp preloads from the new yt-dlp Streaming playback section. (#1096, #1105)
  - Quick Settings now shows an icon beside each category heading. (#1107)
  - Import custom themes directly from the clipboard in the theme editor. (#1135)
  - Reload tabs with F5 as an alternative to Ctrl/Cmd+R. (#1095, #1103)
  - Reduce unnecessary background work in player controls, progress indicators, and interface animations. (#1146)
  - Desktop tab context menus are more compact, with quick-action icons and a two-row color palette including pink. (#1148)
  - Use your configured yt-dlp cookies for subtitles and automatic translations, either separately or through “Always Use Cookies”. (#1126, #1141)

  Fixed bugs

  - Added space between RTL channel names and the sidebar scrollbar. (#1024, #1026)
  - Recently ended live streams can now play with yt-dlp extraction. (#1017, #1020)
  - Videos that become public after a members-only period now appear as new in subscriptions. (#1038)
  - SponsorBlock contribution stats no longer appear when submissions are disabled. (#1039)
  - The tutorial highlight now follows navigation layout changes when resizing the window. (#1041)
  - Restored Picture-in-Picture after the video player reloads. (#1050)
  - YT-DLP playback now recovers from stream errors without reloading the watch page. (#1068)
  - Playlist cards now update their video count and other metadata immediately when a playlist changes. (#1062, #1066)
  - Windows portable builds now store all application data in an OpenTubeX-data folder beside the executable. Before starting the updated portable build, existing users must copy or move the contents of %APPDATA%\OpenTubeX into OpenTubeX-data to keep their settings and profile. (#1073, #1074)
  - Playlists now continue automatically after Shorts instead of stopping or looping indefinitely. (#1078, #1081)
  - Saved playlists now update their displayed metadata after they are opened. (#1084, #1086)
  - A-B repeat now continues when point B is set to the end of a video. (#1087)
  - Keep concurrent subscription sync edits and preserve seekbar thumbnails and duration when reusing cached playback data. (#1124)
  - Picture-in-Picture no longer gets stuck after a video player is replaced. (#1119)
  - System light and dark theme settings now only offer themes that match the corresponding color scheme. (#1104)
  - Scroll-down and tab-switch mini players now remember their positions independently. (#1128)
  - Saved channel playback settings now open faster with large channel lists, showing 24 channels per page. (#1134)
  - Subscription refreshes are faster with large New feeds and continue when the Android app is in the background. (#1136)
  - Keep encrypted sync accounts from silently falling back to plaintext when a server stops advertising encryption. (#1140)
  - Fixed videos starting with a dubbed audio track instead of the original when using yt-dlp playback. (#1145)
  - Fixed live streams and premieres stopping with error 4033 when external subtitles were available. (#1155)
  - Rounded comment totals now follow the setting for shortening view and comment like counts. (#1160)
  - Prevent sync from recreating deprecated playback-speed collections after their data has migrated to settings. (#1151)
