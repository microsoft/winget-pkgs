ReleaseNotes: |-
  More improvements

  - Keep quick settings together by category and smoothly drag to reorder quick settings, navigation items, and fullscreen actions. (#1963)
  - Desktop sync and subscription refreshes run heavy processing in the background to keep the interface more responsive. (#1964)
  - Switches now show a checkmark when on and a dash when off, making their state easier to recognize. (#1966)
  - External media pages now match YouTube's metadata and ratings layout, including relative publication age, thumb icons, and the likes/dislikes ratio bar. (#1967)
  - Loading desktop tabs keep their icons visible and show a glowing bottom-edge sweep with subtly muted text; subscription tabs retain their normal appearance while refreshing. Appearance settings can restore the classic loading dot. (#1971)
  - Playing desktop tabs keep their icons and avatars, with a small corner play badge showing playback. (#1974)
  - The Shorts volume slider now matches the regular player's thin track, accent-colored fill, and white thumb. (#1976)
  - Hover over the seek bar to see a video’s most replayed moments, or hide the popularity graph in Distraction Free settings. (#1992, #1994)
  - Navigation and tab controls now use Material 3 styling with clearer active highlights, consistent mobile labels, and shared crossfade animations. (#2025)

  - Videos open sooner with the built-in player by fetching watch metadata while preparing the player script and playback token. (#2040)
  - Choose which data to include in a backup ZIP, and fix backup exports failing to open the save dialog. (#2036)
  - Tab bars now follow the app's shared scrollbar settings, with slimmer thumbs that expand on hover. (#2046)

  - The Music Mode headphone badge now cuts out the profile avatar, matching playing-tab badges. (#2047)
  - The mobile More menu now uses a Material 3 bottom sheet. Drag handles let you pull More and context menus down to dismiss them, and tapping outside slides them off the screen. (#2039)

  - Repair selected playlists or all playlists to restore missing video details after importing YouTube Takeout. (#2056)
  - The Entire App untranslated-text option now also restores original channel names in search results. (#2067)
  - Browse watch history by date range and channel, with filters that work alongside text search. (#1654, #2085)
  - Restore pending watch queue videos in their saved order after restarting OpenTubeX. (#1651, #2082)
  - Find and open individual videos from history, playlists, downloads, and the watch queue in the command palette, with each result showing its source. (#1653, #2088)
  - Preview record counts and merge or replacement effects before importing a backup or YouTube Takeout ZIP. (#1662, #2083)
  - Adjust captions earlier or later during playback with a per-video timing offset and Reset. (#1656, #2090)

  - Choose your own playlist thumbnails, replace or restore them, and sync them between devices. (#1745, #2084)
  - Material themes now offer Light, Dark and Black variants, with preset, custom or Android wallpaper accent colors. Dynamic colors follows the system accent on desktop and the wallpaper on Android, along with the light/dark preference. (#1608, #2073, #2098)
  - Icons now identify actions in the tray menu and follow your selected icon pack. (#2104)
  - Existing installations now start without the outdated “Settings have moved” notice. (#2091)
  - Display GIFs in comments and replies, with animation only while hovered. (#2105)

  Fixed bugs

  - Tab previews transition more cleanly when pulling down the app header on Android, with smoother clipping and immediate tab selection after release. (#1961)
  - Preserve channel names and view counts in recommendations when channel names contain words such as “preview”. (#1962)
  - Fixed the volume icon sitting too high inside the video player's circle and expanded volume control. (#1965)
  - Match the spacing around Up Next and Available Offline headings to the gaps between videos. (#1968)
  - Offer a cookie retry and an age-restriction hint when YouTube returns no search results without a warning. (#1972)
  - View All on channel pages now uses a subtle hover highlight matching other outlined buttons. (#1970)
  - Fixed excessive spacing around selectors in onboarding, channel views, playlists, downloads, and subscription menus. (#1975)
  - Fixed channel banners remaining blank after failed image requests, with image recovery on Android and a default-banner fallback. (#1983)
  - Restore interactive 360° playback and support panoramic streams with built-in extraction. (#1979)
  - Fixed Ctrl+Tab taking a long time to appear while background tab previews are being captured. (#1982)
  - Tab closing and drag reordering respond more smoothly on phones, and quickly closing multiple tabs no longer skips a tab. (#1987)
  - Let Android users retry restricted searches with their saved YouTube session. (#1988)
  - Disabling UI animations now also stops watched-thumbnail highlight fades. (#1984, #1991)
  - Keep members-only subscription visibility disabled when channel details refresh. (#1990)
  - Apply bulk subscription settings promptly for large channel lists. (#1997)
  - Restore Rumble video and audio playback on Android when the site rejects metadata or manifest requests. (#2003)
  - Fixed Google Takeout playlist imports failing when a video ID starts with a dash and its CSV row has leading spaces. (#2015, #2016)
  - Fixed connection banners leaving a gap in full-window playback or covering page content and player controls. (#2020)
  - Android tab previews no longer intermittently turn black after swiping between tabs. (#2017)
  - Show upload times for recently uploaded recommended videos. (#2022)
  - Focused outlined inputs and dropdowns now have even 2px borders without shifting their labels. (#2023)
  - Marking all new subscriptions as seen returns to the top and clears the feed more smoothly. (#2028)
  - Opening the tab organizer on Android responds faster when tapping its button or pulling down the header. (#2030)
  - Windows updates now respect deleted desktop shortcuts, and the installer lets you choose whether to create one. (#2026, #2027)
  - Offline playback queues now continue while the phone is locked, including when automatic video startup is disabled or the queue contains duplicate downloads. (#2031)
  - Fixed playlist panel roundness, grid action alignment, spacing between watched videos, and clipped channel avatar outlines. (#2034)
  - Fixed player controls ignoring UI Roundness, autoplay becoming square at 0%, and the playback-speed bar losing its gap to the right controls. (#2037)
  - Fixed channel About links bypassing confirmation and disabled external-link settings. (#2042)
  - Fixed cropped Android Picture-in-Picture video when going Home after scrolling. (#2043)
  - Fixed YouTube Takeout imports adding -videos to playlist names. They now also import their description. (#2049)
  - Fixed imported YouTube playlists syncing without their videos. (#2054)
  - Fixed spacing below the Add to Playlist search field and made the field more compact on desktop. (#2062)
  - Reduce memory growth and unnecessary UI work during video playback and player-menu updates. (#2060)
  - Fixed missing creator profile links and avatars when watching Twitch streams and VODs on desktop. (#2064)
  - Show saved thumbnails in Available offline and switch from Up Next to downloaded videos when the connection is lost. (#2058)
  - Fixed repaired history metadata not syncing to other devices. (#2070)
  - Keep SponsorBlock segment colors recognizable across played, buffered, and unbuffered portions of the seekbar. (#2074)
  - Keep overflow icons hidden in the compact bottom navigation bar so they appear only in More. (#2076)
  - Settings now keeps the current subpage when closed and reopened, including after unlocking password-protected settings. (#2077)
  - Fixed a flicker when closing Settings with Android Back. (#2087)
  - Fixed blank collapsed previews for “How this was made” and stale or missing description controls when metadata changes. (#2094)
  - Fix failed Windows relaunches when OpenTubeX is reopened before shutdown finishes. (#2075, #2093)
  - Fixed background clicks failing to expand video descriptions containing only metadata. (#2097)
  - The reload and sort controls are vertically centered when no comments are available. (#2101)
  - Closed security gaps that let abbreviated yt-dlp options run commands, let DLNA casting reach private network hosts, and let other Android apps use the app's proxy relay (#2114)
