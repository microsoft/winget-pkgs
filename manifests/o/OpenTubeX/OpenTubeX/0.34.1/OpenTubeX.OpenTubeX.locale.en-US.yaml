ReleaseNotes: |-
  Highlights

  - Android now supports yt-dlp playback and downloads, including formats, subtitles, automatic downloads, queue controls, and offline playback. (#1156, #1162)
  - Get personalized recommendations for unwatched videos on Home, with local learning, discovery controls, and feedback to refine your feed. (#945, #1157)
  - Choose OpenTubeX Light or OpenTubeX Dark for homepage-inspired teal colors and soft gradient backgrounds. (#1144)
  - Android uses native video playback to keep audio continuous through screen lock and Picture-in-Picture, with improved player controls, gestures, and fullscreen behavior. (#1094, #1180)
  - Discover community themes in Appearance settings, preview their screenshots, and install, apply, or update them in one click. (#1204)

  More improvements

  - Click comment thread lines to expand or collapse replies, with hover highlighting to show which thread you control. (#1158)
  - Tab groups now show tab previews with titles and icons in a custom tooltip. (#1169)
  - Android's tab organizer now shows page icons and available channel avatars for tabs from other devices. (#1170)
  - Subscription premieres now refresh their watching count and automatically become normal videos when they finish. (#1168)
  - Long-press the Android app icon to open Subscriptions, Playlists, History, or Downloads. (#1181, #1183)
  - Share links with Android's native share picker from the share panel or a thumbnail's long-press menu. (#1178)

  - Browse phone tabs with real page previews, hold for actions, and drag to rearrange tabs on phones and tablets. (#1179)
  - You can now add optional light and dark theme selectors through the Quick Settings customizer. They appear when using System Default and are not added by default. (#1175)
  - Configure left and right video swipes to adjust brightness, volume, or playback speed on mobile, with an optional full-brightness setting for fullscreen playback. (#1201)
  - Ask for confirmation before opening all synced tabs from another device. (#1211)
  - Hide a channel’s videos, Shorts, live streams, or posts directly from the subscription feed’s three-dot menu. (#1216, #1217)
  - Pull down to refresh pages in the Android app, with an option to disable the gesture. (#1225, #1226)
  - Copy complete YouTube playlists into editable local playlists, then add missing videos from the source whenever you choose. (#1227, #1228)
  - When autoplay is off, finished videos show a darkened poster with recommended videos and hide end-screen annotations. (#1231)
  - Videos marked as seen now sync across devices when history sync is enabled with enhanced privacy and a supporting sync server. (#1208, #1209)
  - Mobile now supports settings for tab position, selection after closing, startup restoration, and remembering back/forward navigation history. (#1236)
  - Android now supports moving Settings to the header, voice-over translation, choosing the app font, and adjusting UI Scale from 75% to 150%. (#1242)
  - Wait for lost connections to recover, with a reconnecting banner and a brief green “Back online” confirmation, without repeated API error notifications. (#1239)

  - Unseen subscription posts can now be marked as seen from their options menu. (#1249)
  - Android now supports HTTP, HTTPS and SOCKS proxies for playback, downloads and background requests, with no direct fallback when the proxy fails. (#1240)
  - Faster startup when restoring many loaded tabs, especially on slower CPUs. (#1252)
  - Set upcoming video preloads to 0 to use only manual playlist preloading, and run up to 32 concurrent preloads. (#1235, #1237)
  - Desktop startup now shows a themed splash with a continuous loading bar and a curtain reveal when the app is ready. (#1256)
  - See repeat count and time spent below looping videos, with an option to hide the stats in Distraction Free settings. (#1248)
  - Moved the sidebar subscription visibility setting from Distraction Free settings to Appearance → Customize navigation. (#1206)

  Fixed bugs

  - Restored network access in Windows portable builds. (#1163, #1165)
  - Fixed touch reordering in navigation and quick settings customization, including scrolling to offscreen items, and disabled reset buttons when already at defaults. (#1167)
  - White secondary buttons now match the visible size of colored buttons. (#1173)
  - Fix the Android crash when pairing another device by using a native QR scanner. Android 8 or newer is now required. (#1184)
  - Fixed mobile page scrolling around the chapters panel and added long-press actions to subscription feed tabs. (#1190)
  - Settings, Downloads, About, and the profile manager now stay maximized on phones in landscape and on tablets. (#1177)
  - Fixed saved playback positions resetting when leaving a video during startup. (#1194)
  - Fixed a profile sync error that could interrupt synchronization when connecting a second device. (#1171, #1172)
  - Fixed history duration badges showing fractional seconds and long decimal fragments. (#1191, #1192)
  - Hide the subscription settings arrow for channels you are not subscribed to in the active profile. (#1166)

  - Fixed screenshot copying and file exports on Android, including automatic screenshot saving to the folder selected in settings. (#1203)
  - Phone video and Shorts grids now show two columns at the default thumbnail size, with smaller cards and a full-width maximum. (#1214)
  - Avoid extra SABR startup waits and keep video thumbnails visible during countdowns. (#1221)
  - Restored spacing between community-post images and the like and comment row. (#1229)
  - Removed duplicate copy-link and embedded-player actions from video menus, made three-dot menus easier to use on phones, and kept video actions inside narrow layouts. (#1230)
  - The playlist video counter now sits below the playlist title without overlapping it. (#1195, #1198)
  - Playback speed changes and resets now show a speedometer icon beside the multiplier. (#1244)
  - Changelog images now keep their correct proportions on mobile and desktop. (#1247)
  - Android encrypted sync now honors its transfer timeout instead of failing after 30 seconds. (#1251)
  - Sync now warns when destructive changes block it, identifies the affected items before confirmation, and restores previously enabled automatic sync after a successful retry. Existing users with automatic sync off receive a dismissible notice with an option to enable it again. (#1253)

  - Fixed “Mark all as seen” being disabled in the tabbed New subscriptions feed while another feed refreshes. (#1241)
  - Fixed metadata history missing thumbnail changes when the image URL stays the same. (#1210)
  - YouTube Mix playlists now load through Invidious, and unknown video counts show an infinity indicator instead of -1. (#1219, #1223)
  - New foreground tabs are selected immediately, and slow-loading tabs no longer steal focus after you switch elsewhere. (#1257)
  - Shorts mini players now hide duplicate controls and use a size comparable to normal videos when switching tabs. (#1243)
  - Fixed middle clicks starting autoscroll instead of opening videos while a new-tab animation is running. (#1259)
  - Fixed Shorts showing a pause button while paused after opening in a background tab. (#1261)
  - Fixed chapter centering, Shorts menu dismissal and completion tracking, phone Shorts controls, and startup tutorial keyboard focus. (#1264)
  - Keep the B repeat marker visible when it is set after a video ends. (#1265)
