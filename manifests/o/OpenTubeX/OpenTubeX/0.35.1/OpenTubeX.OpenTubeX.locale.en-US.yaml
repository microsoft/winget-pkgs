ReleaseNotes: |-
  Highlights

  - Play individual media links from yt-dlp-supported sites with basic metadata support and Twitch Chat support. (#1399, #1514)

  More improvements

  - Videos shared in posts now show channel avatars, matching the video grid. (#1471)
  - Reduce tab update overhead and redundant session writes, especially with many tabs open. (#1473)
  - Sync remote changes as they happen, transfer only changed collections, view account activity, and send videos to your other devices with a compatible sync server. (#1478)
  - Choose a tray icon palette or let it follow your OpenTubeX theme in Appearance settings. (#1474, #1475)
  - Automatic sync now batches tab and history updates and uses live notifications instead of periodic requests while connected. (#1485)
  - Find history videos using separated words or small typos, with a spinner while search results update. (#1502)
  - Sync watch statistics by default and switch between individual devices and combined totals. (#905, #1511)
  - Swipe the empty Android app bar to slide between loaded tabs. (#1516)
  - Import subscriptions, watch and search history, and playlists directly from a YouTube Takeout ZIP, choosing which data to include. (#1521)
  - Choose between frosted glass and classic player controls in Appearance (#1539)
  - Android pinch zoom now shows its zoom level and snaps to fill the fullscreen player when its edges glow. (#1529)
  - Remove unavailable videos from a local playlist after a scan, while keeping videos that could not be checked. (#1448, #1537)
  - Download media from supported web URLs using the Downloads dialog or an external media page. (#1550)

  Fixed bugs

  - Returning from picture-in-picture on Android now restores landscape fullscreen when playback entered PiP from that view. (#1472)
  - Fixed jerky scrolling when returning to the playing line after closing transcript search. (#1476)
  - Allow the history repair status banner to be closed after repair stops. (#1480)
  - Background tabs show loading immediately and wait for the active startup video to play before loading their content. (#1491)
  - Keep subscription items marked as seen during refresh and sync seen posts between devices. (#1492)
  - Fixed scrollbar thumbs moving out of position when changing animation speed. (#1494)
  - Restored the page scrollbar after leaving Full Window following fullscreen or Picture-in-Picture. (#1391, #1495)
  - Fixed custom Watch Later and Favorites playlists disappearing after restarting the app. (#1496, #1498)
  - Fixed premature timeouts during slow encrypted sync uploads and misleading subscription-settings activity after subscribing to a channel. (#1500)
  - Fixed the poster and recommendations remaining hidden after canceling autoplay. (#1503)
  - Fixed mobile Shorts controls, panel sizing, gestures, video information placement, and the tab organizer’s Close Tabs header. (#1518)
  - Fixed clipped controls and distorted loading placeholders for Shorts on landscape phones. (#1519)
  - Android Picture-in-Picture playback continues when reopening OpenTubeX from the home-screen icon. (#1523)
  - Prevent a black rectangle from appearing above the Android mini player while scrolling. (#1528)
  - Fixed recurring built-in video extraction failures caused by QuickJS stack exhaustion on Android and desktop. (#1527)
  - Fixed history entries showing January 1, 1970 when a video's publication date is unavailable. (#1531)
  - Keep the Android status bar visible after swiping down from a fullscreen video. (#1524)
  - Channel pages keep the loading indicator visible until their videos have loaded. (#1548)
  - Keep the quick playback speed bar from jumping backward while dragging it on Android during playback. (#1522)
