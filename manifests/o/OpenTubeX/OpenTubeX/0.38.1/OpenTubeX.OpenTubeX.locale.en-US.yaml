ReleaseNotes: |-
  New features

  - Follow conferences on media.ccc.de, search its talks, and watch them like media from the other supported platforms. Conference links open their page in the app. (#3192, #3194)
  - Subscription imports can sort channels into groups, from group names after the channel title in a .csv file or from the folders of an .opml file. The group editor can also select or clear all channels matching a search. (#3183)
  - The player can take timestamp notes once you enable them in the player settings: press N or use the player menu to write a note that links to the current moment, then copy it as Markdown or add it to an Obsidian vault on desktop. (#3183, #3225)
  - The app font setting now includes Libron, a serif font designed for comfortable reading. (#3077, #3202)
  - Any video comment can now be watched for replies with the bell button next to it, also without a YouTube account, and comments you post are watched automatically. The comment settings list the watched comments, and selecting one opens it highlighted. (#3209)
  - The extra thumbnail action button can now play a video next, add it to the queue, open it in a background tab, or mark it as seen. (#3198)
  - Playlists that remove videos once watched can use their own removal threshold instead of the watched percentage threshold from the Privacy settings. (#3216, #3227)

  Improvements

  - With autoplay on, the next and previous buttons and media controls, including Bluetooth and car controls, now skip between recommended videos outside a playlist. (#3180, #3189)
  - Searching for the address of a Twitch, SoundCloud, Odysee, Rumble, or PeerTube channel now opens its channel page instead of playing it. Links to Twitch, SoundCloud, Odysee, and Rumble channels in About tabs and descriptions open the channel page too. (#3190, #3193)
  - Number fields have − and + buttons that work the same in every browser when you use a mouse. Firefox no longer treats letters typed into number fields as an empty value. (#3187)
  - Long comment sections below a video no longer slow down each time you load more comments. (#3211)
  - Tapping outside the open search on phones now just closes it, instead of also opening whatever was underneath. (#3218, #3220)
  - yt-dlp now ignores its configuration files, so a file in the download folder can no longer change what it does. Set download options in Additional yt-dlp arguments instead. (#3229)
  - The mini player now has previous and next buttons and a progress bar you can click or drag to seek. (#3231, #3232)
  - Channel pages from platforms other than YouTube open faster, and going back to one shows it right away, where you left off. Refreshing followed PeerTube channels no longer waits for slow instances. (#3240)

  Fixed bugs

  - Importing a file of the wrong kind no longer freezes the app. Choosing FreeTube's subscription cache as a subscriptions file now explains which file to pick instead. (#3171, #3174)
  - The queue keeps playing the next video while the window is minimized. (#3176, #3178)
  - High-quality videos no longer stop with a playback error after playing for a while. (#3195, #3196)
  - Videos in background tabs, such as ones you open in the background or tabs restored at startup, load about twice as fast again, and use much less CPU while you watch something else. (#3188, #3200)
  - Clicking a tab switches to it again when the custom title bar is turned on. (#3203, #3206)
  - Subscription Shorts keep loading, in date order, while YouTube's RSS feeds are down or rate limited, instead of listing channels that could not be refreshed. (#3222)
  - The Share Video button next to a Short now opens the full share menu instead of a cut-off panel. (#3235)
