ShortDescription: Open source electrical CAE editor for schematics, reports and panel layout in 3D
Description: |-
  OpenECraft is an open source electrical CAE editor: device-oriented schematics with live cross references, live reports and panel layout in 3D with wiring and mounting assistants.
  Projects export to PDF, DXF / DWG and SVG, the panel to STEP, IGES, JT and glTF.
  The setup installs the editor; the parts manager, the command line and MCP server for scripts and AI agents and the parts and project servers are optional components.
  Available in English, German, French, Spanish and 16 further languages.
