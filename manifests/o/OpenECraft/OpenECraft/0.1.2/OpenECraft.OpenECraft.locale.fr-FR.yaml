PackageIdentifier: OpenECraft.OpenECraft
PackageVersion: 0.1.2
PackageLocale: fr-FR
Publisher: OpenECraft
PackageName: OpenECraft
License: MIT OR Apache-2.0
ShortDescription: Éditeur de CAO électrique open source pour les schémas, les rapports et l'implantation d'armoires en 3D
Description: |-
  OpenECraft est un éditeur de CAO électrique open source : schémas orientés appareils avec renvois en direct, rapports en direct et implantation d'armoires en 3D avec assistants de câblage et de montage.
  Les projets s'exportent en PDF, DXF / DWG et SVG, l'armoire en STEP, IGES, JT et glTF.
  Le programme d'installation installe l'éditeur ; le gestionnaire d'articles, la ligne de commande et le serveur MCP pour les scripts et les agents IA ainsi que les serveurs d'articles et de projets sont des composants optionnels.
  Disponible en français, anglais, allemand, espagnol et 16 autres langues.
ManifestType: locale
