PackageIdentifier: OpenECraft.OpenECraft
PackageVersion: 0.1.2
PackageLocale: es-ES
Publisher: OpenECraft
PackageName: OpenECraft
License: MIT OR Apache-2.0
ShortDescription: Editor de CAE eléctrico de código abierto para esquemas, informes y el montaje de armarios en 3D
Description: |-
  OpenECraft es un editor de CAE eléctrico de código abierto: esquemas orientados a equipos con referencias cruzadas en vivo, informes en vivo y montaje de armarios en 3D con asistentes de cableado y de montaje.
  Los proyectos se exportan a PDF, DXF / DWG y SVG, el armario a STEP, IGES, JT y glTF.
  El instalador instala el editor; el gestor de artículos, la línea de comandos y el servidor MCP para scripts y agentes de IA y los servidores de artículos y de proyectos son componentes opcionales.
  Disponible en español, inglés, alemán, francés y 16 idiomas más.
