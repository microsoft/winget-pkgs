License: MIT OR Apache-2.0
ShortDescription: Quelloffener Elektro-CAE-Editor für Stromlaufpläne, Auswertungen und den Schaltschrankaufbau in 3D
Description: |-
  OpenECraft ist ein quelloffener Elektro-CAE-Editor: gerätebezogene Stromlaufpläne mit Live-Querverweisen, Live-Auswertungen und der Schaltschrankaufbau in 3D mit Verdrahtungs- und Montageassistenten.
  Projekte werden als PDF, DXF / DWG und SVG exportiert, der Schaltschrank als STEP, IGES, JT und glTF.
  Das Setup installiert den Editor; die Artikelverwaltung, die Kommandozeile und der MCP-Server für Skripte und KI-Agenten sowie der Artikel- und der Projektserver sind optionale Komponenten.
  Verfügbar auf Deutsch, Englisch, Französisch, Spanisch und in 16 weiteren Sprachen.
