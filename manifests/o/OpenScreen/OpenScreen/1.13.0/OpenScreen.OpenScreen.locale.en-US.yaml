ShortDescription: Desktop screen recorder with built-in editor
Description: "OpenScreen turns a raw screen recording into a finished product demo or walkthrough. Record a window or the whole screen with microphone and system audio, then edit on a timeline: automatic or manual zooms that follow the cursor, wallpapers and backgrounds, a webcam overlay, motion blur, crop, trim and speed control, and text, arrow or image annotations. Captions are transcribed on-device with no upload and remain editable, and an optional AI assistant applies edits you describe in chat using your own API key. Export to MP4 or GIF, rendered and encoded on the GPU with an automatic CPU fallback. Free for personal and commercial use, with nothing behind a paywall."
