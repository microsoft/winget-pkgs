ShortDescription: A Pomodoro timer for your terminal that keeps track of what you work on.
Description: |-
  Focusoro is a free Pomodoro timer for your terminal that keeps track of what you work on. You choose how much time each topic gets a day, and Focusoro keeps the record of every session and of how close you are to today's and this week's goals. Tasks, notes, a calendar and a report of your progress are there when you want them.
  There is no account and no cloud of ours. Your data is plain files on your computer, or in a folder you choose to sync with Dropbox, iCloud Drive or another service.
