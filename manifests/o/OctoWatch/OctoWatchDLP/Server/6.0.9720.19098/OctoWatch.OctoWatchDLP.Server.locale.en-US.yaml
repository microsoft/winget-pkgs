Description: |-
  OctoWatch Server is the On-Premise edition of OctoWatch DLP by KOLIBRI LLC. It deploys Admin Console, monitoring services, and Web Console hosting on a Windows server so organizations can run employee monitoring and endpoint DLP without sending telemetry to a vendor cloud.

  Typical use: regulated or sovereignty-sensitive teams that need activity evidence, policy alerts (Risks), and Grabber-based Windows / RDS coverage after the Server is configured. Microsoft SQL Server 2014+ must be provided separately. The installer may require internet access while Windows enables IIS features through DISM.

  Commercial shareware with a 14-day trial (up to 15 users) from the vendor download page. For authorized employer use on company endpoints. Not affiliated with Octo Browser.
