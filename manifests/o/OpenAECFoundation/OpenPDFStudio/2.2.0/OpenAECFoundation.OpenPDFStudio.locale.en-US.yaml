ShortDescription: Free, open-source PDF viewer and annotation editor for construction drawings
Description: |-
  Open PDF Studio is a free, open-source desktop PDF viewer and annotation editor built for the architecture, engineering and construction (AEC) world.
  Annotate, measure and mark up large-format drawings, place parametric building symbols (walls, beams, steel sections, doors and windows), draw with object snapping and scale regions, fill forms, edit PDF text, take off quantities, and save everything back into the PDF as standard annotations.
  Available in 39 languages, with a built-in MCP server for AI assistants.
