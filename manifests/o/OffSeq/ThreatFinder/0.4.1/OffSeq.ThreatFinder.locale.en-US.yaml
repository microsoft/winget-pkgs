ShortDescription: Runtime vulnerability scanner that finds CVEs in the services actually running on a host and ranks them by network exposure.
Description: |-
  threat-finder finds the vulnerable software actually running on a host and tells you which findings are network-reachable.
  It resolves each running service, and optionally every installed package, to a Package-URL or CPE and matches it against the OffSeq Radar catalog with ecosystem-native version rules.
  On Windows it reads services, listening ports, installed software and pending Windows Update security patches through the built-in PowerShell. Reports as a terminal summary, JSON or SARIF, with VEX in OpenVEX or CycloneDX.
