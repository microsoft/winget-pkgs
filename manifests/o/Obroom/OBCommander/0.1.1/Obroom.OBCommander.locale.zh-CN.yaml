ShortDescription: 快速、便携的 Windows 双栏文件管理器，内存占用约 6.5 MB，单个 exe 约 5 MB，Total Commander 风格。
Description: |-
  OB Commander 是一款快速、便携的 Windows 双栏文件管理器。
  资源占用少：内存约 6.5 MB，空闲时不占 CPU，单个 exe 约 5 MB，不写注册表。
  文件操作可撤销 / 重做，支持文件夹大小、重复文件查找、Everything 搜索、标签页、文件夹树、批量重命名和校验和。
  专业版功能（可免费试用 30 天）：即时预览、比较目录、压缩包当文件夹浏览、SFTP 远程标签页和自定义命令。
  个人非商业使用免费；商业使用需要购买授权。
