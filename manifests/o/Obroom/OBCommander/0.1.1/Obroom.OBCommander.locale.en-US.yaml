ShortDescription: A fast dual-pane file manager for Windows that runs in about 6.5 MB of RAM. One portable 5 MB exe, an alternative to Total Commander.
Description: |-
  Faster. Lighter. More focused.
  All the clutter stripped away, leaving a dual-pane experience that is just right.

  OB Commander is a portable dual-pane file manager for Windows, in the spirit of Total Commander.
  Light on resources: about 6.5 MB of RAM, no CPU use when idle, one exe of about 5 MB, nothing written to the registry.
  Undo / redo for file operations, folder sizes, duplicate finder, Everything search, tabs, folder tree, batch rename and checksums.
  Pro features (30-day free trial): instant previews, compare directories, archives as folders, remote SFTP tabs and custom commands.
  Free for personal non-commercial use; commercial use requires a license.
