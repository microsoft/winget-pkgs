ReleaseNotes: |-
  Install
  Homebrew (macOS / Linux)
  brew install owayo/re-sar-ch/re-sar-ch
  winget (Windows)
  winget install owayo.reSARch
  Open a new terminal afterwards so that the updated PATH takes effect.
  Download
  Download resarch-<target>.tar.gz for your platform from the assets below (.zip on Windows), extract it and put resarch on your PATH. SHA256SUMS lists the checksums of all assets. On Linux distributions with an older glibc, use resarch-x86_64-unknown-linux-musl.tar.gz.
  curl -fLO https://github.com/owayo/re-sar-ch/releases/download/v26.10.102/resarch-aarch64-apple-darwin.tar.gz
  tar -xzf resarch-aarch64-apple-darwin.tar.gz
