ReleaseNotes: |-
  depup 26.8.103
  Multi-language dependency updater CLI tool.
  Installation
  Homebrew (macOS/Linux)
  brew install owayo/depup/depup
  Manual Download
  Download the appropriate binary for your platform and add it to your PATH.
  macOS (Apple Silicon)
  curl -L https://github.com/owayo/depup/releases/download/v26.8.103/depup-aarch64-apple-darwin.tar.gz | tar xz
  sudo mv depup /usr/local/bin/
  macOS (Intel)
  curl -L https://github.com/owayo/depup/releases/download/v26.8.103/depup-x86_64-apple-darwin.tar.gz | tar xz
  sudo mv depup /usr/local/bin/
  Linux (x86_64)
  curl -L https://github.com/owayo/depup/releases/download/v26.8.103/depup-x86_64-unknown-linux-gnu.tar.gz | tar xz
  sudo mv depup /usr/local/bin/
  Linux (ARM64)
  curl -L https://github.com/owayo/depup/releases/download/v26.8.103/depup-aarch64-unknown-linux-gnu.tar.gz | tar xz
  sudo mv depup /usr/local/bin/
  Windows
  Download depup-x86_64-pc-windows-msvc.zip, extract, and add to PATH.
