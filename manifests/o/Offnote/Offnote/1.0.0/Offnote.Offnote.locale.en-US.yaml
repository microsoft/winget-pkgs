ShortDescription: A scratchpad for notes you are going to throw away. Hotkey, type, done.
Description: |-
  Offnote opens over any app with a global hotkey and takes plain text. It does math and unit
  conversions inline as you type, holds timers and checklists, turns screenshots into text locally,
  and hands the rare note worth keeping to Obsidian or Markdown. Notes live in one local SQLite file;
  there is no account, no telemetry and no built-in AI. 7-day trial with everything unlocked, then a
  one-time $5 licence.
