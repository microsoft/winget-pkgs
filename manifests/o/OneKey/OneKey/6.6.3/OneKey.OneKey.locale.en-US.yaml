ReleaseNotes: |-
  ### ✨ New Features
  • With a zero balance in Swap or stock trading, tap Deposit to Trade to open the Receive page. Your balance refreshes when you return
  • Choose a quote provider in Private Send and sort by amount received, network fee, or estimated completion time
  • Set trigger and stop prices for Perps TWAP orders, now lasting up to 7 days
  • Choose to show your nickname and avatar on some invite pages, with your nickname partially hidden
  ### 💎 Improvements
  • Address risk checks include a risk score, exposure details, and risk category explanations
  • Reorganized token switching on Market detail pages into Favorites, Stocks, and Tokens, each with its own categories
  • Market remembers your last category, network, and time range
  • Perps charts reload less often when switching accounts
  • Optimized DeFi position loading in All Networks mode
  ### 🐞 Bug Fixes
  • Fixed Solana transactions signed with a hardware wallet or QR code expiring too easily or staying pending
  • Fixed retrying a partially failed Solana bulk send stopping with an error; already-sent transactions are now skipped
  • Fixed Prime credit card payments failing to complete
  • Fixed home screen asset totals not refreshing after deselecting networks in All Networks mode
  • Fixed the Tron resource card briefly showing 0/0 when switching accounts
  • Fixed token prices not refreshing after receiving a Swap quote
  • Fixed Swap privacy mode sometimes failing to find a provider after entering a recipient address
  • Fixed Max USDC swaps on Arc failing because no network fee was reserved
  • Fixed Perps liquidation estimates using outdated data
  • Fixed onboarding showing outdated firmware status after a failed or interrupted firmware update

  ---

  ### ✨ 新功能
  • Swap 及股票交易余额为 0 时，可点击「充值以交易」前往收款页，返回后自动更新余额
  • 隐私发送可选择报价渠道，并按到账金额、网络费或预计耗时排序
  • Perps TWAP 可设置触发及停止价格，最长执行时间延长至 7 天
  • 可选择在部分邀请页显示昵称及头像，昵称会部分隐藏
  ### 💎 改进
  • 地址风险检查新增风险评分、关联明细及风险类别说明
  • 重新整理 Market 详情页的代币切换，分为自选、股票及代币，各设分类
  • Market 保留上次选择的分类、网络及时间范围
  • 减少切换账户时 Perps 图表重新加载的情况
  • 优化「所有网络」模式下 DeFi 持仓的加载
  ### 🐞 问题修复
  • 修复使用硬件钱包或二维码签名 Solana 交易时容易过期失败，或一直停留在确认中
  • 修复 Solana 批量转账部分失败后重试会报错中止，已成功的交易现会跳过
  • 修复 Prime 信用卡付款无法完成
  • 修复「所有网络」模式下取消勾选网络后，首页总资产未即时更新
  • 修复切换账户时，Tron 资源卡片短暂显示 0/0
  • 修复 Swap 获取报价后，代币价格未即时更新
  • 修复 Swap 隐私模式下输入收款地址后，有时无法匹配服务商
  • 修复在 Arc 以最大数量兑换 USDC 时，因未预留网络费而导致失败
  • 修复 Perps 使用过期数据计算预估强平价格
  • 修复新手引导中固件升级失败或中断后，仍显示旧的固件状态
