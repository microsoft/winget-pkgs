ReleaseNotes: |-
  ### 💎 Improvements
  • Smoother account switching with reduced flickering in the home asset list and token icons
  • The wallet list now automatically scrolls to the selected wallet
  • When updating larger firmware files on Pro or Pro 2 over Bluetooth, the app now recommends using the desktop app over USB for faster updates
  • Faster Borrow page loading and immediate data refresh after switching accounts
  • Simplified Prime gift claiming
  ### 🐞 Bug Fixes
  • Fixed rejected transactions in some Solana DApps, including Jupiter Lend
  • Fixed discrepancies between estimated and actual liquidation prices in Perps
  • Fixed outdated Perps chart data after switching accounts and unexpected jumps in spot prices
  • Fixed a white screen that could appear after closing the Swap confirmation page early
  • Fixed firmware update dialogs staying open after completion and retries failing after cancellation
  • Fixed device verification and firmware update failures that could occur on Pro 2
  • Fixed the app occasionally getting stuck on the launch screen during a cold start

  ---

  ### 💎 改进
  • 优化账户切换体验，减少首页资产列表与代币图标闪烁，切换更流畅
  • 钱包列表自动定位至当前选中的钱包，方便查找
  • Pro 与 Pro 2 通过蓝牙升级较大的固件文件时，会提示使用桌面客户端通过 USB 升级，加快升级速度
  • 加快借币页面加载，切换账户后即时更新数据
  • 简化 Prime 礼品领取流程
  ### 🐞 问题修复
  • 修复部分 Solana DApp（如 Jupiter Lend）交易被拒绝的问题
  • 修复 Perps 预估强平价格与实际不符的问题
  • 修复 Perps 切换账户后图表仍显示旧数据，以及现货价格跳动的问题
  • 修复提前关闭 Swap 确认页后出现白屏的问题
  • 修复固件升级完成后弹窗未自动关闭，以及取消升级后无法正常重试的问题
  • 修复 Pro 2 在设备验证或固件升级时可能失败的问题
  • 修复 App 冷启动时偶尔卡在启动画面的问题
