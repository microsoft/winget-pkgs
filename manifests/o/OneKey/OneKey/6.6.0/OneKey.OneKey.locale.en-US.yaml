ReleaseNotes: "### ✨ New Features\r\n• Added Travel Mode on mobile, allowing you to temporarily hide wallets and transaction history and restore them when Travel Mode is turned off\r\n• Added Swap rebates：complete swaps through supported providers and view rebate records on the Referral page\r\n• Added multi-provider price comparison in Market, with the option to switch between quote providers\r\n• Swap now supports adjusting slippage directly from the order preview page\r\n• Added Ondo and xStocks tokenized stocks, with support for searching by company name\r\n• Prime now supports exporting transaction history to CSV, with filters for account, network, and date range\r\n• Improved KeyTag backup flow\r\n• Perps now supports position increases, order chasing, and quick limit-price presets\r\n• Perps now shows funding rate trends and funding fee details for open positions\r\n• Perps trading pages now support custom chart layouts\r\n### 💎 Improvements\r\n• Upgraded hardware wallet interactions：PIN entry now defaults to the device, with refreshed connection prompts and guidance\r\n• Enhanced transaction safety with Bitcoin signing output checks, plus risk warnings and approval management for more networks\r\n• BTC swaps now show a warning when slippage is below 1%, with a one-tap option to set it to 1%\r\n• Enhanced tokenized stock information with token descriptions and FAQs on detail pages, plus market-closed notices during trading\r\n• Simplified Swap fee information：provider fees are now included in the quote instead of shown separately\r\n• Improved Perps order guidance and order book switching speed\r\n• Redesigned the Receive page with estimated arrival times and shareable receive images\r\n• Improved overall performance for smoother list scrolling and faster page loading\r\n### 🐞 Bug Fixes\r\n• Fixed an issue where manually added credential tokens could be counted twice in total assets\r\n• Fixed an issue where total assets in the account selector did not match the home page\r\n• Fixed incorrect profit and loss displays for some Perps spot tokens\r\n• Fixed an issue where the USDT detail page still showed delisted networks\r\n• Fixed an issue where the network selector disappeared after creating a DOT wallet\r\n• Fixed content shifting and flickering while DeFi pages were loading\r\n• Fixed slow initial loading on the Swap tokenized stock page and Perps charts\r\n\r\n---\r\n\r\n### ✨ 新功能\r\n• 移动端新增旅行模式，开启后可临时隐藏钱包与交易记录，关闭后即可完整恢复\r\n• Swap 新增返佣功能，通过指定渠道完成兑换后，可在邀请页查看返佣记录\r\n• Market 新增多渠道比价，可自由切换不同报价渠道\r\n• Swap 支持在订单预览页直接调整滑点\r\n• 股票代币新增 Ondo 与 xStocks，并支持通过公司名称搜索\r\n• Prime 新增交易历史 CSV 导出，可按账户、网络及时间范围筛选\r\n• KeyTag 备份流程优化\r\n• Perps 新增加仓、追单及限价快捷价位\r\n• Perps 支持查看资金费率走势与持仓资金费明细\r\n• Perps 交易页支持自定义图表布局\r\n### 💎 改进\r\n• 升级硬件钱包交互流程，PIN 默认改为在设备上输入，并全面更新连接提示与操作引导\r\n• 强化交易安全提示，新增比特币签名输出检查，并支持更多网络的风险提示与授权管理\r\n• BTC 兑换滑点低于 1% 时新增提示，并可一键调整为 1%\r\n• 完善股票代币信息，详情页新增代币说明与 FAQ，交易时同步显示休市提示\r\n• 简化 Swap 费用信息，渠道费已包含在报价中，不再单独显示费用栏位\r\n• 优化 Perps 下单引导与订单簿切换速度\r\n• 收款页全面改版，新增预计到账时间与收款图分享\r\n• 提升整体性能，列表与页面加载更加流畅\r\n### 🐞 问题修复\r\n• 修复手动新增凭证代币后资产重复计算的问题\r\n• 修复账户选择器总资产与首页显示不一致的问题\r\n• 修复 Perps 部分现货代币盈亏显示错误的问题\r\n• 修复 USDT 详情页仍显示已下架网络的问题\r\n• 修复创建 DOT 钱包后网络选择器消失的问题\r\n• 修复 DeFi 页面加载时内容跳动与闪烁的问题\r\n• 修复 Swap 股票代币页与 Perps 图表首次加载过慢的问题"
