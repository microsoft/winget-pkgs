ReleaseNotes: "### 💎 Improvements\r\n• Improved the firmware update process：firmware is now fully downloaded before installation begins, with automatic Bluetooth reconnection and retries if the connection drops\r\n• Added a \"Check for updates\" option to hardware wallet error dialogs to quickly rule out outdated firmware\r\n• Trezor and Ledger wallets now display their actual device images instead of generic placeholders\r\n• Added helpful tips to DeFi protocol details, covering rewards, distribution, redemption, and more\r\n• Added source labels to Perps contract lists to distinguish markets from different providers\r\n• Made the entire DeFi home banner tappable for easier access\r\n### 🐞 Bug Fixes\r\n• Fixed issues affecting BTC transfers with Ledger wallets\r\n• Fixed an issue where reopening the custom recipient address selector in Swap could show a blank page and become unresponsive\r\n• Fixed an issue where tapping Max did not auto-fill the amount the first time the stock sell page was opened after restarting the app\r\n\r\n---\r\n\r\n### 💎 改进\r\n• 优化固件升级流程：升级前先完成固件下载，蓝牙中断时自动重连重试\r\n• 硬件钱包错误弹窗新增「检查更新」入口，可快速排查固件版本过旧导致的问题\r\n• Trezor/Ledger 钱包改为显示实际设备图，替代原有的通用图标\r\n• DeFi 协议详情新增说明提示，可查看奖励、发放与赎回等信息\r\n• Perps 合约列表新增来源标签，可区分不同来源的合约市场\r\n• 优化 DeFi 首页 Banner，整张卡片均可点击跳转\r\n### 🐞 问题修复\r\n• 修复 Ledger 钱包 BTC 转账的相关问题\r\n• 修复 Swap 中再次打开自定义收款地址选择器时页面空白、无法操作的问题\r\n• 修复重启 App 后，首次进入股票卖出页面点击 Max 未自动填入金额的问题"
