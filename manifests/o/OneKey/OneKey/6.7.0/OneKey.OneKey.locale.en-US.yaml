ReleaseNotes: |-
  ### ✨ New Features
  • Use Dust sweep to convert multiple small token balances on the same network into its native token in one go
  • Use a Keystone hardware wallet to receive funds and sign BTC, EVM, Solana, and Tron transactions
  • Perps charts now default to Original, which can show positions, orders, and buy/sell points. You can still switch back to TradingView
  • Use Reverse in Perps to flip a position to the opposite side at the same size with a market order
  • See the rewards you received as an invitee and their payout status on the new Perks tab of the Referral page
  ### 💎 Improvements
  • Entering a wrong password now brings up a gentler prompt, and canceling biometric authentication no longer shows an error
  • Swap shows a warning when you select a token with low liquidity or one you may not be able to sell
  • In All Networks mode, you can choose a network when receiving and switch networks on the Receive page
  • The Receive QR code now has the OneKey logo in the center
  • BTC shows only the default address type when other address types hold no assets
  • Replaced the risky approvals banner on the home screen with a reminder dot on More and Approvals
  • Added type, direction, and market filters to Perps Trades History
  • Redesigned the Referral page, with a new share card
  • When claiming the Prime included with Pro 2, you can log out and use a different OneKey ID
  • Added 20 wallet avatars
  ### 🐞 Bug Fixes
  • Fixed hardware error prompts covering the page and blocking an immediate retry
  • Fixed the hardware Genuine check failing when the phone or computer clock is inaccurate
  • Fixed hardware wallets occasionally getting stuck waiting for the device when opening a hidden wallet
  • Fixed Perps spot limit orders below the minimum amount still being submitted
  • Fixed search results not syncing after adding BTC to Favorites from Top coins in Market
  • Fixed the total sometimes leaving out DeFi assets when updating the Pro 2 device portfolio

  ---

  ### ✨ 新功能
  • 新增「小额兑换」，可将同一网络的多个小额代币一次兑换为原生代币
  • 支持 Keystone 硬件钱包，可收款及签名 BTC、EVM、Solana 和 Tron 交易
  • Perps 图表默认改用「原生版」，可显示仓位、订单及买卖点，也可切换回 TradingView
  • Perps 新增「反手」，可用市价单将持仓转为同等数量的反向持仓
  • 推荐页新增「福利」标签页，可查看受邀奖励及发放状态
  ### 💎 改进
  • 输错密码改为温和提示，取消生物识别不再显示错误
  • Swap 选择低流动性或可能无法卖出的代币时会显示提示
  • 「所有网络」模式下收款可选择网络，并可在收款页切换
  • 收款二维码中央改为 OneKey 标志
  • BTC 其他地址类型没有资产时，只显示默认类型
  • 首页风险授权横幅改为「更多」及「授权」上的提醒点
  • Perps「历史成交」新增类型、方向及市场筛选
  • 推荐页改版，新增分享卡片
  • 领取 Pro 2 附赠的 Prime 时，可退出登录并改用其他 OneKey ID
  • 新增 20 款钱包头像
  ### 🐞 问题修复
  • 修复硬件错误提示遮挡页面，无法立即重试
  • 修复手机或电脑时间不准确时，硬件正品验证失败
  • 修复硬件钱包打开隐藏钱包时，偶尔卡在等待设备
  • 修复 Perps 现货限价单低于最低金额时仍可提交
  • 修复在 Market「主流币」将 BTC 加入自选后，搜索结果未同步
  • 修复更新 Pro 2 设备资产概览时，总值有时未计入 DeFi 资产
