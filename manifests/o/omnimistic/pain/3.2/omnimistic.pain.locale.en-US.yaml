ShortDescription: A simple and modern project and package manager for C++
Description: PAIN (or pain) is a zero-configuration C++ project manager designed to simplify modern C++ development. It provides instant project scaffolding and seamless dependency management. It globally downloads libraries, links them, and auto-generates CMake files so that you can focus purely on coding.
