  ![Official release](https://img.shields.io/badge/Quality-Official_Release-brightgreen.svg?style=for-the-badge) [![GitHub Releases](https://img.shields.io/github/downloads/openorienteering/mapper/v0.9.6/total.svg?style=for-the-badge&label=Downloads)](https://github.com/OpenOrienteering/mapper/releases/tag/v0.9.6) [![Known issues](https://img.shields.io/badge/dynamic/json.svg?label=Known%20issues&query=%24.length&url=https%3A%2F%2Fapi.github.com%2Frepos%2Fopenorienteering%2Fmapper%2Fissues%3Flabels%3Dknown%2520issues%2520v0.9.6%26state%3Dall&style=for-the-badge&color=informational)](https://github.com/OpenOrienteering/mapper/issues?q=label:"known%20issues%20v0.9.6")

  [All changes since previous release build](https://github.com/OpenOrienteering/mapper/compare/v0.9.5...3eb773e) - Many thanks to 37 contributors!

  ## Enhancements

   * Updated translations.
   * New box zoom tool (GH-2360).
   * Improved contrast of some icons (GH-2357).
   * Map information tool (GH-2125).
   * Symbol set report tool (GH-2247).
   * Color editor shows color usage by symbols (GH-2181).
   * Adjust size of map notes window to content (GH-2272).
   * Some OCD import/export details (GH-1911, GH-1964, GH-1979).

  ## Fixed bugs

   * Restore exporting PDF vector files (GH-1914).
   * Simple course export as IOF XML (GH-1947).
   * OCD text framing quirks (GH-2418).
   * Various issues with OCD import/export (GH-1912, GH-2035, GH-2041, GH-2043, GH-2045, GH-2206, GH-2290).
   * Line rendering quirks (GH-2064).
   * Rendering of area cross-hatch pattern (GH-2101).
   * Rare crash triggers.
   * Rotated text couldn't be selected (GH-2368).
   * Font drop down list was illegible (GH-1928).
   * Symbol editor quirks (GH-2090, GH-2098, GH-2308, GH-2381).
   * Switch magnetic declination lookup from NOAA to BGS (British Geological Survey) (GH-2087).
   * Size calculation (GH-2309), setting dash points (GH-2154) for objects with combined symbols.
   * Various issues related to object tags (GH-2223, GH-2338, GH-2351, GH-2353, GH-2371).
   * Various issues related to templates (GH-1970, GH-2364, GH-2403, GH-2431).

  ## Deprecations

  This release is still based on the same software stack as 2021's v0.9.5, and so it stills supports old Windows, macOS and Android devices. The next releases must move to a modernized software stack and will drop support for old platforms which already lost vendor support.

  ## Sadly missing

  This release doesn't include new (current) IOF symbol sets.

  ## Package options

  Continuous integration build [3333](https://dev.azure.com/OpenOrienteering/Mapper/_build/results?buildId=3333), based on Superbuild [20250510](https://github.com/OpenOrienteering/superbuild/releases/tag/v20250510).

   *  Windows (7 and up): You can choose between an installer (`*.exe`) and a portable archive (`*.zip`).
      For most modern Windows installations, you should choose the **x64** packages.
   *  macOS (10.12 and up): You may need to run the app via Ctrl+Click the first time, in order to allow it to run despite coming from an "unknown source".
   *  Android (4.1 and up): For new installations on modern devices, you should choose the **arm64-v8a** package.
      The armeabi-v7a package should work for most older devices.
      Note that you will have to allow installation "from unknown sources".
      Android packages are also available from the IzzyOnDroid F-Droid Repository.

  Linux packages for major distribution continue to be provided [via OBS](https://software.opensuse.org/download.html?project=home%3Adg0yt&package=openorienteering-mapper). To automatically install dependencies (and new versions!), choose "add repository and install manually", instead of "grab binary packages directly".

