ShortDescription: Instant file search for all your drives, folder sizes with history, and an MCP server for AI assistants.
Description: |-
  Quickseek indexes every file on your NTFS and ReFS drives from the master file table and keeps the index live
  from the USN journal, so searching millions of files by name, path wildcards, size or date is instant.
  It shows a live folder size tree, keeps daily snapshots of folder sizes to show what grew or shrank,
  indexes network shares and other folders, searches file contents, and ships quickseek-mcp, an MCP server
  that lets AI assistants find files and free disk space. Installs a background service (so searches run
  unelevated), the window, the CLI and the MCP server. Detected AI assistants (Claude Code, Claude Desktop,
  Codex, Cursor, VS Code, Windsurf, Antigravity) are connected for the installing user; pass
  --custom "--no-mcp" to skip that. Everything stays on the PC: no telemetry, no network access.
