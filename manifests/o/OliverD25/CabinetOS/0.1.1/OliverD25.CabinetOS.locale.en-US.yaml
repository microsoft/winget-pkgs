ShortDescription: A fast dual-pane file manager for Windows 11 with a command palette and sandboxed extensions.
Description: |-
  CabinetOS is a file manager for Windows 11 that joins the dual-pane speed of
  Total Commander with the command palette and extensions of VS Code. A Rust
  core reads folders with the NT API and runs copy, move and delete jobs on
  per-disk queues; the WinUI 3 window only draws. Every action is a named
  command with a key, chords included. Plugins run as sandboxed WebAssembly,
  and tools such as Markdown Preview run in their own WebView2 processes.
