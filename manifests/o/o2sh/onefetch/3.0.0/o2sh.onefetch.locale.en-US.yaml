ReleaseNotes: |-
  What's Changed
  Breaking Changes
  JSON/YAML output (-o json, -o yaml) now contains raw values instead of display text:
  - creationDate and lastChange are always ISO 8601 timestamps ("2018-09-14T18:51:00Z"). Previously they were relative text ("8 years ago") unless --iso-time was passed.
  - repoSize is a number of bytes (2161012) instead of formatted text ("2.06 MiB").
  - dependencies is replaced by numberOfDependencies (number) and manifestType ("Cargo", "Npm", "PyProject", or null when there is no manifest).
  onefetch-manifest crate: ManifestType has a new PyProject variant.
  Security Fix
  - Fix terminal escape sequence injection through repository data (CVE-2026-100866) By @carfeii in #1829
  New Features
  - Add pyproject.toml manifest support (PEP 621) by @ChrisJr404 in #1842
  - Update Elixir colors to the official brand color by @georgeguimaraes in #1868
  Bug Fixes
  - Use the default remote for the repository URL by @o2sh in #1873
  - Exit with clear error message when repository uses reftable by @Jorge-Polanco-Roque in #1853
  Chores
  - Separate repository info building from styling by @o2sh in #1880
  CI / CD
  - Remove manual homebrew release in favor brew bot auto bump by @o2sh in 81c49b8
  New Contributors
  - @Jorge-Polanco-Roque made their first contribution in #1853
  - @georgeguimaraes made their first contribution in #1868
  - @ChrisJr404 made their first contribution in #1842
  - @carfeii made their first contribution in #1829
  Full Changelog: 2.28.1...3.0.0
