ReleaseNotes: |-
  SECURITY
  - auth/cert: Add resolve path canonicalization to CRL paths. GHSA-736f-82w7-hj22. [GH-4323]
  - secrets/approle: Add resolve path canonicalization in Role ID paths. GHSA-736f-82w7-hj22. [GH-4323]
  - secrets/identity: Ensure client_type=public is denied with client_credentials=true in the OIDC provider. GHSA-q824-44ff-f5j5. [GH-4323]
  - secrets/ssh: Deny wildcards (*) in SSH certificate identity templating by default. Configurable via the allow_wildcards_in_identity_templates parameter. GHSA-h76r-48x5-36hg. [GH-4323]
  - secrets/transit: Ensure imported key backup does not allow clobbering arbitrary keys through path traversal. GHSA-5pmx-2p74-x478. [GH-4323]

  IMPROVEMENTS
  - ui: Add fields to configure external keys in PKI. [GH-4306]

  BUG FIXES
  - core: Fix rate limit exempt paths being unresponsive during post-unseal. [GH-4293]
  - core: Fix sudo-capable tokens failing sudo checks on their final use. [GH-4158]
  - core/plugins: Fix transactions started by external plugins failing when using the PostgreSQL storage backend. [GH-4177]
  - core/plugins: Ensure plugin backend reloading with scope=global actually performs a cluster-wide reload. [GH-4221]
  - core/plugins: Avoid immediate plugin reloads on standbys after tuning a mount's version and wait for a direct node-local or scope=global reload instead. [GH-4221]
  - core/namespaces: Fix namespace deletion failing after upgrading to v2.7.x from an earlier version. [GH-4201]
  - auth/oidc: Fix login in direct callback mode by including the namespace in the redirect URI. [GH-4199]
  - secrets/pki: Fix intermediate CSR generation for type kms not using the provided external key and generating an internally-stored private key instead. [GH-4309]
  - kms/transit: Respect the version parameter when exporting a public key instead of fetching the latest version's one. [GH-4297]
  - ui: Fix blank "key bits" dropdown when generating an ML-DSA key in PKI. [GH-4305]

  What's Changed
  - Do not attempt singleton mount backend reloads (#4201 by @wslabosz-reply) backported by @phil9909 in #4247
  - Fix gRPC transaction context (#4177 by @satoqz) backported by @phil9909 in #4248
  - Fix: include missing namespace in OIDC direct callback (#4199 by @plnryv-reply) backported by @satoqz in #4274
  - Fix sudo-enforced request handling with single-use tokens (#4158 by @wslabosz-reply) backported by @satoqz in #4276
  - Improve backend reloading across a cluster (#4221 by @satoqz) backported by @satoqz in #4275
  - Backport dependencies, bump Go on v2.7.x by @satoqz in #4313
  - Update favicon mime type to image/svg+xml (#4303 by @ranneetcodes2020-create) backported by @satoqz in #4310
  - Bump container base images (#4312 by @satoqz) backported by @satoqz in #4316
  - Do not block sys/health while a standby becomes active (#4293 by @JAYKRISHNAN) backported by @satoqz in #4298
  - Update PKI UI for external keys (#4306 by @satoqz) backported by @satoqz in #4318
  - Fix ML-DSA key bits dropdown (#4305 by @satoqz) backported by @satoqz in #4319
  - Fix PKI intermediate + external keys (#4309 by @satoqz) backported by @satoqz in #4315
  - Bump github.com/openbao/go-kms-wrapping/kms/transit/v2 from 2.1.0 to 2.1.1 (#4297 by @satoqz) backported by @satoqz in #4321
  - Address security issues for v2.7.2 - release/2.7.x branch (#4323 by @cipherboy) backported by @cipherboy in #4324
  - Add release notes for v2.7.2 by @satoqz in #4326
