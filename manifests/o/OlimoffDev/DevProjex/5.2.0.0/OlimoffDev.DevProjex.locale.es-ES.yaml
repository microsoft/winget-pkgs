ShortDescription: 'DevProjex («de código a prompt») convierte carpetas y repositorios Git en contexto limpio para ChatGPT, Claude y agentes de IA: contador de tokens, ocultación de secretos y servidor MCP donde el agente sigue tus casillas. Local, sin telemetría.'
Description: |-
  DevProjex es una herramienta multiplataforma «de código a prompt» para Windows, Linux y macOS: una aplicación de escritorio que convierte cualquier carpeta o repositorio Git en contexto limpio y listo para la IA — estructura del proyecto, contenido de los archivos o ambos. Generador de contexto de la base de código, empaquetador de repositorios o conversor de código a prompt: se llame como se llame, la tarea es la misma — preparar código real para ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot o cualquier otro asistente o agente de IA, como Claude Code y Cursor, localmente en tu máquina.

  Resuelve un problema cotidiano del desarrollador: un proyecto real no cabe en una ventana de chat. Copiar archivos uno a uno no escala, y pegarlo todo de golpe revienta el límite de tokens — a menudo con claves de API, contraseñas y datos personales dentro. DevProjex empaqueta el repositorio completo — o un solo módulo — en un documento listo para la IA, muestra de antemano el número estimado de tokens y — con un interruptor — oculta los secretos detectados antes de que el texto salga de tu máquina.

  Si hasta ahora empaquetabas el código con herramientas de línea de comandos y querías una forma visual de hacerlo — aquí está: un árbol de archivos con casillas, búsqueda y filtros por nombre, y una vista previa en vivo que se actualiza mientras seleccionas. Las marcas en la barra de desplazamiento muestran coincidencias de búsqueda y cada hallazgo oculto de un vistazo — siempre ves exactamente lo que envías.

  Smart Ignore elimina dependencias, cachés y artefactos de compilación automáticamente — según indicios reales del proyecto, de modo que los monorepos se filtran correctamente y las carpetas de código fuente nunca se ocultan solo por su nombre. El filtrado Git va más allá de .gitignore: incluye solo los archivos rastreados, o reduce la selección a los archivos preparados (staged), a todos los cambios actuales o al diff entre dos refs — ideal para enviar a la IA solo aquello en lo que trabajas ahora mismo. Carpetas raíz, tipos de archivo, exclusiones y archivos individuales se conmutan de forma independiente.

  El ocultado de secretos sustituye claves de API, tokens, contraseñas y cadenas de conexión detectadas directamente en el resultado — con reglas basadas en Gitleaks. El archivo y el código circundante permanecen en su sitio: un secreto nunca te cuesta el archivo entero, un falso positivo se anula caso por caso en la vista previa, y cualquier otro valor se puede ocultar a mano, solo durante la sesión o de forma permanente para el proyecto, sin guardar el original. La ocultación opcional de datos privados abarca correos, direcciones IP y MAC, teléfonos y rutas de usuario. En CI, la comprobación de hallazgos puede detener un pipeline antes de la fuga — los valores nunca se imprimen.

  La compresión de código ahorra tokens donde importa: declaraciones, firmas, campos y estructura de clases quedan intactos mientras los cuerpos de los métodos se vacían — el código fuente puro queda unas tres veces más pequeño. La eliminación de comentarios y líneas en blanco cubre 20 paquetes sintácticos: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript y más. Toda transformación se aplica solo al resultado: tus archivos nunca cambian.

  Un motor, cuatro formas de trabajar. La GUI ofrece el árbol visual y la vista previa. El espacio de trabajo de terminal (TUI), centrado en el teclado, lleva el mismo flujo a sesiones SSH y servidores, con una paleta de acciones con búsqueda. La CLI automatiza scripts y CI: analiza, busca o exporta directamente desde una URL de GitHub, recibe listas de archivos por tubería desde git diff y ofrece autocompletado para bash, zsh, fish y PowerShell. El servidor MCP integrado (Model Context Protocol) da a agentes de IA como Claude Code, Codex, Cursor y VS Code acceso de solo lectura a tu proyecto: el agente busca en el código y ve al instante a qué función pertenece cada coincidencia, lee una sola función por su nombre o varios archivos en una sola petición, y recibe los resultados grandes por partes. El servidor nunca sale de las carpetas que permitas, abre repositorios remotos por URL solo si lo autorizas, y su ocultación de secretos está siempre activa y no se puede desactivar.

  Trabaja codo con codo con tu agente, sin rodeos. Conecta un agente en un solo paso — desde el menú MCP de la aplicación o con el comando mcp connect en el espacio de trabajo de terminal — y elige un modo: «Live context» o «Estándar». En el modo Live context, el agente sigue las casillas del árbol de archivos de DevProjex: los archivos y carpetas marcados se convierten en su área de trabajo, y cuando cambias las casillas, el agente ve la nueva selección en su siguiente petición — sin reiniciar ni copiar y pegar. Los filtros de la ventana — tipos de archivo, exclusiones y modo Git — marcan el límite: lo que ocultan queda fuera del alcance del agente, mientras que cualquier otro archivo del proyecto se puede abrir por su nombre cuando el agente lo necesite. En el modo Estándar, el agente trabaja con todo el proyecto, sin depender de la ventana. Activa «Ver → Actividad del agente»: los archivos que ha recibido el agente se marcarán con ✦ en el propio árbol, y una descripción emergente mostrará cuántas veces los ha recibido; en el espacio de trabajo de terminal se marcarán con la letra A. Los archivos relacionados muestran de qué depende un archivo y qué depende de él.

  El registro del agente («MCP → Registro…») guarda el historial de cada sesión en tu propio equipo: el cliente y su versión, el modo, el número de llamadas, el tamaño de las respuestas, los tokens estimados, los archivos entregados, el número de valores ocultados y la duración — y, para cada llamada, sus parámetros, su resultado y sus avisos. Exporta cualquier sesión como informe en Markdown o JSON — para una auditoría, para tu equipo o simplemente para ver exactamente qué recibió el agente. Tu código, los secretos detectados y el texto de las búsquedas nunca entran en el registro.

  Todo está pensado para bases de código grandes: escaneo rápido, búsqueda y filtros, métricas de archivos, líneas, caracteres y tokens estimados — más un presupuesto de tokens que encaja los archivos más grandes en la ventana de contexto de un modelo y muestra qué se incluyó, mientras que el ranking experimental ordena los archivos por importancia o por cercanía a los que elijas, para que el presupuesto vaya primero a lo que importa. Copia el resultado al portapapeles o expórtalo como ASCII, Markdown, JSON y XML — o guarda los archivos seleccionados como copia limpia del proyecto, carpeta o archivo ZIP: para revisiones de código, enseñanza o entregar un módulo a un compañero. Los perfiles locales recuerdan la configuración de cada proyecto; las herramientas Git integradas clonan repositorios por URL, cambian de rama y actualizan la caché. Temas claro, oscuro y del sistema, atajos nativos de la plataforma, cancelación segura de operaciones largas y una interfaz en 20 idiomas.

  DevProjex funciona localmente y nunca cambia tus archivos — de solo lectura por diseño. Sin telemetría, sin nube, sin cuenta. Para servidores y CI hay compilaciones sin interfaz gráfica (headless) y una imagen de Docker. Una sola aplicación de escritorio multiplataforma para Windows, Linux y macOS, respaldada por más de 17 000 pruebas automatizadas, seleccionada para el App Showcase oficial de Avalonia UI y de código abierto en GitHub bajo Apache-2.0.

  Características principales:
  - Contexto de proyecto limpio para ChatGPT, Claude y otras IA
  - GUI, TUI, CLI y servidor MCP (Model Context Protocol) para agentes de IA
  - Live Context: tu agente de IA sigue las casillas del árbol
  - Ocultación de secretos a nivel de valor en el resultado
  - Conexión MCP en un paso: Claude Code, Codex, Cursor, VS Code
  - Vista previa en vivo que se actualiza mientras seleccionas
  - Registro del agente: qué archivos recibió cada cliente de IA
  - Archivos relacionados: qué usa un archivo y qué lo usa
  - Datos privados ocultos: correos, IP, rutas (opcional)
  - Compresión de código: código puro unas 3× más pequeño
  - Smart Ignore, .gitignore y modo de archivos rastreados
  - Filtros Git: archivos preparados, todos los cambios o diff entre refs
  - Abre repositorios Git remotos directamente desde una URL
  - Presupuesto de tokens: los archivos más grandes dentro de un límite
  - Herramientas MCP de solo lectura; ocultación no desactivable
  - Copia o exporta como ASCII, Markdown, JSON y XML
  - Exporta los archivos elegidos a carpeta o archivo ZIP
  - Búsqueda, filtros y métricas de líneas/caracteres/tokens
  - Quita comentarios y líneas vacías: 20 paquetes de lenguajes
  - Local, solo lectura, sin telemetría, 20 idiomas
ReleaseNotes: 'DevProjex 5.2 añade Live Context: tu agente de IA sigue las casillas del árbol de archivos y ve la nueva selección ya en su siguiente petición, mientras que los filtros de la ventana marcan el límite de su acceso. Claude Code, Codex, Cursor y VS Code se conectan en un solo paso — desde el menú MCP de la aplicación o con el comando devprojex mcp connect. El registro del agente muestra qué archivos y cuántos tokens recibió cada cliente, y exporta las sesiones en Markdown o JSON. Los archivos relacionados muestran de qué depende un archivo y qué depende de él, y el ranking experimental dedica el presupuesto de tokens primero a lo que importa. El servidor MCP encuentra declaraciones por su nombre, lee varios archivos y fragmentos en una sola petición y dice claramente qué encontró y qué se recortó. Linux estrena AppImage, y para servidores y CI llegan compilaciones sin interfaz gráfica (headless) y una imagen de Docker.'
InstallationNotes: Un solo ejecutable incluye GUI, TUI, CLI y servidor MCP. Ejecuta 'devprojex' en la terminal para el espacio de trabajo de teclado, 'devprojex help' para la referencia de la CLI, 'devprojex mcp connect . --client claude-code' para conectar un cliente de IA a un proyecto (también funcionan codex, cursor y vscode), o 'devprojex mcp --root .' para iniciar el servidor MCP.
