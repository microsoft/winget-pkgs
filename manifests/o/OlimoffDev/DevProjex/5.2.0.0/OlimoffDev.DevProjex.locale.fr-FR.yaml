ShortDescription: "DevProjex, l'app « code vers prompt », fait de tout dossier ou dépôt Git un contexte propre pour ChatGPT, Claude et les agents IA : compteur de tokens, masquage des secrets et serveur MCP où l'agent suit vos cases cochées. Local, sans télémétrie."
Description: |-
  DevProjex est un outil multiplateforme « code vers prompt » pour Windows, Linux et macOS : une application de bureau qui transforme n'importe quel dossier ou dépôt Git en contexte propre, prêt pour l'IA — structure du projet, contenu des fichiers ou les deux. Générateur de contexte de code, empaqueteur de dépôt ou convertisseur code-vers-prompt : quel que soit le nom, la tâche est la même — préparer du vrai code pour ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot ou tout autre assistant ou agent IA comme Claude Code et Cursor, localement sur votre machine.

  Il résout un problème quotidien du développeur : un vrai projet ne tient pas dans une fenêtre de chat. Copier les fichiers un par un ne passe pas à l'échelle, et tout coller en une fois dépasse largement la limite de tokens — souvent avec des clés d'API, des mots de passe et des données personnelles à l'intérieur. DevProjex regroupe le dépôt entier — ou un seul module — en un document prêt pour l'IA, affiche à l'avance le nombre estimé de tokens et — d'un seul interrupteur — masque les secrets détectés avant que le texte ne quitte votre machine.

  Si vous empaquetiez vos bases de code avec des outils en ligne de commande en rêvant d'une méthode visuelle — la voici : une arborescence de fichiers avec cases à cocher, recherche et filtres par nom, et un aperçu en direct qui se met à jour pendant la sélection. Des repères sur la barre de défilement signalent les correspondances de recherche et chaque élément masqué — vous voyez toujours exactement ce que vous envoyez.

  Smart Ignore supprime automatiquement dépendances, caches et artefacts de build — sur la base d'indices réels du projet, si bien que les monorepos sont filtrés correctement et qu'aucun dossier source n'est masqué sur son seul nom. Le filtrage Git va plus loin que .gitignore : n'incluez que les fichiers suivis, ou restreignez la sélection aux fichiers indexés (staged), à toutes les modifications en cours ou au diff entre deux refs — idéal pour n'envoyer à l'IA que ce sur quoi vous travaillez en ce moment. Dossiers racine, types de fichiers, exclusions et fichiers individuels se commutent indépendamment.

  Le masquage des secrets remplace les clés d'API, tokens, mots de passe et chaînes de connexion détectés directement dans le résultat — selon des règles issues de Gitleaks. Le fichier et le code environnant restent en place : un secret ne vous coûte jamais le fichier entier, un faux positif s'annule au cas par cas dans l'aperçu, et toute autre valeur peut être masquée à la main, pour la session ou durablement pour le projet, sans que l'original soit conservé. Le masquage optionnel des données privées cache e-mails, adresses IP et MAC, numéros de téléphone et chemins utilisateur. En CI, la vérification des détections peut faire échouer un pipeline avant qu'un secret ne soit publié — les valeurs elles-mêmes ne sont jamais affichées.

  La compression de code économise les tokens là où ça compte : déclarations, signatures, champs et structure des classes restent intacts tandis que l'implémentation des méthodes est omise — le code source pur devient environ trois fois plus petit. La suppression des commentaires et des lignes vides couvre 20 packs syntaxiques : C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript et plus encore. Chaque transformation ne s'applique qu'au résultat : vos fichiers ne changent jamais.

  Un moteur, quatre façons de travailler. L'interface graphique (GUI) offre l'arborescence visuelle et l'aperçu. L'espace de travail terminal au clavier (TUI) apporte le même flux aux sessions SSH et aux serveurs, avec une palette d'actions consultable. La CLI automatise scripts et CI : analyse, recherche et export directement depuis une URL GitHub, liste de fichiers transmise depuis git diff, complétion pour bash, zsh, fish et PowerShell. Le serveur MCP intégré (Model Context Protocol) donne aux agents IA comme Claude Code, Codex, Cursor et VS Code un accès en lecture seule à votre projet : l'agent cherche dans le code et voit aussitôt à quelle fonction appartient chaque correspondance, lit une fonction précise par son nom ou plusieurs fichiers en une seule requête, et reçoit les résultats volumineux par parties. Le serveur ne sort jamais des dossiers que vous autorisez, n'ouvre des dépôts distants par URL que si vous le permettez, et son masquage des secrets est toujours actif et impossible à désactiver.

  Travaillez main dans la main avec votre agent. Connectez un agent en une étape — depuis le menu MCP de l'application ou avec la commande mcp connect dans l'espace de travail terminal — et choisissez un mode : « Live context » ou « Standard ». En mode « Live context », l'agent suit les cases cochées de l'arborescence de DevProjex : les fichiers et dossiers cochés deviennent sa zone de travail, et dès que vous modifiez les cases, l'agent voit la nouvelle sélection à sa toute prochaine requête — sans redémarrage ni copier-coller. Les filtres de la fenêtre — types de fichiers, exclusions et filtrage Git — fixent la limite : ce qu'ils masquent reste hors de portée de l'agent, tandis que tout autre fichier du projet peut encore être ouvert par son nom quand l'agent en a besoin. En mode « Standard », l'agent travaille sur l'ensemble du projet, indépendamment de la fenêtre. Activez « Affichage → Activité de l’agent » : les fichiers reçus par l'agent sont marqués d'un ✦ directement dans l'arborescence, tandis qu'une info-bulle indique combien de fois il les a reçus ; dans l'espace de travail terminal, ils sont marqués de la lettre A. Les fichiers liés montrent de quoi dépend un fichier et ce qui dépend de lui.

  Le journal de l'agent (« MCP → Journal… ») conserve l'historique de chaque session directement sur votre ordinateur : le client et sa version, le mode, le nombre d'appels, la taille des réponses, les tokens estimés, les fichiers transmis, le nombre de valeurs masquées et la durée — ainsi que, pour chaque appel, ses paramètres, son résultat et ses avis. Exportez n'importe quelle session en rapport Markdown ou JSON — pour un audit, pour votre équipe ou simplement pour voir exactement ce que l'agent a reçu. Votre code, les secrets détectés et le texte des requêtes de recherche n'entrent jamais dans le journal.

  Tout est conçu pour les grandes bases de code : analyse rapide, recherche et filtres, métriques de fichiers, lignes, caractères et tokens estimés — plus un budget de tokens qui fait tenir les fichiers les plus volumineux dans la fenêtre de contexte d'un modèle et indique ce qui a été inclus, tandis qu'un classement expérimental ordonne les fichiers par importance ou par proximité avec ceux que vous choisissez, pour que le budget aille d'abord à l'essentiel. Copiez le résultat dans le presse-papiers ou exportez-le en ASCII, Markdown, JSON et XML — ou enregistrez les fichiers sélectionnés comme copie propre du projet, dossier ou archive ZIP : pour la revue de code, l'enseignement ou la transmission d'un module à un collègue. Les profils locaux mémorisent les réglages par projet ; les outils Git intégrés clonent des dépôts par URL, changent de branche et mettent à jour le cache. Thèmes clair, sombre et système, raccourcis clavier natifs, annulation sûre des opérations longues et une interface en 20 langues.

  DevProjex fonctionne localement et ne modifie jamais vos fichiers — en lecture seule par conception. Pas de télémétrie, pas de cloud, pas de compte. Des builds headless et une image Docker sont disponibles pour les serveurs et la CI. Une application de bureau multiplateforme pour Windows, Linux et macOS, adossée à plus de 17 000 tests automatisés, sélectionnée pour l'App Showcase officiel d'Avalonia UI et open source sur GitHub sous licence Apache-2.0.

  Fonctionnalités clés :
  - Contexte de projet propre pour ChatGPT, Claude et autres IA
  - GUI, TUI, CLI et serveur MCP (Model Context Protocol) pour agents IA
  - Live Context : votre agent IA suit vos cases cochées
  - Masquage des secrets au niveau des valeurs dans le résultat
  - Connexion MCP en une étape : Claude Code, Codex, Cursor, VS Code
  - Aperçu en direct mis à jour pendant la sélection
  - Journal de l'agent : les fichiers reçus par chaque client IA
  - Fichiers liés : ce qu'un fichier utilise et ce qui l'utilise
  - Masquage des données privées : e-mails, IP, chemins (option)
  - Compression de code : code pur environ 3× plus petit
  - Smart Ignore, .gitignore et mode fichiers suivis par Git
  - Filtres Git : fichiers indexés, toutes les modifications ou diff entre refs
  - Ouverture de dépôts Git distants directement par URL
  - Budget de tokens : les plus gros fichiers dans une limite
  - Outils MCP en lecture seule ; masquage non désactivable
  - Copie ou export en ASCII, Markdown, JSON et XML
  - Export des fichiers choisis en dossier ou archive ZIP
  - Recherche, filtres et métriques lignes/caractères/tokens
  - Suppression des commentaires et lignes vides : 20 packs de langages
  - Local, lecture seule, sans télémétrie, 20 langues
ReleaseNotes: "DevProjex 5.2 apporte Live Context : votre agent IA suit les cases cochées de l'arborescence et voit la nouvelle sélection dès sa toute prochaine requête, tandis que les filtres de la fenêtre fixent la limite de son accès. Claude Code, Codex, Cursor et VS Code se connectent en une étape — depuis le menu MCP de l'application ou avec la commande devprojex mcp connect. Le journal de l'agent montre quels fichiers et combien de tokens chaque client a reçus, et exporte les sessions en Markdown ou JSON. Les fichiers liés montrent de quoi dépend un fichier et ce qui dépend de lui, et le classement expérimental consacre d'abord le budget de tokens à l'essentiel. Le serveur MCP trouve les déclarations par leur nom, lit plusieurs fichiers et extraits en une seule requête, et indique clairement ce qui a été trouvé et ce qui a été tronqué. Linux dispose désormais d'une AppImage, et les serveurs et la CI de builds headless et d'une image Docker."
InstallationNotes: Un seul exécutable contient la GUI, la TUI, la CLI et le serveur MCP. Lancez 'devprojex' dans un terminal pour l'espace de travail au clavier, 'devprojex help' pour la référence CLI, 'devprojex mcp connect . --client claude-code' pour connecter un client IA à un projet (codex, cursor et vscode fonctionnent aussi), ou 'devprojex mcp --root .' pour démarrer le serveur MCP.
