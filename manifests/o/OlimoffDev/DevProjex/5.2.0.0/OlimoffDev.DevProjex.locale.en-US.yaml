ReleaseNotes: "DevProjex 5.2 adds Live Context: your AI agent follows the checkboxes in the file tree and sees the new selection on its very next request, while the window's filters set the boundary of its access. Claude Code, Codex, Cursor, and VS Code connect in one step — from the MCP menu in the app or with the devprojex mcp connect command. The agent journal shows which files and how many tokens each client received, and exports sessions as Markdown or JSON. Related files show what a file depends on and what depends on it, while experimental ranking spends the token budget on what matters first. The MCP server finds declarations by name, reads several files and ranges in one request, and states plainly what was found and what was cut. Linux gets an AppImage, and servers and CI get headless builds and a Docker image."
ReleaseNotesUrl: https://github.com/Avazbek22/DevProjex/releases/tag/v5.2
InstallationNotes: One executable ships the GUI, TUI, CLI, and MCP server. Run 'devprojex' in a terminal for the keyboard-first workspace, 'devprojex help' for the CLI reference, 'devprojex mcp connect . --client claude-code' to connect an AI client to a project (codex, cursor, and vscode work too), or 'devprojex mcp --root .' to start the MCP server.
