ShortDescription: 'DevProjex («código para prompt») transforma pastas e repositórios Git em contexto limpo para ChatGPT, Claude e agentes de IA: contador de tokens, ocultação de segredos e servidor MCP onde o agente segue as caixas marcadas. Local, sem telemetria.'
Description: |-
  O DevProjex é uma ferramenta multiplataforma de «código para prompt» para Windows, Linux e macOS: um aplicativo desktop que transforma qualquer pasta ou repositório Git em contexto limpo e pronto para IA — estrutura do projeto, conteúdo dos arquivos ou ambos. Gerador de contexto de codebase, empacotador de repositório ou conversor de código para prompt: seja qual for o nome, a tarefa é a mesma — preparar código de verdade para ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot ou qualquer outro assistente ou agente de IA, como Claude Code e Cursor, localmente na sua máquina.

  Ele resolve um problema diário do desenvolvedor: um projeto real não cabe numa janela de chat. Copiar arquivos um a um não escala, e colar tudo de uma vez estoura o limite de tokens — muitas vezes com chaves de API, senhas e dados pessoais no meio. O DevProjex empacota o repositório inteiro — ou um único módulo — em um documento pronto para IA, mostra com antecedência o número estimado de tokens e — com um interruptor — oculta os segredos detectados antes que o texto saia da sua máquina.

  Se você empacotava o código com ferramentas de linha de comando e queria um jeito visual de fazer o mesmo — é isto: uma árvore de arquivos com caixas de seleção, busca e filtros por nome, e uma pré-visualização ao vivo que se atualiza enquanto você seleciona. Marcadores na barra de rolagem mostram os resultados da busca e cada item ocultado de relance — você sempre vê exatamente o que está enviando.

  O Smart Ignore remove dependências, caches e artefatos de build automaticamente — com base em evidências reais do projeto, então monorepos são filtrados corretamente e pastas de código-fonte nunca somem só por causa do nome. A filtragem Git vai além do .gitignore: inclua apenas os arquivos rastreados, ou restrinja a seleção aos arquivos em staging, a todas as mudanças atuais ou ao diff entre dois refs — ideal para enviar à IA só aquilo em que você está trabalhando agora. Pastas raiz, tipos de arquivo, exclusões e arquivos individuais são alternados de forma independente.

  O ocultamento de segredos substitui chaves de API, tokens, senhas e strings de conexão detectadas direto no resultado — com regras baseadas no Gitleaks. O arquivo e o código ao redor ficam no lugar: um segredo nunca custa o arquivo inteiro, um falso positivo pode ser revertido caso a caso na pré-visualização, e qualquer outro valor pode ser ocultado manualmente, só durante a sessão ou de forma permanente no projeto, sem salvar o original. A ocultação opcional de dados privados esconde e-mails, endereços IP e MAC, telefones e caminhos de usuário. No CI, a checagem de achados pode derrubar o pipeline antes do vazamento — os valores em si nunca são impressos.

  A compressão de código economiza tokens onde importa: declarações, assinaturas, campos e a estrutura das classes ficam intactos enquanto os corpos dos métodos são esvaziados — o código-fonte puro fica cerca de três vezes menor. A remoção de comentários e linhas em branco cobre 20 pacotes sintáticos: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript e mais. Toda transformação vale só para o resultado: seus arquivos nunca mudam.

  Um motor, quatro jeitos de trabalhar. A GUI traz a árvore visual e a pré-visualização. O espaço de trabalho de terminal (TUI), feito para o teclado, leva o mesmo fluxo a sessões SSH e servidores, com uma paleta de ações pesquisável. A CLI automatiza scripts e CI: análise, busca e exportação direto de uma URL do GitHub, lista de arquivos por pipe a partir do git diff, autocompletar para bash, zsh, fish e PowerShell. O servidor MCP embutido (Model Context Protocol) dá a agentes de IA como Claude Code, Codex, Cursor e VS Code acesso somente leitura ao seu projeto: o agente busca no código e vê na hora a qual função pertence cada ocorrência, lê uma única função pelo nome ou vários arquivos numa só requisição, e recebe resultados grandes em partes. O servidor nunca sai das pastas que você liberar, abre repositórios remotos por URL só quando você permitir, e a ocultação de segredos dele está sempre ativa e não pode ser desligada.

  Trabalhe lado a lado com o seu agente, sem rodeios. Conecte um agente em um só passo — pelo menu MCP do aplicativo ou com o comando mcp connect no espaço de trabalho de terminal — e escolha um modo: «Live context» ou «Padrão». No modo Live context, o agente segue as caixas de seleção da árvore de arquivos do DevProjex: os arquivos e pastas marcados viram a área de trabalho dele, e quando você muda as marcações, o agente vê a nova seleção já na próxima requisição — sem reiniciar, sem copiar e colar. Os filtros da janela — tipos de arquivo, exclusões e modo Git — definem o limite: o que eles escondem fica fora do alcance do agente, enquanto qualquer outro arquivo do projeto ainda pode ser aberto pelo nome quando o agente precisar. No modo Padrão, o agente trabalha com o projeto inteiro, independentemente da janela. Ative «Ver → Atividade do agente» e os arquivos que o agente recebeu ficam marcados com ✦ direto na árvore, enquanto uma dica de ferramenta mostra quantas vezes ele os recebeu; no espaço de trabalho de terminal, eles são marcados com a letra A. Os arquivos relacionados mostram do que um arquivo depende e o que depende dele.

  O diário do agente («MCP → Diário…») guarda o histórico de cada sessão no seu próprio computador: o cliente e a versão dele, o modo, o número de chamadas, o tamanho das respostas, os tokens estimados, os arquivos entregues, a quantidade de valores ocultados e a duração — e, para cada chamada, os parâmetros, o resultado e os avisos. Exporte qualquer sessão como relatório em Markdown ou JSON — para uma auditoria, para a sua equipe ou simplesmente para ver exatamente o que o agente recebeu. Seu código, os segredos detectados e o texto das buscas nunca entram no diário.

  Tudo foi feito para codebases grandes: varredura rápida, busca e filtros, métricas de arquivos, linhas, caracteres e tokens estimados — mais um orçamento de tokens que encaixa os maiores arquivos na janela de contexto de um modelo e mostra o que foi incluído, enquanto o ranking experimental ordena os arquivos por importância ou por proximidade com os que você escolher, para que o orçamento vá primeiro para o que importa. Copie o resultado para a área de transferência ou exporte como ASCII, Markdown, JSON e XML — ou salve os arquivos selecionados como uma cópia limpa do projeto, pasta ou arquivo ZIP: para code review, ensino ou para entregar um módulo a um colega. Perfis locais lembram as configurações de cada projeto; as ferramentas Git embutidas clonam repositórios por URL, trocam de branch e atualizam o cache. Temas claro, escuro e do sistema, atalhos nativos da plataforma, cancelamento seguro de operações longas e interface em 20 idiomas.

  O DevProjex roda localmente e nunca altera seus arquivos — somente leitura por design. Sem telemetria, sem nuvem, sem conta. Para servidores e CI, há builds headless e uma imagem Docker. Um único aplicativo desktop multiplataforma para Windows, Linux e macOS, sustentado por mais de 17.000 testes automatizados, selecionado para o App Showcase oficial do Avalonia UI e de código aberto no GitHub sob Apache-2.0.

  Principais recursos:
  - Contexto de projeto limpo para ChatGPT, Claude e outras IAs
  - GUI, TUI, CLI e servidor MCP (Model Context Protocol) para agentes de IA
  - Live Context: seu agente de IA segue as caixas marcadas da árvore
  - Ocultação de segredos no nível do valor no resultado
  - Conexão MCP em um passo: Claude Code, Codex, Cursor, VS Code
  - Pré-visualização ao vivo atualizada durante a seleção
  - Diário do agente: quais arquivos cada cliente de IA recebeu
  - Arquivos relacionados: o que um arquivo usa e o que o usa
  - Dados privados ocultos: e-mails, IPs, caminhos (opcional)
  - Compressão de código: código puro cerca de 3× menor
  - Smart Ignore, .gitignore e modo de arquivos rastreados
  - Filtros Git: arquivos em staging, todas as mudanças ou diff entre refs
  - Abra repositórios Git remotos direto de uma URL
  - Orçamento de tokens: os maiores arquivos dentro de um limite
  - Ferramentas MCP somente leitura; ocultação não desligável
  - Copie ou exporte como ASCII, Markdown, JSON e XML
  - Exporte os arquivos escolhidos para pasta ou ZIP
  - Busca, filtros e métricas de linhas/caracteres/tokens
  - Remova comentários e linhas vazias: 20 pacotes de linguagens
  - Local, somente leitura, sem telemetria, 20 idiomas
ReleaseNotes: 'O DevProjex 5.2 traz o Live Context: seu agente de IA segue as caixas marcadas na árvore de arquivos e vê a nova seleção já na próxima requisição, enquanto os filtros da janela definem o limite do acesso dele. Claude Code, Codex, Cursor e VS Code se conectam em um só passo — pelo menu MCP do aplicativo ou com o comando devprojex mcp connect. O diário do agente mostra quais arquivos e quantos tokens cada cliente recebeu, e exporta as sessões em Markdown ou JSON. Os arquivos relacionados mostram do que um arquivo depende e o que depende dele, e o ranking experimental direciona o orçamento de tokens primeiro para o que importa. O servidor MCP encontra declarações pelo nome, lê vários arquivos e trechos numa só requisição e diz com clareza o que foi encontrado e o que foi cortado. O Linux ganha um AppImage; servidores e CI, builds headless e uma imagem Docker.'
InstallationNotes: Um único executável traz GUI, TUI, CLI e servidor MCP. Execute 'devprojex' no terminal para o espaço de trabalho de teclado, 'devprojex help' para a referência da CLI, 'devprojex mcp connect . --client claude-code' para conectar um cliente de IA a um projeto (codex, cursor e vscode também funcionam), ou 'devprojex mcp --root .' para iniciar o servidor MCP.
