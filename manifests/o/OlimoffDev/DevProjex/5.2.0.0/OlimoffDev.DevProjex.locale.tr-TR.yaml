ShortDescription: 'DevProjex bir «koddan prompta» uygulamasıdır: her klasör veya Git deposunu ChatGPT, Claude ve YZ ajanları için temiz bağlama çevirir — token sayacı, gizli anahtar maskeleme ve ajanın ağaçtaki onay kutularını izlediği MCP sunucusuyla. Yerel, telemetrisiz.'
Description: |-
  DevProjex, Windows, Linux ve macOS için çok platformlu bir «koddan prompta» aracıdır: herhangi bir klasörü veya Git deposunu temiz, yapay zekâya hazır bağlama dönüştüren bir masaüstü uygulaması — proje yapısı, dosya içerikleri ya da ikisi birden. Kod tabanı bağlam üreteci, depo paketleyici veya koddan prompta dönüştürücü — adı ne olursa olsun görev aynı: gerçek kodu ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot veya başka herhangi bir yapay zekâ asistanı ya da Claude Code ve Cursor gibi bir yapay zekâ ajanı için, yerel olarak kendi makinenizde hazırlamak.

  Geliştiricinin günlük bir sorununu çözer: gerçek bir proje sohbet penceresine sığmaz. Dosyaları tek tek kopyalamak ölçeklenmez; her şeyi birden yapıştırmak ise token sınırını aşar — çoğu zaman içinde API anahtarları, parolalar ve kişisel verilerle birlikte. DevProjex tüm depoyu — veya tek bir modülü — yapay zekâya hazır tek bir belgeye paketler, tahmini token sayısını önceden gösterir ve — tek bir anahtarla — tespit edilen gizli anahtarları metin makinenizden çıkmadan önce maskeler.

  Kod tabanlarını şimdiye dek komut satırı araçlarıyla paketliyor ve görsel bir yol istiyorduysanız — işte burada: onay kutulu dosya ağacı, ad filtreleri ve arama, seçim sırasında güncellenen canlı önizleme. Kaydırma çubuğundaki işaretler arama eşleşmelerini ve maskelenen her bulguyu tek bakışta gösterir — ne gönderdiğinizi her zaman tam olarak görürsünüz.

  Smart Ignore bağımlılıkları, önbellekleri ve derleme artıklarını otomatik olarak kaldırır — projenin gerçek izlerine dayanarak; böylece monorepo'lar doğru filtrelenir ve kaynak klasörleri yalnızca adı yüzünden asla gizlenmez. Git filtreleme .gitignore'un ötesine geçer: yalnızca Git'in izlediği dosyaları dahil edin ya da seçimi hazırlanmış (staged) dosyalara, tüm geçerli değişikliklere veya iki ref arasındaki diff'e daraltın — yapay zekâya tam şu anda üzerinde çalıştığınız şeyi göndermek için ideal. Kök klasörler, dosya türleri, hariç tutmalar ve tek tek dosyalar birbirinden bağımsız açılıp kapanır.

  Gizli anahtar maskeleme; tespit edilen API anahtarlarını, token'ları, parolaları ve bağlantı dizelerini doğrudan çıktıda değiştirir — Gitleaks tabanlı kurallarla. Dosya ve çevresindeki kod yerinde kalır: tek bir gizli anahtar size asla dosyanın tamamına mal olmaz, yanlış alarm önizlemede tek tek geri alınabilir, başka herhangi bir değer ise asıl hâli saklanmadan oturum boyunca ya da proje için kalıcı olarak elle gizlenebilir. İsteğe bağlı kişisel veri maskeleme; e-postaları, IP ve MAC adreslerini, telefon numaralarını ve kullanıcı yollarını gizler. CI'da bulgu denetimi, sızıntı olmadan önce pipeline'ı durdurabilir — değerlerin kendisi asla yazdırılmaz.

  Kod sıkıştırma, token'ları önemli yerde tasarruf eder: bildirimler, imzalar, alanlar ve sınıf yapısı olduğu gibi kalırken metot gövdeleri boşaltılır — saf kaynak kodu yaklaşık üç kat küçülür. Yorum ve boş satır temizleme 20 sözdizimi paketini kapsar: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript ve daha fazlası. Her dönüşüm yalnızca çıktıya uygulanır: dosyalarınız asla değişmez.

  Tek motor, dört çalışma biçimi. GUI görsel ağacı ve önizlemeyi sunar. Klavye odaklı terminal çalışma alanı (TUI) aynı akışı SSH oturumlarına ve sunuculara taşır; aranabilir eylem paletiyle. CLI betikleri ve CI'ı otomatikleştirir: doğrudan GitHub URL'sinden analiz, arama ve dışa aktarım, git diff'ten boru ile dosya listesi, bash, zsh, fish ve PowerShell için otomatik tamamlama. Yerleşik MCP (Model Context Protocol) sunucusu, Claude Code, Codex, Cursor ve VS Code gibi yapay zekâ ajanlarına projenize salt okunur erişim sağlar: ajan kodda arama yapar ve her eşleşmenin hangi fonksiyona ait olduğunu hemen görür, tek bir fonksiyonu adıyla ya da birkaç dosyayı tek istekte okur, büyük sonuçları ise parça parça alır. Sunucu izin verdiğiniz klasörlerin dışına asla çıkmaz, uzak depoları URL ile yalnızca siz izin verdiğinizde açar; gizli anahtar maskelemesi ise her zaman açıktır ve kapatılamaz.

  Ajanınızla omuz omuza çalışın. Ajanı tek adımda bağlayın — uygulamada MCP menüsünden ya da terminal çalışma alanında mcp connect komutuyla — ve bir mod seçin: «Live context» veya «Standart». Live Context modunda ajan, DevProjex dosya ağacındaki onay kutularını izler: işaretli dosya ve klasörler onun çalışma alanı olur ve onay kutularını değiştirdiğinizde ajan yeni seçimi hemen bir sonraki isteğinde görür — yeniden başlatma yok, kopyala-yapıştır yok. Pencere filtreleri — dosya türleri, hariç tutmalar ve Git modu — sınırı belirler: gizledikleri her şey ajanın erişimi dışında kalır, projedeki diğer her dosyayı ise ajan gerektiğinde adıyla açabilir. Standart modda ajan, pencereden bağımsız olarak tüm projeyle çalışır. «Görünüm → Aracı etkinliği» seçeneğini açın: ajanın aldığı dosyalar doğrudan ağaçta ✦ ile işaretlenir, ipucu ise bunları kaç kez aldığını gösterir; terminal çalışma alanında bu dosyalar A harfiyle işaretlenir. İlişkili dosyalar, bir dosyanın neye bağımlı olduğunu ve ona neyin bağımlı olduğunu gösterir.

  Ajan günlüğü («MCP → Günlük…») her oturumun geçmişini doğrudan bilgisayarınızda tutar: istemci ve sürümü, mod, çağrı sayısı, yanıt boyutu, tahmini token'lar, teslim edilen dosyalar, maskelenen değer sayısı ve süre — ayrıca her çağrının parametreleri, sonucu ve bildirimleri. Herhangi bir oturumu Markdown veya JSON raporu olarak dışa aktarın — denetim için, ekibiniz için ya da yalnızca ajanın tam olarak ne aldığını görmek için. Kodunuz, tespit edilen gizli anahtarlar ve arama sorgularının metni asla günlüğe girmez.

  Her şey büyük kod tabanları için tasarlandı: hızlı tarama, arama ve filtreler; dosya, satır, karakter ve tahmini token metrikleri — artı en büyük dosyaları modelin bağlam penceresine sığdıran ve nelerin dahil edildiğini gösteren bir token bütçesi; deneysel sıralama ise dosyaları önemlerine ya da seçtiğiniz dosyalara yakınlıklarına bakarak dizer, böylece bütçe önce önemli olana harcanır. Sonucu panoya kopyalayın veya ASCII, Markdown, JSON ve XML olarak dışa aktarın — ya da seçili dosyaları projenin temiz bir kopyası olarak klasöre veya ZIP arşivine kaydedin: kod incelemesi, eğitim veya bir modülü iş arkadaşınıza devretmek için. Yerel profiller her projenin ayarlarını hatırlar; yerleşik Git araçları depoları URL ile klonlar, dal değiştirir ve önbelleği günceller. Açık, koyu ve sistem temaları, platforma özgü kısayollar, uzun işlemlerin güvenli iptali ve 20 dilde arayüz.

  DevProjex yerel çalışır ve dosyalarınızı asla değiştirmez — tasarım gereği salt okunur. Telemetri yok, bulut yok, hesap yok. Sunucular ve CI için headless derlemeler ve bir Docker imajı mevcuttur. Windows, Linux ve macOS için tek bir çok platformlu masaüstü uygulaması; 17.000'den fazla otomatik testle desteklenir, resmî Avalonia UI App Showcase'e seçilmiştir ve kaynak kodu GitHub'da Apache-2.0 lisansıyla açıktır.

  Öne çıkan özellikler:
  - ChatGPT, Claude ve diğer YZ araçları için temiz proje bağlamı
  - GUI, TUI, CLI ve YZ ajanları için MCP (Model Context Protocol) sunucusu
  - Live Context: YZ ajanınız ağaçtaki onay kutularını izler
  - Çıktıda değer düzeyinde gizli anahtar maskeleme
  - Tek adımda MCP kurulumu: Claude Code, Codex, Cursor, VS Code
  - Seçim sırasında güncellenen canlı önizleme
  - Ajan günlüğü: her YZ istemcisinin aldığı dosyalar
  - İlişkili dosyalar: dosyanın kullandıkları ve onu kullananlar
  - Kişisel veri maskeleme: e-posta, IP, yollar (isteğe bağlı)
  - Kod sıkıştırma: saf kod yaklaşık 3× daha küçük
  - Smart Ignore, .gitignore ve izlenen dosyalar modu
  - Git modları: staged dosyalar, tüm değişiklikler veya ref diff'i
  - Uzak Git depolarını doğrudan URL'den açma
  - Token bütçesi: en büyük dosyaları limite sığdırın
  - MCP araçları salt okunur; maskeleme kapatılamaz
  - ASCII, Markdown, JSON ve XML olarak kopyala veya dışa aktar
  - Seçili dosyaları klasöre veya ZIP arşivine aktar
  - Arama, filtreler ve satır/karakter/token metrikleri
  - Yorumları ve boş satırları kaldırma: 20 dil paketi
  - Yerel, salt okunur, telemetrisiz, 20 dil
ReleaseNotes: "DevProjex 5.2, Live Context'i ekler: YZ ajanınız dosya ağacındaki onay kutularını izler ve yeni seçimi hemen bir sonraki isteğinde görür; pencere filtreleri ise erişiminin sınırını belirler. Claude Code, Codex, Cursor ve VS Code tek adımda bağlanır — uygulamadaki MCP menüsünden ya da devprojex mcp connect komutuyla. Ajan günlüğü, her istemcinin hangi dosyaları ve kaç token aldığını gösterir ve oturumları Markdown veya JSON olarak dışa aktarır. İlişkili dosyalar, bir dosyanın neye bağımlı olduğunu ve ona neyin bağımlı olduğunu gösterir; deneysel sıralama ise token bütçesini önce önemli olana harcar. MCP sunucusu bildirimleri adıyla bulur, birkaç dosyayı ve aralığı tek istekte okur, neyin bulunduğunu ve neyin kırpıldığını açıkça belirtir. Linux için AppImage, sunucular ve CI için ise headless derlemeler ve bir Docker imajı eklendi."
InstallationNotes: Tek bir yürütülebilir dosya GUI, TUI, CLI ve MCP sunucusunu içerir. Klavye odaklı çalışma alanı için terminalde 'devprojex', CLI başvurusu için 'devprojex help', bir YZ istemcisini projeye bağlamak için 'devprojex mcp connect . --client claude-code' (codex, cursor ve vscode da desteklenir), MCP sunucusunu başlatmak için 'devprojex mcp --root .' çalıştırın.
