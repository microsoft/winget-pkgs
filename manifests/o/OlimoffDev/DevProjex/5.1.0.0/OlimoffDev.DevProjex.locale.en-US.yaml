ReleaseNotes: DevProjex 5.1 extends Git filtering with staged, all-changes, and ref-to-ref diff scopes, and adds a built-in Model Context Protocol (MCP) server that connects AI agents to your projects through read-only tools with always-on secret masking. Remote repositories open straight from a URL in the TUI, CLI, and MCP server. A new token budget with a top-files report fits large projects into a model's context window, and trees and contents now use a more compact, token-friendly layout.
