ShortDescription: 'O DevProjex transforma pastas e repositórios Git em contexto limpo e pronto para IA para ChatGPT, Claude e outras ferramentas — com mascaramento de segredos e compressão de código, numa só aplicação: GUI, TUI, CLI e servidor MCP.'
Description: |-
  O DevProjex é uma ferramenta multiplataforma de «código para prompt» para Windows, Linux e macOS: uma aplicação de secretária que transforma qualquer pasta ou repositório Git em contexto limpo e pronto para IA — estrutura do projeto, conteúdo dos ficheiros ou ambos. Gerador de contexto da base de código, empacotador de repositórios ou conversor de código para prompt: seja qual for o nome, a tarefa é a mesma — preparar código real para ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot ou qualquer outro assistente de IA, localmente na sua máquina.

  Resolve um problema quotidiano do programador: um projeto real não cabe numa janela de conversa. Copiar ficheiros um a um não escala, e colar tudo de uma vez rebenta o limite de tokens — muitas vezes com chaves de API, palavras-passe e dados pessoais pelo meio. O DevProjex empacota o repositório inteiro — ou um único módulo — num documento pronto para IA, mostra antecipadamente o número estimado de tokens e — com um interruptor — mascara os segredos detetados antes de o texto sair da sua máquina.

  Se até agora empacotava o código com ferramentas de linha de comandos e desejava uma forma visual de o fazer — é esta: uma árvore de ficheiros com caixas de seleção, pesquisa e filtros por nome, e uma pré-visualização em direto que se atualiza enquanto seleciona. Marcadores na barra de deslocamento mostram as correspondências da pesquisa e cada elemento mascarado num relance — vê sempre exatamente o que está a enviar.

  O Smart Ignore remove dependências, caches e artefactos de build automaticamente — com base em indícios reais do projeto, pelo que os monorepos são filtrados corretamente e as pastas de código-fonte nunca desaparecem apenas pelo nome. A filtragem Git vai além do .gitignore: inclua apenas os ficheiros seguidos, ou restrinja o pacote aos ficheiros em staging, a todas as alterações atuais ou ao diff entre dois refs — ideal para enviar à IA apenas aquilo em que está a trabalhar agora. Pastas raiz, tipos de ficheiro, exclusões e ficheiros individuais alternam-se de forma independente.

  A ocultação de segredos mascara chaves de API, tokens, palavras-passe e cadeias de ligação detetadas diretamente no resultado — com regras baseadas no Gitleaks. O ficheiro e o código envolvente ficam no lugar: um segredo nunca lhe custa o ficheiro inteiro, e um falso positivo anula-se caso a caso na pré-visualização. A ocultação opcional de dados privados esconde e-mails, endereços IP e MAC, números de telefone e caminhos de utilizador. Em CI, a verificação de deteções pode travar um pipeline antes da fuga — os valores em si nunca são impressos.

  A compressão de código poupa tokens onde importa: declarações, assinaturas, campos e a estrutura das classes ficam intactos enquanto os corpos dos métodos são esvaziados — o código-fonte puro fica cerca de três vezes mais pequeno. A remoção de comentários e linhas em branco cobre 20 pacotes sintáticos: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript e mais. Todas as transformações se aplicam apenas ao resultado: os seus ficheiros nunca mudam.

  Um motor, quatro formas de trabalhar. A GUI oferece a árvore visual e a pré-visualização. O espaço de trabalho de terminal (TUI), centrado no teclado, leva o mesmo fluxo às sessões SSH e aos servidores, com uma paleta de ações pesquisável. A CLI automatiza scripts e CI: análise e exportação diretamente a partir de um URL do GitHub, lista de ficheiros por pipe do git diff, conclusão automática para bash, zsh, fish e PowerShell. O servidor MCP integrado (Model Context Protocol) liga agentes de IA como o Claude Code e o Cursor aos seus projetos através de ferramentas apenas de leitura — confinadas às pastas que autorizar, com abertura de repositórios remotos por URL quando o permitir, e com mascaramento de segredos sempre ativo e impossível de desligar.

  Tudo foi concebido para grandes bases de código: análise rápida, pesquisa e filtros, métricas de ficheiros, linhas, carateres e tokens estimados — mais um orçamento de tokens que faz caber os maiores ficheiros na janela de contexto de um modelo e mostra o que foi incluído. Copie o resultado para a área de transferência ou exporte-o como ASCII, Markdown, JSON e XML — ou guarde os ficheiros selecionados como cópia limpa do projeto, pasta ou arquivo ZIP: para revisão de código, ensino ou entrega de um módulo a um colega. Os perfis locais memorizam as definições de cada projeto; as ferramentas Git integradas clonam repositórios por URL, mudam de ramo e atualizam a cache. Temas claro, escuro e do sistema, atalhos nativos da plataforma, cancelamento seguro de operações longas e uma interface em 20 idiomas.

  O DevProjex funciona localmente e nunca altera os seus ficheiros — apenas leitura por conceção. Sem telemetria, sem nuvem, sem conta. Uma única aplicação de secretária multiplataforma para Windows, Linux e macOS, sustentada por mais de 17 000 testes automatizados, selecionada para o App Showcase oficial do Avalonia UI e de código aberto no GitHub sob a licença Apache-2.0.

  Principais funcionalidades:
  - Contexto de projeto limpo para ChatGPT, Claude e outras IA
  - GUI, TUI, CLI e servidor MCP (Model Context Protocol) para agentes de IA
  - Pré-visualização em direto atualizada durante a seleção
  - Mascaramento de segredos ao nível do valor no resultado
  - Dados privados ocultos: e-mails, IPs, caminhos (opcional)
  - Compressão de código: código puro cerca de 3× mais pequeno
  - Smart Ignore, .gitignore e modo de ficheiros seguidos
  - Filtros Git: ficheiros em staging, todas as alterações ou diff entre refs
  - Abra repositórios Git remotos diretamente de um URL
  - Orçamento de tokens: os maiores ficheiros dentro de um limite
  - Ferramentas MCP apenas de leitura; mascaramento não desativável
  - Copiar ou exportar como ASCII, Markdown, JSON e XML
  - Exportar os ficheiros escolhidos para pasta ou ZIP
  - Pesquisa, filtros e métricas de linhas/carateres/tokens
  - Git: clonagem, mudança de ramo e atualização da cache
  - Remova comentários e linhas vazias: 20 pacotes de linguagens
  - Perfis por projeto e perfis portáteis
  - Conclusão automática para bash, zsh, fish e PowerShell
  - Funciona offline com repositórios em cache
  - Local, apenas leitura, sem telemetria, 20 idiomas
ReleaseNotes: 'O DevProjex 5.1 alarga a filtragem Git com os modos staged, todas as alterações e diff entre refs, e adiciona um servidor MCP (Model Context Protocol) integrado: os agentes de IA ligam-se por ferramentas apenas de leitura com mascaramento de segredos sempre ativo. Os repositórios remotos abrem diretamente de um URL na TUI, na CLI e no servidor MCP. O novo orçamento de tokens com relatório top-files faz caber projetos grandes na janela de contexto de um modelo; árvores e conteúdos são agora mais compactos e económicos em tokens.'
InstallationNotes: Um único executável inclui GUI, TUI, CLI e servidor MCP. Execute 'devprojex' no terminal para o espaço de trabalho de teclado, 'devprojex help' para a referência da CLI, ou 'devprojex mcp --root .' para iniciar o servidor MCP.
