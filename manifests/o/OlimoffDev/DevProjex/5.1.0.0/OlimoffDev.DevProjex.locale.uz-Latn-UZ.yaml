ShortDescription: 'DevProjex papkalar va Git-repozitoriylarni ChatGPT, Claude va boshqa AI vositalari uchun toza kontekstga aylantiradi — sirlarni maskalash va kod siqish bilan, bitta ilovada: GUI, TUI, CLI va MCP-server.'
Description: |-
  DevProjex — Windows, Linux va macOS uchun krossplatforma «koddan promptga» vositasi: istalgan papka yoki Git-repozitoriyni toza, AI uchun tayyor kontekstga aylantiruvchi desktop ilova — loyiha tuzilmasi, fayl mazmuni yoki ikkalasi birga. Kod bazasi konteksti generatori, repozitoriy paketlovchisi yoki kodni promptga aylantiruvchi — qanday atamang, vazifa bitta: haqiqiy kodni ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot yoki boshqa istalgan AI-yordamchi uchun oʻz mashinangizda lokal tayyorlash.

  U dasturchining kundalik muammosini hal qiladi: haqiqiy loyiha chat oynasiga sigʻmaydi. Fayllarni bittalab koʻchirish samarasiz, hammasini birdan qoʻyish esa token chegarasidan oshib ketadi — koʻpincha ichida API kalitlari, parollar va shaxsiy maʼlumotlar bilan. DevProjex butun repozitoriyni — yoki alohida modulni — AI uchun tayyor bitta hujjatga joylaydi, taxminiy token sonini oldindan koʻrsatadi va — bitta tugma bilan — topilgan sirlarni matn mashinangizdan chiqib ketishidan oldin maskalaydi.

  Kodni shu paytgacha konsol vositalari bilan paketlagan va koʻrgazmali usulni istagan boʻlsangiz — mana u: belgilash katakchali fayllar daraxti, nom boʻyicha qidiruv va filtrlar, tanlash paytida yangilanadigan jonli koʻrib chiqish. Aylantirish panelidagi belgilar qidiruv mosliklari va har bir maskalangan topilmani bir qarashda koʻrsatadi — nimani yuborayotganingizni doim aniq koʻrasiz.

  Smart Ignore bogʻliqliklar, keshlar va build artefaktlarini avtomatik olib tashlaydi — faqat loyihaning haqiqiy belgilari asosida, shuning uchun monorepozitoriylar toʻgʻri filtrlanadi, manba kod papkalari esa hech qachon faqat nomi uchun yashirilmaydi. Git filtrlash .gitignore dan nariga boradi: faqat Git kuzatadigan fayllarni kiriting yoki paketni staged fayllar, barcha joriy oʻzgarishlar yoki ikki ref orasidagi diff bilan cheklang — AI ga aynan hozir ishlayotgan narsangizni yuborish uchun juda qulay. Ildiz papkalar, kengaytmalar, istisnolar va alohida fayllar bir-biridan mustaqil almashtiriladi.

  Sirlarni yashirish topilgan API kalitlari, tokenlar, parollar va ulanish satrlarini natijaning oʻzida maskalaydi — Gitleaks asosidagi qoidalar bilan. Fayl va atrofidagi kod joyida qoladi: bitta sir sizga hech qachon butun faylga tushmaydi, notoʻgʻri topilma esa koʻrib chiqishda nuqtama-nuqta bekor qilinadi. Ixtiyoriy shaxsiy maʼlumotlarni yashirish email, IP- va MAC-manzillar, telefonlar va foydalanuvchi yoʻllarini maskalaydi. CI da topilmalar tekshiruvi oqishdan oldin pipeline'ni toʻxtata oladi — qiymatlarning oʻzi hech qachon chiqarilmaydi.

  Kod siqish tokenlarni muhim joyda tejaydi: eʼlonlar, signaturalar, maydonlar va klass tuzilmasi saqlanadi, metod tanalari esa tozalanadi — toza manba kodi taxminan uch barobar kichrayadi. Izohlar va boʻsh qatorlarni olib tashlash 20 ta sintaktik paketni qamraydi: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript va boshqalar. Barcha oʻzgartirishlar faqat natijaga qoʻllanadi: fayllaringiz hech qachon oʻzgarmaydi.

  Bitta dvigatel — toʻrt xil ish usuli. GUI koʻrgazmali daraxt va koʻrib chiqishni beradi. Klaviaturaga moslangan terminal ish maydoni (TUI) xuddi shu jarayonni SSH-sessiyalar va serverlarga olib oʻtadi, harakatlar palitrasida qidiruv bilan. CLI skriptlar va CI ni avtomatlashtiradi: GitHub URL orqali toʻgʻridan-toʻgʻri tahlil va eksport, git diff dan quvur orqali fayllar roʻyxati, bash, zsh, fish va PowerShell uchun avtotoʻldirish. Oʻrnatilgan MCP-server (Model Context Protocol) Claude Code va Cursor kabi AI-agentlarni loyihalarga «faqat oʻqish» vositalari orqali ulaydi — siz ruxsat bergan papkalar doirasida, ruxsat bersangiz masofaviy repozitoriylarni URL orqali ochish bilan va doim yoniq, oʻchirib boʻlmaydigan sir maskalash bilan.

  Hammasi katta kod bazalari uchun moʻljallangan: tez skanerlash, qidiruv va filtrlar, fayllar, qatorlar, belgilar va taxminiy tokenlar metrikalari — bundan tashqari eng katta fayllarni model kontekst oynasiga sigʻdirib, nimalar kirganini koʻrsatadigan token byudjeti. Natija almashish buferiga koʻchiriladi yoki ASCII, Markdown, JSON va XML formatiga eksport qilinadi, tanlangan fayllar esa loyihaning toza nusxasi sifatida saqlanadi — papka yoki ZIP-arxiv: kod-revyu, oʻqitish yoki modulni hamkasbga topshirish uchun. Lokal profillar har bir loyiha sozlamalarini eslab qoladi; oʻrnatilgan Git vositalari repozitoriylarni URL boʻyicha klonlaydi, branchlarni almashtiradi va keshni yangilaydi. Yorugʻ, qorongʻu va tizim mavzulari, platformaga xos tugma birikmalari, uzoq operatsiyalarni xavfsiz bekor qilish va 20 tildagi interfeys.

  DevProjex lokal ishlaydi va fayllaringizni hech qachon oʻzgartirmaydi — arxitekturasining oʻziga koʻra faqat oʻqish. Telemetriyasiz, bulutsiz, hisobsiz. Windows, Linux va macOS uchun bitta krossplatforma desktop ilova, ortida 17 000 dan ortiq avtotest, Avalonia UI rasmiy App Showcase'iga tanlov va GitHub'dagi ochiq kod (Apache-2.0).

  Asosiy imkoniyatlar:
  - ChatGPT, Claude va boshqa AI uchun toza loyiha konteksti
  - GUI, TUI, CLI va AI-agentlar uchun MCP-server (Model Context Protocol)
  - Tanlash paytida yangilanadigan jonli koʻrib chiqish
  - Natijada qiymat darajasida sirlarni maskalash
  - Shaxsiy maʼlumotlarni yashirish: email, IP, yoʻllar (ixtiyoriy)
  - Kod siqish: toza kod taxminan 3 barobar kichik
  - Smart Ignore, .gitignore va kuzatilgan fayllar rejimi
  - Git rejimlari: staged, barcha oʻzgarishlar yoki ikki ref oraligʻidagi diff
  - Masofaviy Git-repozitoriylarni toʻgʻridan-toʻgʻri URL orqali ochish
  - Token byudjeti: eng katta fayllarni limitga sigʻdiring
  - MCP vositalari faqat oʻqiydi; maskalash oʻchirilmaydi
  - ASCII, Markdown, JSON va XML sifatida nusxalash yoki eksport
  - Tanlangan fayllarni papka yoki ZIP-arxivga eksport qilish
  - Qidiruv, filtrlar va qator/belgi/token metrikalari
  - Git: klonlash, branch almashtirish, keshni yangilash
  - Izohlar va boʻsh qatorlarni olib tashlash: 20 til paketi
  - Loyihaga xos va koʻchma profillar
  - bash, zsh, fish va PowerShell uchun avtotoʻldirish
  - Keshlangan repozitoriylar bilan oflayn ishlash
  - Lokal, faqat oʻqish, telemetriyasiz, 20 til
ReleaseNotes: 'DevProjex 5.1 Git filtrlashni staged, barcha oʻzgarishlar va ikki ref orasidagi diff rejimlari bilan kengaytiradi hamda oʻrnatilgan MCP-server (Model Context Protocol) qoʻshadi: AI-agentlar doim yoniq sir maskalashli «faqat oʻqish» vositalari orqali ulanadi. Masofaviy repozitoriylar TUI, CLI va MCP-serverda toʻgʻridan-toʻgʻri URL orqali ochiladi. Yangi token byudjeti va top-files hisoboti katta loyihalarni model kontekst oynasiga sigʻdiradi; daraxtlar va mazmun ixchamroq va token jihatidan tejamkor boʻldi.'
InstallationNotes: Bitta bajariladigan fayl GUI, TUI, CLI va MCP-serverni oʻz ichiga oladi. Klaviatura ish maydoni uchun terminalda 'devprojex', CLI maʼlumotnomasi uchun 'devprojex help', MCP-serverni ishga tushirish uchun 'devprojex mcp --root .' buyrugʻini bajaring.
