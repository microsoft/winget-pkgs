ShortDescription: 'DevProjex қалталар мен Git-репозиторийлерді ChatGPT, Claude және басқа ЖИ-құралдар үшін таза контекске айналдырады — құпияларды бүркемелеу және код сығымдаумен, бір қолданбада: GUI, TUI, CLI және MCP-сервер.'
Description: |-
  DevProjex — Windows, Linux және macOS үшін кроссплатформалық «кодты промптқа» құралы: кез келген қалтаны немесе Git-репозиторийді таза, ЖИ-ге дайын контекске айналдыратын жұмыс үстелі қолданбасы — жоба құрылымы, файл мазмұны немесе екеуі бірге. Кодтық база контексінің генераторы, репозиторий буып-түйгіші немесе кодты промптқа түрлендіргіш — қалай атасаңыз да, міндет біреу: нағыз кодты ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot немесе кез келген басқа ЖИ-көмекші үшін өз машинаңызда жергілікті дайындау.

  Ол әзірлеушінің күнделікті мәселесін шешеді: нағыз жоба чат терезесіне сыймайды. Файлдарды бір-бірлеп көшіру ауқымдалмайды, ал бәрін бірден қою токен шегінен асып кетеді — көбіне ішінде API-кілттер, құпиясөздер және жеке деректермен бірге. DevProjex бүкіл репозиторийді — немесе жеке модульді — ЖИ-ге дайын бір құжатқа буып береді, болжалды токен санын алдын ала көрсетеді және — бір ауыстырғышпен — табылған құпияларды мәтін машинаңыздан шықпай тұрып бүркемелейді.

  Кодты осы уақытқа дейін консольдық утилиталармен буып, көрнекі тәсілді армандаған болсаңыз — міне ол: құсбелгілері бар файлдар ағашы, атау бойынша іздеу мен сүзгілер және таңдау кезінде жаңарып отыратын тікелей алдын ала қарау. Айналдыру жолағындағы белгілер іздеу сәйкестіктері мен әрбір бүркемеленген табылымды бірден көрсетеді — не жіберіп жатқаныңызды әрқашан дәл көресіз.

  Smart Ignore тәуелділіктерді, кэштерді және құрастыру артефактілерін автоматты түрде алып тастайды — тек жобаның нақты белгілері бойынша, сондықтан монорепозиторийлер дұрыс сүзіледі, ал бастапқы код қалталары атауы үшін ғана жасырылмайды. Git-сүзгілеу .gitignore-ден әрі барады: тек Git қадағалайтын файлдарды қосыңыз немесе пакетті staged-файлдарға, барлық ағымдағы өзгерістерге не екі сілтеме арасындағы диффке дейін тарылтыңыз — ЖИ-ге дәл қазір жұмыс істеп жатқаныңызды ғана жіберуге ыңғайлы. Түбірлік қалталар, кеңейтімдер, алып тастаулар және жеке файлдар бір-бірінен тәуелсіз ауысады.

  Құпияларды жасыру табылған API-кілттерді, токендерді, құпиясөздерді және қосылу жолдарын нәтиженің өзінде бүркемелейді — Gitleaks негізіндегі ережелермен. Файл мен айналасындағы код орнында қалады: бір құпия сізге ешқашан бүкіл файлға шықпайды, ал жалған табылым алдын ала қарауда нүктелі түрде алынып тасталады. Қосымша жеке деректерді жасыру email, IP- және MAC-мекенжайларды, телефондарды және пайдаланушы жолдарын бүркемелейді. CI-да табылымдарды тексеру конвейерді жылыстаудан бұрын тоқтата алады — мәндердің өзі ешқашан шығарылмайды.

  Код сығымдау токендерді маңызды жерде үнемдейді: жариялаулар, сигнатуралар, өрістер және класс құрылымы сақталады, ал әдіс денелері тазартылады — таза бастапқы код шамамен үш есе кішірейеді. Түсініктемелер мен бос жолдарды жою 20 синтаксистік пакетті қамтиды: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript және басқалары. Барлық түрлендірулер тек нәтижеге қолданылады: файлдарыңыз ешқашан өзгермейді.

  Бір қозғалтқыш — жұмыстың төрт тәсілі. GUI көрнекі ағаш пен алдын ала қарауды береді. Пернетақталық терминалдық интерфейс (TUI) сол процесті SSH-сессиялар мен серверлерге көшіреді, әрекеттер палитрасы бойынша іздеумен. CLI скрипттер мен CI-ды автоматтандырады: GitHub URL бойынша тікелей талдау мен экспорт, git diff-тен конвейер арқылы файлдар тізімі, bash, zsh, fish және PowerShell үшін автотолықтыру. Кірістірілген MCP-сервер (Model Context Protocol) Claude Code және Cursor сияқты ЖИ-агенттерді жобаларға «тек оқу» құралдары арқылы қосады — сіз рұқсат еткен қалталар шегінде, рұқсат етсеңіз қашықтағы репозиторийлерді URL бойынша ашумен және әрқашан қосулы, өшірілмейтін құпия бүркемелеуімен.

  Барлығы үлкен кодтық базаларға арналған: жылдам сканерлеу, іздеу мен сүзгілер, файлдар, жолдар, таңбалар және болжалды токендер метрикалары — оған қоса ең үлкен файлдарды модельдің контекст терезесіне сыйғызып, ненің кіргенін көрсететін токен бюджеті. Нәтиже алмасу буферіне көшіріледі немесе ASCII, Markdown, JSON және XML форматына экспортталады, ал таңдалған файлдар жобаның таза көшірмесі ретінде сақталады — қалта немесе ZIP-мұрағат: код-ревью, оқыту немесе модульді әріптеске беру үшін. Жергілікті профильдер әр жобаның параметрлерін есте сақтайды; кірістірілген Git-құралдар репозиторийлерді URL бойынша клондайды, тармақтарды ауыстырады және кэшті жаңартады. Ашық, қараңғы және жүйелік темалар, платформаға тән пернелер тіркесімдері, ұзақ операцияларды қауіпсіз тоқтату және 20 тілдегі интерфейс.

  DevProjex жергілікті жұмыс істейді және файлдарыңызды ешқашан өзгертпейді — архитектурасының өзі бойынша тек оқу. Телеметриясыз, бұлтсыз, аккаунтсыз. Windows, Linux және macOS үшін бір кроссплатформалық жұмыс үстелі қолданбасы, артында 17 000-нан астам автотест, Avalonia UI ресми App Showcase-іне іріктелу және GitHub-тағы ашық код (Apache-2.0).

  Негізгі мүмкіндіктер:
  - ChatGPT, Claude және басқа ЖИ үшін таза жоба контексі
  - GUI, TUI, CLI және ЖИ-агенттерге MCP-сервер (Model Context Protocol)
  - Таңдау кезінде жаңаратын тікелей алдын ала қарау
  - Нәтижеде мән деңгейінде құпияларды бүркемелеу
  - Жеке деректерді жасыру: email, IP, жолдар (қосымша)
  - Код сығымдау: таза код шамамен 3 есе кіші
  - Smart Ignore, .gitignore және қадағаланатын файлдар режимі
  - Git режимдері: staged, барлық өзгерістер немесе екі сілтеме арасындағы дифф
  - Қашықтағы Git-репозиторийлерді тікелей URL арқылы ашу
  - Токен бюджеті: ең үлкен файлдарды лимитке сыйғызыңыз
  - MCP құралдары — тек оқу; бүркемелеу өшірілмейді
  - ASCII, Markdown, JSON және XML ретінде көшіру не экспорт
  - Таңдалған файлдарды қалтаға немесе ZIP-ке экспорттау
  - Іздеу, сүзгілер және жол/таңба/токен метрикалары
  - Git: клондау, тармақ ауыстыру, кэшті жаңарту
  - Түсініктемелер мен бос жолдарды өшіру: 20 тілдік пак
  - Жобаға арналған және тасымалды профильдер
  - bash, zsh, fish және PowerShell үшін автотолықтыру
  - Кэштелген репозиторийлермен офлайн жұмыс
  - Жергілікті, тек оқу, телеметриясыз, 20 тіл
ReleaseNotes: 'DevProjex 5.1 Git-сүзгілеуді staged, барлық өзгерістер және екі сілтеме арасындағы дифф режимдерімен кеңейтеді әрі кірістірілген MCP-сервер (Model Context Protocol) қосады: ЖИ-агенттер жобаларға әрқашан қосулы құпия бүркемелеуі бар «тек оқу» құралдары арқылы қосылады. Қашықтағы репозиторийлер TUI, CLI және MCP-серверде тікелей URL арқылы ашылады. Жаңа токен бюджеті мен top-files есебі үлкен жобаларды модельдің контекст терезесіне сыйғызады, ал ағаштар мен мазмұн ықшамырақ әрі токен жағынан үнемді болды.'
InstallationNotes: Бір орындалатын файлда GUI, TUI, CLI және MCP-сервер бар. Пернетақталық жұмыс кеңістігі үшін терминалда 'devprojex', CLI анықтамасы үшін 'devprojex help', MCP-серверді іске қосу үшін 'devprojex mcp --root .' іске қосыңыз.
