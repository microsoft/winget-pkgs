ShortDescription: 'O DevProjex transforma pastas e repositórios Git em contexto limpo e pronto para IA para ChatGPT, Claude e outras ferramentas — com mascaramento de segredos e compressão de código, em um só app: GUI, TUI, CLI e servidor MCP.'
Description: |-
  O DevProjex é uma ferramenta multiplataforma de «código para prompt» para Windows, Linux e macOS: um aplicativo desktop que transforma qualquer pasta ou repositório Git em contexto limpo e pronto para IA — estrutura do projeto, conteúdo dos arquivos ou ambos. Gerador de contexto de codebase, empacotador de repositório ou conversor de código para prompt: seja qual for o nome, a tarefa é a mesma — preparar código de verdade para ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot ou qualquer outro assistente de IA, localmente na sua máquina.

  Ele resolve um problema diário do desenvolvedor: um projeto real não cabe numa janela de chat. Copiar arquivos um a um não escala, e colar tudo de uma vez estoura o limite de tokens — muitas vezes com chaves de API, senhas e dados pessoais no meio. O DevProjex empacota o repositório inteiro — ou um único módulo — em um documento pronto para IA, mostra com antecedência o número estimado de tokens e — com um interruptor — mascara os segredos detectados antes que o texto saia da sua máquina.

  Se você empacotava o código com ferramentas de linha de comando e queria um jeito visual de fazer o mesmo — é isto: uma árvore de arquivos com caixas de seleção, busca e filtros por nome, e uma pré-visualização ao vivo que se atualiza enquanto você seleciona. Marcadores na barra de rolagem mostram os resultados da busca e cada item mascarado de relance — você sempre vê exatamente o que está enviando.

  O Smart Ignore remove dependências, caches e artefatos de build automaticamente — com base em evidências reais do projeto, então monorepos são filtrados corretamente e pastas de código-fonte nunca somem só por causa do nome. A filtragem Git vai além do .gitignore: inclua apenas os arquivos rastreados, ou restrinja o pacote aos arquivos em staging, a todas as mudanças atuais ou ao diff entre dois refs — ideal para enviar à IA só aquilo em que você está trabalhando agora. Pastas raiz, tipos de arquivo, exclusões e arquivos individuais são alternados de forma independente.

  O ocultamento de segredos mascara chaves de API, tokens, senhas e strings de conexão detectadas direto no resultado — com regras baseadas no Gitleaks. O arquivo e o código ao redor ficam no lugar: um segredo nunca custa o arquivo inteiro, e um falso positivo pode ser revertido caso a caso na pré-visualização. O mascaramento opcional de dados privados esconde e-mails, endereços IP e MAC, telefones e caminhos de usuário. No CI, a checagem de achados pode derrubar o pipeline antes do vazamento — os valores em si nunca são impressos.

  A compressão de código economiza tokens onde importa: declarações, assinaturas, campos e a estrutura das classes ficam intactos enquanto os corpos dos métodos são esvaziados — o código-fonte puro fica cerca de três vezes menor. A remoção de comentários e linhas em branco cobre 20 pacotes sintáticos: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript e mais. Toda transformação vale só para o resultado: seus arquivos nunca mudam.

  Um motor, quatro jeitos de trabalhar. A GUI traz a árvore visual e a pré-visualização. O espaço de trabalho de terminal (TUI), feito para o teclado, leva o mesmo fluxo a sessões SSH e servidores, com uma paleta de ações pesquisável. A CLI automatiza scripts e CI: análise e exportação direto de uma URL do GitHub, lista de arquivos por pipe a partir do git diff, autocompletar para bash, zsh, fish e PowerShell. O servidor MCP embutido (Model Context Protocol) conecta agentes de IA como Claude Code e Cursor aos seus projetos por ferramentas somente leitura — restritas às pastas que você liberar, com abertura de repositórios remotos por URL quando você permitir, e com mascaramento de segredos sempre ativo e impossível de desligar.

  Tudo foi feito para codebases grandes: varredura rápida, busca e filtros, métricas de arquivos, linhas, caracteres e tokens estimados — mais um orçamento de tokens que encaixa os maiores arquivos na janela de contexto de um modelo e mostra o que foi incluído. Copie o resultado para a área de transferência ou exporte como ASCII, Markdown, JSON e XML — ou salve os arquivos selecionados como uma cópia limpa do projeto, pasta ou arquivo ZIP: para code review, ensino ou para entregar um módulo a um colega. Perfis locais lembram as configurações de cada projeto; as ferramentas Git embutidas clonam repositórios por URL, trocam de branch e atualizam o cache. Temas claro, escuro e do sistema, atalhos nativos da plataforma, cancelamento seguro de operações longas e interface em 20 idiomas.

  O DevProjex roda localmente e nunca altera seus arquivos — somente leitura por design. Sem telemetria, sem nuvem, sem conta. Um único aplicativo desktop multiplataforma para Windows, Linux e macOS, sustentado por mais de 17.000 testes automatizados, selecionado para o App Showcase oficial do Avalonia UI e de código aberto no GitHub sob Apache-2.0.

  Principais recursos:
  - Contexto de projeto limpo para ChatGPT, Claude e outras IAs
  - GUI, TUI, CLI e servidor MCP (Model Context Protocol) para agentes de IA
  - Pré-visualização ao vivo atualizada durante a seleção
  - Mascaramento de segredos no nível do valor no resultado
  - Dados privados ocultos: e-mails, IPs, caminhos (opcional)
  - Compressão de código: código puro cerca de 3× menor
  - Smart Ignore, .gitignore e modo de arquivos rastreados
  - Filtros Git: arquivos em staging, todas as mudanças ou diff entre refs
  - Abra repositórios Git remotos direto de uma URL
  - Orçamento de tokens: os maiores arquivos dentro de um limite
  - Ferramentas MCP somente leitura; mascaramento não desligável
  - Copie ou exporte como ASCII, Markdown, JSON e XML
  - Exporte os arquivos escolhidos para pasta ou ZIP
  - Busca, filtros e métricas de linhas/caracteres/tokens
  - Git: clonagem, troca de branch e atualização de cache
  - Remova comentários e linhas vazias: 20 pacotes de linguagens
  - Perfis por projeto e perfis portáteis
  - Autocompletar para bash, zsh, fish e PowerShell
  - Funciona offline com repositórios em cache
  - Local, somente leitura, sem telemetria, 20 idiomas
ReleaseNotes: 'O DevProjex 5.1 amplia a filtragem Git com os modos staged, todas as mudanças e diff entre refs, e adiciona um servidor MCP (Model Context Protocol) embutido: agentes de IA se conectam por ferramentas somente leitura com mascaramento de segredos sempre ativo. Repositórios remotos abrem direto de uma URL na TUI, na CLI e no servidor MCP. O novo orçamento de tokens com relatório top-files encaixa projetos grandes na janela de contexto de um modelo; árvores e conteúdos agora são mais compactos e econômicos em tokens.'
InstallationNotes: Um único executável traz GUI, TUI, CLI e servidor MCP. Execute 'devprojex' no terminal para o espaço de trabalho de teclado, 'devprojex help' para a referência da CLI, ou 'devprojex mcp --root .' para iniciar o servidor MCP.
