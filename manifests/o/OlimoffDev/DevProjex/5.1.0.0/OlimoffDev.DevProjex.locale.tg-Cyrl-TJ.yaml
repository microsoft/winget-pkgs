ShortDescription: 'DevProjex папкаҳо ва Git-репозиторияҳоро ба контексти тоза барои ChatGPT, Claude ва дигар абзорҳои ЗИ табдил медиҳад — бо пӯшонидани сирҳо ва фишурдани код, дар як барнома: GUI, TUI, CLI ва MCP-сервер.'
Description: |-
  DevProjex — абзори кроссплатформии «код ба промпт» барои Windows, Linux ва macOS: барномаи мизи корӣ, ки ҳар папка ё Git-репозиторияро ба контексти тоза ва барои ЗИ омода табдил медиҳад — сохтори лоиҳа, мундариҷаи файлҳо ё ҳарду якҷоя. Генератори контексти базаи код, бандкунандаи репозитория ё табдилгари код ба промпт — ҳар чӣ гӯед, вазифа якто аст: коди воқеиро барои ChatGPT, Claude, Gemini, DeepSeek, Qwen, Kimi, Copilot ё ҳар ёрдамчии дигари ЗИ маҳаллӣ дар мошини худ омода кардан.

  Он мушкилоти ҳаррӯзаи барномасозро ҳал мекунад: лоиҳаи воқеӣ ба тирезаи чат намеғунҷад. Нусхабардории файлҳо якто-якто миқёс намегирад, ва ҳамаро якбора гузоштан аз ҳадди токенҳо мебарояд — аксар вақт бо калидҳои API, паролҳо ва додаҳои шахсӣ дар дарун. DevProjex тамоми репозиторияро — ё модули алоҳидаро — ба як ҳуҷҷати барои ЗИ омода мебандад, шумораи тахминии токенҳоро пешакӣ нишон медиҳад ва — бо як гузаронанда — сирҳои ёфтшударо пеш аз он ки матн мошини шуморо тарк кунад, мепӯшонад.

  Агар то ҳол кодро бо абзорҳои консолӣ мебастед ва роҳи аёниро мехостед — ана он: дарахти файлҳо бо қуттичаҳои интихоб, ҷустуҷӯ ва филтрҳо аз рӯи ном, ва пешнамоиши зинда, ки ҳангоми интихоб нав мешавад. Аломатҳо дар навори ҳаракат мувофиқатҳои ҷустуҷӯ ва ҳар бозёфти пӯшидашударо якбора нишон медиҳанд — шумо ҳамеша маҳз ҳамонро мебинед, ки мефиристед.

  Smart Ignore вобастагиҳо, кешҳо ва артефактҳои сохтро худкор мебарорад — танҳо аз рӯи нишонаҳои воқеии лоиҳа, бинобар ин монорепозиторияҳо дуруст филтр мешаванд ва папкаҳои коди манбаъ ҳеҷ гоҳ танҳо аз рӯи ном пинҳон намешаванд. Филтркунии Git аз .gitignore дуртар меравад: танҳо файлҳои пайгиришавандаро дохил кунед ё пакетро то файлҳои staged, ҳамаи тағйироти ҷорӣ ё диффи байни ду истинод танг кунед — беҳтарин роҳ, то ба ЗИ маҳз ҳамонеро фиристед, ки ҳозир болояш кор мекунед. Папкаҳои реша, пасвандҳо, истисноҳо ва файлҳои алоҳида мустақилона иваз мешаванд.

  Пинҳон кардани сирҳо калидҳои API, токенҳо, паролҳо ва сатрҳои пайвасти ёфтшударо бевосита дар натиҷа мепӯшонад — бо қоидаҳои дар асоси Gitleaks. Файл ва коди атроф дар ҷои худ мемонанд: як сир ҳеҷ гоҳ ба шумо тамоми файлро намеарзад, ва бозёфти бардурӯғ дар пешнамоиш нуқта ба нуқта бекор мешавад. Пинҳонкунии ихтиёрии додаҳои шахсӣ email, суроғаҳои IP ва MAC, телефонҳо ва роҳҳои корбарро мепӯшонад. Дар CI санҷиши бозёфтҳо метавонад конвейерро пеш аз ихроҷ бозмедорад — худи қиматҳо ҳеҷ гоҳ чоп намешаванд.

  Фишурдани код токенҳоро дар ҷои муҳим сарфа мекунад: эъломияҳо, имзоҳо, майдонҳо ва сохтори классҳо нигоҳ дошта мешаванд, ва танаҳои методҳо тоза мешаванд — коди манбаи тоза тақрибан се маротиба хурдтар мешавад. Баровардани шарҳҳо ва сатрҳои холӣ 20 пакети синтаксисиро фаро мегирад: C, C++, C#, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Scala, TypeScript ва ғайра. Ҳамаи табдилҳо танҳо ба натиҷа татбиқ мешаванд: файлҳои шумо ҳеҷ гоҳ тағйир намеёбанд.

  Як муҳаррик — чор тарзи кор. GUI дарахти аёнӣ ва пешнамоишро медиҳад. Фазои кории терминалии клавиатурӣ (TUI) ҳамон равандро ба сессияҳои SSH ва серверҳо мебарад, бо ҷустуҷӯ дар палитраи амалҳо. CLI скриптҳо ва CI-ро худкор мекунад: таҳлил ва содирот бевосита аз URL-и GitHub, рӯйхати файлҳо аз git diff тавассути қубур, худпуркунӣ барои bash, zsh, fish ва PowerShell. MCP-сервери дарунсохт (Model Context Protocol) агентҳои ЗИ ба монанди Claude Code ва Cursor-ро тавассути абзорҳои «танҳо хондан» ба лоиҳаҳо мепайвандад — дар доираи папкаҳое, ки шумо иҷозат додаед, бо кушодани репозиторияҳои дурдаст аз рӯи URL, агар иҷозат дода бошед, ва бо пӯшонидани сирҳо, ки ҳамеша фаъол аст ва хомӯш намешавад.

  Ҳама чиз барои базаҳои калони код сохта шудааст: сканкунии тез, ҷустуҷӯ ва филтрҳо, метрикаҳои файлҳо, сатрҳо, аломатҳо ва токенҳои тахминӣ — ба илова буҷаи токенҳо, ки файлҳои калонтаринро ба тирезаи контексти модел мегунҷонад ва нишон медиҳад, ки чӣ дохил шуд. Натиҷа ба буфери мубодила нусха мешавад ё ба ASCII, Markdown, JSON ва XML содир мешавад, ва файлҳои интихобшуда ҳамчун нусхаи тозаи лоиҳа нигоҳ дошта мешаванд — папка ё ZIP-архив: барои код-ревю, таълим ё супоридани модул ба ҳамкор. Профилҳои маҳаллӣ танзимоти ҳар лоиҳаро дар ёд медоранд; абзорҳои дарунсохти Git репозиторияҳоро аз рӯи URL клон мекунанд, шохаҳоро иваз мекунанд ва кешро нав мекунанд. Мавзӯъҳои равшан, торик ва системавӣ, тугмабандиҳои хоси платформа, бекоркунии бехатари амалиётҳои дароз ва интерфейс бо 20 забон.

  DevProjex маҳаллӣ кор мекунад ва файлҳои шуморо ҳеҷ гоҳ тағйир намедиҳад — танҳо хондан аз рӯи худи меъморӣ. Бе телеметрия, бе абр, бе ҳисоб. Як барномаи кроссплатформии мизи корӣ барои Windows, Linux ва macOS, ки дар пушти он зиёда аз 17 000 автотест, интихоб ба App Showcase-и расмии Avalonia UI ва коди кушода дар GitHub (Apache-2.0) меистад.

  Имкониятҳои асосӣ:
  - Контексти тозаи лоиҳа барои ChatGPT, Claude ва дигар ЗИ
  - GUI, TUI, CLI ва MCP-сервер (Model Context Protocol) барои агентҳои ЗИ
  - Пешнамоиши зинда, ки ҳангоми интихоб нав мешавад
  - Пӯшонидани сирҳо дар сатҳи қимат дар натиҷа
  - Пинҳони додаҳои шахсӣ: email, IP, роҳҳо (ихтиёрӣ)
  - Фишурдани код: коди тоза тақрибан 3 маротиба хурдтар
  - Smart Ignore, .gitignore ва реҷаи файлҳои пайгиришаванда
  - Реҷаҳои Git: staged, ҳамаи тағйирот ё диффи байни ду истинод
  - Кушодани Git-репозиторияҳои дурдаст бевосита аз URL
  - Буҷаи токенҳо: файлҳои калонтарин дар доираи лимит
  - Абзорҳои MCP — танҳо хондан; пӯшонидан хомӯш намешавад
  - Нусха ё содирот ҳамчун ASCII, Markdown, JSON ва XML
  - Содироти файлҳои интихобшуда ба папка ё ZIP-архив
  - Ҷустуҷӯ, филтрҳо ва метрикаҳои сатр/аломат/токен
  - Git: клонкунӣ, иваз кардани шоха, навсозии кеш
  - Тоза кардани шарҳҳо ва сатрҳои холӣ: 20 паки забонӣ
  - Профилҳо барои ҳар лоиҳа ва профилҳои интиқолшаванда
  - Худпуркунӣ барои bash, zsh, fish ва PowerShell
  - Кори офлайн бо репозиторияҳои кешшуда
  - Маҳаллӣ, танҳо хондан, бе телеметрия, 20 забон
ReleaseNotes: 'DevProjex 5.1 филтркунии Git-ро бо реҷаҳои staged, ҳамаи тағйирот ва диффи байни ду истинод васеъ мекунад ва MCP-сервери дарунсохт (Model Context Protocol) меафзояд: агентҳои ЗИ тавассути абзорҳои «танҳо хондан» бо пӯшонидани ҳамеша фаъоли сирҳо пайваст мешаванд. Репозиторияҳои дурдаст дар TUI, CLI ва MCP-сервер бевосита аз URL кушода мешаванд. Буҷаи нави токенҳо бо ҳисоботи top-files лоиҳаҳои калонро ба тирезаи контексти модел мегунҷонад; дарахтҳо ва мазмун ихчамтар ва аз ҷиҳати токенҳо сарфакортар шуданд.'
InstallationNotes: Як файли иҷрошаванда GUI, TUI, CLI ва MCP-серверро дар бар мегирад. Барои фазои кории клавиатурӣ дар терминал 'devprojex', барои маълумотномаи CLI 'devprojex help' ва барои оғози MCP-сервер 'devprojex mcp --root .'-ро иҷро кунед.
