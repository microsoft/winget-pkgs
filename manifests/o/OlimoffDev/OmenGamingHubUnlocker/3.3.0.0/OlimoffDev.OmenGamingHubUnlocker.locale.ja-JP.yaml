InstallationNotes: アンインストール前に、ファイアウォール、hosts ファイル、サービス、タスク、スタートアップへの変更も元に戻す場合は、ユーティリティを開いて「元の設定を復元」を選択してください。WinGet のアンインストールで削除されるのは、ポータブル実行ファイルとコマンドエイリアスのみです。
