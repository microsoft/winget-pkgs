ReleaseNotes: 스마트 Windows 언어 감지 및 전체 언어 선택 메뉴와 함께 30개의 인터페이스 언어를 추가합니다. 다국어 콘솔 테이블 정렬을 개선합니다. 지원되는 모든 언어에 대해 로컬라이즈된 WinGet 메타데이터를 추가합니다.
