InstallationNotes: 서비스 변경 모드는 관리자 권한이 필요합니다. Bluetooth 헤드셋 마이크를 유지하려면 소프트 리셋로 시작하십시오; 하드 모드는 HFP를 시스템 전체에서 비활성화합니다.
