InstallationNotes: โหมดการเปลี่ยนบริการต้องใช้ผู้ดูแลระบบ เริ่มต้นด้วย รีเซ็ตซอฟต์แวร์ เพื่อรักษาไมโครโฟนของหูฟังบลูทูธ; โหมดฮาร์ด ปิดการทำงาน HFP ทั่วทั้งระบบ
