ShortDescription: Resets or disables Windows Bluetooth Hands-Free services when a headset is stuck in low-quality call mode.
Description: A Windows utility for Bluetooth headsets that remain in low-quality Hands-Free call mode after a game or voice application stops using the microphone. Soft reset tries to restore normal stereo audio by restarting active Hands-Free services without disabling the headset microphone or changing service startup settings. If low-quality audio keeps returning, Hard mode backs up and disables these services for stable stereo playback, which also disables the headset microphone. Restore returns the saved Windows service settings.
