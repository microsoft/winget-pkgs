ShortDescription: Restores high-quality Bluetooth stereo audio by managing Windows Hands-Free services.
Description: Fixes Bluetooth headsets stuck in low-quality Hands-Free call mode on Windows. Soft reset restarts active HFP services, while Hard mode safely disables HFP after saving its original state. Restore returns the saved service configuration. Hard mode also disables the Bluetooth headset microphone.
