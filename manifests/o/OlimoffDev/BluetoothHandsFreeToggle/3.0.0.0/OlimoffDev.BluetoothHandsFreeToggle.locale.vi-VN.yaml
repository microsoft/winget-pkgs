ReleaseNotes: 'BluetoothHandsFreeToggle nay có tên là StereoKeeper; lệnh là stereokeeper thay cho bhft. Phiên bản 3.0 thay bảng điều khiển dòng lệnh bằng ứng dụng khay hệ thống: bảng trạng thái cho biết chế độ cuộc gọi và ứng dụng đang giữ micro của tai nghe, và khôi phục stereo chỉ bằng một nút. “Luôn stereo” giờ là một công tắc duy nhất, và khi tắt nó, Windows trở về đúng như cũ. Mới nữa: thông báo của Windows, khởi động cùng Windows, trợ giúp dễ hiểu về cách hoàn tác mọi thứ, nút sao chép thông tin chẩn đoán cho báo cáo lỗi và khắc phục an toàn dịch vụ âm thanh tai nghe ngừng phản hồi. Các thay đổi dịch vụ chạy trong một tiến trình riêng mà Windows hỏi quyền.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Chạy stereokeeper (ví dụ từ Win+R) và bấm vào biểu tượng của nó trong khay hệ thống. Bật “Khởi động cùng Windows” trong phần cài đặt để nó luôn ở đó sau mỗi lần đăng nhập. Hiển thị trạng thái không cần quyền đặc biệt; Windows chỉ hỏi quyền quản trị viên cho “Khôi phục stereo” và “Luôn stereo”. Trước khi gỡ cài đặt, hãy tắt “Luôn stereo” để micro của tai nghe hoạt động lại.
