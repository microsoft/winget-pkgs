ShortDescription: 'Ứng dụng khay hệ thống sửa âm thanh tai nghe Bluetooth bị rè đục, mono trên Windows 10 và 11: cho biết ứng dụng nào đã chuyển tai nghe sang chế độ cuộc gọi (HFP) và khôi phục stereo chỉ với một cú nhấp.'
Description: |-
  StereoKeeper (trước đây là BluetoothHandsFreeToggle) sửa lỗi tai nghe Bluetooth và tai nghe chơi game đột nhiên nghe rè đục, mono hoặc như đang gọi điện trên Windows 10 và Windows 11. Điều này xảy ra khi một trò chơi như Call of Duty, Discord, trình duyệt hoặc phần mềm ghi âm bật micro của tai nghe: Windows chuyển tai nghe từ stereo A2DP sang hồ sơ cuộc gọi rảnh tay (HFP) và đôi khi không chuyển lại.
  Ứng dụng nằm ở khay hệ thống. Biểu tượng cho thấy tai nghe đang phát stereo hay ở chế độ cuộc gọi, còn bảng điều khiển nêu tên ứng dụng đang dùng micro của tai nghe. “Khôi phục stereo” khởi động lại âm thanh tai nghe một lần mà không đổi cài đặt Windows, nên micro của tai nghe vẫn hoạt động. “Luôn stereo” chặn hẳn chế độ cuộc gọi khi bạn dùng micro khác, và khi tắt nó, Windows trở về đúng như cũ.
  Miễn phí và mã nguồn mở, 30 ngôn ngữ giao diện, thông báo tùy chọn, khởi động cùng Windows và không có dịch vụ chạy nền. Windows chỉ hỏi quyền khi ứng dụng thay đổi điều gì đó.
