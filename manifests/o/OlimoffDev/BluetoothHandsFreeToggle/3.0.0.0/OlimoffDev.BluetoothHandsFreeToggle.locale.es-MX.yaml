ReleaseNotes: 'BluetoothHandsFreeToggle ahora se llama StereoKeeper; el comando es stereokeeper en lugar de bhft. La versión 3.0 sustituye la consola por una app de bandeja: un panel de estado muestra el modo llamada y la aplicación que usa el micrófono de los audífonos, y recupera el estéreo con un botón. “Siempre estéreo” ahora es un único interruptor y, al desactivarlo, Windows vuelve a quedar exactamente como estaba. También es nuevo: notificaciones de Windows, inicio con Windows, una ayuda en lenguaje sencillo para deshacerlo todo, un botón que copia datos de diagnóstico para reportar errores y la recuperación segura de un servicio de audio bloqueado. Los cambios en los servicios se ejecutan en un proceso aparte para el que Windows pide permiso.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Ejecuta stereokeeper (por ejemplo, desde Win+R) y da clic en su ícono de la bandeja del sistema. Activa “Iniciar con Windows” en sus ajustes para que se quede ahí después de cada inicio de sesión. Mostrar el estado no requiere permisos especiales; Windows solo pide permiso de administrador para “Recuperar el estéreo” y “Siempre estéreo”. Antes de desinstalar, desactiva “Siempre estéreo” para que el micrófono de los audífonos vuelva a funcionar.
