ReleaseNotes: 'O BluetoothHandsFreeToggle agora se chama StereoKeeper; o comando agora é stereokeeper, em vez de bhft. A versão 3.0 troca o console por um app na bandeja: um painel de status mostra o modo chamada e o app que está usando o microfone do headset, e volta ao estéreo com um botão. “Sempre estéreo” agora é um único interruptor, e ao desativá-lo o Windows volta exatamente como estava. Também é novidade: notificações do Windows, início com o Windows, uma ajuda em linguagem simples sobre como desfazer tudo, um botão que copia informações de diagnóstico para relatar erros e a recuperação segura de um serviço de áudio do headset travado. As alterações nos serviços rodam em um processo separado, para o qual o Windows pede permissão.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Execute o stereokeeper (por exemplo, pelo Win+R) e clique no ícone dele na bandeja do sistema. Ative “Iniciar com o Windows” nas configurações para mantê-lo lá após cada login. Mostrar o status não exige permissões especiais; o Windows pede permissão de administrador apenas para “Voltar ao estéreo” e “Sempre estéreo”. Antes de desinstalar, desative “Sempre estéreo” para o microfone do headset voltar a funcionar.
