PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: pt-BR
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'App na bandeja que corrige o som mono e sem qualidade dos fones Bluetooth no Windows 10 e 11: mostra qual app colocou seus fones em modo chamada (HFP) e volta ao estéreo com um clique.'
Description: |-
  O StereoKeeper (antes BluetoothHandsFreeToggle) corrige fones de ouvido Bluetooth e headsets gamer que de repente perdem qualidade, ficam em mono ou soam como uma ligação telefônica no Windows 10 e no Windows 11. Isso acontece quando um jogo como Call of Duty, o Discord, um navegador ou um programa de gravação liga o microfone do headset: o Windows muda os fones do estéreo A2DP para o perfil de chamada Hands-Free (HFP) e às vezes não volta.
  O app fica na bandeja do sistema. O ícone mostra num relance se os fones tocam em estéreo ou estão em modo chamada, e o painel diz qual app está usando o microfone do headset. “Voltar ao estéreo” reinicia o som dos fones uma vez, sem mudar as configurações do Windows, então o microfone do headset continua funcionando. “Sempre estéreo” bloqueia o modo chamada de vez quando você usa outro microfone, e ao desativar o Windows volta exatamente como estava.
  Gratuito e de código aberto, 30 idiomas de interface, notificações opcionais, inicia com o Windows e sem nenhum serviço em segundo plano. O Windows pede permissão só quando o app altera alguma coisa.
