PackageVersion: 3.0.0.0
PackageLocale: zh-TW
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 系統匣小程式，修復 Windows 10 和 11 上藍牙耳機聲音悶悶的、變成單聲道的問題：顯示是哪個應用程式把耳機切換到通話模式（HFP），並一鍵恢復立體聲。
Description: |-
  StereoKeeper（前身為 BluetoothHandsFreeToggle）用來修復藍牙耳機和電競耳機麥克風在 Windows 10 和 Windows 11 上突然聲音悶悶的、變成單聲道，或聽起來像在講電話的問題。當《決勝時刻》等遊戲、Discord、瀏覽器或錄製軟體開啟耳機麥克風時，Windows 會把耳機從 A2DP 立體聲切換到免持（HFP）通話模式，有時還不會自動切回來。
  本程式常駐在系統匣。系統匣圖示一眼就能看出耳機是在播放立體聲，還是處於通話模式；面板還會指出是哪個應用程式在使用耳機麥克風。「恢復立體聲」只會重新啟動一次耳機音效，不變更 Windows 設定，所以耳機麥克風仍可使用。如果你用的是其他麥克風，「永遠立體聲」可以徹底封鎖通話模式；關閉後，Windows 會完全恢復原狀。
  免費開源，支援 30 種介面語言，可選用通知，可隨 Windows 啟動，沒有常駐的背景服務。只有在程式要變更設定時，Windows 才會要求權限。
