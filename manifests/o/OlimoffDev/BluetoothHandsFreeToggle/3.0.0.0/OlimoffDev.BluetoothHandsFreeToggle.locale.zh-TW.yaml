ReleaseNotes: BluetoothHandsFreeToggle 現已更名為 StereoKeeper；指令由 bhft 改為 stereokeeper。3.0 版以系統匣程式取代了主控台：狀態面板會顯示通話模式以及占用耳機麥克風的應用程式，並可一鍵恢復立體聲。「永遠立體聲」現在只是一個開關，關閉後 Windows 會完全恢復原狀。另外還新增：Windows 通知、隨 Windows 啟動、用白話說明如何還原一切的說明、可複製診斷資訊以回報問題的按鈕，以及對卡住的耳機音效服務的安全復原。對服務的變更會在獨立的處理程序中執行，Windows 會為此要求權限。
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: 執行 stereokeeper（例如透過 Win+R），然後點選系統匣中的圖示。在設定中開啟「隨 Windows 啟動」，每次登入後就會留在系統匣。顯示狀態不需要特殊權限；只有執行「恢復立體聲」和「永遠立體聲」時，Windows 才會要求系統管理員權限。解除安裝之前，請先關閉「永遠立體聲」，讓耳機麥克風恢復可用。
