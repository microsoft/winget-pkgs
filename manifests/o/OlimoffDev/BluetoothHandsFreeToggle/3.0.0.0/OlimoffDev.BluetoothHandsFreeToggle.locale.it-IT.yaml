ReleaseNotes: "BluetoothHandsFreeToggle ora si chiama StereoKeeper; il comando è stereokeeper al posto di bhft. La versione 3.0 sostituisce la console con un'app nell'area di notifica: un pannello di stato mostra la modalità chiamata e l'app che tiene il microfono delle cuffie, e ripristina lo stereo con un solo pulsante. «Sempre stereo» ora è un unico interruttore e disattivandolo Windows torna esattamente com'era. Novità anche: notifiche di Windows, avvio con Windows, una guida in parole semplici su come annullare tutto, un pulsante che copia le informazioni diagnostiche per le segnalazioni di bug e il ripristino sicuro di un servizio audio delle cuffie bloccato. Le modifiche ai servizi vengono eseguite in un processo separato per cui Windows chiede il permesso."
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Avvia stereokeeper (per esempio da Win+R) e fai clic sulla sua icona nell'area di notifica. Attiva «Avvia con Windows» nelle impostazioni per tenerlo lì dopo ogni accesso. Mostrare lo stato non richiede permessi speciali; Windows chiede il permesso di amministratore solo per «Ripristina stereo» e «Sempre stereo». Prima di disinstallare, disattiva «Sempre stereo» così il microfono delle cuffie torna a funzionare.
