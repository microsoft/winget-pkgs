PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: it-IT
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: "App nell'area di notifica che corregge l'audio Bluetooth ovattato e mono su Windows 10 e 11: mostra quale app ha portato le cuffie in modalità chiamata (HFP) e ripristina lo stereo con un clic."
Description: |-
  StereoKeeper (in precedenza BluetoothHandsFreeToggle) sistema le cuffie Bluetooth e gli headset da gaming che all'improvviso suonano ovattati, in mono o come una telefonata su Windows 10 e Windows 11. Succede quando un gioco come Call of Duty, Discord, un browser o un programma di registrazione accende il microfono delle cuffie: Windows le porta dallo stereo A2DP al profilo di chiamata vivavoce (HFP) e a volte non torna indietro.
  L'app vive nell'area di notifica. L'icona mostra subito se le cuffie riproducono in stereo o sono in modalità chiamata, e il pannello indica quale app sta usando il microfono delle cuffie. «Ripristina stereo» riavvia una volta l'audio delle cuffie senza cambiare le impostazioni di Windows, così il microfono delle cuffie continua a funzionare. «Sempre stereo» blocca la modalità chiamata in modo permanente se usi un altro microfono, e disattivandolo Windows torna esattamente com'era.
  Gratuita e open source, 30 lingue dell'interfaccia, notifiche facoltative, avvio con Windows e nessun servizio in background. Windows chiede il permesso solo quando l'app cambia qualcosa.
