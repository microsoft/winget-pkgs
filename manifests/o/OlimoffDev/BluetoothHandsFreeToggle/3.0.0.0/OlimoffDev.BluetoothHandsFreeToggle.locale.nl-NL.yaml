PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: nl-NL
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'Systeemvak-app die dof mono-geluid van Bluetooth-koptelefoons in Windows 10 en 11 verhelpt: toont welke app je headset in gespreksmodus (HFP) zette en brengt stereo met één klik terug.'
Description: |-
  StereoKeeper (voorheen BluetoothHandsFreeToggle) herstelt Bluetooth-koptelefoons en gamingheadsets die in Windows 10 en Windows 11 ineens dof, mono of als een telefoongesprek klinken. Dat komt voor wanneer een game zoals Call of Duty, Discord, een browser of opnamesoftware de microfoon van de headset aanzet: Windows schakelt de koptelefoon van A2DP-stereo over naar het gesprekprofiel Hands-Free (HFP) en schakelt soms niet terug.
  De app draait in het systeemvak. Het pictogram toont meteen of je koptelefoon in stereo klinkt of in gespreksmodus staat, en het paneel noemt de app die de microfoon van de headset gebruikt. “Stereo herstellen” herstart het koptelefoongeluid eenmalig zonder Windows-instellingen te wijzigen, zodat de microfoon van de headset blijft werken. “Altijd stereo” blokkeert de gespreksmodus blijvend als je een andere microfoon gebruikt, en uitzetten brengt Windows precies terug zoals het was.
  Gratis en open source, 30 interfacetalen, optionele meldingen, starten met Windows en geen achtergrondservice. Windows vraagt alleen om toestemming wanneer de app iets wijzigt.
