ReleaseNotes: 'BluetoothHandsFreeToggle heet nu StereoKeeper; de opdracht is stereokeeper in plaats van bhft. Versie 3.0 vervangt de console door een systeemvak-app: een statuspaneel toont de gespreksmodus en de app die de microfoon van de headset vasthoudt, en brengt stereo terug met één knop. “Altijd stereo” is nu één schakelaar en uitzetten brengt Windows precies terug zoals het was. Ook nieuw: Windows-meldingen, starten met Windows, begrijpelijke help over hoe je alles ongedaan maakt, een knop die diagnostische gegevens kopieert voor foutmeldingen, en veilig herstel van een vastgelopen audioservice van de headset. Wijzigingen aan services draaien in een apart proces waarvoor Windows om toestemming vraagt.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Start stereokeeper (bijvoorbeeld via Win+R) en klik op het pictogram in het systeemvak. Zet “Starten met Windows” aan in de instellingen om het na elke aanmelding daar te houden. Voor het tonen van de status zijn geen speciale rechten nodig. Windows vraagt alleen om beheerderstoestemming voor “Stereo herstellen” en “Altijd stereo”. Zet “Altijd stereo” uit voordat je de app verwijdert, zodat de microfoon van de headset weer werkt.
