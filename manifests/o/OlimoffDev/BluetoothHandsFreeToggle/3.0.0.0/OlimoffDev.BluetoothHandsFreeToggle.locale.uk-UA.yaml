PackageVersion: 3.0.0.0
PackageLocale: uk-UA
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'Програма в треї, що виправляє глухий моно-звук Bluetooth-навушників у Windows 10 і 11: показує, яка програма перевела навушники в режим дзвінка (HFP), і повертає стерео одним кліком.'
Description: |-
  StereoKeeper (раніше BluetoothHandsFreeToggle) виправляє Bluetooth-навушники та ігрові гарнітури, які в Windows 10 і Windows 11 раптом починають звучати глухо, в моно або як телефонний дзвінок. Так буває, коли гра на кшталт Call of Duty, Discord, браузер або програма для запису вмикає мікрофон навушників: Windows перемикає їх зі стерео A2DP у режим дзвінка Hands-Free (HFP) і іноді не повертає назад.
  Програма живе в треї. Значок одразу показує, чи грають навушники в стерео, чи вони в режимі дзвінка, а панель називає програму, яка використовує мікрофон навушників. «Повернути стерео» разово перезапускає звук навушників, не змінюючи налаштувань Windows, тому мікрофон навушників продовжує працювати. «Завжди стерео» назавжди забороняє режим дзвінка, якщо ви користуєтеся іншим мікрофоном, а вимкнення повертає Windows точно як було.
  Безкоштовно й з відкритим кодом, 30 мов інтерфейсу, сповіщення за бажанням, запуск разом із Windows і жодних фонових служб. Windows запитує дозвіл, лише коли програма щось змінює.
