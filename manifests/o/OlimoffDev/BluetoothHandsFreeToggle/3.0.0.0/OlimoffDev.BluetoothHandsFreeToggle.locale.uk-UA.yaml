ReleaseNotes: 'BluetoothHandsFreeToggle тепер називається StereoKeeper; запуск тепер через stereokeeper замість bhft. Версія 3.0 замінює консоль програмою в треї: панель показує режим дзвінка і програму, що тримає мікрофон навушників, а стерео повертається однією кнопкою. «Завжди стерео» тепер є одним перемикачем, а його вимкнення повертає Windows точно як було. Також нове: сповіщення Windows, запуск разом із Windows, зрозуміла довідка про те, як усе повернути, кнопка, що копіює відомості для повідомлення про помилку, і безпечне відновлення завислої служби звуку навушників. Зміни служб виконуються в окремому процесі, на який Windows запитує дозвіл.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Запустіть stereokeeper (наприклад, через Win+R) і натисніть його значок у треї. Щоб значок залишався там після кожного входу, увімкніть у налаштуваннях «Запускати з Windows». Щоб показати стан, особливі права не потрібні; Windows запитує дозвіл адміністратора лише для «Повернути стерео» і «Завжди стерео». Перед видаленням вимкніть «Завжди стерео», щоб мікрофон навушників знову запрацював.
