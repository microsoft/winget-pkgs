ReleaseNotes: BluetoothHandsFreeToggle 现已更名为 StereoKeeper；命令由 bhft 改为 stereokeeper。3.0 版用托盘程序取代了控制台：状态面板会显示通话模式以及占用耳机麦克风的应用，并可一键恢复立体声。“始终立体声”现在只是一个开关，关闭后 Windows 会完全恢复原状。此外还新增：Windows 通知、随 Windows 启动、用大白话说明如何恢复一切的帮助、可复制诊断信息用于反馈问题的按钮，以及对卡住的耳机音频服务的安全恢复。对服务的更改在单独的进程中运行，Windows 会为此请求权限。
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: 运行 stereokeeper（例如通过 Win+R），然后点击系统托盘中的图标。在设置中打开“随 Windows 启动”，即可在每次登录后让它保持在托盘中。显示状态不需要特殊权限；只有执行“恢复立体声”和“始终立体声”时，Windows 才会请求管理员权限。卸载之前，请先关闭“始终立体声”，让耳机麦克风恢复可用。
