ShortDescription: 托盘小程序，修复 Windows 10 和 11 上蓝牙耳机声音发闷、变成单声道的问题：显示是哪个应用把耳机切换到了通话模式（HFP），并一键恢复立体声。
Description: |-
  StereoKeeper（原 BluetoothHandsFreeToggle）用来修复蓝牙耳机和游戏耳麦在 Windows 10 和 Windows 11 上突然声音发闷、变成单声道，或听起来像打电话的问题。当《使命召唤》等游戏、Discord、浏览器或录制软件打开耳机麦克风时，Windows 会把耳机从 A2DP 立体声切换到免提（HFP）通话模式，有时还不会自动切回来。
  本程序常驻系统托盘。托盘图标一眼就能看出耳机是在播放立体声，还是处于通话模式；面板还会说出是哪个应用在使用耳机麦克风。“恢复立体声”只会重启一次耳机音频，不更改 Windows 设置，所以耳机麦克风仍可使用。如果您用的是其他麦克风，“始终立体声”可以彻底阻止通话模式；关闭它后，Windows 会完全恢复原状。
  免费开源，支持 30 种界面语言，可选通知，可随 Windows 启动，没有后台服务。只有在程序要更改设置时，Windows 才会请求权限。
