PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: es-ES
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'App de bandeja que arregla el sonido mono y apagado de los auriculares Bluetooth en Windows 10 y 11: muestra qué aplicación pasó tus auriculares al modo llamada (HFP) y recupera el estéreo con un clic.'
Description: |-
  StereoKeeper (antes BluetoothHandsFreeToggle) arregla los auriculares Bluetooth y los cascos para juegos que de repente suenan apagados, en mono o como una llamada telefónica en Windows 10 y Windows 11. Ocurre cuando un juego como Call of Duty, Discord, un navegador o un programa de grabación activa el micrófono de los auriculares: Windows los cambia del estéreo A2DP al perfil de llamada Hands-Free (HFP) y a veces no vuelve a cambiarlos.
  La app vive en la bandeja del sistema. El icono de la bandeja muestra de un vistazo si tus auriculares suenan en estéreo o están en modo llamada, y el panel indica qué aplicación está usando su micrófono. «Recuperar el estéreo» reinicia una vez el sonido de los auriculares sin cambiar la configuración de Windows, así que el micrófono sigue funcionando. «Siempre estéreo» bloquea el modo llamada de forma permanente si usas otro micrófono, y al desactivarlo Windows vuelve a quedar exactamente como estaba.
  Gratuita y de código abierto, 30 idiomas, notificaciones opcionales, inicio con Windows y sin servicios en segundo plano. Windows solo pide permiso cuando la app cambia algo.
