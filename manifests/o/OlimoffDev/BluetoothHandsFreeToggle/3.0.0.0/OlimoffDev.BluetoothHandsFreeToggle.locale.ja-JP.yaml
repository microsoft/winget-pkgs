PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: ja-JP
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: Windows 10/11 で Bluetooth ヘッドホンの音がこもる・モノラルになる問題を直すトレイアプリ。どのアプリがヘッドセットを通話モード (HFP) にしたかを表示し、ワンクリックでステレオに戻します。
Description: |-
  StereoKeeper (旧 BluetoothHandsFreeToggle) は、Windows 10 / Windows 11 で Bluetooth ヘッドホンやゲーミングヘッドセットの音が突然こもったり、モノラルになったり、電話のような音になったりする問題を直します。Call of Duty などのゲーム、Discord、ブラウザー、録音ソフトがヘッドセットのマイクをオンにすると、Windows はヘッドホンを A2DP ステレオからハンズフリー (HFP) の通話プロファイルに切り替え、元に戻らないことがあります。
  アプリはシステムトレイにいます。トレイのアイコンを見れば、ヘッドホンがステレオか通話モードかがひと目でわかり、パネルにはヘッドセットのマイクを使っているアプリの名前が表示されます。「ステレオに戻す」は、Windows の設定を変えずにヘッドホンの音を一度だけ再起動するので、ヘッドセットのマイクはそのまま使えます。「常にステレオ」は、別のマイクを使う人のために通話モードをずっとブロックし、オフにすると Windows はまったく元のとおりに戻ります。
  無料のオープンソースで、30 言語に対応。通知は任意、Windows と同時に起動でき、常駐サービスもありません。Windows が許可を求めるのは、アプリが何かを変更するときだけです。
