ReleaseNotes: 'BluetoothHandsFreeToggle は StereoKeeper に名前が変わりました。コマンドは bhft から stereokeeper に変わりました。バージョン 3.0 では、コンソールをトレイアプリに置き換えました。状態パネルが通話モードとヘッドセットのマイクを使っているアプリを表示し、ボタン一つでステレオに戻せます。「常にステレオ」は一つのスイッチになり、オフにすると Windows がまったく元のとおりに戻ります。そのほかの新機能: Windows の通知、Windows と同時に起動、すべてを元に戻す方法のやさしいヘルプ、不具合報告用に情報をコピーするボタン、固まったヘッドセットの音声サービスの安全な復旧。サービスの変更は別のプロセスで実行され、Windows が許可を求めます。'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: stereokeeper（たとえば Win+R から）を起動し、システムトレイのアイコンをクリックしてください。サインインのたびにトレイに表示されるよう、設定で「Windows と同時に起動」をオンにしてください。状態の表示に特別な権限は要りません。Windows が管理者の許可を求めるのは、「ステレオに戻す」と「常にステレオ」のときだけです。アンインストールする前に「常にステレオ」をオフにして、ヘッドセットのマイクがまた使える状態にしてください。
