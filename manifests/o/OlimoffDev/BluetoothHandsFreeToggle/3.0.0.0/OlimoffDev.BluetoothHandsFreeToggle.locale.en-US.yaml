ShortDescription: 'Tray app that fixes dull, mono Bluetooth headphone audio on Windows 10 and 11: shows which app switched your headset to call mode (HFP) and brings stereo back in one click.'
Description: |-
  StereoKeeper (formerly BluetoothHandsFreeToggle) fixes Bluetooth headphones and gaming headsets that suddenly sound dull, mono, or like a phone call on Windows 10 and Windows 11. It happens when a game such as Call of Duty, Discord, a browser, or recording software turns on the headset microphone: Windows switches the headphones from A2DP stereo to the Hands-Free (HFP) call profile and sometimes does not switch back.
  The app lives in the system tray. The tray icon shows at a glance whether your headphones play in stereo or are in call mode, and the panel names the app that is using the headset microphone. Bring back stereo restarts the headphone sound once without changing Windows settings, so the headset microphone keeps working. Always stereo blocks call mode for good when you use another microphone, and turning it off puts Windows back exactly as it was.
  Free and open source, 30 interface languages, optional notifications, start with Windows, and no background service. Windows asks for permission only when the app changes a setting.
