ReleaseNotes: 'BluetoothHandsFreeToggle is now StereoKeeper; the command is stereokeeper instead of bhft. Version 3.0 replaces the console with a tray app: a status panel shows call mode and the app using the headset microphone, and brings stereo back with one button. Always stereo is now a single switch, and turning it off puts Windows back exactly as it was. Also new: Windows notifications, start with Windows, plain-language help on how to undo everything, a button that copies diagnostics for bug reports, and safe recovery of a headset audio service that stops responding. Service changes run in a separate process that Windows asks permission for.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Run stereokeeper (for example from Win+R) and click its icon in the system tray. Turn on Start with Windows in its settings to keep it there after every sign-in. Showing the status needs no special rights; Windows asks for administrator permission only for Bring back stereo and Always stereo. Before uninstalling, turn Always stereo off so the headset microphone works again.
