PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: de-DE
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'Tray-App gegen dumpfen Mono-Sound bei Bluetooth-Kopfhörern unter Windows 10 und 11: Sie zeigt, welche App Ihr Headset in den Anrufmodus (HFP) geschaltet hat, und holt Stereo mit einem Klick zurück.'
Description: |-
  StereoKeeper (ehemals BluetoothHandsFreeToggle) repariert Bluetooth-Kopfhörer und Gaming-Headsets, die unter Windows 10 und Windows 11 plötzlich dumpf, mono oder wie ein Telefonanruf klingen. Das passiert, wenn ein Spiel wie Call of Duty, Discord, ein Browser oder eine Aufnahmesoftware das Headset-Mikrofon einschaltet: Windows schaltet die Kopfhörer von A2DP-Stereo in das Anrufprofil Hands-Free (HFP) und schaltet manchmal nicht zurück.
  Die App läuft im Infobereich der Taskleiste. Das Symbol zeigt auf einen Blick, ob Ihre Kopfhörer in Stereo spielen oder im Anrufmodus sind, und das Panel nennt die App, die das Headset-Mikrofon verwendet. „Stereo zurückholen“ startet den Kopfhörer-Sound einmal neu, ohne Windows-Einstellungen zu ändern, sodass das Headset-Mikrofon weiter funktioniert. „Immer Stereo“ sperrt den Anrufmodus dauerhaft, wenn Sie ein anderes Mikrofon nutzen, und beim Ausschalten ist Windows genau wie vorher.
  Kostenlos und Open Source, 30 Oberflächensprachen, optionale Benachrichtigungen, Start mit Windows und kein Hintergrunddienst. Windows fragt nur dann nach Erlaubnis, wenn die App etwas ändert.
