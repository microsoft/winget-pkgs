ReleaseNotes: 'BluetoothHandsFreeToggle heißt jetzt StereoKeeper; der Befehl lautet stereokeeper statt bhft. Version 3.0 ersetzt die Konsole durch eine Tray-App: Ein Statuspanel zeigt den Anrufmodus und die App, die das Headset-Mikrofon belegt, und holt Stereo mit einer Schaltfläche zurück. „Immer Stereo“ ist jetzt ein einzelner Schalter, und beim Ausschalten ist Windows genau wie vorher. Neu sind außerdem Windows-Benachrichtigungen, Start mit Windows, eine verständliche Hilfe zum Rückgängigmachen, eine Schaltfläche, die Diagnosedaten für Fehlerberichte kopiert, und die sichere Wiederherstellung eines nicht reagierenden Headset-Audiodienstes. Änderungen an Diensten laufen in einem separaten Prozess, für den Windows um Erlaubnis fragt.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Starten Sie stereokeeper (zum Beispiel über Win+R) und klicken Sie auf sein Symbol im Infobereich. Aktivieren Sie in den Einstellungen „Mit Windows starten“, damit es nach jeder Anmeldung dort bleibt. Die Statusanzeige braucht keine besonderen Rechte. Windows fragt nur bei „Stereo zurückholen“ und „Immer Stereo“ nach Administratorrechten. Schalten Sie vor dem Deinstallieren „Immer Stereo“ aus, damit das Headset-Mikrofon wieder funktioniert.
