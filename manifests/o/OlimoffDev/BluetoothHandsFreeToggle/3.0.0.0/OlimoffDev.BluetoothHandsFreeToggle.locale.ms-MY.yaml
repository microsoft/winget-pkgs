ReleaseNotes: 'BluetoothHandsFreeToggle kini dinamakan StereoKeeper; arahannya ialah stereokeeper dan bukannya bhft. Versi 3.0 menggantikan konsol dengan aplikasi dulang: panel status menunjukkan mod panggilan dan aplikasi yang menggunakan mikrofon fon kepala, serta memulihkan stereo dengan satu butang. “Sentiasa stereo” kini satu suis, dan apabila dimatikan Windows kembali tepat seperti asal. Baharu juga: pemberitahuan Windows, mula bersama Windows, bantuan dalam bahasa mudah tentang cara mengembalikan semuanya, butang yang menyalin diagnostik untuk laporan pepijat, dan pemulihan selamat perkhidmatan audio fon kepala yang tersekat. Perubahan perkhidmatan berjalan dalam proses berasingan yang Windows minta kebenarannya.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Jalankan stereokeeper (contohnya dari Win+R) dan klik ikonnya di dulang sistem. Hidupkan “Mula bersama Windows” dalam tetapan supaya ia kekal di sana selepas setiap log masuk. Memaparkan status tidak memerlukan hak khas; Windows meminta kebenaran pentadbir hanya untuk “Pulihkan stereo” dan “Sentiasa stereo”. Sebelum menyahpasang, matikan “Sentiasa stereo” supaya mikrofon fon kepala berfungsi semula.
