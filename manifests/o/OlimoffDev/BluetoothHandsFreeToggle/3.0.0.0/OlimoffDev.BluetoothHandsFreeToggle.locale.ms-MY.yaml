ShortDescription: 'Aplikasi dulang yang membaiki bunyi fon kepala Bluetooth yang tersekat-sekat dan mono dalam Windows 10 dan 11: menunjukkan aplikasi mana yang menukar fon kepala ke mod panggilan (HFP) dan memulihkan stereo dengan satu klik.'
Description: |-
  StereoKeeper (sebelumnya BluetoothHandsFreeToggle) membaiki fon kepala Bluetooth dan fon kepala permainan yang tiba-tiba kedengaran tersekat-sekat, mono, atau seperti panggilan telefon dalam Windows 10 dan Windows 11. Ini berlaku apabila permainan seperti Call of Duty, Discord, pelayar, atau perisian rakaman menghidupkan mikrofon fon kepala: Windows menukar fon kepala daripada stereo A2DP ke profil panggilan Hands-Free (HFP) dan kadangkala tidak menukarnya kembali.
  Aplikasi ini berada di dulang sistem. Ikon dulang terus menunjukkan sama ada fon kepala memainkan stereo atau berada dalam mod panggilan, dan panelnya menamakan aplikasi yang menggunakan mikrofon fon kepala. “Pulihkan stereo” memulakan semula bunyi fon kepala sekali tanpa mengubah tetapan Windows, jadi mikrofon fon kepala terus berfungsi. “Sentiasa stereo” menyekat mod panggilan secara kekal jika anda menggunakan mikrofon lain, dan apabila dimatikan Windows kembali tepat seperti asal.
  Percuma dan sumber terbuka, 30 bahasa antara muka, pemberitahuan pilihan, mula bersama Windows, dan tiada perkhidmatan latar belakang. Windows hanya meminta kebenaran apabila aplikasi mengubah sesuatu.
