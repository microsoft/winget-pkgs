ReleaseNotes: 'A BluetoothHandsFreeToggle mostantól StereoKeeper néven fut; a parancs a bhft helyett stereokeeper. A 3.0-s verzió a konzolt tálcaalkalmazásra cseréli: az állapotpanel megmutatja a hívásmódot és a headset mikrofonját fogó alkalmazást, és egyetlen gombbal visszahozza a sztereót. A „Mindig sztereó” mostantól egyetlen kapcsoló, a kikapcsolása pedig pontosan úgy állítja vissza a Windowst, ahogy volt. Újdonság még: Windows-értesítések, indítás a Windows-szal, közérthető súgó arról, hogyan lehet mindent visszaállítani, egy gomb, amely hibajelentéshez másolja a diagnosztikai adatokat, valamint a nem válaszoló headset-hangszolgáltatás biztonságos helyreállítása. A szolgáltatások módosítása külön folyamatban fut, amelyhez a Windows engedélyt kér.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Indítsd el a stereokeepert (például a Win+R-rel), és kattints az ikonjára a tálcán. Kapcsold be az „Indítás a Windows-szal” beállítást, hogy minden bejelentkezés után ott maradjon. Az állapot megjelenítéséhez nincs szükség különleges jogokra; a Windows csak a „Sztereó visszahozása” és a „Mindig sztereó” esetén kér rendszergazdai engedélyt. Eltávolítás előtt kapcsold ki a „Mindig sztereó” funkciót, hogy a headset mikrofonja újra működjön.
