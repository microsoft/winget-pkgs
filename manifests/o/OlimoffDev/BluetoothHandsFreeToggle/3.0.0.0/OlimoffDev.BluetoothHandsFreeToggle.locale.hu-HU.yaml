Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'Tálcaalkalmazás, amely megszünteti a Bluetooth fejhallgatók tompa, mono hangját Windows 10 és 11 rendszeren: megmutatja, melyik alkalmazás váltotta hívásmódra (HFP) a fejhallgatót, és egy kattintással visszahozza a sztereót.'
Description: |-
  A StereoKeeper (korábban BluetoothHandsFreeToggle) megjavítja azokat a Bluetooth fejhallgatókat és gamer headseteket, amelyek Windows 10 és Windows 11 alatt hirtelen tompán, monóban vagy telefonhívásként szólnak. Ez akkor történik, amikor egy játék (például a Call of Duty), a Discord, egy böngésző vagy egy felvevőprogram bekapcsolja a headset mikrofonját: a Windows az A2DP sztereóról átvált a Hands-Free (HFP) hívásprofilra, és néha nem kapcsol vissza.
  Az alkalmazás a tálcán él. A tálcaikon első pillantásra megmutatja, hogy a fejhallgató sztereóban szól-e, vagy hívásmódban van, a panel pedig megnevezi a headset mikrofonját használó alkalmazást. A „Sztereó visszahozása” egyszer újraindítja a fejhallgató hangját a Windows beállításainak módosítása nélkül, így a headset mikrofonja tovább működik. A „Mindig sztereó” végleg letiltja a hívásmódot, ha másik mikrofont használsz, a kikapcsolása pedig pontosan úgy állítja vissza a Windowst, ahogy volt.
  Ingyenes és nyílt forráskódú, 30 felületi nyelv, igény szerinti értesítések, indítás a Windows-szal, és nincs háttérszolgáltatás. A Windows csak akkor kér engedélyt, amikor az alkalmazás módosít valamit.
