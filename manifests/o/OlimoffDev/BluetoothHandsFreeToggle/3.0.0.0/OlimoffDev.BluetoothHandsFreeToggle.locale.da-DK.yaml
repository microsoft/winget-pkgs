ReleaseNotes: 'BluetoothHandsFreeToggle hedder nu StereoKeeper; kommandoen er stereokeeper i stedet for bhft. Version 3.0 afløser konsollen med et program i meddelelsesområdet: et statuspanel viser opkaldstilstanden og det program, der bruger headsettets mikrofon, og giver stereo tilbage med én knap. »Altid stereo« er nu én enkelt kontakt, og når du deaktiverer det, bliver Windows præcis, som det var. Nyt er også Windows-notifikationer, start med Windows, hjælp på almindeligt dansk om, hvordan du fortryder alt, en knap, der kopierer diagnostik til fejlrapporter, og sikker genoprettelse af en fastlåst lydtjeneste til headsets. Ændringer af tjenester kører i en separat proces, som Windows beder om tilladelse til.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Start stereokeeper (for eksempel fra Win+R), og klik på ikonet i meddelelsesområdet. Aktivér »Start med Windows« i indstillingerne, så den bliver der efter hver login. At vise status kræver ingen særlige rettigheder. Windows beder kun om administratortilladelse til »Gendan stereo« og »Altid stereo«. Deaktiver »Altid stereo«, før du afinstallerer, så headsettets mikrofon virker igen.
