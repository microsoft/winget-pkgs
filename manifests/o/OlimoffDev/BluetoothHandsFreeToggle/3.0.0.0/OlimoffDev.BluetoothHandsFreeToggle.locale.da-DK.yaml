PackageIdentifier: OlimoffDev.BluetoothHandsFreeToggle
PackageVersion: 3.0.0.0
PackageLocale: da-DK
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'Program i meddelelsesområdet, der retter dump, mono Bluetooth-lyd i Windows 10 og 11: viser, hvilket program der satte hovedtelefonerne i opkaldstilstand (HFP), og giver stereo tilbage med ét klik.'
Description: |-
  StereoKeeper (tidligere BluetoothHandsFreeToggle) retter Bluetooth-hovedtelefoner og gamingheadsets, der pludselig lyder dumpe, i mono eller som et telefonopkald i Windows 10 og Windows 11. Det sker, når et spil som Call of Duty, Discord, en browser eller optageprogrammer aktiverer headsettets mikrofon: Windows skifter fra A2DP-stereo til opkaldsprofilen Hands-Free (HFP) og skifter af og til ikke tilbage.
  Programmet bor i meddelelsesområdet. Ikonet viser med det samme, om hovedtelefonerne spiller i stereo eller er i opkaldstilstand, og panelet nævner det program, der bruger headsettets mikrofon. »Gendan stereo« genstarter hovedtelefonlyden uden at ændre Windows-indstillinger, så headsettets mikrofon bliver ved med at virke. »Altid stereo« blokerer opkaldstilstanden for altid, når du bruger en anden mikrofon, og når du deaktiverer det, bliver Windows præcis, som det var.
  Gratis og open source, 30 sprog, valgfrie notifikationer, start med Windows og ingen baggrundstjeneste. Windows beder kun om tilladelse, når programmet ændrer noget.
