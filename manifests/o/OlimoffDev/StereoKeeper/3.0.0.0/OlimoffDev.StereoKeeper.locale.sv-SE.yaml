License: MIT
ShortDescription: 'Systemfältsapp som fixar dovt, mono Bluetooth-ljud i Windows 10 och 11: visar vilken app som satte hörlurarna i samtalsläge (HFP) och ger tillbaka stereo med ett klick.'
Description: |-
  StereoKeeper (tidigare BluetoothHandsFreeToggle) fixar Bluetooth-hörlurar och gamingheadset som plötsligt låter dova, i mono eller som ett telefonsamtal i Windows 10 och Windows 11. Det händer när ett spel som Call of Duty, Discord, en webbläsare eller ett inspelningsprogram aktiverar headsetets mikrofon: Windows byter från A2DP-stereo till samtalsprofilen Hands-Free (HFP) och byter ibland inte tillbaka.
  Appen finns i systemfältet. Ikonen visar direkt om hörlurarna spelar i stereo eller är i samtalsläge, och panelen nämner appen som använder headsetets mikrofon. ”Återställ stereo” startar om hörlursljudet en gång utan att ändra Windows-inställningar, så headsetets mikrofon kan användas som vanligt. ”Alltid stereo” blockerar samtalsläget för gott när du använder en annan mikrofon, och när du stänger av det blir Windows precis som det var.
  Gratis och öppen källkod, 30 språk, valfria aviseringar, start med Windows och ingen bakgrundstjänst. Windows frågar om tillstånd bara när appen ändrar något.
