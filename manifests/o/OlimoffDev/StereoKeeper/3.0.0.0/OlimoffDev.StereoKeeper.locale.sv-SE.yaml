ReleaseNotes: 'BluetoothHandsFreeToggle heter nu StereoKeeper; kommandot är stereokeeper i stället för bhft. Version 3.0 ersätter konsolen med en app i systemfältet: en statuspanel visar samtalsläget och appen som håller headsetets mikrofon, och ger tillbaka stereo med en knapp. ”Alltid stereo” är nu ett enda reglage, och när du stänger av det blir Windows precis som det var. Nytt är också Windows-aviseringar, start med Windows, hjälp på vanlig svenska om hur du ångrar allt, en knapp som kopierar diagnostik för felrapporter och säker återställning av en frusen ljudtjänst för headset. Ändringar i tjänster körs i en separat process som Windows ber om tillstånd för.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Starta stereokeeper (till exempel via Win+R) och klicka på ikonen i systemfältet. Aktivera ”Starta med Windows” i inställningarna så att den stannar där efter varje inloggning. Att visa statusen kräver inga särskilda behörigheter. Windows ber om administratörsbehörighet bara för ”Återställ stereo” och ”Alltid stereo”. Stäng av ”Alltid stereo” innan du avinstallerar, så att headsetets mikrofon kan användas igen.
