ReleaseNotes: 'Sovelluksen BluetoothHandsFreeToggle uusi nimi on StereoKeeper; komento on nyt stereokeeper (aiemmin bhft). Versio 3.0 korvaa konsolin ilmaisinalueen sovelluksella: tilapaneeli näyttää puhelutilan ja sovelluksen, joka käyttää kuulokkeiden mikrofonia, ja palauttaa stereon yhdellä painikkeella. ”Aina stereo” on nyt yksi kytkin, ja kun kytket sen pois päältä, Windows palaa täsmälleen entiselleen. Uutta ovat myös Windows-ilmoitukset, käynnistys Windowsin mukana, selkeä ohje kaiken kumoamiseen, painike, joka kopioi diagnostiikkatiedot virheraporttia varten, sekä jumiin jääneen kuulokeäänipalvelun turvallinen palautus. Palvelumuutokset suoritetaan erillisessä prosessissa, johon Windows kysyy luvan.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Käynnistä stereokeeper (esimerkiksi Win+R:llä) ja napsauta sen kuvaketta ilmaisinalueella. Kytke asetuksissa päälle ”Käynnistä Windowsin mukana”, jotta se pysyy siellä jokaisen kirjautumisen jälkeen. Tilan näyttäminen ei vaadi erityisiä oikeuksia. Windows kysyy ylläpitäjän luvan vain toiminnoille ”Palauta stereo” ja ”Aina stereo”. Ennen poistoa kytke ”Aina stereo” pois päältä, jotta kuulokkeiden mikrofoni toimii taas.
