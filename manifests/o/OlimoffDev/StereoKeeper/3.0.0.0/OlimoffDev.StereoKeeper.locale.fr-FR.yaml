PackageIdentifier: OlimoffDev.StereoKeeper
PackageVersion: 3.0.0.0
PackageLocale: fr-FR
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: "Application de la barre d'état qui corrige le son Bluetooth sourd et mono sous Windows 10 et 11 : elle montre quelle application a mis votre casque en mode appel (HFP) et rétablit la stéréo en un clic."
Description: |-
  StereoKeeper (anciennement BluetoothHandsFreeToggle) répare les casques Bluetooth et casques gaming qui sonnent soudain sourds, en mono, ou comme un appel téléphonique sous Windows 10 et Windows 11. Cela arrive quand un jeu comme Call of Duty, Discord, un navigateur ou un logiciel d'enregistrement active le micro du casque : Windows fait passer le casque de la stéréo A2DP au profil d'appel mains libres (HFP) et ne revient parfois pas en arrière.
  L'application vit dans la barre d'état. Son icône indique tout de suite si votre casque diffuse en stéréo ou est en mode appel, et le panneau nomme l'application qui utilise le micro du casque. « Rétablir la stéréo » relance une fois le son du casque sans modifier les réglages de Windows, le micro du casque continue donc de fonctionner. « Toujours stéréo » bloque définitivement le mode appel si vous utilisez un autre micro, et le désactiver remet Windows exactement comme avant.
  Gratuit et open source, 30 langues d'interface, notifications facultatives, lancement avec Windows et aucun service en arrière-plan. Windows demande l'autorisation uniquement quand l'application modifie quelque chose.
