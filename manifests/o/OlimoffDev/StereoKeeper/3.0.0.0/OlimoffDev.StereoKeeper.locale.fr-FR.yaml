ReleaseNotes: "BluetoothHandsFreeToggle devient StereoKeeper ; la commande est stereokeeper au lieu de bhft. La version 3.0 remplace la console par une application de la barre d'état : un panneau d'état indique le mode appel et l'application qui utilise le micro du casque, et rétablit la stéréo d'un seul bouton. « Toujours stéréo » devient un simple interrupteur, et le désactiver remet Windows exactement comme avant. Nouveautés aussi : notifications Windows, lancement avec Windows, aide en langage simple pour tout annuler, bouton qui copie les informations de diagnostic pour les signalements de bugs, et récupération sûre d'un service audio du casque bloqué. Les modifications des services s'exécutent dans un processus séparé pour lequel Windows demande l'autorisation."
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Lancez stereokeeper (par exemple avec Win+R) et cliquez sur son icône dans la barre d'état. Activez « Lancer avec Windows » dans ses réglages pour qu'il y reste après chaque ouverture de session. Afficher l'état ne demande aucun droit particulier ; Windows demande l'autorisation de l'administrateur uniquement pour « Rétablir la stéréo » et « Toujours stéréo ». Avant de désinstaller, désactivez « Toujours stéréo » pour que le micro du casque fonctionne de nouveau.
