ReleaseNotes: 'BluetoothHandsFreeToggle nazywa się teraz StereoKeeper; polecenie to stereokeeper zamiast bhft. Wersja 3.0 zastępuje konsolę aplikacją w zasobniku: panel stanu pokazuje tryb rozmowy i aplikację, która trzyma mikrofon słuchawek, a jednym przyciskiem przywraca stereo. „Zawsze stereo” to teraz jeden przełącznik, a jego wyłączenie przywraca Windows dokładnie do poprzedniego stanu. Nowe są też: powiadomienia Windows, uruchamianie z Windows, prosta pomoc o tym, jak wszystko cofnąć, przycisk kopiujący dane diagnostyczne do zgłoszenia błędu oraz bezpieczne naprawianie zawieszonej usługi dźwięku słuchawek. Zmiany w usługach wykonuje osobny proces, o którego zgodę prosi Windows.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Uruchom stereokeeper (na przykład przez Win+R) i kliknij jego ikonę w zasobniku systemowym. Włącz w ustawieniach „Uruchamiaj z Windows”, aby został tam po każdym logowaniu. Wyświetlanie stanu nie wymaga specjalnych uprawnień; Windows prosi o zgodę administratora tylko dla „Przywróć stereo” i „Zawsze stereo”. Przed odinstalowaniem wyłącz „Zawsze stereo”, aby mikrofon słuchawek znów działał.
