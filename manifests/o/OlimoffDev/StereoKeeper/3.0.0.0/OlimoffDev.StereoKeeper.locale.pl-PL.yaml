ShortDescription: 'Aplikacja w zasobniku, która naprawia stłumiony dźwięk mono w słuchawkach Bluetooth w Windows 10 i 11: pokazuje, która aplikacja przełączyła słuchawki na tryb rozmowy (HFP), i przywraca stereo jednym kliknięciem.'
Description: |-
  StereoKeeper (dawniej BluetoothHandsFreeToggle) naprawia słuchawki Bluetooth i gamingowe zestawy słuchawkowe, które w Windows 10 i Windows 11 nagle brzmią głucho, w mono albo jak podczas rozmowy telefonicznej. Dzieje się tak, gdy gra taka jak Call of Duty, Discord, przeglądarka lub program do nagrywania włączy mikrofon słuchawek: Windows przełącza je ze stereo A2DP na tryb rozmowy Hands-Free (HFP) i czasem nie wraca do poprzedniego trybu.
  Aplikacja działa w zasobniku systemowym. Ikona od razu pokazuje, czy słuchawki grają w stereo, czy są w trybie rozmowy, a panel podaje nazwę aplikacji, która używa mikrofonu słuchawek. „Przywróć stereo” jednorazowo uruchamia dźwięk słuchawek od nowa, bez zmiany ustawień Windows, więc mikrofon słuchawek nadal działa. „Zawsze stereo” na stałe blokuje tryb rozmowy, jeśli używasz innego mikrofonu, a po wyłączeniu Windows wraca dokładnie do poprzedniego stanu.
  Darmowa i open source, 30 języków interfejsu, opcjonalne powiadomienia, uruchamianie z Windows i brak usługi w tle. Windows prosi o zgodę tylko wtedy, gdy aplikacja coś zmienia.
