InstallationNotes: เปิด stereokeeper (เช่นจาก Win+R) แล้วคลิกไอคอนในถาดระบบ เปิด “เริ่มพร้อม Windows” ในการตั้งค่าเพื่อให้ไอคอนอยู่ที่นั่นทุกครั้งหลังลงชื่อเข้าใช้ การแสดงสถานะไม่ต้องใช้สิทธิ์พิเศษ Windows จะขอสิทธิ์ผู้ดูแลระบบเฉพาะ “คืนเสียงสเตอริโอ” และ “สเตอริโอตลอด” ก่อนถอนการติดตั้ง ให้ปิด “สเตอริโอตลอด” เพื่อให้ไมโครโฟนของหูฟังใช้งานได้อีกครั้ง
