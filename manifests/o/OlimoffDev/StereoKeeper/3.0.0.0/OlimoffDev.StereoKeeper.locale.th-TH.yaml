ShortDescription: แอปในถาดระบบที่แก้เสียงหูฟังบลูทูธอู้อี้และเป็นโมโนบน Windows 10 และ 11 บอกว่าแอปใดสลับหูฟังไปโหมดโทร (HFP) และคืนเสียงสเตอริโอได้ในคลิกเดียว
Description: |-
  StereoKeeper (ชื่อเดิม BluetoothHandsFreeToggle) แก้ปัญหาหูฟังบลูทูธและหูฟังเกมมิ่งที่จู่ ๆ เสียงก็อู้อี้ เป็นโมโน หรือฟังเหมือนสายโทรศัพท์บน Windows 10 และ Windows 11 เกิดขึ้นเมื่อเกมอย่าง Call of Duty, Discord, เบราว์เซอร์ หรือโปรแกรมอัดเสียงเปิดไมโครโฟนของหูฟัง: Windows จะสลับหูฟังจากสเตอริโอ A2DP ไปโปรไฟล์โทรแบบแฮนด์ฟรี (HFP) และบางครั้งไม่สลับกลับ
  แอปอยู่ในถาดระบบ ไอคอนบอกให้เห็นทันทีว่าหูฟังเล่นเสียงสเตอริโอหรืออยู่ในโหมดโทร และแผงจะบอกชื่อแอปที่ใช้ไมโครโฟนของหูฟัง “คืนเสียงสเตอริโอ” รีสตาร์ทเสียงหูฟังหนึ่งครั้งโดยไม่เปลี่ยนการตั้งค่า Windows ไมโครโฟนของหูฟังจึงยังใช้ได้ “สเตอริโอตลอด” บล็อกโหมดโทรถาวรเมื่อคุณใช้ไมโครโฟนอื่น และเมื่อปิดก็คืน Windows กลับเป็นเหมือนเดิมทุกอย่าง
  ฟรีและโอเพนซอร์ส มี 30 ภาษา การแจ้งเตือนเปิดหรือปิดได้ เริ่มพร้อม Windows และไม่มีบริการเบื้องหลัง Windows จะขออนุญาตเฉพาะตอนที่แอปเปลี่ยนบางอย่าง
