ReleaseNotes: 'BluetoothHandsFreeToggle เปลี่ยนชื่อเป็น StereoKeeper คำสั่งเปลี่ยนจาก bhft เป็น stereokeeper เวอร์ชัน 3.0 เปลี่ยนคอนโซลเป็นแอปในถาดระบบ: แผงสถานะแสดงโหมดโทรและแอปที่ใช้ไมโครโฟนของหูฟัง และคืนเสียงสเตอริโอด้วยปุ่มเดียว “สเตอริโอตลอด” เป็นสวิตช์ตัวเดียว และเมื่อปิดก็คืน Windows กลับเป็นเหมือนเดิมทุกอย่าง ใหม่อีกอย่าง: การแจ้งเตือนของ Windows เริ่มพร้อม Windows วิธีใช้ภาษาง่าย ๆ ว่าจะย้อนทุกอย่างได้อย่างไร ปุ่มคัดลอกข้อมูลวินิจฉัยสำหรับรายงานบั๊ก และการกู้คืนบริการเสียงหูฟังที่ค้างอย่างปลอดภัย การเปลี่ยนบริการทำงานในโปรเซสแยกที่ Windows ขออนุญาต'
