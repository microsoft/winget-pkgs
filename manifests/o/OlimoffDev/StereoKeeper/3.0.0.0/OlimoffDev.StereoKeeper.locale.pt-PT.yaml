PackageIdentifier: OlimoffDev.StereoKeeper
PackageVersion: 3.0.0.0
PackageLocale: pt-PT
Publisher: Olimoff Dev
PackageName: StereoKeeper
License: MIT
ShortDescription: 'Aplicação na área de notificação que corrige o som mono e sem qualidade dos auscultadores Bluetooth no Windows 10 e 11: mostra que aplicação pôs os auscultadores em modo de chamada (HFP) e repõe o estéreo com um clique.'
Description: |-
  O StereoKeeper (antes BluetoothHandsFreeToggle) corrige auscultadores Bluetooth e headsets para jogos que, de repente, perdem qualidade, ficam em mono ou soam como uma chamada telefónica no Windows 10 e no Windows 11. Isto acontece quando um jogo como Call of Duty, o Discord, um navegador ou um programa de gravação liga o microfone do headset: o Windows passa os auscultadores do estéreo A2DP para o perfil de chamada Hands-Free (HFP) e, por vezes, não volta atrás.
  A aplicação fica na área de notificação. O ícone mostra num relance se os auscultadores reproduzem em estéreo ou estão em modo de chamada, e o painel indica que aplicação está a usar o microfone do headset. «Repor o estéreo» reinicia o som dos auscultadores uma vez, sem alterar as definições do Windows, por isso o microfone do headset continua a funcionar. «Sempre estéreo» bloqueia o modo de chamada de vez quando usa outro microfone, e ao desativar o Windows fica exatamente como estava.
  Gratuita e de código aberto, 30 idiomas de interface, notificações opcionais, arranque com o Windows e sem nenhum serviço em segundo plano. O Windows pede autorização apenas quando a aplicação altera alguma coisa.
