ReleaseNotes: 'O BluetoothHandsFreeToggle passa a chamar-se StereoKeeper; o comando é agora stereokeeper em vez de bhft. A versão 3.0 substitui a consola por uma aplicação na área de notificação: um painel de estado mostra o modo de chamada e a aplicação que está a usar o microfone do headset, e repõe o estéreo com um botão. «Sempre estéreo» passa a ser um único interruptor, e ao desativá-lo o Windows fica exatamente como estava. Também há novidades: notificações do Windows, arranque com o Windows, uma ajuda em linguagem simples sobre como desfazer tudo, um botão que copia informações de diagnóstico para comunicar erros e a recuperação segura de um serviço de áudio do headset bloqueado. As alterações nos serviços correm num processo separado, para o qual o Windows pede autorização.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Execute o stereokeeper (por exemplo, com Win+R) e clique no respetivo ícone na área de notificação. Ative «Iniciar com o Windows» nas definições para o manter aí após cada início de sessão. Mostrar o estado não requer permissões especiais; o Windows pede permissão de administrador apenas para «Repor o estéreo» e «Sempre estéreo». Antes de desinstalar, desative «Sempre estéreo» para o microfone do headset voltar a funcionar.
