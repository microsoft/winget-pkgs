License: MIT
ShortDescription: 'Systemkurv-app som fikser dempet mono-lyd i Bluetooth-hodetelefoner på Windows 10 og 11: viser hvilken app som byttet headsetet til samtalemodus (HFP), og henter tilbake stereo med ett klikk.'
Description: |-
  StereoKeeper (tidligere BluetoothHandsFreeToggle) fikser Bluetooth-hodetelefoner og gaming-headset som plutselig høres dempet ut, i mono eller som en telefonsamtale i Windows 10 og Windows 11. Det skjer når et spill som Call of Duty, Discord, en nettleser eller et opptaksprogram aktiverer headsetmikrofonen: Windows bytter hodetelefonene fra A2DP-stereo til samtaleprofilen håndfri (HFP) og bytter av og til ikke tilbake.
  Appen ligger i systemkurven. Ikonet viser med et blikk om hodetelefonene spiller i stereo eller er i samtalemodus, og panelet nevner appen som bruker headsetmikrofonen. «Få tilbake stereo» starter hodetelefonlyden på nytt uten å endre Windows-innstillinger, så headsetmikrofonen fortsetter å virke. «Alltid stereo» blokkerer samtalemodus for godt hvis du bruker en annen mikrofon, og når du deaktiverer den, settes Windows tilbake nøyaktig som det var.
  Gratis og åpen kildekode, 30 grensesnittspråk, valgfrie meldinger, start med Windows og ingen bakgrunnstjeneste. Windows ber om tillatelse bare når appen endrer noe.
