ReleaseNotes: 'BluetoothHandsFreeToggle heter nå StereoKeeper; kommandoen er stereokeeper i stedet for bhft. Versjon 3.0 avløser konsollen med en systemkurv-app: et statuspanel viser samtalemodus og appen som bruker headsetmikrofonen, og henter tilbake stereo med én knapp. «Alltid stereo» er nå én enkelt bryter, og når du deaktiverer den, settes Windows tilbake nøyaktig som det var. Nytt er også: Windows-meldinger, start med Windows, enkel hjelp om hvordan du angrer alt, en knapp som kopierer diagnostikk til feilrapporter, og trygg gjenoppretting av en fastlåst lydtjeneste for headset. Endringer i tjenester kjører i en egen prosess som Windows ber om tillatelse til.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Kjør stereokeeper (for eksempel fra Win+R) og klikk på ikonet i systemkurven. Aktiver «Start med Windows» i innstillingene slik at den blir der etter hver pålogging. Å vise statusen krever ingen spesielle rettigheter. Windows ber om administratortillatelse bare for «Få tilbake stereo» og «Alltid stereo». Før du avinstallerer, deaktiver «Alltid stereo» slik at headsetmikrofonen virker igjen.
