ReleaseNotes: "BluetoothHandsFreeToggle'ın yeni adı StereoKeeper; komut bhft yerine stereokeeper oldu. Sürüm 3.0 konsolun yerine bir tepsi uygulaması getiriyor: durum paneli arama modunu ve kulaklık mikrofonunu tutan uygulamayı gösteriyor, stereoyu tek düğmeyle geri getiriyor. “Her zaman stereo” artık tek bir anahtar ve kapatmak Windows'u aynen eski haline döndürüyor. Ayrıca yeni: Windows bildirimleri, Windows ile başlatma, her şeyin nasıl geri alınacağını anlatan sade yardım, hata bildirimleri için tanılama bilgilerini kopyalayan bir düğme ve takılan kulaklık ses hizmetinin güvenli kurtarılması. Hizmet değişiklikleri, Windows'un izin istediği ayrı bir işlemde yapılır."
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: stereokeeper komutunu çalıştırın (örneğin Win+R ile) ve sistem tepsisindeki simgesine tıklayın. Her oturum açışta orada kalması için ayarlarında “Windows ile başlat” seçeneğini açın. Durumu göstermek için özel izin gerekmez; Windows yalnızca “Stereoyu geri getir” ve “Her zaman stereo” için yönetici izni ister. Kaldırmadan önce kulaklık mikrofonu yeniden çalışsın diye “Her zaman stereo” seçeneğini kapatın.
