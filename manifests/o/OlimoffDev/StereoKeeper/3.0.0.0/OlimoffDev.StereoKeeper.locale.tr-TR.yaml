ShortDescription: "Windows 10 ve 11'de Bluetooth kulaklığın kalitesiz, mono sesini düzelten tepsi uygulaması: kulaklığı arama moduna (HFP) geçiren uygulamayı gösterir ve stereoyu tek tıkla geri getirir."
Description: |-
  StereoKeeper (eski adıyla BluetoothHandsFreeToggle), Windows 10 ve Windows 11'de birden kalitesiz, mono ya da telefon görüşmesi gibi çalmaya başlayan Bluetooth kulaklıkları ve oyuncu kulaklıklarını düzeltir. Call of Duty gibi bir oyun, Discord, bir tarayıcı ya da kayıt yazılımı kulaklık mikrofonunu açtığında bu olur: Windows kulaklığı A2DP stereodan Hands-Free (HFP) arama profiline geçirir ve bazen geri döndürmez.
  Uygulama sistem tepsisinde yaşar. Simge, kulaklığın stereo mu yoksa arama modunda mı çaldığını bir bakışta gösterir; panel ise kulaklık mikrofonunu kullanan uygulamanın adını söyler. “Stereoyu geri getir”, Windows ayarlarını değiştirmeden kulaklık sesini bir kez yeniden başlatır; böylece kulaklık mikrofonu çalışmaya devam eder. “Her zaman stereo”, başka bir mikrofon kullandığınızda arama modunu kalıcı olarak engeller; kapattığınızda Windows aynen eski haline döner.
  Ücretsiz ve açık kaynak, 30 arayüz dili, isteğe bağlı bildirimler, Windows ile başlatma ve arka planda hizmet yok. Windows yalnızca uygulama bir şey değiştirdiğinde izin ister.
