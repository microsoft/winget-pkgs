ReleaseNotes: 'BluetoothHandsFreeToggle теперь называется StereoKeeper; запуск теперь через stereokeeper вместо bhft. Версия 3.0 заменяет консоль приложением в трее: панель показывает режим звонка и приложение, которое держит микрофон наушников, и возвращает стерео одной кнопкой. «Всегда стерео» теперь один переключатель, а его выключение возвращает Windows точно как было. Ещё новое: уведомления Windows, запуск вместе с Windows, понятная справка о том, как всё вернуть, кнопка, которая копирует сведения для сообщения об ошибке, и безопасное восстановление зависшей службы звука наушников. Изменения служб выполняются в отдельном процессе, на который Windows спрашивает разрешение.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Запустите stereokeeper (например, через Win+R) и нажмите на его значок в трее. Чтобы значок был там после каждого входа в Windows, включите в настройках «Запускать вместе с Windows». Чтобы показывать статус, особые права не нужны; Windows спрашивает разрешение администратора только для «Вернуть стерео» и «Всегда стерео». Перед удалением выключите «Всегда стерео», чтобы микрофон наушников снова заработал.
