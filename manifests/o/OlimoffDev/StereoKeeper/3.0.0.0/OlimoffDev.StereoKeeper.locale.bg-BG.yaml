ReleaseNotes: 'BluetoothHandsFreeToggle вече се казва StereoKeeper; стартира се със stereokeeper вместо bhft. Версия 3.0 заменя конзолата с приложение в системната област: панел показва режима на разговор и приложението, което държи микрофона на слушалките, и връща стерео с един бутон. „Винаги стерео“ вече е един превключвател, а изключването му връща Windows точно както беше. Нови са още: известия на Windows, стартиране с Windows, разбираема помощ как да върнете всичко, бутон, който копира данни за съобщения за грешки, и безопасно възстановяване на блокирала услуга за звук на слушалките. Промените в услугите се изпълняват в отделен процес, за който Windows иска разрешение.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Стартирайте stereokeeper (например с Win+R) и натиснете иконата му в системната област. Включете „Стартиране с Windows“ в настройките, за да остане там след всяко влизане. За показване на състоянието не са нужни специални права; Windows иска разрешение на администратор само за „Върни стерео“ и „Винаги стерео“. Преди деинсталиране изключете „Винаги стерео“, за да заработи отново микрофонът на слушалките.
