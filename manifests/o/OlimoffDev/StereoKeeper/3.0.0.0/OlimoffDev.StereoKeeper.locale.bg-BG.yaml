ShortDescription: 'Приложение в системната област, което оправя приглушения моно звук на Bluetooth слушалки в Windows 10 и 11: показва кое приложение е превключило слушалките в режим на разговор (HFP) и връща стерео с едно кликване.'
Description: |-
  StereoKeeper (преди BluetoothHandsFreeToggle) оправя Bluetooth слушалки и геймърски гарнитури, които в Windows 10 и Windows 11 изведнъж започват да звучат приглушено, моно или като телефонен разговор. Това се случва, когато игра като Call of Duty, Discord, браузър или програма за запис включи микрофона на слушалките: Windows ги превключва от стерео A2DP в режим на разговор Hands-Free (HFP) и понякога не ги връща обратно.
  Програмата живее в системната област. Иконата показва с един поглед дали слушалките възпроизвеждат стерео, или са в режим на разговор, а панелът назовава приложението, което използва микрофона на слушалките. „Върни стерео“ рестартира веднъж звука на слушалките, без да променя настройките на Windows, така че микрофонът им продължава да работи. „Винаги стерео“ блокира режима на разговор завинаги, ако ползвате друг микрофон, а изключването връща Windows точно както беше.
  Безплатно и с отворен код, 30 езика на интерфейса, известия по желание, стартиране с Windows и без фонови услуги. Windows иска разрешение само когато програмата променя нещо.
