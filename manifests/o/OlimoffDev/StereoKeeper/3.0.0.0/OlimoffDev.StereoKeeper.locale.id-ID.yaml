ReleaseNotes: 'BluetoothHandsFreeToggle kini bernama StereoKeeper; perintahnya stereokeeper, bukan bhft. Versi 3.0 mengganti konsol dengan aplikasi tray: panel status menunjukkan mode panggilan dan aplikasi yang memakai mikrofon headset, lalu mengembalikan stereo dengan satu tombol. “Selalu stereo” kini satu tombol geser, dan saat dimatikan Windows kembali persis seperti semula. Baru juga: notifikasi Windows, mulai bersama Windows, bantuan berbahasa sederhana tentang cara mengembalikan semuanya, tombol penyalin diagnostik untuk laporan bug, dan pemulihan aman layanan audio headset yang macet. Perubahan layanan berjalan di proses terpisah yang izinnya diminta Windows.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Jalankan stereokeeper (misalnya dari Win+R) dan klik ikonnya di system tray. Aktifkan “Mulai bersama Windows” di pengaturan agar tetap ada di sana setelah setiap masuk. Menampilkan status tidak memerlukan hak khusus; Windows meminta izin administrator hanya untuk “Kembalikan stereo” dan “Selalu stereo”. Sebelum mencopot, matikan “Selalu stereo” agar mikrofon headset berfungsi lagi.
