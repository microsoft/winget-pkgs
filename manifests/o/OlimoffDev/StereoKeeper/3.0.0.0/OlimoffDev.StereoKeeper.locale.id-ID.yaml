ShortDescription: 'Aplikasi tray yang memperbaiki suara headphone Bluetooth yang teredam dan mono di Windows 10 dan 11: menunjukkan aplikasi mana yang memindahkan headset ke mode panggilan (HFP) dan mengembalikan stereo dalam sekali klik.'
Description: |-
  StereoKeeper (sebelumnya BluetoothHandsFreeToggle) memperbaiki headphone Bluetooth dan headset gaming yang tiba-tiba terdengar teredam, mono, atau seperti telepon di Windows 10 dan Windows 11. Ini terjadi saat game seperti Call of Duty, Discord, browser, atau software perekam menyalakan mikrofon headset: Windows memindahkan headphone dari stereo A2DP ke profil panggilan Hands-Free (HFP) dan kadang tidak mengembalikannya.
  Aplikasi ini berada di system tray. Ikon tray langsung menunjukkan apakah headphone memutar stereo atau sedang dalam mode panggilan, dan panelnya menyebut aplikasi yang memakai mikrofon headset. “Kembalikan stereo” memulai ulang suara headphone satu kali tanpa mengubah pengaturan Windows, sehingga mikrofon headset tetap berfungsi. “Selalu stereo” memblokir mode panggilan secara permanen jika Anda memakai mikrofon lain, dan saat dimatikan Windows kembali persis seperti semula.
  Gratis dan open source, 30 bahasa antarmuka, notifikasi opsional, mulai bersama Windows, dan tanpa layanan latar belakang. Windows hanya meminta izin saat aplikasi mengubah sesuatu.
