ReleaseNotes: 'BluetoothHandsFreeToggle se nyní jmenuje StereoKeeper; příkaz je stereokeeper místo bhft. Verze 3.0 nahrazuje konzoli aplikací v oznamovací oblasti: panel stavu ukazuje režim hovoru a aplikaci, která drží mikrofon sluchátek, a jedním tlačítkem vrací stereo. „Vždy stereo“ je nově jediný přepínač a jeho vypnutí vrátí Windows přesně do původního stavu. Nově také: oznámení Windows, spouštění s Windows, srozumitelná nápověda, jak vše vrátit zpět, tlačítko, které zkopíruje diagnostiku pro hlášení chyb, a bezpečná obnova zaseknuté služby zvuku sluchátek. Změny služeb provádí samostatný proces, na který se Windows ptá na povolení.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Spusťte stereokeeper (například pomocí Win+R) a klikněte na jeho ikonu v oznamovací oblasti. V nastavení zapněte „Spouštět s Windows“, aby tam zůstal po každém přihlášení. Zobrazení stavu nevyžaduje žádná zvláštní oprávnění; Windows žádá o oprávnění správce jen pro „Vrátit stereo“ a „Vždy stereo“. Před odinstalací vypněte „Vždy stereo“, aby mikrofon sluchátek zase fungoval.
