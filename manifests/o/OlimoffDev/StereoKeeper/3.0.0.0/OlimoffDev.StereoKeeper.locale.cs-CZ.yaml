License: MIT
ShortDescription: 'Aplikace v oznamovací oblasti, která opravuje tlumený zvuk mono ve sluchátkách Bluetooth ve Windows 10 a 11: ukáže, která aplikace přepnula sluchátka do režimu hovoru (HFP), a jedním kliknutím vrátí stereo.'
Description: |-
  StereoKeeper (dříve BluetoothHandsFreeToggle) opravuje sluchátka Bluetooth a herní headsety, které ve Windows 10 a Windows 11 najednou znějí tlumeně, v mono nebo jako při telefonním hovoru. Stává se to, když hra jako Call of Duty, Discord, prohlížeč nebo nahrávací program zapne mikrofon sluchátek: Windows je přepne ze sterea A2DP do režimu hovoru Hands-Free (HFP) a někdy je nevrátí zpět.
  Aplikace běží v oznamovací oblasti. Ikona na první pohled ukáže, zda sluchátka hrají ve stereu, nebo jsou v režimu hovoru, a panel pojmenuje aplikaci, která používá mikrofon sluchátek. „Vrátit stereo“ jednorázově restartuje zvuk sluchátek bez změny nastavení Windows, takže mikrofon sluchátek dál funguje. „Vždy stereo“ trvale zablokuje režim hovoru, pokud používáte jiný mikrofon, a po vypnutí se Windows vrátí přesně do původního stavu.
  Zdarma a open source, 30 jazyků rozhraní, volitelná oznámení, spouštění s Windows a žádná služba na pozadí. Windows žádá o povolení, jen když aplikace něco mění.
