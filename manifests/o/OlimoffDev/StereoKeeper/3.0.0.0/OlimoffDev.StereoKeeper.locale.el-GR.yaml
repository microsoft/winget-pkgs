ReleaseNotes: 'Το BluetoothHandsFreeToggle ονομάζεται πλέον StereoKeeper· η εντολή είναι stereokeeper αντί για bhft. Η έκδοση 3.0 αντικαθιστά την κονσόλα με εφαρμογή στην περιοχή ειδοποιήσεων: ένας πίνακας κατάστασης δείχνει τη λειτουργία κλήσης και την εφαρμογή που κρατά το μικρόφωνο των ακουστικών και επαναφέρει το στέρεο με ένα κουμπί. Το «Πάντα στέρεο» είναι πλέον ένας διακόπτης και η απενεργοποίησή του επαναφέρει τα Windows ακριβώς όπως ήταν. Νέα επίσης: ειδοποιήσεις των Windows, εκκίνηση με τα Windows, βοήθεια σε απλή γλώσσα για το πώς αναιρούνται όλα, κουμπί που αντιγράφει διαγνωστικά για αναφορές σφαλμάτων και ασφαλής αποκατάσταση κολλημένης υπηρεσίας ήχου ακουστικών. Οι αλλαγές στις υπηρεσίες γίνονται σε ξεχωριστή διεργασία για την οποία τα Windows ζητούν άδεια.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Εκτελέστε το stereokeeper (για παράδειγμα από το Win+R) και πατήστε το εικονίδιό του στην περιοχή ειδοποιήσεων. Ενεργοποιήστε το «Εκκίνηση με τα Windows» στις ρυθμίσεις ώστε να παραμένει εκεί μετά από κάθε σύνδεση. Η εμφάνιση της κατάστασης δεν χρειάζεται ειδικά δικαιώματα· τα Windows ζητούν άδεια διαχειριστή μόνο για το «Επαναφορά στέρεο» και το «Πάντα στέρεο». Πριν από την απεγκατάσταση, απενεργοποιήστε το «Πάντα στέρεο» ώστε το μικρόφωνο των ακουστικών να λειτουργεί ξανά.
