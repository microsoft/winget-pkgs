ShortDescription: 'Εφαρμογή περιοχής ειδοποιήσεων που διορθώνει τον υπόκωφο, μονοφωνικό ήχο των ακουστικών Bluetooth στα Windows 10 και 11: δείχνει ποια εφαρμογή έβαλε τα ακουστικά σε λειτουργία κλήσης (HFP) και επαναφέρει το στέρεο με ένα κλικ.'
Description: |-
  Το StereoKeeper (παλαιότερα BluetoothHandsFreeToggle) διορθώνει ακουστικά Bluetooth και gaming headsets που ξαφνικά ακούγονται υπόκωφα, μονοφωνικά ή σαν τηλεφωνική κλήση στα Windows 10 και Windows 11. Συμβαίνει όταν ένα παιχνίδι όπως το Call of Duty, το Discord, ένα πρόγραμμα περιήγησης ή ένα πρόγραμμα εγγραφής ενεργοποιεί το μικρόφωνο των ακουστικών: τα Windows περνούν τα ακουστικά από το στέρεο A2DP στο προφίλ κλήσης Hands-Free (HFP) και κάποιες φορές δεν γυρίζουν πίσω.
  Η εφαρμογή ζει στην περιοχή ειδοποιήσεων. Το εικονίδιο δείχνει με μια ματιά αν τα ακουστικά παίζουν στέρεο ή είναι σε λειτουργία κλήσης και ο πίνακας λέει ποια εφαρμογή χρησιμοποιεί το μικρόφωνο των ακουστικών. Το «Επαναφορά στέρεο» επανεκκινεί μία φορά τον ήχο των ακουστικών χωρίς να αλλάξει τις ρυθμίσεις των Windows, ώστε το μικρόφωνο να συνεχίσει να λειτουργεί. Το «Πάντα στέρεο» αποκλείει για πάντα τη λειτουργία κλήσης όταν χρησιμοποιείτε άλλο μικρόφωνο και, όταν το απενεργοποιήσετε, τα Windows επανέρχονται ακριβώς όπως ήταν.
  Δωρεάν και ανοιχτού κώδικα, 30 γλώσσες διεπαφής, προαιρετικές ειδοποιήσεις, εκκίνηση με τα Windows και καμία υπηρεσία στο παρασκήνιο. Τα Windows ζητούν άδεια μόνο όταν η εφαρμογή αλλάζει κάτι.
