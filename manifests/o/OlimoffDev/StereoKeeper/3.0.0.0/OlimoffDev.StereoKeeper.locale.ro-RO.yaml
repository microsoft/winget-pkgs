License: MIT
ShortDescription: 'Aplicație din bara de sistem care repară sunetul mono și înfundat al căștilor Bluetooth în Windows 10 și 11: arată ce aplicație a trecut căștile în modul apel (HFP) și readuce stereo cu un singur clic.'
Description: |-
  StereoKeeper (fost BluetoothHandsFreeToggle) repară căștile Bluetooth și căștile de gaming care încep brusc să sune înfundat, mono sau ca un apel telefonic în Windows 10 și Windows 11. Se întâmplă când un joc precum Call of Duty, Discord, un browser sau un program de înregistrare activează microfonul căștilor: Windows trece căștile de la stereo A2DP la profilul de apel Hands-Free (HFP) și uneori nu mai revine.
  Aplicația stă în bara de sistem. Pictograma arată dintr-o privire dacă căștile redau în stereo sau sunt în modul apel, iar panoul numește aplicația care folosește microfonul căștilor. „Readu stereo” reinițializează o dată sunetul căștilor fără să schimbe setările Windows, așa că microfonul căștilor continuă să funcționeze. „Mereu stereo” blochează definitiv modul apel dacă folosești alt microfon, iar dezactivarea lui readuce Windows exact la starea de dinainte.
  Gratuită și open source, 30 de limbi de interfață, notificări opționale, lansare odată cu Windows și niciun serviciu în fundal. Windows cere permisiunea doar când aplicația schimbă ceva.
