ReleaseNotes: 'BluetoothHandsFreeToggle se numește acum StereoKeeper; comanda este stereokeeper în loc de bhft. Versiunea 3.0 înlocuiește consola cu o aplicație în bara de sistem: un panou de stare arată modul apel și aplicația care ține microfonul căștilor și readuce stereo dintr-un singur buton. „Mereu stereo” este acum un singur comutator, iar dezactivarea lui readuce Windows exact la starea de dinainte. Noutăți: notificări Windows, lansare odată cu Windows, ajutor în limbaj simplu despre anularea tuturor modificărilor, un buton care copiază informațiile de diagnosticare pentru rapoartele de eroare și recuperarea în siguranță a serviciului audio blocat al căștilor. Modificările serviciilor rulează într-un proces separat, pentru care Windows cere permisiunea.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: Lansează stereokeeper (de exemplu din Win+R) și apasă pe pictograma lui din bara de sistem. Activează în setări lansarea odată cu Windows ca să rămână acolo după fiecare conectare. Afișarea stării nu necesită drepturi speciale; Windows cere permisiunea de administrator doar pentru „Readu stereo” și „Mereu stereo”. Înainte de dezinstalare, dezactivează „Mereu stereo” ca microfonul căștilor să funcționeze din nou.
