ReleaseNotes: 'BluetoothHandsFreeToggle은 StereoKeeper로 이름이 바뀌었습니다. 명령어는 bhft 대신 stereokeeper입니다. 버전 3.0은 콘솔을 트레이 앱으로 바꿨습니다. 상태 패널이 통화 모드와 헤드셋 마이크를 쓰는 앱을 보여 주고, 버튼 하나로 스테레오를 되찾아 줍니다. ‘항상 스테레오’는 스위치 하나가 되었고, 끄면 Windows가 원래 상태 그대로 돌아갑니다. 그 밖의 새 기능: Windows 알림, Windows 시작 시 실행, 모든 것을 되돌리는 방법을 쉽게 설명한 도움말, 오류 보고용 정보를 복사하는 버튼, 멈춘 헤드셋 오디오 서비스의 안전한 복구. 서비스 변경은 별도 프로세스에서 실행되며 Windows가 허용을 요청합니다.'
ReleaseNotesUrl: https://github.com/Avazbek22/StereoKeeper/releases/tag/v3.0
InstallationNotes: 'stereokeeper(예: Win+R)를 실행하고 시스템 트레이의 아이콘을 클릭하세요. 로그인할 때마다 트레이에 표시되도록 설정에서 ‘Windows 시작 시 실행’을 켜세요. 상태를 보여 주는 데는 특별한 권한이 필요 없습니다. Windows가 관리자 권한을 요청하는 것은 ‘스테레오 복구’와 ‘항상 스테레오’를 쓸 때뿐입니다. 제거하기 전에 ‘항상 스테레오’를 꺼서 헤드셋 마이크가 다시 작동하게 하세요.'
