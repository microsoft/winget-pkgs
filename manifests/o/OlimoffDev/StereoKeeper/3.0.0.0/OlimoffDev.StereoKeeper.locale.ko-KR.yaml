ShortDescription: Windows 10/11에서 Bluetooth 헤드폰 소리가 먹먹한 모노로 바뀌는 문제를 고치는 트레이 앱. 어떤 앱이 헤드셋을 통화 모드(HFP)로 바꿨는지 보여 주고, 한 번의 클릭으로 스테레오를 되찾아 줍니다.
Description: |-
  StereoKeeper(이전 BluetoothHandsFreeToggle)는 Windows 10과 Windows 11에서 Bluetooth 헤드폰이나 게이밍 헤드셋 소리가 갑자기 먹먹해지거나, 모노가 되거나, 전화 통화처럼 들리는 문제를 고칩니다. Call of Duty 같은 게임, Discord, 브라우저, 녹음 프로그램이 헤드셋 마이크를 켜면 Windows가 헤드폰을 A2DP 스테레오에서 핸즈프리(HFP) 통화 프로필로 바꾸고, 가끔은 다시 돌려놓지 않기 때문입니다.
  앱은 시스템 트레이에 있습니다. 트레이 아이콘을 보면 헤드폰이 스테레오인지 통화 모드인지 한눈에 알 수 있고, 패널에는 헤드셋 마이크를 쓰는 앱의 이름이 표시됩니다. ‘스테레오 복구’는 Windows 설정을 바꾸지 않고 헤드폰 소리를 한 번만 다시 시작하므로 헤드셋 마이크는 계속 작동합니다. ‘항상 스테레오’는 다른 마이크를 쓰는 분을 위해 통화 모드를 계속 차단하고, 끄면 Windows가 원래 상태 그대로 돌아갑니다.
  무료 오픈 소스이며 30개 언어를 지원합니다. 알림은 선택 사항이고, Windows 시작 시 실행할 수 있으며, 백그라운드 서비스는 없습니다. Windows는 앱이 무언가를 바꿀 때만 허용을 요청합니다.
