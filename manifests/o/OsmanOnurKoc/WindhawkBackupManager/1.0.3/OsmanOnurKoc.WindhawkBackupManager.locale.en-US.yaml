ShortDescription: Backup, review and restore Windhawk mods, engine binaries and registry settings
Description: |-
  Windhawk Backup Manager is a lightweight WPF utility for backing up and restoring a Windhawk setup.
  It captures the installed mods, the compiled engine binaries and the related registry configuration into a single backup, lets you review what a backup contains before restoring it, and presents all of this through a native Windows 11 Fluent Design interface.
