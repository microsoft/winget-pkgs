ShortDescription: Opticon OPN-2001 及兼容 OPN 系列条码扫描器的 PC 伴侣应用程序
Description: 从以 OPN-2001 模式或 OPN-2001 模拟应用程序运行的 Opticon 条码扫描器（包括 OPN-2001、OPN-2006、OPN-2500、OPN-6000 和 PX-20）中下载扫描的条码数据。支持 CMA/CMT 底座（多底座）以及将多台扫描器直接连接到 PC，提供手动和自动操作模式。功能包括查看和更新设备固件、读取和同步设备时钟、查看设备序列号、下载、格式化及删除扫描的条码、将设备恢复出厂设置，以及调整操作设置（如码制、蜂鸣器、内存处理和 LED 设置等）。
