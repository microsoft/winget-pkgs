ShortDescription: Companion application for downloading barcode data from Opticon OPN-2001 series scanners
Description: Retrieves scanned barcode data from Opticon barcode scanners running OPN-2001 mode or the OPN-2001 simulation application, including the OPN-2001, OPN-2006, OPN-2500, OPN-6000, and PX-20. Supports CMA/CMT docking stations (multicradles) and connecting multiple scanners to a PC directly, with manual and automatic operation modes. Features include viewing and updating device firmware, reading and synchronizing the device clock, viewing the device serial number, downloading, formatting, and deleting scanned barcodes, resetting devices to factory defaults, and adjusting operational settings such as symbologies, beeper, memory handling, and LED settings.
