# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
PackageIdentifier: Omnissiah.Omnissiah
PackageVersion: 0.1.36
PackageLocale: ru-RU
Publisher: Omnissiah
PublisherUrl: https://omnissiah.by/
PublisherSupportUrl: https://omnissiah.by/support
PrivacyUrl: https://omnissiah.by/privacy
PackageName: Omnissiah
PackageUrl: https://omnissiah.by/
License: Proprietary
ShortDescription: Помощник для подготовки и разбора технических интервью.
Description: |-
  Тестовый desktop-клиент Omnissiah для Windows x64 с русским интерфейсом.
  Поддерживает раздельную запись микрофона и системного звука, снимки экрана
  по команде, расшифровку, AI-чат и локальную историю интервью.
  Приложение загружается бесплатно. Запись и AI требуют аккаунта,
  действующего доступа и согласия на обработку данных. Платный доступ к AI
  оформляется отдельно на сайте через Lava.top; публичные покупки пока закрыты.
  Условия пробного и ранее выданного доступа доступны в личном кабинете.
  Архив не подписан. Встроенного автоматического обновления, ARM-сборки,
  базы знаний, профилей интервью и настройки собственных AI-провайдеров нет.
Documentations:
  - DocumentLabel: Условия доступа и подписки
    DocumentUrl: https://omnissiah.by/terms
  - DocumentLabel: Установка и ограничения тестовой версии
    DocumentUrl: https://omnissiah.by/support#install-desktop
ReleaseNotesUrl: https://github.com/matus-co/omnissiah-releases/releases/tag/v0.1.36
InstallationNotes: Интерфейс на русском языке. Для записи и AI необходим действующий доступ к сервису Omnissiah; условия и наличие доступа проверяйте в личном кабинете.
