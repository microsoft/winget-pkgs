ReleaseNotes: |-
  RustGIS v0.5.0 deepens the everyday workflow. One expression language now drives queries, Calculate Field and symbols, and QGIS-style symbols and labels reach much further. New overlay and summary tools fill out Analysis, GeoPackage and PostGIS edits save back to their source, web services gain time, legends, identify and ArcGIS sign-in, and large files open a chunk at a time. Windows on ARM64 joins the native builds.
  Highlights
  - Expressions: one expression language, with functions, CASE and map scale variables, for queries, Calculate Field and attribute rules. Set a symbol's size, colours, outline width and angle per feature by expression. See Expressions.
  - Richer symbols and labels: hatch, marker, gradient and shapeburst polygon fills, markers and hash marks along lines, font markers, and stacked, shifted and turned point marks. Labels gain halos with their own colour and width, offsets, backgrounds, letter spacing, wrapping, repeats along lines and other places to try round a point. New class methods and the full matplotlib colour map library. See Cartography.
  - More analysis tools: Intersect, Identity, Union, Symmetrical Difference, Update and Split overlays, Near, Merge, Join Field, Pivot Table, Kernel Density and Feature Vertices To Points. Spatial Join joins by centre, largest overlap, closest and distance with merge rules, Summary Statistics takes several statistics and case fields, buffers and measurements use the WGS 84 ellipsoid, and Project Raster puts a raster on a chosen grid. See Analysis.
  - Edit and work safely: save edits back to GeoPackage and PostGIS tables, with conflicts refused. The desktop app autosaves and offers unsaved work back after a crash, and asks before unsaved changes are lost. Projects survive a move with portable data paths and Repair Data Source, and a session log records every command run. Customize keyboard shortcuts and carry them between computers.
  - Web services and time: WMS and WMTS layers follow the time slider, answer Identify, show their legends and draw in other coordinate systems. Sign in to ArcGIS Online and Enterprise with OAuth, ask feature services for an area only, and open data cubes from a new Data Cubes pane. See Web Data.
  - Bigger data, faster: open large Shapefiles, GeoPackage, FlatGeobuf and GeoParquet layers in place a chunk at a time, and export them the same way. Export vector and raster layers to PMTiles. Indexed Clip and Select by Location and thinned display geometry speed up large layers, and a tilted or turned map moves more smoothly.
  - Everywhere you work: native Windows on ARM64 builds, a native macOS menu bar, web app and command line images on ghcr.io, a static web app archive to host yourself, rustgis.qt.MapWidget for Qt applications, saved secrets from the CLI and Python, GeoLibre projects opened as maps, and Polish as an interface language.
  Download
  Get the app for your platform at https://downloads.rustgis.app (or below), and see https://rustgis.app/installation/ for which file to pick.
