ReleaseNotes: |-
  RustGIS v0.4.0 tilts the map into 3D, adds several new data sources and gives cartography and analysis more depth. Turn and tilt the map, drape it over terrain and stand extrusions up on the GPU, or switch to the Moon and Mars. Read Esri File Geodatabases without GDAL, query MySQL, MariaDB and SQL Server tables live, and browse a large catalog of public web data. New tools include vertex editing, spatial join, zonal statistics, kriging and data-cube trends, and new cartography includes label classes, curved line labels, publication layouts and SVG export.
  Highlights
  - A map you can turn and tilt: rotate the map to a bearing and tilt it to a pitch, drape it over terrain, stand extrusions and point markers up on the GPU, and turn the globe the same way. Map frames in layouts turn and tilt too. Switch between the Earth, the Moon, Mars and other celestial bodies, each with its own basemaps. See Maps.
  - More data, from more places: Esri File Geodatabases without GDAL, live MySQL, MariaDB, SQL Server and Azure SQL tables, QGIS projects opened as maps with their layer styles, and scans without coordinates for georeferencing. You can now write cloud-optimised GeoTIFFs. Reusable connections remember their passwords and keys in the OS keychain, and a Web Data pane lists public catalogs such as NASA Earthdata, FEMA, The National Map, NASA GIBS, Natural Earth, Hugging Face and satellite embeddings. See Data.
  - Time and data cubes: a time slider for layers, dated imagery, Zarr variables and STAC bands. Chart a point's time series, summarise a cube by year or month, and map trends cell by cell with Sen's slope and the Mann-Kendall test.
  - Editing and analysis: move, insert and delete vertices on the map with snapping. Analysis adds spatial join, zonal statistics, IDW and ordinary kriging, geodesic buffers, A5 equal-area grids, Calculate Geometry in metric or imperial units, and polygon, lasso and radius selection on the map. Plan routes and follow them turn by turn. ModelBuilder is rebuilt as a node canvas, the Script pane completes commands, parameters, layers and fields as you type, and a geoprocessing run can be copied as Python. See Analysis.
  - Cartography and labels: a Labeling pane with label classes chosen by SQL queries, labels that follow lines straight or curved, and installed font families. New classification methods (geometric interval, standard deviation, manual breaks), stacked and dashed line strokes drawn in symbol levels, reference scales, layer groups, blend modes, scientific colour ramps and raster colour bars. See Cartography.
  - Layouts: build a publication sheet or figure, with its locator and surrounds, in one command. Edit elements in a Format pane, and add shapes, arrows, rulers, guides, snapping and element locking. Style grids, north arrows and scale bars, and export the layout to SVG. See Layouts.
  - AI agents and plugins: the AI Assistant gains skills and subagents, and can drive agents on your computer through ACP. External agents connect over MCP on HTTP or a file bridge, with an audit log, their own undo and a snapshot of the map as you see it. Plugins can add panels of widgets and read small documents from the web. Persian and Bengali join the interface languages, for 18 in all.
  Download
  Get the app for your platform at https://downloads.rustgis.app (or below), and see https://rustgis.app/installation/ for which file to pick.
