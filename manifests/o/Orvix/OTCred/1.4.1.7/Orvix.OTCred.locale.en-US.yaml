ReleaseNotesUrl: https://cred.orvixtech.com/download
InstallationNotes: |-
  OT Cred is installed, but this computer is not linked yet. If Setup reported that a restart is needed, restart Windows first.
  1. Open Start > OT Cred > OT Cred Device Manager.
  2. Click Show Owner QR, scan it with OT Auth on the owner's phone and approve.
  3. In the client portal (https://cred.orvixtech.com/signin), assign this computer's Windows accounts to people.
