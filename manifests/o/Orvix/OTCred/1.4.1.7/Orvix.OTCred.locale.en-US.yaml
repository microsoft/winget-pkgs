ShortDescription: QR code sign-in for Windows. Approve Windows sign-in, unlock, Remote Desktop and UAC prompts on your phone with the OT Authenticator app.
Description: |-
  OT Cred is a Windows credential provider that adds a QR sign-in tile to the Windows sign-in, lock, Remote Desktop and administrator (UAC) screens. Scan the QR code with the OT Authenticator app (OT Auth) on your phone, approve, and you are signed in. Your normal PIN and password keep working.
  The computer's owner links it once by scanning the Owner QR in OT Cred Device Manager, then chooses in the OT Cred client portal who may sign in to which Windows account.
  Requires 64-bit Windows 10 (1809 or later), Windows 11 or Windows Server 2019, 2022 or 2025, internet access to the OT Cred service during setup, and the OT Authenticator app for Android or iPhone. Free during early access.
