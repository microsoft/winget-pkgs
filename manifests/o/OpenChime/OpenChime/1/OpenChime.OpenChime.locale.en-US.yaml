ShortDescription: Desktop client for a self-hostable business chat system.
Description: |-
  The Windows client for OpenChime, a self-hostable business chat system. It
  connects to an OpenChime daemon that you or your organisation runs; there is
  no OpenChime-operated service in the message path.

  The installer places both front-ends: a native Windows GUI, and a terminal
  client (openchime-tui) that can optionally be added to PATH.
