ShortDescription: Press a shortcut, talk, and the text is pasted where you were typing. Speech recognition runs on your own GPU; audio is never uploaded.
Description: |-
  Your ideas arrive faster than your fingers. AlphaDictate closes the gap.

  Press a key (or a spare mouse button), talk, press it again, and your words are pasted right where your cursor was: an email, a chat, a document, a code editor, a ChatGPT box. No window to switch to, no copy and paste, and no holding a key down like a walkie-talkie.

  Everything happens on your own PC. Speech recognition runs on your graphics card, so your voice and your transcripts never leave the machine, and it keeps working on a plane. No account, no telemetry, nobody's server listening in.

  It speaks 12 languages (English, German, Spanish, French, Italian, Dutch, Polish, Portuguese, Finnish, Norwegian, Swedish and Ukrainian), works out which one you're using on its own, and can translate into English as you go. It pauses your music while you talk, keeps your last 200 dictations on your own disk, and transcribes audio and video files too.

  Requirements: Windows 10 (version 1809 or later) or Windows 11, 64-bit; a microphone; and an NVIDIA, AMD or Intel graphics card with a Vulkan driver (many integrated GPUs qualify). There is no CPU-only mode. On first use the app downloads one speech model (0.2-1.1 GB); after that, dictation works offline.

  The first 60 minutes are on us. After that it's $39 a year, $5 a month or $79 once for up to 3 PCs, with a 14-day refund if it isn't for you.
