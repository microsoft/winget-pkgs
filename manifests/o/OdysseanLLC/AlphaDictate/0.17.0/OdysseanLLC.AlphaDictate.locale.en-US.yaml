ReleaseNotes: |-
  Voice commands. Say "alpha" followed by line, paragraph, bullet, number, send or cancel. Ordinary speech never triggers one.
  Change your mind while it transcribes. The pill keeps its discard, paste and send buttons, with your current choice highlighted.
  Choose your sound output from the tray. A new menu switches the Windows default speakers or headphones.
  A pill that answers at once, an honest progress bar, and a clear message instead of a Windows error on a PC with no Vulkan support.
  A one-time $79 license is now offered in the app.
