ReleaseNotes: "We are pleased to announce the Avogadro 2.1, with new features, performance improvements, and piles of bug fixes. A particular effort was made to improve testing and code quality.\n\nThanks to everyone who made suggestions, bug reports, translations, and discussions. Avogadro is built from the community, and we appreciate all the help.\n\nAvogadro v2 was designed as a platform to make it easy to build the next generation of molecular and materials visualization, including fast modern rendering and improved stability. With this release, we mark 30 plugins and will offer tutorials on making your tools easily available as plugins.\n\n## 🌟 Highlights (tldr)\n• **New Z-matrix editor**：view and edit internal coordinates, including constraints, dummy atoms for linear molecules, and drag-and-drop to reorder atoms. Input generators can now write Z-matrix coordinates.\n• **Faster, smoother geometry optimization** using the ABC-FIRE method and a hybrid mode that is now the default for Optimize and AutoOpt.\n• **Much faster orbitals and surfaces**：Gaussian basis set calculations are up to 20-25× faster, large ORCA files load much faster too.\n• **Improved conformer and dynamics plot** including geometry parameters, velocities, temperature, etc.\n• **Batch energies and forces**：recalculate energies and forces for every conformer or frame at once, in batches suited to ML potentials.\n• **New building tools**\n\t- An initial polymer builder - feedback welcome\n\t- D-amino acids in the peptide builder.\n\t- Edit distances, angles, and dihedrals directly in the Measure tool.\n\t- PDB biological assemblies (tested to ~1 million atoms).\n\t- Fractional supercells.\n\t- Better support for CIF files, including space group perception from transforms.\n• **New camera controls**：virtual trackball rotation for all tools, keyboard shortcuts for rotating, and click-and-drag to focus on an atom.\n• **Custom properties**：atom, bond, residue, and conformer properties are kept and can be viewed and edited in the property tables.\n• **Better vibrations**：each step of an optimization or scan can now have its own vibrations, displaced geometries can be generated, and ORCA symmetry labels are read.\n• **Scripting and automation**\n\t- Many tools can now be controlled through a JSON-RPC interface, including selection, measurement, force fields, constraints, symmetry, spectra, colors, and hydrogens.\n\t- The `avogadro.connect` Python module can now list the available commands, making it easy to drive Avogadro from Jupyter, scripts, or AI agents.\n\t- A new `avogadro-mcp` project for connecting local LLM models and agents to Avogadro.\n• **Transparent compression support** read and write compressed files directly (e.g., `.gz`, `.xz` and `.zstd`).\n• **Plugin improvements**：progress bars and a cancel button for plugin scripts, plus authors, download counts, and bug tracker links in the plugin window. Installs are more reliable.\n• **More stable**：continuous fuzz testing on Linux and Windows found and fixed a large number of bugs and potential crashes in file readers and editing.\n\n## ✨ Features\n• Refactor PLY export with scene tesselation @ghutchis (#3107)\n• Add content patterns for file format detection @ghutchis (#3093)\n• Initial support for z-matrix coordinates in input generators @ghutchis (#3015)\n• Set the default filename in input generators @ghutchis (#3013)\n• Add authors, download count and bug tracker link to plugin window @ghutchis (#3012)\n• Add constraints to the z-matrix editor @ghutchis (#3010)\n• Add support for time, velocities and temperature to the conformer chart @ghutchis (#3006)\n• Add shared camera controls for all tools / modes @ghutchis (#2972)\n• Add support for fractional ranges for supercells @ghutchis (#2955)\n• Extend PlotConformer scan coordinate support @ghutchis (#2998)\n• Add support for transparent compression IO @ghutchis (#2994)\n• Allow drag-and-drop to reorder atoms in the property table @ghutchis (#2993)\n• Add a z matrix editor window @ghutchis (#2990)\n• Rework the internal \\<=> Cartesian conversions @ghutchis (#2988)\n• Add support in RWMolecule for swapAtoms @ghutchis (#2989)\n• Ensure player, plotconformer and properties agree on active conformer @ghutchis (#2986)\n• Insert the modelView and camera projection matrix into CJSON @ghutchis (#2977)\n• Camera Controls with Virtual Trackball @vaclavhanzl (#2962)\n• Reworking vibrations to allow per-conformer (step) Hessians @ghutchis (#2956)\n• Add progress reporting (and cancel) for plugin scripts @ghutchis (#2939)\n• Add internal support for SMILES @ghutchis (#2919)\n• Add batch calculations for energies and forces @ghutchis (#2867)\n• Allow display and editing of atom, bond, residue, conformer properties @ghutchis (#2864)\n• When \"center\" is selected, insert with geometry @ghutchis (#2865)\n• Add an initial polymer builder @ghutchis (#2789)\n• Switch GUI actions and AutoOpt to hybrid optimization \\& adaptive chunk size @ghutchis (#2858)\n• Add optimizer state, including E \\& grad, plus hybrid mode @ghutchis (#2857)\n• Store custom atom, bond, residue, and conformer properties @ghutchis (#2774)\n• Enable \"D\" stereo by inverting all dihedral angles for side-chains @ghutchis (#2837)\n• Add key shortcuts for rotations (shift for x/y, control for z) @ghutchis (#2827)\n• Add initial support for reading PDB assembly e.g. 9MB0 @ghutchis (#2799)\n\n## 👁 Accessibility Improvements\n• Fix text rendering resolution @ghutchis (#3087)\n• Pick label contrast color by WCAG luminance @ghutchis (#3185)\n• Accessibility keyboard fixes @ghutchis (#3183)\n\n## 🚀 Performance Improvements\n• Improve AO rendering efficiency @ghutchis (#3009)\n• Improve speed of numeric parsing using the fast_float library for text to number conversion\n• Fix fairly slow parsing of ORCA files with lots of orbitals @ghutchis (#2907)\n• Switch GUI actions and AutoOpt to hybrid optimization \\& adaptive chunk size @ghutchis (#2858)\n• Add optimizer state, including E \\& grad, plus hybrid mode @ghutchis (#2857)\n• Update L-BFGS and Implement FIRE and ABC-FIRE2 optimizer @ghutchis (#2855)\n• Improve Gaussian basis performance (25x faster!) @ghutchis (#2726)\n\n## 🐛 Bug Fixes\n• Let Ctrl/Meta-click pan in the Draw and Template tools @ghutchis (#3192)\n• Orbitals：respect resolution quality selection from orbital window @Tyagiquamar (#3111)\n• Fix GAMESS-US fuzz test failure @ghutchis (#3182)\n• Fix drag-to-existing atom bond editor action @ghutchis (#3180)\n• Reject Gaussian basis sets with inconsistent shell data @ghutchis (#3179)\n• Check that AppImage programs run without LD\\_LIBRARY\\_PATH @ghutchis (#3175)\n• Fix cif primitive and expansion @ghutchis (#3174)\n• Register obmm force fields only when obmm is available @ghutchis (#3170)\n• Stop re-prompting for plugin installs that failed @ghutchis (#3146)\n• Fix gromacs residue atoms @ghutchis (#3136)\n• Fix DCD header decoding @ghutchis (#3132)\n• Make the unit cell render default to enabled @ghutchis (#3131)\n• Vibration IR and Raman intensities now use 2-decimal format @ghutchis (#3129)\n• Disconnect only the GLWidget's own molecule connections @ghutchis (#3128)\n• Skip unsupported h/i shells when computing cutoffs @ghutchis (#3127)\n• Deduce space group Hall numbers from the CIF operation loop @ghutchis (#3126)\n• Enforce a minimum distance for edits @ghutchis (#3119)\n• Keep unique ids when undoing a molecule replacement @ghutchis (#3120)\n• Add tests for scene plugin settings @ghutchis (#3117)\n• Fix non-rectangular cube files with rescaling @ghutchis (#3116)\n• Fix selection and color changes @ghutchis (#3106)\n• Fix a potential thread race in EDT surfaces @ghutchis (#3098)\n• Fix plugin launch fallbacks @ghutchis (#3095)\n• Fix script commands replacing molecules @ghutchis (#3094)\n• Fix label offset with orthographic projection @ghutchis (#3089)\n• Clear AlignTool's molecule on setMolecule(nullptr) @ghutchis (#3088)\n• Fix select command errors @ghutchis (#3086)\n• Fix bonding and wrapAtoms undo behavior @ghutchis (#3085)\n• Fix locale number parsing @ghutchis (#3084)\n• Add qtplugins tests via RPC commands @ghutchis (#3081)\n• Fix format bugs @ghutchis (#3080)\n• Fix neighborperceiver outliers @ghutchis (#3078)\n• Fix rwmolecule bugs from fuzz testing @ghutchis (#3075)\n• Fix a bug with readProperties not freeing an existing basis @ghutchis (#3068)\n• Use core getline @ghutchis (#3066)\n• Share toLower and startsWith through Core utilities @ghutchis (#3067)\n• Fix unclamped acos in angle measurements @ghutchis (#3060)\n• Fix force field gradient convergence test @ghutchis (#3062)\n• Fix template tool rotation for antiparallel vectors @ghutchis (#3061)\n• Fix molecule (and Array) move-from code @ghutchis (#3048)\n• Fix potential crash on malformed scene-plugin layer settings @ghutchis (#3047)\n• Replace invalid UTF-8 when writing CJSON instead of failing @ghutchis (#3044)\n• Add more calc unit tests and fuzz test @ghutchis (#3040)\n• Add more qtgui tests and layer fuzz test @ghutchis (#3039)\n• Add new core tests including layer (and fuzz\\_core\\_layer test) @ghutchis (#3037)\n• Rather than create duplicate constraints, edit the existing one @ghutchis (#3034)\n• Fix fuzz format crashes @ghutchis (#3032)\n• Fix fuzz failure in RWMolecule::addBond @ghutchis (#3027)\n• Fix possible layer crashes @ghutchis (#3021)\n• Fix a fuzz bug in XYZ reading via perceive bond orders @ghutchis (#3017)\n• Add a try / catch guard for file IO in production builds @ghutchis (#3016)\n• Fix a crash with the measure tool when deleting atoms @ghutchis (#3011)\n• Add a button to insert dummy atoms for linear molecules @ghutchis (#3007)\n• Add a checkbox for adjusting bond lengths during edit @ghutchis (#3008)\n• Added tests to check basis set normalization and orthogonality @ghutchis (#3000)\n• Read Molden Occup as a double and lround into the electron count @shaneraphel (#3025)\n• Add a blur step to the ambient occlusion @ghutchis (#2995)\n•  Fix bug with underf"
