ShortDescription: A lightweight BitTorrent client for Windows.
Description: |-
  Equinox is a BitTorrent client for Windows with a Go-based engine, a built-in web interface, and a desktop window with a tray icon.
  It supports magnet links and torrent files, file selection and priorities, sequential downloads, queues, speed and seeding limits, labels, and automatic updates.
  The interface is available in English and Russian.
