ShortDescription: An open-source AI terminal that reads your screen, with SSH, SFTP and local LLMs built in.
Description: |-
  wowTerminal is a desktop terminal with an AI assistant that reads the current tab (system info and the last 100 lines of output) and suggests commands as cards you send to the terminal yourself.
  It works with any OpenAI-compatible model, including local ones served by Ollama or vLLM. It also manages SSH hosts, has a two-pane SFTP file panel, and keeps shell and SSH sessions alive across app restarts on macOS and Linux.
