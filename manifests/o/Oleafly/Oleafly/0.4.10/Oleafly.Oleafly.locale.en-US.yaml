ReleaseNotes: Adds an Intel Mac build carrying the same Tectonic, Biber, Pandoc, Typst and Tinymist toolchain as the Apple Silicon build, plus downloads for other Typst versions, TexLab, Quarto and Calepin on Intel Macs. Quarto article, Quarto slides and Calepin report templates gain previews in the template gallery. Common custom AI providers, Brave Search, Tavily and Mathpix now show their own logos in Settings, and Settings gains a Stay in Visual mode switch for the editor.
