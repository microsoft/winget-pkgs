ShortDescription: 支持实时协作与 AI 智能体的 LaTeX、Typst 编辑器。
Description: Oleafly 是一款面向科研写作的 LaTeX、Typst 与 Markdown 开源编辑器。它内置 Tectonic、Biber、Pandoc、Typst 与 Tinymist 工具链，无需另外安装 TeX 发行版即可编译文档，并提供实时协作、SyncTeX、模板库与 AI 智能体能力。Windows 安装包会同时安装编辑器与其自带编译器。
