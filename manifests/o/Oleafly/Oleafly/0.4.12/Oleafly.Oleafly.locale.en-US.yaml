ShortDescription: LaTeX and Typst editor with live collaboration and AI agents.
Description: Oleafly is an open-source editor for LaTeX, Typst and Markdown aimed at research writing. It bundles the Tectonic, Biber, Pandoc, Typst and Tinymist toolchain, so documents compile without a separate TeX distribution, and offers live collaboration, SyncTeX, a template gallery and AI agent support. The Windows package installs the editor together with its bundled compilers.
