ShortDescription: Check live cloud and SaaS status from your terminal or CI.
Description: |-
  OutageDeck checks the live status of 170+ cloud and SaaS providers using
  normalized official vendor status feeds. It supports concurrent provider
  checks, provider search, JSON output, and configurable exit thresholds for
  scripts and CI systems. Public status checks require no account or API key.
Moniker: outagedeck
Tags:
- cli
- cloud
- devops
- incident-response
- monitoring
- outage
- sre
- status
ReleaseNotes: |-
  First public release of the OutageDeck CLI.
  - Check up to 20 cloud and SaaS providers concurrently.
  - Search the live provider catalog.
  - Emit JSON for scripts and CI systems.
  - Fail at configurable degraded, outage, or major-outage thresholds.
ReleaseNotesUrl: https://github.com/outagedeck/cli/releases/tag/v0.1.0
