PackageIdentifier: OSTUM.Desktop
PackageVersion: 5.7.0
PackageLocale: en-US
Publisher: OSTUM
PackageName: Ostum Desktop
PackageUrl: https://ranis2023.github.io/ostum-desktop/en/
License: MIT
ShortDescription: Local Windows AI assistant with a Russian-language chat interface, image analysis, documents and audio transcription.
Description: >-
  OSTUM Desktop runs the Qwen3.5-9B-based Zarum model locally through llama.cpp.
  Basic chat requires no account. A first full installation on a new PC downloads six
  model files totaling 13.38 GB. An offline kit can be prepared for isolated PCs.
  The model weights and third-party components have their own licenses.
