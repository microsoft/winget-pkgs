Description: >-
  OSTUM Desktop запускает Zarum 9B на базе Qwen3.5-9B с помощью llama.cpp.
  Базовый чат работает без аккаунта. При первой полной установке на новом ПК установщик
  загружает шесть файлов моделей общим объёмом 13,38 ГБ. Для изолированных ПК можно заранее
  подготовить автономный комплект. Веса моделей и сторонние компоненты распространяются
  на условиях их собственных лицензий.
