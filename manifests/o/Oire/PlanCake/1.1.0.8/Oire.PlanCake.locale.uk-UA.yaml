ShortDescription: Зручно читайте файли Markdown і залишайте нотатки саме там, де їм і місце
Description: Доступна програма для читання файлів Markdown у Windows, створена для довгих планів реалізації, які пишуть ШІ-асистенти для програмування. Вона показує файл Markdown як документ і записує ваші нотатки просто у файл, одразу після блоку, якого вони стосуються. Однаково добре працює мишею, лише з клавіатури та з програмою читання з екрана, а також із командного рядка.
