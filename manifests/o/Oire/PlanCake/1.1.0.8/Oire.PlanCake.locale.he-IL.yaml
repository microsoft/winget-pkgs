Description: קורא Markdown נגיש עבור Windows, שנבנה עבור תוכניות היישום הארוכות שכותבים עוזרי תכנות מבוססי בינה מלאכותית. הוא מציג קובץ Markdown כמסמך וכותב את ההערות שלכם ישירות לתוך הקובץ, מיד אחרי הבלוק שאליו הן מתייחסות. עובד באותה מידה טובה עם העכבר, מהמקלדת בלבד ועם קורא מסך, וגם משורת הפקודה.
