ShortDescription: Local dictation for Windows 11 — hold a hotkey, speak, release. Audio is transcribed offline with NVIDIA Parakeet TDT v3 and polished by a small local LLM. No cloud, no telemetry, no account.
Description: |
  Winpepper is a Windows-native local dictation tool. Hold Right Ctrl + Right Shift, speak, release — the audio is transcribed with NVIDIA Parakeet TDT v3 (0.6B), lightly polished by a small local LLM, and typed into whatever window has focus.

  Everything runs on your machine. No cloud, no telemetry, no account. First run downloads approximately 1.2 GB of models (~5 minutes on typical broadband).

  Status: 0.6.2-alpha, agent-built and human-untested. All core functionality is code-complete. The MSI installs cleanly and boots through the full pipeline. Real-world usage with a microphone and interactive desktop session remains unverified.
