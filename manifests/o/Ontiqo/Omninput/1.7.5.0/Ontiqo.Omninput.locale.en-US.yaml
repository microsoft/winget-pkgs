ShortDescription: One keyboard, mouse and monitor for every computer on your desk.
Description: |-
  Omninput switches your monitor to the computer you want over DDC/CI and brings the keyboard and mouse with it, or moves the pointer across the edges of side-by-side screens. It also shares the clipboard (including files) and sound, keeps folders in sync and sets up SSH between your Windows, Mac and Linux computers. Every feature is free for 14 days; then a one-time Home or Site licence.
