ShortDescription: Compares two songs by harmony, melody, rhythm, sound and shared audio, and shows where they match.
Description: |-
  Sonalize measures two recordings on this PC: the chords and key, the lead melody, the tempo and drum pattern, the
  sound of the mix, and any audio the two share, such as a sample. It gives one score, a summary written from the
  measurements, and the passages where the songs come closest, to play side by side. A catalogue check lists
  released songs that sound like yours, to listen to and compare. A score measures similarity; it is not a finding
  of copyright infringement.
