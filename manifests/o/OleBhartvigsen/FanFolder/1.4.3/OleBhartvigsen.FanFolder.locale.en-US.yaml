ReleaseNotes: |-
  What's new in 1.4.3:
  - Fixed the taskbar icon showing a colored background plate. The icon is now transparent with no blue card behind it.
  - Added altform-unplated assets and built resources.pri so the taskbar renders the icon without plating it with the Windows accent color.
  - Scaled the icon to fill the entire tile edge-to-edge and centered it, so it no longer looks smaller than neighboring taskbar icons.
