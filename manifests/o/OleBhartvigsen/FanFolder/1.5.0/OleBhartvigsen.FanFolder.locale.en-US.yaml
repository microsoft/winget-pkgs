ReleaseNotes: |-
  What's new in 1.5.0:
  - Filter as you type: open the fan and type. Matching runs across every file in the folder, and in its subfolders when that option is on, from a name index built at startup.
  - The search field has a fixed width, the menu font, a blinking caret after the query and a match counter at the right edge.
  - New option "Include files in subfolders" lists files below the selected folder; depth 8, capped at 20,000 files. "Include folders" is greyed out while it is on.
  - The index is patched from folder-change notifications, saved to %LOCALAPPDATA% and reused on the next start.
  - A spinning ring on the taskbar button and the tray icon shows when menu content is being scanned.
  - New first-launch info panel, and "Show info on launch" in the menu.
  - Security hardening, fan labels without the subfolder path, fewer redundant rescans, and the app version in the settings menu.
