ReleaseNotes: |-
  Release Notes for v44.11.6
  Fixes
  - Fixed a renderer crash when using webFrame.setSpellCheckProvider in editors that change the selection or contents from script. #56030 ^{(Also in 45, 46)}
  - Fixed crashes when using AudioParam automation with setValueCurveAtTime(), including a renderer crash when calling cancelAndHoldAtTime(). #55920
  - Fixed dialog.showMessageBox() omitting response with an aborted signal. #55968 ^{(Also in 45, 46)}
  - Fixed prefers-contrast media query ignoring the system's contrast setting. #55987 ^{(Also in 45, 46)}
  - Fixed webContents.centerSelection() so that it works on Windows and Linux. #55950 ^{(Also in 45, 46)}
