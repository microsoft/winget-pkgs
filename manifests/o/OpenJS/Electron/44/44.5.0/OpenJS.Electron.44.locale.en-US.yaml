ReleaseNotes: |-
  Release Notes for v44.5.0
  Features
  - Added launch-failure reporting with systemErrorCode to the app child-process-gone event. #54231 ^{(Also in 45)}
  Fixes
  - Changed the default trash implementation on KDE Plasma 6 to kioclient. #54361 ^{(Also in 45)}
  - DevTools zoom in/out now uses the same zoom steps as Chromium. #54387 ^{(Also in 45)}
  - Fixed --xdg-portal-required-version having no effect and a spurious portal warning being logged for file dialogs on Linux. #54303 ^{(Also in 43, 45)}
  - Fixed a child WebContentsView losing focus when its window is reactivated. #54455 ^{(Also in 43, 45)}
  - Fixed a crash when a WebAuthn request used a security key that required its PIN. #54403 ^{(Also in 45)}
  - Fixed a crash when creating a framed window on Wayland in environments where GTK could not initialize. #54420 ^{(Also in 45)}
  - Fixed a crash when sending a DevTools protocol command with a non-string value for an optional string parameter via webContents.debugger. #54445 ^{(Also in 43, 45)}
  - Fixed a GPU process crash on startup when another instance of the app is using the same session data directory. #54469
  - Fixed a grey border around frameless windows on Linux WMs without compositing. #54391 ^{(Also in 43, 45)}
  - Fixed a main process crash when a native API method was called with a this value of a different native type; it now throws a TypeError. #54315 ^{(Also in 43)}
  - Fixed a possible crash during process exit when vm.Script or vm contexts created in the main process had been garbage collected shortly before quitting. #54266 ^{(Also in 43, 45)}
  - Fixed a possible crash on Windows on ARM when powerMonitor is torn down. #54408 ^{(Also in 45)}
  - Fixed a renderer crash calling image.toPNG() from a sandboxed preload script. #54502 ^{(Also in 43, 45)}
  - Fixed a renderer crash when a ResizeObserver loop-limit error handler modified layout. #54290 ^{(Also in 45)}
  - Fixed accent-color-changed on Windows reporting a colour that differed from systemPreferences.getAccentColor(). #54409 ^{(Also in 45)}
  - Fixed an issue where crashReporter.setUploadToServer() had no effect after crashReporter.start() was called. #54518 ^{(Also in 45)}
  - Fixed app.getRecentDocuments() omitting documents with non-ASCII paths on Windows. #54407 ^{(Also in 45)}
  - Fixed clipboard.read(), readText() and has() resolving seconds late on Linux while the app was idle. #54308 ^{(Also in 42, 43, 45)}
  - Fixed desktopCapturer.getSources() leaving non-resizable windows resizable on macOS. #54397 ^{(Also in 43, 45)}
  - Fixed fs.rmSync failing to remove read-only files on Windows. #54255 ^{(Also in 42, 43, 45)}
  - Fixed GDK_BACKEND leaking into processes spawned by Electron apps on Linux. #54425 ^{(Also in 43, 45)}
  - Fixed hidden windows continuing to render at full frame rate after setBackgroundThrottling(false) followed by setBackgroundThrottling(true). #54341 ^{(Also in 45)}
  - Fixed pointerLock permission requests from some iframes reporting the parent frame. #54464 ^{(Also in 42, 43, 45)}
  - Fixed setContentProtection(true) having no effect in Windows remote sessions. #54500 ^{(Also in 45)}
  - Fixed setIgnoreMouseEvents() taking effect late on X11. #54497 ^{(Also in 43, 45)}
  - Fixed setIgnoreMouseEvents(true) being undone by the next resize on X11. #54393 ^{(Also in 43, 45)}
    - Added setIgnoreMouseEvents support on Wayland.
  - Fixed shell.showItemInFolder() on Linux for paths containing #, ? or % when the file manager is reached over D-Bus. #54406 ^{(Also in 45)}
  - Fixed the default action label on Linux notifications not being localized. #54401 ^{(Also in 43, 45)}
  - Fixed the GPU process crash-looping on Windows when the sandbox cannot read the install folder; the folder is now reported instead. #54484 ^{(Also in 43, 45)}
  - Fixed the zoom level resetting on file: and other host-less pages after a location.hash change. #54442 ^{(Also in 43, 45)}
  - Fixed typing not working after closing an alert() or confirm() on Windows. #54461 ^{(Also in 43, 45)}
  - Fixed utilityProcess dropping stdout/stderr output that the child wrote immediately before exiting. #54278 ^{(Also in 42, 43, 45)}
  - Fixed visual zoom limits resetting on navigation and not applying to webviews. #54449 ^{(Also in 43, 45)}
  - Fixed WebAssembly modules loaded from the code cache crashing or throwing RuntimeError: unreachable after updating between certain patch releases. #54246 ^{(Also in 42, 43, 45)}
  - Fixed win.setEnabled(false) and modal child windows not blocking input on Wayland. #54447 ^{(Also in 43, 45)}
  - Fixed zoom in/out getting stuck after zooming past the 25%-500% range. #54421 ^{(Also in 43, 45)}
    - Fixed setVisualZoomLevelLimits() shrinking pages when the minimum is under 1.
  Performance Improvements
  - Improved the performance of APIs that return rectangles, sizes, points and display objects. #54215 ^{(Also in 45)}
  - Improved the performance of session.getUserAgent(). #54244 ^{(Also in 45)}
  Documentation
  - Documentation changes: #54342
