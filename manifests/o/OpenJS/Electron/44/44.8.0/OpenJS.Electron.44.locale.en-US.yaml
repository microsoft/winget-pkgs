ReleaseNotes: |-
  Release Notes for v44.8.0
  Features
  - Added support for Notification action buttons on Linux. #54890 ^{(Also in 45)}
  Fixes
  - Fixed mouse cursor missing over native dialogs in certain scenarios on Windows. #54987
  - Fixed net.fetch and session.fetch failing permanently with net::ERR_FAILED after the Network Service process restarts. #54909 ^{(Also in 42, 43, 45)}
  - Fixed utilityProcess dropping messages posted with process.parentPort.postMessage() right before the process exits. #54960 ^{(Also in 42, 43, 45)}
  - Fixed win.isFullScreen() being stale in fullscreen events on Windows. #55009 ^{(Also in 45)}
  Other Changes
  - Backported fixes from upstream Chromium and V8. #55034
  - Updated Chromium to 152.0.7977.167. #54928
  - Updated Node.js to v24.22.0. #55004
