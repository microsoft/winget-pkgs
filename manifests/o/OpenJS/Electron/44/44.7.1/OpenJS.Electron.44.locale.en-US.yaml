ReleaseNotes: |-
  Release Notes for v44.7.1
  Fixes
  - Fixed a crash when starting without an available display server on Linux. #54794 ^{(Also in 45)}
  - Fixed a Linux crash creating a window with a menu bar when GTK failed to load. #54859 ^{(Also in 45)}
  - Fixed a WebContentsView that was removed with removeChildView() and re-added with addChildView() staying hidden behind its sibling views on Linux. #54798
  - Fixed asar archives in non-ASCII folders failing to load on Linux. #54849 ^{(Also in 45)}
  - Fixed renderer crashes during garbage collection inside ShadowRealms. #54865 ^{(Also in 45)}
  Other Changes
  - Refactored mouse forwarding on Windows to fix setIgnoreMouseEvents(true, { forward: true }) related issues. #54802 ^{(Also in 45)}
  - Updated Chromium to 152.0.7977.149. #54085
