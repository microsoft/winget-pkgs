ReleaseNotes: |-
  Release Notes for v44.6.0
  Features
  - Added the experimental protocol.registerSource() to serve a custom scheme from directories on disk without a JavaScript handler. #54522 ^{(Also in 45)}
  Fixes
  - Fixed a crash on launch on macOS when the system refused to register the app for sleep/wake notifications. #54596
  - Fixed a crash on navigator.usb.requestDevice() in in-memory sessions. #54616 ^{(Also in 45)}
  - Fixed webview.findInPage() hanging when the host page also has an iframe. #54586 ^{(Also in 43, 45)}
  - Updated time zone data to tzdata 2026d, including British Columbia's move to permanent UTC-7. #54623
  Documentation
  - Documentation changes: #54589
