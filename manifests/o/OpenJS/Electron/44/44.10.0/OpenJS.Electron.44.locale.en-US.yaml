ReleaseNotes: |-
  Release Notes for v44.10.0
  Features
  - Added filtering options to session.registerPreloadScript - matches, excludeMatches, includeGlobs, excludeGlobs, matchOriginAsFallback. #55182 ^{(Also in 45)}
  Fixes
  - Fixed a crash on Linux when a D-Bus method call was made on a disconnected bus. #55290 ^{(Also in 45, 46)}
  - Fixed a main process crash when onSendHeaders observed Blob uploads. #55168 ^{(Also in 45)}
  - Fixed app.getLoginItemSettings() not finding login items on Windows when the executable path contains spaces. #55207 ^{(Also in 45)}
  - Fixed Europe/London and Europe/Dublin time zone names showing as "GMT+00:00" in winter by updating ICU to tzdata 2026e. #55335
  - Fixed File System Access blocklist gaps for .git/hooks writes and hypervisor UNC shares. #55330
  - Fixed handling of malformed asar archives whose size fields do not match the file length. #55176 ^{(Also in 43, 45)}
  - Fixed inconsistent handling of asar archive paths between the main process and child processes. #55183 ^{(Also in 43, 45)}
  - Fixed Menu.popup() on macOS sometimes not showing a menu after another closed. #55325 ^{(Also in 45, 46)}
  - Fixed MV3 extension events not arriving to background service workers. #55152 ^{(Also in 43, 45)}
  - Fixed paste hanging indefinitely on Linux X11 until the app was restarted. #55327
  - Fixed protocol.registerSource schemes not applying the same fetch rules as protocol.handle schemes. #55177 ^{(Also in 45)}
  - Fixed utilityProcess not emitting an exit event when the app quit while the process was still launching. #55273 ^{(Also in 43, 45, 46)}
  Other Changes
  - Updated Chromium to 152.0.7977.169. #55033
  - Updated Node.js to v24.22.1. #55162
