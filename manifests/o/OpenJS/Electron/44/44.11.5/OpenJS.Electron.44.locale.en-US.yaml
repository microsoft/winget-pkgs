ReleaseNotes: |-
  Release Notes for v44.11.5
  Fixes
  - Fixed <select> dropdowns not rendering in offscreen windows on macOS. #55827 ^{(Also in 45)}
  - Fixed a bug where content-protected windows could temporarily appear in screen captures during picture-in-picture state changes. #55830 ^{(Also in 45)}
  - Fixed a dangling pointer after picking a webkitdirectory folder. #55926 ^{(Also in 45, 46)}
  - Fixed a possible hang when pressing Esc while a <webview> is fullscreen. #55828 ^{(Also in 45)}
  - Fixed a window's draggable regions applying under child WebContentsViews. #55819 ^{(Also in 45)}
  - Fixed macOS default menu item icons and titles being lost on menu refresh. #55876 ^{(Also in 45, 46)}
  - Fixed non-network Web Worker requests (such as file:// and custom schemes) bypassing protocol.handle() and webRequest handlers. #55825 ^{(Also in 45)}
  - Fixed proxy switches replacing ses.setProxy() after a network service restart. #55811 ^{(Also in 45, 46)}
  - Fixed removeInsertedCSS() not removing cssOrigin: 'user' stylesheets. #55833 ^{(Also in 45, 46)}
  - Fixed request header removals in webRequest.onBeforeSendHeaders redirects. #55923 ^{(Also in 45, 46)}
  - Fixed Windows tray icons that lost their tooltip when explorer restarted. #55831 ^{(Also in 45)}
  Other Changes
  - Backported fixes from upstream ANGLE, Chromium, Dawn, FFmpeg, PDFium, Skia, V8 and WebRTC. #55895
