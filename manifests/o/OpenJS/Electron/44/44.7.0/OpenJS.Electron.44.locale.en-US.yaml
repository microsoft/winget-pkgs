ReleaseNotes: |-
  Release Notes for v44.7.0
  Features
  - The macOS autoUpdater now streams update downloads to disk, resumes an interrupted download on the next check instead of starting over, and applies a binary delta when the update feed offers one for the running version. #54204
  Fixes
  - Fixed an uncatchable TypeError in net.fetch when receiving response headers with non-ASCII characters, and preserved multiple Set-Cookie headers. #54672
  Other Changes
  - Backported fixes from upstream ANGLE, Chromium, Dawn, fontconfig, Skia, V8 and WebRTC. #54666
  - Backported fixes from upstream ANGLE, Chromium, Skia, V8 and WebRTC. #54657
