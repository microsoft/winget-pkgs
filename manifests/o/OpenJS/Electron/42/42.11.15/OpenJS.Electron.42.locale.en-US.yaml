ReleaseNotes: |-
  # Release Notes for v42.11.15

  ## Fixes

  • Fixed a crash on Linux at startup or on theme change with GTK modules loaded. [#55015](https://github.com/electron/electron/pull/55015)
  • Fixed an issue where clicks posted to a background app were dropped on macOS. [#54906](https://github.com/electron/electron/pull/54906) <sup>(Also in [43](https://github.com/electron/electron/pull/54905), [44](https://github.com/electron/electron/pull/54819), [45](https://github.com/electron/electron/pull/54818))</sup>
  • Fixed `net.fetch` and `session.fetch` failing permanently with `net::ERR_FAILED` after the Network Service process restarts. [#54925](https://github.com/electron/electron/pull/54925) <sup>(Also in [43](https://github.com/electron/electron/pull/54908), [44](https://github.com/electron/electron/pull/54909), [45](https://github.com/electron/electron/pull/54910))</sup>
  • Fixed `utilityProcess` dropping messages posted with `process.parentPort.postMessage()` right before the process exits. [#55000](https://github.com/electron/electron/pull/55000) <sup>(Also in [43](https://github.com/electron/electron/pull/54962), [45](https://github.com/electron/electron/pull/54956))</sup>

  ## Other Changes

  • Backported fixes from upstream Chromium and V8. [#55035](https://github.com/electron/electron/pull/55035)
