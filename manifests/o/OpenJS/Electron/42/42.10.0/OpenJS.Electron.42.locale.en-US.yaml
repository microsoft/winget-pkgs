ReleaseNotes: "# Release Notes for v42.10.0\n\n## Features\n\n• Fixed contentTracing module to capture Node.js trace categories. [#52973](https://github.com/electron/electron/pull/52973) \n## Fixes\n\n• Fixed DevTools device metrics overrides persisting indefinitely when a remote debugging client disconnected without clearing them. [#53133](https://github.com/electron/electron/pull/53133) <sup>(Also in [43](https://github.com/electron/electron/pull/52946), [44](https://github.com/electron/electron/pull/52930))</sup>\n• Fixed DevTools popup and context menus not appearing when DevTools is hosted in a custom window via `webContents.setDevToolsWebContents()`. [#52981](https://github.com/electron/electron/pull/52981) <sup>(Also in [43](https://github.com/electron/electron/pull/52937), [44](https://github.com/electron/electron/pull/52434))</sup>\n• Fixed `BrowserWindow.unmaximize()` and `restore()` having no effect on Wayland when the window was maximized immediately after creation. [#53126](https://github.com/electron/electron/pull/53126) <sup>(Also in [44](https://github.com/electron/electron/pull/53124))</sup>\n• Fixed `Uncaught illegal access` errors and possible renderer crashes after closing a same-process child window or removing an iframe with `nodeIntegrationInSubFrames` enabled. [#53042](https://github.com/electron/electron/pull/53042) <sup>(Also in [44](https://github.com/electron/electron/pull/53040))</sup>\n• Fixed `dialog.showOpenDialog`/`dialog.showSaveDialog` opening at an unusable location on Linux when `defaultPath` is a bare filename without a directory. [#52980](https://github.com/electron/electron/pull/52980) <sup>(Also in [43](https://github.com/electron/electron/pull/52401), [44](https://github.com/electron/electron/pull/52402))</sup>\n• Fixed a crash on Linux when the D-Bus session bus disconnected while the app was running, such as at logout or when dbus is restarted. [#53094](https://github.com/electron/electron/pull/53094) <sup>(Also in [43](https://github.com/electron/electron/pull/53095), [44](https://github.com/electron/electron/pull/53096))</sup>\n• Fixed a crash on Windows when V8 posted a delayed worker task during shutdown. [#53014](https://github.com/electron/electron/pull/53014) <sup>(Also in [43](https://github.com/electron/electron/pull/53013))</sup>\n• Fixed a crash with `app.setLoginItemSettings` if a non-UTF8 service name is used. [#52989](https://github.com/electron/electron/pull/52989) <sup>(Also in [43](https://github.com/electron/electron/pull/52944), [44](https://github.com/electron/electron/pull/52801))</sup>\n• Fixed a possible crash (SIGABRT) during process exit when the process had loaded `tls`/`https` shortly before exiting, affecting `app.exit()` before `ready` and short-lived `ELECTRON_RUN_AS_NODE` / `child_process.fork()` scripts. [#52992](https://github.com/electron/electron/pull/52992) <sup>(Also in [43](https://github.com/electron/electron/pull/52870), [44](https://github.com/electron/electron/pull/52871))</sup>\n• Fixed a possible main process crash at quit when a session was created from JavaScript that runs during shutdown. [#53132](https://github.com/electron/electron/pull/53132) <sup>(Also in [43](https://github.com/electron/electron/pull/52925), [44](https://github.com/electron/electron/pull/52924))</sup>\n• Fixed a rare crash in the main process when DevTools were opened and a garbage collection ran before the DevTools frontend finished loading. [#52994](https://github.com/electron/electron/pull/52994) <sup>(Also in [43](https://github.com/electron/electron/pull/52903), [44](https://github.com/electron/electron/pull/52904))</sup>\n• Fixed a renderer crash when a page calls `SpeechRecognition.available()` or `SpeechRecognition.install()` with `processLocally`. [#53016](https://github.com/electron/electron/pull/53016) <sup>(Also in [43](https://github.com/electron/electron/pull/53015), [44](https://github.com/electron/electron/pull/53021))</sup>\n• Fixed an issue on Linux where the system theme color appeared at the top edge of frameless windows. [#52978](https://github.com/electron/electron/pull/52978) <sup>(Also in [41](https://github.com/electron/electron/pull/53006), [43](https://github.com/electron/electron/pull/52179))</sup>\n• Fixed an issue where some values passed into `requestSingleInstanceLock` could result in a crash. [#52982](https://github.com/electron/electron/pull/52982) <sup>(Also in [43](https://github.com/electron/electron/pull/52471), [44](https://github.com/electron/electron/pull/52470))</sup>\n• Fixed crash in sharedTexture module when GPU context becomes unavailable. [#52983](https://github.com/electron/electron/pull/52983) <sup>(Also in [43](https://github.com/electron/electron/pull/52938), [44](https://github.com/electron/electron/pull/52926))</sup>\n• Fixed document title updates when using back/forward navigation using the same document without utilizing `browserWindow.setTitle()`. [#53099](https://github.com/electron/electron/pull/53099) <sup>(Also in [43](https://github.com/electron/electron/pull/53023), [44](https://github.com/electron/electron/pull/52968))</sup>\n• Fixed the built-in PDF viewer not rendering documents in in-memory sessions (partitions without the `persist:` prefix). [#52990](https://github.com/electron/electron/pull/52990) <sup>(Also in [43](https://github.com/electron/electron/pull/52835), [44](https://github.com/electron/electron/pull/52834))</sup>\n• Fixed titleBarOverlay.color set to `rgba(0,0,0,0)` failing back to default frame color. [#52976](https://github.com/electron/electron/pull/52976) <sup>(Also in [41](https://github.com/electron/electron/pull/53004), [43](https://github.com/electron/electron/pull/52010))</sup>\n• Fixed utility process crashes at exit on Windows 11 24H2 and later. [#53091](https://github.com/electron/electron/pull/53091) <sup>(Also in [43](https://github.com/electron/electron/pull/53092), [44](https://github.com/electron/electron/pull/53093))</sup>\n## Other Changes\n\n• Backported fixes from upstream Chromium and V8. [#53060](https://github.com/electron/electron/pull/53060) \n• Fixed a 1-in-200 chance per renderer process on Windows of scripts on the first page load being compiled without their V8 code cache. [#52988](https://github.com/electron/electron/pull/52988) <sup>(Also in [43](https://github.com/electron/electron/pull/52943), [44](https://github.com/electron/electron/pull/52792))</sup>\n• Fixed a Windows x64 renderer performance regression introduced in 42.8.1 that made style/layout work (and app startup) noticeably slower. [#53064](https://github.com/electron/electron/pull/53064) \n• Fixed a stall of tens of milliseconds while creating the first `BrowserWindow` on Linux.\n  • Improved the performance of file lookups inside ASAR archives and of large files served from them to the renderer.\n  • Improved the performance of calls through `contextBridge`-exposed APIs.\n  • Reduced the main-thread cost of sending large values through `ipcRenderer`, `ipcMain` handlers and `webContents.send`. [#53019](https://github.com/electron/electron/pull/53019) <sup>(Also in [43](https://github.com/electron/electron/pull/53018), [44](https://github.com/electron/electron/pull/53017))</sup>\n• Improved startup time of `utilityProcess.fork()`, `child_process.fork()` / `ELECTRON_RUN_AS_NODE` child processes and Node.js-enabled renderers. [#53136](https://github.com/electron/electron/pull/53136) <sup>(Also in [43](https://github.com/electron/electron/pull/53135), [44](https://github.com/electron/electron/pull/53134))</sup>\n• Linux arm64, Windows arm64 and macOS x64 builds now start the main process from the embedded Node.js startup snapshot like the other platforms, improving startup time. [#52880](https://github.com/electron/electron/pull/52880) <sup>(Also in [43](https://github.com/electron/electron/pull/52881), [44](https://github.com/electron/electron/pull/52879))</sup>"
