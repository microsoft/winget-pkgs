ReleaseNotes: |-
  Release Notes for v42.11.9
  Fixes
  - Fixed clipboard.read(), readText() and has() resolving seconds late on Linux while the app was idle. #54310 ^{(Also in 43, 44, 45)}
  - Fixed fs.rmSync failing to remove read-only files on Windows. #54257 ^{(Also in 43, 44, 45)}
  - Fixed pointerLock permission requests from some iframes reporting the parent frame. #54466 ^{(Also in 43, 44, 45)}
  - Fixed utilityProcess dropping stdout/stderr output that the child wrote immediately before exiting. #54332 ^{(Also in 43, 44, 45)}
  - Fixed WebAssembly exception handlers failing to catch, or crashing during tier-up, in modules using wasm exceptions. #54236
  - Fixed WebAssembly modules loaded from the code cache crashing or throwing RuntimeError: unreachable after updating between certain patch releases. #54239 ^{(Also in 43, 44, 45)}
