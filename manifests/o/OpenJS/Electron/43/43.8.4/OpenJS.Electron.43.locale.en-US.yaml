ReleaseNotes: |-
  Release Notes for v43.8.4
  Fixes
  - Backported fix for a macOS File System Access blocklist bypass via /System/Volumes/Data paths. #54677
  - Fixed Europe/London and Europe/Dublin time zone names showing as "GMT+00:00" in winter by updating ICU to tzdata 2026e. #55336
  - Fixed File System Access blocklist gaps for .git/hooks writes and hypervisor UNC shares. #55331
  - Fixed handling of malformed asar archives whose size fields do not match the file length. #55179 ^{(Also in 44, 45)}
  - Fixed inconsistent handling of asar archive paths between the main process and child processes. #55185 ^{(Also in 44, 45)}
  - Fixed MV3 extension events not arriving to background service workers. #55153 ^{(Also in 44, 45)}
  - Fixed utilityProcess not emitting an exit event when the app quit while the process was still launching. #55272 ^{(Also in 44, 45, 46)}
  Other Changes
  - Updated Node.js to v24.22.1. #55161
