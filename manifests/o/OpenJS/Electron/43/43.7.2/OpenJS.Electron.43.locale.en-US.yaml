ReleaseNotes: |-
  # Release Notes for v43.7.2

  ## Fixes

  • Fixed a potential UAF when a `select-usb-device` handler destroys the requesting `webContents`. [#54007](https://github.com/electron/electron/pull/54007) <sup>(Also in [44](https://github.com/electron/electron/pull/54009), [45](https://github.com/electron/electron/pull/54008))</sup>
  • Fixed default protocol client APIs falsely returning `true` on Windows. [#53960](https://github.com/electron/electron/pull/53960) <sup>(Also in [44](https://github.com/electron/electron/pull/53959), [45](https://github.com/electron/electron/pull/53958))</sup>

  ## Other Changes

  • Backported fix from upstream V8. [#53988](https://github.com/electron/electron/pull/53988)
  • Backported fixes from upstream ANGLE, Chromium, Skia and V8. [#53984](https://github.com/electron/electron/pull/53984)
