ReleaseNotes: |-
  Release Notes for v43.8.0
  Fixes
  - Fixed a crash on Linux at startup or on theme change with GTK modules loaded. #55016
  - Fixed a crash when creating a framed window on Wayland in environments where GTK could not initialize. #54893 ^{(Also in 44, 45)}
  - Fixed a Linux crash creating a window with a menu bar when GTK failed to load. #54884 ^{(Also in 44, 45)}
  - Fixed an issue where clicks posted to a background app were dropped on macOS. #54905 ^{(Also in 42, 44, 45)}
  - Fixed net.fetch and session.fetch failing permanently with net::ERR_FAILED after the Network Service process restarts. #54908 ^{(Also in 42, 44, 45)}
  - Fixed utilityProcess dropping messages posted with process.parentPort.postMessage() right before the process exits. #54962 ^{(Also in 42, 45)}
  Other Changes
  - Backported fixes from upstream Chromium and V8. #55032
  - Updated Node.js to v24.22.0. #55003
