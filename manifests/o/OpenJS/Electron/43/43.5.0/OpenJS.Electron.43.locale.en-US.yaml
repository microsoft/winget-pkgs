ReleaseNotes: "# Release Notes for v43.5.0\n\n## Fixes\n\n• Fixed DevTools device metrics overrides persisting indefinitely when a remote debugging client disconnected without clearing them. [#52946](https://github.com/electron/electron/pull/52946) <sup>(Also in [42](https://github.com/electron/electron/pull/53133), [44](https://github.com/electron/electron/pull/52930))</sup>\n• Fixed `BrowserWindow.unmaximize()` and `restore()` having no effect on Wayland when the window was maximized immediately after creation. [#53125](https://github.com/electron/electron/pull/53125) <sup>(Also in [42](https://github.com/electron/electron/pull/53126), [44](https://github.com/electron/electron/pull/53124))</sup>\n• Fixed `Uncaught illegal access` errors and possible renderer crashes after closing a same-process child window or removing an iframe with `nodeIntegrationInSubFrames` enabled. [#53041](https://github.com/electron/electron/pull/53041) <sup>(Also in [42](https://github.com/electron/electron/pull/53042), [44](https://github.com/electron/electron/pull/53040))</sup>\n• Fixed `fs.constants.O_DIRECTORY`, `O_NOFOLLOW` and `O_DIRECT` holding x86 values on Linux arm64 and armv7l, which made opening a directory fail with `EINVAL`, and made `require('trace_events')` behave the same on cross-compiled builds as on native ones. [#53319](https://github.com/electron/electron/pull/53319) <sup>(Also in [42](https://github.com/electron/electron/pull/53318), [44](https://github.com/electron/electron/pull/53320), [45](https://github.com/electron/electron/pull/53321))</sup>\n• Fixed `webContents.executeJavaScriptInIsolatedWorld` resolving with `undefined` when `worldId` was not an integer. [#53237](https://github.com/electron/electron/pull/53237) <sup>(Also in [44](https://github.com/electron/electron/pull/53238))</sup>\n• Fixed `webContents.print()` honoring `printBackground`, `duplexMode`, and printer default duplex settings. [#53160](https://github.com/electron/electron/pull/53160) <sup>(Also in [42](https://github.com/electron/electron/pull/53158), [44](https://github.com/electron/electron/pull/53159))</sup>\n• Fixed a crash on Linux when the D-Bus session bus disconnected while the app was running, such as at logout or when dbus is restarted. [#53095](https://github.com/electron/electron/pull/53095) <sup>(Also in [42](https://github.com/electron/electron/pull/53094), [44](https://github.com/electron/electron/pull/53096))</sup>\n• Fixed a crash on Windows when V8 posted a delayed worker task during shutdown. [#53013](https://github.com/electron/electron/pull/53013) <sup>(Also in [42](https://github.com/electron/electron/pull/53014), [44](https://github.com/electron/electron/pull/53201))</sup>\n• Fixed a crash on macOS when a WebAuthn Touch ID prompt was requested while no locale resources were loaded. [#53195](https://github.com/electron/electron/pull/53195) <sup>(Also in [44](https://github.com/electron/electron/pull/53194))</sup>\n• Fixed a crash on macOS when a notification's icon could not be attached; the notification is now shown without the icon. [#53147](https://github.com/electron/electron/pull/53147) <sup>(Also in [42](https://github.com/electron/electron/pull/53148), [44](https://github.com/electron/electron/pull/53146))</sup>\n• Fixed a crash when calling `node:wasi` functions in optimized code. [#53265](https://github.com/electron/electron/pull/53265) <sup>(Also in [42](https://github.com/electron/electron/pull/53267), [44](https://github.com/electron/electron/pull/53268), [45](https://github.com/electron/electron/pull/53266))</sup>\n• Fixed a crash when calling `utilityProcess.postMessage()` after the utility process had exited. [#53301](https://github.com/electron/electron/pull/53301) <sup>(Also in [44](https://github.com/electron/electron/pull/53300), [45](https://github.com/electron/electron/pull/53299))</sup>\n• Fixed a regression where a window created with a custom title can show an empty title after using back/forward navigation. [#53219](https://github.com/electron/electron/pull/53219) <sup>(Also in [42](https://github.com/electron/electron/pull/53217), [44](https://github.com/electron/electron/pull/53218))</sup>\n• Fixed a renderer crash when a page calls `SpeechRecognition.available()` or `SpeechRecognition.install()` with `processLocally`. [#53015](https://github.com/electron/electron/pull/53015) <sup>(Also in [42](https://github.com/electron/electron/pull/53016), [44](https://github.com/electron/electron/pull/53021))</sup>\n• Fixed an issue where pages loaded in a detached `WebContentsView` wouldn't see the correct window size. [#53152](https://github.com/electron/electron/pull/53152) <sup>(Also in [42](https://github.com/electron/electron/pull/53151), [44](https://github.com/electron/electron/pull/53153))</sup>\n• Fixed crashes in sharedTexture, service-worker ipcRenderer and utilityProcess.fork() caused by object lifetime bugs. [#53278](https://github.com/electron/electron/pull/53278) <sup>(Also in [44](https://github.com/electron/electron/pull/53279), [45](https://github.com/electron/electron/pull/53280))</sup>\n• Fixed crashes in the main process when a `webRequest.onBeforeRequest` listener redirected a CORS preflight request, and when calling `net.fetch()` with a `webRequest`-permission extension loaded. [#53304](https://github.com/electron/electron/pull/53304) <sup>(Also in [44](https://github.com/electron/electron/pull/53303), [45](https://github.com/electron/electron/pull/53302))</sup>\n• Fixed crashes when a webContents or parent window is destroyed while other APIs still reference it. [#53288](https://github.com/electron/electron/pull/53288) <sup>(Also in [44](https://github.com/electron/electron/pull/53287), [45](https://github.com/electron/electron/pull/53281))</sup>\n• Fixed crashes when certain app event handlers call back into Electron synchronously. [#53276](https://github.com/electron/electron/pull/53276) <sup>(Also in [44](https://github.com/electron/electron/pull/53275), [45](https://github.com/electron/electron/pull/53269))</sup>\n• Fixed document title updates when using back/forward navigation using the same document without utilizing `browserWindow.setTitle()`. [#53023](https://github.com/electron/electron/pull/53023) <sup>(Also in [42](https://github.com/electron/electron/pull/53099), [44](https://github.com/electron/electron/pull/52968))</sup>\n• Fixed region-qualified `--lang` values such as `de-DE` loading no locale resources on macOS, which left localized strings empty and could crash WebAuthn Touch ID prompts. [#53186](https://github.com/electron/electron/pull/53186) <sup>(Also in [42](https://github.com/electron/electron/pull/53187), [44](https://github.com/electron/electron/pull/53188))</sup>\n• Fixed spellcheck not initializing on Linux when the dictionary was already cached from a previous run. [#52717](https://github.com/electron/electron/pull/52717) <sup>(Also in [44](https://github.com/electron/electron/pull/52716))</sup>\n• Fixed the GPU process being terminated in AppX/MSIX packaged apps on Windows when WebGPU fell back to SwiftShader. [#53197](https://github.com/electron/electron/pull/53197) <sup>(Also in [42](https://github.com/electron/electron/pull/53199), [44](https://github.com/electron/electron/pull/53198))</sup>\n• Fixed the primary instance being killed or receiving truncated arguments when a second instance passed a very long command line or large `additionalData` to `app.requestSingleInstanceLock()`. [#53156](https://github.com/electron/electron/pull/53156) <sup>(Also in [42](https://github.com/electron/electron/pull/53157), [44](https://github.com/electron/electron/pull/52950))</sup>\n• Fixed the tray icon not appearing on GNOME (and disappearing entirely on Wayland) since 43.4.1. [#53215](https://github.com/electron/electron/pull/53215) \n• Fixed utility process crashes at exit on Windows 11 24H2 and later. [#53092](https://github.com/electron/electron/pull/53092) <sup>(Also in [42](https://github.com/electron/electron/pull/53091), [44](https://github.com/electron/electron/pull/53093))</sup>\n• Fixed windows native message boxes being dismissed by other applications using invalid button ID. [#53155](https://github.com/electron/electron/pull/53155) <sup>(Also in [44](https://github.com/electron/electron/pull/53154))</sup>\n## Other Changes\n\n• Backported fixes from upstream ANGLE, Chromium, Dawn, Skia and V8. [#52969](https://github.com/electron/electron/pull/52969) \n• Backported fixes from upstream ANGLE, Chromium, Dawn, V8 and WebRTC. [#53190](https://github.com/electron/electron/pull/53190) \n• Backported fixes from upstream Chromium and V8. [#53055](https://github.com/electron/electron/pull/53055) \n• Fixed a 1-in-200 chance per renderer process on Windows of scripts on the first page load being compiled without their V8 code cache. [#52943](https://github.com/electron/electron/pull/52943) <sup>(Also in [42](https://github.com/electron/electron/pull/52988), [44](https://github.com/electron/electron/pull/52792))</sup>\n• Fixed a stall of tens of milliseconds while creating the first `BrowserWindow` on Linux.\n  • Improved the performance of file lookups inside ASAR archives and of large files served from them to the renderer.\n  • Improved the performance of calls through `contextBridge`-exposed APIs.\n  • Reduced the main-thread cost of sending large values through `ipcRenderer`, `ipcMain` handlers and `webContents.send`. [#53018](https://github.com/electron/electron/pull/53018) <sup>(Also in [42](https://github.com/electron/electron/pull/53019), [44](https://github.com/electron/electron/pull/53017))</sup>\n• Improved application startup time on Linux by skipping GDK's OpenGL probe and loading FontConfig off the main thread during toolkit initialization. [#53108](https://github.com/electron/electron/pull/53108) <sup>(Also in [44](https://github.com/electron/electron/pull/53107))</sup>\n• Improved startup time of `utilityProcess.fork()`, `child_process.fork()` / `ELECTRON_RUN_AS_NODE` child processes and Nod"
