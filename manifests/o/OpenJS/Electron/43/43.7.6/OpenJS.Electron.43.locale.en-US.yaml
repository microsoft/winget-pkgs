ReleaseNotes: |-
  Release Notes for v43.7.6
  Fixes
  - Fixed --xdg-portal-required-version having no effect and a spurious portal warning being logged for file dialogs on Linux. #54304 ^{(Also in 44, 45)}
  - Fixed a child WebContentsView losing focus when its window is reactivated. #54456 ^{(Also in 44, 45)}
  - Fixed a crash when a WebAuthn request used a security key that required its PIN. #54404 ^{(Also in 45)}
  - Fixed a crash when sending a DevTools protocol command with a non-string value for an optional string parameter via webContents.debugger. #54443 ^{(Also in 44, 45)}
  - Fixed a grey border around frameless windows on Linux WMs without compositing. #54390 ^{(Also in 44, 45)}
  - Fixed a main process crash when a native API method was called with a this value of a different native type; it now throws a TypeError. #54316 ^{(Also in 44)}
  - Fixed a possible crash during process exit when vm.Script or vm contexts created in the main process had been garbage collected shortly before quitting. #54268 ^{(Also in 44, 45)}
  - Fixed a possible renderer crash in 32-bit Windows and Linux ARM builds caused by under-aligned Blink heap vector allocations. #54259
  - Fixed a renderer crash calling image.toPNG() from a sandboxed preload script. #54503 ^{(Also in 44, 45)}
  - Fixed clipboard.read(), readText() and has() resolving seconds late on Linux while the app was idle. #54309 ^{(Also in 42, 44, 45)}
  - Fixed desktopCapturer.getSources() leaving non-resizable windows resizable on macOS. #54396 ^{(Also in 44, 45)}
  - Fixed fs.rmSync failing to remove read-only files on Windows. #54256 ^{(Also in 42, 44, 45)}
  - Fixed GDK_BACKEND leaking into processes spawned by Electron apps on Linux. #54426 ^{(Also in 44, 45)}
  - Fixed pointerLock permission requests from some iframes reporting the parent frame. #54465 ^{(Also in 42, 44, 45)}
  - Fixed setIgnoreMouseEvents() taking effect late on X11. #54498 ^{(Also in 44, 45)}
  - Fixed setIgnoreMouseEvents(true) being undone by the next resize on X11. #54423 ^{(Also in 44, 45)}
    - Added setIgnoreMouseEvents support on Wayland.
  - Fixed the default action label on Linux notifications not being localized. #54400 ^{(Also in 44, 45)}
  - Fixed the GPU process crash-looping on Windows when the sandbox cannot read the install folder; the folder is now reported instead. #54485 ^{(Also in 44, 45)}
  - Fixed the zoom level resetting on file: and other host-less pages after a location.hash change. #54440 ^{(Also in 44, 45)}
  - Fixed typing not working after closing an alert() or confirm() on Windows. #54462 ^{(Also in 44, 45)}
  - Fixed utilityProcess dropping stdout/stderr output that the child wrote immediately before exiting. #54279 ^{(Also in 42, 44, 45)}
  - Fixed visual zoom limits resetting on navigation and not applying to webviews. #54450 ^{(Also in 44, 45)}
  - Fixed WebAssembly exception handlers failing to catch, or crashing during tier-up, in modules using wasm exceptions. #54235
  - Fixed WebAssembly modules loaded from the code cache crashing or throwing RuntimeError: unreachable after updating between certain patch releases. #54238 ^{(Also in 42, 44, 45)}
  - Fixed win.setEnabled(false) and modal child windows not blocking input on Wayland. #54446 ^{(Also in 44, 45)}
  - Fixed zoom in/out getting stuck after zooming past the 25%-500% range. #54422 ^{(Also in 44, 45)}
    - Fixed setVisualZoomLevelLimits() shrinking pages when the minimum is under 1.
