# The installer manifest: where the file is, what kind it is, and how to
# install it without asking anybody anything.
#
# InstallerType nullsoft: electron-builder's Windows target is NSIS, whose
# silent switch is /S. Scope user: the installer is perMachine:false
# (electron-builder.yml), so it installs for the person running it and needs
# no administrator prompt.
#
# NOTE: THE SHA IS OF THE FILE ON THE WEBSITE, and both must be replaced together
# at every release: winget refuses an installer whose hash does not match.
# RELEASE.bat prints the address; the hash is
#     certutil -hashfile dist\OBD2-FaultFinder-<version>-win.exe SHA256
# or, against the live copy, `winget hash <url>`.
PackageIdentifier: OBD2FaultFinder.OBD2FaultFinder
PackageVersion: 1.1.3
MinimumOSVersion: 10.0.17763.0
InstallModes:
  - interactive
  - silent
  - silentWithProgress
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    Scope: user
    InstallerUrl: https://dl.obd2faultfinder.com/OBD2-FaultFinder-1.1.3-win.exe
    InstallerSha256: DD47DE8C8FB04BBFE3925EDCDE26AB916BB2EBE932AB8C904B39EBFB43F9BDA0
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
    UpgradeBehavior: install
    AppsAndFeaturesEntries:
      - DisplayName: OBD2 FaultFinder
        DisplayVersion: 1.1.3
        Publisher: OBD2 FaultFinder
        InstallerType: nullsoft
ManifestType: installer
ManifestVersion: 1.6.0
