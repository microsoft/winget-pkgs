ShortDescription: "Kit de mantenimiento de Windows: limpieza, diagnostico, ajustes y reparacion en una sola ventana."
Description: >-
  OmegaSolver es un kit de mantenimiento de Windows escrito en C# (.NET 10).
  Limpia archivos temporales con un reporte detallado de que elimino, cuando y
  donde, ejecuta diagnostico del sistema, aplica ajustes de privacidad y
  rendimiento agrupados al estilo WinUtil, gestiona puntos de restauracion,
  programa limpieza automatica y permite anclar botones personalizados en la
  ventana principal.
