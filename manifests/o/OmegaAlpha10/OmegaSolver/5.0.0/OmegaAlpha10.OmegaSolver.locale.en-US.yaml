ShortDescription: "Windows maintenance toolkit: cleanup, diagnostics, tweaks and repair in one window."
Description: >-
  OmegaSolver is a Windows maintenance toolkit built in C# (.NET 10). It cleans
  temporary files with a detailed report of what was removed, when and where,
  runs system diagnostics, applies privacy and performance tweaks grouped in
  WinUtil-style sections, manages restore points, schedules automatic cleanup
  and lets you pin custom buttons to the main window.
