ShortDescription: Autonomous zero-config anti-censorship VPN client for Windows with System Proxy, No Proxy (local SOCKS5/HTTP), and Wintun TUN mode.
Description: |-
  HotaruNet is a free, open-source, zero-config anti-censorship VPN client built with Tauri 2 and Xray-core.
  It probes real download throughput rather than raw HTTP 204 pings and dynamically selects across VLESS REALITY,
  Cloudflare WARP, Hysteria 2, XHTTP, and WebSocket+TLS with automatic live failover. v2.3.44 adds No Proxy mode
  with dynamic local SOCKS5/HTTP ports, 4-stage animated Cyber Robot progress, hedged parallel feed mirror racing,
  and direct Telegram creator support (@OneForAllHubBot).
