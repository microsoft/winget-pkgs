ReleaseNotes: >-
  - The default expected precompiler method signature is now void Compile(PrecompilationContext context)
  - Its alternative return type variation bool Compile(PrecompilationContext context) signature is still supported for backward compatibility but the return value will be ignored.
  - The old precompiler syntax bool/void Compile(ref string scriptCode, string scriptFile, bool isPrimaryScript, Hashtable context) is made obsolete, though it will be supported for the time being.
