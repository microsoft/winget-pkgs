ReleaseNotes: |-
  v0.6.2
  - 已启动时再次打开 Markdown，复用现有窗口和主进程；保留未保存更改的保存、取消保护。
  - 支持 macOS 系统文件打开事件，注册 Markdown 文件类型。
  - 包含 v0.6.1 的中文输入法光效和源码占位符同步修复。
  日常使用 Windows 安装版。单文件便携 EXE 每次启动需先解压，已有进程接管也需要先经过该启动器。
  安装版同等程序的本机启动测量见开发说明；不代表所有设备或文档的耗时。
