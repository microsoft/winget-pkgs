ReleaseNotes: |-
  Vetta 0.5.67
  改进
  - 用设计助手做落地页和 App 界面前，会先了解你的偏好：「想要什么感觉」一定会问，每个选项直接写明明暗、颜色、字体和界面骨架，不再是抽象的设计术语；除此之外要不要问、问几题，由助手根据你的需求描述自行判断，你已经说清楚的不再问，说「直接做」则一题不问。你的回答会记在设计里，以后加新页面沿用。代价是需求不明确时开画前多一轮问答。
  修复
  - 设计画布里，指针停在选中的画框上用触控板缩放或平移时，画布会一顿一顿地挪（约每 0.2 秒动一下），内容越多、带 3D 越明显；指针移到画框外又恢复正常。现在在画框里操作和在画框外一样跟手。
  其他
  - 设计助手的内置说明精简了重复内容（约 8%），行为规则不变，为后续新增能力留出空间。
  - 设计助手的内置说明开头新增一段五步工作流概览，并加了一组测试守住其中的硬规则，之后再精简说明时不会无声丢规则。
  - 设计助手做 App 界面时，图表、表格、表单、手机适配等参考规则改为随设计方向表按屏幕一并送达，不再只靠助手自己去读文件；常驻说明里只保留每个屏幕都用得上的部分。
