ReleaseNotes: |-
  Vetta 0.5.68
  改进
  - 设计助手做 App 界面不再套用固定的风格模板。以前点单、外卖、银行、天气这类面向用户的 App 都会被套进同几套后台风格，连做几份几乎同一个蓝、同一款字、同一种白卡片。现在助手先写下「按习惯会做成什么样」，再从这个产品独有的东西出发提出三个明显不同的方向（明暗、主色、字体至少两项不同）让你挑；靛蓝紫主色、被用烂的标题字、对比度不足、三个方向彼此太像或和最近几份设计撞车的，都会被打回重提。代价是开画前多一步，助手提案偶尔要改一两轮。
  - 渐变、阴影、毛玻璃、等宽字、小号大写标签、第三种字体不再一律禁止：方向里写明理由就可以用，只在理由适用的地方用。图标方块、标题上方的小标签、编号、靛蓝紫这类一眼就是 AI 做的痕迹照旧不许。
  - 手机界面不再被写成「桌面后台折叠版」（顶栏、筛选标签条、两列数字卡、两行列表），构图交还给设计方向；只保留触控尺寸、安全区、对比度这类硬要求。
  - 新建设计的默认配色改成中性灰占位，不再是一眼能认出的靛蓝配色；助手没换掉就开画会被提醒。
  - 设计可用的字体新增 Fraunces、Space Grotesk、Nunito、Syne、Cormorant Garamond 等十五款。
  其他
  - 设计助手插件升到 0.7.4。用旧版做的 App 设计照常打开，原来的配色字体保留不动，只是要换风格时改为重新提方向。
