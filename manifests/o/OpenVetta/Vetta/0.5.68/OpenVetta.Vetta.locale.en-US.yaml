PackageIdentifier: OpenVetta.Vetta
PackageVersion: 0.5.68
PackageLocale: en-US
ShortDescription: An open-source, local-first desktop AI agent built for real work.
Description: Vetta is an open-source desktop AI agent that is local-first, extensible, and under your control. It combines models, project files, local tools, and reusable capabilities in one workspace, supporting BYOK model connections, MCP servers, skills, plugins, workflows, and local knowledge bases. Vetta can inspect workspaces, use tools with visible permission boundaries, and produce real files.
