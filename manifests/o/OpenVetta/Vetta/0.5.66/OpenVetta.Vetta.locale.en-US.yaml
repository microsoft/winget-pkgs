ReleaseNotes: |-
  Vetta 0.5.66
  新增
  - 设计助手现在会给设计稿配真实图片：从 Unsplash 照片、Openverse、Wikimedia Commons、NASA 等免费可商用图库搜索（不需要任何 API key），也能下载它用网页搜索找到的图，按版面尺寸裁切压缩后存进设计里，并自动记录作者和许可。来源不明的图会标为「许可待确认」并在报告里列出，正式使用前需要你核对；真实电影海报、品牌图默认不下载，改用真实照片配虚构内容。截图检查也会指出「渐变色块加图标」冒充的图片位，以及落地页图片过少。
  - 用设计助手做落地页和 App 界面时，新建设计的同时就会从一套方向库里随机发三个设计方向，它要先挑出最贴合你主题的一个才能开画，配色、字体和版式都按这个方向来，不再总是同一套靛蓝配色加居中卡片。方向库引用并改编自开源项目 taste-skill（MIT），感谢它对真实获奖网站与产品界面的研究，这是这次设计改造的基础。选定的方向保存在设计里，以后加新页面会沿用；你随时可以让它换一个方向，或只换配色、字体；点名已有品牌（比如 Emby）时会保留品牌色，但只用在主按钮等少数地方，不再铺满整个界面。代价是新设计开画前多一步定方向。幻灯片和海报仍按原来的方式自己定方向。
  改进
  - 用上述方式发过方向的设计，截图检查会指出常见的「AI 味」痕迹并附上改法：渐变、静止的阴影、毛玻璃、小号大写标签、过小的字、正文里的等宽字体、超过两种字体、超过两行的标题、成排的图标方块和表情符号。落地页和 App 界面的标准不同（App 允许很淡的卡片阴影和更小的标签字）；跟随风格包或 DESIGN.md 的设计，配色和质感类的检查不生效。
  - 后台、仪表盘和设置页的设计规则换成基于真实产品界面测量的版本：颜色只用在数据上，指标用文字而不是彩色图块，表格靠对齐而不是斑马纹，空状态和零值如实显示，使做出来的后台更像一个具体产品，而不是一套组件模板。
  - 设计画布里单个 Frame 从开始加载到画完的时间由约 370ms 缩短到约 70ms：首次打开设计、刷新全部 Frame、新增或删除 Frame 后整页重新加载时，Frame 的转圈与位图截图都会明显更快结束；选中 Frame 切换到可交互状态也更早。
  修复
  - 修复设计画布在缩放、平移或移动 Frame 之后，选中的 Frame 大约 1 秒后闪白一下的问题：画布每次保存视图位置都会让设计预览整页重新加载，选中的 Frame 因此短暂变成空白，同时连带重新渲染一遍；现在保存画布布局不再触发预览重载。
  - 修复设计画布使用备注工具时，点击左上角备注面板里的按钮（如「清除已完成」「关闭」）会在点击位置顺带弹出新建备注输入框的问题。
  其他
  - 感谢 taste-skill 的作者：设计插件的方向库、App 界面规则与 Unsplash 照片索引都来自这个项目（MIT）。我们原样存放它的数据并保留许可声明，适配代码与数据分开，方便持续跟进上游的更新。
