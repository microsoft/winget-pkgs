ReleaseNotes: |-
  Vetta 0.5.70
  新增
  - UI 设计新增 Apple Watch 品类：让 Vetta 做手表 App 时（product: watch，默认 46mm 的 208×248），会按 watchOS 26 的规范来：纯黑底（除非你另有要求）、系统无衬线字体且尽量不用衬线、顶部是圆形返回按钮 + 标题 + 右上角系统时间（按钮和时间离屏幕圆角留足距离，不再贴着曲线）、一屏只放一个大数字、不画状态栏和表壳；字号表、12pt 下限、每行按钮个数这些取自 Apple 的 Human Interface Guidelines。出方向提案时手表不再要求「明暗拉开」，改在色系和字体类别上拉开。
  - UI 设计新增「交互模式」：右上角最右端的「设计 / 交互」胶囊开关（选中项用主色）切到交互后，设计稿变成可以真点的运行态，从首页开始，页面里的链接照常跳转，顶部的按钮和画布右上角一致，都是圆角胶囊：左边是合在同一个胶囊里的后退、前进、刷新、首页（只有图标）以及路径和页面列表，右边是带文字的切换设备和浏览器打开（面板变窄时头部始终保持一行：先把右边两个按钮收成图标，再窄就收起左边的路由控件）；顶部条与画面共用同一块背景，不再有设计稿切换。画面始终是设计稿的真实尺寸，面板放不下就整体等比缩小，布局不会变形；底色和点阵与画布一致，底部有一层主色（优先设计色卡的 primary，没有则用 Vetta 的）由下往上淡出的渐变（浅色模式下只留很淡的一点），顶部按钮的配色也和画布右上角的按钮相同。设备类型分「移动端 / 桌面端 / 其他」，Vetta 新建设计时按品类或尺寸判断并记在设计里，你也可以点工具条里的「切换设备」，在弹出的浮层里选一个设备预设来改（没有单独的类型选项，类型跟着预设所属的分类走）。移动端套上 iPhone 机身外壳（灵动岛 / 刘海 / Home 键三种，屏幕和机身的圆角以外壳为准、不再套画框的圆角，可在同一个设备浮层里选择设备预设——与画布底部尺寸面板同一份（Phone / Desktop / Watch / 纸张 / iPad，含 iPad 横竖屏），选了别的类别的预设设备类型会跟着切换，只影响预览、不改设计稿；旧设计稿尺寸对不上任何机型时默认用 iPhone 17 Pro），鼠标变成灰色圆点，按住拖动可以滚动（带惯性，横向轮播也能拖），长按触发长按菜单，滚轮照常；外壳自带灵动岛 / 刘海，所以移动端交互时设计稿状态栏里的灵动岛 / 刘海会被隐藏，时间、信号、电量照常显示；如果设计里的状态栏是自己写的图片（灵动岛画在图里拆不开），则反过来由外壳让出自己的灵动岛，避免叠成两个。不同类别的预设有各自的外观：手机、iPad、Apple Watch 套机身外壳（iPad 和手表同样是触摸设备，鼠标变灰色圆点、按住拖动滚动），桌面是 8px 中性灰半透明边框，纸张是 1px 的细边框。切换设计 / 交互时，画布的缩放、选中和撤销记录原样保留，交互里的页面位置也会保留。
  - UI 设计画布上单独选中一个 frame 时，左侧会出现 Frame Menu。第一个按钮是「让 Vetta 去做」（原先在 frame 右上角），直接写下要怎么改这个画框；长落地页、带滚动的手机页在设计尺寸里显示不全时，用「展开画布高度」看到完整内容，「收起画布高度」回到原来的设计尺寸。展开只影响画布上的显示，不改设计稿声明的尺寸。
  - UI 设计画布新增预设尺寸。选中「新建 Frame」工具时，底部会伸起一块通栏面板，顶部是 Phone / Desktop / Watch / 纸张 / iPad 五个分类，下面横排各预设的外形预览、名称和像素（如 iPhone 17 · 393 × 852），点一下就在当前视口中间新建；iPad 可切横屏 / 竖屏。原来拖拽画框的方式照旧可用。
  - 已有的 Frame（自己画的或 Vetta 设计的）单独选中后，左侧 Frame Menu 多了一枚尺寸胶囊，显示当前尺寸；点它会切到「新建 Frame」工具并弹起底部预设面板（和新建共用同一块面板），自动翻到它当前所属的分类并标出匹配的预设，点一个预设即改尺寸、同时套用设备圆角，左上角位置不变，展开着的画布高度会一并收起。
  - UI 设计画布的 Frame 圆角可以调了。单独选中 Frame 后，四个角的内侧各有一个圆点，朝 Frame 中心拖就变大、往角上拖变小，四个角一起变；鼠标悬停和拖拽时旁边会显示当前圆角数值，松手保存。圆角只影响画布上的显示，不改设计稿代码，不动过的 Frame 仍是原来的 12px。
  - 预设尺寸带上了设备的屏幕圆角：iPhone 17 系列 / Air 62、iPhone 16 Plus 55、iPhone 14 47、iPhone 13 mini 44、iPad 18，桌面、纸张和 iPhone SE 为直角。新建或给已有 Frame 套用预设时一并设置圆角，预设卡片上的外形预览也带圆角。iPhone / iPad 的数值来自社区实测（Apple 未公布），Apple Watch 没有可靠的公开数据，当前是按屏幕宽度估的近似值（42mm 为 38、46mm 为 42），后续有实测值再校准。
  - UI 设计画布上新建的空白 Frame 默认是纯白底，不再是浅灰；如果这份设计的色卡里已经有背景色（background，其次 bg / surface 等），就用色卡的背景色，随色卡走。
  - UI 设计画布支持撤销和重做（⌘Z / ⇧⌘Z，Windows 为 Ctrl+Z / Ctrl+Y），底部工具栏最左边也有对应按钮，提示里会写明是哪一步（如「撤销：调整尺寸」）。覆盖移动、调整尺寸、整理排列、调整圆角、套用预设尺寸、展开 / 收起、新建 Frame、删除 Frame 和重命名；一次拖动或一次套用预设算一步。删除 Frame 后可以撤销找回，删除确认框的文案相应改了。只撤销你自己的操作：如果某个画框在那之后被 Vetta 改过，这一步会提示无法撤销，不会覆盖 Vetta 的改动。撤销记录只在当前打开期间有效，关闭设计、恢复历史版本后清空；备注的增删暂不支持撤销。
  - UI 设计的 agent 现在能看到画布里的预设尺寸和圆角。用户说「新建一个 iPhone 17 的设计」「改成 iPad Pro 13 横屏」「Apple Watch 46mm」「A4」这类设备 / 纸张尺寸时，Vetta 会查与底部面板同一张表，而不是凭记忆写像素（新机型最容易记错）；画框元数据也支持可选的 radius，Vetta 建出来的设备画框和你从面板里点出来的一样带屏幕圆角，vetd_status 会报出每个画框当前生效的圆角（含你在画布上手动调过的）。你调过的圆角不会被 Vetta 改其他内容时冲掉。
  - UI 设计画布在面板拖窄时不再互相挤压或超出视口：底部预设面板窄了以后，分类 tab 收成一个下拉；底部工具栏依次收掉缩放加减、关掉鼠标放大，最窄时可横向滑动，两端不再超出；右上角按钮组先收成图标（版本历史、导出），更窄时运行也只留图标，左上角的设计名在剩下的空间里截断，不再与右上角重叠。
  修复
  - UI 设计里带大圆角的画框（如 iPhone 屏幕）在画布和交互视图中，四角不再漏出一块方形的灰色模糊：页面里的毛玻璃（backdrop-blur）不受外层圆角裁剪，现在圆角 24px 以上的画框会关掉它；12px 的默认圆角和导出结果不受影响。
  - UI 设计画布上高度超过 4096px 的 frame（如长落地页）不再显示成被放大、左右裁掉的冻结图：位图改为分段截取后拼成完整一张，与选中时的活体画面一致；agent 截这类 frame 也能拿到完整页面，而不是只有上半截。
  改进
  - 画布右上角的「运行」按钮和原来的预览弹窗已移除，由「设计 / 交互」开关取代；弹窗里的拖拽改视口、手机 / 平板 / 桌面三档视口和左侧 Frame 缩略图列表不再保留（视口固定为设计稿尺寸，换页用顶部的页面列表）。
  - UI 设计画布的底色不再和 Vetta 窗口背景一样，改用更有层次的次级底色，浅色、深色主题下都能分清画布边界，白底设计稿也有了衬托。背景纹理也由线格改成了更细更淡的点阵，鼠标划过时指针附近的点会亮起一圈光晕（缩放、平移期间自动收起，不增加卡顿）。
  - UI 设计画布上的 frame 四个角改为 12px 圆角，不再是生硬的直角。
  - UI 设计画布底部工具栏改为全圆角胶囊，内边距更紧凑，选中的工具用主色底显示。右上角的「显示/隐藏备注」开关挪到了工具栏的备注工具旁边，与备注工具合为一组，右上角不再有它。
  - UI 设计画布右上角的按钮改为各自独立的全圆角胶囊（版本历史、导出、运行），不再合在一条 bar 上。「导出渲染图」和「下载素材」合并为一个「导出」按钮：点开是「制作渲染图」和「导出 Frame」，鼠标移到「导出 Frame」上会展开图片 / PDF 的选项。刷新画布按钮已移除。
  - UI 设计画布左上角的「色彩系统」入口（◐ 按钮及其色卡面板）已移除；颜色仍由设计稿的 theme.css 统一管理，改色直接让 Vetta 去改。
  其他
  - Frame Menu 展开画布高度后立刻缩放或平移画布，画框不再短暂显示成旧尺寸被拉伸的画面（本版本新功能开发中的问题）。
  - 发版流程改由脚本把关：发布说明带上开发中 / 已发布的状态标记，开下一个版本或改这一版的版本号都有专门命令，打 tag 前会核对版本号、发布状态和跳号；版本号与安装包不符的 tag 不再被静默跳过，而是直接让发版失败。
  - 引擎新增触摸模拟脚本（仅交互模式移动端启用），引擎文件随内容哈希自动重新物化，无需手动处理；新增开发依赖 devices.css（MIT）用于手机外壳。
