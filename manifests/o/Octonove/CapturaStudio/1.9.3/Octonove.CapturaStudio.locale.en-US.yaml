ReleaseNotes: |-
  ## 🛠️ Arreglo del editor

  • ✍️ **Cambiar el tamaño de la letra de un texto ya se ve**：antes, al editar un texto (doble clic) y cambiar el tamaño, el texto se quedaba igual en el lienzo — la letra nueva se reescalaba al hueco anterior. Ahora el tamaño del texto en el vídeo **sigue de verdad al tamaño de letra** elegido (al añadirlo y al editarlo, conservando su posición central), acotado a los límites del lienzo. Después puedes seguir afinándolo arrastrando el asa de la esquina.

  ---

  ### Instalación
  Descarga **CapturaStudio-Setup.exe** y ejecútalo. Si Windows muestra *"Windows protegió tu PC"*, pulsa **Más información → Ejecutar de todas formas**. Se instala sin permisos de administrador.
