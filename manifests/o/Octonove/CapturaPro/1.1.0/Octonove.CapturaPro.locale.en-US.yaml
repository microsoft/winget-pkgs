ReleaseNotes: "## ✨ Nueva herramienta：Difuminar\n\n• 🔒 En el **editor de anotaciones** (donde pones flechas, cuadros y texto sobre una captura), ahora hay una herramienta **«Difuminar»**：arrastra un rectángulo sobre la zona con datos sensibles y quedará difuminada. Ideal para censurar nombres, correos o números antes de compartir una captura.\n  • La **intensidad** se controla con el campo **Grosor** de la barra.\n  • Funciona con **Deshacer/Rehacer**, y las flechas o textos que dibujes después encima quedan nítidos.\n\n---\n\n### Instalación\nDescarga **CapturaPro-Setup.exe** y ejecútalo. Si Windows muestra *\"Windows protegió tu PC\"*, pulsa **Más información → Ejecutar de todas formas**. Se instala sin permisos de administrador."
