PackageIdentifier: OddEssentials.TerminalAIChat
PackageVersion: 0.2.0
PackageLocale: en-US
Publisher: Odd Essentials
PublisherUrl: https://github.com/oddessentials
PublisherSupportUrl: https://github.com/oddessentials/terminal-ai-chat-releases/issues
Author: Peter Palles
PackageName: terminal-ai-chat
PackageUrl: https://github.com/oddessentials/terminal-ai-chat-releases
License: Proprietary
ShortDescription: Terminal client for your ChatGPT web session.
Description: |-
  A terminal client for your ChatGPT web session. It uses your normal ChatGPT login and needs no API key.
  Sign-in happens in a dedicated, sandboxed Chrome that the tool provisions privately inside WSL, and the browser's local data is removed when you exit.
Moniker: terminal-ai-chat
Tags:
- chatgpt
- cli
- terminal
- tui
- wsl
ReleaseNotesUrl: https://github.com/oddessentials/terminal-ai-chat-releases/releases/tag/v0.2.0
InstallationNotes: |-
  terminal-ai-chat needs WSL with the Ubuntu-24.04 distribution.
  Run "terminal-ai-chat setup" once before first use, and again if terminal-ai-chat asks for it after an upgrade.
  To use a different WSL distribution, run "terminal-ai-chat setup --distro NAME" and start the client with "terminal-ai-chat --distro NAME".
ManifestType: defaultLocale
