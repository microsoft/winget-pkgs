- cloud-backup
InstallationNotes: |-
  MirrorHold is installed for you alone, in %LOCALAPPDATA%\Programs\MirrorHold, and set up: its Start menu entry and the scheduled tasks its jobs' automatic runs need.
  Updating and uninstalling change nothing while MirrorHold is at work: close its window, and let a run, a verification or a repair end, or cancel it.
  Uninstalling keeps your jobs, their records and your backups.
