ShortDescription: One-way backups of folders and drives onto backup drives or a cloud store, with holds against copying a disaster.
Description: |-
  MirrorHold keeps one-way copies of folders and whole drives on backup drives, or in a folder of a
  cloud store you have set up in rclone, when you start a job, when one of its drives is attached, or
  on a schedule. Sources are only read, and a file a run would delete or overwrite on a backup moves
  into a versions folder there instead. Large removals, and changed files that no longer look like
  their file type, are held until you review them. Backup drives are recognised by their partition and
  file system identity, never by drive letter. The copying is done by rclone, which MirrorHold carries.
Moniker: mirrorhold
