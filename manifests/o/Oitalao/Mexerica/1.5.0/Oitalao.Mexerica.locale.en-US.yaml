ShortDescription: Free, open-source file converter for Windows. Drag a file, press Space and drop it on the option you want.
Description: |-
  Mexerica converts and edits files without opening any program. It sits in the system tray: drag one or more files, press Space without letting go of the mouse, and a wheel appears around the cursor with what you can do with them. It also works from the right-click menu, the keyboard and the command line.
  It handles images (HEIC, RAW, PSD, WebP, AVIF and more), audio, video, PDF, Word, Excel, PowerPoint, e-books, subtitles, fonts, 3D models, maps, CAD and archives. Tools include compressing images, videos and PDFs to an exact size, merging and splitting PDFs, OCR, redaction, AI background removal, a photo editor, a timeline video editor and batch renaming.
  Everything runs locally; the original file is never changed.
