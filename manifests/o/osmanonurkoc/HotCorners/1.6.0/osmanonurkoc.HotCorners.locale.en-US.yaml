ShortDescription: A lightweight macOS/Linux-like Hot Corners productivity utility for Windows 10 and 11
Description: |-
  HotCorners is an open-source, lightweight Windows utility developed in C# that brings the popular macOS and Linux Hot Corners productivity feature to Windows 10 and Windows 11.
  Features include zero-latency response using native Win32 APIs, independent actions for all four screen corners (Task View, Show Desktop, Action Center, Lock Screen, custom apps, and keyboard shortcuts), theme-aware UI, and fine-tuning controls.
