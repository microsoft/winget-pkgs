ShortDescription: Tiny tray app that brings off-screen windows back with one shortcut.
Description: |-
  Lost a window off-screen? Press Ctrl+Alt+Home and the active window jumps to the center of the screen under your mouse, shrunk to fit if needed. Click the tray icon and every window stuck off the edge of your screens comes back at once.
  Works with multiple monitors and mixed display scaling. No network access, no data collected.
