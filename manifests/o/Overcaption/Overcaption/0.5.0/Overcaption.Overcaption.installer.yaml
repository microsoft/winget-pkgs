# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: Overcaption.Overcaption
PackageVersion: 0.5.0
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.0.0
# winget's enum name for NSIS installers is "nullsoft" (not "nsis"). Silent install: /S.
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: 2026-10-29
# electron-builder's NSIS uninstall entry is "<productName> <version>" with
# Publisher taken from package.json author — keep these in sync or
# `winget upgrade` stops correlating the installed app with this manifest.
AppsAndFeaturesEntries:
  - DisplayName: Overcaption 0.5.0
    Publisher: Overcaption
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/overcaption/overcaption/releases/download/v0.5.0/Overcaption-0.5.0-win-x64.exe
    InstallerSha256: 4315B4EABD39067622564710D1CB80B1F985BC8529CA81FBBC38FA3AF9A0FC60
ManifestType: installer
ManifestVersion: 1.10.0
