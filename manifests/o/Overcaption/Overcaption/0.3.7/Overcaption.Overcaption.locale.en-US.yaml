ShortDescription: >-
  Free subtitle editor that runs fully offline: on-device speech recognition
  (Whisper), a modern cue editor with waveform timeline, local translation, and
  export to SRT/VTT/ASS or watermark-free burn-in. No account, no uploads.
Description: >-
  Overcaption is a free desktop subtitle studio for macOS (Apple Silicon)
  and Windows 10/11. It transcribes video on your machine with Whisper-class
  speech recognition (word-level timestamps, hallucination filtering), gives
  you a modern editor to fix text and timing (waveform timeline, keyboard
  shortcuts, reading-speed and line-length checks), translates locally to
  around 50 languages with downloadable models, and exports SRT, VTT, ASS
  and TXT or burns styled subtitles directly into the video without
  watermark. Everything runs offline — no account, no uploads, nothing
  leaves your machine. The core app is free with no time limit; a few
  advanced Pro features are paid.
