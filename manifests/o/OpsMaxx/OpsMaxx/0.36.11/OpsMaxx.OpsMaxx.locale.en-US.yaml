ShortDescription: SSH client, SFTP browser, database manager, CI/CD console, secrets vault and MCP gateway for AI agents.
Description: |-
  OpsMaxx is a free, open-source desktop application that keeps an SSH terminal, an SFTP
  browser, a remote desktop client, five database engines, SSH tunnels and VPN, CI/CD
  pipelines from Jenkins, GitLab and GitHub Actions, an encrypted secrets vault and fleet
  operations in one window, all sharing a single credential store.

  Pipelines are a first-class surface rather than a link out: browse them per connection,
  watch runs and their steps, tail logs live, and trigger, cancel or re-run with the
  provider's own parameters.

  It also exposes a policy-scoped MCP bridge, so Claude Code, Codex, Gemini CLI and other
  MCP clients can operate servers by friendly name without ever receiving an SSH password,
  a private key, a database credential or a hostname. Pipelines are reachable the same way,
  and the runs an agent starts execute on the provider's own runners under the provider's
  own credentials. Every capability is ALLOW, ASK or DENY per access group, sensitive
  actions wait for approval, and every action is written to an audit log.
