ReleaseNotes: |-
  This monumental release encompasses nearly 3 years of work since the 0.9 release, and a year's worth of core reworks since the 1.0rc2 release candidate last year. Tons of new device support, an overhauled profile system, the option to cleanly run as a background service, PawnIO, Qt6, and much more!
  
  On Windows, you will need to install https://pawnio.eu for OpenRGB to access RAM, older motherboards, and certain other devices. You must also run as Administrator or install with the background service option for PawnIO to be able to access these devices.
  
  Distro maintainers - this release officially switches from Qt5 to Qt6. Please build OpenRGB 1.0 packages against Qt6.
ReleaseNotesUrl: https://codeberg.org/OpenRGB/OpenRGB/releases/tag/release_1.0
