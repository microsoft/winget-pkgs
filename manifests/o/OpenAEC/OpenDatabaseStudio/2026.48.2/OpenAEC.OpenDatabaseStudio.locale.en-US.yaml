ReleaseNotes: |-
  Open Office Studio 2026.48.2
  Download and install
  Choose Open Office Studio for the complete suite, or download an individual app below. Each individual app works without installing the full suite.
  Windows: run the EXE installer. macOS: use the DMG (Apple Silicon). Linux: choose AppImage or DEB.
  This release provides Open Office Studio and six separate applications: Writer, Spreadsheet, Presentation, Email, Notition and Database. Each application has its own installer, application identity and profile. Standalone applications are updated with their own installer; installing the Suite is not required.
  Changes since 2026.48.1
  Spreadsheet
  - Bounded grid that grows with the content, with a status-bar switch (#371).
  - Remove duplicates, text to columns, goal seek and descriptive statistics.
  - Insert several rows or columns at once, a large multi-line formula editor, searchable validation drop-downs with "extend source", and "fill down to cell…" on the fill handle (#376).
  - Excel-style shortcuts: Ctrl+arrow, Ctrl+End, Ctrl+Space, Shift+Space, Ctrl+Enter and Alt+Enter in the cell editor.
  - Spell check in text cells and the cell editor (F7).
  Writer
  - Replacing text across a manual line break (or another inline object) no longer fails (#388).
  - Building blocks (AutoText), an AutoCorrect window and a Navigator (F5).
  Presentation
  - Spell check on slides and in notes.
  General
  - Template gallery with "My templates".
  - PDF export: PDF/A-2b, password protection and bookmarks.
  - Email: Ctrl+S saves the draft in the composer wherever the focus is (#379).
  - Start-up no longer waits indefinitely on font discovery (#370).
  - Linux Snap packages ship their own Zenity for native confirmations (#378).
  Known limits
  - The Snap change for #378 has been checked statically; no Snap was built and installed for this release.
  - #370 (freeze on start) could not be reproduced; this release adds time limits around font loading and the issue stays open for feedback.
  - #388 was verified in the engine and in Chromium, not in the native Windows, macOS or Linux apps.
