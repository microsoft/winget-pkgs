ShortDescription: 适用于 OpenAEC SuperCloud 的类 Dropbox 桌面同步客户端。
Description: |-
  OpenAEC Desktop App 是一款面向 OpenAEC SuperCloud 的类 Dropbox 桌面同步客户端（0.4 版之前该应用名为 OpenAEC Storage）。它将本地文件夹链接到 OpenAEC 环境中的空间，让你既能与他人协作又不会互相覆盖工作成果，还可以锁定文件并通过链接分享。该应用还负责安装、更新和启动 OpenAEC 工具，基于 Tauri 2、Rust 和 SolidJS 构建。
  同步按轮次以有限并行度运行，且只传输发生变化的块：做出更改后，仅有被修改的块会经由网络传输，其余部分由服务器复制。在 Windows 上，Cloud Filter API 会在已链接的文件夹中显示状态图标，在同步根中按需提供文件，并将同步根注册为资源管理器导航窗格中的“OpenAEC Cloud”。与你共享的文件夹可以像空间一样被链接，并带有查看、编辑或管理角色。“使用 OpenAEC 发送”窗口可将文件和文件夹作为附带下载链接的传输发送，还可选择添加收件人、留言、有效期和密码。助手界面用于与 OpenAEC 位于欧盟的 AI 服务对话。命令行程序则满足服务器上的无界面使用：登录、列出空间、链接文件夹，然后执行一轮同步或保持监控。
