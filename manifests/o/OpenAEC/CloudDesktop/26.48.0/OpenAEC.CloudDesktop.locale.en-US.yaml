ShortDescription: Dropbox-like desktop sync client for the OpenAEC SuperCloud.
Description: |-
  OpenAEC Desktop App is a Dropbox-like desktop sync client for the OpenAEC SuperCloud (until version 0.4 the app was called OpenAEC Storage). It links local folders to spaces in your OpenAEC environment, so you can work together without overwriting each other's work, lock files and share them with a link. It also installs, updates and starts the OpenAEC tools. The app is built with Tauri 2, Rust and SolidJS.
  Sync runs in bounded-parallel rounds and transfers only changed blocks: after a change, only the modified blocks go over the line and the server copies the rest. On Windows, the Cloud Filter API shows status icons in linked folders, offers files on demand in the sync root and registers the root as "OpenAEC Cloud" in the Explorer navigation pane. Folders shared with you can be linked like spaces, with view, edit or manage roles. The Send with OpenAEC window transfers files and folders as transfers with a download link, optionally with recipients, a message, an expiry date and a password. The Assistant screen is a conversation with OpenAEC's AI service in the EU. A command-line program covers headless use on servers: log in, list spaces, link a folder and run one sync round or keep monitoring.
