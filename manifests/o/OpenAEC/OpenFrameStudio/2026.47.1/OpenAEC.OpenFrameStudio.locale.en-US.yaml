  The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.47.1 (digest sha256:98b547c6fabb326352b6949af880267c805bee239154e3a1ef91dd707b32e91d). Idle container memory: 300MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
