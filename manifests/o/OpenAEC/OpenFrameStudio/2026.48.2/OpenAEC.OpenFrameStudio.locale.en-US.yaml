ReleaseNotes: |-
  Spouwlatten per kozijnzijde
  Kies in Eigenschappen per zijde een spouwlat of Geen spouwlat. Bij een rechthoekig kozijn verschijnt de lat in de 2D-tekening langs de gekozen zijde. De keuze wordt opgeslagen met het project. Als je één lat toevoegt, blijven de andere zijden vrij. Bij het aanpassen van een bestaande lat blijven de overige gegevens van die zijde behouden.
  OpenAEC Blueprint
  Alle twintig werkruimten gebruiken de OpenAEC Blueprint voor Frame Studio. Het lint past zich aan de vensterbreedte aan en onthoudt welke groepen en tabbladen je zichtbaar houdt. Met Ctrl+F1 klap je het lint in of uit.
  De 2D-editor en de 3D-viewer delen de projectverkenner links en het eigenschappenpaneel rechts. Bij een themawissel veranderen ook de achtergrond en het raster van de 3D-viewer. De camerastand blijft behouden. Nieuwe installaties openen in het lichte thema. Bij een update worden je bestaande thema en paneelbreedtes overgenomen.
  Ook de zelfstandige kozijnconfigurator, werkvloer en AR-preview gebruiken de nieuwe vormgeving. Open Frame Studio is bedoeld voor ontwerp- en BIM-uitwisselproeven. Functionele scope en releasecontroles
  Installeren
  Kies op Windows de download die eindigt op _x64_user-setup.exe voor installatie onder je eigen account of _x64-setup.exe voor de hele pc. De universele DMG is voor Macs met Intel en Apple Silicon. Voor Linux zijn een DEB en een AppImage beschikbaar.
  Build en controle van de installatiebestanden
  Docker (OpenAEC SuperCloud)
  The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.48.2 (digest sha256:b025feb2b87378b0bdb5b48d90f35478cf21184f4a170b1a65e7bbf03e1397e7). Idle container memory: 383.5MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
