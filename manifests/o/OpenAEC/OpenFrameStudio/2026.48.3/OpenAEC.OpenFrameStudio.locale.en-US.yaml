ReleaseNotes: |-
  A3-werkplaatstekening
  De liggende A3-werkplaatstekening gebruikt de tussenstijlen, tussendorpels en vakposities uit de 2D-editor. Ook een tussenstijl die alleen in de bovenste rij voorkomt, staat nu op de juiste plaats op papier. Bij rechthoekige kozijnen krijgt elk vak zijn nummer en vulling. De bovenste rij in de editor staat ook bovenaan op het blad.
  De PDF-regressietest leest de getekende contouren en de tekstposities rechtstreeks uit het opgeslagen bestand. Hij controleert een raster en een plaatselijke vakverdeling. De bestaande proef met een rond systeemkozijn controleert de kopgeometrie op afdrukschaal.
  Deze versie bevat ook de OpenAEC Blueprint en de per kozijnzijde instelbare spouwlatten uit v2026.48.2. Open Frame Studio is bedoeld voor ontwerp- en BIM-uitwisselproeven. Functionele scope en releasecontroles
  Installeren
  Kies op Windows de download die eindigt op _x64_user-setup.exe voor installatie onder je eigen account of _x64-setup.exe voor de hele pc. De universele DMG is voor Intel- en Apple Silicon-Macs. Voor Linux zijn een DEB, RPM en AppImage beschikbaar.
  Build en controle van de installatiebestanden
  Docker (OpenAEC SuperCloud)
  The tested desktop image is ghcr.io/openaec-foundation/open-frame-studio:2026.48.3 (digest sha256:9267ec897b520d42ff707bbb6d9271368844848284c58dbdea47f771e7ea2628). Idle container memory: 379.6MiB. Run it behind an authenticated proxy; port 3000 has no built-in sign-in. The image SBOM is attached to this release.
