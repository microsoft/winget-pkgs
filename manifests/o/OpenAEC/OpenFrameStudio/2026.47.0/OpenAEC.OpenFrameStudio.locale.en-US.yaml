ReleaseNotes: |-
  Open Frame Studio v2026.47.0
  Deze versie verbetert het ontwerpen en bematen van ronde en getoogde houten kozijnen.
  Wat is er nieuw?
  - Glassponningen, glaslatten en draaiende vleugels volgen de boog. De glaslijst vermeldt de glasmaat van elke ruit.
  - De houtkortlijst geeft booglengtes, stralen, kopse rondingen en zaaghoeken voor kozijnhout, raamhout en tussenstukken.
  - Bij een boogvoet of ringnaad kun je de penzijde en penlengte instellen. De houtkortlijst en de PDF-, Excel- en CSV-uitvoer koppelen penlengte, gatdiepte en zaaghoek aan het juiste uiteinde. Bij een rond kozijn loopt de bovenboog van links naar rechts en de onderboog van rechts naar links.
  - Met Pen-en-gat bekijken in de 3D-viewer schuif je de onderdelen uit elkaar en zie je de schouders, pennen en blinde gaten.
  Installeren
  Voor Windows x64 zijn er twee ondertekende installers. Het bestand dat eindigt op _x64_user-setup.exe installeert voor de huidige gebruiker. Kies _x64-setup.exe voor een installatie als administrator voor alle gebruikers. Voor macOS is er een universele DMG voor Intel en Apple Silicon. Voor Linux zijn een DEB en een AppImage beschikbaar.
  Download of update rechtstreeks via de bestanden onder deze release. De OpenAEC Installer heeft Open Frame Studio op 19 november 2026 uit de catalogus verwijderd. Cataloguswijziging
  Toepassing
  Deze uitgave is bedoeld voor ontwerp en BIM-uitwisselproeven. De gedetailleerde IFC4-export ondersteunt rechthoekige kozijnen met vaste beglazing. Voor producentenoverdracht, CNC-bewerking en normtoetsing gelden de bestaande beperkingen. Releasecontroles
