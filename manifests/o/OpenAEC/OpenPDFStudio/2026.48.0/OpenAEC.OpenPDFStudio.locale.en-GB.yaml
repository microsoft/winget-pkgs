ReleaseNotes: |-
  What's new in Open PDF Studio 2026.48.0
  Windows Explorer
  - Select multiple PDFs and choose Combine here into one PDF to save the merged document beside the source files in natural filename order. If the output name is already taken, a numbered copy is created. Signed documents and import previews require the interactive merge dialog. (#1193)
  - Right-click an image and choose Convert to PDF to save it beside the original and open the result in Open PDF Studio. Conversion errors are now shown, and the menu also recognises JPEG files with the .jpe and .jfif extensions. (#1194)
  Viewing, navigation and performance
  - Improved drawing sharpness at high zoom, cancelled superseded canvas renders, and refreshed cached vector snap points after page rotation. These changes address blurry drawings, blank zoom views and missed snap targets. (#1183)
  - Thumbnails can recover from a timed-out render, and rotating a page no longer relies on the rendering path associated with blank output. (#1186, #1187)
  - Drop PDF files into the thumbnails panel to insert pages. (#1188)
  - Reduced the area redrawn to sharpen continuous views, removed repeated deep copies while dragging annotations, and prevented late render results from replacing the current view. (#1191)
  Snapshots, annotations and shared reviews
  - Choose an ink colour for a region snapshot while keeping the paper background white. (#1092)
  - Saved annotations now carry standard creation and modification timestamps so compatible readers can display the correct dates in pop-ups. (#1189)
  - Shared Review retries temporary file-access conflicts and prevents an earlier session from writing changes into the wrong review folder. (#1115)
  Windows installer verification
  - The Windows release workflow now checks the installed uninstaller with Microsoft Defender when scanning is available. The exact historical uninstaller reported in #1181 has yet to be identified.
  All 25 pull-request checks passed, including the zoom and saved-annotation-date regression tests on Windows, macOS and Linux. The separate Flatpak packaging job failed, so this build has no Flatpak test bundle. See #1195 for the combined changes.
  OpenAEC Linux
  Memory at rest (Linux AppImage, no document open, software rendering): 379 MiB PSS over 7 processes
