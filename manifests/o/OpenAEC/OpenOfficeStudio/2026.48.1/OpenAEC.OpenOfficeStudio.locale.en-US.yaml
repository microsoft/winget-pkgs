ReleaseNotes: |-
  Open Office Studio 2026.48.1
  This release provides Open Office Studio and six separate applications: Writer, Spreadsheet, Presentation, Email, Notition and Database. Each application has its own installer, application identity and profile. Standalone applications are updated with their own installer; installing the Suite is not required.
  Changes
  - Writer preserves DOCVARIABLE fields while measuring uppercase text, tracking and horizontal scale correctly in the tested title layout (#374).
  - Saving an imported XLSB offers XLSX Save As instead of unsupported XLSB overwrite. Cancelling preserves the original XLSB and the unsaved working copy (#377).
  - Linux declares the native confirmation helper and handles a missing helper explicitly (#378).
  - Email supports Ctrl+S on Windows/Linux and Command+S on macOS to save a local composed draft (#379).
  - Earlier integration is retained, including EPUB content preservation, Writer table/input focus, ribbon spacing, readable style labels, Linux Find/Replace history and macOS Writer presentation fixes.
  Packages and verification
  OpenPGP primary fingerprint: 13F6 D414 ADEE 4ED4 CD09 AC60 601D 86C9 3C50 4D29.
  The tested application is commit b696ab86bd1c128729a079b68c0082e6df3d36a5, tree e30879fd772871e690847c061ef66e6b81808a05. Windows/Linux use producer run 45177730188, attempt 1. The macOS packages use a separate successful build-only run 45195055147, attempt 1, workflow head 2af94cdcefa3e88e4980b631d16a88d7d7de5ae8; its original source witness binds the same application checkout. The macOS workflow commit is not the application or release tag target.
  Independent reviews cover the agreed native edit/save/normal-exit/new-process-reopen scenarios for the Suite and separate applications, and both supported browser routes on Windows, Linux and macOS. A successful build or signature is not presented as evidence of native operation. Earlier failed runs and the limits of each accepted scenario remain preserved in the source repository's release evidence.
  Known limitations
  - In one earlier automated macOS Suite save preflight, an edit was visible and the document was dirty, but the requested Command+S did not update the private test file. Six later controlled copies and the regular same-package save/reopen cases succeeded. The original cause remains unknown; an intermittent product-save problem is not excluded. No driver or product fix is claimed for that observation.
  - The page counter issue (#366) remains deferred. The separate UOP rectangle-fill runtime issue (#375), chord rendering (#380), theme-background and footer-date improvements remain outside this candidate.
  - Native and format results are bounded to the documented cases. They do not certify every document variant, font substitution, pagination, embedded object or layout. Font substitutions and excluded source-format fidelity observations remain explicitly recorded.
  - macOS testing uses ARM64 hosts; there is no Intel macOS package claim. Linux native tests use virtual X11/software graphics, and AppImage extraction/AppRun is verified separately from physical FUSE mounting. Some unavailable or clipped ribbon contexts are not certified.
  - Email tests use synthetic local IMAP accounts and drafts. They do not certify delivery to live providers or SMTP sending. Database tests cover the documented synthetic SQLite read/query/export routes, not general Access-file write support.
  Notition notebooks can be transferred with .openaec-notities-back-up. Mail accounts must be configured separately. Historical downloads are not substitutes for these versioned assets.
