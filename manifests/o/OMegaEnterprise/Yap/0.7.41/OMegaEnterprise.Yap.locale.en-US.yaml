ShortDescription: Private voice dictation for Windows. Hold Ctrl + Win, speak, and Yap types your words into any app, with speech recognition on your PC.
Description: |-
  Yap is private voice dictation for Windows. Hold Ctrl + Win, speak, and let go: Yap turns your speech into punctuated text and types it into the app you are using, from email and documents to chat, browsers, terminals and coding agents.
  NVIDIA Parakeet speech recognition runs on your PC, so your audio is not uploaded, and it works offline after a one-time download of the speech model. 25 European languages are detected from each recording.
  Yap is commercial software: 3 free days with a free account (an email address, no card), then a 10-day trial with a card, then a paid subscription. Native x64 and Arm64 builds.
