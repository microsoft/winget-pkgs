ShortDescription: Voice typing app with 12 AI speech models, including 5 fully local options.
Description: LazyTyper is an advanced voice typing app powered by 12 AI speech models, including DouBao Voice, ElevenLabs, Groq Whisper, Mistral, AssemblyAI, plus 5 offline local models that run entirely on the device. It records with a global hotkey, transcribes speech to text in real time, injects text at the cursor position, supports more than 100 languages, integrates with the system tray, and updates automatically.
