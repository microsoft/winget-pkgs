ReleaseNotes: |-
  LazyTyper v1.9.1 (Windows)
  🪟 Windows Release
  - NSIS installer with auto-update support
  - MSI installer for enterprise deployment
  - System tray integration
  ✨ Features
  - Global hotkey (Alt+Tab) for voice recording
  - Real-time speech-to-text via multiple providers
  - Automatic text injection at cursor position
  - Support for 100+ languages
  - Automatic updates (NSIS version)
  - Windows-optimized: Microphone not kept active by default
  📦 Installation Options
  NSIS Installer (Recommended - with auto-update)
  1. Download the .exe installer
  2. Run the installer
  3. Launch LazyTyper from Start Menu
  MSI Package (Enterprise deployment)
  1. Download the .msi package
  2. Run with administrator privileges
  3. Deploy via Group Policy if needed
  🔒 Security
  This Windows build includes signature verification for auto-updates.

