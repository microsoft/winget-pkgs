ShortDescription: Ferramenta gratuita para análise rápida da rede local que encontra dispositivos e mostra detalhes como endereço IP, endereço MAC e fabricante.
Description: O O&O Lanytix verifica a rede local com um clique e lista os dispositivos encontrados com endereço IP, endereço MAC, tempo de resposta, sistema operacional e fabricante da placa de rede. Um histórico mostra quando cada dispositivo foi detectado pela primeira e pela última vez, e alterações como um novo endereço IP são registradas. Assim é fácil identificar dispositivos desconhecidos que talvez não devessem estar na rede. O O&O Lanytix é portátil, não requer instalação e é gratuito.
