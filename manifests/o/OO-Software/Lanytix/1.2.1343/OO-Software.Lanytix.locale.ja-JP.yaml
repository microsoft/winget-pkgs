ShortDescription: LAN内のデバイスをすばやく検出し、IPアドレス、MACアドレス、メーカーなどの詳細を表示する無料のネットワーク分析ツールです。
Description: O&O Lanytixは、ワンクリックでローカル ネットワークをスキャンし、検出したデバイスをIPアドレス、MACアドレス、応答時間、オペレーティング システム、ネットワーク カードのメーカーとともに一覧表示します。履歴には各デバイスを最初と最後に検出した日時が表示され、IPアドレスの変更なども記録されます。これにより、ネットワークに属していない可能性のある不明なデバイスを見つけやすくなります。O&O Lanytixはインストール不要のポータブル ツールで、無料で使用できます。
