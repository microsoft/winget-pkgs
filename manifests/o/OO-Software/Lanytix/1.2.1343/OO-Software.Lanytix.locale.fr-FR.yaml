ShortDescription: Outil gratuit d’analyse rapide du réseau local qui détecte les appareils et affiche des détails comme l’adresse IP, l’adresse MAC et le fabricant.
Description: O&O Lanytix analyse le réseau local d’un simple clic et répertorie les appareils trouvés avec leur adresse IP, leur adresse MAC, leur temps de réponse, leur système d’exploitation et le fabricant de leur carte réseau. Un historique indique quand chaque appareil a été détecté pour la première fois et quand il l’a été pour la dernière fois, et les changements comme une nouvelle adresse IP sont journalisés. Cela aide à repérer les appareils inconnus qui n’ont peut-être pas leur place sur le réseau. O&O Lanytix est portable, ne nécessite aucune installation et est gratuit.
