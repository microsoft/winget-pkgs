ShortDescription: Bezpłatne narzędzie do szybkiej analizy sieci LAN, które wykrywa urządzenia i pokazuje szczegóły, takie jak adres IP, adres MAC i producent.
Description: O&O Lanytix jednym kliknięciem skanuje sieć lokalną i wyświetla znalezione urządzenia wraz z adresem IP, adresem MAC, czasem odpowiedzi, systemem operacyjnym i producentem karty sieciowej. Historia pokazuje, kiedy każde urządzenie zostało wykryte po raz pierwszy, a kiedy po raz ostatni, a zmiany, takie jak nowy adres IP, są rejestrowane. Dzięki temu łatwo zauważyć nieznane urządzenia, które być może nie powinny znajdować się w sieci. O&O Lanytix jest przenośny, nie wymaga instalacji i jest bezpłatny.
