ShortDescription: Herramienta gratuita de análisis rápido de la red local que detecta dispositivos y muestra detalles como la dirección IP, la dirección MAC y el fabricante.
Description: O&O Lanytix analiza la red local con un solo clic y enumera los dispositivos encontrados con su dirección IP, dirección MAC, tiempo de respuesta, sistema operativo y fabricante de la tarjeta de red. Un historial muestra cuándo se detectó cada dispositivo por primera vez y cuándo por última vez, y se registran cambios como una nueva dirección IP. Así se descubren dispositivos desconocidos que quizá no deberían estar en la red. O&O Lanytix es portátil, no requiere instalación y es gratuito.
