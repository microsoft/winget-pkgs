ShortDescription: Free tool for quick network analysis in the LAN that finds devices and shows details such as IP address, MAC address and manufacturer.
Description: O&O Lanytix scans the local network at the touch of a button and lists the devices found with their IP address, MAC address, response time, operating system and network card manufacturer. A history shows when each device was first and last detected, and changes such as a new IP address are logged. This helps to spot unknown devices that may not belong in the network. O&O Lanytix is portable, requires no installation and is free of charge.
