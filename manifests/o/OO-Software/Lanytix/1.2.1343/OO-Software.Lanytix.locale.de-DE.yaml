ShortDescription: Kostenloses Tool für die schnelle Netzwerkanalyse im LAN, das Geräte findet und Details wie IP-Adresse, MAC-Adresse und Hersteller anzeigt.
Description: O&O Lanytix durchsucht das lokale Netzwerk per Knopfdruck und listet die gefundenen Geräte mit IP-Adresse, MAC-Adresse, Antwortzeit, Betriebssystem und Hersteller der Netzwerkkarte auf. Ein Verlauf zeigt, wann ein Gerät erstmals und wann zuletzt erkannt wurde, und Änderungen wie eine neue IP-Adresse werden protokolliert. So fallen unbekannte Geräte auf, die womöglich nicht ins Netzwerk gehören. O&O Lanytix ist portabel, muss nicht installiert werden und ist kostenlos.
