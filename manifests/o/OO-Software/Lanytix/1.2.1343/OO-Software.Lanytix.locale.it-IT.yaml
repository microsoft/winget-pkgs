ShortDescription: Strumento gratuito per l'analisi rapida della rete locale che rileva i dispositivi e mostra dettagli come indirizzo IP, indirizzo MAC e produttore.
Description: O&O Lanytix analizza la rete locale con un clic ed elenca i dispositivi trovati con indirizzo IP, indirizzo MAC, tempo di risposta, sistema operativo e produttore della scheda di rete. Una cronologia mostra quando ogni dispositivo è stato rilevato per la prima volta e quando per l'ultima volta, e le modifiche come un nuovo indirizzo IP vengono registrate. In questo modo si individuano i dispositivi sconosciuti che forse non dovrebbero trovarsi nella rete. O&O Lanytix è portatile, non richiede installazione ed è gratuito.
