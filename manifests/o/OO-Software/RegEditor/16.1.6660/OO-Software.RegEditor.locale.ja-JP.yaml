ShortDescription: ライブ検索、お気に入り、REGファイルのインポートとエクスポートに対応した、無料でポータブルなWindowsレジストリ エディターです。
Description: O&O RegEditorは、レジストリのキーと値の作成、編集、削除に対応し、Windows標準のレジストリ エディターよりも多くの機能を備えています。ライブ検索では入力中に結果が表示され、正規表現や単語単位の検索にも対応し、すべての検索結果をキーのパスとともに一覧表示します。検索結果はREGファイルまたはテキスト ファイルとしてエクスポートできます。すべてのサブキーと値を含むキー全体をコピーして貼り付けることもできます。よく使うパスはお気に入りに保存でき、REGファイルのインポートとエクスポートのほか、レジストリ全体をXML形式でエクスポートすることもできます。インターフェイスはライト テーマとダーク テーマに対応し、高DPI表示もサポートしています。O&O RegEditorは無料のポータブル ツールで、設定を構成ファイルに保存し、32ビット版と64ビット版のWindowsのほか、ARMベースのWindowsデバイスでも動作します。
