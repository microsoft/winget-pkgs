ShortDescription: Free, portable editor for the Windows registry with live search, favorites and import and export of REG files.
Description: O&O RegEditor creates, edits and deletes registry keys and values and offers more functions than the registry editor included in Windows. A live search shows results while typing, also with regular expressions and whole words, and lists all hits with their key paths. Search results can be exported as a REG or text file. Complete keys with all subkeys and values can be copied and pasted. Favorites store frequently used paths. REG files can be imported and exported, and the entire registry can also be exported as XML. The interface offers a light and a dark design and supports high DPI. O&O RegEditor is free and portable, keeps its settings in a configuration file and runs on 32-bit and 64-bit Windows as well as on ARM-based Windows devices.
