ShortDescription: Éditeur gratuit et portable pour le registre Windows avec recherche en direct, favoris et import et export de fichiers REG.
Description: O&O RegEditor crée, modifie et supprime les clés et valeurs du registre et offre plus de fonctions que l’éditeur du registre fourni avec Windows. La recherche en direct affiche les résultats pendant la saisie, y compris avec des expressions régulières et des mots entiers, et liste toutes les occurrences avec leur chemin de clé. Les résultats peuvent être exportés dans un fichier REG ou texte. Des clés complètes avec toutes leurs sous-clés et valeurs peuvent être copiées et collées. Les favoris enregistrent les chemins souvent utilisés. Les fichiers REG peuvent être importés et exportés, et le registre entier peut aussi être exporté au format XML. L’interface propose un thème clair et un thème sombre et prend en charge les écrans haute résolution. O&O RegEditor est gratuit et portable, enregistre ses paramètres dans un fichier de configuration et fonctionne sous Windows 32 bits et 64 bits ainsi que sur les appareils Windows basés sur ARM.
