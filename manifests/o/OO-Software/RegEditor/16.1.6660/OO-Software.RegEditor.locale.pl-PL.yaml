ShortDescription: Bezpłatny, przenośny edytor rejestru Windows z wyszukiwaniem na żywo, ulubionymi oraz importem i eksportem plików REG.
Description: O&O RegEditor tworzy, edytuje i usuwa klucze oraz wartości rejestru i oferuje więcej funkcji niż edytor rejestru wbudowany w Windows. Wyszukiwanie na żywo pokazuje wyniki już podczas pisania, także z wyrażeniami regularnymi i całymi słowami, i wyświetla wszystkie trafienia wraz ze ścieżkami kluczy. Wyniki wyszukiwania można wyeksportować do pliku REG lub tekstowego. Całe klucze ze wszystkimi podkluczami i wartościami można kopiować i wklejać. Ulubione zapisują często używane ścieżki. Pliki REG można importować i eksportować, a cały rejestr można też wyeksportować do formatu XML. Interfejs oferuje jasny i ciemny motyw oraz obsługuje ekrany o wysokim DPI. O&O RegEditor jest bezpłatny i przenośny, zapisuje ustawienia w pliku konfiguracyjnym i działa w 32- i 64-bitowych systemach Windows oraz na urządzeniach z Windows opartych na ARM.
