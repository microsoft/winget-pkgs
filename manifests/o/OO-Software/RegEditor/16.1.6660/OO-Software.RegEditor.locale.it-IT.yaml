ShortDescription: Editor gratuito e portatile per il registro di Windows con ricerca live, preferiti e importazione ed esportazione di file REG.
Description: O&O RegEditor crea, modifica ed elimina chiavi e valori del registro e offre più funzioni dell'editor del registro incluso in Windows. La ricerca live mostra i risultati durante la digitazione, anche con espressioni regolari e parole intere, ed elenca tutte le corrispondenze con il relativo percorso della chiave. I risultati possono essere esportati come file REG o di testo. Chiavi complete con tutte le sottochiavi e i valori possono essere copiate e incollate. I preferiti memorizzano i percorsi usati spesso. I file REG possono essere importati ed esportati, e l'intero registro può essere esportato anche in formato XML. L'interfaccia offre un tema chiaro e uno scuro e supporta i display ad alta risoluzione. O&O RegEditor è gratuito e portatile, salva le impostazioni in un file di configurazione e funziona su Windows a 32 e 64 bit e sui dispositivi Windows basati su ARM.
