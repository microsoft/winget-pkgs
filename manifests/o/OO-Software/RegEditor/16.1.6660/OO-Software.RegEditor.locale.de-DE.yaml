ShortDescription: Kostenloser, portabler Editor für die Windows-Registry mit Live-Suche, Favoriten sowie Import und Export von REG-Dateien.
Description: O&O RegEditor erstellt, bearbeitet und löscht Registry-Schlüssel und -Werte und bietet mehr Funktionen als der in Windows enthaltene Registry-Editor. Die Live-Suche zeigt Treffer schon beim Tippen, auch mit regulären Ausdrücken und ganzen Wörtern, und listet alle Treffer mit ihren Schlüsselpfaden auf. Suchergebnisse lassen sich als REG- oder Textdatei exportieren. Komplette Schlüssel mit allen Unterschlüsseln und Werten lassen sich kopieren und einfügen. Favoriten speichern häufig genutzte Pfade. REG-Dateien lassen sich importieren und exportieren, die gesamte Registry lässt sich zusätzlich als XML exportieren. Die Oberfläche bietet ein helles und ein dunkles Design und unterstützt hochauflösende Bildschirme. O&O RegEditor ist kostenlos und portabel, speichert seine Einstellungen in einer Konfigurationsdatei und läuft auf 32-Bit- und 64-Bit-Windows sowie auf ARM-basierten Windows-Geräten.
