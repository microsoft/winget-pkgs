ShortDescription: Editor gratuito y portátil para el registro de Windows con búsqueda en vivo, favoritos e importación y exportación de archivos REG.
Description: O&O RegEditor crea, edita y elimina claves y valores del registro y ofrece más funciones que el editor del registro incluido en Windows. La búsqueda en vivo muestra resultados mientras se escribe, también con expresiones regulares y palabras completas, y enumera todas las coincidencias con su ruta de clave. Los resultados se pueden exportar como archivo REG o de texto. Se pueden copiar y pegar claves completas con todas sus subclaves y valores. Los favoritos guardan las rutas más usadas. Los archivos REG se pueden importar y exportar, y el registro completo también se puede exportar en XML. La interfaz ofrece un diseño claro y uno oscuro y es compatible con pantallas de alta resolución. O&O RegEditor es gratuito y portátil, guarda sus ajustes en un archivo de configuración y funciona en Windows de 32 y 64 bits, así como en dispositivos Windows basados en ARM.
