ShortDescription: Editor gratuito e portátil para o Registro do Windows, com pesquisa instantânea, favoritos e importação e exportação de arquivos REG.
Description: O O&O RegEditor cria, edita e exclui chaves e valores do Registro e oferece mais funções do que o editor do Registro incluído no Windows. A pesquisa instantânea mostra resultados durante a digitação, também com expressões regulares e palavras inteiras, e lista todas as ocorrências com o caminho da chave. Os resultados podem ser exportados como arquivo REG ou de texto. Chaves completas com todas as subchaves e valores podem ser copiadas e coladas. Os favoritos guardam os caminhos usados com frequência. Arquivos REG podem ser importados e exportados, e o Registro inteiro também pode ser exportado em XML. A interface oferece um tema claro e um escuro e suporta telas de alta resolução. O O&O RegEditor é gratuito e portátil, salva suas configurações em um arquivo de configuração e funciona no Windows de 32 e 64 bits e em dispositivos Windows baseados em ARM.
