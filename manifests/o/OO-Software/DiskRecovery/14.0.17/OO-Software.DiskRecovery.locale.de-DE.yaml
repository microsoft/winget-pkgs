ShortDescription: Stellt gelöschte Dateien von Festplatten, Partitionen und USB-Sticks wieder her, auch nach dem Leeren des Papierkorbs oder dem Formatieren.
Description: O&O DiskRecovery findet und rettet gelöschte Dateien wie Dokumente, Fotos und Videos, zum Beispiel nach dem Leeren des Papierkorbs oder dem Formatieren des falschen Laufwerks. Durchsucht werden Festplatten, Partitionen und USB-Sticks. Drei Suchalgorithmen ergänzen sich, von der schnellen Suche bis zur sektorbasierten Tiefensuche. Über 400 Dateitypen werden erkannt. Gefundene Dateien lassen sich vor der Wiederherstellung in einer Vorschau ansehen, etwa JPG, BMP, TIF, XML und TXT. Zeigt ein Datenträger bereits ernste Probleme, kann eine mit O&O DiskImage erstellte Imagesicherung als Quelle dienen. Die Instant-Installation läuft von einem Wechseldatenträger und vermeidet eine vollständige Installation, die auf dem betroffenen Rechner rettbare Daten überschreiben könnte.
