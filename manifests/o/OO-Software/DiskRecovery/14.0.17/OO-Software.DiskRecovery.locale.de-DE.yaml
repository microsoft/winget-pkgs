Description: O&O DiskRecovery ist ein professionelles Datenwiederherstellungstool, das in der Lage ist, gelöschte oder durch Softwarefehler verlorene Daten wiederherzustellen. Die Software durchsucht Festplatten, Partitionen oder USB-Sticks mit verschiedenen Suchalgorithmen, unterstützt über 400 Dateitypen und ermöglicht eine Vorschau der wiederherstellbaren Daten vor der eigentlichen Wiederherstellung.
