ShortDescription: Recupera arquivos excluídos de discos rígidos, partições e pendrives, mesmo depois de esvaziar a Lixeira ou formatar.
Description: O O&O DiskRecovery encontra e recupera arquivos excluídos, como documentos, fotos e vídeos, por exemplo depois de esvaziar a Lixeira ou formatar a unidade errada. Discos rígidos, partições e pendrives podem ser verificados. Três algoritmos de busca se complementam, da busca rápida à busca profunda setor por setor. Mais de 400 tipos de arquivo são reconhecidos. Os arquivos encontrados podem ser visualizados antes da recuperação, por exemplo JPG, BMP, TIF, XML e TXT. Se um disco já apresenta problemas graves, um backup de imagem criado com o O&O DiskImage pode servir de origem. A instalação instantânea é executada a partir de uma mídia removível e evita uma instalação completa que poderia sobrescrever dados recuperáveis no computador afetado.
