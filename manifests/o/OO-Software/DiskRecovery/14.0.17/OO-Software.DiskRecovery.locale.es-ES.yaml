ShortDescription: Recupera archivos eliminados de discos duros, particiones y memorias USB, incluso después de vaciar la papelera de reciclaje o formatear.
Description: O&O DiskRecovery encuentra y recupera archivos eliminados como documentos, fotos y vídeos, por ejemplo después de vaciar la papelera de reciclaje o formatear la unidad equivocada. Puede analizar discos duros, particiones y memorias USB. Tres algoritmos de búsqueda se complementan, desde la búsqueda rápida hasta la búsqueda profunda por sectores. Reconoce más de 400 tipos de archivo. Los archivos encontrados se pueden previsualizar antes de recuperarlos, por ejemplo JPG, BMP, TIF, XML y TXT. Si un disco ya presenta problemas graves, una copia de seguridad de imagen creada con O&O DiskImage puede servir como origen. La instalación instantánea se ejecuta desde un soporte extraíble y evita una instalación completa que podría sobrescribir datos recuperables en el equipo afectado.
