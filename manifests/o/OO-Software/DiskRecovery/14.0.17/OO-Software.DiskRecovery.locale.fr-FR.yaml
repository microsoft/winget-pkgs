ShortDescription: Récupère les fichiers supprimés sur les disques durs, partitions et clés USB, même après avoir vidé la Corbeille ou formaté.
Description: O&O DiskRecovery retrouve et récupère les fichiers supprimés comme les documents, photos et vidéos, par exemple après avoir vidé la Corbeille ou formaté le mauvais lecteur. Les disques durs, partitions et clés USB peuvent être analysés. Trois algorithmes de recherche se complètent, de la recherche rapide à la recherche approfondie secteur par secteur. Plus de 400 types de fichiers sont reconnus. Les fichiers trouvés peuvent être prévisualisés avant la récupération, par exemple JPG, BMP, TIF, XML et TXT. Si un disque présente déjà de sérieux problèmes, une sauvegarde image créée avec O&O DiskImage peut servir de source. L’installation instantanée s’exécute depuis un support amovible et évite une installation complète qui pourrait écraser des données récupérables sur l’ordinateur concerné.
