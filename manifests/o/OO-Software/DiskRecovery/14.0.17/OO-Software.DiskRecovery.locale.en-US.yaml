ShortDescription: Recovers deleted files from hard drives, partitions and USB sticks, even after emptying the Recycle Bin or formatting.
Description: O&O DiskRecovery finds and recovers deleted files such as documents, photos and videos, for example after emptying the Recycle Bin or formatting the wrong drive. Hard drives, partitions and USB sticks can be searched. Three search algorithms complement each other, from a quick search to a sector-based deep search. Over 400 file types are recognized. Found files can be previewed before recovery, for example JPG, BMP, TIF, XML and TXT. If a drive already shows serious problems, an image backup created with O&O DiskImage can serve as the source. The instant installation runs from a removable drive and avoids a full installation that could overwrite recoverable data on the affected computer.
