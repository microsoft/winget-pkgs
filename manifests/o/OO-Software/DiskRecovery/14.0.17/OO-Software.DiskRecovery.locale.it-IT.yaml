ShortDescription: Recupera i file cancellati da dischi rigidi, partizioni e chiavette USB, anche dopo aver svuotato il Cestino o formattato.
Description: O&O DiskRecovery trova e recupera i file cancellati come documenti, foto e video, ad esempio dopo aver svuotato il Cestino o formattato l'unità sbagliata. È possibile analizzare dischi rigidi, partizioni e chiavette USB. Tre algoritmi di ricerca si completano a vicenda, dalla ricerca rapida alla ricerca approfondita settore per settore. Vengono riconosciuti oltre 400 tipi di file. I file trovati possono essere visualizzati in anteprima prima del recupero, ad esempio JPG, BMP, TIF, XML e TXT. Se un disco presenta già problemi seri, un backup immagine creato con O&O DiskImage può fungere da origine. L'installazione immediata viene eseguita da un supporto rimovibile ed evita un'installazione completa che potrebbe sovrascrivere dati recuperabili sul computer interessato.
