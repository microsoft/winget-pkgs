ShortDescription: Odzyskuje usunięte pliki z dysków twardych, partycji i pamięci USB, także po opróżnieniu Kosza lub formatowaniu.
Description: O&O DiskRecovery wyszukuje i odzyskuje usunięte pliki, takie jak dokumenty, zdjęcia i filmy, na przykład po opróżnieniu Kosza lub sformatowaniu niewłaściwego dysku. Przeszukiwać można dyski twarde, partycje i pamięci USB. Trzy algorytmy wyszukiwania uzupełniają się, od szybkiego wyszukiwania po głębokie wyszukiwanie sektorowe. Rozpoznawanych jest ponad 400 typów plików. Znalezione pliki można obejrzeć w podglądzie przed odzyskaniem, na przykład JPG, BMP, TIF, XML i TXT. Jeśli dysk ma już poważne problemy, źródłem może być kopia obrazu utworzona w O&O DiskImage. Instalacja natychmiastowa działa z nośnika wymiennego i pozwala uniknąć pełnej instalacji, która mogłaby nadpisać dane możliwe do odzyskania na komputerze, którego dotyczy problem.
