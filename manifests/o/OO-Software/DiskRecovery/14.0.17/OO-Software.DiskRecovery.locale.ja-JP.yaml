ShortDescription: ごみ箱を空にした後やフォーマット後でも、ハード ディスク、パーティション、USBメモリから削除したファイルを復元します。
Description: O&O DiskRecoveryは、ごみ箱を空にした後や誤ったドライブをフォーマットした後などに、ドキュメント、写真、動画などの削除したファイルを検索して復元します。ハード ディスク、パーティション、USBメモリを検索できます。高速検索からセクター単位の詳細検索まで、3つの検索アルゴリズムが互いを補います。400種類以上のファイル形式を認識します。見つかったファイルのうち、JPG、BMP、TIF、XML、TXTなどの形式は復元前にプレビューできます。ドライブにすでに深刻な問題がある場合は、O&O DiskImageで作成したイメージ バックアップを復元元として使用できます。インスタント インストールはリムーバブル メディアから実行されるため、復元可能なデータを上書きするおそれのある、対象コンピューターへの完全なインストールを回避できます。
