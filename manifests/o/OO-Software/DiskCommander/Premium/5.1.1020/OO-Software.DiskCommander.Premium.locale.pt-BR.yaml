ShortDescription: Mostra para onde vai o espaço em disco, encontra o que mais ocupa espaço e arquivos duplicados e abre backups do O&O DiskImage para análise sem restaurar.
Description: O O&O DiskCommander mostra em listas e gráficos claros quais arquivos e pastas ocupam quanto espaço, tanto no PC quanto em mídias externas e unidades de rede. A interface se baseia no Explorador de Arquivos do Windows. A busca de duplicatas encontra arquivos redundantes, e o que mais ocupa espaço pode ser movido, copiado ou excluído direto da análise, inclusive em lote entre pastas e unidades. Backups do O&O DiskImage podem ser abertos como uma unidade e verificados sem restauração. Se desejado, a análise é feita sem alterar o conteúdo, os resultados podem ser exportados e importados novamente, e um aviso aparece quando um limite de armazenamento definido é atingido. O O&O DiskCommander é o sucessor do O&O DiskStat e oferece suporte a NTFS e FAT, além de Windows 10, Windows 11 e Windows Server até 2025.
