ShortDescription: Zeigt, wo der Speicherplatz bleibt, findet Speicherfresser und doppelte Dateien und öffnet O&O DiskImage-Sicherungen zur Prüfung ohne Wiederherstellung.
Description: O&O DiskCommander zeigt in übersichtlichen Listen und Diagrammen, welche Dateien und Ordner wie viel Platz belegen, auf dem eigenen PC ebenso wie auf externen Datenträgern und Netzlaufwerken. Die Oberfläche orientiert sich am Windows-Explorer. Die Duplikatsuche spürt überflüssige Dateien auf, und Speicherfresser lassen sich direkt aus der Analyse verschieben, kopieren oder löschen, auch gesammelt über Ordner- und Laufwerksgrenzen hinweg. O&O DiskImage-Sicherungen lassen sich wie ein Laufwerk öffnen und ohne Wiederherstellung prüfen. Analysen laufen auf Wunsch, ohne Inhalte zu verändern, Ergebnisse lassen sich exportieren und später wieder importieren, und beim Erreichen eines festgelegten Speicherschwellenwerts erscheint eine Warnung. O&O DiskCommander ist der Nachfolger von O&O DiskStat und unterstützt NTFS und FAT sowie Windows 10, Windows 11 und Windows Server bis 2025.
