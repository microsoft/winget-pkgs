ShortDescription: Analysiert die Speicherplatznutzung, findet Speicherfresser und doppelte Dateien und prüft O&O DiskImage-Backups, damit Sie gezielt aufräumen können.
Description: O&O DiskCommander ist der Nachfolger der O&O DiskStat-Produktreihe und zeigt Ihnen genau, wo Ihr Speicherplatz bleibt. In anschaulichen Listen und Diagrammen stellt das Programm dar, welche Dateien und Ordner wie viel Platz verbrauchen, und identifiziert Speicherfresser zum sofortigen Bereinigen. Über die Duplikatsuche lassen sich redundante Dateien aufspüren und entfernen. O&O DiskImage-Backups können direkt geöffnet und analysiert werden, ohne sie zuvor wiederherzustellen. Per Stapelverarbeitung verschieben, kopieren oder löschen Sie Dateien über Laufwerksgrenzen hinweg, auf Wunsch mit Protokollierung. Das Programm arbeitet auf dem Heim-PC ebenso wie auf externen Datenträgern oder im Netzwerk und unterstützt die Dateisysteme NTFS und FAT.
