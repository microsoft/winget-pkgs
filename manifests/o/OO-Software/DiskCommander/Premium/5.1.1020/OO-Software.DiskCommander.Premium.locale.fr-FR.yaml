ShortDescription: Montre où passe l’espace disque, trouve les fichiers volumineux et les doublons et ouvre les sauvegardes O&O DiskImage pour les analyser sans restauration.
Description: O&O DiskCommander affiche dans des listes et graphiques clairs quels fichiers et dossiers occupent combien d’espace, sur le PC comme sur les supports externes et les lecteurs réseau. L’interface s’inspire de l’Explorateur Windows. La recherche de doublons repère les fichiers redondants, et les fichiers les plus volumineux peuvent être déplacés, copiés ou supprimés directement depuis l’analyse, y compris par lots au-delà des limites de dossiers et de lecteurs. Les sauvegardes O&O DiskImage s’ouvrent comme un lecteur et se vérifient sans restauration. Si besoin, les analyses s’effectuent sans modifier le contenu, les résultats peuvent être exportés puis réimportés, et un avertissement apparaît lorsqu’un seuil de stockage défini est atteint. O&O DiskCommander succède à O&O DiskStat et prend en charge NTFS et FAT ainsi que Windows 10, Windows 11 et Windows Server jusqu’à 2025.
