ShortDescription: ディスク容量の使い道を表示し、容量を食うファイルや重複ファイルを見つけ、O&O DiskImageのバックアップを復元せずに開いて分析できます。
Description: O&O DiskCommanderは、どのファイルやフォルダーがどれだけの容量を使っているかを、わかりやすい一覧とグラフで表示します。PCだけでなく、外部メディアやネットワーク ドライブにも対応しています。インターフェイスはWindowsエクスプローラーをベースにしています。重複ファイルの検索で不要なファイルを見つけ、容量を食うファイルは分析画面から直接移動、コピー、削除でき、フォルダーやドライブをまたいだ一括処理も可能です。O&O DiskImageのバックアップはドライブのように開き、復元せずに確認できます。必要に応じて内容を変更せずに分析でき、結果はエクスポートして後から再度インポートできます。設定したストレージのしきい値に達すると警告が表示されます。O&O DiskCommanderはO&O DiskStatの後継製品で、NTFSとFAT、Windows 10、Windows 11、Windows Server 2025まで対応しています。
