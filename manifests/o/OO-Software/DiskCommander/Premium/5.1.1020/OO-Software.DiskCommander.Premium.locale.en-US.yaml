ShortDescription: Shows where disk space goes, finds storage hogs and duplicate files and opens O&O DiskImage backups for analysis without restoring them.
Description: O&O DiskCommander shows in clear lists and charts which files and folders take up how much space, on the local PC as well as on external media and network drives. The interface is based on Windows Explorer. A duplicate search tracks down redundant files, and storage hogs can be moved, copied or deleted directly from the analysis, also in batches across folder and drive boundaries. O&O DiskImage backups can be opened like a drive and checked without a restore. If desired, analyses run without changing any content, results can be exported and imported again, and a warning appears when a defined storage threshold is reached. O&O DiskCommander is the successor to O&O DiskStat and supports NTFS and FAT as well as Windows 10, Windows 11 and Windows Server up to 2025.
