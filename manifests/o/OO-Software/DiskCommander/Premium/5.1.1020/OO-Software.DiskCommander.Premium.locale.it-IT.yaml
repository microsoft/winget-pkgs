ShortDescription: Mostra dove finisce lo spazio su disco, trova i file più ingombranti e i duplicati e apre i backup di O&O DiskImage per analizzarli senza ripristinarli.
Description: O&O DiskCommander mostra in elenchi e grafici chiari quali file e cartelle occupano quanto spazio, sia sul PC sia su supporti esterni e unità di rete. L'interfaccia si ispira a Esplora file di Windows. La ricerca dei duplicati individua i file ridondanti, e i file più ingombranti possono essere spostati, copiati o eliminati direttamente dall'analisi, anche in blocco oltre i limiti di cartelle e unità. I backup di O&O DiskImage si aprono come un'unità e si controllano senza ripristino. Su richiesta le analisi vengono eseguite senza modificare il contenuto, i risultati possono essere esportati e reimportati, e viene mostrato un avviso al raggiungimento di una soglia di spazio definita. O&O DiskCommander è il successore di O&O DiskStat e supporta NTFS e FAT, oltre a Windows 10, Windows 11 e Windows Server fino al 2025.
