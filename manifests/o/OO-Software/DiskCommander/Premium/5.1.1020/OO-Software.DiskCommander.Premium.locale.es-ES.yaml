ShortDescription: Muestra en qué se va el espacio en disco, encuentra lo que más ocupa y los archivos duplicados y abre copias de seguridad de O&O DiskImage para analizarlas sin restaurarlas.
Description: O&O DiskCommander muestra en listas y gráficos claros qué archivos y carpetas ocupan cuánto espacio, tanto en el PC como en soportes externos y unidades de red. La interfaz se basa en el Explorador de Windows. La búsqueda de duplicados localiza los archivos redundantes, y lo que más espacio ocupa se puede mover, copiar o eliminar directamente desde el análisis, también por lotes entre carpetas y unidades. Las copias de seguridad de O&O DiskImage se abren como una unidad y se comprueban sin restaurarlas. Si se desea, los análisis se realizan sin modificar el contenido, los resultados se pueden exportar y volver a importar, y aparece un aviso al alcanzar un umbral de almacenamiento definido. O&O DiskCommander es el sucesor de O&O DiskStat y es compatible con NTFS y FAT, así como con Windows 10, Windows 11 y Windows Server hasta 2025.
