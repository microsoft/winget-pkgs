ShortDescription: Pokazuje, gdzie znika miejsce na dysku, znajduje pożeraczy miejsca i duplikaty plików oraz otwiera kopie zapasowe O&O DiskImage do analizy bez przywracania.
Description: O&O DiskCommander pokazuje w przejrzystych listach i wykresach, które pliki i foldery zajmują ile miejsca, zarówno na komputerze, jak i na nośnikach zewnętrznych i dyskach sieciowych. Interfejs wzorowany jest na Eksploratorze plików Windows. Wyszukiwanie duplikatów wykrywa zbędne pliki, a pożeraczy miejsca można przenosić, kopiować lub usuwać bezpośrednio z poziomu analizy, także zbiorczo między folderami i dyskami. Kopie zapasowe O&O DiskImage można otworzyć jak dysk i sprawdzić bez przywracania. Na życzenie analiza odbywa się bez zmiany zawartości, wyniki można eksportować i ponownie importować, a po osiągnięciu określonego progu zajętości pojawia się ostrzeżenie. O&O DiskCommander jest następcą O&O DiskStat i obsługuje systemy plików NTFS i FAT oraz Windows 10, Windows 11 i Windows Server do wersji 2025.
