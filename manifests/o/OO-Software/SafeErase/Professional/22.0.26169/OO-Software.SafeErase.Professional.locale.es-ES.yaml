ShortDescription: Borra de forma segura archivos, unidades, rastros de Internet o todo el PC con métodos reconocidos, sin que los datos puedan recuperarse.
Description: O&O SafeErase Professional elimina de forma permanente archivos, carpetas, unidades o todo el PC, incluidos los rastros del navegador y de Windows, para que los datos no puedan recuperarse. Ofrece seis métodos de borrado, desde los estándares del Departamento de Defensa de EE. UU. (DoD) y de la Oficina Federal de Seguridad de la Información de Alemania (BSI) hasta el método Gutmann. El modo Fortress aísla el PC durante el borrado para que ninguna otra aplicación pueda acceder a los datos. La versión 22 incorpora una interfaz rediseñada con recordatorios opcionales, compatibilidad con más navegadores como Brave, Vivaldi y Opera, y un método basado en NIST y BSI para el espacio libre y las áreas sin particionar. Los certificados de borrado con firma digital según NIST SP 800-88 Rev. 2 documentan las tareas de borrado. Las herramientas de línea de comandos ampliadas y las directivas de administrador facilitan la automatización y la configuración centralizada. Para borrar todo el PC antes de venderlo o desecharlo no se necesita hardware adicional.
