ShortDescription: 認められた消去方式で、ファイル、ドライブ、インターネットの痕跡、PC全体を安全に消去し、データの復元を不可能にします。
Description: O&O SafeErase Professionalは、ファイル、フォルダー、ドライブ、PC全体を、ブラウザーやWindowsの痕跡も含めて完全に削除し、データを復元できないようにします。米国国防総省（DoD）やドイツ連邦情報セキュリティ庁（BSI）の規格からグートマン方式まで、6種類の消去方式を選択できます。要塞モードでは消去中にPCを隔離し、ほかのアプリケーションがデータにアクセスできないようにします。バージョン22では、オプションのリマインダーを備えた一新されたインターフェイス、Brave、Vivaldi、Operaなど対応ブラウザーの拡大、空き領域と未割り当て領域向けのNISTおよびBSIに基づく消去方式が追加されました。NIST SP 800-88 Rev. 2に準拠したデジタル署名付きの消去証明書で、消去タスクを記録できます。拡張されたコマンド ライン ツールと管理者ポリシーにより、自動化と一元的な設定が容易になります。PCを売却または廃棄する前にPC全体を消去する場合も、追加のハードウェアは必要ありません。
