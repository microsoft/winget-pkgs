Description: O&O SafeErase Professional trwale usuwa pliki, foldery, dyski lub cały komputer, łącznie ze śladami przeglądarki i systemu Windows, tak że danych nie da się odzyskać. Dostępnych jest sześć metod usuwania, od standardów Departamentu Obrony USA (DoD) i niemieckiego Federalnego Urzędu Bezpieczeństwa Informacji (BSI) po metodę Gutmanna. Tryb Fortress izoluje komputer na czas usuwania, dzięki czemu żadna inna aplikacja nie ma dostępu do danych. Wersja 22 wprowadza nowy interfejs z opcjonalnymi przypomnieniami, obsługę kolejnych przeglądarek, takich jak Brave, Vivaldi i Opera, oraz metodę opartą na NIST i BSI dla wolnego miejsca i obszarów niepartycjonowanych. Cyfrowo podpisane certyfikaty usunięcia zgodne z NIST SP 800-88 Rev. 2 dokumentują zadania usuwania. Rozbudowane narzędzia wiersza poleceń i zasady administratora ułatwiają automatyzację i centralną konfigurację. Do usunięcia całego komputera przed sprzedażą lub utylizacją nie jest potrzebny dodatkowy sprzęt.
