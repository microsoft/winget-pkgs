ShortDescription: Supprime en toute sécurité fichiers, lecteurs, traces Internet ou le PC entier avec des méthodes reconnues, sans récupération possible des données.
Description: O&O SafeErase Professional supprime définitivement fichiers, dossiers, lecteurs ou le PC entier, y compris les traces du navigateur et de Windows, de sorte que les données ne peuvent plus être récupérées. Six méthodes d’effacement sont disponibles, des normes du département de la Défense des États-Unis (DoD) et de l’Office fédéral allemand de la sécurité des technologies de l’information (BSI) jusqu’à la méthode Gutmann. Le mode Fortress isole le PC pendant l’effacement afin qu’aucune autre application ne puisse accéder aux données. La version 22 apporte une interface repensée avec des rappels optionnels, la prise en charge d’autres navigateurs comme Brave, Vivaldi et Opera, ainsi qu’une méthode basée sur NIST et BSI pour l’espace libre et les zones non partitionnées. Des certificats d’effacement signés numériquement selon NIST SP 800-88 Rev. 2 documentent les effacements. Des outils en ligne de commande étendus et des stratégies d’administrateur facilitent l’automatisation et la configuration centralisée. Aucun matériel supplémentaire n’est nécessaire pour effacer un PC entier avant sa vente ou sa mise au rebut.
