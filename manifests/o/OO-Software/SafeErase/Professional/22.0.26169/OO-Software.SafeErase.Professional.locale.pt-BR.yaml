ShortDescription: Exclui com segurança arquivos, unidades, rastros da internet ou o PC inteiro com métodos reconhecidos, sem que os dados possam ser recuperados.
Description: O O&O SafeErase Professional exclui permanentemente arquivos, pastas, unidades ou o PC inteiro, incluindo rastros do navegador e do Windows, para que os dados não possam ser recuperados. Seis métodos de exclusão estão disponíveis, dos padrões do Departamento de Defesa dos EUA (DoD) e do Departamento Federal de Segurança da Informação da Alemanha (BSI) até o método Gutmann. O Modo Fortaleza isola o PC durante a exclusão para que nenhum outro aplicativo possa acessar os dados. A versão 22 traz uma interface redesenhada com lembretes opcionais, suporte a mais navegadores como Brave, Vivaldi e Opera e um método baseado em NIST e BSI para espaço livre e áreas não particionadas. Certificados de exclusão com assinatura digital conforme a NIST SP 800-88 Rev. 2 documentam as tarefas de exclusão. Ferramentas de linha de comando ampliadas e políticas de administrador facilitam a automação e a configuração centralizada. Para apagar o PC inteiro antes de vendê-lo ou descartá-lo, nenhum hardware adicional é necessário.
