ShortDescription: Cancella in modo sicuro file, unità, tracce di navigazione o l'intero PC con metodi riconosciuti, così che i dati non siano più recuperabili.
Description: O&O SafeErase Professional elimina in modo permanente file, cartelle, unità o l'intero PC, comprese le tracce del browser e di Windows, così che i dati non possano più essere recuperati. Sono disponibili sei metodi di cancellazione, dagli standard del Dipartimento della Difesa degli Stati Uniti (DoD) e dell'Ufficio federale tedesco per la sicurezza informatica (BSI) fino al metodo Gutmann. La modalità Fortress isola il PC durante la cancellazione, in modo che nessun'altra applicazione possa accedere ai dati. La versione 22 introduce un'interfaccia rinnovata con promemoria opzionali, il supporto per altri browser come Brave, Vivaldi e Opera e un metodo basato su NIST e BSI per lo spazio libero e le aree non partizionate. Certificati di cancellazione con firma digitale secondo NIST SP 800-88 Rev. 2 documentano le cancellazioni. Strumenti a riga di comando ampliati e criteri di amministrazione facilitano l'automazione e la configurazione centralizzata. Per cancellare l'intero PC prima di venderlo o smaltirlo non serve hardware aggiuntivo.
