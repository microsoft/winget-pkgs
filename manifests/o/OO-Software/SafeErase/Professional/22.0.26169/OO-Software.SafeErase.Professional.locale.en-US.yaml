ShortDescription: Securely deletes files, drives, internet traces or the entire PC with recognized methods, so that the data cannot be recovered.
Description: O&O SafeErase Professional permanently deletes files, folders, drives or the entire PC, including browser and Windows traces, so that the data cannot be recovered. Six deletion methods are available, from the standards of the U.S. Department of Defense (DoD) and the German Federal Office for Information Security (BSI) to the Gutmann method. Fortress Mode seals the PC during deletion so that no other application can access the data. Version 22 brings a redesigned interface with optional reminders, support for more browsers including Brave, Vivaldi and Opera, and a NIST/BSI-based method for free space and unpartitioned areas. Digitally signed erasure certificates according to NIST SP 800-88 Rev. 2 document the deletion tasks. Expanded command-line tools and administrator policies help with automation and central configuration. Erasing an entire PC before selling or disposing of it requires no additional hardware.
