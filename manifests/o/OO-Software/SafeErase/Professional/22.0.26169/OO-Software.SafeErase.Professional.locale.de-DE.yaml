ShortDescription: Löscht Dateien, Laufwerke, Internetspuren oder den gesamten PC sicher mit anerkannten Methoden, sodass sich die Daten nicht wiederherstellen lassen.
Description: O&O SafeErase Professional löscht Dateien, Ordner, Laufwerke oder den gesamten PC samt Browser- und Windows-Spuren dauerhaft, sodass sich die Daten nicht wiederherstellen lassen. Zur Wahl stehen sechs Löschmethoden, von den Standards des U.S. Department of Defense (DoD) und des Bundesamts für Sicherheit in der Informationstechnik (BSI) bis zur Gutmann-Methode. Der Festungsmodus schottet den PC während des Löschens ab, sodass keine andere Anwendung auf die Daten zugreifen kann. Version 22 bringt eine überarbeitete Oberfläche mit optionalen Erinnerungen, die Unterstützung weiterer Browser wie Brave, Vivaldi und Opera sowie eine Löschmethode nach NIST und BSI für freien Speicherplatz und nicht partitionierte Bereiche. Digital signierte Löschnachweise nach NIST SP 800-88 Rev. 2 dokumentieren die Löschvorgänge. Erweiterte Befehlszeilenfunktionen und Administratorrichtlinien helfen beim Automatisieren und bei der zentralen Konfiguration. Zum Löschen des gesamten PCs vor Verkauf oder Entsorgung ist keine zusätzliche Hardware nötig.
