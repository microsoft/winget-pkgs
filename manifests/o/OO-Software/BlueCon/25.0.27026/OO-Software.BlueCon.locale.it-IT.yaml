ShortDescription: Ambiente di recupero per amministratori IT che consente di diagnosticare, riparare e gestire PC e server Windows che non si avviano più.
Description: O&O BlueCon si avvia da un'unità USB, da un'immagine ISO o dal menu di avvio di Windows, indipendentemente dal Windows installato. In questo modo PC e server guasti possono essere diagnosticati, riparati e gestiti anche quando Windows non si avvia più. La versione 25 introduce un desktop riprogettato con menu Start e barra delle applicazioni, oltre a strumenti aggiornati. O&O CheckAndRepair ripara i file di sistema, l'archivio componenti e gli errori del file system. O&O UpdateManager rimuove gli aggiornamenti di Windows problematici, O&O DriverManager e O&O ServiceManager disattivano driver e servizi difettosi, O&O RegEditor modifica il registro e O&O EventViewer mostra i registri eventi. Le password locali possono essere reimpostate e le unità BitLocker sbloccate con la chiave di ripristino. A seconda dell'edizione e della licenza, O&O DiskImage, O&O DiskRecovery e O&O SafeErase completano il set di strumenti. Le edizioni Technician ed Enterprise si avviano inoltre in rete tramite PXE.
