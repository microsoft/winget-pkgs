ShortDescription: Ambiente de recuperação para administradores de TI diagnosticarem, repararem e gerenciarem PCs e servidores Windows que não iniciam mais.
Description: O O&O BlueCon inicia de forma independente do Windows instalado, a partir de uma unidade USB, de uma imagem ISO ou do menu de inicialização do Windows. Assim, PCs e servidores com falha podem ser diagnosticados, reparados e gerenciados mesmo quando o Windows não inicia mais. A versão 25 traz uma área de trabalho redesenhada com menu Iniciar e barra de tarefas, além de ferramentas atualizadas. O O&O CheckAndRepair repara arquivos do sistema, o repositório de componentes e erros do sistema de arquivos. O O&O UpdateManager remove atualizações problemáticas do Windows, o O&O DriverManager e o O&O ServiceManager desativam drivers e serviços com defeito, o O&O RegEditor edita o Registro e o O&O EventViewer exibe os logs de eventos. Senhas locais podem ser redefinidas e unidades BitLocker desbloqueadas com a chave de recuperação. Dependendo da edição e da licença, o O&O DiskImage, o O&O DiskRecovery e o O&O SafeErase complementam o conjunto de ferramentas. As edições Technician e Enterprise também inicializam pela rede via PXE.
