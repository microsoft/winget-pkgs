ShortDescription: Environnement de secours permettant aux administrateurs informatiques de diagnostiquer, réparer et gérer les PC et serveurs Windows qui ne démarrent plus.
Description: O&O BlueCon démarre depuis une clé USB, une image ISO ou le menu de démarrage de Windows, indépendamment du Windows installé. Les PC et serveurs en panne peuvent ainsi être diagnostiqués, réparés et gérés même lorsque Windows ne démarre plus. La version 25 apporte un bureau repensé avec menu Démarrer et barre des tâches ainsi que des outils mis à jour. O&O CheckAndRepair répare les fichiers système, le magasin de composants et les erreurs du système de fichiers. O&O UpdateManager supprime les mises à jour Windows problématiques, O&O DriverManager et O&O ServiceManager désactivent les pilotes et services défaillants, O&O RegEditor modifie le registre et O&O EventViewer affiche les journaux d’événements. Les mots de passe locaux peuvent être réinitialisés et les lecteurs BitLocker déverrouillés avec la clé de récupération. Selon l’édition et la licence, O&O DiskImage, O&O DiskRecovery et O&O SafeErase complètent la boîte à outils. Les éditions Technician et Enterprise démarrent en outre via le réseau par PXE.
