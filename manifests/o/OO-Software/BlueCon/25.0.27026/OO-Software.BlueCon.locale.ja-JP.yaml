ShortDescription: 起動しなくなったWindows PCやサーバーを、IT管理者が診断、修復、管理するための回復環境です。
Description: O&O BlueConは、インストールされているWindowsとは無関係に、USBドライブ、ISOイメージ、Windowsのブート メニューから起動します。そのため、Windowsが起動しなくなったPCやサーバーでも診断、修復、管理が可能です。バージョン25では、スタート メニューとタスク バーを備えた新しいデスクトップと、刷新されたツールが導入されました。O&O CheckAndRepairはシステム ファイル、コンポーネント ストア、ファイル システムのエラーを修復します。O&O UpdateManagerは問題のあるWindowsアップデートを削除し、O&O DriverManagerとO&O ServiceManagerは不具合のあるドライバーやサービスを無効にします。O&O RegEditorでレジストリを編集し、O&O EventViewerでイベント ログを確認できます。ローカル パスワードのリセットや、回復キーを使ったBitLockerドライブのロック解除も可能です。エディションとライセンスに応じて、O&O DiskImage、O&O DiskRecovery、O&O SafeEraseがツールセットを補完します。TechnicianエディションとEnterpriseエディションは、PXEによるネットワーク ブートにも対応しています。
