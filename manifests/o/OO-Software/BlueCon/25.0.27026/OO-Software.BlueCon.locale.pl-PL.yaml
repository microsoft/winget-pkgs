ShortDescription: Środowisko odzyskiwania dla administratorów IT do diagnozowania i naprawy komputerów oraz serwerów z Windows, które już się nie uruchamiają, a także do zarządzania nimi.
Description: O&O BlueCon uruchamia się z dysku USB, obrazu ISO lub menu rozruchowego Windows, niezależnie od zainstalowanego systemu Windows. Dzięki temu uszkodzone komputery i serwery można diagnozować, naprawiać i zarządzać nimi nawet wtedy, gdy Windows już się nie uruchamia. Wersja 25 wprowadza nowy pulpit z menu Start i paskiem zadań oraz zaktualizowane narzędzia. O&O CheckAndRepair naprawia pliki systemowe, magazyn składników i błędy systemu plików. O&O UpdateManager usuwa problematyczne aktualizacje Windows, O&O DriverManager i O&O ServiceManager wyłączają wadliwe sterowniki i usługi, O&O RegEditor edytuje rejestr, a O&O EventViewer wyświetla dzienniki zdarzeń. Hasła lokalne można zresetować, a dyski BitLocker odblokować kluczem odzyskiwania. W zależności od edycji i licencji zestaw narzędzi uzupełniają O&O DiskImage, O&O DiskRecovery i O&O SafeErase. Edycje Technician i Enterprise uruchamiają się dodatkowo przez sieć za pomocą PXE.
