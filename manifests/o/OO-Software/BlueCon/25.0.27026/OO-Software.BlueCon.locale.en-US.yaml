ShortDescription: Recovery environment for IT administrators to diagnose, repair and manage Windows PCs and servers that no longer start.
Description: O&O BlueCon starts independently of the installed Windows from a USB drive, an ISO image or the Windows boot menu, so failed PCs and servers can be diagnosed, repaired and managed even when Windows no longer starts. Version 25 brings a redesigned desktop with Start menu and taskbar as well as updated tools. O&O CheckAndRepair repairs system files, the component store and file system errors. O&O UpdateManager removes problematic Windows updates, O&O DriverManager and O&O ServiceManager disable faulty drivers and services, O&O RegEditor edits the registry and O&O EventViewer shows the event logs. Local passwords can be reset and BitLocker drives unlocked with the recovery key. Depending on edition and license, O&O DiskImage, O&O DiskRecovery and O&O SafeErase complement the toolkit. The Technician and Enterprise editions also boot over the network via PXE.
