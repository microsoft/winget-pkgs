ShortDescription: Rettungsumgebung für IT-Administratoren, um Windows-PCs und Server, die nicht mehr starten, zu untersuchen, zu reparieren und zu verwalten.
Description: O&O BlueCon startet unabhängig vom installierten Windows von einem USB-Laufwerk, einem ISO-Abbild oder aus dem Windows-Bootmenü. So lassen sich ausgefallene PCs und Server untersuchen, reparieren und verwalten, auch wenn Windows nicht mehr startet. Version 25 bringt einen neu gestalteten Desktop mit Startmenü und Taskleiste sowie überarbeitete Werkzeuge. O&O CheckAndRepair repariert Systemdateien, den Komponentenspeicher und Dateisystemfehler. O&O UpdateManager entfernt problematische Windows-Updates, O&O DriverManager und O&O ServiceManager deaktivieren fehlerhafte Treiber und Dienste, O&O RegEditor bearbeitet die Registry und O&O EventViewer zeigt die Ereignisprotokolle. Lokale Kennwörter lassen sich zurücksetzen und BitLocker-Laufwerke mit dem Wiederherstellungsschlüssel entsperren. Je nach Edition und Lizenz ergänzen O&O DiskImage, O&O DiskRecovery und O&O SafeErase den Werkzeugkasten. Die Editionen Technician und Enterprise starten zusätzlich per PXE über das Netzwerk.
