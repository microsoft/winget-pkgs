ShortDescription: Entorno de recuperación para administradores de TI que permite diagnosticar, reparar y gestionar PC y servidores Windows que ya no se inician.
Description: O&O BlueCon se inicia desde una unidad USB, una imagen ISO o el menú de arranque de Windows, de forma independiente del Windows instalado. Así se pueden diagnosticar, reparar y gestionar PC y servidores averiados incluso cuando Windows ya no se inicia. La versión 25 incorpora un escritorio rediseñado con menú Inicio y barra de tareas, además de herramientas actualizadas. O&O CheckAndRepair repara archivos del sistema, el almacén de componentes y errores del sistema de archivos. O&O UpdateManager elimina actualizaciones de Windows problemáticas, O&O DriverManager y O&O ServiceManager desactivan controladores y servicios defectuosos, O&O RegEditor edita el registro y O&O EventViewer muestra los registros de eventos. Las contraseñas locales se pueden restablecer y las unidades BitLocker se pueden desbloquear con la clave de recuperación. Según la edición y la licencia, O&O DiskImage, O&O DiskRecovery y O&O SafeErase completan el conjunto de herramientas. Las ediciones Technician y Enterprise también arrancan a través de la red mediante PXE.
