ShortDescription: Strumento gratuito che rimuove bloatware, app preinstallate e programmi indesiderati da Windows 11 e 10 e, se necessario, può reinstallare le app rimosse.
Description: O&O AppBuster mostra le app dello Store e i programmi desktop in un unico elenco, comprese le app nascoste, e rimuove quelle non necessarie, a scelta per l'utente corrente, per tutti gli utenti o per l'intero PC. Le app rimosse per errore possono essere reinstallate. Il programma consiglia le app da rimuovere indicando il motivo per ciascuna, riconosce il software aggiuntivo e la telemetria di HP, Dell, Lenovo, ASUS, Acer e MSI e ripulisce le app orfane e difettose. Gli aggiornamenti dei programmi desktop vengono cercati tramite winget e installati su richiesta. La pubblicità nel menu Start e la schermata di benvenuto di Windows possono essere bloccate. Prima delle modifiche è possibile creare un punto di ripristino. L'interfaccia in stile Windows 11 offre diverse visualizzazioni, una modalità scura e modalità a contrasto elevato e supporta le utilità di lettura dello schermo. O&O AppBuster è gratuito, portatile, disponibile in 17 lingue e funziona con Windows 10 e 11 su PC x64 e ARM64.
