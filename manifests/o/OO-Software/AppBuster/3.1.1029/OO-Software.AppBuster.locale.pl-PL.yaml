ShortDescription: Bezpłatne narzędzie, które usuwa bloatware, preinstalowane aplikacje i niechciane programy z Windows 11 i 10, a w razie potrzeby może ponownie zainstalować usunięte aplikacje.
Description: O&O AppBuster pokazuje aplikacje ze Sklepu Microsoft i programy klasyczne na jednej liście, także ukryte aplikacje, i usuwa niepotrzebne, zależnie od wyboru dla bieżącego użytkownika, wszystkich użytkowników lub całego komputera. Aplikacje usunięte przez pomyłkę można ponownie zainstalować. Program wskazuje aplikacje zalecane do usunięcia i podaje powód dla każdej z nich, rozpoznaje dodatki i telemetrię producentów HP, Dell, Lenovo, ASUS, Acer i MSI oraz usuwa osierocone i uszkodzone aplikacje. Aktualizacje programów klasycznych są wyszukiwane przez winget i instalowane na życzenie. Reklamy w menu Start i ekran powitalny Windows można zablokować. Przed zmianami można utworzyć punkt przywracania. Interfejs w stylu Windows 11 oferuje kilka widoków, tryb ciemny i tryby dużego kontrastu oraz obsługuje czytniki ekranu. O&O AppBuster jest bezpłatny, przenośny, dostępny w 17 językach i działa w Windows 10 i 11 na komputerach x64 i ARM64.
