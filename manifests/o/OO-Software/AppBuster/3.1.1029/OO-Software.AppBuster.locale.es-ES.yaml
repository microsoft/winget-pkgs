ShortDescription: Herramienta gratuita que elimina bloatware, aplicaciones preinstaladas y programas no deseados de Windows 11 y 10, y puede reinstalar las aplicaciones eliminadas si es necesario.
Description: O&O AppBuster muestra las aplicaciones de la Store y los programas de escritorio en una sola lista, incluidas las aplicaciones ocultas, y elimina las que no se necesitan, a elegir para el usuario actual, para todos los usuarios o para todo el PC. Las aplicaciones eliminadas por error se pueden volver a instalar. El programa recomienda aplicaciones para eliminar e indica el motivo de cada una, reconoce el software adicional y la telemetría de HP, Dell, Lenovo, ASUS, Acer y MSI y limpia aplicaciones huérfanas y defectuosas. Las actualizaciones de los programas de escritorio se buscan mediante winget y se instalan a petición. Se pueden bloquear los anuncios del menú Inicio y la pantalla de bienvenida de Windows. Antes de hacer cambios se puede crear un punto de restauración. La interfaz al estilo de Windows 11 ofrece varias vistas, un modo oscuro y modos de alto contraste, y es compatible con lectores de pantalla. O&O AppBuster es gratuito, portátil, está disponible en 17 idiomas y funciona en Windows 10 y 11 en PC x64 y ARM64.
