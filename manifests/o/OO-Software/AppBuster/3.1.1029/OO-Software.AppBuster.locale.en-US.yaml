ShortDescription: Free tool that removes bloatware, pre-installed apps and unwanted programs from Windows 11 and 10 and can reinstall removed apps if needed.
Description: O&O AppBuster shows Store apps and desktop programs in one list, including hidden apps, and removes unneeded ones, either for the current user, for all users or for the entire PC. Apps removed by mistake can be installed again. The program recommends apps for removal and gives a reason for each, recognizes extras and telemetry from HP, Dell, Lenovo, ASUS, Acer and MSI and cleans up orphaned and defective apps. Updates for desktop programs are found via winget and installed on request. Start menu ads and the Windows welcome screen can be blocked. A restore point can be created before changes. The Windows 11-style interface offers several views, a dark mode and high-contrast modes and supports screen readers. O&O AppBuster is free, portable, available in 17 languages and runs on Windows 10 and 11 on x64 and ARM64 PCs.
