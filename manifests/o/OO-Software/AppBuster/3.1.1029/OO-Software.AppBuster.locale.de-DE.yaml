ShortDescription: Kostenloses Tool, das Bloatware, vorinstallierte Apps und unerwünschte Programme aus Windows 11 und 10 entfernt und entfernte Apps bei Bedarf wieder installieren kann.
Description: O&O AppBuster zeigt Store-Apps und Desktop-Programme in einer Liste, auch versteckte Apps, und entfernt nicht benötigte wahlweise für den aktuellen Nutzer, alle Nutzer oder den gesamten PC. Versehentlich entfernte Apps lassen sich wieder installieren. Das Programm empfiehlt Apps zum Entfernen und nennt zu jeder den Grund, erkennt Zusatzsoftware und Telemetrie von HP, Dell, Lenovo, ASUS, Acer und MSI und räumt verwaiste und defekte Apps auf. Updates für Desktop-Programme sucht O&O AppBuster über winget und installiert sie auf Wunsch. Werbung im Startmenü und der Windows-Willkommensbildschirm lassen sich blockieren. Vor Änderungen kann ein Wiederherstellungspunkt erstellt werden. Die Oberfläche im Stil von Windows 11 bietet mehrere Ansichten, eine dunkle Darstellung und Darstellungen mit hohem Kontrast und unterstützt Bildschirmleseprogramme. O&O AppBuster ist kostenlos, portabel, in 17 Sprachen verfügbar und läuft unter Windows 10 und 11 auf x64- und ARM64-PCs.
