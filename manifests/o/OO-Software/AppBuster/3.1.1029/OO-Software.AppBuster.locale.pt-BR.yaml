ShortDescription: Ferramenta gratuita que remove bloatware, aplicativos pré-instalados e programas indesejados do Windows 11 e 10 e pode reinstalar os aplicativos removidos se necessário.
Description: O O&O AppBuster mostra aplicativos da Store e programas de desktop em uma única lista, incluindo aplicativos ocultos, e remove os que não são necessários, à escolha para o usuário atual, para todos os usuários ou para o PC inteiro. Aplicativos removidos por engano podem ser instalados novamente. O programa recomenda aplicativos para remoção e indica o motivo de cada um, reconhece extras e telemetria da HP, Dell, Lenovo, ASUS, Acer e MSI e limpa aplicativos órfãos e com defeito. Atualizações de programas de desktop são encontradas via winget e instaladas quando solicitado. Anúncios do menu Iniciar e a tela de boas-vindas do Windows podem ser bloqueados. Antes de fazer alterações, é possível criar um ponto de restauração. A interface no estilo do Windows 11 oferece várias visualizações, um modo escuro e modos de alto contraste, e é compatível com leitores de tela. O O&O AppBuster é gratuito, portátil, está disponível em 17 idiomas e funciona no Windows 10 e 11 em PCs x64 e ARM64.
