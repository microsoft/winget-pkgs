ShortDescription: Windows 11および10から、ブロートウェア、プリインストール アプリ、不要なプログラムを削除できる無料ツールです。削除したアプリは必要に応じて再インストールできます。
Description: O&O AppBusterは、非表示のアプリも含め、ストア アプリとデスクトップ プログラムを1つの一覧に表示し、不要なものを現在のユーザー、すべてのユーザー、PC全体から削除します。誤って削除したアプリは再インストールできます。削除を推奨するアプリをそれぞれの理由とともに表示し、HP、Dell、Lenovo、ASUS、Acer、MSIの付属ソフトやテレメトリを認識し、孤立したアプリや破損したアプリをクリーンアップします。デスクトップ プログラムのアップデートはwingetで検索し、必要に応じてインストールできます。スタート メニューの広告とWindowsのウェルカム画面をブロックすることもできます。変更前に復元ポイントを作成できます。Windows 11スタイルのインターフェイスは、複数のビュー、ダーク モード、ハイ コントラスト モードを備え、スクリーン リーダーにも対応しています。O&O AppBusterは無料のポータブル ツールで、17言語に対応し、x64およびARM64搭載PCのWindows 10と11で動作します。
