ShortDescription: Outil gratuit qui supprime le bloatware, les applications préinstallées et les programmes indésirables de Windows 11 et 10, et peut réinstaller au besoin les applications supprimées.
Description: O&O AppBuster affiche les applications du Store et les programmes de bureau dans une seule liste, y compris les applications masquées, et supprime celles qui sont inutiles, au choix pour l’utilisateur actuel, pour tous les utilisateurs ou pour tout le PC. Les applications supprimées par erreur peuvent être réinstallées. Le programme recommande des applications à supprimer en indiquant la raison pour chacune, reconnaît les logiciels supplémentaires et la télémétrie de HP, Dell, Lenovo, ASUS, Acer et MSI et nettoie les applications orphelines et défectueuses. Les mises à jour des programmes de bureau sont recherchées via winget et installées sur demande. Les publicités du menu Démarrer et l’écran d’accueil de Windows peuvent être bloqués. Un point de restauration peut être créé avant toute modification. L’interface dans le style de Windows 11 propose plusieurs affichages, un mode sombre et des modes à contraste élevé, et prend en charge les lecteurs d’écran. O&O AppBuster est gratuit, portable, disponible en 17 langues et fonctionne sous Windows 10 et 11 sur les PC x64 et ARM64.
