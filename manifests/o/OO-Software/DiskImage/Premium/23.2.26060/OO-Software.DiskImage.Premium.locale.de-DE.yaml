ShortDescription: Sichert ganze PCs, Laufwerke oder einzelne Dateien und stellt sie mit wenigen Klicks wieder her, auch wenn Windows nicht mehr startet.
Description: O&O DiskImage Premium sichert den gesamten Rechner, einzelne Laufwerke und Partitionen oder ausgewählte Dateien und Ordner. Laufwerke lassen sich auch auf ein Ersatzlaufwerk klonen. Version 23 bringt eine geführte Oberfläche, die Sicherungsverlauf und Schutzstatus auf einen Blick zeigt, ein zusätzliches Sicherungsziel in der Cloud, etwa S3-kompatiblen Speicher, und automatische Sicherungsketten mit frei wählbaren Abständen. Im Notfall wird das System von einem Bootmedium wiederhergestellt, auch auf anderer Hardware. Die Wiederherstellungsumgebung, früher Festungsmodus genannt, führt Sicherungen ohne Einfluss anderer Anwendungen aus und ermöglicht forensische Sicherungen. Inkrementelle und differenzielle Sicherungen virtueller VHD- und VHDX-Laufwerke lassen sich erstellen, zusammenführen und als Laufwerk einbinden. SSDs, GPT-Datenträger und UEFI-Systeme werden unterstützt.
