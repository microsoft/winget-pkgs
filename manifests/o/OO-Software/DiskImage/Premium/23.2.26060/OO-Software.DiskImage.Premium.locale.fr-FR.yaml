ShortDescription: Sauvegarde le PC entier, des lecteurs ou des fichiers et les restaure en quelques clics, même si Windows ne démarre plus.
Description: O&O DiskImage Premium sauvegarde l’ordinateur entier, des lecteurs et partitions ou des fichiers et dossiers sélectionnés. Les lecteurs peuvent aussi être clonés sur un disque de secours. La version 23 apporte une interface guidée qui affiche d’un coup d’œil l’historique des sauvegardes et l’état de protection, une destination de sauvegarde supplémentaire dans le cloud comme un stockage compatible S3, ainsi que des chaînes de sauvegarde automatiques avec des intervalles définis librement. En cas d’urgence, le système est restauré depuis un support de démarrage, même sur un matériel différent. L’environnement de récupération, anciennement appelé mode Forteresse, exécute les sauvegardes sans interférence avec les autres applications et permet des sauvegardes forensiques. Des sauvegardes incrémentielles et différentielles de disques virtuels VHD et VHDX peuvent être créées, fusionnées et montées comme lecteurs. Les SSD, disques GPT et systèmes UEFI sont pris en charge.
