ShortDescription: PC全体、ドライブ、個々のファイルをバックアップし、Windowsが起動しなくなっても数回のクリックで復元できます。
Description: O&O DiskImage Premiumは、コンピューター全体、個々のドライブやパーティション、選択したファイルやフォルダーをバックアップします。ドライブを予備のドライブにクローンすることもできます。バージョン23では、バックアップ履歴と保護状態をひと目で確認できるガイド付きインターフェイス、S3互換ストレージなどクラウド上の追加バックアップ先、間隔を自由に設定できる自動バックアップ チェーンが導入されました。緊急時には、起動メディアからシステムを復元でき、異なるハードウェアへの復元も可能です。回復環境（旧Fortress Mode）では、ほかのアプリケーションの影響を受けずにバックアップを実行でき、フォレンジック バックアップも作成できます。仮想ドライブVHDおよびVHDXの増分バックアップと差分バックアップを作成、統合し、ドライブとしてマウントできます。SSD、GPTディスク、UEFIシステムにも対応しています。
