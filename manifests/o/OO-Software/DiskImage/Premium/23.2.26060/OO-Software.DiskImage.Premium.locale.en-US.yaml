ShortDescription: Backs up entire PCs, drives or individual files and restores them in a few clicks, even if Windows no longer starts.
Description: O&O DiskImage Premium backs up the entire computer, individual drives and partitions or selected files and folders. Drives can also be cloned to a spare drive. Version 23 brings a guided interface that shows the backup history and protection status at a glance, an additional backup destination in the cloud such as S3-compatible storage, and automatic backup chains with individually defined intervals. In an emergency, the system is restored from a bootable medium, even to different hardware. The recovery environment, formerly called Fortress Mode, runs backups without interference from other applications and enables forensic backups. Incremental and differential backups of virtual VHD and VHDX drives can be created, merged and mounted as drives. SSDs, GPT disks and UEFI systems are supported.
