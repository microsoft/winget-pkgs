ShortDescription: Faz backup do PC inteiro, de unidades ou de arquivos e os restaura em poucos cliques, mesmo que o Windows não inicie mais.
Description: O O&O DiskImage Premium faz backup do computador inteiro, de unidades e partições ou de arquivos e pastas selecionados. As unidades também podem ser clonadas para uma unidade reserva. A versão 23 traz uma interface guiada que mostra num só olhar o histórico de backups e o status de proteção, um destino de backup adicional na nuvem, como armazenamento compatível com S3, e cadeias de backup automáticas com intervalos definidos livremente. Em caso de emergência, o sistema é restaurado a partir de uma mídia inicializável, inclusive em hardware diferente. O Ambiente de Recuperação, antes chamado Modo Fortaleza, executa os backups sem interferência de outros aplicativos e permite backups forenses. Backups incrementais e diferenciais de unidades virtuais VHD e VHDX podem ser criados, mesclados e montados como unidades. SSDs, discos GPT e sistemas UEFI são compatíveis.
