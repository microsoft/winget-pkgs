ShortDescription: Tworzy kopie zapasowe całego komputera, dysków lub pojedynczych plików i przywraca je kilkoma kliknięciami, nawet gdy Windows już się nie uruchamia.
Description: O&O DiskImage Premium tworzy kopie zapasowe całego komputera, pojedynczych dysków i partycji lub wybranych plików i folderów. Dyski można też sklonować na dysk zapasowy. Wersja 23 wprowadza interfejs z przewodnikiem, który na pierwszy rzut oka pokazuje historię kopii i stan ochrony, dodatkowe miejsce docelowe kopii w chmurze, na przykład magazyn zgodny z S3, oraz automatyczne łańcuchy kopii zapasowych z dowolnie ustalanymi odstępami. W razie awarii system można przywrócić z nośnika rozruchowego, także na innym sprzęcie. Środowisko odzyskiwania, wcześniej nazywane trybem Twierdzy, wykonuje kopie bez wpływu innych aplikacji i umożliwia tworzenie kopii zapasowych do celów informatyki śledczej. Przyrostowe i różnicowe kopie dysków wirtualnych VHD i VHDX można tworzyć, scalać i montować jako dyski. Obsługiwane są dyski SSD, dyski GPT i systemy UEFI.
