ShortDescription: Esegue il backup dell'intero PC, di unità o di singoli file e li ripristina con pochi clic, anche se Windows non si avvia più.
Description: O&O DiskImage Premium esegue il backup dell'intero computer, di singole unità e partizioni o di file e cartelle selezionati. Le unità possono anche essere clonate su un'unità di riserva. La versione 23 introduce un'interfaccia guidata che mostra a colpo d'occhio la cronologia dei backup e lo stato di protezione, una destinazione di backup aggiuntiva nel cloud come uno spazio di archiviazione compatibile con S3 e catene di backup automatiche con intervalli definiti liberamente. In caso di emergenza, il sistema viene ripristinato da un supporto di avvio, anche su hardware diverso. L'ambiente di ripristino, prima chiamato modalità Fortezza, esegue i backup senza interferenze da parte di altre applicazioni e consente backup forensi. I backup incrementali e differenziali di unità virtuali VHD e VHDX possono essere creati, uniti e montati come unità. Sono supportati SSD, dischi GPT e sistemi UEFI.
