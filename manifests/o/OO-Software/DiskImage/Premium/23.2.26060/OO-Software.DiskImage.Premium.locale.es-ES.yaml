ShortDescription: Crea copias de seguridad de todo el PC, de unidades o de archivos y los restaura con pocos clics, incluso si Windows ya no se inicia.
Description: O&O DiskImage Premium crea copias de seguridad de todo el equipo, de unidades y particiones o de archivos y carpetas seleccionados. Las unidades también se pueden clonar en una unidad de reserva. La versión 23 incorpora una interfaz guiada que muestra de un vistazo el historial de copias y el estado de protección, un destino adicional de copia en la nube, como almacenamiento compatible con S3, y cadenas de copias de seguridad automáticas con intervalos definidos individualmente. En caso de emergencia, el sistema se restaura desde un medio de arranque, incluso en hardware diferente. El entorno de recuperación, antes llamado modo Fortaleza, ejecuta las copias sin interferencias de otras aplicaciones y permite copias forenses. Las copias incrementales y diferenciales de unidades virtuales VHD y VHDX se pueden crear, combinar y montar como unidades. Es compatible con SSD, discos GPT y sistemas UEFI.
