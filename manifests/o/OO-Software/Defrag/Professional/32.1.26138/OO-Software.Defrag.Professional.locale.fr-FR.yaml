ShortDescription: Accélère les PC Windows en optimisant automatiquement les disques durs, SSD et lecteurs NVMe en arrière-plan.
Description: O&O Defrag Professional optimise les lecteurs automatiquement et en fonction du matériel utilisé. Les disques durs traditionnels sont défragmentés, tandis que les SSD et lecteurs NVMe sont optimisés avec des méthodes spécialement développées comme SOLID/Quick et SOLID/Complete. TRIM est également pris en charge. L’optimisation automatique s’exécute en arrière-plan et s’adapte à la charge actuelle du système. La version 32 apporte une interface modernisée avec une visite interactive, des rapports détaillés et des benchmarks. Drive Health affiche l’état de chaque lecteur et O&O SpeedCheck mesure le gain de performances possible. L’optimisation avant le démarrage de Windows, O&O StartupManager, O&O DiskCleaner et une vérification du système avec fonction de réparation sont inclus. O&O Defrag fonctionne aussi nativement sur les systèmes ARM64. La vue classique avec ses nombreux réglages reste disponible pour les utilisateurs expérimentés.
