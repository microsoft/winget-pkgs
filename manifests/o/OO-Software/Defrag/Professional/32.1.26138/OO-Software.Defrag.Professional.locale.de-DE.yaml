ShortDescription: Beschleunigt Windows-PCs, indem Festplatten, SSDs und NVMe-Laufwerke automatisch im Hintergrund optimiert werden.
Description: O&O Defrag Professional optimiert Laufwerke automatisch und passend zur eingesetzten Hardware. Klassische Festplatten werden defragmentiert, SSDs und NVMe-Laufwerke mit eigens entwickelten Verfahren wie SOLID/Quick und SOLID/Complete optimiert. Auch TRIM wird unterstützt. Die automatische Optimierung läuft im Hintergrund und passt sich der aktuellen Systemauslastung an. Version 32 bringt eine modernisierte Oberfläche mit interaktiver Tour, ausführlichen Berichten und Benchmarks. Drive Health zeigt den Zustand jedes Laufwerks, O&O SpeedCheck misst den möglichen Leistungsgewinn. Dazu kommen die Optimierung vor dem Windows-Start, der O&O StartupManager, der O&O DiskCleaner und eine Systemprüfung mit Reparaturfunktion. O&O Defrag läuft auch nativ auf ARM64-Systemen. Die klassische Ansicht mit umfangreichen Einstellungen bleibt für erfahrene Anwender erhalten.
