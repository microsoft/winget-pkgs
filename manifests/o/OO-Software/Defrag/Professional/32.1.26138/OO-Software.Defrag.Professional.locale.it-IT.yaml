ShortDescription: Velocizza i PC Windows ottimizzando automaticamente in background dischi rigidi, SSD e unità NVMe.
Description: O&O Defrag Professional ottimizza le unità automaticamente e in base all'hardware utilizzato. I dischi rigidi tradizionali vengono deframmentati, mentre SSD e unità NVMe vengono ottimizzati con metodi sviluppati appositamente come SOLID/Quick e SOLID/Complete. È supportato anche TRIM. L'ottimizzazione automatica viene eseguita in background e si adatta al carico attuale del sistema. La versione 32 introduce un'interfaccia modernizzata con una guida interattiva, report dettagliati e benchmark. Drive Health mostra lo stato di ogni unità e O&O SpeedCheck misura il possibile aumento delle prestazioni. Sono inclusi anche l'ottimizzazione prima dell'avvio di Windows, O&O StartupManager, O&O DiskCleaner e un controllo del sistema con funzione di riparazione. O&O Defrag funziona in modo nativo anche sui sistemi ARM64. La visualizzazione classica con numerose impostazioni resta disponibile per gli utenti esperti.
