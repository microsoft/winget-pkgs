ShortDescription: Przyspiesza komputery z Windows, automatycznie optymalizując w tle dyski twarde, SSD i NVMe.
Description: O&O Defrag Professional optymalizuje dyski automatycznie i z uwzględnieniem używanego sprzętu. Tradycyjne dyski twarde są defragmentowane, a dyski SSD i NVMe optymalizowane specjalnie opracowanymi metodami, takimi jak SOLID/Quick i SOLID/Complete. Obsługiwane jest również polecenie TRIM. Automatyczna optymalizacja działa w tle i dostosowuje się do bieżącego obciążenia systemu. Wersja 32 wprowadza unowocześniony interfejs z interaktywną prezentacją programu, szczegółowymi raportami i testami wydajności. Drive Health pokazuje kondycję każdego dysku, a O&O SpeedCheck mierzy możliwy wzrost wydajności. W zestawie są też optymalizacja przed uruchomieniem Windows, O&O StartupManager, O&O DiskCleaner oraz kontrola systemu z funkcją naprawy. O&O Defrag działa natywnie również na systemach ARM64. Klasyczny widok z rozbudowanymi ustawieniami pozostaje dostępny dla doświadczonych użytkowników.
