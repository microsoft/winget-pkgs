ShortDescription: Acelera los PC con Windows optimizando automáticamente en segundo plano discos duros, SSD y unidades NVMe.
Description: O&O Defrag Professional optimiza las unidades de forma automática y según el hardware utilizado. Los discos duros tradicionales se desfragmentan, mientras que los SSD y las unidades NVMe se optimizan con métodos desarrollados específicamente como SOLID/Quick y SOLID/Complete. También se admite TRIM. La optimización automática se ejecuta en segundo plano y se adapta a la carga actual del sistema. La versión 32 incorpora una interfaz modernizada con un recorrido interactivo, informes detallados y benchmarks. Drive Health muestra el estado de cada unidad y O&O SpeedCheck mide la posible mejora de rendimiento. También incluye la optimización antes de iniciar Windows, O&O StartupManager, O&O DiskCleaner y una comprobación del sistema con función de reparación. O&O Defrag también funciona de forma nativa en sistemas ARM64. La vista clásica con amplias opciones de configuración sigue disponible para usuarios experimentados.
