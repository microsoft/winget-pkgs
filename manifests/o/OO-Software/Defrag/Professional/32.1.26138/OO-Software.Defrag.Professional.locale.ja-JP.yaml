ShortDescription: HDD、SSD、NVMeドライブをバックグラウンドで自動的に最適化し、Windows PCを高速化します。
Description: O&O Defrag Professionalは、使用しているハードウェアに合わせてドライブを自動的に最適化します。従来のハード ディスクはデフラグされ、SSDとNVMeドライブはSOLID/Quick、SOLID/Completeなど専用に開発された方法で最適化されます。TRIMにも対応しています。自動最適化はバックグラウンドで動作し、現在のシステム負荷に合わせて調整されます。バージョン32では、インタラクティブなツアー、詳細なレポート、ベンチマークを備えた刷新されたインターフェイスが導入されました。ドライブ ヘルスで各ドライブの状態を確認でき、O&O SpeedCheckで最適化による性能向上の可能性を測定できます。Windows起動前の最適化、O&O StartupManager、O&O DiskCleaner、修復機能付きのシステム チェックも搭載しています。O&O DefragはARM64システムでもネイティブに動作します。豊富な設定オプションを備えた従来のビューも、経験豊富なユーザー向けに引き続き利用できます。
