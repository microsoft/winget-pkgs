ShortDescription: Acelera PCs com Windows otimizando automaticamente, em segundo plano, discos rígidos, SSDs e unidades NVMe.
Description: O O&O Defrag Professional otimiza as unidades automaticamente e de acordo com o hardware usado. Discos rígidos tradicionais são desfragmentados, enquanto SSDs e unidades NVMe são otimizados com métodos desenvolvidos especialmente para eles, como SOLID/Quick e SOLID/Complete. Também há suporte a TRIM. A otimização automática funciona em segundo plano e se adapta à carga atual do sistema. A versão 32 traz uma interface modernizada com um tour interativo, relatórios detalhados e benchmarks. O Drive Health mostra o estado de cada unidade, e o O&O SpeedCheck mede o possível ganho de desempenho. Também estão incluídos a otimização antes de o Windows iniciar, o O&O StartupManager, o O&O DiskCleaner e uma verificação do sistema com função de reparo. O O&O Defrag também funciona de forma nativa em sistemas ARM64. A visualização clássica com amplas configurações continua disponível para usuários experientes.
