ShortDescription: Esegue automaticamente il backup e la sincronizzazione di file, cartelle e dati OneDrive su unità USB, dischi esterni o storage compatibile con S3.
Description: "O&O AutoBackup esegue automaticamente il backup e la sincronizzazione di file e cartelle selezionati, ad esempio non appena viene collegata l'unità USB o il disco rigido esterno assegnato a un'attività di backup. Anche i dati OneDrive disponibili in locale possono essere salvati e sincronizzati, così documenti e foto dal cloud rientrano nella stessa strategia di backup degli altri dati del PC. Oltre alle unità locali ed esterne, uno storage compatibile con S3 può fungere da destinazione del backup. Crittografia e offuscamento proteggono i dati salvati, soprattutto su supporti esterni o remoti. L'interfaccia riprogettata guida passo dopo passo attraverso ogni attività di backup: selezionare i dati, definire la destinazione e decidere se copiare o sincronizzare."
