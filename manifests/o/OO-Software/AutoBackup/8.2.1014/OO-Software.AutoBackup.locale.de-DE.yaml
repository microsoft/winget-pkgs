ShortDescription: Sichert und synchronisiert Dateien, Ordner und OneDrive-Daten automatisch auf USB-Sticks, externe Laufwerke oder S3-kompatible Speicher.
Description: 'O&O AutoBackup sichert und synchronisiert ausgewählte Dateien und Ordner automatisch, zum Beispiel sobald der USB-Stick oder die externe Festplatte angeschlossen wird, die einer Sicherungsaufgabe zugeordnet ist. Auch lokal verfügbare OneDrive-Daten lassen sich sichern und synchronisieren, sodass Dokumente und Fotos aus der Cloud in dieselbe Sicherungsstrategie einfließen wie die übrigen PC-Daten. Neben lokalen und externen Laufwerken können auch S3-kompatible Speicher als Sicherungsziel dienen. Verschlüsselung und Obfuskation schützen die gesicherten Daten, vor allem auf externen oder entfernten Medien. Die neu gestaltete Oberfläche führt Schritt für Schritt durch jede Sicherungsaufgabe: Daten auswählen, Ziel festlegen und entscheiden, ob kopiert oder synchronisiert wird.'
