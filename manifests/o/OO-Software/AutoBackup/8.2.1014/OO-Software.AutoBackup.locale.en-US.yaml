ShortDescription: Backs up and synchronizes files, folders and OneDrive data automatically to USB drives, external drives or S3-compatible storage.
Description: 'O&O AutoBackup backs up and synchronizes selected files and folders automatically, for example as soon as the USB drive or external hard drive assigned to a backup task is connected. Locally available OneDrive data can be backed up and synchronized as well, so documents and photos from the cloud become part of the same backup strategy as the other PC data. Besides local and external drives, S3-compatible storage can serve as a backup destination. Encryption and obfuscation protect the backed-up data, especially on external or remote media. The redesigned interface guides through each backup task step by step: select the data, choose the destination and decide whether to copy or synchronize.'
