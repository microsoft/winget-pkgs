ShortDescription: Faz backup e sincroniza automaticamente arquivos, pastas e dados do OneDrive em unidades USB, discos externos ou armazenamento compatível com S3.
Description: 'O O&O AutoBackup faz backup e sincroniza automaticamente os arquivos e pastas selecionados, por exemplo assim que o pendrive ou o disco rígido externo atribuído a uma tarefa de backup é conectado. Os dados do OneDrive disponíveis localmente também podem ser incluídos no backup e na sincronização, para que documentos e fotos da nuvem façam parte da mesma estratégia de backup que os demais dados do PC. Além de unidades locais e externas, um armazenamento compatível com S3 pode servir como destino de backup. Criptografia e ofuscação protegem os dados salvos, principalmente em mídias externas ou remotas. A interface redesenhada guia passo a passo por cada tarefa de backup: selecionar os dados, definir o destino e decidir se eles serão copiados ou sincronizados.'
