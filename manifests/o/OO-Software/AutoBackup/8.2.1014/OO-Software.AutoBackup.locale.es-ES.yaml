ShortDescription: Realiza copias de seguridad y sincroniza automáticamente archivos, carpetas y datos de OneDrive en unidades USB, discos externos o almacenamiento compatible con S3.
Description: 'O&O AutoBackup realiza copias de seguridad y sincroniza automáticamente los archivos y carpetas seleccionados, por ejemplo en cuanto se conecta la unidad USB o el disco duro externo asignado a una tarea de copia de seguridad. Los datos de OneDrive disponibles localmente también se pueden incluir en la copia de seguridad y en la sincronización, de modo que los documentos y fotos de la nube formen parte de la misma estrategia de copias de seguridad que el resto de los datos del PC. Además de unidades locales y externas, el almacenamiento compatible con S3 puede servir como destino. El cifrado y la ofuscación protegen los datos guardados, sobre todo en soportes externos o remotos. La interfaz rediseñada guía paso a paso por cada tarea de copia de seguridad: seleccionar los datos, definir el destino y decidir si se copian o se sincronizan.'
