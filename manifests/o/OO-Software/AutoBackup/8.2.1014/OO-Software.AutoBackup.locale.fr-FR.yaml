ShortDescription: Sauvegarde et synchronise automatiquement fichiers, dossiers et données OneDrive sur des clés USB, des disques externes ou un stockage compatible S3.
Description: 'O&O AutoBackup sauvegarde et synchronise automatiquement les fichiers et dossiers sélectionnés, par exemple dès que la clé USB ou le disque dur externe associé à une tâche de sauvegarde est connecté. Les données OneDrive disponibles localement peuvent aussi être sauvegardées et synchronisées, afin que les documents et photos du cloud fassent partie de la même stratégie de sauvegarde que les autres données du PC. Outre les disques locaux et externes, un stockage compatible S3 peut servir de destination de sauvegarde. Le chiffrement et l’obfuscation protègent les données sauvegardées, en particulier sur des supports externes ou distants. L’interface repensée guide pas à pas à travers chaque tâche de sauvegarde : choisir les données, définir la destination et décider de copier ou de synchroniser.'
