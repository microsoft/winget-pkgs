ShortDescription: Automatycznie zapisuje kopie zapasowe plików, folderów i danych OneDrive na dyskach USB, dyskach zewnętrznych lub w pamięci zgodnej z S3 i synchronizuje je z tymi nośnikami.
Description: 'O&O AutoBackup automatycznie tworzy kopie zapasowe wybranych plików i folderów oraz je synchronizuje, na przykład zaraz po podłączeniu dysku USB lub zewnętrznego dysku twardego przypisanego do zadania kopii zapasowej. Kopie zapasowe i synchronizacja obejmują też lokalnie dostępne dane OneDrive, dzięki czemu dokumenty i zdjęcia z chmury są objęte tą samą strategią kopii zapasowych co pozostałe dane komputera. Oprócz dysków lokalnych i zewnętrznych miejscem docelowym może być pamięć zgodna z S3. Szyfrowanie i zaciemnianie chronią zapisane dane, zwłaszcza na nośnikach zewnętrznych lub zdalnych. Przeprojektowany interfejs prowadzi krok po kroku przez każde zadanie kopii zapasowej: wybór danych, określenie miejsca docelowego i decyzja, czy dane mają być kopiowane, czy synchronizowane.'
