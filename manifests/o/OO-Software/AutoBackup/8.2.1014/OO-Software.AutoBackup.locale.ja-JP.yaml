ShortDescription: ファイル、フォルダー、OneDriveのデータを、USBドライブ、外付けドライブ、S3互換ストレージに自動でバックアップ・同期します。
Description: O&O AutoBackupは、選択したファイルやフォルダーを自動でバックアップ・同期します。たとえば、バックアップ タスクに割り当てたUSBドライブや外付けハード ディスクを接続すると、すぐに処理が始まります。ローカルで利用できるOneDriveのデータもバックアップ・同期できるため、クラウド上のドキュメントや写真も、PCのほかのデータと同じバックアップ戦略に組み込めます。ローカル ドライブや外付けドライブのほか、S3互換ストレージもバックアップ先として使用できます。暗号化と難読化により、特に外部メディアやリモートの保存先にあるバックアップ データを保護します。刷新されたインターフェイスでは、データの選択、保存先の指定、コピーか同期かの選択という手順に沿って、バックアップ タスクを設定できます。
