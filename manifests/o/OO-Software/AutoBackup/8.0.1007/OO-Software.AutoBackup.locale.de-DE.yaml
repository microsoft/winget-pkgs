ShortDescription: O&O AutoBackup sichert und synchronisiert Dateien, Ordner und OneDrive-Daten automatisch auf externe Laufwerke oder S3-kompatible Speicherziele.
Description: 'O&O AutoBackup sichert und synchronisiert ausgewählte Dateien und Ordner automatisch, sobald das einer Sicherungsaufgabe zugeordnete Speichermedium angeschlossen wird - etwa eine externe Festplatte oder ein USB-Stick. Version 8 ergänzt die Sicherung und Synchronisation lokal verfügbarer OneDrive-Daten, sodass Dokumente und Fotos aus der Cloud in dieselbe Sicherungsstrategie einfließen wie die übrigen PC-Daten, und unterstützt S3-kompatible Speicherziele, wodurch sich lokale und entfernte Sicherungsziele kombinieren lassen. Gesicherte Daten lassen sich durch Verschlüsselung und Obfuskation schützen - vor allem dann, wenn Sicherungen auf externen oder entfernten Medien liegen. Eine vollständig neu gestaltete Benutzeroberfläche führt Schritt für Schritt durch eine Sicherungsaufgabe: Daten auswählen, Ziel festlegen und entscheiden, ob kopiert oder synchronisiert werden soll. Die Anwendung ist portabel und muss nicht installiert werden.'
