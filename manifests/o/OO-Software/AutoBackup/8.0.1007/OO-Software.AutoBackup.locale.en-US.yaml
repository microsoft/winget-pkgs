ShortDescription: O&O AutoBackup automatically backs up and synchronizes files, folders, and OneDrive data to external drives or S3-compatible storage.
Description: 'O&O AutoBackup automatically backs up and synchronizes selected files and folders as soon as the storage device assigned to a backup task is connected - for example an external hard disk or a USB flash drive. Version 8 adds backup and synchronization of locally available OneDrive data, so cloud-stored documents and photos can be part of the same backup strategy as traditional PC data, and it supports S3-compatible storage destinations, which allows local and remote backup targets to be combined. Backed-up data can be protected with encryption and obfuscation, which matters especially when backups are kept on external or remote media. A completely redesigned user interface guides you through a backup task step by step: select the data, define the destination, and decide whether it should be copied or synchronized. The application is portable and requires no installation.'
