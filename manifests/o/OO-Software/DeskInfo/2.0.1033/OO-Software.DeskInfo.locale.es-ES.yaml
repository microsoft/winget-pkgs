ShortDescription: Herramienta gratuita que muestra en tiempo real información importante del sistema, como CPU, memoria, unidades y red, directamente en el escritorio de Windows.
Description: O&O DeskInfo muestra en tiempo real, directamente en el escritorio, el uso del procesador y de la memoria, el estado y el espacio libre de las unidades, así como las conexiones y la actividad de red. Se pueden ajustar la posición, el tamaño de fuente, los colores, la transparencia y el monitor, y un editor de perfiles define qué información aparece. La versión 2 incorpora nuevos gráficos de rendimiento para CPU, memoria y red, detecta máquinas virtuales, muestra el estado de la batería y distingue entre unidades locales, extraíbles y de red. Toda la información se puede copiar al portapapeles para solicitudes de soporte. O&O DeskInfo también avisa cuando se conectan dispositivos USB desconocidos. Es portátil, puede iniciarse automáticamente con Windows y es gratuito y no requiere registro.
