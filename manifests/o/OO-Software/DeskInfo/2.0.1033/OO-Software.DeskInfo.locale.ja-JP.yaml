ShortDescription: CPU、メモリ、ドライブ、ネットワークなどの重要なシステム情報を、Windowsのデスクトップにリアルタイムで表示する無料ツールです。
Description: O&O DeskInfoは、プロセッサーとメモリの使用率、ドライブの状態と空き容量、ネットワーク接続と現在のアクティビティを、デスクトップ上にリアルタイムで表示します。表示位置、フォント サイズ、色、透明度、表示するモニターを調整でき、プロファイル エディターで表示する情報を指定できます。バージョン2では、CPU、メモリ、ネットワーク用の新しいパフォーマンス グラフが追加され、仮想マシンの検出、バッテリー状態の表示、ローカル ドライブ、リムーバブル ドライブ、ネットワーク ドライブの区別に対応しました。すべての情報はクリップボードにコピーして、サポートへの問い合わせに利用できます。O&O DeskInfoは、不明なUSBデバイスが接続されたときにも通知します。インストール不要のポータブル ツールで、Windowsと同時に自動起動でき、登録不要、無料で使用できます。
