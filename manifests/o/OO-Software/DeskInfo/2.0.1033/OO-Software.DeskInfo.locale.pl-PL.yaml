ShortDescription: Bezpłatne narzędzie, które w czasie rzeczywistym pokazuje na pulpicie Windows najważniejsze informacje o systemie, takie jak CPU, pamięć, dyski i sieć.
Description: O&O DeskInfo pokazuje w czasie rzeczywistym bezpośrednio na pulpicie wykorzystanie procesora i pamięci, stan i wolne miejsce na dyskach oraz połączenia i aktywność sieciową. Położenie, rozmiar czcionki, kolory, przezroczystość i monitor można dostosować, a edytor profili określa, które informacje są wyświetlane. Wersja 2 wprowadza nowe wykresy wydajności dla CPU, pamięci i sieci, rozpoznaje maszyny wirtualne, pokazuje stan baterii i rozróżnia dyski lokalne, wymienne i sieciowe. Wszystkie informacje można skopiować do schowka na potrzeby zgłoszeń do pomocy technicznej. O&O DeskInfo informuje też o podłączeniu nieznanych urządzeń USB. Program jest przenośny, może uruchamiać się automatycznie razem z Windows, jest bezpłatny i nie wymaga rejestracji.
