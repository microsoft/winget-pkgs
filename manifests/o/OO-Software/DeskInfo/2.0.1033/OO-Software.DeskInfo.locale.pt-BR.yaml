ShortDescription: Ferramenta gratuita que exibe em tempo real informações importantes do sistema, como CPU, memória, unidades e rede, direto na área de trabalho do Windows.
Description: O O&O DeskInfo exibe em tempo real, direto na área de trabalho, o uso do processador e da memória, a saúde e o espaço livre das unidades, além das conexões e da atividade de rede. Posição, tamanho da fonte, cores, transparência e monitor podem ser ajustados, e um editor de perfis define quais informações aparecem. A versão 2 traz novos gráficos de desempenho para CPU, memória e rede, detecta máquinas virtuais, mostra o status da bateria e diferencia unidades locais, removíveis e de rede. Todas as informações podem ser copiadas para a área de transferência para solicitações de suporte. O O&O DeskInfo também avisa quando dispositivos USB desconhecidos são conectados. Ele é portátil, pode iniciar automaticamente com o Windows e é gratuito, sem cadastro.
