ShortDescription: Strumento gratuito che mostra in tempo reale le informazioni di sistema importanti come CPU, memoria, unità e rete direttamente sul desktop di Windows.
Description: O&O DeskInfo mostra in tempo reale, direttamente sul desktop, l'utilizzo di processore e memoria, lo stato e lo spazio libero delle unità, oltre alle connessioni e all'attività di rete. Posizione, dimensione del carattere, colori, trasparenza e monitor sono personalizzabili, e un editor dei profili stabilisce quali informazioni vengono visualizzate. La versione 2 introduce nuovi grafici delle prestazioni per CPU, memoria e rete, rileva le macchine virtuali, mostra lo stato della batteria e distingue tra unità locali, rimovibili e di rete. Tutte le informazioni possono essere copiate negli appunti per le richieste di supporto. O&O DeskInfo segnala inoltre il collegamento di dispositivi USB sconosciuti. È portatile, può avviarsi automaticamente con Windows ed è gratuito senza registrazione.
