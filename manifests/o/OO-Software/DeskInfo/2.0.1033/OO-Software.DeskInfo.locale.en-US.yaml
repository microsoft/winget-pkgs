ShortDescription: Free tool that shows important system information such as CPU, memory, drives and network directly on the Windows desktop in real time.
Description: O&O DeskInfo shows processor and memory usage, the health and free space of drives as well as network connections and activity in real time, directly on the desktop. Position, font size, colors, transparency and the monitor can be adjusted, and a profile editor defines which information appears. Version 2 brings new performance charts for CPU, memory and network, detects virtual machines, shows the battery status and distinguishes between local, removable and network drives. All information can be copied to the clipboard for support requests. O&O DeskInfo also reports the connection of unknown USB devices. It is portable, can start automatically with Windows and is free of charge without registration.
