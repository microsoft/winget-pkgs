ShortDescription: Outil gratuit qui affiche en temps réel les informations système importantes comme le processeur, la mémoire, les disques et le réseau sur le bureau Windows.
Description: O&O DeskInfo affiche en temps réel, directement sur le bureau, l’utilisation du processeur et de la mémoire, l’état et l’espace libre des disques ainsi que les connexions et l’activité réseau. La position, la taille de police, les couleurs, la transparence et l’écran peuvent être ajustés, et un éditeur de profils définit les informations affichées. La version 2 apporte de nouveaux graphiques de performances pour le processeur, la mémoire et le réseau, détecte les machines virtuelles, affiche l’état de la batterie et distingue les disques locaux, amovibles et réseau. Toutes les informations peuvent être copiées dans le presse-papiers pour les demandes d’assistance. O&O DeskInfo signale aussi la connexion de périphériques USB inconnus. Il est portable, peut démarrer automatiquement avec Windows et est gratuit, sans inscription.
