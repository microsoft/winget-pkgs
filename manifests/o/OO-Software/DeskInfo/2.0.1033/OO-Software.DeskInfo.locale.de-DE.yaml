ShortDescription: Kostenloses Tool, das wichtige Systeminformationen wie CPU, Arbeitsspeicher, Laufwerke und Netzwerk in Echtzeit direkt auf dem Windows-Desktop anzeigt.
Description: O&O DeskInfo zeigt die Auslastung von Prozessor und Arbeitsspeicher, Zustand und freien Platz der Laufwerke sowie Netzwerkverbindungen und aktuelle Aktivität in Echtzeit direkt auf dem Desktop. Position, Schriftgröße, Farben, Transparenz und Monitor lassen sich anpassen, ein Profil-Editor legt fest, welche Informationen erscheinen. Version 2 bringt neue Leistungsdiagramme für CPU, Arbeitsspeicher und Netzwerk, erkennt virtuelle Maschinen, zeigt den Batteriestatus und unterscheidet lokale, Wechsel- und Netzlaufwerke. Alle Angaben lassen sich für Supportanfragen in die Zwischenablage kopieren. Außerdem meldet O&O DeskInfo, wenn unbekannte USB-Geräte angeschlossen werden. Das Programm ist portabel, kann automatisch mit Windows starten und ist ohne Registrierung kostenlos.
