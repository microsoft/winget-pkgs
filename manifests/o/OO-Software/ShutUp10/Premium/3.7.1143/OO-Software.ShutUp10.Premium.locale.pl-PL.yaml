ShortDescription: O&O ShutUp10 Premium to edycja instalowana na komputerze, która automatycznie wymusza ustawienia prywatności Windows i przywraca je po aktualizacjach, z profilami prywatności i usługą ochrony działającą w tle.
Description: 'O&O ShutUp10 Premium rozszerza bezpłatne narzędzie antyszpiegowskie o automatyczną ochronę: po konfiguracji usługa działająca w tle stale monitoruje wybrane ustawienia prywatności i przywraca je po aktualizacjach Windows lub zmianach w systemie. Dodaje gotowe profile prywatności (Office, Gaming, Family, Total Privacy) z importem i eksportem, przegląd ustawień odbiegających od aktywnego profilu, dziennik aktywności oraz ustawienia dla najnowszych funkcji AI i chmury w Windows. Edycja wprowadzona w wersji 3 i wyposażona w zmodernizowany interfejs jest dostępna w 17 językach i przeznaczona dla użytkowników, którzy chcą trwałej ochrony prywatności w Windows 10 i 11 bez konieczności ręcznej ingerencji.'
