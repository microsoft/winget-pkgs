ShortDescription: O&O ShutUp10 Premium ist die installierte Edition, die Ihre Windows-Privatsphäre-Einstellungen automatisch durchsetzt und nach Updates wiederherstellt, mit Privatsphäre-Profilen und einem Schutzdienst im Hintergrund.
Description: 'O&O ShutUp10 Premium erweitert das kostenlose Antispy-Tool um automatischen Schutz: Nach der Einrichtung überwacht ein Hintergrunddienst laufend die gewählten Privatsphäre-Einstellungen und stellt sie nach Windows-Updates oder Systemänderungen wieder her. Hinzu kommen fertige Privatsphäre-Profile (Office, Gaming, Family, Total Privacy) mit Import und Export, eine Prüfung der Einstellungen, die vom aktiven Profil abweichen, ein Aktivitätsprotokoll sowie Einstellungen für die neuesten Windows-KI- und Cloud-Funktionen. Eingeführt mit Version 3 und auf einer modernisierten Oberfläche neu aufgebaut, ist sie in 17 Sprachen verfügbar und richtet sich an Nutzer, die dauerhaften Privatsphäre-Schutz ohne eigenes Zutun unter Windows 10 und 11 wollen.'
