ShortDescription: O&O ShutUp10 Premiumは、Windowsのプライバシー設定を自動的に適用し、アップデート後に復元するインストール型エディションです。プライバシー プロファイルとバックグラウンドの保護サービスを備えています。
Description: O&O ShutUp10 Premiumは、無料のアンチスパイ ツールに自動保護機能を加えたエディションです。一度設定すれば、バックグラウンド サービスが選択したプライバシー設定を常に監視し、Windowsのアップデートやシステムの変更後に元に戻します。インポートとエクスポートに対応したあらかじめ用意されたプライバシー プロファイル（Office、Gaming、Family、Total Privacy）、アクティブなプロファイルと異なる設定の一覧、アクティビティ ログ、そしてWindowsの最新のAIおよびクラウド機能に対する設定項目も備えています。バージョン3で登場し、モダンなインターフェイスで再構築されたO&O ShutUp10 Premiumは17言語に対応しており、Windows 10および11で手間をかけずに継続的なプライバシー保護を求めるユーザー向けです。
