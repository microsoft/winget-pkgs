ShortDescription: O&O ShutUp10 Premium est l’édition installée qui applique automatiquement vos paramètres de confidentialité Windows et les rétablit après les mises à jour, avec des profils de confidentialité et un service de protection en arrière-plan.
Description: 'O&O ShutUp10 Premium complète l’outil anti-espionnage gratuit par une protection automatique : une fois configuré, un service en arrière-plan surveille en permanence les paramètres de confidentialité choisis et les rétablit après les mises à jour de Windows ou les modifications du système. Il ajoute des profils de confidentialité prêts à l’emploi (Office, Gaming, Family, Total Privacy) avec importation et exportation, un examen des écarts par rapport au profil actif, un journal d’activité et des contrôles pour les dernières fonctions d’IA et de cloud de Windows. Introduit avec la version 3 et reconstruit sur une interface modernisée, il est disponible en 17 langues et s’adresse aux utilisateurs qui souhaitent une protection durable de leur vie privée, sans intervention de leur part, sous Windows 10 et 11.'
