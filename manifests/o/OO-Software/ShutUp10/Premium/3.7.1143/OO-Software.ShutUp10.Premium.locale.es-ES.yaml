ShortDescription: O&O ShutUp10 Premium es la edición instalada que aplica automáticamente su configuración de privacidad de Windows y la restablece tras las actualizaciones, con perfiles de privacidad y un servicio de protección en segundo plano.
Description: 'O&O ShutUp10 Premium amplía la herramienta antiespía gratuita con protección automática: una vez configurado, un servicio en segundo plano supervisa continuamente la configuración de privacidad elegida y la restablece tras las actualizaciones de Windows o los cambios en el sistema. Añade perfiles de privacidad predefinidos (Office, Gaming, Family, Total Privacy) con importación y exportación, una revisión de las diferencias con respecto al perfil activo, un registro de actividad y controles para las funciones de IA y en la nube más recientes de Windows. Introducido con la versión 3 y reconstruido sobre una interfaz modernizada, está disponible en 17 idiomas y se dirige a usuarios que desean una protección de la privacidad permanente y sin intervención en Windows 10 y 11.'
