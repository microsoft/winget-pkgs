ShortDescription: O&O ShutUp10 Premium è l’edizione installata che applica automaticamente le impostazioni per la privacy di Windows e le ripristina dopo gli aggiornamenti, con profili di privacy e un servizio di protezione in background.
Description: 'O&O ShutUp10 Premium estende lo strumento antispia gratuito con una protezione automatica: una volta configurato, un servizio in background monitora costantemente le impostazioni per la privacy scelte e le ripristina dopo gli aggiornamenti di Windows o le modifiche al sistema. Aggiunge profili di privacy predefiniti (Office, Gaming, Family, Total Privacy) con importazione ed esportazione, una verifica delle differenze rispetto al profilo attivo, un registro attività e controlli per le più recenti funzioni di IA e cloud di Windows. Introdotto con la versione 3 e ricostruito su un’interfaccia modernizzata, è disponibile in 17 lingue ed è pensato per gli utenti che desiderano una protezione della privacy duratura e senza interventi su Windows 10 e 11.'
