ShortDescription: O O&O ShutUp10 é a ferramenta antiespionagem gratuita e portátil para Windows 10 e 11 que permite controlar a privacidade, a telemetria e as configurações de dados de IA em uma única interface.
Description: O O&O ShutUp10 oferece controle total sobre as configurações de privacidade do Windows 10 e 11 em uma interface clara, com recomendações para orientar você. Você pode desativar a telemetria, a coleta de dados, os serviços de localização, as IDs de anúncio e o compartilhamento de dados dos recursos mais recentes de IA e nuvem do Windows. A edição gratuita é portátil, não requer instalação e está disponível em 17 idiomas. A versão 3 foi reconstruída com uma interface modernizada e adiciona controles para os novos recursos de IA do Windows. As configurações aplicadas com a edição gratuita podem ser revertidas pelas atualizações do Windows; a edição Premium as reaplica automaticamente.
