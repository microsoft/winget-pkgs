ShortDescription: O&O ShutUp10 est l’outil anti-espionnage gratuit et portable pour Windows 10 et 11 qui vous permet de contrôler la confidentialité, la télémétrie et les paramètres de données liés à l’IA depuis une seule interface.
Description: O&O ShutUp10 vous donne un contrôle total sur les paramètres de confidentialité de Windows 10 et 11 depuis une interface claire, avec des recommandations pour vous guider. Vous pouvez désactiver la télémétrie, la collecte de données, les services de localisation, les identifiants de publicité et le partage de données des dernières fonctions d’IA et de cloud de Windows. L’édition gratuite est portable, ne nécessite aucune installation et est disponible en 17 langues. La version 3 a été reconstruite sur une interface modernisée et ajoute des contrôles pour les nouvelles fonctions d’IA de Windows. Les paramètres appliqués avec l’édition gratuite peuvent être réinitialisés par les mises à jour de Windows ; l’édition Premium les rétablit automatiquement.
