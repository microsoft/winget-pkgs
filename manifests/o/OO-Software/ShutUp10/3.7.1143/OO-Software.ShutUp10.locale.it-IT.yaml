ShortDescription: O&O ShutUp10 è lo strumento antispia gratuito e portatile per Windows 10 e 11 che consente di controllare privacy, telemetria e impostazioni dei dati relativi all’IA da un’unica interfaccia.
Description: O&O ShutUp10 offre il pieno controllo sulle impostazioni per la privacy di Windows 10 e 11 da un’interfaccia chiara, con raccomandazioni che guidano l’utente. È possibile disattivare telemetria, raccolta dati, servizi di localizzazione, ID annunci e la condivisione dei dati delle più recenti funzioni di IA e cloud di Windows. L’edizione gratuita è portatile, non richiede installazione ed è disponibile in 17 lingue. La versione 3 è stata ricostruita su un’interfaccia modernizzata e aggiunge controlli per le nuove funzioni di IA di Windows. Le impostazioni applicate con l’edizione gratuita possono essere annullate dagli aggiornamenti di Windows; l’edizione Premium le riapplica automaticamente.
