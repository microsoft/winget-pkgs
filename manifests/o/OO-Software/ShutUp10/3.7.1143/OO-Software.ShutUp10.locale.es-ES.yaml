ShortDescription: O&O ShutUp10 es la herramienta antiespía gratuita y portátil para Windows 10 y 11 que le permite controlar la privacidad, la telemetría y la configuración de datos de IA desde una sola interfaz.
Description: O&O ShutUp10 le ofrece el control total sobre la configuración de privacidad de Windows 10 y 11 desde una interfaz clara con recomendaciones que le guían. Puede desactivar la telemetría, la recopilación de datos, los servicios de ubicación, los id. de publicidad y el intercambio de datos de las funciones de IA y en la nube más recientes de Windows. La edición gratuita es portátil, no requiere instalación y está disponible en 17 idiomas. La versión 3 se ha reconstruido sobre una interfaz modernizada y añade controles para las nuevas funciones de IA de Windows. La configuración aplicada con la edición gratuita puede revertirse con las actualizaciones de Windows; la edición Premium la restablece automáticamente.
