ShortDescription: O&O ShutUp10は、Windows 10および11向けの無料・ポータブルなアンチスパイ ツールです。プライバシー、テレメトリー、AI関連のデータ設定をひとつの画面で管理できます。
Description: O&O ShutUp10を使えば、Windows 10および11のプライバシー設定を、推奨設定付きのわかりやすい画面から完全にコントロールできます。テレメトリー、データ収集、位置情報サービス、広告識別子、そしてWindowsの最新のAIおよびクラウド機能によるデータ共有を無効にできます。無料エディションはポータブルでインストール不要、17言語に対応しています。バージョン3ではモダンなインターフェイスで再構築され、Windowsの新しいAI機能に対する設定項目が追加されました。無料エディションで適用した設定はWindowsのアップデートによって元に戻る場合があります。Premiumエディションでは、設定が自動的に再適用されます。
