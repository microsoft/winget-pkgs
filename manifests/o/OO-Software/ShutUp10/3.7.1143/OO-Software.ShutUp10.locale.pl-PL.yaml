ShortDescription: O&O ShutUp10 to bezpłatne, przenośne narzędzie antyszpiegowskie dla Windows 10 i 11, które pozwala z jednego interfejsu kontrolować prywatność, telemetrię i ustawienia danych związanych z AI.
Description: O&O ShutUp10 zapewnia pełną kontrolę nad ustawieniami prywatności Windows 10 i 11 z poziomu przejrzystego interfejsu z zaleceniami. Można wyłączyć telemetrię, zbieranie danych, usługi lokalizacji, identyfikatory wyświetlania reklam oraz udostępnianie danych przez najnowsze funkcje AI i chmury w Windows. Bezpłatna edycja jest przenośna, nie wymaga instalacji i jest dostępna w 17 językach. Wersja 3 otrzymała nowy, zmodernizowany interfejs i dodaje ustawienia dla nowych funkcji AI w Windows. Ustawienia zastosowane w bezpłatnej edycji mogą zostać cofnięte przez aktualizacje Windows; edycja Premium automatycznie je przywraca.
