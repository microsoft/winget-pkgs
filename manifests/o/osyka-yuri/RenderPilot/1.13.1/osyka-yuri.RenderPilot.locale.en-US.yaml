ShortDescription: Discover and manage PC game rendering components; safely update, downgrade, or restore DLSS, FSR, XeSS, and more, and manage OptiScaler, RenoDX, and Luma.
Description: RenderPilot is a local-first Windows app for discovering and managing rendering components used by PC games. It scans supported launchers (Steam, Epic Games, GOG, EA App, Ubisoft Connect, Xbox App) and custom folders to let you update, downgrade, or restore libraries including NVIDIA DLSS, Streamline, AMD FSR, Intel XeSS, DirectStorage, Microsoft DXC, D3D12 Agility SDK, OpenVR, and Xiph Ogg/Vorbis. It also manages add-ons including RenoDX, Luma, and OptiScaler and their required ReShade components where applicable, as well as per-game NVIDIA DLSS settings. RenderPilot has no mandatory online account and does not collect telemetry.
