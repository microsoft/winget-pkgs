ShortDescription: Manage, update, downgrade and restore DLSS, FSR, XeSS and other rendering components across your PC games.
Description: RenderPilot is a local-first Windows app for discovering and managing rendering components used by PC games. It scans supported game libraries and lets you update, downgrade, or restore components including DLSS, FSR, XeSS, DirectStorage, D3D12, OpenVR, Ogg/Vorbis, and other supported libraries. It also supports RenoDX and Luma add-ons and per-game NVIDIA DLSS settings.
