ShortDescription: One-click light/dark theme switcher for Windows that lives in the system tray.
Description: ThemeToggle puts the Windows light/dark switch one click away instead of five menus deep in Settings. A single icon next to the clock flips the taskbar, the Start menu and every open application at once, with no sign-out and no Explorer restart. Left click switches the theme, right click opens a menu for autostart and quit. No installer, no admin rights, no network access, no telemetry.
