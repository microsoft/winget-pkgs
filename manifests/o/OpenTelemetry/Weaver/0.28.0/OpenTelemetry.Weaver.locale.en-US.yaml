ReleaseNotes: "## Release Notes\n\n• Fix the JSON Schema of `SchemaUrl` to describe a string, matching how it is serialized. ([#1825](https://github.com/open-telemetry/weaver/pull/1825) by @lmolkova)\n• Add `[[policy.finding_filters]]` to `.weaver.toml` to suppress policy findings. ([#1820](https://github.com/open-telemetry/weaver/pull/1820) by @lmolkova)\n• Live-check no longer reports false `invalid_format` and `extends_namespace` advice for v2 attributes and templates referenced from a dependency. The advice now finds attributes the same way as the other checks：in the matched signal and attribute groups, or also in the whole registry and its dependencies with `--search-all-attributes`. Fixes [#1814](https://github.com/open-telemetry/weaver/issues/1814) - ([#1819](https://github.com/open-telemetry/weaver/pull/1819) by @jerbly)\n• Add vdir documentation and safety features. We no longer untar symlinks or allow\n  non-local files to be extracted. ([#1817](https://github.com/open-telemetry/weaver/pull/1817) by @jsuereth)\n• Remove `requirement_level` from Entity identity; a warning is emitted if `requirement_level` is set. Fixes [#986](https://github.com/open-telemetry/weaver/issues/986) - ([#1813](https://github.com/open-telemetry/weaver/pull/1813) by @jsuereth)\n• Fix `registry live-check --emit-otlp-logs` sending findings back to its own OTLP listener, which with the default ports made every finding a new sample to check. Live-check now stops at startup with an error when the logs endpoint is its own listener, and logs the endpoint it uses. ([#1782](https://github.com/open-telemetry/weaver/pull/1782) by @jerbly)\n• Fix `OTEL_EXPORTER_OTLP_ENDPOINT` being ignored by `registry emit` and `registry live-check --emit-otlp-logs`. When no endpoint is set with `--endpoint` / `--otlp-logs-endpoint` or in `.weaver.toml`, the signal's `OTEL_EXPORTER_OTLP_<SIGNAL>_ENDPOINT`, then `OTEL_EXPORTER_OTLP_ENDPOINT`, now apply before the `http://localhost:4317` default. ([#1782](https://github.com/open-telemetry/weaver/pull/1782) by @jerbly)\n• Add `unref` to v2 signal refinements to unreference inherited attributes. ([#1799](https://github.com/open-telemetry/weaver/pull/1799) by @lmolkova)\n• Support user-provided JQ modules via `jq_modules` in `weaver.yaml` to share custom functions in templates. Fixes [#565](https://github.com/open-telemetry/weaver/issues/565) - ([#1768](https://github.com/open-telemetry/weaver/pull/1768) by @LJimmy007)\n\n## Install weaver 0.28.0\n\n### Install prebuilt binaries via shell script\n\n```sh\ncurl --proto '=https' --tlsv1.2 -LsSf https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-installer.sh | sh\n```\n\n### Install prebuilt binaries via powershell script\n\n```sh\npowershell -ExecutionPolicy Bypass -c \"irm https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-installer.ps1 | iex\"\n```\n\n## Download weaver 0.28.0\n\n|  File  | Platform | Checksum |\n|--------|----------|----------|\n| [weaver-aarch64-apple-darwin.tar.xz](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-aarch64-apple-darwin.tar.xz) | Apple Silicon macOS | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-aarch64-apple-darwin.tar.xz.sha256) |\n| [weaver-x86_64-apple-darwin.tar.xz](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-apple-darwin.tar.xz) | Intel macOS | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-apple-darwin.tar.xz.sha256) |\n| [weaver-x86_64-pc-windows-msvc.zip](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-pc-windows-msvc.zip) | x64 Windows | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-pc-windows-msvc.zip.sha256) |\n| [weaver-x86_64-pc-windows-msvc.msi](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-pc-windows-msvc.msi) | x64 Windows | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-pc-windows-msvc.msi.sha256) |\n| [weaver-aarch64-unknown-linux-gnu.tar.xz](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-aarch64-unknown-linux-gnu.tar.xz) | ARM64 Linux | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-aarch64-unknown-linux-gnu.tar.xz.sha256) |\n| [weaver-x86_64-unknown-linux-gnu.tar.xz](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-gnu.tar.xz) | x64 Linux | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-gnu.tar.xz.sha256) |\n| [weaver-aarch64-unknown-linux-musl.tar.xz](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-aarch64-unknown-linux-musl.tar.xz) | ARM64 MUSL Linux | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-aarch64-unknown-linux-musl.tar.xz.sha256) |\n| [weaver-x86_64-unknown-linux-musl.tar.xz](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-musl.tar.xz) | x64 MUSL Linux | [checksum](https://github.com/open-telemetry/weaver/releases/download/v0.28.0/weaver-x86_64-unknown-linux-musl.tar.xz.sha256) |\n\n## Verifying GitHub Artifact Attestations\n\nThe artifacts in this release have attestations generated with GitHub Artifact Attestations. These can be verified by using the [GitHub CLI](https://cli.github.com/manual/gh_attestation_verify):\n```sh\ngh attestation verify <file-path of downloaded artifact> --repo open-telemetry/weaver\n```\n\nYou can also download the attestation from [GitHub](https://github.com/open-telemetry/weaver/attestations) and verify against that directly:\n```sh\ngh attestation verify <file-path of downloaded artifact> --bundle <file-path of downloaded attestation>\n```"
