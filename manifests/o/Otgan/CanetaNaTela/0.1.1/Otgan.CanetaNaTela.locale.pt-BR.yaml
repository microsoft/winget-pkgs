ReleaseNotes: |-
  CanetaNaTela v0.1.1 — Versão de Estabilidade e Atualização Automática
  - Integração com verificação automática da Microsoft via WinGet ativada
  - Verificação automática de atualizações ativa por padrão na inicialização
  - Correção de posicionamento do histórico, carregamento de miniaturas base64 e suporte a gravações MP4
  - Caminho da pasta de destino diretamente editável
  - Seletor de pasta nativo, rastreamento livre do cursor no holofote e controles móveis
  - Janelas modais ganham foco e suspendem modo clique-através
  - Pipeline de lançamento automatizado com publicação no winget
