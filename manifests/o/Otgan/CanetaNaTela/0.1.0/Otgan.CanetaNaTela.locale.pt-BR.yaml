ReleaseNotes: |-
  CanetaNaTela v0.1.0 — Lançamento Oficial Inicial
  - Traço vetorial instantâneo sobre qualquer software (< 16 ms)
  - Caneta suave, marca-texto translúcido, setas inteligentes e formas
  - Detecção e captura unificada para múltiplos monitores
  - Gravação de tela ou janela a 60 FPS com exportação WebM
  - Modo holofote com escurecimento de fundo para palestras e aulas
  - Modo lousa / quadro branco
  - Modo clique-através de baixo nível (WS_EX_TRANSPARENT)
  - 100% offline, zero nuvem, consumo de ~38 MB em repouso
