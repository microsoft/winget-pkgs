ReleaseNotes: |-
  CanetaNaTela v0.1.0 — Initial Official Release
  - Real-time vector screen annotation (< 16 ms latency)
  - Pen, highlighter, smart arrows, shapes, and typography
  - Unified multi-monitor detection and capture (Win32 API)
  - Native 60 FPS screen and window recording with WebM export
  - Presenter spotlight mode with background dimming
  - Clean whiteboard mode for brainstorming and lectures
  - Low-level click-through mode (WS_EX_TRANSPARENT)
  - 100% offline, zero cloud, ~38 MB idle RAM footprint
