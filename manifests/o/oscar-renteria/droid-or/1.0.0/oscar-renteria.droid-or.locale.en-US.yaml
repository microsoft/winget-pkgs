ShortDescription: Install APKs and split bundles and copy apps between Android phones over USB, without root.
Description: |-
  droid.or installs single APKs and split bundles (.apks, .xapk, .apkm) on an Android phone from your computer,
  picking the parts that match the phone's CPU, screen density and language. It can also copy an installed app,
  including its split parts, from one connected phone to another. Device tools cover reviewing and disabling
  preinstalled apps, APK backup and a full change history with restore. Requires USB debugging on the phone; no root.
