ReleaseNotes: |-
  What's new in Open PDF Studio 2026.48.29
  1. Drag a document tab into a new window or drop it onto the tab bar of another Open PDF Studio window. Detached tabs can be brought back together.
  2. Choose Fit Page, Fit Width or a custom percentage for newly opened documents under Preferences → Page Display. Reader Mode still restores a document's saved page and zoom. (#1277)
  3. Attach a note to a rectangular or freeform revision cloud. After drawing the cloud, click to place the text box. The leader stays attached when you move the cloud and after saving and reopening the PDF. (#1279)
  4. Recover text in imported callouts when the PDF stores it exclusively as rich text. This addresses one reproducible cause of a blank callout in an otherwise visible drawing. (#1270)
  5. Widen the Pages panel to show more thumbnails per row. As you scroll through the document, the current page stays highlighted and its thumbnail stays in view.
  Android upgrades
  Version 2026.48.28 introduced the permanent Android signing key. Users upgrading from an earlier APK signed with a different key should export their PDFs and app data and verify their backups before uninstalling the old app. Uninstalling removes app-specific data. Users already on 2026.48.28 can update normally.
  Improvements included from version 2026.48.27
  6. Preserve vector snippets and the placement of surrounding annotations when flattening a PDF. (#1259, #1261)
  7. Save edited PDFs through Android document providers. When a document is read-only, Save As offers its original filename and keeps edits available if saving is cancelled. (#1260)
  8. Choose from all 16 PDF blend modes in the Appearance panel and preserve the selected mode after saving and reopening the annotation. (#1262)
  Other changes since v2026.48.8
  9. Recover PDFs with blank generation fields in classic cross-reference tables. (#1250)
  10. Restore a hidden drawing toolbar from the View ribbon. (#1256)
  11. Keep separate pen strokes intact when editing, saving and reopening a compound ink annotation. (#1257)
  12. Reuse embedded watermark images when saving the document again. (#1257)
  13. Discard unused embedded image data after removing a watermark. (#1257)
  14. Reuse the closest available cached bitmap while zooming. (#1257)
  15. Cap render allocations on very large sheets. (#1257)
  16. Share font and graphics resources used by repeated headers. (#1257)
  17. Keep linked callout arrows attached when moving the annotation. (#1257)
  18. Branch an arrow from an existing callout bend with Shift-click. (#1257)
  19. Add an independent callout arrow with the plus control. (#1257)
  20. Retain branching callout arrows when exchanging XFDF. (#1257)
  21. Give a pasted callout its own arrows at the original relative positions. (#1257)
  22. Resize the Properties panel by dragging its edge. (#1257)
  23. Resize the Symbol Palette by dragging its edge. (#1257)
  24. Read the scale calibration dialog in dark themes. (#1257)
  Four-month release history
  Previously integrated improvements, July 25 through November 25, 2026. Earlier releases delivered many of these changes.
  July
  25. Navigate from the comments list without shifting the canvas.
  26. Draw consecutive concrete beams.
  27. Place a beam by two endpoints.
  28. Choose a concrete beam profile.
  29. Label a concrete beam.
  30. Draw open beam T-junctions.
  31. Drag beam labels independently.
  32. New concrete beams hide the centreline by default.
  33. New text boxes use a compact 8 pt style with a white background.
  34. Text box ribbon group labels fit their available space.
  35. Open an email draft through the system mail handler on each desktop platform.
  36. Open PDF Compare from the Edit and Merge ribbon.
  37. Continuous-view overlays and menus align with the correct page canvas.
  38. Compare the text flow of two PDFs.
  39. Highlight changes using the text layer.
  40. Change comparison pages with the mouse wheel.
  41. Preview mitres and open T-junctions as a beam is drawn.
  42. Click a selected component’s dimension to edit it in place.
  43. Reinforcement cages retain fine line detail at different scales.
  44. Define drawing rules by drawing type and scale.
  45. Components inherit line weight from their drawing type.
  46. Component labels inherit their drawing type’s text height.
  47. Assign drawing settings to a scale region.
  48. Draw a parametric panel grid.
  49. Adjust a panel grid interactively on the drawing.
  50. Reopen saved panel grids.
  51. Edit a panel grid from Properties.
  52. Choose a panel grid from the palette.
  53. Panel grids carry an IFC category.
  54. NEN 1414 symbols include their IFC classification.
  55. Avoid repeating expensive render probes on large pages.
  56. Keep extreme PDFium fallbacks on a single worker to limit resource use.
  57. Make zoom tile reuse resolution-aware.
  58. Avoid capped whole-page rerenders on HiDPI.
  59. Select cached tiles by viewport coverage.
  60. Reuse sharp viewport coverage across zoom.
  61. Keep GIS-style zoom coverage hot.
  62. Snap builds find the Debian package used as input.
  August
  63. Experimental native Windows ARM64 builds include the PDFium and WebView2 loader binaries.
  64. Missing interface translations now resolve to the intended strings.
  65. Previously hard-coded Dutch controls follow the selected interface language.
  66. Native error messages use English defaults.
  67. The Quantities interface follows the selected language. (#327)
  68. Reuse system-generator configurations as types.
  69. Print through CUPS on Linux and macOS. (#326)
  70. Save edited PDF text without the previous crash.
  71. Edited text retains its rotation.
  72. Refresh the text layer after editing.
  73. Keep line styling when editing page text.
  74. Edit and format existing text in place.
  75. Commit text edits by clicking outside the editor.
  76. The in-place editor fits the original text column.
  77. Editing masks the original text across its full extent.
  78. Move existing page text.
  79. Insert new blocks of page text.
  80. Launch Windows builds on systems without a separate Visual C++ runtime installation. (#337)
  81. Use hyperlinks embedded in the PDF. (#337)
  82. Drag a tab to another window without freezing. (#335)
  83. Text edits remain visible on pages with a shifted MediaBox.
  84. Protect unsaved work while another document is loading.
  85. The status filter also hides the corresponding markups on the canvas. (#333)
  86. Erase freehand strokes. (#329)
  87. Export the quantity schedule to a CSV file. (#328)
  88. See the full page width in documents with mixed sheet sizes. (#336)
  89. Open a PDF by double-clicking it in Finder. (#325)
  90. Place symbols at their intended aspect ratio.
  91. Place symbols at their intended paper size.
  92. Change the line width of a placed symbol.
  93. Choose alternative sizes from the linework catalogue.
  94. Keep the base letter when a diacritic cannot be encoded.
  95. Continuous-view zoom stays anchored to the pointer on both axes.
  96. Continuous view recovers more reliably during rapid or deep zoom, including in spreads.
  97. Print jobs use the PDF filename.
  98. Build macOS updater artifacts as part of a release.
  99. Imported text annotations retain rotation stored in their appearance matrix.
  September
  100. Access the previous release from the Start tab.
  101. Annotations stay sharp at high zoom.
  102. Paste uses the most recent clipboard item.
  103. Pages recover after rapid zoom without remaining white or blurry.
  104. Render the visible region sharply on large pages that exceed the bitmap cap.
  105. Prevent empty overlays from obscuring the rendered page.
  106. Continuous view renders the visible annotation layer at full resolution.
  107. New installations open documents in single-page view by default.
  108. Saving on close no longer duplicates markups.
  109. Images inserted by dragging or linking embed in the saved PDF.
  110. Built-in Dutch symbol groups are identified as built in.
  111. Recolour a placed symbol.
  112. Flatpak can enumerate CUPS printers.
  113. Form fields stay aligned with the page in single-page view.
  114. Find construction and site symbols in the palette.
  115. Preferences survive browser-storage quota limits.
  116. Large symbol catalogues are stored separately from preferences.
  117. The symbol palette keeps compact icons for items outside catalogue families.
  118. Trim beam corners even when two beams cross.
  119. Trim wall corners even when two walls cross.
  120. Tutorial keystrokes appear inside the drawing canvas.
  121. Use the lower title block as a separate PDF drawing-frame component.
  122. Browser builds display the loaded page.
  123. Concurrent saves run in sequence.
  124. Saving releases its document lock when finished.
  125. Reloading a saved document clears stale change records.
  126. Cropping an image reduces the image content itself.
  127. Add a diagonal cross to a rectangular opening.
  128. Duplicate a selected object with Ctrl-click.
  129. Select count markers immediately after placement.
  130. Set individual text runs to bold or italic within a text box.
  131. Place angle sections from the Dutch structural palette.
  132. New drawing sheets keep the entire lower title block visible.
  133. Prevent old form text from showing behind an editable field.
  134. Dragging an annotation follows the pointer more closely.
  135. Schedules report the correct area values.
  136. Schedules display the correct item names.
  137. Create a quantity schedule through MCP.
  138. Place a quantity schedule on the drawing through MCP.
  139. Save a vector snippet as a stamp with a vector appearance.
  140. Reopen a saved vector snippet for reuse.
  141. Preview a vector snippet before capturing it.
  142. Capture vector snippets from the Drawing ribbon.
  143. Paste vector snippets from the Drawing ribbon.
  144. Title-block input fields remain editable after assembling a drawing sheet.
  145. Set a symbol’s scale before placing it. (#357)
  146. Release cached snippet source pages when their document closes.
  147. Vector-snippet controls are localized across the supported languages.
