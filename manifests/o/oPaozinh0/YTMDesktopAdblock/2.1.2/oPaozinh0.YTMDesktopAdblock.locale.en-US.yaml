ShortDescription: YouTube Music desktop player with built-in ad blocking and Chrome extension support
Description: |-
  A fork of YouTube Music Desktop App (YTM Desktop) that adds ad blocking.

  The built-in blocker uses the EasyList and uBlock Origin filter lists and can also inject the
  lists' scriptlets, which is what stops the ads YouTube Music plays between songs. Unpacked Chrome
  extensions such as uBlock Origin can be loaded into the player as well.

  Everything else comes from upstream YTM Desktop: global media shortcuts, Discord rich presence,
  Last.fm scrobbling, custom CSS and the companion server API. It installs separately from upstream
  YTM Desktop and keeps its own settings.
Moniker: ytmdesktop-adblock
Tags:
- adblock
- adblocker
- audio
- music
- music-player
- player
- youtube
- youtube-music
ReleaseNotes: |-
  Migrates YTMDesktop Adblock to the upstream v2.1 architecture and resolves the signed-in
  YouTube Music startup hang ("YouTube Music is taking longer than usual to load.") caused by
  YouTube Music's new Wiz miniplayer layout.

  Replaces the Polymer player-bar hook with upstream's dependency-injection hook hardened for
  nullish Map.prototype.set calls, DOM fallback discovery, and missing ytmusic-player-bar
  elements, while preserving the built-in Ghostery adblocker and unpacked extension support.
  Also upgrades Electron to 45 and restores manual auto-update check/restart IPC handlers.
ReleaseNotesUrl: https://github.com/oPaozinh0/ytmdesktop/releases/tag/v2.1.2
