ReleaseNotes: |-
  Fork of YTM Desktop with ad blocking, based on upstream v2.0.11.

  - Built-in ad blocker (Settings > Adblock, on by default) with selectable filter lists, cosmetic
    filtering and scriptlet injection.
  - Chrome extension support for unpacked Manifest V2 extensions such as uBlock Origin.
