ReleaseNotes: |-
  Introduces the YTM Shield 2.2.0 visual redesign:
  - Dark Glassmorphism UI (#0b0c10 obsidian base and #ff1f4b crimson shield accents) and new YTM Shield icon set.
  - Smart TitleBar with Back/Forward/Reload controls and a live Shield Active status pill showing blocked ads/trackers.
  - Redesigned 920x650 Settings dashboard with an Adblock Hero Status Card and 3-column filter tier selector.
  - Floating glass Miniplayer with ambient blurred cover art, formatted time labels, and reliable startup playback.
