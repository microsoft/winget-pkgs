ReleaseNotes: "This release has some significant changes in it, \n\n## JWKS cache. \n\nThis should significantly improve performance. Currently it is opt-in and not on by default. Later releases will likely move to opt-in, we want to get more data and catch any issues before having on out of the box. It is curently Linux/macOS only.\n\nTo enable it during install：`OPKSSH_INSTALL_CACHE_DIR=/var/cache/opkssh ./install-linux.sh`\n\nIt can also be turned on in the config `/etc/opk/config.yml`\n\nWe also added a provider request times out of 10s. A hung provider used to stall verify ~2 minutes (past sshd’s LoginGraceTime); now a login falls back or fails in ~20s.\n\n## Audit JSON format \n\nWe changed the JSON format slightly. If you have scripts that expect a particular json format, test and update them before switching to this release\n\n## Changes\n\n• feat：add safe persistent JWKS cache @gflex (#628)\n• Make permissions --json emit only JSON and still fail @arpitjain099 (#646)\n• feat(inspect)：discover opkssh certificates when no path is given @choksi2212 (#635)\n• Speed up openssh version integration tests @EthanHeilman (#644)\n\n## 🐛 Bug Fixes\n\n• fix：Enable sshd\\_session\\_t when loading local SELinux policy files @EthanHeilman (#642)\n• Fix log and installer bug before release v0.19.0 @EthanHeilman (#648)\n\n## Dependencies \n\n• fix(deps)：Update go toolchain directive to v1.27.2 @[renovate[bot]](https://github.com/apps/renovate) (#609)\n• fix(deps)：Update opensuse/tumbleweed:latest Docker digest to 8732062 @[renovate[bot]](https://github.com/apps/renovate) (#639)"
