ReleaseNotes: "This fixes two security issues\n\nFixed in https://github.com/openpubkey/opkssh/pull/696\nOpenPubkey not checking Refreshed ID Token signatures when the OIDC_REFRESHED policy is set\nDiscovered by Dickson Wu (SEAL & CertiK)\nDiscovered by Anthropic's OSS Scanner, as vulnerability ANT-2026-X7RUMFKA\nDiscovered by Anthropic's OSS Scanner, as vulnerability ANT-2026-BZHD05ZU\n\nFixed in https://github.com/openpubkey/opkssh/pull/697\nPolicy enforcement not parsing group claims correctly in an edge case where there are too many colons in the policy. \nDiscovered by Dickson Wu (SEAL & CertiK)\nDiscovered by Anthropic's OSS Scanner, as vulnerability ANT-2026-JV3DZBYQ\n\n\n\n\n## Changes\n\n\n\n## 🐛 Bug Fixes\n\n• fix：group policy colon parsing bug @EthanHeilman (#697)\n• Deny login if email denylist is set and ID Token does not have an email @EthanHeilman (#684)\n\n\n## Deps\n\n• fix(deps)：Update release-drafter/release-drafter action to v7.11.0 @[renovate[bot]](https://github.com/apps/renovate) (#694)\n• fix(deps)：Update actions/setup-go action to v7.1.0 @[renovate[bot]](https://github.com/apps/renovate) (#695)\n• deps：openpubkey-v0.30.1 @EthanHeilman (#696)\n• fix(deps)：Update Docker @[renovate[bot]](https://github.com/apps/renovate) (#689)\n• fix(deps)：Update module go.opentelemetry.io/otel/trace to v1.47.0 [SECURITY] @[renovate[bot]](https://github.com/apps/renovate) (#693)\n• fix(deps)：Update Docker @[renovate[bot]](https://github.com/apps/renovate) (#687)\n• fix(deps)：Update peter-evans/create-pull-request action to v8.1.2 @[renovate[bot]](https://github.com/apps/renovate) (#688)\n• fix(deps)：Update Docker @[renovate[bot]](https://github.com/apps/renovate) (#685)\n• fix(deps)：Update opensuse/tumbleweed:latest Docker digest to d95ddcc @[renovate[bot]](https://github.com/apps/renovate) (#683)"
