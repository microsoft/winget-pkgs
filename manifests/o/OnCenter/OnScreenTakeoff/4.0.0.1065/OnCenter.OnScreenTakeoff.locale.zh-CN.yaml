ShortDescription: 面向工程项目的屏幕取量与估算工具，点选拖拽即可完成测量。
Description: |-
  On-Screen Takeoff 是众多工程造价人员使用的屏幕取量方案，用于在图纸上直接完成测量，降低成本、节省时间并提高精度。
  - 多条件取量：同时测量多种取量条件。
  - 点选拖拽：在图纸视图上直接创建面积、长度、计数与周长取量。
  - 自动计数、批注与标注：统计重复构件并在图纸上做标记。
  - 叠加显示：作业时把取量标记与图纸对照查看。
  - 样式与模板：复用测量样式，建立可重复使用的取量模板。
  - 自动命名：为识别到的构件自动命名。
