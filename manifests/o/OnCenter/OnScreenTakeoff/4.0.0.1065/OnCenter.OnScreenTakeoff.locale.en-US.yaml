  Known Issues
  These are carried over from previous versions:
  - ART3-4308 - OST - Removing annotations in the Image window when the Annotation and View window and View window are open does not update properly
  - TE-4400 (replaces ART3-4400 and ON-4728) - If you CUT and paste takeoff from one Page to another, the blue "takeoff" indicator does not get updated in the Page Navigator until you leave the Takeoff Tab and return (Case 02230614)
    - (ART3-4400/ON-4728 was fixed in 3.98.14, however it was determined that fix caused unforeseen issues with the Page Navigator so that fix has been reverted)

