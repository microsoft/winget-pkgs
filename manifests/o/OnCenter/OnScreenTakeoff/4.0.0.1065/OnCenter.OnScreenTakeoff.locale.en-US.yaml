ShortDescription: Point, click and drag takeoff and estimating for construction projects.
Description: |-
  On-Screen Takeoff is the takeoff solution used by thousands of construction professionals to reduce costs, save time and improve accuracy while estimating from plans on screen.
  - Multi-Condition Takeoff: measure several takeoff conditions at the same time.
  - Point, Click and Drag: create areas, lengths, counts and perimeter takeoffs directly on the plan view.
  - Auto Count Objects, Annotations and Callouts: count repeated objects and mark up the drawing.
  - Overlay: compare your takeoff marks against the plan as you work.
  - Styles and Templates: reuse measurement styles and set up repeatable takeoff templates.
  - Auto Name: name detected objects automatically.
Tags:
- construction
- estimating
- quantity-surveying
- takeoff
ReleaseNotes: |-
  As companies work on larger projects, sharing projects with a large number of pages (500+) could cause the exported OSP file to exceed 1GB which caused the export to fail. We’ve increased the limit to 2GB, which should cover most projects handily. For the estimator, this means you don’t need to create multiple exports for a single project.
  Please see Release Notes for Previous Versions (at the bottom of this article) for more recently added Features and Improvements.
  What’s New
  - OSP File Size Increased to 2GB - when exporting to an OSP Bid Package, the total file size limit has been increased to 2GB from 1GB.
    - See: On-Screen Takeoff - 16.05.03 Exporting to a Bid Package (*.osp file) for more information.
