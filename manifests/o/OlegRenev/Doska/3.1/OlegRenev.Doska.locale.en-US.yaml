ShortDescription: >-
  Cross-platform whiteboard with graphics tablet support, formulas,
  graphs and LaTeX labels.
Description: >-
  Doska is a lightweight whiteboard for Windows 10/11 and macOS:
  a large grid-patterned canvas you can write on with a mouse or a
  graphics tablet (pressure sensitivity, eraser on the pen's back end,
  e.g. Wacom Intuos). It draws straight lines and arrows with grid
  snapping, circles, coordinate axes, function graphs from formulas and
  implicit equations, plain-text and LaTeX labels. Images from the
  clipboard can be embedded, resized and rotated. Supports undo/redo,
  selection/move, copy/paste and PNG export.
