ReleaseNotes: |-
  New
  - Added help panel
  Changes
  - Changed annotation panel, comments panel and find panel to allow selecting side panel tab location when docking
  - Changed the message bar to include an ellipsis button when the text doesn't fit
  - Changed to add a setting to get the legacy print dialog on Windows 11
  - Changed to add a setting to save by copying data rather than moving files
  - Changed to add support for side panels remembering tab ordering when docking changes
  - Changed web content colour scheme to match light or dark mode
  Fixes
  - Fixed a drawing issue in unthemed Active Document toolbar customize
  - Fixed an application window sizing issue on some systems
  - Fixed an issue placing linked overlays on rotated PDF pages
  - Fixed checks to make sure popups are on screen not including under a task bar
  - Fixed comments panel and find panel not starting a drag when dragging the tab
  - Fixed message bar close button drawing at the wrong dpi when clicked if the dpi has changed
  - Fixed message bar close button background not erasing correctly
  - Fixed modes not downloading icons when the theme is changed
  - Fixed print preview in the print dialog not always deleting temporary files
  - Fixed side panel toolbars not always showing in the correct location
  - Fixed temporary files not being deleted after using Document Combine in the Unicode version
  - Fixed Trapeze caption sometimes drawing non-themed
  - Fixed View Projects not working when projects is docked in a side panel
