ShortDescription: ORION reads your PC and tells you what to play, with which settings, at what price. Free, no account, no ads.
Description: |-
  ORION gathers the games from Steam, Epic Games, GOG, Xbox, Ubisoft, EA and Battle.net in a single library.
  It works out the right graphics level for each game from your graphics card and display, and tells you what to pick
  in the game's menu, line by line, without ever writing to game files. With an NVIDIA graphics card, it also sets the
  driver for each game when you click (frame-rate limit, low-latency mode for DirectX 9 to 11 games, maximum performance), and puts it back in one click.
  It also tells you which games run well on your PC, compares prices across stores and lists the free games of the moment.
