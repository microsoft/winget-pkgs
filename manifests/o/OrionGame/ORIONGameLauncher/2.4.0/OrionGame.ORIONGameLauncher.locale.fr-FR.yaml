ShortDescription: ORION lit votre PC et vous dit quoi jouer, avec quels réglages, à quel prix. Gratuit, sans compte, sans publicité.
Description: |-
  ORION réunit dans une seule bibliothèque les jeux de Steam, Epic Games, GOG, Xbox, Ubisoft, EA et Battle.net.
  Il calcule le bon niveau graphique de chaque jeu d'après votre carte graphique et votre écran, et vous dit quoi
  choisir dans le menu du jeu, ligne par ligne, sans jamais écrire dans les fichiers du jeu. Avec une carte NVIDIA,
  il règle aussi le pilote pour chaque jeu, à votre clic (limite d'images, faible latence pour les jeux DirectX 9 à 11, performances maximales), et le remet comme avant en un clic.
  Il dit aussi quels jeux tournent bien sur votre PC, compare les prix de plusieurs boutiques et signale les jeux gratuits du moment.
