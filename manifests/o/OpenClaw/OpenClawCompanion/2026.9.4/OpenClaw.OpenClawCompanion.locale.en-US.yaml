ReleaseNotes: "OpenClaw Windows Hub v2026.9.4 ### Downloads - Installer (x64): OpenClawCompanion-Setup-x64.exe - Intel/AMD 64-bit - Installer (ARM64): OpenClawCompanion-Setup-arm64.exe - Windows on ARM (Surface, etc.) - Portable x64: OpenClawTray-2026.9.4-win-x64.zip - Portable ARM64: OpenClawTray-2026.9.4-win-arm64.zip ### Features - \U0001F99E System tray integration with gateway status - \U0001F504 Auto-updates from GitHub Releases - ✅ Code-signed with Azure Artifact Signing ### Requirements - Windows 10 version 1903 or later - WebView2 Runtime - OpenClaw gateway running locally ### Quick Start 1. Run the installer for your architecture 2. Launch from Start Menu or system tray 3. Right-click tray icon → Settings to configure ## What's Changed * feat: add Microsoft Store MSIX packaging by @natalie-aguinaldo in https://github.com/openclaw/openclaw-windows-node/pull/1328 * fix(local-ai): revert dedicated-memory admission caps for RTX Spark by @shanselman in https://github.com/openclaw/openclaw-windows-node/pull/1422 * docs: make PR descriptions plain-language first by @roboclaw-bot in https://github.com/openclaw/openclaw-windows-node/pull/1408 * fix(chat): avoid session-switch crashes without clipping Markdown lists by @karkarl in https://github.com/openclaw/openclaw-windows-node/pull/1426 * fix(setup): restore missing mascot and center gateway choices by @bkudiess in https://github.com/openclaw/openclaw-windows-node/pull/1427 ## New Contributors * @natalie-aguinaldo made their first contribution in https://github.com/openclaw/openclaw-windows-node/pull/1328 * @roboclaw-bot made their first contribution in https://github.com/openclaw/openclaw-windows-node/pull/1408 Full Changelog: https://github.com/openclaw/openclaw-windows-node/compare/v2026.9.3...v2026.9.4"
