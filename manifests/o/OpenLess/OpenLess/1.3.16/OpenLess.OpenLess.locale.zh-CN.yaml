ReleaseNotes: |-
  macOS 用户首次安装提示
  下载 DMG 拖入 /Applications 后，必须在终端运行：
  xattr -cr /Applications/OpenLess.app
  否则 Gatekeeper 会提示「OpenLess 已损坏」——这是因为当前 build 用 ad-hoc 签名、没做 Apple 公证。
  渠道说明
  - 以 -tauri 结尾的 tag 是正式版（自动推送给所有 in-app 检查更新的用户）。
  - 以 -beta-tauri 结尾或包含 -Beta.N-tauri 的 tag 是 Beta 版（GitHub 标 pre-release，不通过 in-app updater 推送给正式版用户；只对在「设置 → 关于 → 加入 Beta 渠道」开关切到 Beta 的用户可见，且需要手动从此页面下载安装）。
  行为变更提示
  - 流式输入默认开启；不兼容场景会自动回落到一次性插入。可在「设置 → 高级」关闭。
  - 流式输入成功后默认把最终文本同步到剪贴板，方便再次粘贴；可在「设置 → 高级」关闭。
  v1.3.16 更新内容
  这是 1.3.15 之后的正式版，包含多个新功能与修复（含 1.3.16-Beta.1 已验证的全部改动）：
  ✨ 新功能
  - 静音后自动停止（切换式录音模式专属，开关默认关闭）：检测到语音后，连续静音达到所选时长（1/1.5/2/3/4/5 秒）即自动结束并提交；一直没说话则 10 秒后自动取消。可在「设置 → 录音与输入 → 静音后自动停止」开启并选择静音时长（#860）。
  - ZenMux 语音转写：新增 ZenMux（JSON + base64）作为可选云端 ASR 提供商（#837）。
  - 自定义 OpenAI 兼容 ASR 预设：可在 ASR 提供商中选择「自定义 OpenAI 兼容」并配置高级参数（#854）。
  - 手动开关系统代理：网络设置中可手动启用/禁用系统代理（#869）。
  🛠 修复
  - 胶囊样式切换立即生效（Windows/Linux 修复）：此前在 Windows/Linux 上把胶囊样式切换为「Openless 默认风格」后仍显示流光 Siri 风格——样式原子只在录音 30Hz 帧循环里同步，Windows 主线程拥塞时整场录音都下发旧样式。现在设置保存即同步、prefs:changed 广播即时下发，切换后立即生效，录音中切换也当帧换肤；重启后样式保留（#912）。
  - GLM-ASR 纯井号占位过滤：GLM-ASR 在静音/弱音片段偶发返回仅含 # 的占位文本，现已归一化为空转写，不再把占位符当有效内容插入（#787 / #916）。
  - 热键冲突不再拒绝保存：升级时自动迁移停用冲突的默认键，保存时自动化解冲突，不再弹「冲突无法保存」（#904）。
  - 无麦克风提示：未检测到麦克风时明确提示，不再误报权限未授权（#779）。
  🎨 设置页动画与视觉统一
  - 录音方式分段选框（切换式 / 按住说话 / 自动）新增滑动指示动画，首次进入设置即正确高亮当前选项。
  - 静音后自动停止整组随录音方式切换从下方平滑拉出/收回；静音时长行随开关展开/收起，开关行不再因内联下拉而抽搐。
  - 静音时长下拉与麦克风下拉视觉统一（同底色、同宽度、右边缘对齐）；所有下拉框切换选项时新增值切换动画。
  - 检查更新弹窗的全屏遮罩大幅减淡：不再把设置页白色选项行盖成灰色。
  - 无障碍：折叠状态下的控件移出键盘焦点与读屏树（inert）。
  下载与安装
  按你的平台选择对应安装包：

  | 平台          | 架构                 | 安装包                                                                                       |
  | ------------- | -------------------- | -------------------------------------------------------------------------------------------- |
  | macOS         | Apple 芯片（M 系列） | OpenLess_1.3.16_aarch64.dmg                                                                  |
  | macOS         | Intel                | OpenLess_1.3.16_x64.dmg                                                                      |
  | macOS（任意） | -                    | OpenLess_aarch64.app.tar.gz / OpenLess_x86_64.app.tar.gz（免安装解压版）                     |
  | Windows       | x64                  | OpenLess_1.3.16_x64-setup.exe（NSIS 安装器）或 OpenLess_1.3.16_x64_en-US.msi                 |
  | Linux         | x64                  | OpenLess_1.3.16_amd64.deb / .rpm / .AppImage，fcitx5 用户另装 libopenless.so + openless.conf |
  | Android       | -                    | OpenLess_1.3.16_arm64-v8a.apk（另有 armeabi-v7a / x86_64 / x86）                             |

  正式版会通过 in-app 更新推送给所有用户（设置 → 关于 → 检查更新）。
  测试重点
  1. 设置 → 录音与输入：胶囊样式切换后立即生效；重启应用样式保留。
  2. 录音方式在「按住说话 ↔ 切换式」之间切换：静音后自动停止整组平滑拉出/收回。
  3. 切换式模式下开启「静音后自动停止」：静音时长行展开动画，选 3 秒后说话→停顿→自动提交。
