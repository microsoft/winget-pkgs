ReleaseNotes: |-
  OpenLess 2.0.1+build.20261016
  本正式版包含已发布 Beta7 的修复，使用 Stable 更新源。
  修复
  - 恢复 macOS 苹果系统语音识别，修复多模态流结束后继续转圈和等待响应时无法及时取消。
  - 为本地推理设置 CPU 平均预算与线程上限，保留 Metal / Core ML 加速路径。
  - 所有可配置快捷键允许清空、保存后保持未绑定；删除重复的「Mac 听写键」入口，保留 Fn；补齐 Linux 注销旧快捷键行为。
  - 下拉菜单及快捷键录制面板在控件下方展开，修复可搜索长菜单首帧定位。
  - 自建同步服务器的地址、Token 与保存入口移至「实验与扩展 → 自建同步服务器（高级）」，已有配置不变。
  - 修复带日期构建号的 Windows MSI 打包：仅 MSI ProductVersion 使用数字值，应用及更新清单保留完整版本。
  下载与升级
  - macOS 要求 14 Sonoma 或更新版本；Apple Silicon 选 aarch64 DMG，Intel 选 x64 DMG。
  - 当前 macOS 包使用 ad-hoc 签名、未做 Apple 公证。拖入 Applications 后，按现有分发方式执行：
    xattr -cr /Applications/OpenLess.app
  - Windows 提供 x64 NSIS 和 MSI 安装包，未做发布者证书签名。
  - Android 提供 arm64-v8a、armeabi-v7a、x86、x86_64 签名 APK；按设备选择，支持同签名覆盖安装。
  - Linux 包仍需独立产品验收，本次不附加。
  来源与核验
  功能修复 #1207、设置修复 #1208、正式版晋级 #1212。标签 v2.0.1-tauri 固定于 33d17a4e，未移动旧 Beta6 / 2.0.0 标签；精确源码 CI 七项通过，main CI 同样通过。
  macOS 构建、Android 四 ABI 构建；原 Windows runner 在 MSI 安装时退出，采用 CI 主机隔离修复 #1213 与 MSI 成功返回值修正 #1215 后，仅对相同不可变标签执行 Windows-only 构建及 NSIS/MSI 安装、IME 注册验证，该任务已全部通过，不更换应用源码、不重建成功的平台。
  发布前核对 31 项原始资产 SHA-256、7 项更新签名和 14 项 Stable 渠道清单，两个 macOS DMG 的完整性、包签名、版本、架构和最低系统要求通过；附 SHA256SUMS。自动化构建/安装器 smoke 不冒称所有真机功能均已验收。Beta7 已先行公开。
