ShortDescription: A modern SVN client built with Tauri, Vue 3, and TypeScript
Description: OrcaSVN is a modern SVN workbench that provides a graphical interface for managing Subversion repositories. Built with Tauri for native performance, Vue 3 for the frontend, and TypeScript for type safety. Features include workspace management, commit, update, diff, blame, log viewing, and more.
