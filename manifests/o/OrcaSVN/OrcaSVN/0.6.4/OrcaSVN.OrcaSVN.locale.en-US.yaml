ReleaseNotes: |-
  OrcaSVN v0.6.4
  自 v0.6.3 以来的修复
  - macOS 和 Linux 上的 SVN 子进程使用 UTF-8 locale，避免桌面启动时继承缺失、ASCII 或无效的 locale 导致中文路径、仓库 URL、提交说明及命令输出编码错误。此修复针对 #7 报告的中文文件名问题。
  - 增加真实本地仓库回归测试：在缺失、ASCII 和无效的父进程 locale 下检出中文工作副本路径、添加并提交中文文件与提交说明，再检出中文子目录 URL 并核对文件内容。
  Linux 上已复现 locale 导致的中文路径失败，回归测试在修复后通过。原报告中的 macOS 15.7.4 / SVN 1.15.0 GUI 错误仍需报告者确认；问题保持打开。
  Fixes since v0.6.3
  - Run SVN subprocesses with a UTF-8 locale on macOS and Linux so missing, ASCII, or invalid inherited locales do not corrupt Chinese paths, repository URLs, commit messages, or command output. This addresses the filename encoding problem reported in #7.
  - Add a real local-repository regression test covering checkout to Chinese working-copy paths, adding and committing Chinese filenames and messages, and checking out a Chinese subdirectory URL under each affected parent locale configuration.
  The locale-related Chinese-path failure was reproduced on Linux, and the regression test passes with the fix. Confirmation of the original GUI errors on macOS 15.7.4 with SVN 1.15.0 is still requested from the reporter; the issue remains open.
  Downloads / 下载
