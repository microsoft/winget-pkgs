Description: |-
  ownAI is a privacy-first desktop AI agent that maintains a continuous, evolving relationship with its user.
  It features a hierarchical memory system, self-programming (programs in JavaScript, with tool functions and apps), projects with sandboxed commands, scheduled tasks, sub-agents, and provider-agnostic LLM integration (local models, Anthropic, OpenAI, Ollama, ownAI Credits).
