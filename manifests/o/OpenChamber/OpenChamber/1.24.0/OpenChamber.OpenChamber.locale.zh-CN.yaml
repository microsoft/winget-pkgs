ShortDescription: 基于 OpenCode AI 编码智能体的智能开发环境。
Description: |-
  OpenChamber 是围绕 OpenCode AI 编码智能体构建的智能开发环境。它以桌面应用、本地 Web 和 PWA 界面以及编辑器扩展的形式提供，让你可以在桌面、浏览器或手机上运行并跟进 OpenCode 会话。桌面应用支持带有独立面板、页面和聊天操作的扩展，并提供主题以及管理 OpenCode 项目的工具。

  使用 OpenChamber，你能做什么

  自主运行的目标
  通过“会话目标”（Session Goals）为会话设定终点。OpenChamber 会在每轮交互后检查结果，并让智能体持续工作，直到它达成目标、遇到阻碍或达到你设定的上限。即便关闭应用，它也能继续运行。
  对比并合并运行结果
  使用 Multi-run 将同一任务同时分配给多达五个模型，每个模型都有独立的会话，并可选用独立的工作树（worktree）。直观查看每个模型的实际构建成果，挑选最佳结果，或通过 Fusion 将各方案的优势部分融合进一个全新会话。
  引导式变更导览
  “变更导览”（Changes Walkthrough）将庞大的 diff 转化为由 AI 引导的代码变更导览。它将相关的修改按逻辑归纳为步骤，依循易于理解的顺序呈现，并解释各个部分如何协同运作。
  实时检查运行中的应用
  通过 Preview 在对话旁打开你的应用。只需点击指定元素，即可将该元素的截图、样式、位置以及浏览器报错信息发送给智能体。再也不用费劲解释“就是这里的这个东西”。桌面客户端还能对其内置浏览器中的任意网页执行相同操作。
  贯穿 Issue 到 PR 的 GitHub 上下文
  直接基于带有完整上下文的 GitHub Issue 或 Pull Request 开启会话。将未通过的检查或评审意见发回给智能体，然后直接在 OpenChamber 内更新或合并 Pull Request。
  跨设备无缝续接
  可在桌面端、Web/PWA、VS Code、iOS 或 Android 上打开相同的项目与会话。随时查看进度、回答问题、审查变更，并重新连接正在运行的终端。
  私密远程访问
  通过一次性二维码配对设备，并通过 Private Relay 连接，无需开放端口或暴露公网服务器。连接全程端到端加密，并可随时撤销。同时支持直连、局域网/VPN 访问、Cloudflare/Ngrok 隧道以及 SSH 连接。
  跨项目追踪工作进展
  清晰掌握哪些会话正在运行、等待、已完成或失败，并可查看审批、定时任务、服务商限制、Token 使用量及成本。将会话整理至文件夹，并随手记录笔记、待办事项和可复用的项目操作。
  安排周期性任务
  支持单次、按天、按周或通过 cron 定时运行提示词。定时任务可结合“会话目标”使用，从而持续推进直至达成结果，而非在单次响应后即刻停止。
