ReleaseNotes: |-
  v2026.9.11
  Highlights
  - Organize project to-dos and queued work with the task board, updated task details, and clearer sidebar status.
  - Connect more services with guided setup, task-scoped permissions, and API Key access for credit-based connectors.
  - Browse inside Orkas with tabs, persistent sign-ins, and improved browser recovery after restarting.
  Improvements
  - Respond to local coding-agent questions and cancel pending input without losing the surrounding task.
  - Use updated built-in workflows for Office documents, visual content, and website analysis.
  Fixes
  - Recover conversation history without duplicate replies, and preserve newer drafts while earlier messages are being sent.
  - Keep search results working after a restart and restore missing download addresses for built-in marketplace updates.
  - Keep keyboard focus where you place it and improve connector status labels and task-board keyboard controls.
  Full changelog
  Compare v2026.8.29...v2026.9.11
