ReleaseNotes: |-
  v2026.10.27
  Download
  Download Orkas
  Highlights
  - Configure a complete set of public image and video models with your own provider keys, alongside existing Orkas API services.
  - Connect custom models through OpenAI Responses, Chat Completions or Anthropic protocols, with clearer capacity validation and credential recovery.
  - Create, edit and preview local apps while keeping publishing and project invitations clearly separated from local work.
  Improvements
  - Open saved automations and linked to-dos directly from their cards, with more reliable task history and recovery.
  - Work more reliably with local CLI agents, Library imports, document processing and interrupted operations.
  Fixes
  - Preserve captured speech and existing drafts through voice-input startup, completion and interruption, with clearer connecting and recording states.
  - Keep model choices, saved credentials and provider-specific image and video settings consistent after restarting the app.
