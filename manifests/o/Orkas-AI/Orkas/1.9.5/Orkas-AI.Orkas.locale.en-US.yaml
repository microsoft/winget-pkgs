Description: Orkas is an open-source, local-first AI desktop app. A commander LLM directs specialist sub-agents and runs your installed coding CLIs, such as Claude Code, Codex, OpenCode, OpenClaw and Hermes, as local sessions. Agents self-evolve via reflection and skill crystallization, and you bring your own keys.
