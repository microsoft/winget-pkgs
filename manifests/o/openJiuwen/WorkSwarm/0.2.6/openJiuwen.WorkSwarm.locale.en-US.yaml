Description: WorkSwarm is the agent orchestration tool of the openJiuwen agent platform. It offers personal-assistant, coding, and swarm modes, connects to channels such as Xiaoyi, Feishu, DingTalk, and Telegram, coordinates multiple agents through Agent Swarm with shared skills, and keeps evolving from execution traces and feedback signals. The product is a workflow-orchestration tool only and contains no AI model capability.
