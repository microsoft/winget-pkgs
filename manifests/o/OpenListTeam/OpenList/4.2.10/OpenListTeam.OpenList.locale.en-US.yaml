ReleaseNotes: |-
  🚀 Features
  - drivers: Add CtFile OpenAPI driver - by @SenkjM, Grok Bot, Claude Opus 5.5, @Suyunmeng and LunelleEverdawn in https://github.com/OpenListTeam/OpenList/issues/3214 (f33a2)
  - drivers/onedrive_app: Support mounting SharePoint site document library - by @AkashiCoin and Claude in https://github.com/OpenListTeam/OpenList/issues/3252 (4780b)
  - media: Scan every folder level, save incrementally, TV tags, seed task progress - by @PIKACHUIM and Claude Opus 5.5 in https://github.com/OpenListTeam/OpenList/issues/3263 (ef5d8)
  - sso: Add Feishu login support - by @makotowu in https://github.com/OpenListTeam/OpenList/issues/3202 (de1cd)
  🐞 Bug Fixes
  - auth:
    - Match SQLite username constraint errors - by @Suyunmeng and LunelleEverdawn in https://github.com/OpenListTeam/OpenList/issues/3295 (e7b6f)
  - deps:
    - Update module gorm.io/driver/postgres to v1.6.3 - in https://github.com/OpenListTeam/OpenList/issues/3269 (beb3b)
    - Update module github.com/rclone/rclone to v1.75.2 - in https://github.com/OpenListTeam/OpenList/issues/3287 (ac8e9)
  - drivers/115:
    - Retry upload init after decrypt failures - by @Suyunmeng and LunelleEverdawn in https://github.com/OpenListTeam/OpenList/issues/3268 (6aeaf)
    - Handle multipart upload failures safely - by @Suyunmeng and LunelleEverdawn in https://github.com/OpenListTeam/OpenList/issues/3312 (05d3f)
  - drivers/guangyapan:
    - Return list errors instead of an empty folder - by @DIYgod and Claude Opus 5.5 in https://github.com/OpenListTeam/OpenList/issues/3326 (db581)
  - drivers/local:
    - Handle cross-device recycle bin deletes - by @Suyunmeng and LunelleEverdawn in https://github.com/OpenListTeam/OpenList/issues/3304 (25da9)
  - drivers/onedrive:
    - Refresh token on drive quota query and retry only once - by @Vurliy, Vurliy and Claude Opus 5.5 in https://github.com/OpenListTeam/OpenList/issues/3335 (d09af)
  - drivers/quark_open:
    - Stop treating content_hash as SHA1 - by @sevxn007 and Codex in https://github.com/OpenListTeam/OpenList/issues/3340 (9f170)
  - fs:
    - Restore the provider field in fs list responses - by @somaz94, Claude and @Suyunmeng in https://github.com/OpenListTeam/OpenList/issues/3209 (74320)
  - local:
    - Normalize the storage root of the directory size map to prevent upload stall - by @one-squared in https://github.com/OpenListTeam/OpenList/issues/3310 (8d8c0)
  - op:
    - Do not report a failed listing as a missing object - by @jayhemnani9910 in https://github.com/OpenListTeam/OpenList/issues/3339 (845f9)
  - seed:
    - Make 189 CAS rapid upload carry the right file, hashes and slice size - by @PIKACHUIM in https://github.com/OpenListTeam/OpenList/issues/3341 (b8ab7)
  - sharing:
    - Count share access atomically per client IP - by @awaae001 in https://github.com/OpenListTeam/OpenList/issues/3294 (78c5d)
    - Hide physical paths in download errors - by @Suyunmeng and LunelleEverdawn in https://github.com/OpenListTeam/OpenList/issues/3322 (e7282)
  - storage:
    - Persist rotated tokens reliably and enable sqlite WAL - by @PIKACHUIM in https://github.com/OpenListTeam/OpenList/issues/3344 (f2dcf)
  - stream:
    - Automatically resume interrupted source streams - by @awaae001 in https://github.com/OpenListTeam/OpenList/issues/3324 (e9839)
  - webdav:
    - Return the request URL as the LOCK lockroot - by @jayhemnani9910 in https://github.com/OpenListTeam/OpenList/issues/3288 (564e3)
