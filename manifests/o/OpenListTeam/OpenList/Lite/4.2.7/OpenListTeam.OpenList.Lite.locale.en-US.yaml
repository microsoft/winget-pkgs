ReleaseNotes: |-
  🚀 Features
  - drivers/139:
    - Support uploading large files up to 500 GB - by @glsname and Codex in https://github.com/OpenListTeam/OpenList/issues/3115 (3d3d1)
    - Make the API client type configurable - by @PIKACHUIM in https://github.com/OpenListTeam/OpenList/issues/3196 (3b282)
  - drivers/guangyapan:
    - Add md5-based instant upload support - by @PIKACHUIM and PIKACHUIM in https://github.com/OpenListTeam/OpenList/issues/3034 (6ad44)
  - drivers/pikpak:
    - Auto re-login with username/password when tokens expire - by @wray-lee in https://github.com/OpenListTeam/OpenList/issues/3001 (e73a8)
  - local:
    - Add PDF thumbnails on macOS - by @flyingrtx2333, Codex and @ILoveScratch2 in https://github.com/OpenListTeam/OpenList/issues/3017 (f18b4)
  - server/s3:
    - Support multipart upload - by @xrgzs in https://github.com/OpenListTeam/OpenList/issues/2813 (6247c)
  - task:
    - Persist task timestamps across restarts - by @fryeggs and OpenAI Codex in https://github.com/OpenListTeam/OpenList/issues/2914 (d6109)
  🐞 Bug Fixes
  - Harden request handling for files, search, proxy and SSO - by @ILoveScratch2 and PIKACHUIM (ea106)
  - 115_open:
    - Refresh expired OSS credentials during upload - by @xqmmcqs and Codex in https://github.com/OpenListTeam/OpenList/issues/3063 (d894a)
  - alist_v3:
    - Set child paths so nested directories resolve - by @Elity and Claude in https://github.com/OpenListTeam/OpenList/issues/3019 (4580c)
  - aliyundrive:
    - Limit callback concurrency - by @nostalume and Codex in https://github.com/OpenListTeam/OpenList/issues/3071 (89345)
  - build:
    - Update cgo-actions version to v1.3.0 and fallback FreeBSD version to 14.4 - by @elysia-best in https://github.com/OpenListTeam/OpenList/issues/3130 (c1670)
  - deps:
    - Update module github.com/rclone/rclone to v1.75.1 - in https://github.com/OpenListTeam/OpenList/issues/3035 (eee91)
  - drivers/139:
    - Improve mail login credential renewal - by @UcnacDx2 in https://github.com/OpenListTeam/OpenList/issues/3029 (d90d8)
  - drivers/189:
    - Decode JSON strings before parsing timestamps - by @jyxjjj and Codex in https://github.com/OpenListTeam/OpenList/issues/3033 (c3d3d)
  - drivers/189pc:
    - Align login with the official PC client - by @naiyQAQ and Claude Opus 5 (1M context) in https://github.com/OpenListTeam/OpenList/issues/3105 (4c39b)
    - Preserve file extension during family transfer - by @qcnhy and Codex in https://github.com/OpenListTeam/OpenList/issues/3083 (61e53)
  - drivers/lanzou:
    - Support new /fn download page structure - by @rzsgsfm, rzsgsfm and GLM (ZCode CLI) in https://github.com/OpenListTeam/OpenList/issues/3157 (e1d88)
  - drivers/s3:
    - Sign content-type for direct uploads - by @mumingluan and Codex in https://github.com/OpenListTeam/OpenList/issues/3152 (6bb4c)
  - fs:
    - Return FOLDER type for directories in fs/get responses - by @ZRHann in https://github.com/OpenListTeam/OpenList/issues/3114 (6c600)
    - Only list parent dir for related objs when file is video - by @ZRHann in https://github.com/OpenListTeam/OpenList/issues/3113 (9de3f)
  - ftp:
    - Handle EOF and detect content type from read bytes - by @awaae001 in https://github.com/OpenListTeam/OpenList/issues/3125 (40f4f)
  - internal/db/searchnode:
    - Fix index update path - by @ILoveScratch2 in https://github.com/OpenListTeam/OpenList/issues/3128 (54ae9)
  - net:
    - Preserve cancellation errors during partitioned downloads - by @nostalume in https://github.com/OpenListTeam/OpenList/issues/3090 (1462d)
    - Handle gzip reader error on error response decoding - by @awaae001 in https://github.com/OpenListTeam/OpenList/issues/3179 (48246)
  - op:
    - Enforce link cache lifecycle policy - by @nostalume, nostalume and Codex in https://github.com/OpenListTeam/OpenList/issues/3101 (56064)
  - release:
    - Fetch frontend assets from edge - by @jyxjjj and Codex in https://github.com/OpenListTeam/OpenList/issues/3052 (55530)
  - s3:
    - Default upload content types and return partial content - by @jyxjjj and Codex in https://github.com/OpenListTeam/OpenList/issues/3053 (d9d8a)
    - Encode multipart fixture paths - by @nostalume, nostalume and Codex in https://github.com/OpenListTeam/OpenList/issues/3074 (5447e)
    - Close ranged response bodies - by @nostalume in https://github.com/OpenListTeam/OpenList/issues/3095 (b51d1)
    - End common prefixes with a slash - by @zeroornull, zeroornull and @cursoragent in https://github.com/OpenListTeam/OpenList/issues/3174 (f2774)
  - teldrive:
    - Use a valid root path for listings - by @spark-328 in https://github.com/OpenListTeam/OpenList/issues/3108 (cadbf)
  - webdav:
    - Honor conditional PUT requests - by @jyxjjj and Codex in https://github.com/OpenListTeam/OpenList/issues/3066 (8cfe9)
