ShortDescription: Local-first desktop mail client and AI agent mailbox workspace for Windows.
Description: |-
  OmniMail is a local-first desktop mail client and AI agent mailbox workspace for Windows. It keeps credentials, message bodies and the full-text index on your own disk, requires no vendor cloud account and reports no telemetry.
  It ships presets for more than 18 mailbox families: the Linux.do community mailbox, the Meta Muse (@muse.ai) and Tencent WorkBuddy agent mailboxes, eight personal providers including Gmail, Outlook, QQ Mail, NetEase 163 and 126, iCloud, Yahoo, Yandex and Naver, six enterprise providers, and generic IMAP and SMTP access with DNS MX auto-detection for self-hosted mail.
  Built-in translation needs no API key and preserves the original tables, buttons and code formatting of a message. The bring-your-own-key assistant supports OpenAI, Anthropic Claude, Google Gemini, DeepSeek, local Ollama and any OpenAI-compatible endpoint behind a five-step PrivacyGuard that blocks sensitive messages, redacts personal data and never sends a reply for you.
  The installer registers mailto handling together with .eml and .ics associations, and the local mail data directory is kept when you uninstall.
