PackageIdentifier: OmniMail.OmniMail
PackageVersion: v0.0.1
PackageLocale: zh-CN
ShortDescription: 本地优先、零云端上传的桌面邮件与 AI Agent 邮箱工作台。
Description: |-
  OmniMail 是面向 Windows 的本地优先桌面邮件与 AI Agent 邮箱工作台。凭据、邮件原文与全文索引全部保存在本机磁盘，不设厂商云端账号，零遥测上报。
  内置 18 家以上邮箱预设：Linux.do 社区邮箱、Meta Muse（@muse.ai）与腾讯 WorkBuddy 智能体邮箱，Gmail、Outlook、QQ 邮箱、网易 163 与 126、Apple iCloud、Yahoo、Yandex、Naver 等个人邮箱，六家主流企业邮，以及通过 DNS MX 记录自动识别服务器参数的通用 IMAP 与 SMTP 自建邮局。
  免配置保真翻译无需填写任何密钥即可将外文邮件原地译为中文，并保留原邮件的表格、按钮与代码样式；BYOK AI 助手支持 OpenAI、Claude、Gemini、DeepSeek、本地 Ollama 与自定义兼容端点，受 5 步 PrivacyGuard 约束，硬拦截敏感邮件、强制脱敏且绝不代发。
  安装程序会注册 mailto 协议与 .eml、.ics 文件关联；卸载时默认保留本地邮件数据目录。
