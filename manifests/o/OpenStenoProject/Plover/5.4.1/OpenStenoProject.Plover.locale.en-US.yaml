ReleaseNotes: "# Plover v5.4.1\n\n## ⚠️ Important Notice\n\nVersion 5 updates the graphical interface library from PyQt5 to PySide6, which means graphical plugins need to be migrated.\nPlease check the [Unsupported Plugins List](https://github.com/openstenoproject/plover_plugins_registry/blob/master/unsupported.json) before installing this version.\n\n## Installation\n\nTo install Plover, please follow the [Installation Guide](https://plover.wiki/index.php/Installation_Guide) on our wiki.  \n\n## Changelog\n\n### Features\n\nNo significant changes.\n\n### Bugfixes\n\n#### Core\n\n• Fix RTF dictionary export failing on characters outside code page 1252; they are now escaped with the RTF `\\uN` control word. (#1705)\n• Treat unbound keys as no-op. (#1850)\n\n#### User Interface\n\n• Fix `_pythonToCppCopy：Cannot copy-convert <set> to C++` warnings on startup. (#1854)\n• Fix the Traditional Chinese translation never loading on case-sensitive filesystems. (#1859)\n• Fix a crash when showing an error dialog during a failed startup. (#1863)\n\n### API\n\nNo significant changes.\n\n## Release History\n\nFor a detailed list of changes in this and all previous versions, see [NEWS.md](https://github.com/openstenoproject/plover/blob/v5.4.1/NEWS.md)."
