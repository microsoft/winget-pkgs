ShortDescription: DICOM viewer and metadata editor for research and education.
Description: |-
  OmniDICOM is a desktop DICOM viewer and metadata editor for research and education.
  Features include study comparison, measurements, cine playback, MPR, MIP, 3D volume rendering, DSA subtraction, DICOM tag editing, PACS and DICOMweb transfer, and image, video, DICOM and STL export.
  Professional adds stacked image filters and analysis tools including histograms, profiles and time-intensity curves.
  A 14-day Professional trial starts at first launch. Trial exports have limitations; unrestricted use requires a paid licence.
  OmniDICOM is not a medical device and is not intended for diagnosis or clinical decision-making.
