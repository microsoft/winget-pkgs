ReleaseNotes: |-
  What's New in WebLogic Remote Console 3.0.6
  - Added support for setting security feature gates to control the implementation of security enhancements with potentially breaking changes. For more information, see What's New in Oracle WebLogic Server for 15.1.1.0.0, 14.1.2.0.0., 14.1.1.0.0, or 12.2.1.4.0 . Available security feature gates differ by WebLogic Server release.
  - Added support for moving messages from queues to topics on the same JMS server.
  - Enhanced the Restrict Content Based on Role behavior as follows:
    - Disabling Restrict Content Based on Role is now supported on Hosted WebLogic Remote Console. Change its behavior using the WLST command RemoteConsoleHelperMBean.setRestrictContentBasedOnRoles().
    - A new system property, console.restrictContentBasedOnRoles, lets users temporarily override the domain configuration setting.
    - Improved general error handling when a user without the proper permissions is denied access.
  Bug Fixes
  - Fixed issue that caused some operations, such as testing on JDBC data sources, to trigger a JSON parsing error.
  - When connected to a 15.1.1.0.0 domain, links to WebLogic Server documentation pointed to the incorrect version.
  - Setting Custom Identity Key Store Pass Phrase in Channel Security erroneously triggered a validation error.
  - Fixed issue where the Use Server Cert for Outbound option was read-only unless Use Client Cert for Outbound was temporarily enabled.
  - Fixed issue where turning on Default Targeting Enabled on JMS Connection Factories when no Sub Deployment Names were configured incorrectly triggered an error.
    - Any JMS resources that support default targeting are now handled and viewed based on the state of their default targeting attribute.
  - Misc. UI improvements.
  NOTE: Occasionally, WebLogic Remote Console may be affected by security vulnerabilities, either directly or indirectly through WebLogic Server. To maintain the security of your systems, you should install the latest Desktop WebLogic Remote Console, or if you are using Hosted WebLogic Remote Console, install the latest applicable Critical Patch Update (CPU) or Critical Security Patch Update (CSPU) for WebLogic Server. For more information and a list of products affected in the latest patch, see Oracle Critical Patch Update Advisory - October 2026.
