Description: With easy-to-use presets for the 2.4, 5 or 6 GHz bands used by Wi-Fi 7, Chanalyzer Lite makes it a snap to spot interference from Wi-Fi and non-Wi-Fi transmitters. Get a realtime look at transmitters with the Density View. See how transmissions change over time with the Waterfall View. Highlight signals of interest with configurable Markers. Chanalyzer Lite is a free download for Windows or Mac, and supports Wi-Spy Lucid and WiPry spectrum analyzer devices.
