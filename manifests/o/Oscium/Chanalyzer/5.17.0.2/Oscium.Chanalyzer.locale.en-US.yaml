ShortDescription: Visualize your radio frequency (RF) spectrum
Description: Chanalyzer unlocks the full potential of your Wi-Spy or WiPry Clarity spectrum analyzer. Dial in spectrum analysis settings to see every detail. Detect and locate sources of Wi-Fi and non-Wi-Fi interference. Optimize your Wi-Fi and monitor your 2.4, 5 and 6 GHz networks in real time. Identify congestion and channel saturation. Record spectrum data for later analysis. Tag interference events with notes and images. Report on your findings with easy-to-use templates and content blocks.
