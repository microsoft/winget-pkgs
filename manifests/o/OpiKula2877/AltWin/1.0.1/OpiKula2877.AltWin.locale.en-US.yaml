ShortDescription: Tap Alt to see the other local accounts on your PC and switch to one. Share folders between accounts.
Description: |-
  A small background app for PCs with several local Windows accounts. A tap of Alt opens a blue popup with the
  other accounts; Switch locks the PC so you can sign in to the chosen account with its own password or PIN.
  Settings let an admin add and remove accounts, share folders (for example a game library) with other accounts,
  and set per-account options such as idle lock, daily time limits, sign-in hours and disk limits.
  Works on Windows Home and Pro. Never stores or bypasses passwords.
