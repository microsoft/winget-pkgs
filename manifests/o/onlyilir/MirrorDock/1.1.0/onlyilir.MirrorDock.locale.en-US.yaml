ShortDescription: See and control your Android phone from your Windows PC.
Description: |-
  MirrorDock mirrors an Android phone to Windows over USB or Wi-Fi with its own phone engine.
  H.264 video, phone sound, mouse and keyboard control, two-way clipboard, drag and drop,
  MP4 recording, a phone file browser, apps in their own windows, game controller support
  and phone notifications on the PC. Free and open source, no account.
