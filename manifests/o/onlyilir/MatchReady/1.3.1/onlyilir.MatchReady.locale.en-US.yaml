ShortDescription: One button to get your PC ready for a CS2 match. FACEIT-safe.
Description: |-
  Match Ready closes background apps that use RAM, CPU or graphics memory, pauses noisy Windows services
  (Windows Update, search indexing, telemetry) and switches to the High performance power plan while you play
  Counter-Strike 2, then puts everything back. Auto mode boosts when CS2 starts and restores when it closes.
  It never touches the game or any anti-cheat, and every change is undone on restore or reboot.
  Free and open source. Not affiliated with Valve or FACEIT.
