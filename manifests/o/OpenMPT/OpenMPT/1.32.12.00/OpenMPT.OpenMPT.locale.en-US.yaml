ReleaseNotes: |-
  Pattern tab:
  - [Fix] <js> Volume column portamento effect memory was not updated properly during seeking, causing notes to play at the wrong pitch when resuming playback.

  Sample tab
  - [Fix] <js> Mix paste / Insert paste didn't keep the sample path of the original sample.
  - [Fix] <jh & js> Fixed potential crash when loading malformed IMA ADPCM encoded WAV samples, and improved correctness of IMA ADPCM decoder, including broken stereo samples written with libsndfile.
  - [Fix] <jh> FLAC samples with a non-multiple-of-8 bit depth were loaded too quietly.
  - [Fix] <jh> Fixed potential crash when loading FLAC samples containing bit depth changes mid-stream.

  Instrument tab
  - [Fix] <js> Fixed crash when receiving pitch bend messages via MIDI (tx pastel).

  MPTM
  - [Fix] <jh> Fixed potential crash when reading malformed Geometric tunings (old format).

  Stream Export
  - [Fix] <jh> When writing ID3v2.3 tags using LAME API (this is not the default configuration), write full UTF-16 instead of truncating to ISO8859-1 encoding.

  Misc
  - [Fix] <js> SF2: Allow loading samples with undefined "linked" sample type (http://bugs.openmpt.org/view.php?id=1988).
  - [Fix] <js> Fixed crash when launching OpenMPT with a file as command-line parameter that fails to load, while then also trying to open a second file (e.g. via Explorer).

  Third-Party Libraries
  - [Imp] Update LAME (v4.0)
