PackageIdentifier: OSCHINA.MothX
PackageVersion: 1.3.107
PackageLocale: zh-CN
ShortDescription: 整体打包为单个文件的终端 AI 编码助手。
Description: |-
  MothX 将提供商、工具、沙箱、会话与技能打包为单个文件，开箱即用，无需重复搭建部署 Claude Code、Codex、Claw 与 Channels 环境。默认使用 DeepSeek，同时兼容 OpenAI 与 Anthropic 接口。
  提供三种模式：计划模式为只读分析与规划，不写入文件；代理模式对项目进行受控读写，Bash 需要批准；YOLO 模式拥有完全系统访问权限。
