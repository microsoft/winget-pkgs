ShortDescription: A terminal AI coding assistant packed into a single binary.
Description: |-
  MothX packs providers, tools, sandbox, sessions and skills into one file, so you stop switching between Claude Code, Codex and the rest. It defaults to DeepSeek and speaks OpenAI and Anthropic compatible APIs too.
  It runs in three modes: Plan is read-only analysis with no file writes, Agent gives controlled read-write access with approval for bash, and YOLO gives full access.
