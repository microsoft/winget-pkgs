ShortDescription: Revit add-in that learns your commands and workflows and turns them into one-click buttons, macros and shortcut suggestions
Description: |-
  Smart Shortcuts is a Revit add-in that learns which commands you use, finds repeated single commands and multi-step workflows, and turns them into one-click ribbon buttons, saved macros and keyboard shortcut suggestions. Macro steps can carry amounts: the add-in learns how far you usually extend, offset, move or copy and offers those values when the macro runs. Supports Revit 2022-2027.
