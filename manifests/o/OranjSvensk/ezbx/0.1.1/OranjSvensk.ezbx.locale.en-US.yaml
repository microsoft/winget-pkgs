ShortDescription: Boxed-up local AI agents — run AI coding and assistant harnesses in an isolated Docker sandbox.
Description: |-
  ezbx lets you run AI coding and assistant tools (Pi, OpenCode, oh-my-pi, Codex CLI, Claude Code, Hermes Agent and OpenClaw) inside an isolated, unprivileged Docker sandbox while your local inference engine runs on your machine. Includes an egress-controlled gateway, automatic workspace snapshots and rewind, and guided setup via ezbx init.
