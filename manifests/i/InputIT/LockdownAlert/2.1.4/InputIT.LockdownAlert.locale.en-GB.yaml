ShortDescription: Full-screen lockdown alerts on every PC, started from a phone, a panic button or the systems you already have.
Description: |-
  Lockdown Alert puts a full-screen, full-volume alert on every Windows PC at a school or business the moment a lockdown is raised, from the portal, the mobile app, a Bluetooth panic button or an integration such as the phone system or access control. The alert shows the organisation's own wording and colours, plays its chosen sound, and clears everywhere with one ALL CLEAR. Test drills use a separate design so staff can tell practice from the real thing.
  The Windows app runs in the background for every signed-in user, alerts on the lock screen as well as the desktop, and updates itself. It needs a Lockdown Alert account: start a free trial at lockdownalert.co.uk, then enrol each PC with the enrolment key from the portal, by hand, by Intune or by Group Policy.
