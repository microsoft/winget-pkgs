ReleaseNotes: |-
  - 保存済み OAuth token の access_token が空文字になっている場合に有効なトークンとして読み込んでしまい、Gyazo API (users/me) への疎通確認が常に 401 Unauthorized で失敗する不具合を修正しました。load_token で空文字を未認証として扱うようにしました。
  - /token エンドポイントの失敗レスポンスを RFC 6749 準拠の JSON エラー形式 ({"error": "...", "error_description": "..."}) に変更しました。従来はプレーンテキストで返していたため、クライアント側の OAuth エラーパーサーが JSON パースに失敗し、本来の失敗理由が埋もれてしまう問題がありました。
