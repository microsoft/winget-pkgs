ReleaseNotes: |-
  ✨ Features
  - Close to system tray — Closing the main window can now hide Lumina into the system tray instead of exiting, keeping every terminal and its running commands alive in the background. Enable it with the new Close to Tray setting; the tray icon restores the window, and Quit closes all windows through the normal session-save flow (tear-off windows still close directly)
  - Additive profile render overrides — A profile's render settings are now an add-on-demand list, like the shortcuts page: only the settings that profile overrides are listed, the add menu shows each setting's current global value (Global: …), and every row has an explicit Use Global Setting action to drop the override. Nothing is written to config.toml until you press Save
  - Color spread is now a per-profile render option — The former app-wide Appearance → Color spread toggle moved into the render settings as colorSpread, so the global profile sets the default and each profile can override it. The active tab's profile decides whether the window chrome follows a fullscreen TUI's edge color, and open terminals pick up changes live. Existing enableColorSpread configs migrate automatically; the default stays off
  🐛 Bug Fixes
  - Fixed the read-only MCP server being rejected by strict clients such as OpenCode: every tool now returns a single-field JSON object ({tabs: [...]}, {tab: …}, {output: "…"}) as the MCP spec requires, and tab/exit fields are emitted in camelCase instead of snake_case
  🎨 Polish
  - Settings pages now fade their top and bottom edges while more content remains beyond the fold, so a control cut off by a short window reads as scrollable instead of clipped — the overlay scrollbars are invisible at rest on WebKitGTK
  📚 Docs
  - Updated the configuration reference for the new closeToTray and per-profile colorSpread settings, including the legacy enableColorSpread migration path
