ShortDescription: 一个基于 Tauri、React 和 Xterm.js 构建的现代跨平台终端模拟器。
Description: Lumina Terminal 是一个基于 Tauri、React 和 Xterm.js 构建的现代跨平台终端模拟器，拥有精美的界面、命令面板和可自定义的配置文件。每个标签页运行真实的 shell 进程，支持多标签、标签页拆分为独立窗口、终端内查找、可配置的 shell（PowerShell、WSL、Git Bash 或任意可执行程序）、可选的 WebGL 渲染器以及会话保存与恢复。
