Description: Loomy 是讯飞旗下的 AI 工作搭子桌面客户端，只在你授权的文件夹内处理本地文件，可完成数据分析、内容写作、会议总结、邮件与聊天处理以及网页代操作等任务，支持接入讯飞星火、DeepSeek、通义千问等多个模型，并可通过手机远程控制任务执行。
