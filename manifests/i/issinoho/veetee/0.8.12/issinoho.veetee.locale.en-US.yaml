ShortDescription: A DEC VT terminal emulator for OpenVMS and other DEC hosts
Description: |-
  veetee emulates DEC video terminals, from the VT52 and VT100 to the VT420 and the colour VT525,
  as faithfully as the manuals allow: DEC factory Set-Up defaults, fonts drawn on DEC's own
  character cells, and the control functions that forms and editing applications rely on.

  It connects over Telnet, SSH, serial lines and local shells, with an LK401 keyboard layout,
  the terminal's own Set-Up, saved connections, session logs and a searchable history. It passes
  vttest and esctest2.
