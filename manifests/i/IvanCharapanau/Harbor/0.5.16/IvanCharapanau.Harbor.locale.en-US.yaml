ReleaseNotes: |-
  rummage

  Local multimodal semantic search over your files: one program serves a web UI and an HTTP API, watches the folders you choose, and indexes text, images, PDFs, audio and video with Google DeepMind's EmbeddingGemma 2 on llama.cpp, using the CPU, NVIDIA (CUDA, including CDI) or AMD (Vulkan by default, ROCm optional).
  harbor up rummage
  Harbor (Agent Evaluations)

  Laude Institute's Harbor Framework for evaluating agents in local Docker tasks, from the creators of Terminal-Bench, available under the harbor handle.
  harbor up harbor
  harbor harbor --help
  Misc
  - harbor dev seed-cdi keeps CDI overlay files that are maintained by hand (without the generated header), so a service can select its GPU image under CDI too.
  Full Changelog: https://github.com/av/harbor/compare/v0.5.15...v0.5.16
