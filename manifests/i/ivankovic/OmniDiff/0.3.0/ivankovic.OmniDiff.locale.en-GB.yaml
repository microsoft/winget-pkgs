ShortDescription: Fast, robust, accurate content-aware diffing for code and other file formats.
Description: |-
  Fast, robust, accurate content-aware diffing.
  OmniDiff is robust: it can diff 99.95% of code changes, and it is content-aware: 98.8% of changes are diffed using algorithms specific to what the file holds. It reads code by its syntax, and pictures, archives, fonts, cursors, message catalogues and PDFs by what they contain, so a difference report reflects the structure of the material rather than treating every file as plain text.
  Code of another language held inside a string is diffed as a file of its own: TSX in a JSON "content" field, shell in a YAML run: or script: block, CSS and HTML in template literals, and YAML in an Ansible module's DOCUMENTATION, EXAMPLES and RETURN. Class lists are diffed class by class.
  The terminal user interface offers two panels, light and dark themes, and per-platform refresh and highlighting controls, and it integrates with Git and jj as an external difftool.
