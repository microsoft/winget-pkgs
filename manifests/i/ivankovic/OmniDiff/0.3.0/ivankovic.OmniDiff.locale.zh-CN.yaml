PackageIdentifier: ivankovic.OmniDiff
PackageVersion: 0.3.0
PackageLocale: zh-CN
ShortDescription: 快速、稳健、精确的感知内容差异对比工具，支持代码及其他文件格式。
Description: |-
  快速、稳健、精确的感知内容差异对比。
  OmniDiff 足够稳健：能对比 99.95% 的代码改动；也感知内容：98.8% 的改动会采用针对该文件类型的专门算法。它按语法理解代码，按实际内容理解图片、压缩包、字体、光标、文案目录和 PDF，因此差异结果反映的是材料本身的结构，而不是把每个文件都当成纯文本。
  字符串里嵌套的其他语言代码会被当成独立文件来对比：JSON 的 "content" 字段里的 TSX、YAML 中 run: 或 script: 块里的 shell、模板字符串里的 CSS 和 HTML，以及 Ansible 模块 DOCUMENTATION、EXAMPLES、RETURN 里的 YAML。CSS 的类名列表按类逐个对比。
  终端界面提供双栏视图、浅色与深色主题，可作为 Git 和 jj 的外部差异工具使用。
Tags:
- git
- 代码审查
- 代码质量
- 内容感知
- 差异对比
- 终端界面
- 结构化差异
