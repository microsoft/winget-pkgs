ReleaseNotes: "- A guide filter finds channels with no programme data. The guide only lists channels that have a schedule, so a filter could match a channel and still hide it: searching for blue showed Blue Bloods but not Blue TV, a channel with no guide data. Once you narrow the guide yourself, with a filter or favourites only, it now shows every match, with an empty timeline where there's no schedule. The unfiltered guide still hides channels without data."
