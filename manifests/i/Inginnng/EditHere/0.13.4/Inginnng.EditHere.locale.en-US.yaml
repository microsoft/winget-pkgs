PackageIdentifier: Inginnng.EditHere
PackageVersion: 0.13.4
PackageLocale: en-US
ShortDescription: Capture a screenshot, add your comments, and rearrange the layout. Give AI your complete visual feedback in one go.
Description: |-
  When working on an interface with AI, you may know exactly what you want to change, yet spend a lot of words explaining where the change belongs and how much it should affect. EditHere puts that feedback directly on the image: capture a screenshot, mark a region and leave a comment, or drag and resize parts of the image to show the layout you have in mind. Then give AI the original image, annotations, and position and size changes in one go so it can continue editing your project with that context.
  It suits web and app interfaces, game HUDs, charts, and other visuals where you need to show exactly what to change and where. EditHere itself calls no model and edits no code: it exports or copies annotated images and structured JSON, keeps projects so you can return to them later, and integrates with AI workflows through its companion skill and the edithere-cli command-line tool.
Tags:
- ai
- annotation
- screenshot
ReleaseNotes: |-
  0.13.4 fixes broken text strokes, missing fine lines and jagged edges when screenshots are resized in the annotation canvas.
  - Scaled views: reductions use high-quality resampling from the original image; enlargements use smooth interpolation instead of nearest-neighbor sampling.
  - Native pixels: 100% now means one image pixel per display pixel. Click the percentage to switch between fitting the window and native 1:1 pixels, including at 125%, 150% and 200% system scaling.
  - Originals preserved: zoom affects only the view. Original images, annotation coordinates and exported data remain unchanged. The magnifier continues to display original pixels with its pixel grid and accurate color sampling.
  Checks cover reduction, enlargement, native-pixel restoration, layout previews and the magnifier at four display scale factors. Enlarging a bitmap cannot add detail absent from the original screenshot.
  Full Changelog: https://github.com/Inginnng/EditHere/compare/v0.13.3...v0.13.4
