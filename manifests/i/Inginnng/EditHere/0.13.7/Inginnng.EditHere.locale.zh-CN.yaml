ReleaseNotes: |-
  0.13.7 改进了图片粘贴和桌面编辑器的窗口操作。
  - 从文件浏览器复制图片后，可直接在 EditHere 粘贴。一次粘贴多张图片会打开组图。
  - macOS 编辑工具栏放在系统标题栏下方，右上角的按钮可以完整显示和点击。滚轮和触控板缩放改用更细的步幅。
  - Windows 最大化窗口在隐藏、最小化或切换全屏后，仍可还原到原来的窗口尺寸。
