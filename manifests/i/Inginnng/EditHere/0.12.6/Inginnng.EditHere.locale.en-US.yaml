PackageIdentifier: Inginnng.EditHere
PackageVersion: 0.12.6
PackageLocale: en-US
ShortDescription: Capture a screenshot, add your comments, and rearrange the layout. Give AI your complete visual feedback in one go.
Description: |-
  When working on an interface with AI, you may know exactly what you want to change, yet spend a lot of words explaining where the change belongs and how much it should affect. EditHere puts that feedback directly on the image: capture a screenshot, mark a region and leave a comment, or drag and resize parts of the image to show the layout you have in mind. Then give AI the original image, annotations, and position and size changes in one go so it can continue editing your project with that context.
  It suits web and app interfaces, game HUDs, charts, and other visuals where you need to show exactly what to change and where. EditHere itself calls no model and edits no code: it exports or copies annotated images and structured JSON, keeps projects so you can return to them later, and integrates with AI workflows through its companion skill and the edithere-cli command-line tool.
Tags:
- ai
- annotation
- screenshot
ReleaseNotes: |-
  This patch addresses desktop window double-click and cross-monitor display behavior (#51).
  - Double-click the title bar to maximize or restore: double-click the editor title bar or title text to maximize, then double-click again to restore. Full-screen windows and capture toolbars do not switch state.
  - Let the desktop move the window: use the system window manager for monitor transitions, display scaling and snapping. Platforms without system moves retain the existing dragging behavior.
  - Paint a complete opaque Windows editor background: avoid the translucent layered-window path that can leave large transparent areas when moving between monitors with different scaling. The window corners also have a painted background.
  Physical dual-monitor setups with different scale factors still need verification on the affected machine. Automated checks cover double-clicks, maximize/restore, full-screen protection and complete Windows surface painting after moving and resizing.
  Packages include the Windows installer and portable ZIP, universal macOS DMG, Linux AppImage, offline Web and Web Agent editions.
