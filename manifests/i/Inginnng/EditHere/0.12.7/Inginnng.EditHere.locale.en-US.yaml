PackageIdentifier: Inginnng.EditHere
PackageVersion: 0.12.7
PackageLocale: en-US
ShortDescription: Capture a screenshot, add your comments, and rearrange the layout. Give AI your complete visual feedback in one go.
Description: |-
  When working on an interface with AI, you may know exactly what you want to change, yet spend a lot of words explaining where the change belongs and how much it should affect. EditHere puts that feedback directly on the image: capture a screenshot, mark a region and leave a comment, or drag and resize parts of the image to show the layout you have in mind. Then give AI the original image, annotations, and position and size changes in one go so it can continue editing your project with that context.
  It suits web and app interfaces, game HUDs, charts, and other visuals where you need to show exactly what to change and where. EditHere itself calls no model and edits no code: it exports or copies annotated images and structured JSON, keeps projects so you can return to them later, and integrates with AI workflows through its companion skill and the edithere-cli command-line tool.
Tags:
- ai
- annotation
- screenshot
ReleaseNotes: |-
  Configure tray single and double clicks
  In Settings → Default behavior → Tray icon, choose separate single- and double-click actions: Capture, New annotation (empty window), Show current window, Open image or project, and Do nothing. By default, single click captures and double click opens an empty window.
  Single clicks wait for the system double-click interval; a double click cancels the pending single click. Right-click menu actions and shortcuts respond immediately. Save applies changes immediately and keeps them across restarts; Cancel discards them. Showing the window preserves the current document, and opening an empty window retains the existing unsaved-edit, AI-session, capture and modal-dialog safeguards. The Default behavior page scrolls and supports Simplified Chinese, English and Traditional Chinese.
  Platforms: Windows supports both click settings. Linux double-click support depends on the desktop tray delivering the event. macOS retains its native status bar menu and does not currently support custom single or double clicks; both controls are disabled with an explanation. Use menu actions or shortcuts on macOS.
