ShortDescription: Native drag-and-drop shelf for Windows.
Description: |-
  Traydex is a panel that opens as soon as you start dragging something in Windows. Drop files, folders, images, text or links on it to keep them for later, then drag them out into any folder or app, one by one or all at once.
  Dropping on one of the action tiles processes the files right away: zip, convert, compress, make a PDF, recognize text, upload and more.
  Written in Rust on GPUI, with no Electron, WebView or other browser engine.
