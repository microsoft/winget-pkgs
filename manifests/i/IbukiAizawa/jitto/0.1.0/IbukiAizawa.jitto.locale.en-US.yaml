ShortDescription: Interactive jq for Windows. Type a jq expression and see the result as you type.
Description: |-
  jitto is an interactive jq for the Windows console. It reads JSON from a file or standard input, shows the result of a jq expression while you type it, and keeps the last good result on screen when the expression has an error.
  Press Enter to print the result to stdout and the expression to stderr, so the result can be piped to the next command. jitto is a single binary and does not need jq installed.
