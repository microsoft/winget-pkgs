ShortDescription: Windows 向けのインタラクティブ jq。jq 式を入力すると、結果がその場で表示されます。
Description: |-
  jitto は Windows のコンソールで使うインタラクティブな jq です。ファイルまたは標準入力から JSON を読み込み、入力中の jq 式の結果をその場で表示します。式がエラーのときは、直前の正常な結果を残したままエラーを表示します。
  Enter で確定すると、結果を stdout、式を stderr に出力するので、結果を次のコマンドにパイプで渡せます。シングルバイナリで、jq のインストールは不要です。
