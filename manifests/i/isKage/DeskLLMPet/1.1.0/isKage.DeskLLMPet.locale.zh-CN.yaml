ReleaseNotes: |-
  这一版把桌宠升级成可插件化扩展的桌宠：新增 API 余额气泡、双击互动 + 自定义语句、窗口裁剪，重做了右键菜单，AI 对话改造为内置插件。
  ✨ 更新内容
  - 🧩 插件化架构：菜单 / 托盘 / 设置页 / IPC / 独立窗口 / 独立存储都可被插件扩展；插件出错只跳过它，本体照常运行
  - 💰 API 余额气泡：独立气泡窗口，双击桌宠查询并展示 DeepSeek 余额卡片；支持定时展示、气泡大小与位置调节、失败提示
  - 💬 双击互动 + 自定义语句：单击只播反应动画，双击才弹气泡；关闭余额展示后，双击随机说一句你自己写的语句（设置 → 宠物设置 → 余额气泡，可编辑可预览）
  - ✂️ 窗口裁剪：窗口只保留动画主体，宠物大小不变，桌面占用更小（支持画面偏移）
