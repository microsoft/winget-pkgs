ShortDescription: A Windows desktop app for discovering, organizing, inspecting, and launching local Git repositories.
Description: RepoManager is a Windows desktop application for discovering, organizing, inspecting, and launching local Git repositories. It provides a single view of repository status, branches, working trees, health findings, notes, pinning, and supported development tools while keeping repository changes deliberate and user-controlled.
