ShortDescription: 人机对弈五子棋：六档难度、禁手规则、局域网联机与算法复盘
Description: |-
  一款基于 PyQt5 与自研 C++ 位棋盘引擎的五子棋程序。

  引擎使用增量估值、Negamax/PVS、置换表、VCF 算杀与静止搜索，单步可搜索
  上亿节点；界面提供六档难度（含 300 秒长考的 Gomocup 档）与完全自定义的
  时限、深度、静止搜索参数。

  支持标准规则与 RIF 禁手规则（三三、四四、长连判负，仅约束黑方），
  支持局域网联机对战，以及局后算法复盘：逐手重算，列出每一手与引擎最优点
  的分值差，并可回到当时的局面查看。

  界面支持简体中文、繁體中文、English、Русский、日本語、한국어，含深色主题。
