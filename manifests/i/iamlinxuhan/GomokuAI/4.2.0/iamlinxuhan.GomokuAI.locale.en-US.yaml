ShortDescription: Gomoku (five-in-a-row) against a C++ engine, with forbidden-move rules, LAN play and post-game analysis
Description: |-
  A Gomoku program built on PyQt5 and a self-contained C++ bitboard engine.

  The engine combines incremental evaluation, Negamax/PVS, a transposition
  table, VCF threat search and quiescence search, and can reach hundreds of
  millions of nodes per move. Six difficulty levels (up to a 300-second
  Gomocup setting) and fully customisable time, depth and quiescence limits.

  Standard rules or RIF forbidden-move rules (double-three, double-four and
  overline lose for Black), LAN play, and post-game analysis that re-evaluates
  every move and shows the score gap against the engine's best.

  Interface in Simplified Chinese, Traditional Chinese, English, Russian,
  Japanese and Korean, with a dark theme.
