ShortDescription: Bộ gõ tiếng Việt Telex/VNI mã nguồn mở, chuẩn Native TSF trên Windows 10/11.
Description: |-
  GoTV là bộ gõ tiếng Việt mã nguồn mở thế hệ mới với lõi C thuần, hoạt động chuẩn Native trên Windows (TSF), Linux (IBus) và macOS (InputMethodKit).
  Trên Windows, GoTV tích hợp trực tiếp qua Text Services Framework (TSF) chính quy của hệ điều hành, không dùng hook bàn phím can thiệp sâu, giúp gõ mượt mà trong mọi ứng dụng, terminal, IDE lập trình và game.
  Tính năng nổi bật: Gợi ý từ điển ngoại tuyến 100%, gõ tắt macro, biểu tượng cảm xúc emoji, phím tắt chuyển đổi E/V linh hoạt.
