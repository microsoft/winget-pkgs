ShortDescription: Modern open-source Vietnamese input method with native TSF integration.
Description: |-
  GoTV is a modern, open-source Vietnamese Input Method Editor (IME) built on a shared, pure C core across Windows, Linux, and macOS.
  On Windows, it integrates cleanly via the Text Services Framework (TSF), avoiding invasive low-level keyboard hooks and providing smooth typing in all modern apps, terminals, code editors, and games.
  Features include offline dictionary suggestions, text macros, emoji shortcodes, and instant language toggling.
