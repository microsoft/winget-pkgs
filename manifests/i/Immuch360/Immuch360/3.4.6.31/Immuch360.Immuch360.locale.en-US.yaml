ShortDescription: Flat, 360° and 3D photos and videos from your PC, a NAS, Plex, Jellyfin, Emby or an Immich server.
Description: |-
  Immuch360 Desktop plays each photo and video in the viewer that fits it: flat, as a sphere you look around in, or in 3D.
  It reads folders of the PC, SMB and WebDAV shares, DLNA, Plex, Jellyfin and Emby servers and an Immich server, opens the raw files of Insta360, GoPro MAX and DJI Osmo 360 cameras and shows Gaussian splats (.ply, .spz).
  Optional tools make 3D photos, 3D videos, splat scenes and sharper copies of photos on the PC itself. Their AI models and helper programs are not in the installer: the app downloads them from the project's GitHub releases only when you ask for one of these tools, and lists them in its settings.
  No account to create. Built on the Immich mobile app; not affiliated with Immich or FUTO.
