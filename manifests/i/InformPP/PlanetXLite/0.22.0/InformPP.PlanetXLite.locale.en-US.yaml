ShortDescription: 3D globe viewer for terrain, imagery, KML/KMZ, tours and GIS file layers.
Description: |-
  PlanetX Lite is a 3D globe written in Rust. It shows the Earth with terrain, imagery and labels,
  opens .planetx scenes and KML/KMZ files, plays tours and shows your own data - rasters,
  GeoPackage, Shapefile, GeoJSON, GPX, MapInfo, FlatGeobuf, DXF and DWG layers, point clouds and 3D models.
  The same program also runs as a web page.
