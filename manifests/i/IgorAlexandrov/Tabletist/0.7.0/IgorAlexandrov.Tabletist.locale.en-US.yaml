ReleaseNotes: |-
  What's Changed
  - Take an SSH tunnel through the ProxyJump or ProxyCommand ~/.ssh/config names by @JoshAntBrown in https://github.com/igor-alexandrov/tabletist/pull/296
  - Reload the table list from the tree over a SQL editor by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/302
  - Read a PostgreSQL table's page in three round trips, not six by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/304
  - Search the keyboard shortcuts dialog by name, group or keys by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/312
  - Read a PostgreSQL table's structure in one round trip, not seven by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/309
  - Let a PostgreSQL cancel return only once the server has acted on it by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/307
  - Let a superseded page finish, and check for PgBouncer beside the session by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/306
  - Refresh the sidebar after a run that creates or drops a table by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/301
  - Start a MySQL read's read-only transaction in one statement, not two by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/305
  - Keep a MySQL spare's idle connection alive with TCP keepalive by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/313
  - Prepare a MySQL session, and ask who its server is, in one message by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/308
  - Send a read-only PostgreSQL run in four round trips, not seven by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/303
  - Send a read-only MySQL SQL editor run in six round trips, not nine by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/315
  - Set the shortcuts dialog's groups under section labels, names first by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/314
  - Open a MySQL table in five round trips, not twenty by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/316
  - Hand a MySQL editor run's outcome back before the session reset by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/317
  - Read a PostgreSQL page in one round trip by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/318
  - Run a read-only PostgreSQL SELECT in three round trips, not four by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/319
  - Read a MySQL page in one round trip by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/320
  - Pass the tabletist-db suite on MariaDB as well as MySQL by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/321
  - Tell what each MariaDB view reads from its definition by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/322
  - Name a MariaDB server in the same one message as a MySQL one by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/323
  - Run the MySQL tests against MariaDB 11.4 in CI by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/324
  - Run a MySQL editor statement in one round trip by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/327
  - Refuse an agent's read of a PostgreSQL view that calls a refused function by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/326
  - Run a read-only PostgreSQL SELECT in one round trip, not three by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/328
  - Refuse an agent's read of a MySQL view that calls a refused function by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/325
  - Give the MySQL driver its packet limit so a connect skips its question by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/330
  - Roll back and release in one trip after a cancel on PostgreSQL by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/332
  - Cancel the call in the stops test once its read has begun by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/333
  - Count a MySQL table's rows in one round trip by @igor-alexandrov in https://github.com/igor-alexandrov/tabletist/pull/331
