ShortDescription: Photo printing for Windows with ICC colour, borderless print, smart crop and an MCP agent mode.
Description: |
  Print software for Windows for small copy centres, photo desks and professional printers.
  Accurate colour through the printer ICC profile, exact borderless printing, smart cropping
  that keeps faces and pets in frame, per-photo adjustments, sheets with several photos and
  cut marks, PDF/Word/Excel/PowerPoint documents in the same window, a tamper-evident sheet
  counter, 15 interface languages, and a built-in MCP server so an AI agent can prepare the
  order and print with your permission.
