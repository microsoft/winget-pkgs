ReleaseNotes: |-
  - Component properties. Use them to customize your components.
  - Variable themes. Create as many themes as you need and switch between them.
  - Variable collections. Manage collections and choose a different theme for each collection on the same layer.
  - 10–100× faster auto layout. Improved performance on large pages with 10,000–100,000 auto layout layers.
  - New variable types. Use number, boolean, and text variables in your designs.
  - Variable fonts. Adjust weight, width, and other axes, choose presets, and control optical sizing.
  - Text variable bindings. Bind text content to text or number variables and use variables to format individual text ranges.
  - AI Chat. Connect your own OpenAI-compatible provider, choose a model, and work on your designs directly in Lunacy.
  - MCP and AI Chat tools. Manage documents and pages, edit components, styles, and variables, and reuse assets from connected libraries.
  - Improved .fig import. Import variable fonts, component properties, and layout guide bindings more accurately.
  - Offline icons. Search and browse the updated icon catalog in the desktop app and use PNG and free SVG assets offline.
  - More reliable components and libraries. Nested swaps and local overrides survive component and shared style updates. Selected fills refresh when teammates edit a style.
  - Smoother auto layout editing. Resize Wrap layouts more reliably, preserve fixed child sizes when including borders, and restore layouts correctly with Undo.
  - Better prototypes. Keep transitions when cutting and pasting layers, scroll nested frames correctly, and apply public prototype settings without restarting.
  - Improved SVG import and export. Import SVG masks and text more accurately, keep numeric filenames in batch exports, and preserve non-Latin layer names in CSS.
  - Improved clipboard. Copy transparent PNGs on Windows and paste files and images more reliably on Windows and macOS.
  - Safer local saves. Lunacy replaces the existing file only after writing the new document.
  - 140+ bug fixes across text editing, vector tools, rendering, export, collaboration, and more.
