ReleaseNotes: |-
  1.8.4 (2026-10-09)
  🩹 What's new in v1.8.4
  A patch for skins and the library: less memory pressure on Linux, stable album and artist covers on hover, clearer playlist cards and track lists, and album years that keep up with your tags.
  🎨 Skins
  - A skin can no longer lock you out. If WaveFlow closes unexpectedly on Linux while a non-Studio skin is active, the next launch opens in Studio, the safe baseline skin, and tells you why. A --safe-mode flag does the same by hand, and none of your other settings are reset. (#823)
  - Lounge and Liquid use less memory on Linux. The two glass-heavy skins could create very large compositing surfaces under WebKitGTK. WaveFlow now disables the most expensive fullscreen blur and continuous effects there, while keeping navigation surfaces opaque and readable. (#820)
  📚 Library
  - Album and artist covers stay still on Linux. Moving the pointer over a cover could make the whole grid tremble under WebKitGTK. Both grids now stay in place, and the add-to-playlist button appears once instead of briefly flashing twice or lingering on the previous cover. (#825)
  - Playlist cards and track lists fit their skins. In Pulse, Liquid and Lounge, playlist titles and counts now have room inside their cards, column resize handles no longer show as coloured squares, and hovering a track highlights that row instead of lifting the whole table. Selection stays visible in Lounge too. The track table also keeps its rounded corners in Studio, without clipping menus or losing its sticky header. (#826)
  - Album years refresh when you rescan. A year you had corrected, or one that was missing, did not always survive a rescan, and two tracks disagreeing on the year could flip it depending on scan order. The album year now comes from the first track in order, stays stable across rescans, and is recalculated when tracks move between albums. (#818)
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.buildkite.com/instazdll/waveflow/gpgkey \
    | sudo gpg --dearmor -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://packages.buildkite.com/instazdll/waveflow/any/ any main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  No Homebrew cask yet — grab the .dmg below. The bundle isn't Apple-signed, so right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app to clear the quarantine flag.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  Thanks to everyone who reported these, and keep the feedback coming. 💚
