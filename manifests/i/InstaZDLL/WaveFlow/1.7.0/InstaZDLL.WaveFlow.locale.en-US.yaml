ReleaseNotes: |-
  1.7.0 (2026-07-26)
  ✨ What's new in v1.7.0
  WaveFlow 1.7.0 — living artwork & extensibility. Album covers now come alive with Apple-Music-style motion art, a new in-app plugin store lets you add features in one click, and bit-perfect audio on Windows (WASAPI Exclusive) is finally rock-solid. Add a big polish pass across lyrics and the library, plus a full native-speaker review of all 17 languages. Still 100% local-first — nothing leaves your machine.
  🎞️ Album covers that move
  Albums can now come alive. WaveFlow shows animated covers behind the now-playing view, Apple-Music-style. They're found automatically by the new Apple Motion Artwork plugin — or you can set your own motion cover (a local .mp4) on any album's page. Prefer to keep them offline? Flip on the optional local cache. Albums without motion art simply show their normal cover, exactly like before.
  ───────────────────────────────────────────────────
  Animated album cover in the now-playing view
  ───────────────────────────────────────────────────
  🧩 A plugin store
  Extend WaveFlow without leaving the app. The new plugin store (Settings → Plugins) installs curated plugins in one click, each verified before it lands. This release ships two official plugins — Web Radio (30 000+ stations) and Apple Motion Artwork — and plugins can now offer their own settings panel.
  ─────────────────────────────────────────
  Plugin store in Settings → Plugins
  ─────────────────────────────────────────
  👤 Tidier artist pages
  - Collapse the biography with one click, so the discography comes first.
  - Split a merged artist — libraries that joined names with commas (e.g. "Artist A, Artist B") can now be split apart in place, no re-tagging your files.
  ───────────────────────────────────────────────
  Artist page with the biography collapsed
  ───────────────────────────────────────────────
  🖱️ Right-click, everywhere
  The full track menu — Show in Explorer, Properties, add to playlist or queue, like… — now works when you right-click the title in the immersive view or a row in the play queue. These spots used to do nothing.
  🎧 Better audio on Windows
  A big chunk of this release hardened WASAPI Exclusive — bit-perfect output that bypasses the Windows mixer for the cleanest possible sound:
  - the toggle now reliably turns on and off,
  - the progress bar and lyrics stay perfectly in sync while it's active,
  - it picks the right format for your device (yes, even 7.1 setups), and
  - it recovers gracefully if your audio device drops out or resets.
  🎤 Lyrics
  - New "Prefer LRCLIB" toggle if you'd rather pull online lyrics before embedded ones.
  - Stronger synced-lyrics support — read first, and preserved when you edit.
  - Static lyrics now scroll all the way to the end in the immersive view.
  - A provider hiccup is no longer remembered as "no lyrics, forever."
  📚 Library & scanning
  - Deep-rescan a single folder on demand.
  - The scan progress toast now shows which folder it's working through.
  - Give any genre its own picture.
  - Your listening history survives even if you later delete the tracks behind it.
  - Resetting the app now safety-backs-up every profile first, just in case.
  🎨 Polish & fixes
  - Similar artists no longer show grey placeholder photos.
  - All 17 languages got a full native-speaker review pass.
  - Right-click menus now appear above the player bar (no more menus hiding behind it).
  - The main window stops creeping bigger on every launch and remembers where you left it — plus a new "Reset window position" action in Settings → Appearance.
  - Fixes for the GNOME/Wayland title bar, the startup splash screen, and assorted text/layout clipping.
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.buildkite.com/instazdll/waveflow/gpgkey \
    | sudo gpg --dearmor -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://packages.buildkite.com/instazdll/waveflow/any/ any main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  No Homebrew cask yet — grab the .dmg below. The bundle isn't Apple-signed, so right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app to clear the quarantine flag.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  Thanks to everyone who tested betas and sent feedback — it shaped a lot of this release. 💚
