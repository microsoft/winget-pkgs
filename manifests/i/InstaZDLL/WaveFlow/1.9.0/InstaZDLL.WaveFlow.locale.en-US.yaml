ReleaseNotes: |-
  1.9.0 (2026-10-15)
  ✨ What's new in v1.9.0
  WaveFlow 1.9.0 — built around what you listen to. Home now builds mixes from your favourite genres, decades and artists; mood radios listen to your corrections; your listens can go to ListenBrainz; and a long list of everyday details got faster to reach, from keyboard shortcuts to a sidebar that folds down to icons.
  Most of what is here was asked for by people using WaveFlow every day. Still local-first — online services stay optional.
  🎧 Mixes made for you
  - Genre, decade and artist mixes join Daily Mix and On Repeat on Home: one mix for each genre and each decade you play most, and one for each of your top artists, built with the artists you listen to alongside them. (#841, #846)
  - A Daily Mix is no longer one artist on repeat: each artist gets a fair share of the mix. (#847)
  - Keep a mix as a regular playlist before it refreshes, and save the play queue as a playlist in one click. (#834)
  🌙 Mood radio that listens to you
  - Sleep is quiet again. Fast tracks misread at half speed no longer slip through, and tracks measured as loud are left out, so Sleep keeps to tracks that actually fit. (#848)
  - Put a track into a mood, or take it out. Right-click any track → Moods. Tracks you add come first; tracks you remove stay out. The sliders button next to Mood radio on Home lists your changes, one tab per mood, each one undoable. (#849)
  📚 Library
  - Several genres per track, read from your files and written back by the tag editor. (#840, closes #729)
  - A Years tab, grouped by decade, with a page for each year. (#839)
  - "The Beatles" sorts under B. Artists and albums are sorted without their leading article (The, Les, L'…). You can turn it off in Settings → Library. (#838)
  - Tag edits stick. A change of case or punctuation to an artist, album or genre now shows, and editing a track keeps its other credited artists. In the Flatpak, WaveFlow can now write to your Music folder. (#831)
  - Artists joined by Chinese or Japanese commas (、, ，) are offered for splitting too. (#857, closes #851)
  - Scanning a network share shows the folder being read and the files found while WaveFlow is still listing it, and Stop now works during that stage too. (#853)
  🖥️ Interface
  - The sidebar folds down to icons. The sidebar button now steps through full, icons only, and hidden. (#850)
  - The rest of the album appears in the Now Playing panel when the queue goes on through the current album, each remaining track one click away. The artist's biography now comes last. (#852, closes #423)
  - Share a playlist or an artist as an image: a Share button on their pages saves or copies a card with its artwork, details and first tracks. (#854)
  - Keyboard shortcuts: Ctrl+K to search, with your recent searches; F11 for fullscreen; Ctrl+A to select every track in a list, with checkboxes on the rows. Ctrl+K and F11 can be changed in Settings → Keyboard shortcuts. (#830, #832)
  - Play next and Add to queue confirm what they did, so a track no longer gets queued twice by accident. (#833)
  - A motion cover you set yourself is now marked as such in the cover picker. (#847)
  🎤 Lyrics
  - Multilingual LRC lines light up together: lines that share a timestamp (an original and its translation) now highlight as one. (#827, closes #821)
  - Lyrics written as original^translation are read as a line and its translation. (#847)
  - Desktop lyrics: an adjustable outline width, an option to hide them while paused, and a progress bar. (#837, closes #814)
  - The immersive view can hide its lyrics column when a track has none. Off by default; turn it on in Settings → Immersive view. (#829, closes #794)
  ▶️ Playback
  - Your computer stays awake while music plays, so an idle timer no longer suspends it mid-album. It never blocks a sleep you ask for, and you can turn it off in Settings → Playback. (#835)
  - When exclusive output is refused, WaveFlow says why — the device is in use by another app, exclusive mode is not allowed in your system settings, or the format is not accepted — and what to do about it. (#836)
  🔌 Services
  - ListenBrainz: send your listens and what you are playing now, next to or instead of Last.fm. Paste your user token in Settings → Services. (#856)
  - Apple Motion Artwork 0.3.8 looks again, after two weeks, for animated covers it did not find before, since Apple adds them long after release. Update it from Settings → Extensions.
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.buildkite.com/instazdll/waveflow/gpgkey \
    | sudo gpg --dearmor -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://packages.buildkite.com/instazdll/waveflow/any/ any main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  No Homebrew cask yet — grab the .dmg below. The bundle isn't Apple-signed, so right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app to clear the quarantine flag.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  Thanks to everyone who reported these, and keep the feedback coming. 💚
