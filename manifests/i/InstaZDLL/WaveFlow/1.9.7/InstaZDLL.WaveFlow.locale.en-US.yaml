ReleaseNotes: |-
  1.9.7 (2026-10-23)
  🩹 What's new in v1.9.7
  WaveFlow starts again on Ubuntu 24.04 and other Linux distributions with compatible glibc versions.
  🐧 Linux
  - The Linux downloads start again on Ubuntu 24.04, Linux Mint 22.x, Zorin OS 18, Pop!_OS 24.04 and Debian 13. The 1.9.6 AppImage, .deb, .rpm and AUR package were built on a newer system and required glibc 2.43, so WaveFlow failed at launch on these distributions with version 'GLIBC_2.43' not found. 1.9.7 is built on Ubuntu 24.04 again and requires no newer than glibc 2.39, like 1.9.5. Every release now checks that compatibility floor before publishing. COPR and Flathub were not affected. (#939)
  1.9.7 also carries the 1.9.6 playback fix: tracks play all the way to the end before the next one starts.
  On Linux, the in-app updater stopped offering 1.9.6 once the compatibility problem was found. AppImage users still on 1.9.5 will therefore update directly to 1.9.7.
  If your AppImage already updated to 1.9.6 and no longer starts, download the 1.9.7 AppImage below and replace the old one. Your library and settings are kept.
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.buildkite.com/instazdll/waveflow/gpgkey \
    | sudo gpg --dearmor -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://packages.buildkite.com/instazdll/waveflow/any/ any main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  No Homebrew cask yet — grab the .dmg below. The bundle isn't Apple-signed, so right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app to clear the quarantine flag.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  Thanks to @saaim2009 for the report, and keep the feedback coming. 💚
