ReleaseNotes: |-
  2.3.0 (2026-11-21)
  🎬 What's new in v2.3.0
  Important
  Coming from 1.9? Read the WaveFlow 2.0.0 notes first: they present the new interface and everything else 2.0 brings, and explain that your library is upgraded the first time 2.0 opens it, after a verified backup — 1.9 cannot open it afterwards.
  Coming from 2.0.x or 2.1.x? Read the 2.2.0 notes too: 2.2.0 makes one small change to each profile's database, after a verified backup. 2.3.0 changes nothing in the database.
  The playing track's title now opens its album, the immersive view can switch to the music video, and a music video on a network share plays. A click on a track no longer gets stuck behind a library scan, and the volume no longer jumps when you switch to a music video.
  🎵 Player
  - The playing track's title opens its album, the way the artist under it opens the artist: in the player bar, the now-playing panel and the immersive view. The album line of the panel and of the immersive view opens it too, and the panel or the view closes on the way. A station, an episode, a server track or a file played without importing it keeps a plain title. (#1147)
  - The immersive view can switch to the music video. When the playing track has one, a clapperboard button in the top bar opens it over the view, at the moment of the song you are at; Switch to audio brings the view back. (#1149)
  🎬 Music videos
  - A track on an SMB or WebDAV share plays its music video. The video beside the track, or in a Clips folder beside it, is now found on the share and streamed from it, as for a local track. (#1142, fixes #1133)
  - A music video plays at its track's level. It now gets the same ReplayGain and normalization as the track, so switching to the video no longer jumps in volume (by about 11 dB on a track ReplayGain turns down that much). A video cannot play louder than its own file, so a boost is matched only as far as the volume slider leaves room for it. (#1141)
  - Known limit on Linux: a video on a share stored as a fragmented MP4 stops after about two seconds, as a server video already does.
  🔊 Playback
  - A click on a track no longer gets stuck behind a scan batch. While a scan was running, playing a track could take several seconds (3.6 s and 9.6 s measured), and a play at the wrong moment could stop the scan. The scan now steps aside for it, then carries on. (#1140)
  - A seek right after launch is kept. At launch, or after the last track ended, dragging the progress bar of a library track did nothing, and Play started from the stored point. Play now starts where you dragged it. (#1136, fixes #1129)
  📝 Lyrics
  - A file played without importing it shows its own lyrics. Those in its tag or the .lrc beside it are now part of the normal lyrics lookup, so they work offline too. With the default source order they are read before an online lookup. (#1137, fixes #1128)
  🖱️ Interface
  - A right-click menu stays open while synced lyrics scroll. The lyrics panel moving to the next line closed any menu open elsewhere; now only a scroll that moves what the menu opened on closes it. The same goes for the equalizer's preset menu and the language list. (#1138, fixes #1135)
  - Linux: closed dropdowns now use the skin's colours. With a light GTK theme and a dark skin, a closed dropdown showed near-white text on a white button. (#1139, fixes #1131)
  - The About page shows the exact version of each library it lists, read automatically instead of typed by hand, so it can no longer fall behind. SQLite reports the version of the library WaveFlow actually linked. (#1148)
  🌐 Network shares
  - Switching between two profiles that share a network source keeps each one's shares apart. A profile imported from another can carry the same source identifier; during a switch, playback, covers, music-video lookups and scans could cross from one profile's share into the other's. (#1144, #1145, fixes #1143)
  🌏 Translations
  - Simplified Chinese: consistent wording for the beta update channel and the bug-report hint, by @GoEverLo. (#1127, #1132)
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  sudo curl -fsSL https://download.waveflow.app/apt/waveflow.gpg -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://download.waveflow.app/apt stable main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  curl -fsSL https://waveflow.app/install.sh | bash
  WaveFlow is not notarized by Apple yet, so macOS refuses to open a copy downloaded by a browser. The script removes the quarantine flag from WaveFlow.app only and changes no system setting; --help lists its options. It is scripts/install-macos.sh, to read before running it. The .dmg below works too: right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  🐛 If something goes wrong
  Open an issue with your OS, the exact steps, and your logs — Settings → Maintenance → Diagnostics → Copy logs puts them on your clipboard, ready to paste.
  Thanks to @GoEverLo for four precise reports and two translation fixes, to @NielsHoenders for the music video on a share and for asking that the title open its album, and to the listener who wrote in asking for the music video in the immersive view. Keep the feedback coming. 💚
