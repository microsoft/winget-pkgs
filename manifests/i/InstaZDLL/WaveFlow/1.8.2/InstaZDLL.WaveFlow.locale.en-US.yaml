ReleaseNotes: |-
  1.8.2 (2026-10-05)
  🩹 What's new in v1.8.2
  A patch focused on correctness. Exclusive output is now truly bit-perfect, your listening history keeps the last song before you quit, accented names sort where you expect them, and lyrics apps on Linux can follow along again.
  🎧 Audio
  - Exclusive output is now truly bit-perfect. In exclusive mode (WASAPI on Windows, ALSA on Linux), every 16-bit and 24-bit sample came out off by one step from the file, so the stream was close to the original but not identical. It now matches the file sample for sample. macOS was not affected. (#802)
  - The bit-perfect badge takes the volume into account. Lowering the volume changes the samples, so the audio pipeline popover no longer calls the stream bit-perfect below 100 %. It shows a "volume" step instead. (#802)
  📚 Library
  - Accented names sort with their letter. "Émilie Simon" used to land after "Zazie", at the very end of the list, while the A–Z rail filed her under E. Artists, albums, tracks and genres now sort with case and accents set aside, Czech, Romanian, Polish and Vietnamese letters included. A library that mixes local files and a WaveFlow Server also keeps both copies of an artist side by side. (#805)
  - Shift+click works right after clearing a selection. It used to select nothing until you clicked a first track again. (#804)
  - A library created for you is named in your language, instead of always "Ma musique". (#804)
  📊 Stats & history
  - The last song before you quit now counts. A track you had been listening to for 15 seconds or more when you closed WaveFlow, or quit from the tray, never reached your history, your stats or Last.fm. It is now saved on the way out. (#806)
  🎤 Lyrics, playlists & radio
  - Unsynced LRC files show as plain lyrics. Some LRC files stamp every line at the same time, often 00:00. They were treated as synced, so the whole song sat on the first line. They now display as plain text. Enhanced LRC with word timings stays synced. (#804)
  - Smart playlists left the "Add to playlist" menus. A smart playlist rebuilds itself from its rules, so a track added by hand disappeared at the next refresh. Only regular playlists are offered now. (#804)
  - Offline radio tags with % or _ now match literally instead of acting as wildcards. (#804)
  🐧 System integration
  - playerctl position follows playback on Linux. The position WaveFlow reports to MPRIS stayed frozen at the start of the track, so lyrics apps such as sptlrx never moved. It now updates every second while playing. (#807)
  ⚡ Performance
  - Smoother while playing. The playback position updates four times a second, and each update used to redraw the whole interface, the library included. Now only the parts that show the position redraw. (#809)
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.buildkite.com/instazdll/waveflow/gpgkey \
    | sudo gpg --dearmor -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://packages.buildkite.com/instazdll/waveflow/any/ any main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  No Homebrew cask yet — grab the .dmg below. The bundle isn't Apple-signed, so right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app to clear the quarantine flag.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  Thanks to everyone who reported these, and keep the feedback coming. 💚
