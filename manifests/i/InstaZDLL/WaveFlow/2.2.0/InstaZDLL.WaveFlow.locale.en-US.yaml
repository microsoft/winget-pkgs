ReleaseNotes: |-
  2.2.0 (2026-11-17)
  🎬 What's new in v2.2.0
  Important
  Coming from 1.9? Read the WaveFlow 2.0.0 notes first: they present the new interface and everything else 2.0 brings, and explain that your library is upgraded the first time 2.0 opens it, after a verified backup — 1.9 cannot open it afterwards.
  Coming from 2.0.x or 2.1.x? 2.2.0 makes one small change to each profile's database the first time it opens that profile, after making and verifying a backup. An older version cannot open an upgraded profile directly: restore its pre-migration backup if you need to go back.
  Music videos can now play from a compatible WaveFlow Server too, playback picks up the right track after an audio hiccup, and old Chinese, Japanese and Korean tags show their real titles.
  🎬 Music videos from your server
  - A server track's music video plays like a local one. When your WaveFlow Server has a clip for a track, Play the clip is in the track's right-click menu, and Switch to video appears under the cover in the now-playing panel. The video streams from the server and behaves like a local clip: one sound at a time, and the track picks up where the clip was. (#1119, #1125, discussion #1073)
  - A server track linked to one of your own files plays the clip beside that file, with no network needed.
  - This needs a server version that reports music videos. Offline, a server clip is not offered.
  - Known limit on Linux: a server video stored as a fragmented MP4 stops after about two seconds.
  🔊 Playback
  - After the audio output restarts, the right track resumes. When the output was rebuilt (a device lost, a stuck stream, a change of output), playback could resume a track played earlier, at an old position, while the player bar named the right one. This happened after tracks had followed each other gaplessly or through a crossfade. (#1104, refs #1103)
  - Linux with PipeWire: short audio interruptions recover in place. The sound could drop out for one or two seconds, more and more often, especially when another app opened an audio stream or a video started in the theatre view. WaveFlow now recovers from these short interruptions on the spot instead of restarting the audio output. (#1106, refs #1103)
  - Play after the last track ended starts it over. It sometimes replayed the last few seconds and stopped again. The same goes after closing and reopening the app right after the end. (#1117, fixes #1109)
  🏷️ Library
  - Old Chinese, Japanese and Korean tags show their real titles. MP3s tagged long ago in a local code page (GBK, Big5, Shift_JIS, EUC-KR) showed garbled text such as Ò¹Çú instead of 夜曲, and some were listed by their file name. Tracks already in local library folders are corrected on the next regular scan, no deep rescan needed; Western titles such as Café are left as they are. (#1105)
  📝 Lyrics
  - macOS: the line that has just been sung no longer shows doubled, sliced letters in the lyrics side panel and the immersive view. (#1121, refs #1074)
  🛠️ Diagnostics
  - Log times are in your local time, with their offset from UTC, such as 2026-11-15T08:00:00.362923+08:00, so a log matches the clock you saw. Each log file still covers one UTC day, and Settings → Maintenance → Diagnostics now says both. (#1126, fixes #1108)
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  sudo curl -fsSL https://download.waveflow.app/apt/waveflow.gpg -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://download.waveflow.app/apt stable main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  curl -fsSL https://waveflow.app/install.sh | bash
  WaveFlow is not notarized by Apple yet, so macOS refuses to open a copy downloaded by a browser. The script removes the quarantine flag from WaveFlow.app only and changes no system setting; --help lists its options. It is scripts/install-macos.sh, to read before running it. The .dmg below works too: right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  🐛 If something goes wrong
  Open an issue with your OS, the exact steps, and your logs — Settings → Maintenance → Diagnostics → Copy logs puts them on your clipboard, ready to paste.
  Thanks to @saaim2009, @NielsHoenders and @GoEverLo for their precise reports and logs, and to the listener who wrote in about old Chinese tags. Keep the feedback coming. 💚
