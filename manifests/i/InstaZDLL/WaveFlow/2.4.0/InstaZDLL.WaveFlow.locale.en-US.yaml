ReleaseNotes: |-
  2.4.0 (2026-11-25)
  🎬 What's new in v2.4.0
  Important
  Coming from 1.9? Read the WaveFlow 2.0.0 notes first: they present the new interface and everything else 2.0 brings, and explain that your library is upgraded the first time 2.0 opens it, after a verified backup — 1.9 cannot open it afterwards.
  Coming from 2.0.x to 2.3.x? 2.4.0 makes one small change to each profile's database the first time it opens that profile. WaveFlow makes and verifies a backup first; if the backup fails, you can try again, cancel, or explicitly continue without one. An older version cannot open an upgraded profile directly: restore its pre-migration backup if you need to go back.
  Manually queued tracks now stay in your queue when you start another album or playlist. Custom smart playlists stay in sync with your library and support covers, search results get the full track menu, and your mouse's side buttons move back and forward.
  Large libraries also open faster, and a scan gets in the way of what you do far less.
  🎵 Queue
  - Manually queued tracks stay queued. Starting an album, a playlist or any other list used to wipe the tracks added with Add to queue or Play next. The ones still to play now keep their queue order, right after the track you start and ahead of the rest of the new list, with shuffle on too. If the track you start is one of them, it is not queued twice. Turning shuffle off puts each entry back in its place, a track queued twice included. (#1175, fixes #1168)
  ✨ Smart playlists
  - Custom smart playlists stay in sync with your library. A matching file scanned in joins them, and a track retagged so it no longer matches leaves them, without having to recreate the playlist. They update after a scan, a tag edit, removing a folder or a library, enrichment and analysis, and at launch. Rules that read plays, likes or ratings catch up at the next of these, not on every play. (#1177, #1180, fixes #1169)
  - Custom smart playlists now support covers: your own image, or an automatic mosaic of their first tracks' covers that changes with their contents. Daily Mix, On Repeat, Release Radar and the other generated mixes keep their own cover, and the edit window no longer offers to change it. (#1181, fixes #1173)
  📋 Playlists
  - Creating a playlist from a track's menu or the selection bar now adds those tracks. It used to create an empty playlist, from every view. (#1166)
  - Adding an artist to a playlist takes every track crediting them, guest appearances included: the same tracks the artist list counts. (#1166)
  - The creation dialog shows how many tracks will be added, instead of always "0 tracks". (#1162, fixes #1156)
  - Deleting a library, a folder or duplicates updates the playlists that held those tracks at once: their count, their page and their automatic cover. (#1180, #1181)
  - Choosing a playlist cover no longer goes through the system's temporary folder, which made every upload fail when that folder was missing. When a cover still fails, the log now says why. (#1174)
  - A long playlist title stays readable in a narrow window. The cover moves above the title when there is no room beside it, and the title takes at most three lines, with the whole name in its tooltip. (#1154)
  🔍 Search and navigation
  - Search results now have the track menu: right-click, the Menu key or Shift+F10. Queueing, adding to a playlist, liking and rating keep the results open, so you can take several tracks from one search. (#1176, fixes #1170)
  - The mouse's back and forward buttons move through the app's history, as do the keyboard's Back and Forward keys, by @shsnalipr. A shortcut you saved on one of those keys keeps it. (#1179, fixes #1172)
  🔊 Audio output
  - Linux: unplugging your headphones pauses playback. With Pause when the output device disconnects on, WaveFlow now notices when PipeWire or PulseAudio moves the sound to another output by itself, the built-in headphone jack included, and pauses with a notice. Play resumes on the output the system chose. (#1164, fixes #1158)
  - A pinned output device is used again when it reconnects. A Bluetooth headset or a USB DAC you picked in the device menu used to stay replaced by the default output after a disconnection; WaveFlow now switches back to it when it returns, and picking it again in the menu works. If it refuses to open, the sound stays on the output that was playing. The menu says Pinned for a pinned device that is present but not in use. (#1167, fixes #1165)
  ⚡ Large libraries
  - The library opens faster. In our benchmark, a generated 20 000-track library, the Albums tab took about 3 s to appear, at launch and on every return to the library; it now takes under 1 s at launch and about 0.2 s on a return. (#1153)
  - Library scans are much less disruptive. During a scan of a large library, a like or an add to a playlist could fail, and at the end of the scan picking another track could fail too. They go through now, and the work at the end of a scan is several times shorter. A like or an add that still fails in the main window now says so instead of looking applied. (#1152)
  - The log no longer fills with harmless lines written for every MP4 or M4A file opened, which on a large library could use up the day's log budget and hide what came after. (#1154)
  🌏 Translations
  - More error messages are now in your language, in all 17: offline mode turning down the plugin store or an online lookup, an unsupported image, a file too large, and the like used to show in English. (#1163, fixes #1157)
  📦 Recommended installation
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is named wave-flow: Tauri derives that name from the WaveFlow product name.
  sudo install -d -m 0755 /etc/apt/keyrings
  sudo curl -fsSL https://download.waveflow.app/apt/waveflow.gpg -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://download.waveflow.app/apt stable main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  curl -fsSL https://waveflow.app/install.sh | bash
  WaveFlow is not notarized by Apple yet, so macOS refuses to open a copy downloaded by a browser. The script removes the quarantine flag from WaveFlow.app only and changes no system setting; --help lists its options. It is scripts/install-macos.sh, to read before running it. The .dmg below works too: after moving WaveFlow to Applications, either allow it once in System Settings → Privacy & Security → Open Anyway, or run xattr -dr com.apple.quarantine /Applications/WaveFlow.app. Both skip Gatekeeper's check for WaveFlow only.
  Standalone downloads
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  🐛 If something goes wrong
  Open an issue with your OS, the exact steps, and your logs — Settings → Maintenance → Diagnostics → Copy logs puts them on your clipboard, ready to paste.
  Thanks to @shsnalipr for the mouse buttons and five precise reports, to @GoEverLo for three more, to @Sylvvtbr for the smart playlist covers, and to everyone who told us about slowdowns on a large library. Keep the feedback coming. 💚
