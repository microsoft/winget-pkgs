ReleaseNotes: |-
  1.9.8 (2026-10-30)
  🩹 What's new in v1.9.8
  WaveFlow stays quiet when nothing is playing, and your ReplayGain and speed settings survive a restart.
  ⚡ Performance
  - WaveFlow no longer keeps your CPU and GPU busy when idle. The logo in the sidebar pulsed in a loop that never stopped, even with playback stopped or the window minimised to the tray. On the reporter's system, that kept the WebView's GPU process at around 5 % CPU and 5 % GPU, and the cost grows with the display's refresh rate (144 Hz, 240 Hz). The logo is static now, and so is the small dot in the Home banner, which had the same endless pulse. (#985)
  🔊 Audio
  - The ReplayGain pre-amp, the fallback gain and the playback speed are saved again. They applied during the session but reset to 0 dB and 1× on every launch: the database refused the way they were written, and the error was never shown. All three are now kept, and any setting that fails to save is logged. (#984)
  If you had set any of them, set them once more after updating; they will stick from now on.
  📦 Recommended install
  Use your platform's package manager when one is available, so updates keep flowing through the tool you already use.
  Windows
  winget install InstaZDLL.WaveFlow
  Arch / Manjaro / EndeavourOS / CachyOS
  yay -S waveflow-bin
  # or: paru -S waveflow-bin
  Fedora / RHEL / Rocky / Alma / CentOS Stream
  sudo dnf copr enable instazdll/waveflow
  sudo dnf install waveflow
  Debian / Ubuntu / Mint / Pop!_OS
  The Debian package is wave-flow (kebab-case, required by the Debian naming spec — Tauri bundles it that way from the WaveFlow product name).
  sudo install -d -m 0755 /etc/apt/keyrings
  curl -fsSL https://packages.buildkite.com/instazdll/waveflow/gpgkey \
    | sudo gpg --dearmor -o /etc/apt/keyrings/waveflow.gpg
  echo "deb [signed-by=/etc/apt/keyrings/waveflow.gpg] https://packages.buildkite.com/instazdll/waveflow/any/ any main" \
    | sudo tee /etc/apt/sources.list.d/waveflow.list
  sudo apt update && sudo apt install wave-flow
  macOS
  No Homebrew cask yet — grab the .dmg below. The bundle isn't Apple-signed, so right-click → Open the first time, or run xattr -cr /Applications/WaveFlow.app to clear the quarantine flag.
  Standalone download
  Everything is also available as a raw bundle below — .AppImage, .deb, .rpm, .exe, .msi, .dmg.
  Thanks to @Geebarwan for both reports, the second one with a DevTools trace that pointed straight at the culprit. Keep the feedback coming. 💚
