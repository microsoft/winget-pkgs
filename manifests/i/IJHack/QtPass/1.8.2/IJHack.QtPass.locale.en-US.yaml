Description: QtPass is a GUI for pass, the standard UNIX password manager. Passwords are stored as GPG-encrypted files that you control, optionally synchronised with git. QtPass 1.8 adds built-in TOTP one-time passwords, GPG key import, a share submenu and 14 new languages; 1.8.2 is a bug-fix release.
