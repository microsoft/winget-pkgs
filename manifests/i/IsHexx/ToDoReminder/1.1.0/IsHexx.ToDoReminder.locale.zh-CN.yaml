ReleaseNotes: |-
  ✨ 新增功能
  1. AI 智能生成待办
  - 主界面点击「✨ AI 生成」，粘贴聊天记录、会议纪要或工作安排。
  - 大模型自动解析为结构化待办：标题、日期、时间、优先级、标签、重复周期。
  - 解析结果先预览，支持逐项勾选、编辑，确认后再批量入库。
  2. AI 接口设置
  - 「设置 → AI 智能生成」中可配置 Base URL、API Key、模型名。
  - 兼容 DeepSeek、Kimi、OpenAI 等 OpenAI 格式接口。
  - 默认指向 DeepSeek（https://api.deepseek.com、deepseek-chat）。
  3. 本地资源兜底
  - 移除 Google Fonts / Material Symbols CDN 依赖。
  - 引入本地字体，离线环境也能正常显示图标。
  4. 任务管理增强
  - 快速录入窗口交互与样式优化。
  - 任务列表/日历视图 UI 调整。
  🔒 安全说明
  - 源码与安装包中均不包含任何 API Key。
  - API Key 由用户在本地设置中填写，保存在主进程可访问的本地 settings.json。
  - API 请求仅在主进程发起，渲染进程只感知「是否已配置 API Key」，无法读取真实 Key。
  - 设置面板 API Key 输入框使用密码类型隐藏显示。
  📦 安装包
  - ToDoReminder Setup 1.1.0.exe（约 73 MB）
  - Windows 10/11 x64
  - 直接覆盖安装即可保留原有任务与设置数据。
