ReleaseNotes: |-
  v1.2.0 更新内容
  - 提醒弹窗新增「延迟到明天」按钮，一键把任务推到明天同一时间
  - 今日任务支持按时间 / 按优先级切换排序
  - 日历中任务超过 3 个时可点击「+N 更多」查看当天全部任务
  - 修复日历长任务标题挤压相邻格子的问题
  - 界面配色焕新：乳白底搭配翡翠绿主题，阴影与文字配色更协调
