ShortDescription: Widget de monitoramento de hardware para um monitor secundário (FPS, 1% low, temperaturas, clocks), sem overlay no jogo.
Description: |-
  O Pitwall mostra um widget de monitoramento de hardware num monitor secundário enquanto você joga: FPS, 1% / 0,1% low,
  frametime, temperaturas da CPU e da GPU (incluindo hot spot e memory junction da GPU), clocks, consumo, RAM e bateria
  de mouse/headset sem fio, além de um log CSV por sessão de jogo e ajuste opcional do power limit em placas NVIDIA.
  O FPS vem dos eventos ETW do Windows via PresentMon, então nada é injetado no jogo.

  Observações:
  - O instalador exige privilégios de administrador e instala para todos os usuários; o app também roda como
    administrador (o acesso aos sensores e o rastreamento ETW exigem isso).
  - Se estiverem faltando, o instalador também instala o driver de sensores PawnIO (driver de kernel assinado, usado pelo
    LibreHardwareMonitor para ler os sensores da CPU) e o Microsoft Edge WebView2 Runtime.
  - O PresentMon vem incluído.
