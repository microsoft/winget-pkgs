ShortDescription: Hardware monitor widget for a secondary monitor (FPS, 1% lows, temperatures, clocks) with no in-game overlay.
Description: |-
  Pitwall shows a hardware-monitor widget on a secondary monitor while you play: FPS, 1% / 0.1% lows, frametime,
  CPU/GPU temperatures (including GPU hot spot and memory junction), clocks, power, RAM and wireless mouse/headset
  battery, plus a CSV log per game session and optional NVIDIA power-limit tuning.
  FPS comes from Windows ETW events via PresentMon, so nothing is injected into the game.

  Notes:
  - The installer requires administrator rights and installs machine-wide; the app also runs as administrator
    (sensor access and ETW tracing need it).
  - If they are missing, the installer also installs the PawnIO sensor driver (signed kernel driver used by
    LibreHardwareMonitor to read CPU sensors) and the Microsoft Edge WebView2 Runtime.
  - PresentMon is bundled.
