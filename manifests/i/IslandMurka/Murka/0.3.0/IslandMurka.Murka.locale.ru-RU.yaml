ShortDescription: "Dynamic Island для Windows: музыка, скриншоты, запись экрана, чат с ИИ и пульт с телефона."
Description: |-
  Мурка — бесплатная «таблетка» вверху экрана, которая раскрывается при наведении курсора. Показывает трек с текстом песни,
  делает скриншоты и записывает экран, переводит и копирует текст, ведёт таймер и заметки. Работает в паре с приложением
  для Android: телефон становится тачпадом, отправляет файлы и умеет усыплять и будить ПК (через Tailscale).
  Меняет обои и показывает видео-обои за значками рабочего стола.
