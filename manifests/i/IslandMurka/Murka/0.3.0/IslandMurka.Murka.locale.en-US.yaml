ShortDescription: A Dynamic Island for Windows with music, screenshots, screen recording, an AI chat and a phone remote.
Description: |-
  Murka is a free pill at the top of the screen that expands on hover. It shows the current track with lyrics,
  takes screenshots and records the screen, translates and copies text, runs a timer and notes, and pairs with
  an Android app to use the phone as a touchpad, send files and put the PC to sleep and wake it remotely
  (over Tailscale). It also changes wallpapers and plays video wallpapers behind the desktop icons.
