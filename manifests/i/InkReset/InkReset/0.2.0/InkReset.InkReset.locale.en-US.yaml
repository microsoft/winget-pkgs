ShortDescription: Reads and resets the waste ink pad counters of Epson printers over USB.
Description: >-
  Open-source service bench for Epson printers. It enumerates USB printer interfaces,
  reads the IEEE 1284 device ID, resolves the model profile from an embedded database
  and reads the waste ink counters over an IEEE 1284.4 session. A reset only runs when
  the model has a verified reset table and the model string is typed exactly; a safe
  write test writes one EEPROM byte back unchanged. No account, no licence key and no
  network access. Only the Epson XP-530 has been verified on hardware.
