  - lua: add footer help and prompt to choose filter by @baggiiiie in https://github.com/idursun/jjui/pull/743
  - fix(bookmarks): move bookmarks to hidden revisions by @anandghegde in https://github.com/idursun/jjui/pull/748
  - feat(describe): add clear action (ctrl+x) by @baptiste0928 in https://github.com/idursun/jjui/pull/749
  - feat: add in-app git askpass credential prompts by @idursun in https://github.com/idursun/jjui/pull/746
