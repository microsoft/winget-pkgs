ShortDescription: A simple, WordPad-like WYSIWYG Markdown editor.
Description: |-
  EmDy opens and saves .md files, but you write as in a word processor: bold looks bold, headings look like headings.
  The Markdown code only shows up when you ask for it. Tabs, a VS Code-style folder explorer, tables, task lists, images.
  English and French. Small and fast (Tauri).
