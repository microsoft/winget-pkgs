PackageName: EmDy
License: 0BSD
ShortDescription: Un éditeur Markdown WYSIWYG simple, à la WordPad.
Description: |-
  EmDy ouvre et enregistre des fichiers .md, mais vous écrivez comme dans un traitement de texte : le gras est gras, les titres sont des titres.
  Le code Markdown n'apparaît que si vous le demandez. Onglets, explorateur de dossier à la VS Code, tableaux, listes de tâches, images.
  Français et anglais. Petit et rapide (Tauri).
