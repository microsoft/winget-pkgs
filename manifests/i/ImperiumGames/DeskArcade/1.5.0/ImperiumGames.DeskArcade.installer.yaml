# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: ImperiumGames.DeskArcade
PackageVersion: 1.5.0
MinimumOSVersion: 10.0.0.0
# Inno Setup, per-user (PrivilegesRequired=lowest in installer/DeskArcade.iss): no UAC prompt.
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
# Setup closes a running game, upgrades the existing folder in place and refuses downgrades.
UpgradeBehavior: install
# AppId from installer/DeskArcade.iss (never changes) plus Inno Setup's "_is1" suffix.
ProductCode: '{8F3C2A6E-5B7D-4E1A-9C2F-6D4B8A1E7C35}_is1'
AppsAndFeaturesEntries:
  - DisplayName: Desk Arcade
    Publisher: Imperium Games
    ProductCode: '{8F3C2A6E-5B7D-4E1A-9C2F-6D4B8A1E7C35}_is1'
InstallationMetadata:
  DefaultInstallLocation: '%LOCALAPPDATA%\Programs\Desk Arcade'
# The installers with the .NET runtime bundled, so winget needs no runtime dependency and the
# framework-dependent installer's "install .NET first" prompt never blocks a silent install.
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/BokhodirUrinboev/DeskArcade/releases/download/v1.5.0/DeskArcade-Setup-1.5.0-standalone.exe
    InstallerSha256: ACFF07C4563F5113E2E6DE24BA6CFB6EA4866E7351C04A3841D6518C37C0B189
  - Architecture: arm64
    InstallerUrl: https://github.com/BokhodirUrinboev/DeskArcade/releases/download/v1.5.0/DeskArcade-Setup-1.5.0-arm64.exe
    InstallerSha256: 638C46BFAD6C2FC61DD89BA5E1330D3664F19675749BFEB72425D8E243082A65
ManifestType: installer
ManifestVersion: 1.10.0
