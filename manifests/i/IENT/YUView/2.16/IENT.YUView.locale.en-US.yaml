ReleaseNotes: |-
  This time with bumped version number to 2.16. The biggest change: Decoding bitstreams works again. I broke it with some changes I submitted and there were no tests for it. I added tests for libde265 and libHM (so far). Ultimately, we need tests for all decoders.
  Important
  With version 2.15 Qt as well as openSSL was updated. For some reason, the auto updater on Windows was not able to handle this. Auto-updating from 2.14 to 2.15 works but then, updating to 2.16 is broken. When installing 2.15 fresh, everything works again. So I recommend to uninstall and reinstall 2.16.
