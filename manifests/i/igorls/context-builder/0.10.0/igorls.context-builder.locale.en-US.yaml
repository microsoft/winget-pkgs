- codebase
- context
- tree-sitter
- developer-tools
- rust
ReleaseNotes: |-
  v0.10.0 "Honest Signatures" — every documented flag now does what it says:
  - --truncate smart/byte is now wired into the --max-tokens budget path
  - TypeScript/TSX class members extracted under --signatures
  - --visibility honored for TypeScript; honest warning for other languages
  - One canonical extension-to-language map (src/languages.rs)
  - Dependency diet: walkdir/once_cell/num_cpus removed, similar 3, tiktoken-rs 0.12
  - Real MSRV CI job (1.89), aarch64-linux release target, binstall metadata, dependabot
