ShortDescription: Create complete audiobook files from local audio files, MP3/data CDs and audio CDs.
Description: BookStitch is a Windows desktop application for creating complete audiobook files from local audio files, MP3/data CDs and audio CDs. It helps users import, review, convert and merge tracks into AAC-based M4A/M4B audiobook output with chapters, metadata and clear project states. BookStitch supports local audio folders, optical disc workflows, FFmpeg/FFprobe based conversion, project state recovery, track warnings, metadata handling and natural-language chapter suggestions with automatic numbering. It also includes an experimental Drive Circle feature for processing up to five optical drives in sequence during CD workflows. The app works locally, requires no user account and is free and ad-free.
