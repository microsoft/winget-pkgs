ShortDescription: A modern, free, AI-native database client — a lightweight alternative to Navicat.
Description: |-
  DataForge is a lightweight desktop database client built with Tauri (Rust) and React.
  Connect to MySQL, PostgreSQL, SQLite, SQL Server and ClickHouse, write SQL in a Monaco editor,
  browse and edit data, compare schemas, back up and restore, and generate SQL from plain language
  with the AI provider of your choice.
