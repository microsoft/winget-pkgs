ReleaseNotes: |-
  A Windows 11 style volume mixer replaces the classic one: device and application sliders with live levels, light and dark, Windows' own mixer can be chosen in the options (#448)
  New hotkey action - show the media OSD without pressing a media key (#449)
  One UAC prompt on Apply for all options that need administrator rights, with a shield next to them (#460)
  Remote control page shows the playing track with play/pause, previous, next, a seek bar and the player's volume
  Media OSD shows the player's icon and name, and its texts take the same codes as the volume OSD
  Media OSD shows the sound playing now as level bars or a peak meter, and stays between two tracks
  Long track titles wrap onto more lines: WordWrap and MaxHeight of a skin text (#450)
  OSD skins: a picture behind a hovered or pressed element
  Fixed: Volume² no longer lowers the polling rate of fast mice - the mouse hook is removed when all mouse actions are off, and with "Disable volume control in full-screen mode" while the cursor is over a full-screen application (#464)
  On Windows 11 the media keys go on to the player, on Windows 10 one Play/Pause press no longer toggles twice (#458)
  Only a skin with a media OSD takes the media keys, with the Text or TrackBar style Windows keeps them (#458)
  The media keys option moved from Skin Settings to System - Notifications, every notification icon has a hint
  Fixed: application modes no longer change the system volume when the application has no sound (#456)
  Fixed: a hotkey acts on the principal device even when it contains the key that switches the mouse wheel to the alternative device (#457)
  Fixed: Win + wheel hotkeys keep up with a fast wheel (#455)
  Fixed: the wheel over a taskbar button changes the application's volume on whichever device it plays (#442)
  An OSD dragged into a screen corner keeps a corner position (#463)
  An OSD shown Always on all displays stays on every display (#462)
  The always-shown OSD switches to the media OSD while a player has a track, paused too (#444)
  Fixed: OSD Coordinates work as before 26.1, a skin's shadow no longer leaves a gap in the corners (#439)
  OSD "Exclude Taskbar" keeps clear of an auto-hide taskbar on any screen edge (#438)
  The application volume OSD no longer shows when a player sets the volume it already has (#459)
  The meter of the brightness and battery OSDs takes the skin's colorization, as on the volume OSD
  Fixed: the OSD and the tray balloon no longer show the mute icon after the volume is raised from 0 (#443)
  The tray balloon stays over the tray icon instead of following the cursor when Windows does not report the icon's place (#446)
  The volume mixer opened from Volume² closes when another window takes the focus and opens on the screen it was called from (#440)
