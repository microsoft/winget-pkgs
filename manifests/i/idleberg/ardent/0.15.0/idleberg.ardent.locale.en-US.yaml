  - fix: treat a lone CR as a line break in continuations and block comments
  - fix: keep mid and closeAfter keywords attached to their blocks
  - fix: return empty output for empty input
  - fix: exclude trailing comments from line width
  - fix: keep unknown compiler commands as written
  - fix: strip trailing whitespace from comments
  - fix: join continuation lines without inserting a space
  - fix: treat `;` and `#` inside tokens as part of the token
  - fix: keep piped values compact when wrapping lines
  - fix!: keep byte order mark when writing files
  - fix: conform to spec on unterminated strings, unknown keywords and block comments
  - fix: remove `!elseif`
