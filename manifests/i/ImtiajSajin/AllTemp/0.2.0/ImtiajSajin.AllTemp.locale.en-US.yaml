ShortDescription: Free, open-source hardware temperature monitor for CPU, GPU, SSD/HDD, RAM and motherboard.
Description: |-
  AllTemp is a free and open-source (MIT) hardware temperature monitor for Windows.
  It shows CPU package and core temperatures, GPU core and junction temperatures, every NVMe/SATA SSD and hard drive (by drive letter), motherboard, RAM and AIO liquid temperatures in one small window that can stay above other apps.
  A usage view shows CPU load and clock speed, GPU load and video memory, RAM usage and disk activity, or both views side by side.
  The current CPU temperature is shown in the system tray.
