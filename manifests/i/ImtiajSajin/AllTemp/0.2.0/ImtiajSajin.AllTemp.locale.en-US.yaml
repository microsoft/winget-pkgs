ShortDescription: Free, open-source overlay showing CPU, GPU, SSD/HDD, RAM and motherboard temperatures, always on top.
Description: |-
  AllTemp is a free and open-source (MIT) app that shows every temperature on your Windows PC in one small, dark overlay you can pin on top of games and apps:
  CPU package and cores, GPU core and hot spot, every NVMe/SATA SSD and hard drive (by drive letter), motherboard, RAM and AIO liquid temperature.
  Switch to the usage view for CPU load and clock, GPU load and VRAM, RAM usage and disk activity, or show both side by side.
  The live CPU temperature is shown in the system tray.
