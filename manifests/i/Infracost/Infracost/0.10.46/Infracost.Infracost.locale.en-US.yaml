ReleaseNotes: |-
  This is a security and pricing-accuracy release. It updates Go to 1.26.6 and patches vulnerable dependencies, including gRPC, and fixes two pricing lookups that recent AWS and Azure catalog changes had broken.

  ### 🐛 Fixes

  • Fixed `aws_cloudwatch_log_group` Logs Insights query pricing. The new CloudWatch Omni Query product also matched, so regions where Logs Insights costs more than $0.005/GB (e.g. eu-west-1, ap-southeast-2) were underpriced. By @aliscott in [https://github.com/infracost/infracost/pull/3622](https://github.com/infracost/infracost/pull/3622).
  • Fixed `azurerm_postgresql_flexible_server` storage costs showing as not found after Azure renamed the storage product. By @aliscott in [https://github.com/infracost/infracost/pull/3620](https://github.com/infracost/infracost/pull/3620).

  ### 🔒 Security

  • Upgraded Go to 1.26.6 to address CVEs including CVE-2026-39821, CVE-2026-39822, CVE-2026-46600 and CVE-2026-56859 by @aliscott in [https://github.com/infracost/infracost/pull/3597](https://github.com/infracost/infracost/pull/3597), [https://github.com/infracost/infracost/pull/3606](https://github.com/infracost/infracost/pull/3606) and [https://github.com/infracost/infracost/pull/3607](https://github.com/infracost/infracost/pull/3607).
  • Updated dependencies to resolve Dependabot and govulncheck security findings, including `google.golang.org/grpc` v1.83.2 (CVE-2026-84445, CVE-2026-84304) and `golang.org/x/crypto` v0.56.0, by @aliscott and @dependabot in [https://github.com/infracost/infracost/pull/3604](https://github.com/infracost/infracost/pull/3604), [https://github.com/infracost/infracost/pull/3611](https://github.com/infracost/infracost/pull/3611), [https://github.com/infracost/infracost/pull/3615](https://github.com/infracost/infracost/pull/3615), [https://github.com/infracost/infracost/pull/3619](https://github.com/infracost/infracost/pull/3619), [https://github.com/infracost/infracost/pull/3623](https://github.com/infracost/infracost/pull/3623) and [https://github.com/infracost/infracost/pull/3603](https://github.com/infracost/infracost/pull/3603).

  ### 🛠️ Maintenance

  • Updated the bug report issue template by @glenngillen in [https://github.com/infracost/infracost/pull/3582](https://github.com/infracost/infracost/pull/3582).
  • Refreshed Google preemptible pricing test fixtures by @aliscott in [https://github.com/infracost/infracost/pull/3621](https://github.com/infracost/infracost/pull/3621).

