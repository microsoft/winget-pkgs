ShortDescription: Desktop project management with Gantt charts, critical path and resource leveling; opens and saves Microsoft Project XML files.
Description: |-
  IureProject is a desktop project-management application written entirely in Rust.
  It schedules tasks with dependencies, constraints and calendars, shows Gantt charts,
  calculates the critical path, manages resources and costs, levels resources and tracks
  baselines and progress. It reads and writes Microsoft Project XML (MSPDI) and CSV, and
  includes a command-line tool (iureproject-cli).
