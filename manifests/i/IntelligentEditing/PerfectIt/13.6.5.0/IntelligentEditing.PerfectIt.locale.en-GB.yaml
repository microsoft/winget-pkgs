ShortDescription: A proofreading and consistency-checking add-in for Microsoft Word.
Description: PerfectIt is a proofreading and consistency-checking add-in for Microsoft Word. It appears in Word's ribbon and checks documents for issues such as inconsistent hyphenation, abbreviations, and capitalisation.
