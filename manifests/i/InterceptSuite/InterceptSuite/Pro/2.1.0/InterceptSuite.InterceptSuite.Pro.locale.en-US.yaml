ReleaseNotes: |-
  InterceptSuite Pro 2.1.0 25 October 2026
  New features
  - Traffic redirect (Windows) - send selected applications through InterceptSuite without changing their proxy settings. Open Proxy > Redirect, add rules by application, host or IP, and port, and choose to send the traffic through the proxy, let it go direct, or block it. Rules are saved with the project, redirect is off until you press Start, and Pause stops it for new connections without losing your rules. InterceptSuite itself is never redirected. Powered by ProxyBridge and the WinDivert driver.
  - Install Certificate - install the InterceptSuite CA certificate from the app instead of doing it by hand.
  - Optional redirect setup in the installer - a checkbox on the last page sets up the redirect service for you. Windows asks for administrator permission once; InterceptSuite itself keeps running without it.
  Fixes
  - The app no longer keeps running after you close the window, and the proxy no longer uses a core at 100% after a failed accept
  - The window no longer shows "Not responding" under heavy traffic.
  Known limitations
  - Traffic redirect is Windows-only for now.
