ShortDescription: Desktop app for recruiters and hiring managers. Live transcript and question guide during the interview, then an evidence-backed scorecard. No bot joins the call.
Description: |-
  Interview Signal is a desktop app for the person running a job interview: agency recruiters, in-house recruiters and hiring managers.
  It captures the call on the interviewer's own computer, so no bot joins, and it works the same on Zoom, Microsoft Teams, Google Meet and phone screens.
  During the call it shows a live transcript and a question guide built from the job description. When the call ends it produces a scorecard in which every score carries a quote checked against the transcript, and a client submittal in the agency's own template.
  Transcripts, quotes, candidate names, notes and submittals stay on the interviewer's computer.
