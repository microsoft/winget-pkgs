ReleaseNotes: |-
  ## ✨ New & improved

  • **Choose where your signature goes on forwards.** A new setting lets you put your signature above the forwarded message (the default) or below it.
  • **Inbox badges on every inbox.** The badge setting, now called **Inbox badges**, applies to personal inboxes, shared inboxes, favorites and channel folders.
  • **Undo send, finished.** The snackbar after sending has a countdown bar and tells you each step of undoing. Cancelling a scheduled send always reopens the draft.
  • **Notifications and toasts share one stack** in the bottom-left, so they no longer queue one at a time.
  • **Your layout is remembered.** Pane widths you resize are saved for each profile.
  • **Clearer conversation list.** Channel icons appear as a badge on the contact's avatar, rows name the other person, and filters show as chips.
  • **Availability statuses expire on their own** when their "clear after" time is up.
  • **Multiple images send as one message** as a tiled album you can browse, and an image with a caption is one message too.
  • **Email files open in the mail viewer.** `.eml` and `.msg` attachments open in the mail popup.

  ## 🛠️ Key fixes

  • Fixed emails sometimes going out **without your signature or quoted history** if you sent without typing in the message body.
  • Clicking in and out of an untouched composer no longer creates an empty draft, and **Create New Draft** opens its own window.
  • Chat drafts are stored more reliably and survive dropped connections.
  • Fixed pasting into the email editor corrupting the message or losing content pasted from Word or OneNote.
  • Changes you make show up in the conversation list immediately, and refreshing your session no longer clears your saved filters.

  ## 💬 Tell us what you think

  If you have any feedback or run into issues, reach out at [support@intheloop.io](mailto:support@intheloop.io) or from within the app.
  Thanks for staying in the Loop! 🚀
