ShortDescription: Merge Google Photos Takeout metadata back into your photos - correct dates, timezones, duplicates, and albums.
Description: |-
  Google Photos Takeout exports your library as ZIPs where the real metadata lives in sidecar .json files next to each photo. This tool reads the ZIPs directly, writes the original date, timezone offset, GPS and description back into each file's EXIF/XMP (via the bundled ExifTool), de-duplicates by content, recreates albums, and organizes everything into a clean year/month library. Windows wizard (Hebrew/English) plus a headless CLI (gptakeout.exe). No telemetry; everything runs locally.
