ReleaseNotes: |-
  ✨ Key Features
  ﻿
  1. 🧩 Base Component System Construction
  ﻿
  New/Optimized Base Component Library (src/renderer/components/base/)
  ﻿
  - AionModal: Unified modal component with preset sizes, font scaling, and flexible configuration
  - AionCollapse: Collapsible panel supporting accordion mode and custom icons
  - AionSelect: Select component with automatic theme adaptation
  - AionSteps: Steps component with brand color theme
  - AionScrollArea: Scroll area component with unified scrollbar styling
  - base/index.ts: Created unified export file
    ﻿
    Component Quality Improvements
    ﻿
  - ✅ Complete bilingual (Chinese/English) documentation and usage examples
  - ✅ ESLint compliant with no warnings
  - ✅ Good extensibility and maintainability
  - ✅ Comprehensive TypeScript types
    ﻿
  2. ⚙️ Settings Modal Complete Refactor
  ﻿
  New Architecture (src/renderer/components/SettingsModal/)
  ﻿
  - Modular content components: GeminiModalContent, ModelModalContent, ToolsModalContent, SystemModalContent, AboutModalContent
  - Responsive design supporting both mobile and desktop
  - Built with new base component system
    ﻿
    Feature Enhancements
    ﻿
  - Custom CSS editor with live preview
  - Directory configuration moved from Gemini settings to system settings
  - Improved form validation and error handling
    ﻿
  3. 🎨 Theme System and UI Scaling
  ﻿
  Theme Migration (src/renderer/styles/themes/, src/renderer/theme/)
  ﻿
  - Complete theme variable system
  - Color scheme support (color-schemes/default.css)
  - Added Arco Design official color support
  - Migration guide MIGRATION.md
    ﻿
    Font Scaling and UI Zoom
    ﻿
  - New FontSizeControl component
  - New ThemeContext for font scale management
  - Interface zoom functionality (#189)
  - All components respond to scaling settings
    ﻿
  4. 🔐 MCP Feature Enhancements
  ﻿
  OAuth 2.0 Authentication Support
  ﻿
  - New McpOAuthService service
  - useMcpOAuth hook for authentication flow
  - Improved MCP connection management
    ﻿
    Message Processing Optimization
    ﻿
  - Implemented global message queue to resolve message overlap issues
  - 100ms delay ensures sequential execution
  - Message queue size limitation
    ﻿
  5. 🎯 ResizeObserver Error Fix
  ﻿
  Root Cause Resolution
  ﻿
  - Removed w-full class from AionSelect
  - Fixed Select component width to w-160px
  - Popup container mounted to document.body
  - Optimized AionScrollArea performance (removed inline styles)
    ﻿
  6. 🎨 User Experience Optimizations
  ﻿
  Workspace Improvements
  ﻿
  - Collapsible workspace panel
  - File/folder drag-and-drop support
  - Horizontal scrollable file list (HorizontalFileList)
  - File preview component (FilePreview)
    ﻿
    Input Box Enhancements
    ﻿
  - Processing indicator
  - Instant clear functionality
  - Increased multi-line mode height
  - Draft save optimization
    ﻿
    Message Display
    ﻿
  - Collapsible long text content (CollapsibleContent)
  - Alert details moved below card
  - Dark mode gradient optimization
  - Fixed copy button hover stability
    ﻿
  7. 🌍 Internationalization Improvements
  ﻿
  Multi-language Support (zh-CN, zh-TW, en-US, ja-JP)
  ﻿
  - Added 118+ translation keys
  - Improved language switcher
  - All new features support i18n
    ﻿
  8. 🏗️ Multi-platform Support
  ﻿
  - macOS x64/arm64
  - Windows x64/arm64
  - Linux support
    ﻿
  9. 🐛 Bug Fixes
  ﻿
  - Fixed IPC bridge Promise return error
  - Fixed mobile conversation title centering issue
  - Fixed copy button hover stability
  - Fixed chat history retention when merging today's records
  - Fixed WebSocket frequent disconnection (client-side heartbeat)
  - Fixed agent card jitter issue
  - Fixed scroll flickering issue
  - Fixed file diff display bug
  - Fixed SendBox freeze on long inputs
  - Fixed welcome dialog text loss on paste
    ﻿
    ﻿
  10. 📝 Documentation Updates
  ﻿
  - Updated WEBUI_GUIDE.md with 241 new lines
  - Updated multi-language READMEs
  - Added theme migration documentation
  - Added component usage examples
    ﻿
  11. 📊 Technical Debt Cleanup
  ﻿
  - Removed unused style modules
  - Replaced explicit any types with precise types
  - Resolved ESLint warnings
  - Optimized TypeScript type definitions
  - Removed duplicate code, extracted reusable utility functions
