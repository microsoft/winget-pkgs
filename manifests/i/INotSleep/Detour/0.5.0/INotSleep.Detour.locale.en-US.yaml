ShortDescription: Open-source SSH client with end-to-end encrypted sync and teams, no server in the middle.
Description: |-
  Detour is an SSH client for people who run servers, and for their teams. Hosts, keys, passwords and snippets live in a vault encrypted on your device. They sync between your computers and your phone, and are shared with your team, through a Git repository or a folder in OneDrive, Google Drive or Dropbox: encrypted end to end and signed on every change, with no Detour server and no account.
  It has a terminal with tabs, split panes and output highlighting, SFTP, port forwarding, jump hosts and proxies (SOCKS5, HTTP, WireGuard, VLESS), import from ~/.ssh, a command line (detour) that does everything the app does, and an MCP server that lets AI agents work on your servers without seeing a password or key.
