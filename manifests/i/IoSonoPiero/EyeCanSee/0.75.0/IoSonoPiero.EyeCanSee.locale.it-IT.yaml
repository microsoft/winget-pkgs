PackageName: EyeCanSee
License: GPL-3.0-or-later
ShortDescription: Un visualizzatore e gestore di foto, video, modelli 3D e disegni CAD, con un editor delle immagini.
Description: |-
  EyeCanSee sfoglia, mostra, converte e annota foto e video ovunque si trovino: cartelle del computer, dischi esterni, server SFTP e FTP e dispositivi collegati, tutti sfogliati allo stesso modo. Niente importazione e niente database: si apre una cartella e i file sono lì.
  Apre i formati moderni e delle fotocamere come HEIC, AVIF, JPEG XL, Camera RAW e PSD, riproduce i video e mostra modelli 3D e disegni CAD (DWG, DXF, STEP). Copia e sposta i file tra dispositivi, trova le copie doppie, converte foto e video in altri formati, sulla scheda grafica quando può, e ha un editor per annotare le immagini e coprire i dati privati.
  Gratuito e open source, per Windows e Linux.
