ShortDescription: A viewer and manager for photos, videos, 3D models and CAD drawings, with an image editor.
Description: |-
  EyeCanSee browses, views, converts and annotates photos and videos wherever they are: folders on the computer, external disks, SFTP and FTP servers and connected devices, all browsed the same way. There is no import and no database: you open a folder and the files are there.
  It opens modern and camera formats such as HEIC, AVIF, JPEG XL, Camera RAW and PSD, plays videos, and shows 3D models and CAD drawings (DWG, DXF, STEP). It copies and moves files between devices, finds duplicate copies, converts photos and videos to other formats, on the graphics card when it can, and includes an image editor to annotate images and cover private data.
  Free and open source, for Windows and Linux.
