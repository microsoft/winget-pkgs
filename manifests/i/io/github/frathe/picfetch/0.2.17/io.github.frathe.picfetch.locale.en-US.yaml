ReleaseNotes: |-
  What's Changed
  New Features
  Trane comparing images
  Comparison improvements
  - You can now link or unlink the two photos using the Link/Unlink button in the top-left corner or Ctrl+L on any platform.
  - When unlinked, the status shows which photo is selected. Panning, scrolling, and the 0, 1, +, and - keys affect only that photo.
  - When linked, both photos move and zoom together without losing their current positions.
  Fixes and performance
  - Linking or unlinking photos no longer changes their position or size.
  - In Swipe mode, controls now correctly affect the photo visible under the pointer.
  - Moving the Swipe divider immediately loads sharp details for newly revealed areas.
  - Large photos remain sharp when zooming, including on systems using GLES graphics.
  - Ctrl+L no longer changes the link setting while a dialog or menu is open.
  - Panning and zooming in Side-by-Side and Swipe modes is now smoother and uses fewer resources.
  - Ctrl+D now opens comparison mode alongside the platform-specific shortcut.
  Maintenance and security
  - Improved automated code-quality checks for test files.
  - Updated several dependencies and raised the minimum Go version to improve security and maintainability.
  - Security scans found no vulnerabilities affecting PicFetch.
