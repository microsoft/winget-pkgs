ReleaseNotes: "This release focused on making binaries auditable and supporting RISC-V 64.\r\n\r\n• celq binaries now can be audited with [cargo-audit](https://crates.io/crates/cargo-audit)!\r\n• Added pre-built Linux RISC-V 64 binaries across GitHub releases, PyPI, NPM.\r\n• Added Windows ARM64 to the test matrix.\r\n• Bumped the CEL interpreter (`cel` -> 0.14.4). This could theoretically be a breaking change as the new version of the parser is more compliant with the CEL standard and could reject some existing queries. In practice, this is a quality-of-life improvement by rejecting buggy queries.\r\n• Bumped the YAML parser (`serde-saphyr` -> 1.1.0).\r\n• Bumped the toml parser (`toml` -> 1.1.4).\r\n• Raised the MSRV to Rust 1.94\r\n• celq binaries are now built with [cargo-auditable](https://crates.io/crates/cargo-auditable). This embeds informations about celq's dependencies in the binary. Should there be a vulnerability affecting one of celq's parsers or CEL interpreter, external tools will be able to flag it.\r\n\r\n## Commonly downloaded\r\n\r\n| Platform            | Download                                                                                                                     |\r\n| ------------------- | ---------------------------------------------------------------------------------------------------------------------------- |\r\n| Linux x86-64 (GNU)  | [celq-linux-x86_64-gnu.tar.gz](https://github.com/IvanIsCoding/celq/releases/download/v0.6.0/celq-linux-x86_64-gnu.tar.gz)   |\r\n| Linux aarch64 (GNU) | [celq-linux-aarch64-gnu.tar.gz](https://github.com/IvanIsCoding/celq/releases/download/v0.6.0/celq-linux-aarch64-gnu.tar.gz) |\r\n| macOS aarch64       | [celq-macos-aarch64.tar.gz](https://github.com/IvanIsCoding/celq/releases/download/v0.6.0/celq-macos-aarch64.tar.gz)         |\r\n| Windows x86-64      | [celq-windows-x86_64.zip](https://github.com/IvanIsCoding/celq/releases/download/v0.6.0/celq-windows-x86_64.zip)             |\r\n\r\nSee assets for the remaining platforms"
