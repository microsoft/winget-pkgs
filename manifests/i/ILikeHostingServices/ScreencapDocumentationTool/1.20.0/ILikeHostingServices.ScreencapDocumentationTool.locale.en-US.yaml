ShortDescription: Turns screen recordings into step-by-step screenshot documentation.
Description: |-
  Screencap Documentation Tool finds every step in a screen recording with FFmpeg scene detection and saves a screenshot of each one.
  Review the steps, add captions, crop, blur sensitive information, and export the result as HTML, Word, or PDF documentation.
  Everything runs locally on the PC, with no telemetry.
