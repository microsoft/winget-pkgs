ShortDescription: 面向 Windows 桌面的电影 / 节目推荐应用，主打简洁高级的黑曜石 UI、圆角窗口、灵动岛模式与应用内播放体验。
Description: CineFlow 基于 Electron + Vite 构建，使用 TMDB 作为元数据源，支持电影、电视剧、节目、演员、关键词与类型发现，并提供每日推荐、自然语言搜索、风格探索、个性化推荐、介绍页、灵动岛模式与应用内播放（HLS / DASH / FLV）等功能。TMDB Key、代理与偏好设置保存在本机，不写入源码或安装包。
