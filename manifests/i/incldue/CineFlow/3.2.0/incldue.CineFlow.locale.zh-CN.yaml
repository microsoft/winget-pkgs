ReleaseNotes: |-
  CineFlow 的 3.2.0 版本，新增元数据加密解析、播放链路升级、广告分片过滤以及收藏页面
  内置元数据解析器，对 API 与详情做加密解析并直连取回；
  播放流量绕过代理，经加密解析后由本机直连片源，同时确保播放不中断；
  收藏页面并可直达影片详情页进行播放
