ReleaseNotes: |-
  这是 CineFlow 的 3.0 版本，重点强化自定义影视资源导入、资源配置热更新、播放器首帧加载速度增强。
  新增自定义外部资源源导入，并支持 JSON、分行配置、远程配置地址快速导入。
  资源配置 revision 热更新，详情页打开状态下可即时重启轮询并刷新可播放资源。
