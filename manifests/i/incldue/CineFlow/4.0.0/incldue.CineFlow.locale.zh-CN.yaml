ReleaseNotes: |-
  本次更新，v4.0.0 有以下优化：
  1. 优化了首页影片推荐海报的显示，将海报的宣传标题字样截取并显示在原本推荐的标题上，美化标题文字；
  2. 将前几个版本前的非代理情况下正常浏览以及播放进行返场，现在不用代理也能畅快观影了；
  3. 新增 1080p 及以上画质影片的播放源，直连 M 国原生服务器并有 2160p、1080p 以及正常画质片源，并内置字幕，若字幕未找到可搜索在线字幕以及本地导入已有字幕（还有一些小问题，后续修复）
