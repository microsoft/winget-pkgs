- 电影
- 电视剧
- 视频
ReleaseNotes: |-
  新增应用内 TMDB 凭证一键全流程申请，精简步骤；若无 TMDB 凭证，豆瓣 API 元数据兜底，首页、分类页海报、详情展示，同时预留一条内置播放源供无 TMDB 凭证时正常享受影片。
  片源进行强过滤，区分爽剧/短剧与正常影片并轮询提速；播放器首帧预热，保证舒服的观影。
  新增搜索记录气泡，淡入淡出，同时搜索词条借用博客标签云的想法独创搜索词条词云、标签云化。
  双路搜索增强，影片标题命中以及自然语言氛围关键词双路并行搜索，尽可能保证相关，搜索强化在下一版预告-_-
  新增应用内自动检查更新，"CF"图标拉取 Release 最新版并根据操作系统进行静默下载安装
