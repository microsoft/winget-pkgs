PackageIdentifier: incldue.CineFlow
PackageVersion: 1.0.0
PackageLocale: en-US
ShortDescription: A smooth desktop movie recommendation app powered by TMDB.
Description: CineFlow is a desktop movie and TV show recommendation app for Windows, featuring a sleek obsidian UI, rounded window, Dynamic Island mode, and in-app playback. It uses TMDB as its metadata source and supports discovery of movies, TV series, shows, actors, keywords, and genres. Daily recommendations, natural-language search, style exploration, personalized recommendations, and in-app playback (HLS / DASH / FLV) are all built in. Your TMDB key, proxy, and preferences are stored locally.
