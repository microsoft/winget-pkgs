ReleaseNotes: |-
  v4.0.1 版本更新，新增远程媒体库(webdav&openlist)以及优化了 Linux 环境下的 GPU 加速
  - 远程媒体库（OpenList / AList / WebDAV ）
    分集自动归一：S01E02、第 12 集、EP12 都能识别，按集号自然排序，合集自动成组
    字幕自动配对：同目录同名的 .srt/.ass/.vtt 直接挂到对应集
  - Linux 图形加速自动规避（仅 Linux）
    Wayland + NVIDIA → 启动前关闭硬件加速与 GPU 合成
    三态开关（自动 / 关闭 / 强制开启），环境变量 CINEFLOW_DISABLE_GPU=1、CINEFLOW_KEEP_GPU=1 优先
