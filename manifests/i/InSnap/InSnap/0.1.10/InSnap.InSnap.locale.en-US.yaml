ShortDescription: Screenshot, annotation, OCR, screen recording and step-by-step guides for Windows and Mac.
Description: |-
  InSnap is a screenshot, screen recording and how-to guide app. Capture a window, panel or region, mark it up,
  copy text from images with on-device OCR, pin captures above your windows, stitch scrolling pages,
  record the screen with auto zoom, and turn clicks into step-by-step guides that export to PDF, Word,
  PowerPoint, HTML, Markdown and SCORM. The free tier covers capture, annotation, pin, OCR, history and basic
  recording; Pro is a one-time purchase with a 7-day free trial.
