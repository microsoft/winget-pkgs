ShortDescription: A dual-pane, multi-tab SFTP client for Windows with server-side direct transfer.
Description: |-
  iFreeSftp is a free, open-source (AGPL-3.0) SFTP client for Windows built with WinUI 3.

  Both panes host independent tabs, so several local and remote locations can be open at once. Its distinguishing feature is a server-side command channel: when both panes point at the same host, a remote-to-remote copy is executed by the server itself with a single `cp`, so traffic never round-trips through your machine and large directory trees arrive in one shot. The channel also powers server-computed SHA-256/SHA-512/SM3 checksums and fast `rm -rf` of large trees, and it falls back to plain SFTP automatically when unavailable.

  Other features: remote edit with automatic save-back, sync-browse folder comparison, drag & drop in all four directions, upload queue with per-file progress and retry, chmod grid, a host command console, host fingerprint pinning (SHA256) and DPAPI-encrypted credentials. Distributed as a self-contained single exe with no runtime to install; dark/light themes and English/Chinese UI switchable at runtime.
