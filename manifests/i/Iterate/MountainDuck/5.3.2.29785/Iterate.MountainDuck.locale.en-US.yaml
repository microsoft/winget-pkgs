ReleaseNotes: |-
  - [Feature] Lock files on server when opening in "Integrated" connect mode (Windows, WebDAV)
  - [Feature] Set read-only permissions on files locked on server when opened "Integrated" connect mode (Windows, WebDAV)
  - [Feature] "Keep Offline on Local Disk" and "Delete on Local Disk" context menu items in "Integrated" connect mode (Windows)
  - [Feature] Suppress sleep mode during file transfers (Windows)
  - [Feature] Resolve *.localhost hostnames to loopback address
  - [Feature] Support hierarchical namespaces in Azure Data Lake filesystems (Azure)
  - [Bugfix] Open Microsoft Office files in read-only mode when locked on server (WebDAV)
  - [Bugfix] Password saved regardless of checkbox selection (Cryptomator)
  - [Bugfix] Skip client certificate selection with no issuers sent from server (WebDAV)
  - [Bugfix] Connect with Integrated Windows Authentication (IWA) connection profile (WebDAV)
  - [Bugfix] Failure to connect with default path set to vault (Windows, Cryptomator)
  - [Bugfix] Access denied error creating new folder in vault (Windows, Cryptomator)
  - [Bugfix] Command execution with credential_process configuration fails (S3, macOS) (#18256)
  - [Bugfix] Login failure connecting to AWS GovCloud (S3) (#18336)
  - [Bugfix] Failure comparing large files with no checksum available (Backblaze B2) (#18363)
