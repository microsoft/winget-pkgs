ShortDescription: Drag a file, tap a key, drop it on the wheel. Offline file converter and toolbox for Windows.
Description: |-
  DragWheel is a free, open-source tray app that converts files without opening a program.
  While dragging a file in File Explorer, tap Shift, Ctrl or Alt (or scroll the mouse wheel) and a radial menu
  appears under the cursor. Drop the file on a slice to convert it or run a tool: images, video, audio, PDF,
  Office files, subtitles, e-books and archives (ZIP, 7Z, RAR, TAR), plus crop & resize, compress, trim, merge
  and file actions. Everything runs on your PC; nothing is uploaded.
