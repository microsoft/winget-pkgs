ShortDescription: Free and open source programmer for two-way radios of 44 brands (Baofeng, Quansheng, Radtel, Retevis…)
Description: |-
  IU0VYT Flash reads and writes channels, repeaters, settings and firmware of 451 handheld
  two-way radio models of 44 brands (Baofeng, Bajeton, Quansheng, Retevis, Radtel, Radioddity,
  TIDRADIO, TYT and more), including DMR, GMRS/FRS and PMR446 radios. It identifies the
  connected radio automatically, converts channels between radios and files (CHIRP .img and CSV,
  Excel), makes a backup before every write and verifies it afterwards. Interface in 11 languages.
