ReleaseNotes: "This release updates the certificate bundles to distrust the [compromised eMudhra CA](https://scotthelme.co.uk/eight-bits-of-trust-emudhras-ca-keys-cracked-in-milliseconds/). Without it, anyone could intercept HTTPS requests to your Jellyfin server *until 2039*. The release was tested against `mitmproxy --emudhra` to confirm both mpv and python reject the certificate.\n\nSecurity:\n• Fix eMudhra TLS bypass via compromised CA.\n  • For PyPI users, `jellyfin-mpv-shim` takes a hard dependency against `certifi>=2026.10.19`, to ensure you also get the fix.\n\nAdditional Changes:\n• Add Special Features for movies and TV shows (#759)\n• Fixed a second player window opening when restoring from minimized (#828)\n• The app now exits cleanly if the player cannot be restarted.\n• The Trailer button only appears when the server has a trailer.\n• Add a More menu to detail pages with Refresh Metadata (#764)\n• Delete from Disk moved into the More menu.\n• Improve button UX and update Elegance theme (#839, #840)\n• Fix invalid regex throwing, windows direct paths, credential file perms, handle nullable settings ([pokke#1](https://github.com/pokke/jellyfin-mpv-shim/pull/1))\n\nWhen upgrading/installing on Linux via PyPI, use:\n\n```\npip install --upgrade \"jellyfin-mpv-shim[all]\"\n```\nYou can also [install on Linux via Flathub](https://flathub.org/en/apps/com.github.iwalton3.jellyfin-mpv-shim).\n\nAbout testing：The end-to-end test suite now has a faster light tier for use during development, and the release gate still runs the full suite on both mpv backends on Linux and Windows.\n\nAbout Windows Downloads:\n • If your CPU is older than roughly 2013 or you get a `0xc0000142` error you need to use the LEGACY64 build.\n • You do not need administrator rights to install the software.\n • You can avoid warnings on files by unblocking the file in the properties dialog.\n • **You may need to disable Smart App Control if unblocking via Properties does not work.**\n\nDevelopment was assisted using AI."
