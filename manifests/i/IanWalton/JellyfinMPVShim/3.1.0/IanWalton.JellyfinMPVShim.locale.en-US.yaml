ReleaseNotes: "This release fixes some issues with offline sync, namely how it syncs progress back and handles multiple users. System language detection works better now and can be overridden in settings. Several other polish and bug fixes are also included, this release fixes a lot of \"v3 contacts reality\" issues my manual testing missed.\n\nChanges:\n• Server connection issues are handled better and can be retried.\n  • You can now log in a server that lost its login.\n  • If the server drops video playback, a clear error is now shown.\n• Re-work offline progress sync\n  • Offline sync actually reliably syncs progress including manual watch/unwatch\n  • Multiple users using the offline catalog is now handled properly\n  • Fixed and properly tested download folder moving\n• The deeper UI updates now when state changes elsewhere, not just the homepage.\n• Fixed numerous playback bugs\n  • Fixed video resume sometimes breaking playback position (#761, #765)\n  • Fixed issue where HDR gets disabled (#771)\n  • Fixed video playing while it is still loading (#785)\n  • Fixed closing external mpv not stopping the application\n  • Opening the application while playing now just raises the window\n  • Fullscreen in browser now implies player fullscreen\n• Fix numerous library issues\n  • Fixed intermittent blank library page on film ending\n  • Library sort is now remembered between visits\n  • Metadata refresh option added (#764)\n  • Missing episodes are now marked and don't get play attempts\n  • Added shuffle and description to season pages\n  • Fix rounded tiles on Nebula/Purple Haze theme (#777)\n  • Prevented homepage flickering for HiDPI/many library users\n• Improved server/profiles system\n  • Added server discovery (#755)\n  • You can select the offline catalog as a separate server while online\n  • Fixed newlines being pasted into login forms\n  • Slow/unreachable servers now better handled when switching servers/profiles\n  • Quick connect can be retried/cancelled\n• Casting & Syncplay\n  • Casting a photo album is now supported, although some servers sometimes send nothing\n  • Empty syncplay queues don't crash the player anymore\n  • Syncplay now uses the online source if your downloaded copy is stale\n• UI & Settings\n  • Improved UI summoning reliability (#767)\n  • Added multimedia back/forward key support\n  • Added keybind `kb_nav_back` to go back and keep fullscreen (#762)\n  • Trickplay is now DPI-aware\n  • Clarified language-config settings (#766)\n• Platform Issues\n  • Enabled flatpak screen wakelock support (#772)\n  • Added fontconfig support for distros like NixOS that put their fonts in non-standard places (#786)\n\nWhen upgrading/installing on Linux via PyPI, use:\n\n```\npip install --upgrade \"jellyfin-mpv-shim[all]\"\n```\n\nYou can also [install on Linux via Flathub](https://flathub.org/en/apps/com.github.iwalton3.jellyfin-mpv-shim).\n\nAbout testing：This release also fixed the end-to-end tests suites so they exercise more of the real application and help ensure functionality isn't missed. The release gate is over an hour of automated UI testing using real UI, keyboard/mouse, and a real network block for offline sync, not just a quick hand-test like it used to be pre-3.0.\n\nAbout Windows Downloads:\n • If your CPU is older than roughly 2013 or you get a `0xc0000142` error you need to use the LEGACY64 build.\n • You do not need administrator rights to install the software.\n • You can avoid warnings on files by unblocking the file in the properties dialog.\n • **You may need to disable Smart App Control if unblocking via Properties does not work.**\n\nDevelopment was assisted using AI."
