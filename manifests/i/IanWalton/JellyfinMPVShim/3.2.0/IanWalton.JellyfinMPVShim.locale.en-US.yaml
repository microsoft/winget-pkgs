ReleaseNotes: "This release adds input method support, external bitmap subtitle and audio support, MPRIS (media key) support on Linux, fixes a possible crash when scrolling the library, and makes library filters persistent. Transcoding media with PGS/VOB subtitles doesn't require burning those subtitles in anymore, making transcoded subtitles easier to read. There's also a new theme \"Elegance\" inspired by the ElegantFin custom CSS theme.\n\nChanges:\n• Add MPRIS media controls support for Linux (#129)\n  • Full support including next/prev and cover art. Confirmed working with playerctl and KDE connect.\n• IME input now works in text fields on Windows and Wayland (#798). X11 is not supported.\n• External subtitles and audio\n  • External PGS and VobSub (as `*.mks`) files are now playable.\n  • Transcodes can extract bitmap subtitles now, making subtitles significantly easier to read on transcodes.\n  • Transcode subtitle extraction can be slow, it is done async to avoid hanging the player. If you have problems, either install [Subtitle Extract](https://github.com/jellyfin/jellyfin-plugin-subtitleextract) or disable via the `extract_image_subtitles` setting.\n  • External audio tracks are supported, this still requires a remux at a minimum.\n• Fixed possible app crash during library scrolling (#800)\n• Added Elegance theme, inspired by ElegantFin (#805)\n• Library\n  • Library filters are now remembered by default. You can disable this via a setting.\n  • Collections have been added to the Favorites page (#816).\n  • HTML and BBCode in descriptions are now removed if your metadata provider adds them.\n• Playback\n  • Audiobooks are now resumable from tile play button/menus.\n  • Music queues now support shuffle.\n  • Play queues now update more reliably when updated by a phone or Syncplay.\n  • The music volume slider now shows the actual volume not 100%.\n  • Trickplay images towards the end of the video now load.\n  • Fixed external MPV sometimes hanging on shutdown.\n  • Fixed possible race condition from Syncplay queue updates.\n  • `stop_cmd` runs when playback ends for any reason now, and is skipped by default when casting over an already playing queue (configurable).\n• Images\n  • Added support for EXIF rotation and ICC colour profiles.\n  • Excessively large images are now refused instead of using up large amounts of RAM.\n  • The thumbnail cache doesn't remember broken images anymore.\n  • Downloaded images are fully cleaned up when removing media.\n  • Fixed issue where trickplay spams duplicate requests.\n  • Missing chapter images are now handled.\n  • Fix handling of corrupted images in comic/epub readers.\n• Platform-specific\n  • Updated mpv version on Windows.\n  • Updated flatpak runtime to GNOME 51.\n\nWhen upgrading/installing on Linux via PyPI, use:\n\n```\npip install --upgrade \"jellyfin-mpv-shim[all]\"\n```\n\nYou can also [install on Linux via Flathub](https://flathub.org/en/apps/com.github.iwalton3.jellyfin-mpv-shim).\n\nAbout testing：The end-to-end test suite now has a faster light tier for use during development, and the release gate still runs the full suite on both mpv backends on Linux and Windows.\n\nAbout Windows Downloads:\n • If your CPU is older than roughly 2013 or you get a `0xc0000142` error you need to use the LEGACY64 build.\n • You do not need administrator rights to install the software.\n • You can avoid warnings on files by unblocking the file in the properties dialog.\n • **You may need to disable Smart App Control if unblocking via Properties does not work.**\n\nDevelopment was assisted using AI."
