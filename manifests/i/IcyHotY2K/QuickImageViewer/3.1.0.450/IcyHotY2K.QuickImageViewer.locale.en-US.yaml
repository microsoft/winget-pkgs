ReleaseNotes: |-
  qIV 3.1.0.450
  Cull a photo shoot without leaving the viewer. Point qIV at four hundred frames,
  press one key per picture, and the ones you rejected move together at the end. Nothing
  touches the disk until you say so.
  The Find box also learned to filter by size and date, and four bugs found after 3.0 are
  fixed — one of them a decoder reading undefined values.
  Cull mode — Alt+Space
  A pass through a folder saying yes or no to each picture.
  - One keystroke per picture. K keeps, X rejects, U clears the mark, and each one
    advances by itself — four hundred frames is four hundred keys and no mouse. Press the
    same key twice on a picture to undo it.
  - You can see what you decided. The filename carries its mark as you go: a tick for
    keep, a cross for reject, a dot for one you have not judged yet. Thumbnail strips tint
    to match — green for keep, red for reject.
  - Nothing is written while you mark. The marks live in memory. Leaving the mode is
    what asks, and the count it names is the count it moves. Say no and nothing happens.
  - Rejects stay on disk. They go into a _rejected folder beside them — same drive,
    same place, undoable with Ctrl+Z in Explorer. Never the Recycle Bin, never a delete.
  Or keep the winners instead. Whichever mark you used is the one that acts: mark
  rejects and those move, mark only keeps and you are asked whether to move everything
  else. That is how four hundred frames become the twelve good ones without rejecting the
  other 388 one at a time.
  Or forty at once. While the mode is on, a strip's right-click menu gains Mark Keep,
  Mark Reject and Clear Mark, and they act on the whole selection. The keyboard marks
  one picture; a strip can mark forty.
  Entering cull mode stops a running slideshow — a playlist advancing on a timer while you
  mark would land your keystrokes on the wrong picture.
  Find by size and date
  Type a comparison into the Find box, next to a name or on its own:
  ───────────┬────────────────────────────────────────
  Typed      │Finds
  ───────────┼────────────────────────────────────────
  >5mb       │everything over five megabytes
  ───────────┼────────────────────────────────────────
  <500kb     │everything under five hundred kilobytes
  ───────────┼────────────────────────────────────────
  >2024      │anything modified after 2024 ended
  ───────────┼────────────────────────────────────────
  <2024-06   │anything modified before June 2024 began
  ───────────┼────────────────────────────────────────
  >5mb sunset│the big ones called sunset
  ───────────┴────────────────────────────────────────
  They combine with each other and with the name. A word only becomes a filter when it
  cannot be anything else, so ordinary filename search is untouched — a file actually named
  2024 still matches.
  Fixes
  - EXR and HDR files could produce arbitrary pixels. The tone-map guard ran after the
    Reinhard curve instead of before it, so a NaN, a negative or an infinity in a
    high-dynamic-range file reached the conversion unchecked.
  - Every cross-folder search matched the wrong text. An invalid escape sequence broke
    the separator search in the folder index, so Ctrl+Shift+F compared your query against
    whole paths instead of filenames.
  - A folder scan could die on a permission error. The directory walk threw partway
    through instead of skipping the entry.
  - A COM reference leaked on every thumbnail panel that registered a drop target.
  qIV Remote — the Android app
  qIV Remote is
  on Google Play — free, no ads, no account. It turns any phone or tablet into a remote
  control, a second screen, or a photo frame this app drives, as many at once as you
  have devices lying around.
  Nothing about it changed in 3.1; it works with this release as it did with 3.0.
  What it does →
  Also
  A Microsoft Store package (MSIX) is built and signed. The site gained two guides —
  finding duplicate photos
  and opening EXR and HDR on Windows.
  The test suite grew from 459 checks to 751 across 31 groups, and the build now fails on an
  invalid escape sequence in any string literal — the bug above, made impossible to repeat.
  Windows 10 & 11 · one portable EXE, no installer, no telemetry.
