ReleaseNotes: |-
  qIV v2.250.0.316
  Folder-tree navigation, a reorganised settings menu, and a set of tools for keeping
  your folder history clean.
  Single portable executable, still under 10 MB. No installer, no runtime to install
  first, no background service, nothing phoned home.
  Walk the folder tree from the keyboard
  Alt + the arrow keys now move through folders the way the arrow keys move through
  images:
  ─────────┬────────────────────────────────────────────
  Key      │Goes
  ─────────┼────────────────────────────────────────────
  Alt + ↑  │up to the parent folder
  ─────────┼────────────────────────────────────────────
  Alt + ↓  │down into the first subfolder
  ─────────┼────────────────────────────────────────────
  Alt + ← /│across to the previous / next sibling folder
  →        │
  ─────────┴────────────────────────────────────────────
  Each step names where it landed — ➡ 8/20 "13_Music" — so a sideways walk through
  twenty folders never leaves you guessing which one you are in. Wrapping at the ends is
  a tray setting. Landing somewhere empty or missing is explained on screen rather than
  looking like a key that did nothing.
  Settings › History
  Everything about the folder history now lives in one submenu instead of being scattered
  through the settings list.
  Recording
  - Record Folders I Visit — the master switch. Off stops new folders reaching both
    the list and qivHistory.txt, without affecting navigation.
  - Record Only Folders With Images (new default: on) — folders holding no images
    are not recorded. Walking the folder tree lands you in every child of a parent,
    images or not; this keeps those out of the list so what remains is places you
    actually looked at pictures.
  Housekeeping — each asks first, and backs up the file before touching it:
  - Remove Invalid Folders — drops rows that are not a usable path, point somewhere
    that no longer exists, or hold no images.
  - Remove Duplicates — collapses repeats, keeping the most recent.
  - Clear History, Clear Favorites, Clear History and Favorites — each names
    what survives it.
  - Open History File — straight to qivHistory.txt in Explorer.
  Limits — the labels now say which question each one answers: Rows Shown in Panel
  and Favorite Rows Shown in Panel are display only, while Favorites You Can Add and
  Folders Saved to File bound what is stored.
  Backup & Export
  A new top-level menu collecting every operation that moves data on and off the disk,
  instead of having them split between the Settings menu and a Backup menu.
  - Export / Import Settings — as before
  - Backup Logs — zips the whole logs folder to wherever you choose. Handy for a
    bug report
  - Backup / Restore TCP/IP Config — qivLocalServer.ini, qivRemoteServers.ini and
    qivRemoteServerBlacklist.ini. None of these live in the registry, so the settings
    export never covered them. Restore asks per file before replacing one that exists
  - Backup / Restore History & Favorites — as before
  Also new
  - Full Path in the overlay — the bottom-left slot can show the whole path
    (📂 D:\Pics\Summer) instead of just the folder name (📁 Summer).
  - A searchable shortcut reference on the website, generated from the app's own
    help window so the two cannot drift apart.
  Fixed
  - The folder walk did nothing on some drives. If a volume had picked up the SYSTEM
    attribute on its top-level folders — an old attrib +s, or a sync tool — the
    subfolder filter dropped every one of them, so Alt + ← / → reported "No further
    folder in that direction" in a folder with twenty siblings beside it. The filter now
    tests only the HIDDEN attribute, which still excludes $RECYCLE.BIN and
    System Volume Information.
  - Base64 decode table race. The lookup table used by the remote protocol could be
    built by two threads at once.
  - Empty-query handling in Find now matches what the code actually guarantees.
  - Several actions that could fail silently now say what happened, including the
    "no further folder" message, which reports the position and count it refused on.
  qIV Remote for Android
  The desktop is one half. qIV Remote turns a phone or tablet into a remote control,
  a live preview, and a photo frame that sends pictures to any screen running qIV.
  Free, and it stays usable free: one saved desktop, the Simple remote, and every
  security feature included. No ads at all — the same "no account, no cloud, no
  analytics, no advertising" rule the desktop follows.
  A one-time unlock (about USD 2, no subscription, no account) adds unlimited saved
  desktops, the Advanced and Fullscreen screens, phone-to-desktop streaming and
  save-to-gallery.
  Not sure? A built-in demo mode runs the entire app with no desktop at all, and
  never opens a network socket.
  Download
  QuickImageViewer.exe below — single file, statically linked, nothing else needed.
  Verify the SHA-256 against the checksum in the assets if you like.
