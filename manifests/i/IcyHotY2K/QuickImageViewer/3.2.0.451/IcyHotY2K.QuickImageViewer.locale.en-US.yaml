ReleaseNotes: |-
  qIV 3.2.0.451
  Several windows, working as one. Open a second copy with one key, lay every copy out
  on the screen with another, and switch on Sync Instances to make next, previous and zoom
  happen in all of them at once. Each window stays in its own folder.
  The download and last-commit badges on this page stop saying "invalid", too.
  New instance — Ctrl+N
  qIV normally runs as one copy: launching it again hands the picture to the window that
  is already open. Ask for a second window when you want one:
  - Ctrl+N, or right-click › New Instance
  - Shift + double-click anywhere on the picture (a plain double-click still toggles
    fullscreen)
  - Hold Shift while launching qIV from Explorer or a shortcut
  Sync Instances — Ctrl+Shift+N
  Two folders side by side, compared picture by picture.
  - One switch for every window. Turn it on in any copy and every copy is synced; turn
    it off in any copy and they all stop.
  - What follows: next / previous, first / last, zoom in / out / reset, keyboard pan
    (W A S D) and rotate / flip. From the keys, the mouse wheel or the menu — and
    from whichever window you happen to be in.
  - Each window walks its own folder. Next means its next picture, not the other
    window's.
  - You can see it is on. A gold SYNC leads the top-right corner of every synced
    window.
  - A window opened with Ctrl+N while sync is on joins straight away. Sync is never
    saved — every launch starts with it off.
  Window Placement — right-click menu
  Every window-moving key in one place, each with its shortcut beside it:
  ─────────────────────────────────────────────────────────┬────────────────────────────
  Menu                                                     │Key
  ─────────────────────────────────────────────────────────┼────────────────────────────
  Left / Right / Top / Bottom half                         │Alt+A Alt+D Alt+W Alt+S
  ─────────────────────────────────────────────────────────┼────────────────────────────
  Top-left / top-right / bottom-left / bottom-right quarter│Alt+Q Alt+E Alt+Z Alt+C
  ─────────────────────────────────────────────────────────┼────────────────────────────
  Move one step left / right / up / down                   │Shift+A Shift+D Shift+W
                                                           │Shift+S
  ─────────────────────────────────────────────────────────┴────────────────────────────
  Arrange All Instances lays out every open qIV window on the monitor you are using:
  ──────────┬────────────────────────────
  Windows   │Layouts
  ──────────┼────────────────────────────
  2         │Side by Side, Top and Bottom
  ──────────┼────────────────────────────
  3         │Three Columns, Three Rows
  ──────────┼────────────────────────────
  4         │Four Corners
  ──────────┼────────────────────────────
  any number│Grid
  ──────────┴────────────────────────────
  Layouts that do not fit the number of open windows are greyed out. Each window takes the
  slot nearest to where it already was, and windows on other monitors are brought over.
  Dedicated screens and windows hidden in the tray are left exactly where they are.
  Cycle the arrangement — Ctrl+Alt+Space
  One key for all of it.
  - With several windows it steps through the layouts for that count — two windows go
    side by side, then top and bottom — and the next press puts every window back where
    it was, fullscreen included. A window you moved by hand in the meantime is left where
    you put it. Press it in any window; they all share the same cycle.
  - With one window it walks the screen clockwise from the top: top, top-right, right,
    bottom-right, bottom, bottom-left, left, top-left — then back to its normal size in the
    middle, and round again.
  Fixes
  - Snapping a fullscreen window broke it. Alt+W A S D and the quarter snaps
    shrank the window but left it borderless, always on top and still treated as
    fullscreen. Snapping now leaves fullscreen first.
  - The download and last-commit badges kept showing "invalid". They depended on a
    shared quota that runs out; they are now served from this repository's own data and
    update on every push.
  qIV Remote — the Android app
  qIV Remote is
  on Google Play — free, no ads, no account. It turns any phone or tablet into a remote
  control, a second screen, or a photo frame this app drives, as many at once as you
  have devices lying around.
  Nothing about it changed in 3.2; it works with this release as it did with 3.1.
