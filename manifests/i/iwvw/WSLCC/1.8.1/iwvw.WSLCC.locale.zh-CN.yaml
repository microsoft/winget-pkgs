ShortDescription: Windows 平台上的 WSL 容器（wslc）桌面管理器。
Description: |-
  Windows 上的 WSL 容器（wslc）桌面管理器
  基于微软官方 WSL Container API 与 wslc CLI，提供镜像、容器、Compose 编排、卷、日志的图形化管理。
  特性
  - 仪表盘：环境状态、资源配额、活动会话
  - 容器：列表、资源统计、启停/删除、打开端口网址、日志
  - 编排：Compose 项目部署、编辑、重建、停止、删除
  - 镜像：查看、删除、拉取记录
  - 卷：挂载卷管理
  - 日志与审计：容器日志查看、操作留痕
  - 设置：会话、镜像加速、外观
Tags:
- wsl
- wslc
- 容器
ReleaseNotes: |-
  v1.8.1
  识别并提示 wslc 数据目录为重解析点导致的 0x800701c0。
  变更
  - 启动自检：检测 %LOCALAPPDATA%\wslc 与默认存储路径是否为重解析点（junction/符号链接）。
  - 首页指引与容器页警告条：当出现 0x800701c0（不受信任的装入点）或自检命中重解析点时，给出针对性说明：把存储路径改为真实目录，或把 %LOCALAPPDATA%\wslc 恢复为普通目录。
  - 容器统计轮询的相同错误只记录一次，不再每 3 秒刷屏。
