ShortDescription: Lumière d'ambiance pour les écrans à LED RGB au dos. Chaque LED suit l'image à l'écran en temps réel.
Description: |-
  Glowback transforme les LED RGB au dos d'un écran en lumière d'ambiance : chaque LED prend la couleur de la partie de l'écran la plus proche, en temps réel, y compris pour les vidéos plein écran, les jeux et le HDR.
  Il pilote les appareils Windows Dynamic Lighting (HID LampArray) et OpenRGB, tourne à côté de l'horloge avec une fenêtre de réglages, et peut aussi afficher une couleur, un dégradé ou suivre la musique jouée par le PC.
  Des profils changent l'ambiance selon l'heure ou l'app. Home Assistant et les apps Matter (Apple Maison, Google Home, Alexa) peuvent l'allumer, régler sa luminosité et sa couleur.
