ShortDescription: Ambient light for monitors with RGB LEDs on the back. Every LED follows the picture on screen in real time.
Description: |-
  Glowback turns the RGB LEDs on the back of a monitor into an ambient light: each LED takes the color of the part of the screen next to it, in real time, including fullscreen video, games and HDR.
  It drives Windows Dynamic Lighting (HID LampArray) and OpenRGB devices, runs next to the clock with a settings window, and can also show one color, a gradient, or follow the music your PC plays.
  Profiles change the look by the hour or by app. Home Assistant and Matter apps (Apple Home, Google Home, Alexa) can switch it, dim it and color it.
