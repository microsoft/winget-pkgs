ReleaseNotes: |-
  Executive Summary
  ChemScribble v1.1 includes improvements to stabilize the orientation of interpreted structures in "Redone" mode, adds a button for exporting interpreted chemical data to the system clipboard in various formats, and includes some new settings.
  Additions
  1. Interpreted structures in "Redone" mode are now aligned to your scribble to make the interpretation view much more stable as you are scribbling.
  2. Added a "Export to System Clipboard" button to the Export toolbar. By default, SMILES is exported, but you may choose between other chemistry formats in the Settings window, under the Export tab.
  3. Added an option in the Interpretation panel of the Settings window to control the rendering of implicit hydrogens..
  Fixes
  1. Adjusted the interpretation to avoid merging bonds if the angle is acute and one side connects to a label, but the other sides connect to different bond strokes.
  2. Cubane bond z-order rendering has been corrected.
