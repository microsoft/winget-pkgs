ReleaseNotes: |-
  Executive Summary
  ChemDoodle 3D v8.0 introduces a more flexible interface, new tools for automatically assigning formal charges and lone pairs, improved stereochemistry handling when generating 3D structures, WebP image export, greater control over molecular drawing and symmetry, faster BFGS optimization, and several file and clipboard improvements.
  Additions
  1. Improved distance-geometry embedding provides more reliable enforcement of specified stereochemistry when generating 3D coordinates, even for structures with deeply embedded or constrained stereochemical features. Please see chapter 16 of the user guide for more information about stereochemistry in 3D.
  2. The interface has been improved with better toolbar trays, convenient drop-down buttons for related tools, and scene tabs that can be reorganized by dragging them into a new order.
  3. New functions can automatically calculate and assign formal charges or the appropriate number of lone pairs to selected atoms based on the existing molecular structure. Find these commands under Molecule > Atom Properties > Place Formal Charges and Molecule > Atom Properties > Place Lone Pairs. Please see section 15.4 of the user guide for instructions.
  4. Added full WebP image export support, including both lossy and lossless compression, for creating high-quality graphics with flexible file sizes. Please see section 17.7 of the user guide for image output options.
  5. When drawing bonds, hold the Space key to temporarily disable automatic connection to an existing atom. This allows you to place a new atom even when it overlaps another atom in the scene.
  6. Improved the performance of the BFGS optimizer for faster molecular energy minimization.
  7. A new Recent Colors panel in the color chooser provides quick access to the last 13 selected colors, making it easier to reuse colors consistently across graphics.
  8. Added a Tolerance setting for the Symmetrize function in the Symmetry widget settings, giving you more control over how much atomic coordinates may deviate from ideal symmetry. Please see section 15.12.6.5 of the user guide for background on the Symmetrize function.
  9. Pasting 2D chemical structures now follows the same processing as opening a 2D document, including the handling of chemical abbreviations when generating 3D structures.
  Fixes
  1. Fixed an issue that prevented automatic placement of electrons and lone pairs when the rotation axis was aligned with the z-axis.
  2. The Symmetrize function now resets electron placements after adjusting atomic coordinates so that electrons and lone pairs are positioned appropriately for the updated geometry.
  3. Corrected binary PLY file output so that vertex positions are written properly.
  4. Edit > Copy As > iChemLabs ChemDoodle 3D Scene now correctly includes shapes in the text output.
  5. Improved PDB import by trimming unnecessary whitespace from ID input, avoiding whitespace-related parsing problems.
