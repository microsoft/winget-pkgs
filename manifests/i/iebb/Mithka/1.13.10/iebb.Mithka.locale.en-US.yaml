ShortDescription: A fast, compact, cross-platform Telegram client built with Flutter and TDLib.
Description: |-
  Mithka is a fast, compact, cross-platform Telegram client built with Flutter and TDLib over Dart FFI. It runs natively on Android, iOS, macOS, Windows, Linux, and HarmonyOS Next—adapting from single-hand phone navigation to multi-pane tablet and desktop workspaces.
  Highlights
  - Real TDLib core, multi-account ready: Dedicated background receive isolate over libtdjson, instant account switching, passkey and QR sign-in, SOCKS5 / HTTP / MTProto / Web proxies, and encrypted session backup/import.
  - Rich messaging & composer: Replies, quotes, reactions, custom emoji, animated .tgs and .webm stickers, sticker studio, GIFs, polls, checklists, scheduled sends, rich-text formatting, LaTeX math, and inline/reply bots.
  - Media, voice & calls: Streaming fullscreen video player with Picture-in-Picture and desktop pop-out windows, voice and circular video notes, built-in music player with system Now Playing controls, and 1-to-1 / group voice calls.
  - Communities, topics & feeds: Chat folders, forum topic strips, Telegram Communities, story and channel photo/video feeds, Telegram Mini Apps, and optional on-device or user-configured AI translation and unread summaries.
  - Intentional design system: Explicit typography, spacing, corner-radius, and light/dark palette tokens (lib/theme/app_theme.dart), custom modal dialogs and controls, and project-owned vector icons (AppIcon / HeroAppIcons) rather than stock Material or Cupertino icon sets.
  - Localized in 8 languages: English, Simplified Chinese, Traditional Chinese, Japanese, Korean, German, French, and Spanish.
