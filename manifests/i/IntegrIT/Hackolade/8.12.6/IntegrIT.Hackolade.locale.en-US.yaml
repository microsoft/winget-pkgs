  - Grid View: added lower tab for Views
  - Grid View: added lower tab for Edges
  - Grid View: improved performance of global search
  - PowerDesigner: added support for reverse-engineering relationships without an explicit parent entity
  - PowerDesigner: added default business name "Nameless" for view columns lacking a defined name in Physical Data Model file
  - BigQuery: updated brace-expansion library
  - Cassandra, Oracle, ScyllaDB: updated adm-zip library
  - CosmosDB-with-Gremlin-API, CosmosDB-with-Mongo-API, CosmosDB-with-SQL-API, Snowflake: updated axios library
  - EventBridge, OpenAPI: updated js-yaml and fast-uri libraries
  - Oracle: added support for reverse-engineering DDL reserved words as identifiers
  - Oracle: allowed Oracle-specific scalar properties of attributes referencing a definition to have their own values
  - Protobuf: updated protobufjs library
  - Swagger: updated js-yaml library
