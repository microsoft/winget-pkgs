ReleaseNotes: |-
  - Tech refresh of ElectronJS (v42.8.0), NodeJS (v24.18.0), Chromium (v148.0.7778.280), V8 engine (v14.8.178.38), and related modules
  - DBML: added reverse-engineering of column level check constraints
