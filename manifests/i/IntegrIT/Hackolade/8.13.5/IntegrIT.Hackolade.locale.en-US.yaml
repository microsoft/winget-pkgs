ReleaseNotes: |-
  - Tech refresh: ElectronJS v44.7.2 (Chromium v152.0.7977.149, NodeJS v24.21.0, V8 v15.2.124.37), and related modules
  - Compare & Merge: enhanced comparison of composite keys (group properties) when matching by technical or business name instead of IDs to generate more accurate ALTER script
  - Excel: enhanced reverse-engineering to handle entity attributes with identical business names
  - External references: display unique checkbox for columns in composite unique key in an externally referenced entity, and more generally enhanced handling of block and group properties when creating references
  - Forward-Engineering: improved performance when generating JSON or DDL artifacts by computing shared calculations once, most noticeably on models with external references
  - Forward-engineering: added tolerance for non-array field lists during extended JSON Schema export
  - Grid View: added Supertype group rows plus supertype-subtype related properties
  - Polyglot and External references: enhanced object selection with a checkbox tree
  - PowerDesigner: added preservation of visual options (background, font, border color) in annotation symbols
  - PowerDesigner: added detection of target database version from PDM files
  - PowerDesigner: added reverse-engineering of Annotations and Keywords into a custom property
  - Supertype groups: added warnings in the derive progress modal when selected entities are not derived due to conceptual choice
