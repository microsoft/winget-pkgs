ReleaseNotes: |-
  Links open again. Clicking a link in an answer, a citation, or a web-search result did nothing in the desktop app; the only way out was to copy the URL by hand. 0.2.25 opens links to other sites (and mailto:/tel: links) in your default browser, and links back into the chat itself in another InferenceHub window so you stay signed in.
  Unsigned build — SmartScreen shows "Windows protected your PC"; click More info → Run anyway. If the WebView2 Runtime is missing (rare), the installer downloads it automatically.
  The Windows build is chat + sign-in + tray only (no live transcription / Stealth Mode / window opacity / overlay hotkeys — those are macOS-only for now). A code-signed build (no SmartScreen warning) is pending an Authenticode / Azure Trusted Signing cert.
ReleaseNotesUrl: https://github.com/InferenceHub/inferencehub-desktop/releases/tag/v0.2.25
