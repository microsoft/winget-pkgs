ReleaseNotes: |-
  Windows: the app opens again. Every Windows install of 0.2.23 failed on launch (a dark window flashed, then nothing) because the main window was created twice. 0.2.24 fixes that; run the installer over the existing install. macOS was not affected; the macOS build is a version bump only.
  Unsigned build — SmartScreen shows "Windows protected your PC"; click More info → Run anyway. If the WebView2 Runtime is missing (rare), the installer downloads it automatically.
  The Windows build is chat + sign-in + tray only (no live transcription / Stealth Mode / window opacity / overlay hotkeys — those are macOS-only for now). A code-signed build (no SmartScreen warning) is pending an Authenticode / Azure Trusted Signing cert.
