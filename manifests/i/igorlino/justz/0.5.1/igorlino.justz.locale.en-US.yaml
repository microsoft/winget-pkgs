ShortDescription: Help, checks, shims and completion for just
Description: justz adds a data-driven help system, documentation checks, command shims and shell completion to the just task runner. It renders grouped help from a justfile or its command registry, checks that recipes are documented, registers a shim such as tz that runs a project's justfile from any directory, and completes group and command names in zsh and bash.
