License: Proprietary
ShortDescription: Per-user cron scheduler and background service that syncs with the norc cloud
Description: norc-cli is a per-user background service and cloud control-plane client. Once registered with "norc service install", it starts at login, reads and writes managed crontab entries, and synchronizes jobs, machines and run history across your devices through norc's cloud services. It authenticates with your norc account or API-device credentials. If you use AI schedule creation, your prompt is sent to the AI provider you select.
