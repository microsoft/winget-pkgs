ShortDescription: 꾹꾹이 모션과 32Hz 골골송을 들려주는 초경량 고양이 뽀모도로 데스크톱 펫
Description: |
  Purr Focus는 투명 프레임리스 창 위에 상주하는 사랑스러운 고양이 뽀모도로 타이머입니다.
  사용자 맞춤형 집중/휴식 시간 설정, 32Hz 저주파 골골송 신디사이저, 꾹꾹이 스트레칭 애니메이션,
  인터랙티브 쓰다듬기 반응 및 클릭 투과(Click-Through) 기능을 지원합니다.
