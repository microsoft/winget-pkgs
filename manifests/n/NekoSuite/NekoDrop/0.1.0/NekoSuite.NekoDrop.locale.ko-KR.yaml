ShortDescription: Rust Polars 기반 초고속 대용량 데이터 파일 변환기 (CSV ↔ Parquet ↔ JSON ↔ XLSX)
Description: |
  Neko Drop은 100% 로컬 오프라인에서 동작하는 귀여운 고양이 테마 파일 변환기입니다.
  Rust Polars 엔진을 탑재하여 수백만 행의 CSV, Parquet, JSON, 엑셀 파일을 수 초 만에 빠르게 상호 변환합니다.
  귀여운 생선 먹방 인터랙션과 타격감 넘치는 사운드를 함께 제공합니다.
