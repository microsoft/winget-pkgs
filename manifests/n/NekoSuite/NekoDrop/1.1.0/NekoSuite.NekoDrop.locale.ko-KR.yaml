ShortDescription: Rust Polars 기반 초고속 대용량 데이터 파일 변환기 (CSV ↔ Parquet ↔ JSON/JSONL ↔ XLSX)
Description: |
  Neko Drop은 100% 로컬 오프라인에서 동작하는 귀여운 고양이 테마 파일 변환기입니다.
  Rust Polars 엔진을 탑재하여 대용량 CSV, Parquet, JSON, JSONL, 엑셀 파일을 배치 드롭으로 빠르게 상호 변환합니다.
  귀여운 생선 먹방 인터랙션, 최근 변환 히스토리, 시스템 트레이 및 다국어 설정을 제공합니다.
