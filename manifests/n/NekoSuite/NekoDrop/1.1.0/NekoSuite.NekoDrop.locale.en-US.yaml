ShortDescription: Ultra-fast tabular data file converter powered by Rust Polars (CSV, Parquet, JSON, JSONL, XLSX).
Description: |
  Neko Drop is a lightweight, 100% offline desktop file format converter.
  Powered by the Rust Polars engine, it supports multi-file batch conversion between CSV, Parquet, JSON, JSONL,
  and Excel files in seconds with cute cat feeding animations and sound effects.
