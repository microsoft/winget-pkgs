ShortDescription: Clipboard data formatter (JSON tree/table, SQL, CSV grid, JWT) with Bongo Cat keyboard typing animations.
Description: |
  Bongo Format automatically detects copied clipboard data and formats it into clean JSON trees/tables,
  beautified SQL queries, virtualized CSV grids, and decoded JWT payloads.
  Features auto-clip on focus, snippet history, file export, Base64/URL codecs, and Bongo Cat typing animations.
