ShortDescription: 클립보드 데이터(JSON/SQL/CSV/JWT) 감지 및 포맷터 & 봉고캣 타건 애니메이션
Description: |
  Bongo Format은 클립보드에 복사된 데이터를 자동 감지하여 아름다운 JSON 트리/테이블,
  정렬된 SQL, 가상화 CSV 그리드 및 JWT 디코더로 즉각 서식화해 주는 개발자 유틸리티입니다.
  포커스 자동 붙여넣기, 스니펫 히스토리, 파일 내보내기, Base64/URL 코덱 및 봉고캣 타건 애니메이션을 제공합니다.
