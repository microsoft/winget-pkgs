Description: |
  Bongo Format은 클립보드에 복사된 데이터를 자동 감지하여 아름다운 JSON 트리/테이블,
  정렬된 SQL, 가상화 CSV 그리드 및 JWT 디코더로 즉각 서식화해 주는 개발자 유틸리티입니다.
  경쾌한 기계식 키보드 타건음과 사랑스러운 봉고캣 애니메이션을 제공합니다.
