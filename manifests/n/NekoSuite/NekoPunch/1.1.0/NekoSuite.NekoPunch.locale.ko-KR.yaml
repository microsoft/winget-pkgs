Description: |
  Neko Punch는 로컬 포트(8080, 3000 등) 충돌 시 원클릭으로 점유 프로세스를 깔끔하게 종료하는 개발자 유틸리티입니다.
  저부하 포트 감시, 프레임워크/프로젝트 힌트 표시, 일괄 냥펀치, '내 포트 ⭐' 즐겨찾기 및 시스템 트레이 숨기기를 지원합니다.
