ShortDescription: One-click port conflict detector & zombie process killer with cat boxing animations.
Description: |
  Neko Punch monitors occupied network ports (e.g. 8080, 3000) and terminates stubborn zombie processes
  with a single click using Windows native APIs. Features low-overhead scanning, framework/project hints, batch punch, system tray residency, and custom port bookmarks.
Tags:
  - cat
  - port
  - process-killer
  - developer-tools
  - network
ReleaseNotes: |
  - Optimized 3-second port polling to reuse System state and refresh only listening PIDs.
  - Added command-line/cwd project hints (e.g., vite, next, uvicorn), 1-click PID copy, batch punch for filtered ports, and hide-to-tray control.
