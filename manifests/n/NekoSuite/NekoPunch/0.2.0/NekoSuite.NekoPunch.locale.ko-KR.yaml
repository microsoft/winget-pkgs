ShortDescription: 포트 충돌 및 좀비 프로세스 원클릭 냥펀치 강제 종료기
Description: |
  Neko Punch는 로컬 포트(8080, 3000 등) 충돌 시 원클릭으로 점유 프로세스를 깔끔하게 종료하는 개발자 유틸리티입니다.
  '내 포트 ⭐' 즐겨찾기 관리 및 시스템 트레이 상주 단축키를 지원하며 복서 고양이 냥펀치 애니메이션을 제공합니다.
