ReleaseNotes: |-
  Bug Fixes
  - a downgraded guide says guide
  - the home guard reads a repo-relative .nebcore against its folder
  - the train gate passes a gitops repository by name
  - the train gate reads a remote gitops merge by its named repository
  - a private session reads the catalog only by exact filter
  - a private session searches the catalog by exact filter
  - a generic envelope names no agent run
  - an execution's generic envelope names its agent run
  Signed, verifiable artifacts. Verify per the repository README before use.
