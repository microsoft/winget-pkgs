ReleaseNotes: |-
  Features
  - session usage counts requests by trigger and context band

  Bug Fixes
  - tests find their files without the build path
  - lint skips the golangci Actions cache on a persistent lint cache
  - every base image pins its digest
  - place a gh pr merge whose message value is a quoted substitution
  - stop re-reading every checkout on each pre-tool-use hook
  - a seat session shows no dollar cost
  - a closed execution intake is not collected again
  - savings dollars price from the one list price table
  - a compression note names retrieve's arguments
  Signed, verifiable artifacts. Verify per the repository README before use.
