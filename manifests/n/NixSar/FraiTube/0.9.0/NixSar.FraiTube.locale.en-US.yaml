ShortDescription: A desktop YouTube app for Windows and Linux that needs no Google account.
Description: A desktop app for watching YouTube videos on Windows and Linux that needs no account. You create subscriptions, history and watch positions locally, they stay on your own computers and, if you want, sync across all of them.
