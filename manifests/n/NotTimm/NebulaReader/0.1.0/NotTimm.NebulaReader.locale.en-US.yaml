ShortDescription: Comic, manga and ebook reader with a library and Jellyfin support
Description: |-
  Nebula Reader keeps comics (.cbz/.cbr), manga and EPUB books in one library with covers, reading progress and a Continue Reading shelf.
  Books turn pages like an e-reader, one page or two side by side. Comics support single and dual pages, zoom and theater mode.
  It can also read comic and book libraries from a Jellyfin server, syncing progress both ways.
