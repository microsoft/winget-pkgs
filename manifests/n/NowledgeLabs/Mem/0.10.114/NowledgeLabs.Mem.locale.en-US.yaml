ReleaseNotes: |-
  Highlights
  - Home, Memories and Threads have clearer navigation and reading panels. Browse Timeline history, keep Focus drafts across navigation, and open related records without losing your place.
  - Local MCP configuration and Remote MCP OAuth pairing now share the MCP page, with separate tabs and shared Live Traffic. Conversation imports live in Threads.
  - Deleting a conversation and importing it again now reviews and distills it again instead of treating it as already processed.
  Improved
  - Home, Memories and Threads have clearer navigation and reading panels. Browse Timeline history, keep Focus drafts across navigation, and open related records without losing your place.
  - Tree, Graph and Wiki have dedicated navigation and contextual readers. Artifacts offers a searchable list, supported document editing and version history.
  - Local MCP configuration and Remote MCP OAuth pairing now share the MCP page, with separate tabs and shared Live Traffic. Conversation imports live in Threads.
  - Local session imports use less memory for status responses, and model replies with malformed markup require less background parsing work.
  - Connectors brings AI tools into one searchable list, with a detail view and a clear setup action for the tool you choose.
  - Context shows discovered people and agents with avatars, descriptions and aliases, with search, filters and paged loading. AI Now makes the AI Identity picker visible before your first Identity is created.
  Fixed
  - Deleting a conversation and importing it again now reviews and distills it again instead of treating it as already processed.
  - Pending sign-in links no longer loop app navigation. Activity Calendar, Stats and Memories refresh recover from stalled reads, and Connectors navigation remains usable after LobeHub setup.
  - Provider setup explains when an API key is required before fetching models. Magpie on another computer asks for its gateway key before saving.
  - The Chinese all-types filter stays readable in narrow windows, and AI Now model and working-folder controls align with the message box.
  - Reloading the page keeps the Context tab you had open instead of returning to Preview.
  - Initial pending statistics show zero totals and empty activity, then update when observations arrive. Failed refreshes keep previously successful values.
  - Conversation storage repair distinguishes merged conversations from removed empty duplicates, keeps partial and pending results visible, and requests a fresh review when an earlier repair plan is stale.
  - Artifacts enables Markdown editing only when saving is supported. If that support changes during an edit, your draft remains available to copy and Cancel stays usable.
  - Managed-service status recovers after temporary failures and refreshes when you return to the app. Local Vault settings hide unrelated hosted-service status.
  - Chinese Focus briefings on Home use clearer spacing, and affected setup fields wait until Chinese text composition finishes before submitting.
  Platform
  - The embedded database is updated to HawDB 0.27.0. Runtime admission remains off by default for datasets that have never enabled it.
