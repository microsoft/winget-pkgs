ShortDescription: Local-first context manager for AI conversations and knowledge.
Description: Nowledge Mem is a local-first, graph-augmented personal context manager that keeps conversations and insights from AI tools on your own machine. It stores whole threads from clients such as Claude Code, Cursor and Gemini CLI, distils them into searchable memories, and connects them through a knowledge graph. An MCP server on a local port lets AI agents query the same store, and a browser extension imports chats from ChatGPT, Claude, Gemini and Perplexity.
