ReleaseNotes: |-
  Highlights
  - Graph shows an initial overview while the larger map loads. Returning to a recent local Graph view reuses its overview.
  - Automatic distillation can adapt how it requests structured replies on OpenAI-compatible connections. Pick a format in the model's Advanced settings.
  - Preview and confirm sharing a Personal conversation with your Team without leaving Desktop when Team sharing is enabled and you are signed in to the same Team account.
  - Click an image in the AI Now composer or conversation to open a larger preview.
  - Desktop automatically retries dropped remote Mem connections while the window is visible.
  - Processing explains when distillation is queued behind another run for the same conversation. Eligible local jobs can resume after restart with the original message selection.
  Improved
  - General, Connections, AI Models, and Profile use a consistent settings layout with labels and controls on each row.
  - Choose a Memory Space in the sidebar to browse that Space in Knowledge Tree, Graph, and Wiki.
  - Explicit Memory searches can return closely related results when the exact words do not match. Results mark low confidence and link back to the conversations and messages they came from.
  - Move Library files between Spaces in a personal Vault. The destination picker shows the correct Space names and explains when a move needs review.
  - Memories, Threads, and Artifacts show their lists sooner by loading detail views when you open an item.
  - Settings, Timeline, and other parts of the app use clearer guidance across all nine app languages.
  - Graph shows an initial overview while the larger map loads. Returning to a recent local Graph view reuses its overview.
  - Automatic distillation can adapt how it requests structured replies on OpenAI-compatible connections. Pick a format in the model's Advanced settings.
  - Local embeddings reuse consecutive identical inputs, and conversation details do less repeated work when messages already link to memories.
  - Desktop automatically retries dropped remote Mem connections while the window is visible.
  - Discovering long Claude Code conversations, listing Craft conversations, and importing long Codex sessions use less memory.
  - Home shows previously measured activity while new counts load. Library documents reopen with less database work when their source links are already complete.
  Fixed
  - Settings keep the selected Search model when you use a custom OpenAI Base URL.
  - PDF and image readers reuse the open file when you switch views. Failed image previews can retry, and withdrawing a file removes its preview.
  - Artifact PDF previews display selectable pages with page navigation, zoom, and retry. Thread navigation previews include nearby messages.
  - Older records with missing model usage no longer pause background titles, summaries, briefings, or extraction. If a usage estimate reaches your limit, Processing explains why and lets you continue.
  - Opening Mem while another operation creates a neighboring data folder no longer shows a false "folder in use" error. If the folder stays busy, startup explains the problem and offers a retry.
  - Home activity navigation scrolls to the selected event and cancels the pending scroll when you change the selection or leave Home.
  - Automatic distillation reads all newly appended messages in order, including when a conversation update is too large for one processing window.
  - Home shows a loading indicator until counts for the selected Space are ready.
  - Numbered lists keep their page controls available while loading and show the selected page after a filter change.
  - Supported Codex Desktop sessions import images once, and repairs of older imports preserve their message links and attachments.
  - Automatic distillation returns to JSON on the next run if a custom model fails with strict JSON Schema.
  - Desktop uses the limits shown in Memory Processing when an older settings file has no processing section.
  - Wiki retries individual topic summaries that fail. At startup, oversized local Graph files can reclaim disk space after a data integrity check.
  - AI Now helps you choose another model when the provider's balance or usage allowance runs out. Local distillation shows the reset window when available.
  - Mem explains when another backup or restore is already running and keeps the result under its original job ID if saving the status temporarily fails.
  - Eligible local distillation can resume after a short addition to the conversation and a restart. Find mentions with AI stays available when only some mentions have been found.
  - Timeline version history follows the links between versions. Home keeps keyboard focus on the selected day when refreshing unavailable activity counts.
  - Processing explains when distillation is queued behind another run for the same conversation. Eligible local jobs can resume after restart with the original message selection.
  - Create Memory explains the Free plan's stored-memory limit and keeps your draft when you open Plans. The CLI shows active, archived, and stored counts when available.
  - Conversation details indicate when related results could not load and open related memories in their own Space.
  - Remote MCP keeps new pending connector registrations for seven days and shows how to reconnect when a request is invalid.
  Platform
  - With the local HawDB Graph selected, Memory details and exports, Community details, and Wiki topics follow that Graph.
  - The app includes HawDB 0.37. A recovery copy made with 0.36 is required to return to that storage version after conversion.
  - Where the server provides read receipts, Bridge Outbox and Inspect show the message sent by an original operation and how many recipients opened it.
  - Bulk conversation imports in CLI JSON mode return a failure exit code when parsing, startup, or the import job fails, and retain the full error in the result.
  Full Changelog
