ReleaseNotes: |-
  Highlights
  - Memory review and cleanup keep your explicit correction of an assistant's statement current, even if the assistant later repeats the rejected statement.
  - Use nmem m evolves repair-direction to preview, apply or undo corrections to older version links saved in the wrong direction. Each repair appears on the Timeline.
  - The Graph Ontology panel shows the next action for your current setup and whether your types are being used on new content. Settings shows the same status, including when the background model cannot apply them.
  - Bridge setup can find Agent Contexts retained by connections connect, while preserving the existing Agent identity and registration recovery.
  Improved
  - Choose reasoning effort, including None, under Advanced for built-in OpenAI and Magpie connections when the model list does not declare the setting.
  - Session sync gives projects more scrolling space, clearer filtering and keyboard actions, and direct access to available source error details.
  - Label consolidation can skip a stale merge pair without failing the entire batch, with clearer results for completed and skipped changes.
  - App-hosted MCP browsing reads Sources and Libraries in bounded batches instead of loading the entire library at once.
  - When experimental HawDB is the Search authority, fast Memory search includes exact vector candidates and correctly handles default Spaces and content-type filters.
  - Automatic relationship review considers highly ranked vector matches across languages while keeping a bounded candidate budget.
  - The Graph Ontology panel shows the next action for your current setup and whether your types are being used on new content. Settings shows the same status, including when the background model cannot apply them.
  - Clear Graph search with the field's clear button, Escape in the field, or by deleting the query to return to the overview.
  - Label cleanup cards remain visible across Space filters and include a shortcut to manage labels.
  Fixed
  - Bridge setup can find Agent Contexts retained by connections connect, while preserving the existing Agent identity and registration recovery.
  - Codex conversations with images keep a stable parsed history as new turns arrive, preventing a repeated caption from splitting an earlier image and blocking later sync.
  - Queued Memory edits respect revoked access, and overlapping background classification preserves confirmed status and metadata changes.
  - Conversation saves and Space moves preserve confirmed work when a later step fails, recover interrupted moves without overwriting newer changes, and keep partial-import message counts accurate.
  - Direct conversation saves in a personal workspace use the AI Identity default Space when no Space is explicitly selected.
  - Automatic relationship review no longer mistakes an edited Memory original creation time for the date of its current statement.
  - Skill bundle imports reject filenames that become identical after Unicode normalization, avoiding conflicting files on supported filesystems.
  - Background tasks through Magpie can retry an answerless thinking reply that exhausts its output allowance. Structured tasks through Magpie and OpenRouter also receive JSON mode when supported.
  - DeepSeek V4 and MiMo connections consistently receive the selected thinking-off setting across supported request formats.
  - Failed background-run reports include the recorded diagnostic codes to help support investigate the original run.
  - Team Lite preserves existing members, invitations and keys when damaged settings prevent changing its enabled state.
  - App distillation can ask the model to correct the specific missing or misplaced field in a structured reply, improving recovery from invalid reply shapes.
  - Memory review and cleanup keep your explicit correction of an assistant's statement current, even if the assistant later repeats the rejected statement.
  - Bulk import progress stays attached to the current attempt, and partially completed imports keep their errors visible.
  - Bridge sessions now work through authenticated local servers and Access Anywhere connections.
  - Fixed full search-index rebuilds stopping on large Libraries when Source Chunk reads exceeded their budget.
  - MCP Memory-neighbor and Skill reads report resource or time-limit errors clearly instead of generic failures or invalid-input errors.
  - MCP conversation sync rechecks the destination Space after waiting to save, preventing a conversation from being saved into a Space deleted during that wait.
  - The Bub connector introduction correctly identifies Bub as a Python agent harness.
  - Desktop update checks include HTTP/3 connection and QUIC compatibility fixes.
  Platform
  - Experimental HawDB storage uses engine 0.31.0. Rejected writes, such as duplicate keys, return an operation error without taking the HawDB runtime out of service.
  - Experimental HawDB preparation handles libraries without older session schemas, preserves Legacy column defaults, and checkpoints long imports while reclaiming completed preparation captures.
  - Experimental HawDB gives distinct guidance for constraint violations, schema mismatches and operations whose publication result is uncertain.
  Full Changelog
