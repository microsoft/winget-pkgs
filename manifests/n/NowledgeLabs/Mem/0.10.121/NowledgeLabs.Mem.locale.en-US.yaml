ReleaseNotes: |-
  Highlights
  - Organize Artifacts into folders, move documents by dragging or using Move to folder, and upload straight into a folder. Deleting a folder keeps its documents by default. Folder controls appear when the connected Mem server supports them.
  - Connected agents can find documents with artifact_search. Artifact tools and the nmem artifacts command use the same name as the app; existing library and sources commands and legacy tool calls keep working. Previously approved tools may ask for approval once under their new names.
  - Eligible failed automatic distillations can resume once with an adjusted request. Recovery better recognizes Ollama and Gemini settings, and slow post-call checks no longer discard paid distillation work merely for exceeding a foreground latency budget.
  Improved
  - Home notifications show their creation date and time in your app language and local timezone. The combined Space view is now simply named All.
  - When experimental HawDB is the Graph authority, Space observations and Thread and Source counts use that selected storage.
  - Label consolidation uses stricter duplicate guidance to distinguish broader and narrower terms, negation and status, results and activities, and roles and domains.
  - Experimental HawDB is updated to 0.34.0. Libraries written by a newer app version receive a specific message, and search-index errors no longer take the whole HawDB runtime out of service.
  - Experimental HawDB preparation avoids repeated full search-index rewrites for bookkeeping changes. Its final receipt check no longer reserves memory for the entire search index.
  - Distilling long conversations avoids repeatedly preparing earlier message packets that have already been accepted.
  - When a later conversation changes only part of a multi-fact Memory, its unchanged details remain searchable and linked to the update. Full replacements still replace the earlier Memory.
  - App imports can distill several conversations concurrently with a cloud model. Local and self-hosted models process one at a time; Task Center shows each running task with its own Stop button.
  - Chinese, Japanese and Korean text uses regional system fonts, while Latin text keeps the interface font. Chinese and Japanese emphasis uses weight, and punctuation follows regional forms; middle dots in names remain half width.
  - The Memories toolbar fits on one row, and list footers show totals. Memories supports 20, 50 or 100 items per page. Desktop Search and Settings show their keyboard shortcuts.
  - Auto-Sync avoids repeatedly parsing earlier turns in growing Codex conversations. Session imports also avoid duplicate image inputs when matching raw and Event records use different message IDs.
  - Conversation rows gather sharing, pinning and deletion in one menu and show a single browse total. Search keeps its Space selector, query and Clear button together, and Home marks the end of a fully loaded timeline.
  - With experimental HawDB selected, Label and AI identity usage reads follow that storage. Thread message mirroring also preserves recovery order, including empty conversations and writes retained after a mirror failure.
  Platform
  - Desktop update checks and CLI Cloud Bridge connections work on TCP-only networks and reuse connections. Interrupted Bridge writes retain their original operation for recovery.
  Fixed
  - Native Bridge can wait briefly for a busy session to become available, without resending your original operation.
  - Local search failures retain their specific reason and show clearer recovery guidance, including when a search-index rebuild needs support rather than an automatic retry.
  - Conversation distillation and source-derived Memory writes no longer stall while saving results. Saved progress remains available for retry when a conversation grows, and uncertain duplicate-review outcomes retain guidance against paying again.
  - Experimental HawDB clearly identifies read-only storage and transactions that exceed size or operation limits, with guidance to contact support before retrying.
  - Missing or inaccessible Memory, Artifact, Crystal and Entity details show a persistent in-app message with a working return action. Connection failures remain distinct.
  - Pressing Escape in a reopened confirmation keeps Team settings open and returns focus to the control that opened the confirmation.
  - Memory updates return the saved content, full ID and a revision for optional conflict protection. Outdated conditional edits are rejected without overwriting newer changes.
  - Memory and conversation references open their target or show a persistent unavailable message with a way back. Historical Thread dates and recent relative times stay visible while reading.
  - App controls and surrounding UI no longer select text during a drag. Memory and document content, fields and marked copyable values remain selectable. The macOS sidebar toggle stays aligned with the window controls.
  - OAuth connections handle client-registration expiry and token revocation more reliably. Disconnecting a local MCP plugin prevents delayed authorization or refresh responses from reconnecting it.
  - Memory lifecycle filters keep counts and pagination aligned, and imported Memories preserve supplied importance and confidence metadata when top-level scores are omitted.
  - Eligible failed automatic distillations can resume once with an adjusted request. Recovery better recognizes Ollama and Gemini settings, and slow post-call checks no longer discard paid distillation work merely for exceeding a foreground latency budget.
  - Memory review rechecks possible state changes before reporting a conflict. New conversation Memories use the times of their cited messages, and distillation can correct an invalid duplicate target once within its task budget.
  - Search diagnostics distinguish configured embedding settings from the embedder running in the backend, including changes that require a backend restart. Checking status does not load a model or contact its provider.
  - Plugin installs and updates use registered marketplace commands and validate the full update command. Native Skill reads stay within their result and time limits, with clearer failure reasons.
  - Distillation can recover from a reasoning-only reply when the adjusted request fits the available time. Later runs on a route that exhausted its first reasoning budget can start with more room.
  - Distillation accepts an OpenAI-compatible endpoint already saved without an API key, matching chat behavior. If a saved key cannot be decrypted on this device, the app asks you to enter it again.
  - Codex auto-sync stops repeatedly importing an unchanged conversation snapshot after a source-history conflict. The conflict stays visible, and syncing retries when the file changes or during its daily recheck.
  - Editing Memory metadata preserves the original source timestamps used to order related memories. Full Data Transfer restores retain archived timestamps.
  Full Changelog
