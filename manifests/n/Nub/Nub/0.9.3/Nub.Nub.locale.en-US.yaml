  Testing & internals
  - The docs link checker validates same-page #anchor links (41d27d8c24).
  - Fenced code lines on the site are linted against the rendered column width rather than a character count (aa08e86ca8).
  - The busybox lifecycle probe runs on windows-11-arm as well, so the arm64 sidecar is executed in CI (fcdb08cbc3).

  What's Changed
  - config: refuse a backslash in the prefix string form by @colinhacks in #941
  - nubr: a third name on the nub binary, the unified runner on every channel by @colinhacks in #943
  - winget: the package is Nub.Nub, community-maintained; the fixture proves a third alias for nubr by @colinhacks in #944
