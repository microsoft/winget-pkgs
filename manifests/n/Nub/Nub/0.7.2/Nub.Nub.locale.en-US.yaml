ReleaseNotes: |-
  Supply-chain and workspace resolution fixes, plus per-invocation platform selection for cross-platform installs.
  Release-age gate
  Running a tool without naming a version resolves the latest tag, which narrowed to that one version — so a minimumReleaseAge window covering it left nothing to fall back to and nubx <tool> failed outright. A blocked latest now resolves to the newest release that clears the window (#682, #681).
  $ nubx some-tool
  + some-tool@2.3.0  latest 2.4.0
  warn: the latest some-tool release (2.4.0) is younger than minimumReleaseAge; using 2.3.0 instead
  help: to take the newest release anyway: `--minimum-release-age=0`, or `--minimum-release-age-exclude=some-tool`
  The fallback stops at whatever the publisher currently tags latest, so a higher version they published and then untagged is never selected, and a latest pointing at a prerelease is refused rather than falling back onto a stable release from an older line. The same narrowing also affected the non-strict mode in the opposite direction — the blocked release was the only candidate, so it was re-selected and the window had no effect. It is now enforced there too.

