ReleaseNotes: |-
  Nub 0.9.6 brings the iterator chunking, includes and join helpers in line with their Stage 4 specifications, and the stable release run now waits for the maintainer's approval of the staged npm versions.
  Runtime
  The Iterator.prototype helpers chunks, windows, includes and join follow the Stage 4 text of the iterator chunking, iterator includes and iterator join proposals (#988).
  ────────────────────────────────┬────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Change                          │Detail
  ────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  windows(size, undersized)       │A second argument, "only-full" (the default) or "allow-partial", decides whether an iterator shorter than size yields one short window.
  ────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  includes(value, skippedElements)│A second argument skips that many values before the search starts.
  ────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Argument validation             │A size or skip count is no longer coerced: a non-integral number throws a TypeError. The arguments are checked before the first next call, and a failed check closes the
                                  │receiver.
  ────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  join                            │Values are converted with ToString, as Array.prototype.join does.
  ────────────────────────────────┼────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  Promise.try                     │The polyfill constructs its result from this, so a subclass receives an instance of itself.
  ────────────────────────────────┴────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  On Node 26.7 with the native methods removed, the test262 built-ins/Iterator and Promise/try suites pass 1180 of 1338 tests, up from 922. The four methods pass all 140 of their tests on Node 18.19 through 26.7. @nubjs/types declares the two new optional parameters.

  Documentation
  - The install pages note that mise puts nubr on PATH alongside nub and nubx (1faa08a).
  - The resolution page describes the nub export condition as a condition the CLI sets, without a registration claim (ea2eb52).

  Release pipeline and packaging
  - A stable release run is held on the release-approval environment after the npm packages are staged, and resumes when the maintainer approves the staged versions (#981). The staging script resolves a package's directory before it reads the package's package.json (5727154).
  - The winget manifest fixture tracks 0.9.5 and points nubr at its own bin
  ubr.exe (#989).

  What's Changed
  - winget: the fixture tracks 0.9.5 and points nubr at its own bin
  ubr.exe by @colinhacks in #989
  - release: hold the run on the release-approval environment until the staged versions are approved by @colinhacks in #981
  - runtime: iterator chunking/includes/join polyfills follow the Stage 4 spec by @colinhacks in #988
