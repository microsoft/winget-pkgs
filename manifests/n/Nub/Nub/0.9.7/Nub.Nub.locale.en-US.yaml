  Package manager
  URL tarball, git and file: dependencies keep their whole manifest during resolution (#963).
  - optionalDependencies are filtered by platform, required peers are installed, bundled dependencies are not re-resolved, and os, cpu and libc apply, as they do for registry packages.
  - nub.lock and the other portable lockfiles record every platform's optional URL tarball with its integrity, as npm and pnpm do. Only the host's variant is installed. An optional URL tarball that fails to download is skipped with a warning.
  - A direct URL package keeps its platform and peer metadata after the lockfile is written and read back.
  - Two nub.lock round-trip failures are fixed: a long URL-keyed entry was written on one line and failed the next install with expected struct RawSnapshot, and a scoped URL dependency was read as an npm alias (npm-alias references missing package).

  Testing and internals
  - A project preload is tested beneath a compat launch and under nub watch (#1009).
  - The winget manifest fixture tracks 0.9.6 (#996), and the winget-releaser pin names the commit its v2 tag now points at (0260adb).
  - A benchmark measures request and event-loop latency of the threadpool on a saturated machine (e440c2f).

  What's Changed
  - aube: resolve URL-tarball optionals, peers and platforms; fix two nub.lock round-trips by @colinhacks in #963
  - runtime: build libuv's threadpool on a private loop, and walk the pending V8 flags by index by @colinhacks in #993
  - winget: the fixture tracks 0.9.6 and keeps nubr on its own bin
  ubr.exe by @colinhacks in #996
  - runtime: a compat launch no longer opts out a nested nub invocation by @colinhacks in #1006
  - runtime: resolve the temp dir before starting the shim reaper thread by @colinhacks in #1007
  - tests: a project preload runs beneath a compat launch and under nub watch by @colinhacks in #1009
