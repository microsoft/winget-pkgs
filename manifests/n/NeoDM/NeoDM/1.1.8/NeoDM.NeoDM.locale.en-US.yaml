ShortDescription: Ultra-fast download accelerator with zero disk concatenation freeze and native browser integration.
Description: |-
  NeoDM (Neo Download Manager PRO) is an ultra-fast, modern download accelerator built in pure Go with Microsoft Edge WebView2 and Win32 direct offset sparse file technology.
  Key Features:
  - Up to 32 concurrent TCP connections per download with zero-concatenation direct sparse file I/O (no waiting at 100% download).
  - Silent video stream grabber and audio/video muxer for web media.
  - Native browser companion with 1-click registration for Chrome, Edge, Brave, and Firefox.
  - Interactive Bento 2.0 interface with dark, OLED, and light modes.
  - Embedded CLI engine for terminal-based and headless automation.
