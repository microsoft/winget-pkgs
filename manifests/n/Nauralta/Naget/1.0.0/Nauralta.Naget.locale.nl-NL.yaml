ShortDescription: Command-line client voor een eigen Naget-server die bijhoudt welke software je met winget installeert, ingedeeld in groepen.
Description: |-
  Naget is een wrapper om winget: elk pakket dat je installeert of verwijdert wordt op een Naget-server geregistreerd
  in groepen die je zelf kiest, zodat je na een herinstallatie van Windows alles met één commando terugzet.
  Vereist toegang tot een zelf gehoste Naget API-server; zonder server is de client niet te gebruiken.
