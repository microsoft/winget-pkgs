ShortDescription: Command-line client for a self-hosted Naget server that keeps track of the software you install with winget, in groups.
Description: |-
  Naget wraps winget: every package you install or remove is registered in groups you choose on a Naget server,
  so that after reinstalling Windows a single command installs everything again.
  Requires access to a self-hosted Naget API server; without one the client cannot be used.
