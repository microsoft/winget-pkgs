ReleaseNotes: |-
  Fixed
  - With test groups and threads-required, a test waiting for a slot in its group is now started as soon as enough threads are free. Previously, if the threads were freed by a test outside that group, the waiting test could be delayed. If no other test in its group was still running, the run could end with the test not being run. (#3697)
  - Fixed a panic when reusing builds (--archive-file or --binaries-metadata) for a custom target provided by rustc --print=cfg. (#3698)
