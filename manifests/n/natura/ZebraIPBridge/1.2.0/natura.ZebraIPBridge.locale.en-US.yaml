PackageName: Zebra IP Bridge
PackageUrl: https://github.com/ATNatura420/zebra-ip-bridge
License: Proprietary
ShortDescription: Shares a USB-connected Zebra label printer on the network (raw ZPL on TCP 9100) and shows the IP address to print to.
Description: |-
  Zebra IP Bridge runs in the background and makes a Zebra ZPL label printer that is plugged in over USB
  reachable as a network printer on the PC's IPv4 address (raw printing on TCP port 9100), so print servers
  and ERP systems such as Odoo can print to it. When a Zebra printer is connected, a notification shows the
  IP address to use. Settings: REMOTEADDRESS (who may print) and PREFERNET (which IP to show), passed with
  --custom, e.g. winget install natura.ZebraIPBridge --custom "REMOTEADDRESS=10.0.0.5".
