ReleaseNotes: "## Mermaid 0.26.0\n\n\n### Added\n\n• **One integration test binary.** The 23 integration test crates under\n  `tests/` are one `tests/integration.rs` with a module per former crate\n  under `tests/it/`, so a test run links once instead of 23 times. Alongside:\n  `rust-lld` for Windows MSVC via `.cargo/config.toml`, line-tables-only\n  debug info in the dev and test profiles, `opt-level = 2` for dev\n  dependencies, and a `just test` recipe for nextest.\n• **Windows OS sandbox.** `--no-network`, `--confine-fs` and `--sandbox`\n  confine model-run shell commands on Windows through an AppContainer and a\n  Job Object：the network kill-switch omits the container's network\n  capabilities (loopback to `127.0.0.1` is exempted for local tooling), write\n  confinement grants the container SID access to the project, working and\n  temp directories and nothing else, and the job kills the process tree when\n  the handle closes. Documented in `docs/sandbox.md`.\n• **`edit_file`：single-location search-and-replace.** `path`,\n  `target_content`, `replacement_content`, and `allow_multiple` for when the\n  target legitimately repeats. Matching degrades in steps -- exact, trailing\n  whitespace, full trim, Unicode normalisation -- and refuses an ambiguous\n  match. Same containment, checkpoint and approval-replay path as\n  `apply_patch`, which stays for multi-hunk and new-file work.\n• **Allowlisting for the web tools.** The `web_fetch` approval offers \"don't\n  ask again\" for the host (`web_fetch:docs.x.ai`, `web_fetch:localhost:8080`)\n  for the rest of the session; `web_search` can be allowlisted the same way.\n  `[web] allowed_domains = [\"docs.x.ai\", \"localhost:8080\"]` in `config.toml`\n  makes the trust persistent.\n• **Inline Markdown in the task checklist.** Task subjects in the checklist\n  band, the collapsed \"Next:\" line and the spinner headline render `**bold**`,\n  `` `code` ``, `*italics*`, `~~strikethrough~~` and `[links](url)`. Long\n  subjects wrap with a hanging indent under the text column, and the window\n  around the in-progress task is budgeted in visual lines rather than\n  subjects. Completed tasks keep their weights under the dim and\n  strikethrough.\n• **Grok (xAI) is a built-in provider.** `mermaid --model grok/<model>`\n  (alias `xai/<model>`) reaches xAI's OpenAI-compatible endpoint at\n  `https://api.x.ai/v1` with `XAI_API_KEY`. Vision and tool calling work as\n  with any Chat Completions provider.\n### Fixed\n\n• **The daemon's warnings went nowhere.** `mermaidd` called `tracing::warn!`\n  for a rejected client, a failed accept, a reconcile that did not finish,\n  and never installed a subscriber, so none of it was written anywhere. It\n  now uses the CLI's log (`~/.mermaid/mermaid.log`, redacted, owner-only;\n  `RUST_LOG` sets the level) and logs its version on start. An ignored\n  daemon integration test starts a real `mermaidd` and reads that line back.\n• **Process hardening applies on macOS and Windows, and says what it did.**\n  `harden_process` was a silent no-op off Linux. macOS now sets the core-dump\n  limit to zero and calls `ptrace(PT_DENY_ATTACH)`; Windows suppresses the\n  crash dialog whose debug path hands the process to a registered handler\n  (there is no per-process switch for WER dump collection, and the module\n  doc says so). The function returns what took effect, and `mermaid` logs a\n  warning at startup when nothing did instead of assuming the protection is\n  there. `mermaidd` applies it too; it had applied none.\n• **The Windows sandbox honours the half of the policy it was not asked to\n  enforce.** An AppContainer denies both axes by default, so `--confine-fs`\n  alone had also cut the network (no capability SIDs were attached) and\n  `--no-network` alone had blocked nearly every write (no path was granted).\n  Now `deny_network = false` attaches the three network capabilities, and an\n  empty write list grants the working directory and the temp directory. An\n  AppContainer cannot be told \"writes unconfined\", so that floor is\n  documented in `docs/sandbox.md`. Three Windows tests cover the capability\n  list, the implicit temp grant, and that write confinement alone leaves the\n  network reachable.\n• **Concurrent sandboxed commands on Windows no longer strip each other's\n  write grant.** The guard that undid a command's directory grant restored\n  the DACL it had captured before the grant, which also removed any grant a\n  command started since (a background command plus a foreground one on the\n  same project root). It now revokes its own container SID and nothing\n  else; a test grants a directory to two containers, drops one, and checks\n  the other's grant is still there.\n• **Secret files are owner-only on Windows too.** `write_atomic_with_mode`\n  dropped its `0600` on non-Unix and relied on the directory's inherited ACL.\n  On Windows it now creates the temp file through `CreateFileW` with the\n  same protected owner-plus-`SYSTEM` descriptor the daemon puts on its pipe,\n  so the config never carries a Users or Everyone grant, and a test reads the\n  resulting DACL back as SDDL to prove it.\n• **`mode=\"background\"` commands escaped the OS sandbox.** The\n  `__sandbox-exec` wrapping that enforces `--no-network` and `--confine-fs`\n  was computed on the foreground path only, after the background branch had\n  already returned, so a backgrounded command ran as a bare `sh -c` with\n  full network and filesystem access under either flag. The sandbox\n  decision is made once, before the split, and the background launcher\n  spawns the same invocation the foreground path does (passed as positional\n  parameters and run through `\"$@\"`, never re-parsed). An ignored\n  integration test drives the real tool with `safety.network = deny` and a\n  backgrounded socket probe; with the wrapping removed it reports\n  `NET_ALLOWED`. A `current_exe` failure no longer falls back to whatever\n  `mermaid` is on `PATH` as the launcher; the spawn fails closed instead.\n• **\"Don't ask again\" for a shell command did not remember where it ran.**\n  The allowlist key for `execute_command` was the command string alone, so\n  approving `make` once in the project let the model run the identical\n  string later with `working_dir` pointing anywhere else, where a different\n  Makefile answers, without a prompt. A command outside the project now keys\n  on its working directory as well, the way the file tools key on theirs.\n• **`git log --output=FILE` and `tree -o FILE` rated read-only.** Both write\n  an arbitrary file (git's diff machinery accepts `--output` on `log`, `diff`\n  and `show`; `tree -o` sends its listing to a file), and both ran without a\n  prompt in `read_only`, `plan` and `auto`. The classifier trusted the\n  read-only allowlist and inspected flags one tool at a time (`sort -o`,\n  `yq -i`, `date -s`). One table now names every output, in-place and exec\n  flag of every allowlisted reader, checked before any of them rates\n  read-only, and a new reader cannot be added without auditing it for one;\n  it also covers `fd -x`, `rg --pre`, `ack --pager`, `less -o`, plus the\n  positional `uniq IN OUT` and `hostname NAME`. Attached flag values\n  (`-o/etc/cron.d/x`) match too. Thirty-five commands pin it both ways.\n• **A long reasoning trace silently emptied the answer that followed it.**\n  Every adapter shared one truncation flag between its reasoning and its\n  content accumulators, so a trace past the 400K-char response cap stopped the\n  content buffer accepting text; with reasoning at `max` the user saw a\n  truncation marker and no answer. Each buffer now caps itself.\n• **The Meta adapter had no response cap.** Content and reasoning grew without\n  bound; every other adapter capped at 400K chars. All five share one capped\n  buffer type now.\n• **Anthropic reported zero usage when no usage frame arrived.** A proxy that\n  drops `message_delta` handed the reducer a provider-sourced `0 / 0`, which\n  is folded as authoritative and reset the context gauge; Gemini and Ollama\n  had guarded this since #125. The rule is now checked for every provider by\n  the conformance suite.\n• **Provider error bodies reached the transcript unredacted and uncapped.**\n  A 4xx from an OpenAI-compatible gateway routinely echoes the request,\n  `Authorization：Bearer …` included, and four of the five adapters copied\n  the body straight into the error the transcript renders and persists (Meta\n  redacted, with a comment explaining a risk that applied to all). Error\n  bodies are now read through one helper：at most 64 KiB, then redacted.\n• **Unbounded per-stream maps.** Anthropic keyed its content-block map on the\n  stream's own block index and Meta appended a tool call per fresh `call_id`,\n  so a well-framed hostile stream could grow either without limit, one small\n  frame at a time. Both are bounded by the tool-call cap (256).\n• **A streamed tool call whose arguments failed to parse dropped the reason.**\n  The fallback still passes the raw text through, but the parse error (most\n  often \"the argument cap fired\") is logged instead of discarded.\n• **A cancel the effect runner never finished stranded the session.** `Cancelling`\n  waited forever for the runner's acknowledgement; a wedged child process or a\n  panicked task meant the composer never reopened and only killing the process\n  helped. The reducer now abandons the turn itself after 15 seconds, with a\n  notice, off the injected clock so `--replay` reproduces it.\n• **Quitting during a subagent's worktree cleanup could leave the checkout on\n  disk.** The discard ran on a detached task nothing waited for; it joins the\n  runner's shutdown drain now.\n• **Failed task-row writes in `mermaid run` were silent.** A task stuck on\n  `queued` because the status write failed left nothing in the log; the\n  failures are logged.\n• **The Ollama capability probe's failures were indistinguishable from \"yes\".**\n  A slow or rejected `/api/show` fell back to \"supports thinking\" with no log\n  line, which is the shape of the `think`-on-a-model-without-it 400. Each\n  failure mode is"
