ReleaseNotes: "## Mermaid 0.29.0\n\n\n### Added\n\n• **Local web search now works on Windows.** `web_search` defaulted to a\n  bundled local SearXNG that had no Windows build, so on Windows the tool\n  simply was not there unless you pointed Mermaid at Ollama Cloud or your own\n  instance. mermaid-searxng v0.4.0 publishes a `windows-x86_64` bundle, and\n  Mermaid now downloads, verifies and runs it like on Linux and macOS：no\n  Docker, no WSL, nothing leaving the machine. SearXNG's one Unix-only import\n  (`pwd`, used only to log a Valkey connection failure, and Valkey is off)\n  is made optional in that build.\n• **Claude now gets the tools it was trained on.** On Anthropic, Mermaid sends\n  Anthropic's own text editor (`text_editor_20250728`) and bash\n  (`bash_20250124`) tool definitions instead of its hand-written schemas for\n  the same work. The text editor stands in for `read_file`, `write_file` and\n  `edit_file`; `bash` sits beside `execute_command`, which keeps its timeout\n  and background mode. Every native call is rewritten onto the Mermaid tool it\n  stands for before it runs, so the policy gate, the read-only sandbox,\n  checkpoints and approvals apply exactly as before, and history replays the\n  call in the form the model wrote. `bash` is not offered on Windows, where\n  commands run under PowerShell. A model that rejects these tools is\n  remembered and gets Mermaid's schemas; `[tools] provider_native = false`\n  turns the whole thing off. Along the way `read_file` lists a directory\n  instead of failing on it.\n• **The evals can compare the guidance pack on and off, and keep a history.**\n  `just eval-guidance <model>` runs every task with the coaching pack pinned\n  on and then off (3 runs each by default) and reports the difference per\n  task, with a verdict on whether the pack helps that model and whether the\n  `auto` default, which decides by local versus hosted provider rather than by\n  capability, picked right for it. Every live run now appends its scores to\n  `evals/results/history.jsonl` with the date, version and commit, and the\n  report compares each model with its earlier runs and with every model\n  recorded, on the same tasks. `MERMAID_EVAL_JOBS` runs tasks in parallel.\n• **Three longer eval tasks, scored on inputs the model never sees.**\n  `ledger-refunds` carries a feature through parsing, totals and the report;\n  `ledger-exact-money` moves money from `f64` to integer cents across a crate;\n  `stock-wrong-totals` is a bug reported only by its symptom, whose cause sits\n  in a different module. Each is scored by running the program on a hidden\n  input copied in after the run (the new `overlay` on a `command` check), so\n  a fix tuned to the visible samples does not pass.\n\n### Changed\n\n• **Hosted models no longer get coaching through tool descriptions and\n  checklist reminders.** The guidance pack was already off for hosted APIs,\n  but the same advice still reached every model another way：the `memory`,\n  `task_create`, `task_update`, `task_list` and `ask_user_question` tool\n  descriptions told the model how to use them well, and the checklist sent a\n  reminder every 5 model calls without an update and a note whenever more\n  than one task was in progress. Tool descriptions now say only what the tool\n  does, the advice lives in the guidance pack, and both checklist reminders\n  follow `[output] guidance`.\n\n• **Compaction summaries now read more of the conversation on large-context\n  models.** The summarizer's input was capped at 64k tokens whatever the model's\n  window, so a 1M-context model compacting ~850k tokens of history wrote its\n  handoff from a 64k excerpt trimmed from the middle. The budget now scales with\n  the window Mermaid resolves for the model：75% of it (750k on a 1M model, 150k\n  on 200k), never less than the old 64k and never more than the window minus the\n  summary's output, so small local models behave exactly as before. An unknown\n  window keeps 64k. The share is configurable as\n  `[compaction] summarizer_input_window_percent`.\n\n• **The `auto`-mode safety classifier now sees the conversation, not just\n  your last message.** It used to judge each borderline action against the\n  latest user message alone, so after \"yes, go ahead\" it had no idea what was\n  being approved, and after a compaction it judged against the checkpoint's\n  header. It now gets your messages since the last compaction (the first and\n  the latest always, the most recent others up to a budget), the compaction\n  summary, and the agent's reply your latest message answers. Agent-written\n  text is fenced and labeled as such, and the classifier is told it cannot\n  widen what you asked for. Everything is redacted on the way out, as the\n  action already was.\n• **The classifier thinks.** It ran with reasoning off and a fixed 10-second\n  timeout, which cut thinking models off mid-thought. It now reasons at the\n  session's level, clamped to low..high, with a timeout of 30s, 60s or 120s to\n  match and an output budget with room for the thinking. A timeout or error\n  still escalates to you; it never allows.\n• **Evals can hold a conversation.** A task can set `followups` (later user\n  messages, each sent with `--continue`) and `safety = \"auto\"`. Two new tasks\n  use them：`commit-after-go-ahead` asks for a fix and a commit, shows a plan,\n  and gets \"Yes, go ahead.\"; `no-commit-after-go-ahead` is its mirror, where\n  the user said not to commit.\n\n### Fixed\n\n• The stale-task reminder no longer sends the model two runs of about 22\n  spaces in the middle of its sentence.\n• **`stock-wrong-totals` no longer fails a model for adding tests.** Its\n  check that `tests/` was untouched failed every run on DeepSeek V4.1 Flash,\n  though each one fixed the bug and only added regression tests. The task now\n  puts the original tests back and runs them (a new `restore` field on a\n  `command` check), so a weakened or deleted test still fails it.\n• Eval history no longer marks every run after a session's first as `dirty`:\n  that first run's own append to `evals/results/history.jsonl` counted as an\n  uncommitted change.\n• The offline evals no longer fail most runs on Windows with \"error decoding\n  response body\". The mock provider read each request through a cloned\n  socket, and on Windows a clone is inheritable, so every binary the suite\n  spawned in parallel could hold another task's connection open after the\n  mock closed it. It now reads through a borrow, and nothing leaks.\n• The startup notice for a platform with no local search bundle no longer\n  cuts its own advice off mid-word. Each degraded capability's reason was\n  capped at 240 bytes and Mermaid's no-bundle message runs to about 300, so\n  the truncation marker landed inside the first remedy\n  (`allow_ollama_searc ...[content truncated]... arch_backend`). The cap is\n  now 512, which fits Mermaid's own remedies and still bounds error text from\n  elsewhere."
