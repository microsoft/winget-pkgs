ReleaseNotes: |-
  - Share link: turn any load-out into a link like beammodmanager.com/l/… that shows its name and mods on a page anyone with the link can open, and unfurls as a preview card in Discord and on social media. You choose whether to include the cover. You can update the link later or stop sharing at any time.
  - Open shared load-outs in one click: “Open in Beam Mod Manager” on a load-out page asks BMM to import it, and you always confirm first. You can also paste a link into Load-outs → Import from link. Mods you don’t have yet appear greyed out, with a link to their official page when one is known.
  - What a link uploads: the load-out’s name, the titles, file names, sizes and content hashes of its mods, their repository ids, any creator support links those mods carry, and the cover if you choose — plus an anonymous random id for this copy of BMM, used only to limit how many links one install can create. Never your files, folder paths or account. Shared pages are not listed or searchable.
  - Stopping sharing deletes the link. If BMM can’t reach the server when you delete a shared load-out, the load-out is kept so the link isn’t left behind.
