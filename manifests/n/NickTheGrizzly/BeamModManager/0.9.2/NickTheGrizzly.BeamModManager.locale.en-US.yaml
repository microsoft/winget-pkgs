ShortDescription: Free mod manager for BeamNG.drive and BeamMP with instant hardlink switching.
Description: Beam Mod Manager (BMM) keeps all your BeamNG.drive and BeamMP mods in one clean, searchable library. Mods switch on and off instantly using hardlinks, with no second copy on disk. Save load-outs, clean up duplicates and old versions automatically, prep BeamMP servers in one click, and track your driving stats. Optional Patreon tiers add one-click mod updates, a live dashboard and more. Mod files never leave your PC.
