ReleaseNotes: |-
  - Mod Health (Player and Supporter) now spots mods that are packed in a way BeamNG can’t load: everything wrapped in an extra folder inside the zip, or a zip that only holds other zips. They show up in a new “Won’t load: packaged wrong” section and count toward the sidebar badge.
  - Open one of those mods and its details explain what’s wrong and how to fix it, including the name of the extra folder.
  - After updating, BMM asks for a one-time rescan so it can check every mod’s packaging.
