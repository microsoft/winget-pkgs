ShortDescription: A command line utility to interact with and manage NATS.
ReleaseNotes: |-
  ## Security

  Built using Go 1.27.3, which contains mitigations for CVE-2026-111943 by distrusting eMudhra intermediate certificates

  ## Bug Fixes

  • Handle --match-replies requests and replies in arrival order
  • Skip closed handler on client-initiated close so `nats rtt` survives multiple targets
  • Support `--js-domain` in `nats server cluster peer-remove`
  • Add `nats auth jwt` command to decode the user JWT in a creds file by @SagarSingh2003
  • Add --cpu-profile-duration to audit gather

  ## Enhancements

  • Add --backup to `nats sub` to create a backup from Streams or NATS Core
  • Fix nil pointer panic in backup restore when --trace is set
  • Explain domain mismatches in server cluster rescue

  ## New Contributors

  • @SagarSingh2003 made their first contribution in https://github.com/nats-io/natscli/pull/1750

  **Full Changelog**：https://github.com/nats-io/natscli/compare/v0.5.0...v0.5.1
