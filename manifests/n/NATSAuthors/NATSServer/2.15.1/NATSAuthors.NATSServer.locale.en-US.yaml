ReleaseNotes: "## Changelog\n\nRefer to the [2.15 Upgrade Guide](https://docs.nats.io/release-notes/upgrade-to-2.15) for backwards compatibility notes with 2.14.x.\n\n### Go Version\n\n• 1.27.2 (#8740)\n\n### Dependencies\n\n• github.com/klauspost/compress v1.20.1 (#8737)\n• github.com/nats-io/nats.go v1.53.1 (#8737) \n\n### Changed\n\nJetStream\n\n• The `max_ha_assets` limit is now enforced consistently by the metalayer leader during stream and consumer placement, scaling and moves (#8639)\n\nGateways\n\n• Support for sending and handling the legacy `$GR.` reply prefix, used by servers prior to v2.1.2, has been removed (#8615)\n\n### Improved\n\nJetStream\n\n• Stalled source and mirror flow control is now reported in stream info and warning logs, making missing `$JS.FC.>` imports or exports easier to diagnose (#8633)\n• Stream and consumer placement now prefers peers that have caught up with the metalayer, reducing delays in API responses (#8643)\n• Improved the performance of deleting entries from and encoding AVL sequence sets (#8646)\n• Fast batch publish now reports backward sequence gaps as well as forward gaps (#8699)\n• Stream pending message calculations avoid unnecessary filestore cache access and handle deleted sequence ranges more efficiently (#8680, #8681)\n• Stream restore format detection now stops after the first S2 chunk (#8693)\n• Stream restore waits for the preferred node to become leader, avoiding an incorrect create response during clustered restore (#8690)\n• Memory backed streams avoid copying message headers and bodies twice when storing messages (#8652, contributed by @randomizedcoder)\n\nMonitoring\n\n• Leafz now reports whether a leafnode connection uses WebSockets (#8683)\n\nMQTT\n\n• QoS2 `PUBLISH` and `PUBREL` processing is now pipelined for increased throughput (#8416, contributed by @levb)\n• Reduced allocations and buffer copying when processing QoS1 and QoS2 messages and issuing JetStream store and delete requests (#8624, #8625, contributed by @levb)\n• Partial packets are no longer copied in full on every read, reducing allocations and buffer copying (#8692)\n\n### Fixed\n\nGeneral\n\n• `Connz` requests selecting a connection by `cid` now correctly apply account, user and MQTT client ID filters (#8613)\n• Pipelined client operations are no longer processed after a connection is rejected for exceeding the account's `max_connections` limit (#8614)\n• Queue subscription deny permissions are now checked against the mapped delivery subject (#8616)\n• Outstanding reply permissions are now preserved when inherited account permissions are refreshed without changing the response policy (#8620, contributed by @0xasritha)\n• Subscription deny filters are now rebuilt atomically when inherited account permissions are refreshed, preventing a window in which denied messages could be delivered (#8622, contributed by @0xasritha)\n• Unquoted configuration values beginning with a number and a size or exponent suffix, such as `0K1abc`, are now correctly parsed as strings (#8263, contributed by @koriyoshi2041)\n• Account JWT updates now reject invalid subject mappings instead of reporting success, and failed replacements no longer remove existing mappings (#8627, contributed by @vulragrag-star)\n• Cached subscription results are now cleared when an already connected client sends another `CONNECT`, preventing stale results from being reused after an account change (#8641, reported by @Tan-JunWei)\n• Fixed several data races affecting service imports and exports during configuration reloads and account updates (#8675)\n• Per-account routes no longer double count inbound account message and byte statistics (#8677)\n• TLS certificate pin validation now checks the correct pins after a configuration reload (#8679)\n• Auth callout rejections are now reported as authentication errors instead of account connection limit errors (#8688, contributed by @aniketatgithub)\n• Scoped `ProxyRequired` settings are now respected in JWTs and auth callouts (#8694)\n• Subscription interest notifications are no longer missed when a subscription is added or removed concurrently (#8703)\n• Fast batch ping no longer starts a new batch incorrectly (#8714)\n• Fixed issues with auth callout `auth_users` bypass \n• Fixed a PDH counter buffer overflow on Windows\n\nJetStream\n\n• Stale per-message TTL entries are now removed when their messages have already been deleted, avoiding repeated expiry scans and excess CPU and memory usage (#8595, contributed by @digitalstraw)\n• The maximum deliveries exceeded advisory is now sent correctly when a consumer's `max_deliver` is lowered below a message's existing delivery count (#8605, contributed by @zeke-lin)\n• The consumer created time is now preserved after recovery (#8621)\n• Filestore compaction now respects the configured sync settings when replacing a message block (#8629)\n• Fixed a race during filestore compaction that could cause consumers to skip messages or lose redelivery tracking (#8623, contributed by @as-clearview)\n• Concurrent updates to R1 consumers no longer lose API responses (#8628)\n• Stream and consumer create and delete requests received during metalayer catchup now receive responses once catchup completes (#8643)\n• R1 consumer create requests no longer lose their responses when the consumer is deleted immediately afterwards (#8643)\n• Fixed a data race when handling consumer leader stepdown requests (#8647)\n• Clustered snapshots now use the correct generated names for ephemeral consumers, allowing backup validation and restore to succeed (#8651, contributed by @kris70lesgo)\n• Fixed a memory leak affecting pull requests and direct gets after a configuration reload when the system account is explicitly configured in the `accounts` block (#8650, contributed by @1995parham)\n• Fixed membership change, learner scale-up and metalayer commit recovery issues (#8672)\n• Fixed migration and R1 scale-up issues that could delete a running store or lose writes (#8673)\n• Recreated streams with renamed Raft groups now start their monitors correctly (#8673)\n• Consumers are no longer moved to new stream peers before those peers hold the stream data (#8678)\n• Failed clustered stream restores now clean up correctly without deleting a subsequently recreated stream or losing a `stream rm` response (#8702)\n• Fixed a panic when shutting down a clustered JetStream server immediately after startup (#8707, contributed by @clwluvw)\n• Idempotent stream create requests with sources no longer time out after leader changes (#8703)\n• Interest cleanup no longer compacts a stream past its last sequence during recovery (#8710, contributed by @pat-s)\n• Raft nodes will no longer leak their WAL if stopped before route connections are available (#8711, contributed by @clwluvw)\n• Recovered ephemeral consumers with `inactive_threshold` set are now cleaned up properly after a server restart (#8732)\n\nLeafnodes\n\n• Publish permissions are now checked against the transformed subject sent over the leafnode connection, avoiding the need to also allow the original stream import subject (#8530, contributed by @fbarth-ifr)\n• Fixed incorrect pending byte accounting after a partial compressed write that could stall a leafnode connection and prevent it from reconnecting (#8636)\n• Closed leafnode connections are now correctly removed from the account's leafnode list, reducing retained memory and garbage collection pressure (#8637)\n• TLS state is now available to auth callouts when leafnodes connect over WebSockets (#8686, contributed by @jurry-duty)\n• Leafnode clients are now shed alongside regular clients during lame duck shutdown, avoiding a thundering herd (#8695)\n• Remote proxies now support TLS with `https://` proxy URLs and an optional proxy `tls` block (#8701)\n• Remote proxies no longer incorrectly warn that `nats://` URLs are unsupported or lose the hub's initial `INFO` message (#8701)\n• Remote proxy options are now rejected when no proxy URL is specified (#8701)\n• Leafnode isolation is now checked before the subscription permission checks, reducing CPU usage on hubs with large numbers of isolated leafnodes (#8727)\n• Leafnode interest and request/reply across account imports (#8730, contributed by @edjeffreys)\n\nGateways\n\n• The legacy `$GR.` reply prefix is now reserved on client ingress, preventing clients from publishing to gateway reply subjects using that prefix (#8615)\n\nMQTT\n\n• Config load no longer breaks QoS1/QoS2 delivery when `max_ack_pending` is unset (#8671)\n• MQTT packet lengths are validated earlier against `max_payload`, and non-QoS 2 `PUBREC` packets are handled correctly (#8692)\n\n### Complete Changes\n\nhttps://github.com/nats-io/nats-server/compare/v2.15.0...v2.15.1"
