ShortDescription: A local-first desktop workspace for Claude Code with multi-agent, Git worktrees, and diff review.
Description: Claude Code Haha is a desktop Claude Code workspace for macOS, Windows, and Linux. It offers multi-session workspaces, global search, branch and Worktree launching, diff review, a built-in browser preview, and GUI permission approval. Any model works, including Claude, ChatGPT, Grok, presets, or local endpoints, alongside image generation, visual MCP and SubAgent managers, an Agent Teams workbench, dynamic workflow orchestration, model tracing, Computer Use, a skill marketplace, color themes, desktop pets, H5 remote access, IM integration, and scheduled tasks.
