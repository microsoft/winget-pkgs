ShortDescription: Claude Code 的本地优先桌面工作区，支持多智能体、Git Worktree 与代码差异审查。
Description: Claude Code Haha 是一款面向 macOS、Windows 和 Linux 的桌面 Claude Code 工作区：提供多会话工作区、全局搜索、分支 / Worktree 启动、差异审查、内置浏览器预览、图形化权限审批，支持任意模型（Claude、ChatGPT、Grok、预设或本地端点），还包含图像生成、可视化 MCP 与 SubAgent 管理器、Agent Teams 工作台、动态工作流编排、模型调用追踪、Computer Use、技能市场、颜色主题、桌面宠物、H5 远程访问、即时通讯集成和定时任务。
