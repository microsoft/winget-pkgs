Description: NVIDIA Personal AI Router（PAIR）是一款面向同一本地网络内多台兼容电脑的本地推理路由器。它可发现参与节点、管理受支持的推理引擎，并向应用程序和智能体提供兼容 Ollama 与 OpenAI 的代理端点，根据引擎可用性、模型可用性和当前负载将相互独立的请求路由到合适的节点。
