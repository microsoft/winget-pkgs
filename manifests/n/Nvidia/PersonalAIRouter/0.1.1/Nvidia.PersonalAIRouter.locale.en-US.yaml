ShortDescription: A local inference router that spreads AI workloads across computers on the same network.
Description: NVIDIA Personal AI Router (PAIR) is a local inference router for a group of compatible computers on the same network. It discovers participating nodes, manages supported inference engines, and presents Ollama-compatible and OpenAI-compatible proxy endpoints to applications and agents. Independent requests are routed to eligible nodes according to engine availability, model availability, and current workload.
