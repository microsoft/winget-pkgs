ShortDescription: Microphone and audio device manager for Windows
Description: |-
  MicPlus is a Windows utility for managing the microphone and audio devices.
  It provides quick microphone mute/unmute, push-to-talk mode, audio device
  switching, tray controls and global hotkeys that work in games.
