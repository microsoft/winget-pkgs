ShortDescription: Управление микрофоном и звуковыми устройствами Windows
Description: |-
  MicPlus — утилита для Windows для управления микрофоном и звуковыми устройствами.
  Позволяет быстро отключать и включать микрофон, использовать режим PTT,
  переключать устройства вывода и ввода, управлять программой из трея
  и использовать горячие клавиши в играх.
