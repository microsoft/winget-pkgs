PackageName: 在吗 AreYouThere
License: MIT
ShortDescription: 用普通摄像头判断你是否在电脑前：在的时候保持屏幕常亮，离开后锁定电脑。完全离线。
Description: |-
  『在吗』是微软“存在感知”(Presence Sensing) 的轻量替代方案，后者只在部分新款设备上提供。
  它用普通摄像头和 Windows 自带的人脸检测判断你是否在电脑前：在的时候保持屏幕常亮，离开后锁定电脑。
  可选的智能检测在你操作键盘鼠标时不打开摄像头；可选的坐姿检测会提醒你坐直、离屏幕远一些。
  完全离线运行：摄像头画面只在本机内存中分析，不保存、不上传。
Tags:
- 摄像头
- 锁屏
- 息屏
- 隐私
