ShortDescription: Keeps the screen on while a webcam sees you and locks the PC after you leave. Fully offline.
Description: |-
  AreYouThere is a lightweight alternative to Microsoft's Presence Sensing, which is only available on some newer devices.
  It uses an ordinary webcam and the face detection built into Windows to check whether you're at the PC, keeps the screen on while you are, and locks the PC after you leave.
  Optional smart detection skips camera checks while you're typing or using the mouse, and an optional posture check reminds you to sit up straight or move back from the screen.
  It runs entirely offline: camera frames are analyzed only in memory and never saved or uploaded.
