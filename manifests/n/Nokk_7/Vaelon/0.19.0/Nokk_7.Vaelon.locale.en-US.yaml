ShortDescription: Private AI assistant that runs on your own computer.
Description: |-
  Vaelon is a private, open-source AI assistant for Windows and macOS that runs on your own computer, used by text
  or by voice.
  - Local by default: it thinks with a model through Ollama, so nothing you write leaves the computer; cloud models
    only if you turn them on.
  - Asks before anything risky, logs every action and can undo most changes.
  - Works with files and documents, keeps a calendar, tracks bills, invoices and a budget.
