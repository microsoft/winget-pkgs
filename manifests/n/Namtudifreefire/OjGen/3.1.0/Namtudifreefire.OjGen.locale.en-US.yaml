ShortDescription: Generate and validate test data for programming contests.
Description: OJGen is a Windows tool for generating and validating test data for competitive programming. It includes a graphical interface and command-line interface, supports reusable problem profiles and grouped test plans, runs reference and alternative solutions, checks validators and test coverage, and packages test files with SHA-256 manifests.
