InstallationNotes: Aurora demande les droits administrateur (UAC) à chaque démarrage, parce que la lecture des capteurs les exige. S'ils manquent, l'installeur ajoute aussi le runtime .NET 10 et le pilote PawnIO (températures du processeur et ventilateurs de la carte mère).
