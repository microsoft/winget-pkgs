ShortDescription: Free Windows 11 privacy tool that turns off telemetry, ads, Copilot and Recall and keeps them off after Windows updates.
Description: |-
  PrivacyPenguin turns off Windows 11 telemetry, ads and suggestions, activity tracking, Recall and Copilot, and tracking in Edge, Chrome, Brave and Office.
  Choose the Recommended set in one click (it shows first what will stop working) or pick from 195 settings yourself, each with a note on what it changes.
  A background service notices when Windows switches settings back, for example after an update, and reminds you or restores them.
  A restore point is created first, every change can be undone, and uninstalling offers to undo everything.
  Free, no account, collects nothing. It never changes Microsoft Defender, browser Safe Browsing or Brave Shields.
