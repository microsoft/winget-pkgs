ShortDescription: A terminal and file explorer for Windows.
Description: |-
  moss is a terminal and file explorer for Windows. Every tab is a real shell (cmd with clink: tab completion,
  autosuggestions) and a key turns it into a view of that shell's folder. Split panes, drag tabs between them; tabs keep
  running in the background and come back after a reboot. Built-in picture view, text files open in your terminal
  editor, Claude Code sessions in a sidebar. Faster than Windows Terminal, under a millisecond from key to screen.
