ShortDescription: "Диспетчер трафика для Windows: десинк Zapret, VPN sing-box и бесплатный WARP."
Description: |-
  Zephyron — открытый диспетчер трафика для Windows 10/11. Для каждого сайта,
  сервиса или программы решает, куда пойти трафику: через десинк Zapret/winws2,
  через туннель sing-box или напрямую. В VPN уходит только выбранное. Подписка
  не обязательна: десинк, бесплатный Cloudflare WARP и прокси для Telegram
  Desktop работают без неё. Распаковать и запустить Zephyron.exe.
