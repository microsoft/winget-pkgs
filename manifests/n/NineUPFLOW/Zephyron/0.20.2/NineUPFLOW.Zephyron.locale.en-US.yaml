ShortDescription: "Per-app traffic router for Windows: Zapret desync, sing-box VPN and free WARP."
Description: |-
  Zephyron is an open-source traffic dispatcher for Windows 10/11. For every site,
  service or app it decides where the traffic goes: through Zapret/winws2 desync,
  through a sing-box tunnel, or straight out. The VPN carries only what you route
  into it. No VPN subscription required: desync, free Cloudflare WARP and a proxy
  for Telegram Desktop all work without one. Unpack and run Zephyron.exe.
