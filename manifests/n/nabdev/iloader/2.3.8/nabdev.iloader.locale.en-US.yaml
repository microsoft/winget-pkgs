ReleaseNotes: |-
  What's Changed
  - Fix 503 Service Temporarily unavailable
    - You will be required to authenticate with 2FA again (Trusted Device 2FA and accounts with no 2FA are fine for now, SMS 2FA is still broken)
    - Custom anisette servers will no longer work, you will have to use one of the two servers in iloader's list now (it will change automatically)
  - Fix pairing file name for StikDebug and SideStore
  This will likely be the last update to iloader v2.0.0, unless any other major issues crop up. My development time is being focused on the next major version, dubbed iloader-next, which will bring with it many new features and improvements including a new UI, a web version, improved 2FA options, a guided/user-friendly install wizard like experience, and much more. (I know I have been saying this for a while, but life has been busy! It will be released soon, I promise)
