  - Use main profile is applied by default to save app ids
  iloader v2.0.0 is only receiving critical bugfixes now. My development time is being focused on the next major version, dubbed iloader-next, which will bring with it many new features and improvements including a new UI, a web version, improved 2FA options, a guided/user-friendly install wizard like experience, and much more.
