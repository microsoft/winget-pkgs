ReleaseNotes: |-
  Introducing the next-gen Nitro PDF Pro
  Nitro PDF Pro has been redesigned with a modern interface, a new dedicated home for every AI-powered capability, and feature improvements you have been asking for.
  What's New
  - A modernized look and feel: Every tab and the Home Screen have been redesigned with new icons and consistent formatting.
  - A new Smart Tools tab: A dedicated home for every AI-powered capability, letting you extract data to spreadsheets, auto-create fillable forms, redact sensitive information, and chat with your PDF to search, summarize, and translate.
  - New OCR engine: Improved accuracy and speed, with better handling of low-resolution and noisy scans.
  - Arabic and Hebrew text recognition (OCR): Scanned documents in Arabic and Hebrew can now be converted into searchable text using the same OCR technology used for other supported languages. Please note that this capability requires the installation of separate, downloadable language packs.
  - Improved PDF-to-Office conversion: Exporting PDFs to Word, Excel, or PowerPoint now delivers higher-quality results with better accuracy and formatting.
  - Enhanced PDF compression: Improved file size optimization reduces document sizes more efficiently while maintaining quality.
  - Right-to-left (RTL) page layout support: Choose a right-to-left page layout in Page Layout settings and Document Properties for documents written in Arabic, Hebrew, and other right-to-left languages.
  Fixed Issues & Improvements
  - Faster performance with large documents: Improved speed and stability when opening, scrolling, and splitting large or image-heavy PDF files.
  - Better file handling: Documents protected with third-party security tools now open correctly.
  - Email PDF portfolios: Now display sortable From, Subject, Date, and Attachments columns, with dates sorting correctly.
  - Improved document rendering: PDFs generated by certain third-party applications now display correctly.
  - Improved iManage integration: Files opened from iManage now check back in correctly when closed.
  - Improved PDF/A conversion: Fixed an error that prevented certain files from converting to PDF/A format.
  - Other fixes and improvements
