ReleaseNotes: |-
  What's New
  - New feature: Digital signature verification: Nitro PDF Pro introduces enhanced digital signature verification, with customizable validation settings, improved accuracy when verifying signed documents, and expanded support for trusted digital signatures.
  - Region-aware services: Nitro PDF Pro automatically connects to Nitro Sign and Smart Tools services in your account's region to support data residency requirements.
  - Security settings retained: Protected documents retain their security settings when pages are appended using Nitro PDF Creator.
  Fixed Issues & Improvements
  - Improved upgrade reliability: Upgrading Nitro PDF Pro will not affect other installed applications.
  - Nitro starts on virtual and remote desktops: Nitro opens smoothly on shared and virtual desktops, and for administrators and remote desktop users on Windows Server 2019.
  - Automatic Reconnection After Network Interruptions: Nitro keeps you signed in through short network or server interruptions. It retries automatically before asking you to sign in again.
  - Printing improvements: Printing is more accurate and retains your print settings.
  - Protected documents: Quick signatures can no longer be added to protected documents from the Print screen.
  - Accurate printing: All page content prints as displayed on screen.
  - Landscape orientation: Landscape pages retain their orientation when printing to Nitro PDF Creator.
  - Correct number of copies: Nitro PDF Creator prints the number of copies selected.
  - Printer selection: Renamed printers remain selected. If a printer is removed, Nitro switches to the Windows default printer.
  - Print settings: Collation, custom settings, and pages per sheet work as expected.
  - PDF rendering: Fixed issues that prevented certain PDFs from displaying correctly.
  - Overlapping content: Fixed issues with overlapping content in PDFs generated by the ABCPdf reporting tool.Documents display fully when opened
  - Improved Windows accessibility and display: Nitro respects Windows accessibility, font scaling, and dark mode settings.
  - Accessibility and font scaling: Ribbon tools display correctly with Windows accessibility and text scaling settings.
  - Larger text sizes: Ribbon fields display fully when Windows text size is set to 150% or higher.
  - Dark mode: The Legal Notices window displays correctly in Windows dark mode.
  - Network links open as expected: Links in a PDF that point to a file on a network share open as expected.
  - iManage documents open in Nitro PDF Pro: Documents open from iManage as expected.
  - Improved performance and stability: Improved reliability across everyday tasks, including working with large documents, saving to OneDrive, restoring Preferences, and starting Nitro.
  - Large document handling: Improved stability when organizing pages, combining documents, and redacting large PDFs and fillable forms.
  - Saving to OneDrive: Saving to OneDrive works reliably, even if the sign-in process is interrupted.
  - Restore Preferences: Nitro opens correctly after restoring Preferences to their default settings.
  - Windows stability: Fixed an issue where closing Nitro during startup could interfere with double-click functionality in Windows.
  - Improved support for XFA forms
  - Your pinned Nitro icon keeps working after an upgrade: The Nitro icon pinned to your taskbar keeps working after you update to a new version.
  - Japanese and Ukrainian OCR works as expected: Scanned Japanese and Ukrainian documents can be made searchable once the language pack is installed.
  - Keyboard shortcuts and typing work as expected: Keyboard and typing improvements across the File menu, ribbon, fields and side panels.
  - The Create form button is now disabled on PDF/A files.
  - Improved Recent Documents search: Results refresh correctly when switching between tabs in Recent Documents. Search results from document management systems, such as SharePoint, display file names without the .pdf extension.
  - Improved trial expiration messages: Messages display correctly, including when offline. Tooltips display accurate information when the trial has expired.
  - Other fixes and improvements
