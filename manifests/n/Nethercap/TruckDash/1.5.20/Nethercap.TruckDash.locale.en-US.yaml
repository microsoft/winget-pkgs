ShortDescription: Free GPS and second screen dashboard for Euro Truck Simulator 2 and American Truck Simulator.
Description: Truck Dash reads the game's telemetry on your PC and shows a live map with your route, speed, fuel, job and delivery time on a phone, tablet or second monitor through the browser. It works over the internet or on your own Wi-Fi without internet, needs no account and no admin rights, and installs the telemetry plugin for you. Free and open source (MIT).
