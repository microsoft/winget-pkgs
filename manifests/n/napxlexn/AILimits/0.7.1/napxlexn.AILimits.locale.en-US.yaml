ShortDescription: A tiny native Windows 11 overlay showing your AI provider usage limits.
Description: >-
  AI Limits is a tiny native Windows 11 floating overlay that shows your AI
  provider usage limits right on the desktop: Claude, OpenAI Codex, GitHub
  Copilot, Google Antigravity, xAI Grok, and Cursor. It uses authentication
  already stored by official CLI tools, read only after the user allows each
  one, or credentials added manually by the user; Cursor uses a sign-in of
  the app's own. It does not refresh CLI tokens and sends no telemetry. It
  needs no admin rights, ships statically linked with no extra runtime, and
  has a low idle resource footprint. A Settings window chooses the
  rows shown, extra rows where a provider meters a part on its own, and an
  optional label with the model in use. A taskbar indicator keeps usage, or
  the time until a limit resets, visible even when the overlay is hidden.
