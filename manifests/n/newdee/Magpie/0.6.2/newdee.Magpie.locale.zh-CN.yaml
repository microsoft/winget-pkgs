PackageIdentifier: newdee.Magpie
PackageVersion: 0.6.2
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: |-
  - 今天这一行（#13）。搜索框为空时，最上面一行显示今天的日期和星期；中文界面还有农历、传统节日，以及交节当天的节气；深夜、早上、中午各有一句问候。这一行不会被选中，设置 → 通用 里可以单独关掉。
  - 置顶文件夹（#13）。最多 4 个常去的文件夹，按你排好的顺序显示在本地文件页签空框的最上面（设置 → 本地文件），回车打开，不需要在索引文件夹里。
  - 旧物重现按页签（#13）。Web 页签只出书签，Stars 页签只出仓库，本地文件页签两张都有，每张当天不换。
  - 工作现场支持拼音（#19）。名字和应用一样能用前缀、首字母、拼音搜到；gzxc（或 ws）列出全部。小贴士新增旧物重现、工作现场、脚本命令三条。
