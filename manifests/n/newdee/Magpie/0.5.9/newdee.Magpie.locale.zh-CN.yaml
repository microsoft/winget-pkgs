PackageIdentifier: newdee.Magpie
PackageVersion: 0.5.9
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: |-
  - ZIP 里的文件能找到那个 ZIP。压缩包现在能按包里的文件名搜到，结果里写明命中的是哪个文件。加了密码的也行（ZIP 的文件名不加密）；Windows 自带「发送到压缩文件夹」打的中文文件名也能正确读出。之前索引过的 ZIP 会自动重读一次。7z、rar 仍只按自身文件名。
  - 书签和浏览记录的预览更有用（#13）。现在会显示是哪个网站、Firefox 记下的网页简介、收藏在哪个文件夹和收藏时间、访问过几次以及浏览器还记得的最早和最近一次访问。都来自浏览器自己的文件，不联网。
