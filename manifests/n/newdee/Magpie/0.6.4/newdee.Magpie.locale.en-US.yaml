ReleaseNotes: |-
  - The first tip went too soon (#13). The tips turned every 8 seconds even while the palette was hidden, so the first one after a summon could go within a second. They now stop while the palette is hidden, and each summon gives the first tip its full 8 seconds.
  - After the palette was put away by a click outside it, a script's output was still there at the next summon. It now goes, as it does when the palette is put away any other way.
