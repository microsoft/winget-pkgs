PackageIdentifier: newdee.Magpie
PackageVersion: 0.5.4
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: |-
  - 划词搜索又能取到选中的文字了（#17）。之前模拟复制快捷键时，热键里的 Option+Shift 往往还按着，应用收到的是 ⌥⇧⌘C（Windows 上是 Ctrl+Alt+C），什么也没复制，magpie 就弹出一个空框。现在先等这些键松开再复制，并且等应用真正写入剪贴板，不再固定只等 160 毫秒。选中的文字原本就在剪贴板里，也算复制成功。
  - 打开预览时不再跳一下（#11）。之前预览会先挤在原来的窄窗口里，窗口加宽后才移到右边。现在窗口加宽完成之前，预览留在窗口边缘之外；关闭时顺序反过来。
