PackageIdentifier: newdee.Magpie
PackageVersion: 0.5.5
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: |-
  - AppImage 在 Arch 等较新的发行版上能正常出界面了（#15）。包里自带的 libwayland-client 来自 Ubuntu 22.04，和较新的图形栈合不来，窗口出不来（EGL_BAD_PARAMETER）。现在改用系统自己的，不再需要 LD_PRELOAD。
  - macOS：辅助功能授权框不再被浮窗挡住（#17）。之前没有权限时，划词搜索会请系统弹出授权框，结果框被压在 magpie 下面。现在由浮窗自己显示提示，带一个按钮直接打开 隐私与安全性 → 辅助功能。划词成功或手动关闭之前，提示会一直留着。
