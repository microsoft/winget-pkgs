ReleaseNotes: '- 深色主题在明亮桌面上看不清。 面板透出 38% 的桌面，背后是白色窗口或壁纸时，面板变成中灰色：提示字对比度降到 1.0:1，次要文字 2.1:1。现在面板 90% 不透明，提示字调亮一点。无论桌面是黑是白，正文对比度都不低于 4.5:1，提示字不低于 3:1。五套主题现在都达到这个标准。'
