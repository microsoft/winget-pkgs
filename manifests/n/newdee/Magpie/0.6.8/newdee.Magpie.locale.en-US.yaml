ReleaseNotes: '- The dark theme was hard to read over a bright desktop. Its panel let 38% of the desktop through, so a white window or wallpaper behind it turned the panel mid-grey: the hint text fell to 1.0:1 contrast and the secondary text to 2.1:1. The panel is now 90% opaque and the hint text a shade lighter, so text reads at 4.5:1 or more and hints at 3:1 over a black or a white desktop. All five themes now meet that.'
