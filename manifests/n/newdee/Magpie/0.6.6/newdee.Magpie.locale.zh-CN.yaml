PackageIdentifier: newdee.Magpie
PackageVersion: 0.6.6
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: |-
  - 剪贴板历史一直占着 CPU（#22、#23）。打开剪贴板历史后，magpie 每秒把剪贴板完整读一遍来判断有没有变；剪贴板里是图片时，每秒都要解码一次。在 Windows 上，剪贴板放着一张 4K 图时大约占一个核心的 5%；在 Mac 上表现为空闲时 0.3%–5%。现在 magpie 先问系统剪贴板有没有变（Windows 和 macOS 有变化计数），变了才去读。同样的测试现在不到一个核心的 0.2%。Linux 没有这个计数，仍然每秒读一次，和以前一样。
  - 一次复制同时放了文本和图片时（比如复制一片单元格），历史里会每秒交替记一次文本和图片。现在只记文本，记一次。
