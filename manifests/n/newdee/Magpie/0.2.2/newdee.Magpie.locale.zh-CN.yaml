PackageIdentifier: newdee.Magpie
PackageVersion: 0.2.2
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: |-
  更新内容
  - macOS 全屏应用之上也能唤出 —— 以前别的应用原生全屏时按 Alt+Space 看不到浮窗，要切出那个 Space 才出现。现在浮窗直接进入你所在的 Space，全屏的浏览器、终端也一样。原因：macOS 不允许"在普通（有 Dock）应用状态下创建"的窗口进入全屏 Space，而 Tauri 建窗口比 magpie 切成菜单栏应用更早；现在切换发生在窗口存在之前。由此 magpie 在 macOS 上是菜单栏应用：不占 Dock、不进 Cmd-Tab，和 Spotlight 一样。
  - 用完输入框自动清空 —— 打开结果、复制剪贴条或计算结果、记笔记、bang 搜索、Ctrl+Enter 之后查询清空，下次唤出是空的。Esc 收起仍保留你输入的内容。
