ReleaseNotes: |-
  What's new
  - The palette opens over full-screen apps on macOS — with another app in native full screen, Alt+Space used to do nothing visible until you left that Space. The palette now joins whatever Space you are in, a full-screen browser or terminal included. Under the hood: macOS never admits a window to a full-screen Space if it was created while the app was a regular (Dock) app, and Tauri built the palette before magpie switched to being a menu-bar app. The switch now happens before the window exists. As a result magpie is a menu-bar app on macOS: no Dock icon, no Cmd-Tab entry, like Spotlight.
  - The box is empty after you use it — opening a result, copying a clip or a calculation, saving a note, a bang search or Ctrl+Enter now clear the query, so the next summon starts fresh. Esc still keeps what you typed.
