ReleaseNotes: '- Start every summon on the same tab (#10). Settings → General → Tabs has a new switch, "Start on the ★ tab". Turned on, magpie goes back to the ★ tab each time it is hidden, so every summon starts there, whatever tab you left it on; Cmd/Ctrl+1–4 still switch. Off by default: the palette comes back on the tab you left, as before. A selection search and magpie --source … still open on the tab they ask for.'
