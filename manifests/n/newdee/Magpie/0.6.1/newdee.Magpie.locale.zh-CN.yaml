PackageIdentifier: newdee.Magpie
PackageVersion: 0.6.1
PackageLocale: zh-CN
ShortDescription: 聚焦式本地搜索，找回你保存过却忘记的一切。
Description: magpie 是一款聚焦式（Spotlight 风格）本地搜索工具，帮你找回保存过却忘记的一切：本地文件、截图、视频、GitHub 收藏和书签。描述你依稀记得的内容，magpie 就能找到它。一切都在你自己的机器上运行，不做全盘扫描。它还能读取图片像素、视频帧和其中印刷的文字，并可通过 MCP 服务器把同一索引提供给 AI 助手使用。
Tags:
- 启动器
- 搜索
- 本地搜索
ReleaseNotes: '- 商店应用也能启动了。记事本、计算器、画图、终端、设置，以及从 Microsoft Store（或以 MSIX 包）安装的应用，开始菜单里没有快捷方式，magpie 以前列不出来，在 Windows 11 上输入 notepad 什么也找不到。现在都在应用列表里，带图标，名字和系统里显示的一样。Windows 自带的这些应用不管系统是什么语言，中英文名都能搜：notepad、记事本、jsb 都能找到记事本。商店应用没有所在文件夹，也不能以管理员身份运行，Ctrl+K 菜单里就不放这两项。'
