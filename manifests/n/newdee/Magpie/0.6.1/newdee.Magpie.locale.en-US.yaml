ReleaseNotes: "- Windows Store apps in the app list. Notepad, Calculator, Paint, Terminal, Settings and every other app installed from the Microsoft Store (or as an MSIX package) had no Start Menu shortcut, so magpie never listed them and notepad found nothing on Windows 11. They are listed now, with their icons, under the names Windows shows. Windows' own apps answer to their English and their Chinese name whatever the system language: notepad, 记事本 and jsb all find Notepad. A Store app has no folder to show and cannot run as administrator, so those two entries are not in its Ctrl+K menu."
