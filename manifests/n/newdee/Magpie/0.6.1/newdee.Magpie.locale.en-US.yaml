ShortDescription: Spotlight-style local search for everything you saved and forgot.
Description: 'magpie is a Spotlight-style local search tool for everything you saved and forgot: local files, screenshots, videos, GitHub stars, and bookmarks. Describe what you half-remember and magpie finds it. Everything runs on your own machine, with no full-disk scanning. It also reads pixels, video frames, and words printed on them, and can offer the same index to AI assistants through an MCP server.'
