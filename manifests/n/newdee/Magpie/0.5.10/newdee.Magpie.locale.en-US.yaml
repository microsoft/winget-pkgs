ReleaseNotes: "- See what's in a ZIP. The preview of a ZIP now lists the files inside, with the one your search matched in view and marked. It says how many files the ZIP holds in all, and whether they need a password (the names still show; ZIP only locks the contents). Only the archive's own list of names is read, nothing is unpacked."
