ReleaseNotes: |-
  This is a minor bug fix release with the following changes:
  - Waveform dumping now dumps multiple top-level units instead of only the first elaborated unit.
  - Fixed incorrect statement coverage in --per-file report when two instances of the same entity have different generic values (#1567).
  - Fixed a regression which caused a crash when using vhpi_put_value on a selected name in a record with an unconstrained field (#1624).
  - Fixed a regression where 'event was not set properly when a signal was updated by a vhpi_put_value deposit twice in one delta cycle (#1626).
  - Unpacked dimensions are now allowed in System Verilog port declarations (#1625).
  - Several other minor bugs were resolved (#1621, #1627, #1629)
  Special thank you to @bpadalino, @tmeissner, @Blebowski, @amb5l, @m42uko, @a-panella, @cmarqu, @albydnc, @johonkanen, @augustofg, @davidgussler, and Eltvor for sponsoring me!
