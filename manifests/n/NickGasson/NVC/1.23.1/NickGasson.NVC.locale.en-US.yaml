ReleaseNotes: |-
  This is a minor bug fix release with the following changes:
  - Fixed a crash after a severity failure assertion failure during elaboration.
  - Aliases of globally static names are now correctly treated as globally static themselves (#1683).
  - Fixed connecting VHDL std_logic_vector signals to System Verilog input logic ports in mixed language simulation (#1681).
  - Fixed a crash when a PSL directive has an inline clock expression (#1693).
  - PSL declarations are now accepted in generate blocks (#1694).
  - Several other minor bugs were resolved (#1663, #1672, #1668, #1670, #1686, #1687, #1692, #1695, #1700, #1707).
  Special thank you to @bpadalino, @tmeissner, @Blebowski, @amb5l, @m42uko, @a-panella, @cmarqu, @albydnc, @johonkanen, @augustofg, @davidgussler, my private sponsors, and Eltvor for sponsoring me!
