ShortDescription: Open-source Windows 11 archiver with the full 7-Zip engine
Description: |-
  New7z is a free, open-source compression and extraction tool built for Windows 11.
  It creates 7z and ZIP archives and reads 7z, ZIP, RAR, TAR, GZ, XZ, BZ2 and ISO
  archives with the complete 7-Zip engine bundled in the installer. Images and
  text/source files can be previewed directly inside an archive, entries can be
  dragged to Explorer to extract them, and 7z/ZIP archives can be edited in place.
  The app integrates with the Explorer context menu and the Windows "Open with"
  list, runs fully offline, and needs neither a separate 7-Zip installation nor a
  .NET runtime.
