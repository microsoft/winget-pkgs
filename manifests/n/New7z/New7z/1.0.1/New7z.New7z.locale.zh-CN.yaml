ShortDescription: 基于完整 7-Zip 引擎的开源 Windows 11 压缩解压软件
Description: |-
  New7z（新 7z）是一款面向 Windows 11 的免费开源压缩与解压软件。可创建 7z、ZIP
  压缩包，并可读取和解压 7z、ZIP、RAR、TAR、GZ、XZ、BZ2、ISO 等格式，安装包内含完整的
  7-Zip 引擎。支持在压缩包内直接预览图片和文本/源码文件、把条目拖到资源管理器完成解压，
  以及直接向 7z、ZIP 包内添加或删除条目。软件集成资源管理器右键菜单和 Windows「打开方式」
  列表，完全离线运行，无需另装 7-Zip 或 .NET 运行库。
