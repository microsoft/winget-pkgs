ShortDescription: A desktop canvas for AI coding agents — run agent CLIs side by side, wire them to browsers, terminals and notes.
Description: |-
  NeuroSquad is a free desktop app that runs AI agent CLIs as cards on one canvas, each with its own live terminal.
  Draw an arrow from an agent to a browser, a terminal, a note or another agent, and the agent gets tools for it.
  Agents signal when they finish a turn or need you, and a lead agent can start and brief its own helpers.
  The agents run on your computer with your own subscriptions and API keys; your code stays on your machine.
  Requires a free NeuroSquad account. The app keeps itself up to date.
