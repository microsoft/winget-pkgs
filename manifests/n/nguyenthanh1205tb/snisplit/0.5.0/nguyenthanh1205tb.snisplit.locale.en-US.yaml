ShortDescription: Local proxy that gets around SNI-based ISP blocking by splitting the TLS ClientHello.
Description: |-
  snisplit is a small local proxy for sites that an ISP blocks by reading the server name (SNI) at the start of HTTPS connections, such as Steam in Vietnam.
  It splits the TLS ClientHello so the name never appears whole in one packet. Traffic still goes directly to the real server; there is no VPN and no driver.
  Includes a tray icon, a hosts-file helper and self-update.
