ShortDescription: Native Windows build of the OpenLiteSpeed web server with PHP through LSAPI.
Description: OpenLiteSpeed 1.9.4 built for Windows without WSL, Docker or a virtual machine. It uses every CPU core, serves PHP 8.2 to 8.5 through LSAPI or FastCGI, supports HTTP/3, LSCache, .htaccess files, Let's Encrypt certificates and ModSecurity, and installs on its own or inside Laragon and XAMPP. The full stack edition adds a dashboard, MariaDB, phpMyAdmin and Cloudflare Tunnel to put local sites online, and installs PHP and Node.js versions, a PHP version per site, Laravel, Node.js and Python sites from the dashboard.
