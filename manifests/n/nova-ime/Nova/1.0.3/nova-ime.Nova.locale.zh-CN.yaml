ShortDescription: 基于 Rime 引擎与小狼毫、内置本地 GPT-2 模型的中文整句输入法。
Description: |-
  Nova 星语是 Windows 上的中文整句输入法，基于 Rime 引擎，从小狼毫分叉而来。

  整句盲打，一次打对；偶尔打错，按一两个键就能改。像平时一样把一整句连着打完，Nova 会结合你前面打过的字理解这句话，大多数时候直接按空格就是对的，不用盯着候选框一个词一个词地挑。

  - 本地运行：模型装在程序里，打字时不联网，打过的字只留在你的电脑上。
  - 打法齐全：支持全拼，以及自然码、小鹤、微软、搜狗四种双拼。
  - 无需配置文件：使用时选择打法，之后可以在托盘菜单里更换。

  Nova 在 Rime 引擎上加入了一个约 1 亿参数的 GPT-2 中文模型，每按一个键，由模型给整句候选重新打分。模型以 uer/gpt2-chinese-cluecorpussmall 为起点，用约 22 亿字的多领域中文语料继续训练。
