PackageIdentifier: nova-ime.Nova
PackageVersion: 1.0.3
PackageLocale: en-US
ShortDescription: A Chinese sentence-level input method for Windows built on the Rime engine and Weasel, with a local GPT-2 model.
Description: |-
  Nova Xingyu is a sentence-level Chinese input method for Windows, built on the Rime engine and forked from Weasel.

  Type a whole sentence in one go and press space; Nova reads the context of what you have already typed, so the result is usually correct without picking candidates one word at a time. Mistakes can be corrected with one or two keystrokes.

  - Runs locally: the model ships with the program. Nothing is sent over the network while you type, and what you type stays on your computer.
  - Complete input schemes: full pinyin, plus Ziranma, Xiaohuo, Microsoft and Sogou shuangpin.
  - No configuration files: choose an input scheme while setting up, then switch it later from the tray menu.

  Nova adds a Chinese GPT-2 model of about 100 million parameters to the Rime engine, and rescores sentence candidates after every keystroke. The model starts from uer/gpt2-chinese-cluecorpussmall and is further trained on roughly 2.2 billion characters of multi-domain Chinese text.
