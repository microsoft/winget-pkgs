ReleaseNotes: |-
  DeepSeek Harness Desktop 4.0.0
  中文
  本次亮点
  DeepSeek 官方尚未正式发布独立 Desktop 产品；4.0 普通版已经把公开的官方 DSH Runtime、Web UI、拆分 SDK 与官方仓库可见的 Desktop 能力边界融合进可安装的 Windows 社区应用。这里的“融合”是基于公开代码和 NPM 包的兼容适配，不代表获得未公开私有源码；社区版继续使用独立应用身份、数据目录、协议、安装器和更新源，并非 DeepSeek 官方客户端。
  本版本重点解决从 3.5 覆盖升级后的插件与历史会话可靠性，并把模型协作、技能和桌面常用能力整理成更容易找到的入口。旧 Desktop Profile 只读扫描，精确版本的 Registry 插件可安全恢复；Git 插件固定旧提交后等待用户确认，任何恢复失败都不会阻断启动。
  会话左侧栏新增“模型协作”，可直接打开唯一的拓展坞窗口并进入协作页面。Agent Team 与性价比模式在同一页独立配置，bai 供应商在相关模型选择器中统一置顶。技能中心与会话技能菜单使用同一 DSH Home，并兼容 DSH 4 的富文本输入框。底部面板展开不再隐式启动终端，桌面窗口控件也完成了视觉与行为整理。
  插件安装继续以稳定性为底线，同时保留用户选择权。明确不匹配的第三方插件默认劝退，但用户可在风险说明后主动尝试；安装仍必须通过隔离 staging、Bundle、完整性、受保护依赖图和 Runtime 启动检查。重复安装本地 .tgz 使用内容寻址缓存，不再因临时文件被清理而报 ENOENT，失败会回滚且不污染后续 Registry 安装。
  验证
  正式版门禁覆盖 3.5 插件恢复、历史会话重开、新会话关闭后重载、桌宠保存终态、Git 与 Registry 市场安装、本地 .tgz 重复安装、梁神模式权限参数、Windows 隐藏控制台、模型协作深链、技能发现、底栏、窗口、DPI、亮色与暗色布局。源码单元、机器基线、共享文件一致性、真实 Electron 和打包应用回归均作为发布门禁，任何未通过项必须在发布报告中明确列出。
  匿名埋点新增会话技能打开与插入漏斗，并修复会话导入事件被白名单静默丢弃的问题。高频成功事件只进入无实例标识的聚合层；失败诊断保持有界，不记录 API Key、Prompt、对话正文、项目名、会话内容、技能名称、文件路径、局域网地址或插件私有配置。埋点失败不影响产品功能。
  下载与校验
  正式安装包名为 DeepSeek-Harness-Desktop-Setup-4.0.0-x64.exe。请从 ningbainb/deepseek-harness-desktop 的 4.0.0 GitHub Release 下载安装包与校验文件，并使用 PowerShell Get-FileHash -Algorithm SHA256 核对。本版安装包未进行代码签名，Windows 可能显示“未知发布者”或 SmartScreen 提示；安装包哈希、大小和签名状态均以同一 Release 中的清单为准。
  说明
  这是普通版正式构建，与标书版目录、分支及交付物分开，构建流程未混入标书专属内容。本项目由 ningbai 牛逼 维护，是社区开源桌面端，并非 DeepSeek 官方客户端；模型通过服务商 API 使用，价格和可用性以服务商为准。覆盖升级前仍建议备份重要会话和配置，无法兼容的旧 Git 插件会保留在待恢复清单中，不会伪装为安装成功。
  项目与反馈 · 爱发电支持
  English
  Highlights
  DeepSeek has not yet released a standalone official Desktop product. The 4.0 standard edition combines the public official DSH Runtime, Web UI, split SDK packages, and the Desktop boundaries visible in the official repository into an installable community Windows application. “Integrated” means compatibility work based on public code and NPM packages, not access to unreleased private source. The community edition keeps its own application identity, data home, protocol, installer, and update feed and is not an official DeepSeek client.
  This release focuses on reliable upgrades from 3.5, especially installed plugins and historical conversations, while making collaboration, skills, and common Desktop capabilities easier to discover. The legacy Desktop Profile is scanned read-only. Exact Registry versions can be restored transactionally, while Git plugins remain pinned to their previous commit and wait for explicit confirmation. A failed recovery item never blocks Desktop startup.
  The conversation sidebar now includes a Model Collaboration entry that focuses the single Extension Dock window and opens the collaboration page directly. Agent Team and Value Mode remain independently configurable on that page, and the bai provider is ordered consistently near the top of the related model pickers. The Skill Center and conversation skill menu share the same DSH Home and support the DSH 4 rich-text composer. Expanding the bottom panel no longer starts a terminal implicitly, and native window controls have received a visual and behavioral cleanup.
  Plugin installation keeps a stable default without removing informed choice. A plugin with a declared version mismatch is discouraged by default, but a user may explicitly request a risk install after reading the warning. Every attempt must still pass isolated staging, Bundle validation, integrity checks, protected dependency graph checks, and Runtime startup validation. Local .tgz sources use a content-addressed cache so repeat installation cannot lose its archive and poison later Registry operations.
  Verification
  The stable release gates cover legacy plugin recovery, historical session reopening, reopening newly created sessions after restart, pet setting terminal states, Git and Registry installs, repeat local archive installs, Liangshen sandbox argument handling, hidden Windows console behavior, collaboration deep links, skill discovery, bottom-panel behavior, window controls, DPI scaling, and light and dark responsive layouts. Source tests, machine-readable baselines, shared-file consistency, real Electron checks, and packaged application regression are all required. Any exception must be listed explicitly in the final release report.
  Anonymous measurement now includes the conversation-skill open and insertion funnel, and the previously dropped conversation-import surface event is admitted by the allowlist. High-frequency success signals remain in an actor-free aggregate plane. Bounded failures exclude API keys, prompts, conversation text, project and session content, skill names, file paths, LAN addresses, and private plugin configuration. Telemetry delivery failure never blocks product behavior.
  Download and verification
  The release artifact is named DeepSeek-Harness-Desktop-Setup-4.0.0-x64.exe. Download it and the checksum files from the 4.0.0 GitHub Release in ningbainb/deepseek-harness-desktop, then verify it with PowerShell Get-FileHash -Algorithm SHA256. This release is not code-signed, so Windows may show an unknown-publisher or SmartScreen warning. Hash, size, and signature status are recorded from the exact final artifact in the same Release.
  Notice
  This is the standard-edition stable build and is kept separate from the tender-edition directory, branch, and deliverables. The project is maintained by ningbai 牛逼 as a community open-source desktop application and is not an official DeepSeek client. Model access, pricing, and availability depend on the selected provider. Back up important conversations and configuration before an overlay upgrade. Incompatible legacy Git plugins remain visible as pending recovery items instead of being reported as installed.
