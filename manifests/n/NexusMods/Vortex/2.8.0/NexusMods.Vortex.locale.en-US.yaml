ReleaseNotes: |-
  As the evenings draw in and the weather gets a bit crisper, there's no better excuse to stay indoors and settle into a freshly modded playthrough. We’ve packed Vortex 2.8 with some brilliant quality-of-life upgrades, including a totally revamped Games page and much smoother downloads.
  Here is a quick look at what’s new!
  🎮 A Brand New Games Page
  We’ve completely rebuilt the Games page into three clear sections: games you’re currently managing, games we’ve detected on your PC, and every single game Vortex supports. The snazzy new game tiles now tell you exactly which storefront your game is installed from (Steam, GOG, Xbox, etc.) and let you add or launch them with a single click. We've also tweaked image loading so covers no longer jump-scare you, but instead fade in gracefully.
  📥 Download Flyouts & UI Comforts
  Ever click "Download" and wonder if it actually worked? A new flyout will now appear next to the download button showing the mod, your progress, and what's queued up next. Over in your Interface settings, we've added a "Reduce motion" toggle (which respects your Windows accessibility settings) and an option to force compact headers to maximise your screen space. Crucially, notifications will no longer rudely steal your cursor focus whilst you're trying to type in a search box!
  🛠️ Smarter Modding & Fixes
  If you haven't customised your Mods toolbar. 'Deploy' and 'Purge' are now front-and-centre by default, and the 'Manage Rules' button will helpfully light up when you have file conflicts waiting to be resolved. We've fixed a frustrating bug where a file could occasionally pull in mod details for the completely wrong game, and Baldur's Gate 3 players can now safely include Script Extender config files in their Collections!
  ⚙️ Smoother Connections & Better Support
  Getting help is easier than ever with a new one-click Support Bundle generator! It packages your logs and crash reports ready to share on the forums or Discord, completely scrubbing out your personal details (like your Windows username or email) before saving. Behind the scenes, your Nexus Mods login now seamlessly renews in the background, and Vortex will retry its connection on its own instead of throwing scary error pop-ups if the server asks it to slow down.
  🐛 Spot a Bug? Let Us Know!
  We’ve done a lot of bug-squishing in this update, but if you happen to spot a wild one that managed to escape, please let us know! You can report any pesky issues over on GitHub (just remember to attach your Vortex log file so our dev team can figure out exactly what went wrong).
  Got a burning question, some general feedback, or just want to chat about the latest tweaks? Come hang out with us in the Vortex channel on the official Nexus Mods Discord.
  Finally, if you’re feeling exceptionally technical and want to read the raw, unedited list of every single GitHub pull request, you can browse the full, unfiltered changelog.
