ReleaseNotes: |-
  As the summer heat fades and autumn rolls in, it’s the absolute perfect excuse to grab a hot drink, stay indoors, and start a freshly modded playthrough. To keep your gaming sessions completely uninterrupted, we’ve packed Vortex 2.7 with a brilliant batch of highly requested improvements and customisation options.
  Here is a quick look at what’s new!
  🔄 Seamless Updates & Downloads
  Vortex updates are now significantly smaller and faster, downloading only the specific parts that have changed rather than the entire installer. The update process is much smarter too, and you'll no longer be offered older versions by mistake, and downgrading happens safely and intentionally.
  On the downloading front, if you upgrade to Premium while files are waiting, Vortex instantly recognises the change and automatically resumes everything. We’ve also fixed a frustrating bug where Collection installs would freeze at 99%, and ensured your in-progress downloads don't mysteriously vanish on startup.
  ✨ A Cleaner, Customisable Interface
  The Mods page has been given a sleek redesign, featuring a sticky header and toolbars you can actually customise: Simply pin your favourite actions and tuck the rest away! We’ve consolidated all your account options (profiles, logs, support) neatly under your avatar. And to everyone who asked (yes, we heard you!), we’ve moved the notification bell to the sidebar so it can no longer ambush your screen and block your view. Plus, the main Play button now tells you exactly what tool it’s about to launch in a handy tooltip, and you can pin up to ten of your go-to tools right next to it!
  🛠️ Smarter Checks & Rock-Solid Stability
  Under the hood, game extensions are now powered by our brand new backend API for a much smoother browsing experience. Health checks are friendlier for free users, linking you directly to the exact file you need, and we've added a handy new filter to easily find mods with multiple versions installed side by side (thanks to contributions by ChemBoy1611!). We’ve also squashed a bug that caused silent data loss in your mod lists, and fixed an issue where a single accented letter in a filename could break LOOT sorting for your entire load order. Finally, Linux users rejoice: the Steam overlay now works perfectly when launching games through Proton!
  🐛 Spot a Bug? Let Us Know!
  We’ve done a lot of bug-squishing in this update, but if you happen to spot a wild one that managed to escape, please let us know! You can report any pesky issues over on GitHub (just remember to attach your Vortex log file so our dev team can figure out exactly what went wrong).
  Got a burning question, some general feedback, or just want to chat about the latest tweaks? Come hang out with us in the Vortex channel on the official Nexus Mods Discord.
  Finally, if you’re feeling exceptionally technical and want to read the raw, unedited list of every single GitHub pull request, you can browse the full, unfiltered changelog.
