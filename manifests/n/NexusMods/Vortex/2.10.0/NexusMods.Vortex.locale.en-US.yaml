ReleaseNotes: |-
  As the nights draw in and the weather gets decidedly colder, there's no better time to hunker down with a hot drink and a freshly modded game. We’ve packed Vortex 2.10 with a brilliant batch of updates, including a massive beta test for a completely redesigned Mods table!
  Here is a quick look at what’s new.
  🎮 Your Installed Games, Front and Centre
  We are incredibly excited about this one as it’s easily one of the biggest features we’re shipping all year!
  When you head to the Games page, Vortex will now automatically detect and display the supported games you already have installed on your PC, complete with their store labels (Steam, GOG, Epic). The best part? It now shows them before you've even installed the support extensions for them. This takes all the faff out of getting started, bringing your games front-and-centre and making getting started modding smoother than it ever has been.
  🧪 Try the New Mods Table (Beta)
  We are thrilled to introduce a brand-new Mods table! You can easily toggle it on via the Mods toolbar to give it a spin (and switch back at any time if you prefer the classic look). This revamped layout lets you create custom views, choose your columns (like Version and Mod Size), the ability to hover on mod thumbnails to view details, pin your most used actions for quick access, group mods by Collection or category and a whole lot more for you to discover! Give it a try and let us know what you think using the feedback button on the toolbar!
  image
  ✨ 'Apply' Instead of 'Deploy'
  We've streamlined how Vortex talks about your files: 'Deploy' is out, and 'Apply' is in! You'll now see a shiny new Apply button right next to your Play button to handle any pending changes. Don't worry though, if you ever need to force an update manually, the trusty old toolbar button is still exactly where you left it (just renamed to 'Apply'). You can also easily toggle auto-apply on and off directly from the Mods toolbar. Over on the Games page, titles you own will now appear under 'detected games' complete with their store labels (Steam, GOG, Epic) even before you've installed support for them. Finally, games with multiple load orders now get neat, dedicated tabs for each!
  📦 Smoother Collections & Mod Updates
  Because Collections are built around very specific mod versions, updating those mods can sometimes break things. Vortex will now helpfully warn you before you update a mod that belongs to a Collection, and the "Update all" function can automatically skip them for you. We've also eliminated the stuttering when downloading and installing massive Collections, and brought back the 'Link Collection' button for our curators. Behind the scenes, deployments are significantly more reliable, and the External Changes dialogue will now keep your mod files safe by default.
  🐧 Future Support for Linux
  We still don't officially support Linux, but thanks to our amazing community contributors, the unofficial experience continues to get better! In this update, 'Download with Mod Manager' buttons on the website will now work seamlessly, mods with Windows-made installers (like those for Cyberpunk 2077) will install correctly, and Vortex can finally manage games installed on completely separate drives.
  🐛 Spot a Bug? Let Us Know!
  Spotted a wild bug that managed to escape?
  Report it on GitHub! Simply attach a support bundle so the team can see what went wrong. To make one, click your profile picture in the top right to open the user menu, then go to Help > Create support bundle. It packs your logs and state into a single archive ready to attach.
  For questions, feedback, or just a chat, join the Vortex channel on the official Nexus Mods Discord
  And if you want the raw, unedited list of every single technical tweak, check out the full full, unfiltered changelog.
