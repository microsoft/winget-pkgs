Description: 'BatteryHistoryView extracts and displays the battery history information stored in the SRUDB.dat database of Windows 10 and Windows 11. The battery history information is automatically collected by Windows operating systems and includes the following information: Timestamp, Cycle Count, Designed Capacity, Full Charged Capacity, Charge Level, Charge Percent, Active AC Time, CS AC Time, Active DC Time, CS DC Time, Active Discharge Time, and more..'
