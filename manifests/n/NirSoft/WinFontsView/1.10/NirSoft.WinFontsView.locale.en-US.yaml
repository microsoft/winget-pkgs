ShortDescription: WinFontsView is a small utility that enumerates all fonts installed on your system, and display them in one simple table.
Description: WinFontsView is a small utility that enumerates all fonts installed on your system, and displays them in one simple table. For each font, WinFontsView draws 5 samples of the font in different sizes, in order to allow you to easily find and choose the desired font that you need. WinFontsView also allows you to view the fonts as Bold, as Italic or with underline, as well as it allows you to export the fonts list into html file.
