ReleaseNotes: |-
  What's new
  - Sign in with Microsoft, on a new sign-in screen.
  - Add GitHub Copilot and Zed as coding-agent sources to bring their sessions into Nessie.
  - Use Nessie with your organization's own Nessie deployment.
  - YouTube, X and other embeds in contexts now play inline.

  Improved
  - Onboarding has a refreshed look.
  - The Skills page no longer lags while syncing.

  Fixed
  - Forked ChatGPT conversations now show the branch you were on, not the newest one.
  - Hermes sessions keep their full history after Hermes compacts them.
  - Nessie stays readable when Windows is in dark mode.
