ReleaseNotes: "This release adds support for NethHSM v5 and the `fido2 provision-credential` command, updates the minimum Python version to 3.11 and fixes some bugs.\r\n\r\nNote that the default branch for this repository is now `main`. The `master` branch will be deleted soon.\r\n\r\n## What's Changed\r\n• PIV factory-reset：show proper error message when the PIN isn't locked by @sosthene-nitrokey in https://github.com/Nitrokey/pynitrokey/pull/771\r\n• Windows versioninfo and version format by @mmerklinger in https://github.com/Nitrokey/pynitrokey/pull/774\r\n• pre-registration for entra by @AdityaMitra5102 in https://github.com/Nitrokey/pynitrokey/pull/783\r\n• nethsm generate-key：Fix interactive mechanism selection by @robin-nitrokey in https://github.com/Nitrokey/pynitrokey/pull/784\r\n• PIV import and PUK fixes by @ABuljko in https://github.com/Nitrokey/pynitrokey/pull/766\r\n• fido2：plug some resource leaks in the client by @kevans91 in https://github.com/Nitrokey/pynitrokey/pull/781\r\n• Add NetHSM features from Nethsm v3.0.0rc by @AdityaMitra5102 in https://github.com/Nitrokey/pynitrokey/pull/787\r\n• Entra provision by @AdityaMitra5102 in https://github.com/Nitrokey/pynitrokey/pull/789\r\n• Update clustering features for NetHSM v5.0 and release v0.13.0rc1 by @robin-nitrokey in https://github.com/Nitrokey/pynitrokey/pull/788\r\n• Release v0.13.0 by @robin-nitrokey in https://github.com/Nitrokey/pynitrokey/pull/793\r\n\r\n## New Contributors\r\n• @AdityaMitra5102 made their first contribution in https://github.com/Nitrokey/pynitrokey/pull/783\r\n• @ABuljko made their first contribution in https://github.com/Nitrokey/pynitrokey/pull/766\r\n• @kevans91 made their first contribution in https://github.com/Nitrokey/pynitrokey/pull/781\r\n\r\n**Full Changelog**：https://github.com/Nitrokey/pynitrokey/compare/v0.12.3...v0.13.0"
