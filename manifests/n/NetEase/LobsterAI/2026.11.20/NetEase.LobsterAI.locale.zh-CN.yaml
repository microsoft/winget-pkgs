ReleaseNotes: |-
  Highlights
  - 🎨 Guided PPT cover creation — a new step-by-step cover wizard, plus configurable homepage examples to get you started faster (#3072, #3129).
  - ⏪ Session navigation & prompt history — move back and forward between sessions and recall previous prompts with ease (#3107).
  - 🔍 Window zoom — zoom the main window in and out, with a clear on-screen indicator (#3106).
  🚀 New Features
  - PPT: Configurable homepage examples and a guided cover-creation flow (#3072) @btc69m979y-dotcom
  - PPT: Smoother home quick actions and wizard navigation (#3129) @fisherdaddy
  - Sessions: Back/forward navigation and prompt history recall (#3107) @fisherdaddy
  - Window: Main-window zoom with a zoom-level indicator (#3106) @fisherdaddy
  - Models: Server-configured custom tags in the model selector, with localization support (#3110, #3115) @Mind-Hand
  - Account menu: Server-configured "More" links (#3111) @Mind-Hand
  - Experts: Opt-in updates for installed presets — stay in control of when presets change (#3118) @btc69m979y-dotcom
  🐛 Bug Fixes
  Browser & Sessions
  - Scoped Chrome UA and CDP attach to avoid Cloudflare verification loops (#3095) @fisherdaddy
  - Kept in-app browser tabs alive and reclaimed idle background pages to reduce memory usage (#3100) @fisherdaddy
  - Restored saved execution mode and honored explicit sandbox policy (#3114) @fisherdaddy
  - Scoped dreaming status and diary to each agent, and surfaced diary load errors (#3105) @fisherdaddy
  - Ignored system-agent sessions to prevent stray local sessions (#3104) @fisherdaddy
  PPT & Home
  - Refined the example gallery and cover-creation layout (#3097) @btc69m979y-dotcom
  - Restored example-dialog clicks and clarified the audience input (#3119) @btc69m979y-dotcom
  - Collapsed image examples on the home page by default for a cleaner start (#3121) @fisherdaddy
  Desktop Companion & Window
  - Kept the companion orb docked correctly across multiple displays and Windows DPI settings (#3124) @fisherdaddy
  - Showed the hover menu on first use and in full-screen mode (#3116) @fisherdaddy
  - Deferred preload zoom to prevent the window's ready-to-show event from being dropped (#3126) @fisherdaddy
  Files & Artifacts
  - Supported more CSV encodings and in-app links on Windows (#3109) @fisherdaddy
  - Clarified file-edit progress and details (#3093) @fisherdaddy
  Platform
  - Extended the plugin archive-extraction timeout on every platform (#3102) @fisherdaddy
  - Skipped async provider-catalog builders when indexing max tokens, improving startup reliability (#3101) @fisherdaddy
  - Compacted skill catalogs and honored deliverable paths (#3113) @fisherdaddy
  🔒 Security
  - Restricted the localfile protocol to sandboxed local media (#3103) @fisherdaddy
  📚 Documentation
  - Split agent guidance by directory and synced contributing guides (#3108) @fisherdaddy
