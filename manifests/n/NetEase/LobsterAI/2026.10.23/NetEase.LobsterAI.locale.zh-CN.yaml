ReleaseNotes: |-
  This release brings image editing into your conversations, makes remote tools easier to connect, and gives you clearer visibility into usage. It also improves startup reliability, browser tasks, and account recovery.
  ✨ Highlights
  Edit images without leaving your conversation
  Annotate images with drawings, arrows, shapes, and text, or select an area and describe what you want to change. With a compatible image model, you can remove backgrounds, erase objects, and expand images to a new aspect ratio.
  Save annotated copies or send your edits to AI. Conversation snapshots preserve the source image, selections, and annotations so you can revisit your instructions.
  #2907
  Connect remote tools with less setup
  Install remote MCP connectors from the marketplace and connect through browser-based OAuth or guided credential forms. Supporting services can now be authorized without manually copying API keys.
  #2905 · #2909
  More options for custom models
  Custom providers now support OpenAI Responses and Gemini native APIs. Built-in model lists and default selections have also been refreshed, while compatibility with existing model configurations is preserved.
  #2897 · #2904
  Improvements
  - Show per-turn credit usage and model presets for conversations started through messaging channels and scheduled tasks. Personal accounts can open the corresponding usage details directly. #2903 · #2915
  - Add Help & Feedback for bug reports, feature suggestions, and AI content reports, with screenshot attachments and optional diagnostic logs. #2901 · #2926
  - Use the in-app browser by default, keeping browsing tasks inside LobsterAI. The external browser option remains available in Settings. #2913
  - Improve image and video generation progress indicators. Video confirmation now shows estimated credit costs when available and lets you refresh an expired confirmation while the request is retained. #2918 · #2924
  - Refresh Kits, Skills, and Connectors management pages, refine sidebar menu transitions, and improve typography across Settings. #2911 · #2920 · #2931
  - Add “Close Other Tabs” and “Close Tabs to the Right” to file previews. #2907
  - Add a “Confirm Before Quitting” setting. Document changes at risk of being lost still trigger a warning when this setting is off. #2931
  - Preserve supported custom OpenClaw overrides in openclaw.user.json across configuration syncs and restarts, with controls to enable, apply, and inspect their status. #2896
  Fixes
  - Prevent the AI engine from restarting again immediately after startup. #2932
  - Limit disk usage from runtime caches, repair backups, and old configuration snapshots. Background cleanup runs in batches and pauses on battery power. #2893 · #2931
  - Recover account data after an offline startup and show clearer account connection and model loading states. #2914 · #2923
  - Stop showing subscription trial popups to actively subscribed users and enterprise accounts. #2928
  - Improve browser recovery, background screenshots, and web fetching through proxy connections. #2922
  - Fix image preview flicker and crashes when selecting image regions. #2927
  - Restore online kit catalogs after temporary network failures. #2892
  - Improve MCP OAuth cleanup and authorization status refresh, and use system certificates for compatible Node.js-based MCP servers. #2908 · #2912
  - Fix desktop companion quick-answer model selection and wait for the AI engine before starting tasks. #2917 · #2919
  - Prevent companion orb clicks from unexpectedly activating the main window on macOS, and keep companion windows out of the Windows taskbar. #2930 · #2910
  - Fix Windows auto-launch queries when executable paths contain spaces. #2902
  - Allow managed workspaces to follow updated directory links. #2899
  Internal improvements
  - Remove the legacy OpenAI compatibility proxy and consolidate model request routing. #2898
  - Preserve tool payloads in conversation transcripts for faithful cache replay. #2929
  - Make repair cleanup tests independent of the system clock. #2900
  Contributors
  Thanks to @fisherdaddy, @btc69m979y-dotcom, and @Mind-Hand for their contributions, and to everyone who shared feedback and reported issues.
  Full Changelog: 2026.10.16 → 2026.10.23
