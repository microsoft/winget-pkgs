ReleaseNotes: |-
  What's Changed
  This release moves the agent engine from OpenClaw to DeepSeek Harness (DSH) — 106 PRs, the largest architectural migration in LobsterAI's history. Sessions, experts, memory, IM channels, media generation, office editing and plugins were all rebuilt on the new engine, closing every capability gap left by the old one.
  ✨ Highlights
  - New engine, same app — DSH is now the default runtime, with native desktop integration across sessions, tooling and packaging (#3239)
  - Agents that work together — cross-agent collaboration and specialist delegation let the main agent hand off subtasks to dedicated specialists (#3137)
  - Every IM channel back online — POPO added; WeCom, Weixin, Feishu, DingTalk, QQ, Telegram and Discord all restored with group-chat routing (#3160, #3232)
  - Plugin ecosystem — marketplace, version checks, hot updates and an embedded plugin shell (#3202, #3207)
  - Instant launch — the main UI no longer waits on engine boot; cold start is substantially faster (#3157, #3213)
  ⚠️ Breaking Changes & Upgrade Notes
  - The agent engine is now DSH. Existing sessions, agents, experts, memory, IM bindings and settings migrate automatically on first launch — back up your workspace before upgrading.
  - The legacy web-search server is retired in favor of native web_search routing. Any custom configuration pointing at the old server must be updated (#3155).
  - Experimental DSH flags and dead IPC channels are removed; config files relying on them no longer take effect (#3224).
  - Bundled skills are mounted read-only. To customize one, copy it into your user skills directory (#3236).
  - Fresh installations now require sign-in, and Full Access permissions require explicit confirmation (#3212, #3165).
  - Backup and migration were rebuilt; older backup archives must go through the new migration flow (#3190).
