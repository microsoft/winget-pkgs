ShortDescription: Cross-platform UI automation IDE for games and apps, built on Airtest and Poco.
Description: |-
  AirtestIDE is an out of the box GUI tool that helps to create and run UI automation cases in a user-friendly way. It supports a complete automation workflow: create, run, report.

  - Write once, run anywhere: cross-platform APIs (app installation, simulated input, assertions) with image recognition to locate UI elements, so games and apps can be automated without injecting any code
  - Poco: direct access to the UI widget hierarchy across the major platforms and game engines, scripted in Python
  - Android, iOS, Windows applications and web (Selenium plugin)
  - HTML reports with detailed info and screen recording; cases can run on device farms from the command line or the Python API
