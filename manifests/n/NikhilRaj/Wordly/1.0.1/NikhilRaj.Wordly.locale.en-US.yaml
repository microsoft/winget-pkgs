ShortDescription: One word. One day. One terminal.
Description: Wordly is a daily, six-attempt word game for the command line. Everyone receives the same puzzle for the UTC calendar day. Accepted guesses, unfinished progress, and statistics are saved locally for the current operating-system user—there is no account, network service, or telemetry.

