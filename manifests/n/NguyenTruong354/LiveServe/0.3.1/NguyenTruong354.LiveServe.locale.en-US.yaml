License: MIT
LicenseUrl: https://github.com/NguyenTruong354/live-serve/blob/main/LICENSE
ShortDescription: A tiny live-reload dev server. One ~1 MB binary, no Node.js.
Description: |-
  live-serve serves a folder and reloads open pages when files change; saving only CSS swaps the stylesheets in place.
  It lists folders without an index.html, supports single-page apps (--spa) and HTTP Range,
  refuses requests from other websites, and hides dotfiles by default.
  `live-serve init vscode` or `live-serve init zed` adds an editor task to start it.
Moniker: live-serve
