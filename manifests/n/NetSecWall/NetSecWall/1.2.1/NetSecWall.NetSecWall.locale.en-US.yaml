ShortDescription: See which programs on your PC connect to the internet, where to, and block the ones you choose.
Description: |-
  NetSecWall is a per-application network monitor and firewall for Windows 10 and 11.
  It lists every program with a connection open, the address and country on the other
  end and how much is going each way, keeps a searchable history, flags known-bad
  addresses from threat feeds, and blocks programs, addresses, countries or whole
  categories of sites through Windows Firewall. Traffic data stays on the PC.
  Subscription with a 7-day free trial; no account or card is needed to try it.
