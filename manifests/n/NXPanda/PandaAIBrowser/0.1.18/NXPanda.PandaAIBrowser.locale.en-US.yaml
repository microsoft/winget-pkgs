PackageIdentifier: NXPanda.PandaAIBrowser
PackageVersion: 0.1.18
PackageLocale: en-US
Publisher: Panda
PublisherUrl: https://nxpanda.com/
PrivacyUrl: https://nxpanda.com/products/panda-ai-browser/privacy/
PackageName: Panda AI Browser
PackageUrl: https://nxpanda.com/products/panda-ai-browser/
License: Freeware
ShortDescription: Lets an MCP client (Claude Code, Cursor, Codex, Gemini CLI...) see and control your own browser.
Description: |-
  Panda AI Browser is the local app behind the Panda AI Browser extension (Chrome Web Store).
  It lets an AI agent you already use — Claude Code, Cursor, Codex, Gemini CLI or any other MCP
  client — work in your own Chromium-based browser: read pages, click, type, fill forms, take screenshots and handle
  downloads and uploads, in the tabs and signed-in sessions you already have.
  Panda contains no AI: it is only the bridge between your agent and your browser. It runs on this computer
  (127.0.0.1); the optional "Remote" mode is off by default. Installs per user, without administrator rights.
Moniker: panda-ai-browser
