# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json
PackageIdentifier: NijG.BananaConn
PackageVersion: 0.7.32
PackageLocale: ko-KR
ShortDescription: 네트워크·서버 운영자를 위한 안전한 원격 작업 도구 (SSH, Telnet, 시리얼, SFTP, FTP/FTPS, TFTP, RDP, VNC)
Description: |-
  터미널, 파일 전송, 원격 데스크톱을 탭과 분할 화면으로 한 창에서 씁니다. 스니펫·매크로로 보내는 시간 변경 명령은 막고
  reload, write erase, rm -rf 같은 위험 명령은 확인을 받습니다. Cisco, Juniper, Huawei, FortiGate, Aruba, 리눅스, AIX, HP-UX, Solaris 장비를
  알아보고 감시와 설정 백업을 제공하며, TFTP·FTP·HTTP 서버를 내장하고 SecureCRT, PuTTY, Xshell 등에서 세션을 가져옵니다.
ManifestType: locale
ManifestVersion: 1.12.0
