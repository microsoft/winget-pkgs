ShortDescription: Safe all-in-one remote workspace for network and server operators (SSH, Telnet, Serial, SFTP, FTP/FTPS, TFTP, RDP, VNC).
Description: |-
  BananaConn. puts terminals, file transfer and remote desktops side by side in tabs and split panes.
  Snippets and macros never change the clock and ask before risky commands (reload, write erase, rm -rf); it recognises
  Cisco, Juniper, Huawei, FortiGate, Aruba, Linux, AIX, HP-UX and Solaris devices for monitoring and config backups,
  includes TFTP/FTP/HTTP servers, imports sessions from SecureCRT, PuTTY, Xshell, mRemoteNG and more, keeps
  passwords in the Windows Credential Manager and updates itself with signed releases.
