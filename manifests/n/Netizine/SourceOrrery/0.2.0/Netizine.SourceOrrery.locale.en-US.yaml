PackageVersion: 0.2.0
PackageLocale: en-US
Publisher: Netizine
PublisherUrl: https://github.com/Netizine
PublisherSupportUrl: https://github.com/Netizine/sourceorrery/issues
PackageName: SourceOrrery
PackageUrl: https://sourceorrery.ai
License: MIT OR Apache-2.0
LicenseUrl: https://github.com/Netizine/sourceorrery/blob/v0.2.0/LICENSE-MIT
ShortDescription: Encrypted local secrets vault with a cloud-secrets-manager-style lifecycle API
Description: |-
  SourceOrrery keeps development secrets in an encrypted local vault
  and hands them to applications through a CLI and read-only SDKs, so
  no .env file holds a value. The CLI creates vaults and stores secrets;
  the SDKs for Python, JavaScript, Rust, Java, .NET, Go, C, C++ and PHP
  only read them.
Moniker: sourceorrery
Tags:
