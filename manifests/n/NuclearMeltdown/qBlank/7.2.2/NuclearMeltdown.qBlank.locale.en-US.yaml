ShortDescription: Low-latency viewer and recorder for capture cards, screens and windows on Windows.
Description: |-
  qBlank is a lightweight program for gaming through a capture card, with any console, and for recording the screen or a single window.
  It shows the picture with as little delay as it can add, and records, takes screenshots, keeps a replay buffer and offers a virtual camera.
  For analogue sources it adds automatic video standard detection, composite filters, deinterlacing and scanlines.
