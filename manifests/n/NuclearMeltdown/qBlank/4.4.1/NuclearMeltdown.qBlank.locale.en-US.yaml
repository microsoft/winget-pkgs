ShortDescription: A low-latency viewer and recorder for DirectShow capture cards on Windows.
Description: |-
  qBlank displays the output of a capture card with as little delay as the hardware allows, so the captured signal can be played on rather than only watched.
  Recording, screenshots, a microphone track and a virtual camera are included; scenes, overlays, compositing and streaming are not.
