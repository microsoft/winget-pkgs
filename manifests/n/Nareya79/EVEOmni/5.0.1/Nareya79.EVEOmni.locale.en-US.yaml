ShortDescription: Free, open-source desktop companion for EVE Online.
Description: |-
  EVE Omni is a free, open-source desktop companion for the space game EVE Online.
  Multi-client preview with Tab switching (one key = one window, no input is sent to the game),
  in-game overlays, trading and hauling with net profit, mining calculator, local chat checker with fleet alert,
  star map navigation, industry, planetary production and skills. Official EVE SSO login only, all data stays on your PC.
  Fan project, not affiliated with CCP hf.
