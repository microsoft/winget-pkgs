PackageIdentifier: Nebur692.MeshCentralClient
PackageVersion: 0.14.0
PackageLocale: es-ES
Publisher: Nebur692
PackageName: MeshCentral Windows Client
License: Apache-2.0
ShortDescription: Una app nativa de Windows para técnicos, para cualquier servidor MeshCentral.
Description: |-
  MeshCentral Windows Client entra en cualquier servidor MeshCentral (contraseña, doble factor o inicio de sesión único) y hace lo mismo que la web de MeshCentral y MeshCentral Router, sin navegador: escritorio remoto con portapapeles y copia de ficheros, terminal, ficheros, ficha y acciones del equipo, grupos de equipos, usuarios y sucesos del servidor, redirección de puertos, Escritorio remoto de Windows y SSH a través del agente.
  Se instala solo para la cuenta de Windows actual y se actualiza sola.
ReleaseNotesUrl: https://github.com/Nebur692/meshcentral-windows-client/releases/tag/v0.14.0
