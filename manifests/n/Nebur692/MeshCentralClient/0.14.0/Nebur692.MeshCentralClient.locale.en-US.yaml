ShortDescription: A native Windows app for technicians, for any MeshCentral server.
Description: |-
  MeshCentral Windows Client signs in to any MeshCentral server (password, two-factor or single sign-on) and does what the MeshCentral website and MeshCentral Router do, without a browser: remote desktop with clipboard and file copy, terminal, files, device details and actions, device groups, users and server events, port mapping, Windows Remote Desktop and SSH through the agent.
  It installs for the current Windows account only and updates itself.
