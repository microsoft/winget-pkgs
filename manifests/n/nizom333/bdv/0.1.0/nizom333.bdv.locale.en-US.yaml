ShortDescription: Fast terminal UI viewer for the beads (bd) issue tracker
Description: |-
  bdv shows a beads project in two panes: an issue tree with collapsible priority groups and a Markdown detail card with links, comments and blockers.
  It adds search, a ready filter for blocked work, and tabs for specs, decisions, memories and formulas.
  It reads through the bd CLI with --readonly and needs bd (beads) in PATH.
