ShortDescription: Backups and change alerts for pfSense firewalls, from the command line.
Description: |-
  pfSentinel backs up the configuration of pfSense firewalls over SSH or HTTPS.
  It detects what changed between two backups, alerts on risky changes, can
  encrypt every backup, and schedules backups with Windows Task Scheduler.
  The command is pfs. No telemetry.
