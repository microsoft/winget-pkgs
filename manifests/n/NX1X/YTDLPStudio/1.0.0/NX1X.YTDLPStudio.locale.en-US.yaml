ShortDescription: Free, open-source desktop app for yt-dlp. Download video and audio from YouTube and many more sites.
Description: |-
  YT-DLP Studio is a desktop app for yt-dlp. Paste a link, pick the quality and download video or audio without the command line.
  It downloads from YouTube, Instagram, TikTok, Facebook, X and the other sites that yt-dlp supports, including photo posts from Instagram and X.
  It has a download queue that survives a restart, playlists, subtitles, a download history, and English and Hebrew interfaces.
  FFmpeg and Deno are bundled. The app installs per user, needs no admin rights and updates itself in place.
