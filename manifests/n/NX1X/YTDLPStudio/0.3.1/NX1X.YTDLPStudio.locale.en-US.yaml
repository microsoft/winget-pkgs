ShortDescription: A desktop GUI for yt-dlp. Download videos and audio from YouTube and 1000+ sites.
Description: |-
  YT-DLP Studio is a desktop app for yt-dlp. Paste a link, pick the quality and download video or audio without the command line.
  It has a download queue that survives a restart, a download history, notifications, and English and Hebrew interfaces.
  FFmpeg and Deno are bundled. The app installs per user, needs no admin rights and updates itself in place. Linux packages (.deb, .rpm, AppImage) are on the GitHub releases page.
