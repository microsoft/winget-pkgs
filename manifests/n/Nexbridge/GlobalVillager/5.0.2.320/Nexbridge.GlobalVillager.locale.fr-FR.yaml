Description: 'Explorez les réseaux internationaux : connectez d’abord GVVPN. Un tunnel chiffré vers la région choisie
  ajoute une protection à la navigation et aux connexions Wi-Fi publiques.


  Choisissez UDP ou TCP, puis le routage intelligent ou global. Un changement de protocole, de mode ou de région
  déclenche la reconnexion et le retour à l’écran de connexion. Consultez la durée de connexion. L’interface suit
  la langue du système ou l’une des17 langues proposées.


  Un compte prend en charge jusqu’à trois appareils. Gérez votre abonnement, vos commandes et votre adhésion dans
  l’application. Le service payant exige une offre active ; prix et conditions figurent sur la page de confirmation.
  Débit et disponibilité des sites dépendent du réseau, de l’appareil et du trajet.


  Ce téléchargement concerne Windows x64. Les visuels de marque illustrent l’usage sur plusieurs appareils ; les
  mobiles utilisent leur client correspondant. Assistance : globalvillager@worldcitizenvpn.com.'
