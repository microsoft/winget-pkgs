Description: '探索國際網路，先連 GVVPN。透過加密通道連至所選地區，為日常瀏覽和公共 Wi-Fi 連線增加一層保護。


  支援多地區線路、UDP 與 TCP，以及智慧分流和全局模式。切換協議、模式或節點後自動重新連線並返回連線頁，已連線狀態顯示連線時長。介面預設跟隨系統語言，也可在設定中選擇17種語言。


  一個帳號最多支援三台裝置。在 App 內查看會員狀態、訂單及訂閱套餐。使用付費服務需要有效套餐，價格與條件以 App 內確認頁為準。實際速度和網站可用性取決於網路、裝置及線路情況。


  此下載為 Windows x64 客戶端。品牌宣傳圖展示跨裝置使用情境，手機端使用對應客戶端。支援：globalvillager@worldcitizenvpn.com。'
