Description: 'Explore redes internacionais: conecte primeiro o GVVPN. Um túnel criptografado até a região escolhida
  adiciona proteção à navegação e ao uso de Wi-Fi público.


  Escolha UDP ou TCP e roteamento Inteligente ou Global. Mudar protocolo, modo ou região reconecta automaticamente
  e volta à página de conexão. Veja a duração da conexão. A interface acompanha o idioma do sistema ou um dos17
  idiomas disponíveis.


  Uma conta aceita até três dispositivos. Gerencie assinatura, pedidos e associação dentro do aplicativo. O serviço
  pago exige um plano ativo; preços e condições aparecem na confirmação. A velocidade e a disponibilidade de sites
  dependem da rede, do dispositivo e da rota.


  Este download é o cliente Windows x64. As imagens da marca ilustram uso em vários dispositivos; celulares usam
  seus respectivos clientes. Suporte: globalvillager@worldcitizenvpn.com.'
