Description: 'Перед знакомством с международными сетями подключите GVVPN. Зашифрованный туннель к выбранному региону
  добавляет защиту при просмотре сайтов и использовании общественного Wi-Fi.


  Выбирайте UDP илиTCP и умную либо глобальную маршрутизацию. Смена протокола, режима или региона автоматически
  переподключает VPN и возвращает на страницу соединения. Отображается длительность подключения. Интерфейс следует
  языку системы или одному из 17 выбранных языков.


  Одна учётная запись поддерживает до трёх устройств. Управляйте подпиской, заказами и статусом в приложении. Для
  платного обслуживания нужен активный тариф; цены и условия указаны на странице подтверждения. Скорость и доступность
  сайтов зависят от сети, устройства и маршрута.


  Этот клиент предназначен для Windows x64. Рекламные изображения показывают использование на разных устройствах;
  для мобильных устройств нужны соответствующие клиенты. Поддержка: globalvillager@worldcitizenvpn.com.'
