Description: 'Explora redes internacionales: conecta primero GVVPN. Elige una región y utiliza un túnel cifrado
  para añadir protección al navegar y usar redes Wi-Fi públicas.


  Elige UDP o TCP y enrutamiento inteligente o global. Cambiar protocolo, modo o región vuelve a conectar automáticamente
  y regresa a la pantalla de conexión. Consulta la duración de conexión. La interfaz sigue el idioma del sistema
  o uno de17 idiomas seleccionables.


  Una cuenta admite hasta tres dispositivos. Gestiona membresía, pedidos y suscripciones dentro de la aplicación.
  El servicio de pago requiere un plan activo; los precios y condiciones aparecen en la confirmación. La velocidad
  y disponibilidad de sitios dependen de la red, el dispositivo y la ruta.


  Esta descarga es el cliente Windows x64. Las imágenes de marca muestran usos en varios dispositivos; los móviles
  usan sus clientes correspondientes. Soporte: globalvillager@worldcitizenvpn.com.'
