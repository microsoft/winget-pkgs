Description: 'Uluslararası ağları keşfetmeden önce GVVPN''e bağlanın. Seçtiğiniz bölgeye şifreli tünel, gezinirken
  ve halka açık Wi-Fi kullanırken ek koruma sağlar.


  UDP veyaTCP ile Akıllı ya da Genel yönlendirmeyi seçin. Protokol, mod veya bölgeyi değiştirmek otomatik olarak
  yeniden bağlanır ve bağlantı sayfasına döner. Bağlantı süresini görüntüleyin. Sistem dilini izleyin veya17 arayüz
  dilinden birini seçin.


  Bir hesap en fazla üç cihazı destekler. Üyelik, sipariş ve aboneliği uygulama içinde yönetin. Ücretli hizmet için
  etkin paket gerekir; fiyat ve koşullar onay sayfasındadır. Hız ve web sitesi erişimi ağa, cihaza ve güzergâha
  bağlıdır.


  Bu indirme Windows x64 istemcisidir. Marka görselleri farklı cihazlarda kullanımı gösterir; mobil cihazlar ilgili
  istemcilerini kullanır. Destek: globalvillager@worldcitizenvpn.com.'
