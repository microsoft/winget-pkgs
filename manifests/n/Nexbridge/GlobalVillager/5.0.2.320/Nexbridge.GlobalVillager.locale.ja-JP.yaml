Description: '国際ネットワークを探索する前に、まずGVVPNへ接続。選択した地域への暗号化トンネルで、日常のブラウジングや公衆Wi-Fi接続に保護を追加します。


  UDP・TCP、スマート・グローバルルーティングを選択できます。プロトコル、モード、地域を変更すると自動再接続して接続画面に戻ります。接続中は接続時間を表示します。システム言語への追従、または17言語からの選択に対応します。


  1アカウントで最大3台に対応。会員情報、注文、サブスクリプションをアプリ内で管理できます。有料サービスには有効なプランが必要です。料金と条件は確認画面をご覧ください。速度やサイトの利用可否はネットワーク、端末、経路に左右されます。


  このダウンロードはWindows x64用です。ブランド画像は複数端末での利用イメージです。モバイル端末には対応クライアントをご利用ください。サポート：globalvillager@worldcitizenvpn.com。'
