Description: '探索国际网络，先连 GVVPN。通过加密隧道连接所选地区，为日常浏览和公共 Wi-Fi 连接增加一层保护。


  支持多地区线路、UDP 与 TCP，以及智能分流和全局模式。切换协议、模式或节点后自动重新连接并返回连接页，已连接状态显示连接时长。界面默认跟随系统语言，也可在设置中选择17种语言。


  一个账号最多支持三台设备。在 App 内查看会员状态、订单及订阅套餐。使用付费服务需要有效套餐，价格与条件以 App 内确认页为准。实际速度和网站可用性取决于网络、设备及线路情况。


  此下载为 Windows x64 客户端。品牌宣传图展示跨设备使用情境，手机端使用对应客户端。支持：globalvillager@worldcitizenvpn.com。'
