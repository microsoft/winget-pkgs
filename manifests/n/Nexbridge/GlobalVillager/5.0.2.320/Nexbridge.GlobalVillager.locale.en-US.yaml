Description: 'Explore international networks: connect GVVPN first. Connect through an encrypted tunnel to your chosen
  region, adding protection to everyday browsing and public Wi-Fi connections.


  Choose multiple regions, UDP or TCP, and Smart or Global routing. Changing protocol, mode or region automatically
  reconnects and returns to the connection page. View connection duration while connected. Follow the system language
  or select from 17 interface languages in Settings.


  One account supports up to three devices. Manage membership, orders and subscription options inside the app. Paid
  service requires an active plan; prices and terms appear on the in-app confirmation page. Speed and website availability
  depend on network conditions, devices and server routes.


  This download is the Windows x64 client. Brand advertisements illustrate cross-device use; mobile devices use
  their corresponding clients. Support: globalvillager@worldcitizenvpn.com.'
