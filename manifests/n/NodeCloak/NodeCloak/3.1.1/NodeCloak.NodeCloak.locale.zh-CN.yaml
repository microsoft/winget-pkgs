ShortDescription: 独立浏览器副本管理工具。
Description: NodeCloak 在 Windows 和 macOS 上管理独立的 Chrome、Edge、Firefox 配置。每个副本可以单独设置代理、语言和网站权限，也可以从指定项目目录启动 Claude Code、Codex CLI（ChatGPT）和 Gemini CLI。
