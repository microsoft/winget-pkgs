  - Updated: The installer now includes the version 16.2.3 CRX files for the Chrome and Edge extensions
  - Fixed: Corrected typos and errors in the API help
  - Fixed: TLS details now correctly classify ciphers and key exchange algorithms, recognize GCM and ChaCha20-Poly1305 as AEAD, classify TLS 1.1 as medium strength, and leave unknown values unassessed
