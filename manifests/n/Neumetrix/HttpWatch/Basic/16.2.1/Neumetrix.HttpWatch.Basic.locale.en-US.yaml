ReleaseNotes: |-
  - New: HttpWatch Studio and Chrome/Edge windows have new distinctive icons, with a red dot or empty circle showing whether the browser HttpWatch window is recording or stopped
  - New: Redesigned Windows Explorer icons for HWL and HAR files
  - New: Taskbar previews for Chrome and Edge now provide Record, Clear, Stop and Save buttons
  - New: The HttpWatch Studio taskbar menu now has an option to open a HWL or HAR log file
  - Improved: Live request and page timings are now derived solely from Chromium event timestamps
  - Improved: Tooltips now explain more Chromium network errors, including blocked requests, timeouts, connection resets, DNS failures and certificate errors
  - Improved: Setup and the uninstaller now return specific exit codes for identifiable failures. Silent installs fail with exit code 32 when files are in use instead of scheduling changes for the next reboot. Automated scripts should use that code instead of checking for httpwatch_reboot.txt
  - Fixed: HTML response fragments could be incorrectly displayed as XML in the Content pane
  - Fixed: Setup could report an in use error when writing the HttpWatch Studio Start Menu shortcut
