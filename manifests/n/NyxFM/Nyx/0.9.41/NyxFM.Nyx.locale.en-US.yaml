ShortDescription: Free music player with word-by-word lyrics, themes and Listen Together.
Description: |-
  Nyx is a free music player for Windows, macOS, Linux, Android, iPhone and the web.
  Your likes, playlists and followed artists belong to your Nyx account rather than to one streaming service,
  and music files from your computer play in the same library. Lyrics are synced word by word,
  and colors, fonts, icons, backgrounds and layout can all be changed or installed as themes.
  Also included: Listen Together, stations and mixes, a 10-band equalizer, podcasts,
  Last.fm and ListenBrainz scrobbling, Discord status and stats.
