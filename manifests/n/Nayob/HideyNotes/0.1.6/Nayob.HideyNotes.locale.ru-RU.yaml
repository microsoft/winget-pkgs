PackageIdentifier: Nayob.HideyNotes
PackageVersion: 0.1.6
PackageLocale: ru-RU
Publisher: Nayob
PackageName: HideyNotes
License: MIT
ShortDescription: Выдвижная панель с заметками у края экрана
Description: |-
  HideyNotes — блокнот, который не мешает: маленький язычок у края экрана открывает панель
  со всеми заметками, а когда панель теряет фокус, она прячется сама.

  Заметки — обычные .txt-файлы, которые сохраняются по ходу набора: неограниченные вкладки,
  поиск по текущей заметке или по всем сразу, история закрытых вкладок и корзина на 30 дней,
  тёмная и светлая темы, поддержка разных мониторов и разного масштаба, выбор правого или
  левого края экрана.
