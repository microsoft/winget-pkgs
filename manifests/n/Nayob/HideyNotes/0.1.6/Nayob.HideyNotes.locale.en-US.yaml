ShortDescription: A slide-out notepad that lives at the edge of the screen
Description: |-
  HideyNotes is a notepad that stays out of the way: a small tab at the edge of the screen
  opens a panel with all your notes, and the panel hides itself as soon as it loses focus.

  Notes are plain .txt files saved as you type, with unlimited tabs, search in the current
  note or across all tabs, a history of closed tabs and a trash kept for 30 days, dark and
  light themes, per-monitor DPI support, and a choice of the left or the right screen edge.
