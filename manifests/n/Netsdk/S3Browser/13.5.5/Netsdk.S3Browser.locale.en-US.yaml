ReleaseNotes: |-
  - S3 Browser has been renamed to CS Browser
  - New DPI-aware UI with improved High-DPI support
  - Object Lock can now be enabled for existing buckets
  - Added SSO support for Amazon S3 GovCloud accounts
  - Added CLI support for sync exclusion rules from file
  - Improved Parquet viewer compatibility
  - Improved Folder Sync Tool Analyze phase reliability
  - Improved support for S3-compatible storage providers
  - Fixed duplicate password prompt and S3 path display issues
  - Various UI improvements and internal stability fixes
