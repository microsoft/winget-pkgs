  - Improved Folder Sync comparison accuracy, selection statistics, and bulk deletion
  - Added summary analysis output for CLI sync commands
  - Added zoom and panning to image preview
  - Color themes can now be changed without restarting
  - Faster application startup
  - Added option to finish current tasks before exiting
  - Improved task queue saving and restoration, and transfer cancellation
