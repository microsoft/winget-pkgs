ShortDescription: 按下快捷键即可快速搜索并启动应用的 Windows 轻量启动器，支持拼音搜索。
Description: Kite 是一款面向 Windows 的轻量应用启动器，使用 Rust 和 Iced 构建原生桌面应用，无需 WebView2 或 Node.js。通过全局快捷键唤起搜索窗口，输入应用名称、别名或拼音即可快速筛选并启动目标程序；支持扫描开始菜单、桌面、注册表 App Paths 和 Windows 打包应用，提供启动历史、固定结果、系统托盘以及可选的 Everything 文件搜索。
Tags:
- 启动器
- 快速启动
ReleaseNotes: |-
  Kite v0.6.1
  版本重点
  文件搜索统一使用 Kite 内置索引，移除旧 Everything 后端及随包 SDK。默认关闭、列表中启用、首次管理员确认、重建索引、排除文件夹和实时同步的使用方式保持不变。
  清理与修正
  - 删除 Everything SDK 的加载、IPC 查询、安装/运行状态探测，以及下载或启动 Everything 的旧提示。
  - 文件类型筛选独立于旧后端，保留全部类别与原有扩展名规则。应用搜索、文件直接打开、目录直达和结果操作保持原有语义。
  - 系统恢复与性能基线移除旧后端专属路径，保留睡眠恢复、Explorer 恢复、热键、显示器与应用索引等有效场景。
  - 安装包不再携带 Everything64.dll 和仅对应该 SDK 的许可文件。覆盖安装清理旧版随包部署的这两个固定文件，独立安装的 Everything 应用和服务保持原状。
  - 资源目录定位使用当前实际资源，窗口音效与官方插件继续正常分发；更新当前使用说明和架构文档，历史发布说明与测量记录保留。
  升级影响
  - 从 v0.6.0 升级保留已有内置文件索引、排除目录、应用设置、Alias、固定项与启动历史；无需因移除旧后端重建索引。
  - 移除旧 SDK 收敛的是分发和维护面；低常驻内存来自内置索引的共享、压缩与按需读取。本版不调整文件查询算法，不另行宣称搜索提速或常驻内存下降。
  - v0.6.0 的既有标签和安装包保留，本次以独立补丁版本发布。
  验证与限制
  - 本地现有全套 Rust 检查 607 项通过、10 项忽略，官方插件 14 项检查通过；移除了旧后端专属检查，四种原生系统恢复场景继续保留。Release、NSIS 安装包构建及既有升级静态契约检查通过，独立代码审核无阻断。GitHub CI、Release 构建、安装包大小和 SHA-256 由下方自动构建报告列出。
  - 隔离 Debug 窗口实际验证了内置启用入口、全部七类筛选、绝对路径的打开/所在位置操作、文件搜索设置与确认页，以及三个官方插件的资源可见性；进程模块清单未加载旧 SDK。音效资源定位正常，未核验听感。自建验证进程已退出，未启用读取服务或触发 UAC。
  - 原有文件搜索测量口径见验证摘要。文件搜索启用状态下的覆盖升级、卸载与拒绝 UAC 分支仍未实机验收；本次不操作用户正在使用的安装版。
  - 安装包未做 Authenticode 数字签名。
