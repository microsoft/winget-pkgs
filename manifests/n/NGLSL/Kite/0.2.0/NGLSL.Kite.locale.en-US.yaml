PackageIdentifier: NGLSL.Kite
PackageVersion: 0.2.0
PackageLocale: en-US
ShortDescription: A lightweight Windows launcher that searches and starts apps with a hotkey, including pinyin search.
Description: Kite is a lightweight application launcher for Windows, built as a native desktop app with Rust and Iced — no WebView2 or Node.js required. A global hotkey brings up a search window where typing an app name, alias, or pinyin quickly filters and launches the target. It scans the Start Menu, desktop, registry App Paths, and Windows packaged apps, and offers launch history, pinned results, a system tray, and optional Everything file search.
