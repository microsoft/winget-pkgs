ShortDescription: Continuous network monitoring that tells you where problems start - Wi-Fi, router, ISP, computer, or app.
Description: |-
  NetworkTests Monitor watches your connection every second - your router, your
  ISP's first hop, and five independent internet anchors - plus Wi-Fi signal,
  DNS, your machine's CPU/memory, and the applications you choose (with
  DNS/TCP/TLS/server-wait timing breakdowns). When something breaks it tells
  you in plain English where the problem started. Includes hop-by-hop path
  tracing, speed tests with bufferbloat detection, aggregated smart alerts,
  and exportable PDF evidence reports. A Troubleshoot page explains why a
  specific website or app isn't working. Your monitoring history stays on
  your computer; no account required. Free for personal use.
