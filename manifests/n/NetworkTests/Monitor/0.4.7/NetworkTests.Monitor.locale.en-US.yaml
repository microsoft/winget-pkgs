ShortDescription: Continuous network monitoring that tells you where problems start - Wi-Fi, router, ISP, computer, or app.
Description: |-
  NetworkTests Monitor watches your connection continuously - your router and
  three independent internet anchors (Google, Cloudflare and Quad9) every
  second, and the path through your ISP every minute - plus Wi-Fi signal, DNS,
  CPU/memory and the applications you choose, with DNS/TCP/TLS timing
  breakdowns against learned baselines. When something breaks it says so in
  plain English, for example: "Your home network is healthy, but your ISP is
  experiencing congestion." Internet packet loss counts only when all three
  anchors lose packets, so one busy server can't fake an outage. Also: call
  quality (UDP loss and jitter), a website troubleshooter with checks from four
  regions, hop-by-hop path history, speed tests with bufferbloat detection,
  smart alerts and PDF evidence reports. Free for personal use. No account;
  all monitoring history stays on your machine.
