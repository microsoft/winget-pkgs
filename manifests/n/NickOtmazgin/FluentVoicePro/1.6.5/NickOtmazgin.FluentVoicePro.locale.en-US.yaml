ShortDescription: Tray text-to-speech reader for Windows with natural online and offline HD voices.
Description: |-
  FluentVoice Pro reads selected or copied text aloud from the Windows tray with a hotkey.
  It offers Microsoft online HD voices, offline HD voices that run on your PC (Piper and Kokoro,
  downloaded on demand and verified by SHA-256), and the built-in Windows voices, with a privacy
  mode that never sends text online.
