ReleaseNotes: |-
  This release is functionally identical to v1.5.2, but the Windows builds are now signed! I have been granted access to a free signing certificate courtesy of the SignPath Foundation, so this and all future Windows releases will be properly signed just like the macOS builds are. This should hopefully put an end to Defender flagging NUSGet as malware and trying to delete it off your computer.
  Note: If you're early to this release, SmartScreen may still flag it as being an unknown app. Once people start to run it and tell SmartScreen that it's okay, it should hopefully learn to trust the app and its certificate, and this won't be an issue anymore going forwards.
  Changelog
  - Windows builds now signed to make Defender freak out less.
  Translations
  NUSGet is available in the following language:
  - English
  - French (@rougets)
  - German (@yeah-its-gloria)
  - Italian (@LNLenost)
  - Korean (@DDinghoya)
  - Norwegian (@DandelionSprout, @rolfiee)
  - Romanian (@NotImplementedLife)
  - Spanish (@DarkMatterCore)
  By default, titles are downloaded to the NUSGet Downloads folder, which is created in your local downloads folder. You can open this by pressing the folder icon next to the download button! (You can also set your own download folder, if you'd prefer.)
  NUSGet is powered by libWiiPy and libTWLPy.
