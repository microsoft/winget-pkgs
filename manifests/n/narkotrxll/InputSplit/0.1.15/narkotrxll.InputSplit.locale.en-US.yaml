ShortDescription: Play on the TV with a controller while someone else keeps working on the same Windows PC.
Description: |-
  InputSplit keeps one chosen game running in the background: the game keeps reading its
  controller, does not pause when another window becomes active, and cannot see the keyboard
  and mouse. One person plays on the TV with a gamepad while another keeps working on the
  monitors. Meant for single-player and offline games; games with anti-cheat are refused by
  default.
