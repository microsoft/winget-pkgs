ReleaseNotes: |-
  NyaTerm v2.0.6
  本次正式版本重点完善终端命令与路径补全、连接和启动配置，并改进串口设备选择、Android 屏幕操作与 MCP 命令执行体验。同时修复终端清屏后回滚显示、命令历史、数据目录迁移、云同步以及多项文件管理和界面问题。
  ✨ 新增功能
  - 命令路径补全与自定义规范：命令建议现在可补全受支持 Shell 环境中的文件和目录路径，补充常见服务器命令及参数候选，并可从配置目录加载用户自定义的 JSON 补全规范。历史、命令及参数建议可先行展示，路径结果随后补充；对远程目录读取设置超时及数量限制。（PR #1251，#1028）
  - 可切换应用数据目录：在设置中选择新的数据存储位置，支持迁移或采用已有数据，并增加重启、目录校验和中断后恢复处理，尽量避免迁移中途留下不可用的数据库。（PR #1243）
  - 连接默认参数：可分别为各连接协议保存新建会话的默认设置，减少重复配置；现有连接仍保留自己的设置。（PR #1243）
  - 自定义启动会话：启动行为支持“不恢复”“恢复上次会话”或“打开指定连接 / 连接分组”，可设置多个目标及其顺序；不支持无人值守启动的连接会受到限制。
  - 串口连接时选择设备与波特率：已保存的串口连接可配置为连接时询问设备端口、波特率或两者，便于应对 USB 串口设备重新插拔后端口变化；会话标题跟随实际设备。（PR #1289）
  - 连接管理与共享：支持复制或分享已保存连接的摘要信息，连接列表增加标签搜索，并改善连接和分组的拖放排序、层级移动与拖动反馈。
  - 网络监控：扩展网络使用历史、逐网卡流量查看和相关筛选交互。
  - MCP 终端执行策略：增加自动、会话内和后台执行模式配置；MCP 的 terminal_start 在适用的后台 SSH 执行场景下可有限等待命令结果，减少短命令反复轮询。（PR #1286）
  🐛 问题修复
  - 终端清屏与回滚：修复 Ctrl+L 清屏并继续输出后，回滚时可能出现旧提示符或缺少最新输出的问题，改进缓存快照的新鲜度检查。（PR #1295）
  - 命令历史与补全：修复 Tab 补全后的命令未正确收录到历史、重复历史记录，以及已提交命令又成为下一次输入等问题；对嵌套 Shell 和上下文不足的情况避免给出错误路径建议。（PR #1279、PR #1281）
  - 折叠输出与终端显示：修复命令输出折叠后，高亮、建议弹窗定位和滚动显示可能异常的问题；修正终端横向滚动条预留空间、活动主题颜色查询等细节。（PR #1265）
  - Shell 与路径兼容性：改进终端路径识别、引用和特殊字符转义，修复部分 zsh 注入清理及命令确认场景。（PR #1264，#1288）
  - 云同步与数据恢复：对适用的 S3 读取和列举失败增加有限重试，改进冲突合并、同步完成反馈及迁移恢复过程；处理 macOS 数据库迁移涉及的文件系统与锁定兼容问题。（PR #1243、PR #1270、PR #1272）
  - 文件和资产操作：修复批量选择资产后的菜单操作只作用于单个项目的问题，增强批量删除的一致性；改进文件剪贴板传输、文件图标及拖放完成时的状态处理。（PR #1271）
  - MCP 连接稳定性：修复桥接协商尚未完成就请求工具列表、重新连接后发现信息过期、恢复会话不完整等情况，并完善连接身份和等待超时处理。（PR #1269、PR #1283）
  - AI 对话草稿：修复 Agent 运行完成后，用户预先输入的后续消息草稿可能丢失的问题。（PR #1253）
  ⚡ 性能与稳定性优化
  - Android 屏幕显示：更新屏幕控制工具栏，完善返回、主页、最近任务、适配显示与粘贴等操作，并引入 GPU 平面图像渲染路径以改善屏幕数据处理。
  - 终端补全资源控制：限制本地和 SFTP 路径枚举、过期任务及缓存占用，避免目录响应迟缓时阻塞建议更新；折叠输出时优化高亮复用与计算范围。（PR #1251）
  - 远程桌面渲染：减少不可见窗口的无效纹理上传，并优化较窄脏矩形的上传处理。（PR #1263）
  - 运行与持久化可靠性：加强会话恢复、连接重试和数据目录迁移的边界处理，减少失败后的错误状态残留。
  ♻️ 重构与优化
  - 拆分终端补全运行时、连接树管理和部分桌面服务，统一状态与取消机制；这些主要是维护性调整，不代表功能模块整体替换。
  🎨 界面与交互优化
  - 容量与速率单位：修正按 1024 换算的内存、磁盘、文件大小、网络速率等数值的显示单位，统一使用 KiB / MiB / GiB 等二进制单位；不改变实际数值或保存格式。（PR #1287）
  - 连接与弹窗：改善连接列表拖拽指示、设备选择和子窗口在全屏或最大化父窗口中的居中定位。（PR #1285）
  - 悬停卡片：改善靠近屏幕边界时的横向定位，减少卡片超出可用区域的情况。（#1170）
  - 资源监控面板：调整网络卡片布局、折叠及顶部硬件信息分页，避免较长单位标签被裁切。
  📚 文档与国际化
  - 补充路径补全的支持范围与限制说明，完善串口选择、设置选项、Android 屏幕操作及容量单位相关的多语言文案。
  👥 贡献者
  - @WerVa：完善命令与文件路径补全、补全目录及相关稳定性保护。（PR #1251）
  - @fonaix：实现数据目录切换与连接默认值、改进串口连接配置，并修复子窗口定位问题。（PR #1243、PR #1289、PR #1285）
  - @zhangzp0127：改进 MCP 工具发现、重连恢复与命令启动后的有限等待。（PR #1269、PR #1283、PR #1286）
  - @Jensen-Yao：修复 Tab 补全历史、重复记录、折叠输出定位及 zsh 命令清理问题。（PR #1264、PR #1265、PR #1279、PR #1281）
  - @HarpeLm：修复资产批量操作及 macOS 数据目录迁移兼容性，并补充跨平台测试。（PR #1270、PR #1271、PR #1272、PR #1274、PR #1275、PR #1282）
  - @LunaSpica：修正容量与网络速率的二进制单位显示。（PR #1287）
  - @dxianping：减少远程桌面未显示窗口的无效纹理上传。（PR #1263）
  - @shallFun4Learning：修复 AI Agent 运行后的后续输入草稿保留问题。（PR #1253）
  - @zhonghes：修复终端清屏后缓存滚动快照失效引发的旧内容显示问题。（PR #1295）
  ⚠️ 升级说明
  - 切换应用数据目录会涉及数据校验与应用重启；请先确认目标目录可读写，迁移期间不要手动删除原目录。
  - 对串口连接启用“连接时询问”后，交互式启动可选择端口或波特率；无人值守恢复及自动化启动不会弹出选择框，建议使用固定参数的连接。
