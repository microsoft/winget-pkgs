ReleaseNotes: |-
  NyaTerm v2.0.1
  v2.0.1 是 NyaTerm 2.0 正式版后的首个维护更新。本次重点完善 云同步、Windows RDP、SSH 身份验证、终端输入及 SFTP 文件操作，同时加入若干实用交互能力，并修复多项影响日常使用的问题。
  ✨ 新增功能
  - Cloud Sync V3 预览：在云同步设置中提供可选的新同步方式，首批支持 WebDAV、S3 和本地目录。与旧快照同步协议并存，选择后需要先保存配置，再生成并确认同步预览。
    - 连接、分组、代理、隧道、快捷命令、笔记、图标和主题等资源可按稳定 ID 合并；不同字段的修改可自动合并，同一字段冲突则显示候选供手动选择，并允许先应用无冲突部分。
    - 外观偏好、快捷键、AI 非敏感配置均有独立同步范围；密码、私钥、OTP、AI 密钥等敏感数据以及 SSH/VNC 主机信任信息需要单独启用，不会默认同步或自动信任远端身份。
    - 首次确认会生成并验证加密安全备份；同步发布失败时保留待发布状态，增加主密码轮换及数据回读校验机制。当前仍属预览能力，并非所有旧云存储提供方都支持新协议。
  - Windows 原生 RDP 连接方式：新增 Windows 原生 RDP 后端，并为显式选择的 ActiveX 连接采用独立辅助进程，减少不同远程桌面会话之间的相互干扰。
  - 终端 MAC 地址快捷操作：识别终端输出中的 MAC 地址，支持多种常见格式之间的转换，并直接复制或插入转换结果。关联 Issue #1079。
  - 外部链接与启动参数：扩展 SSH、Telnet、本地终端的外部调用，支持 SSH 的终端或 SFTP 会话模式、复用窗口参数，以及同名已保存连接的选择。Windows 安装版增加 nyaterm://、ssh://、telnet:// 协议注册与卸载清理。
  - WindTerm 加密会话导入：遇到受主密码保护的 WindTerm 自动登录信息时，可在导入流程中输入主密码；补充解密失败和凭据不完整时的提示。
  - 终端命令建议填充：允许在确认输入状态安全时补全当前命令，避免盲目替换已有内容，尤其改善网络设备命令联想重复的问题。关联 Issue #1055。
  🐛 问题修复
  - RDP 连接与显示：修复连接后端选择无法正确保存的问题；按实际面板尺寸发起适配窗口的连接，减少初次连接后重复调整分辨率；改进原生 RDP 在不同 DPI 下的缩放表现。
  - RDP 认证与恢复：关闭远程身份验证时不再错误要求密码（PR #1042）；仅针对适合重试的网络故障自动重连，并支持复制失败画面的错误信息（PR #1006）。
  - RDP 多会话：修复部分会话实例互相影响、窗口还原及 ActiveX 显示配置不受支持时的异常处理。
  - VNC 大画面更新：修复包含大量合法更新矩形的帧被错误判为协议故障的问题，同时保留必要的资源边界校验（PR #1047，关联 Issue #1045）。
  - VNC 无密码连接：修复无需密码的自动协商和重试仍反复索要密码的问题；改善真正缺少凭据时的提示，并解释经典 VNC 密码的长度限制（PR #1047、PR #1062，关联 Issue #1046）。
  - 首次云同步冲突：新安装或清空数据的设备首次拉取时，不再把空本地内容与云端已有内容误判为冲突；云端仅有空快照时也会保留本机数据并允许正常推送。双方均有实际内容的冲突仍须处理（PR #1057，关联 Issue #1051）。
  - SFTP 文本写入：修复向远端写入文本时新文件创建、已有文件覆盖不正确的问题，涉及 sftp_write_text（PR #1027）。
  - 终端键盘与选择：修复 Ctrl+-、Ctrl+Shift+- 未按预期发送 ^_ 的问题（PR #1044）；改善跨行选择、完整缓冲区选择与软换行边界处理。
  - 快捷键录制：修复录制快捷键时无法正确捕获已经绑定的组合键的问题（PR #1077）。
  - 关闭与更新：修复启用关闭到托盘后退出行为异常、可能妨碍应用更新的问题；关闭窗口或退出时更妥善地处理未保存的设置草稿（PR #1011）。
  - MCP 工具结果：修复 sftp_list 的 structuredContent 格式，以及工具列表遗漏 ttlMs、cacheScope 缓存字段的问题（PR #1026、PR #1075）。
  ⚡ 性能与稳定性优化
  - SSH 运行时认证：改善连接时补充或重新输入凭据的流程，强化密码输入、显示切换、空白字符保留与校验反馈，减少保存连接与临时认证之间的交互混淆。
  - 批量文件冲突处理：上传重复文件时可对本次上传批次的后续冲突选择统一覆盖，其他上传任务仍独立确认；同时优化传输任务排队、删除任务和文件元数据处理。
  - 应用关闭时的同步安全：退出与更新前协调正在执行的同步操作，避免同步写入在关闭过程中被直接中断。
  - 终端输出整理：优化控制序列与最近输出文本的处理，使传入 AI、MCP 和终端操作菜单的文本更加准确。
  - 崩溃排查：增加本地崩溃报告记录和旧报告清理，方便定位异常退出原因。
  ♻️ 重构与优化
  - 同步数据处理：引入更细粒度的同步数据模型、加密对象与合并流程，为多端配置同步和冲突恢复提供基础；不将其等同于所有云存储服务都已升级。
  - 外部包管理器适配：源码构建者可通过 NYATERM_PACKAGE_MANAGER 声明由外部包管理器负责更新；此类构建会关闭应用内更新检查及入口，并在“关于”界面显示包管理器名称。普通官方安装包保持原有更新行为（PR #1066）。
  🎨 界面与交互优化
  - 设置融入工作区：设置从独立模态窗口改为工作区标签页，减少配置操作与终端会话之间的切换阻碍。
  - 会话标签操作：调整新建标签和标签操作菜单，完善重命名、复制、断开连接以及操作后的焦点恢复。
  - AI 模型选择：输入模型名称时优先显示匹配项，并改善已添加模型的展示与选择（PR #1074）。
  - 文件传输与远程管理：传输面板增加进入文件管理器的入口；优化远程进程信息、监控面板以及窄窗口下的布局。
  - 窗口与托盘：改善标题栏、连接编辑器和工作区布局；优化 macOS 托盘图标的模板显示。
  📚 文档与国际化
  - 补充外部协议调用、SSH 会话模式、云同步预览与外部包管理器构建说明。
  - 完善 SSH 身份验证、主密码导入、文件权限、连接取消等提示的中、英、法、日、韩及繁体中文文案。
  👥 贡献者
  - @HarpeLm：修复 RDP 无认证密码提示、SFTP 文本写入、终端快捷键、MCP 响应及快捷键录制问题（PR #1042、PR #1027、PR #1044、PR #1026、PR #1075、PR #1077）
  - @Coflys：优化 RDP 网络故障重连策略与失败错误复制（PR #1006）
  - @hualong1009：修复 VNC 大量更新矩形被误判和无密码重试索要密码的问题（PR #1047）
  - @moonmicah：修复首次云同步空内容误判为冲突的问题（PR #1057）
  - @sgnay：完善外部包管理器接管应用更新的支持（PR #1066）
  - @maxim-palshin：完善经典 VNC 密码长度限制提示（PR #1062）
  - @llyVictory：优化 AI 设置中模型名称匹配与候选排序（PR #1074）
  - @HIUEETR：修复关闭窗口时最小化到托盘的行为（PR #1011）
  - @work1024：参与 Windows 原生 RDP 后端、设置标签页及远程桌面显示改进（直接提交）
  ⚠️ 升级说明
  - Cloud Sync V3 是可选预览功能：建议先保留现有备份，再手动启用并检查同步预览。新旧同步空间并存；敏感数据与主机信任默认不纳入同步。切换主密码或迁移其他设备前，请阅读同步说明。
  - Windows 协议关联：安装版可能注册 SSH/Telnet 链接处理器，系统仍可要求用户选择默认应用；便携版不会主动注册。包含密码的 SSH URL 可能被浏览器或外部调用工具记录，请谨慎使用。
  - 外部包管理器安装：若构建时启用了包管理器接管更新，后续更新应通过相应包管理器完成；官方标准构建不受影响。
