ReleaseNotes: |-
  NyaTerm v2.0.8
  本次更新加入 FTP/FTPS 文件连接、终端本地模式与关键词高亮管理，并增强快捷命令、外观主题、Android 设备操作及凭据填充体验。
  ✨ 新增功能
  - FTP/FTPS 连接与文件管理：新增 FTP 连接类型，支持普通 FTP、显式及隐式 FTPS、被动连接模式、字符集与 ASCII 文本传输；可在双栏文件管理器中浏览目录、上传和下载文件，并使用现有文件操作能力（#1208，PR #1334）。
  - 终端本地模式：可在不向远端发送按键的情况下，使用键盘、鼠标浏览并选择终端输出，支持编辑器风格的光标操作和快捷键（PR #1342）。
  - 终端关键词高亮管理：可从终端右键菜单打开高亮规则管理器，分别维护当前会话和全局规则（#1317，PR #1342）。
  - 快捷命令分段发送：支持按行或按字符发送，分别设置发送间隔，并可中途停止；完善换行、取消以及多目标发送的处理（PR #1328）。
  - Android 屏幕手势：支持配合 Ctrl、Shift 修饰键和鼠标模拟双指捏合，以及纵向、横向双指滑动。
  - OTP 智能建议：可为动态验证码条目设置终端提示匹配规则，在匹配的验证提示中选择 OTP 并填入当前验证码（PR #1341）。
  - 外观跟随系统：新增随系统亮色／深色外观自动切换主题的选项，并允许终端配色跟随界面或独立设置（PR #1301）。
  🐛 问题修复
  - 修复凭据自动填充在密码提示下的匹配边界、空凭据库处理，以及 OTP 过期后仍使用旧验证码的问题（PR #1310）。
  - 修复终端本地模式、选区、光标定位及关键词高亮状态在部分交互中的异常，完善备用屏幕滚轮设置变更后的即时生效逻辑。
  - 改善 FTP 文件传输的取消、错误处理与会话清理。
  - 修复 Windows 贴边或特殊窗口状态下子窗口的位置计算，以及浮动面板层级和鼠标事件隔离问题（PR #1340）。
  - 修复 Android 退出时部分由应用启动的 ADB 服务进程未能正确清理的问题（PR #1327）。
  - 修复 AI 历史聊天显示和部分消息复制操作，以及快捷键搜索框对普通按键的处理。
  ⚡ 性能与稳定性优化
  - 优化快捷命令和命令发送的分段调度、背压处理与取消响应，减少重复计算。
  - 加强 Android ADB 服务启动及关闭的生命周期管理。
  - 完善终端输入、会话状态与传输路径的边界处理，提升异常情况下的稳定性。
  ♻️ 重构与优化
  - 连接批量编辑按协议整理字段，并补齐部分 SSH、FTP、ADB 设置，便于批量维护不同类型的连接。
  - 拆分桌面执行任务及主机工具相关内部模块，改善代码结构和测试覆盖。
  🎨 界面与交互优化
  - AI 聊天消息加入复制操作和时间戳显示，调整操作按钮布局（PR #1330）。
  - 新增终端命令块侧边标记栏的显示开关。
  - 新增“新建连接保存后立即打开”与“操作链接中的命令插入终端而不直接执行”两个可选设置，默认保持原有行为（PR #1343）。
  - 连接失败页面支持按 Enter 重新连接；连接描述最多显示三行；Docker 容器列表的名称和镜像增加悬浮提示（#1339）。
  - 外观主题选择改为分段切换控件，并精简部分重复的界面说明。
  📚 文档与国际化
  - 更新终端、主题和连接相关的使用说明，并同步完善六种界面语言的翻译。
  👥 贡献者
  - @fonaix：新增 FTP/FTPS、终端本地模式和关键词高亮管理，改进连接批量编辑与 Windows 窗口交互（PR #1334、PR #1342、PR #1340）。
  - @cdog-shen：实现快捷命令分段发送（PR #1328）。
  - @LunaSpica：加入跟随系统外观切换主题的能力（PR #1301）。
  - @zhonghes：新增 OTP 提示匹配，并改进终端凭据自动填充（PR #1341、PR #1310）。
  - @skykiller15：新增连接保存后自动打开及操作链接命令插入选项（PR #1343）。
  - @WerVa：新增备用屏幕滚轮发送方向键行为的控制选项（PR #1344）。
  - @yaoxinghuo：改进 AI 聊天消息复制与时间戳显示（PR #1330）。
  - @moonmicah：修复应用退出时的 ADB 服务清理（PR #1327）。
  ⚠️ 升级说明
  - 快捷命令兼容性：旧版 NyaTerm 不识别本版新增的分段发送间隔等参数；若将新版本保存的快捷命令同步或导入旧版，实际发送方式可能不同，旧版重新保存也可能丢失这些新参数。
