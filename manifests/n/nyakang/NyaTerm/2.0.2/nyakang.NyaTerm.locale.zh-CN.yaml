ReleaseNotes: |-
  NyaTerm v2.0.2
  本次版本重点完善 SSH tmux 多窗格工作区、云同步 V4、Windows RDP 连接方式、终端长行显示和 AI 操作审批，同时改进快捷命令、远程监控、录制、设置编辑和更新体验。除新增能力外，也集中修复了便携版更新、云端重定向、加密备份、快速切换和终端交互等问题。
  ✨ 新增功能
  - SSH tmux 控制模式（PR #1080）：在 SSH 会话内运行 tmux -CC，将远端 tmux 窗口和 pane 布局直接投影到当前 SSH 标签页，无需为每个远端窗格另开顶层标签。支持切换、新建和关闭 tmux 窗口、水平/垂直分屏、常用命令建议、自定义 tmux 命令及主动 Detach；退出控制模式后保留原 SSH 会话。
  - Cloud Sync V4 存储扩展：在上一版本 V3 预览的基础上，WebDAV 与 S3 对象访问改用 OpenDAL，并接入 Google Drive、OneDrive、阿里云盘的 V4 存储处理。改进 OAuth 凭据刷新与持久化、旧快照迁移、跨设备冲突预览、取消及发布后的结果验证。V4 仍是需要谨慎启用的同步协议，并非旧协议的无条件自动升级。
  - Windows 系统远程桌面客户端模式：RDP 连接可选择调用系统自带的 mstsc，适合希望使用 Windows 系统远程桌面窗口的用户。此模式仅适用于 Windows，且不通过 NyaTerm 已配置的代理或跳板路由；与 NyaTerm 内嵌远程桌面模式的使用方式不同。
  - 原生 AI 操作审批：内置 AI 执行涉及终端或文件能力的操作时，可在会话中查看操作目标、命令或参数以及风险提示，并选择拒绝、单次允许，或在适用的非破坏性操作中允许本次运行。不同 AI 运行和会话的审批请求分别处理，取消后不继续保留待审批操作。
  - 终端长行显示与换行标记：新增字符换行 / 不换行显示方式及可选软换行标记。不换行模式可通过触控板、Shift + 滚轮 或悬停显示的水平滚动条查看较长行；搜索、选择、复制与横向滚动配合处理，复制时不会额外插入软换行或标记字符。部分应用终端模式及图形输出会暂时使用常规网格显示。
  - 终端斑马纹显示：新增终端斑马纹功能，并提供独立的「按行斑马纹」二级开关，可根据阅读习惯调整终端输出的背景条纹效果。
  - 按标签页控制同步输入（PR #1048）：同步输入增加单标签页接收开关；对于不希望收到广播输入的会话，可独立排除，减少批量操作时误发命令的风险。
  - 远程资源监控登录会话（PR #1048）：资源监控面板可以按需查询并显示远端当前登录用户，会话数据不必持续后台采集。
  - 快捷命令原始发送（#1010）：新增 raw_send 选项，允许按原始内容发送快捷命令，适用于对转义字符、回车和发送方式有明确要求的命令。
  - 连接后命令编辑器（#1009）：连接配置中的登录后命令改进为多行代码编辑体验，支持 Bash 语法着色；切换设置分区后保留未提交的编辑，并区分输入换行与明确保存操作。
  🐛 问题修复
  - Cloud Sync / WebDAV（PR #1109）：修复 WebDAV 重定向导致请求方法改变、上传请求体丢失等问题，并加强 Digest 身份验证签名重算、重定向检查和异常提示。
  - Cloud Sync V4 迁移与冲突处理：完善从已有远端快照迁移时的读写路径、空数据及多设备冲突场景；遇到本地数据已变化或操作取消时，避免继续按过期预览提交。
  - 加密 .nya 备份（PR #1121）：修复导出加密备份时保管库密钥未按备份密码正确封装的问题，使备份加密和恢复所需凭据保持一致。
  - Windows 便携版更新（#1089）：更新包校验覆盖主程序、辅助文件和 ConPTY 目录，改进完整文件集替换、失败回滚、原版本恢复及启动前检查；增加已安装可执行文件名校验，避免不匹配的更新路径继续安装。
  - tmux 接管和异常退出（PR #1080）：修复控制模式识别、验证失败回退、特殊按键、粘贴、输出缓冲、pane 重建、通道退出和 Detach 相关边界问题；防止 tmux 接管期间的文件传输误进入不兼容状态，并改善工作区焦点和撤销快捷键。
  - 快捷切换搜索：名称继续使用模糊匹配，地址、IP 片段和端口改为按字段匹配；支持更准确地按 host:port 等条件过滤，减少数字片段误命中其他字段的问题。
  - WindTerm 快捷命令导入（PR #1094）：修复多行命令的回车与反斜杠处理，避免导入后内容被错误转义或无法继续编辑。
  - 设置保存（PR #1120、PR #1101）：修复单词分隔符在应用草稿后未正确保存，以及必填项校验失败时“应用”“确认”操作不能明确显示阻止原因的问题；主题草稿也会先验证再保存。
  - Windows RDP 剪贴板和连接状态：调整远程桌面剪贴板设置、数据交换及事件处理，改善 Windows RDP 集成在部分连接场景下的兼容性。
  - AI 助手：修复 Claude Agent 无法正常使用的问题；完善对话与执行记录中的文本选择、复制及右键菜单处理。
  - SSH 文件操作：修复远端 Shell 中 rm 被别名覆盖时可能影响预期删除命令的问题。
  - 桌面布局：修复侧边栏面板堆栈调整尺寸时可能产生的跳动或异常。
  ⚡ 性能与稳定性优化
  - 终端渲染（PR #1095）：优化终端网格行索引、行签名和单元格文本采集，减少终端快照生成中的重复处理。
  - 长行显示及交互：为软换行与逻辑行建立独立处理，改进水平滚动、历史滚动、选择位置和绘制区域的一致性，降低长输出场景中的显示偏差。
  - tmux 会话稳定性：强化控制通道接管前的验证、输入缓冲边界、窗格注册与取消时序；异常终止时清理虚拟窗格，避免影响原 SSH 工作区。
  - 进程及会话回收：改进外部子进程的状态管理和清理逻辑，减少子进程结束后残留状态。
  - 更新失败恢复：区分检查失败、下载失败、安装包缺失或不合法、签名校验失败等情况，提供更具体的提示与后续处理路径，而非统一显示下载失败。
  🎨 界面与交互优化
  - Dracula / Dracula Light（PR #1124）：按官方 Dracula 配色修订主题，新增浅色变体；改善按钮、成功状态标签及浅色强调背景上的文字对比度。
  - 设置中心：优化设置面板布局与交互；自定义搜索引擎支持更清晰地管理名称、URL、图标和是否显示在搜索菜单中，并改善操作入口和空状态提示。
  - 录制面板：改进会话搜索、录制状态、录制模式和已写入数据量的展示，更容易找到正在录制或出现异常的会话。
  - 录制时间（PR #1132）：Transcript 日志时间戳改为本地时区，便于与本机时间对应。
  - 命令行视觉反馈（#1131）：优化命令行高亮及选择范围背景，改善不同主题下的可读性。
  - 更新弹窗：更新进度、失败类型、恢复操作和帮助信息的展示更加明确，减少遇到无效安装包时反复重试下载的困惑。
  ♻️ 重构与优化
  - Windows RDP 内部实现：调整原生 RDP 会话管理，移除已弃用的 ActiveX 辅助进程及旧剪贴板配置；这些内部替换不代表所有 RDP 协议能力均发生升级。
  - AI 模型请求：原生模型提供方迁移至 rust-genai 0.7.3 并统一部分执行路径；属于现有 AI 功能的实现维护，不作为新增模型支持承诺。
  - 维护与校验：完善设置编辑状态、会话与传输条目排序、发布构建验证及自动化测试，减少回归风险。
  📚 文档与国际化
  - 补充终端换行模式与 Windows 便携版更新恢复说明；完善设置、远程桌面、录制和更新状态的多语言文案。
  - 更新 Windows 诊断与发布流程相关的维护说明；诊断工作流不属于普通用户版本的新功能。
  👥 贡献者
  - @yaoxinghuo：移植 SSH tmux 控制模式，并完善控制通道、特殊按键、会话退出及分屏交互（PR #1080）。
  - @WerVa：贡献 Dracula Light、终端快照性能优化、远程登录用户监控、同步输入接收开关、加密备份及设置持久化修复（PR #1124、PR #1095、PR #1048、PR #1121、PR #1120）。
  - @hualong1009：修复 WebDAV 重定向请求处理与 Transcript 时间戳问题（PR #1109、PR #1132）。
  - @ganeshmshetty：修复 WindTerm 多行快捷命令导入后的编辑问题（PR #1094）。
  - @moonmicah：改进设置校验失败时应用和确认操作的提示（PR #1101）。
  - @backkoom：修复快捷切换相关架构检查问题（PR #1133）。
  - @fonaix：改进快速切换中数字 IP 片段的精确匹配行为。
  ⚠️ 升级说明
  - Windows 便携版用户（#1089）：旧版更新器可能拒绝包含 ConPTY 或辅助程序的正常发行 ZIP，受影响的旧版本必须先手动升级一次。退出 NyaTerm，备份整个 data/ 目录，下载匹配 x64 或 ARM64 架构的完整便携版 ZIP，替换主程序、辅助程序和 conpty/ 等完整程序文件；保留原有 data/ 目录，不要以 ZIP 内的空数据目录覆盖个人数据。
  - Cloud Sync V4：使用新协议或更换提供方前，请先备份本地数据，检查迁移及冲突预览后再确认同步；涉及多设备时尤其不要直接覆盖仍有未同步修改的设备。
  - Windows RDP 客户端选择：使用系统 mstsc 模式会在 NyaTerm 外启动 Windows 远程桌面客户端；如需 NyaTerm 内的代理或跳板连接，请选择支持相应路由的连接方式。
