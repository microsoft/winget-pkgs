ShortDescription: 支持 SSH、RDP、VNC、串口、本地 shell、SFTP 和加密配置同步的原生桌面终端客户端。
Description: NyaTerm 是基于 Rust 与 GPUI 的原生桌面终端客户端，把 SSH、本地 shell、Telnet、串口、RDP、VNC 会话、SFTP 文件传输、端口转发、OTP、AI 助手和加密配置同步放在同一个桌面应用中，适合日常开发、服务器维护和设备调试。
