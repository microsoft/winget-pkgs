ReleaseNotes: |-
  NyaTerm v2.0.7
  本次更新带来了 TFTP 网络工具、更加完整的 WindTerm 数据导入，以及文件管理器和终端操作体验的改进，同时修复串口重连、Android ADB、设置数据恢复和多项交互问题，并优化 VNC 画面更新处理。
  ✨ 新增功能
  - TFTP 网络工具：在「网络工具」中新增可独立管理的 TFTP 服务，提供启动/停止及配置界面，可设置监听地址、端口、共享根目录、块大小、超时和并发限制，并改进传输过程与服务生命周期的错误处理（PR #1319）。
  - WindTerm 导入增强：完善 WindTerm 会话、账户和快捷命令栏的导入流程，支持读取关联账户信息，并对需要处理的凭据提供更明确的导入流程（PR #1300）。
  - 文件管理器入口：支持从已保存的 SSH 连接直接打开文件管理器；双栏文件管理器增加与文件浏览器风格一致的路径面包屑、目录导航和路径相关操作。
  - 终端命令块识别：增加对终端输出中命令块边界的推断与更新机制，改善没有完整命令标记时的命令区域识别，并使用受限缓存控制相关状态。
  🐛 问题修复
  - 串口连接与重连：重连时尽可能沿用已确认的串口参数，避免反复弹出配置提示；明确反馈真实断连，并修复串口连接提示在云同步快照中的保存问题（PR #1324）。
  - Android ADB：修复 ADB 服务已停止时会话无法正常恢复的问题，并限制自动启动 ADB 服务的触发条件（PR #1302）。
  - 终端选择与建议：修复可见区域首行、末行不易选中的问题，以及同步输入期间命令建议可能消失的问题（PR #1320）。
  - 数据恢复：修复设置数据库缺失或损坏时的恢复路径；需要重建数据库时提供确认，降低误操作风险（PR #1300）。
  - 文件操作：改进创建文件/文件夹对话框的初始焦点、传输浏览器排序表头的拖拽区域，以及相关路径和文件操作交互。
  - 文本显示：调整换行标记的显示方向（#1304），修正暗色主题下 AI 回复的行内代码可读性（PR #1296）。
  ⚡ 性能与稳定性优化
  - VNC 画面更新：将 VNC 更新的合成工作移出 UI 线程，减少画面处理对界面响应的干扰，并补充渲染测试及性能对照工具。
  - SSH 兼容与依赖维护：改善部分使用较短 RSA 主机密钥的网络设备的兼容性，同时为旧式 RSA 主机密钥引入显式兼容开关；更新相关 Rust TLS 依赖以处理已报告的安全公告（PR #1308）。
  - TFTP 与网络服务：增强 TFTP 数据传输边界处理、配置持久化和服务启动/停止过程的稳定性。
  - 终端与会话运行：调整命令建议、搜索和录制相关内部状态管理，补充会话恢复、取消处理与布局恢复的回归测试。
  🎨 界面与交互优化
  - 双栏文件管理器：完善右键菜单、面包屑及子目录/收藏路径菜单，统一导航方式与操作反馈。
  - 传输浏览器：增加文件上传、下载的快捷操作，以及在文件管理器中定位本地传输路径的入口。
  - 终端查找：调整查找栏的上一项/下一项导航与选择交互，使操作方式更接近 VS Code。
  - 菜单和表单：优化标签页操作子菜单、收藏菜单宽度、详情卡片位置、关键词高亮规则输入及暗色主题下的高亮配色；改进网络接口信息展示。
  - 凭据规则设置：为用户名与密码提示正则表达式提供更准确的字段说明（PR #1311）。
  📚 文档与国际化
  - 更新 SSH 连接与 JSON 导入文档及示例，说明关联账户的导入字段。
  - 为 TFTP 网络工具、连接兼容选项及文件管理器等新增和调整的界面内容补齐多语言文案。
  👥 贡献者
  - @fonaix：贡献 TFTP 服务、WindTerm 导入、串口重连与数据库恢复等改进（PR #1319、PR #1324、PR #1300）。
  - @zhonghes：修复终端边界行选择及凭据规则字段说明（PR #1320、PR #1311）。
  - @moonmicah：修复已停止的 ADB 服务导致会话中断的问题（PR #1302）。
  - @HarpeLm：修复暗色主题下的 AI 行内代码显示，并更新 Rust TLS 依赖（PR #1296、PR #1308）。
  ⚠️ 升级说明
  - 旧式 RSA SSH 主机密钥：出于连接安全考虑，相关兼容模式改为需要在 SSH 连接配置中显式启用。若升级后旧设备提示主机密钥算法不兼容，请先核对设备配置和密钥，再按需开启该选项。
  - TFTP 服务：启用前请确认监听地址和共享根目录符合预期，仅在可信网络中开放相应服务。
