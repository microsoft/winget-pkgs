  ⚠️ 升级说明
  - 云同步范围已固定：云同步面向受支持的连接、分组、代理、隧道、快捷命令、笔记和主题等配置数据；不应将其视为完整备份或凭据同步方案。敏感凭据、AI 配置、个人偏好、快捷键和信任主机信息等不在固定同步范围内。升级前如需完整保留本地环境，请另行创建并妥善保存备份。
  - 旧版 SSH 设备：如遇旧版 Dropbear/OpenWrt 等服务器在附加资源探测时连接不稳定，可针对该 SSH 连接启用“兼容模式”。该模式会跳过部分自动探测，不会启用额外的远程管理功能。
  - Linux glibc 2.31 兼容包需手动升级：该兼容包与常规 Linux 发行包是不同构建，主要用于需要旧版系统库的 x86-64 环境；请从本版本的独立附件下载并核对 SHA256，勿将其与常规包混用。兼容包不参与常规自动更新渠道。
  - 构建产物说明：本次发布的安装包、签名与更新清单以 GitHub Actions 完成后的实际 Release 附件为准；在 Draft 阶段不代表所有平台构建已经通过。
