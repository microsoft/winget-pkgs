ReleaseNotes: |-
  NyaTerm v2.0.0
  NyaTerm 2.0.0 正式启用基于 Rust + GPUI 的原生桌面版本，取代此前的 Tauri/WebView 桌面实现。本次稳定版延续 SSH、本地终端、SFTP、RDP、VNC、隧道、AI 助手及云同步等核心能力，并整合预览阶段后的修复与完善。
  ✨ 新增功能
  - 原生桌面工作区正式上线：提供原生窗口、终端和多会话工作区；RDP、VNC 与 MCP 辅助程序随桌面应用打包。
  - RDP 高级连接选项与诊断：增加可配置的连接选项和渲染器诊断信息，便于排查兼容性问题（PR #999）。
  - AI 请求头配置：支持为不同 AI 凭据单独配置自定义 HTTP 请求头，并完善编辑校验与请求应用逻辑（PR #1004）。
  - WSL 工作目录浏览：支持通过 \\wsl.localhost 浏览 WSL 专属路径，并加强路径映射校验（PR #991）。
  - 窗口装饰设置：增加桌面窗口装饰偏好，并改善 Linux 窗口交互。
  🐛 问题修复
  - 修复 RDP 远端连续复制文件时，本地剪贴板内容更新滞后或仍引用旧文件的问题，并保留复制文件的时间信息。
  - 修复部分 RDP 剪贴板请求超时与辅助进程生命周期处理问题，改善断开和重连期间的稳定性。
  - 补全外部 MCP 的终端显示模式处理（PR #1001）。
  - 修复部分终端选择、会话信息弹窗及路径识别的交互边界问题。
  ⚡ 性能与稳定性优化
  - 优化云同步检查缓存、元数据读取和冲突处理，增强并发变更、自动同步和恢复场景的可靠性。
  - 改善终端渲染帧、光标状态和远程桌面辅助进程的运行稳定性。
  🎨 界面与交互优化
  - 优化云同步历史面板的内容格式与布局，并调整快照密码提示流程。
  - 优化连接编辑器的设置分组及字段校验。
  👥 贡献者
  感谢以下外部贡献者参与本次正式版前的完善：
  - @moonmicah
  - @litcc
  - @ccyylhj
  - @Coflys
  - @victorwon2001
  ⚠️ 升级说明
  从 NyaTerm 1.x 升级到 2.0.0 前，请退出应用，并备份完整的数据目录、密钥和便携版程序目录。
  - Windows 1.x 便携版需手动升级：下载与设备架构一致的完整 ZIP，保留原有 data/ 与密钥并替换全部程序文件，不能只覆盖 NyaTerm.exe；RDP、VNC、MCP 辅助程序和 ConPTY 必须一并更新。旧版内置更新器不能完成此次迁移。
  - 旧 MSI 安装需手动迁移：备份后卸载旧 MSI，再安装同架构的 NSIS -setup.exe，不要删除用户数据。
  - 从 2.0 预览版迁入正式版：先导出 .nya 备份，再在正式版恢复；预览版与正式版的数据目录不会自动合并。
  - 如果升级失败，请恢复迁移前的完整备份，不要使用旧程序打开新版已写入的数据。
  - Windows 版本要求 Windows 10 / 11，不再支持 Windows 7。
  迁移步骤详见：NyaTerm 2.0 迁移指南。
