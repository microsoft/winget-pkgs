ShortDescription: Real-time infrastructure monitoring agent with per-second metrics and a built-in web dashboard.
Description: Netdata is an open-source, real-time infrastructure monitoring agent. It collects thousands of metrics per second from the local system with minimal configuration, stores them locally and visualizes them in a built-in web dashboard. On Windows it installs as a service and can optionally be connected to Netdata Cloud for centralized, multi-node monitoring.
