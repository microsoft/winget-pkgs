ShortDescription: Zooming presentations on an infinite canvas, with PowerPoint import and export.
Description: |-
  GlideDeck puts a whole talk on one infinite canvas and glides, zooms and swoops between ideas.
  It imports PowerPoint decks and exports PowerPoint (with Morph transitions) and PDF, and has templates,
  in-slide animations, presenter view with speaker notes, and an MCP server so Claude and GitHub Copilot
  can build presentations. Native (Rust + wgpu), local-first and free.
