ReleaseNotes: |-
  What's Changed
  - 新增 -k/--traceroute，可显式选择传统 traceroute；nexttrace-tiny 新增可选 MTR TUI、报告和 RAW 模式 by @tsosunchia in nxtrace#229
  - 三个 flavor 均支持 MTR JSON：--mtr --json 输出 NDJSON，-r/-w --json 输出最终报告 by @tsosunchia in nxtrace#230
  - 新增 MTR 会话录制与离线回放；录制可与 TUI、报告、RAW、JSON 输出配合，回放不发起探测 by @tsosunchia in nxtrace#237
  - 扩展 MTR 统计列，新增几何均值与抖动指标；支持自定义列、TUI 列编辑，以及将当前统计保存为 TXT、JSON 或 HTML 报告 by @tsosunchia in nxtrace#231, nxtrace#239, nxtrace#240
  - 新增 --doctor 环境自检，在不发送探测包的情况下报告目标解析、源地址选择、路由预测和后端初始化结果 by @tsosunchia in nxtrace#232
  - 新增 Linux --fwmark，为本地 traceroute 和 MTR 探测设置策略路由标记；系统路由规则仍由用户配置 by @tsosunchia in nxtrace#233
  - 加强 deploy/MCP 请求限制：限制探测参数和登录正文大小，并设置 HTTP 读取与空闲连接超时 by @tsosunchia in nxtrace#228
  - 修复 MTR 与 WebUI 对零 RTT 成功响应的统计和显示问题
  - 修正 --tos 策略路由选源与配置失败处理，并改进抓包过滤，避免无关 TOS 流量混入 by @tsosunchia in nxtrace#236, nxtrace#238
  - 改进 Geo HTTP 连接与缓存复用、DN42 GeoFeed 前缀查询和 MTR 聚合快照处理，降低重复查找与热路径开销 by @tsosunchia in nxtrace#218, nxtrace#219, nxtrace#220, nxtrace#221
  - 升级至 Go 1.27.1，macOS 发布构建最低版本提高至 13.0；更新 quic-go、go-runewidth、miekg/dns、testify 等依赖 by @tsosunchia in nxtrace#216
  额外的：
  本版本尚未切换 nexttrace 和 nexttrace-tiny 的默认模式，默认仍为传统 traceroute。依赖传统 RAW 输出的调用可使用 --traceroute --raw；未来默认模式切换将另行公告。
  MTR TUI 和 --mtr --raw 未指定 -q 时持续运行；report/wide 模式（包括与 --raw 组合）默认每跳探测 10 次。自动化调用请显式设置 -q。
  Linux --fwmark 仅适用于本地 traceroute/MTR，NextTrace 不会修改系统路由规则；设置标记需要相应 Linux capability。
  macOS 最低支持版本为 13.0。源码构建需要 Go 1.27.1+；对齐正式发布构建时使用 GOEXPERIMENT=nojsonv2。
