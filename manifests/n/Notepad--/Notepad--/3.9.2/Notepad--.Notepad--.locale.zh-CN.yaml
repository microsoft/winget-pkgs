ShortDescription: 国产跨平台轻量级文本编辑器（简称 ndd），支持 Windows/macOS/国产 Linux，支持语法高亮、文件对比与大文件快速打开，可替代 Notepad++。
Description: |-
  Notepad--（简称 ndd）是使用 C++ 编写的国产轻量级文本编辑器，支持 Windows、macOS 以及统信 UOS、银河麒麟等国产 Linux 系统。
  软件免费、无广告、无功能限制，提供语法高亮、多标签、正则查找替换、目录内查找、文件与文件夹对比、二进制查看与编辑、文件编码批量转换以及插件扩展等能力，并可流畅打开数 GB 级大文件，目标是完成文本编辑类软件的国产可替代。
