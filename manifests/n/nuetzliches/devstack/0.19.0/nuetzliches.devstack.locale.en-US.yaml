License: MIT OR Apache-2.0
LicenseUrl: https://github.com/nuetzliches/devstack/blob/main/LICENSE-MIT
ShortDescription: Local development orchestrator for a whole stack, its worktrees and its containers
Description: |-
  devstack runs a repository's whole stack on a developer machine: native
  services, their Compose infrastructure and every git worktree beside it,
  each from a build that compiled and passed its health check, so the running
  stack never breaks on a broken save. One CLI, one dashboard in the browser
  and one MCP server for coding agents; lanes can run on a team's server.
Moniker: devstack
Tags:
- cli
- compose
- developer-tools
- docker
- git-worktree
- mcp
- orchestrator
ReleaseNotesUrl: https://github.com/nuetzliches/devstack/releases/tag/v0.19.0
InstallationNotes: |-
  `devstack doctor` checks the machine; `devstack init` drafts a devstack.toml
  in a repository, `devstack up` starts it. `devstack update` updates through
  winget.
