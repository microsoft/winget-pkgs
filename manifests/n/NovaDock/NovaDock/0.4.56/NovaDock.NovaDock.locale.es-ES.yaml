ReleaseNotes: |-
  - Isla dinámica de cristal: sale del borde de arriba como un notch, negra junto a la barra y de cristal al abrirse (Liquid Glass), con la opción de acabado Negro.
  - Todo se mueve con suavidad: menús y paneles se cierran con un fundido, las vistas previas y etiquetas del dock se deslizan entre iconos, y páginas, listas y botones cambian sin saltos.
  - NovaDock vuelve a salir en Administrador de tareas > Aplicaciones de arranque y se abre con Windows; actualizar ya no quita el inicio.
