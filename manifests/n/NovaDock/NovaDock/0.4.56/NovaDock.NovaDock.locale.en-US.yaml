ShortDescription: A macOS-style dock, top menu bar and dynamic island that replace the Windows taskbar.
Description: |-
  NovaDock replaces the Windows 10 and 11 taskbar with a macOS-style desktop:
  - Dock: pinned and open apps with smooth magnification, window previews, folder stacks, a trash can and widgets. It can stay visible or hide when a window covers it.
  - Top menu bar: app menu, active app, clock and calendar, system tray, volume, control center and dozens of optional widgets (system usage, weather, media, network and more).
  - Dynamic island: now playing with album art and controls, volume and brightness indicators, and a temporary shelf to hold files and drag them somewhere else.
  - Notifications: Windows notifications as clean banners at the top right, and a notification center grouped by app.
  - Your style: Liquid Glass, blur or opaque surfaces, light and dark themes, window animations and per-monitor setup.

  NovaDock adapts its animations to your hardware and does not need administrator rights. Closing it brings the Windows taskbar back immediately (emergency shortcut: Ctrl+Alt+Shift+Q), and uninstalling leaves Windows as it was.

  Free 14-day trial. After that, a one-time license is required (up to 3 computers, all updates included); it is purchased on the NovaDock website.
