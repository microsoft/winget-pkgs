ReleaseNotes: |-
  - Glass dynamic island: it now comes out of the top edge like a notch, black next to the bar and made of glass when it opens (Liquid Glass), with a Black finish option.
  - Everything moves smoothly: menus and panels fade out when closing, dock previews and labels glide between icons, and pages, lists and buttons change without jumps.
  - NovaDock shows up in Task Manager > Startup apps again and opens with Windows; updating no longer removes the startup entry.
