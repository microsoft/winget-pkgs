ReleaseNotes: |-
  - Standby screen: like the Mac lock screen, with your wallpaper, the date, a huge glass clock, the weather, battery and volume, and your music with artwork and controls. It appears after a few minutes without using the PC or from the menu, and a click or a key closes it.
  - Music no longer disappears when paused: the island and the standby screen keep showing it while the app is open.
  - A finer dynamic island: its content grows and shrinks with it frame by frame, and its curved edges are smooth.
