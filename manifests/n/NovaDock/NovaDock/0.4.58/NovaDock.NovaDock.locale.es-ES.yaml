ReleaseNotes: |-
  - Pantalla de reposo: como la pantalla de bloqueo del Mac, con tu fondo, la fecha, un reloj enorme de cristal, el tiempo, la batería y el volumen, y la música con carátula y controles. Sale tras unos minutos sin usar el PC o desde el menú, y se quita con un clic o una tecla.
  - La música ya no desaparece al pausar: la isla y la pantalla de reposo la siguen enseñando mientras el programa esté abierto.
  - Isla dinámica más fina: su contenido crece y encoge con ella fotograma a fotograma, y sus bordes curvos se ven lisos.
