ShortDescription: Un dock estilo macOS, una barra superior y una isla dinámica que sustituyen a la barra de tareas de Windows.
Description: |-
  NovaDock sustituye la barra de tareas de Windows 10 y 11 por un escritorio al estilo de macOS:
  - Dock: apps fijadas y abiertas con ampliación fluida, vistas previas de ventanas, pilas de carpetas, papelera y widgets. Puede quedarse visible o esconderse cuando una ventana lo tapa.
  - Barra superior: menú de la app, app activa, reloj y calendario, bandeja del sistema, volumen, centro de control y decenas de widgets opcionales (uso del sistema, tiempo, música, red y más).
  - Isla dinámica: lo que suena con carátula y controles, indicadores de volumen y brillo, y una bandeja temporal para guardar archivos y arrastrarlos a otro sitio.
  - Notificaciones: los avisos de Windows como banners limpios arriba a la derecha, y un centro de notificaciones agrupado por app.
  - Tu estilo: superficies Liquid Glass, Desenfoque u Opaco, tema claro y oscuro, animaciones de ventana y configuración por monitor.

  NovaDock adapta sus animaciones al equipo y no necesita permisos de administrador. Al cerrarlo, la barra de tareas de Windows vuelve al momento (atajo de emergencia: Ctrl+Alt+Mayús+Q), y al desinstalarlo Windows queda como estaba.

  Prueba gratuita de 14 días. Después hace falta una licencia de pago único (hasta 3 equipos, todas las actualizaciones incluidas), que se compra en la web de NovaDock.
