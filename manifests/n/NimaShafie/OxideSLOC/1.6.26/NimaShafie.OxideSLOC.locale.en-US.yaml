ReleaseNotes: "## Download\n\n| Platform | File | Notes |\n|---|---|---|\n| Linux x86-64 | `oxide-sloc-linux-x86_64` | Static binary (musl) — works on any x86-64 Linux |\n| Linux arm64 | `oxide-sloc-linux-arm64` | Requires glibc ≥ 2.17 (Raspberry Pi 4, AWS Graviton, Ampere, etc.) |\n| Windows x86-64 | `oxide-sloc-windows-x86_64.exe` | Windows 10/11 |\n| Windows x86-64 (archive) | `oxide-sloc-windows-x64.zip` / `oxide-sloc-windows-x64.tar.gz` | Same exe, zipped/tarred — used by `scripts/run.sh` + `install.sh` prebuilt path (`.tar.gz` preferred on locked-down hosts) |\n| macOS x86-64 | `oxide-sloc-macos-x86_64` | Intel Mac |\n| macOS Apple Silicon | `oxide-sloc-macos-arm64` | M1/M2/M3/M4 Mac |\n| Vendor archive | `vendor.tar.gz.aa` + `.ab` + `.ac` + `vendor.checksums.sha256` | Rust dependency sources (split gzip parts) for air-gapped builds |\n| SBOM (CycloneDX) | `oxide-sloc.cdx.json` / `sbom.cdx.json` | Syft + cargo-cyclonedx software bill of materials |\n| SBOM (SPDX) | `oxide-sloc.spdx.json` | Syft software bill of materials (SPDX 2.3) |\n| Vulnerability report | `grype-report.txt` | Grype scan of the CycloneDX SBOM |\n\nChecksums for all release assets are in `SHA256SUMS.txt`.\nGPG detached signatures (`.sig`), Sigstore cosign bundles (`.bundle`), and SLSA provenance attestations (`.sigstore.json`) are included for each binary.\nSupply chain scanned with **Syft** (SBOM), **Grype**, and **Trivy** — full results also in the repository's Security → Code scanning tab. See `docs/supply-chain.md`.\nThe GPG public key used for signing is `oxide-sloc-signing-key.asc`.\n\n## Quick install\n\n```bash\n# Linux x86-64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.26/oxide-sloc-linux-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Linux arm64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.26/oxide-sloc-linux-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Apple Silicon)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.26/oxide-sloc-macos-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Intel)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.26/oxide-sloc-macos-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Windows — rename and add to PATH\nren oxide-sloc-windows-x86_64.exe oxide-sloc.exe\n\n# Verify checksum (Linux / macOS)\nsha256sum --check SHA256SUMS.txt\n\n# Verify GPG signature (Linux / macOS)\ngpg --import oxide-sloc-signing-key.asc\ngpg --verify oxide-sloc-linux-x86_64.sig oxide-sloc-linux-x86_64\n\n# Verify cosign bundle (keyless — requires cosign installed).\n# The identity flags pin the signature to this repo's release workflow.\ncosign verify-blob \\\n  --bundle oxide-sloc-linux-x86_64.bundle \\\n  --certificate-identity-regexp '^https://github.com/oxide-sloc/oxide-sloc/\\.github/workflows/release\\.yml@refs/tags/v' \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n  oxide-sloc-linux-x86_64\n```\n\n## Air-gapped build\n\n```bash\n# Download source + vendor archive from this release, then on the air-gapped machine:\nbash scripts/internal/airgap-build.sh\n```\n\n## Or build from source (requires Rust 1.98+)\n\n```bash\ncargo install --git https://github.com/oxide-sloc/oxide-sloc oxide-sloc\n```\n\n\n## Overview\n\noxide-sloc v1.6.26 is a focused CLI-usability and maintenance release. It makes report\ngeneration land somewhere predictable and open reliably, adds a one-flag way to emit every\nreport format from a single scan, and trims supply-chain scan noise in CI.\n\n## What's Changed\n\n### New Features\n• **`analyze --all-formats`**：a single bundle flag that writes JSON, HTML, PDF, and CSV artifacts from one scan, instead of passing a separate `--*-out` flag per format.\n\n### Bug Fixes\n• **Reliable `analyze --open`**：reports now default to the Desktop when no output path is given, so the generated report always lands in a predictable location and opens as expected.\n\n### Security Hardening\n• Trivy SARIF upload is now limited to HIGH/CRITICAL severities, so sub-HIGH OS-package noise no longer opens GitHub code-scanning alerts.\n\n### Documentation\n• Refreshed report styling and bumped workspace dependencies to the latest compatible versions; updated the CHANGELOG, badges, and version-example snippets to v1.6.26.\n\n**Full Changelog**：https://github.com/oxide-sloc/oxide-sloc/compare/v1.6.25...v1.6.26"
