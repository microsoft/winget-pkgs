ReleaseNotes: "## Download\n\n| Platform | File | Notes |\n|---|---|---|\n| Linux x86-64 | `oxide-sloc-linux-x86_64` | Static binary (musl) — works on any x86-64 Linux |\n| Linux arm64 | `oxide-sloc-linux-arm64` | Requires glibc ≥ 2.17 (Raspberry Pi 4, AWS Graviton, Ampere, etc.) |\n| Windows x86-64 | `oxide-sloc-windows-x86_64.exe` | Windows 10/11 |\n| macOS x86-64 | `oxide-sloc-macos-x86_64` | Intel Mac |\n| macOS Apple Silicon | `oxide-sloc-macos-arm64` | M1/M2/M3/M4 Mac |\n| Vendor archive | `vendor.tar.gz.aa` + `.ab` + `.ac` + `vendor.checksums.sha256` | Rust dependency sources (split gzip parts) for air-gapped builds |\n| SBOM (CycloneDX) | `oxide-sloc.cdx.json` / `sbom.cdx.json` | Syft + cargo-cyclonedx software bill of materials |\n| SBOM (SPDX) | `oxide-sloc.spdx.json` | Syft software bill of materials (SPDX 2.3) |\n| Vulnerability report | `grype-report.txt` | Grype scan of the CycloneDX SBOM |\n\nChecksums for all release assets are in `SHA256SUMS.txt`.\nGPG detached signatures (`.sig`), Sigstore cosign bundles (`.bundle`), and SLSA provenance attestations (`.sigstore.json`) are included for each binary.\nSupply chain scanned with **Syft** (SBOM), **Grype**, and **Trivy** — full results also in the repository's Security → Code scanning tab. See `docs/supply-chain.md`.\nThe GPG public key used for signing is `oxide-sloc-signing-key.asc`.\n\n## Quick install\n\n```bash\n# Linux x86-64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.24/oxide-sloc-linux-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Linux arm64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.24/oxide-sloc-linux-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Apple Silicon)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.24/oxide-sloc-macos-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Intel)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.24/oxide-sloc-macos-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Windows — rename and add to PATH\nren oxide-sloc-windows-x86_64.exe oxide-sloc.exe\n\n# Verify checksum (Linux / macOS)\nsha256sum --check SHA256SUMS.txt\n\n# Verify GPG signature (Linux / macOS)\ngpg --import oxide-sloc-signing-key.asc\ngpg --verify oxide-sloc-linux-x86_64.sig oxide-sloc-linux-x86_64\n\n# Verify cosign bundle (keyless — requires cosign installed).\n# The identity flags pin the signature to this repo's release workflow.\ncosign verify-blob \\\n  --bundle oxide-sloc-linux-x86_64.bundle \\\n  --certificate-identity-regexp '^https://github.com/oxide-sloc/oxide-sloc/\\.github/workflows/release\\.yml@refs/tags/v' \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n  oxide-sloc-linux-x86_64\n```\n\n## Air-gapped build\n\n```bash\n# Download source + vendor archive from this release, then on the air-gapped machine:\nbash scripts/internal/airgap-build.sh\n```\n\n## Or build from source (requires Rust 1.98+)\n\n```bash\ncargo install --git https://github.com/oxide-sloc/oxide-sloc oxide-sloc\n```\n\n\n## Overview\n\noxide-sloc v1.6.24 focuses on **adoption, interoperability, and supply-chain trust**. It adds\nmachine-readable exports so oxide-sloc plugs into the code-scanning and line-counting surfaces\nother tools already speak (SARIF, Code Climate, Bitbucket Code Insights, cloc-JSON), layers in\nindustry-standard SBOM + vulnerability scanning (Syft, Grype, Trivy) on top of the existing\nattestation stack, and hardens the REST contract so the published OpenAPI spec can never drift\nfrom the running binary.\n\n## What's Changed\n\n### New Features\n• **Code-scanning & interchange exports**：new `--sarif-out` / `--codeclimate-out` /\n  `--bitbucket-out` / `--cloc-out` / `--code-scan-complexity` flags on `analyze` and `report`\n  emit SARIF 2.1.0 (GitHub code scanning + GitLab SAST), GitLab Code Quality (Code Climate) JSON,\n  Bitbucket Code Insights, and cloc-compatible JSON, backed by a new `sloc-report::exports` module.\n• **Supply-chain scanning (Syft, Grype, Trivy)**：releases now publish Syft SBOMs in SPDX and\n  CycloneDX plus a Grype vulnerability report as release assets; Trivy scans the filesystem on push\n  and the container image by digest; all three upload SARIF to GitHub code scanning. Report-only —\n  `cargo-audit` / `cargo-deny` remain the hard gate. The air-gap kit carries a `security/` folder so\n  the reports travel offline.\n• **Self-stamping OpenAPI contract**：`/api/openapi.yaml` rewrites `info.version` from the running\n  binary at serve time, so the published contract never lags the crate version. The spec also gains\n  the webhook and scan-schedule paths.\n• **API contract guide + CI preflight**：new `docs/api-contract.md` for embedding oxide-sloc, plus\n  `scripts/preflight.{sh,ps1}` to verify a server's health/version before a scan, wired into Jenkins\n  via `RUN_PREFLIGHT` and a `SCAN_TOOL_VERSION` pin.\n• **Prometheus metrics enriched**：`/metrics` now exposes last-run code-metric gauges (code/comment/\n  blank lines, files, test functions, cyclomatic complexity) alongside the run counter.\n• **Packaging & ecosystem**：`cargo-deb` / `cargo-generate-rpm` metadata for `.deb`/`.rpm`\n  installers, a `.pre-commit-hooks.yaml`, `CITATION.cff`, a JSON Schema for the TOML config, and a\n  reproducible-build verification workflow (weekly double-rebuild asserting byte-identical binaries).\n\n### Bug Fixes\n• **rustls 0.23.45 → 0.23.46**：clears four advisories published 2026-10-14 (RUSTSEC-2026-0346/7/8/9)\n  surfaced by the CI `cargo-audit` gate; vendor archive + checksums regenerated to match.\n\n### Documentation\n• New `docs/supply-chain.md` and `docs/reproducible-builds.md`; README features/comparison,\n  SUMMARY, ROADMAP, and CI-integrations export section updated.\n\n## Full Changelog\n\nhttps://github.com/oxide-sloc/oxide-sloc/compare/v1.6.23...v1.6.24"
