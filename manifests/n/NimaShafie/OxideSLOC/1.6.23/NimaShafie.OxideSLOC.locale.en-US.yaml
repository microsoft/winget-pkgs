ReleaseNotes: "## Download\n\n| Platform | File | Notes |\n|---|---|---|\n| Linux x86-64 | `oxide-sloc-linux-x86_64` | Static binary (musl) — works on any x86-64 Linux |\n| Linux arm64 | `oxide-sloc-linux-arm64` | Requires glibc ≥ 2.17 (Raspberry Pi 4, AWS Graviton, Ampere, etc.) |\n| Windows x86-64 | `oxide-sloc-windows-x86_64.exe` | Windows 10/11 |\n| macOS x86-64 | `oxide-sloc-macos-x86_64` | Intel Mac |\n| macOS Apple Silicon | `oxide-sloc-macos-arm64` | M1/M2/M3/M4 Mac |\n| Vendor archive | `vendor.tar.gz.aa` + `.ab` + `.ac` + `vendor.checksums.sha256` | Rust dependency sources (split gzip parts) for air-gapped builds |\n\nChecksums for all release assets are in `SHA256SUMS.txt`.\nGPG detached signatures (`.sig`), Sigstore cosign bundles (`.bundle`), and SLSA provenance attestations (`.sigstore.json`) are included for each binary.\nThe GPG public key used for signing is `oxide-sloc-signing-key.asc`.\n\n## Quick install\n\n```bash\n# Linux x86-64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.23/oxide-sloc-linux-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Linux arm64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.23/oxide-sloc-linux-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Apple Silicon)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.23/oxide-sloc-macos-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Intel)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.23/oxide-sloc-macos-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Windows — rename and add to PATH\nren oxide-sloc-windows-x86_64.exe oxide-sloc.exe\n\n# Verify checksum (Linux / macOS)\nsha256sum --check SHA256SUMS.txt\n\n# Verify GPG signature (Linux / macOS)\ngpg --import oxide-sloc-signing-key.asc\ngpg --verify oxide-sloc-linux-x86_64.sig oxide-sloc-linux-x86_64\n\n# Verify cosign bundle (keyless — requires cosign installed).\n# The identity flags pin the signature to this repo's release workflow.\ncosign verify-blob \\\n  --bundle oxide-sloc-linux-x86_64.bundle \\\n  --certificate-identity-regexp '^https://github.com/oxide-sloc/oxide-sloc/\\.github/workflows/release\\.yml@refs/tags/v' \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n  oxide-sloc-linux-x86_64\n```\n\n## Air-gapped build\n\n```bash\n# Download source + vendor archive from this release, then on the air-gapped machine:\nbash scripts/internal/airgap-build.sh\n```\n\n## Or build from source (requires Rust 1.98+)\n\n```bash\ncargo install --git https://github.com/oxide-sloc/oxide-sloc oxide-sloc\n```\n\n\n## What's Changed\n• chore：update dist Windows binaries (v1.6.22) by @oxide-sloc-toolchain-bot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/150\n• chore：update dist Linux binary (v1.6.22) by @oxide-sloc-toolchain-bot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/151\n• chore(deps)：bump github/codeql-action/upload-sarif from 88585263c0627ee42c0e1c5143a112c8d6f4aa18 to 2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/152\n• chore(deps)：bump dtolnay/rust-toolchain from 02cb101ec7c40f2c49e1d9714d64511d8e1b74de to 7e38f4b43b4db5c8dd498af069a4f6196df1d067 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/153\n• chore(deps)：bump github/codeql-action/init from 88585263c0627ee42c0e1c5143a112c8d6f4aa18 to 2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/154\n• chore(deps)：bump github/codeql-action/analyze from 88585263c0627ee42c0e1c5143a112c8d6f4aa18 to 2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/155\n• chore(deps)：bump xxhash-rust from 0.8.15 to 0.8.19 in /ci/tools in the cargo group across 1 directory by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/156\n• chore：update bundled Rust toolchain (1.99) by @oxide-sloc-toolchain-bot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/157\n\n\n**Full Changelog**：https://github.com/oxide-sloc/oxide-sloc/compare/v1.6.22...v1.6.23"
