ReleaseNotes: "## Download\n\n| Platform | File | Notes |\n|---|---|---|\n| Linux x86-64 | `oxide-sloc-linux-x86_64` | Static binary (musl) — works on any x86-64 Linux |\n| Linux arm64 | `oxide-sloc-linux-arm64` | Requires glibc ≥ 2.17 (Raspberry Pi 4, AWS Graviton, Ampere, etc.) |\n| Windows x86-64 | `oxide-sloc-windows-x86_64.exe` | Windows 10/11 |\n| macOS x86-64 | `oxide-sloc-macos-x86_64` | Intel Mac |\n| macOS Apple Silicon | `oxide-sloc-macos-arm64` | M1/M2/M3/M4 Mac |\n| Vendor archive | `vendor.tar.gz.aa` + `.ab` + `.ac` + `vendor.checksums.sha256` | Rust dependency sources (split gzip parts) for air-gapped builds |\n\nChecksums for all release assets are in `SHA256SUMS.txt`.\nGPG detached signatures (`.sig`), Sigstore cosign bundles (`.bundle`), and SLSA provenance attestations (`.sigstore.json`) are included for each binary.\nThe GPG public key used for signing is `oxide-sloc-signing-key.asc`.\n\n## Quick install\n\n```bash\n# Linux x86-64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.19/oxide-sloc-linux-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Linux arm64\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.19/oxide-sloc-linux-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Apple Silicon)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.19/oxide-sloc-macos-arm64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# macOS (Intel)\ncurl -Lo oxide-sloc https://github.com/oxide-sloc/oxide-sloc/releases/download/v1.6.19/oxide-sloc-macos-x86_64\nchmod +x oxide-sloc && sudo mv oxide-sloc /usr/local/bin/\n\n# Windows — rename and add to PATH\nren oxide-sloc-windows-x86_64.exe oxide-sloc.exe\n\n# Verify checksum (Linux / macOS)\nsha256sum --check SHA256SUMS.txt\n\n# Verify GPG signature (Linux / macOS)\ngpg --import oxide-sloc-signing-key.asc\ngpg --verify oxide-sloc-linux-x86_64.sig oxide-sloc-linux-x86_64\n\n# Verify cosign bundle (keyless — requires cosign installed).\n# The identity flags pin the signature to this repo's release workflow.\ncosign verify-blob \\\n  --bundle oxide-sloc-linux-x86_64.bundle \\\n  --certificate-identity-regexp '^https://github.com/oxide-sloc/oxide-sloc/\\.github/workflows/release\\.yml@refs/tags/v' \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n  oxide-sloc-linux-x86_64\n```\n\n## Air-gapped build\n\n```bash\n# Download source + vendor archive from this release, then on the air-gapped machine:\nbash scripts/internal/airgap-build.sh\n```\n\n## Or build from source (requires Rust 1.98+)\n\n```bash\ncargo install --git https://github.com/oxide-sloc/oxide-sloc oxide-sloc\n```\n\n\n## What's Changed\n• chore：update dist Linux binary (v1.6.18) by @oxide-sloc-toolchain-bot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/122\n• chore：update dist Windows binaries (v1.6.18) by @oxide-sloc-toolchain-bot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/121\n• chore(deps)：bump docker/setup-buildx-action from 4.2.0 to 4.3.0 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/123\n• chore(deps)：bump github/codeql-action/init from 4.37.6 to 4.37.7 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/124\n• chore(deps)：bump github/codeql-action/analyze from 4.37.6 to 4.37.7 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/125\n• chore(deps)：bump github/codeql-action/upload-sarif from 4.37.6 to 4.37.7 by @dependabot[bot] in https://github.com/oxide-sloc/oxide-sloc/pull/126\n\n\n**Full Changelog**：https://github.com/oxide-sloc/oxide-sloc/compare/v1.6.18...v1.6.19"
