ShortDescription: One library for every AI coding tool's skills
Description: |-
  skills-hub browses, tags and toggles the skills, agents, commands and rules that AI coding tools keep in a dozen different folders, working directly on the folders those tools actually read.
  It knows Claude Code, Cursor, Codex, OpenCode, GitHub Copilot, Cline, Windsurf, Gemini CLI and a dozen more, and every path is editable, so a tool that moves its folders does not have to wait for a release.
