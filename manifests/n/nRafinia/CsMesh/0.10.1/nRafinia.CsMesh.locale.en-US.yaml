ReleaseNotes: |-
  0.10.1
  Fixes for csmesh run outside a git repository.
  - Root detection no longer stops at a .csmesh folder that holds no index. Before,
    a stray .csmesh in a parent directory (for example the user home) became the root
    for every unmarked folder beneath it, and index there could fail with exit 70.
  - Telemetry no longer creates a .csmesh folder. A failed command in a plain folder
    used to leave one behind, which then triggered the problem above.
  - Indexing skips a directory it cannot read instead of failing the whole run.
  - The MCP server picks a workspace root that holds an index or a C# project, not one
    that only holds a stray .csmesh.
  If you have a .csmesh folder in your home directory with no graph.json in it,
  you can delete it.
  📦 Installation & Upgrades
  Global .NET Tool
  dotnet tool update --global CsMesh
  Automatic One-Line Install Script
  Linux & macOS:
  curl -fsSL https://raw.githubusercontent.com/nRafinia/CsMesh/main/install.sh | sh
  Windows (PowerShell):
  irm https://raw.githubusercontent.com/nRafinia/CsMesh/main/install.ps1 | iex
  Quick Setup for AI Assistants
  # Install skills and register MCP server in one command:
  csmesh install -g --all
  csmesh index --full
