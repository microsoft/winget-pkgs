PrivacyUrl: https://github.com/n2ns/hyper-hand/blob/v0.6.1/docs/privacy.md
PackageName: HyperHand
PackageUrl: https://github.com/n2ns/hyper-hand
License: MIT
LicenseUrl: https://github.com/n2ns/hyper-hand/blob/v0.6.1/LICENSE
ShortDescription: MCP server that lets AI agents see and operate Windows virtual machines on Hyper-V.
Description: |-
  HyperHand connects MCP clients to Windows virtual machines on Hyper-V for screenshots,
  desktop interaction, command execution, file transfer and checkpoints. The host-to-guest
  connection uses Hyper-V sockets and does not require guest network access.
  Requires Windows 10 or 11 Pro or Enterprise with Hyper-V already enabled.
Moniker: hyperhand
Tags:
- automation
- hyper-v
- mcp
- virtual-machine
ReleaseNotesUrl: https://github.com/n2ns/hyper-hand/releases/tag/v0.6.1
InstallationNotes: |-
  Open HyperHand's tray settings to copy the MCP endpoint and connect your AI client.
  After an update, reconnect the client and run vm_update_agent for each virtual machine.
  Run WinGet from an elevated terminal when uninstalling HyperHand.
ManifestType: defaultLocale
