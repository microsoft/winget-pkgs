ReleaseNotes: |-
  CodeNomad 1.2.0 — Multiple servers, conversation permissions and voice
  Open projects from several CodeNomad servers in one window, control when an agent should ask before acting, and dictate or talk live to your active conversation. CodeNomad 1.2 also moves programmed Missions onto native OpenCode Automations, brings OpenCode 2.4.2’s browser tools into desktop previews, and delivers major responsiveness gains across long sessions and busy workspaces.
  Before upgrading
  - OpenCode 2.4.2 is the minimum and recommended runtime. CodeNomad 1.2 refuses older OpenCode services. Updating CodeNomad does not update or restart OpenCode: review Settings → OpenCode, install or select a compatible executable, and explicitly restart the shared service when needed. That restart can interrupt other connected clients (#1582, #1709, #1710, #1734, #1828).
  - The remotely updated 1.2 interface requires a CodeNomad 1.2.0+ server for conversation permissions and updated server routes. Older servers retain their cached or bundled interface until the application/server is updated.
  - Yolo is replaced by per-conversation permissions. Existing conversations start in Autonomous mode and follow OpenCode’s rules. CodeNomad does not auto-approve requests (#1608).
  - Programmed Missions now run as native OpenCode Automations. Existing schedules from CodeNomad 1.1 are taken over automatically on the server; daily schedules created with CodeNomad 1.0.1 or 1.1.0 are no longer shown or run and can be recreated as programmed Missions (#1789, #1791, #1811, #1818, #1834).
  - Windows packages ship without production code signing. Windows may show an unknown-publisher warning.
  Projects from several servers
  - Open local and remote projects side by side as regular tabs in the same window. The New tab page replaces Home with recent projects identified by server, saved servers and project-opening actions (#1629, #1662, #1701, #1702, #1706).
  - Remote projects support attachment downloads and pairing links opened from external pages alongside local tabs (#1653, #1696).
  - Closing one occurrence of a project leaves its conversations running and keeps the same project available in other windows, while cleanly releasing that window’s workspace records. Clicking a desktop notification opens the conversation it refers to (#1666, #1670).
  Per-conversation permissions
  - Yolo is replaced by per-conversation permissions in Status → Permissions: choose Autonomous to use OpenCode’s existing rules, or Supervised to ask before file edits and shell commands while keeping existing denials in place. Set a default for new conversations in Preferences (#1608).
  - Pending-request recovery prioritizes the currently shown project, scans a session’s directory when opened, silences transient recovery warnings and avoids idle wake-up loops or lingering compaction holds (#1584, #1590, #1634, #1635, #1760, #1781, #1807).
  Unified voice: dictation, playback and live conversation
  - Configure dictation, response playback and live conversation together in Preferences → Voice (#1596).
  - Dictate with local Hex (kept warm between dictations on supported systems) or a configured API provider, and use the push-to-talk control directly in the primary composer actions (#1663, #1665, #1685).
  - Hold a live voice conversation with your agent using Gemini Live or OpenAI Realtime directly against the active session (#1596).
  Native Automations and simpler programmed Missions
  - Inspect and manage a conversation’s OpenCode Automations directly from the Status panel (#1805).
  - Programmed Missions now run directly on OpenCode’s native Code Mode Automations instead of a separate schedule engine: one programmed Mission launches again on its schedules or repository/forge events — including remote branch commits — even with CodeNomad closed, and runs cleanly in its coordinator conversation (#1591, #1799, #1800, #1802, #1803, #1804, #1808, #1810, #1832, #1833, #1834).
  - Manage a programmed Mission from its ordinary row and toolbar with one pause control and a waiting hourglass indicator, automatic server-side takeover of existing 1.1 schedules, and full agent control through mission.program (#1811, #1816, #1818, #1825, #1826, #1827).
  - Enable an opt-in coordinator /goal with unattended restart recovery, let one conversation coordinate several Missions, allow ordinary session families to span worktrees, confirm before replacing saved Mission configurations, and disable the OpenCode Missions plugin from the right panel (#1678, #1705, #1740, #1748, #1788, #1795, #1831).
  - Verification-only Debugging reports (no-change and verified completion without extra tasks) and descendant question indicators on completed Missions work cleanly (#1626, #1648, #1779).
  Native browser tools and workspace links
  - With OpenCode 2.4, agents can drive the visible desktop session preview through OpenCode’s native browser tools, with console and network inspection on Electron and Windows Tauri, single-tab preview ownership, reliable clicks on scrolled pages and accurate followed-link delivery (#1658, #1660, #1669, #1724, #1725, #1742, #1744, #1745, #1762).
  - Mentioned worktree files — including bare paths, inline code and non-ASCII filenames — open directly in the file reader. On desktop, links to local folders and files such as PDFs or videos open in the system’s default application (#1721, #1723, #1780, #1798).
  Faster, steadier conversations and workspace
  - Pin favorite conversations in the session list, choose how tool groups expand in the transcript, keep the Custom Message content preset as a selectable option, and inspect multi-file patch diffs (#1580, #1673, #1677, #1777).
  - Background shell rows in Status are simplified, Status section cards reorder only from their grip handle, and the browser logo stays aligned beside project tabs (#1587, #1719, #1796).
  - Major rendering and responsiveness improvements: one-write-per-frame transcript scrolling, batched delta streaming and chunked hydration, bounded subagent card scrollers, on-demand loading for stored user attachments, faster session-list and worktree lookups, deduplicated automation checks and automatic recovery of missed replies (#1644, #1647, #1683, #1684, #1687, #1689, #1690, #1697, #1707, #1763, #1809, #1821, #1822).
  - Unsaved Workspace file edits survive restarts, the editor prevents overwriting concurrent disk edits, and mobile web apps preserve composer height when the virtual keyboard shrinks the window (#1637, #1699, #1728, #1812).
  Desktop, extensions and OpenCode 2.4.2
  - Full qualification for OpenCode 2.4.2, including Code Mode generate_image in the Images gallery and Design agent, native cascading Session.move for session families, updated SDK clients, generic plugin provider-usage RPC and clearer memory rules (#1576, #1709, #1710, #1715, #1828, #1829, #1842).
  - Panel extension API 4 adds the panel.notes permission and links forge items to worktrees (#1599, #1600).
  - Desktop reliability improvements: partition-delta client-state persistence kept off the native event loop, timestamped server log files beside the configuration, in-place renewal of expired managed desktop sessions, more time for Windows windows to save before Install and restart, skipping Git checks for non-checkout folders, and updated bundled npm 12.2.3 (#1578, #1594, #1693, #1694, #1695, #1703, #1708, #1737, #1738, #1757, #1766).
  Support CodeNomad
  CodeNomad is free and open source, maintained full time by Pascal André. You can support its continued development through GitHub Sponsors or Ko-fi.
