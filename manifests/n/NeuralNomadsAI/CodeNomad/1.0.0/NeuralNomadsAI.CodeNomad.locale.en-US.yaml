ReleaseNotes: |-
  CodeNomad 1.0.0 — OpenCode V2, on desktop and mobile
  The best desktop and mobile client for OpenCode V2.
  0.20.0 brought CodeNomad to OpenCode V2. 1.0.0 turns more of its native power into a complete workspace: coordinated agents, deeper history access and visual automation, with speed, efficiency and everyday stability at its core.
  Highlights
  - Desktop and mobile: Pair another device through OpenTunnel-powered Remote Control, with an interface adapted to phones and tablets.
  - Very fast and efficient: Responsive streaming and navigation, controlled resource use and persistent workspace state support demanding, long-running agent workflows.
  - Missions: Combine OpenCode V2's native sessions, subagents and human questions into coordinated work toward an objective.
  - Beyond the public API: Native plugins and RPC unlock full-history queries, timeline navigation and selective cleanup.
  - Visual automation: Let agents inspect and operate CodeNomad and desktop browser previews to check what they build.
  - An extensible workspace: Files/Git, panel extensions, online help, customizable shortcuts and signed Tauri updates complete the experience.
  Built for demanding workflows
  - A responsive workspace: Streaming, search and navigation render the content you need, while project restoration prioritizes your active conversation.
  - Controlled resource use: Bounded history queries, targeted rendering and lazy Files/Git refreshes support large conversations and busy repositories without loading everything into the interface.
  - Built for long sessions: Stable reading anchors and on-demand output expansion let you inspect earlier work while agents continue running.
  - Continuity across your work: Saved projects, drafts and window state carry your workspace across sessions; native request recovery keeps questions and permissions connected to their conversations.
  Built around OpenCode V2
  - The shared OpenCode service keeps conversations available to terminal and other clients. New sessions respect native default agents, including plugin-provided defaults; collapsed families show subagent activity.
  - Attach skills through @; inspect Code Mode scripts, nested tool calls and web-search sources. Search providers support global defaults and project overrides.
  - Answer native questions and permissions above the composer, with source labels, preserved drafts and readable answer/decision receipts.
  - Manage native provider accounts and optionally rotate eligible subscription accounts when a quota is exhausted. Usage follows the selected account; Stats adds service-wide activity, token, recorded cost and per-model views.
  Missions and native multi-agent coordination
  - An objective becomes a plan: Coordinators delegate to specialists through real OpenCode sessions, native subagents or independent conversations, using your chosen agents, models and reasoning settings.
  - Five approaches: Flexible, Debugging, Exploration, Product delivery and Compare two models. The new comparison scenario gives two models the same task, then produces a blind, scored verdict. Dependencies and results remain visible as plans evolve.
  - Human decisions stay human: Native questions and permissions bring you into the work; milestone briefings, summaries and reports explain progress without requiring you to follow every conversation.
  - One-time or daily work: Prepare and explicitly start a mission, use pause/stop/recovery controls, and save reusable briefs. Execution, background work and plugin infrastructure stay native to OpenCode—not a replacement engine.
  From your desktop to your phone
  - Remote Control uses OpenTunnel, as does OpenCode's remote pairing: access your running workspace from a mobile browser or another desktop without opening an inbound port or configuring a VPN. Devices are revocable; enabled Remote Control resumes at launch.
  - The composer follows the on-screen keyboard; questions and permission actions stay reachable. Tablet panels remember portrait/landscape layouts, with compact headers and touch-friendly menus.
  - Mobile uses the responsive web interface, not a native iOS/Android app. Direct/LAN access remains a separate option.
  History and visual automation
  - Native plugins run inside OpenCode and expose authenticated RPC over stored history, extending the public API with full-session/workspace search, timeline navigation and technical-content cleanup. Results identify their conversation and worktree and open the matching exchange.
  - Agents can inspect, click, type, select, scroll, drag, use keyboard shortcuts and wait for results in CodeNomad and desktop browser previews—verifying rendered work, not only editing source.
  - Each conversation retains its browser page and navigation history. Preview tabs share sign-ins within the desktop profile, separately from the trusted application.
  Files, Git and everyday work
  - Workspace, Changes and Commits share one Files panel: edit text/Markdown, inspect images and diffs, stage/unstage, review history and initialize Git. Scoped filesystem updates refresh visible folders; large inventories stay responsive and refreshed diffs preserve selection and scroll.
  - Temporary projects, tab renaming, a compact launcher and Back/Forward conversation navigation simplify everyday work. Shortcuts jump between your own messages, and an alternate send (Alt+Enter by default) queues or steers a follow-up against your usual choice. An optional whitespace filter focuses reviews on meaningful changes.
  - Native worktrees, session-family navigation, device attachments and /btw build on 0.20.0. After sending, use the conversation for keyboard reading; typing resumes the composer.
  Extensions, help and customization
  - Install panel extensions from the online catalogue without rebuilding CodeNomad. MCP Assets collects tool-returned images and attachments with explicit session-asset consent. Native OpenCode plugins retain Global/Project activation and package check/update actions.
  - Online help covers setup and workflows in ten languages, from Help and the command palette.
  - Customizable shortcuts, notification routing and unread badges join compact Settings, localized menus and more consistent light/dark surfaces. Message content presets choose how much of each response to show. A new hexagon CN logo marks the app, and macOS windows use native window controls with a single menu bar. SideCars provide additional workspace panels.
  Desktop updates and setup
  - Signed Tauri updates support Windows, macOS Intel/Apple Silicon and Linux AppImage. Stable/Preview feeds are separate from data profiles, preserving your tabs and drafts when changing feeds. Settings → General lists the data profiles on this computer, switches to one or creates and deletes them.
  - OpenCode setup adds clearer progress, interrupted-install recovery and explicit restart controls. Older installations on PATH no longer leave setup without a path forward.
  - Preferences restore the correct project context; incomplete request recovery preserves known questions and permissions and reports its cause.
  Upgrading
  - OpenCode 2.1.2 or newer is required; 2.1.4 is recommended. This release adopts the OpenCode 2.1 message, event and plugin contracts, and 2.1.2 fixes Code Mode's JavaScript execution order. With 2.1.4, input requests from MCP servers appear in the request dock. CLI updates and shared-service restarts remain separate; Git enables the full repository/worktree experience.
  - Downloads: Windows Tauri .exe or Electron .zip; Linux Tauri AppImage or Electron .deb; Tauri or Electron macOS builds, separate for Intel and Apple Silicon. The Electron .deb replaces the former Tauri .deb—choose AppImage to stay on Tauri.
  - Stable 0.20.0/0.20.1 users install from the release download or package manager; recent signed previews already have the updater. Update remote CodeNomad servers too. Multi-window state, restoration and named profiles remain supported.
  - The macOS builds are not yet notarized by Apple: macOS can block their first launch, see Troubleshooting → macOS quarantine. The Windows installer is not code-signed, so SmartScreen can ask for confirmation.
  Thanks for contributions
  Thanks to creator @shantur, @pascalandr, @heunghingwan, and everyone who contributed ideas, reports and testing.
