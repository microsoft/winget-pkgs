ShortDescription: Bring back photos, videos and documents from a Synology NAS hit by ransomware.
Description: |-
  NAS Salvage is a Windows app for people whose Synology NAS was hit by ransomware (files ending in .L0CK3D).
  It connects to the NAS over the local network, only reads it, and shows a free folder-by-folder scan of what can still be brought back.
  Nothing is uploaded to a cloud; files are saved to your PC or a USB drive.
  The scan, previews and the first 500 MB of saved files per NAS are free; one-time packs start at $49.
  Not affiliated with Synology.
