ShortDescription: A fast, native desktop GUI for browsing and querying large JSON files with jq, JSONPath, JMESPath and JSON Pointer.
Description: |-
  jsonquery gui is a native desktop tool for browsing and querying large JSON files. Drag in a file, open a URL or paste JSON directly, then query it with jq, JSON Pointer (RFC 6901), JSONPath (RFC 9535) or JMESPath. Results stream into a searchable tree or text view.
  Features include optional inline autocomplete for each dialect's functions and the loaded document's own keys, a colour-coded query box, and a built-in tutorial with live results for all four dialects. Built in Rust with egui.
  The app is a single portable executable; after installing, launch it with the jsonquery-gui command.
