ShortDescription: Visual block programming for robots and microcontrollers.
Description: |-
  Nairda lets children and students program real robots by dragging blocks, with no
  syntax to memorize. It connects to ESP32 and Arduino boards over Bluetooth Low
  Energy or USB serial, runs the program live on the board, and can also flash it
  permanently. Includes a 2D/3D simulator so a program can be tested without any
  hardware attached, guided tutorials, and an assistant that turns a plain-language
  description into a working block program.
