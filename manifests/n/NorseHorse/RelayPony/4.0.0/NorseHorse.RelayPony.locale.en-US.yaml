ShortDescription: Encrypted direct device-to-device file transfer.
Description: RelayPony for the desktop sends and receives files between your computer and your phones, encrypted end to end with the age protocol. Pairs by QR code with the RelayPony iOS and Android apps. No server, no cloud, no account.
