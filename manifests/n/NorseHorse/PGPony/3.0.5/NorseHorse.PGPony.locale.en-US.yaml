ReleaseNotes: |-
  PGPony Desktop 3.0.5
  New
  - The key list is split into My Keys and Public Keys, the way PGPony splits it on Android and iOS. My Keys holds your key pairs and any key whose secret is on a hardware key, so a card you imported on its own shows up there too. Public Keys holds everyone else's. Each section has its own heading and can be collapsed, and PGPony remembers which ones you collapsed. Search looks in both sections, and the sort order applies within each. Added at a tester's request.
  - A key linked to a hardware key now shows a card icon in place of the key icon at the start of its row, which makes it easy to pick out in a long list. The Card badge is still on the row.
  Fixed
  - Importing a key could fail with "invalid armor" when the key file had been saved on Windows (#13). Some Windows tools write armored text with CR CR LF line endings, and the OpenPGP library PGPony uses rejects that once the block carries an armor header such as "Version: GnuPG v1". Without the header line the same file imported, which is why deleting that line seemed to fix it. PGPony now normalizes the line endings, and drops a leading byte order mark, before it reads pasted or imported armor. Binary key files are not touched.
