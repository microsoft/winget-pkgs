ShortDescription: Check .com domain names in bulk, keep a watchlist and get notified when one changes status.
Description: |-
  NameDaemon Desktop checks up to 50 .com names at a time against a daily snapshot of the .com zone,
  exports the results to CSV and keeps a watchlist on your PC. A notification tells you when a watched
  name changes status. It also includes the nine free NameDaemon tools: name generator, availability
  checker, domain report, score, appraisal, audit, domain health, short domains and a drop calendar.
  No account, no ads, no analytics. English, Spanish, French and German.
