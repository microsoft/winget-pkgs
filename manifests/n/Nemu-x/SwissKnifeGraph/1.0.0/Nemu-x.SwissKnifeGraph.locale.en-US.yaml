ShortDescription: Microsoft Graph desktop client for IT admins
Description: |-
  SwissKnife for MS Graph is a lightweight cross-platform desktop client for the Microsoft Graph API,
  built for IT administrators who prefer clean UI actions over PowerShell scripts. One window covers
  Entra ID users and groups, Teams, chats, mail, OneDrive and SharePoint, Intune and devices, app
  registrations, licensing, storage cleanup, audit logs, usage reports, guided on/offboarding
  playbooks and a raw Graph playground. Every page is organised around tasks; Ctrl+K opens a task
  palette. Authentication is app-only (client credentials) or delegated (device code); secrets live
  only in Windows Credential Manager, and every write or destructive action requires a typed
  confirmation and is written to a local audit log.
