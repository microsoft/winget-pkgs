ShortDescription: Microsoft 365 administration as previewed, audited tasks
Description: |-
  SwissKnife is a desktop app and CLI for Microsoft 365 administrators. Every change - through
  Microsoft Graph, the Exchange Admin API, Exchange or Teams PowerShell, or on-premises Active
  Directory over LDAP - is previewed first (before and after, per object), confirmed once, then
  journaled and audited. It covers Entra ID users and access, Exchange mailbox permissions and
  transport rules, Teams policies, incident response (phishing purge, compromised accounts),
  Intune, configuration snapshots with diff, drift alerts and restore, reports across tenants,
  and community action packs from the Action Hub. Secrets live in Windows Credential Manager.
