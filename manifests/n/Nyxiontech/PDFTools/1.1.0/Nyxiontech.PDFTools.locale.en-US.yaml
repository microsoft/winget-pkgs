ShortDescription: Twenty-five PDF and image tools that run on your own computer. No upload, no account, no internet needed.
Description: |-
  A desktop app for everyday PDF work: merge, split, rotate, compress, convert PDFs to Word
  or images and images to PDF, add a signature, redact text so it is really gone, strip
  metadata, set or remove a password, compare two files, and make a scanned page searchable
  with OCR in Polish or English.
  Every file is processed inside the app window. Nothing is uploaded, there is no account
  and no server, and the app works with no internet connection at all. The interface is
  available in English, Polish, German, Spanish, French and Ukrainian, and follows the
  system language.
  The same code also runs as a web app at tools.nyxiontech.com, where it still processes
  files in the browser rather than on a server. Source under AGPL-3.0-or-later.
