ShortDescription: External monitor brightness that follows the sun, blinds and room lights.
Description: |-
  A tray app that keeps external monitors at the right brightness through the day.
  Sliders and hotkeys work from the first start. Add a location and brightness follows the sun;
  add Home Assistant and a window blind and the room lights move it too. With HDR on, it dims
  through the SDR content brightness, so monitors that ignore DDC/CI still follow.
