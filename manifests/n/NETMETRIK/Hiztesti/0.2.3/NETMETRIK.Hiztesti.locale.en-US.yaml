ShortDescription: Internet speed and quality measurement from the command line
Description: |-
  HIZTESTI CLI measures your connection's download, upload, latency, jitter
  and bufferbloat without a browser. Runs on servers, in cron and on
  low-powered devices. Emits JSON, CSV and Prometheus output.
Tags:
- benchmark
- internet
- network
- speedtest
ReleaseNotes: |-
  Yenilikler ve iyileştirmeler
  - Makine-okunur çıktılarda ping artık ekranda görünen değerdir (IQM). En düşük değer ayrı alanda verilir.
  - CSV/TSV için --output-header eklendi.
  - Performans iyileştirmeleri yapıldı.
  - Ping in machine-readable output is now the value shown on screen (IQM). The minimum is reported in a separate field.
  - Added --output-header for CSV/TSV.
  - Performance improvements.

  Kurulum / Installation
  brew update && brew upgrade hiztesti
  sudo apt-get update && sudo apt-get install --only-upgrade hiztesti
