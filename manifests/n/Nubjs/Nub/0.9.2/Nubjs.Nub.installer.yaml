# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: Nubjs.Nub
PackageVersion: 0.9.2
# nub ships as a portable single binary inside a per-architecture .zip. The archive
# carries ONE executable (bin\nub.exe); the nubx / nubr verbs are the same binary
# dispatched on argv[0], and winget refuses a duplicate RelativeFilePath, so only
# `nub` can be aliased until the zip carries a file per verb.
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: bin\nub.exe
    PortableCommandAlias: nub
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/nubjs/nub/releases/download/v0.9.2/nub-win32-x64.zip
    InstallerSha256: 85602D803FFE0F92A66664172870916BF8945C2889A6118DC01794BD530873CE
  - Architecture: arm64
    InstallerUrl: https://github.com/nubjs/nub/releases/download/v0.9.2/nub-win32-arm64.zip
    InstallerSha256: 936AB99F6B167EF7C30623381D79E02041FE854BC3E23EA163B5120A9100E4A9
ManifestType: installer
ManifestVersion: 1.12.0
