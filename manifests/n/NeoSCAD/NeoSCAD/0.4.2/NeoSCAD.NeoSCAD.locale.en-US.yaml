ShortDescription: OpenSCAD-compatible programmable solid CAD (desktop app and command line)
Description: |-
  NeoSCAD is an open-source reimplementation of OpenSCAD: a desktop app for
  writing .scad models, with a code editor, a 3D viewport, a customizer and
  checks, and the neoscad command-line tool. The command-line tool reads
  OpenSCAD's language and command-line flags and exports STL, 3MF, OFF,
  VRML, SVG, DXF, PDF and PNG. It also runs as a JSON-RPC server
  (neoscad serve), a Model Context Protocol server for AI agents
  (neoscad mcp) and a language server (neoscad lsp); the app sets up AI
  agent clients to use it. The command-line tool is installed in the app's
  bin folder and is not added to PATH.
