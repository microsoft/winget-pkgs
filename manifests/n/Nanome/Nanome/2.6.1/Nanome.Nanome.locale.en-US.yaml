ReleaseNotes: |-
  New Features and Improvements
  - 2.6.0:
  - Scene Recording & Playback: record scenes (including their annotations) and play them back, including on the web viewer.
  - Residue Editor: one built-in tool for both residue mutations and rotamer (side-chain) edits.
  - MARA Tools: run MARA cheminformatics tools on a whole entry, a component, or your current selection right from the in-headset sidebar (VR + desktop); results and any molecular outputs come back as new structures without changing what you sent.
  - Rich Annotations: add custom text and sound annotations, with URLs supported inside text; annotations carry through scene duplication and playback.
  - Ligand Table View Presets: save and switch ligand-table layouts per Project, filter by numeric rating, and toggle a 3D tag per ligand.
  - Shared Selection: opt-in sharing of your selection with collaborators in your avatar color; following a user now shows their selection too.
  - XR Keyboard v2: real-time dictation and clipboard support in the in-headset keyboard.
  - Interactions: halogen-π interactions, ligand↔protein-only filtering, highlighting that networks across users, and show/hide toggles for pinned interaction labels.
  - Multi-model & trajectory: load multi-model MAE files, atom-count-aware frame limits, smoother large-trajectory playback, and per-frame surfaces when stepping through frames.
  - More new tools: Export to SMILES, TM-align protein–protein alignment, "Set as ligand" designation, direct distance filters, a redesigned color picker, chain-instance coloring, an in-app server switch (private cloud / on-prem), and a Loading Report that flags and auto-resolves fixable load issues.
  - Pointer highlight: flash a highlight around your pointer that broadcasts to collaborators so they can see where you're pointing.
  - Web App: sequence menu, multi-protein structure alignment, image export, scene-playback controls, .pdbqt loading, touch input for tablets and phones, Org role management, and structures now render visible on load. Viewers can step through models and make selections.
  - 2.6.1:
  - Rotamer panel: the residue list appears immediately and computes hydrogen-bond and clash counts in the background, replacing a wait measured at over ten seconds. Columns are sortable, and the counts are now correct.
  - Compressed file loading: support for .gz and .maegz files.
  - Water hydrogen bonds: a crystallographic water deposited without explicit hydrogens now accepts hydrogen bonds, including from protein donors, filling in solvent networks around a site. H2O and D2O are recognized as solvent.
  - Ligand alignment: a substitution or bond-order change no longer collapses the alignment onto a partial scaffold, and poses are ranked by matched atoms, then element agreement, then RMSD.
  - Report a Problem: send a bug report from the right sidebar without leaving your session. Each report carries a screenshot of your view, your account details, your workspace and scene names and contents. Disabled for on-prem deployments.
  - Image capture up to 8192 px on the long edge on desktop and in the web viewer, double the previous limit.
  - Selection filters: filters built from an atom selection group by residue, chain, and model, and a sequence-menu selection now resolves to the highest-occupancy alternate location.
  - Cross-entry export filters: one filter can span multiple entries, so a single rule applies across the whole workspace in one export.
  - Scene recording countdown: the framing brackets follow your view while the timer runs, then anchor in world space at zero, so the shot holds that framing while you look around freely.
  - Clearer chemistry errors: minimization and formal-charge failures report the underlying reason instead of failing silently, and one error no longer disables minimization for the session.
  - Level of detail while editing: editable models now participate in the level-of-detail budget introduced in 2.6.0, instead of only consuming it.
  - Web viewer: component selection can be driven from the surrounding web application.
  - More small improvements: extract and duplicate to entry now confirm first and set substructures, and saving a ligand view preset over an existing name offers to replace it.

  Optimizations and Fixes
  - 2.6.0:
  - Rebuilt real-time collaboration networking: replaced Photon with a custom in-house networking stack for more reliable multi-user sessions. Foundational and invisible by design, it underpins all live collaboration going forward.
  - Large workspaces: level-of-detail rendering, a dynamic-resolution spatial grid, and faster large-molecule loading, with rendering improvements for Quest and Android.
  - Surfaces: surface and ESP computation now runs asynchronously in the background so it no longer stalls the session, plus a faster surface protocol and correct surfaces for disconnected atoms (waters, ions).
  - Networking efficiency: more efficient payload compression for large structures.
  - Network health: live high-ping indicators and better connection-loss recovery in both XR and web.
  - Performance safeguards: the load manager that hides very heavy structures to protect framerate now correctly counts passthrough and editable-model rendering against its budget.
  - Loading: cancellable structure loading with a progress bar, and a fix for loads that stalled on unknown workspaces.
  - Stability: eliminated multiple API and main-thread freezes (selection builder, menu scroll, workspace change) and cleaned up connection, token, and inter-entry handling.
  - Web App reliability: fixed the ~30-second disconnect/rejoin loop that occurred while a tab was backgrounded.
  - 60+ additional fixes across freezes, UI polish, workspace management, and rendering, plus a higher scene limit (now 50 per workspace) and faster, more accurate ring detection.
  - 2.6.1:
  - Exports of a selection: an export from an entry holding more than one model scopes atoms to the model they came from.
  - Smoother across platforms: more work moved off the main thread in the rotamer, MARA tools, annotation, playback, collaboration, and menu paths.
  - Smaller, faster web viewer: the build drops roughly 11 MB and starts up considerably faster.
  - Structure editing: corrected formal charge and valence handling in the Builder, correct fragment render quality, valence limits enforced on both atoms of every new bond, and minimization that survives adding a functional group.
  - Ligands: column layouts no longer reset, model versions no longer double-increment on a single edit, and ligand property annotations survive a Builder edit.
  - Scenes and recording: playback restores the correct camera position, saved recordings load again, scenes survive a drag-scroll reorder, and MARA tool inputs reset on a scene change.
  - Away handling: removing the headset or backgrounding the app ends the session cleanly after two minutes and reconnects immediately on return, with the microphone stopping as soon as you are away.
  - UI polish: close nested popups when clicked outside, fix multiline placeholders alignment, annotation whitespace is trimmed, grab instructions reset after logout, and view-only users no longer see editing controls.
  - A dozen further fixes across rotamer scrolling, 3D selection restore, web client stability, session cleanup, task concurrency, and crash guards in hull generation, menus, collaboration, and atom and bond deletion.
