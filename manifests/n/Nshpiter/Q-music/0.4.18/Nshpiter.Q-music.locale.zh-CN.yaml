ReleaseNotes: |-
  Q-music 0.4.18
  本次为 Windows、Arch Linux 与 Android 正式版，重点完善歌单同步、桌面本地音乐和主题适配，并优化安卓玻璃控件滑动。
  歌单同步（PC / Android）
  - 优化 QQ 音乐歌曲资料读取，减少重复请求；网易云使用登录会话分批读取歌曲详情，按歌单原有顺序恢复结果。
  - 修复安卓网易云、酷狗歌单自动同步被 QQ 账号校验误拦的问题。
  - 同步失败时区分登录过期、账号不匹配、平台安全验证和歌曲不完整；登录过期可从同步窗口重新登录后重试。
  - 提供一键同步全部可同步歌单；失败保留原列表，避免用不完整结果覆盖本地歌曲。安卓同步期间删除、换源或关闭自动同步后，不再写入过期结果。
  - 酷狗要求安全验证时明确提示前往官方客户端处理；网络失败不会直接被当成登录失效。
  本地音乐与下载（PC）
  - “我的列表”新增“本地音乐”入口，可选择歌曲或文件夹，支持扫描子文件夹、按所在文件夹分别建立歌单。
  - 重复导入同一目录时复用歌单并跳过重复歌曲；显示导入进度、新增、重复和无法读取数量，导入后可直接查看歌单并播放。
  - 本地导入只引用原文件，不复制或上传音乐；移动原文件后需要重新导入。未按文件夹分组时使用独立本地音乐列表，不混入平台同步歌单。
  - 播放栏、经典与沉浸播放详情增加当前歌曲下载按钮；下载音质为空或创建任务失败时提供明确提示，确认期间切歌也不会下载错歌。
  - 调整窄窗口工具区布局，避免下载、收藏与播放队列按钮被裁切。
  主题与玻璃效果
  - PC 统一按钮、输入框、弹窗、侧栏、搜索和列表等组件的主题材质，改善深色及自定义主题中的白底、文字与选中状态。
  - 修复编辑主题切换明暗模式后字体颜色沿用不当的问题，分别保留两种模式的字体设置。
  - Android 优化底栏与迷你播放条玻璃采样：减少无效缓存清理，调整大小时保留上一帧，避免绘制过程中改写正在使用的图像，并复用着色器以减少滑动开销。
  安装与说明
  - Windows 提供 x64 安装包和新增的绿色免安装 7z 包；免安装版请完整解压，数据保存在 portable/userData，升级时保留旧 portable 目录。
  - 同步提供 Arch Linux x64 包，以及 Android arm64-v8a、armeabi-v7a、x86、x86_64 和通用 APK。大多数手机请选择 arm64-v8a。
  - 本地音乐新增入口与播放栏下载入口为本次 PC 改动；安卓发布内容为歌单同步与玻璃绘制优化。
  - 已完成自动化回归、桌面界面与本地播放验证及安卓构建检查；安卓玻璃滑动仍需不同设备实测。平台安全验证与歌曲可播放、可下载范围仍取决于平台及所用音乐源。
