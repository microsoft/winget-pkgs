ReleaseNotes: |-
  Q-music 0.4.16
  本次正式版打磨桌面搜索和列表交互，修复搜索音源记忆、QQ 搜索分页及页面切换异常；安卓更新弹窗新增 Markdown 排版。
  PC 搜索与列表
  - 记住上次手动选择的搜索音源，返回首页、重新进入搜索时不再恢复为聚合搜索；浏览歌单和排行榜不会覆盖搜索偏好。
  - 聚焦搜索栏后切换音源，保留输入内容、焦点和历史记录；音源选项与历史记录在同一下拉面板中展示，支持再次点击收起和分层 Esc 返回。
  - 首页移除重复的历史／热搜卡片，历史记录和热搜统一在搜索栏下拉面板查看，修复历史卡片与推荐内容重叠。
  - 搜索歌曲保持紧凑单行，调整歌名、音质标签和平台图标间距；长文字可悬停查看，列表和分页避开底部播放栏。
  - QQ 搜索使用实际返回的原始条目判断末页，避免估算总数产生多余页码；空页提供返回上一页和重新加载。
  - 修复快速搜索、换词或翻页时旧请求覆盖新结果的问题；聚合结果切换单曲音源后，列表显示与后续播放读取及时更新。
  PC 导航与菜单
  - 修复搜索后跨页面切换可能出现整页空白的问题。
  - 修复下载分类标签、设置分类选中背景在字号变化时的位置错位。
  - 进入播放详情、切换页面或点击外部时及时关闭旧的右键菜单。
  Android 更新说明
  - 更新弹窗支持 Markdown 标题、列表、加粗、引用、代码和链接，跟随应用主题及字号显示，正文可长按复制。
  - 隐藏发布流程注释；链接打开失败时显示明确提示。
  - 此次搜索布局与分页调整针对 PC；安卓本次更新内容为更新说明显示优化。
  安装说明
  - Windows x64、Arch Linux x64 和 Android 同步升级至 0.4.16；安卓 versionCode 46，提供 arm64-v8a、armeabi-v7a、x86、x86_64 和通用 APK。大多数手机请选择 arm64-v8a。
  - 正式包沿用原应用标识和发布签名，可覆盖升级；独立 preview 测试版与正式版的数据相互独立。
  - 旧安卓版此次升级前的提示仍由旧版渲染；安装 0.4.16 后，更新弹窗才会使用新的 Markdown 排版。
