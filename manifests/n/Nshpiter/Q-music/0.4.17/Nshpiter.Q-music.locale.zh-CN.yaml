ReleaseNotes: |-
  Q-music 0.4.17
  本次为桌面正式版，新增专辑搜索与播放入口，并修复搜索返回、酷狗分享歌单和多处界面布局问题。
  专辑与播放
  - 新增 QQ 音乐、网易云音乐和酷狗音乐专辑搜索，支持聚合查看、专辑详情和整张专辑播放。
  - 播放详情中的歌手和专辑名称支持点击跳转；有可用专辑标识时直接进入详情。
  - 修复专辑曲目点击无反应、提示“播放队列加载失败”的问题。
  - 从排行榜或专辑播放歌曲时使用对应列表作为队列；快速切换排行榜时，旧请求不再覆盖后一次播放队列。
  搜索与导航
  - 搜索后前往设置、排行榜等页面，顶部提供“返回搜索”，恢复最近搜索及专辑浏览位置。
  - 保留搜索页面及滚动位置，修复离开页面时清空搜索数据、返回同一专辑时重复加载的问题。
  - 优化搜索面板失焦收起和设置页按钮间距。
  酷狗歌单
  - “歌单 → 打开歌单”支持识别 QQ、网易云和酷狗官方分享链接，自动选择对应平台。
  - 修复酷狗分享文案、重定向链接和歌单标识的解析，兼容酷狗码与公开歌单编号。
  - 修复酷狗多页歌单尾页的分页偏移，避免重复读取或漏掉歌曲。
  - 账号歌单遇到安全验证（20028）时明确提示前往酷狗官方客户端处理；区分加载失败与空歌单，并提供重试。
  界面细节
  - 修复首页“今日推荐”封面与文字列缩放不一致导致歌名被遮挡的问题，适配窄窗口和放大字号。
  - 重做歌单“默认”分类面板的边界定位：标签自动换行、面板内滚动，增加选中状态、键盘操作和 Esc 收起。
  - 修复歌词旁的时间播放按钮被裁切，适配经典与沉浸布局；移除收回按钮重复的悬停提示。
  安装与说明
  - 本版发布 Windows x64 安装包和 Arch Linux x64 包；Android 最新版仍为 0.4.16，本次未发布新 APK。
  - 桌面正式版可覆盖升级；独立 preview 测试版与正式版的数据相互独立。
  - 已通过 111 项自动化测试、代码检查及本地界面验证。酷狗公开歌单样本已完整读取；平台安全验证、私有歌单权限和音乐源可用性仍由对应平台及所用音源决定。
