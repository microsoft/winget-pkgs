ReleaseNotes: |-
  Q-music 0.4.19
  本次为桌面修复正式版，修复 0.4.18 新增当前歌曲下载入口的任务创建失败，以及沉浸播放页下载弹窗文字不清晰的问题。
  下载修复
  - 修复从播放栏或播放详情选择音质后提示“未能添加下载任务”的问题：歌曲的响应式数据现在会先转换为可传递的数据快照，再交给下载线程。
  - 修复应用于公共任务创建流程，保留歌曲、音质和来源歌单信息；任务保存成功后才更新下载列表，重复任务不重复添加。
  - 调整任务创建失败提示，不再把程序内部错误一概归因于下载设置。
  界面修复
  - 修复沉浸播放详情的深色弹窗仍使用浅色主题文字、按钮配色的问题，统一歌名、提示、音质按钮及悬停状态的对比度。
  - 主界面与经典播放风格继续使用各自的主题颜色。
  安装与验证
  - 提供 Windows x64 安装包、绿色免安装 7z 包及 Arch Linux x64 包。0.4.18 桌面用户可通过应用内检查更新升级。
  - Android 最新版仍为 0.4.18，本次未发布新 APK；本次问题与修复仅涉及桌面端。
  - 已通过 122 项自动化测试、代码检查和生产构建，并在独立桌面窗口验证任务创建、保存、下载列表和本机测试音频写入完成。第三方歌曲是否可下载仍取决于音乐源。
  - 免安装版请完整解压，并在升级时保留旧 portable 文件夹中的个人数据。
