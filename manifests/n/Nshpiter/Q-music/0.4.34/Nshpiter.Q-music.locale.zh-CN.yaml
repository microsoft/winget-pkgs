ReleaseNotes: |-
  Q-music 0.4.34
  本次为正式修复版，重点解决 QQ 音乐已登录却读不到歌单，以及歌单已显示但无法同步的问题。Windows、Android、macOS 和 Arch Linux 同步更新。
  QQ 音乐歌单修复
  - 修复 QQ 直接登录后歌单读取失败，避免公开主页或某一类歌单接口异常导致整个列表无法显示。
  - 修复「我喜欢」及自建歌单可见但无法同步的问题：保留原有本地关联，读取时正确解析账号歌单的真实 ID，并使用官方当前的歌单详情接口。
  - 保留旧接口兼容路径；支持大歌单完整分页，避免只同步前 100 首。
  - 部分歌单暂时无法读取时，先展示已成功读取的歌单，并提供重新加载入口。
  同步与异常提示
  - 保留掉登录、账号切换、取消及分页不完整的区分；读取失败或返回异常空数据时，不覆盖原有本地歌曲。
  - 安卓读取失败时补充平台错误码，便于定位接口问题。
  - 调整部分加载提示，避免同步成功后仍误提示本地歌单未变化。
  检查范围
  - 完成 PC、Android 的歌单、账号、播放、搜索、下载、主题、导航与更新相关自动回归，并检查构建。
  - 补充 QQ 歌单真实 ID、230 首跨页同步、旧主页不可用、登录失效与异常空响应等回归场景。
  - QQ 直接登录与歌单同步已通过安卓真机反馈验证；其他真实账号和设备的表现仍欢迎反馈。
  从旧版直接更新即可，已有歌单、账号与同步关联会保留。遇到旧的失败提示，可在账号歌单页点击「重新加载」后再次同步。
