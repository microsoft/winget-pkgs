Description: Q-music 是一款基于 LX Music 桌面版二次开发的多端音乐播放器，提供聚合搜索、QQ 音乐与网易云音乐账号接入、每日推荐、歌单导入与跨端云同步，并重新设计了液态玻璃界面、播放详情页、逐行歌词与音频可视化。
