ReleaseNotes: |-
  Q-music 0.4.24
  本次正式版补充歌词字体设置与安卓歌单排序，并修复网易云 QQ 授权回跳、音源失败后连续跳歌无法停止的问题。
  播放失败与取消
  - PC 和安卓在获取播放地址、加载音频、延迟重试及等待自动跳歌时，播放按钮显示为可暂停状态，点击即可取消当前播放尝试。
  - 暂停后丢弃旧请求的结果并取消后续重试，避免歌曲突然继续播放或自动切换。
  - 连续三首播放失败，或再次遇到已经失败的同一首时，停止自动跳歌并提示检查音源或网络；主动选歌、恢复播放或正常开播后可重新尝试。
  - 安卓限制音源限流后的延迟重试次数，串行处理原生播放队列及旧曲目清理，减少快速切歌时的竞态。
  - PC 保留原有「播放失败自动切换下一首」设置。
  网易云 QQ 登录
  - PC 网易云登录窗口允许必要的官方 QQ 授权页面留在原账号会话内，修复授权被外部浏览器接管后应用收不到登录状态的问题。
  - 安卓补充网易云专用的 QQ 授权回调，授权返回后继续原登录流程；回跳仍限定为官方 HTTPS 页面。
  歌词字体与歌单顺序
  - PC 可在播放详情设置和歌词右键菜单中选择本机字体，提供预览；经典、沉浸风格的原文、翻译与逐字歌词统一使用所选字体。
  - 安卓新增默认、衬线、等宽字体及 TTF／OTF 字体导入，支持最大 32 MB 的字体文件。导入后保存到应用私有目录，重启自动恢复，失败时保留原设置。
  - 安卓「我的歌单」新增「调整顺序／完成」，可使用上下按钮调整自建和导入歌单的位置并保存；试听列表与我的收藏保持固定。
  安装与验证
  - Windows x64、Arch Linux x64 和 Android 同步升级至 0.4.24。安卓沿用正式版包名和签名，可覆盖升级；大多数手机请选择 arm64-v8a。
  - 已完成相关自动化回归、PC 播放取消及字体设置窗口验证；正式安装包由各平台发布流程完整构建。
  - 本次未进行真实账号扫码和安卓真机测试，第三方授权及具体设备表现仍以实际使用为准。
