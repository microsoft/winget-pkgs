ReleaseNotes: |-
  Q-music 0.4.40
  这次更新了桌面和安卓的歌词播放页，也给导入多个音源的朋友加了一个选择。
  - 歌词跟随更顺了。 切到下一句时，高亮和滚动一起开始，当前行停在歌词区中间。喜欢大字号的话，可以在歌词设置里调节上下边缘的渐隐范围。#28
  - 自定义音源可以选「优先播放」或「优先音质」。 默认沿用「优先播放」。如果你选了无损，而主音源只能播高品质，启用「优先音质」后会先去已勾选的备用源找无损，再考虑降档。#29
  - 桌面播放栏统一了右侧工具图标。切换 SQ、HQ 和 Hi-Res 时，标签贴着文字，进度条和旁边的按钮都稳在原位。
  - 桌面本地音乐与下载支持把歌曲或文件夹拖进导入窗口，下载列表能直接看到任务进度和速度。安卓也调整了导航和设置页的图标。
