ReleaseNotes: |-
  Q-music 0.4.41
  - 桌面歌词在「播放页外观 → 歌词排列」里可以选直排或扇形，也能调弧度。这次修正了扇形方向和切回直排时歌词跑位的问题。想把歌词留在手边，可以打开置顶迷你播放器。
  - 桌面播放和导歌支持把音频文件或整个文件夹直接拖进主窗口，重复的歌曲会自动跳过。播放历史补上了歌曲封面，播放页的立体封面也会跟着播放和暂停。
  - BetterNCM 支持导入部分原版插件包。桌面端还加入了任务栏歌词、OBS 歌词输出和切歌淡化等功能。可用插件和对应入口列在适配清单。
  - 安卓专辑搜索有了单独的「专辑」标签。搜到专辑就能点进去看完整曲目，支持 QQ 音乐、网易云和酷狗。#30
  - 安卓手势栏会跟随页面底边的颜色。左滑看歌词时默认不再额外压暗，想调暗可以到播放详情设置里调。开启流畅模式也能保留歌词切句动画。#31
  - 桌面局域网同步遇到端口占用时会显示具体端口和换端口的方法，同时使用 LX Music 和 Q-music 时更容易排查。#32
