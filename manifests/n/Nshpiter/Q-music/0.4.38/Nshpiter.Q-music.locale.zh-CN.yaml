ReleaseNotes: |-
  Q-music 0.4.38
  这次修了双语歌词。听现场版《Hotel California》时，副歌里连续两句唱的是同一个地方，下一句才唱到面容。旧版有时会把“面容”的译文提前一行。感谢 #27 提供截图。
  - 安卓播放 QQ 音乐时优先使用这首歌的官方译文。旧版自动补过译文的歌曲，联网重播就会重新获取歌词。
  - 手机和桌面端从其他平台补译时，会按对应版本的原文时间配对。某句缺少翻译就留空，后面的译文仍跟着自己的那一行。
  - 桌面端修复 QQ 歌词有一行对不上时，后续翻译或罗马音也跟着消失的问题。
