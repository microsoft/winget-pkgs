ReleaseNotes: |-
  Q-music 0.4.32
  本次正式版更新 Windows、Android、macOS 和 Arch Linux，重点完善听歌识曲、B 站连续播放、平台收藏和 WebDAV 配置迁移。
  安卓听歌识曲（#7）
  - 在搜索栏点击麦克风，点一下开始，自动听取约 10 秒并识别；支持取消，不需要按住，也不必选择音频文件。
  - 优先使用酷狗短音频识别，无匹配或服务暂不可用时，使用同一段录音生成网易云指纹尝试匹配。开始前明确告知会向识别服务上传短音频；关闭面板或进入后台即停止录音。
  - 改进采样兼容、静音提示、录音倒计时和超时处理。环境噪声、音量、网络和平台曲库仍会影响结果；没有识别到不等于歌曲不存在。
  - 参考 WalnutBai/lx-lxwalnut-music-mobile 的识别流程，保留相关资源许可证，不使用参考项目中的账号、Cookie 或固定设备身份。
  B 站与播放队列（#9、#10）
  - 优化搜索预热、短期缓存及视频详情复用，减少重复等待；播放地址仍按需获取。
  - 从多 P 视频进入播放时建立完整分 P 顺序队列，下一首继续下一 P；改善合集播放与插播衔接。
  - 安卓播放详情统一从播放列表查看和切换分 P，移除重复选集按钮，优化队列面板进出动画。
  - 安卓歌曲评论支持 B 站公开热门评论预览，并提供跳转原视频查看完整评论的入口。未登录可见数量由 B 站决定，不提供全量评论或账号登录。
  歌词与平台收藏（关联 #8）
  - 经典和沉浸歌词页统一显示明确的「纯音乐」状态，兼容平台纯音乐标记和版本标签；普通缺失歌词、加载失败不会被误标为纯音乐。
  - 修复 QQ 音乐自建歌单收藏目标加载，改善三个平台的歌单筛选、刷新及账号切换处理；B 站视频只显示本地歌单收藏。
  - 平台收藏仍需有效登录和可写歌单；平台风控、权限或接口错误会单独反馈，不把请求返回当作收藏成功。
  WebDAV / S3 设置与音源迁移（#13）
  - 云端曲库将「云端歌曲」与「设置与音源」分开，简化连接表单，高级目录和歌曲加密选项按需展开。
  - 已有配置备份支持完整音源脚本、主音源及备用顺序，并可选择通用设置、QQ / 网易云 / 酷狗登录状态；账号默认不勾选。本版让入口和用途更明确。
  - 使用方法：在原设备保存 WebDAV 连接 →「设置与音源」→ 勾选「音源与主备顺序」→ 生成或填写备份密钥并上传；另一设备使用相同连接、目录和密钥，查看备份、预览后恢复。
  - 配置备份始终加密，恢复按脚本内容去重，不删除本地已有音源。当前为手动上传和恢复，不是后台自动双向同步；设备目录、权限和云服务密码不迁移，过期登录仍需重新授权。
  - 本机 WebDAV 与两端配置模块验证了完整测试音源往返、主备顺序和去重；安卓原生加密与 PC 的互通有单独回归检查。
  安卓弹窗与搜索平台选择（#12、#14）
  - 修复 Android 新版系统返回关闭弹窗后，JS 状态未更新，导致推荐设置再次点击无反应的问题；已在 Android 16 模拟器验证系统返回和界面返回后的反复打开。
  - 搜索平台菜单按文字与字号收紧宽度，支持滚动和显示范围约束，选中态保留底色，移除重复勾选标记。
  安装与 issue 进度
  - Windows：x64 安装版与便携版；Android：五种架构 APK，沿用正式包名与签名，可覆盖升级，多数手机选择 arm64-v8a。
  - macOS：Intel / Apple Silicon 两种 DMG，采用 ad-hoc 签名，未进行 Developer ID 公证；Arch Linux：x64 pacman 包。
  - #11 的酷狗封面问题已收到反馈者「使用上没有问题」的确认；酷狗安全验证仍由平台决定。#6、#12、#14 的厂商设备差异继续接受反馈，不宣称所有机型均已验证。
  - 本版不包含暂停开发的歌词岛 / Xposed 实验，词幕沿用原有支持。听歌识曲与 B 站热门评论预览本次仅在安卓新增。
