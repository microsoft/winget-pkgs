ReleaseNotes: |-
  Q-music 0.4.14
  本次正式版完善 PC 与安卓的歌单管理和 QQ 收藏同步，新增安卓平板、车机布局与 Apple 沉浸播放风格。
  歌单来源与界面
  - QQ 音乐、网易云音乐、酷狗音乐歌单增加平台图标和来源文字，同名歌单也能分辨；当前歌单标题、单曲和批量收藏的目标列表同步显示来源。
  - 重新整理歌单侧栏：标题与新建、导入与同步分开排列，选中时文字不再跳动，长歌单名不会遮住菜单按钮。
  - 安卓将账号入口明确为「平台歌单」，增加「歌单同步」入口，完善手机抽屉、平板双栏及低矮横屏弹窗的滚动和返回。
  QQ 音乐收藏与同步
  - PC 与安卓的单曲收藏窗口支持将 QQ 来源歌曲收藏到官方「我喜欢」。先核对歌曲和账号，提交后回读确认；结果暂不明确时可以只读核对，避免重复提交。
  - QQ 账号歌单支持单向自动更新到本地，并提供一键同步、单独重试、同步进度和最近更新时间。新增、移除及歌曲顺序均跟随 QQ，本地编辑不会上传。
  - 新导入的独立 QQ 歌单默认开启自动更新；历史歌单需先手动同步关联账号，再开启自动更新。收藏成功后刷新同账号且已开启自动更新的本地「我喜欢」。
  - 安卓只在前台按 10 分钟间隔检查，回到前台补查。同步异常、歌曲不完整、账号变更或歌单已删除时保留原列表，不用迟到结果覆盖新状态。
  - 网易云与酷狗继续支持账号歌单导入和手动同步；本次新增的云端收藏与自动更新功能针对 QQ 音乐。
  安卓平板、车机与播放风格
  - 设置增加「自动适配／手机／平板／车机」布局，支持横竖屏和分屏；大屏使用侧栏及双栏列表，迷你播放条独立占位，避免遮挡内容。
  - 车机布局增大歌曲条目和主要播放控件，减少横向误触。适用于可安装 APK 的 Android 车机，不包含 Android Auto 投屏或 CarPlay。
  - 保留原版播放界面并新增独立的「Apple 沉浸」风格，手机与大屏分别排版，支持封面取色动态背景、双语歌词层次和播放控件适配。
  - 流畅模式和减少动态效果设置会降低装饰动效，播放页不可见或应用在后台时停止新增背景动画。
  安装与说明
  - Windows x64、Arch Linux x64 与 Android 同步升级至 0.4.14；安卓 versionCode 44，提供 arm64-v8a、armeabi-v7a、x86、x86_64 和通用 APK。大多数手机请选择 arm64-v8a。
  - 正式安装包沿用原应用标识与发布签名，可从正式版升级；此前独立安装的 preview 测试包与正式版分开保存数据。
  - 已完成账号、同步、自适应回归、两端构建及 PC／安卓模拟器界面检查。平台接口和厂商车机系统存在差异，如有异常请附平台、系统版本和具体提示反馈。
