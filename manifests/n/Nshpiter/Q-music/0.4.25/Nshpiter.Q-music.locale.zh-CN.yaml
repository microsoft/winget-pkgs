ReleaseNotes: |-
  Q-music 0.4.25
  本次正式版统一 PC 与安卓的搜索和推荐交互，重点整理手机设置、歌单与播放详情，并补充平板、车机的导航位置选择。
  搜索与首页推荐
  - PC 和安卓的历史搜索、热门搜索统一在点击搜索框后展开，首页不再重复摆放；输入关键词后显示联想，离开搜索框收起面板。
  - PC 历史在上、热搜在下，历史较多时可以展开；修复清空输入后热搜不恢复的问题。切换搜索平台保持输入焦点，移除平台图标旁的下拉箭头，让图标居中。
  - QQ 音乐、网易云音乐、酷狗返回固定的个性化推荐时，隐藏无实际换歌作用的“换一批”；本地精选仍可换一批，平台推荐加载失败时可重试。普通歌单保留“刷新”。
  - 安卓首页调整今日发现排版，移除与底部导航重复的快捷入口；搜索入口集中在首页，设置入口集中在“我的”。
  手机界面与交互
  - 设置按外观、播放、歌词、下载、音源等用途重新分类，增加设置搜索；下载管理和保存位置提供明确入口。
  - 我的歌单调整分组与卡片布局，更新“我的”、平台歌单及 QQ 音乐图标；试听列表使用底部抽屉。
  - 优化圆角按钮按压范围、设置子页面过渡和滚动边缘回弹；设置预测性返回保留独立开关，处理取消手势和内容边缘遮挡。
  - 液态玻璃改为独立开关，默认关闭以降低开销；开启时限制背景采样频率。流畅模式下仍保留必要的按压和返回反馈。
  - Apple 播放详情中间调整为收藏、上一首、播放/暂停、下一首、队列五个按钮；底部保留播放模式、评论、更多三个入口，经典风格保留原布局。
  - 歌词操作增加明确入口，歌曲菜单提供下载、歌手与专辑搜索；移除相似歌曲入口和 Spotify 歌单导入。
  平板与车机
  - 大屏导航可选左侧、右侧或底部，设置自动保存；手机和窄分屏仍使用底部导航。
  - 大屏停止用横向滑动切换主页面，避免与竖排导航冲突。
  - 普通平板不显示退出应用按钮；车机可选择显示“停止播放并退出应用”，默认关闭，操作前确认。
  播放与账号修复
  - 两端增加主、备用音源选择与失败回退，修复音源切换及旧请求影响新播放的问题。
  - 修复安卓恢复暂停歌曲时通知按钮可能误显示暂停的问题，完善播放取消与原生队列状态同步。
  - 补充网易云 QQ 授权回跳处理及三平台账号状态判断，区分登录失效、验证要求和服务暂不可用。
  安装与验证
  - Windows x64、Arch Linux x64 和 Android 同步升级至 0.4.25。安卓沿用正式版包名和签名，可覆盖更新；多数手机选择 arm64-v8a。
  - 已完成 PC 生产构建、自动化回归，以及 PC 搜索窗口和 Android 模拟器手机/平板布局实测；正式包由发布流程完整构建。
  - 本轮未重新完成三平台真实账号授权，也未在实体车机实测；模拟器验证不代表所有厂商系统手势表现相同。
