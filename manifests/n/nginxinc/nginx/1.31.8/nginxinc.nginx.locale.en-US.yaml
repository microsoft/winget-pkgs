Description: NGINX is the world's most popular Web Server, high performance Load Balancer, Reverse Proxy, API Gateway and Content Cache.
Moniker: nginx
ReleaseNotes: |-
  *) Change in internal API: now the JSON parser reports strings with
     escape sequences as separate events, and the
     ngx_json_unescape_string() function decodes a string into a separate
     buffer.
  *) Change: now the path specified in the "working_directory" directive
     is relative to nginx prefix directory, but not to the current
     directory.
  *) Bugfix: worker processes exited on start or during reconfiguration if
     an invalid directory was specified in the "working_directory"
     directive.
  *) Bugfix: worker processes might be terminated abnormally on a SIGBUS
     signal when using HTTP/3 on platforms with strict alignment
     requirements.
     Thanks to Daewoo Choi.
  *) Bugfix: "recv() failed (5: Input/output error)" alerts might appear
     in logs when closing SSL connections if kernel TLS was used with
     OpenSSL 3.2.0 or newer.
  *) Bugfix: nginx could not be built on Solaris if the --with-control-api
     option was used.
ReleaseNotesUrl: https://nginx.org/en/CHANGES
