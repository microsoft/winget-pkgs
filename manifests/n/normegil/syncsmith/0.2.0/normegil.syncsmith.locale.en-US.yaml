Moniker: syncsmith
ReleaseNotes: |-
  syncsmith keeps files synchronized between a source (git repo or folder) and a target git repository, driven by a .syncsmith.toml file.
  Highlights
  - syncsmith init: interactive configuration, optional pre-commit hook
  - syncsmith sync: overwrite & patch (3-way merge) modes, automatic/manual policies, one-off stateless sync via --override-from
  - syncsmith check: read-only CI verification, --json and --no-fail options
  Install
  Download the archive for your platform (checksums in the .sha256 files, SBOM attached):
  - Linux x86_64 (musl): syncsmith-0.2.0-x86_64-unknown-linux-musl.tar.gz
  - Windows x86_64: syncsmith-0.2.0-x86_64-pc-windows-msvc.zip
  Or build from source: cargo install --path .
  Requirements
  - git on PATH (syncsmith shells out to git)
  - git 2.25+ for the pre-commit hook; filenames with newlines are not supported
  Status
  Early 0.x release — CLI and configuration format may change between minor versions.
  Full usage: see the README and docs/configuration.md.
