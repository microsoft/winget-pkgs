ShortDescription: Fast, keyboard-first dual-pane file manager with Total Commander keys, SFTP/FTP/WebDAV/S3 and archives.
Description: |-
  nViPER is a dual-pane file manager for Windows and Mac, a modern revival of the 2001 original.
  Two panels, F-keys and the Total Commander keyboard profile, tabs, undo for file operations,
  a built-in viewer (text with syntax highlighting, hex, images, PDF) and editor, archives
  (ZIP, TAR, 7z and RAR via bundled 7-Zip), SFTP, FTP, SCP, WebDAV and S3 with SSH keys
  (OpenSSH, PEM, PuTTY .ppk), Pageant and the OpenSSH agent, file and folder compare and sync,
  multi-rename, disk usage map and cleanup. Free with all features, no ads, no tracking.
