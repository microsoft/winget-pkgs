ReleaseNotes: |-
  Fixes
  - A Bot's artifact and chart cards show in its chat. When a Bot made an artifact or a chart in a Bot chat, it said the result was open beside the chat, but no card appeared and the side panel showed an empty tab. The cards now appear in the chat at the time they were made and open in the side panel, for people who may open the Bot's Task. Fixes #5272. (#5305)
