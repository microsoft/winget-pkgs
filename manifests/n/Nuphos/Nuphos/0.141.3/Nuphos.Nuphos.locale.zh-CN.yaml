ReleaseNotes: |-
  修复
  - 智能体的产物卡片和图表卡片会显示在它的聊天中。智能体在聊天里生成产物或图表时，界面说结果已开在聊天旁边，但没有出现卡片，侧边窗格显示的是空白标签页。现在卡片会在生成时就出现在聊天中，并可在侧边窗格中打开，方便可能打开该智能体任务的人查看。修复 #5272。（#5305）
