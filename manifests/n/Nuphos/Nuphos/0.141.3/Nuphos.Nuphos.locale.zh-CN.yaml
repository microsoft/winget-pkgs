ShortDescription: 开源 AI 智能体工作区，使用你已有的 Claude Code 或 Codex 订阅运行常驻智能体。
Description: Nuphos 是一个面向团队的开源 AI 智能体工作区。它使用你已经付费的 Claude Code 或 Codex 订阅运行常驻智能体，并将其放入整个团队都能加入的聊天中。会话可以运行在你自己的计算机、你拥有的远程机器，或 Nuphos 为你运行的计算机上，并且可以在这些运行时之间迁移而不会丢失上下文。桌面应用在对话旁提供 Kubernetes、Grafana、GitHub 和 Linear 的图形界面，并在团队内共享技能、工具和记忆。
