ReleaseNotes: |-
  Fixes
  - OpenCode on a computer that came with an OpenRouter key answers again after a reset. Starting an OpenCode sign-in resets the agent first. The reset removed the key but left OpenCode on the OpenRouter model, so choosing Free models ended with every prompt failing with "provider authentication required". The reset now removes the whole OpenRouter entry and OpenCode falls back to its free model. Fixes #5341. (#5342)
  - A computer already left in that state repairs itself. Before an agent starts, the host removes the OpenRouter entry only when it is empty and the model is the one that came with the key. A key, any other OpenRouter option, another model or another provider is left as it is. (#5343)
  - A Codex custom provider offers every model ID. With several model IDs, only the first showed in the model menu and picking another was refused. The form takes a list of model IDs again. A Codex CLI too old to print its model catalog keeps using the first ID alone. Fixes #5214. (#5306)
