ShortDescription: Open source AI agent workspace that runs always-on agents on your Claude Code or Codex subscription.
Description: Nuphos is an open source AI agent workspace for teams. It runs always-on agents on the Claude Code or Codex subscription you already pay for, in chats your whole team can join. A session can run on your own computer, a machine you own, or a computer Nuphos runs for you, and you can move it between them without losing context. The desktop app puts a real GUI for Kubernetes, Grafana, GitHub, and Linear beside the conversation, and shares skills, tools, and memory across the team.
