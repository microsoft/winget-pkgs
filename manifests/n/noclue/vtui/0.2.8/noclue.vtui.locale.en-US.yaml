ReleaseNotes: |-
  Release Notes
  Changed
  - vim_rs 0.6.1: bumped from 0.5 (vSphere API 9.1). Event filters leave the new auditable / audit_id fields unset, and transit-gateway events show up in the event table’s object column. Shutdown calls Client::close so the session logs out without relying on destructor logout.
  - Third-party dependencies: refreshed Cargo.lock to the newest releases allowed by the manifest (ratatui 0.30.2, tokio 1.53, reqwest 0.13.5, flexi_logger 0.31.10, and the rest of the tree). Source builds now need Rust 1.89.
  Install vtui 0.2.8
  Install prebuilt binaries via shell script
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/noclue/vtui/releases/download/v0.2.8/vtui-installer.sh | sh
  Install prebuilt binaries via powershell script
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/noclue/vtui/releases/download/v0.2.8/vtui-installer.ps1 | iex"
  Install prebuilt binaries via Homebrew
  brew install noclue/tap/vtui
