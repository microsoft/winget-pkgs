ReleaseNotes: |-
  Parity fixes found by new differential sweeps that render generated diagrams with Go D2 and d2-rs: ovals with one authored dimension, dagre edge ordering and label positions in containers, ELK label spacing and grid-cell edges, 3D hexagons in grids, and five TALA layout differences. On 3,600 generated diagrams per engine, dagre and ELK now match Go exactly. Windows installers install for the current user by default (no administrator rights) or for all users with ALLUSERS=1.
ReleaseNotesUrl: https://github.com/nelsonjchen/d2-rs/releases/tag/v0.1.7
