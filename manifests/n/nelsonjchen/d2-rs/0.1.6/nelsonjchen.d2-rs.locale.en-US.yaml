ReleaseNotes: |-
  Windows installers on GitHub releases (d2-rs-v0.1.6-windows-amd64.msi and -windows-arm64.msi). They install for the current user by default, with no administrator rights, into %LOCALAPPDATA%\Programs\d2-rs and the user PATH; installing for all users (ALLUSERS=1) puts d2-rs in Program Files\d2-rs on the system PATH. The code is unchanged from 0.1.5.
