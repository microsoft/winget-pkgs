ShortDescription: A Rust port of the D2 diagram scripting language toolchain, with the same command-line flags as Go's d2.
Description: |-
  d2-rs is a Rust port of the D2 toolchain: the compiler, the Dagre, ELK and TALA layout engines, the renderers and exporters, and the command line, for the D2 diagram scripting language that turns text into diagrams.
  The command is installed as d2-rs and takes the same subcommands and flags as Go's d2, including fmt, validate, themes, sketch mode, multiboard output, and PNG, PDF, PPTX, GIF and ASCII export. It targets byte-identical output with upstream Go D2.
