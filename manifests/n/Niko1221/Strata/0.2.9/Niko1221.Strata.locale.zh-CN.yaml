ShortDescription: 在你自己的电脑上运行 AI 模型，用于对话、编程和图像任务。
Description: |-
  Strata 在你自己的电脑上运行强大的 AI 模型。你可以在本地对话、写代码和处理图像，应用会在 localhost 提供兼容 OpenAI 和 Anthropic 的 API，无需注册账号。

  安装程序自带应用、App Host、Node 和 Strata Control。首次启动时，应用会显示适配你显卡的推理引擎及其大小，并提供一个下载按钮，之后会下载你选择的模型。
