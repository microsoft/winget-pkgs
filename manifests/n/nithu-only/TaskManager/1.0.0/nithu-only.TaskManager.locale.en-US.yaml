ShortDescription: Portable Windows Task Manager with live process, performance, service and startup views.
Description: >-
  A local Windows Task Manager replacement that ships as a single portable exe and opens
  in your browser. Shows live per-process CPU, memory, disk and network usage, Windows
  services and startup apps. Supports suspend, resume, end task, priority, service control
  and per-user startup entries, with built-in guards for critical Windows processes. No
  telemetry, no account, no install required.
