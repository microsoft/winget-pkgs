PackageIdentifier: NekodeProject.Nekode
PackageVersion: 0.3.0
PackageLocale: zh-CN
Publisher: NekodeProject
PackageName: Nekode
ShortDescription: 一只盯着你所有 AI Agent 干活的桌宠。
Description: |-
  Nekode 是一只常驻屏幕角落的轻量桌宠。它通过各家 AI 编程 Agent 的钩子机制实时获取任务状态（开始干活、正在做什么、等你确认、完成、出错），并用像素猫动画和气泡提示你。

  支持 Claude Code、Codex、Hermes、Cursor、ZCode、CodeBuddy、DeepSeek Harness。支持双向交互：点击小猫即可批准授权请求，Agent 也可以通过选择题卡片向你提问。

  基于 Tauri 2 构建，安装包仅 ~1.6MB，气泡窗永久点击穿透、零打扰。
