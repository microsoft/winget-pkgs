ShortDescription: A desktop pet that watches your AI coding agents work.
Description: |-
  Nekode is a lightweight desktop pet that lives in a corner of your screen. It taps into the hook mechanisms of AI coding agents and turns their lifecycle events (task started, tool activity, waiting for approval, done, error) into sprite animations and speech bubbles.

  It works with Claude Code, Codex, Hermes, Cursor, ZCode, CodeBuddy and DeepSeek Harness. Two-way interaction is supported: click the cat to approve a permission request, and agents can ask you multiple-choice questions.

  Built with Tauri 2 — the installer is ~1.6 MB and the bubbles are permanently click-through.
