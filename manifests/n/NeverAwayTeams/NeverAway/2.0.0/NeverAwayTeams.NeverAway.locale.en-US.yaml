ReleaseNotes: |-
  - Presence is active on launch and again whenever the machine wakes from sleep.
  - Scheduled suspend now arms a wake timer for the next opening before sleeping.
  - Meeting detection covers the New Teams media process; a close is never forced when the
    detector is unsure.
  - Entitlement survives an unreachable server through a signed licence held on the machine.
  - Notification-area icon shows status by colour, with the next scheduled event on hover.
