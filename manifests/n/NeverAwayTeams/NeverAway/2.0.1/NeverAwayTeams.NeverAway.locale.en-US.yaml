ReleaseNotes: |-
  Fixes a defect in 2.0.0 that could leave the application running after it was closed.

  - Closing now closes, from the window, the taskbar and the notification area alike. In 2.0.0
    the shutdown could be abandoned part-way: the window and the icon disappeared, so the
    program looked closed, but the process stayed alive holding the single-instance lock - which
    meant it could not be started again either.
  - The notification-area menu now follows the current state, instead of continuing to offer
    "Start" after presence had already been started from that same menu.
  - The status dot is green while presence is being maintained and red while it is not. It was
    grey when stopped, which on a grey taskbar was indistinguishable from no dot at all.
  - The update check no longer reports an update to people already running the newest build.

ReleaseNotesUrl: https://neverawayteams.com/news/

