ShortDescription: Keeps your Microsoft Teams status honest while you are at your desk, and closes Teams at the hour you finish.

Description: |-
  Microsoft Teams decides you are "Away" by watching your keyboard and mouse. After a few
  minutes without input it changes your status and your screen goes dark. It does not know
  whether you actually left.

  You might be reading a long document, testing something on a phone or tablet, sketching on
  paper, or talking to the person at the next desk. In every one of those cases you are
  working, and Teams tells your colleagues you are not.

  NeverAway corrects that, and it does the opposite half too: at an hour you choose it closes
  Teams, so still being logged in late does not read as an invitation to be interrupted.

  How it works
  - Sends a one-pixel mouse movement or an F15 key press, but only after you have genuinely
    stopped touching the machine. While you are typing it does nothing.
  - Asks Windows not to blank the display while it is running.
  - Opens and closes Teams and Zoom on a weekly schedule you set.
  - Will not close Teams if the application looks busy; the scheduled close waits instead.

  Privacy
  It reads no messages, calls, files, screen contents or keystrokes. Its only network traffic
  is a licence check to neverawayteams.com carrying a hardware-derived identifier, plus
  optional weather and public-IP lookups you can switch off.

  Portable: a single signed executable. No installer, and nothing written outside
  %LOCALAPPDATA%\NeverAway.

