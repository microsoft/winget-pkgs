ReleaseNotes: |-
  Added: a duplicate scan now reports what it has found while it is still running, instead of saying
  nothing for the minutes it takes to walk a drive.

  Fixed: a look-alike group could swallow hundreds of unrelated images. Grouping was by perceptual
  hash alone, unioned, which is single-linkage clustering, so one bridging pair merged two sets that
  resembled each other not at all. A candidate pair is now verified against the pixels.

  Fixed: a cancelled extraction removed more than it wrote. It now takes back only files and
  directories that did not exist when it created them.

  Fixed: a directory cycle walked forever. Past 1,000 levels the walk checks file identity and stops
  when it reaches somewhere it has already been.
