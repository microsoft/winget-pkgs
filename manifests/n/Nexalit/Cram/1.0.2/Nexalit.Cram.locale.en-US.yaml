ReleaseNotes: |-
  Fixed: a directory tree more than about 640 levels deep killed the process. Both tree walks
  recursed, so a scan or a create running on such a tree exhausted its stack and the process
  disappeared without an error, a diagnostic or an exit code that said anything useful. Both walks
  now carry their own stack, so depth is bounded by memory.

  Added: a checkpoint file that outlives a run which dies without unwinding. A running operation
  records its phase, item count and current depth once a second and deletes the file when it
  finishes, so a file left behind is itself evidence the run did not, and says where it stopped.
