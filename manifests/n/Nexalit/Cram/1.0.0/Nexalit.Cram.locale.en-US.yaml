ShortDescription: Multi-format archiver. ZIP, 7z, tar, ISO and RAR in one command, mountable as folders.
Description: |-
  Cram creates and extracts ZIP, 7z, tar (with gzip, xz, zstd, bzip2, lz4 and brotli), ISO 9660 and
  its own deduplicating .cram format, and reads RAR. The same four verbs work on every format, and
  the format is detected from magic bytes rather than the file extension.

  It can also mount an archive as a folder instead of extracting it, find duplicate files across
  drives, write Reed-Solomon recovery sidecars, sign archives with ed25519, and download files over
  several connections at once with resume and mirror failover.

  This package installs two commands: `cram`, and `cram-extract`, a standalone decoder for .cram
  files that shares no code with the main engine so a damaged archive has an independent way back.

  Mounting requires the optional Windows feature Client-ProjFS, which is off by default. Every other
  command works without it.
