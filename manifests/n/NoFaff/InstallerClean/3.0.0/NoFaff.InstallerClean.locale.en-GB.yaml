ShortDescription: 'Open source tool for the C:\Windows\Installer folder: move or delete the files nothing needs'
Description: |-
  InstallerClean removes unneeded files from C:\Windows\Installer, a hidden folder that fills up as you install and update software. It asks Windows Installer what it still holds a record of, and reads the same records out of the registry as well, then offers a file only when nothing installed on the machine claims it, or a newer patch has replaced it. Where it cannot get a straight answer, it holds the file back. Delete is permanent; Move puts the files in a folder you choose instead. Free and open source, no ads, no telemetry.
