ReleaseNotes: |-
  - 完善 AI 交互体验：优化 AI Composer 上下文添加弹窗，优化模型输入与消息渲染显示。
  - 新增标签页右键菜单：支持便捷的标签页关闭、复制路径与上下文管理。
  - 增强 Agent 执行与任务调度：优化上下文压缩算法与沙箱安全验证，提升任务执行稳定性。
  - 支持免登录使用：未登录用户可直接使用每日免费额度与 AI 辅助能力。
