ShortDescription: 本地优先、AI驱动的全面文档工作台与现代化所见即所得 Markdown 编辑器。
Description: |-
  NexusNote 是一款为内容创作者、自媒体、开发者及科研文字工作者打造的高性能本地优先全面文档中心。
  
  核心特性：
  - 极速轻盈：基于 Tauri v2 与 Rust 构建，内存占用极低，10 万行超长文档流畅加载不卡顿。
  - 所见即所得排版：实时 Markdown 渲染，支持打字机居中模式与单行聚焦模式。
  - 全面文档中心：统一管理与浏览 Markdown、PDF（原生 PDFium 懒加载）、代码（CodeMirror 6 支持 50+ 语言高亮）及图片。
  - 丰富可视化：内置 Mermaid 架构图实时渲染与 KaTeX 异步数学公式支持。
  - 数据自主：本地优先，纯文本存储，完全兼容 Obsidian、Typora、VS Code 与 Git。
