ShortDescription: A blazing-fast, local-first WYSIWYG Markdown editor and multi-format document center built with Tauri and Rust.
Description: |-
  NexusNote is a next-generation desktop workspace designed for writers, content creators, engineers, researchers, and anyone who thinks in text.
  Built from the ground up with Tauri v2 and Rust, NexusNote brings together instant WYSIWYG Markdown editing and seamless viewing of PDFs, images, and code files into a single, cohesive, lightweight environment.
  
  Key Features:
  - Blazing Fast & Lightweight: Engineered with Rust, starts in milliseconds with tiny memory footprint. Smoothly handles 100,000+ line documents.
  - WYSIWYG Editing: Smooth inline Markdown formatting, typewriter mode, and focus mode.
  - Multi-Format Document Center: High-performance PDF viewing via PDFium, syntax-highlighted code editing (50+ languages), and image viewer.
  - Rich Visuals: Built-in Mermaid diagrams and multi-threaded KaTeX math formula rendering.
  - Local-First: All data stored locally in open .md formats without proprietary lock-in. Full compatibility with Obsidian, Typora, and Git.
