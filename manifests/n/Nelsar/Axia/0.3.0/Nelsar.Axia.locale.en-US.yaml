ShortDescription: Self-hosted web interface and REST API for Active Directory and OpenLDAP.
Description: |-
  Nelsar.Axia manages Active Directory, Samba AD, OpenLDAP and other LDAP directories from the
  browser: users, groups, organizational units and computer accounts, with role-based access
  mapped from directory groups, an audit log and bulk provisioning.
  This package installs the NelsarAxia Windows service, which serves the API and its console on
  port 8080. Finish the configuration in %ProgramData%\Nelsar.Axia\appsettings.json afterwards.
