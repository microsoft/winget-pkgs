ShortDescription: Ultra-lightweight (4MB) 64-segment download manager built in Rust for high-speed multi-threaded downloads.
Description: |-
  NeXDM is a next-generation, high-performance download accelerator engineered in Rust and Tauri for maximum throughput and minimal system footprint.
  Featuring an ultra-lean 4MB installer, NeXDM splits large files into up to 64 simultaneous parallel segments, saturating your internet bandwidth to deliver up to 10x faster download speeds.

  Features:
  - 100% Free & Unlimited: No trial period, no registration required, no feature paywalls.
  - 64-Segment Multi-Threaded Engine: Maximizes connection speeds up to 10x with intelligent chunk reconstruction.
  - Privacy-First: Zero adware, zero telemetry, zero background tracking.
  - Native BitTorrent Support: Direct magnet link and torrent downloading.
  - Media Stream Fetcher: Direct 4K/8K video download and audio extraction.
  - Modern High-Contrast UI: Sleek dark-mode interface with real-time throughput graphs.
