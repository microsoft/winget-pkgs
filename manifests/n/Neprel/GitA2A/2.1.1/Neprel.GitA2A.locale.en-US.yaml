ReleaseNotes: |-
  git-a2a 2.1.1
  Fixes npm channel publication using GitHub Trusted Publishing: the workflow sets the final dist-tag directly in npm publish, waits for registry availability, and reports npm failures instead of masking them. No local npm login or long-lived npm token is required.
  The CLI is unchanged from 2.1.0:
  - whose NAME [--json] discovers the responsible agent, Agent Card, and optional surface offline.
  - list [--json] lists all direct dependencies.
  - pull with no dependencies succeeds without changes.

  Migration from 2.0.0
  list NAME is no longer accepted. Use whose NAME for ownership, or filter the JSON array from list --json for installed dependency state.

  Install
  npx git-a2a@2.1.1 --version
  uvx git-a2a==2.1.1 --version
  go install github.com/neprel/git-a2a/v2/cmd/git-a2a@v2.1.1
  Verify downloaded archives against checksums.txt. See the CLI reference.
