ReleaseNotes: |-
  Subtitle Edit 5.3 collects the work of 26 betas and 4 release candidates.
    A summary of the changes since 5.2.0:

  New features:
  * Command palette (Ctrl+Shift+K)
  * Import subtitles directly from DVD (IFO/VOB) with title picker, fast rip and exact cell timing
  * Improve time codes (forced alignment) - re-time a roughly synced subtitle, with a speech-to-text check and waveform preview
  * Remux video - video, multi-track audio (with mixing) and soft subtitles, also embedded CEA-608 captions
  * Cut video transitions and fades, burn-in for selected lines, and 3D (half side-by-side / top-bottom) burn-in and image export
  * Generate background music locally (ACE-Step)
  * Compare: merge view, sync points, time tolerance and taking only text or timing per row
  * Custom shortcut slots built from steps, AltGr modifier, per-plugin shortcuts and many new shortcuts
  * Actor picker, "Set style..." quick pick, and "Shot in"/"Shot out" grid columns
  * Reload the subtitle when it is changed outside Subtitle Edit, and "Frame numbers" time code mode
  * Taskbar/Dock progress and prevent sleep for long jobs (speech to text, text to speech, burn-in, batch convert)

  Video player and waveform:
  * New FFmpeg video player with hardware decoding, audio track picker, real frame stepping and Linux sound
  * Experimental mpv Metal video player on macOS, deinterlace setting, and customizable player controls
  * Editor-style layout 14 with a track timeline, and layouts 12 and 13 (text box below the video)
  * Experimental fast waveform renderer, "Show speech only" waveform, grid color and remembered zoom
  * Waveform toolbar: initial text box, move-lines buttons, line breaks and wrapping

  Speech to text:
  * Crisp ASR: speaker detection (Sortformer), VAD choice (Silero, FireRedVAD, WebRTC, Whisper-VAD) and "Isolate speech"
  * New models: Parakeet Ultra, Phonon-2, ReazonSpeech/Japanese Parakeet, Voxtral F16 and Index-Echo
  * OpenAI-compatible API works with vLLM; retry of failed clips on selected lines

  Text to speech:
  * New engines: OpenAI-compatible TTS, ElevenLabs v4/v4 Turbo, KugelAudio and Supertonic-3
  * Voice manager with transcripts, voice packs and copying voices between engines
  * "Remove original speech", "Speak from current line" and "Play with speech"
  * Optional Sidon cleaning of voice-clone reference audio

  Auto-translate and AI:
  * New engines: LM Studio advanced and API Route, model browsing, and new llama.cpp models (Index-Translate, TranslatePsy-AfriSLM)
  * Translate in place, translate one file into several languages in batch convert, and a no-prompt shortcut
  * 22 more languages for the AI engines, MyMemory without an API key, and line breaks kept for ChatGPT/Anthropic
  * AI review: prompt templates and reference context

  OCR:
  * nOCR: much better accuracy, new Cyrillic database, "Optimize database", and a redesigned trainer
  * Find and Replace in the OCR window, remembered pre-processing settings, and a per-language spell check dictionary
  * Romanian and Croatian OCR fix lists; better word splitting

  Subtitle formats:
  * Read CEA-608/708 closed captions from .ts, .mkv, .mp4, .mxf, .vob, .mpg and .m2v
  * New: EZTitles binary (.ezt), PSP UMD Video, HD-DVD sup, Cheetah Caption ASC, ELR Studio and more SE 4 formats opened again
  * Transport stream, MP4 caption, CEA-708 and Blu-ray sup timing fixes; PAC code page detection and secondary code page
  * ASSA draw: redesigned with layers, shape library, curve tools, SVG import and live preview
  * ASSA styles: overwrite/keep both on import, reorder, font collector; Source view syntax highlighting

  Batch convert and seconv:
  * Batch convert: named presets, new functions and filters, multi-language translate, OCR language per file, and many format settings
  * seconv: DVD sup and IMSC image outputs, openai-compatible and DeepL translate, nOCR optimize, and more SE 4 formats

  Accessibility and UI:
  * Screen reader names across settings and tool windows, F1 help in 145 more dialogs, and remembered dialog sizes/positions
  * Settings show one category at a time with search and back/forward navigation; settings auto-backup
  * macOS-standard default shortcuts and a new rounded app icon

  Translations and engines:
  * All language files synced with English
  * Updated engines: Crisp ASR v0.8.43, whisper.cpp v1.9.5, llama.cpp b11553, CrispEmbed v0.17.12, audio.cpp v0.9.1, WhisperX build 103, FFmpeg 9.0.2 (Windows), libVLC 3.0.24 (Windows), Avalonia 12.1.4 and Flatpak runtime 26.08

    A big thank you to everyone who tested the pre-releases, reported issues and
    contributed code and translations - and a special thanks to Anthropic for
    sponsoring a Claude subscription used in the development of this release :)
