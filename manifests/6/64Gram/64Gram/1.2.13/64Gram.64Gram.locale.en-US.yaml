ReleaseNotes: |-
  v1.2.13 (TDesktop v7.4.4)
  - [Fix] Built-in updater
  - [Change] Rename binary and application data path to 64Gram

  NOTE:
  Due to changes in the built-in updater, a manual reinstallation (or update via winget) is required this time to receive future auto-updates.
  Additionally, the Windows application data path has changed from %APPDATA%\Telegram Desktop to %APPDATA%\64Gram.
ReleaseNotesUrl: https://github.com/TDesktop-x64/tdesktop/releases/tag/v1.2.13
InstallationNotes: |-
  The application data path has changed in v1.2.13.
  To keep your existing login session and settings without logging in again:
  1. Completely quit 64Gram.
  2. Rename your data folder from %APPDATA%\Telegram Desktop to %APPDATA%\64Gram.
  3. Launch the new version.
