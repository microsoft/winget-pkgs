ShortDescription: Frame is a high-performance media conversion utility built with Rust and GPUI. It provides a native interface for FFmpeg operations.
Description: Frame is a high-performance media conversion utility built with Rust and GPUI. It provides a native interface for FFmpeg operations, allowing for granular control over video, audio, image, subtitle, and metadata transcoding parameters. The application leverages a Rust-native architecture for concurrent task management, hardware encoding, and local process execution.
