ReleaseNotes: |-
  Linux and WSL2 now produce the same layout as Windows through a shared renderer.
  Display works on both platforms, with a registry EDID fallback on Windows.
  The public IP lookup no longer blocks the first frame: it runs on its own
  thread with a bounded wait, so a slow resolver can no longer stall the
  output for seconds.
  Fixed a bare LF that merged consecutive lines when the output was piped
  over ssh, and a too narrow disk_volume field that dropped the disk row on
  Linux.
ReleaseNotesUrl: https://github.com/00vez/hardfetch/releases/tag/3.4
ShortDescription: Compact system info tool, neofetch style, in a single 215 KB executable
Description: |-
  hardfetch prints operating system, board, uptime, CPU, RAM, GPU, disk,
  network and display information in a compact block, in the spirit of
  neofetch.

  It is a single statically linked executable of about 215 KB that needs no
  configuration and starts in roughly 50 milliseconds, where neofetch and
  fastfetch take considerably longer.

  Flags:
  -a   adds build, kernel, shell, terminal, iGPU, display, every network
       interface and the public IP address
  -l   refreshes the view in place; q, Esc or Ctrl+C quits
  -d   prints per module timings and the data source that was used

  Windows and Linux produce the same layout. A field the platform cannot
  supply is left out rather than guessed.
