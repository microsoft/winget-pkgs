ShortDescription: A browser built just for you
Description: |-
  Vex is a Chromium desktop browser (built on castLabs Electron, so Widevine DRM works). It pairs a private, ad-free browsing core with built-in tools:
  - ad and tracker blocking, fingerprint protection, DNS-over-HTTPS, HTTPS-only mode, one-click Tor and a DPI-bypass proxy
  - vertical or top tabs, tab groups, workspaces and split screen
  - an AI assistant that can act on your tabs
  - sidebar app panels, password and 2FA autofill, end-to-end encrypted sync and a Ctrl+K command bar
