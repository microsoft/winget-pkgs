ReleaseNotes: |-
  New
  - An on/off switch for every feature. Settings > Feature switches lists every feature of Vex with its own switch and a search box, and each feature's own Settings section starts with the same switch. A feature that is off loses its Settings section; nothing you made with it is deleted. Turning one off shows where to turn it back on, with an Undo.
  - Mouse gestures has its own switch. The new "Mouse gestures" switch stops every stroke, including the built-in ones.
  Changed
  - The page hook that finds closed shadow roots is now a Proxy of the browser's own function, so a page cannot tell it from the native one.
