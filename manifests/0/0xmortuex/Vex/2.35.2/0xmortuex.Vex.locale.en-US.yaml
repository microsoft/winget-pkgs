ReleaseNotes: |-
  Fixes
  - Sync no longer deletes what it does not understand: data another device puts in your account that this version of Vex does not use is passed along untouched instead of being marked deleted.
  - An emptied account is rebuilt cleanly: if the account's data on the sync server is lost while devices stay signed in, the next sync uploads only what this device has.
  - No duplicate bookmarks when you join sync with your recovery code.
