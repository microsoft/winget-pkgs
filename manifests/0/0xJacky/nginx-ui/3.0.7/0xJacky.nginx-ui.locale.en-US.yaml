ReleaseNotes: |-
  Features
  - Each external notifier can choose which message levels it receives (Info, Success, Warning, Error), so you can, for example, keep backup failure emails while dropping routine success messages. Existing notifiers keep receiving every level, and the editor warns when no level is selected by @mvanhorn @0xJacky (cb7448a9, 3c18cd45)
  Bug Fixes
  - Failed logins no longer hold a process-wide lock during the failure delay, so a few clients sending wrong passwords can no longer stall everyone else's login. Failed logins of other clients can also no longer make a correct recovery-code login fail (GHSA-x555-5gj2-3m5v) by @0xJacky (b6e6903e, acc78497)
  - The cluster proxy no longer forwards the caller's session token, secure session header, cookies or token query parameters to child nodes (GHSA-qr45-gvxx-97q7) by @0xJacky (09c423d4, 12ffda31)
  - Proxied WebSockets to HTTPS child nodes now verify the child's TLS certificate, as proxied HTTP requests already did. [http] InsecureSkipVerify still applies (GHSA-jwjw-58j4-627j) by @0xJacky (3d6786d1)
  - Settings values that app.ini cannot store faithfully, such as line breaks combined with triple quotes, a trailing backslash or a %(name)s reference, are now refused with error 40007 instead of being written and read back as different keys (GHSA-jjg7-4xmx-2vvh) by @0xJacky (f1425666)
  - Read-only service tokens can no longer read, through the cluster proxy, files that a child node's own configuration names as secrets. Until a child node is upgraded, the controller refuses read-only file reads from it and redacts its config history content (GHSA-x49v-g3gc-3w78) by @0xJacky (446fb808)
  - Sites whose proxy_pass points to an inline unix socket, such as http://unix:/path/to.sock:, are now checked through that socket instead of unix:80 by @hnwg (df7f00a7)
  - The NGINX log dashboard reads its date range in the browser's time zone, so it no longer shows an empty range after local midnight in time zones east of UTC by @0xJacky (274ef107)
  - The linux/arm/v5 Docker image is no longer published. It carried an ARMv7 build of s6-overlay and could not start on ARMv5 hardware; the prebuilt linux-arm32-v5 binary is still released. The linux/riscv64 image is now built on NGINX 1.31.9 like the other platforms by @0xJacky (418242d9)
  中文更新日志
  新功能
  - 每个外部通知渠道都可以单独选择接收哪些级别的消息（Info、Success、Warning、Error），例如只保留备份失败的邮件，不再接收日常的成功消息。已有的通知渠道仍接收所有级别；一个级别都不选时，编辑器会给出提示 by @mvanhorn @0xJacky (cb7448a9, 3c18cd45)
  问题修复
  - 登录失败后的延迟不再占用全局锁，少数客户端反复输错密码不会再拖慢其他人的登录；其他客户端的失败登录也不会再导致正确的恢复码登录失败（GHSA-x555-5gj2-3m5v） by @0xJacky (b6e6903e, acc78497)
  - 集群代理不再把调用方的会话令牌、安全会话请求头、Cookie 和 token 查询参数转发给子节点（GHSA-qr45-gvxx-97q7） by @0xJacky (09c423d4, 12ffda31)
  - 代理到 HTTPS 子节点的 WebSocket 现在会校验子节点的 TLS 证书，与代理 HTTP 请求的行为一致。[http] InsecureSkipVerify 依然有效（GHSA-jwjw-58j4-627j） by @0xJacky (3d6786d1)
  - app.ini 无法原样保存的设置值（例如带三引号的换行、末尾反斜杠或 %(name)s 引用）现在会被拒绝并返回错误 40007，不会再写入后被读成其他配置项（GHSA-jjg7-4xmx-2vvh） by @0xJacky (f1425666)
  - 只读服务令牌无法再通过集群代理读取子节点自身配置中标记为密钥的文件。子节点升级之前，主节点会拒绝只读令牌对该节点的文件读取，并隐藏其配置历史的内容（GHSA-x49v-g3gc-3w78） by @0xJacky (446fb808)
  - proxy_pass 指向内联 unix socket（如 http://unix:/path/to.sock:）的站点，现在通过该 socket 检查，不再连接 unix:80 by @hnwg (df7f00a7)
  - NGINX 日志仪表盘按浏览器所在时区读取日期范围，在 UTC 以东的时区过了当地零点后不再显示空数据 by @0xJacky (274ef107)
  - 不再发布 linux/arm/v5 Docker 镜像。该镜像内是 ARMv7 构建的 s6-overlay，无法在 ARMv5 设备上启动；预编译的 linux-arm32-v5 二进制文件仍会继续发布。linux/riscv64 镜像现在与其他平台一样基于 NGINX 1.31.9 构建 by @0xJacky (418242d9)
