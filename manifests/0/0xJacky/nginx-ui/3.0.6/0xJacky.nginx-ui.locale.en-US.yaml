ReleaseNotes: |-
  Features
  - None.
  Bug Fixes
  - Docker images are rebuilt on NGINX 1.31.9, which fixes the five NGINX2Root vulnerabilities (CVE-2026-123007, CVE-2026-123633, CVE-2026-123634, CVE-2026-121810, CVE-2026-113425). If NGINX UI manages an NGINX you installed yourself, upgrade that NGINX to 1.31.9 or 1.30.7. NGINX2Root can also use an unpatched Linux kernel SCTP flaw to reach the host; see the disclosure for host-side mitigations by @0xJacky
  - The linux/arm/v6 Docker image starts on ARMv6 boards such as the Raspberry Pi Zero W. It shipped an ARMv7 build of s6-overlay, which stopped with an illegal instruction error by @0xJacky (5a8e3f07)
  - Read-only service tokens are refused every file that an NGINX directive reads a secret from, however the file is named and however its path is quoted or spelled (GHSA-wxp5-6x82-7qf4) by @0xJacky (367ef434)
  中文更新日志
  新功能
  - 无。
  问题修复
  - Docker 镜像改用 NGINX 1.31.9 重新构建，修复 NGINX2Root 的五个漏洞（CVE-2026-123007、CVE-2026-123633、CVE-2026-123634、CVE-2026-121810、CVE-2026-113425）。如果 NGINX UI 管理的是你自行安装的 NGINX，请将其升级到 1.31.9 或 1.30.7。NGINX2Root 还可能借助一个尚未修复的 Linux 内核 SCTP 漏洞控制宿主机，宿主机侧的缓解措施见披露文章 by @0xJacky
  - linux/arm/v6 Docker 镜像现在可以在 Raspberry Pi Zero W 等 ARMv6 设备上启动。此前镜像内的 s6-overlay 是 ARMv7 构建，启动时会因非法指令退出 by @0xJacky (5a8e3f07)
  - 只读服务令牌无法读取 NGINX 指令从中读取密钥的任何文件，无论文件如何命名、路径如何加引号或采用何种写法（GHSA-wxp5-6x82-7qf4） by @0xJacky (367ef434)
