ReleaseNotes: |-
  Features
  - Add a Snippets page to manage reusable Nginx snippets: edit them on their own page with variables and a live preview, start from built-in templates, include them from the site editor, and sync them to nodes by @Hintay (dd7a40a7, d4bb80f6, f711f7b0, 2a9fb2cd)
  - Pick a config template when creating a site by @akinoccc (dde9c05a)
  - Set a custom URL that a dashboard site card opens when clicked by @EFX1SZH (bb7d07a6)
  Bug Fixes
  - Fix "database is locked" errors across the app after upgrading to v2.8.x, caused by the site check auto-upgrade waiting on its own SQLite transaction (#1994) by @0xJacky (f7ab4d9a)
  - Stop access list saves from holding the database lock while Nginx tests and reloads by @0xJacky (b2cb7530)
  - Replicate certificates to the nodes that serve them, so synced sites no longer fail with "cannot load certificate" and renewals reach those nodes by @0xJacky (06c8f951)
  - Complete the Korean translation and fill in missing translations for the other languages by @0xJacky (933a8560, ce183d87)
  Contributors
  @0xJacky
  @Hintay
  @akinoccc
  @EFX1SZH
