ReleaseNotes: |-
  Features
  - None.
  Bug Fixes
  - Validate include patterns the way nginx resolves them, covering POSIX bracket expressions, backslash escapes, ./.. components and byte-wise matching (GHSA-8mrc-pvvv-f7p8) by @0xJacky (e627f5a5, 64460e6c)
  - Remove deleted logs from the log list and index once no configuration declares them and their files are gone by @0xJacky (0c5fec96)
  - Save wildcard certificates on Windows by storing them under # directories by @0xJacky (77ae4d9c)
  - Keep the code of server level *_by_lua_block directives when a site config is rebuilt, such as entering maintenance mode by @Dev-next-gen (9b6d1b55)
  - Allow lua_package_path and lua_package_cpath, so configs such as the CrowdSec bouncer can be saved by @0xJacky (34c27a28)
  - Count bond interfaces in network statistics and the dashboard IP by @0xJacky (c769fa28)
  - Fix logrotate rescheduling, an auto-backup restart deadlock, the GeoLite custom path being overwritten, initial user restore, scheme-less cluster node URLs and version check error handling by @0xJacky (526122a2)
  Contributors
  @0xJacky
  @Dev-next-gen
