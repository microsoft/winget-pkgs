ReleaseNotes: |-
  Features
  - Add reusable IP access lists for sites and streams by @0xJacky (5fc9a08e)
  - Manage standalone upstream groups, reference them from sites, and convert a site's upstream block into a shared group with a shared memory zone by @0xJacky (851b9e2a)
  - Toggle upstream servers and search from the upstream groups page by @0xJacky (e8fcfbbb)
  - Switch nodes from the header and work on two nodes side by side by @0xJacky (5e18ac05)
  - Save each preference tab through its own endpoints by @0xJacky (f7365aac)
  - Discover LLM models from the provider endpoint by @0xJacky (00ac4712)
  - Choose the LLM model and thinking level per chat by @0xJacky (aeb37a71)
  - Show the thinking process of reasoning models by @0xJacky (f0eb46c6)
  - Index HTTP server blocks from nginx -T by @0xJacky (a5317221)
  - Add a finish button, namespace and access select to the site flows by @0xJacky (be4c8d39)
  - Export and import certificates as zip archives by @0xJacky (dfaa22f1)
  - Deploy certificates in directory sync and report skipped files by @0xJacky (72d73589)
  - Recommend an existing certificate that covers the site when enabling HTTPS by @0xJacky (f7fe3b68)
  - Polish the layouts of the sites list, nodes status, ACME user and certificate pages by @EFX1SZH (e5cc3618)
  - Rebuild the preference page as a settings center with setting rows, and track unsaved changes against a snapshot by @Hintay (33c27204)
  Bug Fixes
  - Probe HTTP-01 routes on the sockets that serve each domain by @0xJacky (d8e5f21b)
  - Check certificate SANs when matching existing certificates by @0xJacky (e796c3ea)
  - Translate certificate issuance errors and log them once by @0xJacky (e44097ac)
  - Stop replicated changes from bouncing between cluster nodes by @0xJacky (618fde30)
  - Honor InsecureSkipVerify on the node analytic WebSocket by @0xJacky (64546410)
  - Let the controller open a child node's terminal by @0xJacky (a6fcfaac)
  - Update only the DDNS records the user selected by @0xJacky (b5d5bea0)
  - Make batch namespace edits work for sites and streams by @0xJacky (f473e692)
  - Render the batch edit preview correctly by @0xJacky (bf9c6433)
  - Keep non-ASCII characters in per-site access log names by @0xJacky (f22e094f)
  - Confine managed upstream paths to conf.d by @0xJacky (c9d4cb5b)
  - Key managed upstream group health by resolved socket by @0xJacky (e1c02c77)
  - Keep hidden sensitive input values out of the DOM by @0xJacky (20ac34df)
  - Copy to the clipboard over plain HTTP by @0xJacky (4729212c)
  - Keep modal focus working over drawers by @0xJacky (1eeb1392)
  - Keep overflowing right panel tabs reachable via the more menu by @0xJacky (9869d03e)
  - Center the header banners again by @0xJacky (652d94c1)
  - Use "No." as the site index column title by @0xJacky (14038d2a)
  - Keep message contexts in the web translation catalog by @Hintay (7d021725)
  - Keep gettext catalogs free of locations and fuzzy entries by @Hintay (f34c3fc4)
  - Allow dismissing the 2FA prompt by @0xJacky (79caf96b)
