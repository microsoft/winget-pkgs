ReleaseNotes: |-
  Features
  - None.
  Bug Fixes
  - Member nodes now apply configuration batches in the background. This prevents a slow NGINX test or reload from timing out the batch request during namespace sync. The controller waits for the result before syncing dependent sites and streams. Upgrade the controller and member nodes to use this fix by @0xJacky (90264da5)
  - Renaming a namespace on the controller and syncing it now updates the existing namespace on each member, preserving its ID and site and stream associations. Existing duplicate namespaces require manual review by @0xJacky (90264da5)
  中文更新日志
  新功能
  - 无。
  问题修复
  - 从节点现在会在后台应用配置批次。同步命名空间时，即使 NGINX 检查或重载耗时较长，批量请求也能及时返回。主节点会等待执行结果，再同步依赖这批配置的站点和流。主节点和从节点都需升级才能使用此修复 by @0xJacky (90264da5)
  - 在主节点重命名命名空间后执行同步，从节点会更新原有命名空间，保留其 ID 以及关联的站点和流。升级前已经产生的重复命名空间仍需人工核对 by @0xJacky (90264da5)
