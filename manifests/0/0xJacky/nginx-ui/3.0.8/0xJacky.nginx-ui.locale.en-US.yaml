ReleaseNotes: |-
  Features
  - Plugin browser bundles can list the stored DNS credentials with window.NginxUI.shared.ui.listDnsCredentials(). It never returns their configuration or secrets and needs no permission, so a DNS-01 form can offer the stored credentials without core_api by @0xJacky (ab8c4ff8)
  - Deprecated: registry.coreHttp for a plugin without the approved core_api permission, and window.NginxUI.shared.http. They keep working in this release and log a warning in the browser console on first use; a later release rejects them. Third-party plugins that call the Nginx UI REST API should declare core_api and use registry.coreHttp by @0xJacky (ab8c4ff8)
  Bug Fixes
  - The certificate list shows which sites and streams use each certificate again. The "Used By" column had been missing since the list was redesigned in v3.0.0 by @0xJacky (a87ff193)
  - One-line blocks and directives that share a line, such as location /api/ { proxy_pass http://127.0.0.1:3000; } or upstream app { server a:80; server b:80; }, now show their proxy targets in the site and stream lists. Commented-out directives still add nothing by @bardrop (ada46422)
  中文更新日志
  新功能
  - 插件浏览器包可以通过 window.NginxUI.shared.ui.listDnsCredentials() 列出已保存的 DNS 凭据。它从不返回凭据的配置或密钥，也不需要任何权限，因此 DNS-01 表单无需 core_api 就能列出已保存的凭据 by @0xJacky (ab8c4ff8)
  - 弃用：没有已批准 core_api 权限的插件调用 registry.coreHttp，以及使用 window.NginxUI.shared.http，现已弃用。本版本中它们仍可使用，首次使用时会在浏览器控制台输出警告；之后的版本会拒绝这些调用。需要调用 Nginx UI REST API 的第三方插件请声明 core_api 并改用 registry.coreHttp by @0xJacky (ab8c4ff8)
  问题修复
  - 证书列表重新显示每张证书被哪些站点和 Stream 使用。自 v3.0.0 重新设计列表以来，“被使用于”一列一直缺失 by @0xJacky (a87ff193)
  - 写在同一行的块和指令，例如 location /api/ { proxy_pass http://127.0.0.1:3000; } 或 upstream app { server a:80; server b:80; }，现在也会在站点和 Stream 列表中显示代理目标。被注释掉的指令仍不会计入 by @bardrop (ada46422)
  Contributors
  @0xJacky
  @bardrop
