ReleaseNotes: |-
  Features
  - Add notification deep links with backend-provided URLs and richer external notification templates with channel-specific level colors by @EFX1SZH (9b611f80, d4611240).
  - Support configurable local GeoJSON boundary files for nginx log dashboard maps by @EFX1SZH (6ad5c1ff, 079481a3).
  - Allow users to delete a certificate even when revocation fails by @0xJacky (093181ef).
  Bug Fixes
  - Keep terminal sessions visible and usable after switching tabs or pages by @EFX1SZH (3c7ddae8).
  - Stabilize shared WebSocket lifecycles across upstream monitoring, session changes, code completion, dashboards, and disconnected peers by @0xJacky (f722ff94, 2b5dbad4, 19fe5314, 967a1c2a, 33761778).
  - Use HTTPS for the default AWS S3 backup endpoint by @Dev-next-gen (a4298ec3).
  - Report certificate revocation outcomes accurately and clean up deSEC DNS records correctly by @Dev-next-gen and @0xJacky (1851a914, 0aea1072, d750df2f).
  - Fall back to CDN map boundaries and parse province drill-down data correctly when local GeoJSON files are not configured by @EFX1SZH (ec165b32, 2105f2da).
  - Preserve upstream availability results across configuration rescans by @0xJacky (4ae7bd9c).
  - Ignore commented directives when calculating nginx performance configuration by @Dev-next-gen (8369f607).
  - Accept Bark notification configurations without a device key by @Dev-next-gen (cf5d576c).
  - Reload configuration editor state when switching between sites or streams by @0xJacky (f981b8f8).
  - Preserve namespaces and stage managed configurations correctly during cluster propagation by @0xJacky (7626fd40, bb180726).
  - Harden MCP request parsing, user-management authorization, sensitive credential reads, demo health checks, and passkey session handling by @0xJacky (66471391, cb27607c, 9594b04d, 64bc599e, d766e90b, 6c76811e).
