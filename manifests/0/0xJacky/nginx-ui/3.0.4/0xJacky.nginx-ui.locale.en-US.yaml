ReleaseNotes: |-
  Features
  - None.
  Bug Fixes
  - Syncing a namespace or pushing content to nodes no longer fails with a 504 from the reverse proxy when there are dozens of sites. The sync now runs in the background: the Sync button shows its progress and the result appears when it finishes, even after the dialog is closed by @0xJacky (a301b5bc)
  - Restarting Nginx in the official Docker image no longer starts a second Nginx outside s6 when NGINX_UI_IGNORE_DOCKER_SOCKET is set, as on AWS Fargate. That Nginx kept the ports, so the supervised one failed with Address already in use in a loop. The image is now also recognized when the platform drops NGINX_UI_OFFICIAL_DOCKER by @0xJacky (274af5dc)
  - User names can be up to 255 characters and passwords up to 72, so OIDC users whose identifier is an email address or UPN can sign in, and generated passwords are accepted (#2119) by @bardrop (5135a117)
  - Site Check no longer logs the same unresolved site_config warning on every pass (#2118) by @0xJacky (b93764b2)
  - Simplified and Traditional Chinese regain 13 missing log index and GeoLite texts, and the new cluster sync and node proxy messages are translated in every language by @0xJacky (6be081db)
  中文更新日志
  新功能
  - 无。
  问题修复
  - 站点数量达到几十个时，同步命名空间或向节点推送内容不会再被反向代理返回 504。同步改为在后台执行：“同步”按钮会显示进度，完成后显示结果，关掉对话框也不影响 by @0xJacky (a301b5bc)
  - 在官方 Docker 镜像中设置了 NGINX_UI_IGNORE_DOCKER_SOCKET（例如 AWS Fargate）时，重启 Nginx 不会再在 s6 之外启动第二个 Nginx。此前那个 Nginx 会占住端口，s6 管理的 Nginx 因 Address already in use 反复启动失败。即使平台丢掉了 NGINX_UI_OFFICIAL_DOCKER，现在也能识别出官方镜像 by @0xJacky (274af5dc)
  - 用户名最长可达 255 个字符、密码最长可达 72 个字符，以邮箱或 UPN 作为标识的 OIDC 用户可以登录，密码管理器生成的密码也能使用（#2119） by @bardrop (5135a117)
  - 站点检查不再在每一轮都重复输出同一条无法解析 site_config 的警告（#2118） by @0xJacky (b93764b2)
  - 简体中文和繁体中文补回了 13 条缺失的日志索引和 GeoLite 相关文案，新增的集群同步和节点代理提示也已翻译为所有语言 by @0xJacky (6be081db)
  Contributors
  @0xJacky @bardrop
