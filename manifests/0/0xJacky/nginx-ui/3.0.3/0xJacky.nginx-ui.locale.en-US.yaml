ReleaseNotes: |-
  Features
  - None.
  Bug Fixes
  - The DNS-01 challenge form of the official DNS-01 plugin, with the Follow CNAME and propagation check switches under Advanced options, loads again. Plugin 1.0.0 declared an antdv-next range that no 3.0 release matched, so Nginx UI fell back to the built-in form (#2113). Fixed in DNS-01 plugin 1.0.1 by @0xJacky (94da658d, 9281e4c6, 796ce2d2)
  - DNS-01 issuance removes its _acme-challenge TXT records again. Cleanup failed with unknown record ID for Cloudflare, ISPConfig and other providers that remember the record they created (#2113, #2115). Fixed in DNS-01 plugin 1.0.1 by @0xJacky (9b3fc388)
  - DNS-01 propagation checks only wait for the authoritative nameservers again, as in 2.x, so local resolvers such as systemd-resolved no longer stall issuance. Checking public resolvers is now an opt-in switch per certificate (#2115). Fixed in DNS-01 plugin 1.0.1 by @0xJacky (ae3eb865)
  The Docker image bundles DNS-01 plugin 1.0.1 and upgrades an installed 1.0.0 on start. Other installs can update the plugin on the Plugins page.
  中文更新日志
  新功能
  - 无。
  问题修复
  - 官方 DNS-01 插件的验证表单（“高级选项”中的 Follow CNAME 和传播检查开关）恢复加载。插件 1.0.0 声明的 antdv-next 版本范围与所有 3.0 版本都不匹配，Nginx UI 因此退回到内置表单（#2113）。已在 DNS-01 插件 1.0.1 中修复 by @0xJacky (94da658d, 9281e4c6, 796ce2d2)
  - DNS-01 签发后会重新清理 _acme-challenge TXT 记录。此前 Cloudflare、ISPConfig 等会记住所创建记录的服务商在清理时报 unknown record ID（#2113、#2115）。已在 DNS-01 插件 1.0.1 中修复 by @0xJacky (9b3fc388)
  - DNS-01 传播检查恢复为与 2.x 相同、只等待权威 DNS 服务器，systemd-resolved 等本地解析器不会再卡住签发。检查公共解析器改为每张证书可选开启的开关（#2115）。已在 DNS-01 插件 1.0.1 中修复 by @0xJacky (ae3eb865)
  Docker 镜像内置 DNS-01 插件 1.0.1，启动时会把已安装的 1.0.0 升级上去。其他安装方式可以在“插件”页面更新插件。
  Contributors
  @0xJacky
