ReleaseNotes: |-
  Features
  - Redesign the home hub with pinnable configuration favorites and clearer navigation by @0xJacky (36336a56).
  - Add descriptions, copy actions, and stable ID-based ordering and labels for external notification providers by @EFX1SZH (43317f59).
  - Remember the selected upgrade channel and allow reinstalling the same development commit by @EFX1SZH (dd526f0e).
  - Support internationalized domain names across DNS providers, searches, records, and DDNS while displaying their Unicode form by @0xJacky (6476cc40, bb102ade, 0c88fbbc, 83b53e76, 09508454).
  Bug Fixes
  - Complete OIDC login error handling, proxy-aware callbacks, hash-route redirects, and two-factor submission after the credentials form unmounts by @EFX1SZH and @0xJacky (b37d9989, 8390bf12, 6571e530, ab386ebd).
  - Restore certificate list actions across desktop and mobile layouts and keep the view transitionable by @be-student (2de0711b, 4544a506, 4b512395).
  - Preserve secure group-readable permissions when writing certificate keys by @0xJacky (7604b231).
  - Keep long sidebar tab titles within the available navigation width by @EFX1SZH (2ef489a5).
  - Restore page and card headers, including the Sites edit action and dashboard navigation controls by @EFX1SZH and @0xJacky (7aa7e6d7, b8e460e8, 6f11187d).
  - Improve nginx log type detection and keep time-range and view controls visible by @EFX1SZH (1223addf).
  - Make preference pages and form controls use the available space while retaining content-sized fields by @EFX1SZH and @0xJacky (f6794e84, d636475c).
  - Restore missing translation catalog entries and make external notifier field labels translatable by @0xJacky and @EFX1SZH (a275fafe, 7924475e, 4cc2b64a).
  - Show the correct current commit SHA on the upgrade page by @EFX1SZH (bdfd7fd4).
  - Probe nginx upstreams that use unix: socket addresses against the underlying filesystem path by @Dev-next-gen (2d3fd9da).
  - Let the sidebar menu scroll far enough to reach its final entry by @0xJacky (5f3cb92e).
  Contributors
  @0xJacky
  @EFX1SZH
  @be-student
  @Dev-next-gen
