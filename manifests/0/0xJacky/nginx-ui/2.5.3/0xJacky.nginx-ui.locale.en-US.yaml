ReleaseNotes: |-
  Features
  - Add an official Helm chart with a self-hosted repository at https://cloud.nginxui.com/helm.
  - Add a signed, self-hosted OpenWrt 25.12 APK repository for six supported architectures.
  - Add official standalone and SWAG templates for Unraid through nginxui/unraid.
  - Add scoped CLI remote management for sites, streams, certificates, backups, and Nginx operations (#1771).
  - Add a unified health-check control plane, configurable alerts, and multi-node configuration synchronization.
  Bug Fixes
  - Prevent Nginx log index corruption and reduce search, indexing, and analytics resource usage.
  - Restore the Cloudflare DNS production API base URL.
  - Keep cluster directory synchronization working when a directory contains unsupported configuration names.
  Contributors
  @0xJacky
