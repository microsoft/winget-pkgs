ReleaseNotes: |-
  [0.8.13] - 2026-10-24
  Fixed
  - Keep the grid accurate after a partly failed bulk delete (#1169)
  - Retry prefer TLS in plaintext only after a TLS negotiation failure (#1164)
  - Use TLS certificate files from the form and URI (#1149)
  - Skip the hostname check for verify-ca on PostgreSQL and Redshift (#1140)
  - Validate AWS SSM access parameters before opening a tunnel (#1165)
  - Validate the server certificate against a private CA (#1150)
  - Reject a profile combined with static access keys (#1151)
  - Honor auto-refresh visibility and pause-on-error in chart tabs (#1142)
  - Let the SDK default chain pick the region for value sources (#1141)
  - Reopen last connections without restoring the session (#1137)
  - Make q switch to the previous sidebar tab (#1138)
  - Remove the empty Source section from the chart Stats rail (#1136)
  - Map Save File As and Open Script File from the palette (#1135)
  - Leave Create Folder unconsumed on the Dashboards tab (#1133)
  - Import the login shell PATH on desktop launches (#1134)
  - Log and ignore commands no dispatch domain routes (#1131)
  - Report TIME columns as ColumnKind::Unknown (#1129)
  Installation
  Linux
  Tarball (recommended)
  # Download and extract (replace amd64 with arm64 for ARM)
  wget https://github.com/0xErwin1/dbflux/releases/download/v0.8.13/dbflux-linux-amd64.tar.gz
  tar -xzf dbflux-linux-amd64.tar.gz
  # Run installer
  sudo ./scripts/install.sh
  AppImage (portable)
  # Download (replace x86_64 with aarch64 for ARM)
  wget https://github.com/0xErwin1/dbflux/releases/download/v0.8.13/dbflux-x86_64.AppImage
  chmod +x dbflux-x86_64.AppImage
  ./dbflux-x86_64.AppImage
  macOS
  DBFlux for macOS is not signed with an Apple developer certificate. When opening for the first time:
  1. Download the DMG for your architecture:
     - Intel Macs: dbflux-macos-amd64.dmg
     - Apple Silicon (M1/M2/M3): dbflux-macos-arm64.dmg
  2. Open the DMG and drag DBFlux to Applications
  3. When you see "unidentified developer", go to System Preferences → Privacy & Security
  4. Click Open Anyway next to the warning
  5. Confirm you want to open the application
  Alternatively, from Terminal:
  xattr -cr /Applications/DBFlux.app
  Windows
  Installer
  1. Download dbflux-windows-amd64-setup.exe
  2. Run the installer and follow the wizard
  Portable
  1. Download dbflux-windows-amd64.zip
  2. Extract and run dbflux.exe
  > Note: The executable is not signed. Windows SmartScreen may show a warning. Click "More info" → "Run anyway".
  Verify Downloads
  All release artifacts are signed with GPG key A614B7D25134987A.
  Import the public key (one time)
  gpg --keyserver keyserver.ubuntu.com --recv-keys A614B7D25134987A
  Verify a detached GPG signature
  # Linux tarball
  gpg --verify dbflux-linux-amd64.tar.gz.asc dbflux-linux-amd64.tar.gz
  # Linux AppImage
  gpg --verify dbflux-x86_64.AppImage.asc dbflux-x86_64.AppImage
  # macOS DMG
  gpg --verify dbflux-macos-arm64.dmg.asc dbflux-macos-arm64.dmg
  # Windows ZIP
  gpg --verify dbflux-windows-amd64.zip.asc dbflux-windows-amd64.zip
  # Windows installer
  gpg --verify dbflux-windows-amd64-setup.exe.asc dbflux-windows-amd64-setup.exe
  Verify a native .deb package
  dpkg-sig --verify dbflux_*.deb
  Verify a native .rpm package
  rpm --checksig dbflux-*.rpm
  Verify a SHA256 checksum
  sha256sum -c dbflux-linux-amd64.tar.gz.sha256
