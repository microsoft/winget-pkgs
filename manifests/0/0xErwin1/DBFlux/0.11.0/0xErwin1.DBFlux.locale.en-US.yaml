ReleaseNotes: |-
  [0.11.0] - 2026-11-21
  Added
  - Optional usage statistics with Off, Minimal and Basic (#1374)
  - Drag files out over XDND and finish Wayland file drags (#1371)
  - Cascading menus, and both DBFlux context menus migrated (#1365)
  - SQL expressions and type values in data-grid cells (#1360)
  - Run SQL scripts from the import wizard (#1359)
  - Run SQL scripts statement by statement (#1353)
  - Pick the sheet when importing a spreadsheet (#1355)
  - Import XML files and add the spreadsheet import engine (#1351)
  - Align export and import wizards with the approved design (#1350)
  - Import a single CSV or JSON file (#1321)
  - Add SQL INSERT export (#1318)
  - Add export options for delimiter, encoding, NULL text and dates (#1317)
  - Add HTML, Markdown and XML export (#1316)
  - Add JSON Lines export and write JSON as one array (#1315)
  - Load the next rows when scrolling past a limited result (#1025)
  Fixed
  - Give the Welcome dialog more vertical space (#1375)
  - Keep the OS file picker and host AWS profiles out of tests (#1373)
  - Close PostgreSQL and Redshift clients outside Tokio (#1368)
  - Let connectionless tools follow the client's connection roles (#1367)
  - Detect the file chooser portal from its D-Bus service file (#1363)
  - Decide a target with no columns from the database listing (#1348)
  - List per-table results after a cancelled export (#1345)
  - Keep a relaxed-JSON collection filter on "Filter by value" (#1341)
  - Report an invalid custom time range on Apply (#1339)
  - Parse IPv6 hosts, encoded database names and passwords from connection URIs (#1337)
  - Write NUL-safe text literals and report TIME columns as Unknown (#1333)
  - Wrap Tab around the proxy and service forms (#1329)
  - Show the login error when SSO account discovery fails (#1327)
  - Cover the window with the palette overlay (#1319)
  - Give Value one equality definition (#1313)
  - Stop falling back to the public schema in the drift check (#1312)
  Installation
  Linux
  Tarball (recommended)
  # Download and extract (replace amd64 with arm64 for ARM)
  wget https://github.com/0xErwin1/dbflux/releases/download/v0.11.0/dbflux-linux-amd64.tar.gz
  tar -xzf dbflux-linux-amd64.tar.gz
  # Run installer
  sudo ./scripts/install.sh
  AppImage (portable)
  # Download (replace x86_64 with aarch64 for ARM)
  wget https://github.com/0xErwin1/dbflux/releases/download/v0.11.0/dbflux-x86_64.AppImage
  chmod +x dbflux-x86_64.AppImage
  ./dbflux-x86_64.AppImage
  macOS
  DBFlux for macOS is not signed with an Apple developer certificate. When opening for the first time:
  1. Download the DMG for your architecture:
     - Intel Macs: dbflux-macos-amd64.dmg
     - Apple Silicon (M1/M2/M3): dbflux-macos-arm64.dmg
  2. Open the DMG and drag DBFlux to Applications
  3. When you see "unidentified developer", go to System Preferences → Privacy & Security
  4. Click Open Anyway next to the warning
  5. Confirm you want to open the application
  Alternatively, from Terminal:
  xattr -cr /Applications/DBFlux.app
  Windows
  Installer
  1. Download dbflux-windows-amd64-setup.exe
  2. Run the installer and follow the wizard
  Portable
  1. Download dbflux-windows-amd64.zip
  2. Extract and run dbflux.exe
  > Note: Stable and release-candidate builds are Authenticode-signed. Nightly builds are not. Windows SmartScreen may still show a warning, more often for unsigned builds. Click "More info" → "Run anyway".
  Free code signing provided by SignPath.io, certificate by SignPath Foundation. See the code signing policy.
  Verify Downloads
  All release artifacts are signed with GPG key A614B7D25134987A.
  Import the public key (one time)
  gpg --keyserver keyserver.ubuntu.com --recv-keys A614B7D25134987A
  Verify a detached GPG signature
  # Linux tarball
  gpg --verify dbflux-linux-amd64.tar.gz.asc dbflux-linux-amd64.tar.gz
  # Linux AppImage
  gpg --verify dbflux-x86_64.AppImage.asc dbflux-x86_64.AppImage
  # macOS DMG
  gpg --verify dbflux-macos-arm64.dmg.asc dbflux-macos-arm64.dmg
  # Windows ZIP
  gpg --verify dbflux-windows-amd64.zip.asc dbflux-windows-amd64.zip
  # Windows installer
  gpg --verify dbflux-windows-amd64-setup.exe.asc dbflux-windows-amd64-setup.exe
  Verify a native .deb package
  dpkg-sig --verify dbflux_*.deb
  Verify a native .rpm package
  rpm --checksig dbflux-*.rpm
  Verify a SHA256 checksum
  sha256sum -c dbflux-linux-amd64.tar.gz.sha256
