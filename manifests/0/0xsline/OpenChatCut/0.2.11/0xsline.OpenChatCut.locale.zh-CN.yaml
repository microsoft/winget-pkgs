PackageIdentifier: 0xsline.OpenChatCut
PackageVersion: 0.2.11
PackageLocale: zh-CN
ShortDescription: 开源 ChatCut 替代 · Agent-native · local-first AI 视频编辑器。
Description: OpenChatCut 是开源的 ChatCut 替代品：把对话式 Agent 与专业时间线剪辑放进同一个工作区。每一次编辑都会写入工程中真实存在的轨道、片段、转场、字幕、特效与媒体，你可以继续手动剪辑、撤销或重做、保存版本，或把工程交给另一个 Agent。它支持 Agent-native 设计（内置 Agent 与外部 MCP Agent 共享同一套剪辑工具）、多轨时间线与转场特效、基于转录的剪辑（逐词转录、文本剪辑、停顿处理、发言人识别与字幕联动）、图像 / 视频 / 语音 / 音乐生成、WebGL 动态图形、浏览器内人像分割与人物安全区，以及 MP4、音频、字幕、FCPXML 与完整工程数据的生产级导出。工程与媒体默认保存在本机。
