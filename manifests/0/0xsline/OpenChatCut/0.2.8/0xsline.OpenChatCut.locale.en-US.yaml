ShortDescription: Open-source, local-first conversational AI video editor with a professional multi-track timeline, Agent Skills, MCP integration, and Remotion rendering.
Description: 'OpenChatCut is an open-source ChatCut alternative: a video editor that brings conversational agents and professional timeline editing into the same workspace. Every edit is written to real tracks, clips, transitions, captions, effects, and media inside the project, so you can keep editing manually, undo or redo changes, save versions, or hand the project to another agent. It features an agent-native design where the built-in agent and external MCP agents share the same editing tools, a real multi-track timeline with transitions, effects, LUTs, zooms, and keyframes, transcript-driven editing with word-level transcription and text-based cuts, image/video/speech/music generation, motion graphics with WebGL, visual geometry with in-browser person segmentation and face-safe zones, and production-ready exports to MP4, audio, captions, FCPXML, and complete project data. Projects and media stay on your machine by default.'
