ShortDescription: Safe Windows Explorer wrapper around Microsoft Sysinternals SDelete.
Description: SecureDelete adds a "Secure Delete" command to the Windows Explorer context menu for files and folders. It shows a confirmation dialog, then invokes Microsoft Sysinternals SDelete to securely overwrite and delete the selected item. SDelete is a separate Microsoft download and is not bundled. Runs as the current user with no elevation.
