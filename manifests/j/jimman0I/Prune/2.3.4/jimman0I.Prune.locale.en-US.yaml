ReleaseNotes: |-
  A fix to what the batch dialog says, and a newer build toolchain.
  - A batch of only Store apps no longer promises an uninstaller and a leftover scan it does not get; a mixed batch says which programs are which.
  - "No leftovers found - clean uninstall" only appears after a scan that ran, not after a Store-only batch or one where every uninstall failed.
  - Built with electron-builder 26, closing ten vulnerabilities in the build tools. None were ever in the installed app.
