ShortDescription: A Windows uninstaller that runs a program's own uninstaller, then finds and quarantines what it left behind.
Description: |-
  Prune runs a program's own uninstaller, then scans for what it left behind -- files, registry keys, scheduled tasks -- and removes those too. Nothing is deleted outright: leftovers go to a quarantine first, so a bad match can always be restored.

  Batch uninstall runs without a wizard per program where the installer can be positively identified (the vendor's own silent command, MSI, NSIS, Squirrel, and closed Chromium browsers), and removes a game before the launcher it uninstalls through. Microsoft Store apps can be removed in-app, one at a time or in a batch.

  It also includes a disk map built from the NTFS MFT, a cache cleaner with 74 rules, a startup manager, a duplicate finder and drive health from the drive's own SMART data. No telemetry, no update check, no network access.
