ShortDescription: A Windows uninstaller that finds and quarantines what programs leave behind.
Description: Prune runs a program's own uninstaller, then finds the leftover files, registry keys and scheduled tasks and moves them to a Quarantine you can restore from. It also has a disk map, a Deep Clean with measured cleaner rules, a startup manager and SSD health. No telemetry, everything runs locally.
