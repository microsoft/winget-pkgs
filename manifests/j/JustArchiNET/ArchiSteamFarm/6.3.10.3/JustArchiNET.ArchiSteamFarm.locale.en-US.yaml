ReleaseNotes: |-
  ### Changelog

  Changes since **[V6.3.9.6](https://github.com/JustArchi/ArchiSteamFarm/releases/tag/6.3.9.6)**:

  • Added initial support for QR code login prompt (@brendan-jarvis #3618 #2918).
  • Added support for steam install format in various `appID`-parsing paths (@Nuklon #3623).
  • Small `addlicense` text improvements (@mooons #3621).
  • Improved resilence against database corruptions (@JustArchi #3619).
  • Latest ASF-ui with new features, improvements and bugfixes (@MrBurrBurr).
  • Updated **[localization](https://github.com/JustArchiNET/ArchiSteamFarm/wiki/Localization)** provided by our community (@JustArchi-ArchiBot).
  • Usual amount of other core improvements, optimizations and bugfixes (@JustArchi).

