ReleaseNotes: "### Changelog\r\n\r\nChanges since **[V6.3.8.4](https://github.com/JustArchi/ArchiSteamFarm/releases/tag/6.3.8.4)**:\r\n\r\n• Added support for different formatting methods in our `Monitoring` plugin. Since this has a potential to be a breaking change, we recommend our users to read up **[updated docs](https://github.com/JustArchiNET/ArchiSteamFarm/wiki/MonitoringPlugin#prometheus-grafana-dashboard-and-metrics-escaping-scheme)** about this feature  (@JustArchi #3607).\r\n• Internal performance improvements for ASF STM listing in `ItemsMatcher` plugin (@JustArchi).\r\n• Fixed recent Steam breaking change that caused `inventory` command to no longer work (@JustArchi).\r\n• Latest ASF-ui with new features, improvements and bugfixes (@MrBurrBurr).\r\n• Updated **[localization](https://github.com/JustArchiNET/ArchiSteamFarm/wiki/Localization)** provided by our community (@JustArchi-ArchiBot).\r\n• Usual amount of other core improvements, optimizations and bugfixes (@JustArchi).\r\n\r\nAs a side note, we also updated design of **[STM listing](https://asf.justarchi.net/STM)** and **[sponsor goodies page](https://asf.justarchi.net/User)**.\r\n\r\n---\r\n\r\n### Support\r\n\r\nASF is available for free, this release was made possible thanks to the people that decided to support the project. If you're grateful for what we're doing, please consider a donation. Developing ASF requires massive amount of time and knowledge, especially when it comes to Steam (and its problems). Even $1 is highly appreciated and shows that you care. Thank you!\r\n\r\n[![GitHub sponsor](https://img.shields.io/badge/GitHub-sponsor-ea4aaa.svg?logo=github-sponsors)](https://github.com/sponsors/JustArchi) [![PayPal.me donate](https://img.shields.io/badge/PayPal.me-donate-00457c.svg?logo=paypal)](https://paypal.me/JustArchi) [![PayPal donate](https://img.shields.io/badge/PayPal-donate-00457c.svg?logo=paypal)](https://www.paypal.com/cgi-bin/webscr?cmd=_s-xclick&hosted_button_id=HD2P2P3WGS5Y