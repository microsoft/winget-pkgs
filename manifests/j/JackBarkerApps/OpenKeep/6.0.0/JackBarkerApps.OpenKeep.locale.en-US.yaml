ShortDescription: Private, open-source notes with encryption and your own cloud sync
Description: |-
  Open Keep is a privacy-focused note-taking app. Notes are kept on your PC in an encrypted database and never go to our servers.
  Sync them through your own Dropbox, OneDrive, Google Drive or WebDAV server, encrypted when you set a PIN.
  Markdown, checklists, labels, colours and reminders, import from Google Keep, Windows Hello unlock, and optional access for AI tools over MCP.
