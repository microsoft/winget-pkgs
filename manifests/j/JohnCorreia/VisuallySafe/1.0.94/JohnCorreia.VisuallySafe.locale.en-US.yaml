ShortDescription: A helpful antivirus companion that shows, with green, yellow and red badges, which files have been checked and are safe.
Description: |-
  Visually Safe is an easy front end for Microsoft Defender, made for people who find computers confusing.
  Every file and folder you scan gets a clear badge: a green tick when it has been checked and is safe, yellow when it deserves a look, and red when it is dangerous.
  It works alongside Microsoft Defender and does not replace it. A family member or carer can set it up for someone else, and an optional helper wizard explains things in plain words.
