ShortDescription: Turn speech into useful text.
Description: Utterform is a lightweight desktop voice-to-text utility. Record a short voice clip, transcribe it with OpenAI GPT Transcribe or local Whisper, optionally transform the text with a built-in or rewritten prompt, and send the result to the clipboard, a TXT/Markdown file, the focused window, or a combination of those. A reserved key combination starts and finishes a recording without raising the window.
