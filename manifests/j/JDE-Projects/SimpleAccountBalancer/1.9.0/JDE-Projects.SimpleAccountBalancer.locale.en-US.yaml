ShortDescription: Log every debit and credit as it happens to keep an always-current account balance.
Description: "Simple Account Balancer is a checkbook register: you log every debit and credit the moment it happens, so the register stays ahead of the bank and shows the real balance you have available, including pending future-dated entries. It supports multiple accounts, payee autocomplete, editable categories, recurring autopays for bills and deposits, search and date-range filtering, a compare view for reconciling against a bank balance, CSV export, and automatic rolling backups. Local only: your data never leaves the machine."
