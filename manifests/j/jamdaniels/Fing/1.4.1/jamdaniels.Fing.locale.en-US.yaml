ShortDescription: Privacy-first local speech-to-text. Hold a hotkey, speak, release, and the text is pasted.
Description: |-
  Fing is a lightweight tray app for private dictation in any app. Hold your hotkey, speak, and release; the transcribed text is pasted instantly. Double-tap the hotkey for hands-free recording.
  Transcription runs entirely on-device with Whisper or Parakeet models (GPU-accelerated with Vulkan), with no cloud processing, accounts or telemetry.
