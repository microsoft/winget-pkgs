ShortDescription: 面向科研写作、数据分析和工程任务的桌面 Agent 工作台，把 Agent、文件、编辑器和工作流放回同一个任务现场。
Description: ArHub（AI Research Hub）是一个面向科研写作、数据分析和工程任务的桌面 Agent 工作台，基于 Electron、FastAPI、OpenAI-compatible 模型接口和可扩展 Skill 工作流构建，支持 DeepSeek、GLM 等 OpenAI 兼容模型。ArHub 不把 Agent 限制在孤立的聊天框里：日常操作以对话为中心；当任务涉及文件、代码或其他产物时，文件树、编辑器和预览会在当前工作区按需展开。执行步骤、检查点、日志和产物会随任务持久化，方便继续运行、回看和审阅。
