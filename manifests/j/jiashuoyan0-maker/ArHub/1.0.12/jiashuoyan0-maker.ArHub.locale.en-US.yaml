PackageLocale: en-US
ShortDescription: Open-source AI research workspace built with Electron and FastAPI, featuring provider-neutral agent workflows for DeepSeek, GLM, and other OpenAI-compatible models.
Description: 'ArHub (AI Research Hub) is a desktop agent workbench for research writing, data analysis, and engineering tasks, built with Electron, FastAPI, OpenAI-compatible model interfaces, and extensible Skill workflows, supporting DeepSeek, GLM, and other OpenAI-compatible models. ArHub does not confine agents to an isolated chat box: day-to-day operations stay conversation-centric, and when a task touches files, code, or other artifacts, the file tree, editor, and preview expand on demand in the current workspace. Execution steps, checkpoints, logs, and artifacts persist with the task so you can resume, review, and audit later.'
