ReleaseNotes: |-
  Highlights
  - Makes Lite the only recommended Windows stable installer and stops ongoing Full releases. A one-time Lite bridge update from v1.0.11 prepares later application-only updates.
  - Adds background update checks and downloads, with installation on normal app exit. The first v1.0.11-to-v1.0.12 bridge still follows the confirmation flow implemented by the older client.
  - Fixes Agent runtime and reasoning-effort selections being overwritten by asynchronous detection or UI rerenders in the editor and Settings.
  - Keeps provider configuration, local Claude Code selection, and reasoning effort separated and persisted consistently.
  - Updates the Lite runtime to cryptography 50.0.0, resolving CVE-2026-69247 without a vulnerability exception in stable release gates.
  Update notes
  Updating from v1.0.11 requires one Lite installer download. Existing Full users will move to Lite: settings and workspaces remain, while bundled TeX, Draw.io, Pandoc, Git, Node/Claude, and large ML packages are no longer included. Launch v1.0.12 at least once. Stable Latest will not switch immediately to an app-only package while the bridge release is still rolling out.
  The Windows installer is still unsigned with Authenticode, so SmartScreen may warn about an unknown publisher. Download only from this repository's Release and verify SHA256.
