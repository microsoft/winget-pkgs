ShortDescription: Fast, local QEMU/KVM VM sandboxes for AI agents, with a native MCP server
Description: Nido spawns real QEMU/KVM virtual machines for autonomous AI agents. It ships linked clones, cloud images, templates, SSH/port forwarding and a native Model Context Protocol (MCP) server. QEMU must be installed separately (for example `winget install SoftwareFreedomConservancy.QEMU`).
