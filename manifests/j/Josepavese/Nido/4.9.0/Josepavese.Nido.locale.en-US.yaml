ShortDescription: "Local VM manager for AI agents: QEMU/KVM VMs via MCP, CLI or TUI"
Description: "Nido is a local VM manager for AI agents. It creates, boots and controls QEMU/KVM virtual machines through a CLI, a TUI and a native Model Context Protocol (MCP) server, with linked clones, cloud images, templates, SSH and port forwarding. QEMU must be installed separately (for example `winget install SoftwareFreedomConservancy.QEMU`)."
