ShortDescription: Environment variables and secrets for your terminal and AI coding agents.
Description: |-
  Envy manages environment variables and secrets for PowerShell, Git Bash and Command Prompt, and for the coding agents you start from them.
  Global variables load in every shell; a project's variables load only inside the folders linked to it.
  Secrets are kept in Windows Credential Manager instead of .env files or shell profiles.
