ShortDescription: Sample browser for music producers that searches your own sample folders and drags sounds into the DAW.
Description: |-
  Open Libary is a free sample library that runs on your own computer, without an account or cloud.
  It searches the sample folders you already have, plays a sound the moment you select it, finds similar sounds,
  reads tempo and key from file names and measures them where the name says nothing, and lets you drag sounds into
  FL Studio, Ableton Live, Cubase, Studio One, Reaper, Bitwig and other DAWs. Free CC0 and CC BY sounds from
  Freesound, ccMixter and the Internet Archive come with a license record.
