ShortDescription: Monitor IP devices and get alerts when they go offline or recover.
Description: |-
  Network Live Monitor helps you check routers, servers, printers, NAS devices,
  IP cameras, and other devices from one Windows dashboard. See whether each
  device is online or offline, view response time and uptime, and review recent
  status changes. Optional Windows notifications can alert you when a device
  goes offline or comes back online.

  Features:
  - Live online and offline status for up to 500 devices
  - Response time, uptime, failure history, and recent changes
  - Offline and recovery notifications with optional sound
  - CSV and JSON import and CSV report export
  - Seven days of recent events with automatic archive
  - Private local operation with no account, cloud service, or telemetry
