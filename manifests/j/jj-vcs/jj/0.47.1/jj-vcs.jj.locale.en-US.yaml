ReleaseNotes: |-
  This release fixes a dependency error that broke Linux builds in the 0.47.0 release.

  Deprecations
  - The git.sign-on-push boolean option is deprecated in favor of the revsets.git-sign-on-push revset. The default value is none(). If git.sign-on-push was previously set to true, it will be migrated to revsets.git-sign-on-push = "~signed() & mine()".

  New features
  - New revsets.git-sign-on-push config option containing the revset of commits to be signed when jj git push is run. It replaces the git.sign-on-push boolean option.

  Contributors
  Thanks to the people who made this release happen!
  - Philippe Daouadi (@blastrock)
