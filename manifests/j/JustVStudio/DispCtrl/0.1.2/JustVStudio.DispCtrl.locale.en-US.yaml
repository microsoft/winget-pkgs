ShortDescription: Every monitor on your desk, controlled as one.
Description: |-
  DispCtrl manages each display on its own terms: brightness in step across every screen (DDC/CI for external monitors, WMI for built-in panels), night light and software dimming per display, a taskbar that hides only where you want it, turning displays off while the PC keeps working, OLED care, focus mode, presets and per-app rules.
  It adds a quick panel to the tray, global shortcuts, and dispctrl, a command line that can do everything the app does.
