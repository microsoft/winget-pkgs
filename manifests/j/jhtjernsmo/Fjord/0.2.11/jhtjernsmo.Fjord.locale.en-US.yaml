ShortDescription: Local-first, keyboard-first project manager with Git, GitHub and Azure DevOps integration.
Description: |-
  Fjord keeps kanban boards, markdown notes and files for your projects in one SQLite file on your own computer. No account, no server.
  It works fully from the keyboard (leader key, which-key menu, command palette) and with the mouse, links tasks to Git branches and pull requests on GitHub or Azure DevOps, and includes a command-line tool and an MCP server for AI agents.
