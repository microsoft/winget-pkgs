ReleaseNotes: |-
  v0.6.10 (2026-11-20)
  这一版前半段在修浅色主题的终端观感，后半段把「液态玻璃」做成可切换的界面风格；分享页和右键菜单也补了几处。
  新功能
  - 液态玻璃界面风格：外观设置里新增「经典 / 液态玻璃」切换。玻璃风格下右键与下拉菜单、分段切换、开关与滑块、Agent 图标条、筛选面板、通知都换成玻璃外观；放大镜按住可划过、带果冻形变与真放大，Safari 也看得见；不能折射的浏览器里开关与滑块改用抬起高亮。经典风格保持原样。
  - 纯色背景新增「黑白」与自定义颜色：黑白随主题反着走（暗色纯黑、亮色纯白）；自定义颜色亮暗各存一份，用系统取色器或十六进制输入，对比度不足时提示但不拦。
  - 视频背景可设置失焦时暂停：视频背景新增开关（默认关）；打开后窗口失焦停在当前帧，切回来继续播；最小化或被完全挡住仍一律暂停。
  - 会话行与 Tab 右键菜单补充动作：新增「在此打开终端」「在 Finder 中显示」，「导出记录」下加「复制信息 → 会话 ID / 工作目录」；文件夹、会话行、Tab 三处共用同一套动作。
  - 系统终端也能打开输入窗口：终端右键菜单、Tab 栏按钮、快捷键、页内浮层四个入口都放开；提示词优化仍对系统终端禁用。Windows/Linux 上该快捷键不再能绑 Ctrl+F。
  修复
  - 浅色主题终端文字不再发细发灰：按字后面实际露出的颜色算对比度（纯色/渐变取最不利色标，图片/视频按遮罩估计），并在透明模式下修正 WebGL 字形混合函数——此前 alpha 被乘了两次，深色字的墨量少约三成。无背景或纯色时终端铺实底并加左/上留白，不再贴着分隔线。
  - 顶栏与终端同色：不开背景时窗口底色、终端区与窗格统一用终端配色方案的底色；Windows DWM 标题栏跟随，Linux 桌面版新增 GTK 标题栏上色。
  - 分享页缩放后不再点偏：CSS transform 缩小时 xterm 不认缩放，链接、选区、鼠标坐标都偏；现在先把坐标还原成未缩放坐标再交给 xterm。
  - 分享访客的 Ctrl+Z 不再挂起主人 CLI：拦下 `\x1a`，回放期间不转发终端自动应答，避免滚轮、焦点与设备属性应答变成 shell 里的乱码。
  - 液态玻璃的几处观感问题：边缘高光改成 CSS 渐变描边（非整数像素比不再锯齿），大卡片不再描出一圈白边，首次弹出不再闪两次，筛选面板改放按钮下方、不再挡搜索框。
