ReleaseNotes: |-
  v0.6.3 (2026-11-02)
  这一版把「最近在干什么」变成 MCP 能直接回答的问题：搜索工具不再强制要关键词。
  新功能
  - codock_search_history 可以按时间列出最近的会话：query 改为可选，省略时不搜正文，
    直接按会话最后更新时间倒序列出窗口内的条目，连同项目路径、会话 ID、消息数一起返回。
    外部 Agent 想回答「最近一星期都在做什么」这类问题时本来也给不出一个能覆盖全部会话的
    关键词——硬编一个只能命中标题或正文里恰好提到它的那几条。新增的 days（1–365）带
    query 时是匹配的时间下界，不带 query 时是列表窗口，默认 7 天，并写进输出抬头，
    免得把「只看了一周」读成「一共只有这些会话」。列表模式 limit 默认 20；来源仍按
    「已启用」过滤，停用的工具立刻不出现在列表里。
ReleaseNotesUrl: https://github.com/juejijianghuaa/CoDock-Release/releases/tag/v0.6.3
