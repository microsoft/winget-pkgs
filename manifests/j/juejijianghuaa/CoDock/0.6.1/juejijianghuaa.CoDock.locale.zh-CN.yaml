ReleaseNotes: |-
  v0.6.1 (2026-10-25)
  这一版让会话记录能读能带走（投影思考、整篇 Markdown 导出）、分享链接更耐用
  （30 天有效期、关闭会话不再失效、按原尺寸拉回），并给 worktree 加了起点分支选择；
  侧栏会话行也重做了一遍。
  新功能
  - 会话记录投影思考内容，可折叠查看：
    - 各家的 thinking / reasoning 现在单独存进 messages.thinking，记录视图里折叠展示，
      默认不显示，弹窗新增「显示思考」开关。
    - 思考不进正文、不进倒排索引——那是模型自己的草稿，搜业务词时被它命中只是噪音；
      只有完整版导出才带。
  - 整篇 Markdown 导出：新增 GET /api/transcript/export 与 /api/share/{id}/export，
    流式写出整场对话，不受 500 条/页的分页上限约束。
    - 阅读版（默认）只保留用户与助手的正文：思考、工具调用一律剥掉，剥完没有正文的
      整条略过并在文末记省略数——拿到的是一份能直接读的稿子，不是一份日志。
    - 完整版照旧带思考与工具调用的折叠块。
    - Tab 栏与侧栏右键菜单共用同一个导出子菜单；分享侧复用同一份脱敏口径。
  - 新建 worktree 可选起点分支：勾选独立 worktree 后可以搜分支、按本地/远程分组挑选，
    还能一键 git fetch --all 拉取更新。起点默认仍是主仓当前 HEAD；远程分支只当起点，
    不会被 checkout。拼引用前只认 refs/heads 与 refs/remotes，顺带封死了把分支名
    当选项注入的路子。
  - 分享有效期可到 30 天，已有链接可加减时长：调整走同一个接口，正数延长、负数缩短，
    夹在「从现在起 5 分钟 ~ 30 天」且不会因夹取反向。
  - 关闭会话不再让分享链接失效：带 resume UUID 的链接会保留，访客再打开时按 UUID
    把会话 resume 回来；设置页的分享列表对未运行的会话提供「恢复会话」，改权限、调时长
    也不再要求会话正在运行。
  - 分享拉起会话时按主人窗口的终端尺寸 spawn：此前按默认 120×40 起，CLI 先按错的宽高
    排版，桌面 Tab 挂上后一 resize 就错位，还会把同 pane 的其它终端连带重新 fit。
  修复
  - 分享页浏览器标签显示会话名：显示「会话标题 · CoDock」，标题未改过时退回会话摘要。
  - 重启后分享可能拉起两个同 UUID 的进程：服务监听早于 Tab 恢复进度就绪，旧判据会
    让分享抢先拉起。现在还有 Tab 记录的会话一律交给启动恢复。
  - 改 pty 尺寸时被 RequestRedraw 插队会把终端拽回旧列数：收回尺寸现在与 resize 同持
    一把锁，不会出现「记录已是新宽度、pty 还是旧宽度」的永久错位。
  - 分享列表重启后第一次为空：describe 先取活会话再填 session_id，不用再开一次弹窗才看得见。
  界面与交互
  - 侧栏会话行重做：
    - 行内动作收成三颗（置顶 / 查看记录 / ⋯），⋯ 与右键、键盘菜单键走同一条路径；
      其余动作本来就在右键菜单里，不再摆两遍。
    - 时间挪到标题行最右，与按钮共用一个槽位：平时显示时间，鼠标移上去淡出、换成按钮。
      不悬停时标题因此能多露一截。
    - 放不下的标题悬停后横向滚动，移开快速归位；右端用渐变遮罩代替省略号（省略号会跟着
      文字一起平移）。滚动速度对所有标题恒定一致，长短标题只是滑的时间不同。
    - 时间改用紧凑格式：一周内仍是「3 天前」，再久只给日期，同年省掉年份——省下的宽度
      正好够 ctx 徽标不被裁掉。
    - 键盘聚焦到行上时标题同样滚动（此前只有鼠标能触发）。
    - 开在后台 Tab 里的会话在左侧画一条淡竖条：点它是切过去，不是恢复会话，此前看不出来。
  - 动作区去掉底色与边框：只留背景模糊，与菜单、对话框同一套浮层写法；暗色主题下不再
    是一块压住整行的近黑板。
  官网与文档
  - hero 上的版本徽章更新为 v0.6.1。
