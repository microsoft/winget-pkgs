ReleaseNotes: |-
  v0.6.14 (2026-11-28)
  这一版补齐了用量价格与速度统计、未运行会话的直接分享、自定义监听端口与手机端系统终端；右键菜单也收成了一套。
  新功能
  - 未运行的会话也能分享，列表与 Tab 右键菜单统一：会话列表与 Tab 栏右键菜单共用一套动作（Tab 栏补上接力、置顶、归档、取消全部分享，列表补上新建同目录任务）；历史里每条可恢复的会话都可以直接建分享链接，访客打开时自动拉起。
  - 监听端口可在设置页自定义：可指定下次启动生效的端口（写入 ~/.codock/port，被占用仍回落到 9520–9530 区间），改端口待重启时提示 HTTP 接入的 MCP 重新添加。
  - 手机端可新建系统终端：新建会话工具列表末尾新增「终端」，可从手机端直接开启系统终端（仍保持桌面宽度缩放排版）。
  - 用量统计接入 models.dev 价目目录与生成速度：补齐 Gemini / Antigravity / Codex 成本估算；用量弹窗新增生成速度卡，Antigravity 显示首字延迟与中位输出速度，Claude Code 显示整轮下限速度。
  调整
  - 分享页点文件路径与已配对设备统一判定：不再要求路径在终端输出里出现过，路径链接只记住「能打开」的结果。
  - 开机后台运行拒绝登记 npx 缓存路径：通过 npx codock 启动的临时缓存二进制不再允许设为开机启动，提示先 npm i -g codock。
  修复
  - Antigravity 用量与缓存读取修正：修正 protobuf 字段映射，不再把未缓存输入与缓存读取算丢或放大输出费用。
  - Claude Code 用量去重修正：去重键改为 message.id 并保留同一次回复的最后一份真实 usage，不再把多条内容块重复计费。
  - 手机端系统终端滑动不再调出历史命令：停在 shell 提示符（普通缓冲区）时上下滑动不再发送 PgUp/PgDn，less / vim 等备用缓冲区照常翻页。
  - 新建任务最近目录芯片封顶宽度：长目录名（如 UUID）不再把弹窗撑高。
