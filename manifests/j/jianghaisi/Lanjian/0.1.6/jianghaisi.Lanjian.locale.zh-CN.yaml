  - 安装包 SHA-256：1240c11cd0f915c1009e04c2cc69fc0229c4c0df8813a192906067ad3bfe32c2。独立验收记录显示错误 0 项，升级保留 75 个合成文件，卸载后保留 76 个合成文件。
