ShortDescription: 面向长篇小说创作的本地工作台。
Description: 岚笺（Lanjian）是面向长篇小说创作的本地桌面工作台，提供本地作品管理、章节编辑、保存、历史、导入与导出等功能，无需先安装 Node.js、Python 或模型权重即可建立作品并手工编辑。
ReleaseNotes: |-
  岚笺 0.1.0 · 开发预览
  首个 Windows x64 安装版本，面向长篇小说创作的本地工作台。0.1 是持续迭代的起点，不代表 V3 所有方向已经完成。
  本版内容
  - 本地作品管理、章节编辑、保存、历史、导入与导出。
  - 资料、人物、世界设定、分层大纲、事件纪事，以及模型与写作候选的配置和审阅入口。
  - Windows NSIS 安装包、岚笺应用与快捷方式图标、中文图文 README、贡献和部署指南。
  - 按包依赖顺序执行的 CI，以及手动触发的 Windows Release 草稿工作流。
  - 现有在线试用：游客可浏览公开参考书；登录和模型能力以站点实际配置为准。在线部署独立于本次桌面版本。
  验证范围
  发布检查覆盖共享包、桌面类型与架构、桌面合成数据测试、网页、托管服务和插件分发服务。安装检查使用全新配置与合成书库，验证真实安装、无密钥手工保存、原生窗口正常关闭、新进程重启、覆盖安装和卸载后的数据保留。源码与公开 Git 历史执行秘密扫描。
  本地完整桌面测试：3708 通过 / 0 失败 / 6 跳过。跳过项为 3 项需显式开启的长书/性能检查、2 项不随公开源码分发的私有作者工具检查，以及 1 项当前 Windows 拒绝创建文件符号链接的检查。共享契约 22 项、网页 3 项、托管服务 69 项、插件分发服务 8 项均通过。
  修正测试环境后，GitHub 四组完整检查全部通过：桌面合计 3706 通过 / 0 失败 / 8 跳过。云端跳过 3 项长书/性能检查、2 项私有作者工具检查和 3 项需要额外便携语音运行时的检查；普通 Python 子进程与模型协议测试实际执行通过。各包类型、架构、测试和生产构建均通过。
  运行资源检查包括 main、preload、renderer、插件 worker 与 WASM；安装包不包含作者私有书库、模型凭据、开发场景驱动或模型权重。
  已知限制
  v0.1.0 标签保留安装包对应的首版源码历史。干净环境 CI 发现的服务构建顺序、测试 Python 路径和测试等待上限已在 main 修正；运行代码与安装包未改变。复跑完整检查请使用 main，安装 Node.js 24 与 Python 3.10+ 后执行：
  node scripts/ci.mjs all

  GitHub CI 将桌面测试分为四组，每组单文件并发；全部组通过才算完成。旧标签的完整测试仍依赖开发者私有 Python 目录，不建议在新机器上直接运行该标签的旧测试脚本。
  - 仅验证 Windows x64；尚未提供 macOS / Linux 安装包、代码签名和自动更新服务。
  - 部分插件、地图、桌宠和可选语音体验仍在持续完善，见 后续更新计划。
  - 真实付费模型的文学质量、真实账号 OAuth 登录与每种硬件组合不属于本次自动验证。
  - 网页生产构建存在大分块体积提示；首屏和下载体积仍有优化空间。
  - 正文生成仍需作者确认当前总纲及对应卷纲、章纲；保存与采用候选不等同于确认。
  反馈问题请提供版本、系统和最小复现；勿附 API Key、Cookie、私人书稿或未脱敏日志。
