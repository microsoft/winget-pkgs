ShortDescription: Command-line TOTP authenticator.
Description: |-
  Uranus-TOTP (utc) generates the time-based one-time passwords (TOTP) that two-factor authentication asks for.
  Accounts are grouped into namespaces and kept in one file encrypted with a password (scrypt and AES-256-GCM).
  Run a single command for scripts and pipes, or start an interactive shell that asks for the password once.
