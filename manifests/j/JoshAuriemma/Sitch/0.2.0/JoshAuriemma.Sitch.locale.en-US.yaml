ShortDescription: Free, open-source Skitch alternative for screenshot capture and annotation.
Description: |-
  Sitch is a tray-resident screenshot annotation tool and a native replacement for Evernote Skitch.
  Press Ctrl+Alt+4 to capture a region, window or full screen, then annotate with tapered arrows,
  text, shapes, highlighter, stamps, spotlight, and pixelate/blur redaction. Copy, drag, share, or
  export to PNG, JPEG, PDF or TIFF. Works fully offline with no account and no telemetry.
