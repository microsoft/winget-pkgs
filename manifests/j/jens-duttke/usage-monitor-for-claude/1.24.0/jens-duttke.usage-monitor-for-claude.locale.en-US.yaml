ReleaseNotes: |-
  Changed
  - On Linux with KDE Plasma, a left-click on the tray icon now opens the detail popup directly, as on Windows - previously it opened the tray menu, and the popup needed a second click on its first entry. The menu stays on the right-click (thanks to @gurkengraeber for the contribution)
  - With extra usage enabled, the prepaid credit balance is now only requested while the detail popup is open - right when it opens, then at most every two minutes. Background polling sends half as many requests as before, which makes Anthropic's rate limit less likely to block the usage display
  Fixed
  - Windows notifications now show the neutral app logo in their header - previously, on some Windows versions, they showed the live tray icon with a usage percentage that contradicted the message. Notifications now also stay in the Windows notification center for five minutes (thanks to @zvirja for reporting #98 and investigating it in #100)
  - On Linux with a panel at the bottom of the screen, such as the KDE Plasma default, the detail popup now opens directly above the panel - previously it always opened in the top-right corner, at the opposite end of the screen from the tray icon (thanks to @gurkengraeber for the contribution)
  - On Linux the app no longer grows by about 200 MB each time you open the detail popup - previously every opening left WebKit processes behind until the app quit, adding up to more than 1 GB over a few days (thanks to @gurkengraeber for the contribution)
  - On Linux with a fractional display scale such as 250%, or with enlarged text, the detail popup now shows its full content - previously its bottom, including the version number, was cut off and the content was squeezed narrower than intended (thanks to @gurkengraeber for the contribution)
  - On Windows, keystrokes in other apps no longer go missing while the detail popup is open - previously typed characters could get lost, Print Screen did nothing and Win+Shift+S never opened the Snipping Tool, most noticeably with the popup pinned (thanks to @nerfarrow for reporting #104 and fixing it in #105)
