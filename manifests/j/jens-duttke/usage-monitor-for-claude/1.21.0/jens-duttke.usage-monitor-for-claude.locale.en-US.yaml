ReleaseNotes: |-
  Added
  - Extra usage without a monthly limit (uncapped pay-as-you-go overage, the usual state for Team and Enterprise plans) now appears in the popup as the amount spent - previously the Extra Usage section stayed hidden unless a monthly limit was configured, silently hiding real spending (thanks to @joeklittle for the contribution)
  - New alert_extra_usage_spent setting - absolute spending amounts in your billing currency (e.g. [50, 100, 150]) that trigger a notification when extra-usage spending crosses them; complements the percentage thresholds and is the only alert that can fire for uncapped extra usage, where no percentage exists (thanks to @joeklittle for the contribution)
  - New icon_style setting - set it to "numbers" to show both icon_fields values as two stacked percentages on the tray icon instead of one percentage with two bars; each row shows ✕ or $ when its quota is exhausted (thanks to @Searcus for the suggestion)
  Fixed
  - With uncapped extra usage enabled, an exhausted quota now shows the "extra usage active" tray indicator instead of the exhausted glyph - work continues on paid overage, so the icon no longer suggests Claude has stopped (thanks to @joeklittle for the contribution)
  - The startup and double-click event commands no longer report USAGE_MONITOR_EXTRA_LIMIT as a zero amount for uncapped extra usage - the variable is now omitted when there is no monthly limit (thanks to @joeklittle for the contribution)
  - On systems with a non-UTF-8 code page (Traditional Chinese, Japanese, Korean and others), the tray icon no longer stops updating after an automatic token renewal - the Claude CLI's output is now read as UTF-8 instead of with the system code page, which crashed the update loop as soon as the CLI printed a non-ASCII character (thanks to @daweiliutw-ctrl for reporting #80)
  - After an account switch, the tray icon and popup now show the new account's usage right away - previously, when the switch happened while a usage request was already running, the "account switched" notification appeared next to the previous account's numbers, which stayed on screen until the next scheduled poll
  Full changelog
  README for this version
