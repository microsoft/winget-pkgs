ReleaseNotes: |-
  Added
  - Forecast chart - set forecast_chart to true to see the quota on your tray icon as a chart in the detail popup instead of a bar: your usage so far and where your average pace leads by the reset, with a short note such as "At this pace: empty ~Mon". With working hours set, the projection pauses outside them (thanks to @VictorZakharov for the contribution)
  - MCP server - turn on mcp_server and register the app with Claude Code or Claude Desktop, and Claude can check your remaining quota, the reset times and whether you are ahead of the time marker before it starts expensive work - answered from the app's own data, without extra requests to Anthropic (thanks to @TheConfax for the contribution)
