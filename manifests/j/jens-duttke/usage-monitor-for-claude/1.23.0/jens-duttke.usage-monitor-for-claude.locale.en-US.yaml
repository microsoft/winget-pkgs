ReleaseNotes: |-
  Added
  - The Extra Usage section in the detail popup now also shows the prepaid usage credits you have left to pay for it, so you can tell whether work can continue instead of only seeing what has been spent (thanks to @TheConfax for the contribution)
  Changed
  - Polling no longer stops while the computer is idle or locked - it continues on a 15-minute cadence, configurable via the new idle_interval setting. Quota resets, threshold alerts and event commands now fire on time on an unattended computer, and switching your Claude account is picked up right away instead of at your next keystroke
  - The expired-session and missing-token messages now name the Claude Code CLI and the command that fixes it (claude auth login) - previously they asked you to open Claude Code, which helps nobody whose Claude Code is already open and whose CLI login is the part that expired (thanks to @mjtlsnelling-art for reporting #89)
  - Event commands no longer report a quota as being at 0% when the API does not report its usage at all - the USAGE_MONITOR_UTILIZATION_* and USAGE_MONITOR_RESETS_AT_* pair is left out for that quota instead of carrying a zero
  - UsageMonitorForClaude.exe is now code signed, so Windows names the publisher instead of reporting an unknown one, and the Digital Signatures tab gives you a second way to check a download besides the published SHA256. Antivirus warnings can still happen - they react to how the EXE is packaged, not to the signature
  Fixed
  - The detail popup no longer greys out and stops updating when you leave the mouse alone - while it is open and visible, usage keeps refreshing at the normal interval
  - Verbose output now follows a redirect, so UsageMonitorForClaude.exe --verbose > log.txt writes a usable file - previously the diagnostics always went to the console window and the file stayed empty, leaving no way to attach a log to a bug report (thanks to @mjtlsnelling-art for reporting #89)
  - The detail popup no longer shows a bar for quota types the API lists before they apply to your account - previously one appeared under an internal code name, stuck at 0%, with no countdown and no time marker. Event commands no longer receive variables for such a quota either, and the bar shows up on its own once the quota becomes active (thanks to @TheConfax for the contribution)
  - The --verbose diagnostics now redact your username from paths under a home directory that is reached through a symlink or a junction - previously those paths were printed in full, in the output you attach to a bug report (thanks to @hybrid2102 for the contribution)
