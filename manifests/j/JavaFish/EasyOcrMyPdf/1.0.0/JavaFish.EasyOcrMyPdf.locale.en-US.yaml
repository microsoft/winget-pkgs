ShortDescription: Beginner-friendly interface for OCRmyPDF and Tesseract that makes scanned PDFs searchable.
Description: |-
  EasyOcrMyPdf adds a searchable text layer to scanned PDF files without using the command line.
  Drag PDF files into the window, pick the document language and start. Tesseract and Ghostscript are bundled,
  German and English are included and more than 120 further languages can be downloaded from within the app.
  Output can be saved as PDF or PDF/A; the original files are never modified.
