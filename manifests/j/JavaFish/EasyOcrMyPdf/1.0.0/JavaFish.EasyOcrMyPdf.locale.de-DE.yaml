PackageIdentifier: JavaFish.EasyOcrMyPdf
PackageVersion: 1.0.0
PackageLocale: de-DE
Publisher: Java-Fish
PackageName: EasyOcrMyPdf
License: MIT
ShortDescription: Einsteigerfreundliche Oberfläche für OCRmyPDF und Tesseract, die eingescannte PDFs durchsuchbar macht.
Description: |-
  EasyOcrMyPdf ergänzt eingescannte PDF-Dateien um eine durchsuchbare Textebene, ganz ohne Kommandozeile.
  PDF-Dateien ins Fenster ziehen, Sprache des Dokuments wählen und starten. Tesseract und Ghostscript sind
  enthalten, Deutsch und Englisch ab Werk, über 120 weitere Sprachen lassen sich in der Anwendung nachladen.
  Ausgabe als PDF oder PDF/A; die Originaldateien bleiben unverändert.
Tags:
- durchsuchbar
