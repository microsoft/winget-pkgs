ShortDescription: Home of the Jennefer apps. Chat with a local or cloud model and open the IDE, Studio, Workshop and more from one sidebar.
Description: |-
  Jennefer Hub is the home of the Jennefer apps on your computer.

  - Chat with your model: a local model on your own GPU, your own endpoint, or Jennefer Models.
  - Open every Jennefer app from the sidebar: IDE, CLI, Studio, Workshop, Cloud and Hangar.
  - One sign-in, shared models and packs, and one theme and font for every app.
  - One queue for your GPU, so two apps never fight over it.
  - Agent teams, memory and token usage for every app in one place.
