License: MIT
ShortDescription: Per-process CPU performance counters on Windows.
Description: Installs the winvar CLI and a hidden resident daemon that records Windows performance counters per process and per context switch; InstructionRetired is the default. Measurements then run without UAC. The first measurement installs the Windows Performance Toolkit automatically when xperf is missing. Requires an administrator account; the account approved at the UAC prompt is the account the daemon serves, so a standard user cannot run measurements after another administrator elevated the install.
