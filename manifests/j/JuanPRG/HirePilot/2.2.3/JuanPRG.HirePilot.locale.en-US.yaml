ShortDescription: AI-assisted resume tailoring and cover-letter generation for Chrome.
Description: |-
  HirePilot combines a local Windows backend with a Chrome extension to tailor
  resumes, generate cover letters, create DOCX and PDF files, and assist with
  form filling. Users provide their own supported LLM API keys or local model.
Moniker: hirepilot
Tags:
- career
- chrome-extension
- cover-letter
- job-application
- job-search
- resume
Documentations:
- DocumentLabel: Installation and release documentation
  DocumentUrl: https://github.com/JuanPRG/hirepilot-releases#readme
ReleaseNotes: |-
  This release includes the HirePilot Windows companion: local backend, tray
  controls, updater, protocol launcher, and bundled PDF runtime. The Chrome
  extension is installed and updated separately through the Chrome Web Store.
ReleaseNotesUrl: https://github.com/JuanPRG/hirepilot-releases/releases/tag/v2.2.3
InstallationNotes: |-
  Run "HirePilot Setup Console" from the Start Menu once to configure your
  profile, resume, and provider keys. Install the HirePilot Chrome extension
  from the Chrome Web Store:
  https://chromewebstore.google.com/detail/chmibpoikgjckekkgpoeejdnmempllkh
  Chrome manages extension installation and updates separately.
