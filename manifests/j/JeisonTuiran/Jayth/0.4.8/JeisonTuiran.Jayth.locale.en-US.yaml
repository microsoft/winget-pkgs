ShortDescription: Desktop AI agent for local GGUF models that writes code, uses your apps and the web, and asks you to approve every action.
Description: |-
  Jayth turns any local AI model in GGUF format (run with llama.cpp) into an agent that works on your computer:
  it writes and runs code and checks the result, reads and operates other programs through the system accessibility
  APIs, uses a built-in browser in plain sight, and reads and creates Word, Excel, PowerPoint and PDF documents.
  Everything runs on your machine and works offline once the model is downloaded. You approve every action, or
  switch to automatic mode. It downloads the right llama.cpp build for your hardware (CUDA, Vulkan or CPU).
  The interface is currently in Spanish; the agent answers in the language you write to it.
