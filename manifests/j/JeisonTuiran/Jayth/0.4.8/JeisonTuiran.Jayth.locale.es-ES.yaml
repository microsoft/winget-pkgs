ShortDescription: Agente de IA de escritorio para modelos GGUF locales que programa, usa tus programas y la web, y te pide aprobar cada acción.
Description: |-
  Jayth convierte cualquier modelo de IA local en formato GGUF (con llama.cpp) en un agente que trabaja en tu equipo:
  escribe y ejecuta código y comprueba el resultado, lee y maneja otros programas con la accesibilidad del sistema,
  usa un navegador integrado a la vista y lee y crea documentos de Word, Excel, PowerPoint y PDF.
  Todo ocurre en tu equipo y funciona sin internet una vez descargado el modelo. Tú apruebas cada acción, o activas
  el modo automático. Descarga la versión de llama.cpp adecuada para tu equipo (CUDA, Vulkan o CPU).
