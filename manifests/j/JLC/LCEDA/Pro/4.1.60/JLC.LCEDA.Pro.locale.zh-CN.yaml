ReleaseNotes: |-
  原理图
  新增 / 优化
  - 支持多符号和多器件
  - “器件”属性支持修改为文本形式的值
  - 支持直接拖放或放置符号到画布
  - 支持原理图电路计算器
  - 支持快速定位元件、原点、坐标点
  - 支持交换功能扩展对象
  - 支持在原理图上直接修改复用模块符号
  - 支持非电气符号转换到 PCB
  - 支持自定义位号的格式和递增方式
  - 支持复制当前选中电路区域为图片
  - 支持多级分类（库目录结构分层管理）
  - 支持符号库设计规则检查
  - 支持符号版本历史查看与对比
  - 放置待更新的器件，符号与封装
  - 增加倍数网格和坐标轴设置，增加透明度调节
  - 导出 PDF 支持导出自定义页
  - 原理图编辑时网格、捕捉等交互细节优化
  - 放置元件时按 Tab 键快速修改值和封装
  - 支持放置待更新的器件（符号与封装）
  - 支持放置的图元参数预设（如默认字体、颜色等）
  - 放置导线连接点
  PCB
  新增 / 优化
  - 支持多封装和文本封装（PCB 封装管理）
  - 支持 FPGA 引脚交换（PCB 布局时调整）
  - 支持 PCB 电路计算器
  - 支持图元类型设置自定义颜色（PCB 层显示）
  - 新增草图半自动布局（交互式布局辅助）
  - 新增草图半自动布线（交互式布线辅助）
  - 支持焊盘孔为圆角矩形槽孔（新增孔型）
  - 支持合板（特殊拼版）
  - 支持信号时间等长 & 信号逻辑等长（时序匹配）
  - 支持约束区内元件高度检查（机械约束）
  - 支持自动位号丝印布局（自动排列位号）
  - 增加板子面积、露铜面积计算（制造辅助）
  - 封装支持导出 PDF（封装文档化）
  - 支持导入坐标文件自动摆放元件（从外部数据自动布局）
  - 支持批量调整过孔/结构孔与器件的中心点对应（精确定位）
  - 支持设置焊盘每层的尺寸大小（灵活焊盘设计）
  - 支持显示/隐藏当前层的指定类型图元（层管理增强）
  - 支持放置封装库到画布（从库直接拖放）
  - 放置封装，原理图转 PCB 时自动新增或合并封装中的自定义层
  - 支持绘制 3D 体图元（3D 建模能力）
  - 支持封装库设计规则检查
  - 支持封装版本历史查看与对比
  - 自动布线支持展示多次迭代，整体布线算法优化
  - 圆弧推挤阻挡及直线圆弧一起拉伸（交互编辑优化）
  - 自动差分对支持多选及中间匹配方式（差分对设置优化）
  - 差分对和网络类分组，支持批量设置规则（规则管理优化）
  - 量测距离支持临时保留多个测量结果（测量工具增强）
  - 支持导入图片自动无损压缩（PCB 图片导入优化）
  系统功能模块
  新增 / 优化
  - 分类修改为文本存储，支持多级分类
  - 支持导出 BOM 预览并计算 BOM 单价和总价
  - 支持面板任意拖动与吸附侧边（新界面交互）
  - 支持工作区切换和迁移，工程支持多选操作
  - 新建工程时自动创建默认面板
  - 常用对话框（如设置、导出）记住上一次输入的值
  - 语言设置位置变更到统一的“设置”弹窗中
  其他
  新增 / 优化
  - 支持导入图片时自动进行无损压缩（减小工程体积）
  - 补充符号引脚文本属性图元（API 接口扩展，供外部脚本读写引脚上的文本显示属性）
  - 支持库文件设置为只读模式（防止误修改）
  - 新增立创 / 嘉立创价格、库存、热门度、产线属性字段（便于采购与选型）
  - 新增器件：四通道示波器（仿真波形观测）
  - 支持导出 DISA 格式仿真网表（对接第三方仿真工具）
  - 仿真引擎改造为插件化架构（便于独立升级与替换）
