  其他
  - 修复工程快照生成丢失导致工程器件符号封装数据丢失的问题
  - 修复打开放置器件弹窗时分类选择未分类导致预览图加载慢的问题
  - 修复导入标准版工程后器件 3D 模型无法在系统库中找到的问题
  - 修复离线客户端绑定本地 3D 模型，3D 预览显示异常的问题
