  - 修复导出 PDF 设置装配图顶层焊盘颜色后导出未成功应用的问题
  - 修复多段线条转换为填充区域后填充区域面积错误的问题
  格式转换
  - 修复导入 Altium 时器件符号翻转 180° 的问题
  - 修复导入 Altium 时焊盘形状导入不正确的问题
  - 修复导入 Altium 单层板文件时图层只补一个铜箔层且缺少介电层的问题
