ReleaseNotes: |-
  Schematic
  - Fixed the issue where template BOM export had incorrect sequence numbers.
  - Fixed the issue where copying wires with net labels sometimes pasted wires without net labels.
  - Fixed the issue where custom footprint UUIDs flowed back into the schematic when converting PCB to schematic.
  PCB
  - Fixed the issue where DRC failed to detect errors on the PCB canvas.
  - Fixed the issue where manual copper pour and automatic copper pour produced different results for inner-layer net splitting.
  - Fixed the issue where the footprint height property value changed from mm to mil.
  - Fixed the issue where pasting PCB text or component properties into a footprint caused freezing on the second paste.
  - Fixed the issue where the 3D model size seen in 3D preview differed from the size seen in the 3D model manager after library migration.
  - Fixed the issue where flipping failed after selecting components, entering move mode via the move-by-reference-point shortcut, and then pressing the flip shortcut.
  Format Conversion
  - Fixed the issue where importing OrCad lost some connection junctions and produced incorrect connectivity.
  - Fixed the issue where importing Allegro produced incorrect pad sizes.
  - Fixed the issue where importing an Altium footprint library did not import description and height properties.
  - Fixed the issue where exporting Altium caused symbols to shift relative to the grid.
  - Fixed the issue where checking auto-associate footprint during import resulted in blank imported content.
  Other
  - Fixed the issue where automatic backups could not be restored after importing an epro project into eprj2 format.
  - Fixed the issue where project observers could operate the canvas and caused collaborating developers to save observer-edited content.
  - Fixed the issue where 3D model export progress stuck at 57% with a backend error.
  - Fixed the issue where the fully offline client's PCB canvas device bound to a local 3D model did not show the model when the soldering assistant exported offline HTML.
  - Fixed the issue where the bottom 3D preview did not display the model after associating a footprint with 3D to a device without 3D in the edit device dialog.
