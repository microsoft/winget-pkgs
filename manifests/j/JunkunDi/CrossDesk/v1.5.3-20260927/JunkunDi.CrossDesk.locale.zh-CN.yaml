ReleaseNotes: |-
  更新内容
  1. 远程会话工具栏新增画面设置，支持在连接过程中调整画质、采集帧率和画面偏好，无需断开重连。
  2. Linux 新增无头运行模式，可复用已有桌面或创建独立虚拟桌面，并通过终端控制台查看状态、修改密码和设置。
  3. 新增后台版本检查和手动检查更新，发现新版本时可查看更新说明并前往下载页面。
  4. 网络状态新增连接延迟和视频延迟显示，修正视频延迟计算，并平滑连接延迟的显示。
  5. 音视频传输新增自适应前向纠错，改善丢包网络下的传输效果。
  6. 新增单实例运行保护，避免重复启动客户端造成冲突。
  7. 精简客户端依赖和安装包体积，减少正式版本的日志输出。
  8. 改善深色系统主题下的界面可读性，并修复软件渲染模式下工具栏关闭状态图标显示异常的问题。
  9. 修复 Windows 安装版和便携版因缺少 Slint 界面运行库而无法启动的问题，并将 VC 运行库改为静态链接，无需额外安装 VC++ 运行库。
