ReleaseNotes: |-
  更新内容
  1. Windows 新增无显示器远程控制支持，内置虚拟显示器驱动，可自动创建 1920×1080 虚拟屏幕；无法启用时自动切换至兼容采集模式。
  2. 设置中新增“强制中继”选项，方便在直连不稳定的网络中使用中继连接。
  3. 主窗口新增随机密码刷新，优化密码重试时的输入体验，并统一为 6 位密码。
  4. 改善断线重连，修复旧会话阻碍重新连接及已保存密码未正确复用的问题。
  5. 修复 Windows 远程控制和 Web 控制中的键鼠输入、光标显示及会话路由问题。
  6. 改善 Windows 显示器热插拔后的屏幕编号、鼠标定位和隐私屏稳定性。
  7. 修复远程画面缩放后的鼠标位置偏差，以及部分视频帧无法正常显示的问题。
  8. 修复展开网络状态后屏幕切换菜单的位置偏移。
  PC 客户端版本为 v1.5.2。Windows 无屏自动适配需将采集方式设为“自动”；自动安装和插入虚拟显示器需安装并运行 CrossDesk Service，或以管理员身份运行客户端。
