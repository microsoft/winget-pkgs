ReleaseNotes: |-
  新增功能与改进：
  1. iOS 和 Android 新增系统键盘输入，支持使用系统输入法的候选词、纠错和听写功能，确认文字后直接输入远端。重新设计电脑键盘，提供“字母数字 / 符号功能”两页布局，完善组合键、横竖屏适配和按键触感反馈。
  2. 改善移动端画面操作，支持从画面外的黑边区域开始双指缩放；相对鼠标移动至画面上、下边缘后继续移动，可自动上下平移画面，方便操作被遮挡区域。
  3. 统一桌面端文件收发与桌面墙文件分发通知，按文件展示传输进度、速度和状态；传输结束或连接关闭后，结果保留至手动关闭。
  4. 新增文件发送取消操作，支持取消排队中或正在发送的文件，包括桌面墙分发任务；取消单个文件不会断开远程连接。
  5. 重复启动桌面应用时，自动唤起已有窗口，方便找回已最小化或隐藏的 CrossDesk。
  6. 完善 Web 客户端视频参数协商，支持被控端处理浏览器端的画面设置，优化网络变化时的带宽与视频流量控制。
  7. 优化近期连接卡片、设备信息提示、远程更新提醒及 macOS 权限弹窗，统一界面样式与操作反馈。
  8. 在关于与更新弹窗中新增赞助入口，并加入可关闭的一次性赞助提示。
  9. 新增 HarmonyOS PC 与手机、平板客户端的开发版适配代码，补充构建、权限和使用说明。
  问题修复：
  1. 修复 Windows 在 RDP 会话断开后无法正常恢复远程控制的问题，完善会话切换和画面采集恢复。
  2. 改善 Web 连接的 ICE 候选收集与 TCP 连接处理，修复部分网络环境下的连接问题。
  3. 修复 Web 会话画质异常下降的问题，改善带宽受限时的视频传输表现。
  4. 修复被控端在文件传输期间无法继续添加待发送文件的问题。
  5. 修复远程设备 ID 输入时的闪烁和超长输入问题，将输入限制为九位数字。
  6. 修复检查更新时关于弹窗布局跳动、更新弹窗高度约束冲突等问题，统一各桌面平台的弹窗尺寸与布局。
  使用提示：
  - 移动端直接输入中文、表情等文字，需要被控端支持 Unicode 文本输入。目前支持该能力的 macOS 被控端可直接接收；Windows、Linux 及不支持该能力的旧版被控端使用 ASCII 按键回退，其他文字可通过会话中的剪贴板功能发送并粘贴。
  - 文件取消操作位于发送端。关闭传输通知只隐藏通知，不会取消传输；需要停止发送时，请点击“取消”。
  - HarmonyOS PC 与手机、平板适配仍处于开发阶段，尚需进一步完成真机兼容性与功能验收。

  New Features and Improvements:
  1. Added system keyboard input on iOS and Android, with support for native input candidates, autocorrection, and dictation. Confirmed text is sent directly to the remote computer. Redesigned the computer keyboard with alphanumeric and symbol/function pages, improved modifier keys, orientation handling, and haptic feedback.
  2. Improved mobile viewport controls. Pinch-to-zoom can now start in the black margins outside the remote image. In relative mouse mode, continuing to move beyond the top or bottom edge pans the image vertically to reach obscured areas.
  3. Unified desktop file transfer notifications across sending, receiving, and DeskHub distribution. Each file shows progress, transfer speed, and status. Results remain visible until dismissed, including after the connection closes.
  4. Added cancellation for queued and active outgoing files, including DeskHub distribution tasks. Cancelling an individual file keeps the remote connection active.
  5. Launching the desktop application again now brings its existing window forward, making minimized or hidden CrossDesk windows easier to find.
  6. Improved video settings negotiation for Web clients, allowing hosts to process browser-requested settings. Refined bandwidth and video flow control as network conditions change.
  7. Refined recent-connection cards, device information tooltips, remote update notices, and the macOS permissions dialog, with more consistent styling and interaction feedback.
  8. Added sponsorship links to the About and update dialogs, along with a dismissible, one-time sponsorship prompt.
  9. Added development support for HarmonyOS PCs, phones, and tablets, with build instructions, permission guidance, and usage documentation.
  Bug Fixes:
  1. Fixed Windows remote control failing to recover after an RDP session disconnects. Improved session handoff and screen capture recovery.
  2. Improved ICE candidate gathering and TCP connectivity for Web sessions, addressing connection issues in some network environments.
  3. Fixed unexpected video quality degradation in Web sessions and improved video delivery under limited bandwidth.
  4. Fixed controlled devices being unable to queue additional outgoing files while a transfer was active.
  5. Fixed flickering and excessive input length in the remote device ID field, limiting input to nine digits.
  6. Fixed About dialog layout shifts during update checks and conflicting height constraints in update dialogs. Aligned dialog sizing and layout across desktop platforms.
  Usage Notes:
  - Direct input of Chinese text, emoji, and other Unicode characters from mobile devices requires host support. Supported macOS hosts accept this input directly. Windows, Linux, and older hosts without this capability fall back to ASCII key input; use the session clipboard feature and paste on the remote computer for other text.
  - File cancellation is available on the sending side. Dismissing a transfer notification only hides it; click Cancel to stop sending.
  - HarmonyOS PC, phone, and tablet support remains in development. Further physical-device compatibility and feature validation is still required.
