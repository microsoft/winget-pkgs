ReleaseNotes: |-
  新增功能与改进：
  1. 桌面端 IP 直连新增 IPv6 支持，并新增“监听所有 IP 接口”选项，默认开启。有线、Wi-Fi、VPN 和虚拟网卡可共用同一监听端口，方便在不同网络环境下建立直连会话。
  2. Android、iOS 和鸿蒙移动端新增隐私屏控制，可在远程会话中开启或关闭被控电脑的隐私屏。新增允许本机快捷键解锁的设置，并支持在本机解除隐私屏后，由控制端重新锁定。
  3. 桌面端与移动端统一支持 10 种界面语言，新增跟随系统语言能力。桌面端仍可手动选择语言，并保留已有语言设置。
  4. 新增与 Web 客户端的双向文本剪贴板同步支持，方便在浏览器与被控电脑之间复制、粘贴文本。
  5. 移动端网络状态新增实际编码器和解码器信息；桌面端与移动端的较长编解码器名称支持自动滚动显示。同步优化移动端控制菜单、隐私屏状态图标及提示布局。
  问题修复：
  1. 修复 Windows、Linux 被控电脑未连接鼠标时，远程光标可能不显示的问题。
  2. 修复空闲音频播放设备持续占用，导致 Windows 无法自动休眠的问题。
  3. 修复移动端系统输入法向 Windows 锁屏等安全桌面输入文本的问题，改善远程登录密码输入体验。
  4. 修复 Windows IP 直连身份文件的所有者与权限问题，改善管理员权限运行场景下的兼容性。
  5. 修复移动端屏幕方向控制，使横屏锁定仅在开启“连接后自动横屏”时生效；被控电脑锁屏时隐藏不可用的隐私屏操作，并仅对 Windows 被控端显示专用快捷键。
  6. macOS 安装过程不再主动重置已有系统权限，减少重复授权；完善应用与安装包的签名、公证流程。
  7. 修复近期连接提示残留及下拉列表内容与滚动条重叠的问题，并改善 Windows、iOS 等平台的构建兼容性。
  使用提示：
  - IPv6 直连需使用支持该功能的桌面客户端。指定端口时请使用 [IPv6 地址]:端口 格式，例如 [2001:db8::20]:52888；链路本地地址还需指定控制端的网卡作用域。双方网络需允许 TCP 和 UDP 互通。
  - “监听所有 IP 接口”默认开启，可在“设置 → 常规 → 网络连接”中关闭，恢复按物理网卡 IP 分别配置端口。
  - 移动端隐私屏和 Windows 安全桌面文本输入建议两端同时升级；Windows 锁屏输入还需安装并启动新版 CrossDesk Service。
  - Web 剪贴板同步需搭配支持该功能的 Web 客户端，当前支持文本内容。

  New Features and Improvements:
  1. Added IPv6 support for desktop direct IP connections and a “Listen on all IP interfaces” option, enabled by default. Ethernet, Wi-Fi, VPN, and virtual interfaces can share one listening port.
  2. Added privacy screen controls to Android, iOS, and HarmonyOS clients. Added a setting to allow or disable local shortcut unlocking, and support for remotely restoring the privacy screen after it has been unlocked locally.
  3. Unified desktop and mobile localization with support for 10 interface languages and system language detection. Desktop clients also support manual language selection and preserve existing preferences.
  4. Added bidirectional text clipboard synchronization with compatible Web clients, making it easier to copy and paste text between the browser and the remote computer.
  5. Mobile network statistics now show the actual encoder and decoder in use. Long codec names scroll automatically on desktop and mobile. Refined mobile controls, privacy screen status icons, and hint layouts.
  Bug Fixes:
  1. Fixed missing remote cursors on Windows and Linux hosts without a connected mouse.
  2. Fixed idle audio playback devices preventing Windows from automatically sleeping.
  3. Fixed text input from mobile system keyboards on Windows secure desktops, including the lock screen, improving remote password entry.
  4. Fixed ownership and permission handling for Windows direct IP identity files, improving compatibility when running with administrator privileges.
  5. Fixed mobile orientation handling so landscape locking applies only when automatic landscape mode is enabled. Unavailable privacy controls are hidden on locked desktops, and Windows-specific shortcuts are shown only for Windows hosts.
  6. macOS installation no longer explicitly resets existing system permissions, reducing repeated authorization prompts. Improved application and installer signing and notarization.
  7. Fixed stale recent-connection tooltips and dropdown items overlapping scrollbars, and improved build compatibility on Windows, iOS, and other platforms.
  Usage Notes:
  - IPv6 direct connections require compatible desktop clients. Use [IPv6 address]:port when specifying a port, such as [2001:db8::20]:52888. Link-local addresses also require the controller’s network interface scope. Both TCP and UDP traffic must be allowed between endpoints.
  - “Listen on all IP interfaces” is enabled by default. Disable it under Settings → General → Network to restore separate port settings for physical interface addresses.
  - Update both endpoints for mobile privacy controls and Windows secure desktop text input. Windows lock-screen input also requires an updated, running CrossDesk Service.
  - Web clipboard synchronization requires a compatible Web client and currently supports text.
