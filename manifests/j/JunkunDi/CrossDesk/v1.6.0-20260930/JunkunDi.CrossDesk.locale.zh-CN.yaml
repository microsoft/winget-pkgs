ReleaseNotes: |-
  更新内容
  新增功能与改进
  1. 增强信令重连后的会话恢复能力，音频和数据通道新增协商式 SRTP 加密支持。
  2. 新增被控端版本检查，连接旧版远程主机时提示升级。
  3. 桌面端新增“保存远程画面预览”开关，关闭后清除已有预览，保留连接记录和密码；桌面端和 iOS 支持在无预览时显示被控端平台信息。
  4. 优化连接状态标记、最近连接卡片、更新提示图标及公告窗口样式。
  5. 桌面端和 iOS 新增公告收件箱，支持未读提示、已读记录、删除公告及打开相关链接。
  6. Linux 新增 Wayland 会话授权说明及切换 X11 的使用指引。
  7. iOS 新增会话内画面设置，支持实时调整画质、采集帧率和画面偏好，无需断开重连。
  8. iOS H.264 编解码统一使用 VideoToolbox。
  9. 完善 iOS 网络状态展示，支持查看连接方式、收发码率、丢包率、帧率、连接延迟、视频延迟及媒体加密状态。
  10. 完善 iOS 隐私同意流程、远程预览保存控制及第三方许可证与源码信息。
  问题修复
  1. 修复 Linux X11 下远程窗口拖动异常。
  2. 修复 macOS 屏幕采集回调可能发生的死锁，改善 macOS 14 的兼容性。
  3. 修复 macOS 主窗口标题栏显示异常。
  4. 修复 iOS 设置页面导航问题，完善服务器地址和端口校验。
