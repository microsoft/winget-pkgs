ReleaseNotes: |-
  新增功能与改进：
  1. 新增终端 CLI 客户端，支持 ANSI、Kitty 和 Sixel 画面、显示器选择、局部缩放与平移、键鼠控制及 Pi 扩展，可通过 npm 安装。
  2. 优化 CLI 渲染性能与自适应预览帧率，优先保持画面清晰度；新增实时 FPS 显示、鼠标锚点缩放和持续本地命令模式。
  3. 桌面端新增可信设备配对与管理，支持复制、粘贴配对信息、查看设备指纹及移除信任，可按需限制 ID 连接和 IP 直连的访问设备。
  4. 桌面端服务器登录与控制端会话新增设备密钥认证，完善本机身份存储、权限保护及迁移机制。
  问题修复：
  1. 修复 macOS VideoToolbox 回调死锁导致的连接卡住，完善失败会话恢复，并修正接收数据码率重复统计。
  2. 修正证书错误提示，恢复证书错误后的自动重连。
  3. 修复 Linux 在 NVIDIA 主显示设备上错误启用 PRIME offload 导致的窗口空白问题。
  4. 修复 iOS、Android 远程画面的安全区域与缩放复位问题，完善 iOS 文件传输错误处理及多语言键盘按钮布局。
  5. 修复 CLI 画面比例、鼠标报告和点击定位问题，改善终端操作体验。
  6. 自动更新失败后提供重试更新与手动下载入口，完善错误状态提示。
  7. 适配 Xcode 27.1，完善 iOS 签名及 Xcode Cloud 依赖构建，修复 OpenSSL 资源符号与归档问题。
  升级说明：
  1. 新桌面端需要支持设备密钥登录的信令服务，自托管部署请先升级服务端。
  2. 可信设备限制默认关闭；开启后，不支持该认证的旧客户端、CLI 和移动端无法连接。
  3. 迁移已绑定的设备身份时，请同时备份 ID/密码缓存与 identity.json 私钥文件。

  New Features and Improvements:
  1. Added a terminal CLI client with ANSI, Kitty and Sixel rendering, display selection, zoom and pan, keyboard and mouse control, and a Pi extension, available through npm.
  2. Improved CLI rendering performance and adaptive preview frame rates while prioritizing image clarity; added live FPS, mouse-anchored zoom and persistent local command mode.
  3. Added trusted-device pairing and management on desktop, including pairing-data import and export, fingerprint inspection and trust removal, with optional access restrictions for ID and direct IP connections.
  4. Added device-key authentication for desktop server login and controller sessions, with improved identity storage, permission protection and migration.
  Bug Fixes:
  1. Fixed macOS connection hangs caused by VideoToolbox callback deadlocks, improved failed-session recovery, and corrected double-counted inbound data bitrate.
  2. Corrected certificate error messages and restored automatic reconnection after certificate failures.
  3. Fixed blank Linux windows caused by incorrectly enabling PRIME offload when NVIDIA is the primary display provider.
  4. Fixed remote viewport safe areas and zoom reset on iOS and Android, and improved iOS file-transfer error handling and localized keyboard-button layouts.
  5. Fixed CLI aspect ratios, mouse reporting and click positioning for a better terminal experience.
  6. Added retry and manual-download actions after automatic update failures, with clearer error status messages.
  7. Updated iOS build settings for Xcode 27.1, improved signing and Xcode Cloud dependency builds, and fixed OpenSSL resource symbols and archive issues.
  Upgrade Notes:
  1. New desktop clients require a signaling server that supports device-key login. Upgrade self-hosted servers first.
  2. Trusted-device restrictions are disabled by default. When enabled, older clients, CLI and mobile clients without this authentication cannot connect.
  3. Back up both the ID/password cache and the identity.json private-key file when migrating a bound device identity.
