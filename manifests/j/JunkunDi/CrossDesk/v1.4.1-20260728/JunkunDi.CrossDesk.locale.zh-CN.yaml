ReleaseNotes: |-
  更新内容
  1. 修复 Slint 客户端远程键盘控制失效的问题，并优化窗口焦点、标签切换及按键释放处理。
  2. 修复 DTLS 与 SRTP 协商状态不一致可能导致远程连接失败的问题。
  3. 修复连接断开过程中视频回调可能引发的崩溃问题。
  4. 优化连接失败状态判断，避免网络协商仍在进行时过早显示连接失败。
  5. Linux 发布包启用 Wayland 屏幕采集支持，并完善 D-Bus、DRM 及 PipeWire 相关构建依赖。
  6. 完善 macOS 构建环境与 SDK 兼容性校验，提升发布包稳定性。
