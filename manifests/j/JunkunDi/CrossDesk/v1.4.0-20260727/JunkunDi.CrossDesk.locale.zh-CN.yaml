ReleaseNotes: |-
  更新内容
  1. 客户端界面全面升级，重构主界面、远程控制窗口、设置页面和文件传输等交互。
  2. 优化近期连接列表排序，在线设备优先显示。
  3. 优化设置页面滚动布局、远程窗口标题栏及 Linux Wayland 窗口行为。
  4. 优化新版本更新内容显示，提升长文本阅读体验。
  5. 支持键盘按键自动重复，优化长按输入体验。
  6. 不可用硬件编解码选项显示为禁用状态，避免误操作。
  7. 修复控制端断开后被控端窗口未自动关闭的问题。
  8. 修复文件传输异常的问题。
  9. 修复远程控制栏区域内的鼠标操作仍会传递到被控端的问题。
  10. 修复 Windows 安装包缺少 Slint 运行库可能导致程序无法正常启动的问题。
  11. 完善 Linux 与 macOS 构建、打包及兼容性校验，提升发布包稳定性。
