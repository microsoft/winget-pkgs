ReleaseNotes: |-
  新增功能与改进
  1. Windows、macOS 和 Linux 桌面端支持双向复制粘贴文件。在本机或远端的文件管理器中复制文件，到另一端粘贴时才开始传输。接收端可查看进度或取消传输。
  2. 每台远程设备都有独立的控制窗口，可同时查看多台电脑。重新连接时会恢复该设备上次的窗口大小。macOS 上的每个控制窗口也可进入独立的全屏空间，并可从全屏工具栏最小化。
  3. Android、iOS 和鸿蒙支持 IP 直连。在手机或平板上输入电脑的 IP 地址和端口，即可通过局域网或 VPN 连接。直连时可在网络状态中查看两端地址。
  4. 移动端支持可信设备配对。在「设置 → 本机配对信息」中复制配对信息，添加到被控电脑并核对指纹后，即可使用连接密码访问开启「仅允许可信设备控制」的电脑。
  5. 移动端新增适配 Windows、macOS 和 Linux 的快捷键面板，支持自定义、排序和固定常用组合键。最近连接中的设备也可设置别名并分组。
  6. 改善移动端双指缩放的响应速度，虚拟鼠标可独立拖动。放大画面后，视野会随光标移动。打开键盘时，将光标移到键盘上沿即可查看被遮住的内容。
  7. 桌面端可调整鼠标指针和滚轮灵敏度，滚轮设置按远程设备保存。Windows 和 macOS 新增纯黑隐私屏，远控悬浮按钮在空闲三秒后淡出并收起。
  8. 被控电脑可从主窗口工具栏查看当前连接的控制端，向指定设备发送文件或断开连接。桌面端在安装或升级后首次启动时会显示本版更新内容和赞助信息。
  9. 缩短视频帧从解码到显示的等待时间，改善中继连接的画质稳定性，以及丢包后的画面恢复。
  问题修复
  1. 修复 macOS 屏幕采集中断后画面可能无法恢复、当前 Retina 分辨率未出现在选项中，以及关闭会话状态栏时可能崩溃的问题。
  2. 修复 Windows 在采集尺寸变化后读取画面异常的问题。Linux X11 在显示器恢复后可继续采集，并减少采集失败时的重复重试。
  3. 修正部分 SDR 画面的色偏和明暗异常，改善 Windows 硬件编码兼容性及视频解码中断后的恢复。
  4. 修正远控时的 Shift 键状态、macOS 大写锁定键和 ISO 键位映射，改善 macOS 触控板和 Windows 高精度滚轮的小幅滚动。
  5. 修复 Android 和 iOS 使用输入法时已确认文字可能丢失，以及 Android 重新打开键盘后无法继续输入的问题。
  6. 修复移动端重复发起连接、iOS 自定义服务器设置未保存，以及 Android 和鸿蒙在多会话下未将剪贴板文本发送到当前设备的问题。
  7. 修复信令重试可能停滞、Windows 便携版对较长 Unicode 路径处理异常，以及部分 Linux 安装包因界面运行库版本不匹配而无法启动的问题。
  升级说明
  1. 使用文件复制粘贴时，请将两端桌面客户端都升级到 1.7.7。每次最多可复制 128 个普通文件，文件夹可通过双栏文件传输窗口发送。Linux 接收端需要 FUSE 2 或 FUSE 3 及挂载权限。
  2. Intel 和 Apple Silicon 安装包均要求 macOS 14.0 或更高版本。本版安装程序会在安装前检查系统版本。

  New Features and Improvements
  1. Copy and paste files in either direction between Windows, macOS and Linux desktops. Copy files in one computer’s file manager and paste them on the other. The transfer starts when you paste, and the receiving side can track progress or cancel.
  2. Each remote device opens in its own control window, so you can view several computers at once. Reconnecting restores the last window size for that device. On macOS, each window can use its own full-screen Space and can be minimized from the full-screen toolbar.
  3. Android, iOS and HarmonyOS can now connect directly to a computer by IP address and port over a LAN or VPN. Network Status can show both endpoints of a direct connection.
  4. Mobile devices can now pair with computers that require trusted controllers. Copy the pairing information from Settings, add it on the host and verify the fingerprint. Paired devices still use the connection password.
  5. The mobile shortcut panel includes presets for Windows, macOS and Linux. You can create, reorder and pin key combinations, and organize recent devices with aliases and groups.
  6. Pinch-to-zoom responds faster on mobile, and the virtual mouse can be repositioned independently. The view follows the pointer when zoomed in. With the keyboard open, move the pointer to its top edge to reveal content behind it.
  7. Desktop controllers now offer pointer and scroll sensitivity controls and remember scroll sensitivity per remote device. Windows and macOS also offer a solid black privacy screen. The floating control button fades and retracts after three seconds of inactivity.
  8. A toolbar menu on the host lists connected controllers. Select one to send files or disconnect it. The desktop client also shows release notes and sponsors on the first launch after installation or upgrade.
  9. Reduced the delay between video decoding and display, improved video quality stability over relay connections, and improved picture recovery after packet loss.
  Bug Fixes
  1. Fixed macOS screen capture failing to resume after an interruption, the active Retina resolution missing from display options, and a potential crash when closing the session status bar.
  2. Fixed Windows capture errors when the captured surface changes size. Linux X11 capture now resumes when a display becomes available again and backs off between failed attempts.
  3. Corrected color casts and brightness errors in some SDR video. Improved Windows hardware encoding compatibility and recovery after decoding interruptions.
  4. Fixed remote Shift key handling, macOS Caps Lock behavior and ISO key mapping. Small scroll movements now register more reliably on macOS trackpads and high-resolution Windows mouse wheels.
  5. Fixed cases where Android and iOS input methods lost committed text, and where reopening the Android keyboard prevented further input.
  6. Fixed duplicate mobile connection attempts, custom server settings failing to persist on iOS, and clipboard text failing to reach the active device on Android and HarmonyOS.
  7. Fixed stalled signaling retries, long Unicode path handling in Windows portable builds, and Linux startup failures caused by a mismatched UI runtime in some packages.
  Upgrade Notes
  1. Upgrade both desktop clients to 1.7.7 to copy and paste files. You can copy up to 128 regular files at a time. Use the dual-pane file transfer window for folders. Receiving pasted files on Linux requires FUSE 2 or FUSE 3 and permission to mount a FUSE filesystem.
  2. The Intel and Apple Silicon installers require macOS 14.0 or later and now check the system version before installation.
