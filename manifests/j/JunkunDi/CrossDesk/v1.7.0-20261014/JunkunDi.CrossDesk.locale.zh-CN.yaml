ReleaseNotes: |-
  更新内容
  新增功能与改进：
  1. 桌面端新增独立桌面墙（DeskHub），支持同时预览多台远程设备，可通过设备 ID 添加或从近期连接批量导入。
  2. 新增设备分组与批量操作，支持跨页选择、批量连接、断开、静音及文件分发；近期连接支持分组管理与筛选。
  3. 桌面墙支持拖动调整网格大小、设备排序、放大预览、精简模式和全屏显示，可调整缩略图与主画面的比例，并记忆窗口布局。
  4. 新增桌面墙群控，将当前设备的鼠标、键盘及组合键操作同步到所有已连接设备，范围包含其他分组和分页，不受批量勾选限制；释放操控或窗口失焦时自动结束群控。
  5. 新增桌面墙传输设置，支持统一配置分辨率上限及 15 / 30 / 60 FPS。支持该能力的设备可随预览大小调整传输分辨率，并在画面不可见时暂停视频传输；桌面墙连接默认静音，可按需开启声音。
  6. 支持自动分配桌面墙视频总带宽，优先保障放大画面，并随设备连接、视图和分页变化调整分配，减少多设备预览的带宽占用。
  7. 新增桌面墙网络状态面板，可查看各连接的直连 / 中继、加密状态、收发速率、视频延时、丢包率、实际分辨率与帧率。
  8. 新增信令服务手动重连入口，完善重连期间的状态提示与连接恢复体验。
  9. 统一桌面端设置、弹窗与控件样式，设置页面新增“常规 / 桌面墙”选项卡，公告面板支持一键全部标为已读。
  问题修复：
  1. 修复连接时密码输入提示缺失、认证失败处理不完整及密码重试异常，改善多设备后台连接之间的状态隔离。
  2. 修复 DTLS 握手停滞导致连接长时间无法恢复的问题，完善握手超时处理与丢包后的重传恢复。
  3. 修复未勾选“记住密码”时成功连接未正确保存到近期记录的问题，连接成功后即可更新记录。
  4. 修复远程控制 macOS 时，系统隐藏鼠标指针后远程光标消失的问题。
  5. 修复 UPnP 操作中的资源泄漏；iOS 停用 UPnP 发现与端口映射，保留局域网连接、ICE/STUN 打洞及 TURN 中继。
  6. 修复 Android 应用版本与发布标签不一致的问题，统一应用版本和安装包命名。
  7. 修复近期连接提示浮窗遮挡连接弹窗确认按钮，以及更新日志中 Markdown 分隔符显示异常的问题。
  使用提示：
  - 群控向各设备发送相同坐标与按键，不会针对不同屏幕尺寸单独适配。
  - 关闭桌面墙会断开全部远程设备连接，并关闭共用连接的独立会话窗口；最小化不会断开连接。
  - 桌面墙分辨率、帧率及带宽控制按被控端能力生效，旧版设备会按其支持情况回退。

  New Features and Improvements:
  1. Added DeskHub, a standalone desktop window for previewing multiple remote devices. Add devices by ID or import them in bulk from recent connections.
  2. Added device groups and batch actions, including selection across pages, connecting, disconnecting, muting, and file distribution. Recent connections now support group management and filtering.
  3. Added resizable device grids, drag-and-drop device ordering, an expanded preview, compact mode, and fullscreen support. Adjust the space allocated to thumbnails and the main preview, with window layout preferences saved.
  4. Added DeskHub group control to synchronize mouse, keyboard, and shortcut input across all connected devices, including other groups and pages, regardless of batch selection. Group control ends automatically when control is released or the window loses focus.
  5. Added DeskHub streaming settings for resolution limits and 15 / 30 / 60 FPS. Supported devices can adjust transmitted resolution to the preview size and pause video when no view is visible. DeskHub connections start muted, with audio available when enabled.
  6. Added automatic allocation of the shared DeskHub video bandwidth budget, prioritizing expanded views and adjusting to connection, view, and page changes to reduce bandwidth usage during multi-device previews.
  7. Added a DeskHub network status panel showing direct / relay connections, encryption status, send and receive rates, video latency, packet loss, actual resolution, and frame rate.
  8. Added a manual signaling reconnect action and improved connection status feedback during recovery.
  9. Unified desktop settings, dialogs, and control styling. Added General / DeskHub settings tabs and a Mark all as read action for announcements.
  Bug Fixes:
  1. Fixed missing password prompts, incomplete authentication failure handling, and password retry issues. Improved state isolation between background connections to multiple devices.
  2. Fixed stalled DTLS handshakes that could prevent connection recovery. Improved handshake timeout handling and retransmission after packet loss.
  3. Fixed successful connections not being saved correctly to recent connections when Remember password was disabled. Records now update as soon as a connection succeeds.
  4. Fixed remote cursors disappearing when macOS hides the system pointer during remote control.
  5. Fixed resource leaks in UPnP operations. Disabled UPnP discovery and port mapping on iOS while retaining local connections, ICE/STUN hole punching, and TURN relay support.
  6. Fixed Android app versions not matching release tags, aligning application versions and package naming.
  7. Fixed recent-connection tooltips covering the connection dialog’s confirmation button, and incorrect rendering of Markdown separators in release notes.
  Usage Notes:
  - Group control sends the same coordinates and keys to each device without adapting them to different screen sizes.
  - Closing DeskHub disconnects all remote devices and closes standalone session windows sharing those connections. Minimizing DeskHub keeps connections active.
  - DeskHub resolution, frame rate, and bandwidth controls depend on host capabilities. Older hosts fall back to the behavior they support.
