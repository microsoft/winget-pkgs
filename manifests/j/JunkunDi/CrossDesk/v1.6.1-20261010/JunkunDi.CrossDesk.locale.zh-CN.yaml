ReleaseNotes: |-
  更新内容
  新增功能与改进：
  1. 增强信令快速重连与连接恢复能力；桌面端配置修改无需重新连接信令服务。
  2. Windows 安装版新增登录前远程控制支持，被控端可随系统启动，在尚未登录 Windows 时接受远程连接。
  3. Linux 提供普通版与 Xfce 虚拟桌面版独立安装包，普通版不再强制安装 Xfce 和 Xvfb。
  4. 被控端会话窗口改为紧凑的屏幕边缘状态栏。
  5. 完善 iOS / Android 原生控制端，优化远程画面、触控与外接键鼠体验；Android 支持 H.264 / AV1 硬件解码，不支持时自动回退到软件解码。
  6. 移动端新增画中画与后台会话保持支持。Android 在画中画不可用时使用前台服务保持连接。
  7. 移动端新增悬浮虚拟鼠标，支持左键、右键、拖拽及滚轮操作，优化悬浮菜单和横屏布局。
  8. 完善移动端会话操作：Android 新增文件收发、传输进度与接收文件保存；iOS 新增发送本机剪贴板文本入口；两端支持通过远端 Windows 服务发送 Ctrl+Alt+Del。
  9. 优化 Android 平板和 iPad 的自适应布局，支持横竖屏与分屏调整，改善连接卡片、设置页面和弹窗展示。
  10. iOS 和 Android 新增应用更新提示，支持首页更新标记、“关于”页面版本展示及手动检查更新。
  问题修复：
  1. 修复控制端异常断开后会话未及时清理，以及被控端断开后远程标签页未自动关闭的问题。
  2. 修复桌面端自托管配置无法使用带路径或显式端口的服务器地址的问题，完善地址校验与保存反馈。
  3. 修复 Windows 开机自启注册与旧启动项迁移问题，改善安装版登录后的自动启动行为。
  4. 修复 Windows 管理员权限应用无法接收远程键鼠输入的问题，恢复远程快捷键并改善按键状态恢复。
  5. 修复 Windows 锁屏、登录界面及安全桌面切换时的画面采集和输入异常。
  6. 修复 Windows 隐私屏启动失败、解锁后无法自动恢复，以及锁屏界面出现重复鼠标光标的问题。
  7. 修复 macOS 部分显示环境下视频延迟无法显示的问题，在缺少实际显示时间时提供带标记的估算值。
  8. 修复 iOS 悬浮控件稳定性及模拟器视频解码问题，改善 Android 画面缩放、平移与鼠标光标显示的一致性。

  New Features and Improvements:
  1. Improved signaling reconnection speed and connection recovery. Desktop configuration changes no longer require reconnecting to the signaling service.
  2. Added remote access before Windows sign-in for the installed version. The host can start with Windows and accept remote connections before a user signs in.
  3. Added separate standard and Xfce virtual desktop packages for Linux. The standard package no longer requires Xfce or Xvfb.
  4. Replaced the host session window with a compact status bar at the screen edge.
  5. Improved the native iOS / Android clients, including remote video, touch input, and external keyboard and mouse support. Android supports H.264 / AV1 hardware decoding with automatic software fallback when unsupported.
  6. Added Picture in Picture and background session support on mobile. Android uses a foreground service to maintain connections when Picture in Picture is unavailable.
  7. Added a floating virtual mouse on mobile, supporting left-click, right-click, dragging, and scrolling. Improved floating menus and landscape layouts.
  8. Expanded mobile session controls: Android now supports sending and receiving files, transfer progress, and saving received files; iOS adds an action to send local clipboard text. Both clients support sending Ctrl+Alt+Del through the remote Windows service.
  9. Improved adaptive layouts on Android tablets and iPad, including portrait, landscape, and split-screen support, with better connection cards, settings pages, and dialogs.
  10. Added app update notifications on iOS and Android, including home-screen update indicators, version information on the About page, and manual update checks.
  Bug Fixes:
  1. Fixed sessions not being cleaned up promptly after unexpected controller disconnections, and remote session tabs remaining open after the host disconnects.
  2. Fixed desktop self-hosted server configuration rejecting addresses with paths or explicit ports. Improved address validation and save feedback.
  3. Fixed Windows autostart registration and migration of legacy startup entries, improving automatic startup after sign-in for the installed version.
  4. Fixed remote keyboard and mouse input in Windows applications running with administrator privileges. Restored remote keyboard shortcuts and improved keyboard state recovery.
  5. Fixed screen capture and input issues when switching between the Windows lock screen, sign-in screen, and secure desktop.
  6. Fixed Windows privacy screen startup failures, failure to restore the privacy screen automatically after unlocking, and duplicate cursors on the lock screen.
  7. Fixed missing video latency readings in some macOS display environments. Clearly labeled estimates are now provided when actual presentation timestamps are unavailable.
  8. Fixed stability issues with iOS floating controls and video decoding in the iOS simulator. Improved consistency between Android and iOS zooming, panning, and cursor display.
