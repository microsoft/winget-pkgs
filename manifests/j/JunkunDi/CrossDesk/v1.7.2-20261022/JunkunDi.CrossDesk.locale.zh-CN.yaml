ReleaseNotes: |-
  新增功能与改进：
  1. 桌面端新增应用内更新，支持 Windows 安装版、macOS PKG 安装版和 Linux DEB 安装版。可在应用内下载并安装新版本，查看下载进度，安装完成后自动重新启动 CrossDesk；更新包在安装前进行签名与完整性校验。
  2. Windows 被控端新增 Unicode 文本输入支持，iOS 和 Android 系统键盘提交的中文、表情等文字可直接输入远端，完善移动端控制 Windows 的输入体验。
  3. 关于窗口新增许可证与源代码信息页面，支持查看第三方组件、许可证正文及对应源码链接，并优化页面导航与文本排版。
  4. 将主窗口中的重新连接入口调整为按钮，改善连接中断后的操作反馈。
  问题修复：
  1. 修复在其他应用复制文本后，返回远程窗口仍无法同步剪贴板的问题；恢复控制时及时发送待同步文本，方便直接在远端粘贴。
  2. 修复部分情况下信令心跳超时未被可靠识别的问题，改善网络异常时的连接状态检测。
  3. 加强 Linux 凭据缓存的文件与目录权限保护，完善缓存读取异常处理，避免读取失败时误覆盖已有设备身份信息。
  4. 完善应用内更新的授权与重启流程。macOS 和 Linux 在关闭程序前完成系统授权，取消授权时保留当前程序与连接；Linux 更新后保留原有虚拟桌面启动选项。
  5. 修复更新成功记录的清理顺序，避免临时文件清理后误报升级中断；统一桌面端构建版本并校验安装包与发布标签的一致性，防止旧版本发布覆盖较新版本的更新信息。
  使用提示：
  - 从旧版本升级至 v1.7.2 仍需手动下载安装。安装包含升级器与更新公钥的版本后，后续版本可使用应用内更新。Windows 便携版继续通过下载 ZIP 手动更新；不满足自动安装条件时，应用会提供手动下载入口。
  - 安装更新会中断当前远程连接和文件传输，请在确认安装前完成相关任务。
  - 移动端直接输入中文、表情等文字，需要被控端支持 Unicode 文本输入。Windows 被控端请升级至 v1.7.2；支持该能力的 macOS 被控端可继续使用。Linux 及不支持该能力的旧版被控端，可通过会话剪贴板发送并粘贴其他文字。

  New Features and Improvements:
  1. Added in-app updates for Windows installed editions, macOS PKG installations, and Linux DEB installations. Download and install new versions within the application, track download progress, and automatically restart CrossDesk after installation. Update packages undergo signature and integrity verification before installation.
  2. Added Unicode text input on Windows hosts. Chinese text, emoji, and other characters submitted through iOS and Android system keyboards can now be entered directly on the remote computer.
  3. Added license and source information pages to the About dialog, including third-party component details, license texts, and corresponding source links. Improved page navigation and text formatting.
  4. Changed the reconnect action in the main window to a button, improving interaction feedback after a connection is lost.
  Bug Fixes:
  1. Fixed clipboard synchronization failing after copying text in another application and returning to the remote window. Pending text is now sent promptly when control resumes, allowing it to be pasted on the remote computer.
  2. Fixed signaling heartbeat timeouts not being reliably detected in some situations, improving connection status detection during network disruptions.
  3. Strengthened file and directory permissions for the Linux credential cache. Improved error handling to prevent existing device identity information from being overwritten when cache reads fail.
  4. Improved authorization and restart handling during in-app updates. macOS and Linux now complete system authorization before closing the application, preserving the application and connections when authorization is cancelled. Linux retains existing virtual desktop startup options after updates.
  5. Fixed cleanup ordering for successful update records to avoid incorrectly reporting an interrupted upgrade after temporary files are removed. Unified desktop build versions, validated installer versions against release tags, and prevented older releases from overwriting newer update metadata.
  Usage Notes:
  - Upgrading from an older version to v1.7.2 requires a manual download and installation. After installing a version containing the updater and update public key, subsequent versions can use in-app updates. Windows portable editions continue to use manual ZIP downloads; installations that do not meet automatic installation requirements offer a manual download option.
  - Installing an update interrupts active remote connections and file transfers. Complete these tasks before confirming installation.
  - Direct input of Chinese text, emoji, and other Unicode characters from mobile devices requires host support. Update Windows hosts to v1.7.2; supported macOS hosts can continue using this capability. For Linux and older hosts without this support, use the session clipboard to send and paste other text.
