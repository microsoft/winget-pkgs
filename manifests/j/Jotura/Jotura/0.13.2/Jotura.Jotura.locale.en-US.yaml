ShortDescription: A Markdown notes app that keeps your notes as plain files on your disk, with optional end-to-end encrypted sync.
Description: |-
  Jotura is a Markdown notes app for Windows, macOS, Linux and Android. A vault is an ordinary folder of Markdown files, and an existing Obsidian vault opens as it stands. The app has rich and source editing, tags, links, daily notes, tasks and full-text search. The installer also adds the jotura command line tool for scripts and AI agents. Optional Jotura Sync is a paid plan that adds end-to-end encrypted sync, version history and sharing.
