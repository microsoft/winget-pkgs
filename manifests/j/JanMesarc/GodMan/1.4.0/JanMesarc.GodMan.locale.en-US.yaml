ShortDescription: GodMan is a console/TUI tool to install, manage, and activate Godot Engine builds (Standard and .NET) on Windows.
Description: CLI/TUI for installing, managing, and activating Godot Engine builds on Windows and Linux. Supports Standard and .NET editions, user/global scope installs, version fetching, activation, and cleanup.
