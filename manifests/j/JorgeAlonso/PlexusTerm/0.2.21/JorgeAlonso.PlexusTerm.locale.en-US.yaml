ShortDescription: SSH client and terminal with SFTP, tunnels, serial consoles and a DEV mode for AI coding tools.
Description: PlexusTerm is a terminal and remote-session manager - local shells, SSH with jump hosts, an SFTP browser, SSH tunnels, serial consoles, Telnet and Mosh, split panes with multi-execution and saved sessions (with import from .ini session files). Its DEV mode turns a tab running Claude Code, Codex or OpenCode into a workspace with a project explorer, git status and a live file viewer, and an optional AI chat explains errors and suggests commands. The interface is available in 10 languages.
