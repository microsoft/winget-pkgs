ReleaseNotes: |-
  # VoxDMR 0.16.1 🎉

  Covers work from 2026-10-30 to 2026-11-02.

  **Platforms:** Android (arm64-v8a, armeabi-v7a/32-bit, x86_64) · Linux x86_64 · Windows x86_64

  > 📱 **Which Android APK?** Most people want **arm64-v8a** from the Play Store. The **32-bit (armeabi-v7a)** APKs are built specifically for PoC radios and older Android phones：**install those manually, not from the Play Store.**

  ---

  ## ✨ New features

  • **A master switch for text messaging** `[All]` - Settings › Connection › Messages can turn DMR texting off entirely, and off means off at the protocol level：nothing is sent, incoming texts are not confirmed - to the network your station is a radio without SMS support, and senders see their messages as undelivered - and the Messages tab (Android) or panel (desktop) disappears. Conversations already on the device are kept and come back when you turn it on again.
  • **Texting is now opt-in** `[All]` - new installs start with texts off, and the setup wizard offers the switch on its last step. Updating keeps whatever you have today：if you've been texting, nothing changes.

  ## 🔧 Changes

  • **Only your own texts reach the inbox** `[All]` - on BrandMeister, a private text addressed to a different DMR ID is now ignored instead of landing in your inbox and being confirmed to its sender as delivered. Homebrew already worked this way.

  ## 🐛 Fixes

  • **Talkgroup taps survive an overnight session** `[Android]` - when Android restarted the app's screens under a live background session, tapping a talkgroup, sending a text or keying PTT could keep failing until some other action happened to revive the link to the radio engine. Every action now revives it on its own.
  • **Picking a talkgroup no longer leaves the app stuck on "Scanning"** `[Android]` - selecting a talkgroup turns scan off, but the app's scanning badge didn't follow, and the new subscription's confirmation was thrown away as scan noise.
  • **Transmit errors no longer quote old news** `[Android]` - a failed transmission could show the text of an earlier, unrelated connection error. Errors are cleared the moment the link is confirmed up.
  • **Icon buttons name themselves** `[Android]` - the clear-search and close buttons had no labels for TalkBack to read; they do now.
