ReleaseNotes: |-
  # VoxDMR 0.16.0 🎉

  Covers work from 2026-09-08 to 2026-10-30.

  **Platforms:** Android (arm64-v8a, armeabi-v7a/32-bit, x86_64) · Linux x86_64 · Windows x86_64

  > 📱 **Which Android APK?** Most people want **arm64-v8a** from the Play Store. The **32-bit (armeabi-v7a)** APKs are built specifically for PoC radios and older Android phones：**install those manually, not from the Play Store.**

  ---

  ## ✨ Headline features

  • **DMR text messaging** `[All]` - send and receive texts on BrandMeister and on Homebrew networks, with conversations, an inbox and notifications (reply straight from them on Android). A private text on BrandMeister is confirmed by the other station's terminal, and VoxDMR tells the outcomes apart：*delivered*, *sent but not confirmed*, and *not delivered — tap to retry*. Talkgroup texts work on Homebrew networks; BrandMeister doesn't route them. A Message button on a call's details starts a conversation with the caller.
  • **The QSO log times calls** `[All]` - a new Duration column counts the station's actual time on the air, live while the call is running. Every over gets its own row, so a station that keys up again doesn't inflate its last one.
  • **QSO history, export, and your own transmissions** `[Android]` - the log survives restarts, with a History screen, a details sheet per call and CSV/ADIF export; the columns can be reordered. Your own overs get rows of their own, in their own theme colours, with a setting to hide them.
  • **Followed stations** `[All]` - follow a callsign or DMR ID and VoxDMR tells you when they come up on your talkgroup or call you privately — a chime and an OS notification on desktop, a sound or vibration on Android, plus optional spoken announcements through the system voice. All of a callsign's DMR IDs count, hotspots included, and a quiet period keeps a long contact from alerting at every over.
  • **A menu built for PoC radios** `[Android]` - on the P50 and similar, a full-screen grid of tiles replaces the nav drawer：destinations plus quick actions (Connect, Scan, VOX, Noise reduction, Car mode…), every tile reachable with the D-pad, and a settings screen to hide the entries you don't use. Confirmations go full-screen too, with big buttons and the safe choice focused first.

  ## ✨ New features

  • **The screen wakes for radio traffic** `[Android]` - the screen turns on for incoming calls and with PTT, the app can show over the lock screen, and pocket PTT protection uses the proximity sensor to keep a pocketed radio off the air.
  • **Car mode, your way** `[Android]` - put the name or talker alias on the big line, size each line yourself, and hide the on-screen talkgroup keys on radios that have hardware ones.
  • **Receive mute** `[Android]` - silence received audio from the menu without disconnecting.
  • **Fresh data on its own** `[Android]` - the DMR ID database and the BrandMeister talkgroup list refresh themselves on Wi-Fi while charging, with a banner when they're stale. Optional BrandMeister master failover switches to the next-best master when yours goes away.
  • **Quicker in and out** `[Android]` - Quick Settings tiles for the session and scan, launcher shortcuts, and quit without the confirmation (it still asks mid-transmission).
  • **BrandMeister diagnostics** `[All]` - the detailed activity log now shows the server's reports with their text and names any packet type the app doesn't handle, so an odd link can explain itself.
  • **VoxDMR is coming to iPhone** - an iOS app with live call audio is in internal TestFlight testing.

  ## 🔧 Changes

  • **Callsign only where it's used** `[Android]` - BrandMeister profiles no longer keep a callsign：it was never sent anywhere and only shadowed the DMR ID database, which is what names you in the log. Onboarding asks for it on the Homebrew server step, where it's actually optional.

  ## 🐛 Fixes

  • **An idle VoxDMR no longer burns battery** `[Android]` - connected and idle, the app kept redrawing meters and animations nobody could see — about a full CPU core on a Pixel 9 with the screen on, and ~120 wakeups a second with it off. Both are now within rounding of zero.
  • **Calls end even when the network loses the ending** `[All]` - a call whose terminating frame goes missing now ends on its own after 1.5 s of silence instead of jamming scan and inflating the log; audio that returns within 5 s resumes the same call, so a network stall doesn't mute the rest of it.
  • **No more wrong-password errors right after connecting** `[All]` - logging in to a Rewind server could fail as a bad password because a second keepalive raced the login handshake; it now waits its turn.
  • **A dropped link no longer leaves a phantom call on the air** `[Desktop]` - losing the connection mid-call left the call card showing the caller and PTT refused until another call came and went.
