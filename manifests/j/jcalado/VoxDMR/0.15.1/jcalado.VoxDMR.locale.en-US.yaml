ReleaseNotes: |-
  VoxDMR 0.15.1 🎉
  Covers work from 2026-09-04 to 2026-09-05.
  Platforms: Android (arm64-v8a, armeabi-v7a/32-bit, x86_64) · Linux x86_64 · Windows x86_64
  > 📱 Which Android APK? Most people want arm64-v8a from the Play Store. The 32-bit (armeabi-v7a) APKs are built specifically for PoC radios and older Android phones: install those manually, not from the Play Store.
  A small follow-up to 0.15.0, about how the app shuts down and how it comes back.

  🐛 Fixes
  - Quit really quits, and opening the app reconnects [Android] - quitting from the app bar (or from the drawer on a small-panel radio) ended the session and closed the window, but left VoxDMR itself running in the background. Quit now shuts the app down for real, which makes opening it a fresh start: with Connect when the app opens switched on, it connects and rejoins your last talkgroup in about a second.
  - Coming back to the app no longer fights a reconnect already in progress [Android] - returning to VoxDMR while it was retrying a dropped connection could start a second attempt over the top of the first. It now waits for the one already under way. A password the server has rejected is no longer retried every time you open the app either — repeatedly presenting a bad password to a master is how a DMR ID gets blocked, so it waits for you to correct it.
  - Website link in About [Desktop] - points at voxdmr.com.
