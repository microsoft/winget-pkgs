ReleaseNotes: "# VoxDMR 0.15.0 🎉\r\n\r\nCovers work from 2026-07-28 to 2026-09-04.\r\n\r\n**Platforms:** Android (arm64-v8a, armeabi-v7a/32-bit, x86_64) · Linux x86_64 · Windows x86_64\r\n\r\n> 📱 **Which Android APK?** Most people want **arm64-v8a** from the Play Store. The **32-bit (armeabi-v7a)** APKs are built specifically for PoC radios and older Android phones：**install those manually, not from the Play Store.**\r\n\r\n---\r\n\r\n## ✨ Headline features\r\n\r\n• **VOX — transmit by speaking** `[All]` - arm it and your voice keys the radio; the talk button always overrides it, and a time-out timer is always enforced. Deliberately out of the way：on Android, *Settings → Push-to-talk → Advanced: VOX* opens to a five-second press and hold the first time (a held D-pad OK works on radios with no touchscreen); on desktop, five clicks on the same header. A first-use notice explains what a self-keying transmitter means before it can be switched on. ⚠️ **Do not use VOX to bridge another radio or a repeater onto BrandMeister** — unattended bridging is against their terms and is grounds for having your DMR ID banned.\r\n• **Neural noise reduction on transmit** `[All]` - a small neural network cleans your microphone before the DMR codec sees it, with a strength slider. The codec sends a *model* of your voice rather than the sound itself, so background noise corrupts it into the burbly artefacts people blame on DMR — cleaning the input helps far more than cleaning the output would. Roughly +3 to +4 dB in car, hum, babble and hiss. **Off by default, and worth leaving off somewhere quiet**：with no noise to remove it measurably degrades clean speech.\r\n• **Light theme** `[All]` - Dark, Light, or follow the system, on both platforms. Dark stays the default and looks exactly as it did; the choice survives a restart and travels in a settings backup.\r\n• **First-run setup wizard** `[All]` - a guided first launch on both platforms — network, account, microphone check, vocoder — instead of an empty settings screen. Talkgroup names are now per-network, so a FreeDMR talkgroup no longer shows a BrandMeister name.\r\n• **Bips for received calls, and separate PTT tones** `[All]` - a short high bip when someone starts transmitting on your talkgroup and a low one when they stop, so you can hear the channel go busy without watching the screen. The single \"PTT tones\" setting is now two — start and stop — so you can keep just the roger beep.\r\n• **Car mode looks like a radio** `[Android]` - on small-panel PoC radios such as the Hytera P50, car mode now draws an instrument face：a legend rail, a state plate, a segmented level meter with peak hold, a time-out bar while you transmit, and hard-edged channel keys. Phones and tablets are unchanged.\r\n\r\n## ✨ New features\r\n\r\n• **Home-screen call card** `[Android]` - on Hytera PoC radios running the Onego launcher, the home screen shows the talkgroup, who is talking and a running call timer, and VoxDMR appears in the launcher's card picker.\r\n• **Status LED** `[Android]` - the radio's notification LED follows the session：green for an incoming call, red while you transmit, a slow orange blink while scan is armed, plus optional connection-drop and connected indications. Five independent switches under Display & power.\r\n• **Cleaner microphone capture** `[Android]` - VoxDMR now asks Android for the least-processed microphone it can get and switches the vendor noise suppressor, AGC and echo canceller off on the capture session. Previously those ran on top of VoxDMR's own levelling on many handsets.\r\n• **Targets Android 16 (API 36)** `[Android]`\r\n\r\n## 🔧 Changes\r\n\r\n• **Transmit filters now default off** `[All]` - the ~300 Hz low cut and ~3.4 kHz high cut ahead of the DMR codec used to ship on. Both now start off, so your microphone reaches the codec with its full tone and the band-limiting is there when you want it. Still in Settings on both platforms. ⚠️ **On Android, an install where you never opened those toggles will move to off, changing your transmitted audio** — turn \"Cut low rumble\" back on if your mic picks up handling noise, wind or desk thumps. Desktop configs saved by 0.13.0 or later keep whatever they had.\r\n\r\n## 🐛 Fixes\r\n\r\n• **Talker aliases** `[All]` - an alias sent as 16-bit text no longer turns into a row of Chinese characters partway through a call; the 8-bit formats had the same fault with a quieter symptom and are fixed too.\r\n• **Bluetooth headset mic** `[Android]` - works again; it was sending no audio at all.\r\n• **Volume keys on Hytera radios** `[Android]` - now move the volume you are actually listening to.\r\n• **PTT tone** `[All]` - the start tone no longer leaks into the beginning of your transmission.\r\n• **Process outlived its last window** `[Desktop]` - closing the last window no longer leaves VoxDMR running in the background.\r\n• **Settings on compact radios** `[Android]` - lists clear the navigation bar, and the info buttons no longer trap D-pad focus."
