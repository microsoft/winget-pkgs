Description: Concentré (formerly Pomodorolm) is a simple, lightweight and configurable focus timer with tray icon, built with Tauri. The timer circle and the tray icon change color as time runs out, so the remaining time is always visible. You can change its look and feel with themes, or create your own. All session durations are configurable, and you can play sounds (ticking, end of session) and display notifications.
