Description: |-
  A BareTail replacement: instant tail-and-highlight, plus saved views for groups of
  log files (Dev / Test / Prod), live filtering, wildcard paths that follow rolling
  files, a merged cross-file timeline, per-view error badges, and a local SQLite
  database that groups repeated errors into distinct issues you can turn into a
  Jira ticket. No service, no account, no telemetry.
