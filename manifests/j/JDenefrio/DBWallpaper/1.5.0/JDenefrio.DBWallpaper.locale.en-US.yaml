License: Freeware
ShortDescription: Unofficial wallpaper rotator for Digital Blasphemy members, with per-monitor fitting, spanning, schedules and a screensaver.
Description: |-
  DB Wallpaper rotates Digital Blasphemy wallpapers on your desktop using your own membership's API key.
  It picks images that fit each monitor, can span wide art across several screens, supports favorites,
  collections, time-of-day profiles, darker images at night, the lock screen and a screensaver.
  Unofficial and fan-made; not affiliated with Digital Blasphemy. Requires a Digital Blasphemy membership.
