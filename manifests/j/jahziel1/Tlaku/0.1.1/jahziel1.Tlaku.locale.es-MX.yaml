ShortDescription: Software libre y de código abierto para preparar y enviar trabajos a cortadoras y grabadoras láser.
Description: |-
  Tlaku es una alternativa libre y de código abierto (MIT) para cortadoras y grabadoras láser. Importa
  SVG, DXF e imágenes, organiza capas y ajustes de corte, planifica el recorrido, estima el tiempo y
  ejecuta el trabajo en tu máquina. Soporta controladoras de la familia GRBL (puerto serie USB o red),
  Ruida, K40 (M2 Nano) y tarjetas galvo (las tres últimas, experimentales), con biblioteca de
  materiales, nesting, alineación con cámara y control remoto opcional desde el celular, siempre con
  las confirmaciones que cuidan la máquina. Interfaz en español y en inglés. Beta: el instalador aún
  no está firmado, así que Windows SmartScreen puede mostrar un aviso.
