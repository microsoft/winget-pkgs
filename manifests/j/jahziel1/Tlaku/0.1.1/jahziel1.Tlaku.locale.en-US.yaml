ShortDescription: Free and open source software to prepare and send jobs to laser cutters and engravers.
Description: |-
  Tlaku is a free, open source (MIT) alternative for laser cutters and engravers. Import SVG, DXF and
  images, organize layers and cut settings, plan the toolpath, estimate the time and run the job on
  your machine. It supports GRBL-family controllers (USB serial or network), Ruida, K40 (M2 Nano) and
  galvo cards (the last three are experimental), with a material library, nesting, camera alignment
  and an optional phone remote control with the confirmations that keep the machine safe.
  English and Spanish interface. Beta: the installer is not code-signed yet, so Windows SmartScreen
  may warn.
