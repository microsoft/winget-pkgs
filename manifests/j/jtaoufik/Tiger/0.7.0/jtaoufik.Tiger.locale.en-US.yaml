ShortDescription: An offline, git-friendly API client with a frosted-glass UI
Description: >-
  Tiger is a free, open source, git-native API client. Collections are
  plain-text .tiger files that live in your own Git repo, every request runs
  entirely on your machine, and a built-in MCP server lets AI assistants
  drive your API. Imports Postman, Insomnia, Bruno, OpenAPI and WSDL/SOAP
  collections.
