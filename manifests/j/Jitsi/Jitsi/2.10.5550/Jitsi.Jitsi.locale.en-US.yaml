ShortDescription: Legacy Jitsi Desktop client for SIP and XMPP instant messaging, voice and video calls.
Description: Jitsi Desktop is the legacy Jitsi desktop client, an instant messaging and voice over IP application for SIP and XMPP networks. It supports encrypted voice and video calls, conference calls, desktop sharing, file transfer, and works with existing account services. Jitsi is distributed under the terms of the Apache License, Version 2.0.
