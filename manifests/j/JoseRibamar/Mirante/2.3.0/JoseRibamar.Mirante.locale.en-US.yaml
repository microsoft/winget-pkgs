ShortDescription: Markdown, Mermaid and Graphviz viewer and editor with live editing
Description: |-
  Mirante opens Markdown files (.md), Mermaid (.mmd) and Graphviz (.gv, .dot) diagrams and plain text (.txt) with a clean look, and reloads them by itself when the file changes on disk.
  It has editable mind maps with four layouts, a code editor on the side with the drawing updating as you type, diagrams with zoom and full screen inside Markdown, light and dark themes, and export to SVG and PDF. The interface is in English and Portuguese.
