PackageIdentifier: JoseRibamar.Mirante
PackageVersion: 2.3.0
PackageLocale: pt-BR
Publisher: José Ribamar
PackageName: Mirante
License: MIT
ShortDescription: Visualizador e editor de Markdown e diagramas Mermaid e Graphviz, com edição ao vivo
Description: |-
  O Mirante abre arquivos Markdown (.md), diagramas Mermaid (.mmd) e Graphviz (.gv, .dot) e texto simples (.txt) com um visual limpo, e atualiza sozinho quando o arquivo muda no disco.
  Tem mapas mentais editáveis com quatro layouts, editor de código ao lado com o desenho atualizando enquanto você digita, diagramas com zoom e tela cheia dentro do Markdown, tema claro e escuro e exportação para SVG e PDF. A interface está em português e em inglês.
