PackageName: Frog Pond
ShortDescription: Um jogo de sapo em pixel art na beira de um lago gerado, para jogar sozinho ou online com amigos.
Description: |-
  Frog Pond é um jogo de arcade em pixel art sobre um sapo na beira de um lago. Cada fase sai de uma semente, então qualquer fase pode ser compartilhada e jogada de novo por qualquer pessoa. Pegue moscas, vagalumes e libélulas com a língua, sobreviva a enxames de vespas e a cobras, e enfrente um chefe a cada dez fases.
  Jogue online ou na rede local: partidas versus para até seis sapos em dois times, ou survivor, em que até cinco sapos defendem uma ilha contra hordas de insetos e um chefe a cada dez hordas.
