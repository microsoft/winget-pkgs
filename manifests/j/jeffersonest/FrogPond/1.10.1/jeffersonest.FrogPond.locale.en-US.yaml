ShortDescription: A pixel-art frog game on the bank of a generated pond, played alone or online with friends.
Description: |-
  Frog Pond is a pixel-art arcade game about a frog on the bank of a pond. Every board is generated from a seed, so a board can be shared and played again by anyone. Catch flies, fireflies and dragonflies with your tongue, survive wasp swarms and snakes, and fight a boss every tenth board.
  Play online or on a local network: versus matches for up to six frogs in two teams, or survivor, where up to five frogs hold an island against hordes of insects and a boss every ten hordes.
  The game is in English and Brazilian Portuguese.
