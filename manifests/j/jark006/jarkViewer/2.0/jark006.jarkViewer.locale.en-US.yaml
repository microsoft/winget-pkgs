  ## JarkViewer v2.0 Update · 2026/11/02

  The upgrade from v1.34 to v2.0 extensively reworks image decoding, canvas rendering, UI, caching and media playback, and adds image annotation, batch processing and a standalone video/audio player.

  ### 1. UI and everyday browsing

  • **Rebuilt tool windows**：Settings, printing, editing, batch processing and renaming use Dear ImGui, with DPI scaling, light/dark themes and layouts for smaller windows. Light-theme control outlines, Settings, Help and About have been refreshed.
  • **Six interface languages**：Simplified Chinese, Traditional Chinese, English, Japanese, Korean and Russian, selected manually or from the system. Improved font fallback and Chinese input; fixed duplicate IME text and garbled message boxes.
  • **Hover thumbnail strip**：browse folder thumbnails by clicking, scrolling or using keys, with the current image centered. Built-in decoding provides a fallback when system thumbnail extraction fails; persistent caching and cache clearing are supported.
  • **Image navigator**：a bottom-right overview shows the visible region and supports dragging to reposition. The navigator and thumbnail strip can be toggled in Settings.
  • **More viewing options**：prefer 1:1 display, file sorting, stopping at the last image, a black fullscreen background and reversed WASD panning. Improved zooming around the pointer and panning limits.
  • **Window and slideshow behavior**：titles prioritize the file name alongside its index, dimensions, size and zoom. Monitor and window state are remembered, including negative coordinates on secondary monitors. Slideshows hide navigation, information and other overlays.

  ### 2. Large images, SVG and color

  • **Progressive background loading**：decoding no longer blocks the main loop; initial decoding overlaps graphics initialization. Loading indicators and thumbnail previews provide feedback, while the previous image remains visible during page changes.
  • **Cache budgets by count and bytes**：defaults to 10 entries and 50% of physical RAM. Entries still in use are retained, with a minimum of two; very large images reduce neighbor preloading. Cache statistics are available in the information panel.
  • **Smooth scaling**：resamples at display resolution after movement settles, using area averaging for reduction and Lanczos for enlargement. Fixed crashes when enlarging extremely wide images.
  • **SVG vector rendering on demand**：rerasterizes for the zoom level and renders the visible region at high magnification. Fixed transparency, CSS variables and missing text in exports from draw.io and similar tools.
  • **ICC color management**：converts embedded profiles to the monitor profile, falling back to sRGB. Preserves alpha, skips identity transforms and processes large images in parallel. Batch conversion targets sRGB to prevent color shifts after profile metadata is omitted.
  • **PNG decoding improvements**：uses zlib-ng alongside updated and trimmed static dependencies.

  ### 3. Formats and metadata

  • **Reworked format routing**：identifies content before falling back to extensions and generic decoders, improving handling of incorrect or missing extensions and malformed inputs. Formats such as RAW and Live Photos retain necessary extension-specific behavior.
  • **Added LEP and DDS; enhanced PSD/PSB**：supports 8/16-bit RGB, grayscale and CMYK, with Raw, RLE, ZIP and ZIP prediction compression. Prefers a saved compatibility composite and can composite ordinary RGB layers when it is absent; fixes transparent, misaligned or blank results.
  • **Richer information panel**：RGB histogram, embedded ICC name and estimated JPEG quality, with wrapped, scrollable EXIF and clearer photographic values for exposure, aperture, focal length, ISO, exposure compensation and orientation.
  • **AI generation metadata**：improved StableDiffusion WebUI prompt and ComfyUI workflow extraction; fixed UTF-16 byte-order issues in UserComment.
  • **Decoder hardening**：improved dimension, palette, truncated-input and resource handling in ICO, PFM, HEIF, WIC and related paths.
  • **Current extension lists**：44 still-image, 38 RAW, 15 video and 26 audio extensions. See the [English guide](https://github.com/jark006/JarkViewer/blob/v2.0/README_EN.md) for the complete lists.

  ### 4. Editing, batch processing and files

  • **Editor and annotations (`Ctrl + E`)**：rectangles, ellipses, arrows, lines, brushes, mosaic and text; adjustable colors, line widths, fonts and fills; undo/redo, crop, rotate, flip and invert. Text supports anchored placement, live previews and Chinese input.
  • **Save editing results**：save as, copy to the clipboard or overwrite. PNG preserves transparency; JPEG flattens transparent regions onto white.
  • **Batch processing (`Ctrl + B`)**：format conversion, resizing, rotation/flipping, prefix-and-index renaming, and brightness, contrast and color adjustments, including HEIC, AVIF and RAW inputs.
  • **Flexible resizing**：percentage, width, height, custom dimensions or maximum long edge, with selectable resampling and output-size previews. Automatic mode uses area averaging for reduction and Lanczos for enlargement.
  • **File management**：rename while preserving the extension (`Ctrl + R`), copy/move to a chosen folder, and open in an external editor. Copy/move operations avoid existing names; cross-drive moves delete the source only after copying succeeds.
  • **Clipboard and Explorer integration**：copying an image also provides its file object. The optional `JarkThumbnailProvider.dll` adds Explorer thumbnails for JXL, AVIF, HEIC and other selected formats through the File association settings page.

  ### 5. Standalone media player and Live Photos

  • **Dedicated video/audio window**：open directly, drag a file in or use `Ctrl + O`. Supports formats such as MP4, MKV, MOV, WebM, MP3, FLAC and WAV, sharing window geometry and monitor memory with the image viewer.
