ShortDescription: Free offline word-by-word auto captions for Shorts, TikToks and Reels.
Description: |-
  WordCaps Studio Lite creates word-by-word highlighted captions for vertical and landscape videos.
  It runs 100 % on your PC (speech model included): no account, no upload, no subscription, no watermark.
  Three looks (Classic, Pop, Box), any colour, 4 sizes, 3 positions. Check and fix every line before burning.
  English, German and many more languages (auto-detect). Exports a burned-in MP4 and an SRT file.
