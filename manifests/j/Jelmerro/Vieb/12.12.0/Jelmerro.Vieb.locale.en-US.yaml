ReleaseNotes: |-
  Added
  - Setting "permissioncapturedsurfacecontrol" to control access to scrolling/zooming for shared screens via displaycapture
  - Other tab support to displaycapture permission dialog
  - Command confirm versions :split! and :vsplit! to open splits but stay focused in the current split
  - Setting "followsplitswitch" to control if split versions of follow mode should switch to the new split
  - Setting "keeprecentlyclosedhistory" to preserve tab history navigation for reopened tabs and optionally subsequent sessions
  - Setting "zoomdefault" to control the default zoom percentage for all pages
  Changed
  - Page layout updates to reflect for hidden pages in the background automatically
  - Dialogs to load just before show instead of on startup
  - Internal code structure to mainly use async/await over sync methods
  - Custom viewers to no longer allow insert mode since there are no inputs anyway
  - Adblocker loading to only parse unique lines for increased parsing speed
  - Adblocker to reuse existing engine if able for creating a new container and for updating lists
  Deprecated
  - Boolean values for "keeprecentlyclosed", use "always" (true, still same default), "session" or "never" (false) instead
  - Default value "dark" of "nativetheme" will change to "system"
  - Setting "searchemptyscope" and "searchscope" will be removed, use "searchreach" instead
  - Default value "session" of "keeprecentlyclosedhistory" will change to "always"
  Fixed
  - Setting "pdfbehavior" values "download" and "external" not doing anything recently
  - Unset desktopName leading to Alt-Tab related bugs on Wayland
  - Empty new tabs being recorded to recently closed tabs as if they need to be recovered
  - Identical setting invocations triggering the update related side effects
  Versions
  - Electron 45.4.1 (was 45.2.1)
  - Chromium 156.0.8078.100 (was 156.0.8078.75)
