ReleaseNotes: |-
  This release doesn't change runtime behavior or public APIs. It matters mainly to downstream packagers who test each optional feature of the crates separately.
  Fixed
  - (lib) The test suites now pass when an optional feature is enabled on its own (#1513, @jdx). Four configurations used to fail even though the all-features tests passed: usage-argv with only complete, only diagnostics or only spec, and usage-rs with only test. CI now tests each of these separately. This brings in the two test patches from Debian's packaging (debcargo-conf MR !1447), which packagers can drop starting with this release.

  💚 Sponsor usage
