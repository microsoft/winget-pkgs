ReleaseNotes: |-
  Multi-Tier License Activation, Multi-Device Seat Management & Precision Text Selection
  Features
  - License Activation: AppSumo lifetime keys across all tiers now activate seamlessly with immediate device seat resolution and progressive verification that only prompts for details when necessary.
  - Account & Tiered Upgrades: In-app upgrade prompts now dynamically highlight the exact tier needed when expanding workspace capacity, adding account logins, or configuring dedicated proxies, while Account Settings accurately displays your active tier, free plan status, and device allowances.
  - Multi-Device Seat Management: Added an assigned devices overview to Account Settings, allowing multi-computer license holders to view active workstations and release seats with one click.
  - Founder Launch Offer: Made the limited Founder Lifetime Deal directly accessible and redeemable within the in-app upgrade screen with clear promotional rate disclosures.
  Improvements
  - Visual Polish & Typography: Upgraded the entire application interface to refined executive typography with tabular figures, eliminating layout jitter in tab titles, dock counters, and timestamps across high-DPI displays.
  - Dock & Settings Access: Relocated Settings to the primary bottom-left dock anchor with instant shortcut access, eliminating popover overlaps on active screens.
  - Plan & Capability Specifications: Enhanced the in-app plan comparison matrix with a detailed breakdown of workspace limits, separate client logins, and proxy configuration across all tiers.
  Bug Fixes
  - Web Pane Text Selection: Double-clicking and triple-clicking text in web panes now reliably selects words and paragraphs, restoring standard highlight and copy workflows.
  - Navigation History: Back and forward navigation now skips over duplicate URL redirects and page loops, remembering your full navigation history even after restarting the app or closing tabs, while removing distracting swipe animations to keep page navigation clearly distinct from tab switching.
  - Dropdown & Interaction Stability: Fixed an issue where web dropdown menus could prematurely collapse, and prevented accidental address bar expansion when clicking nearby toolbar controls.
