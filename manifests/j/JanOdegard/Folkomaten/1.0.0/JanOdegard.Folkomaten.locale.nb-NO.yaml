ShortDescription: Kopier fødselsnummeret til en BankID-testbruker fra systemstatusfeltet
Description: |-
  Folkomaten er en liten app i systemstatusfeltet som lar deg kopiere
  fødselsnummeret til en BankID-testbruker med ett klikk. De samme brukerne
  finnes i Det Sentrale Folkeregisterets testdatabase, så de virker både mot
  BankID preprod og mot testmiljøer som slår opp i folkeregisteret.

  - 50 syntetiske eksempelbrukere følger med, så appen virker med en gang.
  - Klikk på en rad, så ligger fødselsnummeret på utklippstavla.
  - Global hurtigtast Ctrl+Alt+F åpner appen uansett hvilket program du er i.
  - Søk på navn eller fødselsnummer, og merk favoritter.
  - Last inn egne filer, eller hent nye testpersoner fra Skatteetatens Tenor
    (krever en Maskinporten-klient i testmiljøet).
  - Valgfri start ved innlogging.

  Appen har ikke noe vindu på oppgavelinja: trykk Ctrl+Alt+F eller klikk ikonet
  i systemstatusfeltet. Windows-utgave av Folkomaten for macOS av Ole Fredrik Lie.
