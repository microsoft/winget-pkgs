ShortDescription: Kopier fødselsnummeret til en syntetisk testperson fra systemstatusfeltet
Description: |-
  Folkomaten er et utviklerverktøy for norske testmiljøer. Appen ligger i
  systemstatusfeltet og kopierer fødselsnummeret til en syntetisk testperson
  til utklippstavla med ett klikk, klart til å limes inn i et påloggingsskjema
  eller et oppslag i et testsystem. Alle identitetene er syntetiske testdata
  fra Skatteetatens testdatatjeneste Tenor og tilhører ingen virkelige personer.

  - 50 syntetiske eksempelpersoner følger med, så appen virker med en gang.
  - Klikk på en rad, så ligger fødselsnummeret på utklippstavla.
  - Global hurtigtast Ctrl+Alt+F åpner appen uansett hvilket program du er i.
  - Søk på navn eller fødselsnummer, og merk favoritter.
  - Last inn egne filer med testpersoner, eller hent nye fra Tenor
    (krever en Maskinporten-klient i testmiljøet).
  - Valgfri start ved innlogging.

  Appen har ikke noe vindu på oppgavelinja: trykk Ctrl+Alt+F eller klikk ikonet
  i systemstatusfeltet. Windows-utgave av Folkomaten for macOS av Ole Fredrik Lie.
