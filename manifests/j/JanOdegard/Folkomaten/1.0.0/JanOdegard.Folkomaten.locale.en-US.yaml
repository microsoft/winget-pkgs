ShortDescription: System tray app that copies the national ID number of a Norwegian BankID test user with one click
Description: |-
  Folkomaten lives in the system tray and lets you copy the national ID number
  (fødselsnummer) of a BankID test user with one click. The same users exist in
  the test database of the Norwegian National Population Register, so they work
  both against BankID preprod and against test environments that look up the
  register.

  - 50 synthetic sample users are built in, so the app works right away.
  - Click a row to copy the number to the clipboard.
  - Global hotkey Ctrl+Alt+F opens the app from any program (configurable).
  - Search by name or number, and mark favourites.
  - Load your own user files, or fetch new test users from Skatteetaten's Tenor
    test data search (requires a Maskinporten test client).
  - Optional start at login.

  The app has no window on the taskbar: press Ctrl+Alt+F or click the tray icon.
  The user interface is in Norwegian. Windows port of Folkomaten for macOS by
  Ole Fredrik Lie.
