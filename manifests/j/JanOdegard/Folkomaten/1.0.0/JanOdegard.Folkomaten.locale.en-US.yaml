ShortDescription: System tray app that copies the ID number of a synthetic Norwegian test person with one click
Description: |-
  Folkomaten is a developer tool for Norwegian test environments. It lives in
  the system tray and copies the national ID number (fødselsnummer) of a
  synthetic test person to the clipboard with one click, ready to paste into a
  login form or a lookup in a test system. All identities are synthetic test
  data from the Norwegian Tax Administration's Tenor test data service and
  belong to no real person.

  - 50 synthetic sample persons are built in, so the app works right away.
  - Click a row to copy the number to the clipboard.
  - Global hotkey Ctrl+Alt+F opens the app from any program (configurable).
  - Search by name or number, and mark favourites.
  - Load your own test-person files, or fetch new synthetic persons from Tenor
    (requires a Maskinporten test client).
  - Optional start at login.

  The app has no window on the taskbar: press Ctrl+Alt+F or click the tray icon.
  The user interface is in Norwegian. Windows port of Folkomaten for macOS by
  Ole Fredrik Lie.
