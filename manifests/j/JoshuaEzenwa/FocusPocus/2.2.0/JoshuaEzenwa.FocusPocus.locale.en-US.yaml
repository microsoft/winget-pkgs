ShortDescription: A Windows pointer spotlight and input visualizer.
Description: FocusPocus spotlights the mouse pointer, visualizes clicks, and displays keystrokes on screen, which is useful for demos, presentations, and screen recordings. It pairs a native WinUI 3 settings interface with a lightweight Rust engine.
