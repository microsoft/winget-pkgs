ReleaseNotes: |-
  Imported meshes and pictures move, sketches snap onto their own curves and mirror across the origin axes, and ShapeCraft
  shows its icon on Windows.
  New
  - Points snap onto a sketch curve anywhere along it, not only at its ends and middle: near a line, circle, arc or
    spline the point lands on the curve itself, the purple mark shows where and the curve turns orange. Thanks
    @richcourt (#102).
  - Sketch Mirror takes an origin axis as the mirror line. Hover the red, green or blue axis while mirroring sketch
    curves: it lights up and the mirrored copy shows; click to mirror across it. Thanks
    @micide0606 (#104).
  Fixed
  - Imported STL, OBJ and 3MF bodies move and turn. Picking one now brings up the Move/Rotate gizmo instead of asking
    you to pick something. Pictures from Insert ▸ Image move, turn and copy the same way. Thanks
    @hamzty (#105).
  - Editing an extrude's draft angle no longer fails with "NCollection_Sequence::Value" when its profile has a loose
    sketch line lying inside it. Thanks @richcourt (#103).
  - The origin axes stay put while you move around instead of flickering out on some graphics cards. Thanks
    @micide0606 (#104).
  - ShapeCraft shows its own icon on Windows: in the Start menu, the taskbar, Explorer and the program's Properties,
    instead of the blank program icon. Thanks @molumen (#106).

  Alpha: keep copies of anything important. ShapeCraft updates itself from here on: it downloads new
  versions in the background and installs them when you close it.
  Mac: download the -macos-universal.dmg (Apple silicon and Intel). The two autoupdate-only
  copies are the same file, there for copies of ShapeCraft up to 0.8.5 to update from.
  First launch: macOS asks once: System Settings ▸ Privacy & Security ▸ Open Anyway.
  Windows on Arm (Surface and other Snapdragon PCs): the -windows-arm64 MSI or portable zip, when present.
  Windows SmartScreen: More info ▸ Run anyway. Linux: make the AppImage executable, then double-click it,
  or install the .deb (Debian, Ubuntu) or .rpm (Fedora, openSUSE) package.
  Android (test build, arm64, Android 8.0+): open the APK on the device and allow installs from that app.
  A copy installed from an earlier test build (debug-signed) has to be uninstalled once first.
  iPhone (test build, iOS 17+, iPhone Duo included): sideload the -ios-arm64.ipa with AltStore,
  Sideloadly or a similar tool, signed with your own Apple account (a free one re-signs every 7 days).
  Or build it from source: docs/ios.md.
  Check a download against SHA256SUMS.txt: shasum -a 256 FILE (macOS, Linux) or Get-FileHash FILE (Windows).
