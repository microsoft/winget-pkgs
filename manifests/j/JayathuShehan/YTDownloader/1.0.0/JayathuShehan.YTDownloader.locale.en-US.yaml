ShortDescription: Fast multi-connection YouTube downloader with pause/resume, a CLI and a local web UI.
Description: |-
  YTDownloader downloads YouTube videos (up to 4K) and audio (M4A, Opus or MP3) using several parallel connections per stream, similar to a download manager.
  Downloads can be paused and resumed, even after closing the program.
  Use it from the command line with "ytd -url", or open a local web UI in your browser with "ytd -ui".
