ReleaseNotes: |-
  pi Desktop v0.7.3
  新增
  - 内置终端：按 Ctrl+`（或点状态栏右下角的终端图标）从聊天区下方拉出终端，可拖动调整高度；支持多标签，每个标签最多左右并排 4 栏，分隔线可拖动调宽，分栏时可用每栏的 ✕ 或 Ctrl+Shift+W（macOS 为 ⌘W）单独关闭一栏；收起后进程和输出都还在，已退出的终端按 Enter 原地重启。默认使用 pi 执行命令时用的同一个外壳（Windows 上为 Git Bash），PATH 里带上 pi 自带的工具；也可以从「+」菜单选择 PowerShell 7、Windows PowerShell、命令提示符、各个 WSL 发行版，或 zsh、fish 等。GPU 渲染、配色跟随主题，中文和 emoji 对齐；Ctrl+Shift+C / V 复制粘贴，有选区时 Ctrl+C 也是复制，Ctrl+Shift+F 查找，链接可点击；粘贴图片会存成文件并输入路径；选中的输出可以一键放进输入框。还有终端在运行时关闭窗口会先确认
  - 用量页：「设置 → 用量」统计本机所有 pi 会话的 token 与费用（终端 pi 的会话和自定义 sessionDir 也算在内，复制进分叉会话的回复只计一次），可选今天、7 天、30 天、90 天、一年或全部：总费用、token、请求数、缓存命中率、日均与单次平均、有使用的天数、费用最高的一天；按天的输入 / 缓存 / 输出堆叠柱状图（悬停可看每一层的占比，图例可开关），日历热力图和按星期 × 小时的热力图，以及按模型、按项目、费用最高的会话排行，点击会话可直接打开。费用按模型条目里设置的价格计算
  - 手机在外网也能连：电脑和手机加入同一个 Tailscale、ZeroTier 或 WireGuard 网络后，离开家里或办公室的局域网也能连接。二维码会带上组网地址（包括 macOS 上的 Tailscale）和 Tailscale 的 *.ts.net 域名；手机的主机列表可以手动添加地址；「设置 → 手机连接」会标注每个地址是局域网还是组网
  - 手机查看改动：会话面板的「改动」查看整个工作区相对上次提交的改动，点回复下方的文件可查看本轮对它的改动；diff 带行号和增删底色。长按某一行开始选择，点其他行扩大范围后写批注，可以写多条，最后一起放进输入框，不会自动发送
  - 手机端分支与分叉：会话面板的「分支」列出回退或改写后留下的各个分支（最后的提问和回复、轮数、从哪里分出），点一下就能切换；长按自己的消息选择「从这里分叉」，会在新会话里接着这条之前的内容继续
  - 手机会话费用：会话面板显示本会话的累计费用和请求数
  - 分支切换：状态栏左侧显示当前项目的分支、未提交改动和领先 / 落后数；点开可以搜索本地和远端分支、切换或新建分支（命令面板里也有「切换分支…」）。改动能带过去时直接带到新分支；会被覆盖时可以先暂存，回到原分支时提示恢复。项目里有会话在运行时会先确认
  - 主题重做：外观设置改为预设卡片，新增内置 Claude 主题（浅色暖米白、深色暖炭灰，标题和回复用衬线体）。可单独设置侧栏、聊天区、你的消息、代码块、边框的颜色，标题 / 回复字体，聊天字号和行高，圆角和阴影；这些都是 CSS 变量，自定义 CSS 旁边列出了可用变量。主题字符串会带上这些新设置
  - 背景图：「设置 → 外观 → 背景图」可以在窗口后面放一张图片，浅色深色分开或共用。图片可调强度、模糊、亮度、饱和度和暗角，以及适配方式；面板可选磨砂、液态玻璃或通透三种材质，并调整不透明度和模糊。默认聊天区和右侧栏几乎不透明，打开「透出整个界面」后背景会透过所有面板；还可以单独调整聊天区和右侧栏的不透明度、材质和模糊。菜单、弹窗和代码块始终保持不透明
  - 手机 App 语言：默认英文、跟随系统语言，菜单里可以单独选「跟随系统 / English / 简体中文」；Android 13 及以上与系统的「应用语言」设置同步
  优化
  - 手机 App 发布：APK 改为在 CI 中构建并正式签名，安装包 pi-remote-0.7.3-android-arm64.apk 与桌面安装包一起附在本版 Release 中，并列入 SHA256SUMS
  - README：重新整理，补充内置终端、分支、用量、主题与背景图、手机 App 的演示
  修复
  - CI：Windows 检出时，行尾差异不再导致构建产物检查失败；分栏的端到端测试与当前布局一致；Node 25 及以上版本可直接运行单元测试
  - 依赖安全：升级了一批有安全修复的依赖
  - 手机会话面板刚配对后偶尔为空：现在会等连接就绪并自动重试
  - 手机端展开待办列表时会把对话往上推：现在列表浮在对话上层，按返回键可收起
  注意
  - 手机 App 需要卸载重装：手机 App 从调试签名改为正式签名，从 0.7.1 升级时需要先卸载旧版再安装新版，然后重新扫码配对；以后的版本可以直接覆盖升级
  - 手机 App 和桌面端请同时升级到 0.7.3，查看改动、分支与分叉、会话费用等新功能需要两端版本一致
  - 在外网使用需要两端都装好并登录同一个组网工具；pi 不提供中继服务器，也不支持直接连公网地址

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
