ReleaseNotes: |-
  pi Desktop v0.7.1
  新增
  - 手机远程控制（pi Remote，Android）：在「设置 → 手机连接」打开后，用手机 App 扫码配对，即可在同一局域网内查看和继续驱动电脑上的会话。连接全程端到端加密，不经过任何服务器；可给设备设为「可操作」或「只读」，随时解绑。安装包 pi-remote-0.7.1-android-arm64.apk 附在本版 Release 中
  - 手机端会话：会话列表可按状态或项目分组，最近的会话分为今天、昨天、本周、更早；临时对话单独归为一组。时间线与桌面一致：思维链可展开、工具调用和文件改动、Markdown 与代码高亮、公式（原生排版，与桌面支持的写法相同）、Mermaid、pi-ui 图表，右侧刻度可拖动跳转
  - 手机端输入：切换模型和思考等级（滑块），按会话开关工具与能力；可拍照、选图或选文件作为附件，也能从其他 App 分享内容进来；运行中发送即 steer，长按发送键排队 follow-up
  - / 命令与 @ 文件：/ 按键打开命令面板（应用 · 提示词 · 扩展命令，Skills 单独折叠），行首输入 / 时自动联想，选中后只插入不发送；@ 按键打开当前项目的文件浮窗，支持逐级浏览、搜索、多选，插入为 @路径
  - 手机端中断与回退：停止时排队中的消息自动放回输入框，也可以只撤回队列；长按消息可「回退到这条之前」，该轮及之后移出当前分支，原消息放回输入框，电脑端会同步刷新
  - 会话面板：在对话页向左滑出侧面板，显示运行状态、上下文占用（按系统 / 用户 / 助手 / 工具分段）、轮次、工具调用、文件改动、待办和排队
  - 提问与通知：扩展提问在手机上可直接作答（多题导航、单选自动下一题、稍后作答）；任务完成、失败或需要回答时发通知，点开直接进入该会话
  - 其他：深色 / 浅色 / 跟随系统主题；已配对设备换了网络地址也能自动重连，无需重新扫码
  修复
  - 新建对话：新对话草稿正确显示保存的默认模型；新建后的第一条消息始终发到刚创建的会话
  - 时间线：手动刷新后丢弃已结束的实时缓存；重试成功的回复不再显示「未完成」提示
  注意
  - 手机 App 目前只提供 Android（arm64）版本，使用调试签名，安装时系统可能提示来源未知；需要电脑和手机在同一局域网，Windows 首次使用需在防火墙中允许 pi Desktop 访问专用网络
  - 手机和电脑需同时升级到本版，旧版 App 与新版桌面端的协议不兼容
  - 本版通过 Linux 自动化检查与 Android 模拟器验证；真机和 Windows / macOS 实机检查未完成

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
