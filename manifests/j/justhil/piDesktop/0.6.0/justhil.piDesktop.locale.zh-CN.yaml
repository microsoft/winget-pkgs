ReleaseNotes: |-
  pi Desktop v0.6.0
  新增
  - 结构化回复：支持图表、表格、指标、卡片、代码差异、决策树、测验和甘特图，可直接在对话中查看和交互
  - 按项目覆盖适配器：内置、用户与项目适配器分层加载，支持不绑定插件的只读面板；项目切换时不会混入旧项目结果
  - 模型思考等级：按模型能力绑定思考等级，支持 max
  修复
  - #100 返回设置后模型显示错误：按当前会话读取实际模型，并保留该会话已确认的模型信息，不再误显示全局默认模型
  - #99 后台会话完成后显示旧内容：切回已完成会话时刷新历史，正确合并实时内容，保持工具结果和最终回复顺序，无需手动刷新
  - #97 Intel Mac 下载错误安装包：应用内更新按处理器架构选择安装包，Intel 与 Apple Silicon 不再混用
  - #94 删除会话后输入框偶发失去焦点：删除确认改为应用内对话框，避免 Windows 原生确认弹窗导致后续键盘输入失效
  - #46 查看历史误触回退：会话树单击只定位对应消息，双击或明确操作才回退，查看与修改分开
  - 会话身份错位：加载失败或被扩展取消时保留原会话；分叉、克隆等待期间切换会话，不会把结果分配给新选中的会话
  - 会话删除与并发请求：删除已绑定会话后清理旧身份；删除离线会话不启动 Agent；同一冷会话的并发请求只创建一个 Worker
  - 文件范围检查：拒绝跨盘、跨共享和经符号链接访问工作区外文件，保留合法预览、UTF-8 截断与图片大小限制
  - 预览进程故障：进程终止时结束其全部待处理请求；无响应 Worker 的停止请求使用短等待期限
  - Git 暂存与工作副本刷新：差异块异步写入，同一索引的操作按顺序执行；监听工作副本真实元数据目录
  - WSL 模型隔离：WSL 预览失败时不会回退到宿主模型与认证信息
  - 干净检出的测试：结构化回复测试样例随仓库提交，不再依赖本机未跟踪的文档
  优化
  - 启动与会话切换：延后 SDK 预热，独立进程读取模型和历史；会话列表增量读取，流式事件合并发送
  - WSL 启动准备：代码同步、SDK 探测和会话列表异步处理，共用文件按发行版顺序写入
  - 大型目录：目录先排序截断，再读取最多 2500 项元信息，减少主线程同步文件操作
  - 设置与文档：调整模型、运行时设置和 Review 界面，更新双语 README、真实截图与一键截图流程
  注意
  - Review 已移除生成提交信息的入口
  - 从 0.5.8 或更早版本升级的 Intel Mac 用户，请手动下载 x64 安装包；旧版本的应用内下载选择逻辑仍可能误选 arm64
  - 本版仍不开放远程客户端或手机配对；子 Agent 详细视图依赖对应插件适配器提供进度与会话信息
  - 本轮后端收尾通过 Linux 自动化检查与真实 Electron 验证；Windows/WSL 实机检查未完成，不代表跨平台完全验收
  - WSL 下 pi-rewind 的跨盘 Git 快照耗时未在本轮处理；停止仍可能等待已在进行的启动任务

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
