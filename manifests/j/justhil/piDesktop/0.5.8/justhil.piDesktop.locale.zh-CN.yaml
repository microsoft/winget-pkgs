ReleaseNotes: |-
  pi Desktop v0.5.8
  新增
  - 工作台状态底栏与通知收件箱：底部显示在跑会话、内存和更新；完成通知可回看，支持未读加粗与快捷聚焦最新通知
  - 会话四态与子会话树：侧栏用工作中 / 等你 / 已完成 / 空闲区分会话，并按 Pi 父子关系折叠显示子会话
  - 工作副本分组：已有 git 工作副本按仓库分组显示，便于从侧栏继续对应会话
  - Files 预览与行评打回：大文件可先看前缀再按需加载；Git 中文路径正确解码；Review 行评可发给当前会话
  - 设置搜索与快捷键：设置页可搜索分类；完成通知支持独立快捷键
  修复
  - 设置页无法打开：中英文设置文案缺逗号导致类型检查和前端启动失败
  - 后台扩展问答清不掉：后台会话超时或取消后，弹窗和等待状态会正确关闭，不再挡住前台
  - 跨项目继续会话错位：从侧栏右键继续其他项目的会话时，会同时切到该项目，Files 与 Git 不再留在旧项目
  - 文件夹内搜索整树为空：在文件夹中搜索不再把祖先目录滤掉
  - 新建文件点了没反应：Electron 不支持系统 prompt，已改为应用内对话框，并阻止经符号链接写出工作区
  - 新会话 Review 发到旧对话：点了新会话后再发送行评，会先创建真实会话，而不是打到前台旧 Worker
  - 已完成会话点开仍加粗：打开会话后清除未读完成标记
  - 设置高级项打不开：会话进程高级设置的展开按钮不再被空分区样式藏掉
  - 大文件与 HTML 预览：超限文本返回前缀而不是直接拒绝；完整 HTML 才允许脚本，且不同源隔离
  优化
  - 侧栏项目身份：Git 工作副本与最近项目按真实目录过滤，避免把已删除或可清理的检出算进当前仓库
  - 语音按住说话：按住录音时不会叠两个麦克风流
  注意
  - 手机配对入口仍未开放，本版不包含遥控客户端
  - 工作副本只识别本机已有 git 检出，不会自动创建隔离目录

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
