ReleaseNotes: |-
  pi Desktop v0.7.8
  新增
  - 单会话人设注入（参考 agent-purge）：输入框工具栏新增「人设」开关，支持为当前新对话首轮独立启用人设注入并在发送后自动锁定，不修改全局配置；「设置 → 人设注入」提供换身份 / 追加 / 只留人设三种改写模式，内置 agent-purge 预设模板与自定义人设库管理
  - 光学渲染引擎与实时外观调校：内置悬浮层真边缘折射「液态光学（Liquid Glass）」、硬件高光微倒角（Bevel）、程序化底衬场（微光 / 点阵 / 网格 / 颗粒）以及 Windows 11 云母/亚克力、macOS Vibrancy 原生窗口材质；支持切换工作台构图（纸面 / 悬浮岛 / 锐利平铺）、消息版式（右侧气泡 / Amp 左标通栏 / 独立卡片）、对话阅读列宽与 15 套按需加载 Shiki 语法高亮；新增 Amp、液态光学、Linear、Rosé Pine、Tokyo Night 内置主题、本地主题包库（支持导入/导出 .json）、支持 /* @settings */ 自动生成滑杆与色盘的 CSS Snippets，以及可在聊天界面侧边边调边看的「实时外观调校」悬浮面板
  - 用量日志与本地原文排查：用量页新增对标 AxonHub 的 TTFT（首字延迟，桌面端零新文件直接写入原会话 .jsonl）、流式/端到端吞吐（TPS）、缓存读写命中率及分项成本统计，并提供多维筛选、可排序分页请求日志（含页码直跳）与侧滑详情抽屉，直接基于本地 .jsonl 原地还原当次请求的完整上下文与回复原文
  - 活跃会话抽屉与工作区能力：侧栏底部新增可拉起的「活跃会话」抽屉（集中查看运行中、未读及近 1 小时会话）；支持项目自定义别名与 Git worktree 管理；内置浏览器支持按会话隔离标签页、多标签固定阅读及登录兼容；新增原生 codemode 工具预览、嵌套 edit/write 行数统计及自动重试状态提示；远程控制支持自选公网端点（FRP / 端口转发）配置
  优化与修复
  - 时间线交互与崩溃收口：自动折叠中断、报错、用户插话及无正文纯工具轮次，新轮次启动时不再误将历史中断空节点显示为加载骨架；点击代码块即激活独立滚动，收紧失败/中止后的状态收敛
  - Review、Tree 与背景透光：修复从「活跃会话」跨项目切入后无法查看 Review 的问题，补齐超 80 条消息长会话与未跟踪新目录的本对话改动统计；修复 Tree 面板报错状态粘滞与窄栏工具栏文字遮挡、徽标截断问题；修复开启自定义背景图时被程序化底衬遮挡及多层高不透明度叠加偏灰的问题，放宽面板不透明度至 15% 并支持设置页实时透光预览；修复 Pi 1.5+ SDK 路径识别、Windows 锁文件噪音、箭头图标方向及多处跨会话状态竞态

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
