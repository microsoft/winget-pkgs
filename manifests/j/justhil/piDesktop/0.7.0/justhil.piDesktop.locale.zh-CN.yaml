ReleaseNotes: |-
  pi Desktop v0.7.0
  新增
  - pi 1.0 内核：内置 pi 升级到 1.0.2。桌面会话现在也能用上 pi 的 codemode、工具搜索和 MCP（之前 SDK 会话不会加载它们）
  - MCP 设置页：添加、编辑、删除 MCP 服务器，支持从 Claude Desktop / Cursor / VS Code 的配置直接粘贴导入；可设置暴露方式（codemode / 按需加载 / 直接 / 隐藏）、全局或仅本项目启停；一键检查连接状态（工具数、错误原因），HTTP 服务器可在设置里完成 OAuth 登录和退出
  - 模型编排：在「设置 → 模型编排」用画布搭建虚拟模型 router/<id>：可选分类模型（如 TypeSafe Jev）把会话分到不同分支，每个分支指定模型和思考等级；另有默认分支、「首次编辑后切到更便宜的模型」、「失败时换模型重试」。画布上方用一句话说明当前路由逻辑，未选模型的节点会直接标出
  - 会话分栏：像 tmux 一样把多个会话放在一起看，最多 4 个：左右、上下、主窗格加侧栏、四宫格都可以。Ctrl+\ 向右拆、Ctrl+Shift+\ 向下拆，Ctrl+Alt+方向键在窗格间移动；拖分隔线会在 1/3、1/2、2/3 处吸附并显示比例；把会话拖到窗格边缘会预览新窗格的位置，拖窗格标题到另一个窗格中间可交换位置；较小的窗格显示状态卡片（运行状态、最后的问题和回复），太窄时自动切成标签
  - 时间线刻度：对话右侧的刻度标出你的每条消息，悬停预览、点击或拖动跳转，Alt+↑/↓ 逐条切换；当前位置按你正在读的消息高亮
  - 按轮次折叠历史：长对话默认只显示最近 10 轮（你的消息及其回复），向上滚动再加载；轮数可在「设置 → 外观」调整
  - 内置浏览器（实验）：在「设置 → 右侧面板」打开「浏览器」栏目后，可在右侧栏浏览网页：多标签、地址栏（网址或搜索）、地址建议与历史、后退 / 前进 / 刷新、页内查找（Ctrl/⌘+F）、缩放、固定视口尺寸，还能展开到聊天区；登录状态保存在独立的浏览器配置里，可一键清除。下载可用 aria2 多线程（可选），工具栏有下载列表
  - AI 操作浏览器：在「工具」菜单开启「浏览器操控」后，AI 可以读取和操作内置浏览器。工具与 Playwright MCP 一致（共 21 个：点击、输入、填表、拖拽、上传、滚动、查找、截图、存 PDF 等）；页面快照沿用 Playwright 格式，每次操作只返回变化部分；所有点击和键盘都是真实输入。默认只常驻 6 个常用工具，其余由 AI 按需加载，省 token
  - 把网页交给 AI / 网页批注：浏览器工具栏可把截图、页面正文、选中文字、控制台和网络错误放进输入框；批注模式（Ctrl/⌘+Shift+A）下点选元素或框选区域写评论，完成后把带编号的截图和元素信息插入输入框，本地开发页面会附上组件名和源码位置
  - 「工具」菜单：按会话开关附加能力（pi-ui 可视化、浏览器操控），新会话默认全部关闭，菜单标出每项每次请求增加的 token；底部是「缓存保活」快捷开关（关闭 / 运行时 / 空闲也保活）
  - 运行时设置：新增「工具」区（默认启用哪些内置工具、codemode、工具搜索）、思考预算、按模型单独设置压缩预算
  - 模型条目：分组为基本、能力、价格（输入 / 输出 / 缓存读取 / 缓存写入，美元每百万 token）、提示词缓存（缓存寿命、是否接受对话中途的系统消息）和高级（采样参数及按思考等级覆盖、图片输入上限、OpenAI 兼容接口的兼容项）
  - 输入框改版：模型和思考等级改为向上展开的菜单，思考等级改成滑块，等级名在各语言下都用英文；todo 贴在输入框顶部；上下文用量改成发送按钮旁的小圆环
  - 状态栏内存：右下角显示应用当前占用的内存
  优化
  - 能力开关不再打断缓存：开关能力时，对支持「对话中途系统消息」的模型只在对话后面追加一条更新，已缓存的提示词前缀保持不变
  - 设置页：页面底色与卡片分层更清楚，次要文字和边框加深一档，统一输入框和分段选择样式；删掉设置项下方的英文键名、终端专用选项和重复说明，文案更短
  - 模型页：内置供应商改为紧凑列表，已登录的排在前面；模型折叠时一行显示能力、上下文和价格
  - 右侧栏：默认收起，可在设置里选择收起时保留图标栏
  - 侧栏：项目标题旁的加号用来打开文件夹，原刷新按钮合并到右上角
  - 其他：标签栏支持滚轮横向滚动，中键关闭标签；批注模式滚动更顺滑；工具调用按规则折叠；会话树改为分段筛选；深色模式下各分段选择的选中状态更清楚
  修复
  - token 估算：能力增加的 token 数计入工具定义，与实际请求一致
  - 时间线刻度：从磁盘打开的旧会话也能正确跟随阅读位置；滚到底部时高亮最后一条
  - 分栏：窗格始终铺满中间区域
  - 内置浏览器：中键不再把剪贴板内容粘进地址栏；切换标签时地址栏草稿复位
  - 界面：几处提示文字因缺少颜色定义显示为纯黑的问题
  注意
  - MCP、codemode、工具搜索和模型编排需要 pi 0.99 及以上（内置版本为 1.0.2）；WSL 运行模式暂不支持 MCP 管理
  - 「浏览器操控」需先在「设置 → 右侧面板」开启「浏览器」栏目
  - 「开关不打断缓存」取决于模型是否支持对话中途的系统消息；内置目录里的 Anthropic、OpenAI、GitHub Copilot 等多数模型支持，自定义模型可在模型条目的「提示词缓存」里开启
  - 本版通过 Linux 自动化检查与真实 Electron 验证；Windows / macOS 实机检查未完成

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
