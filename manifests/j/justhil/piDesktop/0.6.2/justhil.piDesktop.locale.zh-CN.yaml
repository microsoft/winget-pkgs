ReleaseNotes: |-
  pi Desktop v0.6.2
  新增
  - Mermaid 图表：回复中的 mermaid 代码块渲染为流程图、时序图等图表，颜色跟随浅色 / 深色主题；生成过程中先显示源码，语法有误时显示源码和错误原因，也可随时切换查看源码
  - 扩展提问对话框：顶部题目导航显示作答状态并可直接跳题；单选后自动进入下一题，最后一题不会误触即提交；「其他」作为独立选项填写自定义答案；支持数字键选择、Enter 下一题或提交；「稍后作答」再继续时保留已填内容
  修复
  - LaTeX 公式：\[ … \] 与 \( … \) 写法的公式正常渲染，不再显示成方括号加公式源码
  - 默认界面语言：首次启动按系统语言选择，非中文环境默认英文；已有用户的语言设置保持不变
  - 英文界面残留中文：会话树、分叉对话框、行引用按钮、扩展对话框、MCP 与技能面板、工具卡片及内置适配器说明均已本地化
  - 工具输出颜色码：会话树与 Context 预览不再显示 ANSI 颜色控制字符
  - 连续提问串状态：扩展连续发起提问或输入请求时，新对话框不再带上一次的选择和输入
  - 依赖安全：更新 Electron、HTML 清理及网络请求等依赖的安全修复版本，Pi SDK 版本保持不变
  - 字体依赖：直接使用仓库内的字体和许可文件，移除多余字体包及其间接引入的 Next.js
  - 发布检查：正式发布前执行依赖安全审计，严重漏洞或审计失败时不创建 Release
  优化
  - 扩展对话框：选择、确认、输入对话框支持键盘操作和自动聚焦，确认内容改为正文字号显示
  - README：新增功能总览图、架构图和更多真实应用录屏，中英文同步
  注意
  - Mermaid 首次出现时按需加载，之后的图表即时显示
  - 本版通过 Linux 自动化检查与真实 Electron 验证；Windows / macOS 实机检查未完成

  安装包见本页 Assets。更新说明以本正文为准（应用内「发现新版本」弹窗会展示）。
