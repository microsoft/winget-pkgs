ShortDescription: Run AI coding agents in parallel, each in its own git worktree.
Description: |-
  Yardsort is a desktop app that gives every task its own git worktree and its own terminal,
  running the coding agent of your choice - Claude Code, Codex, Grok, OpenCode or any other
  terminal agent. Watch each agent's changes live with diffs, resume or fork conversations,
  and keep parallel work from colliding. Requires Git for Windows and at least one agent CLI.
