ReleaseNotes: |-
  - Feature: Support for CPS components configurations. (#20354)
  - Feature: Use extra_info to provide CPEs to the component. (#20353)
  - Feature: Download recipe and package metadata in parallel with regular files instead of after them. (#20351)
  - Feature: Add core.net.http:trust_store conf to verify HTTPS certs against the OS trust store. (#20343). Docs: 📃
  - Feature: New remotes force_auth capability. (#20341). Docs: 📃
  - Feature: Feature: Add copy_config_files to the [runner] profile to copy extra host config files into Docker runners. (#20332). Docs: 📃
  - Feature: Support Clang 23. (#20330)
  - Feature: Support Apple OS 27.0. (#20330)
  - Feature: CMakeConfigDeps.get_cmake_file_name returns a dict object instead of a string. (#20300)
  - Feature: Allow cpp_info.sources-only packages in CMakeConfigDeps. (#20297). Docs: 📃
  - Fix: Remove support for Python 3.7, EOL since 2024. (#20357)
  - Fix: Error messages inside the source(), generate() and package() steps missing the package reference. (#20348)
  - Fix: Add support for CMakeConfigDeps for cpp_info.objects imported object libraries. (#20347)
  - Fix: Do not force DebuggerFlavor from generated prop files in MsBuildDeps, it's already the default. (#20340)
  - Fix: Only spawn min(threads, download_count) threads in parallel downloads. (#20335)
  - Fix: Split skipped binaries summary per host/build/test group. (#20326)
  - Fix: Avoid CMakeDeps generating empty generator expressions, improving performance. (#20322)
  - Fix: Propagate errors from a .bat script called by another .bat script. (#20317)
  - Fix: Prioritize host and visible nodes in workspace monolithic builds when ambiguity arises. (#20305). Docs: 📃
  - Fix: Implements the find_package verbosity level in CMakeConfigDeps. (#20275)
  - Fix: Do not inject a full lockfile due to export operations. (#19404)
  - Bugfix: Fix conan graph build-order --update ignoring the --update flag. (#20356)
  - Bugfix: Consider a server revision found via --update as latest, even if its prev isn't latest locally. (#20336)
  - Bugfix: Correct computation of options in the conan graph build-order command. (#20331)
  - Bugfix: QbsDeps dependency names now match pkg_config_name/qbs_file_name. (#20329)
  - Bugfix: Avoid reporting the cached username when authentication was attempted with a different user. (#20316)
  - Bugfix: Limit propagation of cpp_info.sources from INTERFACE_SOURCES to only direct dependencies. (#20297). Docs: 📃
  ⚠️ Under Review
  - Bugfix: conan graph build-order now honors --update when resolving version ranges (same as graph info / install) (#20350) (Main PR not merged)
