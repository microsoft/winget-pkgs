ReleaseNotes: |-
  - Feature: Add basic LoongArch64 architecture support and host detection. (#20288)
  - Feature: Add support for Xcode 2.26. (#20280)
  - Feature: Add support for gcc 16.2. (#20280)
  - Feature: Parse reference attributes from --ref in workspace add. (#20269)
  - Feature: Add raise_on_errors=True arg to CommandAPI.run, it now raises on all errors returned by commands. (#20266)
  - Feature: XcodeToolchain now accepts arbitrary extra xcconfig settings via tc.build_settings, for build settings with no dedicated conf. (#20256). Docs: 📃
  - Feature: conan workspace open with no arguments will read the conanws file and try to open the defined references there into their respective folders if they are not present. (#20247). Docs: 📃
  - Feature: conan workspace open and conan workspace add --ref learned a new --folder argument to indicate the relative location wrt the workspace root for the cloning of the repository. (#20247). Docs: 📃
  - Feature: Add architecture_bits build helper to detect when the target architecture is 64-bit. (#20246). Docs: 📃
  - Feature: Compute CMAKE_Swift_COMPILER_TARGET in CMakeToolchain for Apple Swift cross-builds. (#20243). Docs: 📃
  - Feature: Add recipe_metadata()/package_metadata() API to download metadata to a user folder. (#20240). Docs: 📃
  - Feature: Improve source step output. (#20234)
  - Feature: Make conan report diff -f=html use a dark theme by default. (#20229)
  - Feature: Add package_type_traits attribute to force requirement traits by package_type (run only for now). (#20228). Docs: 📃
  - Feature: Add --ref argument to conan editable add <path> as a shortcut to define name, version, etc. (#20218)
  - Feature: Feature: Allow copy() to accept multiple patterns, also used by exports/exports_sources, for speedup. (#20217). Docs: 📃
  - Feature: Add qbs_file_name property to override the generated Qbs module name and avoid collisions. (#20215). Docs: 📃
  - Feature: Allow conan run without a conanfile to run executables from the profile's [tool_requires]. (#20214). Docs: 📃
  - Feature: Rework the conan graph build-order HTML formatter with search and full offline support. (#20174)
  - Feature: Populate the download cache with uploaded artifacts if core.download:download_cache is set. (#20163). Docs: 📃
  - Feature: Accept CMake 4.4 --preset-file presets generated outside the CMake root. (#20158). Docs: 📃
  - Feature: Add !settings.build_type syntax to exclude build_type from cmake_layout's build_folder_vars. (#17331). Docs: 📃
  - Fix: Do not force CONFIG requires for transitive dependencies in CMakeConfigDeps. (#20283)
  - Fix: Correct a typo in the CycloneDX component recipe revision. (#20271)
  - Fix: Failed creates in workspace subcommands now raise errors as expected. (#20266)
  - Fix: Add support for python requires in remotes for conan workspace create. (#20265)
  - Fix: Add support for lockfile reading in conan source for Python requires. (#20264)
  - Fix: Generate valid CycloneDX SBOMs for recipes without a description attribute. (#20263)
  - Fix: Match the dll.a extension (MinGW) in deduce_full_cpp_info. (#20259)
  - Fix: Make test_linker_script test resilient to the exact linker error text, which changed with Meson >= 1.12. (#20257)
  - Fix: XcodeToolchain's extra flags (tools.build:cflags/cxxflags/ldflags/defines) no longer get overwritten when installing more than one configuration for the same project. (#20255). Docs: 📃
  - Fix: Correct filename parsing in conan report diff -f=html for non-ASCII filenames. (#20229)
  - Fix: Remove the Vigenère cipher used to store JWTs, since it provided no real security benefit. (#20227)
  - Fix: Improve copy() performance when using lists of patterns. (#20226)
  - Fix: Warn when tools.build:compiler_executables keys are unknown or unused by CMakeToolchain/AutotoolsToolchain. (#20219). Docs: 📃
  - Fix: Add objc, objcpp and asm as tools.build:compiler_executables for AutotoolsToolchain. (#20219). Docs: 📃
  - Fix: Make conan lock upgrade-config's path argument point to a conanconfig.yml file, not a conanfile.py. (#20208). Docs: 📃
  - Fix: Remove the deprecated --order-by behavior and empty version ranges, as planned for Conan 2.32. (#20207). Docs: 📃
  - Bugfix: intel-cc default compilers on Windows. Classic mode now defaults to icl (not icc/icpc), icx mode to icx (not icx-cl, which is absent in older oneAPI), and CMakeToolchain now honors CC/CXX from [buildenv] over the hard-coded defaults. (#20233)
  - Bugfix: Keep the local recipe index cache folder when conan remote add fails on a duplicate without --force. (#20210)
  - Bugfix: Make CMakeConfigDeps generate common files only for the host context, avoiding lost CMake variables. (#20198)
