ReleaseNotes: |-
  A few bug fixes for regressions introduced with the last release, and also some for older bugs.
  One visible change is that the narrow selection bar in the focused diff view is now shown on both sides of the view rather than just on the left. This should improve usability for users with very large monitors, especially when using a side-by-side diff renderer.
  For the changes of the last big release, see v0.66.0.
  The changes in detail

  Enhancements 🔥
  - Allow scrolling the diff view horizontally when gui.wrapLinesInDiffView is off by @stefanhaller in #6109
  - Show the diff view's narrow selection bar on the right edge too by @stefanhaller in #6105

  Fixes 🔧
  - Fix staging diff hunks when the diff.mnemonic git config is true by @stefanhaller in #6099
  - Show errors for unresolvable diff lines by @stefanhaller in #6100
  - Fix double-width characters in the last column drawing over the view's frame by @stefanhaller in #6106
  - Fix search match highlighting when a custom patch is active by @stefanhaller in #6107
  - Open files of a branch's diff from the worktree that has it checked out by @stefanhaller in #6104
  - Don't log the diff renderer probe in the command log by @stefanhaller in #6112
