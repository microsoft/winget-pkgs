ReleaseNotes: |-
  What's Changed

  Enhancements 🔥
  - Improve display and handling of deleted submodules and nested repos/worktrees by @stefanhaller in #6134

  Fixes 🔧
  - Fix diff rendering after scrolling far down by @stefanhaller in #6120
  - Make double-click detection more precise by @stefanhaller in #6123
  - Exit gracefully when a repo or worktree gets deleted from under lazygit by @stefanhaller in #6129
  - Fix "Jump to File" menu showing only half of the entries, in some rare cases by @stefanhaller in #6136

  Maintenance ⚙️
  - Restore the terminal more reliably after a panic by @stefanhaller in #6124
  - Bump github.com/xo/terminfo from 1.0.0 to 1.2.0 by @dependabot[bot] in #6053
  - Bump go version to 1.26 by @stefanhaller in #6137
  - Bump golang.org/x/sys from 0.47.0 to 0.49.0 by @dependabot[bot] in #6125
  - Bump golang.org/x/sync from 0.22.0 to 0.24.0 by @dependabot[bot] in #6127
  - Bump github.com/cli/go-gh/v2 from 2.13.0 to 2.16.2 by @dependabot[bot] in #6128
  - Bump github.com/gdamore/tcell/v3 from 3.5.0 to 3.6.0 by @dependabot[bot] in #6126

  Performance Improvements 📊
  - Improve performance with very long diffs by @stefanhaller in #6121
