ReleaseNotes: |-
  ## What's Changed

  <img width="2526" height="1570" alt="image" src="https://github.com/user-attachments/assets/318f33ac-1bfe-4be0-91ba-b1ce9e46affe" />

  • Support Audio by @TheJoeFin in https://github.com/TheJoeFin/Text-Grab/pull/677
    • Live from microphone or system audio
    • Drop an audio file onto the Edit Text Window to transcribe
  • Proj structure by @TheJoeFin in https://github.com/TheJoeFin/Text-Grab/pull/681

  <img width="1756" height="1154" alt="image" src="https://github.com/user-attachments/assets/ed310588-c939-48e5-80d8-d6f73654df7c" />

  • Improved local AI capabilities
    • More robust translation and summarization
    • Better error catching
    • Ability to reset the model
  • Better support around Tables
    • Repeated adding of new lines to spreadsheet mode
    • Grab tables from PDFs
    • Multi-page grab on PDFs
  • Added Camera Capture to Grab Frame

  <img width="440" height="288" alt="image" src="https://github.com/user-attachments/assets/ecccf84f-7f12-4104-b30c-ca24ab01c9ba" />

  • Add monochrome tray icon option
  • Fix Latin correction for non-Latin OCR languages by @NgoQuocViet2001 in https://github.com/TheJoeFin/Text-Grab/pull/670


  ## New Contributors
  • @NgoQuocViet2001 made their first contribution in https://github.com/TheJoeFin/Text-Grab/pull/670

