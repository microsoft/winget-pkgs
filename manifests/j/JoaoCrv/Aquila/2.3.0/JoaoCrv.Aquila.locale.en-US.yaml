ShortDescription: A free, open-source Windows hardware monitor, with desktop widgets you design.
Description: |-
  Aquila shows what your hardware is doing - CPU, GPU, memory, storage, network, fans and power - in a responsive dashboard, and on your desktop as widgets you design.
  Desktop widgets (dials, lines, bars, numbers, text, a clock) are arranged and styled in a docked editor over your real wallpaper. Themes dress the app: Aquila, or Fluent with your Windows accent, in light or dark. Presets dress the data, and can be edited and shared as files. Limits you set decide when a reading turns high or critical, and a notices panel says what is wrong.
  Built on LibreHardwareMonitor. Free and open source, with no ads and no telemetry.
