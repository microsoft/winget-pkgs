ShortDescription: 开源办公套件，在一个应用里处理文字、表格、演示、PDF、Markdown、代码和 HTML 富文本。
Description: |-
  Weave Office 是用 Rust 开发的开源桌面办公套件，把文字、表格、演示、PDF、Markdown、代码和富文本收进同一个应用：一条文件标签栏混排各类文档，新建、打开、保存、自动保存、崩溃恢复和打印都由同一个宿主统一管理。
  文字支持段落与字符格式、样式、表格、图片、页眉页脚、分页和 WMF/EMF 图片；表格支持多工作表、公式、单元格格式、边框与合并，并可导出 PDF 与 CSV；演示支持幻灯片、形状、文本框、图片与版式，支持放映和导出；PDF 可以直接修改已有正文和图片、添加批注和文字，以及插入、删除、重排、旋转、裁切、提取和拆分页面。
  Markdown 提供实时预览、任务复选框、双链、反向链接、标签、大纲、命令面板和导出。代码与纯文本编辑器提供 20 多种语言的语法高亮、查找替换、在文件夹中搜索、行操作，并按原编码和换行符写回。所见即所得的 HTML 富文本编辑器在设计视图和源码视图之间切换。
  同一个可执行文件也是给脚本和 AI 代理使用的命令行：第一个参数是动词时不开窗口，直接按路径创建、读取、修改、批处理和导出文档，并可以返回 JSON。
  项目仍在积极开发中，复杂文档的格式保真、输入法和部分高级流程仍在打磨。
