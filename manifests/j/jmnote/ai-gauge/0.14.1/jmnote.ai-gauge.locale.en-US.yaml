Description: AI Gauge is a lightweight Windows system tray widget for monitoring usage across OpenAI Codex, Claude Code, GitHub Copilot, and Google Antigravity. Connect Codex, Claude Code, and GitHub Copilot through their official sign-in flows, or use the locally installed and signed-in agy CLI for Antigravity, to see remaining quota, reset times, and connection status at a glance. Add and reorder multiple accounts per provider, customize refresh intervals and warning and critical thresholds, choose a light, dark, or system theme, and keep the widget pinned above other windows or tucked away in the tray. AI Gauge runs entirely on your device and never stores usage data on a remote server.
