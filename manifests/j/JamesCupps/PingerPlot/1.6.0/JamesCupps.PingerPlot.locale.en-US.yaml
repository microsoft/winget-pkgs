ShortDescription: Continuous traceroute, like mtr or WinMTR, that shows where along a network path a connection goes wrong.
Description: |-
  PingerPlot finds every router between you and a target and keeps probing all of them, so packet loss,
  latency, jitter and a voice-quality score (MOS) build up per hop over minutes or days. A problem that starts at
  your gateway, your ISP's first hop, a peering point or the destination shows up at that hop and every hop
  after it. Every probe and route change is recorded on a History page. It runs in the notification area,
  alerts you (and webhooks) when a destination degrades, needs no administrator rights, and updates itself.
