ShortDescription: A fast, simple text editor that opens files of any size.
Description: |-
  Slate is a fast, simple Notepad replacement that opens files of any size: an 800 MB JSON file opens instantly, scrolls smoothly, and can be searched, edited, formatted and saved.
  Tabs and unsaved changes come back after a restart, syntax colors for 52 languages, JSON and XML format, minify, check, a path bar and a structure panel, line tools, and it updates itself.
