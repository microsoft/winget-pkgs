ShortDescription: Encrypted, offline note-taking with notebooks, sections and pages like OneNote.
Description: |-
  NoteForge keeps your notes on your PC, encrypted with AES-256-GCM under a master password (scrypt key
  derivation), with an optional extra password per notebook. Notebooks, sections and pages like OneNote; a rich
  text editor with headings, lists, tables, code blocks, images and checklists; find and replace; and
  right-to-left writing. No account, no cloud, no tracking: the only network request is an optional update
  check against GitHub Releases. Updates itself.
