ReleaseNotes: "## Changes\r\n• Added option for static color wheel picker\r\n• IK controllers are now inactive if the null object does not have any keyframes, allowing IK to be turned on and off per animation\r\n• Removed window name in window menu bar when using native window frame\r\n\r\n\r\n## Bugfixes\r\n• Fixed #3782 glTF animation export issue with multiple animations using IK\r\n• Fixed #3783 color history spam on mobile interface\r\n• Fixed bone/null object name conflict issue\r\n• Fixed inaccurate depth rendering in orthographic camera\r\n• Mirror modeling no longer syncs bone colors\r\n• Fixed IK glitch when bones and pole are fully in-line\r\n• Fixed #3777 Copy and Pasting groups between different windows not working\r\n• Fixed #3781 touch navigation in UV/2D Editor\r\n• Fixed #3779 Issue when moving image selection as layer\r\n• Fixed #3774 IK baking issue when pole is animated\r\n• Fixed Connect UV Faces not working\r\n• Fixed #3785 Opening multiple child models at once has issues when resolving"
