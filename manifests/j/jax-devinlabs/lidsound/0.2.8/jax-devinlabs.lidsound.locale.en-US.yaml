License: Proprietary (built-in features free; custom sounds require a paid license)
LicenseUrl: https://github.com/Jax-DevinLabs/LidSound/blob/main/LICENSE
ShortDescription: Plays a sound when you open your laptop lid.
Description: |-
  LidSound is a lightweight Windows tray app that plays a sound of your choice
  when you open your laptop lid. It uses the official Windows power
  notification (GUID_LIDSWITCH_STATE_CHANGE) - no drivers, no admin rights,
  no microphone, fully offline.

  Built-in sounds are free. Uploading and trimming your own audio files
  (wav, mp3, flac, ogg and more) is unlocked with a per-machine license.
