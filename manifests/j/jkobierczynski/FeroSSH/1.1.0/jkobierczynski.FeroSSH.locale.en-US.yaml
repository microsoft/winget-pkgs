ReleaseNotes: |-
  FeroSSH 1.1 is about working faster in tmux and in many tabs.
  - tmux keybindings for tabs and panes (Session > Use tmux keybindings for tabs and panes, off by default).
  - Window > Split right/down in same directory.
  - Find (/) and resizable sections in the file transfer view.
  - A start directory per host (Start dir field, StartDir in ferossh.conf).
  - Name your sessions: Window > Rename session, double-click a tab, or F2 in the Session manager.
  - Session > Save this pane's output to a log, or the output of all panes.
  - 30 more colour themes, 44 in all, each with text contrast of at least 4.5:1.
  - A Tools menu for the Connection manager, Session manager, File transfer, Port forwards, Command snippets and Command palette.
  - A complete user guide.
  - Fixed: tmux in the Connection manager is now an on/off switch with a separate tmux name; Session manager and side pane toggles respond at once.
