ShortDescription: Switch your monitors between two inputs from the system tray via DDC/CI.
Description: A tiny Windows tray app for monitors shared between two computers. Save two input profiles ("Personal PC", "Work PC") and switch every monitor with one click via DDC/CI. Optional free account syncs the profiles to every PC plugged into the same monitors, matched by monitor hardware ID. Per-user install, no admin rights required.
