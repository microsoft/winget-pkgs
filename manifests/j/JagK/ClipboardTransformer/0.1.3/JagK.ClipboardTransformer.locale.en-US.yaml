InstallationNotes: This per-machine MSI installs the tray application and standalone CLI and requires administrator approval. Open a new terminal after installation before running clipboard-transformer from PATH. The Windows binaries are not Authenticode-signed yet, so Windows SmartScreen or managed-device policy may display a warning.
