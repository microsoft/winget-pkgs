ReleaseNotes: |-
  BaoCut 3.11.0 (build 82)
  Changes
  - Split-screen shorts: Keep two to four people visible in wide shots using rows, a four-cell grid or a one-over-two layout. Adjust panel gaps, pan or zoom individual panels with dragging, the wheel or a pinch, swap people, move one to the top, keep one person or apply a layout to matching clips. The shorts results include a seekable layout strip; preview correctly positions panels at reduced resolution. (source)
  - Speaker framing: Follow the speaker becomes available and the default framing choice after identifying at least two speakers. Single-camera wide shots can match speakers to faces using mouth motion; multi-camera footage uses picture-shot framing. Long pauses, crosstalk and unmatched speakers fall back to split framing when enabled, with a minimum three-second segment. (source)
  - Captions on split shots: Studio captions can sit on a horizontal panel seam, including the middle of a gap. Bilingual lines move together; dragging a caption detaches it from the seam in one Undo step. Explicit cue positions, detached lines, boxed captions and scene or kinetic captions retain their own positioning. (source)
  - Caption design: Agents can set alignment within the wrapping area, line height, letter spacing and comma/period display, and independently style the original and translated lines with order, gap and per-line appearance or position overrides. Caption scenes gain bounded glyph masks, cue-relative sampling clocks, fitted rows with font line boxes, tagged-word line/page isolation, CPU scan-warp and radial-warp materials; the warp materials can include page backdrops. (source)
  - Subtitle timing: Keep matching quotes, brackets and book-title marks together when they fit a line. Merge or rebalance cues shorter than one second within the same sentence and speaker, respecting the seven-second and width limits and preserving word boundaries. (source)
  - Audio and speech-video workflows: Build a content-driven page layout with captions, licensed images and credits, picture-in-picture footage, chapter text and an optional timer. Audio envelopes can hide their progress rail and clocks. Translated videos use audience-language chapter titles and summaries. Agent guidance opens the persistent Review link in the host browser and waits for approval before baking and export. (source)
  - Chapter text: Add a text item that follows the current chapter title, summary or number (1, 01 or 1/N). One item can span the whole video and stay current when chapters change. The text inspector previews the current words and next change; the text panel includes Add chapter title. (source)
  - Replace clip media in place: Swap a video, image or audio asset while preserving the clip ID, styling, effects, caption scope and ducking references. The editor trims and ripples shorter replacements and clamps fades. Transitions are retained when their source handles remain valid; transitions without enough handles are removed. (source)
  - Media and export fixes: Download Wikimedia Commons thumbnail renditions and choose importable WebM transcodes for unsupported Theora/MPEG originals. Waited CLI exports report the actual published filenames after resolving collisions. Windows composition hosts use an authenticated loopback channel and preserve requested frame dimensions and startup diagnostics. (source)
  - Speech diagnostics: Missing or non-executable ffmpeg now produces MEDIA_TOOL_UNAVAILABLE with a localized installation remedy in speech, dubbing, model checks and try panels, rather than incorrectly asking users to reinstall BaoCut. Model checks that cannot start do not mark the model as broken. (source)
  - Rendering quality: Area-average media sources when drawing below half size to reduce moire in small images and picture-in-picture video, with matching native export and WASM preview output. The prototype also keeps standalone text above the source video. (source)
  Requirements and verification limits
  Requirements and verification limits: macOS packages require Apple Silicon and macOS 14+ and are signed and notarized. Windows CPU, CUDA and Vulkan packages are unsigned and require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable; GPU variants require compatible drivers. ffmpeg/ffprobe and an agent engine remain external dependencies. Electron 44.9.3 embeds Node 24.22.0 and does not include the October Node security fixes. Automated checks do not cover full UI/export workflows, live model or GPU inference, physical IME candidate windows or paid agent calls.
  Change coverage
  Compared with 3.10.1 build 81. The complete range contains 48 feature, fix, documentation, feed and test commits plus this release preparation commit (49 total), reconciled in two batches. Associated PRs #98, #99 and #102 and the referenced speech fix #103 were reviewed; remaining commits were reviewed from git. The previous feed updates, Mac publisher dependency setup and test-only corrections are accounted for as internal changes.
  Full comparison
  macOS verification
  BaoCut 3.11.0 (Build 82) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: 9d4d1441726c9490084a29516752660d620af2b0
  Actions: https://github.com/JimLiu/baocut/actions/runs/40205298289
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/40205298289
  Windows availability
  Windows CPU, CUDA and Vulkan installers, portable ZIPs and update feeds are published and verified. Native package, install, upgrade and ZIP checks passed for all three variants.
