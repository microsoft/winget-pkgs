ReleaseNotes: |-
  BaoCut 3.9.0 (Build 79)
  Version history and projects
  - Project videos have diff-based versions independent of Git, default retention of 10 unnamed versions plus named saves within a size cap, per-file diffs, undoable restores, rebuild from snapshots, external-change import and explicit conflict choices. The final dialog contains versions only; per-transaction undo remains in existing editing flows. Intermediate Git-only and Changes-tab proposals were superseded. source
  - Document tabs retain up to 10 versions, show changes and restore as a new version; sealed versions remain accessible after transient revision history rolls over. source
  - Project settings offer local Git status, manual commits and opt-in auto-commit for BaoCut-owned snapshot/media paths, preserving unrelated staged work. Git initialization and local-filter approval require desktop or CLI; Web can inspect and commit. No network operations are added; unsafe locations and repository states pause/refuse actions. source
  - Register an existing folder in place as a project and search the project picker. Agent-created videos open once their timelines contain content, respecting the visible workspace and idle conversation. source
  Skills, brands and external agents
  - Skills has its own rail page with package inspection, ZIP/folder/GitHub import, assets, editing, duplication, restore and up to 20 personal skill versions. source
  - Global and project BRAND.md layers apply to sessions with message > project > global > brand-skill precedence; create brands with an agent interview, a blank file or an existing skill. source
  - Desktop packages include a matching CLI and offline catalog. Manage global or folder skill links in .agents/skills and .claude/skills; optional copies show freshness. Windows uses junctions; Web shows status only. CLI skill path and per-host install folders are replaced. source
  - CLI help avoids duplicate project flags and clips long noun summaries; bare operation names work in spec; open-media metadata is consistently English. source
  Video creation and editing
  - Overlay templates, brand-kit layouts and logos, recolorable static/animated sticker packs, APNG and community pet stickers are available. Downloads are cached; official pet assets were removed before shipping. Asset insertion and follow-up edits share an undo step. source
  - Canvas compositions can bake through recorded drawing instructions with sampled comparison and browser-pixel fallback; WebGL and local 3D assets are supported. Background baking reports its renderer, retries unpinned revision conflicts and detects superseded or stale prerenders. CJK punctuation measurement matches Chromium more closely. source
  - Full-frame bottom code compositions stay live during playback, scrubbing and pause; baked stand-ins serve export and failure fallback. Sandboxed module scripts load correctly and a loading panel covers first-frame loading and failed-host fallback preparation. Intermediate settled-stand-in policies were superseded. source
  - insertRange opens time across declared tracks and code-bundle replacement can ripple later clips; locks reject edits, until-sequence-end beds and chapters stay put, and broken transitions are reported. Read-only transcript lanes merge per track while live caption lanes remain distinct. source
  - Explainer video defaults to under three minutes with topic-specific form, a fact-driven subject, script review and video/cover/publish-copy deliverables. Reusable voice, alignment, bundle, assembly, caption, gap, preview and footage scripts handle ripple, locks, narration replacement, bilingual sound bites, picture-in-picture, transitions and pause tightening. Guides cover native word timing, installable local models, offline bundles and inline media delivery; final samples use an English narrated cut. source
  - Agents can set caption style and placement. Cues, burned-in lines and SRT/VTT/ASS prefer Chinese word boundaries. Custom scenes add active-word clocks, unit font reflow, previous-word and line-box geometry, per-line quotas, lone-tail joining and shape gradients, with capability and selector limits. source
  - Untitled yt-dlp chapter placeholders remain flagged and require actual titles before adoption. source
  Inputs, providers and reliability
  - Desktop image generation accepts pasted or dropped PNG/JPEG/WebP references across the prompt and reference row, and edit models prompt for a concrete change. Web cannot accept local-path image references. source
  - Agents can save link and open-media downloads to a chosen folder without import. Unbound in-app sessions can create videos in a named project/folder after a dedicated confirmation; existing bound-session boundaries remain. source
  - Qwen synchronous ASR uses the correct Chat Completions or DashScope protocol, with bounded chunks, language/context hints, usage and native timing when complete. Official Alibaba custom endpoints are detected; asynchronous filetrans is unsupported. The native-timing regression assertion was corrected. source
  - Finished-task views start with 20 recent entries, page 50 older at a time, and offer clear with Undo. Decisions awaiting reconciliation remain. Ledger eviction reaches clients and protects the newest 50 applicable failed/cancelled results; unused artifacts of pruned jobs are released while Space-backed bytes and managed video media are retained. source
  - Preview and export diagnostics, asset errors and render notes follow the interface language, including nested kernel messages. source
  - Missing document editor toolbar glyphs have SVG or existing-glyph fallbacks. source
  - Fix multiline native-IME preedit replacement duplicating text while preserving token and caret handling in Electron, Web and prototype. source
  - Dependency updates align Tiptap, patch KaTeX/downloader/PPTX transitive dependencies and update Claude Agent SDK; unused Squirrel installer script is denied. source
  Outlier transcription word times are repaired in spoken order so a malformed offset does not collapse the remaining chunk. source
  Compatibility and validation scope
  macOS packages are signed and notarized. Windows CPU, CUDA and Vulkan packages are unsigned, require an AVX2-capable CPU and the Microsoft Visual C++ v14 x64 Redistributable. Automated release checks do not cover UI/export workflows, live model or GPU inference, physical IME candidate windows or paid agent calls.
  Custom caption features require their declared scene capabilities; unit reflow does not provide stable line selectors. Unknown or oversized Chinese words can still split. Web project registration, image references and skill installation retain their platform limits. Deck and design version history are design proposals and are not included.
  The packaged CLI smoke check now uses the current offline skill help and checks the bundled rendered skill, prevents Runtime auto-start and retries temporary Windows cleanup locks. source
  Release validation
  Local release checks: 21 release tests, 4 CLI probe/launcher tests and 18 focused Vitest tests passed. Frozen-source CI passed all three TypeScript typecheck projects, required WASM/Web/slides builds, 10,800 TypeScript/Runtime tests (357 skipped; 727 files passed and 27 skipped), and locked Rust workspace tests. All four native package jobs and both platform publishers passed. Runtime and Worker startup, packaged CLI, Mac signing/notarization, Windows installation/update/ZIP checks and complete public archive read-back passed in the native release workflows. Physical IME candidate windows, UI/export workflows, real model/GPU inference and paid agent calls were not exercised by this workflow.
  Independent release checks confirmed all four public reports against the same source commit and candidate run, all eight archive sizes/SHA-256 digests/checksums, and all four public/live update feeds and release-note payloads. baocut.com reports 3.9.0 Build 79; all eight download entries redirect to the matching files and return HTTP 200.
  Changelog coverage
  Baseline: baocut-v3.8.0-build.77 (2f9b1771b3fe3565813c12169b9e7a27e9f5532f). Full source: 86aba2f91c12a5e5f8809d2d976720ec6aef41fd. Reviewed all 160 commits, including release preparation and the packaging smoke-check fix, in four batches (40/40/40/40), with 6 associated PRs and direct-commit coverage. Internal feed pins, merge bookkeeping, developer documentation, duplicate sources and superseded proposals are reconciled in the coverage ledger. No missing PR lookup pages.
  Associated PRs: #87, #90, #91, #92, #93, #95.
