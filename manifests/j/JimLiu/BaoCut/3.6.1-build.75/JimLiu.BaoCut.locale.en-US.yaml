ReleaseNotes: |-
  What changed in 3.6.1
  - Visual indexing: prefetch the next keyframe batch while encoding the current one, and retry unreadable batches one image at a time so valid frames are kept. Source
  - Apple Silicon embedding: keep the multimodal backbone on the GPU and the image encoder on the CPU, allowing text indexing and search queries to stay on the GPU while visual indexing runs. Existing visual indexes stay compatible, with CPU fallback if GPU initialization fails. The recorded M4 evaluation found modest frame-encoding gains, with greater gains under CPU load; this is not a new retrieval-quality calibration. Source
  - DeepSeek and Doubao: correct the API IDs for DeepSeek V4.1 Flash (deepseek-flash) and Doubao Seed 2.1 Pro/Lite (doubao-seed-2-1-pro-260915 / doubao-seed-2-1-lite-260915) so discovered models remain available and generation uses the same IDs. Reselect saved model choices that still use an older incorrect ID; they are not automatically migrated. PR #77
  - GLM: support reasoning levels for GLM-5.3 and GLM-5.3 Flash and declare their 1M context / 128K output limits. Low, medium and high map to low, high and max; automatic leaves the provider default. Both models always reason, and reasoning consumes the output budget. A regression check covers bounded translation retries when every response is truncated; this does not establish that all reported translation-loop cases are fixed. Source
  - Space: remove semantic-index status icons from cards and list rows, while retaining status in the item viewer. Source
  Compatibility and validation limits
  Semantic models require macOS Apple Silicon; Windows retains lexical search. Semantic thresholds remain uncalibrated. Windows packages are unsigned and require the Microsoft Visual C++ v14 x64 Redistributable; CUDA needs a compatible NVIDIA driver and Vulkan needs a compatible graphics driver. Automated packaging checks do not cover UI/export, live model/GPU inference or paid agent calls.
  Source coverage
  Compare 3.6.0 build 74 to 3.6.1 build 75. Reviewed all 9 commits and 1 associated PR in one batch; coverage reconciled 9/9. Prior feed publication, merge metadata and release preparation are recorded as internal changes. Source: c6297868f8c5172218ff90b6c9f90b2c7ab5facc.
  Local checks passed: TypeScript typecheck, 146 targeted tests, 7 release-rule/notes tests, version/build/notes validation and diff checks. Native build, package and public-download results are described below.
  Platform publication
  BaoCut 3.6.1 (Build 75) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: c6297868f8c5172218ff90b6c9f90b2c7ab5facc
  Actions: https://github.com/JimLiu/baocut/actions/runs/38594722715
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/38594722715
