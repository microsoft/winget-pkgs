ReleaseNotes: |-
  Changes in 3.20.3 (Build 101)
  Artifacts through Open Artifact
  - Agents in BaoCut conversations now make slides, documents, designs and other artifacts through the bundled Open Artifact. Ask for one or type /artifacts.
  - Finished artifacts appear as cards in the conversation and open in an artifact tab. Comments sent to the agent from the artifact page return to the conversation that made it.
  - Publishing follows the conversation's access mode; deleting or sharing an artifact always asks for approval.
  - Removed: the built-in slides, design, design system and docs editors and their agent tools. Existing deck, design and document folders in a workspace are not migrated and stay as ordinary folders in Files; their old receipts no longer show in conversations. (351fed5)
  Export from the review page
  - The review page opened in an agent's browser now has Export: MP4 of this video to the project's exports/ folder (numbered on name clashes). Size and burned-in captions are the only choices, and Copy equivalent command gives the matching baocut export line. (f725133, e431753)
  Downloads for web exports
  - In a browser, finished exports show the file path with Copy path and Download instead of Show in folder, including each file of a multi-file export and partial outputs of cancelled or failed exports. (e485be3)
  Speaker labels in the OpenAI-compatible API
  - POST /v1/audio/transcriptions accepts response_format=diarized_json in OpenAI's shape: segments of type transcript.text.segment with speaker labeled A, B, … by first appearance. Interjections inside a segment are split into their own turns.
  - Works with MOSS Transcribe, or Qwen3-ASR / Whisper with the Speaker diarization component installed; other models return 400 INVALID_REQUEST. known_speaker_names / known_speaker_references return 400 UNSUPPORTED_PARAMETER; chunking_strategy is ignored. Other response formats are unchanged and do not diarize. (4e7ba92)
  Known limits
  - Artifact tabs open only on the computer running BaoCut, not in remote web clients. Artifacts are not included in portable exports; after a conversation is forked, its artifacts stay with the original conversation.
  - BaoCut's MCP service and CLI do not offer artifact tools; external agents use Open Artifact directly.
  - diarized_json was verified end to end with Qwen3-ASR 1.7B on macOS; MOSS Transcribe, Whisper and Windows have not been verified with real models.
  Requirements
  - The macOS package requires Apple Silicon and macOS 14 or later. Windows packages are unsigned and require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable. CUDA and Vulkan variants require compatible GPU drivers.
  Full comparison: 3.20.2 Build 100 to 3.20.3 Build 101.
  Source commit: 7beaa5d4fef2fac2b7d1a56efd339042c28c9edf. Changelog coverage: 10 commits, 1 associated PR (#143), 1 batch; all sources reconciled (including previous-release feed maintenance, a test-only fix and release preparation).

  BaoCut 3.20.3 (Build 101) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: 7beaa5d4fef2fac2b7d1a56efd339042c28c9edf
  Actions: https://github.com/JimLiu/baocut/actions/runs/45784966349
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs, and the standalone command line ZIPs (BaoCut-CLI-…), are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/45784966349
