ReleaseNotes: |-
  BaoCut 3.16.2 (Build 90) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: 07e5149f9a23f0ba54a9e52ac472b3eec7881956
  Actions: https://github.com/JimLiu/baocut/actions/runs/42131996187
  What's changed
  - H.264 exports on Apple Silicon Macs now use constant-quality encoding matched to the selected quality, so file size follows the content instead of a fixed bitrate. A 4K talking-head export at the standard setting drops from about 37 Mb/s to about 9 Mb/s at similar quality; demanding footage can still use up to the previous bitrate, and exports are slightly faster. Details
  - Windows exports keep the previous bitrate-based sizes for now.
  Full comparison: https://github.com/jimliu/baocut/compare/baocut-v3.16.1-build.89...baocut-v3.16.2-build.90
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/42131996187
ReleaseNotesUrl: https://github.com/JimLiu/baocut/releases/tag/baocut-v3.16.2-build.90
