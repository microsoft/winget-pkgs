ReleaseNotes: |-
  BaoCut 3.19.2 (build 97)
  Subtitle translation
  - Agents now write long translations into the video in batches (the first batch, then appended batches resuming from the next untranslated sentence) instead of one very large write, and keep going until every sentence is covered. A partly written translation stays listed as running and is reported as unfinished work at the end of the turn instead of stopping silently. (source)
  - While an agent translates in batches, the subtitle panel, its strip chip, the video card, the video status and the task list show "translated N / M sentences" with a percentage. Before the first batch arrives they show the sentence total and an indeterminate bar. (source)
  Video engine tools
  - When the login shell environment cannot be read, for example when BaoCut starts from Finder or the Dock, BaoCut no longer keeps that failure for the life of the process: it retries after a short cooldown. It also looks for ffmpeg and ffprobe in /opt/homebrew/bin, /usr/local/bin and /home/linuxbrew/.linuxbrew/bin when those folders exist, after the login shell and process PATH. BAOCUT_FFMPEG and BAOCUT_FFPROBE still take priority. The Runtime log now records why the shell probe failed and where the engine found ffprobe and ffmpeg. (#139, source, source)
  Privacy
  - Download error details now also redact links that sit directly next to each other. (#138)
  Requirements and verification limits
  - macOS: Apple Silicon, macOS 14 or later; signed and notarized packages are published after native validation.
  - Windows: unsigned packages; AVX2 and the Microsoft Visual C++ v14 x64 Redistributable are required. CUDA/Vulkan variants require compatible GPU drivers.
  - ffmpeg/ffprobe and an agent engine remain external dependencies.
  - Automated release checks do not cover full UI/export workflows, live model or GPU inference, or paid agent calls.
  Source coverage
  Changes since 3.19.1 build 96, 12 commits, 1 associated PR, reviewed in one batch with complete source coverage. README and docs index rewrites (3 commits), prior-release feed/Homebrew updates and their merge (3 commits) are included in the source inventory and omitted from highlights. The release preparation commit only updates package versions and these notes.
