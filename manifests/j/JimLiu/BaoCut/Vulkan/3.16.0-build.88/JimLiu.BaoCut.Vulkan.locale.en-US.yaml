ReleaseNotes: |-
  What's changed
  - Process footage with stabilization, upscaling, frame interpolation, color matching, background removal and audio stem separation. Tool pages show input estimates and required downloads; the optional IS-Net model is restricted to non-commercial use. Details, tool pages.
  - Add audio and video results to a video with undo, including generated music beds. Details.
  - Detect silence, stillness, adaptive shots and fades using agent and CLI tools; media analysis now resolves asset paths correctly. Details.
  - Create character animation with a new agent skill, reusable rigs, cutout tools, motion checks and sound cues. Details.
  - Get contextual help opening macOS Full Disk Access settings when protected files or browser cookies are needed. Details.
  - Fix Codex image jobs returning another job's image, and honor changed Codex executable paths while reporting sign-in and custom-provider status more accurately. Image jobs, Codex settings.
  - Verify compatible text endpoints that do not expose a model list. Details.
  - Identify text generation tasks by their instructions and show those instructions in task details. #126.
  - Explain why a models folder change is blocked when attempted; use the repository Runtime for development CLI homes and report outdated runtimes. Models, CLI.
  Requirements and limits: macOS requires Apple Silicon and macOS 14+. Windows builds are unsigned, require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable; GPU variants require compatible drivers. ffmpeg/ffprobe and an agent engine are external dependencies. Electron 44.9.3 embeds Node 24.22.0 without the October Node security fixes. Automated checks do not cover full UI/export workflows, live model or GPU inference, or paid agent calls. Windows footage processing, vid.stab and release-worker HTDemucs-FT were not verified in the originating changes.
