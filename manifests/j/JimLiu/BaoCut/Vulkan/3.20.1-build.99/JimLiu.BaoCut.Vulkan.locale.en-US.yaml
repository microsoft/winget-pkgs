ReleaseNotes: |-
  What's new in BaoCut 3.20.1
  Fixes
  - Updates: Fixed a macOS update that failed every time with "The downloaded file didn't pass verification" after a downloaded update was left uninstalled across a restart. Update downloads now try GitHub Releases first and fall back to the baocut.com mirror. Copies of BaoCut stuck on that error can update to this version with Try again. Updater fix, GitHub-first feeds
  - Link import on macOS: The managed yt-dlp now uses the unpacked build, so after its first launch it starts in a fraction of a second instead of over 2 seconds each time. A tool check that times out is retried once, and a passing check is reused while the tool is unchanged, so a slow start no longer marks yt-dlp as unavailable. Issue, probe retry, unpacked build
  - Codex and Pi: Replies that contain Unicode line or paragraph separators are no longer dropped, and a process whose output line passes 64 MB is stopped with a stated reason. Interrupting a Codex turn that already finished reports that it is not running. Output reader, Codex interrupt
  - Pi: BaoCut follows the thinking level Pi reports after a model change, a context compaction no longer ends a turn early, and a session opened right after a model check no longer times out. Thinking level and compaction, model check
  - ACP agents keep BaoCut's mode after changing it themselves, and an approval card closes as soon as the agent ends that tool call. When an agent exits, a reason it writes late is still shown. ACP and exit reasons
  - Claude: Model discovery no longer cuts off a sign-in token refresh. Changing effort while background tasks run applies after they finish instead of ending them. Claude sessions
  - OpenCode: Status and readiness checks retry after a single failure, so a running session is not marked done and real errors are reported instead of "directory not ready". Status retries, readiness errors
  Models
  - OpenAI now defaults to GPT-6.2 Sol and Google to Gemini 4 Hydrogen. Astra, Neon, Carbon and Fable 5.2 are added to the direct and OpenRouter catalogs; existing model choices are kept. Catalogs
  Compatibility and verification
  - macOS requires Apple Silicon and macOS 14 or later. Windows packages are unsigned. They require AVX2 and the Microsoft Visual C++ v14 x64 Redistributable. CUDA and Vulkan variants also require compatible drivers. ffmpeg, ffprobe and an agent engine are external dependencies.
  - Automated release checks cover packaging and native smoke tests. Full UI and export workflows, live model or GPU inference, and paid agent calls are outside those checks.
  Source coverage
  The release includes 19 commits in one reviewed batch and no associated pull requests. An SDK bump, the 3.20.0 feed publication, tests, documentation and a merge commit are internal and included in the comparison. Full comparison from 3.20.0 build 98
  Platform verification
  BaoCut 3.20.1 (Build 99) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: d3a0b432ba741c32eccb1d78acba51a25bebbefd
  Actions: https://github.com/JimLiu/baocut/actions/runs/44621324363
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs, and the standalone command line ZIPs (BaoCut-CLI-…), are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/44621324363
