ReleaseNotes: |-
  What's new in 3.1.1
  Preview and subtitle editing
  - A full-screen player adds chapter navigation, a thumbnail/timecode seek preview, monitoring volume, subtitle modes, playback speed and keyboard shortcuts. Controls and the cursor hide after three seconds of idle playback. The stage bar below the canvas also provides aspect ratio presets, a custom ratio, portrait safe-area guides, playback speed, subtitle visibility, volume and full screen. Playback speed, subtitle visibility and safe-area guides are viewing controls; they do not alter export settings. Full-screen player, stage bar.
  - Drag subtitles horizontally and vertically with center/edge snapping guides. Horizontal movement keeps rendered text on the canvas. A bilingual subtitle line can move independently; Shift/Cmd-click or marquee-select both lines to move them together. Positions are shared by captions using the same style. Undo now redraws the committed caption style without needing a reload. Positioning, independent bilingual lines, marquee selection, undo correction.
  - Subtitle style thumbnails loop their own word animation using the same rendering kernel as preview and export. Only visible cards animate, frames are cached within a bounded budget, and reduced-motion mode shows a still frame. Animated style previews.
  - Media-player progress and volume slider thumbs are centered on their rails. Slider alignment.
  Canvas toolbars and clip actions
  - Selecting subtitles shows a floating toolbar for color, font, size, editing and style selection, with an Original/Translation switch for bilingual captions. Confetti and whiteboard layers have their own toolbars. Subtitle animation editing remains unavailable and its disabled control explains the limitation. Floating toolbars.
  - Toolbar menus provide opacity and Disable clip for applicable elements, including confetti and whiteboard. Disabling uses the existing timeline enable/disable behavior and shows where to re-enable the clip; video retains its own menu behavior. Element menus, confetti and whiteboard.
  - Save eligible video/image assets and subtitle styles to the brand kit from their toolbars. Assets stored inside a video's folder remain unavailable for this action. Brand-kit writes are desktop/CLI capabilities; Web controls explain that limitation. Brand-kit actions.
  - Replace just the selected video/image clip while keeping other uses of the asset unchanged. Detach audio creates a matching audio clip and mutes the video's embedded audio in one undoable transaction; it requires an audio stream, enabled embedded audio and a constant playback rate. Replace and detach.
  Export, packaging and reliability
  - Desktop export asks for the output filename and location before starting; multi-file exports ask for a destination directory. Canceling does not start a job, and repeated submissions are guarded. Web exports retain Runtime-managed destinations. Export confirmation.
  - Same-size opaque fullscreen footage with a contain/black-background layout avoids redundant frame compositing. Larger fullscreen sources are decoded at their fitted canvas size where applicable, reducing repeated resampling; cropped/effected sources retain their source-size path. This can change the resampling filter and introduce up to one pixel of even-size rounding for differing aspect ratios. Frame pass-through, canvas-size decoding.
  - macOS packages share one copy of bundled fonts across desktop, Web and the native export worker, retain supported Electron language resources, and use LZFSE DMG compression. Windows font packaging is unchanged. Packaging changes.
  - Development desktop sessions can reconnect to a CLI-started Runtime and tolerate changing Vite ports while preserving token authentication and gateway origin restrictions. The export benchmark now compares cover and contain/black-background placements. Runtime reconnection, benchmark coverage.
  - Mac release publication uses the API's returned Release ID for uploads and publishing, removing the immediate post-creation list lookup that interrupted Build 63. Existing release lookup is paginated, and existing assets are checked by ID without replacing their bytes. Build 64 uses a new tag; Build 63 is not rewritten. Release repair.
  Changelog scope
  Compared with 3.1.0 Build 62: 39 commits, 0 associated PRs, 1 reconciled batch. Prototype synchronization, merge wrappers, previous-release feed/download maintenance, version synchronization, comment cleanup and a reverted architecture document are accounted for in the source ledger; reverted content is not shipped as a feature. Full comparison.
  Source commit: a26bc19f94b73b98c534d36032087c8fc8c56911
  Packages and verification
  BaoCut 3.1.1 (Build 64) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: a26bc19f94b73b98c534d36032087c8fc8c56911
  Actions: https://github.com/JimLiu/baocut/actions/runs/37951989390
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/37951989390
