ReleaseNotes: |-
  BaoCut 3.8.0 (Build 77)
  - First-launch setup: a one-time six-step desktop setup connects agents and offers local speech recognition, speech synthesis, semantic search, image and music models. Upgrading users see it once too. Skip any step or exit at any time; confirmed downloads continue in the background, and agent installs run one at a time. (Sources: 20b799ab)
  - Background tasks: agent installs and upgrades have stoppable task rows and output logs that remain available after leaving Settings. Failed model downloads link to Complete download when parts are kept, or Download again otherwise, on the relevant models or semantic-index page. (Sources: 20b799ab, a9f92e20)
  - Online footage: agents can search Wikimedia Commons, curated Internet Archive collections and YouTube, preview thumbnail contact sheets, and import Commons/Archive media with license and attribution records. YouTube uses the browsers selected in downloader settings when sign-in is needed. Unknown YouTube rights require a user decision; non-commercial and share-alike terms still apply, and Commons/Archive items with unknown or no-derivatives licenses cannot be imported. (Sources: 6141ed86)
  - Local sound effects: agents can synthesize 15 seeded recipes without a model, including realistic clicks, keypresses, pops and impacts, adjust pitch and duration, add room or hall space, and import or place the result in one undoable edit. Re-rendering the click recipe uses its new 0.15-second default and new synthesis, so it does not reproduce earlier click bytes. (Sources: c9317980, 9ba789e1)
  - Audio analysis: agents can extract per-frame level, bass, mid, treble and onset curves, beats and accents to JSON, check cue-to-onset timing against a chance baseline, and generate a spectrogram/waveform listening sheet. Listening sheets cover at most 120 seconds at a time; use a range for longer audio. (Sources: c9317980, 94dd03bd)
  - Composition previews can return one contact sheet of sampled frames with cell times, making it easier to review an animation at a glance. (Sources: b6449166)
  - Built-in creation skills now cover music-led sound design, UI foley, shared visual/audio cue sheets, procedural post-effects and sync checks for launch films, product demos, narration and talking-head videos. External-agent craft guides retain their reference pages, scripts and examples as separate files. (Sources: 0a9f8c69, 94434f10, 6c8fb186, a437e95d)
  - Image preview: header controls receive clicks, the viewer fills the window and starts at fit to window, and menus and icon buttons have clearer controls and tooltips. On macOS, empty header space can drag the window. The 360-degree panorama has back and close controls, meaningful zoom percentages and limits, an appropriate reset state, and horizontal dragging that follows the pointer. (Sources: e239cd55, 5a130488, 70494d34, 39d16b11, ef222fb8, 09cf0ab8, ff1a4b89)
  - Desktop downloads now use a native Save dialog for media, files, generated results and GIF frames instead of opening the Runtime media URL in the system browser. Saves report their destination or failure; cancelling stays silent. Web keeps browser downloads. (Sources: 0f310c7a)
  - Usage: failed calls with no reported usage no longer inflate unknown-cost counts; rows without billable calls show a dash, and share bars use total call counts. Codex image calls made while signed in with a ChatGPT subscription show In subscription; API-key calls and older unknown records keep their existing classification. (Sources: 20cbbe45, a02ec510)
  - Text-model catalogs are refreshed, including Claude Haiku 5.5 and Fable 5.1, Gemini 4 Argon, Kimi K2.7 Code, Mistral Large 4, Groq GPT-OSS 20B and newer OpenRouter options. Claude Fable is only offered by the fallback catalog with Claude Code 2.1.257 or later; existing default selections remain. Sampling parameters follow model support, and the unpublished Grok 4.7 Mini entry is removed. (Sources: 5d9f1647)
  - Language fixes: finished-task status chips, reconcile actions, template filters and alignment toolbar labels follow language changes immediately. Export-worker errors and warnings use English as the fallback. (Sources: cdfebb23, 92482290)
  Platform availability and validation
  macOS packages are signed and notarized. Windows CPU, CUDA and Vulkan packages are unsigned and require the Microsoft Visual C++ v14 x64 Redistributable. First-launch setup is desktop-only. UI/export, live model/GPU inference and paid agent calls are outside the automated release checks.
  Mac arm64 and Windows x64 CPU, CUDA and Vulkan are published. Mac App and DMG signing, notarization, Gatekeeper, Runtime and native Worker startup checks passed. All Windows native build, unpacked-app, silent installation, same-version update and ZIP self-checks passed. Independent public archive read-back and all four update feeds passed. The website reports version 3.8.0, build 77; all eight download links resolve to this release and return HTTP 200.
  Change coverage
  Prepared from the full range after 3.7.0 Build 76: 42 commits (41 existing changes plus release preparation), one associated PR (#85), reviewed in two batches (20 + 22). All commits are mapped to the consolidated notes or an explicit internal-only omission; no PR lookup failed. Frozen source: 2f9b1771b3fe3565813c12169b9e7a27e9f5532f. Full comparison.
  macOS publication report
  BaoCut 3.8.0 (Build 77) for Apple Silicon, macOS 14+.
  Bundle ID: com.baocut.app. Developer ID signed, hardened runtime and Apple notarization accepted for both App and DMG.
  Runtime and native Worker startup, signer fingerprint, staple and Gatekeeper checks passed. UI/export, real model inference and paid Agent calls were not exercised by this workflow. ffmpeg/ffprobe and an agent engine are external dependencies.
  Source: 2f9b1771b3fe3565813c12169b9e7a27e9f5532f
  Actions: https://github.com/JimLiu/baocut/actions/runs/38969212778
  Windows x64
  Variants: cpu, cuda, vulkan. NSIS installers and portable ZIPs are unsigned. Real credential migration and model/Agent/GPU inference were not exercised by the installer tests. Requires the Microsoft Visual C++ v14 x64 Redistributable; the current package does not bundle the VC runtime DLLs.
  Native build and installer verification: https://github.com/JimLiu/baocut/actions/runs/38969212778
