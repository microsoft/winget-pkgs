ShortDescription: DeepSeek Harness（DSH）的 Electron 桌面外壳。
Description: DSH-Desktop 是 DeepSeek Harness（DSH）的 Electron 桌面外壳。它内置 node 与 pnpm，首次启动时将官方 @deepseek-ai/dsh 包安装到 ~/.dsh/runtime，并在浏览器窗口中提供 dsh web 界面，支持插件与 DSH 更新。
