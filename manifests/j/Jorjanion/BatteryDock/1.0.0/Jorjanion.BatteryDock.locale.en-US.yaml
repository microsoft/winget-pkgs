ShortDescription: Minimalist native Rust Windows taskbar battery monitor for wireless mice, headsets, and controllers.
Description: |-
  BatteryDock is an ultra-lightweight (~4.4 MB) native Rust Windows 10/11 taskbar battery capsule that tracks all your wireless gaming peripherals in one place.
  It queries hardware directly via HID, WinRT, and Bluetooth without requiring vendor background suites like Logitech G HUB, Razer Synapse, or Corsair iCUE.
  Features include 4 visual themes, an optional click-through gaming HUD overlay with customizable hotkeys, 24-hour battery history sparklines, and full localization in 21 languages.
