ReleaseNotes: |-
  SketchCraft 0.3.6: opens SketchUp files from every version, a library of scale figures, Restore from backup, and the most thoroughly tested SketchCraft yet.
  On 0.3.3–0.3.5? SketchCraft offers this update when it opens. On an older version, download it once below.
  Highlights
  - SketchUp files from every version open: 6 through 27, including 2013–2020 files that used to be refused, and SketchUp for Web files that came in looking empty. (Textures in 2017–2020 files arrive as colours for now; coming in 0.3.8.)
  - A library of scale figures (Library › Scale figures): a walker, a shopper, a jogger, a child, a dog walker, a stroller, a wheelchair user, a cyclist, and flat cars for elevations.
  - Restore from backup… (File menu): earlier copies of your model, newest first, restored as one Undo step.
  - Undo keeps your own history when Claude or another program saves the model, and every Undo step says who made it: you, a plugin, or an agent.
  - Delete or replace a material, and remove unused materials, in the Textures panel.
  - Bigger pictures: textures and photos up to 16,384 px (48 MP photos and 8K textures are fine).
  - Double-click and Escape work everywhere: finish a wall, open a group, repeat Push/Pull; Escape closes any dialog or menu.
  - The window drags normally on macOS.
  Safer
  Before this release, SketchCraft went through eight rounds of attack-and-fix by independent reviewers, then two final reviews of persistence and the release pipeline: more than 150 problems found and fixed, each with a test. Plugins, SketchUp Ruby scripts, AI agents, damaged or hostile files and the updater were all in scope. Details are in the changelog; report anything you find privately through SECURITY.md.
  This release also moves SketchCraft's updates to a new signing key, silently: your copy switches when it installs 0.3.6, and nothing else changes for you.
  What's next
  The roadmap is built from your feedback: 0.3.7 is drafting (line weights, hatches and cut fills per tag, dimensions that stay attached, fast big documents), 0.3.8 is texturing (UV tools, starring a blocky beaver). 👍 what you want on the milestones.
  Checking your download
  Every file is listed in SHA256SUMS.txt, and the installers carry build provenance: gh attestation verify <file> -R jasonsutter87/sketchcraft.
  Full list of changes: CHANGELOG.md.
