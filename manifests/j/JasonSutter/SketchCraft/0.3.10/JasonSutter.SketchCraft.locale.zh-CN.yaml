PackageIdentifier: JasonSutter.SketchCraft
PackageVersion: 0.3.10
PackageLocale: zh-CN
ShortDescription: 免费开源的推拉式 3D 建模工具，用于建筑、街道及任何带直墙的场景建模。
Description: |-
  SketchCraft 是一款免费、开源的推拉式 3D 建模工具，适用于建筑、街道以及任何带直墙的对象。它用 Rust 编写，在 macOS、Windows 与 Linux 上作为桌面应用运行，并完全可脚本化：每个操作都是一条 JSON 命令。
  功能范围
  - 绘制：多段线、矩形、圆、圆弧与面。
  - 造型：推拉（拉出、推进、开窗与开门）、移动、旋转、缩放、偏移与细分曲面。
  - 变换：镜像、对齐与阵列。
  - 吸附：端点、中点、交点、面与延长线吸附。
  - 组织：标签页、图层、分组与组件。
  - 文档：尺寸标注、文字、剖切面与场景信息。
  - 素材库：模型、材质与组件的本地库。
  - 贴图：颜色与材质，以及自带的图案库。
  - 单位：米、厘米、毫米、英尺与英寸。
  - 专业工具、样式与键盘操作：内置教程与全套快捷键。
  - 文件：导入与导出多种常见 3D 与图像格式。
