ShortDescription: MCP server for searching, citing, downloading and reading books and papers from Library Genesis and open-access sources.
Description: A Model Context Protocol (MCP) server that connects AI assistants (Claude, Cursor, VS Code + Copilot, and any MCP client) to Library Genesis and the open-access web. Four tools — search, get_details, download and read — cover federated search across the LibGen catalog, Anna's Archive, arXiv, Crossref, OpenLibrary, Project Gutenberg, dblp, PubMed and ERIC; BibTeX and RIS citations with optional Crossref and OpenLibrary enrichment; article retrieval through an ordered source chain including Unpaywall, OpenAlex, Europe PMC, bioRxiv, the RFC Editor, NIST, Zenodo, SciELO, CORE and the Internet Archive; and text extraction, in-document search and outlining of downloaded PDF, EPUB and TXT files. Single static binary, stdio and streamable HTTP transports, and no account, API key or token required.
