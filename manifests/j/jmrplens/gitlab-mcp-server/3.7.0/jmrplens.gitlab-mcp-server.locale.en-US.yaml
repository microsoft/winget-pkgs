  - 8851f50: refactor(gitlab): read the token grant's scopes from client-go (#1850) (@jmrplens)
  - 0585cf5: refactor: drop upstream register citations from code, tests and contributor pages (#1842) (@jmrplens)
  - ffd988c: test(e2e): confirm taking a work item out of its parent (#1855) (@jmrplens)
  Full changelog: v3.6.0...v3.7.0
  Verify the assets
  All binaries, and the OpenVEX document gitlab-mcp-server.openvex.json, are listed in checksums.txt, signed keylessly with cosign:
  cosign verify-blob \
    --bundle checksums.txt.sigstore.json \
    --certificate-identity "https://github.com/jmrplens/gitlab-mcp-server/.github/workflows/release.yml@refs/tags/v3.7.0" \
    --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
    checksums.txt
  sha256sum --check --ignore-missing checksums.txt
  Every file in checksums.txt and every Claude Desktop bundle also carries SLSA build provenance, attached as gitlab-mcp-server.intoto.jsonl. Verify a file against it, without signing in to GitHub:
  gh attestation verify gitlab-mcp-server-linux-amd64 \
    --bundle gitlab-mcp-server.intoto.jsonl \
    --repo jmrplens/gitlab-mcp-server \
    --cert-identity "https://github.com/jmrplens/gitlab-mcp-server/.github/workflows/release.yml@refs/tags/v3.7.0"
