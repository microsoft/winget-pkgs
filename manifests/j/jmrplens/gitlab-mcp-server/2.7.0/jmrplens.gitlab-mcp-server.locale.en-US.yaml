  ## ⚠️ New server icon in MCP clients

  This release replaces the server's MCP brand mark：clients that render server icons (VS Code, Claude Desktop, Cursor, …) will now show **the fan-out** — GitLab MCP Server's own mark (a source node branching into three arcs, the action catalog reaching its three tool surfaces) — where previous versions showed the GitLab tanuki. Same server, new face; the tanuki is GitLab's trademark and has been retired from all of this project's assets.
