ReleaseNotes: |-
  Release Notes
  Released on 2026-09-28.
  Highlights
  Faster builtin hooks
  In our end-to-end benchmark, prek is about 38% faster than 0.5.3, with some builtin
  hooks up to 273% faster (check-yaml: 273%, check-json: 80%,
  check-merge-conflict: 71%).
  Enhancements
  - Add include_deleted to allow hooks to include deleted files (#2733)
  - Add --check and simplify end-of-file-fixer (#2764)
  - Add --check to file-contents-sorter (#2765)
  - Add --check to requirements-txt-fixer (#2766)
  - Add --check to trailing-whitespace (#2763)
  - Expose and document prek util generate-shell-completion (#2727)
  - Support hide_status in project and user configuration (#2760)
  - Support look-around regex in builtin pattern hooks (#2732)
  Performance
  - Cache the resolved Git executable on macOS (#2726)
  - Combine and cache Git repository path queries (#2724)
  - Optimize common builtin hook execution (#2768)
  - Optimize scanning in mixed-line-ending and trailing-whitespace (#2769)
  - Scan check-merge-conflict files in fixed-size blocks (#2781)
  - Use SIMD UTF-8 validation in check-json, check-toml, and check-yaml (#2770)
  Bug fixes
  - Retry transient rename failures on Windows (#2756)
  - Use PATH to resolve prek in completion scripts (#2719)
  Documentation
  - Clarify the flow and scope of usage guides (#2710)
  - Reorganize usage guides and reference documentation (#2709)
  Other changes
  - Sync latest identify tags (#2762)
  Contributors
  - @github-actions
  - @j178
  Install prek 0.5.4
  Install prebuilt binaries via shell script
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/download/v0.5.4/prek-installer.sh | sh
  Install prebuilt binaries via powershell script
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/j178/prek/releases/download/v0.5.4/prek-installer.ps1 | iex"
  Install prebuilt binaries via Homebrew
  brew install prek
