ShortDescription: Split one image into wallpapers that line up across monitors of different sizes and resolutions, with HDR support.
Description: |-
  Wallpaper Splitter splits one image into a wallpaper for each monitor, so the picture continues across the gap as if your monitors were one window, even when they are different sizes, resolutions and pixel densities.
  Monitors are measured in millimetres from their EDID, with bezel gaps and per-monitor nudges. Preview in the app and full screen on every monitor with an alignment grid, then export PNG, JPG or HDR JPEG XR and set each monitor's wallpaper. Opens Ultra HDR JPEG, HDR AVIF and JPEG XL, 16-bit PNG and TIFF, and everyday JPG, PNG and WebP.
