ShortDescription: Summarize YouTube captions in a Windows desktop app with clickable timestamps.
Description: |-
  Jinjr Recap is a free, open-source Windows desktop app for reading YouTube
  videos through their captions. It offers summaries, timestamped key points,
  simple explanations and a transcript mode that does not require AI.
  AI modes use your own Claude, OpenAI or compatible provider key. The chosen
  provider receives the video's title, channel and transcript, and provider
  charges are separate from the free app. Videos must have captions.
