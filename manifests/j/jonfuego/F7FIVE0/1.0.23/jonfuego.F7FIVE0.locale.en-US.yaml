ShortDescription: A free, self-hosted media server for Windows.
Description: |-
  F7FIVE0 is a free, self-hosted media server for Windows. It serves your movies, TV, music,
  music videos and podcasts to a web browser and to its Android, Android TV and Android Auto app.
  Setup installs everything it needs (PostgreSQL, Python, Node.js, FFmpeg) and runs it as Windows
  services. After a silent install, open http://localhost:3001 on the server PC to create the
  admin account. No telemetry; see the privacy statement for every outside service it can use.
