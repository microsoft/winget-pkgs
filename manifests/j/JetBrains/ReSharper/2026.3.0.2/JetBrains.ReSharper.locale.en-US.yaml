ReleaseNotes: |-
  ReSharper 2026.3.0.2 hotfix is now available.
  This update fixes CVE-2026-114938, also known as Java4Shell, in the bundled JetBrains Runtime. The vulnerability affects machines with x86-64 processors that support AVX-512 VBMI. We recommend installing the update as soon as possible. For details, see our blog post.
  If you are upgrading from ReSharper 2026.1.X or earlier, here are the highlights of the 2026.2 release:
  - Claude Agent and Codex in Visual Studio.
  - Support for .NET 11 and C# 15.
  - Readable runtime-async code in dotPeek.
  - Unit testing updates for xUnit v3 4.0, NUnit 5.0, MSTest 4, and Playwright.
  - Class layout view, format string analysis, and new CUDA inspections in ReSharper C++.
  For the full list of updates included in this release, click here.
