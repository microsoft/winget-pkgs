ReleaseNotes: |-
  This build brings major updates to core code insight capabilities, improves integration with type systems and external tools, and delivers essential runtime stability fixes:
  Code Insight
  - Treat Sphinx Python domain references in docstrings as first-class citizens - PY-27635.
  - Get autocomplete suggestions for unittest.mock.patch module arguments - PY-21952.
  - Enjoy direct autocomplete support for pytest-mock targets and mocker.patch() calls - PY-36260 and PY-63257.
  - Rely on accurate completion suggestions for spec and spec_set arguments in mock.Mock - PY-32282.
  - Work with TypedDict generics without hitting false positive inheritance errors - PY-62524.
  - View enhanced type diff and breakdown details for precise type checking - PY-90555.
  - Support the converter parameter inside dataclass_transform field specifiers - PY-75771.
  - Evaluate TypedDict attribute types non-eagerly for faster performance - PY-85440.
  - Recognize ty_extensions.Intersection and propagate intersection types cleanly across members and properties - PY-87024, PY-87028, and PY-89000.
  - Use Literal return types in boolean contexts without false negative warnings - PY-79184.
  - Avoid misleading "Class is already parameterized" warnings on implicit Any parameters - PY-81560.
  - Get completion suggestions for builtin types in f-string format expressions - PY-88388.
  - Catch invalid mock.patch targets with accurate error highlighting - PY-88509.
  - Infer the correct class type instead of item types when subscripting a TypedDict class - PY-91533.
  - Infer item types correctly inside self-referencing TypedDict definitions - PY-91571.
  - Restore code example inspection support for rst docstrings - PY-91625.
  Ecosystem and External Tools
  - Access SciView (Data View) functionality directly on remote and client setups - PY-91337.
  - Run Ruff integration across multi-module projects without triggering full ruff rule --all executions - PY-92087.
  - Execute Ruff commands reliably on Windows WSL environments without execution errors - PY-86270 and PY-88158.
  - Select default Python versions accurately when initializing uv projects without forcing higher versions - PY-87546 and PY-92387.
  - Keep Git repository creation preferences respected when creating uv projects - PY-92436.
  Debugger and Run
  - Run debugging sessions smoothly as debugpy terminal emulation regressions from pydevd are resolved - PY-91593.
  - Interrupt command execution using Ctrl+C in the console without breaking active debug sessions - PY-90623.

  Full release notes.
