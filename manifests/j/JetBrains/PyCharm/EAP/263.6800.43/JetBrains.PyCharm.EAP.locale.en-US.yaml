ReleaseNotes: |-
  This build closes out long-standing SQLAlchemy type checking gaps, brings several Ruff and external-tool improvements, expands options for suppressing inspections, and adds a batch of testing, debugger, and stability fixes:
  Frameworks
  - SQLAlchemy 2.0 declarative models are now fully understood: constructor keyword arguments, attribute types, and column comparisons like User.name == "Ann" all resolve correctly instead of raising false type-mismatch warnings - PY-4536.
  Ruff and external tools
  - Ruff's import optimizer can now remove unused imports, as a separate option from reorganizing imports - PY-85534.
  - Ruff can now apply safe lint fixes automatically on save, with separate options for safe and unsafe fixes - PY-86352.
  - Run Ruff's fixes across the whole project using the Cleanup Code action, including on commit - PY-86041.
  - Ruff configuration in pyproject.toml is now found correctly in projects with multiple content roots - PY-85409.
  - Pyrefly no longer reports a false positive Getter signature should be (self) for properties in modules outside the project root - PY-89805.
  - Zuban, a Mypy-compatible type checker, is now available as an external tool alongside ty, Pyrefly, and basedpyright - PY-85009.
  Suppressing inspections
  - Suppress inspections with # type: ignore instead of # noinspection, with settings to include the error code or add a pycharm: namespace - PY-90780.
  - Completion now suggests inspection codes inside # type: ignore[...] comments - PY-90825.
  - Suppress inspections using a dedicated # pycharm: ignore[code] comment - PY-90627.
  - # type: ignore[code] comments now support short codes, flag a missing code in strict mode, and report a code that doesn't resolve to a real inspection - PY-90787 and PY-92114.
  Testing
  - Specify a custom Python module for the unittest run configuration, enabling custom test runners without writing a plugin - PY-26068.
  - A pytest test combining @patch mocks with fixtures no longer triggers a false extra parameter(s) not matched by @patch decorators warning - PY-91259.
  Debugger
  - Add inline logpoints directly in the editor gutter, similar to Kotlin - PY-90553.
  - PyO3 native debugging on macOS no longer gets stuck at "Connecting to DAP" when the interpreter re-execs itself on launch - PY-92496.
  Other fixes
  - Full Line Code Completion is no longer treated as an essential plugin, so it can be disabled again - PY-92605.
  - Parameter name inlay hints no longer show when the argument already has the same name - PY-86283.
  - "Go to Super Method" now navigates to the actual Django implementation instead of its stub - PY-83908.
  - Checking code style on commit with the Analyze Code option no longer crashes - PY-49151.
  - Script startup is faster again, fixing an import overhead that also showed up as a slowdown whenever matplotlib was installed - PY-92211 and PY-92613.

  Full release notes.
