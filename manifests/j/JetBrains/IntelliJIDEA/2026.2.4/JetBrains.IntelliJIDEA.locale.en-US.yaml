ReleaseNotes: |-
  IntelliJ IDEA 2026.2.4 is now available! The latest update brings the following improvements:
  - Files and directories in WSL projects no longer incorrectly appear as deleted or missing when file system prefetching fails. [IJPL-252022]
  - The Java onboarding tour now ensures smooth progression through its lessons. [IJPL-250871]
  - Import optimization now works as expected without affecting IDE responsiveness during code formatting, saving, or committing changes. [IJPL-249060]
  - The IDE starts up reliably even if the plugin cache file contains invalid data. [IJPL-250688]
  - Oracle's fixes for CVE-2026-91403 and CVE-2026-114820 were integrated into JBR.
  Get more details in our blog post.
