ReleaseNotes: |-
  IntelliJ IDEA 2026.3 is now out! The highlights of this release include:
  - JetBrains Air – a new layer for agentic development
  - IntelliJ IDEA's Java and Kotlin extension for Cursor and VS Code
  - Debugging improvements:
    - ij-debugger agent skill
    - Hibernate debugger
    - Spring Security diagnostics in HTTP responses
    - AppGlass
  - Support for the latest technologies:
    - Java 28
    - Jakarta Persistence 4 and Hibernate 8 support
    - Scala updates
    - Kotlin support for Spring Modulith
  - Quick tasks and edits without opening a project
  - Git worktrees for parallel work and easy code reviews
  Visit our What's New page to learn about these and other improvements.
