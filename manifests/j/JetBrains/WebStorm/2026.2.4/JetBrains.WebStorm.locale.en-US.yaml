ReleaseNotes: |-
  What's fixed:
  - We've improved the Vitest support, so Vitest 5 testNamePattern no longer breaks the test running functionality (WEB-79586).
  - We've restored error highlighting for untyped function parameters in TypeScript files with the AngularService running in Angular projects (WEB-79840).
  - We've improved performance when resolving references in Angular templates (WEB-77483).
  - We've implemented correct type inference in Angular templates with the service-powered type engine used in Angular projects (WEB-79345).
  - We've restored resolution for bootstrap-vue components (WEB-79717).
  - Oracle's fixes for CVE-2026-91403 and CVE-2026-114820 have been integrated into JBR.
  For more details, please see the release notes.
