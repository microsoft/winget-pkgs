ReleaseNotes: |-
  Here are the update notes in HTML format:
  What's fixed:
  - We've updated the empty-state text in the Currently selected section of the Figma Connect tool window for the sake of clarity (WEB-79021).
  - We've fixed inconsistent AI Assistant plugin installation status shown in the Figma Connect wizard (WEB-79369).
  - We've fixed the Unexpected term error in Sass when namespaced functions or variables are used as calc() arguments (WEB-56489).
  - We've fixed a problem with loading a base reporter from ./lib/reporters/base.js when running Mocha 12 tests (WEB-79510).
  - We've fixed parsing in Angular applications, so @default never in template @switch blocks is no longer reported as unknown block (WEB-78903).
  - We've fixed the issue with CSS pseudo-selectors being reported as unknown on disabling the Images plugin (WEB-79295).
  - We've added support for comments in HTML tags in Svelte applications (WEB-77758).
  - We've introduced numerous improvements to the Storybook Connect plugin (WEB-79305, WEB-79306, WEB-79303, WEB-79280, WEB-79271, WEB-79239, WEB-79289, WEB-79274, WEB-79236, WEB-79262, WEB-79172, WEB-79272, WEB-79261, WEB-79223, WEB-79264).
  For more details, please see the release notes.
