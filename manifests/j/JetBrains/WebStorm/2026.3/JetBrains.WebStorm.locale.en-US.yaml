ReleaseNotes: |-
  What's fixed:
  - We've introduced Air, a new layer for agentic development, so you can work with the coding agents of your choice, as well as run, track, and verify multi-agent workflows inside WebStorm (AIR-3779, AIR-5153, AIR-3344, AIR-4130, AIR-3889).
  - We've introduced support for the Figma Connect, Chrome Connect, and Storybook Connect plugins and enhanced it with the possibility to use these plugins with Air (WEB-79172, WEB-78488, WEB-28085, WEB-58905, WEB-79355).
  - We've improved the debugging experience by adding support for flexible stepping configuration (WEB-74027, WEB-70754).
  - We've extended support for Markdown ( AIR-6272, WEB-66842, WEB-71613).
  - We've enhanced support for TypeScript 7 (WEB-79253, WEB-78876, WEB-79350).
  - We've introduced numerous improvements in support for frameworks and technologies (WEB-66841, WEB-79968, WEB-77405, WEB-79170, WEB-78816).
  For more details, please see the release notes.
