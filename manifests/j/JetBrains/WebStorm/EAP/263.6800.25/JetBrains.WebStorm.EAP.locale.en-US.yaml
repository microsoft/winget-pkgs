ReleaseNotes: |-
  What's fixed:
  - We've got rid of false positive error reporting for async arrow functions with a generic new expression in a default parameter value (WEB-79883).
  - We've introduced support for resolving React components when dot notation from components imported from different files is used (WEB-66841).
  - We've fixed resolution of JSX qualified tag name <Ns.Component/>, so it resolves to the original declaration, thus ensuring success for Go to Declaration and Find Usages actions (WEB-79259).
  - We've fixed the Find Usages functionality in the TypeScript context, so overridden class members are counted as usages (WEB-79708).
  For more details, please see the release notes.
