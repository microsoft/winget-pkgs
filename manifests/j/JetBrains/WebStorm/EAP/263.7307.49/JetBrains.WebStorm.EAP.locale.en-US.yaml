ReleaseNotes: |-
  What's fixed:
  1. We've added FUS statistics collection for tsconfig.json internals (WEB-80082).
  2. We've added support for $safeNavigationMigration, so it is recognized by the Angular type engine in Angular 22 projects (WEB-79170).
  3. We've got rid of an exception that prevented the Angular2TypeScript service from starting (WEB-78898).
  4. We've fixed Angular image link resolution, so it takes the assets configuration in angular.json into account (WEB-44964).
  5. We've fixed TypeScript LSP diagnostics, so the configured highlighting settings are respected (WEB-80118).
  6. We've added support for resolving images in Angular templates using the extended assets configuration in angular.json (WEB-59564).
  7. We've fixed processing of pair curly braces in JSX props, so they are deleted correctly when a JSX element is passed as prop value (WEB-70585).
  8. We've fixed Angular usage analysis, so properties of injected services referenced in templates are correctly recognized as used (WEB-78431).
  9. We've fixed Angular template scope resolution for packages installed using npm aliases (WEB-79647).
  10. We've fixed resolution for imports with tilde in Angular inline styles (WEB-56888).
  11. We've fixed resolution for SCSS @use imports from external packages in Angular inline styles (WEB-79721).
  12. We've moved MDX tests from daily runs to safe-push testing in the WebStorm Aggregator (WEB-80083).
  13. We've added support for comments inside HTML elements in Angular 22 and later (WEB-77405).
  14. We've fixed Angular 22.2 support, so private component members used in templates are no longer erroneously reported as inaccessible (WEB-79968).
  For more details, please see the release notes.
