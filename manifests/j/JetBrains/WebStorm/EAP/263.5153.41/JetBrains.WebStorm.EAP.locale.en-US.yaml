ReleaseNotes: |-
  What's fixed:
  - We've introduced dedicated icons to indicate Storybook story files (WEB-28085).
  - We've improved the behavior of Storybook Connect after story indexing failures, so users are advised to check whether any project dependencies are mismatching or missing (WEB-79623).
  - We've made addon-storybook-sync optional (WEB-79584).
  - We've fixed Storybook detection, so projects with the word storybook in their package.json show the setup card instead of a Could not index stories error (WEB-79368).
  - We've reworked the UI for configuring lists of scripts not to step into during a debugging session (WEB-74027).
  - We've introduced adding closing curly braces in new MDX files automatically (WEB-79596).
  - We've fixed unused symbol inspections, so Storybook-related exports and configuration properties are no longer reported as unused (WEB-58905).
  - We've fixed TypeScript completion, so file names are suggested for default-exported functions in .tsx files (WEB-79438).
  - We've got rid of a UI freeze that occurred in WebTypesDefinitionsEP.createInstance when loading resources (WEB-79357).
  - We've fixed a false positive reporting of a private collection property as updated but never queried when it was read using the non-null assertion operator (WEB-79611).
  - We've enhanced configuration of stepping during a debugging session by adding support for ignoreList (WEB-70754).
  For more details, please see the release notes.
