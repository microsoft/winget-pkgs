ReleaseNotes: |-
  What's fixed:
  - We've moved TypeScript Language Service commands outside the UI thread, so they can no longer block the UI (WEB-79320).
  - We've fixed the show documentation on hover functionality with TSGo Service-Powered Type Engine, so property types for members of Function and CallableFunction are displayed (WEB-79253).
  - We've fixed the behavior of MDN documentation, so it is shown for standard library elements when they are used as properties (WEB-79254).
  - The native Vivaldi browser icon is now shown instead of the Chromium family icon (WEB-65991).
  - We've added a navigation bar for GraphQL (WEB-66926).
  - We've fixed a problem with generating Nuxt template projects in WSL locations using the project wizard (WEB-78811).
  - We've introduced a number of improvements to the Storybook Connect plugin (WEB-79264, WEB-79223, WEB-79261, WEB-79272, WEB-79172, WEB-79262, WEB-79236, WEB-79274, WEB-79289, WEB-79239, WEB-79271, WEB-79280, WEB-79303, WEB-79305, WEB-79306).
  - We've fixed inconsistent AI Assistant installation status in the Figma Connect wizard (WEB-79369).
  - We've fixed a UI freeze that could occur when enabling AI Assistant from the Figma Connect wizard (WEB-79027).
  - We've fixed the TypeScriptValidateTypesInspection, so it no longer uses the built-in type engine unnecessarily (WEB-79327).
  - The standard library source name is now consistently detected for both @typescript/native-preview and typescript@7 (WEB-79255).
  - We've fixed incorrect formatting and parsing in the JSX context (WEB-36434, WEB-59041).
  - We've fixed ES6 module imports, so adding a new import no longer moves the comment from the previous line (WEB-59423).
  - We've fixed incorrect token types assigned to JavaScript constants named source (WEB-78993).
  - We've fixed the JavaScript navigation bar, so the root element displays the file name instead of the file body (WEB-79197).
  - We've fixed a UI freeze caused by eager initialization of NotificationGroupManager from NodeProfilingSettings (WEB-79195).
  - We've unbundled the ML Completion Ranking plugins from WebStorm (WEB-78479).
  - We've fixed parsing errors caused by using the extends keyword in Flow type arguments (WEB-79105).
  - We've fixed Svelte usage analysis, so TypeScript types used in an extends constraint in the generics property of a component script are counted as usages (WEB-78816).
  - We've fixed Vitest run/debug configurations for Angular 21 libraries (WEB-76437).
  - We've fixed the Possibly infinite type substitution error that could occur with complex TypeScript types (WEB-49721).
  - We've fixed an out-of-sync file state in the TSGo Proxy API process when working with inferred projects (WEB-78876).
  - We've fixed TypeScript Language Service resolution, so project TypeScript installed through a pnpm npm: package alias no longer falls back silently to the bundled version (WEB-78796).
  - We've converted the optional dependencies of the Stylus plugin to content modules (WEB-78673).
  - We've fixed duplicate Prettier service instances for files in monorepo packages (WEB-78569).
  - We've added equals and hashCode implementations to BasicPolySymbolScope (WEB-78225).
  - We've corrected mistakes in the documentation for PsiLinkedPolySymbol (WEB-78224).
  - We've fixed an IDE freeze in PackageJsonPolySymbolsRegistryManager.after (WEB-78558).
  For more details, please see the release notes.
