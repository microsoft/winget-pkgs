ReleaseNotes: |-
  What's fixed:
  - We've improved WebStorm performance during TypeScript analysis and code insight (WEB-55220).
  - We've got rid of false positive reporting of syntax errors for multiline strings in Angular interpolations (WEB-43190).
  - Node.js tests in the Figma Connect plugin are now reported in TeamCity (WEB-79041).
  - We've fixed incorrect indentation of the first JSX prop value with a multiline expression on running the Reformat Code action (WEB-78954).
  - We've fixed the behavior of the Storybook Connect story tree (WEB-79247, WEB-79240, WEB-79224).
  - We've fixed the Storybook Connect behavior on initialization failure, so it no longer prevents attempts to set up the project (WEB-79250).
  - We've fixed the Storybook Connect cleanup behavior in Angular projects, so removing example stories no longer leaves .eslintrc.json behind (WEB-79249).
  - We've introduced a dedicated icon to indicate the Storybook Connect tool window (WEB-79241).
  - We've improved installation and configuration of Storybook Connect skills (WEB-79221, WEB-79212).
  - We've fixed the Storybook Connect restart flow (WEB-79238).
  - We've introduced FUS data collection in Storybook Connect (WEB-79036).
  - We've verified the Storybook Connect functionality against the Callstack repository (WEB-79012).
  - We've aligned the Storybook Connect browserUrl behavior with its actual split-mode implementation (WEB-79211).
  - We've fixed the Storybook Connect WebSocket client, so it reassembles fragmented text frames correctly (WEB-79147).
  - We've added a feedback form for Storybook Connect (WEB-79037).
  - We've restored compatibility between the GraphQL plugin and DataGrip 2026.2 (WEB-79082).
  - We've improved support for TypeScript 7.0.x version from node_modules (WEB-79160, WEB-78697).
  - We've improved support for TypeScript-Go, so the TypeScript service starts successfully when opening a file from an Angular Nx monorepo (WEB-78738).
  - We've got rid of an IDE freeze that was caused by a deadlock in GitConfigurationCache clear (IJPL-250721).
  For more details, please see the release notes.
