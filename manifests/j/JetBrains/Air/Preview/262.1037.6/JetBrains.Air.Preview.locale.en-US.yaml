ReleaseNotes: |-
  Stability and performance improvements, pin tasks, and improved subagents support
  - Pin tasks in a dedicated Pinned section
  - Invoke built-in and custom Codex subagents, and custom Junie subagents, from the / menu
  - Model search now filters the list to matching models
  - Faster Claude startup and Git checkpoints in large worktrees reduce the wait before agent requests
  - Fixed startup freezes, memory-related crashes in long sessions, cloud task loading failures, and chat freezes with custom ACP agents
  Share your feedback with us via the issue tracker or contact form.
