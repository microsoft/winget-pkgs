ReleaseNotes: |-
  GoLand 2026.3 is now available!
  GoLand 2026.3 brings JetBrains Air into your Go workflow, giving you one place to run coding agents and review their changes. The bundled profiler skill helps agents investigate performance problems with GoLand's tools. This release also improves Git worktrees, remote development, and Kubernetes workflows.
  The most prominent highlights of this release are:
  - Work with your preferred coding agents in JetBrains Air, use existing subscriptions, and give feedback directly from your code or the diff.
  - Capture and analyze Go profiles with an agent using the bundled profiler skill.
  - Copy local project settings and files into new Git worktrees and run custom setup scripts.
  - Start working on remote projects sooner with Light mode and use native OpenSSH support.
  - Create database connections for Kubernetes pods and Docker containers, and browse and edit files inside Kubernetes pods.
  - Send Figma design context to an agent with the Figma Connect plugin.
  - Use the new Home window for quick edits, terminal commands, and Git actions without opening a project.
  - Hear sound cues for IDE events, editor line marks, and agent activity.
  - Benefit from fixes to significant IDE freezes and automatic error and freeze reporting.
  For a complete rundown of the new features, visit our What's New page.
