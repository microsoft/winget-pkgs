ReleaseNotes: |-
  CLion 2026.2.4 brings several improvements and new features. Here are the highlights:
  - CLion now has a dedicated Lauterbach TRACE32 debug profile, so you can launch TRACE32 or attach to a running session directly from the IDE. Go to Settings | Build, Execution, Deployment | Debugger | Debug Profiles, click Add Profile, and select TRACE32.
  - When you debug a FreeRTOS application, AI agents that connect to CLion through MCP can now read RTOS objects, such as tasks, timers, and queues.
  - On macOS, the IDE now resolves Qt symbols in projects that use Qt 6.12.
  - We’ve fixed an issue caused by recent PlatformIO updates that prevented CLion from loading the list of boards when creating a new PlatformIO project. The wizard now shows the boards instead of staying on Gathering info....
  Please try this build, share your feedback, and report any issues to our issue tracker.
  Thank you for using CLion!
