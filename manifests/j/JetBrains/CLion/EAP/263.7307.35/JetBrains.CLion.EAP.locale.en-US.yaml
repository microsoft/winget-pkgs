ReleaseNotes: |-
  The Beta build for CLion 2026.3 is now available.
  - When a CMake profile fails to load, CLion now offers to fix the project setup with an AI agent that runs in the terminal. The agent then uses the IDE’s MCP server to fix your CMake profiles and toolchains and reload the project.
  - DAP debug profiles now let you set environment variables and a custom working directory for the debugger.
  - When you edit debug profiles in the debug-profiles.json file:
    - Unknown properties are now highlighted in the editor.
    - CLion now asks for confirmation before changes from the settings overwrite unknown properties or unsaved edits in the file.
    - The file now uses the indent from the IDE code style for global profiles and from the project code style for project profiles.
  Please try this build, share your feedback, and report any issues to our issue tracker.
  Thank you for using CLion!
