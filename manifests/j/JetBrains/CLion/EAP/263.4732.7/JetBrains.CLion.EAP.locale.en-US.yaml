ReleaseNotes: |-
  The new CLion 2026.3 EAP build is now available with several enhancements. The key update is an improvement to the Profiles switcher in the main toolbar, making it easier to spot problems in the toolchain and debug configurations. A yellow warning icon now indicates when the selected build system or toolchain profile is incompatible with the selected debug profile. For example, a CMake profile that uses the system toolchain on macOS is incompatible with GDB, or a Docker toolchain is incompatible with a local debugger profile. The icon appears both on the switcher and next to the affected profile inside it. Hover over the warning icon to see a description of the issue. You can also open the profile settings directly from the switcher by clicking the gear icon.
  Give this build a try, share your feedback, and report any issues to our issue tracker.
  Thank you for using CLion!
