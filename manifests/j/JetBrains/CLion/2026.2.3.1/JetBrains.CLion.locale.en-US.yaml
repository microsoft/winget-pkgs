ReleaseNotes: |-
  CLion 2026.2.3.1 is now available.
  This bugfix release delivers an urgent fix for a complete IDE freeze (IJPL-255654). In CLion 2026.2.3, the IDE could stop responding completely and had to be restarted. The freeze came from a race in the platform threading code, when a background write action tried to reacquire a lock after its job was cancelled. CLion now handles the cancellation safely and stays responsive.
  This release also fixes short UI freezes in the editor (CPP-48182). The breadcrumbs bar above the editor could hang for several seconds while it waited for the backend and held a read lock. The editor now stays responsive while the breadcrumbs update.
  Please try this build, share your feedback, and report any issues to our issue tracker.
