ReleaseNotes: |-
  RubyMine 2026.3 EAP 6 Is Out!
  Fixes and improvements:
  - Added an ability to enable native WSL interpreters, providing easier setup and expanded functionality: RUBY-36065
  - Fixed an issue where stale or invalid Ruby interpreters blocked access to the Ruby settings page: RUBY-36019
  - Implemented automatic detection of Ruby interpreters installed via Homebrew: RUBY-35827
  - Added support for the CSS if() syntax in CSS, PostCSS, SCSS, and Sass: WEB-76252
  - Improved how YAML frontmatter is displayed in the Markdown preview: IJPL-94598
  - Added support for OAuth authentication for GitLab: IJPL-201684
  For the full list of closed issues, refer to the release notes.
