ReleaseNotes: |-
  RubyMine 2026.3 EAP 1 Is Out!
  Fixes and improvements:
  - Improved indentation handling for Ruby heredocs to consistently respect the current indentation level: RUBY-35934, RUBY-33412, and RUBY-35870
  - Added support for the rails query CLI command: RUBY-35580
  - Fixed code folding for methods with multiline keyword arguments: RUBY-36008
  - Fixed RuboCop integration when bin/rubocop is a shell wrapper script: RUBY-35374
  - Added a confirmation dialog when closing a project or the IDE with running terminal processes: IJPL-111330
  - Added an option to include untracked files when creating a Git stash: IJPL-76149
  For the full list of closed issues, refer to the release notes.
