ReleaseNotes: |-
  Rider 2026.2.3.1 hotfix is now available.
  In Rider 2026.2.3, we started testing a new Files view with a small group of users. This view shows the entire repository rather than only the file system view for the current solution folder.
  We found that this view can slow Rider down. The slowdown is hard to trace back to the Files view, so you might not realize what's causing it. For this reason, we've disabled the view in this update for everyone, including users who enabled it themselves.
  If you still want the repository view, you can turn it back on: in the Explorer tool window | the More options icon | the Enable Files view option. If Rider gets slower after you turn it on, try turning it off again first.
  We apologize for the inconvenience.
