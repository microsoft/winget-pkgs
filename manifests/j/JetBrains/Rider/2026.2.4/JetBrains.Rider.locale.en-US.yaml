ReleaseNotes: |-
  Rider 2026.2.4 is now available.
  Fix for compromised eMudhra certificates
  This build fixes a vulnerability caused by the compromise of eight eMudhra intermediate certificates. An attacker who can intercept your network traffic can use these certificates to impersonate websites and services.
  Install this update as soon as possible so that your IDE stops trusting connections that rely on the compromised certificates.
  Learn more.
  Run your coding agents in Rider with JetBrains Air
  Rider 2026.2.4 supports JetBrains Air, which brings the coding agents you use into the IDE without locking you into any of them. To get started, install the JetBrains Air plugin from Settings | Plugins | Marketplace.
  Run several sessions in parallel, review their diffs with Rider's tools, and leave line comments for the agent to act on – staying in charge of what ships.
  Air works with Claude Code, Codex, Gemini, GitHub Copilot, Junie, and other ACP-compatible agents. You don't need a JetBrains AI subscription – bring your own key, use your existing Claude Code subscription, or try Air for free with Junie Lite until the end of the year.
  For the full list of updates included in this release, see the full list of fixed issues.
