ReleaseNotes: |-
  Rider 2026.3 EAP 2: Release Notes
  New week – new EAP build!
  Files view: Go beyond the .sln without leaving Rider
  With the new Files view in Rider, you can see your repository just as it appears on disk. This makes it easy to open and edit a range of external files, such as CI pipelines, Dockerfiles, scripts, documentation, and AI agent instructions. You no longer have to add these files as solution items or create virtual folders in the IDE to access them.
  The Files view replaces the File system view, which only covered the directory containing your .sln file. Search Everywhere can now find files available in the Files view, too.
  This view is designed to be lightweight, offering simple browsing and editing without indexing your whole repository by default. If you have frontend projects outside your main solution, such as a React app alongside a .NET backend, you can enable full IDE support for them in Rider whenever you need to.
  Rider’s Files and Solution views are designed to complement each other, letting you pick the best option for your work. Use the Solution view to focus on your projects, and switch to the Files view when you need to update configurations or look through the rest of your repository. If AI agents update code, specs, or examples, the Files view makes it easy to check related files and see the bigger picture, all without leaving Rider.
  Get Rider ready for your AI agent
  The AI Agent setup widget is a new entry point that is now available in the bottom-right status bar. This widget helps you find and set up Rider’s features for coding agents. When you open it, you’ll see a list of supported features like MCP tools, skills, and hooks, along with brief explanations of how each one can help your workflow.
  The overview shows you which features are already enabled and which ones you can set up, with direct links to the right settings pages. No matter if your coding agent runs inside Rider or in an external terminal, the widget helps you see what Rider offers and quickly find the settings you need to begin.
  Less noise and clearer context for AI agents with hooks
  Rider’s hooks now provide AI agents with more targeted feedback after code changes. This helps cut down on unnecessary information and makes formatting changes coming from the IDE easier to spot.
  Agents now get inspection results from the Run files inspections hook only for the code they added, not the whole file. This lets them focus on their own changes.
  The Reformat file hook now gives a diff that shows any formatting changes made by the IDE. Agents can see what changed right away, so they don’t have to reread the file to understand the updates.
  GDScript code completion goes further
  Scene unique nodes (the ones marked with %) now show up in code completion. Rider reads the node names from your scene files, so you get the same suggestions you'd expect for any other symbol – instead of typing them from memory and finding out at runtime whether you got everything right.
  Completion also works in the debugger's immediate window now. When you're paused at a breakpoint and want to inspect or call something, you get suggestions there too – no more writing expressions blind in the one place where mistakes cost you a debug session.

  For the complete list of updates included in this build, please see our release notes.
