ReleaseNotes: |-
  Rider 2026.3 EAP 5: Release Notes
  JetBrains Air EAP in Rider
  Air in Rider gives you one unified place to work with coding agents such as Codex, GitHub Copilot, Junie, Claude, and other ACP-compatible agents. It detects agents already installed on your machine and lets you use them inside your development environment, without requiring a separate JetBrains AI subscription.
  Air helps you go beyond a single chat message. You can start several agent sessions simultaneously, follow their progress, and see which files have changed or need your attention. Agents can also use Rider tooling via skills, such as debugging and profiling, to investigate a problem with expanded context.
  Rider remains the place where you review and validate the result, helping you work with less uncertainty and more confidence in what you ship. Yes, Air makes it much easier to delegate routine or larger tasks while keeping the changes, diffs, branches, and commits visible. Still, you decide what to accept, what to change, and when the work is ready to become part of your project.
  Learn more

  For the complete list of updates included in this build, please see our release notes.
