ReleaseNotes: |-
  Rider 2026.3 EAP 6: Release Notes
  Verse support in Rider – built from scratch
  Rider now brings Verse, C++, and the Unreal Engine integration together in one IDE. Built from scratch on Rider’s own language engine, the new Verse Language plugin brings native Verse language support to the IDE without requiring an external language server.
  The plugin highlights your code and reports errors as you type. It also gives you code completion, Go to Declaration, and Find Usages actions everywhere in your .NET solution, as well as Quick Documentation. The Rider MCP server makes all those features available to your AI agents.
  To work on C++ and Verse in the same project, open your Unreal Engine 6 project's .sln or .uproject. You can also open the .code-workspace that Unreal Engine generates for Verse. It contains only your Verse files, so it loads quickly.
  You can install this plugin by going to Settings | Plugins | Marketplace and searching for "Verse Language". The plugin is in Beta, so it’s still a little rough around the edges. For example, you can't navigate between C++ and Verse code yet.
  What additional features would make Rider your go-to Verse editor? Tell us in our issue tracker.
  Rider now fully supports .vcxproj.filters
  Now, you can reorganize a C++ project in Rider, and your Visual Studio teammates will see the same structure. Rider updates .vcxproj.filters as you work:
  - Create filters, including nested ones, and add new or existing files to them.
  - Rename and move files and filters with drag-and-drop or refactorings.
  - If a project doesn’t have a .filters file yet, Rider creates one when you add your first filter.
  - When the .filters file changes outside of Rider (for example, when your teammate edits the project in Visual Studio or you pull the latest changes from version control), Rider updates the project tree accordingly.
  - Toggle the project tree between the filter view and the on-disk folder structure at any time.
  To turn it on, go to Settings | Languages & Frameworks | C/C++ | VCX filters and check the box.
  This feature is experimental, so you may run into issues. If something doesn't work as expected, please report it to us. Your feedback will help us get the feature ready for release.
  Debug Unity CoreCLR Players
  Unity 6.7 introduces CoreCLR as a new scripting runtime for desktop Players, and Rider 2026.3 EAP now supports it along with Mono / IL2CPP. You can debug a CoreCLR Player, set breakpoints, and step through your code just as you would with Mono / IL2CPP.
  Mono Players continue to work as before, so if you’re sticking with Mono for now, nothing changes. You can also try CoreCLR in a separate branch and compare how your game behaves on each runtime.
  There are two important things to keep in mind:
  - This change applies only to Players. In Unity 6.7, the Unity Editor (including Play mode) still uses Mono, so your Editor workflows in Rider will stay the same. However, if you're testing Unity 7 Alpha with the CoreCLR Editor, Rider already offers early support. We’ll continue to improve that support as Unity 7 evolves.
  - CoreCLR Player support is still experimental. Unity is releasing it as a technical preview, so now is a great time to try it with your project and see how it behaves. If you have any issues debugging a CoreCLR Player in Rider, please report them in our issue tracker.
  More responsive code editing
  Editing code is now more reliable. We separated text editing from the rest of the IDE, so actions like typing, pressing Enter or Backspace, automatic indentation, and moving code elements no longer slow down when you open a solution or switch branches. That fixes some long-standing annoyances, like caret jumps or flicker during fast edits.
  If anything behaves differently from what you expect, please let us know in our issue tracker.

  For the complete list of updates included in this build, please see our release notes.
