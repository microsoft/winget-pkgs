ReleaseNotes: |-
  Rider 2026.3 is out with:
  Key updates
  - Day-one .NET 11 support, including C# 15 and Runtime Async debugging
  - JetBrains Air: Run your coding agents in the IDE and review their changes there
  - New Home screen: Edit files, use the terminal, or attach the debugger without opening a solution
  For .NET developers:
  - Full support for C# 15: Union types, closed hierarchies, and extension indexers
  - New Files view for everything outside your .slnx
  - Agent skills: Async debugging context, .NET database connections, and test runs through Rider
  - New and improved C# inspections
  - Lightweight WSL support, currently in Beta
  - Debugging for single-file .NET apps (Windows)
  - Removal of C# Interactive to focus on core .NET workflows
  For game developers:
  - New Lua and Verse (UE6) plugins, both in Beta
  - Godot-aware debugging for C# and GDScript, with a live scene tree
  - Tighter integration with the Godot Editor
  - Unreal: Built-in command-line argument presets (replacing EzArgs)
  - Natvis hot reload and an opt-in LLDB 21 C++ debugger
  For the full list of updates included in this release, click here.
