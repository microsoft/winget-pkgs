ReleaseNotes: |-
  PhpStorm 2026.3.1 Preview
  There's a preview available of PhpStorm 2026.3.1, the upcoming minor release of PhpStorm. It brings a number of bug fixes and quality-of-life improvements.
  Here are the most notable changes and bug fixes in this build:

  - Fix: IntelliJ IDEA 2026.3 is lacking PHP functionality [WI-86432]
  - Fix: OK stays disabled after fixing a validation error in some menus [WI-86431]
  - Fix: PHPDoc generation: Preserve known generics [WI-74771]
  - Fix: Partial function application: "Sort arguments" quick fix changes closure parameter order for named placeholders [WI-86158]
  - Fix: Convert promoted property to regular should properly move related PHPDoc to property from parameter [WI-86080]
  - Fix: Promoted property hooks miss highlighting if property has a comment at the end [WI-86066]
  - Fix: PHP Debug Skill [WI-85592]
  - New: Add a simplified splash screen and the "Use simplified splash screen" option [WEB-78901]
  - Fix: Nuxt 4: No props autocompletion for auto-imported and custom components and #components alias with Nuxt 4.2.2 [WEB-76306]
  - Fix: JSX tags considered inline when formatting, line breaks between tags removed if 'Keep line breaks in text' disabled [WEB-37966]
  - Fix: Auto-import doesn't work when re-exporting the entire module [WEB-61981]
  - Fix: Git is not installed: version detection timesout and give up after a single 30s attempt, and the failure is cached for the rest of the IDE session [IJPL-245415]
  - Fix: Inability to comment a change in Gitlab merge request when server returns an empty diff [IJPL-236752]
  - Fix: Diff view doesn't jump to the next change by F7 shortcut [IJPL-192907]
  The full list of changes in PhpStorm 2026.3.1 is available in the release notes. You can download this preview here:
  - PhpStorm-263.8311.42.exe
  - PhpStorm-263.8311.42.dmg
  - PhpStorm-263.8311.42-aarch64.dmg
  - PhpStorm-263.8311.42.tar.gz
  - PhpStorm-263.8311.42.win.zip

  That's all for today. Thanks for keeping up with the changes! We hope they improve your PhpStorm experience.
  - Download PhpStorm
  - Tweet us
  - Report bugs to our issue tracker
