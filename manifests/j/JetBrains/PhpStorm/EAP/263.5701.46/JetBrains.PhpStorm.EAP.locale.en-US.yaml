ReleaseNotes: |-
  PhpStorm 2026.3 EAP #4 is now available
  This build brings a bunch of bug fixes and quality-of-life improvements.

  Here are the most notable changes and bug fixes in this build:

  - Fix: @method does not support @template declaration [WI-64921]
  - Fix: Infer type of array based on unpacked arrays in that array [WI-70585]
  - Fix: PhpStorm freezes for 5 to 8 when Optimize Import is invoked due to calling preprocessors for each import [WI-70975]
  - Fix: WSL, Docker: PHP Code Sniffer works incorrectly with custom ruleset [WI-76575]
  - Fix: Broken generic types with @use [WI-84220]
  - Fix: Browser button for composer.phar doesn't work if path is emtpy [WI-85955]
  - Fix: yield statements in conctructor and destructor should be marked deprecated in PHP 8.6 [WI-85911]
  - Fix: PHP Coverage functionality can't be used by external plugins in PhpStorm 2026.2 [WI-85867]
  - Fix: PHP 8.6: No inspection when enum case conflicts with inherited typed interface constant [WI-85825]
  - Fix: Root directory is marked as excluded when Enable automatic directory exclusion option is enabled and PhpStan cache dir is set as . [WI-85815]
  - Fix: PHP Runtime Tools Skill [WI-85631]
  - Fix: Vitest 5 testNamePattern breaks IDE integration [WEB-79586]
  - Fix: OpenAPI/Swagger preview unable to render openapi: 3.0.4 [IJPL-181488]
  - Fix: Add ability to add/edit/delete files in Docker Container directly from IDE [IJPL-69313]
  - Fix: "Open Diff as Editor Tab" ignores the checkbox and always behaves as checked [IJPL-165702]

  For the full list of changes in this build, please see the release notes.
