ReleaseNotes: |-
  PhpStorm 2026.3 EAP #6 is now available
  This build brings a bunch of bug fixes and quality-of-life improvements.

  Here are the most notable changes and bug fixes in this build:

  - Fix: Add vertical scroll to the left pane in Code Conversion settings [WI-86075]
  - Fix: Deployment: "Upload on save: On explicit save action" does not work [WI-86062]
  - Fix: Bundle Code Provenance plugin [WI-85979]
  - Fix: PHP 8.6: DocComments For Function Parameters [WI-85774]
  - Fix: Return type isn't inferred based on class-string with generic if string is passed as class name [WI-85714]
  - Fix: Support Type Inference based on @param-closure-this [WI-85345]
  - Fix: result array of iterator_to_array call should preserve type of iterator elements [WI-85332]
  - New: Provide support for the official CSS if() function syntax in CSS, SASS/SCSS files [WEB-76252]
  - Fix: JetBrains IDE is adding BOM markers for UTF8 files even when .editorconfig is configured to not add BOM markers [IJPL-156952]
  - Fix: TypeScript-Go: error handling method 'exit': EOF [IJPL-251969]
  - New: MCP Server: Expose "Optimize Imports" as a callable action [IJPL-237662]
  - Fix: Terminal doesn't handle multiline links (URLs) [IJPL-104682]
  - New: Creating a new GIT worktree should offer to clone the project configuration from the current project to the worktree project [IJPL-241029]
  - Fix: Markdown preview doesn't recognize absolute path links [IJPL-92231]
  - Fix: Markdown editor side-by-side preview scroll lag [IJPL-200211]
  - New: Support for OAuth authentication method for GitLab [IJPL-201684]
  - Fix: markdown preview not correctly synchronized with editor [IJPL-216713]
  - New: Markdown preview displays YAML frontmatter on a single line or hides it entirely [IJPL-94598]
  - New: Feature Request: Custom Ordering for Status Bar Items [IJPL-43620]
  - Fix: File changes not detected when created outside of PHPStorm under WSL environment [IJPL-215940]
  - Fix: Ctrl + Tab stopped calling Switcher when "Support screen readers" is on [IJPL-61208]

  For the full list of changes in this build, please see the release notes.
