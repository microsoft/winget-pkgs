ReleaseNotes: |-
  PhpStorm 2026.2.2 is now available
  PhpStorm 2026.2.2 is a minor update, and it includes a host of bug fixes and quality-of-life improvements.
  Here are the most notable changes and bug fixes in this build:

  - Fix: Allow running Behat v4 tests [WI-85769]
  - Fix: #[FileReference] support for constants [WI-85148]
  - Fix: Ctrl+Click navigation/highlighting doesn't work in .env files due to missing file type [WI-85555]
  - Fix: Rename refactoring on a file does not update its name inside #[FileReference]-annotated string arguments (__DIR__ . 'path') [WI-85177]
  - Fix: Loading remote OpenAPI specification fails and it doesn't say why [IJPL-63202]
  - Fix: Adding remote specification for OpenAPI fails when document is too large, and error message is unhelpful [IJPL-63199]
  - Fix: Terminal tabs order is not saved in IntelliJ [IJPL-212254]
  - Fix: Low contrast of checkboxes in markdown [IJPL-93391]
  - Fix: (2026.2+) Markdown Preview: Missing vertical scrollbar (JCEF rendering failure) [IJPL-251259]
  The full list of changes in PhpStorm 2026.2.2 is available in the release notes.

  - Download PhpStorm
  - Tweet us
  - Report bugs to our issue tracker
