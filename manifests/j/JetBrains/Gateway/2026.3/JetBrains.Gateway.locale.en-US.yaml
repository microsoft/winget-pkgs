ReleaseNotes: |-
  The Gateway 2026.3 is out.
  What's New in Remote Development 2026.3:
  - You can now start remote development sessions directly from the IDE - without an embedded Gateway SSH flow or any separate launcher such as the Toolbox App or JetBrains Gateway.
  - Connection recovery and diagnostics have been overhauled to make reconnecting faster and troubleshooting dropped sessions easier.
  - You can now start working sooner thanks to Light mode, which becomes available while the IDE backend downloads and launches. Once the backend is ready, the session automatically switches to full Remote Development mode.
  - The TODO tool window has been redesigned to provide a smoother user experience.
