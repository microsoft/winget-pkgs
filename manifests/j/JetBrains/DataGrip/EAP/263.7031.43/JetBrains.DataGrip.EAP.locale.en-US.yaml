ReleaseNotes: |-
  Data import with AI agents
  We’ve extended DataGrip’s database-specific MCP tools with data import. You can now ask an AI agent to import data from files into a database table. Supported formats currently include CSV, JSON, XLSX, and Parquet. With the database-data-import skill, the agent inspects the source data, suggests column mappings, and imports the data.
  For example, you can tell your AI agent, “Import films.parquet into a new films table in the public schema of mydb”. The agent creates a new films table in the public schema and populates it with data from the file.
  You can also import data into an existing table. The agent can suggest how to map the source columns to the table’s columns, even when their names differ. For example: “Import more_films.csv into the existing other_films table in the public schema of mydb”.
  Import also works with data from another table or a query result. For example, you can save a summary of customer payments to a separate table by giving the agent a query to run and asking it to import the result into a new table.
  The agent will run the query, create a new table, and populate it with the query result.
  Updated tool window bar and default shortcuts
  We’ve updated the tool window bar in the window header to include icons for Database Explorer, Database Output, Files, and Agent Sessions. The default tool window shortcuts have also changed:
  - Agent Sessions now uses Cmd+2 (macOS) / Alt+2 (Windows/Linux), previously assigned to Files.
  - Files now uses Cmd+4 (macOS) / Alt+4 (Windows/Linux), previously assigned to Run.
  - Run no longer has a default shortcut.
  You can customize these shortcuts at any time via Settings | Keymap.
  New Database Output tool window
  We’ve moved query results from Services to the new Database Output tool window. Like Services, it opens automatically at the bottom of the IDE when you run a query, a run configuration, or an SQL file.
  To show or hide the tool window, click More tool windows on the toolbar in the window header and select Database Output.
  The header combines the client selector with the Output, Query Plan, and Result tabs. By default, the contents of the tool window follow the active editor tab, showing the corresponding output, query plans, and query results.
  The session clients tree is now in a dropdown on the right side of the toolbar.
  Session management remains available in the Services tool window. To open session details for the selected client, select Manage sessions from the client dropdown.
  To switch back to the Services tool window, open the IDE Settings dialog and navigate to Database | Query Execution | Output and Results. In Show results in, select Services tool window.
  Support for MariaDB packages
  We’ve added initial support for MariaDB packages. DataGrip now introspects packages and their bodies, displays them correctly in Database Explorer, and loads their source code. You can generate their DDL, drop them, and refresh individual packages.
  In the code editor, we’ve improved support for package syntax, including IF NOT EXISTS, type declarations, user-defined parameter and return types, routine forward declarations, and CONDITION FOR SQLSTATE declarations. DataGrip also recognizes package syntax used with the default sql_mode.
  In the code editor, we've improved support for package syntax, including:
  - IF NOT EXISTS clauses in CREATE PACKAGE and CREATE PACKAGE BODY statements.
  - RECORD, REF CURSOR, and associative array (TABLE OF … INDEX BY) type declarations.
  - User-defined types for variables, routine parameters, and return types.
  - Forward routine declarations in package bodies.
  - CONDITION FOR SQLSTATE declarations.
  DataGrip also recognizes the package syntax of the default sql_mode (SQL/PSM).
  This initial support has a few limitations:
  - Some package code may still show false syntax errors or unresolved references.
  - Database Explorer does not show package members, such as routines and types.
  - Navigation between a package and its body is not yet possible.
  Open result sets in editor tabs
  You can now open query results in separate editor tabs to work with them in the main editor area without resizing tool windows or rearranging your layout.
  For result sets in the Services tool window, use the new Open in Editor Tab action:
  The same action is also available for in-editor results:
  In both cases, the result set opens in a separate tab in the main editor area:
  New SQL action for result sets
  We’ve added an SQL action that opens a popup with the query that produced the result set. From the popup toolbar, you can run the query again, copy it to the clipboard, or select the original statement in the editor.
  New Manage Columns popup
  We’ve redesigned the column list to make it easier to work with wide tables and query results. The new Manage Columns popup replaces the old Show Column List popup and lets you find columns, select the ones to display, and adjust their order in one place.
  To open it, click Manage Columns on the data editor toolbar or press Cmd+F12 (macOS) / Ctrl+F12 (Windows/Linux). Alternatively, right-click a column header and select Manage Columns. An indicator on the toolbar icon shows when some columns are hidden.
  In the popup, you can:
  - Search for columns by name and show or hide all matching columns at once.
  - Show or hide individual columns using the checkboxes, or press Space to toggle the visibility of selected columns.
  - Drag column names to change their order in the grid. Alternatively, select a column and press ⌥↑ or ⌥↓ (macOS) / Alt+Up or Alt+Down (Windows or Linux).
  - Right-click columns to pin or unpin them, copy their names and data types, or restore the original column order.
  - Press Enter or double-click a column to close the popup and navigate to it in the grid. If the column is hidden, DataGrip makes it visible.
  Each column’s data type appears next to its name, and pinned columns are grouped at the top of the list. Changes to column order and pinning are immediately reflected in the grid.
  Automatic column sizing in the data editor
  You can now automatically resize columns to fit the available width of the data editor. This makes it easier to view tables with many columns without adjusting each column individually.
  To do this, right-click a column header and select Fit Columns to Window. To restore the default widths, select Reset Columns Width from the same context menu.
