ReleaseNotes: |-
  AI
  - The bundled JetBrains Air lets you run SQL, explore data, and reference database objects directly in chats with AI agents.
  Connectivity
  - DataGrip now supports cross-database queries.
  - DuckDB is fully supported.
  - Database connections are disabled in untrusted projects.
  UI and UX improvements
  - Query results now appear in the dedicated Database Output tool window.
  - The tool window bar and default shortcuts have been updated.
  Working with data
  - The new Open in Editor Tab toolbar button opens a query result set in a separate tab in the main editor area.
  - The new SQL toolbar button opens a query result set’s original query.
  - The ability to pin columns has been added to the data editor.
  - The new Manage Columns popup lets you find columns, select the ones to display, pin them, and adjust their order.
  - Automatic column sizing has been added to the data editor.
  Query consoles
  - Transaction control in query consoles received a few improvements.
  Database support
  - MariaDB sequences and packages are now supported.
  - PostgreSQL 19 is now supported.
