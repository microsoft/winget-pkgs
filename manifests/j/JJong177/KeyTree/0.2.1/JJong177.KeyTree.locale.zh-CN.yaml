ReleaseNotes: |-
  新增与优化
  - 账号侧栏筛选、过长名称主题提示，账号自动补全及凭据字段独立复制。
  - 网址优先录入并自动获取网站标题；失败回退域名，不覆盖手动输入的标题。
  - 账号预填、不阻塞保存的相似条目预览；凭据候选优先当前账号和最近使用。
  - 批量移动、追加标签及移至回收站；保存失败仅重试保存，不提供永久批量删除。
  - 底部紧凑同步状态与详细提示。
  - “关于”页显示应用版本，支持启动时后台限频检查、手动检查、新版提示、纯文本更新说明和官方安全下载链接。不弹窗，不自动安装或重启。
  安装说明
  - 下载下面的 KeyTree-Setup.exe（Windows x64）。
  - 安装包未签名，Windows 可能显示 SmartScreen 或未知发布者提示。
  - 已安装 0.2.0 的用户需先手动安装 0.2.1，之后才能收到后续版本提醒。
  - 本次未执行安装程序；安装包不包含个人密码库、密钥或同步凭据。
  验证
  229 项应用/单元测试、20 项更新界面检查、65 项 Rust 测试、TypeScript 检查及 Windows x64 NSIS 构建通过。
  English summary
  Account filtering, credential reuse, URL-first entry creation, safe bulk organization, compact sync status, and silent/manual release checks in About. No automatic installation or restart. Unsigned Windows x64 installer; users on 0.2.0 must first manually install 0.2.1 to receive future update reminders. The installer was built and checked but not executed as part of this release.
