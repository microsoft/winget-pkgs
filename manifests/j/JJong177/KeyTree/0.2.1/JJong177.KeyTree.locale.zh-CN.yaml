PackageIdentifier: JJong177.KeyTree
PackageVersion: 0.2.1
PackageLocale: zh-CN
ShortDescription: 面向 Windows 的本地优先密码管理器，把账号、密码和动态验证码存在你自己的 .kdbx 加密文件里。
Description: |-
  KeyTree 是一款面向 Windows 的本地优先密码管理器。把账号、密码和动态验证码整理在自己的 .kdbx 加密文件中，通过分组与搜索找到它们，用快速面板、复制或自动输入完成日常登录。
  密码库采用 KDBX 4 格式，使用 AES-256 与 Argon2id。KeyTree 提供分组、标签与搜索、TOTP 动态验证码、密码与短语生成、带全局快捷键的快速面板、Windows Hello 与 DPAPI 快速解锁、闲置自动锁定、剪贴板清理、隐藏截图、托盘常驻、可选开机自启和密码库体检；支持从 Chrome / Edge / KeePassXC 导入 CSV，在密码库文件旁保留带版本的备份，并可通过自己的 WebDAV 服务手动同步或锁定时同步。
  不配置云服务，也能管理本地密码库。应用界面目前为中文。
