ReleaseNotes: |-
  ## What's Changed
  • Fix SVT-AV1 regression on legacy Windows versions (Server/LTSB 2016) by @nyanmisaka in https://github.com/jellyfin/jellyfin-ffmpeg/pull/787
  • Remove VideoToolbox caption SEI merging by @gnattu in https://github.com/jellyfin/jellyfin-ffmpeg/pull/788
  • Fix SSE2 scene detection with unaligned input by @gnattu in https://github.com/jellyfin/jellyfin-ffmpeg/pull/797
  • Skip oversized A53 caption SEI in QSV H264 encoder by @nyanmisaka in https://github.com/jellyfin/jellyfin-ffmpeg/pull/801
  • Fix vf_hwmap crash during graph reinitialization by @nyanmisaka in https://github.com/jellyfin/jellyfin-ffmpeg/pull/801
  • Improve QSV DX11-OCL sharing performance by @nyanmisaka in https://github.com/jellyfin/jellyfin-ffmpeg/pull/801


