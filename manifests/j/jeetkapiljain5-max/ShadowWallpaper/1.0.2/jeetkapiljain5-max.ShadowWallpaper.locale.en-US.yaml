ShortDescription: A live wallpaper for Windows with a liquid-glass clock, a Mac-style Launchpad and live lyrics.
Description: |-
  Monochrome stripes that move with your mouse and bounce to your music, a liquid-glass clock, a Mac-style
  Launchpad with a smart search bar, and a Now Playing view that turns the clock into the album cover with
  time-synced lyrics - or plays the music video itself. Runs on Lively Wallpaper (installed for you if it's missing).
  After installing, open Shadow Wallpaper from Start once to set it up.
  Tip: pair it with TranslucentTB (CharlesMilette.TranslucentTB) for a see-through taskbar and a cleaner look.
