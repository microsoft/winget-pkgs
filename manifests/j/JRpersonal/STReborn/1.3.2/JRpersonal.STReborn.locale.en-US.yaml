ReleaseNotes: |-
  STR v1.3.2
  Built from commit: 7e90d8712a04c362e159fa0fae5da70fb6746031
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41360221542
  What's changed in v1.3.2
  New features
  - A maximum volume per speaker that the app, Spotify, the remote and the speaker's own buttons cannot go past (volume)
  Fixes
  - The failure report names a speaker in a different network than the PC instead of calling it switched off (app)
  - A paused file that STR restarts no longer plays its first seconds before it continues (playback)
  - The bass setting is called Bass reduction on speakers that can only take bass away (settings)
