ReleaseNotes: |-
  STR v1.4.1
  Built from commit: 8fbe2e0664bab5c96d571876c75c46efef3e70bc
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41617247011
  What's changed in v1.4.1
  New features
  - The shuffle and repeat buttons show a mode set in the app or another remote (phone)
  Fixes
  - Speakers > Groups no longer jumps back to the top every few seconds while you set up a group (app)
  - A folder key with shuffle started from the app or the phone begins on a random song, not always the same one (library)
  - The stereo pair name field starts with the name you typed last (multiroom)
  - During a software update without network the phone waits quietly and then says the speaker stopped the update (phone)
  - Report a problem says to attach the diagnostic file to a bug report on GitHub (phone)
  - A music library folder that is already on a key is not saved on a second key by accident (presets)
  - A Spotify preset with shuffle starts straight on a random song (spotify)
  - A shuffle preset that needs a second try no longer shows a skipped song in the Spotify app (spotify)
