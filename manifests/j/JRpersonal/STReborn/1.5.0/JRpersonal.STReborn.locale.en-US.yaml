ReleaseNotes: |-
  STR v1.5.0
  Built from commit: 7b962c122708cfa916386661386ec73639508a6d
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41695854933
  What's changed in v1.5.0
  New features
  - UI 2.0 always shows the ways to support STR at the foot of the sidebar (app)
  - UI 2.0 gives the sidebar to the speakers and moves the menu into tabs above the page (app)
  - UI 2.0 puts the familiar coffee line above the sidebar's support buttons (app)
  - When a speaker can't be reached, the app now says if a VPN or the missing macOS Local Network permission is the cause (app)
  - When the music drops out on a speaker with a weak Wi-Fi signal, the app says so on that speaker (app)
  - Check why a speaker is not answering, with the steps to fix it (desktop)
  - Old speakers of every model get their documented update steps, never the single jump that stalls (firmware)
  - Installing STR now removes AfterTouch's leftover files from the speaker (install)
  - Explain when a media server no longer has the music on a key (library)
  - Say when a station's address cannot be looked up, naming the router's DNS and ad-blockers such as Pi-hole (radio)
  - A thumbs key can now start a 90-minute sleep timer (remote)
  - The setup page says when a speaker is still set up for AfterTouch or another cloud replacement (setup)
  - The speaker list says before the install when a model is untested or not a SoundTouch (setup)
  - Explain why Spotify refuses an account on (STR) and how to check it (spotify)
  - Show a step-by-step checklist when a speaker stays dark after an update or install (update)
  Fixes
  - In UI 2.0 the speaker update card no longer scrolls when several speakers are behind (app)
  - UI 2.0 draws the PayPal button's second word in a blue that is readable on the gold (app)
  - When a speaker accepts the restart after the install but never restarts, the app now forces the restart (install)
  - The app's search now finds songs on media servers that don't support DLNA search, like the phone page already did (library)
  - The setup page also names a speaker that AfterTouch's own SSH unlock left behind (setup)
