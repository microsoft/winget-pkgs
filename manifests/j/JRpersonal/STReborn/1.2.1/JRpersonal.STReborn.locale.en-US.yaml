ReleaseNotes: |-
  STR v1.2.1
  Built from commit: bd308c58d135be3e3ce791c42b75f532ec55f3a7
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41077649383
  What's changed in v1.2.1
  New features
  - A speaker on a network cable can forget its Wi-Fi network (app)
  - Star a station from the phone remote's search, and it shows up in the desktop app and on every speaker (favourites)
  - A "From here" button on every track plays the folder from that track on, so an audiobook picks up where you left it (library)
  Fixes
  - A speaker on cable and Wi-Fi at once shows as one speaker and uses the cable (app)
  - A preset from a media server keeps playing after the server restarts (library)
  - A speaker set up again through the Bose setup page is no longer pulled out of its setup mode (setup)
  - The feedback link on the Spotify page opens a new bug report instead of a long-closed issue (spotify)
  - When Spotify refuses a track's key, the app says so instead of the speaker skipping through the playlist (spotify)
  - A speaker on a network cable no longer restarts its unused Wi-Fi when the cable connects a few seconds late at startup (wifi)
  - Changing the Wi-Fi on a SoundTouch Portable restarts it 20 seconds sooner (wifi)
