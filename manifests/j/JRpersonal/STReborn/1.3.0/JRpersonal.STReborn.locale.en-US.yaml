ReleaseNotes: |-
  STR v1.3.0
  Built from commit: 20fef791591e7d4d8806308af2a9352f3d993dae
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41227012786
  What's changed in v1.3.0
  New features
  - The UI 2.0 preview (Aa menu, Layout) now covers every view: Radio, Spotify, Library, Recently played, Speakers, Groups, setup and a new Help and info page (app)
  - The UI 2.0 preview has no dead ends: no speakers, a failed search or an offline speaker each say what to do next (app)
  - The UI 2.0 preview reports a problem in the row, key or card where it happened, and says done only once the speaker confirmed (app)
  - The UI 2.0 preview's setup wizard checks the speaker's firmware and brings it to 27.0.6 before it installs STR (app)
  - The display settings show an example of what the speaker's display will look like for the chosen options (display)
  - The phone remote's Aa menu can switch to a preview of the new UI 2.0 layout (remote)
  Fixes
  - An older SoundTouch 20 restarts only STR after an update instead of rebooting, which could leave it dark until unplugged (installing this version itself may still need one last unplug) (agent)
  - The speaker's log no longer fills up with certificate refusals from other devices on the network, such as Amazon Echo speakers (agent)
  - A Spotify key shows the name of the account it was saved with in the desktop app too (app)
  - Holding a key to save a Spotify playlist no longer stores it on another speaker picked in the meantime (app)
  - The app shows the Bose trademark notice in its credits and on the phone remote (app)
  - The firmware guide asks whether the USB update started before it offers a smaller file (app)
  - The power button in the app wakes a sleeping speaker and lights up like the one on the phone remote (app)
  - A speaker without a display, such as the SoundTouch 10, no longer offers the setting to show the track on its display (display)
  - Every screen on the speaker display now uses the smooth font, including the number in the preset key (display)
  - Forming a group no longer leaves a Pandora key lit as paused on the main speaker (groups)
  - A track the speaker refuses now shows the restart hint instead of a format guess, and a Mac's hidden "._" files are no longer listed (library)
  - A speaker with an older Pandora account that is not signed in now asks you to sign in instead of saying it is connected (pandora)
  - Updating a grouped speaker from the phone now says beforehand that it leaves its group (phone)
  - A paused song is no longer switched to internet radio by a preset re-sync (presets)
  - Saving onto a key's second row with a tap and a hold no longer shows a warning that the key could not be saved (presets)
  - Station names in the phone remote's search results no longer shrink to one letter per line (remote)
  - The speaker language setting no longer calls itself experimental (settings)
  - A speaker that is still finishing an update is no longer offered a first install (setup)
  - The speaker list says an update is finishing instead of "STR not running" while it does (setup)
  - A Spotify preset on a speaker with a free Spotify account now explains that it needs Premium and how to fix it (spotify)
  - The note about groups during an update now uses the app's own button names (update)
