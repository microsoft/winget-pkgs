ReleaseNotes: |-
  STR v1.5.1
  Built from commit: 7848149f7fae8d0ab9f173e177ecfdc01914cba8
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41742929026
  What's changed in v1.5.1
  New features
  - Playing a folder of folders shows how many tracks it has collected so far (library)
  Fixes
  - The phone remote shows a folder key's cover again once its music server is back, without a page reload (app)
  - After an STR update a sleeping speaker shows its standby clock again (display)
  - A folder played from a preset key shows the key's cover in Recently played, also with shuffle (library)
  - A single song of unknown length that you pause and resume on the speaker keeps playing instead of being stopped right after the resume (library)
  - Replaying a Recently played album that was started from a preset key plays the whole album again, not only its first song (library)
  - The clock setting says "not supported on this model" on the Wireless Link Adapter and the SA-4/SA-5, which have no display (settings)
