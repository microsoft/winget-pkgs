ReleaseNotes: |-
  STR v1.3.1
  Built from commit: d1d287bb5b5f97facba775b24924bbd429e0abcf
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41328535853
  What's changed in v1.3.1
  Fixes
  - The speaker settings no longer repeat the key transfer, and the key repair moved to Advanced (app)
  - A speaker added to a paused group shows the pause the user made (groups)
  - A speaker that joins a group no longer shows the main speaker's stopped station as paused (groups)
  - A folder started on a sleeping speaker plays on past its first song again (library)
  - A library preset whose music server is off now says so in the app and on the phone (library)
  - A preset key holding a file that changes every day plays it to its end again (presets)
