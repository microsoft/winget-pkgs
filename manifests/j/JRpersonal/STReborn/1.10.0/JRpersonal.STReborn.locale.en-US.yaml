ReleaseNotes: |-
  STR v1.10.0
  Built from commit: 0bcd6ccb259970b8c1a376684c2c60d9e93eaa5e
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/45865422036

  What's changed in v1.10.0

  New features
  - An announcement's answer says how long it plays (api)
  - GET /api/nowplaying answers what the speaker plays as JSON (api)
  - In the new layout, holding a key saves what is playing onto it, as in the classic layout (app)
  - Large text on the sticker sheet uses one even size per sticker and is on by default (app)
  - Resting the pointer on a search result's bitrate shows the address the station streams from (app)
  - The printable sticker sheet also explains how to put the remote on a phone's home screen (app)
  - A Deezer login that another one replaces is kept as a backup, and "Use the older login" puts it back when Deezer refuses the new one (deezer)
  - The Deezer area shows each speaker's Deezer login and copies one to another speaker on request (deezer)

  Fixes
  - Songs from a USB stick in the speaker now show their artist and album (agent)
  - A speaker that stays dark after a restart needs several hours without power, not minutes (app)
  - A stereo pair's keys name the pair in every key message, not its left speaker (app)
  - Language and genre names with accented letters are capitalised correctly (Español instead of EspañOl) (app)
  - Large text on a sticker keeps long names close to the size of the others (app)
  - The Spotify notice no longer promises a Spotify entry without (STR) on speakers that do not show one (app)
  - The advice to leave a speaker without power for hours appears only after a restart STR knows of (app)
  - The language list in the radio search says the number after each language is its station count (app)
  - A group member that also catches the main speaker's remote press no longer acts on it (group)
  - A group member that reported in after its update rejoins at once, even while it is still busy starting (group)
  - A permanent group re-forms promptly after a member's update and within seconds of a remote press (group)
  - A playing station no longer falls silent a minute after an agent update (update)

