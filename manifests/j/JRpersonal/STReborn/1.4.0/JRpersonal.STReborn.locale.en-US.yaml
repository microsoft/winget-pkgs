ReleaseNotes: |-
  STR v1.4.0
  Built from commit: c272d38a36e0c1fe3994e576a162f56e1aa3eb13
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/41498212956
  What's changed in v1.4.0
  New features
  - Alarms stay silent on days you add to a list, such as public holidays (alarm)
  - An alarm can switch the speaker off at a set time of day, like 20:00 (alarm)
  - Speakers with a display show the song, the station or playlist and the clock during playback by default (display)
  - The speaker's clock comes back on its own after a restart or when the speaker drops it (display)
  - Sort your starred favourites with up and down buttons, in the app and on the phone remote (favorites)
  - A thumbs key on the remote can start the sleep timer with a fixed length of 15, 30 or 60 minutes (keys)
  - A thumbs key on the remote can switch shuffle and repeat while a Spotify playlist plays (keys)
  - Back on the remote goes to the previous song of a Spotify playlist when you press it in the first 10 seconds of a song (keys)
  - While a radio station from a preset plays, Next and Previous on the remote switch to the next or previous radio key (keys)
  - A folder that only holds subfolders, like an artist with one folder per album, can now be played and put on a key (library)
  - The music library can sort folders and tracks A to Z, with "_" and digits first (library)
  - Star a Pandora station so it sits in your favourites next to the other stations and plays from there (pandora)
  - The phone remote shows each Pandora station's cover in the Pandora list (pandora)
  - Copy only the keys you choose to another speaker, the other keys there stay as they are (presets)
  Fixes
  - The speaker display settings show each explanation right under its own switch (app)
  - The speaker display shows the station and song again when you play the same station after switching off or after an update (display)
  - A permanent group comes back after a group key or speakers added by hand (groups)
  - The preset keys no longer stay empty for up to five minutes after a speaker starts (presets)
  - The app and the phone page say when Spotify refuses an account on (STR), until it plays again (spotify)
  - A speaker that keeps its Wi-Fi but gets no address from the router reconnects on its own (wifi)
