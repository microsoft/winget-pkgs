ReleaseNotes: |-
  STR v1.10.1
  Built from commit: daf661208cb4982aa759dffb3dca745f7c2aeef3
  Workflow run: https://github.com/JRpersonal/streborn/actions/runs/46073138819

  What's changed in v1.10.1

  New features
  - A saved Deezer login can be put back onto a speaker from a backup file (app)

  Fixes
  - A station without a known bitrate also shows its stream address when the pointer rests on its line (app)
  - Installing STR saves a speaker's Deezer login before anything on the speaker changes (app)
  - The station search finds a station whose name is written together or apart differently from what was typed (app)
  - A single song from the library or the USB stick shows its artist on the speaker display (display)
  - An artist's folder started as a whole shows the album on the speaker display instead of the artist twice (display)
  - A group speaker joins within seconds when the main speaker is switched on (groups)

