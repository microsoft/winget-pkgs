ShortDescription: Disk space visualizer that shows your drive as a treemap
Description: |-
  SpaceMonger scans a drive, folder or network share in seconds and draws every folder and file as a box sized by the space it takes, with name, size and date written on it. The big boxes are what fills your drive, so you see at a glance where the space went without opening a single folder.
  Find and remove forgotten videos, ISO images or download folders, empty temporary files, caches and the Recycle Bin in one click, inspect a colleague's drive over the admin share, or collect CSV and HTML reports from a logon script without a window.
  Native C++/MFC, one standalone executable, multithreaded live scan, x86, x64 and ARM64. Modernized fork of the classic SpaceMonger by Sean Werkema.
