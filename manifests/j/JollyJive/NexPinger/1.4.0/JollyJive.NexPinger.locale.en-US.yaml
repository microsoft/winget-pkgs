ShortDescription: A CUI tool that keeps monitoring many hosts over ICMP, TCP and UDP.
Description: |-
  NexPinger keeps checking many hosts over ICMP, TCP and UDP (DNS, NTP, QUIC), each on its own interval.
  It streams one line per result, and on a terminal it can switch to a statistics screen with loss rate, average, P95 and P99.
  Results can also go to a log file as text, TSV or JSON Lines.
