ReleaseNotes: |-
  修复
  - 后台索引更新不再静默：启动缓存恢复/增量对账、磁盘变更自动刷新、快照归档操作
    每次重建索引都会向前端广播事件——侧边栏显示"索引更新中…"转圈，完成后若有新增
    会话弹出提示，会话列表和控制台自动刷新（新增来源如 DSH 的会话不再"迟到且无提示"）。
  - 会话档案页顶栏在默认窗口宽度下，搜索框被来源/范围按钮挤压到看不清占位符的
    问题：顶栏改为可换行，搜索框保底 220px 宽。
  - 操作指南补齐 DeepSeek Harness：数据目录与 DSH_HOME、会话代际/压缩格式、快照范围、
    能力矩阵，以及自定义恢复命令模板与各桌面端预设的说明；下载一节修正为实际发布产物。
