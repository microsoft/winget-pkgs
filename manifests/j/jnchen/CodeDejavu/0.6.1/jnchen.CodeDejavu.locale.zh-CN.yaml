ShortDescription: 统一浏览和管理 Claude Code、Codex CLI 与 OpenCode 留在本机的会话、指令和配置资料的本地桌面工具
Description: Code Déjà Vu 是一个基于 Tauri、SvelteKit 与 Rust 的本地桌面工具，用于统一浏览和管理 Claude Code、Codex CLI 与 OpenCode 留在本机的会话、指令和配置资料。会话解析、搜索索引和配置管理均在本机完成。应用不会把会话内容上传到项目维护者的服务；手动检查更新时会访问 GitHub Release 更新地址。
