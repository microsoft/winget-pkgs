ShortDescription: A local desktop tool for browsing and managing sessions, instructions, and configuration left by Claude Code, Codex CLI, and OpenCode
Description: Code Déjà Vu is a local desktop tool built with Tauri, SvelteKit, and Rust, for browsing and managing in one place the sessions, instructions, and configuration that Claude Code, Codex CLI, and OpenCode leave on your machine. Session parsing, search indexing, and configuration management all happen locally. The app does not upload session content to the maintainer's services; manual update checks access the GitHub Release endpoint.
