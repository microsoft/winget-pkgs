ReleaseNotes: |-
  修复
  - 修复 Codex 已保存的旁路会话（/side、/btw）被误读为独立顶层会话的问题：这类记录会
    在列表里重复出现父会话内容，并污染统计与搜索索引。现在它们挂回父会话，在详情页以
    💬 旁路问答 单独展示，不计入子代理数量、会话大小和索引；父会话不存在时保留为带
    「旁路」徽章的条目。
  - 文档补充数据边界：只解析 Agent 已落盘的本地格式；Claude Code 终端的 /btw（内存浮层）
    与 Codex 未附加的 side conversation（不写 rollout）不在可读取范围内。
