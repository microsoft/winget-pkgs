# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

# Generated by komac and kept in sync with what was actually submitted, so the
# next release starts from the real thing rather than from a draft.
#
# InstallerType portable because the exe has no installer: winget copies it and
# registers an alias. That makes Commands load-bearing — winget's alias order is
# Commands[0], --rename, PortableCommandAlias, then the file's own name, so
# without it the command would be "rpgp-v0.1.3-x86_64" and would change every
# release. Portable also means no Start Menu entry.
PackageIdentifier: jzbz.rPGP
PackageVersion: 0.1.3
InstallerType: portable
UpgradeBehavior: install
Commands:
- rpgp
ReleaseDate: 2026-09-01
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/jzbz/rpgp/releases/download/v0.1.3/rpgp-v0.1.3-x86_64.exe
  # Matches the entry for this file in the release's PGP-signed SHA256SUMS.
  InstallerSha256: EBE8CF88B3528251DDAFF35A01AC0454999DD6BEE3642F3F0BF7325B06C0F056
ManifestType: installer
ManifestVersion: 1.12.0
