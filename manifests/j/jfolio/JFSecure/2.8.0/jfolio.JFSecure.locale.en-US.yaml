ShortDescription: "Secrets and snippets at a global hotkey: offline encrypted vault with a deniable password, CLI and SSH agent"
Description: |-
  Press a global hotkey in any app, pick a secret in a small search palette, and its value lands in the clipboard (or is typed in).
  Values can be templates, 2FA codes or micro-tools. The vault is encrypted locally; every password opens some vault, so there is no "wrong password".
  The jfs command line hands values to scripts, git and AI agents (MCP) only after you approve each use; SSH keys are served by a built-in agent.
