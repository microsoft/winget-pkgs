ShortDescription: A Civilization V-style 4X game whose players can be language models
Description: |-
  CITAR - Civ Inspired Tool for AI Research - is a turn-based strategy game in the style of
  Civilization V, built so that the other players, or all of the players, can be AI models.

  Humans play in the browser. Models join through MCP (Claude Code, Claude Desktop, any MCP
  client), through the Anthropic API, or through any OpenAI-compatible endpoint such as LM Studio,
  Ollama, llama.cpp or vLLM. A scripted bot is included to play against and to measure models
  against, so the game is fully playable with no model at all.

  The rules and numbers come from UnCiv's "Civ V - Gods & Kings" ruleset: all nine eras, 35
  civilizations, 40 city-states, religion, social policies, great people, espionage, the United
  Nations and nuclear weapons.

  For research, it can run full-game benchmarks across several models, replay prepared scenarios to
  probe specific decisions, record per-turn metrics, and produce costed reports of what each
  experiment consumed in hardware time, energy and tokens.

  CITAR sends nothing anywhere. It runs on your machine and connects only to the model endpoints
  you configure.
