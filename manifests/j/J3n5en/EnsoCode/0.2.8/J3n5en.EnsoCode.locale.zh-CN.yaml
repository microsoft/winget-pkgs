ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 子代理单次 Run 的模型请求软预算
  - 超长纯文本粘贴自动存为 txt 附件
  - 选中忙碌成员时区分补充与新任务，插话等待提示与排队分开
  - 智能选人感知忙碌成员及其当前任务
  - 等待行可展开查看子代理进度，并提供「不等了」按钮
  - 子代理阻塞等待可被插话/不等了打断，wait 默认 5 分钟上限 10 分钟，超时返回进度，完成自动通知父会话
  - 成员与群记忆支持手动编辑
  - 进度行按开工/卡住/交付区分样式，#N 打开任务卡；挂任务的委派结果卡默认折叠（P5 前端）
  - 卡住界面——看板分开显示缺信息与执行失败、等谁回复与已卡时长，收件箱与委派卡可直接回复（P4 前端）
  - 群里公开进度——开工/卡住/交付 progress 条目替换对应 system 行（P5）
  - 委派卡住——report_blocked、blocked 状态、软停止与任务卡回复（P4）
  - 历次执行显示追加，并入的追加卡标「已并入 #N 当前执行」（P3 前端）
  - 看板退回返工，查看过程按执行分隔（P2 前端）
  - 同一发起会话给执行中的任务追加要求时并入当前执行（P3）
  - 委派按「任务 × 成员」延续会话，失败保留负责人，退回可返工（P2）
  - 任务卡显示历次执行（P1）
  - 群聊委派自动建卡并记录执行（P1）
  - 委派与群任务加执行记录字段（trigger、startedAt、runs、sessions）
  - 支持原生窗口按钮与贴靠布局
  - 增加跨分组的「最近」项目视图
  - web_search 全局候选链 + Antigravity googleSearch grounding
  - kimi-coding 订阅接入用量展示
  🐛 问题修复
  - 补 DeepSeek Base URL 切换测试并修正格式
  - 粘贴附件路径含空格时气泡显示为卡片、标题剥掉路径
  - 单独删除话题时清理其超长粘贴文件
  - DeepSeek 切换 API 类型时同步官方 Base URL
  - Google 适配器不再注入自定义 fetch
  - 子代理等待交付去重与 workflow 长成员
  - 前台命令默认 120 秒转后台（原 600 秒）
  - AI 生成人设与自动设置能力放宽超时到 90 秒
  - 批次等待提示不再用「卡住」，写明是这批还在等谁
  - 人在看板上改派时，新成员拿到任务的 （P2 补第 17 条）
  - ask_user 出现时自动聚焦回答输入
  - 分离 OpenAI Codex 与 ChatGPT PI 登录入口
  - enforce search candidate identity and availability
  - preserve discovered models and migration selection intent
  - 探针不再把推理模型的空正文判为模型不可用
  - 候选链推送解析运行时 providerId 并注册克隆模型
  - OAuth 条目候选过滤推导真实 api（修复 Antigravity 遗留占位被误滤）
  - 子代理类型级 thinkingLevel/reasoning 在 typed-spawn 路径被静默丢弃
  - 导航与搜索跳转误叠 Virtuoso 原点，被钳到末行
