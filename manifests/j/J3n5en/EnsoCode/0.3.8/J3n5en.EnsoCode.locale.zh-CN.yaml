ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 秘书 Agent —— 派发、工具、看板、Telegram 与记忆 (#236)
  - 会话支持静音，只屏蔽推送与系统通知
  - 新增 agent.run 只读代理与 ui.view.close
  - 顶栏会话标签支持移出，有新消息后重新出现
  - 悬停用户提示词即可复制原文 (#235)
  - Finder 拖放时在屏幕右上角弹出投放浮窗 (#233)
  - 拖拽文件或文件夹到窗口任意位置，弹窗选择操作 (#231)
  🐛 问题修复
  - 回前台换链后补发 remote-ack 恢复压缩，rpc-ready/末帧丢失时看门狗重新 hello 并提示恢复中
  - 宿主读缓存扩到 64 条，避免历史尾窗挤掉设置基线导致整份重下
  - CDP 截图后重新对齐 guest 尺寸，修复 Windows 侧栏浏览器下方残留/白屏
  - 面板 tab 条升进顶栏时可拖动窗口 (#232)
  - Windows 顶栏按钮点击不再被窗口拖拽区吞掉 (#230)
