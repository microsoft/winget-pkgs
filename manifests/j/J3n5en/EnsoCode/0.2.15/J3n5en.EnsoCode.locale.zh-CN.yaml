PackageIdentifier: J3n5en.EnsoCode
PackageVersion: 0.2.15
PackageLocale: zh-CN
ShortDescription: 本地优先的桌面 Agent 工作台：一个人，带一队自主编程智能体。
Description: EnsoCode 是基于 Electron 与 pi 编码智能体框架的本地优先桌面 Agent 工作台：仓库挂在侧栏，一件事一个会话，同仓库并行可选用 Git Worktree 隔离；一次性任务派给 Subagent，长线协作交给 Coworker；Diff 嵌在时间线里，提供三档审批与 Git Checkpoint 一键回滚；审批与进度可推送到端到端加密的手机伴侣，还能一键导入本机 Claude Code / Codex / Cursor 的配置、密钥、MCP 与历史会话。
