ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 主题 CSS 可用相对 url() 引用插件内图片和字体，拒绝引用 local-image
  - 侧栏改为方案 E 的安静列表布局
  - 去掉侧栏 Ask Enso 按钮，设置改为左对齐的整行入口
  - 滚动条改为滚动时才显示的 4px 浅色细滑块
  - 右侧面板开关移到窗口顶栏；Code/Bot 切换按对话卡片居中
  - 右侧面板与对话区合成一张卡，tab 条透明落在顶栏行，圆角随面板开合落在最右侧
  - mac 右侧面板伸进顶栏行，tab 条与顶栏齐平、左边线做分割
  - Code/Bot 切换回到顶栏正中
  - 桌面端常驻窗口顶栏（侧栏开关 / Code·Bot 切换 / 搜索 / 新对话），开关不再随折叠在侧栏上下跳动
  - mac 折叠侧栏时窗口顶部出现工具栏（展开/搜索/新对话），折叠栏回到 48px 落在其下
  - 画廊加载插件主题，选中后注入 token 与主题 CSS
  - 插件主题贡献点与样式授权
  - 外观页主题画廊与 user.css 自定义样式
  - 对话区改为方向 E：640px 窄列、去助手头像、工具调用淡灰单行、圆角输入框
  - 设置窗口改为画布 + 卡片外壳
  - 主窗口改为画布 + 卡片外壳，标题栏并入卡片顶栏
  - 主题核心：调色板派生 token、内置主题与强调色跟随主题
  - composer 挂点传入当前会话生效的插件预设
  - 安装/更新确认改为弹窗，更新按钮显示下载中状态
  - 设置侧边栏顶部搜索，按设置项过滤分类并跳转高亮
  - 设置侧边栏按应用/模型与智能体/工具与扩展/连接/系统分组
  🐛 问题修复
  - 启动时先用上次生效的主题快照，完整模式不再先闪回默认主题
  - 新建标签页按钮移到全屏按钮左侧
  - Windows 右侧面板与 mac 一致升入顶栏，侧栏开关与折叠栏图标对齐
  - 去掉侧栏与对话卡片间的 8px 缝，侧栏滚动条贴住卡片边缘
  - 列表右侧不再额外留白，滚动条落在原右边距内
  - 顶栏态面板底边/右边描边与阴影不再被自身裁掉，与对话卡片一致
  - 卡片左/上 1px 描边改用让位 padding，修复左边框仍被裁掉
  - 面板视图顶部工具条固定 36px，与对话卡片 tab 行底线对齐
  - 卡片左缘 1px 描边不再被工作区裁掉
  - 顶栏态右侧面板补上右上圆角
  - mac 折叠栏加宽到红绿灯右缘外 8px，窄侧栏顶行按钮不再压住节点切换器
  - 回合末悬停条不再重复显示时间，交给末尾的模型 · 时间行
  - 强调色跟随主题时不进导出包，避免旧版本整包拒绝导入
  - 内嵌浏览器原生视图贴卡片底边时跟随卡片圆角，挖孔同步切圆
  - 运行中回合不显示模型与时间，回合结束后才挂到末尾
  - 只带主题 CSS 的插件安装确认不再先说无特殊权限
  - 右侧面板宽度上限按卡片 8px 缝计算，聊天区保住最小宽度
  - 同步终端主题与手机 PWA 补齐外壳 token
  - 自绘文件头高度同步给 CodeView，修复全折叠时下方空白
  - 插件报错支持展开查看全文
  - 新对话发送前斜杠菜单按所选预设列出插件 skill
  - 弹窗内的下拉默认浮在弹窗之上
  - 叠加插件预设下拉被预设编辑弹窗盖住
