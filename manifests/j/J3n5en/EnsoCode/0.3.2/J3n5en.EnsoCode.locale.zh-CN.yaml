  🐛 问题修复
  - 顶栏态全屏时面板仍升进顶栏行，tab 条与顶栏齐平
  - Markdown 标题按 em 分级，列表与行内代码跟随正文字号
  - 子代理合同约束共享工作区，完成通知把报告标成待核实材料
  - 桌面侧栏改成与对话卡片一样的圆角
  - 开壁纸时给 Code 侧栏补一层与面板同档的遮罩
  - 分组条底线与会话标签栏对齐
  - 合成的 agent-notification 以 extension 来源投递，避免被插件 input 拦截改写
