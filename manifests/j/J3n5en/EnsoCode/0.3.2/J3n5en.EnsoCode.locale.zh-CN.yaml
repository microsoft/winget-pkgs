ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 子代理记录图标旁显示记录数量 (#192)
  - 子代理跑完后可在右上角回看对话记录 (#191)
  - 壁纸遮罩可调，侧栏不再单独铺底
  - 插件市场按标签筛选，安装按钮与已安装文案对齐
