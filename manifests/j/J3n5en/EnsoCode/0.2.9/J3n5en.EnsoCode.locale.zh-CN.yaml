ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 标注只对新会话生效的设置 (#140)
  - 支持配置文件链接右键打开方式 (#138)
  - 增加精简版本控制面板 (#137)
  - 代码形式的本地文件链接把定位按钮并入代码框
  - 同条目重名模型在名称下一行显示 id
  - 后台任务新增 level 全量快照事件，静默清理与漏掉的 edge 事件都能收敛
  - 待投递完成通知队列加容量上限与溢出日志
  - 等待行改为 Main 推送进度快照并预览回复尾巴，轮询降为 5s 兜底
  - 子会话系统提示词注入防注入边界与交回形态合同
  - 工具指引与后台回执补齐反编造/知识边界合同
  - 完成通知截断注明长度并附 usage
  - 最近项目只保留 7 天内有未归档会话的
  - 瞬态错误自动重试可设次数或无限
  - 文件分类打开与应用关联设置 (#135)
  - read 图片展开为缩放预览，运行中随文件改动自动展开 (#134)
  🐛 问题修复
  - 已选该服务器的当前会话在授权后下一条消息即可使用
  - 兼容带前导斜杠的 Windows 文件链接 (#143)
  - 修复提示符图标缺字与单列裁切 (#141)
  - 已打开的对话在下一次压缩时使用最新摘要模型
  - 直连 MCP server 的 instructions 注入 system prompt，模型按 server 指引优先使用其工具
  - 补设置测试的右键打开状态并修正 #137/#138 格式
  - Anthropic 拉取模型取单页上限，避免默认分页导致同步失败
  - 拉取模型时按服务端清单同步增删 (#136)
  - Bot 输入框跟随「发送消息」快捷键
  - 脚本内禁用的工具标为 model-only，不再在描述里诱导模型从脚本调用 todo 等工具
  - 去掉 Claude 与 Gemini 会整请求拒绝的参数 schema 关键字
  - 运行中 report 改为状态提示，完成通知 token 合计计入缓存
  - 挂起判定改为类型穷举的探针表，补上漏判的 memory/delegation 在途调用
  - 持有已弹出的通知对象，避免被 GC 后点击不跳转会话
  - 已查看的失败会话退出活跃中
  - 点击桌面通知定位到对应会话
  - 按住说话结束后关闭共享 AudioContext
  - Cursor 模型清单强制联网刷新并在进程内过期
  - MCP OAuth 续期改由 Main 完成
  - web_search 分类器补认 google-antigravity-cca，修复链首候选被静默跳过 (#133)
  - 前台中止后自动投递挂起的子代理完成通知
