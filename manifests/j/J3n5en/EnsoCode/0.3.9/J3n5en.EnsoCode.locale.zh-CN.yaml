ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 支持将会话移动到指定项目 (#259)
  - 打开 ModelPicker 时左侧渠道列表滚到当前项 (#255)
  - 移动端 MentionPicker 贴输入框上方铺满宽度，文件夹原地展开 (#252)
  - 关闭最后一个 tab 时自动收起右侧栏 (#251)
  - 秘书经联系方式渠道发图片和文件（sendImage/sendFile、caps.images/files、Telegram sendPhoto/sendDocument、不支持时降级文字） (#250)
  - Telegram 群白名单，只收名单里的群且只认绑定的人 (#249)
  - 外部渠道入站带上发送者与会话的稳定 id (#248)
  - 联系方式渠道插件化（多渠道卡片、Telegram 内置、插件 secretary.contact） (#244)
  🐛 问题修复
  - 失败工具行标题显示真实报错，运行中的子代理工具不再标红 (#260)
  - ModelPicker 打开时渠道列表滚到当前项真正生效 (#258)
  - 失败命令卡片标题跳过 timeout 提示，PowerShell 会话的命令工具说明改用 PowerShell 写法 (#257)
  - Telegram「连不上 api.telegram.org」在连接恢复后及时消失 (#256)
  - 秘书取消任务后看板显示「已停止」并给标记完成与移出 (#254)
  - GET /models 404 提示手动添加，记忆插件空态说明过滤原因 (#253)
  - 关闭秘书开关后清掉 renderer 残留状态，入口随之隐藏 (#247)
  - 秘书侧栏按勾选开放插件页面，取消勾选即收起 (#246)
  - 手机关注的任务结果不等合并窗口，桌面秘书会话与发起渠道同步收到 (#245)
  - 改称呼后活着的秘书会话就地刷新系统提示词 (#243)
  - Telegram 入站在秘书会话被回收时先拉起再投递，失败回一句说明 (#242)
  - 拒绝会话表整表清空写入并刷新空基线 (#239)
  - 连续换头像第二次不生效 (#241)
  - Telegram 提问答完后原消息标成已回答 (#240)
  - Telegram 下发的任务把秘书回复回推同一 chat (#238)
  - 透明背景下引导页不再透出空会话 (#237)
