- 自主智能
ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 会话里选中文本可引用到输入框继续对话 (#410)
  - 会话与子代理可用 remind_me 给自己定提醒，替代 sleep / --watch 死等 (#424)
  - 重启打断的子代理自动接着跑，父会话无感 (#418)
  - 上游故障自动恢复：按错误分类和供应商健康状态暂停重试，目标等待退避，子代理自动续跑，秘书能看到上游状态与待重试项 (#442 #443 #445)
  - 改动面板分组可折叠，放弃操作收进一个入口 (#475)
  - 设置新增日志页，错误汇总与脱敏导出 (#438)；新增「记录应用日志」总开关，默认关闭 (#481)
  - 通用设置里加开发者工具入口 (#430)
  - 托盘菜单新增「重启应用」 (#437)
  - 命令守卫：更新检查按钮、规则解释中文化与记忆豁免 (#440)
  🤵 秘书
  - 超过派发上限时排队建会话，有空位自动开始 (#434)
  - goal_complete 支持结构化结果，宿主只读核验后带到回传、session_read 与看板 (#427)
  - 派发时 model 参数支持虚拟模型，校验失败会列出可用的虚拟模型 (#465)
  - 秘书转问「需要你」时，用户答复后自动收口对应卡片 (#490)
  - 工作台先显示「需要你 / 进行中」，计数卡可点击跳到对应列表 (#482)
  - 「需要你」卡片改为「完成 · 需要你」并逐条写清要做的动作，分类按最新终态判断，已归档会话不再计入 (#447 #450 #462 #466 #483)
  - 新秘书还没有会话时，首条联系消息自动建会话并投递 (#429)
  - 转给秘书的提问不再通知用户、不计入待答与角标 (#414)
  - 失败的待派发卡片可以忽略并自动清理 (#416)；回退会话自动归档，任务完成后不再自动收进归档 (#467)
  - 确认技能 / 档案 / 工具提案后不再出现 Request aborted (#469)；删除秘书先落盘再清理，界面不再错位 (#480)
  - 待办派发补齐 goal 参数与默认目标 (#446)；插件联系方式发送失败保留详情并暂停出错渠道 (#460)
  - 有待触发提醒的空闲会话显示「等提醒」，不再误显示「续跑中」 (#456)
  🧩 插件
  - 插件市场安装后保持打开，权限确认就地显示 (#423)
  - 插件日志一键复制、按行着色、长行显示优化 (#425)；插件日志全局开关，默认关闭 (#463)
  - 监听事件按对象认领、心跳续期，并在看板展示 (#451)
  - 需求线程关联：PR 事件只进负责的会话，里程碑回复到原群消息 (#458)
  - 插件投递统一包裹不可信内容，卡片不再露出包裹标签 (#412)
  - 插件升级后自动摘掉已删除视图的侧栏标签 (#409)；定时器里调用 enso.* 不再报 NO_INVOCATION (#407)
  📱 远程 / 手机
  - 修复直连 / 中继混发掉帧、BulkWindow 15 秒锁死与幽灵 slot (#448)
  - 直连通道不再因缓冲返回 false 被误拆 (#455)
  - 秘书状态改为通知后重读，远端走缓存增量，不再整份推送堵塞有序流 (#491)
  - 桌面与远端不再因字段值为 undefined 互推整表补丁 (#468)
  - 手机抽屉的「活跃中」分组与桌面同口径 (#486)
  - caffeinate 随应用退出，不再遗留孤儿 crashpad_handler (#477)
  🐛 界面与交互
  - macOS 顶栏按钮不再被拖拽区吞掉点击 (#478)
  - 等提醒、排队中、等上游恢复、续跑中的会话归入「活跃中」，挂起等待排在后面 (#486)
  - 秘书面板不再整块白屏，侧栏各面板出错只在本块提示可重试 (#474)
  - Git 文件行不再撑出外层滚动条，提交框不再随面板滚动 (#492)
  - 提问卡片正文占满整宽 (#470)；输入框上方的卡片摞限高并内部滚动，长提问不再把输入框顶出窗口 (#417)
  - 思考块展开后底部也能收起 (#432)；记忆「提炼」按钮切页面回来状态不丢 (#435)
  - 临时会话的「复制路径」、相对路径、@ 文件搜索与状态栏目录都指向会话自己的目录 (#471 #472)
  - 设置深链只给分区时落到该分区 (#485)
  - 压缩后的早期消息也能分支 (#415)；插件投递与隐藏消息不再打断轮次 (#419)
  🛡️ 稳定性与性能
  - 取消类异常不再带走整个 agent worker (#489)
  - 重启与崩溃后 remind_me 到点照常触发 (#488)
  - stdio MCP server 与插件子进程随宿主结束，不留孤儿进程 (#487)；停止后台任务连带结束子孙进程 (#473)
  - 主会话停止时一并停止在跑的子代理 (#413)；父会话释放或删除时收口子代理 (#433)
  - 子代理在重启、插话、退出收尾时的状态修正，不再误报完成或误推中断 (#411 #422 #452)
  - 换代重启链路接通，未经确认的退出不再被看门狗提前强退 (#428)
  - 记忆服务不再因排队超时被反复强杀重启 (#459)；预期场景的日志降级，checkpoint 跳过未解决冲突 (#461)
  - 流式输出时不再反复解析派发记录，worktree 状态改批量查询 (#431)；公共模块不再静态加载重依赖，冷启动更快 (#439)
  - 修复脱敏正则的 O(n²) 回溯 (#421)
  🔒 安全
  - 非 owner 的插件投递直接拦截，不可信内容统一按 untrusted 处理 (#444)
  - @ 文件搜索与外部会话读取 / 导入只接受标识，不再接受界面传来的任意磁盘路径 (#476 #479)
  - 命令守卫按 decision 解析，ask 与 warn 不再被当作放行 (#441)
  - 系统 Temp 根目录的删除守卫收紧，明确的临时子目录、/tmp 子路径与 ssh 远端清理不再误拦 (#449 #484)
  - Windows 临时文件隔离到会话专属目录，禁止在系统 Temp 根清理 (#426)
  🔨 CI / 测试
  - Beta 恢复 macOS 双机并行构建，新提交可取消构建阶段 (#453 #454 #457)
  - 新增 test:changed、全量测试排队锁与 CI 分片，根治多处偶发失败 (#408 #420 #436 #464)
