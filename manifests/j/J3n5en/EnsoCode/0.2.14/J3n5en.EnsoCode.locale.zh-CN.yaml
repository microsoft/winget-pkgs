- 智能体
- 编程
- 聊天机器人
- 自主智能
ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 换到更小窗口的模型后，上下文吃掉压缩预留时立即压缩
  - 插件可向会话注入图片、中止会话，并在常驻进程里操作会话
  - 安装后默认启用，更新与待授权用徽章和按钮展示
  - ref 防误点、错误可重试标记，以及按元素展开子树
  - 节点设置窗口加载期间显示 loading 与提示
  - 桌面端在本机窗口打开远程节点设置
  - show icons in marketplace and for disabled plugins
  - split Enso and Claude Code plugin pages, restyle Enso plugins page
  - support custom plugin icon via manifest icon field
  - session.list / session.focus / session.create host APIs
  - context_usage carries magpie-shaped parts with per-item breakdown
  - add context_usage observe event with occupancy buckets and cache usage
  - allow plugin management over remote renderer
  - 插件市场改为弹窗
  - 接入正式插件市场（enso-plugins.j3.do、签名公钥、内置索引）
  - 插件市场客户端（多源签名索引、校验下载、市场安装与更新、设置页市场）
  - 插件市场签名索引校验模块
  - 截止被杀的命令失败卡提供「转后台重跑 / 以 600s timeout 重跑」
  - 全局 settings.shell 接通 worker 级命令时限
  - 命令行显示让位倒计时、静默徽章与失败分类状态条
  - wait 默认 30 秒、上限 5 分钟
  - 前台命令按分类让位、timeout 只表示截止，回执带任务 id/日志/下一步
  - 命令失败结构化分类并投影到时间线
  - 本地 bash/powershell 前后台命令统一注入非交互硬化 env
  - 命令时限单点常量与按命令分类的让位策略
  🐛 问题修复
  - 合成通知（后台任务/子代理完成）默认折叠，修复 task-note 日志路径解析
  - 节点设置隧道回报接收进度以启用压缩，并缓存带 hash 的静态资源
  - 清空 BASH_ENV/ENV，避免调用方环境里的 rc 脚本在每条命令前执行
  - render unattended notes as a status banner
  - keep resize drag alive over plugin iframes
  - show plugin icons in settings window
  - 带提及的消息正文按 Markdown 渲染
  - 系统通知标题带上会话名
  - 会话启用后再启用的插件也能注入消息
  - source 配置文件里的 command not found 不再误判为程序缺失
  - 插件页外层不再 sandbox，切走时保持挂载
  - 补回 Factory 列表未覆盖的 tty 措辞（sudo / ssh -T / input is not from a terminal）
  - tty_required / auth_required 改用 Factory 原文模式
  - 阻塞式 task_output 回归常规阈值（3 次提醒 / 6 次终止）
  - 补齐插件设置页的中文文案，安装成功后清空链接并提示
