- 人工智能
- 代码
- 大语言模型
- 智能体
- 编程
- 聊天机器人
- 自主智能
ReleaseNotes: |-
  更新内容
  ✨ 新功能
  - 插件清单支持声明子代理类型
  - 侧边栏新增「重启会话（重新加载配置）」
  - 无人值守把「没人在线」写进上下文，不再只是拒绝文案
  - 无人值守改成叠加在档位上的开关（对齐 factory）
  - 接入 dcg 破坏性命令守卫，命中时强制真人确认
  - 子代理指引改为正向触发 + 报告即事实源
  - 前台命令按预算让位后台，显式 timeout 转为后台截止
  - 插件设置改成折叠行 + 面板，配置/日志/产出进弹窗
  - 临时会话分组可折叠，并显示条数
  - 帧层加防重放窗口，直连与中继共用同一帧
  - 新增无人值守审批档，切档即时生效
  - 插件工具与会话事件下沉到子会话
  - 补齐插件会话事件、常驻、产出与界面能力
  - 安装允许插件内相对符号链接，越界与悬空链接仍拒绝
  - GitHub 安装的插件自动检查更新并提示，重新安装时提示版本未变或降级
  - 消息操作挂点带上消息下标与会话 id
  - 记住安装来源，支持从来源重新安装（更新与开发时重新加载）
  - 插件进程日志落盘，设置页与 CLI 可查看日志和最近错误
  - 插件命令接入输入框 / 菜单，选中即执行
  - message.action 的 left 挂到回复操作条复制按钮之前
  - 插件可附带预设、指令和角色描述
  - 支持用链接安装插件
  - 后台操作时用画中画实时显示被操作的应用
  - Computer 设置页可查看与撤销「始终允许」的应用
  - macOS 点击/键盘/滚动/拖拽默认后台投递，按 app 并行
  - 后台输入原语：合成焦点会话、事件配方、per-app 租约与授权
  - 内置工具开关对已打开的会话热生效
  - 未投递通知落盘，重开会话后补投，删除会话时清理
  - 支持 // @input heredoc 原文输入块
  - 摘要模板补 User Context 段与续作规则
  - 补工作区纪律、子代理合同、委托反扇出与 goal 无人值守提示
  - runaway 判重带结果指纹，提醒后累计六次以 terminate 结束本轮
  - 模型流守卫——空闲超时可重试中断、卡顿日志、逐字复读检测
  - 后台任务完成通知内联输出尾部，并提示模型不要重复启动确认
  - 移植 dsh-bce 为 prompt-enhance 示例，并更新插件开发文档
  - 插件调用宿主 MCP、配置项与密钥、长耗时方法超时、项目根上下文、渲染模块直接读写草稿
  - 四个示例插件（工具/卡片/代码块/skill、# 补全与草稿、侧栏页面、net.fetch）及端到端测试
  - enso-server plugin 子命令，经控制 socket 安装与授权
  - 侧栏插件页：sandbox iframe 壳页面 + MessagePort 固定桥
  - 输入框 # 补全接入插件候选
  - 插件读写输入框草稿：按发起窗口回写、内容指纹乐观锁
  - 输入框左右两侧挂点
  - 渲染挂点宿主，消息动作、工具卡片与代码块可被插件扩展
  - 插件管理 IPC、preload 出口、远端黑名单与设置页
  - 插件工具经 Main 往返执行，skills / MCP 随会话下发
  - Main 插件服务：安装、登记、状态机、插件进程与权限闸门
  - 插件清单校验、工具名映射与授权指纹
  - 从本地导入技能时扫描 ~/.agents/skills (#175)
  - 工作区外文件链接只提供定位，未被本会话写过的先确认 (#163)
