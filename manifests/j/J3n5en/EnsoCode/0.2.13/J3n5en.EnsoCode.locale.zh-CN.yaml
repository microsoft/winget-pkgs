  - config 向导与 config.toml 配置文件
  - 完整版宽屏下设置改为居中弹窗
  - 远端浏览宿主机目录时可新建文件夹
  - 可选内置 web，同端口提供手机 PWA、桌面资源包与中继协议
  - 远端客户端添加项目时可浏览宿主机目录
  - 改为 npm 包 @enso/server 分发，提供 start/pair/service 等子命令
  - 网页端检查更新、应用更新与重启服务端
  - pair 目录落盘快照，宿主重启后手机端仍可用
  - 无渲染器时宿主接管卡顿重试与首条标题
  - Docker 镜像与 compose（宿主 + 自带中继）
  - Node 无界面宿主入口与控制 socket
  🐛 问题修复
  - resume-coworker 失败不再把父会话标 failed
  - 无人值守开关漏登记在 spawn 白名单，新会话被拒成 invalid spawn request
  - 向量通道同距离按插入序排列
  - 远端不提供登记表提示清除按钮，读取失败不覆盖丢弃提示
  - 登记表读不出时不清理插件文件，丢弃提示落盘
  - 旧登记记录丢弃时提示并清理残留，熔断随生命周期重置
  - 注入消息标明来源并默认限当前会话，拦截加连续失败熔断
  - 插件进程透传代理环境变量
  - zip 安装保留可执行位，单条目上限与包上限对齐并在报错中带上条目名
  - 临时会话里子代理与 workflow 能建起来，建不起来也不再拖死父会话
  - Windows 后台任务停止按钮杀整棵进程树，杀不掉也会收口
  - 完整模式记住手机上切换的当前会话
  - 后台点击的指针画进画中画，不再盖在用户正在用的 app 上
  - 画中画收起延时改为 10 秒，同一窗口不重复移动浮窗
  - Qt 等不声明 AXPress 的按钮改按坐标点击；说明滚动方向
  - desktop.app 打开应用与设置面板不再抢前台
  - http/sse MCP 支持自定义请求头
  - 评审修正——授权不可绕过、焦点会话收尾、输入法与点击路径并发安全
  - 后台键盘落到目标窗口，点击落点只在目标 app 内命中
  - 内置工具开关在回合收口后才换工具表
  - 移动端右侧栏打开时全屏覆盖聊天区
  - 权限闸门的本地 require 改名，避免 electron-vite CJS shim 误插入导致 main 构建失败
  - 插件变更广播改走平台无关通道，服务端不再触及 electron
  - 检索结果给原始相关度，不再把归一化混分当相关度
  - 年份加分不再压过语义相关性
  - 知识图谱抽取用尽重试后标为失败，记忆页可见并可一键重试 (#172)
  - deep 检索的模型辅助按后端给超时，超时即取消，并标明是否用上 (#171)
  - 记忆页显示被检索次数，写明衰减按创建时间算 (#174)
  - 远端客户端点工作区徽标不再崩溃 (#160)
  - 移动端右侧栏打开时全屏覆盖聊天区
  - 隐私脱敏弹窗限制高度并合并同类命中
  - 修正 #159 测试 import 排序
  - System One 兼容网关可作分类器来源 (#156)
  - config 向导沿用手写 Caddy 站点，清理旧单元写死的变量
  🔨 CI/CD
  - tgz 路径加 ./，免得被 npm 当成 GitHub 简写
  - 用 npx npm@11 发布，避免原地升级 npm 把自己装坏
  - npm 发布拆成独立手动 workflow publish-server.yml，不随桌面端 tag 发版
  - npm 发布改用 Trusted Publishing（OIDC），修正包改名后的 tgz 路径
  - 安装包、updater sidecar、systemd 安装与发版流水线
