ShortDescription: Local-first desktop workbench for orchestrating a fleet of autonomous coding agents.
Description: EnsoCode is a local-first desktop agent workbench built on Electron and the pi coding agent harness. Repos stay pinned in the sidebar with one session per task and optional Git worktree isolation; one-shot work goes to Subagents while long-running collaboration goes to Coworkers. Diffs sit in the timeline with three approval levels and Git checkpoints with one-click rewind, approvals stream to an end-to-end encrypted phone companion, and existing Claude Code, Codex, and Cursor configurations, keys, MCP servers, and session history can be imported.
