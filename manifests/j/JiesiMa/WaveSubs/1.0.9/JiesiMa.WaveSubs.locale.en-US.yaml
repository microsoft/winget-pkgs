ShortDescription: Generate SRT/ASS subtitles from any video with local AI and auto-translate them, offline.
Description: "Can't find subtitles for a video? Wave Subs recognizes the dialogue with whisper.cpp, refines the timing, and translates the result into your language with a local Qwen3 model (or any OpenAI-compatible API). Exports SRT / ASS next to the video, batch-processes a whole season, and includes a subtitle editor with video preview. Everything runs on your own computer: no account, no upload, no internet needed after the one-time model download. Free and open source (MIT)."
