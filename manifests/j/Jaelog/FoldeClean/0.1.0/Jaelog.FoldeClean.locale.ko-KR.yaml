Description: |-
  FoldeClean은 폴더 정리 프로그램입니다. 바로가기 대상, 레지스트리에 등록된 프로그램, 사용 중인 파일, 프로젝트 폴더를 미리 찾아 보호하고,
  종류별·날짜별·PARA·Johnny.Decimal·오래된 파일 보관·중복 정리 등 7가지 방식 중 하나로 파일을 옮깁니다.
  실행 전 이동 경로를 흐름도로 미리 보고, 모든 이동은 기록되어 한 번에 되돌릴 수 있습니다. 한국어·영어·중국어·일본어를 지원합니다.
