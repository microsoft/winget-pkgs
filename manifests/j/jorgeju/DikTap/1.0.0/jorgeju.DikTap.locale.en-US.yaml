ShortDescription: Voice dictation for any Windows app, powered by OpenAI transcription.
Description: |-
  DikTap lives in the system tray. Press Win+H (or Ctrl+Alt+Space) in any app, speak, press it again and the
  transcribed text is pasted where your cursor was. It uses the OpenAI transcription API with your own API key,
  keeps no audio or transcripts, and has no telemetry. Portable, lightweight, English and Spanish interface.
