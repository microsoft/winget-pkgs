ShortDescription: Dictado por voz para cualquier programa de Windows, con transcripción de OpenAI.
Description: |-
  DikTap vive en la bandeja del sistema. Pulsa Win+H (o Ctrl+Alt+Espacio) en cualquier programa, habla, vuelve a
  pulsar y el texto transcrito se pega donde tenías el cursor. Usa la API de transcripción de OpenAI con tu propia
  API key, no guarda audio ni textos y no tiene telemetría. Portable, ligero y con interfaz en español e inglés.
