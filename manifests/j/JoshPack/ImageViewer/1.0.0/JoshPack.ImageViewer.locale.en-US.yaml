PackageIdentifier: JoshPack.ImageViewer
PackageVersion: 1.0.0
PackageLocale: en-US
Publisher: JoshPack
PublisherUrl: https://github.com/joshpack
PublisherSupportUrl: https://github.com/joshpack/PaxImageViewer/issues
PackageName: PAX Image Viewer
PackageUrl: https://github.com/joshpack/PaxImageViewer
License: Freeware
ShortDescription: A fast, lightweight image viewer with deep high-quality zoom and folder slideshows.
Description: |-
  PAX Image Viewer opens an image and every other image in its folder. Zoom from fit-to-window up to 51,200% with
  high-quality filtering and crisp pixels far in, and run slideshows with adjustable speed, shuffle, cross-fade and an
  option to keep the zoom level between images. Reads JPEG, PNG, GIF, WebP, BMP and ICO, plus TIFF, HEIC, AVIF, JPEG XL
  and camera RAW through Windows' codecs.
Moniker: paximageviewer
