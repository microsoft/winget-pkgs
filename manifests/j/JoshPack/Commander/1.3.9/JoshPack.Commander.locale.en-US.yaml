ShortDescription: A fast two-pane file manager for Windows with tabs, search, FTP/SFTP and a built-in terminal.
Description: |-
  PAX Commander is a file manager built to replace File Explorer. Two panes with tabs, details/thumbnail/column views,
  a preview pane and Quick Look, a real search, a background copy/move queue with undo, FTP/FTPS/SFTP connections,
  a docked SSH or PowerShell terminal, and a built-in image viewer with deep zoom and slideshows.
