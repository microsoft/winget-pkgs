ShortDescription: A macOS-style dock, widget bar and desktop widgets for Windows.
Description: |-
  QiDock replaces the Windows 10 and 11 taskbar with a floating, macOS-style glass dock that has widgets built in.
  Music, weather and calendar cards grow straight out of the dock, notifications slide in as banners at the top of the screen, a Notification Center sits behind the bell icon, and a Control Center handles Wi-Fi, sound and battery in one panel.
  It offers 14 dock styles, profiles, desktop widgets, an English and Turkish interface, and a low-memory mode.
