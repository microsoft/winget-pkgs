ShortDescription: Offline-first Windows developer AI scratchpad and AES-256-GCM encrypted credential vault built in Rust and Tauri 2.0.
Description: |-
  QuickNote is a native Windows desktop scratchpad and local encrypted credential vault built with Rust and Tauri 2.0.
  Features include a sub-50ms global summon overlay hotkey (Ctrl+Shift+Q), a local SQLite database protected by AES-256-GCM authenticated encryption and Argon2id key derivation, sub-2ms FTS5 full-text search, and an optional dual-track AI prompt refiner supporting local Ollama, Bring Your Own Key (BYOK), or an optional cloud AI gateway with zero background telemetry.
