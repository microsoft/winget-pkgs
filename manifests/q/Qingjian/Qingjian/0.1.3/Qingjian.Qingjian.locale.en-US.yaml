PackageIdentifier: Qingjian.Qingjian
PackageVersion: 0.1.3
PackageLocale: en-US
PackageName: Qingjian
ShortDescription: A pinyin input method that shows a translation next to candidates.
Description: Qingjian is a cross-platform pinyin input method written in Rust. While you type, it displays a concise translation in your learning language next to each candidate, turning everyday typing into lightweight language learning, one language at a time and without interrupting input. Sentence-level pinyin input, candidate reranking, and learning all run locally on your machine.
Tags:
- chinese
- education
- ime
- input-method
- language
- language-learning
- pinyin
InstallationNotes: After installing or upgrading, if you cannot switch to Qingjian or typing does not register, sign out and sign back in (or restart). Applications that are already open need to be restarted to pick up the new version.
