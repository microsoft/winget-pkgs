- 汉语
- 语言
- 语言学习
- 输入法
ReleaseNotes: |-
  - 新增西班牙语学习语言：「设置 → 通用」选西班牙语后候选旁显示西语词性与译词；释义表由机器翻译生成、未经人工校对，错译欢迎反馈（#37、#48、#49）
  - ? 不再自动进入问字：没在组句时敲 ? 就是问号；想保留旧行为到「设置 → 快捷键」勾选（#83）
  - 中英混输可选「中文优先」（缺省关）：开着时整段输入是英文词（hello、key）也让中文候选排第一、英文词固定第二，空格上屏的是中文；关着时拼音不成立的输入英文词排第一。「设置 → 通用」勾选（#85）
  - 「lüe / nüe」类音节 lue / nue 与 lve / nve 两种写法都能稳定命中（如 celue → 策略），双拼方案尤其受益（#59、#60）
  - 输入时的候选查询少做一遍重复计算，响应更快（#64、#65）
  - 私密输入（Windows 的密码框与无痕窗口、macOS 的 Secure Input）里的词不再记进词汇记录；多个应用同时在输入时各自的组句与学习互不干扰（#89）
  - 候选窗口（Windows 还有悬浮状态条）改由青简自己的渲染器绘制，两平台像素一致，为主题铺路：「设置 → 候选窗口」可选「渲染引擎」与「字体」（系统里装的任一字体）；不合适可切回「系统绘制」
  - 云联想接口地址是 OpenCode 时自动带上会话标识（#39）
  - 「高级」页新增「学习输入习惯」开关：关掉后不再按你的选择调整候选顺序、不再记新词与敲错纠正；已学过的照常生效，随时可再打开
  - 学习语言可选「不显示译文」（配置 learning_language = "off"）：候选旁不出译词，生词标记与释义兜底一并停；Windows 换学习语言不再需要重启（#123）
  - 中英混杂词直接按「字母 + 拼音」打：cpan → C 盘、bzhan → B 站、youpan → U 盘（与 优盘 并列）、txu → T 恤、agu → A 股（#93）
  - 翻页键可选「- =」：「设置 → 快捷键」翻页键多一项，缺省仍是

    ；选它时输入拼音中敲 - 是翻页，不再进英文直输（#43、#116）
  - 英文模式选词改成与中文一致：Space 选高亮候选、数字键选第 N 个、翻页键翻页；Enter 与标点仍原样输出所敲字母。之前空格要先用方向键动过高亮才选词、数字键只当数字
  - 双拼下可以用算式与问字了：没在输入拼音时按 Shift+V 再接算式（V1+2）、Shift+U 再接拼音或码点（U4e00），与搜狗、微软双拼一致。之前 v / u 被音节占用，双拼下这两个功能进不去（#11）
  - v 加数字多出金额写法，填单据、写收据用：v123.5 出「一百二十三点五」「壹佰贰拾叁点伍」「一百二十三元五角」「壹佰贰拾叁元伍角」，v123 在中文数字之后多出「一百二十三元整」「壹佰贰拾叁元整」
  - 修复靠纠错读出的词上屏后拼音行还剩半截的问题：敲 pingyin 选「拼音」，之前会剩下 gyin（#128）
  - 数字键对应的候选不存在时不再被吞掉：gpt6 只有三个候选时敲 6，数字接在字母后面原样输出（之前 macOS 会把 gpt 上屏并丢掉 6，Windows 没有任何反应）
  - 新增「繁体输出」：「设置 → 通用」打开后候选与上屏文字转成繁体（只换字形），学习、译词、云端词照常（#41）
  - macOS：「偏好设置 → 关于 / 高级」新增「打包日志到桌面」，与 Windows 一致：日志与配置文件打成一个 zip 放桌面，反馈问题时一个附件搞定
  - 应用图标换成新的竹简 logo；macOS 输入法菜单栏图标换成与系统输入法同风格的「青简」模板图，随菜单栏深浅色自动反色
  - macOS：补上输入模式声明，修复备忘录等标准文本视图切不到青简、「添加输入法」列表里不显示的问题（#31、#50）；输入源菜单与「添加输入法」对话框里的图标改成与系统输入法同样式的键帽
  - Windows：修复组句中打了 - 这类符号之后再敲数字被吞掉的问题（gpt-6 只出 gpt-）；这种英文直输段按空格上屏时空格也保留，与 macOS 一致（#28）
  - Windows：修复电脑上第二个账户打不开配置、设置保存不了的问题：这个账户下输入法还没运行过时配置目录不存在，现在设置程序自己会建好并写出配置模板（#10）
  - Windows：任务栏的中 / 英图标换成新设计稿，按屏幕缩放选清晰的尺寸，浅色任务栏上不再是白字看不清；Caps Lock 亮着时显示「A」
  - Windows：修复 Windows 10 上打不开「青简设置」（报「无法定位程序输入点 TryCreatePackageDependency」）：设置程序自带所需的运行库，不再要求系统装有 Windows App Runtime；系统要求改为 Windows 10 1809 及以上（#77、#18）
  - Windows：安装包多带一份 32 位输入法组件：企业微信、WPS、32 位 QQ 这类 32 位应用里之前只能出字母、或被系统换回别的输入法，现在能正常打字（#76、#13）
  - Windows：数字与标点按当前系统键盘布局识别：非美式布局（如德语）下以前会按美式键位出错误的符号（#115）
  - Windows：修复导入 Rime .dict.yaml 词库后候选里没有词的问题：导入时转成青简格式并自动启用，可一次多选；词库目录里新增、替换、移除的文件一秒内生效，不用重启输入法（#36、#118）
  - Windows：修复企业微信、微信、Notepad++ 这类自绘输入框里数字键和英文标点没反应的问题：没在组句时敲的数字、英文模式下敲的标点之前会被吞掉（#25、#26）
  - Windows：输入法组件不再依赖 VC 运行库（vcruntime140.dll）：没装运行库、或运行库文件被别的安装程序改坏了权限的机器上，任务栏搜索、开始菜单这类系统应用会因为加载不了青简而悄悄切回上一个输入法，现在不会了
  - Windows：新增大千注音输入：「设置 → 通用」打开后按注音键盘敲、候选与拼音一样出，悬浮状态条显示「注」；声调暂不参与筛选。注音模式下数字键与 - ; , . / 都进组句，选词改用 Enter，Shift+Enter 原样上屏，空格是一声（#22、#24、#41）
  - Windows：首次启动自动写出带说明的 config.toml，不用先在设置程序里保存一次（#19）
  - Windows：附加词库只从用户目录的 dicts\ 装，不再把学习数据文件当词库加载
  - Windows：日志集中到一个目录「%LOCALAPPDATA%\Qingjian\logs」：引擎、各应用内的输入法部分、设置程序各一个前缀，按天分文件、保留 7 天；设置程序「关于」与「高级」页新增「打包日志到桌面」，反馈问题发一个 zip 即可
  - Windows：设置程序启动失败时会弹出提示并写日志，不再静默退出
  - macOS：自定义短语：偏好设置新增「自定义短语」页，给一段输入码（1–32 个字母）指定固定候选位置（1–9），同一输入码可配多条；通用页新增默认中文标点全角 / 半角（#15、#16、#17）
  - macOS：修复中文模式用半角标点时，单独敲 ? 再按空格或回车丢掉问号（#21）
  - macOS：系统设置「键盘 → 文本替换」里的条目在输入拼音时也可用，输入码敲全后短语占该码最靠前的空位；「自定义短语」页可关（#84）
  - 安装包改名为 qingjian-<版本>-<平台>-<架构>（如 qingjian-0.1.3-macos-arm64.pkg、qingjian-0.1.3-windows-x86_64-setup.exe），为接入包管理器与检查更新做准备
  - 安装或升级后切不到青简、或切过去敲键没反应：注销后重新登录（或重启电脑）即可；已经开着的程序要重启才会用上新版本
  - 已知问题（Windows）：本版没有代码签名，安装时 SmartScreen 会拦截一次；在任务栏搜索、「设置」等系统应用中候选窗口可能被遮挡。腾讯软件管理这类带反注入保护的安全软件内无法输入，是其自身机制，除微软拼音外的输入法均如此
  - 本版社区贡献：@Shiyuhai2023（Windows 10 设置程序）、@pinchiu（注音、繁体输出）、@Tofuzhu（西班牙语）、@luojiyin1987（ü 韵母写法、查询去重）、@broxlighters（会话隔离与私密记录）、@9tong（问字开关、中文优先、系统文本替换、上屏对齐、打包脚本）、@Uiye4096（自定义短语、默认标点、半角问号修复）、@Tsuk1ha（键盘布局、- = 翻页、词库导入）、@lll114514lll1919810lll（中英混杂词）、@LilZeeCN（macOS 输入模式声明的测试与安装提示）、@WhiteCloud-OuO（图标与界面设计）
  这一版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。
