ShortDescription: 候选词旁附带目标语言译词的拼音输入法。
Description: 青简（Qingjian）是一个使用 Rust 开发的跨平台拼音输入法。输入时会在候选词旁边显示一条简洁的目标语言译文，让打字本身成为一种轻量的语言学习方式：一次只学习一种语言，不打断输入。整句拼音输入、候选重排与学习全部在本机完成，不上传数据。
