  Windows：这一版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。
ReleaseNotesUrl: https://github.com/qingjian-team/qingjian/releases/tag/windows-v0.3.5
InstallationNotes: 安装或升级后若切不到青简、或敲键没反应，请注销后重新登录（或重启电脑）；已经开着的程序要重启才会用上新版本。
