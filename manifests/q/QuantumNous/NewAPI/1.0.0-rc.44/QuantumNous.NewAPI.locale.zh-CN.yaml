ReleaseNotes: |-
  Important
  v1 Coming Soon & Log Export / v1 即将发布与日志导出
  v1 正式版即将发布，现在是最后几个 RC 版本。
  使用日志支持导出 CSV。可以在日志维护里设置是否允许用户导出，以及日志最长时间范围，默认 365 天。普通用户的日志查询、导出和数据看板都按这个范围限制。
  游乐场的数据按账号分开保存，升级后之前的聊天记录会清空一次。
  Claude 请求按模型支持的档位发送思考强度。发给 Gemini 的工具和结构化输出保留完整的 JSON Schema。
  v1 is coming soon. These are the last few release candidates.
  Usage logs can be exported as CSV. In Log Maintenance you can choose whether users may export and set the longest log time range, 365 days by default. Regular users' log searches, exports, and dashboard charts all follow that range.
  Playground data is stored per account. Earlier Playground history is cleared once after the upgrade.
  Claude requests get the thinking effort each model accepts. Tools and structured output sent to Gemini keep their full JSON Schema.
  New Features
  - The usage log page has an Export button next to Search. It downloads the current view, with the page's filters and a chosen time range, as a CSV file in the viewer's language. Users export their own logs, and administrators in the all-users view export every user's logs. Each user runs one export at a time, across tabs and, with Redis, across nodes (#7774).
  - Log Maintenance adds Allow users to export logs (on by default) and Longest log time range (days) (365 by default). Regular users' log searches had no limit before. Their searches, exports, and dashboard usage and traffic charts now share this range. The page is split into Log recording, Log search and export, history log cleanup, and server log management.
  - Date and time pickers, including the date range filter on log pages, work down to the second.
  Fixes and Improvements
  - Known Claude models get the nearest thinking effort they accept, and none when they accept none. This fixes 400s on Opus 4.5 with max or xhigh, on Sonnet 4.5 and Haiku 4.5, and when a model suffix or modifier turns thinking off. Native Claude requests without a suffix or modifier pass through as sent.
  - Claude Haiku 5.5 uses adaptive thinking with medium effort by default. Converted requests drop temperature, top_p, and top_k for it. Gemini 2.5 Pro gets a 32768 thinking budget for xhigh and max.
  - Tools and structured output sent to Gemini keep const, oneOf, $ref, $defs, type arrays, and non-string enums. A schema that Gemini's typed Schema can hold is sent as before, and any other schema goes in parametersJsonSchema or responseJsonSchema. Models set to Gemini API v1 get a cleaned schema and a conversion warning (#7455, #7704).
  - Responses images sent to Chat Completions upstreams use the object form of image_url, so vLLM and strict gateways accept Codex screenshots and tool images (#7578).
  - Chat streams converted to Claude Messages keep answer text that arrives in the same chunk as the last reasoning token (#7664). Claude Messages converted to Chat Completions keep assistant text next to tool calls (#6871).
  - Claude requests forward thinking.block_binding and every anthropic-beta header value. This fixes "The block is bound to a different conversation" in multi-turn conversations whose system prompt or tools change (#7732).
  - Responses WebSocket sessions send a close frame when the server ends them, so Codex sees a normal close (#7642).
  - Without Redis, model rate-limit 429s carry the same error message and log line as with Redis (#7721).
  - The console reloads once when a page's code fails to load, and the error page shows a status code only when there is one (#7634).
  - The wallet, security, and OAuth callback pages and the user binding dialog load much less JavaScript. Linux DO bindings show the Linux DO logo.
  - Date pickers and relative times follow the interface language (#7654).
  - The model square shows the latest 24 hourly status samples within 7 days, with no gaps. Expression model cards show the cache read price (#7757).
  - Usage log previews keep the recorded billing tiers (#7763), and task settlement logs show tiered billing (#7446).
  - Pricing conversion accepts model metadata that declares endpoints as an array (#7724). Root can manage pricing while the model square is disabled (#7761).
  - Performance metrics count streams that finished before the client disconnected (#7638).
  - The Sign in button on password login stays clickable and shows the legal consent warning (#7771).
  - The Auto font uses the browser's sans-serif again. Meta Muse Spark models show the Meta icon (#7734), and billing source icons line up on mobile (#7760).
  - Dependency updates, including Electron 41.

