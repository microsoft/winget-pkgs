  - feat: support HOST env to set the listen address by @feitianbubu in https://github.com/QuantumNous/new-api/pull/8269
  - fix(deepseek): map developer role to system for chat completions by @seefs001 in https://github.com/QuantumNous/new-api/pull/8287
  - feat(payment): 易支付支持 RSA 签名方式 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8291
  - fix(channels): 切换渠道时重置模型重定向同步状态 by @scarletkc in https://github.com/QuantumNous/new-api/pull/8304
  - perf: 升级 MoeForge moejs/moego，请求体按需流式读取 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8311
  - feat(plugins): add provider plugins, request plugins and a community marketplace by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8271
  - chore(plugins): release vertex-ai 1.3.1 by @Calcium-Ion in https://github.com/QuantumNous/new-api/pull/8313
