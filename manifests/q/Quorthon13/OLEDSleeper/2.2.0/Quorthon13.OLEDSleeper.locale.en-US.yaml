ReleaseNotes: |-
  OLED Sleeper is now portable! You now have the option of either installing it as usual, or unzipping the portable build and running it from anywhere, a USB stick included. The portable copy keeps its settings and logs next to the executable.
  🛠 What's New
  🚀 Improvements
  - Portable build that runs unzipped and keeps its files next to the executable (@Quorthon13)
  - Blackout no longer lowers hardware brightness unless you turn it on for that monitor. The overlay covers the screen on its own (@Quorthon13)
  - Dimming percentages now scale to each panel's real brightness range. On a 0-255 monitor, 15% used to arrive as about 6% (@Quorthon13)
  ⚙️ Changes
  - A blacked-out monitor now covers notifications and flashing taskbar buttons (@Quorthon13)
  - Monitors with no resolvable hardware ID are dropped and logged instead of listed in the settings window (@Quorthon13)
  - Installing resets settings.json and brightness_state.json (@Quorthon13)
  🧩 Fixes
  - Fix a monitor stranded at 0% brightness when a mouse move landed mid-dim (@Quorthon13)
  - Fix the original brightness being lost when a monitor failed to restore (@Quorthon13)
  - Fix brightness_state.json being left half-written, which lost every recorded original brightness (@Quorthon13)
  - Fix a monitor staying dark after closing the app, and a second launch clearing the first instance's state (@Quorthon13)
  - Fix Exit in the tray menu discarding unsaved monitor settings without asking (@Quorthon13)
  - Fix dimming doing nothing when a display is duplicated (@Quorthon13)
  - Fix monitors waking when the desktop takes focus instead of an application, such as clicking another monitor's desktop or pressing Win+D (@Quorthon13)
  - Fix the blackout overlay slipping under the taskbar and other topmost windows (@Quorthon13)
  - Fix display changes going undetected by pairing panels on hardware identity rather than device name (@Quorthon13)
  - Fix monitors staying dark after real mouse movement, caused by unsynchronized overlay tracking (@Quorthon13)
  - Fix settings being deleted for monitors that were unplugged at the time of the save (@Quorthon13)
  - Fix stale monitor geometry after a resolution, DPI or arrangement change (@Quorthon13)
  - Fix Save un-dimming every monitor even when the settings were rejected as invalid (@Quorthon13)
  💾 Installation
  Two downloads in the Assets below. Pick one.
  Installer, OLED-Sleeper-2.2.0-Setup.exe (~2 MB)
  1. Download it and run it, then follow the setup steps.
  2. If .NET 8 is missing, the setup grabs it for you during the install.
  3. (Optional) Enable Run at Startup during installation if you want it to start automatically.
  4. Settings and logs go to %APPDATA%\OLED-Sleeper.
  Portable, OLED-Sleeper-2.2.0-Portable-x64.zip (~64 MB)
  1. Unzip it anywhere, a USB stick included.
  2. Run OLED-Sleeper.exe. There is nothing to install.
  3. Settings and logs go to Data\ next to the executable. Nothing is written anywhere else on the machine.
  The zip is bigger because .NET comes bundled in it.
  > Updating resets your per-monitor settings to defaults.
  📋 Requirements
  - Windows 10 or 11
  - DDC/CI support (required only for brightness dimming)
  Full Changelog: v2.1.0...v2.2.0
