ShortDescription: Windows 端本地音乐播放器，支持丰富的歌词、桌面歌词与多种音频格式。
Description: Pure Music 是一款 Windows 端本地优先的音乐播放器。它使用 BASS 引擎播放本地音频，支持 LRC 与 TTML 逐字歌词、翻译与罗马音显示，并提供桌面歌词。它支持均衡器、变调变速、独占模式播放与 Windows 系统媒体控制，音乐库与设置均保存在本机。
