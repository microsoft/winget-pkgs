ReleaseNotes: |-
  更新日志 v2.2.3
  演出模式
  - 新增演出模式，可从曲库、文件夹、歌手、专辑或歌单中自动编排播放顺序
  - 支持调节情绪起伏、压轴时机、顺滑度、演出规模和收尾风格
  - 提供情绪曲线和历史演出记录，不修改原歌单
  歌词与桌面歌词
  - 支持多行歌词自动换行，逐字高亮在换行后仍能正常跟随
  - 歌词详情页支持编辑内嵌歌词、在线搜索并写入标签或外部 LRC
  - 桌面歌词支持多行、竖排、双行和更完整的窗口行为设置
  - 修复前奏、间奏、句末高亮和多声部歌词显示问题
  播放与界面
  - 专辑详情页新增顺序播放
  - 播放页支持始终显示控件，并可直接查看歌词来源
  - 封面加载增加稳定占位，长列表支持拼音首字母搜索和字母索引
  - 任务栏播放控制与封面预览支持独立设置
  稳定性
  - 优化列表滚动、封面加载、音频分析和页面动效
  - 修复播放队列、进度拖动、页面过渡及歌词同步相关问题
  此次更新贡献者
  - @AwayWoKao
