ShortDescription: A local-first music player for Windows with rich lyric support, desktop lyrics, and a wide range of audio formats.
Description: Pure Music is a local-first music player for Windows. It plays local audio with the BASS engine, renders synced LRC and TTML lyrics with word-by-word highlighting, translations, and romaji, and shows desktop lyrics. It supports EQ, pitch and speed adjustment, exclusive-mode playback, and Windows system media controls, keeping your music library and settings on your own machine.
