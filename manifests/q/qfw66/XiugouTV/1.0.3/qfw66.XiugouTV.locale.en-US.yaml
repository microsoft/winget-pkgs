ShortDescription: A Windows desktop video client that plays the media sources you import, with on-demand and live TV in one interface.
Description: XiugouTV (修狗TV) is a desktop video client for Windows 10/11 x64. After you import your own source configuration it browses categories, searches episodes, plays a selected episode, and switches to live TV in the same interface. Playback runs on the libmpv engine with hardware decoding, track switching, speed control and resume, and the built-in JVM runtime executes existing spider plugins so current site configurations can be reused as they are. The application ships no content sources; everything played comes from configuration the user adds.
