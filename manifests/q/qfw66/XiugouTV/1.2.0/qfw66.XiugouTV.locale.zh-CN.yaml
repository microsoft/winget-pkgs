  反馈问题
  先搜索已有 Issue，同一问题补充在原条目，一次故障填写一份。发出前遮住私人订阅、账号、Cookie、令牌、二维码和签名播放地址。问题反馈
  【版本】v1.2.0，关于页 Build Time / Commit Hash
  【系统】Windows 版本、显卡、硬解设置
  【安装方式】安装版 / 便携版，实际启动及数据目录
  【站点和样本】配置类型、站名、影片代号、集数和线路
  【复现步骤】从哪个入口开始，在哪一步失败，重试结果
  【实际 / 期望】界面提示、播放位置、应发生什么
  【错误日志】设置 → 关于 → 错误日志，或播放诊断的脱敏片段
