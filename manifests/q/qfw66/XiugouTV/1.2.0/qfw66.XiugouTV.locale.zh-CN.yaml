ReleaseNotes: |-
  修狗 TV v1.2.0
  这一版主要完善影片详情、字幕和播放选择。新版详情可以查看横版剧照、演员、豆瓣短评和相似推荐，资料或图片缺失时尝试补充同片内容。播放页新增 MDK 和 Media Foundation，默认仍用 mpv；文本字幕可以调整大小、手动载入本地文件。历史续播、自动下一集、摸鱼配置中心、PG 导入和便携资料目录也有修复。
  本版亮点
  - 新版影片详情。在「设置 → 外观 → 影片详情」启用，随时可以切回经典。原站的线路、选集、收藏和续播保留，演员和相似推荐可按住鼠标横拖。
  - 同片资料和图片补充。TMDB 优先；缺项或坏图时才尝试豆瓣。背景优先横版海报、其次横版剧照，不放大竖封面；头像失败只补同片同名演员，保留顺序和角色。
  - 原页切换播放内核。可选择 mpv、MDK 或 Media Foundation，不另开第二个播放窗口。格式、字幕和硬解能力依内核及系统，遇到兼容问题可切回 mpv。
  - 文本字幕大小。mpv 字幕菜单提供 75%、100%、125%、150%、200% 和恢复默认。位图字幕及 MDK／Media Foundation 不提供这项字号能力。
  - 手动加载本地字幕。在 mpv 字幕菜单点「加载本地字幕…」，用系统文件选择器选 SRT、ASS、SSA、VTT，不要求与视频同名或同目录。取消或换片不会串用字幕。
  - 自动下一集可关闭。「设置 → 播放器与解码」保留全局开关，默认开启；关闭后重启仍记住，手动选集可继续使用。
  - 直播滚轮换台。播放画面中部偏左（含中线）上滚上一台、下滚下一台，右侧仍调节音量。感谢 @sszxvvhfxxhytxxdd 的 #27 建议。
  其他修复与改进
  - 改进同名电影、发行年份、译名、单片文件名和画质后缀的匹配；证据不足时不拼接不同作品的资料。
  - 站源加载期间并行取得同片资料，高清原图慢时先显示同图预览，资料故障不挡原站选集。
  - 新版剧照延伸到悬浮顶栏下，片名或标志在正文显示；保留返回、拖动、置顶和窗口三键，移除「更多」菜单。
  - 配置源管理输入框在深浅主题下的文字选区更容易辨认。
  - 修复 Windows 保存的 WebDAV 连接重开后无法读取，以及部分站内 WebDAV 路径解析问题。
  播放体验修复
  - 历史续播。从历史列表点一条记录时，保留那条记录的集数、来源和断点，不再被较新的同片记录替换。感谢汉堡王的反馈。
  - 自然结束连播。片尾和自然结束只触发一次切集，末集停止，关闭自动下一集不影响手动操作。
  - 错误后选线选集。点播失败后可以直接重选线路或剧集，遮罩不会点穿到诊断面板，也不会自动跳到下一集。
  - 站源外挂字幕。插件提供的文本字幕进入选轨和续播流程，迟到结果不会串到另一部影片。
  站源加载与配置
  - 修复摸鱼配置中心中指定设置接口的按钮报错，画质确认读取实际勾选项，保存后可以重开核对。
  - 换配置时先等旧插件释放，再加载新首页；JAR 下载完整且可读后才替换缓存，失败保留旧可用包。
  - 改进 PG 复合资源、公开清单和本地 ZIP 文件名识别，保留原包及导入安全检查。
  - 站源账号和辅助 JVM 临时目录跟随当前资料目录，修复便携迁移后再次选择自定义目录的重启读回。
  升级说明
  1. 在 v1.1.0 设置中导出历史、收藏和偏好，记下实际数据目录，再完全退出。
  2. 安装版运行新版安装器并核对原安装位置；便携版完整解压到新目录，不直接覆盖旧目录。
  3. 打开设置核对版本、资料目录、配置、历史和收藏，再试播一集，保留旧程序及备份。
  4. 经典详情、默认 mpv 和既有操作继续保留；自动下一集默认开启，文本字幕字号默认 100%。
  5. WebDAV 凭据绑定当前 Windows 用户，普通备份排除凭据；换用户或换机后可重新连接。完整旧资料升级仍需实际设备核对。
  常见问题
  升级后为什么还是经典详情？
  经典布局仍是默认。在「设置 → 外观 → 影片详情」开启新版，不会改变原站的线路和选集。
  演员或背景没有图片，还能播放吗？
  可以使用原站线路和选集。资料先请求 TMDB，缺项时才核对同片豆瓣；不能确认同片或没有可信横图时保留文字／占位，不拿另一部同名作品凑资料。
  为什么不能调整字幕大小或载入本地字幕？
  这两项操作用于 mpv 的文本字幕。MDK／Media Foundation 以及位图字幕的能力不同，可切回 mpv 后检查字幕菜单。
  新内核一定更省电或支持所有格式吗？
  不保证。支持的格式、硬解、字幕和实际功耗与系统及显卡有关，用同一样片在自己的设备上比较；遇到兼容问题可切回 mpv。
  切换站源后能共用网盘登录吗？
  本版没有跨站源共用登录。订阅认证、网页授权和插件网盘账号分别保存，先核对是哪一层提示认证。
  已知限制
  - 内容来自自行导入的配置，目录、授权、媒体地址与实际解码是不同阶段，不能由配置中心可用推断全源可播。
  - 部分网盘、网页验证和移动端专用组件仍受上游条件限制；PGS 预览内核、macOS、首次引导、新彩蛋和下载线程设置不在本版。
  - 旧候选的 8 秒窗口采样失败记录仍保留，不能把 16 秒观察通过写成窗口时序问题已修复。
  - MDK 再分发条款和随包 FFmpeg 的对应源码／提供材料仍须核定，第三方组件分别遵守自己的许可。
  - 真实旧资料迁移、设备音画和读屏结果以实际操作人的记录为准。
