Description: 修狗TV 是运行在 Windows 10/11 x64 上的桌面影视客户端。导入自己的影视配置后，可以在同一套界面里浏览分类、搜索剧集、选集播放，并随时切换到电视直播；播放内核基于 libmpv，支持硬件解码、多轨切换、倍速与断点续播，解析层内置 JVM 运行时，可直接运行既有生态的 spider 插件。软件本身不提供任何内容源，播放内容来自使用者自行添加的配置。
