ReleaseNotes: |-
  修狗 TV v1.0.4
  这一版主要解决打不开和播不稳：安装包与便携包自带 VC++ 运行库，没装过运行库的电脑也能直接打开；修复关闭时崩溃；直播加入专用缓冲与断流自动重连。设置里新增长按倍速、无痕浏览、自动换线路开关和安全 DNS。无破坏性变更，v1.0.1 / v1.0.2 / v1.0.3 可直接覆盖升级，数据与配置无需迁移。
  本版亮点
  - 打开即用：包内自带 VC++ 2015–2022 运行库，不再出现「缺少 VCRUNTIME140_1.dll」（#2）；也无需安装 Java。
  - 关闭不再崩溃：修复 v1.0.1 起关闭时的崩溃退出（以及随之写入的约 57 MB 崩溃转储），关闭更快。
  - 直播更稳：直播使用单独的缓冲与超时设置，断流时自动重连（1 / 2 / 4 秒退避），换台立即生效。
  - 长按倍速：播放时按住 → 临时 2 / 3 / 4 倍速（默认 3 倍），松开恢复；短按仍快进 10 秒。
  - 无痕浏览：开启后不记录播放历史与续播进度。
  - 自动换线路开关：可关闭起播失败时的自动换线。
  - 安全 DNS：可选阿里 / 腾讯 / Cloudflare / 自定义 DoH，解析失败自动回落系统 DNS。
  - 复制网盘分享链接（#4）：详情里有明文分享链接时，顶栏出现「复制分享链接」。
  其他修复与改进
  - 弹幕不再串片 / 串集：自动匹配会核对片名、季和集号（含网盘文件名式集名），对不上时宁可不显示，按钮提示「未找到匹配弹幕」。
  - 全屏 / 退出全屏不再抽动。
  - 硬件解码选项只保留真正可用的几项，旧设置自动迁回「自动」；播放设置里可看到当前实际解码方式。
  - 播放页底部细进度条可关闭。
  - 网盘类站源的「网盘登录」配置弹窗可正常打开（如嗷呜），点网盘行可进入扫码 / 输入 Cookie 登录（此前点在文字上没反应）。
  - 包内自带 Python 运行时，供 Python 类站源使用（实验性，#5）。
  - 站源没给内容时不再静默空白或笼统报「播放解析失败」，直接显示站源给出的原因（如王二小网盘站「源方可能已关闭网盘在线模式」）（#7）。
  - 站源载荷的本机代理出错时返回明确原因（含「载荷方法未转换成功」标注），不再是笼统的 500；网页版配置中心的其余问题见「已知限制」（#6）。
  - 检查更新不再忽略带 -hotfix 后缀的正式版。
  - 便携包 zip 改用标准路径分隔符，各类解压工具都能正确解压。
  播放体验修复
  - 嗷呜等网盘站源的影片可以正常播放、拖动（此前播放器连接本机加速代理失败）。
  - 开着 Clash 等代理软件时，很多线路播不了、时间轴一点点加载的问题已修复。
  - 视频正常播放时不再误弹「播放错误」。
  - 播放时鼠标一动就出现，静止 5 秒隐藏；设置里可关闭自动隐藏。
  - 「默认倍速」每次起播都生效。
  - 站源一次返回多档清晰度时默认取第一档，不再报「未返回播放地址」。
  - 肥猫源：「韩圈」这类依赖站源本地代理的线路、「酷狗」音乐 / MV 可正常播放；整份配置实测 15 站可直接播放。
  站源加载与报错
  - 冷启动（第一次打开、站源组件还没下载好）时直接进站点不再空白：等待时间放宽到足以完成首次加载，失败时显示原因；首次加载失败也不再「卡死」到重启（以前要先全局搜索一次才能用）。
  - 饭太硬「光影」：站源自带的备用网络线路被拒时自动改走系统线路重试一次，首页、分类、搜索恢复。
  - 需要先在弹窗里扫码登录网盘才能播的线路（如饭太硬「海绵」秒播），明确提示「站源需要先在弹出的窗口里完成操作（如扫码登录网盘）后才能继续」，不再笼统报空。
  - 首页 / 分类 / 搜索失败不再伪装成「暂无内容」；聚合搜索里个别站失败会标出，不影响其他站的结果。
  网盘登录与 Issue #8（#8）
  - 网盘扫码登录跨重启保留：此前站源保存在「偏好」里的登录信息（夸克等）重启后全部读不回来；现已修复，旧版本存下的登录信息会自动迁移。站源可能用到的其他保存位置（文件、外部存储、网页 Cookie 等）也都改为持久保存，强制结束进程后重启同样能读回。
  - 「重置所有设置」同时清掉各站源的网盘登录状态，重置后需要重新扫码；已下载的站源组件保留。
  - 详情页选集从拥挤的固定五列改为约三列自适应，长集名可显示两行，悬停可看完整名称。
  - 播放器切到缺少当前集的线路时，不再直接拒绝：保持当前视频播放，展示目标线路目录；用户选择目标集后才解析换播。浏览线路和正在播放线路会分别标记。
  下载

  | 文件                                      | 说明                           |
  | ----------------------------------------- | ------------------------------ |
  | xiugou-tv-windows-x64-v1.0.4-setup.exe    | 安装版，图形化安装             |
  | xiugou-tv-windows-x64-v1.0.4-portable.zip | 便携版，解压即用，不写注册表   |
  | SHA256SUMS                                | 上面两个文件的 SHA256 校验清单 |

  两个包内容等价、自带 JRE 21 与 VC++ 运行库，无需另装 Java 或运行库；二选一即可。
  校验：下载 SHA256SUMS 后在同目录执行 sha256sum -c SHA256SUMS；Windows 可用 certutil -hashfile <文件名> SHA256 对照。
  升级说明
  - 安装版：直接运行新安装包覆盖安装，安装目录与快捷方式不变。
  - 便携版：解压覆盖到原目录，保持 runtime\jre、companion\dist 与 exe 同级。
  - 配置源、历史、收藏、偏好与数据目录均不受影响；已扫码的网盘登录状态保留（v1.0.3 存下的会自动迁移）。
  常见问题
  以前装过 v1.0.x 时按说明装了 VC++ 运行库，现在需要卸载吗？
  不需要。新版优先使用包内自带的运行库，系统里装着的运行库不影响使用。
  打开后看不到窗口（任务栏有图标）
  v1.0.3 起已修复：最小化状态下关闭后，下次启动窗口会自动回到屏幕内。
  已知限制
  - 本软件不提供任何内容源，所有内容来自你自行导入的配置。
  - 安全 DNS 不作用于视频流本身（播放器内部解析）、Java 解析服务与走代理的请求。
  - 弹幕与共享片段依赖在线服务；网络不通时这两项静默不可用，不影响播放。
  - 需要账号的网盘线路仍需在站点的配置中心扫码或填写 cookie。
  - Python 类站源用「站源缓存」保存的数据只在本次运行内有效（计划 v1.0.5 改为持久）。
  - 播放器仍只有 mpv 内核；核显机器上的占用对比尚未实测。播放设置底部的「解码」行可看到是否真在硬解。
  - 需要「网页嗅探」的线路（站源只给网页地址，如部分优酷 / 爱奇艺 / B 站线路）以及 drpy2 类 JS 站点，桌面端暂不支持。
  - 网页版配置中心（#6）：部分站源载荷把配置页地址写死为本机 127.0.0.1，手机扫码打不开，请在电脑浏览器里打开；个别载荷在本机打开也会报错（载荷方法未能转换），待拿到对应载荷后再修。
  - 安装包未做代码签名，SmartScreen 可能提示「未知发布者」，选择「更多信息 → 仍要运行」即可。
