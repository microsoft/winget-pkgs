ReleaseNotes: |-
  修狗 TV v1.1.0
  版本跃进到 v1.1.0，后续会提高小版本的发布速度。这一版把配置、找片和播放串了起来。猫源 ZIP 可以直接导入，影视源和直播源都能分组整理。首页可以按评分挑片，点播弹幕可以自己搜索匹配。播放器会记住同一部剧的倍速，网盘播放也修复了伴随服务在约 30 分钟时被当作空闲关闭的问题。
  本版亮点
  - 聚合搜索可以选站。在「设置 → 通用 → 聚合搜索站点」按站名或 key 查找并勾选。每份配置单独记忆，切回来仍用原来的选择。全选会包含以后新增的站点，清空则暂停当前配置的聚合搜索。
  - 猫源 ZIP 直接导入。在「设置 → 配置源管理 → 添加配置源 → 导入本地文件…」选原始 ZIP。包里有 .json 和 .jar 即符合文件要求，支持子目录、自定义文件名及大小写扩展名。导入后可直接选站。
  - 影视源和直播源分别归类。两个设置页都能新建空分类、编辑备注、勾选多条源并拖到分类。删除分类会把其中的源移回「未分类」。主配置列表另有复制地址、重命名等操作。
  - 首页找片。热门电影的海报铺满焦点区，可以点底部缩略图选片。点「评分盲开」会从有评分的候选中挑一部，找到同名站源条目就打开详情，找不到则显示片名搜索结果。详情里能看更新状态，以及同站同片上次看到哪一集、哪条线路、什么位置。
  - 手动搜索点播弹幕。打开点播弹幕后，点「搜索弹幕」，用片名查候选并挑对应集数。只搜索或取消时保留当前弹幕，选定后立即加载，换集重新匹配。
  - 分辨率与倍速。「设置 → 播放器与解码 → 播放页 → 显示视频分辨率」可在画面左上角显示实际宽高，默认关闭。播放页的倍速按钮可直接选档，同一部影片换集、换线和刷新沿用手选倍率。
  - 保存 WebDAV 连接。在 WebDAV 窗口勾选「保存此连接（含密码）」并成功打开目录，下次点已保存的记录即可浏览。最多保存 20 条，可编辑或删除，账号密码由当前 Windows 用户加密保存。
  - 更多脚本站源。新增道长、小雅等源的支持。扩展猫源包播放接口。部分 NSFW 类站点出现支持的网页验证时，可自行打开验证页，完成后返回重试。
  其他修复与改进
  - 侧栏可以完全收起，使用边缘按钮或键盘重新展开，重启保留折叠状态。首页海报和简介上的滚轮滚动整页，底部海报栏单独横向滚动。系统开启减少动画时会停用自动轮播。
  - 「直播源 → 导入本地文件」支持 TXT、M3U、M3U8 和 JSON。同一路径重新导入会刷新频道，导入失败或取消时仍可使用原清单。
  - 站点选择器打开时定位当前站点。首页默认站按站点标识匹配，配置作者更新 JAR 或参数后仍能找到原站。目录支持逐级返回，配置说明、扫码动作和影片分别打开对应界面。修复了 tvbox.do-u 特定版本开启默认筛选时加载不到影片的问题。
  - 「设置 → 关于 → 下载镜像」可开关镜像优先、填写远程镜像列表或恢复默认。镜像过慢或失效时自动尝试其他地址，下载的安装器仍须通过 SHA-256 校验。
  - 修复部分开关在鼠标悬停时滑块看不清、打开详情后取消仍被迟到结果覆盖的问题。便携版优先使用程序旁可写的 user_data，当前数据目录可在设置中查看。
  播放体验修复
  - 扫码授权保存。Windows 上其他进程短暂占用插件偏好文件时，会重试保存，减少扫码后重启又要求授权的情况。
  - 网盘持续播放。播放、暂停和缓冲时保留伴随服务。支持的本机代理中断或地址过期时，播放器会有限次重新取址并尝试从原位置继续。连续超过 30 分钟的真实账号播放留给实机验收。
  - 音轨和字幕。选择音轨、切换字幕或关闭字幕后，再打开菜单可看到与引擎一致的勾选状态。感谢 @digiprospector 的 PR #21。
  - B 站分 P。多分 P 视频按所选分集请求对应公开媒体。站点返回风控或没有可用媒体时会给出错误。
  - 拖动与大文件。修复拖动失败提示长期挡住控制条的问题。网盘代理按请求区间流式传输大文件，并将截断和连接错误反馈给播放器。
  升级说明
  1. 在 v1.0.5 设置中导出历史、收藏与偏好，记下当前数据目录，完全退出程序。
  2. 安装版运行新版安装器，选择原安装目录。便携版完整解压到新目录，从该目录运行 xiugou_tv.exe。
  3. 打开设置核对版本、实际数据目录、配置源、历史和收藏，再试播一集。保留旧目录和备份直到核对完毕。
  4. WebDAV 已保存的凭据绑定 Windows 用户，普通备份会排除它们。换用户或换机后可重新连接。
  常见问题
  原始猫源 ZIP 还要先解压或改成 config.json 吗？
  直接选择 ZIP 即可。有多个 JSON 时优先选择 config.json，其余按目录深度和文件名排序。道长 PHP 的分发 ZIP 是另一种结构，应完整解压，保留 php 目录，再导入配套 config.json。
  网盘扫码成功后，重开为什么还会提示认证？
  订阅账号、网页服务授权和插件网盘账号分别保存。先看提示来自哪一层。Java 插件使用 SharedPreferences 时，数据通常在当前 Windows 用户的 %USERPROFILE%\.xiugou_tv_companion\prefs\，插件也可以使用自己的存储。核对时可重开同一配置查看登录状态。
  点了「评分盲开」为什么看到了搜索结果？
  找到同名站源条目时会打开详情。暂时匹配不到时保留片名并列出搜索结果，你可以自己选片和线路。
  已知限制
  - 8/8 组样本走到解码和拖动后续播。11 次尝试中 8 次通过。PG 冷启动和各站单条播放线路的可用性会随上游变化。
  - 内容来自自行导入的配置。首次进入可能超时，授权线路需要分别验证。
  - 网页验证需要本人完成。部分站点要求移动端专用组件、网页嗅探或服务端依赖，当前支持范围取决于站点。
  - 晚间实播使用软件解码。真实硬解、可听音画、网盘长播和旧安装迁移的结果以各设备的人工记录为准。
