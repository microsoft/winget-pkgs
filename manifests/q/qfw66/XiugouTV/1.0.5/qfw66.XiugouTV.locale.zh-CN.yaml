ReleaseNotes: |-
  修狗 TV v1.0.5
  这一版主要补齐播放选择和直播管理：新增站源分类筛选、多档清晰度切换、手动跨站换源、自定义快捷键与第三方播放器入口；直播支持独立来源切换和点播 / 直播模式选择，弹幕可以调节密度、合并重复内容。本版新增 Python 直播脚本兼容、游戏直播实时彩色弹幕、搜索站点栏展开 / 拖动，以及同名直播频道合并与线路下拉。同时修复夸克扫码、本机网页配置中心、饭太硬玩偶加载和多项播放交互问题。
  本版亮点
  - 站源分类筛选：站源提供类型、年份、地区等条件时可直接筛选，翻页保留条件；默认收起，可在设置里调整默认展开。
  - 清晰度切换：站源返回多档地址时可手动切换，保留进度、暂停状态、倍速和音量；切换失败时尝试恢复原档。
  - 手动跨站换源：点击「换源」后，在当前配置的其他可搜索站点查找同片同集；搜索期间原片继续播放，可以取消，失败时保留或恢复原播放。
  - 自定义快捷键：16 类播放动作可改键，支持冲突检查、即时生效、重启保留和恢复默认。
  - 第三方播放器：设置中选择本机播放器程序后，可把当前播放地址交给 mpv、VLC 或通用播放器；成功启动后暂停内置播放。
  - 独立直播源：设置中可导入直播链接、本地文件和单条频道，查看来源历史、删除手动频道；播放页频道抽屉顶部可切换直播源。
  - 同名频道合并与线路下拉（#17）：同一来源、同一分组中，同名且播放配置兼容的频道合并显示，各地址在「线路」下拉选择。保留线路名称与顺序，兼容旧地址别名的收藏和最近播放；静态目录更新线路时不中断当前播放，已从目录移除的地址仅在继续播放时保留，成功切走后从线路下拉移除。手动频道保持独立；请求头、脚本身份、节目单（EPG）或播放模式不兼容时分别保留。
  - 弹幕精简（#14）：密度可选全部 / 1/2 / 1/4 / 1/8 / 1/10；可选合并短时间内的重复弹幕，合并默认关闭。
  - Python 缓存跨重启保留：使用 getCache/setCache 的脚本可恢复上次缓存，不同脚本相互隔离；重置数据时同步清理。
  - Python 直播脚本兼容：补齐 CCTV、广东广电（GD）、央视频（YSP）和游戏直播样例所需接口，接通对应的动态目录、节目单、本机直播代理和多线路；刷新、切源与重启后重新取得地址，收藏频道不依赖临时代理令牌。脚本已用本地夹具验证，真实公网播放仍待验收。
  - 游戏直播实时彩色弹幕：为提供实时弹幕来源的房间增加彩色与多色渐变弹幕，支持开关、快捷键、样式设置及连接状态提示；暂停 / 缓冲时不接纳新消息，切房间或关闭后清理旧订阅。
  - 搜索站点栏更易操作：默认单行，右侧按钮可展开 / 收起；支持鼠标按住拖动和滚轮横向滚动，拖动不会误选站点。
  其他修复与改进
  - 影片卡片和列表中的长标题最多显示两行，悬停仍可查看完整名称。
  - 对集号能明确识别的乱序线路保守整理顺序；含预告、重复集号等不确定列表保持原样。
  - 选集列表位置与真实集号分别展示，改善长集名和片段身份提示。
  - 直播列表默认显示分类、频道两栏，可切换为标签布局；标签支持鼠标拖动和滚轮横向滚动（#10）。
  - 修复浅色主题下直播列表过暗；隐藏工具栏时首次单击画面先呼出工具栏，避免直接暂停。
  - 伴随服务 HTTP 调试日志默认隐藏 Cookie、Authorization 等敏感请求头，分段下载改为定时汇总，减少刷屏积压。
  播放体验修复
  - 直链点播 / 直播识别（#9）：支持自动识别 HLS 点播，也可在播放方式菜单里手动选择「按点播 / 按直播」。
  - 拖动失败可恢复：点播跳转约 10 秒仍未恢复时，提供「重试跳转 / 回到原位置」；连续拖动或切集后，旧目标不会继续弹提示。
  - 拖动进度条时实时显示目标时间，拖动期间控制条保持可见。
  - 修复起播失败后自动换线路被进度回调过早取消的问题。
  - 调整倍速播放的同步路径；真实设备上的口型与声音同步仍待实机验收。
  - 修复直播工具栏自动隐藏；直播报错后仍能打开频道列表换台。
  - 直播目录更新与切线、刷新同时进行时，线路下拉按最新目录与实际播放地址更新；切换失败恢复原播放后也保持一致。
  - 多个频道共用播放地址时，切台与失败后的续播仍对应正确频道；独立游戏直播和点播不会误用电视频道目录。
  站源加载与报错
  - 本机网页配置中心（#6）：修复已定位的页面转换错误，新增「在本机打开配置页」入口；手机访问仍不支持。
  - 夸克扫码（#11）：修复登录二维码地址被错误改写成局域网地址的问题。
  - 扫码后加载失败（#12）：修复解密回包被中断后导致站点加载失败的一种触发路径；其他解密服务故障见「已知限制」。
  - 网盘多线程播放在 Windows 使用 Java 代理；站源未给播放地址时，直接显示其返回的具体原因。
  - 修复肥猫配置页手动输入 Cookie 弹窗；改善部分 PG 载荷加载和饭太硬看球站点的类加载兼容。
  升级说明
  - 升级前先在设置中导出历史、收藏和偏好备份，记录当前数据目录，再完全退出修狗 TV。
  - 安装版：运行新安装包，沿用原安装目录覆盖安装；默认目录为 Program Files\XiugouTV，使用自定义目录时保持原路径。
  - 便携版：完整解压到新目录，保留原用户数据和备份，不要直接覆盖旧程序目录；保持 runtime\jre、companion\dist 与 exe 的相对位置。启动后检查数据目录与旧配置，使用自定义数据目录时确认路径仍正确。
  - 旧偏好中缺失的新字段按默认值读取；筛选条默认收起、弹幕密度默认全部、重复合并默认关闭，第三方播放器需手动配置。
  - 清晰度档名和分类筛选条件只在本次运行内记忆；换主配置或重启后清空。
  - 完整旧安装升级与数据迁移尚未经实测；升级后请核对历史、收藏和配置，确认正常后再清理旧程序目录与备份。
  常见问题
  为什么没有清晰度选项？
  只有站源确实返回多个档位时才显示切换入口；单地址线路不会自动生成更多清晰度。
  直链仍被识别为直播，不能拖动怎么办？
  在播放方式菜单里手动选择「按点播」。真正直播流不支持时间轴拖动；HLS 探测可能因超时或源的响应格式失败，原始反馈片源仍待实机复测。
  换源会在报错后自动开始吗？
  跨站查找只在点击「换源」后开始。同站的自动换线路仍按原设置运行。
  第三方播放器能带上进度和请求头吗？
  mpv 支持有效请求头和点播位置；VLC 支持 User-Agent / Referer 与位置；通用方式仅传地址。外部进度不回传，使用网盘等本机代理地址时需保持修狗 TV 运行。
  已知限制
  - 本软件不提供任何内容源，所有内容来自你自行导入的配置。
  - 网页配置中心仅支持电脑本机浏览器；#12 的解密服务启动失败、熔断和缺依赖等故障未全部覆盖。
  - alist-tvbox PG 的自建订阅、网盘传递及依赖特殊运行环境的站点仍未完整适配（#15）。
  - 仍不能直接选择裸 .py 文件生成站点；可先编写 JSON 配置再导入（#16）。
  - 原「添加配置源」入口不直接识别所有直播文件；直播使用独立导入入口，列表为源选择加分类、频道两栏，没有完整三级来源树。抽屉切源只影响直播，不是全局主配置快捷切换。
  - 普通电视直播未提供实时弹幕来源时，即便使用「按点播」方式也不显示弹幕入口；直播页不提供共享片段。
