  反馈问题
  请在 Issues 反馈。为了能尽快定位，提交前请：
  1. 先搜索已有 Issue，同一问题直接在原 Issue 下补充，不必新开；
  2. 一个 Issue 只说一个问题；
  3. 按下面的格式填写（可直接复制）：
  【版本】v1.0.5（请按设置 → 关于的实际显示填写，并附 Build Time 与 Commit Hash）
  【系统】Windows 10 / 11（按 Win+R 输入 winver 查看具体版本）
  【安装方式】安装版 / 便携版 / 开发测试包
  【问题描述】发生了什么，期望是什么
  【复现步骤】1. … 2. … 3. …（是否每次都能复现）
  【相关站点】站点名称 / 配置类型（Tvbox JSON、多仓、CMS 等）
  【错误日志】设置 → 关于 → 错误日志 → 复制全部，粘贴在这里
  【截图 / 录屏】可选，能大幅加快排查
  请不要在 Issue 里粘贴私人订阅地址、Cookie、令牌、账号密码等隐私信息；需要提供配置时，说明站点名称与类型即可，必要时打码后再贴。
