ShortDescription: Parametric associative B-rep CAD/CAM
Description: 'A desktop CAD with a parametric sketcher, a feature timeline, assemblies with joints, and CAM. Sketches, features and assemblies stay associative: a dimension changed in the middle of the timeline rebuilds everything that stands on it.'
