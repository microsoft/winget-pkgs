ShortDescription: Self-hosted media server for your own films, series, music and books, with native apps for every screen.
Description: |-
  Quven is a media server you run on your own computer or NAS. Point it at the folders where you keep films and series, music, books and audiobooks, and it'll recognise each title and fetch the covers and plots by itself, so you end up with one library you can open from any screen in the house, the big TV in the living room included.

  This package installs the server together with the Windows desktop app. Whenever it can, the app plays the original file directly. Picture and sound reach you untouched, and it'll even open DVD and Blu-ray menus from an ISO image. Phone too old for a 4K HEVC file? The server converts it on the fly, and it uses the graphics card if there's one.

  There are native apps for Android, Android TV, Fire TV and the iPhone. A web app covers the rest. Personal use is free, with no ads and no time limit, and you can add an optional paid plan later if you'd like remote access without opening ports, AI matching or the subtitle tools.
