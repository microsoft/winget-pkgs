ShortDescription: Media server da installare in casa per film, serie, musica e libri, con app native per ogni schermo.
Description: |-
  Quven è un media server che installi sul tuo computer o sul NAS. Gli indichi le cartelle dove tieni film e serie, musica, libri e audiolibri, e lui riconosce ogni titolo e scarica da solo copertine e trame, così alla fine hai un'unica libreria che si apre da qualsiasi schermo di casa, compreso il televisore del soggiorno, senza copiare niente da un dispositivo all'altro e senza abbonarti a un servizio di qualcun altro.

  Il pacchetto installa il server insieme all'app desktop per Windows. Appena il formato lo consente, l'app riproduce il file originale. Immagine e audio arrivano intatti. Apre perfino i menu di DVD e Blu-ray da un'immagine ISO. E se il telefono è troppo vecchio per un file 4K HEVC? Ci pensa il server, che lo converte al volo e usa la scheda grafica quando c'è.

  Ci sono app native per Android, Android TV, Fire TV e iPhone, e un'app web per tutto il resto. L'uso personale è gratuito, senza pubblicità e senza scadenza. Più avanti, se ti servono, si aggiunge un piano a pagamento per l'accesso remoto senza aprire porte, il riconoscimento con l'AI o gli strumenti per i sottotitoli.
