PackageIdentifier: q037180.SnapOCR
PackageVersion: 1.0.3
PackageLocale: zh-CN
Publisher: SnapOCR Contributors
PackageName: SnapOCR
PackageUrl: https://github.com/q037180/SnapOCR
License: MIT
ShortDescription: 离线截图 OCR，深色界面自动反色，识别结果进历史可搜索
Description: >-
  SnapOCR 是免费开源的 Windows 截图文字识别工具。按全局热键框选屏幕任意区域，
  松开即识别并复制到剪贴板。深色 IDE 与暗色网页会先自动反色、再做 CLAHE 对比度增强
  后送入识别，解决低对比度文本整行漏检的问题。每次结果自动进入可搜索历史，
  支持导出 txt / docx / pdf / md / xlsx。另支持图片批量队列、PDF 逐页识别、
  表格转 Excel、长截图拼接、截图贴图和截屏翻译。内置简体中文模型，默认全程离线；
  切换其他语言时首次需联网下载对应模型，之后离线可用。
# Tags 只允许出现在 defaultLocale 清单里，locale 清单不要重复定义。
