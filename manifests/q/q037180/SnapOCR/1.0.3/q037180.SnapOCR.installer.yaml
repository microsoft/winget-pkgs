# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: q037180.SnapOCR
PackageVersion: 1.0.3
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
# 单文件 exe 是 PyInstaller onefile，自解压到临时目录即可运行，不需要安装器。
# 7z 绿色包虽然启动更快，但 winget 的 InstallerType 不支持 7z；那个交给 Scoop。
InstallerType: portable
# portable 装到用户目录，写 Scope 会被校验器报 "Scope is not supported"。
# 命令别名用 1.9+ 的 Commands；PortableCommandAlias 在 1.10 schema 里已不存在。
Commands:
  - snapocr
UpgradeBehavior: uninstallPrevious
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/q037180/SnapOCR/releases/download/v1.0.3/SnapOCR.exe
    InstallerSha256: 68dbec68c8bb8934e045e2ab324d609938acf999ee0e54df4d8bda2c683a5abf
ManifestType: installer
ManifestVersion: 1.10.0
