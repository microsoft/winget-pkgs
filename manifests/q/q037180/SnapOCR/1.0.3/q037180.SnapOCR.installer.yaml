# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: q037180.SnapOCR
PackageVersion: 1.0.3
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
# 用 onedir 绿色包（zip 容器），不用单文件 exe。
# 单文件版是 PyInstaller onefile，每次启动都要把 155 MB 解压到临时目录；
# 本机实测 52 次启动有 7 次以 127（ERROR_PROC_NOT_FOUND）失败，
# 换临时目录到另一块盘仍是 3/20 失败 → 是 onefile 形态本身的脆弱点。
# 同一份 onedir 产物 20/20 全部正常启动，且冷启动快一半，故选它。
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: SnapOCR\SnapOCR.exe
    PortableCommandAlias: snapocr
UpgradeBehavior: uninstallPrevious
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/q037180/SnapOCR/releases/download/v1.0.3/SnapOCR-v1.0.3-win64.zip
    InstallerSha256: d6fdf2b05660a6a796183552cfd2166c4e1ed2c8a3344d455ee633d197a75591
ManifestType: installer
ManifestVersion: 1.10.0
