ShortDescription: Offline screenshot OCR with dark-UI preprocessing and searchable history
Description: >-
  SnapOCR is a free, open-source Windows screenshot OCR tool. Press a global
  hotkey, drag a region, and the recognized text is copied to the clipboard.
  Dark-themed IDEs and dark-mode pages are automatically inverted and enhanced
  with CLAHE before recognition, which fixes whole-line misses on low-contrast
  text. Every result is stored in a searchable history and can be exported to
  txt, docx, pdf, md or xlsx. Also supports batch image queues, per-page PDF
  recognition, table-to-Excel, long screenshot stitching, pinned screenshots
  and screenshot translation. The bundled Simplified Chinese model works fully
  offline; other language models are downloaded once on first use.
