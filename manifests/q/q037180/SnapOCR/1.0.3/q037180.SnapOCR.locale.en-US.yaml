ReleaseNotes: |-
  Stability and correctness release: 22 fixes on top of v1.0.2, including
  clean shutdown of running worker threads, fixed dangling overlay references,
  correct table columns with empty cells, mixed-DPI multi-monitor alignment,
  dynamic-content-safe long screenshot stitching, and single-instance mutex.
