ShortDescription: Windows tray utility for DDC/CI monitor brightness and HDR control.
Description: BrightWheel is a native Windows tray utility for controlling the primary external monitor's brightness over DDC/CI and toggling HDR without vendor software. The release also includes the bright command-line companion for diagnostics and scripts.
