ShortDescription: Privacy-first screenshot OCR and translation desktop tool
Description: PingYi captures a selected screen region, recognizes its text, and translates it in a compact result card. It supports fully local OCR and translation, local LLM services such as llama.cpp and Ollama, and optional Google Cloud or Baidu providers using credentials supplied by the user. The default local workflow keeps screenshots and text on the device and does not retain a history.
