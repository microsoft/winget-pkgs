ShortDescription: Desktop database client for SQL and NoSQL databases.
Description: |-
  QoreDB is a desktop database client built with Rust and Tauri.
  It connects to PostgreSQL, MySQL, MariaDB, SQL Server, SQLite, DuckDB, ClickHouse,
  MongoDB, Redis, Cassandra, Elasticsearch and more from a single interface.
  Credentials stay in the OS keychain and production connections are guarded against destructive queries.
