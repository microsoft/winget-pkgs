PackageIdentifier: QRGenerator.QRGenerator
PackageVersion: 1.2.0
PackageLocale: cs-CZ
Publisher: Matous
PackageName: QR Generátor
License: Freeware
ShortDescription: Generátor a čtečka QR kódů s generátorem hesel.
Description: |-
  QR Generátor vytvoří QR kódy pro webové adresy, text, e-mail, telefon, SMS, vizitky (vCard / MeCard), QR Platbu (SPAYD), polohu, Wi-Fi, události v kalendáři, sociální sítě a Bitcoin. Každý kód se po změně zkusí přečíst a aplikace upozorní na nízký kontrast.
  Kódy mohou mít vlastní barvy i přechody, průhledné pozadí, logo uprostřed, záhlaví a různé tvary bodů a rohů. Umí i hromadné kódy, šablony a historii. Export do PNG (až 4000 px, 300 DPI), SVG, do schránky i tisk.
  Vestavěná čtečka přečte QR kód z obrázku nebo snímku obrazovky a generátor hesel vytvoří náhodná i zapamatovatelná hesla a uživatelská jména. Rozhraní je v češtině a angličtině.
