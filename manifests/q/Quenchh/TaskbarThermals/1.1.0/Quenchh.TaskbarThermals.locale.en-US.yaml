ShortDescription: Live CPU and GPU temperature and usage on the Windows 11 taskbar.
Description: |-
  Shows CPU/GPU temperature, usage and power (plus optional RAM, network and disk) on the Windows 11 taskbar.
  Click it for a details panel with 10-minute, 1-hour and 24-hour charts, fan speeds and voltages.
  Logs sudden CPU temperature spikes together with the processes that caused them, and watches the event log for WHEA hardware errors, blue screens and unexpected shutdowns, which is useful when testing undervolts or BIOS settings.
  Reading CPU sensors needs administrator rights and the PawnIO driver.
