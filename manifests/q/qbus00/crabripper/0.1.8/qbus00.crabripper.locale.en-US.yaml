ShortDescription: Records Shoutcast/Icecast and HLS internet radio streams to files — a Rust port of streamripper.
Description: |-
  crabripper records internet radio (Shoutcast/Icecast over HTTP/HTTPS, and HLS) to per-track files or one file per show.
  It is a Rust port of streamripper with the same command line, plus several streams in one command, a graceful Ctrl+C stop,
  retry of a stream that is down at the start, and splitting the recording where a connection drop loses audio.
