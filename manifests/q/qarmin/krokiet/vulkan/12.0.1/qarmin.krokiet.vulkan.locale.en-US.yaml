ReleaseNotes: |-
  Version 12.0.1 - 29.07.2026r
  Czkawka GTK Deprecation Notice
  Version 12.0 is the last released version of Czkawka GTK. No new binaries will be provided from this point on. All users are encouraged to migrate to Krokiet, the new Slint-based GUI frontend.
  Core
  - Fixed an issue where console windows appeared on Windows when running FFmpeg internally - #1989
  - Added BuildRuntimeInfo, a new module that detects compile-time features (HEIF, LibRAW, AVIF) and the runtime availability of FFmpeg and FFprobe at startup - #1989
  Krokiet
  - Added a new "About / Diagnostics" panel to inspect build/runtime features and verify whether specific image files are recognized correctly - #1989
  - Fixed the sort popup not displaying its background - #2011
  - Fixed text overflowing in popups for some languages - #2011
  - Fixed the Video Optimizer optimize confirmation popup content being cropped - #2011
  - Added translations for settings dropdown options - #2011
  - Pinned Slint to version 1.17.0 to avoid a Wayland bug introduced in 1.17.1 that prevented the window size from being restored correctly on startup - #2011
  Cedinia
  - Fixed an incorrect progress bar status - #1989
  - Fixed automatic language detection on first launch - #1989
  - Migrated all raw and unsafe JNI usage (file picker, notifications, Android path setup) to the new jni-high crate - #2011
