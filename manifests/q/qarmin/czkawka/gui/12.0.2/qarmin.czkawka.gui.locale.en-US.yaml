ReleaseNotes: |-
  Version 12.0.2 - 09.09.2026r
  Czkawka GTK Deprecation Notice
  Version 12.0 is the last released version of Czkawka GTK. No new binaries will be provided from this point on. All users are encouraged to migrate to Krokiet, the new Slint-based GUI frontend.
  Core
  - Surfaced rollback rename failures in make_hard_link/make_file_symlink instead of silently ignoring them - #1995
  - Switched the XDG portal trash implementation to async-io, avoiding a Tokio runtime requirement alongside Slint's async-io backend - #2025
  - Fixed the AVIF license metadata - #2060
  - Fixed the AVIF tests - #2061
  CLI
  - Rejected non-finite user input (e.g. NaN/inf) in numeric arguments - #2038
  Krokiet
  - Fixed popup OK/Close button text truncation and centered popups more reasonably - #2043
  - Added the ability to start a scan in Krokiet via CLI arguments - #2069
