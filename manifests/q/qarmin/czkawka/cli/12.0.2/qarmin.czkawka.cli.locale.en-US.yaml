ReleaseNotes: "## Version 12.0.2 - 09.09.2026r\r\n\r\n### Czkawka GTK Deprecation Notice\r\n**Version 12.0 is the last released version of Czkawka GTK.** No new binaries will be provided from this point on. All users are encouraged to migrate to Krokiet, the new Slint-based GUI frontend.\r\n\r\n### Core\r\n• Surfaced rollback rename failures in `make_hard_link`/`make_file_symlink` instead of silently ignoring them - [#1995](https://github.com/qarmin/czkawka/pull/1995)\r\n• Switched the XDG portal trash implementation to `async-io`, avoiding a Tokio runtime requirement alongside Slint's async-io backend - [#2025](https://github.com/qarmin/czkawka/pull/2025)\r\n• Fixed the AVIF license metadata - [#2060](https://github.com/qarmin/czkawka/pull/2060)\r\n• Fixed the AVIF tests - [#2061](https://github.com/qarmin/czkawka/pull/2061)\r\n\r\n### CLI\r\n• Rejected non-finite user input (e.g. `NaN`/`inf`) in numeric arguments - [#2038](https://github.com/qarmin/czkawka/pull/2038)\r\n\r\n### Krokiet\r\n• Fixed popup OK/Close button text truncation and centered popups more reasonably - [#2043](https://github.com/qarmin/czkawka/pull/2043)\r\n• Added the ability to start a scan in Krokiet via CLI arguments - [#2069](https://github.com/qarmin/czkawka/pull/2069)\r\n\r\n## Virustotal\r\n• https://www.virustotal.com/gui/file/de7e8a01cf16caf742a2da350f5c9a49477cdc75a63d05d0ea18fd1c50737285\r\n• https://www.virustotal.com/gui/file/e1448221dd5df8c79653e25d094ec138150632a7b1929454648e0015ca4066ac\r\n• https://www.virustotal.com/gui/file/6374de477106e8135b9b96e424b8490d47ec70327af36dc3efed7ac90a705df3\r\n• https://www.virustotal.com/gui/file/102d97dd4bd8ffe798136c45137a4986f0e31f355a593fc64dcfd415e705554f\r\n• https://www.virustotal.com/gui/file/35a77107380f19417c24016448c6371c199b2f46e816c85779e36eb819fb02b5\r\n• https://www.virustotal.com/gui/file/eb7c2009d2dd49cf5202acbd65370caece0a3f819b9515e727cedb1ec088ed1a\r\n• https://www.virustotal.com/gui/file/2daf2b008c35556573829c5f752888d5028a0b988bfae2dc32ebf0e976233441\r\n\r\n## Legend:\r\n• If you are a beginner or don't know which version to use, start with one of these depending on your OS (if they don’t work, try different builds):\r\n  • **Windows** – `windows_krokiet_on_windows_skia_opengl.exe`, `windows_krokiet_on_linux.exe`, `windows_czkawka_gui_gtk_412.zip`  \r\n  • **Mac** – `mac_krokiet_skia_vulkan_x86_64`, `mac_krokiet_skia_vulkan_arm64`, `mac_czkawka_gui_x86_64`, `mac_czkawka_gui_arm64`\r\n  • **Linux** – `linux_krokiet_x86_64`, `linux_krokiet_all_backends`, `linux_czkawka_gui_x86_64`\r\n• `krokiet` – primary graphical version of the application, fully supported and actively developed, includes new features and ongoing improvements\r\n• `gtk_gui` – legacy GTK-based graphical version\r\n• `cedinia` - new android app\r\n• `cli` – command-line version of the app\r\n• `arm`, `x86_64` – CPU architecture. Most Windows/Linux uses `x86_64`, while on Mac the `arm` version is becoming the most common choice. \r\n• `heif`, `raw`, `avif` – additional features that require extra libraries installed on the OS\r\n• `skia_opengl`, `skia_vulkan`, `femtovg_wgpu`, `all_backends` – alternative Krokiet backends, use different, when you have problem with current\r\n• `deps` - scripts that you can run, to install required/optional apps/libraries\r\n\r\nYou can read more about 12.0.0 version on Medium:\r\n• English article – https://medium.com/@qarmin/krokiet-czkawka-12-0-6fa09c43c3b9\r\n• Polish article – https://medium.com/@qarmin/krokiet-czkawka-12-0-c5dad2116793"
