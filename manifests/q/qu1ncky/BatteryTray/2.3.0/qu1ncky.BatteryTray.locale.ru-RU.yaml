PackageIdentifier: qu1ncky.BatteryTray
PackageVersion: 2.3.0
PackageLocale: ru-RU
ShortDescription: Заряд беспроводных наушников, мышей, клавиатур и геймпадов в трее Windows и напоминание о разряде.
Description: |-
  BatteryTray показывает у часов, сколько заряда осталось у беспроводных наушников, мыши, клавиатуры и геймпада, и напоминает до того, как они сядут посреди игры или звонка.
  Читает устройства Razer, Logitech, SteelSeries, HyperX, Corsair, ASUS, Attack Shark и многих других через их приёмники без фирменного софта, а также Bluetooth-устройства, заряд которых знает Windows.
  Все устройства в одном окне, напоминание, которое остаётся на экране, свой порог для каждого устройства, оверлей поверх игр, русский, английский и китайский языки.
