ShortDescription: 在 Windows 托盘显示无线耳机、鼠标、键盘和手柄的电量，并在电量低时提醒。
Description: |-
  BatteryTray 在时钟旁边显示无线耳机、鼠标、键盘和手柄还剩多少电量，并在它们没电之前提醒你。
  无需厂商软件，通过接收器读取雷蛇、罗技、赛睿、HyperX、海盗船、华硕、Attack Shark 等设备，以及 Windows 知道电量的蓝牙设备。
