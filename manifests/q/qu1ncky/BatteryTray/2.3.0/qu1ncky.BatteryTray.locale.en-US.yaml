ShortDescription: Battery level of wireless headsets, mice, keyboards and controllers in the Windows tray, with low battery reminders.
Description: |-
  BatteryTray shows how much battery your wireless headset, mouse, keyboard and controller have left, next to the clock, and reminds you before they die mid-game or mid-call.
  It reads Razer, Logitech, SteelSeries, HyperX, Corsair, ASUS, Attack Shark and many other devices through their receivers without the vendors' software, and Bluetooth devices whose level Windows knows.
  Every device in one window, a reminder that stays on screen, per-device levels, a battery overlay over games, English, Russian and Chinese.
