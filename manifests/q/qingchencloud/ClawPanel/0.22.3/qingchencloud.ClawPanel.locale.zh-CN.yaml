  维护设施 (Maintenance)
  - 修复只读取最终 Release 简述导致跨版本认证、执行和网络边界变更漏判的问题；补充完整 Changelog、分片索引、缺片、外域引用及材料完整性检查，证据不完整时按高风险处理。
