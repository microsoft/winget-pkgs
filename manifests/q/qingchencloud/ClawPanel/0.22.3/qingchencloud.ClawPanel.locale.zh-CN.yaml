  兼容性 (Compatibility)
  - 经维护者单独确认，将新安装的官方 OpenClaw 推荐版本从 2026.9.8 调整为 2026.10.3；同步发行 Docker、Linux 安装脚本和文档示例，不自动升级用户已安装的内核。
  - 保留 Gateway 协议 3/4 与 v3 设备签名、现有认证/配对策略；Node 要求仍按内核元数据检测，汉化版及其他引擎的固定目标不变。
  - GitHub 维护控制器的 AI 候选、PR 与自动发布开关继续关闭；其他高风险更新仍需单独确认，不沿用本次 OpenClaw 批准。
