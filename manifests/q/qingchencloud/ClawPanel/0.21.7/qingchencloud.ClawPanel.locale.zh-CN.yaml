ReleaseNotes: |-
  兼容性 (Compatibility)
  - 适配 OpenClaw 2026.9.4 的 Node.js 版本要求、npm 渠道插件安装来源确认和原生插件注册表；保留旧版协议与插件目录检测。
  - 核对 Hermes 0.21.2（v2026.9.11）的模型/Profile 配置与 Windows/Linux 安装器阶段协议；默认稳定版本暂不切换，完整升级验收另行执行。
  - DeepSeek Harness 受管目标升级至 0.1.5-rc.2（候选版），适配新版会话认证与 Typert RPC，保留旧版 RPC 分支。运行与配置页增加显式更新入口，不自动降级较新版本。
  修复 (Fixes)
  - 修复渠道插件包名重复拼接版本（@latest@版本）与汉化版本错误截断官方修订号，独立插件不跟随内核版本锁定。
  - Web 渠道安装改为异步执行并实时显示日志；安装结束必须回读插件文件，失败保留实际错误，防止安装卡住面板或虚报成功。
  - 修复新旧插件目录、QQ manifest ID 与内置插件检测；共享配置的并发安装互斥，重复安装保留现有插件。
  - 补齐 Web 微信安装/更新及渠道登录操作；微信按宿主版本选择精确兼容版本，并核对安装后实际版本，不再预先删除插件与账号配置。登录二维码使用本地 CLI 矩阵，不向外部二维码服务传递登录链接。
  - 按微信官方文档补齐新旧版本线、wechat 别名、重启入口和扫码后待就绪提示；未知版本不自动更新或显示已兼容，手动命令同样固定兼容版本。
  - 飞书新安装使用官方 @openclaw/feishu，保留已有 Lark 实现；桌面保存不再强制禁用官方插件。补充 Zalo Personal 扫码入口。
  - 修复 DSH 启动后 401 误报失败、内嵌页面资源路径导致白屏；启动认证信息仅保留在内存，代理剥离面板凭据，日志隐藏启动令牌。
  - DSH 新版使用官方网页目录选择器启动叠加层，远程用户无需操作服务器系统窗口；不修改用户 Profile。错误信息保留展示，认证失败的受管进程仍可停止。
  适配边界 (Known limitations)
  - 本版不代表全部消息渠道端到端验收完成。QQ Bot 2.0 的插件 ID/账号规则、腾讯元宝与 Zalo ClawBot 专属向导仍在适配中。
  - OpenClaw/Hermes 默认稳定基线保持不变；DSH 目标 0.1.5-rc.2 是候选版，不自动升级用户运行时。
  - 微信等渠道完成安装、配置与 Gateway 接口验证，真实账号扫码/收发、多账号隔离及全部平台实机验收尚未覆盖。
  测试与验证 (Testing)
  - 官方 OpenClaw 2026.9.4 + Node 24.16.0 隔离实测通过协议 4 握手及主要只读 RPC；LINE、IRC、微信插件完成真实安装和状态回读，安装期间 Web 健康接口持续响应。
  - 微信 Web 页面完成真实版本检测、精确版本重装和回读；飞书、Zalo、Zalo Personal 完成真实安装，四类渠道配置通过官方 CLI schema 校验。验收范围与未覆盖项目见 docs/compatibility-2026-09-14.md。
  - DSH 0.1.5-rc.2 隔离实测通过安装、模型与上下文参数同步、网页选工作区、切换模型、内嵌流式对话（本地测试接口）、重装和重启后配置回读；详见 docs/deepseek-harness-compatibility-2026-09-14.md。
