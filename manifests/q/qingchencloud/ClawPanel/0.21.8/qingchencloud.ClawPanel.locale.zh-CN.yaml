ReleaseNotes: |-
  修复 (Fixes)
  - 实时聊天接入 OpenClaw question.requested / question.resolved、question.list 和 question.resolve：支持单选、多选、自由输入、逐题填写及取消，刷新或重连后恢复待答问题。
  - 等待人工回答时暂停输出超时和托管续发；答案提交失败保留草稿，过期及其他客户端已处理的问题同步关闭。旧内核按 RPC 能力降级。
  - 仅当前会话的工具活动延长空闲计时；正常卡死仍有超时检测，避免后台其他 Agent 干扰当前会话。
  - 修复最终回复仍沿用最后一帧 delta 的截断：收到 final 后使用其权威全文渲染和保存。
  - 敏感配置提问提示转到 OpenClaw 原生面板处理，不经普通聊天输入或本地历史保存密钥。
  测试与验证 (Testing)
  - 新增 22 项交互提问与聊天超时回归测试，覆盖三题答案、重连恢复、提交失败重试、跨会话隔离、旧内核降级和 final 全文保存。
  - 官方 OpenClaw 2026.9.4 隔离浏览器验收通过真实提问、答案提交与回读、刷新恢复、过期关闭；实际待答 212 秒未误报输出超时。验收范围与未覆盖平台见 docs/chat-question-compatibility-2026-09-15.md。
