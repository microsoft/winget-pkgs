ReleaseNotes: |-
  修复 (Fixed)
  - 修复 Windows 后台命令反复弹出终端的问题：统一隐藏内核状态探测、命令路径查询及安装、启停等辅助进程窗口，保留标准输出、错误日志和原有超时。
  - Windows Gateway 普通启动不再创建可见终端，启动失败继续通过面板诊断与日志展示；不影响用户显式打开外部应用。
  - 关于页的社群交流新增 Telegram 群按钮和本地二维码，使用同一官方邀请链接；点击二维码或按钮在浏览器打开，保留现有社区入口。
  验证范围 (Testing)
  - 补充后台命令隐藏策略、实际自有子进程控制台可见性及 Telegram 页面回归；后台隐藏不等于完成各内核全部功能的原生界面验收。
  - 本次为界面和后台进程热修复，不合入未完成验收的 Hermes 升级候选，不改变内核推荐版本或日常自动发布门禁。
