ReleaseNotes: |-
  新增 (Features)
  - 新增 Pi 实验引擎：受管安装、固定验证版本更新、卸载保留数据、独立运行配置页与全高聊天工作台，不依赖 OpenClaw Gateway。
  - 统一模型渠道支持同步到 Pi，保留模型名称、上下文及输出上限；支持会话内切换模型、流式回复、停止生成和历史恢复。
  - 接入 Pi 原生 select/confirm/input/editor 交互，写入文件与执行命令逐次审批；默认只读工具，私有配置隔离、日志脱敏。
  修复 (Fixes)
  - 草稿按实例与会话隔离；配置页往返和刷新恢复，发送失败不覆盖后来输入的新草稿。
  - 历史会话保持自己的项目目录与工具权限，新默认配置不关闭其他会话；修复追问覆盖会话标题。
  - 移除 500 条会话索引截断，恢复遗漏 JSONL 的合法历史入口；增加搜索、分批展示、后台审批提醒及指定会话进程关闭入口。
  - 临时连接失败进行有界退避重试并回读状态，禁止自动重放任务；避免旁路会话列表读取失败被误报为发送失败。
  - 工具守卫规范化私有目录真实路径，兼容 macOS 临时目录别名和 Windows junction，防止路径别名导致私有目录识别失效。
  测试与边界 (Testing)
  - 构建间接依赖 source-map-js 锁定至 1.2.2，修复 GHSA-68fv-2mgg-jv7q；未升级 Vite 或其他框架。
  - 三平台 CI 和发布前门禁增加真实 Pi 1.1.0 RPC 验收，仅使用本地模拟 Provider，覆盖流式完整性、模型切换、审批、取消、项目隔离和历史恢复。
  - Pi 继续标记实验版；思考档位、运行中排队/steer、附件、压缩/分支、Skills/MCP 等完整对标能力尚未开放。工作目录不是操作系统沙箱。
