ReleaseNotes: |-
  兼容性 (Compatibility)
  - 经维护者单独批准，适配官方 OpenClaw 2026.10.4，同步新安装推荐、发行 Docker、Linux 安装脚本和文档；保留已安装内核，不自动升级用户运行时。
  - 保留新旧内核的 Gateway 协议 3/4、v3 设备签名和现有认证/配对边界；汉化版固定目标不变。
  - Pi 实验引擎推荐升级至 1.3.0，保留离线 RPC、私有模型凭据、只读工具与审批边界；已安装内核仍由用户显式更新。
  - OpenCode 初始安装目标升级至 1.19.2，兼容新旧原生工作台的路由、偏好、草稿、图标及 Markdown Worker，Web 嵌入继续使用不透明来源沙箱。
  - DSH 预览目标升级至 0.2.1-alpha.4，默认通道仍为 0.2.0-rc.2；私有安装器固定 pnpm 11.28.5，不依赖或修改全局 pnpm。
  修复 (Fixed)
  - 修复 Agent 默认设置与现代所有权配置冲突的问题：新内核仅修改系统任务归属，保留会话存储、渠道与权限；Web 和桌面写入合并后同步清理退役标记，旧版配置保留原协议（#342）。
  - 修正微信插件 2.4.9 的已核实兼容范围和真实 npm 安装的宿主版本识别；未核实的新插件不提示自动降级，不自动同意安装能力，本次修复仅涉及兼容状态（#345）。
  - Hermes Dashboard 显式使用本实例配置端口，不再把其他实例的全局进程状态当作当前服务在线；保留本机监听、不自动打开浏览器和原就绪时限。
  - Hermes 状态检测优先使用 --version 快速入口，仅不支持时回退旧子命令；Web 与桌面保持一致，避免无效 CLI 启动拖慢轮询。
  - 修复 Hermes 官方无 Dashboard 进程的输出被 running 一词误判为在线的问题；成功的状态命令不再重复探测，帮助文案或端口文本不再当作运行证明。
  - 维护 CI 补齐 OpenCode、DSH 默认及预览的独立容器实装门禁，保留 OpenClaw/Hermes 原有验收；每项回读真实非特权隔离事实，不增加凭据或开启自动 AI/PR。
  - 修复 Hermes 聊天输入文字后发送按钮未启用的问题，保留原有发送状态和连接检查。
  - 面板退出登录或认证配置变更后，及时撤销 DSH/OpenCode 内嵌能力及已有连接；无效退出请求不撤销其他会话。
  - Web 后端读取 Gateway 首帧时正确处理关闭帧、Ping/Pong 和 HTTP Upgrade 同包数据，保留关闭状态码与原因；避免启动阶段的关闭帧被当成 JSON 或漏读 challenge，并及时清理读取监听。
  - 修复 OpenCode 原生页面可打开却因生产服务器预检头或上传流重建而发送失败的问题；直接打开能力文档同样保持响应级沙箱隔离。
  - OpenCode 冷启动的草稿事务按读写冲突有界排队，避免原生页面突发请求触发并发上限；父桥事务、数据配额与超时限制保持不变。
  - OpenCode 偏好保存失败时显示可见错误并回退未保存的镜像；刷新时释放旧文档事务，草稿使用独立命名空间和原生原子提交，不读取面板存储。
  - 补齐精简 Linux 镜像中受管 Node 需要的原子操作库；各引擎使用独立运行时，不因损坏的 Hermes PM 记录阻断其他引擎。
  维护设施 (Maintenance)
  - 新增独立的 Hermes 手工资格验收：可信 main 工具校验精确候选 SHA，使用一次性 Windows runner 和非特权 Linux 容器，保留原始安装阶段、两轮长会话及进程/端口清理证据；Web 通过不冒充原生 Tauri 通过。
  - 修复新 Pi 在 Linux 把进程标题改成 pi 后被真实运行验收误判为无子进程的问题；仅在父进程、Node 执行文件、工作目录和私有配置同时吻合时计为受管进程，继续校验实际停止。
  - 本机定时维护按用户委托自主复核技术风险、隔离适配和真实验收；GitHub 控制器 AI/PR/自动发布开关继续关闭，发布仍受同提交 CI、完整门禁与每日上限约束。
