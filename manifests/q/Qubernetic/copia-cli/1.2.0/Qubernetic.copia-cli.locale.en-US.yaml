ReleaseNotes: |-
  Breaking changes
  Three changes can break existing scripts:
  - COPIA_TOKEN goes only to the host that --host or COPIA_HOST names. When the host comes from the config file, the commands ignore COPIA_TOKEN, use the stored token and print a warning. If you set only COPIA_TOKEN next to a config file, set COPIA_HOST as well (#429)
  - In api, -F is now --field and -f is --raw-field, as in gh. --field sends true, false, null and integers as JSON values and reads @file, so --field n=1 now sends a number; use --raw-field for a string. Each flag takes one key=value, and a comma no longer splits the value (#167)
  - The --json field names match the keys the commands print: user instead of author on issue view, pr list and pr view, and stars_count and forks_count instead of stars and forks on repo view (#177)
  Other changes
  - --json, --jq and --template on 13 commands, repo sync, api input and pagination options, and list commands that return more than 50 items
  - Several accounts per host, with tokens stored in the OS keyring
  - Stricter handling of tokens and redirects, and a hardened CI and release pipeline
  - The manual now uses MkDocs Material with the Qubernetic theme: https://qubernetic.github.io/copia-cli/
  Every change is listed in CHANGELOG.md.
