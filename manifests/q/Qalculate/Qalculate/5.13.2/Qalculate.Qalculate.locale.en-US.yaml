ReleaseNotes: |-
  Qalculate! version 5.13.2 is primarily a recompilation of the Windows binaries to (hopefully) fix the issue with (false) flagging of qalculate-qt.exe as malware.
  Changes:
  - Switch from MSYS2 environment from UCRT64 to CLANG64 (and fix issues introduced by this change)
  - Fix default abortion timer (60 s) in qalc on Windows
  - Fix (partly) input of Unicode characters with calculate-as-you-type activated in qalc on Windows
  - Avoid crash with factorial of integer > 50000000 on Windows
  Download Windows binaries here:
  64-bit installer
  64-bit zip (unpack and run without further installation; no application data are read or written outside of the unpacked directory)
  The binaries requires Windows 10 (1809) or later. They can also be installed using the Windows Package Manager (winget) or Chocolatey.
  For more information visit the website at http://qalculate.github.io/.
