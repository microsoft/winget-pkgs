ReleaseNotes: |-
  Updates for Minecraft 26.3 and new zoom options!
  Join our Discord:
  Buy me a coffee:
  Details
  - Added low detail zoom levels:
    - Can be configured in the settings.
    - Improved coordinates rendering (display coordinates on the map edge, or on the map directly, or a mix of both depending on zoom level, all configurable in the menu).
    - Structure icons are only rendered in high detail zoom levels.
  - The Settings dialog is now more responsive.
  - The Render Settings now have a Set default button to make the current render settings persistent. This will apply to any new world that doesn't have custom render settings set yet.
  - The language selection dropdown is now sorted alphabetically.
  - The Render Height slider (in the menu bar) is now more responsive.
  - Both the Compression filter and Compression field now support the unsigned byte value in addition to the internal enum name.
  - Added RemoveLightingInfo field. This removes the BlockLight and SkyLight data, and sets isLightOn to 0 to force Minecraft to recalculate lighting info.
  - ReplaceBlocks now removes BlockLight and SkyLight and sets isLightOn to 0.
  - Updated mappings, rendering and parsing for Minecraft 26.3.
  - Fixed a bug in the mapping generator to use the first available color as the default color, and added javadoc for its main.
