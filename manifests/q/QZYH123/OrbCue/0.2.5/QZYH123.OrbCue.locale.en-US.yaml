PackageIdentifier: QZYH123.OrbCue
PackageVersion: 0.2.5
PackageLocale: en-US
ShortDescription: A desktop orb for Windows that cues you when an AI coding agent needs you
Description: 'OrbCue places a small orb on your Windows desktop: working sessions show only a count, and it cues you the moment an agent waits for your input, authorization, or fails. Clicking the orb opens a list grouped by project, and each entry can jump back to its terminal. It never reads conversations, prompts, commands, or code, stays offline by default, and keeps all state in the current user profile. It supports CLI tools such as Claude Code, Grok Build, Codex, and Cursor Agent.'
