  | ---------- | ------------------------------------------ |
  | libtorrent | 1.2.20+gitc5ff6c3186 / 2.1.3+git87b77c039e |
  | Qt         | 6.11.3                                     |
  | Boost      | 1.86 / 1.92                                |

