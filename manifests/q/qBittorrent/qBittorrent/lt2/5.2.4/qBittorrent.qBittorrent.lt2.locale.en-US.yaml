  - WEBUI: Do not select invisible rows in dynamicTable.js (vafada) #24725
  - WEBUI: Escape add-torrent window title (RealFakeAccount) #24726
  - WEBUI: Use safe property for setting element title (Chocobo1) #24766
  - WEBUI: Only open http(s) URLs from RSS articles and search results (Piccirello) #24790
  - WEBUI: Prevent in-place corruption in DynamicTable.loadColumnsOrder() (UgurGumushan) #24809
  - WEBUI: Fixed ability to manually add peers (Chocobo1) #24733
  - WEBUI: Fixed Preferences page crash with Italian locale (Chocobo1) #24733
  - OTHER: Suppress useless compiler warning (Chocobo1) #24814
