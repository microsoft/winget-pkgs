ShortDescription: Free C++ IDE for beginners and competitive programming, with GCC 16, clangd and GDB bundled.
Description: |-
  Sameko Dev C++ is a free, open-source C++ IDE built on the Monaco editor, made as a modern alternative to Dev-C++.
  The Windows build bundles MinGW-w64 GCC 16, clangd and GDB, so you can write, compile, run and debug C++ right after installing, without setting up a compiler.
  It supports C++98 through C++26, live error checking, test cases with expected output, Competitive Companion, snippets, local history and a Theme Customizer.
  The interface is available in English, Vietnamese and Simplified Chinese.
