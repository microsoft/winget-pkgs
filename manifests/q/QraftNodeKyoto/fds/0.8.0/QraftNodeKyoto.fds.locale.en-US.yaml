ShortDescription: A lightweight, fast TUI file manager focused on keyboard operation.
Description: |-
  FDS is a single-pane, keyboard-first terminal file manager in the spirit of FD, FDclone, FileMente and Miel,
  rebuilt for Unicode, SSH and modern terminals. It copies, moves, deletes (including trash), renames, searches,
  opens files in an external editor, views text/Markdown/hex/images, and browses, creates and extracts ZIP and tar archives.
