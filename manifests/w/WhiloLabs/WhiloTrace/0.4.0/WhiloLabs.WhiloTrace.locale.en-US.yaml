ShortDescription: Network path monitor that shows per-hop packet loss and latency for several hosts at once.
Description: |-
  Whilo Trace watches the network path to several hosts at once and shows per-hop packet loss and latency in real time.
  It tells loss that carries on to the destination apart from routers that only limit the replies they send about themselves, and points at the hop where the loss starts.
  All targets and pinned hops share one timeline, from 5 minutes to 24 hours, with red columns for loss and a jitter strip.
  The route map shows the path on a world map. Router places come from the DB-IP Lite databases (CC BY 4.0) installed with the app, so lookups stay on your computer; a newer month of the databases is downloaded only after you agree. Router locations in these free databases are often wrong, and the map has so far been checked only with made-up places, not on real traces.
  Rounds are kept locally in SQLite, 30 days by default, and a strip of the last day, week or month opens any moment of the past. Any period can be saved as a report for your ISP in HTML, PNG, CSV and JSON.
  Closing the window leaves the app in the notification area, still probing, and it can start with Windows. A notification comes when a target stops answering for a minute or the loss to it reaches a threshold, naming the hop where the loss starts.
  The interface is in English and Russian, with a light, dark or system theme.
  On Windows it uses the system ICMP API and runs without administrator rights. Probes are ICMP over IPv4 only for now.
  Tested by the author on Windows 11. Windows 10 is expected to work but has not been tested yet.
