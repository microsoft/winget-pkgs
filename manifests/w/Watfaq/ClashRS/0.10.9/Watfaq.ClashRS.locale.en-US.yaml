ReleaseNotes: |-
  🚀 Features
  - (rules) Add per-rule outbound interface selection (#1485) by @ibigbug
  - (proxy/smart) Async cache load, retry exclusion, and lock scope reduction (#1511) by @ibigbug
  - (memory) Memory limit controller, DNS cache eviction, and jemalloc tuning (#1512) by @ibigbug
  - (proxy/urltest) Forced fastest selection, name-based lock, and healthcheck concurrency (#1513) by @ibigbug
  - (api) Implement /cache/fakeip/flush and /cache/dns/flush endpoints (#191) (#1556) by @ibigbug
  - (proxy) Support fwmark and interface binding for SSH and Tor (#788, #787) (#1554) by @ibigbug
  - (router) Support port ranges, composite ports, and inbound rules (IN-TYPE, IN-USER) (#1558) by @ibigbug
  - (urltest) Implement passive failure circuit breaker for URLTest (#1559) by @ibigbug
  - (net) Implement Happy Eyeballs v2 (RFC 8305) dual-stack connection racing (#1560) by @ibigbug
  - (tproxy) Support dns hijacking for tproxy inbound (#879) (#1555) by @ibigbug
  - (tun) Add ICMPv4 and ICMPv6 echo responder support (#719) (#1561) by @ibigbug
  - (proxy) Implement XHTTP (SplitHTTP) transport for VLESS and VMess (#1562) by @ibigbug
  - (hysteria2) Complete udp port hopping support (#1563) by @ibigbug
  🐛 Bug Fixes
  - Pass through CORS preflight requests in auth middleware (#1486) by @oseau
  - Remove unused shadowquic git patch and fix release workflow (#1488) by @aaronjheng
  - (inbound) Listener error recovery and panic hardening (#1506) by @ibigbug
  - (transport) Datagram stream framing and partial I/O handling (#1507) by @ibigbug
  - (memory) Closed_flows memory leak and statistics deadlock (#1508) by @ibigbug
  - (dns) Fakeip bidirectional cache invariants and IP offset cycling (#1509) by @ibigbug
  - (misc) Panic hardening, UI fallback, and AnyTLS buffer optimizations (#1525) by @ibigbug
  - (hc) Use group.url for default latency test url in healthcheck (#864) (#1533) by @ibigbug
  - (rules) Make domain rule matching case-insensitive (#621) (#1534) by @ibigbug
  - (config) Preserve error details and log on config parse failure (#711) (#1535) by @ibigbug
  - (api) Allow get_outbound and delay test to find provider proxies (#1394) (#1536) by @ibigbug
  - (config) Make path and health-check optional for proxy providers (#1537) by @ibigbug
  - Use portable_atomic::AtomicU64 for 32-bit platform compatibility (#1539) by @ibigbug
  - (api) Support zero-downtime hot reloading of runtime components (#1553) by @ibigbug
  🚜 Refactor
  - Replace async_recursion with loops across clash-lib and remove dependency (#1550) by @ibigbug
  ⚡ Performance
  - (io) Cooperative stream copy yield to prevent CPU starvation (#1510) by @ibigbug
  - (router) Optimize rule matching using radix trie and aho-corasick (#703) (#1557) by @ibigbug
