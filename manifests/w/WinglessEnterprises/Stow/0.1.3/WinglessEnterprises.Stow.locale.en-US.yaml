ShortDescription: File sync that explains itself.
Description: |-
  Stow keeps two folders the same. Before it changes anything it says what it is about to do in a plain sentence, and it keeps every file it replaces or removes for 30 days, so nothing it does is permanent.
  Syncs can run on a schedule, and the first run of every sync is shown to you before anything moves.
  Stow is paid software with a 14-day free trial. A licence is a one-time purchase that covers 3 computers.
