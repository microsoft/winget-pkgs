ShortDescription: A free music player on your Windows taskbar, with Spotify lyrics and players you design yourself.
Description: |-
  mey music player (MMP) puts the cover of whatever is playing on your Windows taskbar: Spotify, YouTube or SoundCloud in your browser, or any app that uses the Windows media controls.
  Click the cover and a small player slides open with the controls, the time and, for Spotify, the lyrics. Its colours come from the cover, and you can design your own players with colours and PNG, JPG or GIF images.
