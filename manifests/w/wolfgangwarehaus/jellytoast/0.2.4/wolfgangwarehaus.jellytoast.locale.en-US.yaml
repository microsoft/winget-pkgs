ReleaseNotes: |-
  - New phone interface. On Plasma Mobile and Phosh jellytoast now opens a
    rebuilt touch-first app: smoother scrolling, swipe gestures, a Home page, search,
    lyrics, the queue (drag to reorder), playlists you can edit, internet
    radio, downloads, casting, EQ, crossfade and Last.fm / ListenBrainz. Prefer
    the old one? Settings → Use the classic interface and restart.
  - Install it on a Linux phone. New instructions for Nura (formerly
    postmarketOS) and Arch Linux ARM, including a package for Alpine / Nura —
    see Linux phones in the README.
  - The phone interface speaks Spanish too. All ~200 of its new strings are
    translated, so Spanish is complete again.
  - Music keeps playing when you close the phone app. Close it mid-song and
    it carries on in the background; tap the app or the media controls to get
    it back. Close it while paused and it quits as before.
  - Easier sign-in. Just type your server's address — jellytoast works out
    whether it's Jellyfin or Navidrome, adds the missing http:// or port, and
    copes with a link pasted from your server's web page. If something's wrong,
    it says what: can't reach it, not a music server, or wrong password.
  - Album art shows up faster the first time. A server that's slow to make
    thumbnails no longer leaves the grid blank for half a minute, art that
    fails to load is retried (on phones too), and albums without art just show
    the placeholder.
  - No more tray pop-up every launch. On desktops without a system tray you
    get a one-time note instead.
  - Steadier speaker-group casting. Casting to a group of speakers no
    longer stops after a song or two when the connection hiccups — it moves on
    to the next track, retries once if the group is briefly unreachable, and
    sends volume changes without flooding the speakers.
  - Smoother song changes when casting. The next song now waits in the
    speaker's own queue, so speakers move on by themselves — no gap while the
    app hands over each track, and no stop if the app loses touch for a moment.
  - Speakers get their volume back. When you stop casting (or quit, or
    the app crashes mid-cast), each speaker goes back to the level it had
    before — even one that was briefly offline when you stopped — so the TV
    isn't left too loud or too quiet.
  - Phosh support. On Phosh phones jellytoast opens the new phone
    interface too, and notices when you dock.
  - A proper casting card on phones. Tap the cast button for your
    speakers, TVs and groups (they're all listed now, and it scrolls). While
    casting you get a card with the speaker's own volume, each speaker's
    level in a group, and Stop casting. Now Playing shows where it's playing.
  - Listed as phone-friendly. Software centres now show jellytoast as
    working on touch screens and phones.
  - Add songs to playlists. Right-click (or long-press) a song, an album or
    a playlist and pick Add to playlist — any of your Navidrome / Jellyfin
    playlists, or New playlist… to start one. Also in the ⋮ menu on the
    phone's Now Playing.
  - Delete playlists. Right-click a playlist (or long-press it on a phone)
    and pick Delete playlist. If it came from an .m3u file in your music
    folder, jellytoast says so — the server will bring it back at its next scan
    unless you remove the file. Playlists that aren't yours don't offer it.
  - Plain background on phones. The frosted theme's grainy "glass"
    texture (used when real blur isn't available) is gone on a phone — just a
    clean, solid background.
  - Tidier menus on phones. The view menu at the top is solid instead of
    see-through, and the top-bar buttons never get a purple outline on a phone
    (on desktop it only shows while you're using the keyboard).
  - Steady layout on phone Now Playing. The cover, title, seek bar and
    buttons stay put between tracks — a long title or format line no longer
    nudges everything around.
  - Each song shows its own cover art. On albums where songs carry their
    own embedded art (compilations, singles collections), Now Playing, the
    player bar and the lock screen now show each song's picture instead of
    the album's.
  - Albums open instantly. Tapping an album now shows its cover, title and
    artist right away from what the library already loaded, instead of a blank
    "Loading…" while a busy server (say, Navidrome mid-scan) catches up.
  - No stray play buttons on phones. Album covers no longer show their
    hover play button (or the heart / download corners) on a phone — tap an
    album to open it, long-press for its menu.
  - No more "not bit-perfect" pop-up. It used to appear whenever other audio
    played at the same time.
  - Phone screens fit with wider fonts. With some fonts (like DejaVu Sans)
    the player bar and a Settings page ran a little past the edge of a 360 px
    phone. Long titles now scroll instead of pushing the layout wider.
  - Font size changes apply right away, every time. Changing the text size
    in Settings could occasionally redraw at the old size until a restart.
  - Faster start without a keyring. On systems with no keyring service,
    jellytoast no longer waits half a second retrying it.
