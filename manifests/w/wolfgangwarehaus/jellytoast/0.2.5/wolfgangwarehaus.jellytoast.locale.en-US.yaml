ReleaseNotes: |-
  - Install and update through Flatpak. Add jellytoast's own signed Flatpak
    repo once and updates show up in GNOME Software, KDE Discover or
    flatpak update. See wolfgangwarehaus.com/flatpak.
  - Tidier at small sizes. Shrink jellytoast right down and the extra
    top-bar buttons tuck into a ⋮ menu instead of piling on top of each other,
    and Settings fits a narrow window without scrolling sideways.
  - More colour on phones. Now Playing, album and artist pages take their
    colour from the art, covers pulse gently while they load, and you can pick
    your accent colour in Settings.
  - Frosted glass on phones. The top bar, mini player and menus are frosted
    glass now, with your albums blurring underneath as you scroll. Turn it off
    under Settings → Frosted glass if your phone struggles.
  - The phone app fits your screen. Home rows show whole albums, icons
    stay the right size on high-resolution phones (the cast menu was a mess),
    Radio's buttons fit small screens, and landscape puts the art beside the
    controls.
  - New art shows up on phones. Swap an album or artist picture on your
    server and the phone app picks it up instead of keeping the old one.
  - Shuffle follows the page. In a genre, the ⋮ menu's shuffle plays that
    genre ("Shuffle Indie").
  - A more consistent look. Buttons are one size everywhere, every dialog
    puts Cancel first, and checkbox labels match the buttons beside them.
  - Artists without a photo get a proper placeholder instead of a bright
    white star, and the Search page is titled "Search".
  - Spanish page titles. The page name at the top of the window is
    translated now too.
  - Artist pages follow your library picker. With only some libraries
    selected, an artist's page no longer shows albums from the ones you
    switched off.
  - No more doubled lists. After your server's library changed, scrolling
    to the bottom of Artists or Albums could repeat the whole list.
  - Flatpak for ARM. There's now an aarch64 Flatpak too, for Linux phones
    like the OnePlus 6T and ARM laptops.
