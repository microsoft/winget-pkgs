ShortDescription: A simple knob-style front end for Equalizer APO, with a goal-based tuning guide.
Description: |-
  KnobEQ is a simple, knob-style front end for Equalizer APO, the free system-wide equalizer for Windows.
  Turn a knob and Equalizer APO shapes the sound of your whole PC.
  Not sure which knob to turn? Pick a goal such as "Remove muddiness" or "Feel the deep bass rumble",
  and the tuning guide highlights the knobs to turn and how far.
  Features 3-knob and 6-knob modes, a response graph, automatic preamp to prevent clipping,
  and detection of common reasons the EQ has no effect (such as disabled audio enhancements).
  Requires Equalizer APO to be installed for your output device.
