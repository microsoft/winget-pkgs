ShortDescription: Windows 全体の音を変えられる無料ソフト Equalizer APO を、つまみを回すだけで操作できるアプリ。目的から選べるチューニングガイド付き。
Description: |-
  Windows 全体の音を変えられる無料ソフト「Equalizer APO」を、つまみを回すだけで操作できるようにしたアプリです。
  「曇りを取りたい」「重低音の振動を感じたい」のような目的を選ぶと、回すつまみと目安を案内します。
  3 ノブ / 6 ノブの切り替え、補正カーブのグラフ、音割れを防ぐプリアンプの自動調整、
  EQ が効かない状態（オーディオの機能強化がオフなど）の検出に対応しています。
  使う出力デバイスに Equalizer APO がインストールされている必要があります。
