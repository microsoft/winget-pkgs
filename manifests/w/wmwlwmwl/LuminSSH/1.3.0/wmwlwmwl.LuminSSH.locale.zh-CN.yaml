Description: Lumin 是一款面向开发者和运维人员的轻量全平台 SSH 客户端。基于 Go 原生并发与本地 WebSocket 提供低延迟终端体验，内置系统资源探针、远程文件管理器、命令历史与智能补全、连接级代理、可选加密云同步、AI 对话与 MCP 智能体集成，无需在服务器端安装 Agent。
