ShortDescription: A lightweight, cross-platform SSH client for developers and DevOps.
Description: Lumin is a lightweight, cross-platform SSH client for developers and DevOps. Built on Go native concurrency and a local WebSocket for low-latency terminal sessions, it ships with system resource probes, a remote file manager, command history with smart completion, connection-level proxying, optional encrypted cloud sync, AI chat, and MCP agent integration — no agent installation required on the server.
