ReleaseNotes: |-
  更新日志
  （自 v1.3.1 以来）
  - fix(ui): 优化顶栏元素水平对齐、调整会话标签高度与顶部留白比 (#290)
  - fix(window): 修复边缘无法拖动缩放（滚动条/折叠条遮挡）并优化缩放指针一致性 (#289)
  - fix(ping): 限制服务器 ping 并发数，修复 wails dev 下 Callback not registered
  - feat(theme): 主题切换增加 View Transition 圆形过渡动画 (#288)
  - fix(ui): 顶栏搜索按钮与主页按钮换位、上色对齐 AI 按钮，并修复若干无障碍与分组显示问题
  - fix(ai): 修复 AI 变更还原预览无法弹出的问题，并统一审阅导航按钮样式 (#287)
  - fix(tray): 修复 Windows 托盘右键菜单多次点击或切换其它托盘后不再弹出的问题 (#286)
  - fix(terminal): 修复标签切换/面板伸缩视口自适应、滚动条样式与缩放文字错位问题 (#285)
  - chore(deps-dev): bump @types/react-dom in /frontend (#281)
  - chore(deps): bump react-markdown from 9.1.0 to 10.1.0 in /frontend (#279)
  - chore(deps-dev): bump @babel/parser from 7.29.7 to 8.0.4 in /frontend (#280)
  - chore(deps): bump react-virtuoso from 4.18.10 to 4.18.12 in /frontend (#283)
  - chore(deps): bump github.com/wailsapp/wails/v2 from 2.14.0 to 2.15.0 (#277)
  - chore(deps): bump github.com/jlaffaye/ftp from 0.2.2 to 0.2.4 (#276)
  - chore(deps): bump modernc.org/sqlite from 1.56.0 to 1.57.0 (#278)
  - refactor(ui): 全局现代化 UI 规范统一与样式架构重构 (#284)
  - 多项修改 (#275)
  - fix: staticcheck 清理——nil Context 改 TODO、context key 用自有类型、t.Logf 简化，并移除 embeddedModuleFS 只写不读的 embed 死链
  - style: 修正 staticcheck ST1005/S1008/S1017 风格告警（错误串大小写与标点、TrimPrefix/Contains 简化）
  - refactor: 移除三个下划线前缀的停用代码（默认任务设置字面量、按 reviewId 删除回调、主题系统监听解绑）
  - refactor: 删除 staticcheck 查出的死代码（停用去重函数、未用别名/接口/常量/字段、死存储清理）
  - fix: 清理 staticcheck 查出的四处残留代码（死赋值、僵尸参数、冗余 break、测试同侧比较改写）
  - fix(security): 备份图片恢复仅放行 data:image/，更新 URL 校验改精确 host 判断防路径伪造绕过
  - docs: 同步更新中英文 README 至 v1.3.1（AI 审批三档模式、多会话工作区、背景体系、日志关键字高亮等）
