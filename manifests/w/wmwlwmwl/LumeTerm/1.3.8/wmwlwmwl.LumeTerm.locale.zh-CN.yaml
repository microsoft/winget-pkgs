ShortDescription: 轻量、高速、全平台终端客户端
Description: LumeTerm 是一款面向开发者和运维人员的桌面终端客户端。基于 Go 原生并发 + 本机 WebSocket + xterm.js，在 Wails 桌面壳中提供低延迟终端体验。内置系统资源探针、远程文件管理器（内置/外置编辑器）、命令历史与智能补全、连接级代理、可选加密云同步、AI 对话与 MCP 集成等能力，无需在服务器安装 Agent。
