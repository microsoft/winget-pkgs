ReleaseNotes: |-
  更新日志
  （自 v1.3.8 以来）
  - chore(deps): bump golang.org/x/crypto from 0.58.0 to 0.59.0 (#420)
  - chore(deps): bump golang.org/x/text from 0.43.0 to 0.44.0 (#419)
  - fix(filemanager): 重连后不再把工作区路径写成根目录
  - fix(ssh): 主机密钥确认后恢复全部终端，并复用旧 id 保留终端历史
  - fix(ai): AI 对话里的链接不再吞掉中文与全角标点
  - fix(terminal): 链接识别不再吞掉尾部反引号与全角标点
  - fix(sync): 修复编辑 R2 配置保存时报参数解析错误
  - feat(server): 编辑回填密码并支持右键复制连接信息
  - chore(deps): bump golang.org/x/net from 0.61.0 to 0.62.0 (#403)
  - chore(deps): bump modernc.org/sqlite from 1.61.0 to 1.62.0 (#412)
  - feat(proxy): 代理支持 HTTPS 协议 (#411)
  - fix(terminal): 多行粘贴对齐主流终端语义（确认弹窗 + 逐行执行 + 末行保留） (#409)
