PackageIdentifier: wmwlwmwl.LumeTerm
PackageVersion: 1.3.6
PackageLocale: en-US
ShortDescription: Lightweight, high-performance, cross-platform terminal client
Description: LumeTerm is a desktop terminal client for developers and operations teams. Built on native Go concurrency + local WebSocket + xterm.js, it provides a low-latency terminal experience inside a Wails desktop shell. It includes a system resource probe, remote file manager (with built-in/external editors), command history and intelligent completion, per-connection proxies, optional encrypted cloud sync, AI chat, and MCP integration — with no Agent required on the server.
