ShortDescription: A controller-first gaming front-end that unifies game libraries, cloud gaming and emulators on Windows PCs and handhelds.
Description: |-
  Winhanced is a controller-first gaming front-end for Windows PCs and handheld gaming devices such as the ROG Ally or Legion Go. It aggregates titles from Steam, Xbox, Epic Games Store, GOG, PlayStation, Game Pass, xCloud and GeForce NOW, plus emulators and custom apps, into a single navigable library.
  Beyond the launcher it improves sleep and resume behaviour on handhelds, offers per-game performance profiles with TDP controls, and ships a native Xbox Game Bar HUD widget. Winhanced can register itself as the home app for the Windows Full Screen Experience (Xbox mode), so a device boots straight into it.
