ShortDescription: USB driver for Wacom STU signature pads that enables faster image upload.
Description: The Wacom STU Driver configures the USB interface of Wacom STU signature pads. It lets colour STU models use USB bulk transfer for faster image upload with the STU SDK and Wacom Signature SDK for Windows, and on Windows 8 and 8.1 it disables the power save disconnect. Recommended for STU-520, STU-530, STU-540 and STU-541; it can be installed in all configurations without detrimental effect.
