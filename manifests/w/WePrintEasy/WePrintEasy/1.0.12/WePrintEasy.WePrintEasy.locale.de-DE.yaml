ShortDescription: Fester Standarddrucker pro AD-Benutzer und -Gruppe auf dem Terminalserver (RD-Sitzungshost).
Description: |-
  Auf Terminalservern (RD-Sitzungshosts) springt der Standarddrucker der Benutzer gerne um: Windows nimmt den zuletzt benutzten Drucker, die RDP-Umleitung bringt den Drucker des eigenen PCs mit, Programme verstellen ihn nebenbei.
  WePrintEasy legt pro AD-Benutzer oder AD-Gruppe einen festen Standarddrucker fest - mit Prioritäten und verschachtelten Gruppen -, setzt ihn bei jeder Anmeldung und Wiederverbindung und hält ihn auf Wunsch während der ganzen Sitzung fest.
  Mit grafischem Setup-Assistenten, Druckerverwaltung samt Druckerliste vom Druckserver, Systemprüfung, RDS-Farm-Unterstützung mit zentraler Konfiguration und optionaler Skriptsignierung. Keine Abhängigkeiten: nur die mitgelieferte Windows PowerShell 5.1, kein RSAT, keine AD-Schemaerweiterung.
