InstallationNotes: Drucker zuweisen unter Windows-Tools > WePrintEasy Druckerverwaltung. Unbeaufsichtigt nimmt das Setup die Parameter von Install-WePrintEasy.ps1 über --custom "/INSTALLARGS=..." entgegen, siehe README.
