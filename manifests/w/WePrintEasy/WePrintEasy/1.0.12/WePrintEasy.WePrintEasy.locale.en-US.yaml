ShortDescription: A fixed default printer per AD user and group on your terminal server (RD Session Host).
Description: |-
  On terminal servers (RD Session Hosts), users' default printers keep changing: Windows picks the printer that was used last, RDP redirection brings along the default printer of the user's own PC, and applications change it on the side.
  WePrintEasy assigns a fixed default printer per AD user or AD group - with priorities and nested groups - and sets it at every logon and reconnect and, optionally, keeps it in place for the entire session.
  Includes a graphical setup wizard, printer management with a printer list loaded from your print server, a health check, support for RDS farms with a central configuration and optional script signing. No dependencies: only the built-in Windows PowerShell 5.1, no RSAT, no AD schema extension.
