ShortDescription: Lightweight PDF viewer with built-in file operations – move, copy, rename and delete the open document without a detour through File Explorer.
Description: |-
  PDFlight is a lightweight PDF viewer for anyone who works through scans and incoming mail every day. Where other programs force a detour through File Explorer, PDFlight handles it right in the open document: move or copy it to other folders – with a single click if you like. Frequently used locations are kept in a list.
  Other actions include renaming, moving to the Recycle Bin, sending by email or passing the file on to another program. A single keystroke takes you to the next file in the folder.
  Annotations – highlights, drawings, text boxes and stamps – are added right in the view.
  The displayed file is never locked, so other programs can change it at any time. The editing tools – deleting, rotating or extracting pages as a new file, appending PDFs, changing document properties or the password – save immediately. A slip can be undone with Ctrl+Z. PDFlight recognizes PDF/A files and protects them from accidental editing.
