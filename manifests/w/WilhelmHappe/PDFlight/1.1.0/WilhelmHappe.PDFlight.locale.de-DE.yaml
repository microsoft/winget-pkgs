ShortDescription: Schlanker PDF-Betrachter mit Dateiverwaltung – das geöffnete Dokument verschieben, kopieren, umbenennen und löschen, ohne Umweg über den Explorer.
Description: |-
  PDFlight ist ein schlanker PDF-Betrachter für alle, die täglich Scans und Posteingänge abarbeiten. Was bei anderen Programmen zum Umweg über den Explorer zwingt, erledigt PDFlight direkt am geöffneten Dokument: verschieben oder kopieren in andere Ordner – auf Wunsch mit einem einzigen Klick. Häufige Speicherorte werden in einer Liste festgehalten.
  Weitere Aktionen sind Umbenennen, in den Papierkorb verschieben, per E-Mail verschicken oder an ein anderes Programm weiterreichen. Ein Tastendruck blättert zur nächsten Datei im Ordner.
  Anmerkungen – hervorheben, zeichnen, Freitext, Stempel – setzt du direkt in der Anzeige.
  Die angezeigte Datei ist dabei nie gesperrt, andere Programme können sie jederzeit ändern. Die Bearbeitungswerkzeuge – Seiten löschen, drehen oder als neue Datei extrahieren, PDFs anhängen, Dokumenteigenschaften oder Kennwort ändern – speichern sofort. Ein Fehlgriff lässt sich mit Strg+Z zurücknehmen. PDF/A-Dateien erkennt PDFlight und schützt sie vor versehentlicher Bearbeitung.
