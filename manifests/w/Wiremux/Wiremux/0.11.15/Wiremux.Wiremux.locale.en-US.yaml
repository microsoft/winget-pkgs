  wiremux 0.11.15
  Highlights
  A tool id that is blank or only spaces now fails when the request is encoded, on every dialect.
  Bug fixes
  - A blank tool id was still sent. Chat, Messages, Responses, and Gemini encode fail when a tool call id is empty or only spaces. The error is at items[n] and says tool call id is empty. Converse already failed with toolUseId is empty and still does. A call that includes an id is unchanged (#756).
  Upgrading
  Set wiremux and wiremux-auth to 0.11.15. No public struct or enum field was added, so existing literals still compile.
  Calls that used to succeed now fail when a tool id is blank or only spaces. That applies to Chat, Messages, Responses, and Gemini encode. Converse already failed.
