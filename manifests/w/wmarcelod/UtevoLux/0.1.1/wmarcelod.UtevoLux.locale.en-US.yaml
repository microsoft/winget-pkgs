ShortDescription: Overlay and companion for Tibia — mirror parts of your client (cooldowns, items, buffs) in floating windows, plus a world map with spawns and loot.
Description: |-
  Utevo Lux is a lightweight, external overlay for the game Tibia. It mirrors regions of your
  Tibia client into floating, repositionable windows using the DWM Thumbnail API (GPU-composited,
  it does not read the game's memory), so cooldowns, items and buffs stay always in view. It also
  includes overlays (notes, grid, cursor marker and glow), OBS crop tools, countdown timers, and a
  full world map with creature/NPC search, live spawns and per-creature loot. Includes an in-app
  updater that offers new versions on startup.
