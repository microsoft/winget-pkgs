ReleaseNotes: |-
  - 桌面、后端和浏览器插件统一为 0.3.239。独立插件 0.3.236 的按需账号字段与连接测试改进一并交付。
  - 固定免费组件目录 sponsored-runtime-2026-11-16.1：五平台 manifest 兼容窗口为 0.3.239，Mac 两架构重新完成 Developer ID 签名与 Apple 公证；运行时源码仅更新 rustix 1.1.6 修补 RUSTSEC-2026-0486，协议、模型、额度与密钥 epoch 不变。
  - 安装包、容器、运行时与浏览器商店的各渠道回执见 v0.3.239 发布记录。Firefox AMO 的 0.3.239 已公开，Chrome Web Store 已提交并处于 PENDING_REVIEW。首次尝试的 0.3.238 未发布任何资产，空发行页与标签已删除。
  - 免费画像修复合入 main 收尾（2026-11-12）：保留主分支弹窗布局修复，真实请求验收改为手动触发；同步已有插件空态文案测试，合入候选后端 770 项、插件 1907 项测试全通过，更新验证与清理记录。记录。
  - 补齐免费画像未知 MBTI、待聊和来源引导文案的中简/中繁/英文目录，移除废弃英文键并规范排序，恢复覆盖率与一致性检查。
  - 增加免费画像真实端到端验收：生产四阶段初始化、真实公开账号采集和上游模型请求、桌面/手机/CLI 与重启持久化；Linux/macOS 分别覆盖两个免费模型。严格区分已达 40 条样本上限的来源警告与真实阶段失败；使用运行器现有 Chrome，失败时也保留实际用量证据。四组实际运行均通过，主画像区块、觉察与洞察非空，重启可读回；保留首轮失败和最终通过的 JSON、截图与 CLI 证据。真实验收。
  - 免费模型画像完整性修复（2026-11-11）：修复仅保留信息偏好却清空核心/价值层的问题，并兼容当前免费实例 siliconflow_free 返回标识；通过来源校验的信息偏好生成带「待确认」的内容侧初步画像。缺少有效依据时最多重试一次，持续失败不覆盖旧画像。同时修复已有觉察/洞察未进入初始画像快照而显示为空的问题，保留来源与待确认状态。桌面、手机、插件、CLI 与 Markdown 同步说明未知 MBTI。验收记录。
  - PR #348（感谢 @CoderJackZhu）：修复默认多进程启动后开机自启动开关误报 env_managed：按启动快照区分调用方配置和运行时接线；源码自动更新重启仅清理运行时注入的环境变量，保留真实外部配置。补齐跨重启、重启失败及测试快照隔离回归。
  - 自启动真实验收补充：Intel macOS 26.5.1 的 CLI／桌面源码入口、实际 HTTP 开关、生产 execve 重启和 launchd 拉起通过；显式外部 worker 配置仍返回 409。测试登录项和进程已清理，未进行注销登录或安装包重装。验收记录。
  - Windows 安装器目标目录：交互式安装和升级都会显示「选择目标位置」，升级时预选原目录；如需换盘，先卸载旧版再选择新目录，避免多个安装路径共用同一卸载登记。安装器脚本测试覆盖该行为；macOS DMG 引导同步说明可拖入 Applications 或其他可写目录。
  - Windows 安装器目标目录原生验收：GitHub Actions Windows Server 2025 上通过交互升级页可见并预填原目录、换目录被拒、静默安装返回 7、卸载后中文/空格路径重装，以及安装后真实免费模型 SSE 请求和聊天持久化。验收记录。
  - 插件设置页列方向空白段修复：设置页状态行在纵向 flex section 中误用 180px flex 基准，模型 / 通用 tab 出现 180px 空白段；基础样式改为内容高度，仅横向探测行保留撑满宽度。真实后端 + 真实数据 + Chrome 400×700 下七个 tab 复测，模型 panel 2628→2448px、通用 2718→2228px，无水平溢出。验收记录。
  - 插件设置页逐 tab 审计：调度 tab 的自动更新开关 / 间隔从猜测兴趣字段中间移入「版本与更新」；模型卡片在 360px 下「内置 · 只读」徽标不再断行，模型名允许完整显示。400×700 与 360×700 下七个 tab 全部复测无水平溢出，静态回归 64 passed。验收记录。
  - 插件设置页深度交互审计：320px 下默认调用链操作按钮移到第二行，避免 provider / model 被截断；新建实例弹窗改为表单内部滚动 + 固定底部取消 / 保存；展开来源卡、全部 details 和弹窗后在 320/360/400px 复测无溢出或保存栏遮挡，回归 66 passed。验收记录。
  - 硅基流动免费模型真实链路复测（2026-11-12）：完整 MV3 扩展 + 真实后端下，免费 Qwen3.5-4B 直连探测 4.3s、设置页测试整链 8.5s 通过；本地 Ollama 对话模型已停止，仅保留 embedding。验收记录。
  - 惊喜推荐修复合入收尾（2026-11-11）：合入前追加边界、文档及版本一致性回归 38 passed；保留真实模型 429 的验收缺口。版本不变，正式服务本轮不重启。合入记录。
  - 惊喜推荐真实请求验收（2026-11-11）：当前实例副本在真实 HTTP / WebSocket / Chrome 下通过单条冷启动、低分池前 10%、同分限额、消费耗尽及页面自动补位；普通池精确避让惊喜身份。真实 B 站读取成功，主备模型两轮生成均受 429 限制，完整生成与自动联网补货保留未通过项。验收回执。
  - 惊喜推荐修复（2026-11-11）：改为剩余合格池前 10% 的精确身份选择，移除固定 0.75/0.80 与 150 样本门槛；已读、普通推荐历史、避雷和时效先过滤。同分稳定限额，普通推荐/库存共享占位；冷启动仅一条仍可初始化，消费后归还 raw headroom、本地补位并唤醒既有有界补货，旧版已读 fresh 行也不再占住补货空间。正式文案快照提前准备，不新增模型调用；三端通过队列刷新事件收敛，移动端防止迟到首屏空响应清空新卡，输入草稿和读取失败保留状态。边界与验证。
  - 发布分支收尾（2026-11-11）：合回独立插件 0.3.236 的发布保护与历史提审记录。插件发行不再抢占 GitHub Latest；仅与后端版本一致时更新聚合发行页。保留主线 0.3.237 版本、下载入口和既有发行标签。合并与清理记录。
  - 三端对话界面收紧非聊天 chrome：桌面 Web 把「添加网站 / RSS 来源」说明卡收成默认折叠的单行条（回退 v0.3.235 的默认可见形态），页头压成一行，并收紧待聊确认、记录区与输入区间距；插件把发送按钮并入输入行、隐藏重复的可见标签，把品牌头压成约 40px 的单行工具条（隐藏标题/副标题、保留 logo + 连接状态 + 图标），主 tab 收到 38px，并把对话/会话/任务、角色/风格与待聊确认整组收进默认收起的 36px 摘要条，点开才展开原三行控件；同时在对话 tab 隐藏营销标语与 Star 和底部活动页脚（推荐 / 内容库 / 画像仍保留）；推荐空态不再提示「先跑 init」，改为「暂时没有新候选，后台会继续补货」。移动 Web 同步收紧聊天间距。400×700 弹窗中聊天记录可视高度由约 41px 提升到约 373px，桌面 1440×900 下约翻倍。来源说明仍可展开，待聊、任务、角色、发送、历史入口均保留；活动页脚仅在非对话 tab 显示；无新增 API、配置、依赖或安装流程。
  - 猜测卡在 PC 与插件收小：桌面 Web 的 hypothesis 猜测卡宽度上限 760→680px、标题 27→16px、内边距 22/24→14/16、动作按钮 40→32px；插件卡内边距 13→10px、标题 13→12px、动作间距收紧。依据展开/收起、四动作、结算态和共享 renderer 不变。
  - 后台 LLM 预算改为请求级硬上限并跨进程共享（issue #344）：LLMConcurrencyGate 在每次后台请求前扣减额度，超限抛 LLMBudgetExhaustedError（请求不会发出）；计数落在 SQLite background_llm_budget 表，daemon / API / 桌面 worker / CLI 共用一份额度，scheduler.llm_budget_max_calls=0 仍可关闭。认知循环在 awareness / insight 分片之间停下、保留水位并报告 budget_exhausted；强信号早触发去抖为 ≥30 分钟一次、每 12h 最多 4 次。同时把 interests 里 state="archived" 的生命周期墓碑行从两条 prompt 视图里剔除（存储不删），无台账输入仍逐字节不变。
