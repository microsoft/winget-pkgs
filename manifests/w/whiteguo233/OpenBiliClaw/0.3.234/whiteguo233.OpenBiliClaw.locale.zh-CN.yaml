ReleaseNotes: |-
  - Safari 发行切换 macOS15 runner：旧 macOS14 调度被 GitHub 拒绝，保留失败记录后通过 release_tag 从新工作流补发同版本；插件功能与现有版本标签不变。
  - 发布前验收完成：后端 12,485 通过/162 跳过，浏览器 72 通过、插件 1,884 通过；Mac 双架构签名公证整包自检通过，实际 Intel 包两模型流式+向量请求成功。最终安装包、容器与完整性证据汇入 v0.3.234 发行记录。
  - 中继预算覆盖非流式请求最多 3 次上游尝试，请求数与 Token 一并预留；安装摘要补充跨设备加密连接与免费连接失败处理入口。
  - 中继身份、证明、配额与 IPC 专项进入 Ubuntu/Windows/macOS 矩阵，避免只在单平台验证设备密钥并发创建。
  - 固定五平台已验签 SDK2026-11-06.2，兼容 Core0.3.234；Mac 双架构已公证，Windows 为 manifest 验签。知乎/小红书只读补充恢复 13 个字段，累计 221。
  - 交付此前已合入的免费模型初始化、两模型切换、云端/本地向量、过期通知、重试与打包集成，以及跨平台评估元信息修复。
  - 新增可部署 HTTPS 中继：供应商 Key 只由服务端 Rust 持有，设备公钥签名、5 分钟会话、防重放、持久化全局/设备限额、12 路服务端 worker 与设备撤销；现有任务/工具/向量链路复用。生产服务器与域名尚未提供，默认仍是兼容模式，不能宣称共享 Key 已离开所有已发布客户端。
  - 中继在响应头发送前断线也释放容量，并以 CI 验证独立服务镜像/Caddy 配置。
  - 官方中继发行模式提供不携带 Key SDK 的打包门禁；迁移完成后须供应商侧撤销旧 Key，旧二进制不能远程抹除。
  - 本地历史元信息恢复工具默认只读，apply 要求新备份，不猜日期、不覆盖有效字段、不重新评分。本机从存量互补恢复 21 个字段，并通过 104 条 YouTube 真实只读查询补回 187 个空字段；来源缺失与在线读取边界见 验收。
