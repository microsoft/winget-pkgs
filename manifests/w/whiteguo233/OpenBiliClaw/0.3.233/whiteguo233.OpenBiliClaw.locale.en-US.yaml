PackageIdentifier: whiteguo233.OpenBiliClaw
PackageVersion: 0.3.233
PackageLocale: en-US
ShortDescription: Local-first open-source cross-platform AI content discovery agent.
Description: |-
  OpenBiliClaw is a local-first, open-source, self-evolving cross-platform AI content discovery agent: it understands you first, then proactively finds content across Bilibili, Xiaohongshu, Douyin, YouTube, X, Zhihu, Reddit, Weibo and the open web.
  The desktop app lives in the Windows system tray and keeps its data in %USERPROFILE%\OpenBiliClaw, which upgrades and uninstalls leave untouched.
