Description: |-
  OpenBiliClaw 是一个本地私有、开源的自进化跨平台 AI 内容发现 Agent：先理解你，再主动从 B 站、小红书、抖音、YouTube、X、知乎、Reddit、微博等平台与开放 Web 寻找内容。
  桌面应用常驻 Windows 系统托盘，数据保存在 %USERPROFILE%\OpenBiliClaw，升级与卸载都不会改动该目录。
