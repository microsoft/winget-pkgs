ShortDescription: A native Windows port of the dig DNS lookup utility, as a single executable.
Description: |-
  windig is a DiG-compatible DNS lookup tool for Windows written in Go. It ships as one
  self-contained dig.exe and mirrors dig's command line and output: +short, +trace, -x,
  AXFR/IXFR, TSIG, EDNS options (DNSSEC, NSID, cookies, client subnet), batch files and
  .digrc. It also supports DNS over TCP, TLS and HTTPS, and it uses the DNS servers
  configured on your Windows network adapters by default.
