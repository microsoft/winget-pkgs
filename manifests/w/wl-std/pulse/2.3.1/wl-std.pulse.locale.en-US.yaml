ShortDescription: A modern task manager and system monitor for Windows 11, built with WinUI 3.
Description: |-
  Pulse is a task manager and system monitor for Windows 11 with live CPU, memory, GPU, per-disk
  and network graphs, per-process details (network, disk, GPU, efficiency mode), startup app
  management, Windows services, hardware sensors, a desktop widget and live tray graphs.
  Fully local: no telemetry and no accounts.
Moniker: pulse
Tags:
- monitor
- performance
- system-monitor
- task-manager
ReleaseNotes: |-
  - Fixed an issue where system tray icon metric values did not update dynamically
  - Direct NVMe and disk SMART health data (temperature, wear/remaining life, power-on hours, errors) without admin elevation
  - Significant background/tray resource optimization (paused 3D composition and idle page timers)
  - Sidebar navigation More button fix (smooth scroll, solid background)
  - Native Pulse.exe process identity and clean UAC elevation prompts
