ShortDescription: 固定在特定視窗上、隨視窗一起移動的便條與索引標籤。
Description: WindowPin 把便條固定到某一個特定的視窗上。無論你移動視窗、調整大小或最小化，便條都會跟著一起移動，在你親自解除之前絕不會脫落。索引標籤像活頁夾的標籤一樣貼在標題列上，點一下就能把那個視窗帶到最前面。便條只儲存在你自己電腦上的一個檔案裡，不需帳號、不需雲端、不需安裝。Windows 10 / 11 免費使用。
