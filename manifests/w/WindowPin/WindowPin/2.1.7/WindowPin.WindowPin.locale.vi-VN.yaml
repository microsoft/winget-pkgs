Description: 'WindowPin ghim một ghi chú vào đúng một cửa sổ. Di chuyển cửa sổ, đổi kích thước hay thu nhỏ — ghi chú vẫn đi theo và không rời ra cho đến khi bạn tự gỡ. Nhãn chỉ mục nằm trên thanh tiêu đề như những tab trong bìa còng, bấm vào một nhãn sẽ đưa cửa sổ đó ra trước. Ghi chú chỉ nằm trong một tệp trên máy bạn: không tài khoản, không đám mây, không cần cài đặt. Miễn phí cho Windows 10 và 11.'
