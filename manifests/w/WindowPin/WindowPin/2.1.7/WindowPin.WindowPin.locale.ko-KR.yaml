ShortDescription: 특정 창에 고정되어 창과 함께 움직이는 포스트잇과 견출지 라벨.
Description: WindowPin 은 메모를 특정 창 하나에 고정합니다. 창을 옮기든 크기를 바꾸든 최소화하든 메모가 그 창과 함께 움직이고, 직접 해제하기 전까지 떨어지지 않습니다. 견출지 라벨은 제목줄에 바인더 색인 탭처럼 붙고, 클릭하면 그 창이 앞으로 옵니다. 메모는 내 PC 의 파일 하나에만 저장됩니다. 계정도 클라우드도 설치 과정도 없습니다. Windows 10·11 무료.
