Description: 'O WindowPin prende uma nota adesiva a uma janela específica. Mova a janela, redimensione ou minimize: a nota vai junto e não se solta até você desprendê-la. As etiquetas de índice ficam na barra de título como abas de um fichário, e clicar em uma traz aquela janela para a frente. As notas ficam em um único arquivo no seu PC: sem conta, sem nuvem e sem instalador. Gratuito para Windows 10 e 11.'
