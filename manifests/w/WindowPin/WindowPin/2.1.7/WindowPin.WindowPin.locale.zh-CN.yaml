ShortDescription: 固定在特定窗口上、随窗口一起移动的便签和索引标签。
Description: WindowPin 把便签固定到某一个具体的窗口上。无论你移动窗口、调整大小还是最小化，便签都会跟着一起动，在你亲手解除之前绝不会脱落。索引标签像活页夹的标签一样贴在标题栏上，点击即可把那个窗口调到最前面。便签只保存在你自己电脑上的一个文件里，无需账号、无需云端、无需安装。Windows 10 / 11 免费使用。
