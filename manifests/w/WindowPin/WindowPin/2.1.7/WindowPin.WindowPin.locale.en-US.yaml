ShortDescription: Sticky notes and index labels that lock to a specific window and move with it.
Description: 'WindowPin pins a sticky note onto one specific window. Move the window, resize it, or minimise it and the note goes with it — it never comes off until you unlock it. Index labels sit on the title bar like tabs in a binder, and clicking one brings that window to the front. Notes live in a single file on your PC: no account, no cloud, no installer. Free for Windows 10 and 11.'
