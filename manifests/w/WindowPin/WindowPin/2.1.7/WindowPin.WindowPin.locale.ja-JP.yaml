Description: WindowPin は付箋を特定のウィンドウ 1 つに固定します。ウィンドウを動かしても、サイズを変えても、最小化しても 付箋は一緒に動き、自分で解除するまで外れません。インデックスラベルはタイトルバーにバインダーの見出しのように付き、クリックするとそのウィンドウが前面に出ます。メモは自分の PC 上のファイル 1 つにだけ保存され、アカウントもクラウドも インストールも不要です。Windows 10・11 で無料。
