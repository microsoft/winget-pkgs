Description: 'WindowPin закрепляет стикер за одним конкретным окном. Перемещайте окно, меняйте его размер или сворачивайте — заметка движется вместе с ним и не открепится, пока вы сами этого не сделаете. Ярлыки-закладки садятся на заголовок окна как вкладки в папке, а щелчок по ярлыку выводит окно на передний план. Заметки хранятся в одном файле на вашем компьютере: без учётной записи, без облака и без установщика. Бесплатно для Windows 10 и 11.'
