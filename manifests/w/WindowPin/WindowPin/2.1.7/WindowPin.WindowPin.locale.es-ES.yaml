Description: 'WindowPin fija una nota adhesiva a una ventana concreta. Mueve la ventana, cambia su tamaño o minimízala: la nota la acompaña y no se despega hasta que tú la sueltes. Las etiquetas de índice se colocan en la barra de título como las pestañas de una carpeta, y al pulsar una la ventana pasa al frente. Las notas viven en un único archivo de tu PC: sin cuenta, sin nube y sin instalador. Gratis para Windows 10 y 11.'
