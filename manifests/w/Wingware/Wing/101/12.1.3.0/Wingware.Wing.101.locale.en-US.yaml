ReleaseNotes: |-
  Features

  * Show uncaught exceptions from Django templates at the template tag
  * Let AI agents on remote hosts pull with passphrases Wing asks for
  * List Autonomous Peers and other open AI dialogs in the Window menu
  * Show Tasks Manager replies to Tell the Manager on the Questions tab
  * Offer a file an agent asked to show as an Open link on its Review row
  * Send a task's note as a revision if the task finishes while it's typed
  * Warn when Antigravity on Windows is too old to run Wing's hooks
  * Explain why OpenCode can't start on Windows ARM64 and how to fix it

  Bug Fixes

  * Fix stopping at breakpoints in Django templates with Python 3.12+
  * Fix breakpoints and stepping at Django block tags and app custom tags
  * Fix Step Over in Django templates on Python 3.11 and earlier
  * Fix Step Into in Django templates stopping in library code Django calls
  * Don't stop at exceptions Django handles in templates on Python 3.12+
  * Fix files a Tasks worker asks to show never opening in the editor
  * Avoid problems running agents outside Wing in directories set up by Wing
  * Fix a different wingdebugpw file blocking MCP servers' access to Wing
  * Fix stale task file copies losing a waiting task's report and questions
  * Fix Mark Complete on the Review tab being slow or leaving tasks listed
  * Fix Plan goal headers not updating while you edit a task there
  * Fix the Execute tab's ! showing with nothing waiting for an answer
  * Fix Tasks tool links acting on mouse press rather than release
  * Don't ask Claude Code for a task report in turns you typed yourself
  * Fix Tasks Manager thinking a queue started when its agent isn't set up
  * Fix picking a set-up agent for a queue asking to set up another agent
  * Fix Cancel in Set Up for AI Agent still switching the project's agent
  * Fix remote Claude Code setup going on after rejecting the directory
  * Fix notes written for a task sent to a peer not coming back as a file
  * Fix a peer task staying Unreachable after its peer comes back
  * Fix npm-installed agents on Windows failing from paths with & ^ or %
  * Fix Copilot on Windows refusing every tool with "hook errored"
  * Fix Cursor on Windows sending Wing no prompt or session data from its hooks
  * Fix Antigravity asking to sign in when given a Gemini API key
  * Fix Antigravity on Windows getting no Wing tools in some project paths
  * Fix OpenCode's first /init sometimes staying unsent and blocking prompts
  * Fix OpenCode's update and other dialogs stalling tasks Wing sends it
