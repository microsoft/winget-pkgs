ReleaseNotes: |-
  * Add ARM64 Windows version
  * Improve performance when working with large projects
  * Improve performance on Windows
  * Optimize Find Symbol in Project for large projects
  * Reduce the size of the analysis cache database by about 20%
  * Fix Wing's MCP servers possibly crashing when they exit
  * Fix debugger for 32 bit Python on Windows
  * Treat a remote host at localhost or 127.0.0.1 as local when configuring SSH tunnels
  * Don't tunnel the debug listener when Manage SSH Tunnels is disabled
  * Fix listening on the configured Remote Debug Port, seen with WSL mirrored networking
  * Give each remote debug process, Python Shell, and listener its own debug port
  * Wait for a remote debug port to be released before reestablishing its SSH tunnel
  * Install the remote agent atomically so an interrupted install isn't left broken
  * Detect and replace incomplete or corrupted remote agent installations
  * Don't repeatedly re-request the SSH password after a remote agent install failure
  * Reuse the entered SSH passphrase across remote agent install steps with PuTTY
  * Fix window order and sizing of the SSH passphrase prompt dialog
  * Strip terminal escape codes from SSH prompts and the remote agent install log
  * Fix remote agent install when its binaries for the target OS are missing
  * Discover and run individual Django test files, instead of running manage.py
  * Fix running Django tests when the app is installed outside the project
  * Add Clear Stored Passwords to the VCS tool's Options menu
  * Fix Cancel in the Tasks tool so it withdraws a queued commit or review
  * Retry Cancel in the Tasks tool and warn if Claude can't be confirmed stopped
  * Improve naming and management of many Tasks tool queues
  * Fix hanging at startup on Windows when a version control diff contains non-ANSI characters
  * Fix showing status in the VCS tool when there are multiple repositories
  * Show the reason a test was skipped in the Testing tool
  * Resize text entries with the Edit Value dialog on preferences and properties forms
  * Add Detach from Process to the debug status menu
  * Fix window order when closing sub-dialogs raised from other dialogs
  * Fix failure to lock a project when two instances of Wing start at once
  * Don't report files differing only in line endings as changed when comparing directories
  * Don't list a file twice when comparing case insensitive directories
  * Show the total number of diffs with the current position in Diff/Merge
  * Fix OS detection during remote agent install with built-in SSH and a password
  * Don't answer an SSH password prompt twice when the SSH client echoes it
  * Accept an unrecognized host key when installing the remote agent with OpenSSH
  * Limit the size of error logs submitted with bug reports and allow longer uploads
  * Show the server's response when a bug report or feedback is not accepted
  * Replace changed SSH host keys when using the built-in SSH implementation
  * Don't corrupt quotes in remote command lines sent with built-in SSH
  * Never write a stored SSH password to ide.log or submitted bug reports
  * Log only the environment variables that affect SSH during remote agent install
  * Stop using wmic on Windows, since it is no longer included with Windows 11
    (this may require reactivation of licenses in some cases)
  * Never add the system drive or filesystem root to the Python Path, to avoid hanging
  * Default to the home directory rather than the drive root on Windows
  * Explain that Claude Code must be installed separately, with a link to its installer
  * Don't set up a project for Claude Code when Claude Code is not installed
  * Show progress in the status area while scanning for project files
