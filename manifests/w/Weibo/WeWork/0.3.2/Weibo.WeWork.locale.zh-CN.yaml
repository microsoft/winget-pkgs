Description: WeWork 是 Wegent 的桌面工作台。Wegent 是一套跨越本地桌面、云端智能体与远程工作机的开源 AI 工作系统：桌面端按项目和任务整理本地编程工作，把对话、工具活动、测试、变更文件和差异集中在一个视图中；项目空间共享任务看板、文件、自动化与执行状态。可复用的智能体组合模型、提示词、技能、知识与工具，任务可通过 Codex 在本地运行，也可以在远程工作机或服务端管理的执行器上运行，并支持自托管 Wegent Web 与后端供团队使用。
