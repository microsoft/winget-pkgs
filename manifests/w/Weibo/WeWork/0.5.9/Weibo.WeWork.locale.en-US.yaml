ShortDescription: The Wegent desktop workbench for organizing local AI coding work by project and task
Description: WeWork is the desktop workbench of Wegent, an open-source AI work system spanning the local desktop, cloud agents, and remote machines. It organizes local coding work by project and task, keeping the conversation, tool activity, tests, changed files, and diffs together, while project spaces share task boards, files, automation, and execution status. Reusable agents combine models, prompts, skills, knowledge, and tools; tasks run locally through Codex, on remote work machines, or with server-managed executors, and Wegent Web and Backend can be self-hosted for team access.
