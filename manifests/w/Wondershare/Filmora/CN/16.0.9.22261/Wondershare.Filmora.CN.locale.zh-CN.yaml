ReleaseNotes: |-
  致创作者

  谢谢您，把珍贵的回忆和灵感交给我们。更感谢您从未沉默——每一条闪退反馈、每一次真诚建议，还有特意抽出的访谈时间，都成了产品时间线上最关键的那一帧，让我们始终有动力向前。

  正因如此，这次更新我们把您的声音刻进了每一帧画面。

  本次更新，为您而来：
  1. AI 素材解析：自动识别素材关键信息，生成结构化分析结果和剪辑时间戳，助力快速选材与粗剪。

  2. 素材管理增强：支持文件夹、丢失文件找回、元数据、标签备注及智能媒体夹，提升素材整理与检索效率。

  3. 扫码上传：新增扫码上传能力，手机素材可快速传至桌面端工程，跨设备导入更高效。

  4. 批量导出：新增批量导出能力，支持一次选择多个导出预设，快速输出多种规格视频。

  5.  360 全景视频编辑：新增 360 全景视频编辑能力，支持调整视角与运镜预设，轻松制作沉浸式创意画面。

  6. 颜色蒙版：通过蒙版精准控制画面局部区域，独立调整明暗与色彩，实现更细致的局部调色。

  7. 智能调色：基于智能算法自动优化画面色彩，一键调整整体色调，让视频画面更具质感。

  8. 全新快捷键管理：支持可视化查看键位占用、高效搜索与定位命令，并可自定义和迁移快捷键方案，让剪辑操作更高效、更顺手。

  9. 镜头追踪：支持自动跟随人物或自定义目标，轻松实现主体聚焦与动态跟随效果。

  10. 智能纠错：新增智能文本纠错，让字幕校对更快更省心。

  11. 透视文本：支持快速创建更具纵深感的标题效果。

  12. 动感字幕升级：新增标签分类、单字符/长句筛选项，以及收藏和预设保存功能，并支持在语音转文字阶段直接生成动感字幕。

  13. 视频动画升级：新增组合动画，补齐片段中间段动画能力，支持组合使用，并增加动画资源搜索功能。

  14. 多路源录制：屏幕录制现已支持多路源录制，可同时录制多个屏幕、摄像头和麦克风，轻松满足多视角创作与演示需求。

  15. 游戏录制：新增游戏录制模式，可获取游戏真实帧率，精准呈现运行表现，并支持游戏画面、声音与解说同步录制。

  16. 属性面板支持自定义：支持自定义属性面板，可移除低频功能，保留常用设置，让操作界面更简洁，编辑体验更顺畅。

  17. 轨道遮罩：支持使用其他轨道控制当前轨道素材显示区域，带来更灵活的多轨合成与创意效果。

  18. 开放时间线格式 XML 导入与导出：支持与其他专业剪辑软件进行 XML 时间线工程交换，提升跨软件协作效率。

  19. 关键帧支持运动模糊：为位移、缩放、旋转添加关键帧后，可开启运动模糊效果，让素材在运动过程中更加自然流畅，减少快速变化时的生硬感。

  20. 产品体验升级：优化时间线工具栏，增加专业创作布局，焕新产品界面，让专业创作更高效、更沉浸、更可控。

  注意：升级后的工程可能无法兼容旧版本，如需回退版本，请使用备份工程。

  愿一直与您并肩，裁出好故事。
