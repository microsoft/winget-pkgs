ReleaseNotes: |-
  1. Enhanced Media Metadata Editing
  Search, edit, and batch-apply metadata and artwork with a clearer saving workflow. More audio and video formats are now supported, along with expanded fields for music, audiobooks, movies, TV shows, and music videos.

  2. Metadata Preservation
  Compatible metadata can now be retained when converting or compressing supported media files, reducing the need to reorganize file information afterward.

  3. Video & Audio Cutter: Split by Chapters
  Automatically split supported media files using embedded chapter markers. Review and adjust the generated segments before exporting.

  4. New Image Generation Models
  Generate images faster with Nano Banana 2 Lite, or create professional-quality visuals with Seedream 5.0 Pro.

  5. Keep Source Timecodes
  Choose whether to preserve source timecodes during conversion and compression. This option is turned off by default.
