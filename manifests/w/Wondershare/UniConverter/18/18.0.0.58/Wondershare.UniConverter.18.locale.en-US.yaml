ReleaseNotes: |-
  Experience the upgraded All-in-One AI Media Toolkit — faster, smarter, and cleaner.
  1. Video Downloader: Save More, Organize Less
  - Download private YouTube videos you have access to, plus Watch Later and Liked videos.
  - Save videos or audio by YouTube chapter while keeping the full download.
  - Download multiple subtitle tracks, including auto-generated subtitles.
  - Save supported M3U8 streams for offline viewing.
  - Download in one click with your saved Smart Mode settings.
  2. Video Converter: Faster and More Automated
  - Preserve AC3, E-AC3, TrueHD, DTS, DTS-HD, and FLAC with audio passthrough in compatible formats. No re-encoding needed!
  - Automatically convert new files with Watch Folder.
  - Convert up to 90% faster with NVIDIA GPUs.
  - Enjoy faster GPU-accelerated 4K HDR conversion.
  - Control CPU usage to keep your PC responsive.
  3. Video Compressor: Smaller Files, Sharper Details
  - Compress by size ratio, maximum file size, or quality level.
  - Preserve key details with AI Detail Protection.
  - Keep subtitles and multiple audio tracks in supported formats.
  4. Video Enhancer: Clearer, More Stable Results
  - Improved AI Face Enhancement reduces flicker and stabilizes facial details.
  5. Video Eraser: More Precise, Longer Videos
  - Remove burned-in subtitles only where they appear.
  - Ultra removal supports 1080p videos up to 2 hours long.
  - Improved tracking delivers more consistent moving-object removal.
  6. UniConverter Agent (Beta): Describe It. Convert It.
  - Describe your conversion goals in plain language and let the Agent handle batch videos (Windows 10 and later).
  7. Video Blur: Automatic Privacy Protection
  - Track and blur people or objects automatically, without manual keyframes (Windows 8 and later).
  - Object Tracking Blur now supports bidirectional tracking, covering frames both before and after your selection.
  8. Image Enhancer: Smarter One-Click Fixes
  - Apply tailored enhancements with AI Auto Fix.
  - Straighten photographed old prints with Photo Straightener.
  9. Image Watermark Remover: Easier Selection
  - Select entire objects with just a few strokes using AI Brush.
  10. Fresh Design, Smoother Experience
  - Find tools faster with a redesigned homepage and scenario-based AI Hub.
  - Enjoy usability improvements and bug fixes throughout.
