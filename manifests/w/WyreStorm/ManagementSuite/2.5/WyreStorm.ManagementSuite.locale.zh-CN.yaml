PackageIdentifier: WyreStorm.ManagementSuite
PackageVersion: "2.5"
PackageLocale: zh-CN
License: 专有软件
ShortDescription: 将 WyreStorm 产品的 Windows 软件工具整合到单一启动器中
Description: |-
  WyreStorm Management Suite 将 WyreStorm 产品的软件工具整合到一个启动器中，涵盖 NetworkHD 100、200、400、500 和 600 系列 AV over IP 产品、CAM-200-PTZ 会议摄像机、SP-0108-SCL 切换器和 CON-H2 转换器。无需分别管理多款工具软件，集成商只需维护一个应用程序，就能确保所有 WyreStorm 配置软件都保持最新版本。
  - NetworkHD 系列控制台（NetworkHD Series Console） — NetworkHD AV over IP 系统的配置软件。自动发现 NetworkHD 端点，可同时向多台设备快速应用设置；配置 NetworkHD Touch 的分区、显示与信号源名称，并为 NetworkHD Touch 及其他控制系统配置视频墙和场景。
  - 云台摄像机控制（PTZ Camera Control） — 易于使用的 CAM-200-PTZ 设置、控制与配置软件。最多可保存 255 个自定义 PTZ 预置位供控制面板调用，可按偏好调整平移与俯仰速度，并可发送自定义 API 命令进行测试和故障排查。
  - CON-H2 配置工具（CON-H2 Configuration Tool） — 适用于 CON-H2-EDID 与 CON-H2-SCL 的配置工具。配置、读取和写入 EDID 文件；测试和配置 CEC、RS-232 与继电器（Relay）命令；为视频缩放器和其他控制系统设置输出分辨率。
  - SP-0108-SCL 配置软件（SP-0108-SCL Configuration Software） — 适用于 SP-0108-SCL 的配置软件。配置并测试 API 设置/读取功能，导入 EDID 文件，升级软件等，帮助您快速上手或排查问题。
  - 维护工具（Maintenance Tool） — 针对 NetworkHD 组件和支持演示切换器的 ScreenLink 的批量固件升级工具。
