ShortDescription: 将完整应用打包为单个可移植的 .capsule 文件，随时分享与运行。
Description: Capsule 将整个应用（界面、数据、媒体和资源）打包为一个可移植的 .capsule 文件，可在接收者的设备上离线运行。它支持用 AI 生成和更新应用：一句简单的提示即可生成完整的自包含桌面应用，包含 HTML 界面、数据模式和本地 SQLite 数据库，无需云服务器或账号。Capsule 可与 ChatGPT、Claude、Gemini 以及 MCP 编码工具配合使用，并能像普通文档一样分享。
