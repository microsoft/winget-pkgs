ShortDescription: Package, share, and run complete apps as single portable .capsule files.
Description: "Capsule packs an entire app - UI, data, media, and assets - into a single portable .capsule file that runs offline on the recipient's device. It can generate and update apps with AI: a simple prompt becomes a complete, self-contained desktop application with an HTML UI, a schema, and a local SQLite database, with no cloud servers or accounts. Capsules work with ChatGPT, Claude, Gemini, and MCP coding tools, and can be shared like regular documents."
