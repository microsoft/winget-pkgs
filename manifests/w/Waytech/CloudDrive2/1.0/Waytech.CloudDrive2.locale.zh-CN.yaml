ReleaseNotes: |-
  1. 备份新增"路径前缀"和"路径正则"两种过滤规则(#608)。 原有的扩展名、文件名和正则规则只匹配单个文件或文件夹的名称，无法只排除某一个位置的文件夹（例如只排除 Users/x/AppData/Local/Temp，而不排除其他名为 Temp 的文件夹）。新规则按从源文件夹开始的路径匹配：路径前缀每行一个，匹配该路径及其下的所有内容；路径正则匹配相对路径，文件夹路径以"/"结尾。规则编辑器中新增"测试规则"，输入一个路径即可查看它是否会被备份，以及是哪条规则把它排除的。每条规则下方会说明它的匹配方式
  2. 网页版可以阅读电子书。 EPUB、MOBI、AZW3 和 CBZ 文件点击即可打开，支持目录、字号、行距、页边距、主题、连续滚动和双页显示。阅读位置保存在当前浏览器中，文件列表和最近文件中显示已读百分比。有版权保护（DRM）的书和 Kindle KFX 格式的书无法阅读
  3. 文件变化通知新增"修改"类型。 通过挂载或 WebDAV 修改已有文件时，Webhook 发送 "modify" 动作（以前只有创建、删除和重命名）；Windows 资源管理器会收到文件已修改的通知。本地文件夹、SMB、SFTP 和加密文件夹以前通过挂载或 WebDAV 写入时没有任何变化通知，现在也会发送
  4. 网页版云盘管理页面移除云盘时，可以选择"永久移除"，与在文件页面根目录中移除云盘相同。不勾选时，云盘在服务重启后会重新出现；勾选后删除该云盘的配置。两种方式都不会删除云盘中的文件
  5. 修复上传到 WebDAV 存储时，文件名可能被改错的问题(#595)。 上传现在直接写入最终文件名，不再先写入 .clfstmp 临时文件再改名。以前通过 OpenList 挂载 115 网盘时，上传的 movie.nfo 会变成 movie.clfstmp
  6. 修复添加的远程 CloudDrive 无法连接时，打开根目录要等待很长时间的问题(#596)。 现在最多等待 3 秒，之后在后台继续连接，连接成功后自动更新
  7. 修复百度网盘上传被拒绝时只显示"PermissionDenied: unknown error message"的问题(#614)。 错误信息现在包含 HTTP 状态码和百度网盘返回的错误码；遇到限流或服务器错误时会自动重试。传输失败后的重试间隔改为逐渐延长（5 秒、15 秒、45 秒、2 分钟），不再每 5 秒以全部并发数重试
  8. 修复 115 网盘中刚上传完成的文件有时从文件列表中消失，并被报告为已删除的问题
  9. 新安装时，默认设备名称改为设备本身的名称（例如手机名称、Mac 的电脑名称），不再使用主机名（以前在安卓上是 localhost，在 Mac 上以 .local 结尾，在 Docker 中是容器 ID）。已保存的设备名称不会改变；如果当前名称是 localhost 或以 .local 结尾，修改设备名称时会建议使用系统中的名称，点击保存后才会生效
  10. 网页版：修复重启服务时显示"JS API error: TypeError: Failed to fetch"的问题
  11. 网页版：修复上一个文件夹还在加载时打开另一个文件夹，可能显示上一个文件夹中的文件的问题；正在加载的文件夹列表也不会再替换搜索结果
  12. 网页版：修复刷新页面后，磁盘缓存的淘汰策略总是显示为 LRU 的问题(#617)。 实际保存的设置一直有效，只是显示不正确
  13. 网页版：DTS 音乐文件（包含 DTS 音频的 WAV 文件）不再作为噪音播放，改为显示提示
  说明：
  已知问题（1.1.0 中已存在，尚未修复）：单向备份中同时打开"从目标同步删除"、并把删除规则设为"移到历史文件夹"时，目标文件夹中的 .clfs_history 文件夹本身会被当成多余内容再次移入历史文件夹，每扫描一次多嵌套一层。修复之前请不要同时使用这两个选项。
