ReleaseNotes: |-
  1. 新增媒体服务器功能。 在运行 CloudDrive2 核心服务的电脑、NAS 或其他设备上开启媒体服务器，可将本地文件夹及已连接网盘中的电影、剧集、音乐和图书统一整理为媒体库，由服务器完成扫描、识别和资料管理，其他设备连接后直接使用，不必分别扫描同一批文件。支持在网页中创建、编辑和扫描媒体库（保存新增文件夹后自动开始扫描），设置扫描计划、扫描速度和识别选项；优先读取文件夹中已有的 NFO（含各季 season.nfo 及季海报，文件改动后即使文件夹修改时间未变也会重新读取）和本地图片，默认支持在线查找影片、剧集、音乐和图书资料，支持 AI 辅助识别（可设置每日调用次数上限），也支持导入 Emby / Jellyfin 媒体库。蓝光 ISO 与 BDMV 文件夹会识别正片音轨信息（含 DTS:X、杜比全景声和位深），SACD 专辑区分立体声与多声道并支持按 SACD 格式筛选，视频缩略图自动跳过片头暗画面。CloudDrive2 App 1.2.0 及以上版本可发现并配对媒体服务器，支持观看用户、配对设备、远程地址、播放转发及私密媒体库与家长控制，也可开启兼容 Emby / Jellyfin 的接口供第三方播放器使用
  2. 新增网页版影视界面与多端同步。 开启媒体服务器后，可在网页中浏览媒体库，提供首页推荐、继续观看、下一集、继续收听（支持移除专辑）、继续阅读、搜索、收藏和人物页面。收藏与搜索页面支持按分辨率、HDR、音频、视频编码、字幕等条件筛选，收藏页支持展开查看全部类型、制作公司与标签；图书详情页支持点击主题标签跨库筛选。支持在网页中识别和编辑影片、专辑及人物资料，按季或单集设置跳过片头片尾，支持影片已看 / 未看与图书已读 / 未读标记；播放进度、所选音轨与字幕轨以及阅读位置会与服务器及各端同步
  3. 新增服务器后台 AI 字幕任务。 支持在服务器端为影片、单集、整季或多段影片后台识别对白并翻译字幕，生成的字幕保存在视频旁供所有设备复用。支持本地 Whisper 或外部语音识别 / 翻译 API，远程接口返回 HTTP 429 频率限制时自动等待并重试；可在任务页面查看状态与耗时、调整顺序、暂停和继续任务。同时优化了 Linux ARM32 与 Android ARM32 设备上的本地 Whisper 语音识别性能（Linux ARM32 在 Docker 中运行同样生效，无需增加容器启动参数）
  4. 新增网页播放器。 采用浏览器原生播放与网页端解码结合的方案，无需安装浏览器插件，也不依赖服务器实时转码。在文件管理中直接点开视频、音乐、光盘镜像或 CUE 整轨即可播放，不必先开启媒体服务器；媒体库也使用同一播放器。视频支持 MKV、MP4、AVI、TS、M2TS、FLV、MPG 等容器，H.264、HEVC / H.265、AV1、VP9、MPEG-2、MPEG-4 等编码，以及 AAC、AC-3、E-AC-3、DTS、TrueHD、FLAC、LPCM、Opus 等音轨；蓝光 ISO 和 BDMV 文件夹可直接播放正片并支持定位、章节、音轨和字幕切换。支持 HDR 与杜比视界影片：兼容的 Safari 及显示设备可使用原生杜比视界；支持 WebGPU 的 Chrome / Edge 可对杜比视界影片进行动态画面映射，在 HDR 显示器上输出 HDR、在 SDR 显示器上转换为颜色正确的 SDR，并在切换显示器时自动更新。字幕支持外挂与内嵌文字字幕（支持 SRT 样式与对齐）、外挂与内嵌 ASS / SSA 特效字幕（支持加载 MKV 内嵌字体）以及大体积 PGS / SUP 图形字幕流式解码。提供手机和平板布局、键盘快捷键、触控操作和总时长 / 剩余时间切换
  5. 网页版新增完整音乐播放器并扩展电子书与图片格式支持。 音乐支持 MP3、AAC、FLAC、ALAC、APE、WAV、DSF / DFF、SACD ISO（立体声区）、CUE 整轨及 DTS 音乐，提供完整播放页与迷你播放器，显示封面、同步歌词、格式信息、播放队列及专辑资料，支持桌面端网页解码格式无缝连续播放、随机 / 循环、睡眠定时与系统媒体控制，切换其他页面时音乐继续播放；兼容的 Safari / Edge 支持杜比全景声音乐播放。电子书阅读新增支持 CBR 格式（现支持 EPUB、MOBI、AZW3、CBZ、CBR），图片查看器与漫画阅读新增支持静态和动态 JPEG XL(#650)
  6. 新增按云存储账号限制请求频率（QPS）及请求统计。 每个云存储账号可单独设置每秒最大请求数，减少扫描或批量操作触发网盘限流的情况；网页版"任务"中新增请求频率统计，查看各存储账号及总体的每秒请求数。任务页面取消任务时增加二次确认
  7. SFTP 存储新增"允许旧算法"选项。 添加 SFTP 存储时默认关闭，按需开启后可连接 OpenSSH 5.x 等旧版服务器
  8. Windows 核心服务安装程序内置的 WinFsp 升级至 2026 正式版（2.2.26323）。 替换此前内置的 2.2.26112 Beta1
  9. 修复 SMB 服务器重启后缓存会话与文件句柄失效，所有后续操作和手动重试均失败、必须重启 CloudDrive 才能恢复的问题(#722)。 检测到连接失效后会自动清理旧句柄并重新建立连接
  10. 修复大量扫描 123 云盘目录时内存与本地目录缓存数据库持续增长的问题(#687)，并清理云端已删除文件及文件夹的本地目录缓存记录。 缩略图与预览链接不再写入本地目录缓存数据库
  11. 修复频繁浏览或备份加密文件夹时内存持续增长的问题(#661)
  12. 修复天翼云盘达到当日上传限额后，重试会反复读取整个源文件并将限额错误误报为"源文件已删除"的问题(#666)。 同时保留天翼云盘原始错误说明，并在网页端改善长错误信息的显示与复制
  13. 修复 CloudDrive 向另一台 CloudDrive 传输文件、接收端保存到本地文件夹时，发送端进度一直显示 0 直到传输完成的问题(#670)
  14. 修复通过 CloudDrive WebDAV 服务用较短文件覆盖较长文件时，文件末尾仍保留旧内容的问题
  15. 修复 115 开放平台提示访问上限（770004）后仍持续重试请求的问题。 触发上限时会暂停该账号请求一段时间，待恢复后再继续
  16. 优化短时连续读取的下载任务显示及大目录打开音频的速度。 连续短时读取文件时，下载任务列表、数量和速度统计现在会反映正在进行的读取；在包含大量歌曲的文件夹中打开单首歌曲时，不再逐个预先获取全部歌曲链接
  17. 安全性更新
  说明：
  1. 会员说明：媒体服务器及网页版影视界面需要服务器账号同时拥有 App Pro 和包含媒体服务器功能的核心会员（核心月度、年度及完整版核心终身会员支持，轻享终身会员不包含）。文件管理中的普通网页播放不需要会员；HDR、杜比视界、蓝光 ISO、DSD 和 SACD 等高级播放需要 App Pro，未开通时可限时试播，使用文件管理播放器不要求开启媒体服务器。
  2. 网页播放器说明：建议使用内置 HTTPS 或本机 localhost 访问，以启用硬件解码与 WebGPU 等浏览器能力；局域网 HTTP 访问的浏览器安全源配置见 https://www.clouddrive2.com/web-player.html#chrome-secure-origin 。网页播放器音频以立体声输出，不提供功放源码直通、原生 DSD / DoP、独占输出或光盘菜单，需要这些功能请使用对应平台的 CloudDrive2 App。功能说明：https://www.clouddrive2.com/media-server.html 、https://www.clouddrive2.com/web-player.html 、https://www.clouddrive2.com/ai-translation.html 。
  3. ARM32 设备本地 Whisper 提示：低端电视盒子及部分较老的 ARM32 设备，即使使用 Base 模型，本地 Whisper 仍可能较慢且识别准确率较低，建议优先配置外部语音识别 API，并利用服务器后台任务提前生成字幕。
  4. 已知问题（1.1.0 中已存在，尚未修复）：单向备份中同时打开"从目标同步删除"、并把删除规则设为"移到历史文件夹"时，目标文件夹中的 .clfs_history 文件夹本身会被当成多余内容再次移入历史文件夹，每扫描一次多嵌套一层。修复之前请不要同时使用这两个选项。
