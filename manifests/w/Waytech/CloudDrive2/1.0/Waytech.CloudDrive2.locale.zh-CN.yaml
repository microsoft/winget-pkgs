ReleaseNotes: |-
  1. 新增静态与动态 AVIF 图片支持及媒体库封面提取(#747)。 网页版图片查看器与 CBZ / CBR 漫画阅读新增支持静态和动态 AVIF（.avif / .avis）图片（当浏览器不原生支持时自动使用内置解码），媒体库支持从图书和本地封面图中提取 JPEG XL 与 AVIF 封面
  2. 媒体服务器支持通过反向代理外网访问。 支持经由反向代理以标准 HTTPS / HTTP 端口（443 / 80）对外提供媒体服务器与网页访问，网页版「在外使用」设置提供反向代理配置说明与帮助链接（见 https://www.clouddrive2.com/media-server.html#away ）
  3. 网页版支持选择和更换同步文件夹。 在「媒体服务器 → 概览」中可直接选择或更换「CloudDrive2 Sync」同步文件夹所在的云存储；更换存储时自动迁移已有媒体库与进度数据（目标位置已有同步文件夹时自动合并），并清理旧存储中由服务器写入的文件
  4. 新增观看用户头像并合并 Emby 兼容接口端口。 支持为观看用户上传自定义头像（自动缩放至适合大小），并在 CloudDrive2 应用以及 Emby / Jellyfin 播放器中显示；Emby 兼容接口直接与媒体服务器共用端口（默认 19798 / HTTPS 19799），不再单独占用 29801 端口
  5. 媒体服务器同步所有者阅读与听歌进度。 所有者在媒体服务器和网页媒体库中产生的图书阅读与音乐收听进度会同步写入「CloudDrive2 Sync」，使各端设备的「继续阅读」和「继续收听」保持一致
  6. 优化剧集单季页面与网页杜比视界渲染效率。 只有一季的剧集不再重复显示单季海报栏，直接展示季信息与分集列表；优化 Chrome / Edge 网页播放器播放杜比视界影片时的画面渲染，降低显卡负载
  7. 修复连接 Windows SMB 服务器时共享名称乱码与连接失败的问题。 修复添加整台 Windows SMB 服务器或发现共享时，中文等非英文共享名称显示乱码或末尾带有异常字符导致无法打开共享的问题，并仅列出普通磁盘共享
  8. 修复下载、图片缓存与媒体库同步问题。 下载或播放新添加的文件时，如果本地目录缓存尚未包含该文件，会自动重新获取目录列表；修复图片缓存占用达到 90%–100% 时新入库影片海报与剧集图片无法导入的问题；修复增量更新的媒体库数据包在某些情况下未被其他设备采用的问题；修复媒体服务尚未启动完成时访问图片接口可能卡住的问题(#749)
  说明：
  1. 媒体服务器反向代理及外网访问设置见 https://www.clouddrive2.com/media-server.html#away ，网页播放器说明见 https://www.clouddrive2.com/web-player.html 。
  2. 已知问题（1.1.0 中已存在，尚未修复）：单向备份中同时打开"从目标同步删除"、并把删除规则设为"移到历史文件夹"时，目标文件夹中的 .clfs_history 文件夹本身会被当成多余内容再次移入历史文件夹，每扫描一次多嵌套一层。修复之前请不要同时使用这两个选项。
