ReleaseNotes: |-
  📦 v1.17.0 – Right-to-Left Support & Menu Bar Improvements
  This release brings full right-to-left language support to TimeScribe, adds Arabic and Hebrew, and improves project handling in the menu bar popup.
  ✨ New Features
  - ↔️ Full right-to-left support #88
    TimeScribe now fully supports right-to-left layouts.
    Thanks to @renanbazinin for the contribution!
  - 🌍 Arabic and Hebrew language support #88
    TimeScribe is now available in Arabic and Hebrew.
    Thanks to @renanbazinin for the contribution!
  🛠 Improvements
  - ⏱️ Daily project time in the menu bar #116
    The project list in the menu bar popup now also displays the total tracked time for each project for the current day.
    Thanks to @mrjavadseydi for the contribution!
  - 📂 Faster access to the project list #114
    The project list in the menu bar popup can now also be opened by simply clicking the current project badge.
    Thanks to @mrjavadseydi for the contribution!
  - 📜 Improved day overview scrolling
    The day overview has been refined and is now easier and smoother to scroll through.
  Thanks to all contributors and the community for continuing to improve TimeScribe! 🙌
