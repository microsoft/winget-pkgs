ReleaseNotes: |-
  📦 v1.18.0 – Flexible Project Billing, New Languages & Security Updates
  This release introduces more flexibility in project billing, adds support for Spanish and Persian, and includes important security updates to keep TimeScribe safe and reliable.
  ✨ New Features
  - 💰 Mark time entries as non-billable
    Time entries assigned to billable projects can now be individually marked as non-billable, giving you more control over which hours are included in billing. #142
  - 🌍 Spanish and Persian language support
    TimeScribe is now available in Spanish and Persian.
    Thanks to @aRubenDev and @mahdyaralipor for their contributions!
  🐛 Bug Fixes & Security Updates
  - 🔒 PHP2Shell security fix
    The bundled PHP binary has been updated to address the PHP2Shell security vulnerability. #143
  - 🛡️ General security and dependency updates
    Additional security fixes and dependency updates have been applied to improve overall application security and stability.
  Thanks to all contributors and the community for continuing to improve TimeScribe! 🙌
