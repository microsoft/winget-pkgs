ReleaseNotes: |-
  📦 v1.16.0 – Detailed Day View, UI Facelift & macOS 27 Support
  This release introduces a brand-new detailed day view, refreshes the overall look of TimeScribe, and adds support for macOS 27.
  ✨ New Features
  - 📅 New detailed day view
    You can now switch between a simple and a detailed view of your day, giving you more flexibility depending on how much information you want to see.
  - 🎨 App-wide visual facelift
    TimeScribe has received a refreshed look across the entire application for a cleaner and more consistent experience.
  - 🍎 macOS 27 support
    TimeScribe is now fully compatible with macOS 27.
  🛠 Improvements
  - 🪟 Resizable application window #121
    The main application window can now be resized to better fit your workflow and screen setup.
  - ⚙️ Various minor improvements across the application.
  - 🔒 Security updates have been applied.
  🐛 Bug Fixes
  - Fix: App activity tracking stopped working on macOS 27.
    This issue has now been resolved and activity tracking works correctly again.
  Thanks to everyone reporting issues, suggesting improvements, and helping make TimeScribe better with every release! 🙌
