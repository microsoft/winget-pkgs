ShortDescription: A WinUI 3 control application for the DSPi audio processor. Supports both RP2040 and RP2350 platforms.
Moniker: dspiconsole
ReleaseNotes: |-
  This is the first full release of version 1.1.6, collecting the entire version 1.1.6 beta series into one build. It is the first Windows release with DSPi Link, which shares a DSPi with other computers, phones and browsers on the local network, and the first that updates itself. It carries DSPi firmware 1.1.6 and brings the application into line with DSPi Console for macOS 1.1.6.
  The release has since been refreshed in place. The device of an ESP32 bridge was sometimes missing from the device list when the bridge started, or its device reconnected, while the application was running; a bridge that requires pairing was affected most, because its device is the only means of pairing with it. Such devices are now listed, and a hub that requires pairing may also be paired from its Pair button in Settings > General > Networking. A device that is reachable through more than one hub, such as a board connected to a computer by USB and to a bridge at the same time, is listed once with a submenu from which the hub may be chosen. An installation made before the refresh is updated by downloading the archive again.
  An earlier installation must be updated by hand once. Version 1.1.6 is the first release with the in-application updater, so an installation of version 1.1.5 or of an earlier beta is replaced manually: extract the new archive, preserve its structure, and run DSPiConsole.exe as before. Later releases are offered and installed from within the application. The folder layout is unchanged from version 1.1.5, with a single DSPiConsole.exe at the top level and the application in an app subfolder. The application now requires the .NET 10 Desktop Runtime in place of .NET 8.
  New since v1.1.6-beta4
  - DSPi Link, sharing from this PC: Settings > General > Networking shares the DSPi plugged into this PC on the local network. Access is open by default; alternatively, each new client must pair with a six-digit code, and each paired client is given the Viewer, Control or Admin role. The page warns when Windows Firewall blocks connections or the network is marked Public, and offers to correct either.
  - DSPi Link, the browser page: A browser on the same network may open the PC's address to reach a control page that the application serves itself, with meters and controls.
  - DSPi Link, devices shared elsewhere: The application finds devices shared by other computers running DSPi Console and by ESP32 bridges, lists them in the device list with the name of the hub that shares them, and controls them as it controls a local device. A hub may also be added by its address.
  - Coordination between consoles: Saving a preset, applying an imported configuration and learning an IR code hold other consoles off the device until the operation completes, and a change refused for that reason is reported in the status bar. When several consoles display one device's spectrum analyser, the console that last chose channels determines what is measured, the others follow it, and a Take control button reverses the roles.
  - Running in the background: Settings > General > Background places an icon in the notification area, after which closing the main window keeps the application running there with sharing in effect. The application may open at login, optionally with its window closed, and may keep the PC awake while sharing. Minimise to Notification Area in the main menu has the same effect as closing the window. Launching the application a second time brings the running copy forward.
  - Software updates: The application checks for new releases at launch and daily, and downloads, verifies and installs a release in place. Settings > Software Update and Help > Check for Updates provide the same functions on demand.
  - Latency: Settings > General > Globals provides a target latency from 0.67 ms to 8 ms. The 0.67 ms and 1 ms options suit S/PDIF, I2S and ADAT inputs and run as 2 ms on USB.
  - Output ring health: The Statistics window shows the fill target, underruns, the lowest fill and the worst input gaps for the output ring, so that the margin of a latency setting may be judged. Buffer fill is shown in fine steps.
  - Names for the board and its inputs: The board may be given its own name, and its input sources renamed, under Settings > General > Globals or by right-clicking the source picker. The device list and DSPi Link hubs show these names.
  - Control surfaces: Controls may save the active preset and set the target latency. The Input & Presets family is renamed Device, and display pages choose their parameter from a menu grouped by family.
  - Filter files and AutoEQ: Filter files are written in the format of DSPi Console for macOS, and an import reports any filter that could not be applied. The AutoEQ database may be rebuilt from GitHub.
  - Smaller additions: The sidebar may be resized by dragging its edge, and a double-click restores its width. I2S data pins on unused pairs are listed under Unused pairs, and external mute control offers hold and release times.
  - Every way of quitting now applies the same safeguards: File > Exit previously skipped the unsaved changes prompt, the pending Settings prompt and the protection against quitting during a firmware installation. The close button, Alt+F4, File > Exit and an update now all apply them.
  - Firmware 1.1.6: Level meters and clip indicators on the RP2040 no longer read 6 dB high. A bypassed EQ band no longer remains bypassed after a factory reset, a preset deletion or the loading of an empty slot. Outputs on a mixed S/PDIF and I2S layout no longer fall silent after playback pauses. Slave mode tracks an S/PDIF, ADAT or I2S source more closely.
  What's new in v1.1.6
  Everything below has accumulated across the version 1.1.6 betas and is new relative to version 1.1.5.
  - DSPi Link: The DSPi connected to this PC may be shared on the local network with other computers, phones and browsers, with open access or pairing by a six-digit code and Viewer, Control and Admin roles. Devices shared by other computers and by ESP32 bridges appear in the device list and are controlled as local devices are. Consoles that share a device coordinate their saves, imports and analyser settings. The application may run in the notification area as a sharing hub and may open at login.
  - Software updates: New releases are found, downloaded, verified and installed from within the application.
  - Firmware installation from the application: The application carries the matching firmware for RP2040 and RP2350 boards and installs it from File > Update Firmware, confirming the version that the device reports afterwards. A banner appears when the connected device runs a firmware version other than the one this release expects.
  - Filters may be edited upon the response graph: Each band appears upon the graph as a point that is dragged to move it and scrolled to change its width, with a card beside it for typed values, shape and slope. Bands may be added, selected together, bypassed, inverted and deleted from the graph, and the device follows a drag as it happens.
  - Spectrum analyser: The response graph may show a live spectrum of any input or output behind its curves, with an optional strip of third-octave bars and a separate Spectrum Analyser window (Ctrl+Shift+A). The measurement is made by the device, so every source is supported.
  - Tube Modeller, Subharmonic Synthesizer and output limiters: A Tube Modeller window (Ctrl+Shift+D) applies the character of one of sixteen vacuum tubes to the selected outputs. A Subharmonic Synthesizer window (Ctrl+Shift+S) generates an octave below the bass. Each output has a brickwall limiter with adjustable threshold and release.
  - Settings reorganised: Settings opens upon an Overview page that maps every GPIO on the header and shows the page on which each claimed pin is set. Settings is divided into System and Control, each interface occupies a single page, and a Master Clock page holds the default sample rate and the clock supplied to external DACs. Enabling a feature whose stored pin is in use offers a choice of free pin in place of a refusal. Latency, the board's name and the names of its input sources are set under General > Globals.
  - Control surfaces: The Control Surfaces editor has moved into Settings and shares its pending changes prompt. Channel groups let one control drive several channels, and macros trigger a sequence of up to eight delayed parameter changes. Character and OLED displays on I2C pins show configurable dashboard pages and support front-panel editing with an encoder and a button. Indicators gain on and off delays and a brightness limit, remote keys may drive a channel group, and controls may save the active preset and set the target latency.
  - Auxiliary outputs: A new Auxiliary Outputs page configures GPIOs that the device switches or dims on behalf of external equipment, such as an amplifier trigger, a speaker relay or a lamp.
  - Redesigned windows: The dashboard arranges its cards in rows that use the width of the window. The effect windows follow the layout of DSPi Console for macOS and are gathered into an Effects submenu. The Matrix Mixer, Signal Generator and Statistics windows are redesigned, Statistics reports the health of the output ring, and the Interrupt Monitor names every notification that the firmware sends.
  - Channel pages and sliders: Channel parameters may be copied and pasted with Ctrl+C and Ctrl+V, output pages provide Clear All, and the input preamp may be typed. Sliders are followed by the device during a drag, and the change is recorded once upon release.
  - Getting Started and What's New: A Getting Started wizard guides a new user from a blank Pico to verified DSPi firmware, and a What's New window presents the release notes once after an update. Both are available from the new Help menu.
