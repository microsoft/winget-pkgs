ShortDescription: Sicherheitscheck für Windows 11 – prüft 372 Sicherheitsregeln und erklärt, was nicht stimmt und wie Sie es beheben.
Description: |-
  SwissiCheck prüft Ihren Windows-11-PC gegen 372 bewährte Sicherheitsregeln und erklärt verständlich, was nicht stimmt und wie Sie es beheben.
  Sechs Bereiche: Systemzustand, Benutzerkonten, Apps, Speicher, Netzwerk und Richtlinien. SwissiCheck liest nur, ändert nichts, und Ihre Ergebnisse bleiben auf Ihrem PC.
  Die Free-Version ist gratis und ohne Zeitlimit. SwissiCheck Pro (einmaliger Kauf) zeigt dazu Schritt-für-Schritt-Anleitungen und Befehle, HTML-Bericht, CSV-Export, eigenen Standard und Kommandozeile.
  Programm und Hilfe auf Deutsch, Englisch und Französisch. Für die Prüfung sind Administratorrechte nötig.
