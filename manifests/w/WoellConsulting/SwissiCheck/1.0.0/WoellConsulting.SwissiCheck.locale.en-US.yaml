ShortDescription: Security check for Windows 11 – checks 372 security rules and explains what is wrong and how to fix it.
Description: |-
  SwissiCheck checks your Windows 11 PC against 372 proven security rules and explains in plain language what is wrong and how to fix it.
  Six areas: system status, user accounts, apps, storage, network and policies. Read-only – SwissiCheck changes nothing and your results stay on your PC.
  The Free version costs nothing and has no time limit. SwissiCheck Pro (one-time purchase) adds step-by-step instructions and commands, HTML report, CSV export, your own standard and a command line.
  Program and help in English, German and French. Administrator rights are required for the scan.
