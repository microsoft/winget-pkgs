ShortDescription: Vérification de sécurité pour Windows 11 – contrôle 372 règles de sécurité et explique ce qui ne va pas et comment y remédier.
Description: |-
  SwissiCheck vérifie votre PC Windows 11 selon 372 règles de sécurité éprouvées et explique clairement ce qui ne va pas et comment y remédier.
  Six domaines : état du système, comptes d’utilisateur, applications, stockage, réseau et stratégies. SwissiCheck lit uniquement, ne modifie rien, et vos résultats restent sur votre PC.
  La version Free est gratuite et sans limite de durée. SwissiCheck Pro (achat unique) ajoute des instructions pas à pas et des commandes, le rapport HTML, l’export CSV, le référentiel personnalisé et la ligne de commande.
  Programme et aide en français, allemand et anglais. Les droits d’administrateur sont nécessaires pour l’analyse.
