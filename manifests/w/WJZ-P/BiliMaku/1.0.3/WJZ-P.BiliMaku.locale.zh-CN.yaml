Description: |-
  BiliMaku · 哔哩弹幕姬是一款基于 React、Rust 与 Tauri 2 的桌面直播小工具，支持弹幕的播报、滚动等功能。

  功能

  - 扫码登录并恢复本地会话；
  - 连接直播间，接收弹幕、礼物、SC、大航海与互动事件；
  - 使用系统语音或本地 Bert-VITS2 自定义音色播报；
  - 提供全屏滚动弹幕与透明侧边事件悬浮窗；
  - 支持浅色模式、深色模式与 WebGL 界面动效。
  Release 包不包含 PyTorch、BERT、音色权重或用户 Cookie。
