ShortDescription: Middleware/CLI between AI agents and servers -- AI proposes, human approves
Description: cgate sits between your AI coding agent and your infrastructure. The agent proposes a command over MCP, a human approves or rejects it, and every proposal, decision, and result is recorded. Ships as a single binary with an interactive approval queue (cgate watch), audit history export, and optional per-server auto-execution behind multiple safety switches.
