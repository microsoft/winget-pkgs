ShortDescription: Live OCR for a fixed screen zone on Windows — offline, with barcode decoding and optional translation.
Description: |-
  ScantoutPC captures a fixed zone of the screen and converts it to editable text
  in real time (PP-OCR / ONNX Runtime, fully offline). Features: automatic clipboard
  copy, history, multi-monitor support, Chinese/Korean language packs, barcode/QR decoding,
  optional offline translation, and a floating mini window mode.
