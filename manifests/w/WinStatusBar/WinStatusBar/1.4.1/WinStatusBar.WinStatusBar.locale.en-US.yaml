ShortDescription: Native Windows 11 status bar with a built-in AI assistant, hardware monitor and AI quota tracker.
Description: |-
  WinStatusBar docks a native status bar at the top of the screen. It shows CPU, RAM, GPU, network and battery with detail panels, the usage limits and current task of AI agents (Codex, Claude Code, Gemini, Copilot, Lenovo Qira, local models), and a command box to chat with several AIs using the context of the active window. With permission, the assistant can automate files, Office documents, settings and apps.
  Installs per user without administrator rights and updates itself silently from GitHub Releases.
