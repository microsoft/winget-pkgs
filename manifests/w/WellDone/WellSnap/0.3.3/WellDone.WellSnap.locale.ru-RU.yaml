ShortDescription: Бесплатная программа для скриншотов с открытым кодом. Стрелки, размытие и нумерованные сноски.
Description: |-
  WellSnap снимает выделенную область на замороженном экране и даёт разметить её на месте: стрелки, рамки, маркер, карандаш, текст, нумерованные сноски с комментариями и размытие, которое нельзя отменить.
  Несколько снимков собираются в набор и вставляются в Telegram, WhatsApp, Discord, письмо или документ одним сообщением либо объединяются в одну картинку.
  В Windows 11 одна кнопка отдаёт клавишу Print Screen программе WellSnap вместо «Ножниц» и возвращает её обратно.
  Без регистрации и без облака: скриншоты остаются на компьютере.
