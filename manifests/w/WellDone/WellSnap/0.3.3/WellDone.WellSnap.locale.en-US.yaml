ShortDescription: Free open-source screenshot tool with arrows, blur and numbered callouts.
Description: |-
  WellSnap takes a screenshot of a selected area on a frozen screen and lets you mark it up right there: arrows, rectangles, a marker, a pencil, text, numbered callouts with comments and a blur that cannot be reversed.
  Several screenshots can be collected into a set and pasted into Telegram, WhatsApp, Discord, mail or a document as one message, or combined into one image.
  On Windows 11 one button gives the Print Screen key to WellSnap instead of Snipping Tool, and gives it back.
  No account and no cloud: screenshots stay on the computer.
