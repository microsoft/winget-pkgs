  bulanıklık veya mozaikle işaretleyin; sonra kopyalayın, dosya olarak kopyalayın, kaydedin, ekrana
  sabitleyin ya da OCR ile metnini alın. Herhangi bir bölgeyi MP4 olarak kaydedip kayıt sürerken üzerine çizebilirsiniz.
