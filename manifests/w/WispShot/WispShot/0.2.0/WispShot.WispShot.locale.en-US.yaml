ShortDescription: A tiny screenshot and screen recording tool that stays out of your way.
Description: |-
  WispShot sits in the tray using about 2 MB of memory and no CPU until you press its shortcut.
  Capture a region, a window or part of a window, mark it up with boxes, arrows, text, numbered steps,
  blur or pixelate, then copy, copy as a file, save, pin it on screen or read its text with OCR.
  It also records any area to MP4 and lets you draw on the recording while it runs.
