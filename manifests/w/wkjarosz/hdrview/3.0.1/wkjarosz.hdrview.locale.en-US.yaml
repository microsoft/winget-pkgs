ReleaseNotes: |-
  HDRView 3.0.1 is functionally identical to [3.0.0](https://github.com/wkjarosz/hdrview/releases/tag/v3.0.0); it only fixes the Linux AppImage.

  • The AppImage is now built on Ubuntu 22.04, so it runs on any Linux with glibc 2.35 or newer (Ubuntu 22.04, Debian 12, Fedora 36, and later). The 3.0.0 AppImage required glibc 2.38 and failed to start on older systems.
  • The AppImage now carries AppStream metadata, so software centers and the AppImage catalog can describe it.
  • `LICENSE.txt` is now the standard BSD-3-Clause text; a leftover extra paragraph that asked nothing of users was removed.
