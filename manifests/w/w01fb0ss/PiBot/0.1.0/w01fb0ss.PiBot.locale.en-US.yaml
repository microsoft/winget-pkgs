ShortDescription: An open-source, local-first AI agent team for your desktop.
Description: |-
  Pi Bot is a desktop app in which a team of named Bots works on your own computer. You chat with a Bot directly or put several in a group chat, give them a working folder, and they plan, run commands, edit files and hand work to each other, while every risky step waits for your approval.
  The brain runs on your machine too: chats, files, memory and keys stay local, and only the model provider you choose sees the prompts you send.
  Pi Bot also connects a browser, MCP servers, skills and local knowledge libraries, and can use the computer under approval controls. An Android app and a Runner on another computer are optional connections.
