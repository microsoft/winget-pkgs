PackageIdentifier: w01fb0ss.PiBot
PackageVersion: 0.1.0
PackageLocale: zh-CN
PrivacyUrl: https://pibot.space/cn/privacy/
ShortDescription: 一款开源、本地优先的桌面 AI 智能体团队应用。
Description: |-
  Pi Bot 是一款桌面应用，让一支具名 Bot 组成的团队在你自己的电脑上工作。你可以直接与某个 Bot 聊天，也可以把多个 Bot 拉进群聊，为它们指定工作文件夹；它们会制定计划、执行命令、修改文件并相互交接工作，而每一个有风险的操作都会等待你的审批。
  模型推理的大脑同样运行在你的机器上：对话、文件、记忆和密钥都保存在本地，只有你选择的模型服务商会看到你发送的提示词。
  Pi Bot 还能连接浏览器、MCP 服务、技能和本地知识库，并在审批控制下操作电脑。Android 应用以及运行在另一台电脑上的 Runner 都是可选的连接。
