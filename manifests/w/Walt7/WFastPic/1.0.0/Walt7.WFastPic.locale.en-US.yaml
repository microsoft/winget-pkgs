ShortDescription: An open source tribute to Picasa for Windows - pick and fix hundreds of photos fast, HEIC included.
Description: |-
  WFastPic is an open source tribute to Picasa for Windows, made for large HEIC photo collections
  from today's phones. Keep the good shots with the space bar, reject the rest, fix them with one
  click and export JPEGs.
  - Very fast selection: thumbnails, bursts, stars, rejects, keyboard shortcuts.
  - Automatic rating and reject suggestions for shaken or blurry photos, always separate from yours.
  - Quick non-destructive fixes: crop with suggested crops, straighten, auto contrast and color.
  - Folders by year, photo map with place names, optional on-device face recognition.
  - Everything runs on your PC: no account, no telemetry, your photos never leave it.
  Not affiliated with Google: Picasa is a trademark of Google LLC.
