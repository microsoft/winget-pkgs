ShortDescription: Un tributo open source a Picasa per Windows - scegliere e sistemare in fretta centinaia di foto, anche HEIC.
Description: |-
  WFastPic è un tributo open source a Picasa per Windows, pensato per le grandi raccolte di foto HEIC
  dei telefoni di oggi. Tieni le foto buone con la barra spaziatrice, scarta le altre, sistemale con
  un clic ed esporta in JPEG.
  - Selezione velocissima: miniature, raffiche, stelle, scarti, scorciatoie da tastiera.
  - Voto automatico e suggerimenti di scarto per le foto mosse o sfocate, sempre separati dai tuoi.
  - Ritocchi rapidi non distruttivi: ritaglio con ritagli suggeriti, raddrizzamento, contrasto e colore automatici.
  - Cartelle per anno, mappa delle foto con i nomi dei luoghi, riconoscimento dei volti facoltativo sul PC.
  - Tutto gira sul PC: nessun account, nessuna telemetria, le foto non escono mai.
  Non affiliato a Google: Picasa è un marchio di Google LLC.
