ShortDescription: Print notes, pictures and PDF pages to a pocket Bluetooth thermal printer from your PC, without the phone app.
Description: |-
  NuPrint prints straight from your PC to small Bluetooth thermal printers, the pocket kind usually driven by a phone app.
  Write a note, open a picture or pick one page of a PDF. The preview shows exactly what will come out of the printer, dot for dot, with a millimetre ruler beside it. Jobs go through a queue that never resends a job on its own.
  No account, ads or tracking. Supported printers: the SC03h (names starting "SC03h-").
