ReleaseNotes: |-
  Oryxis 0.20.1
  A patch release. The app starts again on Intel integrated GPUs whose Vulkan driver predates the 1.3.215 spec revision, and the AI chat speaks to Gemini 3 models with the thinking switch that generation accepts.
  Fixes
  - Windows: the app starts on Intel integrated GPUs whose Vulkan driver predates spec 1.3.215 (UHD 630, Ice Lake) (#248, reported by @koobs). On 0.20.0, setting WGPU_BACKEND=dx12 gets past it.
  AI chat
  - Gemini 3 models think at the lowest level with Reasoning off, the switch Google keeps for that generation; Gemini 2.5 models keep their thinking budget of zero.
  - A newly selected Google Gemini provider suggests gemini-3.8-flash; a model already chosen stays.
  Full Changelog: v0.20.0...v0.20.1
