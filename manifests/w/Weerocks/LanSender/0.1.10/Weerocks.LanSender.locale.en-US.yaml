ShortDescription: Send messages, files, and folders between devices on your local network.
Description: |-
  LanSender is a free local-network messenger and file transfer app for Windows,
  macOS, Linux, Android, iPhone, and iPad. Discover nearby devices, exchange messages,
  and send files or folders directly between devices without creating an account.
  The Windows client supports attachment drag-and-drop, clipboard images and files,
  and region screenshots. Optional local MCP and Skill integration is available as
  a separate download for AI assistants.
