ShortDescription: Battery level and remaining time for wireless mice, headsets and controllers on the Windows taskbar.
Description: WattPill is a native Windows taskbar pill with the real battery percentage and an estimated remaining time for wireless mice, headsets and controllers. It reads the device's own level where available, keeps a local history for the forecast, has no telemetry, and the UI is available in English and Russian. WattPill 2.0.0 is the renamed JuiceBar; settings and history migrate automatically.
