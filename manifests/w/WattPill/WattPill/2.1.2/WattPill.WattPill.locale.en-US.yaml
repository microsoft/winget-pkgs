ShortDescription: Battery level and remaining time for wireless mice, headsets and controllers on the Windows taskbar.
Description: WattPill is a native Windows taskbar pill with the real battery percentage and an honest remaining-time estimate for wireless mice, headsets and controllers. It reads the device's own level where available, keeps a local history for the forecast, has no telemetry, and the UI is available in English and Russian. Version 2.1 adds a settings panel, per-device visibility, multi-monitor placement, DirectWrite pill text and a more careful discharge forecast.
