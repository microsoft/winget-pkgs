ReleaseNotes: New PowerVision-style pill, a settings panel with toggles and segmented options, per-device eye to hide a device from the pill, multi-monitor placement, DirectWrite text, green charging and red low-battery states, and a segment-based remaining-time estimate. 2.1.2 fixes the pill jumping above the clock after repeated Win+click cycles; 2.1.1 fixed the fullscreen overlay flicker.
