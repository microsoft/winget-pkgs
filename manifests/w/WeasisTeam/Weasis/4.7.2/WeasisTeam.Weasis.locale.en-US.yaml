ReleaseNotes: |-
  Full Changelog
  Implemented enhancements:
  - Add segmentation region tooltip and visibility toggle functionality #885
  - Add SegRegionCellRenderer for color swatch display in segmentation tree #884
  - Refactor DICOM manifest handling #883
  - Render multiple SEG files in 3D (merged volume), add voxel mask modes and async texture build #881
  - Add segmentation selection controls: Show/Hide all, view button and complete tool listing #879
  - Hide non-relevant segmentations by default (keyword list and global preference) #878
  - Refactor Thumbnail rendering to avoid AWT tree lock during icon updates #877
  - Add user-configurable default filter mode for DICOM explorer #874
  - Allow adding and editing custom 3D LUTs #805
  Fixed bugs:
  - "Copy images into the local temporary directory" option is not applied #887
  - Fix determining plane from DICOM images when building volume #882
  - Ellipse showing wrong Mean #870
  - Fixed blackening when setting segment opacity in 3D viewer #865
  - Preset changes are only applied after scrolling in multi-view layouts #860
  - Attenuation measurement returns incorrect HU values in v4.7.1 #858
  - Area-based intensity measurement issue #855
  Security fixes:
  - Enhance property handling to prevent path injection and ensure safe directory names #888
  Merged pull requests:
  - Fixed blackening when setting segment opacity in 3D viewer. #857 (loximann)
  - build: bump the maven group with 7 updates #854 (dependabot[bot])
  - ci: bump actions/setup-java from 5.4.0 to 5.5.0 in the actions group #853 (dependabot[bot])
