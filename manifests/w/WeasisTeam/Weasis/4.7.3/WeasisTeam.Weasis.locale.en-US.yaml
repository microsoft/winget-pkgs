ReleaseNotes: |-
  Full Changelog
  Implemented enhancements:
  - Enhance volume rendering: add color texture support and improve mipmapping logic #905
  - Update to dcm4che 5.35.0 #903
  - Volume rendering: add shading capabilities to segmentation objects #902
  - Implement auto-hide for crowded segmentation series to improve visibility. Fixes crash when loading multiple SEG files #901
  - FBO volume rendering: adaptive resolution handling for improved performance #900
  - Improving the management of queries on DICOMweb series #898
  - Enhance DICOM retrieval with series selection and loading placeholders #897
  - Add AreaIcon and TabPlacement classes for enhanced tab management and visual representation #895
  - Add PersonNameCellEditor and PersonNameView for editing DICOM person names in Dicomizer #894
  - Add segmentation region tooltip and visibility toggle functionality #885
  - Add SegRegionCellRenderer for color swatch display in segmentation tree #884
  - Refactor DICOM manifest handling #883
  - Render multiple SEG files in 3D (merged volume), add voxel mask modes and async texture build #881
  - Add segmentation selection controls: Show/Hide all, view button and complete tool listing #879
  - Hide non-relevant segmentations by default (keyword list and global preference) #878
  - Refactor Thumbnail rendering to avoid AWT tree lock during icon updates #877
  Fixed bugs:
  - Dicomizer - The first modifier "right" does not appear in the modifiers list in the Anatomic Region popup selection #904
  - STOW-RS export fails on studies that take longer than UrlReadTimeout #899
  - Implement service invalidation for updated authentication methods #896
  - WADO-RS retrieval failed after upgrade to Weasis 4.7.x #893
  - Not able to open the CAG images... The screen remains black #890
  - "Copy images into the local temporary directory" option is not applied #887
  - Fix determining plane from DICOM images when building volume #882
  - Regression after 4.6.6: series no longer loads progressively and the viewer freezes while scrolling large CT series #880
  - Export as lossless transfer syntax is incorrectly setting LossyImageCompression value #876
  Security fixes:
  - Enhance property handling to prevent path injection and ensure safe directory names #888
  Closed issues:
  - ROI Metrics Not showing #871
  - Hounsfield Units measurement does not appear. #869
  Merged pull requests:
  - build: bump the maven group across 1 directory with 7 updates #889 (dependabot[bot])
  - ci: bump the actions group across 1 directory with 2 updates #872 (dependabot[bot])
