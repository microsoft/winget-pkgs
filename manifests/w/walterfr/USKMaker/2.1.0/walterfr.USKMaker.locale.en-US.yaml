ShortDescription: AI-powered UltraStar karaoke package generator (lyric sync, pitch, and BPM detection)
Description: USKMaker generates complete UltraStar Deluxe karaoke packages from a YouTube link or local audio file. It downloads/prepares the audio, separates vocals, aligns your provided lyrics to the singing using local AI (WhisperX + forced alignment), detects pitch and BPM, and writes a ready-to-play UltraStar .txt package - entirely offline after setup, no cloud APIs.
