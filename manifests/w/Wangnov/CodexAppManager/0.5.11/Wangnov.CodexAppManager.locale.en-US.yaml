  * docs: refresh roadmap to reflect shipped state by @Wangnov in https://github.com/Wangnov/Codex-App-Manager/pull/371
  * test(contract): vendor release-manifest schema, prove parsers agree with it by @Wangnov in https://github.com/Wangnov/Codex-App-Manager/pull/376
  * docs(theme-engine): mark codex-theme-engine as the canonical runtime source by @Wangnov in https://github.com/Wangnov/Codex-App-Manager/pull/373
  * fix(windows): retry Schannel no-revocation-check failures by @Dwight2458 in https://github.com/Wangnov/Codex-App-Manager/pull/378
