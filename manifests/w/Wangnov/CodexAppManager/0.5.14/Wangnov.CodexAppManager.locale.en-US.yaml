  macOS · Apple Silicon│CodexAppManager_aarch64.dmg
  ─────────────────────┼───────────────────────────────────────────
  macOS · Intel        │CodexAppManager_x86_64.dmg
  ─────────────────────┼───────────────────────────────────────────
  Windows · x64        │CodexAppManager_x64-setup.exe
  ─────────────────────┼───────────────────────────────────────────
