ReleaseNotes: |-
  Codex App Manager
  > Windows 启动参数可随更新保留，修复安装目录误识别，并改进旧版 Mac 架构检测与诊断复制。
  > Keep Windows launch arguments across updates, correct install-path detection, and improve Mac architecture detection and diagnostic copying.
  ✨ 亮点 · Highlights
  - Windows 启动参数：在设置中填写 Codex 启动参数，可配置代理服务器或 PAC 地址；管理器启动、更新后重启、皮肤启动和开始菜单入口均读取已保存参数。支持保留引号与空格，清空即可恢复默认。
    Configure Codex launch arguments, including proxy servers and PAC URLs. Saved arguments apply to Manager launches, post-update restarts, themed launches and the Start Menu entry. Quotes and spaces are preserved; clear the field to restore defaults.
  🐛 修复 · Fixes
  - 安装目录误识别：MSIX 的 WindowsApps 目录不再被当作便携版安装目录；回退安装会使用用户可写目录，避免向受保护的包目录写入而触发拒绝访问。
    WindowsApps MSIX directories are no longer mistaken for portable installs. Portable fallback uses a writable user directory instead of writing into protected package storage.
  - Mac 架构识别：改进 Intel、Apple Silicon 和 Universal 应用的架构检测，不再依赖 lipo 开发工具。旧系统仍需选择与自身 macOS 版本兼容的 Codex 版本。
    Detect Intel, Apple Silicon and Universal app architectures without relying on the lipo developer tool. Older Macs still need a Codex version compatible with their macOS release.
  - 诊断信息复制：改用原生剪贴板复制诊断信息，避免异步收集后复制失败，并保留中文内容。
    Copy diagnostics through the native clipboard, avoiding failures after asynchronous collection and preserving Chinese text.
  - Windows 快捷方式与恢复：已运行的便携版正常聚焦原窗口时不再误报启动失败；参数入口在启动修复后保留，并使用稳定的工作目录。卸载后清理快捷方式失败时，可单独重试清理。
    Focusing an already-running portable app no longer reports a launch failure. Launch repair preserves the saved-arguments entry and uses a stable working directory. Failed shortcut cleanup after uninstall can be retried separately.
  📦 安装与升级 · Install & Upgrade
  已经安装? 打开应用即可收到本次更新——macOS 只下载版本间的增量,校验失败自动回滚。
  Already installed? The app offers this update in-app — macOS pulls only the delta, with automatic rollback.
