ReleaseNotes: |-
  Codex App Manager
  > 适配新版 Codex 的页面、导航和输入按钮，让皮肤随界面状态正确显示。
  > Adapt skins to the current Codex pages, navigation and composer actions.
  🐛 修复 · Fixes
  - 页面背景跟随切换：在首页与聊天之间切换、前进或后退时，皮肤背景跟随当前可见页面；打开弹窗后，底层页面背景仍然保留。
    Skin backgrounds follow the visible page during navigation and remain in place behind dialogs.
  - 识别新版侧栏：支持主页、空间、定时任务、自定义和代码审查入口；导航节点复用后会更新对应的皮肤图标。
    Recognize the current Home, Space, Automations, Customize and Code Review destinations, updating skin icons when navigation elements are reused.
  - 区分输入按钮状态：配套皮肤可以分别识别发送、停止和语音操作，避免发送装饰覆盖其他按钮；无法识别的按钮保留原生图标。
    Updated skins can distinguish Send, Stop and Voice, keeping send artwork off other controls and preserving native icons for unrecognized actions.
  配套皮肤： Elon Mars Protocol 1.2.1 同步修复标志默认隐藏、顶部按钮溢出和新增导航素材缺失。请同时更新 Manager 和皮肤，以获得完整修复。
  Companion skin: Elon Mars Protocol 1.2.1 fixes hidden logos, crowded header controls and missing navigation artwork. Update both Manager and the skin for the complete fix.
  验证范围： Manager 全量 472 项自动回归（含皮肤运行时 47 项）及配套 Studio 65 项测试通过。本机 PowerShell 首次启动超过默认 5 秒，使用 20 秒测试上限复跑通过，未修改测试配置；所有皮肤通过打包检查。自动回归不替代每套皮肤的真机视觉验收。
  Verification scope: All 472 Manager tests (including 47 renderer-runtime tests) and 65 companion Studio tests passed, along with packaging checks for all skins. A local PowerShell cold start exceeded the default 5-second limit; the suite passed with a 20-second limit without changing test configuration. Automated checks do not replace visual validation of each skin in Codex.
  📦 安装与升级 · Install & Upgrade
  已经安装? 打开应用即可收到本次更新——macOS 只下载版本间的增量,校验失败自动回滚。
  Already installed? The app offers this update in-app — macOS pulls only the delta, with automatic rollback.
  ─────────────────────┬───────────────────────────────────────────
  平台 · Platform      │下载 · Download(国内直连 · China-reachable)
  ─────────────────────┼───────────────────────────────────────────
  macOS · Apple Silicon│CodexAppManager_aarch64.dmg
  ─────────────────────┼───────────────────────────────────────────
  macOS · Intel        │CodexAppManager_x86_64.dmg
  ─────────────────────┼───────────────────────────────────────────
  Windows · x64        │CodexAppManager_x64-setup.exe
  ─────────────────────┼───────────────────────────────────────────
  Windows · ARM64      │CodexAppManager_arm64-setup.exe
  ─────────────────────┴───────────────────────────────────────────
  Windows 签名状态: 本版安装器没有 Authenticode 代码签名,首次运行可能出现 SmartScreen 提示。.sig / latest.json 的 Tauri updater 字节签名用于验证更新文件,不代表 Windows 发行者身份。SignPath Foundation 申请已不再推进,项目改为采用付费云 HSM 证书;证书配置完成前发布保持未签名。参见 代码签名政策与 Windows signing and verification。
  Windows signing status: This release's installers are not Authenticode-signed, so SmartScreen may warn on first run. Tauri updater signatures in .sig / latest.json verify update files and do not establish Windows publisher identity. The SignPath Foundation application is no longer being pursued; the project is moving to a paid cloud-HSM certificate, and releases stay unsigned until one is configured. See the code signing policy and Windows signing and verification.
  隐私 · Privacy: 隐私政策 · Privacy policy
  核验下载: 本页 Assets 带有 SHA256SUMS;Windows 用 Get-FileHash .\CodexAppManager_x64-setup.exe -Algorithm SHA256 或替换为 ARM64 文件名,macOS 用 shasum -a 256 CodexAppManager_aarch64.dmg,再与 SHA256SUMS 比对。
  Verify downloads: This release includes SHA256SUMS in Assets; on Windows run Get-FileHash .\CodexAppManager_x64-setup.exe -Algorithm SHA256 or swap in the ARM64 filename, and on macOS run shasum -a 256 CodexAppManager_aarch64.dmg, then compare with SHA256SUMS.
  # macOS · Homebrew
  brew install --cask wangnov/tap/codex-app-manager
  > 镜像直链恒指向最新版本;如需本页对应的历史版本,请使用下方 Assets。.app.tar.gz / .sig / latest.json 是自动更新器的工件,手动安装请选 .dmg / .exe。
  > Mirror permalinks always resolve to the latest release — for this exact version use the assets below. .app.tar.gz / .sig / latest.json belong to the auto-updater; pick the .dmg / .exe for manual installs.
