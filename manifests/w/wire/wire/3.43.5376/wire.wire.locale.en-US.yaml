ReleaseNotes: |-
  Improvement
  - Added MDM support for overriding AppLock on managed devices. IT admins can now enforce or override the AppLock requirement through MDM configuration.
  - Fixed an issue where incorrect AVS and web versions were reported. The About dialog now always displays up-to-date version information when opened.
  Verbessert
  - MDM-Unterstützung zum Überschreiben von AppLock auf verwalteten Geräten hinzugefügt. IT-Administratoren können die AppLock-Anforderung jetzt über die MDM-Konfiguration erzwingen oder außer Kraft setzen.
  - Ein Problem wurde behoben, bei dem falsche AVS- und Webversionen angezeigt wurden. Der Info-Dialog zeigt beim Öffnen nun stets aktuelle Versionsinformationen an.
