ShortDescription: A RAW photo editor with a catalog - open source, no subscription, no account
Description: |-
  Rustroom is a complete darkroom for your RAW files: a Library to import, sort, rate and find your photos, and
  Develop to edit them - with masks, AI selections, retouching, HDR and panorama merges, a map, print and export.
  Edits happen in scene-referred linear light, in 32-bit floating point, on your graphics card; your originals are
  never changed. No account, no cloud, no telemetry - every AI feature runs on your computer.
