ReleaseNotes: |-
  Release v3.8.6
  Fixed:
  - rename: parse the actual two-line Windows shim format (@echo off / quoted path on the next line) instead of a format that never matched real shims, which made every Windows 'wenget rename' fail with 'Failed to parse shim target from: ...'.
  - rename: aggregate commands across every variant package sharing a repo name, so 'wenget rename' offers an interactive selector instead of silently operating on an arbitrary variant; ambiguous direct-mode renames now error instead of guessing.
  - chore: removed a needless-return clippy warning blocking the release quality gate.
