ShortDescription: App management, system maintenance and privacy settings for Windows 11 in one window.
Description: |-
  Wingry is a native WinUI 3 app for Windows 11. It installs, updates and removes apps through the official winget COM API,
  cleans up memory and disk space, manages startup apps and services, and applies privacy tweaks based on Win11Debloat.
  Tasks that need administrator rights are batched behind a single UAC prompt, and a registry backup is taken before any
  setting changes. The interface is currently in Turkish.
