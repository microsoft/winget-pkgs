ShortDescription: Windows 11 için uygulama yönetimi, sistem bakımı ve gizlilik ayarları tek pencerede.
Description: |-
  Wingry, Windows 11 için yerel bir WinUI 3 uygulamasıdır. Uygulamaları resmî winget COM API'si ile kurar, günceller ve kaldırır;
  belleği ve disk alanını temizler, başlangıç uygulamalarını ve hizmetleri yönetir, Win11Debloat tanımlarıyla gizlilik ayarlarını uygular.
  Yönetici gerektiren işler tek bir UAC onayıyla toplu yapılır; bir ayar değiştirilmeden önce kayıt defteri yedeği alınır.
