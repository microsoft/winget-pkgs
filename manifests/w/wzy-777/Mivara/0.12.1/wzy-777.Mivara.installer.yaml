# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
PackageIdentifier: wzy-777.Mivara
PackageVersion: 0.12.1
Platform:
- Windows.Desktop
MinimumOSVersion: 10.0.18362.0
InstallerType: inno
Scope: machine
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
ElevationRequirement: elevatesSelf
ReleaseDate: 2026-11-12
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/wzy-777/Mivara/releases/download/v0.12.1/Mivara-Setup-0.12.1.exe
  InstallerSha256: F397F9AD07EE5C12116281C5A8907DF1296BBDE0B05D56BD170A352E3D59C72D
  # Unattended installs must not run the VDD task: devcon install triggers the
  # Windows Security "Would you like to install this device software?" dialog
  # (publisher SignPath Foundation), which blocks until the validator times out.
  # /MERGETASKS keeps the other default tasks and only deselects installvdd.
  # The driver can still be installed later with vdd\install_vdd.ps1.
  InstallerSwitches:
    Silent: '/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS="!installvdd"'
    SilentWithProgress: '/SP- /SILENT /SUPPRESSMSGBOXES /NORESTART /MERGETASKS="!installvdd"'
  AppsAndFeaturesEntries:
  - DisplayName: Mivara version 0.12.1
    Publisher: Mivara
    ProductCode: '{8F3C2A61-5D4E-4B7A-9C1F-2B0A6E4D5100}_is1'
ManifestType: installer
ManifestVersion: 1.12.0
