# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.9.0.schema.json
PackageIdentifier: willibrandon.postern
PackageVersion: 0.3.1
PackageLocale: en-US
Publisher: willibrandon
PublisherUrl: https://github.com/willibrandon
PackageName: postern
PackageUrl: https://github.com/willibrandon/postern
License: MIT
LicenseUrl: https://github.com/willibrandon/postern/blob/main/LICENSE
ShortDescription: Language server and checker for PostgreSQL configuration files
Description: |-
  postern reads postgresql.conf, postgresql.auto.conf, pg_hba.conf and
  pg_ident.conf the way the PostgreSQL server does and reports what the
  server would refuse, as a language server for editors and as a command
  that checks the files and exits non-zero when one is wrong.
Tags:
  - postgresql
  - postgres
  - lsp
  - language-server
  - configuration
  - pg-hba
  - linter
  - cli
ManifestType: defaultLocale
