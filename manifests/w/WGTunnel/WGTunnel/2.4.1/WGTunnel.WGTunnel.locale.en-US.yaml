ShortDescription: An advanced, open-source client for WireGuard and AmneziaWG.
Description: WG Tunnel is a desktop client for WireGuard and AmneziaWG with advanced features like auto-tunneling based on network conditions, deferred endpoint bootstrapping for leak-free startup, a system-wide kill switch, split/encrypted DNS, local SOCKS5/HTtP proxy mode, and full AmneziaWG 2.0+ support for censorship resistance.
