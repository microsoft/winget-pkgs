ShortDescription: 'Lighter images, just as good: optimize and convert images to WebP, AVIF, JPEG XL, JPEG and PNG, and vectorize to SVG.'
Description: |-
  Apolo optimizes and converts images on your computer, without uploading them, with the same
  engines as cwebp, cjpeg, oxipng, avifenc and cjxl, and shows what you lose before you save. It
  works on whole folders, vectorizes logos to SVG, PDF, EPS or DXF, and comes with a command line
  and an MCP server for AI agents.
