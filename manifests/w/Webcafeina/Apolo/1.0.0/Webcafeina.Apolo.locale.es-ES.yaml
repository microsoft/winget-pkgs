ReleaseNotes: |-
  Apolo 1.0: imágenes más ligeras, igual de buenas. La primera versión estable. Llega por el
  actualizador.
  English below.
  Qué cambia
  - La 1.0. Apolo ya se ha probado a fondo en macOS, Windows y Linux (GNOME y KDE, en x64 y ARM):
    esta es su versión estable. Nada cambia al comprimir: cada formato sigue dando el mismo fichero,
    byte a byte, que su herramienta oficial.
  - La frase nueva, «Imágenes más ligeras, igual de buenas», en la bienvenida del Estudio, en
    Ajustes › Acerca de, en la línea de comandos, en los paquetes de Linux y en el fondo del .dmg.
  - Una web nueva, apolo.webcafeina.com: sabe qué ordenador tienes
    y te da su descarga, con las capturas de tu sistema; guías con cifras medidas por Apolo (convertir
    a WebP, AVIF o JPEG XL, comprimir sin perder calidad, imágenes para la web, HEIC a JPG, con un
    agente de IA) y comparativas con otras herramientas.
  - Descargas que se pueden comprobar: cada fichero de esta versión lleva su procedencia firmada
    por GitHub, que dice qué compilación lo hizo y desde qué código
    (gh attestation verify <fichero> --repo webcafeina/Apolo), y las páginas de descarga enseñan la
    suma SHA-256 de cada uno.
  - Más seguridad por dentro: las dependencias con avisos de seguridad, actualizadas, y los
    instaladores se firman sin que el código de la interfaz tenga las claves a mano.
  - En el registro oficial de MCP, como io.github.webcafeina/apolo: los agentes de IA y sus
    directorios encuentran Apolo solos.
  Si usas Apolo desde Claude Desktop, ciérralo y vuelve a abrirlo después de actualizar.
