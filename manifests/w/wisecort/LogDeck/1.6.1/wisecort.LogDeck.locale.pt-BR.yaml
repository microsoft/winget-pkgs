# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: wisecort.LogDeck
PackageVersion: 1.6.1
PackageLocale: pt-BR
Publisher: Matheus Corteletti
PackageName: LogDeck
License: MIT
ShortDescription: Explorador de logs de Kubernetes/OKD, somente leitura.
Description: |-
  O LogDeck é um explorador de logs gratuito e de código aberto para Kubernetes e OKD/OpenShift,
  somente leitura. Escolha contexto, namespace e pod, acompanhe o log ao vivo, filtre por nível e
  texto, veja erros e timeouts agrupados, compare com o container anterior, navegue pelos builds do
  OKD e, se quiser, peça para uma IA explicar os erros. O kubectl só roda com verbos de leitura e o
  kubeconfig nunca é alterado.
ManifestType: locale
ManifestVersion: 1.12.0
