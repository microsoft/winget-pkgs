ShortDescription: Read-only Kubernetes/OKD log explorer.
Description: |-
  LogDeck is a free, open-source, read-only log explorer for Kubernetes and OKD/OpenShift.
  Pick a context, namespace and pod, follow the log live, filter by level and text, see grouped
  errors and timeouts, compare with the previous container, browse OKD builds and optionally ask
  an AI to explain errors. kubectl only runs with read verbs and the kubeconfig is never changed.
