ReleaseNotes: |-
  Before this release, switching files with :n and :p always started at
  the top of the file, with no filter.
  With this release, each file remembers its own position, filter, line
  numbers setting and horizontal scroll. If you were following the end
  of a file, you'll still be following it when you come back.
  Marks work across files too. Jumping to a mark takes you back to the
  file you set it in. Like in less, all files share one set of marks.
  Marks also keep pointing at the same line when you change the filter.
  Also in this release:
  - Linux arm64 binaries are now included with releases
  - Pressing v while filtering now opens the editor at the right line.
    Before, it could be thousands of lines off.
  - ' now jumps to marks from the help screen
  - Line numbers are restored properly when leaving help
