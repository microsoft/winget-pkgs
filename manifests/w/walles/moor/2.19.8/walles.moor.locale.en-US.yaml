ReleaseNotes: |-
  Before this release, pressing r, or having the file rewritten on disk,
  took you back to the top of the file, often after flashing an empty
  screen.
  With this release, moor keeps your scroll position when reloading, also
  while filtering, going to a line or viewing help, and it no longer
  flashes an empty screen. Also, r now works even before the file has
  finished loading, and when following a file, a reload brings the new
  contents in at full speed.
  moor also does better at noticing that a file was replaced rather than
  appended to. Before, if a file was replaced by a longer one starting
  with the same bytes, moor could show the old contents with the tail end
  of the new file stuck on. Thanks @prez for
  #479.
  Also in this release:
  - Scrolling right now stops when the longest line on screen is fully
    visible, instead of going on until the screen is empty. Thanks @prez
    for #480!
  - n now finds search hits in filtered lines. Thanks @valvemist for
    reporting #483!
  - When following a file, scrolling up with the mouse wheel now stops
    following and scrolling back down to the end starts it again, like
    with the keyboard
  - With a filter active, a growing last line, like progress output, now
    updates properly
  - Fixed a crash when clearing the filter while a search was running
  - Switching to a file that changed on disk no longer briefly shows its
    old contents
