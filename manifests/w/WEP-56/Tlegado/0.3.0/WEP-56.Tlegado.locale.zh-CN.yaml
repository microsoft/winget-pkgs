ShortDescription: 终端版阅读 3.0：基于 Rust 与 ratatui 的 TUI 小说阅读器。
Description: |-
  TLegado 是终端版阅读 3.0，基于 Rust 与 ratatui，提供优美的 TUI 与完善舒适的交互。它支持 Legado（阅读 3.0）JSON 书源：导入书源后可以进行多源搜索、探索、换源与正文净化，阅读进度、书架分组与阅读偏好会自动保存。
  支持导入本地 TXT 与 EPUB 图书、自定义净化规则（含受限 QuickJS 脚本）、阅读偏好与 Legado readConfig 导入。数据默认保存在用户目录的 .tlegado，可用 TLEGADO_DATA_DIR 或 --data-dir 指定；命令行支持 --import-source、--import-book 等参数。
Tags:
- 书源
- 小说
- 阅读
ReleaseNotes: |-
  Tlegado v0.3.0
  本版本加入老板键、横向翻页、自动翻页与滚动、竖向无缝切章以及听书能力
  主要更新
  - 新增系统 TTS 听书：
    - Windows 原生 SAPI
    - macOS say
    - Linux espeak-ng
  - 新增听书控制器：
    - p / 空格暂停、继续
    - [ / ] 切换段落
    - { / } 切换章节
    - - / + 调整倍速
    - t 定时停止
    - s 停止听书
  - 听书时禁用文本翻页、滚动和其他阅读快捷键。
  - 当前朗读段落高亮，并自动跟随视口。
  - 新增 TUI 听书设置页面：
    - 系统语音配置
    - HTTP TTS 配置
    - API 密钥和环境变量
    - 自定义请求头和 JSON 请求体
    - 缓存、重试、预取和响应模式
  - 新增 BYOK 网络 TTS：
    - WAV、MP3、FLAC、Ogg
    - 本地缓存
    - 请求取消和有限重试
    - 可选预取
    - JSON Base64 音频响应
      暂无流式支持
  - 完善 Windows、Linux 和 macOS 发布构建配置。
  - 增加听书配置文档和服务商示例。
  - 新增横向翻页模式，支持从左至右或反向，在 设置-阅读偏好内 调整
  - 新增预缓存能力，在设置内可以调整预缓存章节数，最大十章
  - 新增无缝切章能力，仅在竖向阅读下可使用，竖向无限滚动
  - 新增自动翻页、滚动能力，输入“A”开启自动，在设置内可以设置速度
  - 新增老板键，快捷键为 ctrl+Q ，按下后立即切换至一个伪装的动态工作中终端，再次点击退出
  非标准 openai speech 协议配置示例（小米 MIMO）
  MiMo 使用 Chat Completions 接口和 JSON Base64 音频响应，示例配置见：
  docs/examples/tts-mimo-v2.5.json
  其它注意事项
  linux、macos 使用系统 tts 能力未经测试，如不可用欢迎 issues 或 PR
  安装
  下载对应平台的二进制文件，或使用 npm 包：
  npm install -g tlegado
