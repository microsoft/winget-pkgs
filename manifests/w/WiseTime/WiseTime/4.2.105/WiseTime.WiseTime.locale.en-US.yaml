ShortDescription: Automated legal time tracking that records work activity as it happens and turns it into billable narratives.
Description: |-
  WiseTime is automated legal time-tracking software from Anaqua, aimed at law firms and legal teams. The desktop app runs in the background and records work activity automatically, with no manual start or stop, so timesheet administration is removed from the day-to-day workflow. The app requires Windows 10 or later and signs in to the firm's WiseTime timeline.
  Automatic case detection: matter IDs within the automatically generated time logs are detected and tagged to the right case, aided by machine learning so the tagging improves with use.
  AI-generated narratives: the recorded activities are summarized into a description relevant for each client's invoice. A preferences add-on customizes the wording or generates the descriptions in another language.
  Connections: connect to a practice management system to sync matters and send time directly to billing.
  Teams and reporting: connect a team for remote or flexible working, identify revenue-driving cases, take a snapshot of time spent on cases and export posted time data with detailed activity information.
  Privacy by design: individual privacy controls separate work from play, and the publisher states that the data stays private, secure and within the user's control.
