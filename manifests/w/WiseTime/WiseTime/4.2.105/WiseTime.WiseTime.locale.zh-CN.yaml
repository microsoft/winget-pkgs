License: 专有软件
ShortDescription: 自动记录工作活动并生成可计费工时说明的法律计时软件。
Description: |-
  WiseTime 是 Anaqua 推出的自动化法律计时软件，面向律师事务所和法律团队。桌面应用在后台运行，自动记录工作活动，无需手动开始或停止，从而省去日常填写工时表的负担。应用需要 Windows 10 或更高版本，登录后即可接入事务所的 WiseTime 时间线。
  自动案件识别：自动生成的工时记录中会识别事务编号并归类到对应案件，并借助机器学习不断提升准确度。
  AI 生成说明：把记录到的活动汇总为适合写入每位客户账单的说明；还可通过偏好设置加以自定义，或用另一种语言生成说明。
  系统连接：连接案件管理与计费系统，同步事务并直接把工时送入账单流程。
  团队与报表：支持远程与弹性协作，识别创收案件，查看各案件耗时概览，并导出包含详细活动信息的已入账工时数据。
  隐私优先设计：提供个人隐私控制以区分工作与生活；发行方声明数据保持私密、安全并由用户掌控。
