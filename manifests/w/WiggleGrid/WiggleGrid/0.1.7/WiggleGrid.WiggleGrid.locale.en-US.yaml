ShortDescription: Organize your iPhone Home Screen on your Windows PC.
Description: |-
  WiggleGrid connects to your iPhone with a USB cable and shows every Home Screen page and the Dock side by side on your PC. Drag apps between pages, folders and the Dock, make and rename folders, reorder pages, send apps to the App Library and delete several apps at once. Review the list of changes, then apply them in one step. A snapshot of your layout is saved first, with one-click restore.
  The download and the compatibility check are free; applying changes needs a one-time purchase.
  Needs Apple's free Apple Devices app (or iTunes) so Windows can talk to the iPhone. Not affiliated with Apple.
