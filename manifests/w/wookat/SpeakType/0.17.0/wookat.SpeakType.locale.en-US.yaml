ShortDescription: Hold-to-talk voice typing for Windows with offline speech recognition.
Description: SpeakType lets you hold a hotkey, speak, and have the recognized text typed into whatever app has focus. Speech recognition runs fully offline by default (SenseVoice, Parakeet, or whisper.cpp models with one-click download), or you can bring your own key for OpenAI-compatible cloud providers. It learns vocabulary corrections from your later edits and can use your phone as a remote microphone.
