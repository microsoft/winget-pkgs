ShortDescription: Scan, clean, protect and organize your Windows PC. Nothing changes until you confirm.
Description: |-
  W-Guard is a free, open-source Windows 10/11 tool with an Arabic and English interface.
  It runs a read-only full scan of drives, programs, games and startup items, rates the PC's health out of 100,
  and explains every suggestion. Deletions go to the Recycle Bin, every action is logged and can be undone.
  It lists Steam, Epic and Xbox games with size and last played date, rates autostart and scheduled-task risk,
  advises on startup programs, cleans temp and cache files, and sorts the desktop into folders with an undo button.
  No ads, no telemetry.
