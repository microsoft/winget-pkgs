ReleaseNotes: |-
  Bug Fixes
  This release fixes quite a few vulnerabiliteis. This is due to an internal review and a recent trend in AI-assisted vulnerability reports from outside researchers. See issue 21638 for details.
  - wnpa-sec-2026-111 RTSE protocol dissector crash. Issue 21585. CVE-2026-130469.
  - wnpa-sec-2026-112 NBAP protocol dissector crash. Issue 21630, Issue 21632. CVE-2026-130468.
  - wnpa-sec-2026-113 PEAK CAN TRC file parser crash when built with older versions of GLib. Issue 21500, Issue 21609. CVE-2026-130467.
  - wnpa-sec-2026-114 ERF file parser crash. Issue 21635. CVE-2026-130466.
  - wnpa-sec-2026-115 Ascend file parser large loop. CVE-2026-130465.
  - wnpa-sec-2026-116 MsgPack and NNTP protocol dissector crashes. Issue 21746. CVE-2026-130464.
  - wnpa-sec-2026-117 Android Logcat file parser crash. Issue 21639. CVE-2026-130463.
  - wnpa-sec-2026-118 Multiple protocol dissector and file parser hangs. Issue 21747. CVE-2026-130462.
  - wnpa-sec-2026-119 IEEE 1609.2 protocol dissector crash. Issue 21640. CVE-2026-130461.
  - wnpa-sec-2026-120 Multiple protocol dissector crashes. Issue 21749. CVE-2026-130460.
  - wnpa-sec-2026-121 Tektronix K12xx file parser large loop. CVE-2026-130459.
  - wnpa-sec-2026-122 IrDA protocol dissector crash. Issue 21658. CVE-2026-130458.
  - wnpa-sec-2026-123 Matter protocol dissector crash. Issue 21675. CVE-2026-130457.
  - wnpa-sec-2026-124 ERF file parser crash. Issue 21682. CVE-2026-130456.
  - wnpa-sec-2026-125 Kafka protocol dissector infinite loop. Issue 21684. CVE-2026-130455.
  - wnpa-sec-2026-126 IEEE 1905 protocol dissector crash. Issue 21683. CVE-2026-130454.
  - wnpa-sec-2026-127 OpenWire protocol dissector crash. Issue 21676. CVE-2026-130453.
  - wnpa-sec-2026-128 USB-PTP protocol dissector crash. CVE-2026-130452.
  - wnpa-sec-2026-129 Multiple protocol dissector infinite loops. Issue 21752. CVE-2026-130451.
  - wnpa-sec-2026-130 Multiple protocol dissector crashes. Issue 21753. CVE-2026-130450.
  - wnpa-sec-2026-131 TLS protocol dissector memory leak. Issue 21693. CVE-2026-130449.
  - wnpa-sec-2026-132 Exported PDU protocol dissector crash. Issue 21695. CVE-2026-130448.
  - wnpa-sec-2026-133 Exported PDU protocol dissector crash. Issue 21702. CVE-2026-130447.
  - wnpa-sec-2026-134 ACN protocol dissector crash. Issue 21754. CVE-2026-130446.
  - wnpa-sec-2026-135 Multiple protocol dissector crashes and infinite loops, and memory leaks. Issue 21755. CVE-2026-130445.
  - wnpa-sec-2026-136 Multiple protocol dissector crashes. Issue 21757. CVE-2026-130442.
  - wnpa-sec-2026-137 Multiple protocol dissector crashes. Issue 21758. CVE-2026-130443.
  - wnpa-sec-2026-138 Multiple protocol dissector crashes. Issue 21759. CVE-2026-130440.
  - wnpa-sec-2026-139 Multiple protocol dissector crashes. Issue 21760. CVE-2026-130439.
  - wnpa-sec-2026-140 Dissection engine crash. Issue 21726. CVE-2026-130441.
  - wnpa-sec-2026-141 Multiple protocol dissector crashes. Issue 21762. CVE-2026-130438.
  - wnpa-sec-2026-142 PROFINET protocol dissector crash. Issue 21745. CVE-2026-130444.
  - wnpa-sec-2026-143 Multiple protocol dissector crashes. Issue 21763. CVE-2026-130437.
  - wnpa-sec-2026-144 Multiple protocol dissector memory leaks. Issue 21764. CVE-2026-130436.
  - wnpa-sec-2026-145 SDP protocol dissector crash. Issue 21696. CVE-2026-130435.
  - wnpa-sec-2026-146 Protocol dissector crashes. Issue 21768. CVE-2026-130434.
  - wnpa-sec-2026-147 SCTP protocol dissector heap disclosure. Issue 21712.
  - wnpa-sec-2026-148 iLBC audio codec crash. Issue 21779.
  - wnpa-sec-2026-149 AMR audio codec crash. Issue 21772.
  The Windows and macOS installers now ship with brotli 1.2.1, which fixes CVE-2026-111497.
  The following bugs have been fixed:
  - Lua exception handling crash. Issue 20767.
  - There’s a mismatch between what FindSinsp.cmake does and how code that includes sinsp.h includes that header. Issue 20792.
  - make-enums.py breaks the Lua FPM test on Windows. Issue 20963.
  - Falco Events plugin shouldn’t open the capture file in parallel. Issue 21014.
  - ZDI-CAN-32851: Wireshark LoRaWAN Decryption Numeric Truncation Error Remote Code Execution Vulnerability. Issue 21520.
  - Endpoint map now requires API key. Issue 21578.
  - NRPPA: Id-TRP-MeasurementReportList (43) Open Type value not dissect although IE is identified. Issue 21615.
  - IKEv2 dissector does not display field names for Additional Key Exchanges from RFC 9370. Issue 21616.
  - E2AP: Assignment used where equality comparison meant. Issue 21646.
  - Wiretap Aethra reader stores skipped records in packet buffer on first pass. Issue 21654.
  - NAS-EPS: ciphered messages are dissected as plaintext when no EEA2 key is set (regression since ae7dfd0e) Issue 21671.
  - BLF reading out of canfdmessage and canfdmessage64. Issue 21714.
  - BLF: 802.1p tag with all 0 is lost. Issue 21717.
  - Packet list: KDE Breeze style always draws packet separator, vertical alignment not centered. Issue 21735.
  New and Updated Features
  - The Windows installers now ship with Npcap 1.89. They previously shipped with Npcap 1.88.
  New Protocol Support
  There are no new protocols in this release.
  Updated Protocol Support
  Too many protocols have been updated to list here.
  New and Updated Capture File Support
  Too many capture file formats have been updated to list here.
  New and Updated File Format Decoding Support
  There is no new or updated file format support in this release.
  Plugin Development Changes
  On UN*X systems (excluding macOS when running from an app bundle, as with the official installer) extcap binaries are now searched for under the libexec directory by default, e.g., /usr/libexec/wireshark/extcap instead of /usr/lib64/wireshark/extcap or similar. This is the customary place for helper binaries, which as opposed to libraries do not need multiarch support. The location can be overridden via the environment variable WIRESHARK_EXTCAP_DIR. The extcap binaries shipped with Wireshark are installed in the new location, but third party extcaps may need packaging changes. This change was effective in version 4.6.0, but was not explicitly noted in the release notes previously. Note that some distributions do not use a libexec directory, such as Alpine Linux, which does not have multilib support. On such systems extcap binaries should be in the same location as before.
