ShortDescription: Manage .env files — validate, scan for secrets, convert formats, and sync them end-to-end encrypted
Description: |-
  evnx is a local-first CLI for .env files: validate syntax, scan for committed credentials and for keys a build would publish to the browser, and convert to 14 deployment formats.

  It also syncs them through evnx cloud, end-to-end encrypted: values are encrypted on your machine under a key derived from your master password, so the server stores only ciphertext and cannot read them. Vaults can be shared, and revoking a member rotates the key and re-encrypts every version.
