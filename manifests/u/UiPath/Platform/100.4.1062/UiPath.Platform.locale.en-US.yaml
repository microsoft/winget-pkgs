ShortDescription: Installs UiPath desktop clients and keeps them current through automatic, incremental updates.
Description: |-
  UiPath Platform Installer is a lightweight tool that installs the UiPath desktop clients and keeps them current through automatic, incremental updates. Instead of redistributing a full installer for every release, it downloads only the changes between versions and applies them in the background.
  The installer is small (around 10 MB). After the first installation, it manages the lifecycle of the desktop clients on the machine: checking for new versions, downloading updates in the background, and applying them with minimal disruption.
  A single installer maintains the full set of UiPath desktop clients: Studio, Robot, Assistant, Delegate, and browser extensions. Because one installer covers all of these clients, their versions stay aligned and are governed together rather than installed and patched separately.
  Compared with redistributing the classic MSI for every release, the UiPath Platform Installer updates unattended robots without interrupting jobs, requires no per-release redistribution, keeps every desktop client in step even on machines not connected to Orchestrator, behind a proxy, or served from an internal mirror, and enforces version control for regulated environments through Enterprise LTS channels that let IT pin a maximum version by policy.
  This installer pre-selects the Enterprise LTS update channel (26.10 line). On the LTS channel, automatic updates are off by default, so machines stay on the installed version until an administrator turns automatic updates on or deploys a newer patch.
