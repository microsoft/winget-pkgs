ShortDescription: 安装 UiPath 桌面客户端，并通过自动增量更新使其保持最新。
Description: |-
  UiPath Platform Installer 是一个轻量级工具，用于安装 UiPath 桌面客户端，并通过自动增量更新使其保持最新。它无需为每个版本重新分发完整的安装程序，只下载版本之间的变更内容，并在后台应用。
  安装程序体积较小（约 10 MB）。首次安装后，它将管理计算机上桌面客户端的生命周期：检查新版本、在后台下载更新，并以最小的中断应用更新。
  单个安装程序即可维护整套 UiPath 桌面客户端：Studio、Robot、Assistant、Delegate 和浏览器扩展程序。由于所有客户端由同一个安装程序维护，它们的版本保持一致并受统一治理，无需单独安装和修补。
  与为每个版本重新分发传统 MSI 相比，UiPath Platform Installer 无需中断作业即可更新无人值守的机器人，无需按版本重新分发安装程序，能让所有桌面客户端保持版本一致（包括未连接到 Orchestrator、位于代理之后或使用内部镜像的计算机），并通过允许 IT 按策略固定最高版本的 Enterprise LTS 渠道为受监管的环境实施版本控制。
  此安装程序在安装时预选 Enterprise LTS 更新渠道（26.10 版本线）。在该渠道上，默认关闭自动更新，计算机将保持在已安装的版本，直到管理员开启自动更新或部署更新的补丁。
