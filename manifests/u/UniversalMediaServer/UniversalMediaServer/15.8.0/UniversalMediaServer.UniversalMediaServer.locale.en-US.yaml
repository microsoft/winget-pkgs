ReleaseNotes: |-
  tools-before-after
  Here are some new features, fixes, and design improvements!
  The highlights in this release are:
  - Added a backup and restore feature
  - Added a delete thumbnails feature
  - Improved design of Tools section
  - Improved support for LG TVs
  - Added support for nextCP/2 renderer
  multiDiskSupport
  We recently lost our only project sponsor, so please consider joining the Sponsor tier on Patreon if that is within your means. We will link to your website with your logo on our front page and readme file. Our website got around 7 million unique hits in the last month.
  Full changelog:
  General
  - Added feature to backup and restore personal data including fully played statuses, bookmarks, playback positions and play counts
  - Added feature to delete thumbnails to allow them to be recreated
  - Improved design of the Tools section
  - Improved speed of file hashing
  - Improved video filename parsing
  - Fixed advanced filtering via UPnP (#6183)
  Media players
  - Added LG TV support for FLAC audio in videos and audio files
  - Added support for nextCP/2
