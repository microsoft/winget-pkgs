ReleaseNotes: |-
  Inkling Fine-tuning
  You can now fine-tune Inkling 2 Mini 1.8 to 3.1x faster and use 50% less VRAM in Unsloth with LoRA or QLoRA, then export it to GGUF or a merged 16-bit model. It trains on Kaggle's free 2x T4 and now supports tensor, pipeline and context parallel across GPUs. Also new: faster adamw_8bit steps, faster Z-Image LoRA training on T4 and fixes for thinking models in chat.
  Highlights
  - Bug fixes for finetuning Inkling 2 Mini + other bugs, MXC sandbox upgraded
  - Fine-tune Inkling 2 Mini 3x faster + 50% less VRAM in Unsloth Desktop. Guide
  - Faster Inkling 2 Mini inference Fixed incorrect max context length (2-3x faster inference)
  - Faster adamw_8bit up to 12% less time per step on small batches
  - Z-Image LoRA training on T4 1.7x faster per step
  - unsloth eval on chat fine-tunes now scores your own datasets in the model's chat format
  Inkling 2 training
  - Train Inkling 2 Mini with LoRA or QLoRA, including the vision layers. It fits on Kaggle's 2x T4 at about 26 s per step, but not on a single 15 GB T4.
  - Inkling 2 Small is supported too but needs about 290 GB of GPU memory in 4-bit.
  - save_pretrained_merged with merged_16bit and save_pretrained_gguf now work for Inkling 2. merged_4bit is still not supported.
  - A fine-tuned Inkling 2 Mini exports to a 17.5 GB q4_k_m GGUF that runs in llama.cpp. The export needs about 150 GB of free disk, so use a Colab A100 instead of Kaggle.
  - On NVIDIA Ampere or newer GPUs, Inkling 2 training uses FlexAttention, about 15% faster per step on L4.
  Training
  - optim = "adamw_8bit" now updates each parameter group in one step, up to 12% less time per step on L4 with small batches.
  - GRPO rollouts with a 16-bit LoRA decode about 20% faster per token on L4.
  - Native FSDP2 full fine-tuning takes 17 to 21% less time per step on 2x T4.
  - AsyncGRPO tree packing now also covers Mamba2 models such as Nemotron-H and Granite-4.0-H, and LFM2, with newer TRL.
  - Left-padded training batches no longer let pad positions see future tokens.
  - unsloth eval on a chat fine-tune with your own .jsonl, .json or .csv dataset no longer scores near 0.
  - After add_new_tokens on a tied-embedding model, merged and GGUF exports no longer drop the trained lm_head.
  - Phi-3 and Phi-3.5 training text now ends with the EOS token again.
  - Chat datasets with custom keys such as speaker and text no longer get role and content swapped.
  Images + video
  - Z-Image LoRA training on T4 is 1.7x faster per step.
  - On 24 GB GPUs, MiniMax-H3-Image now denoises the images of a multi-image request together instead of one by one.
  - MiniMax-H3 video re-renders with the same reference clip or keyframe skip re-encoding it.
  - FLUX.3 Klein base has an opt-in Fast CFG switch, about 10% faster renders with a small image change.
  - On AMD Strix Halo, FLUX.2 klein 4B LoRA training takes about 11% less time per step.
  - Krea 2 no longer gets killed while loading on T4 machines with limited RAM.
  Chat + Desktop
  - unsloth start --continue reopens your last agent session on the same model and settings.
  - Inkling 2 Mini no longer freezes laptops with 8 GB of VRAM and 16 GB of RAM after a few chats.
  - Thinking models no longer get their reasoning cut short a few turns into a chat.
  - A deleted chat turn no longer comes back when the same chat is open in another tab.
  - Applying a chat preset no longer clears your custom chat template.
  - On Linux with NVIDIA drivers 590 and newer on X11, chat scrolling in Unsloth Desktop is smooth again.
  - Settings > System and Engine > Compute backend now greys out a backend it cannot run and says why.
  - The Linux installer now gives the RX 9060 XT ROCm torch instead of CPU torch.
  Bug Fixes and Hardening
  - Many bugs are also fixed, and many updates are provided to harden unsloth and unsloth-zoo!
