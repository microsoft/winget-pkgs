ShortDescription: The first desktop app to run and train AI models locally.
Description: Unsloth Desktop is the first desktop app to run and train AI models locally, with research, export and deployment from the same open-source app on Windows, macOS and Linux. Run and train LLMs and diffusion models including Kimi K3, MiniMax-H3, Gemma 4, Qwen3.8 and DeepSeek-V4 Flash 0731, with self-healing tool calling, sandboxed code execution, private web search, Deep Research, RAG, MCP and an OpenAI-compatible API.
