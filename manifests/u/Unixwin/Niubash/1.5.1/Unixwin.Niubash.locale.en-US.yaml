ReleaseNotes: |-
  - Windows interactive login shells read ~/.niubashrc again (#1057): --login/-l no longer diverts the interactive startup face onto the GNU profile chain
  - Deep-audit host fix wave: seven non-interactive host findings fixed (#886), including corrupt plugin-spec errors now naming the file and the cause, and frozen interactive config specs re-applied on setup re-run (#891)
  - Engine and bundled-commands line rises to 1.5.1: rubash v1.5.1 (the 703-issue GNU Bash 5.3.20 differential wave), ruline 4d0aefa8, and bundled WinuxCmd v1.2.2; also bind -x conhost chord dispatch (#1065) and the env.exe distribution fix (#1062)
