ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - The factory prompt is a Git Bash compatible two-row skeleton: green
    user@host, yellow POSIX cwd, parenthesized branch with dirty star -
    rendered in-process from .git state (~2.5ms warm, no git child per
    prompt), with the theme gallery and oh-my-bash/bash-it claims still
    winning when set
  - TAB completion shows the candidates at once as a multi-per-row grid;
    the literal GNU readline shape and the VS Code-style popup remain
    opt-in (NIU_COMPLETION_STYLE=gnu / ide, or the setup wizard step)
  - Interactive paste buffers whole chunks until Enter (no auto-execution
    mid-paste), and the burst-Enter after a paste is no longer swallowed
  - Self-update verifies the installer against a SHA-256 sidecar before
    running; the pre-install toolchain bundle is pinned per release
  - Every release now gates on the golden user journey (real ConPTY
    wizard/prompt/plugin walks) and a per-asset timing budget across all
    437 themes and plugins of the trusted sources
  - Engine wave: 83/83 GNU compatibility suite byte-clean, help/version
    fork to the GNU forms under bash/sh invocation names, -s stdin
    consumes on demand like GNU
ReleaseNotesUrl: https://github.com/unixwin/niubash/releases/tag/v1.4.0
