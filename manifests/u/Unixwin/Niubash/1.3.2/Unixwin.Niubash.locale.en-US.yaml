ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - First three-platform release: Linux (x86_64/aarch64) and macOS
    (arm64/x86_64) portable tarballs join the Windows packages; every
    platform's build is smoke-verified on its own OS before shipping
  - Alias-expansion corruption closed for compound array assignments
    and [[ ]] / extglob pattern words (the bash_completion line-1376
    interactive syntax error)
  - Single-quoted integrity through pipelines and command substitutions;
    cat -n numbers pipe input; interactive cd reaches external children;
    -c subshell fatal expansions exit 1 like GNU
  - Journey-found fixes: same-name themes route to the owning framework
    and actually apply; curated recipe entries pinned to upstream roots;
    failed collection applies journal honestly; the golden user journey
    now gates every release
ReleaseNotesUrl: https://github.com/unixwin/niubash/releases/tag/v1.3.2
