ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - Interactive multi-line groups no longer wedge the REPL: a stray ) inside an open group ends the gather with a single GNU-style diagnostic and rc 2 (rubash#955 + #484; #482)
  - Bare drive designators (D:, cd D:) converge on the engine dispatch across the host fast path, grouped route, and piped niu -i (rubash#953; #481, #483)
  - unset of an inherited environment name now clears the process-env copy, realigned to GNU across a 9-probe matrix (rubash#943; #917)
  - Launcher accepts -EncodedCommand / --ec spellings for the verbatim base64 handoff, with v1: rewrite-guard semantics preserved (#477)
  - niu --help and --version close with the unixwin portal lines (#490)
  - Installer-surface guards hardened: constant-fold coverage for {syswow64}/{sysnative}/{autocf} and {sys} name-boundary enforcement, pinned by test (#472)
  - Vendored bash upgraded from Bash-5.3 patch 15 to patch 20 (rubash#957)
  - Carries WinuxCmd v1.1.19 (gawk BINMODE argv-prefix adapter) and the rubash 1.4.2 engine
ReleaseNotesUrl: https://github.com/unixwin/niubash/releases/tag/v1.4.3
