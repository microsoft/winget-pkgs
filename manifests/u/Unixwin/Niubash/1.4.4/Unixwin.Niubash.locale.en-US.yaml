ShortDescription: AI-native Bash-compatible shell for Windows
Description: >-
  Niubash is a native Windows shell that runs Bash-compatible commands without
  WSL or a virtual machine. It includes the rubash language engine, Unix
  commands from WinuxCmd, a git-aware prompt, and a plugin system.
Moniker: niu
Tags:
  - bash
  - command-line
  - shell
  - terminal
  - windows
ReleaseNotes: |-
  - ping/netstat/tracert are reachable again: System32 ships them with UPPERCASE on-disk names (PING.EXE etc.) and the engine's byte-exact stem contract rejected lowercase invocations; the PATH fold arm now compares the stem ASCII-case-insensitively (rubash#998/#1000)
  - Interactive crash on ${v^^} / ${v:1:3} input fixed in the same engine (niubash#503)
  - MSIX packaged builds no longer silently degrade when a stale WINUXCMD_PATH/WINUXSH_ROOT from an old NSIS install is inherited (#504/#505)
  - Installer and shell startup now reconcile the bundled gawk.exe/awk.exe shims to the current winuxcmd.exe (#468 residue)
  - Carries WinuxCmd v1.1.20 and the rubash 1.4.3 engine
ReleaseNotesUrl: https://github.com/unixwin/niubash/releases/tag/v1.4.4
