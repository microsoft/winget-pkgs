ShortDescription: Бесплатный настольный ИИ-чат для Windows с доступом к файлам, терминалу, git и MCP-серверам.
Description: NChat (NeuralChat) — бесплатное настольное приложение для работы с языковыми моделями. Модель работает с компьютером напрямую - читает, ищет и правит файлы в папке проекта, выполняет команды, управляет git и подключает внешние инструменты по MCP. Параллельные чаты и превью HTML, SVG и Mermaid. Действия, которые пишут файлы или запускают процессы, сначала спрашивают разрешения.
