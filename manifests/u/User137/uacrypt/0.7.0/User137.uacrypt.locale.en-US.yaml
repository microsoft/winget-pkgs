ShortDescription: Command-line tool for Ukrainian DSTU cryptographic standards (Kalyna, Kupyna, Strumok)
Description: |-
  uacrypt encrypts, decrypts, hashes and signs files with the Ukrainian DSTU standards: Kalyna (DSTU 7624:2014), Kupyna (DSTU 7564:2014), Strumok (DSTU 8845:2019), DSTU 4145-2002 signatures and DSTU 9041:2020 public-key encryption.
  Modes, nonces and parameters are fixed, in the spirit of libsodium, so there is nothing to misconfigure.
  Pre-release, not independently audited.
