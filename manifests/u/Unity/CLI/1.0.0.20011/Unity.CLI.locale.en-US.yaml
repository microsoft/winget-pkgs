ShortDescription: Command-line interface for installing Unity Editors and creating, opening, and building Unity projects.
Description: The Unity CLI (invoked as "unity") manages Unity Editor installations and modules, creates and opens projects, runs builds and Editor commands, and manages licenses and cloud sign-in from the terminal. This build reports its version as 1.0.0-beta.11; MSIX package versions encode the prerelease channel in the fourth (revision) field.
Moniker: unity-cli
Tags:
- cli
- command-line
- unity
- unity3d
ReleaseNotes: |-
  Highlights of 1.0.0-beta.11 (full notes at the release notes URL):
  - unity recompile checks that your scripts compile in a running Editor, without a full build.
  - unity docs <topic> opens the Unity documentation for a class or topic, matched to your project's Unity version.
  - unity assets import <file.unitypackage> imports a .unitypackage into a project.
  - unity assets export <asset-path...> --output <file.unitypackage> exports assets and folders to a .unitypackage.
  - unity cloud org create <name> creates a Unity Cloud organization.
  - unity pipeline cloud-build and unity pipeline automation list and inspect Unity Build Automation targets and builds, and Unity Pipeline Automation apps, pipelines, and jobs.
  - unity mcp configure --server issue-tracker adds the Unity Issue Tracker MCP server to your AI client.
  - unity run --log-file <path> writes the Editor log to a file, including with --command, and streams it to the console like unity build.
ReleaseNotesUrl: https://docs.unity.com/unity-cli/release-notes
