- unity3d
ReleaseNotes: |-
  Highlights of 1.0.0-beta.11 (full notes at the release notes URL):
  - Security: unity bug now redacts the log files it collects before it uploads a report, masking home-directory paths, token-shaped values, and email addresses.
  - Security: on Linux, extracting a .pkg module no longer writes through a symlink that already exists at its destination, and the hardened auth-broker tier refuses to start when its token store or polkit consent policy isn't properly isolated.
  - Privacy: unity license activate now files a licensing compliance record whether or not you opt in to analytics. It contains your Unity ID and the activation details, and no credential, serial number, file path, or project name.
  - Privacy: the anonymous usage ping now also records how the CLI was run and the project's Unity version. It still contains no account, machine identifier, session, IP address, or file path.
  - unity recompile checks whether your scripts compile in a running Editor, without a full build. It exits 6 on compile errors and 7 when it can't reach an Editor.
  - unity assets export and unity assets import write and import .unitypackage files from the command line.
  - unity docs <topic> opens the Unity documentation page for a class or topic, matched to your project's Unity version.
  - unity cloud org create creates a Unity Cloud organization, and unity pipeline cloud-build and unity pipeline automation read Unity Build Automation and Unity Pipeline Automation.
  - unity run --log-file writes the Editor log to a file, and unity mcp configure --server issue-tracker configures the Unity Issue Tracker MCP server.
  - Fixes include compressed WebGL builds served by unity build run, a Windows uninstall that now names the folder it couldn't remove, piping install.ps1 into PowerShell no longer closing the window on failure, and connections to hosts with several addresses or to IPv6-only local proxies.
ReleaseNotesUrl: https://public-cdn.cloud.unity3d.com/hub/prod/cli/1.0.0-beta.11/CHANGELOG.md
