ReleaseNotes: |-
  Highlights of 1.0.1 (full notes at the release notes URL):
  - unity mcp --tools and --exclude-tools accept a whole Editor command group by name, such as --tools editor_playmode, to allow or hide every command in that group.
  - unity logs --format ndjson now ends with the same paging fields as other listings (total, nextPage, partial) in its final result line.
  - The new-unity-project agent skill now ends project creation with a playable game instead of a lit empty scene: after the first commit it builds at least one playable loop (a goal, a way to win or lose, and a restart, or the shape you asked for, such as a sandbox) and scores it with the craft-game-floors done gate, before the publish step.
  - unity analytics status, unity skill install, the summary lines of unity projects report and the signed-out message of unity cloud now print their intro, tip and refusal lines on stderr instead of stdout, so --quiet no longer changes what stdout holds.
  - unity commands --format json and --format ndjson now give every command a path key, the full command path such as analytics opt-in, so the path column of --format tsv names a key in the JSON output.
  - --format tsv (the default when output is piped) now starts with a key and value header row, then one row per field, for unity version, unity --version --format tsv, unity config get, set, unset, path, resolve and update-check, unity cache key, unity language, and unity upgrade with --check or --dry-run.
  - unity upgrade --format ndjson with --check or --dry-run, or when the CLI is already up to date, prints one result frame with the same fields as --json, where it used to print a tab-separated row.
  - --format tsv (the default when output is piped) now starts with a header row for unity editors, unity cloud org current, unity auth token, unity license, unity doctor --ci, unity docs --url, unity assets export and the unity command dialog answer; --no-header leaves it out.
