ReleaseNotes: |-
  Highlights of 1.0.0-beta.16 (full notes at the release notes URL):
  - In Unity Editor versions that support it, unity command editor dialog shows the modal dialog the Editor is waiting on, and unity command editor dialog answer <id> <button> presses one of its buttons, even while the dialog blocks the Editor.
  - unity skill sync [client] installs or updates one AI client's Unity skills without prompting, keeping any copy you edited.
  - When an AI agent runs unity and its Unity skills are older than the CLI's pin, the CLI suggests unity skill sync <client> once a day.
  - unity setup vscode installs the Unity skills for VS Code and prints how to add the Unity plugin there with Chat: Install Plugin from Source.
  - unity skill install now supports Google Antigravity (antigravity) and Qwen Code (qwen).
  - unity projects create gives every project linked to a cloud project a liveops_enabled kill switch in Remote Config, set on the server and never in a file, so live features can be turned off from the Unity Dashboard without a new build.
  - unity projects create adds Cloud Save and one save slot for the signed-in player to every project linked to a cloud project.
  - unity build --target now builds through the Unity Editor that already has the project open instead of refusing, and switches that Editor's active build target; --timeout and Ctrl+C stop waiting without closing the Editor or stopping its build.
ReleaseNotesUrl: https://public-cdn.cloud.unity3d.com/hub/prod/cli/1.0.0-beta.16/CHANGELOG.md
