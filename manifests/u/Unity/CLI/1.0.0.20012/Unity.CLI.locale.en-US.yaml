- unity
- unity3d
ReleaseNotes: |-
  Highlights of 1.0.0-beta.12 (full notes at the release notes URL):
  - unity projects create --with-pipeline adds the Pipeline package (com.unity.pipeline) to the new project, so an AI agent can drive the Editor as soon as it opens, without a separate unity pipeline install.
  - unity status --format json shows whether a game in Play mode is actually running.
  - unity install, unity install-modules and unity projects require accept --no-wait and --wait-timeout <seconds> for when the Hub or another CLI is already installing.
  - Experimental, unsupported: on a Linux arm64 host you can opt in to running the x86_64 Unity Editor under FEX-Emu by setting UNITY_EXPERIMENTAL_FEX_EMU=1.
  - A registry plugin's published version can now state the minimum version of a runtime it needs.
  - unity commands --grep <pattern> searches the CLI's commands and its plugin catalog by keyword, so you can find the command for a task without paging through --help.
  - unity plugin list now shows a short description of what each plugin does, in every format (human, --format json, and --format tsv), whether or not it's installed.
  - unity plugin install, unity plugin upgrade, unity plugin list and unity doctor now say where each runtime a plugin uses came from: machine for a copy that was already on your computer, package-manager for one installed through Homebrew, winget, apt or dnf, and managed for the Unity CLI's own download.
