ShortDescription: Command-line interface for installing Unity Editors and creating, opening, and building Unity projects.
Description: The Unity CLI (invoked as "unity") manages Unity Editor installations and modules, creates and opens projects, runs builds and Editor commands, and manages licenses and cloud sign-in from the terminal. This build reports its version as 1.0.0-beta.4; MSIX package versions encode the prerelease channel in the fourth (revision) field.
Moniker: unity-cli
Tags:
- cli
- command-line
- unity
- unity3d
ReleaseNotes: |-
  Highlights of 1.0.0-beta.4 (full notes at the release notes URL):
  - unity build no longer requires --execute-method: build a Build Profile with --profile on Unity 6+, or a desktop target with --target and --output-path on any version.
  - Multi-account sign-in: unity auth login adds an account, and auth list/switch/logout manage them; unity auth default pins an account to a project.
  - unity projects exec runs one command across every registered project, with --filter, --parallel, and --continue-on-error.
  - Disk cleanup: unity projects clean, unity editors prune, and unity editors verify report before they delete.
  - unity test emits CI-native reports and code coverage; Editor commands can run detached via --detach with unity job wait/status/cancel.
  - MSIX installs now update themselves through unity upgrade, downloading only the changed parts of the package.
ReleaseNotesUrl: https://public-cdn.cloud.unity3d.com/hub/prod/cli/1.0.0-beta.4/CHANGELOG.md
