ReleaseNotes: |-
  Highlights of 1.1.0 (full notes at the release notes URL):
  - unity pipeline install and unity pipeline upgrade now also install or update the unity-pipeline agent skill, for the agent running the command and for every client that already has a Unity skill.
  - unity skill refresh installs the unity-pipeline agent skill for each client with a global unity-cli skill that never had it, unless it was disabled.
  - unity command --help ends with a tip naming unity skill install <client> --skill unity-pipeline while the unity-pipeline skill is not installed.
  - When an AI agent, or a person at a terminal, runs unity command without the unity-pipeline skill, the CLI suggests unity skill install <client> --skill unity-pipeline once a day, also after a failed run (AGENT_PIPELINE_SKILL_MISSING in the notifications of --format json, for agents).
  - The unity-cli deb and rpm packages install bash, zsh and fish completion scripts, so unity <Tab> completes commands and options after an apt or dnf install without editing your shell profile.
  - unity build --android-debug-key signs an Android build with Unity's debug key and ignores the keystore your Player Settings name, so a build whose signature does not matter needs no keystore, alias or password.
  - unity docs toc --format json and --format ndjson (and --json) add a markdownUrl key to each entry, the page's Markdown variant (.md, served as text/markdown), for the scripting reference and --manual.
  - unity plugin uninstall <id> is an alias of unity plugin remove <id>, to pair with unity plugin install.
ReleaseNotesUrl: https://public-cdn.cloud.unity3d.com/hub/prod/cli/1.1.0/CHANGELOG.md
