ShortDescription: Command-line interface for installing Unity Editors and creating, opening, and building Unity projects.
Description: The Unity CLI (invoked as "unity") manages Unity Editor installations and modules, creates and opens projects, runs builds and Editor commands, and manages licenses and cloud sign-in from the terminal. This build reports its version as 1.0.0-beta.15; MSIX package versions encode the prerelease channel in the fourth (revision) field.
