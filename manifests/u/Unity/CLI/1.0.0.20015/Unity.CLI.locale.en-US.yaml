- unity
- unity3d
ReleaseNotes: |-
  Highlights of 1.0.0-beta.15 (full notes at the release notes URL):
  - unity bug can file an issue against a plugin: --area takes a plugin's name, such as ugs or plastic, and on a terminal the area question offers each plugin you have installed.
  - unity doctor names where each installed plugin writes its logs, under the external components, and as logDirectories in --format json.
  - unity license server health asks your floating license server how it is, directly on its /v1/status endpoint.
  - Plugins now receive what unity knows when it runs them: the output format, whether they may prompt, the current Unity project and its Editor version, the active Unity Cloud organization and project, the signed-in user (never a token), whether a person, a CI system or an AI agent is running it, and the analytics and crash-report settings, as UNITY_CLI_CTX_* environment variables and one UNITY_CLI_CTX_JSON document.
  - unity projects audit opens Project Auditor in your project's running Editor, ready for you to run the analysis.
  - unity setup qwen installs Unity's agent plugin into Qwen Code by running qwen extensions install Unity-Technologies/unity-agent-plugin:unity --consent, then qwen extensions enable unity.
  - unity skill install opencode installs the Unity skills into OpenCode, in ~/.config/opencode/skills, or .opencode/skills with --local.
  - unity install --download-only downloads and verifies an Editor and its modules into the Hub's download folder without installing anything.
ReleaseNotesUrl: https://public-cdn.cloud.unity3d.com/hub/prod/cli/1.0.0-beta.15/CHANGELOG.md
