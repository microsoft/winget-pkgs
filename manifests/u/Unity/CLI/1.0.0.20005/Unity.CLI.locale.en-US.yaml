- cli
- command-line
- unity
- unity3d
ReleaseNotes: |-
  Highlights of 1.0.0-beta.5 (full notes at the release notes URL):
  - unity bug no longer uploads your account name or email address. The log file it attaches records home-directory paths on nearly every line, so on a machine where the account name is your real name, submitting a report sent it. Both are now redacted as each line is written. Logs written before this release are unaffected.
  - A retried module download in unity install-modules resumes the partial file it already has instead of restarting, so a module that fails and succeeds within one run leaves a single file instead of one numbered file per attempt.
  - unity build, unity test, and unity run now report an Editor killed by a signal as "stopped with signal SIGSEGV" instead of "exited with code 1".
  - Routine outcomes stopped suggesting you report a CLI bug: declining a module's license terms, a failing build, and an install waiting on another install's lock are situations, not faults. Messages, exit codes, and the --format json envelope are unchanged.
  - unity --help shows the Unity logo header again.
  - unity completion zsh now produces a script that registers itself with zsh, so Tab completes commands, subcommands, and flags.
ReleaseNotesUrl: https://public-cdn.cloud.unity3d.com/hub/prod/cli/1.0.0-beta.5/CHANGELOG.md
