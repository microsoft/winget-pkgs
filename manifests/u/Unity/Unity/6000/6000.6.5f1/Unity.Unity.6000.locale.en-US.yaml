  6000.6.5f1 Release Notes
  Fixes
  - 2D: Fixed the camera sorting layer texture resolution being affected by the Render Scale setting on the 2D Renderer. (UUM-151723)
  - Android: Fixed system bars not hiding automatically on Android 11 when System Bars Behavior is set to "Show Transient Bars By Swipe". (UUM-149900)
  - Asset Bundles: Fixed a player crash when instantiating a prefab from an AssetBundle that was reached through a reference to a child object of a prefab in another AssetBundle. (UUM-141605)
  - Asset Pipeline: Fixed a crash on Editor shutdown caused by an asset import worker timer callback running after the worker manager was destroyed. (UUM-134447)
  - Asset Pipeline: Fixed a crash when opening a project with a corrupted Library. (UUM-153198)
  - Asset Pipeline: Fixed a random Editor crash on shutdown caused by a data race in the asset database script artifact bookkeeping. (UUM-142994)
  - Editor: Fixed a NullReferenceException thrown when selecting a GameObject in the Hierarchy while the Tool Contexts overlay was displayed but collapsed. (UUM-141529)
  - Editor: Fixed Scene Visiblity Update Issue Without a Scene View (UUM-139553)
  - Editor: Fixed tabs getting stuck when dragging across dock areas (UUM-140149)
  - Editor: Fixed the undo of a drag and drop operation that moved nodes and opened a prefab at the same time. (UUM-148783)
  - Editor: Skip post-build audit when Project Auditor Rules package isn't installed (UUM-152518)
  - GI: Fixed light baking failing when the only Global Illumination contributors in a scene had no materials assigned. (UUM-153676)
  - Graphics: Fix crash when importing Texture2DArrays with small dimensions and many elements (UUM-153670)
  - macOS: Fixed the macOS Editor ignoring internal tick requests while its window was unfocused, which made async and coroutine-based execution run slower than when focused. (UUM-151097)
  - Multiplayer: Fixing the scaling artifacts of the Multiplayer Center window's genre titles in Bitmap rendering mode.
  - Multiplayer: Unity Transport: Correctly recreate UDP sockets on iOS when they are closed by the OS when an application is in the background for a while. Prevents a condition when the driver seemingly stops receiving packets. (UUM-153993)
  - Package Manager: Fixed exporting a signed .unitypackage failing with "IOException: Stream was too long." when the uncompressed package content exceeded 2 GB, and reduced Editor memory usage during package export and signing. (UUM-153848)
  - Profiler: Fix Profiler details view potentially showing info for frames that are no longer present in the timeline. (UUM-150694)
  - Profiler: Fixed an inconsistent seam line between the image and frame number on Profiler Screenshots module thumbnails. (UUM-152561)
  - Profiler: Fixed frame-number labels overlapping in the Screenshots module's timeline view when Game View captures used a narrow aspect ratio. (UUM-152532)
  - Profiler: Fixed the Profiler capture rename field discarding the first click and re-selecting the whole name instead of placing the caret. (UUM-153075)
  - Profiler: Fixed the Troubleshoot Connection Issues button in the Profiler linking to a documentation page unrelated to connection troubleshooting. (UUM-153354)
  - Profiler: Reimplemented an aggregate draw calls counter for profiling
  - Search: ArgumentException thrown when typing ! as the first character in a Search window query (UUM-141246). (UUM-141246)
  - Shaders: Fixed a crash due to an out-of-range value being supplied to Shader global property APIs. (UUM-150856)
  - TextMeshPro: Fixed non-deterministic Addressables bundle hashes caused by a debug symbols pragma in the TMP mobile SDF shaders. (UUM-153225)
  - TextMeshPro: Fixed TextMeshPro input field not removing characters on the first backspace when the text contains variation selectors. (UUM-140383)
  - TextMeshPro: Fixed the "Missing signature" when importing the TMP Examples & Extras package. Both TMP resource packages are now signed by Unity. (UUM-151651)
  - TextMeshPro: Fixed the Editor freezing when a TextMeshPro text with a Content Size Fitter contained a hyphen preceded by a space at narrow widths. (UUM-152921)
  - Timeline: Fixed timeline preview ownership (UUM-137833)
  - UI Toolkit: Fixed a "SelectorAccelerationCache: association already exists" error being logged when a style sheet is attached to a UI Document both directly and through @import. (UUM-151721)
  - UI Toolkit: Fixed a memory leak that grew every frame for elements using the -unity-material style and ended in an OutOfMemoryException. (UUM-150318)
  - UI Toolkit: Fixed a VisualElement with the DynamicTransform usage hint remaining invisible until hovered after an ancestor's scale animated up from zero, when another ancestor used the GroupTransform usage hint. (UUM-140869)
  - UI Toolkit: Fixed IndexOutOfRangeException errors being thrown when redoing actions after changing an element's background colour in UI Builder. (UUM-149395)
  - UI Toolkit: Fixed SVG import errors with nested svg tags. (UUM-150948)
  - UI Toolkit: Fixed text that was set with the TextElement.SetText APIs being lost when the element was removed from a panel and added back. (UUM-148525)
  - UI Toolkit: Fixed the Inspector help button opening a missing documentation page when multiple UI Toolkit elements were selected in the Hierarchy. (UUM-153256)
  - UI Toolkit: Fixed UXML changes saved in UI Builder not appearing in the Game view for a Panel Renderer after Play mode was entered and exited. (UUM-149762)
  - VFX Graph: Fixed an editor crash when repeatedly adding a Visual Effect component to a GameObject and undoing the action. (UUM-136309)
  - Web: Fixed bug where building a WebGL player with both WebAssembly 64 and multithreading enabled would not fail early. (UUM-151065)
  - Web: Fixed WASM_SIZE, wasmFileSize that is used in memory profiler (UUM-149075)
