ReleaseNotes: |-
  Known Issues in 6000.6.4f1
  - 6000.2.0b2: [Vulkan] Crash on SIGSEGV in vkOnscreenSwapChainAcquireNextImage when vkAcquireNextImageKHR returns VK_TIMEOUT (UUM-153744)
  - 6000.3.14f1: [Multiplayer Play Mode] Play Mode Scenario stays in the "Deploying" state when entering Play mode with an additional Editor instance and the Vulkan graphics API (UUM-154645)
  - 6000.6.0a2,6000.5.0b2: Resources.UnloadUnusedAssets() takes significantly longer to execute when run in a Player build (UUM-149540)
  - : Crash on mono_log_write_logfile when more than one copy of bee_backend is running (UUM-142773)
  - : Crash on mono_log_write_logfile when opening specific project (UUM-150566)
  - : [WinEditor] Play Mode framerate drops significantly when moving the mouse cursor with high polling rate (UUM-142550)
  6000.6.4f1 Release Notes
  API Changes
  - Scripting: Added: New public API, Detach(node) and DetachChildren(node) on Hierarchy and HierarchyCommandList. A detached node keeps its data map entry but is unreachable from Root.
  - Scripting: Added: New public API, IHierarchyNodeTypeHandlerViewModelState, and GetOrCreateHandlerState<T>, TryGetHandlerState<T> and DestroyHandlerState on HierarchyViewModel, for node type handler state that belongs to a single view model. HierarchyNodeTypeHandlerBase.SearchBegin, SearchMatch and SearchEnd gained overloads taking the HierarchyViewModel running the search.
  - Scripting: Deprecated: HierarchyNodeTypeHandlerBase.SearchBegin(HierarchySearchQueryDescriptor), SearchMatch(in HierarchyNode) and SearchEnd() are obsolete. Use the overloads that take a HierarchyViewModel, since handlers are shared by every view model on a hierarchy.
  Fixes
  - 2D: Fixed the Open Tile Palette button and Tilemap Focus dropdown not filling the full width of their Scene view overlay. (UUM-151417)
  - 2D: Fixed the Sprite Frame field edit lock override info box in Project Settings > Sprite Editor staying visible after the checkbox automatically unticks itself when the Sprite Editor window closes. (UUM-153407)
  - 2D: Fixed the Sync Active Palette button in the Tile Palette window being cut off or hidden when the window is resized horizontally. (UUM-152530)
  - AI: The sourceBounds from a NavMeshData object generated far from origin were incorrectly including the origin. These bounds now wrap tightly around the meshes used for building the NavMesh. (UUM-152672)
  - DX12: Fixed a crash in the Frame Debugger when inspecting constant buffers under Direct3D 12. (UUM-146746)
  - DX12: Fixed a random crash on Windows when using the Direct3D12 graphics API, caused by a use-after-free when releasing GPU buffers. (UUM-150682)
  - Editor: Fixed a bug where the Linux Editor wasn't anchoring the Help and Window menus to the end of the main menu bar. (UUM-113169)
  - Editor: FIxed a bug where the main toolbar unity logo appeared vertically stretched on mac retina display. (UUM-134520)
  - Editor: Fixed account dropdown display when entering play mode. (UUM-150759)
  - Editor: Fixed closing the Editor with unsaved changes in a UI Toolkit stage (VisualElementEditingStage) showed the "UI Stage - Unsaved Changes Detected" popup after the Save Scene dialog, and clicking Cancel did not stop the Editor from closing, so the unsaved changes were lost. (UUM-147023)
  - Editor: Fixed the Build Profiles window not updating displayed property values after an undo or redo until the mouse was moved. (UUM-150356)
  - Editor: Multiplayer: The Play Mode instances status dropdown no longer opens an empty list when the active Scenario configuration is invalid, and now explains that the Scenario needs to be set up. (UUM-151775)
  - Entities: Fixed a bug where a scene's GameObjects would disappear from the Hierarchy window after exiting Play mode when a SubScene referenced the same scene. (UUM-148713)
  - Entities: Fixed an InvalidOperationException when searching by component type in the Hierarchy window while a SubScene is loading. (UUM-142749)
  - GI: Fixed a heap-buffer-overflow read when deduplicating overlapping Light Probes from multiple loaded scenes. (UUM-153133)
  - Input: Removed a 17 B main-thread GC allocation that occurred on every input update tick in Mono players. (UUM-147633)
  - Multiplayer: Unity Transport: Fixed an issue where sending packets on UDP connections that don't have a remote peer anymore could eventually result in exhausting the receive queue, causing the server to not be able to receive anything anymore. (UUM-151844)
  - Networking: Fixed UnityWebRequest cookies occasionally reverting to an older value when a slower request completed after a faster concurrent request to the same host had already set a newer cookie. (UUM-150958)
  - Player: Fixed GameObjects so now it cast correct shadows after Shader.globalMaximumLOD is changed at runtime. (UUM-150226)
  - Profiler: Fixed an InvalidOperationException that could be thrown in the Profiler window when the Physics (2D) module was selected and another Editor window was maximized or restored. (UUM-151943)
  - Services: Fixed long cloud project names not being truncated in the Cloud project dropdown in Services settings. (UUM-150192)
  - Shaders: Fixed a random crash that could occur during shader variant uploads in Player builds. (UUM-150584)
  - Shaders: Fixed editor crash by making UniqueIDGenerator thread-safe. (UUM-146812)
  - SRP Core: Fixed the culled pass block being unreadable in the Render Graph Viewer in dark mode. (UUM-146993)
  - SRP Core: Fixed the GPU Resident Drawer help box in the Rendering Debugger displaying C# type names, such as "GPUResidentDrawer" and "RenderPipelineAsset", instead of readable names. (UUM-138009)
  - SRP Core: Fixed the Scan and Convert Assets buttons in the Render Pipeline Converter window being hidden when the window was narrower than its content. (UUM-151491)
  - Terrain: Fixed a crash in shadow culling when a render pass culled the same Camera a second time while a Terrain with Draw Instanced disabled was visible. (UUM-151731)
  - TextCore: Fixed the Font Asset Creator and Sprite Importer windows failing to reload and logging a serialization error when toggling UI Toolkit Live Reload. (UUM-150353)
  - UI Toolkit: Fixed errors in the Console when animating a UI Document component's Pivot Reference Size, Pivot, Position or Size Mode property. These properties are no longer offered in the Animation window. (UUM-148476)
  - UI Toolkit: Fixed Foldout tooltips being displayed at the bottom of the section instead of under its header. (UUM-145747)
  - UI Toolkit: Fixed learn more Help URL in Project Preview Theme settings opening for the wrong unity version.
  - UI Toolkit: Fixed SVG gradients xlink:href inheritance. (UUM-150193)
  - UI Toolkit: Fixed the Backdrop Filter not being rendered in the UI Viewport in UI staging mode. (UUM-149971)
  - UI Toolkit: Fixed the Dynamic Atlas Viewer window failing to reload and logging a serialization error when toggling UI Toolkit Live Reload. (UUM-150660)
  - UI Toolkit: Fixed the UXML asset preview rendering after its asset was deleted. (UUM-147940)
  - UI Toolkit: Fixed the UXML file being marked as having unsaved changes after canceling a rename in the UI Builder Hierarchy. (UUM-139551)
  - Web: Added warnings when scripted change to maximum memory size results in memory size clamping or switch to WebAssembly 2023 target. (UUM-151511)
