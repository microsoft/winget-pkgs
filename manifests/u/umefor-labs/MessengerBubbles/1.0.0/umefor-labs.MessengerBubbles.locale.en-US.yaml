ShortDescription: Floating chat bubbles for Facebook Messenger on Windows, like chat heads on Android.
Description: |-
  Messenger Bubbles shows Facebook chats as floating bubbles on the desktop, one bubble per chat, using WebView2 to wrap facebook.com/messages.
  Clicking a bubble opens a small chat panel next to it. The app lives in the system tray. It is a personal project, not affiliated with Meta.
