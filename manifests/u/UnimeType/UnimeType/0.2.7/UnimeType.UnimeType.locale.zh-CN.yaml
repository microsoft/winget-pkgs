ReleaseNotes: |-
  - 优化网络请求连接与代理环境体验，提升个人记忆学习与多语言整句转换准确度。
  - 改进跨应用光标上下文边界识别与富文本编辑器原位替换稳定性。
  - 焕新设置中心的账户与订阅方案界面，去除重复状态提示并统一 7 语言界面文案。
