ReleaseNotes: |-
  - 随包离线秒出常用短句（含句末标点自动还原）扩展至全部 12 种支持语言。
  - 升级 4 步首次引导与原生桌面界面质感，自动识别系统区域语言，支持一键挂载激活输入法及自带密钥 DeepSeek 预设。
  - Personal Memory 升级为清晰的背景与文体分栏归类，并统一更克制柔和的光标进度胶囊反馈。
