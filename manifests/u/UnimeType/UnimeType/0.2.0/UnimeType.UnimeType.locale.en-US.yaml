ReleaseNotes: |-
  - Added opt-in Cross-Device Clipboard Sync (off by default, 5-minute auto-expiry) to copy and paste text and images across Windows, Mac, Linux, iOS, and Android, with automatic local blocking for API keys, payment cards, seed phrases, and private keys.
  - Improved conversion accuracy and Reconvert alternatives with preceding-paragraph context, exact-spelling priority, personal dictionary sync, and stronger local masking for Windows file paths and CLI flags.
  - Added clear auto-renewal vs. expiration status in Account & Credits, direct plan navigation from Cross-Device Clipboard when unsubscribed, and expanded 12-language mixed-script support.
