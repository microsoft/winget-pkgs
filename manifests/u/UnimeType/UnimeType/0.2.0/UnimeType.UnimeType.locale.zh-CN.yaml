ShortDescription: 免切换多语言混输输入法，在一个拉丁键盘上连续输入中/日/印/阿/俄与英文混排句子并按需整句转换，自动保留英文单词与代码。
Description: UnimeType 是基于 Windows TSF 的原生多语言输入法。无需在句子中途反复按快捷键切换输入法，全程使用标准英文键盘输入拼音、罗马音、Hinglish、Arabizi 或俄语转写，夹杂的英文单词与代码原样输入，按需一键整句转换并自动保留英文词汇，同时内置原位润色（Polish）、解释（Explain）及开源本地模型离线推理支持。
