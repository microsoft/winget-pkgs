- 输入法
ReleaseNotes: |-
  - 新增「跨设备剪贴板同步」（默认关闭、5 分钟自动过期）：支持在 Windows、Mac、Linux、iOS 与 Android 之间实时同步文字与图片，并在本机自动拦截密钥、银行卡号、助记词等敏感内容。
  - 提升整句转换与「再换一个」准确度：结合前文段落语境与精确拼写优先匹配，个人词典即时生效，并强化 Windows 本地路径与命令行参数的本机脱敏保护。
  - 在「账号与积分」清晰展示自动续费或到期时间，未订阅时点击跨设备剪贴板可一键查看方案，并扩展完善 12 语种混输支持。
