- 中文输入法
- 多语言
- 日语输入法
- 拼音
- 罗马音
- 输入法
ReleaseNotes: |-
  - 大幅优化整句转换（Convert）与多候选「再换一个」的响应速度，Personal Memory 个人记忆改为后台异步更新，连续输入更跟手。
  - 采用全新的动态前台 Caps Lock 拦截机制（无需修改系统注册表或重启电脑即可生效），并在设置中提供四项独立快捷键开关。
  - 增强跨空行多段落的前后文语境衔接，并修复虚拟机共享剪贴板换行符偶发循环同步的问题。
