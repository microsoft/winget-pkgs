ReleaseNotes: |-
  - 上线 Personal Memory 2.0（个人记忆）：支持自动沉淀个人常用词、表达偏好与今日输入统计，Unlimited 订阅用户可开启跨设备加密同步。
  - 设置完成后的「概览」页新增原位「试一下」实时转换体验框，支持直接按键或点击体验整句转换与一键还原。
  - 自定义 API Key 未通过连通测试前仅保留草稿态，登录官方账号自动恢复 UnimeType AI 服务，并升级中文整句语境与模糊音准确度。
