ReleaseNotes: |-
  - Switched Reconvert to fast direct inference without reasoning-stream overhead, cutting multi-candidate cycling latency to match macOS and iOS.
  - Refined Mandarin Pinyin everyday vocabulary and particle priority (v28), improving disambiguation of "he" (和 vs. English he) and "you" (有/又 vs. English you) over homophonous brands or surnames.
  - Extended device-code sign-in window with automatic rate-limit backoff, alongside opt-in Cross-Device Clipboard Sync for text and images.
