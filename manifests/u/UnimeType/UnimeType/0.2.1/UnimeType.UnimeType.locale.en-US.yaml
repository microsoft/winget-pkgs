ShortDescription: Multilingual input method that converts mixed-script Latin drafts (Pinyin, Romaji, Hinglish, Arabizi, Translit) into native script in one step while keeping English words intact.
Description: UnimeType is a native Windows Text Services Framework (TSF) input method for people who write across multiple scripts. Type Pinyin, Romaji, Hinglish, Arabizi, or Russian Translit alongside English words on a standard Latin keyboard and trigger Convert once to convert the sentence in place while preserving English words, code spans, URLs, and names. Includes in-place Polish and Explain and supports free local offline inference via LM Studio with open-weight Transliteration 2.0 models.
