ReleaseNotes: |-
  - 随包内置 480 条日常高频中文短句并支持句末标点自动还原，无需等待网络即可毫秒级上屏；同步提升日语、阿语、越语与西语转换准确度。
  - 优化账号登录时序与首次引导界面，优先完成推理凭证就绪并将词包同步移至后台异步执行，登录完成即可立刻打字。
  - 升级 Personal Memory 个人记忆保护机制，守护人名与已确认的常用词不被后台整理误删。
