ReleaseNotes: |-
  Deep Clean now shows what it is doing and how far along it is while it cleans,
  and it is faster - it no longer re-scans your whole user folder afterwards.
  The drive's free space is shown with the results, so you can see the space
  come back, and the amount reclaimed is measured on the drive itself.

  Deep Clean also warns you when an app is holding its own cache open, since
  cleaning it while that app runs frees almost nothing.

  The assistant now keeps to one voice - two could previously speak over each
  other when a reminder fired mid-sentence - and it answers questions instead
  of acknowledging them.

  Cleanup can show you exactly which files it will remove before it removes
  them. FixKon now starts with Windows and sits in the tray as it should.
  Cancel and refund are together in one place, and refund requests are reviewed
  by a person rather than issued automatically.
