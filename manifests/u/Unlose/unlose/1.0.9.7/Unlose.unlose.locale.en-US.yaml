ShortDescription: Time-machine snapshots for Windows — protect your files before your AI agent deletes them
Description: >-
  unlose is a lightweight Windows snapshot tool built for the AI agent era.
  It takes automatic Volume Shadow Copy Service (VSS) snapshots before and during
  AI agent sessions, so accidental deletes, a wrong rm -rf, ransomware, or agent
  mistakes can be rolled back from a simple timeline.
  It integrates with AI coding agents (Claude Code, Cursor, opencode, codex, ...)
  through memory-file directives and an MCP server, and supports agent-initiated
  snapshots — on the authors' own machines, agents pause to snapshot before bulk
  deletes, unprompted, every day.
  It runs as a LocalSystem service, records no file contents, no screen capture,
  no keystrokes — a time machine, not a surveillance tool. Fully open source
  under Apache-2.0: the source has to be auditable, and it is.
Moniker: unlose
