ReleaseNotes: |-
  - First public release of unlose for AI agent sessions on Windows.
  - Self-contained installer: no external .NET runtime download required.
  - Bilingual installer UI (zh-CN / en-US) with language selection dialog.
  - Smooth upgrade from previous builds (three-segment version rule).
