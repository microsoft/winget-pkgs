ReleaseNotes: |-
  - unlose 面向 Windows AI Agent 会话的首个公开发布线。
  - 自包含安装器：无需额外下载 .NET 运行时。
  - 安装器双语界面（简体中文 / 英文），带语言选择对话框。
  - 平滑升级（前三段版本号规则）。
