ShortDescription: Windows 时光机快照——在 AI Agent 删掉你的文件之前先拍照
Description: >-
  unlose 是为 AI Agent 时代打造的轻量级 Windows 快照工具。
  它基于卷影副本（VSS）在 AI Agent 会话开始前后自动创建快照，
  误删、错误的 rm -rf、勒索软件或 Agent 误操作都可以在时间线上拖回去。
  通过记忆文件指令与 MCP 服务端与主流 AI 编程 Agent（Claude Code、Cursor、
  opencode、codex 等）集成，支持 Agent 主动快照——在作者自己的机器上，
  Agent 每天都会在批量删除前主动停下来拍快照，无需任何人提示。
  以 LocalSystem 服务运行，不录屏、不录音、不记按键、不读文件内容——
  是时光机，不是监控。Apache-2.0 完全开源，源码可审计。
