ShortDescription: Removes non-present devices from the Windows device management.
Description: |-
  Each device that was ever attached leaves an entry in the Windows device management. The Windows Device Manager can only delete them one by one. Device Cleanup Tool lists all non-present devices and lets you remove multiple or all of them at once.
  Removing devices requires admin privileges. On x64 Windows only the x64 release can delete devices.
