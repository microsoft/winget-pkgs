ShortDescription: Uninstall Windows apps completely, including the files and registry entries they leave behind.
Description: |-
  Untrail runs an app's own uninstaller, waits until it has really finished, then finds what was left behind:
  caches and settings in AppData, update downloads, shortcuts, start-up entries and registry keys.
  A folder is only marked "Safe to remove" when there is evidence it belongs to the app; anything else is left
  for you to review. Every delete is checked again first, links are never followed, registry entries are backed
  up before they are removed, and the space freed is measured on each drive.
