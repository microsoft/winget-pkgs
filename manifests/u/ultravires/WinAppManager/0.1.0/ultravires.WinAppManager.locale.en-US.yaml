ShortDescription: Manage installed applications on Windows with a fast, native GUI.
Description: |-
  WinApp Manager is a lightweight application manager for Windows built with Rust and egui.

  It scans the registry Uninstall entries (the same source as "Programs and Features"),
  lets you organize apps into categories, launch them with a double-click, open their
  file locations, and uninstall them through their official uninstallers. Portable
  apps can be added manually, removed apps can be restored from a dedicated view, and
  the application font is configurable. All state persists in a local JSON file.
