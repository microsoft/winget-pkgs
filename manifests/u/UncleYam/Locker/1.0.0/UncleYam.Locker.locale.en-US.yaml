ShortDescription: Set an iPhone Screen Time passcode (or any keypad code) that you yourself don't know
Description: 'Locker walks you through setting a numeric code that you yourself never learn: it deals out tap and delete instructions where decoys and real digits look identical, so the code gets set without you knowing it. Built for the iPhone Screen Time passcode; works for any keypad code of 3-12 digits. Saved codes are sealed in a computational time-lock, so revealing one costs real CPU time - there is no backdoor other than compute.'
