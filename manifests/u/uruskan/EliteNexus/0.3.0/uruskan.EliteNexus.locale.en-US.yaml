ShortDescription: Free companion app for Elite Dangerous with HUD colours, exobiology, trading and Spansh routes.
Description: |-
  Elite Nexus is a companion app for Elite Dangerous and Odyssey. It reads the game's journal live and offers a HUD
  colour editor that can keep hostile red, friendly green and shield blue, a cockpit-light dimmer, Odyssey glare
  settings, an exobiology sampling radar with species predictions, exploration values, a live EDDN market database
  with trade routes and price alerts, Spansh route planners, engineering, fleet and fleet carrier tracking, and an AI
  assistant. Uploads to EDDN, EDSM, Inara and EDAstro are opt-in.
