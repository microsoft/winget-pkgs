ShortDescription: Move files between your phone and laptop over Wi-Fi or a hotspot.
Description: |-
  kickFile sends files, photos, videos, folders and text between Android phones and Windows, Mac and Linux computers over your own Wi-Fi or your phone's hotspot.
  Open it on both devices and they find each other. Transfers are encrypted, checked with SHA-256 and resume after a dropped connection. No account, no internet, no ads. Free and open source.
