ShortDescription: Récupère et convertit en MP4 les DVD de caméscope non finalisés, illisibles par Windows et HandBrake (accès disque bas niveau + pipeline FFmpeg).
Description: "OpenDisc2MP4 est un utilitaire Windows open-source conçu pour régler un problème fréquent sur les caméscopes : l'extraction de vidéos depuis des disques non finalisés ou à session ouverte, souvent illisibles pour l'Explorateur Windows et les convertisseurs classiques (HandBrake, VLC). Grâce à un accès direct bas niveau (Win32 I/O), OpenDisc2MP4 contourne l'absence de système de fichiers standard, injecte le flux brut MPEG-PS directement dans un pipeline FFmpeg et génère en temps réel un fichier MP4 (H.264 / AAC) synchronisé et compatible avec tous les lecteurs."
Moniker: opendisc2mp4
Tags:
- video-recovery
ReleaseNotes: 'Première version publique : récupération et conversion en MP4 de disques optiques non finalisés (mini-DVD de caméscope),'
ReleaseNotesUrl: https://github.com/UzairGL/OpenDisc2MP4/releases/tag/v1.0.0
InstallationNotes: Nécessite un terminal administrateur (accès disque bas niveau). Installez ffmpeg séparément si besoin (winget install ffmpeg). Tapez "OpenDisc2MP4 --help" pour l'utilisation.
