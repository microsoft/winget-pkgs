ReleaseNotes: |-
  Changes
  - Make App Backup restores into another tenant a Pro feature (#366)
  - Offer a free setup call during first setup and under Support (#363)
  - docs: list the App Backup connections on the data flows page (#364)
  - docs: illustrate portal workflows with current app screenshots (#362)
  - docs: explain App Backup admin workflow and device capture (#361)
  - Docs: explain how to get a third tenant (#359)
  - Restore captured Win32 apps to another tenant (#360)
  - Add Windows Intune installer capture through a native helper (#352)
  - Help admins recover a sign-in that never returns (#356)
  - Offer a Pro trial to existing Community tenants (#355)
  - Ask new installs to share setup diagnostics (#353)
  - Clarify recovery limits before the first backup (#354)
  - Point a tenant that blocks Microsoft Graph Command Line Tools to the manual setup (#350)
  - Show backup results as a summary instead of a raw log (#349)
  - Say 41 Intune object types in the docs llms.txt and the backups page description (#348)
  - Add free app-first Win32 backup and encrypted installer storage (#342)
  - Download the installer from the docs header instead of opening the website (#347)
  Compare with 0.5.2
