ShortDescription: "Local, open CCleaner replacement for Windows: junk cleaning, idle-service taming and vendor driver checks."
Description: |-
  PCleaner cleans temp folders, crash dumps, logs, error-report queues, update caches and browser caches,
  stops idle resource-hungry services that are safe to stop, and compares installed drivers against
  NVIDIA, the laptop maker (ASUS automated, others linked) and Windows Update. Browser passwords, autofill,
  cookies, history and bookmarks are on a hard never-delete list. Runs weekly from Task Scheduler if wanted
  and writes an HTML report for every run. Plain Windows PowerShell 5.1 and WPF; no cloud, no license.
