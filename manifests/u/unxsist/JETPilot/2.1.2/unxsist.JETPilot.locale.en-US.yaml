ShortDescription: Open-source Kubernetes desktop client that focuses on less clutter, speed and good looks.
Description: |-
  JET Pilot is an open-source Kubernetes desktop client. It brings every cluster from your kubeconfig files and cloud accounts (AWS, Google Cloud, Azure, DigitalOcean, Akamai, Civo, Scaleway, Vultr and Exoscale) into one list, with sign-in for SSO and exec plugins inside the app.
  Multi-cluster and multi-namespace tables update live from the API server. It also has a resource graph, a structured log viewer, a YAML editor with dry run, Helm, port forwarding, a command palette and a built-in terminal with kubectl set to the current context.
  JET Pilot uses your existing kubeconfig and kubectl. There is no account and no telemetry.
