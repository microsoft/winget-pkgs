Description: |-
  تطبيق Utilvo Edge Shield هو برنامج سطح مكتب أصلي لنظام ويندوز (64-bit) مطور بواسطة استوديو Utilvo لمراقبة حركة البوتات والزواحف على خوادم لينكس في الوقت الفعلي عبر اتصال SSH المشفر المباشر دون الحاجة لأي وسيط سحابي.
  يدعم البرنامج اكتشاف سجلات Nginx وApache وCaddy وOpenLiteSpeed تلقائياً، والتحقق من مصداقية زواحف محركات البحث عبر Reverse-DNS، وحظر العناوين ونطاقات CIDR بضغطة واحدة عبر UFW وfirewalld وiptables.
