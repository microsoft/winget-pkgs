ShortDescription: Real-time SSH server bot monitor, Reverse-DNS crawler verifier, and Linux firewall GUI for Windows.
Description: |-
  Utilvo Edge Shield is a native Windows x64 desktop and system-tray security application for Linux VPS administrators, DevOps engineers, and self-hosted web operators.
  It connects directly over encrypted SSH with zero cloud relays to stream live Nginx, Apache, Caddy, and OpenLiteSpeed access logs, verify search engine crawlers (Googlebot, Bingbot, Applebot) via Reverse-DNS (PTR/FCrDNS), and enforce one-click IP and CIDR blocks across UFW, firewalld, nftables, and iptables.
