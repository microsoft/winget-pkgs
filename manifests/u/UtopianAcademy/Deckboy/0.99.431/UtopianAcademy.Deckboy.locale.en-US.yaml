ReleaseNotes: |-
  - Deckboy Pocket: a player for Android phones, as a signed APK on the release page. It can follow a
    desk and act as one of its outputs.
  - Backup desk: a second machine follows the main desk and can take over the show.
  - Desk layouts and rendered skins for the desk window.
  - New sources: Surf, Illusion, Mega Ripple and Breath. Surf is in SOURCE > MADE BY DECKBOY.
  - The SOURCE menu is in sections and its columns are balanced.
  - Fixed: on Windows, command-line flags such as --devices and --help now print in the console
    they were run from.
  - The Companion module is 1.2.0.
