ReleaseNotes: |-
  - Effects on the graphics card: 25 picture effects and the shatter, portal, clouds and ghastly
    transitions run on the GPU. Eight effects on a 4K clip went from 130 ms to 8 ms a frame.
  - New sources: shaders (ISF .fs files), Lumia (laser light through moving water) and Voice
    (typed text, spoken by a simulated vocal tract).
  - Render a show to a file, Ableton Link, and the Melt, Tape and Circuit Bend effects.
  - Any control can follow the bass, the middle or the treble of the sound, from the playlist or
    from a live input.
  - The sound scopes have a spectrogram.
  - Every release now carries SHA256SUMS.txt.
