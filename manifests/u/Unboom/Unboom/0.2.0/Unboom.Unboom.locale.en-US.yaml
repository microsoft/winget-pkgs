ShortDescription: Find the bass note your room exaggerates and turn just that down on your speakers.
Description: |-
  Your monitors aren't boomy. Your room is. Unboom finds the bass frequency an untreated room exaggerates, with the microphone or by ear, and gently turns just that part down for everything your PC plays on the calibrated speakers. It only cuts, never boosts, and headphones are left alone.
  Free download with a 14-day trial; room scans are always free. Then a one-time license bought in the app.
