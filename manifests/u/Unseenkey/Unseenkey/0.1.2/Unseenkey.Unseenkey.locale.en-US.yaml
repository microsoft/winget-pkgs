ShortDescription: Let AI agents, scripts and the people you hire use your API keys without ever seeing them.
Description: |-
  Unseenkey keeps your API keys in an encrypted vault on your machine and hands out handles instead.
  A handle looks like a key to the SDK that receives it, but it only works through the local broker,
  which swaps it for the real key at the last moment, checks a policy (host, endpoints, rate, expiry,
  approval), scrubs the key out of responses and writes every call to a tamper-evident audit log.
  Includes an MCP server for Claude Code, Claude Desktop, Cursor and Windsurf, Windows Hello unlock,
  and signed auto-updates.
Moniker: unseenkey
Tags:
- api-keys
- secrets
- security
- ai-agents
- mcp
ReleaseNotes: |-
  Projects: group keys by the app that uses them, protect a project folder in one step (its .env keys
  move into the vault), AI tools working in a project's folder see only its keys, and a daily request
  limit per project. A status panel and plainer words in the app. Deleting a key revokes its handles;
  one daemon per vault; revealing a key in the app shows it again. Not yet externally audited;
  installer not code-signed.
ReleaseNotesUrl: https://github.com/Bhagyesh97/unseenkey/releases/tag/v0.1.2
