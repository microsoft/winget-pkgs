ReleaseNotes: |-
  Desktop app: a real visual identity (icons, avatars, coloured states, light theme), edit a secret's name,
  provider, hosts, tags and notes in the app, user presets without a rebuild. Broker fixes from the first
  real use of the generic route: bearer placeholders survive, clearer refusals, normalised hosts,
  request_access can add a host, Hostinger preset. Not yet externally audited; installer not code-signed.
ReleaseNotesUrl: https://github.com/Bhagyesh97/unseenkey/releases/tag/v0.1.1
