ShortDescription: "A calm, local editor for writing that ends up in print: books, essays, screenplays and stage plays."
Description: |-
  Wit is a distraction-free editor for books, essays, screenplays and stage plays. You write plain text
  (Markdown, or Fountain for scripts) and see the real printed pages next to it as you type. It makes
