ReleaseNotes: |-
  [1.22.7] - 2026-10-30
  AI 连接与重试
  - 连接中断提示更易懂：AI 回答过程中如果连接意外断开，会显示中文说明，并提示检查网络、代理或接口线路，避免只看到“terminated”等难懂的英文错误
  - 尚未开始回答时自动重试一次：助手在还没有输出正文、也没有调用工具时遇到连接中断，会自动再试一次；如果仍然失败，会明确提示，不会反复重试
  - 减少重复回复和操作：已经输出正文或调用工具后，不会因连接中断自动重新执行整轮任务；手动停止后也不会自动重试，已经收到的正文会保留
  AI 对话体验
  - 回答状态位置更顺手：“正在生成、已完成、已停止、生成失败”等状态移到回答末尾、技能记录上方，读完回复就能看到本轮是否结束
  - 状态提示更清爽：改用简洁的图标和文字展示，减少醒目标签对阅读的干扰；窄侧栏中的长提示可以自动换行，失败状态仍会突出提醒
  下载说明
  - Windows Intel / AMD 电脑：下载 CharacterArc-1.21.0-x64-setup.exe；绝大多数 Windows 电脑选择这一版
  - Windows ARM 电脑：下载 CharacterArc-1.21.0-arm64-setup.exe，适用于使用 Snapdragon 等 ARM 处理器的 Windows 设备
  - macOS Apple 芯片：M1、M2、M3、M4 等机型下载 CharacterArc-1.21.0-mac-arm64.dmg
  - macOS Intel 芯片：下载 CharacterArc-1.21.0-mac-x64.dmg；.zip 是对应架构的免安装解压版本
  - Linux Intel / AMD 电脑：下载 CharacterArc-1.21.0-linux-x64.AppImage；Debian、Ubuntu 等系统也可以选择同名 .deb
  - Linux ARM 设备：下载 CharacterArc-1.21.0-linux-arm64.AppImage；Debian、Ubuntu ARM 系统也可以选择同名 .deb
