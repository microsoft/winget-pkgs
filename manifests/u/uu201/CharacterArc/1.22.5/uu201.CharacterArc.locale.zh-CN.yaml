ReleaseNotes: |-
  1.22.5 - 2026-10-24
  AI 助手与暂存
  - 减少反复提醒：明确要求生成、修改或录入内容时，助手会优先生成可审阅的暂存提案，减少只在对话里给出结果、却没有实际暂存内容的情况
  - 检查是否真的暂存：发现助手回复“已暂存”、本轮却没有对应内容时，会自动补生成一次；如果补生成后仍然声称成功却没有实际记录，会明确提示失败，不再显示为正常完成
  - 删除不需要的提案：“忽略”改为“删除暂存”，删除后立即退出待处理列表，不会删除项目正文；误删时可以在“已删除”中恢复，之前忽略的提案也会收纳到这里
  - 新提案更容易找到：新生成的暂存提案排在列表最上方，减少翻找和滚动
  分卷与章节顺序
  - 修复新增章节导出错位：导入旧版工程后，在后面的分卷新增章节，不会再因为章节顺序从头计算而在导出时跑到开头
  - 修正已有的跨卷错序：启动应用和导入工程时，会检查章节顺序；发现不同分卷的章节顺序交错时，按分卷重新排好，并保留各卷内原有的章节先后顺序
  章节修改标注
  - 只标出实际修改的内容：修复 AI 局部修改时标注范围过大、只改少量文字却把整段甚至整章都标成修改的问题
  - 审阅对比更直观：修改前后对比会标出具体增加、删除的文字，方便逐处检查改动
  知识库清理
  - 支持通过助手清理世界状态：可让全局 AI 助手删除知识库“世界状态”中的角色状态、伏笔、角色关系、时间线、世界规则和倒计时；删除提案需要先在暂存区确认并写回，才会真正生效
  - 角色资料分开处理：删除角色状态时会同时清理该角色的历史状态记录，但不会删除人物卡
  下载说明
  - Windows Intel / AMD 电脑：下载 CharacterArc-1.21.0-x64-setup.exe；绝大多数 Windows 电脑选择这一版
  - Windows ARM 电脑：下载 CharacterArc-1.21.0-arm64-setup.exe，适用于使用 Snapdragon 等 ARM 处理器的 Windows 设备
  - macOS Apple 芯片：M1、M2、M3、M4 等机型下载 CharacterArc-1.21.0-mac-arm64.dmg
  - macOS Intel 芯片：下载 CharacterArc-1.21.0-mac-x64.dmg；.zip 是对应架构的免安装解压版本
  - Linux Intel / AMD 电脑：下载 CharacterArc-1.21.0-linux-x64.AppImage；Debian、Ubuntu 等系统也可以选择同名 .deb
  - Linux ARM 设备：下载 CharacterArc-1.21.0-linux-arm64.AppImage；Debian、Ubuntu ARM 系统也可以选择同名 .deb
