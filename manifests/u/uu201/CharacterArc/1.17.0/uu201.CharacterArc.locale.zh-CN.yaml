ReleaseNotes: |-
  1.17.0 - 2026-08-11
  Added
  - 主页使用教程：主页新增使用教程入口，可展示本地教程内容并同步远程图文教程资源，方便快速了解主要功能
  - 新建作品 AI 优化：创建作品时可用 AI 优化小说简介；深度生成按核心角色、配角、组织、关系、世界观、大纲和校验分阶段执行，并提供更清晰的进度反馈
  - 大纲关联与上下文预览：大纲节点可关联角色、组织和世界观设定，章节初稿配置中可预览本章会使用的角色、关系和设定资料
  Changed
  - 新建作品深度生成：扩充角色、组织、关系、世界观和大纲的生成数量与内容校验，移除固定时间自动中止，长任务可持续执行并支持手动取消
  - 章节初稿上下文与字数控制：初稿会优先注入大纲关联资料，并根据实际字数进行审计和自动修复，使内容与设定、目标篇幅更一致
  - 章节定稿状态同步：初稿阶段只建立索引，章节定稿后再提取并同步世界状态，同时展示处理进度，避免未定稿内容提前影响项目状态
  - 全局助手交互与性能：支持编辑消息和复制内容；优化手动滚动、停止响应、会话恢复和流式内容保存，复杂任务不再受固定工具调用次数限制
  - AI 调用日志兼容：完善运行记录字段映射和旧记录兼容，日志状态与调用信息展示更准确
  Fixed
  - AI 连接与模型配置：连接测试改用普通文本探测，修复部分模型不支持工具调用导致的测试失败，并清理容易误用的默认模型值
  - AI 输出与长任务稳定性：修复部分 AI 输出被截断，以及长时间请求被固定超时提前中止的问题
  - 大纲关联与技巧加载：修复 AI 生成大纲时角色关联不准确、关联资料写回异常，以及初稿手动技巧列表加载不完整的问题
  - 世界观分类与配置传输：修复深度生成后世界观分类未正确中文化，以及章节定稿配置无法通过 IPC 传输的问题
  - 安装图标显示：调整安装图标安全边距，减少 Windows 安装与快捷方式场景下的图标裁切
