ReleaseNotes: |-
  1.22.0 - 2026-10-09
  小说简介
  - 概览页编辑：作品概览新增小说简介，可直接添加、修改或清空；新建项目时填写的简介会独立保存
  - 旧项目与归档兼容：旧项目可从原“故事开端”分卷找回简介，不受分卷排序影响；主动清空的简介不会再次恢复，覆盖导入归档时也会同步更新简介
  大纲与章节编排
  - 集中调整顺序：新增“调整顺序”窗口，可拖动或通过上下按钮调整分卷、大纲节点顺序，也可将节点移到其他分卷，确认保存后统一生效
  - 关联内容同步移动：大纲节点跨卷移动时，关联章节会一起迁移；章节跨卷移动时会提示确认，并同步迁移关联大纲。拖动章节排序后，同卷内关联大纲的顺序也会同步调整
  章节修订与编辑
  - 彩色修订标注：AI 修改写入正文后会带有彩色标注，点击可查看修改说明和对应对话指令；也可手动选择颜色标记待精修内容，完成后清除标注
  - 连续修改同步处理：采纳后续修改时会同时采纳它依赖的前序修改；忽略前序修改时，也会忽略依赖它的后续修改，减少连续修改写入失败的问题
  - 原文定位更准确：优化带格式正文的查找与替换；同一段原文出现多次时，会提示 AI 补充上下文重新定位，避免修改错位置
  - 窄屏工具栏适配：编辑区域较窄时，工具栏自动简化为图标并保留悬停提示，减少按钮拥挤和文字遮挡
  AI 创作参考
  - 角色标签正常传递：修复角色标签未提供给 AI 的问题，章节初稿、大纲生成和章节助手现在都能参考角色标签
  老板键与托盘
  - 快捷隐藏与恢复：标题栏新增老板键按钮，支持 Ctrl+Shift+H 隐藏或恢复窗口，macOS 使用 Command+Shift+H；快捷键被其他应用占用时，会提示仅应用内可用
  - 托盘恢复入口：Windows、Linux 支持点击托盘图标恢复窗口，托盘菜单也可显示或退出弧光，并优化了托盘图标显示
  下载说明
  - Windows Intel / AMD 电脑：下载 CharacterArc-1.21.0-x64-setup.exe；绝大多数 Windows 电脑选择这一版
  - Windows ARM 电脑：下载 CharacterArc-1.21.0-arm64-setup.exe，适用于使用 Snapdragon 等 ARM 处理器的 Windows 设备
  - macOS Apple 芯片：M1、M2、M3、M4 等机型下载 CharacterArc-1.21.0-mac-arm64.dmg
  - macOS Intel 芯片：下载 CharacterArc-1.21.0-mac-x64.dmg；.zip 是对应架构的免安装解压版本
  - Linux Intel / AMD 电脑：下载 CharacterArc-1.21.0-linux-x64.AppImage；Debian、Ubuntu 等系统也可以选择同名 .deb
  - Linux ARM 设备：下载 CharacterArc-1.21.0-linux-arm64.AppImage；Debian、Ubuntu ARM 系统也可以选择同名 .deb
