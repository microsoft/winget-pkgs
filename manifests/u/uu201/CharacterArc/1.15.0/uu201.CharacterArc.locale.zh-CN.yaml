ReleaseNotes: |-
  1.15.0 - 2026-07-26
  Added
  - 小说续写导入工作流：主页新增独立的“小说续写”入口，支持导入 TXT 小说、识别 UTF-8 / GB18030 / UTF-16 编码并自动拆分章节；校对阶段可编辑标题与正文、调整顺序、拆分、合并或删除章节，确认后会导入原文章节并创建新的续写草稿
  - 续写资料 AI 整理：导入时可选生成章节摘要、人物卡片、全书与分卷大纲、待回收伏笔和当前续写状态；分析范围提供快速整理（最近 20 章）、均衡整理（最近 50 章）和完整整理（全部章节），开始前会明确提示大量 Token 消耗
  - 章节与分卷拖拽排序：章节创作目录支持拖拽调整章节顺序，并可拖动分卷改变整卷位置；排序结果会同步更新项目中的章节与分卷数据
  - 写作区字体与草稿恢复：章节编辑器支持切换正文字体并持久化偏好；新增异常退出前的本地草稿快照，可在重新进入章节时选择恢复或忽略，同时补充工作区保存与章节版本保存快捷键
  Changed
  - 写作工作台与版本对比：优化章节树、编辑区快捷操作和章节版本对比布局，版本内容、变更统计与恢复入口更清晰；正文写入使用更稳定的 HTML 段落处理，减少编辑结果中的多余空行
  - 创作助手消息结构：分析过程、资料读取、审计检查、暂存变更和最终回复改为分块展示，进行中状态、失败原因以及待确认修改更容易识别
  - Runtime v2 与章节后处理：章节生成后的状态提取、轻量审计和向量索引改为可跟踪的后台任务；相同正文复用任务，新正文会取消旧任务，并持久化处理阶段和异常信息，避免迟到结果覆盖最新状态
  - 项目进入与 AI 日志性能：进入项目时只保存必要的轻量设置，不再触发无意义的完整工作区保存；AI 调用日志改为预计算展示数据和分批加载，长日志列表打开与滚动更流畅
  - 项目设置入口收敛：移除设置页中重复且覆盖范围有限的 JSON 导入导出入口，完整项目备份、迁移与恢复继续统一使用 .carc 项目归档
  Fixed
  - OpenAI 兼容接口路径：修复 Base URL 使用非 /v1 版本路径时被错误归一化，以及模型列表请求未保留自定义路径导致拉取失败的问题
  - 章节切换与正文写回：修复编辑防抖期间快速切换章节时内容可能写入错误章节的问题，并完善本地恢复快照，降低异常退出或未及时同步造成的正文丢失风险
  - AI 运行可靠性：完善 Runtime v2 的空结果、取消、工具失败和暂存提交状态收敛；上下文构建在单个资料源失败时可继续运行，旧任务的迟到终态不会覆盖新任务
