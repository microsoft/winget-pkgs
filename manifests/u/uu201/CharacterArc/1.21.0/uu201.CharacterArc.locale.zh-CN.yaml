ReleaseNotes: |-
  [1.21.0] - 2026-10-02
  Added
  - AI 助理文件附件：全局助手和章节助手支持粘贴、拖入或选择图片与文本文件，可上传 PNG、JPEG、WebP、GIF 以及 TXT、Markdown、CSV、JSON、LOG 文件；附件会随会话保存，也会包含在项目归档中
  - 附件预览与内容读取：发送前可以查看和移除附件，发送后可在消息中点击预览；文本附件内容会提供给 AI 作为本轮任务资料
  - 数据库安全升级：旧版工作区升级前会自动创建并校验备份，升级窗口展示备份和迁移的真实进度；失败时可以打开备份目录、重新尝试或恢复旧数据
  Changed
  - 长篇小说章节存储：章节正文改为按需读取和增量保存，不再因为修改单章而反复重写所有章节；章节列表仍可先显示标题、摘要和字数，进入具体章节时再读取完整正文
  - 章节排序与版本读取：拖动章节时优先只更新发生变化的排序位置，只有排序空间不足时才进行完整重排；历史版本正文也按需读取，减少超长项目的内存和数据库压力
  - AI 修改与章节同步：AI 暂存修改和章节状态同步只传递必要字段，减少完整正文的重复复制；修改章节标题、摘要、状态等信息时，会保留数据库中的完整正文
  - 世界观、角色和灵感保存：这些资料改为独立增量保存，新增、编辑或删除单条内容时不再触发整个工作区的全量写入，大型项目保存更轻量
  - 应用启动速度：应用先创建窗口并挂载加载界面，再异步读取本地工作区；Skills 扫描移到页面加载完成后执行，减少启动时长时间没有窗口反馈的情况
  - 页面加载与自动保存：工作台面板和部分大型页面改为按需加载，自动保存等待时间和保存队列经过调整，连续编辑时减少重复保存和界面卡顿
  Fixed
  - 未加载正文保护：修复只修改章节元数据或处理 AI 暂存变更时，章节预览内容可能覆盖数据库完整正文的风险
  - 数据库升级恢复：升级失败后会保留失败数据和升级前备份，并提供明确的错误说明与恢复入口，避免用户只能强制退出或手动寻找数据
  下载说明
  - Windows Intel / AMD 电脑：下载 CharacterArc-1.21.0-x64-setup.exe；绝大多数 Windows 电脑选择这一版
  - Windows ARM 电脑：下载 CharacterArc-1.21.0-arm64-setup.exe，适用于使用 Snapdragon 等 ARM 处理器的 Windows 设备
  - macOS Apple 芯片：M1、M2、M3、M4 等机型下载 CharacterArc-1.21.0-mac-arm64.dmg
  - macOS Intel 芯片：下载 CharacterArc-1.21.0-mac-x64.dmg；.zip 是对应架构的免安装解压版本
  - Linux Intel / AMD 电脑：下载 CharacterArc-1.21.0-linux-x64.AppImage；Debian、Ubuntu 等系统也可以选择同名 .deb
  - Linux ARM 设备：下载 CharacterArc-1.21.0-linux-arm64.AppImage；Debian、Ubuntu ARM 系统也可以选择同名 .deb
