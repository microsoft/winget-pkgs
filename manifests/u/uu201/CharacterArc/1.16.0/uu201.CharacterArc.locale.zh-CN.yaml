ReleaseNotes: |-
  1.16.0 - 2026-08-04
  Added
  - OpenCode Go 厂商配置：新增 OpenCode Go 预设，并完善模型列表获取兼容
  - AI 网络代理配置：设置页支持 HTTP/HTTPS 代理和代理出口 IP 测试，便于排查网络与中转连接问题
  Changed
  - AI 协议适配重构：统一适配官方 OpenAI Responses、OpenAI 兼容 Chat Completions 和 Anthropic Messages，并支持手动指定协议
  - 流式响应可靠性：完善响应开始等待、SSE 终止事件、半开连接和空闲超时处理，降低长响应卡住或无法收尾的概率
  - 设置与模型切换性能：设置保存和标题栏模型切换采用轻量更新，不再触发不必要的完整工作区序列化
  Fixed
  - OpenCode 与全局助手响应：修复流式初稿中断、全局助手卡住和部分请求无法正常结束的问题
  - 章节初稿与自动保存：修复章节快速切换时的自动保存竞态，以及旧任务迟到结果覆盖新正文的问题
  - 模型协议兼容：修复不同厂商下推理参数、协议路由和流式结果处理不兼容的问题
  - 超时错误提示：区分响应开始等待和流式空闲超时，补充更明确的接口诊断信息
