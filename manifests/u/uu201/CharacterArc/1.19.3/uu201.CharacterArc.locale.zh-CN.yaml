ReleaseNotes: |-
  1.19.3 - 2026-09-20
  Added
  - 章节设定参考：章节编辑器新增独立参考面板，可在“本章相关”和“全部资料”之间切换，集中查看人物、组织和世界观设定；支持关键词搜索、分类筛选、拖动位置和调整面板大小
  - Skill 使用策略：项目可设置“自动选择、仅使用指定 Skill 或不使用 Skill”；全局助手和章节助手可在每次对话中临时覆盖，章节初稿也能按生成步骤分别选择
  Changed
  - Skill 管理方式：全局 Skill 与当前项目配置分开管理；全局设置负责导入和删除，项目设置负责启用范围、适用阶段和默认调用规则，避免不同项目互相影响
  - 章节编辑操作：重新整理编辑器工具栏，新增“设定参考”入口；选中文字后可直接选择润色、改写、扩写、缩写或询问 AI，常用操作更容易找到
  Fixed
  - Skill 自动选择权限：修复助手已经自动选中 Skill、却因授权判断不一致而无法实际加载的问题，自动模式下的选择结果现在可以正常使用
  - 全局助手生成状态：异常退出后会自动结束遗留的“生成中”状态；停止生成时会同步收口前后端状态，重复停止不再显示英文错误，迟到的模型内容也不会把已取消任务重新标记为完成
