ShortDescription: Dual-pane file manager with F3-F8 keyboard shortcuts for Windows, macOS and Linux.
Description: |-
  DuPanel is a free dual-pane file manager with classic function-key shortcuts, built with Flutter and native on Windows (x64 and ARM64), macOS (Apple Silicon and Intel) and Linux.
  Two panels with drive buttons, a clickable path line, columns, natural sorting, quick search by typing, a name filter and folder history.
  Function keys (F3 view, F4 edit, F5 copy, F6 move, F7 new folder, F8 delete, Alt+F7 search, Ctrl+M multi-rename), all reassignable.
  Safe copy and move with a question for every name conflict.
  ZIP archives open as folders; 7z, ISO and RAR (unpack only).
  FTP, FTPS, SFTP and SMB connections.
  Built-in viewer for text, hex, images, audio, video, PDF, Markdown and Office text, plus a text editor, folder compare and sync, checksums and multi-rename.
  English and Russian interface; no ads, no data collection.
