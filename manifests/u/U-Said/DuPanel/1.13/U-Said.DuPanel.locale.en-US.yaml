ReleaseNotes: |-
  - The 1.12 look and logic with the new icon, colors and the F3 viewer for all formats from 1.06.
  - Default colors: both panels blue, cursor and marked files orange. Presets Default, macOS and Windows (light and dark); any color can be changed by hand.
  - Selection style Frame, Fill, or Frame for the cursor and Fill for marked files.
  - The path field shows a short path and the free disk space; the Up and Refresh buttons are removed.
  - F3 opens Excel spreadsheets (xlsx, xls) again; password-protected Word, Excel, PowerPoint and OpenDocument files open in the system's program.
  - Tabs in the panels are removed.
ReleaseNotesUrl: https://github.com/U-Said/DuPanel-releases/releases/tag/v1.13
InstallationNotes: |-
  DuPanel is installed as a portable app, so no Start menu shortcut is created. Start it with the DuPanel command (Win+R or a terminal); if the command is not found yet, open a new terminal or sign out and in again.
  Settings (bookmarks, saved connections without passwords, keys, colors) are kept in DuPanel.json in the installation folder, or in %APPDATA%\DuPanel if that folder is read-only (for example, after a machine-wide install). "winget uninstall --purge" deletes the file in the installation folder.
  Close DuPanel before "winget upgrade".
