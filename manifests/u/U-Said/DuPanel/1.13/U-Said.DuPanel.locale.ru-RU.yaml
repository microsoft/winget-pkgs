ReleaseNotes: |-
  - Вид, оформление, логика, функциональные клавиши и настройки — как в 1.12; из 1.06 — новый значок, цвета и просмотр F3 со всеми форматами.
  - Цвета по умолчанию: обе панели синие, курсор и отмеченные файлы — оранжевые. Готовые наборы «По умолчанию», «macOS», «Windows» (светлый и тёмный), любой цвет можно поменять вручную.
  - Выделение «Рамка», «Заливка» или «Рамка у курсора, заливка у отмеченных».
  - Адресная строка: короткий путь и свободное место диска справа; кнопки «Вверх» и «Обновить» убраны.
  - F3: таблицы Excel (xlsx, xls) снова открываются; документы с паролем (Word, Excel, PowerPoint, OpenDocument) сразу открываются в системной программе.
  - Вкладки в панелях убраны.
ReleaseNotesUrl: https://github.com/U-Said/DuPanel-releases/releases/tag/v1.13
InstallationNotes: |-
  DuPanel ставится как переносная программа, ярлык в меню «Пуск» не создаётся. Запуск — командой DuPanel (Win+R или терминал); если команда ещё не находится, откройте новый терминал или выйдите из системы и войдите снова.
  Настройки (закладки, сохранённые подключения без паролей, клавиши, цвета) лежат в файле DuPanel.json в папке установки, а если она закрыта для записи (например, при установке для всех пользователей) — в %APPDATA%\DuPanel. Команда «winget uninstall --purge» удаляет файл из папки установки.
  Перед «winget upgrade» закройте DuPanel.
