ShortDescription: Двухпанельный файловый менеджер с клавишами F3–F8 для Windows, macOS и Linux.
Description: |-
  DuPanel — бесплатный двухпанельный файловый менеджер с классическими функциональными клавишами. Написан на Flutter, работает нативно на Windows (x64 и ARM64), macOS (Apple Silicon и Intel) и Linux.
  Две панели с кнопками дисков, строка пути с переходом по щелчку, колонки, естественная сортировка, быстрый поиск набором имени, фильтр по имени и история папок.
  Функциональные клавиши (F3 просмотр, F4 правка, F5 копирование, F6 перенос, F7 новая папка, F8 удаление, Alt+F7 поиск, Ctrl+M групповое переименование), любую можно переназначить.
  Безопасное копирование и перенос: при каждом совпадении имён программа спрашивает, что делать.
  Архивы ZIP открываются как папки; 7z, ISO и RAR (только распаковка).
  Подключения FTP, FTPS, SFTP и SMB.
  Встроенный просмотр текста, hex, изображений, аудио, видео, PDF, Markdown и текста документов Office; редактор текста, сравнение и синхронизация папок, контрольные суммы, групповое переименование.
  Интерфейс на русском и английском; без рекламы и без сбора данных.
