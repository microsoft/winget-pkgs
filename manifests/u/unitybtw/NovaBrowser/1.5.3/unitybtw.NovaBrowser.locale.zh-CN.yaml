PackageIdentifier: unitybtw.NovaBrowser
PackageVersion: 1.5.3
PackageLocale: zh-CN
ShortDescription: 面向开发者的开源 Electron 浏览器，提供工作区、本地 AI 和 MCP 服务器。
Description: |-
  Nova Browser 是一款使用 Electron、React、TypeScript 和 Vite 构建的开源桌面浏览器，面向开发者、研究人员和注重隐私的用户。它将 Chromium 渲染与运行在端口 3020 的原生 Model Context Protocol（MCP）服务器相结合，向编码代理开放 26 种浏览器自动化和检查工具，并通过 Whisper 和 WebGPU 在设备上运行语音转文字和语言模型，不会将语音或提示数据发送到云端服务器。
  标签页可以收纳在垂直侧边栏中，按带有颜色标记的工作区分组，支持嵌套文件夹以及静音、固定和复制等操作，旁边还配有双视图分屏。激进的休眠引擎会挂起后台标签页，让标签页数量不再成倍增加 Chromium 进程；内置的 EasyList、EasyPrivacy 和 Peter Lowe 过滤规则在网络层拦截广告和跟踪信标，且不进行任何遥测。
  支持 Chrome 网上应用店扩展程序；保存的密码、书签、历史记录和工作区布局通过客户端 AES-256-GCM 加密在多台设备间同步。
