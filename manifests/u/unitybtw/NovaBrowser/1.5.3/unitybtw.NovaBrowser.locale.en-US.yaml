ShortDescription: Open-source Electron browser for developers with workspaces, on-device AI and an MCP server.
Description: |-
  Nova Browser is an open-source desktop browser built with Electron, React, TypeScript and Vite for developers, researchers and privacy-conscious users. It pairs Chromium rendering with a native Model Context Protocol server on port 3020 that exposes 26 browser automation and inspection tools to coding agents, and runs speech-to-text and language models on device through Whisper and WebGPU without sending voice or prompt data to cloud servers.
  Tabs can live in a vertical sidebar grouped into color-coded workspaces with nested folders, mute, pin and duplicate actions, next to a dual-view split screen. An aggressive hibernation engine suspends background tabs so tab count does not multiply Chromium processes, and the built-in EasyList, EasyPrivacy and Peter Lowe filtering terminates ads and tracking beacons at the network layer with zero telemetry.
  Chrome Web Store extensions are supported, and saved passwords, bookmarks, history and workspace arrangements sync across devices with client-side AES-256-GCM encryption.
