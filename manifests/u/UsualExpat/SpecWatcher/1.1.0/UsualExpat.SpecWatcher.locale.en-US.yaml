ShortDescription: A full-screen terminal dashboard that watches a repository's specs folder.
Description: >-
  spec-watcher is a full-screen terminal dashboard that continuously watches a repository's docs/specs
  folder and shows every spec's name, status, and task progress in one live, navigable table. It adds a
  per-spec detail view, drift/attention flags, local git branch awareness, and a headless JSON/Markdown
  mode for CI. Specs can be edited in place: tick tasks off and change a spec's status from the detail
  view. It tracks drift, flagging a spec marked Complete with tasks outstanding, or one whose tasks are all
  done but whose status has not caught up.
