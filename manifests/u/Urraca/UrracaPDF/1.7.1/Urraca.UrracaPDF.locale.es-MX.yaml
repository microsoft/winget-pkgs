ShortDescription: Editor de PDF offline para Windows con OCR local, conversión, firma y censura sin subir archivos a la nube.
Description: |-
  Urraca PDF es un editor de PDF para escritorio Windows pensado para que tus documentos nunca salgan de tu computadora.
  Todo el procesamiento se ejecuta 100% en local, sin anuncios, sin marcas de agua y sin subir archivos a servidores externos.

  Funciones principales:
  - Edición directa de texto e imágenes respetando fuentes y diseño original
  - Conversión local entre PDF, Word e imágenes
  - Organización de páginas: unir, dividir por peso o páginas, reordenar, girar y eliminar
  - OCR local para convertir escaneos en texto buscable y editable
  - Protección y censura permanente de datos confidenciales, contraseñas y permisos
  - Firma de documentos, formularios, sellos, marcas de agua y foliador
  - Procesamiento por lotes y escaneo directo TWAIN
