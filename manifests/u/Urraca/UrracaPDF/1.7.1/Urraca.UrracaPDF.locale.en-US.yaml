ShortDescription: Offline Windows PDF tool to merge, split by size, OCR, redact, sign, stamp, extract tables, and convert to Word locally.
Description: |-
  Urraca PDF is a native Windows desktop PDF application built so confidential documents never leave your computer.
  All operations run locally on your PC with zero cloud uploads and no ads.

  Core features:
  - Organize pages: merge, split by page range or target file size (MB), extract, reorder, rotate, crop margins, and remove blank or duplicate pages
  - Convert and extract: convert PDFs to Word or images, extract tables, export text to Markdown or JSON, compress, and save as PDF/A
  - Local OCR and scanning: recognize text offline in scanned PDFs and photos, scan via TWAIN, and place two-sided ID cards onto one page
  - Protect and redact: permanently redact text or regions (single or whole-document), strip metadata, run pre-share risk checks, and set passwords
  - Sign, forms, and stamps: apply visual or digital signatures, fill and create form fields, add watermarks, stamps, headers/footers, and Bates/folio numbering
  - Annotate and edit: highlight, comment, insert text/images/shapes, make quick text edits on supported PDFs, and run multi-file batch operations
