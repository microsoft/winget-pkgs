ShortDescription: Privacy-first offline PDF editor, converter, and OCR tool for Windows.
Description: |-
  Urraca PDF is a native Windows desktop PDF editor designed so your files never leave your computer.
  All processing runs 100% locally on your CPU with no cloud uploads, no ads, and no watermarks.

  Core features:
  - Edit text and images directly inside PDFs while preserving fonts and layout
  - Convert between PDF, Word, and images locally
  - Organize pages: merge, split by size or page count, reorder, rotate, and delete
  - Local OCR: convert scanned documents and photos into searchable, editable text
  - Protect and redact: permanently redact sensitive text/areas, encrypt with passwords, and set permissions
  - Sign and stamp: digital signatures, form filling, flattening, watermarks, and Bates numbering
  - Batch processing and direct TWAIN scanner capture
