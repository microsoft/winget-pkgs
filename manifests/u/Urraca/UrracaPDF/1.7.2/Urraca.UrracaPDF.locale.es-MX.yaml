ShortDescription: Herramienta PDF offline para Windows con OCR local, firma, censura, foliador, extracción de tablas y conversión a Word.
Description: |-
  Urraca PDF es una aplicación PDF nativa para escritorio Windows pensada para que tus documentos confidenciales nunca salgan de tu computadora.
  Todas las operaciones se ejecutan en local, sin subir archivos a la nube y sin publicidad.

  Funciones principales:
  - Organizar páginas: unir, dividir por páginas o por tamaño objetivo (MB), extraer, reordenar, girar, recortar márgenes y quitar páginas en blanco o duplicadas
  - Convertir y extraer: convertir PDF a Word o imágenes, extraer tablas, exportar texto a Markdown o JSON, comprimir y guardar en PDF/A
  - OCR local y escaneo: reconocer texto sin internet en PDF escaneados y fotos, escanear por TWAIN y acomodar credenciales en una hoja
  - Proteger y censurar: censura permanente individual o en todo el documento, limpiar metadatos, analizar riesgos antes de compartir y cifrar con contraseña
  - Firmar, formularios y marcas: firma visual o digital, llenar y crear campos, marcas de agua, sellos, encabezados/pies y foliador/paginador
  - Anotar y editar: resaltar, comentar, añadir texto, imágenes o formas, realizar ajustes puntuales de texto en PDF compatibles y procesar por lotes
