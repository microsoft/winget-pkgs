PackageIdentifier: XVSHIFU.myEnv
PackageVersion: 0.1.0
PackageLocale: en-US
ShortDescription: A command-line tool to inspect and manage development environments, with Node.js / Python package and tool management.
Description: myEnv is a development-environment manager with a Windows TUI and CLI. It keeps machine, myEnv toolchain, and per-project scopes clearly separated, manages Python, Node.js, Java, Go, and Rust versions, and provides pip / uv and npm / pnpm entry points to query, install, update, and remove packages and tools.
