Description: TokenTracker is an accurate, local-first token usage and cost dashboard for 29 AI coding tools including Claude Code, Codex, Cursor, Gemini, and Qoder. It automatically collects token usage and aggregates everything locally, with a desktop pet, 4 native widgets, and 15 achievement tracks. No cloud account, no API keys, no setup. The Windows app runs as a system-tray companion that never reads your prompts.
