ShortDescription: A brand-new shell connection hub and remote file manager
Description: XPipe is a new type of shell connection hub and remote file manager that allows you to access your entire sever infrastructure from your local machine. It works on top of your installed command-line programs that you normally use to connect and does not require any setup on your remote systems.
Moniker: xpipe-portable
Tags:
- remote
ReleaseNotes: |-
  • Fix Bitwarden login dialog to have support for various possible login methods
  • Fix Bitwarden integration not working properly for flatpak installs
  • Fix Bitwarden config handling to work on system default config file (probably requires a re-login from XPipe)
  • Fix temporary files not being cleaned properly
  • Fix tailscale connections that were temporarily not accessible being removed on refresh
  • Fix netbird profile switch not working properly
  • Fix SSH config file parsing failing when | was used to denote aliases even though it is not supported by OpenSSH
  • Fix category dnd organization sometimes not refreshing parent data, leading to invalid ordering
  • Fix ordering of cloned connections placing them at the top
  • Fix LXD and incus entries dropping project information on edit
  • Fix various quoting issues for commands
  • Fix various context menus not refreshing properly on changes and requiring a restart
  • Fix identity SSH key file setting none not disabling keys in a config file
  • Fix role-based vault unlock not showing error dialog on a role secret mismatch
  • Fix restricted role list display for connections not updating properly
  • Fix mstsc option to remove new security dialog not being shown properly
  • Fix WezTerm integration on macOS not working properly
  • Fix Proxmox and HyperV VM stop actions not working properly
  • Fix file browser timestamps mixing up AM and PM
  • Fix cached identity sudo passwords not being reset on identity modifications
  • Fix tar compress action adding items in subdirectories multiple times
  • Fix MCP command that exits shell freezing the session until a restart
  • Fix SSH config value for IdentityAgent not properly being overridden
  • Fix macOS app styling to be more consistent
  • Fix various performance issues
  • Fix various missing translations
  • Fix various NullPointers


