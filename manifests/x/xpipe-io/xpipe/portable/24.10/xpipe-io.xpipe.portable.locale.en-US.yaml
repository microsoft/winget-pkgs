ReleaseNotes: "## Changes\n\n• Docker and Podman containers now show how long they have been running or how long ago they exited,\n  along with their health status if a health check is configured. The uptime is now automatically adjusted,\n  so it doesn't need an explicit refresh anymore.\n• Docker compose services now also show their uptime and health status\n• The available shells scan is no longer preselected in the scan dialog, and the SSH config scan is only preselected for the local machine\n• The Claude Code MCP setup command in the settings now also shows how to add the server for all directories\n\n## Fixes\n\n• Fix Docker containers not showing the standard system information like other connections\n• Fix the daemon connection failures when external API requests are enabled on macOS\n• Fix special characters in file paths being mangled for pure SFTP connections\n• Fix dragging a category onto itself or one of its subcategories causing errors\n• Fix old <v24 categories without a saved order not being reorderable relative to each other (this might reorder categories from old vaults once)\n• Fix categories with an empty name breaking the MCP tools\n• Fix various NullPointers\n\n\n## Downloads\n\nYou can find all downloadable artifacts below attached to this release. For installation instructions, see the [installation guide](https://docs.xpipe.io/guide/installation).\n\nAll artifacts are signed by [Christopher Schnick (BBDA 885A DD3E 0AD0)](https://xpipe.io/signatures/0xDD3E0AD0.asc)"
