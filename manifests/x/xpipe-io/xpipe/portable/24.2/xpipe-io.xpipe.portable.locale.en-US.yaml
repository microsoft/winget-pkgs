ReleaseNotes: "• Fix connection launches getting stuck on some Windows systems\n• Git sync merge conflict messages will now show the respective connection names for the files\n• Connections that are named as IPv4 addresses will now sort numerically when alphabetical sorting is enabled\n• Add new buttons to force stop/kill in addition to the normal stop action for connection types that support them\n• Update post migration dialog to emphasize that the new migrated vaults should not be opened in v23.9 and older to prevent corruption issues\n• Add recognition and interface control features for Juniper devices.\n  If you have some Juniper devices, you will have to add them as new connections (not marked as limited devices) to make it work\n• Fix category hover highlighting making it difficult to reorder them properly\n• Fix some dialog buttons flickering\n• Fix shutting down application window not responding to close events in case it got stuck\n• Fix category deletion making UI unresponsive for a while\n• Fix Warp terminal being selected by default even after it is uninstalled due to registry leftovers (Thanks to @Leo145x for the PR)\n• Fix various NullPointers\n\n\n## Downloads\n\nYou can find all downloadable artifacts below attached to this release. For installation instructions, see the [installation guide](https://docs.xpipe.io/guide/installation).\n\nAll artifacts are signed by [Christopher Schnick (BBDA 885A DD3E 0AD0)](https://xpipe.io/signatures/0xDD3E0AD0.asc)"
