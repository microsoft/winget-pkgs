ShortDescription: "One key per app: launch, focus, cycle, or toggle windows across macOS, Windows, and Linux."
Description: |-
  One key per app. Press a hotkey and beckon launches the app if it is closed, focuses it if it is open, cycles its windows if you are already there, toggles back to the previous app, or hides it. Ships with both the `beckon` CLI and the `beckon-serve` system tray hotkey daemon.
