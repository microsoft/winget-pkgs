ReleaseNotes: |-
  这一版改进了文件粘贴与回复展示，扩展 Claude Code 和 Codex 的使用体验，并支持更大、更高清的工作区背景图。
  新增
  - Claude Code 新增「显示 Claude 的思考摘要」开关，可在智能体设置中开启，查看推理过程的摘要说明。
  - Codex 支持在聊天输入框显示后续问题建议，自动化等无人输入场景则跳过生成建议，减少额外模型请求。
  - Codex 内置模型列表新增 GPT-6.1 Terra，并适配对应的上下文用量显示。
  改进
  - 桌面端粘贴文件和文件夹更加可靠，从文件管理器复制后即可添加为智能体可访问的附件，右键「粘贴」同样适用。
  - Claude Code 技能在 / 菜单中更容易辨认，聊天、自动化和任务编辑器均显示技能图标，有来源路径时还可悬停查看。
  - Codex 运行中收到的补充要求可以直接引导当前任务，等待授权期间发送的消息则排队保留。
  - 工作区背景图上限提升至 64 MiB、1 亿像素，同时延长大图传输和壁纸下载的等待时间。
  - 回复开头的文字与后续执行步骤衔接更加自然，从等待状态切换到首段回复时也更平滑。
  - Claude Code 适配器更新至 claude-agent-acp 0.99.1，Codex 适配器更新至 codex-acp 2.5.0。
  - Antigravity 更新至 1.4.4，支持读取最大 16 MiB 的文本文件，避免查看超过 2 MiB 的文件时失败。
  - ZCode 适配器更新至 0.79.1，改进请求重试与失败提示，重试未成功时仍可在原会话中重新发送。
  修复
  - Claude Code 可以正确接收粘贴的 PDF，并在历史中保留附件展示，仅发送附件时也不会重复显示消息。
  - 修复 Claude Code 跨工作目录分叉会话失败的问题，并在登录过期时提供重新登录入口。
  - Codex 历史会话保留可点击的文件引用，并为 ChatGPT 工作区连接失败提供更清晰的说明。
  - 修正 Codex 对 Google Cloud Vertex AI 的配置处理，避免绑定供应商或切换 WebSocket 设置时写入不兼容的配置。
  - Command Code 更新至 1.88.2，修复全新安装后可能无法启动的问题。
  - Qoder 更新至 1.1.81，等待授权时点击停止会正确结束对应工具调用，历史记录中的空模型字段也不会再覆盖原有模型名称。
  注意
  - Qoder 后台子智能体完成后的后续回复，目前需要重新打开会话才能查看，暂时无法实时显示。
