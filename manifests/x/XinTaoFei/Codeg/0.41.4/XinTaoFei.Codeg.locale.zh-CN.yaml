ReleaseNotes: |-
  这一版改进了行内公式的渲染，修复了远程工作区终端输出重复的问题，让执行过程时间线更易阅读，并更新了五个智能体。
  新增
  - ZCode 支持用 /rename 重命名当前会话，codeg 中的会话标题会同步更新，你自己改过的标题不会被覆盖。
  - OpenCode 自动压缩前预留的空间可以按上下文窗口占比填写，例如 20%，也可以继续填写 token 数。
  改进
  - 恢复后的委派在执行过程时间线中显示为委派行，并带有已恢复标记和恢复原因。
  - 探索分组里的读取和搜索步骤改用与命令行一致的布局，非文字步骤的次要文字也更加清晰。
  - OpenCode 更新至 2.2.5，CodeBuddy 更新至 2.179.2，Kimi Code 更新至 2.4.1，Antigravity 更新至 1.4.5，ZCode 桥接更新至 0.82.0。
  - Kimi Code 支持读取最大 16 MiB 的文本文件，查看超过 2 MiB 的文件时不再失败。
  修复
  - $T$ 这类单美元符号行内公式现在可以正常渲染，金额、Shell 变量和代码内容仍按原样显示。(#1081, @xy3xy3)
  - 在远程工作区打开其他窗口时，终端输出不再重复显示，打开导入本地会话的窗口也是如此。(#1085, @xyalter)
  - OpenCode 历史会话中的后台命令和图片生成卡片会显示最终结果，不再一直停留在运行中。
  注意
  - OpenCode 的 /goal、/init、/review 命令发出后暂时看不到执行进度，如果中途需要授权，会话可能停止响应。
  - OpenCode 后台命令和图片生成的结果需要重新打开会话才会显示，运行期间暂时无法实时看到。
