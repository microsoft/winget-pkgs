ReleaseNotes: |-
  这一版里，「无限会话」更名为「无限画布」，而且可以建任意多个画布，从卡片列表里打开。Codex 升级到 2.0.1 适配器，GPT-6.1 Sol 成为默认模型；智能体有比 codeg 推荐版本更新的发布时，设置页里也能直接升级过去。
  同期还有：自定义过的 Codex 模型列表会自动补上新的官方模型，待办任务的基准分支会显示 HEAD 和它所在的分支。
  新增
  - 「无限会话」更名为「无限画布」，可以建任意多个画布——打开后先是卡片列表，每张卡片预览一个画布，可以搜索、新建、编辑（名称、描述、颜色）或删除；你原有的画板会保留为「未命名画布」。
  - Codex 用上了 GPT-6.1 Sol，并以它为默认模型——随 Codex CLI 0.159.2 而来，排在输入框模型选择器的第一位。
  - 智能体有比 codeg 推荐版本更新的发布时，可以直接升级过去——「设置 → 智能体」的版本状态里会出现琥珀色的「升级到未经审查的最新版本 X」按钮，安装前会先请你确认；原来标作「远程」的版本也改称「推荐」。
  改进
  - 内置智能体版本更新： Codex ACP 2.0.1（Codex CLI 0.159.2）。
  - 自定义过的 Codex 模型列表，会在安装或升级 Codex 时自动补上新的官方模型，并按 Codex 自己的顺序排列，不必再手动刷新列表、重新保存。
  - 待办任务的「基准分支」保持默认时，会显示「HEAD」和项目文件夹当前所在的分支，不再只是一行灰色的「当前分支」。
  注意
  - 「适配器版本」设置已移除——原先设为「最新版（未经审查）」的智能体，安装和升级都会回到推荐版本；想用最新版时，请点「升级到未经审查的最新版本」。
  - 从没选过模型的 Codex 会话，现在会使用 GPT-6.1 Sol——如果你给 Codex 用的模型供应商还不支持它，请在输入框里选一个模型，或在该供应商的「模型」一栏填上。
