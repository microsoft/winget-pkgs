ReleaseNotes: |-
  这一版让回复生成和执行过程的展示更加流畅，减少后台任务对聊天空间的占用，并修复 Kimi Code 和 CodeBuddy 的会话问题。
  改进
  - 回复生成过程更加顺畅，文字逐步呈现，消息、执行步骤、命令输出和最终结果自然衔接，并遵循聊天动画与系统减少动态效果设置。
  - 后台任务支持收起为显示任务数量的一行，任务较多时可在固定高度内滚动查看，为对话留出更多空间。
  - 「执行过程」标题更好地融入聊天主题和工作区背景图，鼠标悬停时的反馈和文字也更清晰。
  - 同步更新 CodeBuddy 至 2.177.1、Kimi Code 至 2.4.0、Command Code 至 1.88.1，以及 ZCode 适配器至 0.78.0。
  - ZCode 支持使用 GLM Coding Plan API 密钥连接，可沿用桌面端保存的密钥，也可在终端单独配置。
  - Command Code 处理多图会话更加可靠，请求过大时会自动缩减图片内容或压缩上下文后重试。
  修复
  - 流式回复中的段落、列表和代码块保持一致的排版，减少生成过程中及回复完成时的闪烁和位置跳动。
  - 回复进入后续步骤后，旧命令组不会再误显示为当前执行步骤，后台命令仍会保留实际运行状态。
  - 快速展开和收起「执行过程」时能正确响应点击，不会再意外选中文字并弹出复制提示。
  - 修复 Kimi Code 计划模式在首次调用工具时意外结束的问题，智能体可以正常继续收集信息并制定计划。
  - 修复 CodeBuddy 停止后丢失下一条排队消息，以及后续已完成回复被误标为取消的问题。
