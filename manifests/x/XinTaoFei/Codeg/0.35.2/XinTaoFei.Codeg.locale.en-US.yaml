ReleaseNotes: |-
  This one opens PDF files right in a file tab, lets the repository panel turn issues and pull requests into to-dos on its own, and flashes the taskbar or bounces the Dock when an agent needs you. Token Usage now estimates what your tokens would cost at API list prices, and Claude Code moves up to 0.90.0 and Kimi Code to 2.2.0, along with six more bundled agents.
  Alongside that: a draft can switch agents while it is still connecting, built-in browser pages on Linux stay inside the workspace window, Office previews keep their place across tab switches and wait for slow documents, message navigation reaches the whole conversation, the back gesture on phones closes what you opened instead of leaving codeg, and agents stop polling for your feedback in a loop.
  New
  - PDF files open in a built-in viewer in file tabs, the conversation's file viewer and canvas file cards, with zoom, fit to width, a page field, find, and a password prompt for protected files.
  - The repository panel can turn issues and pull requests into to-dos on its own: under Panel settings → Auto-processing, have it scan on a schedule or on webhook events from GitHub, GitLab, Gitea or Forgejo and pick items by label and author, and it handles each item only once.
  - The desktop app flashes its taskbar button or bounces its Dock icon when an agent needs you while you are in another window, on the same events as desktop notifications such as a finished turn, a permission request or a question, and Settings → General → Taskbar and Dock alerts sets each event to Off, Briefly or Until you return.
  - Token Usage estimates what your tokens would cost at API list prices, for the selected range and for each model, with input, output, cache reads and cache writes priced separately from the models.dev catalog. (#503, @Adam-Dalloul)
  - You can choose which tabs the @ mention panel shows and in what order under Settings → General → Mention panel, in the message box and the to-do and automation editors alike, with the Files tab always shown.
  - To-dos can be searched by keyword, and #12 finds the task or issue with that number.
  - The file preview header has a download button next to its ⋮ menu in the web version and in remote workspace windows, and it works for files outside your workspace folders too, such as an agent's output in /tmp. (#953, @ker2xu)
  Improved
  - Updated bundled agents: Claude Code ACP 0.90.0 (Claude Code 2.1.296), Kimi Code 2.2.0, OpenCode 1.19.0, Antigravity 1.4.0, Hermes 0.22.0, Cline 3.0.71, Grok 1.0.52, Qoder 1.1.71.
  - Issue tasks check the report before acting: with Fix / implement or Plan first, when the report can't be reproduced, is already fixed, comes from the reporter's environment or describes intended behavior, the agent changes no code, writes no plan and gives its verdict in the first line of its reply.
  - Message navigation covers the whole conversation, listing every message with its number and the files it changed, and picking one that hasn't loaded yet loads history up to it and jumps there.
  - A draft conversation can switch to another agent while the one you picked is still connecting, in chat tabs and canvas draft cards alike, and the last agent you pick is the one that connects, with any startup error shown in the message box. (#963, @ker2xu)
  - Sub-agent cards in Claude Code and Qoder show the sub-agent's thinking, text and tool calls in the order they happened, with thinking folded as in the main conversation, and a finished sub-agent folds all of it into one "Sub-agent activity" line with its duration. (#917, @Liang-HZ)
  - When a Qoder turn breaks off while its sub-agent runs to the end, the sub-agent's card shows the result it finished with. (#917, @Liang-HZ)
  - Qoder can ask you questions with its own question tool, on the same question card other agents use. (#915, @Liang-HZ)
  - The model list under Agent defaults in Settings → Collaboration is grouped by provider, like the model picker in the message box, so same-named models from two providers can be told apart. (#947, @Liang-HZ)
  - The web version caches itself in your browser, so a tab the browser put to sleep reloads without downloading codeg again, and a reload while the server is restarting or offline shows codeg's connection screen instead of the browser's error page. (#924, @leehom0123)
  - Claude Code's Read card shows an "Over size limit" badge when it reads a file past the usual size limit.
  - Claude Code's Bash and Grep cards show the description and output mode that actually ran, even when the model misnames those arguments.
  - The built-in model catalog is refreshed with 8,831 models from 229 providers, up from 8,414, and now carries cache prices, so cost estimates still price cache tokens when models.dev can't be reached.
  Fixed
  - On Linux, built-in browser pages show inside the workspace window, on X11 and Wayland alike, instead of in a separate window. (#961, @bigFish0124; #937 reported by @lwxk)
  - After Claude Code reads a large image, the rest of its reply no longer shows up twice until you reload, and neither does a reply it picks back up mid-turn, as after reaching its output limit. (#956, @nnnmdzz)
  - Agents stop calling check_user_feedback over and over when you have sent no feedback, and after you answer their question they get on with the task instead of asking again whether to proceed. (#926, @Frank-zhu2000; #861 reported by @yl-3307)
  - A to-do whose turn ends on an agent error, such as the upstream 400 after a cut-off tool call, now fails with the agent's own message, instead of quietly moving to To review or saying only that the agent stopped. (#945, @Frank-zhu2000; #538 reported by @pia)
  - A draft switched to another agent no longer acts through the previous agent's connection before the new one is up: a canvas draft card no longer sends your message to the old agent, and a setting you change no longer lands on the old agent as its saved preference.
  - Disconnecting an agent that is still starting up now stops it at once, as when you switch a draft to another agent, instead of letting it finish starting up in the background.
  - Conversations open with their messages when an agent's environment variables move its data folder, such as CLAUDE_CONFIG_DIR or CODEX_HOME set in its settings, and importing finds them too, instead of opening empty. (#948 reported by @lfabay)
  - A Windows desktop window connected to a codeg-server in WSL no longer stays on "Connection lost", as the connection now tries the next address when one never answers. (#930 reported by @stlyx)
  - Typing no longer lags while several tiled conversations stream at once, or while an expanded sub-agent card is still running. (#935 reported by @miyling)
  - Live previews of Word, Excel and PowerPoint files no longer fail when OfficeCLI takes more than 8 seconds to start, as it can on a cold start or with a large document, and quitting codeg while one is still opening no longer blocks that file's preview for the next five minutes. (#954, @ker2xu)
  - Switching back to a Word, Excel or PowerPoint tab shows its live preview as you left it, instead of starting it over and reloading the document.
  - On phones, the back gesture closes the file, drawer or viewer you opened, one layer at a time, instead of leaving codeg. (#940, @leehom0123)
  - Question cards from Claude Code's and Qoder's own question tool show the answers you picked, multi-select ones included, instead of "No selection". (#927, @Liang-HZ)
  - Qoder conversation details show the model you switched to last instead of the one the conversation started with, and Qoder's token usage now includes what its sub-agents spent, with existing conversations recounted. (#914, @Liang-HZ)
  - Kimi Code conversations reopened from history read as they did live: attachments show as badges and thumbnails instead of raw <resource> text, slash commands show as you typed them, and a turn Kimi starts on its own no longer shows its internal prompt as your message.
  - Kimi Code conversation titles no longer include attachment text or switch between two versions.
  - Jumping to a message no longer snaps back to the bottom while a reply streams in or older messages load, whether you jump from Message navigation or from a reply back to its prompt.
  - Grok's plan approvals now raise a desktop notification, as other permission requests do.
  - Terminal commands an agent started are now stopped however its connection ends, also when it ends during startup or while a terminal is still being created, instead of being left running.
  - On Windows and Linux, two downloads of the same link in the built-in browser no longer get mixed up when they finish.
  - Switches no longer slide out of their track in Arabic.
  Note
  - Taskbar and Dock alerts are on by default and skip the window you are already looking at, and you can turn them off under Settings → General → Taskbar and Dock alerts.
  - Cost estimates in Token Usage use base API list prices without long-context or reasoning surcharges, so they are not what a subscription plan bills, and models with no published price are left out, with the share of tokens priced shown beside the total.
  - Auto-processing only picks up items opened or updated after you switch it on, unless you choose to include existing ones, and the desktop app receives webhooks only while its web service is running, which you start under Settings → Web Service.
  - The web version's cache works only over HTTPS or on localhost, where browsers allow it, and the desktop app doesn't use it.
  - Antigravity 1.4.0 lists one model per family, with the variant picked in a separate thinking level option, and the model you chose before the update carries over.
  Thanks to @Liang-HZ, @ker2xu, @Frank-zhu2000, @leehom0123, @Adam-Dalloul, @nnnmdzz and @bigFish0124 for contributing to this release, and to @lwxk, @yl-3307, @pia, @lfabay, @stlyx and @miyling for the reports.
