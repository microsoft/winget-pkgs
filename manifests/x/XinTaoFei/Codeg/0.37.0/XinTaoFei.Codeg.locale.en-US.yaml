ReleaseNotes: |-
  This one adds TRAE CLI and Command Code as built-in agents, lets a Claude Code session continue on your phone with Remote Control, and has Claude Code suggest your next prompt. The side panel gains Automations, To-dos, Issues and Pull requests tabs and now holds Agent Plan and Message navigation, the model and option pickers under the message box merge into one button, and Claude Code moves up to 0.93.0 along with seven more bundled agents.
  Alongside that: a sub-agent waiting on you can be answered right where it was delegated, images in replies show even when they are outside the conversation's folder, a reply that arrives just as a turn ends is no longer lost, switching Cline's model mid-conversation takes effect, saving a Cursor MCP server in codeg keeps Cursor's own settings, and computer use moves to cua-driver 0.36.0.
  New
  - ByteDance's TRAE CLI is now a built-in agent: codeg runs the traecli you installed, with its mode, model and reasoning effort pickers in the message box, its MCP servers and skills managed from codeg's settings, delegation, and history for the conversations you run in codeg, while its settings page offers Upgrade and an optional personal access token for servers and Docker. (#933 requested by @lwxk)
  - Command Code is now a built-in agent: install it from Settings → Agents and sign in once with command-code login or save an API key, and codeg runs it with its mode, model and effort pickers in the message box, its MCP servers and skills managed from codeg's settings, delegation, and history for the conversations you run in codeg. (#951 requested by @terranc)
  - Claude Code's Remote Control works in codeg: send /remote-control in a Claude Code conversation, and a strip above it shows the session's claude.ai/code link and a QR code for picking it up in the Claude app or a browser, with a Turn off button, while the session stays connected even after you close its tab.
  - Claude Code suggests your next prompt: after a turn, the empty message box shows in grey what Claude expects you to ask next, and Tab fills it in without sending.
  - The side panel gains Automations, To-dos, Issues and Pull requests tabs for the project of the conversation you're in, where you can check its automations and their runs, work through its to-do board, and browse its issues and pull requests (merge requests on GitLab), with Open full page one click away.
  - Agent Plan and Message navigation move from the corner of the conversation into the side panel's Session Details tab, which opens with a card showing the title, agent, status, model, Git branch and copyable session IDs, while the plan shows its progress step by step, even when folded.
  - Message navigation follows the message you're reading, and clicking a message jumps there and opens it to show the sub-agents its round ran, as cards that open their conversations, and the files it changed, each with an inline or side-by-side diff.
  - A sub-agent that needs you can be answered in the conversation that delegated to it: its "Waiting for task result" row opens by itself with the permission, question or plan approval inside, and its badge turns from awaiting approval to checked once you answer. (#973 reported by @lwxk)
  - The model, mode and other options under the message box merge into one button that lists the current settings separated by "/", leaving out options still on their default, and clicking it opens one panel where you change each setting in place, with search for long lists such as models.
  - The automation and to-do editors show an agent's settings with the same button and panel, instead of a dropdown for each option.
  - A folder group in the sidebar can open or clone a folder straight into itself: hover its heading for Clone Repository and Open Folder, and the new folder lands in that group, which expands to show it.
  Improved
  - Updated bundled agents: Claude Code ACP 0.93.0 (Claude Code 2.1.300), OpenCode 1.19.3, Cline 3.0.73, CodeBuddy 2.168.2, Grok 1.0.62, Cursor 2026.10.16, Qoder 1.1.73, Antigravity 1.4.1.
  - Computer use moves to cua-driver 0.36.0, which codeg downloads the next time it is needed, and on Linux taking a screenshot no longer forces an agent to read the window again before it can click.
  - The sidebar's tag filter moves into View options as its first entry, in place of the funnel button at the top of the sidebar.
  - Clicking the side panel tab that is already showing hides the panel, and on phones tapping the selected tab closes the drawer.
  - A new automation starts in the folder the Automations page is filtered to, instead of always the first open folder.
  - The sidebar no longer marks conversations whose worktree was removed, and hovering one still shows its original path.
  - The built-in model catalog is refreshed with 8,897 models from 230 providers, up from 8,894.
  Fixed
  - Images in a reply show even when they are outside the conversation's folder, such as a login QR code an agent saved in /tmp, instead of a broken-image icon. (#978 reported by @wuzhaozhongguo)
  - In the desktop app, a sub-agent that is already waiting on you shows its request in a window that reloads or opens later, instead of the request never reaching it. (#973 reported by @lwxk)
  - A reply that arrives just as a turn ends stays in that turn, instead of occasionally going missing with the turn reported as ending "without producing any response".
  - Expanding a to-do's progress or completion report in its conversation shows the full text, formatted, with a line saying whether it was recorded on the to-do, instead of a bare {"recorded":true} from Claude Code and Codex.
  - Switching Cline's model after the first message now takes effect, as does the model codeg reapplies when you reopen a Cline conversation, instead of requests staying on the old model while the picker showed the new one.
  - Cline stays on the version codeg installed, instead of updating itself to its latest release once a conversation closes.
  - Cline conversations keep the time they actually ended, instead of jumping to the top of the sidebar with the time Cline was next started.
  - Saving a Cursor MCP server in Settings → MCP, or installing it again from the MCP Marketplace, keeps the settings Cursor adds itself, such as envFile, auth and tls, and an SSE server stays SSE instead of turning into HTTP.
  - Cursor-only MCP settings no longer spread to other agents when codeg writes a server into their configs, where Cursor's auth made OpenClaw reject its whole config and pi skip the server.
  - Slash commands with a colon in their name now show as one command in the message box, such as Qoder's new sites: commands, and reach the agent exactly as named.
  - On the Automations page, the detail pane follows the folder filter instead of showing an automation from another folder, and a folder closed in the sidebar shows its name in the filter instead of a number.
  Note
  - TRAE CLI 2.0 is available only on TRAE Enterprise's flagship plan, and codeg runs the traecli you install with TRAE's own installer, signed in with traecli login.
  - Command Code needs Node.js 22 or later, and models you add to Command Code yourself can't be picked in the message box, as it lists only its own catalog there.
  - TRAE CLI's and Command Code's first integrations leave some things out: conversations from their own terminals can't be imported yet, one you set up as a custom agent stays separate with its own history, and so far both have been tested on macOS only.
  - With Claude Code ACP 0.92.0 and later, Claude Code makes one more request after most turns to predict your next prompt, mostly read from the prompt cache but still counted in your usage, while automations and chat channel bots skip it.
  - Remote Control needs Claude Code signed in with a claude.ai subscription and talking to api.anthropic.com, so it isn't available through a gateway or a custom ANTHROPIC_BASE_URL.
  - The Session Details tab no longer shows token usage or the created and updated times, which the Session Details dialog, opened from a conversation's menu, still shows.
  - Cline applies Plan or Act only when it starts working on a conversation, so switching modes after the first message has no effect until Cline changes that.
  - CodeBuddy 2.168.2 runs every step of a conversation started in its own terminal through a single REPL tool, so such a conversation shows one REPL card per step in codeg, while conversations you start in codeg aren't affected.
  - On macOS, a codeg that opens at login may not come back after an update started from 0.35.2 or earlier, so click its Dock icon to open it, while updates started from 0.36.0 or later aren't affected.
  Thanks to @wuzhaozhongguo, @lwxk and @terranc for the reports.
