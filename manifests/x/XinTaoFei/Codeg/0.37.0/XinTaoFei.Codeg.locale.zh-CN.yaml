ReleaseNotes: |-
  这一版新增了 TRAE CLI 和 Command Code 两个内置智能体，可以用 Claude Code 的远程控制在手机上接着聊同一个会话，Claude Code 还会预测你的下一条提示词。右侧面板新增了自动化、待办任务、议题和拉取请求四个标签页，计划任务和消息导航也挪进了面板的「会话详情」，输入框下方的模型和各项选项合并成了一个按钮，Claude Code 升级到 0.93.0，另有七个内置智能体更新了版本。
  同期还有：等你处理的子智能体可以直接在发起委派的会话里批准，回复里会话文件夹以外的图片也能显示了，回合结束瞬间到达的回复不会再丢失，Cline 会话中途切换模型能生效了，在 codeg 里保存 Cursor 的 MCP 服务器会保留 Cursor 自己的设置，电脑操作改用 cua-driver 0.36.0。
  新增
  - 字节跳动的 TRAE CLI 成为内置智能体——codeg 直接运行你安装好的 traecli，输入框里可以选模式、模型和推理强度，MCP 服务器和技能可以在 codeg 的设置里管理，支持委派，在 codeg 里进行的会话也会留下历史记录；设置页里可以「升级」，还能填写可选的个人访问令牌，方便在服务器和 Docker 上使用。（#933 由 @lwxk 提出）
  - Command Code 成为内置智能体——在「设置 → 智能体」里安装，用 command-code login 登录一次或填上 API 密钥后，codeg 就能运行它：输入框里可以选模式、模型和推理强度，MCP 服务器和技能可以在 codeg 的设置里管理，支持委派，在 codeg 里进行的会话也会留下历史记录。（#951 由 @terranc 提出）
  - Claude Code 的远程控制（Remote Control）可以在 codeg 里用了——在 Claude Code 会话里发送 /remote-control，会话上方会出现一条提示栏，显示本会话的 claude.ai/code 链接和二维码，可以在 Claude App 或浏览器里接着聊，栏上还有「关闭」按钮；远程控制开着时，即使关掉标签页，会话也会保持连接。
  - Claude Code 会预测你的下一条提示词——回合结束后，空着的输入框里会用灰字显示 Claude 猜你接下来要说的话，按 Tab 就能填入，不会直接发送。
  - 右侧面板新增「自动化」「待办任务」「议题」「拉取请求」四个标签页，内容跟随当前会话所在的项目：可以查看项目的自动化和运行记录、处理待办任务看板、浏览议题和拉取请求（GitLab 上是合并请求），每个标签页都能一键「在完整页面中打开」。
  - 计划任务和消息导航从会话左上角挪进了右侧面板的「会话详情」，面板顶部是一张信息卡，显示标题、智能体、状态、模型、Git 分支和可复制的会话 ID；计划任务会按步骤显示进度，折叠后也看得到。
  - 消息导航会跟着你正在看的消息走，点一条消息会跳过去并展开，列出这一轮跑过的子智能体和改过的文件——子智能体卡片可以打开它的会话，每个文件都能展开看内联或左右分栏的 diff。
  - 子智能体等你处理时，可以直接在发起委派的会话里批准——「等待任务执行结果」那一行会自动展开，里面就是权限请求、提问或计划审批，处理完后徽章会从「待批准」变成「已查询」。（#973 由 @lwxk 反馈）
  - 输入框下方的模型、模式和其他选项合并成了一个按钮——按钮上用「/」分隔列出当前的各项设置，仍是默认值的选项不显示；点开后在同一个面板里逐项调整，模型这类较长的列表还能搜索。
  - 自动化编辑器和待办任务的编辑、设置对话框也改用同样的按钮和面板来设置智能体，不再每个选项一个下拉框。
  - 侧栏的文件夹分组可以直接把文件夹打开或克隆到组里——鼠标悬停在分组标题上会出现「克隆仓库」和「打开文件夹」，新文件夹会放进这个分组，分组折叠着也会自动展开。
  改进
  - 内置智能体版本更新： Claude Code ACP 0.93.0（Claude Code 2.1.300）、OpenCode 1.19.3、Cline 3.0.73、CodeBuddy 2.168.2、Grok 1.0.62、Cursor 2026.10.16、Qoder 1.1.73、Antigravity 1.4.1。
  - 电脑操作改用 cua-driver 0.36.0，下次用到时会自动下载；在 Linux 上，智能体截图后不必再重新读取窗口就能接着点击。
  - 侧栏的「按标签筛选」挪进了「显示选项」菜单，排在第一项，侧栏顶部的漏斗按钮去掉了。
  - 再点一次右侧面板当前选中的标签页会隐藏面板，手机上点抽屉里已选中的标签页会关闭抽屉。
  - 自动化页面按文件夹筛选时，新建的自动化默认放在该文件夹里，不再总是第一个打开的文件夹。
  - 侧栏不再给源 worktree 已删除的会话加标记，鼠标悬停时仍会显示它原来的路径。
  - 内置模型目录已更新，共 230 家供应商的 8,897 个模型（此前 8,894 个）。
  修复
  - 回复里会话文件夹以外的图片也能显示了，比如智能体保存在 /tmp 里的登录二维码，不再显示成破图图标。（#978 由 @wuzhaozhongguo 反馈）
  - 桌面版里，已经在等你处理的子智能体，在刷新后的窗口或之后打开的窗口里也会显示它的请求，不会再一直收不到。（#973 由 @lwxk 反馈）
  - 回合结束瞬间到达的回复会留在这个回合里，不会再偶尔丢失，并报「本轮没有产生任何回复就结束了」。
  - 在待办任务的会话里展开进度或完成汇报，会显示完整内容，按 Markdown 排版，并注明是否已记录到待办任务，Claude Code 和 Codex 的会话不再只显示 {"recorded":true}。
  - Cline 发出第一条消息后切换模型能生效了，重新打开 Cline 会话时 codeg 重新应用的模型也会生效，不再出现选择器显示新模型、请求却还在用旧模型的情况。
  - Cline 会保持在 codeg 安装的版本，不会再在会话关闭后自己升级到最新版。
  - Cline 会话会记下实际结束的时间，不会再在下次启动 Cline 时被改写成那一刻、跳到侧栏最上面。
  - 在「设置 → MCP」里保存 Cursor 的 MCP 服务器，或从「MCP 市场」重新安装，会保留 Cursor 自己加的设置，比如 envFile、auth 和 tls，SSE 服务器也不会再变成 HTTP。
  - Cursor 专属的 MCP 设置不会再被写进其他智能体的配置——以前 Cursor 的 auth 会让 OpenClaw 整份配置失效，pi 也会跳过这个服务器。
  - 名称里带冒号的斜杠命令在输入框里会显示成一个完整的命令，比如 Qoder 新增的 sites: 系列命令，发给智能体的也是原样的命令名。
  - 自动化页面的详情会跟随文件夹筛选，不再显示其他文件夹的自动化；侧栏里已关闭的文件夹在筛选里也会显示名称，而不是编号。
  注意
  - TRAE CLI 2.0 仅向 TRAE 企业版旗舰版套餐客户开放，codeg 运行的是你用 TRAE 官方安装程序装好、并用 traecli login 登录过的 traecli。
  - Command Code 需要 Node.js 22 或更高版本；你自己给 Command Code 添加的模型没法在输入框里选，因为它在那里只列出自家目录里的模型。
  - TRAE CLI 和 Command Code 首期接入还有一些限制——暂不支持导入在它们自己终端里进行的会话；你之前作为自定义智能体配置的版本保持不变，历史记录各自独立；目前两者都只在 macOS 上实测过。
  - 从 Claude Code ACP 0.92.0 起，Claude Code 在大多数回合结束后会多发一次请求来预测你的下一条提示词，这次请求主要读取提示词缓存，但仍会计入用量；自动化和消息渠道机器人的会话不发这次请求。
  - 远程控制需要 Claude Code 用 claude.ai 订阅账号登录、直连 api.anthropic.com，通过网关或自定义 ANTHROPIC_BASE_URL 使用时不可用。
  - 「会话详情」标签页不再显示 Token 用量和创建、更新时间，从会话菜单里的「会话详情」打开的弹窗仍会显示。
  - Cline 只在开始处理会话时应用 Plan 或 Act 模式，发出第一条消息后再切换模式不会生效，要等 Cline 自己改进。
  - CodeBuddy 2.168.2 在它自己终端里新建的会话，每一步都通过同一个 REPL 工具执行，这类会话在 codeg 里会每一步显示一张 REPL 卡片；在 codeg 里发起的会话不受影响。
  - 在 macOS 上设置了开机自启的 codeg，从 0.35.2 或更早版本发起的更新完成后可能不会自动重新打开，点一下程序坞图标即可打开；从 0.36.0 及之后版本发起的更新不受影响。
  感谢 @wuzhaozhongguo、@lwxk 和 @terranc 的反馈。
