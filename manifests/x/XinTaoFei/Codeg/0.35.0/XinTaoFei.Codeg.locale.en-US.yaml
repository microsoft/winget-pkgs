ReleaseNotes: |-
  This one lets agents answer with more than text: turn on Generative UI, and a reply can show cards, tables and other interactive components right in the conversation. The chat column can be widened by dragging its edges, chat animations can be switched off, and a conversation can be maximized while files are open beside it. Claude Code moves up to 0.89.1 and Codex to 2.2.2, along with five more bundled agents.
  Alongside that: the terminal panel comes back after a page reload, a workspace with many tabs opens much faster, remote workspaces keep reconnecting through outages and reopen even while their server is offline, the Open Folder dialog can create a folder, and a failed turn ends with one line saying why.
  New
  - Agents can reply with interactive cards and tables once you turn on "Generative UI (json-render)" under Settings → Skill Packs → UI: start a message with /json-render ($json-render in Codex) or just ask to see something as cards or a table, and the reply renders as live components while it streams.
  - The chat column can be made wider or narrower by dragging its left or right edge, or under Settings → Appearance → Chat width, and double-clicking an edge puts it back to the default. (#911, @sumanx)
  - Chat animations can be switched off under Settings → Appearance, so expanding, collapsing, working indicators and scrolling in the conversation happen instantly, while spinners keep turning. (#911, @sumanx)
  - A conversation can be maximized while files are open beside it, from the Maximize button at the right end of its tab strip, and Restore brings the files back just as you left them.
  - The Open Folder dialog can create a new folder and step into it, so a project can start from an empty folder, in the desktop app and the web version alike. (#881, @Jonathan-Asher)
  - A remote workspace window can open the local workspace from Quick actions in the status bar, the macOS Window menu, or the page shown when its connection fails or expires. (#891, @ker2xu)
  Improved
  - Updated bundled agents: Claude Code ACP 0.89.1 (Claude Code 2.1.293), Codex ACP 2.2.2 (Codex CLI 0.160.1), Cline 3.0.70, CodeBuddy 2.164.0, Grok 1.0.51, Qoder 1.1.67, Hermes 0.21.6.
  - A failed turn ends with one muted line giving the agent's own error in Codex, Claude Code, Cline and Qoder conversations, both as it happens and when you reopen the conversation.
  - A workspace with many open tabs opens much faster, because a tab sitting behind another now loads its conversation the first time you switch to it instead of every tab downloading its conversation at once. (#913, @Flyneen)
  - Resizing the window is smoother, as the workspace no longer runs extra full-page layouts on every step. (#898, @sumanx)
  - Slash commands show the arguments they take in the / menu, the message box's Add menu and the automation editor.
  - Codex answers /mcp with the live status of each MCP server, and /mcp reconnect works there too.
  - Claude Code's Agent card shows the effort a sub-agent was asked to run at, next to its model.
  - Claude Haiku 5.5 is now the suggested Haiku model in Claude Code's settings and in the model provider dialogs.
  - On phones, the web version tints the browser bar and Android's navigation bar to match your light or dark theme, and adding it to the home screen installs codeg as an app with a full-bleed icon, even behind a sign-in proxy. (#863, @eyjohn)
  Fixed
  - Reloading the page or reconnecting no longer loses the terminal panel: its tabs come back with their commands still running and their output in place, and a finished command's output stays until you close its tab. (#830, @dawNotPoi; #749 reported by @kekxv)
  - Claude Code no longer leaves a conversation spinning for hours after you send a message during a turn it started on its own, such as after a background task finished, and that message now gets a single reply. (#893 reported by @Luis-WowApps)
  - Sending Claude Code a message while it is still writing a tool call no longer fails the turn.
  - Messages you send while a Claude Code turn is running now stay in its history, and a background task that finished mid-turn shows its result there instead of looking unfinished.
  - A Claude Code conversation's title no longer flips back and forth between its first and its latest message in the sidebar and in a linked chat channel topic when Claude Code can't generate a title, as behind a gateway that refuses the request.
  - Replies from turns a custom agent starts on its own, such as after a background job, now stay in the conversation after a reload instead of only showing live. (#903 reported by @andrehqh)
  - A custom agent that runs Claude Code's ACP adapter now takes messages inserted into the current turn directly, as the built-in Claude Code does, and those messages stay in its history. (#892 reported by @andrehqh)
  - A remote workspace keeps reconnecting through network outages and shows a notice while it does, instead of giving up after three failed attempts and calling the connection expired, which now happens only when the server rejects the token. (#887, #890, @ker2xu)
  - Remote workspace windows reopen at launch even while their server is offline, and pick up in place once it is back. (#887, #890, @ker2xu)
  - Clicking the Dock icon on macOS brings up the workspace you used last, a minimized remote one included, instead of always the local window, and launching codeg again on Windows and Linux does the same. (#887, #889, @ker2xu)
  - Custom agents from the ACP registry now install on Windows, where most binary entries looked for a doubled name like kilo.exe.exe, and an agent published as a plain executable rather than an archive can be installed too. (#905 reported by @trueai-org)
  - Agents installed with their official installer into ~/.local/bin, such as Hermes, are now found when codeg isn't started from a terminal, instead of showing as not installed. (#888, @Sma1lboy; #875 reported by @toptiersnowman)
  - An OpenCode 2.x installed on your system now connects, as codeg no longer passes it the --port and --hostname options its acp command rejects. (#909, @Liang-HZ)
  - Effort choices now match the model you picked under Agent defaults in Settings → Collaboration and in the to-do and automation editors, instead of following the agent's default model. (#910, @Liang-HZ)
  - Scrolling up while a reply streams no longer pulls you back to the bottom, whether you use the wheel over a code block, touch, the keyboard or the scrollbar. (#899, @Adam-Dalloul)
  - Reordering conversation tabs no longer leaves a tab's transcript blank until you scroll it. (#901, @Adam-Dalloul)
  - In a sent message, a /word or $word shows as a command only when the agent actually offers that command or skill, so paths like /tmp stay plain text. (#902, @Adam-Dalloul)
  - The tab strip no longer squeezes and springs back when you open or close a side panel. (#912, @sumanx)
  - The sidebar, side panel and terminal panel no longer wobble while you resize the window. (#897, @sumanx)
  - Collapsing a thinking block or tool card no longer flashes its content for a frame, and after a click in the conversation, pressing Esc, copying or coming back from another window no longer draws a focus outline around it. (#896, @sumanx)
  - A conversation that fails to load now retries at growing intervals, up to every 30 seconds, with the error and Reload button staying in view, instead of re-requesting nonstop while the error flickers.
  - A conversation no longer stays stuck loading when a background sync or a page of older messages arrives while it loads.
  - Token usage is counted more accurately: Codex no longer counts cache writes as fresh input, with existing Codex conversations recounted, and CodeBuddy totals now include requests that end in a tool call.
  - Cline history no longer shows the messages Cline marks as internal, such as compaction summaries, hook context and the prompt it sends itself after you approve switching to Act mode.
  - Claude Code conversations reopened from history show a 1M context window for models that have one natively, such as Opus 4.7 and later, Sonnet 5 and later, Haiku 5.5, Fable and Mythos, instead of 200K.
  - Backups now include Codex's conversation names, and restoring merges Codex's and Kimi's session lists with what is already there instead of skipping or overwriting them, so restored conversations keep their names and folders.
  - On macOS, computer use presses return after typing into a Chromium or Electron app when the agent asks to submit, instead of treating the typing as failed because the field reads back empty.
  - The desktop app writes its logs to the same folder however it is started, and Settings → Runtime Logs opens the folder actually in use and shows each file's current size. (#893 reported by @Luis-WowApps)
  Note
  - Codex ACP 2.2 needs Node.js 20.3.0 or later, as every message fails on Node.js 20.0 through 20.2, and the environment diagnostics now check the full Node.js version each agent needs rather than only the major version.
  - With Claude Code ACP 0.88.0 and later, a running Monitor no longer shows in the background task strip, so it can't be stopped from there.
  - Generative UI is off by default: agents get the json-render skill in conversations started after you turn it on, turning it off removes the skill from every agent, and a json-render skill of your own is never replaced.
  - A tab restored behind another shows a brief loading state the first time you switch to it, while its conversation loads.
  - The terminal panel comes back after a page reload but not after codeg itself restarts, since a restart ends the terminals' processes and their tabs then report the session as unavailable.
  Thanks to @sumanx, @ker2xu, @Adam-Dalloul, @Liang-HZ, @dawNotPoi, @eyjohn, @Jonathan-Asher, @Sma1lboy and @Flyneen for contributing to this release, and to @kekxv, @toptiersnowman, @andrehqh, @Luis-WowApps and @trueai-org for the reports.
