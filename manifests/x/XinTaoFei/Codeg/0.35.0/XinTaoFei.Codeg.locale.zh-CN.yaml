ReleaseNotes: |-
  这一版让智能体的回复不止是文字：打开「生成式界面」后，回复里可以直接出现卡片、表格等可交互的组件。聊天区域可以拖动边缘调宽，动画可以关闭，旁边开着文件时会话也能最大化。Claude Code 升级到 0.89.1，Codex 升级到 2.2.2，另有五个内置智能体更新了版本。
  同期还有：刷新页面后终端面板会原样回来，标签页很多的工作区打开快多了，远端工作区断网后会一直重连、服务器离线时也能照常恢复窗口，「打开文件夹」对话框可以新建文件夹，回合失败时末尾会用一行文字说明原因。
  新增
  - 智能体可以用交互式卡片和表格来回复了——在「设置 → 技能包 → 界面」里打开「启用 json-render 生成式界面」后，用 /json-render（Codex 里是 $json-render）开头提问，或者直接让它用卡片、表格来展示，回复就会在输出过程中渲染成可交互的组件。
  - 聊天区域的宽度可以调整了——拖动会话列的左右边缘，或在「设置 → 外观 → 聊天区域宽度」里设置，双击边缘即可恢复默认宽度。（#911，@sumanx）
  - 聊天区域动画可以关闭了——在「设置 → 外观」里关掉后，会话里的展开收起、工作状态提示和滚动都会立即完成，只有转圈图标照常转动。（#911，@sumanx）
  - 旁边开着文件时，会话也能最大化了——点会话标签栏最右侧的「最大化」，会话就会占满中间区域，点「还原」后文件原样回来。
  - 「打开文件夹」对话框里可以新建文件夹了，建好后直接进入，方便从一个空文件夹开始新项目，桌面版和网页版都支持。（#881，@Jonathan-Asher）
  - 远端工作区窗口可以直接打开本地工作区了——入口在状态栏的「快捷操作」、macOS 的 Window 菜单，以及连接失败或过期时显示的页面上。（#891，@ker2xu）
  改进
  - 内置智能体版本更新： Claude Code ACP 0.89.1（Claude Code 2.1.293）、Codex ACP 2.2.2（Codex CLI 0.160.1）、Cline 3.0.70、CodeBuddy 2.164.0、Grok 1.0.51、Qoder 1.1.67、Hermes 0.21.6。
  - 回合失败时，末尾会用一行浅色文字给出智能体自己的报错，Codex、Claude Code、Cline 和 Qoder 的会话都支持，实时能看到，重新打开会话后也还在。
  - 开着很多标签页的工作区打开得快多了——挡在其他标签页后面的标签页，要等你第一次切过去时才加载会话，不再一打开就把每个标签页的会话都下载一遍。（#913，@Flyneen）
  - 调整窗口大小更流畅了，工作区不再在每一步缩放时额外做整页布局。（#898，@sumanx）
  - 斜杠命令会显示它接受的参数，/ 菜单、输入框的「添加」菜单和自动化编辑器里都能看到。
  - Codex 的 /mcp 会列出每个 MCP 服务器的实时状态，/mcp reconnect 也能直接在会话里用。
  - Claude Code 的 Agent 卡片会在模型旁边显示子智能体被指定的思考强度。
  - Claude Code 设置和模型供应商对话框里推荐的 Haiku 模型改为 Claude Haiku 5.5。
  - 在手机上使用网页版时，浏览器顶栏和 Android 导航栏会跟随浅色或深色主题，添加到主屏幕会安装成独立应用，图标铺满不带白边，部署在登录代理后面也能正常安装。（#863，@eyjohn）
  修复
  - 刷新页面或重新连接后，终端面板不再丢失——标签页会带着仍在运行的命令和已有输出回来，命令结束后的输出也会一直保留到你关闭它的标签页。（#830，@dawNotPoi；#749 由 @kekxv 反馈）
  - Claude Code 不会再让会话一直转圈好几个小时——它自己发起回合时（比如后台任务结束后）你发的消息，现在会得到一次回复并正常结束。（#893 由 @Luis-WowApps 反馈）
  - Claude Code 还在生成工具调用时发送消息，不会再让回合失败。
  - Claude Code 回合进行中发送的消息会保留在历史记录里，回合中途完成的后台任务在历史里也会显示结果，不再像是没有完成。
  - Claude Code 会话的标题不会再来回切换了——Claude Code 生成不了标题时（比如网关拒绝了生成标题的请求），侧栏和消息渠道里绑定的话题以前会在第一条和最新一条消息之间反复变化。
  - 自定义智能体自己发起的回合，回复在刷新后也会留在会话里，比如后台任务完成后它自动开始的回合，不再只在实时显示时才能看到。（#903 由 @andrehqh 反馈）
  - 运行 Claude Code ACP 适配器的自定义智能体，插入当前回合的消息现在会直接送进回合，和内置的 Claude Code 一样，这些消息也会保留在历史记录里。（#892 由 @andrehqh 反馈）
  - 远端工作区断网后会一直尝试重连，重连期间会给出提示，不再连续失败三次就放弃并把连接显示成已过期，现在只有服务器拒绝令牌时才会显示过期。（#887、#890，@ker2xu）
  - 服务器离线时，远端工作区窗口在下次启动时也会照常恢复，等服务器恢复后原地接着用。（#887、#890，@ker2xu）
  - 在 macOS 上点击程序坞图标，会切到你最近用过的工作区，最小化的远端工作区也会还原，不再总是拉出本地窗口，Windows 和 Linux 上再次启动 codeg 也是这样。（#887、#889，@ker2xu）
  - ACP 注册表里的自定义智能体在 Windows 上能正常安装了——以前大多数二进制条目会去找 kilo.exe.exe 这样多了一层 .exe 的文件，直接以可执行文件而非压缩包发布的智能体现在也能安装。（#905 由 @trueai-org 反馈）
  - 用官方安装器装在 ~/.local/bin 里的智能体（比如 Hermes），不从终端启动 codeg 时也能被找到，不再显示为未安装。（#888，@Sma1lboy；#875 由 @toptiersnowman 反馈）
  - 你自己安装的 OpenCode 2.x 现在能连上了，codeg 不再给它传 acp 命令不接受的 --port 和 --hostname 参数。（#909，@Liang-HZ）
  - Effort 选项现在跟随你选的模型——「设置 → 协作」的「子智能体配置」以及待办任务和自动化编辑器里都是如此，不再按智能体默认模型列出。（#910，@Liang-HZ）
  - 回复输出过程中向上滚动，不会再被拽回底部，无论是在代码块上滚动滚轮，还是用触摸、键盘或拖动滚动条。（#899，@Adam-Dalloul）
  - 调整会话标签顺序后，标签页的聊天记录不会再一片空白、要滚动一下才出现。（#901，@Adam-Dalloul）
  - 已发送消息里的 /词 或 $词，只有确实是智能体提供的命令或技能时才显示成命令，/tmp 这样的路径会保持普通文字。（#902，@Adam-Dalloul）
  - 展开或收起侧栏时，顶部标签栏不会再先被挤压再弹回。（#912，@sumanx）
  - 调整窗口大小时，侧栏、右侧面板和终端面板不会再来回抖动。（#897，@sumanx）
  - 收起思考块或工具卡片时不会再闪现一帧内容，在会话里点击后按 Esc、复制或从别的窗口切回来，也不会再出现包住整个会话的焦点框。（#896，@sumanx）
  - 会话加载失败后会按逐渐拉长的间隔自动重试，最长每 30 秒一次，报错和「重新加载」按钮一直显示，不再不停地重复请求、报错一闪一闪。
  - 后台同步或更早的消息恰好在会话加载期间到达时，会话不会再一直停在加载中。
  - Token 用量统计更准确了——Codex 不再把写入缓存的部分算作新输入，已有的 Codex 会话会重新统计，CodeBuddy 的总量也补上了以工具调用结束的请求。
  - Cline 的历史记录不再显示 Cline 标记为内部的消息，比如压缩摘要、钩子上下文，以及你批准切换到 Act 模式后它自己发出的提示。
  - 从历史记录打开的 Claude Code 会话，原生支持 1M 上下文的模型会显示 1M 上下文窗口，比如 Opus 4.7 及以后、Sonnet 5 及以后、Haiku 5.5、Fable 和 Mythos，不再显示 200K。
  - 备份现在包含 Codex 的会话名称，恢复时会把 Codex 和 Kimi 的会话列表与现有内容合并，而不是跳过或整个覆盖，恢复的会话能保留名称和所在文件夹。
  - 在 macOS 上，智能体在 Chromium 或 Electron 应用里输入文字并要求提交时，电脑操作会在输入后按下回车，不再因为输入框读回为空而判定输入失败。
  - 桌面版无论以什么方式启动，日志都写到同一个文件夹，「设置 → 运行日志」打开的就是正在写入的文件夹，并显示每个文件的当前大小。（#893 由 @Luis-WowApps 反馈）
  注意
  - Codex ACP 2.2 需要 Node.js 20.3.0 或更高版本，在 Node.js 20.0 到 20.2 上每条消息都会失败，环境诊断现在也会按每个智能体要求的完整 Node.js 版本检查，不再只看主版本号。
  - 从 Claude Code ACP 0.88.0 起，运行中的 Monitor 不再出现在后台任务条里，也就无法在那里停止它。
  - 生成式界面默认关闭——打开后新开始的会话才会带上 json-render 技能，关闭时会从所有智能体移除该技能，你自己的同名 json-render 技能不会被替换。
  - 挡在其他标签页后面恢复的标签页，第一次切过去时会短暂显示加载中，等会话内容加载完成。
  - 终端面板能在刷新页面后恢复，但 codeg 本身重启后不能，重启会结束终端里的进程，对应的标签页会显示终端会话不可用。
  感谢 @sumanx、@ker2xu、@Adam-Dalloul、@Liang-HZ、@dawNotPoi、@eyjohn、@Jonathan-Asher、@Sma1lboy 和 @Flyneen 为本次发布做出的贡献，也感谢 @kekxv、@toptiersnowman、@andrehqh、@Luis-WowApps 和 @trueai-org 的反馈。
