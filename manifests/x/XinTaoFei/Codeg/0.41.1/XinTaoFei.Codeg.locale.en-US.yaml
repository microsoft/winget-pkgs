ReleaseNotes: |-
  This release brings folder-specific tabs and split layouts, HTML previews in replies, native MiniMax Code support and OpenCode 2 integration, alongside easier model selection, more flexible task delivery and improved usage reporting.
  New
  - Tabs can follow the selected folder: enable “Tabs follow folder” in the sidebar’s View options to switch conversations, files and split layouts together while preserving drafts, unsaved edits and running conversations. (#1039, @fengpanhe)
  - HTML/CSS cards and charts can appear directly in replies: enable “Chat HTML rendering” in Settings → Appearance to preview static HTML alongside Markdown, including during streaming, and switch back to the source when needed. (#1041, @ana52070)
  - MiniMax Code joins the built-in agents, connecting to your installed mcode with its existing login and provider settings, with support for MCP tools and multi-agent delegation. (#1028, @xy3xy3)
  - Model fields can fetch and list your provider’s models directly, with search, refresh and retry controls for Claude Code, Gemini CLI, OpenCode and other supported agents.
  - Codex model management is gathered into one section, where you can choose the built-in or provider list, select models and refresh automatically while retaining the last working list if a refresh fails.
  - Tasks ready for review can open pull requests on GitHub, GitLab and Gitea/Forgejo, including tasks created without an issue, with the option to keep the task open and push later changes to the same request.
  - ZCode supports unified Skills management, including browsing, editing, importing and installing skills through codeg’s settings. (#1021, @jackie-cqz)
  Improved
  - OpenCode moves to 2.2.0, with updated provider connections, permissions, MCP and plugin management that preserve comments in JSONC configuration files.
  - OpenCode conversations show form questions, scripts and background sub-agent progress, and saved conversations include the newer database’s compaction records, command exit codes and media attachments.
  - Claude Code moves to claude-agent-acp 0.98.0, with dedicated monitor steps showing the watched command or address, plus progress and trigger details for work started by background tasks or scheduled wakeups.
  - Claude Code’s sandbox network permission cards name the destination host, making it easier to decide whether to allow a connection.
  - Codex moves to codex-acp 2.3.0, reducing the wait to reopen a fork’s parent conversation to about a minute and improving saved tool output and error messages.
  - Cline, CodeBuddy, Kimi Code, Grok, Cursor, Antigravity, ZCode and Command Code are updated, with compatibility adjustments for their current tools and configuration.
  - Bundled Superpowers skills move to v7.0.1, adding session diagnostics for repeated work, plan drift and unusual costs, alongside improved planning, execution, review and standalone skill compatibility.
  - Hermes conversations offer model selection grouped by provider and a mode selector, restoring your choices when you reopen the conversation.
  - Creating a task from a message opens the editor over the current conversation, with the message and project filled in so you can save without leaving what you were reading.
  - The activity timeline uses clearer grey backgrounds, text hierarchy and icon spacing, with a collapse action at the bottom of expanded steps that brings their header back into view.
  - Command rows explain outcomes such as no matches, false conditions, differing files and timeouts, while command output stays folded by default.
  - TRAE CLI usage comes from its native records and includes sub-agent consumption, giving conversations and usage reports more complete token totals. (#1019, @fengpanhe)
  Fixed
  - Antigravity’s native questions appear as interactive cards, with selected answers preserved after reopening and historical multi-select, written-in and skipped answers displayed correctly. (#1043, @ana52070)
  - OpenCode 2 delegations display as sub-agent tasks with the correct conversation links, including after reopening and when several delegations run in parallel. (#1020, @Liang-HZ)
  - Files with Chinese or other non-ASCII names, and renamed files, show correct change counts and diff previews in the Changes panel and task details. (#1022, @MaxFreedomPollard)
  - Usage and Manage Conversations filters include custom agents and show their current names, making their conversations and consumption easier to find. (#1029, @Adam-Dalloul)
  - Conversations using the official Claude adapter retain reported per-prompt usage and costs after reopening, including custom agents, whose linked native sessions are also skipped during new imports to avoid duplicate usage counts. (#1048, @Adam-Dalloul)
  - Conversations retain their recorded duration even without token data, and reported turn usage is preserved when a Remote Control message ends the reply.
  - A Codex reply that continues after automatic context compaction stays together in history, instead of splitting into separate replies with duplicate activity headers and footers.
  - Claude advisor results remain visible after reopening, in both the main conversation and sub-agent conversations.
  - A Kimi Code conversation that is busy in another client reports that it is in use, instead of switching the conversation to a new empty session.
  - Dragging agents to reorder them in Settings keeps the list in place, while selecting another agent still scrolls it into view. (#1033, @xyalter)
  - Agents that depend on installation scripts, including Hermes Agent, install correctly with npm 12.
  - Fixed a Windows issue where ending an agent session could leave Git Bash with a missing temporary directory, causing later commands to fail.
  - The macOS desktop app avoids the system’s low-swap suspension, which could leave every conversation unresponsive while the agents kept running.
  - Multi-agent tool calls stop waiting when codeg remains unresponsive, preventing them from hanging indefinitely.
  Note
  - OpenCode now requires version 2.0 or later, so upgrade any 1.x installation before opening conversations and use plugins compatible with OpenCode 2.
  - OpenCode 2 does not support SSE MCP servers, so use streamable HTTP when the server offers it, or leave OpenCode out of that server’s assignments.
  - The macOS standalone server now retains Full Disk Access and other privacy permissions across future updates, but moving from an older build to this release requires granting those permissions once more.
