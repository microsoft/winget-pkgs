ReleaseNotes: |-
  这一版重新设计了对话中的执行过程：思考、命令、文件改动和子智能体任务统一呈现在活动时间线上，跟进进度和回看结果都更方便。
  新增
  - 全新的执行过程时间线——按步骤展示智能体的工作，并汇总执行步数、耗时和失败情况。
  - 工具权限的处理结果会保留在会话中，重新打开会话后也能查看「已批准一次」「总是允许」或「已拒绝」的记录。
  - 对话中的文件改动支持行内和左右对比，左右两侧可同步横向滚动，点击详情顶部的文件名即可在工作区打开文件。
  改进
  - 点击「执行过程」标题即可展开或收起步骤，点击失败提示还能直接定位出错的位置。
  - 连续的文件查阅和命令执行会自动分组，已经完成的命令组自动收起，尚未解决的失败则保持展开。
  - 命令行优先显示智能体提供的用途说明，展开后可以查看完整命令或脚本及其输出，并分别复制。
  - 子智能体任务会展示任务内容、已完成步数、当前工作和最新结果，收起主回复后仍能看到正在执行的任务。
  - 「会话详情」中的消息导航采用更紧凑的子智能体和文件列表，消息、代码块与详情面板也更好地融入工作区背景图。
  - 长对话和流式回复更加流畅，滚动时仍可点击步骤，也修复了靠近底部时页面反复跳动的问题。
  修复
  - 命令结果中的退出码显示更准确，支持读取 Pi、Cursor 和 Antigravity 单独记录的退出码。
  - Codex 正在压缩上下文时就会显示提示，无需等到压缩完成后才能看到。
  - 展开的思考内容能保留换行和正确的列表排版，阿拉伯语界面中的英文、代码和文件差异也能按正确方向显示。
  注意
  - 如果之后可能要退回 0.39.0，请在升级前备份 codeg 的数据目录，因为 0.40.0 会更新数据库，0.39.0 无法使用更新后的同一份数据启动，服务器「回滚」和重新安装旧版桌面应用也一样。
