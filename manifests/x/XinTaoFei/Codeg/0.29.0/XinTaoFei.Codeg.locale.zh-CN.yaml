ReleaseNotes: |-
  读 PR、合并 PR，不用再打开浏览器。
  每一轮回复都收进一条可以折叠的标题栏里。
  新增
  - PR 打开后分成三个标签页，右边还有「合并」按钮。 「对话」「检查项」「文件更改」各占一页，点开文件就能看 diff；合并方式只列这个仓库允许的那几种——创建合并提交、压缩后合并、变基后合并。
  - 在仓库面板里就能发评论、关闭或重新打开议题，也能新建议题。 以前这些都得跳去 GitHub、GitLab 的网页上做。
  - 每一轮回复顶上都有一条标题栏：智能体在写时显示「正在工作中…」，写完变成「工作了 1 分 9 秒」。 点它就能把整轮回复折起来，发出下一条消息时上一轮自动折叠。停在工具调用上、还没给出回答的回合不会被折走。
  - 鼠标停在会话上，右边会浮出一张卡片，写着完整标题、智能体和模型、所在文件夹、分支和路径。在 codeg 里新建的会话现在也能看到模型名了，以前只有导入的会话才有。
  - Ctrl/Cmd + 1 到 9 直接跳到第几个标签，Ctrl/Cmd + Shift + T 重新打开刚关掉的那个。（#502，@Adam-Dalloul）
  - 右键菜单的「打开于」里多了 VS Code，文件夹、目录、文件都能用。（#591，@markos-ttl）
  - Antigravity 可以在没有浏览器的机器上登录。 codeg 给你一个链接，你用手机或另一台电脑打开、登录 Google 账号，再把跳转后的地址粘回来就完成了。
  - 会话在 Codex 那边被归档时，横幅会直接说明，并给出找回历史的命令。 点一下就复制 codex unarchive <id>；以前只会显示「加载会话失败，正在新建会话」。（#598，@asteroida123）
  - Codex 会说明它为什么要请求这次授权，不再只显示「编辑文件」这种固定标题。随 codex-acp 1.7.0 升级一起到来。
  改进
  - 内置智能体版本更新： Gemini CLI 0.57.0、OpenCode 1.18.25、Hermes 0.20.6、CodeBuddy 2.141.0、Kimi Code 0.39.1、Qoder 1.1.33。
  - Kimi Code 重新支持 MCP 服务器，卡在 0.36.1 的版本这才升到 0.39.1；登录提示里也补上了 kimi.ai 账号要加的 --region global。
  - 保存 MCP 设置时，codeg 界面上没有的那些字段会原样留着，不会被清掉。
  - PR 详情面板的描述、评论和输入框对齐到同一条左边线，读长评论时作者头像一直停在旁边，面板整体也更宽了。
  修复
  - 调窗口缩放时，整个界面跟着一起变大。 之前调到 150%，字是变大了，但栏宽、小号标签和弹出层还是 100% 的尺寸。
  - 缩放调高后中文不再被切掉上下半截，侧边栏、会话标题、下拉框都恢复正常。
  - 旁边有子智能体在输出时，一段思考仍然是一整张卡片，不会被切成好几段。（#494、#586，@dawNotPoi）
  - 打开子智能体的转写去看，回复不会一直卡在「响应中」，耗时统计和产物卡片也能正常显示。
  - 图片卡片刷新页面后还是原来的名字（文件名或页面名），不会变回「Image generation」。（#504，@Adam-Dalloul）
  - OpenCode 的工具卡片显示的是结果，不是一段原始 JSON。 之前实时看的时候，已经回答过的提问会显示成「未选择」。
  - Codex 委托给子智能体的会话，不会再作为独立会话出现在历史列表里。（#593，@TroyMitchell911）
  - 某一轮什么都没输出时，返回的就是空，不会把上一轮的回答顶上来。
  感谢 @Adam-Dalloul、@asteroida123、@dawNotPoi、@markos-ttl 与 @TroyMitchell911 为本次发布做出的贡献。
