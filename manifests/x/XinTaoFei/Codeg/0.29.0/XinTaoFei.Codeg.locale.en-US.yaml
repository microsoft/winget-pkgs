ReleaseNotes: |-
  Read a pull request and merge it without opening a browser.
  Every assistant reply now sits under a header you can fold away.
  New
  - A pull request opens as three tabs, and there's a Merge button. Conversation, Checks and Files changed; click a file to see its diff; the merge menu lists only what the repository allows — merge commit, squash, or rebase.
  - Write a comment, close or reopen an issue, and file a new one — all in the repository panel. These used to mean going to GitHub or GitLab in a browser.
  - Every reply has a header: "Working…" while the agent writes, "Worked for 1m 9s" when it's done. Click it to fold the whole reply away; sending your next message folds the one above it. A reply that stops on a tool call keeps everything on screen.
  - Hover a session and a card floats out to the right with its full title, agent and model, folder, branch and path. Sessions started inside codeg now show a model too — before, only imported ones did.
  - Ctrl/Cmd+1 through 9 jump to a tab, and Ctrl/Cmd+Shift+T reopens the one you just closed. (#502, @Adam-Dalloul)
  - VS Code joins the "Open in" menu, for folders, directories and files. (#591, @markos-ttl)
  - Antigravity can sign in on a machine with no browser. codeg gives you a link, you sign in to Google on your phone or another computer, then paste the address it lands on back into codeg.
  - A conversation whose session was archived says so, and hands you the command to get it back. One click copies codex unarchive <id>; before, it just said "Failed to load session, starting new". (#598, @asteroida123)
  - Codex now says why it needs your approval, instead of a fixed title like "Edit files". Comes with the codex-acp 1.7.0 upgrade.
  Improved
  - Updated bundled agents: Gemini CLI 0.57.0, OpenCode 1.18.25, Hermes 0.20.6, CodeBuddy 2.141.0, Kimi Code 0.39.1, Qoder 1.1.33.
  - Kimi Code takes MCP servers again, which is what unblocked the jump from 0.36.1 to 0.39.1; its login hint now includes the --region global a kimi.ai account needs.
  - Saving MCP settings leaves fields codeg has no UI for exactly as they were, instead of dropping them.
  - The pull request detail panel lines its description, comments and composer up on one left edge, keeps the author's avatar next to you down a long comment, and is wider.
  Fixed
  - The interface grows when you zoom the window. At 150% the text got bigger, but column widths, small labels and popovers stayed at their 100% size.
  - Chinese, Japanese and Korean text isn't clipped at high zoom in the sidebar, conversation titles and dropdowns.
  - One stretch of thinking stays one card while sub-agents are streaming beside it, instead of being cut into several. (#494, #586, @dawNotPoi)
  - A reply you're watching in a sub-agent transcript stops being stuck on "responding". Its timing stats and artifacts card show up.
  - An image card keeps its filename or page name after a reload, rather than reverting to "Image generation". (#504, @Adam-Dalloul)
  - An OpenCode tool card shows the result, not a blob of raw JSON. Watching live, a question you'd already answered read as "no selection".
  - Sessions Codex delegates to sub-agents no longer show up as separate sessions in your history. (#593, @TroyMitchell911)
  - When a turn produces nothing, nothing comes back — not the previous turn's answer.
  Thanks to @Adam-Dalloul, @asteroida123, @dawNotPoi, @markos-ttl and @TroyMitchell911 for contributing to this release.
