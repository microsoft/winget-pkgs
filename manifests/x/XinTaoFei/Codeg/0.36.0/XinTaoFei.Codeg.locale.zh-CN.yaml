ReleaseNotes: |-
  这一版新增了 Kiro CLI 和 ZCode 两个内置智能体，还带来了「助手」：把智能体、选项和常驻指令存成一套委派预设，在输入框里 @ 它就能把任务交出去。PlantUML 代码块会画成图了，等你处理的待办任务可以先「以后处理」，右侧面板的标签页移到了可以拖动排序的竖排图标栏，Claude Code 升级到 0.91.0，另有七个内置智能体更新了版本。
  同期还有：展开的 Read 卡片会显示读到的图片，一直开着的标签页里每条回复都会显示完整的工作时长，停止 Claude Code 的回合后工具卡片不会再显示「已完成」，Antigravity 的斜杠菜单会列出你的技能，Windows 应用内更新不会再卡在 codeg-mcp.exe 上，在智能体会话里启动 codeg 后委派也能正常使用，更新后的依赖组件还修复了几处安全问题。
  新增
  - 亚马逊的 Kiro CLI 成为内置智能体——codeg 直接运行你用 Kiro 官方安装程序装好的 kiro-cli，输入框里可以选 Kiro 的 agent、模型、思考开关和思考强度，斜杠菜单里有它的技能和提示词，支持导入历史会话，设置页里可以「升级」、选择权限模式，还能填写可选的 API Key。（#851，@keh4l）
  - 智谱的 ZCode 成为内置智能体——在「设置 → 智能体」里安装它的 ACP 桥接器后，codeg 会通过它驱动你已登录的官方 ZCode，输入框里可以选模式、模型和思考选项，支持权限请求、stdio MCP 服务器和委派，在 codeg 里进行的会话也会留下历史记录。（#941，@jackie-cqz；#685 由 @nn200433 提出）
  - 新增「助手」，可以 @ 的委派预设——在「设置 → 协作 → 助手配置」里给助手起名、选头像、写描述，选好智能体并定下它的每一项选项，再写上常驻指令；在输入框里 @ 它，任务就会按这套设置交给它处理。
  - 智能体自己委派时也能按描述挑选助手，委派卡片、会话详情和侧栏会显示任务是由哪个助手完成的，「配置同步」也会把助手带到你的其他设备上。
  - PlantUML 图表可以直接画出来了——回复、思考过程和文件预览里标为 plantuml 或 puml 的代码块，会渲染成和 Mermaid 相同的图表卡片，支持缩放、全屏、复制，以及下载为 SVG、PNG 或 .puml，全部在本机渲染。（#968 由 @f1603849451-arch 提出）
  - 等你处理的待办任务可以「以后处理」了——待验收或失败的任务会原样移到「已完成」，不再计入提醒角标；之后可以用「继续处理」让智能体在原会话里接着做，失败的任务照样能「重试」，也可以「移回等你处理」。
  - 右侧面板的标签页移到了面板右边缘的竖排图标栏，可以拖动调整顺序，也可以选中后用 Alt+↑/↓ 移动，所有窗口都会跟着用新顺序。
  改进
  - 内置智能体版本更新： Claude Code ACP 0.91.0（Claude Code 2.1.300）、OpenCode 1.19.1、Cline 3.0.72、Hermes 0.22.2、CodeBuddy 2.168.0、Grok 1.0.60、Cursor 2026.10.14、Qoder 1.1.72。
  - 「设置 → 协作」的「子智能体配置」改成了和助手编辑器一样的用法——用一个智能体选择器切换，未安装的会标出来，改过的会显示「已自定义 N 项」；保持「默认」的选项会淡化显示，读取其他选项时模型仍可改选，智能体已不再提供的已存值会标为不可用，而不是显示一片空白。
  - 更新包必须是针对所发布版本签名的才会安装，桌面版和服务器在线升级都是如此，旧版本的签名包无法冒充新版本。
  - 内置模型目录已更新，共 230 家供应商的 8,894 个模型（此前 8,831 个）。
  修复
  - 展开读取图片的 Read 卡片会显示图片了，比如 Codex 查看图片时，工作区文件夹以外的图片（比如 /tmp 里的）也能显示，还可以放大查看、复制或下载；重新打开的 Codex 会话也会显示同样的卡片，不再是一大段 base64 文本。（#977 由 @wuzhaozhongguo 反馈）
  - Antigravity 的斜杠菜单会列出你的技能了，排在它自己的命令后面，读取的是「设置 → Skills」管理的同一批目录，自动化和待办任务编辑器里也一样。（#971 由 @lwxk 反馈）
  - 修复了依赖组件中的几处安全问题——往输入框粘贴 HTML 不会再执行脚本，Mermaid 图表不会再把内容放到图外，数学公式也不会再变成可点击的 javascript: 链接。
  - Windows 应用内更新不会再因为 codeg-mcp.exe 报「Error opening file for writing」而中断——codeg 会在安装程序启动前先停掉智能体，安装程序也会把仍被占用的文件挪开。
  - 在 codeg 自己的智能体会话里启动 codeg 后（比如让智能体重启 codeg），委派也能正常使用了，不再每次都报「No such file or directory」。（#966，@Liang-HZ）
  - 这样启动的 codeg 也不会再在启动时删掉自己正在用的临时文件夹，以前它的终端和 Pi 的模型列表会因此没有临时文件夹可用。
  - 会话标签页一直开着、连续发了多条消息时，每条回复都会显示完整的工作时长和 Token 用量，不再出现跑了一个半小时的回复只显示 11 秒、要重新打开会话才对的情况。
  - 停止 Claude Code 的回合后，没跑完的工具卡片会显示它们实际的结束状态，子智能体的工具调用也一样，不再显示「已完成」、要刷新才变对。
  - 续接过的 Claude Code 会话不会再把之前的历史重复显示一遍——那份副本没有时长，会让消息数翻倍，还会把工具结果挂到错误的调用上。
  - Claude Code 在后台任务结束后自己发起的回合，会从那一刻开始计时，不再把之前的空闲时间算进去。
  - Claude Code 的后台子智能体结束时，如果它自己的后台工作还在跑，不会再显示成已完成——卡片会标为「阶段性结果」，真正结束前也不会发出完成通知。
  - Claude Code 工具调用失败时，实时显示的报错不再带多余的代码块标记，和刷新后看到的一致。
  - Claude Code 后台任务的结果会照原样显示 <、> 和 &，不再显示成 <、> 和 &。
  - 从历史记录打开的 CodeBuddy 会话，斜杠命令会按你输入的样子显示，不再显示命令标签和它展开后的提示词。
  - 回复里的行内公式不会再显示成原始的 $$ 文本，即使回复在公式渲染器加载完之前就已显示出来。
  - 连续快速调整两次会话标签的顺序，不会再丢掉其中一次；窗口刚打开时别处正好改了标签，这个窗口也能看到改动。
  - 远端工作区的菜单、连接对话框和连接出错页面已翻译成繁体中文、日语、韩语、西班牙语、德语、葡萄牙语和阿拉伯语，不再大部分显示英文。
  - 搜索远端工作区连接没有结果时，会显示「没有匹配的远端连接」，不再重复显示搜索框的提示文字。
  - 阿拉伯语界面下，带标签页的页面会从右到左排版了，和窗口其他部分一致。
  注意
  - Kiro 和 ZCode 使用你自己安装的 CLI——Kiro 需要用官方安装程序装好的 kiro-cli；ZCode 需要先安装并登录官方 ZCode，再装好支持 node:sqlite 的 Node.js 22 或更高版本，codeg 只负责安装 ZCode 的 ACP 桥接器。
  - 以前从 ACP 注册表添加为自定义智能体的 Kiro CLI，升级后会变成内置的 Kiro，它的会话、标签页、设置、自动化、待办任务设置、子智能体配置、会话标签和输入框里的选择都会一并迁移过来。
  - ZCode Start Plan 账号无法通过桥接器使用，因为它的请求需要只有 ZCode 桌面应用才能完成的验证码，GLM Coding Plan 不受影响。
  - ZCode 首期接入还有一些限制——暂不支持从消息分叉、附件、HTTP MCP 服务器和导入 ZCode 自己的历史会话；你之前作为自定义智能体配置的 ZCode 保持不变，历史记录各自独立；目前只在 Windows 上实测过。
  - 助手要在开启委托后才能使用，开关在「设置 → 协作 → 通用 → 启用委托」，默认关闭。
  - Cline 用不了 codeg 的协作工具（比如委派），因为 Cline 从不连接通过 ACP 传给它的 MCP 服务器；它自己设置里的 MCP 服务器照常可用。
  - OpenCode 1.19.1 已停止会话分享，OpenCode 设置页里的「会话分享」从这个版本起不再生效。
  - PlantUML 图表不经过 PlantUML 服务器渲染，所以 <C4/...> 这类标准库引用暂不可用。
  感谢 @keh4l、@jackie-cqz 和 @Liang-HZ 为本次发布做出的贡献，也感谢 @wuzhaozhongguo、@lwxk、@f1603849451-arch 和 @nn200433 的反馈。
