ReleaseNotes: |-
  This one adds Kiro CLI and ZCode as built-in agents and introduces Assistants, ready-made delegation setups with their own agent, options and standing instructions that you @-mention to hand off a task. PlantUML code blocks now draw as diagrams, a to-do that needs you can be set aside with Handle later, the side panel's tabs move to a vertical rail you can reorder, and Claude Code moves up to 0.91.0 along with seven more bundled agents.
  Alongside that: an expanded Read card shows the image it read, replies in a tab left open show their full working time, stopping a Claude Code turn no longer leaves its tool cards reading Completed, Antigravity's / menu lists your skills, Windows in-app updates no longer stop on codeg-mcp.exe, delegation keeps working when codeg is started from inside an agent session, and updated components close several security holes.
  New
  - Amazon's Kiro CLI is now a built-in agent: codeg runs the kiro-cli you installed with Kiro's own installer, with its agent, model, thinking and effort pickers in the message box, its skills and prompts in the / menu, history import, and a settings page with Upgrade, a permission mode and an optional API key. (#851, @keh4l)
  - Z.ai's ZCode is now a built-in agent: install its ACP bridge in Settings → Agents and codeg runs your signed-in official ZCode through it, with its mode, model and thinking pickers in the message box, permission requests, stdio MCP servers, delegation, and history for the conversations you run in codeg. (#941, @jackie-cqz; #685 requested by @nn200433)
  - Assistants are ready-made delegation setups you can @-mention: under Settings → Collaboration → Assistants, give one a name, avatar and description, pick an agent with every one of its options and add standing instructions, and mentioning it in the message box hands it the task with exactly that setup.
  - Agents can also pick an assistant on their own when they delegate, going by its description, while delegation cards, Session Details and the sidebar show which assistant ran a task, and Configuration sync carries your assistants to your other machines.
  - PlantUML diagrams are drawn from code blocks marked plantuml or puml in replies, thinking and file previews, in the same card as Mermaid diagrams with zoom, fullscreen, copy and download as SVG, PNG or .puml, all rendered on your machine. (#968 requested by @f1603849451-arch)
  - A to-do that needs you can be set aside with Handle later: a task waiting for review or a failed one moves to Done as it is and leaves the badge count, and from there Follow up sends it back to the agent in the same session, a failed one can still be retried, and Back to Needs you returns it.
  - The side panel's tabs move to a vertical icon rail along its right edge, where you can drag them into the order you like or move a focused one with Alt+↑/↓, and every window follows the new order.
  Improved
  - Updated bundled agents: Claude Code ACP 0.91.0 (Claude Code 2.1.300), OpenCode 1.19.1, Cline 3.0.72, Hermes 0.22.2, CodeBuddy 2.168.0, Grok 1.0.60, Cursor 2026.10.14, Qoder 1.1.72.
  - Agent defaults under Settings → Collaboration now works like the assistant editor: one agent picker marks agents that aren't installed and counts your overrides, options left on Default are dimmed, you can change the model while its other options load, and a saved value the agent no longer offers shows as unavailable instead of blank.
  - Updates are checked against the version they were signed for, in the desktop app and in the server's online upgrade alike, so an older signed package can't pass for a newer one.
  - The built-in model catalog is refreshed with 8,894 models from 230 providers, up from 8,831.
  Fixed
  - An expanded Read card for an image now shows the picture, as when Codex views one, also for images outside your workspace folders such as in /tmp, and you can open it full size, copy or download it, while a reopened Codex conversation shows the same card instead of a block of base64 text. (#977 reported by @wuzhaozhongguo)
  - Antigravity's / menu lists your skills after its own commands, from the same folders Settings → Skills manages, and so do the automation and to-do editors. (#971 reported by @lwxk)
  - Several security issues in bundled components are fixed: pasting HTML into the message box can no longer run a script, a Mermaid diagram can no longer place content outside its own picture, and a math formula can no longer become a live javascript: link.
  - Windows in-app updates no longer stop on "Error opening file for writing" for codeg-mcp.exe, as codeg now shuts its agents down before the installer starts, and the installer moves aside a file that is still in use.
  - Delegation keeps working when codeg is started from inside one of its own agent sessions, as when an agent relaunches it, instead of every delegation failing with "No such file or directory". (#966, @Liang-HZ)
  - A codeg started that way also keeps its own temporary folder instead of deleting it at startup, which had left its terminals and Pi's model list without one.
  - In a conversation tab you keep open across several prompts, each reply shows its full working time and token usage, instead of a reply that ran for an hour and a half reading 11 s until you reopened the conversation.
  - After you stop a Claude Code turn, the tool cards it left open show how they ended, sub-agents' calls included, instead of reading Completed until you reload.
  - A resumed Claude Code conversation no longer shows its earlier history a second time, as a copy without durations that doubled the message count and pulled tool results onto the wrong calls.
  - A Claude Code turn that starts on its own after a background task finishes is timed from that moment, instead of counting the idle time before it.
  - A Claude Code background sub-agent that finishes while its own background work still runs no longer reads as done: its card labels the result interim, and no "finished" notification goes out until the real end.
  - A failed Claude Code tool call no longer shows stray code-fence marks around its error while live, so it reads as it does after a reload.
  - Claude Code's background task results show <, > and & as written, instead of <, > and &.
  - CodeBuddy conversations reopened from history show a slash command as you typed it, instead of its tags and the prompt it expands to.
  - Inline math in a reply no longer stays as raw $$ text when the reply is drawn before the math renderer has loaded.
  - Moving conversation tags twice in quick succession no longer loses a move, and a window that opens just as a tag changes elsewhere picks up the change.
  - The remote workspace menus, connections dialog and connection error page are now translated into Traditional Chinese, Japanese, Korean, Spanish, German, Portuguese and Arabic, instead of showing mostly in English.
  - Searching remote workspace connections now says "No matching remote connections" when nothing matches, instead of repeating the search box's prompt.
  - In Arabic, tabbed pages now lay out right to left like the rest of the window.
  Note
  - Kiro and ZCode run the CLIs you install yourself: Kiro needs kiro-cli from Kiro's official installer, and ZCode needs official ZCode installed and signed in plus Node.js 22 or later with node:sqlite, since codeg installs only ZCode's ACP bridge.
  - A Kiro CLI you added from the ACP registry as a custom agent becomes the built-in Kiro on upgrade, with its conversations, tabs, settings, automations, to-do settings, delegation defaults, tags and message box picks carried over.
  - ZCode Start Plan accounts can't run through the bridge, as their requests need a captcha only the ZCode desktop app can solve, while GLM Coding Plan accounts are not affected.
  - ZCode's first integration leaves some things out: forking from a message, attachments, HTTP MCP servers and importing ZCode's own history aren't supported yet, a ZCode you set up as a custom agent stays separate with its own history, and so far it has been tested on Windows only.
  - Assistants work only with delegation on, under Settings → Collaboration → General → Enable delegation, which is off by default.
  - Cline doesn't get codeg's collaboration tools, such as delegation, as it never connects MCP servers handed to it over ACP, while the MCP servers in its own settings keep working.
  - OpenCode 1.19.1 discontinued session sharing, so the Sharing setting on its settings page no longer has any effect.
  - PlantUML diagrams render without a PlantUML server, so standard-library includes such as <C4/...> aren't available.
  Thanks to @keh4l, @jackie-cqz and @Liang-HZ for contributing to this release, and to @wuzhaozhongguo, @lwxk, @f1603849451-arch and @nn200433 for the reports.
