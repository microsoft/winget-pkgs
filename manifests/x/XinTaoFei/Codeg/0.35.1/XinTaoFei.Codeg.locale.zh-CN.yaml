ReleaseNotes: |-
  这一版让智能体可以在回复卡片里画图表，生成式界面也改成按智能体启用的技能，并更名为 ui-render。
  同期还有：回复里的卡片去掉了阴影，技能包页面点「刷新」后不会再退回报错或旧列表。
  新增
  - 智能体可以在回复卡片里画图表了——让启用了「界面渲染」的智能体用图表展示，就能画出面积图、柱状图、折线图、饼图或环形图、雷达图、径向图和散点图，配色跟随主题，鼠标悬停即可查看数值。
  改进
  - 生成式界面改为按智能体启用——「设置 → 技能包 → 界面」里的「界面渲染」技能和「专家」页一样用表格管理，可以给单个、几个或全部智能体启用。
  - 回复里的卡片去掉了阴影，和会话里的其他内容一样平铺在消息中。
  修复
  - 技能包页面还在加载时点「刷新」，列表不会再被换成报错或旧数据，「专家」「科学研究」「办公工具」和「自定义」页都已修复。
  - 技能包「自定义」页的「从 Agent 导入」不再列出 codeg 自带的生成式界面技能，和其他技能包一样不会出现在这里。
  注意
  - json-render 技能更名为 ui-render——提问时用 /ui-render（Codex 里是 $ui-render）开头；如果你在 0.35.0 里打开过生成式界面，升级后已经带有 json-render 的智能体会自动换成 ui-render。
  - 「启用 json-render 生成式界面」开关已移除——回复里的卡片始终会渲染；给智能体启用「界面渲染」后新开始的会话才会带上这个技能，之后再停用，它已经画出的卡片也会保留。
