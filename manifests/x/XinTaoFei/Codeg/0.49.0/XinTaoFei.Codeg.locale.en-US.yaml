ReleaseNotes: |-
  This release introduces personal assistants (Beta), lets you edit and resend sent messages in Claude Code and Codex, adds "Ask" conversations for a selected passage, shows which sessions are waiting on you, redesigns Session Details and the agent settings panels, and updates Claude Code to 0.113.0, Codex to 2.12.1 and many other agents.
  New
  - Personal assistants (Beta). A main assistant and work assistants you create now live in a "Personal assistants" section of the workspace sidebar. Each has its own agent for thinking and one for doing work, and its own face and persona. You can chat with them, @-mention them in any conversation, and have them hand work to each other.
  - Assistants take care of work on their own. They follow up on work they hand out, retry or take over failed work, and check finished code work with another agent before accepting it. They can also fix failed checks and conflicts on pull requests and merge them once green, and run steps of a plan in order.
  - Assistants keep you up to date and remember what matters. They send a morning brief and an evening wrap-up, show everything in one activity list (what waits on you, what is under way, what comes next, what was done today), and run routines on a schedule or on coding events. They also set reminders, tidy their memory each night, and learn repeatable processes as skills you approve.
  - "Is this right?" You can ask another agent to check an assistant's message, or one sentence of it. The verdict and its evidence come back on a card, and the check opens in its own conversation.
  - You can now edit and resend a sent message in Claude Code and Codex. The conversation picks up again from that point.
  - Select text in a conversation and choose Ask to discuss it in a separate Ask conversation. You can pick which agent to ask and set its model, mode and options, and its slash commands are in the "+" menu. The Ask conversation opens in a side drawer, is listed under the main conversation in the sidebar, and can be turned into a normal conversation later.
  Improved
  - Sessions waiting for your answer, permission or plan approval now show a hand icon in the sidebar and on tabs, not the running dot. This includes a session whose sub-agent is the one waiting. (#1283, @ana52070)
  - Session Details has a new flat layout, with a properties tile, message rows that stay in place when expanded, a list of Ask and check conversations, and a useful view for new conversations.
  - Each agent's settings panel is now a clean stack of option cards, and its Save button stays in view while you scroll. Codex also gets a switch to hide its under-development warning.
  - Updated Claude Code (claude-agent-acp) to 0.113.0, Codex (codex-acp) to 2.12.1, CodeBuddy to 2.187.0, Kimi Code to 2.8.0, Qoder to 1.1.98, ZCode to 0.94.0, DeepSeek to 0.13.0, Hermes to 0.23.4 and Command Code to 1.93.3.
  - When Claude Code starts Remote Control along with the session, the Remote Control bar now appears right away.
  - When Codex hits an API key, project or organization spend limit, it now shows as a limit with no pointless Retry button.
  - CodeBuddy's context compaction now shows as a compaction divider, both live and in history.
  - Qoder sub-agents now report back within the turn that started them. Before, their results could go missing.
  - Dialogs now use the same slim, auto-hiding scrollbar as the conversation list.
  - Improved Traditional Chinese (zh-TW). Leftover Simplified Chinese and English strings are translated, and Taiwan terms replace mainland ones. (#1323, #1324, @rider159159)
  Fixed
  - Antigravity's YOLO mode now stays on after reconnecting or resuming a session. Before, it quietly fell back to default even though the UI still showed YOLO. (#1309 reported by @XBigRoad)
  - With the computer tools turned on, models that only accept text values in tool definitions no longer reject them. (#1319, @ana52070)
  - The row above the input box (elapsed time, edited files, speed) now goes away as soon as a turn ends.
  - The folder, connection, "+" and agent settings buttons in the input box now line up with the send button.
  Thanks to @ana52070 and @rider159159 for contributing to this release, and to @XBigRoad for the report.
