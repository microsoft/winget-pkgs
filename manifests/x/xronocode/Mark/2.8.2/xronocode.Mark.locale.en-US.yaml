ShortDescription: Lightweight native WYSIWYG Markdown editor built with Tauri and Rust.
Description: |-
  Mark is a fast, lightweight (~30 MB) native WYSIWYG Markdown editor for Windows built with Tauri and Rust, continuing the legacy of MarkText.
  Designed to read and edit documents alongside AI coding agents, it features live disk reload that preserves your scroll position, inline diff view, Split View, folder sidebar, inline Mermaid diagrams, KaTeX math formulas, themes, PDF/Pandoc export, and a built-in updater.
