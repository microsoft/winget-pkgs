ShortDescription: A vim-style TUI todo manager written in Go. Unaffiliated with the dooit project; AI-assisted, hobby project.
Description: faster-dooit is a from-scratch, high-performance vim-style terminal todo manager written in Go with Bubble Tea. It offers a two-pane tree, six modes, vim keybindings, natural-language dates, recurrence, search/sort/clipboard, a status bar and a Lua extension surface. The command installed is fdooit. This project is unaffiliated with the dooit project, is AI-assisted, and is a hobby project by a middle-school student developer.
