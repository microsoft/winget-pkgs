ReleaseNotes: |-
  ### ✨ 新增功能
  - 在音效设置面板提供了20+内置音频滤镜
  - 改进歌曲搜索

    * 支持模糊搜索
    * 支持拼音搜索 例: "周杰伦" -> "zhoujielun"
    * 支持首拼搜索 例: "周杰伦" -> "zjl"

  - 支持文件名作为排序依据 #107
  - 添加音频分析页面和以下组件 (该页面默认被隐藏，可在 设置-个性化-页面可见性设置 手动开启)

     * 响度（EBU R128)
     * 电平
     * 声场 / 相位
     * 频谱可视化 (2D FFT) #56
     * 声谱瀑布图

  - 添加自动隐藏播放页面组件功能以及对应的设置项

  ### 🛠 修复问题
  - 修复部分情况下全部歌曲显示不完全的问题 #111
  - 修复音频设备被移除后未能自动切回默认设备的问题 #110
  - 将专辑/歌手筛选状态迁移到 PlaylistContentNotifier #109
  - 修复在专辑页面滚动卡顿的问题
  - 修复清除快捷键后的持久化问题

  ### 🚀 优化与体验提升
  - 重构了 信息/错误 通知组件
  - 优化全部歌曲去重逻辑
  - 使用拼音缓存优化艺术家/专辑列表排序性能
  - 修正播放页设置项的文案描述
  - 其他的忘了
