ReleaseNotes: |-
  ### ✨ 新增功能
  - 增加音高，倍速的重置功能 #116
  - 为系统托盘菜单新增了上一首、播放/暂停、下一首选项 #119
  - 重做从网络获取歌词功能:
    * 企鹅：匹配准、支持翻译和逐字歌词
    * 网抑：匹配一般，支持翻译
    * 库狗：匹配高、支持翻译和逐字歌词以及注音

  ### 🛠 修复问题
  - 修复扫描歌单歌曲时潜在的静态条件 #121
  - 修复多行卡拉ok歌词渲染的陈年老bug
  - 修复部分 Windows 环境下的系统媒体服务崩溃问题 #125 (ales-drnz/mpv_audio_kit#17)
  - 修复部分情况下 SMTC 不显示封面图片的问题

  ### 🚀 优化与体验提升
  - 简化主题与字体服务代码 #116 #120
  - 从 PlaylistContentNotifier 拆分歌词逻辑
  - 当网络歌词当前选中的源未匹配到时，会自动选择其他源进行匹配
  - 改进忽略某些播放错误设置项的匹配 #122
  - 编写 qrc、krc、yrc 歌词的解析逻辑，为后续的支持做准备
    * 如果您有这些歌词的样本（加密或未加密），可在 https://github.com/xiaobaimc/myune_music/issues 向我提供以便加速适配，在此万分感谢
