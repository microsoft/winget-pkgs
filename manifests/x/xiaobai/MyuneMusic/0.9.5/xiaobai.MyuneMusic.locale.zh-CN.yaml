ReleaseNotes: |-
  > 破坏性更改：之前启用的优先读取外置LRC歌词已不再生效，如有需要请在歌词来源优先级手动指定顺序

  ### ✨ 新增功能
  - 自动更新功能（默认开启）
  - 支持读取外置YRC、QRC、KRC文件.
  - 支持手动指定歌词来源优先级
  - 统计页面支持搜索
  - 添加自定义歌词字重功能
  - 添加自定义背景图功能
  - 为歌单和播放队列提供了定位到当前播放歌曲（如果有）的悬浮按钮

  ### 🛠 修复问题
  - 修复125%或更高缩放系数导致标题栏或播放栏出现额外的细线
  - 再次修复多行逐字歌词渲染bug
  - 修正逐字歌词颜色差异
  - 修复随机模式下反复出现相同播放顺序的问题 #126
  - 修复非弹性歌词下间奏动画结束后高亮歌词位置不对的问题
  - 修复太久没更新的问题

  ### 🚀 优化与体验提升
  - 优化歌手缩略图显示 使其与歌手第1张封面图匹配
  - 完善网络歌词，现在三个源均支持逐字歌词、翻译以及注音
  - 为逐字歌词扫描效果添加渐变
  - 优化逐字歌词动画视觉效果
  - 优化滚动时的性能 #127
  - 现在点击统计页面的查看更多将会在新的对话框中展示，而不是展开
  - 将播放进度显示数字标记为等宽字体
  - 移除歌词组件的 textHeightBehavior 以改善微小的字高差异
  - 禁用 impeller，暂时使用 skia 作为渲染器
  - 尽量统一歌词的行高
  - 修复卡拉OK歌词换行时高亮切换的行高跳动
  - 移除了歌词高亮时字重变化和字体大小变化
  - 添加了歌词高亮时颜色淡入淡出动画
  - 升级Flutter版本至3.47.5
  - 其他的忘了
