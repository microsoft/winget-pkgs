ReleaseNotes: "# 🛠️ Xenia Manager v5.0.0\r\n\r\n> This is a really big update under the hood so let us know if you find any bugs so we can fix them as soon as possible. While we have been testing this for a while on our own installs across multiple devices, bugs can still slip us.\r\n\r\n## ⚠️ Breaking Changes\r\n\r\n• **Two Executables in the Release**\r\n  The release artifact now ships `XeniaManager.BigScreen.exe` alongside `XeniaManager.exe`. Extract both into the same folder so the manager can find Big Screen.\r\n\r\n---\r\n\r\n## 📝 Changelog\r\n\r\n### ✨ New Features\r\n\r\n• **Game Files Explorer (replaces Open Game Location)** ([30b607e](https://github.com/xenia-manager/xenia-manager/commit/30b607e6c1762bf537562d8915d08002270b2b29), [e3c0798](https://github.com/xenia-manager/xenia-manager/commit/e3c07986afd4e51ab28cac4e705b58c5edcdc9ef), [940ef75](https://github.com/xenia-manager/xenia-manager/commit/940ef751930d4bfa73d13a60263b52ac2be3b20a), [707b562](https://github.com/xenia-manager/xenia-manager/commit/707b5629d15faa97fddcc222af1e1980faff909b), [82dea3a](https://github.com/xenia-manager/xenia-manager/commit/82dea3ab8e4d1663630a06e60a892cb9ef977891), [bdd154a](https://github.com/xenia-manager/xenia-manager/commit/bdd154a6eb1b67bc461c592edd551633a5e0380f), [3428730](https://github.com/xenia-manager/xenia-manager/commit/3428730918cfe39587c32fc39008ddf991c104e4), [fb4b946](https://github.com/xenia-manager/xenia-manager/commit/fb4b9462a7161843e56a78a80b6aea801d6f285a), [1eaafd3](https://github.com/xenia-manager/xenia-manager/commit/1eaafd3cf67ffd3b156d0a5e6254960f356883f8), [5d0ed3f](https://github.com/xenia-manager/xenia-manager/commit/5d0ed3f43fe766f743b734683db05209cbe9b8f1), [de12efd](https://github.com/xenia-manager/xenia-manager/commit/de12efd465d27d9f414b002392f067b5f18a4d69), [ba8ddbc](https://github.com/xenia-manager/xenia-manager/commit/ba8ddbc5f8d9c00cf0578d238b91af738a6c5203), [b8337ef](https://github.com/xenia-manager/xenia-manager/commit/b8337efa909d8b828d2ef0dd0a9b7b587c080d4a))\r\n  Replaces the Open Game Location action with an in-app, read-only browser for a game's container, opened from the library context menu with multi-disc support. A preloaded directories-first tree with live search, reveal-in-tree and multiselect sits beside a details pane that shows parsed XEX metadata (title/media IDs, version, disc, image size, module flags), the SPA summary (title, achievement count, gamerscore, icon), STFS metadata with thumbnail for CON/LIVE/PIRS packages, embedded image previews (PNG/JPG/BMP) and every SPA achievement with localized name/description, icon and gamerscore badge; a bottom panel summarizes the container format, file count and total size. Double-clicking smart-opens files — text into a selectable viewer with an encoding footer, `.gpd` into a read-only GPD viewer with achievements and entry table, and unknown files probed for STFS magic into a nested dialog — while the XEX details dialog loads in two cancellable stages (fast header first, full details on demand) and shows base version, executable type (Retail/Debug), icon export to PNG and a per-language achievement selector. Any selection of files, folders or mixed picks can be extracted with traversal-safe writes and a progress dialog reporting extracted/failed counts, and the game folder can still be opened in Explorer.\r\n\r\n• **Achievements from game files** ([ef8297c](https://github.com/xenia-manager/xenia-manager/commit/ef8297c0cc43dc45d020be3fa8959df9d9010206), [ac20c1d](https://github.com/xenia-manager/xenia-manager/commit/ac20c1d785d86b5d99d5b1b4cb0ff23e6b5922ab), [9e2c370](https://github.com/xenia-manager/xenia-manager/commit/9e2c370409858b908f809a8242cf30782fe10ef1), [ac1543d](https://github.com/xenia-manager/xenia-manager/commit/ac1543d9214a16fb75d3cad2769e13f420aa3a78), [8fd6db2](https://github.com/xenia-manager/xenia-manager/commit/8fd6db2152ab1232ae059c0fc9701c501e8580bf), [1305606](https://github.com/xenia-manager/xenia-manager/commit/1305606548c17e4834a21fe7666c146f5cf634f5), [15c3243](https://github.com/xenia-manager/xenia-manager/commit/15c32432f0efc36de15b59b92e829def566ac23f), [6fb17b9](https://github.com/xenia-manager/xenia-manager/commit/6fb17b93fe7c97a03785f5ef88a204526657145e), [2833253](https://github.com/xenia-manager/xenia-manager/commit/2833253885a84c955e62d046f919f08f576fd576))\r\n  A new AchievementGpdBuilder backend fills missing achievement GPDs straight from the game disc's SPA data, using the selected account and its language with fallback and ensuring the FFFE07D1 title entry. Both the desktop app and Big Screen gain a Fetch button (Y on Big Screen) that creates a missing GPD from the disc, fetches achievement images (missing-only, unlocked-only or overwrite-all) and refetches names and descriptions while preserving unlock state — multi-disc games ask which disc to read. Locked achievements with art render in black and white while unlocked ones stay in color (missing art keeps the lock icons), and Big Screen still hides locked secret achievements entirely.\r\n\r\n• **Artwork pipeline** ([3fac724](https://github.com/xenia-manager/xenia-manager/commit/3fac72409a7e124f5545e9c76bfc457d8b4a023b), [44b6a32](https://github.com/xenia-manager/xenia-manager/commit/44b6a32b26fcdc42be5bd59b71c77abc2ddaee7f), [b04d4d7f](https://github.com/xenia-manager/xenia-manager/commit/b04d4d7f7a7a38a6a1c67ddc11bd63f141b25724), [ef45bdb](https://github.com/xenia-manager/xenia-manager/commit/ef45bdb252ab287be96a1def90689b4567f4535d), [2273a44](https://github.com/xenia-manager/xenia-manager/commit/2273a44b5e053aca1998c9bd521c17d542dd3ca3), [b460919](https://github.com/xenia-manager/xenia-manager/commit/b460919b33bfc098f21e3028596485a0b8cc7707))\r\n  Adding a game now tries embedded artwork first — STFS thumbnails, SVOD GOD header+data, and XEX SPA/XDBF icons extracted through a new managed LZX decoder with retail/devkit AES-CBC decryption and Basic/LZX decompression (ISO/ZAR delegate to the embedded XEX with a `*.xex` fallback) — before falling back to an XboxDatabase download and finally the local template, all controlled by the new UseEmbeddedArtwork setting (default on). Containers are also searched case-insensitively for an inner nxeart package's nxebg.jpg (JPEG/PNG, including a filesystem sibling next to the XEX) as a prioritized background that respects the toggle, and the game editor can refetch artwork from the game files or x360db on demand.\r\n\r\n• **Big Screen Mode** ([0507eac](https://github.com/xenia-manager/xenia-manager/commit/0507eac82eb16d530c0f9d5d8633695c4d75854e), [5d2a931](https://github.com/xenia-manager/xenia-manager/commit/5d2a9311afbe8f44f1bc43ce30294e8c725702ca), [4edcd29](https://github.com/xenia-manager/xenia-manager/commit/4edcd291bdb5debecf766155991a6ee81ddbd005) by [@SBUplakankus](https://github.com/SBUplakankus))\r\n  New console-style Avalonia app fully operable with a gamepad：a dashboard with game cards (box art/icon toggle), dynamic backgrounds and header stats; a library with grid/list views, sorting and disc selection; game details with installed content, achievements, patch download, per-version XConfig settings and screenshots; a gallery with thumbnails and per-version filtering; and settings with profile management, controller cards and RGB sliders — driven by SDL-based gamepad input with a button mapper, plus bitmap caching and threaded background loading. A new UI Scale setting (25%–200%) adjusts the interface, and `Start in Big Screen` opens Big Screen directly on startup.\r\n\r\n• **Library and Content** ([c425379](https://github.com/xenia-manager/xenia-manager/commit/c4253792126df5140402270218592b927a5740dc), [80826e6](https://github.com/xenia-manager/xenia-manager/commit/80826e69981bd0039c8c672497e3393776af56a4), [c6b1f5f](https://github.com/xenia-manager/xenia-manager/commit/c6b1f5fb5e17a3c6e96c51bbed12ac2795f01cbe), [5ec0b83](https://github.com/xenia-manager/xenia-manager/commit/5ec0b834e468b0fc87470cb2e7a441eb73df2215), [1987e53](https://github.com/xenia-manager/xenia-manager/commit/1987e530f7c94e61b6fbd1b0980d3032727e29fe), [01f1ba4](https://github.com/xenia-manager/xenia-manager/commit/01f1ba4d7357048d57325f142e7e8d570a396f2b))\r\n  Since xenia-canary [b11458e](https://github.com/xenia-canary/xenia-canary/commit/b11458e49b8d3cac4b920b119169e34e4e8e1d80) can load CON/LIVE/PIRS packages kept intact in the content directory, the single Install button is now Install (Extract) and Install (Package)：package install copies the file as-is into the content tree with byte-progress, lists entries via embedded STFS metadata (with embedded thumbnails) and removes the file when the entry is deleted, while extraction remains the choice for older Xenia builds and forks. Refreshing the UI now also scans the games folder so newly added games are picked up, the installed content menu splits into four per-type entries with dedicated entry points in the content viewer (localized in en/hr, rest synced as untranslated), and content rows show installation size and version instead of bare filenames in both the desktop viewer and Big Screen.\r\n\r\n• **File format backend** ([ffdba14](https://github.com/xenia-manager/xenia-manager/commit/ffdba143b43fe53f7f77250d4f69a09e7c14c790), [5aef693](https://github.com/xenia-manager/xenia-manager/commit/5aef69392b7908fe38f1cb103b20ec7f0bfcf56b), [14c8cf7](https://github.com/xenia-manager/xenia-manager/commit/14c8cf7f1118d1fdc64477d8edeccc1f77b90103), [1dff939](https://github.com/xenia-manager/xenia-manager/commit/1dff939b5d4a54f6983dde238bdcd032a2723cad), [6231caf](https://github.com/xenia-manager/xenia-manager/commit/6231caff222087f1ae2e0b3c67694869251414df), [aa58543](https://github.com/xenia-manager/xenia-manager/commit/aa585439f0b5c0764f57245bc81148ca474f9973), [aff9ec7](https://github.com/xenia-manager/xenia-manager/commit/aff9ec7e24b2c01b36cf9f3c957e0a47ef9c8f64), [2964191](https://github.com/xenia-manager/xenia-manager/commit/2964191927513f486dcfce57db2fd9f025b59d20), [00c0051](https://github.com/xenia-manager/xenia-"
