ReleaseNotes: "# 🛠️ Xenia Manager v4.3.2\r\n\r\n## 📝 Changelog\r\n\r\n### 🛡️ Security Fixes\r\n\r\n• **Prevent Path Traversal in STFS/ZAR Content Extraction** ([b4965bf](https://github.com/xenia-manager/xenia-manager/commit/b4965bf1a9e9ed402a97465b84cd7cd00049719c))\r\n  Fixed a path traversal vulnerability in STFS and ZAR content extraction. A maliciously crafted content package could write files to any location the current user can write to — including the Windows Startup folder for code execution at the next logon. All extracted file paths are now validated to stay inside the target content folder ([GitHub Advisory](https://github.com/xenia-manager/xenia-manager/security/advisories/GHSA-9h49-rrwv-5rrj)).\r\n\r\n## 🎉 Thank You\r\n\r\nHuge thanks to all contributors 💛 for reporting and helping fix the STFS/ZAR path traversal vulnerability."
