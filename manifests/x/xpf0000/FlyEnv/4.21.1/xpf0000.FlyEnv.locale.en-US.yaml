ReleaseNotes: |-
  FlyEnv v4.21.1 Update Release Notes
  🚀 New Features
  1. Added NTP Server Plugin
  Run a local NTP server on Windows, macOS, or Linux to test how applications and devices behave at a particular time. The plugin supports real time with optional upstream synchronization, a clock that continues ticking with a configurable offset, and a clock frozen at a specific date and time. The simulated clock applies to clients using this NTP server. The host system clock stays unchanged.
  Install a server version through Version Manager. Use Configuration File to edit the JSON or set the clock mode, listen address, and UDP port in Quick Settings. Once the service is running, the green network button shows the connection details. The Log tab shows startup errors and client requests when request logging is enabled.
  Thanks for the feature request, @charliesimasiku1-del. Issue #961

  2. Added Borders and Rounded Corners to Image Compression
  The Image Effects tab now lets you enable borders and rounded corners independently. Border width and color are adjustable, with a default of 1 px in light gray. The corner radius is adjustable, too. You can preview both effects before applying them to a batch of images.
  Thanks for the feature request, @vendeeglobe. Issue #978

  🛠️ Improvements & Bug Fixes
  3. Fixed Podman Lists and Remote Machine Connections
  Podman now displays containers whose port data is returned as null. FlyEnv also resolves the destination behind the selected named connection, so rootful Podman machines can show their containers and images. Image removal uses the selected connection.
  Thanks for both contributions, @pemila. Pull Request #970 · Pull Request #972

  4. Improved Homebrew Formula Upgrades
  Version Manager → Homebrew can now upgrade supported installed formulae beyond PHP, including database formulae. FlyEnv shows which formulae may be affected, stops related managed services, runs the upgrade in the shared terminal, and refreshes installed versions afterward. This gives users a way to run point upgrades and refresh FlyEnv's version lists in the same workflow.
  Thanks for reporting the stale paths after point upgrades, @cpoteet. Issue #962

  5. Clarified PHP Service Controls on Windows
  Disabled sidebar switches now explain what is needed to use them. In the PHP module, the tooltip explains how to enable a PHP project's service and points users running a local website to FlyEnv's PHP-FPM module. The PHP-FPM switch also indicates when versions are loading, an operation is in progress, or a usable version is needed.
  Thanks for reporting the startup and diagnostics experience, @sachssoft. Issue #975

  6. Improved MCP Connections for Browser Clients
  Browser-based MCP clients can connect directly to FlyEnv once their web app's exact origin is added under Allowed browser origins. FlyEnv handles CORS preflight for allowed origins and checks the Bearer token on every MCP request.
  Thanks for reporting the connection issue, @vaanwd. Issue #976

  7. Clarified AI Memory Tool Parameters
  AI Memory 0.1.5 updates its MCP tool descriptions and agent rules with examples for global searches, project searches, and searches that include both scopes. The read tool explains how to use the ID and scope from a search result. Call records now show the specific error when a project has not been registered.

  8. Fixed Windows Startup and Tray Status
  Opening FlyEnv again while it is still initializing no longer triggers a showPage error. The tray icon now also reflects services running outside the default startup group.

  📦 Build & Transparency
  FlyEnv installation packages are built with GitHub Actions. Build history
  Share feedback and report problems through GitHub Issues.
  Enjoy the update!
