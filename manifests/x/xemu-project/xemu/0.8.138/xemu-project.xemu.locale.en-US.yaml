ReleaseNotes: |-
  Pull Requests
  - #3125 - Improve compatibility with older versions of Vulkan (@mborgerson)
  - #2968 - Fix 2906 memory leak in slow vga path (@abaire)
  - #3124 - nv2a/vk: Support Vulkan 1.4 (@mborgerson)
  - #3123 - nv2a/vk: Select SPIR-V target from renderer state at compile time (@mborgerson)
  - #3000 - nv2a/vk: compile SPIR-V for the version the device supports (@jessedye)
  - #2453 - debug: Log GL errors during assertions in debug mode (@abaire)
  - #2211 - nv2a: Resolve overlapped dirty draws during 2d blit ops (@abaire)
  - #2456 - Adds menu item to create a GitHub title issue (@abaire)
  - #3114 - ci: Use the host's GLib in the AppImage (@mborgerson)
  - #3056 - nv2a: Enable clear handling for X1A7 formats (@abaire)
  - #2720 - nv2a: Fix R12 input in paired/multiout ops writing to oPos (@abaire)
  - #2843 - nv2a: Fix epoxy flake using debug funcs on macOS (@abaire)
  - #2158 - nv2a: Fix handling of color/zeta offset with RAM addresses (@abaire)
  - #2083 - Fix material color source ambient and emissive (@abaire)
  - #3068 - nv2a: Always report PFIFO CACHE1_DMA_CTL as valid (@GXTX)
  - #3076 - nv2a: Fix specular param handling (@abaire)
  - #3094 - nv2a: Only enable point sprites when rendering points (@abaire)
  - #3070 - nv2a: Fix/implement Y16 texture formats (@abaire)
  - #3087 - nv2a: Implement texgen view model (@abaire)
  - #3085 - nv2a: Implement clamping of passthru values (@abaire)
  - #3078 - nv2a: Implement spotlight falloff (@abaire)
  - #3106 - ci: Run xemu-test on PRs (@abaire)
  - #3110 - nv2a: Remove unconfirmed message for empty begin/end groups (@abaire)
  Issues Fixed
  - #2906 - null render memory leak
  - #950 - Splinter Cell: Pandora Tomorrow fire effects cause artefacts
  - #2199 - Fireblade Imaging thermal freezes the screen
  - #473 - UI shortcut to report GitHub issues
  - #3043 - Xemu window bar doesn't show up on debian gnome wayland
  - #2426 - Clear color handling for LE_X1A7R8G8B8_O1A7R8G8B8 and LE_X1A7R8G8B8_Z1A7R8G8B8 needs testing/assert removal
  - #2427 - Surface format NV097_SET_SURFACE_FORMAT_COLOR_LE_X8R8G8B8_O8R8G8B8 is not implemented
  - #2458 - MechAssault 2: Lone Wolf graphical issue
  - #1864 - Prince of Persia: The Sands of Time: Incorrect rendering of water surface
  - #326 - [Assertion] surface->offset ⇐ dma.limit
  - #3075 - Specular highlighting is an approximation rather than a match for hardware
  - #3093 - psh: Texture 3 sampler is incorrectly forced to point_sprite for non-point rendering when NV_PGRAPH_SETUPRASTER_POINTSMOOTHENABLE is enabled
  - #2657 - Unimplemented Texture format NV097_SET_TEXTURE_FORMAT_COLOR_SZ_Y16
  - #3086 - NV097_SET_TEXGEN_VIEW_MODEL_INFINITE_VIEWER is silently ignored for NV097_SET_TEXGEN_VIEW_MODEL
  - #2523 - Crazy Taxi 3: High Roller - Dark light cast behind taxi car in stages with headlight on (cause: PASSTHROUGH texture coords must be clamped to match HW)
  - #3077 - Spotlight falloff is not implemented
  - #771 - nv2a: Warning unconfirmed feature: EMPTY NV097_SET_BEGIN_END
  Affected Titles
  The following titles had issues fixed in this release:
  - MechAssault 2: Lone Wolf (#2458)
  - FireBlade (#2199)
  - Crazy Taxi 3: High Roller (#2523)
  - ESPN NFL Football (#326)
  - Fatal Frame II: Crimson Butterfly (#326)
  - New Legends (#2657)
  - Tom Clancy's Splinter Cell: Pandora Tomorrow (#950)
  - Prince of Persia: The Sands of Time (#1864)
