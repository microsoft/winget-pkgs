ReleaseNotes: |-
  Tip
  Join the Ghost Downloader community on Discord: discord.gg/fKfhkPumEM
  Important
  The Android app has been rebuilt natively with Jetpack Compose and Material Design 3 (#659, #683, #699, #762, #803, #832, #873)
  New Features 🎉
  - Choose to keep both, overwrite, or ask when a file with the same name already exists (#781, #852) By @XiaoYouChR
  - Added a task details panel (#346) By @XiaoYouChR
  - Click a task's name to open the file, or its info line to view details By @XiaoYouChR
  - Checksums are saved with the task and can be compared against a pasted value By @XiaoYouChR
  - Change the speed limit directly from the download page (#766) By @XiaoYouChR
  - BitTorrent and eD2k tasks complete when the download finishes, and seeding no longer takes up a task slot (#772, #839) By @XiaoYouChR
  - Tracker lists and eD2k server lists now update automatically By @XiaoYouChR
  - Aria2 RPC now supports WebSocket (#769) By @XiaoYouChR
  - Notifies you when a link sent through Aria2 RPC fails to parse By @XiaoYouChR
  - Shows why the browser extension or Aria2 RPC port could not be opened By @XiaoYouChR
  Improvements 🔧
  - Task cards now show a fixed set of buttons, and unavailable ones are greyed out (#452) By @XiaoYouChR
  - Runtimes can be updated or uninstalled while running, and installation can be cancelled By @XiaoYouChR
  - yt-dlp nightly downloads are faster and more reliable in mainland China By @XiaoYouChR
  - Smoother expand and collapse in Settings By @XiaoYouChR
  - Port changes for the browser extension and Aria2 RPC take effect immediately By @XiaoYouChR
  - Updated translations By @XiaoYouChR
  Bug Fixes 🐛
  - Fixed OpenList failing to send downloads through Aria2 RPC (#896, #905) By @Code-LSQ
  - Fixed some Aria2 RPC clients failing to connect (#769) By @XiaoYouChR
  - Fixed an error when a downloaded file's path could not be read (#881) By @XiaoYouChR
  - Fixed file names containing slashes being truncated (#812) By @XiaoYouChR
  - Fixed AppImage shortcuts breaking after a reboot (#817, #846) By @XiaoYouChR
  - Fixed links and file associations not opening the .deb version By @XiaoYouChR
  - Fixed the app launching on unsupported macOS versions (#786) By @i0ntempest @XiaoYouChR
  - Fixed the update dialog background on macOS By @XiaoYouChR
  - Fixed the file selection dialog being too small on large screens (#857) By @XiaoYouChR
  - Fixed SHAKE checksums failing By @XiaoYouChR
  Feature Pack Updates 📦
  > The following updates may have already been delivered via automatic pack updates.
  - ed2k_pack 2.0.0 — Switched to the new Kelpie engine, with SOCKS5 proxy support and live connection status By @XiaoYouChR
  - bittorrent_pack 1.1.0 — Task details show trackers and peers. Fixed BitTorrent not connecting behind an HTTP proxy By @XiaoYouChR
  - github_pack 1.1.0 — Added an "Auto" mode that picks the fastest of 21 mirrors By @XiaoYouChR
  - http_pack 1.1.0 — Fixed downloads stalling near the end (#665) By @XiaoYouChR
  - m3u8_pack 1.1.0 — Videos from the browser extension are named after the page title (#866) By @XiaoYouChR
  - bili_pack 1.2.0 — Fixed titles containing slashes being truncated (#812) By @XiaoYouChR
  - yt_dlp_pack 1.3.0 — Choose the audio language, with the original audio as default (#802, #861) By @XiaoYouChR
  - ffmpeg_pack 1.1.0, ftp_pack 1.1.0, huggingface_pack 1.1.0 — Compatibility with Ghost Downloader 4.4.0 By @XiaoYouChR
  Tip
  欢迎加入 Ghost Downloader Discord 社区: discord.gg/fKfhkPumEM
  Important
  Android 版已使用 Jetpack Compose 与 Material Design 3 原生重写 (#659, #683, #699, #762, #803, #832, #873)
  新功能 🎉
  - 遇到同名文件时可以选择保留两者、覆盖或询问 (#781, #852) By @XiaoYouChR
  - 新增任务详情面板 (#346) By @XiaoYouChR
  - 点击任务名称打开文件, 点击信息行查看详情 By @XiaoYouChR
  - 校验值随任务保存, 支持粘贴期望值比对 By @XiaoYouChR
  - 下载页可直接修改限速 (#766) By @XiaoYouChR
  - BT 和 eD2k 任务下载完即完成, 做种不再占用任务槽 (#772, #839) By @XiaoYouChR
  - Tracker 列表和 eD2k 服务器列表自动更新 By @XiaoYouChR
  - Aria2 RPC 支持 WebSocket (#769) By @XiaoYouChR
  - Aria2 RPC 添加的链接解析失败时发送通知 By @XiaoYouChR
  - 浏览器扩展或 Aria2 RPC 端口无法监听时显示原因 By @XiaoYouChR
  功能优化 🔧
  - 任务卡片按钮固定, 不可用时置灰 (#452) By @XiaoYouChR
  - 运行时可在运行中更新或卸载, 安装可取消 By @XiaoYouChR
  - yt-dlp nightly 在国内下载更快更稳定 By @XiaoYouChR
  - 设置页展开折叠更流畅 By @XiaoYouChR
  - 修改浏览器扩展和 Aria2 RPC 端口后立即生效 By @XiaoYouChR
  - 更新翻译 By @XiaoYouChR
  问题修复 🐛
  - 修复 OpenList 无法通过 Aria2 RPC 推送下载的问题 (#896, #905) By @Code-LSQ
  - 修复部分 Aria2 RPC 客户端无法连接的问题 (#769) By @XiaoYouChR
  - 修复无法读取已下载文件路径时报错的问题 (#881) By @XiaoYouChR
  - 修复文件名含斜杠时被截断的问题 (#812) By @XiaoYouChR
  - 修复 AppImage 快捷方式重启后失效的问题 (#817, #846) By @XiaoYouChR
  - 修复 .deb 版无法通过链接和文件关联唤起的问题 By @XiaoYouChR
  - 修复 macOS 在不支持的系统版本上仍能启动的问题 (#786) By @i0ntempest @XiaoYouChR
  - 修复 macOS 下更新对话框背景的问题 By @XiaoYouChR
  - 修复文件选择对话框在大屏幕上过小的问题 (#857) By @XiaoYouChR
  - 修复 SHAKE 校验值计算失败的问题 By @XiaoYouChR
  功能包更新 📦
  > 以下更新可能已通过自动更新提前推送。
  - ed2k_pack 2.0.0 — 改用全新 Kelpie 引擎, 支持 SOCKS5 代理, 实时显示连接状态 By @XiaoYouChR
  - bittorrent_pack 1.1.0 — 任务详情显示 Tracker 和 Peer。修复使用 HTTP 代理时无法连接的问题 By @XiaoYouChR
  - github_pack 1.1.0 — 新增"自动"选站, 从 21 个镜像中选最快的 By @XiaoYouChR
  - http_pack 1.1.0 — 修复下载临近完成时卡住的问题 (#665) By @XiaoYouChR
  - m3u8_pack 1.1.0 — 浏览器扩展发送的视频以页面标题命名 (#866) By @XiaoYouChR
  - bili_pack 1.2.0 — 修复标题含斜杠时被截断的问题 (#812) By @XiaoYouChR
  - yt_dlp_pack 1.3.0 — 可选择音轨语言, 默认原声 (#802, #861) By @XiaoYouChR
  - ffmpeg_pack 1.1.0, ftp_pack 1.1.0, huggingface_pack 1.1.0 — 适配 Ghost Downloader 4.4.0 By @XiaoYouChR
