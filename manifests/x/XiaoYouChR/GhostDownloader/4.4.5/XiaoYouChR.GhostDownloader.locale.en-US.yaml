ReleaseNotes: |-
  Warning
  This is a security update. Please update as soon as possible, preferably on a network you trust.
  Tip
  Join the Ghost Downloader community on Discord: discord.gg/fKfhkPumEM
  Improvements 🔧
  - Running ghd without a command now shows the help instead of an error By @XiaoYouChR
  - ghd --version now shows the package name along with the version By @XiaoYouChR
  - Upgraded Python on Android to 3.14.8 By @XiaoYouChR
  Bug Fixes 🐛
  - Checking for updates and installing updates and feature packs now always verifies the server certificate, even when "Verify SSL Certificates" is turned off By @XiaoYouChR
  - Fixed leaked eMudhra certificates still being trusted when "Verify SSL Certificates" is turned on By @XiaoYouChR
  - Fixed an extra blank line at the end of ghd --help and ghd --version output By @XiaoYouChR
  Warning
  本次为安全更新, 请尽快升级, 并尽量在可信的网络下进行.
  Tip
  欢迎加入 Ghost Downloader Discord 社区: discord.gg/fKfhkPumEM
  功能优化 🔧
  - 直接运行 ghd 时显示帮助, 不再报错 By @XiaoYouChR
  - ghd --version 的输出带上软件包名 By @XiaoYouChR
  - Android 端 Python 升级至 3.14.8 By @XiaoYouChR
  问题修复 🐛
  - 检查更新, 安装更新和功能包时始终验证服务器证书, 不受"下载时验证 SSL 证书"开关影响 By @XiaoYouChR
  - 修复开启"下载时验证 SSL 证书"后仍信任 eMudhra 泄露证书的问题 By @XiaoYouChR
  - 修复 ghd --help 和 ghd --version 输出末尾多一个空行的问题 By @XiaoYouChR
