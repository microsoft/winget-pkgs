ReleaseNotes: |-
  Tip
  Join the Ghost Downloader community on Discord: discord.gg/fKfhkPumEM
  New Features 🎉
  - The GD4B browser extension has been upgraded to 2.1.3 — the skip-interception shortcut now supports custom key combinations By @XiaoYouChR
  - YouTube now supports time-range downloads with a dual-slider selector and storyboard thumbnail preview (#690) By @XiaoYouChR
  - Bilibili now supports time-range downloads with a dual-slider selector and thumbnail preview By @XiaoYouChR
  - Download tracks can now be toggled independently: video, audio, subtitles, and cover art each have their own switch By @XiaoYouChR
  - Drag and drop files or links onto the main window to add download tasks By @XiaoYouChR
  - BitTorrent downloads now support HTTP, HTTPS, and SOCKS4 proxies By @XiaoYouChR
  - GitHub download accelerator now automatically falls back through proxy sites when one is down, with a final fallback to direct connection By @XiaoYouChR
  - macOS now shows a guided prompt when Downloads folder access is denied By @XiaoYouChR
  Improvements 🔧
  - Faster magnet link metadata retrieval via DHT routing table persistence and additional bootstrap nodes (#711) By @XiaoYouChR
  - Updated translations By @i0ntempest
  - The system DNS setting card has been moved above the proxy settings for better discoverability By @XiaoYouChR
  - The GitHub download accelerator is now disabled by default By @XiaoYouChR
  Bug Fixes 🐛
  - Fixed Facebook and Instagram video downloads failing (#720) By @XiaoYouChR
  - Fixed domain resolution failures in TUN mode by using system DNS (#703, #707) By @XiaoYouChR & @2514607673
  - Fixed chunked downloads failing on CDNs that serve pre-compressed content By @XiaoYouChR
  - Fixed the GD4B browser extension losing cookies when intercepting downloads, causing login-required sites to return a web page instead of the file (#677, #689) By @XiaoYouChR
  - Fixed M3U8 tasks crashing when the download directory is inaccessible By @XiaoYouChR
  - Fixed yt-dlp playlist URLs showing "file not found" after downloading a single video By @XiaoYouChR
  - Fixed M3U8 tasks crashing on macOS By @XiaoYouChR
  - Fixed QJS runtime installation failing on macOS By @XiaoYouChR
  Tip
  欢迎加入 Ghost Downloader Discord 社区: discord.gg/fKfhkPumEM
  新增功能 🎉
  - GD4B 浏览器扩展升级至 2.1.3：跳过接管快捷键支持自定义组合键 By @XiaoYouChR
  - YouTube 支持时间段下载，双滑块选择器 + 分镜缩略图预览 (#690) By @XiaoYouChR
  - Bilibili 支持时间段下载，双滑块选择器 + 缩略图预览 By @XiaoYouChR
  - 下载轨道自由组合：视频、音频、字幕、封面可独立开关 By @XiaoYouChR
  - 拖拽文件或链接到主窗口即可添加下载任务 By @XiaoYouChR
  - BT 下载支持 HTTP、HTTPS、SOCKS4 代理 By @XiaoYouChR
  - GitHub 下载加速代理站宕机时自动逐站切换，最终回退至直连 By @XiaoYouChR
  - macOS 下载目录权限被拒绝时显示引导提示 By @XiaoYouChR
  功能优化 🔧
  - 加速磁力链接元数据获取，DHT 路由表持久化 + 补充引导节点 (#711) By @XiaoYouChR
  - 更新翻译 By @i0ntempest
  - 系统 DNS 设置卡片移到代理设置上方，更易发现 By @XiaoYouChR
  - GitHub 下载加速功能默认关闭 By @XiaoYouChR
  问题修复 🐛
  - 修复 Facebook 和 Instagram 视频下载失败的问题 (#720) By @XiaoYouChR
  - 修复 TUN 模式下域名解析失败导致下载失败的问题 (#703, #707) By @XiaoYouChR & @2514607673
  - 修复 CDN 预压缩流导致分块下载错误降级的问题 By @XiaoYouChR
  - 修复 GD4B 浏览器扩展拦截下载丢失 Cookie，导致需要登录的站点下载出网页的问题 (#677, #689) By @XiaoYouChR
  - 修复 M3U8 下载目录不可读时崩溃的问题 By @XiaoYouChR
  - 修复 yt-dlp 播放列表中单视频下载后显示文件不存在的问题 By @XiaoYouChR
  - 修复 macOS 下 M3U8 任务崩溃的问题 By @XiaoYouChR
  - 修复 macOS 下 QJS 运行时安装失败的问题 By @XiaoYouChR
