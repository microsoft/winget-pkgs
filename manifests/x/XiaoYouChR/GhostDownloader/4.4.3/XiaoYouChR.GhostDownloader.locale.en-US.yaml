ReleaseNotes: |-
  Tip
  Join the Ghost Downloader community on Discord: discord.gg/fKfhkPumEM
  New Features 🎉
  - Aria2 RPC supports batch calls (#931) By @XiaoYouChR
  - Recent folders can be removed one by one, and the default folder is always listed first By @XiaoYouChR
  Improvements 🔧
  - Smoother scrolling and animations on high refresh rate displays on Windows (#936) By @XiaoYouChR
  - Upgraded dependencies to improve download speed By @XiaoYouChR
  Bug Fixes 🐛
  - Fixed downloads on Windows having no speed in v4.4.2 (#945) By @XiaoYouChR
  - Fixed memory usage growing each time a dialog or the task details panel is opened in v4.4.1 By @XiaoYouChR
  - Fixed an error after choosing to overwrite a file with the same name (#937) By @XiaoYouChR
  - Fixed eD2k engine failing to start on Windows (#938) By @XiaoYouChR
  - Fixed a crash after adding an eD2k task on Android (#938) By @XiaoYouChR
  - Fixed clicking the macOS menu bar icon not opening the main window (#889) By @XiaoYouChR
  - Fixed the folder field not updating after browsing to a new folder By @XiaoYouChR
  Feature Pack Updates 📦
  > The following updates may have already been delivered via automatic pack updates.
  - http_pack 1.1.4 — Fixed large files sent from the browser extension being incomplete (#923). Fixed a regression that slowed downloads on fast connections By @XiaoYouChR
  - bittorrent_pack 1.1.1 — Faster downloads from a single peer. Fixed tasks failing when a piece fails verification By @XiaoYouChR
  - bili_pack 1.2.1, huggingface_pack 1.1.1, m3u8_pack 1.1.1, yt_dlp_pack 1.3.1 — Upgraded dependencies By @XiaoYouChR
  Tip
