ReleaseNotes: |-
  Note
  Updates will be less frequent due to my studies. Thank you for your understanding. Feedback is always welcome.
  Buy me a coffee: Donate
  New Features 🎉
  - Added Arabic, Malay and Turkish. Translations are now managed on Crowdin, untranslated text falls back to English, and the installer uses the same language as the app By @XiaoYouChR
  - Linux packages now support the fcitx5 input method out of the box (#1109) By @XiaoYouChR
  Improvements 🔧
  - Improved English translations (#1098) By @i0ntempest
  - Aria2 RPC compatibility now supports saving into subfolders and relative download folders By @XiaoYouChR
  Bug Fixes 🐛
  - Fixed the interface language being stuck in Chinese after updating to v4.5.9 (#1116) By @XiaoYouChR
  - Fixed built-in category and preset names staying in Chinese in other languages (#1107) By @XiaoYouChR
  - Fixed the tracker subscription list being squashed when there are many URLs (#1111) By @XiaoYouChR
  - Fixed the task popup not minimizing on Windows By @XiaoYouChR
  - Fixed the scroll wheel being pulled back while jumping to a settings section on macOS By @XiaoYouChR
  Feature Pack Updates 📦
  > The following updates may have already been delivered via automatic pack updates.
  - m3u8_pack 1.3.0 — Fixed streaming videos with subtitles having no sound after download. Subtitles are now saved as separate files and are off by default. You can choose subtitle languages when creating or editing a task, even after it has finished (#1031) By @XiaoYouChR
  - bittorrent_pack 1.4.0 — The BitTorrent engine now starts only when needed and shuts down after 5 minutes of inactivity, reducing idle CPU and disk usage. It can also be stopped manually in settings (#1105) By @XiaoYouChR
  - ed2k_pack 2.1.1 — The eD2k engine now shuts down after 5 minutes of inactivity (#1105) By @XiaoYouChR
  - bili_pack 1.4.1 — Dolby Vision and Dolby Atmos quality labels are now translated (#1107) By @XiaoYouChR
  Note
  由于本人学业原因, 更新节奏有所放缓, 敬请谅解. 欢迎继续提供反馈.
  请我喝杯咖啡: 捐赠项目
  新功能 🎉
  - 新增阿拉伯语、马来语和土耳其语. 译文改由 Crowdin 统一管理, 未翻译的文字显示英文, 安装器语言与应用保持一致 By @XiaoYouChR
  - Linux 发行包开箱即用支持 fcitx5 输入法 (#1109) By @XiaoYouChR
  功能优化 🔧
  - 完善英文翻译 (#1098) By @i0ntempest
  - Aria2 RPC 兼容功能支持保存到子文件夹和相对下载目录 By @XiaoYouChR
  问题修复 🐛
  - 修复更新到 v4.5.9 后界面语言变成中文且无法切换的问题 (#1116) By @XiaoYouChR
  - 修复其他语言下内置分类和预设名称仍显示中文的问题 (#1107) By @XiaoYouChR
  - 修复 Tracker 订阅地址较多时列表被压扁的问题 (#1111) By @XiaoYouChR
  - 修复 Windows 上任务弹窗无法最小化的问题 By @XiaoYouChR
  - 修复 macOS 上跳转设置分组途中滚轮被拉回的问题 By @XiaoYouChR
  功能包更新 📦
  > 以下更新可能已通过自动更新提前推送。
  - m3u8_pack 1.3.0 — 修复带字幕的流媒体下载后没有声音的问题. 字幕改为单独保存的文件, 默认不下载, 新建或编辑任务时可选择字幕语言, 任务完成后也能补选 (#1031) By @XiaoYouChR
  - bittorrent_pack 1.4.0 — BT 引擎改为按需启动, 空闲 5 分钟后自动关闭, 降低空闲时的 CPU 与磁盘占用, 也可在设置中手动停止 (#1105) By @XiaoYouChR
  - ed2k_pack 2.1.1 — eD2k 引擎空闲 5 分钟后自动关闭 (#1105) By @XiaoYouChR
  - bili_pack 1.4.1 — 杜比视界与杜比全景声画质名称支持翻译 (#1107) By @XiaoYouChR
