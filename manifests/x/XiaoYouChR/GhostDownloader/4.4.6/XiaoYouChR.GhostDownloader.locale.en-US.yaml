ReleaseNotes: |-
  Important
  We recommend updating the latest browser extension via Settings > Browser Extension > Install within the app (#390)
  Tip
  Join the Ghost Downloader community on Discord: discord.gg/fKfhkPumEM
  New Features 🎉
  - The taskbar icon on Windows and Linux shows the overall progress of running tasks. The macOS Dock icon shows an indeterminate progress when task sizes are unknown By @XiaoYouChR
  - New setting "Auto-Remove Missing Tasks": tasks whose files were deleted, moved, or are on a disconnected drive are removed from the list automatically, and the browser extension stays in sync (#912) By @XiaoYouChR
  Improvements 🔧
  - Custom proxy addresses are kept after switching to "No Proxy" or "Auto Detect", so you no longer need to re-enter them (#952) By @XiaoYouChR
  - The file selection dialog widens to fit long names (#921) By @XiaoYouChR
  - Faster disk writes on Windows By @XiaoYouChR
  - Windows ARM64 builds are available again By @XiaoYouChR
  Bug Fixes 🐛
  - Fixed the app failing to start when the download folder cannot be created. Tasks that cannot be added now return to the "Add Task" dialog with the reason, so you can pick another folder (#152) By @XiaoYouChR
  - Fixed the "Add Task" dialog not coming to the front when it opens again By @XiaoYouChR
  - Fixed the toolbar and task cards on the Tasks page being misaligned By @XiaoYouChR
  GD4B Browser Extension Updates 🌐
  - v2.3.0
  - The task panel supports search and sorting, and the More menu can remove completed tasks or missing tasks (#912, #913) By @XiaoYouChR
  - The resource panel supports search, sorting, and filtering by type By @XiaoYouChR
  - PDFs embedded in web pages can now be captured (#969) By @XiaoYouChR
  - New compact style for the media button By @XiaoYouChR
  - Redesigned the popup header in Fluent style with a lower height By @XiaoYouChR
  - No longer shows a redundant notice after a task action succeeds By @XiaoYouChR
  - Fixed downloading a different video than the one playing, such as the preloaded next video (#974) By @XiaoYouChR
  - Fixed some short-video sites failing to download By @XiaoYouChR
  - Fixed hover previews on a video site's home page downloading the home page URL instead of the video (#955) By @XiaoYouChR
  - Fixed some sites' videos showing corrupted frames or failing to play with the extension enabled (#849, #951) By @XiaoYouChR
  - Fixed DASH video tracks being detected as audio tracks By @XiaoYouChR
  - Fixed images without an extension in their URL being saved without a file extension (#814) By @XiaoYouChR
  - Fixed the popup still opening after sending a task when "Open popup when task sent" is turned off (#926) By @XiaoYouChR
  - Updated cat-catch to 2.7.4. CORS preflight requests are no longer listed as resources (#980) By @XiaoYouChR
  Feature Pack Updates 📦
  > The following updates may have already been delivered via automatic pack updates.
  - bili_pack 1.2.3 — Download favorites, skipping unavailable videos. New default audio quality setting. Dolby Atmos and Hi-Res audio can be selected, and audio qualities are listed from highest bitrate. Fixed Dolby Vision quality failing to download. Fixed quality names in settings not matching the actual quality By @XiaoYouChR
  - ffmpeg_pack 1.1.2 — Dolby Vision videos no longer show wrong colors after merging By @XiaoYouChR
  - yt_dlp_pack 1.3.5 — Fixed the cover being downloaded when it is not selected By @XiaoYouChR
  - http_pack 1.1.6 — Fixed corrupted downloads from some servers (#888). Fixed downloads failing when a CDN limits the rate. Fixed downloads retrying endlessly on some servers By @XiaoYouChR
  - ftp_pack 1.1.2 — Fixed FTPS connections still trusting leaked eMudhra certificates when "Verify SSL Certificates" is turned on By @XiaoYouChR
  Important
  我们建议通过软件内的 设置 > 浏览器扩展 > 一键安装 的方式来更新最新的浏览器插件 (#390)
  Tip
  欢迎加入 Ghost Downloader Discord 社区: discord.gg/fKfhkPumEM
  新功能 🎉
  - Windows 和 Linux 任务栏图标显示下载中任务的总进度. macOS Dock 图标在任务大小未知时显示不确定进度 By @XiaoYouChR
  - 新增"自动移除缺失的任务"设置: 文件被删除, 移走或所在磁盘未连接时, 任务自动从列表中移除, 浏览器扩展同步 (#912) By @XiaoYouChR
  功能优化 🔧
  - 切换到"不使用代理"或"自动检测"后保留自定义代理地址, 切回时无需重填 (#952) By @XiaoYouChR
  - 选择文件对话框随名称长度自动加宽 (#921) By @XiaoYouChR
  - Windows 上写盘更快 By @XiaoYouChR
  - 恢复 Windows ARM64 版本 By @XiaoYouChR
  问题修复 🐛
  - 修复下载文件夹无法创建时程序无法启动的问题. 任务无法添加时退回"添加任务"对话框并说明原因, 可直接更换文件夹 (#152) By @XiaoYouChR
  - 修复"添加任务"对话框再次弹出时无法置于前台的问题 By @XiaoYouChR
  - 修复任务页工具栏和任务卡片不对齐的问题 By @XiaoYouChR
  GD4B 浏览器扩展更新 🌐
  - v2.3.0
  - 任务面板支持搜索和排序, 更多菜单可移除已完成或文件缺失的任务 (#912, #913) By @XiaoYouChR
  - 资源面板支持搜索, 排序和按类型筛选 By @XiaoYouChR
  - 可嗅探网页内嵌的 PDF (#969) By @XiaoYouChR
  - 媒体按钮新增精简样式 By @XiaoYouChR
  - 顶栏改为 Fluent 风格, 高度更紧凑 By @XiaoYouChR
  - 任务操作成功后不再弹出多余提示 By @XiaoYouChR
  - 修复下载的视频与正在播放的不一致, 例如下成预加载的下一条 (#974) By @XiaoYouChR
  - 修复部分短视频网站无法下载的问题 By @XiaoYouChR
  - 修复在视频网站首页悬停预览时下载到首页地址的问题 (#955) By @XiaoYouChR
  - 修复开启扩展后部分网站视频花屏或无法播放的问题 (#849, #951) By @XiaoYouChR
  - 修复 DASH 视频轨被识别成音频轨的问题 By @XiaoYouChR
  - 修复图片地址不带扩展名时, 下载的文件缺少扩展名的问题 (#814) By @XiaoYouChR
  - 修复关闭"发送任务后弹出扩展窗口"后仍会弹出的问题 (#926) By @XiaoYouChR
  - cat-catch 升级至 2.7.4, 不再把 CORS 预检请求识别为资源 (#980) By @XiaoYouChR
  功能包更新 📦
  > 以下更新可能已通过自动更新提前推送。
  - bili_pack 1.2.3 — 支持下载收藏夹, 自动跳过失效内容. 新增默认音质设置. 可选择杜比全景声和 Hi-Res 音质, 音质按码率从高到低排列. 修复杜比视界画质无法下载的问题. 修复设置中画质名称与实际画质不符的问题 By @XiaoYouChR
  - ffmpeg_pack 1.1.2 — 杜比视界视频合并后不再偏色 By @XiaoYouChR
  - yt_dlp_pack 1.3.5 — 修复未勾选封面时仍下载封面的问题 By @XiaoYouChR
  - http_pack 1.1.6 — 修复部分服务器下载文件损坏的问题 (#888). 修复 CDN 限流时下载失败的问题. 修复部分服务器下载一直重试的问题 By @XiaoYouChR
  - ftp_pack 1.1.2 — 修复开启"下载时验证 SSL 证书"后 FTPS 连接仍信任 eMudhra 泄露证书的问题 By @XiaoYouChR
