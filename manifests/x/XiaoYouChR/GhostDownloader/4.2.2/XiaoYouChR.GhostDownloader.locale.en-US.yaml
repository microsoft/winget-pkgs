ReleaseNotes: |-
  Important
  We recommend updating the latest browser extension via Settings > Browser Extension > One-Click Install within the app (#390)
  Tip
  Join the Ghost Downloader community on Discord: discord.gg/fKfhkPumEM
  New Features 🎉
  - The GD4B browser extension has been upgraded to 2.1.2 — enhanced image sniffing (CSS background images and full-page regex matching), skip interception by domain, option to disable the popup after sending a task, deleted task cards now show a strikethrough title, and "re-download" moved to the context menu By @XiaoYouChR
  - Added the option to set Ghost Downloader as the handler for Magnet, eD2k, FTP, and FTPS protocols By @XiaoYouChR
  - The Android version can now receive shared files and links from other apps By @XiaoYouChR
  - The draft dialog now has a "Download Later" button to save a task without starting it By @XiaoYouChR
  - Added "Move to Top" action for tasks, and a new "Sort by Queue" option By @XiaoYouChR
  - The task list now supports Ctrl+A / Cmd+A to select all tasks By @XiaoYouChR
  - The Windows installer now cleans up AppData on uninstall, and the ghostdownloader:// protocol is now enabled by default By @XiaoYouChR
  Improvements 🔧
  - Improved the GD4B browser extension icon appearance at low resolutions By @XiaoYouChR
  - Downloads now pre-resolve redirects before starting, fixing failures on some CDNs and improving initial download speed By @XiaoYouChR
  - Old log files are now automatically cleaned up By @XiaoYouChR
  Bug Fixes 🐛
  - Fixed a crash when clicking "Download Now" or "View Details" after an update is detected (#671, #672) By @XiaoYouChR
  - Fixed batch-downloaded files with the same name overwriting each other (#658) By @XiaoYouChR
  - Fixed M3U8 downloads being silently marked as completed when merging produces no output file By @XiaoYouChR
  - Fixed the traffic light buttons not aligning with the title bar in the setup wizard on macOS By @XiaoYouChR
  - Fixed some regional locales (e.g. British English) incorrectly displaying the UI in Chinese By @XiaoYouChR
  - Fixed SSL certificate validation failures on Android preventing yt-dlp and FTPS connections By @XiaoYouChR
  - Fixed download speed showing as 0 in the final stage (#665) By @XiaoYouChR
  - Fixed draft dialog parse result display issues (#661) By @XiaoYouChR
  - Fixed M3U8 tasks failing with a tput error on macOS By @XiaoYouChR
  Important
  我们建议通过软件内的 设置 > 浏览器扩展 > 一键安装 的方式来更新最新的浏览器插件 (#390)
  Tip
  欢迎加入 Ghost Downloader Discord 社区: discord.gg/fKfhkPumEM
  新增功能 🎉
  - GD4B 浏览器扩展升级至 2.1.2：增强图片嗅探（支持 CSS 背景图和全文正则匹配）、支持按域名跳过接管、发送任务后弹窗可关闭、已删除的任务卡片标题显示删除线、重新下载移入右键菜单 By @XiaoYouChR
  - 新增将 Ghost Downloader 设为 Magnet、eD2k、FTP、FTPS 协议处理程序的选项 By @XiaoYouChR
  - Android 版支持接收其他应用分享的文件和链接 By @XiaoYouChR
  - 草稿对话框新增"稍后下载"按钮，可保存任务而不立即开始 By @XiaoYouChR
  - 新增将任务移到最前的操作，以及按队列排序功能 By @XiaoYouChR
  - 任务列表支持 Ctrl+A / Cmd+A 全选任务 By @XiaoYouChR
  - Windows 安装程序卸载时自动清理 AppData，ghostdownloader:// 协议现默认开启 By @XiaoYouChR
  功能优化 🔧
  - 优化 GD4B 浏览器扩展图标在低分辨率下的表现 By @XiaoYouChR
  - 下载前预解析重定向，解决部分 CDN 下载失败并提升起步速度 By @XiaoYouChR
  - 自动清理过期日志文件 By @XiaoYouChR
  问题修复 🐛
  - 修复应用内检测到新版本后点击下载或查看详情时崩溃的问题 (#671, #672) By @XiaoYouChR
  - 修复批量下载同名文件互相覆盖的问题 (#658) By @XiaoYouChR
  - 修复 M3U8 下载完成但合并未产出文件时静默标为已完成的问题 By @XiaoYouChR
  - 修复 macOS 首次启动引导窗口红绿灯与标题栏未对齐的问题 By @XiaoYouChR
  - 修复部分地区（如英式英语）界面错误显示为中文的问题 By @XiaoYouChR
  - 修复 Android SSL 证书验证失败导致 yt-dlp 和 FTPS 无法连接的问题 By @XiaoYouChR
  - 修复下载文件在最后阶段速度显示为 0 的问题 (#665) By @XiaoYouChR
  - 修复草稿对话框解析结果显示问题 (#661) By @XiaoYouChR
  - 修复 macOS 下 M3U8 任务 tput 报错的问题 By @XiaoYouChR
