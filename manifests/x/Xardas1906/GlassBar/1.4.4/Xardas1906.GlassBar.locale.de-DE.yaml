ShortDescription: Schwebendes Glas-Dock als Ersatz für die Windows-11-Taskleiste, mit animiertem Hintergrund.
Description: |-
  GlassBar ersetzt die Windows-11-Taskleiste durch ein schwebendes Dock im Glas-Look: angeheftete und laufende Programme,
  Infobereich, Uhr, Musik und Wetter. Dazu kommt ein nativer, animierter Hintergrund mit Uhr, Musik-, Wetter- und Timer-Pillen
  (Nachbau von „Still“) und mehreren Lichteffekten. Beim Beenden kehrt die normale Windows-Taskleiste zurück.
