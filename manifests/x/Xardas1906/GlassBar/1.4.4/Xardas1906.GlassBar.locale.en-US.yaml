ShortDescription: Floating glass dock that replaces the Windows 11 taskbar, with an animated wallpaper.
Description: |-
  GlassBar replaces the Windows 11 taskbar with a floating glass dock: pinned and running apps, notification area, clock,
  music and weather. It also brings a native animated wallpaper with clock, music, weather and timer pills (a recreation of
  "Still") and several light effects. When GlassBar exits, the normal Windows taskbar comes back.
