ShortDescription: Lightweight Markdown viewer for AI-generated docs, with aligned box-drawing diagrams, local SVG images and Chinese text.
Description: |-
  Yang-MarkD is a free, open-source, read-only Markdown viewer built with Tauri.
  It renders box-drawing diagrams on a true character grid (CJK-aware), loads local SVG/PNG images relative to the Markdown file,
  and handles GFM tables and mixed Chinese/English text. Includes a table of contents sidebar, light/dark theme, raw view and PDF export.
