ReleaseNotes: |-
  拾光 v0.1.9 更新说明
  1. 独立小程序机制 & Windows 桌面快捷启动
  - 完全独立的小程序窗口：任意内置功能或拾光自研/组合插件（ui.applets）都可以独立弹窗运行，不占用主窗口/设置页标签栏，支持同时打开多个不同工具或同一工具多开。
  - 一键创建桌面快捷方式（含专属图标）：自动生成 256/64/48/32 四尺寸 .ico 图标并写入带 --open 启动参数的桌面 .lnk，拾光运行中毫秒级直达、冷启动自动拉起目标窗口。
  - AI 原生小程序能力：新增 applet_list、applet_open、applet_shortcut 工具，并升级 plugin-authoring Skill——对话里可以直接让拾光开发独立小程序并（确认后）创建桌面快捷方式。
  2. 服务器管理独立化 & XFTP 风格双栏 SFTP
  - 独立「服务器管理」小程序：从主窗口标签栏拆出，界面全面重构——左侧分组导航、最近操作（按操作时间倒序前 10 台）、自定义 标签（#tag） 与标签搜索、卡片/列表视图切换、一键复制 SSH 命令。
  - 命令终端与文件管理拆为 2 个独立窗口：SSH 终端回归纯净全宽命令行与 AI 运维模式，顶部按钮一键拉起配对文件管理窗口。
  - XFTP 风格左右双栏文件管理（SFTP）：左侧本机 Windows 盘符与快捷目录 + 中间拖拽分割与双向传输快捷按钮 + 右侧远程服务器目录/权限/文本预览 + 底部实时传输队列，支持多选及整个文件夹递归上传/下载。
  3. DeepSeek 能力与体验增强
  - 支持聊天语音输入（ASR）、回复语音播报（TTS）、长回复续写、云端文档解析，以及本地网页搜索/抓取失败时的 DeepSeek 联网兜底。
  - 新增 scripts/publish-draft.ps1 规范化本地构建上传流程（自动转 ASCII 文件名，避免 GitHub 丢弃中文文件名）。

  请在下方下载 Windows 安装包 ShiGuang_0.1.9_x64-setup.exe，已有版本也可在设置中检查更新。
