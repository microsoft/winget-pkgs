ShortDescription: 轻量、快捷的本地图片浏览与管理工具，无广告、不联网、照片数据不出你的电脑
Description: 尽览（LightSee）是一款轻量、快捷的本地 Windows 图片浏览与管理工具，左侧文件夹、右侧缩略图墙、双击看大图，几万张图的大文件夹也不卡。支持缩放、平移、旋转、全屏、幻灯片与 GIF 逐帧；整理方面有星级/色标/标签、智能相册、本地人脸聚类、批量重命名、格式转换、图片压缩；查找方面有图片内文字搜索（OCR）、重复照片查重、按主色调筛选，还能把带定位的照片放上地图。v2.0.0 新增查看器「适合宽度」一键适配宽屏、底部胶片缩略条开关、EXIF 元数据面板与细节放大镜独立开关。纯绿色软件：无广告、不联网、不登录、无后台进程，浏览、整理、OCR、人脸识别全部在本机完成。
