Description: 尽览（LightSee）是一款 Windows 本地图片浏览与管理工具：左侧文件夹树、右侧缩略图墙、双击进入查看器。支持星级评级/色标/标签与智能相册、本地人脸聚类（按人物整理照片）、照片地图（卫星图上查看带定位照片）、智能查找（图片内文字 OCR 搜索、重复照片查找、按主色调筛选）、批量重命名/格式转换/隐私信息剥除/修改尺寸等批处理。完全离线使用，无广告、不需要登录，绿色便携。
