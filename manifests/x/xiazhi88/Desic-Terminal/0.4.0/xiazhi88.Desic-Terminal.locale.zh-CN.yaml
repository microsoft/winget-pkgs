ReleaseNotes: |-
  Desic Terminal v0.4.0
  本版的主角是 AI 自动化里的交易员 Profile（Beta）：代码先算好一页简报，AI 按你自己的交易手册做判断；每次判断都会留下决策日志，由代码事后结算，你可以纠正它，并据此修改手册。同时补上了对所有 AI Profile 生效的硬风控，另有语音伙伴、账户绩效工作台与交易复盘、AI 研究改版。
  交易员 Profile（Beta）
  - Beta 提示：交易员模式仍在完善，行为和数据后续可能调整。建议先用模拟盘或小金额试用。
  - 新建 Profile 时在「经典 AI」和「交易员」两张卡片里选，类型创建后不能改。经典 AI Profile 的提示词、技能和工具定义都没有变。
  - 代码先算简报，AI 只做判断：每轮运行前，代码为最多 3 个关注品种整理一页简报：多周期结构、波动与行情阶段、盘口、资金费率与持仓量、账户与风险预算、本 Profile 的近期记录等。缺失的数据写成「不可用」，不会写成 0。各项数据并行获取，总时限 8 秒，慢的数据源不会拖住整轮运行。简报还会标出每个持仓和挂单属于本 Profile、其他 Profile、AI 研究还是手动下单。
  - 交易手册库：可以维护多本手册，内容包括各形态的入场、止损、目标与失效条件，以及方向纪律、不做清单和持仓管理。手册可以从内置模板新建或复制，不用的可以归档，也能导出 / 导入为文件。每个交易员 Profile 选一本，多个 Profile 可以共用一本。每次保存都会生成新版次，可以逐行对比，也能恢复到旧版次。
  - 实盘 / 观察中：新建、AI 起草和导入的形态都先处于「观察中」。AI 会评估这些形态并记下入场、止损和目标，由代码按后续行情做影子结算，但不会用它们开仓。只有你手动切到「实盘」（需要再确认一次）之后才会下单。
  - AI 起草形态：用大白话描述一个形态，AI 帮你起草规则。草稿不会编造你没给的数字，会列出需要你确认的地方，你审阅后才会保存。
  - 临时指令：可以按 Profile 和品种设置，最长 30 天。「暂停开新仓 / 只做多 / 只做空」由代码强制执行；「备注」只作为参考写进每轮简报。设置强制指令时，范围内还没执行的 AI 开仓机会会作废；会被拦住的 AI 入场挂单也会列出来，默认勾选撤单。
  - 决策日志、影子结算与成绩单：每轮交易员运行都要留下决策日志，包括形态、方向、动作、入场 / 止损 / 目标、目标先于止损到达的概率、有效期和理由。代码用后续 1 分钟 K 线结算每条决策，AI 没执行的候选也算在内（规则从严，结果按扣除估算手续费后的 R 计算）；已执行的按真实平仓结果计算。同一个计划在结算期内被重复记录时，不会重复结算。成绩单按手册、形态、日线阶段和方向分组，给出样本数、胜率、收缩后平均 R、信心校准等。样本够多且表现明显为负的分组会提示「建议暂停」，暂不暂停由你手动决定。
  - 纠正与手册建议：你可以给任一条决策标上问题类型（方向错误、位置不好、阶段判断错误、止损或目标不合适、该做没做等），再写一句说明，之后的简报会带上近期的纠正。同一形态 30 天内攒够 3 条纠正，就会生成一条手册修改建议：AI 起草修改，你对比修改前后再决定采不采用。采用后会生成新版次，随时可以恢复。
  - 开仓限价单自动过期：交易员的开仓限价单到了 AI 设定的有效期（没设时默认挂出后 24 小时）仍完全没成交，代码会按正常撤单流程撤掉并通知你；Profile 停用或自动化关闭后也照样执行。这条规则只管交易员 Profile 的开仓限价单，经典 AI Profile、AI 研究、保护单和手动订单都不受影响。停用一个还有入场挂单的交易员 Profile 时，会问你要不要一起撤单。
  - Profile 编辑器改版：改成五个分页的窗口（基础、资金与风险、交易方式 / 分析方式、计划与复盘、高级）。百分比用滑块调，点刻度可以一键选中；杠杆和持仓数有快选按钮；所有数值也都能直接输入。「资金与风险」页会把风控参数换算成当前账户的具体金额和张数，开不了最小仓位时会写明原因。
  AI 自动化硬风控（对所有 AI Profile 生效）
  - 以下限制由代码执行，不依赖模型：单笔风险（默认权益的 1%，止损亏损含手续费）、最低净盈亏比（默认 1.2）、每日已实现亏损上限（默认 3%，触发后当天不再开新仓）、每个 Profile 的持仓 / 在途入场数上限（默认 2）、市价入场相对决策价的最大偏离（默认 30 bps）。
  - 单笔风险和每日亏损上限最高可设到权益的 100%，具体额度由你决定。
  - AI 开仓必须同时带止损和止盈。提交前会再读一次最新价，如果价格已越过止损、偏离超限，或当天已触发亏损上限，这笔入场会被拒绝。平仓、撤单和改单不受这些规则限制，手动下单和策略 Profile 也不受影响。
  - 唤醒条件：从界面保存的唤醒条件现在也能唤醒 Profile；AI 用嵌套格式写入的唤醒条件也能正确识别。
  其它新功能
  - 语音伙伴（可选）：按住快捷键（默认 `）或按住像素小机器人说话，可以切换工作区、品种和周期，增删内置指标，开关订单流，每一步都能撤销。其它问题会交给专门的「语音指挥」AI 会话，简短作答。语音不会下单、改单或撤单，也不会动账户、Profile 和策略。本机流式识别的模型按需下载，音频不会离开本机（本机识别只支持 macOS 和 Windows x64）；也可以改用 AI 模型接口或自定义地址来识别。
  - 数据页：「账户绩效」改成联动工作台。按订单来源、品种或日历筛选，或者在收益曲线上拖选一段时间，数字、曲线和交易列表都会一起重算。新增「交易复盘」：根据你的已平仓位给出按规则生成的发现（每条至少 5 个样本），还有星期 × 时段盈亏热力图、单笔 K 线回放，以及只存在本机的标签和笔记。
  - AI 研究改版：新增结论卡、会话分组与搜索、交易机会链接；没有返回结果的工具调用现在会被正确收尾。
  修复与优化
  - 盘口和逐笔成交只推送界面上正在显示的品种；盘口档位按数值排序。
  - 全新安装首次初始化数据库时，补上了市场雷达工作区的迁移。
  - 图表关闭后残留的重绘不再引发前端报错。
  - 高周期订单流的清算标注改为聚成簇并限制数量，图例收成一行。
  - 值守心电图抽屉里的运行摘要改用 Markdown 渲染。
  验证情况与已知残余风险
  - 已通过：
    - Rust：cargo test --lib（727 项：724 通过、3 项忽略）、cargo test -p desic-agent-automation（70 项）、cargo check --workspace；
    - 前端与校验：npm run build、test:release-version、test:i18n、test:risk-preview、test:trade-review、test:ai-policy（含经典模式工具定义快照比对，确认经典 AI Profile 拿到的工具定义没有变化）。
  - 未验证：本版安装包，以及从 v0.3.1 自动升级到本版，还没有在 macOS（Apple 芯片 / Intel）和 Windows 上逐一验证；本次发版检查不含界面冒烟测试。
  - 已知残余风险：
    - 交易员 Profile 处于 Beta 阶段，还没有在真实账户上长时间运行过，行为和数据后续可能调整。
    - 影子结算是按从严规则、用 1 分钟 K 线做的估算，不等于真实成交结果；样本少时，成绩单的参考意义有限。
  - 已知限制：macOS 版本仍为 ad-hoc 签名、未经 Apple 公证，首次打开时系统可能提示无法验证开发者。
