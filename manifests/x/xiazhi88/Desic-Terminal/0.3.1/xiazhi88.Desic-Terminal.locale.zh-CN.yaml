ReleaseNotes: |-
  Desic Terminal v0.3.1
  本版是一个修复版本，解决 Windows 上主进程 CPU 长期占用 60%~97% 的问题。
  修复：高 CPU 占用（任务管理器里 Desic Terminal 长期 60%~97%）
  - 现象：主进程持续吃满约 14 个核（整机 60%~97%），机器发烫、其它程序变卡。
  - 根因：图表高周期 K 线（5 分钟及以上）的本地聚合查询写法有缺陷。它用两次自连接取「每根 K 线的开盘价与收盘价」，SQLite 的查询计划不会把时间条件用在这两次连接上，于是退化成「每个时间桶都扫一遍该交易对的全部历史」。实测同一台机器：600 行内存数据跑 3 秒都出不来，真实数据库 150 小时窗口跑 300 秒仍无返回。
  - 为什么一直在烧：前端每次刷新图表或切换周期都会触发这个查询；调用方 10 秒超时后放弃，但后台线程无法取消、继续把查询跑下去，每个这样的线程持续占用约 0.3~0.45 个核，每分钟新增一个，越积越多。
  - 修复：改用单遍窗口函数聚合，一次扫描完成。同样的查询从「跑不完」降到 19~36 毫秒；同一状态下主进程占用从 60%~97% 降到 0.15%。
  - 顺带修好：高周期图表的数据加载此前每次都会超时失败（实测完成率 0/7），现在 14/14 全部正常返回，5 分钟及以上周期可以正常显示。
  - 该修复对所有平台生效；上述 CPU 现象在 Windows 上报告并复现。
  顺带优化
  - 行情 WebSocket 热路径原本对同一条报文完整解析 5 遍，并逐笔深拷贝成交数据；现合并为单次解析。这条路径实测只占进程 CPU 的 0.1%~10%，属清理性优化，不是本次 CPU 问题的原因。
  官网与文档
  - 官网迁到 desicterminal.com；README 首屏换成演示 GIF，并新增常见问题。
  - 开发规范新增两条 K 线相关踩坑记录：聚合禁用 MIN/MAX 自连接；禁止依赖「超时放弃 + 后台线程继续跑」的读取模式。
  验证情况与已知残余风险
  - 已通过：cargo test --lib market_ws（19 项）、cargo check --lib；新聚合查询与独立参考实现逐行比对 30/30 一致（缺口数据、多交易对、未确认 K 线混杂、首尾不完整桶、120 个随机缺口 × 5m/15m/30m/60m/240m）。
  - 未完全验证：图表新数据只在 Windows 桌面端用真实行情观察过窗口加载与 CPU，尚未逐一核对每个周期的显示细节。
  - 已知残余风险：
    - 图表 K 线读取仍是「超时放弃 + 后台线程继续跑」的模式，若将来再出现慢查询仍会积压占核线程（已写入开发规范，待改）。
    - 存在一个偶发的启动卡死（停在启动页、界面不加载），规律尚未定位，与本版修复无关。
  - 已知限制：macOS 版本仍为 ad-hoc 签名、未经 Apple 公证，首次打开时系统可能提示无法验证开发者。
