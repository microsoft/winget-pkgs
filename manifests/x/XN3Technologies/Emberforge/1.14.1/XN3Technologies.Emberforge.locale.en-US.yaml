ReleaseNotes: |-
  Lifetime licenses, and more for pictures in print.
  - PDF settings, Pictures: the book's pictures show in every mode, with a red border around those that print below 300 ppi.
  - Optional scaling of pictures below 300 ppi up to 300 ppi, so print services' automatic resolution checks accept them.
  - An optional border around each picture in the PDF.
  - The full version can now be bought for life; the annual license is still there and never renews by itself.
