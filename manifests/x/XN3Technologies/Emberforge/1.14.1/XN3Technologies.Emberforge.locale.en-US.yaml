ShortDescription: Free book writing and formatting software. Print-ready PDF books free in Basic mode; every feature, including EPUB e-books, free for 15 days.
Description: |-
  Emberforge takes a book from manuscript to finished files on your own computer. Write and revise in a calm, book-like editor, then export a print-ready PDF interior for print-on-demand services and printers, and an EPUB e-book for Kindle, Apple Books, Kobo and Google Play.
  Import from Word, OpenDocument, EPUB, PDF, Markdown or text. Pictures with captions, footnotes and citations, comments, a character manager for series, and a copyright page with ISBNs. Optional encrypted sync through your own Google Drive, and optional AI tools with your own API key.
  Free to use: Basic mode has no time limit and makes print-ready PDF interiors in 5 x 8, 5.5 x 8.5 and 6 x 9 in. Every feature, including EPUB, is free for 15 days; the full version is a lifetime or annual license. No account, no tracking, works offline.
