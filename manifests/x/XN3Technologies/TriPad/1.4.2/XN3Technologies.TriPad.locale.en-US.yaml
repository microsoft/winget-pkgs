ShortDescription: Free, fast text and code editor for Windows, with Simple, Advanced and Expert modes.
Description: |-
  Free text and code editor for Windows 10 and 11. TriPad brings together the strengths of Notepad2, Notepad++,
  Programmers Notepad and TED Notepad and organises them into three modes, so a quick note never feels like an
  IDE and a big project never feels like Notepad. Markdown preview as you type, files of any size, logs coloured
  by level, CSV columns aligned and sorted, Filter Lines, Git in the margin, language servers, a terminal panel,
  SFTP, a hex editor, file compare, Lua scripting and reviewed plugins. A native program of about 8 MB with no
  runtime to install. No ads, no account, no tracking.
