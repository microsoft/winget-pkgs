PackageIdentifier: XiaoLan.CodexAccountSwitch
PackageVersion: 1.3.23
PackageLocale: zh-CN
ShortDescription: 无需重启开发工具，即可在本地管理并切换多个 AI 编程账号。
Description: |-
  面向 Codex 账户的本地优先、多账户可视化管理器
  基于 C++ / Win32 / WebView2 开发，兼具稳定性与运行速度。

  核心功能
  - 账户备份、切换、删除、重命名统一工作流
  - 批量操作（批量刷新、批量删除）
  - 备份包（ZIP 格式）导入/导出
  - 支持导入当前登录账户、手动粘贴 Token、OAuth 文件快速导入
  - 内置 OAuth 登录流程（回调监听器+手动提交回调 URL）
  - 额度看板，支持自动刷新（5 小时/7 天）、低额度告警及切换提示
  - API 代理服务（端口、超时时间、局域网访问、API 密钥、调度策略）
  - 流量日志与 Token 统计页面
  - 多语言界面与主题（自动/浅色/深色）

  Codex 客户端本地 API 代理，实现无缝换号
  - API 反向代理 - 启动服务
  - API 反向代理 - Codex 客户端使用本地反向代理模式
  - 无需重启即可完成账户无缝切换
  - 设置-账户-额度不足自动切换账户提示：启用该功能后，当额度不足时可自动换号，保障开发工作正常推进。
ReleaseNotes: |-
  - 新增第三方 API 账号管理，与官方账号统一展示，支持搜索、筛选、批量操作及导入当前 Codex 配置或 CC Switch 账号。
  - 新增供应商预设选择、API 配置编辑、模型列表获取与 HTTP Ping 检测，支持编辑 auth.json 和 config.toml。
  - 新增 API 余额查询与自定义用量脚本，支持脚本预览及随账号额度统一刷新。
  - 官方账号和第三方 API 账号支持手动加入代理池，请求失败且尚未输出响应时可尝试切换其他池成员。
  - 关于页面新增 Codex CLI 版本检测与一键安装入口。
  优化
  - 调整配置写入方式，仅更新相关连接字段，保留其他本地设置；移除退出时的旧配置恢复，避免覆盖已保存的连接信息。
  - 优化高 DPI 与跨显示器缩放适配，调整窗口尺寸及关于页面布局。
  修复
  - 修复 ChatGPT 客户端选择保存后可能被重置、影响账号切换后重启的问题。
  - 修复部分官方账号额度窗口识别不准确的问题，按实际窗口时长展示额度。
