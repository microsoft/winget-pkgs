ReleaseNotes: |-
  New features
  - Tokeny 1.8.0 improves session management, long-conversation stability and the Windows upgrade experience, and reduces unnecessary background token usage.
  Improvements
  - Batch session management: multi-select, select by group and bulk delete sessions; workspace management gains select-all.
  - Lower background usage: automatic summarisation of old sessions was removed; existing long-term memory, raw sessions and usage records are kept.
  - Network recovery: after temporary disconnects, DNS errors or connection resets, tasks retry and resume automatically while keeping completed tool steps; you can stop at any time.
  - Long conversations and model compatibility: fixed budget allocation for summary input, thinking and output; stale compaction results no longer overwrite edited sessions; improved Claude thinking parameters and historical thinking blocks.
  - Accurate results: failed tool calls are no longer shown as successful; error messages distinguish exhausted quota from insufficient balance.
  - Windows startup and upgrade: fixed upgrades still opening the old program and leftover old auto-start entries; the installer re-checks the latest version; fewer database checks at normal startup.
  - Bot and diagnostics reliability: fixed delivery after referenced material changes; improved first telemetry initialisation, resending of unconfirmed events and download de-duplication.
  Fixes
  - Chinese input: confirming an IME candidate no longer sends the message, drafts are no longer lost, completion no longer interferes; long skill commands display better.
