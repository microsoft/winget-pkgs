ShortDescription: Color-code the sidebar of the Claude desktop app. An unofficial community project.
Description: |-
  Adds highlight and name colors to the group headings in the Claude desktop app's sidebar.
  It runs as a tray program and never changes the app's files. It makes no network connections.
  It uses Windows UI Automation to find the headings, a system-wide mouse hook to notice clicks and scrolling, and short-lived screen capture of the sidebar to keep colors on their rows. Nothing it reads is recorded, apart from your group names and chosen colors, which it saves in two text files on your PC.
  Not made by or affiliated with Anthropic.
