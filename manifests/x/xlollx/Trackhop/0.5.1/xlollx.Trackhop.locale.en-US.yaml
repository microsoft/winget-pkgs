ShortDescription: Keeps playlists in sync between music services (beta)
Description: |-
  Trackhop Desktop is the sync engine of the Trackhop Android app as a program for your computer, with its own Java runtime: nothing else to install.
  It keeps playlists in sync between Spotify, YouTube, TIDAL, Navidrome and other Subsonic servers, Jellyfin, Plex, Last.fm, ListenBrainz, SoundCloud links and CSV files, on a schedule, with an icon next to the clock.
  Its pages open in its own window and at http://127.0.0.1:8642, reachable only from this computer. Beta: pages and settings can still change between releases.
