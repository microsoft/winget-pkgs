  - 搜索链路打点与两大热点优化，提升输入丝滑度 (e8ae10d)
  🎨 界面改进
  - 搜索状态下沉到底栏、Everything 进度改顶部细条，消除列表跳动 (001169f)
  🔧 内部改进
  - 移除未使用代码清理 Rust 编译警告 (b03d551)
  - 记录搜索链路性能定位过程与守则（SEARCH_PERFORMANCE.md） (6850153)
