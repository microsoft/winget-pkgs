ReleaseNotes: |-
  完整变更：https://github.com/Xieweikang123/ReFast/compare/1.0.81...1.0.82
  ✨ 新功能
  - 支持裸域名网址识别并按规则路由浏览器 (8e6a609)
  - 使用过的结果始终排在 Everything 结果之上 (75d1359)
  🐛 修复
  - 发版幂等检查步骤显式 exit 0，修复 pwsh 包装器误判失败 (cc4a9dd)
  - contains_chinese 改为 pub(crate)，修复 cargo check --tests 编译失败 (687e5c9)
  - 打开网址后延迟隐藏窗口，确保浏览器置前 (0b7dd70)
  - 同名应用去重时保留已打开的项目文件夹 (0151e0d)
  ⚡ 性能优化
  - 搜索结果粘性交互——本查询已结算后不再二次锁定 (6f7ec15)
  - 避免单字符搜索合并阻塞输入 (996e0ff)
  🎨 界面改进
  - 文件历史面板重构为 Material 风格并增强列表交互 (c203bd3)
  🔧 内部改进
  - 新增 master 自动发版流水线（幂等+自动更新日志） (2d0cbb2)
  - 更新 AGENTS.md 测试状态描述 (067cd4e)
  - 新增 GitHub Actions（tsc+vitest+cargo check） (a0af4fa)
