ReleaseNotes: |-
  1.0.79 更新：
  - 新增选中锁定：结果刷新时保持手动选中的行，非交互期也可直接启动
  - 修复：锁定项从结果消失后 Enter/点击被静默拦截
  - 修复：输入框光标不在开头时按左键被劫持为横向导航
  - 修复：增量加载时选中索引抖动，移除失效的扁平导航死代码
