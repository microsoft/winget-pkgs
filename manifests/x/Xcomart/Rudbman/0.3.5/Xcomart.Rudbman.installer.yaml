# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Xcomart.Rudbman
PackageVersion: 0.3.5
MinimumOSVersion: 10.0.0.0
InstallerType: inno
# packaging/windows/rudbman.iss sets PrivilegesRequired=lowest, so the installer never
# elevates and {autopf} resolves per-user: it lands in %LOCALAPPDATA%\Programs\rudbman.
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
# rudbman.exe links the MSVC runtime dynamically (VCRUNTIME140.dll and the
# api-ms-win-crt-* forwarders). The bundled Java runtime carries its own copy
# under runtime\bin, but that directory is not on the exe's DLL search path,
# so a machine without the VC redistributable fails at load with
# STATUS_DLL_NOT_FOUND (0xC0000135) — which is what the winget-pkgs validation
# VM reported. Declaring the dependency makes winget install the runtime first.
# Kept even after the release build went crt-static (see release.yml): harmless
# when the runtime is already there, and a safety net if a build ever drops the flag.
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Microsoft.VCRedist.2015+.x64
ReleaseDate: 2026-11-01
Installers:
# The x64 build also runs under emulation on ARM64 Windows, but there is no native
# arm64 artifact to declare here yet.
- Architecture: x64
  InstallerUrl: https://github.com/xcomart/rudbman/releases/download/v0.3.5/rudbman-v0.3.5-x86_64-pc-windows-msvc-setup.exe
  InstallerSha256: 009BCE889BD7EA8AE3E74B18D20D13A6B8831B5F57FBFED5775239C1D923F192
  # Inno Setup appends "_is1" to the AppId when it writes its Uninstall registry key,
  # so this is packaging/windows/rudbman.iss's AppId plus that suffix. It is how winget
  # recognises an already-installed copy; see packaging/winget/README.md.
  ProductCode: '{E09022E1-1203-4A82-A00E-6385C2594DEF}_is1'
ManifestType: installer
ManifestVersion: 1.12.0
