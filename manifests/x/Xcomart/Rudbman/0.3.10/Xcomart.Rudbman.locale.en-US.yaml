ReleaseNotes: |-
  rudbman 0.3.10 — drop and truncate from the explorer behind a typed confirmation, and statement bodies kept whole on more products: T-SQL, MariaDB, Db2, Firebird, Informix and Snowflake.
  - Drop and truncate from the explorer. The explorer menu offers Drop for tables, views, sequences, schemas and databases, and Truncate for tables. Each opens a question that shows the exact statements and stays disabled until the object's name, or the verb over a selection, is typed back. The statements follow each product's own spelling, run with autocommit like the structure pane's apply, and are refused on read-only profiles and over another tab's open transaction.
  - A T-SQL IF stays whole through the semicolon before its ELSE. IF @a = 1 SELECT 1; ELSE SELECT 2; was cut at the first ;, so the editor shaded the branches apart, Run statement sent half of it and Run all ran ELSE SELECT 2 as a statement of its own.
  - PL/SQL routines on MariaDB and Db2 stay whole. A routine header ending in IS or AS with declarations before its BEGIN, as MariaDB's sql_mode=ORACLE and Db2's PL/SQL write it, was cut at its first semicolon. An ALTER that names a routine is now read as a CREATE is, which keeps Db2's ALTER MODULE … ADD PROCEDURE and MySQL's ALTER EVENT … DO BEGIN whole.
  - Blocks, packages and routines without a header stay whole. MariaDB and Db2 blocks opened by DECLARE, MariaDB's BEGIN blocks, MariaDB 11.4 packages written in SQL/PSM, Firebird DECLARE sections, sub-routines and EXECUTE BLOCK, Informix routines that run to END PROCEDURE or END FUNCTION, and Snowflake blocks whose first declaration is a cursor. Db2's DECLARE GLOBAL TEMPORARY TABLE, and a DECLARE c CURSOR followed by a statement, stay statements of their own. Script restores still stream line by line.
  - The about dialog opens the project page at https://xcomart.github.io/rudbman/ instead of the repository.
  - async-executor and crypto-bigint move past their yanked releases, to 1.14.1 and 0.7.9.

  Requirements
  - Linux: glibc 2.35 or newer: Ubuntu 22.04, Debian 12 and later, or a distribution built on them, MX Linux 23 among them.

