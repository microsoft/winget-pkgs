ShortDescription: A desktop source-code generator that reads any JDBC database's metadata and renders it through templates.
Description: |-
  rudbgen is a desktop code generator written in Rust and drawn with gpui, the
  GPU-accelerated UI framework behind the Zed editor. It reads a database through that
  database's own JDBC driver over an embedded JVM bridge, so any product with a JDBC
  driver is a supported product: drivers come from Maven Central by coordinate or from
  disk, the driver class is detected from the JAR, and every connection gets an isolated
  class loader.

  Tick tables in the schema explorer, tick templates in the Generate tab, and rudbgen
  renders one file per table per template. The template language is jdbgen's, engine and
  all — the same placeholders, conditions, loops and decorators — so templates written
  for jdbgen render unchanged. What is new is everything around them: a single window
  instead of a stack of modal dialogs, no master password, an in-app template editor
  with syntax highlighting and a live preview of the file a real table would produce,
  a cancellable generation run with a per-file result summary, and foreign keys and
  indexes in the model the templates see.

  Connections can run through an SSH tunnel, and passwords live in the Windows
  credential store rather than on disk. No JDK is required — the installer carries a
  Java runtime built with jlink and rudbgen uses the one next to its executable. The
  interface is available in English, Korean, Japanese, Simplified Chinese, German,
  Spanish, French and Russian.
