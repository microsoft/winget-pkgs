# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Xcomart.Rulogman
PackageVersion: 0.6.4
MinimumOSVersion: 10.0.0.0
InstallerType: inno
# packaging/windows/rulogman.iss sets PrivilegesRequired=lowest, so the installer never
# elevates and {autopf} resolves per-user: it lands in %LOCALAPPDATA%\Programs\rulogman.
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
# rulogman.exe links the MSVC runtime dynamically (VCRUNTIME140.dll and the
# api-ms-win-crt-* forwarders), and Inno Setup ships nothing but the exe, so a
# machine without the VC redistributable fails at load with STATUS_DLL_NOT_FOUND
# (0xC0000135) — which is exactly what the winget-pkgs validation VM did.
# Declaring the dependency makes winget install the runtime first. Kept even
# after the release build went crt-static (see release.yml): harmless when the
# runtime is already there, and a safety net if a build ever drops the flag.
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Microsoft.VCRedist.2015+.x64
ReleaseDate: 2026-11-01
Installers:
# The x64 build also runs under emulation on ARM64 Windows, but there is no native
# arm64 artifact to declare here yet.
- Architecture: x64
  InstallerUrl: https://github.com/xcomart/rulogman/releases/download/v0.6.4/rulogman-v0.6.4-x86_64-pc-windows-msvc-setup.exe
  # SHA256 of the published asset, computed from the download itself:
  #
  #   Invoke-WebRequest -Uri <InstallerUrl> -OutFile setup.exe
  #   (Get-FileHash -Algorithm SHA256 .\setup.exe).Hash
  #
  InstallerSha256: 37E32A7FFF20592230F8DDAD9B6CFA38674B47E9A07A17C8B85190AA143A662D
  # Inno Setup appends "_is1" to the AppId when it writes its Uninstall registry key,
  # so this is packaging/windows/rulogman.iss's AppId plus that suffix. It is how winget
  # recognizes an already-installed copy; see packaging/winget/README.md.
  ProductCode: '{D6066CD8-5F5D-4B13-AB5B-DAD7965FF725}_is1'
ManifestType: installer
ManifestVersion: 1.12.0
