ShortDescription: A floating acrylic-glass pomodoro timer for Windows, built with Flet.
Description: |-
  A always-on-top pomodoro timer with acrylic glass, frameless window and edge-snap animation.
  Idles for 5 seconds and slides to the nearest screen edge, leaving a thin rounded strip.
  Supports click-through mode (mouse passes through the window) with a 3px drag band on top.
  Runs fully offline: no network requests, no telemetry, no registry writes.
