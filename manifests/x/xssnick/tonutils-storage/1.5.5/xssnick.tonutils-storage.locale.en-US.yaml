ReleaseNotes: |-
  • Improved DHT scalability with adaptive seed refresh workers, shared peer address lookups, and faster announcements for newly created bags
  • Added global and per-peer upload memory budgets with safer RLDP cleanup on timeouts and disconnects
  • Fixed upload statistics accounting and persistence under concurrent transfers
  • Fixed speed limits for oversized pieces and concurrent transfers
  • Fixed partial download seeding and file selection expansion using cached boundary pieces
  • Fixed empty file restoration and oversized files when resuming downloads
  • Fixed races between verification and downloads, session reinitialization, and piece availability updates
  • Fixed peer connection cancellation and restart cleanup to preserve healthy peers and newer sessions
  • Fixed file selection changes for locally created bags to preserve source files
  • Fixed ordered downloads of valid filenames containing `..`
  • Optimized unordered download scheduling, file descriptor cache eviction, and batched piece metadata writes
  • Safer bag creation and piece validation, including source size changes, short reads, conflicting file paths, and requests before metadata is loaded
  • Fixed bag creation from hidden directories and exclusion of nested system files
  • Improved bag removal to clean up metadata, generated caches, and empty directories while preserving unrelated content
  • Fixed storage provider proof validation for partial last pieces and CLI crashes when providers are unavailable or lack space
  • Added peer categories (`seed`, `leech`, `unknown`) to CLI and HTTP API
  • Added optional `limit`/`offset` pagination to the bag list API, preserving full-list responses compatibility
  • Optimized CLI/API list statistics
  • Updated tonutils-go to v1.19.1, storage-provider to v0.4.4, and other dependencies
