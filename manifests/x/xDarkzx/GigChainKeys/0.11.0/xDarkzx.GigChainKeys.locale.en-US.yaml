ShortDescription: Free live rig for keyboard players, a MainStage alternative for Windows.
Description: |-
  GigChain Keys is a free, open-source live performance host for keyboard players, in the spirit of MainStage and Gig Performer.
  It plays your VST3 and VST2 instruments and effects, keeps every song of the night in a setlist with its own sounds, layers and splits,
  shows each song's chords and lyrics big enough to read from the keys, and comes with its own pianos, synths and pads.
