ReleaseNotes: |-
  简介
  Skill 现已支持动态发现：新增或修改 skill 后无需重启，新旧会话都会自动感知变化，/ 命令列表也不再等待 MCP 启动。媒体读取从通用 read 拆分为独立的 read_image、read_audio、read_video 工具，TUI 中按媒体类型显示。
  此外，修复了重复传入 --model 报错、代理或软链接缓存下插件安装失败、auth.json 含非字符串元数据时凭据丢失，以及 OpenAI Responses 无状态请求中推理块被拆分等问题。
  Highlights
  Skills are now discovered dynamically without restarting — additions and edits are picked up automatically by both new and ongoing sessions, and / commands no longer wait for MCP servers to connect. Media reading is split out of read into dedicated read_image, read_audio, and read_video tools, labeled by media type in the TUI.
  Also fixed: crashes on repeated --model flags, plugin installation behind proxies or symlinked caches, dropped credentials when auth.json contains non-string metadata, and split reasoning blocks on stateless OpenAI Responses requests.
