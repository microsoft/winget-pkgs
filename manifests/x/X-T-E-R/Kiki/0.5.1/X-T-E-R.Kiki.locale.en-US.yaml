ShortDescription: Multi-model AI agent workbench that runs a lead session with subagents across desktop, terminal and browser.
Description: |-
  Kiki is an open-source multi-model AI agent workbench. Hand it a folder and a task: it reads what is there, plans, and works in place. When a job divides, it hands parts to subagents that can be bound to different models, while goals, a message queue, and memory keep the work moving across turns.
  Work files stay in the folder you choose, sessions, history, and configuration stay in your local Kiki home, and model requests go only to the providers or local servers you connect. The desktop app, the terminal UI, and the browser UI all connect to one local daemon, so a session started in one is the same session opened in another.
  Permission levels decide how much Kiki may do on its own, from asking every time to full access, and sensitive files or dangerous commands still prompt. Sessions can be resumed, goals keep running across turns, and a plugin catalog adds capabilities such as local PDF, Office, and HTML extraction.
