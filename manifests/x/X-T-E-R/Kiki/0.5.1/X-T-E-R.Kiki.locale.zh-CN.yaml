PackageVersion: 0.5.1
PackageLocale: zh-CN
ShortDescription: 多模型 AI 智能体工作台，在一个本地守护进程上同时提供桌面、终端和浏览器界面，并可派生绑定不同模型的子智能体。
Description: |-
  Kiki 是一款开源的多模型 AI 智能体工作台。把一个文件夹和一件事交给它：它会先读里面有什么、做计划，就在原地动手。活能拆开时，它会把子任务分给可绑定不同模型的子智能体，再用目标、消息队列和记忆让工作跨轮次持续推进。
  工作文件留在你选定的文件夹里，会话、历史和配置留在你本机的 Kiki home 下，模型请求只发往你自己连接的供应商或本地服务。桌面应用、终端界面和浏览器界面连的是同一个本地守护进程，在一个地方开的会话，换个界面打开还是它。
  授权等级决定 Kiki 能自主做多少，从每次询问到完全放开，敏感文件和危险命令仍会先确认。会话可以续接，目标能跨轮次继续推进，插件目录还提供 PDF、Office 与 HTML 的本地提取等能力。
