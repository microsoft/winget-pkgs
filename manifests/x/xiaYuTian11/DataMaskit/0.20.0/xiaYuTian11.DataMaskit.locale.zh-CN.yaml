ReleaseNotes: |-
  更新摘要 / Summary
  - 新增文件脱敏工作台：把 Word、PDF、图片或文本拖进来，先在本机找出敏感信息，逐项确认后下载打码副本。
  - 日志页现在把「脱敏成功」和「没发现敏感词」分开显示，不再满屏绿色「成功」分不清哪些请求真的被保护过。
  - 网页版 AI 里粘贴大段文本时，脱敏不会再提前放弃并把原文发出去，大段内容会等够处理时间。
  - New File Workbench: drop in Word, PDF, image, or text files, review what was found locally, then download a masked copy.
  - The logs page now tells "masked successfully" apart from "nothing to mask" instead of showing one green "success" for both.
  - Pasting long text into web AI no longer gives up early and sends the original through; large inputs now wait for processing to finish.
  新增
  - 新增「文件脱敏」页：支持 Word / PowerPoint / Excel、纯文本、PDF 与图片；扫描后命中项可逐项替换或保留，PDF/图片可在预览上画框、画笔遮盖，成品通过一次性链接下载。
  - Added a File Workbench page: supports Word, PowerPoint, Excel, plain text, PDF, and images; after scanning, each finding can be replaced or kept, PDF/image previews accept rectangle and brush redactions, and the result downloads through a one-time link.
  - 文件任务默认全程在本机处理，不向互联网发起请求；OCR 默认走本机或环回服务，只有显式开启远端 OCR 才会外发页图。历史只保留打码后的文件名与计数，不保存原文、命中清单或真实文件名。
  - File jobs stay on this machine by default with no internet requests; OCR uses a local or loopback service unless remote OCR is explicitly enabled. History keeps only masked file names and counters, never originals, hit lists, or real file names.
  修复
  - 文件脱敏页的「覆盖情况」和提示改成能读懂的文案，不再把引擎内部字段 JSON 直接糊在界面上。
  - The file workbench now phrases coverage and notes as readable sentences instead of dumping internal JSON field names.
  - Linux 下 systemctl list-units 输出里的 systemd 单元名（如带实例的 本地@实例.单元后缀）不再被当成邮箱脱敏，agent 能正常看出是哪个单元，从而继续做系统诊断。
  - systemd unit names in systemctl list-units output are no longer masked as email addresses, so agents can still tell which unit is which during system diagnosis.
  - 网页版 AI 的文本脱敏改为按内容长度分档设置等待时间，并保证页面等待长于本地处理，避免大段内容在页面先放弃后被原样发出。
  - Text masking in the web extension now scales its wait time with input size and always waits longer than local processing, so large inputs are no longer forwarded unmasked.
  - 代理启动失败时，故障快照现在会带上子进程的启动输出，并且一次失败只留一份快照。
  - Failed proxy startups now record the child process output in the crash snapshot, and each failure leaves a single snapshot instead of two.
  优化
  - 日志筛选下拉删除了与相邻入口筛选重复的一项。
  - Removed a duplicate entry from the log filter dropdown that overlapped the adjacent source filter.
  - 文件脱敏工作台的纯文本文件超过 128 MB 会在本机直接拒绝，大日志不会再把引擎内存吃满；上限可在配置文件里调整。
  - The file workbench rejects plain-text files above 128 MB locally so a huge log can no longer exhaust engine memory; the cap is configurable in config.json.

  扩展更新提示 / Extension update notice
  ⚠️ 本次发版扩展有改动：请在 chrome://extensions 重新加载扩展（若提示新增站点权限，点允许）。
  ⚠️ The browser extension changed in this release: reload it at chrome://extensions (allow the new site permission if prompted).
