ShortDescription: Paravirtualized drivers and guest agent for Windows guests running on the XCP-ng hypervisor.
Description: XCP-ng Windows Guest Tools provides the paravirtualized device drivers and guest agent for Windows guests running on the XCP-ng hypervisor. The installer includes the Xen bus, interface, network, storage, console, keyboard/mouse, HID, and standard VGA display drivers, along with driver installation support, the XenPlus guest agent, and the XenClean and XenBootFix maintenance utilities.
