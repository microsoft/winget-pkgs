ReleaseNotes: |-
  新特性
  - #7742: 支持 Clang reduced BMI 编译
  - #7791: 添加 xmake test --output-on-failure
  - #7854: 添加 Inno Setup 打包和 set_displayicon 支持
  - #7758: 支持自定义下载工具，改进 aria2 下载
  - #7792: 支持为 pkgconfig:: 包设置 configs.configdirs
  - #7799: 支持配置文件中的 VERSION_PRERELEASE 和语义版本 VERSION_BUILD
  - #7808: 支持 nvcc 的 C++23 标准配置
  - #7766: 添加 Linux 平台的 raddbg 支持
  - #7743: 通过 lib.lua.* 提供更多原生 Lua 函数
  - #7752: 支持纯 Lua JSON 解码器的 Unicode 转义
