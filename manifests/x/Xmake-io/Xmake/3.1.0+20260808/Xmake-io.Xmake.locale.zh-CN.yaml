  - #7583: 修复 cmake 包的全局 flags 拆分
  - #7599: 修复 OpenBSD 上的 gzip / tar 检测
  - #7600: 修复构建缓存 memcache 的启用
  - #7601: 修复 verilator 确保定义 TRACE
  - #7602: 修复包加载 memcache
  - #7603: 通过更新 tbox 修复 rmdir
  - #7604: 修复 elf 的 rpath 清理
  - #7608: 修复拼写错误并格式化命令菜单
