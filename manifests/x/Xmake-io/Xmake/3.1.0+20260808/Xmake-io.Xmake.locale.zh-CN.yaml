  - #7659: 修复 Windows 上 emcc 的 .exe / .bat 检测
  - #7661: 回退 clang 的静态 libc++ 链接
  - #7668: 修复向 cmake 传递路径
  - #7671: 修复 tbox 的一些 bug
  - #7674: 修复 macOS 上的 Mach host send-right 泄漏
  - #7676: 修复 masm 的 embed / edit 级别符号 flag
  - #7679: 修复 msvc 在 C 模式下的 set_pcheader
