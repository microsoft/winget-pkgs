ShortDescription: A cross-platform build utility based on Lua.
Description: |-
  xmake is a lightweight cross-platform build utility based on Lua.
  It uses xmake.lua to maintain project builds.
  Compared with makefile/CMakeLists.txt, the configuration syntax is more concise and intuitive.
  It is very friendly to novices and can quickly get started in a short time.
  Let users focus more on actual project development.
Moniker: xmake
Tags:
- cross-platform
- lua
- open-source
ReleaseNotes: |-
  New features
  - #7696: Add addons support, to extend xmake with plugins, rules, toolchains, templates, modules and includes files
  - #7702: Auto-install the addons declared by a project and lock them in xmake-addons.lock
  - #7714: Support add_addons(...) in xmake.lua
  - #7706: Add tests for addons
  - #7707: Add tests for the package definitions shipped by addons
  - #7717: Move the format / doxygen / macro plugins to addons
  - #7723: Add new cross-compilation architectures, e.g. SPARC64
  - #7721: Add the package.host.install_locally policy
  - #7699: Rework the templates directory and template distribution
  - Add the pkg package manager for BSD
  Changes
  - #7719: Propagate the vector extensions of a package to its consumers
  - #7713: Run hlsl2spv / glsl2spv before the C++ module scan
  - #7722: Improve the interpreter, project loading, search cache and semver
  - #7733: Check the name conflicts of the global modules of addons
  - #7726: Improve the mingw toolchain for clang and libc++
  Bugs fixed
  - #7737: Fix the duplicated packages of the nested builds when installing them locally
  - #7738: Fix the platform menu of the remote build, e.g. xmake f -p windows --wdk=xxx
  - #7710: Fix the link name of libraries ending with .lib
  - #7709: Fix the runtime flags of clang
  - #7703: Fix wix to recognize x86_64 when passing -arch
  - #7701: Fix the dependency check to detect appended nested values
  - #7698: Fix the semver version selection and build metadata sorting
  - Fix scheduler.co_resume to raise the errors of the resumed coroutine
ReleaseNotesUrl: https://github.com/xmake-io/xmake/releases/tag/v3.1.1
