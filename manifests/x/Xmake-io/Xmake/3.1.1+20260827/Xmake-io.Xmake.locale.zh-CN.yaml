- cross-platform
- lua
- open-source
ReleaseNotes: |-
  新特性
  - #7696: 添加 addons 支持，可以用插件、规则、工具链、模板、模块和 includes 文件扩展 xmake
  - #7702: 自动安装工程声明的 addon，并用 xmake-addons.lock 锁定版本
  - #7714: 支持在 xmake.lua 中使用 add_addons(...)
  - #7706: 添加 addon 测试
  - #7707: 添加 addon 分发 package 定义的测试
  - #7717: 将 format / doxygen / macro 插件迁移为 addon
  - #7723: 添加新的交叉编译架构，例如 SPARC64
  - #7721: 添加 package.host.install_locally 策略
  - #7699: 重构模板目录和模板分发
  - 添加 BSD 的 pkg 包管理器支持
  改进
  - #7719: 将包的向量扩展配置传递给使用它的目标
  - #7713: 让 hlsl2spv / glsl2spv 在 C++ 模块扫描之前执行
  - #7722: 改进 interpreter、工程加载、搜索缓存和 semver
  - #7733: 检查 addon 全局模块的命名冲突
  - #7726: 改进 mingw 工具链对 clang 和 libc++ 的支持
  Bug 修复
  - #7737: 修复本地安装包时，嵌套构建重复安装包的问题
  - #7738: 修复远程编译下的平台菜单，例如 xmake f -p windows --wdk=xxx
  - #7710: 修复 .lib 结尾的库名被错误裁剪的问题
  - #7709: 修复 clang 的 runtime flags 检测
  - #7703: 修复 wix 传递 -arch 时无法识别 x86_64 的问题
  - #7701: 修复依赖检测无法发现嵌套值追加的问题
  - #7698: 修复 semver 的版本选择和 build metadata 排序
  - 修复 scheduler.co_resume，让被恢复协程的错误能够正常抛出
