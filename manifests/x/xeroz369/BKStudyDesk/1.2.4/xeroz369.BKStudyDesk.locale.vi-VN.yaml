ShortDescription: App học tập không chính thức cho sinh viên HCMUT, gom BK-LMS và MyBK vào một cửa sổ.
Description: |-
  BK Study Desk là app không chính thức, chỉ đọc, cho sinh viên Trường Đại học Bách khoa TP.HCM (HCMUT).
  App hiện hạn nộp, thời khóa biểu, lịch thi, tài liệu môn học và điểm từ BK-LMS và MyBK trong một cửa sổ, nhắc hạn nộp,
  tải tài liệu về thư mục từng môn, và có phần Luyện tập cho quiz tự soạn và quiz LMS đã lưu.
  App không bao giờ nộp bài hay sửa dữ liệu trên hệ thống của trường.
