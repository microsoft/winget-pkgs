ShortDescription: Unofficial study app for HCMUT students that brings BK-LMS and MyBK into one window.
Description: |-
  BK Study Desk is an unofficial, read-only desktop app for students of Ho Chi Minh City University of Technology (HCMUT).
  It shows deadlines, timetable, exams, course files and grades from BK-LMS and MyBK in one window, reminds you of due dates,
  downloads course documents into subject folders, and has a Practice section for self-made quizzes and saved LMS quizzes.
  It never submits work or changes data on university systems.
