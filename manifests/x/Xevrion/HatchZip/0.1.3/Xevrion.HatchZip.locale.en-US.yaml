ShortDescription: Extract huge archives in place, without needing room for both the archive and its contents.
Description: |-
  HatchZip extracts an archive from the end and cuts each finished part off the archive file as it goes, so it needs free space only for the files inside, not for the files and the archive together.
  It checks that the extraction fits before changing anything, keeps a margin of free space the whole way through, and resumes where it stopped after a crash or Ctrl+C.
  It reads ZIP, 7z, tar, .tar.gz and split archives. The package installs the HatchZip desktop app with an "Extract here" entry in the right-click menu, and the hatchzip command, also available as hz.
