ShortDescription: Named tabs for your Claude Code, Codex and shell sessions, restored after every restart
Description: |-
  kennel keeps every coding agent you run in one window, as a sidebar of named tabs. Each tab
  runs the real claude, codex, your shell or another agent CLI, exactly as it ships. Quit,
  reboot or crash, and every tab comes back with its name and folder, resumed by its exact
  session id. kennel writes nothing to your Claude or Codex config, never reads login tokens,
  and opens no network connections of its own.
