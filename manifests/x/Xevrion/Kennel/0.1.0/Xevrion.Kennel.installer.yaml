# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: Xevrion.Kennel
PackageVersion: 0.1.0
# ConPTY, which every tab runs in, arrived in Windows 10 1809.
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: kennel-desktop.exe
  PortableCommandAlias: kennel-desktop
# kennel-desktop.exe loads the conpty.dll beside it and that starts
# x64\OpenConsole.exe, so the command runs from the folder the zip unpacked
# to, put on PATH, rather than through a link in another folder.
ArchiveBinariesDependOnPath: true
Commands:
- kennel-desktop
ReleaseDate: 2026-11-28
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/xevrion/kennel/releases/download/v0.1.0/kennel-0.1.0-windows-x86_64.zip
  InstallerSha256: 683F1EB1407A3659923EA9AF943F43E2B2ED2D377F3BF866BF7641DBFCB6BE63
ManifestType: installer
ManifestVersion: 1.10.0
