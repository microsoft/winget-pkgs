ReleaseNotes: "## 截屏\r\n\r\n当前 Linux 桌面正处于激烈变动下，屏幕数据获取、截屏等接口都会发生改变。由于这些变化，比如gnome的截屏会错位，在设置中启用`使用 XDG Desktop Portal`可以避免这一问题，但是可能导致在多屏分数缩放下模糊，这时上游协议的问题，我将持续跟进，希望未来得到解决。\r\n\r\n• 修复 部分系统下多屏识别错误\r\n\r\n## ai\r\n\r\n• 变化 受上游onnxruntime影响，win不支持cuda，现在是linux（cuda），win（directml），mac（coreml）\r\n• 新增 webgpu运行后端（可能有各种问题不支持，回到cpu后端就好，等待上游更新）\r\n\r\n## 屏幕翻译\r\n\r\n• 新增 设置背景和文字颜色\r\n\r\n## 离线OCR\r\n\r\n• 新增 设置全局检测文字模型位置\r\n• 更新 默认使用ppocr6 small模型，其他版本可以在设置下载\r\n\r\n## 其他\r\n\r\n• 新增 在设置中获取日志和错误，不用进行其他复杂操作\r\n• 新增 AGENTS.md 方便开发者和ai了解项目开发流程\r\n• 升级 electron fabricjs（如果截屏绘图有问题，请反馈）\r\n• 部分页面窗口有了圆角和窗口阴影\r\n• 新版本设置只在更新时写入设置文件，其他不写入按默认来，旧版是连同默认设置一起写入的\r\n\r\n---\r\n\r\n15.4.0和4.1因为编译问题不发布\r\n\r\n⚡镜像下载：\r\n | | Windows | macOS | Linux|\r\n| --- | --- | --- | --- |\r\n|x64| [exe](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-win32-x64.exe) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-win32-x64.zip)|[dmg](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-darwin-x64.dmg) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-darwin-x64.zip)|[AppImage](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-linux-x64.AppImage) [deb](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-linux-x64.deb) [rpm](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-linux-x64.rpm) [tar.gz](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-linux-x64.tar.gz)|\r\n|arm64| [exe](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-win32-arm64.exe) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.4.2/eSearch-15.4.2-win32