ReleaseNotes: "## 超级录屏\n\n让ai写了很多（基本上），我进行了基本测试，大家有遇到什么问题麻烦反馈\n\n现在标准录屏替换为超级录屏，操作类似，如摄像头录制、按键提示等仍然保留，编辑部分使用了超级录屏的交互方式，可以省去用ffmpeg命令，后者是很多bug的来源，省去后实际上调用的是chrome封装好的ffmpeg功能\n\n标准录屏改名为“录屏（旧）”，后续将移除，并不再附带重复的ffmpeg，空间占用将减少\n\n• 新增 录制声音\n• 优化 底部帧序列预览速度\n• 优化 播放器跳转后播放效果\n• 优化 即使在处理，也能播放和预览部分\n• 优化 编辑处理时可打断处理新的编辑\n\n## 截屏\n• 修复 命令行连拍时机不对 #509 #511 @Duffu12\n\n## 长截屏\n\n• 优化 防止拼图冲突 @Duffu12\n\n## 屏幕翻译\n\n• 修复 快速点击暂停继续会触发多次识屏 #507 @Duffu12\n\n## 其他\n• 修复 托盘\"浏览器打开\"勾选项不刷新 #512 @Duffu12\n• 修复 命令行隐式错误行为应该报错 @Duffu12\n• 修复 快捷键绑定失效回退 @Duffu12\n\n---\n\n⚡镜像下载：\n | | Windows | macOS | Linux|\n| --- | --- | --- | --- |\n|x64| [exe](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-win32-x64.exe) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-win32-x64.zip)|[dmg](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-darwin-x64.dmg) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-darwin-x64.zip)|[AppImage](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-linux-x64.AppImage) [deb](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-linux-x64.deb) [rpm](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-linux-x64.rpm) [tar.gz](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-linux-x64.tar.gz)|\n|arm64| [exe](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-win32-arm64.exe) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-win32-arm64.zip)|[dmg](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.6.0/eSearch-15.6.0-darwin-arm64.dmg) [zip](https://g