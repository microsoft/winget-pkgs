ReleaseNotes: "欢迎大家多多反馈，还有star🌟\n\n## 截屏\n\n新的属性面板，跟随元素方便控制，提供更多选项和属性调节\n\n副栏也展开了常用按钮，不用再一个个找，并能自定义哪些在一级哪些在二级\n\n线、折线、多边形、箭头不再按矩形外框触发点击，而是点到线上才算点击，同时可以调节它们端点，包括多边形端点\n\n聚光灯遮罩可以自己移动修改大小，支持边缘模糊羽化\n\n基本大部分矩形元素都支持圆角\n\n文本也能调字体、加粗等\n\n还会发现界面流畅了很多，因为修复了一个没有正常开启硬件加速的选项问题\n\n## 翻译\n\n添加火狐离线翻译，尽管质量不如llm，但是速度和离线还是很有吸引力的\n\n## 其他\n\n支持avif图片导出\n\n---\n\n⚡镜像下载：\n | | Windows | macOS | Linux|\n| --- | --- | --- | --- |\n|x64| [exe](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-win32-x64.exe) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-win32-x64.zip)|[dmg](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-darwin-x64.dmg) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-darwin-x64.zip)|[AppImage](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-linux-x64.AppImage) [deb](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-linux-x64.deb) [rpm](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-linux-x64.rpm) [tar.gz](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-linux-x64.tar.gz)|\n|arm64| [exe](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-win32-arm64.exe) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-win32-arm64.zip)|[dmg](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-darwin-arm64.dmg) [zip](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8.0/eSearch-15.8.0-darwin-arm64.zip)|[AppImage](https://gh-proxy.com/https://github.com/xushengfeng/eSearch/releases/download/15.8