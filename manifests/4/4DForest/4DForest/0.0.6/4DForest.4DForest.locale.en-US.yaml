ShortDescription: A file manager with an instant index of the whole disk, the disk drawn as a forest, and its history.
Description: |-
  Two panels in the manner of Total Commander over a 3D forest of the disk: a tree for each folder, a leaf for each file, colored by its age. The search runs over an index of the whole disk and narrows with every letter typed; folder sizes are known without walking the disk. A service keeps the index current and remembers how the disk changed since installation. AI agents (Claude, Antigravity and other MCP clients) can read the index through `fm mcp` and propose changes as a plan the person runs or declines in the window, with Ctrl+Z taking all of it back.
