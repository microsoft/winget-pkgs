ShortDescription: Файловый менеджер с мгновенным индексом всего диска, диском в виде леса и его историей.
Description: |-
  Две панели, как в Total Commander, поверх трёхмерного леса диска: дерево — папка, лист — файл, цвет листа — его возраст. Поиск идёт по индексу всего диска и сужается с каждой набранной буквой; размеры папок известны без обхода диска. Служба держит индекс в актуальном виде и помнит, как менялся диск с установки. ИИ-агенты (Claude, Antigravity и другие клиенты MCP) читают индекс через `fm mcp` и предлагают изменения планом, который человек выполняет или отклоняет в окне; Ctrl+Z отменяет весь план сразу.
