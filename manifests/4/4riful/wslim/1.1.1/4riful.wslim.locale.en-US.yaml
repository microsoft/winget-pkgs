ShortDescription: Find what WSL can safely let go of, clean it, and shrink its virtual disks on Windows.
Description: |-
  wslim scans WSL distros for space that can safely be given back (package and build caches, old tool versions,
  Docker build cache), shows a preview, cleans only what you tick, then compacts the ext4.vhdx files with diskpart so
  the space returns to Windows. Works on Windows Home, where Optimize-VHD is not available. Includes a GUI (wslim)
  and a command-line version (wslim-cli).
