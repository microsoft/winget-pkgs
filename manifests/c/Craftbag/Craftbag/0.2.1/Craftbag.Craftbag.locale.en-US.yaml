ReleaseNotes: |-
  [0.2.1] - 2026-10-04
  A skill description written as a YAML list is invalid, and the error names the list item.
  Fixed
  - A description that is a YAML list said the value was empty. description: followed by - not now says expected key: value, got: - not. An empty description: still says the value is empty (#380).
  - A list item that contains a colon looked like a missing description. description: followed by - use foo: bar now says expected key: value, got: - use foo: bar instead of missing required field: description (#388).
  Changed
  - Getting started no longer says list prints nothing. When this clone has no project or home skill directories, craftbag list still exits 0 and says no skills were found (#379).
  Upgrade
  craftbag = "0.2" picks up 0.2.1. The README example uses that pin (#372).
  craftbag = "0.2"
  cargo update -p craftbag
  CLI and MCP:
  brew upgrade craftbag/tap/craftbag
  cargo install --locked craftbag-cli
  cargo install --locked craftbag-mcp
  Compare: v0.2.0...v0.2.1
