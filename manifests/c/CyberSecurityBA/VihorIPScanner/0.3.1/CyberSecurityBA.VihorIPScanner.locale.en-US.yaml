ShortDescription: Fast, free and open-source network scanner for Windows.
Description: |-
  Vihor IP Scanner lists the devices on your local network with host name, IP and MAC address, manufacturer and response time.
  It detects common management services (web UI with page title, SSH, Remote Desktop, shared folders, FTP, VNC, printers)
  and opens them with one click. Wake-on-LAN, remote shutdown and CSV/HTML export are included. No telemetry.
