ShortDescription: A tiny dinosaur that lives on your Windows desktop, tells jokes and wants to be fed.
Description: |-
  Dino Joe is a small open-source desktop pet for Windows. The dino walks around your desktop, sleeps, tells jokes
  and asks to be fed and petted. Works fully offline with no account. Choose from 4 species, 12 colors, patterns,
  accessories and 9 personalities. Jokes come in packs (English and Serbian/Bosnian/Croatian) with an online catalog.
  Optional AI chat with your own key (Groq, Gemini, OpenAI, Claude, OpenRouter or local Ollama). No telemetry.
