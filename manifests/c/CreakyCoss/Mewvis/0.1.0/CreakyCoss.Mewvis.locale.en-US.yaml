PackageIdentifier: CreakyCoss.Mewvis
PackageVersion: 0.1.0
PackageLocale: en-US
ShortDescription: An extensible AI workbench.
Description: |-
  Mewvis is an extensible AI workbench: it packs the capabilities every AI application needs - model access, agents, tools, data storage, and workspaces - into a secure, controllable foundation and hands them out through an SDK.

  With it, any idea can become a working application: a writing assistant for novels, a tutor for courses, or a reader for books. Each application is just a piece of code in a fixed directory written against the SDK, and AI can write one directly from the same SDK.

  Core modules
  - Applications: the smallest unit carrying a complete scenario, with its own interface, settings, data, and sessions; built-in applications include an app workshop, story workshop, learning workshop, RSS reader, documentation center, and debug console.
  - Plugins: extend existing sessions and agent execution flows with tools, skills, commands, context processing, and session sidebars.
  - Models and agents: unified management of model services and conversations, supporting OpenAI, Anthropic, Google Gemini, and OpenAI-compatible APIs; agents can read and write files and execute commands under permission and approval controls, and multiple agents can collaborate through workflows.
  - Workspaces: organize projects by local directory, manage files and sessions in one place, and save and continue conversations.
ReleaseNotes: Mewvis 0.1.0, the first installable release. The installers are not yet signed with a developer certificate or notarized; macOS Gatekeeper or Windows SmartScreen may show a security prompt on first install.
