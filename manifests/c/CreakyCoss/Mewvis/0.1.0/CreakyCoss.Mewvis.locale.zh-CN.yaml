ShortDescription: 可扩展的 AI 工作台。
Description: |-
  Mewvis 是一个可扩展的 AI 工作台：把模型接入、Agent、工具、数据存储、工作区这些 AI 应用都会用到的底层能力，收进一个安全可控的基座，再通过一套 SDK 交出去。

  有了它，想到什么，随时都能做成一个能用的应用：想写小说就做个写作助手，想学一门课就做个学习导师，想看书就做个阅读器。每个应用只是固定目录里的一份代码，照着 SDK 写就行，AI 也能照着同一份 SDK 直接写出来。

  核心模块
  - 应用：承载完整场景的最小单位，拥有独立的界面、设置、数据与会话；内置应用工坊、故事工坊、学习工坊、RSS 阅读器、文档中心和调试台。
  - 插件：扩展已有会话与 Agent 执行流程，提供工具、技能、命令、上下文处理与会话侧栏。
  - 模型与 Agent：统一管理模型服务与对话，支持 OpenAI、Anthropic、Google Gemini 及 OpenAI 兼容接口；Agent 可读写文件、执行命令，经权限与审批控制执行范围，多 Agent 可用工作流组织协作。
  - 工作区：以本地目录组织项目，集中管理文件与会话，可保存和继续已有对话。
