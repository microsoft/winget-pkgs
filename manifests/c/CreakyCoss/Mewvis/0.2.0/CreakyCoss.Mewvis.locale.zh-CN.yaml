ReleaseNotes: |-
  Mewvis 0.2.0 新增影视工坊、设计工作室和口袋文明，并完善多模态模型配置、媒体生成与文件预览。
  新增应用
  - 影视工坊：围绕工作区管理剧本、角色和分镜，支持参考素材导入、AI 提案审核与选择采纳、图片/视频/语音生成、素材版本选择、时间线预览和视频导出。
  - 设计工作室：独立的工作区设计应用，支持画布编辑、项目持久化与 HTML 导出。
  - 口袋文明：支持持久化模拟、故事记录和可恢复的判断流程。
  - 应用工坊：新增重力游乐场示例，更新内置应用图标与应用目录。
  模型与媒体
  - 按用途配置模型能力、连接和请求参数，完善服务商预设、模型发现及能力信息。
  - 支持通过已配置模型生成图片、视频与语音；缺少必要参数时先询问，生成结果使用可读文件名保存。
  - 统一图片、音频、视频和文件预览，改进播放控件、图片缩放及媒体信息展示。
  - 对话实验室新增多模态示例、工作区图片输入和本地媒体处理工具。
  体验与开发
  - 统一应用页头和全屏布局，改进运行账本与设置对话框。
  - 完善应用文件/媒体 API、并发请求处理，以及工具和命令的风险声明。
  - 更新开发指南和文档站。
  安装包

  | 平台                         | 文件                         |
  | ---------------------------- | ---------------------------- |
  | macOS Apple Silicon（ARM64） | Mewvis_0.2.0_aarch64.dmg     |
  | Windows x64                  | Mewvis_0.2.0_x64-setup.exe   |
  | Windows ARM64                | Mewvis_0.2.0_arm64-setup.exe |

  安装包沿用 0.1.0 的分发方式，未进行开发者证书签名或公证。首次安装时，macOS Gatekeeper 或 Windows SmartScreen 可能显示安全提示。安装前可使用随附的 SHA256SUMS 核对文件完整性。
