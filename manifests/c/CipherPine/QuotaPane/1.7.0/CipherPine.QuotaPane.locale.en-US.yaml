ShortDescription: An always-on-top window showing how much Claude and Codex subscription quota you have left, read locally from your own credentials.
Description: |-
  QuotaPane is a small, always-on-top desktop window that shows how much of
  your Claude and Codex subscription quota you have left. It reads the
  credential files the official claude and codex CLIs already wrote on your
  machine, read-only, and talks to nothing else. There is no account to
  create and nothing is phoned home.

  The entire value proposition is a small, auditable trust boundary.
  Credentials and the network are owned by two modules that are deliberately
  small enough to read end to end in one sitting; everything else is
  scheduling and rendering. Egress is deny-by-default through a single
  chokepoint with a host allowlist, tokens are never written to disk or into
  logs, there is no telemetry of any kind, and there is no silent
  auto-update. Token refresh is delegated to the official CLIs — QuotaPane
  never writes a credential file.

  The window shows per-window percentages with reset countdowns, pace markers
  and a burn-rate forecast, optional 24-hour sparklines, time-aware alerts, a
  per-model breakdown, and a live system-tray miniature. A separate agents
  view reads your local Claude Code and Codex session logs to show what is
  running.

  This package also installs quotapane-cli, the headless companion: --once
  and --watch modes with JSON and NDJSON output, --fail-at for gating scripts
  and CI on remaining quota, and --statusline for feeding Claude Code's own
  status bar without making a single request.
