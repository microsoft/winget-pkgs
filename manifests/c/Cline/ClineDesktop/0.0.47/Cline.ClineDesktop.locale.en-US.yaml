ShortDescription: The Cline coding agent as a native desktop application.
Description: Cline for Desktop is a standalone native desktop application of the Cline coding agent. It lets users open a workspace, converse with an AI agent to plan and execute coding tasks, queue follow-up messages, fork and edit conversations, and browse session history across desktop, CLI, extension, and scheduled runs. Users can bring their own API keys from providers such as Anthropic, OpenAI, and Gemini, or sign in with a Cline account.
