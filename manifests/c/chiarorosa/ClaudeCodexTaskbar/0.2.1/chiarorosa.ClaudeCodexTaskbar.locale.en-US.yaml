ShortDescription: Lightweight native Rust taskbar widget (under 1 MB) showing Claude Code and Codex usage limits plus CPU, RAM, GPU and disk activity
Description: |-
  CCT is a lightweight Windows 10/11 taskbar widget written in Rust for performance (raw Win32 +
  Direct2D, no runtime). It shows Claude Code and OpenAI Codex subscription usage (5-hour and
  weekly limits, % used, reset times) next to CPU, RAM, GPU and per-disk activity. A single
  executable under 1 MB, using about 15 MB of RAM and near-zero CPU while running. No telemetry;
  credentials are only read, never written. The interface is in English or Brazilian Portuguese.
