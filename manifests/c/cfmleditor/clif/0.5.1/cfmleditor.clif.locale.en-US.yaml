ShortDescription: CFML language server and command-line checks
Description: |-
  clif (pronounced "cliff", formerly cfmleditor-lsp) is a Language Server Protocol server for CFML / ColdFusion,
  and a command-line tool for the same checks: CFLint with no Java, unresolved component and method calls,
  references, formatting, and a whole-project code map. The VS Code, Zed and IntelliJ CFML extensions run it as
  their language server.
