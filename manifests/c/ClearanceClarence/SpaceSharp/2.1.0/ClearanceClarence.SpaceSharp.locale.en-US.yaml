ShortDescription: 'See where your disk space went: a fast, zoomable treemap of your drives.'
Description: 'SpaceSharp scans a drive or folder and draws it as a treemap: every folder a frame, every file a box sized by the space it takes, so the largest items stand out at a glance. On NTFS it reads the file table directly and maps a whole drive in seconds. Color the map by folder, depth or file type, zoom into any folder, filter by type, size and age, compare with an earlier scan to see what grew, and clean up from the map; everything goes to the Recycle Bin. Free and open source under the MIT license.'
