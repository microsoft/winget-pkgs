ReleaseNotes: |-
  What's New
  Git Operations & Hooks
  - Enhanced Hook Feedback: Added real-time progress tracking for pull, merge, and rebase operations.
  - Hook Bypass: You can now choose to bypass hooks for pull and merge operations when the backend permits.
  - Improved Reliability: Added automatic rollback for merge operations if a merge hook fails.
  - Hook Warnings: The UI now displays warnings when an operation completes successfully but a post-operation hook fails.
  Avatars
  - GitLab Support: Added a new GitLab avatar provider.
  - Better Discovery: Improved GitLab avatar fetching by utilizing commit authors to identify users more accurately.
  User Interface
  - Commit Graph: The commit graph toolbar button is now permanently visible and no longer requires a setting to be enabled.
  Internal Improvements
  - Refactored commit message validation for AI-generated messages.
  - Updated project dependencies.
  Full Changelog: v0.11.1...v0.12.0
