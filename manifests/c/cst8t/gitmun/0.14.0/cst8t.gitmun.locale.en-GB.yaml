ReleaseNotes: |-
  Release Notes - v0.14.0
  Git & Repository
  - Advanced Commit Search: Added a high-performance commit search with a new asynchronous background worker.
    - Search by commit hash, author, email, or message.
    - Support for topological ordering and varying log scopes.
    - Progressive results loading with a "pause and load more" mechanism.
    - Ability to restart search upon settings changes.
  - Stash Workflow Overhaul: Redesigned the "Stash Changes" experience with a new workspace UI.
    - Fine-grained Selection: Select specific files or directories to stash instead of all changes.
    - Tree View: Browse and select files using a hierarchical folder structure.
    - File Previews: Integrated a read-only diff viewer to preview changes before stashing.
    - Untracked File Support: Ability to explicitly include or exclude untracked files in the stash.
    - Bulk Actions: New "Select All", "Clear All", and search-based selection tools.
  - Improved Error Handling: Enhanced interpretation of Git CLI and Gix errors, specifically for HTTPS authentication and network failures.
  Identity & Signing
  - Enhanced Identity Management:
    - Inheritance Controls: Added the ability to explicitly clear local overrides and revert to inherited (global/system) identity settings.
    - Signing Format Detection: The application now attempts to detect the effective signing format (OpenPGP, SSH, X.509) based on your Git configuration.
  - Signing Key Helpers:
    - SSH Key Import: Added a helper to import public SSH keys directly from a file.
    - GPG Key Chooser: Introduced a dialog to browse and select usable secret GPG keys from your local keyring.
  - Identity UI Improvements: Updated the identity panel with better visual indicators for inherited vs. overridden settings and a more robust editing workflow.
  Internal Changes
  - Updated gix to v0.90.0.
  - Refined the WinGet manifest generation workflow in GitHub Actions.
  Full Changelog: v0.13.0...v0.14.0
