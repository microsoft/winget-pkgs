ReleaseNotes: |-
  0.15.6 - 2026-11-18
  修复
  - 修复 Claude Desktop 更新或更换安装来源后，旧 MSIX 路径使增强切换及其恢复重复报 0x00000003 的问题。切换增强或修复过滤器前会提示「更新路径」。迁移可清理已移除的旧入口，保留原条目的名称、参数和防护开关。
  - 修正 Edge / Chrome 的网页扩展安装和更新指引。请把 IP-Guard-Browser-0.15.6.zip 解压到「下载」等可写位置，或将桌面打开的扩展文件夹复制过去，再加载含 manifest.json 的目录。浏览器需要在该目录写入规则索引；直接加载受保护的安装目录可能报 rules.json: Internal error while parsing rules.。扩展 ID 和网页防护规则保持不变。
  严格命令防护（实验）
  - 合入 v0.15.3 预览中的 Fort 分阶段安装：检测到内存完整性（HVCI）启用或待启用时，只有明确确认才提交本机关闭请求。重启后重新核对 HVCI 状态，确认关闭再安装；不自动重启，也不在提交关闭请求时安装或加载驱动。检测到启用 HVCI 的组织策略或 UEFI 锁时不修改设置。
  - Fort 仍与开启的 HVCI 不兼容。关闭内存完整性会降低 Windows 内核防护，卸载后也不会自动恢复。隔离 Windows 验证覆盖开关写入及原值恢复；Windows 11 真机从 HVCI 开启、重启到安装的完整流程尚未实测。
