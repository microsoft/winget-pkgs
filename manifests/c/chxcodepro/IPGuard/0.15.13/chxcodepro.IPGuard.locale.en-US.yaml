PackageIdentifier: chxcodepro.IPGuard
PackageVersion: 0.15.13
PackageLocale: en-US
ShortDescription: Application IPv4 launch gate and managed network guardian for Windows.
Description: |-
  Windows tool that pins the allowed public IPv4 egress addresses, verifies the address before a protected session starts, and keeps monitoring it while the session runs. When the address becomes unexpected it suspends network access for the controlled application and keeps the process and window alive.
  Features
  - IP locking and continuous protection: accepts multiple allowed IPv4 addresses, checks them before launch, suspends application networking on a network change or a failed check, and resumes automatically after a successful check without losing the process or window.
  - IPv4 source selection: seven HTTPS API presets plus a custom URL, Claude AI by default. The fetch button, launch check, background check and web guard all follow the selected source.
  - Visual interception policy: shows the effective protection state, the affected programs and confirmed local ports, and lets you add exact host/port proxy, direct and block exceptions; the initial list is empty.
  - Protection alerts: pause, resume and guardian failure pop-ups report the reason and the affected program, with IP addresses masked by default.
  - Original terminal experience: keeps console input and output, working directory, environment and exit code; calls inside the same protected process tree reuse the first grant.
  - Per-program optional hardening: each EXE independently offers basic protection or the local-IP leak guard, which is off by default.
  - Claude installation detection: presets for the npm install, the standalone native claude.exe and Claude Desktop, plus manual EXE entry.
  - Follow the current network: reuses your existing proxy, TUN and application proxy environment, and starts protecting once the egress IPv4 is locked.
  - Automatic dedicated routing: reads the current node from a supported local Xray, sing-box or Mihomo core and builds a forced proxy channel for hardened entries while ordinary applications keep their original routing.
  - Program management: edit names and launch arguments, view run state, and stop the Claude process tree after confirmation.
  - Claude web protection: the Chrome and Edge extension admits Claude web pages only through the locked IPv4 and leaves browser proxy settings and the official Claude extension untouched.
  - Network diagnostics: reports IPv6, network adapters, DNS, time zone, region, connectivity and risk attributes.
  - Desktop integration: light, dark and system themes, tray operation, start on logon, and updates from GitHub Releases.
