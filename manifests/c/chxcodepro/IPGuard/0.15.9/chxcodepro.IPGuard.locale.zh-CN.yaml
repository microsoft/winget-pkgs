  GitHub Actions 44679571799 四个平台构建与验收通过。Windows 的 39 项定向用例通过；正式安装器在隔离 Windows 中退出码为 0，安装后界面与原生组件握手为 0.15.9，十项附件和更新元数据已核对。
  本机一次静默升级曾在退出时记录 0xC0000409，文件更新及后续运行正常，隔离 Windows 安装未复现该异常。
  范围
  Windows 严格进程树过滤继续保留实验范围；Linux / macOS 附件为受管代理预览版。
