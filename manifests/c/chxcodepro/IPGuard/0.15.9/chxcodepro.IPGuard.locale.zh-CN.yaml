ReleaseNotes: |-
  0.15.9 - 2026-11-19
  修复
  - 修复增强出口周期复核首次暂时失败时，提前撤销仍有效的出口许可、切断 Claude Desktop 的 Code 和聊天在途连接的问题。同一路由重试沿用原 15 秒有效期；地址失配、许可过期、路由变化或三次复核均失败时继续封锁。
  - 补齐 T3 / Claude Agent SDK 的思考强度、会话恢复位置、权限工具与工具列表等启动参数识别。(by @passionada)
