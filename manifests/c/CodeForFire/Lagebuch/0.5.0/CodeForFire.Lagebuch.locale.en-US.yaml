ShortDescription: Offline-first incident documentation (Einsatzdokumentation) for fire brigade command vehicles.
Description: >-
  Lagebuch ("log book") is the digital incident log for the fire brigade command
  vehicle (ELW): a desktop application that works without a network, without a
  cloud and without a subscription. One incident is one file on the laptop, with
  the incident log, deployed units and personnel, breathing-apparatus monitoring
  with spoken alarms, tasks, a CO measurement protocol and a PDF report.
  Optional multi-device sync runs over the local network with TLS and
  certificate pinning; no account, no telemetry, no personal data leaves the
  vehicle. Built with .NET and Avalonia, MIT licensed.
