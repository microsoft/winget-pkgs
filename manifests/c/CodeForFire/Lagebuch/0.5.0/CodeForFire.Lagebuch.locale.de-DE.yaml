ShortDescription: Einsatzdokumentation für den ELW – offline, ohne Cloud, ohne Abo.
Description: >-
  Lagebuch ist das digitale Einsatztagebuch für den Einsatzleitwagen: eine
  Desktop-Anwendung, die auch ohne Netz, ohne Cloud und ohne Abo funktioniert.
  Ein Einsatz ist eine Datei auf dem ELW-Laptop – mit Einsatztagebuch, Kräften,
  Atemschutzüberwachung samt gesprochenen Alarmen, Aufgaben, CO-Messprotokoll
  und PDF-Bericht. Die optionale Synchronisation mehrerer Geräte läuft über das
  lokale Netz mit TLS und Zertifikats-Pinning; kein Konto, keine Telemetrie,
  keine personenbezogenen Daten verlassen den ELW. Entwickelt mit .NET und
  Avalonia, MIT-Lizenz.
