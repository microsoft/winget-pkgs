Description: 3D CAD Converter batch-converts between STEP (AP203/AP214/AP242), IGES, STL, OBJ, 3MF, glTF, DXF, PLY, VRML and other 3D formats. It offers tessellation quality presets, mesh repair, polygon decimation, unit conversion and assembly support, so exports from CATIA, SolidWorks or Inventor can be prepared for 3D printing, CNC or real time engines without a seat of the original CAD package. Conversion runs entirely on the local machine, which keeps proprietary geometry off third party servers, and can be driven from the desktop app, a watch folder, or the command line. Free trial, then a one-time license.
