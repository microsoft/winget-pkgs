Description: 'Contenta Converter PREMIUM converts and processes large photo libraries in a single pass. It reads 60+ input formats, including camera RAW (CR2/CR3, NEF, ARW, DNG), HEIC, AVIF, PSD and PDF, and writes to 20+ output formats with full quality control. Operations can be chained: resize, crop, watermark, rename with pattern tokens, edit or strip EXIF/IPTC metadata, and build PDF albums. It runs from the desktop app, from watch folders, or from a command line interface for scripted automation. Everything is processed locally with no upload and no file count limit. Free trial, then a one-time license with free updates.'
