ShortDescription: 'Batch video compressor for Windows with watch folders: point it at a folder and new videos are re-encoded automatically to H.265, AV1 or VP9 with GPU acceleration.'
Description: 'VideoRecompress Studio batch-compresses video libraries using modern codecs (H.265, AV1, VP9) with NVENC, AMF and QSV hardware acceleration. Watch folders monitor directories, including network shares, and compress new files as they arrive, so no scripting or container setup is required. Source files are never modified: output is written separately, with quality controlled by a CRF slider and per-preset targets. It runs from the desktop app or from a command line interface, works entirely offline, and is licensed once rather than by subscription. Free trial included.'
