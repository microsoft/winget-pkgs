ReleaseNotes: |-
  新增：
  - 重构本地终端为三横块布局，支持系统 Shell 自动探测与双栏拖拽调宽
  - 优化新建分组与新建连接分组路径 UI 交互体验
  - 支持系统字体全局配置并优化排版与底部功能栏细节
  - 新增 SSH 与 Windowws RDP 彩色协议图标并统一替换
  修复：
  - 分离字体族与本地化别名
  - 补全系统字体本地化名称
  - 消除 dev 链接阶段 LNK4099 刷屏
  优化：
  - 精简系统字体字号配置并优化字体同步与启动稳定性
  - 优化连接管理弹窗间距布局并保证把手完整展示
  - 优化与解耦 MCP、隧道、上级及连接管理相关图标
