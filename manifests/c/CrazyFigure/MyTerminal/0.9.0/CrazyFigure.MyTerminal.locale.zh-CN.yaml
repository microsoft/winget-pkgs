ReleaseNotes: |-
  新增：
  - 新建文件/目录与重命名改用居中模态弹窗，替代原生 prompt
  - 传输进度显示实时速度并支持自定义完成提示
  - 会话标签页悬停提示展示完整会话/连接名称及状态释义，延迟显示并在拖拽时禁用，图标间距改由父级 gap 控制
  修复：
  - 调整文件列表日期列宽并格式化时间为 yyyy-MM-dd HH:mm:ss，使用实色背景修复列表与吸顶表头透底问题
  - 新增无内边距承载层挂载 xterm，并按承载层取宽与观察尺寸，修正外层内边距和横向滚动条导致的行数与列宽偏差
