  新增：
  - 🔄 支持 GitHub 与腾讯云 CNB 双渠道更新，检测失败自动切换来源并记住可用渠道
  - 🎨 新增 Antigravity、DeepSeek Harness 预设图标，侧栏文件显示彩色图标
  - 🖱️ 支持鼠标中键关闭会话标签，侧栏运行状态可收起
  修复：
  - ⚡ 减少本地终端长会话的输出卡顿
  优化：
  - 🪟 更新 Windows 远程桌面图标，明暗主题和小尺寸下更清晰
  - 🔘 连接管理中的编辑、复制、删除改为图标按钮，用户名显示更完整
