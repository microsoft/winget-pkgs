ReleaseNotes: |-
  新增：
  - ⬆️ Windows 安装版支持一键下载、校验签名并安装更新。
  - 📁 文件树支持按修改时间升序、降序或恢复默认排序，并可拖放上传和下载。
  - 🔔 本地终端任务完成或等待输入时可发出 Windows 系统通知，点击通知可返回对应终端，后台标签还会标记未读。
  修复：
  - 🖥️ 移除 Windows 系统托盘中的 MyTerminal 图标。
  优化：
  - 🖱️ 终端右键默认打开菜单，可在设置中切换右键行为。
