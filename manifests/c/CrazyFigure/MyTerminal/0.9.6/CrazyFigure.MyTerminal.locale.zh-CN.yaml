ReleaseNotes: |-
  新增：
  - 非激活标签的关闭按钮改为悬停或键盘聚焦时显示
  - 右键菜单溢出时自动翻转贴边，并替换终端与会话菜单定位
  修复：
  - 统一深色模式层级配色，浮层、分区、进度条等改用 CSS 变量并修复白底浅字问题
  - 单窗格时移除焦点描边避免与卡片边框重叠
  优化：
  - 背景图改为在分屏网格层统一绘制，各分屏与标签栏共用一张图；统一全局滚动条样式并将分隔线握柄调整为贯穿长线
