ReleaseNotes: |-
  新增：
  - 右键菜单、插入菜单与斜杠菜单支持插入表情
  - 统一回车类按键行为，新增 Enter 互换开关与段落间距设置
  - 右键菜单补全公式与图表、图片子菜单，统一默认信息图模板
  - 右键插入表格支持 2x2 与 4x4，斜杠菜单移除正文段落
  - 选中文本右键菜单新增转为代码块、提示块、高亮块、折叠块
  - 高亮块图标新增彩色表情
  修复：
  - 统一同级块选中底板的宽度
  - 修复格式气泡菜单首次弹出时跑到左上角
  - 修复从表格外拖选进表格时松手后选区消失
  - 表格单元格选中高亮跟随主题色
  - 统一可视化与源码模式下有选区时插入块的行为
  - 统一 GitHub 提示块与高亮块的命名
  - 修复多行文本弹层与侧栏中菜单点空白关不掉、右键菜单出现在背景中
  - 修复双击/三击选中看不见的换行符、误选到下一段
  - 修复重启恢复的图片与不支持格式标签一直显示正在加载
  - 修复重启后标签恢复不全或全部丢失
  优化：
  - Merge remote-tracking branch 'origin/main'
  - 斜杠命令测试适配已移除的正文段落命令
  - update star history
