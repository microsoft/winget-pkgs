ReleaseNotes: |-
  Starting with this release, the Store listing in English will be named "TranslucentTB - Taskbar Customization Tool" for SEO purposes. Other languages keep just "TranslucentTB"
  New features
  - Added a hidden option to disable Explorer crash detection (I don't recommend setting this option, the detection exists for a reason).
  Bug fixes
  - Fix white squares on the taskbar (finally!)
  - Fix taskbar detection in build 26300.10075 (and related Insider builds)
  - Prevent the Windows auto-hide taskbar from dismissing while the context menu is open
  - Fix property changed handlers getting leaked in the TAP
  - Fix the battery saver mode not applying on Windows 11 when battery saver was engaged while the battery level was over 20% (thanks @snowice824!)
  - Avoid termination if TAP times out, which should reduce the number of cases startup errors are being seen (thanks @minerva32!)
