ReleaseNotes: |-
  New features
  - Add CTRL+ALT+SHIFT+F1 shortcut to reset dynamic state (thanks to @Wahid7852)
  Bug fixes
  - Make the app more resilient against re-entrency, reducing crashes.
  - Fix bugs where the app would not be able to update the taskbar on certain monitors.
  - Watch for package updates in the TAP
  - Avoid ExplorerHooks in modern XAML taskbar
  - Fix a few resource leaks in the TAP
  - Fix the application not closing if you had a window previously interrupt shutdown
