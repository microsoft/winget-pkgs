ReleaseNotes: |-
  We have released another hotfix 0.70.2 to fix some more pesky bugs.
  Bug fixes
  - Dying patients can no longer be sent home
  - Machine dynamic information now correctly updates after repair
  - Fixed key input crash when using the numpad
  - Fixed side objects becoming passable after purchasing a plot
  - Fixed patient dialog not opening on epidemic patients
  Note for Windows users
  Windows Smartscreen has been noted during preview releases to trigger more readily. In order to suppress it, you will need to 'unblock' the executable by right clicking it and choosing properties. Afterwards, press OK to apply the change.
