ReleaseNotes: |-
  We have released another hotfix 0.70.3 for an additional bug, as well as autodetection support of Steam copies of Theme Hospital (default location only)
  Improvements
  - Auto-detection of Theme Hospital folder for Steam users on Windows

  Bug fixes
  - Crash with subtitles after some random announcements played on non-english localisations
  Note for Windows users
  Windows Smartscreen has been noted during preview releases to trigger more readily. In order to suppress it, you will need to 'unblock' the executable by right clicking it and choosing properties. Afterwards, press OK to apply the change.
  We are hoping starting with 0.71.0, our Windows installs will be signed.
