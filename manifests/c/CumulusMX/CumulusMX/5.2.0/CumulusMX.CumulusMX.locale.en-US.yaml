ShortDescription: The Cumulus MX weather program
ReleaseNotes: |-
  New
  - New web tags for average annual values
    - <#AllYearsTempAvg> <#AllYearsRainfallAvg> <#AllYearsWindRunAvg> <#AllYearsSunshineAvg>** <#AllYearsTotalETAvg> <#AllYearsTotalChillHoursAvg>
      <#AllYearsDryDaysAvg> <#AllYearsWetDaysAvg>
      ** Note: <#AllYearsSunshineAvg> assumes you have had sunshine hours being recorded for your whole history. If this is not the case add a parameter to specify the first FULL YEAR of your history that contains solar data startyear=YYYY
    - Accept a parameter of mindays=nnn, which defines the minimum number of days in a year for it to be included in the averaging. This defaults to 360 days
    - Some diagnostics that give an indication how the averages were arrived at can be displayed by adding the web tag parameter diags
  - New web tag for solar noon time <#solarnoon>
  - New web tag for current absolute humidity <#AbsHum> which returns the total water content in g/m³
  - New simple reports of various weather variables summarised by month and year from your day file.
    - Accessed from Reports -> Simple Reports
    - They default to HTML table format, but you have the option of plain text output

  Changed
  - The Extra Web Files functionality has had an overhaul:
    - The settings page is now an Alpaca form with a changed layout. This means that the available settings change to reflect the capabilities of other settings
    - In addition to real-time/interval/eod periods, you can now perfrom Extra Web File copies/uploads at custom intervals, and perform them at scheduled times
  - Web tag parameters which are effectively boolean (accept a "y" or "n" value) can now have the value omitted to default to "y"
    - For example, previously you had to use the parameter rc=y to remove commas, now simply adding the parameter rc has the same effect
    - The old behaviour of the full key=value format will still continue to function
    - The current parameters to use y/n are: rc, tc, tcstr, diags, showdate, dateonly
  - Change to how rainfall is handled. CMX now uses a monotonically increasing rainfall counter. This simplifies many things!
  - Adds the high rain rate for today to Todays Rain Editor
  - Reduced the number of supported runtime environments
  - Upload.php has been updated to avoid issues when the brotli package is not available, and compression probing issues
  - Moon image updates:
    - If Moon image Copy is enabled, and Upload is Disabled, then the image is now created directly in the copy destination, rather than being created in the /web folder and later copied to the copy destination
    - Updated the base Moon image to a less contrasty version that is better centered on the mean libration position
    - Added a new option to create the Moon image correctly orientated to your local horizon. If this option is enabled, then the Moon image is updated every 30 minutes rather than hourly
    - Softened the transition of the terminator slightly
  - The Dashboard Gauges page now attempts to set the locale to the same language as MX is running

  Fixed
  - Tempest station not updating the Station and Altimeter pressures during live running
  - Ecowitt Soil EC Temperatures not being converted to user units
  - The dashboard Extra Sensors page failing to hide the Humidity block when no sensors are enabled
  - Fix Cumulus.ini being rewritten at every restart
  - Fix calculated wind speed average when the clocks go forward
  - Allow for null values in all WLL broadcast fields
  - Fix local copy of Moon image if uploads are disabled
  - A PHP upload compression test being performed at start-up when uploads are not enabled
  - Davis VP2 clock check was still using a 30 secs threshold during normal running
