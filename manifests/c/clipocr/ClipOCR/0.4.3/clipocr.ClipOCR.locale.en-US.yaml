ShortDescription: Copy text from any screen region with OCR that runs entirely on your device.
Description: >-
  ClipOCR is a tray-only utility. Press the hotkey, drag over a region of the
  screen, and the recognised text is copied to the clipboard. OCR runs locally
  with Apple Vision on macOS, Tesseract on Linux and Windows.Media.Ocr on
  Windows; there is no account, no cloud OCR service and no capture history.
  The only network request is an optional update check, off by default.
