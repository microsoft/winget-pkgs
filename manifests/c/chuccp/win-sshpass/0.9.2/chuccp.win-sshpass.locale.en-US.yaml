ShortDescription: Cross-platform SSHpass - SSH with password authentication from the command line
Description: A cross-platform implementation of sshpass (Windows, Linux & macOS), providing password, private key, or ssh-agent authentication for SSH, SFTP file transfer with progress bar, SCP/rsync-style file transfer, interactive shell with raw terminal mode, local/remote port forwarding (-L/-R), SSH agent forwarding, proxy tunneling (SOCKS4/5, HTTP/HTTPS), breakpoint-resume, file hash/verify, JSON output mode, and config file support.
