ReleaseNotes: |-
  v0.2.22
  - A stage applies only to the merges that change its files. On a branch that several products ship from, a stage for one product asked every merge for a new version of that product. A hotfix to the backend was refused because the site's version had already been released, and the only way through was a release with no change. A stage's when: { changed: [<glob>, …] } now names the files it is about. A merge that changes none of them skips the stage: branch check passes it without answering its requirements, and pipeline can-run says it is skipped, exits clean and writes applies=false into $GITHUB_OUTPUT (or applies=true) for the jobs after it. pipeline run and pipeline record do nothing, so no status and no tag. A merge that touches one of the files is confronted as before. When the changes cannot be read, the stage is still confronted, with a warning that says why. (PCSPP-B05, PCSPP-E05, PCSPA-B09, BCSBR-B06)
  Changelog
  - a9ea5cf docs(release): v0.2.22 notes
  - 73c9b35 feat(pipeline): a stage applies only to the merges that change its files
