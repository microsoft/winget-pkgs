ReleaseNotes: |-
  v0.1.411
  Two defects in anchors affected-tests, reported by MIF. Before, it returned nothing for a screen whose evidence closure holds five tests.
  - A named file with no change since the last commit is read whole. The command compares each file with its committed version, so it can name the tests of the rules and regions that changed. Asked about a file right after the commit that changed it, it compared the file with itself, found nothing, and printed an empty list with no warning. Such a file now reaches every test whose evidence closure holds it. (AFTSF-B06)
  - Test files whose titles cannot be read are still listed. The files format listed only files with a test title the dialect could read. Flows of another tool, such as a Maestro YAML that captures a screen, were dropped. The files format now lists them with the other tests. The title formats (lines, regex, json) name them separately on the error stream. (AFTSF-B07)
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - ce1bbbe fix(affected-tests): an unchanged named file is read whole, and untitled test files are listed
