ReleaseNotes: |-
  v0.1.422
  - check --changed no longer climbs past an import of types alone. In MIF, a hotfix that changed one sentence of a legal text module reached 195 nodes. Validation climbed from the module to the screen and then to the navigator. From there it went through every screen that imports the navigator only for its param types, and up to each of their specs. That blocked rule-implemented on 63 specs and evidence-fresh on 18 flows the change could not touch. A parent tied only by an import the project marks with no side effect on the tests is now still confronted, but the climb stops there, as anchors impact has done since v0.1.412. On the same tree, the scope went from 1127 to 146 nodes. (IMANM-B10)
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 364935d docs(release): v0.1.422 notes
  - 049fc22 fix(check): the scope stops climbing at a parent that imports only types
