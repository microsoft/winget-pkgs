ReleaseNotes: |-
  v0.1.418
  - The files after the flags join --changed. In anchors check --changed a b c, the shell hands b and c to the command as arguments. Since v0.1.409 check and verify refused them. Now they join the list, as a comma-separated list would, so --changed $(cat list) works. (CGPCH-B101)
    - An argument that names no file of the project is still refused, before anything runs, and the error names it. A path read relative to the root or to where the command runs counts as a file of the project. Nothing given is dropped without a word. (CGPCH-E09, VPFVR-E06)
    - In anchors test, an argument is a layer when one is declared by that name, and a file of the project otherwise. A file joins --changed. An argument that is neither is refused, and the error says what an argument may be. The hint added in v0.1.407 is gone, since the file is now simply taken. (STPRS-B18)
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 1a578d3 feat(check): the files after the flags join --changed, in check, verify and test
