ReleaseNotes: |-
  A test's proof stops at its doubles, and a proof tied to no code is pending
  A test's evidence stops at the modules it doubles. A test that doubles a module, such as
  jest.mock('../client'), never runs that module. Its proof expired anyway whenever that module
  changed, or anything behind it, because the closure walked into the real code. The map now
  records on each test the files its doubles replace: each specifier that derived.mock_detect
  captures, resolved like an import to one file of the project. The closure stops at them,
  wherever the walk meets them, not only at the test's own imports. A change to a doubled module
  is caught by the double's stamp (mock-stamped). A specifier that names a third party's
  package, or several files the test's folder cannot choose between, stops nothing.
  A proof tied to no code is pending. evidence-fresh passed a test whose score was measured
  against no code at all: its imports carried no @dep, so its closure was empty and no change
  could expire it. The gate now answers pending when all of these hold:
  - the project's dep-declared confronts tests (on: holds test);
  - the test imports code of the project;
  - its proof reaches none of that code.
  The verdict names the imports, and anchors check --fix writes the flags. An import of types
  only, or of a module the test doubles, does not count. A project that keeps dep-declared on
  code alone sees no change.
  Run anchors map build once to record the doubles.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 928d565 feat(evidence): a test's proof stops at its doubles; a proof tied to no code is pending
