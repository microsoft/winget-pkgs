ReleaseNotes: |-
  v0.1.417
  - A comment-only edit keeps the coverage fresh. A proof of execution already survived an edit that only touched comments. The line coverage did not: an inserted comment line moves the numbers of the lines below, and the map carried line-level signals only when every line stayed in place. In MIF's mutation campaign, each // Stryker disable marker asked for the workspace's whole suite to run again with coverage.
    The map now records which lines of a file are code (kept_lines). When only comments changed, the coverage measured before is moved line by line to the new numbers and stays fresh: the lines each suite instrumented and covered, and the branches no suite took. The i-th line of code before is the i-th after. (EDSTD-B26, RPSCR-B63)
    Nothing is moved when:
    - a comment that steers the coverage tool changed (istanbul ignore, c8 ignore, pragma: no cover…);
    - the map does not yet know the old layout, which happens until a file is built once by this version.
    The mutation score is never moved: a comment may be a directive of the mutation tool, and the score is measured again.
  - New key coverage_directives:. It lists the patterns of those comments. When unset, the common tools' directives apply: istanbul, c8, v8, coverage.py, gcov/lcov and tarpaulin. When set, the list replaces them. (CNFGO-B81)
  The first anchors map build after the upgrade records the layout of every code file.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 8ce573f feat(mapx): a comment-only edit moves the coverage to the new line numbers
