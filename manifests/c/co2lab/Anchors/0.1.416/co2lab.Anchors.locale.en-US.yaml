ReleaseNotes: |-
  v0.1.416
  - The commit hook no longer rewrites the tree's map with the commit's revisions. When the tree is ahead of the index, the hook stages the commit's own map, built from the index, and writes the map on disk back as the tree's. But it took what the commit's map needs from that same disk map, and carrying evidence moves the source's nodes to the commit's revisions. A file edited in the tree and not staged therefore went back to disk with the index's revision and the tree's line revision. Its coverage, measured on the tree, then read stale, and ingesting the lcov again did not clear it. In MIF this happened to 64 files whose only edits were // Stryker disable comments. The hook now reads the disk map twice, once for the merge and once to write back, so the map on disk keeps the tree's revisions and measurements. Only the dates the hook wrote move in both. Reported by MIF. (MPSYN-B10)
    A map already affected is repaired by anchors map build, which takes each node's revisions from its file again, followed by ingesting the coverage once more.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 176cd10 fix(hooks): the hook no longer rewrites the tree's map with the commit's revisions
