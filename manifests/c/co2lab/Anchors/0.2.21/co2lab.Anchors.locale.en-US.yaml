ReleaseNotes: |-
  v0.2.21
  - A merged report dates each suite by its own run. A late ingestion placed a report merged from runs of different times at its earliest suite's timestamp. A test written and run after that first suite was not in the commit of that moment, so it was stamped changed after the run, and its proof read as stale even though the suite was green. Each case now carries its suite's timestamp. With no --ran-at, each test file is placed by the earliest run of its cases, and each proven code by the earliest run that passed it. A report of one moment, or one dated with --ran-at, is placed as before. (NGSTI-B27, SGINA-B36, JUIJN-B15)
  Changelog
  - 8154fa7 docs(release): v0.2.21 notes
  - c45b802 fix(ingest): a merged report dates each suite by its own run
