ReleaseNotes: |-
  v0.1.413
  - layer-boundary matches the code, not its comments. A forbidden pattern is now matched against the file with the comments of its language blanked, keeping lines and offsets. In MIF, a JSDoc that named a color (#FFF) and a remark that cited an issue (#712) failed the "use a token" rule for hex colors. A rule whose target is a comment, such as one that forbids @ts-ignore or eslint-disable, declares in_comments: true and is matched against the whole content, as before. A language with no comment syntax declared is read whole. Reported by MIF. (LYBNL-B12)
  - doctrine-not-duplicated measures a unit too small to weigh its own words. The similarity weights (IDF) need at least four rules. When a spec and the doctrine it realizes have fewer between them, the rules of the project's other specs and doctrines now join the corpus of the weights. The pair compared is still the spec's rule against the doctrine rule it realizes. In MIF, a spec of one rule realizing a doctrine of two stayed pending, and the only way out was to invent rules. Reported by MIF. (DCTRN-B34)
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 427088f fix(gate): layer-boundary skips comments; doctrine-not-duplicated measures small units
