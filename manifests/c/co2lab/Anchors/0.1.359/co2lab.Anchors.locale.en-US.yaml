ReleaseNotes: |-
  Fixes from a code review: nothing concluded from what was not read
  - Project-wide gates check presupposes. A gate of scope: project or batch now checks
    its presupposes like any other. With a field undeclared it is pending and names the
    field; when the field is waived in dialect.opt_out, it skips.
  - An unreadable test or flow leaves testid-consistent pending. When a linked test, a
    flow or a neighbour test cannot be read, the gate no longer reports its handles as never
    queried. It also no longer passes on the grounds that there is no consumer. It is pending
    and names the files. Consumers are read through the run's reader, so check --index reads
    them from the git index.
  - obligation-honored no longer knows JavaScript identifiers. A token is found at the
    edge of an identifier written in letters, digits and _, in any script.
  - Generic file names are the project's. dialect.generic_basenames lists the names that
    are a role in their folder: a code generated for such a file is made from the folder's
    name. Each family's example carries the usual list. A project migrated before this
    version has none, so anchors code and anchors new stop treating handler.ts as its
    folder until you add:
    dialect:
      generic_basenames: [handler, index, resource, mod, main, types, route, routes, schema, config]
  - The release waits for the CI. The release workflow publishes nothing unless the CI of
    the tagged commit passed.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 905c838 fix: project gates presuppose, unread consumers pend, no JS identifier, release waits for CI
