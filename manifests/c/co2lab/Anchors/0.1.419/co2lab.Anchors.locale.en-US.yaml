ReleaseNotes: |-
  v0.1.419
  - env-declared can ask a unit's spec for what its dependencies read: follow_dependencies and provided. Where each deployed unit gets only the variables declared for it, such as a function per handler, a variable that a shared helper reads is part of that unit's deploy contract. Two new options on the gate entry control this. (ENVDC-B08)
    - follow_dependencies: [<layer>…] names the layers of code where the gate also follows depends-on, transitively and past no import of types. In those layers, a variable the unit's dependencies read is asked of the unit's spec, as if the unit's own code read it.
    - provided: [<glob>…] names the variables the platform gives every unit (AWS_*, NODE_ENV), which no spec is asked to declare.
    - name: env-declared
      check: env-declared
      follow_dependencies: [handler, admin-handler]
      provided: ["AWS_*", "NODE_ENV", "SENTRY_*", "APP_ENV"]
    Off by default: without follow_dependencies, nothing changes. The options are scoped because of measurements in MIF. Switched on for every layer, 421 specs were charged, the app's build variables and the runtime's own among them. Scoped to the handlers, with the runtime's and the shared variables provided, 107 specs were charged, mostly with table names their helpers read.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 8cb9626 feat(gate): env-declared follows the dependencies of the layers the project names
