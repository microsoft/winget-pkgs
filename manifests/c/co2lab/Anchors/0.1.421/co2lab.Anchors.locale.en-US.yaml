ReleaseNotes: |-
  v0.1.421
  A demand's plan can now be changed, both automatically and by hand.
  - A plan moved by the commit takes its demand along. In MIF, a plan moved with git mv from plans/review/ once it was approved left its demand naming a file that no longer existed, and no command could change it. Now, when the commit moves the plan of a demand, the pre-commit hook points the demand at the new path in anchors.progress.md and says so. It stages the progress file when that file has no other unstaged changes; otherwise it asks you to stage it. A failure warns and does not block. (MPSYN-B11)
  - anchors progress replan <demand> <plan>. It points a demand at another plan file: a moved one, or a new one. The plan must be an existing file. The demand's title, stages and tasks stay. (LDCML-B11, DMLDD-B16)
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 314402e feat(progress): a moved plan takes its demand along, and progress replan points it by hand
