ReleaseNotes: |-
  v0.1.415
  - mutation-score leaves out the survivors the tool marks static. Stryker marks a mutant "static": true when it only runs while the module loads, such as a top-level const initializer. With coverageAnalysis: perTest the module is already imported when the mutant is switched on, so the mutation never takes effect and it comes out "Survived" with the suite green. ignoreStatic drops only the static mutants that no test covers. In MIF, 3 of a handler's 9 survivors were static, and applying one by hand broke its test at once.
    - A static survivor is now counted apart: neither a survivor nor a mutant that ran, so it is out of the numerator and the denominator. It is kept on the map (mutants_static).
    - The gate names the count in its detail, whatever the verdict. A file whose only survivors are static does not apply, and says so.
    - A static mutant that was killed is still killed.
    Reported by MIF. (MTINM-B11, SGINA-B35, INCHN-B44)
    The score changes at the next mutation ingestion of each file.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - e9808e3 fix(mutation): a survivor the tool marks static is out of the score, counted apart
