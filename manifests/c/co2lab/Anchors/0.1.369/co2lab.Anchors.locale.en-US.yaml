ReleaseNotes: |-
  A cutoff date for legacy code, a result cache for project tools, and a truthful warning
  legacy lets a gate be stricter on new code than on old code. A project that tightens a
  gate can now leave the code written before a date under the old rule:
  - name: mutation-score
    severity: {pending: block}
    legacy:
      before: 2026-10-21
      severity: {pending: inform}
  - A target whose last commit is older than before, and that has no uncommitted change, uses
    legacy.severity.
  - A target changed since then uses the gate's own severity: one committed after the cutoff,
    one with uncommitted changes, or a new one. Whoever touches legacy code takes on the full
    rule.
  - Only what the verdict does changes. The legacy findings are still reported, they just do
    not block.
  - legacy.severity can never be stronger than the gate's own, and a level it leaves out
    takes the gate's.
  cache keeps a project tool's verdict over the same inputs. It is opt-in for each gate:
  - name: eslint
    run: "bash scripts/anchors-eslint.sh {{files}}"
    cache:
      inputs: ["**/eslint.config.*", "pnpm-lock.yaml", "scripts/anchors-eslint.sh"]
  - The tool runs again only when something its verdict depends on changed:
    - the gate's declaration;
    - the content of each target;
    - the content of each file the inputs match;
    - the version of Anchors.
  - A pass is kept. A failure is kept only with failures: true. In a CI the cache is used only
    with ci: true.
  - A tool that did not get to run is never kept.
  - A replayed verdict says it came from the cache, and when it was measured.
  - check --no-cache runs every tool.
  - The cache lives in .anchors/cache/tools/, outside git.
  The "nothing to measure" warning tells the truth in partial checks. In a check --changed, a gate whose requires matched nothing in the changed files was reported as if
  nothing in the map matched it. Outside --all, the warning now names only a gate that no
  node of the whole map reaches by its on: and tags:.
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - b558382 feat(gate): legacy cutoff, opt-in tool result cache, truthful nothing-to-measure warning
  - a096e47 test(gate): the tool cache test counts runs in the project, the same under every shell
