ReleaseNotes: |-
  v0.1.420
  - A merge GitHub does not associate with its commit is still found. The branch flow and the pipeline's flow: requirement look up the pull request a guarded branch's commit was merged from by asking commits/{sha}/pulls. That association is an index GitHub fills apart from the merge, and it can lag or never come. In MIF, a pull request merged into production while GitHub was returning 502s answered merged: true with its merge commit, but the association stayed [] for more than fifteen minutes: pipeline can-run production-release refused the commit as "the merge of no pull request", and the release stopped at the guard. When no associated pull request was merged as the commit, the recently closed pull requests are now read for the one whose merge commit it is. Reported by MIF. (BCSBR-B04)
  Everything in the v0.1.351 notes still applies: run anchors migrate once, crossing format 8.
  Changelog
  - 4c338b8 fix(branch): a merge GitHub does not associate with its commit is found among closed PRs
