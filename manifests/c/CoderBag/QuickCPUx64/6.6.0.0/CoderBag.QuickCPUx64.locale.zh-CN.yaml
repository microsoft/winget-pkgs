ShortDescription: 面向 Intel 和 AMD 处理器的性能优化、系统监控与 CPU 稳定性测试工具
Description: |-
  Quick CPU 是一款面向 Intel® 和 AMD® 处理器的强大 CPU 监控、性能调优与稳定性测试应用程序。它能够实时显示并控制 CPU 温度、功耗、电压、频率、核心使用率、核心驻留、性能、电流以及电源管理功能等关键系统参数。
  该应用程序还提供可自定义的电源计划控制、睿频功耗限制配置、核心性能倍率调节，以及用于分析所有 CPU 核心的工作负载、热量分布与频率缩放情况的详细图表。Quick CPU 6.0.0 引入了专用的 CPU 压力与稳定性测试模块，可在各种负载条件下验证系统稳定性，支持按核心/线程选择负载以及多种 CPU 测试类型。虽然某些高级 CPU 设置（如 Speed Shift 和 FIVR 控制）目前仅适用于 Intel CPU，但 Quick CPU 为所有希望优化性能、提高电源效率并验证系统可靠性的用户提供了全面的功能。
