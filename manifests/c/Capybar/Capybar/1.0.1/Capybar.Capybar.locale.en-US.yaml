ShortDescription: Customizable Windows dock with live widgets.
Description: |-
  Capybar replaces the Windows taskbar with a dock that has 35+ widgets: a per-app volume mixer,
  Claude and Codex usage, localhost dev ports, wireless device batteries, weather, calendar and more.
  A watchdog process brings the normal taskbar back if the dock closes, crashes or is uninstalled.
  The first 7 days are free with every feature on; after that a one-time license key is required.
