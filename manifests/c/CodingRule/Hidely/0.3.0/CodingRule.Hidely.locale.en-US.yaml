ShortDescription: Keep the windows you choose out of screen sharing, recordings and screenshots, while you still see them.
Description: |-
  Hidely is a tray app that asks Windows to leave chosen windows out of screen capture. They disappear from screen shares, recordings and screenshots, and stay fully visible and usable on your own monitor.
  Save meeting profiles, start a privacy session with one shortcut, and see an honest status for every window. A companion browser extension for Chrome and Edge protects a browser window while a private tab is showing.
  It only affects screen capture. Games with anti-cheat block it.
