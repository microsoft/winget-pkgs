ShortDescription: "Ciresk CI command line: run checks, tests and builds for a repository on remote workers"
Description: Ciresk CI runs the tasks a repository declares in .ciresk/ci.yaml (check, test, build, lint) on remote workers with warm caches and returns an exit code, a bounded summary and the exact next command. This package installs the ciresk-ci binary; the ciresk umbrella (Ciresk.Ciresk) is installed as its dependency, so `ciresk ci check` and `ciresk-ci check` are the same command. Sign in with `ciresk ci auth login`.
