ReleaseNotes: "Summary of Changes\r\n------------------\r\n\r\n**Minor Changes:**\r\n• CiliumPodIPPools now support reservedRanges for multi-pool IPAM. (cilium/cilium#46880, @kyounghoonJang)\r\n• envoy：Add support for HTTP CONNECT (cilium/cilium#45051, @nezdolik)\r\n\r\n**Bugfixes:**\r\n• Fixed `cilium connectivity perf` always reporting `Cilium version：0.0.0` instead of the actual detected Cilium version. (cilium/cilium#47927, @khaddict)\r\n• sysdump：reject collected file names that resolve outside the sysdump directory (cilium/cilium#46609, @sage-mode-hunter)\r\n\r\n**CI Changes:**\r\n• cilium-cli：add connectivity test for toFQDNs on host (cilium/cilium#45026, @atykhyy)\r\n• cilium-cli：bump test-connection-disruption image to v0.0.18 (cilium/cilium#47806, @aanm)\r\n• cilium-cli：disable host-firewall-egress-to-fqdns test on RHEL (cilium/cilium#47970, @atykhyy)\r\n• cilium-cli：don't count pods rejected before running as live (cilium/cilium#47839, @aanm)\r\n• cilium-cli：keep connectivity perf usable without Cilium (cilium/cilium#48128, @aanm)\r\n• cilium-cli：Skip HostToWorld if no external IPv6 (cilium/cilium#47931, @joamaki)\r\n\r\n**Misc Changes:**\r\n• [CFP-39876]：Add connectivity test for non-global namespace isolation (cilium/cilium#46604, @jimassa)\r\n• chore(deps)：update all-dependencies (main) (cilium/cilium#47744, @cilium-renovate[bot])\r\n• chore(deps)：update all-dependencies (main) (cilium/cilium#47859, @cilium-renovate[bot])\r\n• chore(deps)：update all-dependencies (main) (cilium/cilium#48145, @cilium-renovate[bot])\r\n• chore(deps)：update base-images (main) (cilium/cilium#47947, @cilium-renovate[bot])\r\n• chore(deps)：update base-images (main) (cilium/cilium#48095, @cilium-renovate[bot])\r\n• chore(deps)：update docker.io/library/golang:1.26.5 docker digest to 2005724 (main) (cilium/cilium#47860, @cilium-renovate[bot])\r\n• cilium-cli/clustermesh：log enable messages via Parameters.Writer (cilium/cilium#47439, @FirePheonix)\r\n• cilium-cli：Replace `reflect.DeepEqual` with `assert.Equal` in tests (cilium/cilium#47533, @HadrienPatte)\r\n• CLI：add toleration for a single etcd container restart (cilium/cilium#48106, @giorio94)\r\n• CLI：add toleration for three more log warnings (cilium/cilium#48091, @giorio94)\r\n• cli：the CLI now considers the ENI IPv6 beta warning log as expected and detects EKS flavor for IPv6 EKS clusters. (cilium/cilium#47524, @41ks)\r\n• Revert \"cli：drop restarts exclusion for Cilium v1.16 and earlier\" (cilium/cilium#48115, @giorio94)\r\n• Update all-dependencies (main) (cilium/cilium#47654, @cilium-renovate[bot])\r\n• Use k8s API constants instead of string literals (cilium/cilium#47505, @HadrienPatte)\r\n• Update stable release to v0.19.7 by @michi-covalent in https://github.com/cilium/cilium-cli/pull/3280\r\n• chore(deps)：update dependency cilium/cilium to v1.19.6 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3279\r\n• README.md：Update compatible Cilium versions by @michi-covalent in https://github.com/cilium/cilium-cli/pull/3281\r\n• chore(deps)：update docker.io/library/golang docker tag to v1.26.5 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3282\r\n• action：retry Cilium CLI download in case of errors by @giorio94 in https://github.com/cilium/cilium-cli/pull/3286\r\n• chore(deps)：update docker.io/library/golang:1.26.5 docker digest to 2005724 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3285\r\n• build(deps)：bump oras.land/oras-go/v2 from 2.6.1 to 2.6.2 by @dependabot[bot] in https://github.com/cilium/cilium-cli/pull/3272\r\n• chore(deps)：update actions/stale action to v11 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3283\r\n• chore(deps)：update dependency cilium/cilium to v1.20.0 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3284\r\n• chore(deps)：update golangci/golangci-lint docker tag to v2.12.2 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3287\r\n• chore(deps)：update dependency go to v1.26.6 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3288\r\n• chore(deps)：update golangci/golangci-lint docker tag to v2.13.1 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3292\r\n• chore(deps)：update dependency cilium/cilium to v1.20.1 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3289\r\n• chore(deps)：update docker/setup-buildx-action action to v4.3.0 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3290\r\n• chore(deps)：update gcr.io/distroless/static:latest docker digest to f2ea270 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3293\r\n• chore(deps)：update go to v1.27.0 by @renovate[bot] in https://github.com/cilium/cilium-cli/pull/3291\r\n• Prepare for v0.20.0 release by @tklauser in https://github.com/cilium/cilium-cli/pull/3294\r\n\r\n\r\n**Full Changelog**：https://github.com/cilium/cilium-cli/compare/v0.19.7...v0.20.0"
