ReleaseNotes: |-
  Summary of Changes
  ------------------

  **Minor Changes:**
  • cilium-cli：Apply labels to all new test namespaces (cilium/cilium#49190, @darox)
  • cilium-cli：fall back to WebSocket when a proxy rejects the SPDY upgrade (cilium/cilium#49229, @epb-644)

  **Bugfixes:**
  • Fixes error when passing times of 60s or more to cilium connectivity perf and throws an explicit error on fractional seconds. (cilium/cilium#48965, @Arleee1)

  **CI Changes:**
  • cilium-cli/connectivity：remove unused client-egress-to-echo-port-range manifest (cilium/cilium#49676, @tklauser)
  • cilium-cli：Fix two false passes in the connectivity test (cilium/cilium#49493, @aanm)
  • cilium-cli：respect --ip-families in validateDeployment (cilium/cilium#45325, @darox)
  • cilium-cli：Retry execs cut by a konnectivity-agent roll (cilium/cilium#49473, @aanm)
  • cli：connectivity: lrp: test skipRedirectFromBackend=false on IPv6 with per-packet LB (cilium/cilium#49356, @julianwiedmann)
  • Retry connectivity test exec probes when the SPDY exec stream times out (cilium/cilium#48860, @kirgene)
  • workflows：Upgrade to RHEL9 (cilium/cilium#49508, @pchaigno)

  **Misc Changes:**
  • bgp：remove the deprecated `v2alpha1` version of the BGP CRDs (cilium/cilium#49329, @martonra)
