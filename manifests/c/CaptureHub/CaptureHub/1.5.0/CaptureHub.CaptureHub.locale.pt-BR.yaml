ShortDescription: Gravador de tela e captura para Windows, que escreve a evidência de teste por você.
Description: |-
  O CaptureHub grava a tela do Windows sem limite de tempo e sem marca d'água,
  tira print, anota e apaga o que não pode sair da máquina. O borrão é
  destrutivo: ele remove os pixels em vez de cobri-los, então CPF coberto não
  volta nem clareando a imagem depois.

  Durante a gravação, a barra flutuante fica fora da própria captura, então o
  vídeo mostra só o trabalho. Um atalho marca o momento sem interromper, e cada
  marca vira um capítulo navegável no MP4.

  Quando é preciso provar o que aconteceu, cada clique vira um passo escrito. A
  legenda é lida do elemento real da interface, ao lado da tela daquele momento
  e de uma ampliação do ponto da ação. A mesma gravação produz um relatório em
  HTML de arquivo único, que abre sem rede e sem instalar nada, e uma
  apresentação em PPTX editável, gerada sem exigir o Office.

  Toda captura sai com o SHA-256 do arquivo e uma ficha de procedência: período
  com fuso, operador, sistema, resolução de tela e aplicativos em execução.

  Gravação, processamento e arquivos nunca saem da sua máquina. A camada de
  nuvem carrega conta e licença, e nada mais.

  Cerca de 1,3 MB por minuto e 3,2% de CPU no nível padrão. O melhor codificador
  disponível, NVIDIA, Intel ou AMD, é medido e escolhido automaticamente.

  O plano gratuito não expira e continua gravando sem limite de tempo e sem
  marca d'água. Pro e Time liberam o relatório, a apresentação e os lugares de
  equipe.
