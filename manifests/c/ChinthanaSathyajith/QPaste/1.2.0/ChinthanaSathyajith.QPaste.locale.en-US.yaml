ShortDescription: A clipboard queue for Windows. Copy several things in a row, then paste them back in the same order.
Description: |-
  QPaste adds a first-in, first-out queue on top of the Windows clipboard.
  Press F4 to turn on Queue Mode, copy everything you need from any app, and each Ctrl+V pastes the next item in the order you copied it.
  It works on any keyboard layout, lets you record your own hotkeys, and includes a floating Quick Notepad on F3.
  Free, open source, works offline, and needs no account.
