ShortDescription: AI copilot overlay that reads your screen and shows ghost-text suggestions.
Description: |-
  Code Helper watches your screen with OCR, and when it sees the #ulw trigger it
  sends the screenshot to a Gemini vision model and types the answer back as
  ghost text on a transparent, click-through overlay you advance line by line.

  The package is a single self-contained executable carrying its own Python
  runtime and PyQt6. On first launch it installs Tesseract OCR and asks for a
  Google Gemini API key, which it stores next to the executable and never bakes
  into the binary.
