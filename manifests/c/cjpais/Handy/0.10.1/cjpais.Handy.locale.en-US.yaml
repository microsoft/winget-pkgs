ReleaseNotes: |-
  a ton of bug fixes! thanks all for the contributions
  What's Changed
  - fix(deps): address TLS dependency security advisories (CVE-2026-41677) by @JesseDyer in https://github.com/cjpais/Handy/pull/2432
  - fix(overlay): disable WebView2 context menu on the recording overlay by @alanshurafa in https://github.com/cjpais/Handy/pull/2403
  - fix: build the async runtime before streaming logs to the webview by @alanshurafa in https://github.com/cjpais/Handy/pull/2478
  - Let AppImage users opt into native Wayland by @alanshurafa in https://github.com/cjpais/Handy/pull/2453
  - fix: turn off the updater on Linux builds that cannot install updates by @alanshurafa in https://github.com/cjpais/Handy/pull/2448
  - fix: keep X11 overlay resizable so Bottom stays on screen by @alanshurafa in https://github.com/cjpais/Handy/pull/2447
  - fix: clear stale macOS accessibility permissions during onboarding by @notenderdreams in https://github.com/cjpais/Handy/pull/2057
  - feat: decode Opus audio files (ogg, opus, webm) by @cjpais in https://github.com/cjpais/Handy/pull/2482
  - fix: skip pasting a transcript that is only a period by @flesler in https://github.com/cjpais/Handy/pull/2434
  - fix: show a No Model Selected notice instead of a blank model-not-found error by @alanshurafa in https://github.com/cjpais/Handy/pull/2418
  - docs: list OpenBLAS in Linux build dependencies by @cjpais in https://github.com/cjpais/Handy/pull/2484
  - fix(shortcut): classify tap vs hold by key event time, not dequeue time by @xronocode in https://github.com/cjpais/Handy/pull/2097
  - fix: replace the transcription worker after a backend error by @cjpais in https://github.com/cjpais/Handy/pull/2485
  - fix: say so when the microphone sends only silence by @cjpais in https://github.com/cjpais/Handy/pull/2486
  - fix: bump hf-hub so downloads survive proxies that strip Range by @johnjheejin in https://github.com/cjpais/Handy/pull/2318
  - bump transcribe.cpp by @cjpais in https://github.com/cjpais/Handy/pull/2489
  - Skip the Gamescope WSI Vulkan layer on Linux by @alanshurafa in https://github.com/cjpais/Handy/pull/2454
  - fix: find the ydotoold socket when YDOTOOL_SOCKET is not set by @alanshurafa in https://github.com/cjpais/Handy/pull/2427
  - fix: try the next paste tool when one fails on Linux by @cjpais in https://github.com/cjpais/Handy/pull/2495
  - windows: warn if in elevated window by @cjpais in https://github.com/cjpais/Handy/pull/2502
  - fix(overlay): don't steal focus when the overlay falls back to X11 by @gengurke in https://github.com/cjpais/Handy/pull/2488
  - bump handy-keys to 0.3.5 by @cjpais in https://github.com/cjpais/Handy/pull/2505
  - fix: drop a transcript that is only the custom words read back by @cjpais in https://github.com/cjpais/Handy/pull/2506
  - fix(linux): make Shift+Insert paste in terminals and default to it by @cjpais in https://github.com/cjpais/Handy/pull/2504
