ReleaseNotes: "lots of bug fixes\r\n\r\n## What's Changed\r\n• stop losing tail audio when a recording ends by @cjpais in https://github.com/cjpais/Handy/pull/1958\r\n• experimental earshot vad implementation by @cjpais in https://github.com/cjpais/Handy/pull/1967\r\n• fix(linux)：Clipboard paste methods (ctrl_v / ctrl_shift_v / shift_insert) fail on GNOME Wayland by @mrinterweb in https://github.com/cjpais/Handy/pull/1276\r\n• fix(linux)：avoid blocking on external paste scripts by @CheckPickerUpper in https://github.com/cjpais/Handy/pull/1957\r\n• fix(shortcut)：keep toggle parity when presses arrive mid-pipeline by @xilec in https://github.com/cjpais/Handy/pull/1910\r\n• Disable update checks for Nix/NixOS packaging by @xilec in https://github.com/cjpais/Handy/pull/1576\r\n• fix 'no' not showing up + add ci so shouldn't happen again by @cjpais in https://github.com/cjpais/Handy/pull/2001\r\n• auto push to talk mode by @cjpais in https://github.com/cjpais/Handy/pull/1971\r\n• preserve held Secure Input shortcuts during reconciliation by @cjpais in https://github.com/cjpais/Handy/pull/2002\r\n• launch as accessory by @cjpais in https://github.com/cjpais/Handy/pull/2003\r\n• fix：scrollbars styling on macOS when using a non-Apple mouse by @notenderdreams in https://github.com/cjpais/Handy/pull/2048\r\n• add debug ui by @cjpais in https://github.com/cjpais/Handy/pull/2052\r\n• fix： horizontal overflow in onboarding views by @notenderdreams in https://github.com/cjpais/Handy/pull/2050\r\n• fix overlay with text scaling on windows by @cjpais in https://github.com/cjpais/Handy/pull/2059\r\n• make microphone callback real-time safe by @cjpais in https://github.com/cjpais/Handy/pull/1954\r\n• docs：help users troubleshoot stale clipboard pastes by @ilya-yarets in https://github.com/cjpais/Handy/pull/2058\r\n• fix：recover gracefully when model files are deleted outside Handy by @DhruvN102 in https://github.com/cjpais/Handy/pull/1918\r\n• VK_LOADER_LAYERS_DISABLE=~implcit~ default on windows by @cjpais in https://github.com/cjpais/Handy/pull/2053\r\n• feat：make Handy available in Catalan by @jordimas in https://github.com/cjpais/Handy/pull/2065\r\n• feat：add Indonesian translation by @Yoruxyv in https://github.com/cjpais/Handy/pull/2073\r\n• fix：disable WebView2 browser accelerator keys in the main window by @cjpais in https://github.com/cjpais/Handy/pull/2060\r\n• bump to transcribe-cpp-0.2.3 by @cjpais in https://github.com/cjpais/Handy/pull/2005\r\n\r\n## New Contributors\r\n• @mrinterweb made their first contribution in https://github.com/cjpais/Handy/pull/1276\r\n• @CheckPickerUpper made their first contribution in https://github.com/cjpais/Handy/pull/1957\r\n• @notenderdreams made their first contribution in https://github.com/cjpais/Handy/pull/2048\r\n• @ilya-yarets made their first contribution in https://github.com/cjpais/Handy/pull/2058\r\n• @DhruvN102 made their first contribution in https://github.com/cjpais/Handy/pull/1918\r\n• @jordimas made their first contribution in https://github.com/cjpais/Handy/pull/2065\r\n• @Yoruxyv made their first contribution in https://github.com/cjpais/Handy/pull/2073\r\n\r\n**Full Changelog**：https://github.com/cjpais/Handy/compare/v0.9.6...v0.9.7"
