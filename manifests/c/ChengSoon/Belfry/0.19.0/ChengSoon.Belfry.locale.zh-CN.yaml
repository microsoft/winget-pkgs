ReleaseNotes: |-
  修复
  - 亮色模式终端文字发虚：实测下来是四层原因叠加，只在亮色 + 背景图开启时同时发作。逐像素量到的对比度只有 4.11:1（低于 WCAG AA 的 4.5:1），而主题前景色本应有 14.29:1——说明发虚的那些文字走的是被刻意压浅的 ANSI 色号，不是前景色。这一版从三处一起治：
    - 亮色下启用 xterm 的对比度兜底（minimumContrastRatio），把对比度不够的 ANSI 色号往深处拉一档。此前这个开关是关着的（默认值即关闭）。暗色保持关闭，配色不受影响。
    - 亮色调色板里色号 37（常被程序用来输出正文）压深到 8.21:1。
    - 亮色下正文与粗体字重各提一档，补偿灰度抗锯齿在浅底上把笔画显细的那一档。顺带修掉一个既有问题：粗体原先设的 500 在只有 Regular/Bold 两档的等宽字体上会落回 400，也就是粗体和正文渲染得一模一样。
  - 背景图衬底浓度改为亮暗各记一份：亮色默认提到 80%，让文字底下接近纯色，消掉背景图案透上来的高频噪声；暗色保持 55% 不变。旧配置里的单一数值会继承给暗色，亮色取新默认值。
  - 协作面板里的任务短 ID 在亮色下几乎看不见（最弱的一档文字色上又叠了 50% 不透明度），而它是要逐字认出来复制的。
