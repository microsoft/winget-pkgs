ReleaseNotes: |-
  新增
  - 创建房间时选择项目：可通过文件夹选择器指定房间的项目目录，创建前校验目录是否存在及类型；成员终端在所选项目中启动，切换当前工作区不会覆盖正在选择的房间项目。
  - 房间终端请求面板：在房间顶部查看成员正在等待的题目、命令上下文和选项说明，支持单选、确认、多选及文本输入；多选与文本草稿按房间、成员和请求保留。
  改进
  - 终端请求识别覆盖更多 Codex 菜单、权限确认与问题输入，保留换行说明和较长上下文；提交前重新核对目标会话与当前请求，避免重复提交或把旧答案发给新问题。
  - 小窗口中的请求面板支持展开、内部滚动和键盘操作，保留聊天与发送空间；收起、调整窗口或切换语言后仍保留输入草稿。
  - 浏览器启动与回归失败时保留更完整的诊断，完善 Windows 换行兼容、检查失败传递及浏览器测试超时报告。
  修复
  - 修复房间流程图在成员活动更新时丢失节点尺寸、节点与连线持续不可见的问题，并保留用户缩放位置。
  - 修复长需求简报溢出房间栏、遮挡任务板的问题。
  - 修复浏览器通信管道关闭后启动请求未及时失败、诊断信息丢失的问题。
  使用提示
  - 无法完整识别的请求、隐藏或过滤的多选项、截断的命令上下文仍需到终端处理；提交结果不确定时可打开终端核对，不会自动重试。
  - 提供 macOS Apple Silicon / Intel 与 Windows 安装包、自动更新资产及 SHA256SUMS.txt；安装包签名状态与上一版相同。
