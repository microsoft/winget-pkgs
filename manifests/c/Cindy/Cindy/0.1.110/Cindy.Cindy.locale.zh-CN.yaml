PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.110
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.110
  更新说明
  🎙️ 语音输入认得出你的声音
  桌面和手机新增「识别我的声音」：录入声纹后，语音输入会在本机判断是不是你本人在说，减少旁人声音被转写。声纹只存在本机，不上传也不同步。 @DavidShenXD @dashhuang
  🤝 一个伙伴，一台主力电脑
  伙伴按账号统一：每台电脑和手机看到的是同一个，Agent 只在指定的主力电脑上运行。主力电脑离线时，其他端仍可查看云端对话，并换一台电脑继续；桌面侧栏里伙伴与任务列表并存。 @dashhuang @zqchris
  💬 群聊更好认，也更好读
  表情回应直接显示前几位回应者的头像，超过三人显示数字；话题回复框可以 @ 伙伴，外观与主群统一；带图片的消息不再露出附件标记。伙伴与群聊入口合并成一个「+」，点开邀请链接即可加入。 @dashhuang @nanaco666
  🔐 分享来的供应商更可控
  分享给我的供应商多了「信任 {分享者}」开关，打开后读取密钥等敏感信息不再弹确认；分享经供应商组转给他人时，需原分享者逐个同意。供应商组选电脑改为先用快重置的配额，换电脑途中点「全部停止」会真正停下。 @DavidShenXD @MagicLizi @fmfsaisai
  🔑 凭据失效后自动恢复
  Cindy AI 凭据在服务端换发或被撤销后，后台功能、IM、定时任务等不再一直报错，会自动取得新凭据继续，也不必重启应用；Codex 在凭据轮换后同样能用上新凭据。 @GaoWeiLiuXD @fmfsaisai
  🤖 模型目录与档位更准
  新增 Google Gemini 4 Argon 的窗口、思考档位与参考价；没有推理档位的模型可以正常建任务；ChatGPT 订阅的生图通道不再受账号聊天模型限制；「收藏/全部」里分享来的 Cindy AI 会显示来源。 @MagicLizi @dashhuang @nanaco666 @xuzini-xzn
  🧩 插件设置更简单，权限更明确
  插件详情页把两块模型设置合并成一个「模型」字段，不选时跟随系统辅助模型；macOS 上的 Node 插件可以使用宿主已有的系统权限。启动时插件改为在后台加载，不再拖住进入应用。 @GaoWeiLiuXD @nothingyuancando @zqchris
  📱 手机端与远程桌面更稳
  新建任务失败后不再白屏，可看原因或带草稿返回编辑；iOS 重命名按钮不再被键盘挡住；后台刷新不再丢掉已看记录；切回 App 不再无故弹出「允许粘贴」。远程桌面连接更稳，剪贴板即时同步，手机放大能把画面拖离边缘。 @DavidShenXD @dashhuang
  ✨ 桌面端用起来更顺
  壁纸改为按需下载，安装包更小；分享为图片时会包含聊天里的图片；Linux 有了系统托盘入口；设置头像可拖动、缩放并实时预览，HDR 头像不再偏亮；远程取文件能中途取消；退出时 Codex 任务启动的命令也会结束。 @DavidShenXD @dashhuang @wztlink1013
  🔑 登录出问题也进得去
  登录服务连不上时，「跳过登录」和「返回」不再被锁住，可以离开等待、直接进入未登录状态；其他 Cindy 实例占着共享锁，也不再阻止本机登录。为 macOS 其他应用注入环境变量的问题已暂停并清理。 @MagicLizi @dashhuang @zqchris
  🧠 Agent 跑得更稳
  远程 Claude 断线后重发，模型会接着之前的对话继续，不再从零开始；协同会话可在 Codex 与 Claude Code 间切换；辅助模型思考烧光预算时会重试一次；Pi 的计划模式与 MCP 工具调用更可靠，引用历史对话会附上任务链接。 @DavidShenXD @MagicLizi @PraiseZhu @dashhuang @zqchris @zyjisdog
  💬 IM 里的回答更靠谱
  官方 bot 在群里回答「刚才聊了什么」这类问题时更准确，因为每行群历史都带上了发送时间；遇到额度或花费上限类失败时，会给出中文说明，告诉你哪个供应商、什么原因、怎么处理。 @dashhuang
  🛠️ 个人版可以存到自己的 GitHub
  Cindy Make 个人版可以保存到你自己的 GitHub，并把「更新到官方新版本、取回其他电脑的修改、上传」合成一个「同步」按钮；冲突会自动开一个合并任务处理，采纳前不会丢改动。 @MagicLizi
