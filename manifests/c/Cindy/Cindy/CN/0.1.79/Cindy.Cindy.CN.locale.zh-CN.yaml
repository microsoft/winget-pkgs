ReleaseNotes: |-
  Desktop release 0.1.79
  更新说明
  🛠️ Cindy Make 个人版制作流程
  设置里可以准备个人版源码并一键发起实现任务，右侧栏新增标签页，随时查看构建环境与源码状态。
  🖼️ GPT Image 2.5 与图像显示开关
  OpenAI 图像列表补齐 GPT Image 2.5；图像和视频型号新增显示开关，关掉后不再出现在插件里，已有账号的原清单保持不变。
  🔐 修复 Claude 订阅账号认证
  已连接的独立 Claude 订阅账号不再被占位密钥拒绝，选中该账号的任务可以正常执行。
  📊 上下文预算与用量圆环
  修复把最大上下文调小后模型返回空回复的问题；用量圆环改为始终按实际生效的预算计算。
  📜 长任务的阅读位置更稳
  向上翻阅长任务历史时不再跳回较新内容，并会提前读取更早的消息、减少等待；切回任务时变更卡片直接由缓存显示。
  🧭 伙伴入口可原位返回任务
  进入伙伴后，侧栏原「伙伴」入口就地变成「返回任务」，点一下即可回到上次的任务。
  🖥️ 远程控制提示不再重复
  被远程控制时的提示条不再同时出现两条，折叠后也不会消失。
  📱 移动端修复
  手机端点击 Markdown 里的视频链接可直接打开播放器；Android 打开远程桌面不再闪退。

