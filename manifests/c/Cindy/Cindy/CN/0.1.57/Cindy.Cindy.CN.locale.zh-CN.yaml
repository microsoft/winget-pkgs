ReleaseNotes: |-
  Desktop release 0.1.57
  更新说明
  🧩 在 Cindy 中管理 Pi 扩展
  现在可以直接在设置里安装、启用和管理 Pi 扩展，无需离开客户端。 @zqchris
  🤖 模型选择器更顺手
  修复了统一模型选择器在跨引擎切换、收藏锚点和供应商排序上的问题；Grok 4.5 的推理强度滑杆不再反向；媒体模型可按供应商选择。 @GaoWeiLiuXD @zhanxin-xu @zqchris
  📱 移动端输入更顺手
  排队消息的插话触控区域更大、更好点按；展开输入卡时语音按钮回到工具排。 @DavidShenXD @dashhuang
  📄 文档与图片预览更完整
  支持 Obsidian 风格的图片嵌入预览；修复 Windows 下缩略图导致的卡顿；格式错误的数学公式改用普通颜色显示。 @zqchris
  🗂️ 侧栏任务更好找
  侧栏任务搜索现在能搜到远程设备上的任务；任务信息可选显示 worktree 徽标；任务排序与项目手动顺序分开；置顶的计划可手动关闭。 @dashhuang
  ⌨️ Codex Micro 键盘增强
  新增 Codex Micro 键盘的启用开关与焦点窗动作，协同任务运行时对应任务键会点亮灯效。 @dashhuang
  🔐 登录与链接更安全
  邮箱登录增加安全验证；打开外部链接前会先确认。
  🔄 修复侧栏任务一直转圈的问题
  修复了某些情况下侧栏任务会一直转圈、无法恢复的问题；任务计划不会再串到其他对话；查看历史任务时终端状态正确保留。 @MagicLizi
  ✨ 交互细节打磨
  确认弹窗可拖动；连续提问的提交操作更精简；用量显示标注尚未结算的 token；设置页布局微调；供应商接入引导支持链接直达。 @DavidShenXD @MagicLizi @dashhuang

