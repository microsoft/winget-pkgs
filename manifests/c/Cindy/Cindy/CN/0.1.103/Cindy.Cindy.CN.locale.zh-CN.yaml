ReleaseNotes: |-
  Desktop release 0.1.103
  更新说明
  🧩 供应商组
  把同账号多台电脑上的同一个供应商合成一组，新建任务时自动挑一台可用电脑运行；撞上用量上限、登录失效或连不上时，会自动换到组里另一台继续。组和缓存按账号隔离，原「管理分享」页改名为「远程与分享」。 @MagicLizi
  💬 IM 后台结果自动回原对话
  由自动化或其他任务触发跑完的结果，会自动回到最初收到消息的那个聊天或话题，图片和文件一并带回。飞书、Telegram、Slack、Discord 以及从 IM 接管的任务都已覆盖。 @dashhuang
  📱 手机直连群聊
  手机上可以直接打开已加入的群聊，不再要求某台电脑在线转发。群未读数、成员头像、附件归属、@ 成员候选和断线后的恢复一并修正。 @zqchris
  🤖 伙伴群聊修复
  群里的分工安排与成员管理恢复可用，发起分工不再被已有安排挡住，暂停中的安排也能正常结束。发送失败时会说明具体原因，新成员进群不再被反复刷欢迎语，群聊认证失败也不会再反复刷新登录把界面卡住。 @zqchris
  🧠 委派与子代理
  能当场做完的小事不再被拆成后台任务，委派与子代理的内部协调不再出现在正文里，后台任务完成也只提醒一次。PI 子代理执行中可随时插话纠正、可指定某一个继续；Codex、Claude Code 和 Pi 的提问卡片口径也已统一。 @dashhuang @zqchris
  🎚️ 模型设置修复
  修复同一个模型在多个来源之间切换后，推理强度会自己变回「低档」的问题；点「恢复默认」现在会真正清掉所有来源上的旧设置。手机端自定义供应商里的 Codex 系列模型也不再被错误置灰，可以正常选中。 @klboke @zyjisdog
  🔓 手机登录更可靠
  修复 Android 上关掉浏览器后登录没反应、只能重新登录的问题，现在会继续等待授权回调，冷启动时未完成的登录也会恢复等待页与取消入口。取消过的登录重启后不会再冒出来，失败时会明确报错并可重试。 @AlusaXD
  🔌 远程 Agent、用量与分享
  用量条和任务菜单改为显示真正运行任务那台电脑账号的余量，撞上用量上限时按那台账号的重置时刻等待并自动继续，不再拿本机账号推算。分享来的自定义网关和付费供应商发送消息不再被误拦。 @MagicLizi @dashhuang
  📥 手机端消息与首页
  发完消息立刻退出或离线重启，自己刚发的消息不再消失，撤销排队中的消息也不再误报「消息不存在」。从任务页回首页不再整份重新拉取，未读与自动化角标不再残留，显示菜单也与桌面对齐；iOS 动作菜单在旧系统和 iOS 27 上都能正常显示。 @DavidShenXD @dashhuang
  🖥️ 桌面体验与图片
  切到运行中的任务时消息列表不再抖动，协同「新建 Worker」的弹窗模型列表不再点不动，辅助窗口超时也不再弹空白窗口；添加目录合并为一个入口并默认授予读写权限。模型生成的截图会持久保存，旧消息里显示「图片已丢失」的也能恢复，聊天里的 Mermaid 图表和图片恢复复制与菜单。 @MagicLizi @dashhuang @lengjingxu @zqchris @zyjisdog
  🧹 其他修复
  远程桌面断网时确认退出会立即关窗，被控端断线或超时也会按设置自动锁屏；SSH 主机密钥变化时给出核对新旧指纹的恢复流程。群邀请链接支持长期有效、可重复使用并可单独撤销，点名已失效成员时会拦住发送并保留草稿，设置页说明也重写得更直白。 @dashhuang @zqchris
