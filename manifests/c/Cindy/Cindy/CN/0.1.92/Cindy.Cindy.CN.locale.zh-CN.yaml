ReleaseNotes: |-
  Desktop release 0.1.92
  更新说明
  🤝 任务可以共享给其他人
  现在可以把一个任务共享出去，其他人用邀请登录后就能加入，和你看到同一份历史、上下文和附件，也能直接给同一个 Agent 发消息。桌面端和手机端都可以用。 @DavidShenXD
  🔗 共享任务更可靠
  邀请失效、连不上主机或手机网络异常时会说明原因，不再静默失败；断线会显示对应状态，关闭失败的任务不会被误归档，归档、删除或退出登录时也会正确结束共享；标题过长的任务也能正常开启共享。 @DavidShenXD
  🧭 共享任务的入口更清楚
  手机端首页把共享任务单独分组，不再混进本机任务里，也能看到并打开自己共享出去的任务；桌面端侧栏去掉了共享任务上不合适的右键菜单，两端的点击路径和关闭按钮位置也统一了。 @DavidShenXD
  🔍 对话里就能搜索和发布技能
  可以直接在对话中搜索、上传和更新 SkillHub 技能，发布过程沿用任务现有的审批策略，不会绕过你已有的确认。
  🧩 插件授权可以远程完成
  连接远程主机时，插件授权和受保护配置可以直接在执行端完成，凭证保存在系统安全存储里；插件市场下载的范围和失败提示做了对齐，声明了暂不支持的能力的插件也不再被直接拒绝。 @GaoWeiLiuXD @zhuoshaojian
  🤖 模型与推理档位更新
  新增 Grok 4.7、MiMo V2.6 与 Pi 支持，V2.6 进入预设推荐；Gemini 3.8 Flash 思考档位修正，不再显示用不了的推理档位，Pi 订阅账号也能发现并添加模型。 @dashhuang @zqchris
  🛠️ Cindy Make 个人版更完整
  个人版制作的生命周期做了完善，侧栏会显示当前个人版版本；个人版正在跑任务时也能切换版本，切换后原任务可以继续。 @MagicLizi
  ⚡ 冷 Pi 任务切模型不再卡顿
  有历史记录但没有在跑的 Pi 任务，原来每次切换模型都要先拉起一次完整运行时，点一下要等两秒左右；现在只有真正需要时才会做这一步，连续换模型试选也不再有明显等待。 @zyjisdog
  🖥️ 桌面端问题修复
  切换 Harness 配置后模型菜单不再自动收起；正常的日志轮询不再被误判成死循环而中断；SSH 创建 Codex 任务会按当前有效的原生路由发起；设备选择器与侧栏玻璃效果的衔接也更自然。 @DavidShenXD @MagicLizi @dashhuang
  📱 移动端问题修复
  Android 上从伙伴对话打开导航时恢复全屏显示；项目「查看全部」列表里不再混入协同任务派生的 Worker 任务。 @cofyc @zqchris
