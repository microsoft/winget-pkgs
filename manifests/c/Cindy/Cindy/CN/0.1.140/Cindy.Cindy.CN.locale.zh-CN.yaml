ReleaseNotes: |-
  Desktop release 0.1.140
  更新说明
  🧩 插件能力大更新
  插件可以把微信等 IM 消息以频道卡片转进任务，消息可带图片、音视频和文件；缺插件提示固定在输入框上方，可原地安装，插件页也会标出安装来源。 @DavidShenXD @GaoWeiLiuXD @MagicLizi @dashhuang @fmfsaisai @xuzini-xzn
  🤖 模型与账号更顺手
  新增 Open Design、iFLYTEK Astron 模型预设，重置后思考开关不再丢失；模型选择器不再显示「账号待分配」，同名模型会标出供应商。借用他机模型时本机账号仍可管理，订阅与登录更稳。 @DavidShenXD @GaoWeiLiuXD @Hariketsu @dashhuang @guyong-zapo @xd-bobo @xuzini-xzn @yan-xdt @zhuoshaojian @zqchris
  💳 礼品卡兑换上线
  桌面端和手机端都能兑换礼品卡：输入卡号或粘贴链接，先看卡面和面额再确认领取，领到即进入赠送余额；组织身份会提示仅限个人用户领取。 @xd-bobo
  ⬇️ 下载安装更省心
  下载和安装进度统一成一套界面，会显示速度和剩余时间；下载过慢时自动换连接续传，多个功能的更新下载不再长时间卡在同一个进度。 @dashhuang
  🔗 多设备同步更可靠
  断网重连、限流或目录变旧时，在线设备不会再被误移出同步名单；远程新建任务从第一帧就显示原文标题，切换任务时已发出的消息不会丢。控制 Linux 电脑时的剪贴板同步也恢复了。 @dashhuang @joei4cm @xuzini-xzn @yan-xdt @zhuoshaojian
  📱 手机端更稳更快
  弱网下新建任务不再被误切成「正在读取任务」，从分享链接进入也不会反复跳转；手机打开群聊明显更快，工具结果里的图片和音视频能正常显示，定时完成的提醒会按时送达。 @MagicLizi @dashhuang @nothingyuancando @xd-bobo @xuzini-xzn
  ⏱️ 任务续跑更可靠
  任务中断或自动续跑失败时，原来的报错会保留下来，不再被后续提示顶掉；排队中的输入、追问和后台工作会在会话清理后继续，不会悄悄丢失，维护归档后的任务顺序也不再错乱。 @DavidShenXD @lancy69 @nothingyuancando @xuzini-xzn
  🧭 浏览器与 MCP 应用更顺手
  MCP 应用卡片在侧栏里更紧凑，并支持全屏查看；浏览器插件连接失败或 Chrome 启动失败时会自动诊断和重试，侧栏里选择「关闭思考」也不会再报错。 @dashhuang @fmfsaisai @lancy69
  🎨 细节打磨
  侧栏收起时会显示伙伴头像，消息里的 PR 链接可直接加到顶栏；模型名不再被截断，文件树支持复制文件夹路径，新建任务可选由模型自动命名。群聊宽度、壁纸和 Linux 右键菜单等细节也已修复。 @DavidShenXD @MagicLizi @Simon202410 @fmfsaisai @xuzini-xzn @zhuoshaojian @zqchris
