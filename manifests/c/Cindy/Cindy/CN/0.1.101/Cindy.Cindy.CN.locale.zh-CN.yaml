ReleaseNotes: |-
  Desktop release 0.1.101
  更新说明
  🔗 供应商分享
  可以把电脑上开放远程调用的供应商分享给其他 Cindy 账号使用。分享链接 5 分钟有效、凭 4 位配对码确认；Agent 仍在你的电脑上运行，对方的文件和命令留在对方电脑，随时可暂停或收回。 @MagicLizi
  🌐 多台电脑之间的远程 Agent
  远程 Agent 现在也能选到同账号其他电脑开放的供应商，手机上新建任务同样可以；Agent 在另一台电脑上运行时，侧栏和手机任务列表会带波纹标识。远程新建菜单也补齐了附件、计划模式和插件。 @DavidShenXD @MagicLizi @dashhuang
  ⏳ 用量上限重置后自动继续
  任务撞上 5 小时或每周用量上限时，会显示会在某个时刻自动继续并可以取消；到点你还没处理就自动接着跑，不用再手动重发，手机端同步显示。 @dashhuang
  ✈️ Telegram 官方 Bot
  官方 Telegram Bot 的进度消息、成功后的最终回复、交互卡片和命令菜单改由客户端发布，表现与个人 Bot 一致；命令菜单按简体中文、英文、日文、韩文下发。 @dashhuang
  💬 IM 消息与审阅
  IM 渠道回复不再混入子任务的内容，长消息分段不再断裂；回复某条消息提问时，审阅器也能看到被回复的消息和图片。在 X 上撤回回帖的命令，现在需要主动 @ 机器人。 @dashhuang
  🤖 伙伴群聊
  伙伴群聊会显示成员进出群的系统提示，从浏览器打开邀请链接后也能继续完成入群；群内执行操作会校验权限，不再越权读取群外内容。 @zqchris
  ⏱️ 自动化与目标模式
  重启 Cindy 后，设了模型的持续任务不再每 90 秒空转，会先恢复排队状态再判断；任务正在运行时开启目标模式，也不再被上一轮的结束误判成暂停。 @GaoWeiLiuXD @dashhuang
  📱 手机端修复
  Android 设置页反复展开折叠不再留下重叠或空白，iOS 文件链接不再重复弹出操作菜单、计划模式勾号位置更整齐，旧版系统上也能正常渲染 Mermaid 图表；目标模式菜单和聊天页状态也已修正。 @DavidShenXD @WEIWEICurry
  🧹 其他修复
  预付下一期费用时，升级套餐会明确提示暂不能升级；登录页的返回按钮与登录方式悬停时不再盖住内容，输入框的悬停效果也恢复正常。 @GaoWeiLiuXD @jizhi0v0
