ReleaseNotes: |-
  Desktop release 0.1.119
  更新说明
  🧩 插件可以发布与分享
  个人账号和组织成员可以把本地插件提交审核，在「发布插件」页查看版本、上架与审核结果，提交前会先检查版本号和插件包是否完整。公开插件详情还能复制链接或分享图片，接收方打开后沿用原有安装流程。 @GaoWeiLiuXD @WZBbiao
  🤖 新模型与上下文设置
  Agnes AI 模型已加入模型目录，Flash 的上下文窗口补齐为官方 512K。上下文占用与模型压缩设置合并到同一处，切换模型时会同步压缩比例；供应商组遇到账号配额会自动换到组内其他电脑继续，不再漏切换或重复续跑。 @MagicLizi @dashhuang @fmfsaisai @qsoyq @xuzini-xzn @zhaodengfeng @zqchris
  ⏰ 自动化可以选远程模型
  自动化产生的任务可以选用其他电脑或共享的模型，保存、改脚本或远端更新后仍保留选择；例行任务可以选择运行方式，手机端也支持不足一分钟的间隔。同一自动化产生的历史任务可以在左侧导航里一次全部归档，运行中和置顶的任务会自动跳过。 @DavidShenXD @Yuewei-LL @lengjingxu @zhaodengfeng @zqchris
  🤝 伙伴与群聊更省心
  群聊头部改为显示成员数，点「回复」后输入框会直接获得焦点，部分取消时仍能停止整组任务。例行任务会使用自己独立的任务与模型设置，伙伴只在任务真正结束后提醒一次；默认模型未变时会保留已切到的备用模型。 @dashhuang @xuzini-xzn @zhaodengfeng @zqchris
  🖥️ 桌面操作更跟手
  Mac 触控板在设备模拟器里支持原生双指缩放、旋转和平移，任务列表位置也不再偏移。菜单栏面板新增「未读 / 进行中 / 今日用量」页签，灵动岛会提示群消息未读并显示易读的工具状态；视频全屏、窗口缩放和远程电脑上新建任务时选的分支也不会再被重置。 @DavidShenXD @dashhuang @ricky0603 @zcinta0514
  📱 手机端输入与附件更稳
  安卓输入法展开时，底排的发送、停止、加号等按钮现在能正常点按，不再需要先收起键盘。iOS 标签排序和左滑删除会正确保存，群聊里的文字附件可以直接预览，发送确认时列表行不再跳动，长消息的 Markdown 渲染也更快。 @Liuliuuu0710 @zqchris @zyjisdog
  📚 帮助与稳定性
  Agent 能读取产品帮助文档，浏览器自动化可按需学习网页操作并分段补读大结果。服务条款和隐私协议改用官网域名，设备名称不再显示指纹；关闭 Cindy AI 后不再后台刷新凭据，待审查的学习任务会正常计入角标，文件、历史等小问题也已修复。 @DavidShenXD @GaoWeiLiuXD @WZBbiao @dashhuang @fmfsaisai @zhaodengfeng @zqchris @zyjisdog
  💬 消息渠道发图更顺
  回复里提到的本机图片，现在会按各自的发送规则作为图片发出，飞书、Telegram、Discord 和微信都能收到；伙伴在回复中生成的图片也会作为群附件发出。飞书进度卡会原位更新为最终回复，Telegram 长消息和 Discord 配置提示的问题也已修复。 @Liuliuuu0710 @dashhuang @xuzini-xzn @zhaodengfeng
  🎙️ 语音输入不再一直占着麦克风
  开启快速启动后，切换任务或输入框重新加载不会再自动打开麦克风，待命窗口按最后一次真实使用计时，到期即释放。普通点击输入框不会提前开始录音，提问卡里的语音操作也更跟手。 @dashhuang @lengjingxu
