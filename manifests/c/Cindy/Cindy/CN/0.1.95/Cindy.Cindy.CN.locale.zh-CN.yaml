ReleaseNotes: |-
  Desktop release 0.1.95
  更新说明
  🔗 共享任务邀请链接
  共享任务改用邀请链接：房主复制带任务名的邀请消息，伙伴点开就能加入，不必再手填邀请码。手机端启动或切回前台会自动识别剪贴板里的邀请，设置里可统一管理自己发起和加入的共享。 @DavidShenXD
  🤝 手机端群聊
  伙伴群聊在手机上也能用了：查看群聊、发言、@ 伙伴安排分工，某一步停下时提醒会推到手机，点开直接进入该群。群规则仍由电脑判断，项目目录只显示文件夹名。 @zqchris
  🎙️ 长按输入框语音输入
  语音设置新增「长按输入框语音输入」开关：打开后在输入框按住左键约 0.6 秒开始说话，松开结束并把识别结果填回输入框，单击和拖拽不会误触。 @MagicLizi
  💬 伙伴任务与群聊修正
  伙伴继续已结束的任务时不再反复堆叠旧目标导致内容被截断，任务压缩上下文后也能继续补充输入。群聊的连接提示改到输入框上方并可折叠，伙伴执行结果的入口恢复成任务卡样式。 @zqchris
  🧭 侧栏标签与未读提示
  任务标签改为紧跟标题常显，不再需要手动开启，鼠标悬停时标签色球也不再变大。伙伴入口和「返回任务」会显示待关注的数量，打开列表不会清空未读。 @dashhuang @zqchris
  🖧 跨电脑协同
  桌面远控默认申请操作权，去掉了「仅查看」；控制端发送远端队列里的附件不再失败。跨电脑复制任务的弹窗会显示文件数量与传输进度，安全面板的开关标题排版也已统一。 @DavidShenXD @dashhuang
  🛠️ Windows 上的 Review
  修复本机 Review 无法启动的问题，Windows 上也能正常发起代码评审，xAI 供应商同样支持；Windows 需要 Codex 0.156.0 及以上版本。 @DavidShenXD
  🔌 模型连接与问答卡
  使用 OpenCode Go 时，辅助模型调用、图片识别和「测试连接」不再报错。问答卡里模型自带的「其他（回复说明）」换成宿主的「输入其他回答…」入口，不会再点了没反应。 @zyjisdog
  🧰 桌面稳定性修复
  折叠侧栏后终端输出不再被压坏；发送消息后气泡不再消失一下再出现。本机 Pi 会话在 Windows 上不再多派生一个控制台进程。 @MagicLizi @nothingyuancando
  📱 手机端修复
  中国大陆版 iPhone 恢复微信登录，首页切换设备后标题保持居中。安卓修复了首页与分享长图两处崩溃，从 Google Play 安装的版本不再被提示下载官网安装包，登录页也不再白屏。 @DavidShenXD @nothingyuancando
  🖥️ 内置 iOS 模拟器
  内置 iOS 模拟器修好了在 Xcode 26.6 下的点击失灵，原生画面默认改为 30 FPS 原尺寸。 @horizon554
