ReleaseNotes: |-
  Desktop release 0.1.60
  更新说明
  🖥️ 本地模型自托管
  现在可在本机托管 Ollama、LM Studio 等本地模型，并用于对话与 Agent；下载支持并行与断点续传（Beta）。 @dashhuang
  📊 用量历史与更准的计价
  设置里新增「用量历史」，按周、日、模型和任务查看本机 token 消耗与缓存命中率；同时修正了用量计价口径，运行中会显示生成速度。 @AwakeyDonkey @dashhuang
  🧩 插件可自助发布与主视图
  企业成员现在可以直接发布插件到组织市场；插件还能声明一级主视图，并支持插件执行时自动切到对应任务。 @Evol1213 @fmfsaisai @zqchris
  🤝 Subagent 详情与辅助模型
  Subagent 详情页重做为主会话式对话，任务与子对话更紧凑易读；还可以为辅助任务单独指定模型，并防止子 Agent 擅自弹出问答卡。 @Battleplus @DavidShenXD @dashhuang @zqchris
  📱 手机端任务搜索与侧栏对齐
  手机端现在能像桌面一样远程搜索任务并按状态、项目、Agent 筛选；侧栏任务列表与项目顺序对齐桌面，消息分享交互也更顺手。 @dashhuang @hushaowu-rh @nanaco666 @nothingyuancando @tiammomo
  🤖 模型与供应商更稳定
  修复了 Grok 4.6 协议与凭证路由、LiteLLM 网关 401 与流中断报错、第三方 Responses Provider 丢失 Codex 执行等问题，切换引擎与模型选择也更稳。 @Battleplus @GaoWeiLiuXD @dashhuang @lizzjin @smonkes @tiammomo @zqchris
  🎙️ 听错词词典更好用
  语音输入的听错词现在可以直接编辑并同步到各设备；修复了词典首次加载为空、同步偶发丢失的问题。 @dashhuang
  🔀 移动任务更可靠
  修复了移动任务后继续使用旧工作目录、移动中锁死、计划草稿残留等问题；设备连接的中断恢复与自锁也更稳妥。 @nothingyuancando @zqchris
  ✨ 桌面与输入体验
  新增 Xbox 手柄支持、组织 SSO 登录记忆与 Linux 应用内更新（并修复 Linux 启动白屏）；计划进度直接显示在对话里，飞书 Bot 提问卡支持多题多选。 @Battleplus @MagicLizi @dashhuang @kafeifei @klboke
