ReleaseNotes: |-
  Desktop release 0.1.66
  更新说明
  💬 聊天体验更顺滑
  发送消息后立即跳回最新一条；流式输出时「本轮生成的文件」卡片不再抖动整页；模型偶尔漏出的多余结束标记也不再显示成气泡。 @dashhuang
  ⚡ 大库更轻快，存储占用更小
  侧栏任务列表加载从数秒降到几十毫秒，超大任务显示「1000+ 条消息」；归档任务后自动释放大型工具输出，减小本地数据库占用。 @DavidShenXD @dashhuang
  🔎 Review 更可靠，授权与中断更清晰
  桌面端只在执行 /review 时按需恢复，不再每次启动扫描历史；成果授权改为应用内确认，运行中可随时停止，审查结果在任务变化后标记为过期并保留。 @DavidShenXD
  🧠 Agent 任务执行更稳
  已结束的任务不再让后续消息卡住，继续发送或交接都能正常进行；缺少输出上限的模型不再被提前截断长输出；手动中止的回复不会被自动重试，停止更可靠。 @DavidShenXD @zqchris
  🔌 Slack / Telegram / X 目录偏好掉线也能改
  工作目录的 agent、模型等偏好改由本机保存，掉线时不再显示错误的默认值，仍可查看和修改；重连后自动同步。 @dashhuang
  🎨 Art 生成可选用更多模型
  连接 xAI 账号后，Art 里可选择 Grok 图片和视频模型；图片格式不支持时也会给出更清晰的提示。 @zqchris
  🛠️ 设置与问题反馈更清楚
  用量历史里超长的模型名和 agent 名不再撑破表格，悬停可看全名；提交问题反馈时自动带上运行框架与模型信息，方便复现。 @FIERsity @MagicLizi
