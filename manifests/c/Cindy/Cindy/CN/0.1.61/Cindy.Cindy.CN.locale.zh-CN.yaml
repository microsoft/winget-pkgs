ReleaseNotes: |-
  Desktop release 0.1.61
  更新说明
  🤖 辅助模型可单独配置
  现在可以为辅助任务单独指定模型，主对话与辅助任务各自运行、互不干扰。 @DavidShenXD
  🧩 插件生态：持久库与主视图
  插件新增可自定义位置的持久作品库，支持随时迁移与独立删除；插件还能声明一级主视图，创建引导与 Pi 扩展管理也更完整。 @DavidShenXD @Evol1213 @MagicLizi @dashhuang
  📱 手机端更新与触控更顺手
  强制更新改为阻断式提示、避免被误关，更新检查只在同意隐私政策后才发起；排队消息的插话触控区域更大，语音按钮位置也已修复。 @DavidShenXD @dashhuang
  🔐 登录更安全、更少打扰
  邮箱验证码登录新增人机验证；同账号令牌续期不再把主界面踢回登录页，供应商接入支持从设置直达配置。 @dashhuang
  🐧 Linux 启动与更新更稳
  Linux 上 Agent 组件改为优先从 CDN 获取、官方源兜底，修复启动白屏；非 xd 企业也能按需开启 beta 功能。
  🗂️ 任务与侧栏更好用
  侧栏任务搜索现在覆盖远程会话，任务排序与项目顺序分开设置；可显示 worktree 徽标、置顶计划可手动关闭，本机设备名也更易读。 @dashhuang
  🧠 Agent 协作更稳定
  子 Agent 不再擅自弹出问答卡，Orca 协作与模型预检更可靠；修复侧栏一直转圈、历史终端状态丢失等问题，任务计划也始终留在对话内。 @DavidShenXD @MagicLizi @dashhuang
  🎛️ 模型选择与供应商修复
  模型选择器修复跨引擎切换误判、收藏锚点丢失与面板跳动，供应商拖动排序生效；Grok 4.5 思考深度滑杆方向已修正，媒体生成也能按供应商选择模型。
  ✨ 内容与体验打磨
  支持 Obsidian wiki 链接图片预览；修复 XD 图片丢失、Windows 缩略图阻塞、Discord 消息丢失等问题，设置里新增图片缓存目录入口。 @Battleplus @DavidShenXD @MagicLizi @nothingyuancando
