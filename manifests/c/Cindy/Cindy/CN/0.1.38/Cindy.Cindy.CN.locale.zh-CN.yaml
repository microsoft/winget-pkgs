ReleaseNotes: |-
  Desktop release 0.1.38
  更新说明
  📡 远程连接更稳定
  修复了手机端频繁出现「电脑端未响应」的问题；事件流改为微批聚合，出站帧数降低近 50 倍；断连后不再循环重连；冷启动后远程连接自动恢复。 @dashhuang @painfulChen
  🤖 Agent 对话体验
  取消对话不再卡住；fork 长对话不再连带中断其它活跃任务；命令自动放行率提升至 20%，确认弹窗大幅减少；并行 MCP 工具不再串台；Codex 断线自动恢复上下文；纯思考回合不再静默卡死。 @MagicLizi @dashhuang @kafeifei @mengfanyu9410-hub @zqchris
  💬 Telegram Bot
  开机后不再回复隔夜积压消息；相册网络异常时不再重复推送图片；开启「禁止保存内容」的群消息不再被记录和检索；群历史改按存储大小保留，活跃群可存数年；收到消息时补上确认表情。 @zqchris
  📊 用量统计
  新增每轮响应速度与耗时显示，可直观对比不同模型的响应表现。 @zqchris
  🖥️ 桌面端打磨
  任务可拖拽到输入框引用；面板布局支持恢复默认；对话分组新建任务继承远程机器；ChatGPT 失效后可重新登录；设置页版式对齐；升级后插件数据正常保留；畸形媒体链接不再异常。 @dashhuang @kirozeng @mengfanyu9410-hub @nanaco666 @tiammomo @zqchris
