ReleaseNotes: |-
  Desktop release 0.1.143
  更新说明
  🧩 插件引擎与扩展能力
  插件现在可以作为独立执行引擎接入，在任务中切换引擎、查看权限菜单里的引擎模式，移动端、自动化和协作分工也能用；缺失插件可直接在任务内安装，授权插件还能调用 Cindy AI 生图、生视频与语音能力。 @GaoWeiLiuXD @MagicLizi @dashhuang @xuzini-xzn
  💳 计费与礼品卡
  新增购买礼品卡：可选面额（含自定义）、数量和署名留言，买完可逐张复制领取链接或兑换码、发送到指定邮箱，并在「我买的礼品卡」里查看领取与退款状态；月付额度滚存的套餐说明和赠送明细分页也已更新。 @GaoWeiLiuXD @xd-bobo
  🤖 模型连接与生图
  新增统一的 Google Gemini 连接，聊天与生图共用；供应商组可按文生图模型选路，也能用共享的 OpenAI 订阅生图。刷新模型列表会提示并确认清理上游已下线的模型，图片能力识别也更准确。 @DavidShenXD @GaoWeiLiuXD @guyong-zapo @midasism @xuzini-xzn @zqchris
  🧠 模型组自动接替
  模型组的首选模型不可用时，会自动接替到组内下一个可用模型，并保留会话与推理设置；Codex 任务启动失败或中途断开后的恢复也更可靠，不再留下错误的清理状态。 @DavidShenXD @MagicLizi @xuzini-xzn @zqchris
  📱 手机端更顺手
  侧边栏可直接查看套餐余量和 Token 用量，用量概览里有添加桌面小组件的分步指引；更多菜单可切换任务列表和收件箱，灵动岛在到期或显示器断开时会正确收敛，iOS 分享与长权限说明的显示也已修复。 @DavidShenXD @dashhuang
  🖥️ 桌面交互与动效
  截图时可按空格选中鼠标所在窗口；发送与停止按钮统一动效并在 AI 工作时发光，录音按钮随声音起伏；可拖出伙伴和群聊、从图片右键下载到本地，速度图显示每次请求的推理量与占比，排队与插话提示移到发送键上。 @DavidShenXD @dashhuang @fmfsaisai @xuzini-xzn
  🗂️ 任务、收件箱与项目
  收件箱支持无限期稍后处理，并与普通任务列表分开筛选；项目菜单统一，项目可安全删除。群任务、插件和伙伴任务不再自动生成新项目，群聊、IM 与委托任务标题统一，PR 跟进失败会显示设备、原因与重试时间。 @DavidShenXD @dashhuang @xuzini-xzn @zqchris
  💬 群聊与消息渠道
  群里直接 @ 两位伙伴就能协作同一条请求，也可以只找一位伙伴安排分工，还能跟随同事分享的任务；微信延迟回复会带上原对话上下文，Telegram、Discord 与 iMessage 等连接也更稳定。 @dashhuang @fmfsaisai @xuzini-xzn @zqchris
  🔗 多设备与远程连接
  手机发送前、断线重连后会自动恢复设备链接，远程分享的电脑在分享者暂时掉线时仍可接单，任务重试时尽量回到原执行机；设备拓扑与卡片上会显示实际使用的传输协议。 @DavidShenXD @GaoWeiLiuXD @MagicLizi @dashhuang @guyong-zapo
  🛡️ 稳定性与本地数据
  本地数据库损坏时会先隔离并给出恢复入口，共享凭证连不上时可直接重连。Host 启动失败会说明原因，而不是显示普通登录页；还修复了日志落盘、输入框列表续号、语言保存、隐私屏、壁纸与自动化设置等桌面问题。 @WZBbiao @dashhuang @fmfsaisai @xuzini-xzn
