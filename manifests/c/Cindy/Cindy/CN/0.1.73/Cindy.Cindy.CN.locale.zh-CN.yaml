ReleaseNotes: |-
  Desktop release 0.1.73
  更新说明
  🧩 技能中心接入新版 SkillHub
  技能中心现在接入新版 SkillHub：公开、组织和本地技能分开浏览，搜索与发布、审核流程更完整。
  🤖 Codex / Claude Code 更可靠
  内置的 Codex 与 Claude Code 升级到新版，并保留本地已更新的版本、不再被静默降级；会话复制更快，传输中断或远端失败时会在同一任务内自动继续。Claude Code 子代理和自定义服务商也能用上你配置的模型能力。 @Battleplus @DavidShenXD @MagicLizi @dashhuang @fmfsaisai @wpr317694-del @zqchris
  🤝 协同不再丢历史
  协同任务在重新召集、断线或传输中断后，之前的对话与协作内容会完整保留，不再丢失上下文。 @MagicLizi @fico-hub
  📱 移动端消息更流畅稳定
  移动端加载更早消息不再抖动或空白，长任务持续输出和首页更新也更流畅、更省资源。 @DavidShenXD @MagicLizi
  🎙️ Windows 语音输入更快更稳
  Windows 语音输入启动与提交更快；麦克风权限被系统收回时，会直接引导你重新授权，不再反复报错。 @dashhuang
  ⌨️ Creator Micro 2 与 Codex 键盘更自由
  Codex / Creator Micro 2 同板支持把任意按键设为任务键或动作键，相邻按键可合成宽键，断开或出错后也能自动恢复键位。 @dashhuang
  🐧 Linux 桌面体验增强
  Linux 关闭主窗口时可选择最小化还是退出，并可在设置里修改；Linux x64 现已支持 Beta 更新通道。 @DavidShenXD
  ⚙️ Pi 与自定义模型接入更稳
  Pi 接入不认识的 OpenAI 兼容端点时，默认改用各端点都支持的指令格式，不再因参数不被接受而报错；部分自定义模型现在也能开启 Fast 模式。 @fico-hub @xujun0915
  💳 订单可直接申请开票
  桌面端支付成功的订单现在可以直接申请开票：查看订单信息、一键复制客服邮箱，邮件会按订单自动填好主题与正文。 @nanaco666
