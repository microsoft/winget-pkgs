ReleaseNotes: |-
  Desktop release 0.1.94
  更新说明
  🤝 伙伴群聊、导入与记忆
  可以把 2–6 位伙伴拉进群，指定负责人后按安排一步步分工；Hermes / OpenClaw 里已有的 Agent 可连凭证与自动化一起导入；伙伴记忆在电脑和手机上都能查看、编辑、删除。 @claude @dashhuang @zqchris
  📱 手机端协同模式
  协同任务在手机上不再只读，可以发消息、处理确认、编辑队列，也能开启协同、创建和管理 Worker；派活与回报卡片默认收起，点标题才展开。手机端不再提供自动化管理与例行任务入口。 @dashhuang @fmfsaisai
  🎨 手机端外观与操作
  设置里新增显示模式，可跟随系统或固定浅色、深色；浅色换成更亮的象牙白，深色改为中性近黑，文字的字号、字重与行高统一重排；安卓的入口、菜单与交互全面对齐 iOS。 @dashhuang @kirozeng
  ✏️ 图片标注与查看
  图片标注与电脑端共用同一套效果，圈选的位置会一并告诉模型；Mac 上查看图片可双指捏合缩放、滑动平移，滚轮与触控板行为各平台一致；误触、崩溃与重试失败等问题一并修好。 @dashhuang
  🎙️ 语音输入更顺畅
  语音点下即开始录音，停顿几秒就提前出字，结束后按钮不再闪烁；断线重连后末尾一句会重新校正；遇到账户限流会明确提示稍后重试，不再白等或反复切换渠道。 @dashhuang
  📊 用量与订阅余量更清楚
  用量历史默认合并所有电脑，也能切到某一台单独查看，柱图提示排版更清楚；任务运行速度可点开看曲线、平均值与峰值；远程连接时同样显示被控电脑的订阅余量。 @dashhuang
  🧩 新模型与插件权限
  新增 GPT-6 Sol、Luna 与 Opus 5.5，Grok 4.7 可按账号开启 Fast 档，添加供应商时可选 Sub2API；订阅模型只列出账号真实可用的型号并按账号顺序排列。安装插件或插件权限变多时会先请你确认。 @MagicLizi @PraiseZhu @dashhuang @zqchris
  🖥️ 桌面操作更顺手
  排队中的消息可以直接在输入框里改完再发；任务可以在本机移动，也能复制到另一台电脑；后台任务卡显示已运行多久，展开可看最近输出；设置里能搜索并直接跳到具体项，关于页可检查并更新 Claude Code 与 Codex。 @DavidShenXD @MagicLizi @dashhuang @kirozeng @zqchris
  🔗 连接与恢复更稳定
  弱网、断线与换网络后，跨设备传文件、看附件和收消息更快也更不容易丢；旧任务恢复后能重新使用日程工具；定时任务在夏令时切换当天不再重复触发或漏跑；长回复中途缺字、网页预览失败等问题也已修复。 @DavidShenXD @MagicLizi @billythegod @cofyc @dashhuang @fmfsaisai @mp55 @zqchris @zyjisdog
