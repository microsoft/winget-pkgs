ReleaseNotes: |-
  Desktop release 0.1.141
  更新说明
  🗂️ 项目管理焕新
  新建项目、修改设置和授权目录共用一套表单，桌面和手机一致；可以从 Git 仓库链接直接创建项目，按仓库说明识别项目图标，首次建项目还会先看到简短介绍。 @dashhuang
  📥 任务收件箱上线
  桌面和手机新增任务收件箱，把需要你处理的跟进与协办任务集中起来，可按项目查看、稍后处理，点「完成」即归档；侧栏新增收件箱开关，首次开启时会介绍用法。 @dashhuang @xuzini-xzn
  ⚙️ 自动化运行更清晰
  自动化运行可以集中收进「自动化」分组，不再散落在各个项目里；普通自动化支持按单个 PR 触发，定时检查持续跟进，授权失效或续跑失败会说明原因并保留恢复结果。 @DavidShenXD @dashhuang @yan-xdt
  🤝 多智能体协作更可靠
  Lead 有了自己的 Worker 运行时工具和更清晰的限制，可以给已停止的 Worker 更换模型；空闲回收不再中断后台工作，异常结束的 Worker 会自动续接，错误与清理失败会保留并重试。 @DavidShenXD @dashhuang @yan-xdt
  🧩 插件安装与能力升级
  插件可从 GitHub Releases 安装和升级，市场安装和更新会显示进度与失败原因；共享任务可暂停、恢复和重试，IM 插件在本地模式下也能设置共享项目和对话模型，Pi 包技能会出现在斜杠补全里。 @DavidShenXD @GaoWeiLiuXD @MagicLizi @dashhuang @xd-bobo
  💬 飞书提问与群聊更顺手
  官方飞书提问改为一题一张卡，答完自动收成回执，必答题没答会直接点名；相对路径图片和超大图片能正常发送，群聊话题回复可在侧栏定位，云端伙伴的名册与接管提示更可靠。 @DavidShenXD @MagicLizi @xd-bobo @xuzini-xzn @yan-xdt
  🔗 多设备连接更稳
  手机加入新的 Agent-Net 会话层，拓扑里能看到实际连接路径和延迟；弱网下远程连接更稳、报错更易懂，远程新建任务超时不再留下空任务，远程桌面和邮件卡也能正常使用。 @DavidShenXD @MagicLizi @dashhuang @joei4cm @xd-bobo @xuzini-xzn @yan-xdt
  🤖 模型、用量与账号
  新任务默认使用 GPT-6.2 Sol，辅助模型 Token 也计入用量，余额页新增用量入口；兑换礼品卡后可用模型立即刷新，其他电脑使用本机模型的条件收拢为一个开关，分享账号额度耗尽会自动交接。 @DavidShenXD @MagicLizi @dashhuang @fmfsaisai @joei4cm @xd-bobo @xuzini-xzn
  🖥️ 桌面组件与输入体验
  Mac 桌面小组件改由电脑端直接更新，Windows 托盘新增额度与任务悬浮卡片；输入框的引用、列表层级和 macOS 行首行尾快捷键更顺手，大数字顿号行不再被误当成列表。 @DavidShenXD @dashhuang @kirozeng @nocmk2
  📱 手机端更顺手
  Duo 竖屏任务页标题不再压住右侧按钮，发送消息后输入框自动收起并收起键盘；相册视频和超大媒体文件的播放、保存更稳，等待电脑连接时的发送与卡片操作也恢复正常。 @dashhuang @patrick-zhao-51 @xd-bobo @xuzini-xzn
