ReleaseNotes: |-
  Desktop release 0.1.88
  更新说明
  🧩 内置官方 Skill 上线
  桌面端新增两个官方 Skill：「Skill 创建器」直接创建、更新 Skill，「学习」把任务或 SkillHub 技能蒸馏成可复用 Skill。两者可启停、不可卸载并优先显示；同名第三方 Skill 不会被误认成官方。 @xd-bobo
  🏷️ 任务标签
  任务现在可以打标签，桌面、手机、远程连接和 AI 工具共用同一套标签目录；支持新建、改名、换色、拖动排序和删除，菜单与任务标题都会显示标签。升级后标签默认开启，你主动关掉后不会再被自动打开。 @dashhuang
  🖥️ 远程桌面更安全
  手机控制电脑时新增防窥屏、被控电脑静音和双向剪贴板同步，文字、图片和富文本可直接互传。桌面控制端补齐剪贴板、安全与凭证能力；Linux 与 Omarchy 电脑也能作为被控端，锁屏时自动挡下剪贴板与窗口操作。 @dashhuang
  📱 手机端更原生
  手机的任务页、新建任务与搜索改用原生导航和半屏面板，输入框可拖动收拢，图片粘贴和缩略图添加恢复。远程桌面改为原生接收、后台画中画继续播放；iOS 可把文件和图片分享进新任务，Android 能在应用内下载安装更新。 @DavidShenXD @dashhuang @zqchris
  🤝 伙伴协作
  桌面伙伴列表在名字下常显在线状态和设备名，多台设备上的同名伙伴一眼可辨。伙伴发起的独立任务执行结束后仍留在任务列表，补充要求会接着原历史继续；重启后首次进入伙伴不再自动选中 Cindy。 @zqchris
  🤖 模型与 Agent
  Codex 任务在切换 Harness、断网重连和压缩上下文时不再无谓重建线程，工具环境刷新后新启动的任务也能正常调用工具。供应商请求失败会带上真实的 HTTP 状态和分类，不再只有一句笼统提示。 @dashhuang
  🎨 界面与设置
  桌面分段控件统一成一套样式，搜索命中的高亮在各主题下更清楚；侧栏把运行与未读提示补到设备段、对话组和项目行，收起后显示汇总状态点，切换任务也不再闪消息或跳动。「存储空间」里可选对话工作区的存放位置。 @DavidShenXD @MagicLizi @dashhuang @kirozeng
  🛠️ Cindy Make
  Cindy Make 会展示构建进度和历史操作，版本概览把当前版本与源码差距合并成一张卡。制作任务结束后会清理 Windows 上的残留目录和已合入的临时分支，历史状态与清理入口也统一了。 @MagicLizi
  💳 计费与账号
  套餐选择与升降级改为横向权益对比，支付确认页并列显示渠道和价格，余额与订单记录对齐。登录页移除了与协议行重叠的「切换账号」入口，账号切换统一走头像菜单；清单服务不可达时可通过备源或本地缓存登录。 @dashhuang @kirozeng
  🧯 问题修复
  修复了工作树回收反复失败、失败后无限重试、目录探测超时被误报为缺失、并行子代理卡死、大图生成后无法保存等问题。Windows 更新失败后新增手动「重试」，安装包的自定义包含路径也已修好。 @DavidShenXD @MagicLizi @dashhuang @guyong-zapo @zqchris @zyjisdog
