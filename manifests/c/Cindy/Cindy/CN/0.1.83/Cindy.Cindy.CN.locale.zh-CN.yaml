ReleaseNotes: |-
  Desktop release 0.1.83
  更新说明
  🔐 用企业邮箱登录时会识别企业并引导区域
  用企业邮箱登录时会自动识别邮箱所属企业；如果企业位于另一个区域，会提示你切换到对应区域，或继续用个人账号登录。 @xd-bobo
  💳 模型列表显示账号来源与订阅余量
  模型列表会标出每个模型来自哪个账号，并显示订阅额度还剩多少；额度不足时会提前提示。 @dashhuang
  📱 手机端远程任务空态与任务推荐
  手机端连接电脑后，没有任务时会显示空态引导，并推荐少量可以继续的任务；断开连接或连接异常时不会显示推荐。 @dashhuang
  🖥️ Pi 任务直接加载项目里的 Skill、提示词与扩展
  本地 Pi 任务现在会直接读取项目仓库中的 Skill、提示词模板和扩展，斜杠命令面板也会列出这些项目命令；Windows 上启动参数过长时会直接报错，不再静默失败。 @zqchris
  📝 提交问题反馈时可附带脱敏后的相关日志
  通过 /issue 提交问题反馈时，可以一并附上脱敏后的相关运行日志，帮助更快定位问题；这些日志只会在你确认后才采集。 @MagicLizi
  🐦 飞书通知话题里的回复会继续原任务
  此前飞书机器人发出通知后，在通知话题里回复会跳到渠道默认任务、丢掉上下文；现在会继续原任务并把结果发回同一话题。原任务已失效时会明确提示，不再另建任务。 @GaoWeiLiuXD
  🧩 只有手册、没有工具的插件也能被发现和读取
  此前只有使用手册、没有声明工具的插件会被完全隐藏，手册也读不到；现在这类插件能被正常发现并按需读取手册。iOS 模拟器在官方手册发布前仍沿用原有的查看器流程。 @horizon554
  🌐 远程控制端闲置时不再持续占用被控端
  远程控制端闲置时会停止周期性全量对账，不再反复读取被控端的数据库；后台读取会给写入让路，本机操作和远程消息不再被拖慢。 @zqchris
  🔔 系统角标不再统计远程和自动化任务
  应用图标上的角标此前会把远程任务和自动化运行也算进去；现在只统计本机任务，手动设置的提醒仍会正常计入。 @MagicLizi
  🪟 桌面端几处显示与文案修复
  侧栏菜单选项文案更精简、任务状态图标更易区分；文件树在窄面板里深层目录不再被挤没，长文件名可以横向滚动完整查看；审查面板的文件卡片不再互相压叠。 @dashhuang @ttmouse @zyjisdog
