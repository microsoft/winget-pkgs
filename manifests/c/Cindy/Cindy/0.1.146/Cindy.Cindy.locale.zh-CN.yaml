PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.146
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.146
  更新说明
  🤖 模型组自动换来源更聪明
  出错时自动换来源现在按报错类型处理：来源本身的问题立刻切换，临时故障先在同一来源重试两次。设置页可按每个模式单独开关，续跑时会写明从哪个来源换到哪个、为什么。 @amanayayatu-tech @nanaco666 @xuzini-xzn @yan-xdt @zqchris
  🧩 插件引擎与插件市场
  官方模型插件可直接在供应商选择器里看到并配置，Antigravity 等插件模型有了高级设置，供应商菜单新增卸载入口；插件可显示任务进度、在指定电脑打开会话或文件类型，市场图标与安装来源说明也更稳。 @GaoWeiLiuXD @MagicLizi @amanayayatu-tech @dashhuang @nanaco666 @xuzini-xzn @zqchris
  🎙️ 伙伴实时语音通话
  伙伴现在可以用 OpenAI 或百炼的自己的密钥（BYOK）进行实时语音通话。 @horizon554
  💬 伙伴 IM 与消息更顺
  伙伴 IM 连接改为并行启动，Telegram 握手限时 15 秒，超时保留输入并提示重试；首次连接显示「连接中」，不再误判主力电脑离线。iMessage 忙时消息可补进当前轮，飞书引用与 MR 跟进更完整。 @DavidShenXD @amanayayatu-tech @dashhuang @elfcv @nanaco666 @xuzini-xzn @zqchris
  🦾 任务与多 Agent 更可靠
  已启动任务旁显示实时状态；Orca 的 Lead、Worker 支持模型组，Worker 从最新 main 启动并保留本地分支，失败可手动继续。发送前检查与运行中删消息会说明原因和重试方式，跨设备可恢复工作树。 @DavidShenXD @StarDuster @amanayayatu-tech @dashhuang @elfcv @xuzini-xzn @yan-xdt
  📱 手机端更顺手
  大屏竖屏任务页改用单个悬浮列表按钮，任务内下钻的返回导航统一了，从消息链接打开任务后右滑可回原任务。短暂切后台不断开局域网连接，聊天里的 MCP 应用保持存活，Android 图片保存保留原格式。 @DavidShenXD @amanayayatu-tech @dashhuang @zqchris
  🖥️ 桌面体验与 Windows 打磨
  外观设置新增宽屏聊天宽度滑杆，低档逐级生效，对话布局术语统一并可恢复默认。Agent 导出任务可存到固定目录，Windows 托盘卡片新增开关，HDR 截图不再偏亮，项目选择器支持方向键与回车。 @DavidShenXD @MagicLizi @amanayayatu-tech @dashhuang @elfcv @hzpeng57 @nanaco666 @xuzini-xzn @zyjisdog
  🔗 连接、设备与远程更稳
  远程会话现可归档并回读回合状态，断线重连后共享来源探测和代理、中继连接更可靠，阻塞的设备连接也能独立恢复。SSH 隧道在主机密钥被拒后停止重试，浏览器标签页超时会给出恢复指引。 @DavidShenXD @amanayayatu-tech @dashhuang @elfcv @xuzini-xzn @yan-xdt @zqchris
  🔒 隐私、权限与细节
  手动上传日志改为单独的明确授权，与崩溃偏好隔离，日志诊断不再包含代理信息，反馈会带上 macOS 产品版本。macOS 27.3 只允许部分 App 被控制时，电脑操控和远程桌面会给出准确提示。 @amanayayatu-tech @dashhuang @xuzini-xzn
