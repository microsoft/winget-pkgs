PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.97
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.97
  更新说明
  🧠 本机模型
  可以在 Cindy 里直接安装 llama.cpp 运行环境并下载模型，首次使用自动启动，下载可暂停、继续与取消；Flash-Next 默认 256K 上下文，可开到 100 万 tokens。 @dashhuang
  🖼️ 桌面壁纸
  设置里新增壁纸：内置三款 Cindy 插画场景，每款可选静态或动态，动态画面已随客户端内置、断网也能播放；也可以用自己的图片，并调节蒙层深浅保证文字清晰。 @DavidShenXD
  🧑‍💻 伙伴工作台
  桌面伙伴对话的右侧栏新增「工作台」，可以把本机项目交给伙伴。它会先读项目文档、分支与近期提交，把没做完的事按「等你 / 在做 / 待做 / 做完」列出并给出下一步，点「跟进」就继续干活。 @billythegod @zqchris
  🤖 伙伴更独立
  伙伴可以单独指定任务模型，不再借用别的 Agent 的草稿模型；主任务也用上与普通任务相同的完整能力，按这一轮由谁触发分档放行。新老伙伴默认继承已启用的工具与 MCP，也可在设置里取消。 @zqchris
  🧩 插件下载与授权
  插件下载大文件时会显示进度，可以随时取消、断网后续传，单文件上限提升到 8 GiB。拒绝一次权限后不再反复弹窗；插件创建的任务会使用正确的模型，并默认逐次询问权限。 @dashhuang @zqchris
  🛠️ 技能与 Agent 浏览器
  预装与插件技能改由 Cindy 私有目录管理，不再往你自己的技能目录里写文件，升级后自动迁移、无需重装。Agent 浏览器沿用系统登录态时不再清空已装扩展；技能发布失败会给出具体原因和处理建议。 @DavidShenXD @dashhuang
  📦 跨电脑复制任务
  把任务复制到另一台电脑不再被整份拒绝：失效的媒体引用、项目外的软链接、正在运行的工作树都只会跳过个别条目，并在完成时列出。失败会说明原因和出错文件；取消立刻生效、可转后台继续，传输也更快。 @dashhuang
  🖥️ 远程桌面与远程连接
  远程桌面画质改为「自动 / 省流 / 高清」三档，静止画面不再发糊，手机双指缩放上限提高到原始像素 2 倍。远端繁忙时会明确提示并可重试；被控端也能直接发起 /review，截图交付到手机更可靠。 @DavidShenXD @billythegod @dashhuang @nothingyuancando
  ⚙️ 模型与引擎
  所有来源的 OpenAI 模型日常默认上下文统一为 272K，真实上限不变；Codex 更新后可用 GPT-6.1 Sol。Pi 里切换模型不再重开会话、无需额外补丁，自定义 Grok 供应商的报错也已修复。 @PraiseZhu @zqchris
  📱 手机端伙伴与群聊
  伙伴列表和聊天界面重新校准，启动与返回停在伙伴列表、不再跳进上一个伙伴；群聊图片导致崩溃、安卓群聊输入框被键盘挡住也已修复。列表展开收起、归档与置顶移位换上了 iOS 节奏的过渡动画。 @dashhuang @kirozeng @nothingyuancando @zqchris
  ⚡ 手机端任务、附件与性能
  聊天附件不再限制类型和 30 MB 大小，直连传输不设固定上限；任务菜单能看 Claude、SuperGrok 订阅配额与 ChatGPT credits。文件预览音视频不再塌成 0 高度，安卓机在任务很多时也更流畅。 @DavidShenXD @MagicLizi @dashhuang @unclecloudtxy @zqchris
  🛡️ 桌面稳定性与界面
  修复协同任务在 Worker 还在跑时就提示「已完成」、Codex 目标模式显示「已暂停」却仍在执行等问题；远程任务的终端不再误开本机 shell。下拉菜单样式统一，快捷键不再替你误批卡片，弹窗点外面不再误关。 @DavidShenXD @WZBbiao @dashhuang @kirozeng @nothingyuancando @zqchris
