ReleaseNotes: |-
  Desktop release 0.1.86
  更新说明
  🧩 项目管理能力上线
  Agent 现在可以帮你新建项目、把已有任务移动进项目，移动前会先校验路径和权限，聊天记录一并迁移。项目的最近活跃时间也不再被归档或删除任务影响。
  🤝 伙伴协作更完整
  伙伴支持跨设备发现和对话，创建时有头像选择和开场引导；运行中的中间输出与工具过程会折叠收拢，伙伴的工作状态在整轮里保持可见。伙伴记忆不再受全局记忆开关影响，伙伴重启期间排队发送的消息也不会丢失。
  🖥️ 手机远程桌面更顺手
  手机远程桌面的全屏交互重做，横屏返回键不再被灵动岛挤开，画面适应屏幕比例时顶部留出安全区。Windows 电脑的远程光标在本地即时移动，连接超过 60 秒会明确失败而不是一直等待。
  ⚡ 任务列表更快，远程更稳
  任务很多时侧栏打开更快，本地和远程任务走同一套读取方式，目录刷新合并成一次请求，不再轻易把连接挤满。断线恢复后消息顺序和发送不断档，新设备默认使用系统里的电脑名称。
  🤖 模型与供应商
  模型选择器恢复按内容展开，切换模型不再丢失显示名称，离线时旧模型也显示正确名字；Vertex 与 Azure 端点按官方域名识别，旧地址无需重新编辑。订阅任务的累计价值恢复显示，生成速度不再异常放大。
  🎨 界面与控件打磨
  数字、思考档位与媒体播放的滑块统一成一套样式，音频卡片显示的时长与实际一致。Cindy 开关的开启和关闭状态更清楚，拖拽中途取消后标签仍可点击；首页会记住你上次停留的伙伴或任务入口。
  🛠️ Cindy Make 准备更省事
  环境与依赖只需要准备一次，之后在任务里可以直接复用，包括 Python 工具链；准备进度在切换页面后不会丢失，取消和失败恢复也有了明确入口。
  🧯 问题修复
  修复了协同伙伴正常输出时误报「任务被中断」、工作区恢复失败后任务无法继续、移动端首页闪现空态等问题；侧栏会保持当前任务的位置不跳动，内置浏览器在密码库不可用时也能正常启动。
  🛡️ Agent 授权与报错更清楚
  Agent 读写工作目录之外的文件时，确认卡片会写明具体操作和读写方向，授权只对确认时的路径生效；启动失败会保留脱敏的错误摘要，自动复核不再串用其他任务的限制，搜索工具在代理环境下也能正常认证。
  💻 跨平台安装与更新
  Linux 新增 Arch 与 Omarchy 的用户级安装和自动更新，Hyprland 下也能用系统钥匙串；Windows 修复 winget 升级后入口丢失、版本号滞后，安装前会检查目标目录。

