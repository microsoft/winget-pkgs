PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.144
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.144
  更新说明
  📁 侧栏浏览与文件预览
  可以在右侧边栏直接浏览任务目录，就地预览图片、视频和 HTML 文件；预览远程文件时显示取回进度，打开独立侧栏窗口也能用同样的操作和快捷键。
  🧩 插件引擎与供应商
  插件引擎可以开放给同一账号的其他电脑或分享的朋友使用，对方无需安装插件。模型供应商设置里能统一管理插件提供的供应商并选择隐藏或停用，插件自动化也可以只在指定电脑上运行。 @MagicLizi @WZBbiao @dashhuang @fmfsaisai @joei4cm @xuzini-xzn @zqchris
  🤝 伙伴与模型组
  伙伴可以选择模型组，并自动挑选可用来源，远程控制的电脑和手机也能为伙伴选组。伙伴完成任务、遇到阻塞或需要决定时会主动回报，自动化的结果会回到对话，长时间安静的伙伴也会定期复盘。 @MagicLizi @dashhuang @elfcv @fmfsaisai @xuzini-xzn @zqchris
  ⚡ 连接、设备与云主机
  手机切换 Wi-Fi 与移动网络后，重连从约 12 秒缩到 2 秒内，大消息走独立通道；两台 Mac 缺少本地网络权限时会提示并直达设置授权，已授权成员可在设备管理添加云主机、绑定 Linux 设备。 @MagicLizi @dashhuang
  📱 手机端更顺手
  iPhone 和 iPad 支持静态、动态壁纸，也能导入自己的照片或视频；折叠屏远程键盘和冰蓝复古皮肤重新打磨，任务列表与桌面端对齐，消息表格支持整表复制，推送登记失败后会自动补登。 @MagicLizi @dashhuang @elfcv @fmfsaisai @xuzini-xzn @zqchris
  📊 模型、用量与速度
  模型供应商的「隐藏」和「停用」分开了：隐藏只是不在选择器里出现，停用则停止使用；断网时会保留本机订阅模型并在网络恢复后刷新；使用统计改用匿名代号汇总，速度图按每次请求显示推理量与占比。 @dashhuang @elfcv @fmfsaisai @xuzini-xzn @zqchris
  📥 收件箱、任务与协同
  收件箱会列出每个伙伴的主对话，并按「现在该谁动」归类，入口会提示待处理未读，完成一项后自动选中下一项；任务可以无限期稍后处理；协同里的侧边追问可以直接提升为独立任务，待回答的问题也能从任务列表打开。 @WZBbiao @dashhuang @fmfsaisai @zqchris
  💬 对话、消息与卡片
  超长行内代码会在气泡里自动折行，提问导航条跟随阅读位置滑动；插件卡片里的图片、PDF 和文本可以直接拖进输入框；iMessage 连接能更稳地收发文档，音频输入不可用时也会说明如何继续。 @dashhuang @fmfsaisai @xuzini-xzn @zqchris
  🛡️ 稳定性与桌面细节
  登录过期确认框总在最上层，凭证断开后能自动恢复会话；隐私屏授权失败会说明原因并给出操作指引；Windows 托盘额度列表对齐，不再弹出多余的命令行窗口，壁纸下的工具行和速度图等细节也已修正。 @MagicLizi @dashhuang @elfcv @fmfsaisai @kirozeng @xuzini-xzn @zqchris
