ReleaseNotes: |-
  Desktop release 0.1.108
  更新说明
  🧩 插件作品库恢复正常
  作品库读写不再随已装插件数量变慢；从企业市场重装插件后，之前保存的作品库和目录绑定会自动接回，不再变成空库。企业目录被拒时也会说明原因，并保留公开插件。 @kelv1nq1an
  🤖 新模型与新的默认选择
  默认模型改为 GPT-6.1 Sol，并新增支持 100 万上下文与图片输入的 Meta Muse Wonder；同账号其他电脑上开放的模型现在也能收藏，选中后就在那台电脑上运行。 @dashhuang @zqchris
  🔒 分享任务少弹凭证确认
  在被分享的远程电脑上跑任务时，搜索源码、查看改动这类不碰密钥的常见操作不再逐条弹确认；命令里直接写着密钥时仍会照常确认。 @MagicLizi
  🖧 电脑组按用量均衡分配
  远程与分享页里的电脑组新增「用量均衡」策略：跳过额度用完的电脑，优先分给用得最少的；分享视图还会显示每台电脑的状态和版本兼容提示。 @MagicLizi
  📊 菜单栏用量面板更紧凑
  菜单栏的用量面板整体缩小并重新排版，小屏笔记本会自动切换紧凑布局，英文等较长语言不再溢出或截断。 @lengjingxu @zqchris
  🖼️ 图片消息加载更顺
  聊天里的图片加载时会先显示占位与转圈，加载完成后淡入，不再空白一片或突然跳出；复制带插件标注的图片时会去掉标注行，与普通消息一致。 @dashhuang
  🎯 目标与定时任务
  目标运行期间发普通消息不再打断目标，处理完会继续，手机上也能用 /goal 创建和管理目标；定时自动化在自动恢复失败后不再堵住后续轮次。 @DavidShenXD @xd-bobo @zqchris
  ♻️ 老任务的恢复入口
  旧任务因流中断反复报错、重试也无法继续时，桌面和手机会提供「用可读历史新建任务」的入口，保留原任务并在新任务里接着对话。 @DavidShenXD
  📱 手机端改进
  手机端可以管理已有群的设置；Windows 上同一路径的工作区不再重复列出；打开过的定时任务切到后台后不再被清空正文。 @DavidShenXD @dashhuang @zqchris
  🔗 渠道消息回传更完整
  Telegram 等渠道里派出的后台子任务，完成后的结果和最终报告现在也会回到原渠道；任务继承渠道默认模型时，不再被残留的来源设置卡住无法执行。 @dashhuang
  🧭 其他修复
  侧栏「更多」菜单悬停即展开，伙伴与群设置抽屉的关闭按钮恢复可用，启动或登录异常时可直接提交日志；群聊中伙伴的回复不再丢失，自动重试不再切错模型协议，手机上无法同步的残留任务也能清理，开票说明补齐盖章要求。 @DavidShenXD @MagicLizi @dashhuang @zqchris
