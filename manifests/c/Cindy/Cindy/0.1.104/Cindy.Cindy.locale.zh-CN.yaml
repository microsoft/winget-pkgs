PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.104
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.104
  更新说明
  🧩 供应商组自动换机
  供应商组现在会自己挑一台能用的电脑运行任务：撞上用量上限、登录失效或连不上时，自动换到组里另一台继续，换机期间不再弹错误卡、也不残留红点，只有全组都不可用才提示。「远程与分享」页按使用方逐行列出用量，展开可看每台电脑的余量；分享出去的链接与设备名不再暴露分享者的电脑名。 @MagicLizi
  🖧 协同 Worker 跑在另一台电脑
  协同里的每个 Worker（含第一个）都可以选一台同账号电脑运行，Lead 和团队仍留在发起的那台；面板与手机端能看到远端 Worker 的真实状态，点开直接进入它在那边跑着的任务。每个 Worker 还能单独选用本机或分享来的供应商，协同任务也按供应商组分配、出问题自动换电脑。 @DavidShenXD @MagicLizi
  ⬆️ 让 Agent 帮你更新 Cindy
  现在可以在对话里让 Cindy 自己升级：先弹确认卡等你确认，确认后自动检查、下载并重启，重启完成把结果写回原来的对话。桌面、手机与 IM 三端是同一个决定，只有你本人发起的请求才能触发；确认卡会提示这次重启会打断哪些后台工作，之后可选择开启「空闲时自动更新」。 @dashhuang
  🤖 伙伴的待办与群聊反馈
  伙伴有了自己独立的待办清单，可在伙伴工作台里查看和推进，手机端也能查看与控制，已完成的记录会保留。群聊里伙伴执行失败时不再一直显示「正在思考」，而是立即结束并说明原因与恢复办法，桌面主群、话题与手机端口径一致。 @dashhuang @zqchris
  💬 IM 渠道的音视频附件
  飞书、Telegram、Discord 里发给伙伴的音视频现在会交给模型处理，不再一律显示「不支持」；群里先发媒体再单独 @ 也能补上这轮实际用到的附件。个人 IM 渠道收到的普通文件改为随任务统一存放，任务删除时一并清理。 @dashhuang
  ⚡ 回复速度看得见
  生成过程中会实时显示回复速度与首响应、流内等待时间，模型执行工具时明确显示「执行工具中」，不再假装还在生成。结束后速度入口保留为「上次生成」，随时可点开回看本轮曲线与最终平均速度，切换任务也不会串到别的任务的数据。 @zqchris
  👥 共享任务的文件与权限
  共享任务里的访客现在能在文件浏览器里正常列目录、读取、搜索、保存、新建与删除房主分享的这份任务目录，不再只看到「文件树加载失败」。模型与推理强度设置收紧为只有房主能改；房主移动任务目录或在建链期间撤权后，访客不会再操作到旧目录。 @DavidShenXD
  📱 手机端一批改进
  引用消息的胶囊只显示一行纯文字摘要，不再露出 Markdown 原文、图片地址与内部标识；输入框里可以选择并调用已安装的插件。图片查看器放大后拖动有边缘回弹与惯性，内置浏览器打开时不再闪旧界面并支持深色模式；消息列表停在距底几行松手不再被拽到最新。 @dashhuang @nanaco666
  🎚️ 模型与能力
  补登记 Claude Haiku 5.5 与 Sonnet 5.5，界面上重新可以选择思考强度；Codex 新增重置列表，可逐项查看重置到期时间并手动使用。Claude Code 自带的文件发送、Artifact 与 claude.ai 文档连接器等只在厂商自家界面显示结果的能力已停用，改用 Cindy 自己的媒体交付与本地网页预览。 @dashhuang @nanaco666
  🧹 稳定性修复
  修复远程桌面结束后直连空闲关闭导致整个应用退出的问题；服务器更换密钥后 SSH 主机不再被打回「认证中」并卡住。Pi 会话切换模型后推理强度不再自动掉档，冷 Pi 路由失效时也不再卡死；定时任务的前置检查命令有语法错误时不再被悄悄跳过。切换伙伴时主进程也不再被超长命令卡住约 31 秒。 @dashhuang @zqchris @zyjisdog
