ReleaseNotes: |-
  Desktop release 0.1.76
  更新说明
  🛠️ Cindy Make 构建流程上线
  在桌面端输入 /cindy-make,即可体检本机构建环境、自动补齐缺失的便携工具(不改动系统与全局设置),并搜索上游 Issue / PR,帮你判断等官方版还是制作个人版；/cindy-make-doctor 可随时单独做环境检查。
  🤖 AI 伙伴更主动、更可靠
  伙伴现在以自身身份交流，不再冒用底层引擎；简单请求会直接完成，编码或中大型工作则主动开启独立任务并把结果核验带回。伙伴发送消息报错、切换引擎或远程使用时无法创建后台任务的问题也已修复。 @zqchris
  🧭 模型选择与连接更可靠
  选模型更顺手：支持跨来源搜索，排序、收藏与远程模型的显示更合理，模型信息刷新后不会丢失，未开放的推理强度会标灰；访客也能正常配置自定义模型。用 Anthropic 订阅登录 Pi 后可以正常对话；自定义供应商指向未启动的本地代理时会得到明确提示。 @AquaHydro @fico-hub @zqchris
  🌐 浏览器模式可切换，也能访问内网
  内置浏览器现在可以切换成外置浏览器(或切回来),并记住你的选择；外置模式下也能打开公司内网页面，不再被当成私有地址拦下。 @dashhuang
  🔒 媒体下载更安全
  从未知来源下载图片或视频前，会先征求你的授权；需要访问内网地址时，会展示具体要访问的目标。下载与保存更稳，授权后的自动重试不会造成重复计费。 @GaoWeiLiuXD
  📱 手机端问题修复
  完全断网时开始新任务不再一直卡在检测环境阶段，会提示连接恢复并自动重试；自动重连时有加载动画，与电脑的同步也不再突发拥堵。Android 拖动输入框不再闪退、语音听写不再重影；iOS 左滑菜单里的删除与重命名恢复响应，附件与分享图片的显示也更正常。 @DavidShenXD @cofyc @dashhuang @fico-hub @guyong-zapo
  📊 用量与设置界面更清晰
  设置里的用量图表换了新配色，支持轻弹滑动，图形与日期选择更准确，热力图和柱状图恢复紧凑显示；设置各处的分段选项样式也已统一。 @dashhuang @kirozeng
  📄 超大 PDF 预览更流畅
  预览大体积 PDF 明显更快；滚动加载时，大幅面页面保持完整、不会错位或消失。 @DavidShenXD
  🖥️ 桌面细节优化
  浏览技能库不再出现空分类；桌面提醒更利落——完成任务后灵动岛提示立即收起，读完伙伴消息后未读正确清除，远程任务只保留异常提示；任务中途提问时输入内容不会被清空，登录账号较多时也能滚动选择全部身份。 @Yuewei-LL @dashhuang @weikl666 @xd-bobo
