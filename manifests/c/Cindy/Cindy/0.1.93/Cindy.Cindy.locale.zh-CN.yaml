PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.93
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.93
  更新说明
  🔄 切账号后旧任务正确收口
  切换账号时，旧账号正在运行的任务会立刻停止运行与计时，并显示为已中断；切回原账号后不会自动续跑，点「继续任务」才恢复。后台任务与排队消息也按账号归属处理，不会串号。 @DavidShenXD
  🏢 企业配置的模型与技能直接可用
  已接入企业的用户会自动获得公司统一配置的模型与凭证，Claude Code、Codex、Pi 和生图都能直接选用；企业下发的技能也会按部门自动装好。这些设置在本机只能查看和刷新，不会被个人配置覆盖。 @jk625x @qbqian
  🧠 伙伴记忆可以自己管理
  伙伴设置新增「记忆」页，可以按类型查看、搜索、编辑和删除伙伴记住的内容，编辑自动保存、删除有确认。伙伴回复的通知改为显示本轮答复摘要，任务结束后聊天末尾直接给出结果入口，不用再翻历史。 @zqchris
  ⚙️ Agent 运行时可以升级与恢复
  Claude Code、Codex 和 Pi 的版本现在能在设置 → 关于里查看，线上有更新时可直接升级，重启后自动装好；Pi 还能恢复回 Cindy 正式版。开启自动更新的用户，运行时也会跟着更新，不再停在首次安装的版本。 @MagicLizi @unclecloudtxy @zqchris
  🤖 新模型、参考价格与 Grok 登录
  新增 GPT-6 Sol、GPT-6 Luna 与 Claude Opus 5.5，并按厂商已核实的价格补齐了参考计价。Grok 支持设备码登录，不方便走浏览器回调时，可以用短码在授权页完成连接。 @dashhuang @zqchris
  🖥️ 电脑互联与 SSH 远程任务更可靠
  电脑互联后，远程任务里命令生成的文件和文件改动也能看到，可以打开该轮差异，并在那台电脑上撤销或重新应用。SSH 远程的 Codex 任务现在能正确列出并选择宿主上实际可用的模型，首次发送或换模型重试都能正常进行。 @DavidShenXD @dashhuang
  📱 移动端体验与修复
  手机发送的消息会先存在本地，离开页面或重启后仍能恢复，并会核对电脑是否真的收到，不丢也不重复。任务进行中可点开 Token 速度看曲线与峰值；iOS 伙伴自动化表单不再失去响应，语音按钮启动时不再闪，任务列表的红点也会随实际状态消失。 @dashhuang @zqchris
  🖥️ 桌面端体验与修复
  设置侧栏新增跨分类搜索，能直接跳到具体设置项；任务菜单统一整理，共享任务不再分「我开启的／已加入」，房主用皇冠标识；插件开关、按钮与文件类型图标统一到同一套样式。另修复内置 iOS 模拟器、自定义端点保存和伙伴分享选择框等问题。 @DavidShenXD @MagicLizi @dashhuang @horizon554 @kirozeng
  ⏰ 定时任务更准确
  按分钟执行的定时任务不再出现跨小时的短间隔，只保留能整除一小时的槽位，旧任务的值会保留并提示修正。夏令时切换期间也不会再重复执行或整月跳过。 @DavidShenXD @billythegod
  🛠️ Cindy Make 更顺手
  Cindy Make 的侧栏与远程资源卡片统一了样式，内测用户可以直接在设置里开启。生成个人版期间会阻止切换版本和手动同步源码，完成或失败时给出一次性提示，避免生成被打断。 @MagicLizi
