ReleaseNotes: |-
  Desktop release 0.1.85
  更新说明
  📊 查看生成速度历史与常驻浮窗
  任务运行时可以看到最近几轮的生成速度曲线，并能把速度面板固定常驻在界面上；切换任务后历史仍会保留，重启应用后清空。
  🖥️ 远程桌面按控制端比例调整分辨率
  远程连接时会把被控电脑的分辨率调整到与控制端画面比例匹配，断开后自动恢复原分辨率；不在远程操作时，本机 Agent 不再退让。
  🚀 支持登录时自动启动
  Windows 和 macOS 上可以在设置里开启登录时自动启动；开关以系统登录项为准，应用自身启动时不会改动它。
  💬 Slack 通讯设备与 Bot 接收设备分开
  本机 Slack 通讯的连接可以和接收 Bot 消息的设备分开选择，方便一台电脑只承担其中一项；旧的 Slack 服务端会自动沿用原有绑定。
  🛠️ 环境准备集中处理并复用依赖
  环境与源码准备统一由主程序负责，依赖只需完整安装一次，任务工作目录直接复用已装好的缓存和工具链（含 Python），准备界面也更简洁。
  🎨 设计规范复核带来的一批界面修复
  通知卡片在悬停或键盘聚焦时暂停消失计时，内容较长时不再被裁切；安装位置弹窗支持 Esc 关闭并回到入口，安装过程中不会误关。模型菜单的圆角与间距对齐，大字号下插件市场卡片和用量文字会跟随放大。
  🔔 任务状态、角标与通知修正
  修复任务实际已结束、侧栏却仍显示运行中的问题；自动恢复期间不再重复发送完成通知，也不会叠加显示重复的错误横幅。Windows 任务栏角标更清晰，且不再统计远程与自动化任务。
  🤖 模型切换与本机出图修复
  修复伙伴资料缺失或延迟时模型选择会漂移的问题；本机 Codex 恢复出图，OpenAI 订阅的模型目录也统一了。Kimi K2.8 资料补齐，价格未知时不再显示成错误数字，设置里的供应商用量更紧凑。
  📱 移动端消息显示与点击修复
  修复发送消息后气泡与历史列表交接时短暂消失的问题，排队中的消息气泡也更容易点开；相关判据收紧后，排队消息不再容易被误删。
  🎮 Windows 手柄与快捷键设备检测修复
  修复 Windows 上快捷键设备检测失效、原生输入不工作的问题；Xbox 手柄改由 XInput 读取，识别更稳定，设备发现期间也不会丢失正在使用的设备。
  🐛 分享、自动跟进与 Pi 的几处修复
  分享图片在页面失焦后仍能正常复制；自动跟进会保留原任务的授权与权限；Pi 任务不再被旧进度掩盖最后一次空响应，Windows 上解压 Pi 包时也不再丢文件。

