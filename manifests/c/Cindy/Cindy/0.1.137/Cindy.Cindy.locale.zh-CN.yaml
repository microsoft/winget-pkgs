PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.137
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.137
  更新说明
  🖥️ 在电脑上看另一台电脑的设备画面
  查看另一台电脑上的任务时，右侧栏可以直接打开那台电脑正在运行的设备模拟器画面，像操作本机模拟器一样缩放、滑动、截图和切换设备。 @dashhuang
  🔒 离开电脑时用隐私屏代替锁屏
  设置里的「离开电脑时」统一为隐私屏：屏幕被遮住，但电脑保持唤醒，AI 任务可以继续运行；远程连接时也能选择连接期间遮屏、结束后保护电脑。 @dashhuang @zqchris
  🔔 在手机通知上直接作答
  任务提问、完成提醒和低风险权限请求会出现在 iPhone 通知上，可以直接选择答案、回复或允许一次，不用先打开应用；Apple Watch 也能看到任务进展。 @dashhuang
  ⚡ 跨电脑连接更快、更省流量
  跨电脑查看任务时只传变化部分并压缩传输，官方中转扩容后高峰更稳，附件可以直接上传；弱网和休眠唤醒后的重连也更可靠。 @MagicLizi @dashhuang @yan-xdt
  🧩 插件能用宿主的更多能力
  插件可以复用 Cindy 的终端、浏览器、你选择的文件夹、存储和已登录账号，权限按组确认；插件页面支持全屏进出、跟随主题并保留操作状态。 @GaoWeiLiuXD @ZacharyZhang-NY @fmfsaisai @versun
  🤖 模型组的路线改叫「模式」
  模型组的路线在界面上统一叫「模式」，运行中的任务也能切换模式，常用模式可以加星标；新任务按目标电脑和目录挑选模型来源也更准确。 @zqchris
  💳 订阅账号可以自行安放
  同类型订阅账号不再默认合并，可以放在自己的供应商下或并入已有供应商；选择模型时能看到各账号的剩余配额和价格，分享的模型也能按电脑单独开启或收回。 @MagicLizi @dashhuang @nothingyuancando @yan-xdt
  👥 群聊与机器人协作更清楚
  群里的 Cindy 处理消息时会写明在哪台电脑、用什么模型；群仓库支持 GitLab（含自建）和 CNB，选本机文件夹也能自动填好。飞书、Telegram 等机器人用侧栏项目，回执跟随你的界面语言。 @dashhuang @zqchris
  🗣️ 语音输入与文言作答文风
  群聊和话题里也能用语音输入；简体、繁体中文界面在语言设置里可以选择「文言」等作答文风，界面保持现代中文，只有回答按所选文风书写。 @dashhuang
  🗂️ 任务管理与稳定性改进
  任务可以打包导出和导入，闲置任务能按本机规则自动归档，自动化编辑合成一页；发送超大图片会自动压缩或改用 PNG，长任务上下文用尽后也会自动接续。 @GaoWeiLiuXD @dashhuang @fmfsaisai @xuzini-xzn
  📱 手机端体验打磨
  手机上的任务浮窗、灵动岛返回、公式排版、列表顺序和 Android 键盘遮挡等问题得到修复，输入建议也新增了开关。 @dashhuang @fmfsaisai @xuzini-xzn @zqchris
