PackageIdentifier: Cindy.Cindy
PackageVersion: 0.1.121
PackageLocale: zh-CN
ShortDescription: 一个开源、开箱即用的 AI Agent：想到，就能做到。
Description: |-
  Cindy 是一个开源、开箱即用的 AI Agent。她把多套 Harness、模型和工具收进同一个持续成长的伙伴，在真实工程和软件里把任务做完。一开始就好用，任你打扮，任你培养。
  Cindy 运行在你自己的电脑上，使用你本地的文件和已登录的应用。首批兼容 Claude Code 与 Codex 两套 Agent Harness，更多 Harness 正在接入。模型与 Harness 自由组合、同一任务中随时切换，工作现场、记忆、Skill 和工具始终连续；一个任务还可以由不同 Harness 与模型组合的多个 agent 规划、并行执行、独立 review。
Tags:
- 人工智能
- 大语言模型
- 智能体
- 自主智能
ReleaseNotes: |-
  Desktop release 0.1.121
  更新说明
  🛰️ 自建中转服务，一键部署到自己的服务器
  设置里新增「中转服务」：可在这台电脑直接开启，或用 SSH 部署到自己的 Linux 服务器，自动申请并续期 HTTPS 证书，支持配对加入、升级和卸载；服务器已用 Nginx 时也能自动复用原站点。 @MagicLizi
  🔗 分享的供应商可直接连上执行电脑
  分享供应商后，对方新任务可直连组内执行电脑，获得短期授权、到期收回，断线自动改用中转；历史任务仍在原电脑续接。已分享的供应商在设置里单独成区，跨区域分享加入后自动补回列表，模型范围不重复显示同一型号。 @MagicLizi @yan-xdt @zqchris
  🧩 本地插件也能分享安装
  本地插件详情页新增分享，首次上传前先确认，相同内容再次分享直接复用；接收方登录后可在当前电脑或其他候选电脑安装固定版本，覆盖同名插件前会说明影响并让你确认。 @GaoWeiLiuXD
  🔒 远程桌面闲置后自动断开并锁屏
  远程桌面新增「无操作后断开并锁屏」，默认 5 分钟，可选 1–30 分钟或永不；控制端电脑锁屏或睡眠时立即结束远控并锁住被控电脑，回来后需手动重新连接，手机开启闲置保护后进入后台也会结束远控。 @zqchris
  🖼️ 让模型找回聊天里的历史图片
  在 Telegram、飞书、企业微信、钉钉、Discord、微信和 Slack 中，模型现在能按消息 ID 读取之前发过的图片，问「前面那张图是什么」时不用重复上传；直接引用图片时仍会自动带图。 @dashhuang
  📱 手机端分享图片、建群和报错更顺手
  手机分享含富媒体组件的消息时，图片、图表和指标会正常出图，不再打印组件协议；创建群聊的操作栏、键盘和滚动更顺；群聊运行失败改用紧凑错误卡，横向屏幕下任务侧栏的显示设置也能正常操作。 @dashhuang @zqchris
  ⌨️ 输入框与侧栏的小改进
  「+」面板自带搜索框，打开即可输入筛选；伙伴筛选新增「全部」和「都不显示」，可只看个人任务；推荐输入出现时伙伴语音按钮不再消失；待输入步骤的手机和飞书提醒不再重复推送，失效步骤也不再提醒。 @guyong-zapo @horizon554 @zqchris
  🤖 模型信息与远程连接更可靠
  远程或分享用 Pi + ChatGPT 时不再误报模型不可用，空失败可重试，/v1 结尾的地址不再重复拼接；自己设置的工具搜索开关不被覆盖；报价标出收费项，Cindy AI 按个人或企业显示身份名称。 @Battleplus @dashhuang @fmfsaisai @saurabh-cognizn @techsaurabh-394 @zqchris
  ⚡ 更快更稳的日常使用
  Dock 角标不再被界面上读不到的未读永久顶高；远程任务在别名很多时发消息不再卡顿，切换任务减少重复计算；截图能自动识别窗口区域，录制和保存更流畅；网络故障时已登录账号会在后台持续恢复，不用重启。 @DavidShenXD @PraiseZhu @WZBbiao
  🧾 一批细节修复
  恢复邮件侧栏不再一直加载，草稿附件保持对齐；Codex 询问取消后任务能正常结束，过期的用量促销按时消失；写法不规范的公式、图表草稿照常显示，后台委派的补充输入也能送达，固定项排序不再丢新条目。 @Eapp1e @cofyc @dashhuang @polarisaspire
