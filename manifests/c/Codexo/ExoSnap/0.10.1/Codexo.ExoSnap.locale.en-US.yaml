ShortDescription: Windows-native screen / application / region recorder with an NVIDIA NVENC pipeline, multi-track audio, and diagnostics.
Description: 'ExoSnap is a Windows-native screen / application / region recorder built around a high-performance NVIDIA NVENC pipeline, flexible container/codec profiles, multi-track audio routing, a webcam overlay, and built-in diagnostics. It captures an application window, a monitor, or a screen region at CFR 60 fps, records to MKV, WebM, or MP4, and blocks invalid recordings before start. ExoSnap 0.9 adds native HDR10 recording (PQ / BT.2020, 10-bit) with HEVC or AV1, an in-app updater, tray notifications, and a diagnostics-first workflow: a pre-flight readiness gate, live pipeline monitoring (frame drops, A/V drift, disk-fill ETA), VRR-vs-CFR judder correlation, and a post-flight report card. Requires an NVIDIA GPU with supported NVENC.'
