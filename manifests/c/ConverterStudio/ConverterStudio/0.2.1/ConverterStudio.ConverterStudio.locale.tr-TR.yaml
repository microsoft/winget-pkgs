ShortDescription: "Video, ses, resim, PDF ve belgeleri bilgisayarınızda dönüştürün: 67 biçim, istediğiniz kadar, reklam yok."
Description: |-
  Converter Studio video, ses, resim, PDF, belge, e-kitap ve arşivleri doğrudan bilgisayarınızda dönüştürür. 67 dosya biçimi, 486 dönüşüm, reklam yok; bilgisayarınızda istediğiniz kadar dönüştürürsünüz.

  Ücretsiz; isteğe bağlı uygulama içi satın almalar
  Tüm Uygulamalar: yıllık 19,99 $ ya da bir kez 29,99 $. Pro: aylık 7,99 $ ya da yıllık 49,99 $. Premium: aylık 19,99 $ ya da yıllık 149,99 $. Bulut kredi paketleri: 4,99 $ ile 79,99 $ arası. Fiyatlar 4,99 $ ile 149,99 $ arasındadır. Satın almalar tarayıcınızda Whop ile ödenir; abonelikler siz iptal edene kadar kendiliğinden yenilenir.

  Dosyalarınız bilgisayarınızda kalır
  Dönüşümler bu bilgisayarda, uygulamanın içindeki motorlarla (FFmpeg, libvips, PDF.js, 7-Zip) yapılır. Bilgisayarınızın yapamadığı bir dönüşüm için bulutu siz seçmedikçe hiçbir şey yüklenmez.

  Neler yapabilirsiniz
  • Video: MP4, MOV, MKV, AVI, WebM, WMV, FLV, 3GP. 1080p, 720p ya da 480p seçin, kaliteyi ayarlayın, sesi kaldırın, GIF yapın. Varsa ekran kartınızın video kodlayıcısını (NVIDIA, Intel, AMD) kullanır.
  • Ses: MP3, WAV, M4A, AAC, FLAC, OGG, Opus, WMA, AIFF; 128-320 kbps. Videonun sesini ayırın.
  • Resim: JPG, PNG, WebP, HEIC, AVIF, GIF, BMP, TIFF, ICO ve fotoğraf makinesi RAW'ı (CR2, NEF, ARW, DNG). Kaliteyi ayarlayın, boyutlandırın, fotoğrafın konum bilgisini koruyun ya da silin.
  • PDF: sıkıştırın, birleştirin, bölün, döndürün, sayfa çıkarın ya da silin; PDF'ten JPG, PNG ve metne; resimlerden PDF'e.
  • Belge, tablo ve sunum: Word, Excel, PowerPoint, OpenDocument, RTF, Markdown, HTML, CSV.
  • E-kitap, altyazı, veri ve arşiv: EPUB, MOBI, AZW3, FB2, SRT, VTT, JSON, XML, YAML, ZIP, 7Z, RAR, TAR.
  • Aynı anda çok dosya (ücretsiz: ayda 3 kez, her seferinde en çok 30 dosya) ve Pro ya da Premium ile ZIP'in içindeki dosyalar.

  Günlük kullanım için
  • Bir dosyaya sağ tıklayın ve "Converter Studio ile dönüştür"ü seçin ya da "Birlikte aç"ı kullanın.
  • Sonuç orijinalin yanına ya da seçtiğiniz klasöre kaydedilir; var olan bir dosyanın üzerine asla yazılmaz.
  • Önizlemeli dönüşüm geçmişi; sonucu tek tıkla açın.
  • Türkçe, İngilizce, Almanca, İspanyolca, Fransızca, İtalyanca, Portekizce, Rusça, Japonca ve Arapça.

  Ücretsiz, daha fazlası için planlar
  Bilgisayarınızda dönüştürmek dosya başına 500 MB'a kadar ücretsiz ve istediğiniz kadar; ayrıca her ay 1 GB'a kadar iki ve 2 GB'a kadar bir dosya. Tüm Uygulamalar (yıllık ya da ömür boyu) bilgisayarınızdaki boyut sınırını kaldırır ve bulut kredisiyle gelir (yılda 500 ya da bir kez 1.000); sitedeki Pro ve Premium hesaplar burada da geçerli. Bilgisayarınızın yapamadığı dönüşümler (örneğin bazı Office ve e-kitap biçimleri; ücretsiz LibreOffice ya da Calibre'yi kurmadıysanız) bulutta yapılır ve kredi kullanır; her gün ücretsiz kredi verilir.

  Converter Studio web'de: https://converter.studio/
