ShortDescription: "Convert video, audio, images, PDFs and documents on your computer: 67 formats, as often as you like, no ads."
Description: |-
  Converter Studio converts video, audio, images, PDFs, documents, e-books and archives right on your computer. 67 file formats, 486 conversions, no ads, and conversions on your computer as often as you like.

  Free, with optional in-app purchases
  All Apps: $19.99 a year or $29.99 once. Pro: $7.99 a month or $49.99 a year. Premium: $19.99 a month or $149.99 a year. Cloud credit packs: $4.99 to $79.99. Prices range from $4.99 to $149.99. Purchases are paid in your browser through Whop; subscriptions renew automatically until you cancel them.

  Your files stay on your computer
  Conversions run on this computer with built-in engines (FFmpeg, libvips, PDF.js, 7-Zip). Nothing is uploaded unless you choose the cloud for a conversion your computer cannot do.

  What you can do
  • Video: MP4, MOV, MKV, AVI, WebM, WMV, FLV, 3GP. Pick 1080p, 720p or 480p, set the quality, remove the sound, make a GIF. Uses your graphics card's video encoder (NVIDIA, Intel, AMD) when there is one.
  • Audio: MP3, WAV, M4A, AAC, FLAC, OGG, Opus, WMA, AIFF at 128 to 320 kbps; take the sound out of a video.
  • Images: JPG, PNG, WebP, HEIC, AVIF, GIF, BMP, TIFF, ICO and camera RAW (CR2, NEF, ARW, DNG). Set the quality, resize, keep or remove the photo's location.
  • PDF: compress, merge, split, rotate, extract or delete pages; PDF to JPG, PNG and text; pictures to PDF.
  • Documents, spreadsheets and presentations: Word, Excel, PowerPoint, OpenDocument, RTF, Markdown, HTML, CSV.
  • E-books, subtitles, data and archives: EPUB, MOBI, AZW3, FB2, SRT, VTT, JSON, XML, YAML, ZIP, 7Z, RAR, TAR.
  • Many files at once (free: 3 times a month, up to 30 files each time), and the files inside a ZIP with Pro or Premium.

  Made for everyday use
  • Right-click a file and choose "Convert with Converter Studio", or use "Open with".
  • The result is saved next to the original or in a folder you choose; an existing file is never overwritten.
  • A history of your conversions with previews; one click opens the result.
  • In English, Turkish, German, Spanish, French, Italian, Portuguese, Russian, Japanese and Arabic.

  Free, and plans for more
  Converting on your computer is free for files up to 500 MB each, as often as you like, plus two files up to 1 GB and one up to 2 GB each month. All Apps (yearly or lifetime) removes the size limit on your computer and comes with cloud credits (500 a year, or 1,000 once); Pro and Premium accounts from the website work here too. Conversions your computer cannot do (for example some Office and e-book formats, unless you install the free LibreOffice or Calibre) run in the cloud and use credits, with free credits every day.

  Converter Studio on the web: https://converter.studio/
