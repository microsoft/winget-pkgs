ShortDescription: "Video, ses, resim, PDF ve belgeleri bilgisayarında dönüştür: 67 biçim, dosya sayısında sınır yok, reklam yok."
Description: |-
  Converter Studio video, ses, resim, PDF, belge, e-kitap ve arşivleri doğrudan bilgisayarında dönüştürür. 67 dosya biçimi, 521 dönüşüm, reklam yok ve kaç dosya dönüştürdüğüne sınır yok.

  Dosyaların bilgisayarında kalır
  Dönüşümler bu bilgisayarda, uygulamanın içindeki motorlarla (FFmpeg, libvips, PDF.js, 7-Zip) yapılır. Bilgisayarının yapamadığı bir dönüşüm için bulutu sen seçmedikçe hiçbir şey yüklenmez.

  Neler yapabilirsin
  • Video: MP4, MOV, MKV, AVI, WebM, WMV, FLV, 3GP. 1080p, 720p ya da 480p seç, kaliteyi ayarla, sesi kaldır, GIF yap. Varsa ekran kartının video kodlayıcısını (NVIDIA, Intel, AMD) kullanır.
  • Ses: MP3, WAV, M4A, AAC, FLAC, OGG, Opus, WMA, AIFF; 128-320 kbps. Videonun sesini ayır.
  • Resim: JPG, PNG, WebP, HEIC, AVIF, GIF, BMP, TIFF, ICO ve fotoğraf makinesi RAW'ı (CR2, NEF, ARW, DNG). Kaliteyi ayarla, boyutlandır, fotoğrafın konum bilgisini koru ya da sil.
  • PDF: sıkıştır, birleştir, böl, döndür, sayfa çıkar ya da sil; PDF'ten JPG, PNG ve metne; resimlerden PDF'e.
  • Belge, tablo ve sunum: Word, Excel, PowerPoint, OpenDocument, RTF, Markdown, HTML, CSV.
  • E-kitap, altyazı, veri ve arşiv: EPUB, MOBI, AZW3, FB2, SRT, VTT, ASS, JSON, XML, YAML, ZIP, 7Z, RAR, TAR.
  • Aynı anda çok dosya ve ZIP'in içindeki dosyalar (Pro ve Premium).

  Günlük kullanım için
  • Bir dosyaya sağ tıkla ve "Converter Studio ile dönüştür"ü seç ya da "Birlikte aç"ı kullan.
  • Sonuç orijinalin yanına ya da seçtiğin klasöre kaydedilir; var olan bir dosyanın üzerine asla yazılmaz.
  • Önizlemeli dönüşüm geçmişi; sonucu tek tıkla aç.
  • Türkçe, İngilizce, Almanca, İspanyolca, Fransızca, İtalyanca, Portekizce, Rusça, Japonca ve Arapça.

  Ücretsiz, daha fazlası için planlar
  Bilgisayarında dönüştürmek dosya başına 250 MB'a kadar ücretsiz ve sınırsız. Uygulama planı (yıllık ya da ömür boyu) boyut sınırını kaldırır; sitedeki Pro ve Premium hesaplar burada da geçerli. Bilgisayarının yapamadığı dönüşümler (örneğin bazı Office ve e-kitap biçimleri; ücretsiz LibreOffice ya da Calibre'yi kurmadıysan) bulutta yapılır ve kredi kullanır; her gün ücretsiz kredi verilir.

  Converter Studio web'de: https://converter.studio/
