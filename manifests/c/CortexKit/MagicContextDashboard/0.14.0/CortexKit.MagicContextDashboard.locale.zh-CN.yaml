PackageIdentifier: CortexKit.MagicContextDashboard
PackageVersion: 0.14.0
PackageLocale: zh-CN
ShortDescription: 浏览和管理 Magic Context 数据。
Description: |-
  你不会为了修复一个漏洞就雇佣一名开发人员，然后在代码发布那一刻就解雇他们。你会留住优秀的人才。他们熟悉代码库，记得当初做决定的原因，并且每周都在变得更敏锐。
  编码智能体（Coding agents）的工作方式则完全相反。每一个任务都像是一次全新的雇佣，它们对你的项目毫无记忆，而且在每次会话结束时，你都会解雇它们并从零开始。在任务中途，它们甚至会遇到“压缩”停顿，这会打破心流并悄悄丢掉它们已知的信息。这是顺行性遗忘症，就像海马体受损后的表现一样。
  Magic Context 为它们提供了一个海马体。它是编码智能体的海马体，是大脑中负责形成、巩固和回忆记忆的部分，完全在后台运行。会话不再是一个用完即弃的承包商，而是变成了一个陪伴整个项目的长期队友：
  - 捕获（Capture）。当历史记录员压缩你的历史时，它会将持久的知识（决策、约束、惯例）提升到项目记忆中。无需额外工作，你就能从正在进行的工作中免费获得一套记忆系统。
  - 巩固（Consolidate）。在夜间，“梦境”智能体会像睡眠对人体的作用一样：对照代码库验证记忆，清理重复和陈旧的条目，并提升反复出现的记忆。
  - 回忆（Recall）。正确的记忆会在每一轮自动浮现，智能体可以按需搜索记忆、过去的对话以及 Git 历史。跨会话运行，并贯通 OpenCode、Pi 和 OMP。
  两项承诺：你的智能体永远不会停下来管理它的上下文（没有压缩停顿，没有心流中断），而且它永不遗忘。
  每个项目运行一个会话，并让它持续运行数周、数月甚至数年。它记得你们共同构建的一切。
