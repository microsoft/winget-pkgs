ReleaseNotes: |-
  Installation and signature verification
  Installation
  By downloading binary from the release
  For instance, if you are using Linux on an AMD64 architecture:
  # Download the binary
  curl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.4/ytt-linux-amd64
  # Move the binary in to your PATH
  mv kapp-linux-amd64 /usr/local/bin/ytt
  # Make the binary executable
  chmod +x /usr/local/bin/ytt
  Via Homebrew (macOS or Linux)
  $ brew tap carvel-dev/carvel
  $ brew install ytt
  $ ytt version
  Verify checksums file signature
  The checksums file provided within the artifacts attached to this release is signed using Cosign with GitHub OIDC(Refer this page for cosign installation). To validate the signature of this file, run the following commands:
  # Download the checksums file, certificate and signature
  curl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.4/checksums.txt
  curl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.4/checksums.txt.pem
  curl -LO https://github.com/carvel-dev/ytt/releases/download/v0.55.4/checksums.txt.sig
  # Verify the checksums file
  cosign verify-blob checksums.txt \
    --certificate checksums.txt.pem \
    --signature checksums.txt.sig \
    --certificate-identity-regexp=https://github.com/carvel-dev \
    --certificate-oidc-issuer=https://token.actions.githubusercontent.com
  Verify binary integrity
  To verify the integrity of the downloaded binary, you can utilize the checksums file after having validated its signature.
  # Verify the binary using the checksums file
  sha256sum -c checksums.txt --ignore-missing
  What's Changed
  - Report each builtin's own name when it errors by @MaxFreedomPollard in #1008
  - Avoid computing debug template dump when debug is off by @emh-jump in #1012
  - Resolve a walked directory to an absolute path once by @armallen in #1013
  - Avoid printing the YAML AST when debug is off by @armallen in #996
  - security: redact request path from error logs by @sameerforge in #1016
  - security: sanitize HTTP request error to prevent query parameter leakage by @sameerforge in #1018
  New Contributors
  - @MaxFreedomPollard made their first contribution in #1008
  - @armallen made their first contribution in #1013
