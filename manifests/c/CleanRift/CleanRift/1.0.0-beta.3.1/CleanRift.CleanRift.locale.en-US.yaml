ShortDescription: Open-source Windows uninstaller with quarantine and undo.
Description: CleanRift is an open-source Windows uninstaller. It runs a program's own uninstaller, reviews leftover files and registry entries, keeps removed content in quarantine for undo, can create a System Restore point, traces new installations with real-time filesystem and ETW registry events, and manages startup items. It is portable, has no ads or telemetry, and is available in six languages.
