InstallationNotes: 使用前需要先安装并登录 Codex CLI。首次运行时填写 Gateway 地址、访问令牌与服务器名称，并选择自动检测到的 Codex 或手动指定其启动文件；访问令牌需与手机 App 中使用的 Gateway Key 一致。
