ShortDescription: Free, modern two-panel file manager with SFTP, FTP, WebDAV and an integrated terminal.
Description: |-
  TwinPanel is a free two-panel file manager for Windows (and Linux in beta), in English and French.
  Tabs, quick view, tree, file transfer queue, SFTP / SCP / FTP / FTPS / WebDAV servers used like folders,
  encrypted vault for passwords and keys, integrated terminal (local and SSH), viewer and editor,
  zip / 7z / tar archives, search, duplicates, folder comparison and synchronisation, multi-rename,
  media tags, light and dark themes, fully customisable shortcuts.
