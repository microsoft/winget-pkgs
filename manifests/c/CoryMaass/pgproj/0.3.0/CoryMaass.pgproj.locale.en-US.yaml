ShortDescription: PostgreSQL database projects - build a schema from SQL files, compare it with a live database, and publish the difference.
Description: |-
  pgproj keeps a PostgreSQL schema as plain SQL files in source control. You write the schema as it should be, and pgproj works out the CREATE, ALTER, and DROP statements that bring a database there, in dependency order, with no migration files.
  pgproj build checks every file with PostgreSQL's own parser; pgproj diff lists what differs from a database; pgproj publish writes the script and runs it in one transaction when asked; pgproj init turns an existing database into a project; pgproj document writes a data dictionary and diagram.
  It works with PostgreSQL 14 to 18.
