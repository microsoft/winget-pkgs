ReleaseNotes: |-
  - Fixed stutters caused by excessive logging.
  - Fixed ghost counts on the input viewer.
  - Fixed the inverted multiplier in versus mode.
  Includes the changes from v1.1.0.6135:
  - Fixed the Personal Best animation not showing.
  - Moved the solo counter box to the side in multiplayer.
  - Restored the 2-player highway to the v1 look, with both highways the same size again.
  - Brightened input viewer trails.
  - Prevented gamepad mode from processing strum input fields.
  - Added gamepad support to the input viewer.
  - Enabled the input viewer for all controllers.
  - Reverted Rewired to v1 behavior.
  - Fixed Song Delay to read offset and delay in seconds.
  - Refactored FC/PFC status handling in leaderboard entries.
  - Fixed Hide Remote Highways hiding your own highway.
  - Fixed remote stats getting wiped, and removed forced sustain drops for remote players.
  - Fixed some menu screen and menu music bugs.
  - Added a static leaderboards menu background for mobile.
  - Restored the FC ring, now controlled with hue.
  - Removed some logging.
  - Fixed the Dynamics FC ring and Dynamics FC showing the PFC crown.
  - Added the missing open star power sprite.
  - Fixed the practice FC ring not showing when losing PFC without missing notes.
  - Increased the maximum sim frame multiplier to 25.
  - Fixed a lyrics crash by falling back to a fallback font mesh.
  - Fixed the PFC ring not showing on 6-fret.
  - Fixed the 6-fret input viewer with trails.
  - Added lefty flip to the input viewer.
  - Added song list leaderboard submission sorting by score or accuracy.
