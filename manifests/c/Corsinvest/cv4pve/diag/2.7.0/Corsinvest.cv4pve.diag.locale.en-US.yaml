  ──────────────────────────────────────────┼────────────────────┼────────────────────
  VM/CT PSI CPU, I/O, memory                │WG0029–WG0031       │CG0029–CG0031
  ──────────────────────────────────────────┼────────────────────┼────────────────────
  VM/CT health score                        │WG0032              │CG0032
  ──────────────────────────────────────────┼────────────────────┼────────────────────
