ReleaseNotes: |-
  This patch release contains a large number of minor and some noticeable enhancements and bug fixes. Thank you to everyone who contributed or spent their LLM tokens responsibly to help with this release!
  We have much more in the pipeline still, as AI has made contributions of all quality levels cheap and easy. We will be trying to go through them as quickly and efficiently as we can.
  Huge thank you to our sponsors for keeping the project alive with resources, and for our maintainers who triage and assist tirelessly in this relentless new age of AI.
  What's Changed
  - reverseproxy: replace placeholders specified for sni while using http3 by @WeidiDeng in #7737
  - caddyhttp: add {http.request.proto_name} placeholder for spec-compliant protocol names by @Jualhosting in #7782
  - httpcaddyfile: error on duplicate named_routes by @vijayvenkatj in #7800
  - cmd: colored error message in WrapCommandFuncForCobra (#7760) by @u5surf in #7768
  - chore: add missing "is" in SECURITY.md by @AliMickey in #7802
  - reverseproxy: validate on weighted_round_robin loadbalancing policy by @vijayvenkatj in #7807
  - forwardauth: error on duplicate uri subdirective by @vijayvenkatj in #7814
  - encode: add standard benchmark and conformance harness by @ottenhoff in #7804
  - caddyhttp: restore allow_underscore_in_headers server option by @bluegate-studio in #7809
  - rewrite: fix wrong index check in trimPathPrefix by @alhudz in #7812
  - intercept: fix replace_status being silently dropped by @oksusucha in #7810
  - fileserver: append repeated hide subdirectives instead of overwriting by @luccinmasirika in #7817
  - rewrite: scope keyed query replace to its named key by @alhudz in #7818
  - reverseproxy: log status 499 instead of 0 when client disconnects by @larrasket in #7827
  - tracing: fix BatchSpanProcessor goroutine leak on config reload by @Dean2026 in #7826
  - caddyhttp: normalize method names to uppercase in MatchMethod.Provision by @yintaisha in #7832
  - caddyhttp: add URL pattern request matcher by @dunglas in #7787
  - caddyhttp: fix escaped path matcher over-matching longer paths by @alhudz in #7828
  - core: preserve metrics registry in Context.WithValue by @dunglas in #7861
  - reverseproxy: compare sticky-session cookie hash in constant time by @alhudz in #7853
  - reverseproxy: fix misleading handle_response error for extra matcher args by @TowyTowy in #7869
  - reverseproxy: save dial info in a context key instead of a variable k… by @WeidiDeng in #7859
  - caddyhttp: fix path_regexp (MatchPathRE) Windows backslash bypass by @thientd in #7858
  - intercept: fix misleading handle_response error for extra matcher args by @TowyTowy in #7871
  - build(deps): bump cel-go from v0.28.1 to v0.29.2 by @techknowlogick in #7872
  - reverseproxy: fix broken reservoir sampling in random_choose policy by @TowyTowy in #7873
