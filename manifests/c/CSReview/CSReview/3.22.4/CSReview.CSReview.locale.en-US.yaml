ShortDescription: Counter-Strike 2 POV and 2D/3D demo review app synced with Steam Game Recording.
Description: >-
  CSReview reads your Counter-Strike 2 POV footage from Valve's built-in Steam Game Recording after every match and lines it up frame for frame with a 2D and 3D demo replay of all ten players. Inspect real CS2 voxel smokes, wall-aware line of sight, map control, CT/T intel fog of war, fight-by-fight aim stats, and timestamped coaching notes, or drag in standalone .dem files with no video recording required.
