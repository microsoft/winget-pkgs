ShortDescription: Windows radial shortcut menu, triggered by a whkd hotkey
Description: |-
  A Windows radial shortcut menu written in Rust, triggered by a global hotkey
  bound in whkd. Hold the hotkey, flick toward a segment, release — it launches
  an app, runs a shell command, or opens a nested ring.

  Designed to slot into an existing komorebi setup rather than compete with it:
  the same trigger model, the same IPC idiom, and the same config-file
  ergonomics. A long-lived daemon owns the overlay window so the ring appears
  instantly on every keypress.
