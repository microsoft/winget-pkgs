ShortDescription: A lightweight raster scratchpad for designers
Description: |-
  Cutout handles the quick bitmap fixes that come up while designing in Figma: cut out a background,
  pull part of an image onto its own layer, fill, erase, scale, line things up, then copy the result
  back to Figma or save it as PNG or JPEG. Paste, fix, copy back.
