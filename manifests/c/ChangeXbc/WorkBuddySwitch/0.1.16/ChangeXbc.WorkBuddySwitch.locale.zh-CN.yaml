ShortDescription: WorkBuddy（腾讯 AI 编程助手）多账号切换工具，支持账号切换、会话复制、自动签到、积分到期监控与 CodeBuddy CLI 自动轮换。
Description: workbuddy-switch 是 WorkBuddy（腾讯 AI 编程助手）账号切换工具，提供桌面 App（Tauri）和 npm webui 两种形态。多账号共享登录态（workbuddy-desktop.info），一键切换 WorkBuddy 登录账号，并支持将当前账号的会话复制给目标账号。主要功能包括：OAuth 扫码登录、从本机导入或手动添加账号；备份认证文件、关闭 WorkBuddy、写入目标账号并重启的账号切换；将当前账号勾选的会话以新 id 复制给目标账号；每日在配置时间段内随机时刻自动签到；Token 惰性刷新与每日保活；自动查询每个账号的积分资源、剩余量和到期时间；CodeBuddy CLI 独立切换与按积分紧迫度自动轮换；配置 GitHub Releases 源自动更新。
