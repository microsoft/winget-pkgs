PackageIdentifier: ChangeXbc.WorkBuddySwitch
PackageVersion: 0.1.16
PackageLocale: en-US
ShortDescription: A multi-account switching tool for WorkBuddy (Tencent AI coding assistant) that supports account switching, session copying, automatic daily check-in, credit-expiry monitoring, and automatic CodeBuddy CLI rotation.
Description: workbuddy-switch is an account-switching tool for WorkBuddy (Tencent AI coding assistant), available as a desktop app (Tauri) and an npm webui. Multiple accounts share the same login state (workbuddy-desktop.info), letting you switch the active WorkBuddy login account in one click and copy the current account's sessions to a target account. It supports OAuth QR-code login, importing accounts from the local machine, or adding tokens manually; account switching that backs up the auth file, closes WorkBuddy, writes the target account, and restarts; copying the selected sessions of the current account to a target account under new ids; automatic daily check-in at a random moment within a configured time window; lazy token refresh and daily keep-alive; automatic queries of each account's credit resources, remaining balance, and expiry; independent CodeBuddy CLI switching and auto-rotation by credit urgency; and automatic updates from GitHub Releases.
