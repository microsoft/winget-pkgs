ReleaseNotes: "# Musik v2.1.1\n\nFixes forced black backgrounds throughout the terminal UI.\n\n• Menus, playlists, favorites, playback text, and empty progress cells now use\n  the terminal's default background, matching the spectrum.\n• Colored selection highlights and filled progress indicators are preserved.\n• Regression checks cover default-background restoration, colored fills,\n  terminal colors, clipping, and batched rendering.\n\n## Updating\n\n```powershell\nmusik update\n```\n\nFor a new installation, download `Musik-Setup.exe`. A portable ZIP and SHA-256\nchecksums are also available."
