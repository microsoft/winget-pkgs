ReleaseNotes: "# Musik v1.5.0\n\nThis release adds a searchable keyboard guide, makes navigation easier, and fixes\nplayback-panel flicker and low-contrast text in the Spotify and SoundCloud themes.\n\n## Highlights\n\n• Open the keyboard guide from Home or with F1. Browse categories or search by\n  shortcut and keyword; return to your previous screen without losing typed text.\n• Press I on Home or in a song list to read the full song title, artist, duration,\n  and source in a scrollable details page.\n• Navigate longer lists with Page Up, Page Down, Home, and End. Song lists show\n  the visible range and total count.\n• The playback panel updates only changed text and progress cells instead of\n  repainting four times a second. Pausing, seeking, resizing, and returning from\n  other screens refresh the relevant parts correctly.\n• Spotify and SoundCloud themes use white labels and brighter gray instructions\n  for readable menus, song lists, and help text.\n• Improved layouts keep the player, status messages, and keyboard hints separate\n  in smaller terminals. Windows emoji widths are accounted for to protect borders.\n• Search accepts Q as text, preserves queries when opening help, and supports\n  starting another query with / from results.\n• Includes a complete keyboard and usage guide in the README and release packages.\n\n## Validation\n\n• 8,112 regression checks cover terminal text, playback rendering, theme colors,\n  playlist persistence, and playback queues.\n• Live terminal checks cover idle rendering, guide navigation, song selection,\n  favorites, and theme switching.\n\n## Updating\n\nExisting installed copies can update with:\n\n```powershell\nmusik update\n```\n\nDownload `Musik-Setup.exe` for a new installation, or use the portable ZIP.\nSHA-256 checksums are included in `SHA256SUMS.txt`.\n\nWinGet users can install with:\n\n```powershell\nwinget install --id CoderKinley.Musik --exact --source winget\n```\n\nThen run `musik update` if the catalog still lists an older version."
