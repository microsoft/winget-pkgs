ReleaseNotes: "# Musik v1.3.0\r\n\r\nThis release restores complete YouTube audio streaming and track downloading\r\nfollowing recent YouTube player API and bot-detection changes, integrating\r\nmodern stream extraction and self-contained binary bundling.\r\n\r\n## Highlights\r\n\r\n• Restored reliable YouTube audio playback with dedicated `yt-dlp` integration\r\n  for MPV, eliminating `HTTP 403 Forbidden` and `VideoUnavailableException` errors.\r\n• Enhanced audio track downloading with real-time percentage progress reporting\r\n  and automatic stream resolution.\r\n• Added automatic tool discovery and background bootstrapping for external\r\n  streaming dependencies.\r\n• Updated `YoutubeExplode` to 6.6.1 for updated metadata, search, and playlist\r\n  parsing.\r\n• Bundled `yt-dlp` into the release installer package for a 100% self-contained\r\n  out-of-the-box setup.\r\n\r\n## Interface and reliability\r\n\r\n• Maintained smooth IPC-based volume control, seeking, and pause/resume during\r\n  online stream playback.\r\n• Retained offline local music library support, lyrics synchronization, and JSON\r\n  settings backup/restore.\r\n• Improved fallback mechanisms for streaming and track downloading.\r\n\r\n## Updating\r\n\r\nExisting installed copies can update with:\r\n\r\n```powershell\r\nmusik update\r\n```\r\n\r\nNew users can download and run `Musik-Setup.exe` from this release.\r\n\r\n## Windows notice\r\n\r\nThe installer is not currently code-signed. Windows SmartScreen may show an\r\nunknown-publisher warning. SHA-256 checksums are included with the release."
