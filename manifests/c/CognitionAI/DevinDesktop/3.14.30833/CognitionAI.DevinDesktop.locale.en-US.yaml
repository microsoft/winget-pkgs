ReleaseNotes: |-
  Fixed
  - Collapsed sidebar flyouts, such as Bots, no longer close when you move the pointer to their header controls.
  - In a Devin Local session on a remote SSH host, pressing Enter while Devin is working now sends your follow-up message instead of returning “a turn is already running”.
  - In a Devin Local session on a remote SSH host, withdrawn tool approval prompts no longer leave the session status on “Waiting for approval” until the turn ends.
  - Devin Desktop now releases memory when you close tabs and uses less CPU while sessions update.
  - In the Agents view, Select Folder now accepts a completed folder path when you press Enter.
