ReleaseNotes: |-
  New
  - Devin Bots are now available: give a Bot an outcome to own in its chat, and it plans the work and runs sessions until the work is done.
  - Enterprise administrators can now turn on proxy auto-detection for the Devin Desktop language server on managed macOS, Windows, and Linux machines with the DetectProxy device policy or the devin.network.detectProxy setting.
  - The image viewer now includes zoom buttons and supports Cmd/Ctrl + +, -, and 0.
  Fixed
  - Repeated git push commands to the same branch and commit in a session’s worklog now collapse into one row.
  - Long streaming replies now use less memory when several sessions stream at once.
  - Devin Local now keeps images in a conversation until the model provider’s request limit is reached instead of removing them after 20 images.
  - Hidden background session tabs no longer start an embedded VS Code instance until you switch to them.
  - Updating Devin Desktop on Windows now closes a running Devin Desktop window automatically before the update starts and no longer leaves an old Devin.exe in the install folder.
  - In IDE mode, picking a page element or console output in a Devin Local session’s browser preview now adds it to the chat composer.
  - Scrolling, moving focus, and copying in a session or Devin Review page no longer act on a background tab when the same page is open in more than one Devin Desktop tab.
  - Turning “Use my ChatGPT plan” on or off now updates the model picker in open Devin Local chats immediately without reopening the tab.
  - Links inside cards in the Agent Command Center that previously ignored clicks now open in Devin Desktop or in your browser.
  - Playbooks that are shared with you for use only no longer show Edit or Delete buttons that fail when clicked.
  - On macOS, switching from the Agents view to the IDE with an IDE banner enabled now returns the window traffic-light buttons to the title bar.
  - Devin Local now retries a stalled model stream after 40 seconds instead of staying on “Running tools” for 4 minutes.
  - Long Devin Local sessions on Anthropic models now preserve the prompt cache across turns.
