ReleaseNotes: |-
  Fixed
  - Devin Desktop for Windows loads root and intermediate certificates from the Windows certificate store again, so sign-in and other HTTPS requests no longer fail with self signed certificate in certificate chain behind a TLS-inspecting proxy or a corporate root CA.
  - The edit, write, apply_patch, and notebook_edit tools in Devin Local now refuse to write through a symlink, so an approved edit can no longer be redirected to an unexpected file.
