ReleaseNotes: |-
  New Agent WindowThe Agent Window now runs the same interface as the Devin web app: the sessions sidebar, session view, Automations, Review, Wiki, settings, and Command Palette (⌘K) match app.devin.ai, and follow your Devin Desktop theme.
  - Sessions:
    - Drag a session from the sidebar onto an open session to view up to 8 sessions side by side.
    - Group sidebar sessions by workspace, with a ”+” on each group to start a session in that folder.
    - Start a child session from any session’s “More” menu.
    - Sessions grouped into Spaces now appear under a parent session in the sidebar.
  - Files, changes, and terminals in every session:
    - A Files view shows a local session’s working directory or a cloud session’s machine as a file tree next to the editor.
    - The Changes tab now works for local sessions, with per-file diffs and a “Since last seen” scope.
    - Terminal in a session’s add-tab menu opens a terminal on the session’s machine, or a local shell in the session’s folder.
    - Cmd/Ctrl+O opens a local file in the Agent Window, and Cmd/Ctrl+Shift+F searches the text of the session’s files.
    - Files open in the Agent Window’s editor support code actions and rename.
    - Select code in an editor tab and press Cmd/Ctrl+L to quote it into the chat.
  - Cloud sessions:
    - The IDE button in the top right opens a Remote SSH window on the session’s machine.
    - App previews open in a Preview tab, with a URL bar, port switching, device sizes, and an element picker.
    - Cloud sessions connected to your machine read unsaved edits from open editors.
    - Code scan sessions show a scan badge and open their Findings view beside the chat.
  - Customizations and settings now match the same UI as Devin Cloud.
  - New shortcuts: Cmd/Ctrl+. cycles the agent mode, Cmd/Ctrl+[ and Cmd/Ctrl+] go back and forward, Cmd/Ctrl+Shift+L copies a link to the session, and Cmd/Ctrl+Shift+E marks a session done. Typing anywhere focuses the composer.
  - Settings → Preferences → Appearance lets you pick the interface and code fonts and their sizes.
  Changed
  - Pressing Enter while Devin is working steers the running turn; Cmd/Ctrl+Enter queues the message until the turn ends.
  - Configured MCP servers can be @-mentioned.
  - The command palette searches the content of Local sessions, not only their titles.
  - On Windows, WSL distros can be used as remote agent hosts alongside SSH hosts, and remote hosts are listed in the Cloud / Local picker.
  - Devin no longer opens files in the background when it edits them. Turn “Auto-open edited files” back on in Devin Settings → Editor → User Interface to restore this.
  - Agent diff zones are off by default, so agent edits are applied directly to files. Re-enable them in Devin Settings → Editor → User Interface → Agent diff zones.
  - Agent edits are saved without running format-on-save or code actions. Enable “Run save actions on agent edits” to restore the previous behavior.
  - Worktrees are no longer deleted automatically once a repository has more than 19 of them.
  - Plugins can declare platforms: [cloud] or platforms: [local]; Devin Desktop only activates plugins that apply locally.
  Fixed
  - Electron 42.11.16 and Node.js 24.22.1 for the remote server, with the October 2026 security fixes.
  - Long sessions stay responsive while replies stream, and scrolling long transcripts is smoother.
  - MCP servers from every configured registry can be installed, not only those from the first registry.
  - MCP tool calls that need approval in Devin Local show their Allow / Reject controls.
  - Saving agent environment variables restarts the affected local agent, so new sessions use the updated values.
  - The “System notifications” switch in Devin settings now turns agent notifications on and off.
  - Ctrl+Shift+C copies in terminals again, and the Send Terminal to Chat shortcut works on Windows and Linux.
  - Markdown files of a cloud session open as a rendered preview again.
  - Dev Containers:
    - onCreateCommand, updateContentCommand, postCreateCommand, postStartCommand and postAttachCommand from devcontainer.json, Features and image metadata now run, and dotfiles are installed from remote.devinDevContainers.dotfiles.*.
    - remoteEnv, customizations.vscode.settings, extensions, forwardPorts and shutdownAction apply.
    - New Dev Containers: Rebuild Container and Rebuild Container Without Cache commands; a Rebuild prompt when devcontainer.json, the Dockerfile or the Compose file changes; a Reopen in Container prompt when you open a folder with a Dev Container configuration.
    - Slim images without curl, wget or procps work, and a Dev Container window is trusted when its host folder is trusted.
  - In IDE mode, a chat tab whose agent could not start a session says why and offers Retry, and enabling a third-party agent no longer shows “Failed to load more sessions”.
