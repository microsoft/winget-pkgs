ReleaseNotes: |-
  New

  - Added the in-app browser (Browser tab) to open web pages, local dev servers, and Devin Cloud exposed ports side by side with your session, with persistent cookies, element and area selection for chat, and agent browser control.
  - Shell code blocks in Devin Local chats now have an "Insert in terminal" button that types the command into the terminal prompt without running it.
  - Option-click (macOS) or Alt-click (Linux and Windows) on a session link now opens that session in a split pane next to the current session.
  - You can now Shift-click or Cmd/Ctrl-click title-bar tabs to select multiple tabs, drag them together, and close them with Cmd/Ctrl+W or the tab menu.
  - The right-click menu of a window tab now includes "Copy URL" for pages that have a web URL.
  - Devin Desktop now enforces the system.json MDM sign-in policy (enterprise_host and account_id) on macOS, Linux, and Windows.
  - On macOS, the chat composer now underlines misspelled words and offers corrections on right-click.

  Fixed

  - In Devin Local sessions, typing / after other text in the composer now lists skills so you can invoke a skill anywhere in a message.
  - Searching in the "Past Conversations" dropdown now matches message text in addition to session titles.
  - Cmd/Ctrl+J and Ctrl+` now open the bottom terminal panel from Devin Review, Wiki, Settings, and every other page, not only Home and sessions.
  - The Files tab and editor breadcrumb pickers in local sessions now hide files matched by files.exclude, matching the IDE Explorer.
  - The Files tab and IDE window of a cloud session now connect through your configured proxy instead of failing with ENOTFOUND or "Could not resolve hostname" on networks without direct internet access.
  - The save dialog for attachment downloads now opens in the folder you last saved a download to instead of the folder of the file open in the editor.
  - Right-click, then "Copy image" on an image sent in a Devin Local session now copies the image to the clipboard instead of showing "Failed to copy image".
  - On Windows, "Restart to Update" now stages the new version in a separate folder before replacing files, so canceling a blocked update leaves the installed app intact.
  - On Windows, a stopped update no longer leaves the newer version number in Windows Settings > Apps.
  - On Windows, removed the Alt+Tab and Alt+Shift+Tab default bindings for Next tab and Previous tab because Windows uses those shortcuts to switch applications.
  - On macOS, Cmd+Shift+V now pastes plain text in the chat composer and other text fields.
  - Remote SSH unknown host-key prompts now appear as a Yes/No dialog instead of a password box.
  - A rejected queued message in a Devin Local session no longer resends in a loop.
  - Resuming a finished subagent in a Devin Local chat no longer adds a duplicate empty card or leaves "1 subagent running" stuck after it finishes.
  - Sending /plan, /ask, /code, /smart, /fast, or /goal with text in a Devin Local session no longer hides the command and duplicates your text.
  - File citation chips in Devin Local sessions now keep their leading / and open the file after a window reload instead of staying on "Waiting for Devin to share this file...".
  - Ambiguous relative file paths in multi-root local sessions now stay as written instead of opening a file from an unrelated repository.
  - After rating a response in a Devin Local session, clicking the other thumb now updates the rating instead of locking on the first choice.
  - Choosing "Implement in Cloud" from the plan editor now opens a Cloud session instead of the default agent, and moving a plan into a new window keeps the plan preview.
  - Organization members with Local-only roles can now view and switch Sessions sidebar groupings instead of being forced to an ungrouped list.
