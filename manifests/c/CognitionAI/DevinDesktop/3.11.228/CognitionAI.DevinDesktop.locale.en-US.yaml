ReleaseNotes: |-
  Fixed
  - In Remote-SSH and Remote-WSL windows, the Agent Window folder picker correctly sets the session’s working directory. It lists the window’s remote folders and no longer offers local ones.
  - In Remote-SSH and Remote-WSL windows, file links in the Agent Window (citations, diffs, settings and plugins) now open from the remote machine.
  - The status bar no longer disappears after you switch from Agent mode to IDE mode.
  - On macOS, banners at the top of the window no longer interfere with the window controls.
  - IDE mode now offers Devin Cloud whenever your account has Cloud access, the same as the Agent Window. The “Devin for Cloud” team setting is removed.
  - The “Connect your GitHub account” callout now has a “Don’t notify me again” option.
  - A dropped connection during sign-in no longer signs you out. Devin Desktop retries instead.
  - Devin Local sessions load again after an update that previously left them failing with “Failed to list sessions”.
