ReleaseNotes: |-
  - Added a unified notifications setting that posts native OS notifications when any agent session finishes or needs your input.
  - Codemaps now open in their own editor tabs in agent window mode (home, generation, and individual codemaps), and codemap @-mentions now work in Devin Local. The Codemaps icon is also back in the activity bar in Agent Command Center mode.
  - Select text inside a message transcript and add it to the chat input with the “Add to chat” button or ⌘L / Ctrl+L.
  - Added keyboard shortcuts for permission requests (always-allow and reject), with the shortcut hints shown on the buttons and dropdown entries.
  - Refreshed the agent window UI: Inter font by default, web-app icon set at web-app sizing, rounded pill session tabs (with state/PR icons), and smarter pane placement so files no longer cover your session tabs.
  - Pull request editor tabs now show a state-specific icon (open, draft, merged, or closed), and session-create cards show a Devin mode badge (Fast, Ultra, Fusion).
  - Faster syntax highlighting for streaming diffs, and typing in the input no longer lags while other background sessions stream.
  - Agent sidebar improvements: right-click context menus, double-click to rename, per-workspace filters/sort/grouping, greyed-out locked (read-only) sessions, a new-session shortcut hint, and sticky grouped spaces that keep their header.
  - Signed-out session tabs now show a “You are signed out” sign-in prompt instead of an endless spinner, and logging out cleans up stale session tabs.
  - Editing a past message keeps consistent typography, and the edited prompt stays visible at the bottom after a revert.
  - Cascade, Devin Local, and every other ACP agent are now unavailable while a workspace is open in Restricted Mode, and hooks no longer load or run there.
  - Devin Local customizations has a new Plugins section listing the plugins it loads and the ones your repository, organization, or account offers.
  - Remote agent (ACP) sessions can now open a browser preview, the same workflow Cascade has: the agent proxies your local dev server, and the elements and console output you capture land in the agent’s message box as pending context. In Devin Desktop the preview opens in the built-in browser pane next to the agent.
  - “Open customizations” is now available from the new-tab menu in an agent space and from a Devin Local session’s sidebar context menu, and the Cascade panel’s ... menu now only offers the customization surfaces that apply to the agent you have open.
  - MCP servers reporting “Needs auth” now show an Authenticate button in the Devin Local MCP list, marketplace card, and detail page, which clears the stored OAuth credentials and reruns the browser authorization flow.
  - Models marked “Devin Local only” (including every GPT-5.6 variant) now appear disabled in Cascade’s model picker with a tooltip pointing you to Devin Local, rather than running degraded in Cascade.
  - Closing the last tab in the agent panel with the tab “x” now closes the panel instead of reopening a blank tab, matching Cmd/Ctrl+W.
  - Updated the base IDE to VS Code 1.126
