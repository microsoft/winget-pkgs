ReleaseNotes: |-
  Changed
  - Devin Local keeps working more often: a response that stops at the output limit before a tool call continues the turn, and GPT models no longer stop to ask for input they can work out.
  - Image reads in Devin Local take an image_size. The default sends 70% of the original’s longest side, at least 1024 px.
  Fixed
  - Follow-up prompts in a Devin Local session are no longer blocked when your Devin Cloud usage is restricted.
  - Files in a gitignored directory are no longer listed as created.
  - In the IDE, dragging a file or folder from the Explorer or an editor tab onto the Devin Local panel adds it to the input as a chip.
  - Child Devin Local sessions started in a Remote SSH window keep the parent summary.
  - A Mermaid diagram inside a collapsed <details> section draws correctly when the section is opened, in Markdown previews and session messages.
  - Saved codemaps no longer disappear on Windows.
  - The “Changes” pane’s “Since last seen” cut-off survives a tab switch and a restart.
  - “Mark unread” is available in the sidebar row menu for the open session and for local sessions.
