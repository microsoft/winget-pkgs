ReleaseNotes: |-
  New
  - In the Agent Command Center, open the ”…” menu in the session header to see its MCP servers, turn one on or off, or re-authenticate.
  - If a local agent rejects the first prompt, Desktop puts the text back in the composer and shows the reason. You can correct it and resend without retyping.
  Changed
  - The editor now uses VS Code 1.141.2 and Electron 43.8.3, which includes Chromium security fixes.
  - In IDE mode, opening Devin settings opens an editor tab instead of switching modes.
  - Chat diffs use your editor theme’s diff colors. Shell commands and code blocks in the transcript use its syntax highlighting.
  Fixed
  - A reopened Local session keeps its working directory and additional folders. Closing its tab no longer removes it from Past Conversations.
  - Click the filename on a Local plan approval card to read the full plan before approving it.
  - Permission requests from third-party ACP agents no longer crash the conversation view or prevent Desktop from reopening a session with a pending request.
  - Remote SSH now connects to hosts defined only in a custom remote.devinSSH.configFile.
  - On Windows, local edits save even when the agent uses a different capitalization for the filename.
  - Markdown previews are now supported in the Agent Command Center.
