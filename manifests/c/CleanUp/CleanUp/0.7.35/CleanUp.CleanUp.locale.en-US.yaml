ShortDescription: A Windows cleaner that shows you every file and setting before it changes anything.
Description: |-
  CleanUp clears junk files and app caches, removes preinstalled bloatware, turns off ads and tracking in Windows, manages startup apps, and updates your apps and drivers.
  Scans only look: CleanUp shows exactly what it found and how big it is, and nothing changes until you confirm. Settings changes can be undone from History, removed files go to the Recycle Bin, and documents, passwords and system files are never touched.
  The free version includes cleaning, optimizing, storage analysis, the uninstaller, startup manager and undo. CleanUp Pro adds automatic maintenance, one-click updates and more.
