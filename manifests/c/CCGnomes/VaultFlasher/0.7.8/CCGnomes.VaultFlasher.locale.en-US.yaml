ShortDescription: One-click USB flasher for Vault Node images
Description: Vault Flasher downloads the official Vault Node image, verifies its SHA-256 against the release's published digest, and writes it to a removable USB drive with a single click — with a read-back verification pass and optional WiFi presetting. It only ever offers removable USB drives (never an internal or system disk) and re-validates the target inside its elevated writer.
