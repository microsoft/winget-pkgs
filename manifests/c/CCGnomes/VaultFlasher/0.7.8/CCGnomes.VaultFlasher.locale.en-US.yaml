ReleaseNotes: "# Vault Manager v0.7.8\n\n**You can now invite one of your apps into a space your node stores.** Until now, if a space lived on\nyour node — the storage your website fills, for example — there was no way to let VaultDocs or\nVaultDrive open its files：your desktop apps had only *joined* that space, so they held no key to\nshare it, and the only link Vault Manager could make was a *management* invite, which those apps\ncorrectly refuse. This release adds the missing generator.\n\n## Invite an app to a space on this node\n\nA new section, **\"Invite an app to a space on this node\"**, appears once you're managing a node.\n\n• Pick one of the spaces your node stores, and press **Create invite link**.\n• You get a copyable link and a QR code. Open **Accept an invite / connect a space** in the app you\n  want to let in — VaultDocs or VaultDrive — and paste it (or scan the QR).\n• Anyone who opens the link **joins the space immediately** — the one-time link *is* your approval, so\n  there is nothing extra to click here.\n\nIt sits alongside the two links Vault Manager already makes, and each now says plainly what it is for\nso they can't be confused:\n\n• **Give another app access** hands a *website* management of the node.\n• **Add a device to this node** connects a *phone* that just uses the node.\n• **Invite an app to a space** — this one — hands an app the *files* in one space.\n\nThe link itself is minted by your node and handed to you unchanged：it is the same standard space\ninvite VaultDocs and VaultDrive already understand, so nothing about it is reshaped by Vault Manager.\n\n## Verification\n\n• **246 unit tests** (5 new)：a good reply is read into a mint with the invite token kept *verbatim*;\n  the `auto`/`approve` grant mode survives to the screen; an error envelope inside a `200`, or a reply\n  with no invite, is a failure; and the mint's error copy names the mint's own failures (an old node,\n  a scope refusal, a personal space) rather than borrowing the join-approval screen's wording.\n• The mint is a **§4 signed request at manage scope** — the same signing Vault Manager already uses to\n  read the join queue and mint a management invite — never the owner token.\n• Guards green：the invoke-args guard confirms the new command and its screen agree; the\n  surface-purpose guard (now covering all four connect/invite surfaces, self-test 6/6) pins each\n  surface's *what it's for / the other half / when not to use it*.\n\n**Still owed — the live end-to-end.** Minting a real link and redeeming it in VaultDocs/VaultDrive\nneeds a node paired into Vault Manager on this computer. The generator is complete, built and tested;\nthe round-trip cert is the same live test its neighbours owe.\n\n## Downloads\n\nPublished under both `VaultManager-*` and `VaultFlasher-*` names; the bytes are identical.\n\n```\nNSIS setup.exe  sha256  d60cf09cb5cc33622a4a62f4b2f3793564d7169637df2e60a86207bad6f97838\nMSI             sha256  0ebe20441ad5438b2d0647497d8b75c88647ae9cefeaa79931f746f9ea38ee0a\n```"
