ShortDescription: Just a command runner
Description: just is a handy way to save and run project-specific commands. Commands, called recipes, are stored in a file called justfile with syntax inspired by make
ReleaseNotes: |-
  Breaking
  - Require unicode paths (#3708 by casey)

  Added
  - Allow --working-directory without --justfile (#3720 by casey)
  - Allow --usage with module path to show usage for all recipes in module (#3718 by casey)
  - Add [cache(environment)] to add and remove variables from cache key (#3696 by casey)

  Fixed
  - Only emit byte order mark for Powershell on Windows (#3745 by casey)
  - Handle minified JSON in install script (#3737 by casey)

  Changed
  - Pass justfile to default chooser via environment variable (#3742 by casey)

  Misc
  - Allow fixme and xxx in bin/forbid (#3734 by casey)
  - Ignore broken pipe errors when printing to standard output (#3733 by casey)
  - Use snake case lint names in Cargo.toml (#3732 by casey)
  - Display Chinese text using sans-serif font family (#3727 by casey)
  - Add lang=zh to Chinese manual link (#3724 by casey)
  - Yield module and recipe paths in tree order (#3717 by casey)
  - Complete arguments for --clean and --list (#3716 by casey)
  - Use consistent spacing in --usage output (#3715 by casey)
  - Add GitHub Actions workflow lockfile (#3714 by casey)
  - Use snafu context selectors (#3711 by casey)
  - Unwrap in justfile_directory() (#3710 by casey)
  - Update tabled dependency (#3709 by casey)
  - Optimize CI (#3706 by casey)
  - Remove function name from function error messages (#3705 by casey)
  - Remove unused JUST_LOG export (#3701 by casey)
  - Document [cache(environment)] (#3697 by casey)
  - Escape list heading default newline in man page (#3692 by casey)
