ReleaseNotes: |-
  - fix(android): 使用应用内浏览器窗口打开虚拟组网授权页，复用浏览器已有登录状态，返回应用后立即刷新连接状态。
  - fix(app/server): 区分恢复连接与重新登录，仅在明确需要认证时发起授权，避免节点启动或重连期间重复授权。
  - fix(android): 手机组网恢复独立于设置页，节点就绪后立即刷新服务器状态并恢复连接，结束旧的重试等待和失效通道握手。
  - fix(android): 普通系统回收不再因未完成的状态查询而暂停自动恢复；保留原生崩溃保护，并提供明确的恢复连接入口。
  - test: 增加登录恢复、状态竞态与连接重试回归覆盖，将 Android 恢复策略测试接入构建流水线。
