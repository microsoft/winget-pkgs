ReleaseNotes: |-
  - 调整服务器、控制端和被控端设置页布局，统一连接入口、设备发现及状态展示。
  - 桌面端支持通过内置虚拟组网节点发现并连接同一 Tailnet 中的电脑。
  - 虚拟组网登录、恢复和授权状态统一显示在标题旁，移除桌面端和手机端的重复提示。
  - 统一顶栏、运行时面板和服务器列表的健康状态，准确区分工作进程未就绪、OMP 缺失与运行时就绪，并在恢复后同步更新。
  - 修复已登录账号时重复显示扫码配对入口的问题，调整中转搜索入口至被控端。
  - CI 增加虚拟组网 Go 测试，并覆盖运行时健康状态恢复与同步。
