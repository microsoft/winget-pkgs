ReleaseNotes: |-
  - DS 远程接入原有服务器切换，桌面和手机沿用当前界面，保留其他服务器配置。
  - 修复 DS 手机握手、在线状态及隧道业务请求鉴权，支持通过隧道访问后端 HTTP 和 WebSocket。
  - 桌面和手机重启后恢复上次选中的 DS 电脑，重新申请租约；连接恢复期间可随时切换其他服务器。
  - 纯 API 后端启用 DS 不再依赖网页资源；静态网页保留现有地址加密钥直连。
  - 完善原生网络重试、隧道凭据隔离与 CI 回归覆盖。
