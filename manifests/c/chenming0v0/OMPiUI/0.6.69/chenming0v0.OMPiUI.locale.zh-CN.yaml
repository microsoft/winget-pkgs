ReleaseNotes: |-
  - fix(app/server): 排队消息点击上箭头「立即发送」后的待消费状态由后端共享，电脑和手机同步移入对话末尾，刷新、重连及原生历史接手时不重复显示。
  - fix(app): 同地址后端重启后重新登记活跃工作区监听，恢复后续文件、预览与 Git 变化通知。
  - fix(app/server): 模型及供应商以最新成功保存的整份配置覆盖旧表单，包括未保存修改；模型角色、标题提示词、官方设置和预览设置保存成功后广播更新，避免旧草稿回滚远端配置。
  - fix(app/server): GUI 终端归属于私有客户端凭据，隔离列表、实时与历史事件、连接票据、输出和操作；保留创建端刷新重连，禁止自动认领旧无归属终端。
  - feat(app/server): 思考翻译任务和缓存由后端管理，复用稳定块身份贯穿实时到历史交接；成功分片原子保存，新思考和追加尾部不覆盖已提交译文，原文真实修订只使受影响结果失效。
  - feat(app/server): 思维翻译者增加后端共享的自动并发配置，默认 5、支持 1–32；阅读优先、可视区按需翻译、邻近预热最多占 1 个位，主动展开首片段可临时超额立即执行，单端断连不取消已发出的共享任务。
  - feat(server): 真实前台阅读续期翻译缓存，超过 30 天无阅读且无活跃租约时仅清理派生数据，不修改官方会话历史。
  - fix(app): 合入 PR 497，统一 select/ask 芯片式选项，并在展开问答胶囊时滚到对话底部。
  - test: 增加实时到历史组件交接、共享翻译调度和恢复、配置强制覆盖、监听重连与终端归属隔离回归；修正 Windows 同大小改写用例的时间戳粒度依赖。测试仅由 GitHub Actions 执行。
