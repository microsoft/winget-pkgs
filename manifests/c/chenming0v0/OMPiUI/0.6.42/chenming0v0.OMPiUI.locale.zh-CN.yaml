ReleaseNotes: |-
  - fix(pty): 同一个自有 ConPTY 成功请求停止后，不再由 remove／dispose／shutdown 重复关闭原生句柄；保留真实 onExit 屏障，只有停止调用失败时才允许重试。Node 22.23.4 原生 shell 计算、输出、回放、删除及完整 shutdown 实跑，停止调用由 3 次降为 1 次；原生套件等待实际退出，移除强制退出看门狗。
  - fix(worktrees): 显式 Git worktree 变更先解析物理目标及缺失路径的既有父目录，与 Git 的 junction／symlink 路径身份一致；同一物理路径同时用于变更准入、忙碌检查和 Git 操作。Node 22.23.4／Git 2.56.0.windows.2 真实 junction 场景由错误 FORBIDDEN 修正为 WORKSPACE_BUSY；primary 拒绝、空闲删除及保留分支实跑通过，不放宽锁定／脏目录保护。
  - fix(types): 服务端保持 ES2022 输出目标及原有环境类型，仅补入支持的 Node 22 原生 Promise.withResolvers 标准库类型，不以构造器绕过编译契约。
  - verification(pty): 同一后端源码以 Bun 1.3.14 编译为 Windows 可执行文件后，原生 shell 计算／回放／删除／dispose／shutdown 实跑通过；停止一次，确认自有 PID 实际退出后再关闭 PTY，不把 Bun 的资源释放误计为第二次停止。
  - fix(pty): 补齐既有 @lydell Windows 补丁的自然退出路径，输出 socket 排空关闭后释放 ConPTY 输出 worker，不再由残留 MessagePort 钉住 Node 进程。真实 Node 22.23.4 shell exit=0／计算 742 后，引用端口由修复前 1 个变为 0 个，进程自然结束；不恢复强制退出看门狗，不在退出后再次 kill 原生句柄。
  - verification(pty-gui): 最终 Web 生产构建连接真实 Node 22.23.4 原生 PTY，在网页新建通用 shell，计算得到 742，刷新后保留回放，关闭页签后再新建得到 743，页面错误列表为空。页签关闭不冒充底层 PTY 退出；实际停止／自然退出由独立原生 smoke 证明。此隔离服务的 Agent driver 为 mock（无 LLM），不替代官方 OMP／会话互通验收。
  - fix(paths): 文件与静态资源边界统一使用既有的 native realpath 约定；解析直接重解析别名时区分物理父目录，显式删除仅移除别名，不递归触及目标目录。真实 Node 22.23.4 隔离 junction 曾绕过普通 realpath 检查并通过 HTTP 读出样本目录外文件；修复后网页首页 200、越界资源 404，工作区拒绝越界，别名写入／移动／删除后目标字节保留。
  - test(isolation): HTTP 文件操作的锁与状态目录放入既有独立临时夹具，不再尝试在用户 ~/.ompiui 下 mkdir；失败断言保留实际服务端响应。worktree 夹具按生产注册约定规范化 Windows TEMP 的物理路径；所有目录链接先拆除再回收夹具，不放宽忙碌／工作区替换或越界断言。
  - fix(rename): 物理路径解析只用于身份与边界，重命名目标仍保留用户请求的 basename；Windows 仅大小写变更不再被规范化回旧拼写而报目标存在。真实 Node 22 与 Bun 编译程序检查实际目录中的 README.txt 拼写及字节保留，永久回归不再只检查返回参数或大小写不敏感的读取。
  - verification(native-final): Node 22.23.4 服务端 typecheck 与完整 52 文件套件通过（315 通过、1 可选跳过），无强制退出，约 65 秒正常结束；同源 Bun 1.3.14 编译程序的别名写入／移动／删除、大小写重命名、工作区与实际 HTTP 静态边界通过。
  - test(search): 搜索夹具与生产工作区一样先解析 Windows TEMP 的物理路径，I/O 拦截器不再因 RUNNER~1 等短路径漏掉真正读取而永远等待 ready。保留共享取消／队列释放的全部行为断言，不添加强制保活或取消豁免；实际规范工作区的取消请求拒绝、共享消费者读到完整结果已实跑。
  - fix(notices): 原生 open_url 的 link 通知归为 info，并恢复已有 link 历史为有效严重度；保留原始链接与说明，不再因图标映射缺失导致通知界面异常。实际生产桥接事件与历史加载回归通过。
  - fix(goals): 删除已退出生产流程的 formatGoalMessage 旧提示生成器；原生 Goal 生命周期不再创建私有文本续跑标记。历史目标仍只读解析和展示，历史目录/字节保留回归通过。
  - verification(git): 实际 Git 暂存 rename 两端、字面路径和 worktree 后代 shell 删除保护 20 项通过；网页已打开的非活跃预览保留，冷 scope 指定文件及后续消失回退 19 项通过。永久 shell 保护回归隔离原生 PTY 句柄，真实 GUI shell 行为单独验收。
  - test: 修正原生空命令目录与已 settled 的空闲运行时夹具，删除仅固定占位按钮展示的断言，不放宽生产协议失败或回收门禁。worker/server 62 项、PiChatPane 11 项、通知/事件 34 项回归通过。
  - verification: 集成候选的原生 CLI↔GUI 同文件继续、只读字节/mtime、最新备份与历史迁移 smoke 通过；原生/托管递归 depth=0/1/2/3/-1、10 个并发子任务、实时转录及父关联通过。未据此声明全部 issue 或 Windows 安装升级已验收。
  - fix(worktrees): 原生 relocation 在任何 await 前关闭提交准入，并等待已完成但尚未投递的 async 结果；移动期间消息／Steer／Follow-up／取消并发送明确拒绝，显式 Stop 仍可用。真实 HTTP／原生同文件继续及双物理窗格验收通过，worker/server 67 项回归通过。
  - verification(goals): 完整 GUI 实测原生目标预算 128→256、清空预算、暂停后放弃且保持会话身份；正整数预算校验与真实 PNG 剪贴板粘贴拒绝通过。扩展混合描述、空值、两类编辑器、Chrome composition、按 targetId 取消及真实 timeout／三请求队列结算通过；原生导出菜单与实际 HTML Light/Dark 切换通过，导出前后会话字节／mtime 不变。
  - verification(windows): 可弃置 Windows runner 的真实 0.6.41→0.6.42 候选 69649f4 安装／升级通过（run 40237794673）；两类快捷方式字段及完整文件哈希保留，原生 WebView 通过原项目创建新会话并在同一 JSONL 继续两轮。每个发布安装器均按其精确源码／产物独立执行同样验收，不能把旧候选证明套到新字节。
  - limitations: 官方 OMP 18.12.6 的公开 GUI/RPC 边界仍阻塞 Plan／审批、Loop、Vibe、Collab、录制／屏幕流、Guided Goal、自定义组件、同次模型工具 PTY，以及子任务 run 排序／合并状态／ask note 关联；Voice 媒体交接及真实账户验收缺独立授权前提。对应 issue 保持 open，不以终端入口、私有控制器或影子状态交付。
  - fix(models): 原生只支持 off 的首页控件明确显示禁用 Off；切换服务器时重新读取目标服务器的模型／思考偏好，不沿用旧服务器 Max 后首次发送悄悄用 High。两套真实独立后端的 Max／Low、切回恢复、草稿保留和设置／scope 矩阵已实测。
  - fix(commands): Slash prompt／sendUserMessage 保持 HTTP 到原生 300 秒处理期限后（330 秒），abortAndPrompt 纳入回合级 worker 期限；不再于普通 20／60 秒期限把仍等待原生终态的操作判成未知。真实 23 秒扩展输入与 65 秒图片原子中断＋Stop 均获得原生 200；成功按提交快照清理，更新后的文字／图片保留。
  - verification(async): 补齐原生运行中 stdout／普通 stdin 拒绝、同服务空 Enter、port／log＋port ready、同名 replace／歧义报错、跨 workspace／exec 批准、干净最后 owner 退出、task／eval 独立配置及同文件 CLI 顺序继续；只读重开不启 writer，全局 config／models 字节和 mtime 不变。
  - limitations(feedback): 两套真实后端通知归属、原生三种严重度、全局预授权 URL 与本地 decoder 有界故障已实测；#367 仍缺会话级公开 open_url、真实原始 encoded chunk／overflow 故障输入及官方 rpc_stream_error emitter。正常照片读取或全局 OAuth 流不能冒充这些证明，未制造极端重复通知或伪协议帧。
  - limitations(session): #361 的队列／资源／草稿／已提交身份与迟到投影隔离已实测；但真实旧扩展在原生 new 后抛错会被原生发送到新事件流。18.12.6 extension_error 仅有 extensionPath／event／error，缺源 session／prompt／epoch，无法安全区分迟到旧错误；保留阻塞，不忽略全部异常或提前恢复旧回调。
  - limitations(vision): 按用户选择，不使用现有密钥／付费视觉模型做额外识别验收；#375 已证明真实原生菜单、图片传输／归一化、@file 内容与失败／在飞草稿保护，真实视觉模型读取能力仍保留验收缺口。message:fileMention 的未支持显示单独披露，不把传输成功写成完整 renderer／视觉验收。
  - verification(final): 统一构建通过；protocol 26、worker 275（13 跳过）、server 315（1 跳过）、admin 19、relay 59、tui 16、app 1618 项回归通过，lint 0 error／28 warning。最终生产构建实跑原生 23 秒扩展对话并得到 HTTP 200／精确清理已提交草稿；真实 rejected task 无子代理、原始拒绝可展开、无虚构等待，刷新后原生 history 字节／mtime 不变。隔离夹具已改为明确 CommonJS 与身份／内容契约，不固定探测到的 SDK 版本标签。
