PrivacyUrl: https://github.com/Cem-Kaya/oku_read_public/blob/main/PRIVACY.md
PackageName: OkuRead
PackageUrl: https://github.com/Cem-Kaya/oku_read_public
License: Proprietary
ShortDescription: On-device screen OCR for screen readers.
Description: |-
  OkuRead makes text rendered as screen pixels available through Windows accessibility
  and optional replacement text. A whole-screen snapshot remains available until it
  is refreshed or closed. The application runtime is offline.
  Setup requires internet access to download verified Medium OCR models. Installation
  does not require a GPU. The first OCR request prepares TensorRT engines locally
  and offline, with a progress window. OCR use requires a supported NVIDIA RTX GPU and compatible driver.
  Displays driven by Intel or AMD integrated GPUs are currently unsupported.
Moniker: okuread
Tags:
- accessibility
- ocr
- screen-reader
ReleaseNotesUrl: https://github.com/Cem-Kaya/oku_read_public/releases/tag/v0.2.5
InstallationNotes: |-
  Setup downloads models without requiring a GPU. The first OCR request prepares
  engines offline with a progress window. Start with Windows is off by default. Ctrl+Alt+G opens or closes
  a snapshot. The MSI is unsigned.
ManifestType: defaultLocale
