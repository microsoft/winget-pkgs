ShortDescription: Virtual printers that keep a visual, searchable history of everything you print.
Description: 'Virtual Printer creates virtual printers on Windows and keeps a visual history of every job: PDF documents and POS receipts (ESC/POS) received over USB (as a Windows printer) or over the network (port 9100). Receipts are rendered as a thermal printer would, with logos, barcodes and QR codes. Search by content, view every page, export the original or resend a receipt to a real receipt printer. Free to use.'
