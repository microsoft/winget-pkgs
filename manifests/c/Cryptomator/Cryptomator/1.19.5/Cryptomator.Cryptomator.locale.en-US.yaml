ReleaseNotes: |-
  For a comprehensive view of changes, read the CHANGELOG.
  Security Fixes 🚨
  - Windows: Fixed a standard user being able to plant the admin config C:\ProgramData\Cryptomator\config.properties before installation and thereby make other users load arbitrary plugins. The installer now secures the directory before writing into it and Cryptomator ignores the admin config unless it, its directory and all ancestors are owned by SYSTEM, Administrators or TrustedInstaller and cannot be modified by other principals (#4362)
  What's New 🎉
  - Supporter certificates signed via a certificate chain (x5c header) are now accepted (#4171)
  - Improved usability of the trust on first use dialog (#4295)
  - Masterkey files whose scrypt parameters require more than 64 MiB of memory are now rejected before key derivation, with a dedicated error dialog on unlock and password change (#4355)
  Bugfixes 🐛
  - Fixed "Locate encrypted file" opening the file instead of revealing it in the file manager on Linux (#4272)
  - Fixed password retrieval from keychain not working while the system keychain is locked on Linux (#4294, #4301, #4302)
  - Fixed keychain backend and quick access settings being reset when the selected service was unavailable at startup (#4346)
  - Fixed changing the keychain backend leaving the Hub device key behind; the previous backend is now kept if moving the saved passwords fails (#4346)
  - Fixed Hub unlock failing until manual cleanup when the device key file and its stored passphrase did not match (#4346)
  - Fixed stucked/hanging vault (no directory listing or vault lock possible) by single broken directory link file (e.g. an empty dir.c9r) (cryptomator/cryptofs#365)
  Other Changes 📎
  - Added Maven profile to run the app from the command line (#4317)
  - Updated to JavaFX 25.0.5 including several (security) fixes (see release notes) (#4356)
  - Updated Flatpak runtime to Freedesktop 26.08 (#4352)
  - Updated translations (#4261)
  - Updated dependencies:
    - org.cryptomator:cryptofs from 2.10.0 to 2.11.1
    - org.cryptomator:cryptolib from 2.2.2 to 2.4.0
    - org.cryptomator:fuse-nio-adapter from 6.0.1 to 7.0.0 (#4353)
    - org.cryptomator:integrations-api from 1.9.0 to 1.10.0
    - org.cryptomator:integrations-linux from 1.7.0 to 1.8.0
    - org.cryptomator:integrations-mac from 1.5.0 to 1.5.1
