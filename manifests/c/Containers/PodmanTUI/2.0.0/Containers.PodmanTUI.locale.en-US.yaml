n https://github.com/containers/podman-tui/pull/790\r\n\r\n## Security Fixes\r\n\r\n• [CVE-2026-39833](https://access.redhat.com/security/cve/CVE-2026-39833) golang.org/x/crypto/ssh/agent：Security bypass due to unenforced key confirmation\r\n• [CVE-2026-46597](https://access.redhat.com/security/cve/CVE-2026-46597)  golang.org/x/crypto/ssh：Denial of Service via crafted AES-GCM packet decoder inputs\r\n• [CVE-2026-39831](https://access.redhat.com/security/cve/CVE-2026-39831)  golang.org/x/crypto/ssh：Security key bypass due to missing user presence check\r\n• [CVE-2026-41178](https://access.redhat.com/security/cve/CVE-2026-41178) OpenTelemetry-Go：Denial of Service via oversized baggage headers\r\n• [CVE-2026-57231](https://access.redhat.com/security/cve/CVE-2026-57231)  Information disclosure via malicious container image environment variables\r\n\r\n## New Contributors\r\n• @tony-sol made their first contribution in https://github.com/containers/podman-tui/pull/797\r\n• @damiensawyer made their first contribution in https://github.com/containers/podman-tui/pull/752"
