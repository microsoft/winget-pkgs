ShortDescription: Share your screen and your PC's sound with friends, straight from PC to PC (P2P). No server, no account.
Description: |-
  Discordia is a free Windows app to share your screen and your PC's audio with friends, directly from PC to PC (peer-to-peer).
  There is no server in the middle and no account: create a room, send the link and your friends join.
  Features: 720p/1080p at 30 to 144 fps, native GPU capture for games, PC audio leaving out the apps you choose,
  an overlay on top of full-screen games, several people sharing at once, automatic updates,
  and an interface in Portuguese, English and Spanish. Friends can also watch from a phone browser.
