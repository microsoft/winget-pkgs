ReleaseNotes: |-
  This release is setting up ground for some upcoming features in v4 and v5. Most importantly it patches a [security vulnerability in node](https://thehackernews.com/2026/10/brotli-decoder-flaw-behind-nodejs-rce.html) and we recommend all users to upgrade

  ## Whats better

  • MCP tool has been extended to instruct agents on how to create custom views and style Ontime views
  • Rundown titles can now contain any UTF characters and have consistent parsing throughout thanks to @theluckystrike
  • The cuesheet has been reworked to improve rendering times and feel smoother in older devices or busy browsers
  • Ontime can now restore auxiliary timer in case of a process exit

  We also have several improvements to processes and memory management as well as small tweaks to the interface and user experience

