ReleaseNotes: "Brand new release with a great feature and several improvements focusing on overall improvements to the user experience of Ontime. Also some lots of groundwork for v5 ⭐ \n\n## Whats new\n\n• New teleprompter with standalone, controller and follower modes. Keyboard shortcuts and companion control included\n\n## Whats better\n\n• The welcome modal gives more feedback on the startup state (like resuming a previous session)\n• Logging has been refactored to improve debugging of complex setups including automations \n\nWe have also included several minor bug fixes, style tweaks and performance improvements\n\n## What's Changed\n• fix(client)：loading Button stays disabled, swapped WS packet aliases by @cpvalente in https://github.com/cpvalente/ontime/pull/2312\n• small UX tweaks from user feedback by @cpvalente in https://github.com/cpvalente/ontime/pull/2319\n• improvements to excel flow by @cpvalente in https://github.com/cpvalente/ontime/pull/2320\n• fix(client)：align matchGroupDuration with other entry actions by @cpvalente in https://github.com/cpvalente/ontime/pull/2324\n• fix(client)：do not mutate cache in optimistic entry delete by @cpvalente in https://github.com/cpvalente/ontime/pull/2323\n• refactor(server)：rundown router uses the central error handler by @cpvalente in https://github.com/cpvalente/ontime/pull/2325\n• upgrade dependencies by @alex-Arc in https://github.com/cpvalente/ontime/pull/2321\n• fix(e2e)：url preset race and run the suite below a router prefix by @cpvalente in https://github.com/cpvalente/ontime/pull/2326\n• fix(editor)：edit the entry under the cursor when several are selected by @cpvalente in https://github.com/cpvalente/ontime/pull/2310\n• refactor(auth)：validate login redirect target by @cpvalente in https://github.com/cpvalente/ontime/pull/2322\n• fix：typeing in expressStaticGzip by @alex-Arc in https://github.com/cpvalente/ontime/pull/2330\n• refactor(teleprompter)：improve ux by @cpvalente in https://github.com/cpvalente/ontime/pull/2329\n• refactor：improve logging by @cpvalente in https://github.com/cpvalente/ontime/pull/2332\n• fix(rundown)：stop the list jumping on edits and clicks by @cpvalente in https://github.com/cpvalente/ontime/pull/2311\n• improve welcome flow by @cpvalente in https://github.com/cpvalente/ontime/pull/2309\n• refactor gap calculations by @cpvalente in https://github.com/cpvalente/ontime/pull/2308\n• fix(share)：load URL presets in the generic share menu by @cpvalente in https://github.com/cpvalente/ontime/pull/2341\n• refactor(pip)：polish PiP view indicators by @cpvalente in https://github.com/cpvalente/ontime/pull/2346\n• chore：upgrade node to 24.22.3 by @alex-Arc in https://github.com/cpvalente/ontime/pull/2344\n• refactor(navigation)：keep the editor layout when navigating to settings by @cpvalente in https://github.com/cpvalente/ontime/pull/2359\n• feat：confirm before deleting the running entry by @cpvalente in https://github.com/cpvalente/ontime/pull/2357\n• feat：follow running event in rundown by @cpvalente in https://github.com/cpvalente/ontime/pull/2356\n• fix(editor)：render title list once its scroll parent mounts by @cpvalente in https://github.com/cpvalente/ontime/pull/2361\n• fix(client)：select with the events-only index everywhere by @cpvalente in https://github.com/cpvalente/ontime/pull/2360\n• feat：link back to cloud from navigation by @cpvalente in https://github.com/cpvalente/ontime/pull/2355\n• Feat：teleprompter reverse by @alex-Arc in https://github.com/cpvalente/ontime/pull/2328\n• chore：bump v4.15.2 by @alex-Arc in https://github.com/cpvalente/ontime/pull/2370\n• bump version to 4.16.0 by @cpvalente in https://github.com/cpvalente/ontime/pull/2377\n\n\n**Full Changelog**：https://github.com/cpvalente/ontime/compare/v4.15.1...v4.16.0"
