ReleaseNotes: |-
  This is the last planned batch of work related to user experience and we start moving the work towards enabling the upcoming sync mode

  ## Whats better

  • The previous changes to the websocket management made it that poor connections could be considered as stale and closed from the server. We have removed the logic to keep connections as long as possible, even with large inactivity gaps
  • The share link interface has been reviewed to make it simpler to use and to ensure that we have good communication around the generation and management of the link itself
  • The CSS override interface has been simplified with the removal of redundant actions and confirmation dialogs for destructive actions
  • The websocket connection is now more aggressive on reconnecting and provides better results for users that are in network with intermittent drops
  • Pausing an event over midnight now gives the correct offset on resume

  We have also included several changes in the data types to enable the upcoming sync as well as minor bug fixes and UI polish tweaks

