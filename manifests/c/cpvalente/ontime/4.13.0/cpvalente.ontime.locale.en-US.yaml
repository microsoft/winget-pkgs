ReleaseNotes: |-
  We continue on a mission to improve the user experience for Ontime
  Whats new
  - Users can now use the Finder feature to deeply search any field in the rundown. This means that an operator can answer the question "how long until Karen is on stage" in 10 seconds.
  - The timer view now has an opt-in feature where you can hear a sound playing when the timer reaches the end

  Whats better
  - The navigation menu and view configuration menus have been redesigned to make settings easier to find and discover
  - You should be able to install Ontime as a PWA thanks to @SMPTY work
  - When following groups, or items in groups in the operator and countdown view. The group headers are kept in view for as long as the group is playing
  and several small tweaks, bugfixes and performance improvements

  What's Changed
  - chore: upgrade dependencies by @cpvalente in #2173
  - accept bearer token by @cpvalente in #2172
  - tanstack table 9 by @cpvalente in #2176
  - Polish navigation menu and view params editor by @cpvalente in #2177
  - docs(llms): setup agents documentation by @cpvalente in #2180
  - fix: prevent stale rundown cache on rename by @cpvalente in #2179
  - test(rundown): improve rundown utils coverage by @cpvalente in #2181
  - Replace structuredClone with shape-aware clones in rundown/data hot paths by @cpvalente in #2178
  - chore(license): resolver has permissive license by @cpvalente in #2184
  - feat(finder): deep search in all fields with filter by @cpvalente in #2174
  - bump version to 4.13.0 by @cpvalente in #2186
  - feat(timer): play a sound when the timer ends by @cpvalente in #2182
  - fix(client): fix PWA manifest so "Install as App" works properly by @SMPTY in #2192
  - fix: scroll maintains group header by @cpvalente in #2191

  New Contributors
  - @SMPTY made their first contribution in #2192
