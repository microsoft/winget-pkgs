ReleaseNotes: |-
  This release is full of server improvements and some rounding up of features as groundwork for what is coming up. We are excited to put it all together in a sequence of great features and a new v5 release.

  ## Whats new

  • Both the timeline and the studio clock views can now show a user chosen secondary text field
  • The logging system was reviewed with new features to help debugging connections and issues in Ontime
  • The desktop app can now warn users when new versions are released

  ## Whats better

  • The countdown view can now handle skipped events consistently, otherwise we have also reviewed this interface and flows for best user experience
  • Several performance improvements were made to the server and UIs, so we have plenty performance budget to a create new flows

  We have also included several minor bug fixes and style tweaks

