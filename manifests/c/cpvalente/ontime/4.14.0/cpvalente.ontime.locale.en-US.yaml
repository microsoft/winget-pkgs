ReleaseNotes: "More work on improving user experience in Ontime\r\n\r\n## Whats new\r\n\r\n• You can now name the Auxiliary timers. This will help busy show runners attribute time to \"Speaker countdown\" or \"Video timer\" rather than \"Aux 1\" and \"Aux 2\". Everything else from Auxiliary timers works as usual\r\n\r\n## Whats better\r\n\r\n• The reporting tool user interface and user flow have been reworked. You can now get a both easier to read and richer report that you can consult or export as a base for show reports\r\n• The websocket connection is now more aggressive on reconnecting and provides better results for users that are in network with intermittent drops\r\n• The interface for dragging elements in the rundown list was improved to improve experience. We have also fixed a minor bug where we could accidentally cancel a drag operation on long drags.\r\n• Installing the views as a PWA app now respects the device inset area and has better interaction\r\n\r\nWe have also included several minor bug fixes and style tweaks\r\n\r\n\r\n## What's Changed\r\n• fix(cuesheet)：prevent empty seconds field by @cpvalente in https://github.com/cpvalente/ontime/pull/2194\r\n• feat(report)：persistent show run history by @cpvalente in https://github.com/cpvalente/ontime/pull/2168\r\n• fix(report)：harden empty report check by @cpvalente in https://github.com/cpvalente/ontime/pull/2195\r\n• improvements to UI and UX of the automation panels by @cpvalente in https://github.com/cpvalente/ontime/pull/2198\r\n• fix：type resolver package by @alex-Arc in https://github.com/cpvalente/ontime/pull/2199\r\n• small ui improvements by @alex-Arc in https://github.com/cpvalente/ontime/pull/2196\r\n• improve websocket eviction and reconnection by @cpvalente in https://github.com/cpvalente/ontime/pull/2201\r\n• small correctness improvements for server by @cpvalente in https://github.com/cpvalente/ontime/pull/2204\r\n• feat(client)：polish the disconnected state by @cpvalente in https://github.com/cpvalente/ontime/pull/2208\r\n• fix(rundown)：keep dragged entry visible across long drags by @cpvalente in https://github.com/cpvalente/ontime/pull/2202\r\n• feat：allow naming aux timers by @cpvalente in https://github.com/cpvalente/ontime/pull/2158\r\n• fix(pwa)：add insets to views by @cpvalente in https://github.com/cpvalente/ontime/pull/2209\r\n• bump to version 4.14.0 by @cpvalente in https://github.com/cpvalente/ontime/pull/2211\r\n• chore：upgrade electron builder dependencies by @cpvalente in https://github.com/cpvalente/ontime/pull/2213\r\n\r\n\r\n**Full Changelog**：https://github.com/cpvalente/ontime/compare/v4.13.0...v4.14.0"
