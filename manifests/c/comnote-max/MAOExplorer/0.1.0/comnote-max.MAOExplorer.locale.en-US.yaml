ShortDescription: A file explorer that lets you use GitHub like a normal folder — no Git required.
Description: |-
  MAO Explorer turns GitHub into a shared cloud folder for people who have never used Git.
  It looks and works like Windows File Explorer: open a file, save it, and it is sent to the cloud automatically.
  Drafts, side-by-side conflict resolution, roll back, and a classic mode with real Git terms for experienced users.
