ShortDescription: See which AI agent and MCP server talks to what on your Windows PC, and check it for signs of compromise
Description: |-
  agentegress is a read-only command-line tool and MCP server. It walks the live process tree from each AI agent (Claude Code, Claude Desktop, Cursor, VS Code, Codex, ...) down to the MCP servers and scripts it started, attributes every TCP connection and listener, and checks the PC for signs of compromise: unsigned programs talking out or listening, autostarts, firewall and Remote Desktop. Verdicts come from deterministic rules. It opens no network connection of its own.
