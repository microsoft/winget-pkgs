Description: AcaNomo 是一款本地优先、Markdown-first 的桌面编辑器，支持 macOS 与 Windows。它以 Markdown 文本作为文档主数据，在语义编辑与源码模式之间保持一致，同时提供面向论文写作的公式、引用与审阅工作流，以及 TXT、JSON 大文件分段编辑、文件管理、文档导航和桌面集成能力。
