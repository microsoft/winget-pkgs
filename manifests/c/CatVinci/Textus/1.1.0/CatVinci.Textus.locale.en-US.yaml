ReleaseNotes: |-
  What's new
  Textus 1.1.0 brings a new first-run tour, a Textus AI that remembers what you ask for, autosave, themes you can install from inside the app, a choice of where pasted images are saved or uploaded to, Obsidian image embeds, more HTML in your documents, and a beta update channel.
  New
  - Starts new users with a rebuilt tour on reading notes about a classic in their language: type each Markdown mark, find the sidebar, connect your AI, then write, review and revise your own notes with Textus AI, catch a slip with the grammar check, and finish with continuation and the skills; every step says exactly what to type or click, and with the AI skipped its lessons are still there to read, with an animation to watch. (#90, #190)
  - Shows collapsible <details> blocks, HTML tables, a few inline styles (colour, size, weight, alignment) and inline <svg> drawings as they look, while you write, in split view and in HTML and PDF exports; scripts in a document never run. (#128)
  - Lets you choose Settings › General › About Textus › Update channel › Beta to get release candidates before everyone else; Stable stays the default. (#127)
  - Saves documents back to their file as you write when Settings › General › Save Automatically is on (off by default); a file changed on disk by another app is never overwritten. (#133)
  - Browses and installs themes from the theme gallery in Settings › Editor & Appearance › Browse themes, and offers updates when a theme changes. (#89)
  - Shows Obsidian image embeds such as ![[image.png]], found the way Obsidian finds them in your vault, and saves them back exactly as written. (#135)
  - Lets you type closing *, **, ~~ and == yourself: turn off Settings › Editor & Appearance › Close formatting marks automatically. (#136)
  - Opens the video tutorials from Help › Video Tutorials. (#119)
  - Lets you choose where pasted and dropped images are saved in Settings › Editor & Appearance › Images: a subfolder of the document's folder, assets unless you name another, or the document's own folder, shown with the link it writes. (#147, #187)
  - Uploads pasted images through PicGo or PicList (to any service set up there), SM.MS or Imgur, as well as to your own upload endpoint. (#164)
  - Remembers what you ask for and how you write: tell Textus AI something that should hold beyond one request ("always use British spelling", a correction, a character's details) and it keeps it, for this project or for all your work, and follows it in later conversations; each one shows under the reply with Undo, and Settings › Textus AI › Remember automatically turns it off. (#180)
  - Gives Textus AI three modes, picked beside the message box: Write drafts new text into your document (after the selected text, at the cursor or at the end) without changing what is there, Review answers and leaves comments without touching the document, and Revise changes the text that is there; every change is still a suggestion you accept or reject. Plan mode is gone. (#179)
  - Designs a theme for you: type /theme (or ask Textus AI for one) and describe the look you want, and it writes a complete theme in its reply; Use this theme under the reply switches to it, and you can share it in the theme gallery. (#185)
  - Makes Textus the app that opens .md files from Settings › General › Default Markdown Editor, which also says whether it already is; on Windows the button opens Default apps, where you choose Textus. (#183)
  Improved
  - Turns [text](url) into a link as you type the closing ). (#190)
  - Remembers whether the sidebar was open, so it comes back the way you left it. (#152)
  - Lists what Textus AI remembered in the AI panel's Memory tab, with the date and conversation each came from, to edit, delete or move between this project and all projects; deletes library entries there too, and says when memories or library entries no longer fit into a request. (#180)
  - Sends up to 8,000 characters of library entries with a request in every language; Chinese, Japanese and Korean entries used to get about a third of that. (#180)
  - Treats a document in a subfolder as part of the project above it once that folder has a .textus/ folder. (#180)
  - Offers once to convert a project made with Levis, copying its .levis/ folder into .textus/; Textus no longer reads .levis/ itself, and never changes it. (#180)
  - Writes AI replies out smoothly, a little each frame, instead of in sudden chunks; stopping shows everything received at once. (#168)
  - Moves Import from Levis into Settings › General › About Textus. (#162)
  - Updates KaTeX, which draws formulas. (#114)
  - Keeps up to 500 past conversations instead of 60, and reopens each one with its own document; older ones are moved to an archive folder rather than deleted. (#178)
  - Lists past conversations under the History button in the AI panel's header, and in the chat window's, instead of in a Chats tab in the sidebar. (#187)
  - Draws the window bar's button for the AI panel as a small robot named Textus AI, where a chat bubble didn't say it was the assistant. (#187)
  - Greys out the margin views of Show revisions when the sidebar or the AI panel leaves no room for a margin, and says why; your choice is kept and comes back on its own once there is room, without the page jumping. (#165)
  - Fades between the Show revisions views instead of drawing the revised text again from nothing. (#188)
  - Outlines the revision you point at, or step to in the review bar, in dark green round the new text and dark red round the original instead of blue; a theme can set every revision colour (the --revision-* variables), and Export as CSS… writes them out. (#188)
  - Offers Revise and Review in Quick Ask, starting on Revise; Write stays in the AI panel and the chat window. (#188)
  - Has the empty AI panel show the chosen mode - a pen nib for Write, a speech bubble for Review, a pencil for Revise - and say what the AI will do in it, changing as you switch modes. (#188)
  - Gives the AI modes a row of their own on a phone, with the message tools and Send under them. (#188)
  Fixed
  - Turns **bold**, *italic* and the other marks into formatting when the * comes from a Chinese input method. (#134)
  - Shows images whose relative path contains escapes such as %20. (#135)
  - Ticks a task checkbox in Typewriter Mode without the page jumping. (#136)
  - Keeps what you type after *** inside the bold-italic text instead of dropping it. (#148)
  - Follows links with Ctrl + click (⌘ + click on a Mac): another Markdown file opens in a new tab, a #heading scrolls to it, and web links open in your browser instead of a broken page. (#152)
  - Keeps the top and bottom page margins clear in exported PDFs when a code block, table, quote or list runs across pages. (#151)
  - Keeps the Settings window the same width when you switch sections. (#163)
  - Keeps an AI note's popover under the Settings window instead of drawing it on top. (#167)
  - Keeps an AI revision's struck original and new text on screen when you point at them; pointing now outlines that pair and its card in the margin. (#176)
  - Hides the "Start writing in Markdown…" hint in an empty document while Textus AI writes into it, instead of showing it over the new text. (#166)
  - Keeps the text you selected highlighted in the document while you type in the AI panel or the chat window, until you send, remove the selection from the message or select something else; pointing at "N chars selected" brings it out, and clicking scrolls to it. (#179)
  - Applies every Show revisions view to a Revise rewrite that spans paragraphs, such as text Write just added, instead of always showing it as one struck block and one green block; Write's new text, which has no original, stays green in the text in the margin views (the view menu says so) and reads as the result in Result only, no markup. (#188)
  - Keeps the message tools and Send on one row in the AI panel at its narrowest and in the chat window when text is selected; "N chars selected" shortens instead. (#188)
  - Numbers the rows of gather, align and equation formulas (1), (2), (3)… in order through the whole document, as LaTeX does, instead of (1) on every row; \tag{…} and \notag are followed, and gather*, align* stay unnumbered. Applies in split view and HTML and PDF exports too. (#182)
  Platform notes
  - macOS: lets you drag the window while the first-launch language card is open (#149), and now requires macOS 11 or later.
  - Windows: Source Code Mode and code use a monospaced font again instead of falling back to SimSun. (#132)
  - Windows: stays under Open with for .md and .markdown files, and in Default apps, after another Markdown editor such as MarkText is installed. (#183)
  - Windows: runs natively on ARM64 PCs such as Snapdragon laptops, with its own installer, _arm64-setup.exe. (#175)
  - Linux: runs natively on ARM64, as an AppImage, .deb or .rpm; the Arch package stays x86_64. (#175)
  Installers for macOS (Apple silicon and Intel), Windows and Linux (x64 and ARM64) are below; the app updates itself.
