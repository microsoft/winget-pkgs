ReleaseNotes: |-
  What's new
  Textus 1.4.8 makes the file tree a real file manager, sizes the phone and tablet to your system's text, and brings many smaller fixes.
  New
  - The file tree works like a file manager: Cut, Copy, Paste and Duplicate files, with the keys or the right-click menu; drag files out to Finder, File Explorer or any app, and back in; rename in the row itself (F2, or Return on a Mac); pick ranges with Shift and everything with ⌘A or Ctrl+A; ⌘← (Ctrl+←) collapses every folder. A name already taken asks to Replace, Keep Both or Cancel.
  - Edit › Undo takes back what you did in the file tree: a move, a rename, a new file or folder, a move to the Trash, and files dropped in from Finder or File Explorer. Links updated by a move come back too.
  - Code blocks: Mac line keys (Cmd+Left/Right, Cmd+Up/Down, Home, End) work as everywhere else, and Settings › Editor › Press Enter twice to leave a code block can be turned off.
  - Text files that aren't documents (.tex, .bib, .yaml) open as their own text, coloured as their language; the new TeX plugin opens LaTeX and BibTeX files this way.
  - Settings › About has a button to share Textus with a friend, beside Sponsor.
  - For plugin authors (API 1.11): contributes.textFiles, and completions in code blocks (contributes.completions with where: "code").
  Improved
  - Phones and tablets follow your system's text size (iOS's Text Size, Android's font size) unless you pick one, in five steps from Small to Largest, with text, icons, rows and spacing sized together; the top bar and the format bar stop at Large so their buttons still fit. At the largest sizes Settings stacks each name above its control and menus wrap long names; an upright iPad takes the phone's layout.
  - Every button takes a fingertip on a touch screen, an iPad's format bar, tab row, resize grip, search boxes and dropdowns included; a tap outside a phone's menu only closes it, and Back folds a submenu first.
  - The file tree keeps your place: the folder's name and buttons stay at the top as you scroll, a long folder's row stays above its files, and the tree updates by itself when files change on disk, from Git, a sync service or another window.
  - The Search panel finds the open document's headings, a jump each; on a phone the outline is a search away.
  - The button that lists every tab says how many are open, and ends with the open tab's own menu; a tab's menu keeps Copy Path and its kin under File Location.
  - Textus AI's message box can be dragged taller by its top edge; the / list no longer shrinks in a long conversation.
  - Textus takes in a change made to its settings file by another program while it runs, instead of writing over it on its next save; a service on this computer (Ollama, Magpie) can be given another address. Settings › Textus AI lists Magpie (local) beside Ollama, with its own mark.
  - A sidebar panel with nothing to show says why and offers Open Folder; a document opened from Finder or Open Recent goes to the window that has it open, else to the one whose folder holds it.
  Fixed
  - Textus opens at the size and place you left it, also maximized or in full screen; the first time, at 1200 × 800 centred. (#795)
  - Formulas in an answer copied from an AI chat paste as formulas in the rich view, rather than escaped text. (#826)
  - Tables exported to ODT have their cell lines in LibreOffice again. (#827)
  - A diagram, formula or HTML block first in a document is drawn when the document opens, and a wide flowchart or class diagram fits the column instead of being cut off. Thanks to @luckylew23. (#801)
  - Remote pictures from hosts that guard against hotlinking load again. Thanks to @luckylew23. (#816)
  - A picture after a list item's text no longer leaves a large gap above the item on macOS. (#815)
  - Plugin downloads no longer fail with "answered 302 Found", and download errors say where the answer came from and which proxy was in effect. Thanks to @luckylew23. (#805)
  - With the same folder open in two windows, saving in one updates the other's file tree.
  - In Settings › Textus AI › Models, a provider's API key row no longer leaves a large empty space above its field.
  Platform notes
  - On Android, text no longer grows twice under a larger system font.
  - On Linux with Wayland, windows open at their last size; Wayland doesn't let an app choose where its window goes.
