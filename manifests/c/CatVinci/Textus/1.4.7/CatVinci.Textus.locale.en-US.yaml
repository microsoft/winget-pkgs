ReleaseNotes: |-
  What's new
  Textus 1.4.7 makes long documents smooth again, brings files in by drag and drop, works by touch on phones and tablets, and gives each command one place and one name.
  New
  - Drag a picture or any other file into a document to put it in where you let go: a picture shows as an image, a PDF, spreadsheet, video or other file goes in as a link. Room opens between the blocks as you drag, with a note of what letting go does. From a file manager, the file is first copied where the document's pictures go (Settings › Images); from the sidebar, it is linked where it is. Notes still open in a tab, and holding Shift opens any file instead. Let go close by a document's left or right side it opens beside it, and on a tab row in a new tab - now from a file manager too. (#777)
  - Drag files or folders from a file manager onto a folder in the file tree to copy them in: the folder under the pointer lights up, and Textus asks first, with a Don't ask again box (Settings › General turns the question back on). Files are copied, never moved, and never over anything there: a taken name becomes report 2.pdf or photos 2.
  - Typing a link's or a picture's target, [text]( or ![alt](, lists the open folder's files by their path from the document, in the rich editor and in source mode; Insert Link in a file's right-click menu in the sidebar puts a link to it at the caret. (#777)
  - Add several custom endpoints in Settings › Textus AI › Models › Providers, each with its own name, address, key and model, listed under its name wherever you pick a model. (#785)
  - Pick an icon theme for files and folders in Settings › Appearance › File icons; the new Material Icon Theme plugin brings VS Code's Material icons. (#776)
  - Plugins can colour code blocks in languages Textus doesn't know; the new Cisco IOS plugin colours router and switch configurations. (#639)
  - The plugin store groups plugins by category and marks the ones that work on the computer only.
  - For plugin authors (API 1.10): contributes.codeLanguages, contributes.fileIconThemes and editor.registerDropHandler; on iPhone, iPad and Android plugins hear when you leave Textus and come back, and can move files to Recently Deleted on iOS.
  Improved
  - Phones and tablets work by touch: every button, row and menu item takes a full fingertip (44pt) without changing how it looks; a phone's menus are Textus's own menu, opening where they were asked for, instead of a sheet from the bottom; a phone turned on its side keeps the phone layout and stays clear of the camera cutout. Plugin pages work by touch too: hold a row for its menu, hold and drag to reorder, pinch to zoom on Android.
  - One place and one name for each command: a phone no longer offers the same command twice in its icon bar, ☰ and ⋯; the same thing is called the same everywhere - New File, Find…, Rich text under Editing view, Textus AI; a Textus AI tab has one + for a new conversation; the Format menu has Bold, Italic and Clear Formatting; an empty sidebar shows one line and Open Folder….
  - Pinch to zoom on iPhone and Android keeps the line under your fingers in place, and the caret follows the text; Ctrl or Cmd with the scroll wheel and the View menu do the same.
  - Opening Textus, switching themes and opening documents no longer flash in between: no empty Untitled before your documents, no default look before an imported theme, diagrams and plugin blocks open at their size without moving the page, and a link's preview card opens at its full size.
  - On Mac, the red, yellow and green buttons no longer jump in and out of full screen or as a window opens.
  - When a window runs into an error it can't draw past, its page has Report a Problem, with where the error happened already in the details.
  - A Mermaid diagram that can't be drawn says why under its source. (#775)
  - Textus keeps less memory over long sessions with Textus AI edits and pictures.
  - Wording is more consistent in Traditional Chinese and Japanese, and Use the look of earlier versions no longer sounds like the Classic layout.
  Fixed
  - Scrolling, typing and jumping through the outline in a long document are smooth again: since 1.4.6, each block drawn as you scrolled restyled the whole document, most of all on Windows. (#800)
  - Typing a link that Markdown doesn't read as one, such as [a](<b), no longer freezes the editor; typing [a](<b>) no longer repeats its first characters.
  - Plugins such as Marp see the document in Source Mode and Source and Preview too, instead of finding no document open.
  - Google Gemini answers again. (#785)
  - The document text size in Settings › Appearance works again on every platform and is kept on restart.
  - On iPhone and iPad, deleting a file or folder from the sidebar works again: it goes to the Files app's Recently Deleted.
  - On iPhone, the tab row no longer disappears while the sidebar closes; a phone's plugin menus (a card's ⋯, a database row's menu) act on what you choose.
  - Scrolling is smooth on Linux again on computers without graphics acceleration.
  - Textus AI rewrites keep pictures, captions, lists and links as they are while you decide, and Textus AI's grey suggestion no longer reads the source of a plugin's block.
  - Keeps the window open on the start page when Textus AI is hidden while its conversations are the only tabs. Thanks to @Tigerpang1. (#791)
  - A base in a document has no outline round it when pointed at, and a table's column names sit centred on their icons.
  - On Windows and Linux, a window opens in its theme's own background, and the caption buttons change as soon as it is maximized.
  - On a Mac, Format's keys no longer change the document while you type in another field or a plugin page.
  - Renaming a note keeps the folder and .md of a wiki link written with a backslash; Convert to Markdown Table keeps a picture whose name has a space or parenthesis.
  Platform notes
  - Textus on iPhone and iPad now needs iOS or iPadOS 16.4 or later.
  - iPhone and iPad have no Textus AI: the plugin store, Settings and plugin pages leave out what only Textus AI uses, and the iPad menu leaves out what can't work there.
