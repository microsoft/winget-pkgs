ShortDescription: 下一代集成写作环境：免费开源的 Markdown 编辑器，内置 AI 写作助手与扩展插件。
Description: |-
  Textus 是下一代集成写作环境：免费开源的 Markdown 编辑器，内置 AI 写作助手，支持 macOS、Windows、Linux、Android 和 iOS。
  写作：所见即所得。文档就是普通的 .md 文件，表格、任务列表、脚注、公式和 Mermaid 边写边渲染；公式、表格、图表一键搞定。写作风格随你喜欢：禅模式、打字机模式、分屏视图、源码模式，以及多种主题；随处分享，可导出为 PDF、Word、HTML 等格式。
  Textus AI：你的写作助手，与你一同写作。它会检查语法、给出审阅建议、接着你没写完的话写下去，并逐句提出修订，每一处改动都由你采纳或拒绝。技能一键加入校对、精简、翻译、调整语气；它还会长期成长，从 .textus/style.md 学习你的风格。不同 LLM 随你喜欢：Textus 支持超过 20 种 LLM，以及任何提供 OpenAI 兼容接口的 LLM。
  扩展：插件和技能在“设置 › 扩展”里一键安装，电脑上都能用，大多数在 Android 和 iOS 上也能用——思维导图、Vim 模式、关系图谱、把工作区文件夹变成表格/看板/日历的 Workspace、Marp 幻灯片、Zotero 引用、ECharts 图表和版本历史。
  隐私：你写的东西，只属于你。文档留在你的设备上，API Key 和登录信息只保存在你的电脑上，AI 请求从你的设备直达你选择的服务商，无需账号，也不做追踪。
