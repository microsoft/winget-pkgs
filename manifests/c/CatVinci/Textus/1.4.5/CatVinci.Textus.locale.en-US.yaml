ShortDescription: 'An open-source Integrated Writing Environment: Markdown editor, AI assistant and plugins side by side.'
Description: |-
  Textus is the next-generation Integrated Writing Environment: a free, open-source Markdown editor with an AI writing assistant built in, for macOS, Windows, Linux, Android and iOS.
  Writing: what you see is what you get. Documents are plain Markdown files, with tables, task lists, footnotes, formulas and Mermaid rendered as you write. Formulas, tables and diagrams are done in a snap. Your writing style is your call: zen mode, typewriter mode, split view and source code mode, with several themes. Share it anywhere - export to PDF, Word, HTML and more.
  Textus AI: your writing assistant writes with you. It checks grammar, reviews your text with suggestions, continues what you were writing, and revises it sentence by sentence so every change stays one you accept or reject. Skills add proofread, tighten, translate and change-tone in a click, and it grows over time, learning your style from .textus/style.md. Use any LLM you like: Textus works with more than 20 LLMs and with any LLM that offers an OpenAI-compatible API.
  Extensions: plugins and skills are a click away in Settings > Extensions, on the computer and mostly on Android and iOS too - mind map, Vim modes, graph view, a workspace folder as a table, board or calendar, Marp slides, Zotero citations, ECharts and version history.
  Privacy: what you write is yours alone. Documents stay on your device, API keys and sign-ins are stored only on your computer, AI requests go straight to your provider, and there is no account and no tracking.
