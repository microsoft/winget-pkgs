ReleaseNotes: "Video demo of spread label feature：https://www.youtube.com/watch?v=kfIX67f7Aqk\r\n\r\n## Sponsors\r\n\r\n• Free code signing on Windows provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/)\r\n\r\n## Notes\r\n\r\n• **WARNING:** Kindle Scribe 2025 doesn't work very well. Lots of blanks. Maybe PDF is better.\r\n• JPG Quality for Scribe/Colorsoft is increased from 85 to 90. This may solve blank page issue.\r\n• Gamma correction default is now 1.0 (disabled). Prior default was 1.8\r\n• Discrete Fourier Transform used to erase rainbows in 9.0：https://youtu.be/Dw2HTJCGMhw?si=k3pDizLAaZmJfwMl\r\n• Kindle Scribe full 2480 support was added in 7.5：https://ko-fi.com/post/Kindle-Scribe-full-2480-support-N4N31G6TQU\r\n• Virtual panel view is enabled in Aa menu on your Kindle, not in KCC in 7.4：https://www.youtube.com/watch?v=v_kIBu4q7SU\r\n## Links\r\n\r\n[![ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/Q5Q41BW8HS)\r\n\r\nAlso looking for a software job! https://www.linkedin.com/in/alexu2/\r\n\r\nEmail (for commisions and inquiries)：`kindle.comic.converter` gmail\r\n\r\nDiscord：https://discord.com/invite/qj7wpnUHav\r\n\r\nKo-fi support! https://ko-fi.com/eink_dude\r\n\r\nYouTube tutorial (please subscribe)：https://www.youtube.com/watch?v=QQ6zJcMF2Iw\r\n\r\nInstallation tutorial：https://www.youtube.com/watch?v=IR2Fhcm9658\r\n\r\n## What's Changed\r\n• Spread labels support left to right by @axu2 in https://github.com/ciromattia/kcc/pull/1428\r\n• label spread preview default is high quality by @axu2 in https://github.com/ciromattia/kcc/pull/1429\r\n\r\n\r\n**Full Changelog**：https://github.com/ciromattia/kcc/compare/v11.0.2...v11.0.3"
