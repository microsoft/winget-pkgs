ReleaseNotes: "Significant changes to the build system were made to support Windows 11 ARM, Linux ARM. \r\nAlso, macOS build system changed so there is only one intel build for macOS 10.14+\r\nIf there are any problems open an issue.\r\n\r\n## Sponsors\r\n\r\n• Free code signing on Windows provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/)\r\n\r\n## What's Changed\r\n• crop before split instead of after by @axu2 in https://github.com/ciromattia/kcc/pull/1444\r\n• add Legacy Panel View option from KCC 6 by @axu2 in https://github.com/ciromattia/kcc/pull/1445\r\n• Support Windows 11 ARM (experimental) by @axu2 in https://github.com/ciromattia/kcc/pull/1448\r\n• Kindle Scribe 2025 default is PDF [11.1.0 regression] by @axu2 in https://github.com/ciromattia/kcc/pull/1449\r\n• fix dark images on Kindle 1/2/3 for cbz png by @axu2 in https://github.com/ciromattia/kcc/pull/1450\r\n• note that png is better than webp for BW content by @axu2 in https://github.com/ciromattia/kcc/pull/1451\r\n• linux appimage：remove libfuse2 and add arm (experimental) by @axu2 in https://github.com/ciromattia/kcc/pull/1447\r\n\r\n\r\n**Full Changelog**：https://github.com/ciromattia/kcc/compare/v11.3.2...v12.0.0"
