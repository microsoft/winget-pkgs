ShortDescription: Monte Carlo eXtreme (MCX) - Physically accurate and validated GPU ray-tracer
Description: Monte Carlo eXtreme (MCX) is a Monte Carlo photon simulator for modeling light transport in 3D turbid media. This package installs the MCX suite - MCX (CUDA), MCX-CL (OpenCL, for NVIDIA, AMD, Intel and Apple GPUs and CPUs), MMC (mesh-based, CPU/OpenCL/CUDA/OptiX), their MATLAB/Octave toolboxes, Redbird, Iso2Mesh and the MCX Studio graphical interface.
