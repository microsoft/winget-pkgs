License: MIT
ShortDescription: Free client for STARFACE phone systems
Description: |-
  StarCLX is a free client for STARFACE phone systems version 10 and later, for Windows and Linux.
  Softphone with G.722 and SRTP, desk phone control, search and address book, call list, chat,
  voicemail, conferences, function keys, headset buttons and Busylight. Replaces the former
  StarCMX. Not a product of STARFACE GmbH.
