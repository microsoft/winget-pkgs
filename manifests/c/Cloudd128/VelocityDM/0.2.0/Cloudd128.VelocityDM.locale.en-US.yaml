ShortDescription: Fast, resumable download manager for Windows.
Description: |-
  VELOCITY DM downloads files over HTTP and HTTPS using up to 32 connections per file,
  resumes automatically after crashes and Windows restarts, verifies every response
  (sizes, byte ranges, optional SHA-256) and never overwrites existing files.
  Includes a scheduler for off-peak hours, speed limits, a Chrome/Edge extension,
  and an English and Arabic interface.
