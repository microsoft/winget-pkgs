ShortDescription: 'Record, stream, edit, and transcribe on your computer. One desktop app.'
Description: >-
  ClipHearth is one desktop app for Windows, macOS, and Linux, in English, Czech, German, French,
  Spanish, Brazilian Portuguese, Italian, and Polish. Recording and streaming records a display, a
  window, or a game with the computer's sound, your microphone, and your camera, or goes live to
  Twitch, YouTube, Kick, your own server, and more places at once, with scenes, the chat and alerts on
  the picture, an upright stream for TikTok and Shorts, and live captions. The Studio (called the
  Editor before 1.8.0) puts videos, photos, and sound on one timeline with transitions, collages,
  layers, and keyframes, cuts a video by editing its text, takes out pauses and ehms, and burns in
  word-by-word captions and vertical versions. Subtitles and transcript recognises speech in 50
  languages and translates into 16; Completed finds a video by the words said in it, and a language
  model writes a summary and chapters. All of it runs on your computer, with no uploads and no
  credits. Remote control (new in 1.12) sees and controls your other computer with its sound,
  clipboard, and files, encrypted end to end; being controlled is free. Also included: screenshots you
  can mark up, with emails and card numbers pixelated before you share, a converter for 12 video and 9
  audio formats, a shared box between your computers, and a built-in browser that saves what a page
  plays, for media you own or are authorized to keep (it does not circumvent DRM). Try it free for 3
  tasks, and screenshots and recordings up to 3 minutes stay free for good.
