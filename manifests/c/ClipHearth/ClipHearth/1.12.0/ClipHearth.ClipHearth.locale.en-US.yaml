ReleaseNotes: |-
  - Remote control is a new section. See and control another computer with ClipHearth, with its sound, clipboard and files. Everything is encrypted end to end.
  - Connect with the other computer's ID and the one-time password it shows, and someone there accepts. With a permanent password you connect when nobody is there.
  - The permanent password gives full access. On Windows you unlock the computer, press Ctrl+Alt+Del and answer administrator prompts, on a Mac and on Linux you use the login screen. Setting it asks for an administrator password once.
  - Files shows both computers side by side. Copy either way with the progress and the time left, rename, make folders and move things to the trash.
  - My computers lists your computers and shows which of them are on. Controlling another computer needs a license, being controlled is free.
  - Screenshots, recordings and streams of an HDR display on Windows keep their colours.
  - The Terms of Use have a new version with a paragraph on remote control.
