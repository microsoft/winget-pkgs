ShortDescription: 'Capture, convert, and edit video and sound in one desktop app.'
Description: >-
  ClipHearth is a desktop media workbench for Windows, macOS, and Linux. Browse in its built-in
  browser and the stream detector surfaces the video or sound playing on the page, including live
  streams and internet radio, and saves it in the best quality on offer. Live streams record until you
  stop them, playlists of up to 500 entries queue in one action, and subtitles can be embedded in the
  file. The Convertor turns files into 11 video and 9 audio formats, in batches, using the hardware
  encoder when one is available. The Editor trims and joins clips, adjusts color and speed, reshapes
  the audio, and exports GIFs, always as a new file. FFmpeg ships inside the app, the browser blocks
  ads and trackers, and every update is signed. ClipHearth is for media you own or are authorized to
  keep and does not circumvent DRM. Try it free for 3 tasks.
