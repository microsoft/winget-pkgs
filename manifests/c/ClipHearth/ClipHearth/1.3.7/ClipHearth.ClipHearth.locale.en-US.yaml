ReleaseNotes: |-
  - The first public release of ClipHearth for Windows, macOS, and Linux. Open a page in the built-in browser and ClipHearth finds the video, live stream, or radio on it: download it, record it as it plays, convert it to another format, or trim it in the Editor.
  - Linux: the built-in browser draws on real desktops, takes keyboard and mouse input after a click, and keeps running on NVIDIA drivers; a page renderer that stops reloads itself.
  - Linux: the video player falls back to software decoding and tells you when the picture would stay black, and streams that are not live are no longer reported as live.
  - Less CPU use on software rendering: no endlessly animated progress bars.
  - The quality picker no longer shows internal format numbers as quality names.
