ShortDescription: 'Capture your screen, convert, and edit video and sound in one desktop app.'
Description: >-
  ClipHearth is a desktop media workbench for Windows, macOS, and Linux. It takes screenshots you can
  mark up and find by their text, records your screen, microphone, and camera, and its built-in
  browser finds the video or sound playing on a page, including live streams and internet radio, which
  it can also record at a set time. The Converter turns files into 11 video and 9 audio formats, in
  batches or under a target size. The Editor cuts a video by editing its text and takes out pauses and
  ehms; its timeline lays out the camera, titles, zooms, chapters, and every sound track. It burns in
  word-by-word captions, makes vertical clips and App Store previews, adds music, a logo, and
  clean-up, and splits the result into parts, always as a new file. Following brings in new podcast
  episodes on its own, and a shared box sends files between your computers, encrypted end to end. Both
  come with the license, as does the optional AI that runs on your computer. ClipHearth is for media
  you own or are authorized to keep and does not circumvent DRM. Try it free for 3 tasks; screenshots
  and screen recordings up to 3 minutes stay free for good.
