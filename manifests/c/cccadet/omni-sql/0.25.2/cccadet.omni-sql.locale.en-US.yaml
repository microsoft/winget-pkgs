ReleaseNotes: |-
  omni-sql v0.25.2
  - Fixed: the sidebar froze on databases with many schemas or tables. Schemas, tables and columns now render only when expanded, and lists longer than 100 objects show a Show more button.
  - Fixed: after you narrowed a connection's schema selection and synced again, the deselected schemas stayed in the sidebar and autocomplete until restart. They now disappear right after the sync.
  - Add a table from another database to the JOIN now uses the app's own pickers: a connection dropdown and a searchable table field.
  - Fixed: importing a large table (millions of rows) into a JOIN failed with "failed to offload data block … max_temp_directory_size". DuckDB can now use up to 32 GB of temporary disk space, up from 4 GB.
  - Fixed: on an S3 connection, a query that reads only tables added to the JOIN, such as SELECT * FROM "local"."dim_documento", failed with "The query does not reference any of the N tables in the S3 catalog". It now runs without needing an S3 table.
  - When an Oracle source fails to import into a JOIN because of an Oracle driver error (NJS-…), the error now shows the driver's message instead of a generic "source query failed".
  Full Changelog: v0.25.1...v0.25.2
