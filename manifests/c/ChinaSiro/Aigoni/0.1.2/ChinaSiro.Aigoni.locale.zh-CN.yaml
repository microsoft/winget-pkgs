ShortDescription: Aigoni 是博客，也是你和 AI 共同成长的 Wiki 知识库。
Description: Aigoni 把「博客」和「LLM Wiki 知识库」放在一个本地 Markdown 文件系统里，支持个人笔记、网页收藏、LLM Wiki、博客展示、品牌官网、企业知识库与自动化 SEO 站点。它无数据库依赖，仅使用本地文件储存；博客前台和后台管理均支持自定义切换前端 UI 界面，并提供完整的 REST API。
