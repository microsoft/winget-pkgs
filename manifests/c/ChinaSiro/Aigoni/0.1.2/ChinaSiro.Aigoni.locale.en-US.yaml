PackageIdentifier: ChinaSiro.Aigoni
PackageVersion: 0.1.2
PackageLocale: en-US
ShortDescription: Aigoni is a blog and a Wiki knowledge base that grows together with AI.
Description: Aigoni combines a blog and an LLM Wiki knowledge base in one local Markdown file system. It supports personal notes, web clipping, an LLM Wiki, blog publishing, brand sites, enterprise knowledge bases, and automated SEO sites. It has no database dependency and stores everything in local files; both the blog front end and the admin console support customizable UIs, and a full REST API is available.
