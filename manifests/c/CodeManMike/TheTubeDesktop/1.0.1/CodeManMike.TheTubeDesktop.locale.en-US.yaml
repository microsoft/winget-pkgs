ShortDescription: YouTube as a Windows app, with a queue that stays put, picture-in-picture, SponsorBlock, tray and hotkeys.
Description: |-
  The Tube Desktop (TTD) runs the real YouTube website in its own window, so your account, subscriptions and YouTube Premium work as normal, and Movies, 4K and HDR play.
  It adds a queue that carries on while you browse, an always-on-top picture-in-picture window, SponsorBlock, Return YouTube Dislike counts, Hide Shorts, hide watched videos, channel blocking, pinned quality, themes, a tray icon, global media hotkeys and Start with Windows. Every feature is a plugin you can switch off.
