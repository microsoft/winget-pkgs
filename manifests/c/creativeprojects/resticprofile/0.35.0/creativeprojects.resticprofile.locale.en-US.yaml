ReleaseNotes: |-
  ## 🛰️ Zarya release

  On this day in 1998, a Proton rocket lifted off from Baikonur carrying Zarya ("dawn"), the first module of the International Space Station. A modest start for a station that has had people on board continuously since 2000.

  ## resticprofile v0.35.0 (2026-11-20)

  This release fixes `dump` and `cat`, which v0.34.0 broke, keeps captured secrets out of systemd unit files, and fixes several configuration issues.

  ### Security

  • **Secrets no longer visible in systemd units** (#367)：the environment captured when scheduling a profile (`capture-environment`, `RESTIC_*` by default) was written as `Environment=` lines in the unit file, and any user on the machine can read those with `systemctl cat` or `systemctl show`. It is now saved in a `resticprofile.env` file in the service drop-in folder, readable only by the owner of the unit, and loaded with `EnvironmentFile=`.
  • **launchd**：the generated plist file can also contain the captured environment, so only its owner can read it now (`0600`).

  > [!IMPORTANT]
  > Existing schedules keep the old unit files until you schedule them again：run `resticprofile schedule --all` (with `sudo` for system units) after upgrading.
  > If you use your own systemd unit template, add an `EnvironmentFile={{ .EnvironmentFile }}` line to it, otherwise the service won't get the captured environment. resticprofile shows a warning when the line is missing.

  ### Bug Fixes

  • **`dump` and `cat` output** (#720)：since v0.34.0, restic's output went to stderr instead of stdout, and binary data lost some bytes, so piping a dump into another program (`resticprofile dump latest /file | pg_restore`) no longer worked. restic's output goes to stdout again, unaltered. resticprofile's own messages still go to stderr for these commands.
  • **Circular profile inheritance** (#684)：a profile inheriting from itself, or a cycle like `a -> b -> a`, crashed resticprofile with a stack overflow. It now reports a configuration error, in both v1 and v2 configuration files.
  • **`exclude-cloud-files` on macOS** (#686)：restic 0.19 supports `--exclude-cloud-files` on macOS, but resticprofile dropped the flag there, so restic read online-only iCloud files (which could trigger downloads). The flag is now passed to restic on macOS.
  • **JSON schema** (#449)：the integer `keep-*` retention flags now accept `unlimited`, like restic does, so editors no longer flag `keep-daily: unlimited` as invalid.
  • **zsh completion**：the completion script now also works when autoloaded from `$fpath`, not only when sourced.

  ## New contributors
  Thanks to @lbarrosby and @ericbyz for their first contributions in this release 🎉

