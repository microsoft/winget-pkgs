ReleaseNotes: |-
  BiliSail v1.2.6+3 · 投屏到大屏，搜索更顺手 ⛵
  本次更新合并 v1.2.6+1 预发布版的全部更新，新增 DLNA 投屏、图文评论、观看历史搜索与搜索发现，完善小窗播放、弹幕样式记忆和桌面窗口体验，并修复推荐刷新、清晰度与导航问题。
  ✨ 新功能
  - 📺 DLNA 投屏：普通视频、分 P 和番剧／影视可投到同一局域网内的 DLNA 设备，支持暂停、继续和停止；交接成功后暂停本地播放。电视从头播放，暂不支持 iOS、直播与离线内容。
  - 💬 评论编辑增强：主评论支持添加最多 9 张图片，新增 @用户与手动开启同步动态，视频评论还可插入当前播放时间；发送框适配手机、桌面和大字号，失焦保留草稿。
  - 🔍 搜索历史、热搜与联想：宽屏搜索框展开历史和热搜面板，窄屏使用独立搜索页；输入关键词可查看联想并点击搜索。历史支持展开、单条删除和清空，按账号隔离；可关闭“记录搜索历史”，关闭后不再记录新词，原历史仍可管理。提交后自动清空输入框。
  - 🕘 观看历史搜索：独立历史页和“我的”内嵌历史均可按关键词搜索云端记录，支持分页、刷新和清除搜索；窄屏搜索框可展开／收起。
  - 🎨 弹幕样式记忆：视频和影视的弹幕发送模式、RGB 颜色可跨视频及应用重启保留；修复编辑文字时样式被重置的问题，保存失败会提示。
  ⚡ 体验优化
  - 📱 方形与竖屏播放适配：视频和影视页根据实际画面比例增加播放器高度，上滑简介／评论时逐渐收起，下滑回顶后恢复。
  - 🎛️ 小窗操作重整：底栏保留播放、时间、进度、发送弹幕和全屏等常用操作，清晰度、倍速、字幕、音量等集中到“更多”工具抽屉；窄屏抽屉位于视频下方。发送弹幕使用独立弹窗，切换布局保留草稿。
  - 🌐 弱网缓冲调整：直播与点播分别配置缓存及恢复门槛，延长网络缓冲等待窗口，减少正常缓冲期间过早重新加载；分别显示准备、缓冲与恢复提示，直播首次播放增加短暂预缓冲。
  - 👆 长按倍速更连贯：调整点播音频输出缓冲和倍速切换处理，减少长按加速、松手恢复时的停顿与追帧；保留原有触发时长、上滑固定及解除固定操作。
  - 🪟 桌面窗口记忆：窗口大小、位置和最大化状态可跨启动恢复，主窗口与独立播放窗口分别保存；修正 Windows 窄屏播放窗重开时的尺寸计算，以及主窗口最大化状态对播放窗口布局的干扰。
  - 🖼️ 私信原图查看：点击私信图片可打开共用查看器，支持缩放、保存与复制；修复部分图片缩略图正常、原图却无法加载的问题。
  - 🧭 推荐内容展示完善：App 推荐接纳影视等更多内容类型并保留对应跳转；恢复“已关注／新关注”标记，避免与同义推荐理由重复显示。
  - 🖱️ 列表与播放绘制优化：减少视频卡片文字测量、封面绘制和长列表回顶时的重复布局，调整连续鼠标滚轮输入的时间衔接；隔离进度与控件重绘，并将固定弹幕、滚动弹幕分层绘制。
  - ▶️ 播放器与 Windows 渲染调整：更新播放器、原生媒体库与弹幕依赖，Windows 调整视频／弹幕合成方式，修复 ANGLE 路径退回复制式硬解的问题，在支持的设备上恢复 D3D11VA 直通硬解。
    🛠️ 问题修复
  - 搜索候选闪动：等待新联想结果、返回空结果或失败时保留上一批可点击候选；中文输入法组合期间保留面板，确认输入后再请求。修复宽屏搜索动画带动头像和账号控件移动的问题。
  - Web 推荐刷新重复：刷新时推进推荐采样序号，避免每次回到同一批请求；失败重试继续使用对应批次。
  - 播放清晰度发现与设置：完善普通视频可用清晰度发现和缺档补取；补齐并保留默认 720P60，统一 HDR、杜比视界、8K 等标签。实际可选画质仍取决于片源、账号权限和服务端返回，不会解锁未授权画质。
  - 底栏与小窗导航：修复从历史等分组页面点击已高亮底栏入口无响应的问题，恢复 Android 小窗播放器中应显示的导航按钮。
  - Android 图片预览与媒体通知：图片预览背景延伸到系统栏区域，保留按钮安全间距；修复关闭最后一个播放页后媒体通知残留的问题。
  - macOS 窗口切换：应用已在前台时避免重复激活整个应用，减少窗口切换卡住的风险。
  - 其他细节：保留视频简介收起后的标签加载结果，修复直播清晰度文字被裁切的问题。
  完整更新范围：v1.2.5+3 → v1.2.6+3
  相对上一预发布版的增量：v1.2.6+1 → v1.2.6+3
  验证与兼容性提示：DLNA 尚未完成真实电视兼容性验收；Windows 硬解和倍速优化已有受控测试，不代表所有显卡、驱动、高画质或设备均已验证，也不代表所有卡顿或整卡 GPU 占用问题均已解决。各平台实际音画、安装升级与长期稳定性仍需设备验证。macOS 需要 13 或更高版本；Linux 当前仅保存主窗口状态，位置恢复受窗口系统限制。
  📦 构建与安装说明
  BiliSail（哔帆）1.2.6+3 预览构建。
