ReleaseNotes: |-
  BiliSail v1.2.6+4 · 听视频定时关闭，播放更顺手 ⛵
  本次更新新增听视频定时关闭与播放中音质切换，修复部分杜比视界视频偏色、触摸手势被抢占、全屏鼠标不隐藏，以及从评论列表滑动时竖屏播放器无法收起的问题。
  ✨ 新功能
  - 💤 听视频定时关闭：听视频页新增定时入口，可选 15／30／45／60／90 分钟，或自定义 1–180 分钟，支持查看剩余时间、重新设置和取消。暂停、缓冲及连续换 P／换集期间继续计时，到期暂停当前会话并保留播放位置；返回视频、关闭播放页或退出应用后取消，不会在重启后恢复。
  - 🎵 播放中切换音质：视频与番剧／影视可按实际可用音轨选择 AAC、Hi-Res／FLAC、杜比音频等。宽屏／全屏可从音量菜单选择，小窗与听视频通过“更多播放选项”调节。切换时保留清晰度、播放位置、倍速、音量及播放／暂停状态；手动选择随当前内容保留，新内容继续沿用全局偏好。可选档位取决于片源、账号权益和服务端返回。
  🛠️ 播放与交互修复
  - 🎨 杜比视界偏色与兼容回退：修复 Windows、Android 播放部分 Dolby Vision Profile 5 视频时出现绿／紫偏色的问题，按原生能力将画面转换为 SDR。转换不可用或失败时，在线视频／影视会尝试兼容的非杜比画质，保留位置和播放状态；离线内容提示当前设备不支持该格式。原有画质偏好保持不变。
  - 👆 触摸与滚轮操作：修复底层视频画面抢占手势，恢复普通／全屏下的横滑快进快退、亮度与音量调节，保留长按倍速；修复鼠标滚轮意外缩放画面或无法交给播放控件处理的问题。
  - 🖱️ 全屏鼠标自动隐藏：视频全屏时，控件隐藏且鼠标静止后自动隐藏光标，移动即恢复；保留菜单、输入框和控件操作时的保护，退出全屏或窗口失焦后恢复。
  - 💬 评论滑动联动播放器：视频和影视页中，直接在主评论或楼中楼内上滑也能连续收起方形／竖屏播放器，下滑回到列表顶部后再展开；保留主评论位置、简介／评论各自的滚动状态及原播放会话。
  - 🎛️ 小窗控件整理：保留播放、时间、弹幕和全屏等常用操作，清晰度、倍速、音量与新增音质选择集中在“更多播放选项”，适配窄窗口与大字号。
  完整更新范围：v1.2.6+3 → v1.2.6+4
  验证与兼容性提示：
  - Windows 已有受控分轨播放、音质切换、定时暂停和杜比公开样片回归；Android 杜比颜色路径已在 Xiaomi 13 验证，随后加入的能力检查与兼容流回退未在最终 Android 版本重新实机验收。真实大会员在线杜比源的端到端回退、其他设备及长期稳定性仍待验证。
  - 杜比视界当前转换为 SDR 显示，尚未实现 HDR／Dolby Vision 显示器透传。Android Profile 5 使用软件解码，可能增加 CPU 占用与功耗；普通兼容片源继续使用原有解码路径。
  - 定时关闭未新增系统闹钟或后台服务；系统暂停应用进程时，会在恢复后检查截止时间，应用被系统结束后不保留计时。其他平台的锁屏／长期后台行为仍待设备验证。
  - macOS／iOS／Linux 原生播放兼容性仍需实机确认；本次 macOS Intel x64 包未执行启动、窗口及安全存储运行验收。
  📦 构建与安装说明
  BiliSail（哔帆）1.2.6+4 预览构建。
