ReleaseNotes: |-
  BiliSail v1.2.6+5 · 会员彩色弹幕，长按操作更方便 ⛵
  本次更新新增会员彩色弹幕显示与发送、视频卡片长按菜单，修复 Android 视频首帧、iOS 播放返回入口和触屏进度预览问题，并完善 macOS 全屏播放窗口的关闭流程。
  ✨ 新功能
  - 🌈 会员彩色弹幕：视频与番剧／影视支持显示白字、粉蓝渐变描边的会员弹幕，发送样式面板新增会员色块与效果预览。有有效大会员权益的账号可选择发送，实际授权与可见性以服务端为准；普通账号也可观看他人的会员弹幕。新增默认开启的“显示会员彩色弹幕”开关，支持样式记忆、成功发送回显及下载后的离线显示。
  - 👆 视频卡片长按菜单：有操作菜单的卡片可长按封面、标题或作者区域打开，窄屏显示底部抽屉，宽屏显示锚点菜单；三点按钮使用相同展示方式。推荐页可选择“不感兴趣／稍后再看”，稍后再看与历史页保留各自的删除操作，抽屉适配安全区和大字号。
  🛠️ 播放与交互修复
  - 📱 Android 视频首帧：修复部分视频打开时先闪出灰色或单色画面、暂停打开时可能停在异常首帧的问题。等待有效画面就绪后再显示视频，兼顾自动硬解、软件解码及杜比视界转换。
  - 🧭 iOS 播放导航：多标签模式补齐播放器内的返回与主页入口，点按画面即可唤出；视频和听视频全屏时保留左上角返回，先退出全屏。顶部控件避让刘海和横屏安全区，返回继续沿用原有浏览与媒体历史。
  - 🖼️ 触屏快进预览：横滑调整进度时，缩略图尚未加载好、不可用或加载失败均只显示时间，画面就绪后再显示缩略图，移除等待期间的灰框与空白占位。
  - 🪟 macOS 全屏窗口关闭：调整独立播放窗口的关闭顺序，等待媒体释放和原生全屏转换完成后再销毁窗口，规避关闭与释放交错的生命周期竞态。播放窗与浏览窗合并为系统标签且仍有其他标签时，关闭播放标签不再主动退出共享全屏；快速重开会等待上个播放窗口完成关闭。
  完整更新范围：v1.2.6+4 → v1.2.6+5
  📦 构建与安装说明
  BiliSail（哔帆）1.2.6+5 预览构建。
