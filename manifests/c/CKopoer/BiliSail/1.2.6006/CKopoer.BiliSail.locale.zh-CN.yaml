ReleaseNotes: |-
  BiliSail v1.2.6+6 · 动态更清爽，播放更随心 ⛵
  本次更新新增动态页默认标签、播放倍速记忆开关与取消稍后再看，合并联合投稿的重复视频动态，并改进播放地址获取和 macOS 全屏切换。
  ✨ 新功能
  - 🧭 动态页默认标签：在“设置 → 外观”中选择默认打开“动态”或“视频动态”。手动切换后，本次运行内再次进入仍保留所选标签与滚动位置。
  - 🎚️ 播放倍速记忆开关：在“设置 → 播放”中新增“记忆播放倍速”，默认开启。关闭后，新打开的内容使用默认播放倍速。开关设置会跨启动保存；最近手动选择的倍速仅在本次运行内记忆，重启后使用默认倍速。
  - ✅ 取消稍后再看：桌面视频封面右上角的已勾选按钮支持再次点击取消；共用视频卡片菜单也提供“稍后再看／取消稍后再看”操作。取消成功后，同步更新稍后再看列表和已有播放队列。
  🛠️ 问题修复
  - 🧹 联合投稿动态去重：“视频动态”和“动态 · 视频”中，同一联合投稿的视频不再重复显示，跨页加载也保持去重。“动态 · 全部”、图文和转发仍独立展示。
  - 🔄 播放地址获取重试：普通视频偶发缺少播放轨道或临时提示“当前内容暂不可用”时，在权益核对后自动有限重试。明确的权限、删除或风控错误不会触发新增重试。
  - 🍎 macOS 全屏状态恢复：应用原本处于系统全屏时，退出视频全屏后保留应用全屏；从普通窗口进入视频全屏后，退出时恢复普通窗口。同时完善重复进出和关闭窗口时的处理。
