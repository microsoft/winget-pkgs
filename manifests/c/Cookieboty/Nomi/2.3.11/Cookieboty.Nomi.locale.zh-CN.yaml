ReleaseNotes: |-
  Nomi· 诺米 2.3.11
  改动文件的 Diff 和打开的文件放在同一排标签里看。
  - 在右栏「改动」里点文件，预览区打开它的 Diff 标签，每个文件一个；文件本身是另一个标签，来回切换都留着。
  - 左侧会话栏可以拖动右边缘调宽，双击恢复默认，也能用方向键调；窗口窄时自动封顶。
  - 删除编程助手会话会先结束它的进程，再永久删除记录，不再在后台继续跑或重新出现。
  细节
  - 删除任务后，列表、看板和计数立即刷新。
  - macOS 上桌面角色显示时不再抢走对话窗口的焦点。
  - Claude Code 子代理的会话不会顶掉主会话，下一轮接着原来的会话。
  - 看板里暂停的编程助手标签关掉后，不再留在暂停列表里。
  English
  Diffs of changed files open as tabs next to the files you have open.
  - Click a file under Changes in the right rail to open its diff tab, one per file; the file itself is a separate tab and both stay when you switch.
  - Drag the right edge of the chat sidebar to resize it; double-click resets and arrow keys adjust. It is capped in narrow windows.
  - Deleting a coding-agent session now stops its process first and then permanently removes the record, so it no longer keeps running or comes back.
  Details
  - After deleting a task, the list, board and counts refresh right away.
  - On macOS the desktop character no longer takes focus from the chat window when it appears.
  - A Claude Code subagent's session no longer replaces the main one, so the next turn resumes the right session.
  - Closing a coding-agent tab paused from the board no longer leaves it in the paused list.
