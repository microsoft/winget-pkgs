ReleaseNotes: |-
  Nomi· 诺米 2.3.3
  新增 Agent 看板，一眼看清 Nomi 和各个编程助手在做什么、占了多少内存，内存紧张时自动暂停与恢复；macOS 上编程助手在系统沙箱里运行，可以放心让它们全自动干活。 / A new agent board shows what Nomi and every coding agent are doing and how much memory they use, pausing and resuming them automatically when memory runs low; on macOS coding agents run in a system sandbox, so they can safely work fully automatically.
  新功能 / New
  - Agent 看板：左侧导航栏的「Agents」按待进行 / 进行中 / 已暂停 / 已完成列出 Nomi 的对话、后台 agent、派出的和工坊里的编程助手，以及你在终端或 IDE 里自己开的编程助手会话（只读）；每张卡片显示内存与 CPU，标题栏的负载指示显示在跑的数量与总占用 / Agent board: "Agents" in the left rail lists Nomi chats, background agents, dispatched and workbench coding agents, and coding-agent sessions you started in a terminal or IDE (read-only) in To do / In progress / Paused / Done; each card shows memory and CPU, and a load indicator in the title bar shows how many are running and their total usage
  - 内存守护：内存偏高时先回收空闲标签的进程，内存紧张时逐个暂停 Nomi 派出的和工坊里的编程助手，恢复后自动从暂停处继续；可以手动暂停 / 继续，也可以关掉自动处理 / Memory guard: when memory is elevated idle tabs' processes are freed first, and when it is low the coding agents Nomi dispatched and those in the workbench are paused one by one and resumed where they stopped once memory recovers; pause / resume by hand or turn automatic handling off
  - Nomi 会看看板调度：说到电脑卡、内存或一次派好几个编程助手时，Nomi 能查看看板、暂停或继续它派出去的编程助手；内存紧张时新派的任务排队，缓解后自动开始 / Nomi schedules with the board: when you mention a slow computer, memory or hand off several coding agents, Nomi can check the board and pause or resume the agents it dispatched; while memory is low new hand-offs wait and start once it recovers
  - macOS 系统沙箱（默认开）：编程助手读不到 SSH 与 Git 凭据、云账号凭据、密钥库、浏览器数据、个人数据、.env 与私钥文件，只能写项目文件夹和自己的配置缓存；被挡下时对话里出现卡片，可以本会话允许、始终允许（只对这个项目）或不允许，允许后自动接着做 / macOS system sandbox (on by default): coding agents can't read SSH and Git credentials, cloud credentials, key stores, browser data, personal data, .env or private-key files, and can only write to the project folder and their own config and caches; a blocked action shows a card in the chat to allow for this session, always allow (this project only) or deny, and the agent carries on once allowed
  - 子任务在对话旁边单独一栏打开，可以接着和它对话：运行中插话、「停止」打断、空闲时再做一轮，之后的结果都会回到主对话 / Sub-tasks open in their own column beside the chat and you can keep talking to them: interject while running, Stop to interrupt, send again when idle, and every later result comes back to the main chat
  - 会话详情：标题栏的按钮在对话右侧开一栏，显示工作区、分支、本会话的变更、子任务与持续任务及状态 / Session details: a title-bar button opens a column beside the chat with the workspace, branch, this session's changes, and its sub-tasks and tasks with their status
  改进 / Improvements
  - Nomi 对话每轮的固定上下文减半，提示缓存命中率更高：上一轮的工具调用原样带进下一轮，长期记忆不再重复召回 / Nomi's fixed per-turn context is halved and prompt caching hits more often: the previous turn's tool calls carry over as-is and long-term memories aren't recalled twice
  - 上下文环的分项按实际请求拆分：单独列出系统提示、工具定义和长期记忆 / The context ring's breakdown comes from the actual request, listing the system prompt, tool definitions and long-term memory separately
  - 编程助手的工作目录只能是项目文件夹，启动时不再继承环境里的令牌、密码和云账号密钥；Codex 默认不联网，可在「编程助手 → 权限」打开 / A coding agent's working folder must be a project folder, and agents no longer inherit tokens, passwords or cloud keys from your environment; Codex is offline by default and can be allowed online in Coding agents → Permissions
  - 「桌面权限 → 隐私保护」可以添加受保护的文件夹、放行确实需要的环境变量、开关沙箱和撤销「始终允许」 / Desktop permissions → Privacy adds protected folders, allows environment variables you need, switches the sandbox and revokes "Always allow"
  修复 / Fixes
  - 沙箱补上几个口子：没授权时连不上 ssh-agent 和 Docker，不能用 osascript 让别的应用代劳，读不到发布令牌和命令行历史，改不了会在沙箱外执行命令的配置；写入授权只放开最小范围 / The sandbox closes several gaps: without a grant agents can't reach ssh-agent or Docker, can't use osascript to have other apps act, can't read publish tokens or shell history, and can't change configuration that runs commands outside the sandbox; write grants open only the smallest scope
  - Nomi 意外退出后，被暂停的编程助手会在下次启动时自动恢复 / Coding agents paused when Nomi quit unexpectedly resume on the next start
  - 新建对话不再复用还在后台生成首轮回复的对话 / New chat no longer reuses a chat whose first reply is still generating in the background
  - 在「设置 → 已归档的对话」里永久删除对话时，先停止它正在进行的回复 / Permanently deleting a chat from Settings → Archived chats stops its in-progress reply first
