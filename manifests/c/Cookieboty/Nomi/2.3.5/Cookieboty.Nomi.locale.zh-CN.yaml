ReleaseNotes: |-
  Nomi· 诺米 2.3.5
  灵动岛、Agent 看板、任务看板和素材库全部重做：等你处理的事直接在灵动岛上允许或拒绝，看板写清每个助手在做什么、占多少资源，素材库按分类整理生成的图片。 / The Dynamic Island, Agent board, task board and asset library are redesigned: allow or deny what's waiting for you right on the island, the boards show what each agent is doing and what it uses, and the asset library sorts generated images by category.
  新功能 / New
  - 灵动岛改版：深色胶囊，Nomi 图标带状态角标；编程助手要权限、批准计划、沙箱拦下、Nomi 要你确认的操作等一直留在岛上，可以直接允许或拒绝，多条时按列表展示；可在「设置 → 通知」里单独关掉 / Redesigned Dynamic Island: a dark capsule with a status badge on the Nomi icon; coding agent permission requests, plan approvals, sandbox blocks and actions Nomi asks you to confirm stay on the island and can be allowed or denied right there, listed when there are several; can be turned off in Settings → Notifications
  - Agent 看板改版：按状态、助手类型筛选和搜索，卡片写清状态、来源、目录与 CPU / 内存，底部显示 Nomi 自己的占用与内存守护最近做的事 / Redesigned Agent board: filter by status and agent type or search, cards show status, source, folder and CPU / memory, and the footer shows Nomi's own usage and what the memory guard did recently
  - 新增「调度策略」：委派与后台任务合计，省资源（同时最多 5 个）/ 均衡（10 个）/ 全速（不限个数，按 CPU 与内存放行），选了立即生效 / New dispatch policy for delegated agents and background tasks combined: Saver (up to 5 at once) / Balanced (10) / Full speed (no limit, gated by CPU and memory), applied immediately
  - 任务看板改版：进度合并成待开始 / 进行中 / 待处理 / 已结束四档，可按进度筛选和搜索，卡片上直接立即运行或暂停 / Redesigned task board: progress is merged into to do / in progress / needs you / done, with filtering by stage and search, and run now or pause right on the card
  - 素材库改版：按分类、来源和搜索筛选，显示已用空间；生成的图片自动分类，可以自己改分类、加标签；图片详情支持全屏查看、左右切换、缩略图和相关推荐 / Redesigned asset library: filter by category, source and search with storage used shown; generated images are categorized automatically and you can change the category and add tags; image details offer full-screen view, previous / next, thumbnails and related images
  - 新快捷键「在终端打开当前项目」：macOS ⇧⌘C，Windows / Linux Ctrl+Shift+C，可在设置里改 / New shortcut "Open project in terminal": ⇧⌘C on macOS, Ctrl+Shift+C on Windows / Linux, configurable in Settings
  改进 / Improvements
  - Nomi 对话里的确认少弹很多：读工作区里的文件不再触发「读过外部内容」的确认；确认卡片上能勾「这个对话里不再询问」；同意过的委派，追问不再逐次确认 / Far fewer confirmations in Nomi chats: reading workspace files no longer triggers the external-content confirmation, cards offer "Don't ask again in this conversation", and follow-ups to an approved delegation no longer ask each time
  - 设置页整理：通用页改成左右两张卡，「已归档的对话」挪到「Nomi」，「权限」与「委派」合成「权限与委派」；没有说明栏的分区用满宽度，窄卡片里控件换到下一行 / Tidier Settings: General uses two side-by-side cards, Archived conversations moves to Nomi, Permissions and Delegation merge into Permissions & delegation; sections without a help column use the full width and controls wrap to the next line in narrow cards
  - 会话正文字号改成三档：普通、较大（默认）、特大 / Conversation text size is now three steps: Normal, Large (default) and Extra large
  - 主题选择默认只显示一行，其余点「更多主题」展开，当前主题始终看得到 / The theme picker shows one row by default with the rest under "More themes", and the current theme always stays visible
  - 侧栏顶部更简洁：去掉 Nomi 标志，展开 / 收起用标题栏的按钮 / A cleaner sidebar header: the Nomi logo is gone and the title bar button expands / collapses the sidebar
  修复 / Fixes
  - 会话详情里委派出去的子任务结束后不再一直显示「运行中」，出错会显示；「变更」按工作区的 git 改动统计，派出去的编程助手改的也算 / Delegated sub-tasks in session details no longer stay "running" after they finish and errors are shown; Changes counts the workspace's git changes, including those made by delegated coding agents
  - Nomi 派出去的会话在标签关掉后不再以「终端 · 只读」出现在 Agent 看板 / Sessions Nomi dispatched no longer reappear on the Agent board as read-only terminal sessions after their tab closes
  - 同一目录开着多个 Claude Code 时，Agent 看板不再把进程对错会话：刚开、还没发消息的显示在「空闲进程」里，正在用的不会被列成空闲 / With several Claude Code processes in the same folder, the Agent board no longer matches processes to the wrong sessions: a freshly opened one shows under idle processes, and one in use is no longer listed as idle
  - Agent 看板卡片与灵动岛里的会话标题不再显示「/clear」这类斜杠命令，改用第一句真正的提问 / Session titles on the Agent board and in the Dynamic Island no longer show slash commands like "/clear"; they use the first real prompt
  - Windows 上 Agent 看板能关掉空闲进程了，关不掉时会写明原因 / On Windows the Agent board can close idle processes again, and says why when it can't
  - Windows 上切换文件时不再闪出控制台窗口 / Console windows no longer flash on Windows when switching files
  - macOS 刘海屏上灵动岛不再被挤到菜单栏下面 / On notched Macs the Dynamic Island is no longer pushed below the menu bar
  - 开启「仅本地模型可读文件」时，对话换成云端模型后不能再分页读出之前本地模型读到的长文件、命令输出和网页；长任务里交给云端摘要模型的较早步骤也不再带这些内容 / With "only local models can read files" on, a chat switched to a cloud model can no longer page through long files, command output or web pages a local model read earlier, and earlier steps of a long task handed to a cloud summary model no longer include that content
  - 删除对话摘要或清空记忆时，正在进行的整理不会再把删除前的内容写回来 / Deleting a conversation summary or clearing memory no longer lets a summary in progress write the deleted content back
