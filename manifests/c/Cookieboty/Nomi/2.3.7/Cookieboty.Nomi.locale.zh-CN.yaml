ReleaseNotes: |-
  Nomi· 诺米 2.3.7
  新增内置编程助手 Kimi Code 与 MiniMax Code；Agent 看板可以直接关闭标签、批量关闭空闲进程；第三方供应商的 Key 可以写备注；修复后台任务派出的编程助手一直排队、灵动岛旧按钮作用到新请求等问题。 / Kimi Code and MiniMax Code join the built-in coding agents; the Agent board can close tabs directly and close idle processes in bulk; third-party provider keys can carry a note; fixes for coding agents queued forever under background tasks, stale Dynamic Island buttons acting on new requests, and more.
  新功能 / New
  - 新增内置编程助手 Kimi Code 与 MiniMax Code：在「设置 → 编程助手」安装、更新、登录官方账号（可添加多个账号），也能用「模型与供应商」里的第三方模型（经 Nomi 网关，不改你自己的配置）；可以开标签对话、切换权限模式、续接会话，Nomi 也能把任务委派给它们 / New built-in coding agents Kimi Code and MiniMax Code: install, update and sign in with official accounts (several allowed) in Settings → Coding agents, or use third-party models from Models & Providers (through the Nomi gateway, your own config is untouched); open tabs, switch permission modes, resume sessions, and let Nomi delegate tasks to them
  - Agent 看板：做完了的标签在卡片右下角可以直接关闭；空闲进程可以勾选多个（或全选）一起关闭，没关掉的逐个写明原因 / Agent board: finished tabs can be closed from the bottom right of their card; idle processes can be selected (or all at once) and closed together, with a reason for each one that could not be closed
  - 第三方供应商的每个 Key 可以写备注（比如哪个账号、余额、到期时间），显示在 Key 后面；更换 Key 的值时备注保留 / Each third-party provider key can have a note (which account, balance, expiry…) shown next to the key; it is kept when you replace the key's value
  - 模型选择显示模型或供应商的品牌图标，输入栏一排的图标大小统一、和文字对齐 / Model pickers show the model's or provider's brand icon, and the icons along the input bar share one size and line up with the text
  修复 / Fixes
  - 后台 Nomi 任务把同时运行名额占满后，它们派出的编程助手不再一直排队直到超时（#294） / Coding agents dispatched by background Nomi tasks no longer queue until they time out when those tasks fill every running slot (#294)
  - 灵动岛上旧的批准按钮不会再作用到同一任务的新请求（#293） / An old approval button on the Dynamic Island no longer acts on the task's next request (#293)
  - 手动关闭空闲编程助手时，读不到最新的进程列表就提示稍后再试，不再按旧列表结束进程（#295） / Closing an idle coding agent by hand asks you to try again when the process list can't be read, instead of acting on an old list (#295)
  - 内存紧张时不再暂停你正在看的编程助手标签（之前正在等的回复会一直卡住） / Under memory pressure the coding agent tab you are looking at is no longer paused (the reply you were waiting for used to hang)
  - 编程助手的提醒少打扰：几个前后脚完成时合成一条，等你处理的照常马上提醒；不再重复提醒或冒出没发生过的「已完成」 / Fewer coding agent reminders: several finishing together become one, ones that need you still show right away, and no more duplicate or phantom "done" reminders
  - 沙箱少打扰：工具写日志和缓存、包管理器例行读取 ~/.npmrc / ~/.pypirc 不再弹授权请求；Kimi Code、MiniMax Code 和第三方供应商的 dsh 标签在沙箱里能正常启动 / Fewer sandbox prompts: tools writing logs and caches and package managers' routine reads of ~/.npmrc / ~/.pypirc no longer ask; Kimi Code, MiniMax Code and dsh tabs on third-party providers start normally in the sandbox
  - 编程助手装好就出现在侧栏，不用重启 / Coding agents appear in the sidebar as soon as they are installed, no restart needed
  - 编程助手启动失败时提示写的是它自己的名字和原因，不再一律说成「Gemini 版本过旧」 / When a coding agent fails to start, the message names that agent and the reason instead of always saying "Gemini is too old"
  - 编程助手会话的标题显示你发的第一句话，不再是沙箱说明 / Coding agent session titles show your first message instead of the sandbox note
  - 编程助手消息底部的模型显示供应商名（如「MAAS · kimi-k3」），不再显示内部 id / The model under coding agent messages shows the provider name (like "MAAS · kimi-k3") instead of an internal id
  - Kimi Code 标签里的工具调用显示具体命令和参数 / Tool calls in Kimi Code tabs show their commands and arguments
  - 输入栏的「完全放开」按钮不再带红框和底色，只用红色文字提示 / The Full access button in the input bar drops its red border and fill and keeps only red text
