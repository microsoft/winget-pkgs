ReleaseNotes: |-
  Nomi· 诺米 2.1.1
  模型接入与日常体验版本：一家供应商挂了自动换下一家，第三方供应商可以从网页一键接入，新增浅色与深色主题。Go 版与 Electron 版同时提供（文件名以 Nomi-Electron- 开头的是 Electron 版）。 / A model-access and everyday-polish release: when one provider fails Nomi moves on to the next, third-party providers can be added from a web link, and there are new Light and Dark themes. Go and Electron builds ship together (Electron files are named Nomi-Electron-…).
  新功能 / New
  - 自动故障转移：同一个模型配了多家第三方供应商时，一家返回 429 / 5xx 或超时，先在同一个 Key 上稍等重连，再按列表顺序换到下一家；等待时对话里会显示「ProvA 返回 503，换到 ProvB 继续」，回复底部写的是实际回答的那一家 / Automatic failover: when the same model is set up on several third-party providers and one returns 429 / 5xx or times out, Nomi retries on the same key after a short wait, then moves to the next provider in list order; while it waits the chat shows "ProvA returned 503; continuing with ProvB", and the reply footer names the provider that actually answered
  - 「模型」页可以拖动调整供应商顺序（排在前面的先用），每行都有启用开关，停用的直接跳过 / Drag providers on the Models page to set their order (the first is tried first); each row has an on/off switch, and disabled providers are skipped
  - 从网页添加第三方供应商：中转站或模型平台网页上的「添加到 Nomi」链接点一下，确认后就加好；也支持网页授权（在对方网站登录同意，Key 不出现在链接里），「设置 → 模型与供应商 → 网页授权」填网址即可；已有同地址的会更新它，不重复添加 / Add third-party providers from the web: click an "Add to Nomi" link on a relay or model platform and confirm; web authorization is supported too (sign in and approve on their site, and the key never appears in a link) from Settings → Models & providers → Authorize on web; a provider with the same endpoint is updated instead of added twice
  - 浅色与深色主题，新安装默认浅色 / Light and Dark themes, with Light as the default for new installs
  - 新对话自动起标题：发出第一条消息后用当前聊天模型起一个简短的标题；不想多请求一次模型，可以在「设置 → 隐私与权限」关掉，改用第一句话 / New chats get a title automatically: after the first message the current chat model suggests a short title; to skip that extra request, turn it off in Settings → Privacy & permissions and the first sentence is used instead
  - 每个会话的输入框草稿分开保存，切换会话不会串 / Each chat keeps its own draft in the input box, so switching chats doesn't mix them up
  改进 / Improvements
  - 「模型」页重做：添加供应商时按官方厂商 / 三方平台 / 本地 / 其他地址分组；编辑分左右两栏，模型可以搜索、筛选、批量开关；Nomi AI 与编程助手放在同一组卡片里 / The Models page is redesigned: adding a provider is grouped by official vendors, platforms, local and custom addresses; the editor has two columns with model search, filters and bulk toggles; Nomi AI and the coding assistants share one card grid
  - 新建任务的表单分左右两栏，可以限定任务能访问的文件夹；任务的文件工具只在这些文件夹里，收窄授权立即生效 / The new-task form has two columns and can limit which folders a task may use; the task's file tools stay inside them, and narrowing the grant takes effect immediately
  - 「用量与分析」：模型数据同步挪到这里，可以立即同步；默认美元兑人民币汇率 6.75 / Usage & analytics: model data sync moved here with a Sync now button; the default USD to CNY rate is 6.75
  - 「编程助手」页改为两栏，左侧固定列表；Nomi 设置页加宽 / The Coding assistants page has two columns with a fixed list on the left; Nomi settings pages are wider
  - 桌面操作记录保留 30 天并分页显示 / Desktop activity records are kept for 30 days and shown in pages
  - 侧栏「本机历史」默认折叠 / Local history in the sidebar is folded by default
  - 编程助手标签按第一句话起标题，助手自己的会话标题出来后会替换它 / Coding assistant tabs are named from the first message, and the assistant's own session title replaces it once available
  修复 / Fixes
  - Nomi 把活交给编程助手（如 Codex）后，改过的文件会列在子任务卡片里，点开就能预览，Markdown 显示排版后的样子 / After Nomi hands work to a coding assistant such as Codex, the files it changed are listed on the subtask card and open in a preview, with Markdown shown formatted
  - 桌面角色的确认气泡出现时，台词气泡先让开，不再叠在一起 / When the mascot shows a confirmation bubble, its speech bubble steps aside instead of overlapping it
  - 很快的回复显示真实用时，不再显示「0ms」 / Very fast replies show their real duration instead of "0ms"
  - 任务：准备工作副本时取消或撤销会立即生效；重试与续跑保留触发它的事件；Nomi 任务固定使用预设模型 / Tasks: cancelling or revoking while the worktree is being prepared takes effect right away; retries and resumes keep the event that triggered them; Nomi tasks always use the preset model
  - Codex 配置里引用的文件会带进各个账号；用 gh 登录的 GitHub 连接在使用前会重新核对当前账号 / Files referenced in Codex's config are carried into each account; GitHub connections that use the gh login re-check the current account before use
  说明 / Notes
  - 已安装 2.0.4 到 2.1.0 的用户在应用内检查更新即可升级到 Go 版 2.1.1 / Users on 2.0.4 through 2.1.0 update in-app to the Go build 2.1.1
