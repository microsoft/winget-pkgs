ReleaseNotes: |-
  Nomi· 诺米 2.3.10
  Nomi 和编程助手可以直接操作你电脑上的应用了。
  - 在「设置 → Computer Use」装好执行器并授权，Nomi 就能读界面、点按钮、填表、按快捷键。
  - 点一次「允许」，这个对话里后面的桌面操作自动执行；付款、发送、删除仍每次确认。
  - Claude Code、Codex 等编程助手改完代码，可以自己打开应用点一遍。
  - 对话区上方的「停止」或 ⌘⇧. / Ctrl+Shift+. 随时中止。
  - 引导缩成三步，装好编程助手就进看板；桌面角色默认关闭。
  细节
  - 跑命令的确认卡片可以「本会话始终执行」。
  - 文件 Diff 按语言高亮；Mermaid 图可以点开放大。
  - 编程助手第一轮出错后，下一轮接着原来的会话。
  - 去掉任务的预算拦截，自动续跑不再中途停下。
  - 网址点一次只开一个页面；预览里改过的文件不会被旧内容覆盖（#323、#324）。
  English
  Nomi and your coding agents can now operate apps on your computer.
  - Install the executor in Settings → Computer Use, grant access, and Nomi can read the UI, click, fill in forms and press shortcuts.
  - Allow once and the rest of that conversation's desktop actions run on their own; payments, sending and deleting still ask every time.
  - Coding agents such as Claude Code and Codex can open the app and click through it after changing code.
  - Stop above the chat, or ⌘⇧. / Ctrl+Shift+., ends it at any time.
  - Onboarding is three steps and lands on the board once a coding agent is installed; the desktop character is off by default.
  Details
  - Command confirmations can "Always run in this chat".
  - File diffs are syntax-highlighted; Mermaid diagrams open full size.
  - After a coding agent's first turn fails, the next turn resumes the same session.
  - Task budget interception is gone, so auto-continue no longer stops halfway.
  - A web link opens one page, not two; a previewed file is never overwritten with stale content (#323, #324).
