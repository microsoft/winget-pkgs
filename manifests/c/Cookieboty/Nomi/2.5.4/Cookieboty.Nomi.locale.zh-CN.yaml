ReleaseNotes: |-
  Nomi· 诺米 2.5.4
  主区可以把跨项目的两个会话并排打开对照着用，而左侧的项目/会话列表和右侧文件区仍只有一份。
  - 从左侧列表把会话拖到主区，即可把它分屏打开，跨项目也行。
  - 分屏后共用一条单行顶栏，两侧的操作图标常驻显示。
  - 两侧各有一个「打开文件」开关，按自己会话所在的目录打开文件，仍写进同一份全局文件区。
  - 空白对话可以自由切换底座；一旦有了消息，Antigravity 这类只能人工直连的底座就不再允许切换。
  - 托管 Claude、Codex、ACP 与托管 API 运行时放宽了单条消息的大小上限，大段粘贴不再容易被截住。
  - 给这些运行时附上已在本机路径上的文件时，只传文件路径引用，不再把整个文件正文塞进消息。
  细节
  - 托管运行时的历史交接预算仍约为 60k，单条当前请求放宽到约 2MB；超出时提示「消息内容过长」并给出实际大小上限，不再显示成未知错误。
  - 只能人工直连的底座在有消息后锁定，避免把带历史的对话切换过去或回放上下文；想换底座时，请先新建一个空对话。
  English
  The main area can now show two chat sessions side by side, even across projects, while the left project/session list and the right file area stay shared.
  - Drag a session from the left list into the main area to open it in a split view, including sessions from other projects.
  - Split view uses one single-line top bar, with both sides keeping their action icons visible.
  - Each side has its own "Open file" toggle and opens files from its own session's folder, still into the same single file area.
  - Empty chats can switch backends freely; once a chat has messages, interactive-only backends such as Antigravity stay locked.
  - Managed Claude, Codex, ACP, and managed API runtimes raise the size limit for a single message, so large pastes are less likely to be rejected.
  - For these runtimes, attachments that already have a local path are sent as a path reference instead of the full file body.
  Details
  - Historical handoff for managed runtimes stays around 60k, while a single current request is allowed up to about 2MB; going over now shows a clear "message too long" notice with the actual limit instead of an unknown error.
  - Interactive-only backends lock once the chat has messages, so a conversation with history is never switched into them or replayed; start a new empty chat if you want to change backends.
