ReleaseNotes: |-
  Segurança
  - A pasta de instalação já não é gravável por usuário comum. As versões
    anteriores davam Controle Total sobre C:\Program Files\Convectiva\AgentWatcher
    ao grupo Usuários, o que permitia a qualquer usuário local substituir o
    executável ou os scripts auxiliares. A atualização também remove essa
    permissão de instalações já existentes.
  - O Client Secret da API do PBX já não é passado na linha de comando do
    PowerShell, onde ficava visível para outros processos e era registrado pelos
    logs de EDR e do PowerShell.
  - O Client Secret guardado no registro agora é protegido com DPAPI.
  - Os logs saíram da pasta de instalação para %LOCALAPPDATA%\AgentWatcher.

  Correções
  - A instalação silenciosa (/VERYSILENT, usada pelo "winget install --silent")
    falhava com código 7. A verificação do .NET 6 lia a visão errada do registro
    e concluía que o pré-requisito faltava mesmo quando instalado, e a página de
    download não existe sem assistente.

  Novidades
  - O status de presença do ramal pode ser trocado pelo menu da bandeja.
  - As filas de que o ramal participa aparecem no menu da bandeja, com pausa e
    retomada individuais.
  - Pausas programadas por fila, com dias da semana. A pausa entra mesmo com a
    tela bloqueada; a retomada espera o desbloqueio do computador.
ReleaseNotesUrl: https://github.com/ederpardeiro/AgentWatcher/releases/tag/v1.0.3
