ShortDescription: Monitora a inatividade do usuário e altera automaticamente o status de presença de um ramal Yeastar P-Series.
Description: O AgentWatcher monitora a inatividade do usuário (bloqueio/desbloqueio de tela) e altera automaticamente o status de presença de um ramal Yeastar P-Series para Ausente ou Disponível, ajudando os agentes de contact center a manterem seu status atualizado. Também permite trocar o status manualmente e pausar ou retomar o ramal em cada fila de que ele participa, à mão ou por horário programado.
