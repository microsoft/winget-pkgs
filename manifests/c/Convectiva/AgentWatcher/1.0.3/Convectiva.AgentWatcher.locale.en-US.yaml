ShortDescription: Monitors user inactivity and automatically changes the presence status of a Yeastar P-Series PBX extension.
Description: AgentWatcher monitors user inactivity (screen lock/unlock) and automatically changes the presence status of a Yeastar P-Series PBX extension to Away or Available, helping contact center agents keep their status accurate. It can also change the presence status on demand and pause or resume the extension in each queue it belongs to, either manually or on a schedule.
