ReleaseNotes: |-
  New Features
  - SMTP Authentication for Forwarding - The Forward dialog and forwarding rules now support SMTP username/password authentication, along with Forward dialog usability improvements and a new Name property for rules. Fixes #363 (Thanks for the report, Theo-bos!)
  - Configurable Web UI Path Prefix - The Papercut Service web UI and API can now be hosted under a configurable HTTP path prefix, enabling reverse proxy scenarios (e.g. https://myserver/papercut/). Fixes #365 (Thanks for the suggestion, Moreno-Gentili!)
  - Copy to Clipboard Context Menus - Right-click now offers Copy / Select All for selected text in the HTML message viewer (alongside the existing link menu), and in the Headers, Text Body, and Raw views. Fixes #366 (Thanks for the suggestion, PJOttCanHome!)
  Improvements
  - .NET 10 Upgrade - All projects upgraded from .NET 8 to .NET 10 for the latest runtime performance and security improvements. (Thanks, Abdulstar!)
  - Service Tray Manager Deployment - The Service Tray Manager introduced in v7.7.2 is now included in the Windows Service deployment packages
  - Smaller UI Footprint - Removed unused MahApps icon pack dependencies, reducing application size. Fixes #370 (Thanks, AntekOlszewski!)
  - Documentation - Added Web UI screenshots and fixed the README star history chart (Thanks, PingouinFerreux!)
  - Dependencies - Updated NuGet packages across all projects, including Rx.NET 7, ReactiveUI 24, WebView2, Autofac, and BouncyCastle, addressing a number of dependency vulnerability alerts
  Bug Fixes
  - Message List Stuck After Long Uptime - Fixed the desktop app's message list permanently stopping to update after running for a long time (new emails triggered notifications but never appeared until restart). A single transient file-system error could silently terminate the internal refresh subscriptions; refreshes are now resilient to errors, and the message list additionally force-refreshes whenever the window is restored from the tray or taskbar
  - Rule Sync to Service - Fixed rule changes made in the desktop UI not being saved to the Papercut Service backend when connected. Fixes #368 (Thanks for the report, Pxtl!)
  - Periodic Rules in Standalone Service - Fixed periodic background rules (such as the Mail Retention rule) never executing when running the standalone Papercut Service. Fixes #369 (Thanks for the report, Pxtl!)
  Contributors
  Special thanks to Abdulstar for the .NET 10 upgrade, AntekOlszewski for the icon pack cleanup, PingouinFerreux for the README fix, and to Theo-bos, Moreno-Gentili, and Pxtl for their reports and suggestions!
