ShortDescription: Collect and process observability data at the edge
Description: |-
  Cribl Edge helps you collect and process observability data - logs, metrics, and application data - in real time, from your Linux, Windows, and macOS machines, apps, or microservices, and deliver them to Cribl Stream or any supported destination.
  With Cribl Edge you can:
  - Automatically discover and collect host, container, and application metrics, as well as logs, on endpoints.
  - Process data with Functions and Pipelines.
  - Forward data to any of the many supported destinations.
  - Easily manage configurations while maintaining version control.
  - Teleport to the edge for local preview and configuration validation.
ReleaseNotes: |-
  This release corrects one critical issue found in Cribl Edge:
  - When a JSON field contained a string value larger than 8 MB, the JSON Array Event Breaker failed while parsing that value and raised an error for every remaining character in the chunk. This drove Worker Process CPU usage to its limit, stalled the event loop, and silently dropped all remaining records in the request while the Source still returned HTTP 200. Malformed JSON caused the same failure. The Event Breaker now stops at the first parse error, discards the rest of the request, and logs a warning. Other valid JSON is unaffected. (CRIBL-45815)
  See the Cribl Edge 4.20.0 release notes for the latest feature and correction updates.
