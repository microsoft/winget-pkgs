PackageIdentifier: CZNIC.Datovka
PackageVersion: 4.30.0
PackageLocale: en-US
ShortDescription: Datovka is a multi-platform desktop application for accessing data boxes and permanently storing data messages in a local database.
Description: Datovka is a cross-platform desktop application for accessing data boxes. The application's user interface is inspired by email clients. Datovka is free software protected by the GNU GPL version 3 license. Installation packages for Linux, Windows, and macOS are freely available for download.
ReleaseNotes: |-
  * Message database code is shared with mobile application.
  * Data-box list can be filtered according to listed box names, identifiers or
    logins.
  * Data-box list can be sorted according to box name, number of unread
    messages or last synchronisation time, or listed as arranged by the user.
  * Account database code is shared with mobile application.
  * Storing database format version into message database. Performing message
    database compatibility conversions according to stored version information.
  * Fixed an error when reading accessibility data from message list causing the
    application to abort on an assertion check.
  * A message can be reported to contain spam. A notification is shown in the
    message list if the message has been marked as spam by the ISDS.
