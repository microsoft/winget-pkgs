PackageIdentifier: CZNIC.Datovka
PackageVersion: 4.29.4
PackageLocale: en-US
ShortDescription: Datovka is a multi-platform desktop application for accessing data boxes and permanently storing data messages in a local database.
Description: Datovka is a cross-platform desktop application for accessing data boxes. The application's user interface is inspired by email clients. Datovka is free software protected by the GNU GPL version 3 license. Installation packages for Linux, Windows, and macOS are freely available for download.
ReleaseNotes: |-
  * Able to pass e-mail content into Outlook Classic via ActiveX on 32-bit and
     64-bit Windows 10 and 11.
   * Able to pass e-mail content into default e-mail clients like Thunderbird or
     new Outlook via the Windows Messaging (MAPI) in 64-bit Windows 10 and 11.
   * Default e-mail creation on Windows was changed from eml-file-based approach
     to try the following sequence of e-mail creation - 1st ActiveX, 2nd MAPI
     and 3rd create eml file.
   * Fixed broken attachment filename encoding when opening eml files by the
     Mail application on macOS.
   * Can be compiled against OpenSSL-4.0.
   * Added preferred payment method for commercial messages into the preferences
     dialogue.
   * Addressing the application by the name Datovka.cz.
