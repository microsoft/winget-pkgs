ShortDescription: Datovka je multiplatformní desktopová aplikace pro přístup k datovým schránkám a k trvalému uchovávání datových zpráv v lokální databázi.
Description: Datovka je multiplatformní desktopová aplikace pro přístup k datovým schránkám. Uživatelské rozhraní aplikace se inspiruje poštovními klienty. Datovka je svobodný software chráněný licencí GNU GPL verze 3. Instalační balíčky pro Linux, Windows a macOS jsou volně ke stažení.
ReleaseNotes: |-
  Byla vydána Datovka 4.29.4.
  Nové vlastnosti
  - Upraven výchozí způsob otevírání e-mailů ve Windows. Lze tak vyvářet e-maily i v Outlook Classic.
  Vylepšení
  - Lze překládat s OpenSSL-4.0.
  - Přidána volba pro upřednostňovaný způsob platby za poštovní datové zprávy.
  Opravy chyb
  - Opravena chyba v kódování názvů příloh, když jsou otevírány e-maily v programu Mail na macOS.
  Aplikace se připojuje na nové domény koncových bodů datovka.gov.cz a datovka-test.gov.cz, pokud používá knihovnu libdatovka-0.7.4 nebo novější.
  Aplikace používá jméno Datovka.cz, aby se odlišila od hovorového označení pro datovou schránku nebo datovou zprávu.
ReleaseNotesUrl: https://www.datovka.cz/cs/2026-08-13-datovka-4.29.4.html
