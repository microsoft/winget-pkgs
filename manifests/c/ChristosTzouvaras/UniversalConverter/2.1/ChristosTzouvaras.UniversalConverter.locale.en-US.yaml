ShortDescription: Convert images, documents, video and audio, build PDFs and pull tables into Excel, all offline.
Description: |-
  Universal Converter converts images, documents, videos and audio, builds PDFs and pulls tables into Excel.
  Everything happens on your computer: files are never uploaded. Images: JPG, PNG, WEBP, TIFF, BMP, GIF, ICO, resizing and OCR.
  To Excel: tables from PDFs, scans and photos into Excel or CSV. Documents: PDF, Word, ODT, RTF, TXT, Markdown, HTML, EPUB,
  PowerPoint and Excel. Video: MP4, MKV, WebM, MOV, AVI with AV1, H.265, H.264 or VP9, GIFs, frames and audio extraction.
  Available in 10 languages.
