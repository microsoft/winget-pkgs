ShortDescription: macOS-style open command for Windows (PowerShell, cmd, Git Bash)
Description: |-
  A dependency-free open.exe that behaves like the macOS open command: open files with their default
  application, folders in Explorer and URLs in the default browser. Supports -a to pick an application,
  -R to reveal the item in Explorer, -e to open in your editor ($VISUAL/$EDITOR/codium/code/notepad),
  -W to wait for the application to exit and -n for a dry run. Works identically from PowerShell, cmd
  and Git Bash.
