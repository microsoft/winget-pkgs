PackageIdentifier: ChMenegatti.Zeno
PackageVersion: 1.1.0
PackageLocale: en-US
Publisher: Cesar Menegatti
PublisherUrl: https://github.com/chmenegatti
PackageName: Zeno
PackageUrl: https://www.cesarmenegatti.com/zeno/
License: MIT
LicenseUrl: https://github.com/chmenegatti/zeno/blob/main/LICENSE
ShortDescription: Tab-less, local-first API client for REST, GraphQL, gRPC and WebSocket.
Description: |-
  Zeno is a desktop API client with a single screen and no tabs. Collections are plain YAML files you can keep in git,
  secrets are encrypted with a key in the OS keychain, and it imports Insomnia, Postman and OpenAPI. Supports REST,
  GraphQL, gRPC, WebSocket, Server-Sent Events, OAuth 2.0, a local mock server and a CLI for CI.
Tags:
  - api-client
  - rest
  - graphql
  - grpc
  - websocket
  - insomnia
  - postman
