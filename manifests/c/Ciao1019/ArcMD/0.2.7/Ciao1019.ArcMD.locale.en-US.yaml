ReleaseNotes: |-
  本版本紧急修复了 macOS 空间内含损坏/异常 PDF 时启动后闪退及 PDF 解析器并发竞态问题（#57、#60）与 输入 / 后粘贴或无匹配结果时方向键失效的问题（#58），同时新增 飞书 / Notion 风格全宽页面模式与右上角页面宽度快速切换按钮（#41、#59，感谢 @tajiaoyezi），并为 Linux KDE Wayland 将窗口控制按钮融合进顶部工具栏（#56，感谢 @Lyrecoul）。
  新功能与桌面体验
  - 全宽页面模式与右上角页面宽度切换（internal/prefs、internal/editor/view.go、internal/app/pagewidth.go）：支持在文档右上角工具栏、专注模式顶栏、「⋯」更多菜单、「设置 › 外观」、命令栏与快捷键 ⌥⌘P（Windows / Linux Ctrl+Alt+P）一键切换「窄（680）/ 标准（820）/ 较宽（1040）/ 全宽（铺满视口）」，全宽模式下自动保留左侧块手柄安全留白并避让大纲按钮，再次按下 ⌥⌘P 自动恢复进入全宽前的栏宽（#41、#59，感谢 @tajiaoyezi）。
  - KDE Wayland 窗口控制按钮融合进工具栏（internal/app/windowframe_linux.go、internal/app/windowbuttons.go）：在支持透明合成的 KDE Wayland 会话下启用客户端圆角边框，将最小化、最大化/还原与关闭按钮直接嵌入主窗口与独立文档窗口的顶部工具栏右侧（问答面板展开、分屏与窄窗下均保持可达，全屏自动隐藏，Alt/F10 唤出原生菜单），省去额外的系统标题栏，不影响 macOS、Windows 与其他 Linux 会话（#56，感谢 @Lyrecoul）。
  关键修复
  - 修复 macOS 空间内含损坏/异常 PDF 时启动闪退及解析器并发竞态（internal/pdfdoc）：修复 render_darwin.go 打开失败或 0 页 PDF 时返回带类型的 nil 接口导致后台搜索索引及打开 PDF 时触发 SIGSEGV 空指针闪退的问题；为纯 Go rawPDF 解析缓存增加互斥锁消除并发读写 map 竞态，并加固内容流/CMap 孤立分隔符游标推进与交叉引用表边界防护（#57、#60）。
  - 修复斜杠菜单与补全浮层拦截方向键的问题（internal/editor/input.go、internal/editor/tools.go）：输入 / 后粘贴文本时立即关闭斜杠菜单；当 /、[[、:、@ 过滤无匹配结果时放行上下左右与回车键，且在单列过滤列表中保留 ← / → 移动查询光标（#58）。
  贡献者
  - 特别感谢 @tajiaoyezi（#59）与 @Lyrecoul（#56）对本版本的贡献！
  下载说明
  提供 macOS（Apple Silicon / Intel）、Windows x64 与 Linux（x64 / ARM64）原生安装包，可使用 SHA256SUMS.txt 校验完整性，已安装版本支持应用内签名自动更新。官方插件可在应用「设置 › 插件」按需从 Ciao1019/arcmd-plugins 下载或更新。
