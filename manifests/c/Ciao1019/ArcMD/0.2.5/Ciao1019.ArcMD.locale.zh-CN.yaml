PackageIdentifier: Ciao1019.ArcMD
PackageVersion: 0.2.5
PackageLocale: zh-CN
ShortDescription: 完全使用 Go 原生开发的 Markdown 富文本编辑器，以多彩空间组织本地优先的笔记。
Description: |-
  ArcMD 将熟悉的 Markdown 写作流带入细腻跟手的原生富文本画布。
  完全使用 Go 与 MyGo Native UI 自研开发——由 Go 直接驱动窗口绘制、字形排版与系统输入，零 HTML、JavaScript、WebView、Electron 或 cgo。
  专属空间与实时配色：颜色、渐变、通透与深浅纸面

  每个空间对应一个本地文件夹，拥有独立的名称、图标、置顶常驻文档与阅读现场。在侧边栏双指轻扫或按 ⌃1…⌃9 即可滑入下一个空间；顶部的全局收藏跨越所有空间，点一下就在当前空间原地打开。打开「••• › 编辑主题颜色…」，可自由组合 1–3 色渐变、调节通透光影与颗粒感，或在浅色白纸与飞书风格深色纸面（#1F2023，自动重映射全部文字与高亮色调）之间平滑切换。
  资料库：所有空间，一眼尽览

  点击左下角的资料库图标或按 ⇧⌘L，侧边栏会平滑展开成一排空间卡片，每张卡片都以各自空间的主题色绘制，文件夹与文档随手可点开跳转。插件管理与保留 30 天的「最近删除」也集中在这里。
  专注时让开，需要时浮现

  按 ⌘\ 收起侧边栏（窄窗口下也会自动收起），让页面安静铺满整个窗口。需要切换文档时无需重新展开：把指针移到窗口左缘，毛玻璃浮动侧边栏便轻巧滑出；悬停任意文档或文件夹即可查看实时纸面缩略图预览，移回正文即自动收回。
  手绘标注：让重点，有一点温度

  选中文字后点开浮动工具栏的标注面板，从 12 种手绘笔触与可选色彩中挑一种语气——圈出关键决定、划掉犹豫、给下一步画一枚箭头。每一笔都会逐笔自然绘出，并无损保存在 .md（及旧版 .arcmd）文档中。试试这篇灵感手记示例，或从自己的第一句开始。
  页边书签：读到哪儿，回到哪儿

  指针移到任意段落旁，页边即淡显书签图标，点一下或按 ⌘D 即可标记。文档目录会同步列出书签（公式块自动渲染为公式缩略图），⌃⌘↑ / ⌃⌘↓ 在书签间平滑跳转，⇧⌘D 在命令栏检索所有空间的书签；书签独立存储，绝不弄脏 .md 原文。

  ArcMD 直接以标准 .md Markdown 作为主格式，编辑时在后台原地自动保存到原文件（.md / .markdown / .mdx），不会在旁边生成额外的 .arcmd 副本。每篇文档都是普通的本地纯文本文件，图片存放在同级 assets/ 目录中，可随时与 Obsidian、Typora、VS Code 或 Git 无缝混用。
  - 未改动段落原样保留：通过分块比对原始 Markdown（ImportSource），未编辑的段落不会改写你原有的缩进、列表符号或链接写法。
  - 扩展排版 100% 无损往返：文字颜色、背景高亮、手绘标注、五色高亮块（GitHub Alert > [!NOTE] 等）、折叠块（<details>）、跨格合并与着色表格、自定义比例双栏（data-widths）以及页面图标、封面与字数目标，通过标准 Markdown + 语义化 HTML + YAML Frontmatter 在其他阅读器中优雅降级、回到 ArcMD 完整还原。
  - 平滑向下兼容：已有的旧版 .arcmd 文档与历史快照仍可直接打开、编辑与迁移。
