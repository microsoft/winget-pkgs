ReleaseNotes: |-
  本版本正式推出 本地编码 Agent 协同体系（arcmd mcp 原生 MCP 服务、全功能 CLI 控制子命令、活动窗口实时 IPC 桥接与一键安装 SKILL.md），让 Claude Code、Codex、Gemini CLI、Cursor、Antigravity 等本机 Agent 直接协同读写空间、富文本笔记、手绘白板与多维数据库，并在桌面窗口中实时同步且完整保留 ⌘Z 撤销栈；同时合入 整页等比缩放（50%–200%）（#12、#74，感谢 @tajiaoyezi）与 一键清除样式（⇧⌘\）（#69、#72，感谢 @tajiaoyezi），带来 侧边栏三档行高密度、安静单色文件类型图标、看板 120 Hz 弹簧拖拽重构与 EPUB 键盘翻章滚动，并集中完成了 120 Hz 帧循环零磁盘阻塞、数据库封面纹理缓存、跨平台句柄释放与 WASM 插件沙箱加固 等 30 余项稳定性优化。
  新功能与桌面体验
  - 本地编码 Agent 协同：原生 arcmd mcp、CLI 子命令与一键安装 SKILL.md（internal/agentmcp、cmd/arcmd/control.go、internal/app/agentctl*.go、internal/app/qasettings.go）：内置零额外依赖的 stdio MCP JSON-RPC 2.0 服务（自动兼容行分隔与 Content-Length 帧协议，提供空间、富文本文档、Excalidraw 白板与多维数据库的 20 项结构化工具）及 arcmd space / doc / board / db / skill CLI 控制子命令；桌面窗口打开时通过本机 127.0.0.1 鉴权 IPC 直接在内存模型上实时更新并保留完整 ⌘Z 撤销/重做历史，窗口未运行时自动回退无头模式安全读写本地文件；「设置 › 本地 Agent 接入」支持自动探测并一键安装或更新 Claude Code、Codex、Gemini CLI、Antigravity、Cursor 与 OpenCode 的 SKILL.md 技能包与富格式规范。
  - 整页等比缩放与比例药丸菜单（internal/prefs、internal/editor/view.go、internal/app/app.go）：支持通过 ⌘= / ⌘- / ⌘0（Windows / Linux Ctrl+= / Ctrl+- / Ctrl+0，避让 Ctrl+Shift+= 分屏快捷键）、⌘/Ctrl + 鼠标滚轮 或触控板捏合手势在 50%–200% 间按 10% 步进等比缩放 Markdown 文档与纯 Go 书籍视图（标题、正文、列表标记、代码块、表格、公式、Mermaid 与图片同步缩放并保持阅读锚点，PDF 打印导出恒定保持 100%）；非 100% 时右上角显示比例药丸并可展开预设菜单（#12、#74，感谢 @tajiaoyezi）。
  - 一键清除样式（internal/document、internal/editor、internal/app）：支持通过选中文本浮动工具栏 T× 按钮、正文右键菜单、命令栏或可自定义快捷键 ⇧⌘\（Windows / Linux Ctrl+Shift+\）一键清除粗斜体、下划线、删除线、代码、键帽、上下标、超链接、文字颜色、背景高亮与手绘批注（支持跨多块与表格选区单步撤销，完整保留标题、列表与表格等块结构；光标折叠态下重置后续输入样式）（#69、#72，感谢 @tajiaoyezi）。
  - 侧边栏三档行高密度、安静单色类型图标与阅读交互升级（internal/prefs、internal/app/sidebar.go、internal/app/docicon.go、internal/dbview/board_drag.go、internal/editor/bookview.go）：「设置 › 外观 › 侧边栏行高」新增紧凑（28px）/ 标准（32px）/ 舒适（40px）三档密度；无 Emoji 前缀的侧边栏文档与收藏磁贴统一采用安静克制的单色 Lucide 文件类型图标（区分 Markdown、数据库、白板、PDF、EPUB 与 HTML）；重构看板列内与跨列 120 Hz 弹簧拖拽控制器（支持多值属性分组列独立插槽预览与落位回弹）；EPUB 与纯 Go 书籍阅读器新增 ← / → 切换章节及 ↑ / ↓ / PageUp / PageDown 键盘滚动与跨章翻页。
  性能、沙箱与跨平台加固
  - 120 Hz 帧循环零磁盘阻塞与 GPU 纹理缓存治理（internal/app/database.go、gitmerge.go、sidebar.go、qasettings.go、updateview.go、qabot.go、internal/database/schema.go）：为数据库画廊与看板封面建立 128 项上限的缩略图 Bitmap 缓存并在淘汰时释放像素内存，引入轻量 SchemaSnapshot() 消除每帧深拷贝行内记录；缓存 conflicts.json、侧边栏数据库子视图修改时间、命令栏预览与本地 Agent 技能检测结果，彻底消除每帧磁盘 stat 与读取；收敛更新横幅、问答空态与零宽日历的常驻 AnimationFrame 空转重绘，并将 dbview 与 PDF 搜索高亮统一收敛至主题 Token。
  - 数据库控制一致性、IPC 防双写与筛选态排序保护（internal/database/store.go、history.go、internal/dbview、internal/app/agentctl_ipc.go、internal/app/agentctl_board_db.go）：筛选或搜索状态下拖拽排序改为局部插槽重排，完整保留隐藏记录的手动顺序；修复撤销栈满 100 步后跨列拖拽无法撤销排序的问题；挂载无头控制模式下的 appRelationHost 以支持跨库 Rollup、Formula 与双向 Relation，并将 update_view 改为增量更新；区分本地 IPC 拨号拒绝与建连后超时取消，杜绝误删 agent-ipc.json、双写冲突与关窗主线程互锁。
  - 跨平台文件系统兼容、PDF 句柄释放与插件沙箱加固（internal/fsutil、internal/vault、internal/app/pdfviewer.go、internal/plugin、internal/agent、mygo.json）：CreateFileAtomic 在不支持硬链接的 exFAT / FAT32 / SMB 卷自动回退至排他新建；重命名或移动前主动释放驻留 PDF 句柄，Windows 回收站改用静默 SHFileOperationW，补齐 Windows 保留设备名过滤与 .excalidraw / .pdf / .epub / .html 系统文件关联；为 wazero WASM 插件运行时补齐 256 MiB 内存上限、上下文联动终止、日志限流与 ZIP 真实解压字节上限防护，并增强空间问答流式 SSE 断流重试与含 # 文件名引用解析。
  贡献者
  - 特别感谢 @tajiaoyezi（#72、#74）对本版本的贡献！
  下载说明
  提供 macOS（Apple Silicon / Intel）、Windows x64 与 Linux（x64 .deb / .tar.gz / Arch Linux .pkg.tar.zst，ARM64 .deb / .tar.gz）原生安装包，可使用 SHA256SUMS.txt 校验完整性，已安装版本支持应用内签名自动更新。官方插件可在应用「设置 › 插件」按需从 Ciao1019/arcmd-plugins 下载或更新。
