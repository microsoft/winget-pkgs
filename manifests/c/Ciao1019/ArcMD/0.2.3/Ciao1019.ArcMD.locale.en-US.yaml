ReleaseNotes: |-
  This release introduces a pure-Go WebAssembly plugin sandbox (wazero) with a bundled official Cloud Sync plugin (S3 SigV4 & WebDAV incremental bidirectional sync), an IDEA-style 3-Way Merge and Git diff view, a navigable Document Mind Map, per-Space Attachments Folders with automatic relinking, native <kbd> keycaps and raw HTML / comment rendering, Sidebar Multi-Select batch file management, and targeted fixes across Mermaid sequence diagrams, TeX \tag numbering, Windows hardlinks, inline rename contrast, and macOS window lifecycle.
  Plugins, Cloud Sync, and 3-Way Merge
  - Pure-Go WASM plugin sandbox (internal/plugin, internal/app/plugins.go): Execute plugins safely inside a zero-cgo wazero WebAssembly sandbox with explicit permission confirmation (document:read/write, space:read/write, network, secrets, ui:panel), isolated local secret storage (credentials/plugin-<id>-<key>), declarative native settings forms, command-bar integration, and local .zip package installation.
  - Official Cloud Sync plugin (plugins/cloud-sync, dev.arcmd.cloud-sync): Built-in one-click installable WASM plugin providing three-way incremental bidirectional sync for Space documents and attachments over S3 (AWS S3, Cloudflare R2, Alibaba Cloud OSS, Tencent Cloud COS, Backblaze B2, MinIO) and WebDAV (Jianguoyun, Nextcloud, Alist/OpenList), with 15-second post-save debounced sync and periodic background auto-sync.
  - Git-style Changes view and IDEA 3-Way Merge (internal/merge, internal/app/gitmerge.go): Inspect modified documents and sync conflicts as collapsible unified Git diff hunks with grapheme-level inline highlights, and resolve concurrent edits or cloud conflict copies in a three-pane Yours / Result / Theirs merge view with one-click connector arrows, auto-merge for non-conflicting hunks, and inline result fine-tuning.
  Document Mind Map, Raw HTML & <kbd>, and Space Management
  - Navigable document mind map (internal/mindmap, internal/editor/mindmap.go): Toggle a live, read-only mind map of any document (⌥⌘M / Ctrl+Alt+M, toolbar, or command bar) with single-sided and balanced two-sided tree layouts, smooth branch bezier curves, rich TeX/code/table node previews, viewport culling, zoom/pan controls, keyboard navigation, and click-to-jump editor synchronization (#26, thanks to @hyskr).
  - Per-Space attachments folder and automatic relinking (internal/app/attachmentdir.go, internal/space/space.go): Configure a dedicated Space-wide attachments directory (spaces.json v10) from the Space menu or command bar, hide the attachments folder from the sidebar note tree, recalculate relative paths without duplicating files when moving notes within a Space, and automatically relink open and closed Markdown notes in the background when attachments are moved or renamed (#27, #25, thanks to @Frieren924).
  - Native <kbd> keycaps, raw HTML rendering, and HTML comments (internal/document, internal/editor/mdstyle.go, internal/editor/markdown.go, internal/editor/livecompile.go, internal/editor/view.go, internal/editor/vectorpdf.go): Render 3D rounded <kbd> keycaps across light/dark themes and vector PDF export (Style.Kbd, document format 9), compile <kbd>…</kbd> and semantic inline HTML tags (<u>, <ins>, <sup>, <sub>, <mark>, <br>, <q>, <var>, <dfn>, <cite>, <small>, <abbr>, <samp>, <tt>, <font color>) live as you type with single-Backspace rollback, support <div align="center|right">, <center>, and <hr> blocks, and preserve both inline and standalone <!-- ... --> HTML comments losslessly while excluding hidden comments from HTML/PDF export, word counts, #tags, [[wiki-links]], and mind maps (#28, #20, thanks to @tajiaoyezi).
  - Sidebar multi-select and batch file actions (internal/app/multiselect.go, internal/app/treedrag.go, internal/app/crossspace.go, internal/app/palette.go): Select multiple documents and folders with ⌘-click (Ctrl-click on Windows/Linux) and ⇧-click range selection, drag stacked selection cards with item-count pills to reorder, pin/unpin, move into folders, move across Spaces, add to Favorites, or open 2–4 selected notes in Split View, create a new folder containing the selected items, and undo batch moves or deletions in one click (#21).
  Mermaid, Math, Editor, and Platform Fixes
  - Full-width Mermaid sequence diagrams, rect shading, and vector zoom lightbox (internal/mermaid/sequence.go, internal/editor/mermaid.go): Lay out multi-phase sequenceDiagram blocks naturally across the text column without height-clamping shrinkage, render rect rgb(...) / rgba(...) phase background shading, and add a hover Zoom button (or double-click) opening a lossless vector zoom-and-pan diagram viewer (#29).
  - Display math \tag / \tag* equation numbering (internal/tex, internal/editor/math.go, internal/editor/vectorpdf.go): Parse and render right-aligned \tag{...} and unparenthesized \tag*{...} equation labels across single-line and multi-line display math blocks and vector PDF export (#31).
  - Preserve Windows and Unix hardlinks on save (internal/fsutil): Detect regular files with multiple hardlinks (LinkCount > 1) in WriteFileAtomic and fall back to in-place overwrite and truncation so saving hardlinked notes on Windows and Unix never breaks existing links (#31).
  - Readable inline rename contrast on selected items (internal/app/sidebar.go, internal/app/favorites.go): Clear selected-row light text overrides while renaming inline so document and folder names remain high-contrast and legible in both light and dark themes (#30).
  - Link boundary typing and macOS ⌘W Dock lifecycle (internal/document/engine.go, internal/editor/linkpopover.go, internal/app/app.go): Avoid opening the link popover or extending link marks when clicking blank space after a link or typing at link start/end boundaries, and hide the main window on macOS ⌘W / close button so ArcMD stays running in the Dock until ⌘Q (restorable via Dock click or ⌘0).
  Contributors
  Special thanks to @hyskr (#26), @Frieren924 (#27), and @tajiaoyezi (#28) for their merged pull requests in this release!
  Documentation
  - Update README.md, README.en.md, AGENTS.md, docs/architecture.md, docs/plugins.md, and tools/dev for version 0.2.3, WASM plugins and Cloud Sync, document mind maps, per-Space attachments folders, <kbd> / raw HTML support, and sidebar multi-selection.
  Data compatibility
  Markdown (.md, .markdown, .mdx) remains the primary in-place format. Legacy .arcmd JSON advances to format 9 (adding optional Style.Kbd and Block.Comments, with automatic migration from formats 1–8), and Space configuration (spaces.json) advances to format 10 (adding optional per-Space attachmentsDir, with automatic migration from earlier formats). Plugin configuration and state live under plugins/, while plugin secrets are stored separately in credentials/ (0600).
