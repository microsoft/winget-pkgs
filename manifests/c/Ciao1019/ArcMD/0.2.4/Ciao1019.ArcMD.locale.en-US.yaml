ShortDescription: A native Markdown rich-text editor written entirely in Go that organizes local-first notes into colorful Spaces.
Description: |-
  ArcMD brings Markdown's familiar writing flow onto a calm, expressive native canvas.
  Built entirely in Go with MyGo's Native UI — windows, GPU drawing, glyph shaping, and input handling run directly from Go with no HTML, JavaScript, WebView, Electron, or cgo.
  Spaces & live themes: colors, gradients, translucency, and dark paper

  Each space maps to a local folder with its own name, icon, persistent Pinned tabs, and last-open page. Swipe with two fingers on the sidebar or press ⌃1…⌃9 to glide into the next space, while global Favorites at the top open right in place without switching spaces. Open Edit Theme Colors… to blend one to three gradient stops, dial in frosted translucency and subtle grain, or flip between Light and Feishu-inspired Dark paper (#1F2023) with balanced color remapping.
  The Library: every space at a glance

  Click the Library icon in the bottom-left corner or press ⇧⌘L. The sidebar widens into a row of space cards painted in each space's own theme colors, with folders and pages ready to jump straight into. Plugins and the 30-day Recently Deleted collection live here too.
  A sidebar that steps aside — and peeks on demand

  Press ⌘\ (or narrow the window) and your page fills the entire window. Whenever you need another file, move the pointer to the left edge: the frosted floating sidebar glides out over your page, shows live miniature page thumbnails on hover, and tucks itself away the moment you return to writing.
  Hand-drawn marks: give your ideas a human touch

  Select a phrase and pick from 12 hand-drawn stroke styles and palette colors in the floating toolbar — circle what matters, cross out hesitation, or point an arrow at the next step. Every stroke draws itself in smoothly and round-trips losslessly in .md (and legacy .arcmd) files. Try the idea journal sample, or start with a line of your own.
  Margin bookmarks: pick up right where you left off

  Hover any block to reveal a margin bookmark, or press ⌘D. Your marks appear automatically in the document outline (with rendered TeX previews for math blocks), ⌃⌘↑ / ⌃⌘↓ hop smoothly between them, and ⇧⌘D searches bookmarks across every space — without ever modifying the .md file itself.

  ArcMD edits and autosaves standard .md Markdown files (.md, .markdown, .mdx) directly in place in the background — no proprietary database and no sidecar .arcmd duplicates. Every note is a plain local file with its images in a nearby assets/ folder, ready for Obsidian, Typora, VS Code, or Git.
  - Untouched blocks stay untouched: block-level source diffing (ImportSource) preserves your original indentation, list markers, and link syntax on paragraphs you didn't edit.
  - 100% lossless rich round-trips: text colors, highlights, hand-drawn marks, five-tone callouts (GitHub > [!NOTE] alerts), <details> toggles, merged/colored tables, custom-width two-column layouts (data-widths), and page icons/covers/word goals degrade cleanly via standard Markdown + semantic HTML + YAML frontmatter and restore completely in ArcMD.
  - Backward compatible: existing legacy .arcmd files and history snapshots continue to open and edit seamlessly.
