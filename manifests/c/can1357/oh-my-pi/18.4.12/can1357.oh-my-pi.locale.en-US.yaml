ReleaseNotes: |-
  @oh-my-pi/pi-ai
  Added
  - Added createAuthGatewayRouter, the auth-gateway's routes without the HTTP listener, and serveAuthGatewayStdio, which serves them as JSON lines ({"id", "path", "body"} in, {"id", "status", "body"} out) for a parent process.
  @oh-my-pi/pi-coding-agent
  Added
  - Added omp auth-gateway stdio: a long-lived inference server for other programs speaking JSON lines on stdin/stdout ({"id", "path": "/v1/chat/completions", "body"} in, {"id", "status", "body"} out) with your own sign-ins; a request's model takes any --model selector (@smol, sonnet, @commit,@smol) and falls back along retry.fallbackChains when an attempt fails.
  Changed
  - Reduced CPU use while streaming with several agents active: extension message_update handlers are delivered through a lighter queue, and RPC no longer processes subagent events unless a client subscribed to them (#13244 by @iliaal).
  Fixed
  - Fixed web search stopping at Perplexity's anonymous signup wall instead of falling back to the next configured provider (#12756).
  - Fixed imported Claude Code sessions on Windows reporting the encoded C--… directory name instead of the registered project path when the transcript records no cwd (#13363 by @jchanghong023).
  - Fixed JavaScript eval wait()/handle.wait() ignoring a positional timeout; h.wait(30) now waits up to 30 seconds like { timeout: 30 }, and mixing an options object with positional arguments throws a TypeError (#12720 by @F0Rextasy).
  - Fixed Herdr and other lifecycle-tracking extensions showing a collab guest (omp join) as idle while the host is working; extension-initiated turns (pi.sendMessage with triggerTurn, pi.sendUserMessage) are refused as host-only while joined instead of running on the guest's local model (#13156 by @Fruitseller).
  - Fixed omp update failing with "Malformed npm registry response … missing version" on registries such as Sonatype Nexus that answer the /<pkg>/latest lookup with the full package document or a non-manifest body; the updater now reads the version from the package's dist-tags (#14115).
  - Fixed wait and proc:// failing with "Daemon list request timed out" when the project daemon broker hangs; background jobs and agents are still reported, and proc:// shows that services are unavailable (#14120 by @H4vC).
  - Fixed agent://<id> showing an agent's previous published output as current while that agent runs a follow-up or wake turn; the read now says the output is from the previous run (#14120 by @H4vC).
  - Fixed proc:// listing agents as running when they have no turn in flight; their rows now say the run is stale or already finished, as the jobs tool does (#14120 by @H4vC).
  - Changed subagents to skip their own builds, tests, and smoke runs and leave verification to the main agent, avoiding CPU spikes from many subagents verifying at once.
  @oh-my-pi/pi-tui
  Changed
  - Changed Ctrl+Z in Tern's native composer to undo the last edit (TSP undo event) instead of suspending
  @oh-my-pi/pi-utils
  Fixed
  - Fixed multi-second temp directory removal stalls on Windows by forcing a major GC before the first deletion retry (#13044 by @jchanghong023).
  What's Changed
  - fix(eval): accept positional timeout in JS wait() via optionsArg by @F0Rextasy in https://github.com/can1357/oh-my-pi/pull/12720
  - fix(web-search): classify Perplexity anonymous signup wall as failure by @roboomp in https://github.com/can1357/oh-my-pi/pull/12838
  - fix(omp-rpc): verify teardown and retain a survivor handle for reaping by @roboomp in https://github.com/can1357/oh-my-pi/pull/12843
  - fix(utils): force a GC before retrying temp dir removal on Windows by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/13044
  - fix(collab): mirror guest lifecycle events to the extension runner by @Fruitseller in https://github.com/can1357/oh-my-pi/pull/13156
  - perf(coding-agent): reduce streaming event queue overhead by @iliaal in https://github.com/can1357/oh-my-pi/pull/13244
  - fix(coding-agent): encode Windows drive colons in Claude project dirs by @jchanghong023 in https://github.com/can1357/oh-my-pi/pull/13363
  - fix(coding-agent): read version from packument when registry answers dist-tag lookup with 200 by @H4vC in https://github.com/can1357/oh-my-pi/pull/14115
  - fix(coding-agent): keep subagent wait and proc:// usable when the daemon broker hangs by @H4vC in https://github.com/can1357/oh-my-pi/pull/14120
