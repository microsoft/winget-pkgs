ReleaseNotes: |-
  Improvements for all users:
  - ✨ When signing in with a company SSO account, the onboarding welcome screen
    pushed users toward creating a new Twake account instead of signing in.
    The welcome screen now offers a prominent "Sign in with company account"
    button and relegates account creation to a discreet link.
  - 🐛 When a document could not be synchronized because its name or location was
    incompatible with your system, no alert was shown at all: you had no way of
    knowing the document was blocked.
    Incompatibility alerts are displayed again, with the precise reason (forbidden
    character, reserved name, name or path too long) and whether the problem lies
    with the document itself or one of its parent folders.
  - 🐛 When a change was blocked and skipped, the changes depending on it were
    still attempted on the next sync, failing pointlessly or creating orphaned
    files.
    Dependent changes are now skipped too, and the alert names the blocking
    path, which you can click to reveal in your file manager.
  - 🐛 When a temporary server or network problem raised a sync alert, the alert
    stayed displayed indefinitely even after the problem was gone.
    Alerts are now cleared automatically as soon as the Cozy responds again,
    without waiting for a manual retry.
  - 🐛 When the network dropped in the middle of a file transfer, an alert about
    an unknown error was shown instead of the offline status, and a failing
    local disk could be mistaken for a network outage.
    Network interruptions during transfers are now recognized and retried
    quickly, like other connection losses, while local file system errors are
    no longer confused with network problems.
  - 🐛 After signing in via SSO in the browser, the onboarding window stayed in
    the background instead of coming back to the foreground.
    The window is now focused, and restored if it was minimized, as soon as the
    login completes.
  - 🐛 When the OAuth login or registration failed during onboarding, no error
    was shown and the setup continued to the sync configuration anyway.
    The failure is now displayed on the onboarding page and the flow stops
    there instead of continuing.
  - 🐛 Moving a folder while one of its files had been replaced (with the app
    stopped) produced a conflict copy instead of keeping the replaced file.
    The deletion of the old child is now applied before the parent folder
    move, so the replacement file is preserved.
  - 🐛 The Spanish translation was incomplete and contained several mistakes.
    It has been completed and corrected.
  - ✨ The onboarding screens have been redesigned with the Twake visual identity.
  - ✨ Clicking "Sign in" during onboarding opened your web browser immediately,
    without any warning.
    The onboarding now explains that the browser is about to open for the
    sign-in, opens it automatically after a few seconds, and offers a button to
    open it right away.
  - 🐛 Alerts about a folder that could not be synchronized were labeled as if they
    concerned a file.
    Folder alerts are now correctly labeled as folders and shown with the folder
    icon.
  - 🐛 Renaming a document that had a synchronization alert added a new alert for
    each name, and fixing the problem removed only the last one, leaving stale
    alerts in the tray panel.
    A single alert is now kept per document: it carries the document's current
    name, and resolving the problem removes it whatever the name.
  - 🐛 On a fresh installation or after resetting the application's configuration,
    checking the synchronization folder during onboarding could fail.
    The folder check is now skipped when no folder has been configured yet.
  - ✨ Completing the sign-in during onboarding relied on a custom protocol to bring
    the sign-in result back to the application, which could fail depending on the
    browser or the operating system.
    The sign-in result is now received by a local server started by the
    application, and the browser displays a confirmation page that closes itself
    after a few seconds.
  Improvements for Windows users:
  - 🐛 Twake Desktop disappeared from Windows' installed apps list: the app
    deleted its own uninstall entry at every launch, and old installers could
    leave duplicate entries behind.
    The app no longer touches its uninstall entry, and the installer now
    removes the orphaned entries left by previous versions.
  - 🐛 Windows clients have been unable to update themselves since v5.0.0: the
    installer signature did not match the publisher name recorded in the
    application.
    Updates are accepted again now that the publisher name lists every entity of
    the group.
  Improvements for macOS users:
  - 🐛 On Apple Silicon Macs, the automatic update downloaded the Intel version
    of the app instead of the Apple Silicon one.
    The update now fetches the Apple Silicon build.
  - 🐛 The option to launch Twake Desktop automatically when signing in to your
    session could stop working on recent macOS versions.
    Automatic launch now uses the native macOS mechanism, which is reliable on
    recent versions.
  - 🐛 Moving a file onto another one to replace it could, under load, send the
    moved file to the trash instead of moving it.
    The replacement move is now detected regardless of the order in which the
    system reports the file events.
  - 🐛 The application could crash at startup with a libc++ symbol error: a
    native binary shipped with the application had been built for a recent
    macOS version and could not be loaded on older systems.
    The binary is no longer loaded at startup, and is not shipped anymore on
    systems that never use it.
  See also known issues.
  Happy syncing!
