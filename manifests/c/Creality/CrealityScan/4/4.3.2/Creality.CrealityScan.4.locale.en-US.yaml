ReleaseNotes: |-
  Win Update Notes：

  1. Added My Cloud feature.

  2. Raptor series scanners now support marker-free scanning in USB connection mode.

  3. Added support for exporting mesh data to 3MF file format.

  4. Added support for importing 3MF files from Sermoon P1/P1S to the desktop application.

  5. Added support for Sermoon P1S scanner.

  6. Optimized the position of the color texture toggle in blue line laser scanning mode.

  7. Added an “Invert Data” option to the Clipping Plane feature.

  8. Optimize the rendering effect of the mesh model and enhance the contrast of highlights.

  9. Fixed some bugs.
