ShortDescription: Creality Scan 是专为创想三维旗下扫描仪设计的 3D 扫描软件，拥有丰富的功能，能帮助用户实现高质量的扫描和完整的模型构建。该软件支持一键模型优化、多位置自动对齐、自动去噪、拓扑简化、颜色纹理映射等实用功能，还能导出 STL、OBJ 和 PLY 格式的 3D 模型及点云数据，让用户操作更加简便和高效。
