ReleaseNotes: |-
  Win 版更新说明：

  1. 新增直线选择与多边形选择工具.

  2. 支持一键导出到 Geomagic Design X 和 Geomagic Control X.

  3. 删除标定过程中的对准“靶心”的要求.

  4. Sermoon P1 和 P1S 新增扫描前低电量检查.

  5. 支持网格模型直接生成 3DGS.

  6. IR 相机视窗激光亮度、曝光亮度支持独立控制.

  7. 优化 Pika 的固件静默下载和升级逻辑.

  8. 优化网格模型的显示渲染效果.

  9. 修复已知 Bug.
