ReleaseNotes: |-
  Win Update Notes：

  1. Added Line and Polygon tools.

  2. Added one-click export to Geomagic Design X and Geomagic Control X.

  3. Removed the target alignment requirement during calibration.

  4. Added a low-battery check before scanning for Sermoon P1 and P1S.

  5. Added support for generating 3DGS from meshing models.

  6. Enabled independent laser brightness and exposure control in the IR camera view.

  7. Optimized silent firmware downloads and updates for Pika.

  8. Improved mesh rendering quality.

  9. Fixed known bugs.
