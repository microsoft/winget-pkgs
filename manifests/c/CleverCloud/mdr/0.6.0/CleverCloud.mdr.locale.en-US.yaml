ShortDescription: A lightweight Markdown viewer with live reload and multiple rendering backends
Description: |-
  mdr opens a Markdown file and renders it, without a project, a server or an editor extension. It reloads the document as it changes on disk, renders Mermaid diagrams to SVG natively rather than through a headless browser, and offers three backends: a native window (gui), the system webview (web), and a terminal UI (tui) that works over SSH.
