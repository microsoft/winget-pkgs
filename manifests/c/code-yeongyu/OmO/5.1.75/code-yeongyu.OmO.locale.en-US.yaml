ReleaseNotes: |-
  Fixed
  - omo remote devices shows this device offline while its device service is not connected, and omo remote sessions --device naming a device the account does not have reports it instead of listing nothing. (#13916)
  - Memory sync's own test suite no longer fails a later, unrelated test when one test times out while a sync cycle is still running: device teardown in the tests now stops the engine and waits for that cycle before removing its files, and the push-bounded test waits on the cycle instead of a fixed 30 s budget. (#13887, fixes #13680)
  - The first memory sync cycle after signing in no longer fails with "the device's sign-in token could not be read or refreshed" when the system keychain briefly reads nothing. That one empty read is now checked again before sync treats the sign-in as gone; signing out still stops sync at once. (#13879, fixes #13739)
  - Regenerating the computer-use prelude (bun run generate in senpi-desktop-prelude) now runs its generated method tables through bun fmt, so prelude.js, its index.ts allowlist and the desktop protocol tier tables stay formatter-clean instead of reverting to unformatted output at every release regeneration. The published prelude JavaScript is the formatted copy again. (#13855)
  Changed
  - A memory sync capture that receives files from other devices no longer scans every known file once per received file, so a large memory catching up on many incoming files stays fast. (#13862)
