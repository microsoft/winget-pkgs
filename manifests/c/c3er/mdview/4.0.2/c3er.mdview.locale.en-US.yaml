ReleaseNotes: |-
  Note: The file mdview-4.0.2-arm64.dmg was marked as malicious on VirusTotal by "Microsoft" as "Trojan:Script/Wacatac.C!ml".
  Document icon (issue #83)
  There is now a dedicated icon for Markdown documents.
  On Windows, if installed via the setup EXE file, the document icon is associated instead of the application icon. With MSI, the application icon is still associated.
  Improved dialog styling (issue #81)
  The borders of the dialogs are now unobtrusive.
  Bugfixes
  - Double-clicking a file in macOS Finder now actually opens that file, instead of the README (issue #76)
  - Mermaid syntax was not escaped for HTML, causing problems with statements containing < and > (issue #78)
  - Fixed handling of the escape key in the search dialog. It didn't close the dialog like the others
  - Fixed handling of paths containing special characters, e.g. 证据.md could not be linked to (issue #85)
