ShortDescription: Phone-style folders for the Windows 11 desktop. Your files never move.
Description: |-
  Folder Explorer draws its own desktop on top of your wallpaper: drop one icon on another to make a group, the way you would on a phone.
  Groups, fences, headings and dividers live only in Folder Explorer's layout file, so nothing is moved on disk, and Windows' own desktop icons come back as soon as you quit.
  Smart groups collect icons by rule, live folders show a real folder such as Downloads, and search finds apps, files, Settings pages and more.
