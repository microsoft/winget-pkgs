PackageVersion: 1.11.4
PackageLocale: en-US

Publisher: Creallo Inc.
PublisherUrl: https://creallo.com/
PublisherSupportUrl: https://creallo.com/

# **제품명은 결합 형태로만 쓴다.** 「Atlas」 단독 표기를 제품명 자리에 두지 않는다 -
# 상표를 별도 출원하지 않고 기존 「크렐로」 상표로 커버하므로, 결합 형태를 지키는
# 것이 커버 조건이다(브랜드 문서 1장).
PackageName: Creallo Atlas
PackageUrl: https://creallo.com/

License: Proprietary
LicenseUrl: https://creallo.com/
Copyright: Copyright (c) Creallo Inc.

# 브랜드 문서 4장의 영문 서브텍스트다. **확장자를 나열하지 않는다** - 지원 형식이
# 늘어도 문장을 고칠 필요가 없고, "Open any 3D file" 이 범용성을 더 크게 전한다.
#
# **여기서 macOS·Linux 를 말하지 않는다.** 이 매니페스트는 윈도우 사용자가 읽는
# 자리이고, 리눅스 빌드는 아직 없다(문서의 지원 OS 는 10/5 목표다).
ShortDescription: Open any 3D file and see dimensions, inspection results, and manufacturing cost in one view. No CAD required.
Description: |-
  Creallo Atlas opens STEP, STL and 10 other 3D formats without a CAD licence.

  Measure distances, diameters, wall thickness and clearances. Inspect meshes for
  holes, non-manifold edges and thin walls that will fail in production, and repair
  the light ones in place. Ask Creallo for an indicative manufacturing cost for the
  part on screen.

  Your design files stay on your computer while you view, measure and inspect them.
  A file is uploaded only when you press Share to create a link.

