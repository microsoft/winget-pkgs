# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.6.0.schema.json
#
# winget 매니페스트는 **세 파일이 한 벌**이다(version · installer · defaultLocale).
# 세 파일의 PackageIdentifier 와 PackageVersion 이 모두 같아야 하고, 하나만 어긋나도
# 심사에서 떨어진다. release/release_ci.py 의 bump-winget 이 셋을 함께 갈아 끼운다.
#
# 이 파일들은 우리 저장소의 **원본**이다. 실제 배포는 microsoft/winget-pkgs 에
# PR 을 올려야 하고, 그 저장소의 경로는 아래 식별자를 따라간다.
#
#     manifests/c/creallo/atlas/<판>/
PackageIdentifier: Creallo.Atlas
PackageVersion: 1.11.4
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.6.0
