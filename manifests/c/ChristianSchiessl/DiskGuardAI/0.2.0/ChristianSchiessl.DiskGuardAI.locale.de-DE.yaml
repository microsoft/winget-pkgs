ShortDescription: Laufwerksüberwachung für Windows mit SMART-Werten in Klartext, Health-Score, Benchmark und signierten Gesundheitszertifikaten.
Description: |-
  DiskGuard AI überwacht HDDs, SATA-SSDs, NVMe- und USB-Laufwerke im Hintergrund, erklärt jeden SMART-Wert in verständlicher Sprache und warnt sofort, wenn sich etwas verschlechtert.
  Funktionen: Health-Score mit Begründung, Restlebensdauer-Prognose, Verlauf und Trends, Benchmark mit Plausibilitätsprüfung, Selbsttests und Oberflächenscan (nur lesend), Berichte, Kommandozeile, 8 Themes, 13 Sprachen und digital signierte Gesundheitszertifikate (PDF), die Käufer per QR-Code prüfen können.
  Keine Telemetrie; Laufwerke werden nur gelesen (einzige Ausnahme: die temporäre Testdatei des Benchmarks).
Tags:
- benchmark
- festplatte
- laufwerk
- nvme
- smart
- ssd
- überwachung
ReleaseNotes: |-
  Signierte Gesundheitszertifikate mit QR-Code und Prüfung im Browser auf diskguard.netlify.app/verify.
  Behebt einen Absturz beim Start mit dem Theme „RGB Overdrive“.
