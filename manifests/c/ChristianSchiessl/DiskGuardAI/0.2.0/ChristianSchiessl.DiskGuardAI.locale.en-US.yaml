ShortDescription: Drive health monitor for Windows with plain-language SMART explanations, health score, benchmark and signed health certificates.
Description: |-
  DiskGuard AI monitors HDDs, SATA SSDs, NVMe and USB drives in the background, explains every SMART value in plain language and warns as soon as something gets worse.
  Features: health score with reasons, remaining-life forecast, history and trends, benchmark with plausibility check, self-tests and read-only surface scan, reports, CLI, 8 themes, 13 languages, and digitally signed health certificates (PDF) that buyers can verify via QR code.
  No telemetry; drives are only read (the only exception is the benchmark's temporary test file).
