ReleaseNotes: "Windows binaries for v1.1.19\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Files included:\n• WinuxCmd-1.1.19-win-x64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.19-x64-setup.exe\n• WinuxCmd-1.1.19-win-arm64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.19-arm64-setup.exe\n• WinuxCmd-skill-v1.1.19.zip (AI agent skill bundle, attached separately)\n\n### Package Contents:\n• `usr/bin/winuxcmd.exe` - Main executable (multi-call binary：one exe provides all commands)\n• `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)\n• Environment and lifecycle scripts：`winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`\n• `README.md` / `README-ZH.md` / `LICENSE`\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `usr/bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `usr\\bin` directory to your PATH\n\n\n## What's Changed\n• build：degrade BUILD_FFI gracefully when src/ffi is absent by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1265\n• fix(chgrp,chown)：refuse \".\" spellings resolved onto the shell root (#1259) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1266\n• test+ci：gate parallel ctest with serial retry, harden test framework by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1267\n• fix(tput)：TERM-aware capability table, setaf/setab/cup, raw output path (#1258) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1269\n• fix(chown,chgrp)：align //e/.. ENOENT text and propagate recursive chgrp failures (#1262) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1268\n• fix(opt)：forward adapted commands with an argv prefix; gawk exits text mode (#467) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1270\n• chore(release)：bump PROJECT_VERSION to 1.1.19 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1272\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.1.18...v1.1.19"
