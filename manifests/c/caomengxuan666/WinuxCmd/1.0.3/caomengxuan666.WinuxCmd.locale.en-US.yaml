ReleaseNotes: "Windows binaries for v1.0.3\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Files included:\n• WinuxCmd-1.0.3-win-x64.7z\n• WinuxCmd-1.0.3-win-x64.zip\n• WinuxCmd-1.0.3-win-x64.tar.gz\n• WinuxCmd-1.0.3-x64-setup.exe\n• WinuxCmd-1.0.3-win-arm64.7z\n• WinuxCmd-1.0.3-win-arm64.zip\n• WinuxCmd-1.0.3-win-arm64.tar.gz\n• WinuxCmd-1.0.3-arm64-setup.exe\n• WinuxCmd-skill-v1.0.3.zip\n\n### Package Contents:\n• `winuxcmd.exe` - Main executable\n• `ffi/` directory:\n  • `ffi.h` - FFI header file\n  • `winuxcore.dll` - FFI library (direct function call API)\n  • `winuxcore.lib` - Import library\n• Scripts for installation and setup\n• Standalone `winuxcmd` skill bundle for AI agents\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `bin` directory to your PATH\n\n\n## What's Changed\n• feat：add look and whereis commands by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/189\n• feat：add locate, namei, updatedb, vmstat, w + differential tests by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/190\n• release：version 1.0.3 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/191\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.0.2...v1.0.3"
