ReleaseNotes: "Windows binaries for v1.1.6\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Files included:\n• WinuxCmd-1.1.6-win-x64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.6-x64-setup.exe\n• WinuxCmd-1.1.6-win-arm64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.6-arm64-setup.exe\n• WinuxCmd-skill-v1.1.6.zip (AI agent skill bundle, attached separately)\n\n### Package Contents:\n• `usr/bin/winuxcmd.exe` - Main executable (multi-call binary：one exe provides all commands)\n• `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)\n• Environment and lifecycle scripts：`winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`\n• `README.md` / `README-ZH.md` / `LICENSE`\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `usr/bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `usr\\bin` directory to your PATH\n\n\n## What's Changed\n• i18n：resolve WPM catalog at the WinuxCmd install root (#1150) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1151\n• touch：GNU-parity handling of unmatched literal-glob operands (#1143) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1152\n• docs：删除过时 BUG_FIX 计划/状态快照；CHANGELOG 补 #1151/#1152 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1153\n• fix(wpm)：key download cache by version and artifact hash (issue #1154) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1157\n• ux：group bare winuxcmd output into coreutils-style sections + i18n locale hint (#1155) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1160\n• fix(du)：collapse operand trailing separators like GNU (issue #1159) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1161\n• docs：plain labels for detailed-comparison sections (README style pass) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1162\n• fix(wpm)：interaction audit fixes - outdated receipt anchoring, install --json, help force semantics (#1156) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1158\n• docs(help)：align minor-group description density with GNU (issue #1127 P2) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1163\n• feat(diff3,sdiff)：GNU diffutils 3.10 alignment on the shared diff engine (issue #1127 P1) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1164\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.1.5...v1.1.6"
