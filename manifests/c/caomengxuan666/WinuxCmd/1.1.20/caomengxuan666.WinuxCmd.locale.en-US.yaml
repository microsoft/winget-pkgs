ReleaseNotes: "Windows binaries for v1.1.20\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Files included:\n• WinuxCmd-1.1.20-win-x64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.20-x64-setup.exe\n• WinuxCmd-1.1.20-win-arm64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.20-arm64-setup.exe\n• WinuxCmd-skill-v1.1.20.zip (AI agent skill bundle, attached separately)\n\n### Package Contents:\n• `usr/bin/winuxcmd.exe` - Main executable (multi-call binary：one exe provides all commands)\n• `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)\n• Environment and lifecycle scripts：`winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`\n• `README.md` / `README-ZH.md` / `LICENSE`\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `usr/bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `usr\\bin` directory to your PATH\n\n\n## What's Changed\n• docs：link unixwin.dev portal from README and guides by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1271\n• feat(help)：end --help output with the unixwin portal link by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1273\n• fix(paths)：resolve bare MSYS drive-root operands through the shared argv boundary (#1230) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1274\n• fix(paths)：fold csplit -f/--prefix through the shared argv boundary (#1276) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1278\n• fix(paths)：fold env --file/-f operands through the shared argv boundary by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1277\n• fix(build)：escape regex metacharacters in unity build commands-dir match by @a-rookie-of-C-language in https://github.com/unixwin/WinuxCmd/pull/1281\n• chore(release)：1.1.20 — CHANGELOG backfill and version bump by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1282\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.1.19...v1.1.20"
