ReleaseNotes: "Windows binaries for v1.1.7\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Files included:\n• WinuxCmd-1.1.7-win-x64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.7-x64-setup.exe\n• WinuxCmd-1.1.7-win-arm64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.7-arm64-setup.exe\n• WinuxCmd-skill-v1.1.7.zip (AI agent skill bundle, attached separately)\n\n### Package Contents:\n• `usr/bin/winuxcmd.exe` - Main executable (multi-call binary：one exe provides all commands)\n• `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)\n• Environment and lifecycle scripts：`winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`\n• `README.md` / `README-ZH.md` / `LICENSE`\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `usr/bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `usr\\bin` directory to your PATH\n\n\n## What's Changed\n• Release v1.1.6 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1165\n• docs(touch)：record NTFS literal-glob platform deviation and test exemption (issue #1143) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1167\n• fix(spawn)：unified GNU execvp child resolution for Windows spawners (PATH-only, POSIX PATH normalization) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1169\n• fix(find)：POSIX drive-form start points; test: grep symlink SKIP degradation, tput stdin-preservation contract (#1170 #1168 #1166) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1171\n• fix(seq,du,sed)：buffered seq output, POSIX drive-form operands for du/sed, CHANGELOG #1167/#1169 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1178\n• fix(wpm)：reject cached-index source injection + index hash ledger; loopback proxy fallback opt-in (issues #1176 #1177) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1179\n• docs(changelog)：fold the #1178 seq/du/sed round into the 1.1.7 section by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1180\n• Release v1.1.7 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1181\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.1.6...v1.1.7"
