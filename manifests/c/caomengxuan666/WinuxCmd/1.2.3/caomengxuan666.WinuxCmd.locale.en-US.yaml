ReleaseNotes: "Windows binaries for v1.2.3\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Full-only commands (edition split, #1438):\nThe default edition does not create entry links for **`[`**, **`false`**, **`kill`**, **`test`**, **`time`**, **`true`** — these commands' user-facing semantics are defined by your host shell's builtins (`winuxcmd <name> ...` still works). `env` is **not** a builtin and keeps its entry in the default edition. The full edition materializes every entry and ships under the `-full` asset names; it is **not** distributed through wpm:\n• WinuxCmd-1.2.3-win-x64-full.7z / .zip / .tar.gz\n• WinuxCmd-1.2.3-win-arm64-full.7z / .zip / .tar.gz\n\n### Files included:\n• WinuxCmd-1.2.3-win-x64.7z / .zip / .tar.gz\n• WinuxCmd-1.2.3-x64-setup.exe\n• WinuxCmd-1.2.3-win-arm64.7z / .zip / .tar.gz\n• WinuxCmd-1.2.3-arm64-setup.exe\n• WinuxCmd-skill-v1.2.3.zip (AI agent skill bundle, attached separately)\n\n### Package Contents:\n• `usr/bin/winuxcmd.exe` - Main executable (multi-call binary：one exe provides all commands)\n• `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)\n• Environment and lifecycle scripts：`winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`\n• `README.md` / `README-ZH.md` / `LICENSE`\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `usr/bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `usr\\bin` directory to your PATH\n\n\n## What's Changed\n• fix(env)：canonical empty environment block for env -i launches (Refs #1837, #1838) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1841\n• test(childproc)：pin native-launcher shebang resolution without shell root (Refs #1848) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1851\n• ci：pin CMake 4.4.5 in GNU master differential and benchmark Windows jobs by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1857\n• fix(find)：%Tq/%TN follow glibc strftime — unbreak engines-find gate shard on main (#1488) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1858\n• fix(env)：improve non-UTF-8 ACP fallback, GNU error wording, and env.md status (Fixes #1840) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1843\n• fix(ls)：keep drive-root separator when a dot collapse lands on the root by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1863\n• fix(diff)：GNU per-pair header for directory comparison, no raw argv echo (#1861) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1864\n• fix(seq)：huge integer operands terminate exactly instead of falling into the float loop (#1860) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1866\n• build(cmake)：adapt import std wiring to the CMake 4.5 model, unpin CI CMake by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1867\n• chore(release)：WinuxCmd 1.2.3 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1868\n• fix(fs_win)：api_path restores the root separator on bare-drive landings by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1871\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.2.2...v1.2.3"
