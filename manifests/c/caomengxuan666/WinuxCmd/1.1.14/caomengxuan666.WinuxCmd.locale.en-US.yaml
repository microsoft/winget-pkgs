ReleaseNotes: "Windows binaries for v1.1.14\n\n### Architectures:\n• **x64**：Windows 64-bit\n• **ARM64**：Windows ARM64 (cross-compiled)\n\n### Files included:\n• WinuxCmd-1.1.14-win-x64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.14-x64-setup.exe\n• WinuxCmd-1.1.14-win-arm64.7z / .zip / .tar.gz\n• WinuxCmd-1.1.14-arm64-setup.exe\n• WinuxCmd-skill-v1.1.14.zip (AI agent skill bundle, attached separately)\n\n### Package Contents:\n• `usr/bin/winuxcmd.exe` - Main executable (multi-call binary：one exe provides all commands)\n• `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)\n• Environment and lifecycle scripts：`winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`\n• `README.md` / `README-ZH.md` / `LICENSE`\n\n### Package Formats:\n• **7Z**：Best compression (requires 7-Zip)\n• **ZIP**：Native Windows support (right-click to extract)\n• **TGZ**：tar.gz format (use `tar -xzf filename.tar.gz`)\n• **EXE**：standalone installer with PATH and PowerShell integration tasks\n\n### Usage:\n1. Download the appropriate package for your architecture\n2. Extract to your desired directory\n3. Navigate to the `usr/bin` directory\n4. Run `create_links.ps1` to generate command links\n   ```powershell\n   # For NTFS filesystems (recommended)\n   .\\create_links.ps1\n   \n   # For non-NTFS filesystems, use symbolic links\n   .\\create_links.ps1 -UseSymbolicLinks\n   \n   # To remove all links later\n   .\\create_links.ps1 -Remove\n   ```\n5. Add the `usr\\bin` directory to your PATH\n\n\n## What's Changed\n• fix(true,false,dirname)：coreutils operand-ignore and leading-slash collapse semantics (#1196) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1198\n• fix(checksums)：read stdin in binary mode so 0x1A no longer truncates input by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1199\n• fix(digest)：read fd 0 in binary mode in the shared hash_file_hex path (#1200) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1201\n• fix(wpm)：name the command link a rebuild cannot replace, and park it instead of giving up by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1209\n• fix(stdin)：read fd 0 in binary mode across the remaining text-mode applets (#1202, #1212, #1211) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1218\n• reject extra operands (uname/arch/whoami/logname/hostid); expr treats long options as data by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1221\n• date -d '' is an explicit empty date operand (today 00:00:00), not 'now' by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1222\n• cksum --raw / tree -o / split --filter：stop writing through CRT text mode by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1219\n• fix(wpm)：bound the rollback copies and let wpm clean reclaim them by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1210\n• grep/diff/diff3/sdiff/cmp exit 2 on usage errors; od no longer swallows a failed operand by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1220\n• perf(wpm)：a small forwarder for layout: shim packages (-12.4 ms per call) by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1217\n• Release v1.1.14 by @caomengxuan666 in https://github.com/unixwin/WinuxCmd/pull/1223\n\n\n**Full Changelog**：https://github.com/unixwin/WinuxCmd/compare/v1.1.13...v1.1.14"
