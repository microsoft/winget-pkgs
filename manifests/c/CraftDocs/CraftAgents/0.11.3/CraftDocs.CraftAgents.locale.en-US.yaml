ReleaseNotes: |-
  Features
  - New archive_session session tool — agents can archive (or unarchive) another session in the workspace by ID to tidy up finished or superseded sessions. Archiving only hides the session from the active list and unread counts, never deletes it; a session cannot archive itself, and archiving is refused while the target is mid-turn
  Improvements
  - Claude Agent SDK uplifted to 0.3.220 — the bundled SDK moves from 0.3.197 to 0.3.220 (Claude Code v2.1.220 parity). Pulls in upstream fixes for an abort-listener leak in streaming queries, richer process-exit diagnostics (CLI stderr now included in errors), correct HTTP status reporting for rate-limit errors, and session resume with dash-leading IDs. Note: upstream now caps subagent nesting depth at 1 by default (was 5) — override with CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH if you rely on agents spawning nested agents
  - If installing a downloaded update fails at the final handoff, the app now restarts cleanly instead of continuing in a half-shut-down state where later work could be lost
  Bug Fixes
  - macOS auto-update installs again — updates no longer end up downloaded-but-never-installed because quit cleanup interrupted the installer handoff
  - The chat input no longer force-capitalizes the first letter, which broke pinyin and other CJK IME composition
  - Local file links whose paths contain spaces (%20) open correctly again from chat messages
  - New sessions no longer inherit an excluded filter — a lone "exclude Done" filter used to create new sessions as Done; only include-mode filters are inherited now
  - Custom OpenAI-compatible endpoints validate again: relays that send an empty tool_calls: [] field no longer break stream completion
  - Re-authenticating a ChatGPT or GitHub Copilot connection now refreshes its model list, so entitlement changes show up without a restart
  - MCP tools with dots in their names (e.g. pat.batch_plan) work on OpenAI/Codex-backed connections
  - Windows: image previews no longer fail by doubling the workspace path in front of absolute C:\ paths
  - Windows: a gitBashPath configured in config.json is honored by the agent's Bash tool, fixing "No bash shell found" for per-user Git installs
  - A stale server lock whose process ID was recycled by the OS no longer prevents the app from starting — the lock now records which executable wrote it, and startup verifies the live process actually matches
