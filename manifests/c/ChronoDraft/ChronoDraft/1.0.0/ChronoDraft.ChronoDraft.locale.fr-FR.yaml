ShortDescription: Éditeur de chronogrammes pour l'automatisation industrielle, avec chemin critique, temps de cycle et analyse des ressources.
Description: |-
  ChronoDraft est une application Windows de conception et d'analyse de chronogrammes
  pour l'automatisation industrielle et la conception mécanique.

  Chaque tâche est décrite par sa durée, son délai et ses dépendances ; ChronoDraft en
  déduit l'ordonnancement, le temps de cycle et le chemin critique, puis trace le
  diagramme correspondant. Des ressources (robots, opérateurs, machines) peuvent être
  affectées aux tâches pour faire apparaître les charges et les chevauchements, et
  plusieurs cycles peuvent être comparés pour identifier l'étape limitante.

  Les chronogrammes s'exportent en PNG, SVG ou Excel, et s'impriment. Des vues
  complémentaires couvrent les représentations GRAFCET et GEMMA, les couloirs
  (swimlanes) et les marqueurs de phase.

  L'application est disponible en français, anglais et chinois. Il s'agit d'un logiciel
  commercial : une clé de licence débloque l'ensemble des fonctionnalités, l'application
  non licenciée fonctionnant en lecture seule.
