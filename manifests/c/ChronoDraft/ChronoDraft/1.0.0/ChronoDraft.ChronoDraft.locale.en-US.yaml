ShortDescription: Timing diagram editor for industrial automation, with critical path, cycle time and resource analysis.
Description: |-
  ChronoDraft is a Windows desktop application for designing and analysing timing
  diagrams (chronograms) used in industrial automation and mechanical engineering.

  Tasks are described by their duration, delay and dependencies; ChronoDraft computes
  the resulting schedule, the overall cycle time and the critical path, and draws the
  corresponding diagram. Resources such as robots, operators and machines can be
  assigned to tasks to reveal load and overlap conflicts, and multi-cycle scenarios can
  be compared to find the limiting step.

  Diagrams can be exported as PNG, SVG or Excel, or printed. Complementary views are
  provided for GRAFCET and GEMMA representations, swimlanes and phase markers.

  The application is available in French, English and Chinese. It is commercial software:
  a licence key unlocks the full feature set, and the unlicensed application runs in
  read-only mode.
