ShortDescription: Programming tool for CACHIP microcontrollers
Description: |
  catool flashes firmware to CACHIP MCUs through a USB HID debug probe,
  and supports the legacy CH340 UART programmer. It provides commands for
  list, load, verify, erase, serial log, power control, on-board firmware
  library management, and MCP server for AI clients.
