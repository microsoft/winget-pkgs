ReleaseNotes: |-
  - PCI Express errors counters on AMD and Intel GPUs.
  - New metrics on AMD Strix Point, Strix Halo and Kraken Point : NPU power, NPU clocks, NPU TOPS and TOPS per watt, NPU DRAM bandwidth usage, global platform power and DRAM read and write bandwidths.
  - New HDD metrics (IOPS, average latency, NVMe controller link speed).
  - Remembers devices & sensor types nodes state.
