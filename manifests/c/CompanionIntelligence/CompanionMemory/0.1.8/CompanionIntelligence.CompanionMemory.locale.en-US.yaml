ShortDescription: Private, self-hosted memory for your digital life and your AI agents
Description: >-
  Companion Memory is private, self-hosted memory for your digital life and your AI agents. It runs its server in Docker. Install and start Docker Desktop, or another Docker engine with Compose 2.24.4 or newer, before you open the app. The first launch pulls the app's container images (about 3 GB) and, if no Ollama is running or on your PATH, downloads Ollama and two models (about 8 GB more). Uninstalling the app does not stop its containers or delete the Docker volumes that hold your memory.
