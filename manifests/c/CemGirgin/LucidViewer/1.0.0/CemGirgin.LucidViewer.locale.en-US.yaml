ShortDescription: Fast, free and open source image viewer and light editor for Windows, based on JPEGView.
Description: |-
  Lucid Viewer opens JPEG, PNG, HEIC, AVIF, JPEG XL, WebP, RAW and many other formats quickly and adds the tools people
  reach for every day: edit sliders with before/after comparison, crop and straighten, drawing and signatures, copy text
  from images (OCR), AI background removal on the device, a screenshot tool, star ratings, a metadata editor and
  conversion to other formats from Explorer's right-click menu. It is based on JPEGView.
