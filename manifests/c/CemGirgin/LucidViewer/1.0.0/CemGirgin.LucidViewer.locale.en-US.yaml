ReleaseNotes: |-
  First release of Lucid Viewer, based on JPEGView 1.3.46 with updated codecs. Modern window with toolbar, filmstrip
  and side panel, start screen, editing sliders with undo/redo, drawing and signatures, OCR, AI background removal,
  screenshot tool, conversion from Explorer, star ratings, metadata editor, similar photo finder, settings and shortcut
  editors; 24 MP JPEG on screen in ~140 ms.
