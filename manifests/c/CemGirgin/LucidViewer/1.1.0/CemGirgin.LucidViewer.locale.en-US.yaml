ReleaseNotes: |-
  Folder thumbnails with multi-selection and batch actions (rate, tag, copy, move, rename, convert, delete), timeline,
  photo search by name, tag, stars and date, tags written as Windows keywords, side-by-side compare, batch rename,
  open in a new window, copy/move to folder, sort by date taken, show on map, color picker, set as lock screen, pinch
  zoom, native ARM64 version, Turkish, German, French and Spanish translations, check for updates on request; many
  fixes (crash on close, single instance window, Explorer conversion of many files, default viewer page, long paths).
ReleaseNotesUrl: https://github.com/cemmgrgn/lucid-viewer/releases/tag/v1.1.0
