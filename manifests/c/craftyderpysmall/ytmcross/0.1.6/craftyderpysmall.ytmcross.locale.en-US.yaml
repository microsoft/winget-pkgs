ShortDescription: A minimal, fast, native YouTube Music client
Description: |-
  A minimal, fast, native YouTube Music client written in Rust, with no Electron and no bundled browser.
  The interface is drawn on the CPU and only when something changes; playback, stream resolving and decoding happen inside the app.
  About 4 MB of RAM idle and 8 MB while playing. Signing in opens a one-time WebView2 window.
