Description: UniRhy is a self-hosted music streaming platform organized as a monorepo with separated backend, frontend, and website projects. It aims to provide deployable and extensible music library management, playback, and synchronization capabilities, with cross-platform clients for the web, macOS, Windows, Android and iOS.
