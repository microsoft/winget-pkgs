PackageIdentifier: Coooolfan.UniRhy
PackageVersion: 0.1.0
PackageLocale: zh-CN
ShortDescription: 自托管、可扩展的音乐流媒体平台。
Description: UniRhy 是一个自托管的音乐流媒体平台，采用前后端与官网分离的 monorepo 组织方式，旨在提供可部署、可扩展的音乐库管理、播放与同步能力，并提供 Web、macOS、Windows、Android 与 iOS 跨平台客户端。
Tags:
- 专辑
- 播放器
- 歌单
- 歌手
- 歌曲
- 音乐
- 音频
ReleaseNotes: |-
  Tip
  macOS 安装包未签名，若提示应用已损坏，执行 xattr -cr /Applications/UniRhy.app 移除隔离属性即可
  feat
  - 私有化部署，无外部服务依赖
  - 跨平台客户端：Web、macOS、Windows、Android、iOS，
  - 同账号多设备播放同步，播放进度与队列跨会话持久化
  - 插件扩展体系：统一的权限管控与 Host API，支持媒体导入、任务定义与配置持久化
  - 曲库管理：扫描、整理、转码，支持文件系统与对象存储
  - 官网双语首页与文档中心
  Full Changelog: https://github.com/Coooolfan/UniRhy/commits/0.1.0
