ShortDescription: The desktop SEO crawler that explains the fix.
Description: |-
  Crawl Cove is a desktop SEO crawler that crawls a website, audits it for technical
  SEO issues, and explains what to do about each one. Every finding is paired with the
  evidence that triggered it, why it hurts rankings, and a specific, plain-English
  recommended fix, while the findings themselves stay deterministic.

  It is built for consultants and agencies running several client sites: each client
  gets its own project, history and reports, and every audit is versioned locally so a
  fix can be verified by re-crawling.

  Google Search Console and Bing Webmaster Tools connect natively, and Core Web Vitals
  come from CrUX field data plus Lighthouse on every audit with no paid API key. There
  is no URL cap and no per-feature paywall.

  Crawl data stays on the local machine; the app contacts our servers only for licence
  checks and updates. Requires a subscription after a 14-day free trial. A macOS build
  is available from crawlcove.com; there is no Linux or browser version.
