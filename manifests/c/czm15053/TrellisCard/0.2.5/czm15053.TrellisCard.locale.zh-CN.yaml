ShortDescription: 常驻桌面的 Trellis 任务与 Agent 活动观察者，以「卡片」和「胶囊」两种形态实时展示。
Description: Trellis Card 是一款 macOS / Windows / Linux 桌面端小工具，以「卡片」和「胶囊」两种形态实时展示 Trellis 项目中的任务进度与 Agent 活动。它不修改任务，只负责让你一眼看清当前在发生什么。支持生命周期状态感知（规划中、运行中、等待授权或阻塞、已完成）、卡片与胶囊双形态、翻面查看任务详情、任务树与项目筛选，以及 20 款内置主题。
