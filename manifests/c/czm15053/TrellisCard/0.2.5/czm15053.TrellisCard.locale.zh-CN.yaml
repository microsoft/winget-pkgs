ReleaseNotes: |-
  - 适配 Trellis 0.7 动态 Spec 路径约束：规范地图新增管辖路径 Glob 标签；卡片背面翻面即可自动匹配并查看当前任务所受约束的团队规范。
  - 支持多层级 Workflow 变体感知：完整支持 0.7 的四层工作流优先级回退链；主卡片、任务树、关联看板和胶囊展开态全面显示 [tdd] 等工作流变体专属徽章。
  - 平滑活动流适配：原生兼容 inject-spec-context 动态规范注入与工作流切换指令，消除规范阻断与核验过程中的假报警。
