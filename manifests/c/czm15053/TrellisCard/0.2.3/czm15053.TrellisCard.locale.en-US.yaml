PackageIdentifier: czm15053.TrellisCard
PackageVersion: 0.2.3
PackageLocale: en-US
ShortDescription: A desktop widget that displays task progress and Agent activity in Trellis projects in card and capsule forms.
Description: 'Trellis Card is a macOS, Windows, and Linux desktop widget that shows the task progress and Agent activity of Trellis projects in real time, in two forms: cards and capsules. It does not modify tasks; it only lets you see at a glance what is happening. Features include lifecycle state awareness (planning, running, waiting for authorization or blocked, completed), a card and capsule dual-mode display, flip-to-view task details, a task tree with project filtering, and 20 built-in themes.'
