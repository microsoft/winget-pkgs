ReleaseNotes: |-
  New Features
  - MatLivre now has a macOS release: a universal .dmg installer with automatic updates and file-type associations; the Linux AppImage also registers MatLivre's file types with the desktop.
  - The editor now highlights code following MATLAB's own rules and offers an autocomplete list for variables, functions and struct fields.
  - Implemented most of the Signal Processing Toolbox: filter design (fir1, fir2, firpm, firls, kaiserord, cfirpm, fircls, butter, cheby1, cheby2, ellip, besself, designfilt and the digitalFilter object), windows, spectral and time-frequency analysis (periodogram, pwelch, pmtm, pspectrum, spectrogram, stft, wvd, ifsst, tfridge), signal measurements (findpeaks, risetime, pulsewidth, envelope, findchangepts), resampling, linear prediction and modeling (lpc, prony, aryule), and pole-zero plots with zplane.
  - Added the symbolic functions ccode, fortran, subexpr, symmatrix, symmatrix2sym, symfunmatrix and symfunmatrix2symfun.
  - The app's interface can now be shown in Portuguese, Spanish, French, German, Italian, Russian, Chinese or Japanese, chosen from a new language menu.
  - The workspace now has a grid viewer for matrices too big to show on one line.
  - warning can now turn warnings on, off or into errors, query their state, and restore a saved state; lastwarn remembers every warning raised.
  Updates and Fixes
  - polyval now correctly evaluates complex coefficients and complex points instead of dropping their imaginary part.
  - Fixed a crash evaluating the Meijer G function for certain parameter combinations.
  - Fixed the editor's caret and text selection sitting lower than the code in each line.
  - Sparse matrix solves are faster (banded LU, and supernodal Cholesky/LU with fill-reducing orderings); the \ and / operators now record singular-matrix warnings in lastwarn.
  - Fixed a click-handling bug in the editor's suggestion list.
  - Vectorized code runs faster; converting NaN to logical now gives the same error message as MATLAB.
  - FFT on long vectors and expm on real matrices are faster; the trace of a complex matrix now keeps its imaginary part.
  - chol, lu, qr, pinv and singular-value computations are faster on real-valued input.
  - char and string now print symbolic sums and products in MATLAB's internal term order.
  - Linux builds now run on older distributions (glibc 2.31).
  - Fixed plot export falling back incorrectly when platform fonts are unavailable.
  - line() now draws one line per column of matrix input and returns Line objects, matching MATLAB.
  - evalc no longer leaks its captured output into the diary.
  - The command window now wraps wide matrices into column blocks instead of running off the edge.
  - Loops that read a scalar first assigned inside the loop now run faster.
