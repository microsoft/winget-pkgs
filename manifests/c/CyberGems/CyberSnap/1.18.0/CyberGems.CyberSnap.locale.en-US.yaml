ShortDescription: All-in-one screen capture and annotation suite for Windows
Description: CyberSnap is an all-in-one screen capture and annotation suite for Windows, built to take a capture from first click to finished result without interrupting your workflow. Capture areas, windows, full screens, or scrolling content; record MP4 or GIF; annotate with vector tools; extract and translate text with OCR; and sample on-screen colors. A searchable local gallery, built-in video trimming, and multiple upload destinations make past captures easy to find, refine, and share. Built with .NET 9 and WPF.
