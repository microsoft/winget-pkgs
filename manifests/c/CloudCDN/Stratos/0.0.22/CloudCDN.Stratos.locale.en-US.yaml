ShortDescription: Official command-line client for CloudCDN.
Description: |-
  Stratos is the official command-line client and Node ESM library for CloudCDN.
  ~30 commands across the full control plane (purge, signed URLs, assets, insights,
  zones, tokens, webhooks, rules, storage, logs, AI, image transforms), an MCP
  stdio server, OpenTelemetry export, OS-keychain auth, shell completions, and a
  100%-tested zero-dependency single-file Node ≥ 20 implementation.
Tags:
- cdn
- cli
- cloudcdn
- mcp
- opentelemetry
ReleaseNotes: |-
  Highlights ⭐️
  - New npm name: Stratos is now @sebastienrousseau/stratos, next to the author's other npm packages. Install with npm install -g @sebastienrousseau/stratos; the stratos command, binaries, Docker image and installer scripts are unchanged, and @cloudcdn/stratos stops at 0.0.21.
  - Published by hand this once: npm can only trust a release workflow for a package that already exists, so 0.0.22 on npm has no npm provenance. The release artefacts below keep their SLSA attestation and Cosign signatures, and from 0.0.23 the workflow publishes to npm with provenance again.
  - GitHub Action follows the release: its npm fallback installs the new name (or @cloudcdn/stratos for 0.0.21 and earlier), and its default version, stuck at 0.0.6, now tracks the release and is checked by scripts/check-versions.mjs.
  - Advisories cleared: brace-expansion (dev-only, through c8) is held at 5.0.12 or later, clearing GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p. The licence is now Apache-2.0 OR MIT.
  What's Changed
  - chore(deps-dev): bump c8 from 11.0.0 to 12.0.0 by @dependabot[bot] in #37
  - chore(deps): bump actions/setup-node from 6 to 7 by @dependabot[bot] in #36
  - chore(deps): bump actions/checkout from 6 to 7 by @dependabot[bot] in #35
  - fix(deps): clear the high-severity npm advisories by @sebastienrousseau in #38
  - chore(license): ship Apache-2.0 OR MIT by @sebastienrousseau in #39
  - fix(license): restore LICENSE as a pointer to the dual grant by @sebastienrousseau in #40
  - feat!: publish as @sebastienrousseau/stratos 0.0.22 by @sebastienrousseau in #41
