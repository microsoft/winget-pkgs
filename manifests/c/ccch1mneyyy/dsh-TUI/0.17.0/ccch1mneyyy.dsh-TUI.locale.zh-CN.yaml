PackageIdentifier: ccch1mneyyy.dsh-TUI
PackageVersion: 0.17.0
PackageLocale: zh-CN
ShortDescription: DeepSeek Harness 官方首推的终端界面：高性能、低占用。
Description: dsh-TUI 是 DeepSeek Harness（DSH）的交互式终端界面，支持全屏会话、像素鲸鱼伴侣、流畅鼠标交互和低占用，并提供供脚本驱动的独立 headless 命令 dst。
