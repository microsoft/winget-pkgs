ShortDescription: Network daemon for interprocess locking
Description: |-
  lockd provides named locks over TCP so that processes on different machines
  can coordinate access to shared resources. Clients can use the text protocol,
  C++ library, Python bindings, or C API.
  This installer includes the Windows daemon and native test executable.
Moniker: lockd
Tags:
  - concurrency
  - distributed-locking
  - locking
  - mutex
  - synchronization
ReleaseNotesUrl: https://github.com/codexterous/lockd/releases/tag/v1.0.4
InstallationNotes: |-
  Run lockd.exe and lockd_test.exe from the installation directory.
  Windows service installation is optional. Use --interactive to configure it,
  or add --custom "/Service=1" to install the service with its default settings.
