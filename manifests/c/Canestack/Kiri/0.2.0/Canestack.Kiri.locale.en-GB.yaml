ShortDescription: A tiny, fast container runtime for Windows
Description: Kiri is a container runtime written in Rust that runs your Docker images on Windows through a lightweight Linux VM. It works with the docker, Compose and buildx command lines you already use, and the installer registers no Windows service and no kernel driver.
