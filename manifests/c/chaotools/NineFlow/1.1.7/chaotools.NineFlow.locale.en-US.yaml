ShortDescription: Multi-key auto-repeat, smart resume and batch-send helper for Windows.
Description: |-
  NineFlow is a portable Windows desktop tool that repeats key sequences with per-row intervals and counts,
  remembers progress across rounds, and sends keys to the correct target window.

  Global hotkeys (F7 start / F8 stop / F9 reset by default), tray background mode, execution summary,
  configurable key rows (2-20), and built-in update check are included. Keys are delivered with SendInput;
  no image recognition or window scraping is involved.
