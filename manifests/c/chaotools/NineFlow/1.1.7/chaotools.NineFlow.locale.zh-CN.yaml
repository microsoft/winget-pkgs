PackageIdentifier: chaotools.NineFlow
PackageVersion: 1.1.7
PackageLocale: zh-CN
Publisher: chaotools
PackageName: 九序
ShortDescription: 多键连发 · 智能续点 · 转发助手
Description: |-
  九序（NineFlow）是一款免安装的 Windows 桌面工具：多行按键可各自设置间隔与次数（0 = 无限），
  跨轮自动续点，按键始终发给正确的目标窗口。

  支持全局热键（默认 F7 开始 / F8 停止 / F9 重置）、托盘常驻、本次执行摘要、2-20 行按键配置
  与内置检查更新。按键通过 SendInput 投递，不做图像识别与窗口扫描。
