ShortDescription: 'One terminal for all your coding agents and shells: run Claude Code, Copilot, Codex, Gemini, OpenCode or any CLI side by side in one window, with customizable tabs, layouts, templates, colors, icons and themes.'
Description: |-
  Agent Terminal brings your coding agents and shells into one window. Every tab is a project folder with a shell (PowerShell, cmd, Git Bash, WSL and more) next to your agent CLI (Claude Code, GitHub Copilot CLI, Codex, Gemini CLI, OpenCode, or any command you add), running exactly as it would in a normal terminal, with no chat wrapper.

  Make it yours: split, drag and resize panes into any layout, save layouts as templates, and pick what new tabs open with. Color and rename tabs, give each agent its own icon and color, choose color schemes and fonts, and pick which details pane headers show.

  A sidebar shows each tab's folder, git branch and status, and which model its agent is using, plus whether it's working or waiting for you. Tabs follow your shell as you cd and reopen where you left off, with agents resuming their last conversation.
