ShortDescription: A full taskbar on every monitor for Windows 11.
Description: |-
  Windows 11 gives secondary monitors a stripped-down taskbar: no system tray, no volume icon, and
  pinned apps only if every monitor also shows every open window. MultiTaskbar replaces those
  secondary taskbars with a complete one: the Start button, your pinned apps in the same order as
  the main taskbar, only the windows on that monitor with their titles, a volume control, the clock
  and a show-desktop corner. It follows the Windows light or dark theme and accent color, and hides
  itself when an app goes full screen.

  The main monitor's taskbar is untouched, and the original Windows taskbars come back when
  MultiTaskbar exits. It is a single portable executable with no installer, service or telemetry.
