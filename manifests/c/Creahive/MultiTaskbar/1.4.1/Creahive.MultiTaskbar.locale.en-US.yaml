ShortDescription: A full taskbar on every monitor for Windows 11.
Description: |-
  On Windows 11 the taskbar on a secondary monitor is a reduced version of the real one: no system
  tray, no volume icon, and pinned apps only if every monitor also shows every open window.
  MultiTaskbar replaces those secondary taskbars with a complete one: the Start button, the pinned
  apps in the same order as the main taskbar, only the windows on that monitor with their titles,
  live previews of those windows on hover, a volume control, a clock with a calendar, and a
  show-desktop corner. Right-clicking an app gives the same menu the main taskbar gives, including
  the files it opened lately. It follows the Windows light or dark theme and accent color, scales
  to each monitor's DPI, and hides itself when an app goes full screen.

  The main monitor's taskbar is left alone, and a Windows taskbar is hidden only while a
  MultiTaskbar bar is up on that same monitor, so no screen is left without one. It is a single
  portable executable with no installer, service or telemetry.
