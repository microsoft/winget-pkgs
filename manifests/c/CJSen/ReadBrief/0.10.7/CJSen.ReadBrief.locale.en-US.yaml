PackageIdentifier: CJSen.ReadBrief
PackageVersion: 0.10.7
PackageLocale: en-US
ShortDescription: A cross-platform desktop AI reading assistant that summarizes selected text with a global hotkey.
Description: 'ReadBrief is a desktop AI reading assistant for macOS and Windows. Select text in any application and press a global hotkey: a system-level floating window near your cursor streams an AI-generated summary, and every summary is saved to a searchable local history. It supports multiple providers over the OpenAI, Claude, and Gemini protocols with speed testing, keeps API keys in the Rust backend, and offers custom prompts, tags and favorites, light and dark themes, and a bilingual interface.'
