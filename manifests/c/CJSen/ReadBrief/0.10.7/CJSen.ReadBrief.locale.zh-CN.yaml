ShortDescription: 选中文字、按下快捷键，AI 即刻流式生成要点总结的多平台桌面阅读助手。
Description: ReadBrief 是一款支持 macOS 与 Windows 的桌面 AI 阅读助手。在任意应用中选中文字并按下全局快捷键，靠近光标的系统级浮窗即会流式生成 AI 要点总结，总结保存到本地可搜索的历史记录。它支持 OpenAI、Claude、Gemini 协议的多服务商配置与测速，API 密钥由 Rust 后端保管，提供自定义提示词、标签收藏、明暗主题与中英双语界面。
