ShortDescription: Desktop BTC/USDC spot grid trading bot that runs on your own machine.
Description: |-
  CryptoBot Pro is a desktop grid trading bot for BTC/USDC spot (BTC/USDT on Aster). The interface is Electron and the trading engine is a local Go binary. No CryptoBot Pro account is needed.

  The bot talks to the exchange directly. The app checks GitHub for updates. Once a day, and when you activate the license, it sends the subscriber's email to a license function run by the developer, which asks Stripe whether the subscription is active and neither stores nor logs the email. Telegram is contacted only if you add a Telegram bot token. There is no telemetry.

  Exchange keys are stored in plain text in a config file on the user's own disk. On Binance, Kraken, MEXC, KuCoin and Bitvavo, create the API key with trading allowed and withdrawals disabled, and add an IP whitelist where the exchange offers one. On Hyperliquid, connect an API wallet, which can place and cancel orders but cannot withdraw to another address. On Aster the bot signs with an API wallet key: allow spot trading only, disable withdrawals where the option is offered, and keep only the trading capital on that account.

  One pair, one strategy: a limit buy below the market, then a sell above the buy price once it fills. A cycle closes only when its sell fills above its buy, so a losing position stays open instead of being sold at a loss. The bot uses no leverage, shorts, futures or signals.

  Supported exchanges: Hyperliquid, Bitvavo, Aster, Kraken, MEXC, KuCoin, and Binance outside the EU. The machine has to be running for the bot to trade.

  Trial and pricing: every feature is free for 90 days. Payment details are collected when the trial starts and the first charge is on day 91. Plans are subscriptions renewed until cancelled: 5.99 USD per month, 29.99 USD billed every 6 months, 49.99 USD billed yearly, plus VAT where applicable. Every plan has the same features and covers one machine.

  The installer is not code signed, so Windows SmartScreen may warn when the installer runs. On Windows, the app can download and install its own updates when you click Update.

  This is a software tool, not an investment service, and it is not financial advice. A grid strategy can lose money, in particular during a long drawdown. Sold by CryptoBot Pro, France.
