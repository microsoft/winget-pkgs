ReleaseNotes: |-
  Security update: Electron runtime 43.2 -> 43.7 (latest Chromium security fixes) and a hardened audio-tag reader (music-metadata 11.15) for malformed files. Build-toolchain advisories patched as well; none were part of the installed app. The README now lists bundled third-party software and licenses (FFmpeg is GPL v3, with its license and source link installed alongside it).
