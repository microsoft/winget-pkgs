ShortDescription: A desktop audiobook player for Windows, built with Electron.
Description: Midnight Athenaeum plays local audiobook files with real chapter navigation, per-book resume, per-book playback speed, bookmarks, skip-silence, volume normalization, and a sleep timer. A Continue Listening shelf, library filters, and series grouping keep the book you're on one click away, even in a library of thousands. Entirely offline and local -- no account, no server, no telemetry.
