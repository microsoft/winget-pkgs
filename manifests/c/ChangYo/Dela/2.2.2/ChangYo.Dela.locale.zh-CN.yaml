ShortDescription: 为上海交通大学学生打造的智能体套件，集成校园信息服务、AI 编程助手与工作台工具。
Description: Dela 是一款专门面向 SJTUer 的 Agent 产品，内核基于 Pi 构建，所有校园服务功能都通过交大公开 API 和学校服务器交互。集成 Canvas 课程资料快捷预览与批量下载、校园邮箱、课堂视频回看（语音识别文稿跳转与导出）、课表日历与 TODO 双向互通、水源社区阅读、全局搜索等校园信息服务。内置 Agent 支持导入第三方 skills 与接入 MCPs，提供自定义 web_search 与免费 web_fetch 工具，在 Coding 领域特别加强；remote project 通过 SSH 把远端服务器目录登记为项目，Agent 的读写与命令直接在服务器上执行。工作台提供 Markdown 笔记编辑、任意文本文件编辑与内置终端。凭据经系统钥匙串加密后保存在本机，其余数据保存在本地，不上传服务器。
