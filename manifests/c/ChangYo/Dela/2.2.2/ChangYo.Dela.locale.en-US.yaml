PackageIdentifier: ChangYo.Dela
PackageVersion: 2.2.2
PackageLocale: en-US
ShortDescription: Agent harness for SJTU students with campus services, an AI coding agent, and workspace tools.
Description: Dela is an agent harness designed for SJTU students. Its agent kernel is built on Pi, and campus services interact with the university through public SJTU APIs. It integrates Canvas courseware preview with batch download, campus email, lecture video playback with speech-recognition transcripts, a course schedule calendar with TODO integration, a community reader, and global search. The built-in agent supports third-party skills, MCP servers, and custom web search, with particular strength in coding, and remote projects connect a far server over SSH so agent reads, writes, and commands run directly on the server. A workspace adds Markdown note editing, plain-text file editing, and an integrated terminal. Credentials are encrypted in the system keyring and other data stays on the local machine.
