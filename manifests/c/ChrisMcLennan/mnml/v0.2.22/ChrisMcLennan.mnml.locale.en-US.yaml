  Added
  - (config) mnml export-config-zon [--out PATH] [--workspace DIR] [--in PATH] [--force]
    converts a 0.2.x config.toml to the config.zon mnml 0.3 (mnml-zig) reads —
    only the keys you set, a // doc comment per key, closed-set strings as enum
    literals, [[marketplace.source]] as a tagged union, formatter/linter
    string-or-list as a list, and anything it cannot place kept verbatim in a
    trailing // unmigrated: block. The TOML file is left where it was.
  Fixed
  - (vim) guu / gUU / g~~ leave the cursor on the line they changed
    (3G3|g~~ ends at 3:1, on the first non-blank) instead of dropping to
    the start of the next line, so j . repeats on the next line rather
    than the one after; the count form (3guu) now covers three lines and
    keeps the cursor where it was, as vim does.
  - (editor) Saving a file with no final newline no longer moves the cursor:
    the appended \n used to park it on a phantom line below the last one
    (Ln 2/1), so a vim A / o from there edited the wrong place. Cursor,
    selection and sticky column all stay put; a vim Normal cursor sitting past
    the last character steps back onto it. And vim's Esc from Insert or Replace
    now stops at the start of the line (:help i_<Esc>) instead of crossing
    onto the line above — o<Esc> stays on the opened line, i<Esc> at
    column 0 stays put, A<Esc> lands on the last character.
  Install mnml-rs 0.2.22
  Install prebuilt binaries via shell script
  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/chris-mclennan/mnml/releases/download/v0.2.22/mnml-rs-installer.sh | sh
  Install prebuilt binaries via powershell script
  powershell -ExecutionPolicy Bypass -c "irm https://github.com/chris-mclennan/mnml/releases/download/v0.2.22/mnml-rs-installer.ps1 | iex"
