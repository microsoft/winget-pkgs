ReleaseNotes: |-
  ## 0.33.1

  This patch release updates the CycloneDX .NET library. Users of 0.33.0 should upgrade to 0.33.1.

  ### Added

  Multi-platform Docker images for `linux/amd64` and `linux/arm64`.

  ### Fixed

  [`cyclonedx-dotnet-library#427`](https://github.com/CycloneDX/cyclonedx-dotnet-library/pull/427): Check nested components when using `analyze --multiple-component-versions`, addressing [CLI issue #481](https://github.com/CycloneDX/cyclonedx-cli/issues/481).
  [`cyclonedx-dotnet-library#415`](https://github.com/CycloneDX/cyclonedx-dotnet-library/pull/415): Preserve vulnerability `affects.ref` values during hierarchical merges, addressing [CLI issue #471](https://github.com/CycloneDX/cyclonedx-cli/issues/471).

  **Full Changelog**: https://github.com/CycloneDX/cyclonedx-cli/compare/v0.33.0...v0.33.1
