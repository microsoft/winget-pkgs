ShortDescription: 一款用 Rust 打造的快速、私密的开源浏览器。
Description: |-
  Zephium 是一款用 Rust 打造的快速、私密的开放源代码浏览器，并配有工作（Work）：一块供你和你的智能体共同浏览、比较和规划的画布，成果会留存在其中。
  它使用系统的 Web 引擎（在 Windows 上为 WebView2），提供带空间和个人资料的垂直边栏、分屏视图、启动器和原生广告拦截器，还可以从 Chrome 应用商店安装扩展程序。
  Zephium 的 AI 是可选的。询问 Zephium（Ask Zephium）会针对你所在的页面回答问题，工作（Work）则是与智能体并排浏览和规划的画布。你可以自带密钥、运行本地模型，或使用付费的 Zephium AI。
