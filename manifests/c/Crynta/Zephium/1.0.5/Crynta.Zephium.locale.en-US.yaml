ReleaseNotes: |-
  Stronger ad blocking, live tab previews, shared search shortcuts and more capable extensions, with fixes for saved work, downloads and everyday browsing.
  Highlights
  - Built-in ad blocking now includes uBlock Origin's filter lists and site fixes, including YouTube playback fixes. Known scam, malware and ad-redirect pages are blocked before loading, with an explanation.
  - Tap Ctrl+Tab to return to your last tab, or hold it for a grid of live previews, on Windows too. Select multiple sidebar tabs to close, mute, move between spaces or add to Essentials together.
  - Search shortcuts work across the address bar, search window and new tab. Pick a site from the menu, type its !shortcut or use a supported keyword. Manage shortcuts in Search settings.
  - Tools open beside a narrow tab rail. Full mode gives them the page area while keeping your current tab and tab switcher within reach.
  - New day and night skies on the new-tab page keep clouds clear of the text.
  - Pin up to three extensions beside the new-tab button. On macOS, extensions gain bookmarks, history and downloads support, and compatible password managers can connect to their desktop apps after approval.
  - Zephium tries HTTPS first, asks before filling passwords on unencrypted pages and lets you control which sites may download files.
  Fixes
  - Work preserves drafts, new notes and conflicting edits, with a warning when saves conflict. Long sidebar conversations keep their latest messages, and sending no longer clears words typed in the meantime.
  - The sidebar remembers its width after restarting. Its hidden card stays open while you use it, resizes correctly and no longer leaves a gray layer over pages.
  - Quitting no longer hangs. On Windows, signing out or restarting preserves tabs and sign-ins, and Zephium can reopen immediately after quitting.
  - Downloads finish in the background. Save dialogs wait until you return instead of cancelling the download.
  - Search accepts text containing URLs, Up wraps through suggestions, and Ctrl+L (Cmd+L on Mac) selects the whole address. Zoom supports Shift-plus and keypad keys; cycling tabs leaves the page's text cursor in place.
  - Dialogs, dropdowns and tab-drag previews stay above pages. Long menus scroll and submenus stay visible. Improved keyboard controls, screen reader announcements, contrast and reduced-motion behavior.
  - Profile edits save to the correct profile, and Settings confirms completed deletions. Picture-in-picture works more reliably when entering from fullscreen and returning to the page.
  - On macOS, fixed a crash during page navigation. On Windows, fixed focus after returning to the browser and a Manage Site Data crash; clearing site data now covers more storage and reports any remaining data.
  - Windows uses about 44 MB less memory, with less activity in idle and hidden tabs. The selected window backdrop is respected, Automatic uses Acrylic, and pages use thin Windows 11 overlay scroll bars. Window controls stay clear of page corners and New Tab buttons.
