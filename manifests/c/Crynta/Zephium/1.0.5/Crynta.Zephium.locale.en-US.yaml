ShortDescription: A fast, private, open-source browser built in Rust.
Description: |-
  Zephium is a fast, private, open-source browser built in Rust, with Work: a canvas where you and your agents browse, compare and plan in the open, and keep the results.
  It runs on the system web engine, using WebView2 on Windows, and adds a vertical sidebar with spaces and profiles, split view, a launcher and a native ad blocker. Extensions can be installed from the Chrome Web Store.
  Zephium's AI is optional. Ask Zephium answers questions about the page you're on, and Work is an agent canvas for browsing and planning side by side. You can bring your own keys, run a local model, or use paid Zephium AI.
