ReleaseNotes: |-
  Bug fixes and improvements
  - Fixed an abort when standard error is closed.
    [contributed by GitHub user Skytuhua]
  - Fixed detection of assembler .incbin directives with macro operands, preventing false cache hits.
    [contributed by Oleg Sidorkin]
  - Fixed escaping of backslashes in temporary MSVC response files for long command lines, restoring correct behavior of options such as /d1trimfile.
    [contributed by Vaibhav Awale]
  - Fixed depend mode to fall back to the compiler when a GCC precompiled header cannot be located, preventing false cache hits.
    [contributed by Don Yin]
  - Fixed display of diagnostic colors and Unicode text on Windows consoles.
    [contributed by GitHub user Peter0x44]
  - Fixed matching of ignore_headers_in_manifest entries against header paths starting with .\ on Windows.
    [contributed by Chris Burr]
  - Reduced memory usage and copying when reading local cache entries, hashing binary files and storing compilation results.
    [contributed by Joel Rosdahl]

  Test improvements
  - Made tests skip unsupported -march=native and -gz configurations when the compiler only emits a warning, and skip Clang profiling tests when the profiling runtime is unavailable.
    [contributed by Chris Burr]
  - Fixed ThinLTO index generation with lld-link and comparison of debug object files containing CodeView information.
    [contributed by Chris Burr]
  - Fixed storage server and helper cleanup to avoid blocking removal of test directories on Windows.
    [contributed by Joel Rosdahl]
  - Removed an invalid check for split DWARF debug logs.
    [contributed by Joel Rosdahl]

  Documentation improvements
  - Clarified that configuring remote storage disables file_clone and hard_link for the local cache as well.
    [contributed by Joel Rosdahl]
