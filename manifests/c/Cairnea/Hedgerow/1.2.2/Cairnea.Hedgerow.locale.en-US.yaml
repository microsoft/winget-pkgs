ShortDescription: A calmer desktop. Hedgerow gathers your desktop icons into quiet zones you can name, move, sort and hide.
Description: |-
  Hedgerow organizes the Windows desktop into zones: shaded areas that hold related icons. Drag icons in, roll a zone up to its title, or show a folder such as Downloads without moving its files. Rules sort new icons into the right zone, snapshots save and restore your layout, and Home shows a map of your monitors and zones.
  30-day free trial, then a one-time $14.99 license.
