ShortDescription: Encrypt files with a password on your PC. No account, nothing uploaded.
Description: |-
  Clavis Encrypt locks files with a password on your own PC using AES-256-GCM and Argon2id. Right-click any file in File Explorer to encrypt or decrypt it; encrypted files get random names, so the file name is hidden too. A one-time recovery key covers a forgotten password. The free plan also unlocks with Windows Hello, sends a file with a password that opens in any web browser, and shreds files (best effort on SSDs). Pro and Premium (one-time purchases) add whole folders, watch folders, finding sensitive files, team folders and more. No account, works offline, installs without administrator rights.
