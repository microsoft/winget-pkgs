ShortDescription: Free manager of anti-detect Camoufox browser profiles with a REST API and an MCP server
Description: |-
  CloutFox keeps many browser identities on one computer. Each profile has its own
  device fingerprint, cookies, proxy, timezone and language, and launches in the
  Camoufox browser. A local REST API and an MCP server let scripts and AI agents
  drive the browsers. Open source, no account, no per-profile pricing.
