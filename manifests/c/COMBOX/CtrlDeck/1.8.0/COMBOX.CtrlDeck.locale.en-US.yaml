Description: Ctrl Deck is a customizable productivity application for Windows 10 and 11. It provides quick access to applications, files, folders, web links and frequently used work environments. Users can customize keyboard shortcuts, manage application windows, and organize their resources using Favorites, Workspaces and Live Spaces, including on multiple displays. The application helps identify conflicting keyboard shortcuts. Version 1.8 improves Favorites, application management, usability and stability. Ten interface languages are supported. The software includes a full-featured 14-day trial, a limited free mode thereafter, and an optional one-time license without a subscription.
