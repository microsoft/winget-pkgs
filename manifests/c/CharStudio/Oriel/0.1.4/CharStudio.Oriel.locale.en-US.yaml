ShortDescription: A free, open source web browser for Windows, an unofficial port of Search, the browser for the Mac by Office Commun.
Description: |-
  Oriel brings Search's design to Windows: a column of tabs down the left (or a strip across the top), one field for addresses and searches, and the page as a card beside them. Spaces and pins, Chrome extensions from the Chrome Web Store, ads and trackers blocked in the network layer, passwords behind Windows Hello, reading mode, split view, translation on your PC, and sync through a folder you choose. No account and no telemetry.
  Oriel is built on Chromium through Electron. It is not affiliated with or endorsed by Office Commun.
