ShortDescription: 'Descarga, transcribe y convierte videos, y mejora imágenes con IA, en tu PC con Windows.'
Description: |-
  AppGrabbit es una app para Windows 10 y 11 que descarga, transcribe y convierte videos, y mejora imágenes con IA, en tu propia computadora.
  Pega un link de YouTube (videos, Shorts, playlists), TikTok, Instagram, Facebook, X, Pinterest, Twitch o SoundCloud y el archivo queda en tu carpeta en la calidad que elijas, hasta 4K, o directo en ProRes 422 HQ o DNxHR HQ para editar.
  Convierte cualquier video o una grabación tuya (una clase, una junta, una nota de voz) en un .txt limpio con un prompt para ChatGPT, Claude o Gemini, transcrito en tu PC con Whisper, sin subir nada. Pon subtítulos con IA dentro del video, recorta fragmentos exactos y convierte archivos.
  Agranda fotos, logos y dibujos ×2 o ×4 con IA en tu tarjeta gráfica, y pasa un logo o un dibujo a vector (SVG), con vista previa gratis.
  Sin cuenta, sin anuncios. Plan gratis: 5 créditos al mes; Pro o los pases de 2 y 7 días quitan los créditos. La app se actualiza sola.
