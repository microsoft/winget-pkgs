ShortDescription: 'Download, transcribe and convert videos, and enhance images with AI, on your Windows PC.'
Description: |-
  AppGrabbit is a Windows 10/11 app that downloads, transcribes and converts videos and enhances images with AI on your own computer.
  Paste a link from YouTube (videos, Shorts, playlists), TikTok, Instagram, Facebook, X, Pinterest, Twitch or SoundCloud and the file lands in your folder in the quality you pick, up to 4K, or straight as ProRes 422 HQ or DNxHR HQ for editing.
  Turn any video or your own recording (a class, a meeting, a voice note) into a clean .txt with a prompt for ChatGPT, Claude or Gemini, transcribed on your PC with Whisper, nothing uploaded. Burn word-timed subtitles into a video, cut exact clips and convert files.
  Enlarge photos, logos and drawings x2 or x4 with AI on your graphics card, and turn a logo or drawing into an SVG vector, with a free preview.
  No account, no ads. Free plan: 5 credits a month; Pro or 2-day and 7-day passes remove credits. The app updates itself.
