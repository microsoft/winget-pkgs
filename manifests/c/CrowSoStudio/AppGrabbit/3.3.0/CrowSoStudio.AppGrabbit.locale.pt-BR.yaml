ShortDescription: 'Baixe, transcreva e converta vídeos, e melhore imagens com IA, no seu PC com Windows.'
Description: |-
  AppGrabbit é um app para Windows 10 e 11 que baixa, transcreve e converte vídeos, e melhora imagens com IA, no seu próprio computador.
  Cole um link do YouTube (vídeos, Shorts, playlists), TikTok, Instagram, Facebook, X, Pinterest, Twitch ou SoundCloud e o arquivo fica na sua pasta na qualidade que você escolher, até 4K, ou direto em ProRes 422 HQ ou DNxHR HQ para editar.
  Transforme qualquer vídeo ou gravação sua (uma aula, uma reunião, um áudio) em um .txt limpo com um prompt para ChatGPT, Claude ou Gemini, transcrito no seu PC com Whisper, sem enviar nada. Coloque legendas com IA no vídeo, corte trechos exatos e converta arquivos.
  Amplie fotos, logos e desenhos ×2 ou ×4 com IA na sua placa de vídeo, e passe um logo ou desenho para vetor (SVG), com prévia grátis.
  Sem conta, sem anúncios. Plano grátis: 5 créditos por mês; o Pro ou os passes de 2 e 7 dias tiram os créditos. O app se atualiza sozinho.
