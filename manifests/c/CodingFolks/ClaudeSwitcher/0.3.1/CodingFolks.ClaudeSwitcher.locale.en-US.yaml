ShortDescription: Run several Claude Desktop accounts side by side (unofficial)
Description: |-
  A tray app for Windows that runs several Claude Desktop accounts at the same time, each in its own
  window with its own taskbar button and colour. It shows each account's recent Claude Code usage and
  when it hit its limit, and can continue a session in another account. Needs Claude Desktop (the
  Microsoft Store / MSIX build). Not made by or affiliated with Anthropic.
