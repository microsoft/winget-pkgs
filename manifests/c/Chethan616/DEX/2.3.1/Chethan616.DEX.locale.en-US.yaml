ShortDescription: An open-source AI agent that operates your browser, files, apps and accounts on Windows while you keep using the PC.
Description: DEX is an open-source AI agent that does real work on your Windows PC - in your browser, your files, your apps and your accounts - while you keep using it. Hand it tasks from your desk, your phone, WhatsApp or Telegram. It drives Windows applications through UI Automation in the background instead of taking over the screen, uses a real Chromium browser over the DevTools Protocol with a per-task isolated tab, and connects to 50+ services through OAuth. It runs with your own Claude Code or Codex plan, or your own API key, on your own machine.
