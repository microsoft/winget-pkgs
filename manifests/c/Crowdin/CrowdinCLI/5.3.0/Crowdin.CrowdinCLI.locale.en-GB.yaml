# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: Crowdin.CrowdinCLI
PackageVersion: 5.3.0
PackageLocale: en-GB
ShortDescription: A command line tool that allows you to manage and synchronise localisation resources with your Crowdin project.
Description: |-
  Crowdin CLI is a command line tool that allows you to manage and synchronise your localisation resources with your Crowdin project. Using CLI, you can:
  - Automate the process of updating your source files in your Crowdin project
  - Download translations from Crowdin and automatically save them in the correct locations
  - Upload all your existing translations to Crowdin in minutes
  - Manage your localisation resources without leaving the terminal
  - Integrate Crowdin CLI with GitHub, GitLab, Jenkins, CircleCI, and other software
Tags:
- cli
- crowdin
- i18n
- l10n
- localisation
- translation
ManifestType: locale
ManifestVersion: 1.12.0
