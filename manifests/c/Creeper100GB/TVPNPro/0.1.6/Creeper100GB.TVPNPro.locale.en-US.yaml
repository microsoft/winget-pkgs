ShortDescription: Windows privacy client with a fail-closed WFP firewall and Tor-only mode.
Description: TVPN Pro is an alpha Windows client that blocks all outbound traffic except Tor, the VPN setup path and loopback. It reports whether a VPN-to-Tor chain is actually verified and never claims anonymity. The VPN chain, MAC change, hostname neutralization and code signing are not finished; unsigned alpha.
