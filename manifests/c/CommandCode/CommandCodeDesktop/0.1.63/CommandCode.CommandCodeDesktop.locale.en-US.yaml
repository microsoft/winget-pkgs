ReleaseNotes: |-
  0.1.63 (2026-11-18)
  Features
  - The agent can now work the app: rename a chat, start or fork a chat, open a link, show a pane and send you a notification
  - Turkish is now a full interface language
  - Create a chat's worktree from a branch you pick
  - Right-click a project to pin it to the top of the sidebar
  - The context card shows the chat's cache hit rate
  - Your own providers (BYOK) sit under their own divider in the model picker
  - Pick colors from the page's palette in the design mode style inspector
  - Delete a published artifact from its row in the chat
  - Notices from Command Code now show in the app
  Improvements
  - Interface size now goes up to 200%
  - /todos opens the Todos setting, and you can fold a question's options to read the chat above
  - The effort picker shows arrows when more levels are hidden
  - "Don't work in a project" now gives you a chat box instead of an empty screen
  - A skill command now sends its pasted images and attached files with it
  Fixes
  - Use the app with your own provider without a Command Code account, where free users used to get an error screen
  - Dragging the scrollbar in a long chat now follows the cursor
