ReleaseNotes: |-
  [FEAT] Error cards now have buttons that fix the problem: locate a moved folder, sign in again, choose another model, or try again
  [FEAT] GitHub pull request and issue links in chat show as live chips, with a hover card for status, checks and size
  [FEAT] Clean up worktrees from the project menu: unused worktrees are removed, and one with unpushed commits is never touched
  [FEAT] A failed update install stays visible with Download manually and Show logs, and macOS offers to move the app to Applications
  [IMP] Stop frees a chat whose run never ends, and a silent model stream now times out instead of spinning forever
  [IMP] An error in the chat column stays inside its panel and your run keeps going
  [IMP] Images sent to the model are compressed and kept within a budget, so tool screenshots and long image chats no longer fail with a too large error
  [IMP] Build folders that git ignores no longer make the Changes list refresh over and over
  [FIX] Plan review feedback reaches the model in one round, and leaving plan mode frees the run
  [FIX] A chat gets its history back after its project folder was renamed or moved
  [FIX] Worktree chats started from a project subfolder open in that subfolder
  [FIX] Changes refresh after a commit made in a terminal inside a linked worktree
  [FIX] Removing a project in one window closes it in your other windows, and folder errors name the path and what to do next
  [FIX] A forked chat keeps its context meter, saved chat titles show after a reload, and the feed stays where you scrolled
  [FIX] A right-click while a reply streams no longer stops the feed from following
  [FIX] Stop keeps the turn's tokens and cost, and a finished turn stops streaming before the git refresh
  [FIX] A reloaded chat no longer marks a turn as stopped when you steered it mid reply
  [FIX] Select all and copy gives your message as typed, long messages stay expanded, and Retry keeps your pasted images
  [FIX] A reply that is only a thought no longer leaves a blank row in the chat
