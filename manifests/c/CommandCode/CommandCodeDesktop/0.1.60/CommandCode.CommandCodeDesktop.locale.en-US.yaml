ShortDescription: The visual workspace for the Command Code coding agent.
Description: Command Code Desktop is the visual workspace for Command Code, a coding agent built around open models. It lets you open projects, follow agent activity as work streams in, review changes with line-level diffs, and manage Git commits and pushes without leaving the app. It also provides project and chat management, plan review with iterative feedback, an integrated project terminal, and settings for models, permissions, appearance, and shortcuts.
