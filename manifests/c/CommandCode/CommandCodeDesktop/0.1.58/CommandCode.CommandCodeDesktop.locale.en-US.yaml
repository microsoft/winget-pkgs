ReleaseNotes: |-
  [FEAT] Settings has a new Providers page: add your own model providers and keys, and connect a ChatGPT or GitHub Copilot subscription
  [FEAT] Add Kimi K3.1 Pro to the model picker
  [IMP] A crashed or frozen window now offers to reload, open without the last chat, or show logs instead of staying blank
  [IMP] Taste learning is more selective, so you see fewer Learned notices
  [IMP] A tidier macOS installer window
  [FIX] Removing a project closes only its own terminals, including the ones in its chat worktrees
  [FIX] A failed chat worktree is cleaned up, so the next chat starts from a clean checkout
  [FIX] Chats keep their worktree when the app is open in two windows
  [FIX] A shell command the app cannot read no longer freezes the permission prompt
  [FIX] Model errors now show the real message instead of "Stream failed"
  [FIX] An invalid saved effort setting is ignored instead of failing every request
