ShortDescription: Offline Windows 11 clipboard guard and secret sanitizer with zero networking code.
Description: >-
  ClipShield is a 100% offline Windows 11 clipboard privacy protector and reversible sanitizer.
  It suppresses sensitive clipboard entries from Windows Clipboard History (Win+V) and Cloud Sync,
  sanitizes secrets on Ctrl+Alt+V using deterministic placeholders, restores AI replies with
  Ctrl+Alt+R via an ephemeral RAM vault wiped on screen lock, and imports zero networking libraries.
