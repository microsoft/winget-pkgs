ReleaseNotes: "• Added [Pro] \"Shared with me\" can be configured to view all shared files based on ACL (#3553)\r\n  • <details>\r\n     <summary>\r\n      Details\r\n     </summary>\r\n     \r\n    <img width=\"1039\" height=\"220\" alt=\"image\" src=\"https://github.com/user-attachments/assets/b558fed9-3f48-46eb-9ec1-fff611217928\" />\r\n\r\n     </details>\r\n• Added [Pro] New \"List\" permission setting to precisely control directory sharing permissions\r\n  • <details>\r\n     <summary>\r\n      Details\r\n     </summary>\r\n\r\n    <img width=\"488\" height=\"915\" alt=\"image\" src=\"https://github.com/user-attachments/assets/73dd00f8-5fe3-4644-ac98-6a29e1c0bf28\" />\r\n\r\n     </details>\r\n• Added [Pro] Support for adding multiple third-party authentications of the same type (#3510)\r\n  • <details>\r\n     <summary>\r\n      Details\r\n     </summary>\r\n    \r\n    <img width=\"722\" height=\"538\" alt=\"image\" src=\"https://github.com/user-attachments/assets/5e637d27-93fe-44f9-8f28-03574db6baa7\" />\r\n\r\n     </details>\r\n• Added [Pro] Archive and delete audit logs (#3556)\r\n• Added [Pro] Manually complete and fulfill pending orders in the admin panel (#3509)\r\n• Added New magic variables `{$theme}` and `{$dark}` in custom file apps to distinguish dark mode (cloudreve/frontend#347 @krom)\r\n• Optimized Force disable parallel chunk uploads when \"Pre-allocate disk space\" is not enabled (#3501 @YUDONGLING)\r\n• Fixed Queue Worker count setting not taking effect (#3566)\r\n• Fixed Handling of WebDAV `MOVE` operations with duplicate names does not comply with specifications (#3537)\r\n• Fixed [Pro] Other users cannot upload files in shared directories when using a load-balancing storage policy (#3533)\r\n• Fixed Incomplete input validation when editing user information in the admin panel (#3563)\r\n• Fixed A security vulnerability; details will be disclosed in 30 days. Thanks to @akinerkisa for reporting."
