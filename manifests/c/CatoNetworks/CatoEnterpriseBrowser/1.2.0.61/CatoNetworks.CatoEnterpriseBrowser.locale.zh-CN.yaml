ShortDescription: 基于 Chromium 的安全浏览器，仅将浏览器流量路由至 Cato 云。
Description: |-
  组织经常需要为非托管设备上的用户（如第三方供应商、承包商、访客用户或个人 BYOD 终端）提供对 Web 应用程序的访问权限。由于这些设备不受企业安全标准的约束，它们在访问公司资源时可能会带来安全隐患。
  Cato Enterprise Browser 让您能够从任何设备安全且受策略控制地访问公共 SaaS 和私有 WAN 应用程序，而无需安装 Cato Client 等代理客户端。它并非将控制措施扩展到现有的浏览器中，而是为用户提供了一个专用的、受管的浏览器工作区来开展业务活动。
  所有远程用户的安全策略执行均保持一致。互联网防火墙、应用控制 (CASB) 和数据保护策略作为统一策略框架的一部分予以实施。相同的安全策略既适用于使用 Cato Client 的受管设备，也适用于使用 Enterprise Browser 的非托管设备，从而简化了针对不同用户群体的策略执行。这些控制功能已完全集成到 Cato 平台中，并在全球所有 Cato 骨干网 PoP 节点上执行，因此 Enterprise Browser 的流量与 Cato 的其他服务一样，均受益于相同的单次通行检查 (single-pass inspection) 和全球统一执行。
  使用独立的 Enterprise Browser 还可以轻松区分个人和公司浏览行为。用户仅通过 Cato Enterprise Browser 访问业务应用程序，而个人活动则保留在其标准浏览器中。这种清晰的分离有助于用户了解自己何时处于受控的企业环境中。

  Cato Enterprise Browser 架构

  下图展示了来自 Enterprise Browser 的流量如何通过正向代理经由 Cato PoP 进行路由，接受 Cato SPACE 安全引擎的检查，然后发送至相关的 SaaS 或 WAN 应用程序。

  您还可以要求对企业应用程序的访问必须源自 Cato Cloud。例如，您可以在 IdP 或 SaaS 提供商中配置条件访问策略，仅允许来自 Cato 托管 IP 地址的流量。有关更多信息，请参阅“远程用户的 IP 分配策略”。
  当用户在非托管设备上启动 Cato Enterprise Browser 并访问企业应用程序时，所有浏览器流量都会自动通过 Cato PoP 进行路由。
  流量路径包括：
  - 通过 PoP 中的正向代理进行路由
  - 由 Cato SPACE 安全引擎进行检查和策略执行
  - 安全访问公共 SaaS 应用程序或私有 WAN 应用程序
  该架构可确保企业流量在到达目的地之前经过检查和控制，同时在逻辑上将企业访问与个人浏览活动隔离开来。

  在浏览器级别实施安全控制

  由于 Enterprise Browser 是一个专用的、受管的浏览器环境，因此您可以直接在浏览器级别实施安全控制。
  例如，您可以限制：
  - 复制和粘贴
  - 文件下载
  - 打印
  - 安装或使用未经授权的浏览器扩展
  即使在非托管设备或承包商设备上，这种方法也能让您更强有力地控制应用程序的访问方式以及数据的处理方式。它为业务活动创建了一个受控的工作区，有助于降低数据泄露和基于浏览器的恶意活动的风险，同时保持无缝的用户体验。

  使用案例 - 确保承包商安全访问敏感 SaaS 应用程序

  一家金融服务机构与外部审计人员合作，这些审计人员需要访问包含敏感客户数据的内部 SaaS 应用程序。由于审计人员使用的是他们自己的非托管设备，该机构需要强有力的控制措施来防止数据泄露，同时确保应用程序的完整功能。
  IT 团队向审计人员部署了 Cato Enterprise Browser。在受管的浏览器工作区中，他们针对特定应用程序禁用了复制和粘贴、阻止了文件下载并限制了打印。企业应用程序只能在 Enterprise Browser 中打开，而审计人员的个人浏览活动仍保留在其标准浏览器中。
  结果，审计人员能够在安全、受控的环境中高效工作，而该机构则显著降低了数据外泄和基于浏览器的威胁风险。
