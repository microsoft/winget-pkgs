ReleaseNotes: |-
  发布说明 – 2026 年 9 月 28 日
  - 新增 – 改进了整个应用程序中的多显示器检测功能。
  - 新增 – 为显示器选择提供更详细的高级显示器信息。
  - 错误修复 – 与 Calibrite PROFILER 同时运行的其他应用程序中的 Esc 键被阻止使用的问题。
  - 错误修复 – 改进了打印机配置文件创建过程中的打印机识别功能。
  - 错误修复 – 从 Quick Check 重新创建配置文件时错误选择显示器的问题。
  - 错误修复 – 发生错误后，应用程序可能无法检测到 Studio 设备的问题。
  - 错误修复 – 新的软件会话可能无法保留之前选择的显示器预设。
  - 错误修复 – 从以前的软件版本保存的预设可能无法正确继承。
