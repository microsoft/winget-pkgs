ReleaseNotes: |-
  本次更新带来插件系统，完善标签页导航与编辑器操作，并修复图片同步和 Linux 使用中的多项问题。
  新功能
  - 插件系统：桌面端新增插件市场，支持安装、更新和管理插件，可按工作区启用并管理访问权限。
  - 标签页导航：支持预览、固定标签页，以及前进、后退浏览。
  - 模型推理等级：支持在对话中直接调整受支持模型的推理等级。
  - GitHub Alert 提示块：支持 NOTE、TIP、IMPORTANT、WARNING、CAUTION 五种提示块。
  - 隐藏资源文件夹：文件视图可隐藏资源文件夹，让笔记列表更清爽。
  改进
  - 增强编辑器块拖拽与操作菜单，支持复制、上下移动、转换类型、清除格式和删除。
  - 优化大纲标题层级显示，支持直接拖动标题调整章节顺序。
  - 优化对话工具、附件添加菜单和权限说明。
  问题修复
  - 修复静态图片无法自动同步、笔记同步遗漏本地引用图片的问题。
  - 修复 Linux 默认工作区本地图片不显示、标题栏重复显示的问题。
  - 修复编辑器三击无法选中整段文本、右键菜单无响应的问题。
  - 修复文件名数字排序异常，现在按 1、2、10 等自然顺序排列。
  - 修复“在文件管理器中显示”未定位并选中当前文件的问题。
  - 修复 Skills 使用后消失、搜索面板打开后未自动聚焦的问题。
  - 修复部分模型服务的流式响应与 Agent 工具调用兼容性问题。
