ReleaseNotes: |-
  本次更新带来桌面端网页浏览、多级标签和记忆同步，并完善 Agent 交互与移动端使用体验。
  新功能
  - 新版本开始提供每日 200 次调用的 GPT6 Luna 免费模型使用次数。
  - 桌面端内置浏览器：支持网页标签页、书签和浏览历史，可将网页关联到 AI 对话。
  - 多级标签与多标签记录：一条记录可关联多个标签，支持层级标签管理，桌面端与移动端均可使用。
  - 记忆多设备同步：支持在设备间同步 AI 记忆。
  - Agent 交互增强：支持主动提问、逐题选择，审批时可追加修改要求，并提供后台审批通知。
  - 启动密码锁：支持设置启动密码，可选择 24 小时内免验证。
  - 界面自定义：支持全局自定义 CSS，提供语法高亮编辑器；
  - 桌面端底部工具栏支持拖拽排序。
  - 文件只读模式：支持以只读方式打开文件，并从标签页切回编辑模式。
  - 系统代理与权限管理：新增系统代理选项和系统权限管理入口。
  改进
  - 新增「本地存储」选项，统一桌面端同步状态展示。
  - 优化移动端手势、页面返回、文件排序、菜单布局和记忆管理。
  - 扩展插件视图、编辑器标签页、终端及文档排版能力，支持通过深度链接发起插件安装。
  - 优化赞助模型额度展示，额度用尽后自动切换到免费模型。
  - 精简依赖与资源，优化构建体积。
  新增插件
  - 终端。
  - 关联笔记。
  - 公众号排版。
  - 俄语语言包。
  问题修复
  - 修复 AI 对话流式更新触发的 React 报错。
  - 修复 Windows 网页新窗口链接无法在应用内新标签页打开的问题。
  - 修复 Android 切换系统深色模式后界面消失的问题。
  - 修复移动端工作区选择异常和 iOS 图标白边。
  - 修复 Markdown 表格粘贴异常、列表中按 Tab 导致焦点跳出编辑器的问题。
  - 修复同步未使用仓库默认分支、标签删除行为异常。
  - 完善 AI 请求与更新请求的错误来源提示。
