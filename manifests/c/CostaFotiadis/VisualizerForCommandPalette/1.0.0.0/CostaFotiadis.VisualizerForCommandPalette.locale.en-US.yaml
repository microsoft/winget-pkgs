ShortDescription: Turn the Command Palette dock into a live audio visualizer.
Description: A PowerToys Command Palette extension that turns the dock into a live audio spectrum visualizer — pinnable dock bands in three styles (block bars, braille grid, VU peak dot) plus an in-palette canvas with vertical bars or an oscilloscope trace, driven by loopback capture of the default output device. No microphone, no recording, no network access.
