ReleaseNotes: |-
  CoolDesk 2.0.7 — a launcher that organizes your work by project.
  > If your app stopped offering updates, this release fixes that. The previous
  > release was published under the tag v1.0.7 while actually shipping 1.7.0
  > binaries. The updater compared 1.0.7 against your installed version, decided
  > you were already newer, and never offered anything. Version numbers now follow
  > the app's real version again, so 1.6.0 and 1.7.0 installs will pick this up
  > normally. Nothing to do on your side.
  Project workspaces — .cooldesk/
  The big one. A project can now carry a committed .cooldesk/ folder holding the
  knowledge that usually lives in someone's head: what the project is, how it's
  built, the decisions behind it, shared todos, run commands and services. It's
  checked into the repo, so it travels with a git clone and every teammate — and
  every AI — reads the same thing.
  - Authored by the CoolDesk Claude Code plugin — /cd-init, /cd-sync,
    /cd-todo, /cd-decision, /cd-link.
  - Found automatically. CoolDesk scans your usual project folders on startup
    and turns every .cooldesk/ project it finds into a workspace. Previously a
    project only appeared if the plugin ran while the app happened to be open, so
    repos initialised beforehand — or pulled onto a second machine — stayed
    invisible. Projects you delete stay deleted; they aren't re-added.
  - Linked projects. A frontend, backend and plugin repo can be grouped as one
    workspace (hub-and-spoke), with their todos, commands and docs merged. Link
    them from the file manager or with /cd-link.
  - Project panel showing identity, git branch, run commands you can launch
    in place, shared todos grouped by project, and committed docs.
  Search
  - One spotlight everywhere. The desktop app now uses the same global
    spotlight as the new tab, instead of a separate search that behaved
    differently.
  - Fixed tab-group handling and the URL count shown in spotlight results.
  Widgets and dock
  - Widget store for the dashboard.
  - Bottom dock with app switching and workspace layout controls.
  Workspaces
  - Redesigned workspace cards with clearer click targets and navigation.
  - Sidebar / taskbar workspace view.
  - Knowledge graph view.
  - Workspace mapping, and uninstall handling for downloaded apps.
  Onboarding and appearance
  - First-run startup flow and onboarding tour.
  - Redesigned theme and settings, more wallpapers, and a custom accent colour
    picker.
  Fixes
  - Window focus handling.
  - Scrolling in the details view.
  - Dock and workspace layout fixes.
  - Updater reliability.
  Install: winget install CoolDesk.CoolDesk · brew install --cask cooldesk
  · or grab the installer below.
