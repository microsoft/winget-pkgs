ReleaseNotes: |-
  What's new in 2.0.15
  ✨ Added
  - The agent can see your tabs, history and apps — ask "suggest workspaces from my history" and it answers from what you actually use (time per site, open tabs, pages not in any workspace). Works with Claude Code and opencode. It still can't change anything until you press Apply.
  - CoolDesk learns from your choices — what you apply, untick or discard teaches it where pages belong, and it remembers across restarts. Pages you later remove from a workspace count against that suggestion; ones you reopen from search count for it.
  - Proposals as a diff — changes are grouped by workspace with +/− counts, a reason on every line, and moves shown as moves. Untick single lines or a whole workspace, or use Review one by one (Y keep, N skip).
  - File manager updates live — new downloads and saved files appear instantly, no refresh.
  - Scope pills — /u, /a, /f turn into URLs / Apps / Files pills, like /agent.
  💬 Changed
  - Redesigned agent chat: message bubbles, one live progress line, and short answers with the details on the card.
  - Apply a proposal with ⌘/Ctrl+Enter; Enter always sends your message.
  🐛 Fixed
  - Pressing Enter on a follow-up could apply the pending proposal instead of sending it.
  - The agent could claim it couldn't see your history while CoolDesk's local service was restarting.
  - The agent's "Create" button kept offering to set up the same project.
  - opencode's "> build · model" header showed up inside answers.
