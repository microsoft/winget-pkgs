ReleaseNotes: |-
  ## What shipped

  **History navigation moved into the app header** ([#598](https://github.com/closeio/close-desktop/pull/598), [#597](https://github.com/closeio/close-desktop/pull/597)) — Back, Forward and a History button now sit in the tab strip, next to the tabs, and act on the tab you're looking at. History lists that tab's recent locations, current one first; click one to jump straight there. Keyboard: `⌘[` / `⌘]` as before, and the panel takes arrow keys, `Enter` and `Escape`.
  **Tab titles no longer repeat "Close"** ([#597](https://github.com/closeio/close-desktop/pull/597)) — a chip read `Inbox | Acme Inc | Close` when the window is already Close. Chips, History rows and the window title now show the page and your organization, and a chip shows its loading placeholder instead of a web address while a page arrives.
  Electron 42.5.1 ([#601](https://github.com/closeio/close-desktop/pull/601)), plus dependency updates.

