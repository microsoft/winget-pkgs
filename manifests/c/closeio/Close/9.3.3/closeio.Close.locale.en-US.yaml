ReleaseNotes: "## What shipped\r\n\r\n• **Spell check works again on Windows** ([#611](https://github.com/closeio/close-desktop/pull/611)) — spell check had been off on Windows since 9.1.0. The app handed Electron an empty language list on every launch, which turns the spell checker off outright, and Edit > Spell Checker Language(s) showed every language unchecked. A profile that never picked a language now falls back to your OS locale, and turning spell check off stays off across restarts. If you deliberately turned it off since 9.1.0 this build re-enables it once — uncheck the last language again and it sticks.\r\n• Security updates ([#612](https://github.com/closeio/close-desktop/pull/612)) — `fast-uri` 3.1.5 → 3.1.7, clearing four high-severity URI parsing advisories (CVE-2026-75899, CVE-2026-75931, CVE-2026-75975, CVE-2026-76172).\r\n\r\nAlso includes the Windows-on-ARM installer fix from 9.3.2 ([#609](https://github.com/closeio/close-desktop/pull/609)) — installers that reported success but left no `Close.exe` behind."
