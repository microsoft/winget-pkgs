ReleaseNotes: |-
  ## What shipped

  • **Windows installer is signed again** ([#605](https://github.com/closeio/close-desktop/pull/605)) — 9.3.0's `Close-Setup-9.3.0.exe` shipped without an Authenticode signature, so Smart App Control and similar enterprise policies blocked it. 9.3.1 is the same app as 9.3.0 with a signed Windows installer. If 9.3.0 would not install or update on Windows, install this build.
  • Dependency updates for `app-builder-lib` and `builder-util-runtime` ([#603](https://github.com/closeio/close-desktop/pull/603), [#604](https://github.com/closeio/close-desktop/pull/604)).

  Also includes everything from 9.3.0 for anyone who could not install that Windows build：History navigation in the tab strip, shorter tab titles, Electron 42.5.1.
