ShortDescription: AI teammates with their own computers that remember how you work and ask before anything risky.
Description: >-
  Casama gives you AI teammates, called bots, that do real work on computers of their own:
  they browse, fill in forms, write files and run code on a sandboxed Linux machine you can
  watch and take over, and they stop for your approval before risky steps such as sending,
  paying or deleting. Casama's apps, computerd, SDKs, CLI and MCP server are open source
  (AGPL-3.0 and Apache-2.0), and so is everything that decides what a bot may do: the safety
  rules, the bot's computer and its network guard. Casama Cloud runs on the Casama Engine,
  which is not open source. Use Casama Cloud, or self-host for free for personal use,
  including with local models through Ollama.
