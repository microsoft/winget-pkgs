ReleaseNotes: |-
  Happy Halloween! 🎃 Should be nothing spooky about this release though (hopefully).
  Mainly releasing this to get some bug fixes out, particularly to address problems running on older versions of Windows. There's still also a bunch of new features though, from solid bar support in styling, initial Intel GPU support in Linux, more configuration for disk widgets, and swap process columns. The Windows MSI has also been improved, and we now build GNU targets for Windows ARM. Thanks to all that contributed to this release!
  Features
  - #2239: Initial Intel GPU support for Linux to get process GPU usage.
  - #2245: Support solid bars using block and square characters via styles.widgets.bar_type.
  - #2236: Add configurable binary disk capacity units for disk widget usage (thanks @pederbe!).
  - #2251: Add configurable binary disk capacity units for disk widget I/O.
  - #2224: Add swap column for processes for Linux (thanks @abuhurayraniloy!).
  Changes
  - #2260: Enable scrollbars by default.
  - #2266: Show decimal places for disk usage info.
  Bug Fixes
  - #2225: Fix waking up NVIDIA GPUs when getting stats on Linux.
  - #2261: Fix scrollbars not drawing when height of bar was 2 or less.
  - #2279: Fix an abort (SIGABRT) if the terminal is gone when exiting (thanks @NavpreetSSidhu!).
  - #2284: Fix bracketed paste not being supported on Windows 7/8 causing btm to panic on startup.
  - #2293: Fix older Windows compatibility by disabling the underline feature in ratatui.
  Other
  - #2227: Add missing documentation around disk I/O graph (thanks @NavpreetSSidhu!).
  - #2233: Add user-level installation scope for Windows MSI installer.
  - #2237: Use WixUI_Advanced for better installation scope selection in Windows MSI installer.
  - #2290: Add Windows aarch64-gnullvm build target.
  New Contributors
  - @pederbe made their first contribution in #2236
  - @abuhurayraniloy made their first contribution in #2224
  - @NavpreetSSidhu made their first contribution in #2279
  Full Changelog: 0.14.9...0.15.0
