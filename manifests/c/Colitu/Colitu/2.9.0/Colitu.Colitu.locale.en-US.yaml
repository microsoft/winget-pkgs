ShortDescription: Open-source VPN built for restricted and unstable networks.
Description: |-
  Colitu VPN is the open-source Windows client of the Colitu VPN service.
  It picks the transport that actually works on the current network (Hysteria2 on a bundled sing-box core; VLESS Reality, VLESS XHTTP, Trojan and Shadowsocks on Xray) and falls back automatically when one is blocked.
  Includes a kill switch built on the Windows Filtering Platform, system proxy and TUN modes, and a single window for sign-in, locations, plans and devices.
  A Colitu account is required to connect.
