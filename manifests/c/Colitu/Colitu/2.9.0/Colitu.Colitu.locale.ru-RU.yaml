ShortDescription: VPN с открытым исходным кодом для сетей с ограничениями и нестабильным соединением.
Description: |-
  Colitu VPN — клиент сервиса Colitu VPN для Windows с открытым исходным кодом.
  Приложение само выбирает протокол, который действительно работает в текущей сети (Hysteria2 на встроенном ядре sing-box; VLESS Reality, VLESS XHTTP, Trojan и Shadowsocks на Xray), и автоматически переключается, если один из них заблокирован.
  Есть kill switch на базе Windows Filtering Platform, режимы системного прокси и TUN, а также единое окно для входа, локаций, тарифов и устройств.
  Для подключения нужен аккаунт Colitu.
