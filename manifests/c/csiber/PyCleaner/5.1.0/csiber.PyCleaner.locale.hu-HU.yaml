License: MIT
ShortDescription: Ingyenes, nyílt forráskódú rendszertisztító és karbantartó Windowsra, magyar és angol felülettel.
Description: |-
  A PyCleaner törli az ideiglenes fájlokat és gyorsítótárakat, megkeresi a nagy és duplikált fájlokat (Lomtárba helyezi őket),
  a Feladatkezelővel azonos módon kezeli az indítópultot, wingettel frissíti a telepített programokat, eltávolítja a programokat
  és felkínálja a maradékaikat, .reg mentés után javítja az egyértelműen elavult registry-bejegyzéseket, és nyomtatható
  gépállapot-riportot készít. Natív ablak (WebView2), adatgyűjtés nélkül.
