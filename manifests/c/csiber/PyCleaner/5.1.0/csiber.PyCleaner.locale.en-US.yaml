ShortDescription: Free, open-source system cleanup and maintenance tool for Windows with a Hungarian and English interface.
Description: |-
  PyCleaner cleans temporary files and caches (browser caches, thumbnails, crash dumps, Windows Update and shader caches),
  finds large and duplicate files (moved to the Recycle Bin), manages startup programs the same way Task Manager does,
  updates installed apps via winget, uninstalls programs and offers their leftovers, fixes clearly orphaned registry entries
  after a .reg backup, and runs a PC health check-up with a printable report. Native window (WebView2), no telemetry.
