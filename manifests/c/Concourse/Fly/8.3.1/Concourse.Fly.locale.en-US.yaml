ReleaseNotes: |-
  ## What's Changed

  ### 🐞 Bug Fixes
  • worker：keep in-flight overlay dirs during orphan sweep by @ShravanthReddy in #9695
  • Align GetResourceVersion behaviour with ListResourceVersion's by @taylorsilva in https://github.com/concourse/concourse/pull/9729
  • Remove parent-dir references from paths provided to pipeline steps by @taylorsilva in https://github.com/concourse/concourse/pull/9735
  • fix：Vault URL validation scheme broken with placeholder by @Kump3r in #9714
  • fix：baggageclaim: fix overlay driver stacking mounts on worker restart by @Kump3r in #9723

  ### 🛠️ Misc. Changes
  • Update Go to 1.27.1 by @alicul in https://github.com/concourse/concourse/pull/9730
  • upgrade golang.org/x/crypto to v0.56.0 [security] by @alicul in #9702
  • Revert workarounds for Go bugs by @alicul in #9703
  • fix baggageclaim tests on windows by @taylorsilva in #9709
  • Creds interface refactoring by @taylorsilva in https://github.com/concourse/concourse/pull/9731
  • update module github.com/containerd/containerd/v2 to v2.3.5 [security] in #9710
  • update module google.golang.org/grpc to v1.83.1 [security] in #9697

