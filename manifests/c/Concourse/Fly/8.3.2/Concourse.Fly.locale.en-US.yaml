ReleaseNotes: |-
  ## What's Changed

  This release is in response to the compromised eMudhra CA certs. All container images for the bundled resource-types have been updated with the latest OS packages. All Go binaries we ship have been compiled with Go 1.27.3. As far as we can currently tell, all compromised CA certs have been removed from our published artifacts. If you find we have missed something please post in the [Discussion Forum](https://github.com/orgs/concourse/discussions/categories/general) or email `security@concourse-ci.org`.

  This release contains no code changes to the `concourse` or `fly` binaries.

