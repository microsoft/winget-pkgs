ShortDescription: Keeps Microsoft Teams from marking you Away during short breaks.
Description: |-
  KeepMeOn is a small tray app that keeps your Microsoft Teams status green while you step away for a moment.
  It steps in only after 2 minutes without input and resets the idle timer with a neutral input event: it never moves the mouse, types or clicks.
  It pauses when the screen is locked, when the computer sleeps, outside work hours and during the lunch break.
