PackageIdentifier: Clearsoft.EasySQL
PackageVersion: 0.1.3
PackageLocale: pt-BR
Publisher: Clearsoft
PackageName: EasySQL
License: Proprietário
ShortDescription: Cliente de banco de dados nativo e multiplataforma, feito com Rust e Iced
Description: O EasySQL é um cliente de banco de dados nativo e multiplataforma, feito com Rust e Iced. Ele conecta a múltiplos engines de banco de dados e oferece um explorador de schema, um editor SQL com múltiplas abas, uma grade de dados paginada, edição inline e alterações visuais de schema.
InstallationNotes: |
  Requer Windows 10 versão 1809 (build 17763) ou superior. O MSI instala em Program Files e requer elevação.
