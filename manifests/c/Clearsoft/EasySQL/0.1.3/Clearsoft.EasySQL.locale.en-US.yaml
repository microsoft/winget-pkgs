ShortDescription: Native, cross-platform database client built with Rust and Iced
Description: EasySQL is a native, cross-platform database client built with Rust and Iced. It connects to multiple database engines and provides a schema explorer, a multi-tab SQL editor, a paginated data grid, inline data editing and visual schema changes.
ReleaseNotes: |
  Maintenance release that turns the Linux packages into upgradeable repositories: stable .deb packages are now served by an APT repository and stable RPMs by a DNF repository, so apt upgrade and dnf upgrade find new versions. It also completes the connection workflow — the database picker lists the server's real PostgreSQL databases, mixed-case tables open again, a saved profile can name a default database and the Connection Manager tests the form before saving — ships the new EasySQL brand kit and restores the release identity of the Linux build, which had shipped without product analytics, error telemetry and the update check.
ReleaseNotesUrl: https://easysql.net/en/download
InstallationNotes: |
  Requires Windows 10 version 1809 (build 17763) or later. The MSI installs to Program Files and requires elevation.
