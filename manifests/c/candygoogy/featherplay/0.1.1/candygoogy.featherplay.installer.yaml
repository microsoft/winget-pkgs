# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
# The per-user Inno Setup installer (packaging/windows/featherplay.iss): winget installs,
# upgrades and uninstalls through it, so the Apps list entry and the uninstaller stay one.
# Settings live in %APPDATA%\featherplay, the cache and sidecars in %LOCALAPPDATA%\featherplay.
# The exe links the Visual C++ runtime (MSVCP140.dll, VCRUNTIME140.dll, VCRUNTIME140_1.dll,
# through Skia), which a clean Windows doesn't have: each installer depends on its runtime.
PackageIdentifier: candygoogy.featherplay
PackageVersion: 0.1.1
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: 2026-11-04
AppsAndFeaturesEntries:
  - DisplayName: featherplay
    Publisher: candygoogy
    ProductCode: "{F2D85B2D-D1BB-4404-AA87-B6D35D0F5283}_is1"
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/candygoogy/featherplay/releases/download/v0.1.1/featherplay-setup-0.1.1.exe
    InstallerSha256: EB87CA0FA32275958D46F7EEDC95B27F923CCFFFD7B0BC2C72828BD6B758DBBD
    ProductCode: "{F2D85B2D-D1BB-4404-AA87-B6D35D0F5283}_is1"
    Dependencies:
      PackageDependencies:
        - PackageIdentifier: Microsoft.VCRedist.2015+.x64
  - Architecture: arm64
