ShortDescription: A fast, lightweight desktop player for YouTube Music.
Description: |-
  featherplay is a native Windows player for YouTube Music, written in Rust. It plays your library,
  playlists, search results and radio, audio only, and keeps Last.fm and ListenBrainz scrobbling,
  media keys and taskbar controls, SponsorBlock (skips non-music segments) and Discord status.
  featherplay is not affiliated with Google or YouTube.
