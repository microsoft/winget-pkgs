ReleaseNotes: |-
  - Traitement de texte : en vue Page, le texte ne déborde plus dans la marge du bas ni entre deux feuilles après un collage ; le PDF a les mêmes pages que l’écran.
  - Un document Word vierge s’ouvre prêt à écrire : le curseur est dans la page et Ctrl+V colle tout de suite, sans licence.
  - Coller depuis Word : signets, sommaire et commentaires ne laissent plus de faux liens bleus ni de notes parasites dans le document.
  - Dans le PDF, les tabulations, les suites d’espaces et la largeur des colonnes d’un tableau sont celles de l’écran.
  - Plus de feuille vide en trop quand un document finit par un champ de signature ou une image tout en bas d’une page.
  - Le numéro de page de la barre d’état est juste quand le curseur est dans un paragraphe vide.
