ReleaseNotes: |-
  - Mesurer sur la page : distance, périmètre, aire et angle, à l’échelle du plan ; le pointeur s’accroche aux sommets du dessin (Ctrl+Maj+M).
  - L’échelle se règle sur une cote connue ; les mesures s’inscrivent dans le document ou s’exportent en tableau (CSV).
  - Lire à voix haute : la voix de l’ordinateur lit le document, surligne le mot lu et peut partir de l’endroit cliqué (Ctrl+Maj+L).
  - Liste des commentaires : toutes les annotations du document, page par page, avec recherche et export en tableau.
  - Rechercher un texte dans tous les PDF d’un dossier, puis ouvrir le résultat à la bonne page.
  - Imprimer plusieurs pages par feuille, en livret ou en affiche ; comparer deux versions côte à côte.
  - Fenêtre étroite : la barre du haut reste sur une ligne à la souris. Écran tactile : poignées plus larges. Onglet Formulaires : « Formulaire en ligne ».
  - Corrections : « Presse-papiers vers PDF » dans l’application ; un PDF suivi de données parasites ne fige plus Protéger, Diviser ni le traitement par lot.
