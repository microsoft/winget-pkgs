ReleaseNotes: |-
  - Nouveau menu des outils en cinq sections, avec deux formules de licence : Standard et Pro.
  - Nouveaux outils : nettoyer le document, accessibilité, en-têtes et pieds de page, tampon, modifier les images, signer avec un certificat.
  - Ajouter du texte : choisissez la police, le gras et l’italique.
  - PDF abîmés ou piégés : réparés ou refusés avec un message clair, sans bloquer l’application.
  - Raccourcis clavier fiables (AZERTY, QWERTZ, Dvorak, AltGr, méthodes de saisie) ; Enregistrer et Imprimer ne se lancent plus en double.
  - Traitement de texte : casse corrigée, suppression de colonne sans perdre le brouillon, import et export Word plus fiables.
