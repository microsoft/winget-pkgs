ReleaseNotes: |-
  - Nouveau traitement de texte : styles, polices, couleurs, listes, tableaux, images, liens, en-tête, pied de page et numéros de page, comme dans Word.
  - Enregistrez-le en PDF d’un clic : texte net et sélectionnable, polices incorporées. Le document modifiable voyage avec le PDF.
  - Ouvrez vos documents Word (.docx) et enregistrez au format Word : titres, listes, tableaux, images et mise en page sont conservés.
  - Un document que vous avez créé se modifie gratuitement, même devenu PDF : rouvrez-le dans l’éditeur, ou utilisez « Modifier le texte » sans licence.
  - Mise en page (format, orientation, marges), sauts de page, rechercher et remplacer, statistiques, correcteur orthographique de votre système.
  - Récupération automatique : un document non enregistré survit à une fermeture imprévue.
