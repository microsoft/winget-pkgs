ShortDescription: "Free PDF reader and word processor: read, annotate and fill in PDFs, write documents and save them as PDF or Word, offline."
Description: "Certyneo Reader is a free desktop PDF reader and word processor for Windows that can become your default PDF app. Search, thumbnails, night mode, password-protected files and printing, plus annotation, form filling, redaction, watermarks, Bates numbering and text or table extraction. Its word processor writes documents with styles, fonts, lists, tables, pictures, headers and page numbers, opens and saves Word (.docx) files and exports tagged PDFs. Documents stay on your computer: everything works offline and never uploads the file. Documents you create stay free to edit, even as PDF; editing the text of other PDFs requires an optional annual licence."
