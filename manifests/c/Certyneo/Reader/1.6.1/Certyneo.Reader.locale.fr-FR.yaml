ReleaseNotes: |-
  - Import Word (.docx) : les documents avec beaucoup d’images ne saturent plus la mémoire.
  - Si l’affichage plante à répétition, l’application bascule sur un rendu logiciel et reste utilisable.
  - Démarrage plus fiable : plusieurs plantages rares à l’ouverture ou au nettoyage des fichiers temporaires sont corrigés.
  - PDF abîmés : la lecture échoue proprement au lieu de bloquer l’application.
