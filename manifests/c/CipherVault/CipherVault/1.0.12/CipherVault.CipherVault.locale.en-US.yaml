ShortDescription: Decentralized, zero-knowledge encrypted version control for confidential files
Description: |
  CipherVault provides decentralized, zero-knowledge authenticated and encrypted
  version control for confidential files (.env, credentials, TLS certificates, secrets).
  Featuring ChaCha20-Poly1305 AEAD encryption, branchless constant-time Galois field
  arithmetic, FastCDC content-defined chunk deduplication, multi-operator federated
  storage with Proof-of-Storage challenges, physical YubiKey PIV hardware token touch
  enforcement, P2P operator discovery, out-of-band push approvals, offline emergency
  recovery kits, and Arbitrum One L2 checkpoint anchoring.
