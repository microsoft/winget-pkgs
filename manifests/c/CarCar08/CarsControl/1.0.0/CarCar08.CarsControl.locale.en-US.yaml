ShortDescription: One app to keep a Windows PC up to date, tidy and healthy.
Description: |-
  C.A.R.S. Control brings app updates (winget, Windows Update, Microsoft Store, pip, npm), uninstalls with leftover cleanup,
  startup and right-click menu management, storage analysis, cleanup, privacy switches, health monitoring (sensors, drives,
  crashes, sleep) and file backups into one app. It runs as you; admin work goes through a small helper with one prompt,
  and unattended maintenance never shows an admin prompt while you're away.
