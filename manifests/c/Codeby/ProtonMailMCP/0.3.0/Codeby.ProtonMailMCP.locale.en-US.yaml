ShortDescription: Let Claude read, search and organise your Proton Mail, locally through Proton Mail Bridge
Description: |-
  Proton Mail MCP is an open-source MCP server that connects Claude (Claude Desktop and Claude Code)
  to your Proton Mail through Proton Mail Bridge on your own computer. Claude can list, search and read
  messages, and organise them: mark read or unread, star, move, label and move to Trash.
  It can't send mail or delete anything permanently, reading never marks a message read, and mail
  content is handed to Claude marked as untrusted. The Bridge password is kept in Windows Credential
  Manager and never reaches Claude. Installs per user; a setup wizard finds Bridge and adds the server
  to Claude. Requires a Proton plan that includes Proton Mail Bridge.
  Independent project, not affiliated with Proton AG or Anthropic.
