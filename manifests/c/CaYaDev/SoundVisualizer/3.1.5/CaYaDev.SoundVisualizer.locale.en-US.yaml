ShortDescription: Free, open-source music visualizer and VJ software with a MilkDrop engine, OBS overlay, Spout and RGB lighting.
Description: |-
  CAYADEV Visualizer turns whatever the computer plays (Spotify, YouTube, a DAW, a DJ set, a game) into audio-reactive visuals on one display or many.
  It includes a MilkDrop engine with a preset library and editor, 60 visualizer modes, 43 backgrounds, layers and 40 GPU effects, an OBS browser-source overlay with transparency, Spout output, projection mapping, Windows Dynamic Lighting, OpenRGB and Art-Net, a timeline and clip deck, MIDI and OSC control, and a local MCP server for AI agents.
