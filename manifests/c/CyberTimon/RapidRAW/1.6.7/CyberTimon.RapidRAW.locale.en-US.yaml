  image image
  More Accurate RAW Colors
  RAW colors are now much more accurate, especially under artificial light:
  - Dual-Illuminant Camera Color: Most cameras store two color profiles, one for daylight and one for warm tungsten light. RapidRAW now blends between them based on the white balance of your photo, just like the DNG standard does. Photos taken under tungsten or stage lights no longer get a magenta or purple cast.
  - Gamut Compression: Very saturated colors that the camera can capture but sRGB can't show used to be hard clipped. They are now gently compressed instead, so strong stage lights and neon signs no longer turn into noisy blotches.
  Rewritten Noise Reduction & Sharpening
  I rewrote the manual noise reduction and sharpening in the main shader, together with the color noise reduction and sharpening that run when a RAW file is first loaded. Noise is now removed more cleanly while fine details stay crisp, and curved edges no longer show jagged artifacts.
