ReleaseNotes: |-
  Upgraded to Chromium 150.0.7871.250
  Continued support for Windows 7, Manifest V2 extensions, and GDI rendering
  Added "Quick URL" feature to keyboard shortcut settings
  Added automatic translation of selected text
  Added support for compact UI
  Added an option to disable extension updates
  Added support for switching tabs in most recently used order (Alt+J / Alt+Shift+J)
  Added support for closing the image search side panel with a right-click
  Added a search box to multi-column bookmarks
  Added support for using custom text as icons for popular websites
  [Bug Fix] Fixed Super Drag not working on ChatGPT and other websites
  [Bug Fix] Fixed the screenshot tool failing to capture certain windows
  [Bug Fix] Fixed websites being unable to detect cameras
  [Bug Fix] Fixed incorrect rendering of system buttons when using vertical tabs
  [Bug Fix] Fixed multi-column bookmark width occasionally being reset
