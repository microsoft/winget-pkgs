PackageIdentifier: cuteyuchen.ProjectManager
PackageVersion: 1.6.2
PackageLocale: en-US
ShortDescription: A modern cross-platform project management tool.
Description: |-
  Project Manager combines project execution, Git management, Node version management, project file organisation, and system integration.

  Core Capabilities

  1. Project Management & Command Execution
  - Unified management of multiple frontend or general-purpose projects
  - Supports single or bulk project addition, as well as drag-and-drop folder import
  - Both bulk and manual imports automatically scan for sub-projects, creating drillable multi-level project workspaces
  - When a project contains sub-projects, the list displays an entry point to the sibling parent project; parent and sub-projects utilize their own independent commands, Git, environment, files, and memo data
  - Parent-child drill-down features directional animations and automatically restores previous browsing and scroll positions upon return
  - Sub-projects display Git status only if their own directory is a Git repository root, preventing inheritance from parent repositories
  - Automatically identifies package.json scripts and supports custom commands
  - Identifies Maven / Gradle Java projects and automatically provides build, run, and test commands
  - Sub-projects support independent drag-and-drop sorting, pinning, and favorites; running statuses aggregate to the parent project
  - One-click access to projects via editor, terminal, or file explorer
  - Unified Light / Dark theme system with consistent styling across the main workbench, settings, Git, and file management areas
  - Supports custom local images as global backgrounds with adjustable opacity
  - Command logs support continuous output and automatically scroll to the bottom in high-frequency logging scenarios
  - Running commands can be stopped by clicking again, with pulse animations to distinguish running states
  - Smart Sorting: Projects are automatically arranged by usage frequency, with new projects prioritized
  The Project Overview provides filtering dimensions including groups, tags, favorites, pins, recently used, running status, Git changes, health anomalies, and missing paths, with support for saving common views and startup groups.
  Parent projects can be expanded into independent multi-level workspaces. Sub-projects use their own commands, Git, Node environments, files, and memo data, restoring the previous view when returning to the upper level.
  The command panel automatically identifies project scripts and built-in dependency installation commands, ideal for unified dev, build, lint, and test tasks.

  2. Git Management
  - Built-in Git GUI supporting status, diff, commit, history, branches, remotes, and more
  - Supports file-level and hunk-level stage / unstage / discard
  - File status supports Ctrl+Click for multi-selection and Shift+Click for range selection to bulk stage / unstage / discard
  - Automatically stages all changes before committing if no files are staged; supports amend and undo last commit
  - Disables commits during conflicts and provides continue / abort operations during active merges
  - The toolbar intelligently highlights Push / Pull based on ahead / behind status, with support for pull strategies
  - Commit history supports search filtering; right-click to copy, create branch, cherry-pick, revert, or reset
  - Centralized Repository Hub for managing stashes, tags, remotes, and branches
  - Supports side-by-side or inline diff views
  - Supports viewing commit history, file changes, and hunk rollback
  - Git Diff selection states are isolated by project, preventing diff content from leaking between projects
  - Multi-column Git workspace layouts support drag-and-drop adjustments, saved as percentages to adapt to window resizing

  3. Project Memos & File Management
  - Each project can maintain its own Markdown memo
  - Supports Edit / Preview / Split-screen modes
  - Can link frequently used files or folders, with quick previews for images and text
  - Files and memos reside in the same workspace as commands and Git, automatically switching to the corresponding data when changing projects or sub-projects

  4. Node Version Management
  - Visually manage Node.js versions within NVM
  - Support for installing, uninstalling, and switching versions
  - Support for setting the system default Node version
  - Detects existing system Node versions or allows manual addition of custom Node executable paths

  5. Port Management
  The desktop version adds port management capabilities to troubleshoot local development port conflicts.
  - View currently occupied TCP / UDP ports
  - View PID, process name, program path, and command line for each port
  - Support for terminating programs occupying ports by process
  Note:
  - Port management is currently a desktop-only feature
  - Not available in uTools / ZTools plugin environments

  6. AI Commit Message Generation
  - Automatically generates commit messages based on staged diffs
  - Supports OpenAI-compatible APIs
  - Configurable Base URL, API Key, model, and prompt templates
  - Supports multi-model channels or multi-channel fallback, automatically trying backup slots if a request fails
  - Follows the Conventional Commits style by default
  Demonstration configurations such as service addresses, models, and keys in screenshots have been hidden.

  7. System Integration
  - Supports multiple editor configurations; editors can be specified per project
  - Automatically detects system terminals and supports custom terminal paths
  - Supports system capabilities like tray icons, exit behavior, auto-start, and context menus
  - Desktop project data is saved in the system user data directory, featuring automatic migration of legacy data and atomic write protection
  - Desktop version uses a signature-verified native updater, automatically matching Windows, macOS, Ubuntu deb, and AppImage packages; downloads run in the background with protection for unsaved data before installation
  - Supports configurable shortcuts for focused search, new project, refresh project, and Ctrl+1~5 side menu navigation
  - Settings page provides a fixed navigation sidebar that jumps to sections and highlights automatically during scrolling
  - Provides settings import/export with one-click application of all current or imported data for easy migration and backup
