ShortDescription: WebAssembly Micro Runtime — interpreter (wamr) and AOT compiler (wamrc).
Description: |-
  WebAssembly Micro Runtime distribution with two portable commands:
    - wamr  — stack-based interpreter that decodes and runs a .wasm binary.
    - wamrc — AOT (ahead-of-time) compiler that lowers a .wasm module to native code.
  A fork of bytecodealliance/wasm-micro-runtime ported from C to Zig and maintained with AI assistance.
Moniker: wamr
Tags:
- aot
- compiler
- interpreter
- runtime
- wasm
- webassembly
- zig
ReleaseNotes: |-
  Highlights
  - Arithmetic correctness: fixes unsigned constant division/remainder and decimal-output corruption.
  - Reliable AOT cancellation: covers function entries, recursive calls, and loop back-edges, while preventing lost cancellation requests during concurrent execution.
  - Better ARM diagnostics: exact frame-origin attribution and paired baseline/target profiling captures.
  - Nine platform packages: signed Windows binaries, checksums, SBOMs, and build provenance.
  Upgrade note: Recompile existing .cwasm artifacts and regenerate compiler caches. This is a development prerelease.
  Full release notes and known limitations
  Install:
  ghr install cataggar/wamr@v3.0.0-dev.14
  See INSTALL.md for more options.
