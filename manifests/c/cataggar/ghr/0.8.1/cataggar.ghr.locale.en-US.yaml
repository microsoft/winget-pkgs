ReleaseNotes: |-
  A toolkit for GitHub releases.
  Highlights
  - Executable symlink aliases (#206): ghr install now exposes archive-provided commands such as llvm-readelf and llvm-strip, preserving their command names and original relative symlinks. Aliases work with --bin, command ownership, transactional replacement, and uninstall. Discovery stays within the extracted package, skips absolute, escaping, broken, or cyclic links, and never searches symlinked directories recursively.
