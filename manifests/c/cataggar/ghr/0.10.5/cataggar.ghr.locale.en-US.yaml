ReleaseNotes: |-
  A toolkit for GitHub releases.
  Highlights
  - Windows .cmd archive command discovery and shimming (#267): Discovers .cmd entry points alongside .exe binaries in extracted Windows archives (such as npm.cmd and npx.cmd next to node.exe) with .exe-first BFS level selection, .cmd-only fallback, and PATHEXT .exe-over-.cmd deduplication; publishes .cmd commands via hardened native PE shims (CVE-2024-24576 batch argument escaping, batch-target character guards, non-inherited SetConsoleCtrlHandler) and extends WSL ghr link / ghr unlink to reconcile "script" bash wrappers.
  - Linux host-libc detection, symmetric Linux scoring, and SHASUMS256.txt verification (#266, #268): Lazily detects and memoizes the runtime Linux host C library (gnu vs musl) via psABI dynamic loader paths (gcompat-aware, ELF PT_INTERP tie-break) so static linux-*-musl ghr builds select native glibc assets on glibc hosts without extra syscalls on unambiguous releases; symmetrizes Linux libc, -profile/-baseline, .deb, and foreign-architecture scoring; verifies SHASUMS256.txt/SHASUMS512.txt checksum files; and incorporates Linux host_libc into ghr install --print-cache-key and actions/download cache keys.
  Full changelog: v0.10.4...v0.10.5
  Install
  Linux and macOS:
  curl -fsSL https://raw.githubusercontent.com/cataggar/ghr/main/install.sh | GHR_VERSION=v0.10.5 sh
  Windows (PowerShell):
  $env:GHR_VERSION = 'v0.10.5'; iwr -useb https://raw.githubusercontent.com/cataggar/ghr/main/install.ps1 | iex
