ReleaseNotes: |-
  A toolkit for GitHub releases.
  Highlights
  - Reinstall-ready ghr list output (#228): ghr list now defaults to printing shell-ready ghr install commands that preserve each tool's stored source configuration, pinned tag, and install options. Use --tags for compact reinstall arguments, --ids for install IDs, --full for the detailed report, and --json for structured output.
  - Minisign key generation and repository provisioning (#216, #217): ghr minisign generate creates a Minisign keypair in-process (backed by cataggar/minizign) and provisions MINISIGN_SECRET_KEY in GitHub Actions, with owner-only local file permissions and overwrite protection (--force to replace existing remote secrets).
  - Unkeyed installs and downloads of Minisign-signed releases (#210): ghr install and ghr download now proceed when a release publishes .minisig sidecars but no Minisign public key is supplied, noting that Minisign was not verified while keeping all other verification checks active and failing closed whenever a key is provided.
  - Improved documentation site (#218, #221, #222, #223, #229): the documentation at cataggar.github.io/ghr has been refreshed with a streamlined Quick start guide, shared sidebar navigation, and copyable command blocks.
  - Zig 0.17.0 upgrade and Windows publish retries (#208, #212): ghr is now built with official Zig 0.17.0 (Linux 5.10+, macOS 15.0+, Windows 10+) and automatically retries transient Windows AccessDenied/FileBusy errors during unit publication and rollback.
  Full changelog: v0.8.1...v0.9.0
  Install
  Linux and macOS:
  curl -fsSL https://raw.githubusercontent.com/cataggar/ghr/main/install.sh | GHR_VERSION=v0.9.0 sh
  Windows (PowerShell):
  $env:GHR_VERSION = 'v0.9.0'; iwr -useb https://raw.githubusercontent.com/cataggar/ghr/main/install.ps1 | iex
  See Installation for package managers and uninstall instructions.
