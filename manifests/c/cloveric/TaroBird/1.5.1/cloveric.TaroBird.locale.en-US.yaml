ShortDescription: Bring the agent CLIs on your computer into one self-hosted chat workspace.
Description: TaroBird is a self-hosted workspace for AI agents. It connects the command-line agents already running on your computer or server, such as Codex, Claude Code and DeepSeek, to one conversation interface, so you can work with several agents side by side, continue a computer session from your phone, group bots into workflows and let them message each other. Computers join one private network, and the same source revision builds the desktop, mobile and standalone host.
