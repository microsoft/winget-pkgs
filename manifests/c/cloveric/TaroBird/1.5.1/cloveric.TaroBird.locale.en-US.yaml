ReleaseNotes: |-
  TaroBird 1.5.1
  A maintenance release focused on Bot communication, message dates, and Android distribution and display reliability.
  Changes
  - Simplified cross-host Bot message permissions with a checklist and clearer sender computer and Bot labels.
  - Internal Bot-to-Bot clarification uses ordinary messages instead of human question cards.
  - Older messages show their date, and date labels refresh after local midnight or when returning to the App.
  - Improved Android system-bar contrast and safe-area handling across startup, theme changes, rotation and keyboard transitions.
  - Removed an unused local-notifications plugin while retaining the existing push-notification integration.
  - Added the Google Play distribution policy: updates are managed by Play, APK installation actions are unavailable, and normal attachment saving and sharing remain available. The GitHub APK retains its in-app updater and installer behavior.
  - Corrected Claude stop-confirmation regression tests to acknowledge the existing confirmation dialog. The stop protocol is unchanged.
  Compatibility
  App and standalone Host / CLI use 1.5.1 from the same source revision. Android APK and Play AAB use version code 2026110415. Platform updater compatibility entries remain available for installed clients. No Host schema or communication-protocol migration is included.
  Windows native acceptance remains owner-deferred; package, signature and privacy verification are required. Emulator/simulator evidence does not establish physical-device or live FCM/APNs delivery acceptance. Android R8 optimization remains scheduled for a later release.
  On Android, keep Android System WebView updated. An old WebView 113 environment rejected pairing links during validation; this pre-existing compatibility limitation is unchanged by 1.5.1.
  Source: 352a6c8ae25080580cbf758c721da76f662492b8.
