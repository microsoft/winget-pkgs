ShortDescription: 把电脑上的命令行 AI 智能体接入同一个自托管工作空间。
Description: TaroBird 是一款自托管的 AI 智能体工作空间。它把电脑或服务器上已有的 Codex、Claude Code、DeepSeek 等命令行智能体接入统一的对话界面，让你可以同时与多个智能体协作，并从手机上继续电脑上的会话；还可以把多个 Bot 编组为工作流并让它们互发消息。多台电脑加入同一个私有网络，桌面端、移动端与独立宿主由同一份源码构建。
