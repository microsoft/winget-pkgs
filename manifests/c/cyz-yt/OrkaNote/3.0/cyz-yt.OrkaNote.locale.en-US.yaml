ShortDescription: A Notepad for Windows with tabs that come back, colours for code, Run (F9), macros and a dark theme.
Description: |-
  OrkaNote keeps many files open in tabs, and every tab comes back the next time
  you start it - even the ones you never saved. It colours HTML, CSS, JavaScript,
  JSON, Python, batch files and more, with line numbers, code folding and matching
  brackets. Run (F9) starts Python, PHP, Node.js, Ruby, PowerShell and batch files
  right from the editor. Macros record and replay what you type, Tools sort lines,
  remove duplicates and format JSON, and Find and Replace works with regular
  expressions across all tabs. Light or dark, Windows 11 style.
