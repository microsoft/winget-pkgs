ShortDescription: Keep the PC awake and Slack and Teams active while AI agents run.
Description: |-
  Yolk keeps the machine awake for as long as you need it, with a Windows power request, and keeps Slack and Microsoft Teams from marking you away by resetting the system idle timer with an invisible, zero-distance mouse move at a random point between 30 and 60 seconds of idle.
  It pauses while the screen is locked. Includes a system tray app (YolkApp) and a command-line tool (yolk).
