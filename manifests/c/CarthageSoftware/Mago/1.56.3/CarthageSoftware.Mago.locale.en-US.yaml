  ## 🐛 Bug Fixes

  ### Analyzer

  • **Union method calls**：keeps known return types when a union member lacks the method. (#2474, 001ff0f)

  ### Formatter

  • **Preserved line breaks**：keeps conditions and member chains stable across formatting passes. (#2475, 6d73836)

  ## 🧩 Extension Protocol

  No protocol changes in this release.

