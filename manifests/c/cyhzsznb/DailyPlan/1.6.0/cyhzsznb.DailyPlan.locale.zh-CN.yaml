Description: |-
  每日计划是一款离线优先的学习打卡桌面应用:
  - 循环任务每天自动刷新,临时任务每天清零,连续打卡
  - 日记支持照片,图片存为真实文件永久保存
  - 经验升级系统、成就徽章、年度热力图、周报
  - 番茄钟专注计时、内置 2048 小游戏
  - 数据全部保存在本机,每日自动备份
