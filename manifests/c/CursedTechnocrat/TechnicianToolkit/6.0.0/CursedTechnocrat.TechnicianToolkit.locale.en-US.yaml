ShortDescription: A portable diagnostic and deployment toolkit for Windows technicians.
Description: |-
  More than fifty field tools for Windows technicians — hardware and disk health,
  account and Active Directory audits, network diagnostics, software deployment,
  security posture, backup and migration — in one portable application that
  installs nothing on the machine it runs on.

  PowerShell 7 is hosted inside the executable, so the target machine needs no
  runtime, no modules, and no internet connection. Most tools produce a
  self-contained HTML report suitable for attaching to a ticket.

  The same tools remain runnable as standalone PowerShell 5.1 scripts. The
  application is a second way to run the suite, not a replacement for it.

  Note: the application requests Administrator at launch, because most of what
  it does requires it.
