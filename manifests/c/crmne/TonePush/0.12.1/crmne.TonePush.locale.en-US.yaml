ReleaseNotes: "TonePush 0.12.1 finishes what 0.12.0 started for HX Stomps with impulse responses: after a backup reads its IRs, the pedal no longer stays on \"transferring data\". It also stops a computer with no StompStation PRO from saying one would not open, and lets the AppImage update itself again."
