PackageIdentifier: crmne.Spotifast
PackageVersion: 0.8.0
PackageLocale: zh-CN
ShortDescription: 快速、轻量的原生 Spotify 客户端。
Description: |-
  Spotify，原生且快速。Spotifast 是一款使用 Rust 和 egui 编写的 Spotify 客户端。它通过 librespot 播放音乐。它通常仅占用 100–250 MB 内存，而 Spotify 桌面应用通常占用 600 MB 至 1 GB 以上。它支持 Linux、macOS 和 Windows，启动时间远少于一秒，且没有浏览器引擎。
  播放音乐需要 Spotify Premium 会员。免费账户可以浏览和搜索，但无法通过 Spotifast 在本机或其他设备上播放音乐。
  有关安装、配置、日常使用和连接详情，请参阅 spotifast.rocks。
  spotifast 为主命令，fastpotify 仍可用于现有脚本。设置和凭据存储保留既有路径。AUR 和 Homebrew 软件包现已改用 Spotifast 名称。详见重命名兼容性说明。

  功能介绍
  - 在本机播放音乐。Spotifast 显示为 Spotify Connect 设备。您可以从手机中选择它，或直接在应用内播放音乐。播放支持无缝衔接且最高支持 320 kbps 音质，提供可选的音量均衡和本地磁盘音频缓存。卡顿的 Spotify 连接每次尝试 5 秒后超时，以便播放重试其他端点。自 0.8.0 起，确认的本地进度跳转会丢弃从旧位置排队的音频。解码器、下载和设备缓冲区延迟仍可能存在。打开已排序的播放列表或“已点赞的歌曲”视图时，在播放建立连接期间会利用已加载的元数据立即显示所请求的歌曲（自 0.8.0 起可用）。排序视图从第一行可播放的歌曲开始播放。过滤播放列表或“已点赞的歌曲”会将播放限制在显示的歌曲内并保留重复歌曲；当显示的歌曲均无法播放时，“播放”按钮不可用。
  - 控制其他设备。通过设备选择器将播放转移到音箱、手机或其他电脑，并继续进行控制：播放、暂停、切歌、跳转进度、随机播放、单曲循环、音量调节。长设备列表支持滚动。
  - 发现局域网内的音箱。Spotifast 通过 mDNS 发现 librespot、spotifyd 以及受支持的硬件接收设备。连接后，它们将显示为 Spotify Connect 设备。设备选择器使用响应设备的名称，并自动合并具有相同设备 ID 的条目。
  - 媒体库。浏览播放列表、已点赞的歌曲、已保存的专辑、关注的艺人、播客和已保存的剧集。可过滤、置顶并重新排序侧边栏项目。自 0.8.0 起，在媒体库中双击播放列表可直接开始播放；单击为打开。设置中提供紧凑曲目列表模式，每首歌仅占一行，并在歌曲名、艺人和添加日期之间带有间距分隔符。自 0.8.0 起，可在支持的区域选择按名称、最近播放或保存日期排序。支持沿用 Spotify 的播放列表排序，或保留独立的本地排序。可以在置顶项中移动“已点赞的歌曲”或取消置顶并自定义其本地位置；重启后位置依然保留。启用本地播放时，当 librespot 确认其类型后，Web API 分类为单曲的发行版本会被标记为 EP。“已点赞的歌曲”会从特定账户的元数据缓存中重新打开。较早的行在后台刷新，而点赞与取消点赞操作立即可用。右键点击专辑、艺人和播客卡片可查看其操作菜单（自 0.8.0 起可用）。
  - 搜索歌曲、艺人、专辑、播放列表、播客和剧集，提供最佳匹配结果及按类型分类的视图。右键点击搜索结果和卡片可查看操作菜单。文本框右键菜单提供剪切、复制、粘贴和全选。自 0.8.0 起，个人应用凭据用于搜索曲库目录，而共享访问权限用于查找播放列表。即使其中一部分失败，两部分也能独立显示。
    自 0.8.0 起，在较窄的窗口中，搜索框会避开设备和更新徽章；悬停在图标上即可查看文字标签。
  - 首页包含“特别为你打造”、“最近播放”、你的热门艺人和歌曲，以及个性化推荐。右键点击播放列表快捷方式和展示栏卡片可查看操作菜单。
  - 艺人主页包含热门歌曲、可筛选的音乐作品集和相似艺人。专辑、播放列表和播客页面支持从任意一行开始播放。自 0.8.0 起，专辑和播放列表滚动条映射完整的曲目数量；拖动到未加载区域可直接拉取该区域的内容。作品集和相似艺人卡片同样支持右键菜单（自 0.8.0 起可用）。播放栏中的艺人名称可点击跳转至其主页，包括在 Web API 元数据到达之前的本地播放期间（自 0.8.0 起可用）。
  - 编辑播放列表。创建、重命名、添加描述、重新排序和删除播放列表。自 0.8.0 起，拖动歌曲并悬停在播放列表顶部或底部边缘附近，可自动滚动查看屏幕外的行。拖动到屏幕外的播放列表时，媒体库侧边栏也会随之滚动。在 0.8.0 之后的 main 分支中，可通过“编辑详情”→“更换封面”上传 JPEG 或 PNG 封面。可通过行菜单添加歌曲，或将某一曲目行或当前播放的歌曲拖拽到侧边栏的播放列表中。自 0.8.0 起，拖动选中的多行会按显示顺序复制所有选中内容；预览中会显示数量。将选中内容拖放到“已点赞的歌曲”上可保存选中的所有歌曲。选中项使用半透明中性高亮显示，无行轮廓边框。从播放栏、播放队列或其他列表中将歌曲拖放到已打开的可编辑播放列表两行之间即可将其插入。此操作会添加一个副本，当前播放和队列不受影响。清除播放列表的过滤和排序条件后即可选择插入位置。将其拖放到空播放列表即可添加第一首歌曲。与 Spotify 官方应用一致，好友分享给你的协作播放列表同样支持添加歌曲。可以通过名称过滤“添加到播放列表”菜单，快速定位目标列表。
  - 打开 Spotify 链接。Spotifast 注册了 spotify: 协议链接，因此无论它是否正在运行，从其他应用分享的歌曲、专辑、艺人、播放列表或播客都会在其中打开。open.spotify.com 网址通过浏览器访问，浏览器会将其交给相同的处理器处理。
  - 播放队列可作为侧边栏或独立页面显示；它会标明当前正在播放的来源，并且可以通过行菜单将任何内容添加到其中。“添加到队列”会将歌曲添加至已有排队歌曲之后、当前上下文继续播放之前。选择播放列表中的重复行会按选中顺序将每次出现都加入队列。重复点击只计数一次，通知会显示实际添加的数量。自 0.8.0 起，“最近播放”会将重复播放的短歌曲分开记录，包括连续单曲循环的情况。点击“最近播放”中的每一行即可播放对应歌曲，并在播放开始时立即显示在播放栏中。
  - 自 0.8.0 起，当关闭随机播放并选择原始顺序时，播放列表的“播放”按钮会明确从第一首可用歌曲开始播放。双击某一行即可从该处开始播放；使用播放栏可恢复播放。缓存的播放列表必须与 Spotify 的版本号和歌曲数量一致，其曲目顺序才能决定播放顺序。未完成的播放列表编辑保持可见，且仅在所有写入成功后才会保存到该缓存中。“刷新”会等待未完成的编辑及其在 Spotify 上的版本确认；刷新失败将保留当前行并提供重试选项。在播放列表的“…”菜单中选择“刷新”，可同步在其他 Spotify 客户端所做的更改。大型播放列表检查点通过较小的后台缓冲区读写 JSON，在无需再次完整复制 JSON 的情况下保留了现有的缓存格式。
  - 歌词。在侧边栏或全屏视图中查看同步歌词，或在没有时间戳时查看非同步歌词。
  - 恢复上次播放状态。启动时，上一首歌曲会暂停在停止时的位置。点击播放即可继续，且其他播放控制项在播放开始前均可正常操作。
  - 专辑封面主题色。页面和播放栏会根据当前浏览或收听内容的封面提取并渲染对应色调。可在“设置”中将其关闭。
  - 浅色与深色模式，或跟随系统设置。
  - Winamp 迷你播放器。Ctrl+M 可打开支持经典 .wsz 皮肤的小型播放器，支持以 1x 至 4x 比例渲染。内置频谱分析仪、播放列表和均衡器。在切换视图时，它会保留卷起模式（shade mode），并在桌面环境允许的情况下保留其独立位置。将 Winamp Skin Museum 中的皮肤拖放到任意窗口即可添加。在 Windows 上，自 0.8.0 起，保存在已断开连接显示器上的迷你播放器会在当前桌面的默认位置启动。单击或双击 Windows 系统托盘图标可将窗口调至前台；托盘菜单依然提供“显示或隐藏”选项。在 Windows 上，自 0.8.0 起，可在“设置”或迷你播放器的选项菜单中隐藏其任务栏按钮，同时保留窗口和托盘控制项可用。在 Wayland 上，请使用桌面环境自带的“总在最前”（Keep Above）快捷键或规则；该应用自带的“置顶”控件在 Wayland 下不可用。
  - 均衡器。针对本机播放的音乐提供 Winamp 的 10 频段调节和预设，可在“设置”及皮肤中使用。
  - MilkDrop。基于 projectM 的可视化音乐效果器，在独立窗口和独立进程中运行。支持全屏，并在首次使用时自动下载超过 10,000 个 .milk 预设（约 26 MB）。
  - 键盘优先。所有常用操作都有快捷键（按 Ctrl+/ 或 ? 可查看列表）。
  - 关闭窗口后继续播放。Spotifast 会常驻系统托盘。可通过托盘图标或媒体控制键重新打开它，并通过托盘菜单或 Ctrl+Q 退出程序。您也可以在“设置”中将关闭按钮设为直接退出。在 macOS 上，点击程序坞（Dock）图标也可重新打开窗口。
  - 网络活动可视化。页面在加载时会显示加载动画。顶栏还会显示缓慢或被限流的 Spotify 请求。
  - 单实例运行。在所有平台上，再次启动它都会将现有窗口唤至前台，而不会启动第二个副本。
  - 桌面环境集成。在 Linux 上支持 MPRIS，因此媒体键、Shell 和 playerctl 能像对待其他播放器一样识别 Spotifast。在 macOS 和 Windows 上，可以使用 fastpotify next 及其相关命令通过终端、启动器或全局快捷键控制正在运行的应用。在 Windows 上，自 0.8.0 起，鼠标悬停在任务栏按钮上即可在窗口预览下方使用“上一曲”、“播放/暂停”和“下一曲”。
