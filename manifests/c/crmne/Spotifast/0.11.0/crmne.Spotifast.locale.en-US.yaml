ReleaseNotes: Spotifast 0.11 adds a spectrum or scope visualiser behind the player bar, shows the cover beside full-screen lyrics, animates theme changes, ships eight ready-made palettes, adds a random Winamp skin, and fixes updating on Windows for installations that started as Fastpotify.
