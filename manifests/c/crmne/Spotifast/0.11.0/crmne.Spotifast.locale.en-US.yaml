ShortDescription: A fast, lightweight, native Spotify client
Description: |-
  Spotifast is a small, fast, native Spotify client with no browser engine. Browse your library, search Spotify, manage playlists and the queue, follow synced lyrics, play locally with Spotify Premium, or control other Spotify Connect devices. It also has a Winamp mini player with classic skins, an equalizer, and the MilkDrop visualiser.
  Spotifast was previously called Fastpotify.
  It needs a graphics driver with OpenGL 2.0 or newer.
