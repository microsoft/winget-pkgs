ReleaseNotes: Spotifast 0.13 plays on Google Cast speakers, installs an update only when it carries the release signature, and comes to Windows as a Windows Installer package for x64 and ARM PCs. It also adds Ukrainian, upcoming albums with Pre-save, removing one song from the queue, and many fixes.
