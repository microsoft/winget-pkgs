Description: |-
  Foldora AI organizes files and folders on Windows. Analyze supported files locally,
  review proposed folders and filenames, then approve moves and renames. Date and
  file-type sorting are also available. Analysis does not require uploading files.

  Downloading the installer does not include a license. A separate paid Foldora
  license is required for organization. The website currently advertises USD 14.99
  as a one-time purchase. Internet access is required for activation and periodic
  license validation. AI suggestions may be incorrect; review the plan and keep
  backups. WinGet distribution does not grant a paid license.
