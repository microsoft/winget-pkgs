ReleaseNotes: |-
  opencl: fix three defects of the bin flash-attention prefill path (#32110)
  - opencl: release the WMM flash-attention mask fallback image
  The fallback image is created on every call of the bin flash-attention
  kernel over a sub-buffer of the K cache and was never released, so each
  call kept a K-cache sub-buffer alive. Every call with more than one query
  row takes this path, including each speculative-decoding verify step, so
  the objects pile up and the server slows with every request.
  - opencl: keep q8_0 K/V at head size 512 off the WMM flash-attention kernel
  With q8_0 K/V at DK=512 the bin flash-attention kernel gives wrong results
  whenever V holds different values from K (test-backend-ops FLASH_ATTN_EXT
  hsk=512 q8_0, max error 2.04 on X2-90); f16 K/V at DK=512 is correct. The
  backend's own flash-attention kernels already decline q8_0 at DK=512, so the
  shape is now handled the same way with or without the kernel library.
  - opencl: decline WMM flash-attention prefill beyond the device's 3D image limits
  The WMM path repacks Q/K/V into 3D images; V is n_kv wide, so past the device's
  maximum 3D image width (about 16k tokens of context on X2-90) clCreateImage
  failed and the call asserted. Such shapes now take the regular flash-attention
  path.
