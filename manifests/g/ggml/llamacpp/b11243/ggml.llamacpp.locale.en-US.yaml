ReleaseNotes: |-
  ci : update the oneAPI toolkit to 2026.1 (#29273)
  - ci : update the oneAPI toolkit to 2026.1
  oneDNN is removed from Intel Deep Learning Essentials in 2026.0, so
  staying on the deep-learning-essentials path would silently lose oneDNN
  support when the toolkit version is updated. Switch both the Ubuntu and
  Windows CI jobs to the new unified Intel oneAPI Toolkit installer,
  which still includes oneDNN (until 2027.0) and keeps the component IDs
  unchanged for the Windows install script.
  Measured with the same code (b10899) built with oneAPI 2026.1 vs the
  2025.3-based release build on Arc B570: prompt processing 1331 vs 434
  t/s (3.1x), token generation 50.1 vs 45.3-48.0 t/s.
  Assisted-by: GLM (z-ai/glm-5.3-flash)
  - docs : update the SYCL backend build requirements for oneAPI 2026.1
  With the 2026.0 release the Base toolkit and the HPC toolkit are
  combined into the oneAPI Toolkit, and oneDNN is removed from the Deep
  Learning Essentials package. Update the install instructions, the
  verified release table and the news section accordingly.
  Assisted-by: GLM (z-ai/glm-5.3-flash)
  - ci : update the release workflow for oneAPI 2026.1 and Level Zero SDK 1.33.1
  Align the release package build with the CI build update:
  - oneAPI toolkit 2025.3.3 -> 2026.1 (the unified oneAPI Toolkit)
  - Level Zero SDK 1.28.2 -> 1.33.1, and the Debian package names
    (level-zero/level-zero-devel -> libze1/libze-dev)
  - The Windows DLL copy list for the 2026.1 runtime: sycl9.dll and the
    .6/.3 MKL library versions
  Assisted-by: GLM (z-ai/glm-5.3-flash)
  - ci : remove the removed .spv fallback files from the Windows DLL copy list
  oneAPI 2026.1 no longer ships libsycl-fallback-bfloat16.spv and
  libsycl-native-bfloat16.spv (the OpenCL fallback mechanism changed), so
  the copy step failed with exit 1.
  Assisted-by: GLM (z-ai/glm-5.3-flash)
  - devops : update the oneAPI toolkit image in the Intel Dockerfile
  Assisted-by: GLM (z-ai/glm-5.3-flash)
