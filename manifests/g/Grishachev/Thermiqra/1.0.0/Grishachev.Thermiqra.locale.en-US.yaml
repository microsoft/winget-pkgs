ShortDescription: Hardware monitoring and diagnostics for Windows
Description: Thermiqra is a Windows 10/11 hardware monitoring and diagnostics application. It provides real-time monitoring of CPU, GPU, RAM, storage devices and logical drives, detailed system information, local statistics and history, configurable hardware alerts, storage analysis, hardware change detection, diagnostic reports, CSV export and HTML summary reports. Thermiqra supports English and Russian, multiple interface themes, system tray operation, Windows autostart and built-in automatic updates.
