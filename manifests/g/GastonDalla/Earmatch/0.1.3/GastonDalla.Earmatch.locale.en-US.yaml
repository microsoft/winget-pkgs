ReleaseNotes: |-
  - The phase meter no longer shivers while a track plays. rekordbox scrolls its waveform one point at a time, and Earmatch took the short holds between two points for a paused deck, so the meter stepped back and then jumped forward several times a second. A deck now counts as paused after a tenth of a second without moving, on Mac and Windows.
