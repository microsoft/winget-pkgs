PackageIdentifier: GastonDalla.Earmatch
PackageVersion: 0.1.4
PackageLocale: es-ES
ShortDescription: Practica beatmatching de oído en rekordbox 7.
Description: |-
  Earmatch se coloca sobre rekordbox 7 y oculta lo que de otro modo igualarías a ojo: los decimales del BPM del jog (o el BPM entero) y las formas de onda apiladas, separadas por deck u ocultas.
  Cuando quieras comprobarlo, añade un medidor de fase al estilo Pioneer (las casillas del CDJ-2000NXS, la línea del NXS2 o el medidor o la forma de onda del CDJ-3000) con contador de compases o cuenta atrás hasta el cue.
  El entrenador de mezclas cronometra cada mezcla y guarda tu historial de práctica, y al mantener pulsada una tecla ves rekordbox sin cambios.
  Earmatch solo lee rekordbox: nunca hace clic, escribe en él ni lo controla. Necesita rekordbox 7 en modo PERFORMANCE con la vista de 2 o 4 decks, y se actualiza solo.
Tags:
- beatmatching
- dj
- mezcla
- medidor-de-fase
- rekordbox
