ReleaseNotes: |-
  - The Split waveform no longer trails rekordbox. It showed each captured frame as it was, so it ran a few milliseconds behind, held still on almost half of the screen refreshes and jumped two points when a capture was missed. Each refresh now moves it to where the deck is when that refresh reaches the screen, on Mac and Windows, including the master deck's waveform in the CDJ-3000 Wave meter.
