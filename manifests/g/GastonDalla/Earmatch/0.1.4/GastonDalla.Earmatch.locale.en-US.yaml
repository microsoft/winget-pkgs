ShortDescription: Practice beatmatching by ear on rekordbox 7.
Description: |-
  Earmatch sits over rekordbox 7 and hides what you would otherwise match by eye: the decimals of the jog BPM (or all of it) and the stacked waveforms, split per deck or hidden.
  When you want a check, it adds a Pioneer-style phase meter (CDJ-2000NXS boxes, the NXS2 line, or the CDJ-3000 meter or waveform) with a bar counter or a cue countdown.
  The mix trainer times every mix and keeps your practice history, and holding a key shows rekordbox unchanged.
  Earmatch only reads rekordbox: it never clicks, types into or controls it. It needs rekordbox 7 in PERFORMANCE mode with a 2Deck or 4Deck layout, and it updates itself.
