ShortDescription: The command line of Atalaia, a status overlay for a handful of servers.
Description: |-
  Asks the Atalaia running on this computer what it sees: every server's
  state, one server's last 24 hours, or a wait until one answers again, as
  text or as JSON, with an exit code a script can read. It checks nothing
  itself and needs Atalaia running, from the Microsoft Store
  (winget install 9NTJKXW116ZZ) or from its page.
