ReleaseNotes: |-
  What's new?
  - update option --encoding=CP437 to retain LF (10) and CR (13) codes in the output #569
  - fix a rare edge case for the --encoding option when internally converting a specified code page or a utf-encoding to UTF-8 #568
  - update option -z (--decompress) for reasonable xz/lzma decoding limits #566
  - update matching mode flags -E, -F, -G, and -P to respect order on the command line to permit overriding (like BSD grep) #562 (see follow-up comments)
  - output an error message when regex matching mode flags are used in a config file, instead of silently ignoring them #562 (see follow-up comments)
