ShortDescription: Small, fast clipboard history for Windows that can replace Win+V.
Description: |-
  clipjournal records text, links, images and copied files, and keeps the history across reboots.
  It has search as you type, pinning, expiry by age and count, a configurable hotkey (including Win+V),
  and skips secrets that password managers mark as such. One small exe, no dependencies.
