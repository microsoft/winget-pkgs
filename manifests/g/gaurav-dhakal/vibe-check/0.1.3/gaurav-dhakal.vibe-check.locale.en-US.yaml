ShortDescription: Dev machine monitor for the terminal - processes, ports, containers and build junk in one live pane
Description: vibe-check is an open-source terminal dashboard for your dev machine. It answers four questions in one 60 FPS pane - what is eating CPU, what holds a port, which dev servers were orphaned, and where the disk went - and lets you act on the answer with one keypress: kill the orphan, purge the node_modules, stop the container. It reads the kernel directly, verifies every number against the OS, and shows a dash instead of an estimate. No telemetry, no self-updater, no admin rights.
