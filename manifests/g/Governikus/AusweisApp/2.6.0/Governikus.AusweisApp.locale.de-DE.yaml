  Entwickler
  - Aktualisierung von Qt auf die Version 6.11.1 (mit Patches für CVE-2026-76151 und CVE-2026-78253).
  - Aktualisierung von OpenSSL auf die Version 4.0.3.
  - Aktualisierung von llhttp auf die Version 9.4.3.
  - Unterstützung der arm64e-Architektur im SDK für iOS/iPadOS.
  - Verbesserte Kompatibilität mit OpenSSL durch Verzicht auf explizite elliptische Kurven bei der Umsetzung von PACE mit Generic Mapping.
