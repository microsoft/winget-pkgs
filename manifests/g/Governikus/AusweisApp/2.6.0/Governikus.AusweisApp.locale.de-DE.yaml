Description: |-
  Die AusweisApp ist eine Software, die Sie auf Ihrem Smartphone, Computer oder Tablet installieren, um
  IhrenPersonalausweis, Ihren elektronischen Aufenthaltstitel oder die eID-Karte auszulesen und sich so
  digital auszuweisen. Darüber hinaus ermöglicht die AusweisApp den verschlüsselten Datenaustausch
  zwischen Ausweis und Online-Dienst, bei dem Sie sich identifizieren möchten.
