ShortDescription: Minimal dynamic island for Windows, focused on controlling your music.
Description: |-
  Notch Isla is a floating pill at the top center of the screen that shows the music playing in any app (Spotify, your browser...) with its cover art, and lets you pause, skip and seek. It hides itself at the top edge when you are not using it.
  It also changes the volume of the playing app with the mouse wheel, lets you pick the audio output of each app and can show synced song lyrics. Native, with no CPU use at rest. The interface is in Spanish.
