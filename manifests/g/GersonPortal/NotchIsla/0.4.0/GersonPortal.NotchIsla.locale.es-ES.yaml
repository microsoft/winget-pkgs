ShortDescription: Isla dinámica minimalista para Windows, enfocada en controlar la música.
Description: |-
  Notch Isla es una píldora flotante arriba al centro de la pantalla que muestra la música que suena en cualquier app (Spotify, el navegador...) con su carátula, y permite pausar, pasar de canción y saltar a un punto de la canción. Se oculta sola en el borde superior cuando no la usas.
  También cambia el volumen de la app que suena con la rueda del mouse, permite elegir la salida de audio de cada app y puede mostrar la letra sincronizada de la canción. Nativa, sin consumir CPU en reposo.
