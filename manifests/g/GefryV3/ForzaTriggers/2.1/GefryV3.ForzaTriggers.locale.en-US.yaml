ShortDescription: DualSense adaptive triggers and HD haptics for Forza Horizon 6 / 5 on PC.
Description: |-
  ForzaTriggers reads Forza Horizon's built-in Data Out UDP telemetry and drives the PS5 DualSense controller: the L2 trigger behaves like a real brake pedal with ABS and a grip-limit "wall", R2 reproduces wheelspin, the rev limiter and gear-shift kicks, and the voice-coil haptic motors play engine character, weight transfer, impacts and landings.
  Works directly over USB (with the free ViGEmBus and HidHide drivers) or through DSX. Single small executable, English and Russian UI.
