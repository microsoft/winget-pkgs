PackageName: Hodometer
PackageUrl: https://github.com/gary23w/Hodometer
License: Proprietary
ShortDescription: Native Windows tray network monitor with per-process traffic and packet inspection.
Description: |-
  Hodometer shows which Windows programs are sending and receiving data and the remote endpoints they contact. It uses Windows ETW providers for per-process traffic, connection events, and an Inspector with process identity, connection statistics, decoded DNS, HTTP, TLS, and QUIC handshake metadata, and per-process pcapng capture.
  The application includes Windows Firewall program blocking, connection-auditing repair, and a permission-controlled localhost JSON socket for automation clients. Administrator privileges are required to run Hodometer. The separately configured Sentinel daemon is available in the project source.
Moniker: hodometer
Tags:
- etw
- firewall
- network
- network-monitor
- packet-capture
- system-tray
ReleaseNotesUrl: https://github.com/gary23w/Hodometer/releases/tag/v1.3.0
InstallationNotes: |-
  Run hodometer to start the tray application; Windows requests administrator approval. Exit Hodometer from its tray menu before upgrading.
  This portable package installs Hodometer.exe. Optional logon-task installation and Sentinel daemon setup are documented in the project README and are not run by this package.
