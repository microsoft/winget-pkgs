ShortDescription: Software de astronomía gratuito para análisis de exoplanetas, mapas estelares y simulaciones orbitales.
Description: |-
  Planetensuche es una aplicación de escritorio gratuita y completa diseñada para astrónomos aficionados, apasionados del espacio e investigadores. Combina una vasta base de datos astronómica con potentes herramientas de visualización, mapas estelares interactivos y simulaciones orbitales realistas.

  Características principales:
  - Base de datos de exoplanetas y estrellas: Catálogos de NASA Exoplanet Archive, Gaia DR3, TESS TOI, Kepler, SIMBAD, estrellas variables y asteroides.
  - Análisis de habitabilidad: Cálculo del Índice de Similitud con la Tierra (ESI) y filtrado por zonas habitables.
  - Visualización de datos: Más de 70 gráficos interactivos (diagramas HR, masas planetarias, radios, análisis de curvas de luz).
  - Mapa estelar interactivo & Simulador orbital: Observa órbitas planetarias reales, crea configuraciones personalizadas y planifica tus observaciones.
  - Extras educativos: Cuestionario de astronomía, formulario de física/astronomía e historia de la búsqueda de exoplanetas.
  - Modo sin conexión: Funciona de forma 100% autónoma junto al telescopio sin necesidad de conexión a Internet.
