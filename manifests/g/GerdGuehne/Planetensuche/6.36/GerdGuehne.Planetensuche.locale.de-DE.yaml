ShortDescription: Umfangreiche, kostenlose Desktop-Anwendung für Astronomie, Exoplaneten-Analyse, Orbit-Simulationen und Sternkarten.
Description: |-
  Planetensuche ist eine umfangreiche, kostenlose Desktop-Anwendung für Hobby-Astronomen, Weltraumbegeisterte und Forscher. Sie kombiniert eine riesige astronomische Datenbank mit leistungsstarken Visualisierungswerkzeugen, interaktiven Sternkarten und realistischen Orbit-Simulationen.

  Hauptfunktionen:
  - Exoplaneten- & Sternen-Datenbank: Kataloge von NASA Exoplanet Archive, Gaia DR3, TESS TOI, Kepler, SIMBAD sowie veränderliche Sterne und Asteroiden.
  - Habitabilitäts-Analyse & ESI: Berechnung des Earth Similarity Index und Filterung nach habitablen Zonen.
  - Datenvisualisierung: Über 70 interaktive Diagramme (HRD, Massen, Radien, Lichtkurven-Analysen).
  - Interaktive Sternkarte & Orbit-Simulator: Beobachtung realistischer Orbits, Beobachtungsplaner und Lichtverschmutzungsmessung.
  - Extras: Astronomie-Quiz, Formelsammlung und Historie der Exoplaneten-Suche.
  - Offline-First: Vollständig offline am Teleskop ohne Internetverbindung lauffähig.
