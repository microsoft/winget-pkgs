ShortDescription: Comprehensive, free desktop application for astronomy, exoplanet analysis, orbital simulations, and sky maps.
Description: |-
  Planetensuche is a comprehensive, free desktop application designed for amateur astronomers, space enthusiasts, and researchers. It integrates vast astronomical databases with powerful visual exploration tools, interactive sky maps, and realistic orbital simulations.

  Core Features:
  - Exoplanet & Stellar Database: Catalogs from NASA Exoplanet Archive, Gaia DR3, TESS TOI, Kepler, SIMBAD, variable stars, and asteroids.
  - Habitability Analysis: Calculates Earth Similarity Index (ESI) and filters by circumstellar habitable zones.
  - Data Visualization: Over 70 interactive charts (HR diagrams, planetary masses, radii, lightcurve transit analysis).
  - Interactive Star Map & Orbit Simulator: Observe realistic planetary orbits, custom configurations, and observing planner tools.
  - Extras: Built-in astronomy quiz, astronomical formula reference, and history of exoplanet research.
  - Offline First: Fully standalone execution at the telescope without requiring an internet connection.
