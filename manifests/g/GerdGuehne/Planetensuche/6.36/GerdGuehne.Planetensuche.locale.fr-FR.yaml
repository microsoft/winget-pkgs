ShortDescription: Logiciel d'astronomie gratuit pour l'analyse d'exoplanètes, cartes du ciel et simulations d'orbites.
Description: |-
  Planetensuche est une application de bureau gratuite et complète conçue pour les astronomes amateurs, les passionnés d'espace et les chercheurs. Elle combine une vaste base de données astronomiques avec des outils de visualisation puissants, des cartes du ciel interactives et des simulations d'orbites réalistes.

  Caractéristiques principales :
  - Base de données d'exoplanètes et d'étoiles : Catalogues du NASA Exoplanet Archive, Gaia DR3, TESS TOI, Kepler, SIMBAD, étoiles variables et astéroïdes.
  - Analyse d'habitabilité : Calcul de l'indice de similitude avec la Terre (ESI) et filtrage par zones habitables.
  - Visualisation de données : Plus de 70 graphiques interactifs (diagrammes HR, masses planétaires, rayons, courbes de lumière).
  - Carte du ciel interactive & Simulateur d'orbite : Observez les orbites planétaires réelles, créez des configurations personnalisées et planifiez vos observations.
  - Modules éducatifs : Quiz d'astronomie, formulaire de physique/astronomie et histoire de la recherche d'exoplanètes.
  - Mode Hors-Ligne : Fonctionne de manière 100% autonome au télescope sans connexion Internet.
