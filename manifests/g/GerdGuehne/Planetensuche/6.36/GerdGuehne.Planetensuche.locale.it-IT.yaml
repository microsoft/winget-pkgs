ShortDescription: Software di astronomia gratuito per l'analisi di esopianeti, mappe stellari e simulazioni orbitali.
Description: |-
  Planetensuche è un'applicazione desktop gratuita e completa progettata per astrofili, appassionati dello spazio e ricercatori. Combina un vasto database astronomico con potenti strumenti di visualizzazione, mappe stellari interattive e simulazioni orbitali realistiche.

  Caratteristiche principali:
  - Database di esopianeti e stelle: Cataloghi di NASA Exoplanet Archive, Gaia DR3, TESS TOI, Kepler, SIMBAD, stelle variabili e asteroidi.
  - Analisi di abitabilità: Calcolo dell'Earth Similarity Index (ESI) e filtraggio per zone habitabili.
  - Visualizzazione dati: Oltre 70 grafici interattivi (diagrammi HR, masse planetarie, raggi, analisi delle curve di luce).
  - Mappa stellare interattiva & Simulatore orbitale: Osserva orbite planetarie reali, crea configurazioni personalizzate e pianifica le tue osservazioni.
  - Moduli educativi: Quiz di astronomia, formulario astronomico e storia della ricerca sugli esopianeti.
  - Funzionamento Offline: Esecuzione completamente autonoma al telescopio senza necessità di connessione Internet.
