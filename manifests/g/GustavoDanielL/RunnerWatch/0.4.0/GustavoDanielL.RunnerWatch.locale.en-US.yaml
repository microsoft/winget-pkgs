ShortDescription: Desktop widget for GitHub Actions runs and self-hosted runners.
Description: |-
  RunnerWatch is a small always-on-top widget that shows your GitHub Actions runs: what is running, what is queued and what is stuck.
  It tells a job waiting for a busy self-hosted runner apart from one nobody picks up, shows CPU/RAM of self-hosted runners,
  and notifies on failures, finished deploys, offline runners and jobs that land on paid GitHub-hosted runners.
