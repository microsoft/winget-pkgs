Description: GeT Know-How is a Global eTraining plugin that delivers on-the-go training directly inside Autodesk software, including Revit, AutoCAD, AutoCAD Civil 3D, AutoCAD Plant 3D, Inventor, and Navisworks. Learners receive predictive training suggestions in text, video, audio, and hands-on formats, with content updated alongside Autodesk software releases. Managers can train teams inside project software, share custom company-specific training content, and reduce time spent answering repeat questions.
