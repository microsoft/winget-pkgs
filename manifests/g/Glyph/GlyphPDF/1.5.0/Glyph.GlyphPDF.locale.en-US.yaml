Description: GlyphPDF is an open-source PDF workstation for Windows. It edits, annotates, signs (PAdES B-LT/B-LTA), redacts, OCRs (ROVER ensemble, fully offline), and compresses PDF documents on your machine. No telemetry, no cloud, no subscription.
