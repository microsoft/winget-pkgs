ReleaseNotes: |-
  Gpg4win version 5.1.1 is available since 2026-09-23.
  Changes
  Kleopatra
  Okular/GnuPG-edition
  - Hide finish signing banner on document reload. (T8345)
  Outlook Classic Add-In (GgpOL)
  - Fix S/MIME handling. (T8436, T8439)
  - Fix closing an open smime encrypted msg file creates mail in the inbox. (T8438)
  - Fix Outlook crashes on preview of an S/MIME mail. (T8420)
  - Fix getting the conformance string from libkleopatrarc. Also fixes a crash due C++ runtime error when reading libkleopatrarc. (T8421)
  - Fix problem with MIME attachments w/o a Content-Disposition. (T8411)
  - Fix minor memory leak.
  - Mitigate slowness in switching between mails due to an Outlook regression. (T8418)
  Outlook-New Add-In (GpgOL/Web)
  Engine (GnuPG)
  For changes in the backend see the release info for GnuPG versions from 2.5.22 up to 2.5.24: (T8425,T8320)
