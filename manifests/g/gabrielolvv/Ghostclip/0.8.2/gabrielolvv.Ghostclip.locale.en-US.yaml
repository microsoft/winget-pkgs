ShortDescription: Instant replay for Windows that stays out of your game's way.
Description: |-
  Ghostclip keeps the last minute of your screen and sound and saves it as an MP4 when you press a hotkey (Alt+F10 by default).
  Capture and encoding run on the GPU (NVENC, AMF or QuickSync), with nothing injected into the game.
  It can record only the game's sound, put the microphone and Discord on their own tracks, record whole sessions with bookmarks and take screenshots.
  A library lists clips by game, trims them on the audio waveform and compresses them to fit Discord's upload limit.
