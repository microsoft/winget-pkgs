PackageName: MouseModes
License: MIT
ShortDescription: Um clique troca mouse, energia e Windows entre o modo jogo e o dia a dia.
Description: |-
  O MouseModes é um app de bandeja grátis e de código aberto para Windows 10 e 11 que alterna o mouse e o PC entre dois
  modos: Performance (jogos) e Dia a dia. O Performance deixa o ponteiro 1:1 sem aceleração, o plano de energia em alto
  desempenho e o USB sem suspensão, e pode dar prioridade alta ao jogo, bloquear a tecla Windows, silenciar notificações,
  acalmar os programas em segundo plano e usar uma resolução por jogo. O Dia a dia devolve tudo. Troca sozinho quando um
  jogo da lista abre, por atalho ou por comando, e desfaz tudo quando o jogo fecha. Traz também o Raio-X da partida (quem
  pesou em segundo plano e como estava a rede), medidor de polling rate, teste de clique, teste de mira e DPI, medição do
  DPI real e conversor de sensibilidade. Sem administrador e sem telemetria; atualiza sozinho pelas Releases do GitHub.
