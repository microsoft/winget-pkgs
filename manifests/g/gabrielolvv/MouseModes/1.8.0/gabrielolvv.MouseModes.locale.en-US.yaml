ShortDescription: One click switches your mouse, power and Windows between game mode and daily use.
Description: |-
  MouseModes is a free, open source tray app for Windows 10 and 11 that switches the mouse and the PC between two modes:
  Performance (games) and Daily. Performance sets a 1:1 pointer with acceleration off, a high performance power plan and
  USB without suspend, and can raise the game's priority, block the Windows key, silence notifications, calm background
  programs and set a per-game resolution. Daily brings everything back. It switches automatically when a game from the
  list opens, by hotkey or by command, and undoes it all when the game closes. It also includes a match X-ray (what
  weighed in the background and how the network was), a polling rate meter, a click test, an aim and DPI test, a real DPI
  measurement and a sensitivity converter. No admin rights and no telemetry; it updates itself from GitHub releases.
