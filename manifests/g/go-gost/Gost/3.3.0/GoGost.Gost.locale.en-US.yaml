ShortDescription: GO Simple Tunnel - a simple security tunnel written in Go
Description: >-
  GOST (GO Simple Tunnel) is a simple security tunnel written in Go. It works in
  three modes - forwarding proxy, port forwarding, and reverse proxy/tunnel -
  and supports a wide range of protocols (HTTP/HTTPS/SOCKS4/SOCKS5/Shadowsocks/
  SSH/Relay/QUIC/KCP/TUN and more), with chaining, load balancing, admission and
  bypass rules, traffic sniffing, and recording.
