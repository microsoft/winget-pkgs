ShortDescription: Thumbnails, a Preview pane and a right-click Preview for Illustrator .ai and .ait files and .eps files in Windows Explorer.
Description: |-
  See your Illustrator and EPS files in Windows Explorer: real thumbnails for every .ai, .ait, .eps and .epsf, a working Preview pane, and a right-click Preview window. No Illustrator required, and nothing leaves your PC.
  Illustrator files with PDF content show their first artboard; Illustrator 3 to 8 artwork is drawn from its paths. EPS files show the TIFF, EPSI or XMP preview saved inside them. The Preview pane shows the artwork with its artboard size, artboard count and the app that saved it.
  Illustrator still opens your files; this only adds thumbnails and previews.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
