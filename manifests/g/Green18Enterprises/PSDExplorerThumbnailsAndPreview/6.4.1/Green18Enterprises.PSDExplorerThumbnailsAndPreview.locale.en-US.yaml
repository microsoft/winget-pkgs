ShortDescription: Thumbnails, a Preview pane and a right-click Preview for Photoshop .psd and .psb files in Windows Explorer.
Description: |-
  See your Photoshop files in Windows Explorer: real thumbnails for every .psd and .psb, a working Preview pane, and a right-click Preview window. No Photoshop required, and nothing leaves your PC.
  Thumbnails use the flattened composite Photoshop stores in the file, at every icon size, including large PSB documents. The Preview pane lists dimensions, resolution and print size, color mode and profile, layers and groups, and the app that made the file.
  Photoshop still opens your PSDs; this only adds thumbnails and previews.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
