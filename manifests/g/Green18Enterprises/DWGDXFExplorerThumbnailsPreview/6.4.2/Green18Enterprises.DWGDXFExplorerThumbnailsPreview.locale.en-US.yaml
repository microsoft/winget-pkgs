ShortDescription: Thumbnails, a Preview pane and a right-click Preview for AutoCAD .dwg and .dxf drawings in Windows Explorer.
Description: |-
  See your AutoCAD drawings in Windows Explorer: real thumbnails for every .dwg and .dxf, a working Preview pane, and a right-click Preview window. No AutoCAD required, and nothing leaves your PC.
  DWG files show the preview AutoCAD saves, from R13 through the current AutoCAD 2018 file format. DXF files (ASCII and binary) are drawn from their contents: lines, arcs, polylines, splines, blocks, dimensions, hatches and text. The Preview pane shows the drawing with its format version, units, size and entity, layer and block counts.
  AutoCAD still opens your drawings; this only adds thumbnails and previews.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
