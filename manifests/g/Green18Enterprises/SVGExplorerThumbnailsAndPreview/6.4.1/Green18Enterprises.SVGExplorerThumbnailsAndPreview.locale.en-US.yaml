Description: |-
  SVG thumbnails that look right: text, CSS styles, gradients, filters and compressed .svgz files, drawn the way browsers draw them, with thumbnails and a Preview pane for every SVG in Windows Explorer.
  Rendering uses resvg, an open-source SVG renderer. Scripts never run, nothing is fetched from the internet, and an SVG cannot pull other files from your disk into its thumbnail.
  Your browser, Inkscape or Illustrator still opens .svg files, and PowerToys users keep their settings.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
