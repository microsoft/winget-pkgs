Description: |-
  Explorer Thumbnails and Preview adds real thumbnails, a working Preview pane and a right-click Preview window to Windows Explorer for more than 60 file types Windows leaves blank.
  Covers design files (Photoshop PSD/PSB, SVG, Illustrator AI, EPS, GIMP XCF, Affinity, Clip Studio, Sketch, Adobe XD), HEIC photos, PDFs, WordPerfect documents, eBooks (EPUB, MOBI, AZW3), comic archives (CBZ, CBR, CB7), modern and scientific images (JPEG XL, JPEG 2000, OpenEXR, HDR, DICOM, FITS), game textures (DDS, TGA, KTX2) and video Windows cannot play (FLV, RealMedia, MXF, DivX and more).
  Turn each file type on or off in Settings. Your default apps keep opening your files.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
