ShortDescription: Thumbnails, a Preview pane and a right-click Preview for InDesign .indd documents and .indt templates in Windows Explorer.
Description: |-
  See your InDesign documents in Windows Explorer: real thumbnails for every .indd document and .indt template, a working Preview pane, and a right-click Preview window. No InDesign required, and nothing leaves your PC.
  Thumbnails show the first-page preview InDesign saves with the document. The Preview pane shows the page with the InDesign version, font count and preview size. Documents saved without a preview show a clear placeholder, with the InDesign setting that adds one.
  InDesign still opens your documents; this only adds thumbnails and previews.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
