ShortDescription: Page thumbnails, a Preview pane and a right-click Preview for WordPerfect .wpd documents in Windows Explorer.
Description: |-
  Read WordPerfect documents without opening them: page thumbnails, a Preview pane with the first pages, and a right-click Preview of the whole document for WordPerfect files from version 4.2 to X9. No WordPerfect required, and nothing leaves your PC.
  Fonts, tables, columns, headers and footers, footnotes, pictures and equations are drawn by a built-in WordPerfect reader. The Preview pane shows the page count, WordPerfect version, word count and first line.
  A WPD Converter license also turns on these thumbnails and previews.
  Includes a short free trial; a license key keeps it working after that. Works offline with no account.
