ShortDescription: See and manage your Linux server over SSH, visually. Nothing installed on the server.
Description: |-
  Kubo is a desktop app that connects to your own Linux server over SSH and lets you see and manage it visually:
  live performance, open ports and what is really exposed through the firewall, files, Nginx sites, fail2ban bans,
  systemd services, Docker containers, Redis, apt packages, and services still running on outdated libraries.
  Nothing is installed on the server: Kubo only runs ordinary shell commands over SSH, and every command it sends
  is shown and logged locally. No account, no telemetry, no cloud.
