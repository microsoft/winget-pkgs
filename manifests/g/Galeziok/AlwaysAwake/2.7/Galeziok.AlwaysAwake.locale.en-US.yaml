ShortDescription: Lightweight system tray utility that keeps your Windows PC awake (prevents the screen from turning off or locking).
Description: |-
  AA - Always Awake is a single-file system tray app that keeps the computer awake using the Windows power API and/or a silent F15 key press.
  Features: idle-aware mode, auto-off timer or "until" time, schedule (days and hours), turn on while selected programs run, pause for X minutes, battery pause, global hotkey, portable mode, automatic updates, Polish/English/German UI.
