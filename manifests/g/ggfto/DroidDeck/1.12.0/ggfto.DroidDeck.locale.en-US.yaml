ShortDescription: Turn an Android phone into a Stream Deck for your Windows PC.
Description: |-
  DroidDeck is the Windows side of a phone-as-Stream-Deck setup. It runs in the system tray and
  executes what you tap on the DroidDeck Android app: keyboard shortcuts and macros, opening apps,
  per-app volume and mute, media controls, live CPU/GPU/RAM/disk/network gauges, Discord, OBS Studio,
  Spotify, Twitch, YouTube, Home Assistant, Philips Hue, Elgato Key Light, Tuya smart home, a
  soundboard and Steam games. Buttons are edited
  with drag and drop in the browser, and the phone talks to the PC over the local network with no
  account or cloud. The Android app is downloaded from the same GitHub release.
