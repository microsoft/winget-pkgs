ShortDescription: A persistent, resumable download queue for Windows.
Description: >-
  GrabQueue is a free, ad-free download-queue manager for Windows built on the
  yt-dlp and gallery-dl engines. It adds a persistent queue that survives
  restarts, automatic retries with backoff, live per-item progress, playlist
  expansion, and one-click engine setup — no Python, no PATH configuration.
