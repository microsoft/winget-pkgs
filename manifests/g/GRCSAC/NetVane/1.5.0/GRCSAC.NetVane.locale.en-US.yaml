ReleaseNotes: |-
  Expect findings you have not seen before, on devices that have not changed. NetVane now
  reads the certificate each encrypted service presents - it used to check only which
  protocol versions they would accept - so a device quietly serving a certificate that
  expired a year ago will say so today. And if you have set a device's importance, that
  rating now counts towards your score; if you never set it, your score has not moved.
  Beyond that: a measured map of which of your own devices talk to each other, an in-use
  mark on the ports something is actually using, one list of every certificate and when it
  runs out, and an alert when two of your devices start a conversation they have never had.
  A copied portable folder now brings its history with it.
