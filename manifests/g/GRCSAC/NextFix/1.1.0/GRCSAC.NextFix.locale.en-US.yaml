ShortDescription: Tells you which of an application's vulnerabilities to fix next, and why. Scanners find. NextFix decides.
Description: |-
  NextFix looks at an application and tells you which of its vulnerabilities actually matter,
  in what order, and why. Scanners already find thousands of issues; NextFix works out which
  ones are reachable from an entry point, exposed to an attacker and exploited in the wild,
  and hands both the executive and the engineer a short list with the evidence attached.

  Point it at a Node.js, Python or Go project, or a container image, from the command line
  (`nextfix scan .`), or start the local dashboards with `nextfix serve`. Reports come out as
  JSON, OpenVEX and SARIF for CI gates and GitHub code scanning. It runs entirely on your own
  machine or server; nothing leaves your network.

  Installs per-user into %LOCALAPPDATA%\Programs\NextFix, adds that folder to your PATH and
  needs no administrator rights. Scan history and settings live in %USERPROFILE%\.nextfix.
