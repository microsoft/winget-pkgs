ShortDescription: Internet speed test for PowerToys Command Palette, powered by Measurement Lab (M-Lab)
Description: |-
  NetSpeed is a PowerToys Command Palette extension that measures your Internet connection on the open Measurement Lab (M-Lab) platform.
  It shows download and upload speed (multi-stream MSAK test with ndt7 fallback), idle latency, jitter, latency under load and a bufferbloat grade, with live Mbps while testing and a Copy result command.
  M-Lab publishes test results, including the public IP address, as open data; NetSpeed asks for consent before the first test.
