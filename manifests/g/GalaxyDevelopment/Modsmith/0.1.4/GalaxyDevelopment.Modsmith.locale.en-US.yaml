ShortDescription: A desktop workbench for Minecraft mods and modpacks.
Description: |-
  Modsmith creates Minecraft mod projects from the official templates for the version you pick, builds them with Gradle, keeps isolated test profiles for the client and a dedicated server, and runs the game docked inside its own window.
  It adds mods from Modrinth and CurseForge with their dependencies resolved, offers completion and checks for mod metadata and data pack files, and includes an MCP server so AI assistants can build, launch and inspect the game.
