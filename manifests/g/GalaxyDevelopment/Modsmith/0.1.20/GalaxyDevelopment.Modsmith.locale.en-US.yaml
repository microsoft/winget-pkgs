ShortDescription: A Minecraft development studio for Fabric, NeoForge and Forge mods.
Description: |-
  Modsmith creates Minecraft mod projects from the official Fabric, NeoForge and Forge templates for the version you pick, edits Java and JSON with completion, builds with Gradle, and runs a test client or dedicated server docked inside its own window.
  It adds mods from Modrinth and CurseForge with their dependencies resolved, reloads code and assets into the running game, debugs with breakpoints, and includes an MCP server so AI assistants can build, launch and inspect the game.
