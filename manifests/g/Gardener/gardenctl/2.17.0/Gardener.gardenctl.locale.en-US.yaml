ReleaseNotes: |-
  # [github.com/gardener/gardenctl-v2:v2.17.0]

  ## ✨ New Features
  • `[USER]` Add the `gps` alias to `gardenctl rc` to configure the provider CLI with the targeted shoot’s infrastructure credentials, even when its control plane is selected. This complements `gpc`, which uses the infrastructure credentials of the seed hosting that control plane. by @julestree [[#831](https://github.com/gardener/gardenctl-v2/pull/831)]
  • `[USER]` Support seed targeting via a `seed` named capturing group in targeting patterns. by @petersutter [[#802](https://github.com/gardener/gardenctl-v2/pull/802)]

  ## 🐛 Bug Fixes
  • `[USER]` PowerShell provider environment scripts no longer require a POSIX `printf` executable for revoke hints and access-restriction notifications. by @grolu [[#838](https://github.com/gardener/gardenctl-v2/pull/838)]
