ReleaseNotes: |-
  GitStudio 2.0 is the redesign wave. The split panes are gone; every GitHub section is a
  full-width list that opens into a full-page detail with a property rail. Home is a
  workbench now, and the machine-wide view of your repositories understands folders of
  folders.
ReleaseNotesUrl: https://github.com/GitStudioHQ/gitstudio/releases/tag/app-v2.0.0
InstallationNotes: GitStudio uses the Git you already have. If `git` is not on your PATH, install it first (for example `winget install Git.Git`).
