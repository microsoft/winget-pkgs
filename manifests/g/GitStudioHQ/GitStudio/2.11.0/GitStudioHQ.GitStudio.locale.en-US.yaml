ReleaseNotes: |-
  GitStudio 2.11.0

  Added
  - Files changed for several commits. With two or more commits selected in
    the graph, the "N commits selected" summary lists the files they
    changed together, as a list or a tree, and a click opens a file's diff
    across them. A run of consecutive commits is shown as one change, the way
    squashing them would make it. For any other selection, each file's diff goes
    from before the first selected commit that changed it to after the last, and
    the summary says it can include commits in between.
    (#161)

  Changed
  - The file whose diff is open stays highlighted in the commit's Files
    changed, and closing the diff clears it.
    (#158)
  - A Codex or Gemini CLI chat runs that CLI. It used to start Claude Code,
    and said Claude Code wasn't installed when only Codex or Gemini was.
  - Crash reports send only what helps fix a failure. For a failed git
    command: its subcommand and options, never its arguments, and git's error
    lines, not the rest of its output. For an error: its call frames without
    folders, and the system's error code. Failures caused by your network,
    credentials or working tree aren't reported at all. See PRIVACY.md.

  Fixed
  - Tags show in every Show branches scope of the Commit Graph.
    (#159)
  - A branch with no commits yet no longer fails with "Couldn't load history";
    the other branches are shown, and a scope that shows nothing keeps its Show
    branches picker so you can widen it.
  - Open in finds its editor. A custom editor given as a command name (like
    hx) or as a path with spaces is found the way your terminal would find it,
    and a macOS app given by path or name opens. An editor moved, updated or
    uninstalled since it was found is looked for again. When one really can't be
    found, it says which program. Windows: an editor's .cmd launcher no longer
    breaks on folders with spaces or &, and the installed .exe is used when
    there is one.
  - Claude Code, Codex and the Gemini CLI are found where they're installed
    even when GitStudio was opened from the Dock or Start menu, and
    npm-installed CLIs run on Windows. Prompts reach the CLI however long they
    are, Cancel stops the CLI's whole process tree, and a CLI that isn't
    installed says how to install it.
  - A clone that ssh refused says ssh's reason (such as "Permission denied
    (publickey)"), not only "Could not read from remote repository."
  - Cherry-picking or reverting a commit the branch already has, from the
    graph, refreshes to show the cherry-pick or revert git left stopped, so it
    can be skipped or continued.
  - Crash reports no longer carry the names of self-hosted servers, proxies,
    accounts or organisations, and are no longer filed for a clone of an address
    that isn't a repository, proxy and git:// lookup failures, unrelated
    histories, Publish or tag Push with no remote, a missing CLI, a cancelled AI
    request, or Git disappearing while the app is open.
ReleaseNotesUrl: https://github.com/GitStudioHQ/gitstudio/releases/tag/app-v2.11.0
InstallationNotes: GitStudio uses the Git you already have. If `git` is not on your PATH, install it first (for example `winget install Git.Git`).
