ShortDescription: Windows backup for files and folders to drives you own. Free for one PC; Home and Pro are bought once.
Description: |-
  GBM AI (Genie Backup Manager AI) backs up the files and folders on your Windows PC to drives you own: an internal disk or USB drive, a network share or NAS, or your own S3-compatible storage. Describe a backup in plain words and Genie drafts the job; nothing runs until you approve it. Find searches every backup, even with the drive unplugged, and restore is always free.
  This package installs the main setup, which starts a 15-day Pro trial with no account or card. When the trial ends, backups pause until you buy Home or Pro or keep two jobs on the Free edition, which never expires. Nothing is deleted and restore always works.
