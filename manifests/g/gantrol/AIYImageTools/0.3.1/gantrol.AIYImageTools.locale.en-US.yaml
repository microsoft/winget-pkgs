PackageIdentifier: gantrol.AIYImageTools
PackageVersion: 0.3.1
PackageLocale: en-US
ShortDescription: Local-first AI image generation, dictionary, and asset management desktop app.
Description: AIY Image Tools is a local-first AI image generation, dictionary, and asset management desktop app. At runtime it uses SQLite and a managed media directory as its primary stores, and does not read business data from React components or web demos. It offers two independent image generation options — a Codex App Server and the Codex CLI — with stable model keys that keep existing drafts and tasks compatible; image generation, the Codex assistant, sessions, and title suggestions run in separate per-library background model processes.
