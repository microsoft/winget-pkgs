ReleaseNotes: AIY 0.3.1 adds the first macOS distribution for Apple Silicon Macs and provides Windows x64 packages built from the same release tag. It keeps the released 0.3.0 application and data baseline and includes release-gate fixes discovered while validating the macOS build.
