ShortDescription: Make a Windows computer accessible for remote access from the LogMeIn client app.
Description: |-
  The host app is installed on a computer to make it accessible remotely. After installation, use the client app to access your remote host computer. The host app for Windows is the app that you download to your target computer to make it accessible from the client.
  Before you install the host software on the computer you want to access remotely, make sure the device meets the published requirements. Supported operating systems are Windows 7 or newer, including 64-bit, and Windows Server 2008R2 or newer, including 64-bit. Windows XP, Linux, Chromebook, and Windows RT are not supported.
  Remote control performance depends on screen resolution, color depth, the type of activity, available bandwidth, and latency. Any always-on internet connection is sufficient for connecting and doing non-remote control work. For an optimal remote control experience, LogMeIn recommends a connection speed of 25 Mbit/s or higher on each end.
