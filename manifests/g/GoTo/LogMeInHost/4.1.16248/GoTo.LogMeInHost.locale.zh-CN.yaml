PackageIdentifier: GoTo.LogMeInHost
PackageVersion: 4.1.16248
PackageLocale: zh-CN
License: 专有软件
ShortDescription: 将 Windows 计算机设为主机，以便通过 LogMeIn 客户端应用进行远程访问。
Description: |-
  主机应用安装在需要被远程访问的计算机上，安装完成后即可使用客户端应用访问该远程主机计算机。Windows 主机应用是下载到目标计算机上、使其可被客户端访问的应用。
  在要远程访问的计算机上安装主机软件之前，请确认该设备符合官方发布的要求。支持的操作系统为 Windows 7 及更新版本（包括 64 位）以及 Windows Server 2008R2 及更新版本（包括 64 位）。不支持 Windows XP、Linux、Chromebook 和 Windows RT。
  远程控制的性能取决于屏幕分辨率、颜色深度、操作类型、可用带宽和延迟。进行连接以及远程控制以外的工作时，任何常开的互联网连接都足够。为了获得最佳的远程控制体验，LogMeIn 建议两端都使用 25 Mbit/s 或更高的连接速度。
