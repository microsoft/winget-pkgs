ShortDescription: IT management suite with remote access, support, and ticketing
Description: LogMeIn Resolve is an all-in-one IT management suite purpose-built for today's IT support challenges. It brings together world-class remote access and support with conversational ticketing to help you receive requests, triage problems, and fix issues quicker. Every IT team, helpdesk agent, and support request is different, which is why LogMeIn Resolve is built to meet the needs of each organization and problem, with support for all systems.
ReleaseNotes: |-
  Improvements
  - Replaced the web engine with Chromium Embedded Framework (CEF) for faster page loads, improved rendering stability, and up-to-date web platform support.
  - Updated OpenSSL to version 3.5.9.
  - Updated Qt framework to version 6.8.9.
  Fixes
  - Fixed an issue where the Account settings and Users and licenses menus opened multiple pop-up windows instead of the default browser. Select your profile picture in the top-right corner to view these menus.
  - Fixed an issue where closing the File Manager also closed the Desktop Console.
  - Fixed an issue where clipboard sync did not work when copying from the agent's to the end-user's device.
  - Fixed an issue on Windows where clipboard sync was disabled in attended sessions running in user (non-admin) mode.
  - Fixed an issue on Windows where keyboard shortcuts did not work during remote control sessions.
  - Fixed an issue on Mac where the right-click context menu did not close when clicking elsewhere in the app.
  - Fixed an issue on Mac where the chat input field disappeared during a remote control session.
  - Fixed an issue on Mac where Cmd key combinations were not sent to Mac end-user devices during remote control sessions.
  - Added various security improvements.
