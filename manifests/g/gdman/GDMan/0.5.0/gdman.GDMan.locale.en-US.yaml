ReleaseNotes: |-
  Update to Godot 4.7.2
  Removed the "Compile" feature, source code management and build parameter construction are removed together
  Engines are now stored by architecture, you can choose the architecture in the settings
  Pages are loaded asynchronously, startup is faster
  The download page loads faster, engine list is sorted by version
  Fixed many invalid download URLs, added Godot 3 and Windows arm64 entries
  Project time is now displayed in the system time zone
  Performance optimization
  Removed the Fast Load, hidden path and remote source options, download cache is now cleaned by keep days
  UI tweak: engine option is displayed in reverse order, cards are more compact
  Fixed the download dialog not resetting the source selection for the same engine
  更新到Godot 4.7.2
  移除了“编译”功能，源码管理与编译参数构建一并移除
  引擎改为按架构存放，可以在设置里选择架构
  页面改为异步加载，启动更快
  下载页加载更快，引擎列表按版本排序
  修复大量失效的下载地址，补充 Godot 3 与 Windows arm64 条目
  项目时间改为按系统时区显示
  性能优化
  移除了快速启动、隐藏路径与远程来源选项，下载缓存改为按保留天数清理
  UI调整：引擎下拉框倒序显示，卡片更紧凑
  修复下载对话框在相同引擎时未重置来源选择的问题
