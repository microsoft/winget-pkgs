ReleaseNotes: "Release 2.51 includes several security improvements, including the following:\n\n• The workforce identity sign-in process now uses [PKCE](https://oauth.net/2/pkce/).\n\n**Important**：Workforce identity federation may soon block sign-ins that don't use PKCE. Older versions of IAP Desktop may then no longer be able to sign in using workforce identity.\n\nIn addition, the release includes several stability improvements and fixes for the following issues:\n\n• Connecting to a server that uses SSH keyboard-interactive login with a custom \n  instruction message could cause IAP Desktop to crash.\n• Using SFTP to download a file with certain characters in its file name could fail\n  or cause IAP Desktop to place the file in the wrong location.\n• For certain fatal errors, IAP Desktop wasn't able to display an accurate\n  error description because the error handling caused cascading errors.\n\nIAP Desktop is developed and maintained by [jpassing](https://www.jpassing.com/)."
