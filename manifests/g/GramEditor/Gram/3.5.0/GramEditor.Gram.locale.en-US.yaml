ShortDescription: A code editor for humanoid apes and grumpy toads
Description: Gram is a powerful and modern source code editor. It features solid performance and is highly configurable, yet comes with batteries included out of the box. Gram supports many popular programming languages and file formats, and can use Zed extensions to support additional languages. Other features include built-in documentation, debugger support via the DAP protocol, source control using git and more. Gram started as a fork of the Zed editor.
