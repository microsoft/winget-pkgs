ShortDescription: 为人类猿和暴躁蟾蜍打造的代码编辑器。
Description: Gram 是一款强大的现代源代码编辑器。它性能出色、可高度配置，同时开箱即用地内置了大量功能。Gram 支持许多流行的编程语言和文件格式，并可以使用 Zed 扩展来支持更多语言。其他功能包括内置文档、通过 DAP 协议提供的调试器支持、基于 git 的版本控制等。Gram 最初是 Zed 编辑器的一个分支。
