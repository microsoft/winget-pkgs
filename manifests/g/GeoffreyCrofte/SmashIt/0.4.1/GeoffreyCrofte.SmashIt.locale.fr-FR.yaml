# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.28.0.schema.json

PackageIdentifier: GeoffreyCrofte.SmashIt
PackageVersion: 0.4.1
PackageLocale: fr-FR
Publisher: Geoffrey Crofte
PackageName: Smash It
License: GPL-3.0-or-later
ShortDescription: Allège vos images, vidéos et PDF, dans l'esprit d'ImageOptim.
Description: |-
  Déposez des fichiers ou des dossiers sur la fenêtre : Smash It essaie chaque moteur capable de les traiter,
  garde le résultat le plus petit, et seulement s'il est vraiment plus petit. Sans perte par défaut, originaux conservés.
  JPEG, PNG, WebP, AVIF, HEIC, GIF, SVG, PDF et vidéos MP4/MOV/MKV, avec des préréglages pour le web et l'e-mail,
  un aperçu avant/après, une entrée dans le menu clic droit de l'Explorateur et une ligne de commande « smashit ».
ReleaseNotesUrl: https://github.com/geoffreycrofte/smash-it/releases/tag/v0.4.1
ManifestType: locale
ManifestVersion: 1.28.0
