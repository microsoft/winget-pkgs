ShortDescription: Make images, videos and PDFs smaller, in the spirit of ImageOptim.
Description: |-
  Drop files or folders on the window: Smash It tries every engine that can handle them, keeps the smallest result,
  and only keeps it when it actually got smaller. Lossless by default, with your originals kept.
  JPEG, PNG, WebP, AVIF, HEIC, GIF, SVG, PDF and MP4/MOV/MKV videos, with presets for the web and email,
  a before/after preview, an Explorer right-click entry and a "smashit" command line.
