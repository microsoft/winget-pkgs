ShortDescription: A dock for Windows 10 and 11 that shows live widgets next to your apps.
Description: GlintBar replaces the Windows taskbar with a dock. It holds pinned and running apps with window previews, a Start button and tray icons, together with 110 widgets for media playback, weather, calendar, CPU, memory, network speed, clocks, timers, to-dos and online accounts. It runs without administrator rights, has no account or telemetry, and the normal taskbar returns when GlintBar exits.
