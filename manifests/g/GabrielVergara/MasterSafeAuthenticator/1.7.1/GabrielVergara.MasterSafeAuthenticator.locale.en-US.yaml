ShortDescription: Authenticator codes and passwords in one encrypted vault. Private, offline-first and built to be verified.
Description: |-
  MasterSafe Authenticator keeps your two-factor codes (TOTP and HOTP) and your passwords in one encrypted vault on your
  own computer. The vault is encrypted with AES-256-GCM and a key derived from your master password with Argon2id.
  Unlock it with your master password, Windows Hello or a FIDO2 security key. Nothing leaves your computer unless you
  choose a backup or sync folder. It imports from KeePass (.kdbx), Bitwarden, 1Password, Proton Pass, Aegis, 2FAS and
  Google Authenticator. Every release is signed with ML-DSA-65.
