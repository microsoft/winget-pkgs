ShortDescription: Rust-native coding-agent runtime and terminal CLI
Description: |-
  ki is a Rust-native coding-agent runtime. The terminal agent is the product;
  the ten kiqi-* crates under it are a library you can use on their own. They take
  you from provider adapters to a durable, crash-resumable agent loop with a wasm
  extension ABI. Sessions persist as JSONL and resume after a crash, and the
  session log self-heals when it was written by two processes at once.
