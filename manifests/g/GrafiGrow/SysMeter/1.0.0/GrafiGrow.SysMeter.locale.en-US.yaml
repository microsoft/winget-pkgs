ShortDescription: Lightweight real-time Windows 10 & 11 taskbar CPU, RAM, and Disk usage monitor.
Description: |-
  SysMeter is a tiny (~58 KB), zero-dependency Windows 10 and Windows 11 taskbar utility that displays live CPU %, RAM %, and Disk % usage with color-coded thresholds, tracks daily peak usage history with CSV export, supports Per-Monitor High-DPI laptop displays, and automatically hides during fullscreen games or videos.
