ReleaseNotes: |-
  en-US
  • Dynamic selection now starts with choosing an app; advanced matching options expand when needed.
  • Manage apps that are not running: search and select multiple entries to stop managing them.
  • Clearer main window and About pages, with improved keyboard navigation and screen reader labels in seven languages.
  • Improved follow-hide event handling and window ownership checks.
  • Corrected the Pro requirement for starting with Windows.

  zh-CN
  • 动态选定默认直接选程序，高级匹配选项按需展开。
  • 新增未运行应用管理入口，支持搜索、多选并取消管理。
  • 优化主界面与关于页，完善七语言键盘导航和读屏标签。
  • 改进跟随隐藏的事件处理和窗口归属检查。
  • 纠正随 Windows 启动的专业版权益要求。

  de-DE
  • Dynamische Auswahl beginnt mit der App-Auswahl; erweiterte Filter lassen sich bei Bedarf öffnen.
  • Nicht laufende Apps suchen, mehrfach auswählen und aus der Verwaltung entfernen.
  • Übersichtlicheres Hauptfenster und Info-Seiten sowie bessere Tastaturbedienung und Screenreader-Beschriftungen in sieben Sprachen.
  • Verbesserte Ereignisverarbeitung und Prüfung der Fensterzuordnung beim Folge-Ausblenden.
  • Pro-Anforderung für den Start mit Windows korrigiert.

  fr-FR
  • La sélection dynamique commence par le choix d’une application ; les filtres avancés se déplient au besoin.
  • Recherchez et sélectionnez plusieurs applications arrêtées pour cesser de les gérer.
  • Fenêtre principale et pages À propos plus claires, navigation au clavier et libellés de lecteur d’écran améliorés en sept langues.
  • Gestion des événements et vérification de l’appartenance des fenêtres améliorées pour le masquage suivi.
  • Exigence Pro corrigée pour le démarrage avec Windows.

  ja-JP
  • 動的選択はアプリの選択から開始。詳細な一致条件は必要に応じて展開できます。
  • 起動していないアプリの管理画面を追加。検索、複数選択、管理の解除に対応。
  • メイン画面とバージョン情報を改善。7言語のキーボード操作とスクリーンリーダー用ラベルを改善。
  • 追従非表示のイベント処理とウィンドウの所有関係の確認を改善。
  • Windows と同時に起動する機能の Pro 要件を修正。

  ko-KR
  • 동적 선택은 앱 선택으로 시작하며 고급 일치 옵션은 필요할 때 펼칠 수 있습니다.
  • 실행 중이 아닌 앱 관리 화면을 추가했습니다. 검색, 다중 선택 및 관리 해제를 지원합니다.
  • 기본 창과 정보 페이지를 개선하고 7개 언어의 키보드 탐색 및 화면 읽기 프로그램 레이블을 보완했습니다.
  • 숨기기 추적의 이벤트 처리와 창 소유 관계 확인을 개선했습니다.
  • Windows 시작 시 실행 기능의 Pro 요구 사항을 수정했습니다.

  es-ES
  • La selección dinámica comienza eligiendo una aplicación; los filtros avanzados se despliegan cuando los necesitas.
  • Busca y selecciona varias aplicaciones que no estén en ejecución para dejar de administrarlas.
  • Ventana principal y páginas Acerca de más claras, con mejor navegación por teclado y etiquetas para lectores de pantalla en siete idiomas.
  • Mejoras en los eventos y la comprobación de pertenencia de ventanas al seguir su ocultación.
  • Corregido el requisito de Pro para iniciar con Windows.
