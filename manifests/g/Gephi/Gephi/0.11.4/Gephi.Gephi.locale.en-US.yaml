ReleaseNotes: |-
  Follow-up release from v0.11.3 with bugfixes.
  What's Changed
  New Features
  - Add Barabási–Albert scale-free graph generator #3353
  Improved Features
  - Report edges with empty source/target on GraphML/GEXF import #3332
  - Report line and column for invalid XML in GraphML import #3333
  - Show the edge Kind column when more than one edge type is registered #3340
  Accessibility Improvements
  - Improve keyboard and screen reader accessibility #3337
  - Add keyboard zoom, pan and center to the graph view #3338
  - Keep buttons keyboard reachable without taking focus on click #3339
  - Add perspective and panel shortcuts, View menu zoom and more accessible names #3343
  Bugfixes
  - Calculation of Modularity never ends. #1630
  - Fix crash parsing import report entries containing embedded newlines and semicolons #3317
  - Fix NullPointerException in QueryNode.isSelected() when no workspace is selected #3318
  - Fix invalid GML property key handling #3319
  - Fix PNG export crash on oversized image dimensions (GEPHI-65R) #3320
  - Fix G2D preview render target rendering the wrong workspace #3321
  - Fix NullPointerException in regex-based attribute equal filter with empty pattern #3324
  - Fix NullPointerException in attributes panel when workspace is unselected #3325
  - Fix NPE in DataTableTopComponent when graph model is nulled during workspace unselect #3326
  - Fix StackOverflowError in strongly connected components on deep graphs #3327
  - Skip yFiles and graphml/port scoped keys in GraphML import #3331
  - Copy dynamic values when copying column or row data #3344
  - Do not reset the current selection when the project is disabled #3345
  - Copy dynamic values with AttributeUtils.copy in duplicate node, merge and multi-node edit #3346
  - Keep the viz engine rendering when an input listener fails #3350
  - Hold the graph read lock while preview builders read the nodes and edges #3354
  - Take the current filter result atomically before destroying it #3357
  - Fix the preview export failing when a node is added while the items are built #3359
  - Destroy the selection result replaced by a refresh #3360
  - Fix modularity community weights at the first level and with self-loops #3362
  - Release the graph held by the layouts at the end, and write the OpenOrd positions through its own nodes #3366
  - Only destroy the preview's own reduced view #3368
  - Destroy the views of failed and exported filter passes #3369
  - Destroy the views of the dynamic statistics and keep their base view #3371
  - Fetch the visible graph after taking its read lock where a view is used #3372
  - Get the visible graph after taking the read lock in layouts #3374
  - Compute Yifan Hu's Reset distance from the visible graph #3375
  - Skip the ForceAtlas2 pass when no node moves #3376
  - Open the try of the exporters right after taking the read lock #3377
  - Place the self-loop edge labels for the thickness the loop is drawn with #3378
  - Write the dynamic statistics series on the main graph #3379
  - Take the read lock before fetching the graph in the CSV and Pajek exporters #3380
  - Don't let a locked graph keep the previous workspace on the canvas #3388
  - Take the update check version from the branding module #3389
  - Don't freeze the UI when a filter is cleared while a statistic runs #3390
  - Keep the EDT off the graph lock in the Data Laboratory, Attributes, filter and Appearance panels #3391
  Code Improvements
  - Only prompt for new Gephi release on major/minor bump #3330
  - Scrub file paths from Sentry event messages #3328
  - Detect unclean exits and EDT hangs in Sentry #3329
  - Add integration tests driving Gephi through its controllers #3347
  - Let callers know when layouts and filters have finished #3348
  - Let monitors tell whether the viz engine still draws and gets world updates #3349
  - Add release tests running the built application #3351
  - Add a soak suite to the release tests #3356
  - Wait for Central publication before pushing the autoupdate site #3370
  - Return the workspace's own filter model from the filters test helpers #3373
  - Remove unused NBM installer settings from nbm-maven-plugin config #3383
  - Renew the macOS Developer ID certificate #3385
  - Keep Git Bash from rewriting GNUPGHOME in the release bundle step #3387
  API Changes
  Layout API
  - LayoutModel.isRunning() and LayoutController.canStop() now return true as soon as executeLayout() returns, until the layout finishes. Previously they could return false until the layout thread had started. The RUNNING event with a true value is now fired before the layout is submitted, so it always precedes the event with a false value.
  LongTask API
  - A task submitted to a background LongTaskExecutor now counts as running from execute() on: isRunning() returns true until the task completes, including while it waits for its thread to start, and cancel() reaches such a task.
  Filters API
  - Added isRunning() to FilterModel. Filtering and selection results are computed in the background, so it returns true from FilterController.filterVisible() or selectVisible(), a change of the current query's parameters or an automatic refresh, until the result is applied. A change event is fired when it goes back to false, so callers can wait for a filter's result.
