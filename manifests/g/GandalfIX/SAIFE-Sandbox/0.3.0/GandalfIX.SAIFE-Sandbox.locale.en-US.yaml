Moniker: saife
ShortDescription: Isolate and audit AI agents with production-grade Windows containment policies.
Description: >-
  SAIFE Sandbox (Secure AI Frontier Environment) runs an AI agent or any other
  command inside an explicit Windows containment policy: a declared filesystem
  grant list, proxy-only egress with per-host decisions, an optional host-side
  sidecar for credentialed services, and a hash-chained, signed audit trail of
  every session. Workloads start unelevated on Windows 11 24H2 or newer; the
  sandbox turns experimental agent code into an accountable actor. The command
  line is `saife`.
Tags:
  - sandbox
  - ai
  - agent
  - security
  - audit
  - isolation
  - cli
ReleaseNotesUrl: https://github.com/GandalfIX/saife/releases
InstallationNotes: >-
  Requires Windows 11 24H2 (build 26100) or newer, x64. No administrator rights
  and no service are needed for the default backend. Verify the installation with
  `saife setup --check-only`, then run something:
  `saife run --allow-cwd -- cmd /c echo ok`. Profiles live in
  %USERPROFILE%\.saife\profiles and plugin sidecars in
  %USERPROFILE%\.saife\plugins.
