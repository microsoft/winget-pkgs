ReleaseNotes: |-
  v0.10.2 更新内容：
  ✨ 新功能
  - NexusPilot Cloud 新设备授权现会自动轮询审批结果，并在获批后完成设备认领，无需反复手动刷新授权状态。
  - 连接配置新增备注，支持编辑最多 50 个字符的说明并通过 NexusPilot Cloud 同步；在 Explorer 中悬停连接时，可直接查看驱动相关信息、标签和备注。
  - AI 对话新增附件支持，可上传图片、音频和文档等文件并随消息发送、保留在历史记录中；附件是否可被识别由当前模型及其供应商决定，不支持时会展示其返回的错误信息。
  - AI Runtime 与桌面应用版本不匹配时，设置页会显示明确提示，并提供前往官方下载页面的入口。
  - Navigation Rail 新增文档入口，“关于”面板新增 NexusPilot 产品网站入口，均通过系统默认浏览器打开。
  ⚡ 优化
  - 应用启动并恢复登录会话后，会在后台刷新 Cloud 账户、订阅和同步状态，减少缓存信息过期带来的状态偏差。
  - 优化版本更新入口：标题栏提示支持在鼠标悬停或键盘聚焦时展开，便于直接查看可用版本和更新操作。
  - 优化 AI 对话交互：附件下载会打开系统保存对话框并反馈结果；用户消息悬停时可直接复制；输入框使用更通用的提示文案。
  - 恢复 Oracle Database 与 Amazon Neptune 的品牌图标，提升数据库类型辨识度。
  🐛 修复
  - 修复小窗口下设置菜单无法完整滚动，以及操作下拉选择器时可能误关闭设置窗口的问题。
  - 修复更新日志区域无法正确自适应高度，以及内容标签栏无法按预期横向滚动的问题。
  - 修复历史消息中的图片附件无法显示缩略图、单击后无法打开预览，以及 AI Runtime 持续重复请求同一附件内容的问题。
  - 修复标题栏展开式更新提示中文字位置偏移的问题。
