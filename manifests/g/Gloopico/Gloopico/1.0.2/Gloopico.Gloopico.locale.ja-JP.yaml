ReleaseNotes: '新しいスライムの見た目「ふにゃふにゃ」: なでると溶けて、だんだんうとうと眠るやわらかいスライムです。これが標準の見た目で、設定 > 見た目 > 「スライムのタイプ」でふにゃふにゃ / しゃきっと を選べます。Orca でスライムを押すと、そのタブにすぐ切り替わります。「5 分後にフレームレートを下げる」(設定 > 動き) は標準でオフになりました。'
