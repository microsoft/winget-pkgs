ShortDescription: '每个 Claude Code 和 Codex 会话都会变成一只软乎乎的史莱姆，在任务栏或 Dock 上走来走去。支持 Windows 和 macOS，免费使用。'
ReleaseNotes: '新的史莱姆外观“软趴趴”：摸一摸就会融化、慢慢打起瞌睡的软乎乎史莱姆。这是默认外观，可在 设置 > 外观 > “史莱姆类型” 中选择 软趴趴 / 机灵。在 Orca 中点击史莱姆会立即切换到它的标签页。“5 分钟后降低帧率”（设置 > 动作）现在默认关闭。'
