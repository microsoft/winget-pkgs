ShortDescription: 'Claude Code와 Codex 세션이 말랑한 슬라임이 되어 작업 표시줄 · Dock 위를 돌아다녀요. Windows · macOS 무료.'
ReleaseNotes: '새 슬라임 모습 「흐물흐물」: 쓰다듬으면 녹아내리고 스르르 잠드는 말랑한 슬라임이에요. 기본 모습이고, 설정 > 모양 > 「슬라임 타입」 에서 흐물흐물 / 똘똘 을 고를 수 있어요. Orca 에서 슬라임을 누르면 그 탭으로 바로 넘어가요. 「5 분 뒤 프레임 낮추기」 (설정 > 움직임) 는 이제 기본으로 꺼져 있어요.'
