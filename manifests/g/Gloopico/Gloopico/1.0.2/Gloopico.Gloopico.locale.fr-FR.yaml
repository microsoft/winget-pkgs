ShortDescription: 'Chaque session Claude Code et Codex devient un slime tout mou qui se balade sur votre barre des tâches ou votre Dock. Gratuit pour Windows et macOS.'
ReleaseNotes: 'Nouveau look « Tout mou » : un slime tout mou qui fond quand on le caresse et s’endort peu à peu. C’est l’apparence par défaut ; choisissez Tout mou ou Vif dans Réglages > Apparence > Type de slime. Cliquer sur un slime dans Orca bascule maintenant tout de suite sur son onglet. « Réduire les images après 5 min » (Réglages > Mouvement) est désormais désactivé par défaut.'
