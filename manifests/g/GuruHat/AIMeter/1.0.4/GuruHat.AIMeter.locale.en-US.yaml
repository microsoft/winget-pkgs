ShortDescription: A fuel gauge for Claude Code and Codex, always visible on your Windows taskbar. Free and open source.
Description: |-
  AI Meter shows how much of your current Claude Code or Codex usage window is left, and when it resets, right on the Windows taskbar.
  It reads the sign-in Claude Code or the Codex CLI already saved on your computer and sends that token only to Anthropic or OpenAI.
  No account, no analytics.
