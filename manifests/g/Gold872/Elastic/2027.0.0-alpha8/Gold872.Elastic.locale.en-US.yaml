ReleaseNotes: |-
  Caution
  This release is meant for teams participating in the SystemCore Beta testing. This is not recommended for use on the current control system. For more details on Elastic and the SystemCore beta testing, see the SystemCore Beta Testing repository.
  Users who are using Elastic on the existing control system should download the 2026 version of the app.
  This release fixes several critical issues with dynamic struct parsing, and adds field images for FTC.
