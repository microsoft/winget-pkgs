ReleaseNotes: |-
  Caution
  This release is meant for teams participating in the SystemCore Beta testing. This is not recommended for use on the current control system. For more details on Elastic and the SystemCore beta testing, see the SystemCore Beta Testing repository.
  Users who are using Elastic on the existing control system should download the 2026 version of the app.
  This release features changes in accordance with the updated WPILib telemetry API and format. This release MUST use WPILib 2027.0.0-alpha-7 or later; otherwise, some widgets may not function properly.
  The port for the web version of Elastic on the SystemCore has also been changed to port 5803. Before updating the SystemCore version of Elastic, users should back up their settings, as they will not be persisted while updating.
  What's Changed
  - Update checkout action version for workflows by @Gold872 in #371
  - Clean up verbose CI syntax and stop double zipping artifacts by @Gold856 in #373
  - Change systemcore port to 5803 by @bhjelstrom in #377
  - 2027 FMSInfo Changes by @Gold872 in #365
  - 2027 Telemetry API by @Gold872 in #366
  - Update version to 2027.0.0-alpha9 by @Gold872 in #382
  New Contributors
  - @bhjelstrom made their first contribution in #377
  Full Changelog: v2027.0.0-alpha8...v2027.0.0-alpha9
