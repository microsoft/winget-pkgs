ShortDescription: Keep Windows and the display awake from the terminal, indefinitely, for a duration, or until a time.
Description: |-
  awake is a tiny command-line tool that stops Windows and the display from going to sleep.
  Run `awake` to turn it on until you run it again, `awake 2h` for a duration, or `awake 17:30` to stay awake until a clock time.
  It runs in the background, so the terminal can be closed, and it never changes your power plan.
