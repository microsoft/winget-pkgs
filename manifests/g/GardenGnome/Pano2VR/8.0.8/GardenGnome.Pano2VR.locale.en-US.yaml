ReleaseNotes: |-
  This is a bugfix release for Pano2VR 8.0
  - Fix missing transition in change element size action on text boxes
  - Improved detection for "has gyro" in Chrome 151+ on desktop
  - Tile cache: do not delete another running instance's cache file on start
  - Skin loader: remap the 7.1 image output format, export WebP node images
  - PDF viewer: allow pdf.js's runtime stylesheet in the CSP
  - Fix for an issue that prevented keeping the activation across restarts
