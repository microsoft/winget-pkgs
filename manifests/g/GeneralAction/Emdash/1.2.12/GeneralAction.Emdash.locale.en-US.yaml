ReleaseNotes: |-
  This release sends Emdash 2.0 waitlist signups through emdash.com and makes importing data from Emdash v0 more reliable.
  Fixes
  - Waitlist signups from the sidebar are sent to emdash.com in a single request. When a signup fails, the dialog now says why: the email address doesn't look valid, there have been too many attempts, or the server couldn't be reached.
  - Importing data from Emdash v0 runs in one transaction that is never held open while other work happens. A failed import no longer rolls back unrelated changes made at the same time, starting a second import no longer fails with "cannot start a transaction within a transaction", an import that overlaps a running one is rejected, and terminal sessions are renamed only after the import has been saved.
