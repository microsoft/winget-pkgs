ShortDescription: A free desktop world clock widget for remote teams, showing four cities with live call status.
Description: |-
  GlobalSync World Clock is a small desktop widget that keeps up to four cities in view, each under a live sky for its local time.
  Every city shows a plain status (good time to call, starts in 40m, after hours, asleep or weekend, following each country's working week).
  Drag the timeline to preview any meeting time in every city, then copy the times for your invite.
  1.6 MB, no account, no tracking, works offline.
