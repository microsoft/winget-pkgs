ShortDescription: Comparte pantallas entre macOS y Windows a través de la red local.
Description: |-
  GDW Mirror es una aplicación para compartir pantalla con funciones duales
  en macOS y Windows. Cada equipo puede compartir su pantalla para que el otro
  la vea, en una dirección a la vez, a través de la red local. Usa WebRTC
  directo e incluye captura a resolución nativa, detección automática de
  equipos, código de emparejamiento opcional de seis dígitos y reconexión
  automática. No controla el ratón ni el teclado del otro equipo. Requiere que
  ambos estén en la misma red local; la Mac necesita macOS 13 Ventura o posterior.
