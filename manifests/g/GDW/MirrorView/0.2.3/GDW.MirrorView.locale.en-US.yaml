ShortDescription: Share screens between macOS and Windows over your local network.
Description: |-
  GDW Mirror is a dual-role screen sharing app for macOS and Windows. Each
  computer can share its screen for the other to view, one direction at a
  time, over the local network. It uses direct WebRTC and supports native-
  resolution capture, automatic device discovery, optional six-digit
  pairing, and automatic reconnection. It does not control the other
  computer's mouse or keyboard. Requires both computers on the same local
  network; the Mac requires macOS 13 Ventura or later.
