PackageIdentifier: Glattziehen.Lazyfwd
PackageVersion: 0.1.3
PackageLocale: zh-CN
ShortDescription: 在键盘优先的终端界面中管理 SSH 端口转发。
Description: |-
  lazyfwd 通过键盘优先的终端界面管理 SSH 端口转发，风格类似 lazygit。选择主机、找到正在监听的端口，即可将其转发到本机，无需记忆 SSH 参数。

  - 主机来自你的 SSH 配置，也可以手动添加或置顶。Forwards 面板显示所选主机已保存的转发，Listening 面板显示其监听端口及（可用时的）进程名，Live 面板跨主机显示正在运行和已失败的转发。
  - lazyfwd 使用系统自带的 ssh，因此你的 SSH 配置、agent 与 ProxyJump 都可照常工作。当 SSH 需要密码、确认主机密钥或进行其他登录步骤时，lazyfwd 会把终端交给 SSH，并在连接完成后返回。
  - 支持双向转发 TCP 端口与 Unix 套接字，也可手动添加转发。按 ? 查看全部按键。
  - 脚本与代理可与界面一同使用命令行。命令经由正在运行的 lazyfwd 进程处理，因此界面会立即显示变更；未打开界面时，可运行 lazyfwd serve 以维持连接。
  - 主机、置顶项与转发保存在 $XDG_CONFIG_HOME/lazyfwd/workspace.json（Linux 为 ~/.config，macOS 为 ~/Library/Application Support，Windows 为 %AppData%）。

  在 Windows 上，自带的 OpenSSH 客户端无法按主机复用同一连接，因此每个转发都会运行各自的 ssh。lazyfwd 会拒绝每次连接都需要密码、密钥口令或两步验证的主机，拒绝 SSH 配置中含有 LocalForward、RemoteForward 或 DynamicForward 行的主机，以及把 Unix 套接字作为转发本地端的情况。
