ShortDescription: Manage SSH port forwards from a keyboard-first terminal UI.
Description: |-
  lazyfwd manages SSH port forwards from a keyboard-first terminal UI, in the spirit of lazygit. Pick a host, find a listening port, and forward it to your machine without remembering SSH flags.

  - Hosts come from your SSH config, and you can add or pin hosts. Forwards shows the selected host's saved forwards, Listening shows its listening ports and process names when available, and Live shows running and failed forwards across hosts.
  - lazyfwd uses your system ssh, so your SSH config, agent, and ProxyJump work as usual. When SSH needs a password, host key confirmation, or another login step, lazyfwd hands the terminal to SSH and returns after it connects.
  - Forward TCP ports and Unix sockets in either direction, add a local or remote forward by hand, and start or stop a saved forward. Press ? for all keys.
  - Scripts and agents can use the command line alongside the UI. Commands go through the running lazyfwd process, so the UI shows their changes at once; without the UI, run lazyfwd serve to hold the connections.
  - Hosts, pins, and forwards are saved in $XDG_CONFIG_HOME/lazyfwd/workspace.json (~/.config on Linux, ~/Library/Application Support on macOS, %AppData% on Windows).

  On Windows the bundled OpenSSH client cannot share one connection per host, so each forward runs its own ssh. lazyfwd refuses hosts that ask for a password, key passphrase, or 2FA on every connect, hosts whose SSH config has LocalForward, RemoteForward, or DynamicForward lines, and Unix sockets as a forward's local end.
