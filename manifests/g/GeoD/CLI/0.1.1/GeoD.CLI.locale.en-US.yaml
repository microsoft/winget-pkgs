# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

PackageIdentifier: GeoD.CLI
PackageVersion: 0.1.1
PackageLocale: en-US
Publisher: GeoD
PublisherUrl: https://geod.laogao.xyz/
PublisherSupportUrl: https://github.com/gaopengbin/geo-downloader/issues
PackageName: GeoD CLI
PackageUrl: https://github.com/gaopengbin/geo-downloader/blob/geod-cli-v0.1.1/docs/geod-cli.md
License: MIT
LicenseUrl: https://github.com/gaopengbin/geo-downloader/blob/a9d1a9062916141071e1b122de15dc2041f0fdc1/LICENSE
ShortDescription: Standalone GeoD command-line tool for parameterized GeoTIFF and GeoJSON acquisition.
Description: |-
  GeoD CLI accepts structured JSON requests to plan data acquisition, download GeoTIFF and GeoJSON data bundles, and inspect their manifests and hashes.
  Data acquisition does not require the GeoD desktop application, Rust, Node.js, or GDAL. Optional GeoStyle import and browser rendering require a compatible GeoStyle service, Node.js 22 or later, and Chrome or Edge; these are not included in this package.
  Version 0.1.1 is the first public Windows x64 preview. Map data is downloaded separately from the configured providers.
Moniker: geod-cli
Tags:
- cli
- geod
- geography
- geojson
- geospatial
- geotiff
- gis
ReleaseNotesUrl: https://github.com/gaopengbin/geo-downloader/releases/tag/geod-cli-v0.1.1
InstallationNotes: |-
  This package installs for the current user. Open a new terminal after installation to use the geod command.
  Keep downloaded maps and additional files outside the installation directory. Upgrades uninstall the previous installation first; user-added files are retained and can prevent installation into the same nonempty directory.
ManifestType: defaultLocale
ManifestVersion: 1.12.0
