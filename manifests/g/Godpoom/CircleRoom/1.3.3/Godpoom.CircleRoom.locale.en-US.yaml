ShortDescription: "Free, light photo editor for Windows with on-device AI and an MCP server for AI agents."
Description: "Circle Room is a free photo editor for Windows 10/11: Lightroom-style light, colour, tone curve, HSL, colour grading, crop and looks; camera RAW; AI that runs on your computer to pick the best shots in a folder, auto-edit many photos, erase objects and rebuild blown highlights; layers with text (Thai and Latin fonts), vector drawing and Make your font; optional image generation through OpenRouter with your own key. It is also an MCP server, so Claude, Codex, Cursor, Gemini CLI and other agents can edit, draw and export photos and see every step. A ~3 MB program that uses about 15 MB of RAM. English and Thai."
