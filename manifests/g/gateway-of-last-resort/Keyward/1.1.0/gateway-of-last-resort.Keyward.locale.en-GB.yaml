ShortDescription: Terminal UI to manage SSH keys, edit your SSH config and audit SSH security.
Description: |-
  Your SSH setup is usually scattered across a pile of files: keys in ~/.ssh, hosts in ~/.ssh/config, permissions you hope are right, and no easy way to tell a strong key from a weak one. Keyward puts all of it behind a single keyboard-driven screen.

  - See everything at once: every key with its type, size and fingerprint, and whether it is passphrase-protected, instead of listing a directory and running ssh-keygen -l by hand.
  - Know if you are safe: a graded A-F security audit flags weak keys, missing passphrases, loose file permissions and risky config directives, each with a concrete fix.
  - Edit config without breaking it: host-by-host editing with validation and byte-identical round-trip serialization, so your comments, spacing and ordering survive untouched, and the last 5 versions are backed up automatically.
  - Encrypted by default: key metadata such as tags and notes, and full ~/.ssh backups, are encrypted at rest with a key derived from your master password.

  Features cover key management (discover, inspect, generate, rotate and delete ed25519 and RSA keys), the ~/.ssh/config editor, the graded A-F security audit, a known_hosts viewer that rewrites the file atomically when you forget a host, age-encrypted .tar.age backups of ~/.ssh restorable from within the TUI, and an encrypted metadata vault.

  Running keyward with no arguments launches the interactive TUI; keyward <command> [flags] runs a non-interactive command, and --version and --help are supported. On first launch you set a master password, which creates the encrypted vault at ~/.keyward/master.key. There is no daemon, no config file to learn and no network calls: Keyward is a single static binary that works offline.
