PackageIdentifier: gateway-of-last-resort.Keyward
PackageVersion: 1.1.0
PackageLocale: zh-CN
ShortDescription: 用于管理 SSH 密钥、编辑 SSH 配置并审计 SSH 安全性的终端界面。
Description: |-
  你的 SSH 配置通常散落在一大堆文件里：密钥放在 ~/.ssh，主机放在 ~/.ssh/config，文件权限全靠运气，也没有简单的办法分辨密钥强弱。Keyward 把这些都收拢到一个可用键盘操作的界面中。

  - 一目了然：列出每个密钥的类型、长度与指纹，并标明是否受口令保护，不必再手动列目录、逐个执行 ssh-keygen -l。
  - 心中有数：按 A-F 评级的安全审计会标记弱密钥、缺失的口令、宽松的权限和有风险的配置指令，并给出具体的修复建议。
  - 改配置不破坏配置：按主机逐项编辑并通过校验，往返序列化结果与原文件逐字节一致，注释、空格与顺序都原样保留，并自动备份最近 5 个版本。
  - 默认加密：包括标签与备注在内的密钥元数据，以及整个 ~/.ssh 的备份，都以由主密码派生的密钥静态加密保存。

  功能涵盖密钥管理（发现、查看、生成、轮换与删除 ed25519 和 RSA 密钥）、~/.ssh/config 配置编辑器、A-F 分级安全审计、known_hosts 查看器（遗忘主机时以原子方式重写文件并保持权限）、可在界面内恢复的 age 加密 .tar.age 备份，以及加密的元数据仓库。

  不带参数运行 keyward 会启动交互式 TUI；keyward <command> [flags] 用于执行非交互式命令，同时支持 --version 与 --help。首次运行时设置主密码，并在 ~/.keyward/master.key 创建加密仓库。Keyward 没有守护进程，不需要学习额外的配置文件，也不会发起网络调用：它是一个可离线使用的单文件静态二进制程序。
