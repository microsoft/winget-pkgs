ShortDescription: "Press Ctrl+1, speak, and your words are typed into any Windows app as you talk. Choose the engine by name: Google, offline models that run on your PC, or Soniox on Pro."
Description: |-
  VoiceKeyboard types what you say into the window you are working in: a browser, a messenger, a document, a code editor or an AI chat. Put the cursor where the text should go, press Ctrl+1 and speak. Press Ctrl+1 again to stop. The hotkey can be changed.

  Choose the engine by its name:
  - Google: free, 58 languages, one language at a time, needs the internet and Google Chrome.
  - Whisper: offline, about 99 languages on AUTO, finds the language by itself.
  - Parakeet v3: offline, 25 European languages, with punctuation.
  - Vosk: offline, small models for older or slower computers, 15 languages.
  - GigaAM v3 and T-one: offline, made for Russian.
  - Soniox (Pro): online, detects your language as you speak and can switch in the middle of a sentence.

  Offline models download once inside the app, about 45 to 670 MB each. With an offline engine your audio stays on your PC. With an online engine the audio goes to that provider only to be transcribed; VoiceKeyboard keeps no recordings.

  FILES turns audio, video and video links into .txt files on your computer with Whisper.

  Free: 2,000 words a day with any engine, renewed at midnight; 1 file and 1 video link a day, up to 60 minutes each.
  Pro is a subscription bought on the VoiceKeyboard website and paid through Stripe: $14.99 a month, or $119.88 a year (launch prices until 30 November 2026; an active subscription keeps its price). Pro removes the daily limit, adds Soniox with 1,500 credits a month (one credit is one minute of audio), lifts the FILES limits, adds voice commands, gives all five tube styles and works on up to 3 computers. Refund within 14 days. Pro is not sold in Russia or in countries under comprehensive EU or UN sanctions.

  The app installs for the current user, without administrator rights, and updates itself. The interface is in English, Spanish, Russian, Japanese and Hindi.
