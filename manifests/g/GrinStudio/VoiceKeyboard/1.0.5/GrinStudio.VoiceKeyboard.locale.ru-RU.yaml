ShortDescription: "Нажмите Ctrl+1, говорите — и слова печатаются в любой программе Windows по ходу речи. Движок выбираете по названию: Google, модели без интернета на вашем компьютере или Soniox в Pro."
Description: |-
  VoiceKeyboard печатает сказанное в окно, в котором вы работаете: браузер, мессенджер, документ, редактор кода или чат с нейросетью. Поставьте курсор, нажмите Ctrl+1 и говорите. Повторное нажатие останавливает запись. Сочетание клавиш можно сменить.

  Движок выбирается по названию:
  - Google: бесплатно, 58 языков, по одному за раз, нужны интернет и Google Chrome.
  - Whisper: без интернета, около 99 языков в режиме AUTO, язык определяет сам.
  - Parakeet v3: без интернета, 25 европейских языков, с пунктуацией.
  - Vosk: без интернета, небольшие модели для старых и медленных компьютеров, 15 языков.
  - GigaAM v3 и T-one: без интернета, сделаны для русского.
  - Soniox (Pro): онлайн, сам определяет язык по ходу речи и переключается посреди фразы.

  Модели без интернета скачиваются один раз внутри программы, примерно от 45 до 670 МБ каждая. С ними звук не покидает компьютер. Онлайн-движок получает звук только для расшифровки; VoiceKeyboard записи не хранит.

  FILES переводит аудио, видео и ссылки на видео в файлы .txt на вашем компьютере моделью Whisper.

  Бесплатно: 2 000 слов в день с любым движком, лимит обновляется в полночь; 1 файл и 1 ссылка на видео в день, до 60 минут каждый.
  Pro — подписка, покупается на сайте VoiceKeyboard, оплата через Stripe: $14.99 в месяц или $119.88 в год (цены запуска до 30 ноября 2026 года; действующая подписка сохраняет свою цену). Pro снимает дневной лимит, добавляет Soniox на 1 500 кредитов в месяц (кредит — минута звука), снимает ограничения FILES, добавляет голосовые команды, открывает все пять ламп и работает на 3 компьютерах. Деньги можно вернуть в течение 14 дней. Pro не продаётся в России и в странах под всеобъемлющими санкциями ЕС или ООН; бесплатная версия работает везде.

  Программа ставится для текущего пользователя, без прав администратора, и обновляется сама. Интерфейс — на английском, испанском, русском, японском и хинди.
