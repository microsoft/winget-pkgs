ShortDescription: "Ctrl+1を押して話すと、話したそばからWindowsのどのアプリにも文字が入力されます。エンジンは名前で選べます。Google、パソコン上で動くオフラインモデル、ProではSoniox。"
Description: |-
  VoiceKeyboardは、作業中のウィンドウに話した内容を入力します。ブラウザー、チャット、文書、コードエディター、AIチャットなどで使えます。文字を入れたい場所にカーソルを置き、Ctrl+1を押して話します。もう一度Ctrl+1を押すと止まります。ホットキーは変更できます。

  エンジンは名前で選べます:
  - Google：無料、58言語、一度に1言語、インターネットとGoogle Chromeが必要。
  - Whisper：オフライン、AUTOで約99言語、言語を自動で判別。
  - Parakeet v3：オフライン、ヨーロッパの25言語、句読点付き。
  - Vosk：オフライン、古いパソコンや遅いパソコン向けの小さなモデル、15言語。
  - GigaAM v3とT-one：オフライン、ロシア語向け。
  - Soniox（Pro）：オンライン、話している言語を自動で判別し、文の途中でも切り替え可能。

  オフラインモデルはアプリ内で一度だけダウンロードします（1つ約45〜670MB）。オフラインモデルなら音声はパソコンの外に出ません。オンラインエンジンは文字起こしのためだけに音声を受け取り、VoiceKeyboardは録音を保存しません。

  FILESでは、音声・動画・動画リンクをWhisperでパソコン上の.txtファイルにできます。

  無料版：どのエンジンでも1日2,000語まで、毎日0時にリセット。ファイルと動画リンクはそれぞれ1日1件、各60分まで。
  ProはVoiceKeyboardのウェブサイトで購入するサブスクリプションで、支払いはStripeです。月額14.99ドル、または年額119.88ドル（2026年11月30日までのリリース記念価格。継続中のサブスクリプションはその価格のままです）。Proでは1日の上限がなくなり、Sonioxを月1,500クレジット（1クレジット＝音声1分）使え、FILESの制限がなくなり、音声コマンドが使え、5種類の真空管スタイルがすべて選べ、最大3台のパソコンで使えます。14日以内なら返金を受けられます。Proはロシア、およびEUや国連の包括的制裁対象の国・地域では販売していません。

  現在のユーザー向けに管理者権限なしでインストールされ、自動で更新されます。インターフェースは英語、スペイン語、ロシア語、日本語、ヒンディー語に対応しています。
