ShortDescription: "Ctrl+1 दबाएँ, बोलें, और आपके शब्द बोलते-बोलते Windows के किसी भी ऐप में टाइप हो जाते हैं। इंजन नाम से चुनें: Google, आपके PC पर चलने वाले ऑफ़लाइन मॉडल, या Pro में Soniox।"
Description: |-
  VoiceKeyboard आपकी बोली को उसी विंडो में टाइप करता है जिसमें आप काम कर रहे हैं: ब्राउज़र, चैट, डॉक्यूमेंट, कोड एडिटर या AI चैट। जहाँ टेक्स्ट चाहिए वहाँ कर्सर रखें, Ctrl+1 दबाएँ और बोलें। रोकने के लिए फिर से Ctrl+1 दबाएँ। हॉटकी बदली जा सकती है।

  इंजन उसके नाम से चुनें:
  - Google: मुफ़्त, 58 भाषाएँ, एक समय में एक भाषा, इंटरनेट और Google Chrome ज़रूरी।
  - Whisper: ऑफ़लाइन, AUTO पर लगभग 99 भाषाएँ, भाषा खुद पहचानता है।
  - Parakeet v3: ऑफ़लाइन, 25 यूरोपीय भाषाएँ, विराम चिह्नों के साथ।
  - Vosk: ऑफ़लाइन, पुराने या धीमे कंप्यूटरों के लिए छोटे मॉडल, 15 भाषाएँ, हिंदी भी।
  - GigaAM v3 और T-one: ऑफ़लाइन, रूसी भाषा के लिए।
  - Soniox (Pro): ऑनलाइन, बोलते समय आपकी भाषा पहचानता है और वाक्य के बीच में भी भाषा बदल सकता है।

  ऑफ़लाइन मॉडल ऐप के अंदर एक बार डाउनलोड होते हैं, हर एक लगभग 45 से 670 MB। इनके साथ आपकी आवाज़ PC से बाहर नहीं जाती। ऑनलाइन इंजन आवाज़ सिर्फ़ टेक्स्ट बनाने के लिए लेता है; VoiceKeyboard कोई रिकॉर्डिंग नहीं रखता।

  FILES आपके कंप्यूटर पर Whisper से ऑडियो, वीडियो और वीडियो लिंक को .txt फ़ाइल में बदलता है।

  Free: किसी भी इंजन से रोज़ 2,000 शब्द, आधी रात को फिर से शुरू; रोज़ 1 फ़ाइल और 1 वीडियो लिंक, हर एक 60 मिनट तक।
  Pro एक सब्सक्रिप्शन है जो VoiceKeyboard की वेबसाइट पर खरीदा जाता है, भुगतान Stripe से: $14.99 महीना या $119.88 साल (30 नवंबर 2026 तक की लॉन्च कीमतें; चालू सब्सक्रिप्शन की कीमत वही रहती है)। Pro रोज़ की सीमा हटाता है, हर महीने 1,500 क्रेडिट के साथ Soniox देता है (1 क्रेडिट = 1 मिनट ऑडियो), FILES की सीमाएँ हटाता है, वॉइस कमांड जोड़ता है, पाँचों ट्यूब स्टाइल खोलता है और 3 कंप्यूटरों तक चलता है। 14 दिन के अंदर रिफ़ंड माँग सकते हैं। Pro रूस और EU या UN के व्यापक प्रतिबंधों वाले देशों में नहीं बिकता।

  ऐप मौजूदा यूज़र के लिए, एडमिनिस्ट्रेटर अधिकारों के बिना इंस्टॉल होता है और खुद अपडेट होता है। इंटरफ़ेस अंग्रेज़ी, स्पेनिश, रूसी, जापानी और हिंदी में है।
