ShortDescription: "Pulsa Ctrl+1, habla y tus palabras se escriben en cualquier programa de Windows mientras hablas. Eliges el motor por su nombre: Google, modelos sin conexión en tu PC o Soniox en Pro."
Description: |-
  VoiceKeyboard escribe lo que dices en la ventana en la que trabajas: un navegador, un chat, un documento, un editor de código o un chat de IA. Pon el cursor donde va el texto, pulsa Ctrl+1 y habla. Vuelve a pulsar Ctrl+1 para parar. El atajo se puede cambiar.

  Eliges el motor por su nombre:
  - Google: gratis, 58 idiomas, uno cada vez, necesita internet y Google Chrome.
  - Whisper: sin conexión, unos 99 idiomas en AUTO, detecta el idioma solo.
  - Parakeet v3: sin conexión, 25 idiomas europeos, con puntuación.
  - Vosk: sin conexión, modelos pequeños para ordenadores antiguos o lentos, 15 idiomas.
  - GigaAM v3 y T-one: sin conexión, hechos para el ruso.
  - Soniox (Pro): en línea, detecta tu idioma mientras hablas y puede cambiar a mitad de frase.

  Los modelos sin conexión se descargan una vez dentro de la app, de unos 45 a 670 MB cada uno. Con ellos el audio no sale de tu PC. Un motor en línea recibe el audio solo para transcribirlo; VoiceKeyboard no guarda grabaciones.

  FILES convierte audio, vídeo y enlaces de vídeo en archivos .txt en tu ordenador, con Whisper.

  Gratis: 2.000 palabras al día con cualquier motor, se renuevan a medianoche; 1 archivo y 1 enlace de vídeo al día, de hasta 60 minutos cada uno.
  Pro es una suscripción que se compra en el sitio web de VoiceKeyboard y se paga con Stripe: 14,99 $ al mes o 119,88 $ al año (precios de lanzamiento hasta el 30 de noviembre de 2026; una suscripción activa conserva su precio). Pro quita el límite diario, añade Soniox con 1.500 créditos al mes (un crédito es un minuto de audio), quita los límites de FILES, añade comandos de voz, desbloquea los cinco estilos de válvula y funciona en hasta 3 ordenadores. Puedes pedir el reembolso en 14 días. Pro no se vende en Rusia ni en países con sanciones generales de la UE o la ONU.

  La app se instala para el usuario actual, sin derechos de administrador, y se actualiza sola. La interfaz está en inglés, español, ruso, japonés e hindi.
