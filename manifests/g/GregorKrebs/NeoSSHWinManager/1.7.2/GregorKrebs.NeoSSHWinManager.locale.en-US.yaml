ReleaseNotes: |-
  The embedded terminal now asks whether to trust the key of a newly added server, instead of failing after half a minute as if the host or the password were wrong, and the app starts again on its own after an in-app update.
  1.7.0 brought a single-user mode that signs you in automatically, a filter that finds any connection as you type (Ctrl+F), a redesigned login screen with a language menu and the Black theme, and removed the Pro licence: everything is free and open source.
