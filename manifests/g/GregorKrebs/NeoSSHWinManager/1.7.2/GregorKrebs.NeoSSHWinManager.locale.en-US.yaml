ShortDescription: Free SSH manager for Windows that mounts remote folders as drive letters via SSHFS, with a terminal and an SFTP/FTP file browser.
Description: |-
  NEO SSH-Win Manager (NeoSSHWinManager) keeps all your SSH servers in one place.
  Mount remote folders as Windows drive letters with one click (SSHFS-Win / WinFsp), open an integrated terminal that signs in by itself, and move files with a dual-pane SFTP/FTP/FTPS file browser with a transfer queue, resume and folder sync.
  It works with Linux and Windows (OpenSSH) servers, stores credentials encrypted, supports several users and six languages, and is a free, open-source alternative to FileZilla, WinSCP and PuTTY.
