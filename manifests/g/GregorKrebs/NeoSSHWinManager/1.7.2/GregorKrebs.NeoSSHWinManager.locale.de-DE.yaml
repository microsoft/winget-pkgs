ShortDescription: Kostenloser SSH-Manager für Windows, der Remote-Ordner per SSHFS als Laufwerk einbindet, mit Terminal und SFTP/FTP-Dateibrowser.
Description: |-
  NEO SSH-Win Manager (NeoSSHWinManager) verwaltet alle deine SSH-Server an einem Ort.
  Remote-Ordner werden mit einem Klick als Windows-Laufwerk eingebunden (SSHFS-Win / WinFsp), das integrierte Terminal meldet sich selbst an, und ein Zwei-Fenster-Dateibrowser für SFTP, FTP und FTPS überträgt Dateien mit Warteschlange, Fortsetzen und Ordner-Synchronisierung.
  Er arbeitet mit Linux- und Windows-Servern (OpenSSH), speichert Zugangsdaten verschlüsselt, kennt mehrere Benutzer und sechs Sprachen und ist eine kostenlose Open-Source-Alternative zu FileZilla, WinSCP und PuTTY.
