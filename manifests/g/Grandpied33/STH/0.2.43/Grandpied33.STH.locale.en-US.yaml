ShortDescription: (Alpha) CLI to install and update AI skill bundles from a hosted catalog.
Description: |
  STH (Skills Transfer Hub, Alpha) is a single-binary Go CLI that connects a project
  to a hosted catalog of AI resources, reads SKILLS.md, installs resources
  locally, and keeps them in sync.
Moniker: sth
ReleaseNotes: |-
  • Install your first skill through a guided flow：choose a skill with its description, select your assistant, preview the files, then get instructions to use or remove it.
  • Manage skills and other supported resource types from multiple repositories. Search large catalogs, choose between ambiguous names, and see when a conversion loses information.
  • Check installed resources for updates automatically from the menu, or on demand. See available updates, pinned versions and sources that could not be checked; changes are only applied when you request them.
  • Use public repositories without a token and get clearer guidance for private repositories and connection problems. Personal edits are protected, and unchanged installations are reported as already up to date.
  • Text and JSON listings now show the same catalog. Scripts that need only locally installed resources should use `sth list --installed --json`.


  ---
  See all releases：https://github.com/Skills-transfer-hub/sth-releases/releases
