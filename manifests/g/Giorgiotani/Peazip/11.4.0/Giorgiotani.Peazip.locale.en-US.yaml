ReleaseNotes: |-
  PeaZip 11.4.0 continues the effort to strengthen security, with improved validation of input, extensive use of range check, removal of use of console for backend tasks.
  Usability is also improved with enhanced auto-refresh for file browser, and ability to browse .lnk files destination dirs on Windows (Ctrl+P).
  Backend are updated with Pea 1.34 and 7z/p7zip 26.04.
  Sources are compiled with Lazarus 4.x, and are still compatible with Lazarus 3.x and 2.x.
  A total of 243 file extensions are now supported as archives by PeaZip.
