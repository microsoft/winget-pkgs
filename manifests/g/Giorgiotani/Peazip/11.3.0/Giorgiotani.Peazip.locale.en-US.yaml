ReleaseNotes: |-
  PeaZip 11.3.0 provides improved ZPAQ support, new test function for PEA archives, mandatory master password for the integrated Password Manager, and usability improvements as the new "Open with" picker screen (Shift+F12).
  Backend are updated to 7z/p7zip 26.03 and Pea 1.33.
  Due to multiple security fixes and improvements it is recommended to update to the new version.
  Sources are compiled with Lazarus 4.x, and are still compatible with Lazarus 3.x and 2.x.
  A total of 243 file extensions are now supported as archives by PeaZip.
  PeaZip screenshot, on Linux with dark theme, browsing a .zip archive
