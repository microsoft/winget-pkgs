ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  本次更新聚焦于窗口交互的控制力与内置 AI 助手的使用体验。
  用户可见亮点
  - 新增“回车优先唤醒”开关，开启后按回车即等同 Shift+Enter，省去组合键操作。
  - 内置 AI 助手接入内嵌使用手册，提问时可引用手册内容，回答更贴合实际用法。
  - 助手提示词独立成文本并调整了语气与手册来源说明，对话风格更自然一致。
  稳定性与体验改进
  通知浮层高度现已计入窗口尺寸测算，矮窗口下提示不再被裁切；同时跳过 GitHub wiki 元页面，修复内嵌手册构建失败的问题。
  开发者备注：助手历史上下文预算由 64K 提升至 128K，长对话可保留更多轮次；工具调用过渡消息已单独拆分，便于后续扩展与调试。
