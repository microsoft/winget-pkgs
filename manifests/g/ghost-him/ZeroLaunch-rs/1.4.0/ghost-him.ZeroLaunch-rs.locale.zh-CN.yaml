ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  本次版本以插件市场与搜索匹配能力升级为核心，并完成插件协议 2.0 与存储层收敛。
  用户可见亮点
  - 新增插件市场页面：可从 GitHub topic 发现插件并一键安装，卡片免下载即可预览图标与清单信息。
  - 插件详情与安装更透明：安装确认页展示 manifest 信息，插件形态与触发条件分别可在详情页、设置页查看，必填元数据缺失将拒绝加载。
  - 搜索匹配更精准：子集匹配改为 BM25 稀有度加权并支持参数调节，亲和分支持前缀部分输入分级加成；输入路径或网址时直接给出可执行入口。
  稳定性与体验改进
  修复便携版启动即 panic、候选列表图标破图与卸载后动作重复膨胀、缓存淘汰阻塞异步运行时、组件运行态重启丢失、商店应用枚举被单批上限丢弃等问题。
  开发者备注：插件协议升级至 2.0 并移除宿主版本下限校验；存储层收敛为固定本地资源存储，已移除 WebDAV 与自定义保存路径；插件平台能力完成三层化重构。
