ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  本次更新以「AI 助手落地 + 结果过滤与命令能力增强」为主线。
  一句话版本定位：设置页迎来可对话的 AI 助手，搜索体验支持隐藏指定启动项并新增行内命令插件。
  用户可见亮点
  - 设置页新增「问 AI」助手：依据说明书与当前配置作答，支持多轮澄清、跳转对应设置项，反馈问题时先征得同意再生成 issue 草稿。
  - 结果页可按精确目标、目录或关键字隐藏启动项，右键菜单不再显示被隐藏项。
  - 新增 > 行内命令插件，统一命令执行能力；默认扫描公共桌面目录。
  - 托盘图标显示开关、搜索栏占位与输入对齐设置；插件市场改为 24 小时本地缓存并支持手动刷新。
  稳定性与体验改进
  双击 Ctrl 改用原始输入监听，不再干扰前台应用按键；修复窄窗口下书签来源列表被挤扁、计算器面板底部被裁切，以及规则库部分规则静默失效的问题。
  开发者备注：插件宿主已补齐能力暴露的四层链路，并启用零豁免审计；调试页新增 AI 助手轨迹面板，可回看上下文与工具调用结果。
