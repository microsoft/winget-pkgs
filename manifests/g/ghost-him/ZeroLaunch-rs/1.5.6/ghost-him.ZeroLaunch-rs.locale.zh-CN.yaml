ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  一句话版本定位：v1.5.6 聚焦图标管理与插件生命周期的完善，并强化发布后的日志与诊断能力。
  用户可见亮点
  - 图标管理整合：将“更改图标”并入图标页，新增“全部图标总览”页，可在一处查看和管理所有图标。
  - 图标加载失败会被记录并持久化保存，便于定位哪些图标没有正常显示。
  - 新增插件退出钩子，插件在退出时能够执行清理逻辑，内置插件与第三方插件的生命周期处理保持一致。
  - 设置界面简化：只包含单一组件的分类不再显示多余的组件页签。
  稳定性与体验改进：补齐发布后可定位问题的日志与诊断信息，并修复了只读入口场景下的等待问题，减少不必要的卡顿。
  开发者备注：本次统一了插件组件身份、能力位与内置执行器的注册方式，并移除了从未接通的插件通知通道及相关无用协议常量；第三方插件若涉及上述接口，建议对照新版协议核对。
