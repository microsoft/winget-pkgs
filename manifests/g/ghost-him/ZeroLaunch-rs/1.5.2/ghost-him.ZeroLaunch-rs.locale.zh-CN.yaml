ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  本次更新聚焦插件市场可用性与托盘交互细节的打磨。
  用户可见亮点
  - 插件市场卡片和页头新增 GitHub 查看入口，可直接跳转查看插件源码仓库。
  - 程序搜索中，本地化显示名替换后仍保留原始文件名作为检索关键词，中文名和原名都能搜到。
  - 修复托盘双击图标无法唤醒的问题，现在双击与全局快捷键效果一致。
  - 弱网环境下，插件市场不再用仓库所有者头像顶替插件图标，加载失败时沿用上次成功的元数据。
  稳定性与体验改进
  修复插件市场的元数据与日志问题：元数据获取失败时会记录日志，便于排查；设置中的助手导航按真实界面层级生成，分组语义更准确。
  内部层面调整了市场卡片元数据加载的失败回退策略与日志记录，属于架构级容错改进。
