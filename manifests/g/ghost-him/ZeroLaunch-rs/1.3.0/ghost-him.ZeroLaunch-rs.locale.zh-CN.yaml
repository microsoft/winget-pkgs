ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  一句话版本定位：第三方插件体系全面打通，插件开发与使用体验明显增强的版本。
  用户可见亮点
  - 恢复设置页第三方插件安装与重载入口，支持覆盖确认安装，插件管理页聚焦插件自身配置。
  - 沉浸式插件面板全链路落地，插件可跟随宿主主题色自动适配；插件支持搜索流水线组件，与内置对等。
  - 翻译插件改为调用宿主模型服务，无需再配置多个翻译引擎；宿主新增本地缓存与 embedding 相似度服务。
  稳定性与体验改进
  修复了卸载插件时子进程残留导致删除失败、第三方插件 host() 调用必崩溃、面板资源加载失败与升级后仍加载旧面板等问题；打包脚本支持 extra/ 目录随插件分发运行时文件。
  SDK crates 版本独立为 0.1.0 并采用 Apache-2.0 许可（主程序仍为 GPL-3.0-only），plugin-template 迁移至独立仓库，供插件开发者适配。
