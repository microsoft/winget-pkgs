ReleaseNotes: |-
  🤖 更新摘要
  🧑🔧 此更新摘要由 AI 基于 commit 历史自动生成
  v1.1.0：设置体验全面升级，插件生态进一步开放
  用户可见亮点：
  - 快捷键设置改为录制式交互，聚焦后按组合键即录入，并支持自定义上下选择键
  - 外观设置分组 tab 化，字体改为从系统字体列表直接选择，背景图片支持本地化标签
  - 插件支持自定义显示图标与详情弹窗，完全插件模式可通过热键唤醒全面板插件
  - 设置页新增内容完整的关于页，CLI 无参数运行自动健康检查并提示启动主程序
  稳定性与体验改进： 修复便携版数据目录解析、便携包误选 CLI、插件热键唤醒链路与元数据双副本等风险；收紧 LLM 脏输出解析并保护日志隐私；修复设置与调试页面滚动失效、保存配置无提示等体验问题。
