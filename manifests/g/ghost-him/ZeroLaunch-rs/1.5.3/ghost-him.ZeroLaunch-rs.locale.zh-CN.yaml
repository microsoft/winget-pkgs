ReleaseNotes: |-
  🤖 更新摘要
  🧑‍🔧 此更新摘要由 AI 基于 commit 历史自动生成
  本次更新集中修正交互逻辑中不符合常识之处，并清理了一批隐藏较深的缺陷。
  一句话版本定位：一次面向“交互符合直觉”的修漏补缺版本。
  用户可见亮点
  - 全局热键更可靠：单键不再被录成全局热键，保存失败不再无提示，旧热键也不会无故失效；无法生效的快捷键会被拦截并给出可读提示。
  - 插件加载失败后不再从列表消失、可正常重装；卸载第三方插件前增加二次确认。
  - 设置中的路径字段与扫描目录支持直接拖入文件或目录；参数面板拒绝空参数提交时会聚焦首个空字段并提示。
  - 界面语言默认跟随系统语言；安装监控默认开启，新装软件无需手动设置即可自动刷新索引。
  稳定性与体验改进
  英文界面残留中文、设置窗标题不随语言切换、字段按钮错位等细节已修正；本机 CLI 服务改为设置项可控并支持即时启停。
  开发者备注：以单一投影类型替代插件与配置的 DTO 镜像，投影类型统一由权威类型派生，下发载荷完成类型化。
