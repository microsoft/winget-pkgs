ShortDescription: A RomM desktop client for Windows, controller-first, in the look of RomM's v2 UI.
Description: |-
  Gargosy browses a RomM library, downloads games, installs and starts the emulators, and syncs saves and
  states with RomM, with a controller alone. It is portable: its games, emulators and profiles are kept in
  its own folder. Uninstalling with --purge, or from Windows' Installed apps, can delete them; back up the
  userdata folder first.
