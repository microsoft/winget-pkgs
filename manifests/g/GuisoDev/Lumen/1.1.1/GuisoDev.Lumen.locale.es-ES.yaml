PackageIdentifier: GuisoDev.Lumen
PackageVersion: 1.1.1
PackageLocale: es-ES
Publisher: GuisoDev
PackageName: Lumen
License: MIT
ShortDescription: Aplicación de escritorio para yt-dlp que descarga videos y música de más de 1.000 sitios.
Description: |-
  Lumen es una interfaz de escritorio para yt-dlp en Windows. Pega un enlace para ver el tamaño estimado
  de cada calidad, descarga video o solo audio, descarga solo un fragmento con vista previa del fotograma y
  del video, elige videos de listas o pon en cola varios enlaces a la vez. Incluye ffmpeg y deno. Interfaz
  en español e inglés.
