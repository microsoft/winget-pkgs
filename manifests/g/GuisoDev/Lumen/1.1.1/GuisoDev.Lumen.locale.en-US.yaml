ShortDescription: A polished desktop app for yt-dlp to download video and music from over 1,000 sites.
Description: |-
  Lumen is a Windows front end for yt-dlp. Paste a link to see the estimated size of every quality,
  download video or audio only, download just a clip with frame and video previews, pick videos from
  playlists or queue several links at once. ffmpeg and deno are bundled. English and Spanish interface.
