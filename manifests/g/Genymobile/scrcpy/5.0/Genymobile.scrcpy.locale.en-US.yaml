ReleaseNotes: |-
  To receive a notification when a new release is available, click on Watch > Custom > Releases at the top.
  scrcpy v5.0
  Changes since v4.1:
  - Add hardware decoding (#7057, #7001, #1894, #1672)
  - Improve video buffering (#7057)
  - Capture all audio usages in audio playback capture mode (#6975)
  - Use ANDROID_SERIAL in OTG mode (#7053)
  - Build Windows ARM64 releases (#6857)
  - Fix dropped keys in UHID for some keyboard layouts (#6983, #6990)
  - Fix AltGr forwarding on some layouts (#7050, #7051)
  - Fix --time-limit data race (#7029)
  - Fix --no-mipmaps
  - Avoid "camera capture failed" warnings on stop (#7018)
  - Generate mipmaps for all YV12 planes (#7034)
  - Upgrade platform-tools (adb) to 37.0.1
  - Upgrade FFmpeg to 9.0.2
  - Upgrade SDL to 3.4.18
  - Upgrade dav1d to 1.5.4
  - Various technical fixes
  Highlights

  Hardware decoding
  The video stream is now decoded in hardware on the computer, when possible.
  Decoding is faster, CPU usage drops by 10×, and power consumption is lower.
  Hardware decoding is enabled by default. Use --hwdec to select a specific decoder, or --hwdec=disabled to force software decoding:
  scrcpy --hwdec=auto          # use hardware decoding if possible (default)
  scrcpy --hwdec=disabled      # software decoding
  scrcpy --hwdec=vaapi         # VA-API, Linux only
  scrcpy --hwdec=d3d11va       # D3D11VA, Windows only
  scrcpy --hwdec=videotoolbox  # VideoToolbox, macOS only
  With --hwdec=auto (or when the option is not passed at all), scrcpy falls back to software decoding if the hardware decoder cannot handle the stream.
  On Linux, VA-API requires the GPU's VA-API driver (va-driver-all on Debian/Ubuntu).
  See video documentation, #7001 and #7057 for details.
