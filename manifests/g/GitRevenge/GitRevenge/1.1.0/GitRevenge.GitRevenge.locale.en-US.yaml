ShortDescription: A fast, local-only desktop git client, built for very large repositories.
Description: Git Revenge is a free desktop git client that stays fast on huge repositories. It drives the git you already have installed, so your config, hooks, credential helpers and SSH agent work as they do in a terminal. There are no accounts, no cloud features, no telemetry and no AI.
