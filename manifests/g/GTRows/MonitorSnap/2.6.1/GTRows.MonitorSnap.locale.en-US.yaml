ShortDescription: Save and restore Windows display configurations from the app, tray menu, or a global hotkey.
Description: |-
  MonitorSnap saves Windows display configurations and restores them from a desktop
  app, system tray menu, or global hotkey. Presets capture display topology,
  positions, resolutions, refresh rates, rotation, and the primary display.
  Designed for multi-monitor desks, KVM switches, docking stations, and TVs.
  The Python backend is bundled; end users do not need Python or Node.js installed.
  Display presets are stored locally. The app checks GitHub Releases for updates.
