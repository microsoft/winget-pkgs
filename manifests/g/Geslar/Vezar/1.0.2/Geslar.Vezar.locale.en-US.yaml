ShortDescription: One VPN client for Windows - IKEv2, IPsec, L2TP/IPsec, SSTP, OpenVPN, WireGuard and SSL VPN in one app.
Description: |-
  Geslar Vezar connects to the VPNs you already have from one app - FortiGate, Cisco, MikroTik, pfSense, OPNsense,
  Sophos, Windows Server and more - without installing the vendors' clients. IKEv2, IPsec (IKEv1), L2TP/IPsec, SSTP,
  OpenVPN, WireGuard and SSL VPN for Fortinet and Cisco AnyConnect. Imports .ovpn, .conf, .pcf, FortiClient and
  Windows VPN connections. Passwords encrypted for your Windows account, leak protection, signed updates; silent MSI
  install and settings locked through GPO (ADMX). Vezar is not a VPN service: it connects to your company's or
  client's VPN. Free, no sign-up.
