License: MIT
LicenseUrl: https://github.com/guscatalano/Groundhog/blob/main/LICENSE
ShortDescription: Brings a fresh Windows machine to a known state from one declarative file.
Description: |-
  Groundhog applies a Groundhogfile (YAML or JSON) to the machine it runs on: apps, files,
  environment, registry, Windows features, users, certificates, services, firewall rules,
  desktop settings and custom steps. It resumes after restarts, runs only what changed, and
  can preview what an apply would do. Meant for VM templates, sandboxes and dev machines.
