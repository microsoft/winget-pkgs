ReleaseNotes: |-
  📂 Folders now available in the Project Manager
  Use folders to organize scenes, external layouts, external events and gameplay tests in the project manager. This is helpful for large games, for example when you have a lot of external layouts for multiple levels in a game.

  🤖 Connect GDevelop to your local AI agent ("MCP")
  An experimental "MCP" connection is now available to plug your own agent to GDevelop's tools. This is useful if you want to experiment building, debugging or learning with an AI agent like Claude Code, Codex, etc...

  Read more about how to setup a local agent in the documentation. This MCP, and the integrated GDevelop AI agent, will be improved if they are proving useful.
  🌊 New ready-to-use 3D water and liquids
  When adding a new 3D water object to your scene, you can now select a ready-made version from the GDevelop asset store:

  They work well with the 3D terrains or, more generally, any 3D game.
  💝 Improvements
  - Make gameplay tests more reliable and support multiplayer games
  - Add a "synchronized over the network" setting to behaviors:
    - When disabled, behaviors are not synchronized, which is useful for behaviors like "Input Mappers".
  - Add a shadow normal bias to directional lights to avoid shadow acne.
  - Add Bluesky to the community links of the profile
  - Redesign the order of the properties of 3D boxes in the properties panel.
    - For custom objects and custom behaviors, properties are shown grouped per folder, and the groups are following the same order as these folders.
  - Add pre-made effects that can be added to objects or 2d layers (tints & status colors)
  - Add conversions across the boundary of custom objects ("ToParent"/"FromParent" expressions)
    - Also add 3D versions of distances conditions/expressions and "turned toward" condition.
  - Use the discrete graphics card and warn when the 3D rendering is slow (useful for devices with multiple GPUs or with hardware acceleration disabled)
  - Load big projects faster and use less memory to load and save them.
  - Show 3D model previews as icons of 3D objects and model resources.
  🐛 Bug fixes
  - Prevent crash from stale multiplayer heartbeat answers (thanks @dajiaohuang!)
  - Fix crash of the 3D editor when adding an object with 3D physics from the asset store
  - Fix instances placed in a scene being deleted on players when the scene is slow to load (multiplayer)
  - Fix some memory leaks in the editor
  - Fix object changes reverted in the in-game editor after switching editors
  - Fix 3D layers wrongly not antialiased when they have post-processing effects
  - Fix some crashes when an Array variable get holes
  - Fix default value for 'block-on-diagnostic-errors' when not specified in the CLI (Thanks @ViktorVovk!)
  - Fix stencil buffer not available on 3D layers with post-processing effects.
  - Fix some effects display, especially CRT
  - Fix crash of the user chip when the profile has no username nor email.
  - Fix othographic camera scale according to the world scale
  ⚙️ Extensions
  - Set the "mapper" behaviors as not synchronized over the network by default: they translate the inputs of the local player: on the copies of objects owned by other players. They must stay deactivated instead of being re-activated by the owner's game.
  - [Reviewed][Mouse pointer lock] Fix touch look on mobile and screen-ratio-dependent mouse speed (v0.3.2)
  - [Reviewed] Move 3D terrain and 3D water to reviewed extensions
  - [Foliage swaying 3D] Improve performance and fix PBR consistency (v1.3.1)
  - [Marching Squares] Fix drawing only the screen on a 3D layer (v0.6.2)
  - [Pinching gesture] Fix converting positions to the scene on a 3D layer (v1.2.2)
  🎨 Assets
  - Add 6 new assets packs from Elv:
    - Dark Castle Tileset 16x16 Pixel Art
    - Fantasy Dreamland Enchanted Forest
    - Fantasy Dreamland Dungeons 2
    - Fantasy Dreamland Dreams
    - Fantasy Dreamland Castle
    - Fantasy Dreamland Blacksmith Workshop
  - The Fantasy Dreamland Bundle get 7 new packs for the same price, get 30+ pack in it on the Asset Store
  - Fix the orientation metadata of 3D models
  - Add 287 new sound effects from the "RPG Loot & Inventory SFX" audio pack by REEBOO Labs
  - Updated most of the the Kenney.nl 3D packs
  🕹 Premium Game Templates
  - FPS 3D Multiplayer (S.W.A.T. Farm): Better map with Terrain3D.
  - The Open Wild: 3D Open World:
    - Replaced the original terrain and ocean models with Terrain3D and Water3D.
    - Improved grass, vegetation and rock placement using TerrainGrass and ScatteredModels.
    - Added NavMesh pathfinding and improved lighting, shadows and visual effects.
    - Optimized models, textures and draw distances for better performance and removed unused resources.
  - 3D Survival Game:
    - Replaced the original map and lake models with Terrain3D and Water3D.
    - Optimized vegetation with TerrainGrass and ScatteredModels, replacing 30,000 JavaScript-spawned grass objects.
    - Improved animal AI with NavMesh pathfinding and added lighting, fog and tone mapping.
    - Optimized shaders, character models and scene performance, updated the resolution to 1920 × 1080, and fixed player animation speeds.
  - Soul of Valor Soulslike Fantasy: Updated Light3D and other extensions.
  - Shellwar Combat Unleashed: Updated A3F to 1.6.0.
  - Five Levels Horror with Camera System: Updated A3F to 1.6.0.
  - Cubic World: Updated extensions to ensure the game works with newer versions of the engine.
  - Chess Template: Updated extensions and added an outline to selected pieces.
  - Weather App: Minor bug fixes.
