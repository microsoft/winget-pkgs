      - Village 2 Seasons
    - Farming Characters Pack: 1, 2, 3, 4
  - Add new packs by Barely Apes:
    - 2D Pixel Quest Vol.17 - The Free Blades
    - 2D Pixel Quest Vol.18 - The Siege Engines
  - Add 3D Space Skyboxes by Kenney.nl
  - 18 New 3D packs from Kenney.nl, KayKit and Quaternius
  🕹 Premium Game Templates
  - Add a new Horror game by Charuse
  - Add a physics-based game in the style of World of Goo by @PoPi_Game_Studio.
  - Add a new Rubik's Cube 3D puzzle game by Bouh
  🐛 Bug fixes
  - Fix 3D instance opacity, flip and scale not updated on undo
  - Prevent selecting an instance on drop in 2D editor
  - Fix preview not starting when cache storage is full
  - Fix correctly flagging non-existing behaviors for free behaviors property fields
  - Fix blur effects showing a border on screen edges and 3D effects hiding the layers below
  - Fix global object instances now having their layer reset after copied on a new scene if it does not exist
  - Fix skyboxes orientations that were not standard cube
  - NavMesh fixes:
    - Fix navmesh characters rotating to 0° at start
    - Fix NavMesh memory leaks
  - Fix parallel AI work being wrongly stopped when asking for edit approval
  - Fix custom object gameplay test warning
  - Fix resizing an instance with aspectRatio activated to 0, causing it to break
  - Fix scroll in input randomly not working and number inputs missing
  - Fix various 3D editor issues (layers and rescaling)
  - Fix empty optional field wrongly shown as errored
  - Massively improve bad translations across multiple languages
  🛠 Internal changes (for developers)
  - Add micro and macro benchmarks on CI
