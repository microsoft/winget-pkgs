ReleaseNotes: |-
  🌤️ New, ready to use 2D/3D particle effects, skyboxes and fog
  Effects can now be added from the Asset store, starting with 3D skyboxes and 3D fogs:

  |     |     |
  | --- | --- |

  Many new 2D and 3D particle emitters are also available in the asset store:

  |     |     |
  | --- | --- |

  |     |
  | --- |

  💝 Improvements
  - Multiple UI improvements:
    - Preferences : redesigned preferences dialog and keyboard shortcuts,
    - Resources editor: allow selecting multiple resources and apply common actions (smooth image, delete),
    - Scene editor shortcuts now work without having to click on the canvas first.
  - Improved autocompletion and error messages based on variable types:
    - Autocompletion is available for bracket access on structures and arrays (MyVariable[...]).
    - Suggestions are now only showing variables with a relevant type.
    - Error messages are improved when brackets are left empty. An error message is also shown when a string, number or boolean variable is used where a structure or an array is expected (and vice versa).
    - Fixed autocompletion of variable parameters in function calls wrongly suggesting objects and functions.
  - Multiple improvements for the AI agent:
    - Files can now be attached to chat messages (and used in the game if needed),
    - The agent can now take and analyze screenshots of the game, making it more useful,
    - External layouts are now supported,
    - The agent can now read, create and modify extensions (custom functions, objects and behaviors). This is useful to create reusable, modular game logic or advanced objects.
  - Add a new action to tween the camera Z position
  - Add support for the m4a audio format
  - Performance improvements: textures embedded in 3D models are now shared in memory.
    - Geometries, materials and textures are also properly disposed of when an object is no longer used, avoiding memory leaks
  - Make "Enable AI for students" button more visible in the Education dashboard.
  🐛 Bug fixes
  - Automatically opt out of iPad multitasking, which is required to publish on the App Store
  - Prevent the 3D platformer character from jumping again after falling off a platform
  - Fix .gdo imports missing objects and failing on some resources
  - Fix the object dialog overflowing on mobile
  - Fix nested variables being displayed as null in the debugger
  - The tween opacity action is now only shown for compatible objects
  - Fix sprite points being misaligned in previews when the system text size is increased
  - Fix the "has just been dragged" condition staying true when the behavior is deactivated
  - Fix the Escape key not correctly deselecting elements in the editor
  - Fix cloud project resources shown as error after using the editor for a long time.
  - Prevent locked instances from being deleted in the 3D editor
  - Prevent menu items from opening on drag (for instance, opening a scene while dragging it)
  - Special characters in resource names are now correctly encoded and decoded, and audio loading error messages are clearer
  - Warn and block code redemption when the subscription was purchased on mobile, as it can't be cancelled automatically
  ⚙️ Extensions
  - [Reviewed] [PlaygamaBridge] Post rewards and launch data for Social/Platform, Reddit, Samsung Instant Plays and Playgama Sandbox platforms
  - [Reviewed] [3D particle emitter] Add an emission zone radius
  - [Experimental] [Advanced 3D Features] Add split-screen for 3D scenes - Thanks @PANDAKO-GitHub!
    - Add an action to split the 3D scene view.
    - Add a behavior that renders a 3D camera view onto the texture of a 3D box.
  🎨 Assets
  - Add ready-to-use particle emitters: 17 3D and 10 2D, plus 7 more covering the most common remaining needs
  - Add a new free 3D character model by ManNeko: Low Poly Girl
  - Add 4 new TopDown Action RPG Enemies packs: Pack 1, Pack 2, Pack 3 and Pack 4
  - Add 6 new pixel art packs by Barely Apes:
    - 2D Pixel Quest Vol.11 - The Village
    - 2D Pixel Quest Vol.12 - The NPCs
    - 2D Pixel Quest Vol.13 - The Druidess
    - 2D Pixel Quest Vol.14 - The Infernal Boss
    - 2D Pixel Quest Vol.15 - The Demons Domain
    - 2D Pixel Quest Vol.16 - The Arachne
  - Update the 2D Pixel Quest Vol.1 - The Dungeon pack by Barely Apes
  - Add the "Sound Of Science And Space" CC0 music pack by O.B_games (11 tracks), available in the resource store when choosing an audio file
  - Fix the orientation of a few assets and set themes for starters
  🕹 Premium Game Templates
  - Ludo: The classic board game, playable solo or with up to 4 players locally.
  - Monument Quizz: Guess how tall the monuments are.
  - The Open Wild: A simple 3D open world in the style of Red Dead Redemption.
  - Water Showcase: 9 new realistic water and lava objects, including pixel art and a toxic slime, all with multiple properties and an underwater color effect.
  - Kittydoku: A cozy, cat-themed take on Sudoku and Minesweeper, inspired by Meowdoku.
