ShortDescription: Sharpen any prompt. A Windows tray app that turns rough prompts into well-structured ones.
Description: |-
  Kenma lives in your system tray and turns rough prompts into clear, well-structured prompts for ChatGPT,
  Claude, Gemini, coding agents and image models. It works with Anthropic, OpenAI, Gemini, OpenRouter,
  Claude Code, Ollama and LM Studio, and falls back to an offline template when no AI is available.
