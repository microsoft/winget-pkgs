ReleaseNotes: |-
  Changes since v0.8.2. (0.8.3 was never published; everything from it is included here.)
  New
  - QO-100 PSK beacon monitor and Lock LNB. With a transverter covering 10489.750 MHz, the PSK Beacon button opens a panel that finds the middle beacon on the receiver's IQ, decodes its text pages, and tracks it. Lock LNB corrects the LNB's drift from the beacon so displayed frequencies stay right. When the span is wide enough (768 kHz or more), the monitor first looks for the lower and upper CW beacons 500 kHz apart, so an LNB error of up to ~130 kHz is found. The correction is saved across restarts, and the panel can be minimised to a narrow strip. A demo video is linked from the README.
  - Duplex: receive on VFO A while transmitting on VFO B (for full-duplex radios and QO-100), with a small TX spectrum inset showing the TX filter. The button sits next to CTUN.
  - VFO B has its own transverter, so an uplink and a downlink can each have their own offset. VFO B is shown and entered in the transverter's RF frequency, and A>B, B>A and A<>B carry the transverter with the frequency.
  - SAT / SATR: satellite VFO tracking. Tuning one VFO moves the other the same way (SAT) or the opposite way (SATR). There is a MIDI action for it.
  - Squelch for FM, SSB/DSB and AM/SAM: an SQL button and level slider next to Audio gain, on the main and extra receivers.
  - Alt+scroll tunes in 10 Hz steps in every mode. DIGU/DIGL filters now start at 0 Hz instead of 150 Hz.
  - HL2: N2ADR IO board support (#4). The board is detected automatically and is sent the TX frequency, the RX frequency code and the J9/J10 input selection.
  - Transverters remember their own frequency, mode and levels (#4), instead of overwriting the HF band their IF falls in.
  - Ozy: Atlas clock-source settings in Settings → RX, and the Atlas bus configuration bits are now set (#8). These are not yet tested on Ozy hardware.
  - Linux: native Wayland by default, with GNOME-style title bars. Discovery is shown inside the main window under Wayland. HPSDR_FORCE_X11=1 still forces X11.
  - Upgraded to egui/eframe 0.37. The audio waveform now shows 750 ms.
  Fixes
  - Tune put a carrier on the TX frequency itself, outside the TX filter, until the mode or filter width was changed. It is now a tone at the filter's midpoint.
  - TX through a transverter was blocked when the IF was outside a ham band (for example a 2 m transverter with a 29.85 MHz IF). TX is now allowed when the RF frequency is inside the transverter's configured range.
  - HL2 uncalibrated TX power was only ~0.25 W at maximum. The default PA gain now reaches full drive (#13).
  - Metis/HermesLite on Protocol 1 could panic on connect because of PureSignal's receiver reservation (#12).
  - RTL-SDR/MSI.SDR at 1536k had output 48 dB low, which meant no audio.
  - MSI.SDR on Windows:
    - Starting failed with error 87.
    - Changing the sample rate left the stream stalled. The stick is no longer reopened for a rate change.
    - Restarting the app without replugging the stick now gives a clear "replug" message instead of an empty spectrum.
  - Scroll-to-tune could use the wrong step when Shift was pressed or released mid-scroll.
  - Linux packages: libxkbcommon(-x11) is now bundled in the AppImage and declared in the .deb/.rpm (#14).
  - UI after the egui upgrade:
    - The S-meter and TX meter end labels were cut off.
    - XVTR names were squeezed.
    - The Zoom/Pan Reset button was pushed off the edge of its row.
  - Squelch settings are kept when a receiver's DSP is rebuilt.
  - Click-to-tune and the hover readout round the displayed frequency, not the IF.
  - Manual screenshots have been refreshed and missing ones added.
  Downloads
  - Linux AppImage (x86_64 / aarch64): hpsdr-rs-0.8.4-x86_64.AppImage, hpsdr-rs-0.8.4-aarch64.AppImage. Run chmod +x on the file, then run it. USB radios still need the udev rules installed by hand; a copy is inside the AppImage under usr/share/doc/hpsdr-rs.
  - Debian/Ubuntu (amd64): hpsdr-rs_0.8.4-1_amd64.deb. Install with sudo apt install ./hpsdr-rs_0.8.4-1_amd64.deb.
  - Debian/Ubuntu/Raspberry Pi OS (arm64): hpsdr-rs_0.8.4-1_arm64.deb. Install with sudo apt install ./hpsdr-rs_0.8.4-1_arm64.deb.
  - Fedora/openSUSE RPM (x86_64 / aarch64): hpsdr-rs-0.8.4-1.x86_64.rpm, hpsdr-rs-0.8.4-1.aarch64.rpm. Install with sudo dnf install ./hpsdr-rs-0.8.4-1.x86_64.rpm, or on openSUSE sudo zypper install --allow-unsigned-rpm ./hpsdr-rs-0.8.4-1.x86_64.rpm.
  - macOS (Apple Silicon): hpsdr-rs-0.8.4-macos-arm64.tar.gz. It is built in CI, unsigned and not notarized, so Gatekeeper warns on first launch. Right-click the hpsdr-rs binary and choose Open, or run xattr -d com.apple.quarantine hpsdr-rs first.
  - Windows (x86_64): hpsdr-rs-0.8.4-x86_64.msi
