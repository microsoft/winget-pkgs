ShortDescription: The battery level of your wireless mouse, keyboard, headset, speaker and controller, right on the Windows taskbar.
Description: |-
  Juice reads the battery level of wireless devices straight from the hardware, without the vendor's software,
  and shows it on its own taskbar button (progress bar and badge), in a compact window and in the tray.
  Logitech HID++ (LIGHTSPEED, Unifying, Bolt, Bluetooth), Bluetooth headsets and earbuds, JBL speakers,
  AirPods/Beats, Xbox and PlayStation controllers. A single small exe, no service, no internet access.
