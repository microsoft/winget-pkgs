ShortDescription: A bateria do seu mouse, teclado, headset, caixa de som e controle sem fio, direto na barra de tarefas do Windows.
Description: |-
  O Juice lê o nível de bateria de dispositivos sem fio direto do hardware, sem o software do fabricante, e mostra
  no botão do próprio app na barra de tarefas (barra de progresso e selo), numa janela compacta e na bandeja.
  Logitech HID++ (LIGHTSPEED, Unifying, Bolt, Bluetooth), fones Bluetooth, caixas JBL, AirPods/Beats e controles
  de Xbox e PlayStation. Um único exe pequeno, sem serviço e sem acesso à internet.
