ReleaseNotes: |-
  0.4.0 — 2026-10-27
  这一版集中补上外观自定义：界面、全屏歌词、桌面歌词与迷你播放器的字体可以分别选择，
  全屏歌词新增页内外观面板，字号、行距、对齐、高亮色与位置偏移都能直接调；
  亚克力材质统一到一处并可整体关闭，设置里还能指定启动页。
  另需说明：0.3.0 的更新记录里提到的「自定义字体」因发版时未包含在包内，实际从这一版开始提供。
  新增
  - 自定义字体 —— 界面、全屏歌词、桌面歌词与迷你播放器四处字体独立设置。界面字体在「设置 → 外观」选择后重启生效，歌词几处改完即时重排；所选字体不可用时回退默认。
  - 字体选择器 —— 已装字体按中文、西文、符号分组，显示本地化字体名，未安装的旧选择单独列出。
  - 歌词外观面板 —— 全屏歌词左侧滑出面板，可调字体、字号、行距、对齐、高亮颜色以及水平与垂直偏移。改动即时作用到当前歌词并保存，重启后保持。
  - 启动页 —— 「设置 → 外观」指定启动后进入的页面，默认「我喜欢的」；未登录时会落到发现页。
  - 亚克力开关 —— 弹层、对话框、设置卡片、首页与榜单卡片统一使用同一套亚克力材质；开关关闭后全部退回纯色。
  - 托盘「重启」 —— 托盘菜单新增重启项，刚改完、需要重启生效的设置可以直接从这里应用。
  - 更新提示 —— 「关于」页的新版标签改为强调色胶囊并显示升级箭头；更新说明支持引用块与行内代码排版。
  修复
  - 歌词滚动 —— 载入新歌时歌词会先自己跳一段；现在等播放进度真正开始才启动滚动。
  - 播放队列删除 —— 删除队列行时下面的行会硬跳一格；现在被删的行向右淡出，其余行平滑上移。
  - 点赞与分享计数 —— 数字变长后会被徽章截断；现在徽章随文本变宽，完整显示。
  - 浅色主题 —— 浅色下的对话框缺少亚克力底、下拉菜单选中项显示为强调色竖条、滑块与开关等控件混用系统蓝。现在对话框恢复亚克力，选中项统一用底色，强调色全部改为品牌色。
  - 设置页行高 —— 没有描述的行过高，重置歌词那一行与相邻行高度也不一致；现在按内容收紧并对齐。
  - 评论排序 —— 排序切换组没有对齐；现在居中显示。
  变更
  - 桌面歌词鼠标穿透 —— 默认关闭，打开歌词条即可直接拖动；需要点穿时用工具栏按钮或设置里的开关开启。
  致谢
  - @KiwiR1der —— 自定义字体（#2）
