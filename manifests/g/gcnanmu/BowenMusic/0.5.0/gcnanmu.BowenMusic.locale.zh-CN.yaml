ReleaseNotes: |-
  0.5.0 — 2026-10-30
  这一版修好了歌词页与 MV 页离开后内存不回落的问题，切歌和拖动进度条的等待明显缩短；
  播放队列的拖动排序在长列表里也能正常使用了。
  修复
  - 歌词页内存 —— 反复进出歌词页后内存只涨不降，每次约 5 MB；现在复用同一份页面并保留画布设备，离开后不再累积。
  - MV 页内存 —— 每次打开 MV 页都会留下整页资源；现在离开时一并释放，页面可以被回收。
  - 歌词页拖动与切歌 —— 在歌词页反复拖动进度条或连续切歌后，内存只涨不降；现在跳转落定、换歌与离开页面时会归还画布缓存。
  - 切歌速度 —— 点下一首要等约 1 秒才开始播放；现在会提前取好下一首的音源，切换明显更快。
  - 拖动进度条 —— 拖到尚未缓冲的位置要停 1–2 秒，歌词还会先滚一段；现在已缓冲的位置约 0.1 秒出声，歌词停在目标句等声音接上。
  - 最近播放 —— 超出上限的历史文件会被整份读入内存；现在读取时按上限裁剪。
  - 播放队列拖动排序 —— 长队列里只能把歌拖到当前一屏，松手后列表还会跳回顶部；现在拖到列表上下边缘会自动滚动，松手停在拖动停下的位置。
  已知问题
  - 内存占用 —— 浏览较多页面后内存会有所上升，达到一定量后不再继续增长；这是 WinUI 合成层自身的缓存，不是应用泄漏，退出重开可完全释放。
