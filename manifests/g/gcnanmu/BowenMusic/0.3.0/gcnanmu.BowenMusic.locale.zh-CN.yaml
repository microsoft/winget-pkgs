ReleaseNotes: |-
  0.3.0 — 2026-10-24
  这一版重点打磨歌词页与播放器：双语歌词成组平滑滚动，歌词页的出入场与封面飞行动画联动，
  播放模式新增单曲循环，列表里的长标题可以悬停查看完整内容。另有一处需要注意：程序标识统一改为
  Bowen，可执行文件更名为 BowenMusic.exe，已固定在任务栏的旧图标会失效，需要重新固定一次。
  便携版用户注意：不要直接把新包解压覆盖到旧目录，旧的 Bodian.WinUI.exe 会留在原处，快捷方式仍会启动上一版。请解压到新目录；若沿用旧目录，覆盖后手动删掉旧的 Bodian.WinUI.exe。
  新增
  - 单曲循环 —— 播放模式新增第四档，当前曲目自然放完后从头再来。手动切上一首、下一首仍按队列走，不受影响。
  - 歌词当前行高亮 —— 正在唱的那一行整行铺一层高亮底色，不再只有文字变色。
  - 歌词页出入场动画 —— 进入时顶栏、播放控制与歌词内容按顺序分层淡入，跟封面飞行同一个节奏；退出时内容上浮淡出、背景单独淡出，不再整块消失。
  - 多艺人专辑 —— 合作专辑的头部显示「首位 等 N 人」，点击可展开全部艺人；单艺人专辑的头部头像也恢复了进入/返回两向的封面动画。自己创建的歌单现在会显示作者。
  - 长文本悬停滚动 —— 曲目列表、搜索结果、发现页以及艺人/专辑名称被截断时，鼠标悬停会滚到末尾再回来。
  - 通知条动效 —— 通知出现和消失改为淡入淡出并轻微上浮，连续多条切换时不再闪。
  - 托盘正在播放 —— 标题与歌手分两行显示，长标题不会被提前截断。
  - 背景氛围色 —— 白底、浅色封面不再被算成白色而退回默认配色，更多歌曲会有自己的背景色；切歌时新旧颜色在 650ms 内过渡，不再硬切。
  - 窗口尺寸 —— 默认窗口尺寸调整为 957×793（逻辑像素），并作为各 DPI 下的最小尺寸，避免窗口缩得太小后播放条被裁。
  修复
  - 双语歌词滚动 —— 原文与翻译原先各自滚动、容易错位，空行和分隔行还会占掉一整行。现在两行作为一组移动，空行不再显示。
  - 歌词页打开与收起 —— 从托盘恢复上次播放位置后，歌词页打开是空白的；退出歌词页时最后画面还会闪一下。现在会正常载入并停在当前行，退出时按分层方式淡出。
  - 全屏被任务栏遮挡 —— 全屏时任务栏仍盖在窗口上方；现在使用系统全屏，并在歌词页与 MV 页之间切换时保持全屏。
  - 浅色主题 —— 按钮悬停没有底色，歌词页和 MV 页的下拉菜单仍是深色，窗口失焦时标题栏整条变灰；三处都已跟随主题修正。
  - 搜索 —— 下拉选项与分区标题不对齐、还会被滚动条压住，概览页的分区标题只有「更多」能点。现在选项对齐、各列表独立滚动，点标题整行即可进入分类。
  - 导航 —— 返回后光标会被抢进搜索框；从歌词/MV 返回时列表弹回顶部并重播入场动画。现在返回不再抢焦点，列表也保留离开时的位置。
  - 迷你播放器 —— 「回到主界面」按钮在主窗口已隐藏时点了没反应，标题与歌手的基线也不齐；两者都已修正。
  - 登录框 —— 首次打开时二维码不显示，已登录状态下打开还会立刻关闭。现在打开即可扫码，同一个入口也能用来添加账号。
  - 切换账号 —— 发现页仍停留在上一个账号的推荐，详情页的收藏/关注状态也不更新；现在都会按新账号刷新。
  - 发现页长标题 —— 长标题会溢出卡片并把 VIP 徽章挤出可视区；现在截断显示，徽章始终保留。
  - 歌单封面空白 —— 部分歌单的封面地址已失效，列表里显示空白；现在会自动改用详情里的可用封面并缓存。
  - MV 加载 —— 视频加载期间没有任何提示；现在会显示加载指示。
  - 焦点环残留 —— 用鼠标打开评论面板或大图时，关闭按钮上残留一圈白色焦点框；现在只有键盘操作才显示焦点环。
  - 艺人简介卡顿 —— 展开艺人简介时整段文字一次性布局，首次展开明显卡顿；现在只渲染可见行。
  - 播放队列 —— 队列清空后播放条仍保留一首放不了的歌，歌词页也不跟着清空；删除队列行时下面的行会硬跳一格。现在会回到空状态，删除改为淡出退出、平滑让位。
  变更
  - 程序更名 —— 可执行文件由 Bodian.WinUI.exe 改为 BowenMusic.exe，任务管理器里的进程名随之变化。数据目录、安装位置、登录状态和设置都保持不变，安装版升级时会自动关闭并清理旧版文件。
  - 安装器升级 —— 升级时能正确识别并关闭 64 位进程，同时处理新旧程序名；文件被占用时会给出明确提示，而不是只报「无法写入文件」。
  - 任务栏固定项 —— 旧图标指向的文件已被清理，固定在任务栏上的旧入口会打不开，需要从开始菜单或桌面快捷方式重新固定一次。
  - 便携版升级 —— 便携版没有安装器负责清理，直接把新包解压覆盖到旧目录时，旧的 Bodian.WinUI.exe 会留在原处，旧快捷方式仍会启动上一版。建议解压到新目录；若沿用旧目录，覆盖后请删掉旧的 Bodian.WinUI.exe。
