ReleaseNotes: |-
  首个公开版本。面向 Windows 10 / 11 的非官方波点音乐桌面客户端，WinUI 3 + libmpv 实现：
  补齐官方 PC 端缺的评论与收藏歌单，并把播放状态交给系统媒体面板。

  新增

  - 系统媒体控制（SMTC）—— 播放状态、进度、封面与歌词交给系统媒体面板，Lyricify 这类第三方歌词工具能正常读到。开始菜单快捷方式带独立 AUMID，不与官方客户端互相顶掉。
  - 登录 —— 手机号与扫码两种方式，二维码本地渲染，不请求任何第三方接口。
  - 多账号 —— 记住多个账号、侧栏一键切换，切号不重新认证；凭据与账号清单用 Windows DPAPI 加密，只能由当前 Windows 用户解密。
  - 未登录也能用 —— 不登录即可进外壳浏览、搜索、试听；登录框可随手关掉，等碰到评论、收藏、自建歌单这类需要身份的功能再引导登录。
  - 全屏沉浸歌词 —— 透明封面背景、逐字渐变高亮、弹簧滚动、长音效果、真实音频频谱与封面倒影；支持点歌词跳转、滚轮浏览，播放时操作栏自动收起。
  - 桌面歌词 —— 独立的悬浮歌词条：悬停浮出控制、固定字形逐字高亮、双行对齐、鼠标穿透、锁定、拉伸与屏幕边缘吸附。
  - MV 播放 —— 曲目行角标、「更多」菜单、播放条三处入口；全窗沉浸播放，四种画面比例，看 MV 时自动暂停音频、退出后恢复。
  - 评论与回复 —— 看、发、赞、回复；楼层主题标识、数量角标、面板内图片缩放与拖动。
  - 四处收藏／关注 —— 歌曲、歌单、专辑、歌手都是两态按钮，取消操作先弹确认；侧栏里「收藏的歌单」与「收藏的专辑」分作两项。
  - 播放队列 —— 顺序播放 / 列表循环 / 列表随机三种模式并记住选择；右侧抽屉可切歌、删单曲、清空，另有「下一首播放」与「加入播放队列」两条入口。
  - 列表工具栏与多选 —— 歌曲列表页右上角统一提供「全部加入播放列表 / 多选 / 刷新」，多选后可批量加入喜欢、加入歌单；「我喜欢的」与自建歌单里还能批量移出。
  - 三档音质 —— 标准 / HQ / SQ 随手切换，播放器上只显示档位名。
  - 曲库 —— 侧栏曲库、自建歌单（新建 / 编辑 / 删除）、收藏的歌单与专辑、关注的歌手、最近播放。
  - 小窗与托盘 —— 透明圆角迷你播放器、贴边自动收起；关闭到托盘、单实例运行，重复启动会唤出已有窗口。
  - 设置页 —— 外观 / 播放 / 歌词 / 快捷键 / 存储 / 关于六类，含应用内快捷键改键、封面磁盘缓存与存储清理、版本与检查更新。
  - 精简音频栈 —— 自建 libmpv 音频构建，库体积从 115.22 MiB 裁到 7.97 MiB（−93.1%），只保留解码与输出必需的部分；随包分发，不需要额外安装播放器或编解码包。

  已知限制

  - 下载功能尚未实现（计划中）。官方 PC 端有下载，这个客户端暂时没有。
  - 更高音质档位依赖官方手机客户端，本客户端只提供标准 / HQ / SQ 三档。
  - 仅 x64，暂不支持 ARM64。
  - 不打包、不分发官方客户端的任何二进制；音源授权完全由服务端接口裁决，客户端不绕过任何权限。
