PackageIdentifier: gcnanmu.BowenMusic
PackageVersion: 0.1.0
PackageLocale: en-US
ShortDescription: An unofficial desktop client for Bowen Music.
Description: Bowen Music (波纹音乐) is an unofficial desktop client for Bowen Music built with WinUI 3 (Windows App SDK), .NET, and libmpv. It adds the comments and saved playlists missing from the official PC client, exposes playback state to the system media panel through SMTC, and offers immersive full-screen lyrics, desktop lyrics, MV playback, and multi-account sign-in.
