ReleaseNotes: |-
  0.8.0 — 2026-11-05
  这一版可以把歌词做成分享海报：勾选歌词、调整字体与配色后保存或复制图片；
  歌词外观同时新增黑胶唱片封面样式。另外，窗口最小尺寸在小屏与高 DPI 下的抖动已修好。
  新增
  - 歌词海报 —— 分享面板新增「制作歌词海报」，勾选歌词后生成带封面、歌名与二维码的图片，可保存或复制到剪贴板。
  - 海报自定义 —— 歌词字体、背景色与文字颜色可调，改动即时反映在预览；点击预览可放大查看，设置保留到下次启动。
  - 歌词文本复制 —— 海报选句面板底部可「复制歌词」，只复制已选行，不必先生成图片。（#9）
  - 黑胶唱片封面 —— 歌词外观新增「封面」样式，可在方形封面与黑胶唱片之间切换；播放时唱片匀速转动，切歌时换碟。
  变更
  - 分享按钮 —— 歌词页的分享按钮改为弹出面板，提供「复制分享链接」与「制作歌词海报」；其他页面的分享仍是一键复制链接。
  修复
  - 窗口尺寸抖动 —— 小屏或高 DPI 下，最小尺寸可能超过可用工作区，最大化后窗口尺寸来回跳；现在按工作区收敛，不再反复触发。（#8）
  - 均衡器图标 —— 图标在按钮里略偏左；现已居中。
  已知问题
  - 海报背景 —— 首版只支持纯色背景，不提供照片背景、整首长图与模板切换。
  致谢
  - @bluedvst —— 窗口尺寸重入修复（#8）
  - @WWW4R4E —— 歌词多选复制的需求（#9）
