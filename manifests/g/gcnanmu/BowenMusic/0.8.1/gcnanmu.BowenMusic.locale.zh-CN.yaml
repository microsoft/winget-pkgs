Description: 波纹音乐是一个非官方的波点音乐桌面客户端，基于 WinUI 3（Windows App SDK）+ .NET + libmpv 构建。补齐官方 PC 端缺失的评论与收藏歌单，通过 SMTC 将播放状态交给系统媒体面板，并提供全屏沉浸歌词、桌面歌词、MV 播放与多账号登录等功能。
