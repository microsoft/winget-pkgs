ReleaseNotes: |-
  0.8.1 — 2026-11-06
  这一版为歌词页新增两种封面样式：简易随身听与磁带机，都能直接在机身按键上操作播放；
  封面模糊背景的暗度、强度与未高亮歌词亮度也改为可调。加入歌单失败时现在能看到具体原因。
  新增
  - 简易随身听封面 —— 歌词页「封面」新增第三种样式，屏幕显示电量、时钟、封面、曲名、下一首与进度；方向键上下调音量、左右切歌，中央键播放暂停。
  - 磁带机封面 —— 新增第四种样式：银色便携磁带机，正面仓窗里能看到磁带与两个转动的磁轮，供带轮随播放进度变小、收带轮变满。切歌时仓门打开换带，底部实体按键可直接操作。
  - 外壳颜色 —— 两种播放器样式下可设机身颜色，支持预设、自定义取色与跟随封面；随身听与磁带分别保存。
  - 封面模糊背景 —— 外观面板新增暗度（0–80%）与模糊强度（0–80 DIP）两条滑杆，只在「封面模糊」背景显示。
  - 未高亮歌词亮度 —— 「歌词颜色」下新增不透明度滑杆（20%–100%），对所有背景模式生效。
  - 黑胶唱臂 —— 黑胶封面下点击唱臂即可切换播放与暂停。
  修复
  - 加入歌单失败提示 —— 失败时只显示「请稍后再试」，看不出是权限、曲目受限还是其他原因；现在优先显示服务端返回的说明。
  变更
  - 批量加入歌单结果 —— 写入完成即关闭弹窗，成功数量与失败原因改由底部通知条显示。
