ReleaseNotes: |-
  0.6.0 — 2026-10-31
  这一版把背景自定义从歌词页扩展到整个界面：常规页面可以在封面取色、Mica、自定义图片和纯色之间切换，歌词页也补齐了 Mica、图片与纯色背景；歌词模糊范围和译文显示也能单独调整。这些改动来自 #3 的反馈。
  新增
  - 窗口背景 —— 「设置 → 外观 → 窗口背景」新增封面取色、Mica、自定义图片、纯色四种模式，所有常规页面共用同一套背景；歌词页与 MV 页不受这里影响。（#3）
  - 封面取色 —— 背景颜色改为从封面提取多种真实颜色，深浅主题分别映射；灰阶封面不再跳成固定的青绿蓝紫。
  - Mica 着色 —— Mica 背景可以叠加一层封面氛围色，并跟随应用明暗；关闭后回到系统 Mica 原色。
  - 歌词页背景 —— 全屏歌词页新增 Mica、自定义图片与纯色背景；图片支持裁剪、暗度与模糊，纯色支持深浅预设、跟随封面和自定义取色。（#3）
  - 翻译显示 —— 歌词外观面板新增译文同步高亮、译文字号（50–100%）与译文间距（0–32 DIP）。
  - 边缘模糊 —— 歌词模糊距离改为从窗口上下边缘计算，范围可调（0–50%，默认 20%）；设为 0 可关闭。（#3）
  - 取色盘 —— 歌词页与界面背景共用同一个 HSV 取色盘；纯色背景的自定义颜色在浅色、深色下分别保存。
  修复
  - 长音节发光 —— 长音节的发光与浮起在 0.5.0 后消失，现在恢复；未播放的歌词仍不会整行缩放。
  - 译文高亮 —— 译文之前整行亮起，和原文不同步；现在跟随原文逐字扫过，断句间隙也保持连续。
  - 翻译开关 —— 离开歌词页再回来，翻译显示会被重新打开；现在保留当前选择。
  - 下拉菜单背景 —— 设置页下拉菜单发黑或过透；现在使用与应用一致的表面。
  - 下拉样式 —— 设置页下拉与字体选择器外观不一致；现在表面、边框、圆角、内边距与行高统一。
  - 标题栏拖动 —— 左侧图标与标题区域无法拖动窗口；现在可以正常拖动。（#4）
  - 退出歌词闪深色 —— 从歌词页返回常规页会先闪一帧深色 Mica；现在直接按当前主题显示。
  变更
  - 外观分组 —— 设置页「外观」拆成「界面外观」与「页面与输入」，纯色预设按当前主题显示对应的浅色或深色一套。
  - 弹层材质 —— 下拉、菜单、对话框与设置卡片使用同一套表面；关闭亚克力效果时一起退回实色。
  已知问题
  - Mica —— 需要 Windows 11；Windows 10 上选项置灰，背景回退到封面取色。
