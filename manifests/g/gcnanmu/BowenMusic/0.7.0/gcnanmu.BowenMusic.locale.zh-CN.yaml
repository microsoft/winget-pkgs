ReleaseNotes: |-
  0.7.0 — 2026-11-02
  这一版新增播放条与歌词页共用的本地音效面板，包含两组预设和可叠加的环境音；
  同时修好了退出歌词页时闪回详情页的问题。为内置环境音素材，安装包体积增加约 7 MB。
  新增
  - 音效面板 —— 播放条和歌词页新增音效入口，提供经典音效 8 套、增强音效 7 套，可随时开关，选择会保留到下次启动。
  - 环境音 —— 12 种环境音可与任意预设叠加，音量独立调节并实时生效。
  - 发现页一键加入 —— 「偶遇心动单曲」「心动收藏相似推荐」标题右侧新增加入按钮，可整组加入播放列表；刷新期间不可用。
  修复
  - 退出歌词闪回 —— 从歌词页进入专辑或歌手页再退回，退出歌词时会先露出那张详情页再闪一下；现在直接回到进入歌词前的页面，列表位置也会保留。
  已知问题
  - 音效为本地近似 —— 预设的曲线和命名按桌面端自行调整，与手机端不一一对应；DTS:X、臻品全景声不提供。
  - 黑胶底噪为合成素材 —— 长时间单曲循环可能听出约 30 秒的循环重复。
  - 3D 环绕为近似算法 —— 用回声展宽模拟空间感，包围感弱于真正的卷积混响。
