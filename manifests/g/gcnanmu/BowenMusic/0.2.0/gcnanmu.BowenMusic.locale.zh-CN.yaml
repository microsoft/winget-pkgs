ReleaseNotes: |-
  0.2.0 — 2026-10-14
  自首个公开版以来的第一轮功能更新：补齐应用内检查更新与安装，并把网络请求与系统代理隔离开。
  注意：常规请求（登录、歌单、封面）改为固定直连，不再跟随系统代理 —— 在必须靠代理才能上网的环境里，
  要到「设置 → 网络」里给检查更新指一条代理。
  新增
  - 检查更新与安装 —— 启动后自动检查（可在设置里关掉），有新版本时弹窗里直接显示这一版的说明。安装版可以在应用内下载安装包并一键启动安装；便携版引导到发布页自行下载。下载可随时取消，关掉应用会一并取消。
  - 网络与代理 —— 设置里新增「网络」分类。常规请求固定直连，不受系统代理影响；检查更新与安装包下载可以单独指定代理：不使用代理 / 跟随系统 / 自定义地址，地址支持带用户名密码。
  - 托盘「设置」 —— 托盘菜单新增一项，点击直接落到设置页；窗口已隐藏时也会先唤回主窗口。
  - 封面动效 —— 榜单页与曲库页的封面加入出入场与切换动画。
  修复
  - 从详情页返回后位置丢失 —— 返回时列表总是弹回顶部；现在回到离开时的位置。
  - 播放队列面板不跟手 —— 切歌时面板不会滚到正在播的那一行，而且面板自身的滚动位置会被重置；两者都已修正。
  - 播放队列被旧数据覆盖 —— 启动或切换账号时，队列会被上一次未登录时留下的旧队列盖掉，还会误弹一条「播放队列已切换」；现在按当前账号正确读取。
  - 托盘图标消失 —— 资源管理器重启之后托盘图标不再回来；现在会自动重建。
  - AI 歌单的大字标题不显示 —— 顶部那行英文大字标题从来不出现；现在加载完成后正常显示。
  - 长评论排版 —— 过长的评论会把面板撑变形，回复行也会错位；现在长正文折叠显示，回复行重新排布。
  - 设置页分类高亮色不一致 —— 分类栏的选中色与鼠标悬停底色深浅不同，移动时能看到两种颜色；现已统一。
  - 播放队列行闪烁 —— 打开队列时行列表会先闪一下再滚到正在播的那一行；现在直接落位。
  变更
  - 「关于」页的检查更新 —— 不再就地显示结果，改为打开一个对话框，与启动时的自动检查共用同一个。
  已知限制
  - 「网络」页的代理下拉可能出屏 —— 某些窗口尺寸下展开会超出屏幕。暂时可以选「跟随系统」，或直接改数据目录下的 proxy.json。
  - 便携版不做应用内更新 —— 会引导到发布页自行下载，这是有意的：便携版的更新是「解压覆盖掉自己所在的目录」，应用做不到。
