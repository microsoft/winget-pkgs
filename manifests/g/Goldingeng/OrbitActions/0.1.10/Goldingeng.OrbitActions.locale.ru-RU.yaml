PackageIdentifier: Goldingeng.OrbitActions
PackageVersion: 0.1.10
PackageLocale: ru-RU
Publisher: Goldingeng
PackageName: Orbit Actions
License: MIT
ShortDescription: Быстрое круговое меню для запуска программ в Windows, написанное на Rust.
Description: |-
  Orbit Actions - круговое меню (pie menu) для Windows 10 и 11. Открывается горячей клавишей или Alt + левый клик и одним кликом или жестом мыши запускает программы, сайты, файлы и папки, нажимает горячие клавиши, вводит макросы и выполняет скрипты.
  Это нативная переписанная на Rust версия меню Kando: те же темы и формат menus.json, но вместо Electron один небольшой процесс Win32, около 25 МБ памяти.
