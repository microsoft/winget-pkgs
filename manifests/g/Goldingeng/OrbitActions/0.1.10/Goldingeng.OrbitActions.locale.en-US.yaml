ShortDescription: Fast radial (pie) menu launcher for Windows, written in Rust.
Description: |-
  Orbit Actions is a radial (pie) menu for Windows 10 and 11. Open it with a hotkey or Alt + left click and launch apps, websites, files and folders, press hotkeys, type macros and run scripts with one click or mouse gesture.
  It is a native Rust rewrite of the Kando pie menu: the same themes and menus.json format, but one small Win32 process instead of Electron, using about 25 MB of memory.
