ReleaseNotes: |-
  Changes since Git for Windows v2.56.0 (September 28th 2026)
  New Features
  - Comes with OpenSSL v3.5.9.
  - To help with fixing stale references to the Git Credential Manager after Git for Windows v2.56.0's MINGW64 → UCRT64 migration, a compatibility shim is now installed.
  Bug Fixes
  - Suppressing the user-wide Git config via GIT_CONFIG_GLOBAL=NUL was broken in v2.56.0 (surprisingly, as a consequence of the MINGW64 → UCRT64 migration), which was fixed.
  - Fixed a bug in Git for Windows, v2.56.0, where the x64 Git executables lost their Authenticode signatures by mistake.
  - An assertion was fixed that caused pushes to fail when the server requires a client certificate.
