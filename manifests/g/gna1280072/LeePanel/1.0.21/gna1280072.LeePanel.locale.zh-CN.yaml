ShortDescription: 免费开源、零服务端代码的下一代 Linux 服务器管理面板桌面端，所有操作通过本地 SSH 完成。
Description: LeePanel 是一款开源的 Linux 服务器管理面板桌面端软件，所有操作通过本地 SSH 命令完成，服务器上不安装任何面板代码、不暴露多余端口，从根源消除面板自身的安全风险。基于 Tauri 2 + React 构建的轻量跨平台桌面应用，提供 SSH 终端与 SFTP 文件管理，支持 Nginx、MySQL/MariaDB、PHP、Redis、Docker、防火墙与免费 SSL 证书的统一管理。
