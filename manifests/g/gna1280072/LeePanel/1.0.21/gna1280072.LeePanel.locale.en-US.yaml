ShortDescription: A free and open-source, next-generation Linux server management panel desktop client. All operations are performed via SSH from your local machine, with zero server-side code.
Description: LeePanel is a free and open-source Linux server management panel desktop client. All operations are performed via SSH commands from your local machine, with no panel code installed on the server and no extra ports exposed, eliminating the panel's own security risks at the root. Built with Tauri 2 + React as a lightweight cross-platform desktop app, it provides an SSH terminal and SFTP file management, and manages Nginx, MySQL/MariaDB, PHP, Redis, Docker, firewalls, and free SSL certificates from a single native client.
