ShortDescription: A tool that turns any image into a data sample that is unsuitable for model training
Description: |-
  Nightshade transforms images into "poison" samples, so that models training on them without consent will see their models learn unpredictable behaviors that deviate from expected norms.
  Used responsibly, Nightshade can help deter model trainers who disregard copyrights, opt-out lists, and do-not-scrape/robots.txt directives.
  It does not rely on the kindness of model trainers, but instead associates a small incremental price on each piece of data scraped and trained without authorization.
  Nightshade's goal is not to break models, but to increase the cost of training on unlicensed data, such that licensing images from their creators becomes a viable alternative.
