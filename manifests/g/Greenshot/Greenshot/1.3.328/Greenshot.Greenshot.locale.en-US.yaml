ReleaseNotes: |-
  Pre-release of Greenshot 1.3.328.
  What's Changed
  Security
  - Fixed a security issue where Greenshot sent the user's Windows credentials to any server it requested content from, so a malicious image URL could trigger an automatic NTLM authentication exchange. Reported by @Y4k150b4; fixed by @Lakritzator (Robin Krom) and @jklingen in commit 5b7dca1. GHSA-gjcr-pccx-w2vg
  Installer & Upgrades
  - All executables and DLLs shipped with Greenshot, including plugins and third-party libraries, are now code-signed, so Windows Smart App Control no longer blocks unsigned files — by @Lakritzator (Robin Krom) and @jklingen in PR #1505
  Bug Fixes
  - Fixed a crash that could occur when Windows could not create a toast notifier — by @Lakritzator (Robin Krom) in PR #1515
  Technical Details
  - Release scope: This is the 11th stable release of the 1.3 series. Versions 1.3.324 to 1.3.327 were intermediate builds; their changes are rolled into this release.
  - Full Changelog: https://github.com/greenshot/greenshot/compare/v1.3.323...v1.3.328
