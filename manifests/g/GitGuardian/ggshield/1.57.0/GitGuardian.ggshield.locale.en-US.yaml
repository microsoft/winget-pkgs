ShortDescription: Detects and validates more than 500 types of hardcoded secrets from your local environment or a CI pipeline.
Description: |-
  ggshield is a CLI application that runs in your local environment or in a CI environment to help you detect more than 500+ types of secrets.
  It uses the GitGuardian public API to scan and detect potential vulnerabilities in files and other text content. Only metadata such as call time, request size and scan mode is stored from scans using ggshield, therefore secrets will not be displayed on your dashboard and your files and secrets won't be stored.
  Secrets can be searched in files (ggshield secret scan path -r .), in repositories (ggshield secret scan repo .), in Docker images (ggshield secret scan docker ubuntu:22.04) and in PyPI packages (ggshield secret scan pypi flask).
  Integrations
  - CI/CD workflows.
  - pre-commit, pre-push or pre-receive Git hooks, to prevent secrets from reaching your version control system.
  - AI coding assistants: scan interactions between you and your AI coding assistant in real time and block actions that contain secrets before they are executed. Install the hooks with ggshield install. Supported tools are Cursor, Claude Code, Copilot Chat, Codex and Mistral Vibe 2.21+.
