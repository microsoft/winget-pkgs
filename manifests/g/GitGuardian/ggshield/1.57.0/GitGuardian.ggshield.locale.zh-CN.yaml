PackageIdentifier: GitGuardian.ggshield
PackageVersion: 1.57.0
PackageLocale: zh-CN
ShortDescription: 在本地环境或 CI 流水线中检测并校验 500 多种硬编码密钥。
Description: |-
  ggshield 是一款命令行工具，可在本地环境或 CI 环境中运行，帮助你检测 500 多种密钥。
  它通过 GitGuardian 公开 API 扫描文件和其他文本内容，发现潜在的安全隐患。使用 ggshield 扫描时只会记录调用耗时、请求大小和扫描模式等元数据，因此密钥不会显示在你的仪表盘中，你的文件和密钥也不会被存储。
  可用于搜索密钥的位置包括文件（ggshield secret scan path -r .）、仓库（ggshield secret scan repo .）、Docker 镜像（ggshield secret scan docker ubuntu:22.04）以及 PyPI 包（ggshield secret scan pypi flask）。
  集成方式
  - CI/CD 工作流。
  - pre-commit、pre-push 与 pre-receive Git 钩子，防止密钥进入版本控制系统。
  - AI 编码助手：实时扫描你与 AI 编码助手之间的交互，在包含密钥的操作执行前将其拦截。使用 ggshield install 安装钩子。支持 Cursor、Claude Code、Copilot Chat、Codex 与 Mistral Vibe 2.21+。
Tags:
