ShortDescription: A fast, lightweight Git visualizer for the desktop. Read your history as a graph, then stage, commit and merge with a click.
Description: |-
  Git Mapper turns your repository's history into a clear, lane-coloured graph. Every branch keeps its colour from tip to root, so forks and merges are easy to follow at a glance.

  It's not just a viewer. Stage and commit, down to single lines. Stash changes. Fetch, pull and push. Merge branches and resolve conflicts in the app. Search commits with Ctrl+F, and keep several repositories open in tabs.

  No account, no setup, no cloud. Free and open source, for Windows, macOS and Linux.
