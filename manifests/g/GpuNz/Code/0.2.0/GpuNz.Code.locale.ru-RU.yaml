ShortDescription: ИИ-агент для программирования с открытым кодом, который запускает открытые модели на арендованной для вас видеокарте
Description: |-
  gpu.nz Code — настольный ИИ-агент для программирования на основе OpenCode. Он читает и правит файлы проекта, запускает команды и тесты и спрашивает перед опасными действиями.
  Вместо платного API за токены приложение арендует для вас сервер с видеокартой на gpu.nz, запускает на нём открытую модель (Qwen или любую модель из Ollama и Hugging Face) и подключает к ней агента. Оплата за сервер поминутная, цены за токены и лимита запросов нет. Агент работает на вашем компьютере, код проекта никуда не загружается.
