ShortDescription: Open-source AI coding agent that runs open models on a cloud GPU it rents for you
Description: |-
  gpu.nz Code is a desktop AI coding agent, a fork of OpenCode. It reads and edits the files of your project, runs commands and tests, and asks before destructive actions.
  Instead of a paid token API, the app rents a GPU server at gpu.nz for you, starts an open model on it (Qwen, or any model from Ollama or Hugging Face) and connects the agent to it. You pay for the server by the minute; there is no per-token price and no request limit. The agent runs on your computer, and your project is not uploaded anywhere.
