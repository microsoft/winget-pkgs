  설치
  winget (권장) — 터미널에서 한 줄. 브라우저 다운로드를 거치지 않아 경고가 없습니다.
  winget install genishs.Koukai2Editor
  업데이트는 winget upgrade genishs.Koukai2Editor.
  직접 내려받기 — 아래 koukai2_editor-windows.zip 을 받아 아무 폴더에나 압축을 풀면 koukai2_editor.exe 가 나옵니다.
  단일 koukai2_editor.exe 와 무결성 확인용 SHA256SUMS.txt 도 함께 올라와 있습니다.
  사용법
  프로그램을 게임 폴더에 복사할 필요는 없습니다.
  게임 폴더(KOUKAI2.DAT 가 있는 곳)에서 실행하면 저장 파일을 자동으로 열고, 다른 곳에서 실행하면 파일 선택 창이 뜹니다.
  (winget 으로 설치했다면 터미널에서 cd "게임 폴더" 후 koukai2-editor.)
  편집 전 KOUKAI2.DAT 와 MAIN.EXE 를 백업하고, 게임은 끈 상태에서 편집하세요.
  다운로드 경고·코드 서명
  .exe 에는 코드 서명이 없어 Chrome·SmartScreen 이 경고할 수 있습니다. 바이러스가 아니라 서명 평판이 없다는 뜻이며,
  winget 설치나 .zip 은 보통 경고 없이 받아집니다. 대처법은 README 참조.
  SignPath Foundation 무료 코드 서명은 신청했으나 프로젝트 가시성 요건 미달로 보류되었고, 재신청할 예정입니다
  (CODE_SIGNING_POLICY.md).
  모든 바이너리는 공개 저장소의 소스에서 GitHub Actions 로 자동 빌드됩니다.
