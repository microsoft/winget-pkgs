  - 기능 배치 정리 — [게임 설정] 탭이 [게임 전체 (모든 세이브)] 탭이 되었다. 안에는
    [함선 기본 성능] · [함선 이름·모양] · [신조 내구도 상한] (기존 [도구] 메뉴의 별도 창에서 이동) ·
    [운하] 가 있다. [도구] 메뉴의 항목은 이 sub-tab 으로 바로 이동한다.
    [항구 공급 수치] 는 [항구] 탭으로 옮겼다.
  - 운하는 정식 기능 — 수에즈·파나마 운하 개통 / 원상복원에서 「시험 기능」 표시를 뺐다.
  - 마우스 휠로 값이 바뀌지 않는다 — 숫자 입력칸과 드롭다운 위에서 휠을 굴려도 값이 바뀌지
    않는다 (실수로 값이 바뀌는 것을 막는다). 값은 화살표나 키보드로 바꾼다.
