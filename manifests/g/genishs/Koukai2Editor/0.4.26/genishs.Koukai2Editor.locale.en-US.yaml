ReleaseNotes: |-
  변경 사항
  2026-11-18 — 창 크기 대응 UI · 게임 전체 탭 (#22)
  - 창 크기에 맞춰 화면이 늘고 줄어든다 — 창이 작아 내용이 다 들어가지 않으면 잘리는 대신
