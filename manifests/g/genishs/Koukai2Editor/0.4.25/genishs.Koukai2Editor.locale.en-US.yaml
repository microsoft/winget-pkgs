ReleaseNotes: |-
  변경 사항
  2026-11-16 — 운하 개통/원상복원 + 바탕화면 바로가기 (#10, #17)
  - 운하 개통 / 원상복원 (시험 기능) (#10) —
    [게임 설정] 탭의 새 [운하] 구역에서 수에즈·파나마 운하를 각각 열고 닫는다.
    게임(DOSBox)을 완전히 종료한 뒤 버튼을 누르고, 확인 창에서 내용을 보고 승인하면 된다.
    게임 폴더의 지도 파일(WORLDMAP.LZW)에서 해당 운하 부분만 바꾸며, 첫 변경 때
    원본을 WORLDMAP.LZW.canal-orig 로 백업한다 (이름을 되돌리면 완전한 원상복구).
    운하는 게임 폴더 단위로 적용되어, 그 폴더의 모든 세이브와 새 게임에 똑같이 적용된다.
    - 한계: 다른 패치로 운하 부분이 이미 섞여 있으면 알 수 없음 으로 표시하고 바꾸지 않는다.
      항구의 [자동 이동] 항로는 운하를 쓰지 않는다 (운하 근처에서 직접 조종해 지나가야 한다).
      운하를 닫을 때는 운하 안에서 저장한 세이브가 있으면 함대가 육지 위에 놓여 갇힐 수 있으니,
      운하를 완전히 빠져나온 곳에서 저장한 뒤 닫는다 (확인 창에도 경고가 뜬다).
      게임 안 동작은 아직 실측 확인 전이라 시험 기능으로 둔다.
  - 바탕화면 바로가기 만들기 (#17) —
    저장 파일을 열면 「바탕화면에 바로가기를 만들까요?」 라고 묻는다. 만들어 두면 다음부터
    터미널 없이 아이콘만 더블클릭해도 그 세이브로 바로 열린다. 「다시 묻지 않기」를 고를 수 있고,
    나중에 [도움말] ▸ [바탕화면 바로가기 만들기] 로도 만들 수 있다.
  - 바로가기 제거 — winget 으로 삭제할 때는 바탕화면 아이콘까지 지워 주지 못하므로,
    먼저 koukai2-editor --remove-shortcuts 로 바로가기를 지운 뒤
    winget uninstall genishs.Koukai2Editor 를 실행한다 (순서 중요). 이 프로그램을 가리키는
    바로가기만 지우며, [도움말] ▸ [바로가기 제거] 로도 할 수 있다.
  Full Changelog: v0.4.20...v0.4.25
  설치
  winget (권장) — 터미널에서 한 줄. 브라우저 다운로드를 거치지 않아 경고가 없습니다.
  winget install genishs.Koukai2Editor
  업데이트는 winget upgrade genishs.Koukai2Editor.
  직접 내려받기 — 아래 koukai2_editor-windows.zip 을 받아 아무 폴더에나 압축을 풀면 koukai2_editor.exe 가 나옵니다.
  단일 koukai2_editor.exe 와 무결성 확인용 SHA256SUMS.txt 도 함께 올라와 있습니다.
  사용법
  프로그램을 게임 폴더에 복사할 필요는 없습니다.
  게임 폴더(KOUKAI2.DAT 가 있는 곳)에서 실행하면 저장 파일을 자동으로 열고, 다른 곳에서 실행하면 파일 선택 창이 뜹니다.
  (winget 으로 설치했다면 터미널에서 cd "게임 폴더" 후 koukai2-editor.)
  편집 전 KOUKAI2.DAT 와 MAIN.EXE 를 백업하고, 게임은 끈 상태에서 편집하세요.
  다운로드 경고·코드 서명
  .exe 에는 코드 서명이 없어 Chrome·SmartScreen 이 경고할 수 있습니다. 바이러스가 아니라 서명 평판이 없다는 뜻이며,
  winget 설치나 .zip 은 보통 경고 없이 받아집니다. 대처법은 README 참조.
  SignPath Foundation 무료 코드 서명은 신청했으나 프로젝트 가시성 요건 미달로 보류되었고, 재신청할 예정입니다
  (CODE_SIGNING_POLICY.md).
  모든 바이너리는 공개 저장소의 소스에서 GitHub Actions 로 자동 빌드됩니다.
