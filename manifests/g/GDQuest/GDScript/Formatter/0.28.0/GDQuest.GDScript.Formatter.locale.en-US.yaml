ReleaseNotes: |-
  A fast code formatter for GDScript in Godot 4.

  ## Changelog

  ### Added

  • Linter：add support for stdin (#327)
  • The reorder code option now preserves code regions and reorders within each region separately. This gives you more control over your code structure if you want different things grouped together. If you don't use code regions, the option works like before (#149)

  ### Fixed

  • Linter：respect the EditorConfig indentation size when checking line lengths (#318)
  • Keep parenthesized lambda parentheses next to the lambda body when they are followed by an attribute call (#364)
  • Fix formatter giving parse error on a file using `$%` for getting nodes (#363)
  • Fix formatter not supporting node paths like `%node/%node` or `%node/$node` (#363)
  • Fix a long constructor definition not wrapping like other functions (#370)

  Learn more about the formatter in the [GDScript Formatter documentation](https://www.gdquest.com/library/gdscript_formatter/)
