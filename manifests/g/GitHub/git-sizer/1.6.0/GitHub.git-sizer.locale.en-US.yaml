ReleaseNotes: |-
  The emphasis of this release is supporting SHA-256 Git repositories, allowing arbitrary reachability roots on the command line, and rebuilding release binaries statically with Go 1.27.3.
  What's new:
  - Add support for Git repositories using the sha256 object format.
  - Allow arbitrary reachability roots (git-sizer [OPTS] [ROOT...]) to be specified on the command line (any revision git rev-parse resolves, such as main, main~:src, or an object ID). When ROOT arguments are given without reference selection options, only objects reachable from those roots are traversed.
  - Improve bare vs. worktree repository detection so git-sizer works when safe.bareRepository=explicit is set.
  - Avoid git config flags that require Git 2.18+ (--default, --type=bool, --type=int) for compatibility with older Git installations.

  Internal changes:
  - Replace the internal pipe package with github.com/github/go-pipe.
  - Update source installation docs to use go install instead of go get.
  - Automate draft release creation via GitHub Actions and pin workflow actions to commit SHAs.
  - Disable cgo (CGO_ENABLED=0) when building release archives so Linux binaries are statically linked.
  - Build with the Go 1.27.3 toolchain.
