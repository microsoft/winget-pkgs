ReleaseNotes: |-
  Protect private forks when deleting repositories
  gh repo delete now warns when deleting a private or internal repository will also delete its forks. The additional confirmation is required even with --yes.
  Non-interactive workflows and agents must explicitly accept the cascading deletion:
  gh repo delete OWNER/REPO --yes --accept-cascading-deletion-of-private-forks

  What's Changed

  ✨ Features
  - Require confirmation before gh repo delete deletes private forks by @BagToad in #14858

  🐛 Fixes
  - fix(auth status): surface underlying rate-limit, server, and network errors in terminal output by @babakks and @Copilot in #15009
  - fix(auth): skip token refresh when gh's state directory is not writable by @babakks in #14845

  📚 Docs & Chores
  - Use REST to apply issue triage labels by @BagToad in #15041
  - Prevent repeated Dependabot triage assessments by @BagToad in #15002
  - Apply issue triage labels directly by @BagToad in #15001
  - Provide verified build versions to issue triage by @BagToad in #15000
  - Use a synthetic namespace for triage fixtures by @BagToad in #14976
  - Remove the accidental issue-triage model pin by @BagToad in #14972
  - Add a fake GitHub API runner for reproductions by @BagToad in #14951
  - Clarify which hosts use GH_ENTERPRISE_TOKEN by @BagToad in #14918
  - Regenerate triage workflows with gh-aw v1.0.1 by @tidy-dev in #14910
  - Test the ShowRefs option separator by @BagToad in #14879
  - Fix local extension-install test path normalization by @bobrik in #14854
  - Save Go caches only from trunk by @williammartin in #14840
  - Add a private vulnerability report form by @BagToad in #14825
  - Replace msgpack with a minimal node ID encoder by @tj-smith47 in #14801
  - Test the Git client with real repositories by @williammartin in #14348

