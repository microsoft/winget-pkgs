ReleaseNotes: |-
  Brokkr v2.5.0
  - gui: Polish the reboot to Download Mode wording
  - gui: Fix window sizing when toggling Wireless or Mass D/L
  - posix: Make the signal shield cover all threads
  - odin: Reject invalid .tar and .tar.md5 packages on desktop
  - transport: Unify the disconnect message
  - odin: Report non-tar packages as invalid tar archives
  - odin: Prefetch windows across partitions
  - Update screenshots [skip ci]
  - cmake: Bump version to 2.5.0
  - linux: Submit bulk transfers asynchronously
  - tcp: Read buffered data from a closed peer on Windows too
  - fix(tcp): Read buffered data before reporting a closed peer
  - md5: Use the x64 assembly kernel on Linux and macOS
  - md5: Use AVX-512 MD5 only on Intel CPUs
  - md5: Load round constants from a table on arm64
  - Update screenshots [skip ci]
  - notices: Add xxHash
  - src: Report integrity check and flash durations
  - src: Prioritize the MD5 hashing thread
  - md5: Add AVX-512 MD5 with runtime dispatch
  - windows: Opt worker threads out of EcoQoS
  - md5_verify: Hash XXH3 in parallel with MD5
  - md5: Optimize MD5
  - macos: Raise thread priority and enable read-ahead
  - io: Read hashed packages with a parallel reader
  - xxhash: Use XXH3 runtime dispatch on x86
  - Update screenshots [skip ci]
  - Bump version to 2.4.13
