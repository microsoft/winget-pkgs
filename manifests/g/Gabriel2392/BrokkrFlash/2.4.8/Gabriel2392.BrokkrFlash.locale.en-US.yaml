ReleaseNotes: |-
  Brokkr v2.4.8
  Changelog (from 1.4.7):
  - A/B devices no longer need a PIT file in order to flash SUPER (you can just use HOME_CSC like on any other Samsung).
  - Fixed flashing on the Galaxy S5 Neo and potentially other older devices.
  - Fixed bugs that stopped Brokkr from launching on Android TV.
  - Added the "reboot to download" feature to the remaining platforms.
  - Desktop only: allowed flashing direct files such as super.img.lz4 in the GUI (this already worked in the CLI; the help message was just misleading).
  - Added detailed error messages (though some devices only return a generic one — nothing can be done about that).
  - Fixed Linux ioctl out-of-memory errors.
  - Other misc fixes, especially on Unix.
  Commits since last beta version:
  - src: fix wireless stall connected
  - macos: fix spam on disconnect
  - random_access: Require regular file
  - Update README [skip ci]
  If something that worked in 1.4.7 breaks here, please open an issue — include your device model, the version that last worked (including any beta), and a debug log.
