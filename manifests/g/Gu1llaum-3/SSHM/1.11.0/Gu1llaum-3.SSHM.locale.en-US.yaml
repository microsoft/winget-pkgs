ShortDescription: An interactive SSH manager for your terminal.
Description: SSHM is a command-line tool that manages and connects to your SSH hosts from an interactive terminal interface. It works directly with your existing SSH config file, supports quick connect, local and remote port forwarding with history, host tags and search, live connectivity status, ProxyJump and ProxyCommand, automatic config backups, and validation to prevent configuration errors.
