PackageIdentifier: Gu1llaum-3.SSHM
PackageVersion: 1.11.0
PackageLocale: zh-CN
ShortDescription: 终端里的交互式 SSH 管理工具。
Description: |-
  SSHM 是一款命令行工具，通过交互式终端界面管理和连接你的 SSH 主机。它直接使用现有的 SSH 配置文件，支持快速连接、带历史记录的本地与远程端口转发、主机标签与搜索、实时连接状态、ProxyJump 与 ProxyCommand、自动配置备份以及配置校验。

  ✨ 功能特性

  🚀 核心能力
  - 🎨 精美的 TUI 界面 - 通过优雅、交互式的终端界面管理您的 SSH 主机
  - ⚡ 快速连接 - 通过 TUI 界面或使用命令行 sshm <host> 即刻连接至任意主机
  - 🔄 端口转发 - 轻松配置本地、远程及动态 (SOCKS) 转发，并支持历史记录持久化
  - 📝 便捷管理 - 无缝添加、编辑、移动和管理 SSH 配置
  - 🏷️ 标签支持 - 使用自定义标签整理主机以实现更优分类；支持使用特殊的 hidden 标签从列表中隐藏主机，同时保留连接能力
  - 🔍 智能搜索 - 通过内置的过滤与搜索功能快速查找主机
  - 📝 实时状态 - 具备异步 Ping 检测与色彩标记状态的实时 SSH 连通性指示
  - 🔔 智能更新 - 自动检查版本并提供更新通知
  - 📈 连接历史 - 记录 SSH 连接历史以及最后登录时间戳

  🛠️ 技术特性
  - 🔒 安全可靠 - 直接与现有的 ~/.ssh/config 文件协同工作
  - 📁 自定义配置支持 - 通过 -c 标志使用任意 SSH 配置文件
  - 📂 SSH Include 支持 - 完全支持 SSH Include 指令，实现跨多个文件组织配置
  - ⚙️ SSH 选项支持 - 通过直观的表单添加任意 SSH 配置选项
  - 🔄 自动转换 - 在命令行参数与配置文件格式之间无缝转换
  - 🔄 自动备份 - 在进行任何更改前自动备份配置
  - ✅ 配置校验 - 内置校验机制，有效防止配置错误
  - 🔗 ProxyJump/ProxyCommand 支持 - 通过跳板机/堡垒机建立安全的连接隧道
  - ⌨️ 快捷键支持 - 提供类 Vim 快捷键，助力高阶用户高效导航
  - 🌐 跨平台 - 支持 Linux、macOS（Intel 及 Apple Silicon）和 Windows
  - ⚡ 轻量高效 - 单一二进制文件，无任何依赖，零配置即可使用
