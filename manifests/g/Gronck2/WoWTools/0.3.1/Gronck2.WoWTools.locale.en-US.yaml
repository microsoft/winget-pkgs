ShortDescription: 'Tray utility for World of Warcraft: backups of WTF and addons, addon updates, UI profiles, cleanup.'
Description: |-
  WoW Tools keeps zip snapshots of the WTF and Interface\AddOns folders of every World of Warcraft version, restores
  them, copies settings between characters, saves and applies UI profiles, runs your addon manager (CurseForge, WowUp,
  Wago App) on a schedule and tidies up old SavedVariables, logs and screenshots. It never touches the game itself.
