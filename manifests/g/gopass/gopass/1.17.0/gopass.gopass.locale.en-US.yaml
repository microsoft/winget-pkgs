ShortDescription: gopass is a simple but powerful password manager for your terminal
Description: |-
  The slightly more awesome standard unix password manager for teams.
  Manage your credentials with ease.
  In a globally distributed team, on multiple devices or fully offline on an air gapped machine.
  - Works everywhere - The same user experience on Linux, MacOS, *BSD or Windows
  - Built for teams - Built from our experience working in distributed development teams
  - Full autonomy - No network connectivity required, unless you want it
