ShortDescription: Free offline dictation and audio transcription for Windows, built with Polish in mind.
Description: |-
  Gadopis is a free dictation app for Windows 10 and 11. Press F8, speak, and the text appears at the cursor in any app.
  It also turns audio and video files into text and .srt subtitles.
  Whisper and Parakeet models run on your own computer, so there is no cloud and no account.
  Polish is the default language, and you can choose another one in the settings.
