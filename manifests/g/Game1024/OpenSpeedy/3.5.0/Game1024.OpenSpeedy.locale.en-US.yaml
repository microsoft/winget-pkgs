ReleaseNotes: |-
  本次测试版重点重做了全局快捷键，解决独占全屏游戏中快捷键不生效的问题，并新增鼠标按键和滚轮支持。
  快捷键
  - 独占全屏游戏：加速、减速、切换倍率等快捷键现在依然有效
  - 鼠标按键：左键、中键、右键、侧键 1/2 都可设置为快捷键
  - 鼠标滚轮：滚轮上/下/左/右都能录制，可搭配 Ctrl、Shift、Alt 使用
  - 键盘和手柄快捷键保持原有体验

  界面
  - 子配置继承全局值时，输入框改为虚线，哪些值来自全局配置一目了然
  - 「已加载模块」增加分层阴影，模块数量移到右侧，不再被收缩按钮遮挡
  - 修复全局配置中「已覆盖」提示悬停时的轻微弹动

  测试版说明
  - 这是 3.5.0 测试版，请手动下载安装；如需回到正式版，重新安装 3.3.20 即可
  - 鼠标和滚轮快捷键是全局生效的：直接绑定左键或滚轮上/下时，在系统任何位置点击/滚动都会触发。建议搭配 Ctrl/Shift/Alt，或使用鼠标侧键
  - 「按住变速」不建议绑定滚轮（按下和松开几乎同时发生），更适合绑定档位、加速/减速或重置
  - 如果在某个游戏中快捷键仍然无效，欢迎反馈游戏名称和系统版本，帮助我们继续排查
