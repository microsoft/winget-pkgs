ReleaseNotes: |-
  OpenSpeedy 3.3.10
  🔍 新增崩溃与启动日志
  有用户反馈启动时闪退，但换台机器就复现不了。发布版是无控制台的窗口程序，
  崩溃时什么都不会留下。现在应用会把启动过程完整写进日志文件。
  - 位置：程序目录下的 logs\，按天分文件，例如 logs\openspeedy.20260912.log；
    同一天的多次运行会追加进同一份文件
  - 兜底：安装目录不可写时（例如装在 Program Files 下、以普通用户运行），
    自动改用 %LOCALAPPDATA%\OpenSpeedy\logs
  - 自动清理：保留最近 14 天
  - 记录内容：版本号、exe 路径、系统版本与架构、是否以管理员运行、
    WebView2 运行时版本、桥接进程启动结果，以及所有 panic（含文件位置与错误码）
  - 界面报错也会一并记录，鼠标卡死、白屏之类的问题不再是黑盒
  日志有两种打开方式：
  - 托盘图标右键 → 「打开日志目录」
  - 设置 → 关于 → 「打开日志」（在「复制系统信息」旁边）
  🐛 修复托盘菜单首次启动语言不正确
  首次运行时（还没有配置文件），托盘菜单可能是英文的，切换语言也不会变。
  原因是菜单在启动语言确定之前就构建好了。现在会等语言就绪后再构建。
  📋 进程列表改进
  - 默认标签页改为「按名称」，A→Z 排序
  - 新增眼睛按钮，可显示/隐藏系统进程
    （受保护的系统进程读不到内存，会显示为 0，默认隐藏）
  - 面板标题在各语言下统一为「进程列表」
