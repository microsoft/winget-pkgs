ReleaseNotes: |-
  🛠️ 修复：切换倍率后游戏可能卡顿、帧时间异常 #320
  在开着加速的情况下中途切换倍率（例如从 40× 降到 10×），部分游戏会出现异常大的帧时间，
  甚至卡住。原因是系统计时函数偶尔会“倒退”，游戏把负的时间差当成很大的正数处理。
  这个版本修复了该问题。Windows 上常用的计时函数都已覆盖：
  - QueryPerformanceCounter（QPC）
  - timeGetTime
  - GetTickCount / GetTickCount64
  - GetSystemTimeAsFileTime / GetSystemTimePreciseAsFileTime
  现在切换倍率时，时间只会继续向前，不会再倒退。
  如果你会在游戏运行中切换倍率，建议更新到此版本（3.3.19 及更早版本均存在该问题）。
  如果只在启动前设定倍率、中途不调整，遇到该问题的概率较低。
  🔤 繁体中文文案优化
  hideToTray 的繁体中文由「隱藏至系統匣」调整为「關閉至系統匣」，更准确地表达
  “关闭窗口时收进系统匣”的实际行为；简体中文保持「隐藏到托盘」。
