ReleaseNotes: |-
  ⌨️ 小键盘按键现在可以作为快捷键
  之前小键盘的数字键会和主键盘上排的数字键记成同一个键。按下小键盘 1，
  实际被记录成主键盘的「1」，于是注册的是主键盘那个键 —— 你再按小键盘自然毫无反应。
  NumLock 关闭时更糟：系统报告的是 End / 方向键，会注册成一个完全无关的键。
  现在改为读取物理键位，小键盘的按键会被正确识别为独立的键：
  - 数字键 0–9
  - +、-、*、/、. 和小键盘回车
  由于是按键位识别，NumLock 开或关都能正确录制。
  两点平台限制（非本应用可控）：
  - 小键盘回车在 Windows 上与主键盘回车是同一个虚拟键，无法区分
  - 小键盘「等于」键存在上游映射错误，会被直接拒绝并提示，而不是静默注册成字母 E
  界面上的显示会区分开来，例如小键盘的 1 显示为 Num1，主键盘的 1 显示为 1。

  🐛 修复：设置页里注册的档位快捷键看似不生效
  在设置页录制一个档位快捷键后，按下它游戏倍速确实会变，但应用里显示的倍速数字
  不动，看起来就像快捷键没生效。重启应用后却又正常了。
  原因是设置页注册和启动时注册用了两份不同的回调，前者漏了更新界面倍速这一步。
  现在两者已统一。
