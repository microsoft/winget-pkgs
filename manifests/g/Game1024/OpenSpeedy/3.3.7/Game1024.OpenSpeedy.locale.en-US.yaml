ReleaseNotes: |-
  🎨 界面
  - 设置页面改版：速度升降、变速档位、通用设置三个区块标题改用分割线+文案方式，不再嵌入表格表头
  - 关于页面：新增"社交链接"分割线，区分复制信息按钮和社交图标，支持 i18n
  - 复制软件信息：关于页面新增按钮，一键复制应用/平台版本 JSON 信息，方便提交问题报告
  🔧 Bridge 注入模块
  - 命名规范化：Detour* 函数统一重命名为 Hook_*，real* 函数指针统一为 Real_*
  - 变量重命名：基准/快照变量从 baselineKernel* 系列改为 baseReal_* / lastReal_* / baseHook_* / lastHook_*，语义更清晰
  - 移除 C++ 标准库依赖：std::wstring 替换为栈上 WCHAR 缓冲区，移除 <sstream>、<string> 头文件，注入 DLL 零 CRT 堆分配
  - 代码风格：函数定义和调用统一单行，typedef 移到各自函数指针前面
  🌐 国际化
  - 12 种语言新增 about.socialLinks、about.copyInfo、about.copyInfoSuccess、about.copyInfoError
  - 12 种语言更新 settings.speedShortcuts 和 settings.gears 术语
  🐛 修复
  - 修复 SnackbarProvider context 未包裹的错误
  - 修复 TableCell 中无效的 align: "center" → textAlign: "center"
