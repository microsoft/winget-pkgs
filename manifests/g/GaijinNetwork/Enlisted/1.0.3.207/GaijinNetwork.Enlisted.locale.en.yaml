ShortDescription: Enlisted is a squad-based multiplayer tactical first-person shooter set during World War II in which you play as an infantry squad leader, tank crew member, or aircraft pilot. The squads, weaponry, uniforms, and vehicles are in line with historical facts.
Description: |-
  Enlisted is a squad-based first person MMO shooter covering key battles from World War II. The game carefully recreates the weapons, military vehicles, and atmosphere of that era while demonstrating really massive clashes of numerous soldiers, tanks, and aircraft with artillery and naval support.

  Most of the Enlisted game modes simulate a battle involving several infantry platoons and give the player control over a squad of soldiers with various roles (e.g. assaulter, sniper, radio operator, rifleman, and others), a whole military vehicle crew, or an aircraft pilot. One of the fighters is controlled directly while others move and shoot independently, following the player's general orders. In a situation where all the soldiers in the squad have fallen, a player respawns with the next available squad. This decision makes Enlisted battles look massive and spectacular while keeping the input of each individual player in the overall team victory quite significant.

  Enlisted is developed by Darkflow Software using the Dagor engine—the same engine that is used by Gaijin Entertainment's vehicular combat multiplayer video game, War Thunder. That's why the accurately recreated ground vehicles and aircraft look, move, and are controlled in the most realistic way, and their damage model is quite sophisticated. For example, when a shell breaks through a tank's armor, the trajectory of each individual shard is properly calculated as well as the exact consequences to each vehicle part and crew member.

  Features:

  - Epic massive battles that look as massive as the historical battles, like the Omaha beach landing.
  - High input of each player in the team victory: despite the massiveness of the battles, the result is significantly defined by the performance of each player.
  - The diversity of game roles and the ability to switch between them on the fly: one minute, you're storming enemy trenches with a submachine gun, and the next, you're hiding on a roof with a sniper rifle, and you can also jump into a tank to break through the defenses, throw grenades towards enemy vehicles, or provide air support for your teammates.
  - Enlisted looks authentic even in the tiniest details, like the appearance of soldiers and buildings or a tank's damage model. The list of vehicles and weapons available in specific missions is also based on real history, so you cannot use equipment from 1945 in a battle that took place in 1941.
  - A player can customize and train squads according to their individual playstyles, unlocking perks and upgrades as long as this does not contradict the historical accuracy principle.
