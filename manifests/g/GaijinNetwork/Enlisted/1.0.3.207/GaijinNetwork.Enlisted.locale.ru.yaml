ShortDescription: Enlisted — онлайн-игра-шутер от первого лица о Второй мировой войне, в которой вы выступаете в роли командира отряда пехоты, экипажа танка или играете за пилота. Вооружение, форма солдат, внешний вид и возможности техники соответствуют историческим фактам.
Description: |-
  Enlisted — отрядный многопользовательский онлайн-шутер от первого лица, посвященный ключевым сражениям Второй Мировой. В игре воссозданы атмосфера, оружие и военная техника той эпохи, а сражения масштабны: в одной битве участвуют сотни солдат, танки и авиация при поддержке артиллерии.

  В большинстве режимов Enlisted игрок участвует в пехотном бою нескольких взводов и управляет отрядом солдат с различной специализацией (стрелок, снайпер, радист, гранатометчик, огнеметчик и так далее), экипажем боевой машины или пилотом самолета. Каждый отряд — несколько солдат, которых можно обучать, оснащать новым оружием, техникой, а затем брать с собой в бой. Между солдатами можно переключаться и оставаться в самой интересной точке сражения даже после гибели части отряда. Если все подчиненные погибли, игрок выводит на поле боя следующий доступный отряд. Благодаря механике отрядов сражения в Enlisted выглядят масштабно, при этом вклад каждого отдельного игрока в победу команды заметен.

  Игра разделена на кампании, в каждой из них страны-противники, а также доступные отряды, оружие, оснащение, бронетехника и авиация соответствуют тому, что в реальности было представлено на данном театре военных действий. Благодаря этому каждая кампания — например, оборона Москвы в 1941-1942 или штурм Берлина в 1945 — предлагает уникальный игровой опыт.

  Enlisted создается студией Darkflow Software на движке Dagor, на котором работает военный онлайн-экшн War Thunder компании Gaijin Entertainment. Поэтому детально воссозданная наземная и воздушная боевая техника выглядит, движется и управляется как в жизни, а модель ее повреждения реалистична.

  Особенности:

  - Грандиозные массовые сражения, повторяющие масштабы великих исторических битв, вроде высадки на Омаха-бич.

  - Высокий вклад каждого участника в победу команды: несмотря на масштабы битв, результат существенно зависит от того, как сражается каждый конкретный игрок. Действия одного человека могут переломить ход всей битвы.

  - Разнообразие игровых ролей: в одном и том же бою можно зачистить окоп из огнемета, поработать минометчиком, прорвать оборону на танке и прикрыть союзников с воздуха.

  - Игра создает ощущения настоящего войскового боя, передает атмосферу Второй мировой войны и внимательно относится к деталям, вроде внешнего вида и характеристик оружия и техники.

  - Игрок может настраивать и тренировать отряды под личный стиль боя — менять экипировку солдат и получать для них перки и улучшения, не выходя при этом за рамки достоверности.
