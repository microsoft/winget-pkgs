ShortDescription: Free email, photos, letters, sums and files for Windows 10 and 11, with plain-English scam warnings.
Description: |-
  Techies One is a free program for Windows 10 and 11: a free alternative for the everyday jobs. One window looks after your email, photos, letters, sums and files, with big buttons, plain words and help on every screen. It was called Techies One Mail until version 0.16.

  - Mail: type your email address and it fills in the settings itself (BT, Sky, Plusnet, Gmail, Yahoo, AOL and Outlook.com are built in); every inbox in one list; plain-English scam warnings, with obvious scams moved to a Scams folder
  - Bring in old emails from Outlook .pst and .ost files, Windows Live Mail and Thunderbird, and save them as a .pst that Outlook opens
  - Albums: your photos and videos in date order, with slideshows and short films; trim a video, make a video smaller to send, and copy the words out of a photo
  - Letters and Sums: letters, CVs and budgets, saved as Word and Excel files
  - Files and Space: this PC, USB sticks and cloud folders together; find duplicates and the biggest files
  - Simple view with fewer, bigger buttons, text up to extra large, dark mode and read aloud
  - Address book with envelopes and labels, calendar, backups to a USB stick

  Passwords are protected by Windows itself on your PC and never sent to us, and your email goes straight between your PC and your provider. Photos, videos and scans are worked on your own PC and are not uploaded.

  Free for home and work: no account, no trial, no adverts. It installs for one Windows user with no administrator password. It has no POP accounts.

  Made and digitally signed by 365 Techies Ltd, an IT support company in Bournemouth, England.
