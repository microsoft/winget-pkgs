ReleaseNotes: |-
  New in 0.24: Techies One can scan. Scan a letter or a photo from your scanner, or from a Wi-Fi printer that scans, and keep it as a PDF or a picture, or copy the words out of it. Albums can trim a video to the bits you want, make a video smaller to send, copy the words out of a photo and get photos ready for Facebook. Calendar finds what is due to renew from your emails. Search everything looks in your emails, contacts, letters, calendar and photos together. Choose your own colour.
