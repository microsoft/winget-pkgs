ShortDescription: A free, simple email program for Windows 10 and 11, with plain-English scam warnings.
Description: |-
  Techies One Mail is a free, simple email program for Windows 10 and 11. It is built for people who miss Windows Live Mail or Outlook Express, and for anyone who wants their email without the clutter.

  - Type your email address and it fills in the settings itself; the settings for BT, Sky, Plusnet, Gmail, Yahoo, AOL and Outlook.com are built in
  - As many email addresses as you like, with every inbox in one list
  - Plain-English scam warnings on every email you open, with obvious scams moved to a Scams folder
  - Simple view with fewer, bigger buttons, text up to extra large, dark mode and read aloud
  - Clean up: see who sends the most and clear thousands of old emails in a few clicks
  - Address book, calendar, undo send, send later and snooze

  Passwords are protected by Windows itself on your PC and never sent to us, and your email goes straight between your PC and your provider.

  Free for home and work: no account, no trial, no adverts. It installs for one Windows user with no administrator password. It checks for new email while it is open, has no POP accounts or offline reading, and cannot open Outlook .pst files.

  Made and digitally signed by 365 Techies Ltd, a family IT business in Bournemouth, England.
