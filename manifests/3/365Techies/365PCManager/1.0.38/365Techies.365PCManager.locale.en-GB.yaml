ShortDescription: A free, plain-English health check for Windows 10 and 11, with no fake errors or scare tactics.
Description: |-
  365 PC Manager checks your Windows PC and tells you, in plain English, what needs attention and what does not.

  Free on any Windows 10 or 11 PC, with no sign-up:
  - a health score, with the reasons behind it
  - drive health for every drive, plus backup and OneDrive checks
  - Windows Update, antivirus, network safety and printer checks
  - programs you may be better without, and what starts with Windows
  - live performance graphs and a broadband speed test
  - one-tap Boost, which clears temporary files and never touches your documents

  It reads your PC and changes nothing unless you tap a button. No invented problem counts and no pop-up upsells.

  Outside the UK, an optional paid "Unlock everything" key (12 months, does not renew, 30-day refund) adds the full automatic service, switching off start-up programs and tidying old File History backups. Everything else stays free.

  Made and digitally signed by 365 Techies Ltd, a family IT business in Bournemouth, England.
