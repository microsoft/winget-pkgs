ReleaseNotes: |-
  Fix: Local MCP - The local MCP server now validates the Host and Origin headers of incoming requests.
  Fix: OIDC - Fixed MongoDB OIDC sign-in failing when the identity provider's issuer URL ends with a trailing slash.
  Fix: OIDC - Fixed MongoDB OIDC device flow failing on JDK 17.0.21 due to a missing Accept header causing Keycloak to return HTML instead of JSON.
  Fix: Performance - View tabs now respect the auto-run query setting, and the AI Helper no longer queries collections when switching tabs.
  Fix: Security - Updated the bundled Java runtime (JRE) to 17.0.21.1 to address the eMudhra CA compromise (CVE-2026-91403, CVE-2026-114820) and CVE-2026-114938. TLS servers or proxies that offer only RSA key exchange or SHA-1 signatures must update their TLS configuration.
