ReleaseNotes: |-
  Improvement: Error Dialogs - Improved the look and feel of Error message dialogs
  Fix: MCP Tool - Fixed an issue where the List Connections tool would always report server addresses as localhost.
  Fix: Banner - Removed an old banner regarding Oracle SQL that could still be displayed under certain conditions.
  Fix: Vulnerabilities - Update third-party dependency to fix CVE-2026-54291, CVE-2026-41842CVE-2026-54399, CVE-2026-54428.
  Fix: Profile - Fix an issue where My Profile would not detect the user is logged out.
  Fix: Connection - Fix an issue where connections to replica-sets through SSH tunnels could fail.
  Fix: License - Fix an issue where Studio 3T would not load licenses in offline mode.
  Fix: AI Helper - Fix empty answers with the latest Claude models (Claude Opus-5 and Fable-5), and unclear errors now say what to do next.
  Fix: Perfomance - Fix a startup delay where the app could freeze for sometime on slow or unstable networks while verifying license.
