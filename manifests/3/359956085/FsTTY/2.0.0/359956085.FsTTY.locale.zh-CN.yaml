ReleaseNotes: |-
  - 新增 CMD、PowerShell 和 Git Bash 本地终端，支持普通与管理员权限启动；统一新建表单，并沿用会话分组与多标签交互。
  - CMD、PowerShell 支持输入命令和明确的错误、警告、目录输出高亮，颜色沿用终端文字配色；修复切换标签和调整尺寸后的历史高亮保留。
  - 优化弹窗、右键菜单、文件与分组操作的键盘导航和焦点恢复，统一会话类型图标、标签状态及侧栏衔接，并增加可配置的工作区快捷键。
