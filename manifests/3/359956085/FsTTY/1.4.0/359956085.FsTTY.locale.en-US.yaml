PackageIdentifier: 359956085.FsTTY
PackageVersion: 1.4.0
PackageLocale: en-US
ShortDescription: A Windows SSH workspace and secure MCP control plane for AI agents.
Description: FsTTY securely exposes saved SSH sessions to AI agents such as Codex, Claude, and Cursor. Agents never touch passwords or private keys and can only call explicit tools inside session groups the user has authorized. It supports terminals, SFTP, remote log search, file transfers, and command execution, and can generate MCP configuration for local agents.
