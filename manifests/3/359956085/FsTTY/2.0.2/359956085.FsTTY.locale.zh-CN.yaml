ShortDescription: 面向 AI Agent 的 Windows SSH 与 MCP 安全操作台。
Description: FsTTY 将已保存的 SSH 会话安全地开放给 Codex、Claude、Cursor 等 AI Agent。Agent 不接触密码和私钥，只能在用户授权的会话分组中调用明确的工具，支持终端、SFTP、远程日志搜索、文件传输与命令执行，并提供 MCP 配置一键生成。
