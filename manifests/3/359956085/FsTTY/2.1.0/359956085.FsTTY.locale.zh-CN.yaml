ReleaseNotes: |-
  功能与优化
  - 终端：终端列表支持双击或按 Enter／空格新建独立标签，立即连接 SSH 或启动 CMD、PowerShell、Git Bash；单击和拖动排序保持原有行为。
  - 字体与快捷键：新增全局字体选择并内置 JetBrains Mono，支持 8～32px 终端字号及自定义键盘／滚轮放大缩小；现有终端即时更新并保存设置，缺失中文字形由系统字体回退。
  - 文件管理：统一上传入口支持混选文件和文件夹，支持文件夹下载、批量及递归权限修改；目录传输保留层级、隐藏文件和空目录，提供目录合并、冲突保护和取消。批量传输显示总文件数和目录数。
  - 主题与界面：新增暖陶土、薄荷绿、薰衣草、彩虹玻璃和冰透玻璃五套主题，原「亮色」更名为「浅色」；终端文字配色继续按配置生效，切换主题不重建连接或进程。对齐字体与终端文字配色下拉框，调整传输卡片间距。
  问题修复
  - 文件传输：修复下载状态文字重叠，窄面板支持状态文字换行。
  - 终端与界面：修复文件管理展开按钮与滚动条相互遮挡；玻璃终端默认背景完全透明，消除文字区域的矩形底色，与应用渐变连续衔接。
  - Windows 安装：将安装向导首次激活安排在欢迎页显示后，Windows 拒绝前台请求时提供有限任务栏提醒，不持续抢夺焦点；原生待验收项见验证记录。
  - 安全与依赖：更新 SSH 及系统调用相关安全依赖，保留凭据保护、主机指纹核对和已有兼容行为；既有 RSA 上游依赖风险继续单独记录。
