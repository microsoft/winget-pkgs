ShortDescription: 网易云音乐一站式任务管理工具。
Description: ncmm 是一个基于 Go 开发的网易云音乐一站式任务管理工具，同时提供命令行与 WebUI。支持日常签到、云贝与成长值任务、音乐人任务、歌曲播放、图文动态、每日推歌、会员礼品和乐迷团打卡，并提供多账号管理、定时调度、收益统计、运行日志与失败通知。
