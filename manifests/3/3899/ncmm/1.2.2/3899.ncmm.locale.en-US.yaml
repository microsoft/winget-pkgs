PackageIdentifier: 3899.ncmm
PackageVersion: 1.2.2
PackageLocale: en-US
ShortDescription: One-stop task management tool for NetEase Cloud Music.
Description: ncmm is a Go-based one-stop task management tool for NetEase Cloud Music, offering both a command line interface and a WebUI. It covers daily check-ins, cloud coins and growth-value tasks, musician tasks, song plays, posts, daily song recommendations, membership gifts, and fan-group check-ins, and provides multi-account management, scheduled jobs, earnings statistics, run logs, and failure notifications.
