ReleaseNotes: |-
  Pi-Wm v0.1.22：DeepSeek 账号接入与登录确认优化
  已于 **2026-10-16 18:02（北京时间）**正式发布并设为 Latest。Windows x64、macOS Apple Silicon 与 Intel 构建和定向验证已通过，九个附件已核验。GitHub Release。源码与版本标签提交为 6d5464fa07f1c43290a665f2c48ca07086258039。
  本轮验证
  - npm run check 通过：生产源码、前端、E2E 与 12 个工作区测试类型检查，8 套主题各 80 对颜色对比检查。
  - npx --no-install vitest run packages/pi-adapter/test/deepseek-account.test.ts packages/pi-adapter/test/official-accounts.test.ts packages/pi-adapter/test/provider-error.test.ts：22 项通过。覆盖本机授权回调、错误 state、重复参数、取消、超时、迟到令牌、固定推理地址、身份隔离、错误脱敏和真实 Pi SDK 流式传输。平台响应为模拟，不调用付费模型。
  - 修正账号提供商列表一处排版后，格式检查与相关 11 项账号测试再次通过；最终构建重新完成源码与前端类型检查。
  - npx --no-install playwright test e2e/official-accounts.spec.ts e2e/deepseek-account.spec.ts e2e/usage-overview.spec.ts --workers=1 --output=test-results/release-0.1.22：7 项通过。覆盖中英文风险确认、每次重新确认、取消与焦点恢复、DeepSeek 待授权/取消/登录状态展示、统计范围键盘操作和重启后的历史用量。包含既有 390px 账号页面回归，不代表真实手机验收。
  - 实际浏览器在 1440×900 下检查了 DeepSeek 风险弹窗和统计范围菜单：文字与操作按钮完整、菜单无裁切；Escape 关闭弹窗，切换本地工作区后范围与累计标签更新。浏览器诊断无页面异常、失败请求或 HTTP 错误。截图与 E2E 证据保留。
  - npm run desktop:dist 通过：安装包 SHA-512、blockmap、更新元数据与公开仓库配置一致，15,813 个运行时文件清单和路径预算检查通过。
  - node scripts/verify-desktop.mjs --packaged=release/win-unpacked/Pi-Wm.exe 通过：将应用移出源码目录后，验证构建 UI、鉴权 API/WebSocket、原生终端、渲染器隔离、单实例、项目与主题保存、令牌轮换和正常退出；未运行安装器。
  - 版本修改仅更新 apps/desktop/package.json 与锁文件中的桌面版本，未改变依赖版本。
  - 提交钩子只调整测试文件排版，产品源码未变；提交后 E2E 类型检查及 11 项账号测试再次通过。
  - macOS 专项工作流 38881561731 通过：Apple Silicon 与 Intel 均完成原生构建、DMG/ZIP 归档、ad-hoc 签名、原生运行时与包内应用启动验证，并成功上传附件。按精简策略跳过完整桌面回归。
  - 九个上传附件已核验：Windows 三件文件大小与 SHA-256 和本地一致，Mac DMG/ZIP 的 GitHub SHA-256 与对应校验文件一致；校验文件本身的摘要也已核对。
  - 发布后匿名下载公开 latest.yml，与本地候选逐字节一致；GitHub Latest 指向 v0.1.22，远端版本标签指向已验证源码提交。首次 Node 直连检查超时，使用系统 curl 下载复核通过；Git 标签直连查询也超时，通过 GitHub API 确认标签。未将网络超时记为产品修复。
  构建日志：test-results/release-0.1.22-build.log。包内验证日志：test-results/release-0.1.22-packaged.log。浏览器回归证据：test-results/release-0.1.22/。本地预览数据不作为发布附件。
  已知限制与验证范围
  - DeepSeek 尚未验证真实账号授权、余额扣费或实际模型可用性；未接动态模型目录、图片/Files 或余额查询。价格未知暂按零值记录，费用统计不代表免费或真实账单。授权失效需退出后重新登录，不提供自动刷新流程。
  - 登录确认不保证账号安全或服务商允许第三方使用，服务商可能撤销授权、限流或限制账号。
  - 本版未配置 Windows 发布者签名；不要将构建日志中的 signing 步骤视为已完成发布者签名。
  - 按改动风险执行定向检查，未运行全仓库测试、完整 E2E、完整桌面测试、真实安装升级矩阵或收费模型请求。安装器、更新器和依赖未发生修改。
  - macOS 使用 ad-hoc 签名，未经 Apple Developer ID 签名和公证，系统可能拦截安装。
  - 保留既有前端主包超过 500 kB、SQLite 实验性和构建依赖弃用提示。
  - 未重复执行全量源码 CI，采用本地定向验证与 macOS 专项构建。公开更新元数据检查不等于旧客户端完整下载或真实安装升级验收。
