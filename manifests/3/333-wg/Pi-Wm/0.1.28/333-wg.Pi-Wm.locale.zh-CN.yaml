ReleaseNotes: |-
  Pi-Wm v0.1.28：重连停止、技能权限与项目侧栏修复
  已于 **2026-11-26 17:45（北京时间）**正式发布并设为 Latest：GitHub Release。Windows x64、macOS Apple Silicon 和 Intel Mac 共九个发布附件均已核验。
  验证记录
  - 在基于 v0.1.27 的独立发布目录完成构建；项目、Web、E2E、sandbox / orchestrator / Web 测试类型检查通过。
  - 157 项定向单元与集成测试通过，覆盖停止等待、权限切换、技能安装与加载、Git 信任及仓库操作。
  - 13 项浏览器测试通过，覆盖断线重连停止、缺失结束事件后的恢复、全局技能复制、侧栏展开、Git 信任失败后重试及已有分支操作；包含 390px 窄窗口。
  - Apple Silicon 原生构建通过，15,777 个运行时文件清单、DMG/ZIP 归档、ad-hoc 签名、Node、Chromium/PDF/canvas/SQLite 及移出源码目录后的包内 UI／PTY 检查通过。
  - Windows 与 Intel Mac 原生构建及包内验收通过，候选工作流：45791618051。Windows 校验内置更新源、安装包 SHA-512 与 blockmap；Intel Mac 校验归档、签名、原生运行时、包内 UI 与 PTY。
  - 下载后的 Windows 候选安装包为 249,682,984 字节，大小、SHA-512 与 latest.yml 一致，blockmap 覆盖完整。
  - 改动文件静态检查无错误，保留 6 项既有警告及前端主包大小提示。
  - 九个发布附件已核对 GitHub SHA-256、大小与上传状态；Mac DMG/ZIP 与对应 SHA-256 文件一致，Windows 安装包与更新元数据一致。
  - 构建源码提交：256f9c0eac1284493210e2a887f6784646895a8c。本地证据保存在独立发布工作区的 test-results/release-0.1.28/，测试数据不作为发布附件。
  - 发布后确认正式版非草稿、非预发布，Latest 与版本标签指向本次构建；匿名下载公开 latest.yml 与验收文件逐字节一致。
  已知限制与未执行检查
  - 按改动风险执行定向验证，未运行完整单元测试、完整 E2E 或真实安装升级矩阵；本次未修改安装器、更新器或依赖。常规全量 CI 沿用已有发布流程跳过，采用本地定向检查与原生平台候选验收。
  - 网络故障通过模拟断线和 API 重试验证，未在真实中转站故障期间验证；未访问用户截图中的 Windows 项目。
  - Windows 安装包未配置发布者签名，可能出现未知发布者提示。macOS 使用 ad-hoc 签名，未经 Apple Developer ID 签名与公证，系统可能拦截安装。
