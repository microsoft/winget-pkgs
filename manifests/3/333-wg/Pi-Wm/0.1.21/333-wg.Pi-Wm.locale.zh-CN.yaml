ReleaseNotes: |-
  Pi-Wm v0.1.21：修复更新安装误报忙碌
  已于 2026-10-15 14:54（北京时间）正式发布并设为 Latest，Windows x64、macOS Apple Silicon 与 Intel 附件齐全。
  修复后台短暂请求与更新检查重叠时，页面误报“有任务正在运行或终端仍打开”、反复阻止安装的问题。
  本次修复
  - 遇到后台请求或自动调度短暂占用时，每隔 100 毫秒重新检查，最多额外等待 1.5 秒；请求结束即可继续更新。
  - 真实运行或排队的任务、执行中的目标、未关闭的终端仍会阻止安装；持续请求、状态未知和服务异常不会被绕过。
  - 更新页显示所有会话与项目的具体阻塞项及数量，并提供“前往终端”和“重新检查状态”。收起终端面板仍会保留终端进程，需要在终端内部工具栏关闭。
  - 安装确认后继续执行服务端最终空闲检查，只有检查通过才停止服务并交给安装器。
  下载与升级
  - Windows x64：下载 Pi-Wm-0.1.21-Setup-x64.exe。已配置更新源的用户可通过“设置 > 关于与更新”升级。
  - 旧版 0.1.20 及更早版本若仍卡在忙碌提示，请保存工作、结束真实任务和终端、正常退出 Pi-Wm，再运行本版安装包覆盖原安装目录。旧版需先完成这一次升级，之后才能使用修正后的检查逻辑。保留现有会话与项目数据，不必卸载或删除用户目录。
  - macOS：Apple Silicon 使用 arm64，Intel 使用 x64；下载本版对应 DMG 或 ZIP，手动替换应用。
  验证
  - npm run check 通过：源码、前端、E2E 与测试类型检查，以及 8 套主题的颜色对比检查。
  - 更新器、网关与下载定向回归 27 项通过，覆盖短暂请求重查、真实任务阻止安装、重查期间新任务启动、持续请求不放行、服务断开、最终准备检查、损坏包拒绝及下载重试。
  - 更新页 E2E 6 项通过，覆盖 1360px、800px、390px 布局、阻塞数量、状态未知、重新检查和终端入口。
  - Windows 安装包构建与 SHA-512、blockmap、更新源、15,811 个运行时文件清单及包内源码一致性检查通过。安装包为 249,594,316 字节，SHA-256：03e4f77086f84410f4d359908ce76430d2e7a80e38b907bcfdbd054caa20f7f4。
  - 移出源码目录后的 Windows 包内启动验证通过：鉴权 API/WebSocket、原生终端、渲染器隔离、单实例、项目与主题保存、重新打开和正常退出。
  - 修复后的 0.1.21 更新到未发布的 0.1.22 测试夹具，10 项更新交接验证通过，覆盖发现、下载、取消、损坏包、终端占用、拒绝确认、缓存复用、安装交接及旧会话与偏好保留。此项拦截安装器的最终系统启动；真实安装升级另由 GitHub 托管 Windows 机器验证。0.1.22 夹具不作为正式版本发布。
  - Windows 真实升级工作流 38694036382 通过：标准路径和包含中文的长临时目录均完成真实 NSIS 安装、应用内下载、旧进程退出、安装文件替换、Windows 版本注册更新和自动重启；会话、工作区文件、页面偏好及更新设置均保留，安装后的 15,811 个运行时文件完整。未替换开发者机器上的安装；测试版本草稿已删除。
  - macOS 工作流 38693492756 通过：Apple Silicon 和 Intel 均完成原生构建、DMG/ZIP 校验、ad-hoc 签名、原生运行时与包内应用启动验证。
  - 九个正式附件已核验：Windows 文件大小及 SHA-256 与本地候选一致，两种 Mac 架构的 DMG/ZIP 摘要与各自校验文件一致。
  - 发布后匿名获取公开 latest.yml，与本地候选逐字节一致；公开 Latest 指向 v0.1.21，版本标签指向已验证的源码提交。
  - 发布后使用隔离的 0.1.20 客户端验证公开 GitHub 更新源：无需 Token 即可发现、下载完整 0.1.21 安装包并通过 SHA-512 校验，未启动开发者机器上的安装器。首次尝试因隔离测试窗口退出而中断，保留失败记录并增加退出诊断后复测通过，未将首次中断计为通过。
  - 源码提交：360fba0a33f43156c10a61eb4b7ae5dd930b35b6。
  已知限制
  - 持续请求或真实任务占用仍会阻止安装，本修复不会强行中断工作。
  - Windows 未配置发布者签名；macOS 为 ad-hoc 签名，未经 Apple 公证。
  - 本次按更新功能风险执行专项验证，未运行全仓库测试、完整 E2E 或收费模型请求。
  - 本地检查与远端专项构建未重复运行全量源码 CI；保留既有前端主包超过 500 kB、SQLite 实验性及构建依赖弃用提示。
