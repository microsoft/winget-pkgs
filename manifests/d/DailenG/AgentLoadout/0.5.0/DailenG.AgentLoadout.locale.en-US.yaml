ShortDescription: Manage MCP servers, skills and secret references for AI coding clients.
Description: |-
  Loadout manages MCP servers, skills and secret references for AI coding clients (Claude Code,
  Codex, omp, Pi, Claude Desktop, VS Code with GitHub Copilot, Cursor and more) from one versioned,
  offline store. It writes each client's native config files, never touches entries it did not
  create, and keeps secret values out of the store. Installs the Loadout desktop app and the
  loadout command line tool for the current user.
