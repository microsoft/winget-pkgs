ShortDescription: Fast, smart file manager for Windows, even offline.
Description: |-
  Foldy is a free, open-source dual-pane file manager for Windows 10 and 11 that looks and feels like File Explorer.
  Press Ctrl+Space in any app to find files, apps and Windows settings instantly, see what fills your disk as a treemap and remove only what is safe, and tidy your Desktop and Downloads step by step with preview and undo.
  It also has tabs, F3 preview, folder templates, Git and SFTP. Everything works offline. Connecting an AI app through its read-only MCP server is optional.
