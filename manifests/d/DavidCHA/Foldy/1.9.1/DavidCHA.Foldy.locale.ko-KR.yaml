ShortDescription: 빠르고 똑똑한 파일 관리자, 오프라인에서도.
Description: |-
  Foldy는 Windows 10·11용 무료 오픈소스 두 창 파일 관리자입니다. 파일 탐색기와 똑같이 생겨서 배울 게 없어요.
  어느 프로그램에서든 Ctrl+Space로 파일·앱·Windows 설정을 바로 찾고, 폴더 분석으로 공간을 잡아먹는 것을 상자 그림으로 보고 지워도 되는 것만 휴지통으로 보내고, 바탕화면과 다운로드를 미리보기와 되돌리기가 있는 대화형으로 정리해요.
  탭, F3 미리보기, 폴더 템플릿, Git, SFTP도 있어요. 모든 기능이 인터넷 없이 돌아가요. AI와 연결하면 더 편하게(읽기 전용 MCP, 선택).
