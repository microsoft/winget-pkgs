ShortDescription: Free open-source Minecraft launcher for playing with friends without a server.
Description: |-
  MineDed is a free, open-source Minecraft launcher. It installs any game version with Fabric, Quilt, Forge or
  NeoForge and manages mods, resource packs, shaders and modpacks from Modrinth. Friends can play together without
  a server: the host shares a room link, guests automatically get the host's modpack and connect over an encrypted
  peer-to-peer link. Built-in voice chat, optimization presets for low-end PCs and signed auto-updates.
