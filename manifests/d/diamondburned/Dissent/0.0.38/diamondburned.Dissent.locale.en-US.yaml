ShortDescription: Tiny native Discord app
Description: |-
  Dissent (previously gtkcord4) is a third-party Discord client designed for a smooth, native experience on Linux desktops.
  Built with the GTK4 and libadwaita for a modern look and feel, it delivers your favorite Discord app in a lightweight and visually appealing package.
ReleaseNotes: |-
  New Features
  - Forum and thread browser, with forum channels now shown with a forum icon
  - Poll support
  - Discord Components V2 messages
  - Dissent can keep running in the background, and optionally start on login
  - Reconnecting keeps the opened channel and scroll position instead of resetting the chat
  - Reworked chat header buttons
  - Show Member Tag option in preferences by @SquishyTonk in https://github.com/diamondburned/dissent/pull/379
  - Sidebar channel rows are easier to tell apart visually by @tristonarmstrong in https://github.com/diamondburned/dissent/pull/371
  Fixes
  - Large custom emojis no longer overlap the next message
  - Left guilds no longer show up in the guild sidebar
  - Channels are ordered correctly when categories share positions with channels
  - Fixed a crash with GStreamer's playbin3
  - WebP images load natively in the Nix build
  - Windows builds now use MSYS2's UCRT64 environment
  New Contributors
  - @tristonarmstrong made their first contribution in https://github.com/diamondburned/dissent/pull/371
  - @SquishyTonk made their first contribution in https://github.com/diamondburned/dissent/pull/379
  Full Changelog: https://github.com/diamondburned/dissent/compare/v0.0.37...v0.0.38
