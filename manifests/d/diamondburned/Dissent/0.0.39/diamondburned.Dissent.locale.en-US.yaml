ShortDescription: Tiny native Discord app
Description: |-
  Dissent (previously gtkcord4) is a third-party Discord client designed for a smooth, native experience on Linux desktops.
  Built with the GTK4 and libadwaita for a modern look and feel, it delivers your favorite Discord app in a lightweight and visually appealing package.
ReleaseNotes: |-
  New Features
  - Buttons, select menus and forms in bot messages now work (Message Components support!)
  - When a bot doesn't respond to a button or form, Dissent shows why
  Fixes
  - Edited messages no longer lose their text
  - The last line of a message with a mention is no longer cut off by an image below it
  - Embeds are capped at 520px wide and size their images more consistently
  Full Changelog: https://github.com/diamondburned/dissent/compare/v0.0.38...v0.0.39
