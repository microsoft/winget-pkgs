ShortDescription: Detect suspicious network activity and monitor router changes on your Windows PC
Description: |-
  NetworkTuna helps you detect and investigate suspicious network activity around your Windows PC. It looks for port scans and repeated attempts from nearby devices to reach services on your computer. Optional router monitoring checks for changes to your router's management access and security keys. Review the evidence, inspect app connections and traffic history, and control which apps can connect.

  This is the public beta. Try it for 14 days. A paid license is required after the trial.
