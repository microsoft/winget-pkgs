ShortDescription: See which AI agent changed your files, and undo its whole session. Everything stays on your PC.
Description: |-
  FileSquirrelAI watches the folders you choose on your Windows PC, shows which program and which AI coding agent changed each file, and undoes an agent's whole session after you review it.
  It keeps a local log and file copies (no account, no cloud) and installs a small Windows service, "FileSquirrelAI Monitor", which uses Windows' own event tracing to see which program made each change.
  Free to install, with a 30-day trial of everything in Pro. FileSquirrelAI is not a backup: keep your usual backups.
