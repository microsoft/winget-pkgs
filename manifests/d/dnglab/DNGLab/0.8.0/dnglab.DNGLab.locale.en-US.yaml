ShortDescription: Camera RAW to DNG file format converter command-line tool.
Description: |-
  DNGLab is a camera RAW to DNG file format converter.

  It reads proprietary camera RAW formats and writes them into the open, publicly documented DNG
  format, so raw files stay readable by software that does not ship a decoder for a specific camera.
  The command-line tool exposes the subcommands convert, analyze, extract, makedng and process-raw,
  and the converter recognises a wide range of cameras and lens corrections from its built-in
  databases.

  Optional JPEG XL compression for the DNG output needs libjxl 0.11 or later, which is loaded at
  runtime; without it every other feature works as usual.
