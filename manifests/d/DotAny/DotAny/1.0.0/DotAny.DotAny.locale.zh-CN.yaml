PackageIdentifier: DotAny.DotAny
PackageVersion: 1.0.0
PackageLocale: zh-CN
ShortDescription: 适用于几乎所有文件的开源编辑器。
Description: |-
  DotAny 将 11 款原生工具与 74 种文件格式整合于同一桌面套件：Text、Image、Books、Video、Audio、PDF、Archive、Sheets、Slides、3D 与 Recorder。
  专注 95% 的核心需求，通过摒弃 5% 的低频冗余，换取每款工具的瞬时启动与直观体验。
  本地离线运行，免登录、无追踪。
