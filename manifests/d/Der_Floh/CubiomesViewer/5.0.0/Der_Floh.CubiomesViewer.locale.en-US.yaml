ShortDescription: Minecraft seed finder and biome map viewer.
Description: |-
  A Minecraft Java Edition seed finder and biome map viewer, built on the cubiomes world-generation library.
  It maps the biomes, structures, strongholds, spawn point and slime chunks of any seed from Beta 1.7 to 26.3 in the Overworld, Nether and End, searches for seeds that meet a list of conditions, analyses the biomes and structures around a point, and exports the map as PNG images.
