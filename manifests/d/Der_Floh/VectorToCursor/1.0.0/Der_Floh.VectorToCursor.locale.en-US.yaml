ShortDescription: Convert SVG files into Windows cursors (.cur) and animated cursors (.ani).
Description: VectorToCursor is a command-line tool that turns an SVG file into a Windows cursor, or into an animated cursor when the SVG uses CSS or SMIL animations. Every size, 32 to 256 px by default, is rendered straight from the vector data with its own scaled hotspot, and transparent edges get a color band so Windows can scale the cursor without dark fringes.
