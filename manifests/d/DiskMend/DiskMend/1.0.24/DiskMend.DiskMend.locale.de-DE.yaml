ShortDescription: 'Gelöschte und verlorene Dateien von Festplatten, SSDs, USB-Sticks, Speicherkarten und CDs/DVDs wiederherstellen.'
Description: |-
  DiskMend ist ein Datenrettungsprogramm für Windows. Es durchsucht interne und externe Laufwerke, USB-Sticks, Speicherkarten und CDs/DVDs nach gelöschten und verlorenen Dateien – auch Laufwerke, die als RAW angezeigt werden oder formatiert werden sollen.
  Es liest die Dateitabellen von NTFS, FAT/FAT32 und exFAT sowie APFS- und HFS+-Laufwerke (Mac) und stellt Dateien mit Namen und Ordnern wieder her; ist die Dateitabelle beschädigt, findet es Fotos, Videos, Dokumente und Archive anhand ihres Inhalts.
  Das Quelllaufwerk wird nur gelesen, nie beschrieben. Scannen und Vorschau sind kostenlos; zum Speichern gefundener Dateien ist eine Lizenz (unbefristet oder ein Jahr) nötig.
