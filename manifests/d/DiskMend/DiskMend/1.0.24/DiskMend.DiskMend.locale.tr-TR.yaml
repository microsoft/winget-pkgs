ShortDescription: 'Sabit disk, SSD, USB bellek, hafıza kartı ve CD/DVD’lerden silinmiş ve kaybolmuş dosyaları kurtarın.'
Description: |-
  DiskMend, Windows için bir veri kurtarma aracıdır. Dahili ve harici diskleri, USB bellekleri, hafıza kartlarını ve CD/DVD’leri silinmiş ve kaybolmuş dosyalar için tarar; RAW görünen ya da biçimlendirilmesi istenen sürücüler de buna dahildir.
  NTFS, FAT/FAT32 ve exFAT dosya tablolarını ve APFS ile HFS+ (Mac) diskleri okuyarak dosyaları adları ve klasörleriyle geri getirir; dosya tablosu bozulduğunda fotoğraf, video, belge ve arşivleri içeriklerinden bulur.
  Kaynak sürücü yalnızca okunur, ona asla yazılmaz. Tarama ve önizleme ücretsizdir; bulunan dosyaları kaydetmek için lisans (ömür boyu ya da bir yıllık) gerekir.
