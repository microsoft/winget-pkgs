ShortDescription: Equation solver for engineering thermodynamics, with fluid properties, cycle diagrams and parametric studies.
Description: |-
  DeltaF Studio solves systems of equations written in any order, as in EES, with
  real-fluid properties from CoolProp, units, parametric tables, goal seek and
  optimisation, plots and property diagrams (T-s, P-h), and a cycle diagram editor.
  It imports EES models and includes the dfs command-line solver.
