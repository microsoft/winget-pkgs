ShortDescription: Free, open-source multi-connection download manager with resume, VirusTotal scanning and browser integration.
Description: |-
  Akıncı is a free and open-source download manager for Windows (Turkish UI).
  It splits files into up to 32 parallel connections, resumes interrupted downloads,
  checks finished files against 70+ antivirus engines via VirusTotal (SHA-256 lookup only),
  limits bandwidth, queues downloads and supports HTTP/HTTPS, FTP/FTPS and HLS streams.
  A Chrome/Edge extension hands browser downloads over to Akıncı.
