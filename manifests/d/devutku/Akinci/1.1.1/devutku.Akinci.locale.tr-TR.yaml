ShortDescription: Kaldığı yerden devam eden, VirusTotal taraması ve tarayıcı entegrasyonu olan ücretsiz, açık kaynak çok kanallı indirme yöneticisi.
Description: |-
  Akıncı, Windows için ücretsiz ve açık kaynak bir indirme yöneticisidir.
  Dosyaları 32'ye kadar paralel bağlantıya bölerek indirir, kesilen indirmeleri kaldığı yerden sürdürür,
  biten dosyaları VirusTotal ile 70'ten fazla antivirüs motoruna sorar (yalnızca SHA-256 özeti),
  hız sınırı ve indirme kuyruğu sunar; HTTP/HTTPS, FTP/FTPS ve HLS akışlarını destekler.
  Chrome/Edge eklentisi tarayıcıdaki indirmeleri Akıncı'ya aktarır.
