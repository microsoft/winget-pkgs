ShortDescription: Cross-platform driver and background service for Segotep Ice Moon / Digital series AIO CPU coolers with integrated 7-segment digital pump block displays.
Description: |-
  segotep-digital is an open-source cross-platform driver and background service for Segotep Ice Moon / Digital series AIO CPU coolers. It replaces proprietary vendor utilities with a lightweight Rust daemon that streams CPU and GPU telemetry (temperature, load, power, clock) to the cooler's integrated 7-segment digital pump display over USB HID. On Windows it installs as a native background service and can read hardware sensors via Windows Performance Counters, NVIDIA NVML, and the signed PawnIO kernel driver.
