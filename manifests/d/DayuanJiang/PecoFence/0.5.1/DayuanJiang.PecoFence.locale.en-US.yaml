ReleaseNotes: |-
  PecoFence 0.5.1 brings the options you asked for since 0.5.0 (a fence without a title row, your own font, tabs that make room), fixes for two monitors, stacks of rolled-up fences and renaming a file another program has open, and plugins that can do more once they say so.
  New options
  - Show title bar → Never (feedback #208): the title row of that fence never shows, also not under the pointer; drag its place to move the fence. With several tabs along the top the row still shows under the pointer.
  - Font in Settings → General → Appearance (feedback #208): one font for the fence titles, the tabs and the item names, from the fonts on your PC.
  - A fence with Automatic height that switches to a tab with more icons pushes the fences below down, as expanding does (feedback #208).
  Fixes of reported problems
  - A file made with the desktop's right-click menu on a second monitor stays on that monitor: it goes into the fence nearest the click there (feedback #207). Its name box now takes the keyboard.
  - With Push the fences below down when one expands off, the top fence of a stack of rolled-up fences opens all the way over the fences below, which fade out until it rolls up again (feedback #207). It used to open one row and keep that short height.
  - Renaming a file another program has open shows Windows' own File In Use dialog, which names the program and has Try Again (feedback #207).
  - A web plugin could open the screen sharing picker without saying so; now only a plugin that declares screen can.
  - When PecoFence keeps the processor busy, its log now says which threads did it from 2 % of a core, and every hour how much it used (#251, #241). On Windows 10 and Windows Server 2022 moving the pointer costs PecoFence 1 to 3 % of a core in a virtual machine; a change that removes it lost the first double-click on the desktop after signing in, so it waits.
  Plugins can do more
  - A plugin may now declare more, and you still see all of it before you install: seeing the screen (you pick what to share), knowing where the pointer and the text cursor are, the camera, the microphone and the location, direct connections to other computers, writing any kind of file in a folder you pick, starting batch files and PowerShell scripts, and a shortcut of its own. An update that asks for more still waits for your OK. Plugins of this kind need 0.5.1; 0.5.0 shows them as needing an update.
  - New in the plugin store: Emoji Picker and Translator, thanks to @xan2622, whose magnifier (#252) showed that plugins needed this.
  - Writing a plugin: see AGENTS.md in the plugin repository.
