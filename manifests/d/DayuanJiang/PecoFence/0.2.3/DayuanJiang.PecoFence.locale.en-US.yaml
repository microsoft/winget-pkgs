ReleaseNotes: |-
  PecoFence 0.2.3 fixes what the 0.2.2 release test found: signing out with a menu open, folders shown on the desktop after a rename, the startup switch of the portable and Store editions, and a set of smaller problems.
  Fixes
  - Signing out with a menu open. Signing out or shutting down while a PecoFence menu is open now shows the Windows desktop icons again and keeps your last changes. Windows closed the menu and ended PecoFence before telling it about the sign-out, so the icons stayed hidden until PecoFence started again, and a fence moved just before the menu opened went back.
  - Folders shown on the desktop notice when their folder on a local disk is renamed or moved away: within a minute the fence says This folder cannot be found., shows the files of a new folder made at the same path, and shows the folder again when it is renamed back. It used to keep showing the old files.
  - Start with Windows in the portable edition. A copy started with --portable now starts with Windows with its own configuration: the startup entry carries --portable (it opened the %APPDATA% configuration and the first-start fences at sign-in), an older entry gets the flag the next time the copy is started with --portable, and the switch shows whether the entry starts this copy.
  - Start with Windows in the Store edition shows the switch Windows keeps for PecoFence under Windows Settings → Apps → Startup, and follows a change made there when you come back to PecoFence's Settings. A click opens that page without flipping the switch by itself.
  - Peek after Win+Up. Windows 11's snap layouts popup no longer ends a Peek, so the search you type goes to PecoFence, and it no longer turns off the desktop's double-click or ends Win+D's floating fences.
  - Fluent: a right click cancels moving a fence by its title also while the pointer rests.
  - Windows 10 without its September 2023 update: About and pecofence-cli status show PecoFence's memory again instead of 0.0 MB, and About no longer says "for Windows 11".
  - The roll-up chevron shows when the pointer goes from a fence's border, or from a gap between tabs, onto the title row, and after the first click on a cut-off tab; it used to wait for another pointer move.
  - After a start at sign-in, folders get their icon asked again like the other icons.
  - New .tmp files show in a fence after a minute, also with the Windows desktop icons shown.
  - Shortcuts PecoFence makes (Alt held while dragging into a folder fence) are named in the Windows display language, as Explorer names them.
  - Screen readers read the rule buttons with the UI language's colon; the Store edition starts its wait for the rating notice at the first start; a folder fence whose folder is gone no longer writes a warning to the log at every change.
  Downloads
  - pecofence-v0.2.3-x64-setup.exe: installer, per user, no administrator rights needed.
  - pecofence-v0.2.3-x64-portable.zip: portable; extract and run pecofence.exe.
  - A .sha256 checksum for each.
  Copies installed with the setup can update from Settings → About → Check for updates.
  Full changelog: v0.2.2...v0.2.3
