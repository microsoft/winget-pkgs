ReleaseNotes: |-
  PecoFence 0.2.5 fixes the freeze at the first right-click on a folder that some 0.2.4 users ran into, makes deleting and the keyboard work where they did not, lets the Store edition turn its own autostart on, and lets you edit your sorting rules.
  Fixes
  - The first right-click on a folder no longer freezes PecoFence (feedback #103, #109). The first time a program builds a folder's right-click menu, Windows starts a helper thread and waits for it. A menu extension that creates a window while it is being loaded (Baidu Netdisk's does) made Windows ask for that thread at a moment when no new thread could start, so PecoFence waited forever and had to be ended in Task Manager. File Explorer does not run into this, because its helper thread already runs. PecoFence now gets that thread started in the background when it starts, without loading any menu extension. In a test machine with Baidu Netdisk, 0.2.4 froze in 9 of 23 first right-clicks and 0.2.5 in none of 22.
  - Delete, F2, Enter and Ctrl+C work on icons selected with a rectangle on the empty desktop when the Desktop fence is arranged like the desktop (feedback #108). The keys went to the hidden Windows icons and nothing happened.
  - Delete, Ctrl+C and Ctrl+X react at once (feedback #108). PecoFence built the whole right-click menu, with every installed program's menu extensions, to find the command on every press; it now asks Windows for the command by name, as File Explorer does. Pressing Delete again, or holding it, while a delete is still running no longer deletes the same files a second time (Windows showed "Could not find this item").
  - No flash when the fences come back after a double-click on the empty desktop (feedback #99): they no longer appear fully for a moment, vanish and only then fade in.
  - Start with Windows works in the Microsoft Store edition (feedback #105): a click turns autostart on or off, as in the other editions. When you turned PecoFence off in Windows' Startup settings or Task Manager, only you can turn it on again there; the switch then says so and opens that page.
  - Copy, cut, paste and the other icon keys work during Peek (feedback #102): Ctrl+C, Ctrl+X, Ctrl+V, Delete, F2, Enter, the arrow keys, Ctrl+A and the menu key act on the icon you clicked. Enter opens it and ends the Peek.
  - Arrange like the desktop can be turned off from the Desktop fence itself (feedback #106, #107, #173): right-click any of its icons. Settings and the online manual now say that the icons keep their order, as with Windows' "Auto arrange icons", and cannot be placed freely; turning it off makes Desktop a normal fence again.
  - PecoFence no longer closes with "RefCell already borrowed" while it follows the virtual desktops (GitHub #166, reported by @dudantas), and two other waits of the same kind are fixed.
  - After a crash inside another program's file, such as WPS Office's shell extension, the notice at the next start names that file (GitHub #167 by @dudantas, feedback #97).
  - Programs that land on the desktop show their own icon, also while a virus scanner still checks them (linux.do: Geek Uninstaller showed the blank program icon).
  - Space previews in Seer as well as in QuickLook (linux.do).
  - Settings no longer says a rule was saved when PecoFence could not store it (an idle-days value beyond its range); the page shows the stored rules again and says so.
  - When double-click hide or the desktop rectangle does nothing, the log now says why, including whether File Explorer runs as administrator (GitHub #171, reported by @YidongTu). When PecoFence stops answering, its log keeps more of the place where it was stuck.
  Highlights
  - Edit a rule (feedback #104). Each rule in Settings → Sorting rules has an Edit rule button that opens the rule in its own row: its name, the target fence and every condition. Save keeps the rule at its place in the list and leaves it on or off as it was; Cancel or Esc changes nothing. Before, a rule could only be deleted and added again, which also put it at the top of the list.
  - Rules with several conditions, all of which must hold: Add condition adds one to a new rule or to the rule being edited, and the cross beside a condition removes it. The To clean up rule keeps both of its conditions when you edit it, and a condition only pecofence-cli can write stays as it is. Items already in a fence move to the edited rule's fence with Apply now.
  Downloads
  - pecofence-v0.2.5-x64-setup.exe: installer, per user, no administrator rights needed.
  - pecofence-v0.2.5-x64-portable.zip: portable; extract and run pecofence.exe.
  - A .sha256 checksum for each.
  Copies installed with the setup can update from Settings → About → Check for updates.
