ReleaseNotes: |-
  PecoFence 0.5.0 brings a plugin store for the tools in your fences, and fixes for the problems you reported since 0.4.0: a Store edition that forgot its layout at every start, fences that moved to the other monitor, Ctrl+V on the desktop, and a much smaller memory footprint with a clock or PC status fence.
  The plugin store
  - Settings → Tools now lists the plugin store: notes, a clock, the weather, PC status, a to-do list, a countdown, clipboard history, a launcher, GitHub activity and more. Pick one, press Install, and its fence is on the desktop.
  - Before a plugin is installed, PecoFence shows what it may do (go online to the sites it names, read the clipboard, and so on). A plugin can do only what it listed, and every version is checked and reviewed automatically before it is offered. The list itself is signed, and every file is checked before it runs.
  - Updates that ask for nothing new install by themselves; an update that asks for more waits for your OK. A plugin that stops working in the first minute after an update goes back to the version before.
  - Your notes, clocks, PC status and weather fences from 0.4.0 become plugins by themselves, with their text and settings. A snapshot named Before the switch to plugins keeps the old layout. Without a network they keep working as they are.
  - Your own script stays built in. Writing a plugin of your own: see the plugin repository.
  Fixes of reported problems
  - The Store edition keeps its fences after a restart on PCs where Windows refused every save (feedback #186). Each start was a first run.
  - A fence you moved to the other monitor stays there when that monitor goes off and comes back (feedback #194), also after a snapshot restore or an import.
  - Ctrl+V on the desktop pastes files again while PecoFence hides the desktop icons (#232, #241, feedback #197, #199), also files copied inside a .zip, from Outlook or from a remote desktop or virtual machine window.
  - Dragging a file from a fence into a File Explorer folder during Peek no longer freezes the screen when Explorer asks Replace or Skip Files (#238).
  - With Place freely, a file made with the desktop's right-click menu appears where you right-clicked (#238).
  - Liquid Glass keeps its refraction with Bing Wallpaper's desktop widget on (#247, thanks to IRahman2024).
  - The Store edition installed on another drive opens shortcuts to programs in that drive's Users\<you>\AppData (#244).
  - Custom… in the Peek shortcut list works when picked with the mouse (feedback #189, #190).
  Memory
  - With a clock that shows seconds or the PC status fence, PecoFence used about 130 MB in Task Manager on a 4K PC; 0.5.0 uses about 11 MB with the same layout (the PC status fence no longer runs PowerShell, and fences that refresh themselves no longer hold back the memory housekeeping).
  New options
  - Shrink rolled-up fences to their title (#242): a rolled fence is only as wide as its name or its tabs.
  - A rolled-up clock shows the time in its title row (feedback #175).
  - Double-click empty space to zoom the fence (#243, #245, thanks to WangSuhang123), off by default: the fence grows to the middle of the screen, icons and all.
  - Undo notices (feedback #185, #188): the card with Undo now leaves after 10 seconds and can be turned off.
  - Fences can fade while you are not using them (#216, thanks to snowyukitty): Idle opacity.
  - Menus can be light while fences are dark, or the other way round (#227): Menu color.
  - One fence's looks or layout can go to every other fence (feedback #135, #159): Apply to all fences.
  - In a folder fence, a double-click on empty space in a subfolder goes up one level (feedback #130, #156).
  - Jump in file dialogs works with Directory Opus (#240, thanks to xchongwong).
  - With the tab bar on the left, Title alignment centres the tabs or puts them at the bottom (feedback #192).
  - List and details views follow the fence's icon size (feedback #120).
  Steadier
  - PecoFence no longer closes when another program's right-click menu add-on leaves the processor in an unusual state (feedback #163).
  - A log line names what keeps PecoFence busy when it uses the processor for a minute (#241).
  Full list of changes: CHANGELOG.md
