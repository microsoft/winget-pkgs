PackageIdentifier: DayuanJiang.PecoFence
PackageVersion: 0.0.5
PackageLocale: zh-CN
Publisher: Dayuan Jiang
PackageName: PecoFence
ShortDescription: 免费开源的 Windows 11 桌面整理工具，Stardock Fences 的另一种选择
Description: |-
  PecoFence 把 Windows 11 桌面整理成一个个玻璃栅栏：把文件和快捷方式分组收纳，把真实文件夹作为
  门户放在桌面上，把相关栅栏合成标签页，再用一个快捷键把它们全部浮现在当前应用前面。规则可以
  自动归类新文件，布局可以保存快照并恢复，界面提供十种语言。Rust 编写的原生应用，设置窗口使用
  Windows 11 自带的 Microsoft Edge WebView2 Runtime。
