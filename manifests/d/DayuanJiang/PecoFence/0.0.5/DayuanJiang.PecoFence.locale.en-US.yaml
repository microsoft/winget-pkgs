ShortDescription: A free, open-source Stardock Fences alternative for Windows 11
Description: |-
  PecoFence organizes the Windows 11 desktop into glass fences. Group files and shortcuts
  into fences, keep real folders on the desktop as live portals, combine related fences
  into tabs, and bring everything above the current application with one shortcut.
  Rules file new items automatically, layouts can be snapshotted and restored, and the
  interface is available in ten languages. Native Rust application; the Settings window
  uses the Microsoft Edge WebView2 Runtime that ships with Windows 11.
