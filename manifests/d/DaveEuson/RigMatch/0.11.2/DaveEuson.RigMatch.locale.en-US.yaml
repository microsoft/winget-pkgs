ShortDescription: Find the best local AI model your computer can actually run.
Description: |-
  RigMatch benchmarks local AI models on your own hardware through Ollama or LM Studio, and scores each one on speed, answer quality and how well it fits your graphics card, memory and disk. It's presented as a dating game show: the models are contestants and the winner is your Top Match.
  It reads your GPU, VRAM, RAM and free disk space to decide which models qualify, and comes with RigMatch Chat for talking to the winner. There is no account and no telemetry.
