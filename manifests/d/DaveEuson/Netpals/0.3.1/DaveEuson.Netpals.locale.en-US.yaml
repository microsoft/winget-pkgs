ShortDescription: A 2003-style buddy list where the buddies are AI personas who IM you through the day.
Description: |-
  Netpals is a buddy list in the style of 2003 instant messengers, where every buddy is an AI persona. Buddies sign on, go away and come back through the day, message you first, answer your IMs, and talk to each other in Buddy Chat.
  They run on a model on your own computer through Ollama or LM Studio, or on OpenRouter or Claude if you set one up. Your buddies, settings and conversations stay on your computer; Netpals has no server and no online account.
  The free version has up to three buddies. An optional Plus key adds more buddies, Randomize and every theme.
