PackageIdentifier: dkrasiev.Worldkeeper
PackageVersion: 0.1.0
PackageLocale: ru-RU
Publisher: Dmitry Krasiev
PackageName: Worldkeeper
License: MIT
ShortDescription: Автоматические бэкапы миров Minecraft Java Edition при выходе из мира.
Description: |-
  Worldkeeper делает бэкап мира Minecraft: Java Edition в момент выхода из него в игре — в любую папку (сетевую папку NAS, внешний диск, папку облачного диска) или в репозиторий restic.
  Находит миры официального лаунчера, Prism Launcher, CurseForge и Modrinth App, показывает, что внутри мира и каждого сохранения, и восстанавливает любое сохранение — на место или как новый мир.
  Работает в системном трее с локальным веб-интерфейсом.
Tags:
- backup
- minecraft
