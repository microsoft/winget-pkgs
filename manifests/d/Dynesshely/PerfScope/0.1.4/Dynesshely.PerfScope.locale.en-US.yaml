ShortDescription: Application-level CPU and memory monitor for Windows.
Description: |
  PerfScope merges hundreds of Windows processes into the applications they belong to, so you see which
  application is busy instead of which PID. Browser renderers, Electron helpers and background workers
  collapse into one row, and Windows subsystems such as WSL, the graphics stack, security services and the
  kernel are reported as their own apps.

  Highlights: application-level attribution with the reasoning shown in the UI, memory and CPU distribution
  maps, live header trends with hover axes, minute-level history with insights and a daily report, and a
  one-click prompt handoff for your AI assistant.

  PerfScope is a single native Windows app: no .NET runtime to install, no administrator rights, no network
  access and no telemetry. All data stays in %LOCALAPPDATA%\PerfScope (or a directory passed with
  --data-dir).
