# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
#
# PerfScope winget 安装清单（草稿）。
# 占位符与替换方法见同目录 README.md：
#   - InstallerUrl 中的 0.1.4：改成实际版本号
#   - InstallerSha256：改成安装包的实际 SHA-256（64 位大写十六进制）
PackageIdentifier: Dynesshely.PerfScope
PackageVersion: 0.1.4
Platform:
  - Windows.Desktop
# 说明：README 支持 Windows 10 / 11；这里以 Windows 10 22H2 为最低版本，若确认支持更老的 build 可下调。
MinimumOSVersion: 10.0.19045.0
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /S
  SilentWithProgress: /S
UpgradeBehavior: install
# TODO(release): 发布后填写安装包的实际下载地址（tag 必须带 v 前缀）
InstallerUrl: https://github.com/Dynesshely/PerfScope/releases/download/v0.1.4/PerfScope-Setup-0.1.4-win-x64.exe
# TODO(release): 替换为上述 exe 的真实 SHA-256，全大写、64 个十六进制字符。
# 本地计算：Get-FileHash .\PerfScope-Setup-0.1.4-win-x64.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash
InstallerSha256: 440a30aa96023c22abf1deedb2924d2cd1ddacf73749e265903910b161de047a
ManifestType: installer
ManifestVersion: 1.10.0
