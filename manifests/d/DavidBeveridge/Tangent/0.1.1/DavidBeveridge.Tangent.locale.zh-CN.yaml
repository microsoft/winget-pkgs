PackageIdentifier: DavidBeveridge.Tangent
PackageVersion: 0.1.1
PackageLocale: zh-CN
ShortDescription: 一款独立的开源浏览器，旨在延续 Arc 式的浏览体验。
Description: |-
  一款为想要继续以 Arc 方式浏览的用户打造的开源浏览器。
  空间。垂直标签页。始终待在原位的收藏。不会碍事的命令栏。Tangent 把这些理念带进一款使用 Electron、Chromium 和 TypeScript 构建的独立桌面浏览器。
  使用它不需要账户、订阅、API 密钥，也不需要安装 Arc。
  Tangent 是一款处于早期开发阶段的实验性浏览器。真实网站运行在真正的 Chromium 浏览界面上，前面还有大量工作要做。
  Tangent 为何而生
  Tangent 的诞生，是因为 The Browser Company 决定停止开发 Arc。该公司在 2026 年 10 月 22 日的公告中表示，macOS 和 Windows 版 Arc 将于 2026 年 12 月 22 日停止工作，公司的工程与安全工作将转向 Dia。
  这个决定让喜欢 Arc 工作流的用户不得不另找归宿。Tangent 的目标，是在一款代码、方向和未来都向用户和贡献者开放的浏览器中，让那段体验中好用的部分延续下去。
  Tangent 是一个独立实现。它与 The Browser Company 没有任何关联，也不包含 Arc 的专有源代码、可执行文件、品牌或云服务。
  目前已实现的功能
  - 浏览：HTTP/HTTPS、搜索、后退/前进、重新加载/停止、查找、缩放、页面开发者工具。
  - 整理：空间、独立的配置文件、收藏、固定的标签页、今天标签页、重命名、重新排序。
  - 专注：命令栏、侧边栏开关、分隔线可调的双页分屏、快速预览。
  - 持久化：会话恢复、经过校验的 JSON 导入/导出、导入前备份、损坏文件恢复。
  - 历史与归档：按配置文件划分的历史记录、标签页归档、恢复和清除操作。
  - 下载：原生保存对话框、进度、取消，以及定位已完成的文件。
  - 弹出窗口：GET/POST 请求、来源配置文件的 Cookie、opener 语义，并阻止隐藏来源的弹出窗口。
  - 站点权限：对受支持权限按来源弹出提示，Tangent 退出时重置。
  - 外观：浅色、深色和系统主题；原创界面和图标。
  - 更新：经过测试的源码更新脚本、手动获取发布版本、可选的已签名 macOS/Windows 更新器。
  尚未实现的功能
  目前还没有 Chrome 网上应用店集成、密码管理器、隐私浏览、广告/跟踪器拦截、Arc 导入转换器、云同步、默认浏览器集成、多窗口工作区同步、文件夹、Easels、Boosts、Little Arc、四窗格分屏或移动应用。DRM、通行密钥、依赖硬件的网站以及其他高级网站功能还需要更广泛的测试。
  Tangent 接受 HTTP/HTTPS 页面和它自己的新标签页界面。外部应用协议和任意本地文件都被阻止。
  0.1.1 版本捆绑 Electron 45.0.0 与 Chromium 156.0.8078.48。Electron 更新以经过审查的拉取请求形式到来，Chromium 更新则通过完整的 Tangent 构建发布。
  Tangent 没有账户服务，也没有分析后端。你的工作区存储在本地的 Tangent 应用数据目录中，各浏览配置文件分别映射到独立的持久化 Chromium 会话。
