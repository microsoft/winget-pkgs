ShortDescription: Консольный монитор системы и оборудования Windows с историей показаний.
Description: WTOP показывает CPU, RAM, сеть, GPU, диски и датчики, хранит историю в фоновой службе, позволяет просматривать процессы и управлять службами Windows из TUI.
InstallationNotes: Если команда wtop не появилась сразу после установки, откройте новое окно PowerShell или Windows Terminal. При первом запуске WTOP выбирает русский, английский или китайский по языку интерфейса Windows; F8 переключает язык.
