ShortDescription: 带历史记录、硬件自动检测和 Windows 服务管理的终端系统监视器。
Description: WTOP 在 Windows 终端中显示 CPU、内存、网络、GPU、磁盘和硬件传感器，后台服务持续保存历史数据，并支持进程查看和 Windows 服务管理。
InstallationNotes: 如果安装后不能立即识别 wtop 命令，请打开新的 PowerShell 或 Windows Terminal 窗口。WTOP 会根据系统界面语言自动选择中文、俄语或英语，也可按 F8 切换。
