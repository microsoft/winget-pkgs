ShortDescription: A lighter, faster desktop code and text editor built in Rust with its own rendering engine.
Description: |-
  A lighter, faster, more comfortable desktop editor.
  winc is built with Rust and its own rendering engine: it starts in 0.1 seconds and uses just 52 MB of memory with 100,000 lines open. Multiple cursors, find and replace, and side-by-side diffs are all there, and every keystroke and scroll responds instantly. Measured results include 119 ms cold start to first frame and a 1 GB file editable and highlighted in 220 ms.
  Editing covers multiple cursors, find and replace, native input methods and smooth scrolling in gigabyte-scale files. Highlighting covers common programming, markup, data and configuration formats, with lightweight go-to-definition and find-usages that need no language server. Whole files can be formatted through external tools such as rustfmt, Prettier, Black, Ruff and gofmt. Preview covers Markdown, images, SVG and spreadsheets, with a switch back to source at any time.
  Git integration provides side-by-side diffs with word-level highlighting, staging by hunk, committing and pushing, a commit graph and line-by-line blame. Projects get a file tree, quick open and .gitignore-aware project search, and a terminal is docked at the bottom of the window. Light and dark themes, complete English and Simplified Chinese interfaces, and signed in-app updates on all three platforms.
