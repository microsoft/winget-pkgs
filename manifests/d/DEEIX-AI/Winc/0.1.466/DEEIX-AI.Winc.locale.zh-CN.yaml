ShortDescription: 用 Rust 与自研渲染引擎构建的更轻、更快、更顺手的桌面代码与文本编辑器。
Description: |-
  更轻、更快、更顺手的桌面编辑器。
  winc 以 Rust 与自研渲染引擎构建：0.1 秒启动，十万行代码仅占 52 MB 内存。多光标、查找替换、并排差异都在，每一次输入与滚动都即时响应。实测冷启动到第一帧 119 ms，1 GB 文件可编辑带高亮 220 ms。
  编辑能力包括多光标、查找替换、系统输入法，以及 GB 级文件中的流畅滚动。语法高亮覆盖常见编程语言、标记语言、数据和配置格式，并提供不依赖语言服务器的轻量跳转定义与查找用法。整文件格式化可调用 rustfmt、Prettier、Black、Ruff、gofmt 等外部工具。预览支持 Markdown、图片、SVG 与表格（xlsx、csv），随时切回源代码。
  Git 方面提供并排差异（词级高亮）、按块暂存、提交与推送、提交图和逐行追溯。项目功能有文件树、快速打开与遵循 .gitignore 的项目搜索，窗口底部还内置终端。界面提供浅色与深色主题、完整的英文和简体中文，三个平台都有签名的应用内更新。
