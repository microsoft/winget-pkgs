ReleaseNotes: |-
  Winc is licensed under GPL-3.0-or-later from this version; earlier versions remain under Apache-2.0
  ✨ Feature
  - Shape complex scripts in the editor and terminal, such as combining marks, Devanagari, Thai, Arabic and Myanmar, each cluster drawn in the cells of its own characters
  - Set the editor font weight apart from the interface with editor.fontWeight; ui.fontWeight no longer changes the editor (#539)
  - Draw font ligatures in the editor with editor.fontLigatures (#557)
  - Draw rulers after the given columns with editor.rulers (#541)
  - Mark line endings with editor.renderLineEndings (#536)
  - Choose a line, block or underline cursor with editor.cursorStyle (#535)
  - Show the caret inside input method composition in the editor, terminal, input fields and Markdown preview (#532)
  - Open go to line by clicking the cursor position in the status bar (#558)
  - Pretty-print or minify JSON in any file with "Pretty-Print JSON" and "Minify JSON" (#534)
  - Compare the file or selection with the clipboard, or the file with its saved version, from the new "Compare" menu (#456)
  - Compare two files from the command line with winc --diff a b, also usable as a git difftool with -w (#516)
  - Open a missing file given on the command line as a new file, written to disk on the first save (#493)
  - Show CSV and TSV files as written with editor.alignColumns, and cap aligned columns at 32 characters (#454)
  - Link the split CSV and TSV table with the text: the table follows its scrolling and caret, and selecting a cell moves the caret there
  - Wrap Thai, Lao, Khmer and Myanmar between words in the Markdown preview
  - Show the Git log and file histories in a panel at the bottom of the window, toggled with Alt+9 (⌘9 on macOS), or keep them in tabs with git.logPlacement (#444)
  - List recent commits below the changes in the commit view with git.commitHistory, with details on hover (#444)
  - Generate commit messages with a model set on the new AI settings page, turned on with git.generateCommitMessage (#106)
  - Stage, roll back and open changes of any repository from the commit view, with row buttons in one order (#442)
  - Add or remove repositories by hand with "Git: Add Repository…" and "Remove from List", and set how deep to look for them with git.repositoryScanDepth (#487)
  - Color tab names by their Git status (#482)
  - Copy a branch name from the branch menu with "Copy Branch Name" (#489)
  - Export and import settings with "Export Settings…" and "Import Settings…" in Settings › General (#431)
  - Copy the version and system information for bug reports by clicking the version on the About page (#477)
  - Copy files from the file tree as a prompt with "Copy as Prompt": their text in fenced blocks under their paths (#459)
  - Drag file tree items onto another window to move or copy them, on macOS and Windows (#435)
  - Stop the file tree from following the current file with tree.autoReveal, and reveal it on demand with "Reveal Current File in File Tree" (#486)
  - Open project files on SSH hosts from the remote picker (#481)
  - Move terminal tabs between the panel and the editor area without restarting their shells (#465)
  - Create terminals from the tab bar + once a terminal is in the editor area, or with "Terminal: New in Editor Area" (#561)
  - Copy or paste with a right click in the terminal with terminal.rightClick (#560)
  - Paste clipboard images into Windows terminals as a file path with Ctrl+Shift+V or the context menu (#510)
  - Install from the official Arch Linux repository with sudo pacman -S winc (#519)
  ⚡ Optimization
  - Render with CPUI, making scrolling, typing and moving the caret in the Markdown preview up to 30% faster
  - Reparse only the edited blocks when typing in long Markdown documents, and lay out fewer blocks while scrolling (#528, #529, #530)
  - Let wide tables in the Markdown preview use the margins beside the text (#469)
  - Keep the Markdown format toolbar in place while its buttons are clicked (#507)
  - Paste web content as plain text in Markdown source; only the preview converts it to Markdown (#508)
  - Soften the Markdown heading indicator and move it further from the text (#537)
  - Split panes only when dropping near their edge
  - Keep the terminal from flickering while it is resized, and keep its tabs visible in a narrow header
  - Regroup settings, shorten their descriptions, and space the status bar icons evenly
  - Keep the path of a folder opened through a symbolic link (#468)
  - Choose formatters in the background, so opening the settings no longer stalls on network drives (#544)
  🐛 Fixed
  - Fix bold text looking cramped: use the font's own bold weight when it has one (#520)
  - Fix default fonts on Linux ignoring the system fallback order, which left Nerd Font icons missing (#518)
  - Fix fonts known to fontconfig, such as those in the Nix store, not being found by name on Linux (#413)
  - Fix the caret jumping to another block, and typed spaces not moving it, while editing in the Markdown preview (#527)
  - Fix typewriter mode jumping when auto save writes the file (#517)
  - Fix Nix highlighting of indented string escapes, $$, names with primes and interpolations across lines (#491, #506)
  - Fix search previews losing highlighting inside Vue <script> and <style> and other multi-line blocks (#485)
  - Fix search skipping nested repositories that the parent repository ignores (#462)
  - Fix "Find in Folder…" finding nothing on Windows (#490)
  - Fix nested repositories not being listed, and rolling back untracked files deleting them (#479)
  - Fix "Show File History" missing for files outside the current repository (#441)
  - Fix rollback from the file tree and tab menus discarding staged changes in the staging view (#521)
  - Fix Git asking to trust user-level hooks of SSH repositories from Windows, and offer "Trust Repository…" when a Git operation is refused (#515)
  - Fix PDFs on SSH hosts failing to open in the preview (#512)
  - Fix spreadsheet sheet tabs that do not fit being cut off: they now scroll (#514)
  - Fix a file opened at launch losing focus to restored unsaved tabs (#463)
  - Fix attached folders missing when the last folder reopens at launch
  - Fix the window staying behind others when a file is opened in a running Winc on Windows (#471)
