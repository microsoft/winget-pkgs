ReleaseNotes: |-
  ✨ Feature
  - Add a Find in Files dialog that can move to the bottom panel as a Search tab, and choose between it and the sidebar with editor.findInFiles (#251)
  - Show search results as a tree, grouped by folder (#436)
  - View all uncommitted changes in one tab, file after file, with git.combinedDiff (#386)
  - Show staged and unstaged changes in separate groups and diffs in the staging view, with rollback beside the stage and unstage actions (#395, #421)
  - Collapse unchanged diff regions by default with editor.diffCollapseUnchanged (#449)
  - Split a terminal tab into panes, listed under their tab in the vertical list, and split the terminal panel into tab groups (#423, #440)
  - Send requests from .http files (#401)
  - Move or copy selected text by dragging it, with editor.dragAndDrop (#393)
  - Switch tabs by recent use with Ctrl+Tab, and go to the first nine tabs by number (#389, #408)
  - Show full file names in editor tabs with editor.fullTabNames (#443)
  - Animate the caret with editor.smoothCaretMovement: "Off", "Snappy" or "Gliding" (#369)
  - Select a column or extend a selection to the clicked position with Shift+Alt click (⇧⌥ on macOS) (#402)
  - Add Emacs keys to the macOS editor, and bind the macOS Control keys through each keymap (#339)
  - Choose whether Vim or the editor handles each conflicting Ctrl key in Settings › Editor › Shortcut Conflicts, saved to vim.handleKeys, with a notice the first time Vim takes one (#464)
  - Open links from Markdown source and support [[wikilinks]] (#356)
  - Set the Markdown preview's font and size with markdown.font and markdown.size (#364)
  - Paste as plain text in the Markdown editor (#437)
  - Open a new file on launch with editor.newFileOnStartup, give it a language with editor.defaultLanguage, detect the language of pasted text with editor.detectLanguageOnPaste, and list recent languages in the language menu (#323, #327, #359, #377)
  - Save and edit text read from standard input, show language icons, and suggest the extension when saving an untitled file (#377)
  - Reopen files where they were left
  - Run script files from the file tree in the built-in terminal (#348)
  - Add .winc-project files, and open VS Code workspaces, Sublime Text and IntelliJ IDEA projects (#360)
  - Open local files from the command line in a local window (#380)
  - Format a selection with formatters whose settings have no range options
  - Show Unicode escapes in .properties files as characters
  - Highlight Astro, Liquid and Nunjucks, format Astro with Prettier, and treat .latexmkrc as Perl (#368, #412, #414)
  - Quit when the last window closes on macOS with editor.quitOnLastWindowClose (#420)
  - Register every supported file type on macOS, Windows and Linux, with "Explorer Context Menu" and "Associate File Types" settings on Windows (#312, #358)
  - Ship Linux packages for ARM64, built against glibc 2.28 (#357, #361)
  - Install with Scoop and winget on Windows (#385)
  - Install the Arch package on Arch-based distributions such as CachyOS and Omarchy (#445)
  - Play the logo animation on the About page
  ⚡ Optimization
  - Regroup settings into eleven pages with a restyled card and a reset button for each setting, and find commands' shortcuts from the settings search (#410)
  - Load large files faster, and show the window before reading them at launch
  - Take disk and Git work off the interface thread: the state file, folder watching, file tree refreshes, folder reads, backups and remote diff sources
  - Make editing in the Markdown preview smoother
  - Search remote folders on the host instead of downloading every file, and keep quick open in sync with files added, changed or deleted there (#432, #433)
  - Expand remote folders recursively with Alt click (#434)
  - Keep remote connections from blocking the window, using unbounded memory or replacing each other
  - Recover Git status after missed file notifications, and steady the Git sidebar's layout, resizing and refresh (#343)
  - Fold long breadcrumbs so status bar messages stay visible (#350)
  - Bound what malformed files, archives, long lines and repository settings can make the parsers, layout and Git do
  - Depend on any font instead of DejaVu in Linux packages (#400)
  🐛 Fixed
  - Fix entering IPv6 addresses for SSH hosts (#313)
  - Fix connecting to SSH hosts running Windows (#429)
  - Fix restored SSH terminals losing shell integration on a cold start (#349)
  - Fix breadcrumb folder menus failing on SSH hosts (#351)
  - Fix SSH Git diffs showing the whole file as deleted after clicking the editable side (#391)
  - Fix downloads of remote folders stopping at sockets or broken links, and name the item that failed (#374)
  - Fix Powerline separators not lining up with terminal cells (#341)
  - Fix terminal tabs not following the sidebar when it collapses (#424)
  - Fix the split Markdown preview not scrolling to its end with the source (#352)
  - Fix Lua long comments and strings showing in the outline (#362)
  - Fix the Markdown preview becoming read-only after the file changed on disk (#371)
  - Fix Markdown tables scrolling to the caret before it moved (#419)
  - Fix leaving and continuing quotes in Markdown source
  - Fix \Box, \square, \varGamma and other common LaTeX symbols not rendering (#446)
  - Fix LaTeX builds on Windows receiving the source path with backslashes
  - Fix Astro frontmatter fences breaking on format
  - Fix the editor font changing the interface's Chinese text, and the interface font changing the editor's (#453)
  - Fix pasting long multi-line text keeping only part of it (#426)
  - Fix Find in Files filling the query and path from the file tree (#439)
  - Fix the caret staying hidden when opening a single file from outside (#417)
  - Fix the pointer showing the text cursor over scrollbars, controls, cards, completion lists, in-window menus and alerts (#372, #396, #447, #448)
  - Fix right-clicks on cards, completion lists, the Find in Files dialog and the Search tab opening the menu of what is below (#451)
  - Fix the tab menu in a single-tab pane offering moves and closes that did nothing (#366)
  - Fix unfocused panes' tabs in the top bar acting as the window caption on Windows (#367)
  - Fix a crash on start when a restored tab's file had been deleted, and the wrong tab being active after a restore (#375)
  - Fix Windows file dialogs stalling for seconds when changing folders (#382)
  - Fix staging many files on Windows failing with a command line that is too long (#394)
  - Fix "Reveal in File Explorer" ignoring the registered file manager on Windows (#404)
  - Fix the layout of a minimized window on Windows (#418)
  - Fix the Windows installer looking blurry on scaled displays (#388)
  - Fix the MSI build (#385)
  - Fix closing the last window in full screen leaving a black screen on macOS (#398)
  - Fix "Follow System" not following the color scheme on Linux (#399)
  - Fix the startup notification not ending when Winc is launched from a Linux desktop (#397)
  - Fix rolling back from the staging view's Changes group also discarding staged changes
  - Fix staged renames not being committed, and unstaged edits slipping into commits reformatted from the staging view
  - Fix stashing many files from fully selected folders
  - Fix Git log and diff tabs, and lines in previewed files, missing from back and forward history (#406)
