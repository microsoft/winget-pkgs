ReleaseNotes: |-
  A hotfix for 2.0.6.
  Fixed: HyperX Cloud Stinger 2 Wireless now shows up as supported; Compx receivers (Redragon M901P-KS and others) are tried on every channel and report what each answered; about 30 Russian texts translated.
  New: a supported device can also be set up with a scan from its card menu; an optional old reading alert for devices that are only read now and then.
