ReleaseNotes: |-
  A hotfix for 2.0.6.
  Fixed
  - HyperX Cloud Stinger 2 Wireless now shows up as supported. It was looked for in the wrong place, so only Set up was offered.
  - Redragon M901P-KS and other mice on Compx receivers: Battery Hub now tries every part of the receiver, and if it still can't read it, the error says what each part answered.
  - Russian: about 30 texts that were still in English are translated, with correct plural forms (by @Dfavorit55).

  New
  - A supported device can also be set up with a scan from its card's ⋯ menu. If its reading ever fails, that scan is how you send what's needed to fix it.
  - An old reading alert, off by default: when a device hasn't had a real reading for a few days, Battery Hub tells you. Useful for a headset that can only be read over Bluetooth (by @maxeinstein-dev). Turn it on in Settings → Notifications.
  Thanks to @maxeinstein-dev and @Dfavorit55 for their contributions.
