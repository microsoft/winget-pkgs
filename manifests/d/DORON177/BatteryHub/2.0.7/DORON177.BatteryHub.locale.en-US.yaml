ShortDescription: Live battery monitoring for wireless mice, keyboards, headsets and controllers on Windows.
Description: Battery Hub reads the battery level of wireless HID peripherals — mice, keyboards, headsets and game controllers — and shows them on a single dashboard with a per-device indicator in the system tray and low-battery notifications. Devices with no known protocol can be set up through a guided calibration wizard that identifies which byte of the HID report carries the battery level, so support is not limited to a fixed list of models. Runs entirely locally and collects no user data.
