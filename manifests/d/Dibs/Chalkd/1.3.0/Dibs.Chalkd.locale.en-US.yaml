ShortDescription: A touch-first infinite whiteboard for teachers
Description: |-
  Chalkd is a free, open-source infinite whiteboard made for teaching on touchscreens.
  Draw with pens and highlighters, pan and zoom with your fingers, erase by touch,
  and keep boards organized in notebooks that autosave to Documents\Chalkd.
  Import PDFs and pictures, export to PDF or PNG, and print from any app straight onto a new board.
