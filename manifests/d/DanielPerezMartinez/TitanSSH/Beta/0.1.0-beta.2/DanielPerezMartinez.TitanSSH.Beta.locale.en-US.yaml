ShortDescription: Resilient multi-platform SSH client (pre-release builds)
Description: |-
  titan-ssh is an open-source SSH client for Windows, Linux and Android. Sessions survive network
  micro-outages without losing the running processes, and each session can run its own startup
  scripts. Credentials are kept in the operating system's secret store. This package tracks the
  pre-release (alpha, beta and rc) builds.
