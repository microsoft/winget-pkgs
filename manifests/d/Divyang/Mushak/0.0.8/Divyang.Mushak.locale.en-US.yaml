ShortDescription: Native Windows customization for Logitech HID++ mice.
Description: >-
  Mushak is a native Windows tray utility for Logitech HID++ mice. It
  discovers the mouse name and exposes supported DPI, wheel, battery,
  gesture, and extra button settings. MX Master diagrams open action
  popovers for reported controls. Application profiles switch button
  mappings with the active program. Support for the MX Master family,
  Mac and Business variants, and MX Vertical is experimental. Physical
  validation across all added models and connections is pending.
