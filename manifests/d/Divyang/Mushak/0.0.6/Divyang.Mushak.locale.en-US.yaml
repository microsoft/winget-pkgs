ShortDescription: Native Windows customization for Logitech HID++ mice.
Description: >-
  Mushak is a native Windows tray utility for Logitech HID++ mice. It
  discovers the mouse name and exposes supported DPI, wheel, battery,
  gesture, and extra button settings. Application profiles switch
  button mappings with the active program. Version 0.0.6 adds experimental
  support for the MX Master family and MX Vertical over Bluetooth,
  compatible receivers, and supported wired USB. Physical validation
  across all added models and connections is pending.
