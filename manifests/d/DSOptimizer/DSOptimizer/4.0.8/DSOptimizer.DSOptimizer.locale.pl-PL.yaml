Description: DSOptimizer to darmowe narzędzie open source do porządkowania i konfigurowania Windows 11. Usuwa preinstalowane aplikacje, wyłącza telemetrię, reklamy i funkcje AI, wykonuje naprawy i instaluje programy przez winget. Każda zmiana ustawień trafia do historii i można ją cofnąć. Instaluje się w Program Files dla wszystkich użytkowników; opcja --location nie jest obsługiwana. Wersja przenośna (zip) jest na stronie wydań GitHub.
