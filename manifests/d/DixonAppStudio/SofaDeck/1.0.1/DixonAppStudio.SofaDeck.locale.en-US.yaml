ShortDescription: Turn your phone into a Stream-Deck-style button pad and voice remote for your PC.
Description: |-
  SofaDeck turns any phone or tablet into a customizable button deck and voice remote for your Windows PC, with no phone app to install.
  Scan a QR code, type the 6-digit PIN, and control apps, media, volume, keys, macros and games from the couch.
  It listens only on your home network, pairs each phone with its own key, and sends no telemetry.
