ShortDescription: Save videos and photo posts from Douyin, TikTok, YouTube, Telegram and X to a local archive.
Description: |-
  Douzy is a desktop app that saves videos, photo posts, profiles and collections from Douyin, TikTok, YouTube, Telegram and X to your computer. Paste a link; Douzy works out what it is, queues it in the background and files the result into a local archive. The task center shows progress and failure reasons, and lets you retry a single task.

  The Standard edition is free and handles single-link tasks. A paid activation code adds multi-link queues, profile batches, sync and subscriptions.

  Douyin, TikTok and YouTube run through the yt-dlp plugin you enable in the app's Plugin Center. Telegram uses TDLib with your own api_id and api_hash. X uses a component that ships with the app. Please only save content you have the right to save.
