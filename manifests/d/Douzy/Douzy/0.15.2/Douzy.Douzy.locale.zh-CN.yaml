ShortDescription: 把抖音、TikTok、YouTube、Telegram 和 X 上的视频、图集保存到电脑里的作品档案。
Description: |-
  Douzy 是一个桌面应用，能把抖音、TikTok、YouTube、Telegram 和 X 上的视频、图集、主页和合集保存到你的电脑。粘贴链接后，Douzy 认出这是作品、图集、主页还是合集，在后台排队下载，存进你电脑里的作品档案。任务中心会显示进度和失败原因，失败的任务可以单独重试。

  标准版免费，单链接任务装好就能用；批量、同步和订阅需要付费激活码。

  抖音、TikTok、YouTube 由你在插件中心启用的 yt-dlp 插件处理，Telegram 用 TDLib（需要你自己申请的 api_id 和 api_hash），X 用应用自带的组件。请只保存你有权保存的内容。
