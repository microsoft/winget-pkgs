ShortDescription: Free, open-source screen recorder and demo video editor
Description: |-
  Native Screen records your screen and turns it into a polished product demo, all on your computer.
  Zooms follow your clicks and typing, the cursor glides instead of shaking, and a multi-track timeline holds zooms,
  blur and spotlight masks, annotations, captions and keyboard shortcuts.
  Recording, captions, transcript editing and export run locally: no account, no upload, no watermark.
  AI agents (MCP clients) can record, edit and export through the app.
