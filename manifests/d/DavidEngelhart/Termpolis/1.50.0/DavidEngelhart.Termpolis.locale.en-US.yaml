ReleaseNotes: |-
  Linked machines: your agents can work with your other computers
  Pair two or more computers running Termpolis. An agent on one can then have a Claude, Codex or Gemini agent on another do a task in the background and send the answer back. It works in both directions, across any network.
  For example, Claude on your laptop can ask Codex on your Linux box to implement something there and send back the commit and test results. Claude then reviews it, and nothing gets pasted into your terminal.
  Set it up on each computer under Settings ▸ Linked machines:
  1. Turn it on on both computers.
  2. On one, choose Link a computer, then Create code, then Copy.
  3. On the other, paste it under Enter a code.
  4. Check that both screens show the same 8 safety words, name each computer, and click They match — link.
  Use it. Just ask your agent, for example "have codex on linux do X in ~/repos/foo". It uses the new linked_machines tool. Long jobs return a job id, and the agent checks back for the result.
  Stay in control
  - Delegated agents are read-only unless the computer doing the work allows edits for that link.
  - A delegated agent can't hand work on to a third computer.
  - Answers from another computer are scanned and flagged before your agent sees them.
  - Taking away a permission, or unlinking, stops that computer's running jobs.
  - Traffic is end-to-end encrypted through the relay, which only ever carries sealed bytes.
  - Both computers need Termpolis running. Up to 16 linked computers.
  Also in this release
  - termpolis exec --cwd now really runs the agent in that folder.
  - Windows: a folder name can no longer break out of the headless-agent launch command.
  - Windows: headless Claude no longer picks a stale npm copy over your installed Claude Code.
  - macOS:
    - closing the window keeps Termpolis (MCP, Remote, Linked machines) running in the Dock;
    - ⌘Q quits on the first press;
    - a computer running another computer's job won't idle-sleep in the middle of it.
  - Remote: fixed a restart race that could leave two bridge processes fighting over the relay.
  Full Changelog: https://github.com/codedev-david/termpolis/compare/v1.49.4...v1.50.0
