ReleaseNotes: |-
  Electron 43
  Termpolis now runs on Electron 43, up from 30: a current Chromium, V8 and Node underneath everything. Thanks to @jbaarsch2 for the upgrade (#34).
  - macOS 12 (Monterey) or later is now required. Electron 43 doesn't start on 10.15 or 11, so auto-update won't offer this version there. Those Macs stay on 1.51.5.
  - Linux: on a Wayland desktop, Termpolis now runs as a native Wayland app instead of through XWayland.
  - Dropping a file onto a terminal still types its path. Electron removed the API this used, and it now goes through webUtils.getPathForFile.
  - The Commit Shield's repository picker and the memory sync-folder picker now open in your home folder. With no folder given, Electron 43 opens Downloads.
  Fixes
  - Quitting on Linux and macOS now waits, for at most two seconds, until every terminal's shell has exited. Two problems are fixed:
    - A shell that exited at the wrong moment of shutdown could crash Termpolis on its way out.
    - A shell that ignored the hangup could keep Termpolis from exiting at all.
  - Settings ▸ Remote and ▸ Linked machines no longer say "connected to the relay" while the relay can't be reached. They now say "connecting to the relay…", say that nothing is paired or linked yet, or say "connected" once the relay has actually seated this computer.
  - Background helpers (the memory store, the process host, the phone bridge, the compression proxy) can no longer start, or be left running, after Termpolis begins to quit.
  - Every Windows build is now scanned before release. Microsoft Defender checks the signed installer, then the app is installed and run with real-time protection on. The release isn't published if Defender flags any of it.
  Full Changelog: https://github.com/codedev-david/termpolis/compare/v1.51.5...v1.52.0
