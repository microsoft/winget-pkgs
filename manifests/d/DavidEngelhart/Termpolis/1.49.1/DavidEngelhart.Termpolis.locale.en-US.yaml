ReleaseNotes: |-
  Fixes
  Termpolis Remote shows the terminal as soon as you open it. Opening a terminal on your phone used to leave it blank until you typed something. An agent sitting at its prompt prints nothing, and the phone was waiting for new output. Now it gets the current screen straight away. If you had opened that terminal earlier, it also no longer resumes from where it left off with a half-drawn screen. A terminal you reopen keeps about the last 32 KB of its history. No phone update is needed.
  Uninstalling and disconnecting
  - Uninstalling on Windows can no longer hang while it disconnects your agents. That step gives up after 30 seconds, and nothing it does can stop the uninstall.
  - Removing the Linux package (sudo apt remove termpolis) now takes Termpolis back out of each user's Claude Code, Codex and Gemini CLI settings, as the Windows uninstaller does. Upgrading leaves them connected.
  - Disconnect no longer stops partway when one step fails. It finishes the rest and lists the step that failed.
  - If Termpolis can't save your answer about connecting your agents, it now tells you, and asks again instead of carrying on as if it had saved.
  - Claude Code's start-up memory hook now does nothing once Termpolis is removed, so uninstalling without disconnecting first no longer leaves Claude Code running a hook that fails. On Windows without Git Bash, where Claude Code runs hooks in PowerShell, the hook now also works while Termpolis is installed. Existing hooks are upgraded once, at the next start.
  Second Opinion stops everything it started. When a run times out, or you quit Termpolis, Second Opinion and termpolis exec now stop the agent and every process it started. On Windows, the agent used to keep running.
  Update errors stay current. An old update error, such as the low-disk-space notice, no longer comes back when a later check fails because you're offline or GitHub is briefly unreachable. Settings no longer stays stuck on "Checking…" after a check like that.
  Docs. The documentation now lists the Settings tabs by their real names. It also has the current tool counts, keyboard shortcuts and log locations, plus new sections on Second Opinion and on the permission flags each swarm agent starts with. The README now says memory encryption is on by default wherever your OS keychain is available, where it used to call encryption optional.
  Full Changelog: https://github.com/codedev-david/termpolis/compare/v1.49.0...v1.49.1
