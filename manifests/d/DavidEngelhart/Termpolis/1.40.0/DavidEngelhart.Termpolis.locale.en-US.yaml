ReleaseNotes: |-
  Termpolis Remote: one phone, many desktops
  Pair the phone app with up to 16 desktops — a Windows box, a Linux VM, a Mac — and switch between them from a list. Each one carries the name of the machine it runs on, so the rows are told apart by what they are rather than by position.
  - Named pairings. The desktop sends its own hostname when you pair. Older desktops that don't send one still pair; the phone captions those itself.
  - A key per desktop. Every pairing mints its own keypair, so each desktop knows the phone by a different device id. Unpairing on one says nothing about the others.
  - One at a time on the wire. Switching desktops closes the previous connection and clears its terminals and grants — a command can only ever reach the machine on screen.
  - Backwards compatible. A 1.39 desktop and a 1.40 phone still pair, in both directions.
  Full mobile suite at 100% coverage; 10,239 tests on the desktop side.
  Full Changelog: https://github.com/codedev-david/termpolis/compare/v1.39.2...v1.40.0
