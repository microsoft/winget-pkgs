PackageName: DingDangCS
ShortDescription: AI customer-service assistant for Chinese e-commerce sellers, with image understanding and built-in human review
Description: DingDangCS is a Windows desktop AI customer-service assistant for small online shops. It auto-replies to buyer questions across Qianniu (Taobao/Tmall), Pinduoduo, JD, Douyin Shop, Kuaishou, Xiaohongshu, WeChat and Xianyu, understands buyer photos, and can be set to draft replies for human review before sending. Knowledge base stays on the local machine. The free tier allows 30 AI replies per day.
