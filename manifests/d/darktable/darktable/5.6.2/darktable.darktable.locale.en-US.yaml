  Other Changes
  - N/A
  Documentation updates
  - Versioning of the docs has resumed! With release of each new major version of darktable we take a snapshot of the current state of the development-docs.
  - The stable documentation for 5.6.2 can be found here and now contains a version switcher at the top to switch between 5.6 and development version of the manual.
  - If you find room for improvement on the manual, you are welcome to open an
    issue, post to
    pixls.us,
    or submit a PR yourself.
  - Translations of the docs are maintained through weblate.
  Bug Fixes
  - Fixed highlights modes for 4BAYER (CYGM/RGBE) raws, only clipping mode is available for those.
  - Fixed darktable stealing the focus from other applications on Windows, pushing itself in front of whatever you were using and
    taking the keyboard. This could happen when hovering over lighttable thumbnails, during import and export, and when log messages appeared
    or expired. While darktable was minimized it took the keyboard without becoming visible.
  - Fixed Alt+Tab failing to switch away from darktable on Windows when the mouse pointer was over a lighttable thumbnail.
  - Fixed the console windows that repeatedly appeared on Windows when darktable or a Lua script ran an external command. darktable now
    keeps a single console session for its lifetime instead of creating a new console for each command.
  - Fixed highlights laplacian OpenCL code.
  - Fixed OpenCL input gamma corrected scaling for some devices.
  - Fixed an OpenCL error in filmicrgb leading to wrong masks.
  - Fixed transparent dialog title bars on macOS 27.
  - Fixed a crash when importing a style whose module order is empty. The malformed order is now ignored and the style keeps the default one.
  - Fixed a crash at the end of neural restore's raw denoise on certain sensor sizes, where blending the tile seams wrote past the edge of
    the image.
  - Fixed small memory leaks when expanding variables, which grew with the number of images exported or imported in one run.
  - Fixed a small memory leak each time a history stack was pasted onto the image open in darkroom.
  - Fixed a crash or hang on Windows when checking a faulty custom ONNX Runtime library.
  - Fixed corrupted output or a crash when an AI model returns more data than darktable reserved for it, affecting object masks and Lua models.
  - Fixed OpenCL support for recent Intel drivers.
