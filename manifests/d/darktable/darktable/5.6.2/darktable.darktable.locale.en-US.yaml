  Notes
  - When exporting to AVIF, EXR, JPEG XL, or XCF, selecting specific metadata (e.g. geo-tag or creator) is not currently possible. For
    AVIF, EXR, JPEG XL, and XCF formats, darktable will not include any metadata fields unless the user selects all of the checkboxes in the
    export module's preference options.
  - Starting with release 5.4, macOS versions older than 14.0 are no longer supported on Apple Silicon Macs, nor older than macOS 15 on
    Intel Macs.
  - On Windows 11 24H2 and later, darktable no longer creates any console window. On earlier Windows versions one console window is
    retained for as long as darktable runs and closes automatically when darktable exits.
