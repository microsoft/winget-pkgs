Description: DreamPaper 是一款在本地运行的科研论文插图与学术幻灯片制作智能体。它以模板驱动，先抽取结构或母版、再填充内容，兼容 OpenAI、Anthropic 等多种模型协议。生成的图片可在工作台中进行修复与裁剪等后期处理并无损导出，支持离线 OCR 文字修复、历史案例记忆与 advisor 版式建议。配置与产物保存在本地。
