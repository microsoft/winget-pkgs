PackageIdentifier: dream-rec.DreamPaper
PackageVersion: 0.2.0
PackageLocale: en-US
ShortDescription: Local agent for creating scientific paper figures and academic presentation slides.
Description: DreamPaper is a locally running agent for creating scientific paper figures and academic presentation slides. It is template driven, extracting structure or masters before filling in content, and supports model protocols including OpenAI and Anthropic. Generated figures can be repaired, cropped, and exported losslessly in the workbench, with offline OCR text repair, historical case memory, and layout suggestions from an advisor role. Configuration and outputs stay on the local machine.
