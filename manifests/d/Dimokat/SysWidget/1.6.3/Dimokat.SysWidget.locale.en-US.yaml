ShortDescription: A tiny desktop widget that shows CPU, GPU, FPS, RAM, network, ping, disks, battery and what's playing.
Description: |-
  SysWidget is a small, native system monitor widget for Windows 10 and 11. It shows CPU load and temperature, every GPU (NVIDIA, AMD and Intel), FPS of the app in front, RAM, network speed, ping, disk activity and free space, battery and the song that's playing, with graphs.
  Use it as a full panel, a one-line strip that opens into cards when you point at a stat, or a slim column on the side of the screen. It can show your stats in games through RivaTuner, warn when something runs hot, and updates itself in one click.
  About 0.03% CPU; nothing is injected into games.
