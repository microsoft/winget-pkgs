ReleaseNotes: |-
  ## Stelliverse 6.2.4 — Raffinerie et sécurité

  ### Raffinerie : nouvel onglet Commandes

  - Quand le jeu annonce la fin d’une commande de raffinage, Stelliverse le détecte dans son journal et l’affiche dans un nouvel onglet « Commandes » de la fenêtre Raffinerie : prête, en cours avec décompte, ou récupérée.
  - Une commande peut aussi être saisie à la main, et le widget Raffinerie de l’accueil ainsi que la notification en jeu affichent les mêmes informations.
  - Un réglage « Prévenir » choisit si l’alerte vient de l’annonce du jeu, du minuteur, des deux, ou d’aucun.

  ### Raffinerie : lecture automatique du terminal

  - Une touche (F7, F8 ou F9, réglable dans l’onglet Commandes, ou aucune) lit l’écran du terminal de raffinage et remplit la commande avec sa méthode, ses matériaux et leurs quantités.
  - En mode Automatique (par défaut), un simple clic dans le jeu déclenche la lecture sans appuyer sur une touche.
  - Le choix de lire l’écran entier ou seulement un cadre tracé autour du terminal se règle aussi dans cet onglet ; une petite image montre ce qui a été lu, utile pour vérifier ou ajuster le cadre.
  - La lecture reconnaît plusieurs langues du jeu et tolère de petites erreurs.

  ### Sécurité et stabilité

  - Correctif de sécurité dans la base technique de l’application, qui empêchait une page piégée dans une fenêtre d’accéder à des informations destinées à une autre fenêtre.
  - Travail supplémentaire pour réduire les plantages aléatoires de l’application.
