ReleaseNotes: |-
  v5.0.80.0
  Changes in this release:
  #1542 Replace log: Added a new log to show the before and after results of the replace operation, showing a full list of all the modified files. The log is shown in the main window while changes are accepted or rejected in the Replace dialog, and after the replace is committed. The log can be enabled or disabled using the "Show replace log" in the Search options section in the Options dialog. Thank-you to @DerellLicht for the contribution.
  #1546 Search in results: Made the "Search in results" checkbox on the main screen visible always and disabled or enabled based on the current search results, to make the feature more visible.
  Release includes updates to
  .NET 10.0.15
  7Zip 26.06
  Other third-party library updates
  Translations
  Updated Translations to several other languages, thank-you for your contributions. Many languages need help to complete them. You are welcome and encouraged to complete or improve any of the existing translations, see Translate dnGrep for more information. Do as much or as little as you like, all help is welcome.
  This program uses free code signing provided by SignPath.io, and a certificate by the SignPath Foundation.
