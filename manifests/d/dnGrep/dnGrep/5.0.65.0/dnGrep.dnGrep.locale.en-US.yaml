ReleaseNotes: |-
  v5.0.65.0
  Changes in this release:
  #1538 Testing for binary files: The revised IsBinary test released in August 2026 (5.0.49) includes a check for control characters in the file and marks the file as binary if they are found. Some text file may contain control characters and are incorrectly marked as binary. Added a new option to skip the control characters check: In the Search Options section of the Options dialog, check or uncheck "Ignore control characters when detecting binary files".
  Release includes updates to
  .NET 10.0.13
  7Zip 26.04
  Other third-party library updates
  Translations
  Updated Translations to several other languages, thank-you for your contributions. Many languages need help to complete them. You are welcome and encouraged to complete or improve any of the existing translations, see Translate dnGrep for more information. Do as much or as little as you like, all help is welcome.
  This program uses free code signing provided by SignPath.io, and a certificate by the SignPath Foundation.
