ShortDescription: Convert any file by dragging it and pressing Shift — images, video, audio, documents, spreadsheets and PDFs, fully offline.
Description: |-
  Rotiva lives in the system tray. While dragging a file, press Shift and a format wheel appears at the cursor;
  point at a format and let go, and the converted file is saved next to the original. It also compresses images,
  video and PDFs, merges files into one PDF, splits PDFs, extracts text with Windows OCR, and creates or extracts
  ZIP/RAR/7Z archives. FFmpeg, ImageMagick, Ghostscript, LibreOffice, Pandoc and 7-Zip are bundled, so nothing is uploaded.
