ShortDescription: Never forget to clock in or out. Reminds you before each punch, or punches your web time clock at your real hours.
Description: |-
  Punchtual is a small tray app that remembers to clock you in and out. A few minutes before each clock-in and clock-out it gets your attention, or it signs in to the web time clock your employer already uses and punches at your real hours. It reads your time clock before and after every punch, records only true timestamps, catches up after sleep or a restart, and writes down what happened. 14 days free; then $59 a year or $6.99 a month on punchtual.app.
