ShortDescription: A temporary screenshot shelf. Drag Win+Shift+S snips into any app or upload box as real PNG files.
Description: |-
  Windows only puts Win+Shift+S screenshots on the clipboard, so you can paste them but not drag them into an upload box.
  Perch catches every image that lands on the clipboard, shows it as a card at the edge of your screen, and lets you drag it into any app or browser drop zone as a real PNG file.
  Snips expire on their own. No network calls, no telemetry.
