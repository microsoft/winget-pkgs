ReleaseNotesUrl: https://gitlab.freedesktop.org/dabrain34/GstPipelineStudio/-/releases/0.7.3
ReleaseNotes: |-
  What's new in 0.7.3:
  - The update check uses ureq 3, the version Debian ships
  - Builds without the update check, such as distribution packages, no longer pull in ureq and its TLS stack
  - The Flatpak builds again against the GNOME master SDK
  Highlights of the 0.7.x series:
  - New application icon
  - Nodes colored by type: source, transform, sink
  - Swap a node for an alternative element from its context menu
  - Tags tab listing tags from bus messages
  - Sortable columns in the element and pipeline lists
  - Suggestions reuse a compatible free element already in the graph
  - Space bar toggles play/pause, s stops the pipeline
  - Explicit properties are kept when importing a pipeline
  - Drag elements, favorites and pipelines from the lists onto the graph
  - Terminal tab in the bottom panel (Linux and macOS)
  - Notice when a newer release is available (AppImage, Windows and macOS installers)
  - Main window built on libadwaita
  - German and Finnish translations added; Italian, French, Portuguese and Spanish completed
