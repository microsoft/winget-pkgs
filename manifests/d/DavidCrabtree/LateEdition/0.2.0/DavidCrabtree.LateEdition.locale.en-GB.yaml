ShortDescription: A newsroom on your desktop, staffed by the AI agents you already pay for.
Description: |-
  Late Edition runs the AI coding agents already installed and signed in on your machine (Claude Code, Codex CLI, Gemini CLI, OpenCode, Ollama or a direct API) as the staff of a small newspaper. You brief a topic; a researcher digs, reporters file competing angles, an editor picks the line, the copy desk cuts anything that does not cite a source, and the result is rendered as a paper in one of eleven house styles. Everything runs locally: no accounts, no servers, no analytics. Every edition carries a notice that it is machine-produced and unchecked.
