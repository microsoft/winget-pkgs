ReleaseNotes: |-
  Changes
  - feat(BREAKING): support checksums on extends and only configure process plugins from trusted configuration (#1396)
  - fix(BREAKING): don't let associations or remote negated excludes override the gitignore (#1393)
  - feat: update npm specifiers in extends with dprint config update (#1464)
  - feat: let plugins say whether they format a range (#1422)
  - feat: add permissions to dprint lsp to prevent editor from downloading from untrusted sources and to prevent running process plugins without approval (#1408)
  - feat: publish a signed packslip with each release (#1407)
  - feat(BREAKING): restrict process plugins override config (#1397, #1457)
  - fix: only allow npm package names that npm allows (#1402)
  - fix: explain a missing dynamic loader when a process plugin fails to start (#1403)
  - fix: report a wasm plugin running out of stack as an error for the file, and give wasm 8 MiB of stack (#1463)
  - fix: respect .git/info/exclude in a linked git worktree and a submodule (#1462)
