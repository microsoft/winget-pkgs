ReleaseNotes: |-
  - fix(BREAKING): make --config file patterns relative to the config file's directory (#1257)
  - feat(BREAKING): evaluate associations and override files in order where the last match wins (#1258)
  - feat: add plugins with dprint init when a config file already exists (#1241)
  - feat: additive plugins (#1249)
  - feat: always pre-select a json plugin with dprint init (#1252)
  - feat: support neverPreselect in the plugin info file (#1253)
  - fix(development): harden range markers in specs (#1256)

  This release features a breaking change for glob patterns in config files specified with --config <file-path>. Previously in this case, the patterns would be relative to the cwd, but this was bad because it would cause things to work in unexpected ways based on what the cwd is (fragile). See #1257 for workarounds and please open an issue if this really breaks you and I'll try to come up with a solution. Remote configs will continue to work like before where the patterns are relative to the cwd.
