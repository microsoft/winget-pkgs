ShortDescription: An alternate-history grand strategy game where an AI game master plays the rest of the world.
Description: |-
  Pick a turning point of the 20th or 21st century – 1914, 1939, 1950, 1964, 1991, 1999, 2014 or 2022 – and any country on the map, then govern it in plain words. A language model plays the rest of the world as game master, and the game's own engine keeps the map, the wars, the economy and the dice honest.
  The game master is ChatGPT, played on your own ChatGPT plan through Sign in with ChatGPT; without an account an offline demo game master answers every turn. Free and open source; English, Russian and Ukrainian.
