Description: |-
  Выберите поворотный момент XX или XXI века – 1914, 1939, 1950, 1964, 1991, 1999, 2014 или 2022 – и любую страну на карте и управляйте ею обычными словами. Языковая модель играет остальной мир как ведущий, а движок игры следит, чтобы карта, войны, экономика и кости были честными.
  Ведущий – ChatGPT, он работает на вашей собственной подписке через вход с ChatGPT; без аккаунта каждый ход отвечает офлайн-ведущий. Бесплатно и с открытым кодом; русский, украинский и английский.
