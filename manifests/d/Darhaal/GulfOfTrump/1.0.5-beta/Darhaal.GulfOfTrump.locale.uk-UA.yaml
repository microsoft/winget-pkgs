ShortDescription: Глобальна стратегія альтернативної історії, де решту світу грає ШІ-ведучий.
Description: |-
  Оберіть поворотний момент XX або XXI століття – 1914, 1939, 1950, 1964, 1991, 1999, 2014 або 2022 – і будь-яку країну на мапі та керуйте нею звичайними словами. Мовна модель грає решту світу як ведучий, а рушій гри стежить, щоб мапа, війни, економіка й кості були чесними.
  Ведучий – ChatGPT, він працює на вашій власній підписці через вхід з ChatGPT; без акаунта кожен хід відповідає офлайн-ведучий. Безкоштовно й з відкритим кодом; російська, українська та англійська.
