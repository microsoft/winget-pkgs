ShortDescription: Clean window screenshots on a white booth, with the real shadow and rounded corners
Description: |-
  ScreenshotBooth is a tray-resident tool for taking tidy screenshots of a
  single window. Press the hotkey (Win+Shift+B by default) over any window
  and it is centered on a white "booth" at a preset size (4:3, 16:9, ...),
  held on top, and captured together with its real DWM shadow and rounded
  corners. The result goes straight to the clipboard, and can be saved as
  PNG/JPEG or shared. Countdown, a window picker, fit-to-booth, editable
  size presets and Japanese/English UI are included. Built with WinUI 3,
  self-contained (no runtime install needed).
