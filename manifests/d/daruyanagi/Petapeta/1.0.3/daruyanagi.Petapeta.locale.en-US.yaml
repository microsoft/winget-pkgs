ReleaseNotes: |-
  変更点
  新機能
  - 画像 URL のダウンロード — ブラウザーで「画像のリンクをコピー」した場合など、コピーしたテキストが画像の URL のときは、画像を取得してファイルとして貼り付けられるようになりました。拡張子のない CDN 形式の URL にも対応(Content-Type 判定)。設定でオフにもできます(#7)
  - 診断ログの拡充 — テキストをコピーした時点で「保留しました」を記録するようになり、コピー直後の動作が分かりやすくなりました。対象外の形式をスキップした場合も理由を記録します(#9)
  - ログにコピー元アプリ名を記録 — 「ファイル形式を追加: …(コピー元: msedge)」のように、どのアプリからのコピーかが分かるようになりました(#5)
  修正・改善
  - 「ステージングフォルダーを開く」でクラッシュすることがある問題を修正 — PATH 環境変数に依存しない方式へ変更し、未処理例外のクラッシュログ保存も追加しました(#6)
  - ブラウザーからのコピーが反応しないことがある問題を修正 — Chromium 系のクリップボード書き込みが完了する前に処理してしまう競合をリトライで救済(#10)。また、更新イベントの並走による二重ファイル化・ファイル名競合も解消しました(#8)
  - ステージングの自動削除を効率化 — 1件ずつの逐次削除をやめ、上限を一定数超えたときにまとめて削除する方式(ローワーターマーク)に変更しました(#4)
  Full Changelog: v1.0.2...v1.0.3
