ReleaseNotes: |-
  基本機能が出そろったため、マイナーバージョンを 1.1 に上げました。
  新機能
  - 画像の保存形式を選べるようになりました(#41)。設定 → 対象 → 画像をファイル化の配下に[保存形式]を追加
    - そのまま — コピー元の形式(PNG/JPEG/GIF/BMP/WebP)を無劣化で保存します。JPEG の再圧縮劣化がなく、GIF はアニメーションも保てます
    - JPEG / PNG — 常に変換して保存します(既定は PNG で従来どおり)
  - SVG など、ビットマップの載らない「画像をコピー」に対応しました(#43)。ブラウザーで SVG 画像をコピーした場合も、エクスプローラーへの切り替え時に画像を取得してファイルとして貼り付けられます
  修正・改善
  - 設定ページ:[画像 URL をダウンロードしてファイル化]を[画像をファイル化]の配下に整理しました(#41)
  - 情報ページの謝辞・リンクを設定と同じカードデザインに刷新しました(#39)
  - 設定ページを開いたまま監視を切り替えても、対象オプションの有効/無効が即座に追従するようになりました(#19)
  - 自動起動の設定に失敗したとき、トグル表示が実際の状態へ戻るようになりました(#20)
  - 開発基盤: push/PR ごとのビルド検証とユニットテスト(68 件)を追加しました(#23)
