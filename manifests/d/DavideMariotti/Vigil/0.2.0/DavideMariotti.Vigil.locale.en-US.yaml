ShortDescription: "Temperatures, fans and power draw of your PC from the tray, with fan curves you drag."
Description: "Vigil works out what's inside the PC by itself and shows its sensors on a dashboard, with the hottest temperature as a number in the tray. It drives the fans: Auto leaves them to the BIOS, Fixed holds a speed, Curve follows a temperature, never under 20% and back to the BIOS when it closes. Base mode needs nothing; full mode runs as administrator with the free PawnIO driver. Sensors read by LibreHardwareMonitorLib."
