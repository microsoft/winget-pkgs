ShortDescription: "Temperature, ventole e consumi del PC dalla tray, con curve delle ventole da trascinare."
Description: "Vigil capisce da solo cosa c'è nel PC e ne mostra i sensori su un cruscotto, con la temperatura più alta come numero nella tray. Comanda le ventole: Auto le lascia al BIOS, Fisso tiene una velocità, Curva segue una temperatura, mai sotto il 20% e di nuovo al BIOS quando si chiude. La modalità base non chiede niente; quella completa gira da amministratore con il driver gratuito PawnIO. I sensori li legge LibreHardwareMonitorLib."
