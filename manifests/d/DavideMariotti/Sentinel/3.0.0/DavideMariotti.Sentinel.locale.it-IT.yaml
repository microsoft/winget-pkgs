ShortDescription: "Tiene sveglio il PC Windows dalla tray, con pausa pranzo e avvisi batteria."
Description: "Sentinel tiene sveglio il PC mentre non ci sei: niente standby, niente screensaver, niente stato «assente». Muove il mouse di zero pixel, quindi non si sposta niente e nessuna app riceve tasti. Una pausa programmata lascia dormire il PC a pranzo, gli avvisi batteria ti dicono quando staccare il caricatore. Niente internet, niente telemetria, niente permessi di amministratore."
