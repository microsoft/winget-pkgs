ShortDescription: "Keeps your Windows PC awake from the tray, with a lunch break and battery alerts."
Description: "Sentinel keeps the PC awake while you're away: no sleep, no screensaver, no \"away\" status. It nudges the mouse by zero pixels, so nothing moves and no app receives a key. A scheduled pause lets the PC sleep at lunch, battery alerts tell you when to unplug the charger. No internet, no telemetry, no administrator rights."
