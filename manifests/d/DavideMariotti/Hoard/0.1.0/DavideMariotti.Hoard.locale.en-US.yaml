ShortDescription: "Shows what fills your disks: a map of every folder, coloured by kind of file."
Description: "Hoard reads a whole drive in seconds and shows it as a map: every folder and file is a tile as big as the space it takes, coloured by kind of file. It lists the biggest files, points at what can usually go (temporary files, Downloads, Recycle Bin, Windows.old, package caches, node_modules) and warns you from the tray when a drive runs low. It deletes nothing: Explorer does, with the Recycle Bin as a safety net."
