ShortDescription: "Ti mostra cosa riempie i dischi: una mappa di ogni cartella, colorata per tipo di file."
Description: "Hoard legge un disco intero in pochi secondi e te lo mostra come una mappa: ogni cartella e ogni file è un riquadro grande quanto lo spazio che occupa, colorato per tipo di file. Elenca i file più grandi, ti indica cosa di solito si può togliere (file temporanei, Download, Cestino, Windows.old, cache dei pacchetti, node_modules) e dalla tray ti avvisa quando un disco si riempie. Non cancella niente: lo fa Esplora file, con il Cestino come rete di sicurezza."
