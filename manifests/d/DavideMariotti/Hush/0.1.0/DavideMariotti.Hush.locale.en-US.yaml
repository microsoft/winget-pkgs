ShortDescription: "One key switches your microphone off in every app, and Hush tells you who is listening."
Description: "Hush mutes every microphone in Windows itself with one key (Win+Shift+Q by default) or one click on its tray icon, so Teams, Meet, Zoom, Discord and the browser all get silence at once. A small notice tells you what happened. The window shows who hears you and who sees you right now, and which apps used the microphone and the webcam in the last 30 days. No keyboard hook, no internet, no administrator rights."
