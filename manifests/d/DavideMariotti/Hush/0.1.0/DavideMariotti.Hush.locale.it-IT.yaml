ShortDescription: "Un tasto spegne il microfono in tutte le app, e Hush ti dice chi ti sta ascoltando."
Description: "Hush spegne tutti i microfoni direttamente in Windows con un tasto (Win+Shift+Q di base) o un clic sull'icona nella tray, così Teams, Meet, Zoom, Discord e il browser ricevono silenzio tutti insieme. Un piccolo avviso ti dice cos'è successo. La finestra ti fa vedere chi ti sente e chi ti vede in questo momento, e quali app hanno usato microfono e webcam negli ultimi 30 giorni. Niente hook della tastiera, niente internet, niente permessi di amministratore."
