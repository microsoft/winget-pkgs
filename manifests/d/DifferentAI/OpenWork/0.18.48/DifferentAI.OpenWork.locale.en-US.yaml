ReleaseNotes: |-
  Live workflow apps and session recovery become more dependable
  - Live workflow authoring and generated apps now update and run with clearer, bounded behavior.
  - Sessions recover more reliably, keeping the send button usable and opening sidebar-created threads in the main pane.
  - Browser tabs, consent, scrolling, and session origins now stay aligned across desktop and web flows.
  - Organization tools and saved apps now present and connect more consistently.
  Full changelog: https://openworklabs.com/docs/changelog · Compare
  Windows installers are signed using Microsoft Artifact Signing.
