ShortDescription: OLED taskbar care for Windows 11 — moving fill, idle Care, per-monitor control in Explorer’s real BackgroundFill.
Description: |-
  Phostide is a Windows 11 tray utility that paints animated themes into Explorer’s real taskbar BackgroundFill, with OLED Care that dims idle fill per display (cursor / focused window), optional experimental chrome and clock care, night boost, and pause when locked.
  It does not require Windhawk or a third-party taskbar overlay. Themes: Rainbow, Sea Waves, Weather, Space, Aurora. Settings restore on Exit.
