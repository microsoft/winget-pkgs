ShortDescription: Бесплатный PDF-редактор для Windows, работает без интернета.
Description: |-
  Construct PDF правит текст в PDF и сканах, распознаёт сканы (русский и английский встроены), ставит подписи и печати, объединяет, разделяет и сжимает PDF, сохраняет в Word, печатает брошюры и постеры.
  Документы обрабатываются на вашем компьютере; интернет нужен только для проверки обновлений.
