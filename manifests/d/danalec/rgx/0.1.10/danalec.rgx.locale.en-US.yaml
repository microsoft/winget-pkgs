ShortDescription: Ripgrep-compatible search inside PDFs, Office docs, archives, 3D models
Description: |-
  rgx searches inside everything: PDF, Office documents, archives (zip/7z/tar),
  3D models, LLM checkpoints (GGUF/safetensors), databases, e-mail, media
  metadata and more. Adapters run inside the search process instead of
  spawning a subprocess per file. Ripgrep-compatible flags and exit codes.
  A prepared pack store trades a one-time build for the per-file filesystem
  cost on recurrent searches over many small files.
