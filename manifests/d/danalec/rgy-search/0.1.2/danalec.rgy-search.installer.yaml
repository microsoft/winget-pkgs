# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
# SPDX-License-Identifier: Apache-2.0
# STAGED: the release this manifest names exists -- rgy-v0.1.2, on the
# GitHub mirror and on the forgejo -- but the manifest itself is not in
# microsoft/winget-pkgs, so `winget install danalec.rgy-search` installs
# nothing today. scripts/publish-release.ps1 rewrites the version, the URL,
# the digest and the date when it publishes one.
PackageIdentifier: danalec.rgy-search
PackageVersion: 0.1.2
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: searchctl.exe
    PortableCommandAlias: searchctl
  - RelativeFilePath: searchd.exe
    PortableCommandAlias: searchd
  - RelativeFilePath: rgy-autostart.exe
    PortableCommandAlias: rgy-autostart
  # The window: the floating launcher over the daemon.
  - RelativeFilePath: rgxy.exe
    PortableCommandAlias: rgxy
  # The command the project is named after: the same binary, another name.
  - RelativeFilePath: rgy.exe
    PortableCommandAlias: rgy
InstallModes:
  - silent
  - interactive
UpgradeBehavior: uninstallPrevious
ReleaseDate: 2026-10-31
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/danalec/rgy/releases/download/rgy-v0.1.2/rgy-v0.1.2-x86_64-windows.zip
    InstallerSha256: E0E250AF04330A23F0580FBD1CF9A467CF348B3821E05916FF985FB235B0DD40
ManifestType: installer
ManifestVersion: 1.9.0
