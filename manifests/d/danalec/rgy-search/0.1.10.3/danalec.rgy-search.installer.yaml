# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
# SPDX-License-Identifier: Apache-2.0
# The portable x86_64 Windows archive was built and smoked on the CI
# runner, and its real digest and release date are written below by
# `scripts/publish-release.ps1` from the SHA256SUMS in .dist/. The
# manifest installs only that portable archive; the aarch64 one ships in
# the same release for the installer that asks for it. Rewriting from the
# real archive is what stops a manifest that names one release and pins
# another's digest from being published.
PackageIdentifier: danalec.rgy-search
PackageVersion: 0.1.10.3
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: searchctl.exe
    PortableCommandAlias: searchctl
  - RelativeFilePath: searchd.exe
    PortableCommandAlias: searchd
  - RelativeFilePath: rgy-autostart.exe
    PortableCommandAlias: rgy-autostart
  # The window: the floating launcher over the daemon.
  - RelativeFilePath: rgxy.exe
    PortableCommandAlias: rgxy
  # The command the project is named after: the same binary, another name.
  - RelativeFilePath: rgy.exe
    PortableCommandAlias: rgy
InstallModes:
  - silent
  - interactive
UpgradeBehavior: uninstallPrevious
ReleaseDate: 2026-11-10
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/danalec/rgy/releases/download/rgy-v0.1.10.3/rgy-v0.1.10.3-x86_64-windows.zip
    InstallerSha256: 889C7A4F2FAD413A4E7E950E9121668BECF88CD98B282DCD013938948BD45BF9
    # A portable install has no ARP entry, so the client has little to
    # correlate. Naming the files it puts down gives it a deeper check
    # without changing what is installed or where. DefaultInstallLocation
    # is deliberately absent: WinGet unpacks a portable archive into its
    # own managed directory, not the path install.ps1 would have used.
    # ArchiveBinariesDependOnPath is deliberately absent too: the five
    # PortableCommandAliases above are symlinked into the links folder,
    # which is narrower than adding the whole unpack directory to PATH.
    InstallationMetadata:
      Files:
        - RelativeFilePath: searchctl.exe
          FileType: launch
          DisplayName: searchctl
        - RelativeFilePath: searchd.exe
          FileType: launch
          DisplayName: searchd
        - RelativeFilePath: rgy-autostart.exe
          FileType: launch
          DisplayName: rgy-autostart
        - RelativeFilePath: rgxy.exe
          FileType: launch
          DisplayName: rgxy
        - RelativeFilePath: rgy.exe
          FileType: launch
          DisplayName: rgy
ManifestType: installer
ManifestVersion: 1.9.0
