PackageIdentifier: danalec.rgy-search
PackageVersion: 0.1.10.3
PackageLocale: en-US
Publisher: danalec
PublisherUrl: https://github.com/danalec
PackageName: rgy-search
PackageUrl: https://github.com/danalec/rgy
License: Apache-2.0
LicenseUrl: https://github.com/danalec/rgy/blob/main/LICENSE
ShortDescription: Whole-filesystem name search and content search in one stack
Description: |-
  rgy answers two questions about the files on your computer: which file is
  it, and what is inside it. Both in one query.

    searchctl --root ~ "invoice ext:pdf"
    searchctl --root ~ "invoice grep:tesla"

  The first half is answered from an index of names -- fuzzy, typo-tolerant
  and ranked -- which is why it is fast. The second half reads the file.

  Windows, Linux and macOS. The terminal UI, the allocator, the SIMD and
  the per-platform discovery are compiled in; there is nothing to configure.
Moniker: rgy
