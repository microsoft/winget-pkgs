ShortDescription: An AutoHotkey interpreter written in Rust
Description: |-
  ahk is an AutoHotkey interpreter written in Rust: a lexer, an AST, a
  parser, a runtime, the built-in names and the class library of the dialect
  of v2.0.19.

    echo 'Msg "hello"' | ahk

  The dialect is v1 or v2. The v2 is the default and the v1 lives behind a
  flag, and the v2 has two modes behind flags of their own: the mechanisms
  of the v2.1, and the extensions of KeySharp.

  A desktop backend drives the machine: a keyboard, a pointer, screen
  captures, files, windows and hotkeys.
