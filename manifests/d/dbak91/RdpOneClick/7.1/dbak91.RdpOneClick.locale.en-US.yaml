ShortDescription: Opens trusted, unsigned .rdp files in one click by automating the Remote Desktop security prompt.
Description: |-
  RdpOneClick automates the Remote Desktop security dialog that Windows shows when opening unsigned .rdp files.
  Run RdpAutoClick with no parameters to start a set-up wizard that creates a desktop shortcut for a chosen .rdp file.
  The shortcut opens the file, ticks the redirection options you chose (such as Clipboard or Drives) and presses Connect.
  Intended only for connections you trust. Requires .NET Framework 4.8.
