PackageIdentifier: DevinCook.Flowgorithm
PackageVersion: 4.5.0
PackageLocale: zh-CN
License: 免费软件
ShortDescription: Flowgorithm 是一款基于图形流程图的免费初学者编程语言。
Description: |-
  通常，当学生初次学习编程时，他们往往会使用某种文本编程语言。根据所选语言的不同，这可能是一次轻松的体验，也可能极其困难且令人沮丧。许多语言要求学生编写几行令人困惑的代码，仅仅为了显示一句“Hello, world!”。这对于大多数面向对象语言来说很正常，但初学者远未达到学习这些概念的阶段。
  通过使用流程图，你可以专注于编程概念，而不是传统编程语言中那些细微的语法差别。程序可以直接在 Flowgorithm 中执行。
  一旦你理解了编程逻辑，学习主流编程语言就会变得轻而易举。Flowgorithm 能够交互式地将你的流程图转换为 18 种以上的语言。其中包括：C#、C++、Java、JavaScript、Lua、Perl、Python、Ruby、Swift、Visual Basic .NET 以及 VBA（用于 Office）。
