ReleaseNotes: |-
  lolPing now has an AI teammate. Ping something on your screen with the ask wheel and it answers at that spot: a short line, its own pings on what it means, and a card with the full answer. It can also do the thing you pinged, after asking you first. It is off until you turn it on in Settings → Features, and it works on Windows and macOS. Installed copies offer the update by themselves.
  lolPing 已添加 ai 功能。用提问轮盘对屏幕上的东西发信号，它会在那个位置回答：一句短话、它自己在相关位置发的信号，以及一张写着完整回答的卡片。它也可以替你去做你标记的事，动手前会先问你。队友默认关闭，在 设置 → 功能 里打开。支持 Windows 和 macOS。已安装的版本会自动提示更新。
  New / 新功能
  - The ask wheel. Hold the ask key and drag, like the ping wheel, then let go over the spot you are asking about. Each ping asks for something: Explain, Keep going, What's wrong, Show me how, Do it, Look it up, Whole picture, Grab, Polish, Translate, Save for later, and Ask with words for a typed question. You can rename each one and change what it asks for. The ask key can be its own key or the ping key.
    提问轮盘。 像信号轮盘一样按住提问键拖动，在要问的位置松开。每个信号对应一种请求：解释、继续、哪里不对、教我、帮我做、查一下、全局、提取、润色、翻译、稍后看，以及用文字提问的“我来问”。每一项都可以改名、改内容。提问键可以单独设置，也可以和信号键相同。
  - Answers at the spot. A receipt shows the ask was picked up, the line appears as soon as the model writes it, and the teammate's pings stay on what they point at while the answer is up. The card holds the full answer. Reply in the card, or ping Keep going at a new spot, to continue the thread.
    在原位置回答。 提问被接收时会有提示，模型一写出那句话就会显示，回答还在时，队友的信号会一直停在它指的地方。卡片里是完整回答。在卡片里回复，或在新位置发 继续 信号，可以接着这个对话问下去。
  - Several spots in one ask. Keep the ask key held and ping up to 4 spots on one screen, for example three prices to compare. When you let go they go as one ask, and the answer covers all of them.
    一次提问可以标记多个位置。 按住提问键不放，可以在同一块屏幕上标记最多 4 个位置，例如要比较的三个价格。松开后它们作为一次提问发出，回答会把它们一起考虑。
  - Double-tap to ask in your own words. Double-tap the ask key and a box opens at the pointer for a typed question. It is on by default on macOS (⌘⌘) and can be turned on in Settings on Windows.
    连按两下用文字提问。 连按两下提问键，指针处会打开一个输入框，可以直接输入问题。macOS 上默认打开（连按两下 ⌘），Windows 上可以在设置里打开。
  - Pings that no longer fit fade away. When you scroll, move or resize the window, switch tabs or switch apps, the teammate's pings, emotes and bubble fade out, since what they pointed at has moved. The card stays.
    不再对应的信号会自动淡出。 当你滚动页面、移动或缩放窗口、切换标签页或切换应用时，队友的信号、表情和气泡会淡出，因为它们指的东西已经移动了。卡片会保留。
  - A first-run card. Turning the teammate on opens a short card that sets the ask key and who answers, and on macOS the Screen Recording permission.
    首次使用引导。 打开队友后会弹出一张简短的引导卡片，帮你设置提问键和由谁来回答，macOS 上还会引导开启“屏幕录制”权限。
  - It reads what you point at. The text and controls near the spot, the selected text and the focused field, and the file behind the window (text, PDF and Office files). Each source can be turned off in Settings → Teammate → What the teammate reads.
    它能读到你指的东西。 包括位置附近的文字和控件、选中的文字和当前输入框，以及窗口背后的文件（文本、PDF 和 Office 文件）。每一项都可以在 设置 → 队友 → 队友能读什么 里关闭。
  - It can act, with your consent. Grab a table, text or an event into the clipboard or your calendar, paste or replace text, fill a form after a preview, open a link. A consent card asks before each action and keeps the focus in your app. Always allow remembers an action, and you can take it back in Settings.
    经你同意后它可以动手。 把表格、文字或日程提取到剪贴板或日历，粘贴或替换文字，预览后填写表单，打开链接。每次操作前都会弹出确认卡片，焦点仍留在你的应用里。总是允许 会记住某项操作，之后可以在设置里撤销。
  - Any model you have a key for. Anthropic, OpenAI, Google Gemini, DeepSeek, Qwen, Kimi, GLM, Doubao, MiniMax, Mistral, xAI and OpenRouter, local models through Ollama or LM Studio, or any OpenAI-compatible address. The model needs to read images.
    可以用你有密钥的任何模型。 支持 Anthropic、OpenAI、Google Gemini、DeepSeek、通义千问、Kimi、智谱 GLM、豆包、MiniMax、Mistral、xAI 和 OpenRouter，也可以通过 Ollama 或 LM Studio 使用本地模型，或填写任何兼容 OpenAI 的地址。模型需要能读图片。
  - Coding agents as teammates. A profile can be a coding agent on your computer instead of a model. Claude Code and DeepSeek Harness are tested; Codex, Gemini CLI, Qwen Code, Copilot CLI, Cursor CLI, opencode, Kimi Code, Auggie, Goose, Droid, Qoder CLI and Kiro CLI are included but not tested yet. App rules send asks from an app (your editor, say) to the agent, which runs in that app's project folder. lolPing asks you before Claude Code edits or runs anything. Open in Claude Code in History continues the session in a terminal.
    编程代理也能当队友。 配置可以是你电脑上的编程代理，而不是模型。Claude Code 和 DeepSeek Harness 已经测试过；Codex、Gemini CLI、Qwen Code、Copilot CLI、Cursor CLI、opencode、Kimi Code、Auggie、Goose、Droid、Qoder CLI 和 Kiro CLI 已加入，但还没有测试。应用规则可以把某个应用（例如编辑器）里的提问交给代理，代理会在该应用的项目文件夹里运行。Claude Code 修改或运行任何内容之前，lolPing 会先问你。在历史里点 在 Claude Code 中打开，可以在终端里接着这个会话。
  - Agents can ping you. With Let agents ping me on, a coding agent you run yourself (in a terminal or an editor) can draw a ping or say a line near your cursor while it works. Connect an app gives the snippet to add lolPing to Claude Code, Claude Desktop, Codex, Cursor, VS Code, Windsurf, Zed, JetBrains IDEs and others.
    代理可以给你发信号。 打开 允许代理给我发信号 后，你自己运行的编程代理（在终端或编辑器里）工作时可以在你的光标附近发信号或说一句话。连接应用 里有把 lolPing 加到 Claude Code、Claude Desktop、Codex、Cursor、VS Code、Windsurf、Zed、JetBrains IDE 等应用的配置片段。
  - History. Your asks and answers are kept on this computer, encrypted, for 30 days by default. Pause, clear or open it from Settings.
    历史。 你的提问和回答加密保存在这台电脑上，默认保留 30 天。可以在设置里暂停、清除或打开。
  - A tidier settings window. Long groups open and close like Windows Settings, Rooms holds its own switches on the Features page, the scroll bars follow the dark theme, and the window has Fluent motion throughout. The answer card grows smoothly while it streams and the history list slides in as you scroll. Turning off animation effects in the system turns these animations off.
    更整洁的设置窗口。 较长的设置分组可以像 Windows 设置那样展开和收起，功能页里房间相关的开关放在“房间”下面，滚动条跟随深色主题，整个窗口加入了 Fluent 动画。回答卡片在内容流式输出时会平滑变高，历史列表在滚动时会依次滑入。系统里关闭动画效果后，这些动画也会关闭。
  Fixed / 修复
  - On My Way looked flat on the wheel and on screen (#83). It is now League's upright arrow in the normal cyan.
    “正在赶来”信号在轮盘和屏幕上看起来是扁的（#83）。现在改用游戏里竖起来的箭头，并使用正常的青色。
  Privacy / 隐私
  Nothing is captured until you ask. An ask sends a picture of the display under the spot, a closer view around it, the app and window title, what the teammate reads (above), the thread so far and Your instructions to the provider of the profile you use, and to no one else. A coding agent gets the same through lolPing's local connection and sends it on to its own provider. Keys and history stay on this computer, encrypted by the system. lolPing contacts no new hosts of its own: only the provider you set up.
  在你提问之前，lolPing 不会截取任何内容。每次提问会把位置下方的屏幕画面、位置附近的放大图、应用和窗口标题、队友能读到的内容（见上文）、之前的对话和“你的说明”发给你所用配置的服务商，不会发给其他任何人。编程代理通过 lolPing 的本地连接拿到同样的内容，再发给它自己的服务商。密钥和历史保存在这台电脑上，由系统加密。lolPing 本身不会连接新的服务器，只会连接你设置的服务商。
  Notes / 说明
  - The teammate is not available on Linux yet.
    Linux 暂时不能使用队友。
  - On macOS the teammate needs the Screen Recording permission. The settings window shows how to turn it on.
    在 macOS 上，队友需要“屏幕录制”权限，设置窗口里有开启步骤。
