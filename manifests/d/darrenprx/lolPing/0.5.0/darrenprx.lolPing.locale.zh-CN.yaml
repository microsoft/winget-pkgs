PackageIdentifier: darrenprx.lolPing
PackageVersion: 0.5.0
PackageLocale: zh-CN
ShortDescription: 把英雄联盟的信号轮盘搬到你的 Windows 桌面，还原原始动画与音效。
Description: |-
  lolPing 把英雄联盟的信号轮盘和表情轮盘搬到整个桌面。按住 Alt 拖动，在想要的信号上松开：动画弹出、音效响起，任何程序之上、任何显示器上都可以。按住 Ctrl 拖动打开表情轮盘，可以使用英雄联盟的表情或你自己的图片。
  信号和表情会出现在全屏幕录制画面中，观看你 Discord 或 OBS 直播的朋友也能看到。可选的房间功能让其他电脑上的朋友通过本地网络或加密的公共中继实时看到你的信号。lolPing 是一个桌面玩具：它不会读取、修改或挂入游戏本身。
Tags:
