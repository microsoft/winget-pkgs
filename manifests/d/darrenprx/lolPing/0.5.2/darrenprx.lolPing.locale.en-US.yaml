ReleaseNotes: |-
  A large release: friends see your own emote images, rooms get text, votes and a room panel in League's look, and a batch of fixes for the overlay, the taskbar and the trigger key. Installed copies offer the update by themselves.
  这是一次较大的更新：房间里的朋友能看到你的自定义表情，房间新增文字、投票和英雄联盟风格的房间面板，并修复了覆盖层、任务栏和触发键的一批问题。已安装的版本会自动提示更新。
  Rooms / 房间
  - Your own emote images reach friends as a small still picture instead of "?" (#6, #49, #56).
    自定义表情图片会以静态图发给房间里的朋友，不再显示问号（#6、#49、#56）。
  - Room text: press Alt + T in a room, type, press Enter. Friends see it at the spot you pointed at, or scrolling across the top as 弹幕 (#19, #48).
    房间文字：在房间里按 Alt + T 输入，回车发送。朋友那边显示在你指的位置，或作为弹幕从顶部滚过（#19、#48）。
  - Votes: surrender (/ff), ready check (/ready) and kick, drawn with League's own widgets and ready check sounds (#54).
    投票：投降（/ff）、就位确认（/ready）和踢人，使用英雄联盟自己的界面和就位确认音效（#54）。
  - Room panel: hold Tab to see who is in the room, post " - Alive", mute someone or start a kick vote.
    房间面板：按住 Tab 查看房间成员，点名字发送"<名字> - Alive"，可以静音或发起踢人投票。
  - Up to 16 people in a room, and a custom name tag colour beside the palette.
    房间人数上限提高到 16 人，名字颜色可以自定义。
  - Room messages are signed, so a member can no longer remove someone or block their pings by pretending to be them (#93). Rooms with friends still on 0.5.1 keep working, but 0.5.1 can't see text, votes or your images. Please ask them to update.
    房间消息带签名，成员不能再冒充别人把人踢出或屏蔽其信号（#93）。和仍在用 0.5.1 的朋友依然能一起用房间，但 0.5.1 看不到文字、投票和自定义图片，请提醒他们更新。
  Emotes and pings / 表情与信号
  - Signature effects for your own images: plain pop, spin-in, bounce drop, flash focus, pendulum swing or heartbeat. Right-click an image in Settings → Emotes to pick one. Friends see the effect you picked (#89).
    自定义图片可以选登场特效：经典弹出、螺旋登场、落地弹跳、闪现聚焦、摆锤摆入、心跳律动。在设置 → 表情里右键图片选择，朋友看到的是你选的特效（#89）。
  - Your own images can have a sound, played on your computer only (#59).
    自定义图片可以加声音，只在你自己的电脑上播放（#59）。
  - Wheel size setting for both wheels, Keep my last ping on screen, and an upside-down Enemy Missing ("¿") ping.
    新增轮盘大小设置、"保留我最后一个信号"选项，以及反向问号信号。
  - Features page: turn off emotes, rooms, room text, votes or the room panel if you don't use them.
    新增功能页：不用的表情、房间、房间文字、投票或房间面板可以关掉。
  Fixed / 修复
  - The taskbar was blocked: an auto-hidden taskbar wouldn't slide up, and it disappeared with borderless games (Windows, #74, #43).
    任务栏被挡：自动隐藏的任务栏唤不出来、无边框游戏时任务栏消失（Windows，#74、#43）。
  - The overlay fell behind other windows after a while or showed only on the desktop (Windows, #70, #76, #38). It now returns on top whenever it shows something.
    覆盖层一段时间后跑到其他窗口后面、或只在桌面显示（Windows，#70、#76、#38），现在每次显示内容时都会回到最上层。
  - Letting go of the trigger key closed the wheel; now the wheel stays open until the mouse button comes up, as in League. This also fixes macOS three-finger drag (#28, #40).
    松开触发键会关闭轮盘；现在和游戏里一样，松开鼠标才选择。也修复了 macOS 三指拖移（#28、#40）。
  - A letter as the trigger key (for example G) stopped typing it (#52). A quick tap now types the letter.
    用字母（如 G）做触发键后打字打不出来（#52），现在轻按会正常输入。
  - The wheel centres showed the first default instead of the chosen click emote and click ping (#84).
    轮盘中心一直显示初始表情和信号，现在显示设置里选的单击表情和单击信号（#84）。
  - macOS: requires macOS 13, keeps the overlay out of Mission Control, fixes Caps Lock as a trigger and the settings sidebar during the Dock animation (#57, #62).
    macOS：最低要求 macOS 13，覆盖层不再出现在调度中心，修复 Caps Lock 触发和 Dock 动画时侧边栏的问题（#57、#62）。
  Linux (experimental) / Linux（实验性）
  - X11 desktops are supported if you build lolPing yourself, see docs/linux.md. No Wayland and no installer yet (#8).
    支持 X11 桌面，需要按 docs/linux.md 自行构建，暂不支持 Wayland，也没有安装包（#8）。
  Thanks / 致谢
  Thanks to everyone who sent code for this release: @istoolsfox (emote images in rooms, signature effects, macOS fixes, the signing report), @noc228076 (rooms of 16, custom tag colour), @xTreeRoot (room text), @995916639a-coder (Linux), @woodling-dev (typing with a letter trigger), @everglow01 (wheel size, and tracing #84), @SJYssr and @1cgy1cj (macOS fixes).
  感谢为这个版本贡献代码的每一位：@istoolsfox、@noc228076、@xTreeRoot、@995916639a-coder、@woodling-dev、@everglow01、@SJYssr、@1cgy1cj。
