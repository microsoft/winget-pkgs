ShortDescription: League of Legends ping wheel for your Windows desktop, with the original animations and sounds.
Description: |-
  lolPing recreates the League of Legends ping wheel and emote wheel on your whole desktop. Hold Alt, drag, and let go on a ping: the animation pops and the sound plays on top of any app, on any monitor. Hold Ctrl and drag for the emote wheel, with League's emotes or your own images.
  Pings and emotes show up in whole-screen capture, so friends watching your Discord or OBS stream see them too. Optional rooms let friends on other machines see your pings live over a local network or encrypted public relays. lolPing is a desktop toy: it doesn't read, change, or hook into League itself.
