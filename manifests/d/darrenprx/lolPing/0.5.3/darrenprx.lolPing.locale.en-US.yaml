ReleaseNotes: |-
  A bug-fix release for the ping wheel itself: the pings now use League's normal colours, the overlay follows a game's display mode change, and lolPing runs on older Windows 10. Installed copies offer the update by themselves.
  这是一次修复版本，集中修了信号轮盘本身的问题：信号改用游戏里的正常配色，覆盖层能跟上游戏切换的显示模式，旧版 Windows 10 也能用了。已安装的版本会自动提示更新。
  Fixed / 修复
  - The pings used League's colourblind icons (#83). Push, On My Way, All In, Assist Me, Need Vision, Enemy Missing, Generic and Vision Cleared now use the game's normal colours, taken from League's own files. Assist Me and Need Vision get a teal ring.
    信号用的是游戏里的色盲版图标（#83）。推进、正在路上、全力进攻、求助、需要视野、敌人消失、普通信号和视野已清除都换成了游戏文件里的正常配色，求助和需要视野的光圈改为青绿色。
  - The wheel was cut off after a game changed the display mode (Windows, #97). lolPing now checks the displays before it draws anything and rebuilds the overlay when they changed, including a change of scale only.
    游戏切换显示模式后轮盘被截掉一截（Windows，#97）。现在每次画内容前都会检查显示器，有变化（包括只改了缩放）就重建覆盖层。
  - No mouse or keyboard input on Windows 10 before version 1703 (#66). The input helper didn't start there at all.
    Windows 10 1703 之前的版本读取不到鼠标和键盘输入（#66），输入助手在这些系统上根本启动不了。
  - A custom key T was refused as the emote key while the room text shortcut is Alt + T (#100). A letter key and a shortcut that uses it with Alt can now be set together. When a ping trigger key is refused, the reason now shows under it instead of the old key coming back silently.
    文字快捷键是 Alt + T 时，表情键不能设成 T（#100）。现在字母键和带 Alt 的同一个字母快捷键可以同时使用。信号触发键被拒绝时，下面会显示原因，不再悄悄变回原来的键。
  Thanks / 致谢
  Thanks to @istoolsfox for the display mode fix and the shared-key fix, and to @charisk0 for finding why the helper didn't start on their Windows 10.
  感谢 @istoolsfox 提交了显示模式和共用按键的修复，感谢 @charisk0 查出了输入助手在旧版 Windows 10 上启动不了的原因。
