ShortDescription: Free Windows SOCKS5 and HTTP CONNECT proxy launcher with remote DNS.
Description: |-
  WinSocks is a free Windows 10/11 proxy launcher for people who already buy a SOCKS5 or HTTP CONNECT combo. Paste host:port:user:pass, start a local relay, and open Chrome or Firefox with remote DNS.

  Chrome uses the local HTTP CONNECT listener on 127.0.0.1:8080. Isolated Firefox uses the local SOCKS5 listener on 127.0.0.1:1080. Proxy settings are restored when you stop or uninstall.
