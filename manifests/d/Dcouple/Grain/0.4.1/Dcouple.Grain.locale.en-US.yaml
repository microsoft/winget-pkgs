ReleaseNotes: |-
  ### New
  - Agents can copy files to and from anywhere in a grain's sandbox workspace, not only `app/`. `grain upload` accepts an absolute `/project/workspace/...` path, and the new `grain download` copies a sandbox file, such as a generated PDF, back to your computer. Over MCP they are `grain_upload` and `grain_download`, so file contents no longer go through `grain_exec`.

  ### Improved
  - Over MCP, `grain_list` returns a compact page of grains with a cursor for the next one, so a large organization no longer floods the agent's context.
  - `grain_metadata` and `grain_checkout` tell agents which folder a grain is filed in, what a checkout covers, and where the sandbox folders are.
  - In a grain's side chat, asking for a new document adds a file to that grain instead of creating a new grain.
  - Large pushes through MCP run in the background and land as one revision. The agent checks on them with `grain_operation_status`.
  - Agents are told to pass an organization's ID, not its name.

  ### Fixed
  - `grain_exec` over MCP returns as soon as the command finishes, instead of after about 40 seconds.
  - CLI commands in agent terminals no longer fail within seconds with "did not finish starting within 30 seconds", and no longer act as if they were MCP calls.
  - `grain exec -- <command>` runs the command instead of passing `--` to the shell.
  - A push that was stopped partway no longer blocks the next push on the same checkout.
ReleaseNotesUrl: https://rungrain.com/changelog#0.4.1
