ReleaseNotes: |-
  ### New
  - Share a grain from the desktop app with one link. The Share dialog adds people as guests, restricts the link to them, shows who viewed it, and lets owners and builders reveal the current share password. Links can open a page of an app grain (`?path=`) or a file of a document grain (`?file=`).
  - Shared grains open in the browser at rungrain.com/w, with the grain's own access rules.
  - App connections: connect apps like Gmail or GitHub once, then let your agents use them from Grain. Find them under Connections in the grain browser, in a workspace's Connections tab, or from the chip in the agent sidebar.
  - Export the current view as a PDF.
  - Send feedback from the CLI with `grain feedback`, or ask your agent to use `grain_feedback`.
  - New Artifacts and Apps start from a welcome page.
  - `grain app restart` (and `grain_app_restart`) restarts a grain's app server.

  ### Improved
  - Grain has a deep teal look, with more readable primary buttons. Dialogs open at their final size with loading placeholders, so nothing jumps while they load.
  - Filter the grain browser by type, creator and date from the Filter button next to New; search covers the current view.
  - Long-running agent commands keep going as background jobs instead of timing out, and the first command on a cold sandbox no longer times out.
  - The free tier includes three times as much usage.
  - When the agent sidebar can't open a local checkout, it shows the underlying cause.

  ### Fixed
  - Pushing with a title no longer fails with "fetch failed".
  - Sync handles deletions cleanly and repairs checkouts that got stuck after converged changes.
  - Grain links open inside the app instead of showing "Open in Grain".
  - Comments refresh when you open them and when the window regains focus.
