# Winget Manifest — Datara (locale en-US)
PackageIdentifier: Datara.Datara
PackageVersion: 1.5.1
PackageName: Datara
Publisher: Datara Core Team
PublisherUrl: https://github.com/datara-lang
Author: Datara Core Team
PackageUrl: https://github.com/datara-lang/datara
License: MIT OR Apache-2.0
LicenseUrl: https://github.com/datara-lang/datara/blob/main/LICENSE-MIT
Copyright: Copyright (c) 2026 Datara Core Team
ShortDescription: Datara — high-performance systems & application language (forgen toolchain)
Description: >-
  Datara is a compiled systems and application language with three native
  backends (Cranelift JIT/AOT, LLVM, WASM), Python/C/Rust/Node interop,
  stackful fibers, capability sandboxing, and a built-in package manager
  (dpm). This package installs the forgen toolchain (forgen, datara, dpm).
Tags:
  - compiler
  - language
  - systems-programming
  - wasm
  - llvm
Moniker: forgen
Installers:
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: bin/forgen.exe
        PortableCommandAlias: forgen
      - RelativeFilePath: bin/datara.exe
        PortableCommandAlias: datara
      - RelativeFilePath: bin/dpm.exe
        PortableCommandAlias: dpm
    InstallerUrl: https://github.com/datara-lang/datara/releases/download/v1.5.1/forgen-v1.5.1-windows-x64.zip
