ReleaseNotes: |-
  Gold Band v0.17.2
  中文 · English

  中文
  体验优化
  1. Claude 模型会话实时显示思考过程
  通过 Claude Agent 使用 Claude 模型时，消息流中会显示模型的思考摘要。内置 Claude 和用户自行添加的 Claude Agent 都支持。
  2. 内置 Agent 版本更新
  内置 Claude 更新到 0.81.2，Codex 更新到 1.13.1。CodeBuddy、Qwen Code 和 Pi 也同步更新到最新版本。

  English
  Experience improvements
  1. Live thinking for Claude models
  When you use a Claude model through a Claude Agent, the message stream now shows the model's thinking summaries. This works for both the built-in Claude Agent and Claude Agents you add yourself.
  2. Built-in Agent updates
  The built-in Claude Agent has been updated to 0.81.2 and Codex to 1.13.1. CodeBuddy, Qwen Code, and Pi have also been updated to their latest versions.
