ShortDescription: 'Tray utility in the spirit of Volume²: switch the default playback device with F7/F8, change the volume with F2/F3 and an on-screen overlay.'
Description: |-
  A Windows system tray utility in the spirit of Volume².
  F7/F8 switch the default playback device, F2/F3 lower/raise the master volume with an on-screen overlay,
  F5 shows an MPC-HC playback progress overlay, and Ctrl+F2 turns the hotkeys off and back on.
  Hotkeys fire only without modifiers, so Alt+F4, Ctrl+F5 and the like reach applications as usual.
