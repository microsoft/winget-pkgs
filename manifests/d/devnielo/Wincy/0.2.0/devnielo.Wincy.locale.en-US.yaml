ShortDescription: Keyboard-first clipboard manager for Windows
Description: |-
  Wincy keeps your clipboard history in the system tray. Press Alt+V to open a palette next to the cursor,
  type to filter, and press Enter to paste into the app you were using. Text, rich text, images, files, links,
  colors and code; fuzzy search, also inside images (Windows OCR); pins; plain-text paste. Local only: no account,
  no cloud, no telemetry. Skips password managers and text that looks like a secret.
