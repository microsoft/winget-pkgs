PackageIdentifier: devnielo.Wincy
PackageVersion: 0.2.0
PackageLocale: es-ES
Publisher: Wincy contributors
PackageName: Wincy
PackageUrl: https://devnielo.github.io/wincy/es/
License: MIT
ShortDescription: Gestor de portapapeles para Windows que se usa con el teclado
Description: |-
  Wincy guarda tu historial del portapapeles en la bandeja del sistema. Pulsa Alt+V para abrir una paleta junto
  al cursor, escribe para filtrar y pulsa Enter para pegar en la aplicación que estabas usando. Texto, texto
  enriquecido, imágenes, archivos, enlaces, colores y código; búsqueda difusa, también dentro de las imágenes (OCR
  de Windows); fijados; pegado sin formato. Todo en local: sin cuentas, sin nube, sin telemetría. Ignora los
  gestores de contraseñas y el texto que parece un secreto.
Tags:
