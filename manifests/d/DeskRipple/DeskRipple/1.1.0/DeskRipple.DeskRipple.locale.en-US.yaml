ReleaseNotes: "# DeskRipple v1.1.0\n\nDeskRipple 1.1.0 adds a 14-day trial for new installs, and it carries a set of fixes, several\nof them from user reports since 1.0. If DeskRipple is already installed and running, it updates\nitself in the background; a licensed install sees only the fixes. New here? The installer is\nbelow.\n\n> 🔑 **Try DeskRipple free for 14 days, with every feature included. No account or payment details are required to start.** If it fits your workflow, DeskRipple is a one-time purchase, not a subscription. Enter a key once, under **Manager → About** or on the license screen, and there's no expiry — the key is verified on your own PC, with no account and no activation server. DeskRipple asks you to accept the [license agreement (EULA)](https://github.com/DeskRipple/deskripple/blob/main/EULA.md) on first run.\n\n## 🔧 What's new in 1.1.0\n\n• **A 14-day trial for new installs.** For an install that never ran the beta, DeskRipple runs for 14 days after you install it, then needs a license key to keep working; the About dialog counts the days, and a one-time notice appears near the end. Installs that ran the beta keep the terms they were shown：without a license key they stopped working on September 1, 2026, and a key entered on the license screen unlocks them in place. 1.0.0 had no trial, so a 1.0.0 install that never ran the beta also stopped without a key. Once it updates, its 14 days are counted from the day it was installed, not from the update, so they may already be used up. In every case the license screen's **Restore my desktop shortcuts** returns every archived desktop original without a purchase.\n• **A pasted license key with invisible characters now validates.** A key copied out of an\n  email can pick up characters you can't see, such as zero-width spaces or soft hyphens, and\n  the key box rejected it as malformed even though every visible character was right. Both key\n  boxes, in About and on the license screen, now ignore those the way they already ignored\n  spaces and line breaks, and an accepted key is stored in that same cleaned form, so it can't\n  fail again on the next launch. When a key is still rejected, the message says why：a key of\n  the right shape that doesn't verify, a genuine key for a different product, or text that\n  isn't a key at all.\n• **A one-off clock jump can no longer lock an unlicensed install out.** DeskRipple remembers\n  the latest date it has seen, so that setting the clock back can't stretch a free run. A\n  clock that briefly jumped years ahead, after a flat CMOS battery, a restored virtual machine,\n  or a bad time sync, used to leave that recorded date years in the future and end the free\n  run for good. A date implausibly far ahead is now ignored, one already recorded is healed\n  back to the real clock, and in the one case that can't be told apart from a set-back clock,\n  the license screen says what it recorded and how to clear it. That notice now shows for a\n  trial install as well.\n• **Web links keep their icon on accented or non-Latin paths.** A `.url` file is an INI file,\n  and Explorer reads it as the system's ANSI code page, or as UTF-16 when the file starts with\n  a UTF-16 marker; DeskRipple read and wrote it as UTF-8. So a browser-made web link whose icon\n  lives under a profile folder like `C:\\Users\\Jürgen\\` lost its icon on drag-in, and a web link\n  DeskRipple wrote back to the desktop on drag-out showed a blank icon there. DeskRipple now\n  reads `.url` files the way Explorer does and writes them in the encoding Explorer expects.\n  Files it writes stay readable by older versions.\n• **An open panel follows a desktop icon resize.** Ctrl+scroll on the desktop resized the\n  icons inside an open panel but left its layout built for the old size until the panel was\n  closed and reopened：larger icons overran their slots and clipped at the edge, smaller ones\n  sat spaced for the old size inside an oversized panel. The open panel now re-lays out in\n  place as soon as the new size lands. Reported by a user in click mode with a panel kept open.\n• **Folder names stay sharp after a desktop icon resize.** DeskRipple measures the icon size\n  off the live desktop, and the measurement can land on a fraction of a pixel. At 100% scaling\n  that put the folder label on a half-pixel row and blurred it; at higher scales the fraction\n  happened to multiply back to whole pixels, which is why it went unseen. The folder icon now\n  snaps to whole physical pixels. In the same code, the label's wrap width was fixed at the\n  default cell width instead of following the live one, so enlarged icons wrapped and cut off\n  names earlier than the native labels beside them. Reported by a user on a 2560×1440 display\n  at 100%.\n• **Enter finishes a folder rename in the Manager.** The folder name box, which \"+ New folder\"\n  places the cursor in, had no keyboard way out; only clicking somewhere else ended the edit.\n  Enter now ends it.\n• **A two-line shortcut name no longer spills out of a panel that opens upward.** Grid, Column\n  and Row panels that open above the folder budgeted one line of label under each icon, so a\n  name that wrapped to a second line hung past the panel's bottom edge and the whole panel read\n  as sitting a little high over its icons. That edge now reserves the second line. Panels that\n  open downward were already fine.\n• **The desktop check leaves settled icons alone.** Every 5 seconds DeskRipple makes sure its\n  folder icons still sit just above the desktop, behind normal windows. It used to re-pin every\n  icon on every check, and with two or more folders that moved them through the window order\n  every time. A user with two 1080p monitors reported a periodic flicker near the desktop\n  icons, and this was the only periodic change DeskRipple made to its windows. The check now\n  re-pins only an icon that a window has actually displaced; when everything is in place, it\n  touches nothing.\n• **Opt-in usage diagnostics, data format v7.** For installs that turned diagnostics on, the\n  daily summary now labels why an update check failed, as one of a short fixed list\n  (\"timeout\", \"dns\", \"http403\"), never a message or address; it counts launches on which the\n  PC's clock, or the install date the trial is measured from, looked wrong to the license\n  check, again as fixed labels and never the dates; and the counter for \"pushed a folder icon\n  back into place\" now counts only genuine corrections. It had been counting DeskRipple's own\n  5-second pin as a correction, so its earlier values say nothing. Off by default and unchanged\n  unless you turned it on; the\n  [privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md) lists every\n  field.\n• **Smaller fixes.** The Move/Copy setting for dragged-in desktop shortcuts now says what it\n  covers：shortcuts and web links only. Documents and other files always stay where they are\n  and DeskRipple opens them from that location, so moving or deleting one breaks the entry; a\n  user had read \"Move it\" as covering documents, deleted an original, and lost the entry. A\n  `.url` file's icon index is read the same way on every Windows language.\n\nEverything else — desktop folder docks, five expand styles, drag-and-drop, desktop-icon\ndisplacement, multi-monitor and mixed-DPI support, multiple profiles, automatic updates, and\nopt-in diagnostics — carries over from 1.0.\n\n## 📦 Install / update\n\n• **Already installed and running:** nothing to do — DeskRipple checks this repo in the\n  background and applies the update silently at an idle moment. A tray notification confirms\n  it. (Prefer to update on your own schedule? The **About** dialog has an \"Install updates\n  automatically\" toggle.)\n• **Stopped on the license screen:** a stopped DeskRipple doesn't check for updates. Click\n  **Get the latest version** on that screen; on an installed copy it updates in place and\n  restarts DeskRipple. What each install gets from there is in the first bullet above.\n• **New install:** download **`DeskRipple-beta-Setup.exe`** below and run it (the file name\n  keeps the update channel's name; it installs 1.1.0). It installs per-user (no admin prompt),\n  adds a Start Menu entry, and launches.\n\n> 🛡️ **SmartScreen prompt on the installer.** DeskRipple is **code-signed** (Microsoft Trusted\n> Signing). Because it's still building download reputation, Windows SmartScreen may show a\n> prompt — if it does, click **More info → Run anyway**.\n\n> 🔎 **Can't find the tray icon?** On Windows 11 it starts hidden in the `^` overflow chevron\n> near the clock. Drag it onto the taskbar, then right-click → **Open Manager**.\n\nSystem requirements：Windows 10 and 11, 64-bit.\n**[Full details](https://github.com/DeskRipple/deskripple/blob/main/SYSTEM_REQUIREMENTS.md).**\n*(The `.nupkg`, `releases.beta.json`, and `meta.json` assets are the updater's feed;\n`DeskRipple-beta-Portable.zip` is an unsupported convenience — the installer is the supported\npath.)*\n\n## 🐛 Feedback\n\nFound a bug or have a suggestion? **[Report it here](https://tally.so/r/eqzJZx)** — no login\nrequired. The easiest path is right-click the tray icon → **Send feedback** (it pre-fills your\nversion, OS, and DPI scale, which makes reports far easier to act on).\n\n---\n\n🔒 **Privacy:** DeskRipple runs locally — no account, no login. Out of the box its only network\ntraffic is the background update check against GitHub (no identifiers; can be turned off), and\nthe license key is checked on your PC, not on a server. Anonymous usage diagnostics are\n**strictly opt-in and off by default** — you choose on first run and can change it anytime in\n**Settings**. Purchases are handled by Lemon Squeezy as merchant of record.\n[Privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md)."
