ReleaseNotes: "# DeskRipple v1.1.1\n\nDeskRipple 1.1.1 is a maintenance release. It starts sooner after you sign in, puts a Help\nlink in the app, and carries fixes for updates, icons, profiles and dialogs. If DeskRipple is\nalready installed and running, it updates itself in the background. New here? The installer\nis below.\n\n> 🔑 **Try DeskRipple free for 14 days, with every feature included. No account or payment details are required to start.** If it fits your workflow, DeskRipple is a one-time purchase, not a subscription. Enter a key once, under **Manager → About** or on the license screen, and there's no expiry — the key is verified on your own PC, with no account and no activation server. DeskRipple asks you to accept the [license agreement (EULA)](https://github.com/DeskRipple/deskripple/blob/main/EULA.md) on first run.\n\n## 🔧 What's new in 1.1.1\n\n• **DeskRipple starts sooner after you sign in.** The scheduled task that launches\n  DeskRipple at sign-in ran it at below-normal priority, and it stayed there for the whole\n  session. Among everything else that starts at sign-in, the first folder icon could take\n  20 seconds or more to appear. The task now runs DeskRipple at normal priority, never\n  above it, and an existing install updates its own task the first time it starts after\n  this update. On the development machine, the wait for the first icon after a restart\n  roughly halved.\n• **Help is one click away.** The tray menu has a Help item, the Manager footer a Help\n  link, and the About and welcome dialogs point to the same place:\n  [deskripple.com/help](https://deskripple.com/help). It covers the first minute, where a\n  desktop shortcut went, the Manager, expand styles, settings, profiles, privacy, updates,\n  your license and troubleshooting.\n• **Opening the Manager always brings it back.** If the Manager had been minimized,\n  double-clicking the tray icon, choosing **Open Manager**, opening it from a folder's menu\n  or starting DeskRipple a second time left it minimized, so the click seemed to do\n  nothing. It now comes back where it was.\n• **A stuck update no longer blocks newer ones.** When an update had been downloaded but\n  could not be applied at restart, because something held the install folder open at that\n  moment, DeskRipple kept that download and stopped checking for newer releases. It now\n  keeps checking, and a newer release replaces the stuck download and applies in the usual\n  way.\n• **A shortcut to an unplugged drive or a dead network path no longer freezes DeskRipple.**\n  Before it reads an icon, DeskRipple checks that the shortcut's target still exists and\n  resolves where the shortcut points. Those checks ran on the same thread that draws the\n  windows, and each one can wait out a network timeout when the target is gone, so a few\n  such shortcuts could stall the whole app for many seconds at startup and on every open,\n  even when the icon was already cached. All of it now runs in the background.\n• **A shortcut dragged in from the desktop is recorded the instant it is moved.** In Move\n  mode, DeskRipple moves the desktop original into its archive, and it wrote the matching\n  entry to its settings a fraction of a second later. A crash or a forced shutdown inside\n  that gap left the desktop icon gone with no entry saying where it went. The entry is now\n  written at once.\n• **Cloning a profile upgrades it first.** A profile created under an older version keeps\n  its settings in that version's layout, and DeskRipple upgrades the layout when it loads\n  the profile. Cloning copied the file as it was and marked the copy as current, so the\n  copy never got that upgrade. The clone is now upgraded before it is marked current, and\n  cloning the profile you are currently using saves its latest changes before copying.\n• **Dialogs fit on short or heavily scaled screens.** The license screen keeps its buttons\n  in view on a short screen and scrolls its text instead of pushing the buttons off the\n  bottom. Long captions, headings and tooltips wrap instead of being cut off, the Settings\n  labels stay aligned however long they get, and screen readers announce the check boxes\n  in the welcome dialog and About by their captions.\n• **A slow folder open now explains itself in the log.** Among the installs that turned\n  opt-in diagnostics on, about one folder open in a hundred takes a second or more. It\n  happens on Windows 11, looks like the first open after the PC has sat idle, and has not\n  reproduced on the development machine. DeskRipple now writes one line to its local log\n  whenever an open takes half a second or longer, naming which step took the time. The line\n  stays on your PC, and the diagnostics themselves are unchanged. If you see a slow open,\n  that line, in `%APPDATA%\\DeskRipple\\logs\\deskripple.log`, is what helps.\n• **Opt-in usage diagnostics.** The count of monitors that have a folder on them no longer\n  counts a monitor twice when one of its folders had lost the monitor's name. The data\n  format is unchanged (v7), off by default and unchanged unless you turned it on; the\n  [privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md) lists\n  every field.\n\nEverything else — desktop folder docks, five expand styles, drag-and-drop, desktop-icon\ndisplacement, multi-monitor and mixed-DPI support, multiple profiles, the 14-day trial for\nnew installs, automatic updates, and opt-in diagnostics — carries over from 1.1.0.\n\n## 📦 Install / update\n\n• **Already installed and running:** nothing to do — DeskRipple checks this repo in the\n  background and applies the update silently at an idle moment. A tray notification confirms\n  it. (Prefer to update on your own schedule? The **About** dialog has an \"Install updates\n  automatically\" toggle.)\n• **Stopped on the license screen:** a stopped DeskRipple doesn't check for updates. Click\n  **Get the latest version** on that screen; on an installed copy it updates in place and\n  restarts DeskRipple. The terms it comes back under are unchanged from\n  [1.1.0](https://github.com/DeskRipple/deskripple/releases/tag/v1.1.0).\n• **New install:** download **`DeskRipple-Setup.exe`** below and run it. It installs per-user\n  (no admin prompt), adds a Start Menu entry, and launches.\n\n> 🛡️ **SmartScreen prompt on the installer.** DeskRipple is **code-signed** (Microsoft Trusted\n> Signing). Because it's still building download reputation, Windows SmartScreen may show a\n> prompt — if it does, click **More info → Run anyway**.\n\n> 🔎 **Can't find the tray icon?** On Windows 11 it starts hidden in the `^` overflow chevron\n> near the clock. Drag it onto the taskbar, then right-click → **Open Manager**.\n\nSystem requirements：Windows 10 and 11, 64-bit.\n**[Full details](https://github.com/DeskRipple/deskripple/blob/main/SYSTEM_REQUIREMENTS.md).**\n*(The `.nupkg`, `releases.beta.json`, and `meta.json` assets are the updater's feed. The two\n`DeskRipple-beta-…` files are the same installer and ZIP under the update channel's name, kept\nfor older links. `DeskRipple-Portable.zip` is an unsupported convenience — the installer is the\nsupported path.)*\n\n## 🐛 Feedback\n\nFound a bug or have a suggestion? **[Report it here](https://tally.so/r/eqzJZx)** — no login\nrequired. The easiest path is right-click the tray icon → **Send feedback** (it pre-fills your\nversion, OS, and DPI scale, which makes reports far easier to act on).\n\n---\n\n🔒 **Privacy:** DeskRipple runs locally — no account, no login. Out of the box its only network\ntraffic is the background update check against GitHub (no identifiers; can be turned off), and\nthe license key is checked on your PC, not on a server. Anonymous usage diagnostics are\n**strictly opt-in and off by default** — you choose on first run and can change it anytime in\n**Settings**. Purchases are handled by Lemon Squeezy as merchant of record.\n[Privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md)."
