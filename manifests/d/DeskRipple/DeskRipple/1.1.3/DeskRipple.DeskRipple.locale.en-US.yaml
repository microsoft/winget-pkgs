ReleaseNotes: "# DeskRipple v1.1.3\n\nDeskRipple 1.1.3 lets you drag any file into a folder, shows pictures and videos as small\npreviews, and fixes two icon problems. If DeskRipple is already installed and running, it\nupdates itself in the background. New here? The installer is below.\n\n> 🔑 **Try DeskRipple free for 14 days, with every feature included. No account or payment details are required to start.** If it fits your workflow, DeskRipple is a one-time purchase, not a subscription. Enter a key once, under **Manager → About** or on the license screen, and there's no expiry — the key is verified on your own PC, with no account and no activation server. DeskRipple asks you to accept the [license agreement (EULA)](https://github.com/DeskRipple/deskripple/blob/main/EULA.md) on first run.\n\n## 🔧 What's new in 1.1.3\n\n• **Drag any file into a folder.** Pictures, videos, zip files and any other file can now be\n  dragged onto a folder, not only shortcuts, programs and a few document types. Each file stays\n  where it is：the folder links to it and opens it in its usual app, so moving or deleting the\n  file later means the entry can no longer open it. While you drag, the pointer shows the\n  shortcut arrow, or a plus sign when a desktop shortcut is about to move into safekeeping.\n• **Pictures and videos show a preview.** A picture or video in a folder now shows a small\n  preview of what's in it, the way File Explorer does, instead of its file-type icon. A file\n  without a preview keeps its icon, and if File Explorer is set to \"Always show icons, never\n  thumbnails\", folders follow that setting.\n• **Steam games show their own icons inside folders.** On PCs where `.ico` files show the icon\n  of the app that opens them, every Steam game inside a folder showed that app's icon instead\n  of the game's. Folders now show each game's own icon, as the desktop does.\n  ([#1](https://github.com/DeskRipple/deskripple/issues/1))\n• **Folder pictures that aren't square keep their shape.** A wide or tall picture picked as a\n  folder icon is no longer squeezed into a square.\n\nEverything else — desktop folder docks, five expand styles, desktop-icon displacement,\nmulti-monitor and mixed-DPI support, multiple profiles, the 14-day trial for new installs,\nautomatic updates, and opt-in diagnostics — carries over from 1.1.2.\n\n## 📦 Install / update\n\n• **Already installed and running:** nothing to do — DeskRipple checks this repo in the\n  background and applies the update silently at an idle moment. A tray notification confirms\n  it. (Prefer to update on your own schedule? The **About** dialog has an \"Install updates\n  automatically\" toggle.)\n• **Stopped on the license screen:** a stopped DeskRipple doesn't check for updates. Click\n  **Get the latest version** on that screen; on an installed copy it updates in place and\n  restarts DeskRipple. The terms it comes back under are unchanged from\n  [1.1.0](https://github.com/DeskRipple/deskripple/releases/tag/v1.1.0).\n• **New install:** download **`DeskRipple-Setup.exe`** below and run it. It installs per-user\n  (no admin prompt), adds a Start Menu entry, and launches.\n\n> 🛡️ **SmartScreen prompt on the installer.** DeskRipple is **code-signed** (Microsoft Trusted\n> Signing). Because it's still building download reputation, Windows SmartScreen may show a\n> prompt — if it does, click **More info → Run anyway**.\n\n> 🔎 **Can't find the tray icon?** On Windows 11 it starts hidden in the `^` overflow chevron\n> near the clock. Drag it onto the taskbar, then right-click → **Open Manager**.\n\nSystem requirements：Windows 10 and 11, 64-bit.\n**[Full details](https://github.com/DeskRipple/deskripple/blob/main/SYSTEM_REQUIREMENTS.md).**\n*(The `.nupkg`, `releases.beta.json`, and `meta.json` assets are the updater's feed. The two\n`DeskRipple-beta-…` files are the same installer and ZIP under the update channel's name, kept\nfor older links. `DeskRipple-Portable.zip` is an unsupported convenience — the installer is the\nsupported path.)*\n\n## 🐛 Feedback\n\nFound a bug or have a suggestion? **[Report it here](https://tally.so/r/eqzJZx)** — no login\nrequired. The easiest path is right-click the tray icon → **Send feedback** (it pre-fills your\nversion, OS, and DPI scale, which makes reports far easier to act on).\n\n---\n\n🔒 **Privacy:** DeskRipple runs locally — no account, no login. Out of the box its only network\ntraffic is the background update check against GitHub (no identifiers; can be turned off), and\nthe license key is checked on your PC, not on a server. Anonymous usage diagnostics are\n**strictly opt-in and off by default** — you choose on first run and can change it anytime in\n**Settings**. Purchases are handled by Lemon Squeezy as merchant of record.\n[Privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md)."
