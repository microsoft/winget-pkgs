ReleaseNotes: "# DeskRipple v1.0.0\n\nDeskRipple 1.0 is out, and it's the paid release the beta pointed at all along：a **one-time\npurchase, not a subscription**, with the price shown at checkout on\n[deskripple.com](https://deskripple.com/). If DeskRipple is already installed, it updates itself\nin the background — the next launch asks you to accept the updated license agreement once, and\nbeta testers get their founder discount inside the app. New here? Grab\n`DeskRipple-beta-Setup.exe` below (the file name keeps the update channel's name; it installs\n1.0).\n\n> 🔑 **Without a license key, DeskRipple stops working on September 1, 2026.** Enter a key once\n> under **Manager → About** and there's no expiry — the key is verified on your own PC, with no\n> account and no activation server. Until that date the app runs free, exactly as the beta\n> disclosed. By downloading you agree to the\n> [license agreement (EULA)](https://github.com/DeskRipple/deskripple/blob/main/EULA.md).\n\n> 🎟️ **Tested the beta? You get 50% off.** The founder code is shown inside the app — on the\n> license screen and in the one-time founder notice — and subscribers to the mailing list got a\n> personal code by email. Codes are time-limited; the app has the details.\n\n## 🔧 What's new in 1.0.0\n\n• **License keys.** Buy once at [deskripple.com](https://deskripple.com/), and your receipt\n  links a key page that shows your key from the order number and checkout email. Enter it under\n  **Manager → About**; the same panel shows your license status and what the license promises\n  about updates. Validation is offline — no account, no phone-home.\n• **The September 1 screen is a way through, not a dead end.** From that date an unlicensed\n  DeskRipple shows a license screen with the buy link, the founder code for beta testers, key\n  entry that unlocks in place, a **Restore my desktop shortcuts** button that returns every\n  archived desktop original, and a link to the latest version.\n• **Updated license agreement.** 1.0 replaces the beta license with the full EULA — perpetual\n  license, at least two years of Windows-compatibility updates from purchase, 14-day refunds via\n  the [terms of sale](https://deskripple.com/terms.html). Every install, updated or fresh,\n  accepts it once on first 1.0 launch.\n• **The beta is wrapped up.** Version labels, dialogs, and the welcome screen no longer say\n  \"beta\"; the founder pre-notice from v0.5.1 became the real founder offer with the live code.\n• **The founder discount has a permanent home in the Manager.** The one-time founder notice can\n  be dismissed, and until September 1 nothing else puts checkout in front of you. The Manager\n  footer now carries a Buy link on any install without a key：\"Get 50% off\" for beta testers,\n  \"Buy DeskRipple\" otherwise. It disappears the moment a key validates.\n• **DeskRipple no longer changes your \"Auto arrange icons\" setting.** A checkbox on the first-run\n  desktop notice used to let DeskRipple clear that Windows setting for you, and it re-cleared it\n  on every startup, with no way to switch it back off once the setting's own toggle was removed\n  in a July release. The notice is informational now：DeskRipple still tells you when auto-arrange\n  is on and what it does to folder placement, but it never touches the setting. Reported by a\n  beta tester.\n• **A settings file that's locked when DeskRipple starts can't be overwritten.** If an antivirus\n  scan, a backup, or a second copy of DeskRipple held `global.json` or a profile's `config.json`\n  at the wrong moment, DeskRipple started on empty defaults and then saved them over the real\n  file, losing a license key, your diagnostics choice, or the folder list. A related path could\n  fall back to the backup copy and quietly roll the install back one save, dropping the folder\n  you had just added. A file DeskRipple couldn't read is now never written to for the rest of\n  that session, and the next launch reads it normally.\n• **Deleting a profile can't destroy desktop shortcuts it failed to put back.** Profile delete\n  returns the desktop originals DeskRipple had moved into its archive, then removes the profile.\n  A shortcut locked at that instant was returned by neither step and went with the folder. The\n  restore now counts what it couldn't hand back and asks before going ahead, and it keeps those\n  files where the other restore paths can still find them.\n• **About and the welcome screen fit on a small screen.** Both had grown taller than the room a\n  taskbar leaves：on a 1366×768 display at 125% scaling the welcome screen ran off the bottom,\n  and About's buttons sat under the taskbar. That matters more in 1.0, because every install has\n  to accept the license agreement once, and a dialog that can't show its own \"I Agree\" button is\n  a dead end. Both are capped to the usable area now, and About is shorter, with Updates and\n  Diagnostics collapsed until you open them.\n• **Smaller fixes.** Esc closes every dialog. The license key box and its accept-or-reject message\n  are announced by screen readers. The tray menu no longer offers a profile switcher when there\n  is only one profile.\n\nEverything else — desktop folder docks, five expand styles, drag-and-drop, desktop-icon\ndisplacement, multi-monitor and mixed-DPI support, multiple profiles, automatic updates, and\nopt-in diagnostics — carries over from the beta unchanged.\n\n## 📦 Install / update\n\n• **Already installed:** nothing to do — DeskRipple checks this repo in the background and\n  applies the update silently at an idle moment. A tray notification confirms it, and the next\n  launch shows the updated license agreement once. (Prefer to update on your own schedule? The\n  **About** dialog has an \"Install updates automatically\" toggle.)\n• **New install:** download **`DeskRipple-beta-Setup.exe`** below and run it. It installs\n  per-user (no admin prompt), adds a Start Menu entry, and launches.\n\n> 🛡️ **SmartScreen prompt on the installer.** DeskRipple is **code-signed** (Microsoft Trusted\n> Signing). Because it's still building download reputation, Windows SmartScreen may show a\n> prompt — if it does, click **More info → Run anyway**.\n\n> 🔎 **Can't find the tray icon?** On Windows 11 it starts hidden in the `^` overflow chevron\n> near the clock. Drag it onto the taskbar, then right-click → **Open Manager**.\n\nSystem requirements：Windows 10 and 11, 64-bit.\n**[Full details](https://github.com/DeskRipple/deskripple/blob/main/SYSTEM_REQUIREMENTS.md).**\n*(The `.nupkg`, `releases.beta.json`, and `meta.json` assets are the updater's feed;\n`DeskRipple-beta-Portable.zip` is an unsupported convenience — the installer is the supported\npath.)*\n\n## 🐛 Feedback\n\nFound a bug or have a suggestion? **[Report it here](https://tally.so/r/eqzJZx)** — no login\nrequired. The easiest path is right-click the tray icon → **Send feedback** (it pre-fills your\nversion, OS, and DPI scale, which makes reports far easier to act on).\n\n---\n\n🔒 **Privacy:** DeskRipple runs locally — no account, no login. Out of the box its only network\ntraffic is the background update check against GitHub (no identifiers; can be turned off), and\nthe license key is checked on your PC, not on a server. Anonymous usage diagnostics are\n**strictly opt-in and off by default** — you choose on first run and can change it anytime in\n**Settings**. Purchases are handled by Lemon Squeezy as merchant of record.\n[Privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md)."
