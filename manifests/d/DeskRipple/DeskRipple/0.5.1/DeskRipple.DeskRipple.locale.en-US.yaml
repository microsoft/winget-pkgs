ReleaseNotes: |-
  # DeskRipple v0.5.1 (beta)

  An update to the [v0.4.10 beta](https://github.com/DeskRipple/deskripple/releases/tag/v0.4.10), adding an in-app heads-up that the beta ends on September 1 and fixing folders that could scatter across monitors after a reboot. If DeskRipple is already installed, it updates itself in the background — there's nothing to do. New here? Grab `DeskRipple-beta-Setup.exe` below.

  > ⚠️ **This is a beta.** Things may break or behave unexpectedly. Please report anything you hit (see **Feedback** below). A one-time paid version is coming in mid-August 2026 (not a subscription), and beta testers get a founder discount.

  > ⏳ **Free during the public beta — this build stops working on September 1, 2026.** It keeps itself updated automatically (you can turn that off in the **About** dialog). By downloading you agree to the [beta license (EULA)](https://github.com/DeskRipple/deskripple/blob/main/EULA.md).

  ## 🔧 What's new in 0.5.1

  • **A heads-up that the beta is ending.** DeskRipple now shows a one-time notice with the dates that matter：every beta build stops working on September 1, 2026, and a one-time paid version is coming in mid-August (not a subscription) with a founder discount for beta testers. Joining the mailing list — from that notice or from **Manager → About** — is how your personal discount code reaches you when the paid version goes live. Dismiss it and it won't appear again.
  • **Folders stay on their monitor.** Windows can renumber displays between reboots on multi-monitor setups, and DeskRipple could mistake that renumbering for a missing monitor, relocating folders and scattering a carefully arranged layout. Monitors are now identified by the display hardware itself, and a folder's position is only rescued when it's genuinely visible on no connected screen.
  • **Hover mode opens one folder at a time, every time.** The Click-mode option that keeps several folders open no longer carries over into Hover mode — hovering a new folder closes the previous one immediately instead of leaving it up for a moment.
  • **Folders can't pile up on one desktop cell.** Dropping a folder onto another folder's spot now moves the resident folder to the nearest free cell, the same way native icons already step aside. Displaced icons also land on the truly nearest cell instead of hopping diagonally past a closer one.
  • **Shortcut right-click menu updates.** New **Set as folder icon** uses the right-clicked shortcut's own icon for the folder. **Open** was removed (a left click already launches), and **Restore original to desktop** was removed — removing a shortcut still returns the archived original to the desktop automatically, as before.
  • **The after-September-1 screen now restores your shortcuts.** If an expired build ever starts, the screen it shows links to the latest version and includes a one-click **Restore my desktop shortcuts** that returns every archived desktop original to the desktop — nothing stays locked away.

  Everything else from the earlier betas — desktop folder docks, five expand styles, drag-and-drop, desktop-icon displacement, multi-monitor and mixed-DPI support, multiple profiles, automatic updates, and opt-in diagnostics — works as before.

  ## 📦 Install / update

  • **Already installed:** nothing to do — DeskRipple checks this repo in the background and applies the update silently at an idle moment. A tray notification confirms it. (Prefer to update on your own schedule? The **About** dialog has an "Install updates automatically" toggle.)
  • **New install:** download **`DeskRipple-beta-Setup.exe`** below and run it. It installs per-user (no admin prompt), adds a Start Menu entry, and launches.

  > 🛡️ **SmartScreen prompt on the installer.** DeskRipple is **code-signed** (Microsoft Trusted Signing). Because it's a new app still building download reputation, Windows SmartScreen may show a prompt — if it does, click **More info → Run anyway**.

  > 🔎 **Can't find the tray icon?** On Windows 11 it starts hidden in the `^` overflow chevron near the clock. Drag it onto the taskbar, then right-click → **Open Manager**.

  System requirements：Windows 10 and 11, 64-bit. **[Full details](https://github.com/DeskRipple/deskripple/blob/main/SYSTEM_REQUIREMENTS.md).** *(The `.nupkg`, `releases.beta.json`, and `meta.json` assets are the updater's feed; `DeskRipple-beta-Portable.zip` is an unsupported convenience — the installer is the supported path.)*

  ## 🐛 Feedback

  Found a bug or have a suggestion? **[Report it here](https://tally.so/r/eqzJZx)** — no login required. The easiest path is right-click the tray icon → **Send feedback** (it pre-fills your version, OS, and DPI scale, which makes reports far easier to act on).

  ---

  🔒 **Privacy:** DeskRipple runs locally — no account, no login. Out of the box its only network traffic is the background update check against GitHub (no identifiers; can be turned off). Anonymous usage diagnostics are **strictly opt-in and off by default** — you choose on first run and can change it anytime in **Settings**. [Privacy policy](https://github.com/DeskRipple/deskripple/blob/main/PRIVACY.md).
