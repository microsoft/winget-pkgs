ShortDescription: Лёгкая смена обоев, большие часы, погода и живые обои на рабочем столе.
Description: |-
  Hora меняет обои каждые несколько минут (с Wallhaven или из своей папки) и показывает большие часы с датой и погодой прямо на рабочем столе, под иконками.
  Умеет живые обои: снег, дождь, звёзды, светлячки или своё видео, в том числе видеообои Wallpaper Engine.
  Около 5 МБ памяти и 0 % процессора в простое. Интерфейс на русском и английском.
