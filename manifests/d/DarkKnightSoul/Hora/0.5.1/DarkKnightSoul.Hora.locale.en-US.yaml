ShortDescription: Lightweight wallpaper changer with a big desktop clock, weather and live wallpapers.
Description: |-
  Hora changes your desktop wallpaper every few minutes (from Wallhaven or your own folder) and shows a big clock with the date and weather right on the desktop, under the icons.
  It also plays live wallpapers: snow, rain, stars, fireflies or your own videos, including Wallpaper Engine video wallpapers.
  About 5 MB of memory and 0% CPU when idle. English and Russian interface.
