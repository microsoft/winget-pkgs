ShortDescription: A Windows tray panel for the DeepSeek Harness agent — runs the local dsh web server, shows peak-hour pricing and the account balance, keeps and restores backups of the DSH data.
Description: |-
  DSH Panel is a tray application for Windows that supervises the local DeepSeek Harness
  ("dsh") instance on the same machine.

  What it does:
  - starts, restarts and stops the local dsh web server and shows its real state (running,
    stopped, or the port is taken by another process) together with the process id;
  - opens the browser with the sign-in link, the server log and the .dsh folder;
  - shows DeepSeek peak and off-peak hours in the local time zone, when the next switch
    happens, and the official price table;
  - reads the account balance with the key from ~/.dsh/.credentials.yaml and warns when it
    drops below a threshold;
  - makes backups of the DSH data and of the panel settings (zip with a SHA-256 manifest and
    a keep-last-N policy) and restores them; optionally a backup also carries the DSH engine
    and Node, so it can be restored without the internet;
  - updates itself from GitHub releases and verifies the release checksums.

  The interface is available in English, Russian and Chinese. The panel runs the official
  dsh command line and does not modify it; it does not send telemetry.

  Requirements: Windows 10 or 11 (x64), Node.js 20 or newer, and the DSH package
  (@deepseek-ai/dsh). The .NET Desktop Runtime 8 is required by the panel itself and is
  installed by this package when it is missing; the portable "no .NET needed" build and a
  setup-free zip are published on the GitHub releases page.

  Not affiliated with DeepSeek. DSH Panel is a community-made tray application; DeepSeek and
  DeepSeek Harness are trademarks of their respective owner.
