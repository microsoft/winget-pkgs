# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json
#
# DSH Panel — version manifest for the Windows Package Manager community repository.
# Comments are in English because these files are submitted verbatim to
# microsoft/winget-pkgs, where the pull request is read in English.
#
# PackageVersion and the installer hash are filled in by tools\winget-manifest.ps1:
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\winget-manifest.ps1 -ReleaseTag v1.20.3
#
# Take the hash from the published release (SHA256SUMS.txt), not from a local build:
# the release is built by CI and its bytes differ from a locally built installer. The
# script refuses to write a locally computed hash unless -AllowLocalSum is passed, and
# it refuses to combine a release tag with a different project version.

PackageIdentifier: Danerus23.DSHPanel
PackageVersion: 1.21.0
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.12.0
