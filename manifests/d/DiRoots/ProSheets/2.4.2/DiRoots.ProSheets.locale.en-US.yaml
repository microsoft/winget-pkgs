ReleaseNotes: "## Enhancements\r\n### Create Tab\r\n• **Improved Publishing Destinations** - Destination controls are now enabled only when selected, with clearer behavior matching the Format tab.\r\n### Forma\r\n• **Improved connector availability messaging** - ProSheets now explains when no accessible Forma Hub has an active DiRoots Connector and provides a link to add or activate it.\r\n### Printer\r\n• Updated PDF24 components to newer versions for improved compatibility.\r\n## Bug Fixes\r\n### Forma\r\n• Renamed folders now display their current names after being renamed in Autodesk Construction Cloud.\r\n• Exports are now uploaded to the correct renamed folder instead of creating a duplicate folder with the previous name."
