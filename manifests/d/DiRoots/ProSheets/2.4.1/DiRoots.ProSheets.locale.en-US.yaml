ShortDescription: ProSheets is a plugin for Autodesk Revit Add-in to batch export Views and Sheets to PDF, DWG, DGN, DWF, NWC, IFC, and Images (JPEG, PNG, TIFF, etc).
ReleaseNotes: |-
  ## Features
  **Upload directly to Autodesk Forma** – Connect your Forma account and automatically upload exports as soon as they are generated.
  **Customize your workspace** – Choose whether ProSheets appears in the DiRootsOne ribbon tab.

  ## Enhancements
  **Find what you need faster** with new filtering and restore options in the Create tab.
  **Keep your work intact** – The state from the Create tab is now persistent when you return to a previous step.
  **Preserve file history** – Creates a new version if a file already exists.
  **Cleaner export folders** – Temporary `.bak` files created when using Bind Images as OLE are now removed automatically.

  ## Bug Fixes
  Fixed an issue where **Bind Images as OLE** incorrectly launched **Civil 3D** instead of **AutoCAD**, preventing images from being bound.
  Fixed a **DateTime** parsing issue that could cause a **XamlParseException**.
  Fixed reported conflicts with 3rd party plugins.
  Other minor UI/UX issues.
