ShortDescription: 3D modelling for makers - furniture, workshop projects and 3D prints, in real units.
Description: |-
  Varstotas is a free, open-source 3D modeller for makers and hobbyists: push/pull modelling with
  inference snapping and exact values, dimensions, components and scenes, 3D-print preparation
  (checks, repair, cutting with dowels, STL / 3MF), unfolding to SVG / PDF / DXF, PBR materials and
  a path tracer, Rhai scripting, plugins and a local bridge for Python and AI agents.
