ShortDescription: A lightweight, unobtrusive desktop translator for Windows and macOS.
Description: |-
  Sotto is a lightweight, unobtrusive desktop translator for Windows and macOS. It is designed to be an always-available translation companion that queries multiple translation engines in parallel and streams results in real time, then hides automatically on blur so you stay focused on your work.

  Flexible Modes: Enable Minimal Translation Mode in Settings to keep selection and snip results text-only, while the panel shortcut remains ready to summon the full Bubble view.
  Concurrent Multi-Engine Comparison: Query multiple translation sources at once with progressive streaming results; fold, copy, or retry cards independently.
  Local Translation History: Search saved originals and translations, copy results or identifier formats, and re-translate with other services.
  Non-Intrusive Selection and Clipboard Protection: Windows reads text via UIA without stealing focus; simulated copy automatically restores the clipboard with history exclusion markers attached.
  Offline Screen OCR: Snip any screen region for instant local recognition and translation; Windows embeds PP-OCR and WinRT OCR, and images are never uploaded to the cloud.
  Identifier Naming Styles: One-click copy for English translations into camelCase, PascalCase, snake_case, CONSTANT_CASE, or kebab-case.
  Credential Protection and Zero Telemetry: Zero tracking, with API keys protected by the system credential manager.
  Lightweight and Native: Pure Go backend with native mygo/ui windows and a frameless design that respects system themes, hides on blur, or pins in place.
