PackageIdentifier: doyuli.Sotto
PackageVersion: 0.3.4
PackageLocale: zh-CN
ShortDescription: 面向 Windows 与 macOS 的轻量无感桌面翻译工具。
Description: |-
  Sotto 是一款面向 Windows 与 macOS 的轻量、无感桌面翻译工具。它常驻桌面，可同时请求多个翻译引擎并实时流式返回结果，窗口失焦后自动隐藏，不打断你的工作节奏。

  多种模式：在设置中开启极简翻译模式，划词与截屏结果只保留译文，面板快捷键仍可随时唤出完整气泡视图。
  多引擎并行对比：一次查询多个翻译来源，结果渐进式流式呈现，可单独折叠、复制或重试某张卡片。
  本地翻译历史：可搜索已保存的原文与译文，复制结果或命名格式，并换用其他服务重新翻译。
  无感划词与剪贴板保护：Windows 通过 UIA 读取选中文本而不抢占焦点；模拟复制后会自动还原剪贴板，并附带历史排除标记。
  离线截屏 OCR：框选屏幕任意区域即可本地识别并翻译；Windows 内嵌 PP-OCR 与 WinRT OCR，图片不会上传到云端。
  标识符命名风格：一键将英文译文复制为 camelCase、PascalCase、snake_case、CONSTANT_CASE 或 kebab-case。
  凭据保护与零遥测：不做任何统计上报，API Key 由系统凭据管理器保护。
  轻量原生：纯 Go 后端搭配 mygo/ui 原生窗口，无边框设计跟随系统主题，可失焦隐藏或置顶停留。
