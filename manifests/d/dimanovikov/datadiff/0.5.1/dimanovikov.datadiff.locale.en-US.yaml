ShortDescription: Semantic diff for JSON, YAML, CSV, TOML and XML that plugs into git diff and kubectl diff.
Description: |-
  datadiff compares structured files by their parsed data instead of their lines. Reordered keys and reformatting produce no noise, list items can be matched by a key field, and every change is reported as a data path such as spec.replicas: 3 -> 5.
