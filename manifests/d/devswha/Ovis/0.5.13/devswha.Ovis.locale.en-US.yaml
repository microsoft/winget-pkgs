ShortDescription: Run your coding agents and follow them from this computer, a browser or your phone.
Description: |-
  Ovis runs on the computer where your agents work, and your phone or any browser connects to it. It is built on herdr and can show the same live terminals as herdr and the Herdr app, so they work side by side.

  Your PCs, anywhere
  Sign in to your Ovis account with GitHub, Google or Apple (your first sign-in makes it), and the computers in it show up on your other devices: the desktop app on Mac, Windows or Linux, the iPhone and Android apps, and any browser at app.ovis.sh. The apps connect directly when they share a Wi-Fi or Tailscale with the computer; otherwise, and in a browser, they go through the Ovis relay, end-to-end encrypted, with nothing to set up on your network. You can also reach a computer over SSH without an account.

  Features
  - Agents as a chat. Claude Code, Codex and more, with a turn's commands and edits folded into one line.
  - Answers with a tap. Approvals and questions arrive as cards.
  - Push alerts. Even with the app closed.
  - The real terminal, one click away. With a key bar on phones.
  - New agents from anywhere. In a folder you pick, from the desktop or the phone.
  - Every workspace in one list. Your other PCs too, over the relay or SSH.
  - A browser of your choice. Give Claude Code, Codex or GitHub Copilot a browser tool (Chrome DevTools MCP or Playwright MCP) in Settings → Agents, and have the desktop app open links in the browser you pick.

  Privacy
  Sessions stay on your computer, and no account is needed. The relay is end-to-end encrypted. Anonymous usage counts are on by default; Settings → About or OVIS_TELEMETRY=0 turns them off.
