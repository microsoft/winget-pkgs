ShortDescription: 在你的电脑上运行编程智能体，并从这台电脑、浏览器或手机上跟进它们。
Description: |-
  Ovis 运行在智能体所在的那台电脑上，手机或任意浏览器都可以连接到它。它基于 herdr 构建，能显示你在 herdr 或 Herdr 应用里看到的同一批实时终端，所以两者可以同时使用。

  随时随地访问你的电脑
  用 GitHub、Google 或 Apple 登录你的 Ovis 账户（第一次登录即创建账户），账户里的电脑就会出现在你的其他设备上：Mac、Windows、Linux 上的桌面应用，iPhone 和 Android 应用，以及任意打开 app.ovis.sh 的浏览器。应用与电脑在同一 Wi-Fi 或 Tailscale 上时直接连接；否则以及在浏览器中，通过端到端加密的 Ovis 中继连接，网络上无需任何设置。不用账户也可以通过 SSH 连接电脑。

  功能
  - 以聊天方式使用智能体。Claude Code、Codex 等。每一轮的命令和修改会折叠成一行。
  - 审批和提问以卡片呈现。轻点即可回答。
  - 推送通知。应用关闭时也能收到。
  - 真正的终端，一键即达。手机上还有按键栏。
  - 随时随地启动新智能体。在桌面或手机上选好文件夹即可。
  - 所有工作区，一个列表。也包括通过中继或 SSH 连接的你的其他电脑。
  - 用你选的浏览器。在 设置 → Agent 中给 Claude Code、Codex 或 GitHub Copilot 配上浏览器工具（Chrome DevTools MCP 或 Playwright MCP），桌面应用也能用你选的浏览器打开链接。

  隐私
  会话留在你的电脑上，不需要账户。中继采用端到端加密。匿名使用计数默认启用，可在 设置 → 关于 中关闭，或设置 OVIS_TELEMETRY=0。
