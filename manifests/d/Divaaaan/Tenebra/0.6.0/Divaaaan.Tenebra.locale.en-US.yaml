ReleaseNotes: "<!-- tenebra-promotion-sha256:a72ce0d98b8826c165c99ce3a7e5d6f2f075964ed6de178b00eee5fad0714c03 -->\n# Tenebra 0.6.0\n\n## Verification scope for this release\n\nTenebra 0.6.0 is published with the project owner's approval of a reduced release acceptance scope. **The complete Windows protection matrix has not passed.** The implementation's intended coverage described below is not evidence that every failure condition has been tested.\n\nThe exact Windows installer was exercised through installation, upgrade from 0.5.11, repair, uninstall with profile preservation and reinstall. Both interface modes and ordinary-user flows were checked at 100% and 150% scaling. Controlled IPv4 tunnel and system-proxy traffic, proxy restoration, repeated engine crashes and a bounded service-stop scenario were exercised.\n\nEnd-to-end IPv6/QUIC leakage checks, BFE restart, reboot before core recovery, all existing-flow and DIRECT-exception cases, routing/interface changes, suspend/resume and the full update/uninstall failure matrix remain follow-up work. The tested service-stop capture is a limited observation, not a universal no-leak guarantee. The original report of unavailable servers on another Windows PC and real-world DPI bypass effectiveness remain unverified. macOS/Linux package build checks do not establish equivalent native runtime coverage.\n\nThe attached `acceptance.json` records this limited release decision and explicitly sets `fullNativeMatrixPassed` to `false`. The candidate files, updater signatures and source provenance are unchanged.\n\n### Область проверки\n\nВерсия выпущена по решению владельца проекта с перечисленными ограничениями. Проверены установка и обновление Windows, оба режима интерфейса, реальные IPv4-подключения, восстановление прокси и отдельные аварии движка и службы. Полная матрица защиты, IPv6/QUIC, перезагрузка и остальные перечисленные выше случаи ещё не приняты. Работа обхода DPI в каждой сети и исходный случай «все серверы недоступны» не подтверждены.\n\n---\n\nThis desktop release revises both interface modes and Windows service,\ninstallation and connection handling.\n\n• Simple mode brings subscription setup, server selection and connection\n  feedback into one flow. Full mode has a revised connection panel, searchable\n  servers and consistent settings, profiles, import and diagnostic screens.\n• Connection errors distinguish local service, engine and proxy failures from\n  server failures. A failed TCP probe no longer prevents selecting a server or\n  claims that its VPN protocol cannot connect.\n• Windows service communication verifies the installed service identity,\n  supports the ordinary signed-in user and elevated administrators, and bounds\n  requests when the service stops responding.\n• System proxy handling tracks the owning Windows user and keeps the settings\n  required for restoration. Disconnect and cleanup errors remain visible.\n• The Windows installer loads the service-management assembly before waiting\n  for the service to stop, fixing the false stop-state failure in a fresh\n  PowerShell process.\n• Routing and reconnect changes preserve split settings, reject unusable\n  multihop chains and limit repeated engine failures.\n• Keyboard focus, compact layouts, themes and Russian/English text have been\n  revised across both modes.\n\n## Windows protection\n\nWhen enabled and applied by a connection, persistent Windows protection keeps\nblocking if the VPN engine or Tenebra service exits. Explicit Disconnect,\ndisabling protection with confirmed cleanup, or a successful uninstall releases\nTenebra's policy. Configured DIRECT exceptions use the running engine.\n\nProtection covers ordinary Windows application IPv4/IPv6 traffic after Windows\nFiltering Platform loads its policy. It does not cover the interval before BFE\nstarts, deliberately disabled BFE, or forwarded VM/container traffic. The saved\npreference, last confirmed protection state and errors are shown separately.\n\n## Packages and verification\n\nDesktop packages cover Windows, macOS, Linux and Arch Linux. Windows installs\nthe privileged service. macOS requires the documented manual daemon setup and\nis not notarized. Linux package and AppImage setup requirements are documented\nin the README. Updater signatures use the project's minisign key; they are not\nWindows Authenticode certificates. Android and iOS are outside this release.\n\nPublication requires recorded Windows installation, service, ordinary-user UI,\ntunnel and protection acceptance of these exact signed artifacts. The attached\n`candidate.json` records source and file hashes; `acceptance.json` identifies\nthe reviewed native evidence. CI build reports alone do not establish native\nruntime testing on every platform.\n\nThe original report that all servers appeared unavailable on one Windows PC\nhas not been causally reproduced. Successful controlled-endpoint tests do not\nestablish that every subscription or network environment has been fixed."
