ReleaseNotes: |-
  ## 迁移
  - feat!: 将包修改审查者的来源迁移到 .package 和 ManualValidationPipeline.csv 文件 (#470) by @DuckDuckStudio in #485

  原先使用的 Auth.csv 文件已迁移至 ManualValidationPipeline.csv 文件（ https://github.com/microsoft/winget-pkgs/pull/344989#issuecomment-3994688452 ），和之前的一样，这仅限于 Stephen 的自动化。
  另外，仓库中还有 .package 文件，这是作为验证的发布者（microsoft/winget-pkgs#325096）添加的，这个直接在验证运行前面检查，会直接导致验证运行失败，并添加 Author-Not-Verified 标签。

  获取优先级是 .package 文件 > ManualValidationPipeline.csv，在前者找到审查者后不会继续向下查找。

  ### 破坏性修改
  无视 Auth.csv 中的定义，因为它和 ManualValidationPipeline.csv 重复，且已被弃用。

  你不需要做任何手动迁移操作。

  ---

  完整修改记录：https://github.com/DuckDuckStudio/Sundry/compare/1.11.0...1.12.0
