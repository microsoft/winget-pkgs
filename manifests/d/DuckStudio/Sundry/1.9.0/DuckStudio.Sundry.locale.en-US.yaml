ReleaseNotes: |-
  ## ⚠ 破坏性修改
  - feat!(logs-analyse): 改为通过 [GitHub App 检查](https://github.com/microsoft/winget-pkgs/issues/263724)获取验证日志 (#365) by @DuckDuckStudio in #372

  ### 移除通过 Azure DevOps 获取验证日志的逻辑

  如有需要请使用 Sundry 的旧版本。

  ### 参数变化
  1. 移除命令别名 "Azure日志分析"
  2. 移除传递 "Azure 管道运行链接" 的方式
  3. 移除 sundry logs-analyse clean，请改用 sundry clean logs-analyse
  4. 改用 argparse 解析参数
     1. 改用 --detailed 参数控制是否启用详细模式（显示一般错误和异常）
     2. 改用 --(no-)keep-logs 参数控制是否保留下载的日志文件；未指定时在分析结束后询问
     3. 不再限定参数位置

  ### 日志存放目录变化。
  原先是 "%TEMP%/Sundry/AzurePipelines/**"。
  现在是 "%TEMP%/Sundry/ValidationLogs/**"。

  ## 修复
  - fix(func/github/token): 捕获 KeyringError 异常 by @DuckDuckStudio in #373

  ## 杂项
  - chore: 统一使用 pyproject.toml 而不是 requirements.txt by @DuckDuckStudio in #376


  完整修改记录: https://github.com/DuckDuckStudio/Sundry/compare/1.8.1...1.9.0
