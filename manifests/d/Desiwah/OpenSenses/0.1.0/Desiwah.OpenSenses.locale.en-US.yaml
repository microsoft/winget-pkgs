ShortDescription: Free, open source alternative to Acer PredatorSense for Predator laptops.
Description: |-
  OpenSenses controls the keyboard lighting, fans, GPU overclock levels, Turbo key and programmable keys of Acer Predator laptops, and shows temperatures and fan speeds.
  GameSync switches to a game's own settings while it runs. A small background service keeps the settings applied, and the laptop's original settings can be restored at any time.
  Experimental: only the Predator Helios 300 (PH317-53) has been tested on real hardware.
