ReleaseNotes: |-
  New Features
  AI
  Use the AI service of your choice: your own OpenAI or Anthropic account, a local model, or your organization's LLM
  Connection Setup
  Import connections from Oracle SQL Developer
  DB Support: Couchbase
  Add support for Couchbase
  SQL Formatter
  Introduce a new SQL formatter
  Schema & Data Sync
  Compare and sync the structure of two databases, schemas or tables
  Copy tables between database connections
  Security
  Unlock the password vault using Touch ID or Windows Hello
  Improvements
  AI
  Rename, delete, pin and search chats in the AI chat history
  Client-side commands
  Report unknown client-side command parameters as errors
  DB Support: MariaDB
  Add support for system-versioned tables in MariaDB
  Add support for the VECTOR data type in MariaDB
  Improve support for JSON, UUID and INET4/INET6 data types in MariaDB
  DB Support: QuestDB
  Add support for the latest PostgreSQL driver in QuestDB
  Driver Manager
  Add an option to lock a driver to a specific version to prevent automatic updates
  Update template drivers
  Favorites
  Restore the Favorites toolbar, available via View->Show Favorites Toolbar
  OS Support: macOS
  Let administrators configure DbVisualizer without breaking the application's code signature
  SQL Commander
  Use tree order for recent connections in SQL Commander's connection selector, and also list them under All Databases
  SQL Formatter
  Format named arguments in function calls the same way as positional arguments
  Support the Format SQL option when scripting functions and procedures
  Value Viewer
  Delete JSON object keys directly from the tree in the Value tab
  Bugs Fixed
  Client-side commands
  @export doesn't quote text values when exporting to a .sql file without an explicit format
  @export writes no data rows when TextFunction is not written with the exact case
  DB Support: CockroachDB
  Script Table may generate a CREATE TABLE that fails in CockroachDB
  DB Support: MariaDB
  Alter Table drops check constraints in MariaDB
  DB Support: Oracle
  Alter Table may generate MODIFY statements for unchanged columns in Oracle
  DB Support: PostgreSQL
  Auto-complete suggests partitions instead of partitioned tables in PostgreSQL
  DB Support: SQL Server
  Alter Table may generate ALTER COLUMN statements for unchanged columns in SQL Server
  Formatting may break bracketed identifiers in SQL Server
  DB Support: Snowflake
  Formatting ignores Snowflake table types such as TRANSIENT, HYBRID, DYNAMIC and ICEBERG
  QUALIFY clause is not formatted correctly in Snowflake
  DDL Generator
  Script Table may leave out or change identity column settings such as the start value, increment and bounds
  Driver Manager
  Driver update fails when the new version requires additional artifacts
  Export
  A numeric Null Value Text is written to Excel as text in numeric columns
  SQL export may qualify INSERT statements with the wrong catalog
  OS Support: Linux
  Can't extend the main window to two monitors on Linux
  Changing the database connection in SQL Commander may be slow on Linux
  Frameless dialogs close immediately on the COSMIC desktop on Linux
  OS Support: Windows
  The main window may not appear after startup on Windows
  Windows Security may block parts of the application, breaking the AI Assistant and the map viewer
  OS Support: macOS
  DbVisualizer may freeze at startup or when running the first query on macOS
  SQL Formatter
  Custom comment delimiters are ignored when formatting
  Formatting may not use the chosen formatting profile after a restart
  Formatting may split the :: cast operator, causing errors on execution
  SSH
  Disconnecting a database connection that uses an SSH tunnel may not complete, or may report an error, if the database has already closed the connection
