ReleaseNotes: |-
  Improvements
  DB Support: Google BigQuery
  Switch to Google's official JDBC driver for BigQuery
  Database Objects Tree
  Grid Component
  Add an option to keep the quick search/filter field open
  Remember quick search/filter settings between sessions
  Use available space in the current toolbar for the quick search/filter field when possible
  SSH
  Add an option to replace the existing host key when a remote host fingerprint has changed
  Offer to reconnect when an SSH connection is lost
  Bugs Fixed
  Client-side commands
  Changing SQL Log Time Format does not affect @log until restart
  Compare
  Editor tabs are unsorted in Compare Objects
  DB Support: Db2 LUW
  Query Builder does not qualify columns by default in Db2
  DDL Generator
  Table names may be unnecessarily quoted in generated SQL
  Database Objects Tree
  Reconnecting collapses the tree for databases that support both catalogs and schemas (such as PostgreSQL and SQL Server)
  Monitor
  Monitors are not started on application start when a master password is set
  OS Support: Linux
  Login hangs until timeout when using the COSMIC desktop on Linux
  OS Support: Windows
  Application initialization error when certain group policies are enforced on Windows
  SQL Commander
  Clicking the connection selector while it is loading may cause an error
  Various fixes in Vim mode
  Value Viewer
  Value viewer garbles BLOB data
