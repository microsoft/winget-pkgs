ShortDescription: SSH-терминал, файловый менеджер SFTP и FTPS, клиенты RDP и VNC в одном приложении.
Description: |-
  Conchshell собирает в одном приложении SSH-терминал, двухпанельный файловый менеджер для SFTP, FTP и FTPS, клиенты RDP и VNC, а рядом — наблюдение за удалённым хостом.

  - Терминал: настоящий PTY (xterm.js с отрисовкой через WebGL), разделение панелей в четыре стороны, группы вкладок, поиск, локальные вкладки со своим shell; рабочее место возвращается при следующем запуске.
  - Файлы: локальное и удалённое рядом, перетаскивание, очередь передачи, сравнение каталогов до синхронизации; удалённый файл открывается в выбранной программе, и каждое сохранение уходит обратно на сервер.
  - Удалённый рабочий стол: RDP с проверкой подлинности на уровне сети (CredSSP) и VNC с паролем VNC или без него. RDP-хост с выключенным NLA не подключится. VNC идёт без шифрования (VeNCrypt и TLS нет), поэтому за пределами доверенной сети его лучше вести через промежуточный SSH-хост.
  - Наблюдение: процессор, память, диск, процессы и сеть удалённого хоста, журналы в реальном времени с фильтром по уровню и регулярными выражениями.
  - Доступ: пароль, закрытый ключ, зашифрованный ключ, ssh-agent; прокси HTTP CONNECT, SOCKS4, SOCKS4a и SOCKS5; промежуточные SSH-хосты (jump host).
  - Безопасность: сохранённые пароли и ключи можно держать в зашифрованном хранилище (XChaCha20-Poly1305, Argon2id). Ключ сервера запоминается при первом подключении, сертификаты RDP и FTPS проверяются так же.
  - Переезд: импорт хостов из ~/.ssh/config, профилей Bitvise (.tlp) и ключей PuTTY (.ppk).

  Приложение бесплатно: ни аккаунта, ни подписки. Платная одна возможность — синхронизация сохранённых подключений между своими машинами, $19 разово. Интерфейс на русском, английском и китайском. Если в системе нет Microsoft Edge WebView2, установщик скачает его сам.
