ShortDescription: SSH terminal, SFTP and FTPS file manager, RDP client and VNC viewer in one app.
Description: |-
  Conchshell puts an SSH terminal, a two-panel SFTP, FTP and FTPS file manager, an RDP client and a VNC viewer in one app, with monitoring of the remote host beside them.

  - Terminal: a real PTY (xterm.js drawn with WebGL), split panes in four directions, tab groups, search, local shell tabs, and the workspace restored at the next launch.
  - Files: local and remote side by side, drag and drop, a transfer queue, directory comparison before anything is synchronised, and remote files opened in the application of your choice with every save uploaded back.
  - Remote desktop: RDP with Network Level Authentication (CredSSP), and VNC with a VNC password or without one. An RDP host with NLA switched off will not connect. VNC connections are not encrypted (no VeNCrypt or TLS); outside a trusted network, run them through an SSH jump host.
  - Monitoring: CPU, memory, disk, processes and network of the remote host, and a live log viewer with level filters and regular expressions.
  - Access: passwords, private keys, encrypted keys and ssh-agent; HTTP CONNECT, SOCKS4, SOCKS4a and SOCKS5 proxies; SSH jump hosts.
  - Security: saved passwords and keys can be kept in an encrypted vault (XChaCha20-Poly1305, Argon2id). Server keys are pinned on first connection, and RDP and FTPS certificates are checked the same way.
  - Moving in: hosts from ~/.ssh/config, Bitvise .tlp profiles and PuTTY .ppk keys can be imported.

  The application is free, with no account and no subscription. One feature is paid: Sync, which carries saved connections between your own machines, for a one-time $19. The interface is in English, Russian and Chinese. The installer downloads Microsoft Edge WebView2 if it is missing.
