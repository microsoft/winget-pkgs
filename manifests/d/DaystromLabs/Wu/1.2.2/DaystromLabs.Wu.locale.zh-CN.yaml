Description: Wu 是用 Rust 编写的高速原生代码编辑器，源自 Zed 分支，内置对 Claude Code、Codex 和 OpenCode 编码智能体的支持。它不使用 Electron 与 WebView，打开文件即时响应，内存占用低于 VS Code 与 Zed。Wu 无需登录账号，也不发送任何遥测数据。安装程序还会注册 wu 协议，并可选择把 Wu 加入 PATH、关联源代码文件。
