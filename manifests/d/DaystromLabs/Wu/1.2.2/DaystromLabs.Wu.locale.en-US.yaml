ShortDescription: Native code editor and agent workspace.
Description: Wu is a fast native code editor written in Rust, forked from Zed, with built-in coding agents for Claude Code, Codex and OpenCode. It uses no Electron or webview, opens files instantly, and keeps its memory footprint below VS Code and Zed. Wu requires no account and sends no telemetry. The installer also registers the wu protocol and can add Wu to PATH and associate source files.
