ShortDescription: Add two-factor authentication to Remote Desktop and local logons and credentialed UAC elevation prompts.
Description: |-
  Duo Authentication for Windows Logon adds Duo two-factor authentication to these Windows and Windows Server logon scenarios:
  - Local or domain account logins
  - Logins at the local console and/or incoming Remote Desktop (RDP) connections
  - Credentialed User Access Control (UAC) elevation requests (e.g. Right-click + "Run as administrator") in v4.1.0 and later
  Duo's Windows Logon client does not add a secondary authentication prompt to the following logon types:
  - Shift + right-click "Run as different user"
  - PowerShell "Enter-PSSession" or "Invoke-Command" cmdlets
  - Non-interactive logons (i.e. Log on as a Service, Log on as Batch, Scheduled Tasks, drive mappings, etc.)
  - Pre-Logon Access Providers (PLAPs) such as Windows Always On VPN
  - RDP Restricted Admin Mode
ReleaseNotes: |-
  - Encrypts the Duo secret key (SKey) in HKLM\Software\Duo Security\DuoCredProv at the next Duo login or unlock after installation.
    - The encrypted secret key is machine-specific and doesn't work on a different system. If Duo can't decrypt the SKey value, it blocks all Windows logins regardless of the fail mode setting.
  - Improves installation reliability by verifying that core components installed successfully.
  - Improves login performance on shared or multi-user systems with a large number of stored user profiles. Previously, Duo checked the trusted session status of every stored profile, which could delay login.
  - Ends "Remember me" trusted sessions when a user changes their password at the Windows login screen, when an administrator renames a user's account, or when an administrator configures the system to use a different Duo application. Existing trusted sessions require one new two-factor authentication after you upgrade to 6.0.1.
  - Removes a legacy, unsupported configuration path that could cause Duo to unexpectedly skip interactive authentication in certain conditions.
  - Improves handling of offline access authentication factor updates so that administrator changes apply more consistently.
  - Applies offline access attempt and lockout limits consistently across all offline login paths.
  - Writes diagnostic logs collected during product upgrades to a protected location and automatically deletes them after the upgrade completes.
  - Corrects an issue that could allow offline access enrollment to complete without the user first completing two-factor authentication.
