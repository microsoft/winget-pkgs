ShortDescription: See what is using the space, and the money, in your Amazon S3, Google Cloud Storage, and Azure Blob Storage buckets.
Description: |-
  CloudDirStat is like WinDirStat for cloud storage. It lists a bucket (or all of them), rebuilds the folder tree from the object names, and shows it as a sortable folder list and a treemap.
  Every folder and file shows its size and an estimated monthly cost. It breaks usage down by storage class, file type, and version, and finds storage that costs money but hides from normal listings: old versions, deleted files that are still billed, and abandoned uploads.
  It only needs read-only listing permissions and never reads or changes your data. Includes the app (CloudDirStat) and a command line (clouddirstat).
