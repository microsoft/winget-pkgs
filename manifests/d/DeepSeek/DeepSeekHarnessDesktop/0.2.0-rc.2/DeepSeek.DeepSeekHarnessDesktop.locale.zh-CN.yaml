ShortDescription: 由 DeepSeek AI 开发的开源智能体框架 DeepSeek Harness 的桌面应用
Description: DeepSeek Harness Nightly 是 DeepSeek Harness（dsh）的桌面应用。dsh 是由 DeepSeek AI 开发的开源智能体框架，构建于「一切皆插件」的架构之上。应用将 dsh 运行时打包进 Electron 桌面外壳，并在本地提供 dsh Web UI，智能体可以在其中操作文件、终端、浏览器、模型和插件。Nightly 渠道提供快速迭代的开发者预览版本，可能包含破坏兼容性的变更。
