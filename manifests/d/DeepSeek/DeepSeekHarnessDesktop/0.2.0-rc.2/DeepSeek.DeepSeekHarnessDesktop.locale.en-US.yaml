ShortDescription: Desktop application for DeepSeek Harness, an open-source agent harness
Description: DeepSeek Harness is the desktop application for DeepSeek Harness (dsh), an open-source agent harness developed by DeepSeek AI. It bundles the dsh runtime in an Electron desktop shell and hosts the dsh Web UI locally, so agents can work with files, terminals, browsers, models, and plugins through an everything-is-a-plugin architecture.
