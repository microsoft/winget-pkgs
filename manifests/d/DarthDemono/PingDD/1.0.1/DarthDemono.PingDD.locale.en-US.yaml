ShortDescription: Command-line tool that checks whether a TCP port on a remote server is open and how fast it answers.
Description: |
  PingDD is a ping tool for TCP port checking. Instead of ICMP, it connects to a specific TCP port on a host and reports whether the port is reachable and how long the connection took, so network administrators and enthusiasts can test the availability and responsiveness of a service on a remote server. It is a revival of Paping. Usage is `pingdd <hostname> -p <port> -c <count> -t <timeout>`: the port is required, the count defaults to infinite and the timeout is in milliseconds.
