ShortDescription: Network reachability and diagnostics tool with TCP, UDP and ICMP checks, latency statistics and a HEALTHY, DEGRADED or DOWN verdict.
Description: |
  PingDD is a cross-platform network reachability and diagnostics tool written in C. Where classic ping only answers whether a host replies over ICMP, PingDD checks whether the service port is actually open over TCP, UDP or ICMP, measures connection latency to microsecond precision, and falls through IPv4 and IPv6 addresses automatically. It began as a TCP ping, which is where the name comes from.

  Features: many hosts, ports (lists and ranges) and protocols probed at once, sequentially or concurrently; summary statistics (min, max, average, standard deviation, p50, p95 and p99); live network-quality diagnostics (downtime, packet loss, jitter, latency spikes, a bufferbloat estimate and DNS timing) reduced to a one-word verdict of HEALTHY, DEGRADED or DOWN; operator modes for continuous availability monitoring, load testing and a resilience sweep; binding probes to a chosen network interface or source address; and output as colored text, JSON or CSV.
