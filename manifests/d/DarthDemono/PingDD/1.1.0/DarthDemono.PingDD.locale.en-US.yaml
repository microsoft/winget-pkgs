ShortDescription: Cross-platform command-line tool that checks whether a TCP port is open, times the connection and can log results to CSV.
Description: |
  PingDD is a cross-platform ping tool written in C for TCP port checking. Instead of ICMP, it connects to a specific TCP port on a host and reports whether the port is reachable and how long the connection took, so network administrators and enthusiasts can test the availability and responsiveness of a service on a remote server. Options: the port (required), a timeout in milliseconds (default 1000), a number of checks (default infinite), a delay between checks (default 50 ms), colored output that can be turned off, and CSV output for keeping the results.
