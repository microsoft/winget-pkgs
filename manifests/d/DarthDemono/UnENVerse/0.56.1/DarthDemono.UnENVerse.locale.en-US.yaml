ShortDescription: Local-first encrypted secrets manager
Description: |
  UnENVerse keeps API keys, passwords, certificates, SSH keys, connection strings and authenticator seeds in a single SQLCipher database encrypted with a key derived from your master password by Argon2id. It renders them into .env files, Docker Compose, WireGuard, nginx, Kubernetes secrets, Terraform tfvars and more, and includes a built-in TOTP authenticator. This package is the desktop app.
