ShortDescription: Voice dictation for Windows - press a shortcut, speak, and your words are typed where your cursor is.
Description: DictoKey types what you say into any text field on Windows. Press Ctrl+Alt+Space, speak, and the text appears where your cursor is, with punctuation and capitals added for you. It supports 51 languages, real-time translation and AI rewriting, a personal dictionary and a local history. Speech recognition runs in the cloud, so an internet connection is required. Free plan with a weekly word limit; Premium removes the limit (7-day free trial).
