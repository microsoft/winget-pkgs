ShortDescription: Dictée vocale pour Windows - un raccourci, vous parlez, et vos mots s'écrivent là où est votre curseur.
Description: DictoKey écrit ce que vous dites dans n'importe quel champ de texte sous Windows. Appuyez sur Ctrl+Alt+Espace, parlez, et le texte apparaît là où est votre curseur, avec la ponctuation et les majuscules. 51 langues, traduction en temps réel et réécriture par IA, dictionnaire personnel et historique local. La reconnaissance vocale fonctionne dans le cloud (connexion internet nécessaire). Formule gratuite avec une limite de mots par semaine ; Premium retire la limite (essai gratuit de 7 jours).
