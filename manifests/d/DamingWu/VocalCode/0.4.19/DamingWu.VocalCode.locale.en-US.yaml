ShortDescription: Push-to-talk voice input for coding with AI — hold a key, talk, release, and the text lands in any app.
Description: |-
  VocalCode is a push-to-talk dictation utility for people who write code by talking to an AI coding
  agent. Hold a bound key or mouse button, speak, release, and the transcribed text is typed into
  whatever field has focus — an editor, a terminal, a browser, any application. A second binding can
  send it on.

  Speech recognition runs entirely on your own machine, in roughly 150 ms on CPU with no GPU
  required. No audio is uploaded, no account is needed, and it works with no network connection.

  Before anything is typed, three passes clean the text: acronyms are collapsed ("m c p" becomes
  MCP), punctuation is restored by a separate model, and your own replacement dictionary corrects
  the project names and jargon no general model has heard of.

  English and 24 other European languages are handled by Parakeet TDT v3; Chinese by Paraformer. You
  pick one on first run and the matching model downloads then, so the installer stays small.

  One-time purchase, no subscription, with a 30-day trial.
