ShortDescription: Profiles for Claude Code on Windows, with a tray app.
Description: |-
  clauderoo is a command-line tool and Windows tray app for developers who use Claude Code with more than one account.
  Each account gets its own profile with its own login, so you can run several side by side, while plugins, skills, settings and MCP servers are shared from your main setup.
  Profiles can sign in with a Claude login, Google Vertex AI, an Anthropic API key or a Claude token. clauderoo also shows usage limits and can switch the default profile automatically.
