ShortDescription: VoiceWink is dictation for Windows 11. Press a hotkey and talk, and the text appears at your cursor in any app. It can rewrite your words to suit that app, like an email in Outlook. The AI runs on your own PC, and you pay once instead of subscribing.
Description: |-
  VoiceWink is a dictation and speech-to-text app for Windows 11. You press a hotkey, say what you want to write, and the text appears at your cursor, in whatever app you are in.

  It can also rewrite what you said to suit that app, so it comes out as a proper email in Outlook or a clean prompt for a coding agent such as Claude Code. The speech recognition and the rewriting both run on your own PC with built-in models, so they work offline once the models are downloaded. A paid license checks in online at least once every 30 days. The rewriting needs 16 GB of memory, while dictation on its own uses up to about 2.5 GB. A cloud key or your own AI server can do the rewriting instead, on a PC with less memory or if you prefer that.

  You pay once, with no subscription. The trial is free and does not ask for your email, and the source is open under GPL v3.
