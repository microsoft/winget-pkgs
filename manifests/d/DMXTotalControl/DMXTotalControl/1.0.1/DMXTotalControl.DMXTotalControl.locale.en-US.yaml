ShortDescription: Free and open-source DMX lighting control for Windows, made for live shows.
Description: |-
  DMX Total Control is a free and open-source program to control DMX lighting from a Windows computer. It is made for live shows: you fire scenes by groups with one button, program fast with palettes, FX and a command line, run cuelists with GO on the playbacks and build your own show screen, which also opens on a phone or tablet.
  It works with USB DMX interfaces, Art-Net and sACN, MIDI controllers such as the Akai APC mini and thousands of fixtures. It is in six languages, with its full manual, and needs no licence, USB key or account.
