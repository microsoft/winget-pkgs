ReleaseNotes: |-
  Fixes for the SHOW faders that play scenes, both the intensity and the speed ones, also from a MIDI controller such as the APC mini:
  - Several faders with scenes of the same exclusive group can be raised at once: each one adds its scene to the group.
  - A raised fader only stops when you lower it all the way; other scenes, its own button, Release groups, Stop all, a playback or the editors no longer stop it.
  Also:
  - A GitHub template to report whether an interface, a controller or a fixture works with the program.
  - The manual is up to date in all six languages.
ReleaseNotesUrl: https://github.com/joseramos1999/DMXTotalControl/releases/tag/v1.0.1
