ShortDescription: Control de iluminación DMX libre y gratuito para Windows, pensado para el directo.
Description: |-
  DMX Total Control es un programa libre y gratuito para controlar iluminación DMX desde un ordenador con Windows. Está pensado para el directo: lanzas escenas por grupos con un botón, programas rápido con paletas, FX y una línea de comandos, operas cuelists con GO en los playbacks y montas tu propia pantalla de show, que también se abre en el móvil o la tablet.
  Funciona con interfaces DMX USB, Art-Net y sACN, controladoras MIDI como la Akai APC mini y miles de fixtures. Está en seis idiomas, con su manual completo, y no pide licencias, llaves USB ni cuenta.
Tags:
- art-net
