- iluminacion
- control-de-iluminacion
- midi
- sacn
ReleaseNotes: |-
  Arreglos de los faders del SHOW que lanzan escenas, los de intensidad y los de velocidad, también desde una controladora MIDI como la APC mini:
  - Varios faders con escenas del mismo grupo exclusivo se pueden subir a la vez: cada uno suma su escena a su grupo.
  - Un fader subido solo se para al bajarlo del todo; ya no lo paran otras escenas, su propio botón, «Liberar grupos», «Parar todo», un playback ni los editores.
  Además:
  - Plantilla en GitHub para contar si una interfaz, una controladora o un fixture funciona con el programa.
  - Manual al día en los seis idiomas.
ReleaseNotesUrl: https://github.com/joseramos1999/DMXTotalControl/releases/tag/v1.0.1
