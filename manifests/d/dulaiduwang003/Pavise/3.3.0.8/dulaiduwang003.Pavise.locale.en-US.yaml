ReleaseNotes: |-
  使用前请了解
  软件绝大部分功能仅在对局中生效，退局后自动恢复；不支持退局恢复的功能均已单独标注。遇到问题时，建议先排查：系统最近是否更新过 Windows 或显卡等驱动；关闭 Pavise 后问题是否依旧，可能是游戏本身的问题。禁止与其他会修改进程优先级或 CPU 绑核的调度软件同时使用，两边会互相覆盖设置。
  - 渲染亲和性支持自动/手动选核与整核隔离，联动游戏核心范围；调整下局生效，关闭立即撤回。
  - 减少线程采样、核心隔离和后台治理开销，移除自动后台节能显卡登记。
  - 新增动作/诊断日志，直观查看压制、落核、清核及恢复结果，支持分别导出。
  - 优化鸣潮等游戏识别，减少内置网页被误认作游戏本体。
  - 改善笔记本厂商电源兼容，连续冲突时停止切换并恢复原计划。
  - 新增安全软件兼容提示，启动时检查一次，支持“不再显示”。
  - 修复退局恢复、电源状态误报，减少重复日志和无效警告。
  源码与校验：对应源码 · SHA256SUMS.txt
