ShortDescription: Document database with REST, GraphQL, SQL, replication and an admin UI, in one program.
Description: |-
  HexDB is a document database in a single program: JSON documents served over REST, GraphQL and read-only SQL, with an admin UI, AES-256 encryption at rest, replication with automatic failover, streams, functions and plugins.
  The installer adds the server (hexdb_api), the CLI (hexdb), the admin UI and the 64-bit ODBC driver. Run `hexdb start`, then open http://127.0.0.1:7700/ui/.
