ShortDescription: Fast screen capture, recording, and image and video editing for Windows and Linux
Description: Jiffshot is a native screen capture tool, screen recorder, and non-destructive image and video editor for Windows 10 and Windows 11. Press Print Screen to capture a region, window, or full screen, annotate and export the result, and save editable .jsd documents. It also records MP4 video with pause and resume, microphone audio and webcam overlay, and offers trimming, GIF export, and OCR of captured text.
