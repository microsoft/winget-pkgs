ShortDescription: 面向 Windows 和 Linux 的快速屏幕截图、屏幕录制与图像视频编辑工具
Description: Jiffshot 是一款原生的屏幕截图、屏幕录制以及无损图像与视频编辑器，支持 Windows 10 和 Windows 11。按 Print Screen 键即可捕获区域、窗口或整个屏幕，为截图添加标注并导出，或保存为可编辑的 .jsd 文档。它还支持可暂停与继续的 MP4 屏幕录制、麦克风音频和摄像头叠加，并提供裁剪、GIF 导出以及对捕获文字进行 OCR 识别。
