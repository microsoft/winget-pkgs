ReleaseNotes: "### Features\n\n• _dgw_：keep agent tunnel data in a shared gateway.db ([#2039](https://github.com/Devolutions/devolutions-gateway/issues/2039)) ([e8ac5ef235](https://github.com/Devolutions/devolutions-gateway/commit/e8ac5ef235cea5f748043ae49baf636cd4bd2e62)) ([DGW-464](https://devolutions.atlassian.net/browse/DGW-464))\n\n  Agent Tunnel data moves from `agent_tunnel.db` to `gateway.db` in the Gateway data directory.\n  Gateway creates `gateway.db` on every start, even when Agent Tunnel is disabled.\n  On the first start after upgrading, Gateway imports and removes an existing `agent_tunnel.db`, so enrolled agents keep working without enrolling again.\n  Downgrading afterwards means agents have to enroll again, because earlier versions only read `agent_tunnel.db`.\n\n• _dgw_：honor an explicit agent on KDC tokens ([#2068](https://github.com/Devolutions/devolutions-gateway/issues/2068)) ([458a0db6e4](https://github.com/Devolutions/devolutions-gateway/commit/458a0db6e4b8ac945ce75d3176089aa30846208b)) ([DGW-453](https://devolutions.atlassian.net/browse/DGW-453))\n\n  KDC tokens can name an explicit agent with `jet_agent_id`, as association and JMUX tokens already do.\n  `/jet/KdcProxy` then sends every Kerberos message through that agent or fails, without falling back to a direct connection or another agent; tokens without the claim keep working as before.\n  Previously, the client's Kerberos traffic for an RDP session pinned to an agent could reach the KDC directly from Gateway or through a different agent.\n  Through an agent, the KDC must use `tcp://`：a `udp://` KDC with an explicit agent is rejected.\n\n### Bug Fixes\n\n• _dgw,agent_：fix Windows service crash at startup ([#2069](https://github.com/Devolutions/devolutions-gateway/issues/2069)) ([20c0119493](https://github.com/Devolutions/devolutions-gateway/commit/20c011949311b87c3422656e4472291b409ee9a1)) ([DGW-460](https://devolutions.atlassian.net/browse/DGW-460))\n\n  The Gateway Windows service could crash at startup with an access violation in `ntdll.dll` and never start, as seen after updating to 2026.3.2 on Windows Server 2016.\n  The Agent Windows service could crash the same way and is fixed too.\n  When the service fails to start, for example because of an invalid configuration, Gateway and Agent now exit with a nonzero status, so service managers such as systemd can detect the failure and restart them."
