ReleaseNotes: |-
  DSH Desktop v0.12.0 — 工作台体验升级，Office 模板工作流与桌面更新更完善
  更新内容
  - 工作台布局：新增默认与紧凑两种顶部布局，适配不同的窗口与侧栏空间；调整拖拽区域和标题可用宽度，并在工作台会话中隐藏不适用的 Word、Excel、PPT 快捷入口。
  - 工作台市场与导航：改进市场卡片和侧栏交互，展示已安装工作台的来源，并识别旧版市场安装；整理重复卡片和已迁移的工作台标识，减少列表重复或安装项消失的情况。
  - 工作台目录与更新：优先显示本地缓存目录，再在后台刷新市场数据；更新按版本判断，并仅针对检测到的风险请求确认。市场请求期间重试操作会保持忙碌状态，下载错误提供本地化提示。
  - 工作台安装与故障恢复：市场替换前核实已安装来源，并在服务端执行替换确认；工作台加载失败时会指出出错项并提供恢复指引。不可卸载状态的原因也可通过键盘聚焦查看，已退役收藏项可以移除。
  - 工作台顶部与会话交互：完善紧凑标题栏在普通侧栏分栏中的适配，并为展开的侧栏保留工作台拖拽空间；优化卡片在更新和错误状态下的尺寸稳定性。
  - Office 文档与表格工作流：统一 PPT、Word、Excel 的模板选择、预览和案例体验；改进模板缩略图、打印预览和页面展示，Word 预览支持双页展开，Excel 示例以列表呈现并可预览成对页面。
  - Office 案例与模板：增加会议纪要等精选案例，并提供多种文档、表格示例与配套模板；工作报告、写作案例和模板预览流程也经过整理。
  - 个人 PPT 模板：改进模板导入、转换和复用流程，展示可复用样式与示例预览，并保留原始视图；导入预览可随页面生成逐步展示，进度反馈更清晰，完成后可先检查预览再继续。
  - PPT 导入与资源管理：改进文本框继承、图表和图层布局、图片裁剪及媒体处理；对不支持的模板对象提供降级处理。模板上传采用流式处理并限制导入内存，导入过程中可取消任务并释放资源。
  - 桌面通知：新增桌面原生通知与应用图标的桥接，并支持通知触发窗口聚焦。
  - 安全模式配置：安全模式可继承普通 Profile 的模型配置，减少重复设置。
  问题修复
  - Windows 插件市场操作：修复打开添加插件界面或安装市场插件时弹出控制台窗口的问题；注册表查询和安装命令调整为避免经由 cmd.exe 启动。
  - Windows Office 文档处理：修复导入苹方字体 PPT 时的字体及字重解析；修复 Word 模板准备中的沙箱启动、空退出和超时问题，并修正中文 JSON 输出的 UTF-8 编码处理。
  - Windows Office CLI：修复命令成功退出时被异常处理的问题，并调整无控制台环境下 Word 工作进程的启动方式。
  - PPT 模板兼容性：改善导入模板的原生布局保留，以及文本框样式继承和图表布局处理。
  - 工作台市场稳定性：延长市场目录请求等待时间，并改善已安装项导航、缓存目录展示和网络下载失败时的反馈。
  - 桌面更新交互：区分后台更新通知与手动检查更新对话框；保留可操作的下载失败提示，并使手动检查遵循更新策略接口。
  - 版本回退选择：调整更新与关于界面的交互，并限制可选的回退版本。
  性能与优化
  - Office 模板准备：为 Office 运行时下载和模板渲染产物增加构建缓存，并提取可在多平台构建间共享的模板与 PPT 运行时资源，减少重复下载和渲染。
  - Office 转换可靠性：LibreOffice 模板准备遇到超时可重试；同时缩短发布流程中单次渲染的等待上限，避免偶发卡死长期阻塞构建。
  - PPT 导入资源占用：拆分并优化模板转换、几何处理、媒体导入和预览流程，控制大文件导入时的内存使用。
  - 发布流水线：减少重复执行的测试工作，并优化 DOCX、PPT 集成测试中的重复初始化和渲染；发布测试仍保留常规单测与核心契约校验。
  - 签名与公证：调整 macOS 公证上传传输，并为 Apple 公证票据装订增加重试，以应对票据分发延迟。
  - Office 字体发布验证：增加 Windows PPT 字体布局专项验证流程。
  升级说明
  - 工作台布局：工作台现支持默认与紧凑顶部布局；如需与原有界面保持一致，可在工作台布局设置中选择适合的模式。
  - 市场工作台更新：对于已安装的旧版市场工作台，应用会识别其来源并按版本检查更新；替换现有安装时，可能需要根据检测到的风险确认操作。
  说明
  - 产品介绍：统一多语言 README 中的 Dataelem 产品标识，并补充中文介绍中的 DSH Client 名称。
  - 工作台文档：更新中英文快速入门与开发指南，说明布局选择、首次使用检查及应用内 Agent 的重启要求。
