ReleaseNotes: |-
  中文 | English
  本次版本重点完善启动故障恢复、应用回滚与工作台安装流程，并优化启动体验、稳定性和跨平台发布链路。
  新增功能
  - 故障恢复与维修 Agent：提供由用户主动发起的启动维修流程，展示维修计划、错误详情和回滚位置；已知恢复操作与 Agent 维修分开呈现，成功修复后可返回正常导航。
  - 应用回滚：新增独立的应用回滚页面与流程，支持在启动或更新故障后恢复到可用版本。
  - 企业入口：新增企业网站入口，方便用户访问企业服务。
  - 本地工作台安装：支持无 GitHub 身份的本地工作台身份、本地归档安装，以及由 Agent 通过插件管理器安装本地工作台。
  体验优化
  - 启动体验：启动页改用鲸鱼动画；启动遮罩覆盖页面内容出现前的空白帧，并支持自定义协议启动页的失败展示与恢复。Harness 页面准备与后端启动并行进行，页面重载时也会刷新启动注入内容。
  - 安全模式与恢复页面：简化安全模式状态卡操作，改进错误详情、操作标签与维修入口提示，并为 Windows 恢复页面预留标题栏空间。
  - 工作台：根据包清单区分重载与重启需求，本地安装后提示重启 Harness；优化制作引导和完成后的使用说明，并使长菜单可在窗口内滚动。
  - 界面语言：菜单、“关于”和更新弹窗跟随 Desktop 语言设置；仅在用户未选择语言时回退到系统语言，并为 macOS 隐藏与退出菜单提供中英文标题。
  - 安装器视觉：更新 macOS DMG 安装背景与布局。
  问题修复
  - 渲染进程恢复：限制渲染故障恢复次数，恢复导航失败时退回重启方案；保留诊断信息并处理旧导航退出，避免恢复页面切换被误判为渲染进程崩溃。
  - 启动失败处理：修复插件加载失败时停留在 Harness 错误页、无错误详情时启动遮罩消失，以及客户端 Shell 检查导致可选工作台故障被放大的问题。
  - GPU 与内存稳定性：完善 GPU 故障识别与有界恢复，明确呈现软件渲染恢复耗尽状态；处理内存耗尽故障，并恢复上游内存默认配置。
  - 插件安装与依赖解析：修复通配符导出和无扩展名类型声明下的包解析问题；隔离每代安装暂存目录、补齐私有依赖，并从当前宿主解析缺失的 Harness peer。
  - MCP 启动：限制连接及初始发现耗时，并在就绪前处理完启动通知同步。
  - 工作台安装：统一经由插件管理器处理工作台生命周期与本地归档安装，并在切换插件时保留自定义补丁配置。
  - 平台兼容性：修复 Windows 发布归档与 Unicode 路径处理、测试弹窗 fixture 编码，以及 macOS node-pty ASAR 辅助程序映射的幂等性；补充 PingFang 字体变体到 CJK 字体回退的兼容处理。
  其他变更
  - Harness 与插件补丁：适配 Harness 0.2.1-rc.3，并同步更新相关插件补丁与客户端兼容调整。
  - 更新与发布流程：支持手动查询更新和双语更新说明；发布前增加飞书审核门禁，并汇总已签名测试通知。网络超时后可继续 Apple 公证流程。
  - 构建与 CI：优化跨平台构建准备和缓存复用，校验并流式处理 Windows 发布归档；将共享演示文稿准备移至 Ubuntu，并完善 macOS 原生辅助程序布局及 Windows/macOS 外部 Electron 启动验证。
  - 依赖与文档：更新默认 dshmarket 版本，完善工作台开发指南、快速入门及稳定性、安装器和发布流程文档。

  This release strengthens startup recovery, application rollback, and workbench installation while improving startup experience, stability, and cross-platform delivery.
  Features
  - Recovery & Repair Agent: Adds a user-initiated startup repair flow with a clear repair plan, error details, and rollback placement. Known recovery actions remain separate from Agent repair, and successful repairs restore normal navigation.
  - Application Rollback: Adds a dedicated rollback page and flow to recover a usable application version after startup or update failures.
  - Enterprise Entries: Adds website entries for enterprise users.
  - Local Workbench Installation: Supports local workbench identities without GitHub, installation from local archives, and Agent-initiated local installs through Plugin Manager.
  Improvements
  - Startup Experience: Refreshes the splash screen with a whale animation. The startup cover hides blank frames and supports recovery on custom-protocol startup failures. Harness page preparation now runs alongside backend startup, and boot injections refresh on page reload.
  - Safe Mode & Recovery Pages: Simplifies Safe Mode status actions, clarifies error details and repair entry points, and reserves Windows caption space on recovery pages.
  - Workbenches: Selects reload or restart requirements from package manifests and prompts for a Harness restart after local installs. Improves creation guidance and final usage instructions, and keeps long menus scrollable within the window.
  - Localization: Localizes menus, About, and update dialogs to the Desktop language. The system language is used only when the user has not chosen one; macOS Hide and Quit menu titles are localized explicitly.
  - Installer Design: Refreshes the macOS DMG background and layout.
  Bug Fixes
  - Renderer Recovery: Bounds renderer recovery attempts and falls back to restart when navigation recovery fails. Preserves diagnostics, drains stopped navigation before replacement loads, and avoids mistaking recovery navigation for a renderer crash.
  - Startup Failures: Fixes plugin failures getting stuck on the Harness error page, startup covers disappearing when error details are unavailable, and optional workbench failures being escalated by shell audits.
  - GPU & Memory Stability: Improves GPU failure classification and bounded recovery, surfaces exhausted software-rendering recovery, contains out-of-memory failures, and restores upstream memory defaults.
  - Plugin Installation & Resolution: Fixes package resolution with wildcard exports and extensionless type declarations, isolates generation staging, supplies private peers, and resolves missing Harness peers from the current host.
  - MCP Startup: Bounds connection and initial discovery time, and drains startup notification syncs before readiness.
  - Workbench Installation: Routes workbench lifecycle and local archives through Plugin Manager, and preserves custom patch rows when switching plugins.
  - Platform Compatibility: Fixes Windows release archive and Unicode path handling, UTF-8 Windows popup fixtures, and idempotent macOS node-pty ASAR helper mapping. Adds fallback handling for PingFang font variants.
  Chores
  - Harness & Plugin Patches: Adapts the desktop to Harness 0.2.1-rc.3 and updates related plugin patches and client compatibility.
  - Updates & Releases: Adds manual update queries and bilingual update notes, gates publication on Feishu review, and summarizes signed test notifications. Apple notarization can resume after network timeouts.
  - Build & CI: Improves cross-platform build preparation and cache reuse, streams and validates Windows release archives, moves shared presentation preparation to Ubuntu, and adds native macOS helper-layout and external Electron launch checks for Windows and macOS.
  - Dependencies & Documentation: Updates the default dshmarket version and expands workbench guides and documentation for stability, installers, and release procedures.
