ShortDescription: Local-first Windows app that automatically organizes your Downloads folder by file type, rules, and source website.
Description: Download Sorter watches your Downloads folder (and optional extra folders) and moves finished downloads into subfolders by file type, source website, custom rules, or a visual multi-tier Folder Architecture. Every move is recorded locally in SQLite so it can be undone anytime, duplicates are safely quarantined without deleting originals, and everything runs offline on your PC.
