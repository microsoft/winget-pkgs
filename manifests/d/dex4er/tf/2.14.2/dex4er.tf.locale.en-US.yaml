ReleaseNotes: |-
  ## Changes

  - Homebrew: the cask no longer uses the deprecated `postflight` block, so `brew` stops warning about it on every command (#154, #160).
  - Built with Go 1.27.4 instead of 1.26.5, with `golang.org/x/term` 0.48.0 and `golang.org/x/sys` 0.50.0 (#145, #150).
  - Building from source with `go install` needs Go 1.26 or newer.

  ## Security

  The new Go toolchain fixes 22 vulnerabilities of the Go standard library that scanners report for the binaries of v2.14.1 (2 critical, 15 high, 5 medium), among them:

  - [GO-2026-6604](https://pkg.go.dev/vuln/GO-2026-6604) (critical): `os.Root.Mkdir` and `MkdirAll` can follow a junction out of the root on Windows.
  - [GO-2026-6612](https://pkg.go.dev/vuln/GO-2026-6612) (critical): a client can make the HTTP/2 server exceed its connection-level flow control limit.

  `govulncheck` finds none of them reachable from the code of tf, so the update mostly clears them from the scans of the released binaries and their SBOMs.

  **Full Changelog**: https://github.com/dex4er/tf/compare/v2.14.1...v2.14.2
ReleaseNotesUrl: https://github.com/dex4er/tf/releases/tag/v2.14.2
