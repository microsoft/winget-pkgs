ShortDescription: Less verbose, more shell-friendly and LLM-friendly Terraform and OpenTofu
Description: |-
  The original Terraform and OpenTofu are abusively oververbosed. The tf wrapper runs either of them and makes it more CLI-friendly:
  - removes unnecessary output
  - adds own colored progress indicator
  - provides an extra compact mode
  - allows to use of multiple arguments when original command doesn't support it
  - adds automatically quotes for indexed resources (xargs friendly)
  - generates a log file when TF_OUTPUT_PATH environment variable is used
  tf is optimized for LLM coding agents too: its output takes a fraction of the tokens of the output of Terraform or OpenTofu.
