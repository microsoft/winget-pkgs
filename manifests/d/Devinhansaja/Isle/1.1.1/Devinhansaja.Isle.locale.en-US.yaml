ShortDescription: A Dynamic Island-style notch for Windows.
Description: |-
  Isle adds an animated notch to the top of your main screen. It shows the music that is playing,
  incoming and ongoing calls, notifications, a volume / brightness display (one bar per monitor),
  a focus timer, 20-20-20 eye breaks, battery rings for your earbuds, controller and phone,
  weather, clipboard history and video downloads. It installs for the current user, starts with
  Windows and updates itself from the GitHub releases.
