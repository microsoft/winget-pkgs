ReleaseNotes: |-
  What's Changed
  - Show mouse actions (Left/Middle/Right click, side buttons XButton1/XButton2, and Mouse Wheel Up/Down) as graphical mouse keycap icons in the OSD keystroke popup stream (#62)
  - Support modifier + mouse combinations (Ctrl/Alt/Shift/Win + click or scroll) and consecutive repeat counts (x N)
  - Add independent "Show mouse buttons in OSD" and "Show mouse wheel in OSD" checkboxes under the Mouse tab in Preferences
