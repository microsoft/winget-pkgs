ReleaseNotes: |-
  - Added Traditional Chinese (zh-TW) and Simplified Chinese (zh-CN) UI localization.
  - Added 2D multi-monitor selector, mixed-DPI positioning, and compact overlay window.
  - Added OBS/XSplit window capture mode, live preview in Preferences, and custom font family/corner radius/padding settings.
  - Added per-category key visibility filters, ignored keys list, configurable silent/pause hotkeys, and elevated app detection.
  - Retired Squirrel.Windows in favor of Inno Setup installer, portable zip, and opt-in GitHub update check.
