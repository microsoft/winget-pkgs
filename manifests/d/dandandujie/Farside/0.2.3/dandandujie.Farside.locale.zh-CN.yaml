ReleaseNotes: |-
  本版本将唯一 Runtime 从 Kimi Code 0.29.2 升级到 0.31.1，保持现有桌面交互、会话数据和服务生命周期兼容，建议所有用户升级。
  升级亮点
  - 跟进 Kimi Code 0.30–0.31.1 的自定义 Agent、插件 system prompt、secondary model 和非阻塞 TaskOutput 等 Runtime 能力。
  - 保持现有 /api/v1 REST、/api/v1/ws、实例发现和 shutdown 生命周期兼容，无需迁移本地配置或历史会话。
  - 修复空 Runtime 补丁队列被误判为冲突的问题；上游已经吸收的历史补丁不再重复应用。
  - 更新存在安全公告的间接依赖，依赖审计结果为 0 漏洞。
  Runtime 与兼容性
  - 唯一 current Runtime：Kimi Code 0.31.1。
  - 固定上游 revision 6b56c11697771fe596099b38bafae539820309a4。
  - 锁定 Windows、macOS、Linux 的 x64/arm64 六平台官方产物及 SHA-256。
  - 已审查 REST、WebSocket、wire、session、profile、tool、auth、配置、UI/IPC、持久化与构建变化，未发现需要用户迁移的破坏性变更。
