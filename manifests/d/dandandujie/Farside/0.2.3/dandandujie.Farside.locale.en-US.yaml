PackageIdentifier: dandandujie.Farside
PackageVersion: 0.2.3
PackageLocale: en-US
ShortDescription: A desktop agent client for Kimi Code.
Description: 'Farside is a desktop agent client for Kimi Code, built with Electron, React, and TypeScript. Farside does not present coding tasks as ordinary chat: the moon phase represents the agent state (new moon = idle, waxing crescent = thinking, waxing gibbous = executing, full moon = awaiting approval, waning crescent = wrapping up), and sessions are orbital timelines of transmissions (thinking), instruments (tools), satellites (subagents), and ground (user instructions). It supports project and session management (pin, archive, fork, export), multimodal and file context, tool approval and structured questions, a ⌘K command palette aligned with the Kimi Code CLI, a real terminal, live file tree with Git status and diffs, a built-in preview pane (Markdown / HTML / SVG / images), multiple account options (Kimi OAuth, the official Moonshot API, and OpenAI-format third-party Kimi services), membership usage display, and MCP, Skills, and Plugins management. The default interface is Chinese with a dark theme; English and light mode are one click away.'
