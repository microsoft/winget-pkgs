ShortDescription: 面向 Kimi Code 的桌面 Agent 客户端。
Description: Farside（月背）是面向 Kimi Code 的桌面 Agent 客户端，基于 Electron、React 与 TypeScript 构建。Farside 不把编程任务表现成普通聊天：月相表示 Agent 状态（朔=空闲、上弦=思考、盈凸=执行、满月=等待批准、残月=收尾），会话是一条轨道时间线（思考 / 工具 / 子代理 / 用户指令）。支持项目与会话管理（置顶、归档、分叉与导出）、多模态与文件上下文、工具审批与结构化提问、⌘K 命令面板、真实终端、实时文件树与 Git 状态、内置预览舱（Markdown / HTML / SVG / 图片）、多种账户接入（Kimi OAuth、Moonshot 官方 API 与 OpenAI 格式的第三方 Kimi 服务）、会员用量展示，以及 MCP、Skills、Plugins 扩展管理；默认中文与暗黑主题，可切换英文或明亮模式。
