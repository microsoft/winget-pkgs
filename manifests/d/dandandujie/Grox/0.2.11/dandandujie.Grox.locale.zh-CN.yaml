ShortDescription: 以 Grok Build 为核心打造的桌面端 Agent。
Description: Grox 是以 xai-org/grok-build 为核心打造的桌面端 Agent，通过 ACP（Agent Client Protocol）连接真实的 Grok Build 运行时，在 Tauri 桌面窗口中提供会话恢复、流式思考、工具调用、代码差异、权限审批、结构化问答和用量统计。支持 Deep Research 后台工作流（可暂停、恢复或停止）、Computer Use（Windows 完整键鼠控制，默认开启）、Browser Use 无头截图、并行侧任务工作台、Worktree / Git 环境摘要、桌面通知、中英文界面与明暗主题，以及多账户接入（Grok OAuth、xAI 官方 API 与 OpenAI 兼容服务），并支持可视化添加、启用和移除 MCP、Skills、Plugins 扩展。
