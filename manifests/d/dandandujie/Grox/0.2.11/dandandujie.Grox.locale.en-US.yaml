PackageIdentifier: dandandujie.Grox
PackageVersion: 0.2.11
PackageLocale: en-US
ShortDescription: A desktop agent built around Grok Build.
Description: Grox is a desktop agent built around xai-org/grok-build. It connects to a real Grok Build runtime through ACP (Agent Client Protocol), providing session resume, streaming reasoning, tool calls, code diffs, permission approval, structured Q&A, and usage statistics in a Tauri desktop window. It features a Deep Research background workflow (pausable, resumable, stoppable), Computer Use with full keyboard and mouse control on Windows (on by default), Browser Use headless screenshots, a parallel side-task workbench, Worktree/Git environment summaries, desktop notifications, a Chinese/English interface with light and dark themes, multi-account access (Grok OAuth, the official xAI API, and OpenAI-compatible services), and visual management of MCP, Skills, and Plugins extensions.
