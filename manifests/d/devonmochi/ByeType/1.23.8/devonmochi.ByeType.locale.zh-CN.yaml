ReleaseNotes: |-
  - 移除两个方向的规则增强开关：语音识别页的「将文本优化规则注入语音规则」与文本优化页的「将语音规则注入文本优化规则」
  - 语音识别只按识别规则、专有词汇和自动学习结果转写，文本优化只按所选输出风格的提示词处理，两边规则不再互相带入
  - 旧配置里的两个相关字段自动忽略，升级后无需手动调整
