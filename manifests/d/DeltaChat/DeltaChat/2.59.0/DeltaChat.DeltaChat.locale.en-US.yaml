ReleaseNotes: |-
  Added
  - React to channel posts (#6638)
  - "Hide Window Menu Bar" setting (Settings → Appearance) (#6544)
  - (experimental) "Team Profiles": you may enable this while creating a new profile (https://github.com/chatmail/core/pull/7694)
  Fixed
  - NixOS: autostart not working: you'll need to toggle the "autostart" off and on again in Delta Chat Advanced settings (#6571)
  - Disable Ctrl+A shortcut (select all text) outside of text inputs (#6570)
  - QR scanner camera select not working
  - Fix incorrect "You removed member X" messages
  - Fix links in messages not being clickable sometimes
  - Minor fixes for the View Group dialog
  - accessibility: say "Muted" instead of "Mute" for chat list items
  - Clicking "Edit Message" sometimes not moving the text cursor to the end of the input
  - style: better message bubble color of messages with a video attachment: have the quote on a normal background color and not black (#6639)
  - More minor fixes
  Miscellaneous Tasks
  - Upgrade Core to 2.59.0
  - Translations update 2026-08 (#6644)
  - Upgrade Electron 42.5.0 to 42.9.0
  Other
  - QR scanner: prefer environment facing
  - style: adjust the spacing in the "Recently used apps" section in the chat header (#6572)
  Downloads
  - https://download.delta.chat/desktop/v2.59.0/
