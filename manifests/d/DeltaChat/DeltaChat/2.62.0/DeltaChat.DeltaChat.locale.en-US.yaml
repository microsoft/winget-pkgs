ReleaseNotes: |-
  Added
  - Adding a relay: show a progress bar and allow to cancel
  - Notifications are now grouped by chat on some platforms
  - Show all reactions in the "Reactions" dialog grouped by emoji ("pills"), including the total count, and update the dialog live
  - More support for Delta Chat links in search (#6752)
  - "Load Remote Images" option is now also available in the "View" menu, for better screen reader accessibility (#6745)
  - New languages: Hebrew and Belarusian (#6761)
  Changed
  - Relays: the primary relay can now be removed, and removing a relay deletes it immediately
  - Relays: removed the "default relay" setting (#6747)
  - Email addresses are no longer shown for your profiles in the profile list and settings (#6762)
  - Contacts are no longer shown as "verified" (see FAQ) (#6753)
  - Onboarding: show a generic privacy policy link instead of a relay-specific one (#6746)
  - Better-looking toast widget (#6714, #6728, [#6746](https://gith ub.com/deltachat/deltachat-desktop/issues/6746))
  - Notifications no longer repeat the app name
  Fixed
  - Camera not working on PipeWire-based Linux distributions (#6604)
  - Tray menu: bring back a hidden window, and enable "Minimize" when appropriate (#6737, #6741)
  - Portable mode (Windows): store the Electron cache in the portable folder and don't register as protocol handler (#6742)
  - Linux: set correct WMClass (#6559)
  - macOS: hide the "Hide Window Menu Bar" setting, as it has no effect there (#6670)
  - Links containing scheme-like words were not linkified correctly (#6698)
  - Message multiselect being reset when clicking a button
  - Contents of "Show Full Message..." not being focusable
  - Focus not returning to the previous element after a dialog closes
  - Dialogs staying open after switching profiles (#6727)
  - Audio player overflowing on small screens (#6603)
  - Show a hint when trying to edit a group you are no longer a member of (#6744)
  - Catch possible errors when loading apps (webxdc) with broken or oversized icons (#6723, #6724)
  - Faster profile switching and faster "Ctrl + Up" (edit last message) in long chats
  Removed
  - Setting to enable developer tools for apps (WebXDC): instead we will show a dialog prompt every time you try to open developer tools (#6654)
  - Undocumented drag-file-out WebXDC API (#6726)
  - Migration of profiles from very old Delta Chat versions (#6755)
  Miscellaneous Tasks
  - Upgrade Electron to 43 (#6718)
  - Upgrade core to 2.62.0 (#6731), notable changes:
    - Onboarding adds multiple relays
    - Contacts are informed automatically when you change your relays
    - Messages are fetched from all relays in the background, and sent via the fastest relay on first setup
    - Better image quality when sending images
    - No more "member added" messages in channels
    - No notifications for reactions or missed calls from blocked contacts
    - Email addresses are no longer stored in location files and export filenames
  Download
  - https://download.delta.chat/desktop/v2.62.0/
