ReleaseNotes: |-
  - AI Assistant:
      - Added Ollama support for running local AI models
      - Selecting an AI profile in chat now saves it as the user's default for new conversations
      - Canceled responses now retain reported token usage and show N/A when usage is unavailable instead of zero counts
      - Fixed AI Chat remaining blank or waiting indefinitely when chat history initialization fails
      - Fixed conversation timestamps shifting after restarting DBeaver
      - Clearing Temperature now uses the AI provider's server default instead of sending a numeric value
      - Fixed AI Chat remaining on "Waiting for response..." after a tool or follow-up request fails
      - Generated AI metadata now filters out objects and relationships outside the configured context scope
      - Added per-connection AI metadata consent and scope settings
      - Added a connection picker to AI Chat, including disconnected connections without chat history
  - SQL Editor:
      - Added syntax analysis, autocomplete, and symbol information for supported procedure, function, trigger, and anonymous-block definitions
      - Added explicit panel placement choices to tab context menus and the Panels menu
      - Fixed empty detached result tabs when a statement returns multiple result sets (thanks to @fizzbeom)
      - Restored foreign-key join conditions and column suggestions after an empty JOIN ON clause followed by WHERE, GROUP BY, or another JOIN
      - Fixed autocomplete requests being lost while background parsing is still running
      - Fixed text zoom in block selection mode (thanks to @Antoine2oo5)
      - Reduced memory use when processing SQL scripts with positional parameters and dollar-quoted strings (thanks to @cypherbits)
      - Fixed an intermittent error when selecting autocomplete suggestions after their information popup closes
  - Data Editor:
      - Calculation panel results now follow Data Formats settings instead of always rounding to three decimal places (thanks to @yuki-nakano-520)
      - Restoring a cell's original value before saving now clears its pending change (thanks to @yuki-nakano-520)
      - Fixed expanded arrays being truncated in multi-record mode when selected rows contain arrays of different lengths
  - Diagram:
      - Corrected Crow's Foot notation to show 0..n on the many side of non-unique foreign-key relationships (thanks to @adi567sin-beep)
  - Data transfer:
      - Added independent CSV header quoting options: always, when necessary, and never
      - Improved target-table mapping performance for schemas containing many objects
  - Connectivity:
      - Connection names can now be edited directly on the main connection settings page
      - Fixed an error when selecting a CData driver without an internet connection on Windows
      - Fixed a secondary error hiding the original failure when connection settings cannot be initialized
      - Aligned connection wizard sections and moved network configuration hints inside their corresponding sections
      - Fixed the first character of connection names being clipped in the Windows dark theme
  - Task Management:
      - Added project-reference remapping for additional task types when importing a project under a different name
  - Navigator:
      - Database object search now connects to a data source only when its node is expanded, avoiding connection and driver-download prompts while browsing the list
  - Security:
      - Added an optional, remembered "Sanitize logs" setting when collecting diagnostic information, without changing the original logs
      - AI account tokens now use OS-native secure storage when an available provider can be selected
      - Hardened driver and launcher archive extraction against files being written outside their intended directories (CWE-22)
      - Fixed selection of native secure storage providers on Windows and Linux
  - Product configuration:
      - Added Product Configuration to Preferences, with access to settings for hidden optional features
  - Miscellaneous:
      - Replaced low-resolution overlay icons with scalable vector icons
      - Fixed first-launch workspace initialization when the application's working directory is not writable
      - Fixed tree headers and scrollbar areas retaining the previous theme's colors on Windows
      - Added background cleanup of installation caches from previous versions that have not been modified for more than a week
      - Fixed clipped text in the Tip of the Day dialog on macOS
      - Updated remaining Eclipse-provided menu and view icons to use DBeaver icons
      - Fixed vertical dialog tab backgrounds in the light theme
      - The splash screen now displays startup progress details
      - Applied the configured desktop font consistently across additional controls and prevented packed table and tree headers from being truncated
  - New drivers:
      - Added Cloudflare D1 support
  - Databases:
      - ClickHouse:
          - Added support for editing nested Map, Tuple, and Array values
          - Restored value-based filters for Nullable and LowCardinality columns (thanks to @guishiw)
      - CUBRID: Restored incoming foreign-key references in parent-table properties and diagrams for multi-schema databases (thanks to @zsewasdsdsd)
      - Databricks: Updated the JDBC driver to version 3.4.4
      - Firebird: Fixed a freeze when opening column properties in databases with many internal domains (thanks to @seonwooj0810)
      - MariaDB: Updated Connector/J to version 3.5.11 to address CVE-2026-119276, CVE-2026-119281, CVE-2026-119210, and CVE-2026-119277
      - MySQL:
          - Added multiple-row selection to the database dump object chooser
          - Fixed false SQL validation errors for column type modifiers such as UNSIGNED
          - Native script execution is now disabled until a database is selected
      - Oracle:
          - Fixed timestamp SQL literals preserving fractional seconds and time-zone offsets when dragging cells into SQL Editor or exporting fetched rows (thanks to @fizzbeom)
          - Removed duplicate package results from database object searches
          - Reorganized connection settings and local-client selection
      - PostgreSQL:
          - Added publication and subscription management for PostgreSQL 14 and later
          - Fixed invalid target-column aliases in generated MERGE statements (thanks to @brankoradovanovic-mcom)
          - Fixed SSL connections failing because converted private-key files had overly permissive permissions (thanks to @zsewasdsdsd)
          - Improved SQL script tokenization performance (thanks to @cypherbits)
          - Updated the JDBC driver to version 42.7.14 to address CVE-2026-107314
      - Redshift: Fixed IAM Identity Center browser sign-in failing because a required driver dependency was missing (thanks to @gururagavan2008)
      - SQL Server: Fixed repeated rows and endless data transfers when using multiple-query extraction with SQL-based row limits
      - SQLite: Restored network and SSH tunnel settings for remote connections
  - Localization:
      - Completed missing translations and corrected localized UI text across supported languages
