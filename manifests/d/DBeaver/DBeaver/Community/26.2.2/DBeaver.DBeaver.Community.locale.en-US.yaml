ReleaseNotes: |-
  - AI Assistant:
      - Redesigned the AI engine selector with a native drop-down, engine icons, and improved keyboard accessibility
      - Fixed model discovery for self-hosted OpenAI-compatible endpoints with non-OpenAI model names
      - Improved error messages for HTTP redirects from custom OpenAI-compatible endpoints by showing the redirect target and configuration guidance
      - Fixed model listing and chat requests for self-hosted OpenAI-compatible endpoints when the base URL has no trailing slash (thanks to @Ashfaqbs)
      - Improved guidance and validation when the custom AI scope contains no database objects
      - Fixed an issue on macOS where opening the AI profile or model picker could immediately select an item
  - SQL Editor:
      - Added a setting to choose whether Enter, Tab, both, or neither accepts autocomplete suggestions
      - Added a preference to disable the large-script result-fetch warning (thanks to @akmalsyrf)
      - Fixed SQL Editor toolbar background colors for color-coded connections in the dark theme
  - Metadata Editor:
      - Fixed invalid table DDL generation when column comments contain double hyphens (thanks to @MicBun)
  - Data Editor:
      - Made the issue-reporting link clickable when the calendar editor encounters an unsupported date/time value
      - Fixed spacing and background inconsistencies in the virtual structure editor
  - Connectivity:
      - The connection wizard now prompts users to choose a connector when the selected database has multiple options
      - Improved navigation between project and global network profile settings
      - Improved the confirmation dialog for removing a network handler
  - Navigator:
      - Restored context menus for breadcrumbs in object editors and the status bar
      - Fixed a startup freeze when Database Navigator was in a detached window
  - Miscellaneous:
      - Fixed a Linux startup crash when the Product Configuration wizard opened
      - Redesigned and reorganized the General preferences page
      - Improved Preferences search by adding keywords to preference pages
      - Fixed inaccurate progress reporting during native tool file transformations (thanks to @cuishuang)
      - Fixed overly bright hover highlighting for view minimize and maximize buttons on Windows in the dark theme
      - Improved editor tab visibility by adding separators between unselected tabs
      - Fixed excessive accumulation of temporary files and improved cleanup of abandoned files
      - Fixed diagnostic archive collection to include all rotated log files
      - Fixed version-update controls to prevent duplicate downloads and keep the update button correctly positioned
      - Improved drop-down list sizing, scrolling, and theme colors
      - Improved UI color updates after changing the application theme without restarting DBeaver
      - Improved the contrast of inactive editor tabs for color-coded connections in the dark theme
      - Added theme selection with live preview to the User Interface preferences
  - Databases:
      - Apache Doris: Fixed CSV import into schemas and post-import table refresh
      - GBase 8s:
          - Fixed JSON value handling in the "Copy As SQL" command (thanks to @Downstream1998)
          - Fixed the Columns tab failing to load when the read_defaultstr routine is unavailable (thanks to @sakshichitnis27)
      - PostgreSQL: Added support for viewing and managing the PUBLIC pseudo-role in Permissions tabs (thanks to @NikRom5531)
      - TiDB Cloud Lake: Added the TiDB logo to the connection page (thanks to @akshar27)
      - Timeplus: Fixed incorrect numeric values and intermittent hangs during CSV import (thanks to @EastLord)
