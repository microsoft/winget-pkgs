ReleaseNotes: |-
  Changes since 26.1.0:
  - Authentication:
      - Added the ability to synchronize Team Edition user roles with a custom role claim during login or user provisioning through Keycloak authentication
      - Added Keycloak OpenID, which allows users to sign in to Team Edition with Keycloak accounts through OpenID Connect (OIDC)
  - AI Assistant:
      - Added the ability to use multiple AI configurations for working with the AI chat
      - Added support for Grok AI assistant
      - The Ollama engine is now available for use with AI tools
      - Added to Preferences a capability to set the maximum waiting time for AI responses
      - Added user interaction tool to AI Chat. AI can ask follow-up questions with predefined answer options
  - SQL Editor:
      - Execution plan diagrams in SQL Editor now use line thickness to visualize the number of rows flowing between operations
      - Added an Export button for the SQL Execution Plan, allowing users to export the graph plan in SVG or PNG formats
  - Data Editor:
      - Added the ability for each user to save Data Editor filters and reuse them from their filter history without re-entering conditions
      - Added HTML preview for text/html values in the Value panel
  - Diagram:
      - Users can now configure Diagram view settings individually
  - Data Transfer:
      - Added the ability to transfer primary and foreign keys, along with data migration, from one database to another
      - Redesigned the Tables Mapping step for database-to-database transfer
  - Data Compare:
      - Added the ability to compare query results without re-executing queries
  - Connectivity:
      - Added global network profiles that can be used in all projects
      - Added support for retrieving passwords from a shell command for native database authentication
  - Secret management:
      - Added support for Google and Azure Key Vault Secret Management
  - Security:
      - Connection-level security restrictions configured in the desktop application now apply in both desktop and web interfaces
      - Fixed the high vulnerability (CVE-2026-41850) in the spring-boot library. The library was updated to version 4.1.0
      - Fixed the high vulnerability (CVE-2026-10050) in the jetty-security library. The library was updated to version 12.1.11
      - Fixed the high vulnerabilities in the netty-codec libraries. The netty-bom library was updated to version 4.2.16
      - Fixed CVE-2026-54291. PostgreSQL driver was updated to version 42.7.13
      - Fixed an XXE vulnerability caused by an unhardened XML parser (CWE-611)
      - Fixed an XXE vulnerability caused by inconsistent XML sanitization in the Value editor
      - Fixed an SQL injection vulnerability related to malicious names of downloaded files
      - Protected local server port and password data from exposure through dbeaver-instance.properties
      - Fixed unintended execution of executable files opened from Windows UNC paths
      - Added new preferences limiting API tokens' lifetimes (apiTokenMaxTtlMinutes) to runtime configuration (.cloudbeaver.runtime.conf) with a default limit of 30 days. These changes will not be applied to old API tokens with a longer lifetime setting
      - Fixed an SQL injection vulnerability related to string formatting (CWE-89) in the Exasol extension in the application
      - Restricted presentation and execution of malicious content in AI Chat
      - Fixed a remote code execution vulnerability related to virtual column creation
  - New drivers:
      - Multi-Source Database driver can combine multiple databases into a single data source and run cross-database queries
      - DDL Driver: Added the ability to create data sources from DDL scripts to inspect and analyze database structure
      - etcd driver
      - Apache Doris
      - GreptimeDB
      - Timeplus
  - Driver updates:
      - ClickHouse driver was updated to version 0.10.0
      - Couchbase driver was updated to version 3.12.1
      - Databend driver was updated to version 0.4.8
      - Databricks driver was updated to version 3.4.1
      - MongoDB driver was updated to version 5.7.0
      - Starrocks driver was updated to version 1.1.2
  - Databases:
      - BigQuery: the official BigQuery driver is now used by default, and the previous Simba driver was renamed to BigQuery (Legacy)
      - LibSQL: Added support for database views
      - Added OIDC authentication for MongoDB
      - Redshift: Added Microsoft Entra ID OAuth2 authentication
