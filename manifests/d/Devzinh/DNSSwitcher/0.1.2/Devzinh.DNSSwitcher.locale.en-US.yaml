ShortDescription: Change your Windows DNS in one click and find the fastest resolver from your network.
Description: |-
  DNS Switcher changes the DNS servers of a Windows network adapter in one click and measures which public resolver answers fastest from your own connection.
  Each resolver is probed with several lookups and shown with median, p95, jitter, loss, an uncached lookup time and the anycast site that answered.
  It includes 47 IPv4 and 30 IPv6 public resolvers in general, malware-blocking and family groups, plus custom servers.
  A Windows service does the privileged work, so the app runs without administrator rights and stays in the notification area for quick switching.
