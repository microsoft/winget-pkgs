ShortDescription: Free, open-source disk space analyzer for Windows that shows where your space went as a sunburst chart.
Description: |-
  RingScan scans all fixed drives, a single drive or a folder and draws the result as a sunburst chart: the center is the folder you are looking at, each ring outward is one folder level deeper, and each arc's angle is proportional to its size, so the big folders stand out at a glance.
  Run as administrator, it reads NTFS drives straight from the master file table (MFT), about a million files in a few seconds; otherwise it walks folders in parallel. Each drive also shows the space reserved by Windows and the used space the scan could not see, so the totals add up to what Windows reports.
  Side panels list the current folder's contents, the largest files and a breakdown by file type. You can search by name, color the chart by folder, file type or age, and open, show in Explorer, move to the Recycle Bin or delete items; every delete is confirmed.
  RingScan is a single portable executable with no installer, makes no network requests, and has an English and Ukrainian interface. A --cli mode prints text or JSON reports for scripts.
