ReleaseNotes: |-
  - Кількість кілець тепер за замовчуванням залежить від розміру вікна, щоб назви папок уміщалися (Налаштування > Кільця: «Авто» або фіксоване число від 3 до 24).
  - Назви, задовгі для середини вигнутого кільця, зсуваються до його внутрішнього краю, а не зникають.
