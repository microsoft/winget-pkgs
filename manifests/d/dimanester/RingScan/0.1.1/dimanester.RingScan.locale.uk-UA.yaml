ShortDescription: Безкоштовний аналізатор дискового простору для Windows з відкритим кодом, який показує кільцевою діаграмою, куди поділося місце.
Description: |-
  RingScan сканує всі локальні диски, окремий диск або папку й малює результат кільцевою діаграмою: у центрі папка, яку ви переглядаєте, кожне кільце назовні на рівень глибше, а кут кожної дуги пропорційний її розміру, тож великі папки видно одразу.
  Від імені адміністратора програма читає диски NTFS прямо з головної таблиці файлів (MFT): близько мільйона файлів за кілька секунд; без прав адміністратора вона обходить папки паралельно. Для кожного диска також видно місце, зарезервоване Windows, і зайняте місце, якого сканування не побачило, тож підсумки збігаються з тим, що показує Windows.
  Бічні панелі показують вміст поточної папки, найбільші файли й розподіл за типами файлів. Можна шукати за назвою, розфарбовувати діаграму за папками, типами файлів або віком, відкривати елементи, показувати їх у Провіднику, переміщувати в Кошик або видаляти; кожне видалення треба підтвердити.
  RingScan поширюється як один портативний exe-файл без інсталятора. Програма не робить мережевих запитів, інтерфейс англійською та українською. Режим --cli видає текстові або JSON-звіти для скриптів.
