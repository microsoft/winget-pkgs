PackageIdentifier: DNGLab.DNGLab
PackageVersion: 0.8.0
PackageLocale: zh-CN
ShortDescription: 将相机 RAW 文件转换为 DNG 格式的命令行工具。
Description: |-
  DNGLab 是一个相机 RAW 到 DNG 格式的转换器。
  它读取各厂商私有的相机 RAW 格式，并写出开放、文档公开的 DNG 格式，这样即使某些软件没有内置对应机型的解码器，raw 文件依然可以继续读取。命令行工具提供 convert、analyze、extract、makedng 与 process-raw 子命令，转换器依靠内置的机型与镜头数据库识别广泛的相机与镜头校正信息。
  可选的 DNG 输出 JPEG XL 压缩需要 libjxl 0.11 或更高版本，运行时动态加载；没有它时，其余功能照常工作。
