ShortDescription: Scriptable Windows screenshots, OCR, and screen recording with JSON output
Description: |-
  The Pointframe CLI is a standalone, self-contained command-line tool for Windows.
  It lists monitors and windows, captures a monitor, a monitor sub-region, or a single
  window to PNG, extracts on-screen text with Windows OCR, and records a monitor to MP4.
  Every command writes single-line JSON with stable error codes, so scripts and AI agents
  can parse results directly. It does not need the Pointframe desktop app or the .NET runtime.
  The record command requires ffmpeg on PATH or set through POINTFRAME_FFMPEG_PATH.
