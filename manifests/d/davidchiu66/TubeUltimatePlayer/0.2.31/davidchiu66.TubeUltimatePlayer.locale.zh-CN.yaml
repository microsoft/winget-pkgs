ReleaseNotes: |-
  v0.2.31
  0.2.31 聚焦 Instagram 接入、评论体验、播放队列导航、YouTube 清晰度显示和 macOS 发布能力。
  Instagram 支持
  - 新增 Instagram 首页和搜索浏览器服务，支持 Firefox 登录 Cookie 和 Qt WebEngine 安全上下文
  - 从 Instagram 主首页采集动态 Relay/ServerJS 视频节点，支持滚动加载并按 20 条分页
  - 支持 Instagram Reel 视频卡片识别、播放、下载、收藏、历史和播放记忆
  - 增加登录页、Challenge、Checkpoint 和安全验证状态识别
  - 采集日志不记录 Cookie 值，只记录来源和必要诊断信息
  评论体验
  - 播放器右侧播放列表增加结构化评论 Tab
  - Bilibili 评论改用官方分页接口，加载更快并支持“加载更多”
  - YouTube 评论支持 yt-dlp 分页参数和继续加载
  - 播放开始后后台预取首批评论
  - 评论首次显示、面板首次滑入和窗口尺寸变化时自动重新计算换行高度
  - 加载更多后保持旧评论页末尾锚点，并按评论 ID 去重
  - 鼠标停留或滚动评论面板时不会被播放器空闲计时器自动收起
  播放控制与清晰度
  - 播放控制器增加“上一个”“下一个”文字按钮，位于停止按钮之后
  - 新增 P/N 快捷键，保留原有 PgUp/PgDown 配置
  - 播放列表、合集和首页/搜索结果支持统一的上一个/下一个导航
  - 队列边界禁用，不循环播放
  - 普通窗口音量改为悬浮竖向滑条，默认隐藏，悬停音量按钮时显示
  - 投屏、全屏和小窗按钮收窄，改善普通窗口控制器拥挤问题
  - YouTube 使用 default,web_safari client 组合，保留完整格式梯度
  - 超宽 YouTube 视频按标准画质档位显示，避免出现 886p/590p/394p 等误导标签
  - 同一分辨率多个帧率只保留最高质量版本
  macOS 发布
  - 新增 release-macos.yml 工作流
  - 支持 macOS Intel 与 Apple Silicon runner
  - 生成 .app、.dmg 和 .zip 发布资产
  - 内置 macOS 版 yt-dlp、Deno 和 libmpv
  - 自动打包 libmpv 的动态库依赖，检查并拒绝 Homebrew 本地路径泄漏
  - 主发布工作流会将 macOS 资产与 Windows 资产一起上传到 GitHub Release
  稳定性与验证
  - 保留既有抖音、TikTok、小红书浏览器签名、Cookie、风控恢复和站点隔离能力
  - 更新 README、macOS 构建文档和相关回归测试
  - pyproject.toml 与 app_version.txt 统一为 0.2.31
  - 全量自动化测试：892 passed
  - Python 编译检查、Ruff 和 git diff --check 通过
  升级说明
  首次使用 Instagram 时，建议在 Firefox 中登录 Instagram，再在设置页为 Instagram 配置自动检测 Cookie。macOS 发布资产分为 Intel (mac_x86_64) 和 Apple Silicon (mac_arm64) 两种架构，请按设备选择。
