ShortDescription: 基于 libmpv 与 yt-dlp 的 YouTube、Bilibili 桌面视频播放器与下载工具。
Description: Tube_Ultimate_Player 是一款基于 PySide6、yt-dlp 与 libmpv 的 Windows 桌面视频播放器与下载工具。它同时支持 YouTube 与 Bilibili 的搜索、首页浏览、URL 播放、播放列表管理与下载，提供清晰度切换、倍速、字幕、DLNA 投屏、下载队列、收藏与历史等功能。
