ShortDescription: Desktop video player and downloader for YouTube and Bilibili built on libmpv and yt-dlp.
Description: Tube_Ultimate_Player is a Windows desktop video player and download tool built on PySide6, yt-dlp, and libmpv. It supports YouTube and Bilibili search, home feeds, URL playback, playlist management, and downloads, with quality switching, playback speed, subtitles, DLNA casting, a download queue, favorites, and history.
