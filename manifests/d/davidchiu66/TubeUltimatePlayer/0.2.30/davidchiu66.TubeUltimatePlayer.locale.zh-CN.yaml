ReleaseNotes: |-
  0.2.30 在抖音与 TikTok 支持的基础上接入小红书视频能力，并继续增强小窗播放、播放列表和多站点稳定性。
  小红书支持
  - 新增小红书视频首页（https://www.xiaohongshu.com/red_video）和关键词搜索
  - 支持小红书视频笔记 URL 播放、清晰度选择、下载、收藏、历史和播放记忆点
  - 新增小红书作者昵称识别与作者其它视频播放列表
  - 新增小红书独立浏览器服务，复用浏览器 Cookie、页面安全上下文和媒体请求头
  - 新增小红书安全验证窗口；遇到平台验证时可在应用内完成后重试
  - 小红书站点与其它站点的 Cookie、默认画质、浏览器和请求缓存相互隔离
  - 图文笔记、直播、评论、私信和商城等非视频内容仍不在支持范围内
  播放列表与播放器体验
  - 单视频播放后在后台生成作者播放列表，不阻塞当前视频首帧播放
  - 作者播放列表尚未解析完成时，将鼠标移入播放器右侧热点会提示“播放列表加载中，请稍候”
  - 加载提示按一次热点进入节流，离开后再次进入才重新提示
  - 作者列表成功、失败、无作者信息、切换视频和请求失效时正确清理加载状态
  - 小窗模式、左侧合集列表和已有保存列表不受右侧加载提示影响
  - 继续保持小窗播放的拖动、等比缩放、置顶、迷你控制条和多风格图标能力
  多站点与稳定性
  - 首页、搜索、URL 播放、下载、收藏、历史、设置和工具栏全面补齐小红书适配
  - 加强抖音首页与搜索的浏览器签名、风控验证恢复和请求取消处理
  - 改进小红书媒体 URL、Referer、Origin、编码和清晰度兼容处理
  - 首页或搜索加载期间启动播放时，取消旧浏览任务，避免迟到回调覆盖当前页面
  - 站点切换期间冻结重复切换操作，待当前加载完成后自动恢复
  - 首次启动增加 Cookie 配置操作指南，可勾选后不再显示
  - 完善作者列表异步 worker 的 generation 校验，避免旧视频结果污染当前播放
  文档与测试
  - README 更新为五站点能力说明，补充小红书配置、运行目录和使用说明
  - pyproject.toml 与 app_version.txt 版本号统一为 0.2.30
  - 新增小红书、浏览器验证、播放列表加载提示等回归测试
  - 全量自动化测试：862 passed
  - Python 编译检查和 git diff --check 通过
  升级说明
  升级后建议在设置页为小红书单独配置 Firefox Cookie。首次打开小红书首页或搜索时需要初始化浏览器安全环境，加载时间可能明显长于 Bilibili 和 YouTube，请耐心等待。
