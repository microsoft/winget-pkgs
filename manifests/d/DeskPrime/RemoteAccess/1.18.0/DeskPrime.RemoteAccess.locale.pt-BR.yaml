ShortDescription: Acesso remoto a computadores Windows por ID e senha, sem configurar a rede.
Description: |-
  Acesso remoto a computadores Windows usando um ID e uma senha, sem abrir porta
  no firewall nem configurar a rede. Instala como serviço, então a máquina
  continua alcançável na tela de logon e depois de reiniciar. A sessão pede
  aceite de quem está na outra ponta, mostra quem está pedindo acesso e tem chat
  durante a conexão. Faz parte da plataforma DeskPrime (service desk,
  atendimento e inventário), mas funciona sozinho.
