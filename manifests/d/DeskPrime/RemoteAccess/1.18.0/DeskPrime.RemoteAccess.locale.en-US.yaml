ShortDescription: Remote access to Windows computers with an ID and a password, no network setup.
Description: |-
  Remote access to Windows computers using an ID and a password, with no firewall
  port to open and no network configuration. It installs as a service, so the
  machine stays reachable at the Windows logon screen and after a reboot. The
  session asks the person on the other end to accept it, shows who is asking and
  includes chat while connected. Part of the DeskPrime platform (service desk,
  customer messaging and asset inventory), and works on its own as well. The user
  interface is in Brazilian Portuguese.
