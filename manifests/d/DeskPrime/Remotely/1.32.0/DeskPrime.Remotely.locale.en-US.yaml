ReleaseNotes: |-
  The application is now called DeskPrime Remotely.

  Fixed
  - Automatic updates could sit on the progress bar forever without reporting
    an error: a failure ended the process without closing the bar. Every
    failure is now reported, with its reason.
  - The download no longer has an overall deadline. It gives up only after a
    minute without receiving data, so a slow but healthy download is no longer
    rejected, and it resumes where it stopped if the connection drops.
