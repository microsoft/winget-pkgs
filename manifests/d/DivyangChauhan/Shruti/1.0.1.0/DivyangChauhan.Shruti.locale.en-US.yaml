ShortDescription: Windows dictation with local speech recognition and insertion into the focused app.
Description: Shruti records microphone audio, transcribes it locally with whisper.cpp or OpenVINO, and inserts the result into the focused application. It supports preview, copy-only dictation, configurable shortcuts, and a tray control. A speech model download is required before first use. This portable release matches the published Microsoft Store app version and excludes experimental transcript-quality features.
