ShortDescription: Windows dictation with local speech recognition and insertion into the focused app.
Description: Shruti records microphone audio, transcribes it locally with whisper.cpp or OpenVINO, and inserts the result into the focused application. It supports preview, copy-only dictation, configurable shortcuts, and a tray control. A speech model download is required before first use. It includes local transcription history, Insights, Dictionary, spoken Snippets, optional on-device cleanup, and floating bars on one selected monitor or all monitors.
