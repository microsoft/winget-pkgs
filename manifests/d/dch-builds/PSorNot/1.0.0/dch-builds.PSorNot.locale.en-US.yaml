PackageName: PS or Not
PackageUrl: https://github.com/dch-builds/PSorNot-releases
License: Freeware
ShortDescription: DualSense or Xbox controller? See which one each PC game supports best.
Description: |-
  PS or Not reads each game's controller support on PCGamingWiki and tells you whether to use a DualSense or an Xbox controller.
  It highlights the DualSense exclusive features a game supports on PC (haptic feedback, adaptive triggers, gyro, light bar, speaker),
  explains how to enable them (USB cable, Steam Input, third-party tools) and scans your installed games
  (Steam, Epic Games, GOG, EA, Ubisoft, Battle.net, Xbox and custom folders).
