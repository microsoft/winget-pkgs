PackageIdentifier: dch-builds.PSorNot
PackageVersion: 1.0.0
PackageLocale: fr-FR
Publisher: dch-builds
PackageName: PS or Not
License: Gratuiciel
ShortDescription: DualSense ou manette Xbox ? Découvre laquelle chaque jeu PC exploite le mieux.
Description: |-
  PS or Not lit le support manette de chaque jeu sur PCGamingWiki et te dit s'il vaut mieux sortir la DualSense ou la manette Xbox.
  Il met en avant les fonctions exclusives de la DualSense exploitées sur PC (retour haptique, gâchettes adaptatives, gyroscope, light bar, haut-parleur),
  explique comment les activer (câble USB, Steam Input, outils tiers) et analyse tes jeux installés
  (Steam, Epic Games, GOG, EA, Ubisoft, Battle.net, Xbox et dossiers perso).
ManifestType: locale
ManifestVersion: 1.10.0
