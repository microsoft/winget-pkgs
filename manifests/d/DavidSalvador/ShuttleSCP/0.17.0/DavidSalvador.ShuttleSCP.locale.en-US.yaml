Description: |-
  ShuttleSCP is a graphical SFTP and FTP/FTPS client for Linux, macOS and Windows, inspired by WinSCP.
  Your computer's files are on the left and the server's on the right; copying between them is a drag,
  a right-click or a key press away. It resumes interrupted transfers and can copy directly between
  two servers.
