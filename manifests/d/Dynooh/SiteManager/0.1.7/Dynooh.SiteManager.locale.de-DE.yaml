ShortDescription: Blitzschneller, leichter FTP-Servermanager – ein schlanker Ersatz für die Site-Verwaltung von Dreamweaver.
Description: |-
  Dynooh SiteManager verwaltet Websites, Uploads, Synchronisation und Logins an einem Ort.
  Sites lassen sich in Gruppen ordnen, bestehende Dreamweaver-Sites oder ganze Ordner importieren. Lokale und Server-Dateien stehen nebeneinander, Uploads und Downloads laufen in einer Warteschlange.
  Ganze Sites oder einzelne Ordner vergleichen und Unterschiede hochladen, herunterladen oder löschen. Dateien im integrierten Editor in Tabs bearbeiten und für jede Site Git-Status, Commit, Pull und Push nutzen.
  Logins liegen in der Windows-Anmeldeinformationsverwaltung, geschützt durch ein Master-Passwort, und lassen sich verschlüsselt auf einen anderen Computer übertragen.
