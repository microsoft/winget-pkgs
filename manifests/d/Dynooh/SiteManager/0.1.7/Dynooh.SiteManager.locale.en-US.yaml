ShortDescription: Lightning-fast, lightweight FTP site manager – a slim replacement for the Dreamweaver site management.
Description: |-
  Dynooh SiteManager keeps websites, uploads, synchronisation and logins in one place.
  Sort sites into groups and import existing Dreamweaver sites or whole folders. Local and server files sit side by side, uploads and downloads run in a queue.
  Compare a whole site or a single folder and upload, download or delete the differences. Edit files in tabs with the built-in editor and use status, commit, pull and push for every site's Git repository.
  Logins are stored in the Windows Credential Manager behind a master password and can be moved to another computer in an encrypted export.
