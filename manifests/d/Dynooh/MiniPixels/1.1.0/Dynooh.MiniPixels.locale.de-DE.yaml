ShortDescription: Extrem leichter Betrachter für Bilder, Audio und Video mit Inspektor-Funktionen.
Description: |-
  Dynooh MiniPixels öffnet Bilder (PNG, JPG, BMP, GIF, TIF), Audio (MP3) und Video (MP4, MOV) sofort und prüft sie bis aufs Pixel.
  Lineale, Hilfslinien, ein Pixelraster ab 400 % Zoom und Dateiangaben wie Abmessungen, Dauer und Codec gibt es für Bilder und laufende Videos.
  Dateien öffnen in Tabs, Kacheln, einer Liste oder eigenen Fenstern; eine Wiedergabeleiste steuert Audio und Video in jeder Ansicht, mit Diashow und automatischem Weiterspringen.
  Nicht unterstützte Video-Codecs lassen sich mit FFmpeg in H.264 umwandeln; FFmpeg wird nur auf Wunsch heruntergeladen.
