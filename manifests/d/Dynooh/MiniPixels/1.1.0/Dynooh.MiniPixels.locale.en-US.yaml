ShortDescription: Extremely lightweight image, audio and video viewer with inspector functions.
Description: |-
  Dynooh MiniPixels opens images (PNG, JPG, BMP, GIF, TIF), audio (MP3) and video (MP4, MOV) instantly and lets you check them down to the pixel.
  Rulers, guides, a pixel grid above 400 % zoom and file details such as dimensions, duration and codec work for images and playing videos alike.
  Files open in tabs, tiles, a list or separate windows; one playback bar controls audio and video in every view, with slideshow and auto-advance.
  Unsupported video codecs can be converted to H.264 with FFmpeg, downloaded only on request.
