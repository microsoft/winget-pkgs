ShortDescription: Classic Windows 95, 98, Me, 2000, XP, Vista taskbar for modern versions of Windows
ReleaseNotes: |-
  Tip
  Download the installer from the Assets section below (since it isn't signed, Windows Defender will likely require you to choose "more info," then "run anyway").
  Note
  RetroBar has been updated to use .NET 10 instead of .NET 6 when running on Windows 10 or later. When updating, you may be prompted to install .NET 10 if you do not have it already.
  RetroBar now has a Discord server! You can join here.
  New features
  - Dragging a file onto the Show Desktop button now automatically triggers the button (#1287)
  - Input language and keyboard layout can now be changed from the taskbar (#68, thanks @SlavaArduino12345!)
  - Notification area icons can now be rearranged by dragging them (#1207, thanks @xoascf!)
  - The blur effect behind transparent taskbar themes can now be disabled with a setting (#1303)
  - Font smoothing can now be independently controlled for context menus (#1401, thanks @rmnmjw!)
  - New translations:
    - Belarusian (беларуская) (#1276 and #1441, thanks @pavel-chumakou and @Traindere!)
    - Danish (dansk) (#1421 and #1441, thanks DeepL and @Traindere!)
    - Icelandic (íslenska) (#1289, #1421, and #1441, thanks @Traindere!)
    - Macedonian (Македонски) (#1421 and #1441, thanks @Traindere!)
    - Maltese (Malti) (#1289, #1421 and #1441, thanks @Traindere!)
    - Norsk (bokmål) (#1280, #1421, and #1441, thanks DeepL and @Traindere!)
    - Slovak (slovenščina) (#1421 and #1441, thanks MrRedDiamond and @Traindere!)
    - Welsh (Cymraeg) (#1421 and #1441, thanks Iestyn Phelps and @Traindere!)
  Improvements
  - RetroBar has been updated to use .NET 10 instead of .NET 6 when running on Windows 10 or later (#1271)
  - Portable versions of RetroBar are now available from a single download (#1400)
  - The settings in the properties window have been rearranged, and the properties window no longer changes height when switching tabs (#1424)
  - Fixed RetroBar starting up thinking that Explorer is not the shell in some configurations (#1359, thanks @xpewster!)
  - Fixed shrunken taskbar buttons sometimes leaving a gap at the end of the taskbar (#139, thanks @rmnmjw!)
  - Fixed taskbar buttons sometimes showing on the wrong monitor after sleep (#1354, thanks @SMUsamaShah!)
  - Fixed the input language displaying incorrectly for certain applications (#1439, thanks @diomed16!)
  - Fixed the option to automatically start RetroBar on login not working when the installed path contains a space (#1355, thanks @madbrain76!)
  - Fixed the Windows Vista start button sometimes showing above full-screen windows (#1442)
  - Fixed the Windows Vista start button top being clipped after closing a full-screen window (#1437)
  - Fixed the Windows Vista start button top being clipped on high DPI (#1404, thanks @rmnmjw!)
  - Fixed the Windows XP themes' active task title not showing sunken on vertical taskbars (#1436)
  - Improved accuracy of the Windows Vista Aero theme taskbar background (#1340, thanks @custosoft!)
  - When using RetroBar over Remote Desktop, hardware acceleration now works on .NET 10 builds (#1425)
  - Updated translations:
    - Arabic (العربية) (#1286 and #1444, thanks @YoucefGuenaoua!)
    - Croatian (hrvatski) (#1301, #1421, #1434, and #1448, thanks @som3rando and @Traindere!)
    - Dutch (Nederlands) (#1449, thanks Kabir Awan!)
    - Finnish (Suomi) (#1449, thanks @Traindere!)
    - French (français) (#1363 and #1441, thanks @Maxokie and @Traindere!)
    - German (Deutsch) (#1270, #1369, #1421, and #1441, thanks @uDEV2019 and @Traindere!)
    - Greek (ελληνικά) (#1449, thanks @Traindere!)
    - Hungarian (magyar) (#1449, thanks Benedek Halda-Kiss!)
    - Italian (italiano) (#1421 and #1441, thanks @Traindere!)
    - Japanese (日本語) (#1432, thanks @xoascf!)
    - Korean (한국어) (#1449, thanks Kim_0162!)
    - Polish (polski) (#1299 and #1441, thanks @JacekLub and nywitrzy (Aleksander Kostrzynski)!)
    - Romanian (română) (#1279, #1421, and #1441, thanks @Traindere!)
    - Russian (русский) (#1274 and #1441, thanks @1280px and @Traindere!)
    - Serbian (Cyrillic) (српски) (#1345 and #1441, thanks @rammba and @Traindere!)
    - Serbian (Latin) (srpski) (#1345 and #1441, thanks @rammba and @Traindere!)
    - Spanish (español) (#1421 and #1432, thanks @Traindere and @xoascf!)
    - Swedish (svenska) (#1421 and #1441, thanks DeepL and @Traindere!)
    - Turkish (Türkçe) (#1275 and #1438, thanks @mutoyoru and @CodeAru!)
    - Vietnamese (Tiếng Việt) (#1441, thanks @Traindere!)
