ReleaseNotes: |-
  2.3.4
  修复
  - 修复 2.3.4 升级后主进程启动崩溃：Cannot find module '../../utils/util.secret-vault'（overwall / share 插件的 require 路径少一层）
  - 大文件上传超过 60 秒不再被误判为「上游无响应」而中断（#684，GitHub Release 上传等场景）
  - Linux 系统代理的排除列表支持 IP 通配符：192.168.*.* 会同时写入 192.168.0.0/16，GNOME 与 libproxy 两种后端都能生效（#483）
  - 修复 X（Twitter）ECH 规则的反斜杠被 JSON5 吞掉、导致 www.okx.com 等相似域名被误判为 ECH 的问题
  - 「检查更新」按钮不再长时间转圈
  变更
  - SNI 证书校验策略调整（#745）：
    - sni 只负责修改握手时的 SNI，不再顺带关闭证书校验；
    - 免校验必须显式配置 unVerifySsl: true（或 ssl: false）；
    - sni 与 unVerifySsl 现在可以叠加使用，sni: "" 也能配合免校验；
    - 内置的 42 条依赖 SNI 伪装的规则已显式补充 unVerifySsl: true，官方配置同步更新。
    自定义 sni 规则的用户请注意：如果之前依赖「改写 SNI 即免校验」的隐式行为，
    现在需要自行补上 unVerifySsl: true 或 verifyHost，否则会按真实域名校验证书。
  - 默认配置跟随官方配置更新：新增 docker、onedrive、archive 等加速规则，补充 *.vsassets.io 的 DNS 解析（VSCode 扩展下载）。
  安全
  - 增强功能口令与 P2P 令牌迁入系统密钥库，不再明文写入配置
  - CA 私钥不再落盘，改由环境变量注入代理子进程
  - 配置文件权限收紧为 0600
  - 反馈打包的日志脱敏覆盖 JSON 形式的凭据
  说明
  - Windows 安装包本次未做 SignPath 签名（签名服务当前不可用），首次运行可能触发 SmartScreen 提示。
