ReleaseNotes: |-
  一、更新内容：
  【摘要】
  在 v2.3.0 的基础上补齐界面侧改动：新增 NAT64 直连配置，远程配置与帮助中心的几处问题也一并修正。
  【新特性】
  - NAT64 直连：加速服务页新增「NAT64 直连」标签页。把域名解析出的真实 IPv4 嵌入 IPv6 前缀，经 IPv6 网络访问；可单独指定解析用的 DoH（查询走 NAT64 通道，本机 DNS 被投毒也能拿到真实 IP），可设置 A 记录缓存时间，并按域名名单生效（支持通配符与正则）。名单为空时不启用、也没有额外开销；所在网络访问不了该前缀时自动回退普通解析，不影响其他域名。
  - 底栏显示内核 SHA：底栏展示所用内核的短 SHA，鼠标悬停可看到完整提交号，提 issue 时能直接附上。
  - ECH 更稳：ECH 连接失败时会自动更换 IP 重试，并把结果反馈给 DNS 优选，减少连不上的情况。
  【优化】
  - 远程配置地址只接受 HTTPS：设置页明确提示不再支持裸 HTTP（明文下载会被中间人篡改），填写 http:// 开头的地址会被自动改写为 https:// 并保存。
  - 写明配置优先级：本地修改配置 > 个人远程配置 > 共享远程配置 > 默认配置。
  - 开机自启：支持 --hideWindow=true，并兼容旧自启参数的引号写法。
  - 文档同步：说明文档补充了 NAT64 直连的用法。
  【问题修复】
  - 修复旧配置地址纠正未生效：以往把历史官方配置地址纠正为 HTTPS 的逻辑没有作用到实际生效的配置上，现在会正确纠正并保存；你自己填写的镜像地址与留空地址不受影响。
  - 修复远程配置下载失败的误报：以前下载失败会弹出通用的「Api invoke error」，看起来像功能坏了；现在会明确提示已继续使用本地缓存并自动重试，代理不受影响。
  - 修复帮助中心显示旧内容：页面打开期间远程配置更新后，帮助中心会重新读取内容；可编辑页面不会自动重载，避免冲掉你正在修改、尚未保存的内容。
  - 修复取消勾选后 GitHub 加速仍被启动：勾选状态已修正，取消勾选后不会再被自动启动。
  - 修复系统代理启用失败：Windows 上启用系统代理失败时会自动回退，减少无法开启代理的情况。
  - 远程配置获取更稳：启动时若本地代理尚未就绪，会依次尝试其他方式获取远程配置。
