ShortDescription: USB-C cable, charger and port checker. See what your cable can actually do and why your laptop charges slowly.
Description: |-
  Windows negotiates the capabilities of every USB-C connection and then shows you almost none of
  it. portmark reads it back out: the Power Delivery contract in force against everything the
  charger offers, the battery's own charge rate and health, DisplayPort Alternate Mode, and every
  attached device with the link speed it actually negotiated.

  It tells you when a charger offers far more than the contract in force, and when a device is
  running slower than the hub reports it can. Where the PC cannot read the cable, it says so rather
  than blaming the cable, and a charger offering more than 3A is reported as evidence the cable is
  rated for at least that, labelled as a deduction.

  A field that could not be determined says so, and says why. Nothing is inferred from the shape of
  a connector. Output is JSON by default, with a plain English mode, and `portmark report` writes a
  redacted file for hardware reports. Nothing is ever sent over the network.

  The notification area companion ships as the dbhq-uk.portmark-tray package.
