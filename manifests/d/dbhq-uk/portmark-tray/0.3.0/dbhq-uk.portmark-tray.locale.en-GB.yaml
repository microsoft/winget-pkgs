ShortDescription: Shows what your USB-C ports and chargers are doing, in the notification area, as it happens.
Description: |-
  Sits in the notification area and tells you the moment something changes on a USB-C port. Plug a
  charger in and it says what the supply offers and the power contract in force. A device that
  comes up slower than the hub reports it can, or a port the hub reports as faulted, is called out.

  Clicking the icon opens a panel: the charger's power levels with the contract in force
  highlighted, DisplayPort Alternate Mode and whether it is live, and every attached device with the
  link speed it actually negotiated. Technical detail is one toggle away and out of the way until
  asked for.

  A field that could not be determined says so, and says why. Nothing is inferred from the shape of
  a connector, and nothing is ever sent over the network.

  The command line tool ships as the dbhq-uk.portmark package.
