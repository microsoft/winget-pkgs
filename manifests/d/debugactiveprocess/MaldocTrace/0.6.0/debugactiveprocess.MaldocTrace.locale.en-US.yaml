ShortDescription: Static analyzer and safe VBA emulator for malicious Office documents.
Description: |-
  MaldocTrace is a command-line tool for defenders that triages malicious documents (Word, Excel, OOXML, RTF, encrypted Office files, OneNote sections, emails and archives) without running Office.
  It extracts the VBA project, emulates the macros and VBScript droppers against a simulated Windows environment (nothing is executed), and reports the deobfuscated payloads, launched commands, dropped files and indicators of compromise as text or JSON.
