ShortDescription: Static analyzer and safe VBA emulator for malicious Office documents.
Description: |-
  MaldocTrace is a command-line tool for defenders that triages malicious Office documents (Word, Excel, OOXML and encrypted Office files) without running Office.
  It extracts the VBA project, emulates the macros against a simulated Windows environment (nothing is executed), and reports the deobfuscated payloads, launched commands, dropped files and indicators of compromise as text or JSON.
