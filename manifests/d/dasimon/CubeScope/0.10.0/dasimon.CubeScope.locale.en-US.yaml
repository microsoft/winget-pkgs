InstallationNotes: Run "cubescope" from a terminal, or find cubescope.exe in your PATH. It starts a local web server on a free port and opens your default browser automatically. Requires network access to an SSAS Multidimensional instance (Windows Integrated Security) — see https://github.com/dasimon/CubeScope for prerequisites.
