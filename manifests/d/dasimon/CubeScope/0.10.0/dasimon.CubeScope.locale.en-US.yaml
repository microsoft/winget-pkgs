ShortDescription: A modern, open-source successor to MDX Studio for SSAS Multidimensional.
Description: 'CubeScope is a modern workbench for SSAS Multidimensional developers: write, understand, measure and maintain MDX against existing cubes, with a built-in AI expert. A single self-contained executable (ASP.NET Core 10 + Vue 3) that opens a local web app in your browser — no install, no server, no cloud. Features: Monaco MDX editor with autocompletion, virtualized results grid, DMV metadata explorer, a query profiler that splits Formula Engine vs Storage Engine from SSAS traces, perfmon stats, MDX Script + dependency graph, cache management, query history, and an AI assistant — explain / optimize / detect anti-patterns / format, profile-grounded optimization, and natural-language → MDX generation. Powered by Anthropic by default, or any OpenAI-compatible endpoint (local Ollama/LM Studio included) for on-prem confidentiality. Windows only, Integrated Security. Scope is SSAS Multidimensional only — no Tabular, Power BI or DAX.'
