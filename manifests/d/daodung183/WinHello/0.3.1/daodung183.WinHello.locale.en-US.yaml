ShortDescription: Open-source Windows sign-in approval with an Android phone on the same LAN.
Description: WinHello lets an Android phone approve a Windows sign-in request over a local network using TOTP and a biometric-backed signature. Install the Windows CLI first, then run winhello regi to register the sign-in component.
