# Installer manifest. The URL has no enrollment code (every customer gets the same bytes) and is fixed per
# version (/v1/agent/windows/versiones/<version>/), so publishing a newer exe never breaks this hash.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: DLR.Budger
PackageVersion: 1.3.0
MinimumOSVersion: 10.0.17763.0
InstallerType: exe
Scope: machine
ElevationRequirement: elevatesSelf
InstallModes:
  - interactive
  - silent
InstallerSwitches:
  # /PREPARAR: a silent install without a code (winget's validation, or someone who forgot it) only copies the
  # installer, registers it and adds «Budger - conectar este equipo» to the Start menu; nothing is enrolled.
  Silent: /S /PREPARAR
  SilentWithProgress: /S /PREPARAR
  # The enrollment code is per customer, so it is not in the manifest: pass it with
  #   winget install DLR.Budger --custom "/CODE=ABCD-EF23"
  # With a code the PC is connected in the same run; an invalid or expired code exits 2.
  # A self-hosted console (1.3.0): add its origin, fixed at install and kept by later upgrades:
  #   winget install DLR.Budger --custom "/CODE=ABCD-EF23 /CONSOLA=https://budger.example.com"
ExpectedReturnCodes:
  - InstallerReturnCode: 2
    ReturnResponse: custom
    ReturnResponseUrl: https://app.budger.dlrbaq.com/descargar
  - InstallerReturnCode: 3
    ReturnResponse: noNetwork
  - InstallerReturnCode: 4
    ReturnResponse: blockedByPolicy
  - InstallerReturnCode: 5
    ReturnResponse: contactSupport
UpgradeBehavior: install
AppsAndFeaturesEntries:
  - DisplayName: Budger Olfato  # what instalar.ps1 writes in the Uninstall key
    Publisher: DLR
    ProductCode: BudgerOlfato
Installers:
  - Architecture: x64
    InstallerUrl: https://app.budger.dlrbaq.com/v1/agent/windows/versiones/1.3.0/BudgerOlfato.exe
    InstallerSha256: 553C4201D5DB29842D588291B97E044785B4F69FD46567784B98269842128201
  - Architecture: arm64
    InstallerUrl: https://app.budger.dlrbaq.com/v1/agent/windows/versiones/1.3.0/BudgerOlfato.exe
    InstallerSha256: 553C4201D5DB29842D588291B97E044785B4F69FD46567784B98269842128201
ManifestType: installer
ManifestVersion: 1.10.0
