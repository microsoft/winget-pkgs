PackageIdentifier: DLR.Budger
PackageVersion: 1.3.0
PackageLocale: en-US
Publisher: DLR S.A.S.
PublisherUrl: https://budger.dlrbaq.com
PackageName: Budger Endpoint Defender
PackageUrl: https://app.budger.dlrbaq.com/descargar
License: Proprietary
ShortDescription: Watches the antivirus on this PC and tells whoever manages it, in plain language, when something is wrong.
Description: |-
  Budger Endpoint Defender watches Microsoft Defender (or the antivirus in charge) on this PC and reports its state to the
  organization's Budger console. Detection on Windows is done by Microsoft Defender Antivirus, included in Windows; Budger adds
  no exclusions to Defender. Installing needs an enrollment code from the Budger console:
  winget install DLR.Budger --custom "/CODE=ABCD-EF23"
Tags:
  - antivirus
  - endpoint
  - monitoring
  - security
