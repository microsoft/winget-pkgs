# Spanish locale manifest.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.10.0.schema.json
PackageIdentifier: DLR.Budger
PackageVersion: 1.3.0
PackageLocale: es-CO
Publisher: DLR S.A.S.
PackageName: Budger Endpoint Defender
ShortDescription: Vigila el antivirus de este computador y le avisa a quien lo administra, en lenguaje claro, si algo anda mal.
Description: |-
  Budger Endpoint Defender vigila Microsoft Defender (o el antivirus a cargo) en este equipo e informa su estado a la consola de
  Budger de la organización. La detección en Windows la realiza Microsoft Defender Antivirus, incluido en Windows; Budger no
  añade exclusiones a Defender. Para instalar hace falta un código de la consola de Budger:
  winget install DLR.Budger --custom "/CODE=ABCD-EF23"
ManifestType: locale
ManifestVersion: 1.10.0
