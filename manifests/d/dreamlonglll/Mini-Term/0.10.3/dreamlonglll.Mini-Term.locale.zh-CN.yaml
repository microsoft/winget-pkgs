  | 平台    | 文件                                          | 说明                                                                     |
  | ------- | --------------------------------------------- | ------------------------------------------------------------------------ |
  | Windows | Mini-Term_0.10.3_x64-setup.exe / .msi         | 主要支持平台                                                             |
