  | macOS   | Mini-Term_0.9.3_aarch64.dmg（Apple Silicon） | 首次打开如被 Gatekeeper 拦截，执行 xattr -cr /Applications/Mini-Term.app |
  | Linux   | Mini-Term_0.9.3_amd64.AppImage / .deb / .rpm | 实验性支持                                                               |

