ShortDescription: 为 AI 时代打造的桌面终端管理器
Description: |-
  一个 AI 终端管理工具，支持多项目、多终端布局管理

  功能特性
  终端核心
  - 多标签管理 — 每个项目独立标签页，拖拽排序，状态图标一目了然
  - 递归分屏 — 横向 / 纵向任意嵌套分屏，Allotment 拖拽调整比例
  - 高性能渲染 — xterm.js v6 + WebGL 加速，自动降级为 Canvas
  - 10 万行滚动缓冲 — 拦截 CSI 3J（ED3）指令，Claude / Codex 等 TUI 清屏时保留上滚历史
  - 终端缓存 — 切换标签 / 分屏不重建 xterm 实例，已有内容不丢失
  - 复制粘贴 — Ctrl+Shift+C / Ctrl+Shift+V 快捷键 + 右键菜单，未选中时"复制"自动置灰；Windows 大段多行粘贴自动分块写入，防止 ConPTY 丢行
  - 长文本粘贴 — 剪贴板文本 ≥10 行或 ≥2000 字符时自动转存为临时 .txt 并粘贴带引号的文件路径，避免 AI 工具直接处理超长内容引发性能与 paste bracket 问题
  - 图片粘贴 — 剪贴板含截图时自动检测，通过 Win32 API 保存为临时 PNG 并粘贴带引号的路径，兼容 PinPix 等非标准格式
  - 文件拖拽 — 文件拖到终端自动插入带引号的绝对路径，兼容含空格的路径
  - 多 Shell 配置 — Windows（cmd / powershell / pwsh）、macOS（zsh / bash）、Linux（bash / sh）等，可自由增删
  AI 进程感知
  - 实时状态检测 — 500ms 轮询子进程名，自动识别 Claude / Codex，显示 idle / working / error 状态
  - 状态聚合 — 面板 → 标签页 → 项目逐层聚合，优先级 error > ai-working > ai-idle > idle
  - 完成提醒三件套 — AI 任务从 working → idle 时立刻触发：
    - 右下角 Toast 桌面通知（仅非活跃项目弹出，同项目去重）
    - 项目列表 DONE 徽章，点击清除
    - 任务栏闪烁（Windows）/ Dock 跳动（macOS），窗口失焦时才触发
    - 三个开关独立可配
  - 会话进出检测 — 命令 echo 识别进入 AI；双击 Ctrl+C / Ctrl+D 或 exit / quit / :quit / /logout 识别退出
  - 会话历史 — 读取本地 Claude / Codex 历史会话记录，右键复制恢复命令快速续接
  - AI 任务标记 — AI 会话内每次用户按 Enter 自动在 xterm 打点，标签右上角 ⚑ 按钮下拉展示历史提交列表，点击或 Ctrl+Shift+↑/↓ 在标记间跳转，目标行短暂高亮提示
  项目管理
  - 项目列表 — 左侧边栏管理多个项目目录，一键切换工作区，重启自动恢复上次激活项目
  - 拖拽添加项目 — 从资源管理器拖拽文件夹到项目列表即可快速添加，自动识别文件 / 文件夹 / 重复项目并给出视觉反馈
  - 嵌套分组 — 最多 3 级项目分组，拖拽排序，折叠 / 展开
  - 文件树 — 集成目录浏览器，嵌套 .gitignore 置灰（每层子目录的忽略规则与 !pattern 白名单都会生效，与 git 行为一致），notify 文件监听实时刷新
  - 文件操作 — 文件树内新建文件 / 文件夹、重命名、查看内容（二进制与超大文件友好提示）
  - VS Code 快捷打开 — 文件树右上角按钮一键用配置的 VS Code 可执行文件打开当前项目，路径可在「设置 → 系统设置 → 外部编辑器」自定义
  Git 集成
  - 文件状态 — 文件树显示 Git 状态颜色（修改 / 新增 / 删除 / 冲突）
  - 变更 Diff — 工作区文件变更的详细 Diff，Hunk 行级解析，并排 / 内联双视图
  - 提交历史 — 浏览仓库提交记录，游标分页加载（默认 30 条）
  - 提交 Diff — 查看任意提交的文件变更，逐文件切换
  - 分支信息 — 本地 / 远程分支列表
  - 源码控制面板 — VS Code 风格 Changes 面板，Staged / Changes / Untracked 分组展示，支持单文件和全量 stage / unstage / discard，Ctrl+Enter 快速提交，列表与树形视图切换
  - Pull / Push — 仓库行内按钮一键同步远端，支持刷新按钮重新加载提交记录与分支信息
  - 多仓库发现 — 自动扫描项目目录下所有 Git 仓库（递归 5 层，跳过 node_modules 等）
  外观与配置
  - Activity Bar 侧边栏 — 最左侧常驻 40px 图标栏，含 Projects / Sessions / Files / Git 四个面板开关，独立控制显隐，激活态蓝色竖条指示，状态持久化
  - 三种主题模式 — Auto（跟随系统）/ Light / Dark，深色基于 Warm Carbon 暖炭色调，自定义 CSS 变量体系
  - 字体独立调节 — UI 与终端字号分别可调（10-20px），终端可选是否跟随 UI 主题
  - 布局持久化 — 分屏比例、标签页、窗口大小 / 位置自动保存，重启恢复（tauri-plugin-window-state）
  - 关闭确认 — 关闭窗口前二次确认，并 flush 所有项目布局，避免误操作
  - 版本检查 — 启动时拉取 GitHub Release，标题栏显示新版本提示
  - 设置中心 — 统一的 SettingsModal 管理主题、字体、Shell、AI 通知等所有开关
ReleaseNotes: |-
  更新内容
  这一版把注意力从「加功能」转回「用得顺手」：快捷键成体系、10 万行 scrollback 终于能搜、11 个弹窗的 Esc 行为归一。另外两件事值得单独说——远程终端里粘图片终于能被远端的 agent 读到，以及 Claude Code 这类 TUI 在终端里累积重复内容的老毛病修掉了。
  新功能
  - 全局快捷键体系 — 新建 / 关闭 / 切换终端、分屏、分屏间移焦、项目快速切换器、折叠侧栏全部有键位。键位表是唯一事实来源，同时驱动实际派发、设置页展示与界面提示，不会出现「设置页写着一个键、实际是另一个」。统一走 Ctrl+Shift+* 以避开 shell 的行编辑按键。
  - 终端内查找（Ctrl+F） — 10 万行 scrollback 从只能手滚变为可检索，支持大小写 / 全词 / 正则与命中计数。
  - 远程 SSH / WSL 粘贴自动落地（#36）— 粘贴图片和超长文本原本是「转存成本机文件、再粘路径」，这套逻辑在远程终端里是断的：粘进去的 C:\... 远端根本不存在，远端 agent 只会报文件不存在。现在会自动换算落点：
    - SSH 远程项目 — 经 SFTP 上传到远端后粘贴远端路径。默认落 <项目根>/.mini-term/pasted，选在项目内是因为 agent 对项目目录天然有读权限，不像 /tmp 那样会触发 Claude Code 的项目外路径确认；目录可在设置里改成 /tmp/mini-term、~/uploads 等。
    - WSL 项目 — 把 C:\... 换算成 /mnt/c/...，不用上传（文件本身经 automount 就能读到，缺的只是路径形式）。
    - 上传目录会自动写入一个自忽略的 .gitignore，粘图不再弄脏你仓库的 git status。
  - 首启引导 / Sessions 直接 resume / 抽屉内面板切换 — 首次启动给一条上手路径；会话列表可直接续接而不必手动复制命令。
  体验改进
  - 弹窗行为统一 — 新增共享 overlay 栈接管 Esc / 遮罩关闭、焦点陷阱与焦点还原，11 个弹窗规则归一；命令式弹窗与右键菜单纳入同一栈，Esc 只作用于最上层。
  - 关窗确认改为条件触发 — 只在真有活终端时才问，并列出将被终止的 AI 会话；没有终端时不再多问一句。
  - 无障碍 — 状态点改为形状 + 颜色双编码（不再只靠颜色区分），新增 :focus-visible 焦点环，项目列表 / 文件树 / 右键菜单支持键盘操作。
  - 字号随「界面字体大小」缩放 — 此前写死 px 的地方不跟随设置，两套皮肤 CSS 一并修正。
  - i18n 补齐漏网文案 — 面板标题、Git 面板、分屏 tooltip、状态枚举名等。
  问题修复
  - AI 终端 scrollback 累积重复内容 — 此前把 TUI 摁在主缓冲区，Ink 类 TUI（Claude Code）界面比窗口高时，相对光标上移够不到已滚入 scrollback 的帧首，每帧都留下擦不掉的残留，滚轮转发给 TUI 触发额外重绘后尤其明显。现在放行 alternate screen 切换，让 TUI 回到备用缓冲区原地重绘。
  - 设置图标画错了 — 原先是「中心小圆 + 8 条放射短线」，那是太阳 / 星芒的画法；改为闭合的 6 齿轮廓 + 轴孔（齿数取 6 是因为图标实际只有 18px，齿少才咬得出形状）。
  - AI 运行中的状态点纹丝不动 — 形状是 spinner 却不转，看上去像卡死的加载指示器。顺带修了 prefers-reduced-motion 一刀切把它也停掉的问题：进行中指示器传达的是状态本身而非装饰，改为放慢到 2.4s 继续循环；闪烁类动效仍照常停用。
  - 终端标签宽窄不一 — 状态点 + 标题 + 关闭按钮作为一组居中，左右 padding 对称并给出最小宽度。
  - 快捷键漏进 PTY、右键菜单抢焦点、分屏竞态下产生孤儿 PTY 等审查发现的缺陷。
  内部变更
  - 删除项目级 tab 死状态层 — ProjectState 由 tabs[] 收敛为单棵 layout 树（界面上从来没有那层的切换入口）。旧配置的多 tab 布局在迁移时把 pane 合并进保留树而非丢弃，不会丢你的终端。
  - 一并删除无人消费的 togglePanel 与四个 *Visible 字段（含 Rust 侧）。
  已知限制
  - 图片粘贴仍只在 Windows 可用（read_clipboard_image 只有 Windows 实现），macOS / Linux 下远程粘图会回退到 Alt+V 而对远端无效。长文本转存与 WSL 路径换算不受此限。
  - 远端上传目录不会自动清理（本机临时文件有 24 小时清理）。
  下载

  | 平台                  | 产物                                                                                      |
  | --------------------- | ----------------------------------------------------------------------------------------- |
  | Windows               | Mini-Term_0.8.0_x64-setup.exe（推荐）· Mini-Term_0.8.0_x64_en-US.msi                      |
  | macOS (Apple Silicon) | Mini-Term_0.8.0_aarch64.dmg · Mini-Term_aarch64.app.tar.gz                                |
  | Linux                 | Mini-Term_0.8.0_amd64.AppImage · Mini-Term_0.8.0_amd64.deb · Mini-Term-0.8.0-1.x86_64.rpm |

  macOS 提示：产物未经 Apple Developer ID 签名，双击可能提示「已损坏，移到废纸篓」。把 .app 拖入 /Applications 后执行一次 xattr -cr /Applications/Mini-Term.app 即可正常启动，每次升级后需重新执行。
