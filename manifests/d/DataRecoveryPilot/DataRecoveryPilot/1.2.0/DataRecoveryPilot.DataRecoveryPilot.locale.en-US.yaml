ShortDescription: Recover deleted, formatted and lost files on Windows, with every file verified.
Description: |-
  Data Recovery Pilot recovers deleted, formatted and lost files on Windows 10 and 11 from hard drives, SSDs and NVMe drives, USB flash drives and SD or microSD cards.
  A quick scan restores original file names and folders, including emptied Recycle Bin items; a deep scan reads every sector for formatted, RAW or damaged drives.
  Every deleted file is checked start to end and labelled Recoverable, Damaged or Overwritten before you recover it.
  Scanning, deep scanning and preview are free; a license is needed to save recovered files.
