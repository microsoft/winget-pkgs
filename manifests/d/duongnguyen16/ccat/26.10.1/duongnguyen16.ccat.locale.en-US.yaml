ShortDescription: Launch Claude Code on Google Antigravity or any Anthropic-compatible provider.
Description: |-
  ccat is a small native launcher for Claude Code. Pick a provider profile and a folder, and it runs claude in your terminal against that provider, with no config files to edit.
  It includes a built-in proxy that serves Google Antigravity accounts (Gemini, Claude, GPT-OSS) to Claude Code, with Google Search for WebSearch, image generation and automatic account rotation. Any Anthropic-compatible endpoint can be added as a custom provider.
  Requires Claude Code (claude) on PATH.
