ShortDescription: Reads a SQL Server database and designs the data warehouse it implies, with the T-SQL to build it.
Description: |-
  Netune is a desktop tool for SQL Server. Point it at a database and it
  profiles the real data rather than reading the schema alone: it classifies
  every table as a fact, a dimension, a bridge or none of those, scores eight
  warehouse-modelling methodologies against what it measured - Kimball, Inmon,
  Data Vault 2.0, Medallion, Galaxy, One Big Table, Anchor Modeling and
  Activity Schema - and shows the evidence for each rather than a verdict.

  You choose a methodology, answer the two questions only a person can answer
  (the grain of each fact, and how much history each dimension keeps), and
  Netune draws the target design on a canvas you can edit, then writes the
  T-SQL that creates it. The staging layer can be created and filled from
  inside Netune, in a database you name - never the one it read from.

  It runs on your own machine and opens in your browser. There is no account,
  no telemetry and no service behind it. An optional local language model
  suggests readable names and answers questions about your schema; it never
  decides any part of the design.

  This is the free edition. The full one adds the load procedures, the
  warehouse deploy, the landing zone and scheduled jobs.
