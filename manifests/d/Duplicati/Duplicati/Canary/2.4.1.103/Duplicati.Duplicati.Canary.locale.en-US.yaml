ReleaseNotes: |-
  This release is a canary release intended to be used for testing.
  PostgreSQL databases as a source
  A backup can now use a PostgreSQL database as its source. Duplicati reads the database with pg_dump and stores each table as its own entry, so a restore can pick single tables. PostgreSQL 14 to 18 is supported, and the client programs of the server's version must be installed, or found with --postgresql-client-path.
  A restore can load the whole database, or only the rows of chosen tables with --postgresql-restore-mode=tables, and the rows are loaded as they are restored, so nothing the size of the database is written to disk. The root certificate for a verified TLS connection can be given as a file or as text with --postgresql-sslrootcert-content, and --postgresql-max-database-size stops a backup of a database that has grown larger than expected.
  The new UI can pick PostgreSQL as a remote source and as a restore destination, check the permissions of the role, and count the tables and their size before the backup is saved.

  Full disk backup is open source
  The full disk backup source was moved out of the proprietary part of Duplicati and is now open source under the MIT license.

  Running backups in order, and after the queue
  - A backup can be set to run after another backup, when that one succeeds or always. Chains and one backup starting several others are supported, and a loop is refused.
  - The server can shut down or restart the computer, or run the script from the post-queue-processing-script setting, once the queue of backups has run empty. The new UI has a "Start all" button that queues every enabled backup, and can choose such an action for when they are done, thanks @JamBalaya56562.
  - The backup menu in the new UI has "Skip next run", which moves the schedule past the next run without disabling the backup, thanks @JamBalaya56562.
  - --skip-missed-scheduled-backups skips a scheduled run that is more than 10 minutes late, such as one missed while the machine was off, instead of starting it right away, thanks @JamBalaya56562.
  - --min-time-between-scheduled-runs skips a scheduled run when the last run finished less than the given time ago, so a backup that runs longer than its interval does not start again at once, thanks @JamBalaya56562.
  - --run-skipped-on-ac-power queues a backup that --disable-on-battery skipped once the machine is on AC power again, thanks @JamBalaya56562.

  Changes to be aware of
  - Saving a job through the API now keeps each field the request leaves out, such as the operation type, target, filters, tags and schedule. A client that sent only some fields cleared the rest, and the "Suppress" button on a log warning turned a sync job into a backup job. A field that is sent, also empty, is applied as before, thanks @JamBalaya56562.
  - --sync-then-delete now also deletes the remote folders that are gone from the source, with everything in them. Box, Dropbox, Google Drive, OneDrive, S3 and iDrive e2 delete a folder in one call. A destination with snapshot folders is refused.
  - The scheduler options are no longer listed for the command line, where they had no effect. They still work from the UI and the server.
  - Masking the secrets of a target URL, and removing them on export, now changes only the secret values. The URL was rebuilt, which decoded encoded separators, joined repeated parameters and dropped empty ones, so saving a job without changes could change its URL. A password in the user info of a URL (user:password@host) is now masked as well, thanks @JamBalaya56562.
  - An exported configuration now includes the global advanced options in their own field. An import ignores them by default, and can merge them into the backup or apply them to the server, thanks @JamBalaya56562.

  New backup options
  - --max-backup-runtime stops a backup after it has run the given time, and saves it as a partial backup that the next run continues, so a long first backup does not block the queue, thanks @JamBalaya56562.
  - --keep-missing-sources keeps the files of a local source folder that does not exist, such as a disconnected drive, from the previous version, instead of recording them as deleted, thanks @JamBalaya56562.
  - --skip-files-smaller-than leaves out files below the given size, thanks @JamBalaya56562.
  - --disable-filetime-check-for reads the files that match a filter on every backup, for encrypted containers that keep their time stamp and size when changed, thanks @JamBalaya56562.
  - --remote-filename-suffix appends a suffix to the name of each remote file, for storage that refuses some file types, thanks @JamBalaya56562.
  - --gpg-encryption-recipient encrypts GPG volumes to a public key, and --gpg-encryption-cipher-algo chooses the cipher, thanks @JamBalaya56562.
  - --truncate-before-delete empties a remote file that cannot be deleted and tries again, for full copy-on-write file systems such as ZFS and Btrfs, thanks @JamBalaya56562.
  - A full backup that follows a partial backup is now uploaded even when nothing changed, so the latest version is not left partial, thanks @JamBalaya56562.
  - The paths of deleted files and folders are now logged at the verbose level, so a report can list them, thanks @JamBalaya56562.
  - Case-insensitive filters and the SMB transport option now work under the Turkish culture, thanks @menes97.

  Restore
  - A restore can be downloaded in the browser instead of written to a folder. A single file is downloaded as it is, several in a zip file. --webservice-disable-restore-download turns this off, thanks @JamBalaya56562.
  - --restore-files-modified-after restores only files modified after a date, or an interval back from now, thanks @JamBalaya56562.
  - A restore of millions of files uses much less memory. The files are read in batches, the block counts are kept in compact arrays, and each block gets a buffer that fits it. --restore-temp-tables-on-disk keeps the temporary tables in a file instead of in memory, thanks @JamBalaya56562.
  - The restore page in the new UI offers to continue a direct restore that was left, as long as the server still has it, thanks @JamBalaya56562.
  - A stopped restore left decrypted temporary files behind, thanks @JamBalaya56562.

  Retention, compact and repair
  - --retention-policy-minimum-versions always keeps at least the given number of versions, thanks @JamBalaya56562.
  - --retention-policy-delete-partials lets the retention policy delete partial backups that have a full backup before and after them, thanks @JamBalaya56562.
  - Compact now reports its progress, so a long compact no longer looks stalled, thanks @JamBalaya56562.
  - A repair that recreates a missing dblock now reads locked source files through a VSS or LVM snapshot, thanks @JamBalaya56562.
  - A dry-run repair changed the local database, and failed without a local database. Both are fixed, thanks @JamBalaya56562.
  - The number of versions and the destination size are updated after a repair, thanks @JamBalaya56562.
  - A recreate now processes only the new blocklists after each block volume, and the experimental recreate works again, thanks @JamBalaya56562.

  Storage providers
  - WebDAV can authenticate with a client certificate, with --webdav-client-certificate and --webdav-client-certificate-password, thanks @JamBalaya56562.
  - --googledrive-use-trash moves deleted files to the trash, which the Content manager role of a shared drive is allowed to do, thanks @JamBalaya56562.
  - --list-verify-uploads now looks up the single file on local folders and S3 instead of listing the whole folder, thanks @JamBalaya56562.
  - FTPS uploads to vsftpd over TLS 1.3 failed on Windows. The automatic choice now switches to Bouncy Castle in that case, thanks @JamBalaya56562.
  - A sync to the root of an SMB share gave two warnings about the . and .. entries, thanks @JamBalaya56562.
  - Box can work with files below the backend folder, iDrive e2 accepts nested names, and S3 V1 listings continue correctly when the server leaves out the marker.

  Reports and scripts
  - Reports can use %BeginTime%, %EndTime% and %Duration%, thanks @JamBalaya56562.
  - Telegram reports are sent in the body of a POST, and a long report is split so each part fits the message limit without cutting a character in two, thanks @JonathanGodley and @JamBalaya56562.
  - Scripts get the sources of the job in DUPLICATI__BACKUP_SOURCES, and the names of options changed by a run-script-before script are logged, thanks @JamBalaya56562.
  - On Windows, .ps1 scripts are run through PowerShell, thanks @JamBalaya56562.

  Server and command line
  - Ctrl+C now stops the running command line operation, a second press aborts it, and a third ends the process, thanks @JamBalaya56562.
  - duplicati-server-util has an update-backup command that changes parts of a backup from a JSON file, and the import can expand %VAR% environment variables with --expand-env-vars, thanks @JamBalaya56562.
  - The TrayIcon follows the server over the websocket, and its tooltip shows the running backup and the result of the last run, thanks @JamBalaya56562.
  - A Time Machine snapshot on macOS could not be found when other snapshots were listed after it, thanks @Marukome0743.
  - The result of an update check is reported, so a client can show why a check failed, thanks @JamBalaya56562.
  - The system information reports whether the database is encrypted and where preload.json is read from, thanks @JamBalaya56562.
  - Windows no longer loads Mono.Unix.

  Current user interface (ngclient)
  - A new page compares two versions of a backup, and a log entry of a backup can be compared with the version before it, thanks @JamBalaya56562.
  - The menu of a backup is now a dialog with the available commands.
  - The source list shows remote and local sources alike, with an icon for the kind of data, and the folder a shortcut such as %HOME% points to, thanks @JamBalaya56562.
  - The settings page can upload an HTTPS certificate, and the theme can follow the system or the server default, thanks @JamBalaya56562.
