PackageIdentifier: doubinanberwan.SingBoxWinUI
PackageVersion: 1.0.0
PackageLocale: zh-CN
Publisher: doubinanberwan
PackageName: SingBoxWinUI
ShortDescription: 基于 .NET 8 + WinUI 3 的 Windows 原生 sing-box 客户端
Description: |-
  SingBoxWinUI 是一款基于 .NET 8 与 WinUI 3 的 Windows 原生图形客户端，用于管理 sing-box 内核。
  支持一键启停、规则 / 全局 / 直连模式、系统代理与 TUN、节点测速与选择记忆、订阅与规则集管理、
  活动连接与实时日志、后台轻量模式、内核在线热更新，以及本地 / WebDAV 备份恢复。
  安装包内置 sing-box 内核与基础规则集，装完即可使用；不内置任何代理节点或订阅信息，请自备订阅地址。
