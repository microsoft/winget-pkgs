License: MIT
ShortDescription: Native portable Windows GUI client for sing-box
Description: |-
  SingBoxWinUI is a native Windows desktop client for the sing-box core, built with .NET 8 and WinUI 3.
  It provides one-click core start/stop, rule / global / direct modes, system proxy and TUN support,
  proxy group selection with latency testing and selection memory, subscription and rule-set management,
  live connection and coloured log views, a low-memory background mode, in-app core hot updates and
  ZIP / WebDAV backup and restore. The installer bundles the sing-box core and basic rule sets so it
  is ready to use after setup. No proxy nodes, subscriptions or credentials are bundled.
Moniker: singboxwinui
