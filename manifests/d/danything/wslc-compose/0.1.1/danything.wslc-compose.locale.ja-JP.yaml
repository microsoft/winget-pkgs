# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: danything.wslc-compose
PackageVersion: 0.1.1
PackageLocale: ja-JP
Publisher: danything
PackageName: wslc-compose
ShortDescription: compose.yaml を WSL コンテナ (wslc) で動かす
Description: |-
  wslc-compose は、docker compose のファイルを Microsoft の WSL コンテナ (wslc) で動かすツールです。
  wslc には compose も Docker 互換 API もまだないため、docker compose のよく使うコマンド
  (up / down / ps / logs / build / exec / run など) を実装し、wslc.exe を直接呼び出します。
ManifestType: locale
ManifestVersion: 1.12.0
