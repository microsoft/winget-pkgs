ShortDescription: Desktop database tool for PostgreSQL, MySQL, SQLite and more.
Description: |-
  DbRover is a native desktop database tool written in Rust. It connects to PostgreSQL,
  SQLite, MySQL, MariaDB, SQL Server, DuckDB, ClickHouse, Redis, Valkey and MongoDB, with query
  consoles, a results grid that edits rows, exports in the common formats, schema dialogs, SSH
  tunnels, a query history and a read-only MCP server for AI assistants.
