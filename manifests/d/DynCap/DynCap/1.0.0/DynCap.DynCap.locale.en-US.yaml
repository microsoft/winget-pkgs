ShortDescription: Animated, word-by-word captions for your videos, made offline on your PC
Description: |-
  DynCap creates animated, word-by-word captions like the ones on Reels, Shorts and TikTok.
  It turns speech into text on your own computer, so videos are never uploaded. Edit the words like a document, pick a style, colours and animation, then export a finished MP4 or a transparent overlay for Premiere Pro and other editors.
  The free version includes 3 caption styles with no watermark. A one-time Pro upgrade unlocks all 9 styles, custom animations, keyword highlights, emoji and presets.
