Description: 'DFdiscover is our complete suite of desktop apps for power users who need access to study setup and administration. It includes: DFexplore, DFsetup, DFadmin, DFsend, DFbarcode, DFATK + command-line tools (DFattach, DFaudittrace, DFbatch, DFexport, DFpass, DFpdfpkg, DFreport, DFuserPerms).'
ReleaseNotes: |-
  Includes fixes to DFdiscover server, DFexplore, DFweb, DFcollect, and documentation to resolve known issues and fix reported bugs.
  Server & Desktop
  - Resolved an issue where time fields in DFexplore required users to manually enter the colon separator instead of accepting numbers only. Time fields now auto-format numeric input as expected, matching prior 5.10 behavior.
  - Page labels now fully support multiple field substitutions per label as defined in the Page Map, for example displaying both the AE term and date in the Adverse Event page label. The Study Setup User Guide’s Page Map section has also been updated.
  - An issue was resolved in DFsetup where the app could become unresponsive after closing the Preview dialog in the field help editor.
  - Fixed a server-side issue where saving license-related configuration, such as feature limits or the number of administrator seats, could reset the recorded usage for users who were already connected.
  - Fixed a server-side issue where changes to the 2FA method (Email/SMS) in DFadmin did not persist for ePRO user accounts created prior to version 5.11 when no other user settings were modified simultaneously.
  DFweb
  - Fixed an issue where DFweb treated CRF fields containing only delimiters as non-empty, causing incorrect reason values, unnecessary save warnings, and bypassed required field checks. Delimiter-only values are now cleared before processing.
  - Fixed an issue in DFweb where dfneed results from the DFopen_patient_binder edit check were not applied to visits added to the subject binder after saving a CRF at a repeating visit. New visits now correctly reflect dfneed changes.
  - Fixed an issue in DFweb where a user could not attach a document to a data record at a workflow level outside their write permissions. The data record’s workflow level is now updated when the attachment is saved.
  - Improved DFweb form navigation on Android tablets by replacing the keyboard Next action with Done. This keeps the active field and input focus synchronized when moving through data fields on a page.
  - DFweb now trims leading and trailing whitespace from the username field before submitting login credentials, preventing authentication failures caused by inadvertent spaces (e.g., when copying and pasting a username).
  DFcollect
  - Fixed an issue where DFcollect automatically added zero padding to numeric field values when no format was defined. Behaviour now matches DFexplore and DFweb, which accept and display values as entered without padding when no format is specified.
  - Fixed an issue where the Reset action in DFcollect displayed the same generic confirmation regardless of data state. The app now detects unsynced local changes and displays an explicit warning to prevent unintended data loss before reset.
  - Fixed an issue in DFcollect where field prompts for string, number, time, and date field types displayed only the first line of text in CRF view. All field prompts now support multi-line wrapping, displaying up to 1500 characters.
  - Fixed an issue in DFcollect where page labels in the subject binder view did not correctly resolve page map field value substitutions (%n, %n:d), displaying blank or placeholder values instead.
