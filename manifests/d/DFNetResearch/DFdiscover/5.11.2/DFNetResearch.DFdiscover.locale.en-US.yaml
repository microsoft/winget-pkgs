Description: 'DFdiscover is our complete suite of desktop apps for power users who need access to study setup and administration. It includes: DFexplore, DFsetup, DFadmin, DFsend, DFbarcode, DFATK + command-line tools (DFattach, DFaudittrace, DFbatch, DFexport, DFpass, DFpdfpkg, DFreport, DFuserPerms).'
ReleaseNotes: |-
  Includes fixes to DFweb, DFexplore, and DFdiscover server to resolve important issues affecting CRF attachments, data exports, reports, server-side data task retrieval, and image processing.
  - Fixed an issue where DICOM files (dicom, dcm, and dic file formats) could not be uploaded as CRF attachments in DFweb on Windows.
  - Fixed a bug where exporting multiple views to CSV or text from DFexplore’s Custom Export or DFexport could fail and close the session.
  - Resolved a server-side issue where certain data tasks combining subject criteria and expressions failed to return matching records during cross-plate retrieval due to a size limit error.
  - Fixed a bug where running DFreport via script to export HTML reports could cause the process to abort without generating the expected report.
  - Resolved an issue where certain inbound PDF submissions could fail to be processed. DFinbound.rpc now uses system Ghostscript when available, ensuring reliable PDF-to-image conversion. Ghostscript version gs-9.27 or gs-9.52 is required.
  - Fixed an issue where DFfile2image omitted annotations when converting PDF files to images, resulting in incomplete copies. Annotations are now correctly retained during image processing.
  Known Issue
  - On some systems, certain PDF files processed for image-based data entry may produce a lower-quality standard-definition image. The corresponding high-definition image is available at the expected quality and can be used to clearly view the CRF.
