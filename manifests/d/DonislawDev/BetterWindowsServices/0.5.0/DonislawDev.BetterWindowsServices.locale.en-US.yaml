ShortDescription: 'A services.msc replacement with search, dry runs, and a diff of what changed'
Description: |-
  Better Windows Services is services.msc rebuilt for people who administer Windows machines - a window and a command line over one engine. Ask the machine a question instead of scrolling: mismatch:stopped is what should be up and is not. Every stop, start, restart and start type change is shown as a plan, with the services it takes down with it, before anything runs.

  It freezes every service into a snapshot file and later says what changed since, configuration apart from what merely started or stopped, and reads from the System log who changed a start type or installed a service. It shows what services.msc hides - who signed the binary, triggers, privileges, the security descriptor, the process and its memory - and says when it could not read a field instead of showing it empty. It works on the local machine and reaches no network unless you pass --follow-network.

  The Windows installer puts Better Windows Services in the Start menu of every account, puts its folder - the window and the bws command line - on the machine PATH, and asks for administrator rights. Close the window and every bws that is running before an upgrade. With --scope user you get the portable window instead: no administrator rights, and no Start menu entry either - start it by typing BetterWindowsServices in a new terminal. The command line alone is the package DonislawDev.BetterWindowsServices.CLI. Looking needs no administrator rights, and changing a service does. The command is named bws, as is the command of Bitwarden Secrets Manager CLI. With both installed, the one found first on PATH answers, and the machine PATH comes before the PATH of an account.
