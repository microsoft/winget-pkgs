ShortDescription: 'Manage and audit Windows services from the command line, with dry runs, snapshots and a diff of what changed'
Description: |-
  bws is the command line of Better Windows Services, for scripts, scheduled tasks and CI. bws list --query asks the machine a question in the language of the search box of the window. Every stop, start, restart and start type change is a plan first and can be previewed with --dry-run.

  It freezes every service into a snapshot file and later says what changed since, configuration apart from what merely started or stopped, and reads from the System log who changed a start type or installed a service. Every command that reads or changes a service takes --json, every ending has an exit code of its own, and a diff that finds drift ends with 5. It works on the local machine and reaches no network unless you pass --follow-network.

  Type bws --help in a new terminal to see the commands. Looking needs no administrator rights, and changing a service does. The window, with a Start menu entry and the same command line, is the package DonislawDev.BetterWindowsServices. The command is named bws, as is the command of Bitwarden Secrets Manager CLI. With both installed, the one found first on PATH answers, and the machine PATH comes before the PATH of an account.
