ShortDescription: 'Run any Windows application at a different date, without touching the system clock'
Description: |-
  Chrono Mock starts the application you are testing as if it were another moment in time - a date in the past or the future, another time zone, a clock that stands still or runs faster - without touching the system clock. Its verdict says whether the substitution took effect, and its report lists the time channels it covered and the ones it did not.

  A second tab calculates test dates - month and quarter ends, business days, the holidays of the United States and Poland - and sends a date straight into a session.

  It is made for testing your own software. A native application gets a small library injected into its process, which antivirus software may flag. A Chromium or Electron application is driven over its DevTools protocol instead, with nothing injected.

  The Windows installer puts Chrono Mock in the Start menu of every account and the chrono command on the machine PATH, and asks for administrator rights. With --scope user you get the portable archive instead: no administrator rights, and no Start menu entry either - start the window by typing ChronoMock in a terminal. The command line alone is the package DonislawDev.ChronoMock.CLI.
