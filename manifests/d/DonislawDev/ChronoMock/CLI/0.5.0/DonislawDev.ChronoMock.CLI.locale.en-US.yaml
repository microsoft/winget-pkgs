ShortDescription: 'Run any Windows application at a different date from the command line, without touching the system clock'
Description: |-
  chrono is the command line of Chrono Mock. It starts the application you are testing as if it were another moment in time - a date in the past or the future, another time zone, a clock that stands still or runs faster - without touching the system clock, and prints a verdict that says whether the substitution took effect, with the time channels it covered and the ones it did not. Its exit code and its --json output are made for a test pipeline.

  chrono calc calculates test dates - month and quarter ends, business days, the holidays of the United States and Poland.

  It is made for testing your own software. A native application gets a small library injected into its process, which antivirus software may flag. A Chromium or Electron application is driven over its DevTools protocol instead, with nothing injected.

  Type chrono --help to see the commands. The 32-bit chrono, for 32-bit applications, is in the x86 folder beside it. The window, with a Start menu entry and the same command line, is the package DonislawDev.ChronoMock.
