ShortDescription: Finds out why this machine cannot connect to a URL, and what to run to fix it. The command line alone, for scripts and build agents.
Description: |-
  Cert Doctor finds out why this machine or this container cannot connect to a URL, and what to run to fix it. One run walks the whole path - DNS, the proxy and its PAC script, TCP, TLS - and then asks each trust store on the machine whether it trusts what the server presented: the Windows store, every Java installation, every git, curl and node, every Python and its pip. It prints the command that fixes each store that does not, and runs none of them. It connects only where you point it, and the only file it writes is the report, at the path you name.

  This package is the command line alone, for scripts and build agents. The package DonislawDev.CertDoctor has the window as well. Open a new terminal and type certdoctor followed by the address that fails, or certdoctor --help.
