ShortDescription: Finds out why this machine cannot connect to a URL, and what to run to fix it. The window and the command line.
Description: |-
  Cert Doctor finds out why this machine or this container cannot connect to a URL, and what to run to fix it. One run walks the whole path - DNS, the proxy and its PAC script, TCP, TLS - and then asks each trust store on the machine whether it trusts what the server presented: the Windows store, every Java installation, every git, curl and node, every Python and its pip. It prints the command that fixes each store that does not, and runs none of them. It connects only where you point it, and the only file it writes is the report, at the path you name.

  This package is the window and the command line. WinGet installs it with the Windows installer, for every account on the machine, and asks for administrator rights. That puts Cert Doctor in the Start menu and certdoctor-gui and certdoctor on PATH, so the package DonislawDev.CertDoctor.CLI is not needed beside it. With --scope user it needs no administrator rights, but WinGet installs the window's archive instead, which has no Start menu entry - open a new terminal and type certdoctor-gui.
