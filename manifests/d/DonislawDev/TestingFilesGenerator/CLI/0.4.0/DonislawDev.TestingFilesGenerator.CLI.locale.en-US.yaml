Description: |-
  Testing Files Generator makes real files to test against - an upload form, a parser, anything that takes a file. Pick a format and a size and you get a file of exactly that size, to the byte, that a real reader opens. Every run also writes a manifest saying what your system should do with each file. It runs entirely on your machine.

  This package is the command line, for scripts and pipelines. The desktop window is the package DonislawDev.TestingFilesGenerator. Type tfg help to see the commands. Upgrade it when tfg is not running. WinGet cannot replace tfg while it runs, so it stops half way, and the package works again once the upgrade runs after tfg has finished.
