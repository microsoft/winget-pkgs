# a symbolic link in its links folder, and the window started that way cannot
# find the software renderer in the opengl folder beside the real file - the
# program looks for it next to the path it was started from. With it, WinGet
# makes no link and puts this package's own folder on PATH instead
# (PortableInstaller.cpp in winget-cli, read 2026-09-25). The command line does
# not need it, but without it the shape depends on the machine: a link where
# symbolic links are allowed, the folder on PATH where they are not. One shape
# is one thing to test.
