ShortDescription: Real test files at any exact size, with a manifest saying how your system should react. The desktop window.
Description: |-
  Testing Files Generator makes real files to test against - an upload form, a parser, anything that takes a file. Pick a format and a size and you get a file of exactly that size, to the byte, that a real reader opens. Every run also writes a manifest saying what your system should do with each file. It runs entirely on your machine.

  This package is the desktop window. WinGet installs it with the Windows installer, for every account on the machine, and asks for administrator rights. That puts it in the Start menu and puts both tfg-gui and the command line tfg on PATH, so the package DonislawDev.TestingFilesGenerator.CLI is not needed beside it. Started from the Start menu, the window offers a tfg-out folder in your user profile. With --scope user it needs no administrator rights, but WinGet installs the archive instead, which has no Start menu shortcut. Open a new terminal and type tfg-gui, and the window offers a tfg-out folder in the directory it was started from. An install made before this package had the installer stays without a shortcut when it is upgraded. Uninstall it and install it again to get one. Close the window before you upgrade. Without the installer WinGet cannot replace a running program, so it stops half way, and the package works again once the upgrade runs with the window closed.
