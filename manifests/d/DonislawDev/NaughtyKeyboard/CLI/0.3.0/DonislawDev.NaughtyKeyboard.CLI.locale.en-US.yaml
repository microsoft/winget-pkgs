ShortDescription: Types the values that break your forms into the field you are in, and prints and checks the packs they come in. The command line, for scripts and pipelines.
Description: |-
  Naughty Keyboard is a tool for testers and developers. One shortcut types the next awkward value into the field in front of you - null, a trailing space, a zero-width space, 30.02.2026, =1+1, a name of 65 535 characters. They are the values real users and real data produce. Every value comes with what it usually breaks and what a correct application does instead, and one more shortcut copies a report block to paste into a ticket. It runs entirely on your machine and sends nothing over the network.

  This package is the command line, for scripts and pipelines. The palette window, with a Start menu entry, is the package DonislawDev.NaughtyKeyboard, and it carries nkb as well. Open a new terminal and type nkb --help to see the commands.
