ShortDescription: Types the values that break your forms into the field you are in, with one shortcut. The palette window.
Description: |-
  Naughty Keyboard is a tool for testers and developers. One shortcut types the next awkward value into the field in front of you - null, a trailing space, a zero-width space, 30.02.2026, =1+1, a name of 65 535 characters. They are the values real users and real data produce. Every value comes with what it usually breaks and what a correct application does instead, and one more shortcut copies a report block to paste into a ticket. It runs entirely on your machine and sends nothing over the network.

  This package is the palette window. WinGet installs it with the Windows installer, for every account on the machine, and asks for administrator rights. That puts the palette in the Start menu and puts both nkb-gui and the command line nkb on PATH, so the package DonislawDev.NaughtyKeyboard.CLI is not needed beside it. With --scope user it needs no administrator rights, but WinGet installs the archive instead, which has no Start menu entry - open a new terminal and type nkb-gui. An install of the archive stays the archive when it is upgraded. Close the palette before you upgrade, because a program that is running cannot be replaced.
