ReleaseNotes: |-
  - Read the blogpost: https://imageglass.org/news/introducing-imageglass-10-rebuilt-for-speed-and-cross-platform-support-107
  📝 Changelog (since v10.0.5.825)
  New
  - ImageGlass.SDK 1.2.0:
    - Bumped plugin ABI version from 1.0.0 to 1.2.0
    - Added photo metadata IGHdrTransferFn.ScRgb to support rendering HDR images from codec plugins
    - Added new API DecodeStaticRasterScaled to request scaled image for thumbnails from codec plugins
  - linux: Added support for .AppImage package #2433
  Improvements
  - core: Updated Avalonia 12.1.2
  - core: Updated Magick.NET 14.17.1
  - core: Improved scrolling distance of Gallery when having large thumbnail size #2438
  - core: Allowed non-Executable custom toolbar button to create a gap on toolbar #2001
  - core: Added a placeholder icon for toolbar buttons without an icon
  - core: Disabled viewer navigation buttons when window is inactive
  - core: Improved UI of Update window, Manage license window and About window
  - core: Auto-hide inactive mouse cursor automatically when in slideshow mode
  - core: HDR tone mapping
    - Added support for HDR tone mapping from codec plugins, requires plugins built with SDK ABI 1.2.0+
    - Improved tone mapping for content peak nits
    - Renamed "White point" to "Reference white"
  Bugfixes
  - core: Instantly closing when saving could cause image corrupted #2444
  - core: Slideshow mode didn't keep system awake #2442
  - core: Mouse thumb buttons (XButton1/XButton2) were unreliable for image navigation #2393
  - core: Multiple instances caused igconfig.json access error when saving #2431
  - core: Going through gallery of images in full screen it sometimes displayed a black screen #2443
  - core: Crashed due to monitor color profile #2445
  - core: Memory leak due to gallery thumnbail metadata loading
  - core: Built-in tool background became black when using black background
  - win: MSI user scope wan't detected correctly
  - win: MSI skipped older version of Magick library
  Other updates
  - Updated APNG plugin v1.3.0
  - Updated WIC plugin v1.1.0
  Full Changelog: https://github.com/d2phap/ImageGlass/compare/10.0.5.825...10.0.6.910
