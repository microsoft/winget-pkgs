ReleaseNotes: |-
  - Cloud link and stdio MCP: after the link tray or SAP Logon restarted, a closed default connection is re-attached
    to the only open SAP GUI session of the same SAP system, client and user, instead of failing with
    INVALID_CONNECTION; the result says so.
  - Explicit connections, several or no open sessions, another system/client/user and the HTTP endpoint keep the
    previous errors.
