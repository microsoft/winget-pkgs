ShortDescription: Lets AI agents and scripts read and operate SAP GUI for Windows screens (CLI and MCP server).
Description: |-
  fairyfly lets AI agents such as Claude, and your own scripts, read and operate SAP GUI for Windows screens
  through the SAP GUI Scripting API. It opens transactions, reads screens as structured data, fills in selections
  and clicks buttons as the logged-on SAP user, with that user's own authorizations. It is a command-line tool and
  an MCP server (stdio or HTTPS), with an optional tray app and cloud link.
  This package installs per user into %LOCALAPPDATA%\Programs\fairyfly without administrator rights.
