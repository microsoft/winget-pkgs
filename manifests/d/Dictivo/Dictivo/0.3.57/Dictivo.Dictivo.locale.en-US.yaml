ShortDescription: Offline dictation for Windows and Mac. Press a shortcut, speak, and Dictivo pastes the text into the app you are using.
Description: |-
  Dictivo is a desktop dictation app. Press a global shortcut, speak, and Dictivo pastes the transcript into the active app.
  In Local mode, speech recognition runs on your computer and the audio stays there. The Tiny local model is free; every new install gets a 14-day trial of all local models without a card or an account.
  Dictivo Local is a one-time purchase that unlocks the larger local models and covers macOS and Windows x64. Cloud Fast is an optional, separate cloud transcription add-on.
