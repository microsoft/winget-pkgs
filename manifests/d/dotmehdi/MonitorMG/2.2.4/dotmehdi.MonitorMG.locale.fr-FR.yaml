ShortDescription: Gestion des écrans pour Windows - disposition, profils, luminosité et commandes DDC/CI
Description: >-
  Gérez vos écrans sous Windows 10 et 11 sans passer par les Paramètres :
  activez ou désactivez un écran, placez-le, réglez luminosité, résolution,
  fréquence, orientation, mise à l'échelle et HDR. Pilotez les commandes DDC/CI
  de vos écrans (contraste, volume, entrée, préréglage couleur, alimentation)
  depuis un panneau ouvert d'un clic sur l'icône de notification. Enregistrez
  des profils d'affichage et rappelez-les en un clic, depuis la zone de
  notification, un raccourci clavier ou une icône sur le bureau.
