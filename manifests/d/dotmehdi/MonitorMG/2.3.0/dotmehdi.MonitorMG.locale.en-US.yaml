ShortDescription: Display management for Windows - layout, profiles, brightness and DDC/CI controls
Description: >-
  Manage your displays on Windows 10 and 11 without going through Settings:
  enable or disable a display, position it, adjust brightness, resolution,
  refresh rate, orientation, scaling and HDR. Drive your displays' DDC/CI
  controls (contrast, volume, input, color preset, power) from a panel that
  opens with one click on the tray icon. Save display profiles and recall them
  in one click, from the system tray, a keyboard shortcut or a desktop icon.
