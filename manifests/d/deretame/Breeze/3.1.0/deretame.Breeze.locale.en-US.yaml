ShortDescription: Cross-platform comic reader that loads comic sources through plugins.
Description: |-
  Breeze is a cross-platform comic reader for Windows, Android, iOS, macOS, Linux and HarmonyOS.
  It does not bundle comic content: sources are provided by third-party plugins that run in a sandboxed JavaScript runtime.
  Features include bookshelf and reading history, a chapter download queue, WebDAV/S3 cloud sync, and optional neural-network image upscaling.
