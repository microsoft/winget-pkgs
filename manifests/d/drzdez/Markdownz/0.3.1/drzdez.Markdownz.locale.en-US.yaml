ShortDescription: Fast viewer for Markdown and PDF documents.
Description: |-
  Markdownz is a lightweight viewer for Markdown and PDF documents.
  It renders GitHub-flavored Markdown with Mermaid and Graphviz diagrams, KaTeX math and syntax highlighting, shows PDFs with outline and find, keeps documents in tabs with a tree-shaped history, reloads files when they change and prints with pages per sheet, booklets and two-sided options.
