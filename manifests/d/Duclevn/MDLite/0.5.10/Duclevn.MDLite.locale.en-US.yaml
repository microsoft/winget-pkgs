ShortDescription: Lightweight native text and code editor with a built-in Markdown Preview and Terminal.
Description: |-
  MDLite is a lightweight, native text and code editor for Windows (Qt 6 and Scintilla, no Electron).
  It has a built-in Preview for Markdown (tables, Mermaid and PlantUML diagrams, KaTeX math), JSON, CSV, OpenAPI, PDF and images,
  an integrated PowerShell / Command Prompt terminal, a folder Explorer with Quick Open and a Command Palette.
  Preview and Terminal are loaded only when you open them and need the Microsoft Edge WebView2 Runtime.
