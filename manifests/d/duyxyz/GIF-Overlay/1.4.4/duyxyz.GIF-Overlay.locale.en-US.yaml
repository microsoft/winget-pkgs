ReleaseNotes: |-
  What's new
  Open images from more places
  - Ctrl+V opens a screenshot, a copied file or an image link (http / https) from the clipboard in a new window. Pasted images are kept in a pasted folder next to the exe for as long as they are in the history.
  - Animated WebP and APNG now play with their own frame timing. AVIF opens as a still image when the Windows AV1/AVIF codec is installed.
  Dashboard
  - New File / View / Window / Help menu bar replaces the button strip.
    - View: sort by recently opened, name (A-Z or Z-A), or file size (largest or smallest first); the choice is remembered.
    - Window: lists the open images (click to bring one to the front) with Minimize all, Restore all and Close all windows.
    - Help: shows the current version and Check for updates (only when you click it; nothing is sent automatically).
  - Opening an image no longer hides the dashboard.
  - Right-click a thumbnail for Open, Show in folder, Copy path and Remove; right-click empty space for Add image and Paste.
  Overlay
  - Right-click menu gains Copy image (Ctrl+C), Show in folder, Always on Top and Close window. "Exit app" is now "Quit GIF Overlay". Pause / Play only appears for animations.
  - New keys: Esc closes the window, Space pauses, Up / Down change the opacity.
