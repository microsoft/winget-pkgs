ReleaseNotes: |-
  What's new
  18 interface languages
  - English, Tiếng Việt, 简体中文, 繁體中文, 日本語, 한국어, Español, Français, Deutsch, Italiano, Português, Русский, Українська, Polski, Türkçe, Bahasa Indonesia, ไทย and हिन्दी.
  - The app starts in the display language of Windows (English when it is not one of these). Change it any time under View > Language.
  Windows come back after a restart
  - The images that were open when you quit reopen at the next start, each with its position, size, opacity, lock, rotation and flips. Files that no longer exist are skipped quietly.
  - Turn it off with File > Reopen windows on start.
  GIF and animation controls
  - Speed: 0.25x to 4x with - / + or right-click > Speed.
  - Frame by frame: Left / Right step one frame (and pause).
  - Hover an animation to see the frame counter and a progress bar.
  Quality of life
  - Ctrl+Alt+G hides every image window and brings them back (also Window > Hide / show all windows). It works from any app, handy for games and calls.
  - Shift + mouse wheel changes the opacity of an image.
  - Ctrl+O adds images; the Add image dialog and drag and drop now accept several files at once (up to 10).
  - Very long file paths in drops and pastes are no longer cut off.
  Fixes and under the hood
  - A safer history file, thumbnails built in the background, and a guard so a decoder crash on one bad file no longer takes every window down.
  - More automated tests (GIF disposal and transparency, session file, translation tables) and a cleaner build.
