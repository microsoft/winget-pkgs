ReleaseNotes: |-
  What's new
  Overlay
  - Bottom-right of the hover frame stays the resize grip; the frame is now drawn on all four edges so it no longer looks lopsided (left and top are decorative).
  - New minimize and maximize buttons next to the close button. Maximize stretches the image over the monitor it is on (no moving or resizing until restored); minimize goes to the taskbar.
  - Lock Window now makes the image click-through. Hold Ctrl and click the image to unlock. A new window always starts unlocked.
  - Tiny images (icons) open at least about 128 px wide so the buttons are usable.
  Dashboard
  - Buttons moved to a bottom command strip with icons, plus a new How to use guide and a Report a bug button (opens the GitHub issues page).
  - Cleaner "open" badge on thumbnails: smaller, brighter, smoother edges.
  Performance and stability
  - Big GIFs and photos are decoded on a background thread, so the UI no longer freezes while loading.
  - Minimized windows no longer redraw (about 10% of a CPU core saved per animated GIF); images shown at native size are copied instead of resampled (about 9.7% to 0.6% of a core). Zooming uses a faster integer resampler.
  - Images that are too large to decode are rejected with an error instead of crashing the app.
  - Maximize, centering and fit-to-screen now use the monitor the window is on.
  Known issue: the WinGet submission step fails because the duyxyz.GIF-Overlay package isn't in winget-pkgs yet.
