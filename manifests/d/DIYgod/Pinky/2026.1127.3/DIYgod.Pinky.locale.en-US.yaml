ReleaseNotes: "- iPhones on iOS 16 to 17.3 now work with Pinky over a USB cable. On iOS 16, open Add phone › iPhone on a Mac with Xcode and click Install Pinky on the iPhone; when the Mac has no developer disk image for the phone, choose Download there to get one from a third-party mirror. On iOS 17.0 to 17.3, which hasn't been tried on a phone yet, start WebDriverAgent from Xcode yourself as the README describes. Thanks @jiangdada6."
