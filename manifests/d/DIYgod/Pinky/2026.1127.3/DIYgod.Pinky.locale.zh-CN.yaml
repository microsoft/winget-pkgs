ReleaseNotes: '- 通过 USB 数据线连接的 iOS 16 到 17.3 的 iPhone 现在也能用 Pinky 了。iOS 16 上，在装有 Xcode 的 Mac 上打开「添加手机 › iPhone」，点击「安装 iPhone 上的 Pinky」；Mac 上没有这台手机需要的开发者磁盘映像时，在同一页点击「下载」即可从第三方镜像获取。iOS 17.0 到 17.3 还没在真机上试过，需要你按 README 的说明自己在 Xcode 中启动 WebDriverAgent。感谢 @jiangdada6。'
