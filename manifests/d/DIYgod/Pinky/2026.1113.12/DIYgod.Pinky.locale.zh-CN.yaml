PackageIdentifier: DIYgod.Pinky
PackageVersion: 2026.1113.12
PackageLocale: zh-CN
ShortDescription: 让任何 AI Agent 在你的电脑上操作 iPhone 或 Android 手机，关键一步由你决定。
Description: Pinky 让任何 Agent（Claude Code、Claude Desktop、Codex、Cursor，或者一段脚本）通过 MCP 操作真实的 iPhone 或 Android 手机。你在电脑上看着它干活，有风险的步骤由你批准，随时可以接管，事后还能回看。审批由 Pinky 的网关执行，不靠给 Agent 的指令。
Tags:
- 安卓
- 手机
- 智能体
- 自动化
- 苹果
- 远程控制
ReleaseNotes: |-
  - 「交给 Pinky」和手机上的 Pinky 现在能记住一些内容，留给以后的任务用。任务结束后，它可能建议记下一条，比如你说过的偏好，或者某个应用里更快的做法，你点「记住」才会保存。在电脑上的「设置 › 智能体 › 记忆」和手机应用的「设置 › 记忆」里可以查看、编辑、删除，也可以关闭记忆。记忆不会保存密码、验证码、卡号、账号、证件号、电话号码或地址，每台设备各存各的。
  - 「交给 Pinky」和手机上的 Pinky 现在熟悉微信、支付宝、美团、淘宝、小红书、高德地图、Google 地图、Apple 地图、时钟、计算器和设置：打开这些应用时，会先读一份简短的指南。
