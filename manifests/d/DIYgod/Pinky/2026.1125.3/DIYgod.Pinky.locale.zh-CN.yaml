ReleaseNotes: |-
  - 现在可以让智能体在手机上输入任务给出的密码和一次性验证码，方便用测试账号登录：打开「设置 › 安全 › 允许在手机上输入密码」。每次都会先问你，除非你在那个 App 里选了始终允许；手机自己的锁屏密码始终不会输入。
  - 输入到登录框里的密码和验证码，现在在「活动」、审批、历史记录和导出中都显示为 ••••••，虚拟手机上也一样，旧版本留下的记录也会一并遮住。
