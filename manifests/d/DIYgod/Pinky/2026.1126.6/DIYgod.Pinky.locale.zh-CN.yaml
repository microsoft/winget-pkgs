PackageIdentifier: DIYgod.Pinky
PackageVersion: 2026.1126.6
PackageLocale: zh-CN
ShortDescription: 让任何 AI Agent 在你的电脑上操作 iPhone 或 Android 手机，关键一步由你决定。
Description: Pinky 让任何 Agent（Claude Code、Claude Desktop、Codex、Cursor，或者一段脚本）通过 MCP 操作真实的 iPhone 或 Android 手机。你在电脑上看着它干活，有风险的步骤由你批准，随时可以接管，事后还能回看。审批由 Pinky 的网关执行，不靠给 Agent 的指令。
Tags:
- 安卓
- 手机
- 智能体
- 自动化
- 苹果
- 远程控制
ReleaseNotes: |-
  - 通过 iPhone 上的 Pinky 连接时，打开会让屏幕转向的 App（比如在横屏游戏上打开系统设置），Pinky 不会再在屏幕转到一半时就报告画面已稳定；那时元素还在错误的位置，点按可能落空。
  - 通过 iPhone 上的 Pinky 连接时，在横屏和竖屏 App 之间切换后，读到的屏幕文字不会再来自上一个 App。
  - 通过 iPhone 上的 Pinky 连接时，元素不会再在屏幕没变的情况下换编号。
  - 批量步骤不会再误报仍在屏幕上的元素已不在屏幕上。
  - 批量步骤点按开关或复选框后，如果它没有变化，现在会停在这一步，不再接着执行后面的步骤。
  - 通过 iPhone 上的 Pinky 连接 iPad 时，回到主屏幕后 Pinky 能认出这是主屏幕，也不会再误报有键盘。
