PackageIdentifier: DIYgod.Pinky
PackageVersion: 2026.1113.1
PackageLocale: zh-CN
ShortDescription: 让任何 AI Agent 在你的电脑上操作 iPhone 或 Android 手机，关键一步由你决定。
Description: Pinky 让任何 Agent（Claude Code、Claude Desktop、Codex、Cursor，或者一段脚本）通过 MCP 操作真实的 iPhone 或 Android 手机。你在电脑上看着它干活，有风险的步骤由你批准，随时可以接管，事后还能回看。审批由 Pinky 的网关执行，不靠给 Agent 的指令。
Tags:
- 安卓
