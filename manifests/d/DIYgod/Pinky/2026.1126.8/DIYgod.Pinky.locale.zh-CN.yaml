PackageIdentifier: DIYgod.Pinky
PackageVersion: 2026.1126.8
PackageLocale: zh-CN
ShortDescription: 让任何 AI Agent 在你的电脑上操作 iPhone 或 Android 手机，关键一步由你决定。
Description: Pinky 让任何 Agent（Claude Code、Claude Desktop、Codex、Cursor，或者一段脚本）通过 MCP 操作真实的 iPhone 或 Android 手机。你在电脑上看着它干活，有风险的步骤由你批准，随时可以接管，事后还能回看。审批由 Pinky 的网关执行，不靠给 Agent 的指令。
Tags:
- 安卓
- 手机
- 智能体
- 自动化
- 苹果
- 远程控制
ReleaseNotes: |-
  - 现在可以让 Pinky 在 1、4 或 8 小时内为智能体的任务解锁手机，不用每次都问你：在「设置 › 手机」或手机画面下方的 ⋯ 菜单里为这台手机打开「免确认解锁」，确认一次即可。需要先保存手机的 PIN 码，并打开「设置 › 安全」里的「从这台电脑解锁」。感谢 @ayu2210 的建议。
  - 打开期间，只有正在运行的任务有一步发现手机锁着时，Pinky 才会输入 PIN 码，到点自动运行的定时任务不会触发；每次解锁都记在这个任务的「活动」里。PIN 码只留在 Pinky 的内存里。时间到、点手机画面下方横条里的「结束」、Pinky 退出或 PIN 码修改时，它都会结束；手机不接受 PIN 码时会立刻结束。
