ReleaseNotes: |-
  - iPhone 响应慢时（比如小程序或网页里的长列表），读屏不会再只读到几个元素：Pinky 会用手机刚推送的画面，或者再读一次；仍可能缺元素时会标明「partial」。
  - iPhone 上，网页里刚滚动进画面的文字不会再在读屏时漏掉。
  - iPhone 的无障碍服务不响应时，Pinky 读网页不会再让页面跳回顶部。
  - iPhone 的无障碍服务不响应时，从电脑解锁也能找到锁屏密码键盘。
