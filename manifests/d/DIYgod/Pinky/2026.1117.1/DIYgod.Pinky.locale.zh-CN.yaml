PackageIdentifier: DIYgod.Pinky
PackageVersion: 2026.1117.1
PackageLocale: zh-CN
ShortDescription: 让任何 AI Agent 在你的电脑上操作 iPhone 或 Android 手机，关键一步由你决定。
Description: Pinky 让任何 Agent（Claude Code、Claude Desktop、Codex、Cursor，或者一段脚本）通过 MCP 操作真实的 iPhone 或 Android 手机。你在电脑上看着它干活，有风险的步骤由你批准，随时可以接管，事后还能回看。审批由 Pinky 的网关执行，不靠给 Agent 的指令。
Tags:
- 安卓
- 手机
- 智能体
- 自动化
- 苹果
- 远程控制
ReleaseNotes: |-
  - 现在可以在「设置 › 隐私 › 录屏文件夹」里选择任务录屏保存在哪里，比如外接硬盘。新的录屏会存到那里，之前的录屏留在原处，照样能播放；点「使用 Pinky 的文件夹」可以改回来。
  - 所选文件夹不在（比如硬盘没插）或者写不进去时，录屏会先存到 Pinky 自己的文件夹，文件夹不在时设置里会提示。如果选的文件夹在 Pinky 自己的录屏文件夹里（通过链接指过去也算），Pinky 不会采用，并会说明原因。
  - 删除任务时，所选文件夹里的录屏也会一起删掉；当时硬盘没插或是只读的，Pinky 会在能删的时候再删。「删除所有活动」只删那个文件夹里 Pinky 的录屏，不会动你的其他文件。
