ShortDescription: 赛博朋克风格的网页版 BT 客户端和 PVR。
Description: |-
  TorrentOxide 是一款用 Rust 编写的可自托管网页版 BitTorrent 客户端和 PVR。它支持 .torrent 文件和磁力链接，提供分类、质量配置、Torznab 索引器、RSS 自动下载、媒体库和发布日历，通过服务器发送事件实现实时更新，下载任务可在重启后恢复。运行程序后在浏览器中打开网页界面即可使用。

  功能特性
  - 赛博朋克美学 - Torrent 客户端不一定非得长得像个办公工具。
  - 无需复杂配置 - 只需设置一个下载文件夹，运行并访问网页即可。
  - 操作简单 - 添加种子、暂停/恢复、移除，或同时删除种子及已下载的数据。
  - 支持 .torrent 和磁力链接 - 复制粘贴磁力链接并点击下载，或者上传 .torrent 文件，随你选择。
  - NAS 部署的理想之选 - 只需指向你的媒体文件夹，并根据下载的是电视剧、电影还是其他内容选择对应的子文件夹。
  - 支持基本身份验证 - 可在 .env 中设置用户名/密码来保护访问安全。如果不将其暴露到外网，也可以不设置。
  - 基于 Server-Sent Events 实现实时更新（无需手动刷新）。
  - 持久化运行 - 重启后自动恢复种子下载。
  - 内置 PVR - Sonarr/Radarr 风格的自动化功能：分类、画质配置、Torznab 索引器 + RSS 自动下载、媒体库、支持画质升级的追剧/求片列表、剧集监控以及发布日历（见下文）。
