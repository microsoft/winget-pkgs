PackageIdentifier: dividebysandwich.RustPOS
PackageVersion: 1.4.2
PackageLocale: zh-CN
ShortDescription: 轻量级的网页版销售点（POS）系统。
Description: |-
  RustPOS 是一个使用 Rust 编写的简易 Web 版 POS（销售点）系统。它极易上手，无需任何额外配置，所有功能均集成在一个独立的可执行文件中；若您想在独立的专用设备上运行主程序，它还提供可选的远程打印客户端。
  这是一个采用现代技术的简约实现。它的诞生源于作者对许多开源 POS 软件脆弱不稳定且依赖臃肿技术栈的失望。

  注意
  该项目是一个功能性的概念验证原型，尚未经过生产环境认证。它可能无法满足您当地税务部门的合规要求。在将本软件用于实际销售业务之前，请务必核对您当地的法律法规。

  功能特性
  - 通过 Web 界面完全自定义销售分类和商品
  - 支持挂账/暂结功能
  - 找零计算
  - 快捷现金支付功能
  - 销售报表生成：支持日报、月报及自定义日期范围报表，并支持导出为 CSV
  - 客户分组（拥有独立的销售报表）
  - 支持 POS 打印机（已内置于主程序中）
  - 可选的远程打印客户端（适用于专用服务器/云端部署）
  - 厨房显示屏系统
  - 用户账户与角色权限（管理员、收银员、厨师）
  - 简易库存追踪
  - PDF 菜单生成
  - 支持明亮与暗黑模式
  - 纯 Rust 解决方案
  - 基于 Leptos 和 WebAssembly 构建的 Web 界面，不含 JavaScript
  - SQLite 数据库
  - 支持多语言本地化
  - 针对触屏 POS 系统进行优化，内置屏幕软键盘
