PackageVersion: 0.4.0
PackageLocale: zh-CN
ShortDescription: 终端中的 WordStar 7 风格 Markdown 编辑器。
Description: |-
  专为现代终端重制的 DOS WordStar 7——经典的蓝色屏幕、菜单栏、标尺、状态栏，尤其是你早已熟稔于指尖的菱形控制键和 ^K/^Q/^P 组合键。文件以纯 Markdown 格式保存，让你的文稿始终易读、便于迁移且永不过时。
  它是为那些最初在 WordStar 上写作、此后便再未找到相同手感的作者而打造——但同时，他们也希望在需要时能够使用方向键、内置文件浏览器、查找替换以及实时格式预览功能。
