Description: birdnet-rs 是一款可自托管的实时声景分析工具，全天候监听麦克风，使用 BirdNET 神经网络识别鸟种，过滤误报，将检测结果存入本地数据库并保存音频片段，同时在内置网页仪表板中实时展示。启动服务程序后在浏览器中打开仪表板即可使用。随附的 BirdNET GLOBAL 6K v2.4 模型由康奈尔鸟类学实验室以 CC BY-NC-SA 4.0 单独授权，并会在首次运行时自动下载。
