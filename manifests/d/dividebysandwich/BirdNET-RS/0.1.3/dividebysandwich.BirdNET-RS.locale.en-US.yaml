ShortDescription: Realtime bird sound recognition with a web dashboard.
Description: birdnet-rs is a self-hosted, realtime soundscape analyzer that listens to a microphone around the clock, identifies bird species with the BirdNET neural network, filters false positives, stores detections in a local database, saves audio clips, and shows them live in a built-in web dashboard. Start the server executable and open the dashboard in a browser. The bundled BirdNET GLOBAL 6K v2.4 model is licensed separately by Cornell Lab under CC BY-NC-SA 4.0 and is downloaded automatically on first run.
