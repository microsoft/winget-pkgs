ShortDescription: 受 Midnight Commander 启发的终端文件管理器。
Description: Rat Commander（rc）是一款自包含的终端文件管理器，传承 Norton Commander 和 Midnight Commander 的操作习惯并加入现代功能。它提供双面板和多种视图格式、完整的鼠标支持，并内置无需外部程序的实用工具：带语法高亮的查看器和编辑器、压缩包处理、FTP/SFTP/SCP 客户端、磁盘浏览器、进程浏览器、磁盘映像和网络监视。
