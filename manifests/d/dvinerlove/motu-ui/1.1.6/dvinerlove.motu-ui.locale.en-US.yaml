ShortDescription: Unofficial control panel for MOTU M2/M4/M6 audio interfaces
Description: |-
  An unofficial open-source control panel for MOTU M2, M4, and M6 audio
  interfaces on Windows - with live meters, driver-level controls the stock
  panel hides, and editable presets. Requires the official MOTU M-Series
  driver and a connected MOTU M-series interface.
