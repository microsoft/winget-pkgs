ShortDescription: 'Find what is filling your disk and clean it up: large files, duplicates, caches, browser data and more.'
Description: |-
  Disk Mop is a disk cleanup and space recovery tool for Windows. It shows which folders take up space, finds large files, duplicate files and photos and empty folders, cleans system, app and browser caches, old downloads and the Recycle Bin, removes uninstall leftovers and manages startup apps.
  All scanning and cleaning happens locally on your PC; your files are never uploaded.
  Scanning is free and every PC gets three free deletions. Disk Mop Pro is a one-time purchase (no subscription) that unlocks full file paths and unlimited cleanup.
