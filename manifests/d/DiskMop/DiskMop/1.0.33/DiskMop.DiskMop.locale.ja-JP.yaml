Description: |-
  Disk Mop は Windows 用のディスククリーンアップ・空き容量確保ツールです。どのフォルダーが容量を使っているかを表示し、大きなファイル、重複したファイルや写真、空のフォルダーを検出します。システム・アプリ・ブラウザーのキャッシュ、古いダウンロード、ごみ箱を整理し、アンインストール後の残りファイルを削除し、スタートアップアプリを管理できます。
  スキャンとクリーンアップはすべて PC 上で行われ、ファイルがアップロードされることはありません。
  スキャンは無料で、PC ごとに 3 回まで無料で削除できます。Disk Mop Pro は買い切り (サブスクリプションなし) で、完全なファイルパスの表示と無制限のクリーンアップが利用できます。
