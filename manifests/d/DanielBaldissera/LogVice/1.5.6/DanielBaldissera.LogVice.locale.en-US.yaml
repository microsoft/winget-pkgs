ReleaseNotes: |-
  Installing an update from LogVice no longer hangs.

  - After Install, LogVice closes at once and a small Updating LogVice window shows each step: closing LogVice, installing, and starting it again.
  - If LogVice has not closed within 15 seconds, the updater closes it. Other LogVice windows from the same folder are closed too, so the installer never waits.
  - The status bar shows the download progress.

  Updating from 1.5.5: if LogVice stops responding after Install, close it and the update continues.
