ReleaseNotes: |-
  Follow an item is broader.

  - More from Intune: Store apps, remediations and platform scripts are listed next to Win32 apps. Win32 apps bring their MSI product code and Store apps their package identifier, so Windows Installer and WinGet lines are found too.
  - Installed apps: every app in Apps & features can be followed. An app that Intune deploys is shown once, with its installed version.
  - Several items at once: hold Ctrl or Shift to follow more than one in one timeline.
  - Windows events: Application, System, MDM, AppX and Windows Update events about the items are added to the timeline.
  - On a computer without the ConfigMgr client, the dialog now says so.
