ShortDescription: Log viewer for ConfigMgr, Intune and Windows logs, in the spirit of CMTrace.
Description: |-
  LogVice opens the logs an endpoint admin reads every day: ConfigMgr client and site server logs, Intune Management Extension logs, CBS, DISM and Panther logs, Windows Update ETL traces and Windows event logs.
  It reads large files in the background, merges several logs by time, follows logs as they are written, explains error codes, and can follow one application, update, package or baseline through every client log as a single timeline.
