ReleaseNotes: |-
  LogVice now tells you what changed.

  - After an update, a bar under the toolbar says so. Select What's new to read everything that changed since the version you had. The notes are built into LogVice, so they also work offline and when the update check is turned off by policy.
  - About > What's new lists every version.
  - The Update dialog shows the new version's release notes before you install.
  - Releases now come with winget manifests, built and checked by the release workflow.

  From 1.5.2 on, select Update in LogVice to install this version.
ReleaseNotesUrl: https://github.com/Baldissera88/LogVice/releases/tag/v1.5.3
