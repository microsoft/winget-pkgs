ReleaseNotes: |-
  LogVice has a new icon.

  - The app icon is now the lines of a log under a magnifier, in neon cyan and pink on navy. It replaces the synthwave sun on LogVice.exe, in the Start menu, on the taskbar, on the start page and in About.
  - With the MSI, .log, .lo_, .etl and .evtx files that open with LogVice get an icon of their own: a document with the same magnifier.
  - Both icons are drawn as vector shapes with heavier lines at small sizes, so they stay sharp in File Explorer at every display scale.

  If File Explorer still shows the old icon after the update, sign out and in again.
