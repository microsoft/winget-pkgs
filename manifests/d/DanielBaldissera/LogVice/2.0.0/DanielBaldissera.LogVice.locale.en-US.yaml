ReleaseNotes: |-
  LogVice 2.0.0 gets a new look and the same parts as TrackVice, and adds sessions, Copy for ticket, opening at a line and JSON Lines logs.

  ### New

  - **New look**: six themes (Light, Dark, Vice, Terminal, Amber and Synthwave), and System follows the Windows app mode. New installs start with Vice; if you used LogVice before, you keep the look you had.
  - **Header**: the title, a line that says what is open, and one row of buttons: Back, Forward, Start, Open, Browse, Follow, Live, Save, Reload, Lookup, Theme, Settings and Help. In a narrow window the less used buttons move into **More**.
  - **Counts**: entries, errors, warnings and information sit above the log list. Select one to show or hide those rows. The find box is on the same row.
  - **Start page**: four cards (Open a log, Browse logs, Follow an item, Look around), your recent files with search and pins, and the folders found on this PC. **Look around** opens made-up logs of a made-up laptop.
  - **Settings**: one window with subjects, a search over all settings, a mark on changed settings and **Reset** on each page (Ctrl+,).
  - **Help** (F1): Welcome, What's new, Keyboard shortcuts, Command line, Report a problem, Suggest a feature and About.
  - **Updates**: a note in the status bar says when a new version is out, with **Install**. LogVice does not check or install as SYSTEM, in Windows PE, during Windows setup or the enrollment status page, or while a task sequence runs.
  - **Report a problem and Suggest a feature**: a page shows exactly what is sent (versions, theme, log formats; never paths or log text). LogVice opens a filled-in GitHub issue, copies the text or opens an e-mail.
  - **Sessions**: **Save session** (Ctrl+S) keeps the open logs, filters, search and selected row in a `.logvice` file. **Back** and **Forward** (Alt+Left, Alt+Right or the mouse buttons) go through the logs you had open.
  - **Copy for ticket** (Ctrl+Shift+C): the selected rows as plain text, with 5 rows before and after a single row, the logs and filter at the top, and the error codes explained at the end.
  - **Open at a line**: `--line`, `--time`, `--find`, `--filter`, `--errors` and `--theme`, for example:
    `LogVice.exe "C:\ProgramData\Microsoft\IntuneManagementExtension\Logs\AppWorkload.log" --time "2026-11-24 21:21:57" --find "Contoso Timesheet"`
  - **JSON Lines**: `.jsonl`, `.ndjson` and `.json` logs with the time, level, message, component and thread in the normal columns, merged by time with other logs.

  ### Changed

  - The command bar is replaced by the header. Every button and shortcut is still there.
  - Settings is a window, not a view in the main window.
  - The Update button is replaced by the note in the status bar.
  - Home is now called Start.

  ### Fixed

  - Text in a narrow column ends with an ellipsis instead of being cut off.
  - The detail pane keeps the whole message visible in a small window.
