ShortDescription: Moves your PC to a free local IPv4 address with a double-click on the tray icon.
Description: |-
  IpBump looks for an address on your network that no other device is using, switches the network adapter to it, and puts the old address back if the new one does not work.
  A small Windows service applies the changes, so the tray app runs without an administrator prompt.
  AI agents such as Claude Code and Gemini CLI can ask for a new address through its built-in MCP server.
  Only the local (LAN) address changes; the public IP that websites see stays the same.
