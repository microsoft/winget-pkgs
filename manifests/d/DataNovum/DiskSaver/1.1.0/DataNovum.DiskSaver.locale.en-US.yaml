ShortDescription: Find important files on an old drive and archive them with verification before formatting.
Description: |-
  DiskSaver scans a connected HDD or SSD for documents, spreadsheets, presentations, photos (including RAW), archives and videos, skipping system folders and caches.
  Pick what to keep and copy it to another drive: every copy is verified by MD5, and a manifest.csv report is written to the archive.
  Categories and file extensions are customizable. The user interface is in Russian.
