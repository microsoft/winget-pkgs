PackageName: DiskSaver
PackageUrl: https://novumdata0-collab.github.io/disksaver/
License: MIT
ShortDescription: Поиск нужных файлов на старом диске и сохранение их в архив с проверкой перед форматированием.
Description: |-
  DiskSaver сканирует подключённый HDD или SSD и находит документы, таблицы, презентации, фото (включая RAW), архивы и видео, пропуская системные папки и кэши.
  Отметьте нужное и скопируйте на другой диск: каждая копия проверяется по MD5, в архив записывается отчёт manifest.csv.
  Категории и расширения файлов настраиваются. Интерфейс на русском и английском.
