ShortDescription: Run your Android phone's apps in windows on your PC.
Description: |-
  PhoneDeck opens your Android phone's apps in windows on your PC, on a virtual display, while the
  phone's own screen stays free. Pick an app from a searchable list with favorites, keep several open
  in tabs, type with your PC keyboard, click and scroll with the mouse, and drag files onto the window
  to send them to the phone. Connects over USB or wireless debugging. Built on scrcpy; scrcpy and adb
  are included. Everything runs locally: nothing is uploaded and there is no telemetry.
  Requires an Android phone with USB debugging or wireless debugging turned on.
