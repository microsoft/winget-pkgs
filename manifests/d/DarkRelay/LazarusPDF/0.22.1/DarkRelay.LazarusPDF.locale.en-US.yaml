ShortDescription: A free, local PDF editor and reader for Windows.
Description: |-
  Lazarus PDF reads and edits PDFs on your own computer. Edit text in place, annotate with highlights,
  notes, shapes, stamps and signatures, fill in and create forms, and reorder, rotate, split or merge
  pages. OCR turns scans into searchable PDFs, redaction really removes what it covers, and you can
  compare two PDFs side by side. Convert to Word, EPUB, Markdown, HTML or text, or make PDFs from
  images or a scanner. Everything runs locally: nothing is uploaded and there is no telemetry.
  Originals are never overwritten; saves always go to a new file.
