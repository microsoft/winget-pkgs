ShortDescription: Put your Spotify playlists in an order that flows, by musical key and tempo.
Description: |-
  Playlist Flow orders your Spotify playlists by musical key and tempo, so each song leads smoothly
  into the next. It shows every transition at a glance, key moves and tempo changes, and pushes the
  new order back to Spotify. Everything runs locally on your PC: there is no server and no
  telemetry. BPM and key values are estimates.
  Requires a Spotify Premium account, your own free Spotify developer app (setup walks you through
  it) and a free FreqBlog key. Playlist Flow is not made, endorsed or supported by Spotify.
