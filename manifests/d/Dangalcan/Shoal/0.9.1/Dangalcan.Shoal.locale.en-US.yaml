ShortDescription: Desktop app for managing Kubernetes clusters
Description: |-
  A desktop app for your Kubernetes clusters: local clusters with kind or k3d, resources, manifests, logs, terminals and port-forwards in one window.
  Shoal drives your clusters through tools you install separately: kubectl (required for anything cluster-related), kind or k3d plus Docker to create local clusters, and kompose for the Docker Compose migration.
