ReleaseNotes: |-
  What's Changed
  Release is v0.11.1 is a hot-fix release for v0.11.0 mainly fixing local network connections not working on Android. Besides that the changelog remains the same.
  Music playback
  Music playback has finally arrived after a long time.
  music_dashboard
  The music dashboard can be accessed by long pressing the home button and selecting music dashboard.
  Including the following features
  - Music dashboard
  - Gapless playback
  - Volume normalization
  - Fade in/out when pausing and switching tracks that are not in the same album
  - Lyrics
  - Syncing of playlist albums tracks etc.
  The music playback is probably best considered to be in beta. While everything works there can and will be small bugs/annoyances. For AndroidTV navigation of the player controls are a bit cumbersome and will be improved along with other dPad improvements
  Picture-in-Picture
  pip
  Filters 2.0 + Library search improvements
  The filters in the library search view have now been improved. Besides a lot of small bugfixes, more settings are now saved.
  - Allow setting filters for specific folders inside libraries not just libraries themselves
  - Add any saved filter to the side navigation bar
  - Setting a "default/favorite" filter that applies instead of the default behavior for that library.
  Ambient blur
  For the people that don't like black-bars around their videos there is now the option to enable "ambient blur" this generates a YouTube "theather" like blur around videos.
