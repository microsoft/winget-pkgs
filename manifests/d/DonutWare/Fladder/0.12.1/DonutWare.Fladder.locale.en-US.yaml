ReleaseNotes: |-
  📋 What's Changed
  > INFO
  > 0.12.1 is a hot-fix for Linux users, specifically those using Nvidia gpus. Flutter contained a bug causing the screen to render at 1/4 of the actual window size. Other platforms remain the same as 0.12.0
  This was supposed to be a small release that improves performance for low-end devices I swear.
  Performance Improvements
  Fladder now checks the device available RAM and adjusts accordingly disabling things that might overfill the memory, all of this can be tweaked later on by the user in Settings -> Fladder.
  There where also a lot of small performance improvements throughout the app no matter the device or settings.
  image
  Improved library filters
  - Library filters can now be added to the home-screen and/or side
  - Filter settings sync to your Jellyfin account so they are shared between devices
  - Small bugfixes to how the filters work
  Dashboard screen
  Add the option to re-order or disable items on the dashboard screens.
  These settings are saved to the Jellyfin profile
  image
  New secure option
  You can now secure a profile with a pattern lock similar to the Android secure lock.
  This works for all platforms except when using dPad navigation
  image
  Warning
  (Linux)
  Fladder now uses a new rendering backend (impeller). This gives improved performance, however on some hardware/software combinations could cause issues. If you experience any of these issues use the toggle in Settings -> Fladder to go back to the previous renderer. image
  See the full change log for any other features or fixes.
