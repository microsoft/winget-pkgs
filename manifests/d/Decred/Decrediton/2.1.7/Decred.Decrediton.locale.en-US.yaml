  <a id="dcrd-v217"></a>
  # dcrd v2.1.7 Release Notes

  This is a patch release of dcrd that includes the following notable changes:

  • Several fixes for network and mixing-related denial-of-service (DoS) attacks
  • Improved mixing performance
  • Resolves a memory leak that accumulates slowly over time
  • Corrects the test network initial synchronization issue introduced in v2.1.6
  • Adds extensive safeguards against unexpected transaction spends

  ## Upgrade Highly Recommended

  Miners, stakeholders, and anyone running a full node are strongly encouraged to upgrade to this release.  It includes multiple fixes for potential denial-of-service (DoS) attacks that could disrupt node operation.

  Miners, in particular, are at risk of having their template generation stalled.

  ## Spend Safeguards

  In response to the previous inflation bug, this release adds extensive safeguards designed to detect unexpected transaction spends that should not be possible.  When these safeguards detect certain unexpected conditions, the affected node will shut down rather than continue operating in a potentially
  unsafe state.

  These safeguards would have prevented the previous inflation bug by causing all affected nodes to halt when they encountered the invalid spend.  They are also designed to catch a broader range of potential problems that could otherwise go unnoticed.
  ## Changelog

  This patch release consists of 87 commits from 6 contributors which total to 161 files changed, 7389 additional lines of code, and 4543 deleted lines of code.

  All commits since the last release may be viewed on GitHub [here](https://github.com/decred/dcrd/compare/release-v2.1.6...release-v2.1.7).

  See  [dcrd's own release notes](https://github.com/decred/dcrd/releases/tag/release-v2.1.7) for a categorized breakdown of all commits since the last release.

