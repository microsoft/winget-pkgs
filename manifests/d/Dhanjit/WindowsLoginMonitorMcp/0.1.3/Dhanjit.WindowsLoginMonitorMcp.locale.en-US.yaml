ShortDescription: Local MCP server exposing this PC's login monitor (login log, Security events, phone-presence ping, ntfy push) to AI agents.
Description: |-
  A local-first Model Context Protocol (MCP) server that wraps the Windows
  Login Monitor on this PC. AI agents (Claude Code, Claude.ai, Cursor, any
  MCP 2025-06-18 client) can read the login log, query recent Security
  events (4624/4801), check whether the phone is on the home LAN, and push
  notifications via ntfy.sh.

  There is no application window. By default this is a stdio MCP server:
  your MCP client starts the executable and talks to it over stdin/stdout,
  so running the installed exe by hand does nothing visible and it is not
  expected to. After installing, register it with your client, for example:

    claude mcp add windows-login-monitor -- "%ProgramFiles%\WindowsLoginMonitorMcp\windows-login-monitor-mcp.exe" --stdio

  A local install has no password, no background service and no listening
  port. If you supply a public hostname during setup, it instead installs an
  HTTP server on 127.0.0.1:8765 with OAuth 2.1 (owner-key gated /authorize,
  Dynamic Client Registration, PKCE) plus a scheduled task, for use behind
  your own tunnel - Cloudflare Tunnel, Tailscale Funnel, ngrok, Caddy + DDNS.
