ShortDescription: Connects Nintendo, PlayStation, Xbox and classic controllers to Windows as virtual Xbox 360 or DualShock 4 controllers.
Description: |-
  SKZ Connect runs in the notification area and makes Nintendo (Switch 1/2 Pro Controller, Joy-Con,
  GameCube, SNES/N64/Genesis NSO, Wii Remote, Wii U Pro), PlayStation (DualShock 4, DualSense) and
  Xbox controllers work reliably with Windows games. It creates virtual Xbox 360 or DualShock 4
  controllers via ViGEmBus, supports per-game profiles, gyro aiming, turbo and macros, and hides
  the original controllers from games via HidHide.
