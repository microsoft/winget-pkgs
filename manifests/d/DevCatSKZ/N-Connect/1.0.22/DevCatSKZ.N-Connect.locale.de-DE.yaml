ShortDescription: Verbindet Nintendo-, PlayStation-, Xbox- und Retro-Controller als virtuelle Xbox-360- oder DualShock-4-Controller mit Windows.
Description: |-
  N-Connect läuft unauffällig im Infobereich und macht Nintendo- (Switch-1/2-Pro-Controller, Joy-Con,
  GameCube, SNES-/N64-/Genesis-NSO, Wii-Fernbedienung, Wii U Pro), PlayStation- (DualShock 4, DualSense)
  und Xbox-Controller zuverlässig für Windows-Spiele nutzbar. Es erzeugt virtuelle Xbox-360- oder
  DualShock-4-Controller über ViGEmBus, unterstützt Profile pro Spiel, Gyro, Turbo und Makros und
  versteckt die Original-Controller per HidHide vor Spielen.
