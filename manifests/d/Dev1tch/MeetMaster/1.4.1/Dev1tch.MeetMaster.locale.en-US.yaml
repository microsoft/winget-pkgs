ShortDescription: A meeting transcriber for Google Meet. It joins your calls and saves every word as text, with speaker names and times.
Description: |-
  MeetMaster is a meeting transcriber for Google Meet on Windows 11. When you open a Meet call in Chrome, Edge or Brave, it sends in a notetaker that saves Meet's live captions as plain text, with speaker names and timestamps, in Documents\MeetMaster. No audio or video is recorded, and it works with any Google account, Gmail included.
  It can take notes for calendar meetings you missed, covers 14 caption languages, and with your own API key lets Claude, ChatGPT, Gemini, Grok or Meta's Muse answer questions about any meeting.
  It needs Google Chrome. A week to try it on each computer, then a subscription.
