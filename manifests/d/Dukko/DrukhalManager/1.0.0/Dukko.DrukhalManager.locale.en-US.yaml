ShortDescription: A Stellaris mod manager that can merge conflicting mods with AI.
Description: |-
  DrukhalManager manages Stellaris mods: load orders, collections and Paradox Launcher playsets. It shows every file and object that more than one mod changes, says which version the game ends up using and why, and can merge two conflicting versions with Claude or any OpenAI-compatible model into a patch mod that loads last. A fork of Irony Mod Manager, rewritten in Rust and GTK 4.
