ShortDescription: Download manager for Windows that splits each file across up to 32 connections, picks up after drops and saves videos.
Description: |-
  Haul is a download manager for Windows 10 and 11. It splits each file across up to 32 connections and picks up where it stopped after a dropped line, a sleeping laptop or a restart. If the file changed on the server meanwhile, it starts over instead of joining two versions.
  Its browser extension for Chrome, Edge, Brave, Opera, Vivaldi and Arc hands downloads to Haul and adds a Download video button on media pages. Haul saves HLS and DASH streams and videos from many sites in the quality you pick, and refuses DRM-protected ones.
  Queues run on a schedule and can shut down the PC when they finish. There is a speed limiter, a Site Grabber that collects every matching file on a site, proxy support (HTTP, HTTPS, SOCKS4/5, PAC) and an importer for IDM .ef2 download lists. 8 themes, 10 languages, no ads, toolbars or bundled offers.
