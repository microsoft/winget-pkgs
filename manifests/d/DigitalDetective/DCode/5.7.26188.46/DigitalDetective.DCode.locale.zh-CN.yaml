Description: DCode 是一款免费的取证实用工具，可将桌面和移动设备上发现的时间戳数据转换为人类可读的时间戳。它支持来自各种操作系统和平台的 69 种不同的时间戳格式，包括小端和大端十六进制、64 位和 32 位整数、双精度浮点数以及文本格式。它还支持时区转换，可显示 UTC（Zulu）时间以及基于所选时区转换后的本地时间，并可将时间戳编码为多种不同的格式和数据类型。
