ShortDescription: A free forensic utility for converting data found on desktop and mobile devices into human-readable timestamps.
Description: DCode is a free forensic utility that converts timestamp data found on desktop and mobile devices into human-readable timestamps. It supports 69 different timestamp formats from various operating systems and platforms, including Little-Endian and Big-Endian hexadecimal, 64-bit and 32-bit integers, double-precision floating-point numbers, and text formats. It also supports time zone translation, showing UTC (Zulu) times and converted local times based on the selected time zone, and can encode timestamps into a number of different formats and data types.
