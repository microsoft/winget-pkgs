ReleaseNotes: 'Tree view staging with ignore paths, side-by-side diff (whitespace ignored by default), changeset explorer with load more history, redesigned checkin with two confirmations, multi-select get latest, vim-style keys and : command mode, edit files in any installed editor, status dashboard, --version flag. Fixes: never check in without file arguments, /noprompt on checkin and resolve, tf status scoped to the current folder.'
