ShortDescription: Keeps your screen from locking while the PC is idle. Zero setup.
Description: |-
  StayLit finds by itself when Windows would lock or turn off the screen - set by your company, by you or by the
  power settings - and makes one tiny, invisible mouse move just before. While you use the PC, it does nothing.
  One click to pause or resume. No admin rights, no data collection.
Moniker: staylit
