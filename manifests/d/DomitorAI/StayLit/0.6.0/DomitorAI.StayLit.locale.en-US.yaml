- keep-awake
- screen-lock
- screensaver
- idle
- tray
- utility
ReleaseNotes: |-
  First public version.
  
  - Keeps the screen from locking while the PC is idle: StayLit finds the lock time set by your company policy,
    screen saver or power plan, and moves the mouse 1 pixel and back right before it.
  - Does nothing while you work; pauses on battery (can be turned off).
  - Installs, updates and uninstalls itself for the current user, without admin rights; nothing is left behind.
  - Tells you when a new version is out; one click updates it (checked once a day, can be turned off).
  - Tested on Windows 10 and Windows 11, on domain-joined PCs with a 10-minute screen-saver policy.
