ShortDescription: Free planner with tasks, habit streaks, a Pomodoro focus timer, drag-and-drop time blocking and rewards you set.
Description: |-
  Dabadoro puts a to-do list, habit tracker, Pomodoro focus timer and day planner in one window. Finished tasks and habits pay coins for rewards you set.
  Drag a task or habit onto your day and drop it into the hour you want. Pick a task and press Space, and the focus time lands on that task. A floating timer stays on top of your other windows (a Pro feature, open to everyone for now).
  Habits repeat on a cadence or on chosen weekdays, with streaks and a yearly heatmap. Analytics show completions, focus time, coins and streaks by day, week, month or year.
  The AI Command Center has 8 specialist agents that draft a plan of tasks and habits you review before adding. Free accounts get 1 plan generation per day.
  Your data is saved on your computer first, then synced to your free account. Dabadoro works offline after the first sign-in.
  Free. Optional Pro and Max plans are planned but not on sale yet. Built with Tauri by an independent developer.
