ShortDescription: Adaptive native Rust + OpenGL 3.3 & WebGL desktop wallpaper that reshapes around your desktop icons locally.
Description: >-
  DiyarDesk renders adaptive desktop landscapes behind your Windows desktop icons
  using a zero-WebView2 native Rust + OpenGL 3.3 Core engine alongside portable
  HTML5/Canvas/WebGL scenes — with no cloud accounts or telemetry. Includes 28
  built-in themes, custom theme import (.zip/.deskland/.html/.glsl/image/video),
  multi-monitor support, smart Grid/battery/RDP auto-pause, Startup Safe Mode,
  and local LAN sync for Android tablets.
