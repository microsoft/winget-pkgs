ShortDescription: Liest die verbaute Hardware aus und findet verschenkte Leistung, ohne Installation und ohne Benchmark-Last.
Description: |-
  Portables Windows-Programm, das die verbaute Hardware ueber WMI ausliest
  (dieselbe Auskunft wie der Geraete-Manager) und lokal im Browser anzeigt.
  Prueft dabei auf verschenkte Leistung: Arbeitsspeicher unter seiner
  Sollgeschwindigkeit (XMP/EXPO aus), einzelner Riegel statt
  Doppelbestueckung, gemischte Kits, Spiele auf einer HDD. Vor einer
  ausdruecklichen Zustimmung wird keinerlei Netzwerkverbindung aufgebaut.
  Optional laesst sich das Ergebnis auf benchmeister.de auswerten
  (Gesamtwertung, Aufruest-Vorschlaege). Quelltext vollstaendig offen.
