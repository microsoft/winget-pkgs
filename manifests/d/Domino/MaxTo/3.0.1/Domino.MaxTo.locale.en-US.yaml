ShortDescription: 'Keep your windows arranged: snap windows into custom per-monitor grids with a keystroke.'
Description: 'MaxTo is a window manager for Windows that keeps your windows arranged. Define a grid of columns and rows for each monitor — as fine or as coarse as suits that screen — then press a shortcut key and drag across the grid to snap the active window exactly where you want it. Save regions you use often as presets and recall them with a single keypress, or move windows from the tray icon''s menu with a live preview of where they will land. MaxTo is built for multi-monitor setups: cycle the resize grid between monitors from the keyboard, with correct behaviour across displays that use different DPI scaling. It starts silently with Windows, updates itself in the background, is accessible to screen readers, and ships fully translated in 32 languages, including right-to-left support.'
Moniker: maxto
ReleaseNotes: |-
  Fixed
  - Pressing Esc now closes the resize window immediately without moving the target window.
  - Preset shortcut keys stopped working the second time the resize window was opened; keys now reach the resize window every time it is shown.
