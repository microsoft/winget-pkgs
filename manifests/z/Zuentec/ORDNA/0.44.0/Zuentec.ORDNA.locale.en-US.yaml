ShortDescription: Recognises, names and files your documents automatically - on your own PC.
Description: 'ORDNA is document filing for Windows. It recognises invoices, contracts, tax receipts and other documents by their content, names the files by date and issuer, files them in ordinary Windows folders and makes them full-text searchable - scanned pages included. Recognition and search run entirely on your own PC: no cloud, no user account, no transfer of documents to third parties. The archive stays readable without ORDNA.'
