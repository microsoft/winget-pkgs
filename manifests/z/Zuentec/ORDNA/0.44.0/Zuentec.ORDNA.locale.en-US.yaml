InstallationNotes: 'The winget installation installs ORDNA and, if missing, Ollama. Ghostscript (needed for the PDF/A conversion) is not available in winget: install it yourself or run the interactive setup from https://zuentec.de/en/ordna.html#download once, which offers it. On first start ORDNA downloads the recognition model (about 4.6 GB).'
