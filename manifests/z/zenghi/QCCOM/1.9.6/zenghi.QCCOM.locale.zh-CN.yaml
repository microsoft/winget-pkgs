ShortDescription: 轻量快速的串口调试助手和嵌入式工具箱，自动扫描串口、自动识别波特率。
Description: |-
  QCCOM 是一款为嵌入式和单片机开发者打造的串口调试工具：单个免安装 exe，不需要运行库和管理员权限，体积小、启动快、占用低。
  插上设备自动发现串口，自动识别波特率，支持 UTF-8、GBK、HEX 等多种编码。日志带 Linux 终端风格的彩色高亮和时间戳，支持过滤、搜索、快速滚动和回放。内置完整的串口终端，可以直接操作设备上的 Shell。
  除了串口，QCCOM 还把嵌入式开发里常用的工具放在一起：TCP/UDP/MQTT/WebSocket/BLE/SSH 通信调试，Modbus 主从站，CRC 校验计算，HEX/BIN/ELF/Map 查看，固件体积对比，SVD 寄存器查看，波形绘图，文件和文件夹比较合并，代码浏览与 Git 查看，以及面向初学者的电路仿真。
