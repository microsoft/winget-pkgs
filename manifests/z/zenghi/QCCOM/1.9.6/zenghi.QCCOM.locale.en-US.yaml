ShortDescription: Fast, lightweight serial monitor and embedded debugging toolkit with auto port scan and baud-rate detection.
Description: |-
  QCCOM is a fast, lightweight serial debugging tool built for embedded and MCU developers. It is a single portable executable: no installer, no runtime, no admin rights.
  Plug in a board and QCCOM finds the port and detects the baud rate. Logs support UTF-8, GBK and HEX, with Linux-terminal-style colors, timestamps, filtering, search, fast scrolling and replay. A full VT100 serial terminal lets you work directly in your device's shell.
  Beyond the serial port, QCCOM gathers the tools embedded developers reach for every day: TCP/UDP/MQTT/WebSocket/BLE/SSH clients, Modbus master and slave, CRC calculators, HEX/BIN/ELF/map file viewers, firmware size diff, SVD register views, live plotting, file and folder compare and merge, a code browser with Git history, and a beginner-friendly circuit simulator.
