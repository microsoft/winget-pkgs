ReleaseNotes: |-
  New this release

  - On macOS 14 and later, you can browse the web in a tab beside your thread and choose which links open there in Settings, General, Links. Delta's own agent can open, read, and operate those tabs.
  - Split subthread tabs to view multiple conversations alongside their parent.
  - Drag tabs to a pane's edge to create a split, or into another pane to move them.
  - You can now see what has changed since any point in a thread by right-clicking the transcript and choosing View Diff from Here, or by running View Diff from Cursor.
  - Thread search now offers filters for your own threads, subthread categories, archived threads, and tags, with creation dates shown in results.
  - Thread search now finds threads by person: type from: followed by a teammate's Delta username, GitHub login, or "Full Name", and the search box suggests names as you type.
  - You can now ask an agent to fork a thread, including its own, into a subthread that keeps the conversation, or fork one from the command line with delta thread fork <THREAD> --subthread.
  - Threads on desktop and Delta Web now show live CI results for pushed commits in repositories connected through the Delta GitHub App. Delta Web shows CI status in the thread header and sidebar, and the desktop sidebar now shows CI status for subthreads, including pending checks.
  - Choose Show Latest under Tool Activity in Settings > Thread to keep only the newest item in the active tool group visible while completed groups stay collapsed.
  - Added Ultrafast support for eligible OpenAI models with a ChatGPT subscription or your own OpenAI API key.
  - Delta now tells you when Claude Agent is using an API key instead of your Claude subscription. The model picker shows the subscription plan Claude Agent reports or an API Key indicator when it reports a key. The model button keeps its API Key badge after you dismiss the billing warning.
  - In Settings, Thread, Rules, you can turn off Personal AGENTS.md and Include Personal Skills to stop Delta from automatically adding them to agent prompts.
  - On desktop, dragging threads from the sidebar into a conversation now inserts links to them.
  - On desktop, you can ask the Delta agent to rename threads in your workspace.
  - Choose a provider's Fast Model in Model Preferences to override the model Delta uses for thread titles and summaries.
  - OpenRouter custom models now accept routing suffixes (such as :nitro, :floor, and :exacto) and @preset/<slug> presets.
  - On a phone, open Settings from a thread to adjust appearance, text sizes, and diff display.
  - Use Show Markdown Source in Settings > Pane to open Markdown files as source by default.
  - In Send Feedback, choose or paste up to 10 screenshots (5 MB total). Paste directly into the message field with Cmd+V on macOS or Ctrl+V on Windows and Linux. Each attachment shows a thumbnail before you send.

  Better than before

  - Delta Agent can respond faster and cost less to run when instructions or worktrees change mid-conversation.
  - Thread search highlights filters like repo: and from: as you type and offers inline suggestions you can accept with tab or right.
  - In the desktop command palette, Ask Delta now toggles with Cmd+0 on macOS or Ctrl+0 on Linux and Windows instead of Tab.
  - Thread search now groups subthreads under their parents, and both thread pickers offer View Details to show the selected thread's summary and activity times.
  - Organization Overview now has a Filters menu for discovering and inserting search filters and operators.
  - Changing Delta's appearance or text sizes now affects only the device or browser you're using.
  - Git credential prompts now explain why Git is asking and how to set up access, and adding a project that can't be downloaded now says what to fix.
  - On desktop, when the subthread's checkout is on this machine, Merge Changes to Parent now lists new folders that would be left out and lets you include them in the merge.
  - Agents can now read your thread's highlights with or without notes when you ask, including agents using the Delta CLI.
  - The branch picked to compare the review diff against is now remembered for each thread after reopening it or restarting Delta.
  - In threads with several projects, the diff comparison menu now lists each project's comparison branch separately.
  - In multi-project diffs on wide screens, the All Projects menu now lets you filter changes and choose each project's comparison branch.
  - The diff comparison menu now stays open when you select a project, so you can choose the comparison next.
  - The inbox stays accessible when the sidebar is collapsed, and the sidebar toggle's tooltip shows how many listed threads are unread.
  - The inbox icon now shows how many unread notifications you have.
  - Thread avatars now distinguish people focused on the conversation from those who visited within the last 24 hours.
  - When the file pane is focused, ctrl-tab cycles recent tabs in that pane, and ctrl-down takes you to recent threads.
  - Gemini 4 models used with a Google API key can now write responses longer than a single response's output limit.
  - When ChatGPT's models can't load because chatgpt.com blocks your connection or your ChatGPT workspace is deactivated, Settings now says so and what to do, instead of showing ChatGPT's raw response.
  - When your session expires, Delta now keeps a message on screen saying that changes aren't syncing until you sign in again.
  - Manage Tags and tag filter menus now show how many threads carry each tag.
  - More settings now have individual links, including checkout options and model-provider controls.
  - Typing a comment reply is more responsive in long threads.

  Fixes and reliability

  - Viewing or scrolling Markdown with lists and code blocks in a thread no longer crashes Delta.
  - Editing quoted Markdown in a thread no longer crashes Delta.
  - Delta no longer crashes when an open tab switches to a replacement file and the old file can't be read.
  - Turning off thinking no longer causes affected Claude models to reject follow-up messages because of earlier thinking.
  - Gemini models used with a Google API key no longer fail with "Failed to read response from Google AI" while thinking at length or writing a large file.
  - Long agent turns and threads with many images no longer compact the conversation repeatedly while the context is still far from full.
  - A background tool no longer blocks your next message when you reopen a Claude Agent thread.
  - Narrowing a thread's Git sparse checkout no longer marks excluded files as deleted.
  - A project whose threads couldn't be shared because your account can't access its repository on the server is now repaired automatically, so new threads in it can be shared.
  - Threads that received a response while Delta was closed now show as unread in the sidebar.
  - Archived threads that have subthreads now free their disk space three days after archiving, like other archived threads.
  - Agent replies to earlier comments no longer become ambiguous when you add another comment on repeated text.
  - GitHub Copilot Free accounts now get Copilot's default chat model instead of "No Copilot Chat models are available for this account."
  - An expired ChatGPT, Grok, or GitHub Copilot connection in LLM Providers settings now shows a single Reauthorize button instead of both Sign Out and Sign In.
  - Large provider model lists now scroll smoothly on a dedicated page that you can open from the model picker's Filter Model List button when a provider is selected.
  - Gemini tool calls, such as terminal commands, no longer display incorrectly in threads that continue after Delta restarts.
  - Delta now recognizes errors from llama.cpp instead of treating them as invalid responses.
  - Your default conversation width now syncs between Delta Web and desktop.
  - Delta Web now remembers your selected organization in the model picker after a reload.
  - Agents no longer show a Merged card when they only bring your working branch up to date.
  - Resizing a divider in a nested split layout no longer resizes the wrong pane.
  - Links to headings within the same Markdown file now jump to the correct section on desktop and web.
  - Redacted secrets inside tables now appear as pills that you can click to view or unredact the value.
  - The sidebar no longer briefly shows projects from other organizations when Delta starts.
  - Deeply nested threads now show their true indentation and connecting lines in the subthread picker, thread finder, and @-mention picker.
  - Hide Thread History works again after you cancel renaming a thread in the sidebar.
  - Using the filter controls in the Projects header no longer accidentally collapses the section.
  - In Chrome on iOS, the web app now makes room for the keyboard while you type, and tapping the composer brings the keyboard back after you dismiss it.
  - On tablets and other wide touch screens, the sidebar toggle and Settings button in the web app now respond to taps.
  - With appearance set to System, Delta follows iOS light and dark mode changes when you return to Safari.
  - The left arrow key now returns from a submenu to its parent menu.
  - Code-block action buttons no longer blend into the code underneath, including while hovered.
