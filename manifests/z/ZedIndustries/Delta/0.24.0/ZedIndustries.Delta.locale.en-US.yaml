ReleaseNotes: |-
  0.24.0 Nov 4, 2026
  ✨ New this release
  - Browse and open your organization’s threads from Overview in the desktop sidebar.
  - Merge a subthread’s changes into its parent using /merge-into-parent in the child or /pull-from-subthread in the parent, also available from the command palette. Subthreads also show a Merge Changes to Parent button when they have file changes to bring back.
  - On desktop, clone a repository from its Git URL: use Clone Git Project in the command palette to start a thread, Clone Git Project… in a thread’s Add Project menu to clone it into that thread, or Clone Git Project… in the sidebar’s Add Project menu to add it without starting a thread.
  - Create files and folders from the project panel’s context menu, the File menu, or cmd-alt-n and cmd-shift-alt-n.
  - Delete files and folders from the desktop project panel using Delete in the context menu, backspace, or delete.
  - Open files and folders in their default application from the desktop project panel using Open in Default App or ctrl-shift-enter.
  - Files with Zed-recommended extensions now get syntax highlighting in both file views and diffs.
  - You can now connect MCP servers using bearer tokens and custom headers in MCP settings.
  - You can now view the thread prefix of forks and comment on them, and press tab on a fork’s “Forked from” row to show or hide the inherited conversation.
  - You can now customize sidebar grouping and filters in Settings > Sidebar, or ask an agent to change them.
  - Choose Tags under Group by in the sidebar to group threads by their first tag.
  - Desktop thread history can now be filtered by project or limited to archived threads.
  - The Share popover’s invite field now accepts @username for anyone in your organizations, with suggestions as you type.
  - Agents can now read a shared thread from its share link or thread_... share ID even when it isn’t on this device yet.
  - Agents can message another thread’s agent from the command line with delta thread send.
  - Open files at a specific line or column from the file finder (cmd-p on macOS, ctrl-p on Linux and Windows) by entering path:line or path:line:column.
  - delta auth login now uses a device sign-in flow, so it works on machines without a browser.
  - Collapse image previews in messages using the chevron or tab, or turn on Collapse images to collapse them by default.
  - Limit long sidebar lists with Threads per project and Subthreads per thread in the sidebar menu’s Display section.
  - Open a subthread tab as the primary conversation with cmd-opt-enter on Mac or ctrl-alt-enter on Linux and Windows.
  - Open a thread’s Add Project menu with cmd-shift-a on macOS or ctrl-shift-a on Windows and Linux.
  - Press shift-escape while focused in a thread to close the right-side drawer and give the conversation more room.
  - Use delta thread unshare <THREAD> to make a thread private while keeping explicitly invited people.
  - Open the service status page from Delta Status in the user menu.
  ⚡ Better than before
  - The desktop sidebar now separates threads and projects by organization, with guest threads listed under Shared with You.
  - Keyboard shortcuts now live in Settings > Keymap, with searchable, collapsible sections on desktop and web.
  - Copilot Chat connections now sync through your Delta account; existing users need to sign in again once.
  - You can now @mention anyone who has joined or been mentioned in a shared thread, even if they aren’t in your organization.
  - The Merge menu now lets you choose a merge skill before starting a thread, or create one that becomes immediately available in the original thread.
  - Long conversations with comment replies stay more responsive while agents write and finish responses.
  - Hide projects from any desktop sidebar grouping through the filter menu’s Projects submenu.
  - Opening a shared thread now clears its mentions and invitation from your inbox’s unread list, including in Delta Web.
  - ctrl-tab and ctrl-shift-tab now switch file tabs instead of threads when focus is in the file pane.
  - The diff comparison picker now lets you switch between an earlier diff opened from a comment and Branch, Last Commit, or Last Turn.
  - Word-level diff highlighting now appears more reliably in complex edits.
  - Custom provider setup now shows validation errors beside the affected fields in settings and onboarding.
  - Custom-provider setup during onboarding now provides more room for models and keeps setup controls visible while scrolling.
  - Copying a thread link from the share popover now keeps the sharing controls open and shows private-thread access warnings there.
  - Right-clicking empty space in the project panel now opens the project root’s context menu.
  - You can now open worktree menus in the status bar with either a regular click or a right-click.
  - On macOS, Delta’s Dock icon now adapts to Dark, Clear, and Tinted icon styles.
  - Selecting a person in the mention picker now briefly shows a ringing bell beside their name.
  🔧 Fixes and reliability
  - jj squash no longer causes Delta to discard previous edits.
  - The agent no longer loses or garbles lines it adds to the end of a file that has no final newline.
  - Fixed the GitHub MCP server being unable to access repositories. You can now configure repository access and sign in again from MCP settings.
  - On Linux and Windows systems where Keychain is not available, Delta will now store credentials on disk instead.
  - The Retry and Try Again buttons on sign-in, thread loading, and onboarding error messages now work.
  - Signing in while your keychain is locked now shows that Delta is waiting for you to unlock it instead of appearing stuck, and Retry asks you to unlock it again.
  - Threads with many comment replies no longer stall while updating the conversation.
  - Opening a thread’s Changes view no longer crashes when comments target restored lines in collapsed diff sections.
  - Restoring a tracked file larger than 10 MB, such as with git restore, no longer blocks unrelated edits and terminal commands.
  - Shell shortcuts such as ctrl-w, ctrl-r, and ctrl-b now reach a focused terminal in a thread instead of triggering Delta actions on Linux, Windows, and the web.
  - Threads that finish on another device or Cloud Runner no longer keep showing as running in the sidebar until Delta restarts.
  - Images are now sent correctly when using a Grok subscription.
  - Agents can now read subthreads of shared threads without each subthread being shared separately.
  - Jujutsu operations no longer cause Delta to record checkout-only line-ending changes as file edits.
  - Jujutsu conflict artifacts no longer appear as project files or inflate deletion counts in diffs.
  - Jujutsu checkouts now automatically track the repository’s default remote bookmark and the checkout’s upstream bookmark when available.
  - Last turn diffs no longer show inflated changes after merging work from a subthread.
  - Claude models accessed through custom Anthropic-compatible endpoints now show thinking summaries when thinking is enabled.
  - Stopping a local subagent no longer fails or waits for thread synchronization.
  - Claude Code sessions that sync to Delta now appear under their project in the sidebar right away, instead of under Threads until you open them.
  - Delta no longer repeatedly reports missing-worktree errors for shared threads whose local data was cleaned up.
  - Projects added to a thread now appear in the file panel while they are being prepared.
  - Go to Original Comment now reveals comments even when the selected diff comparison hides them.
  - Title regeneration now works for review subthreads and targets the active subthread when invoked from the command palette.
  - Creating a fork from a message with an attached Land skill now marks the fork as a Land thread.
  - The Open in Desktop App menu stays available when you switch to the desktop app, so you can still choose Download Delta.
  - Thread owners now appear active in the sidebar while working in a subthread.
  - Comment headings now show only the people who wrote those comments.
  - Messages below comment summaries now show a separate author avatar when multiple people contributed comments, without repeating it when only one person wrote both.
  - Agent avatars no longer jump to the following text when a message begins with a comment reply and you scroll past it.
  - File comments no longer show a “more comments” link when there are no additional comments to reveal.
  - The ctrl-tab thread switcher now shows each thread in the same color as its tag in the sidebar.
