ReleaseNotes: |-
  ✨ New this release
  - Your thread list and sidebar now stay the same on every device you sign in to; turn this off with Sync Threads Across Devices in General settings.
  - You can now connect multiple accounts or API keys per LLM provider and switch between them.
  - New threads now start with the agent you last chose, so picking Claude Agent in the model picker makes it your default.
  - The sidebar and the thread’s status bar now show a pulsing terminal icon while background terminals are still running.
  - Open or close the Background Terminals menu with cmd-opt-s on Mac, ctrl-alt-s on Windows/Linux, or ctrl-shift-g in Mac browsers.
  - Right-click highlighted text to edit its note or delete the highlight.
  - Turns with highlights now show an amber mark in the thread navigation rail.
  - Inline links to local generated files now offer Open in Default App.
  ⚡ Better than before
  - Your default model and each model’s thinking, fast-mode, and automatic-compaction settings now carry over to your other devices and Delta on the web.
  - Joining a shared thread now shows its conversation sooner, while its files finish loading in the background.
  - Values you mark as not secret, including Cloud Runner environment variables you choose not to redact, now stay unredacted on all your computers and Cloud Runners.
  - Pasting several lines into a shell that supports bracketed paste, such as bash, zsh, or fish, now inserts them as one paste instead of running each line as it arrives.
  - Background terminals now show who started them and where they are running.
  - The Background Terminals menu now groups subthread terminals in a separate submenu so they’re easier to distinguish from the current thread’s terminals.
  - Creating a worktree is now faster in some repositories.
  - Highlighting text that’s already highlighted now reuses that highlight and its note instead of saving a copy.
  - Clear Merge Indicators now also marks the thread and its nested subthreads as read.
  - Terminal cards now show a pulsing dot while the agent’s command is running.
  - Settings now remembers each page’s scroll position when switching pages or returning from an editor.
  🔧 Fixes and reliability
  - Delta no longer freezes when macOS is slow to process notifications.
  - Deleting a thread now also deletes its subthreads and frees the disk space their worktrees used.
  - Subthreads that start from their parent’s conversation no longer forget their task after automatic context compaction.
  - Claude Agent no longer ends a turn without a reply when background work finishes just as you send a message.
  - A Claude Agent thread now answers messages that another thread’s agent sends it.
  - Messages to Claude and other external agents no longer fail to send when they contain file or pasted-text links copied from another thread.
  - Claude Agent’s tool and permission cards no longer stay running or waiting after Claude Code exits while a thread is idle.
  - Pressing Stop right after sending a message to Claude Agent no longer stops its background commands.
  - Claude Agent now uses your existing Claude Code project memories in threads created from a local checkout.
  - Claude Agent’s commands and skills now appear in a new thread’s / menu before you send the first message.
  - Merge now works from a Claude Agent thread in a project with no merge skill yet, without connecting a model provider.
  - New threads no longer start on an unavailable Anthropic model after you disconnect your Anthropic API key to use Claude Agent.
  - After Claude turns off Fast mode because your account can’t use it, new Claude Agent threads no longer turn it back on and show the warning again.
  - Archived threads now return to the sidebar when an agent sends them a message, including with delta thread send.
  - Pasting several lines into a terminal on Windows no longer runs them in reverse order.
  - Agent replies to comments no longer sometimes appear as plain text followed by a stray </comment-reply> tag.
  - Inline LaTeX formulas enclosed in \(...\) now render as math instead of plain text.
  - HTML unordered lists now render as bulleted lists in thread messages, including inside tables.
  - The Changes view remains scrollable after collapsing all files.
  - Typing ! while renaming a thread now inserts the character instead of opening a terminal.
  - Settings links now scroll to the requested setting even while the settings window is loading.
  - WGSL files now display syntax highlighting instead of reporting an extension installation error.
