ReleaseNotes: |-
  This week's release includes thread-only choices for agent models, profiles, and thinking effort, an Ultrafast response speed for supported OpenAI models, global agent skills in remote projects, faster project scanning, and performance improvements to app layout and terminal rendering.
  Features
  AI
  - Added thread-only choices in the Zed Agent's model, profile, and thinking effort pickers. Use cmd-enter or cmd-click on macOS, or ctrl-enter or ctrl-click on Linux and Windows, to change the current thread without changing your defaults. (#66869)
  - Added an Ultrafast response speed option for supported OpenAI and ChatGPT Subscription models. (#67184)
  - Added support for global skills from the remote machine's ~/.agents/skills in SSH, WSL, and dev container projects. (#66767)
  - Added Markdown plans and subagent display for ACP agents. (#67291)
  - Added automatic discovery of Amazon Bedrock models through inference profiles. (#67258; thanks 5herlocked)
  - Added support for choosing a thinking level for Ollama models. (#64642; thanks tidely)
  - Added support for Claude Sonnet 5.5 and Claude Haiku 5.5 in Amazon Bedrock. (#67212; thanks prakhar3030s)
  - Added Extra High thinking effort for Gemini 4 Neon (gemini-4-neon) and made High the default. (#67173; thanks LorenzoBiassio)
  - Added long decode support for Gemini models when using your own Google API key. (#67327)
  - Improved responsiveness while agent responses stream and while the agent edits large files. (#67255, #67395; thanks ptweezy)
  - Reduced CPU use while the agent waits for a model response, tool confirmation, or subagent. (#67261; thanks ptweezy)
  - Improved consistency between external agent controls and the corresponding Zed Agent controls. (#67190)
  Git
  - Improved diff loading when opening many files at once, such as in project search results, Uncommitted Changes, and branch diffs. (#67026; thanks ptweezy)
  - Improved responsiveness in Uncommitted Changes when many files change at once. (#67424)
  - Improved the push notification's pull request button to use the same destination as the corresponding command palette action. (#66408; thanks HannesGitH)
  Vim / Helix
  - Improved * and # in Vim mode to match Neovim: if the cursor isn't on a word, they search for the next word on the line, or for punctuation if no word follows. (#66794; thanks mfroeh)
  Terminal
  - Improved terminal rendering performance. (#67254; thanks ptweezy)
  macOS
  - Updated the bundled Git version to 2.56.1. (#67264)
  Windows
  - Improved the Zed Agent's command sandbox to run natively on Windows using AppContainer instead of WSL. (#66918)
  Other
  - Added support for starting workspace: open files from the active file's directory with ./ or its parent directory with ../. (#57638; thanks hron)
  - Improved scanning speed when opening large projects. (#67226, #67332; thanks ptweezy)
  - Improved layout performance across the app. (#67223)
  - Improved the Agent sidebar, Open Recent, and the title bar to show Delta checkouts as worktrees of their source project. (#67187)
  - Improved the keymap editor and keymap file suggestions by removing 26 actions that did nothing. (#67227)
  - Improved the Project Panel to hide the expand chevron for empty folders when folder_indicator is set to both. (#65672; thanks epenabella)
  - Updated the Docker file icon to match Docker's new logo. (#67425; thanks ashraf7hossain)
  Bug Fixes
  - Fixed a rare issue that could truncate files written by Zed, such as extracted downloads. (#67160)
  - Fixed .env values remaining visible over SSH when redact_private_values was enabled. (#66525; thanks sigkillme0)
  - Fixed pinned tabs being closed or replaced when restoring a pane with more tabs than max_tabs allows. (#67431; thanks ptweezy)
  - Fixed ACP registry agents breaking when a newer version was installed while an older one was still running. (#66971)
  - Fixed lost completion triggers and incorrect completion positions in remote projects, stale suggestions after quickly deleting and retyping a character, and completions without an edit range replacing the wrong text after intervening edits. (#67247, #67277; thanks Sejder)
  - Fixed GitHub Copilot Chat showing no models for Copilot Free accounts. (#67260)
  - Fixed a crash in the Markdown preview when rendering certain SVG images. (#67423)
  - Fixed opening a remote project while it was still reconnecting sometimes causing the connection to fail. (#67336)
  - Fixed Inline Assist failing on Claude models that cannot turn thinking off. (#67203)
  - Fixed workspace: close item in all panes and Vim's :bd[elete] also closing tabs for the file under the cursor in a multibuffer. (#67383; thanks ptweezy)
  - Fixed regex replacements dropping capture groups such as $1 when followed by non-ASCII letters. (#66821; thanks smthfoxy)
  - Fixed dev containers skipping initializeCommand on restart. (#67315; thanks ptweezy)
  - Fixed .editorconfig indentation settings no longer applying after hovering with cmd or ctrl held in the editor. (#67269)
  - Fixed Git history selection changing when new commits were added. (#63322; thanks Jason-Shen2)
  - Fixed thread history search not finding renamed threads. (#67317)
  - Fixed Anthropic thinking blocks being dropped from follow-up requests when they had a signature but no display text. (#67198)
  - Fixed Git Graph selection colors not matching across columns. (#67320)
  - Fixed Git Panel header buttons touching the tab bar when the header wrapped. (#67388; thanks ptweezy)
  - Fixed Git Panel toggle actions not working in projects without a Git repository. (#67389; thanks ptweezy)
  - Fixed misaligned lines in terminal output from ACP agents. (#67368)
  - Fixed terminal links not highlighting on cmd or ctrl hover in apps that use mouse reporting. (#67319)
  - Fixed clipped parts of overlays blocking clicks on visible controls underneath. (#67390; thanks ptweezy)
  - Fixed syntax highlighting of type annotations, arrow functions, and this and void return types in TypeScript and TSX. (#64462; thanks mchisolm0)
  - Fixed excess settings notifications when removing project folders that had no settings. (#67268)
