ReleaseNotes: |-
  新功能
  - 优化计划模式和排队消息交互
  - 新增 OpenCode Go 服务商模板与站点映射
  - 优化服务商模板名称、图标及套餐横幅展示
  - 优化数据库初始化与升级流程
  - 支持在对话中上传、读取和预览 PDF 文件
  - 支持预览对话中的图片、视频等媒体文件
  - 插件可按工作区单独安装
  - 插件有新版本时会显示提醒，可直接更新
  - 操作被拦截时会显示具体原因，方便处理
  - 侧边栏标签支持鼠标中键关闭，并记住各会话的显示状态
  - 草稿任务也支持通过侧边栏查看
  - 内置浏览器会记住上次打开的窗口尺寸
  - 内置浏览器中的本地文件链接支持以系统默认浏览器打开
  - 优化 Weekend/Global Plan 领取提醒，状态与到期信息展示更清晰
  问题修复
  - 修复 Provider 配置读取阻塞的问题
  - 套餐获取失败时增加重新登录入口，修复登录后未触发 Key 强制刷新的问题
  - 优化仓库快照上传的内存占用
  - 优化未跟踪文件统计性能
  - 修复流式响应中断后的重试问题
  - 修复服务商配置读取异常的问题
  - 修复 OpenRouter 兼容性问题，优化连接测试
  - 修复恢复后的子 Agent 出现在任务列表中的问题
  - 修复计划模式菜单说明缺失的问题
  - 优化闲时任务的工具使用限制
  - 优化会话启动速度
  - 修复对话进行中模型切换和上下文丢失的问题
  - 优化上下文用量显示，支持触屏设备点击查看
  - 修复远程重连后模型配置同步异常的问题
  - 改善远程工作区和 WSL 环境的连接与部署稳定性
  - 修复 SSH 连接或发送时偶发卡住的问题
  - 修复登录态过期、授权回调失败等登录问题
  - 修复官方 MCP 连接问题，优化失败提示
  - 修复官方插件异常影响会话恢复的问题
  - 修复插件菜单显示错乱和卸载卡住的问题
  - 修复 Windows 上电脑操作偶发无响应、任务被误重启的问题
  - 修复远程工作区中待确认操作不显示的问题
  - 修复对话生成过程中内容搜索异常的问题
  - 优化长命令输出的显示性能
  - 修复仓库 Wiki 输出过长导致任务失败的问题
  - 修复文件路径和引用显示错误、无法跳转的问题
  - 修复打开会话时滚动位置不正确的问题
  - 优化用户消息的显示宽度
  - 修复空思考内容的显示问题
  - 优化不同任务之间的浏览器窗口隔离
  - 降低 Linux 大型工作区的文件监控资源占用
  - 修复 Linux 系统安装后被旧快捷方式遮挡的问题
  - 修复 Linux 自动更新的问题
  - 修复定时任务删除结果提示不准确的问题
