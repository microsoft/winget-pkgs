ReleaseNotes: |-
  ⚠️ ZCode 3.15.1 更新异常及恢复说明 ⚠️
  ZCode 3.15.3 已修复更新时应用无法正常退出的问题。 从 3.15.1 升级时，仍可能因旧版本问题出现卡住：
  - macOS：按 ⌥⌘Esc，选择 ZCode → 强制退出，等待更新完成并自动打开。
  - Linux：通过系统监视器结束 ZCode 进程，然后重新启动应用。 强制退出会中断运行中的任务。恢复后，请确认应用版本为 3.15.3。 如果仍无法恢复，请前往 ZCode 官网 下载 3.15.3 完整安装包，覆盖安装现有应用。无需卸载应用或删除用户配置。 对此造成的不便，我们非常抱歉。
  问题修复
  - 修复部分场景下登录身份验证可能失败的问题，此问题导致设置页面连接套餐失败，需要重新登录。
  - 修复已完成或跳过新手引导的用户被重复弹出引导的问题。
  - 网络较慢时不再因引导判断被卡住，可以及时进入主界面。
  - 修复多个 Agent 并行执行或连续调用模型时，部分请求异常失败的问题，提升并行任务的稳定性。
