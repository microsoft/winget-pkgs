ReleaseNotes: |-
  新功能
  - 帮助菜单新增复制设备号功能，反馈问题更方便。
  - 登录链接无法自动打开时，可复制后手动完成登录。
  - 每个会话的文档查看状态相互独立，多窗口互不干扰。
  - 文档类插件改为共用一个进程，同时打开多个文档时占用更低。
  - 插件后台保留时长增加上限，减少资源浪费。
  问题修复
  - 子代理可以正确查看当前会话已打开的文档。
  - 内置组件文件丢失时可自动重建，不再持续报错。
  - 关闭最后一个终端标签时会真正结束后台进程。
  - 修复长文本或输入法输入时输入框卡顿的问题。
  - 切换任务时未上屏的输入法草稿不再丢失。
  - 对话中不再显示残留的空白工具调用卡片。
  - 被中断的对话不再显示未读提醒。
  - 优化远程连接失败原因，不再只提示超时。
  - 修复远程连接部分兼容性问题。
  - 优化远程会话发消息延迟问题。
  - 远程目录读取失败时，本地项目列表保持可见。
  - 修复手机远控终端问题。
  - 修复只打开远程项目时无法测试模型的问题。
  - 文件树恢复显示在预览区左侧。
  - 侧栏插件列表优先显示已安装的插件。
  - 插件市场修复多处界面问题，返回操作更清晰。
  - 更新说明气泡支持悬停，方便查看完整内容。
  - 打开本地文件夹时会被正确识别为项目。
  - 重启后恢复会话时子目录不再丢失。
  - 修复多个会话同时写入时数据可能异常的问题。
  - 修复容器环境下官方插件缓存无法更新的问题。
