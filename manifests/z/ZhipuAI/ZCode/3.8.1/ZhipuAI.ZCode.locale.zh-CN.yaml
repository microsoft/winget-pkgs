ReleaseNotes: |-
  新功能
  - 新增 GLM Coding Plan 订阅用户在算力闲时重置 5 小时额度权益
  - 支持按用户全局/工作区管理各 agent 能力项，在设置页可视化管理
  - 首页新增提示词推荐，并可引用已启用插件
  - 首页新增插件市场，支持配置管理自定义插件
  - 升级用量统计，支持个人套餐 V3 及团队套餐用量统计
  - 优化对话中的文件引用、代码评论和工具调用分组
  - 支持安全的工作区级 Hooks 配置与执行
  - 内置浏览器支持录制视频
  - 升级内置文档插件，处理 docx/pdf、xlsx、pptx 能力增强
  - 支持生成演示文稿自动预览，编辑自动刷新
  问题修复
  - 提升项目知识库生成、重试和失败恢复稳定性
  - 修复内置浏览器启动失败、崩溃及标签页残留
  - 修复切换工作区后侧边终端中断或输入失效
  - 修复 Windows 输入法在侧边终端中的输入问题
  - 修复任务列表刷新时闪白和文件树滚动异常
  - 修复插件试用后输入空格导致引用消失
  - 修复设置页刷新后服务状态未正确更新
  - 修复应用退出时窗口大小偶尔保存失败
  - 修复用量统计重复计数、图表裁切和展示异常
  - 修复外链右键打开方式及多处中英文显示问题
  - 修复代码评审评论定位和预览状态异常
  - 优化超大历史会话启动加载速度
  - 修复剩余用量更新不及时的问题
