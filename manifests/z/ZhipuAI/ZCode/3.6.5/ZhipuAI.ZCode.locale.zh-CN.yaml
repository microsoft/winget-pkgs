ReleaseNotes: |-
  新功能
  - 自动化卡片会把手动运行计入总数
  - 机器人创建的运行结果会正常送达
  - 浏览器工具栏新增更多操作入口
  - 优化自动化任务体验：新增定时和空闲视图，创建任务时默认进入表单模式，支持前进后退导航，并支持拖拽调整编辑框高度。
  - 新增全局防休眠开关。
  - 支持项目维度记忆。
  - 模型设置可调整最大输出长度。
  - 新增 Kimi K3 256K 模型。
  - Markdown 图片支持预览和下载。
  - 文件树层级结构更清晰。
  - 可关闭提问倒计时。
  - 可设置会话启动时的搜索增强。
  - 可在官方供应商中添加其他官方支持的模型。
  - 新增 /side 与 /btw 命令打开侧边辅助对话。
  问题修复
  - 自动化任务中，手动和定时运行会分别统计
  - 浏览器自动化对弹窗和目标判断更准确
  - 插件缓存偶发锁定时，不再影响使用
  - 切换会话状态时，不会误改当前模型
  - 配置选择器切换范围时会保持正确状态 修复自动化任务时间和重复规则异常。
  - 修复错过的一次性任务被重复安排。
  - 修复自动化任务卡片显示不准确。
  - 修复空闲任务排序和折叠异常。
  - 修复后台浏览器截图容易超时的问题。
  - 修复停用的工具仍可能被调用的问题。
  - 修复会话关闭后记忆仍在处理的问题。
  - 修复 Windows 和 macOS 上搜索兼容问题。
  - 修复 PDF 中日韩文字显示异常。
  - 修复图片预览拖拽、关闭和保存问题。
  - 修复远程图片下载的安全问题。
  - 修复少数情况下 diff 预览不展示的问题。
  - 修复大文件预览显示不全的问题。
  - 修复文件树压缩目录导致层级错误的问题。
  - 优化 bash 内 find&grep 命令。
  - 修复重置后定时任务控件异常的问题。
  - 修复跨平台命令管道输出捕获问题。
  - 修复后台浏览器任务标签状态异常的问题。
  - 修复历史消息加载时滚动位置跳动的问题。
  - 修复从托盘恢复窗口后画面不刷新的问题。
  - 修复旧版 WSL 会话无法恢复的问题。
  - 修复代码评论中回车无法发送的问题。
  - 修复任务切换后提问草稿丢失的问题。
  - 优化 Markdown 图片的加载和失败显示。
  - 修复表格文件预览兼容性问题。
  - 修复辅助对话旧标签编号缺失的问题。
  - 辅助对话支持同时打开多个标签。
