ReleaseNotes: |-
  新功能
  - 输入框支持语音输入，语音内容实时转成文字。
  - 支持 Worktree，并行任务开发。
  - 新增 Design 能力，支持设计系统检查。
  - 新增日语、俄语、韩语三种界面语言。
  - 新增 Session 管理 Tool，增强自管理能力。
  - 统一登录授权入口。
  - 增加插件推荐开关。
  - 内置浏览器支持点选页面元素，本地网页可直接修改并保存。
  - 内置浏览器新增设备尺寸预设，页面可导出为 PNG 或 PDF。
  - 可在输入框编辑最近发送或排队中的消息。
  - 分享支持设置有效期，并新增分享管理页面。
  - 本地网页改动后自动刷新，可设置单击 HTML 直接打开。
  - 归档的会话支持永久删除。
  - 连续的工具执行自动分组汇总，阅读更专注。
  - 选中回复文字可添加批注，随引用一起发送。
  - 回复流式输出时逐词渐显，阅读更自然。
  - 文件卡片和正文链接支持在文件管理器中定位。
  - 浏览器记住各会话最近访问的页面，重启后保留。
  - 授权时可直接选择权限模式，可记住完全访问。
  - 设置新增项目编辑、每设备记忆和手机推送开关。
  - 使用统计记录不再自动过期清除。
  - 图片预览整合操作菜单，可添加到对话、复制或另存。
  - 站点部署新增访问统计。
  - 新增麦克风权限引导，权限被拒后可重新授权。
  - 新增 macOS 字体平滑设置，默认跟随系统显示。
  问题修复
  - 修复会话前进、后退导航无法使用的问题。
  - 托盘图标不再显示常驻红点，角标只计本次新增未读。
  - 修复 Windows 安装失败后文件残留、清理报错的问题。
  - 应用更新改为手动确认安装，关闭窗口不再中断下载。
  - 更新器支持代理与自签名证书，退出登录后仍可检查更新。
  - 修复登录验证码偶发无法加载的问题。
  - 修复时间、日期格式不跟随界面语言等本地化问题。
  - 模型失效时发送会提示重选，横幅关闭后不再误弹。
  - 修复切换模型后设置偶发不生效或卡顿的问题。
  - 修复内置浏览器网页无法接收键盘输入的问题。
  - 机器人会话支持富文本和更大附件，服务恢复后可续答。
  - 修复部分模型内置工具导致回复内容异常的问题。
  - 修复工作流脚本可能绕出沙箱的安全问题。
  - 修复设置页窄窗口下控件重叠的问题。
  - 额度重置核销前增加确认页，避免误核销。
  - 修复用默认应用打开文件时路径错误的问题。
  - 修复添加图片时预览偶发丢失的问题。
  - 修复删除或归档任务后相关页面未关闭的问题。
  - 修复个别异常数据导致对话无法继续同步的问题。
  - 修复国内用户通过网站登录失败的问题。
  - 修复摘要信息反复刷新的问题。
  - 点选网页元素不再切换到完整视图或弹出面板遮挡内容。
  - 对话栏可拖得更窄，减少对页面的遮挡。
  - 修复项目搜索菜单可被误拖动的问题。
  - 修复子代理来源说明显示不全或错乱的问题。
  - 修复更新时残留旧进程导致更新失败、需重启电脑的问题。
  - 更新备份失败时仍可继续安装，失败提示也更准确。
  - 修复 Linux 桌面版在没有系统密钥环服务时无法登录的问题。
  - 修复国内账号未关联 BigModel 时无法使用 Start 套餐权益的问题。
  - 修复切换数据存储目录后可能无法登录或需要重新登录的问题。
  - 修复 Windows 在系统限制或路径含特殊字符时检查更新失败的问题。
