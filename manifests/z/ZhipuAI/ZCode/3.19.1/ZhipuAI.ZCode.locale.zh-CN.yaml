ReleaseNotes: |-
  新功能
  - 子任务默认在后台运行，命令行单次执行会等待后台任务完成再退出。
  - 长对话压缩后摘要更完整，后台任务进度不再丢失。
  - 工具执行失败时也会触发已配置的钩子。
  - 助手更清楚何时结束任务，写入记忆的笔记更有分寸。
  - 静默提醒改为按实际等待时间触发，提示更及时。
  - 新增令牌用量提醒开关，默认关闭。
  - 辅助对话支持选中文本添加评论。
  - 文件链接支持行号和区间，打开后自动定位并高亮对应行。
  问题修复
  - 超长的前台等待命令会被提前拦下，不再卡住整个任务。
  - 报错信息更清晰易懂，工具名写错时还会给出相近名称建议。
  - 钩子拦截提示不再暴露命令中的密码等敏感信息。
  - 修复部分插件工具参数校验的误判问题。
  - 修复退出应用时误报“已取消”提示的问题。
  - 修复导航被拦截后页面跳转状态失效的问题。
  - 网络波动导致登录令牌刷新失败时会自动重试，减少掉线。
  - Windows 上能更可靠地找到已安装的 Git Bash。
  - 更新确认弹窗在窄窗口下不再显示拥挤错乱。
  - adb 命令仅允许使用工作区内的可执行文件，更加安全。
