ShortDescription: Lightweight cross-platform CLI for Zenvara — one native binary to install, run, and operate Zenvara.
Description: |-
  zen is the cross-platform command-line tool for Zenvara. It manages the full lifecycle of a
  Zenvara deployment (install, service/IIS hosting, updates, rollbacks) and transparently forwards
  flow commands to a local installation or a remote server. It also registers the MCP bridge that
  connects Claude Code, Gemini, and OpenCode to a running Zenvara. Ships as a single self-contained
  native executable with no runtime dependencies.
Tags:
- cli
- deployment
- devops
- mcp
- zenvara
ReleaseNotes: |-
  zen is the Zenvara command-line interface — a single self-contained native binary (NativeAOT, no .NET runtime required) for installing, operating, and talking to a Zenvara instance.
  1.3.2 changes no behaviour; it is the first code-signed release.
  - The Windows binary is code-signed. zen.exe in zen-win-x64.zip now carries an Authenticode
    signature (SHA-256, RFC 3161 timestamp) from a publicly trusted certificate, so Windows and
    package managers can verify who published it. Linux and macOS binaries are unchanged.
ReleaseNotesUrl: https://github.com/zenvara-platform/cli/releases/tag/1.3.2
