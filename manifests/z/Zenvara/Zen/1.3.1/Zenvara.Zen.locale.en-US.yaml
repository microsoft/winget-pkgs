ReleaseNotes: |-
  zen is the Zenvara command-line interface — a single self-contained native binary (NativeAOT, no .NET runtime required) for installing, operating, and talking to a Zenvara instance.
  1.3.1 is a fix release with one change.
  - zen cli update works on Linux and macOS again (ZEN-8629). The updater stages the download
    under a temporary name and runs its --version before swapping it in. With that name, the new
    binary's command-line parser could not derive a command name and crashed, so every update was
    refused. 1.3.1 falls back to a named zen root command in that case, and stages the download as
    .zen-cli-update-<id>.tmp, so a pinned downgrade to an older release also passes the check.
  Updating from 1.3.0 on Linux or macOS: the fix is in 1.3.1's own startup, so zen cli update
  on 1.3.0 is expected to install 1.3.1. If your 1.3.0 refuses the update anyway, install 1.3.1 once by
  hand (apt, the install script, or the direct download from the release page); updates work from
  1.3.1 on. Windows is not affected.
ReleaseNotesUrl: https://github.com/zenvara-platform/cli/releases/tag/1.3.1
