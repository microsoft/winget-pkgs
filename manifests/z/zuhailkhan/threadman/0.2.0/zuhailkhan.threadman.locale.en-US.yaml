ShortDescription: Terminal interface for browsing, searching and handing off AI coding conversations across tools.
Description: |-
  threadman reads the sessions that AI coding CLIs already write (Claude Code, OpenCode, pi, Codex and Antigravity), indexes them in a local SQLite database, and shows them in a terminal UI.

  Browse and search every conversation in one place, read them with an outline of your prompts, and hand a conversation off to another tool in its native session format, as the full transcript or as a summary written by an LLM you choose. Sessions linked by handoffs open as one conversation, and several threads can be merged into one new session.
