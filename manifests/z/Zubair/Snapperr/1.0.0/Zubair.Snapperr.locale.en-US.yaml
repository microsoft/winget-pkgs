ShortDescription: Snap windows to thirds or halves of the screen with keyboard shortcuts.
Description: |-
  Snapperr moves the active window with one shortcut:
  Ctrl+Left / Ctrl+Down / Ctrl+Right = left / center / right third,
  Ctrl+L / Ctrl+; = left / right half.
  It runs in the tray and starts automatically at sign-in.
