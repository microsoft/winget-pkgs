ReleaseNotes: "### _[Wasabi Wallet](https://wasabiwallet.io) is an easy to use, privacy-focused, open-source, non-custodial, Bitcoin wallet._\r\n\r\n# Download\r\n:window：[Windows](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.2/Wasabi-2.8.2.msi)\r\n:green_apple：[Apple M1/M2](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.2/Wasabi-2.8.2-arm64.dmg)\r\n:apple：[Apple Intel](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.2/Wasabi-2.8.2.dmg)\r\n:penguin：[Ubuntu / Debian](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.2/Wasabi-2.8.2.deb)\r\n:penguin：[Other Linux](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.2/Wasabi-2.8.2-linux-x64.tar.gz)\r\n\r\n---\r\n\r\n## Release Highlights\r\n\r\n#### 🔗 P2P synchronization fixes after chain reorganizations\r\n#### 🔐 Security improvements for coinjoin\r\n#### 🍎 Native macOS Apple Silicon support for hardware wallets\r\n\r\n## Release Summary\r\nWasabi Wallet v2.8.2 fixes P2P synchronization issues after blockchain reorganizations and addresses security vulnerabilities in coinjoin.\r\n\r\n### 🔗 P2P synchronization fixes after chain reorganizations\r\nFixed several issues that caused synchronization failures when the blockchain experienced reorganizations. The wallet now correctly handles orphaned tips and shorter reorg chains without throwing errors, ensuring reliable sync recovery.\r\n\r\n### 🔐 Security improvements for coinjoin\r\nEnhanced coinjoin security by verifying other participants' inputs before signing. This adds an extra layer of protection against malicious coordinators or participants attempting to manipulate transactions.\r\n\r\n### 🍎 Native macOS Apple Silicon support for hardware wallets\r\nHardware Wallet Interface (HWI) now runs natively on Apple Silicon Macs, eliminating the need for Rosetta emulation and improving performance when using hardware wallets on M1/M2/M3 machines.\r\n\r\n---\r\n\r\n## Installation Guide\r\nDownload the operating system relevant software package and install Wasabi like you would with any other software on your computer.\r\nFor a detailed installation guide, including **signature verification**, see [the documentation](https://docs.wasabiwallet.io/using-wasabi/InstallPackage.html).\r\n\r\n## Documentation\r\n:spider_web：[Website](https://wasabiwallet.io)\r\n:onion：[Tor onion site](http://wasabiukrxmkdgve5kynjztuovbg43uxcbcxn6y2okcrsg7gb6jdmbad.onion/)\r\n:orange_book：[Documentation](https://docs.wasabiwallet.io)\r\n:grey_question：[FAQ](https://github.com/WalletWasabi/WalletWasabi/discussions/categories/faq)\r\n\r\n## Advanced Guide\r\nIf you want to build or update Wasabi from source code, check out [these easy instructions](https://docs.wasabiwallet.io/using-wasabi/BuildSource.html).\r\n\r\nWasabi uses [reproducible builds](https://reproducible-builds.org/), which you can verify with [this guide](https://github.com/WalletWasabi/WalletWasabi/blob/master/WalletWasabi.Documentation/Guides/DeterministicBuildGuide.md).\r\n\r\n## Requirements\r\n• Windows 10 1607+\r\n• Windows 11 23H2+\r\n• macOS 14+\r\n• Ubuntu 22.04+\r\n• Fedora 42+\r\n• Debian 12+\r\n---\r\n\r\n\r\n## What's Changed\r\n• RPC：getnewaddress: change default taproot parameter to true by @MarnixCroes in https://github.com/WalletWasabi/WalletWasabi/pull/14827\r\n• Fix icon and merge rows on sync cards by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14826\r\n• Arrow key movements active without clicking by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14821\r\n• Route coinjoin payment add/cancel through the Wallet backend by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14811\r\n• BlockFilterSqliteStorage：Enable connection pooling by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14684\r\n• config help text：improve sentence writing by @MarnixCroes in https://github.com/WalletWasabi/WalletWasabi/pull/14836\r\n• Support event subscriptions by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14650\r\n• [trivial] Code style by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14785\r\n• Redo Calculation for Anonymity Score by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14117\r\n• Fix race condition while displaying script results by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14848\r\n• Allow Scripts to listen for events by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14850\r\n• Wait for block headers before starting synchronization by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14851\r\n• Use biggest version for development by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14849\r\n• KeyManager：Refactor `ToFile` by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14777\r\n• Upgrade to xUnit v3 by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14864\r\n• KeyManager：Fix more synchronization issues by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14860\r\n• KeyManager：Remove the constructor used only in tests by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14859\r\n• [SQLite 7/n] Move `DeleteIndex` to `SqliteStorageHelper.DeleteDatabaseFiles` by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14861\r\n• LoginView：Consolidate text and button when providing wrong password by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14866\r\n• [trivial] Code style changes by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14858\r\n• Assign GitHub labels for reported issues and features by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14873\r\n• Pay in coinjoin regardless of anonymity score by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14789\r\n• Fix recursive parsing and validations by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14876\r\n• Bright white in card titles by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14871\r\n• Show awaiting addresses of all script types by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14822\r\n• CoinJoinPaymentsView：Change \"Pending\" to \"Queued\" by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14872\r\n• Logger：Refactor to create logger once and configuration is allowed only before actual logging by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14720\r\n• Make `dotnet test` output more CI friendly by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14884\r\n• [BIP-77 2 of 5] Recognize BIP 77 pj endpoints and preserve pjos in BIP 21 parsing by @DanGould in https://github.com/WalletWasabi/WalletWasabi/pull/14880\r\n• Verify other participant's inputs by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14886\r\n• Keep the wallet height from underflowing and preceding the first filter by @Kukks in https://github.com/WalletWasabi/WalletWasabi/pull/14902\r\n• SendFeeViewModel：Remove unnecessary async code by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14899\r\n• Fix potential crash when `WildEstimations` is empty by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14897\r\n• FeeRateEstimations：Use an immutable dictionary by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14898\r\n• Use stricter default parameters by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14910\r\n• Revalidate password in rpc requests by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14911\r\n• Use a cryptographic hash function to hash the master key by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14913\r\n• Track uncertain payments in coinjoin by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14917\r\n• Revert \"Track uncertain payments in coinjoin\" by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14919\r\n• Track signed payments in coinjoin (#14917) by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14921\r\n• release.sh：Updates for reproducibility by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14792\r\n• Revert \"Redo Calculation for Anonymity Score\" by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14944\r\n• release.sh：Set `amd64` and `arm64` correctly in Debian control file by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14945\r\n• Prioritize the recovered wallet over the previously existing wallet by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14820\r\n• SleepInhibitor：Fix sleep inhibition behavior for macOS by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14926\r\n• CompactFilterBehavior：Split into multiple files by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14947\r\n• Add native macOS arm64 HWI by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/14887\r\n• Hide privacy progress % and bar with discreet mode by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14963\r\n• Fix block cache pruning threshold by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/14968\r\n• SmartTransaction：Remove `FromLine()` deserialization by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14960\r\n• [anon 1/n] SmartCoin：Prefer `SmartCoin.AnonymitySet` instead of `HdPubKey.AnonymitySet` by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14959\r\n• [anon 2/n] SmartCoin：Prefer `SmartCoin.AnonymitySet` instead of `HdPubKey.AnonymitySet` by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14961\r\n• Global：Start P2P after bitcoin data is initialized from SQLite by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14966\r\n• Fix regtest by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/14982\r\n• xUnit：Set up xUnit correctly for integration tests by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14978\r\n• Fix reog orphaned tip by @lontivero in ht"
