ReleaseNotes: "### _[Wasabi Wallet](https://wasabiwallet.io) is an easy to use, privacy-focused, open-source, non-custodial, Bitcoin wallet._\r\n\r\n# Download\r\n:window：[Windows](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.3/Wasabi-2.8.3.msi)\r\n:green_apple：[Apple M1/M2](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.3/Wasabi-2.8.3-arm64.dmg)\r\n:apple：[Apple Intel](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.3/Wasabi-2.8.3.dmg)\r\n:penguin：[Ubuntu / Debian](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.3/Wasabi-2.8.3.deb)\r\n:penguin：[Other Linux](https://github.com/WalletWasabi/WalletWasabi/releases/download/v2.8.3/Wasabi-2.8.3-linux-x64.tar.gz)\r\n\r\n---\r\n\r\n## Release Highlights\r\n\r\n#### 🌳 Taproot support for Payjoin\r\n#### 🔐 Stricter security controls across the wallet\r\n#### 🛡️ Enhanced coinjoin blame round protection\r\n\r\n## Release Summary\r\nWasabi Wallet v2.8.3 adds Taproot support for Payjoin transactions, implements stricter security controls throughout the wallet, and strengthens verification of coinjoin blame rounds.\r\n\r\n### Deprecation of compatibility password feature\r\nPlease create a new wallet if you see the following message while logging in to your wallet:\r\n*Compatibility passphrase was used! Please consider generating a new wallet to ensure recoverability!*\r\n\r\nFive years ago, because of a clipboard bug on macOS (OSX) in the Avalonia UI framework, users who created wallets by pasting complex passwords (with non-ASCII characters) got their password silently truncated and corrupted. Wallets created with the buggy passwords would be unrecoverable using standard BIP39 tools.\r\n\r\nThe mechanism for working around that issue will soon be removed.\r\n\r\n### 🌳 Payjoin now supports Taproot addresses\r\nPayjoin transactions now work with Taproot (P2TR) addresses. Payjoins are two-party collaborative transactions that improve fungibility.\r\n\r\n### 🔐 Stricter security controls\r\nMultiple security hardening measures have been implemented:\r\n• Payjoin now requires Tor to be enabled for enhanced privacy\r\n• Improved validation of compact block filters\r\n• Better network diversity by connecting to nodes in different net groups\r\n• Fixed value-conservation checks for Payjoin sender\r\n\r\n### 🛡️ Enhanced coinjoin blame round protection\r\nImproved coinjoin reliability and security:\r\n• Clients now verify blame round inputs match the original round\r\n• Fixed payment stalling when only non-private coins are temporarily banned\r\n• Wallet no longer participates in blame rounds when it didn't sign in the original round\r\n\r\n### 🎵 Music box always visible\r\nThe coinjoin \"music box\" is now always visible in the UI for easier access to coinjoin status and controls.\r\n\r\n### 🐛 Bug fixes\r\n• Fixed blockchain info exchange rate provider\r\n• Improved handling of missing Windows startup registry key\r\n\r\n---\r\n\r\n## Installation Guide\r\nDownload the operating system relevant software package and install Wasabi like you would with any other software on your computer.\r\nFor a detailed installation guide, including **signature verification**, see [the documentation](https://docs.wasabiwallet.io/using-wasabi/InstallPackage.html).\r\n\r\n## Documentation\r\n:spider_web：[Website](https://wasabiwallet.io)\r\n:onion：[Tor onion site](http://wasabiukrxmkdgve5kynjztuovbg43uxcbcxn6y2okcrsg7gb6jdmbad.onion/)\r\n:orange_book：[Documentation](https://docs.wasabiwallet.io)\r\n:grey_question：[FAQ](https://github.com/WalletWasabi/WalletWasabi/discussions/categories/faq)\r\n\r\n## Advanced Guide\r\nIf you want to build or update Wasabi from source code, check out [these easy instructions](https://docs.wasabiwallet.io/using-wasabi/BuildSource.html).\r\n\r\nWasabi uses [reproducible builds](https://reproducible-builds.org/), which you can verify with [this guide](https://github.com/WalletWasabi/WalletWasabi/blob/master/WalletWasabi.Documentation/Guides/DeterministicBuildGuide.md).\r\n\r\n## Requirements\r\n• Windows 10 1607+\r\n• Windows 11 23H2+\r\n• macOS 14+\r\n• Ubuntu 22.04+\r\n• Fedora 42+\r\n• Debian 12+\r\n---\r\n\r\n\r\n## What's Changed\r\n• Musicbox always visible by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15011\r\n• Make Wasabi scripts easier to maintain by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15016\r\n• [flaky tests] Call `ModuleInitializer.PatchTestNet` before tests run by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/15025\r\n• Run unit tests across supported platforms by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/14964\r\n• UnitTest：Stabilize CPFP provider scheduling by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/15021\r\n• UnitTest：Accept valid non-success blame result by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/15022\r\n• Update checkpoint for the block 960000 by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14895\r\n• UnitTest：Handle missing Windows startup registry key by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/15014\r\n• Synchronizer：Wait until block headers catch up by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/15019\r\n• UnitTest：Automatically update round state in tests by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/15027\r\n• UnitTest：Stabilize WabiSabi idempotency integration test by @molnard in https://github.com/WalletWasabi/WalletWasabi/pull/15013\r\n• release.sh：Add `--root-owner-group` to avoid using local user being … by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14948\r\n• Fix some reorgs when using Bitcoin RPC by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/15007\r\n• Remove unused code by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14988\r\n• [Coordinator] Shave anchor output into the next lowest denomination by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/14881\r\n• WabiSabiConfig：Change `LoadFile` to `TryLoadFile` by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14951\r\n• [trivial] TorManagerService：Remove ugly variable name by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14940\r\n• UserAgent：Update list of HTTP user-agents by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14938\r\n• Primitives：Allow comments when reading JSON by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14925\r\n• WabiSabiController：Show recently finished rounds as well by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14929\r\n• FeeRateEstimationUpdater：Report `MiningFeeRatesChanged` only if the new estimations are non-empty by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14900\r\n• Verify blame round inputs on client side by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14786\r\n• Dont participate in blame round when didn't sign by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15038\r\n• Mark payments as signed before posting the witnesses by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/15031\r\n• StartupTask：Detect an error early and actually report it by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14942\r\n• docs：rewrite the deterministic build guide around Contrib/release.sh by @xrviv in https://github.com/WalletWasabi/WalletWasabi/pull/15026\r\n• Fix coinjoin stalling when the only non-private coins are banned by @Coinjoiner21 in https://github.com/WalletWasabi/WalletWasabi/pull/15040\r\n• Fix blockstream exchange rate by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15042\r\n• Stricker controls by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15036\r\n• Allow PJ with taproot by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15044\r\n• xUnit：Modernize `IntegrationTestFixture` by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14980\r\n• Global：`ConfigureBitcoinRpcClient` – report more user-friendly exception when `Config.BitcoinRpcUri` is invalid by @Carti-it in https://github.com/WalletWasabi/WalletWasabi/pull/14967\r\n• Make PJ use TR as well by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15045\r\n• Update release highlights for v2.8.3 by @lontivero in https://github.com/WalletWasabi/WalletWasabi/pull/15050\r\n\r\n## New Contributors\r\n• @xrviv made their first contribution in https://github.com/WalletWasabi/WalletWasabi/pull/15026\r\n\r\n**Full Changelog**：https://github.com/WalletWasabi/WalletWasabi/compare/v2.8.2...v2.8.3"
