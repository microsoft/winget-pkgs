Description: BentoDesk 是一款面向 Windows 桌面的新一代 Bento 收纳整理工具，由 Rust 驱动，追求安静优雅。将文件置于触手可及之处，把杂乱藏于视线之外：把桌面整理成一个个区域与堆叠，打开、绽放、再归于平静。安装程序采用当前用户权限、完全离线并提供中英双语。
