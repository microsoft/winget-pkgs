- web-search
ReleaseNotesUrl: https://github.com
InstallationNotes: |-
  web-researcher-mcp is now installed and available on your PATH.
  To connect it to your AI client (e.g., Claude Desktop, Cursor, VS Code), add "web-researcher-mcp" to your MCP server configuration.
  It runs out of the box with DuckDuckGo search (no API key required). See the documentation for optional search provider API keys and search lenses.
