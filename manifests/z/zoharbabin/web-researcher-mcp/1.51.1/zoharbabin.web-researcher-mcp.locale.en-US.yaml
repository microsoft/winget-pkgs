ShortDescription: Search the web and primary sources, read pages behind your logins, verify citations. Runs locally.
Description: |-
  web-researcher-mcp is a local Model Context Protocol (MCP) server for AI assistants like Claude, Cursor, VS Code, and Gemini CLI.
  It enables web search across 30+ providers, primary source lookup (SEC filings, US court records, patents, clinical trials, academic papers), full-page extraction, and deterministic citation verification with zero API keys required to start.
