ShortDescription: Git external commands that pin repositories to the native desktop launcher
Description: |-
  Git Pin provides the git pin and git unpin external commands for adding or removing a Git repository from the native desktop application launcher. V1.2 supports configurable IDE command-line executables instead of binding launchers to one editor product.

  IDE configuration
  Git Pin reads pin.ide through Git's configuration interface. Its default is code. Set an executable name available on PATH, for example git config --global pin.ide cursor.

  Launcher locations
  - Windows: %APPDATA%\Microsoft\Windows\Start Menu\Programs\.pinned_repo\<name>.lnk
  - Linux: ${XDG_DATA_HOME:-$HOME/.local/share}/applications/git-pin-<name>.desktop
  - macOS: $HOME/Applications/Git Pin/<name>.app
  The launcher itself is the V1 registry. Git Pin reads platform-native metadata before replacing or deleting anything and refuses to remove unrecognized artifacts. Launchers created by v1.0/v1.1 remain inspectable and removable.
