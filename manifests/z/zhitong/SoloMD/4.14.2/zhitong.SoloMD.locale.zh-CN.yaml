PackageLocale: zh-CN
Publisher: zhitong
PackageName: SoloMD
License: MIT
ShortDescription: 免费开源的 Markdown 编辑器，支持实时预览、公式、图表和导出
Description: |-
  SoloMD 是基于 Tauri 2 的免费开源（MIT）Markdown 编辑器，约 15 MB。
  实时预览在输入时隐藏 Markdown 标记，也支持分栏和源码视图。
  支持 KaTeX 公式、Mermaid 和 PlantUML 图表、tldraw 白板、双向链接和知识图谱，可导出 PDF、Word、独立 HTML 和图片。
  Windows 上中文输入稳定不吞字。可选本地 AI（Ollama 或任意 OpenAI 兼容服务）、内置 MCP 服务和 Git 同步。
