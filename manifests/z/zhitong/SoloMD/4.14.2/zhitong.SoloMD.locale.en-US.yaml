ShortDescription: Free, open-source Markdown editor with live preview, math, diagrams and export
Description: |-
  SoloMD is a free, open-source (MIT) Markdown editor built with Tauri 2, about 15 MB.
  Live preview hides Markdown markers as you type, with split and source views.
  It renders KaTeX math, Mermaid and PlantUML diagrams and tldraw whiteboards, supports wiki links, backlinks and a knowledge graph, and exports to PDF, Word, standalone HTML and images.
  Chinese, Japanese and Korean input is reliable on Windows.
  Optional local AI (Ollama or any OpenAI-compatible server), a bundled MCP server, and Git sync.
