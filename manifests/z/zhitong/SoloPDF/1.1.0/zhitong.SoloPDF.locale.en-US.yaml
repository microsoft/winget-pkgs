ShortDescription: Free, ad-free, local-first PDF reader & offline toolkit — highlights become Markdown notes
Description: |-
  SoloPDF is a free, open-source, local-first PDF reader and 20-tool offline document suite built with Tauri 2 + Vue 3 + Rust.
  Every highlight, sticky note, and region snip is saved as a plain Markdown file (.annotations.md) next to your PDF — ready for SoloMD, Obsidian, VS Code, or Git.
  Includes offline PP-OCRv4 OCR, scan auto-deskew & Sauvola binarization, visual pixel & blink comparison, math-to-LaTeX & table-to-Markdown snipping, 17-step batch pipelines, true content-stream redaction, and X.509 digital signature verification.
