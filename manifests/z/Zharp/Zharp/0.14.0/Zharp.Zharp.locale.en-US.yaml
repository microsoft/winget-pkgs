ShortDescription: A fast, modern terminal for Windows.
Description: |-
  Zharp is a terminal for Windows with GPU-accelerated text rendering, a custom
  VT emulator and shell integration. Commands and their output are grouped into
  blocks you can jump between, copy or search within. Sessions live in a sidebar
  or a top strip and can be dragged out into their own window. Themes, fonts and
  keybindings are configurable, and the whole app updates itself.
