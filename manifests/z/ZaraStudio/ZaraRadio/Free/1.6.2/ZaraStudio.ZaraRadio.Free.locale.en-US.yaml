ShortDescription: A freeware program for the Windows platform to automate radio stations.
Description: |-
  ZaraRadio is not a streaming program, but it is an audio player. In order to make streaming, there
  are several free programs, which can be used together with ZaraRadio. It is not a recording program
  either. In order to record, a good and free alternative is Audacity.

  ZaraRadio allows you to automate the transmission of music, commercials and prerecorded programs. It
  is also possible to connect with another radios through the line-in port of the soundcard or through
  Internet. ZaraRadio tries to be an intuitive and easy to use program, but without resigning to the
  benefits of other non-free programs.
