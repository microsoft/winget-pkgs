  ──────────────────────────────────────────────────┼───────────────────────────────────────────
  Linux x64 / ARM64（musl 静态链接，任意发行版可用）│FluxDown-CLI-0.5.2-linux-{x64,arm64}.tar.gz
  ──────────────────────────────────────────────────┴───────────────────────────────────────────
  解压后得到 fluxdown（Windows 为 fluxdown.exe），放入 PATH 即可使用；也可从源码安装：
  cargo install --git https://github.com/zerx-lab/FluxDown fluxdown_cli。
  fluxdown ping                         # 探活（需 FluxDown App / server 运行中）
  fluxdown add https://example.com/f.zip
  fluxdown ls
  服务地址经 --url 或 FLUXDOWN_URL（默认 http://127.0.0.1:17800），管理 token 经 --token 或 FLUXDOWN_TOKEN。
  [0.5.2] - 2026-10-01
  🚀 Features
  - (doctor) 支持动态权限诊断与显式修复
  - (downloads) 支持插件清单预览与批量建组
  - (sidebar) 统一侧栏收起与调宽行为
  - (settings) 按系统语言显示更新说明
  - (downloads) 支持在状态栏切换代理模式
  🐛 Bug Fixes
  - (gpui) 统一关于入口与设置定位
  - (rust) 强制处理错误并启用禁止忽错门禁
  - (build) 用轻量启动器兼容旧版 Windows 便携升级
  - (engine) 修复插件市场代理配置与下载诊断
  - (gpui) 修复插件登录二维码并同步 Web 展示
  - (rust) 修复 Rust 1.99 的 Clippy 兼容性
  - (engine) 修复慢代理尾段抢占延迟
