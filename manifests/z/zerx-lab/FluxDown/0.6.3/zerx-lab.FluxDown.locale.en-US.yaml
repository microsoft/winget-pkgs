  0.6.3 - 2026-10-24
  🚀 新功能
  - 系统代理支持 PAC 脚本：按每个下载链接分别决定走哪个代理，系统开启「自动发现代理」（WPAD）时也能自动识别（macOS / Windows / GNOME）。
  - 「自动」代理模式在起跑时并行探测多条备选线路，首条可用线路接管下载；传输失败会按类型归类，换线与自动重试更准确，被阻断的线路不再被选作备选。
  - 浏览器扩展新增「扩展错误」日志：记录扩展自身的错误（保留 7 天、最多 100 条），可在侧边栏「诊断」页查看，导出连接诊断时会一并附带并脱敏。
  - 浏览器扩展的商店签名安装包改为直接提供 .crx 文件，下载后可直接拖入浏览器安装；官网下载页将扩展离线包分为「商店签名包」（自动更新）与「开发者模式解压包」（不会自动更新）两类。
  - 官网下载页移除新版本邮件订阅与 macOS「已损坏」指南（macOS 版本已签名并公证）。
  🐛 问题修复
  - 修复下载遇到重定向时的凭据处理：跨子域跳转不再丢失浏览器 Cookie，302 响应下发的 Set-Cookie 也能正确带上。
  - 修复浏览器扩展在 YouTube 等站点上因样式加载产生跨源错误、样式可能被拦截的问题。
  - 修复浏览器扩展右键菜单在浏览器启动时可能因重复项而创建失败的问题。
  - 修复页面进入前进/后退缓存（bfcache）时扩展出现未检查的连接错误的问题。
  - 修复页面自身被 CSP 拦截的请求被误记为扩展错误的问题，并避免在 Cloudflare 验证框架中注入钩子。
  - 修复取消浏览器下载后扩展产生多余错误提示的问题。
  0.6.3 - 2026-10-24
  🚀 Features
  - System proxy now supports PAC scripts, choosing the proxy per download link. When the system has "Auto-detect proxy" (WPAD) enabled, it is discovered automatically (macOS / Windows / GNOME).
  - The "Auto" proxy mode now probes alternative routes in parallel at startup, and the first working route takes over the download. Transport failures are classified by type for more accurate route switching and auto-retry, and blocked routes are no longer picked as fallbacks.
  - The browser extension gains an "Extension errors" log that records the extension's own errors (kept for 7 days, up to 100 entries). View it on the side panel's Diagnostics page; it is included, with sensitive data redacted, when you export connection diagnostics.
  - The store-signed browser extension package is now delivered as a plain .crx file that can be dragged straight into the browser. The website download page now separates extension offline packages into "Store-signed packages" (auto-update) and "Developer-mode unpacked packages" (no auto-update).
  - The website download page no longer offers new-release email subscriptions or the macOS "app is damaged" guide (macOS builds are signed and notarized).
  🐛 Bug Fixes
  - Fixed credential handling on redirects: cross-subdomain redirects no longer lose browser cookies, and Set-Cookie sent with a 302 response is now applied correctly.
  - Fixed cross-origin errors and possibly blocked styles from the browser extension on sites such as YouTube.
  - Fixed the extension's context menu sometimes failing to build with duplicate-item errors at browser startup.
  - Fixed unchecked connection errors in the extension when a page enters the back/forward cache (bfcache).
  - Fixed requests blocked by a page's own CSP being wrongly logged as extension errors, and the extension no longer injects its hooks into Cloudflare challenge frames.
  - Fixed spurious extension errors after cancelling a browser download.
