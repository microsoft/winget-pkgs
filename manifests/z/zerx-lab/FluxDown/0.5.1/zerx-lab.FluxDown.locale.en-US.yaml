  解压后得到 fluxdown（Windows 为 fluxdown.exe），放入 PATH 即可使用；也可从源码安装：
  cargo install --git https://github.com/zerx-lab/FluxDown fluxdown_cli。
  fluxdown ping                         # 探活（需 FluxDown App / server 运行中）
  fluxdown add https://example.com/f.zip
  fluxdown ls
  服务地址经 --url 或 FLUXDOWN_URL（默认 http://127.0.0.1:17800），管理 token 经 --token 或 FLUXDOWN_TOKEN。
  0.5.1 - 2026-10-01
  🚀 新功能
  - Webhook 端点配置更健壮：配置中格式有误的条目会被跳过或回退为默认值，不再影响其他端点；桌面端与 Web 控制台同时编辑端点时会基于最新内容合并，不会覆盖他人的修改
  - Webhook 的任务创建 / 开始事件现在会根据来源链接推断临时文件名；投递日志按记录合并，并在重启后保留
  - 下载进度窗口改为固定尺寸，宽度随内容自适应且只增不减，避免窗口来回抖动；Windows / Linux 上标题栏仅保留最小化与关闭按钮
  🐛 问题修复
  - 修复桌面端任务列表右键菜单按旧选区弹出的问题（无选中时不弹出，或作用于上一次选中的任务）
  - 修复在简体中文等非 UTF-8 系统上，因 whoami 输出编码导致获取用户 SID 失败的问题
  - 修复极慢连接（如约 2 KiB/s）长期占着最后一小段数据、导致下载尾部迟迟无法完成的问题
  - 桌面端界面字体改用系统默认字体，修复 Windows 上同一行文字字号、粗细不一致的问题
  0.5.1 - 2026-10-01
  🚀 Features
  - More robust Webhook endpoint configuration: malformed entries are skipped or fall back to defaults without affecting other endpoints, and when the desktop client and Web console edit endpoints at the same time, changes are merged against the latest content instead of overwriting each other
  - Webhook task-created / task-started events now infer a temporary filename from the source URL; delivery logs are merged per record and kept across restarts
  - The download progress window now has a fixed size whose width adapts to content and only grows, avoiding jitter; on Windows / Linux the title bar keeps only minimize and close buttons
  🐛 Bug Fixes
  - Fixed the desktop task list right-click menu being built from a stale selection (not appearing when nothing was selected, or acting on the previously selected task)
  - Fixed failure to obtain the user SID on non-UTF-8 systems (e.g. Simplified Chinese) caused by the encoding of whoami output
  - Fixed very slow connections (e.g. ~2 KiB/s) holding on to the last small piece of a download indefinitely and delaying completion
  - The desktop UI now uses the system default font, fixing inconsistent font size and weight within the same line of text on Windows
