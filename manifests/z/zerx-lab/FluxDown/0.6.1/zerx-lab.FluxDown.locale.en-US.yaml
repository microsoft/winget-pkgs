  ⚠️ 从旧版（Flutter 版）升级：新版 Android 客户端换用了新的签名证书，不能直接覆盖安装旧版（系统可能提示「应用未安装」「软件包无效」「无法降级」或签名冲突）。
  请先在旧版中记下需要保留的下载任务与设置，卸载旧版后再安装新版；卸载会清除旧版的本地数据，已下载到公共目录的文件不受影响。
  0.6.1 - 2026-10-23
  🚀 新功能
  - 下载事件提示音：任务开始 / 完成 / 失败以及队列开始 / 完成可分别设为关闭、系统音或自定义音频文件，支持试听；启用完成提示音后完成通知自动静音，避免重复发声
  - 分类保存目录路由：新建下载（含浏览器扩展捕获）会按文件名自动落入对应分类目录；HTTP 任务启动时只发一次普通 GET 请求，不再先 HEAD / Range 探测，避免消耗一次性签名链接
  - 自动清理已完成任务记录：可在下载设置中选择保留天数，超期记录只删记录、不删文件，做种中的任务不受影响（桌面 / Web / Android / iOS）
  - 桌面与 Web 的顶栏、状态栏控件支持在自定义布局时手动隐藏，下载页搜索框与视图菜单也成为可移动、可隐藏的条目；搜索框隐藏时可用 Ctrl/Cmd+F 临时唤出
  - 侧栏设备区列出独立直连设备，可直接「下载到此设备」，并支持重命名、解除配对；Android 设备页同样可向已配对设备下发下载
  - 支持在应用内注销云账号（iOS 账户页提供入口，支持密码或邮箱验证码确认）
  - 新增 Webhook 事件 queue.started（队列由空闲转为开始下载时触发）
  - 状态栏限速菜单记住下载 / 上传各最近 3 个自定义值，并可清除
  - 新建下载的链接输入框默认一行，随内容自动增高（最多 10 行），文件名与线程数各占一行
  - 完成窗口点击「打开文件 / 所在文件夹」时按钮显示进行中状态
  - 新增 OpenWrt apk 格式软件包，支持 OpenWrt 25.12
  - 自定义分类管理移至下载设置页底部；设置页中数字输入框与下拉框同宽
  🐛 问题修复
  - 可直接暂停失败任务以撤销其自动重试
  - 新建下载解析现在容忍链接前的空白缩进以及零宽字符 / BOM，不再误丢弃链接
  - 修复浏览器扩展在桌面端响应卡住时，侧边栏 / 弹窗一直显示「未连接」或「当前页面没有可用的资源数据」的问题；弹窗与侧边栏的连接状态现在保持一致
  - 修复 macOS 27 上状态栏托盘提示常驻不消失的问题（关机倒计时改显示在「取消关机」菜单项）
  - 修复 Linux 托盘项在重启后被重命名的问题，GNOME 顶栏整理扩展可记住其位置
  - 修复插件在内存紧贴上限时的内存超限未被正确识别的问题
  - iOS 商店版不再显示「做种中」文件夹
  0.6.1 - 2026-10-23
  🚀 Features
  - Download event sounds: task start / complete / fail and queue start / finish can each be set to off, a system sound, or a custom audio file, with preview; enabling the completion sound mutes the completion notification to avoid double sounds
  - Category save-directory routing: new downloads (including browser extension captures) are placed into the matching category folder by file name; HTTP tasks now start with a single plain GET instead of HEAD / Range probing, so one-time signed URLs are no longer consumed
  - Auto-clean completed task records: choose a retention period in download settings; expired records are removed without deleting files, and seeding tasks are skipped (desktop / Web / Android / iOS)
  - Desktop and Web title bar and status bar controls can be manually hidden in custom layout mode; the downloads page search box and view menu are now movable, hideable items, and Ctrl/Cmd+F temporarily reveals a hidden search box
  - The sidebar device section lists standalone direct-connect devices with "Download to this device", rename and unpair; the Android Devices page can also send downloads to paired devices
  - Cloud accounts can now be deleted from within the app (entry on the iOS account page, confirmed by password or email code)
  - New Webhook event queue.started (fires when a queue goes from idle to downloading)
  - The status bar speed-limit menu remembers the 3 most recent custom download / upload values and lets you clear them
  - The New Download link box is one line by default and grows with content (up to 10 lines); file name and thread count each get their own row
  - The completion window shows a busy state on the button when opening a file or its folder
  - New OpenWrt apk package for OpenWrt 25.12
  - Custom category management moved to the bottom of the download settings page; number inputs and dropdowns in settings now share the same width
  🐛 Bug Fixes
  - Failed tasks can now be paused directly to cancel their automatic retry
  - New Download parsing now tolerates leading whitespace before links as well as zero-width characters / BOM, so links are no longer dropped
  - Fixed the browser extension sidebar / popup staying "disconnected" or showing "no resource data for the current page" when the desktop app was unresponsive; popup and sidebar connection status are now consistent
  - Fixed the status bar tooltip getting stuck on macOS 27 (the shutdown countdown now appears on the "Cancel shutdown" menu item)
  - Fixed the Linux tray item being renamed after restart, so GNOME top bar extensions can remember its position
  - Fixed plugin out-of-memory errors not being recognized correctly when memory sits right at the limit
  - The iOS store edition no longer shows the "Seeding" folder
