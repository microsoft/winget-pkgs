ReleaseNotes: |-
  [0.4.5] - 2026-08-14
  🐛 问题修复
  - 修复部分环境下（旧卸载程序被标记为只读、ACL 权限受限）覆盖升级安装时报 "access denied" 失败的问题；此类环境下现在可以手动选择以管理员身份安装，静默自动更新仍按最低权限执行，不受影响
  - 修复应用内更新弹窗把中英文更新日志混排显示的问题，现在会按当前界面语言只显示对应语言的内容
  - 修复部分 Windows 系统上任务栏的资源管理器等固定图标被错误替换成 FluxDown 图标的问题，并会在启动时自动检测、修复此前已被影响的固定图标
  [0.4.5] - 2026-08-14
  🐛 Bug Fixes
  - Fixed an "access denied" failure during upgrade installs in certain environments (a read-only leftover uninstaller, or restricted ACL permissions); you can now choose to install as administrator in these cases, while silent auto-updates continue to run with the lowest privileges as before
  - Fixed the in-app update dialog showing the Chinese and English changelog mixed together; it now shows only the content matching your current interface language
  - Fixed an issue on some Windows systems where pinned taskbar icons (e.g. File Explorer) could be incorrectly overwritten with the FluxDown icon; the app now also detects and repairs any pinned icons affected by this on startup
