ReleaseNotes: |-
  [0.4.3] - 2026-08-13
  🚀 新功能
  - 应用图标自定义（默认 / 闪电 / 自定义）现已支持 macOS 与 Linux，此前仅 Windows 支持；切换图标后，桌面快捷方式、开始菜单、任务栏、Dock、托盘等位置会一并同步更新。
  - 账户页昵称支持自助编辑，悬浮即可看到编辑入口，保存后立即刷新当前登录状态。
  - 套餐徽标新增 outline / solid / medal / ribbon 等多种视觉样式，购买对话框与账户信息区随之更新；部分套餐还可展示专属编号（如「创始会员 No.0007」）。
  - 购买买断制套餐时，若当前已持有更高档位，购买弹窗会禁止选择较低档位，避免误购导致权益降级。
  🐛 问题修复
  - 修复 macOS 下将窗口关闭到托盘后，Dock 图标仍然常驻不消失的问题。
  - 注册时的错误提示更加明确：邮箱格式错误与密码长度不足现在会分别提示，不再是笼统的一条错误信息。
  [0.4.3] - 2026-08-13
  🚀 Features
  - App icon customization (default / lightning / custom) now works on macOS and Linux, not just Windows — switching the icon also updates the desktop shortcut, Start menu, taskbar, Dock, and tray icon to match.
  - Account nicknames can now be edited directly from the account page — hover to reveal the edit button, and changes take effect immediately after saving.
  - Plan badges (in the purchase dialog and account header) now support multiple styles — outline, solid, medal, and ribbon — and some plans can display a personal member number (e.g. "Founding Member No.0007").
  - When purchasing a buyout plan, the purchase dialog now blocks selecting a tier lower than the one you already own, preventing accidental downgrades.
  🐛 Bug Fixes
  - Fixed the Dock icon staying visible on macOS after closing the window to the tray.
  - Registration error messages are now more specific — an invalid email format and a too-short password now show separate messages instead of one generic error.
