ShortDescription: Mission control for Claude Code — browse, search, and drive your Claude Code sessions from a native desktop app.
Description: Monet is a native desktop app that acts as mission control for Claude Code and Codex. Its multi-column workbench lets you browse and search agent sessions, follow tool calls, and drive work across multiple engines from one place, with local data and privacy in mind.
