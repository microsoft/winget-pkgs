ShortDescription: iCloud Photos, iCloud Drive and Apple Notes on Windows, without iCloud for Windows.
Description: |-
  A free, open-source tray app that keeps iCloud Photos and iCloud Drive as real files in normal folders,
  synced in both directions, and exports Apple Notes as browsable, searchable HTML. Deletions are never
  permanent (Recycle Bin / Recently Deleted) and large deletions wait for your confirmation.
  Not affiliated with Apple.
