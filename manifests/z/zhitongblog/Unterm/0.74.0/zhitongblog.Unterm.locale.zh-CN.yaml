ShortDescription: 面向 AI 编码智能体驱动而设计的 GPU 加速跨平台终端。
Description: |-
  Unterm 是面向 macOS、Linux 与 Windows 的终端模拟器，基于纯 Rust 编写的 GPU 终端引擎。它针对全天候运行 Claude Code、Codex CLI、Antigravity（agy）、Gemini CLI、OpenCode、Qwen Code 与 Aider 等 AI 编码命令行的工作流，解决常规终端在此场景下的痛点：大量智能体输出导致的输入延迟与丢键、全屏 TUI 撕裂与闪烁、Windows 控制台黑窗闪现与 Ctrl+C 崩溃、多个智能体在同一仓库中互相覆盖、审批提示散落在各标签页中、Token 与费用统计分散、为喂给 AI 而翻找构建日志，以及未经提交的 AI 修改。

  每个 Unterm 窗口都会在自动分配的端口上启动本地 MCP 服务器与本地 HTTP 设置服务器。两者均使用令牌鉴权且仅监听回环地址，不经过云端往返，因此外部智能体可以通过这些经身份验证的方法生成 shell、执行命令、读取窗格状态、截取屏幕、录制会话并驾驭驾驶舱。

  Agent Cockpit 以标签页徽标跟踪每个窗格中智能体的状态，把等待输入的智能体汇总到收件箱，让多个智能体在相互隔离的 Git 工作树中协同完成同一任务，并提供 Review 页面用于校验、排名、比对差异、压缩合并或回滚它们的产出。

  Windows 上的渲染使用 Direct3D 12，并依次回退到 OpenGL 与软件渲染。配置在浏览器中的 Web 设置页面完成，界面内置 16 种语言并依据系统区域自动选择。Windows 的 MSI 安装程序会把 unterm.exe、unterm-cli.exe 与 unterm-core.exe 安装到 Program Files\Unterm，并创建开始菜单快捷方式。
