ShortDescription: GPU-accelerated cross-platform terminal built to be driven by AI coding agents.
Description: |-
  Unterm is a terminal emulator for macOS, Linux, and Windows built on a pure-Rust GPU terminal engine. It targets the workflow of running AI coding CLIs such as Claude Code, Codex CLI, Antigravity (agy), Gemini CLI, OpenCode, Qwen Code, and Aider all day, and addresses the pain points ordinary terminals hit there: typing lag and dropped keys under heavy agent output, full-screen TUI tearing and flicker, stray Windows console window flashes and Ctrl+C crashes, parallel agents overwriting each other in one repository, approval prompts buried across tabs, scattered token and cost tracking, digging through build logs to feed the AI, and uncommitted AI edits.

  Every Unterm window starts a local MCP server and a local HTTP settings server on auto-allocated ports. Both are auth-token gated and loopback-only, with no cloud round trip, so an external agent can spawn shells, run commands, read pane state, capture screenshots, record sessions, and drive the cockpit through the authenticated methods.

  The Agent Cockpit tracks each pane's agent state with tab badges, collects the agents waiting for input into an Inbox, runs fleets of agents on one task in isolated Git worktrees, and offers a Review page that verifies, ranks, diffs, squash-merges, or rolls back what they produced.

  Rendering uses Direct3D 12 on Windows, falling back to OpenGL and then software rendering. Configuration lives in a browser-based Web Settings page, and the interface ships in 16 languages detected from the system locale. The Windows MSI installs unterm.exe, unterm-cli.exe, and unterm-core.exe into Program Files\Unterm and adds a Start Menu shortcut.
