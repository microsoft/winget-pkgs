ShortDescription: Cross-platform terminal that AI agents can drive over MCP.
Description: |-
  Unterm is a cross-platform terminal (Windows, macOS, Linux) built on its own
  next-core terminal engine, with one design bet: the terminal itself is
  controllable from the outside by any AI agent over MCP. Claude Code, Codex,
  Gemini CLI, Cursor, Aider or your own scripts all get the same JSON-RPC
  surface to spawn shells, run commands, read pane state, capture screenshots,
  change settings and record sessions.

  The package installs the Unterm window (unterm.exe), the unterm-cli command
  line driver and MCP bridge, and the unterm-core engine process that holds
  every session.
