ShortDescription: 可以让 AI 智能体通过 MCP 直接驱动的跨平台终端。
Description: |-
  Unterm 是一款跨平台终端（Windows、macOS、Linux），基于自研的 next-core 终端引擎。
  它的核心设计是：终端本身可以被任何 AI 智能体通过 MCP 从外部控制。Claude Code、
  Codex、Gemini CLI、Cursor、Aider 或你自己的脚本，都通过同一套 JSON-RPC 接口来
  启动 shell、执行命令、读取窗格状态、截图、修改设置和录制会话。

  安装包包含 Unterm 窗口程序（unterm.exe）、命令行驱动与 MCP 桥接 unterm-cli，
  以及持有全部会话的引擎进程 unterm-core。
