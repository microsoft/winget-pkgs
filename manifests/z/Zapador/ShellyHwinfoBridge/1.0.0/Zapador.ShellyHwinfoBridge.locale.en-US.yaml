ShortDescription: Publishes live wall power from a Shelly smart plug into HWiNFO as custom sensors.
Description: A small Windows tray app that reads the wall (AC) power of your PC from a Shelly smart plug and writes it into HWiNFO as custom sensors, together with the estimated DC power from your PSU's efficiency curve, the PSU loss, the power of the components HWiNFO does not measure and the energy used today and this month.
