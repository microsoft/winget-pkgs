ShortDescription: Static analysis for GitHub Actions.
Description: |-
  zizmor is a static analysis tool for GitHub Actions.

  It can find many common security issues in typical GitHub Actions CI/CD setups, including:
  - Template injection vulnerabilities, leading to attacker-controlled code execution
  - Accidental credential persistence and leakage
  - Excessive permission scopes and credential grants to runners
  - Impostor commits and confusable git references
  - ...and much more!
Tags:
- github-actions
- security
- security-tools
- static-analysis
ReleaseNotes: |-
  New Features 🌈
  - New audit: dangerous-checkout detects dangerous Git checkout patterns. The initial version of this audit is limited to actions/checkout (#2532)
  Enhancements 🌱
  - The impostor-commit audit is now aware of workflow lockfiles (#2534)
  - The ref-confusion audit is now aware of workflow lockfiles (#2536)
  - Recommend gh release download as a replacement for robinraju/release-downloader in superfluous-actions (#2552)
  - The self-hosted-runner audit is now aware of xcode-27 Github runners (#2546)
  - apm is now recognized as a package-ecosystem in dependabot.yml (#2544)
  - The dependabot-cooldown audit now supports the semver-{major,minor,patch}-days cooldown settings (#2544)
  Bug Fixes 🐛
  - LSP: Fixed a bug where findings that should have been suppressed when a workflow lockfile is present were still presented (#2520)
  - Fixed a bug where zizmor would fail to audit workflow inputs containing a bare i.e. null inputs: (#2527)
  - Fixed a bug where zizmor would crash on some YAML inputs containing anchors mixed with comments (#2522)
    Many thanks to @DarkaMaul for implementing this fix!
  - Fixed a bug where the undocumented-permissions audit would incorrectly flag a none permission as requiring an explanatory comment (#2530)
  - Fixed a bug where zizmor would crash on workflow lockfiles that lack a dependencies key (#2543)
  - Fixed a bug where the dependabot-cooldown audit would fail to audit some update stanzas (#2544)
  - Fixed a bug where zizmor would crash on pre-commit inputs containing valid SCP-style Git repository references (e.g. git@github.com:org/repo) (#2553)
