ShortDescription: See and undo what AI agents do on your machine
Description: Footprints is a local ledger of what AI coding agents do. It records every file they write, create or delete, every shell command they run and every network call their tools report. Each file change keeps a copy of the file before and after, so any one step can be shown as a diff and undone. Native hooks for Claude Code, Cursor, Codex CLI and Gemini CLI, a wrapper for any terminal agent and a daemon for anything else.
