ShortDescription: Run several AI coding agent CLIs in parallel on one git repository
Description: pact runs several AI coding agent CLIs (GitHub Copilot CLI, Claude Code, Codex, Gemini CLI, Antigravity) in parallel on one git repository. `pact run` takes one task, has a planner split it into units that own disjoint files, runs the units as parallel lanes in one shared tree, commits, and verifies the combined result against a baseline, repairing regressions. `pact fleet` runs independent tasks with a branch each.
Tags:
- agents
- ai
- automation
- claude
- cli
- git
- worktree
ReleaseNotes: |-
  pact fleet and pact ui for independent tasks; pact land and discard (a pact run batch lands whole).
  --model on ACP lanes, with the model the agent ran recorded.
  pact run: units can depend on other units (waves); workers run checks through run_check under machine-wide slots; verify timeout; failing files and parallel per-unit repair; file ownership checks; refuses a dirty checkout without --allow-dirty.
  pact gc prunes old state; reports lead with the diff stat and failing checks.
  Windows: agent CLIs resolve in PATH order (VS Code's copilot shim no longer shadows npm's).
