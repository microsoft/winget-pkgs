ShortDescription: Orchestrate multiple AI coding agent CLIs in parallel via git worktrees
Description: pact is a language-agnostic orchestrator for running multiple AI coding agent CLIs (Claude Code, GitHub Copilot CLI, Codex, Gemini CLI) in parallel on the same git repository, without them fighting each other. Each agent gets its own git worktree for real filesystem isolation, conflicts get detected and surfaced instead of discovered the hard way, and merge-all gets every agent's work back onto one branch automatically wherever it safely can.
