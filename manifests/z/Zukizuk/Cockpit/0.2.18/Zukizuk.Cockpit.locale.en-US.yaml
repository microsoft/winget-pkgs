ShortDescription: A calm, free-form board on your PC for links, files, sticky notes and what your AI agents make.
Description: |-
  Cockpit is a board on your own PC for the work in front of you: links to read later, files, screenshots,
  spreadsheets, sticky notes, snippets and what your AI agents make. Claude Code can work on the board with you:
  read what you share, lay out a plan, ask questions with its best guess, and wait for your OK before it removes
  anything. It runs locally and installs for your user with no admin rights.
