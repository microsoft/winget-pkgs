ReleaseNotes: |-
  ZZZ 2.2.2 包含 5 项改进，全部附带新增边界测试（CI 于 windows-latest 构建三架构并通过全部测试）：

  • **快捷键修复与补齐**：修复 Alt+Left / Alt+Right / Alt+D 在启动页、地址栏等 WPF 原生界面完全失效的问题（WPF 将 Alt 组合键报告为 Key.System）；新增 `F5` 刷新、`Ctrl+Tab` / `Ctrl+Shift+Tab`（及 `Ctrl+PageDown` / `Ctrl+PageUp`）循环切换标签、`Ctrl+1`–`Ctrl+8` 直达对应标签、`Ctrl+9` 跳到最后一个、`Ctrl+D` 收藏/取消收藏、`Ctrl+H` 资料库、`Ctrl+J` 下载列表；网页获得焦点时同样生效，并支持鼠标中键关闭标签页。
  • **Ctrl+Shift+T 重新打开最近关闭的标签页**：会话内记录最近 25 个已关闭的普通标签，按后进先出恢复到原工作区；隐私标签与内置启动页从不记录，列表仅保存在内存中、从不落盘。
  • **历史记录写入合并**：访问页面不再每次导航都对最多 3000 条记录重新加密并整写 `history.dat`，改为约 3 秒后台合并写入；删除单条、清空历史与退出流程仍即时落盘，显著降低磁盘 I/O 与便携存储磨损。
  • **下载启动稳健化**：下载目录无效或不可写时自动回退（配置目录 → 用户"下载"文件夹 → TEMP），不再在 WebView2 下载事件内抛异常导致浏览器崩溃；外部下载器参数模板缺少 `{url}` 时自动附加下载地址，内嵌引号以 `%22` 转义。
  • **版本号单一来源（AppVersion）**：用户脚本 `GM_info` 与广告规则更新、脚本导入、网站图标抓取的 User-Agent 均引用同一常量，边界测试锁定程序集版本与其一致；本 Release 的三架构 EXE 由新增的 tag 触发工作流自动构建并附带 SHA-256 清单。

  完整变更见 [CHANGELOG.md](https://github.com/zengjiangy/ZZZ/blob/main/CHANGELOG.md)。官网与 R2 下载服务同步更新到 2.2.2。

