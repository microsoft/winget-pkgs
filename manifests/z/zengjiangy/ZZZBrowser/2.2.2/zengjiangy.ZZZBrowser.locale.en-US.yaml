  | `ZZZ-v2.2.2-win-x86.exe` | Windows 10 x86 32 位兼容版 | `ZZZ-v2.2.2-SHA256SUMS.txt` |
  | `ZZZ-v2.2.2-win-arm64.exe` | Windows ARM64 原生版本 | `ZZZ-v2.2.2-SHA256SUMS.txt` |
