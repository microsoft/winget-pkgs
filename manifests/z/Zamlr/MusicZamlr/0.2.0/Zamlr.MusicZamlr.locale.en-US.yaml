ShortDescription: Compare two copies of a music library and copy over only the missing tracks and better versions.
Description: |-
  Music Zamlr compares two local music collections. It shows which tracks you do not have, which tracks exist in better quality in the other collection, and which tracks you already have. Then it copies only the files that you select.
  The comparison uses file hashes, acoustic fingerprints, and tags. The program runs only on your computer and sends nothing over the network.
