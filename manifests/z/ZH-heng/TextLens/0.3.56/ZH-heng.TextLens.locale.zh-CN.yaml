ReleaseNotes: |-
  Release version 0.3.56
  - First public release: selection assistant for macOS (Apple Silicon) and Windows 10/11 x64
  - Selection toolbar: copy, search, translate, summarize, explain, polish, Ask AI, and custom actions
  - Multi-provider / multi-model (OpenAI-compatible), with provider enable/disable
  - Streaming result window with Markdown / tables / math; switch model in the header; switch translation target language

  发布版本 0.3.56
  - 首个公开 Release：macOS（Apple Silicon）与 Windows 10/11 x64 划词助手
  - 划词工具栏：复制、搜索、翻译、总结、解释、润色、问 AI 与自定义动作
  - 多服务商 / 多模型（OpenAI-compatible），服务商可启停
  - 结果窗流式输出，支持 Markdown / 表格 / 公式；标题栏可换模型、翻译可切换目标语言
