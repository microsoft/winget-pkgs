PackageIdentifier: ZH-heng.TextLens
PackageVersion: 0.4.0
PackageLocale: zh-CN
ShortDescription: 轻量级划词助手，为选中的任何文字提供复制、搜索、翻译、总结、解释、润色与 AI 操作。
Description: TextLens 是一款适用于 Windows 10/11 x64 的轻量级划词助手。选中任意文字即可弹出浮动工具栏，提供复制、搜索、翻译、总结、解释、润色、问 AI 与自定义动作；结果窗口支持 Markdown、表格与公式的流式输出，支持多服务商、多模型（OpenAI-compatible）、服务商启停与翻译目标语言切换。
Tags:
- 人工智能
- 划词
- 剪贴板
- 助手
- 大语言模型
- 搜索
- 翻译
ReleaseNotes: |-
  - 优化 macOS 与 Windows 多种软件中的划词捕获兼容性和稳定性，覆盖 PDF、Office、浏览器及自绘文本区域
  - 提升划词工具栏响应速度和可靠性，加入分阶段展示、悬停反馈与长时间运行恢复机制
  - 优化流式 Markdown 渲染，统一段落、列表、代码块、表格和公式的间距
  - 加固全局快捷键注册、失败回滚、组合键修饰键捕获，并支持结果框继续提问和多轮交互
