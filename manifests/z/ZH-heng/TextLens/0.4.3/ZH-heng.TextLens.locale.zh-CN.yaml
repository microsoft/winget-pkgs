PackageIdentifier: ZH-heng.TextLens
PackageVersion: 0.4.3
PackageLocale: zh-CN
ShortDescription: 轻量级划词助手，为选中的任何文字提供复制、搜索、翻译、总结、解释、润色与 AI 操作。
Description: TextLens 是一款适用于 Windows 10/11 x64 的轻量级划词助手。选中任意文字即可弹出浮动工具栏，提供复制、搜索、翻译、总结、解释、润色、问 AI 与自定义动作；结果窗口支持 Markdown、表格与公式的流式输出，支持多服务商、多模型（OpenAI-compatible）、服务商启停与翻译目标语言切换。
Tags:
- 人工智能
- 划词
- 剪贴板
- 助手
- 大语言模型
- 搜索
- 翻译
ReleaseNotes: |-
  - 修复源码审查中发现的潜在 bug 与逻辑错误，覆盖 macOS 和 Windows 的划词处理、动作执行、设置保存及结果窗口等功能。
  - 优化工具栏和结果框的弹出速度，并行处理窗口初始化任务；采用更短、更流畅的 90 毫秒淡入过渡。
  - 优化流式结果播放与 Markdown 渲染，显示节奏随内容到达情况自适应调整，并在生成结束后补齐完整响应。
  - 改进问 AI 的失败重试行为，重试时保留原问题及对话历史。
  - 提升设置保存可靠性，保留保存期间继续编辑的新草稿；改进弹窗焦点处理与校验错误字段定位。
  - 阻止已绑定到停用服务商的动作继续执行；macOS 在复制或搜索成功、或结果窗口成功显示后，再延迟清除宿主应用中的选区高亮。
