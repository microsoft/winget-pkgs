ShortDescription: A lightweight selection assistant that brings copy, search, translate, summarize, explain, polish, and AI actions to any text you select.
Description: TextLens is a lightweight selection assistant for Windows 10/11 x64. Select text anywhere and a floating toolbar offers copy, search, translate, summarize, explain, polish, Ask AI, and custom actions. Results stream in a window with Markdown, tables, and math support, with multi-provider and multi-model (OpenAI-compatible) connections, per-provider enable and disable, and switchable translation target languages.
