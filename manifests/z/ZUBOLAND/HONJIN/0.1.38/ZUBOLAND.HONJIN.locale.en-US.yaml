  - AIが好む語や言い回し（熱量・腹落ち・地味に効く など）を🟡で知らせます。あなたのお手本に出てくる語は責めません
  - 全角の数字（３２％ など）も数字の照合に入れました。材料に無い数字は、全角で書かれていても🔴で止まります
  - 検査器が古いままだと、材料に無い名前の検査が走らないことを🟡で知らせます
  この版の検査は社内でダブル監査（Codex 5回＋実測）を通しています。AIに新しく渡す情報はありません（比べるのはあなたのPCの中だけです）。
