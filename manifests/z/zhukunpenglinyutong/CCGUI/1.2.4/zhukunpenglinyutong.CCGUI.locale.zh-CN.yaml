ReleaseNotes: |-
  New Features
  - 支持按工作区设置新建会话的默认引擎
  - 支持插件续接原生会话并修复历史恢复交互
  Fixes
  - 完善工作区默认引擎的手动改选、取消与重复请求
  - 修正工作区默认引擎的审查问题
  - 主机时钟偏慢时同名重派发不再丢弃自身完成通知
  - 插件续接沿用用户在会话中切换的模型
  - 修复插件轮次停止竞争与重试行为
  - 修正插件续接的停止范围与会话配置继承
  - 子代理状态按评审收敛身份、名册与补读边界
  - 完成子代理状态收敛与竞态修复
  - 修复子代理状态条卡住并补读后台通知
  Performance Improvements
  - batch accepted frame persistence
  - cache stream display context per run
