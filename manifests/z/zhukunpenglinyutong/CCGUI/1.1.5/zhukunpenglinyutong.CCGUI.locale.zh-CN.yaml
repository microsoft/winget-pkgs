ReleaseNotes: |-
  New Features
  - 每次 spawn 写独立宿主日志，并确保启动令牌不落盘 (#1377)
  - 支持自定义字体族并统一代码区域字体设置
  Fixes
  - 字体模式下拉框在保存失败时回退，Web 端如实显示已上传字体
  - 重启后 omp 会话的图片按 CLI blob 库解析 (#1383)
  - DSH 会话保留宿主通告的真实上下文窗口，claude 启动模型保留 [1m] 后缀 (#1376)
  - 首启缺前提四件套——新建会话接着开会话、发送键说明原因、空态分流、草稿不丢 (#1375)
  - 未启用的引擎不再探测模型目录，opencode 不再被拉起
  - DSH 的用量明细不再全为 0（camelCase 计数未被解析）
  - stop engine events from wiping the composer draft
