ReleaseNotes: |-
  New Features
  - 前端发送/恢复/历史链路适配 Qoder canonical 身份
  - Shared 链路按 profile-qualified identity 认主与隐藏
  - catalog 与 provider binding 全面携带 Qoder 分发归属
  - Qoder 行迁移为 profile 限定身份并贯穿写入链路
  - 落地 profile 限定的 Native 会话身份解析
  - 接入 Global 与 CN 双分发
  - 接入 Shared Session 执行目标
  - 补采黄金 turn 并升级 capability matrix 实测格
  - add close control for embedded Browser Dock panel
  - 接入 Qoder CLI 作为第九个 Native 引擎
  - add managed library and Wallhaven market
  - 重做增强提示词弹窗并修 DSH catalog 发送
  - 在响应中条实时显示本轮 token
  - 给自动模式接上 danger-full-access 并折叠审批调试字段
  - 给 Shared 回合徽章加上 runtime 回执
  - 按供应商分组 DeepSeek Harness 模型菜单
  - 为 DeepSeek 模型接入思考强度选择
  - 把自动续跑标记收进气泡并标注次数时间
  - 供应商失败后同一家自动续跑
  Fixes
  - 修复协作模板选择器卡在加载中
  - 按 Target 认主并隐藏 Shared 下崽会话
  - 修复上下文投影与重试分类
  - 修复 Qoder Shared 子会话隐藏
  - 隐藏 Shared 下崽会话
  - 消化存量测试欠账（codex 目录漂移 + app-shell bridge 白名单）
  - 对齐队列删除 fallback 与 onRemove 拓宽签名
  - 隔离 Bun 临时原生产物
  - default frost to 0px so wallpapers stay sharp
  - 修复共享待确认队列卡死
  - 收口 Native runtime 契约
  - 本地优先读取会话历史
  - 收齐 ACP 回放尾包以免历史截断
  - 补 Windows 官方安装目录检测
  - 暴露 plugin tree 内层启动失败原因
  - 适配 v1 credentials refs 以修复额度查询
  - frost all settings cards over workspace wallpaper
  - 补齐 commands/execute 必填 images 字段
  - recast dark surfaces to achromatic graphite
  - lift dark secondary ink and isolate wallpaper picker surfaces
  - skip empty DSH branch row on homepage create-session
  - restore unstaged discard from the index, not HEAD
  - 合并超长会话的 token 级流式 delta
  - 修复 Prompt Enhancer 测试类型错误解除打包阻塞
  - 让 PI 模型菜单按供应商分组展示
  - 将 Claude 静默进程退出纳入自动续跑
  - keep session HUD overflow visible so icon tooltips are not clipped
  - keep invert-fill primary labels readable on light themes
  - 按供应商补齐官方套餐额度查询
  - 让官方供应商模型选择走 host catalog
  - 接通对话框已编辑文件变更列表
  - 收住 Codex native 子代理侧栏升顶
  - 将供应商 405/424/429/502 错误码纳入自动续跑
  - 切回 DSH 会话时还原引擎与模型绑定
  - 将供应商 401 无效 Key 纳入号池重试
  - 删除供应商时回退新建菜单记忆
  - 阻止空幕布漏出 leftover Exploring
  - 保留 Codex Shared 协议行以免侧栏漏崽
