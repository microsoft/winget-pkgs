ReleaseNotes: |-
  New Features
  - 状态栏分支列表支持搜索过滤，行内任意位置显示分支全名
  - enhance tab strip context menu with batch close, split, and file actions
  Fixes
  - 评审跟进——驻留续答进程设置漂移回退 --resume，驻留登记限聊天事件汇
  - 原生 title 气泡压过 react-aria 弹层，弹层内的提示不再被盖住
  - 后台任务完成后的续答不再被丢弃
  - 轮转判断移入锁内，并按运行回收旧日志
  - support multi-engine workspace skills and commands (.agents, .codex, etc.)
  - 百度统计换用新建站点 ID
