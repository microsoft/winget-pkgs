ReleaseNotes: |-
  New Features
  - 支持将文件选区引用到对话
  - 会话右键新增「复制文件路径」「打开文件路径」 (#1520)
  - Antigravity (agy) 引擎支持粘贴与图片附件
  - 插件中心支持用已连接的模型翻译插件介绍
  Fixes
  - 模型目录探测失败时不再重置已选模型
  - Codex 会话切回自动后不再卡在 Plan 模式
  - 切换会话时状态条不再闪现上一个会话的汇总
  - keep GBK saves byte-exact and report correct lines
  - 引用选区后切回对话并说明不可用原因
  - 支持 Windows 系统通知提示音
  - 修复 Claude 工具输出触发授权卡误报
  - 续聊复用同一会话后的计划模式残留、会话失效与轮次串扰
  - 异步创建期间丢失的隐藏、尺寸与导航在创建完成后补齐
  - create Windows child webviews off the main thread
  - resume existing sessions instead of recreating them
  - 插件翻译的边界情况：README 译文保留、跟随会话渠道、失败可见、残缺译文不入缓存
  - agy 只发图片的消息重载后正确提取附件
  - preserve legacy text encodings
  Performance Improvements
  - 收敛长会话流式渲染与工具输出开销
