ReleaseNotes: |-
  New Features
  - 市场行展示累计下载量与仓库直达 —— download-counts.json 容错接入 / 开发指南改弹窗
  - 版本记录补 1.0.1/1.0.2 条目并可从状态栏打开 —— Star 按钮收进头部 / 弹窗正文滚动修复
  - 会话行右键菜单 —— 重命名/复制 ID/删除
  - 快捷键系统迁移——可配置键位、设置页录制编辑、快捷键指南
  - WSL 插件全链接入 —— 会话源/文件源/UI 桥/远程历史回放/远程模型目录
  - Qoder 区分国际版与国内版(qoder-cn 兄弟引擎)
  - 接入 OpenCode 与 Qoder 两个一等引擎
  - bump 分支改用 vX.Y.Z 命名，版本每段满十进一
  - omp 补 plan/bypass 权限档，pi 维持自动
  - 右键文件夹搜索工作区文件
  Fixes
  - 开发与提交插件对话框加关闭按钮
  - 新会话不再被刷新冲掉 —— 侧栏即时显示无需手动同步
  - WSL 审查三处修复 —— 远程调用 30s 全局超时 / meta.wsl 服务端 grant 强制 / agy_catalog 断头注释恢复
  - WSL 接入安全审查修复 —— meta.wsl 全字段白名单/权限模型收紧/侧栏与 pin 回归
  - opencode 的家目录在测试下跟随 HOME/USERPROFILE
  - qoder 的 Windows 项目 slug 去掉盘符冒号
  - prevent retries from reviving settled runs
  - opencode 的家目录在测试下跟随 HOME/USERPROFILE
  - qoder 的 Windows 项目 slug 去掉盘符冒号
  - 触屏滑动不再被内容增长拽回尾部
  - 重试状态进回合指示器，omp todo 用工具结果做权威快照
  - 移动端设置导航分组溢出重叠
  - 放行 asset 协议在 Windows 上的可用 URL 形式
  - 发版增加版本输入校验门禁，修复 latest.json 资产名空格 404
  - Windows 检测不到新装/非 npm 渠道安装的 codex 与 claude
  - claude 上下文窗口改读 CLI 上报值
  - 测试下家目录跟随 HOME/USERPROFILE
  - 窄窗侧边栏开关常显、幕布区留白、子代理行归并
  - 「已编辑」行数改从会话编辑调用统计
