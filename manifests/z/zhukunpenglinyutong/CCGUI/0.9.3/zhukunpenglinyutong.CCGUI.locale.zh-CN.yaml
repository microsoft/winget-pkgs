ReleaseNotes: |-
  New Features
  - 落地后台任务全链路体验：任务卡、通知折叠、状态 pill 与 registry 兜底
  - 压缩入口并入上下文圆圈且弹窗改为锚定 popover
  - 模型菜单撞名行保留中段路径区分同 provider 多上游
  - 极简模式流式回合整段折叠且展开时内部逐段折叠
  - 置顶区段头去 pin 图标与工作区对齐并常亮已置顶会话图钉
  - 置顶区恢复总折叠行并拆分全局/项目内互斥双置顶作用域
  - 新增幕布极简展示模式按回合整段折叠过程叙述
  - 扩展 Shared/Atomic 思考档位联动到 PI 引擎
  - 模型选择子菜单支持搜索筛选
  - 接入按模型思考强度选择并打通发送闸门
  - 供应商认证新增自定义供应商配置区块（models.json 读写）
  - rewind/fork 附带删除接入 v2 并清理死代码
  - 重构会话删除链路为 Index First 标记优先 v2 架构
  - 侧栏 pi 会话丢失全链路掉点诊断埋点
  - 重试次数上限从 10 放宽到 999
  - fork 弹窗接 i18n 并将不可分叉报错映射为行动指引
  - add workspace settings for default visible sessions
  - 接入 RPC 长驻会话并落地分叉/会话树/融合/压缩原生能力
  Fixes
  - PI catalog 探测跳过 extension boot 并放宽预算至 15s 根除 auto-only 降级
  - client store 写盘改 raw-string 过桥并遏制 markdown worker 崩溃循环
  - process_is_alive 增加 Windows 平台分支并按 cfg 分流
  - Codex discovery 提取保留 runtime reasoning 元数据
  - Codex usage 事件不再伪造 200K 上下文窗口
  - Codex managed scope 模型目录不再拼接官方 generated fallback
  - provider-owned Codex 模型补思考强度默认档并优先命中官方 catalog identity
  - 新增孤儿 turn 零首事件看门狗防止「响应中」永久卡死
  - PI 不可用窗口 send gate 双证据快速失败并兜底 detached send panic
  - 优化 provider env_key 批量解析并修复 daemon bin 接线
  - 防中毒与账本合成严格圈定 PI 不影响其他引擎 catalog
  - PI catalog 兜底 auto 防缓存中毒并保留会话账本模型选择
  - 修复历史 window 加载吞消息导致对话结束后消息消失
  - 失效分级且失效重扫转后台 列表查询不再被全引擎扫描阻塞
  - 补齐 piSession 会话树加载失败与重试文案的 8 个 locale 缺失翻译
  - focus-refresh 合并路径索引行提前画并跳过重探测
  - 残留空目录不再拖垮 visibility 致侧栏首段必空
  - opencode 源指纹改 db mtime 且失败不连坐全引擎扫描
  - 补齐极简展示与顶部会话 Tab 分段控件 9 个 locale 缺失文案
  - 会话加载全程显示分阶段 loading 并下线暂无会话占位
  - 历史回放剥离 RPC 时代 附件包装并按图片/非图片分流
  - 极简展示与顶部会话 Tab 开关改为 segmented control 并设默认值
  - 修正极简折叠重构收尾块在提交中的错位归位
  - daemon 侧补 tombstone_filter no-op 桩修复 no-default-features 编译
  - 模型菜单打开时自动恢复 fallback-only 引擎 catalog
  - 磁盘扫描 list 出口过滤 tombstone 根除已删会话复活
  - Claude mid-turn 流静音看门狗修复中转断流 turn 永挂
  - 重新加载会话列表强制索引 rescan 修复新会话刷不出
  - 外部唤醒 turn orphan 承接与发送收养 steer 融合
  - 补齐 Windows 文件链接解析规则并修复 Explorer 打开
  - RPC 禁用闩加冷却自恢复并补齐会话树加载失败错误态
  - 补齐 Linux WebKitGTK 通知音止血的测试与主 spec 同步
  - 按会话隔离 print-json fallback 忙锁恢复多会话并行
  - 补齐 macOS GUI 启动时的 provider 环境变量
  - 扩展共享 Provider 重试状态码白名单
  - 校准 tool-output 口径并补 thinking 夹紧与技能目录
  - 收口 RPC 内联回归漏点（终态/锁/图片/daemon）
  - 按会话拆 RPC resident 恢复多会话并行
  - 从 RPC image block 还原历史用户附图
  - 防止带图提问 hydrate 后用户气泡接到助手尾巴
  - pi turn 结算改看门狗对账修复长任务误杀
  - 已完成回合被进程退出码误判失败引发的 shared 续跑死循环
  - 关闭最后页签清空会话选择并落 workspace 首页
  - PAT 注入优先级改为 stored 覆盖进程环境变量
  - 重写工作区别名弹窗样式并补齐按需加载
  - 修复回合结束终稿正文丢失的 terminal 提交竞态
  - 侧栏标题剥离附件包装不再泄漏 原始 tag
  - 修复中文路径附件切片 panic 导致会话永远打不开
  - 首刷后后台补 pi 盘扫让独立 main 全部可达
  - 自实现滚动数字修复 Windows pill 错位
  - 侧栏 index 分页排除 pi fork 派生行以免挤占 main 槽位
  - 防护 fork 静默 no-op 误藏主线并让派生隐藏可自愈
  - 硬化 compact 链路——500s 独立超时、活跃 run 守卫、成功原地反馈
  - 修复分叉父条目被过滤时会话树丢失连接曲线
  - 发送前对账 resident 模型修复选型漂移不生效
  - 修复侧栏 live 窗口内 fork 分支泄漏为顶层行
  - 容忍网络盘 canonicalize 失败以免 Files 面板加载失败
  Performance Improvements
  - 模型目录查询改缓存优先消除首开下拉 CLI 探测链
  - 收口本地 error/perf 日志中的 P0 卡顿与可观测性
  - 五个重面板节点补 memo 防击穿 AppLayout
  - 设置页 6 个重 section 改按需加载
  - 工作区搜索大结果集接入虚拟化
  - 修复长会话会话树画不出来（递归限制+爆栈）并全链路瘦身
  - 给终端工具输出 live ingest 加上字节预算
