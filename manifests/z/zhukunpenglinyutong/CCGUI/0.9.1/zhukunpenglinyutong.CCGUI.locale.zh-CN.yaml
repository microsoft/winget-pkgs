ReleaseNotes: |-
  New Features
  - 接入 composer Agent Preset 选择器
  - 游走改为幕布进出并隔离 Windows lite
  - 解禁 Windows 流体背景并修 WebView2 兼容
  - 精修游走双龙为中国龙形制
  - 增加流体动势与阴阳游走场
  - 补齐 dsh 与 pi 供应商额度拉取
  - 按日历日折叠全局置顶区
  - 在外观设置加入会话 Tab 开关
  - 记住最近三次推送目标并补操作面板设计稿
  - 给大会话打开幕布加上阶段进度
  - 落地会话历史 Spine 幕布并覆盖 DSH
  Fixes
  - 缺 header 不写回猜的 standard
  - 按会话隔离 Agent Preset 展示
  - 接通任务条与上下文占用并修正 TodoWrite 误分类
  - 搜索与雷达默认留在更多列表不勾选
  - 隐藏 Shared 协议续跑会话及其侧栏崽子
  - 收敛长对话尾巴重复用户气泡
  - 删除幽灵 Index 会话时仅 tombstone 客户端行
  - 补齐 session_index store 桩类型
  - 修复多 root 候选收集时 provider home 被饿死的问题
  - 收口侧栏标签、绑回与列表不蒸发
  - 脱敏 Grok 图片错误并拦截超限粘贴
  - 补回工作区雷达样式懒加载
  - 去掉 draw 未使用的 now 参数
  - 禁止 WebView2 F5 刷新主窗口
  - 按 hide identity 重写 list 预过滤
  - 互认 Codex rollout stem 与 uuid 隐藏
  - 硬化 npm 全局安装避免并发解压竞态
  - 复用现有问答卡结算 ask_user_question
  - 阻止续聊把 ccgui 模型送给 host
  - 立即隐藏占位引擎会话草稿
  - 让 Pi logo 跟随主题色
  - 补齐 mock 签名以通过 tsc
  - 阻止 Grok leftover Exploring 串到新 tab
  - 避免内存余量覆盖 DSH 历史游标
  - 拦截空 Claude/Codex Session 下崽
  - 阻止 native 续聊因同名模型误开新会话
  - 点选写 send 账本并回滚假切换
  - 恢复后台扫盘并把 last-good 改成 floor
  - 修复阻塞 mac-arm64 构建的 TypeScript 错误
  - 用创建时间稳定侧栏会话顺序
  - 统一幕布 Fork 为 Composer 链路并去掉旧恢复卡
  - 清理超时空会话与本地草稿
  - 让 Shared 历史 V0 先画并立即卸下投影幕布
  - 修复幕布用户气泡连堆与迟到历史错序
  - 首屏零扫盘并取消 hide 未就绪的 PI-only 过滤
  - 稳定路径钥匙并禁止超时清空账本
  - 按页递增展开会话列表并去掉加载更早的
  - 接通 Claude 历史磁盘尾窗翻页
  - 将左侧消息锚点贴近幕布左缘
  - 保持左侧消息锚点始终可见并缩短默认短线
  - 未加载会话切回时显示历史 loading
  - 侧栏切项目恢复上次会话
  Performance Improvements
  - 打开大会话只装最新一页历史
  - 拆开大会话首屏成本并保住上翻视口
