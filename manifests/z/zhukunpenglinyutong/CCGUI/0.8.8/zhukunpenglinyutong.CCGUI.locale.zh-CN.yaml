ReleaseNotes: |-
  New Features
  - 补全跨平台打开方式配置与当前文件打开
  - use Session Index as cold-path list source
  - gate ellipsis tooltips, dismiss notice dock, align home composer
  - 支持会话目录授权修复跨工作区越界硬拦
  Fixes
  - 修复并行会话跨供应商模型 residual 上送
  - Shared 会话隐藏完成邮件入口
  - filter bootstrap context from history and session titles
  - 修复 macOS 系统通知并清理构建类型错误
  - 修复结算幽灵卡并统一请求输入 UI
  - 移除未使用的 kanban CSS 辅助函数以恢复打包 typecheck
  - permanently lock interface scale to 100%
  - Windows 顶栏与窗口控件垂直对齐
  - Windows 顶栏为窗口控件预留右侧间距
  - defer release-notes auto-open and mark lastSeen on show
  - Shared 历史 V0 先画并软超时 projection
  - 有界 table 行计数并关闭 kill-switch 空走遍历
  Performance Improvements
  - 优化新用户冷启动路径并修复 CSS/i18n 回归
  - cut cold-start cost for release notes and session catalogs
