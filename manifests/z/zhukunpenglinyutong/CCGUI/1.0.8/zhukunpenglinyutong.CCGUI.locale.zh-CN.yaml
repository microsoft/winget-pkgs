ReleaseNotes: |-
  New Features
  - usage/done 事件带实测生成窗口 genMs（SDK 0.3.15）
  - 打开即检测 + 结果缓存（3 分钟）+ 并行检测
  - 引擎图标、连接状态检测、Claude 用户级启停
  - MCP 覆盖全部 CLI，输入框 /mcp 弹出当前引擎清单
  - 路径链接改为修饰键点击才唤起文件管理器
  - 聊天内计划-执行接力 MVP 与 conversation-mode 宿主契约
  - 发现页可看技能详情，修复 skills_hub_mutate 参数形状
  - 版本更新说明改为原生中心页签，页头就地检查更新
  - Skills 支持全部已接入 CLI，并补齐引擎交互
  - 新增「能力扩展」分组：Skills 与 MCP 管理页
  Fixes
  - Windows 下目录符号链接副本删不掉，顺带修 MCP 测试注入
  - 行内只显示真有副本的引擎，不在每行铺淡图标
  - 多引擎详情面板底部动作固定，统计不可用不谎报从未使用
  Performance Improvements
  - 修复大任务卡顿并加入本地性能诊断
