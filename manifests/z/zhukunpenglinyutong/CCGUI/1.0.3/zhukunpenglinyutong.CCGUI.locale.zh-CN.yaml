ReleaseNotes: |-
  New Features
  - SDK 0.3.6 新增 ctx.ui.openSettings，插件深链自身设置页
  - 新增会话右键菜单扩展点 ui:session-menu（SDK 0.3.5）
  - 工作区行可拖拽到分组/未分组/已归档容器完成移动
  - Windows 支持切换到仿 mac 自绘标题栏
  Fixes
  - host 进程接入 kill-on-close job，封堵退出后 pwsh 孙进程泄漏
  - 上下文窗口跨会话记忆 + 回合结束自动重读真实占用
  - 上下文条不再丢失引擎上报的窗口（分母回落 200k）
  - codex 旧 CLI 预检与错误横幅兜底；dsh/远程会话删除修复
  - 修复 Windows 对话孙进程(pwsh/conhost)孤儿泄漏，统一进程树清扫
  - auto 模式预批准 WebSearch/WebFetch，修复联网被拦截
  - 修掉模型目录探测死循环风暴，DSH 客户端本机 origin 恒直连
