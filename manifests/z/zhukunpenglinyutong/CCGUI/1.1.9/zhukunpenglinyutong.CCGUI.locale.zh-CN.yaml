ReleaseNotes: |-
  New Features
  - 文件树批量展开/收起并入根行悬停操作，去掉顶部 32px 空工具条
  - 用量统计与订阅限额改由插件提供，宿主新增只读数据层（SDK 0.3.23）
  - 完善文件树单链展开与工作区记忆
  - 支持工作区分组内置顶与排序
  - expose file-link context menu actions
  - 文件树复制/粘贴接入系统剪贴板
  - 插件会话事件暴露 provider/model 选择
  - 工具调用行的文件 chip 可点开目标文件
  Fixes
  - Windows 粘贴/复制的发布重命名支持超过 MAX_PATH 的路径
  - 系统剪贴板粘贴移出主线程，菜单可用状态与粘贴同一判定
  - CodeBuddy 默认模型恢复排第一，模型面板选中分组领头且企业分组仅限 CodeBuddy
  - 页签右键目标离开页签条时收起菜单，「关闭其他」改为置灰
  - 工作区置顶命令移出主线程，补齐读屏文字与本地化错误
  - 补齐 Markdown 图片的工作区边界、Windows 盘符与缓存
  - 响应校验只在能上报响应的运行上保留「未上报」徽标，并收紧 sidecar 与快照规则
  - 会话选择事件改用 SDK 0.3.24，覆盖所有改动路径并去掉重复激活
  - 文件链接菜单扩展点改用 SDK 0.3.23，补齐韩语与文档
  - 文件树刷新不留旧内容，合并行单击与显示一致
  - 分离 CodeBuddy 企业模型并置底展示
  - 粘贴来源按复制后的剪贴板代次判定，复制恢复 stdfscopy
  - 工具文件 chip 评审修复：打开器引用稳定、不可解析路径不给按钮
  - 评审修复：Git 写操作按仓库排队、超长列表切块与写序号时钟回拨
  - 查看任务不再把任务打回「待处理」，同名任务按 id 分开
  - HomeGuard 补上 CODEX_HOME，删掉测试里多余的手动摘除
  - 流式 delta 不再裁剪边界空白，修复 Markdown 排版错乱
  - HomeGuard 需中和引擎级 home 变量
  - 按审查建议修复 (#1398)
  - 响应校验卡片长模型名不再撑破行
  - 模型比较忽略供应商前缀但严格比较模型 id
  - 只观察供应商接口的响应
  - 从供应商响应回填实际上游模型
  - 响应校验不再把请求回显当成响应模型
  - 消除 SQLite 写锁阻塞、同步命令卡顿与超长 Markdown 主线程冻结
  - 任务清单状态不准 —— 按会话 id 配对结果并让 TaskCreate 结果带上任务 id
  - 按审查建议修复 (#1421)
  - 按审查建议修复 (#1422)
  - 授权入口不再 trim 路径，尾随空白文件名原样生效
  - 系统剪贴板来源判定与复制事务修复
  - preserve YAML literal block scalar newlines and remove duplicate .system scan
  - align Close Others label and guard against stale tab close
  - 恢复 Markdown 回复中的本地图片显示
