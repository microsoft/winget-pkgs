ReleaseNotes: |-
  New Features
  - Phase-3 语义索引、习惯持久化与项目记忆设置
  - Phase-2 hybrid 检索与可感注入转接
  - 发送前记忆挑选闸门 Phase-1
  Fixes
  - keep default-run as always-built main binary
  - stabilize nested codesign by deferring sign and gating debug-bin
  - remove ONNX runtime to restore Intel macOS packaging
  - preserve engine effort prefs on pending threads
  - 修正 useQueuedSend 测试 rerender 类型收窄
  - 冷启对齐 startup-gate 的 drain 调度，收口假死回归
  - 加固队列 auto-drain 与后台续跑
  - preserve full live assistant text after stream settle
  - 记住思考强度选择并区分 debug 桌面标识
  - quote unsafe flowchart labels and accept flowchart fences
  - ComposerGate 轻量层 + 模型位 loading，收口冷启假死根治
  - 冷启延迟挂载完整 Composer，消除 Cmd+R 猛点假死
  - 对齐 domain host 类型契约以恢复打包 tsc
  - 详情正文去掉 threadId/turnId/engine 噪声
  - make memory pick gate opt-in by default
  - settle full live assistant text on turn completion
  - 修正 single 模式映射与记忆详情加载守卫
  - 校正 always 自动确认与顶栏策略 UI
  - 匹配态用项目 logo 并至少展示 1 秒
  - 侧栏隐藏 Shared 下崽，不动幕布数据源
  - 按 parent-id 将 Shared 子代理改挂到 shared 会话
  Performance Improvements
  - narrow domain flatten for sections and render consumers
  - isolate session hot fields and memoize domain flatten
  - stabilize layout nodes and extract domain hosts
