ReleaseNotes: |-
  New Features
  - 对话栏宽度四档可调，宽窗口不再固定留白
  - 启用开关常驻，只读来源不再换成锁
  - MCP 条目支持按需启动，首次调用时才拉起真实 server
  - 分叉入口只放在助手回复下方；流式只禁用当前轮
  - 前端分叉入口与交互
  - 会话分叉后端（Claude / Codex / dsh + 引擎能力表）
  - 稳定的分叉锚点摘要与解析侧行号
  Fixes
  - 配置文件仅本人可读写，禁用引擎不读凭据，启动不再写其他 CLI 的目录
  - 性能诊断只采样本应用进程，DSH 不再结束他人进程，CLI 安装改在可见终端
  - 统计改由后端发送，远端不能发起电脑操控或改外网访问设置
  - HTML 预览只服务所在目录，工作区 MCP 配置确认后才检测
  - 收敛 v1.2.0 终端安全告警
  - 对话栏宽度默认档保持原宽度，变量不再覆盖全局 max-w-3xl
  - Codex 分支与原生分叉同形、并发分叉不再撞号
  - 按需启动合并前跟进：OMP env 不写进项目、不绕过 Codex 项目信任、修正代理协议
  - OMP mcp.json 可直接启停，修复新引擎开关死锁
  - Windows 上 Claude 启停找不到项目记录
  - 没有打开工作区时说明 Claude 条目为何只读
  - rebase 到 v1.2.0 的冲突收尾
  - 评审收尾（降级提示、死字段、可见性回归）
  - 同文本消歧改用 tailOccurrence，修中间分叉吃下后面轮次
  - 分叉已成功时不再误报「创建分支失败」
  - 切点与解析器同源，回滚与坏行按契约处理
  Performance Improvements
  - 锚点一趟预计算，行组件不再接收整份消息列表
