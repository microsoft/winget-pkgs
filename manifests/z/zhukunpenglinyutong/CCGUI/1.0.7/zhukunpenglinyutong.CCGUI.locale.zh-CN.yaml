ReleaseNotes: |-
  New Features
  - 文件树刷新移入工作区根行，悬停出现
  - 市场安装落地品牌图，插件页签回退离线可用
  - 官方插件开发者列只显示品牌徽标，下拉改称社区插件
  - 市场标记官方插件，下拉改综合/官方/第三方/下载量
  - 插件中心「创建插件」+ 内置插件开发 skill
  - 本地插件也显示图标/效果图，新增路径受限的素材读取
  - 市场支持插件图标，效果图规范落地
  - 详情页「最近更新时间」改取索引 updatedAt
  - 市场与详情页开发者头像改用 GitHub 真实头像
  - 市场改为表格化列表，详情页改左正文+右信息栏
  - 市场详情由弹窗改为整页，新增截图轮播与 README
  - 插件中心页签、内测功能开关与 Git 树状态聚合
  - CLI 分组标题可折叠，未安装/未启用默认收起
  - 运行前可选择执行环境（引擎/模型/工作区）
  - 新增任务工作台（AI 编排 + 本地调度 + 收件箱）
  - 检查更新独立为设置模块，置于社区与反馈之上
  Fixes
  - 中心面切换统一清场；设置页插件图标取品牌素材
  - 详情页权限行标注归属，改称「权限（CCGUI 权限）」
  - 详情页「链接」三项各带目标图标
  - 截图大图预览补关闭叉号，修好点空白关闭
  - 官方徽标可点跳主页，徽标不再被右栏拉伸成整行
  - 浮动滚动控件跟随滚轮方向，点击平滑滚动
  - 桥接只读的 plugin_read_artwork
  - output_config.effort 只注入 anthropic-messages 请求
  - 已安装页也拉市场索引，图标/效果图不再只靠市场页
  - 详情页右栏可滚到链接行，README 长代码行留在正文列内
  - 有会话运行时拦住 ⌘Q/系统退出，不再整端静默退出
  - 思考区实时渲染保留完整已揭示文本，去掉 2000 字尾窗
  - 「已编辑」pill 行数恢复逐位滚动动画
  - 流式正文与思考面板按到达节奏推进，不再整批闪现
  - 插件更新后原地热重载，无需关开插件或重启应用
  - 更新提示浮在设置页之上，并在设置行内提供「立即更新」
