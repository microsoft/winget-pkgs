ReleaseNotes: |-
  New Features
  - 浏览器标签页入口、图片预览增强、删除确认气泡、工作区右键新建、插件市场精简
  - 会话归档（右键与悬浮入口 + 设置内归档管理）
  - Markdown 支持 GitHub 风格 alert 提示框
  Fixes
  - 修复上下文表盘分子卡在整轮累加值
  - 修复进程注册表泄漏和上下文窗口问题
  - 移动端网页模式移除添加工作区入口
  - 修复长用户消息气泡向左溢出
  - registerComposerSlot 权限漂移，改为校验 ui:composer-status
  - clip collapse height instead of fading a ghost
  - 修复失败会话索引与删除
