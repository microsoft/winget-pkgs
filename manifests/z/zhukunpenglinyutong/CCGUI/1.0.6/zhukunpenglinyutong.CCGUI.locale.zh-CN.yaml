ReleaseNotes: |-
  New Features
  - 打通 Kimi 提问通道(ACP elicitation 表单)
  - 打通 Codex/Grok 提问通道，接管 pi/omp 多选轮次
  - 设置页从覆盖层 Modal 改为全屏 SettingsShell，快捷键移入系统分组，CLI 分组默认折叠
  - 侧栏重分组为 系统/插件/CLI 管理/工作区与数据/其他，CLI 未安装与未启用提为同级分组
  - 插件 agent 轮次 + 侧栏导航/中心页签扩展点，新增 @ccgui/plugin-ui 包
  - AX 无障碍树交互 + 虚拟光标覆盖层
  - 新增 Computer Use 能力——OMP 截图/输入驱动以 MCP 服务注入引擎
  - 变更面板支持撤销更改（单文件/全部撤销）
  - support image attachments via session/prompt image parts
  - 拉取/推送按钮复用刷新的成功对号反馈
  - 输出中的绝对路径可点击在文件管理器中显示，选中文本支持右键复制
  - 会话内搜索（Cmd+F）与应用级斜杠命令 /new /clear /compact
  - 会话消息全文搜索（FTS5）与 opencode/pi/omp/dsh 问答链路
  - publish RPM package for Linux
  Fixes
  - prevent platform-dependent release gate failures
  - prevent Linux linking and Windows test startup failures
  - plan 模式明确报错，失效授权目录不再阻断新会话
  - 发布流程补齐内置智能体目录哈希校验门禁
  - 推理强度原样下发，不再映射到其它档位
  - 全 CLI 引擎通用打通推理强度与请求级 effort 字段注入
  - react-doctor 体检问题全量修复（评分 76→100）
  - 引擎 stdin 换行、CliMenu 悬停意图、错误文案与变更面板行布局
  - 评审跟进——恢复 kill_process_group 导入并补齐 effort 链路
  - 幕布显示使用 run 实际生效的模型和推理档位
  - 评审跟进——变更面板标注跟随仓库，渠道选择器三处细节修复
  - 补充 deb/rpm 依赖声明，README 注明 rpm zstd 压缩的版本要求
  - diff 预览体积上限与可访问性修复，补齐回归单测
  - git 远程认证失败时返回可操作错误，变更面板刷新按钮增加点击反馈
  - 分支下拉菜单改用实时分支名判断当前分支，修复外部 checkout 后点击 no-op
  - 为支持推理强度的引擎设置默认值
  - follow selected nested repository in changes panel
  - build AppImage and RPM in separate steps
  - 修复未跟踪文件预览并优化变更列表布局
  - 合并 v1.0.6 后补齐并发槽位的兜底清理
  - 引擎选择器切换待发会话时广播 session://activated
  - 会话激活事件支持粘性回放，修插件启动期拿不到当前会话
  - 修复选中文字拖动导致页面锁死的问题
  - 引擎面板改为点击切换；无渠道引擎不再显示筛选框
  - 切换渠道刷新对应渠道的模型；面板头部加渠道筛选框
  - 供应商改限定高度下拉框；用量本年按月、总和按 CLI 分柱
  - 修好 Windows CI 的三条换行/路径转义相关测试
  - 远程窄屏右侧栏改浮层展开，用量新增本年/总和分页
