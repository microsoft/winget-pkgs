ReleaseNotes: |-
  New Features
  - support bypass permission on the serve driver
  - 新分支默认 base 改为当前检出分支
  - 复刻 Codex v2 桌面宠物
  - 创建对话框默认「新分支」并移除侧栏脏文件数徽标
  - worktree 子工作区管理、电脑操控单轮驱动与崩溃兜底
  - 升级后首启自动打开版本更新页签并标记「新版本」
  - worktree 子工作区数据层（kind/parent_id + 旧数据导入）
  - 支持任务模块下钻查看任务详情与执行情况
  - OMP 订阅授权新增 Google Antigravity 登录
  - filter and edit OMP custom providers
  - support bypass via --auto flag
  Fixes
  - 修复 codex app-server 未传递 reasoning_effort 导致回退默认 medium 问题
  - 修复只读 invoke 与缺失 withResolvers 时插件引导中断
  - keep plugin PATH priority, cover engine spawn shebang PATH
  - 按 Google API 协议过滤推理字段
  - AskUserQuestion 多题逐题确认与自动前进
  - inject CLI search PATH for exec shebang shims
  - 修复审查发现的交互、状态与安全问题
  - 修复输入框粘贴后一次撤销会连带删掉此前输入
  - 稀疏检出不再误报删除，空 worktree 创建改为明确报错
  - 兼容可选后台任务状态
  - 修正鼠标命中区域与任务状态展示
  - 完善桌面宠物交互与导入提示
  - Worktree 分组展开/收起补齐高度动画
  - 打包版插件样式不再被 CSP nonce 拦掉
  - 浏览器噪音不再弹全屏崩溃页
  - 分支列表列出远程跟踪分支，检出时物化为本地跟踪分支
  - 修复输入框粘贴后一次撤销会连带删掉此前输入
  - 剥离元信息中渠道与插件前缀，统一展示纯净模型名称
  - 修复对话结束后子任务跨页丢失及子代理状态收敛与呼吸灯异常
  - 修复聊天侧栏与 Git 变更列表的滚动和分页状态
  - 统一嵌入 Windows manifest，修复库测试加载失败
  - 模型刷新改为全局生效（按上下文分桶，不再按工作区各自缓存）
  - 会话解析缓存把工具输出计入内存预算
  - 重试退避时停掉侧栏/标签/思考指示器动画，补齐 retrying 标志清理
