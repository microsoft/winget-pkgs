ReleaseNotes: |-
  New Features
  - Markdown 预览改用 Streamdown 渲染
  - 页签条会话页签向下拖出即可分屏
  - 对话区分屏（侧栏拖拽分屏，多栏同时工作）
  - 计划预览与人工审批（omp/codex/dsh 接通，grok/qoder fail-closed）
  - 新增 Requesty 供应商预设
  - 外观字体改上传文件并抽出缩放存储，桌面宠物拆为独立页
  - 排队消息支持上下调序，箭头调整发送顺序
  - CLI 选择器顺序跟随设置页拖拽排序
  - 设置搜索覆盖列表页与页签，补齐全部内置页
  - 设置搜索覆盖 Web 访问与全部 CLI 引擎页
  - 设置搜索扩展到网络代理/快捷键/更新/内测/诊断
  - 设置搜索命中页面内部的行，跳转后定位高亮
  - ⌘L 会话搜索面板新增检索统计行（耗时 + 语料条数）
  Fixes
  - wrap cfg(windows) assignments in blocks so the crate builds
  - 修复选择模型下拉建议时整个界面崩溃
  - keep opencode server job guard alive after ensure_server
  - 修复非安全 HTTP（局域网桥）环境下 crypto.randomUUID 不存在导致崩溃
  - 修复 Codex 切换渠道后模型面板跳转
  - 断网等环境性网络失败不再弹全屏崩溃页
  - 兜底 unlisten 注册竞态，修进入页面即崩溃
