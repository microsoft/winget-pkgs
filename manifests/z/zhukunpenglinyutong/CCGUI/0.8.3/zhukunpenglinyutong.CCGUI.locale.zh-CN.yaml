ReleaseNotes: |-
  New Features
  - 收口恢复出口简化与侧栏控制面泄漏修复
  - 收口协作 Context Fan-in 与契约测试
  - 收口协作上下文、Inspector 流式隔离与模板智能体
  - 完成 Shared Session 多 CLI 协作编排能力阶段交付
  - 实现会话内多 Agent 基础编排并隔离非 Squad 会话副作用
  - add confirmable file revert actions to edited-files panel
  - replace legacy status dock with run-status strip
  Fixes
  - use native file-manager reveal instead of plugin-opener
  - 隐藏协作 worker 侧栏下崽并隔离右栏节点幕布
  - reattach xterm on same-commit host swap
  - 加固协作 Codex worker 侧栏下崽过滤且避免误伤
  - stop refreshTerminal from stealing keyboard focus
  - 修复桌面冷启动点击假死并收口启动门控
  - 启动遮罩挡住冷启动点击假死窗
  - restore runtime notice error icon in settings menu and pin
  - 修复冷启动列表与 uiScale 0.8 交叉假死
