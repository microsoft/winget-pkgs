ReleaseNotes: |-
  New Features
  - 闭环冷启 first-paint 编排并恢复加载遮罩自动关闭
  - 自定义模型按供应商绑定并对称写入 Claude/Codex
  - 支持本地 HTML 在内置浏览器打开并收口 OpenSpec
  - 会话控制 HUD 与多供应商实时用量
  - refine file-to-input chips, run-status overlay, and live scroll follow
  - 接通 Shared Run Status Strip 合成数据源
  - align session edit pill with git stats and live updates
  - 支持协作环节上游吃摘要/全文并贯通运行时
  - 协作节点幕布增加可折叠注入上下文 Header
  - 支持批准补充说明并统一操作条布局
  Fixes
  - 切换工作区后协作式放弃过期会话列表扫描
  - 抑制切换场景下的误报错误 toast
  - 注入上下文展开态保底高度
  - 钉死 plugin-dialog 版本对齐 Rust crate
  - 修复 mac 打包阻塞的 TypeScript 类型错误
  - 补齐 Windows 侧栏 Quick Switcher 与隐藏对话入口
  - 补齐 S10 退役后 Strip 与右侧详情的宽识别与加载链路
  - 修复创建与打开历史时 Claude 渠道模型 catalog 串台
  - 补齐协作运行时左侧会话状态指示
