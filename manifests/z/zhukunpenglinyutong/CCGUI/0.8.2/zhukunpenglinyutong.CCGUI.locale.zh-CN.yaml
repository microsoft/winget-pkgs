ReleaseNotes: |-
  New Features
  - add copy button to single-line fenced code blocks
  - Windows 主窗关闭按钮增加自定义二次确认
  - add header dismiss control to UpdateToast
  - allow assigning workspace project groups from context menu
  - add multi-lane commit graph and denser history workbench
  - present Git Graph as a full modal and simplify subagent identity
  - pin settings actions beside gear and polish context menus
  - add bulk unstage and multi-path revert operations
  - 支持跨平台应用图标切换
  Fixes
  - inset session selection pills for clearer hierarchy
  - make release-notes update checks manual and keep toasts visible
  - stop native zoom freezes on all platforms with CSS scale and startup guard
  - 用 transform 布局补偿修复 Windows 缩放黑边
  - 阻断 0.7.16 Messages canvas 空集合 thrash 致 React #185
  - 恢复 $ skill 选中后的 ContextBar chips 可见反馈
  - 对接 DeepSeek 余额查询并适配会话概览展示
  - 修复 Windows WebView2 uiScale 假死并恢复右侧 chrome 默认可见
  - fix cold-start thread hydration and shrink first-paint loads
  - publish memo-safe hydration Set so sidebar drops loading
  - parse real CHANGELOG headings and bilingual section order
  - sync home CLI picker with global selection and restore on startup
  - 抬高 PR 下拉 Popover 层级避免被遮罩挡住
  - seed create-session ExecutionTarget for all Atomic engines
  - 阻断 Shared 初始化回落 Native 思考档位
  - 修复 Shared Atomic 模型与思考强度联动
  - 阻断 rewind reset 更新环
  - 修复 Shared 上下文续接 integrity
  - 修复 Shared 用户附图双气泡与历史丢图
  - stop foreign sessions leaking into empty workspaces
  - 退役 Claude SubAgent 旧 Agent session 卡
  - compact sparse parents to stop phantom graph lanes
  - 将子代理卡收纳进已处理折叠并消除双重渲染
  - 修复子代理状态卡死与抽屉打开后不刷新
  - 收敛 Native 与 Shared 的 assistant 重复渲染
  - 修复多工具回合 settle 后结论偶发跑到工具前
  - clear stale operation errors on manual status refresh
  - flip context menus when space is tight instead of sliding
  - 切断 0.7.16 Composer extract 自订阅致 React #185
  - 有结构化 backgroundTaskId 时抑制 result 后 5s 误杀
  - merge reasoning runs split only by canvas-hidden shell tools
  - 以 ExecutionTarget 快照作为 Shared 模型选择展示权威
  - 修复 activeCanvasStore 测试类型导致 tsc 构建失败
  - 加固 canvas store 与 selection storm 防 React #185
  - 闭环 Shared 恢复出口并修复 abandon 竞态
  - 修复 Shared 侧栏异步刷新 stale hide set 泄漏原生会话
  - 修复 dockIcon 测试导致 tsc 构建失败
  - 标识 Shared 队列 pending-ack 确认状态
  - 对齐 collab 子代理 live 与 history 呈现
