ReleaseNotes: |-
  New Features
  - add CSS tree lines for workspace children
  - 会话重载收敛 Session Index 强制同步并加重载忙碌态
  - 后台任务卡透出终态通知摘要并锁通知不成行对齐口径
  - 主幕布新增后台任务等待态并收口终态口径
  - 文件底部状态栏新增 Git Blame 切换按钮
  - 增加侧栏网络代理抽屉
  - 接入 PI 登录态额度与窗口进度
  - worker 作用域错误回传主线程——stackHash/sourceModule 指纹落盘（F6/Phase C）
  - perf.thread-switch 增补 loadMs/assembleMs 分段计时——区分加载桥与前端组装成本
  - 模型下拉与新会话菜单可用性同源，状态翻转统一失效
  - 登录态二段式——detect 不等 spawn 探测，异步补推 requires-login
  - 检测失败态 + 25s 守卫 + 跨模块检测单飞，根除永久「检测中」
  - 逐引擎检测事件推送，菜单逐项 reveal 不再全量等待
  - 检测结果 TTL 缓存 + per-engine 强刷 + last-good 落盘 SWR
  - worst-K 掉帧持久环、切会话计时证据与 hotspot 周期汇总
  - 崩溃取证结构化——errorName/文本指纹/组件帧安全命名落盘
  - 新会话首条短消息思考档自动降 low，省 ~11s 思考静默且不覆盖用户设档
  - pi 静默期接入等待首段文本专属文案并开启 12s 安抚提示
  - 后台任务运行计数接入会话行第四态呼吸灯与终态未读收口
  - native 会话幕布接入 turn-target 显示条与运行回执
  - 可点控件悬停提示补全快捷键展示
  Fixes
  - restore anchored new-session popover instead of full-height drawer
  - 修正 assemble_canonical_facts 引用已归档 openspec 示例路径
  - 修复多原生 turn 交错下响应中卡死、重复叙述与完成音连响
  - 转发器双拷贝同步并修复实时幕布尾部丢失
  - 修复新建会话抽屉卡死并移除生产诊断副作用
  - 完善 provider 失败归因与终态处理
  - 网络代理图标改为点击开关并更换梯子图标
  - 修复网络代理抽屉提交遗留的构建类型错误
  - 隐藏 pi 用户气泡框分叉按钮
  - 更改面板差异弹窗补单文件兜底——修复 Win「差异不可用」死路
  - 宿主离线熔断快速失败——传输层连续失败 open 60s、结构化 Down 透传前端可读回退
  - 修复快切会话模型目标串台
  - PI 凭证写入后 FE 目录即时收敛——补齐三层会话缓存的重载接线
  - 目录失效改为清 models 保留状态条目——防 detect TTL 窗口漏引擎
  - 凭证写入/删除后失效引擎目录缓存——模型选择器即时收敛
  - hast-util-from-html-isomorphic 强制离线入口 + 预打包 alias——worker 第二处 DOM 引用根因修复
  - native pending 改名同迁 runtime 回执——pi 首轮实时 Ⓡ 尾巴对齐历史
  - auth 订阅判定对齐 openai-codex 别名 + 摘除进程 env 态/覆盖设置模式
  - 终端命令请求补关首页——PI/Qoder 登录不再跳回首页丢终端
  - decode-named-character-reference 强制离线构建——worker 内 document 引用根因修复（1wt84ny 结案）
  - worker 错误桥前置注册——chunk 求值期错误也能带回完整 stack（F6 补强）
  - 首页创建框思考档通用化——catalog 驱动投影取代引擎白名单（DSH 首页缺失修复）
  - 解耦引擎响应式目录表 + 后台预热——补全非激活态目录消费漏点
  - 引擎切换后显式加载目标引擎目录——修复思考档/模型必现缺失
  - 翻转失效收敛为 installed 翻转独占——修复 authState 到达引发的 INVALIDATED 风暴
  - 撤销解耦引擎轻量分支的静态快照回填——P0 模型错乱根因
  - 取证加固——匿名组件帧兜底、worst-K 归因扁平化与 epoch、错误源模块证据
  - 解耦引擎目录加载升级 on-demand 预算 + 轻量分支回填 fallback 快照
  - worker error 事件先探活再处决并落 errorName 指纹
  - 切会话写盘旁路——sidebarSnapshot 签名跳过、radar 去 immediate、肥 key 治理
  - pi 思考/工具行渲染即清等待首段文案，修复流已到标签仍粘连
  - 封死 pi 会话幕布三类静默丢失链，load 失败可重试可观测
  - 后台任务卡片改直读 store 权威快照，时间线回写丢失时自愈翻终态
  - pi catalog default 改读 settings 真默认，修复无账本会话切入误绑 anthropic 首 entries
  - rename 链路随迁后台任务计数与任务表，修复改名后终态回写挂旧 id
  - backgroundTask 终态回写改传 shouldMarkProcessing=false，修复会话被复燃成永久响应中
  - backgroundTask 终态更新绕过 turn 终态守卫，修复 post-settle 卡片永停运行中
  - registry watcher 上收 app 级枚举 running 会话，切走会话后终态仍全路径回写时间线卡片
  - draft carry 增加 catalog 成员资格闸，封死 Home 点选引擎盲区污染（D6 闸 2）
  - 切线程清理用户模型锁，杜绝跨引擎残留压制选择收敛（D4-Live）
  - markProcessing/markContextCompacting 显式枚举补保留后台任务计数，修复 turn settle 后紫灯永久熄灭
  - badge 侧车随 pending 改名迁移，修复切换历史丢显示条
  - 会话切换窗口账本同步标志守卫，杜绝 codex repair 跨线程污染（D1）
  - 压缩留痕引擎判定恢复 flags 语义，codex 原生 compacted 不再误补 fallback
  - first-paint 冷启动同样不再伪造引擎超时与误标 degraded
  - 标题 prompt 提取收紧为信封前缀谓词，正文引用 command 标签片段不再被误提取
  - 会话索引标题先还原 slash-command prompt 再截断，修复信封前缀超长导致的整条误剔
  - focus-refresh merge 不再伪造引擎超时与全表误标 degraded
  - 列表扫描加内层 32s 截止让超时后线程真正停止读盘
  - 根除 claude-fork 会话删除复活与持久快照回灌
  - draft carry 增加引擎门禁杜绝跨引擎模型串台
  - full-catalog 自动重扫连续超时改指数退避
  - PI list-models 降级思考目录打开模型菜单时自动重探自愈
  - 压缩留痕改产 context-event 杜绝劫持 turn 终态锚点
  - pi compaction_end 映射透传 reason/token 元数据不伪造 manual
  - PI registry 元数据对齐 RPC 长驻真实传输（pi-rpc/persistent）
  - capability_state 五键委托 spec-generated 消灭双源口径漂移
  - auth catalog 对齐 pi 0.84.3 并补录 moonshotai 双区 provider
  Performance Improvements
  - 给 live 工具输出加渲染预算并允许用户折叠自救
  - post-first-paint 索引软重同步让路点击风暴——defer 满改冷却等 quiet 窗口
  - 会话条目缓存驱逐加近期切换保护集——来回点击不再整轮驱逐重付 loadMs
  - compact 文本归一化纯函数 memo——组装段同文本重复正则消除
  - 组装段窗口化——尾部 400 先行上屏、余量 150/片后台渐进组装并保持终态等价
  - pi 会话 resolve 内存索引 + load raw-string 通道——消除加载固定成本与对象图过桥冻结
  - 环境解析进程级缓存——npm prefix/login-shell 每进程至多 1 次、Claude version memo
  - 检测轻量化——detect 与模型目录解耦、启用范围过滤、per-engine 隔离
  - 会话 hydrate 元数据合批——ensureThread 移出 curtain commit、五次 dispatch 收敛为单次状态转移
  - 新增 engine_prewarm 会话激活预热 resident，冷启 2.5s 移出发送关键路径
