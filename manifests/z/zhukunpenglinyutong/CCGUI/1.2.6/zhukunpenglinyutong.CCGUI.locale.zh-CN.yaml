ReleaseNotes: |-
  New Features
  - 支持设置页插件导航排序与折叠
  - 侧边栏工作区右键菜单新增「复制路径」
  - 运行状态行可点开「当前进展」，长回复时能看出系统在做什么、有没有卡住
  Fixes
  - 插件分组已保存折叠时深链打开插件页仍展开分组
  - recognize -xhigh and -max effort suffixes in model slugs
  - 修正「当前进展」浮层在 pi/omp 与 Claude 失败工具下的阶段误判
  - 修正 CodeBuddy 进程复用的排队发送与空闲上限
  - 压缩状态按会话隔离，一个会话压缩时不再挡住其他会话
  - 修复 CodeBuddy 配置读取和空闲退出回归
  - 解决 CodeBuddy 会话复用与新版分支的合并冲突
  - 解决 CodeBuddy 会话复用与上游的合并冲突
  - 解决 CodeBuddy 进程复用的审查问题和合并冲突
  - 复用 CodeBuddy 会话进程
