ReleaseNotes: |-
  New Features
  - auto-admit custom-route images and close session UX gaps
  - 分平台落地响应中 spinner 并入库选款稿
  - add OS file manager reveal action on diff rows
  - 重做设置页连接优先面板
  - 接入工作台页面背景
  - 接入首次设置向导
  - 补充首次设置向导文案
  - 补充 IntelliJ IDEA 打开目标与图标
  - 适配 Goal 续跳与折叠卡投影
  - 收口 Claude 磁盘尾窗、Index PI 投影与 keyset 翻页
  - 接通 PI 安装器，侧栏 Index 首页改为 20 条 keyset
  - 补齐 PI 历史加载、实时 adapter 与 picker 入口
  - 接入 PI 为内置引擎并完成 Rust 探测注册
  - 后台间隔导入外部 CLI 会话到 Index
  - 将 Browser Dock 内嵌到中心分屏
  - 列表首页改为时间分组纵轨卡片
  - live 尾部过程超阈值按卡片窗口滚动折叠
  - 幕布 HTML 文件链接增加内置浏览器入口
  Fixes
  - keep sidebar chrome, menus, and terminal above frost
  - 修复 Windows dsh web 拉起并区分 Mac 路径
  - allow nullable workspaceId on background task fold
  - 折叠后台任务通知并避免 wakeup 重复渲染
  - compact thinking markdown, hide commit helpers, skip Windows fluid
  - 拆会话切换 identity 并跳过未开聊 resume
  - classify nameless DSH bash calls as commandExecution
  - 按段连续折叠过程相位
  - stop using provider call ids as tool titles
  - restore first-paint history and tool card rendering
  - harden image attachments and clarify text-only model errors
  - hide CLI provider from the static readiness chip
  - 隐藏注入上下文并完善会话历史展示
  - 统一 CLI 会话真实删除链路并修 pi 删除残留
  - 恢复 canonical 模块声明与 shadow_v0 迁移桥
  - 补齐 thread/started pending binding 与 reasoning hint 的 pi 臂
  - 收口 PI 补臂后的 tsc 打包错误
  - 按 0.9 热路径补 PI 控制面并去掉旧 Dock 岛
  - 收口 PI 卡片、Windows 摘录与长对话首屏回放
  - 给挂起的后台 Agent 预结果等待加空闲上限
  - 探测列表纳入 PI，摘录卡改回纵向块级布局
  - detect_all 补上 PI，摘录折叠补齐 CSS
  - 按 0.8.9 簇补 picker/Shared 菜单、认证页样式与摘录折叠
  - 按 0.8.9 PR 簇补闭环并更新盘点文档
  - 接通 PI 发送/认证页，HTML 改走内嵌 Dock
  - 修复挂载期 ReferenceError 并补齐 PI/Dock 类型缺口
  - 固定 Git Diff 弹窗滚动层并拆出 compare 样式
  - 批量终端卡全部完成后自动折叠
  - 会话目录全量扫描改为显式 scanMode
  - 长会话 hydrate 改为先画最新窗口再向前扩展
  - 协作入口自行加载延迟的 multi-agent 样式
  - 为 commandExecution 与 fileChange 增加输出字节预算
  - 补超时余量、过期路由、墙上时钟与闸门 drain
  - Box::pin 打断深链 future 缩小 Windows 栈帧
  - Windows 打开方式探测改走 std_command 消除黑窗
  Performance Improvements
  - raise default history window and first-paint tail
