ReleaseNotes: |-
  New Features
  - 文件树区分 Git 忽略的条目，可选择性隐藏
  - 新增 worktree 徽标扩展点与侧栏导航徽标
  - 聊天文件链接右键可在浏览器中打开 HTML
  - 变更面板可初始化仓库，文件右键可在浏览器中打开 HTML
  Fixes
  - 盘暂时断开时保留会话，签名未变的扫描也清理幽灵会话
  - 去掉任意深度的回复兜底，测试改用全局 HOME_ENV_LOCK
  - 扫描时清理源文件消失的死行会话，修复幽灵会话复活
  - 历史重载不再丢失消息，修复只能加载最后一段
  - 仓库打不开时变更面板与 Worktree 创建都给出真实原因
  - 修正 macOS 坐标单位、最小尺寸倍数与退出落盘
  - 打开仓库失败不再误报「不是 Git 仓库」
  - 启动占位固定在视口，修复启动 loading 贴顶后再跳居中
  - 记住窗口大小、位置与最大化/全屏状态
  - 启动即进入 bypass 模式，绕开新版 CLI 的 set_mode 报错
  - 删除对话框的分支勾选项连同说明整块可点
  - 切换 CLI 时保留输入框草稿
