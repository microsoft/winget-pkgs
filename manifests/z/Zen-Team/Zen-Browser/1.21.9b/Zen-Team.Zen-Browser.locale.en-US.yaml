ReleaseNotes: |-
  Zen Stable Release

  Security
  - https://www.mozilla.org/en-US/security/advisories/mfsa2026-68/

  New Features
  - Updated Firefox to 153.0
  - High Dynamic Range (HDR) video playback is now available on Windows - this feature needs HDR mode enabled for the display in Windows Settings - Display.
  - Improved UI for container selection and management
  - It is now possible to merge multiple PDFs by dragging a PDF into the PDF sidebar.
  - Added support for Apple's system-wide full-screen keyboard command (Globe-F).
  - Zen now verifies and displays Qualified Website Authentication Certificates (QWACs) in accordance with eIDAS regulations.
  - Added improved support for videos with overlays so users can more easily access video actions from context menus.

  Fixes
  - Fixed 'Add tab to essentials' context menu item being always disabled (#14616)
  - Fixed external links not being routed properly by Space Routing (#14600)
  - Fixed boosts size override not persisting (#14461)
  - Other bug fixes and improvements.
