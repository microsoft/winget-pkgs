ReleaseNotes: |-
  Zen Stable Release

  Security
  - https://www.mozilla.org/en-US/security/advisories/mfsa2026-111/

  New Features
  - Updated to Firefox 158.0.1
  - Boosts now have a 'focus' feature, allowing you to concentrate on a specific part of the website.
  - Windows builds now run with CSIR PGO, improving performance and startup times. All other platforms also have performance improvements.

  Fixes
  - Mozilla blocked compromised eMudhra intermediate certificates via OneCRL on October 17th. The blocks were distributed to clients via Remote Settings the same day. This update contains the updated OneCRL block list, ensuring clients will block the compromised certificates even if RemoteSettings is disabled by policy or otherwise unavailable in the user's network environment. (Learn More)
  - Fixed the sidebar hiding when the mouse is still over it. (#15995)
  - Fixed devtools not appearing on glance tabs. (#15261)
  - Boosts zap bar will now push the web contents up when activated. (#13972)
  - Fixed sidebar scroll being reset when entering fullscreen. (#14389)
  - Fixed multiple windows launching on startup on Linux and Windows. (#12140)
  - Fixed a crash on Windows when printing or saving a page as PDF while a screen reader or other assistive technology was running.
  - Fixed an issue where Zen was opening windows on the wrong monitor in multi-monitor setups on Linux.
  - Fixed multiple media bars appearing when 2 or more tabs are using WebRTC.
  - Fixed an issue where files dragged into Firefox from other applications were not dropped onto the page on macOS.
  - External links will now be routed through the Space Routing feature on startup
  - More bug fixes and improvements.
