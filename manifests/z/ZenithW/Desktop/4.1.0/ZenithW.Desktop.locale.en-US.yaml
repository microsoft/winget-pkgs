ShortDescription: Free, open-source video and audio downloader for Windows
Description: |-
  ZenithW is a free, open-source Windows application for downloading video and audio from supported sources using yt-dlp and FFmpeg.
  Choose formats and quality, queue downloads, and configure subtitles, metadata, playlists, SponsorBlock, optional cookie sessions and proxy settings.
  Processing runs on your device. Preferences survive restarts; download history clears when a new application session starts.
  Use only content you have the right to download and use. Available sources and formats depend on the source's access conditions.
