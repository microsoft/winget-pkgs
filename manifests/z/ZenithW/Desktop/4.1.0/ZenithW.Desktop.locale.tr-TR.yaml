PackageName: ZenithW Desktop
License: AGPL-3.0-only
ShortDescription: Windows için ücretsiz ve açık kaynaklı video ve ses indirme uygulaması
Description: |-
  ZenithW, desteklenen kaynaklardan video ve ses indirmek için yt-dlp ve FFmpeg kullanan ücretsiz, açık kaynaklı bir Windows uygulamasıdır.
  Format ve kalite seçimi, indirme kuyruğu, altyazı, metadata, oynatma listesi, SponsorBlock, isteğe bağlı çerez oturumu ve proxy ayarları sunar.
  İşlemler cihazında çalışır. Tercihler yeniden açılışta korunur; indirme geçmişi yeni uygulama oturumunda temizlenir.
  Yalnızca indirme ve kullanma hakkına sahip olduğun içerikler için kullan. Kaynak ve formatların kullanılabilirliği kaynağın erişim koşullarına bağlıdır.
ReleaseNotes: İndirme kurtarma akışı iyileştirildi. Yeni ayar bölümleri ve kompakt kart görünümü eklendi. Geçmiş yeni oturumda temizlenir; tercihler korunur.
