Publisher: ZenithW contributors
PackageName: ZenithW Desktop
License: AGPL-3.0-only
ShortDescription: Windows için ücretsiz ve açık kaynaklı video ve ses indirme uygulaması
Description: |-
  ZenithW, yt-dlp ve FFmpeg kullanan ücretsiz, açık kaynaklı bir Windows video ve ses indirme uygulamasıdır.
  Rust ve Microsoft Edge WebView2 ile çalışan masaüstü uygulamasında format ve kalite seçimi, kuyruk, oynatma listesi, kırpma, altyazı, kapak, SponsorBlock, profiller ve yerel geçmiş bulunur.
  İndirme ve medya işleme cihazında gerçekleşir. Desteklenen kaynaklar ve formatlar, sitelerin erişim koşullarına bağlıdır.
ReleaseNotes: Windows uygulaması Rust ve WebView2 ile yeniden geliştirildi. Arayüz yenilendi, açık, koyu ve neon mor temalar eklendi; indirme kuyruğu, yerel geçmiş ve medya araçları korundu.
