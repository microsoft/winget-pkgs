ShortDescription: Free, open-source video and audio downloader for Windows
Description: |-
  ZenithW is a free, open-source Windows app for downloading video and audio from supported sources using yt-dlp and FFmpeg.
  The native desktop application uses Rust and Microsoft Edge WebView2. Choose formats and quality, manage download queues and playlists, and configure trimming, subtitles, cover art, SponsorBlock, profiles and local history.
  Downloads and processing run on your device. Source availability depends on site access conditions and supported formats.
