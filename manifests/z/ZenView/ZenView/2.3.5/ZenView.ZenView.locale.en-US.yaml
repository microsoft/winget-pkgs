ShortDescription: A private content blocker for adults who want to quit on their own. Detects explicit content on-device across browsers and apps.
Description: |-
  ZenView is for adults who want to stop watching explicit content on their own, privately, without telling anyone. No accountability partner, no reports sent to someone else, nobody looking over your shoulder. Just you and a blocker that holds the line when willpower doesn't.

  Most blockers work from a list of banned websites. ZenView detects explicit, NSFW images on the device itself, so it works across browsers, social feeds and desktop apps. When explicit content keeps appearing, ZenView closes the tab or window; on the third strike it blocks that app for 15 minutes. You choose a cooldown in advance: once you ask to turn protection off, it stays on until the cooldown has passed.

  Screenshots are not uploaded and no activity reports are sent to another person. You can mark trusted sites and apps. ZenView inspects the foreground window of supported browsers and desktop apps only. ZenView runs on 64-bit Windows 10 and 11. An account and a subscription are required; eligible new customers get a 7-day free trial.
