ReleaseNotes: |-
  **[Download Zero Install for Windows](https://get.0install.net/#windows)**
  ## Changes
  • Added `0install materialize` command
  • Added `--no-packages` option
  • Check replacement feed URIs against kiosk-mode allowlist
  • Improved validation of alias names
  • Report desktop integration conflicts while the integration dialog is still open
  • Store Service：Replace .NET Remoting with named pipe (improved performance and security)
  • Fixed false error after opening Windows Settings UI for Default App
  • Fixed pending questions blocking forever when window is closed
  • Fixed capabilities checkbox being shown in basic view and for apps without capabilities
  • Fixed crash when opening file manager from store management fails
  • Fixed crash when adding implementation directory to empty list
  • Fixed crash when clicking "Done" twice while customizing selections
  • Updated `SharpCompress` dependency to 0.50.11


  Based on [Zero Install .NET 2.30.0](https://github.com/0install/0install-dotnet/releases/2.30.0).
