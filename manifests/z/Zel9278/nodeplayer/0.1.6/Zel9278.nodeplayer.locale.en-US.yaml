ShortDescription: A music player where the sound goes through a node graph you build yourself.
Description: |-
  nodeplayer is a music player where tracks come out of a Player node, run through effects, plugins and visualizers, and play from an Output node.
  It has a library with tags, sorting, play counts, repeat and shuffle; an EQ, limiter, delay, mixer and visualizers; VST3, CLAP and JSFX plugins with their editors inside the nodes; a 0.5–2× playback rate; a gapless selection loop; MIDI file playback through a built-in piano or instrument plugins; synced lyrics and video; and Misskey, Discord Rich Presence and media key support.
