# yaml-language-server: $schema=https://aka.ms/winget-manifest.locale.1.12.0.schema.json

PackageIdentifier: Zefaro.Zefaro
PackageVersion: 1.2.0
PackageLocale: id-ID
Publisher: Zefaro contributors
PackageName: Zefaro
PackageUrl: https://zefaro.pages.dev/id/
License: MIT
ShortDescription: Lingkungan pengembangan PHP dan Laravel lokal untuk Windows, gratis dan open source, alternatif XAMPP dan Laragon.
Description: |-
  Zefaro menyajikan setiap folder proyek di name.test dengan versi PHP-nya sendiri, dari PHP 7.4 sampai 8.5, yang bisa diganti per situs kapan saja, lengkap dengan HTTPS dari otoritas sertifikat lokalnya sendiri.
  Zefaro menjalankan nginx, MariaDB, PostgreSQL, Redis, phpMyAdmin, dan penangkap email Mailpit, semuanya dari satu jendela.
  Zefaro membuat situs Laravel dan WordPress baru, mengimpor proyek dan database dari XAMPP atau Laragon, dan menyediakan Tinker, Artisan, log, serta penjelajah database untuk setiap situs Laravel.
  Semua layanan hanya mendengarkan di 127.0.0.1. Zefaro tidak punya akun, analitik, fitur AI, maupun fitur cloud.
Tags:
