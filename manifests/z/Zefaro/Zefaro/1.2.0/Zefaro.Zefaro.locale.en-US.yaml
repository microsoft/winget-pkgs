ShortDescription: Free, open-source local PHP and Laravel development environment for Windows, an alternative to XAMPP and Laragon.
Description: |-
  Zefaro serves each linked project folder at name.test on its own PHP version, from PHP 7.4 to 8.5, which you can change for each site at any time, with HTTPS from its own local certificate authority.
  It runs nginx, MariaDB, PostgreSQL, Redis, phpMyAdmin and the Mailpit mail catcher, and starts each one from a single window.
  It makes new Laravel and WordPress sites, imports projects and databases from XAMPP or Laragon, and has Tinker, Artisan, logs and a database browser for each Laravel site.
  Every service listens on 127.0.0.1 only. Zefaro has no accounts, no analytics, no AI features and no cloud features.
