ReleaseNotes: |-
  ThinkReader 0.9.62 — 卡片菜单与 Hint 连接线
  - Hint 展开时隐藏对应箭头；收起后恢复原有曲线，避免连接线穿过 Hint 文字。
  - 悬停、选中和固定卡片复用同一组件与“…”菜单，取消单独的编辑按钮卡片。关闭侧栏时新建批注，在卡片位置输入；保存后打开侧栏仍是同一条批注，不自动固定卡片。
  - 修复隐藏侧栏提前建立第二份空编辑草稿的问题。
  - /review 与 /deep-review 保留一个 Agent，一次阅读交错完成 browse、annotation 和 summary。精简完全重复的共享方法上下文；已有总结不会跳过未完成的批注。原文、用户要求、自定义方法和写作质量规则保留。
  验收
  最终实现提交 0a0e63390e3f975e24d44616c52f6860c643ac08；Windows 11 x64，完整回归 125/125，89 个后端测试文件分别在独立进程运行。当前候选的资源/hash、冻结后端/MCP、18 项包内桌面流程、中英文首次 Profile 和 7 项 loopback MinerU API 流程通过。
  10 篇真实 PDF 覆盖 2 篇单栏、7 篇双栏和 1 篇三栏，共 386 个卡片状态。检查宽度、选边、悬停/选中、Hint、滚动/缩放及空白画面；未发现布局违规、连接线遮挡文字或白屏。三栏含通过服务生成的布局夹具。
  三个主题的真实 Electron 操作通过：正常“…”菜单、回复、显式固定、关闭侧栏创建、保存、重新打开和冲突保留草稿；Hint 展开隐藏线，收起显示原有曲线。
  使用全新 Channel、Actor workspace 和原生会话，让一个真实 Cursor Agent（grok-4.7-medium）对 Zhao 2019 IOD 原文执行 /review。首个可见回复 23.04 秒，全篇 643.17 秒，完成 54 张批注和带 17 处证据引用的总结。新生成批注通过 86 个卡片状态检查；100/100 条 Hint 通过可见高亮、源文匹配和源句两端检查。测试写入隔离 Library。
  共享方法上下文从 77,643 降至 73,299 UTF-8 字节，减少 5.59%；这是方法上下文测量，不能据此声称总耗时降低相同比例，也未达到三分钟完成标准。
  真实 Agent、主题和多论文测试在生产实现提交 60db0cf9d6430fba2e3d76c1b51629600d50a25f 上完成。最终提交只更新旧悬浮卡片选择器和固定卡片测试引用；运行代码、资源及方法与生产实现提交相同。最终完整回归和包内验收针对 0a0e63390e3f975e24d44616c52f6860c643ac08 重新执行。
  已通过原有 App 的检查、下载、SHA-512 校验及真实静默更新，将本机 0.9.61 更新至 0.9.62。安装后 1645 个文件与本次 unpacked 一致，32 个用户 PDF、批注、阅读副本及输出文件哈希未变。更新源为 loopback，不等于公开 GitHub 或全新机器安装验收。
  Windows 测试探针首次在强制停止后立即重启时遇到锁文件错误 32。失败记录保留；私有探针保留所有断言，将锁释放等待从 600 ms 延长为 1600 ms 后通过。Profile 探针同样保留全部断言并避开离屏截图时序。安装 UI 探针重启前先正常关闭更新器已启动的 App；卡片宽度检查区分自动卡片的最小宽度和用户保存的手动宽度，两张较窄手动卡片与原存储几何一致。
