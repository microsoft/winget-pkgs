ReleaseNotes: |-
  ThinkReader 0.8.6
  - 修复重复 /MediaBox 等可恢复 PDF 结构错误导致的导入失败，原 PDF 内容不变。
  - 文件树自动刷新外部删除和重命名；RAW PDF 改名后按内容恢复关联，解析使用临时输入副本。
  - RAW PDF 右键支持“重新导入”；成功、排队和解析中的文件置灰。
  - 随 App 提供 PDF.js 中文 CMap 与标准字体资源，修复部分中文 PDF 原文文字提取及批注定位基础缺失。
