ShortDescription: WYSIWYG Markdown editor and paginated EPUB reader for Windows.
Description: |-
  TypoZen is a Markdown editor and an EPUB reader in one window. Markdown is typed and
  seen as it will look, with raw source a keystroke away. Books are paginated with true
  two-page spreads, chapter navigation and a position scrubber, and keep the publisher's
  own layout.

  Reading position, bookmarks and open tabs are restored where they were left. An offline
  dictionary and thesaurus of nearly 150,000 definitions is bundled. Very large documents
  stay responsive because only what is on screen is rendered. There are 25 themes, four
  bundled typefaces, and no network requests, account or telemetry.
