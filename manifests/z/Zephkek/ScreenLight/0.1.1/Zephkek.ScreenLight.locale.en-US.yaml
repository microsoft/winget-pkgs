ShortDescription: Shows which program is recording your screen, taking screenshots or reading your keys.
Description: |-
  Screen Light puts an eye in your system tray that turns red when a program records or shares your screen, takes screenshots, reads your keyboard, or clicks and types on its own, and it tells you which program it is.
  You can end the program from the list, or trust the ones you know.
