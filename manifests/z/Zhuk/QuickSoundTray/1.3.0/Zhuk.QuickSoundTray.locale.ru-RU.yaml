PackageIdentifier: Zhuk.QuickSoundTray
PackageVersion: 1.3.0
PackageLocale: ru-RU
Publisher: Zhuk
PackageName: QuickSoundTray
License: Бесплатно
ShortDescription: Компактный микшер звука в трее Windows — громкость каждого приложения, переключение устройств в один клик, выключение микрофона горячей клавишей.
Description: |-
  QuickSoundTray заменяет стандартный микшер громкости Windows одним компактным окном в трее.
  - Громкость и выключение звука для каждого приложения
  - Переключение устройств воспроизведения и записи в один клик, вывод на несколько устройств
  - Глобальная клавиша выключения микрофона (Alt+Shift+M) прямо в играх; микшер открывается по Alt+Shift+S
  - Звуковые режимы (Стример, Гейминг, Музыка, Ночной, Звонки или свои) с откатом, если устройство недоступно
  - Автоприглушение выбранных приложений, пока вы говорите
  - Исправление типичных проблем со звуком и проверка микрофона
  - Анимированный значок в трее, виджет звука, 6 тем и 7 языков интерфейса
  Бесплатно, без рекламы, регистрации и сбора данных.
Tags:
- громкость
- звук
- микрофон
- микшер
