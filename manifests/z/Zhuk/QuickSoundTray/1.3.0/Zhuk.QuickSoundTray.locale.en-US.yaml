ShortDescription: Compact tray volume mixer for Windows with per-app volume, one-click device switching, a mic mute hotkey and sound modes.
Description: |-
  QuickSoundTray replaces the Windows volume mixer with one compact window in the system tray.
  - Per-app volume and mute
  - Switch playback and recording devices in one click, or output to several devices at once
  - Global microphone mute hotkey (Alt+Shift+M) that works inside games; the mixer opens with Alt+Shift+S
  - Sound modes (Streamer, Gaming, Music, Night, Calls or your own) with automatic rollback if a device is unavailable
  - Auto-ducking: selected apps get quieter while you speak
  - Quick fixes for common Windows sound problems and a microphone test
  - Animated tray icon, desktop sound widget, 6 themes and 7 interface languages
  Free, no ads, no account, no data collection.
