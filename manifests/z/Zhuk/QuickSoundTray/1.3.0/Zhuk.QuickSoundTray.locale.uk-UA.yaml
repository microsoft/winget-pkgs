PackageIdentifier: Zhuk.QuickSoundTray
PackageVersion: 1.3.0
PackageLocale: uk-UA
Publisher: Zhuk
PackageName: QuickSoundTray
License: Безкоштовно
ShortDescription: Компактний мікшер звуку в треї Windows — гучність кожного застосунку, перемикання пристроїв в один клік, вимкнення мікрофона гарячою клавішею.
Description: |-
  QuickSoundTray замінює стандартний мікшер гучності Windows одним компактним вікном у треї.
  - Гучність і вимкнення звуку для кожного застосунку
  - Перемикання пристроїв відтворення й запису в один клік, виведення на кілька пристроїв
  - Глобальна клавіша вимкнення мікрофона (Alt+Shift+M) просто в іграх; мікшер відкривається за Alt+Shift+S
  - Звукові режими (Стример, Геймінг, Музика, Нічний, Дзвінки або власні) з відкатом, якщо пристрій недоступний
  - Автоприглушення вибраних застосунків, поки ви говорите
  - Виправлення типових проблем зі звуком і перевірка мікрофона
  - Анімований значок у треї, віджет звуку, 6 тем і 7 мов інтерфейсу
  Безкоштовно, без реклами, реєстрації та збору даних.
Tags:
- гучність
