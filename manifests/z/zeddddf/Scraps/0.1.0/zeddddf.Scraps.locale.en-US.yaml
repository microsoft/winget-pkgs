ReleaseNotes: |-
  First open-source release.
  - Native Win32 + Direct2D, virtualized list with variable row heights (Fenwick index)
  - SQLite + FTS5 full-text history with async paging and highlighting
  - Favorites, pins, groups, tags; history/library layered storage
  - Paste queue and sequential pasting; CLI and Named Pipe IPC
  - Screenshot subprocess (WGC / DXGI / GDI)
