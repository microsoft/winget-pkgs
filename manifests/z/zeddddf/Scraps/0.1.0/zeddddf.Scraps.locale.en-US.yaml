ShortDescription: The fastest, lightest native clipboard manager for Windows.
Description: |-
  Scraps is a native Win32 clipboard manager: single resident process, Direct2D
  direct rendering, zero runtime dependencies - instant response even with 100k+
  history entries. All data stays 100% local; no accounts, no telemetry, no cloud.

  Features: clipboard history for text / HTML / RTF / images / file lists,
  full-text search (SQLite + FTS5), favorites / pins / groups / tags, paste queue
  with sequential pasting, layered history & library storage, drag-and-drop
  export, global hotkey, Named Pipe IPC and a scriptable CLI.
