ShortDescription: Encrypted git remote that lives on your own disk
Description: |-
  GitCoffer turns a directory on a removable or secondary disk into a fully
  encrypted git remote. Push and pull with stock git and VSCode; the bytes
  on the disk are ciphertext, and with the passphrase the complete
  repository is reconstructed from the vault alone.
