ReleaseNotes: |-
  BSManager continues to get better, thanks to your continued support and contributions! 🎈🎉
  Features
  - Added the ability to compare installed mods between Beat Saber versions #718 (Thanks to @silentrald)
  - BSManager now warns you when your VR runtime may not be configured correctly before launching Beat Saber #1066 (Thanks to @GaetanGrd)
  - Added an option to automatically close BSManager after Beat Saber starts #1070 (Thanks to @GaetanGrd)
  - Added a right-click menu to versions in the navigation bar for quicker access to common actions #1062 (Thanks to @GaetanGrd)
  - Version cards now have their own download button #1063 #1078 (Thanks to @GaetanGrd)
  - Added the ability to unlink all shared folders at once #1064 (Thanks to @GaetanGrd)
  - Added refresh buttons and clearer selection counts for maps, playlists, and models #1073 (Thanks to @GaetanGrd)
  - Playlists can now be opened by double-clicking them #1073 (Thanks to @GaetanGrd)
  - Steam and Oculus sessions can now be managed separately from the settings #1073 (Thanks to @GaetanGrd)
  - Added a clear empty state when a mod search returns no results #1083

  Fixes
  - Fixed some installed mods not appearing when they were pending or unverified on BeatMods #1029 (Thanks to @maxthomas95)
  - Fixed some manually imported mods being installed in the wrong folder #1029 (Thanks to @maxthomas95)
  - Fixed mod installation for some Linux users #1045 (Thanks to @silentrald)
  - Fixed display issues on some Linux VR setups #1049 (Thanks to @silentrald)
  - Fixed FPFC launches sometimes taking over a minute #1025 (Thanks to @Umbranoxio)
  - Fixed Steam version downloads failing or unexpectedly closing the login window #1051 #1037 (Thanks to @ghitori)
  - Fixed Beat Saber downloads on Linux #1082
  - Fixed unnecessary launch delays when the Meta/Oculus client is not installed #1037 (Thanks to @ghitori)
  - Fixed several Oculus launch option and shortcut issues #1037 (Thanks to @ghitori)
  - Fixed BeatSaver searches using BSR codes #1094
  - Fixed installed Beat Saber versions not loading when BSManager is offline #1097

  Other Changes
  - Improved various Italian translations #1047 (Thanks to @mirutech)
  - Improved Korean translations and fixed missing translations #1054 #1091 (Thanks to @izunya)
