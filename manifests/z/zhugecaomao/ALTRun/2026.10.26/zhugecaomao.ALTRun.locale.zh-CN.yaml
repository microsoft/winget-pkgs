ShortDescription: 轻量、开源、Alfred 风格的 Windows 启动器
Description: |-
  ALTRun 是用 AutoHotkey v2 编写的 Windows 启动器, 操作习惯参照 macOS 上的 Alfred。
  按 Alt+Space 输入即可打开程序、文件、文件夹和网页; 用 Everything 搜索文件; 剪贴板历史、文字片段、计算器、系统命令;
  中文名称可以按拼音首字母搜索。
