ReleaseNotes: |-
  3.0.2
  新功能 (Feat)
  - 支持主窗口配置背景图
  - AI 模型配置支持多供应商一对多模型
  - 新增插件更新检查与升级入口：进入插件后可在右上角查看并安装新版本，已安装插件页面新增「更新」标签，并为可更新插件显示红点提示
  - 插件设置新增「搜索栏推送」快捷开关，可从主搜索栏、超级面板和独立窗口的插件菜单中直接切换
  - 通用设置新增「全屏模式下忽略热键」，可在全屏应用激活时停用 ZTools 快捷键
  - ztools.getUser 新增获取当前登录用户公开资料的能力
  - ztools.clipboard.writeContent 新增文件类型支持，可写入单个或多个文件路径并执行粘贴
  - 插件页面新增主题色 CSS 变量注入与动态同步，无需主动监听主题事件也能跟随宿主主题色变化
  - 本地启动项支持设置别名和快捷键（PR #609，感谢 @Particaly 的贡献 🎉）
  - ScreenCapture.start 新增 autoConfirm 自动确认模式，兼容原有调用方式，并补充截图结果类型（PR #608，感谢 @Particaly 的贡献 🎉）
  - ztools.createBrowserWindow 支持在相对页面地址中携带 query 和 hash 参数（PR #613，感谢 @xiaou66 的贡献 🎉）
  - 软件更新支持网盘下载源
  - 新增消息中心，可接收评论回复
  - 正式版支持检查 beta 版本
  修复 (Fix)
  - 修复安装市场插件时未优先使用插件自身 downloadUrl 的问题（PR #615，感谢 @Particaly 的贡献 🎉）
  - 修复双击快捷键在按键组合或重复触发场景下可能误触发的问题
  - 修复从 Word 复制文本时可能被错误识别为图片的问题
  - 修复 macOS 剪贴板历史未正确去重的问题（PR #601，感谢 @Reaosen 的贡献 🎉）
  - 修复从超级面板启动插件时插件视图可能被截断的问题（PR #612，感谢 @guopenghui 的贡献 🎉）
  - 修复 Windows 手动卸载后开机启动项未被清除的问题
  - 修复 Windows 本地启动程序继承错误工作目录的问题，并兼容正斜杠和反斜杠路径（PR #604，感谢 @JSap0914 的贡献 🎉）
  - 修复 Windows「在终端打开」降级使用 PowerShell 或 CMD 时，因缺少控制台句柄而异常终止的问题（PR #588，感谢 @Flinglin 的贡献 🎉）
  - 修复旧版数据导入后，持久化内容中的本地路径仍可能指向旧数据目录的问题
  优化 (Optimize)
  - 内置设置插件改为直接加载本地资源，启动时不再依赖静态服务器
  - 应用更新源恢复为 GitHub，并统一版本下载页与 Release 页地址
  重构 (Refactor)
  无
  其他 (Chore)
  - 新增插件升级、剪贴板文件写入、全屏热键屏蔽、用户资料 API、旧数据路径迁移和 Windows 启动目录等测试覆盖
