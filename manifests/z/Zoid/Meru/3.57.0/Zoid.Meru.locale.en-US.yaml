  Fixed
  - Clicking an account tab sometimes not switching to that account's view
  - "Copy Message Link" not being available for messages opened from search results, labels, or categories
  Internal Changes
  - Upgraded Electron to v43.2.0, which includes the latest Chromium with performance and security improvements
