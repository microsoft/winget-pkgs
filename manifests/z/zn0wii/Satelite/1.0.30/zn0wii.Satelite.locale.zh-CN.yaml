ReleaseNotes: |-
  更新说明
  - 悬停提示全面重做：自绘快速气泡替换原生 title（节点类 120ms / 其他 400ms 双档延迟），并清理订阅页、日志页等大量重复无用的悬停
  - 节点悬停详情：节点页与规则集弹窗统一显示四行信息（名称/端点/传输+TLS/UDP）
  - 订阅导入/刷新弹窗报告：有节点被跳过时弹窗展示原因明细，可一键复制反馈给开发者
  - 规则集 ⋮ 菜单快捷切换：DNS 与路由（含选链路）二级菜单，绿点标当前项
  - 视觉修复：导航悬停渗出的浅色带（背滤合成 bug）、导航投影简化、背景光晕下移
  下载指南
  - macOS Apple Silicon（M 系列） → aarch64.dmg
  - macOS Intel → x64.dmg
  - Windows 64 位 → x64-setup.exe
  - Linux 64 位 → amd64.AppImage
  根据你的系统和 CPU 架构选择对应安装包即可。
  macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
  sudo xattr -d com.apple.quarantine /Applications/Satelite.app
