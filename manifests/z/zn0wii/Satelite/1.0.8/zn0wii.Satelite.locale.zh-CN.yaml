ReleaseNotes: |-
  v1.0.8
  - TUN 增强：新增 IPv6 / QUIC 屏蔽开关，修复 FakeIP、strict_route 持久化；新增系统 DNS 绕过 TUN 检测横幅(macOS)
  - 规则集重构：内置规则集改为远程规则集并锁定 URL,策略徽章彩色化，修复旧内置列表被过期资源“复活”的问题
  - 极简模式优化：连接页居中主视觉重设计，节点页移除订阅列表，窗口支持缩小
  - 稳定性修复：Hysteria2 等 UDP 协议延迟测试改走 Clash API、核心停止时跳过；修复智能切换节点评分抖动；锚定 sing-box 子进程工作目录
  - 界面细节：全新 Face ID 托盘笑脸图标，兼容旧版 WebKit 的节点卡片布局
  周末愉快，各位朋友
