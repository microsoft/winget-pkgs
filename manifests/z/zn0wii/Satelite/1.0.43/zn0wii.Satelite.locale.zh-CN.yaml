ReleaseNotes: |-
  修复
  - macOS 老系统图标显大问题：应用图标在 macOS 15 及更早系统上比其他 App 明显偏大偏方，改用独立手工调整的 macOS 专属图标源图，同时不影响 macOS 26 Tahoe 与 Windows/Linux 的图标显示
  - VLESS 节点 packet_encoding: none 导致内核崩溃：部分 Clash/sing-box 格式订阅携带 packet-encoding: none，sing-box 只认 xudp/packetaddr，遇到 none 会直接 FATAL 崩溃整个 outbound；现在在订阅解析、手动编辑节点、配置生成三处统一做兼容处理
