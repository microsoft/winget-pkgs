ReleaseNotes: |-
  更新说明
  - 延迟测速结果全局实时共享：测速结果按"真实延迟优先"规则落库（TCP ping 不再覆盖真实延迟），首页延迟卡、节点页、简洁模式服务器页即时刷新，无需手动刷新
  - 修复 Xray 内核切换节点不生效：手动选节点后自动重启内核生效；同时修复重启时偶发的端口占用失败（被杀进程 socket 残留自动等待回收并重试）
  - Xray 模式下置灰「测真实延迟」：Xray 无延迟测试接口，按钮不再静默降级为 TCP ping，Ping 测试仍可用
  - 订阅支持自定义自动更新间隔：预设 1/12/24 小时外可输入任意分钟数
  下载指南
  - macOS Apple Silicon（M 系列） → aarch64.dmg
  - macOS Intel → x64.dmg
  - Windows 64 位 → x64-setup.exe
  - Linux 64 位 → amd64.AppImage
  根据你的系统和 CPU 架构选择对应安装包即可。
  macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
  bash
  sudo xattr -d com.apple.quarantine /Applications/Satelite.app
