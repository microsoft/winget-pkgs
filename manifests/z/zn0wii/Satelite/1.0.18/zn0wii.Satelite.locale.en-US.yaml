PackageIdentifier: zn0wii.Satelite
PackageVersion: 1.0.18
PackageLocale: en-US
ShortDescription: A lightweight and modern proxy client for macOS and Windows, featuring subscription management, node switching, TUN mode, smart DNS, traffic monitoring and rule-based routing.
Description: Satelite Proxy is a lightweight sing-box desktop proxy client built with Tauri 2, React and Rust. It supports importing Clash-compatible subscriptions by link or file, switching between SS, VMess, VLESS, Trojan, Hysteria2, TUIC, SOCKS5, AnyTLS and Snell nodes with one-click speed tests, rule-based routing with cached remote rule sets, smart DNS with DoH, DoT and FakeIP, system proxy and TUN mode, live connection and traffic monitoring, and a tray-resident background connection with auto-start.
