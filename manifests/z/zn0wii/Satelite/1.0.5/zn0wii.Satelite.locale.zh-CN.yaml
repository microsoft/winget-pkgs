ReleaseNotes: |-
  - 新增更多代理协议：HTTP、Hysteria、ShadowTLS、SSH、Naive、Tor、WireGuard（导入 + 内核配置）
  - 远程规则与规则开关改为统一防抖重启队列应用
  - 生成 sing-box 配置时，中文域名自动转为 Punycode
  - 内核启停/重启串行化，避免并发切换冲突
  - UI：导航栏 / 首页 / 重启 / 流量接管转圈状态统一，流量接管切换更顺滑
  - 日志：按小时滚动，并按容量与保留策略自动清理
