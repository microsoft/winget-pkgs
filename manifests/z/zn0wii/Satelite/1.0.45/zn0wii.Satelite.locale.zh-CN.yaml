ReleaseNotes: |-
  更新说明
  - mihomo 订阅原文透传：订阅中的 mihomo 节点按原始配置原样交给内核（零信息损失），ssr/mieru 等 mihomo 支持但应用此前未建模的节点类型不再被跳过，可直接使用。
  - 内核支持详情面板：订阅卡片 ⋮ 菜单新增「内核支持」——三内核逐节点支持明细（比例条 + 不支持原因列表 + 解析期跳过明细），支持一键复制分析报告，方便反馈问题时提供完整信息。
  - 自定义配置升级多内核：「自写配置」升级为「自定义配置」，自动识别 sing-box / mihomo / Xray 三种类型并按对应内核启动，添加页实时显示识别结果。
  - 查看订阅原始配置：订阅原始报文落盘留存，订阅卡 ⋮ 菜单新增「查看配置」只读弹窗（可复制），卡片同步显示配置类型标签（mihomo / sing-box / URI）。
  - 界面修正：卡片级弹窗底部边距修正，按钮不再贴卡片边缘（查看配置、内核支持、池编辑等多个弹窗）。
  下载指南
  - macOS Apple Silicon（M 系列） → aarch64.dmg
  - macOS Intel → x64.dmg
  - Windows 64 位 → x64-setup.exe
  - Linux 64 位 → amd64.AppImage
  根据你的系统和 CPU 架构选择对应安装包即可。
  macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
  sudo xattr -d com.apple.quarantine /Applications/Satelite.app
