ShortDescription: 一个轻量、好看的 sing-box 桌面代理客户端，基于 Tauri 2 + React + Rust 构建，支持 macOS 与 Windows。
Description: Satelite Proxy 是一个基于 Tauri 2、React 和 Rust 构建的轻量级 sing-box 桌面代理客户端。支持导入 Clash 兼容订阅（链接导入、文件导入、浏览器一键导入），在 SS、VMess、VLESS、Trojan、Hysteria2、TUIC、SOCKS5、AnyTLS、Snell 等协议节点间一键测速与快速切换，基于规则集的分流（支持远程规则集自动缓存），支持 DoH、DoT、FakeIP 的智能 DNS，系统代理与 TUN 模式，实时连接与流量监控，以及常驻托盘的自动启动与静默启动。
