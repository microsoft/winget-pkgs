ReleaseNotes: |-
  更新说明
  - Windows 应用图标更新：exe/安装包/任务栏图标改由与 macOS 同款的手调源图直接生成，观感与 macOS 完全一致（瓦片更大、圆角手调，观感更干净）
  - 托盘唤醒位置记忆：窗口大小与位置一并持久化，托盘双击唤醒与冷启动均恢复到记住的位置，不再漂移
  - 多显示器适配：拔除显示器或更改分辨率后，落屏外的记住位置自动校验并居中回正
  - 小尺寸图标调优保留：任务栏小尺寸下轮廓依旧清晰（20/28px 高 DPI 档 + ≤48px 锐化提亮）
  下载指南
  - macOS Apple Silicon（M 系列） → aarch64.dmg
  - macOS Intel → x64.dmg
  - Windows 64 位 → x64-setup.exe
  - Linux 64 位 → amd64.AppImage
  根据你的系统和 CPU 架构选择对应安装包即可。
  macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
  sudo xattr -d com.apple.quarantine /Applications/Satelite.app
