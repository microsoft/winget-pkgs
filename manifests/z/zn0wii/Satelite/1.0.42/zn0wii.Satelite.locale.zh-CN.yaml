ReleaseNotes: |-
  更新说明
  - 全新应用图标：换为「冰蓝发光笑脸土星」新稿，全平台（Windows/macOS/Linux）应用图标、任务栏与安装包图标同步更新
  - TLS 分片：设置 → 内核设置新增 sing-box / Xray 双开关，开启后对 TLS 节点出站启用分片，缓解 SNI 特征阻断
  - 节点管理增强：同一 URL 可重复添加多个订阅；节点支持单节点参数编辑（⋮ → 编辑节点）；节点卡片新增 reality / tls / 传输层小徽标
  - 多核模式 TUN 修复：TUN + 副进程委托下副进程流量回环导致无法上网的问题已修复
  - Windows 体验优化：标题栏小图标按 DPI 原生尺寸重绘不再发糊；托盘左键单击直接唤起主界面、右键出菜单
  下载指南
  - macOS Apple Silicon（M 系列） → aarch64.dmg
  - macOS Intel → x64.dmg
  - Windows 64 位 → x64-setup.exe
  - Linux 64 位 → amd64.AppImage
  根据你的系统和 CPU 架构选择对应安装包即可。
  macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
  sudo xattr -d com.apple.quarantine /Applications/Satelite.app
