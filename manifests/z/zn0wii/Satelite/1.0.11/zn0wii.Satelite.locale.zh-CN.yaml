ReleaseNotes: |-
  - 全新内核级 DNS 诊断（DNS 页）：经 sing-box/mihomo 实时解析（/dns/query）并推演查询路径（本地/国内/远程、上游服务器、命中规则），表格化一行一域名，支持单个/全部诊断、自定义域名持久化，明文本地/国内路径标红泄露风险
  - 三内核 DNS 解析池统一：远程 DoH（1.1.1.1/8.8.8.8 经代理）与国内明文池全内核同源，Xray 改 skipFallback 分类池、mihomo 移除 fallback 泄露槽；DNS 页重排（FakeIP 并入通用卡 2×2 + ⋯ 弹窗编辑）
  - 核心启动可观测性增强：记录内核启动命令与失败原因，Xray 启动即死与自定义配置超时改为带日志尾部的明确报错；移除误报的端口预检
  - macOS 稳定性：加固 sudo/PTY 授权链路，修复 EACCES 后小时日志的恢复
  - 其他：LAN 端口放行修复、顶栏导航宽度微调、版本号更新
