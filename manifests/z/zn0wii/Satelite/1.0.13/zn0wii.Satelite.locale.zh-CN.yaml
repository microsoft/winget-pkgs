ReleaseNotes: |-
  - 首页新增「网络探测」卡：点击同时刷新当前节点延迟与出口 IP
  - 节点批量测速改为流式回传：逐节点完成后经 rAF 合帧即时上屏，起测顺序跟随当前列表排序
  - 内核可靠性修复：启动就绪须实测 mixed 端口拨号（不再假「运行中」）、看门狗真重启死核并推送 core-status-changed、连接实时负载限最新 1000 行；前端加 ErrorBoundary 白屏兜底、崩溃/未捕获异常写入应用日志、生命周期边即时重同步状态
  - UI 打磨：工具栏按钮统一玻璃样式、订阅卡片收紧（4 列网格 + 单行流量条）、版本栏当前/最新两列对齐
