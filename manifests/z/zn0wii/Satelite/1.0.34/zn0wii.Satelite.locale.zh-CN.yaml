ReleaseNotes: |-
  更新说明
  - 图标更新：更新 macOS 应用图标（128x128、128x128@2x、32x32、.icns）
  - Xray 传输面修正：h2 传输已被 Xray v26 移除，生成期跳过相关节点并从核心节点列表过滤，sing-box/mihomo 仍原生支持
  - xhttp extra 参数接入：分享链接与 clash 订阅的 xhttp-opts.extra 均可解析并原样嵌入 Xray 配置，非法 JSON 自动丢弃防止整配置拒载
  下载指南
  - macOS Apple Silicon（M 系列） → aarch64.dmg
  - macOS Intel → x64.dmg
  - Windows 64 位 → x64-setup.exe
  - Linux 64 位 → amd64.AppImage
  根据你的系统和 CPU 架构选择对应安装包即可。
  macOS 如果提示「Satelite 已损坏，无法打开」，可在终端执行：
  sudo xattr -d com.apple.quarantine /Applications/Satelite.app
