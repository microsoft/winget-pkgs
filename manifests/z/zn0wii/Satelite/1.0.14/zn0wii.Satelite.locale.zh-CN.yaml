ReleaseNotes: |-
  1. 节点与订阅：新增国家标签覆盖与满载分组，修复 SIP002 SS 链接及更多 URI 变体的解析
  2. 交互体验：新增 Cmd/Ctrl 导航快捷键与设置页方向键切 tab，简洁模式流量卡支持全屏
  3. 日志与诊断：内核日志解析时间戳并按最新在前排序，首页出口 IP 悬停显示来源 API
  4. 修复：标题栏主题固定跟随应用设置而非系统外观，代理链引用计数只统计实际进入配置的链路
  5. 文档：README 与三内核（sing-box/Xray/mihomo）应用现状同步
