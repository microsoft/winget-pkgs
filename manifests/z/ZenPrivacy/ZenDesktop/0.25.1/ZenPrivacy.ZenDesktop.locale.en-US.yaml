ReleaseNotes: |-
  What's New
  - No more Firefox local network prompts
    Firefox recently introduced local network access control, which asks for permission when a page connects to a local device. Zen loaded its injected page assets from 127.0.0.1, which triggered the prompt and blamed the site for a connection Zen was actually making. These assets are now served via a fake hostname, so the prompt no longer appears.
  - Framework upgrade
    Upgraded Wails to v2.14.0, fixing a crash on Windows when downloading the WebView2 runtime.
  Thank you for using Zen!
