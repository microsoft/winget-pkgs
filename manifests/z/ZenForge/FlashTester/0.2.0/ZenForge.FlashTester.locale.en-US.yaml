ReleaseNotes: |-
  Adds file-level and whole-disk backup and restore in the GUI and command line.
  - Save files to a single ZIP archive with a SHA-256 manifest and restore them into a new folder.
  - Save every disk sector to an .img file with a checksum manifest.
  - Backups are validated before restore and read back afterward.
  - System disks stay protected from backup-source and restore operations.
