ReleaseNotes: |-
  Brings the GUI to FreeBSD and hardens how reports are saved.
  - The FreeBSD build now has the same GUI as Linux.
  - On Linux and FreeBSD, a GUI running as root saves reports with the desktop user's rights, so a planted link cannot redirect them.
  - Saved reports are never overwritten: each file name carries milliseconds.
