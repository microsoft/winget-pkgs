ShortDescription: Test USB sticks, SD cards and disks for fake capacity, data loss and speed.
Description: |-
  FlashTester checks whether a USB stick, SD card or other disk really stores what it claims. The full test fills free space or the whole disk with test data and reads it back, reporting lost, corrupted and overwritten blocks. A quick probe estimates usable capacity, and it can re-check files written by h2testw.
  It also shows drive details and SMART counters, measures speed, runs endurance and pull-the-plug tests, and backs up files to ZIP or whole disks to an image. Run it without arguments for the GUI, or with a command for the CLI. System drives are protected from write tests.
