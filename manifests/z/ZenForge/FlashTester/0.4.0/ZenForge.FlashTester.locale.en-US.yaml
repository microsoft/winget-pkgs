ReleaseNotes: |-
  Adds quick diagnostics and fixes whole-disk random 4K tests on Windows.
  - Quick diagnostics: one run on a whole disk samples capacity and measures the write cache, speed before and after it, small writes, 4K reads and stalls, in about 3 to 15 minutes.
  - --hide-serial leaves serial numbers out of printed and saved reports.
  - Fixed: random 4K speed on whole disks failed with error 87 on Windows.
  - Fixed: the quick capacity probe could run for very long on drives with a small write cache.
