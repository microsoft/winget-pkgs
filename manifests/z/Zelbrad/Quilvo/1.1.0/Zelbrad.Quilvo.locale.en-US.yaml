ShortDescription: Free, offline voice dictation for Windows. Press a hotkey, speak, and the text is typed wherever your cursor is.
Description: 'Quilvo is local voice dictation for Windows. Press Alt+PageDown anywhere, speak, and press it again: the text is typed into whatever field your cursor is in. Speech recognition runs on your PC with faster-whisper, so nothing you say leaves your computer. Supports about 100 languages; the speech model downloads on first run.'
