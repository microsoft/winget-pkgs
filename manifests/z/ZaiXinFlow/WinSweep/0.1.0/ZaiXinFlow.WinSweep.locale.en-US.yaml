ShortDescription: A dark-styled, portable Windows junk scanner and safe cleaner.
Description: WinSweep is a dark-styled, portable Windows junk scanner and safe cleaner. It covers 18 junk types (system, developer and browser caches), moves files to the Recycle Bin by default, and requires explicit confirmation for permanent deletes. Single-file exe, only 2.83MB. Fully local, no data upload, MIT licensed.
