ShortDescription: Airport subscription quota in PowerToys Command Palette Dock
Description: |-
  VpnTraffic is a PowerToys Command Palette extension that shows proxy airport
  subscription total traffic, used traffic, and usage percentage from the
  subscription-userinfo response header (multi-device friendly). Pin a Dock band
  for Compact/Default layouts; configure refresh interval and sparse history
  persistence to reduce disk writes.
