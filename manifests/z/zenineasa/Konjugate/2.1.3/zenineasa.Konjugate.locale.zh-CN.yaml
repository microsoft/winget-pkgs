ShortDescription: 图原生仿真引擎，用于构建可组合的工程仿真与数字孪生。
Description: |-
  一款开源的图原生仿真引擎，用于构建可组合的工程仿真与数字孪生。

  把系统画成由关系相连的部件，为每个部件写下方程，然后运行它。Konjugate 会自动帮你组装整个系统；同一个模型可以实时操控、用实测数据拟合、与真实系统保持同步成为数字孪生，或者导出成代码。

  你可以用它做什么

  - 把系统建模成图：节点保存状态量，关系承载节点之间的方程，方程直接用 LaTeX 书写。重复的结构可以归入子系统与关系组并加以复用。
  - 运行并操控它：实时观看求解过程，在运行中修改参数，从任意时刻分叉出一个场景，并回放结果。较大的模型会被分区后并行运行。
  - 构建数字孪生：把运行中的模型接入数据日志、MQTT 代理、OPC UA 服务器或脚本产生的实时测量值，与真实系统保持同步，随漂移重新拟合，并向未来预测。
  - 从数据出发：导入时间序列 CSV，Konjugate 会提出哪些变量驱动哪些变量、方向如何、用什么方程，由你审阅后再写入模型。
  - 用文字描述需求：模型助手可以把自然语言请求转成可审阅、可撤销的模型改动，支持本地或托管的大模型。
  - 带到别处使用：导出独立的 C++ 或 FMI 2.0、3.0 联合仿真 FMU，导入 FMU，或在命令行中以无界面方式运行项目。
