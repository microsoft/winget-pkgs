ShortDescription: A graph-native simulation engine for building composable engineering simulations and digital twins.
Description: |-
  An open-source, graph-native simulation engine for composable engineering simulations and digital twins.

  Draw a system as components connected by relationships, write each one's equations, and run it. Konjugate assembles the whole system for you, and the same model can be steered live, fitted to measured data, kept in step with a real system as a digital twin, or exported as code.

  What you can do with it

  - Model a system as a graph. Nodes hold states, relationships carry the equations between them, written in ordinary LaTeX. Group repeated structure into subsystems and relationship groups, and reuse it.
  - Run it and steer it. Watch a run as it happens, change a parameter mid-run, fork a scenario from any point, and replay the result. Larger models are partitioned and run in parallel.
  - Build digital twins. Connect a running model to live measurements from a data log, an MQTT broker, an OPC UA server or a script, keep it in step with the real system, refit it as it drifts, and forecast ahead.
  - Start from data. Import a CSV of time series and Konjugate proposes which variables drive which, in what direction and with what equation, for you to review before anything is added.
  - Describe it in words. The Model Assistant turns a plain-language request into model changes you can review and undo, with local or hosted models.
  - Take it elsewhere. Export standalone C++ or an FMI 2.0 or 3.0 Co-Simulation FMU, import FMUs, or run projects headlessly from the command line.
