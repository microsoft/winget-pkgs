PackageIdentifier: ZMGID.Kivio
PackageVersion: 2.8.3
PackageLocale: zh-CN
ShortDescription: 轻量桌面 AI 客户端与屏幕级 Agent：聊天、工具、翻译、OCR、视觉问答，放进一个小应用。
Description: |-
  Kivio 是一个小体积桌面 AI 客户端，内置 Agent 运行时。常驻托盘或菜单栏，需要时再出现，比浏览器里的 AI 工作台更轻。
  - Kivio Agent —— 聊天、项目、助手、记忆、文件/图片附件、MCP、Skills、本地工具（文件操作、终端、网页抓取/搜索、Pyodide run_python）。
  - Lens —— 基于截图的视觉问答、OCR、公式提取、文本优化，可选联网来源回答。
  - 快速翻译 —— 输入文本、选中文本、窗口、任意屏幕区域。
  - 自带模型选择权 —— 支持 OpenAI 兼容接口与 Anthropic Messages，可按功能分别路由模型，多 Key 故障转移。
  - 文档可直接用 —— PDF / Word / Excel 工作流跑在随包的离线 Pyodide 沙箱，不依赖首次运行从 CDN 下载。
  - 默认安静 —— 无遥测；API Key 与对话数据留在本机
Tags:
- 人工智能
- 大语言模型
- 聊天机器人
ReleaseNotes: |-
  Kivio Desktop v2.8.3
  桌面 AI 助手 · macOS (Apple Silicon) + Windows。Desktop AI assistant for macOS (Apple Silicon) and Windows.
  下载 / Downloads
  - Windows — Kivio.Desktop_2.8.3_x64-setup.exe（NSIS 安装包 / installer）
  - macOS — Kivio.Desktop_2.8.3_aarch64.dmg（Apple Silicon，未签名 / unsigned）
    - 首次启动：右键 → 打开，或运行 xattr -cr "/Applications/Kivio Desktop.app"
    - First launch: right-click → Open, or run xattr -cr "/Applications/Kivio Desktop.app"
  新版本亮点 / What's New
  - 内置联网搜索 / Built-in web search — 每个会话可独立选择「关闭 / 内置 / 第三方」三态联网搜索，内置模式直接调用供应商自带的搜索能力（OpenAI Responses、Gemini、Anthropic），搜索过程以实时卡片展示在答案上方，最后一次选择会记为新会话默认。Each conversation now picks its own web-search mode — off, built-in, or third-party. Built-in mode calls the provider's own hosted search (OpenAI Responses, Gemini, Anthropic) and streams the search as a live card above the answer; your last pick becomes the default for new conversations.
  - Gemini 原生生图 / Native Gemini image generation — 聊天里可直接用 Gemini 原生协议出图，生成结果挂到 artifacts；OpenAI 兼容中转的出图也已打通，出图端点路由收敛为单一解析并在猜错时自愈。Generate images in chat over Gemini's native protocol with results attached as artifacts; image generation through OpenAI-compatible relays now works too, with endpoint routing consolidated into one resolver that self-heals when it guesses wrong.
  - 外部 CLI 原生会话 / Native sessions for external CLIs — 全部外部 CLI 改用各自的原生会话机制，不再重放历史消息；kimi 迁到 ACP，pi 用 --session-id，会话与 CLI 绑定；可用性探测与模型探测分离并加缓存，新会话不再必然冷探测。All external CLIs now use their own native session mechanism instead of replaying history — kimi moved to ACP, pi uses --session-id, and sessions bind to their CLI. Availability and model probing are split and cached, so a new conversation no longer forces a cold probe.
  - 从本地 CLI 导入 MCP 与 Skill / Import MCP servers and Skills from local CLIs — 扩展页可扫描已安装的 Claude Code / Codex / OpenCode 配置，勾选后把它们的 MCP 服务器和 Skill 导入 Kivio。The Extensions page can scan your installed Claude Code / Codex / OpenCode configs and import their MCP servers and Skills into Kivio.
  - 截图标注模式 / Standalone screenshot annotation — 新增独立截图标注：箭头、矩形、马赛克，支持撤销后复制或保存；冻结帧改为双端常开，截图不再带鼠标指针。A new standalone annotation mode adds arrows, rectangles, and mosaic with undo, then copy or save; frozen-frame capture is now on for both platforms and screenshots no longer include the mouse cursor.
  - 模型下拉按能力筛选 / Capability-filtered model pickers — 生图、视觉、embedding 三处模型下拉分别只列具备对应能力的模型；新增模型级 extra_body 透传，可给单个模型附加自定义请求体字段。The image, vision, and embedding model pickers each list only models with that capability; a new per-model extra_body passes custom request-body fields to a single model.
  - 稳定性与体验修复 / Stability and polish — MCP 服务器在启用与开窗时预热连接、首轮工具收集加短超时兜底；HTTP 连接池加保活并缩短空闲淘汰；输入框草稿跨对话与页面切换保留；对话搜索支持全文匹配正文；修复切换/新建会话的重复加载、多模型并答时流式栏冻结、Retry-After 巨值导致的长时挂起、后台命令未按会话隔离、知识库检索 rerank 分被覆盖与结果被静默截断。MCP servers warm up their connection on enable and on opening the chat window, with a short timeout fallback for the first tool listing; the HTTP connection pool gained keep-alive and shorter idle eviction; composer drafts survive switching conversations and pages; conversation search matches message bodies. Fixes include duplicate loading when switching or creating conversations, the streaming column freezing during multi-model answers, long hangs from an oversized Retry-After, background commands not being isolated per conversation, and knowledge-base retrieval losing rerank scores or silently truncating results.

