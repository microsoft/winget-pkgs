PackageIdentifier: ZMGID.Kivio
PackageVersion: 4.0.2
PackageLocale: zh-CN
ShortDescription: 轻量桌面 AI 客户端与屏幕级 Agent：聊天、工具、翻译、OCR、视觉问答，放进一个小应用。
Description: |-
  Kivio 是一个小体积桌面 AI 客户端，内置 Agent 运行时。常驻托盘或菜单栏，需要时再出现，比浏览器里的 AI 工作台更轻。
  - Kivio Agent —— 聊天、项目、助手、记忆、文件/图片附件、MCP、Skills、本地工具（文件操作、终端、网页抓取/搜索、Pyodide run_python）。
  - Lens —— 基于截图的视觉问答、OCR、公式提取、文本优化，可选联网来源回答。
  - 快速翻译 —— 输入文本、选中文本、窗口、任意屏幕区域。
  - 自带模型选择权 —— 支持 OpenAI 兼容接口与 Anthropic Messages，可按功能分别路由模型，多 Key 故障转移。
  - 文档可直接用 —— PDF / Word / Excel 工作流跑在随包的离线 Pyodide 沙箱，不依赖首次运行从 CDN 下载。
  - 默认安静 —— 无遥测；API Key 与对话数据留在本机
Tags:
- 人工智能
- 大语言模型
- 聊天机器人
ReleaseNotes: |-
  Kivio Desktop v4.0.2
  下载 / Downloads
  - Windows 安装包 / Installer（NSIS）。Kivio.Desktop_4.0.2_x64-setup.exe
  - Windows 便携版 / Portable。需要 Microsoft Edge WebView2。解压后运行 Kivio Desktop.exe。Requires Microsoft Edge WebView2. Unzip and run Kivio Desktop.exe. Kivio.Desktop_4.0.2_x64-portable.zip
    - 应用内更新会下载安装包。便携版可手动下载新版 ZIP 更新。In-app updates download the installer. To update the portable edition, download the new ZIP.
  - macOS（Apple Silicon）。应用使用临时签名，未公证。The app is ad-hoc signed and unnotarized. Kivio.Desktop_4.0.2_aarch64.dmg
    - 首次启动可右键选择「打开」。如果 macOS 仍阻止启动，可运行 xattr -cr "/Applications/Kivio Desktop.app"。On first launch, right-click the app and choose Open. If macOS still blocks it, run the command above.
  新版本亮点 / What's New
  - CLI 对话导入 / CLI conversation import。可在项目中导入 DeepSeek Harness、Antigravity CLI 和 Pi 的历史对话，并由原 CLI 在原工作目录续聊。Import DeepSeek Harness, Antigravity CLI, and Pi conversations into a project. Resume each conversation with its original CLI in its original working directory.
  - 侧栏与工作区 / Sidebar and workspace。侧栏显示对话运行状态。切换项目、新建对话或重开窗口时，工作区面板沿用最后一次手动开关。The sidebar shows conversation run status. The workspace panel remembers your last toggle across projects, new conversations, and reopened windows.
  - 聊天输入与附件 / Composer and attachments。修复输入栏的方向键行为，简化工具调用摘要和附件展示。点击本地文本引用可在右侧预览并跳到对应行。Fix arrow-key behavior in the composer and simplify tool summaries and attachment display. Select a local text reference to preview the file at the cited line in the right panel.
  - 用量与历史 / Usage and history。简化上下文用量展示并修复压缩后的分隔线。历史会话索引按需建立。Windows 上的 Antigravity CLI 额度面板显示账号和套餐。Simplify context usage and fix the divider after compaction. Build the history index on demand. The Antigravity CLI limits panel on Windows shows the account and plan.
  - Windows 更新 / Windows updates。随安装包发布 SHA-256 摘要，应用内更新会在启动安装器前校验下载内容。Windows installers ship with a SHA-256 digest. The in-app updater checks the download before launching the installer.
  本版也包含自 v4.0.0 以来的代理与模型选择、内置专家、供应商登录和长对话加载改进。This release also includes the agent and model picker, built-in experts, provider sign-in, and long-conversation loading improvements since v4.0.0. 此前改动 / Earlier changes
  完整变更 / Full changelog
