ReleaseNotes: |-
  - Working row — reasoning, tools, and mid-turn commentary collapse into one Codex-style Working / Worked row; the final answer stays outside.
  - Replace translation — each paragraph is covered by one plate before the translation is flowed in, so ghost text is gone and the repair model is not needed.
  - Web search — official Kimi search joins the provider list.
  - Chat window — an opt-in setting hides on close instead of destroying, so reopen skips a cold start.
  - Sidebar — drag to resize; conversation rows show last-active age (e.g. 2m / 13h).
  - Assistants — six built-in personas (product, legal, finance, teaching, review, career) and easier-to-scan cards.
  - External CLIs — Windows falls back to WSL when a local CLI is missing; one conversation stays on one native session; ACP agents such as Kimi get terminal methods; the official dsh key is written where the CLI actually reads it.
  - Performance — coalesced stream deltas, append-only crash drafts, smoother concurrent generations; Windows cuts idle WebView2 cost.
  - Fixes — Claude 4.5 sends extended thinking instead of adaptive; keep-alive settings drafts no longer clobber plugin MCP; CLI update progress survives switching agents.
