  新版本亮点 / What's New
  以下按功能整理 v2.9.8 → v2.9.9 的版本差异。This changelog covers the v2.9.8 → v2.9.9 release range, grouped by feature.
  原位替换翻译 / In-place translation
  - 排版与字号 / Layout and sizing — 改善中文断行、源行位置、字号适配和高分屏显示；修复额外换行导致过度缩字或遗漏尾句的问题。Improve Chinese wrapping, source-row positioning, font fitting and HiDPI rendering; prevent extra line breaks from shrinking text excessively or dropping its tail.
  - 表格与插画卡片 / Tables and illustrated cards — 识别局部单元格边界，分别处理标题、说明和正文；保留未变化的品牌文字，减少跨列重叠和插画遮挡。Respect local cell boundaries and separate headings, captions and body text; preserve unchanged brand lettering and reduce cross-column overlap and artwork erasure.
  - 大截图与背景 / Large captures and backgrounds — 提高带位置 OCR 的检测分辨率，改善大截图中的小字识别；改进渐变背景恢复和分隔线保护，减少灰色盖板与原字残留。Increase detection resolution for positioned OCR and improve small-text recognition in large captures; refine gradient restoration and separator protection to reduce gray patches and text residue.
  多代理协作 / Multi-agent collaboration
  - 主代理统筹 / Main-agent coordination — 重整协作模式，支持持久异步任务、定向跟进、结果等待和任务恢复，由主代理统筹各子任务。Rework orchestration around the main agent with durable asynchronous tasks, targeted follow-ups, result waits and recovery.
  - 任务详情与进度 / Task details and progress — 改善紧凑进度展示、任务面板和只读子代理对话；隔离内部回执与任务详情，并支持查看保存的工具输出。Improve compact progress, task controls and read-only sub-agent conversations; keep internal receipts and task details separate and expose saved tool output.
  视频输入 / Video input
  - 本地视频与辅助分析 / Local video and auxiliary analysis — 支持具备相应能力的 Kimi、Gemini 模型处理本地视频；主模型不支持视频时，可通过 Mixer 视频分析模型提供辅助理解。Support local video input for capable Kimi and Gemini models; use a Mixer video-analysis model when the main model cannot process video directly.
  聊天与性能 / Chat and performance
  - 阅读与搜索 / Reading and search — 将每轮工作过程归入可折叠区域，保持最终正文清晰可见；修复标题导航、转义字符和 Unicode 搜索匹配。Group each turn's work into a collapsible section while keeping final answers visible; fix heading navigation and escaped/Unicode search matches.
  - 加载与空闲资源 / Loading and idle resources — 减少侧栏遍历会话文件、重复会话加载和无效搜索，降低空闲资源占用并改善聊天响应。Reduce sidebar transcript scans, duplicate conversation loads and unnecessary search work, lowering idle resource use and improving responsiveness.
  - 模型与插件 / Models and plugins — 更新内置模型目录，并修复已启用的包插件在 MCP 中不可用的问题。Refresh the built-in model catalog and fix access to enabled package plugins through MCP.
  完整变更 / Full changelog: https://github.com/ZMGID/kivio/compare/v2.9.8...v2.9.9
