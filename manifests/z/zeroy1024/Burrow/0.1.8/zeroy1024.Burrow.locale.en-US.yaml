ReleaseNotes: |-
  Burrow 0.1.8 fixes terminal color-scheme dropdowns and separates network latency display, TCP keepalive, and optional SSH health checks.
  Changes
  - Fix the light, dark, and fixed terminal color-scheme dropdowns in Settings. Their control identity now stays stable across redraws, so the menu can open and retain its state.
  - Replace automatic SSH latency requests with passive TCP RTT statistics on macOS, Linux, and Windows. Reading latency sends no SSH requests and does not close a session when a value is unavailable. This removes the RouterOS-specific workaround and prevents the automatic request that caused the reproduced immediate disconnect.
  - Keep target RTT unknown (—) for SOCKS proxies, SSH jump hosts, and the built-in WireGuard stack. A proxy or first-hop socket's RTT is not presented as the final server's latency.
  - Use the existing keepalive interval for TCP keepalive, defaulting to 30 seconds. Add a separate SSH health check setting that is off by default, runs only after receive inactivity, and disconnects after three observed idle intervals without incoming SSH data. Ordinary incoming traffic resets the failure count; at most one request remains pending.
  - Preserve per-hop keepalive and health-check settings in SSH gateway snapshots and connection reuse decisions. Restore the GitHub runner's default APT sources for checks and Windows packaging.
  Configuration notes
  Existing profiles do not automatically enable SSH health checks. In Session → Advanced, TCP keepalive controls the available OS TCP socket; zero disables it. Tunnels retain their carrier's own policy, and WireGuard persistent keepalive remains a separate gateway setting. Enable SSH health check only for a server known to tolerate SSH health requests. Passive RTT is a kernel estimate and can retain an earlier value while the connection is idle. See monitoring.
  Validation
  - Commit checks passed for release commit fcb3031, including Go race tests and vet, license and secret checks, formatting and localization checks, Linux compilation, and Windows dual-architecture compilation.
  - Windows x64 and ARM64 installers passed CI packaging and extraction checks.
  - The macOS CI job could not obtain a hosted ARM64 runner; GitHub reported capacity constraints. The released DMG was built locally from tag v0.1.8 with the pinned toolchain and existing signing identity. Bundle version, license resources, strict code-signature verification, and hdiutil verify passed.
  - The maintainer confirmed the local macOS preview. A short live RouterOS check read passive TCP RTT and retained an interactive terminal with TCP keepalive enabled.
  Preview limitations
  - Native Windows installation, upgrade, uninstallation, and complete proxy/jump-path acceptance have not been performed in this release cycle. The short RouterOS check does not establish long-duration reliability or optional health-check fault-injection coverage.
  - macOS uses the project's fixed self-signed identity, without Apple Developer ID signing or notarization. Windows installers are unsigned and use UPX compression. See platform support and known limitations.
  Full changelog · Release source fcb3031
