ReleaseNotes: |-
  Burrow 0.1.8 修复终端配色下拉框，并将网络延迟展示、TCP 保活和可选 SSH 健康检测分开处理。
  本次更新
  - 修复设置页的浅色、深色和固定终端配色下拉框无法展开的问题。控件身份在重绘间保持稳定，菜单能够正常打开并保留状态。
  - macOS、Linux 和 Windows 的延迟展示改用被动 TCP RTT 统计。读取延迟不发送 SSH 请求，读不到数值也不会关闭会话；移除 RouterOS 特例，避免此前实机复现中导致连接立即断开的自动请求。
  - SOCKS 代理、SSH 跳板和内置 WireGuard 网络栈的目标 RTT 显示为未知（—），不将代理或第一跳套接字的延迟当作最终服务器延迟。
  - 原有保活间隔用于 TCP 保活，默认为 30 秒。新增独立的 SSH 健康检测设置，默认关闭，仅在未收到数据达到空闲时间后工作；连续三个实际检测到的空闲周期没有入站 SSH 数据才断开。普通入站流量会重置失败计数，至多保留一个未完成请求。
  - SSH 网关快照与连接复用判断保留各跳的保活、健康检测设置。提交检查和 Windows 打包恢复使用 GitHub runner 默认 APT 源。
  配置说明
  已有配置不会自动开启 SSH 健康检测。在会话 → 高级中，TCP 保活配置可用的系统 TCP 套接字，0 为关闭；隧道沿用承载连接自身的策略，WireGuard 持久保活仍是独立网关设置。仅对已确认兼容 SSH 健康请求的服务端开启 SSH 健康检测。被动 RTT 是内核估计值，连接空闲时可能保留较早的测量。详见监控说明。
  验证情况
  - 发布提交 fcb3031 的提交检查已通过，包括 Go 竞态检测测试与 vet、许可与秘密扫描、格式与本地化检查、Linux 编译以及 Windows 双架构编译。
  - Windows x64 和 ARM64 安装程序的 CI 打包与解包检查已通过。
  - macOS CI 未能分配到托管 ARM64 runner，GitHub 报告容量不足。本次发布的 DMG 使用 v0.1.8 标签源码、固定工具链及原有签名身份在本机构建，包内版本、许可资源、严格代码签名检查和 hdiutil verify 均已通过。
  - 本地 macOS 预览已经维护者确认可用。RouterOS 短时实机检查读取到了被动 TCP RTT，并在开启 TCP 保活时保持终端可交互。
  预览版限制
  - 本轮未进行 Windows 原生安装、升级、卸载及完整代理／跳板链路验收。RouterOS 短时检查不代表长时间稳定性或可选健康检测的故障注入验证已经完成。
  - macOS 使用项目固定的自签名身份，尚无 Apple Developer ID 签名或公证。Windows 安装程序未签名，使用 UPX 压缩。详见平台支持和已知限制。
  完整变更 · 版本源码 fcb3031
