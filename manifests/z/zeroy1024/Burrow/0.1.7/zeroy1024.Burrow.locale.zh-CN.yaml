ShortDescription: 原生 SSH 与文件传输桌面客户端。
Description: Burrow 是基于 Go、MyGo 与 Ghostty VT 构建的原生 SSH 与文件传输桌面客户端，支持多标签与组合分屏终端、密码、私钥、SSH agent 与跳板连接，以及 SFTP、FTP、FTPS 双面板文件管理与传输队列。它还内置 Linux 服务器状态监控、终端配色与加密凭据存储，以及带授权、策略拦截和操作审计的本机 MCP 服务。当前版本为开发预览版，安装程序未做代码签名。
