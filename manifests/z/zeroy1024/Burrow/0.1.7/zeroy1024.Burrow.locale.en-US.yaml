ReleaseNotes: |-
  Burrow 0.1.7 is a developer preview update focused on live MCP activity, server monitoring, and longer SSH commands.
  Changes
  - Add read-only AI session tabs that show each access key's commands, streamed stdout/stderr, file operations, and results. Closed tabs can be reopened from the audit details or tray panel.
  - Collect monitoring samples for each SSH connection with a connected terminal even when the status panel is closed. Pane footers show latency, CPU, memory, and network rates where supported.
  - Fix AI session cards after a failed transfer is retried: the original card now follows queued, running, and final states and clears the previous error.
  - Increase the default MCP ssh_exec timeout to 300 seconds, with a maximum of 1800 seconds (30 minutes). Update the enclosing tool and HTTP response deadlines and the tool's parameter description.
  - Remove retired Gitea workflows and unused code; GitHub Actions provides checks and release packaging.
  Validation
  - Commit checks passed on the release commit, including existing race tests, vet, secret scans, resource checks, and Linux/Windows compilation.
  - Packaging and content checks passed for macOS ARM64 and both Windows architectures. Downloaded installers matched their CI SHA-256 checksums.
  - Local release-source and Git-history secret scans passed.
  Preview limitations
  - macOS uses the project's fixed self-signed identity, without Apple Developer ID signing or notarization. Windows installers are unsigned and use UPX compression.
  - Native installation, upgrade, uninstallation, AI session visual acceptance, and a full 30-minute MCP command have not been tested in this release cycle. Existing tests and build checks do not establish those results.
  - See platform support and known limitations.
  Full changelog · Release source 1278ba9
