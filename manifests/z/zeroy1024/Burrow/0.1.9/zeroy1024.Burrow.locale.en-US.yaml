PackageIdentifier: zeroy1024.Burrow
PackageVersion: 0.1.9
PackageLocale: en-US
ShortDescription: Native SSH and file transfer desktop client.
Description: Burrow is a native SSH and file transfer desktop client built with Go, MyGo and the Ghostty VT engine. It provides tabbed and split terminal panes with password, private key, SSH agent and jump-host connections, dual-pane SFTP, FTP and FTPS transfer with a resumable queue, Linux server monitoring, encrypted credential storage, and a local MCP service with connection authorisation, policy interception and audit logging. This release is a development preview and the installer is not code-signed.
