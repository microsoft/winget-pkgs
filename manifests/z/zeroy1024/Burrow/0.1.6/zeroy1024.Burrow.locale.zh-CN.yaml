ReleaseNotes: |-
  English
  Burrow 0.1.6 is a developer preview update focused on session creation, deleting saved sessions, and automatic vault unlock.
  Changes
  - Fix a crash when choosing Quick add to SFTP… from an SSH host or Quick add to SSH… from an SFTP site. The target form opens with the copied connection settings.
  - Allow saved hosts and sites to be deleted after cancelling their related transfers. The confirmation shows affected tasks; deletion waits for cancellation, cleanup, and queue persistence. Transferred files and MCP audit history are retained.
  - Move automatic vault unlock to private local key files on all platforms. Existing macOS Keychain-backed vaults use their original key for a one-time migration; normal startup no longer accesses Keychain after migration.
  - Remove the LINUX DO community badge from both README files.
  Downloads

  | Platform                       | Installer                    |
  | ------------------------------ | ---------------------------- |
  | macOS Apple Silicon, macOS 13+ | burrow-0.1.6-arm64.dmg       |
  | Windows x64                    | burrow-setup-0.1.6-amd64.exe |
  | Windows ARM64                  | burrow-setup-0.1.6-arm64.exe |

  On macOS, open the DMG and drag Burrow to Applications. On Windows, run the installer for your architecture. SHA256SUMS contains checksums for all three installers.
  Upgrading
  An existing macOS vault may request authorization once to read its old Keychain unlock key. After a successful migration, quit Burrow normally and back up the entire app data directory, including vault-keys/. Old Keychain items and pre-upgrade backups are retained. See data and credentials.
  Validation and preview limitations
  - Commit checks passed, including existing race tests, vet, secret scans, resource checks, and cross-platform compilation. The checked source differs from the release tag only in CI mirror configuration.
  - Packaging and content checks passed for all three installers, rebuilt from the existing v0.1.6 tag after fixing CI mirror access. Downloaded files matched the CI checksums; the macOS DMG also passed a local integrity check.
  - Isolated local click checks covered both quick-add directions, first and subsequent target-page visits, the context and more menus, form rendering, and copied connection fields. Existing desktop tests and a full project build also passed.
  - macOS uses the project's fixed self-signed identity, without Apple Developer ID signing or notarization. Windows installers are unsigned and use UPX compression. Native installation, upgrade, and uninstallation of these release packages have not been tested in this release cycle. See platform support and known limitations.
  Full changelog · Release source b17f399

  简体中文
  Burrow 0.1.6 是开发预览更新，主要修复跨协议添加会话、删除已保存会话和凭据库自动解锁相关问题。
  本次更新
  - 修复 SSH 主机的**快捷添加到 SFTP…和 SFTP 站点的快捷添加到 SSH…**点击闪退的问题，目标表单会正常打开并预填连接设置。
  - 支持取消关联传输后删除已保存的主机或站点。确认窗口列出受影响任务，等待取消、清理和队列保存完成后再删除；已传输文件及 MCP 审计历史保留。
  - 所有平台的凭据库自动解锁统一使用私有本地密钥文件。原 macOS 钥匙串凭据库通过原密钥进行一次性迁移，迁移成功后正常启动不再访问钥匙串。
  - 移除中英文 README 的 LINUX DO 社区徽章。
  下载与安装

  | 平台                           | 安装程序                     |
  | ------------------------------ | ---------------------------- |
  | macOS Apple Silicon，macOS 13+ | burrow-0.1.6-arm64.dmg       |
  | Windows x64                    | burrow-setup-0.1.6-amd64.exe |
  | Windows ARM64                  | burrow-setup-0.1.6-arm64.exe |

  macOS 打开 DMG 后将 Burrow 拖入 Applications；Windows 运行对应架构的安装程序。SHA256SUMS 提供三个安装包的 SHA-256 校验值。
  升级说明
  原 macOS 凭据库可能需要一次性授权，读取旧钥匙串自动解锁密钥。迁移成功后，先正常退出 Burrow，再完整备份应用数据目录，包括 vault-keys/。旧钥匙串项目及升级前备份会保留。详见数据与凭据。
  验证与预览版限制
  - 提交检查通过，包含已有 race 测试、vet、秘密扫描、资源检查和跨平台编译。受检源码与发布标签仅有 CI 镜像配置差异。
  - 修复 CI 镜像访问后，从现有 v0.1.6 标签重建的三个安装包均通过打包与内容校验。下载文件均与 CI 摘要一致，macOS DMG 另行通过本地完整性验证。
  - 本地隔离点击验证覆盖两个快捷添加方向、首次及已访问目标页、右键与更多菜单、表单渲染及连接字段预填；已有 desktop 测试与全项目构建也已通过。
  - macOS 使用项目固定的自签名身份，尚无 Apple Developer ID 签名或公证。Windows 安装程序未签名，使用 UPX 压缩。本轮未测试这些发布安装包的原生安装、升级和卸载。详见平台支持和已知限制。
