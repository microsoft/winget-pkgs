ReleaseNotes: Burrow 0.1.2 是首个 GitHub 开发预览发行版。主要能力包括：SSH 多标签与组合分屏，支持密码、私钥、SSH agent 和跳板连接；SFTP / FTP / FTPS 双面板文件管理与传输队列，支持暂停、继续和离线恢复；Linux 服务器状态、终端配色、快捷键及加密凭据存储；本机 MCP 服务、连接与能力授权、拦截策略及操作审计。Windows 安装程序未做代码签名，包含对应架构的 EXE 与 Ghostty DLL，并使用 UPX 压缩。
