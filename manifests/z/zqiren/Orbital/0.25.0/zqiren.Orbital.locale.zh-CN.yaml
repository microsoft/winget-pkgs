PackageIdentifier: zqiren.Orbital
PackageVersion: 0.25.0
PackageLocale: zh-CN
PublisherUrl: https://orbital.top/
ShortDescription: 维护项目上下文、在多个编码智能体之间共享进展的项目智能体。
Description: |-
  Orbital 是一个项目智能体（project agent）。它维护项目上下文，保证项目中的所有智能体都能共享最新进展。
  它把活派给 Claude Code、Codex、Kimi Code，自己也能直接干活。
  每个智能体的产出、决定和踩过的坑都会整理成项目文件夹里的本地文件，下一个智能体接手时不必再解释一遍。
