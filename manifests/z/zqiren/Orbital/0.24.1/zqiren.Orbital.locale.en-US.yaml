ShortDescription: Project agent that keeps your project context shared across coding agents.
Description: |-
  Orbital is a project agent. It maintains your project's context so every agent working on it shares the latest progress.
  It hands work to Claude Code, Codex and Kimi Code, and it can do the work itself.
  Every agent's output, decisions and lessons become plain local files in your project folder, so the next agent picks up the work without you re-explaining the background.
