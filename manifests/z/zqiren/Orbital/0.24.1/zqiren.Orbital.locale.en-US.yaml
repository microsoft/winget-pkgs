ReleaseNotes: |-
  Orbital v0.24.1
  A small follow-up to v0.24.0. If you are on v0.24.0, this is the first release you can install with one click: use the Update to v0.24.1 pill at the bottom left.
  New
  - A custom provider can use the OpenAI Responses API. In the Custom provider form, the SDK list now has OpenAI Responses next to OpenAI-compatible and Anthropic, for gateways that only serve /v1/responses.
  Fixes
  - MiniMax M3 on OpenCode Go recorded zero input tokens, so its spend was under-reported. Input and cached tokens are now counted.
  - With the session column folded, the project settings and right panel buttons were out of reach. Both now sit on the folded rail.
  - Test Connection on an edited custom provider tested the saved endpoint and protocol instead of the ones on screen.
  Install
  - From v0.24.0: click the update pill. On Windows, approve the administrator prompt when it appears. If the update does not complete, download the installer below and run it over the existing install; your projects are kept.
  - macOS (Apple Silicon, macOS 13+): Orbital-0.24.1-macOS.dmg, signed and notarized.
  - Windows 10/11: Orbital-Setup-0.24.1.exe. The installer is not code-signed yet, so SmartScreen shows Windows protected your PC: click More info → Run anyway.
  Known issues
  - On Windows, the last step of the one-click update (after the administrator prompt) had only been run in automated tests before this release. Please report what you see.
  - gpt-6.2-sol and gpt-6.2-astra on an OpenAI key have not been tried against OpenAI itself; the Responses path was tested through OpenCode Go.
  - A custom provider pointed directly at OpenCode Go is refused (it needs a session header); use the built-in OpenCode Go provider.
  - gpt-6-luna sometimes finishes a task without writing its answer in the chat.
  - The Workbench is in beta. Intel Macs are not supported. The Windows installer is unsigned.
