ReleaseNotes: |-
  v0.24.1 中文摘要
  v0.24.0 的小幅跟进版本。如果你在用 v0.24.0，这是第一个可以一键安装的版本：点击左下角的 更新到 v0.24.1。
  新功能
  - 自定义模型可以使用 OpenAI Responses API。 自定义模型表单的 SDK 列表里，在 OpenAI 兼容和 Anthropic 之外新增 OpenAI Responses，适用于只提供 /v1/responses 的网关。
  修复
  - OpenCode Go 上的 MiniMax M3 输入 token 记为 0，花费被低估。现在输入和缓存 token 都会计入。
  - 会话栏折叠后，项目设置和右侧面板按钮点不到。 两个按钮现在保留在折叠后的窄边上。
  - 编辑自定义模型后点击测试连接，测试的是已保存的地址和协议，而不是表单里当前填写的。
  安装
  - 从 v0.24.0 升级： 点击更新按钮。Windows 上出现管理员确认时请允许。如果更新没有完成，下载下面的安装包覆盖安装即可，项目会保留。
  - macOS（Apple 芯片，macOS 13 及以上）：Orbital-0.24.1-macOS.dmg，已签名并经过公证。
  - Windows 10/11：Orbital-Setup-0.24.1.exe。安装包暂未签名，SmartScreen 会提示「Windows 已保护你的电脑」，点击 更多信息 → 仍要运行。
  已知问题
  - Windows 上一键更新的最后一步（管理员确认之后）在本次发布前只在自动化测试中运行过。遇到问题请反馈。
  - 使用 OpenAI 密钥的 gpt-6.2-sol 和 gpt-6.2-astra 没有直接对 OpenAI 测试过；Responses 接口是通过 OpenCode Go 验证的。
  - 自定义模型直接指向 OpenCode Go 会被拒绝（需要会话请求头）；请使用内置的 OpenCode Go。
  - gpt-6-luna 有时完成任务后没有在对话里写出答案。
  - Workbench 仍为测试版。不支持 Intel Mac。Windows 安装包未签名。
