ShortDescription: Lightweight instant replay for Windows.
Description: |-
  Ombra keeps the last minutes of your screen and sound in a rolling buffer, encoded on an NVIDIA or AMD GPU or on the CPU. One key turns the buffer into a clip, and the overlay lets you watch and trim it without leaving the game.
  A native app of about 5 MB, open source, with no account.
