ReleaseNotes: |-
  Built from nx2 2eb5f08. Build 150 was 17baed7. That's 30 merged changes.
  New look. Lichii now opens in the new Lichii Dark theme, and a short What's new window explains what moved. You can reopen it from Help → What's New, and the old themes are still in the settings.
  Big fixes
    - Yoshi and the Mysterious Book: the 3D world renders. Three shader forms the game uses were rejected, which left the world black. Built on ggonzalospineli-ops' #1189 and FrsrG's #1284, with ALD/OUT from MythosOfs (#1363).
    - The Duskbloods network test: boots to its menus. It no longer aborts on memory, and its shader forms are supported. By cerroverb (#552, #851). It still stops at its online checks. It also always uses reactive flushing, gets the DLSS replacement (#828, #637), and has a 3D colour-target clear fix (#638).
    - Ocarina of Time: the guard house freeze is fixed by a built-in Texture Pool x2 patch (#1313).
    - Mario Kart World: characters and karts are lit correctly. Read-only compute bindings are sized from their size word (#1333).
    - No more crash when antivirus deletes nxformat.dll. nxformat 1.0.3 is now built into Lichii. Converting an XCI to NX also keeps its update partition. By fab918 (#1232).
  New features
    - New UI: Lichii Dark. It has icons throughout. Settings dialogs now fit the screen at any scale, and every tab scrolls. A per-game setting you changed gets a pink outline and a reset button. The game list shows folder game counts, full title IDs and favourite stars. Grid and carousel get their own 160 px cover size (#1365, #1371).
    - Native HDR output with HDR10/scRGB passthrough and an Off/Auto/On setting (#1326).
    - LAN play for local-wireless games: Configure → Network → LAN play, off by default (#1359).
    - Frame stats overlay redesign. A big fps number, CPU and GPU %, and a 5-second frame-time graph. It's still movable (#1345).
    - Mario Kart World dynamic FPS skips the game's own second-vblank wait (#1332).
  Performance
    - Shader stutter cut down a lot. Pipelines are kept up to a RAM limit instead of 9,000 frames, and an evicted pipeline is rebuilt from its kept SPIR-V instead of being translated again. Revisiting an area went from 360–770 ms hitches to about 55–75 ms. There's also an option to build all cached shaders at boot (#1334, #1337).
    - Less shader compilation work (#1320).
    - CPU: plain loads for LDAR/LDAPR/LDAXR and no barrier for DMB LD/ST on x86, each processor's exclusive reservation on its own cache line, and no empty submits in FlushCommands (#1327, #1331, #1329, a port of Fritchii EXP61). The GPU front/back cache lines are split too (#1332).
    - 3D state registers are written in one call (#1095).
  Crash and stability fixes
    - AMD: device memory overallocation is allowed (#1335).
    - Textures over the texel limit that fit in 1 GiB now get backed, which fixes Metroid Prime 4 NS2 Edition (#1325).
    - Looping timers measure their lateness from the end of a pause (#852).
    - The previous log is no longer lost when log rotation fails (#889).
    - Pokémon Pokopia: the furniture-guide shader clamp is folded correctly, ported from Eglantine #781 (#1347).
    - Fixes for the built-in profiler (#1349) and quieter network logs (#1384).
