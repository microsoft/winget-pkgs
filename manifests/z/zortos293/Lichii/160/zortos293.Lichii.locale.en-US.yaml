ShortDescription: Nintendo Switch 2 Emulator
Description: |-
  Lichii is an experimental, open-source Nintendo Switch and Switch 2 emulator written in C++.
  It builds on Eglantine, Eden, yuzu and Sudachi, preserving their contributions while developing this fork's game compatibility and renderer fixes.
