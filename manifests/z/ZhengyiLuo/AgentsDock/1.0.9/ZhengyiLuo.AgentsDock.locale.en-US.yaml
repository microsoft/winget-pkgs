Description: AgentsDock is an open-source IDE for agentic AI research that unifies Claude Code, Codex, and other coding agents in a single workspace across desktop and mobile. It connects to multiple servers such as lab workstations and GPU boxes, offers code viewing and editing with syntax highlighting, persistent tmux terminal access, and inline viewing of agent outputs like plots, images, and rollout videos.
