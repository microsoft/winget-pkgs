ReleaseNotes: 'Quiet Team Network Mail and Bulletin indicators share one metadata-only connection. Refresh stays explicit: no inbox polling, automatic feed fetches, view switching, or draft changes. Bulletin revisions and deletions notify without duplicating Mail. Includes cross-chat timeline lifecycle regression coverage. Use AgentsServer 1.0.0-beta.3 for the Chats stdin reply fix, canceled-retry receipts, and Bulletin notifications. No automatic server restart. macOS signed and notarized; Windows remains an unsigned beta preview. Stable and mobile channels unchanged.'
