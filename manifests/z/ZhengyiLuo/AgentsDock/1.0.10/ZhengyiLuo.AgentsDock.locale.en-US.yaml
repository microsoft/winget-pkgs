ReleaseNotes: |-
  AgentsDock 1.0.10 pairs the desktop app with the signed AgentsServer runtime and the short agentsdock CLI.
  Includes the macOS named-service stop/start correction and stable npm publication checks. macOS packages are signed and notarized. The Windows installer is unsigned and may show a security warning.
  Validation: exact-package CLI lifecycle checks passed on macOS and Linux; the sealed desktop assets passed native verification on macOS, Windows x64, Linux x64 and Linux ARM64.
  Documented testing limits: populated provider-history migration, active/queued work during upgrade, logout/reboot survival, and the native Windows updater have not been validated for this cut. These are untested boundaries, not claims that those workflows fail. The scoped test reports retain their original limitations.
