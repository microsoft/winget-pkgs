ShortDescription: A tiny always-on-top window that follows MLB games.
Description: |-
  Basesmall keeps a live MLB game in a corner of the screen, drawn as a few pieces in team colours: runners, the count, the outs, the score, where each pitch crossed the zone and where the ball went. It follows your team, shrinks to a pill with just the score, and replays games from 2023 on without spoilers.
  It reads MLB's public Stats API from your own computer; no account and no server. Unofficial fan project, not affiliated with MLB.
