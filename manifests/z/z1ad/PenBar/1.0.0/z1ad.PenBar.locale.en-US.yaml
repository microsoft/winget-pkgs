ShortDescription: Floating pen toolbar and handwriting pad for Windows tablets and 2-in-1s.
Description: |-
  PenBar is a floating toolbar and handwriting pad for using Windows 11 tablets and 2-in-1 laptops with a pen.
  Write on the pad and the text is typed into the current app, with word-by-word undo and redo, palm rejection,
  one-tap Undo, Redo, Copy, Paste, Backspace, Tab, Enter, Last App, Task View and Screenshot buttons,
  docking to any screen edge, and automatic minimizing when the keyboard is attached.
