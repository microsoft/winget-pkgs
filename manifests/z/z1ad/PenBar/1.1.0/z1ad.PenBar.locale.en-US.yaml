ShortDescription: Pen toolbar, handwriting pad, swipe keyboard and dictation for Windows tablets and 2-in-1s.
Description: |-
  PenBar is a floating toolbar for using Windows 11 tablets and 2-in-1 laptops without a keyboard.
  Write on the handwriting pad and the text is typed into the current app, with word-by-word undo and redo.
  One tap swaps to PenBar's keyboard, with swipe typing, word suggestions, accents, symbols, F keys,
  arrows and sticky Ctrl, Alt and Win keys. A Dictate button starts voice typing.
  One-tap buttons cover Undo, Redo, Copy, Paste, Backspace, Tab, Enter, Last App, Task View and Screenshot.
  The bar docks to any screen edge, horizontally or vertically, with or without labels, and minimizes
  when a keyboard is attached.
