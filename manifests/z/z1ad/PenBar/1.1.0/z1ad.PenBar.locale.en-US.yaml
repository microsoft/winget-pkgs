ReleaseNotes: |-
  New PenBar keyboard with swipe typing, word suggestions, accents, symbol and F-key pages, and sticky Ctrl/Alt/Win.
  One-tap swap between handwriting and keyboard, a Dictate button, left-edge docking, labels on/off,
  a resizable dark pad, automatic palm rejection and tooltips.
