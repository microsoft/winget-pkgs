ReleaseNotes: "## Misc Changes\n• \"Open Spotify Links in Spotify App\" is now always visible, rather than hiding when Spotify is not installed.\n  • The check for whether Spotify was installed was unreliable.\n  • Now if the option is checked and Spotify is not installed, Windows will display a warning saying the app could not be found.\n• New History entries and changes to API key are now saved during runtime\n  • Originally, they were only saved when the app was closed, resulting in lost data if the app ever crashed/was force closed by the OS.\n• Settings now use a more robust \"backup\" system.\n  • When settings are successfully loaded they are also copied into a `config.json.bak` file.\n  • If for any reason the app fails to load `config.json`, the .bak file will be used instead if it exists.\n  • This means you will lose at most one session of data in the case of a bad save.\n• Version number is now displayed in the title\n<img width=\"300\" alt=\"image\" src=\"https://github.com/user-attachments/assets/a9215c5e-cc1e-4153-846f-fa5d020e0b5e\" />\n\n## Crash/Bug Fixes\n• Fix settings not saving when WhatAmIHearing is shut down by the OS (Shutting down, logging off, etc.)  (Thanks to @Countbleck653 for finding)\n• Fix special characters in artist or song name resulting in incomplete searches when opening in YouTube or Spotify. (Thanks to @remd for finding, @mikitaserabrakou for fixing)\n\n## Self-Contained Version\nFor those who don't want to install the .NET runtime in order to use the app, I've attached a self-contained version which includes the .NET runtime alongside it. However, this version may have some performance issues when compared to the normal version.\n\n## Winget\n\n> [!CAUTION]\n> v4.1 is not yet live on Winget\n\nIf you installed with `winget` you can update with the following command.\n```\nwinget upgrade zemoto.WhatAmIHearing\n```"
