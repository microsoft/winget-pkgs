ShortDescription: Install and update the official ChatGPT Windows desktop app directly from OpenAI's CDN, without the Microsoft Store.
Description: |-
  An open-source, client-side helper that downloads the official ChatGPT desktop MSIX package straight from OpenAI's CDN (x64 / ARM64), resumes interrupted downloads, verifies the Authenticode signature, publisher, issuer and package identity locally, and installs or updates it with Add-AppxPackage. Useful where the Microsoft Store is unavailable, blocked or lags behind the official release. Optional daily update checks via a per-user scheduled task. Not affiliated with OpenAI or Microsoft.
