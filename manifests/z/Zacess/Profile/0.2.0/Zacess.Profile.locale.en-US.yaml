ShortDescription: One accessibility profile for every app, checked for contrast and colour vision
Description: zprf reads a small TOML profile of reading needs (a contrast floor, a font and size, reduced motion, cursor size, spacing and line length), derives any colour it leaves out, checks every pair against WCAG 2.2 and simulated colour vision deficiencies, then writes config files for Ghostty, kitty, WezTerm, Alacritty, tmux, Neovim and VS Code.
