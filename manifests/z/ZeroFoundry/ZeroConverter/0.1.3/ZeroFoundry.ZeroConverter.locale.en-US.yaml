ShortDescription: Rename a file in Explorer and it converts. Offline converter for images, audio, game textures and video.
Description: |-
  ZeroConverter is a free, open-source file converter for Windows. While it runs, renaming clip.mp4 to clip.mp3 (or photo.png to photo.webp, texture.png to texture.dds) in File Explorer converts the file for real, and the original goes to the Recycle Bin.
  It also has a right-click menu, an app window for batches and a command line tool. It handles images, audio, HDR, game textures (DDS, KTX2) and, through FFmpeg, video. Everything runs on your PC: no account, no uploads, no telemetry.
