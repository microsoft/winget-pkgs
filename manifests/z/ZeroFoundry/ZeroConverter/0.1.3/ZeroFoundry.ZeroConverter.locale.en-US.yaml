ReleaseNotes: |-
  - Download FFmpeg works again: when the pinned build is gone, the app downloads the current LGPL build and checks its SHA-256.
  - Renaming many files at once no longer shows false warnings or a pile of cards.
  - Renames made with PowerToys PowerRename are recognised in added folders.
  - A cut-off video no longer converts into a shorter file, and two files with the same name in one batch no longer overwrite each other.
