ShortDescription: Self-hosted systems language and compiler for machine-learning workloads
Description: MLRift is a self-hosted, zero-dependency compiler forked from KernRift. The package installs two portable command-line tools — mlrc (the compiler) and mlr (the fat-binary runner). It compiles to native x86_64 and ARM64 binaries for Linux, Windows, macOS, and Android, extends the IR backend with ML-specific primitives (tensors, event streams, sparse CSR ops), and includes a native AMDGCN GPU backend that talks to /dev/kfd directly with no ROCm dependency.
