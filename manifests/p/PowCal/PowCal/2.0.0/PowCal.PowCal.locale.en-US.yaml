ReleaseNotes: "### Highlights\r\n• **Custom categories** – set up your own keywords and icons for categorizing events, configurable via an AI agent\r\n• **Better Time Insights** – over all your calendars, not just your primary one, also by calendar or category, and on personal Google accounts too\r\n• **Inbox actions** – respond to invitations or report one as spam straight from the inbox\r\n• **Grouped birthdays** – same-day birthdays show as one event listing everyone, unless you turn it off\r\n• **Browser integration** – our extension routes Google Calendar links and calendar files from your browser or email to PowCal\r\n\r\n### Also in this release\r\n\r\n#### Added\r\n• A \"Category Icons\" setting to show icons on all events, on all but other people's calendars, or never\r\n• Expand shortcuts to title prefixes via auto-complete when creating or editing an event, configurable via an AI agent\r\n• Auto-fill calendar, color, availability, visibility and reminders by category or attribute when creating or editing an event, configurable via an AI agent\r\n• Let color labels apply certain attributes to their events automatically, configurable via an AI agent\r\n• Show or hide the world clock and the mini calendar from the \"Customize Sidebar\" menu\r\n• Add a third time zone in Google Calendar's settings – it shows while you hold Shift, like your second one\r\n• Moving an event of your own series to another day offers \"All events\" too, shifting the whole series\r\n• Birthday details show the person's age, where the birth year is known\r\n• After you respond to an invitation in the calendar, an unanswered one right below or above it opens next\r\n• Respond to an invitation straight from its desktop notification\r\n• A desktop notification when an organizer cancels an event or removes you from it\r\n• A warning when people your calendar is shared with can't open an event's attachments\r\n• Settings sync now runs through your own Google Drive, with a new switch in Settings to turn it off\r\n• Anonymous error reports and usage statistics can be turned off in Settings\r\n• The weather on day headers can be turned off in Settings, and for privacy its lookups now round locations to about 1 km\r\n\r\n#### Improved\r\n• Smarter categorization, with a matching icon for working locations you've named yourself\r\n• Auto-filling from similar events now also sets visibility, availability and a category you picked by hand\r\n• A recurring invitation you've declined as a whole no longer shows when \"Show declined events\" is on\r\n• The inbox shows the same titles and icons as your calendar, and senders by the names in your contacts\r\n• The inbox explains when Google Calendar's settings keep some invitations off your calendar\r\n• Spam detection catches more scam invitations\r\n• \"Highlight weekends\" now also works in Schedule view and search results\r\n• The sidebar's \"Birthdays\" calendar grays out while none of your contacts has a birthday saved\r\n• \"Go to date\" understands more date formats\r\n• Smoother calendar file imports, without a page reload\r\n• Google Calendar loads using less memory\r\n• On macOS, sign-in windows link to your browser's password manager\r\n• From the next version on, updates download only what changed, in the background\r\n• Event titles wrap more evenly\r\n• Time labels scroll smoothly along with the calendar\r\n• Various visual refinements\r\n\r\n#### Fixed\r\n• Moving an event past its series' end with \"This and following events\" no longer loses the rest of the series to a Google Calendar bug\r\n• Changing the calendar when creating or editing an event no longer loses its color label\r\n• End time dropdowns now show the right durations on all quarter-hour steps\r\n• Options in the event creation dialog no longer miss the first click after you change the title\r\n• The back arrow and title no longer disappear or sit out of place when creating or editing an event\r\n• Buttons on reminder desktop notifications now work, and an event's second reminder no longer makes both disappear\r\n• All-day invitations no longer keep the inbox from opening, or show the wrong day in desktop notifications in some time zones\r\n• Marking a recurring invitation as \"Not spam\" now brings back all of its events\r\n• Times in the inbox, desktop notifications and task details now follow your 12- or 24-hour setting\r\n• \"Join with Google Meet\" opens with the event's account on every click, not just the first\r\n• Event details now show the color label on every labeled event\r\n• \"Mark private events\" switched off now also hides the lock icon in Schedule view\r\n• Events you can only see as busy on someone else's calendar show \"busy\" instead of \"(No title)\"\r\n• When \"Only Show Overdue Tasks\" is turned on, the \"Pending tasks\" count no longer includes overdue tasks you deleted\r\n• Navigating the calendar with a swipe or a held arrow key no longer skips several weeks or months at once\r\n• After Google Calendar updates, the world clock shortens city names again\r\n• Time zone labels in Google Calendar's settings are no longer limited to 7 characters\r\n• Weather on day headers no longer goes missing for typed-in locations or on days without any location\r\n• Enter in PowCal's dialogs now does only what the focused button says\r\n• Tabs no longer load twice at startup\r\n• Sign-in windows can no longer start flickering when you bring PowCal to the foreground\r\n• On macOS, declining to associate calendar files with PowCal no longer brings the question back at every launch\r\n• On Windows, automatic updates now work properly"
