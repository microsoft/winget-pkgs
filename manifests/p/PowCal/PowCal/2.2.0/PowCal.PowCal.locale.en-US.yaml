ReleaseNotes: |-
  ### Highlights
  • **Invitations at a glance** – see who invited you and when, and which calendar an invitation is on, with a bar at the top when editing
  • **Making changes to invitations** – only what you changed is highlighted, and you can save your edits to all events of a series or "Save & propose" a new time
  • **Private category picks** – categories you pick are stored invisibly unless a tag you typed sets them, no longer as a hashtag guests see
  • **New event categories** – Mind & Body, Delivery, Repairs and Cleaning
  • **Time zones and world clock in sync** – the world clock in the sidebar sets itself up from your time zones and follows your additional ones until you edit it

  ### Also in this release

  #### Added
  • Hovering the time column shows a globe icon for your time zone settings
  • Moving an event to another calendar warns if you or the old calendar's owner would stay invited, offering "Move without me"
  • When you open an event, hovering its calendar icon shows when it was created and last updated
  • A "Transfers" tab in PowCal's inbox lists your open "Change owner" offers

  #### Improved
  • The "Notifications" button in the header is now "Inbox", with a tray icon instead of a bell
  • Creating or editing an event looks tidier, with various visual refinements
  • Editing tasks, focus time, out of office or working locations gets extras like the end lock
  • Tags like `[Lunch]` or `#gym` are highlighted in the title too while editing
  • More events land in the right category – tags win more often, "(tbd)" marks events tentative
  • Invitations received via the Luma event platform show a Luma icon and their host's name
  • Translations read more naturally, in Google Calendar's own words
  • PowCal can update itself to a new version while you're away, and big updates wait out a mobile or limited data connection
  • Various visual refinements and smaller improvements

  #### Fixed
  • Short world clock names and weather for hand-typed locations are back after Google Calendar updates
  • Responding from the inbox while offline no longer fails silently
  • Moving a series to another day with "All events" can no longer delete its earlier dates
  • Fewer series moved with "This and following events" get cut short by a Google Calendar bug
  • Weather no longer takes its city from a colleague's trip, a room booking or a half-typed event
  • The calendar no longer jumps as you navigate, or when holidays or other all-day events load late
  • Switching tabs no longer shifts the calendar when their all-day sections differ in height
  • Editing an event no longer cuts off the page's edges, like the title with the side panel open
  • Clicking the repeat option when creating an event no longer opens the time zone dialog
  • Google Calendar's "Empty trash?" dialog no longer shows a wrong title and a "Save" button
  • Outlook invitations show their description cleanly, with working links and no sender images
  • Seen invitations stay seen after a restart or an organizer's "This and following events" change
  • CSV exports no longer skip a primary calendar you never renamed, and use your time zone, not UTC
  • The calendar no longer freezes when Google's servers fail, and slow connections no longer bring up sign-in windows
  • PowCal's sign-in and progress windows no longer jump in front of other apps
  • Smaller fixes in the inbox, desktop notifications, imports, CSV exports and Time Insights
