ReleaseNotes: "### Highlights\r\n• **Private badge** – events set to private now show a marker in the corner, with the guest badge outlined to match, and each badge gets a switch in the view menu\r\n• **Event attributes** – mark an event Tentative, Alongside or Transit directly in the category menu, without typing anything into the event yourself\r\n• **Working location presets** – when you add a working location, PowCal suggests the city you'll be in that day, worked out from your other events and travel\r\n\r\n### Also in this release\r\n\r\n#### Improved\r\n• Smarter event categorization – more keywords across a dozen categories, narrowed where they matched too eagerly, and matching that copes with umlaut spellings, accents and unusual lettering\r\n• Auto-fill – the calendar and color are filled in one step, instead of flickering through other options on the way\r\n• Google Calendar's wording for a private event is now the same everywhere you see it\r\n• Location suggestions – accents, punctuation and spacing no longer have to match exactly\r\n• The time zone suggestion dialog for a location opens faster\r\n• Event layout – an overlapping event no longer hides one that starts later, events keep their full width next to a narrowed neighbor, and the gaps left by hidden calendars close up\r\n• Time ranges – one consistent dash and spacing style in every language\r\n• Inbox – invitations and spam are sorted by date, and recurring invitations collapse into a single row, so one weekly series no longer fills the list, the badge and your notifications\r\n• Various visual refinements, including dialog surfaces and purple interface colors in dark mode\r\n\r\n#### Fixed\r\n• Invitations no longer go missing from the inbox, and notifications no longer arrive twice\r\n• PowCal no longer bogs down when several tabs refresh their inbox at once\r\n• Tabs no longer stay blank when a page never finishes loading\r\n• A click that lands on a dialog just as it appears is ignored, so you can't hit a button you never saw, and menus no longer close themselves when auto-fill runs\r\n• Hiding tasks in the denser views now takes effect as soon as you switch view"
