ShortDescription: Self-hosted daemon for Claude Code, Codex, Copilot, OpenCode, and Pi. Agents run on your machine with your full dev environment. Connect from phone, desktop, or web.
Description: One interface for Claude Code, Codex, Copilot, OpenCode, and Pi agents. Run agents in parallel on your own machines, from your phone or your desk. Paseo runs a local daemon that manages your coding agents; the desktop app, mobile app, web app, and CLI all connect to it. Agents run on your machine with your full dev environment, using your tools, your configs, and your skills. Paseo does not use telemetry, tracking, or forced log-ins.
