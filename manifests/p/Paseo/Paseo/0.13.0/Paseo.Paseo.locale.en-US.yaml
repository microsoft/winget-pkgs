ReleaseNotes: |-
  0.13.0 - 2026-10-24
  Foldable phone layouts, agents that delegate work to other machines, plugin file panels, and plugin translations.
  Connect your daemon to another machine, then ask an agent to delegate work there:
  paseo host add 192.168.1.20:6767 --label studio
  paseo host add 'ssh://me@build-box' --label build-box
  paseo host add 'relay://...' --label laptop
  Added
  - Added support for foldable phones such as iPhone Duo, which switch to the wide layout when unfolded (#7424, #7705)
  - Added connected hosts, so agents can create, prompt and monitor agents on other machines and see them in the Subagents track (#7370, #7593)
  - Added paseo.sh in Simplified Chinese at paseo.sh/zh-CN (#7373)
  - Added All changes to the Changes pane as the default, showing committed and uncommitted work since the branch base in one diff (#7576)
  - Added Implement with Auto mode to Claude plan approvals when Auto was on before Plan (#7453)
  - Added pasting images and dropping files into terminals, so agent TUIs such as Claude Code and Codex can read them, including on remote hosts (#3795 by @gerardbalaoro)
  Improved
  - Changed sidebar workspaces to sort by Created, with Last prompt and Manual under Display → Sort (#7635, #7771)
  - Changed long project groups in the sidebar to show seven workspaces plus any that need attention or are working, with Show more for the rest (#7635)
  - Changed Command Center agent and workspace results to show the same icons and status as tabs and the sidebar (#7690)
  - Changed Manual metadata generation to use only the models you chose, without falling back to the defaults (#7611)
  - Changed the Host field on New workspace to always show, with Add host at the end of its menu (#7580)
  - Changed Explorer to use the same tabs and launcher on phones, tablets and desktop (#7424)
  - Changed Explorer tabs on phones to keep full labels and scroll, with Close moved to the long-press menu (#7589)
  - Changed relay connections to require the daemon password when the daemon has one; re-add relay hosts saved without it (#7668 by @nickmaglowsch)
  - Kept the sidebar open on phones when you cancel Search, Import session or Add project (#7693)
  - Updated pinned ACP agents to their latest releases (#7781 by @JunWeiUp, @LouisDeconinck)
  - Removed the legacy terminal renderer; iOS and Android always use the native terminal renderer (#7639)
  - Changed usage rows to say whether a percentage is used or remaining, in the app's language (#7376 by @michaelmwu)
  - Changed an agent's report and its finish notification to reach the parent agent as one message (#7561)
  - Stopped sending workspace setup output to apps that are not showing that workspace's Setup panel (#7407, #7473)
  - Paused status ring animations inside hidden panels on iOS and Android (#7423 by @peterkeen)
  - Reduced app startup work by loading only the selected language's translations (#7410 by @colonelpanic8)
  - Removed repeated workspace layout saves when nothing changed (#7358 by @colonelpanic8)
  Plugins
  - Added file panels, so a plugin can open matching files in the file tab, such as a PDF viewer or a rich Markdown editor (#7411, #7366, #7614)
  - Added useTabState for per-tab panel state that survives reloads, and addAgentPanel; workspace, agent and file panels share the workspaceId, params, revision and tab props (#7685)
  - Added plugin translations, so plugin content and labels follow the app's language (#7478)
  - Added translated plugin listings through translations in paseo-plugin.json and OVERVIEW.zh-CN.md (#7373)
  - Added Markdown to @getpaseo/plugin/client/ui to render Markdown with Paseo's renderer (#7579)
  - Added inline SVG and component icons to every plugin icon (#7368)
  - Changed every plugin UI import to @getpaseo/plugin/client/ui; the previous entry point, including useRevealedText, still works and is deprecated (#7474, #7780 by @luoph, @RRD-dev, @mcowger)
  - Deprecated the panel context and agentId props and addWorkspacePanel's context field; use params.agentId and addAgentPanel (#7685)
  - Changed turn-ended hooks to send an empty timeline; fetch recent history with timeline.refetch instead (#7477)
  - Fixed plugin header buttons missing on phones and narrow windows; they now appear in the workspace ··· menu (#7630)
  - Fixed reopened ACP plugin agents showing an empty chat (#7717 by @nistream)
  - Fixed notification timeline transformers failing to load with "invalid item type: notification" (#7582 by @Gavinchen92)
  Fixed
  - Fixed agents showing as running after a daemon restart (#7573)
  - Fixed parent agents never hearing from notifyOnFinish children after a daemon restart (#7683)
  - Fixed opening a large Claude session showing an empty chat or crashing the daemon (#7431 by @ZouYusheng)
  - Fixed Import session crashing the daemon with large Claude histories (#7626 by @lanej)
  - Fixed hosts staying in Error when the direct connection drops instead of switching to a saved relay connection (#7616 by @3ae3ae)
  - Fixed tapping a notification opening a stale workspace on iOS, and Android reopening the notification's agent on every app reopen (#7612 by @kassamkhoja)
  - Fixed sidebar PR status and checks disappearing after the app reconnects (#7638)
  - Fixed workspace diff stats and merged-PR auto-archive missing updates while no app was showing the workspace (#7681)
  - Fixed the / and @ picker on iPhone covering the composer and hiding its best match behind the keyboard (#7679 by @masz77)
  - Fixed reopening a workspace marked unread on a phone leaving its agent stuck loading (#7608)
  - Fixed a new workspace's pin or title disappearing from the sidebar until the next update (#7758 by @stv1024)
  - Fixed Claude background command notifications appearing twice after a daemon restart (#7737)
  - Fixed voice replies skipping later sentences with OpenAI-compatible speech servers (#7756 by @grueneisfabian)
  - Fixed Cursor usage showing bonus spend as overage instead of the quota percentages (#7778 by @kbitz, @stackia)
  - Fixed the Android tablet taskbar covering the sidebar's Add project, Hosts, Help and Settings (#7768)
  - Fixed Command Center jumping back to the selected result while you scroll (#7688)
  - Fixed Claude system context appearing as an assistant message in imported or restored chats (#7590 by @khevamann, @rogerluan)
  - Fixed saved workspace tabs being lost when leaving or reloading the app right after it loads (#7547)
  - Fixed relative links in Markdown preview resolving from the workspace root instead of the document's folder (#7538)
  - Fixed Add image failing with "Failed to select image" on Android after changing the font size (#7546 by @RRD-dev, @idoyana, @luoph)
  - Fixed popovers, tooltips and context menus on Android opening one status bar below their trigger (#7589)
  - Fixed the active Explorer tab being invisible in the light theme (#7589)
  - Fixed Android showing "Host not found" for untrusted certificates, and TLS advice for hostnames that don't resolve (#7429, #7701)
  - Fixed the keyboard covering focused Settings fields on Android (#7362)
  - Fixed Pull or Push appearing twice in the compact Changes menu (#7355 by @az33zy)
  - Fixed Jump to tab and Jump to workspace saving shortcuts that don't end in a number (#7365)
  - Fixed paseo agent archive reporting AGENT_NOT_FOUND for agents beyond the first 200 (#7535 by @L4XB, @hteo1337)
  - Fixed archived agents reappearing in MCP list_agents after their history was read (#7532 by @thomasvan)
  - Fixed detached agents created with notifyOnFinish never notifying their creator (#7528 by @thomasvan)
  - Fixed OpenCode agents being told notifyOnFinish defaults to off (#7383 by @gszep)
  - Fixed Pi subagent rows staying running when a resume is refused (#7369)
  - Fixed Android source builds downloading a second NDK (#7403 by @dwyanewang)
  - Fixed Nix packages reporting the AGPL license instead of Apache-2.0 (#7415)
