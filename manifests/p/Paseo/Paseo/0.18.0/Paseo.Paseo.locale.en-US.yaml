ReleaseNotes: |-
  0.18.0 - 2026-11-27
  - Remote workspace browser proxy: Desktop browser tabs in remote workspaces now route through the workspace daemon, so remote localhost servers open directly in Paseo. (#10944 by @airon-assustadus)
  - Per-device notification preferences: Each device can choose which agent, terminal, and plugin events send notifications, and plugins can send notifications and handle taps. (#10888)
  - Agent profile system prompts: Save an optional system prompt on an agent profile to apply it to new agents started from that profile. (#10996)
  - More syntax highlighting: Syntax highlighting now covers diff and patch files along with Ruby, Kotlin, TOML, SQL, Lua, Protobuf, PowerShell, Groovy, Gradle, Scala, CMake, Properties, INI, R, Perl, and LaTeX. (#11026 by @hmalaspina, @kukicola, @MaximeConan, @singleton11, @chandlerok)
  All changes
  Changed
  - Changed ACP providers to cache model catalogs across daemon restarts instead of probing in the background, and cleaned up Antigravity ACP flags and metadata. Requires Antigravity CLI 1.5.1 or later (#10992)
  Fixed
  - Fixed Paseo iOS crashing shortly after connecting when an enabled client plugin imports react-native (#11011)
  - Fixed OpenCode v2 agents staying stuck in running after Stop when stream events were missed or chat history was large (#10955)
  - Fixed steering a Pi agent during a run it started on its own aborting the run instead of steering it (#10977 by @viiqswim)
  - Fixed creating a workspace from a pull request in a fork clone checking out the fork's pull request with the same number (#10987)
  - Fixed dropping images or files onto the composer leaving the input unfocused (#11022)
