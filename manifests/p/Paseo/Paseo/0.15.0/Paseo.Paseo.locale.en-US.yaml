ReleaseNotes: |-
  0.15.0 - 2026-11-03
  Daemon restarts now keep terminal programs running. Interrupted agents can resume in their existing conversations when you turn on agent recovery.
  Mobile terminals have native rendering and draggable text-selection handles. Reconnecting restores up to 10,000 lines of terminal history.
  Worktree setup can copy ignored files and use plugin-defined locations before agents start.
  Added
  - Insert known agent commands from replies into the Composer draft (#8371)
  - Reuse running OpenCode v2 services (#7435 by @mcowger)
  - Kept terminal programs running across daemon restarts, crashes and supported updates (#7644, #8155 by @sebastianarena)
  - Added an opt-in setting to resume interrupted agents in their existing conversations after a host restart (#8127, #8619 by @coolwindX, @suntianc)
  - Added draggable terminal text-selection handles on iOS and Android (#8348)
  - Let phones and tablets rotate with the system orientation setting (#8256 by @magiclaw, @yzim)
  - Copy ignored files selected by .worktreeinclude into new worktrees before setup and agents start (#8100 by @cprecioso)
  - Added daemon-wide support for HTTP_PROXY, HTTPS_PROXY and NO_PROXY (#8177)
  - Fetch usage only while displayed, with a host setting to disable usage checks entirely (#8181)
  Improved
  - Replaced mobile terminal text rendering to align CJK characters, emoji, styled text and the cursor with terminal columns (#8336, #8375)
  - Restore the configured terminal scrollback on reconnect, up to 10,000 retained lines (#8282 by @DrakenKor, @lennartschoch)
  - Load paginated Codex histories when importing or reopening sessions (#8171 by @dundunHa, @hr95savage)
  - Stopped rereading and retaining an unused copy of Codex history when reopening a cached chat (#8132)
  - Split large daemon responses across relay frames instead of disconnecting at the frame limit (#8302)
  - Truncate oversized chat entries before sending them to the app, including large tool results and embedded data (#8274)
  - Show subagent activity in its own panel instead of duplicating it inside the parent’s tool card (#8276)
  - Show exact usage reset times alongside more precise countdowns (#8162)
  Plugins
  - Fixed discarded messages returning after rewinding plugin conversations (#8368 by @mcowger, @omercnet)
  - Reduced plugin downloads with smaller client bundles and a cache reused across reconnects and app launches (#8040, #8076 by @luoph, @RRD-dev)
  - Preserved plugin screens and local state during temporary host disconnections (#8105 by @luoph, @RRD-dev)
  - Let plugins choose worktree locations and creation options through worktree.create.before (#8117 by @mcowger)
  - Added server.addHook with an awaited worktree.create.after hook before workspace setup and agents start (#8081)
  - Released redundant plugin streaming snapshots instead of retaining them for the session’s lifetime (#7675 by @suntianc)
  Fixed
  - Fixed rewinding Claude conversations to messages sent during an active turn (#8372 by @tieo)
  - Fixed duplicate rows and missing replies when resuming Claude subagents after reopening a session (#8408 by @luoph, @RRD-dev)
  - Fixed Codex agents created without a prompt failing after their runtime reopens (#8393 by @babo-jeonguk)
  - Fixed newly running agents appearing as finished immediately after creation (#8396 by @luoph)
  - Fixed ACP startup exits waiting for a timeout instead of reporting the process error (#8384 by @Peanut-HZM)
  - Fixed skills missing from new ACP agents when commands arrive in multiple batches (#8387 by @Peanut-HZM)
  - Fixed sidebar titles and statuses stopping updates after directory subscriptions are released (#8403 by @ragokan)
  - Kept the open workspace visible in collapsed sidebar groups (#8395 by @0xroylee)
  - Fixed relative chat links opening missing files instead of files in nested repositories (#8361 by @apple-ouyang)
  - Accepted host:port and pasted URLs in the Direct connection Host field (#8223 by @DaydreamCoding)
  - Fixed terminal Ctrl+V paste over plain HTTP on non-Mac keyboards (#8230 by @DaydreamCoding)
  - Stopped failed history loads from repeatedly reopening the provider, with Retry available in the chat (#8278)
  - Fixed Claude settings files being discarded when Paseo adds its own launch settings (#8148 by @yayugu)
  - Fixed steering messages replacing a turn that was still starting and losing its original prompt (#6192)
  - Fixed Pi tool-result images missing during streaming and after reopening the chat (#8280 by @duyiliu)
  - Fixed completed edxeth/pi-subagents children remaining marked as working (#8176 by @Zeno2019)
  - Fixed Claude background subagent status after reopening a conversation (#6259)
  - Fixed reused plugin subagents showing their previous completed status during new work (#8080 by @bccy)
  - Fixed custom Codex providers with reserved names such as ollama (#6954 by @mr860819)
  - Fixed the MiniMax Code catalog command failing to select an executable (#8201 by @Peanut-HZM)
  - Fixed Android keeping the wrong layout after folding or unfolding while backgrounded (#8285)
  - Fixed Android workspace layouts and header fades retaining their old size after rotation (#8349, #8377)
  - Fixed chat reconnecting and updating status being hidden behind the header on iOS and Android phones (#8568)
  - Fixed deleted agents leaving unclosable tabs in another window (#8248 by @loganmeyer)
  - Fixed transcript text retaining old theme colors after the theme changes while the window is hidden (#8199 by @Nurshot, @dansabin)
  - Fixed web menus snapping back to their loading size after content arrives (#8180 by @babo-jeonguk)
  - Fixed split dividers drifting ahead of or behind the pointer while dragging (#6011)
  - Fixed delayed native filesystem watcher startup leaving Git updates unobserved (#8107)
  - Fixed bundled skill arguments being passed incorrectly to Codex and Pi (#8252 by @AspireOne)
  Notes
  - The first upgrade from 0.14.0 still closes terminals; terminal preservation starts once the new daemon is installed, and Windows desktop app upgrades still close them
  - Agent recovery is off by default; turn on Resume agents after restart in Host settings → Agents to send Resume working. or your own prompt
  - Before downgrading to 0.14.0, restore a backed-up config.json or remove the saved agent-resume and usage-check settings
