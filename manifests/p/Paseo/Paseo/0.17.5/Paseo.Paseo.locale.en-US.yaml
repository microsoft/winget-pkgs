ReleaseNotes: |-
  0.17.5 - 2026-11-26
  - Archive workspaces together: Cmd/Ctrl+click a workspace in the sidebar to select multiple workspaces and archive them in one step. (#10798, #10821)
  - Copy quoted drafts: Copy a quote from a reply with one tap, without the > markers. (#10608 by @pedrovieira, @dinhphieu)
  - Redesigned agent profiles page: Agent profiles have their own dedicated settings page, and the model picker saves a new profile in one tap. (#10789, #10824)
  - Redesigned Add project: Add project opens on folder search, with Clone and New folder one tab away. (#10767)
  - Choose how Desktop updates: Desktop can download updates automatically, only notify you, or never check. (#10785)
  - First-class Tailscale support: Turn on Tailscale for a host from its settings or from setup, without editing its configuration. (#10801)
  All changes
  Added
  - Added host icons, connection types, and latency to the host picker (#10702 by @artile)
  - Added agent profiles to model picker search and the Command Center (#10774)
  - Added Archive on finish to paseo schedule create, paseo schedule update, and the schedule MCP tools (#8479 by @ArnoldHueteG)
  - Added newer Factory Droid models by updating its catalog entry to Droid 1.20.0 (#10779 by @dsingal0)
  Changed
  - Changed automatic stable Desktop updates to check at most every 6 hours and to wait 24 hours after each update (#10882, #10901)
  Fixed
  - Fixed agents hiding the subagents they create from tabs and the subagent track (#10887)
  - Fixed parent agents getting a Claude subagent's interim reply instead of its final reply when the subagent waits on background work (#10864)
  - Fixed agents that watch a pull request staying in Running after their turn ends (#10740 by @drgould)
  - Fixed the Changes pane offering no Push or Pull when the remote is not named origin (#10679)
  - Fixed a pane switching to the wrong tab after you split or move its active tab out (#10716)
  - Fixed New workspace leaving focus on the project button after you choose a project (#10632)
  - Fixed archived chats staying in memory until the window reloads (#10866)
  - Fixed hover cards and other overlays slowing down in long app sessions (#10778 by @maci0)
  - Fixed Desktop freezing when you open a chat whose last turn has hundreds of tool calls (#8661 by @luoph)
  - Fixed direct connections dropping on slow links while a large timeline loads (#10651 by @apple-ouyang)
  - Fixed large Git workspaces stalling the daemon while their file watchers scan (#10788, #10602)
  - Fixed a Git change in one repository rescanning every checkout (#10863 by @viiqswim)
  - Fixed iOS chats staying blank when a pending question is taller than the screen (#10759)
  - Fixed Android long-press text selection in chat leaving the magnifier stuck on screen (#10844)
  - Fixed mobile sheet footers dropping behind the system bar when the keyboard closes (#10827)
  - Fixed the sidebar toggle covering plugin screen titles on macOS (#10773)
  - Fixed Windows file links with a slash before the drive letter failing to open (#7711)
  - Fixed Import Session giving up on slow providers and hiding provider errors (#10516 by @chirag127, @derek-geekdive)
  - Fixed OMP 19.1 ask questions not showing a question card (#10862 by @gtoxlili)
  - Fixed OpenCode 2 agents with their own MCP servers failing when a shared OpenCode server is running. Requires OpenCode 2.0.29 or later (#10752)
  - Fixed deleted OpenCode subagents staying in the subagent track (#8332)
  - Fixed stopped Claude background subagents showing as running after you reopen the parent (#9013)
  - Fixed plugin and Paseo instructions replacing a Codex agent's own developer_instructions (#10792)
  - Fixed the OpenCode Go usage card missing when the Go key is in OpenCode's auth.json (#10678)
  - Fixed GitHub, GitLab, and Gitea commands on Windows breaking multiline arguments and expanding %VAR% text (#10685)
  - Fixed paseo hub login printing a link without the code (#10751)
  - Fixed Hub trigger runs failing on Antigravity and other plugin providers without tool policy support (#10889)
  - Fixed Hub sessions being refused when they read a daemon's provider controls (#10794)
  - Fixed Hermes and other plugin ACP providers leaving processes running after a model list refresh times out (#10867)
  - Fixed a plugin's agent tools returning Tool not found after the plugin reloads during a turn (#10106 by @tomgrin10)
  - Fixed replies changed by a timeline plugin losing Copy, Fork, and turn duration (#10795 by @Brandon168)
  - Fixed idle plugin sessions waking the daemon every 10 seconds (#9363 by @Brandon168)
  Security
  - Changed Claude Code 2.1.326 or later to receive MCP server tokens over stdin instead of in process arguments that other local users can read (#10698 by @mdbraber)
  - Fixed repository teardown commands running on archive for pull request worktrees whose setup you have not approved (#10694)
  Plugins
  - Added launch wraps so plugins can run agents, terminals, and worktree commands inside a sandbox (#10786 by @clkao, @bendavid)
  - Added the parent workspace to plugin workspace snapshots (#10781 by @spatenotte)
  - Updated the bundled paseo-plugin skill to the current plugin API (#10793)
