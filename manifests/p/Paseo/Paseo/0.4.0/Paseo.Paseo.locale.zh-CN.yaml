ShortDescription: 用于 Claude Code、Codex、Copilot、OpenCode 和 Pi 的自托管守护程序。智能体在您的机器上运行，拥有完整的开发环境。可从手机、桌面或网页连接。
Description: 为 Claude Code、Codex、Copilot、OpenCode 和 Pi 智能体提供统一界面。在您自己的机器上并行运行智能体，无论在办公桌前还是手机上都能随时开始工作。Paseo 运行一个本地守护程序来管理您的编码智能体，桌面应用、移动应用、Web 应用和 CLI 均可连接。智能体在您的机器上运行，拥有完整的开发环境，可使用您的工具、配置和技能。Paseo 不含遥测、跟踪或强制登录。
