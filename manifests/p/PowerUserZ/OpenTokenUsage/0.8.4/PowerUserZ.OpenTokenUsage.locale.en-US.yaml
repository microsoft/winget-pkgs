ShortDescription: Track all your AI coding subscription usage from the Windows system tray.
Description: OpenTokenUsage is a lightweight system-tray app that tracks how much of your AI coding subscriptions you've used (Claude, Codex, Copilot, Cursor, Gemini, and more) in one place. It is a Windows fork of OpenUsage with full Windows support, a plugin-based provider system, and a local HTTP usage API.
