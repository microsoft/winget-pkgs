ShortDescription: A writing workspace for authors, academics and worldbuilders
Description: |-
  Plotiar is a workspace for writers who work on long projects: novelists, screenwriters, academics, poets and worldbuilders. Your manuscript, your notes and your planning live in one project.
  A page-based editor with chapters, comments and footnotes; task boards, corkboards, flowcharts and plot grids; family trees, maps and calendars; real-time collaboration; export to Word, PDF and EPUB; and an AI assistant that helps you organise your project but never writes your story.
  A Plotiar account is required. You can start for free; paid plans are optional.
