# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json

PackageIdentifier: PearTreeForge.SparkDown
PackageVersion: 0.4.3
# Tauri NSIS (Nullsoft Install System). winget's installer type name is nullsoft.
# Tauri's silent switch is /S. The nullsoft type already passes /S, so this file sets no InstallerSwitches.
InstallerType: nullsoft
# tauri.conf.json bundle.windows.nsis.installMode is currentUser.
Scope: user
ReleaseDate: 2026-11-17
Installers:
  - Architecture: x86
    InstallerUrl: https://github.com/sparkdown/sparkdown/releases/download/v0.4.3/SparkDown_0.4.3_x64-setup.exe
    InstallerSha256: 33365A5FDEDB644460AC769681C9B1BDDB7D0C03648D33A297041A03661A8939
    # 0.4.3 installer puts the sparkdown command on PATH (skip with /SDNOPATH).
    Commands:
      - sparkdown
    FileExtensions:
      - md
      - markdown
      - mkd
      - html
      - htm
      - svg
      - csv
      - json
      - yaml
      - yml
      - txt
      - log
      - xml
      - toml
      - toon
      - ini
      - cfg
      - conf
      - env
      - properties
      - tsv
    AppsAndFeaturesEntries:
      - DisplayName: SparkDown
        Publisher: PearTree Forge LLC
ManifestType: installer
ManifestVersion: 1.28.0
