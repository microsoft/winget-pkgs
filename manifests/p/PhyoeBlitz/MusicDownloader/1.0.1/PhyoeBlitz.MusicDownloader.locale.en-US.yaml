ShortDescription: Download songs from YouTube Music as MP3 files with album covers, from a CSV song list.
Description: |-
  Music Downloader reads a CSV list (name, category, link) and saves each song as an MP3 with its
  album cover embedded, in one folder per category (for example per artist). It includes a Windows
  app (music-downloader-gui) and a command-line tool (music-downloader). Downloads resume where they
  stopped, and existing files can be renamed or given album covers without downloading them again.
