ReleaseNotes: |-
  26.11.2
  - Fixed regular expression replacements losing surrounding text context, so lookarounds
    and word-boundary checks work correctly, while preserving capture references and case sensitivity
    (for #3831)
  - Added an Enable font ligatures option in the editor font settings for regular text
    and code (requires Qt 6.7 or newer and a ligature-capable font; restart required)
    (for #3830)
  - Added built-in OpenRouter AI support, listed first in the
    AI settings with encrypted API-key storage and a connection test
    (for #3829)
    - Includes the free-only openrouter/free router and free Gemma 4 and Liquid LFM 2.5
      models for summarizing, rewriting and organizing notes
    - Free model availability and rate limits can change; no paid fallback is configured
  - Changed the default Groq AI model to openai/gpt-oss-20b for users without a saved
    model selection, replacing the retired llama-3.1-8b-instant (thank you, Agustin Torres)
    (for #3813)
  - Fixed AI connection tests changing the selected backend or saved model, and made
    them work even when AI features are disabled
    - The Groq test now uses openai/gpt-oss-20b instead of displaying a retired model
      name while testing the saved model
  - Fixed the stored attachments and stored images dialogs allowing links to be inserted
    into the current note in read-only mode
  - Double-clicking a file in the stored attachments and stored images dialogs now opens
    it externally instead of inserting a link into the current note
