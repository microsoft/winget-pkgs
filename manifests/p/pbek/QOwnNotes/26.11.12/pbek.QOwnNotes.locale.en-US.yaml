ReleaseNotes: |-
  26.11.12
  - Avoided unnecessary full note-folder scans on Windows when a watched subfolder's
    notes are unchanged, reducing stalls after OneDrive sync notifications
    (for #3847)
    - Nearby directory notifications share a delayed check, which still handles notes
      that synchronization clients update by replacing the file
  - Fixed Git versioning in the Snap failing when a host ~/.gitconfig is present
    by using the Snap's private Git config
    (for #3857)
  - Added a time picker next to the due date of the Nextcloud Deck card dialog,
    so the time no longer needs to be typed
    (for #3856)
    - The due date and the due time now have separate fields, the date keeps its calendar
      and the time gets the new clock picker
    - The picker follows the light and dark mode and the accent color
    - New Today, Tomorrow and Next week buttons set the due date and keep the time,
      the buttons that move the due date earlier or later are now labeled
    - The clock face shows hours on two rings and switches to the minutes after an hour was picked
    - Quick presets for 09:00, 12:00, 15:00 and 18:00 and a Now button set common times
    - The picked time is shown right away, Escape restores the previous time
    - The mouse wheel, the arrow keys and Tab allow fine adjustments with the keyboard
  - Added a Done checkbox to the Nextcloud Deck card dialog to mark cards as done
    (for #3827)
    - Multiple cards can be marked as done or not done from the context menu of the card list
    - Done cards are struck through in the card list, show when they were done in their tooltip,
      and their due date is no longer highlighted as overdue
    - If a done stack is configured for the board in Nextcloud Deck, Deck moves cards
      that are marked as done into it, and you are told where they went
    - Saving a card no longer clears its done state in Nextcloud Deck
    - Done and archived cards and missing due dates are now muted in a way that stays
      readable in dark mode, including on alternating rows
  - Added drag and drop for copying and moving notes and subfolders in the note list and folder
    panel, including mixed selections when the note tree is enabled
    (for #3854)
    - Moves use the existing confirmation dialogs on drop, with Don't ask again
      options; starting a drag does not show a dialog
    - Internal drops offer a Copy / Move context menu at the drop position; Ctrl-drag selects Copy and
      Shift-drag selects Move without the chooser, while confirmations remain enabled
    - Notes cannot be dropped into their current subfolder; mixed selections skip notes
      that are already in the destination
    - Shift-drag shows a move cursor over internal targets instead of the copy cursor
    - Folder copies include their contents and preserve note tags, never overwrite existing
      folders, and do not follow symbolic links; links outside the copied tree may need adjustment
    - Drags can also copy notes and folders to a file browser without
      moving the originals
    - Fixed a crash when cancelling a drop confirmation with Escape, caused by
      incorrect ownership of the drag object during Qt's cleanup
