ReleaseNotes: |-
  26.10.0
  - Changes to the note-folder database notes.sqlite made outside QOwnNotes now refresh
    note tags and the tag tree (for #3764)
  - On Windows, the Font rendering interface setting is no longer reset to Automatic
    when the settings dialog is closed (for #3757)
  - On Windows, italic text in fonts without a real italic face, like Tahoma, is now also
    rendered without font smoothing when Windows font smoothing is disabled
    (for #3757)
  - If the setting to ask for a note name when creating a new note with Ctrl + N is enabled,
    the dialog is now prefilled with the default note name including the current date and time,
    which is selected so it can be overwritten right away, and the setting and dialog now talk
    about a note name instead of a headline (for #3765)
  - The Secure password storage dialog doesn't show up on every start anymore if there is no
    system keychain, like GNOME Keyring or KWallet, available on Linux; in that case passwords
    and API keys stay in the legacy storage (for #3766)
  - There was a new release of QOwnNotes for Android,
    v1.0.0
    - Note tags are shared with QOwnNotes desktop through the notes.sqlite file in the notes folder,
      and notes can be filtered and tagged, even offline
    - Opening a note while searching the note list opens Find in note with the same text
    - A new Ask for name of new notes setting asks for the name of a new note before creating it
    - Nextcloud Deck cards can be created from the editor toolbar, and card links open in the
      Nextcloud Deck Android app
    - The account menu now lists all accounts at the top, so switching accounts is one tap away
  - The unit tests are now built with CMake and Qt 6 instead of qmake, and a crash of the
    unit tests caused by leftover data in the test database was fixed
  Released files
  - QOwnNotes-x86_64.AppImage: Portable Linux AppImage build with Qt 6
  - QOwnNotes-x86_64.AppImage.sha256sum: SHA-256 checksum for the AppImage
