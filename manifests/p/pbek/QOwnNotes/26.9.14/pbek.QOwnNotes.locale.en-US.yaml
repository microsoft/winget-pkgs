ReleaseNotes: |-
  26.9.14
  - Due dates in the past are now highlighted in the card list of the Nextcloud Deck dialog
    (for #3761)
  - On Windows, automatically use legacy GDI font rendering when system font smoothing is
    disabled, with a new interface setting to choose automatic, DirectWrite, or GDI rendering
    (for #3757)
  - Fixed editor highlighting for indented code block lines that start with a list
    marker like -, * or + (for #3749)
  - A new opt-in setting Ignore accents in search in the Panels settings lets searches
    without accented letters also find text with accented letters, for example avion also
    finds Avión (for #3128)
    - It works for the note search, including the highlighting in the note editor and preview,
      and for the filters of the tag, note subfolder and navigation panels
    - Searches with accented letters still only find exact matches, so schön doesn't find schon
    - Only Latin letters are affected, characters of other scripts are always matched exactly
    - The scripting methods script.fetchNoteIdsByNoteTextPart and script.searchTagsByName
      got a new optional ignoreAccents parameter
  - The scripting documentation now explains how to format dates and times with
    Qt.formatDateTime and the scripting examples use it instead of formatting dates by hand
    (for scripts#298)
    - See Formatting dates and times
  - There was a new release of QOwnNotes for Android,
    v0.9.0
    - Search text can be turned into a new note named after the query in the selected category
    - The Markdown editor toolbar can insert the local date or date and time at the cursor
    - A clipboard web URL can be turned into a Markdown link labeled with the page title
    - Note view provides an information dialog with note, text statistics and synchronization details
    - Editing medium-large notes with many links and tasks now stays responsive
  - There was a new release of QOwnNotes for Android,
    v0.10.0
    - Notes are shown as bordered cards in the note list, with an optional compact note list setting
    - Note-list widgets can show all notes, uncategorized notes, or a single category
    - Widgets and the note list have new appearance settings for colors, headers, and category labels
  - There was a new release of QOwnNotes TUI,
    v1.0.0
    - The cursor can move word by word in the viewer and editor with Ctrl-Left and
      Ctrl-Right, and text can be selected with Ctrl-Shift-Left and Ctrl-Shift-Right
    - Typing / in the editor now inserts the character instead of opening the in-note search;
      use Ctrl-f to search while editing
