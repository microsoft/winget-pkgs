ReleaseNotes: |-
  26.10.9
  - The 26.10.3 release of
    QOwnNotes for Nextcloud adds more editor actions
    to the web interface
    - Link dialog with web page title fetching and a searchable Link to note tab, inserting
      relative note links compatible with QOwnNotes Desktop (Ctrl+L, or Ctrl+Shift+L for note links)
    - Insert inline code or fenced code blocks, including wrapping selected text (Ctrl+Shift+C)
    - Toggle checkbox list formatting on the current line or selected lines, preserving list markers
      and indentation (Alt+L)
    - These actions are also available in the note's "…" menu; use Cmd instead of Ctrl on macOS
  - Fixed saved task list selections being cleared when accepting settings without changes
    (for #3798)
  - Added an optional Linux Qt6 CMake build with KDE Frameworks application metadata
    (QON_KDE_INTEGRATION), a qownnotes-qt6-kde Nix flake package, and build diagnostics
    (for #3796)
    - just build / just nix-build now select the KDE variant on Linux; plain Qt6 and
      macOS builds remain available without KDE dependencies
    - KDE builds initialize KCrash for GUI startup, with DrKonqi support when the reporter
      and system crash-reporting setup are available
    - KDE builds use native Plasma global shortcuts when its service is available, preserving
      Plasma-side changes and retaining the portal/QHotkey backends on other desktops
    - All actions are offered in the Plasma shortcut settings, so global shortcuts can also
      be assigned there, and they are shown with their menu path (e.g. Note → New note)
    - KDE builds send desktop notifications that can be configured in Plasma's notification
      settings, e.g. when the current note was modified externally while QOwnNotes was in
      the background
    - KDE builds use the PlasmaActivities library for the KDE Plasma activity integration,
      so activities are loaded without blocking, while older activity managers and other
      desktops keep using the existing implementation
    - KDE builds can use an installed KDE color scheme for the user interface, which can be
      selected in the Interface settings, while the system palette stays the default
    - When QOwnNotes is started again while it is already running, or by a global shortcut of
      the desktop portal, its window is now raised with the activation token of the launch on
      Wayland, and with the startup notification ID on X11 in KDE builds
    - KDE builds can send note files to installed targets like KDE Connect or email with
      the new Send note to menus in the Note menu and the note list context menu
    - Notes of a running QOwnNotes can be found in KDE Plasma's KRunner search by their name
      or text, without showing note text, if the KRunner plugin file is installed,
      which KDE builds do
  - Added a new scripting command script.showNotification() to show a desktop notification,
    falling back to the system tray or the status bar
    (for #3796)
    - For more information please take a look at the
      Showing a desktop notification
      documentation
