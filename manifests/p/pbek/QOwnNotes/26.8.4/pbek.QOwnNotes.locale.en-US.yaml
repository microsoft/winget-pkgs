ReleaseNotes: |-
  26.8.4
  - Fixed the boundary arrow navigation in the note editor being dead on macOS,
    where pressing the Up arrow on the first line should move the cursor to the
    start of the line and Down on the last line to the end of it, because Qt
    delivers arrow keys with Qt::KeypadModifier set on macOS and the modifier
    is now masked off before comparing
    (for #3572, thank you, @VXNCXNX)
  - The AppImage no longer requires libfuse2 to be installed separately because
    its FUSE userspace library is now included in the runtime
    (for #3694)
  - Added configurable link hover highlighting to the note editor and preview, including
    dedicated Link hover colors for the Light and Dark editor schemas
    (for #3695)
  - There was a new release of the QOwnNotes Web Companion browser extension
    2026.8.1
    - Bookmark links can now be copied from the bookmark list
      (for #121)
  - There was a new release of QOwnNotes TUI,
    v0.5.0
    - Added Markdown highlighting for angle-bracketed URI autolinks
    - Added clickable HTTP and HTTPS links in the viewer, including links that wrap
      across lines
    - Added restoration of the last opened note when the application starts
  - There was a new release of QOwnNotes TUI,
    v0.4.0
    - Added shell completion generation for Bash, Fish, and Zsh
    - Added clickable relative, legacy note://, and wiki-style note links in the viewer
    - Added back and forward note navigation with preserved viewer and editor positions
    - Added keyboard and mouse text selection, clipboard actions, and a visible viewer cursor
    - Added reverse pane focus cycling and navigation from the viewer back to the note list
    - Added checkbox-list and Setext-style heading highlighting in the viewer and editor
  Released files
