ReleaseNotes: |-
  1.2.0 (2026-11-02)
  Features
  - input: show running state in the input bar with a sliding prompt (66ae2ef)
  - tabs: drag a tab to the window edge to open it as a split pane (8e22806)
  - tabs: label tabs with the directory name instead of the full path (c170377)
  - tabs: show a skeleton thumbnail of the tab while dragging it (0c79298)
  Bug Fixes
  - blocks: select text and forward clicks in full-screen programs (adcf89a)
  - input: put the cursor at the end when recalling history (9f2ef31)
  - tabs: keep the shell alive when a pane moves between tab and split (6b92766)
  - ui: drop the iced suffix from the window title (c8edeb7)
  - windows: keep the first character of the first powershell command (0103a47)
  - windows: silence the powershell error ding unless the bell is audio (f2f60f1)
  Performance Improvements
  - bell: play one bell at a time instead of a thread per bel (72136f0)
  - block: freeze the visible line range of finished blocks (bc1fc9e)
  - block: report pointer moves over block cards only when the hovered cell changes (328a3bb)
  - block: resolve block lines once when collecting text and copying selections (9370aa1)
  - build: enable fat lto and single codegen unit for release builds (48392c0)
  - completion: cache path executables per directory until it changes (7ae8eee)
  - completion: use the directory entry's file type instead of a stat per entry (f083612)
  - glyph: look up block element rects without allocating (165d396)
  - grid: erase with slice fills and reuse evicted scrollback rows (8bd389a)
  - grid: find history suggestions in one scan instead of building a map per keystroke (0d67981)
  - grid: move scrollback rows into reflow instead of cloning them (00f4afd)
  - grid: pack cell colors into three bytes to shrink cells from 88 to 56 bytes (71d72f9)
  - grid: scroll the screen by rotating a row ring instead of moving every cell (67fbc8d)
  - grid: store cell text inline instead of heap-allocating per cell (c6c2121)
  - paste: preview a paste without collecting every line each frame (d0d0df1)
  - pty: cache the debug-log env flag and skip unchanged cwd clones (efd7fd3)
  - pty: read 64 KiB at a time and batch queued output into one message (f906d05)
  - router: feed vte in segments instead of one byte at a time (9ecf23d)
  - startup: detect installed shells in the background instead of before the window opens (09f5858)
  - tabs: stop reading the git branch from disk on every pty output (e5fe963)
  - term: draw the grid from one widget instead of a widget per cell (30c1d04)
  - term: only consider search matches on visible rows when rendering (008bb23)
  - term: resolve theme fonts once per frame instead of per cell (3954c0c)
  - ui: only run the one-second tick while a shell integration is being detected (8c3e799)
  - ui: only tick cursor blink while a blinking grid cursor is shown (586fc8b)
  - ui: read the home directory once instead of on every frame (86ca113)
  - ui: skip pointer-move updates when nothing tracks the pointer (49bf345)
  - write settings and command history off the ui thread (2da978f)
  What's Changed
  - feat(tabs): drag a tab to the window edge to open it as a split pane by @pmqueiroz in #131
  - perf: speed up output, rendering, input and startup by @pmqueiroz in #132
  - chore(main): release 1.2.0 by @pmqueiroz in #133
  Full Changelog: v1.1.1...v1.2.0
