ShortDescription: A fast, lightweight, read-only Markdown viewer.
Description: |-
  MarkLens opens .md and .mdx files, or whole folders, and renders them faithfully. It is a viewer, not an editor: instant to open, it remembers where you were, and it never writes to your documents.

  GitHub-flavoured Markdown with syntax-highlighted code blocks, SVG images and a YAML front-matter panel. Sidebar, tabs and a quick switcher; an outline panel; find in file and across open files; auto-reload when a document changes on disk; light and dark themes; and an English, Vietnamese or Japanese interface.

  MDX components and embedded HTML are displayed as inert placeholders: there is no JavaScript engine and no webview. There is no telemetry. The only network traffic is an update check against GitHub Releases at most once a day, on by default and off with one setting, and remote images, which are off by default. MarkLens never downloads or installs an update itself.
