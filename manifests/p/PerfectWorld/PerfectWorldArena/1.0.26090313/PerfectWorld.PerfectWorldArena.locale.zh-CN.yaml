ReleaseNotes: |-
  【赛季】2026S3 赛季“临渊加冕”将于 9 月 4 日 16:00 正式开启！新赛季开启魔王排名制，大于 50 星后，进入魔王排名机制，魔王身份将只赋予大于 50 颗星且天梯排名前 999 位的顶分玩家！此外，本赛季持续优化了各分段玩家反馈的匹配体验问题，更多赛季免费福利与挑战也将同步开启，平台将继续努力提供更好的竞技体验！
  【活动】2026S3 全新国服战令即将在新赛季同步开启，玩家可前往平台活动页参与活动！
  - 您的每次国服开箱都将获得平台丰富道具收益！
  - 大会员、改名卡、双倍卡助力天梯冲刺！
  - 关注平台提醒，国服将限时放出限量武器箱兑换，即换即得！
  - 多倍概率 Roll 房，更高高概率 Roll 中千元饰品！
  【活动】全新会员功能体验上线，全新 DIY 模板完美时刻、MVP 特效、游戏内喷漆免费体验，APP 绑定抖音账号并分享你的完美时刻，参与抽奖最高可得大会员改名卡！
  【活动】2026S3 主播冲分挑战活动将于 9 月 4 日 16:00 随新赛季同步开启，玩家可前往平台活动页参与活动！
  - 您可在活动页选择一位认可的主播，主播达到对应段位后即可在活动页领取奖励。爱播冲分，你来领奖！
  - 每位主播另有专属平台道具好礼，快去直播间督促爱播上分，领取专属奖励吧！
  【新增】新赛季带来全新 MVP 专属特效，精彩表现不再只是战绩上的数字，更将以炫酷的视觉效果闪耀全场。每一次关键击杀、每一场精彩胜利，都值得用专属特效留下高光时刻。新赛季，秀出你的实力，让每一次 MVP 都成为全场焦点！
  【新增】新赛季平台上线数十款全新喷漆涂鸦，对局内无限使用次数，不再为喷漆次数限制而烦恼，最新网络热梗全收录。神秘商店将于 9 月 4 日下午 16：00 开放，快去兔管的神秘商店一键解锁属于你的喷漆涂鸦吧～
  【新增】完美时刻全新升级，新增剪辑模板及多种自定义渲染特效。既能选择全局滤镜、全局效果、替换天空盒等不同自定义配置项美化完美时刻，又能选择全新剪辑模板、一键 get 热门视频同款慢动作结尾，让你的完美时刻更完美～
  【优化】赛后数据展示优化，根据更丰富的条件和更多的数据分布调整了部分表现评分。
