ShortDescription: Convert files mid-drag. Hold Ctrl+Shift while dragging a file and drop it on a format.
Description: |-
  DragConvert is a tray app that converts files from a drag gesture. While dragging files, hold Ctrl+Shift to open a
  dial of target formats, or press Alt for quick tools (compress, merge/split PDFs, remove metadata, extract archives).
  Images, audio, video, documents, spreadsheets and subtitles. Runs fully offline; originals are never modified.
