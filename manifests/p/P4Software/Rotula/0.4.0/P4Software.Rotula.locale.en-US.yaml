# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.10.0.schema.json
PackageIdentifier: P4Software.Rotula
PackageVersion: 0.4.0
PackageLocale: en-US
Publisher: P4 Software
PublisherUrl: https://github.com/P4Software
PublisherSupportUrl: https://github.com/P4Software/Rotula/issues
PackageName: Rotula
PackageUrl: https://github.com/P4Software/Rotula
License: MIT
LicenseUrl: https://github.com/P4Software/Rotula/blob/main/LICENSE
Copyright: Copyright (c) P4 Software
ShortDescription: Offline label designer for Windows with ZPL-compatible output.
Description: >-
  Rotula is a free, open source, offline-first label designer. Lay out text, barcodes, QR codes, boxes and
  images, merge data from CSV or Excel files, preview the label and print ZPL-compatible output to USB,
  spooler or network (port 9100) printers. It also includes an MCP server for AI assistants and read-only
  database sources. It sends no telemetry and connects only to the printers and databases you set up, plus, only
  if you switch it on, one anonymous daily check for a newer version.
Moniker: rotula
Tags:
  - label
  - label-designer
  - barcode
  - zpl
  - printing
ReleaseNotesUrl: https://github.com/P4Software/Rotula/releases/tag/v0.4.0
# Rotula is MIT, but the SQL Server networking component it ships has its own Microsoft licence terms. The agreement below is
# the combined licence text the installer shows (also a release file); winget asks the user to accept it before installing.
Agreements:
  - AgreementLabel: Rotula licence and third-party terms
    AgreementUrl: https://github.com/P4Software/Rotula/releases/download/v0.4.0/LICENSE-THIRD-PARTY.txt
Documentations:
  - DocumentLabel: MCP server (connect an AI assistant)
    DocumentUrl: https://github.com/P4Software/Rotula/blob/main/docs/mcp.md
  - DocumentLabel: Deployment (silent install, MSI, policies)
    DocumentUrl: https://github.com/P4Software/Rotula/blob/main/docs/deployment.md
  - DocumentLabel: Third-party notices
    DocumentUrl: https://github.com/P4Software/Rotula/blob/main/THIRD-PARTY-NOTICES.md
ManifestType: defaultLocale
ManifestVersion: 1.10.0
