PackageIdentifier: P4Software.Rotula
PackageVersion: 0.4.0
PackageLocale: es-MX
Publisher: P4 Software
PublisherUrl: https://github.com/P4Software
PublisherSupportUrl: https://github.com/P4Software/Rotula/issues
PackageName: Rotula
PackageUrl: https://github.com/P4Software/Rotula
License: MIT
LicenseUrl: https://github.com/P4Software/Rotula/blob/main/LICENSE
Copyright: Copyright (c) P4 Software
ShortDescription: Diseñador de etiquetas para Windows, sin conexión, con salida compatible con ZPL.
Description: >-
  Rotula es un diseñador de etiquetas libre, de código abierto y que funciona sin conexión. Coloca textos, códigos de
  barras, códigos QR, recuadros e imágenes, combina datos de archivos CSV o Excel, revisa la vista previa e imprime
  salida compatible con ZPL en impresoras USB, de cola de Windows o de red (puerto 9100). Incluye además un servidor MCP
  para asistentes de IA y orígenes de datos de solo lectura. No envía telemetría y solo se conecta a las impresoras y bases
  de datos que configures y, únicamente si lo activas, a una comprobación anónima diaria de nuevas versiones.
