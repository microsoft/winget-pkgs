ReleaseNotes: "## Downloads\n\n| Architecture | Windows | macOS | Linux | Android | Web |\n|---|---|---|---|---|---|\n| **x86-64** (64-bit) | [Installer](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-Setup.exe) · [Portable](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-portable.exe) · [CLI](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-cli.exe) | — | [AppImage](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-3.0-x86_64.AppImage) · [.deb](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG.deb) · [Binary](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG) · [CLI](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-cli) · [Snap](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/picocrypt-ng_3.0_amd64.snap) | [APK](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-android-x86_64.apk) | [Open](https://picocrypt-ng.github.io/) |\n| **ARM64** (AArch64) | — | [DMG](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG.dmg) · [CLI](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-cli-macos) | [Binary](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-arm64) · [CLI](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-cli-arm64) | [APK](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-android-arm64-v8a.apk) | |\n| **ARMv7** (32-bit) | — | — | — | [APK](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-android-armeabi-v7a.apk) | |\n| **x86** (32-bit) | — | — | — | [APK](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-android-x86.apk) | |\n\nTo find the **SHA-256** digest, open **Assets**, choose **Show all assets** if needed, and look next to the file you downloaded.\n\n• 🌐 **Web version** — runs in any modern browser, nothing to install：<https://picocrypt-ng.github.io/>\n• **Android 8.0+** — [universal APK](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-android-universal.apk); PCV3 operations require sufficient available memory for the fixed 1 GiB KDF.\n• **Windows 7/8 (legacy) CLI** (x86-64)：[Download](https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/3.0/Picocrypt-NG-cli-Legacy.exe)\n• macOS builds are **Apple Silicon (ARM64)** only.\n\n---\n\n## What's new in 3.0\n\n\n• New encryption creates PCV3 volumes with passwords, keyfiles, or both bound to authentication. Supported v1/v2 volumes remain readable; earlier releases cannot read PCV3.\n• PCV3 passwords use a frozen, bounded Unicode 18 NFC profile. Inputs that require implicit CGJ insertion are rejected before KDF; explicitly entered CGJ remains significant.\n• Recovery messages distinguish partial and unverified results without inferring the trust of individual bytes from the outcome alone. Desktop archive-folder errors remain visible and allow another selection or closing the result.\n• Choosing a legacy desktop output path no longer truncates an existing file. Overwrite confirmation applies only to the confirmed destination, and later iCloud file batches ask whether to replace or extend the selection.\n• ZIP extraction reports incomplete cleanup when created-object identity is unavailable or changes. Desktop source deletion after PCV3 encryption holds the parent used for inspection and removal. Legacy desktop decryption keeps the encrypted source, including split volumes.\n• Android restores only app-owned input paths. Clearing passwords also clears visible fields, and accepted legacy operations retain credentials through cancellation and Force retry.\n• Sequential keyfile processing avoids exhausting file descriptors. Ordinary legacy Reed-Solomon reads reject partial trailing blocks, and WASM authenticates v2 headers before reporting missing or incorrect keyfiles.\n• The source requires Go 1.27.4 and uses `golang.org/x/net` v0.62.0. Windows legacy builds apply pinned compatibility patches to the official Go source.\n• The Android release workflow signs APKs separately from Gradle using a read-only GitHub token. Download verification binds artifacts to the expected workflow, main branch and source commit.\n• The Windows installer can add a File Explorer command to open one selected file or folder for encryption.\n• Windows downloads may become available after the initial 3.0 release while Authenticode signing is pending.\n\nFull changelog：https://github.com/Picocrypt-NG/Picocrypt-NG/blob/main/Changelog.md#v30\n\n---\n\n## Verifying your download\n\nUse **cosign 3.1.3 or newer** for verification.\n\nEvery artifact has a keyless [cosign](https://github.com/sigstore/cosign) signature (download the matching `<file>.sigstore.json` bundle) and a GitHub build-provenance attestation. Verification below binds the filename to its owning release workflow, the `main` branch, and source commit `1a057eeb1e63c3d15e83fca8d858bbecf82acd4f`.\n\nRun from a checkout of source commit `1a057eeb1e63c3d15e83fca8d858bbecf82acd4f` with the downloaded artifact and bundle in that directory. Both verifiers and the verified-certificate policy are mandatory：a standalone cosign bundle does not establish caller identity. The policy accepts only the exact owner direct path or the same-source release coordinator calling that owner.\n\nSet `file` to the downloaded artifact's filename, then run:\n\n```sh\nset -eu\nfile=Picocrypt-NG-android-arm64-v8a.apk\ncase \"$file\" in\n  Picocrypt-NG) workflow=build-linux.yml ;;\n  Picocrypt-NG-cli) workflow=build-linux.yml ;;\n  Picocrypt-NG.deb) workflow=build-linux.yml ;;\n  Picocrypt-NG-arm64) workflow=build-linux.yml ;;\n  Picocrypt-NG-cli-arm64) workflow=build-linux.yml ;;\n  Picocrypt-NG.dmg) workflow=build-macos.yml ;;\n  Picocrypt-NG-cli-macos) workflow=build-macos.yml ;;\n  Picocrypt-NG-portable.exe) workflow=build-windows.yml ;;\n  Picocrypt-NG-cli.exe) workflow=build-windows.yml ;;\n  Picocrypt-NG-Setup.exe) workflow=build-windows.yml ;;\n  Picocrypt-NG-cli-Legacy.exe) workflow=build-windows-legacy.yml ;;\n  Picocrypt-NG-android-armeabi-v7a.apk) workflow=build-android.yml ;;\n  Picocrypt-NG-android-arm64-v8a.apk) workflow=build-android.yml ;;\n  Picocrypt-NG-android-x86.apk) workflow=build-android.yml ;;\n  Picocrypt-NG-android-x86_64.apk) workflow=build-android.yml ;;\n  Picocrypt-NG-android-universal.apk) workflow=build-android.yml ;;\n  Picocrypt-NG-3.0-x86_64.AppImage) workflow=build-appimage.yml ;;\n  Picocrypt-NG-3.0-x86_64.AppImage.zsync) workflow=build-appimage.yml ;;\n  picocrypt-ng_3.0_amd64.snap) workflow=build-snapcraft.yml ;;\n  *) echo \"Unknown release artifact\" >&2; exit 1 ;;\nesac\nidentity=\"https://github.com/Picocrypt-NG/Picocrypt-NG/.github/workflows/$workflow@refs/heads/main\"\nsource_commit=1a057eeb1e63c3d15e83fca8d858bbecf82acd4f\ntest \"$(git rev-parse HEAD)\" = \"$source_commit\"\npolicy=.github/actions/sign-and-attest/verify-certificate.sh\ncosign verify-blob \"$file\" \\\n  --bundle \"$file.sigstore.json\" \\\n  --certificate-identity \"$identity\" \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\n  --certificate-github-workflow-sha \"$source_commit\" \\\n  --certificate-github-workflow-ref refs/heads/main \\\n  --certificate-github-workflow-repository Picocrypt-NG/Picocrypt-NG\ngh attestation verify \"$file\" \\\n  --repo Picocrypt-NG/Picocrypt-NG \\\n  --cert-identity \"$identity\" \\\n  --cert-oidc-issuer https://token.actions.githubusercontent.com \\\n  --signer-digest \"$source_commit\" \\\n  --source-ref refs/heads/main \\\n  --source-digest \"$source_commit\" \\\n  --predicate-type https://slsa.dev/provenance/v1 \\\n  --deny-self-hosted-runners --format json > \"$file.verified-provenance.json\"\nbash \"$policy\" online \"$file.verified-provenance.json\" \"$workflow\" \"$source_commit\"\n```"
