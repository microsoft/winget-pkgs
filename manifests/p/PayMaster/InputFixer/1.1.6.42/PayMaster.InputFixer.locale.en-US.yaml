ShortDescription: Fixes words typed in the wrong keyboard layout as you type. One hotkey for tricky cases, 14 layouts, personal dictionary. Lives in the system tray, works locally, free, no account.
Description: |-
  You type without looking at the screen and end up with "Ghbdtn" instead of "Привет". Input Fixer notices words typed in the wrong keyboard layout and retypes them for you, right as you type. Tricky cases take one hotkey.

  How it works:
  - Just keep typing. A word typed in the wrong layout is fixed by itself: right after the space, or mid-word as soon as it is unambiguous.
  - Tricky case? Double Shift retypes the last word or the selection and switches the keyboard layout.
  - Learns from your edits: undone auto-fixes become exceptions, converted words join your personal dictionary.
  - 14 keyboard layouts: English, Russian, Ukrainian, Belarusian, Kazakh, Armenian, Georgian, Greek, Hebrew, Arabic, Persian, Thai and Korean, including mixed text.

  And also:
  - Change case (UPPER/lower) or transliterate Cyrillic to Latin with a hotkey.
  - Text replacements: your own shortcuts expand as you type.
  - Lives in the system tray, optional launch with Windows, dark and light themes, interface in 13 languages.

  Privacy first: your text is processed on your computer and never leaves it. No accounts, no ads, no analytics. The only network request is the update check against inputfixer.com.
