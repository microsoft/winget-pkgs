ShortDescription: Offline end-to-end encryption for messages and files. No servers, no accounts, no data collection. Encrypt text or any file and send it over any channel, plus an encrypted Vault for passwords.
Description: |-
  Secret Keeper is a standalone end-to-end encryption tool. It turns any communication channel into a secure one: encrypt a message or a file, send the result over a regular messenger or e-mail, or show it as a QR code - only the intended recipient can decrypt it.

  No servers, no accounts:
  - Fully offline: no sign-up, no phone number, no e-mail.
  - Keys are generated on your device and never leave it.
  - No data is collected - there is simply nowhere to send it.

  Cryptography:
  - Modern standard algorithms: X25519 + AES-GCM.
  - Your identity is a 12-word seed phrase; your address is a short string or QR code that is safe to share.
  - The envelope format is open and documented (secretkeeper.net/protocol).

  Access protection:
  - PIN code, duress PIN that opens a decoy profile, automatic wipe after failed attempts.

  Messaging and files:
  - Offline per-contact chats, stored encrypted on the device.
  - Encrypt files of any type into portable .skf containers; encrypted single-file backups (.skb).
  - Vault for notes, passwords and documents.

  Integrations: Tetatet Chat delivers secret messages online; the browser extension encrypts right on websites; passwordless sign-in via QR (SK Login). Also on macOS, Android, iPhone and iPad.
