ShortDescription: Screenshot tool that lives in the system tray. Press PrtSc, select an area, a window or the whole screen and annotate it right away. Copy, save as PNG or share. Nothing leaves your PC.
Description: |-
  Snip Marker lives in the system tray and waits for your hotkey. Select an area, a window or the whole screen: the shot opens in the editor right away, and a second later it is in your clipboard, a file or the app you need.

  Snip:
  - Three modes: screen area, active window, full screen. Each has its own hotkey (PrtSc, Alt+PrtSc, Ctrl+PrtSc by default) and a tray menu item.
  - Move and resize the selection by its handles; the size is always shown.

  Mark:
  - Arrow, line, rectangle, ellipse, text, numbered marker, highlighter and pixelation to hide the sensitive bits.
  - Color, width, dashed lines and font size; your choice is remembered for next time.
  - Single-letter tool shortcuts, multi-selection, duplicating, undo and redo.
  - Set a screenshot aside and come back to it later from the tray menu, with its annotations still editable.

  Send:
  - To the clipboard with one key (Ctrl+C), to a PNG file (Ctrl+S) or straight into an app via the Windows Share dialog (Shift+PrtSc).

  Privacy first: screenshots are never uploaded anywhere, everything happens on your PC. No accounts, no ads, no analytics. The only network request is the update check.
