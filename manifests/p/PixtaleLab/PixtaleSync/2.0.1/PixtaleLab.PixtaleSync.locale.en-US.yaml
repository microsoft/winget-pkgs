PackageIdentifier: PixtaleLab.PixtaleSync
PackageVersion: 2.0.1
PackageLocale: en-US
ShortDescription: Desktop sync tool for the self-hosted Pixtale cloud photo gallery.
Description: |-
  Pixtale Sync is the official desktop sync tool for Pixtale, a self-hosted cloud photo gallery app. After connecting to your own Pixtale server and choosing a local photo folder, it automatically syncs local photos to the cloud gallery.
  The Pixtale server supports local, S3, and Telegram storage backends, and provides waterfall browsing, thumbnail and high-definition optimization, EXIF timelines, aggregated storage, and multi-user management. The server is deployed with Docker.
