ShortDescription: Pixtale 自托管云相册的桌面同步工具，可自动将本地照片同步至云端。
Description: |-
  Pixtale Sync 是自托管云相册应用 Pixtale 的官方桌面同步工具。连接自建的 Pixtale 服务并选择本地照片文件夹后，它会自动将本地照片同步至云端相册。
  Pixtale 服务端支持本地、S3、Telegram 等存储方式，提供瀑布流浏览、缩略图与高清图优化、EXIF 时间线、聚合存储与多用户管理等功能，可通过 Docker 部署。
