License: Freeware
ShortDescription: A free, ad-free personal music player with offline listening, synced lyrics and Android Auto.
Description: |-
  Sillon is a personal music player. It keeps your music as files in a library of your own, plays it without ads, shows time-synced karaoke lyrics, and sends it to your phone for offline listening, including in the car with Android Auto.
  It is not a streaming service: the music lives on your devices. An Atlas account is optional and only links your devices together and lets you listen with others.
  Sillon updates itself; its data is kept in %LOCALAPPDATA%\EchoMusic.
