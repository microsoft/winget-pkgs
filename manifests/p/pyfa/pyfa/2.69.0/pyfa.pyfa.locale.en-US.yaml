ShortDescription: Cross-platform fitting tool for EVE Online
Description: Pyfa, short for python fitting assistant, allows you to create, experiment with, and save ship fittings without being in game. Open source and written in Python, it is available on any platform where Python 3 and wxWidgets are available, including Windows, macOS, and Linux.
