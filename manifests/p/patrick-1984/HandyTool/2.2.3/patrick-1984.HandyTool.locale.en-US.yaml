ReleaseNotes: |-
  Changes since 2.0.3, highlights:
  - History: the player seeks anywhere in long recordings and shows the take's length up front;
    a recording can be transcribed again from History.
  - Recording: steadier microphone start, failed takes are always kept, short takes are
    transcribed while you speak, the last words before stop are kept more reliably.
  - Works behind a proxy that asks for a Windows sign-in (Negotiate / NTLM), with a Proxy page.
  - Shortcut Keeper keeps Handy shortcuts working inside Remote Desktop sessions.
  - Starts on PCs without a Vulkan driver (Whisper falls back to the CPU).
  - FLM (NPU) for files and watched folders, with progress.
  - No more "Thank you." pasted from silence.
ReleaseNotesUrl: https://github.com/patrick-1984/handy-tool/releases/tag/v2.2.3
