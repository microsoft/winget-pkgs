ReleaseNotes: |-
  Fixed: an update installed in the background could fail without a word while a speech model
  was loaded, leaving the app on the old version. The installer now waits, up to a minute,
  until the running app no longer holds its program file before it replaces it, and writes the
  outcome to installer.log in the log folder.

  Changed: About is a page in the sidebar, with the update controls at the top; History is the
  first page; the version number is shown at the bottom-left of the sidebar again.
ReleaseNotesUrl: https://github.com/patrick-1984/handy-tool/releases/tag/v2.0.2
