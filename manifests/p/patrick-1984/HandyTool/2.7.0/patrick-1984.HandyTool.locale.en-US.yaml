ReleaseNotes: |-
  Added
  - Pin any page to the sidebar: a pin next to the ? in every page's title adds it to a Pinned
    section at the top of the sidebar; one click opens it.
  - Back and Forward: the mouse side buttons and Alt+Left / Alt+Right move through the pages
    opened in this session.
  - Advanced settings > Appearance: order the sidebar, move entries under Show more, rename pinned
    pages and give them one of 20 icons.
  - Right-click the recording pill's sound bars to pick another microphone (and, on Windows, the
    sound source), also during a recording.
  - Files: pick or drop several recordings, put them in order, and get one combined text plus each
    file's own text.

  Fixed
  - Changing the microphone during a recording no longer loses the recording: the new one is
    switched into the same recording.
