ShortDescription: 'Free up disk space on Windows 10 and 11 safely: clean caches and leftovers, see what fills your disks, and check disk health.'
Description: |-
  Disk Cleanup Helper frees up disk space on Windows 10 and 11 safely and keeps an eye on your disks. Nothing is deleted until you select it and confirm.
  - Clean up: browser and app caches, temp files, old update files, Windows leftovers and more. Every item explains what you keep and what you lose. Clean up never touches your documents, photos, music, videos, desktop or downloads folders, and browser caches keep your passwords, bookmarks and logins. Files it cleans do not go to the Recycle Bin, so read an item before you tick it.
  - Analyze disk: the biggest folders and files on your drives. You can move the files you pick to the Recycle Bin or delete them permanently.
  - Disk health: whether each disk is healthy and how full each drive is, with a live temperature, history charts and the full SMART data.
  - Disk performance: live disk activity and a speed test.
  - Device details: Windows, processor, memory, graphics, screens, storage, battery, network and sound.
  It asks for admin rights when it starts. If you say no, it still opens, and the items that need admin rights are grey.
  No account, no ads, and it sends nothing about your PC. The only connection it makes is to ask GitHub whether a new version exists, at most once a day; you can turn that off in the About tab. When a new version is out, it downloads it, checks its SHA256 and version number, and replaces itself when you click Restart now or close the app.
  Light and dark themes, 18 languages.
