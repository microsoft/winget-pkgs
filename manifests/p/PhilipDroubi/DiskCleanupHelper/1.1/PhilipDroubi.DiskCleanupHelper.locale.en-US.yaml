  - Safer updates: the updater's test option now accepts only secure addresses, and it is never carried over into an updated copy.
  - Settings > Apps now shows Philip Droubi as the publisher.
ReleaseNotesUrl: https://github.com/Philip-Droubi/disk-cleanup-helper/releases/tag/v1.1
InstallationNotes: |-
  Start it by running DiskCleanupHelper in a new terminal window. winget does not add a Start menu entry for portable apps.
  The app can update itself. To let winget handle updates instead, turn off "Check for updates when the app starts" in the app's About tab. If "winget upgrade" or "winget uninstall" says the package was modified, run it again with --force.
