ShortDescription: Free Windows cleanup and repair tool that removes adware pop-ups, cleans junk files and diagnoses network, printer, Windows Update and boot problems.
Description: |-
  PC Buster is a single-file Windows 10/11 utility (no runtime to install) that bundles the things people usually need a technician for:
  - Adware scan: finds the program behind recurring browser pop-ups by matching browser history and settings, and removes it with a backup.
  - System cleanup, startup manager, registry leftovers, uninstaller, scheduled auto-clean.
  - Health checks: disk, blue screens, temperature, memory.
  - Repair pages for network, shared folders, printers, Windows Update, devices and slow boot. Diagnosis and step-by-step instructions are free; the one-click "Fix" buttons and deep file recovery need a paid pass.
  - Windows 11 rollback switches, full shutdown without fast startup, rarely used shortcuts.
  The program is available in Korean, English and Japanese and follows the Windows display language.
