Description: |-
  PC버스터는 따로 깔 런타임 없이 파일 하나로 도는 윈도우 10·11 관리 프로그램입니다.
  - 광고창 검사: 브라우저 기록과 설정의 지문으로 광고창을 띄우는 프로그램을 찾아 백업 뒤 지웁니다.
  - 시스템 정리, 시작프로그램, 레지스트리 찌꺼기, 프로그램 삭제, 자동 정리 예약.
  - PC 점검: 디스크, 블루스크린, 온도, 메모리.
  - 네트워크·공유 폴더·프린터·윈도우 업데이트·장치·부팅 느림 수리. 진단과 직접 고치는 설명은 무료, "고치기" 버튼과 깊은 복구만 이용권.
  - 윈도우 11 되돌리기 스위치, 완전히 끄기, 숨은 단축키.
