ShortDescription: Flash programmer for the CH341A USB SPI/I²C interface.
Description: |-
  etch341 reads, erases, writes and verifies SPI NOR flash and I²C
  EEPROMs through a CH341A USB programmer, with a GUI and a CLI. It
  includes a hex viewer, a chip database with SFDP fallback, and a
  read-only UEFI BIOS explorer.

  On Windows the CH341A needs the WinUSB driver: bind it once with
  Zadig (Options → List All Devices → 1A86:5512 → WinUSB).
