ShortDescription: Free PDF editor for Windows. Edit text, fill forms, combine pages, OCR scans and more.
Description: |-
  Pagekind is a free PDF editor for Windows 10 and 11.
  Edit supported text, fill forms, combine pages, make scans searchable with OCR, add comments,
  redact sensitive areas, design fillable forms, and save your work locally.
  Documents are processed on your PC with no upload service.
  Premium tools (PDF to Word, table export, watched-folder automation, CSV form fill) are also available.
