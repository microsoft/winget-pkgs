ReleaseNotes: |-
  Added
  Device Sync can convert files on the server
  By @circle3451, PR #1643
  - Device Sync → Format can store tracks as MP3, AAC or Opus with a maximum bitrate instead of the original files; your server converts them while syncing. The format must be enabled in the server's transcoding settings.
  - Copies are replaced in place when the format or bitrate changes, or when the file on the server changes. Devices synced before keep their original files until another format is chosen.
  Track subtitles and album versions from Navidrome
  By @Psychotoxical, PR #1662
  - A track's subtitle (e.g. "Instrumental") now appears after its title in every track list, and an album's version (e.g. "Deluxe Edition") after the album name — also for libraries synced through Navidrome's own API, which previously showed them only in some places. Existing libraries are updated once in the background.
  - The album page shows the version under the album title when the title does not already include it.
  Similar albums on the album page
  By @circle3451, PR #1663
  - A Similar albums row below "More by artist" suggests albums that sound alike, found by AudioMuse from a few tracks of the open album. Albums by the same artist are left out.
  - Needs Navidrome 0.62 or newer with the AudioMuse plugin; the row stays hidden on other servers, offline, or when nothing is found.
  Play songs from a list on a single or double click
  By @Psychotoxical, PR #1668
  - Settings → Input → Mouse chooses whether a song in a list plays on a single click or on a double click, so a stray click no longer replaces what is playing. The play button on a row always plays with one click.
  - Track lists now highlight a row: click it or move with the arrow keys, then press Enter to play it. Holding Ctrl adds more rows to a selection, including the highlighted one, and Escape clears the selection.
  - The Tracks page and search results now follow the same setting; before, songs there only played on a double click.
  Device Sync playlists with absolute paths
  By @circle3451, PR #1669
  - Device Sync → M3U path style gains Absolute, which writes full file paths into the playlists, for software that does not resolve relative entries. It is available for every layout.
  - Absolute paths include this computer's drive letter or mount point, so the playlists only resolve while the device appears under the same one.
  Device Sync moves files instead of downloading them again
  By @circle3451, PR #1670
  - When a playlist is reordered or the layout changes, copies already on the device are renamed to their new place instead of being downloaded again.
  - A track removed from a synced playlist, or from a source you remove from Device Sync, is now deleted from the device as well.
  Device Sync to a folder on this computer
  By @circle3451, PR #1671
  - Device Sync can now sync into an empty folder on the computer's own disk, for example to import the playlists into DJ software. Psysonic asks once before using the folder.
  - Only an empty folder can be chosen, and Psysonic never takes over or deletes files it did not write there.
  Sort albums by year
  By @circle3451, PR #1672
  - All Albums and Lossless Albums can now be sorted by Year. It starts newest first, and choosing it again switches to oldest first. Albums from the same year are ordered by artist, then title.
  - In the table view, the Year column header does the same: the first click sorts newest first, and each click after that flips the direction.
  Browse albums by the moods in your music files
  By @Puppies-On-Acid, PR #1675
  - The new Moods page groups the mood tags exposed by your server for individual tracks. Pick a mood to browse its albums, with album counts, library selection and incremental loading for large collections.
  - Existing libraries build the local mood index from cached track metadata after upgrading. The index stays in sync when tracks change and rebuilds after a Navidrome ID migration. No music files or server tags are changed; servers that do not expose track moods have none to browse.
  "Because you listened" can use AudioMuse
  By @Psychotoxical, PR #1678
  - Settings → Personalisation → Home now lets you choose where the "Because you listened" row finds its albums: Similar artists, as before, or AudioMuse, which suggests albums that sound like the one you listened to. The row is then titled "If you like the sound of …".
  - AudioMuse can only be chosen once a server with Navidrome 0.62 or newer and the AudioMuse plugin is detected. Servers without it keep using similar artists.
  Browse by record label
  By @circle3451, PR #1682
  - A new Labels entry in the sidebar lists the record labels in your library, A–Z, with a filter box, a letter jump bar and the album count of each label. It covers every server and library you browse, like Genres and Moods. It is hidden by default; turn it on under Settings → Personalisation → Sidebar.
  - Opening a label — from this list or from the label link on an album page — shows exactly the albums tagged with it, loading more as you scroll. After upgrading, the app builds the label index once before opening the library, with progress shown while it works.
  Browse individual tracks by mood
  By @Puppies-On-Acid, PR #1685
  - Mood detail now has Albums and Tracks tabs. Albums remains the default; Tracks pages through songs carrying that exact mood, using the standard song-list controls.
  - Switching tabs or returning from an album or artist preserves the loaded results and scroll position. Track browsing uses the local library index and does not require a new server endpoint.
  Open links in playlist descriptions
  By @cucadmuh, PR #1691
  - Web links in a playlist's description are now clickable and open in your browser.
  Touchpad gestures: swipe to go back, pinch to zoom covers
  By @circle3451, PR #1695
  - Swipe left or right with two fingers on a touchpad to go back or forward, like in a web browser. Sideways scrolling in carousels and lists is not affected, and Settings → Input → Touchpad can turn it off.
  - In the full-size cover view, pinch or use Ctrl/⌘ + scroll to zoom in around the pointer, drag to move around, and double-click to zoom in or back out. With a keyboard, use +/− to zoom, the arrow keys to move around, and 0 to reset.
  Shuffle spreads artists and albums over the list
  By @Psychotoxical, PR #1698
  - Shuffling no longer leaves the order to pure chance: songs by the same artist, and from the same album, are spread over the whole list, so the same artist rarely plays twice in a row. The next song after the one playing is also by a different artist whenever the list allows it.
  - This applies to the shuffle button and to every shuffle-play action for albums, artists, genres, playlists, favourites and the offline library. Radio, Instant Mix and the infinite queue are unchanged.
  - Settings → Personalisation → Queue Settings → Smart shuffle is on by default; switching it off brings back the purely random order.
  See at a glance what is playing
  By @Psychotoxical, PR #1700
  - Album and artist cards now show a small marker and an accent ring while one of their songs is playing, wherever it was started from. Playlist cards and the playlists in the sidebar show it while the queue you started from that playlist is playing.
  - On Windows and macOS the marker's bars move while music plays; on Linux, while paused, or with reduced motion turned on in the system, it stays a still icon. Screen readers announce the marked album as now playing.
  Private mode
  By @Psychotoxical, PR #1701
  - A new mask button in the top bar, left of the server name, turns on private mode. While it is on, nothing you play is shared or recorded: no scrobbles to Last.fm, ListenBrainz and the other Music Network services, no play counts or "last played" on the server, no now playing on the server or on Discord, and no entries in Statistics, Rewind or the play history.
  - Turning it on applies at once, including to the song that is playing; turning it off lets that song count again. Private mode is always off when the app starts.
  Sleep timer: stop at the end of the song or album
  By @Psychotoxical, PR #1702
  - The sleep timer now offers End of track and End of album next to the durations. Playback pauses just before the end, so the next song never starts; pressing play finishes the last moment and carries on.
  - End of album pauses where the queue moves on to a different album, so it also works on a shuffled queue. The countdown at the play button shows the time left.
  Skip a whole album at once
  By @Psychotoxical, PR #1703
  - Alt+click (Option+click on macOS) on the next or previous button jumps to the next or previous album in the queue, in the player bar, the fullscreen player and the mini player. Going back first returns to the start of the current album.
  - Settings → Input → Keyboard shortcuts has Next album and Previous album, also as global shortcuts; they are unbound until you set them.
  Recently used playlists on top when adding songs
  By @Psychotoxical, PR #1705
  - Every Add to playlist menu, for songs, albums, artists, selections and playlists, now shows the three playlists you used last under Recently used, followed by all playlists in alphabetical order. With fewer than six playlists only the alphabetical list is shown.
  A hint when the volume is at 0
  By @Psychotoxical, PR #1706
  - If you start playback while Psysonic's volume is at 0 — clicking a song, next or previous, play, or a radio station — a short notice tells you the volume is down. It does not repeat for every song the queue moves on to.
  The fullscreen player can open on its own
  By @Psychotoxical, PR #1710
  - Settings → Appearance → Fullscreen player → Open automatically opens the fullscreen player after 1 to 30 minutes without mouse or keyboard input while a song plays and Psysonic's window is on screen. It is off by default, and it does not open for internet radio.
