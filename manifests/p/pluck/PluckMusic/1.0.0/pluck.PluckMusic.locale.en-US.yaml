ShortDescription: A music player for Windows with playlists, lyrics, music library management, and YouTube downloads.
Description: Pluck Music is a desktop music player for Windows designed to bring your music library and listening experience together. It includes music library browsing, playback, playlist management, searchable music selection, lyrics display, and a floating transparent Lyric Vision. It also supports downloading music through yt-dlp. Pluck features a distinctive yellow, green, and black visual identity, with additional Ocean, Violet, Rose, and Ember themes.
