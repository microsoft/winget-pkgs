ShortDescription: Offline desktop app that finds personal data in documents and truly removes it on your own computer.
Description: |-
  BulutBelge finds personal data such as national ID numbers, IBANs, phone numbers, addresses, names, signatures and faces in PDF, Word, Excel, PowerPoint, image and text documents and produces a masked copy. All processing happens on your own computer: documents and personal data are never sent anywhere and the original file is not modified. It includes a command-line tool (bulutbelge) and a local MCP server that give AI agents masked reads only.
