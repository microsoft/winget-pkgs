ShortDescription: Simplified design, management & system control platform
Description: With this single OS platform, we offer the most intuitive way of designing and managing your installation. Easily configure audio processing and integrate third-party tools. Create custom user dashboards without coding, enabling system control from any device. For more complex solutions, use LUA for tailor-made control scripts. This offers a unified platform for quick integrations and immersive user experiences.
ReleaseNotes: |-
  New Features:
  - Manage installations using Projects
  - Create new Projects or migrate existing setups into a Project
  - Manage user access:
    - Add or remove Touch users from a Project
    - Temporarily disable user access
  - Assign full access (Admin) or restrict access to dashboards only (User)
  - Configure dashboard access and visibility for each user
  - Existing setups remain unchanged and continue to be available through your Personal Project

  General Improvements:
  - Search, sort and filter dashboards and Projects
  - Various improvements to dashboard widgets
  - Replaced the previous dashboard locking mechanism with new view and access controls
  - View release notes directly in AUDAC Touch, either after first launching a new version or from the Settings page
  - View your account verification status and request a new verification email
  - Configure dynamic volume control limits directly from the Device Settings screen
  - Significantly faster Snapshot loading
  - Improved Voice File Player configuration:
    - Select voice files using the integrated file browser
    - Play the contents of an entire folder in a defined order, including alphabetical or random playback
  - Added device support
  - Added code signing for the Windows application

  Backend improvements:
  - Migrated to a new cloud provider with more powerful servers and increased capacity
  Get started with AUDAC Touch™ projects by checking our How-to videos
