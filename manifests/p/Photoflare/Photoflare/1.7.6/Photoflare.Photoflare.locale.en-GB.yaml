ReleaseNotes: |-
  ✨ New & Improved
  - New application icon across Windows, macOS, Linux, Snap and Flatpak, including a macOS app icon and scalable/512px icons for Linux.
  - Italian translation added (thanks @pigeonskiller, #516).
  - Eraser tool now has round and square shape options.
  - Improved language detection at startup and fixed remaining translation issues.
  🐛 Fixes
  - Fixed the resolution being capped at 99 in the New Image/Resize dialog (thanks @laverdarie, #515).
  - Removed the old single instance method.
  📦 Build & Packaging
  - Updated the Snap configuration for the Snapcraft release.
  - Updated installer icons.
  - G'MIC version kept in sync with v4.0.5.
  - Pinned the Flatpak build to the release commit.
  🙏 Contributors
  Thanks to @pigeonskiller and @laverdarie for their contributions.
