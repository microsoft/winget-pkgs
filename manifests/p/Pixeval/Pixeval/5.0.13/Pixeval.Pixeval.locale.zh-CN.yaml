Description: Pixeval 是一个功能强大的 Pixiv 第三方桌面客户端。它使用插画家友好的方式浏览插画、小说与用户主页，支持高质量批量下载、缩放浏览、标签检索与收藏管理，并提供深色主题与多语言界面。
