License: Proprietary
ShortDescription: Виртуальная локальная сеть через интернет для игр, умеющих только LAN.
Description: |-
  playLAN собирает удалённые компьютеры в одну виртуальную локальную сеть, чтобы игры,
  которые находят друг друга только по локалке, работали через интернет.

  Создайте комнату, передайте код приглашения из шести символов — и все, кто в комнате,
  получат адреса в одной подсети. Игровой трафик идёт напрямую между участниками поверх
  L2-сети n2n и через наш сервер не проходит; сервер раздаёт только комнаты и присутствие.

  Это не VPN-сервис: интернет-трафик он не заворачивает и выходных узлов не имеет. Он
  создаёт изолированный сегмент, общий только для тех, у кого есть код комнаты.

  Нужны права администратора: ставится виртуальный сетевой адаптер TAP и правило
  брандмауэра.
