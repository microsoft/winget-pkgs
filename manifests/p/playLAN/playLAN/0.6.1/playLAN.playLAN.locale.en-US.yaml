ShortDescription: Virtual LAN over the internet, so LAN-only games can find each other.
Description: |-
  playLAN puts remote computers into one virtual local network, so games that can only
  discover each other over a LAN work over the internet.

  Create a room, share the six-character invite code, and everyone in the room gets an
  address in the same subnet. Game traffic goes peer-to-peer over an n2n L2 overlay and
  never passes through our server; the server only hands out rooms and presence.

  Not a VPN service: it does not route your internet traffic and has no exit nodes. It
  creates an isolated segment shared only by the people holding the room's code.

  Requires administrator rights: it installs a TAP virtual network adapter and adds a
  Windows Firewall rule. The interface is in Russian.
