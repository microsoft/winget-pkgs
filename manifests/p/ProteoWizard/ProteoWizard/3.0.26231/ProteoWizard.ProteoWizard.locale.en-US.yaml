ShortDescription: A set of open-source, cross-platform software libraries and tools for mass spectrometry and proteomics data analysis
Description: ProteoWizard provides a set of open-source, cross-platform software libraries and tools for proteomics data analysis. It supports reading directly from many vendor raw data formats on Windows and implements the mzML and mzIdentML standards, and its ready-made tools include the popular MSConvert format conversion utility, SeeMS, IDPicker and msAccess.
