ShortDescription: 不改你文件的 Markdown 编辑器
Description: |-
  Markeep 是一个 Windows 上的 Markdown 编辑器，所见即所得，功能对标 Typora。
  它只解决一件事：打开再保存，文件逐字节不变。多数所见即所得编辑器会在保存时
  悄悄改写原文——词内下划线被转义、Obsidian 双链被打断、中文里的 3~4% 被当成
  删除线吞掉整段正文、YAML 元数据被拆成标题。这些都已修复，并有自动化测试守着。
  软件永久免费，无广告、无功能限制。
