ShortDescription: A dead-simple, fast clipboard manager for Windows 11.
Description: |-
  Pastebird runs quietly in the system tray and remembers what you copy: text, URLs, file paths and copied files.
  Press Ctrl+Shift+V, type a few letters to search and press Enter to paste into the app you were working in.
  Keyboard-first, with a native Windows 11 look. 100% local: no account, no cloud, no telemetry, and the history is encrypted for your Windows account.
