ReleaseNotes: |-
  - First-run language selection screen: on the first launch, only the language selection modal is presented, and your choice is saved
  - 5 languages supported: English, Russian, German, Spanish, French across the entire app
  - Persistent sound storage: imported sounds are copied into internal storage (%APPDATA%\OpenSoundPad\sounds\)
  - Track renaming: right-click any track in the soundpad to customize its name
  - Pad volume rotary knob: smooth 0-200 percent knob matching Voice Studio styling
  - English primary documentation in README with complete secondary Russian section
