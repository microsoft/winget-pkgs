ShortDescription: Free, open-source real-time voice changer and soundpad for Windows
Description: |-
  OpenSoundPad (OSP) is a free, open-source soundpad and real-time voice changer for Windows.
  It enables routing audio through virtual microphones to Discord, Telegram, games, and other voice chat applications with ultra-low latency.

  Key features:
  - Real-time voice pitch shifter with pitch modulation, robot effect, distortion, and whisper effects
  - Ultra-low latency audio processing powered by NAudio and Windows WASAPI
  - Virtual microphone integration with VB-CABLE and VoiceMeeter
  - Global hotkeys for instant sound playback and mic muting
  - 5 languages natively supported: English, Russian, German, Spanish, French
  - Modern dark WPF UI with custom rotary controls and real-time audio visualizer
  - Zero adware, zero telemetry, fully free and open-source
