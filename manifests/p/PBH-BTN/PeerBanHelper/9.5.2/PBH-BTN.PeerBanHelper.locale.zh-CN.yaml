ReleaseNotes: |-
  下载器兼容性
  - 现在兼容 BitComet v2.23 版本 @Ghost-chu
  新功能
  - WebUI 编辑 AvaitorScript 脚本现在会进行语法检查 @Gaojianli
  错误修复
  - 修复部分 Linux 发行版系统代号中存在非 ASCII 字符，导致 HTTP 请求出现非预期行为的问题 @Ghost-chu
  - 修复在特定情况下，AutoSTUN 可能错误使用 STUN 服务器的 IPv6 地址 @Ghost-chu
  - 修复 AutoSTUN 任一服务器没有返回响应时，结果被设置为 UDPBlocked 而非 Unknown，现在 UDPBlocked 仅在所有 STUN 服务器尝试失败时显示 @Ghost-chu
  更改
  - Install4j 安装包现已升级捆绑 JDK 版本以修复安全性问题 (CVE-2026-91403) @Ghost-chu
  - 升级了其它依赖项 @Gaojianli
  安全性改进
  - 由官方打包的所有 PeerBanHelper 软件包现在开启 -Dcom.sun.net.ssl.checkRevocation=true -Dcom.sun.security.enableCRLDP=true 对证书吊销进行验证，以缓解由 eMudhra intermediate CA certificates 带来的安全性问题 @Ghost-chu
