ShortDescription: Audio control center for gamers - per-app mixer with ChatMix, headphone EQ, game profiles, sidetone and an AI noise-suppressed microphone.
Description: |-
  GamersEqualizer is an audio control center for Windows, built for gamers. It runs as a Windows
  audio effect (APO) on your real devices, so it works in every app: no virtual sound card, no
  network access.
  - Per-app mixer with Game, Chat, Media and Mic channels and a ChatMix slider.
  - Parametric headphone correction EQ that stacks with game profiles; AutoEQ and SteelSeries
    Sonar profile import.
  - Low-latency microphone chain: echo cancellation and AI noise suppression (RNNoise,
    DeepFilterNet 3, DPDFNet), voice EQ and leveler.
  - Sidetone with its own noise suppression and EQ.
