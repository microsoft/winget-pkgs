ShortDescription: >
  Fast PHP language server with deep type intelligence. Generics, Laravel, PHPStan annotations.
  Ready in an instant.
Description: >
  A fast, lightweight PHP language server written in Rust. Ready in seconds, uses a fraction of the
  RAM other language servers need, and stays responsive throughout. No indexing phase, no waiting.
