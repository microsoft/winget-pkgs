ShortDescription: An accessible, text-based, lightweight weather app that makes it fast and simple to get the forecast and urgent alerts whenever you need them.
Description: |-
  Weatherspell shows current conditions, the forecast and urgent weather alerts for any place in the world, as clear text you can read, arrow through and copy. It's built keyboard-first and screen-reader-first, for anyone who wants the weather in a simple and straightforward way. It's a single executable, with no account or API key needed.
