ReleaseNotes: "### Changelog:\n• Implement images fallback download when Steam API key won't retrieve them correctly.\n• Implement Achievement Enabler by Roschach96 from Settings. Credit goes to Roschach96.\n\t1. Choose Download to install the AchievementEnabler official release. Check for updates retrieves new releases.\n\t2. Select Adapters. For additional adapter files, check the forum post and extract the required adapter files \"ColdClient+R1+R2 Adapter files\", \"Origin emu Adapter file\" into the downloaded folder. Use Open folder to open that location, then confirm that the adapters are prepared.\n\t3. Before continuing with Steam or Ubisoft：create %SystemDrive%\\steamcmd\\_AchievementEnabler\\dummy_account.txt. Put the username of a throwaway Steam account on the first line and its password on the second line. EA, Epic, and GOG do not require this file.\n\t4. Choose the game installation folder and press Start. Answer the original prompts with Send answer, or use Send key for a choice that does not require Enter. Terminal details shows the full interactive output.\n• Implement Quick-Start from Tray Menu. Displayed last 5 Played games.\n• Implement Show Screenshot and Show Record when right click on unlocked achievement from App or Overlay.\n• Implement Find Executable based on Configs and Find All Executables on Settings - Folders.\n\t- Automatically generated configs also try to locate the game's executable using available launch metadata and local installation folders. \n\t- For existing configs without an Executable location, but with Process Name completed use the **search icon** inside the Executable field or **Find Executable** in the Dashboard right-click menu. Multiple candidates require a choice.\n\t- For existing configs without a Process Name completed, Regenerate Schema will complete the Process Name field and Executable field on the Config.\t\n\t- Settings → Folders → Find all games executables searches existing configs with an empty Executable field, shows progress and supports cancellation. \n\t\tOnly confident matches are saved; ambiguous results remain unchanged. Search locations are temporary and are **not added to Watched Folders**. \n\t\tRecognised Achievement Enabler launchers (ColdClient, Epic exchange-code launchers and GOG server launchers) take priority over their original game executable while retaining the game's process for playtime.\n• Implement more images downloadable sources.\t\t\n• Implement official PSN platinum trophy names for Platinum Notifications.\n\t- When a new config is generated it will search after the official Platinum information and update if exists or add the new Platinum achievement data on the Achievements list.\n\t- For existing Configs, Find Platinum button is available next to Refresh Rarity button. This will search Platinum for selected config, update or add it on the list. Regenerate Schema also include this feature.\n• Implement new options on Dashboard filters：Recently played, Recent unlocks and Almost completed. Max number can be set in **Settings → Customisation → Rendering**\n• Implement Recording integration with GPU software like Nvidia/AMD Instant Replay. Make sure to read the notes after selecting the GPU version.\n• Implement Dashboard Customisation, **Settings → Customisation → Dashboard appearance**.\n\t- 3D effects on Dahsboard Cards. Hover over config for 3D effects or hold R2 + D-pads or Left Stick for Controller\n\t- Contextual Background. Shows Game image when hover over the Dashboard card.\n\t- Game Preview. Shows game description, Release Date, Genres, Last Unlocked achievements and Captured Screenshots and Records.\n\t- Custom cards layout.\n\t- Show On-Screen Keyboard. Displayed a virtual keyboard when select a text field improving the controller navigation.\n\t- Controller/Keyboard hint on the Dashboard bottom.\n• Implement Minimize to tray on Play. **Settings → Customisation → Startup** to enable it.\n• Implement Overlay opacity and background transparency options in **Settings → Customisation → Rendering**.\n• Implement Pin on Top for Achievements table and overlay when right click on the achievement.\n• Create Manual Config is disabled by default since cause confusion. Settings - Advanced - Tweaks to enable it.\n• Bugfix on controller and keyboard shortcut navigation.\n• Bugfix on Progress notifications stealing game focus and animation not working correctly on some presets.\n• Bugfix when app is not closed correctly when New install is done at the same time app is runnig.\n\nVirusTotal：SHA-256: d1b7c882a310dc97925d69b7ca50864b05bf01a597a8b4c3e0eebe3093553b4d"
