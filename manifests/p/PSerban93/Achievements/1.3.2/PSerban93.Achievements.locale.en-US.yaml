ReleaseNotes: "### Changelog:\n• Bugfix on Records for older Windows Versions.\n• Bugfix on Windows Native Notifications not displaying the images.\n• Bugfix on Notifications shows in English when game languages contains latam instead of LATAM.\n• Bugfix on watcher. Schema is no longer identify as achievements unlocked files.\n• Add compact mode on Settings pop-up. Enabled by default, can be turn off from Settings - Advanced - Tweaks\n• Add X & Y offsets options on Settings - Notifications for tweak the position based on the presets.\n• Extend support for more PS4 Recomp games that support achievements. [https://framesgames.com/ps4-native-pc-ports-wave/]\n• Extend support for more X360 Recomp games that support achievements.\n• Improve XLiveLessNess support based on the latest changes.\n• Implement Playtime edit from the application.\n• Implement Monitor selection for screenshots and records.  \n\t- Choose the monitor for animated notifications, screenshots and recordings in Settings → Notifications → Notification Toggles.\n• Implement Last Played filter. \n\t- Need the Process Name inside the config to be completed in order for this to work.\n• Implement PS3 Recomp support.\n• Removed Chromium browser used for schema fallback and reduce installed size.\n• Improve fallback schema generation and rarity generation.\n• Replace deprecated packages.\n• Implement Progress notification option to be diplayed on existing presets.\n• Improve Manual achievement changes:\n\tSelect one or more achievement rows and right-click to open the actions.\n\t\t- Mark as Manually Unlocked adds a local manual unlock. Clear Manual Unlock removes that override.\n\t\t- Mark as Manually Locked resets only the selected achievement records in a supported local unlock file and updates the app's cache. Close the game before confirming.\n\t\t- Restore Last Achievement Backup is available when a backup matches the selected config, source and profile.\n\nVirusTotal：SHA-256: 4f6fd0860abd544ef62947035dcf427dd48491b3d88e3d5f7804c950acfb4a71"
