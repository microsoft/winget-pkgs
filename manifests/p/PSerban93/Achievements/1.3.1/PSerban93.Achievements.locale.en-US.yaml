ReleaseNotes: "### Changelog:\n• Add \"UniverseLan\" as default location.\n• Separate Global Achievements languages from Config achievements languages. \n\t- Global Achievements languages can be set from Settings - General.\n• Add Achievements Language selection config-based on Dashboad right-click menu.\t\n• Add resize support using draggable corners on Settings pop-up.\n• Rename Guide button into Help, to be more visible.\n• Replace Game Cover images from header to steamgriddb heros images.\n• Implement switch to trophy mode option replacing rarity based achievements.\n• Implement Collection creation on dashboard.\n• Implement Landscape format on Dashboard configs.\n• Implement Landscape Redownload Cover from multiple sources.\n• Implement Landscape Local Image selection.\n• Implement Customisation Settings for Theme and Notifications presets.\n\t- Existing Presets and Theme can be customized on Settings - Customisation.\n\t- New Presets can be created based on SAN logic directly from Achievements.\n\t- All credits go to SAN and his customisation logic.[https://github.com/SteamAchievementNotifier/SteamAchievementNotifier]\n\t- On Notification Tab the Achievement scale and duration has been set for every Notificatione type. \n\t          Note：Manually set on Achievement scale and duration can be reset after update and first boot. Need to be readjusted.\n• Implement Backup and Restore Profile functions.\n• Click on Hidden Description shows the Description on main table and overlay when Show Hidden Description option is off.\n• Implement RUNE Uplay Support. Note：Manually add Documents\\RUNE\\Ubisoft Connect folder on Settings - Folder.\n• Improve Epic detection to identify the game also by epic_product_id, epic_catalog_item_id and epic_app_name id.\n• Invalids appids or appids without achievements will be automatically add to blacklist if schema generation return 0 achievements.\n• Improve video recording logic.\n• Improve screenshot logic to take the photo when text is fully loaded.\n• Implement app signature and adjust logic to reduce Virus Total to identify as malicious. [SHA-256：b39b58626c57ec8dd16a4614cef1390bb49f58ab7db379590fd1e0ab472fefdc]\n• Redesign Main Screen and Dashboard.\n• Implement KytyPS5 support.\n\t- Add KytyPS5 emulator location on Settings - Folders.\n• Implement X360 Recompiled support.\n\t- Add X360 Recompiled game location on Settings - Folders.\n• Implement PS4 Recompiled support.\n\t- Add PS4 Recompiled game folder location on Settings - Folders. For now only Supermedo's recomp projects are supported [God of War III Remastered, Bloodborne, Uncharted Collection, MediEvil]\t\n• Implement The Legend of Zelda：Link's Awakening DX HD port.\n\t- Add game folder on Settings - Folders.\n• Improve screenshot logic to take the photo when text is fully loaded.\t\n• Improve Uplay readings in case of prefix. Identify achievements files with Prefix or without it.\n• Add Overlay filters. This will change also the table from main table inside app.\t\n• Bugfix on multiple 'Tracked Steam account' setting."
