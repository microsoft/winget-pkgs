ReleaseNotes: "### Changelog:\r\n• Improve Booting process stability.\r\n\t- First boot can take longer until snapshot is saved locally from app memory.\r\n• Implement Third-Party Overlay Widget for Xbox Game Bar downloadable from MS Store. Quick link on Settings.\r\n\t- Achievements app will communicate with the overlay and display the achievements table. \r\n\t- If Game Bar Notification is selected on presets dropdown, the Achievements app will send the information to the Overlay Widget and shows the notifications on native Game Bar notificaiton.\r\n\t- Game Bar notificaiton does not support local images. Achievements images are not displayed on the notifications.\r\n\t- Notification possition can be configured from Game Bar - More Settings - General.\r\n\t- Known limitation：Xbox Game Bar notifications may not appear in games running in true exclusive fullscreen mode, even though the notification sound is played. This is a limitation of Xbox Game Bar. Borderless fullscreen or windowed mode is recommended for reliable notification display.\r\n• Implement support for achievements language based on the game config.\r\n• Implement support for remebering resized window size on startup.\r\n• Implement Stats screen on Settings that displays 360 summary for total achievements and more.\r\n• Ignore leading articles in sort (A/An/The) is now applicable on Configs dropdown when the option is enabled.\r\n• Bugfix when drag and moving the app is blocked when pop-up are displayed.\r\n• Bugfix on Settings close button.\r\n• Bugfix on Dashboard game selection when two configs share the same internal name and platform.\r\n• Bugfix on Xenia not generate all the achievements available."
