ReleaseNotes: "### Changelog:\r\n• Add support for Wemino's Dead Space 2 and Alice Madness Return achievements mods. \r\n\t\t- Game folders needs to be added on Settings - Folders.\r\n• Add Recording support for Achievements. Can be activated on Settings - General on Achievements Recording. \r\n\t\t- Recording captures use Windows Graphics Capture through the open-source windows-capture [https://github.com/NiiightmareXD/windows-capture]\r\n• Add HDR screenshot/records support option. Can be activated on Settings - Advanced - Rendering. \r\n\t\t- HDR captures use Windows Graphics Capture through the open-source windows-capture [https://github.com/NiiightmareXD/windows-capture]\r\n• Add support for XLiveLessNess achievements.\r\n\t\t- Add the game folder that contain the XLLN emu on Settings - Folders. Will detect the game, creates the config and set the watcher to the achievements location.\r\n• Add support for RetroAchievements achievements.\r\n\t\t- Connect to RetroAchievements on Settings - Advanced and Import the library. This will not contain auto selecting function for configs. Need to select the config manually from the app.\r\n• Add \"R1 UplayEmu Saves\" as default location.\t\r\n• Add Changelogs and Logs tabs on Settings.\r\n• Add auto-deselect when the game process is identifying as closed.\r\n\t\t- If the config does not contain the Exe Name or is selected manually, or will be auto-select by the watcher (when the achievements files changed) the config will not be auto-deselect.\r\n• Add support for FINAL FANTASY VII (2013) achievements.\r\n\t\t- On Documents/FINAL FANTASY VII add next to save00.ff7 a steam_appid.txt file with 39140 inside. Add this location on Settings - Folders. \r\n• Reduce Install size by removing unnecessary copy of playwright.\t\r\n• Bugfix on uplay-steam.json not updating.\r\n• Bugfix when new uplay game is added in uplay-steam mapping on boot the config generation is not recognize it until reboot.\r\n• Bugfix on screenshot being saved under wrong config name."
