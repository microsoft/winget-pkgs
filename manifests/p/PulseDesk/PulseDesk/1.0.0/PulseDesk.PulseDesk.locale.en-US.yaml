ShortDescription: "Free Windows system monitor: network speed, CPU, GPU, memory, disk. Portable, no install, no telemetry."
Description: |
  PulseDesk is a lightweight Windows desktop system monitor. It shows real-time upload/download speed with history charts, daily traffic totals, CPU usage and frequency, memory usage, GPU utilization (Intel/NVIDIA/AMD), and per-disk usage.

  Features:
  - Single portable exe, no installation, does not write to the registry
  - 6 skins with 12 customizable colors, custom background image
  - 8 interface languages: Chinese, English, Japanese, Korean, German, French, Spanish, Russian
  - Desktop floating window: always-on-top, adjustable opacity, click-through
  - Runs in the system tray; closing the window hides it instead of exiting
  - No network access, no telemetry, no account required

  Requires Windows 10 or 11 (64-bit).
