ShortDescription: "Windows 桌面系统监控：网速、CPU、GPU、内存、硬盘，绿色单文件，无需安装。"
Description: |
  PulseDesk 是一款轻量的 Windows 桌面系统监控工具，实时显示上传/下载速度与历史曲线、
  今日累计流量、CPU 使用率与频率、内存占用、GPU 利用率（支持 Intel 核显、NVIDIA、AMD）
  以及各硬盘使用率。

  特性：
  - 单文件绿色 exe，双击即用，不写注册表，不联网
  - 6 套皮肤，12 项颜色可自定义，支持自定义背景图
  - 8 种界面语言：中/英/日/韩/德/法/西/俄
  - 桌面悬浮窗：可置顶、调透明度、鼠标穿透
  - 托盘常驻，点关闭是隐藏而非退出
  - 无遥测、无需账号

  系统要求：Windows 10 / 11（64 位）
