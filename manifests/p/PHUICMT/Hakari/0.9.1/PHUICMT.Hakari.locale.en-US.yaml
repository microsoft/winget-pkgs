ShortDescription: Taskbar meter and dashboard for Claude Code usage, cost and limits.
Description: |-
  Hakari puts your Claude Code usage on the Windows taskbar: cost today, 5-hour and weekly
  limits, and burn rate. It adds up every place you use Claude Code (Windows, WSL, extra
  config folders) and every account, and has a dashboard for daily cost, models, projects
  and sessions. It reads token counts from local logs only, never prompts or replies.
