- database-client
- pgadmin
ReleaseNotes: |-
  - pgjumbo 1.0.3: ready for PostgreSQL 19.
  - Publications of all sequences, or of all tables except some, and subscriptions made with a foreign server are shown, scripted and changed correctly on 19.
  - A disabled subscription that keeps dead rows is named in its tab, the Health check and Maintenance: it holds back VACUUM in every database.
  - Maintenance offers REPACK on 19, concurrently or not, with its progress in the status bar.
  - On 19, a password about to expire or a sign-in with MD5 shows where the connection does; the Health check lists roles still on MD5.
  - Explain on 19 shows each step's read-ahead and reads.
  - SQL pgjumbo can't read yet on 19 is marked "not checked", never shown as an error.
  - Statistics say when their counting started; Table health shows autovacuum's own scores on 19, and progress says who started a VACUUM.
  - Top queries counts generic and custom plans; Replication shows the WAL level in effect.
  - Export to JSON, and imports that skip bad rows or leave a bad value empty, saying how many.
  - A CHECK constraint can be switched off and on again on 19, with Review saying what that reads.
  - Restore works with 19 even with older client programs installed; backing up a 19 server needs pg_dump 19.
  - Fixed: the Assistant's conversation can be scrolled while Claude answers, and Maintenance filled in by the Assistant shows the chosen step's settings beside the steps.
ReleaseNotesUrl: https://pgjumbo.com/changes/1.0.3
