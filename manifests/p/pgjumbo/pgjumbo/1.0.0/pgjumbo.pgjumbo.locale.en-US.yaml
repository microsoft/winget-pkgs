ShortDescription: A PostgreSQL desktop client for Windows, macOS and Linux.
Description: |-
  pgjumbo is a desktop client for PostgreSQL 12 to 18, Aurora and RDS. It browses every object, runs queries in a
  Query Tool that shows what a write will touch before it runs, edits data, reviews each change to an object before it
  runs, and brings backup and restore, maintenance, reports, a health check and migrations together in one window.
