ShortDescription: Phone slide remote and on-screen pointer for Windows and Mac.
Description: |-
  PresentSync turns an iPhone, iPad or Android phone into a slide remote and an on-screen pointer. This package installs the Windows desktop app, which runs on the PC that shows the presentation; the phone app is installed from the App Store or Google Play. The phone and computer need to be on the same local network.
  Tap previous or next to change slides in PowerPoint, Google Slides or a full-screen PDF; the phone sends the same slide keys as a keyboard. Swipe to move a pointer on the computer's screen, double-tap for a ripple, or press and hold to draw a line that fades after a few seconds. Other people in the room can scan the meeting QR code and point too.
