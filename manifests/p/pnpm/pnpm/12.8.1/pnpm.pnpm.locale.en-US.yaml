ReleaseNotes: "pnpm 12.8.1 fixes `pnpm install --frozen-lockfile` rejecting lockfiles with injected workspace packages that have peers, restores the executable bit on files of local directory dependencies, makes `pnpm dedupe` converge, and uses less CPU on many-core machines.\n\n### Patch Changes\n\n• `pnpm install --frozen-lockfile` no longer rejects a freshly generated lockfile when an injected workspace package has peer dependencies [#16332](https://github.com/pnpm/pnpm/issues/16332).\n\n• Executable files in a `file:` directory dependency or an injected workspace package keep their executable bit again. Since 12.8.0, pnpm installed these files without the permissions they have in their project.\n\n• `pnpm dedupe` now reaches a stable lockfile when a package's peer suffix is long enough to be hashed. Before, each run could switch that package's key between the hashed and the spelled-out suffix, so `pnpm dedupe --check` always failed [#16331](https://github.com/pnpm/pnpm/issues/16331).\n\n• `pnpm install --frozen-lockfile`, the default in CI, now uses less CPU on machines with more than 8 cores. Warm installs on many-core Windows machines got up to 10% faster. Frozen installs now link with at most 16 worker threads.\n\n• `verifyDepsBeforeRun` no longer reports dependencies as outdated after a filtered install just because `pnpm-lock.yaml` has a newer modification time. It checks the lockfile against the packages that install put in place. Before, `pnpm run` reinstalled the whole workspace with lifecycle scripts on, for example after a Docker `COPY` brought in a lockfile with a newer mtime [#16322](https://github.com/pnpm/pnpm/issues/16322).\n\n  After a filtered install, `verifyDepsBeforeRun` now also checks that the install put the selected projects' dependencies in place. A `node_modules` directory alone no longer counts as proof.\n\n• `pnpm run` and `pnpm exec` no longer install a project that has never been installed and has nothing to install. Such a project declares no dependencies, no peer dependencies that `autoInstallPeers` would fetch, and no install lifecycle scripts. The command now runs without writing `node_modules` or `pnpm-lock.yaml` [#16313](https://github.com/pnpm/pnpm/issues/16313).\n\n• `pnpm update -g --latest` now upgrades globally installed packages beyond their saved version ranges [#16320](https://github.com/pnpm/pnpm/issues/16320).\n\n<!-- sponsors -->\n\n## Platinum Sponsors\n\n<table>\n  <tbody>\n    <tr>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://bit.cloud/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"https://pnpm.io/img/users/bit.svg\" width=\"80\" alt=\"Bit\"></a>\n      </td>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://openai.com/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\">\n          <picture>\n            <source media=\"(prefers-color-scheme：light)\" srcset=\"https://pnpm.io/img/users/openai_dark.svg\" />\n            <source media=\"(prefers-color-scheme：dark)\" srcset=\"https://pnpm.io/img/users/openai_light.svg\" />\n            <img src=\"https://pnpm.io/img/users/openai_dark.svg\" width=\"160\" alt=\"OpenAI\" />\n          </picture>\n        </a>\n      </td>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://notion.com/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"https://pnpm.io/img/users/notion.svg\" width=\"80\" alt=\"Notion\"></a>\n      </td>\n    </tr>\n    <tr>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://coderabbit.ai/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\">\n          <picture>\n            <source media=\"(prefers-color-scheme：light)\" srcset=\"https://pnpm.io/img/users/coderabbit.svg\" />\n            <source media=\"(prefers-color-scheme：dark)\" srcset=\"https://pnpm.io/img/users/coderabbit_light.svg\" />\n            <img src=\"https://pnpm.io/img/users/coderabbit.svg\" width=\"220\" alt=\"CodeRabbit\" />\n          </picture>\n        </a>\n      </td>\n    </tr>\n  </tbody>\n</table>\n\n## Gold Sponsors\n\n<table>\n  <tbody>\n    <tr>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://sanity.io/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\">\n          <picture>\n            <source media=\"(prefers-color-scheme：light)\" srcset=\"https://pnpm.io/img/users/sanity.svg\" />\n            <source media=\"(prefers-color-scheme：dark)\" srcset=\"https://pnpm.io/img/users/sanity_light.svg\" />\n            <img src=\"https://pnpm.io/img/users/sanity.svg\" width=\"120\" alt=\"Sanity\" />\n          </picture>\n        </a>\n      </td>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://discord.com/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\">\n          <picture>\n            <source media=\"(prefers-color-scheme：light)\" srcset=\"https://pnpm.io/img/users/discord.svg\" />\n            <source media=\"(prefers-color-scheme：dark)\" srcset=\"https://pnpm.io/img/users/discord_light.svg\" />\n            <img src=\"https://pnpm.io/img/users/discord.svg\" width=\"220\" alt=\"Discord\" />\n          </picture>\n        </a>\n      </td>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://vite.dev/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"https://pnpm.io/img/users/vitejs.svg\" width=\"42\" alt=\"Vite\"></a>\n      </td>\n    </tr>\n    <tr>\n      <td align=\"center\" valign=\"middle\">\n        <a href=\"https://serpapi.com/?utm_source=pnpm&utm_medium=release_notes\" target=\"_blank\" rel=\"noopener noreferrer\">\n          <picture>\n            <source media=\"(prefers-color-scheme：light)\" srcset=\"https://pnpm.io/img/