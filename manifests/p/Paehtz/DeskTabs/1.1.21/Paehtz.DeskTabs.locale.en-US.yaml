ShortDescription: Clickable tabs for Windows 11 virtual desktops, right on the taskbar.
Description: |-
  DeskTabs puts a tab for every Windows 11 virtual desktop on the taskbar. One click jumps straight to a desktop, each desktop can have its own icon and color, windows can be sent to another desktop by Shift + click or by dragging them onto a tab, and every desktop keeps its window order. An optional time log records how long you spend on each desktop, with a local time report. Built with AutoHotkey v2.
