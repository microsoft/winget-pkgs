ShortDescription: AI right at your cursor. Select text in any app, press Ctrl+G, and ask.
Description: |-
  Cursora is an open-source AI companion that opens a small chat bubble right where your mouse is, with your selection already attached.
  Ask about text in any app, put the answer back with one click, fill forms from your saved details, snip anything on screen, define a word you point at, and translate into Indian languages.
  Use a free model on your own computer (one-click download, works offline) or your own cloud API key. Personal details are hidden before anything reaches a cloud model, and there is no telemetry.
