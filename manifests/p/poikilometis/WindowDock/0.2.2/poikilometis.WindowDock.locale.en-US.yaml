ShortDescription: Group existing terminals, AI agent sessions, and desktop apps into one tabbed workspace.
Description: |-
  WindowDock groups existing application windows into a single workspace. Collect the terminals and apps you already have open into named tabs, arrange them in a grid or a custom split layout, enlarge the one you are working with, and move or minimize the group together. Each application keeps running in its own process.
  Optional hooks show which Claude Code, Codex, or Gemini CLI session is waiting for a reply. Saved groups reconnect running windows, and projects can reopen their commands after a restart.
  The portable Windows x64 build includes the .NET runtime and keeps its settings in a data folder beside the application.
