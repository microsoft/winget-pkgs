ShortDescription: Privacy-first Chromium browser for Windows with no telemetry, accounts or sync.
Description: Matcha Search is a WebView2 browser shell that blocks ads and trackers at the network level before requests leave the machine, forces HTTPS-only, uses DNS-over-HTTPS by default and denies camera, microphone and location requests unless allowed. It supports pinned and scrollable tabs, private windows, a local extension library with verified CRX3 imports, black and white themes, English and Turkish UI, and signed in-place updates. A portable ZIP is published alongside the installer.
