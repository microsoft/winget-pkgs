ReleaseNotes: |-
  PhraseVault 4.0

  Search, read, expand, add, edit, delete, import, and export phrases from the command line, including from AI agents. Turn this on under Settings, Security, Command line and AI agents. Access is Off, Read-only, or Read & write.

  Organise phrases with coloured labels in the editor or from the row menu, and filter the list by label.

  Import Espanso YAML (including forms), Excel CSV in any of its CSV and Unicode text formats, and TextExpander CSV. Preview phrases that need attention before import. Importing again skips unchanged phrases and shows what would change before you overwrite.

  Inserting a phrase keeps images, files, and formatted text on your clipboard.

  Filter by usage, last used, PIN lock, and date added.

  Show/hide hides PhraseVault when it is in front. Esc in an empty search returns you to your app. Ctrl+Enter saves the editor and Settings. Typing while a row is selected continues the search.

  4.0 is a free upgrade. Your 3.x license key keeps working. PhraseVault asks you to accept SPQRK Software License 1.2 once after the update.
