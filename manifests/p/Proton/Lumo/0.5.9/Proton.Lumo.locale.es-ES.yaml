ShortDescription: Un asistente de IA privado con cifrado de acceso cero y sin registros en el servidor.
Description: Lumo es el asistente de IA de Proton centrado en la privacidad. La aplicación de escritorio permite leer y editar archivos locales, ejecutar comandos de shell y utilizar servicios conectados mediante MCP. Puedes configurar cada herramienta para que se ejecute automáticamente, solicite aprobación o permanezca desactivada. Un atajo de teclado global permite hacer preguntas desde cualquier lugar, y las instrucciones programadas automatizan tareas recurrentes. Las credenciales se guardan en el llavero del sistema operativo y las actualizaciones automáticas firmadas mantienen la aplicación al día.
