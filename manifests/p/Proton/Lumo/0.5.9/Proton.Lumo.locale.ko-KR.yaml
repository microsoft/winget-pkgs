ShortDescription: 제로 액세스 암호화를 사용하고 서버 측 로그를 남기지 않는 비공개 AI 어시스턴트입니다.
Description: Lumo는 개인정보 보호를 우선하는 Proton의 AI 어시스턴트입니다. 데스크톱 앱은 로컬 파일을 읽고 편집하고, 셸 명령을 실행하고, MCP를 통해 연결된 서비스와 작업할 수 있습니다. 각 도구를 자동 실행, 승인 요청 또는 비활성화하도록 설정할 수 있습니다. 전역 키보드 단축키로 어디서든 질문하고 예약된 프롬프트로 반복 작업을 자동화할 수 있습니다. 자격 증명은 운영 체제의 키체인에 저장되며, 서명된 자동 업데이트로 앱을 최신 상태로 유지합니다.
