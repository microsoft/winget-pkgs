Description: Lumo هو مساعد الذكاء الاصطناعي من Proton الذي يركز على الخصوصية. يتيح تطبيق سطح المكتب قراءة الملفات المحلية وتحريرها وتشغيل أوامر الصدفة واستخدام الخدمات المتصلة عبر MCP. يمكنك ضبط كل أداة لتعمل تلقائيًا أو تطلب الموافقة أو تظل معطلة. يتيح اختصار لوحة مفاتيح عام طرح الأسئلة من أي مكان، وتساعد المطالبات المجدولة على أتمتة المهام المتكررة. تُحفظ بيانات الاعتماد في سلسلة مفاتيح نظام التشغيل، وتُحدّث التطبيق تحديثات تلقائية موقّعة.
