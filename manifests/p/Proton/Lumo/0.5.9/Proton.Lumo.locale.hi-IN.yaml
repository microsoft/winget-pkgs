Description: Lumo, Proton का गोपनीयता को प्राथमिकता देने वाला AI सहायक है। इसका डेस्कटॉप ऐप स्थानीय फ़ाइलें पढ़ने और संपादित करने, शेल कमांड चलाने और MCP के ज़रिए जुड़ी सेवाओं का उपयोग करने देता है। आप हर टूल को अपने आप चलने, अनुमति माँगने या बंद रहने के लिए सेट कर सकते हैं। ग्लोबल कीबोर्ड शॉर्टकट से कहीं से भी सवाल पूछें और शेड्यूल किए गए प्रॉम्प्ट से बार-बार होने वाले काम स्वचालित करें। क्रेडेंशियल ऑपरेटिंग सिस्टम की कीचेन में रखे जाते हैं और हस्ताक्षरित स्वचालित अपडेट ऐप को अद्यतन रखते हैं।
