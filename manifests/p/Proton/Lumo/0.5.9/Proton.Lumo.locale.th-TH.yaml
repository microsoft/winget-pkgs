ShortDescription: ผู้ช่วย AI ส่วนตัวที่ใช้การเข้ารหัสแบบไม่มีสิทธิ์เข้าถึงและไม่เก็บบันทึกบนเซิร์ฟเวอร์
Description: Lumo คือผู้ช่วย AI ของ Proton ที่ให้ความสำคัญกับความเป็นส่วนตัว แอปเดสก์ท็อปสามารถอ่านและแก้ไขไฟล์ในเครื่อง เรียกใช้คำสั่งเชลล์ และทำงานกับบริการที่เชื่อมต่อผ่าน MCP คุณกำหนดให้แต่ละเครื่องมือทำงานอัตโนมัติ ขออนุมัติ หรือปิดใช้งานได้ แป้นพิมพ์ลัดส่วนกลางช่วยให้ถามคำถามได้จากทุกที่ และพรอมต์ตามกำหนดเวลาช่วยทำงานซ้ำโดยอัตโนมัติ ข้อมูลรับรองจัดเก็บในพวงกุญแจของระบบปฏิบัติการ และการอัปเดตอัตโนมัติที่ลงลายเซ็นช่วยให้แอปเป็นเวอร์ชันล่าสุด
