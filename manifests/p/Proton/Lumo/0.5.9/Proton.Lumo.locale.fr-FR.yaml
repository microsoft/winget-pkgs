ShortDescription: Un assistant IA privé avec chiffrement à accès zéro et sans journaux côté serveur.
Description: Lumo est l’assistant IA de Proton axé sur la confidentialité. L’application de bureau permet de lire et modifier des fichiers locaux, d’exécuter des commandes shell et d’utiliser des services connectés via MCP. Chaque outil peut fonctionner automatiquement, demander une autorisation ou rester désactivé. Un raccourci clavier global permet de poser des questions depuis n’importe où, et les requêtes planifiées automatisent les tâches récurrentes. Les identifiants sont stockés dans le trousseau du système d’exploitation et des mises à jour automatiques signées maintiennent l’application à jour.
