Description: Lumo là trợ lý AI ưu tiên quyền riêng tư của Proton. Ứng dụng máy tính có thể đọc và chỉnh sửa tệp cục bộ, chạy lệnh shell và làm việc với các dịch vụ được kết nối qua MCP. Bạn có thể đặt từng công cụ chạy tự động, yêu cầu phê duyệt hoặc tắt. Phím tắt toàn cục cho phép đặt câu hỏi từ bất kỳ đâu, còn lời nhắc theo lịch giúp tự động hóa tác vụ lặp lại. Thông tin xác thực được lưu trong chuỗi khóa của hệ điều hành và các bản cập nhật tự động có chữ ký giữ cho ứng dụng luôn mới.
