ShortDescription: Un assistente IA privato con crittografia ad accesso zero e senza registri sul server.
Description: Lumo è l’assistente IA di Proton che mette al primo posto la privacy. L’app desktop può leggere e modificare file locali, eseguire comandi shell e utilizzare servizi connessi tramite MCP. Puoi impostare ogni strumento per l’esecuzione automatica, la richiesta di approvazione o la disattivazione. Una scorciatoia da tastiera globale permette di fare domande da qualsiasi posizione, mentre i prompt programmati automatizzano le attività ricorrenti. Le credenziali sono conservate nel portachiavi del sistema operativo e gli aggiornamenti automatici firmati mantengono l’app aggiornata.
