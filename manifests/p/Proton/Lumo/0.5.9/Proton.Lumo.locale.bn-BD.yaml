PackageIdentifier: Proton.Lumo
PackageVersion: 0.5.9
PackageLocale: bn-BD
ShortDescription: জিরো-অ্যাক্সেস এনক্রিপশনসহ একটি ব্যক্তিগত AI সহকারী, যা সার্ভারে কোনো লগ রাখে না।
Description: Lumo হলো Proton-এর গোপনীয়তাকে অগ্রাধিকার দেওয়া AI সহকারী। ডেস্কটপ অ্যাপ দিয়ে স্থানীয় ফাইল পড়া ও সম্পাদনা, শেল কমান্ড চালানো এবং MCP-এর মাধ্যমে সংযুক্ত পরিষেবা ব্যবহার করা যায়। প্রতিটি টুল স্বয়ংক্রিয়ভাবে চলবে, অনুমোদন চাইবে, নাকি বন্ধ থাকবে তা আপনি নির্ধারণ করতে পারেন। গ্লোবাল কিবোর্ড শর্টকাট দিয়ে যেকোনো জায়গা থেকে প্রশ্ন করুন এবং নির্ধারিত প্রম্পট দিয়ে পুনরাবৃত্ত কাজ স্বয়ংক্রিয় করুন। পরিচয়পত্র অপারেটিং সিস্টেমের কীচেইনে সংরক্ষিত থাকে এবং স্বাক্ষরিত স্বয়ংক্রিয় আপডেট অ্যাপকে হালনাগাদ রাখে।
