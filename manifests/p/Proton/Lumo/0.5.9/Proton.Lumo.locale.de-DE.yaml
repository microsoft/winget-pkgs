ShortDescription: Ein privater KI-Assistent mit Zero-Access-Verschlüsselung und ohne serverseitige Protokolle.
Description: Lumo ist der datenschutzorientierte KI-Assistent von Proton. Die Desktop-App kann lokale Dateien lesen und bearbeiten, Shell-Befehle ausführen und über MCP mit verbundenen Diensten arbeiten. Für jedes Werkzeug lässt sich festlegen, ob es automatisch ausgeführt wird, eine Genehmigung anfordert oder deaktiviert bleibt. Ein globales Tastenkürzel ermöglicht Fragen von überall aus, und geplante Prompts automatisieren wiederkehrende Aufgaben. Zugangsdaten werden im Schlüsselbund des Betriebssystems gespeichert. Signierte automatische Updates halten die App aktuell.
