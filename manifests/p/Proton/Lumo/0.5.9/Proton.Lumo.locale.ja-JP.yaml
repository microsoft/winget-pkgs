ShortDescription: ゼロアクセス暗号化を採用し、サーバー側にログを残さないプライベートな AI アシスタント。
Description: Lumo は、プライバシーを重視する Proton の AI アシスタントです。デスクトップアプリでは、ローカルファイルの読み取りと編集、シェルコマンドの実行、MCP を介した接続サービスの利用が可能です。各ツールを自動実行、承認の要求、無効化のいずれかに設定できます。グローバルキーボードショートカットでどこからでも質問でき、スケジュールされたプロンプトで繰り返しのタスクを自動化できます。認証情報は OS のキーチェーンに保存され、署名付きの自動更新でアプリを最新に保ちます。
