Description: Lumo دستیار هوش مصنوعی Proton با اولویت حفظ حریم خصوصی است. برنامه دسکتاپ می‌تواند فایل‌های محلی را بخواند و ویرایش کند، فرمان‌های پوسته را اجرا کند و از طریق MCP با سرویس‌های متصل کار کند. می‌توانید هر ابزار را برای اجرای خودکار، درخواست تأیید یا غیرفعال ماندن تنظیم کنید. میان‌بر سراسری صفحه‌کلید امکان پرسیدن سؤال از هرجا را فراهم می‌کند و درخواست‌های زمان‌بندی‌شده کارهای تکراری را خودکار می‌کنند. اطلاعات ورود در دسته‌کلید سیستم‌عامل ذخیره می‌شوند و به‌روزرسانی‌های خودکار امضاشده برنامه را به‌روز نگه می‌دارند.
