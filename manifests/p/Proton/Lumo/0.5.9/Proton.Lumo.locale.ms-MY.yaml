Description: Lumo ialah pembantu AI Proton yang mengutamakan privasi. Aplikasi desktop membolehkan anda membaca dan menyunting fail setempat, menjalankan arahan shell dan menggunakan perkhidmatan yang disambungkan melalui MCP. Setiap alat boleh ditetapkan untuk berjalan secara automatik, meminta kelulusan atau dinyahdayakan. Pintasan papan kekunci global membolehkan anda bertanya dari mana-mana, manakala prom berjadual mengautomasikan tugas berulang. Bukti kelayakan disimpan dalam rantai kunci sistem pengendalian, dan kemas kini automatik bertandatangan memastikan aplikasi sentiasa terkini.
