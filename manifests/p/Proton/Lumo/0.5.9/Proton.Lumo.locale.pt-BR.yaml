ShortDescription: Um assistente de IA privado com criptografia de acesso zero e sem registros no servidor.
Description: Lumo é o assistente de IA da Proton com foco na privacidade. O aplicativo para desktop permite ler e editar arquivos locais, executar comandos de shell e usar serviços conectados por MCP. Você pode configurar cada ferramenta para executar automaticamente, solicitar aprovação ou permanecer desativada. Um atalho de teclado global permite fazer perguntas de qualquer lugar, e prompts agendados automatizam tarefas recorrentes. As credenciais ficam no chaveiro do sistema operacional e as atualizações automáticas assinadas mantêm o aplicativo atualizado.
