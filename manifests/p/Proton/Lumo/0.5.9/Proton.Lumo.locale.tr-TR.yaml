Description: Lumo, Proton’un gizliliği ön planda tutan yapay zekâ asistanıdır. Masaüstü uygulaması yerel dosyaları okuyup düzenleyebilir, kabuk komutları çalıştırabilir ve MCP aracılığıyla bağlı hizmetlerle çalışabilir. Her aracı otomatik çalışacak, onay isteyecek veya devre dışı kalacak şekilde ayarlayabilirsiniz. Genel klavye kısayolu her yerden soru sormanızı sağlar; zamanlanmış istemler ise yinelenen görevleri otomatikleştirir. Kimlik bilgileri işletim sisteminin anahtarlığında saklanır ve imzalı otomatik güncellemeler uygulamayı güncel tutar.
