Description: Lumo، Proton کا رازداری کو ترجیح دینے والا AI معاون ہے۔ ڈیسک ٹاپ ایپ مقامی فائلیں پڑھنے اور ان میں ترمیم کرنے، شیل کمانڈز چلانے اور MCP کے ذریعے منسلک خدمات استعمال کرنے دیتی ہے۔ آپ ہر ٹول کو خودکار طور پر چلنے، منظوری مانگنے یا غیر فعال رہنے کے لیے ترتیب دے سکتے ہیں۔ عالمی کی بورڈ شارٹ کٹ سے کہیں سے بھی سوال پوچھیں اور طے شدہ پرامپٹس سے بار بار ہونے والے کام خودکار بنائیں۔ اسناد آپریٹنگ سسٹم کی کی چین میں محفوظ رہتی ہیں اور دستخط شدہ خودکار اپ ڈیٹس ایپ کو تازہ رکھتی ہیں۔
