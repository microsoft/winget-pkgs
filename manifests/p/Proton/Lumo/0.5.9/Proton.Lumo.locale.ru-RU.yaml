Description: Lumo — ИИ-помощник Proton с приоритетом конфиденциальности. Настольное приложение позволяет читать и редактировать локальные файлы, выполнять команды оболочки и работать с подключёнными сервисами через MCP. Для каждого инструмента можно выбрать автоматический запуск, запрос разрешения или отключение. Глобальное сочетание клавиш позволяет задавать вопросы из любого приложения, а запросы по расписанию автоматизируют повторяющиеся задачи. Учётные данные хранятся в связке ключей операционной системы, а подписанные автоматические обновления поддерживают актуальность приложения.
