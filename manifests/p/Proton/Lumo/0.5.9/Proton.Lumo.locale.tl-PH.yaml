PackageIdentifier: Proton.Lumo
PackageVersion: 0.5.9
PackageLocale: tl-PH
ShortDescription: Isang pribadong AI assistant na may zero-access encryption at walang mga log sa server.
Description: Ang Lumo ay AI assistant ng Proton na inuuna ang pagkapribado. Maaaring magbasa at mag-edit ng mga lokal na file, magpatakbo ng mga shell command, at gumamit ng mga nakakonektang serbisyo sa pamamagitan ng MCP ang desktop app. Maaari mong itakda ang bawat tool na awtomatikong tumakbo, humingi ng pag-apruba, o manatiling hindi pinagana. Nagbibigay-daan ang global na keyboard shortcut na magtanong mula saanman, at maaaring i-automate ng mga nakaiskedyul na prompt ang mga paulit-ulit na gawain. Nakaimbak ang mga kredensyal sa keychain ng operating system, at pinananatiling napapanahon ang app ng mga nilagdaang awtomatikong update.
