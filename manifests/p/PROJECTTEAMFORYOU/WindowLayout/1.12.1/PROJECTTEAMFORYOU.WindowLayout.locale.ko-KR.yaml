ReleaseNotes: |-
  바탕화면 아이콘: 저장 파일을 잠깐 못 읽을 때(백신·동기화) 저장한 배치가 지워지지 않습니다. 손상된 파일은 백업으로 보관합니다.
  모니터가 바뀌는 도중의 흩어진 아이콘 위치를 기억하지 않고, 탐색기가 멈춰도 아이콘 기능이 막히지 않습니다.
  밝기 패널이 빠른 두 번 클릭에도 정상으로 열리고, 단축키 목록에 새 동작 이름이 제대로 보이며, 입력 중인 모니터 이름이 지워지지 않습니다.
  내부: Tauri 2.12.7 등 라이브러리 업데이트.
