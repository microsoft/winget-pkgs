ReleaseNotes: |-
  안전한 자동 업데이트: 식별 정보를 보내지 않고 작은 latest.json 파일만 확인해 새 버전을 찾고, 서명을 검증한 뒤에만 설치합니다.
  선택형 오류 보고와 “문제 신고” 양식. [보내기]를 누르기 전에는 아무것도 보내지 않습니다.
  59.94Hz, 119.88Hz 같은 정확한 주사율을 반올림하지 않고 그대로 표시하고 적용합니다.
  트레이 메뉴가 12개 언어 모두에서 설정한 언어로 표시됩니다.
