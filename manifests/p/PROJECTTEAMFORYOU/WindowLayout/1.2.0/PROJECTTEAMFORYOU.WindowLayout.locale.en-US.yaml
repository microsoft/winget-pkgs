ReleaseNotes: |-
  Secure automatic updates: WindowLayout checks a small latest.json file for a new version without sending any identifiers, and installs an update only after verifying its signature.
  Optional error reports and a “Report a problem” form. Nothing is sent unless you click Send.
  Exact refresh rates such as 59.94 Hz and 119.88 Hz are shown and applied as they are, instead of being rounded down.
  The tray menu now follows your language in all 12 languages.
