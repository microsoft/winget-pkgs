ShortDescription: Windows 10·11용 무료 창 배치 관리·멀티 모니터 도구.
Description: |-
  WindowLayout은 모든 모니터의 창 위치를 저장했다가 복원하고, 창을 옮기기 전에 복원 결과를 미리 보여 주며, 절전·도킹·재연결 뒤에는 자동으로 창을 되돌립니다.
  모니터 구성(해상도·주사율·배율·켜기/끄기·주 모니터), 모니터 분할, 30가지 이상의 단축키 동작과 영역 맞춤, 디스플레이 프로필 전환, DDC/CI 하드웨어 밝기, 모니터별 배경 화면도 지원합니다.
  자동화: 트리거, 조건 규칙(시간·전원·Wi-Fi·모니터·잠금 해제), Stream Deck·작업 스케줄러·스크립트용 명령줄. 선택 기능으로 제목 표시줄 단추, 끌어서 영역에 놓기, 모니터별 창 전환이 있습니다.
  진단, 단축키 충돌 확인, 자동 백업이 있는 백업·복원, 로컬 네트워크 전용 휴대폰 원격, 보조 모니터 작업 표시줄(베타)도 있으며 휴대폰 원격과 작업 표시줄은 기본으로 꺼져 있습니다.
  기본 오프라인, 계정·텔레메트리·광고 없음. 선택형 AI 어시스턴트는 기본으로 꺼져 있습니다.
