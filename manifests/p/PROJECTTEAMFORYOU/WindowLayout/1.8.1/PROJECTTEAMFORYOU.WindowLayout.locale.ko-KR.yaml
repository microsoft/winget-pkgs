ReleaseNotes: |-
  장면: 키 하나로 책상 전체를 바꿉니다. 디스플레이 프로필, 모니터 입력, 모니터별 밝기, 창 위치 프로필을 한 이름으로 묶어 단축키, 트레이 메뉴, 트리거, 명령 팔레트, 명령줄(--scene "Sim racing")로 그 순서대로 적용합니다. 단계마다 결과를 알려 주고, 실패한 단계는 실패로 표시합니다.
  게임 모드(기본 꺼짐): 레이싱 게임 같은 프로그램과 장면을 지정하면, 프로그램이 시작될 때 장면을 적용하고 마지막 프로그램이 끝나면 화면 구성, 모니터 입력, 밝기를 원래대로 되돌립니다.
  밝기 화면: [원래대로 되돌리기]로 모든 모니터의 소프트웨어 디밍을 한 번에 끕니다(검은 화면·포커스 페이드 포함). [되돌리기 취소]도 있습니다. 화면이 너무 어두워 보이지 않으면 긴급 해제 단축키 Ctrl+Alt+Shift+0(변경 가능)이나 트레이 메뉴의 "디밍 끄기"를 쓰세요. WindowLayout 이 비정상 종료된 뒤에는 저장된 디밍을 자동으로 다시 켜지 않습니다.
  DDC/CI 모니터 제어 추가: 대비, 색상 모드, 스피커 음량, 음소거, 모니터 전원(대기·끄기는 먼저 확인). 모니터가 제공하지 않는 항목은 이유와 함께 흐리게 표시됩니다.
  MCP: 새 도구 apply_scene(이름으로 장면 적용)과 get_monitor_inputs(모니터별 현재 입력) 추가, list_profiles 가 장면도 알려 줍니다.
  작업 표시줄에 항상 표시(기본 켜짐): 창을 닫거나 최소화 상태로 시작해도 작업 표시줄 단추가 남고, 트레이 메뉴의 '종료'로 끝냅니다.
