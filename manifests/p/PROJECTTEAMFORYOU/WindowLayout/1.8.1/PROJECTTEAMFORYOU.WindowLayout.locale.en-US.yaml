ReleaseNotes: |-
  Scenes: switch the whole desk with one key. A scene bundles a display profile, monitor inputs, brightness for each monitor and a window profile under one name, and applies them in that order with a hotkey, the tray menu, a trigger, the command palette or the command line (--scene "Sim racing"). Every step is reported, and a step that fails is shown as failed.
  Game mode (off by default): name the programs, for example your racing sim, and pick a scene. When one of them starts, the scene is applied; when the last one quits, the displays, monitor inputs and brightness go back to how they were.
  Brightness page: "Reset to normal" turns software dimming off on every monitor at once (also blackout and focus fade), with Undo. If the screen is too dark to see, press the emergency key Ctrl+Alt+Shift+0 (changeable) or use "Turn off dimming" in the tray menu. After WindowLayout ends abnormally, saved dimming is not turned back on automatically.
  New DDC/CI monitor controls: contrast, color mode, speaker volume, mute and monitor power (standby/off asks first). Controls a monitor does not offer are greyed out with the reason.
  MCP: new tools apply_scene (apply a scene by name) and get_monitor_inputs (each monitor's current input); list_profiles now lists scenes too.
  Always in the taskbar (on by default): closing the window or starting minimized keeps WindowLayout's taskbar button; Exit in the tray menu quits.
