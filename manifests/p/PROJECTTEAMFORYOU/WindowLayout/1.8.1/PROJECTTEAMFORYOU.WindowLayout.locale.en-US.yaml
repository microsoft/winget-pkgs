ShortDescription: Free window layout manager and multi-monitor toolkit for Windows 10 and 11.
Description: |-
  WindowLayout saves and restores where every window sits across all your monitors, previews a restore before anything moves, and brings windows back automatically after sleep, docking or a reconnect.
  It also arranges monitors (resolution, refresh rate, scaling, on/off, main display), splits monitors into areas, snaps windows into zones with 30+ hotkey actions, switches display profiles, sets DDC/CI hardware brightness and sets a different wallpaper per monitor.
  Automation: triggers, condition rules (time, power, Wi-Fi, monitors, unlock) and a command line for Stream Deck, Task Scheduler and scripts. Optional title-bar buttons, drag-to-zone and a per-monitor window switcher.
  Diagnostics, hotkey conflict checks, backup & restore with automatic backups, a phone remote on your local network and taskbars on extra monitors (beta); the remote and taskbars are off by default.
  Offline by default, no account, no telemetry, no ads. An optional AI assistant is off by default.
