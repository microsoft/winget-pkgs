ReleaseNotes: |-
  Switch a monitor's input from the keyboard: change a monitor between HDMI, DisplayPort, USB-C and other inputs over DDC/CI with a global hotkey, a trigger or the command line (--input hdmi1 --monitor 2). Read the current input, save favorite inputs per monitor, and switch back to the previous one.
  Built to be careful: nothing switches until you press a key you set or run a favorite you saved, each monitor waits 2 seconds between switches, vendor-specific codes can be typed in by hand, and the phone remote cannot switch inputs.
  MCP server: Claude Desktop, Claude Code, Cursor and other AI apps can use WindowLayout as a tool — list monitors and profiles and, only for the tools you allow, apply layouts, move the active window or set brightness. Off by default and local only (Settings > MCP).
  Automatic updates (optional, off by default): turn on “Install updates automatically” in Settings and WindowLayout downloads and verifies new versions in the background, then installs them while you are away, after a notice with Cancel and Later. It waits while a full-screen app, a game or a presentation is running.
  Settings and Diagnostics show the update status and any failure, you can stop skipping a version, and your settings are backed up before every install.
