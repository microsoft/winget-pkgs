ReleaseNotes: |-
  키보드로 모니터 입력 전환: 전역 단축키, 트리거, 명령줄(--input hdmi1 --monitor 2)로 모니터를 HDMI, DisplayPort, USB-C 등으로 바꿉니다(DDC/CI). 현재 입력 읽기, 모니터별 즐겨찾기 입력 저장, 직전 입력으로 되돌리기를 지원합니다.
  신중하게 설계했습니다: 직접 지정한 키를 누르거나 저장한 즐겨찾기를 실행하기 전에는 아무것도 바뀌지 않고, 모니터마다 전환 사이에 2초를 쉬며, 제조사 고유 코드는 숫자로 직접 입력할 수 있고, 휴대폰 원격으로는 입력을 바꿀 수 없습니다.
  MCP 서버: Claude Desktop, Claude Code, Cursor 같은 AI 앱이 WindowLayout 을 도구로 씁니다. 모니터·프로필 목록을 보고, 허용한 도구에 한해 배치 적용·활성 창 옮기기·밝기 설정을 합니다. 기본 꺼짐, 이 PC 안에서만 동작합니다(설정 > MCP).
  자동 업데이트(선택, 기본 꺼짐): 설정에서 '자동으로 설치'를 켜면 WindowLayout이 새 버전을 백그라운드에서 내려받아 검증한 뒤, 자리를 비운 사이 취소·나중에 알림을 거쳐 설치합니다. 전체 화면 앱, 게임, 프레젠테이션이 실행 중이면 기다립니다.
  설정과 진단 화면에서 업데이트 상태와 실패 이유를 볼 수 있고, 건너뛴 버전을 해제할 수 있으며, 설치 전에 설정을 자동으로 백업합니다.
