ReleaseNotes: |-
  Desktop icons (new page): save where your desktop icons are as named layouts and restore them with one click, from the tray, a hotkey or the command line (--desktop-icons save|restore).
  “Put icons back after a display change”: WindowLayout remembers the icons for each monitor setup and puts them back when monitors, resolution or scaling change — icons follow their monitor even when it moved.
  Lock icons to a layout (moved icons go back within seconds) and sort the icons of a monitor by name or type, from the left or the right edge.
  Uses Windows’ own shell interfaces — it never reads or writes another program’s memory.
