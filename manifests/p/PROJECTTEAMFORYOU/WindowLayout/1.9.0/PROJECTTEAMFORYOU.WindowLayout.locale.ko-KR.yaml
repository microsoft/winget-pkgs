ReleaseNotes: |-
  업무용 라이선스: 개인 사용은 계속 무료이고, 회사·기관·학교 업무에 쓰실 때는 PC당 1년 라이선스를 windowlayout.com에서 구매해 설정 → 라이선스에 등록합니다. 기능은 잠기지 않으며, 라이선스가 없으면 앱에 “개인용 사용 중”이 표시됩니다.
  구매 페이지의 “WindowLayout에 바로 적용” 단추로 키를 앱에 채울 수 있고, PC를 바꿀 때는 “이 PC에서 해제”로 자리를 옮깁니다. 등록한 PC는 7일마다 한 번 상태만 확인하며, 만료되면 “개인용”과 작은 갱신 안내가 표시됩니다.
  사이트: 내려받을 때 개인용·업무용을 고르고, 업무용은 한국어는 카드(포트원·NHN KCP), 그 밖의 언어는 PayPal로 라이선스를 산 뒤 내려받습니다. 대량 구매 할인과 7일 미등록 전액 환불을 제공합니다.
