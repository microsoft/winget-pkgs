ReleaseNotes: |-
  휴대폰 원격(기본 꺼짐): 같은 네트워크의 휴대폰을 QR 코드나 6자리 코드로 연결한 뒤, 휴대폰에서 창 위치 프로필 복원, 디스플레이 프로필 전환, 밝기·디밍 조절, 모니터 끄기, 활성 창 옮기기를 할 수 있습니다.
  보조 모니터 작업 표시줄(베타, 기본 꺼짐): 모니터마다 그 모니터의 창만 보여 주고 활성 창을 강조하며, 화면 공간을 예약해 최대화한 창이 그 위까지만 커지고, 전체 화면 앱에서는 숨겨지며, 시계를 켤 수 있습니다.
  안전 설계: 원격은 로컬 네트워크에서만 응답하고, 휴대폰마다 해제할 수 있는 전용 키를 쓰며(PC에는 지문만 저장), 프로그램은 절대 실행하지 않습니다. 동의하면 개인 네트워크 전용 Windows 방화벽 규칙도 추가합니다.
