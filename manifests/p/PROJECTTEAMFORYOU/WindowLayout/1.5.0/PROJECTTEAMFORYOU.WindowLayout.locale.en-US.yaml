ReleaseNotes: |-
  Phone remote (off by default): pair a phone on the same network with a QR code or a 6-digit code, then restore window profiles, switch display profiles, set brightness or dimming, turn monitors off and move the active window from the phone.
  Taskbars on extra monitors (beta, off by default): each one shows only that monitor's windows, highlights the active one, reserves its own space so maximized windows stop above it, hides over full-screen apps and has an optional clock.
  Built for safety: the remote answers only on your local network, every phone has its own revocable key (only a fingerprint is stored), it never starts programs, and the app can add a private-network-only Windows Firewall rule with your consent.
