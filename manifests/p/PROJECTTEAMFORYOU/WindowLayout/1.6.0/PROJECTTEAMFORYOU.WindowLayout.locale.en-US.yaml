ReleaseNotes: |-
  Search boxes on hotkeys, profiles and triggers; Undo (or Ctrl+Z) after deleting; clearer empty and error screens with a Try again button.
  Saving a profile under a name that already exists now asks before replacing it, and importing settings always shows a preview first.
  Phone remote: shows which network addresses are not reachable, keeps working when Wi-Fi changes, and offers to remove the old firewall rule after a port change.
