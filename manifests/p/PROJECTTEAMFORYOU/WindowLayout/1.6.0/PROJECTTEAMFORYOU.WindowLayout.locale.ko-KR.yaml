ReleaseNotes: |-
  단축키·프로필·트리거 목록에 검색 상자를 넣었고, 삭제한 뒤 실행 취소(Ctrl+Z)를 할 수 있으며, 빈 화면과 오류 화면에 '다시 시도' 버튼이 생겼습니다.
  이미 있는 이름으로 프로필을 저장하면 바꾸기 전에 확인하고, 설정 가져오기는 항상 미리 보기를 먼저 보여 줍니다.
  휴대폰 원격: 연결되지 않는 네트워크 주소를 알려 주고, Wi-Fi가 바뀌어도 계속 동작하며, 포트를 바꾸면 예전 방화벽 규칙을 지울 수 있습니다.
