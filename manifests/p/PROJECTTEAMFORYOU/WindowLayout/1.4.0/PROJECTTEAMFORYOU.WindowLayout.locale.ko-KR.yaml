ReleaseNotes: |-
  여러 모니터를 쓰기 위한 새 도구 여섯 가지. 모두 선택 기능이며 켜기 전에는 동작하지 않습니다.
  창 위치 프로필 미리 보기: 복원하기 전에 지금 모니터 위에 저장된 창을 이름표 붙은 상자로, 현재 위치에서 옮겨 갈 위치를 화살표로 보여 줍니다. 창 제목은 보이지 않습니다.
  조건 규칙: 시간대·요일, 전원 연결/배터리, 직접 입력한 Wi-Fi 이름, 모니터 수나 특정 모니터 구성, PC 잠금 해제 조건이 모두 맞으면 창 위치 프로필을 복원하거나 디스플레이 프로필을 적용합니다.
  제목 표시줄 단추(선택): 맨 앞 창의 최소화·최대화·닫기 단추 옆에 다음/이전 모니터로, 항상 위, 왼쪽/오른쪽 절반, 모든 모니터에 걸쳐 최대화 단추를 붙입니다. 단추 종류·순서·크기와 제외할 앱을 고를 수 있습니다.
  끌어서 영역에 놓기(선택): Shift(또는 Ctrl·Alt)를 누른 채 창을 끌면 그 모니터의 영역이 나타나고, 놓은 영역에 창이 맞춰집니다. 키를 누르지 않으면 Windows 스냅은 예전 그대로입니다.
  모니터별 창 전환: Alt+`를 누르면 마우스가 있는 모니터의 창만 보여 주고, 다시 누르거나 화살표 키로 고른 뒤 키를 떼면 전환합니다. Alt+Tab은 그대로입니다.
  Stream Deck·작업 스케줄러·바로 가기용 명령줄: WindowLayout.exe --profile, --display-profile, --undo, --move-to-monitor, --brightness, --list. WindowLayout이 실행 중이 아니면 시작한 뒤 명령을 실행합니다.
