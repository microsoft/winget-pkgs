ReleaseNotes: |-
  Six new tools for working across monitors, all optional and off until you turn them on.
  Window-profile preview: before restoring, see the monitors you have now with every saved window drawn as a labelled box and an arrow from where it is. Window titles stay hidden.
  Condition rules: restore a window profile or apply a display profile when all your conditions match — time of day and weekdays, plugged in or on battery, a Wi-Fi network you name, the number of monitors or a specific monitor setup, and unlocking the PC.
  Title-bar buttons (optional): small buttons next to the minimize, maximize and close buttons of the window in front — move to the next or previous monitor, always on top, snap left or right, maximize across all monitors. Pick the buttons, their order and size, and exclude apps.
  Drag to a zone (optional): hold Shift (or Ctrl or Alt) while dragging a window to see the zones of that monitor and drop it into one. Without the key, Windows Snap works as before.
  Window switcher for one monitor: press Alt+` to see only the windows on the monitor under the mouse, then press again or use the arrow keys and let go to switch. Alt+Tab is unchanged.
  Command line for Stream Deck, Task Scheduler and shortcuts: WindowLayout.exe --profile, --display-profile, --undo, --move-to-monitor, --brightness and --list. If WindowLayout isn't running, it starts and then runs the command.
