ShortDescription: Scans, updates and maintains Windows drivers using official sources only.
Description: |-
  Driver Tool scans your devices and installs driver updates only from official sources: Windows Update,
  the Microsoft Update Catalog and hardware manufacturers' own sites. It creates a restore point and backs up
  drivers before updating, can repair problem devices, cleans up old driver packages, manages restore points
  and shows system health (battery, disks, blue screen history). It can also create weekly restore points and
  monthly driver backups automatically, finds updates for installed programs and the NVIDIA graphics driver, clean up disk space and manage startup programs. No ads or bundled software.
