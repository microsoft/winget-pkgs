PackageName: Sürücü Aracı
ShortDescription: Windows sürücülerini yalnızca resmi kaynaklardan tarar, günceller ve bakımını yapar.
Description: |-
  Sürücü Aracı aygıtlarınızı tarar ve sürücü güncellemelerini yalnızca resmi kaynaklardan kurar: Windows Update,
  Microsoft Update Kataloğu ve donanım üreticilerinin kendi siteleri. Güncellemeden önce geri yükleme noktası
  oluşturur ve sürücüleri yedekler; sorunlu aygıtları onarır, eski sürücü paketlerini temizler, geri yükleme
  noktalarını yönetir ve sistem sağlığını (pil, diskler, mavi ekran geçmişi) gösterir. Her hafta geri yükleme
  noktası ve her ay sürücü yedeğini kendiliğinden alır, kurulu programların ve NVIDIA sürücüsünün güncellemelerini bulur, disk temizliği yapar ve başlangıç programlarını yönetir.
  Reklam ve ek yazılım yoktur.
