ShortDescription: Tests whether your memory, and its overclock, is stable. A remake of TM5 that runs its configs.
Description: |-
  TMR (Test Memory R, the R for Rust) tests whether a PC's memory, and its overclock, is stable.
  It remakes TM5 (TestMem5 by Serj), the memory tester used by memory overclockers, for today's
  Windows and hardware with DDR5 in mind, and loads TM5's .cfg files to run the equivalent tests.

  - Each thread tests its own fixed allocation, on huge (1 GB) and large (2 MB) pages locked in
    memory, in user mode with no driver.
  - Most tests come in 128-bit, 256-bit (AVX2) and 512-bit (AVX-512) widths, the widest the CPU
    has by default.
  - TM5's test 0 becomes the seal: all memory is sealed at the start of a cycle and checked at its
    end, so an error in memory no test is touching is still caught.
  - A failed check is rescanned to tell a misread from a wrong stored value, failures are counted
    by bit position, and Windows' hardware error log (WHEA) is watched.
  - Threads are pinned to physical cores and take memory from their own NUMA node, and checks can
    bypass the caches (non-temporal stores, CLFLUSHOPT) so they read DRAM.
  - Switching patterns aimed at the memory bus's width (DDR4's 64-bit channel, DDR5's 32-bit
    subchannels, LPDDR4/5's 16-bit), alongside TM5's.
  - Built-in test plans, results saved as JSON during the run, and a console and a window in one
    tmr.exe.

  Needs a CPU with x86-64-v3 and CLFLUSHOPT (Intel 6th gen Core or AMD Ryzen, and later) and
  Windows 11 or Server 2022 or later; the window needs Windows 11 or Server 2025. An unstable
  overclock can freeze, crash or restart the PC while TMR runs: save your work first.
