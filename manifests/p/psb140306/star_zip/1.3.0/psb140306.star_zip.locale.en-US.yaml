ShortDescription: A light and fast archiver for Windows
Description: |-
  star_zip is a free, lightweight archiver for Windows built with C# and WPF on .NET 8.

  Creates ZIP, TAR, GZ and TAR.GZ archives, and extracts ZIP, TAR, GZ, TAR.GZ, 7z, RAR
  and TAR.BZ2. Handles legacy Korean file names (CP949) as well as UTF-8, and reads
  password protected archives - it asks for the password only when an item you are
  actually extracting is encrypted.

  The interface follows Windows 11 Fluent design with ribbon tabs, a folder tree with
  breadcrumbs, in-archive search, drag and drop, light and dark themes, and optional
  Explorer context menu integration. Safe by default: existing files are kept unless
  you choose to overwrite, and every extraction path is checked against directory
  traversal (Zip Slip), alternate data streams and reserved device names.

  A command line tool (starzip) is bundled in the cli folder.
