ReleaseNotes: "# pdfcpu v0.16.2\n\nHello!\n\nWe ship important security, stability, and PDF compatibility fixes with **no breaking Go API changes**.\n\nBinaries were built with Go 1.27.2, which includes security fixes. \nThe minimum Go version required to build remains 1.26.\nUpgrading is highly recommended!\n\n## Security\n\n• Harden parsing and decoding against excessive work, circular references, malformed fonts, and invalid image parameters.\n  Enforce resource limits and prevent several malformed-input panics.\n• Reduce repeated validation of shared objects and memory allocations when parsing large certificate revocation lists.\n• Correct AES-256 password preparation and owner authentication, encryption revision checks, and extraction permissions.\n• Fix named and Identity crypt-filter handling, crypt-filter length units and validation, and encryption of strings\n  rewritten from object streams.\n\n## Fixes and improvements\n\n• Preserve catalog data, inherited page boxes and resources, shared stamp resources, name-tree values, and named\n  destinations during processing. Correct compressed-object reference renumbering during merging.\n• Fix PDF whitespace, text and hexadecimal-string decoding, inline-image parsing, cross-reference handling, and\n  effective PDF version detection.\n• Improve form field inheritance, checkbox/radio handling, export ordering, JSON matching, list-box clearing, and\n  Unicode text-length checks.\n• Correct CMYK rendering, RGBA image import, Flate/TIFF predictor handling, and Crypt filter pipelines.\n• Fix ToUnicode mappings, TrueType widths and style detection, and XMP date parsing.\n• Complete required standard-font metrics for PDF 2.0 output and enforce required annotation appearances.\n• Strengthen validation of images, graphics values, colour spaces, functions, destinations, PageLabels, and PDF 2.0\n  entries. Restore targeted multimedia compatibility and improve action reporting.\n\n## Compatibility\n\nExisting Go API signatures remain unchanged; supporting packages receive additive exports. Strict validation now\nrejects additional malformed inputs, while applicable relaxed compatibility is retained with notices. PDF 2.0 writes\nreport an error when required annotation appearances are missing; automatic appearance generation remains incomplete.\nEncryption defaults are unchanged.\n\n## Thanks\n\nThanks everyone who opened issues.\nShoutout to @qoke and the IQ Hive team for providing a heavy load of critical fixes for this release."
