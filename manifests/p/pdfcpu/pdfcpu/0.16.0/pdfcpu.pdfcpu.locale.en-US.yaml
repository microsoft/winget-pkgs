ReleaseNotes: "## v0.16.0\n\nThis release updates the Go API and configuration model, improves automation and PDF validation, and includes processing fixes and security hardening.\n\n## Changes since v0.16.0-rc.1\n\n• Protect image buffer allocations against integer overflow and enforce resource limits before decoding each TIFF page.\n• Fix default-configuration handling (#1492)：synchronize access to the cached default configuration and return independent clones to callers.\n\n## Security advisories\n\nThis release includes fixes covered by six security advisories.\n\n• [Integer overflow in image buffer allocation](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-g766-88fx-58h8)\n• [Traditional cross-reference tables bypass configured XRef limits](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-fjh6-rrhv-4g63)\n• [Packed RGB image samples can cause an index-out-of-range panic during image extraction](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-9mmx-88p2-c8c6)\n• [Missing BitsPerComponent can cause a nil-pointer panic during image extraction](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-prvw-v9vv-6966)\n• [Integer overflow in XRef stream /W array can cause denial of service](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-w2hj-54mc-76r4)\n• [Off-by-one revision mapping weakens PDF signature modification reporting](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-7v74-phpq-xq6g)\n\n## Highlights\n\n• **Updated Go API** — Explicit contexts for long-running operations, optional progress reporting, and reusable caller-owned configuration.\n• **Configuration redesign** — Schema-aware loading, explicit initialization and reset, plus read-only and stateless operation.\n• **Automation and container preparation** — Signal cancellation, safer output replacement, password-file inputs, and verified execution under arbitrary user IDs.\n• **Stronger PDF validation** — Improved malformed-input handling, graph-traversal safeguards, and compatibility warnings for selected relaxed-validation decisions.\n• **Clearer signature validation** — Separate reporting of document integrity, certificate trust, revocation, and timestamp evidence.\n• **PDF processing fixes** — Improved resize orientation, rotated watermarks, form appearances, image handling, and LZW decoding.\n• **Smaller Go module** — Approximately 94% smaller in the original packaging comparison. Samples and test fixtures remain in Git but are excluded from module downloads.\n\n\n## Requirements and installation\n\nGo applications require **Go 1.26 or later** and updates to affected API calls. Existing file-backed configurations from **v0.15 or earlier** require an explicit configuration reset.\n\n\n```sh\ngo get github.com/pdfcpu/pdfcpu@v0.16.0\n```\n\n## Before upgrading\n\n### Reset legacy file-backed configuration\n\nExisting v0.15 and older `config.yml` files do not contain the new configuration schema identifier. pdfcpu preserves the\nfile and reports that a reset is required instead of rewriting it automatically.\n\nIf the configuration is not customized, run:\n\n```sh\npdfcpu config reset\npdfcpu config validate\n```\n\nFor an explicit configuration root, use the same root for every command:\n\n```sh\npdfcpu --conf /srv/pdfcpu config reset\npdfcpu --conf /srv/pdfcpu config validate\npdfcpu --conf /srv/pdfcpu config inspect\n```\n\nBefore resetting, back up any customized `config.yml`. After resetting, reapply your settings.\nInstalled user fonts and trusted certificates are preserved.<br>\nNew installations and stateless operation with `--conf disable` need no migration.\n\nSee the [v0.16 configuration upgrade guide](https://pdfcpu.io/getting_started/configuration_v016/).\n\n### Update Go API callers\n\n| Change | Required action |\n|:--|:--|\n| Long-running operations require a `context.Context` | Pass the request or job context, or `context.Background()` when cancellation is not needed. Nil contexts are rejected. |\n| Validation and optimization operations take a final `*api.ProgressOptions` | Pass `nil` when progress events are not needed. |\n| `LoadConfiguration()` now takes options and returns an error | Call `api.LoadConfiguration(api.ConfigurationOptions{})` and handle the error. |\n| Context-free and interim `WithContext`/`WithOptions` variants were consolidated | Use the canonical operation name. |\n\nConfigurations supplied by an application remain caller-owned and can be reused after an operation. Clone a configuration\nbefore applying different settings for another job; do not mutate it concurrently while operations use it.\nPassing `nil` loads the default configuration and may initialize files on disk. For stateless\napplications, explicitly load `api.ConfigurationModeStateless` and pass the returned configuration.\n\nSee [API installation and usage](https://pdfcpu.io/getting_started/install_api/) and the\n[v0.16 migration guide](https://pdfcpu.io/getting_started/configuration_v016/) for before/after examples.\n\n## Configuration and runtime\n\n### Explicit configuration modes\n\n• **Automatic** discovers or initializes file-backed configuration for normal CLI and API use.\n• **Read-only** loads a prepared configuration tree without modifying it.\n• **Stateless** uses built-in settings and the 14 core PDF fonts without accessing configuration files, user fonts or the\n  local certificate store.\n\nThe CLI selects stateless mode with `--conf disable`. <br>\nApplications select a mode through `api.ConfigurationOptions`. <br>\nConfiguration root precedence is the explicit flag, `PDFCPU_CONFIG_ROOT`, then the operating-system default. <br> Normal CLI PDF\ncommands have no read-only-mode flag：prepare the complete tree first and mount it read-only. <br> Go applications can select `api.ConfigurationModeReadOnly` to load existing configuration without modifying files.\n\nThe new commands are:\n\n```text\npdfcpu config init\npdfcpu config list\npdfcpu config inspect [--json]\npdfcpu config validate\npdfcpu config reset\n```\n\nUse\n`pdfcpu config inspect` for configuration paths and effective policy.\n\n### Cancellation and transactional output\n\nThe CLI responds to `Ctrl+C`, `SIGINT` and `SIGTERM`. The first signal requests a clean stop; a second signal terminates\nimmediately. Go callers control cancellation through the context passed to the operation.\n\nCancellation is cooperative, so a large operation may take a moment to reach a safe stopping point. File-producing\noperations stage output before publication. When cancellation or an ordinary write failure occurs before publication,\nan existing destination is preserved and unfinished temporary output is removed.\n\nStdin PDF input and merged form multi-fill output to stdout use the operating-system temporary directory. Replacement\nfiles are staged beside their destination. On supported Unix systems, replacement preserves the destination group or\nfails before publication.\n\n### Password files\n\nUse `--upw-file` or `--opw-file` wherever the corresponding literal password flag is accepted. Supply a password either\ndirectly or through a file, not both. Password files cannot use stdin.\n\nOne trailing LF or CRLF is ignored. Other spaces and line endings remain part of the password. An empty file supplies an\nempty password, except where a non-empty owner password is required.\n\nPassword changes can replace their positional old/new password pair with:\n\n| Command | Old password | New password |\n|:--|:--|:--|\n| `changeupw` | `--upwold-file` | `--upwnew-file` |\n| `changeopw` | `--opwold-file` | `--opwnew-file` |\n\nBoth file options for a password change must be supplied together.\n\n### Resource and network policy\n\n• `maxInputBytes` optionally limits each PDF input, including stdin spooling. Zero remains unlimited.\n• `maxObjectBytes` exposes the existing per-object reader buffer limit. Its default remains 64 MiB.\n• Offline mode now consistently covers remote images, link validation and live CRL/OCSP requests.\n• Outbound image and revocation requests reject loopback, private, link-local, multicast, unspecified and selected\n  special-purpose destinations by default. Trusted private revocation hosts can be configured explicitly.\n\nThese settings limit individual inputs or operations; they are not a total memory, disk or job-time budget.\n\n## Validation\n\n### Compatibility warnings\n\nCompatibility-warning coverage has substantially expanded. Relaxed validation reports selected conditions that strict validation would reject, indicating whether content was accepted, skipped or repaired in memory. These warnings are available through the CLI and structured API reports; `--quiet` suppresses CLI warnings.\n\nGo callers can obtain the same ordered report through `ValidateWithReport`, `ValidateFileWithReport` and\n`ValidateContextWithReport`. Existing error-only validation APIs remain available.\n\nWarning coverage is partial and will expand over time. Some relaxed-validation fallbacks produce no notice, so silence\ndoes not imply strict validation.\n\nStrict validation describes the checks pdfcpu currently implements; it does not certify complete ISO 32000 compliance\nor prove that no bounded low-level reader recovery occurred.\n\n### Expanded validation and malformed-input handling\n\nStronger validation and safer handling of malformed PDFs, including improved bounds checks, cycle detection and error reporting. Relaxed mode adds targeted compatibility exceptions while strict validation retains its requirements.\n\n## Signature-validation evidence\n\nSignature validation now clearly separates integrity, certificate trust, revocation and timestamp evidence from the\noverall local assessment. See the [signature-validation guide](https://pdfcpu.io/core/sign_validate/) for output examples,\nsupported checks and current limitations.\n\n## Distribution and constrained environments\n\nThe Go module now excludes samples and test fixtures while retaining all"
