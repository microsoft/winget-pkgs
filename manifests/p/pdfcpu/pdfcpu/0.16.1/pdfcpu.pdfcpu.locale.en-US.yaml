ReleaseNotes: "## v0.16.1\n\nSecurity and stability update with no public API changes. \nRequires Go 1.26 or later.\n\nThis release fixes a denial-of-service vulnerability in grayscale and Indexed image rendering, including CalRGB palette\nhandling. Processing a crafted PDF could cause an index-out-of-range panic and terminate the calling process if the\npanic was not recovered. \n\nVersions v0.16.0 and earlier are affected.\nApplications extracting or rendering images from untrusted PDFs should upgrade to v0.16.1. \nSee [GHSA-6524-w46v-6399](https://github.com/pdfcpu/pdfcpu/security/advisories/GHSA-6524-w46v-6399).\n\n\nImprovements:\n• Harden PDF parsing, image processing, JSON input handling, and signature-data parsing.\n• Prevent panics when rendering grayscale and Indexed images, including palette bounds and Decode mapping checks.\n• Strengthen external-link checks and reporting of problematic links; redact URL passwords in reports and CLI output.\n• Improve structural validation of embedded files, 3D annotations, and multimedia dictionaries.\n• Report JavaScript and supported media presence during validation without executing content or displaying script code.\n• Report invalid zero-offset xref entries as skipped in relaxed validation and reject them in strict mode (#612).\n• Fix strict validation of PDF dates ending in `Z` (#1493).\n• Update the TIFF dependency to v1.0.7."
