ShortDescription: A free offline Windows widget for studying Japanese vocabulary and kanji.
Description: KanjiWidget keeps Japanese words and kanji visible on the Windows desktop, with readings, meanings, and example sentences. It includes furigana, English and Russian interfaces, FSRS reviews, text import from Anki .apkg decks, custom cards, and active recall. It works offline without ads, accounts, or subscriptions.
