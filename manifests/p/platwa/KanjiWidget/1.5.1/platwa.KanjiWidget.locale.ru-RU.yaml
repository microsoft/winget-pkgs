ShortDescription: Бесплатный офлайн-виджет Windows для изучения японских слов и кандзи.
Description: KanjiWidget показывает японские слова и кандзи на рабочем столе Windows вместе с чтением, переводом и примерами. Поддерживаются фуригана, русский и английский интерфейсы, повторения FSRS, импорт текста из колод Anki .apkg, собственные карточки и режим активного вспоминания. Работает без интернета, рекламы, аккаунтов и подписок.
ReleaseNotes: Убраны неработавшая проверка обновлений и фоновые запросы. Установленная версия осталась видна в настройках. Исправлено повторное скрытие открытого ответа при повторении.
