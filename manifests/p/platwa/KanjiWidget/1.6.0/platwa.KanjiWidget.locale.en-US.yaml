ReleaseNotes: Review buttons in the widget toolbar and Settings, optional local reminders after more than 24 hours without a completed test, and Active Recall by default for new installations. Fixed switch alignment, learning field alignment, clickable cursors, and deck counters after reviews. Existing study progress is preserved.
