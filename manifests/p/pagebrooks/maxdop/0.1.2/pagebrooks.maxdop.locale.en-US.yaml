ShortDescription: An opinionated T-SQL formatter that runs in CI and checks its own work.
Description: |-
  maxdop formats T-SQL using Microsoft's own parser, ScriptDom — the one behind DacFx and SQL
  database projects — so it reads stored procedures, GO batches and SQL Server 2000-era syntax the
  way the server does, rather than guessing from tokens.

  Every format is re-parsed and compared against the input: token stream, syntax tree and comments.
  On any mismatch your original file is returned untouched with a distinct exit code, so a formatter
  bug cannot corrupt your source. Measured across 2,215 real-world files it refused nothing, crashed
  on nothing, and lost none of their 11,261 comments.

  It is one static binary with no .NET runtime to install, and the same binary runs in your editor
  and your build pipeline. Style lives in a .maxdop.json committed next to the code, so a repository
  formats the same way for everyone who opens it.
