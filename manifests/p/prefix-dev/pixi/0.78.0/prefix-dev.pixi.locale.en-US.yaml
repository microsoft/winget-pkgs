ReleaseNotes: |-
  [0.78.0] - 2026-08-28
  ✨ Highlights
  - You can now use the CLI to add path dependencies with the following command:
    pixi add --path ~/dev/pixi pixi
    pixi add --path ~/dev/vinca vinca --pypi
    pixi add --path ~/dev/ros_ws/src/common/package.xml ros-jazzy-common
  - Pixi now can also share the configuration with rattler-based tools like rattler-build and rattler-index.
  - The PEP 723 script support has been improved with better caching and resolution of scripts.
  Added
  - Write manifest platform names instead of pN aliases by @ruben-arts in #6885
  - Rework the terminal output by @Hofer-Julian in #6869
  - Read the shared config layer of rattler-based tools by @Hofer-Julian in #6776
  - Cache and update script resolutions by @manzt in #6893
  - Honor the shared index-config when indexing a channel by @Hofer-Julian in #6896
  - Add --path to the pixi add command by @ruben-arts in #6904
  Changed
  - Solve scripts against the host's virtual packages by @Hofer-Julian in #6865
  - Replace the distro index fetch with a static mapping by @Hofer-Julian in #6881
  - Drop unused InstallChange helpers by @Hofer-Julian in #6897
  - Pin the ROS fixture's macOS compiler to unbreak CI by @baszalmstra in #6906
  Fixed
  - Group legacy purl fallback traces by @baszalmstra in #6886
  - Solve lockless scripts in pixi workspace platform by @Hofer-Julian in #6882
  - Show progress for pixi add and other commands that solve by @Hofer-Julian in #6892
