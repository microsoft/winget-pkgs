ReleaseNotes: |-
  [0.82.0] - 2026-10-13
  ✨ Highlights
  Rich platforms now support AMD GPUs with amdgpu = true to declare GPU presence or amdgpu = "gfx90a" to require a specific GPU architecture.
  pixi global now supports exclude-newer in the global manifest. Set a cutoff date or a duration such as exclude-newer = "7d" to exclude recently published packages from all global environments.
  Added
  - Add exclude-newer to the global manifest by @Hofer-Julian in #7016
  - Use toml edit to modify config by @samrosenf in #6576
  - Automake and autoconf for ros2_canopen by @Timple in #7110
  - Support PIXI_WORKSPACE_ env vars, make PIXI_PROJECT_ env vars legacy by @lucascolley in #7155
  - Add anonymous installation ping to install scripts by @wolfv in #6220
  - Add workload-identity login by @pavelzw in #7180
  - Add a ratchet for into_diagnostic calls per crate by @lucascolley in #7204
  - Add lucas as project co-author by @lucascolley in #7227
  - Add recommended R packages as dependencies by @roaldarbol in #7233
  - Add Rust when SystemRequirements asks for Cargo by @roaldarbol in #7235
  - Support amdgpu in the rich platform table by @baszalmstra in #7144
  - Request the Basilisk audience for prefix.dev login by @nichmor in #7210
  - Automatically try increasing rlimit by @lucascolley in #7253
  - Add version exemptions for exclude-newer by @Hofer-Julian in #7236
  Changed
  - Pin mojo version to 1.0.0 in conda-script example by @aoright in #7048
  - Bump quinn-proto to 0.11.15 by @wolfv in #7103
  - Reuse immutable Git build artifacts without checkout by @baszalmstra in #6887
  - Append newline to .gitignore if missing by @ravindra-RKB in #7122
  - Don't suggest a one-character alias for an unrelated subcommand by @Atishyy27 in #7095
  - Read package.xml expressions with and and or by @ruben-arts in #7181
  - Replace miette::Report with typed errors by @lucascolley in #7200
  - Carry typed names in manifest edit errors by @lucascolley in #7201
