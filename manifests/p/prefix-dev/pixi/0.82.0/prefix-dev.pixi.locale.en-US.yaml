  - Install into R's library on Windows by @roaldarbol in #7234
  - Type the project-defined mapping errors by @lucascolley in #7222
  - Type the HTTP client, activation and env file errors by @lucascolley in #7254
  - Keep the namespace in prefix.dev channel URLs by @alejandrofontan in #7216
  - Type the resolution context errors by @lucascolley in #7257
  Documentation
  - Fix snippet include syntax for Python conda-script tutorial by @aoright in #7021
  - Use backend.channels instead of the deprecated package.build.channels by @Hofer-Julian in #7076
  - Mention bioconductor limitation by @jpintar in #7147
  - Add line break after overview header in README by @DARPrA2908 in #7156
