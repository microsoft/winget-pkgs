  - Sort source record dependencies and constraints for lockfile determinism by @aoright in #7011
  - Update git dependencies sharing same repository and reference together by @aoright in #7023
  - Allow removing current platform in pixi workspace platform remove by @aoright in #7026
  - Accept custom per-package index in satisfiability for unindexed requirements by @aoright in #7024
  - Preserve error chain and diagnostics on build dispatch failure by @aoright in #7028
  - Pass stored credentials to the OCI middleware by @chris-thomas-dev in #7014
