ShortDescription: FPS counter and hardware monitor for Windows 11 in a click-through overlay widget.
Description: |-
  FrameHeat shows the temperature and load of the CPU, graphics card, video memory, RAM and disks, together with the frame rate of the game you are playing and, if you like, your network speed and ping, in a panel that stays on top of games and other windows. A reading turns yellow as the temperature nears its limit and pulses red once the limit is passed. Nothing is injected into the game.
