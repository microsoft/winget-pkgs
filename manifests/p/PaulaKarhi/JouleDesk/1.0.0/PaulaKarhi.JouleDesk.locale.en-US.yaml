ShortDescription: See what your PC's electricity use costs, with Finnish spot electricity prices. No smart plug needed.
Description: |-
  JouleDesk shows how much power a Windows PC draws and what that costs, live, per day and per month. The energy is
  priced with Finnish spot electricity prices or with your own contract. It needs no smart plug or other extra
  hardware: the processor's power comes from the Windows energy meter counter, the NVIDIA graphics card's power from
  its driver, and the rest is estimated and labelled as such. Everything stays on the PC.
