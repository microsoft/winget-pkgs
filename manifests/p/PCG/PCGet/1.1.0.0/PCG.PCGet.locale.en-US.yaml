ShortDescription: Find, install, update and uninstall Windows applications with the Windows Package Manager.
Description: |-
  PCGet is a Windows app for managing applications through the Windows Package Manager (WinGet).
  It lists available updates and installs them one by one or all at once, shows installed applications
  and uninstalls them, and searches WinGet sources to install new applications. It can check for
  updates in the background from the notification area and start with Windows.
