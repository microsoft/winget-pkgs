Description: Kazumi 是一个使用 Flutter 开发的基于自定义规则的番剧采集与在线观看程序，支持流媒体在线观看、弹幕和基于 Anime4K 的实时超分辨率。它支持使用基于 XPath 语法的最多五行选择器构建自己的规则，并支持规则导入与规则分享。
