ReleaseNotes: |-
  This release addresses a severe bug in the Linux builds that caused the renderer to crash upon opening a file. Windows and macOS users can skip this release if they like; nothing will be different for them.

  Sorry for letting this through! We have updated our Linux smoke tests to be more thorough to ensure this sort of issue cannot happen again.

  ### Pulsar

  - Rework Linux builds to use a manylinux_2_28 image with gcc-toolset [@savetheclocktower](#1686)
  - Ensure Playwright tests run serially [@savetheclocktower](#1689)
