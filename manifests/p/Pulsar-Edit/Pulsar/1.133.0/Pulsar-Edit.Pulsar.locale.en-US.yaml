ReleaseNotes: |-
  ## Pulsar v1.133.0：El Niño edition

  Greetings from the west coast of the US, where I’m writing this in the middle of a sudden rainstorm! Much like this year’s El Niño, the 1.133.0 release of Pulsar is unusually strong; unlike this year’s El Niño, it probably won’t have any effect on agricultural yields or mountain snowpack.

  Since you’ve had to wait longer than usual for this release, you’re rewarded with a larger-than-usual list of new features, many of which we’re quite excited about:

  New `terminal` features (including hyperlink support and clickable file paths), a second implementation of filesystem watching, a new “deleted” file state to represent buffers whose backing files have been deleted, and another Electron upgrade to deliver new web features.

  We are also **looking to onboard new contributors**! We always have been — but with some recent changes in the core team membership, we realized we need to make more of an explicit push. **The main bottleneck these days is code reviewers** — so if you can spare some time to review and verify contributions, it’d go a long way toward increasing our velocity and the frequency of Pulsar releases. (It’s also a great way to learn the codebase and ramp up to making your own contributions!)

  If this sounds appealing, [jump into our Discord](https://discord.com/invite/7aEbB9dGRT) — we’re more than happy to help you get started.

  As always, a huge thank you to our community, contributors, and donations.
  Happy coding, and see you amongst the stars!
  — The Pulsar Team
