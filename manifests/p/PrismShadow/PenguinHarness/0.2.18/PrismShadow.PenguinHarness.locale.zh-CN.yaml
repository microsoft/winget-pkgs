PackageIdentifier: PrismShadow.PenguinHarness
PackageVersion: 0.2.18
PackageLocale: zh-CN
ShortDescription: PenguinHarness 桌面端：开源的 Agent 自进化框架。
Description: |-
  PenguinHarness 是开源的 Agent 自进化（recursive self-improvement, RSI）框架。模型保持不变，进化的是 Harness：提示词、Skill、工具和钩子。
  Default、OPRO、APE、ACE 和 AWM 都以插件形式提供，跑在同一套内置 Benchmark、记分板和快照上。选一个算法，选一个 Benchmark，一个 Agent 就能一轮一轮地优化另一个 Agent。
