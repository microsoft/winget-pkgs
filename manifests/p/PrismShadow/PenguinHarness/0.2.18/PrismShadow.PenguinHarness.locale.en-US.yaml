ShortDescription: The desktop app for PenguinHarness, an open-source framework for agent self-evolution.
Description: |-
  PenguinHarness is an open-source framework for agent self-evolution (recursive self-improvement, RSI). The model stays fixed; the harness evolves: prompts, Skills, tools and hooks.
  Every RSI algorithm ships as a plugin - Default, OPRO, APE, ACE and AWM - and runs on the same built-in Benchmarks, scoreboard and snapshots. Pick an algorithm, pick a Benchmark, and an agent improves another agent round by round.
