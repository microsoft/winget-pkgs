ReleaseNotes: |-
  Simplifying the app
  - Get started with Startup Manager more easily
    Learn what each Startup Manager section does with a new onboarding pop-up that helps you find the right tools faster.
  - Easier to read and easier to use
    We made parts of the app easier to read and improved keyboard navigation, screen reader support, and chart accessibility to help more people use CCleaner with confidence.
  - Improved Korean text display
    We updated the Korean font styling to make text easier to read.
  Keeping you safe
  - Safer links and file-opening actions
    We strengthened how CCleaner handles links and file-opening actions to help protect you from unsafe or unexpected behavior.
  - Stronger secure app communication
    We improved how parts of the app communicate behind the scenes to make key actions more secure.
  Fixing bugs
  - Fixed a theme-related stability issue
    We fixed a problem that could cause part of the app to fail while watching for theme changes.
