ReleaseNotes: |-
  What's New
  - tc now adds a .txt extension to new files left without one.
  - The CLI now automatically switches configurations still pointing at the old server address to the current one.
  - Uploads now recover automatically when the security scanner reports a stale signing key, not just when it reports itself unavailable, and such uploads are retried automatically instead of failing outright.
  - The cp, mk, mv, rs, tc and ul commands now seal parent references on every write to keep folder structure confidential.
  - cp now copies items with unreadable names under the source name instead of skipping them.
  - hd now explains that you must stop sharing a folder before you can hide it.
  - The pl command now stores an access proof and an owner-recoverable copy of the link key when creating public links.
  - fd now warns when a search hits its result limit, so you know to narrow the pattern or path or raise --limit.
  - rs now shows the correct deletion time for items when selecting a trashed item to restore.
  - ct now supports a --from option to start reading a file at a given line, combinable with --head to read a range.
  - The sr command help no longer lists an accept mode that does not exist for sharing.
  - File and folder names mounted via the sync client now accept letters from any language with accents, emoji, and the symbols & and !.
  - The mount daemon status now reports the number of failed downloads and watcher problems, making mount issues easier to recognize.
  - Sync now holds a delete when many files vanish from a mount at once, instead of deleting them from the cloud right away.
  - Downloads that run out of disk space are now retried instead of being treated as a permanent failure.
  - Mounted files that are rewritten with the same size and timestamp are now detected as changed and sync correctly.
  - A file renamed inside a mount is now sent to the cloud as a rename instead of a delete and re-upload.
