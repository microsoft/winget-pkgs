  Installation
  Every archive holds two binaries: pigcloud and its short alias pc.
  Linux/macOS:
  tar -xzf pigcloud-<version>-<platform>.tar.gz
  sudo install -m 755 pigcloud pc /usr/local/bin/
  Windows:
  Extract pigcloud.exe and pc.exe from the zip and add that directory to your PATH.
  Verify checksums
  sha256sum -c checksums.txt
