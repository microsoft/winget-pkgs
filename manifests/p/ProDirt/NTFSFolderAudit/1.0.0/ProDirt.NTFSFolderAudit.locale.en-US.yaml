ShortDescription: Audit NTFS folder permissions on Windows - scan local and UNC paths, find broken inheritance, compare two paths, and export interactive HTML reports.
Description: |-
  NTFS Folder Audit gives you a fast, readable view of who has access to what
  across any Windows file share, without wrestling with icacls or PowerShell.

    Scan a local path or a UNC share to any depth and get a permissions grid
  showing identity, access type, decoded rights, inheritance state and flags.
    Folders whose ACLs are set directly on the folder, rather than inherited from
  the parent, are flagged - and a single click filters the tree down to only
  those. Each one is either a deliberate security boundary or a mistake, and they
  are the first thing worth reviewing in any audit.

    Compare two paths side by side to catch permission drift between a share and
  its backup. Export a self-contained interactive HTML report you can email to a
  client, or a flat CSV.  Folders your account cannot read are listed in an event
  log rather than silently reported as empty.  A command line interface covers
  scheduled and headless audits.

  Free, with no licence key, no trial timer, no gated features and no account.
  It contains no network code at all - no telemetry, no analytics, no update
  check - so it behaves identically on an isolated network.
