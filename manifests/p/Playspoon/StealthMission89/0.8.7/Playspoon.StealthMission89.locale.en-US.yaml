ReleaseNotes: |-
  What's new
  AC-130 Spectre Gunship
  Players can now fly the C-130 gunship and control its 40mm and 105mm guns. Single mission and Career modes have players engage various ground targets. Escorts will be provided for missions in which either air or long range SAM threats are expected. The weapons can be controlled via the TGP page on the MFD as well as with a dedicated gunner position in multicrew.
  AC-130 Gunner position
  The AC-130 is the first aircraft to support Multicrew operations. In singleplayer, players can use the ESC menu to swap to the gunner position. This will make the AI take over piloting the aircraft provided it was on AUTO mode before switching over, and the AI will attempt to orbit around whatever target you aim for. Keep in mind that it may take a while for the AI to maneuver the airplane into a stable left-hand turn at the correct angle over the target.
  This also works in multiplayer. In additions, other players can hop into the gunner seat of another player's aircraft. The new "Flights" tab in the campaign UI shows a list of active AI and player aircraft and lets players either take control of or play as gunner for that aircraft.
  AH-64 Apache
  Players can now fly the AH-64. Both the pilot and CPG cockpits are modeled - in crude detail I might add, this is definitely "programmer art" and any help with improved models is welcome.
  The TEDAC is modeled in the center and can also be operated in VR using the VR controller sticks and buttons. Left thumbstick slews, right thumbstick zooms, left buttons toggle FLIR mode, right buttons toggle weapons.
  When hopping into the gunner seat, the AI will take over piloting only if either AUTO or HOVER modes are engaged. AUTO will make the AI fly from waypoint to waypoint. Unlike regular AUTO mode with a human pilot, the AI will also avoid flying into terrain.
  In HOVER mode, the helicopter will simply stay at its current position. Note that switching to the gunner seat is also possible while the helicopter is on manual - in that case the AI will not take over.
  OH-58D Multicrew
  The Kiowa now also supports multicrew operations. This functions identically to the Apache.
  New MIG-21 model
  Discord user Just Mob has contributed a new MIG-21 model. Thank you!
  Other fixes
  - Fix Xbox controller trigger recognition by @dividebysandwich in #44
  - Some OH-58D mesh holes fixed - this model still needs major rework though
  - Fixed SAMs spawning in the water on the persian gulf map
