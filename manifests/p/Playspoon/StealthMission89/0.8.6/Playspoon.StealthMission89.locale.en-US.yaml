ReleaseNotes: |-
  What's new
  C-5 Galaxy and Cargo Operations
  The C-5 is an unarmed cargo aircraft that can now be flown in single missions, career and the dynamic campaign. In the game it can perform two types of cargo missions: Regular cargo transfer and cargo drops.
  The bog-standard cargo missions have the player take off at one airfield and land at the destination airfield. Simply come to a complete stop on the runway to fulfill the mission.
  Cargo drops require flying over a designated drop point and dropping the cargo by opening the rear cargo door and pressing the fire button to launch the cargo. A cargo MFD page shows the status of the cargo and drop progress. Return to base for the mission to count as a success.
  You'll note that the C-5 has a steering column with a yoke. In VR you can grip the yoke with your left hand controller, or the right one, or both! Just do natural steering motions, i.e. rotate the yoke to roll, and push/pull for elevator. You can take your right hand off the yoke at any time and operate the throttle levers.
  Taking off requires flaps, rotate at around 110 and pull decisively. You should gain some altitude and airspeed before retracting flaps. Landing is currently extremely simplified and forgiving to avoid frustration, feedback is welcome.
  Other changes
  - Added missing 2h/day option in campaign settings
  - Patriot and NASAMS range circles are now accurate
  - No more cricket sounds over the sea
  - SAM systems now use one launcher completely before tapping another launcher, to make reloading easier
  - NASAMS stockpile increased
  - Reload is now refused if not enough stockpile exists
  - BAY button and gear lever removed from Black Hawk cockpit
  - ENG MFD page is now distinct for every aircraft
  - Dedicated servers showed parked aircraft on the runway - fixed
  - Skip refused OpenXR frames instead of panicking
  - Desktop VR mirror implemented
  - Fixed disappearing CLEAR binding button
  - Mouse and keyboard now keep working in VR
  - AIM-9 seeker HMD aiming is now smoother and less laggy
  - Added JOIN VR and HOST IN VR buttons to campaign multiplayer
  What's Changed
  - Move the dynamic campaign's buttons to the footer, mark the selected unit by @xan2622 in #39
  - Load saves from the in-flight menu, and rename saves by @xan2622 in #38
  - Add an infrared switch to the campaign's live unit window by @xan2622 in #40
  - Add a Keep time acceleration option by @xan2622 in #41
  - Target markers and mode targeting by @xan2622 in #43
  - Publish each release to winget through winget-releaser by @xan2622 in #42
  Full Changelog: v0.8.5...v0.8.6
