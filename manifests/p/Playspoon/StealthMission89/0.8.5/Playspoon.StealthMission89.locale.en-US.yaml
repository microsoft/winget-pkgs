ReleaseNotes: |-
  What's new
  Campaign Resupply and Production Logistics
  The realtime campaign now features production bases that assemble munitions. These munitions have to be distributed to other airbases and are then either used by flight missions or transported to SAM sites. Transport between airbases is done via large cargo aircraft which can be intercepted.
  image
  The new logistics tab gives an insight into the production rates and status. This system runs automatically, right now cargo aircraft are only flown by the AI, but we may let players do that in the future.
  Radar standby
  Your aircraft radar can now be turned off. This will reduce your detectability, but you won't detect enemy aircraft yourself anymore. You can then only see enemies that have been shared via Link-16 on your HSD, and you no longer contribute to the air situation picture.
  MFD RCS page
  On modern stealth aircraft you can now view a large version of the RCS status page on any desired MFD
  image
  Android build
  You can now fly on your android tablet, phone, or handheld gaming device! Gamepad support is included. Cockpit controls are clickable, but there's no support for touchscreen viewing/zooming yet (but you can map controls for that yourself)
  image
  Other changes
  - Gepard range increased to 8km
  - Patriot PAC-3 now has a more realistic range
  - NASAMS added, so blue now also has a player-controllable medium-range air defense system
  - The nearest-target key now prefers mission objectives - this is also to help touchscreen users to be able to meaningfully play the game.
  - The modern HUD now renders even further down so glide path and ILS indicators are more useable
  - Seat height setting added
  - High AoA buffeting now starts a bit later
  - Blue missiles are now blue on the HSD
  - Using the cursor to zoom closer on applicable MFD pages now doesn't instantly zoom to the shortest range
  - Hole in F-22 weapons bay fixed
  - The F-22 afterburner now has the correct shape
  - Fixed Korea having a city inside the mountain, since for all we know that is not actually the case
  - NAV mode now hides weapon information on the HUD
  - Stinger/Igla soldiers now properly render in the world
  image
