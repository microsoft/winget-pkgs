ReleaseNotes: >-
  Posnic POS v1.6.1 publishes a Windows x64 installer with release assets and
  SHA-256 checksums. Verify release files against the published checksum list
  before installation.
ReleaseNotesUrl: https://github.com/Posnic/POS/releases/tag/v1.6.1
InstallationNotes: >-
  On first launch, allow a few minutes for local database preparation.
  Configure backups and test attached printers, scanners, scales, and cash
  drawers before live trading.
