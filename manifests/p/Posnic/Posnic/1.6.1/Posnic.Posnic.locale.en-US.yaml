ShortDescription: Free open-source POS and billing software for retail shops and restaurants.
Description: >-
  Posnic is free, offline-first open-source POS and billing software for retail
  shops and restaurants. It keeps the primary database and API on the shop
  computer and includes sales, billing, inventory, purchasing, customer
  accounts, restaurant workflows, reports, desktop packages, and optional cloud
  services.
