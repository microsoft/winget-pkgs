PackageIdentifier: Pixcel.Tridennote
PackageVersion: 1.6.0
PackageLocale: zh-CN
Publisher: Pixcel
ShortDescription: 在终端里使用 Tridennote：浏览并编辑你的笔记、看板与图表。
Description: |-
  Tridennote 的终端版本：更进一步的笔记。以 Neovim 风格的文件树浏览你的笔记库，把笔记渲染成 markdown 阅读，运行看板，并用内置编辑器或你自己的编辑器修改内容。

  功能

  - 浏览器登录：首次启动时会提示你登录，应用会打开 Tridennote 让你确认一段短码。会话保存在你的用户目录中，直到过期或你主动退出。
  - 笔记库文件树：Neovim 风格的文件树只列出文件夹与 markdown 笔记；草图、PDF 和其他附件不会显示。
  - 笔记预览：把选中的笔记渲染成 markdown，Mermaid 流程图、时序图和 ER 图会以 Unicode 字符画直接绘制在终端里。
  - 编辑：用内置编辑器修改笔记，或交给 VS Code、Cursor、Zed、Neovim、Vim 等你自己的编辑器。可以直接在文件树里新建笔记。
  - 看板：文件名以 *.kanban 结尾的笔记会在文件树中显示为看板，并预览成按列排布的卡片。移动、新增、编辑和勾选卡片，每次修改都会直接写回笔记。
  - 环境变量文件与密钥：列出、读取、上传、设置和删除变量，或用 tridennote run 带上某个环境文件的变量执行命令。密钥内容不会被打印。
  - 设置：选择编辑器，把侧边栏放到左侧或右侧，并选择 Nerd Font 图标或极简图标。
