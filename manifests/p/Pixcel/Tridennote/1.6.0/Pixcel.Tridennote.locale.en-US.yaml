ShortDescription: 'Tridennote in your terminal: browse and edit your notes, boards and diagrams.'
Description: |-
  Tridennote in your terminal: notes, next level. Browse your vault in a Neovim-style tree, read notes as rendered markdown, run kanban boards, and edit them in the built-in editor or your own.

  Features

  - Browser sign-in: on first launch you are prompted to sign in and the app opens Tridennote to confirm a short code. The session is saved in your user profile and reused until it expires or you log out.
  - Vault tree: a Neovim-style file tree lists your folders and markdown notes; sketches, PDFs and other attachments are hidden.
  - Note preview: the selected note is rendered as markdown, with Mermaid flowcharts, sequence diagrams and ER diagrams drawn directly in the terminal as Unicode box art.
  - Editing: edit notes in the built-in editor, or hand them to your own editor such as VS Code, Cursor, Zed, Neovim or Vim. New notes can be created from the tree.
  - Kanban boards: notes named *.kanban show up in the tree as boards and preview as columns of cards. Move, add, edit and check off cards, and every change is saved straight back to the note.
  - Env files and secrets: list, read, upload, set and unset variables, and run a command with an env file's variables through tridennote run. Secret values are never printed.
  - Settings: pick your editor, move the sidebar to either side, and choose Nerd Font or minimal icons.
