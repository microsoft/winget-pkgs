  Focus  │Exact TOML integers, ini and env lines, plan keys, rename preview
  ───────┼─────────────────────────────────────────────────────────────────
  Tests  │5800+ (README badge on main)
  ───────┴─────────────────────────────────────────────────────────────────
  Upgrading
  - An ini file whose section header never closes now fails to parse.
    Close the header, or move those keys into a closed section.
  - A plan verify step that says attribute instead of attr is
    invalid_input and does not write. Use attr.
  - An operation-level expected_sha256 warns and still writes. Put
    the hash on the plan map when a mismatch must leave the file alone.
  - Default rename preview of a binary file or a directory now prints
    a would-rename line. JSON fields are unchanged.
  - Install from crates.io, npm, Homebrew, or Scoop after the tag
    ships. On Windows, Scoop is recommended. winget may need
    winget source update after Microsoft publishes. Chocolatey can
    lag while moderation runs.
