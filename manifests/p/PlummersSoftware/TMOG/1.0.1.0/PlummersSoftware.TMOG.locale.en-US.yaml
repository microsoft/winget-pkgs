ReleaseNotes: |-
  Windows only; the macOS and Linux downloads remain RTM (1.0.0).
  - TMOG no longer closes itself after the computer wakes from sleep or hibernation.
  - The hang watchdog now closes TMOG only when a stopped TMOG window would otherwise hold the mouse and keyboard of the whole desktop. Any other slow moment is left to Windows, as for every other program.
  - When the hang watchdog closes TMOG, it now saves only its short text report. Writing a memory dump as well could stall and keep a stopped TMOG from closing.
  - TMOG starts on Windows Server without the Wireless LAN Service installed, and on editions of Windows without Media Foundation, where recording now says what it needs.
  - When Intel's Dynamic Tuning software or AMD's graphics driver library fails inside TMOG, TMOG stops reading from it and keeps running, instead of closing a few seconds after it starts.
  - When TMOG runs as administrator, App History no longer asks Windows to delete the shadow copy it reads, which security software flagged. The screensaver no longer reads App History at all.
