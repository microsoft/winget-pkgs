ShortDescription: Plasmid map and DNA sequence editor with an agent that plans cloning.
Description: |-
  PlasmidLab is a free plasmid map and DNA sequence editor for molecular cloning. It opens and saves
  .dna, GenBank and FASTA files, and opens EMBL files and Sanger traces in .ab1 and .scf. It draws
  circular and linear maps with features and restriction sites, designs primers, translates in six
  frames, simulates agarose gels, aligns sequences and finds CRISPR sites. It simulates restriction,
  Gibson, Golden Gate, Gateway and TA/TOPO cloning, PCR and mutagenesis.
  A built-in agent takes a request in plain words, calls the editor's own cloning functions on the
  files that are open, and shows every step, every primer and the product before anything is ordered.
  It runs on a Claude, ChatGPT or Grok plan the user already has, or on a free trial of ten runs.
  Files stay on the computer, and the editor works offline.
