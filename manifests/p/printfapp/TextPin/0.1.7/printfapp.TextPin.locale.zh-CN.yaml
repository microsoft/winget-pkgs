ReleaseNotes: |-
  - 首次发布：按下快捷键即可在鼠标旁固定一张便签，滚动缩放，一键隐藏与显示全部便签，并可在管理窗口中查找任意便签。
  - 跟随系统的浅色与深色外观；支持英语和简体中文。
  - 支持应用内更新。
