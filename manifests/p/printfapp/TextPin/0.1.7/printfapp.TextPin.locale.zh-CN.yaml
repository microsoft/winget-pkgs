ShortDescription: 桌面便签应用。滚动即可缩放便签，拖动即可移动位置，可让便签始终显示在最前，并在一处统一管理所有便签。
Description: |-
  TextPin 把简短的便签固定在屏幕上。一个电话号码、一个车位、下一步要做的事：按下快捷键，输入内容，便签就留在你看得见的地方。需要腾出桌面时，一键隐藏全部便签；需要找回时，几秒就能找到。

  - 一键按下即可新建便签；每张便签都有自己的颜色。
  - 在便签上滚动即可放大或缩小，拖动即可移动；正在输入的便签需按住 Ctrl。
  - 可让便签始终显示在所有窗口之上，也可以像普通窗口一样置于后方。
  - 一键隐藏全部便签，也可以一键恢复。
  - 在管理窗口中搜索所有便签（包括已隐藏的），可多选后一起显示、隐藏、复制或移入回收站。
  - 使用 Ctrl+` 在便签之间切换。
  - 便签保存在本机。TextPin 仅在激活 Pro、校验许可证和检查更新时联网，不收集使用统计数据。
  - 在设置中可更改快捷键、缩放步长、语言（英语、简体中文）以及跟随系统的浅色或深色外观。
  - 应用内即可获取更新（设置 -> 通用 -> 更新）。
Tags:
