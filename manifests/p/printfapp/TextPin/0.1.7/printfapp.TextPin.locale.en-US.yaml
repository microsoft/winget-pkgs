ShortDescription: Sticky notes for your desktop. Scroll to resize them, drag to move them, keep them above every window and manage them all in one place.
Description: |-
  TextPin keeps short notes pinned on your screen. A phone number, a parking spot, the next step of a task: press one shortcut, type it, and the note stays where you can see it. When you need the space, hide every note at once; when you need one back, find it in seconds.

  - Pin a note with one shortcut; each note gets its own colour.
  - Scroll on a note to make it bigger or smaller, and drag it anywhere. On the note you are typing in, hold Ctrl.
  - Keep a note always on top, or let it sit behind other windows.
  - Hide all notes and bring them back in one step.
  - Search every note, including hidden ones, in the management window, and select several to show, hide, copy or move to the Trash together.
  - Move between notes with Ctrl+`.
  - Notes are stored on your computer. TextPin goes online only to activate Pro, check your license and look for updates; it collects no usage statistics.
  - Change the shortcuts, zoom step, language (English, Simplified Chinese) and light or dark appearance in Settings.
  - Get updates inside the app (Settings -> General -> Updates).
