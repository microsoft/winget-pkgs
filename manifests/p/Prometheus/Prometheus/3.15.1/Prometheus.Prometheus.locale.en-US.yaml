ShortDescription: Monitoring system and time series database, with the promtool command-line tool.
Description: |-
  Prometheus is a systems and service monitoring system. It collects metrics from configured targets at given intervals, evaluates rule expressions, displays the results, and can trigger alerts when specified conditions are observed.
  The package installs two commands: prometheus, the server, and promtool, which checks and tests rule and configuration files, queries a server and manages TSDB blocks.
