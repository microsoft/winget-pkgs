  <!-- Release notes generated using configuration in .github/release.yml at v0.32.0 -->


  # Upgrade Guide

  https://github.com/prometheus-community/windows_exporter/blob/main/docs/upgrade/0.32.md

  ## What's Changed
  ### 💥 Breaking Changes
  • filetime：replace collector with file by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2244
  • hyperv：fix virtual_storage_device_throughput metric to be a counter (not gauge) with _total suffix by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2285
  • process：report owner label as DOMAIN\user by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2515
  • fix：collectors Close leaks, recover goroutine panics, validate sub-collectors by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2547
  • container：read Kubernetes metadata from the CRI API by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2557
  • gpu：make device discovery non-fatal and refresh it on unknown LUIDs by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2573
  • process：read processes from the kernel instead of perflib by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2644
  • httphandler：remove /version endpoint by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2660
  • collector：remove deprecated thermalzone collector by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2659
  • terminal_services：fix swapped cpu_time labels, pending broker gauge, shared PDH query and series caching by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2687
  • memory：rename commit_limit, drop free system PTEs, add standby cache lifetime by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2694
  • smb：fix metric types and names, extend 32-bit counters in smb and smbclient by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2710
  • remote_fx：fix swapped skipped-frame counters and sample fraction rates by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2716
  • memory：publish pool allocation counts as gauges by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2721
  • hyperv：fix misnamed root partition metrics, counter types and units by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2720
  • ad：fix swapped and misread counters, correct metric units and types by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2717
  • dfsr：publish bandwidth savings and USN journal unread as ratios by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2714
  • iis：fix types, units and names of app pool, queue and worker metrics by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2715
  • dns：fix zone transfer counter mapping and count queued dynamic updates by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2718
  • mssql：fix units and types of cumulative and current counters by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2723
  • pdh：report duplicate instances by occurrence instead of renaming them by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2742
  • collector：publish base units and _total counter names by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2743
  • collector：name instance labels after the entity they identify by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2744
  • logical_disk：remove the *_latency_seconds_total counters by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2763
  • pdh：convert all raw time counter types to seconds by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2776
  ### ✨ Exciting New Features
  • pdh：added logging, if PDH CStatus is not valid by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2203
  • os：include installation type in Windows version retrieval by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2217
  • thermalzone：deprecate collector by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2201
  • netframework：add process_id label to clrmemory by @johanot in https://github.com/prometheus-community/windows_exporter/pull/2242
  • file：add file collector to scrape file size and file modify time which can replace filetime collector by @xie-shujian in https://github.com/prometheus-community/windows_exporter/pull/2205
  • os：add system installation date to metrics by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2284
  • mscluster：add shared volumes collector and update documentation by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2301
  • mscluster：Add virtual disk metrics sub-collector by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2296
  • process：Use Process collect V1 by default, since V2 is buggy. by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2368
  • file：fix collector producing no metrics, startup hang, and duplicate metric errors by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2371
  • service：Add parameter to filer service by start mode by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2405
  • mscluster：use AllocatedSize for virtual disk storage efficiency by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2432
  • registry：new collector for generating metrics from Windows registry entries by @dluxem in https://github.com/prometheus-community/windows_exporter/pull/2428
  • mscluster：add storagepool metrics by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2491
  • hyperv：add host sub-collector for CPU allocation ratio by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2493
  • hyperv：add WMI health metric by @Dominik-esb in https://github.com/prometheus-community/windows_exporter/pull/2494
  • dmi：add dmi_info metric via GetSystemFirmwareTable by @elmarco in https://github.com/prometheus-community/windows_exporter/pull/2500
  • feat：log build and account before initializing collectors by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2514
  • wmi：add generic wmi collector by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2530
  • scheduled_task：expose result statuses and deprecate last_result by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2532
  • mi：use generic methods for Query, QueryUnmarshal and Unmarshal by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2518
  • hyperv：add Hyper-V Replica VM metrics by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2538
  • pdh：make Collector generic over its row type by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2536
  • ole：replace go-ole with native COM bindings by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2551
  • contrib：add Windows exporter monitoring mixin by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2558
  • collector：add pprof labels to build and collection by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2562
  • pdh/registry：reuse the raw data buffer across Collect calls by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2567
  • httphandler：expose Go scheduler metrics by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2561
  • container：add start time, process count and page fault metrics by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2566
  • dashboard：rework sample dashboard into one tabbed dashboard by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2556
  • contrib：expand Windows mixin rules and publish runbooks by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2575
  • gpu：add vendor-neutral sensor metrics from dxgkrnl by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2571
  • pdh/registry：decode performance data without per-counter allocations by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2572
  • container：collect Hyper-V isolated containers from CRI stats by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2568
  • printer：read printers and jobs from the spooler API by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2577
  • textfile：use stable fallback HELP strings by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2591
  • dashboard：add TCP/UDP and GPU metrics with panel descriptions by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2576
  • dashboard：use counters for disk queue length and VHD latency by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2582
  • scheduled_task：read only published task properties by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2613
  • terminal_services：detect Connection Broker via service control manager by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2628
  • dashboard：add process metrics with bounded graphs and summaries by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2631
  • process：read the IIS application pool from the w3wp command line by @jkroepke in https://github.com/prometheus
