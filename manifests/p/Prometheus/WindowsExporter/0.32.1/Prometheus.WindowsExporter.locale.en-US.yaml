ReleaseNotes: |-
  <!-- Release notes generated using configuration in .github/release.yml at v0.32.1 -->

  ## What's Changed
  ### ✨ Exciting New Features
  • mi：add the native error code to instance result errors by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2812
  • time：add W32Time sync status metrics by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2813
  ### 🐞 Bug Fixes
  • logical_disk：fall back to GetDiskFreeSpaceEx when GetDiskSpaceInformationW fails by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2805
  • scheduled_task：skip tasks and folders deleted during a scrape by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2811
  • update：fail searches that Windows Update reports as failed by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2808
  • process：resolve owner SIDs per scrape and retry failed lookups by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2801
  • dhcp：free leaked scope buffers and keep readable scopes by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2809
  • service：keep services whose configuration can't be read by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2810
  • installer：fix config.yaml on uninstall and set InstallLocation by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2814
  ### 🛠️ Dependencies
  • chore(deps)：update module github.com/prometheus/procfs to v0.23.0 (main) by @renovate[bot] in https://github.com/prometheus-community/windows_exporter/pull/2795
  ### 📖 Documentation
  • docs(agents)：link the Windows protocol specifications by @jkroepke in https://github.com/prometheus-community/windows_exporter/pull/2806


