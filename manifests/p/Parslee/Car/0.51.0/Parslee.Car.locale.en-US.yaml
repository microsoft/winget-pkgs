ReleaseNotes: "## v0.51.0\n\n### Changed\n\n• **The coder's shell now holds no forge credential**, which is the one version\n  of \"the model cannot publish\" that does not depend on out-lexing `/bin/sh`.\n\n  The deny-list added in car#1074 is hardening, not a sandbox：it reads the verb\n  of each shell segment and then hands that segment to `/bin/sh`, so `sh -c`,\n  `env`, `timeout`, `$(…)`, a `\\gh` escape, or a delegated `car do \"…push it\"`\n  all move or bypass the verb. No finite set of patterns closes that against an\n  unrestricted shell.\n\n  Credential separation has a different shape. `GH_TOKEN`, `GITHUB_TOKEN` and\n  their enterprise spellings are removed from the child; `GH_CONFIG_DIR` points\n  at an empty directory so `gh` cannot fall back to `~/.config/gh/hosts.yml`;\n  and git's `credential.helper` is overridden to empty for that child. That last\n  one is easy to miss and would have left the hole open on its own — `git push`\n  over HTTPS never reads `GH_TOKEN`, it asks the helper, which on a Mac is\n  perfectly happy to hand over a stored credential.\n\n  Every route then fails on **authentication** rather than on being recognised,\n  and because environment removal is inherited by the whole process tree it\n  covers the spellings the matcher cannot see. Delivery is unaffected:\n  `coder::merge` is host code that builds its own argv outside the model's shell\n  and keeps the real credential. The runtime publishes; the model cannot.\n\n  **Deliberate cost:** on a **private** repository the read allowlist\n  (`gh pr view`, `gh run view`, `gh api` GET) now fails unauthenticated, so a\n  session cannot watch its own CI there. Public repos are unaffected. Restoring\n  it means either a scoped read-only token for the coder shell or moving CI\n  observation into host code — both larger than this change, and neither done.\n\n  Contract checks keep their credentials：a check runs a command the contract\n  declares rather than one the model just wrote, and may legitimately need to\n  reach a real system (car#1066). The `run_shell` / `run_check_shell` split from\n  car#1065 is what makes that distinction expressible.\n\n  Closes #1084.\n\n### Added\n\n• **The coder now reads what the repository says about how to work in it**\n  (`CLAUDE.md` / `AGENTS.md`, and `.car/` project knowledge). Previously\n  everything a session knew about its repo was two lines from `summarize_repo`\n  — the top-level entries and which build files exist.\n\n  The rules that get a diff rejected are almost never expressible as an outcome\n  contract. \"No cargo feature flags, ever\" and \"a change crossing the FFI\n  boundary updates five surfaces in the same change\" are review-time rules; a\n  model that has not read them does the *normal* thing and produces a diff that\n  compiles, passes every check, and is rejected on sight. Contract-green and\n  mergeable are different properties, and only one of them was reaching the\n  model.\n\n  The block lands after `ENVIRONMENT:` and before the how-to-work rules,\n  because these are constraints on *how* the work is done rather than facts\n  about the machine. Its framing is load-bearing rather than decorative：it\n  states that the contract does **not** verify these rules, and that a check\n  must never be weakened or edited to satisfy one — the contract decides\n  whether the work is done, the instructions decide whether it is acceptable.\n  A repo carrying neither instructions nor a `.car/` project gets a\n  byte-identical prompt to before, and there is a test pinning that.\n\n  `.car/` discovery reuses `car_memgine::project`, which already walks up from\n  a starting directory the way `.gitignore` resolution does, so a session cut at\n  a subdirectory still finds the project.\n\n  **Delegation is handled by indexing, not inlining.** Instruction files point\n  elsewhere — this repo's `CLAUDE.md` says the full binding surface \"lives in\n  the `car-bindings-api` skill\". Handing the model a pointer it cannot follow is\n  worse than useless：it learns a rule exists without learning what it says. So\n  `.claude/skills/*/SKILL.md` frontmatter is indexed by name, one-sentence\n  description and **path**, with an instruction to `read_file` the relevant one\n  before editing in its area. Bodies are never inlined — five would swamp the\n  prompt, and they are ordinary files the model can already open. A skill whose\n  frontmatter cannot be read is skipped rather than guessed at.\n\n  **Two limits remain, stated because they are easy to mistake for coverage.**\n  Nested `CLAUDE.md` files are not walked (`car-ffi-napi/CLAUDE.md` documents\n  five bugs with \"do not reintroduce them\"). And graph-memory recall stays\n  assistant-only — the coder's `RepairMemory` carries its own failure\n  signatures, not facts the team stored.\n\n  Refs #1071.\n\n• **A coder session whose correct outcome is \"do not change the code\" can now\n  say so** (`car code-task`). Previously `CoderState`'s only non-failure\n  terminal was `Merged`, which requires a diff that turned a contract green, so\n  a session that investigated correctly and concluded nothing should change\n  landed on exit 1 — documented as \"the work is genuinely not done; back off\".\n  An orchestrator branching on exit codes was told to retry a task that had been\n  answered on the first attempt, and a runtime that can only score restraint as\n  a loss applies steady pressure toward shipping something. That pressure is\n  worst precisely where restraint matters most.\n\n  New terminal `CoderState::Reported`, new `Outcome::Reported`\n  (`status：\"reported\"`, exit **0**, `failure_class: \"none\"`). Exit 0 rather\n  than a fourth bucket, because a new non-zero code would make ordinary process\n  supervisors classify a correct result as a failure, while 1/2/3 all mean the\n  wrong thing — not \"redo it\", not \"the machinery broke\", not \"park it\". Exit 0\n  says the one right thing, *do not retry*; `run_end.status` carries the\n  delivered-versus-triaged distinction for anything that needs it.\n\n  The model's `report_no_change` call is a **nomination, not a verdict** — it\n  cannot set a terminal state. `coder::no_change::evaluate_nomination` judges it\n  against facts the runtime collected, and most branches are refusals：a session\n  that ever mutated is ineligible and **reverting does not restore\n  eligibility** (otherwise try-fail-revert-declare is a laundry for any hard\n  task); the worktree must be pristine now, with git failing to answer counting\n  as *not* clean; and the baseline must have completed, since a run the session\n  clock cut short is not evidence. `shell` is judged by effect — fingerprinted\n  either side — so investigating with grep, builds and tests is free while a\n  shell that writes disqualifies exactly as `edit_file` does.\n\n  Exactly one path terminates without a human：kind `premise_wrong`, every check\n  green against the untouched baseline, **and** a trusted contract.\n  `ContractProvenance::is_trusted` is the single definition of trusted —\n  operator-supplied, human-confirmed, or runtime-generated — and a\n  model-derived contract is never trusted at any tier, because a model citing\n  its own checks as proof it need not work is the escape hatch the gate exists\n  to close. Everything else routes to a person; headless that is\n  `finding_needs_review` at exit **3**, never exit 0, since a pending approval\n  is not a verified result.\n\n  `report_no_change` is offered only to a caller that declares\n  `can_adjudicate_no_change` (default **false**). A caller that cannot judge a\n  nomination must not invite one — `LoopOutcome` would return neither green nor\n  failed, and a caller unaware of that third shape reads it as an ordinary red\n  and silently discards the finding.\n\n  Partial：this ships the headless path. The daemon's `coder.resolve_finding`\n  gate, `NeedsYou::Finding` on the board wire, and the FFI surfaces follow.\n\n  Refs #1070.\n• **`car coder-ab run --report-issues` files durable-fix proposals as issues\n  instead of leaving them on disk.** `synthesize_proposals` already folded a\n  dogfooding round's losses into ranked, evidence-backed proposals naming which\n  CAR component to change and on what evidence. Those proposals were then\n  `println!`'d and written to `learnings-<unix>.md` — and that was the end of\n  them. The module doc names the intended consumer (\"a human, or a coding\n  agent, implements and merges\"); nothing carried the proposal to one.\n\n  Reports go to **`Parslee-ai/car-releases`** by default (`--report-repo`\n  overrides), not to the source repo. That is the load-bearing split：filing a\n  defect report needs no source checkout, so any deployment with telemetry can\n  report a defect it has no ability to fix, while fixing it needs the `car`\n  source. The new `IssueApi` seam is therefore a sibling of `merge.rs`'s\n  `GitHubApi` rather than an extension of it — that trait resolves its\n  repository from the checkout's `origin`, which is exactly the wrong rule here.\n\n  Filing is **idempotent by signature**：every body carries\n  `<!-- car-fix-signature：<hex> -->`, a hash over the proposal's stable\n  identity (target component + failure pattern), deliberately excluding the\n  title and `evidence_tasks` because both change every round and would make each\n  re-run a fresh duplicate. The lookup is a bounded list-and-match over open\n  issues rather than `--search`, because GitHub's search index is eventually\n  consistent and two quick rounds would each find nothing and each file. A\n  signature whose issue was **closed** and then recurs is reported again on\n  purpose：recurrence after a fix means the fix did not hold.\n\n  A noise gate keeps the tracker readable — `Confidence::Strong` files\n  unconditionally, `Tentative` only once `evidence_count >= 2`. Reporting is\n  opt-in, and a tracker failure is recorded against the individual proposal\n  rather than aborting the round.\n\n  Closes #1077.\n• **Only CAR talks to CAR over the network (ed25519 peer authentication).** The\n  A2A surface now binds a LAN-reachable address **by default**, which is only\n  safe because"
