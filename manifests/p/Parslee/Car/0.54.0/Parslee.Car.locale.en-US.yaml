ReleaseNotes: "## v0.54.0\n\n### Changes\n\n• Releases can now refresh the built-in model catalog's per-token prices from the Artificial Analysis aggregate (https://artificialanalysis.ai/), which republishes each vendor's own list prices. Base input and output prices feed model routing's cost term and its cost-budget filter, and were previously hand-entered and left to drift. Prompt-cache rates, which no catalog entry carried, make the cost figures in `car`'s usage display exact instead of approximations bounded by the base input rate. Only curated model joins are written, and the step is skipped when no API key is configured.\n• Both catalog-writing release steps now replace the file atomically, so an interrupted write can no longer leave a truncated `builtin_catalog.json` for the release commit to pick up.\n\n• Document historical draft proposals for Advisor live wiring and offer exchange; these proposals do not represent implemented runtime behavior.\n\n• Enforce the agent builder's advertised end-to-end deadline, report live phase/model/attempt/scenario/elapsed progress through `coder.get`, and end timeouts with actionable `budget_exhausted` state.\n• Mark `agent_scenarios_pass` passed when an agent build succeeds instead of leaving the builder contract pending.\n• Stop an agent build's scenario turns at their next turn boundary on `coder.cancel`, and show the model serving the current repair or scenario instead of the spec-generation model.\n\n• Stop offering the Parslee platform tools (`parslee_capabilities`, `parslee_m365_generate_document`) to a generated agent's build unless a Parslee account is signed in, so a signed-out local build is no longer derailed by `car auth login` guidance flowing back through its scenario checks; signing in and rebuilding offers them again.\n\n• Agent builder：choosing another starting point now keeps the answers you wrote instead of silently erasing them; a \"Continue your draft\" action returns to them, and a stopped or abandoned build parks its answers for a retry instead of losing them.\n• \"Continue your draft\" and the replace confirmation appear only for answers you typed yourself — an untouched template is not a draft.\n• Picking a template while a draft with answers is waiting asks for confirmation before replacing them; the Home research starter no longer auto-picks its template over a waiting draft.\n• Leaving setup (\"Back to Agents\" or cancel) still clears everything.\n\n• `car agent new` no longer mints over-long agent IDs：ids derived from long descriptions are now capped at 64 characters (well under the 128-character peer-name limit that agent registration enforces) and suffixed with a 64-bit digest of the full name, so a long description always yields an ID that every CAR surface accepts and two different long descriptions are kept apart with collision-resistant odds (car#1492).\n\n• The daemon now keeps token-bearing per-agent `manifest.toml` files owner-only on Unix and repairs permissive files and directories from older releases before loading them.\n\n• `car agent new` now accepts long descriptions without creating overlong project directory names, while keeping the complete description as the agent builder's input.\n• Clarified that a managed project's committed `agent.json` is build output and the daemon runs the separately registered `declagents.json` copy.\n\n• **Supervised agents can now receive read-only daemon credentials.** Add `method_allowlist` to an `agents.upsert` record or external-process `manifest.toml` to restrict that agent token to named non-host daemon methods; excluded calls are rejected before dispatch, while registrations without the field keep their existing access.\n\n• Kept `car agent new` successful during CLI/daemon version skew by falling back to the CLI's declarative registry path when an older daemon omits `registry_path`; `car agent where` now surfaces declarative lookup failures, emits daemon-canonical IDs in JSON, and `car info` marks corrupt declarative state unavailable instead of reporting zero agents.\n\n• `car agent new` now reports the exact declarative registry file alongside the new agent id, with `agent_id` and `registry_path` available from `--json`.\n• Added read-only `car agent where <id>` human and JSON output for both in-daemon declarative agents and lifecycle-supervised agents, including their registry or manifest and log locations.\n• `car info` now summarizes declarative and supervised agent counts and the state directories that hold them; `car inspect` shows a supervised agent's manifest path.\n\n• The daemon now keeps token-bearing `agents.json` files owner-only on Unix and repairs permissive files from older releases before loading them.\n\n• **New crate `car-topology` — pick a multi-agent communication topology from a\n  short list, in one pass, scored on measured tokens rather than edge count.**\n  Applies arXiv:2609.02264 (\"Codebook Agent\"). CAR decides how to coordinate\n  agents in two places and neither learns：`Coordinator` spends an LLM round trip\n  on a hand-written prompt, and `car-multi` runs whatever the caller named — while\n  every `AgentOutput` already carries the `TokenAccounting` that says what the run\n  cost. The crate fits a codebook of reward-surviving topologies, a\n  reward-weighted prior mapping a query embedding to a distribution over them,\n  and a proxy regressed on measured utility and per-task normalized token cost;\n  selection is one predictor pass, at most M decodes, and one batched scoring\n  call, with no search and no message passing. Deterministic and dependency-light\n  (serde only)：no model calls, no network, no unseeded randomness, and a fitted\n  selector round-trips through serde. The fitting and selection core touches no\n  filesystem; `journal` (below) is the one module that does.\n• **The three measurements the design rests on ship as first-class diagnostics,\n  runnable against your own execution records.** `design_space_collapse` (does\n  the reward-surviving set stay small as codebook capacity grows?),\n  `edge_count_token_correlation` (is `|E|` correlated with measured tokens\n  *negatively*, so that minimizing it raises the bill?), and `team_homogeneity` /\n  `scorer_advice` (do the agents share a profile, in which case a message-passing\n  scorer over profile nodes pools identical features and scores every candidate\n  the same?). These are workload properties, not theorems — the paper's numbers\n  are the paper's, measured on their benchmarks under their implementation, and\n  nothing here has been evaluated against them. The third check matters most for\n  CAR, whose teams are usually N clones of one `AgentSpec`:\n  `car_multi::topology::scorer_advice` answers it straight off the specs with no\n  encoder involved.\n• **`car_multi::topology` bridges finished coordination runs into records.**\n  `execution_record` folds a run's outputs into one `ExecutionRecord`, returning\n  `None` rather than a zero-cost record when the runner reported no token\n  accounting — a fabricated zero would drag the cost head toward whatever merely\n  went unmetered. `select_shape` returns a `CoordinationShape` a `car-multi`\n  caller can execute.\n• **Records persist, and a persisted record can never be read in the wrong\n  embedding space.** `car_topology::journal` is an append-only JSONL log at\n  `<car-home root>/topology/records.jsonl` following the `car-eventlog` idiom\n  (one record per line, torn-line tolerant on load, missing file reads as empty,\n  an exclusive advisory lock for one writer per path);\n  `car_multi::topology::record_run` is the one-call write path from a finished\n  coordination run. Every line names the encoder that produced its query\n  embedding, because the prior is a kernel over cosine similarity between query\n  *directions* — fold two encoders into one record set, or query a fitted\n  selector with a third, and nothing fails, slows down, or looks wrong; it just\n  answers from arbitrary similarities. So the tag is enforced at the boundary:\n  `RecordJournal::load_records` refuses a mixed journal unless you name the\n  encoder, `TopologySelector::fit` carries the label through, and\n  `select_with(query, embedder)` refuses a foreign query. An unlabeled selector\n  passes the check — \"nobody recorded it\" is not \"any encoder fits\".\n• **The three diagnostics fold into one report you can actually read.**\n  `car_topology::diagnose` returns a serde-serializable `DiagnosticsReport` over\n  a record set, with `render()` for a terminal and `headline()` for a log line.\n  Two design points are deliberate. The homogeneity claim needs the team's agent\n  profiles, which execution records do not carry, so it renders as `NOT MEASURED`\n  unless you call `diagnose_with_profiles` — naming the gap beats silently\n  omitting the claim most likely to hold for CAR. And every report carries a\n  `Sufficiency` verdict against the paper's own collection protocol (300 records\n  over 50 tasks), so a thin journal reads as provisional rather than as a\n  finding; a set with no variation in edge count or cost is reported as\n  `Insufficient` rather than given a verdict.\n• **The utility label has a principled source, and the ergonomic path cannot\n  fabricate it.** `car_multi::topology::run_utility` derives a coordination run's\n  utility from the agents' structured `car_ir::AgentOutcome`s, with the mapping\n  dictated by the type rather than chosen：`Success` to 1.0, `PartialSuccess` to\n  0.5, `Failure`/`GiveUp`/`Timeout` to 0.0, and `Done` to **none**, because\n  `car-ir` documents that status as \"neutral -- may or may not have succeeded\"\n  and scoring it either way would invent the number the crate exists to measure.\n  `UtilityEvidence::Grounded` additionally refuses a success backed only by the\n  agent's own assessment, mirroring the receipts-decide-completion rule the\n  flagship assistant already applies -- and yields *none*, never 0.0, since\n  \"nobody checked\" is not \"it failed\". `record_run_from_outcomes` derives both\n  measured numbers and writes nothing when either is mis"
