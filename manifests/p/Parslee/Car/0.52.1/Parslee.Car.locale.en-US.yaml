ReleaseNotes: "## v0.52.1\n\n### Added\n\n• **Deterministic self-healing signal detection core.** The new\n  `car-selfheal` leaf crate folds CAR's existing eventlog alerts/events and\n  supervisor snapshots into typed `Detection` records for metrics alerts,\n  exhausted/crash-looping agents, recurring level-token log errors,\n  silently-idle live agents, recurring cross-run tool failures, and capability\n  misses. Detection identity is `sha256(locator)` rather than scan\n  order; evidence and provenance are credential-redacted at capture time and\n  bounded before entering a record. Positive known-answer and negative\n  zero-detection fixtures calibrate every detector. The crate has no model,\n  network, I/O, filing, or remediation path — a detection is evidence, never a\n  work order.\n• **Watch-only daemon self-healing detection and trusted local handoff.**\n  `car-server` now runs the five deterministic detectors immediately at boot\n  and every 15 minutes by default (`CAR_SELFHEAL_INTERVAL_SECS` changes\n  frequency only), using active event-log slices, supervisor snapshots,\n  bounded activity/stderr tails and activity-log metadata, and observe-only\n  registry state. `agent_log_errors.v1` flags a running agent only when its\n  activity tail repeats an `ERROR`/`FATAL`/`CRITICAL` level-token or traceback\n  signature, or when its activity mtime is stale beyond the threshold. INFO\n  lines that merely contain “failed” remain noise; timestamp/UUID/number\n  normalization and hour/day/week/month idle buckets keep deduplication stable.\n  New/changed detections, tick summaries, and operator dismissals append to the owner-private\n  `<CAR_HOME>/selfheal/detections.jsonl` ledger. Each tick also checks a bounded\n  list of local paths for a `.git` config whose origin is `Parslee-ai/car` (no\n  subprocess, network, or broad scan). A validated checkout routes detections\n  to one private, trusted-tier `<CAR_HOME>/selfheal/issues/<dedup-key>.md`\n  handoff document per key, updated on recurrence without writing into the\n  checkout. Invalid/absent candidates fail closed to ledger-only, with the\n  source path or refusal visible through `selfheal.status` and route/path on\n  `selfheal.detections`. The four RPCs are mirrored through Node/Python\n  bindings. No off-machine filing, proposal execution, restart, or remediation\n  path was added.\n• **Operator CLI and trust policy for self-healing signals.** The new\n  `car selfheal` command wraps the daemon's existing watch-only RPCs：`status`\n  reports cadence, counts, and the resolved route; `list` filters and renders\n  active detections with route and local issue path; `show` prints a trusted\n  local handoff document; `dismiss` appends a suppression; and `run` requests\n  one tick. All shipped verbs fail non-zero when the daemon is unreachable.\n  Feedback filing controls remain absent until Parslee-ai/car#1137 lands.\n  `docs/self-healing.md` documents the source-presence gate, trusted versus\n  consumer triage tiers, and the cutover from the external Tank judge and\n  goalpool route.\n• **Daily Continuity can publish unattended through one exact standing CAR\n  approval.** A host can grant `always_allow` to the literal\n  `(daily-continuity-newsroom, newsroom.publish)` pair, and CAR binds that grant\n  to the authenticated reverse callback's canonical schema digest. Future\n  admission succeeds only while the same agent, session, callback, and schema\n  remain attached; `car approvals set-tool`, `reset-tool`, and `evaluate-tool`\n  expose the lifecycle with stable audit provenance.\n\n### Fixed\n\n• **`verify-release.sh` now checks that the docs site actually deployed, not\n  just what it is serving.** Its appcast assertion had two causes for one\n  symptom：GitHub Pages still propagating (benign — the script's own comments\n  document a real v0.47.0 false positive) or the Pages *build* having failed,\n  which strands the release. Nothing distinguished them, and because the\n  documented cause is the benign one, a red read as flakiness. Cutting v0.52.0\n  it was the second — every registry held 0.52.0 while Sparkle could still only\n  see 0.51.0, and the only tell was that the failure outlived any plausible CDN\n  window. The build status is now asserted separately via\n  `gh api repos/<mirror>/pages/builds`：an `errored` build fails immediately\n  with the offending commit and short-circuits the six appcast retries, which\n  could never have helped. `building`, unreadable and unrecognised states stay\n  advisory, so a `gh` blip cannot fail a healthy release — a checker that cries\n  wolf is worse than none. `scripts/test-pages-build-check.sh` pins the\n  classifier in CI's `lint` job (car#1199).\n\n• **A code sample can no longer fail the docs-site build and silently strand a\n  release.** GitHub Pages renders the `car-releases` docs mirror with Jekyll,\n  which runs Liquid over every markdown page. Liquid does not respect fenced\n  code blocks, so a brace-heavy sample — `format!(r#\"{{type=\"http\",url=\"{}\"}}\"#,\n  endpoint)` in Rust, `[]map[string]any{{\"name\"：\"shell\"}}` in Go — is a Liquid\n  *syntax error*, not a rendering quirk, and it fails the entire Pages build.\n  The site then keeps serving the previous commit, reporting only a generic\n  \"Page build failed\". Cutting v0.52.0 this stranded the release：GitHub, PyPI,\n  npm and crates.io all held 0.52.0 while `car.parslee.ai` still served the\n  0.51.0 `appcast.xml`, so Sparkle could not see the update — the same\n  end-state as v0.40.0, reached through a different door. Note what does *not*\n  trigger it：`{{item}}`, `{{index}}` and `{{payload}}` have been in\n  `websocket-protocol.md` for many releases and build fine, because well-formed\n  Liquid variables simply render empty. Malformedness is what throws, which is\n  why \"we would have noticed by now\" was false. `sync-car-releases-docs.sh` now\n  wraps every markdown page it publishes in `{% raw %}`, which disables Liquid\n  for that page and changes no rendered output — the mirror publishes\n  documentation, never templates. `scripts/test-liquid-guard.sh` covers it in\n  CI's `lint` job.\n• **A daemon under an isolated `CAR_HOME` can no longer delete the production\n  home's macOS schedules.** Every CAR state root shared one global launchd\n  namespace：labels are `ai.parslee.car.task.<id>` with nothing recording *which*\n  CAR installed them. So an isolated daemon's boot reconcile enumerated the\n  production home's LaunchAgents, found them absent from its own task store, and\n  reaped them as orphans — `reaped orphaned OS schedules at boot removed=1`\n  deleted a live production schedule, regressing `car schedule list` from\n  `os/durable=true` to `daemon/false` while the task's JSON sat untouched in its\n  store (car#1178). `labels_to_remove`'s own doc comment claimed reconciliation\n  \"can't touch a schedule CAR didn't create\", and that was true as written —\n  another CAR *home*'s schedule simply was not foreign by that definition.\n  Installed launchd plists now record their owning root in\n  `EnvironmentVariables.CAR_HOME`, and a reconcile pass reaps only what it owns.\n  Two consequences worth knowing：a schedule installed by an isolated home now\n  also *executes* against that home rather than inheriting the default root at\n  fire time (the same isolation bug one step later), and on backends that cannot\n  carry an owner stamp — cron tags and `schtasks` names are just the label — an\n  overridden root now refuses to reap anything at all rather than guess. A\n  schedule installed before this stamp existed is unmarked; the default root\n  keeps reaping those exactly as before, and an overridden root leaves them\n  alone, because leaking a stale schedule is recoverable by hand and deleting a\n  live one is not.\n\n### Security\n\n• Durable human rejection still wins, and CAR rejects non-tool actions,\n  generic or server-owned tools, schema drift, managed-agent self-grants, and\n  skill-ceiling bypass attempts. All legacy and new permission mutations\n  require host-management authority, while corrupted policy state retains the\n  last valid snapshot or fails closed to the cautious posture."
