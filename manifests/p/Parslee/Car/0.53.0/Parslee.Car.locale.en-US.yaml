ReleaseNotes: "## v0.53.0\n\n### Changes\n\n• **Four holes around the peer surfaces, found while designing the receiving-side\n  broker and fixed together.** (1) A trusted peer could register a push-notification\n  webhook on the peer-authenticated A2A listener：send text, take the task id, point\n  `tasks/pushNotificationConfig/set` at a URL you control, and the host POSTs full\n  task snapshots — messages and artifacts — to it with no allowlist. A push config\n  is outbound authority, so it is refused on a messaging-only surface. (2) `a2a.start`\n  bound any address it was given while serving `NoAuth` (there is no auth parameter —\n  `build_router` hardcodes it) and registering the agent-basics filesystem tools, so a\n  reachable bind published `write_file` to anyone who could route to the port. A\n  non-loopback bind now requires `allow_non_loopback_bind：true`, the same explicit\n  opt-in `a2a.peers.add` and `a2a.send` already demand of their endpoints; a wildcard\n  bind is refused as the most reachable of all. (3) `agents.chat` reached an agent\n  with no channel guard and no policy, so it was the way around `agents.message`:\n  an agent denied at the `read_only` tier could chat at its target instead, and two\n  agents could answer each other with nothing to terminate the loop. Agent callers\n  now pass the same admission, sharing one dedupe window and rate budget per\n  recipient across both methods — a synchronous turn stays out of the in-flight\n  `QUEUE_CAP` count, which is a concurrency bound and not the backlog its old doc\n  comment claimed. The host stays exempt：it is the operator's own client, and the\n  dedupe window would otherwise swallow a person retyping a prompt. Admission runs\n  after the target is known to exist, so an unroutable id can neither burn the\n  dedupe window (whose refusal says \"already delivered\", which would have been\n  false) nor mint a permanent guard entry. (4) The same admission now covers the\n  paths that would otherwise be the way around *it*：`declagents.invoke`,\n  `declagents.route` and `declagents.route_split` reach the same declarative\n  executor, and the A2A conversational responder (`chat_collect`) reached a live\n  agent with no guard, no policy and no audit at all. Every refusal is written to\n  the peer audit journal with its outcome, which matters now that the budget is\n  shared — an `agents.message` refused for rate could have had its budget drained\n  by chat traffic, and without a record there is nothing to show where it went. Two more in the same family：`agents.chat.cancel`\n  removed a live turn's routing entry with no ownership check at all, while\n  `agents.chat.approve` in the dispatch arm beside it has always required the\n  originating host session — so any authenticated session could abort anyone's\n  turn by observing a `session_id`; and the peer-authenticated router now forces\n  `require_identity`, which is free because the middleware inserts an `Identity`\n  for every request it admits, and means a future reordering that dropped it\n  fails closed rather than quietly serving unattributed requests.\n\n• **A peer trusted enough to message this host could write files on it.** The\n  peer-authenticated A2A listener binds this host's LAN address by default, and\n  its dispatcher ran on a `Runtime` that `register_agent_basics()` had stocked\n  with `write_file`/`edit_file` — with no `CapabilitySet`, no authz stage and no\n  admission gate, because every gate that answers \"what may this caller do\"\n  lives on the WebSocket surface instead. An inbound `Part::Data` carrying a\n  `tool` key compiles to a real `ToolCall` (`car-a2a::bridge`) and executes\n  *before* the `ChatResponder` is consulted, so `agent_reply_for`'s\n  \"conversational\" check never saw it. Adding a peer with `a2a.peers.add` — a\n  decision that reads as \"let this daemon talk to me\" — therefore also granted\n  filesystem write. That listener is now messaging-only：an action-bearing\n  message is refused with `-32600` before a task is created, and its runtime\n  registers no tools at all, so its public agent card stops advertising\n  filesystem skills to the LAN. Peer authentication answers *who* is calling; it\n  never answered *what they may do*. Note what this leaves：the listener wires no\n  `ChatResponder`, so it is a discovery beacon plus an `\"Acknowledged.\"` stub —\n  inbound peer text has no consumer until a receiving-side broker exists. The\n  explicitly started `a2a.start` listener is unchanged — its tool `data` parts\n  are a documented feature and it is opt-in. See `docs/a2a.md`.\n\n• **The A2A streaming paths let one caller watch another's task live.**\n  car#1230 scoped the JSON-RPC task methods, but two paths reach a task by id\n  outside that handler table and were missed. `tasks/resubscribe` is\n  intercepted in the HTTP layer before `dispatch` ever sees it, and returned\n  `200 OK` with `content-type：text/event-stream` on a task belonging to a\n  different peer. `GET /a2a/stream/:task_id` took no identity at all, so on the\n  authenticated router any caller could stream any task; on the peer-auth\n  router that same route was unreachable because it was spelled `{task_id}` —\n  axum 0.8 syntax on axum 0.7, which matches the literal path only. Both now\n  consult the same `readable_by` predicate the JSON-RPC methods use, and the\n  route spelling is corrected in the same change, since fixing it alone would\n  have opened the hole it was accidentally hiding.\n\n• **One trusted peer could read, cancel, and write into another's tasks.** The\n  A2A task store is shared per listener and nothing recorded who created a task,\n  so `tasks/list` with null params returned every task on the surface with full\n  history — the exfiltration half of the push-notification hole reached by a\n  simpler route — while `tasks/get` and `tasks/cancel` took any id, and a\n  `message/send` naming someone else's non-terminal `taskId` appended to *their*\n  history. A `TaskRecord` now carries the creating caller's verified subject and\n  every one of those paths checks it：a task you do not own is not listed, reads\n  and cancels answer `TaskNotFound` rather than confirming it exists, and a\n  continuation is refused. Scoping bites only where there is an identity to\n  scope by — a surface whose auth produces none creates un-owned tasks and\n  behaves exactly as before — and the peer-authenticated router always has one,\n  because it forces `require_identity`. `TaskStore::create` takes the owner as a\n  parameter rather than offering a later setter, so an external implementor gets\n  a compile error instead of silently failing open.\n• **An agent id that could not be addressed as a peer registered anyway.** The\n  supervisor's `validate_id` accepted a leading `.` or `-`, an embedded `..`,\n  and any length; `car_peers::is_valid_peer_name` rejects all three. An id in\n  that gap — `.watcher` — started fine and was then silently unreachable:\n  filtered out of the peer directory, unable to receive `agents.message`, and\n  refused by `agents.chat` with a message naming neither cause nor fix.\n  `validate_id` now defers to the peer rule, and a test pins the two together so\n  they cannot drift apart again. **Migration:** an already-registered agent with\n  such an id now fails to start. It could not be messaged before either — this\n  makes existing breakage visible rather than introducing it.\n\n• The self-hosted daemon docs now state what agent binding (`session.auth { agent_id }`) is：identity and routing, not confinement. Every authorization gate that reads it has been audited per gate, and the two that only work in one configuration now say so.\n\n• Documented：binding a connection to a supervised agent (`session.auth { agent_id }`) is an identity and routing mechanism, not a security boundary. A supervised agent runs as the launching user and can therefore read the daemon-wide auth token directly, so it can always reconnect as an ordinary unbound client; the gates keyed on the bound agent attribute an action, they do not confine one. Host-role access is the separate boundary that is enforced, via a credential held in its own file and never served over HTTP. `docs/proposals/agent-binding-trust-boundary.md` records the reasoning and what real confinement would cost.\n\n• **Agent-owned run replay is pinned to the supervised-agent credential boundary.**\n  A real WebSocket regression now authenticates two supervised agents with\n  their distinct `CAR_AGENT_TOKEN` values and proves `runs.list` and\n  `runs.get_trace` return an agent's own persisted run while rejecting the\n  other agent's list and trace. The protocol reference now states the same\n  own-agent/cross-agent contract explicitly; host-management sessions retain\n  their wider read access.\n\n• **Pinned that the assistant's host-shell note actually reaches the prompt.** The\n  environment description gained a host-platform/shell line, but nothing asserted the one\n  condition it depends on (`!sandboxed && substrate.is_local()`) ever fires — so the note\n  could have been appended into a branch that never runs while `cargo check` and every\n  existing assistant test stayed green. The new test goes through `build_assistant_runtime`\n  and checks the assembled description names the host, and on Windows says `cmd /C` with\n  its concrete substitutions rather than `sh -c`.\n\n• **The flagship agent now gets better at tools, not just more remembered about\n  you.** `car do` already *remembered* (the `remember`/`recall` graph, durable\n  across sessions) and already *reacted* to recent trajectory pressure (the\n  proactive-memory pass). Neither made it better at anything：nothing turned\n  \"this is what finally worked\" into something a later run could reach, so a\n  user whose task it fumbled three sessions running watched it fumble the same\n  way a fourth time. The coder has had this since its repair-skill store landed;\n  the assistant did not, and the gap was pure wiring — it already emits the\n  failure receipts the store keys on. `assistant::tool_memory` closes it. A too"
