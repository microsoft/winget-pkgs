ReleaseNotes: "## v0.49.0\n\n### Security\n\n• **A web page you had open could drive the daemon's MCP endpoint.** `POST\n  /mcp` and `GET /mcp` accepted any request that reached the port, and browsers\n  will happily send a cross-origin POST to `http://127.0.0.1:9102/mcp` on\n  behalf of whatever page is loaded — so any site could call `tools/call` and\n  read or write the user's memory graph. Binding loopback does not prevent\n  this：the browser is *on* loopback, and DNS rebinding defeats the bind on its\n  own. The MCP HTTP transport requires `Origin` validation for exactly this\n  reason and CAR had none.\n\n  Both routes now validate `Origin`, absent-permissive and present-strict. **No\n  `Origin` header is allowed** — a browser always sends one on a cross-origin\n  request, so its absence cannot be a browser attack, and this is what keeps\n  every real client working (`curl`, Claude Desktop, Cursor, Claude Code\n  `--mcp-config`, Codex, and CAR's own connectors client all send none). An\n  `Origin` naming loopback — `http`/`https` on `localhost`, `127.0.0.0/8`, or\n  `::1`, any port — is allowed. Anything else, including the opaque literal\n  `null` sent by sandboxed iframes and `file://` pages, gets `403\n  {\"error\":\"origin not allowed\"}` before the request reaches the dispatcher, so\n  the tool never runs.\n\n  `GET /mcp/health` is deliberately exempt：no side effect, no secrets, and the\n  documented uptime probe has to keep working. The rule does not widen for a\n  non-loopback `--mcp-bind` — front the daemon with a reverse proxy that owns\n  its own CORS policy if you need browser traffic from another origin\n  (Parslee-ai/car#972 §3).\n\n### Fixed\n\n• **`car-inference` could not link on any Xcode older than 26.** `build.rs`\n  emitted `-Wl,-weak_framework,FoundationModels` unconditionally on every Apple\n  target. `-weak_framework` controls how the *load command* is written — it is\n  not a link-time \"optional\", so `ld` still resolves the name against the\n  active SDK and hard-fails with `framework 'FoundationModels' not found` when\n  it is absent. Pre-26 SDKs do not ship it.\n\n  The Swift shim already handled that case：every FoundationModels code path\n  sits behind `#if canImport(FoundationModels)`, so on such an SDK the compiled\n  object references no FM symbols and the framework is not needed at all — the\n  two guards had simply drifted apart. `build.rs` now probes the SDK and emits\n  the link arg only when the framework is really there, with a `cargo:warning`\n  otherwise. All six `@_cdecl` entry points are declared outside those blocks,\n  so the static library still exports the full C ABI, `car_fm_swift_built`\n  stays set, and `car_fm_is_available` reports 0 — the adaptive router falls\n  through to another backend exactly as it does on pre-26 *runtimes*.\n\n  Nothing caught this because nothing linked the crate on an older SDK：the\n  Linux `test` job compiles no Apple code and `apple-checks.yml`'s macOS job\n  ran `cargo check`, which executes `build.rs` but skips codegen and linking.\n  The `cargo test` step added in Parslee-ai/car#971 is the first one that\n  links, and it failed on its first real run.\n\n• **Five daemon JSON-RPC methods were dispatched but documented nowhere.**\n  `assistants.invoke`, `events.stats`, `events.truncate`, `events.clear`, and\n  `memory.build_context_fast` all worked, and appeared in neither\n  `docs/websocket-protocol.md` nor the `car-bindings-api` skill that calls\n  itself the canonical list. External developers consume CAR through those two\n  and have no access to the source, so an undocumented method is an\n  unreachable one. Found by a release-time sweep of every dispatch arm against\n  the docs; each is now written up with its real parameter and return shape.\n\n  Two of them deserved the words more than most：`events.clear` is destructive\n  and unconditional — it drops the whole session log including the\n  `events.query` audit trail and any `events.chain.enable` hash chain, with no\n  undo — and `memory.build_context_fast` returns facts in **creation order,\n  not relevance order**, which is easy to reach for by name and wrong for\n  anything that reasons over the result.\n\n  `scripts/check-ffi-parity.sh` now covers all five so they cannot drift out\n  again：`build_context_fast` as a full cross-binding row (it ships on all four\n  FFI surfaces and had none), the other four under `WS_ONLY_CAPABILITIES`,\n  which still asserts dispatch + protocol doc + skill. 257 capabilities\n  checked, up from 252. The crate count in `README.md` and `CLAUDE.md` was\n  corrected from 66 to 68 in the same sweep; the README crate map itself was\n  already complete.\n\n• **The daemon's MCP endpoint ignored the `MCP-Protocol-Version` request\n  header.** A client that had negotiated a revision on `initialize` and then\n  named it on every later request — which the HTTP transport asks it to do —\n  was answered identically whether it asked for `2024-11-05` or for a revision\n  the server has never heard of. `handle_mcp_post` and `handle_mcp_get` read no\n  version header at all.\n\n  Both routes now check it, absent-permissive and present-strict, the same\n  shape as the `Origin` guard above. **An absent header is allowed** — every\n  shipped client sends nothing today, and `car_mcp::SUPPORTED_VERSIONS` holds a\n  single entry, so the revision a silent client negotiated is necessarily the\n  one we would have demanded; requiring the header would break `curl`, Claude\n  Desktop, Cursor, and Claude Code for no gain. A value in\n  `SUPPORTED_VERSIONS` is allowed.\n\n  The one narrowing：a client that sends a version *outside*\n  `SUPPORTED_VERSIONS` now gets `400 {\"error\":\"unsupported\n  MCP-Protocol-Version\",\"requested\":…,\"supported\":[…]}` instead of being\n  answered in a dialect it never agreed to. The rejection lands before the\n  JSON-RPC parse on `POST` and before the SSE session insert on `GET`, so the\n  tool does not run and no session is registered. `GET /mcp/health` stays\n  exempt — it is how a rejected client learns which revision the server speaks.\n  `PROTOCOL_VERSION` is unchanged (Parslee-ai/car#972 §3).\n\n• **MCP `initialize` echoed our protocol version instead of negotiating, and a\n  notification POST answered `200 {}` instead of `202`.** The `initialize` arm\n  ignored `params` entirely and returned `PROTOCOL_VERSION` unconditionally.\n  That is benign today only by accident — `2024-11-05` is the oldest revision,\n  and a client that supports something newer must accept an older server — but\n  it makes bumping the constant a breaking change：every client asking for\n  `2024-11-05` would suddenly be handed a revision it never requested, which\n  the spec says it SHOULD refuse.\n\n  `initialize` now negotiates against a new `car_mcp::SUPPORTED_VERSIONS` list:\n  the requested version comes back when the server supports it, and absent,\n  non-string, and unsupported all fall back to `PROTOCOL_VERSION` as a normal\n  result (not a JSON-RPC error), leaving the client to proceed or disconnect.\n  The reply is always an entry from the list, never the client's own bytes.\n  Separately, `POST /mcp` answers a notification with `202 Accepted` and an\n  empty body, which is what the Streamable HTTP transport specifies — a `200`\n  carrying `{}` invented a reply where JSON-RPC 2.0 says there is none.\n\n  **No client's observed behavior changes today**：`SUPPORTED_VERSIONS` holds\n  one entry, so echo and fallback produce the same string, and a client sending\n  no `protocolVersion` is answered exactly as before. The point is that a\n  future revision bump becomes an append rather than a breaking change\n  (Parslee-ai/car#972 §3).\n\n• **`car policy-check-hook` wedged every tool call when the installed CLI\n  predated it.** The subcommand documents a fail-open posture, and it held for\n  everything reachable from inside the hook — an unreadable payload, a missing\n  policy directory. It did not cover the failure most likely in the field：the\n  binary is present but the *subcommand* is not. clap rejects the argv and exits\n  **2** before the hook runs, and 2 is the one exit code Claude Code reads as\n  *block this tool call*. The collision is exact. Every `Bash`, `Write`, `Edit`,\n  `WebFetch` and `NotebookEdit` call in the session was refused with clap's usage\n  text as the stated policy reason — an install problem presented as a policy\n  denial, which is the thing the fail-open posture exists to prevent — and it\n  disabled the very tools an operator would reach for to investigate. A stale\n  `/usr/local/bin/car` is an ordinary state, documented by `car update` itself:\n  CarHost.app auto-updates its bundled daemon via Sparkle and leaves the CLI\n  behind.\n\n  `car` now parses its arguments **fallibly**. On a usage error whose argv names\n  `policy-check-hook`, it prints the reason on stderr — naming the gate as not\n  gating, and `car update` as the fix — and exits **0**. Every other subcommand\n  keeps clap's conventional 2; the branch is scoped to the hook argv, because\n  changing exit semantics CLI-wide to fix a hook-specific problem is the wrong\n  trade. The fail-open guarantee now covers the process not starting, not just\n  the evaluation not completing, which is the general rule for anything that can\n  refuse a tool call.\n\n  The plugin's hook command is `car policy-check-hook; exit 0`, which is what\n  helps a CLI *already* installed and therefore unpatchable. Lossless：no\n  decision travels in the exit code — a deny rides in\n  `hookSpecificOutput.permissionDecision` on stdout with exit 0 — so this\n  discards only the accidental codes (a usage error, a missing binary, a panic),\n  all of which mean *we could not check*. `; exit 0` rather than `|| exit 0` on purpose：Claude\n  Code runs a hook through a shell, and on Windows without Git Bash that shell is\n  Windows PowerShell 5.1, where `||` is a parser error that would have silently\n  disabled the gate on the platform the subcommand was introduced to support\n  (Parslee-ai/car#993).\n• **The nightly Windows job was red on a test that hard-coded a `/`"
