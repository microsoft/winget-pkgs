ReleaseNotes: "## v0.50.0\n\n### Fixed\n\n• **`exit code 100` in a nextest step now has a name, and one place to fix\n  it.** Two runs failed on a step whose only annotation was `Process completed\n  with exit code 100` — no failing assertion, no test named, matching no known\n  signature. The real line sat in the job log：`fatal runtime error: stack\n  overflow, aborting`, aborting one arbitrary `car-server-core` test with\n  SIGABRT. The two runs died on two *different* tests, which is the tell：no\n  test was at fault. `handler.rs` is a single `async fn` dispatcher over 382\n  string-literal method arms, and in a debug build the resulting future is\n  megabytes wide — wider than the 2 MiB stack Rust gives the thread libtest\n  runs each test on. The tests passed until an unrelated change grew the future\n  a few hundred KB, then an arbitrary one of them aborted.\n\n  `RUST_MIN_STACK` now lives in the repo-root `.cargo/config.toml`'s `[env]`,\n  which cargo applies to every process it launches, from every cwd and on every\n  cargo version. Previously it was a step-level `env:` on the one CI step where\n  the overflow was observed, while the other seven invocations that run these\n  same tests — `coverage`, `shared-process-test`, the doctest step, two\n  `check-windows` steps, `build.yml`'s tag-time run and `ci-local.sh` — had no\n  protection. `coverage` is the one that went over：it failed on `main`'s\n  2026-08-25 nightly with the identical SIGABRT, and passes with this change.\n  No test, assertion or gate was changed; the process is given the stack the\n  code it exercises needs. `car-server-core/tests/stack_budget.rs` fails by\n  name if the budget is ever removed, rather than letting an unrelated test\n  abort months later.\n  `docs/solutions/nextest-exit-100-is-a-stack-overflow.md` carries the full\n  trail, including what to do when 8 MiB is not enough either.\n\n• **A slow `build-windows` no longer strands a release half-published.**\n  `release.sh`'s Step-3 wait for CI to create the GitHub Release was a fixed\n  720 x 10 s = 120 min budget, sized off the slowest Windows build anyone had\n  measured. Cutting v0.49.0 that job took 2 h 6 m while legitimately\n  progressing, the budget expired on a healthy run, and everything downstream\n  of the wait — the signed macOS upload, the `preflight-macos-assets` gate, the\n  npm/PyPI publishes and the mirror, then the whole post-CI tail — silently did\n  not happen. Re-driving CI does not repair that, because CI does not own the\n  tail.\n\n  The wait is now adaptive：it asks the workflow run whether a job that could\n  still create the release is running. A healthy run keeps waiting past the old\n  two hours, and a run that reached a terminal state without creating the\n  release now fails in minutes instead of hours. A 6 h hard ceiling and a\n  soft budget (past which a run that reads non-healthy on five consecutive\n  minute-apart probes is fatal — one unreadable `gh` response is not, or a\n  rate-limit blip would strand the release the same way the clock did) keep it\n  bounded. Every failure path prints the exact recovery — the already-notarized\n  assets staged on disk are the resume point, `backfill-macos-assets.sh` is the\n  expensive wrong tool for this — and `scripts/test-release-ci-wait.sh` runs\n  the real loop against a canned `gh` on every PR.\n\n### Added\n\n• **The supervised assistant can now run a repository-scoped, durable,\n  governed host workflow without delegating its engineering loop to another\n  coding agent.** `car do --serve --governed-host --dir <repo>` binds host\n  toolchains and network access to an explicit Git repository, keeps\n  consequential actions behind exact-scope durable approvals, applies\n  project-defined deployment/database gates, checkpoints exact model history,\n  fences crash-boundary dispatch from replay, and emits hash-chained receipts\n  with local, remote, CI/CD, deployment, health, and browser proof reported as\n  separate stages. New sync checkpoint/action JSON-RPC and Node/Python binding\n  methods expose the durable records for audit and recovery.\n\n• **Local models now have durable CAR ownership, resource controls, and safe\n  removal across the daemon, CLI, Node, and Python surfaces.** Successful pulls\n  write private receipt records against CAR-managed projections; existing\n  artifacts can be explicitly adopted. `models.list_unified` reports\n  `car_enabled`, `can_remove`, `in_use`, and management evidence. Host-gated\n  Remove from CAR drains runtime owners and cross-process leases, writes a\n  tombstone, and unlinks only an identity-checked managed symlink/file—shared\n  Hugging Face blobs are never recursively deleted. Receipt-backed directory\n  installs remain usable but report `can_remove=false` until CAR has portable\n  object-bound directory traversal. New resource-policy get/set and model\n  preflight methods expose the exact RAM ceiling and live admission verdict.\n\n• **CAR Host now opens on an outcome-first Command Deck built for everyday\n  use.** The new Ask CAR home leads with a plain-language prompt, guided setup\n  actions, real approval and agent status, and direct paths to starter-agent\n  creation without exposing runtime internals first. Opening an agent keeps the\n  focused two-region workspace：requests run through the existing declarative\n  agent surface and their complete output, errors, and receipts are saved under\n  `~/Library/Application Support/CarHost/work/` so closing the window never\n  hides where finished work went. A guided New Agent conversation reuses CAR's\n  existing coder contract, checks, approval, and registry flow rather than\n  creating a second agent system. The legacy diagnostic dashboard remains an\n  explicit recovery surface：launch with `CAR_HOST_LEGACY_DASHBOARD=1`, or set\n  the `car.dashboard.useLegacy` user default to `true` for a choice that\n  persists across launches and still applies when the app is opened from the\n  Dock, where an environment variable cannot reach it. The override is\n  one-way：`CAR_HOST_LEGACY_DASHBOARD=1` forces the legacy surface on\n  whatever the preference says, but `=0` does **not** force the Command Deck\n  back on over a `true` preference — clear the user default to undo it.\n\n• **The macOS model setup now makes local-model acquisition visible and\n  distinguishes using, verifying, and downloading.** An installed model that\n  CAR already verified can be selected for CAR Chat without downloading it\n  again; installed but unverified models are verified first, and missing\n  models show download progress and a durable ready, failure, or uncertain\n  outcome in the setup surface. Recommendations now separate download size\n  from CAR's hardware-fit estimate and the effect of unified-memory pressure,\n  while an eligible smaller recommendation is surfaced as a data-driven\n  \"Lighter option.\"\n\n• **Release proof can exercise the real macOS Keychain path without touching\n  yours.** Two environment variables make an isolated Keychain selectable for a\n  smoke run：`CAR_KEYCHAIN_PATH` names an explicit Keychain file, which CAR\n  appends to every `/usr/bin/security` read, status, write, and delete it\n  performs, and `CAR_KEYCHAIN_PROOF_ROOT` names the owner-private directory\n  that Keychain must live inside. The proof root is *required* whenever the\n  path is set — naming a Keychain with no root is an error, not a silent\n  fall-back to your default Keychain. CAR validates the pair before every use\n  and refuses a path that is relative, a symlink, owned by another user,\n  group- or other-accessible, or canonically outside the proof root. The\n  default Keychain and the search list are never modified, and with\n  `CAR_KEYCHAIN_PATH` absent behavior is exactly what it was. macOS only, and\n  a Keychain *selector* — not a plaintext secret backend.\n\n### Changed\n\n• **Local model allocation is now admission-controlled across native, voice,\n  worker, and supervised-process boundaries.** CAR keeps one machine-wide\n  charge per physical allocation, retains it through cancelled native work and\n  confirmed process-tree teardown, and never substitutes a different model for\n  an explicitly selected local model. The public model-source schema adds\n  `managed_vllm_mlx` only for CAR-owned/downloaded/supervised vLLM-MLX\n  processes. Existing `vllm_mlx` JSON remains backward compatible and continues\n  to mean an externally managed OpenAI-compatible endpoint; CAR does not\n  reinterpret or locally admit those configurations. This is a public Rust enum\n  addition：downstream exhaustive matches on `ModelSource` must add a\n  `ManagedVllmMlx` arm (or a forward-compatible wildcard) when updating to this\n  release.\n\n• **The public Rust `ModelInfo` struct adds local-management evidence fields.**\n  `car_enabled`, `can_remove`, `in_use`, and `management_evidence` are\n  backward-compatible on JSON/Serde reads through defaults, but this is a Rust\n  source compatibility break for downstream exhaustive struct literals and\n  destructuring. Rust consumers updating to this release must add the four\n  fields (or avoid exhaustive construction); older serialized catalog rows\n  continue to deserialize unchanged.\n\n• **Local-model recommendations now distinguish visible alternatives from safe\n  automatic defaults.** The daemon, `car setup`, automatic first-run download,\n  and concierge all load the persisted resource policy. Everyday Assistant\n  setup prefers a tool-capable model inside its conservative recommendation\n  target while retaining heavier and unknown-memory candidates for an explicit\n  choice. Recommendation responses add `within_recommendation_target`; corrupt\n  or unreadable policy state is reported while CAR safely falls back to\n  Everyday. `car onboard` now falls back to the legacy catalog only when an\n  older daemon returns JSON-RPC method-not-found, so current registry failures\n  are no longer hidden.\n\n• **macOS credential access is now demand-driven.** App startup and passive\n  Home, Models, setup, health, and catalog rendering perform zero secret-store\n  rea"
