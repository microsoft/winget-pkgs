ShortDescription: Desktop publishing for Windows that opens, edits and prints Microsoft Publisher .pub files.
Description: |-
  PubStudio opens Microsoft Publisher .pub files (Publisher 98 to 365) with their text boxes, pictures, tables and master pages, so you can edit, print and save them as PDF.
  Make flyers, newsletters, brochures, cards, calendars and labels with a familiar ribbon.
  Opening, editing, printing and PDF are free with no account. PubStudio Pro is an optional subscription.
  PubStudio is an independent app, not made by or affiliated with Microsoft.
