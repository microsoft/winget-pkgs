ShortDescription: Content-aware compression CLI that picks the best codec per file automatically
Description: >-
  omnic classifies every file (~1 ms per file) and routes it to the best codec
  automatically — xz for text, brotli for flat bitmaps, zstd for the balanced
  tier, byte-exact store for already-compressed assets. Archives get
  per-file random access (millisecond single-file extraction), per-block CRC
  corruption isolation, and parallel pack/unpack through worker pools.
