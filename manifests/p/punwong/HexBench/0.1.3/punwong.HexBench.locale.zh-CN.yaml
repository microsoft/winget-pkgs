ShortDescription: 常驻托盘的 Windows 效率工具箱：边缘切桌面、快捷语面板。
Description: HexBench（海克斯）是常驻系统托盘的 Windows 效率工具箱。第一个工具把鼠标推到屏幕最外侧边缘即可切换虚拟桌面；第二个工具是贴在聊天软件旁边的快捷语面板，点一下就填入或发送。配置可用 WebDAV 在多台设备间同步，更新一键完成、不需要安装向导。
