ReleaseNotes: |-
  Hello! Welcome to Processing 4.5.6. I hope it works!
  Things of note:
  - Not only did we upgrade Gradle 8.14.4, we also upgraded to Gradle 9.1! (We are now on Gradle 9.x)
  - Mark Sherman's Students made many PRs that were merged in YAY
  - @neobrain has officially landed something that will enable the Processing Nix package
  Outside of the Release: the-wgpu-moment branch that has been around almost a year is now merged into main! So do reach out in the discord if you're curious about playing with that. It is not made to be easily explored just yet, but we do want to know if you're interested in playing with it, and will definitely help it work on your system.
  Moon
  What's Changed
  What's Changed 🎊
  - Gradle 9 compatibility by @letorbi in https://github.com/processing/processing4/pull/1535
  - Bump Gradle version to 8.14.4 by @dagadeta in https://github.com/processing/processing4/pull/1523
  - Update window class in desktop file template by @letorbi in https://github.com/processing/processing4/pull/1534
  - Adding unit tests for PShapeOBJ in processing:core by @jaredacord in https://github.com/processing/processing4/pull/1081
  - Replace System.err with Messages.showWarning by @Stefterv in https://github.com/processing/processing4/pull/1358
  - Added tests for DoubleList by @srnkan in https://github.com/processing/processing4/pull/1496
  - Added testing for Sort.java by @ericahin in https://github.com/processing/processing4/pull/1494
  - Avoid disposing current unique window by @Stefterv in https://github.com/processing/processing4/pull/1472
  - Fix JDK dirPermissions placement in gradle build files by @neobrain in https://github.com/processing/processing4/pull/1473
  - P Font Tests by @isazfranz in https://github.com/processing/processing4/pull/1511
  - Lower bounds check on IntList get by @smarasca5 in https://github.com/processing/processing4/pull/1477
  - Add a fallback for when project version is unspecified by @catilac in https://github.com/processing/processing4/pull/1536
  - Resolves: #[1417] Value Now Compares to missingFloat Variable by @ericahin in https://github.com/processing/processing4/pull/1441
  - Updated readInt method so streams are closed on failure or success by @srnkan in https://github.com/processing/processing4/pull/1476
  - Merge WebGPU backend by @tychedelia in https://github.com/processing/processing4/pull/1514
  - X11 wayland features on linux by @catilac in https://github.com/processing/processing4/pull/1540
  - Some tokens used as variable names incorrectly reported as errors by @tychedelia in https://github.com/processing/processing4/pull/1543
