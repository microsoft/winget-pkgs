ReleaseNotes: |-
  截图
  新增功能
  -【截图】增加多截图模式，可在普通截图、自由截图、折线截图和多窗口截图之间切换，进入截图状态后，默认快捷键为 Ctrl（Control）+ Tab
  多截图模式支持在一次截图中继续添加或移除截图区域，并将所有选中的区域合并保存为一张图片。 操作方法：确定任意截图选区后，点击左上角的加减号按钮，即可添加或删除截图区域。
  自由截图
  沿鼠标轨迹绘制闭合区域进行截图。 操作方法：长按鼠标左键，松开后确定选区。
  折线截图
  依次点击设置端点。至少设置三个端点后，按鼠标右键确认截图区域；端点不足三个时，按鼠标右键会取消已有端点。
  多窗口截图
  同时选中并截取多个窗口。
  为什么会出现透明区域？
  图片文件需要以矩形画布保存，使用自由截图、折线截图，或合并多个不连续的截图区域时，选区没有覆盖到的部分会保留为透明区域。不同软件可能会将透明区域显示为棋盘格、白色或黑色背景，这不影响实际截图内容。
  -【截图】常规截图工具栏增加“编辑”按钮。该按钮默认隐藏，可手动调整至一级菜单
  设置调整
  -【截图】「配置」-「外观」增加“选区边框颜色”设置
  -【长截图】「配置」-「截图」-「长截图」增加“响应快捷键”设置。启用后，长截图过程中无法使用鼠标中键滚轮滚动
  -【长截图】支持设置阴影和边框，并跟随普通截图的相关设置
  -【折线截图】「配置」-「截图」-「折线截图」增加“折线圆角”设置，可调整圆角大小
  -【截图】「配置」-「截图」-「辅助线」增加“三分法网格”选项
  体验优化
  -【截图】未勾选“显示信息栏”时，多截图模式仍会显示加号和减号图标
  -【UI 检测】在桌面上默认仅检测鼠标所在的屏幕
  贴图
  新增功能
  -【贴图】支持播放 GIF 和 WebP 动图（推荐选中图片后用快捷键 alt+~快速贴出）
  -【贴图】对齐功能增加左对齐和右对齐
  设置调整
  -【贴图】「配置」-「贴图」增加“新建贴图时保持其他贴图隐藏状态”设置
  -【贴图】macOS「配置」-「贴图」增加“贴图桌面显示”设置，支持按桌面控制贴图的显示范围
  -【贴图】「配置」-「贴图」中的“快速保存图像类型”修改为“保存/复制时的图像类型”
  体验优化
  -【贴图】仅启用缩略图时，右键菜单也会显示“复制原始图像”和“原始图像另存为”选项
  -【贴图】托盘菜单与贴图右键菜单中的“销毁”操作增加二次确认
  标注
  新增功能
  -【标注】绘制折线时支持使用 Tab 键切换是否启用箭头
  -【标注】序号标注增加箭头样式
  设置调整
  -【标注】「配置」-「标注」增加“将标注内容限制在选区内”设置
  -【标注】支持修改序号标注的前景颜色，并在「配置」-「标注」中增加“序列号前景颜色”设置
  -【标注】「配置」-「标注」-「序列号」增加“序号全局计数”选项
  -【标注】模糊强度最大值调整为 50
  体验优化
  -【标注】优化序号标注文本的换行逻辑和较小尺寸下的使用体验
  -【标注】序号标注缩小时，周围的操作按钮会保持最小间距
  -【标注】绘制箭头后，评论输入框会自动获得焦点
  -【标注】优化圆角等按钮在标注状态下的显示逻辑
  录制与导出
  新增功能
  -【键鼠录制】增加横向滚动动画
  -【录制】录制或回放预览过程中意外退出时，下次打开软件会弹窗是否恢复录制内容
  -【快捷键】「配置」-「内置快捷键」-「截图」增加“录制时暂停”动作，需手动设置快捷键
  体验与性能优化
  -【录制】优化 Windows 和 macOS 的录制性能
  -【录制】优化普通录制回放预览的性能占用
  -【录制】提高屏幕录制的码率
  -【录制】记忆上次导出时选择的画质
  -【导出】开启硬件加速后，MP4 导出过程支持调用 GPU
  -【硬件加速】启用硬件加速时增加硬件测试
  -【录制】优化鼠标经过摄像头按钮时的性能表现
  识别与翻译
  新增功能
  -【会员 · 新增】【翻译】现代保存对话框支持同时显示翻译图文对照和文本翻译结果
  -【会员 · 新增】【翻译】增加源语言显示
  -【会员 · 新增】【表格识别】识别窗口右键支持合并、拆分单元格以及删除行列等操作
  -【会员 · 新增】【表格识别】编辑窗口增加表格识别按钮；如需识别长截图中的表格，请进入编辑窗口操作
  -【会员 · 新增】【公式识别】支持使用 Ctrl+C 复制识别结果，并增加“复制并关闭”选项
  体验优化
  -【文字识别】识别窗口会记忆上次选择的置顶状态
  -【文字识别】标点选项会记忆上次的选择
  -【翻译】使用剪贴板翻译预设时不再显示贴图
  -【会员 · 优化】【表格识别】保存识别结果时会记忆上次使用的文件夹位置
  -【会员 · 优化】【表格识别】识别结果文件由设备的默认打开方式打开
  -【会员 · 优化】【公式识别/表格识别】识别窗口会记忆上次选择的置顶状态
  保存与编辑
  设置调整
  -【保存】保存路径增加更多变量
  体验优化
  -【编辑】图像缩放时不再进行平滑处理
  -【编辑】编辑窗口会记忆上次选择的置顶状态
  -【保存】变量说明增加 Windows 文件名限制的提示
  -【保存】优化经典保存对话框的默认显示位置
  -【自动保存】保存失败时增加提示弹窗
  快捷键与其他
  新增功能
  -【窗口】支持使用 Ctrl+W 关闭各类 PixPin 窗口
  -【快捷键/动作】增加“隐藏当前选中以外的贴图”动作
  设置调整
  -【快捷键】快捷键录入支持 Alt+PrtSc、Ctrl+ScrLk 和 Ctrl+PauseBreak 组合键
  体验优化
  -【触控板】降低使用触控板切换 UI 元素时的灵敏度
  -【悬浮球】优化悬浮球位于两个显示器交界处时的显示效果
