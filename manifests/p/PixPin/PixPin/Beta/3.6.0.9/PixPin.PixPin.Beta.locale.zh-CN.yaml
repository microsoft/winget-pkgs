ReleaseNotes: |-
  3.6.0.9
  新增功能
  -【窗口贴图】支持贴出多个窗口贴图。
  -【文本贴图】HTML 文本贴图支持限制宽度，默认为 800，若影响贴图效果，请调整该数值。
  -【文字识别】支持下载文字转语音文件。
  -【文字识别】识别窗口增加字号选择。
  -【文字识别】识别窗口支持复制图片。
  -【自动马赛克】选框支持手动调整范围。
  -【保存/复制】支持在复制或保存图像时写入 EXIF 信息，可在「配置」-「保存」-「复制或保存时写入 EXIF 信息」中设置。
  -【编辑】裁剪图片时，支持拖动非图片区域移动显示范围。
  -【表格识别】支持按 Backspace 删除选中单元格；选中列头或行头时，按 Ctrl+-（减号）可删除整行或整列（包括单元格），支持按 Ctrl+Z 撤回。
  -【长截图】支持跨屏长截图。
  -【快捷键】增加「复制鼠标坐标」内置快捷键，对应放大镜显示的坐标，默认快捷键为 Alt+C，支持全局和相对模式。可在「配置」-「内置快捷键」-「截图与贴图」中设置。
  -【标注】水印标注增加描边。
  -【标注】序号标注支持通过快捷键快速增减数字，按 Z 增加，按 X 减小。
  -【标注】按 Tab 可在圆形标注和矩形标注之间切换。
  设置调整
  -【网络代理】增加「跟随系统代理」选项。
  -【贴图】双击贴图文字时，可选择「单行」或「段落」选择模式。如果双击选中了多余内容，请切换为「单行」。
  -【截图】圆角半径上限提高到 100。
  -【表格识别】识别窗口增加「识别表格后自动关闭原贴图」选项。
  -【快速录制】增加默认保存位置设置，可在「配置」-「保存」-「快速录制」中设置，默认不开启。
  -【标注】荧光笔的画笔样式增加默认模式选择，可在「配置」-「标注」-「荧光笔」中设置，并通过 Shift+鼠标左键切换。
  体验与性能优化
  -【窗口贴图】优化显示效果，使用窗口贴图后，原窗口会隐藏。
  -【截图】优化自定义截图窗口的显示效果。
  -【编辑】裁剪图片后保持原缩放比例。
  -【文字识别】优化排版设置中的标点转换效果。
  -【文字识别/表格识别】优化识别窗口中图像的显示位置。
  -【标注】优化贴图旋转后文本标注和序号标注的操作逻辑。
  -【贴图】补充部分右键菜单的快捷键显示。
  -【贴图】通过 Shift+鼠标左键双击或按 R 切换缩略图时，优先切换为通过右键裁切后的大小。
  -【文字识别】勾选「下次直接复制文本」后，直接复制的文本同步应用已选排版设置。
  问题修复
  -【历史截图】修复截图顺序显示异常的问题。
  -【截图】修复在任务管理器下使用延时截图时截图失败的问题。
  -【标注】修复序号标注部分样式颜色异常的问题。
  -【兼容性】修复 macOS 13 及以下版本无法打开软件的问题。
  -【贴图】修复第一次贴图在显示器之间移动时卡顿的问题。
  -【配置】修复多次点击同一配置窗口入口会产生多个窗口的问题。
  -【截图】修复某些情况下 UI 检测异常的问题。
  -【贴图】启动软件时，尺寸超过屏幕大小的贴图会限制窗口尺寸，使其不超过屏幕大小；未超过屏幕大小的贴图保持原图显示，避免部分性能较差的设备出现循环崩溃的问题。
  -【贴图】修复右键菜单中关闭或销毁贴图时的二次确认弹窗未关联配置页设置的问题。
