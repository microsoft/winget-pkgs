ReleaseNotes: |-
  3.5.2.2
  New Features
  - Long Screenshot: Added a “Mouse Pass‑Through” option to “Settings” > “Screenshot” > “Long Screenshot,” which is enabled by default.
  - Table Recognition: Added a table recognition button to the editing window; to recognize tables in long screenshots, please use the editing window.
  - Recording: If you unexpectedly exit during recording or playback preview, the software will restore your recording when you reopen it.
  Experience and Performance Improvements
  - Recording: The software now remembers the video quality setting used in the last export.
  Bug Fixes
  - Keyboard Shortcuts: Fixed an issue where Ctrl+Tab was registered as a global shortcut; it has now been moved to “Settings” > “Built‑In Shortcuts” > “Screenshot.”
  - Screenshot: Resolved a problem in multi‑region screenshot mode where deleting an inner screenshot area had no effect.
  - UI: Fixed several UI issues.
  3.5.1.0
  New Features
  - Screenshot: Added multiple screenshot modes—Normal, Polyline, Freehand, and Multi‑Window—switchable via Ctrl+Tab after pressing the screenshot hotkey; hold Ctrl and tap Tab repeatedly for continuous switching.
  - Screenshot: In Freehand mode, you can draw a closed region along the mouse path to capture that area.
  - Screenshot: Polyline mode lets you click to set endpoints one by one. After setting at least three points, right‑click to confirm the screenshot area; if fewer than three points are set, right‑click will cancel the existing points.
  - Screenshot: Multi‑Window mode allows you to capture multiple selected windows simultaneously.
  - Screenshot: All of the above modes let you click the plus or minus icons in the upper left corner to add or remove regions, then merge all captures into a single image.
  - Table Recognition: Right‑clicking in the recognition window now supports merging, splitting cells, and deleting rows or columns.
  - Text Recognition: Added an option in the recognition window to “Highlight corresponding text in the image when selected”; this must be manually enabled.
  - Text Recognition: Added an option to “Automatically copy text when closing the window”; this must be manually enabled.
  Settings Adjustments
  - Long Screenshot: Added a “Respond to Hotkeys” setting under “Settings” > “Screenshot” > “Long Screenshot.” When enabled, the middle‑mouse wheel scroll is disabled during long screenshot capture.
  - Polyline Screenshot: Added a “Polyline Corner Radius” setting under “Settings” > “Screenshot” > “Polyline Screenshot,” allowing you to adjust the roundness of corners.
  - Long Screenshot: Supports shadow and border settings, which follow those of the Normal Screenshot mode.
  - Long Screenshot: The border color matches that of the Normal Screenshot.
  - Annotation: The maximum blur intensity has been adjusted to 50.
  - Keyboard Shortcuts: Shortcut input now supports the key combinations Ctrl+ScrLk and Ctrl+PauseBreak.
  Experience and Performance Improvements
  - Sticker: Even with thumbnails disabled, the right‑click context menu still displays “Copy Original Image” and “Save Original Image As.”
  - Table Recognition: Recognition result files open with the device’s default application.
  - Translation: Clipboard‑based translations no longer display stickers when preconfigured.
  - Annotation: After drawing an arrow, the comment input box automatically gains focus.
  Bug Fixes
  - Notifications: Fixed an issue where Tips did not remain visible.
  - Export: Resolved a problem where minimizing the window during video export prevented reopening the interface.
  - Annotation: Fixed an issue with incorrect display of numbered annotations on macOS when using multiple monitors.
