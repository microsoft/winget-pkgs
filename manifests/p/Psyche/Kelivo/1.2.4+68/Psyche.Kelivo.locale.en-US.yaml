ReleaseNotes: |-
  What's Changed
  - feat: Add per-role user/assistant bubble style overrides, with independent editing and live preview.
  - feat: Add a setting to keep the screen on during generation.
  - feat: Add settings to hide thinking cards, tool cards, and markdown images inside tool cards.
  - feat: Improve the soft sheen on in-progress thinking and tool cards.
  - feat: Add event reminders for calendar_create.
  - feat: Adapt DeepSeek vision and thinking efforts, Gemini 3.7, Grok 4.6, and Laguna thinking/tool support.
  - fix: Cut send latency and scope the file parsing indicator to the owning message.
  - fix: Make title summarization opt-in unless a title model is set, so unconfigured users no longer get a failure toast after every reply.
  - fix: Stop backup export from hanging, with cancellable progress and hardened Android backup streaming.
  - fix: Fix frosted timeline snapshot lifecycle, grouping, and tool extent estimates.
  - fix: Preserve reply position when regenerating, and keep collapsed reasoning when editing assistant text.
  - fix: Decode Step SSE transcripts as UTF-8, and preserve malformed SSE text.
  - fix: Fix several other known bugs and UI issues.
  Full Changelog: https://github.com/Chevey339/kelivo/compare/v1.2.3...v1.2.4
