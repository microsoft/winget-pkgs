PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: ko-KR
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Picasa Photo Viewer 스타일의 가볍고 빠른 사진 뷰어. HEIC, AVIF, WebP, JPEG XL, RAW, 움직이는 GIF/APNG 등을 엽니다."
Description: |-
  Windows 10/11용 무료 사진 뷰어로, Picasa Photo Viewer처럼 사진을 두 번 클릭하면 어두워진 바탕 화면 위에 바로 열립니다. 라이브러리, 가져오기, 편집, 광고가 없습니다.

  - 어두워진 바탕 화면 위 또는 전체 화면, 아래쪽에 폴더 필름스트립
  - 커서 쪽으로 부드러운 확대/축소, 화면에 맞춤 / 1:1, 이동, 회전, 슬라이드 쇼
  - EXIF 정보: 카메라, 노출, 조리개, 초점 거리, 촬영 날짜
  - 움직이는 GIF, APNG, WebP, AVIF, 여러 페이지 TIFF
  - HEIC/HEIF(iPhone 사진), AVIF, WebP, JPEG XL, 카메라 RAW(CR2, CR3, NEF, ARW, DNG…), 그리고 TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - 필요할 때 Microsoft Store에서 설치할 무료 코덱을 알려 줌
  - 약 300KB exe 하나: 설치 불필요, 관리자 권한 불필요
  - 13개 언어, 모든 기능에 단축키
