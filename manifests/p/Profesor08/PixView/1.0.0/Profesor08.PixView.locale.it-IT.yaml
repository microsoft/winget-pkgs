PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: it-IT
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Visualizzatore di foto veloce e leggero nello stile di Picasa Photo Viewer. Apre HEIC, AVIF, WebP, JPEG XL, RAW, GIF/APNG animati e altro."
Description: |-
  Visualizzatore di foto gratuito per Windows 10 e 11 nello stile di Picasa Photo Viewer: fai doppio clic su una foto e si apre all’istante sul desktop oscurato. Nessuna libreria, nessuna importazione, nessuna modifica, nessuna pubblicità.

  - Sul desktop oscurato o a schermo intero, con la striscia di miniature della cartella
  - Zoom fluido verso il cursore, adatta / 1:1, spostamento, rotazione, presentazione
  - Dettagli EXIF: fotocamera, esposizione, diaframma, lunghezza focale, data di scatto
  - GIF, APNG, WebP e AVIF animati; TIFF multipagina
  - HEIC/HEIF (foto di iPhone), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), oltre a TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Indica quale codec gratuito del Microsoft Store installare quando serve
  - Un solo exe di circa 300 KB: senza installazione né diritti di amministratore
  - 13 lingue, scorciatoie da tastiera per tutto
