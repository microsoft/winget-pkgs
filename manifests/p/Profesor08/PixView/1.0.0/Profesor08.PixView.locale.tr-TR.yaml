PackageVersion: 1.0.0
PackageLocale: tr-TR
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Picasa Photo Viewer tarzında hızlı ve hafif fotoğraf görüntüleyici. HEIC, AVIF, WebP, JPEG XL, RAW, hareketli GIF/APNG ve daha fazlasını açar."
Description: |-
  Windows 10 ve 11 için Picasa Photo Viewer tarzında ücretsiz fotoğraf görüntüleyici: bir fotoğrafa çift tıklayın, karartılmış masaüstünün üzerinde anında açılsın. Kitaplık, içe aktarma, düzenleme ve reklam yok.

  - Karartılmış masaüstü üzerinde veya tam ekran, altta klasörün küçük resim şeridi
  - İmlece doğru akıcı yakınlaştırma, sığdır / 1:1, kaydırma, döndürme, slayt gösterisi
  - EXIF ayrıntıları: fotoğraf makinesi, pozlama, diyafram, odak uzaklığı, çekim tarihi
  - Hareketli GIF, APNG, WebP ve AVIF; çok sayfalı TIFF
  - HEIC/HEIF (iPhone fotoğrafları), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), ayrıca TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Gerektiğinde Microsoft Store'dan hangi ücretsiz codec'in kurulacağını söyler
  - Tek bir yaklaşık 300 KB exe: kurulum ve yönetici hakları gerekmez
  - 13 dil, her şey için klavye kısayolları
