ShortDescription: Fast, tiny photo viewer in the spirit of Picasa Photo Viewer. Opens HEIC, AVIF, WebP, JPEG XL, RAW, animated GIF/APNG and more.
Description: |-
  PixView is a free photo viewer for Windows 10 and 11 that brings back the Picasa Photo Viewer experience: double-click a photo and it opens instantly over your dimmed desktop. No library, no import, no editing, no ads.

  - Opens over a dimmed desktop or full screen, with a filmstrip of the folder at the bottom
  - Smooth zoom towards the cursor, fit / 1:1, pan, rotate, slideshow
  - EXIF details: camera, exposure, aperture, focal length, date taken
  - Animated GIF, APNG, WebP and AVIF; multi-page TIFF
  - HEIC/HEIF (iPhone photos), AVIF, WebP, JPEG XL, camera RAW (CR2, CR3, NEF, ARW, DNG…), plus TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF via its own decoders
  - Tells you which free Microsoft Store codec to install when a format needs one
  - A single ~300 KB exe: no installer, no runtime to download, no admin rights
  - 13 languages, keyboard shortcuts for everything

  A lightweight alternative to Windows Photo Viewer and the Photos app for people who just want to look at their pictures.
