PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: es-ES
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Visor de fotos rápido y ligero al estilo de Picasa Photo Viewer. Abre HEIC, AVIF, WebP, JPEG XL, RAW, GIF/APNG animados y más."
Description: |-
  Visor de fotos gratuito para Windows 10 y 11 al estilo de Picasa Photo Viewer: haz doble clic en una foto y se abre al instante sobre el escritorio oscurecido. Sin biblioteca, sin importar, sin edición, sin anuncios.

  - Sobre el escritorio oscurecido o a pantalla completa, con tira de miniaturas de la carpeta
  - Zoom suave hacia el cursor, ajustar / 1:1, desplazamiento, giro, presentación
  - Detalles EXIF: cámara, exposición, apertura, distancia focal, fecha de captura
  - GIF, APNG, WebP y AVIF animados; TIFF multipágina
  - HEIC/HEIF (fotos de iPhone), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), además de TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Indica qué códec gratuito de Microsoft Store instalar cuando hace falta
  - Un único exe de unos 300 KB: sin instalador ni permisos de administrador
  - 13 idiomas, atajos de teclado para todo
