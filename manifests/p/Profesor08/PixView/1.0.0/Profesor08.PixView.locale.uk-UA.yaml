PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: uk-UA
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Швидкий і легкий переглядач фото в дусі Picasa Photo Viewer. Відкриває HEIC, AVIF, WebP, JPEG XL, RAW, анімовані GIF/APNG та багато іншого."
Description: |-
  Безкоштовний переглядач фотографій для Windows 10 і 11, що повертає зручність Picasa Photo Viewer: подвійне клацання по фото — і воно миттєво відкривається поверх затемненого робочого столу. Без бібліотек, імпорту, редагування та реклами.

  - Поверх затемненого робочого столу або на весь екран, зі стрічкою мініатюр теки внизу
  - Плавне масштабування до курсора, за розміром екрана / 1:1, переміщення, поворот, слайд-шоу
  - Відомості EXIF: камера, витримка, діафрагма, фокусна відстань, дата зйомки
  - Анімовані GIF, APNG, WebP і AVIF; багатосторінкові TIFF
  - HEIC/HEIF (фото з iPhone), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), а також TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Підказує, який безкоштовний кодек із Microsoft Store встановити, якщо він потрібен
  - Один exe близько 300 КБ: без інсталятора, без прав адміністратора
  - 13 мов, гарячі клавіші для всього
