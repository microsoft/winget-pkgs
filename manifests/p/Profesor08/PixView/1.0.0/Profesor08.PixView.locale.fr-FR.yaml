PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: fr-FR
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Visionneuse de photos rapide et légère dans l’esprit de Picasa Photo Viewer. Ouvre HEIC, AVIF, WebP, JPEG XL, RAW, GIF/APNG animés et plus."
Description: |-
  Visionneuse de photos gratuite pour Windows 10 et 11 dans l’esprit de Picasa Photo Viewer : double-cliquez sur une photo et elle s’ouvre instantanément sur le bureau assombri. Pas de bibliothèque, pas d’import, pas de retouche, pas de publicité.

  - Sur le bureau assombri ou en plein écran, avec un bandeau des photos du dossier
  - Zoom fluide vers le curseur, ajuster / 1:1, déplacement, rotation, diaporama
  - Détails EXIF : appareil, exposition, ouverture, focale, date de prise de vue
  - GIF, APNG, WebP et AVIF animés ; TIFF multipage
  - HEIC/HEIF (photos d’iPhone), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), ainsi que TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Indique quel codec gratuit du Microsoft Store installer si nécessaire
  - Un seul exe d’environ 300 Ko : sans installation, sans droits administrateur
  - 13 langues, raccourcis clavier pour tout
