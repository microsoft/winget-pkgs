PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: ja-JP
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Picasa Photo Viewer のような軽量・高速な画像ビューアー。HEIC、AVIF、WebP、JPEG XL、RAW、アニメーション GIF/APNG などに対応。"
Description: |-
  Windows 10/11 用の無料フォトビューアー。Picasa Photo Viewer のように、写真をダブルクリックすると暗くしたデスクトップの上にすぐ開きます。ライブラリ、取り込み、編集、広告はありません。

  - 暗くしたデスクトップ上または全画面で表示、下部にフォルダーのフィルムストリップ
  - カーソル位置へのなめらかなズーム、画面に合わせる / 1:1、移動、回転、スライドショー
  - EXIF 情報: カメラ、露出、絞り、焦点距離、撮影日時
  - アニメーション GIF、APNG、WebP、AVIF、複数ページの TIFF
  - HEIC/HEIF (iPhone の写真)、AVIF、WebP、JPEG XL、カメラ RAW (CR2、CR3、NEF、ARW、DNG…)、さらに TGA、QOI、HDR、PCX、PNM、ICNS、EMF/WMF
  - 必要なときは Microsoft Store のどの無料コーデックを入れればよいか表示
  - 約 300 KB の exe ひとつ: インストール不要、管理者権限不要
  - 13 言語、すべての操作にキーボード ショートカット
