PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: zh-CN
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "轻巧快速的看图软件，体验类似 Picasa Photo Viewer。支持 HEIC、AVIF、WebP、JPEG XL、RAW、GIF/APNG 动图等格式。"
Description: |-
  免费的 Windows 10/11 看图软件，带回 Picasa Photo Viewer 的体验：双击照片，即刻在变暗的桌面上打开。无需图库、无需导入、不做编辑、没有广告。

  - 在变暗的桌面上或全屏查看，底部显示文件夹缩略图胶片栏
  - 朝光标平滑缩放、适应屏幕 / 1:1、拖动、旋转、幻灯片放映
  - EXIF 信息：相机、曝光、光圈、焦距、拍摄日期
  - GIF、APNG、WebP、AVIF 动图；多页 TIFF
  - HEIC/HEIF（iPhone 照片）、AVIF、WebP、JPEG XL、相机 RAW（CR2、CR3、NEF、ARW、DNG…），以及 TGA、QOI、HDR、PCX、PNM、ICNS、EMF/WMF
  - 缺少解码器时提示应从 Microsoft Store 安装哪个免费扩展
  - 单个约 300 KB 的 exe：无需安装，无需管理员权限
  - 13 种语言，全部操作均有快捷键
