PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: pt-BR
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Visualizador de fotos rápido e leve no estilo do Picasa Photo Viewer. Abre HEIC, AVIF, WebP, JPEG XL, RAW, GIF/APNG animados e mais."
Description: |-
  Visualizador de fotos gratuito para Windows 10 e 11 no estilo do Picasa Photo Viewer: clique duas vezes em uma foto e ela abre na hora sobre a área de trabalho escurecida. Sem biblioteca, sem importação, sem edição, sem anúncios.

  - Sobre a área de trabalho escurecida ou em tela cheia, com a faixa de miniaturas da pasta
  - Zoom suave em direção ao cursor, ajustar / 1:1, mover, girar, apresentação de slides
  - Detalhes EXIF: câmera, exposição, abertura, distância focal, data da foto
  - GIF, APNG, WebP e AVIF animados; TIFF de várias páginas
  - HEIC/HEIF (fotos do iPhone), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), além de TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Indica qual codec gratuito da Microsoft Store instalar quando necessário
  - Um único exe de cerca de 300 KB: sem instalador nem direitos de administrador
  - 13 idiomas, atalhos de teclado para tudo
