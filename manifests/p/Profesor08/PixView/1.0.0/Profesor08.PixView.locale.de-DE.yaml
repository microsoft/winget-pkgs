PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: de-DE
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Schneller, schlanker Fotobetrachter im Stil von Picasa Photo Viewer. Öffnet HEIC, AVIF, WebP, JPEG XL, RAW, animierte GIF/APNG und mehr."
Description: |-
  Kostenloser Bildbetrachter für Windows 10 und 11 im Stil von Picasa Photo Viewer: Doppelklick auf ein Foto, und es öffnet sich sofort über dem abgedunkelten Desktop. Keine Bibliothek, kein Import, keine Bearbeitung, keine Werbung.

  - Über dem abgedunkelten Desktop oder im Vollbild, mit Filmstreifen des Ordners
  - Flüssiger Zoom zum Mauszeiger, Einpassen / 1:1, Verschieben, Drehen, Diashow
  - EXIF-Details: Kamera, Belichtung, Blende, Brennweite, Aufnahmedatum
  - Animierte GIF, APNG, WebP und AVIF; mehrseitige TIFF
  - HEIC/HEIF (iPhone-Fotos), AVIF, WebP, JPEG XL, Kamera-RAW (CR2, CR3, NEF, ARW, DNG…), dazu TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Nennt den passenden kostenlosen Codec aus dem Microsoft Store, wenn einer fehlt
  - Eine einzige EXE mit rund 300 KB: kein Installer, keine Adminrechte
  - 13 Sprachen, Tastenkürzel für alles
