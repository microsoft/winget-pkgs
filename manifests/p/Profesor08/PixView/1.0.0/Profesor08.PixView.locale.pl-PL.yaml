PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: pl-PL
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Szybka i lekka przeglądarka zdjęć w stylu Picasa Photo Viewer. Otwiera HEIC, AVIF, WebP, JPEG XL, RAW, animowane GIF/APNG i więcej."
Description: |-
  Darmowa przeglądarka zdjęć dla Windows 10 i 11 w stylu Picasa Photo Viewer: kliknij dwukrotnie zdjęcie, a otworzy się natychmiast na przyciemnionym pulpicie. Bez biblioteki, importu, edycji i reklam.

  - Na przyciemnionym pulpicie lub na pełnym ekranie, z paskiem miniatur folderu
  - Płynne powiększanie w stronę kursora, dopasuj / 1:1, przesuwanie, obracanie, pokaz slajdów
  - Szczegóły EXIF: aparat, ekspozycja, przysłona, ogniskowa, data wykonania
  - Animowane GIF, APNG, WebP i AVIF; wielostronicowe TIFF
  - HEIC/HEIF (zdjęcia z iPhone’a), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), a także TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Podpowiada, który darmowy kodek ze Sklepu Microsoft zainstalować, gdy jest potrzebny
  - Jeden plik exe ok. 300 KB: bez instalatora i bez uprawnień administratora
  - 13 języków, skróty klawiszowe do wszystkiego
