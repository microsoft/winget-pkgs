PackageIdentifier: Profesor08.PixView
PackageVersion: 1.0.0
PackageLocale: ru-RU
Publisher: Profesor08
PackageName: PixView
License: GPL-3.0-or-later
ShortDescription: "Быстрый и лёгкий просмотрщик фото в духе Picasa Photo Viewer. Открывает HEIC, AVIF, WebP, JPEG XL, RAW, анимированные GIF/APNG и многое другое."
Description: |-
  Бесплатный просмотрщик фотографий для Windows 10 и 11, который возвращает удобство Picasa Photo Viewer: двойной щелчок по фото — и оно мгновенно открывается поверх затемнённого рабочего стола. Без библиотек, импорта, редактирования и рекламы.

  - Поверх затемнённого рабочего стола или на весь экран, с лентой миниатюр папки внизу
  - Плавное масштабирование к курсору, по размеру экрана / 1:1, перемещение, поворот, слайд-шоу
  - Сведения EXIF: камера, выдержка, диафрагма, фокусное расстояние, дата съёмки
  - Анимированные GIF, APNG, WebP и AVIF; многостраничные TIFF
  - HEIC/HEIF (фото с iPhone), AVIF, WebP, JPEG XL, RAW (CR2, CR3, NEF, ARW, DNG…), а также TGA, QOI, HDR, PCX, PNM, ICNS, EMF/WMF
  - Подсказывает, какой бесплатный кодек из Microsoft Store установить, если он нужен
  - Один exe около 300 КБ: без установщика, без загрузки среды выполнения, без прав администратора
  - 13 языков, горячие клавиши для всего
