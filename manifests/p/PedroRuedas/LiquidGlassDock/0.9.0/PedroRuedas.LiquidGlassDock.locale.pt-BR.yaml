ShortDescription: Dock no estilo Liquid Glass do macOS, com vidro que refrata de verdade, no lugar da barra de tarefas do Windows 11.
Description: |-
  Substitui a barra de tarefas do Windows 11 por uma dock de vidro líquido que refrata o papel de parede, com ampliação dos ícones, miniaturas das janelas, listas de atalhos, menu Iniciar de vidro, áreas de trabalho num cubo 3D e personalização ao vivo.
  Instala só para o usuário, sem administrador, e devolve a barra de tarefas do Windows ao ser fechada ou desinstalada.
