Description: |-
  ProAlSat, CPU, RAM, VRAM, ekran kartı ve diski kendi bilgisayarda, gerçek yük ve süreyle test eden ücretsiz bir Windows uygulamasıdır.
  Sıcaklık ve yük izlenir; okunamayan değer uydurulmaz. Disk SMART/NVMe verisi salt okunur.
  Sonuç QR ile açılan bir rapor sayfasına yazılır; yarım kalan aşama geçmiş sayılmaz.
  İsteğe bağlı arka plan yük geçmişi ve oyun FPS düşüş kaydı vardır.
  Test için uygulama açılışta yönetici onayı ister; onay yoksa veri toplanmaz. Alım-satım platformu değildir ve garanti vermez.
