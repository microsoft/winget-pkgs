ShortDescription: Free Windows browser with a native WinUI 3 sidebar, workspaces and Glance.
Description: |-
  Krypton is a free Windows browser built around organized tabs, flexible workspaces and a clean interface. It runs Chromium 157 through Helium (ungoogled-chromium) and replaces Helium's browser window with a native interface built on WinUI 3.
  The vertical sidebar hosts workspaces that each carry their own tabs, folders and color theme, with Essentials shared across every workspace. Splits of two to four pages sit side by side, Alt-click opens a Glance preview over the current page, and Boosts restyle individual sites with per-site styles, Zap and Focus. Workspace routing rules move matching links to a chosen workspace, and a Library drawer gathers downloads, history, boosts, rules and media. The official uBlock Origin is bundled and enabled from the first page.
  There is no account or sync. Widevine, Live Caption and search suggestions stay off until switched on, and setup can import bookmarks and history from Arc, Dia, Helium and Thorium.
