PackageVersion: 0.21.3.6
PackageLocale: zh-CN
ShortDescription: 免费的 Windows 浏览器，拥有原生 WinUI 3 侧边栏、工作区和 Glance。
Description: |-
  Krypton 是一款免费的 Windows 浏览器，围绕井然有序的标签页、灵活的工作区和简洁的界面打造。它经由 Helium（ungoogled-chromium）运行 Chromium 157，并用基于 WinUI 3 构建的原生界面取代 Helium 的浏览器窗口。
  垂直侧边栏承载各个工作区，每个工作区都拥有自己的标签页、文件夹和配色主题，Essentials 则为所有工作区共享。两到四个页面可以并排分屏，Alt+点击会在当前页面上方打开 Glance 预览，Boosts 则通过每站点样式、Zap 和 Focus 为单个网站重塑样式。工作区路由规则会把匹配的链接移动到指定的工作区，资料库抽屉则汇集下载、历史记录、Boosts、规则和媒体。官方 uBlock Origin 已随附内置，并从第一个页面起即启用。
  这里没有账户，也没有同步。Widevine、实时字幕和搜索建议在开启之前保持关闭，安装设置可以从 Arc、Dia、Helium 和 Thorium 导入书签和历史记录。
