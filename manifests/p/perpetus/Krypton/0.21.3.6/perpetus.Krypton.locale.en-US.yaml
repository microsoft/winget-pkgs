ReleaseNotes: |-
  Updated KryptonUI to 0.1.1.3 with performance and crash-reporting improvements. Chromium remains 157.0.8103.78.
  Windows 10 1903 or later, x64 with AVX2 and the x86-64-v3 instruction set. Close Krypton before installing; existing profiles are kept.
  Existing installations can receive this release through signed automatic updates.
