ShortDescription: A Windows program that shrinks videos that are too big for their picture size.
Description: Scans a folder, flags videos that are larger than they need to be for their resolution, and converts the ones you check into smaller copies using HandBrake CLI and FFmpeg. Originals are kept in a .vd-originals folder until you delete them, and Undo puts the last conversion back.
