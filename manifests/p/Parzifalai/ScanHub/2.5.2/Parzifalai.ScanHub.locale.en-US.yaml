ShortDescription: Free open-source Windows toolbox - 30+ scanners with one verdict, PC cleanup, privacy and health checks.
Description: |-
  ScanHub puts everything needed to check and maintain Windows 10/11 into one window.
  It runs one-off checks only and keeps nothing running in the background.
  - Scan a file, a folder or the whole PC with several engines at once (Microsoft Defender, ClamAV, YARA, signature check, online hash lookup) and get one plain verdict.
  - Run third-party scanners (Kaspersky VRT, Dr.Web CureIt!, ESET, Emsisoft, Malwarebytes, AdwCleaner and more), downloaded from official sites with signature checks.
  - Built-in Miner Hunter, junk cleanup, startup and program management, PC health, Windows protection settings with undo.
  - Optional AI agent that explains findings and proposes fixes, acting only after confirmation.
  - Russian and English interface.
