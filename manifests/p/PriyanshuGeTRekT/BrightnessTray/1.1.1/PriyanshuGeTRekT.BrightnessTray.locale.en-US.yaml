ShortDescription: Tray app that controls the brightness of every display, with keyboard shortcuts.
Description: |-
  Brightness Tray puts a sun icon in the system tray that opens one brightness slider per display.
  External monitors are controlled over DDC/CI, laptop screens over WMI, and displays that support neither (TVs, DisplayLink docks) get a software-dimming overlay.
  Optional global keyboard shortcuts change every display at once, and the popup stays out of exclusive full-screen games.
  It is a single small executable written in Rust that uses no CPU while idle.
