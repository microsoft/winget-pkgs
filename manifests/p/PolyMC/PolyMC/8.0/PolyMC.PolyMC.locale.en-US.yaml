ReleaseNotes: |-
  This release contains some juicy new features, alongside UI enhancements, bug fixes for modpack providers and legacy versions, and most importantly：the ability to play on blacklisted servers, such as 6b6t!

  ## Features

  • Servers that are otherwise blacklisted by Microsoft can now be played on, such as 6b6t. @crueter in https://github.com/PolyMC/PolyMC/pull/1794
  • You can now download resource, texture, and shader packs from Modrinth or Curseforge. This works in beta versions too! @crueter in https://github.com/PolyMC/PolyMC/pull/1804
  • The instance server list has been improved, now showing important data (player count, icons, etc.). @Kaydax in https://github.com/PolyMC/PolyMC/pull/1730
  • Old versions of Minecraft with Forge installed previously did not work with modern Java 8 runtimes. The new "Ignore Forge security errors" option allows modern Java runtimes to bypass this and play old versions of Minecraft with Forge. @crueter in https://github.com/PolyMC/PolyMC/pull/1795
  • You can now use the Loki Yggdrasil agent as a custom authentication alternative for versions 0.0.18a to 1.6.4. @thedirtybubble in https://github.com/PolyMC/PolyMC/pull/1790
  • You can now use locally hosted HTTP metadata servers. @JackOfNoneTrades in https://github.com/PolyMC/PolyMC/pull/1762
  • Windows on ARM now has a setup executable (Windows 11 only). @crueter in https://github.com/PolyMC/PolyMC/pull/1797
  • Linux AppImages can now automatically update themselves if a new upstream version is present. @crueter in https://github.com/PolyMC/PolyMC/pull/1788

  ## UI Improvements

  • You can now add the same account name to multiple different services/hosts. @prozacgod in https://github.com/PolyMC/PolyMC/pull/1727
  • Offline usernames are now checked for general validity, alongside previous length requirements. @hustlerone in https://github.com/PolyMC/PolyMC/pull/1737
  • The offline login dialog now focuses on the username textbox by default. @crueter in https://github.com/PolyMC/PolyMC/pull/1752
  • RAM allocation values below 1024 MiB now warn the user, but it can now be set as low as 8 MiB for very old versions. @crueter in https://github.com/PolyMC/PolyMC/pull/1787
  • You can choose to ignore duplicated Java runtimes in the version selection screen. This is mostly useful on Linux. @crueter in https://github.com/PolyMC/PolyMC/pull/1799
  • The log searching function will now automatically wrap its search if you reach the bottom or top. @crueter in https://github.com/PolyMC/PolyMC/pull/1798

  ## Bug Fixes

  • The macOS icon has been updated to support macOS 26 and above. @crueter in https://github.com/PolyMC/PolyMC/pull/1796
  • Font scaling on macOS has been fixed. @crueter in https://github.com/PolyMC/PolyMC/pull/1796
  • Editing the maximum RAM allocation with a low minimum could cause strange behavior due to max >= min checks. @crueter in https://github.com/PolyMC/PolyMC/pull/1791
  • Curseforge modpacks could potentially specify overrides that broke out of the dedicated staging path, which was a security risk. You are now warned if this is the case. @crueter in https://github.com/PolyMC/PolyMC/pull/1805
  • Certain older texture packs may have had invalid or unreadable descriptions. Most of these will now display properly. @crueter in https://github.com/PolyMC/PolyMC/pull/1808
  • ATLauncher modpacks now support NeoForge. @Kaydax in https://github.com/PolyMC/PolyMC/pull/1759
  • Fixed ATLauncher modpacks crashing the launcher during installation if Liteloader was present. @crueter in https://github.com/PolyMC/PolyMC/pull/1793
  • Fixed FTB modpacks being unable to download, or not being present in the modpack search menu. @crueter in https://github.com/PolyMC/PolyMC/pull/1792

