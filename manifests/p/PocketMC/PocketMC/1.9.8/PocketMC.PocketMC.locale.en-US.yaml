ShortDescription: Modern Windows desktop application for managing and hosting local Minecraft Java and Bedrock servers.
Description: PocketMC is a native WPF/.NET 8 desktop app for local Minecraft server hosting. It handles software downloads, isolated instances, managed Java and PHP runtimes, live metrics, logs, backups, cloud replication, Playit.gg tunnels, add-ons, and a remote web dashboard.
