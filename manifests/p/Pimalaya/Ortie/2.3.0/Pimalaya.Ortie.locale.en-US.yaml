ReleaseNotes: |-
  Added
  - Added the json-schema command (hidden alias json-schemas), printing the JSON Schema of a command's --json payload.
    Four commands emit data and carry a key, named after the invocation the way the man pages are: ortie-configure, ortie-auth-get, ortie-token-show and ortie-token-inspect. Given --dir, it writes one file per key instead of printing a single one. token refresh and auth resume print a confirmation rather than data, so they carry none.
  - Added the alpn account option, listing the ALPN identifiers offered during the TLS handshake.
    Empty by default, which is what Ortie already offered: an OAuth 2.0 endpoint is plain HTTPS and registers no identifier. ["http/1.1"] is the one meaningful override, for a TLS middlebox refusing a handshake without ALPN. Only rustls reads it.
  - Added tls = "auto", naming the provider the binary was built with, which is what an omitted tls already selected.
  Fixed
  - Fixed the macOS Keychain write command generated by the wizard, which omitted the -s service security add-generic-password requires, so storing the token failed after a successful authorization. The entry now names both the service and the account, and the read command still finds it. See #15.
  - Fixed configure --json running the wizard's prompts when stdin is not a terminal, where the first of them could only fail.
    The command refuses the way it already did without --json, naming the sample configuration to write by hand instead.
  - Fixed completion writing files to the working directory instead of printing the script to the standard output, which broke every packaging helper capturing stdout.
    manual now shares its shape: a positional list selecting what to generate, printed to stdout, and an optional --dir deciding where it lands instead of the directory it used to take as a positional argument.
    ortie manual ./man becomes ortie manual --dir ./man, and both accept command names (ortie, ortie-token) to generate a single item.
  Changed
  - Changed the wizard's save step to the shape the other Pimalaya wizards take: one prompt, then the account is written.
    A configuration already there is offered Append account `<name>` to <path>?, a missing one Save this account to <path>?, where two prompts used to ask the same thing in two halves. Declining either prints the account on stdout to place by hand.
    The account no longer reaches stdout on its way to that prompt, a terminal seeing it only when the offer is declined. --json and a redirected stdout still print it and touch no file, so ortie configure > config.toml works as before.
    The confirmation names the account and where it landed, points at -a <name> when another account holds the default, and still names ortie auth get when the account has an application to authorize with.
  - BREAKING: token inspect --json no longer serializes the access token nor the refresh token.
    The command is documented as printing metadata around the token rather than the token itself, and its text rendering always did, but its JSON payload was a passthrough of the stored token response and handed out both secrets in clear.
    It now emits token_type, issued_at, expires_in, with_refresh_token and scope, the boolean replacing the refresh_token string. The raw access token comes from token show.
  - Renamed completions and manuals to completion and manual, the plural staying as a hidden alias (mans still works too).
  - Bumped pimalaya-stream to 0.3, whose Read and Write retry a stream reporting it is not ready. Behaviour change.
    A blocking socket is not supposed to report EAGAIN, yet callers saw one surface mid-exchange and end it with a bare Resource temporarily unavailable (os error 35), macOS especially and the more readily the longer the exchange ran.
    The transport now retries such a failure for a minute before giving up with a TimedOut naming the budget, and arms a socket read deadline at connect time so a server going silent on a healthy connection stops blocking the caller forever.
    Its StreamStd is renamed stream::Stream and its connects take a per-transport options struct, which is what this crate now calls.
