ShortDescription: Local-first cleaner for caches, developer leftovers and disk space
Description: |-
  Prune finds what a machine can safely get back: application and browser caches, logs,
  installers that have already been used, and the build output and dependency directories
  that development leaves behind. Nothing is removed until you have read the list, and
  removal goes to the Trash unless you ask for otherwise.

  It works entirely on the machine it runs on. There is no network access, no telemetry,
  no account and no background service. A command line, prune, ships from the same release
  and uses the same engine.
