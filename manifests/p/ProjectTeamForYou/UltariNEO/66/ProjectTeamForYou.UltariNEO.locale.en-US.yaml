ShortDescription: Over 30 detection engines that find adware, data leaks, hacking traces, ransomware and home-network tampering. Every verdict is computed locally on your own PC, and every cleanup is reversible.
Description: |-
  Ultari NEO is a Korean-language security checkup tool for Windows 10 and 11.

  More than 30 detection engines look for adware, channels that leak personal data,
  traces left behind by intruders, signs of ransomware, and tampering with your home
  router (DNS settings and the admin account).

  Two rules hold throughout:
  - Every verdict is computed locally on your own PC. Scanned files and personal data
    are never uploaded to a server.
  - Every cleanup is reversible. Before anything is removed you are shown what is being
    removed and why, and an undo record is kept.

  Free for personal use.
