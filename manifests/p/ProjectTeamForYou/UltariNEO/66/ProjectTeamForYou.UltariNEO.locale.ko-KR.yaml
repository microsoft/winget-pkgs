Description: |-
  울타리 NEO 는 Windows 10/11 에서 도는 한국어 보안 점검 도구입니다.

  30여 종의 검사 엔진이 광고 프로그램, 개인정보가 밖으로 새는 통로, 남이 다녀간 해킹 흔적,
  랜섬웨어 징후, 집 공유기(DNS·관리자 계정) 변조를 찾아냅니다.

  두 가지를 원칙으로 둡니다.
  - 판정은 모두 사용자의 PC 안에서 계산합니다. 검사 대상 파일이나 개인 자료를 서버로 보내지 않습니다.
  - 정리는 모두 되돌릴 수 있습니다. 지우기 전에 무엇을 왜 지우는지 보여주고, 되돌리기를 남깁니다.

  개인 사용자에게는 무료입니다.
