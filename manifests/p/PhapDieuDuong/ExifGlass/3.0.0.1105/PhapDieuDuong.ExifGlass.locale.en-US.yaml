  - core: Show the ExifTool command
  - core: Accent color and resizable panels
  - core: Screen reader support

  Changed
  - core: Export only the visible rows and columns
  - core: JSON export uses the exiftool -j -G format
  - core: Renamed "Extract data" to "Save binary data"
