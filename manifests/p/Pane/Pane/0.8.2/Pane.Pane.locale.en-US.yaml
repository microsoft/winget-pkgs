ReleaseNotes: |-
  Pane v0.8.2 — 新手引导 / 字体资源包 / 刷新唤醒 / 信封分享
  ───────────┬───────────────────────────────────────────┬──────────────────
  系统 \ 架构│x86_64 (amd64)                             │arm64 (aarch64)
