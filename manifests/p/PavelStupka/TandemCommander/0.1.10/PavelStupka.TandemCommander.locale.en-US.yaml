ReleaseNotes: |-
  Build 194. Fixes for the problems reported on GitHub after 0.1.9, and for
  what checking those fixes found. Several ways of losing files are closed:
  deleting a link in a very deep folder emptied the folder it points to, a
  name that is another file's short name could overwrite that file, and an
  archive opened through a drive letter that was pointed elsewhere could be
  changed in place of another. Shortcuts open their targets, a server name
  lists its shared folders, the program starts again on older Windows, and
  messages, menus and the plug-ins show names in any language readably. Long
  names are kept whole or refused, never cut; SFTP no longer fails about one
  connection in 256.
ReleaseNotesUrl: https://github.com/tandemcommander/tandemcommander/releases/tag/v0.1.10
InstallationNotes: |-
  The Markdown viewer renders through the Microsoft Edge WebView2 runtime,
  which is part of Windows 11. On Windows 10 install it once with:
  winget install Microsoft.EdgeWebView2Runtime
