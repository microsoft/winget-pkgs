ReleaseNotes: |-
  Build 197. Feature release. Tandem Commander now also comes as a portable
  edition: unpack the ZIP anywhere, run it, and it keeps all its settings in
  its own folder, never in the registry; it tells you about a new version but
  never installs one, and it has no Explorer integration. The reports made on
  GitHub are fixed: the Code Viewer and the Markdown Viewer fill their window
  after the display scaling changes, the drive menu's Desktop opens your real
  Desktop folder (the old shell view is now called Shell Folders), and in the
  Dark theme the toolbars of PictView and File Comparator are readable and no
  light-grey parts are left. Panel tabs are square by default; the rounded
  look is one setting away.
ReleaseNotesUrl: https://github.com/tandemcommander/tandemcommander/releases/tag/v0.4.0
InstallationNotes: |-
  The Markdown viewer renders through the Microsoft Edge WebView2 runtime,
  which is part of Windows 11. On Windows 10 install it once with:
  winget install Microsoft.EdgeWebView2Runtime
