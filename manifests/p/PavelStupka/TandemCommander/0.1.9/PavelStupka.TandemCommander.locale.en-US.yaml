ReleaseNotes: |-
  Build 193. Feature release. The program now tells you when a newer version
  has been published: on by default, one request to GitHub about once a day,
  nothing about you or your computer is sent, and one option turns it off. RAR
  archives open and unpack without installing anything, on a 7-Zip engine
  updated from 16.04 to 26.03. External archivers, which never started in any
  earlier release, work; the MS-DOS archivers are gone. A long series of fixes
  ends silent data loss around archives and file operations, makes file names,
  passwords and typed text in any script work in the program and its plugins,
  opens archives and folders at very long paths, and makes PictView's Save As
  save again. The privacy defects found while writing the privacy statement
  are fixed. Plugin interface 107; plugins built for earlier versions keep
  working.
ReleaseNotesUrl: https://github.com/tandemcommander/tandemcommander/releases/tag/v0.1.9
InstallationNotes: |-
  The Markdown viewer renders through the Microsoft Edge WebView2 runtime,
  which is part of Windows 11. On Windows 10 install it once with:
  winget install Microsoft.EdgeWebView2Runtime
