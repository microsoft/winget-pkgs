ReleaseNotes: |-
  Build 190. Feature release. Pressing F3 on a source or configuration file
  now opens a new Code Viewer with syntax highlighting in a choice of twelve
  colour schemes, covering over 200 languages and formats. The Command Shell
  command (Num /) is no longer tied to Command Prompt - it can open Windows
  PowerShell, PowerShell 7, Windows Terminal, Git Bash or any program you
  name. This is also the first release published to the Windows Package
  Manager catalogue, so Tandem Commander can be installed and updated with
  winget. Existing behaviour is unchanged for anyone who touches neither
  setting.
ReleaseNotesUrl: https://github.com/tandemcommander/tandemcommander/releases/tag/v0.1.6
InstallationNotes: |-
  The Markdown viewer renders through the Microsoft Edge WebView2 runtime,
  which is part of Windows 11. On Windows 10 install it once with:
  winget install Microsoft.EdgeWebView2Runtime
