ShortDescription: Fast, keyboard-driven two-panel file manager for Windows, derived from Open Salamander.
Description: |-
  Tandem Commander is a two-panel (dual-pane) file manager for Windows in the
  Norton Commander tradition. It is derived from Open Salamander, the GPLv2
  open-source release of the long-lived Altap Salamander, and is a native
  WinAPI application - there is no runtime to install and it starts instantly.

  Both panels show a directory, and every operation - copy, move, delete,
  rename, pack, unpack, compare - works between them and can be driven entirely
  from the keyboard. Archives such as ZIP, 7-Zip, RAR, TAR and ISO are browsed
  like ordinary folders. A plugin architecture adds file viewers, FTP and SFTP
  clients, checksum tools, a Markdown viewer and more.

  Compared with the code base it inherited, Tandem Commander adds full Unicode
  and long-path support, a dark theme, cloud storage sync-status badges, and a
  configurable command shell (Command Prompt, PowerShell, Windows Terminal or
  Git Bash).

  Tandem Commander is built with AI-assisted, spec-driven development under
  human direction and review, and is provided "as is", without warranty of any
  kind.
