ReleaseNotes: |-
  Build 195. Feature release. Quick search finds the typed text anywhere in a
  name, also without its accents, and shows only the matching items. Settings
  of Altap Salamander and Open Salamander can be imported after a preview;
  panel tabs get optional browser-like shortcuts and Reopen Closed Tab; the
  Markdown Viewer can use the whole window. Settings move once to a key that
  no longer changes with the version - going back to 0.1.x is not supported.
  Unpack with "Delete archive after unpacking" no longer deletes a disc image
  or a TAR, cpio or rpm archive that was not extracted whole, and ways of
  losing data in the Registry Editor, ZIP, FTP and SFTP are closed. The
  Desktop view's column headers read correctly on a non-English Windows, Linux
  CD images show their real names, and long names are refused, never cut.
ReleaseNotesUrl: https://github.com/tandemcommander/tandemcommander/releases/tag/v0.2.0
InstallationNotes: |-
  The Markdown viewer renders through the Microsoft Edge WebView2 runtime,
  which is part of Windows 11. On Windows 10 install it once with:
  winget install Microsoft.EdgeWebView2Runtime
