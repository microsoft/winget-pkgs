ReleaseNotes: "# Remote \n\n# 1. Pinokio Remote\n\n<img width=\"1586\" height=\"890\" alt=\"pinokioremote\" src=\"https://github.com/user-attachments/assets/a327ed55-dd92-40be-b9a4-08d3f960f791\" />\n\nA personal portal for all your apps on all your pinokio computers https://pinokio.co/connect\n\n# 2. Security Update\n\nAdded proactive protection against eMudhra certificate exploit, not just for core modules (conda, python, node.js, etc.) but also for each app environment (automatically patches the certificate to block eMudhra)\n\n\n• Updated pip, node.js, etc. to apply security patches\n• Automatic certificate repair for existing venvs (even the ones already impacted)\n\n# 3. Other updates\n\n• Huggingface Token Fix：a bug where huggingface token would show up expired even when it isn't\n• The default bun dependency was removed because it was causing install issues for some people without providing any meaningful benefit. Can always be installed through `shell.run` commands when needed.\n• While running `brew install gettext --force-bottle`, would get：`Cannot relocate build prefix /opt/homebrew to longer prefix /Users/x/pinokio/bin/homebrew`. Now fixed by setting `HOMEBREW_NO_RELOCATE_BUILD_PREFIX: \"1\"`\n• Support for Mac OS Golden Gate 27.2\n• Windows path bug fix：The problem: Pinokio accidentally added % characters to Windows library paths:\n  • Wrong：  %C:\\pinokio\\bin\\miniforge%\\Library\\lib\n  • Correct：C:\\pinokio\\bin\\miniforge\\Library\\lib\n\n---\n\n# Pinokio Release\n\n## Code Signing Policy\n\nFree code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).\n\n## Privacy Policy\n\nThis program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it."
