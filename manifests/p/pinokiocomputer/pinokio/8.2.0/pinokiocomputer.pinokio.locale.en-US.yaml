ReleaseNotes: "# Universal Disk Saver\r\n\r\nFree up hundreds of gigabytes, even terabytes, of disk space you didn't know you were wasting.\r\n\r\n> Learn more：https://desktop.pinokio.co/docs/disk-saver/\r\n\r\n<img width=\"1279\" height=\"634\" alt=\"disksaver\" src=\"https://github.com/user-attachments/assets/ab8a3a60-a7b4-4995-9b98-ff4249d452f6\" />\r\n\r\n# Nested Pinokio Folder Support\r\n\r\nPreviously, `pinokio.js` had to live at the root of a project. Now it can also live at `pinokio/pinokio.js`, and Pinokio will automatically discover the scripts.\r\n\r\nBEFORE:\r\n\r\n```\r\npinokio.js\r\ninstall.js\r\nstart.js\r\nupdate.js\r\nreset.js\r\napp.py\r\nrequirements.txt\r\n```\r\n\r\nAFTER:\r\n\r\n```\r\npinokio/\r\n  pinokio.js\r\n  install.js\r\n  start.js\r\n  update.js\r\n  reset.js\r\napp.py\r\nrequirements.txt\r\n```\r\n\r\n> This means now you can easily pinokio-fy any existing git repository simply by creating an isolated `pinokio` folder and including all the script files inside it.\r\n\r\n# My Apps\r\n\r\nPreviously you had to click the home icon to go back to Pinokio home, and there was no indication of which tab was selected. Now the default home page is called \"My Apps\", and you can always click the tab to switch to home\r\n\r\n<img width=\"1280\" height=\"599\" alt=\"myapps\" src=\"https://github.com/user-attachments/assets/83bb4a29-902f-4cbd-b6c7-0557e94ce879\" />\r\n\r\n\r\n## Code Signing Policy\r\n\r\nFree code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).\r\n\r\n## Privacy Policy\r\n\r\nThis program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it."
