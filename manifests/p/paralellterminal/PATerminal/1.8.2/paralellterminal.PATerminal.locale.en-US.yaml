ReleaseNotes: |-
  Changes
  - Pull works on branches that were never pushed. The pane bar's Pull (and the Pull in the branch list) used to be disabled unless the current branch had an upstream, so branches created for worktrees could not pull from main. Without an upstream, Pull now pulls from the remote's default branch (origin/HEAD, then origin/main, then origin/master), and its tooltip names the source, e.g. "Pull from origin/main". Branches with an upstream still pull from it, and Pull stays disabled on a detached HEAD or when no default remote branch exists.
  macOS Universal and Windows x64 installers are attached by the release workflow. This release becomes Latest after the build and updater signature checks succeed.
