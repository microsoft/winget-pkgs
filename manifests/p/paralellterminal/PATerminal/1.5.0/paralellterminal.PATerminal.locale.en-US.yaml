ReleaseNotes: |-
  Changes
  - Group names in the Recent order. The flat Recent view now shows each session's group path (Parent / Child) above its title, with a color bar per top-level group.
  - Recently used badge. A session you typed into within the last 7 days shows a badge (today / yesterday / N days ago; the tooltip shows the last input time). It appears in both views and survives restarts. Badges start from the first keystroke after this update.
  - Sidebar layout. The status label, the recently used badge and the pin / archive / close buttons now share one row above the session name, so the name, note, folder and Git branch use the full width. The Whole row stays pinned at the top while scrolling. The default sidebar width is now 384px (was 320px).
  - Copy-path button in the folder browser's left column. Every row under Places, Favorites and Recent places has a copy button that copies the absolute path. Enter / Space on a button inside a row now acts on that button instead of switching the listing.
  Fixes
  - No more false "done" marks and notifications when looking through sessions. Switching between claude / codex sessions every second or two no longer marks the session you just left as done or sends a notification. As a result, the "running" label for work an agent starts by itself appears about 2 seconds later than before.
  macOS Universal and Windows x64 installers are attached by the release workflow. This release becomes Latest after the build and updater signature checks succeed.
