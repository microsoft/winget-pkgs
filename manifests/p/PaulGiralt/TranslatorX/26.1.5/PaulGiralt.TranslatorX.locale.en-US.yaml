ReleaseNotes: |-
  TranslatorX 26.1.5 is now available. It promotes the verified 26.1.5-beta.2 build unchanged to Stable.
  This release fixes CUCM log collection across time zones, adds collection diagnostic reports, and makes the message safety limit configurable with a default of 10 million messages. It includes the application library and bundled Windows SSH runtime updates tested in the 26.1.5 betas. Packages remain signed for macOS, Windows, and Linux with signed updater metadata and versioned SBOMs.
