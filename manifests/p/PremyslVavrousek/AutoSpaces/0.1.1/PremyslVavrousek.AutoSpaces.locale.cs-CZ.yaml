ShortDescription: Maximalizovaná okna dostanou vlastní virtuální plochu, jako Spaces v macOS.
Description: |-
  AutoSpaces je malá aplikace v oznamovací oblasti, která za vás spravuje virtuální plochy Windows. Když na ploše maximalizujete další okno, přesune se na vlastní plochu; po jeho zmenšení nebo zavření se vrátíte zpět a plocha navíc zmizí. Umí také při startu rozmístit už maximalizovaná okna na samostatné plochy a otevřít vybrané aplikace na určených plochách. Jediný soubor pod 1 MB bez síťového kódu.
