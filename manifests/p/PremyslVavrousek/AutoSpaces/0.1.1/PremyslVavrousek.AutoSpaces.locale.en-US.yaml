ShortDescription: Gives maximized windows their own virtual desktop, like Spaces on macOS.
Description: |-
  AutoSpaces is a small tray utility that manages Windows virtual desktops for you. When you maximize another window on a desktop, it moves to a desktop of its own; when you restore or close it, you return to where you came from and the extra desktop is removed. It can also spread already maximized windows over separate desktops at startup and open chosen apps on chosen desktops. A single executable under 1 MB with no network code.
