ShortDescription: Tasks, calendar and contacts with CalDAV/CardDAV sync and a built-in sync server.
Description: 'Daynizer is a desktop app for tasks, calendar and contacts that syncs two ways over CalDAV and CardDAV with your own server (Nextcloud, Synology, Radicale, Baikal and others). Tasks work like Tasks.org: lists, subtasks, start and due dates, priorities, tags and repeating tasks. The calendar shows tasks and events together in month, week and day views, and the contacts manager has address books and color-coded labels. Reminders show as desktop notifications and sync to your phone. No server? Daynizer can run its own built-in sync server, which you can turn off any time.'
