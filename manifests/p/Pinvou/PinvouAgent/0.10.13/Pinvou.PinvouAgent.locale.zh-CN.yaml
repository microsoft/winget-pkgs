  en-US
  New
  - LoongArch64 support: a third Linux target for new-world UOS V25 / deepin 23/25 systems (glibc 2.38, WebKitGTK 2.40+); local embedding is compiled out and retrieval degrades to full-text; old-world systems are explicitly unsupported. (#715)
  - Global bring-to-front shortcut: a system-wide shortcut (default Ctrl/Cmd+Alt+P) summons the background main window; off by default, enable and customize in Settings; Wayland sessions show as unsupported. (#716)
  Fixes
  - All 11 rendering findings from the visual e2e sweep fixed: Codex native lane reasoning/tool cards, light-authored HTML previews forced dark, dark cold-boot white flash, one failed lazy chunk locking view switching, ja locale gaps and truncation — each re-verified red to green. (#726)
  - Model-facing text aligned with actual behavior: attachment guidance no longer instructs policy-excluded tools, silent knowledge-search degradation is disclosed to the model, read-only plan-mode turns no longer receive execution imperatives, persona capability wording and connector skill copy corrected. (#724)
  - Session-messaging round-22 review fixes: the removal-streak ceiling no longer strands delivered files (done-marked files stay retirable); assembly seam and literal constant anchors pinned. (#720)
  - LoongArch64 release pipeline round-2 fixes: usrmerge libc.so link resolution, compat-stub retention, target-scoped link flags with a front-loaded link canary. (#731)
  Performance
  - Batched ACP snapshot reconciliation: 2000-turn overlap merge P50 1306.94ms → 4.57ms. (#732)
  - ACP timeline reuses unchanged turns: 2000-turn append/projection P50 18.18ms → 1.08ms. (#730)
  - Background stream preview throttling and render reuse: P50 down 59.8%/67.7% at 5/10 concurrent sessions with foreground budgets and semantic events unchanged. (#727)
  Internal improvements
  - Bundled components refreshed: dws 1.0.64 / Lark CLI 1.0.98 / WeCom CLI 1.3.4, codex-acp 2.2.2 / claude-agent-acp 0.93 / bundled Node 24.22.0, chrome-devtools-mcp 1.11.0; BUNDLE_VERSION 0.34. (#725)
