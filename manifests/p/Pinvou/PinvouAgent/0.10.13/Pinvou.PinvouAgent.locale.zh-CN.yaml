ReleaseNotes: |-
  官方下载 / Official Downloads
  Pinvou 已在新华三官网提供官方下载渠道：
  - Windows x64：新华三官网 — pinvou3 for Windows
  - macOS Universal：新华三官网 — pinvou3 for macOS
  - H3C LinSeer MegaCube（Linux ARM64）：新华三官网 — pinvou3 for MegaCube
  新华三官网与 GitHub Assets 均为官方分发渠道，版本同步可能存在时间差；下载前请确认页面显示的版本。v0.10.13 官网页面尚未同步更新，当前版本请优先使用本页下方 Assets。
  新功能
  1. LoongArch64 支持（UOS V25 新世界）（#715）：新增第三个 Linux 目标 loongarch64（dpkg 架构 loong64），面向 UOS V25（2500 版本）与 deepin 23/25 等「新世界」系统（运行时基线 glibc 2.38、WebKitGTK 2.40+ / webkit2gtk-4.1）；旧世界 LoongArch 系统（UOS V20 LoongArch 版、Loongnix 20、麒麟 V10 时代）无法运行 Tauri 2，文档明确标注不支持。平台降级明确且 fail closed：本平台无 ONNX Runtime 预编译产物，本地嵌入按目标编译排除——知识库检索自动降级为全文检索，新建/导入/挂载本地知识库在无本地嵌入平台照常可用，界面隐藏本地模型下载入口（localEmbedSupported 能力位全链路 fail closed，初始即 false 直至能力解析，Web 侧不渲染死按钮）；连接器与 Codex/Claude 原生运行时的按需安装器无上游产物（PATH 已装二进制继续可用）；SenseVoice ASR 引擎随包交叉编译附带。CI 同步落地 build-linux-loongarch64 发布腿与必选 rust-loongarch64-check 检查腿，交叉工具链与 sysroot 全 sha256 钉扎、逐包 Release 链校验，deb 手工组装与 tauri-bundler 布局逐字段对齐。经七轮评审修复：bindgen 跨架构宏解析、usrmerge 链接解析、fresh 安装可建库可检索、诊断文案英文化等（构建管线收尾见 #731 与「注意事项」）。
  2. 全局置前快捷键（#716）：系统级快捷键（默认 Ctrl/Cmd+Alt+P，macOS 为 ⌘⌥P）在 Pinvou 于后台运行时把主窗口召到前台。默认关闭，可在 设置 → 通用 中开启并自定义组合键。macOS Cmd+H 隐藏的应用可被正确唤回（NSApplication.unhide）；Linux 复用二次启动激活的 GTK present 路径，带 Mutter 焦点窃取防护的临时置顶，最小化窗口可靠还原（二次启动激活同步受益）。能力探测 global_shortcuts_available：Windows/macOS 恒可用；Linux 仅真实 X11 会话可用，Wayland 会话显式显示不支持而非静默无效。设置面板以「校验 → 应用 → 持久化」单锁序执行，注册冲突（组合键被其他应用占用）与无效组合内联报错，快照镜像以磁盘为唯一权威；启动时注册冲突仅记录、绝不阻塞启动。经七轮评审加固（插件注册缺失 panic、替换臂先注册后注销、禁用态保存后镜像陈旧、裸键系统级抢占拒绝等均修）。
  问题修复
  1. 视觉 e2e 扫荡 11 项渲染缺陷全修（#726）：对真实 dist 构建的 509 个 UI 状态、986 张截图的视觉 e2e 扫荡产出 1 项阻断 + 10 项 major 渲染缺陷，本 PR 全部修复并加两项防御性修复，每项在重建后按原始复现路径红转绿复核。要点：Codex 原生「品悟」通道静默丢弃推理折叠与工具卡（水合历史与实时工具事件双路径）——现在与外部通道一致渲染；浅色底 HTML 工件预览被三层强制深色不可读——预览面跟随应用主题；更新提示卡片遮挡侧栏底部按钮（附件按钮点击被吞）；深色模式冷启动先刷白帧——index.html 绘制前预置主题类与画布底色；单个懒加载 chunk 失败锁死全部视图切换——错误边界按视图键渲染期复位；ja 文案缺口（知识库嵌入芯片英文回潮）、连接器药丸日文断词、固定 176px 门户菜单截断日文长项、≥7 列宽表格预览无滚动、工件卡片日期断行、EN 人设编辑器标签溢出等；另含 remote_kb_* 列表空值归一与 Monitor 横幅不再内插原始 JS 错误文本。
  2. 模型可见文案与实际行为对齐（#724）：全量审计发现的对模型侧文本（提示词、回合提醒、工具/技能说明）失实修复。要点：附件指引在排除图像工具的评测策略下仍硬性指示调用 image_analyze（必调用模型没有的工具）——现按策略裁定改述并禁止编造；kb_search 在嵌入模型加载失败/超时/未安装时静默退化为关键词检索、空结果脚本却让模型断言「未找到」——降级时向模型追加警告；计划模式只读回合不再收到无条件的「立即产出文件并执行命令」指令；人设装备包装区分人设领域知识与运行时授权能力（守护型人设不能再声称实时监控/数据访问）；内联保存提示的幽灵 PINVOU3_WORKSPACE token 改为提示词实际教授的相对路径约定；连接器与市场技能描述批量订正（wecom 文档管理范围与公式转义、lark-doc 白板承诺、tmeet event stop --force 强制确认表、tencent-docs 意图范围与 VIP URL、visualizer 改用 python3 等）。
  3. 会话消息 round-22 审阅修复（#720）：#627 内置会话消息 round-22 新鲜审阅的五项 major 全修。唯一代码缺陷：投递移除连败达到上限时，已写 done 标记的文件被一并冻结在 spool 直至重启——标记本身已抑制重投递，冻结没有门控作用，只会搁浅已投递文件并使终态审计不可达——现在带标记文件保持可退休，跳过臂每轮重试移除且绝不重投递。其余为钉扎与文档：deliver_messaging_turn 装配提取为纯函数接缝并跨文件钉扎（匹配消费剥离后正文、人设卡仅前缀引擎内容、transcript 保留原文）；MAX_DELIVERY_ATTEMPTS、64 KiB 块上限、保留期等常量从「由常量派生 fixture」改为字面锚点（原钉扎下任何漂移都绿）；剥离器空正文两臂首次有红绿测试；撤回不可能发生的「两次投递」超时臂模块文档；入口预算注释如实记录实测值。全部变异红验证。
  性能优化
  1. ACP 快照对账批量化（#732）：快照合并不再把每条保留事件送入单事件追加器反复全量扫描 + 逐条排序——一次性索引有效快照序列、收集新选中会话事件、至多一次稳定数值排序；保留快照优先去重、新事件首现、输入不可变与无操作恒等；不规则序列保持旧路径。合成 2000 回合重叠 + 活尾场景合并 P50 1306.94ms → 4.57ms（200/1000/2000 回合 P50 分别提升 96.2%/99.3%/99.7%），300 例确定性差分回归与真实浏览器 gap 恢复/活尾冒烟通过。
  2. ACP 时间线未变回合复用（#730）：实时更新时不再每次重建全部历史——视图自有的增量投影器校验不可变、严格有序、单会话前缀追加，仅重建受影响回合并保留旧回合/条目/工具的对象引用；快照替换、截断、重复、乱序、会话/语言变更等仍走全量投影，初次投影保持原路径。合成 2000 回合追加 + 投影 P50 18.18ms → 1.08ms（-94.1%），与全量重放的逐追加差分对比回归通过。
  3. 后台会话流式预览开销削减（#727）：非活动会话的 Markdown 预览改按 1000ms 预算（前台保持 180ms 预算与同步首输出），挂起发布跨会话共享（保留每会话取消、计时器兜底与语义边界即时处理），气泡按消息复用已渲染文本避免会话切换同步重解析，新激活会话在首个订阅者快照前刷新（消除基线 130ms 预览追平）。本地 handler/解析器重放：5 并发会话 P50 79.89ms → 32.14ms（-59.8%），10 并发 164.26ms → 53.03ms（-67.7%）。
  内部改进
  1. 内置第三方组件全量更新（#725）：连接器 CLI——dws 1.0.61 → 1.0.64、Lark CLI 1.0.95 → 1.0.98、WeCom CLI 1.2.1 → 1.3.4（三套技能树按上游发布三方合并重同步、五平台锁清单逐包重哈希、wecom 卡片能力描述随 1.3.4 实装扩展、BUNDLE_VERSION 0.33 → 0.34 使存量安装下次启动重新提取）；ACP 适配器——codex-acp 1.6.2 → 2.2.2、claude-agent-acp 0.79 → 0.93（内置 Claude SDK 运行时随之 0.3.274 → 0.3.300）、内置 Node 24.20.0 → 24.22.0（SHA 校验）；vendored chrome-devtools-mcp 1.7.0 → 1.11.0（target-id 补丁重锚定到上游原生 getter）。MIN_CODEX_VERSION 0.144.6 下界补齐实机运行时证据（完整 ACP 生命周期在该版本完成）。
  2. LoongArch64 发布管线 round-2 修复（#731）：#715 合入后发布证据链复核发现的两项 blocker 修复——交叉发布链接无法解析 sysroot 的 libc.so（deepin usrmerge 布局无 /lib、compat 桩仅 .a 无 .so、cargo 对已设 RUSTFLAGS 静默丢弃 target 级旗标：prune 现重建 usrmerge 别名、显式保留 compat 桩、编排器改用目标级 CARGO_TARGET_*_RUSTFLAGS，verify_sysroot 模拟 ld 对每个文本链接脚本逐路径断言，首个 cargo 构建前新增 hello-world 链接金丝雀）；宿主 objdump 无法解析 loongarch64 ELF（改用 readelf -W --dyn-syms）。另含嵌入模型加载能力门控前置（peer 残留模型目录不再盖假 model_error）、kb_search 未就绪原因按能力表述、策略钉扎加固。
  注意事项
  - 本发布暂不附带 LoongArch64 安装包：#715/#731 的 LoongArch64 支持代码已合入，但 loong64 deb 的发布构建当前存在已知问题、正在修复，将在修复后的后续版本提供下载；在此之前 loong64 用户可按仓库文档自行构建。
  - 全局置前快捷键（#716）默认关闭，可在 设置 → 通用 开启；Wayland 会话下显示为不支持（X11 会话可用）。
  - LoongArch64 为明确的降级面：本地嵌入不可用（知识库检索自动降级全文检索）、连接器与 Codex/Claude 原生运行时无按需安装器（PATH 已装二进制继续可用）、SenseVoice ASR 随包附带。
  - 官网页面版本同步可能滞后，v0.10.13 官网页面尚未更新，下载前请确认页面显示的版本。
  - Windows 和 macOS 安装包尚未正式签名。Windows 首次安装可能出现 SmartScreen 提示；macOS 首次打开如被 Gatekeeper 拦截，可在确认安装包来源可信后解除隔离再打开。
  - 安装包与发布产物由版本 PR 合入 main 后触发的发布工作流构建，未在本地构建。
  - 本次为预览版本，欢迎通过 GitHub Issues 反馈问题。
