  - computer-use 虚拟显示器隔离、主聊天手动压缩入口、会话分叉与归档导入、等待输入系统通知、市场工具校验报告、计划任务累计用量核算、侧边栏紧凑任务行。（#826/#834/#835/#833/#862/#865/#854）
