  en-US
  New Features
  - Model configuration supports custom ports and keyless endpoints; per-process CPU sampling in Monitor. (#851/#856)
  - Computer use on session-isolated virtual displays, manual compaction entry in the main chat, session fork and archive import, waiting-for-input notifications, MarketplaceToolValidation report, cumulative usage accounting for scheduled tasks, compact single-line sidebar task rows. (#826/#834/#835/#833/#862/#865/#854)
  Fixes
  - Fixed the 1.0.0 Windows packaging failure (wix config key) and hardened the release contract gate. (#886)
  - Collision-probed generated session ids with path-spelling folding, scheduled-task token baseline race, four frontend review follow-ups. (#879/#880/#881)
  - Remote-control fix waves rounds 15–30, steered delivery finalized on commit, per-layout pptx schema mirrors, review budget alignment, macOS self-targeted AX read refusal, context window kept when offline, date slot restored on narrow viewports. (#822/#836/#837/#841/#848/#849/#871)
  Internal improvements
  - Removed in-app Beta branding; repo-wide dead-code sweep; Windows NSIS/WiX packaging pipeline; dependency security advisory clearance; test and documentation corrections. (#883/#846/#868/#850/#875/#852/#855/#878/#882/#885/#872/#874)
