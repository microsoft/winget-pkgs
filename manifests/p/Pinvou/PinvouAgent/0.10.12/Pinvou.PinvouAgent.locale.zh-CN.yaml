  zh-CN
  新功能
  - 会话引用提及：输入框 @ 引用其他会话，模型经只读 session-reader 工具按需读取；特性开关关闭时入口、注入块与历史卡片全面降级。（#586）
  - 内置会话消息：内置工具集首个写能力——跨会话消息投递，带目标/发送方校验、字节预算与审计。（#627）
  - 辅助侧聊可读父上下文：作用域化只读工具回答「任务进展/报错含义/结论总结」，失败路径全部 fail closed。（#673）
  - 流式回复淡入：新到文本一次性渐入，设置可关，遵循系统减少动态效果偏好。（#714）
  - 问题卡片恒提供自定义回复：模型不再能隐藏自由文本框，与 TUI 决策对齐。（#718）
  修复
  - 关闭 #507 round-54 审计五项回归与一项 P2，每修带红验测试或变异红钉。（#695）
  - 引擎自启回合保留宿主申报路由限额：目录外云模型（如 deepseek-flash 384K）不再在重发/恢复/唤醒等回合被静默钳回 8K。（#709）
  - 模型选择列表在部分 WebKit 引擎下恢复滚动。（#710）
  - cargo-deny 对 yanked 发布由 deny 降为 warn，保留 ZIP 8.6.0/calamine 0.36.1 锁定图。（#717）
  内部改进
  - CodeWhale 底座升级至 c08c8c022（#108 路由限额重推导 + #105/#106/#111 三笔跟进）；随批按可达性评估 ignore zip 8.6.0 三条 RUSTSEC-2026 通告。（#712/#721）
  - 2026-10-15 CI 审计即时档落地：macOS push 冒烟与缓存保存重新划界等。（#711）
  - fork 登记 DCO 计数订正与教训登记；marketplace 回收站测试隔离，修复全量并行间歇红。（#706/#708）
  en-US
  New
  - Session mentions: reference other sessions from the composer with @; the model reads them on demand through read-only session-reader tools. With the feature switch off, entries, injection blocks, and historical cards degrade gracefully. (#586)
  - Builtin session messaging: the first write capability of the builtin toolset — cross-session message delivery with target/sender validation, a serialized byte budget, and auditing. (#627)
  - The auxiliary side chat can answer from the parent task's real history through one scoped, read-only session-reader instance; every failure path fails closed. (#673)
  - Streaming fade-in: newly streamed text softens in with a one-shot fade; desktop settings toggle (default on), prefers-reduced-motion respected. (#714)
  - Question cards always offer a custom reply: the model can no longer suppress the free-text box; aligned with the TUI product decision. (#718)
  Fixes
  - All five round-54 audit regressions plus one P2 from the post-merge review closed, each with a red-verified test or mutation-red pin. (#695)
  - Engine-self-started turns keep host-declared route limits: out-of-catalog cloud models (e.g. deepseek-flash 384K) are no longer silently clamped back to 8K on resend/resume/wake turns. (#709)
  - The model picker list scrolls again on affected WebKit engines. (#710)
  - cargo-deny reports yanked releases as warnings instead of errors, keeping the locked ZIP 8.6.0 / calamine 0.36.1 graph. (#717)
  Internal improvements
  - CodeWhale base upgraded to c08c8c022 (#108 route-limit re-derivation + #105/#106/#111 follow-ups); three zip 8.6.0 RUSTSEC-2026 advisories ignored after a reachability assessment. (#712/#721)
  - Immediate-tier fixes from the 2026-10-15 CI audit landed (macOS push smoke/cache re-scoping). (#711)
  - Fork register DCO counts corrected with a lessons-learned entry; marketplace recycle-bin tests isolated, fixing full-suite parallel flakiness. (#706/#708)
