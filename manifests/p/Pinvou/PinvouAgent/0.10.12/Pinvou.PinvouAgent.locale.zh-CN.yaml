ReleaseNotes: |-
  官方下载 / Official Downloads
  Pinvou 已在新华三官网提供官方下载渠道：
  - Windows x64：新华三官网 — pinvou3 for Windows
  - macOS Universal：新华三官网 — pinvou3 for macOS
  - H3C LinSeer MegaCube（Linux ARM64）：新华三官网 — pinvou3 for MegaCube
  新华三官网与 GitHub Assets 均为官方分发渠道，版本同步可能存在时间差；下载前请确认页面显示的版本。v0.10.12 官网页面尚未同步更新，当前版本请优先使用本页下方 Assets。
  新功能
  1. 会话引用提及（#586）：在输入框以 @ 引用其他会话（支持 CJK 邻接 @），模型按需经只读 session-reader 工具读取被引用会话的历史，而非整段塞入上下文。输入联想面板、引用 chips、「## Referenced chats」注入块、时间线引用卡片与侧栏拖拽复用（IME 守卫菜单键）随批落地。作为内置特性开关框架的首个消费者，功能默认开启、可随时关闭：关闭后 @ 触发/候选面板/拖拽不再产生引用，发送时抑制注入块（含编辑重发与语音任务/设计元素发送路径），历史引用卡片降级为「功能已关闭」不可点击，未发送 chips 保留可移除；开关状态经 listBuiltinFeatures + pinvou:tools-changed 在桌面与 Web 双通道热刷新，读取失败保持最近已知状态、绝不误报「已关闭」。
  2. 内置会话消息（#627）：跨会话消息投递——内置工具集的首个写能力（docs/builtin-toolset-contract.md §5 L1 / §6）。session-reader（1.0.0 → 1.1.0，L0 → L1，新增 sessions.write 授权）提供 send_message_to_session：目标/发送方校验（字符集、隔离前缀、存在性、禁止自发送）、序列化约 60 KiB 字节预算叠加 32k 字符上限、投递与审计全链路可查，跨会话协作不再需要人工搬运上下文。
  3. 辅助侧聊读取父上下文（#673，ADR-0024）：辅助对话引擎（aux-<parent_id> 会话）此前零工具，现在恰好获得一个作用域化工具——spawn 时钉扎到父任务会话 id 的 session-reader MCP 实例，侧聊可直接回答「这个任务进行到哪了 / 刚才的报错什么意思 / 总结一下结论」。其余隔离属性全部保留且失败路径 fail closed：--only-session 作用域模式在启动时拒绝隔离前缀钉扎，作用域 miss（非成员 id、解析失败、父会话已删）返回同一条无 id 的 SCOPED_NOT_READABLE_ERROR，不泄露兄弟会话存在性；list_sessions 只返回钉扎条目，绝不目录扫描。
  4. 流式回复淡入（#714）：助手回复流式输出时新到文本以一次性淡入 span 呈现（150ms 透明度渐入 + 小幅错峰），内容柔和进入而非逐帧突兀弹出。实现按容器已提交字符偏移只包裹新到文本，会话中途打开、分离窗口、会话线重挂载等注水场景不会整段重播动画。桌面设置新增开关（Chat → 「Streaming fade-in」，默认开启），遵循系统 prefers-reduced-motion 偏好，简中/英文/日文文案齐备。
  5. 问题卡片恒提供自定义回复（#718）：在应用归一化层固定展开自由文本自定义回复框——每个 LLM 问题卡片都恒有自定义回答入口，模型无法再经 request_user_input 的 allow_free_text 标志隐藏，ACP elicitation 卡片也不再依赖 schema 是否附带 _meta.codex.isOtherAnswer 字段，与 CodeWhale TUI 既有产品决策对齐（wire 标志仅为向后兼容保留）。模型自带的「其他/Other/その他」占位选项按三种 UI 语言无条件过滤，由内建框取代。
  问题修复
  1. 关闭 round-54 审计五项回归（#695）：#507 合并后 round-54 post-merge fresh audit 的五项 MAJOR 加协作评审的一项 P2 全部关闭，含连接器导入管线锁下包 id 自映射校验的回归恢复（此前一次「行为保持」清理把 ensure_package_id_self_mapping 从锁内位置删掉而文档与注释未动）等。每项先亲证后修，每修带红验测试或变异红钉，无其他行为变更。
  2. 引擎自启回合保留宿主申报路由限额（#709，修 #703）：引擎自启的回合经 current_runtime_route 重推导时硬编码 host_limits: None，随后 install_resolved_runtime_route 用未申报候选替换 active_route_limits 与客户端——带宿主申报限额的路由（典型：目录外云模型 deepseek-flash 申报 384K）在每个自启回合被静默钳回 8192 输出。根修在底座侧（CodeWhale#108，gitlink 13ee4dfd2 随 #712 落地）：重推导时把已安装的 active_route_limits 重申为宿主申报，并带三重守卫。受影响路径：/edit 末轮重发（最易触发）、子代理完成恢复、空闲 shell 唤醒与目标延续。
  3. 模型选择列表恢复滚动（#710）：用户反馈「添加模型/编辑模型」对话框中模型列表无法滚动，折叠线以下的模型无法选择。根因是两个对话框把 max-h-[76vh] + overflow-y-auto 放在同一装饰容器上，且处于 position: fixed + backdrop-filter 祖先链下——该组合在部分 WebKit 引擎上滚动区可能不建立、内容被裁剪（本机 Chromium/Playwright WebKit/真实 WKWebView 均无法复现，但故障族在 webkit2gtk 等引擎有据可查）。现重构为标准模态模式，滚动区独立于装饰容器。
  4. yanked 依赖发布降级为警告（#717）：cargo-deny 配置 advisories.yanked 由 deny 调整为 warn，保留既有锁定 ZIP 8.6.0 与 calamine 0.36.1 依赖图——calamine 0.36.1 仍要求 ZIP ^8.6，钉扎的 yanked 发布在受支持的依赖更新可用前保持可见告警；其余 advisory ignore、漏洞处理、许可、bans 与 source 限制不变。出现受支持的非 yanked 更新即恢复 deny；若 RustSec 通告影响钉扎版本将立即重评。
  内部改进
  1. CodeWhale 底座升级两批（#712 + #721）：gitlink 803e672bb → 13ee4dfd2（#712，CodeWhale#108「引擎路由重推导保留宿主申报限额」，即 #709 的底座根修）→ c08c8c022（#721，三笔 squash：#105 engine 路由 round-9/10 复审跟进、#106 依赖更新与去重、#111 重推导仅携带宿主申报限额的 round-2 复审加固）。fork 台账随批同步（登记头前进至 c08c8c022，74 个登记提交、73 个带 DCO sign-off）。#721 随批按可达性评估 ignore zip 8.6.0 wholesale extract API 的三条通告（RUSTSEC-2026-0367/0368/0369）：修补版位于 zip >= 9.0.0 被 calamine ^8.6 阻断，图内无 wholesale extract 调用（calamine 仅内存读 xlsx，直连 zip 消费方全部 by_index + enclosed_name 守卫）。
  2. CI 审计即时档修复（#711）：落地 2026-10-15 十四 lane CI 审计（GitHub API 实测 6,705 次 pr-check 运行、缓存与产物尺寸）的即时档：macOS push 腿冒烟与缓存保存重新划界（push 腿中位约 109 分钟、p90 178.3 分钟顶 180 分钟上限，13 天内 3 次超时击杀；release-fast 冒烟中位约 55 分钟不再每个 push 全跑）等三个自包含基础提交，另含当日三轮评审修复波（含 macOS 缓存键轮换与策略钉扎加固）。
  3. fork 登记 DCO 计数订正（#706）：订正「全部带 DCO sign-off」的失实措辞为按实数签数登记——当时 71 个登记提交中 70 个带签（唯一未签：#107 squash 合并提交信息未保留 sign-off 尾部，属上游合并信息缺口，已留言知会上游维护者）；§13 教训登记追加 2026-10-15 条目（squash 合并必须写 sign-off 尾部 + 登记批按实数签数登记），zh/en 对齐。
  4. marketplace 回收站测试隔离（#708，修 #704）：recycle_bin 测试在全量并行 cargo test --lib 下间歇红（4 跑 2 红）而单跑/模块级/两两重跑全绿。根因：回收站三根可重定位，但跨进程 marketplace 写锁路径从进程 env 解析 paths::bundles_root()，with_roots 测试不持 ENV_LOCK——并行 env 重定向测试的临时 home 被清理时，受害测试的锁文件打开以 EACCES 失败。九个相关 with_roots 测试现包进 with_temp_home（持 ENV_LOCK、独立临时 PINVOU3_HOME），锁文件落在外人清不动的目录。
  注意事项
  - 会话引用提及（#586）与流式淡入（#714）默认开启，均可经设置/内置特性开关关闭；系统「减少动态效果」偏好下流式淡入自动跳过。
  - 官网页面版本同步可能滞后，v0.10.12 官网页面尚未更新，下载前请确认页面显示的版本。
  - Windows 和 macOS 安装包尚未正式签名。Windows 首次安装可能出现 SmartScreen 提示；macOS 首次打开如被 Gatekeeper 拦截，可在确认安装包来源可信后解除隔离再打开。
  - 安装包与发布产物由版本 PR 合入 main 后触发的发布工作流构建，未在本地构建。
  - 本次为预览版本，欢迎通过 GitHub Issues 反馈问题。
