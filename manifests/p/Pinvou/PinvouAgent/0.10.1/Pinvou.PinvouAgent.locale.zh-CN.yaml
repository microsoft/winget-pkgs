  官网更新日志
  zh-CN
  新功能
  - 工作与设计模式合并：场景成为工作模式页签，输入区简化为场景卡片，工件面板按需打开。
  - 会话项目层一期：侧栏项目分组，支持转为项目、重命名、删除（会话保留）；无项目时行为不变。
  - 定时任务支持一次性执行：可直接创建"明早 9 点提醒一次"类单次任务，编辑器与列表同步支持。
  - 模型目录按 2026 年 9 月厂商文档刷新：新增 GPT-6 Astra、Claude Fable 5.1、Gemini 3.8 Flash、Grok 4.6、GLM-5.3、DeepSeek Flash、Qwen3.8 Flash、Kimi K3 等旗舰，默认模型跟随厂商。
  - Linux 语音输入可用：识别引擎内置安装包，首次使用下载模型即可。
  - 录音胶囊动画与停止键提示。
  修复
  - 聊天上下文用量尊重保存的上下文窗口，不再被端点探测打回。
  - Windows 语音识别因临时文件占用失败的问题修复。
  - 左右 Alt/Option 均可触发语音快捷键。
  - 后台 Shell 任务卡不再因相同命令串卡、错序。
  - 设置页记忆删除与反馈面板关闭修复。
  - 删除人设卡后清空选中；三张人设卡不再承诺不存在的能力。
  - 危险命令安全拒绝规则扩充至 8,729 条（凭据销毁、磁盘破坏、持久化写入、凭据外传）。
  en-US
  New features
  - Work and design modes merge: scenes become work-mode subtabs with a simplified scene-card composer, and the artifacts panel opens on demand.
  - Conversation projects phase one: project groups in the sidebar with convert / rename / delete (conversations kept); behavior is unchanged without projects.
  - One-shot scheduled tasks: "remind me once tomorrow at 9" creates a single-run task, supported end to end in chat, editor, and task list.
  - Model catalog refreshed to September 2026 vendor docs: GPT-6 Astra, Claude Fable 5.1, Gemini 3.8 Flash, Grok 4.6, GLM-5.3, DeepSeek Flash, Qwen3.8 Flash, Kimi K3 and more; preset defaults follow the vendors.
  - Voice input works on Linux: the recognition engine ships inside the installer; download the model on first use.
  - Animated recording pill with a stop-key hint.
  Fixes
  - The chat context meter honors your saved context window instead of snapping back to endpoint probes.
  - Windows voice recognition no longer fails on a locked temporary WAV file.
  - Both Alt/Option keys trigger the voice shortcut.
  - Background shell task cards no longer get mixed up between identical commands or appear out of order.
  - Settings memory deletion and feedback-panel closing now work on desktop.
  - Deleting a persona card clears its selections; three persona cards no longer promise nonexistent capabilities.
  - The dangerous-command deny ruleset grows to 8,729 typed rules (credential destruction, disk wipe, persistence writes, credential exfiltration).
