ReleaseNotes: |-
  官方下载 / Official Downloads
  Pinvou 已在新华三官网提供官方下载渠道：
  - Windows x64：新华三官网 — pinvou3 for Windows
  - macOS Universal：新华三官网 — pinvou3 for macOS
  - H3C LinSeer MegaCube（Linux ARM64）：新华三官网 — pinvou3 for MegaCube
  新华三官网与 GitHub Assets 均为官方分发渠道，版本同步可能存在时间差；下载前请确认页面显示的版本。v0.10.10 官网页面尚未同步更新，当前版本请优先使用本页下方 Assets。
  新功能
  1. pinvou CLI 补齐产品命令族（#507，破坏性变更 feat(cli)!）：CLI 达到与桌面应用在无 UI 场景下的功能对等，共享同一套 ~/.pinvou3 存储。新增 sessions、models + settings、memory、knowledge、scheduled、plugins、connectors、personas、code（ACP）、files、voice、deps、feedback、monitor、artifacts 命令族与 projects 家族（list/create/update/delete/move + projects rebind，迁移项目根、会话-代理索引、工作区绑定 sidecar 与会话元数据，--yes 门控）；agent run 新增 --session/--mode/--model/--attach 并默认持久化会话，headless 放行知识库工具（kb_search/kb_open_source）；人类/JSON 双输出携带同一事实，0/1/2 退出码契约与逐族稳定错误码（scheduled_store_busy、memory_organize_busy、connectors_install_lock_unavailable 等）。安全姿态：凭据不入 argv（仅经环境变量或 stdin，文档化例外如 models show --reveal-key），破坏性命令须 --yes，文件读取/vendor 输出/探测均有界，全部 vendor 子进程（ffmpeg、npm、tar、连接器与 code CLI）在进程组监督下运行并转发 SIGINT/SIGTERM/SIGHUP，退出即回收不孤儿；共享存储与 GUI 并发时受锁保护（knowledge 导入任务受状态机保护、scheduled 写入盖平台文件身份戳、连接器 CLI 安装走跨进程锁 + SHA-256 钉扎 + 原子改名替换）。GUI 专属面（detach、pet、内嵌浏览器、二维码渲染、录音 UI、配对、更新器）刻意缺席并在随包发布的 docs/pinvou-cli.md 中披露。随带修复一处 GUI 可见缺陷：codex workspace 对「tracked 且未修改」工作区的 diff 显示（CLI code workspace diff 镜像同一缺陷）。
  2. 引擎每回合步数预算默认统一为 2000（#510）：GUI、CLI agent run 与 benchmark 三条链路共用同一 bridge 配置构造器，主回合默认从底座的 200 提升为 2000，未显式传 max_steps 的 agent 子代理不再无界；multi-agent/swarm 的 expert 子代理同步从无界角色默认收紧到 2000（类型化 step_budget 失败，transcript 保留供 resume_from；极慢模型仍由 24 小时墙钟先兜底）。这是默认值而非宿主强制硬上限：显式正数 max_steps 收敛到同一 2000 上限，显式 0 保持底座的无界哨兵，advanced.max_steps 仍覆盖主回合，每回合 3600 秒墙钟不变。
  问题修复
  1. macOS WKWebView 的页内 JS 错误恢复可诊断（#691）：此前 macOS WKWebView 适配器上所有页内失败都报同一句 browser/wkwebview-javascript-failed: 发生了 JavaScript 异常——真实会话中过期元素 uid、合理等待超时、运行时缺失三种根因呈现完全相同，agent 无法区分可重试与致命，反复重放同一 uid 并退化为编造工具结果。两层根因：WebKit 只在 NSError userInfo 的 WKJavaScriptExceptionMessage 里报脚本异常，localizedDescription 是通用本地化串，而适配器只读了后者；共享运行时的 waitFor 超时只报 browser/wait-timeout 不附任何未命中证据（最常见原因是页面文案与搜索文本语言不一致，如 example.com 现已提供中文正文）。现在错误回调透出真实异常消息（压平单行、480 字符封顶、缺失时回退 localizedDescription），waitFor 超时附上未命中文本的证据，当场可诊断。
  2. marketplace scope 读改写加跨进程文件锁（#517，修复 #515）：此前 disabled_bundles.json 的读改写临界区只有进程内互斥，GUI 与 headless 宿主共用一个 ~/.pinvou3 且都安装/开关包时，两个进程可互相静默丢写——DenyAll 同意门上的一次 lost update 即 fail-open。现在 features/marketplace/scope.rs 全部 load→save 临界区走「进程内 Mutex + OS 文件锁」（~/.pinvou3/disabled_bundles.lock，与 remote-control 进程属主锁同源的 fd-lock 原语，flock/LockFileEx）；set_disabled_connectors 与技能开关经同一条持久化路径一并覆盖。失败姿态：锁文件打不开或锁不上（如文件系统不支持锁）时序列化无法建立，代码拒绝操作而非无同步运行——写入口全部返回 Result 向上传播拒绝。
  内部改进
  1. 全仓死代码与重复代码清理（#682）：覆盖 pinvou3-app/（前端 + Tauri 后端）、pinvou-cli/、pinvou-knowledge/、remote-control-relay/ 约 43.5 万行审计，75 文件净 −154 行（+1490/−1644；合并出的共享助手使行差低估了实际去重面）。每处删除与统一都经全仓引用核验，含字符串型接缝（Tauri 命令/事件名、serde 字段、i18n key、~/.pinvou3 下的 JSON key、协议消息名）；browser 的 7 处重复 is_allowed_url 守卫合一、memory 的 4 份重复加载与压实循环收敛为泛型恢复式加载器 + 双桶压实骨架、8 处平台错误码别名内联；为在途 PR 预留的代码原样保留并有跳过清单。
  2. CodeWhale 底座升级（#696）：gitlink 3118c36b8 → 480bebf6，聚合 fork 侧本轮六个已评审 PR——#92 账户路由重试幂等身份、#96 Windows 会话导出探测失败关闭、#101 kimi 空 items 丢弃修复（含 deferred-toolbox 有界体制）、#102 已验证无价值测试清理、#103 按 era 圈定 checkpoint 识别、#104 deferred-toolbox 大小界限对本 fork 禁用；登记/指纹随批同步（fork-guard 62→68），app 侧无需适配（本批不改父仓消费的底座 API 面）。
  注意事项
  - #507 是破坏性 CLI 面变更：CLI 新增完整产品命令族，agent run 默认持久化会话（设 PINVOU3_AGENT_TASK_KEEP_SESSION=0 恢复旧的一次性清理）；GUI 绑定面仍留在桌面应用。
  - #510 改变引擎默认行为：跨此版本的 eval 分数不可直接比较；显式配置（max_steps/advanced.max_steps）不受影响。
  - 官网页面版本同步可能滞后，下载前请确认页面显示的版本。
  - Windows 和 macOS 安装包尚未正式签名。Windows 首次安装可能出现 SmartScreen 提示；macOS 首次打开如被 Gatekeeper 拦截，可在确认安装包来源可信后解除隔离再打开。
  - 安装包与发布产物由版本 PR 合入 main 后触发的发布工作流构建，未在本地构建。
  - 本次为预览版本，欢迎通过 GitHub Issues 反馈问题。
  构建来源：main @ 9ae65c656 / Actions #38503528014（四平台安装包同源构建）
  官网更新日志
  zh-CN
  新功能
  - pinvou CLI 补齐产品命令族（sessions/models/settings/memory/knowledge/scheduled/plugins/connectors/personas/code/files/voice/deps/feedback/monitor/artifacts + projects），与桌面应用共享同一套存储；agent run 默认持久化会话，破坏性命令须 --yes，凭据不入命令行。
  - 引擎每回合步数预算默认统一为 2000（GUI、CLI、benchmark 一致），无显式上限的子代理不再无界。
  修复
  - macOS WKWebView 的页内 JS 错误报告真实异常详情，等待超时附未命中原因，三种根因不再同报一句话。
  - marketplace DenyAll/scope 开关在 GUI 与 headless 并发时不再互相丢写（跨进程文件锁，锁不可用即拒绝操作）。
  内部改进
  - 全仓死代码与重复代码清理（75 文件，引用级核验含字符串型接缝）。
  - CodeWhale 底座升级（聚合 6 个 fork PR：账户路由幂等、Windows 导出 fail-closed、kimi 空 items 修复、测试清理、checkpoint era 识别、deferred-toolbox 界限姿态）。
  en-US
  New
  - The pinvou CLI gains the full product command families (sessions/models/settings/memory/knowledge/scheduled/plugins/connectors/personas/code/files/voice/deps/feedback/monitor/artifacts + projects), sharing the same ~/.pinvou3 stores as the desktop app; agent run persists sessions by default, destructive commands gate behind --yes, and credentials never enter argv.
  - The engine per-turn step budget defaults to 2,000 across GUI, CLI, and benchmarks; subagents without an explicit cap are no longer unbounded.
  Fixes
  - WKWebView on macOS reports the real JavaScript exception detail, and wait timeouts explain what did not match — three different root causes no longer surface as one opaque message.
  - Marketplace DenyAll/scope toggles no longer lose writes under GUI + headless concurrency (cross-process file lock; operations are refused when locking is unavailable).
  Internal improvements
  - Repo-wide dead and duplicated code cleanup (75 files, reference-verified down to string-typed seams).
  - CodeWhale base upgraded (six fork PRs aggregated: account-routing idempotency, Windows export fail-closed, kimi empty-items repair, verified test cleanup, checkpoint-era recognition, deferred-toolbox bounds posture).
