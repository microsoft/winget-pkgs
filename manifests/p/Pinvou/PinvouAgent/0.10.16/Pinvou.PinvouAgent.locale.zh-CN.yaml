  en-US
  Fixes
  - Session transcript commits survive engine recycle: model hot-switch/reclaim no longer loses commit notifications, and a retired engine's queued snapshot can no longer clobber the replacement's turn; failed cold-spawn hydration now fails the spawn instead of caching a dead engine that bricked later turns; the spurious "authority record not synced" notice is fixed at the root — no user action needed. (#785)
  - Scheduled-task creation drain hardening: stuck episodes deduped by payload digest, mtime bumps un-park only on payload change, server-unlinked failure markers restored without clobbering landed receipts, truthful ceiling-tail labels, and non-UTF-8 spool names quarantined on sight. (#680)
  - Full-app visual sweep repairs: long-URL wrapping in chat markdown with table scroll boxes kept, knowledge dialogs no longer pinned edge-to-edge in narrow panes, settings dialog button contrast, reader-window first-frame theme flash fixed, dark-theme pairings and AA contrast, silently-dead alpha tints restored repo-wide across 14 files, and card-type badges plus community group names localized in all three languages. (#762)
  - Shell command generation guidance: reuse a verified interpreter and send inspectable scripts through the target shell's file entry point (PowerShell -NoProfile -File; UTF-8 BOM for non-ASCII text on Windows PowerShell 5.1); assuming stdin support is explicitly rejected. (#754)
  Internal improvements
  - Dependency cleanup round 3: bundled bridge Node 24.22.1 (security release), claude-agent-acp 0.95.0, dws connector CLI 1.0.65 (upstream checksums now verified), wry 0.57.1; platform floors (macOS 11 / Safari 14, glibc 2.35, Windows 10 1809, MSRV 1.90) unchanged. (#777)
  - CodeWhale foundation consumes #118–#122: engine-returned tool-result recovery (T2), settled subagent-name release and wait-timeout re-advertisement (14 advertised fields), npm security fixes, keyring 4.2 / oauth2 slimming. (#796)
  - Fork register records the consumed JSONPath backport provenance (docs-only, four files +14/−0). (#756)
