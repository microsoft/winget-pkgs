  官网更新日志
  zh-CN
  修复
  - 会话转录提交跨引擎回收保持：模型热切换/回收不再丢失提交通知、退役引擎排队快照不再覆盖替换引擎回合；冷启动水合失败即失败，不再缓存死引擎卡死后续回合；「权威记录暂未同步」假通知根除，无需用户操作。（#785）
  - 定时任务创建管线 drain 加固：卡住事件按载荷摘要去重、mtime 递增仅在载荷变化时解除停放、服务器摘除的失败标记补写且不覆盖已落地回执、超限尾部如实分类、非 UTF-8 队列名即见即隔离。（#680）
  - 全应用视觉扫荡修复：聊天长 URL 换行且表格保滚动框、知识库对话框窄窗不再贴边、设置对话框按钮对比度、阅读器窗口首帧主题闪烁修复、深色主题配对与 AA 对比度、14 个文件静默失效的透明度着色全仓恢复、卡片类型徽章与社区群名三语本地化。（#762）
  - Shell 命令生成提示改进：复用已验证解释器、经目标 shell 文件入口发送可检视脚本（PowerShell -NoProfile -File，Windows PowerShell 5.1 非 ASCII 用 UTF-8 BOM）；拒绝臆测 stdin 支持。（#754）
  内部改进
  - 依赖清理第三轮：捆绑桥 Node 24.22.1（安全版）、claude-agent-acp 0.95.0、dws 连接器 CLI 1.0.65（上游校验和已验证）、wry 0.57.1；平台地板（macOS 11 / Safari 14、glibc 2.35、Windows 10 1809、MSRV 1.90）不变。（#777）
