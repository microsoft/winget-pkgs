  官网更新日志
  zh-CN
  新功能
  - 单入口工作区选择器与钥匙串：项目成为会话创建唯一入口——统一选择器、每会话钥匙串（主根 + 附加根）、管理文件夹面板与查看工作区对话框；跨项目文件夹重叠合法化；ACP 车道附加根投递为披露的后续项。（#484）
  - Tachyon 推理控制：独立提供商标识，off/low/medium/max 四档（默认 low），max 以 xhigh 发送，历史 high 钳制 medium；未知 served model ID 上报 thinking 能力。（#733）
  修复
  - PPT 生成 slides 数组 schema 修复（Kimi k3 空幻灯片调用风暴根因）+ 内置服务器 schema 合同守卫进 CI；会话元数据记录实际解析的提供商路线。（#713）
  - ACP 安装阶段卡死自愈：设置面板卸载不再吞安装终态，卡片被动收敛到完成/失败/取消并回显真实错误。（#735）
  - 连接器详情按钮与实时状态同步：连接成功后按钮立即翻转，无需重开对话框。（#742）
  - 移动端导航抽屉全高并带滑入动画与遮罩淡入淡出（尊重减弱动效偏好）。（#739）
  性能优化
  - 会话恢复工具卡索引：2000 回合恢复 P50 最多降低 48.9%。（#746）
  - 工件缺席查找跳过：2000 回合桥恢复 P50 降低 16.7%–20%。（#749）
  - 后台工具输出通知合并（复用 50ms 节流）。（#748）
  内部改进
  - LoongArch64 发布管线修复（14 轮交叉链接修复移植）与触发契约收紧；loong64 安装包自本版起随发布提供。（#737 #759）
