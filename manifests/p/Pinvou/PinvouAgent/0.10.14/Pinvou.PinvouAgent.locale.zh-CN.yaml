  en-US
  New
  - Single-entry workspace picker and keychains: projects are the only organizing unit at conversation creation — a unified picker, per-session keychains (primary + attached roots), a manage-folders panel, and a view-workspace dialog; cross-project folder overlap is legalized; ACP-lane root delivery is a disclosed follow-up. (#484)
  - Tachyon reasoning controls: dedicated provider identity with off/low/medium/max effort tiers (default low); max is sent as xhigh and legacy high clamps to medium; unknown served model IDs advertise thinking capability. (#733)
  Fixes
  - PPT generation: a typed slides array schema fixes the Kimi k3 empty-slides call storm, and a bundled-server schema contract guard now runs in CI; session metadata records the actually resolved provider route. (#713)
  - ACP install-phase self-heal: unmounting the settings panel no longer swallows the install terminal state; the card converges to done/failed/cancelled with the real error echoed. (#735)
  - The connector detail dialog action button syncs with live state (no reopen needed). (#742)
  - The mobile nav drawer spans full viewport height and animates with a fading backdrop (reduced-motion respected). (#739)
  Performance
  - Tool-card indexing during transcript replay: 2000-turn restore P50 up to −48.9%. (#746)
  - Skipping absent artifact lookups during replay: bridge restore P50 down 16.7%–20%. (#749)
  - Background tool-output notifications coalesced onto the existing 50 ms throttle. (#748)
  Internal improvements
  - LoongArch64 release pipeline fixed (14 rounds of cross-link fixes ported) and trigger contract tightened; the loong64 package ships with this release. (#737 #759)
  - Dependency cleanup: emSign-cluster security fixes, ACP protocol 2.2.0, dedupe and dead-dependency removal, Safari 14 guard enforced. (#699)
  - Dead and duplicated business code sweep (254 files; 59 bridge mirror clone pairs merged). (#701)
  - CodeWhale gitlink bump registering upstream #112/#113 as topic T10. (#743)
