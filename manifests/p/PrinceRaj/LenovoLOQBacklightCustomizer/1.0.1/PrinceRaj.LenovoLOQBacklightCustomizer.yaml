ShortDescription: 100% Offline keyboard backlight customizer with dynamic lighting animations and auto-sleep for Lenovo LOQ laptops.
Description: Lenovo LOQ Backlight Customizer provides lightweight, software-level control over the keyboard backlight on Lenovo LOQ series laptops. Communicates directly with the hardware Embedded Controller via Lenovo's official ACPI Energy Management driver (\\.\EnergyDrv) without requiring heavy vendor background services. Features custom lighting modes (Breathing, Wave, Pulse, Flash, Static), customizable inactivity auto-sleep, and a global hotkey toggle.
