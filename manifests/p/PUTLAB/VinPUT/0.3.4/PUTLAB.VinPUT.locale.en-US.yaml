# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

PackageIdentifier: PUTLAB.VinPUT
PackageVersion: 0.3.4
PackageLocale: en-US
Publisher: PUTLAB
PublisherUrl: https://vinput-dasvcr.web.app
PackageName: VinPUT
PackageUrl: https://vinput-dasvcr.web.app
License: Freeware
ShortDescription: Type with your voice into any text field on Windows.
Description: |-
  VinPUT is a small background app for Windows. Hold or tap a key, speak, and the text is typed into whatever text field has the focus. It can also record voice memos as MP3.
  Speech is recognized by a model on your own PC (Whisper, Parakeet) or by Google with your own key.
  It installs for the current user without administrator rights.
Tags:
- dictation
- speech-to-text
- voice
- voice-typing
- whisper
ReleaseNotes: |-
  - Escape cancels a dictation: nothing is typed, also while it is still being recognized
  - Voice memos are saved at a normal listening volume, however softly the microphone records
  - Voice memos play in every player
  - Silent install for package managers shows no window and finishes at once
ReleaseNotesUrl: https://vinput-dasvcr.web.app/changelog
ManifestType: defaultLocale
ManifestVersion: 1.12.0
