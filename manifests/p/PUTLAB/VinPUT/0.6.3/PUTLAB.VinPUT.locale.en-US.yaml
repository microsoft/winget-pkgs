PackageIdentifier: PUTLAB.VinPUT
PackageVersion: 0.6.3
PackageLocale: en-US
Publisher: PUTLAB
PublisherUrl: https://vinput-dasvcr.web.app
PackageName: VinPUT
PackageUrl: https://vinput-dasvcr.web.app
License: Freeware
ShortDescription: Type with your voice into any text field on Windows.
Description: |-
  VinPUT is a small background app for Windows. Hold or tap a key, speak, and the text is typed into whatever text field has the focus. It can also record voice memos as MP3.
  Speech is recognized by a model on your own PC (Whisper, Parakeet) or by Google with your own key.
  It installs for the current user without administrator rights.
Tags:
- dictation
- speech-to-text
- voice
- voice-typing
- whisper
ReleaseNotes: |-
  - Pro can be tried free for 7 days: nothing is charged until they end, and cancelling before then costs nothing
  - The Models page and the VinPUT Pro page show the free days where Pro is offered
  - After 50 dictations with a model on this PC, one quiet notification mentions VinPUT Pro, once and never again
  - Your settings carry over as they are
ReleaseNotesUrl: https://vinput-dasvcr.web.app/changelog
