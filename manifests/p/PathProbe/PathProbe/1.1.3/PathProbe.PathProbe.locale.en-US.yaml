PrivacyUrl: https://getpathprobe.com/privacy.html
Copyright: Copyright (c) 2026 PathProbe
ShortDescription: Command-line network test tool for DHCP, scans, traceroute, and packet capture
Description: |-
  PathProbe is a command-line network test tool with no graphical interface. Run it from an Administrator Command Prompt or PowerShell on Windows 10 or 11.

  The Free tier is available at no charge (up to 5 simulated DHCP clients and a single 802.1Q VLAN tag). PathProbe Pro is a paid, one-time license that unlocks higher client limits, QinQ, and saved profiles. One Pro license is for one computer and is non-transferable. Current pricing is on the product page.

  Windows raw-packet features need Npcap installed with "WinPcap API-compatible Mode" enabled. The Windows build is not code-signed, so SmartScreen may warn on first run.
Moniker: pathprobe
Tags:
- cli
- dhcp
- network
- packet-capture
- traceroute
- vlan
ReleaseNotesUrl: https://github.com/getpathprobe/pathprobe-releases/releases/tag/v1.1.3
PurchaseUrl: https://getpathprobe.com/#pricing
InstallationNotes: |-
  PathProbe is a command-line tool with no GUI. Open an Administrator Command Prompt or PowerShell, then run pathprobe --version.

  Install Npcap from https://npcap.com/#download and tick "Install Npcap in WinPcap API-compatible Mode". Npcap is not included.

  The Windows build is not code-signed, so SmartScreen may say "Windows protected your PC". Choose More info, then Run anyway.

  The Free tier works without a key. Pro is a paid license locked to one computer and is non-transferable. Buy Pro at https://getpathprobe.com/#pricing, then run: pathprobe license activate --key PP1....

  Support: service@getpathprobe.com
