InstallationNotes: |-
  The jackedin command launches jackedin.exe, which opens the desktop window when run with no arguments and stays in the terminal when given a command. The zip also includes jackedin.com, a console entry point for scripts; it is extracted into the same folder.

  The Windows build is not code-signed, so SmartScreen may say "Windows protected your PC". Choose More info, then Run anyway.

  The first time JackedIN opens, accept the end-user license to continue. There is a 72-hour trial; after that a license is required. One license is for one computer and is non-transferable. Buy and activate at https://getpathprobe.com/jackedin/.

