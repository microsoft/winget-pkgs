ShortDescription: SSH, Telnet, and serial terminal with a desktop window and a command line
Description: |-
  JackedIN is an SSH, Telnet, and serial terminal for Windows 10 and 11. It has a desktop window and a full command line.

  JackedIN is a paid product with a 72-hour (3-day) full-featured trial. After the trial, a license is required to open sessions. One license is for one computer and is non-transferable. A purchase includes one year of updates. Current pricing is on the product page.

  The Windows build is a portable zip. jackedin.exe opens the desktop window; jackedin.com is included for console scripts. It is not code-signed, so SmartScreen may warn on first run. The end-user license is shown the first time the app opens.
Moniker: jackedin
