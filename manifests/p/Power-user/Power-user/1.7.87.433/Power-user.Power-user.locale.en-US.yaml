ReleaseNotes: |-
  - [NEW FEATURE] Select multiple shapes, and click Create Shape Carousel from the right-click menu
  - [Library - Tombstones] Improved preview generation and fixed minor bug
  - [Library - Maps] Fixed 2 issues with Maps, one related to color consistency and the other with duplicate Maps
  - [Library - Shapes] Dynamic shapes preview are now animated
  - [Library - Shapes] Fixed issue with Circular shape
  - [Library - Pictures] Improved performance for Configured Pictures
  - [Themes] Fixed outdated files not re-downloading after local deletion
  - [Replace Colors] Fixed bug
  - [Agenda] Fixed bug impacting Office versions prior to 2019
  - [Agenda] Support added for AllCaps/SmallCaps
  - [Agenda] Fixed bug preventing a resize of section number shapes
  - [Agenda] Minor bug fixed with Breadcrumbs
  - [AI Assistant] The AI Assistant can now run on multiple shapes at once
  - [Organize] Option added to fit the organize area to the current selection
  - [Organize] Fixed issue with the Organize toolbar mode
  - [Links] Fixed issue with Link window not displayed
  - [Links] Fixed issue with preservation of Table styles
  - [Links] Simplified the management of sources conflicts
  - [Links] Fixed issue when the range contained both a PivotTable and other data
  - [Tab Explorer] Fixed minor issue
  - [Excel] Fixed issue with multiple features when entire rows or columns are selected
  - New setting added for user control of start screen deactivation
