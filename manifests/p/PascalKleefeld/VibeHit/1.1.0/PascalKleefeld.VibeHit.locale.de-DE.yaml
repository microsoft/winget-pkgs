ShortDescription: Spielt Musik, Soundeffekte und eine verwandelte Stimme direkt in den Voice-Chat jedes Spiels. Gebaut für Roleplay-Server wie GTA RP.
Description: |-
  VibeHit macht dein Mikrofon zum eigenen Radiosender. Spiel Musik aus deinen Dateien, von YouTube, Spotify oder SoundCloud, feuer Sounds vom Soundboard per Hotkey ab und misch alles mit deiner Stimme. Alle in deiner Nähe im Spiel hören es, und niemand sonst muss etwas installieren.

  Kostenlos: Musik in den Voice-Chat des Spiels, Erkennung von Tempo, Tonart und Energie mit harmonischem Ordnen, Auto-Ducking beim Sprechen, Soundboard mit 72 Start-Sounds und Hotkeys im Spiel, Gehörschutz (Limiter), KI-Rauschfilter und Noise-Gate, Handy-Fernbedienung im WLAN.

  VibeHit Pro (optionales einmaliges Upgrade) bringt Stimmwechsler, Roleplay-Stimmeffekte wie Funkgerät oder Megafon, Rollen-Profile, zwei DJ-Decks mit MIDI, Karaoke, Voice-Studio-Presets mit eigenen VST3-Plugins und eine Handy-Fernbedienung, die überall funktioniert.

  Keine Mods, keine Injection, kein Zugriff auf den Spielspeicher: Fürs Spiel ist VibeHit einfach ein Mikrofon. Keine Telemetrie. Benötigt das kostenlose virtuelle Audiogerät VB-Cable; der Einrichtungs-Assistent führt durch die Installation.
