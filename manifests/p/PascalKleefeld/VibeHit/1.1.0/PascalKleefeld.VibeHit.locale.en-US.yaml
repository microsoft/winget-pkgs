ShortDescription: Play music, sound effects and a transformed voice straight into the voice chat of any game. Built for roleplay servers like GTA RP.
Description: |-
  VibeHit turns your microphone into your own radio station. Play music from your files, YouTube, Spotify or SoundCloud, fire sounds from a soundboard by hotkey and mix it all with your voice. Everyone near you in the game hears it, and nobody else has to install anything.

  Free: music into the game's voice chat, tempo/key/energy detection with harmonic playlist sorting, auto-ducking while you talk, a soundboard with 72 starter sounds and in-game hotkeys, ear protection (limiter), AI noise filter and noise gate, phone remote on your Wi-Fi.

  VibeHit Pro (optional one-time upgrade) adds a voice changer, roleplay voice effects like radio or megaphone, character profiles, two DJ decks with MIDI, karaoke, Voice Studio presets with your own VST3 plugins, and a phone remote that works anywhere.

  No mods, no injection, no access to game memory: to the game, VibeHit is just a microphone. No telemetry. Requires the free VB-Cable virtual audio device; the setup wizard walks you through installing it.
