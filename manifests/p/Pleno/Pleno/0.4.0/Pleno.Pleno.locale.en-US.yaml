ShortDescription: A readable programming language with optional checked types and async built in
Description: |-
  Pleno is a dynamically typed programming language with optional type annotations that are
  checked when the program runs, classes and pattern matching, and async built in. This package
  installs the compiler and runtime (pleno), the package manager (plm), the language server
  (pleno-lsp), the debug adapter (pleno-dap) and the REPL (pleno-repl).
