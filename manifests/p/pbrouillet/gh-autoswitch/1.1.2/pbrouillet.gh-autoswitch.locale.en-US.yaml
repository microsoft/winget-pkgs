ShortDescription: Auto-switch the active gh account before HTTPS git remote operations, with a Ratatui config editor.
Description: gh-autoswitch is a cross-platform Rust binary that acts as a git credential helper to automatically run `gh auth switch` to the right GitHub account before every HTTPS git remote operation (push, pull, fetch, clone), based on the remote owner/org. It also ships a Ratatui TUI to scaffold and edit its YAML config and to detect the path to gh.
