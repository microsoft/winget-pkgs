ShortDescription: Fast, local Windows launcher with NTFS search and Raycast-style essentials.
Description: |-
  Spyglass is a native Win32 launcher and file search tool for Windows 10 and 11.
  It indexes NTFS volumes directly for sub-millisecond search and adds a local
  command surface for quicklinks, aliases, notes, reminders, calendar agenda,
  focus mode, scripts, and local Ollama chat. Clipboard history is protected
  with Windows DPAPI, window snapping is multi-monitor and per-monitor DPI aware,
  and extensions communicate over JSON-RPC on stdio. No account, telemetry, or
  cloud sync is required.
