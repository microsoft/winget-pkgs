ShortDescription: Turn an old Android tablet or phone into a programmable button deck for your computer. Free and open source, with no account and no cloud.
Description: |-
  PerritoDeck turns an Android tablet or phone into a grid of live buttons and sliders for your computer. This package installs the PerritoDeck tray app: lay out buttons by dragging, pair a tablet with a one-time code or a QR code, and the host keeps the buttons working while the window is closed. On the tablet, install Perrito (Android 5.1 and newer, including Amazon Fire tablets) from the GitHub release.

  - Drag-and-drop editor that mirrors the tablet's grid, with pages, copy/paste, undo/redo and a "Try it" button.
  - Actions: hotkeys, typing text, media keys, opening websites, files and programs, running commands, multi-step keys and toggles.
  - Built-in integrations for OBS Studio and Home Assistant, sliders for system volume and more, and live keys (CPU, memory, OBS scene and recording status).
  - Profiles per tablet, switched automatically by the app in front, exported and imported as .perritoprofile files.
  - Plugins in Python or Node.js, with 24 first-party plugins bundled and an online catalogue.
  - Private by design: pairing with a one-time code, TLS with a pinned certificate, over Wi-Fi or a USB cable. No account and no telemetry; the app goes online only for the update check and the plugin catalogue, both opt-in.

  Status: pre-alpha. It works end to end, but expect rough edges and breaking changes.
