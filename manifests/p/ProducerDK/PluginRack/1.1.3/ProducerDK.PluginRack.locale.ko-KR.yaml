ShortDescription: Windows에서 재생되는 모든 소리를 VST3 플러그인 체인으로 처리해요.
Description: |-
  dk PLUG-IN-RACK은 Windows에서 재생되는 모든 소리를 VST3 플러그인 체인으로 처리해 원하는 출력 장치로 내보내요.
  체인을 출력 장치에 APO로 바로 적용해서 가상 오디오 장치가 필요 없어요. 그 방식이 안 되는 장치는 VB-CABLE 같은 가상 오디오 장치로 쓸 수 있어요.
  장치에 적용하면 그 장치의 Windows 오디오 효과 설정이 바뀌어요(먼저 확인을 받고, 관리자 권한이 필요해요). 제거하면 원래 설정으로 되돌려요.
