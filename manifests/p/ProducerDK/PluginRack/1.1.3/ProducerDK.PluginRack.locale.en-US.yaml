ShortDescription: Run all Windows system audio through a chain of VST3 plug-ins.
Description: |-
  dk PLUG-IN-RACK processes everything Windows plays through a chain of VST3 plug-ins and sends the result to the output device you choose.
  It applies the chain directly to an output device as an audio processing object (APO), so no virtual audio device is needed. Devices where that does not work can use a virtual audio device such as VB-CABLE instead.
  Applying the chain to a device changes that device's Windows audio effect settings (you are asked first, and it needs administrator rights). Uninstalling restores the original settings.
