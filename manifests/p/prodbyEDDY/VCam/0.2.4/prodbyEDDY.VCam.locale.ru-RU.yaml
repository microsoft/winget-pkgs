ShortDescription: Бесплатная веб-камера из iPhone или Android для Windows. Открытый код, подключение по Wi-Fi.
Description: |-
  VCam от EDDY превращает камеру iPhone или Android в виртуальную DirectShow-камеру для совместимых программ Windows. Установите приёмник на ПК и подключите телефон через Safari или Chrome по QR или одноразовому коду.
  Бесплатное приложение с открытым кодом под MIT, без приложения на телефоне, рекламы, водяного знака и подписки. Нужны Windows 10/11 x64 и одна локальная сеть Wi-Fi без изоляции устройств. Интернет требуется для сайта и сопряжения. Зашифрованное видео WebRTC передаётся напрямую между устройствами.
  Передаётся только видео, для звука нужен отдельный микрофон. Отдельного режима USB и TURN-ретранслятора нет. Режимы камеры зависят от телефона и браузера. Оставляйте страницу открытой, а телефон — разблокированным. Beta-установщик не подписан сертификатом издателя.
ReleaseNotes: Версия 0.2.4 проверяет обновления раз в 24 часа и сохраняет время проверки между перезапусками. Интерфейс доступен на русском и английском.
