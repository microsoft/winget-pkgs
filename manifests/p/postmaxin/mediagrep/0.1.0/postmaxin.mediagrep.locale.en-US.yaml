ShortDescription: grep for media metadata, searching the tags of audio, video and image files.
Description: |-
  mediagrep searches the metadata of media files (title, publisher, duration,
  resolution, codec, language and more) the way grep searches their contents,
  using MediaInfoLib. It supports recursive search and field comparisons with
  boolean operators, and prints results in grep's "file: line" form.
  The package includes MediaInfo.dll from MediaArea.
