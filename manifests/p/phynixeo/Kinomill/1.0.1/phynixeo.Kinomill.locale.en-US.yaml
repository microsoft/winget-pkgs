ShortDescription: Download videos and music from YouTube and 1000+ sites, then convert, trim, join and burn them.
Description: |-
  Kinomill is a free, open-source Windows app that downloads videos and music from YouTube and 1000+ other sites, then converts, trims, joins and burns them.
  It downloads in up to 8K, HDR and 60 fps, handles playlists, channels and subtitles, and can download only part of a video.
  The converter supports 40+ formats and device presets, cutting, cropping, rotating, watermarks, DVD and Blu-ray discs, photo slideshows, and audio tools such as vocal removal and noise reduction.
  On first start it downloads its engines (yt-dlp, Deno and, if needed, FFmpeg) from their official releases.
