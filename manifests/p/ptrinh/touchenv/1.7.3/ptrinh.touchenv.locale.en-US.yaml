ShortDescription: API keys and SSH keys behind Windows Hello, so no app, script or AI agent reads them without you.
Description: |-
  touchenv keeps secrets (API keys, tokens, SSH private keys) encrypted on this PC and asks Windows Hello for
  every read. "touchenv run NAME -- command" puts a secret in the environment of that one command; the prompt
  says who asks, which secret, why, and the command. It can also be the SSH agent for Windows' own OpenSSH,
  asking Windows Hello for every signature. The Windows build is a preview.
