Description: |-
  ลืมกดเปลี่ยนภาษาก่อนพิมพ์? คลุมข้อความแล้วกด Ctrl + Shift + Space เช่น "l;ylfu" จะกลายเป็น "สวัสดี" และ "เนนก" จะกลายเป็น "good"
  แก้ประโยคที่ผิดสลับกันได้ในครั้งเดียว สลับภาษาแป้นพิมพ์ให้อัตโนมัติ และคืนค่าคลิปบอร์ดเดิม
  เปลี่ยนคีย์ลัดได้ เปิดพร้อม Windows ได้ ไม่ต้องใช้สิทธิ์ Admin
