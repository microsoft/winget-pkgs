ReleaseNotes: |-
  - Fix sentences that mix both mistakes (Thai typed on the English layout and English typed on the Thai layout) in one go
  - Keep words that were already typed correctly when the selection includes them
  - Switch the keyboard layout to the language of the last word after converting
  - Silent upgrades keep the existing installer options
