ShortDescription: Fix text typed with the wrong keyboard layout (Thai ⇄ English) with one hotkey.
Description: |-
  GaeKai is a small tray app that fixes text typed with the wrong keyboard layout (Thai Kedmanee ⇄ US QWERTY).
  Select the text and press Ctrl + Shift + Space: "l;ylfu" becomes "สวัสดี" and "เนนก" becomes "good".
  Sentences that mix both mistakes are fixed in one go, the keyboard layout is switched for you, and your clipboard is restored afterwards.
  The hotkey is configurable and the app can start with Windows. No admin rights needed.
