ShortDescription: A music visualizer for Windows. A living orb that thumps on every beat, in a window or as your wallpaper.
Description: |-
  Pulsorb turns whatever is playing on your PC into a glowing dot orb that thumps on every beat and takes on the colour of each song's cover.
  It works with Spotify, YouTube, games and any app that plays sound, shows what's playing with controls, and can record 10-second vertical clips for TikTok, Reels and Shorts.
  An optional Spicetify integration syncs the orb to Spotify's own beat data.
