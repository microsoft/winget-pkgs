ShortDescription: One private memory for all your AI assistants, on your own computer.
Description: |-
  MindToo keeps what you and your AI assistants say to each other, on your own computer, and gives each assistant what it needs before it answers. Tell one of them something, and the others can find it. It works with Claude Code, Codex, Gemini CLI, Cursor, Windsurf and the Claude app.
  Your memory is one file in your own Windows user folder: there is no MindToo account and no MindToo cloud. Assistants can remember, correct and archive; only you can delete. Export everything at any time.
  Free for 14 days with everything working. A founding licence is GBP 29 once, with every 1.x update, on up to three of your own computers.
