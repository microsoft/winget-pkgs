ShortDescription: Terminal interface for FFmpeg
Description: |-
  fftui is a terminal interface for FFmpeg. Open media files, see what ffprobe reports about them, and run common tasks
  (convert, change container, compress to a size, extract audio, trim, resize, make a GIF, choose streams) from short
  forms that show the exact FFmpeg command. Jobs show progress and logs, can run in batches, and can use the hardware
  encoders your FFmpeg build has.
