ShortDescription: Free, portable local web server control panel for Windows.
Description: |-
  Ninho is a free, open source and portable control panel for local web development on Windows, an alternative to
  XAMPP, WampServer and Laragon. Start Apache, MySQL, MariaDB, PostgreSQL, PHP, Node.js, Mailpit and Redis from one
  small window, download the newest stable versions with one click, get automatic .test sites with HTTPS, and see
  every listening port. One exe, no installer, settings kept beside it.
