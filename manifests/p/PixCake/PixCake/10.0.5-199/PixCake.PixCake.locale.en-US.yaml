ReleaseNotes: |-
  1. 新增 AI 点修，点选、框选或扫选局部区域，智能推荐精修、调色及创意能力。
  2. 蛋糕会员可免费生成官方创意功能，高峰期需排队；AI 色彩免费导出不扣张数。
  3. 增加新款相机模拟（g7x2、g12 、克罗姆、富士 CC、富士黑白 R、柯达 5207）
  4. 调色性能优化，预览调色整体性能优化 12%，导出调色整体优化 25%
  5. 调色模块支持单个效果的显隐前后对比。
  6. 首页、精修与客户端界面全面焕新，新增功能导航，常用能力快速直达。
  7. 新增创成式填充，通过选区和文字描述修改或补充画面内容。
  8. 新增祛汗珠，智能识别人脸汗珠并支持程度调节。
  9. 新增衣服祛汗渍，智能淡化衣物汗渍，还原干净自然的衣物质感。
  10. 新增 AI 祛体毛，智能淡化手臂汗毛，同时保留真实皮肤纹理。
  11. 新增男性 AI 加腹肌，快速塑造自然腹肌轮廓。
  12. 新增闭眼修复，支持自动修复或上传睁眼参考图，减少合影废片。
  13. 新增 AI 瘦手臂，支持左右手臂分别调整，优化手臂比例与线条。
  14. 新增面部提拉，支持全脸及局部分区调整，使面部轮廓更紧致自然。
  15. 新增宠物美化，支持祛碎毛、亮眼、瞳色增强和眼神光。
  16. 新增裙子蓬松与裙摆平整，改善裙装塌陷、褶皱及边缘不顺。
  17. 新增鞋子去污，智能去除鞋面、鞋边和鞋底污渍，保留纹理细节。
  18. AI 追色新增局部追色，支持选择区域进行色彩匹配。
  19. 新增 AI 换天空，智能协调天空与地景光影，支持自定义素材及批量应用。
  20. AI 工具箱与创意模块全面升级，优化工具分类、推荐和操作路径。
  21. 新增黑白边缘修复，改善人物轮廓、发丝及服装边缘的黑白边。
  22. 优化衣服祛褶皱、AI 补草地、祛路人、AI 瘦肚子、自动曝光与白平衡及 AI 挑图效果。
  23. 新增儿童、胶片感推荐滤镜与分类，官方预设支持分类管理。
