ShortDescription: Pad launcher, recorder and tracker for radio and live shows.
Description: |-
  JingleBox2 fires jingles from a wall of pads, records and edits takes, and writes music in a tracker with its own synths, samplers and drum machines beside VST3 and CLAP plugins. A mixer with automation sits over all of it, and any MIDI controller can drive it by pointing at a control on screen and touching the hardware.

  It plays its audio through BASS, a proprietary library by Un4seen Developments that is free of charge for non-commercial use.
