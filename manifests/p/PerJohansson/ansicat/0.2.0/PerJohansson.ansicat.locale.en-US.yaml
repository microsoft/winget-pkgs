ShortDescription: A fast, read-only viewer for text art, Markdown, code and patches.
Description: |-
  ansi.cat shows NFO, ANSI, XBin and PETSCII art, Markdown with images, SVG images, text, source code, patches, terminal output and binary files.
  It does not change the files that it shows.
  The setup installs ansi.cat for the current user. ansi.cat becomes the default app for text art and PETSCII files, unless the user selected a different app in the settings of Windows.
