ShortDescription: "Protect AutoIt source from analysis and decompilation"
Description: |-
  AutoIt Obfuscator protects AutoIt script source code against analysis, reverse engineering, and decompilation. It uses several obfuscation techniques and polymorphic encryption. Obfuscation runs in the background, so the window stays responsive, and a progress bar is shown while a request is in progress. If the API cannot be reached, a network diagnostic window checks the website and the API endpoints and explains the most likely cause. If the HTTPS connection fails, the GUI and the command line retry the same request over HTTP. Optional SciTE editor integration adds an Obfuscate command to the Tools menu. A command-line build is included for Windows and for Linux with Mono. Licenses are sold as usage credits. The lowest personal pack is 50 credits for 5 USD. It requires .NET Framework v2.0 or v3.5 on Windows, or Mono for the Linux command line, plus an Internet connection.
  
  System requirements: .NET Framework v2.0 or Mono, 512 MB RAM, Internet connection
