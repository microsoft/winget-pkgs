ShortDescription: "PELock - exe-protector and advanced license key system"
Description: |-
  PELock - is an application that allows you to protect Windows executable files (so called exe-protector). Besides that, PELock allows easy creation of application of evaluation-demo type, hich use license key system. PELock features: compression of the application (code, imports, resources), it's possible to decrease executable size even 70% of original file, encryption of code (publicly available cryptographic algorithms and algorithms build polymorphic ally) , reorganization of basic PE EXE structures in order to assure better ratio during compression, deletion of unnecessary structures in executable file (relocations, debug info), protection against cracks and loaders, protection against debuggers (SoftICE, TRW, Turbo Debugger...), protection against code tracing, counteraction to dumping application memory with the tools like ProcDump, LordPE..., application integrity check, many anty-debug and anty-trace tricks, advanced import table protection (so called "api redirection"), application password protection, simple in use license key system, application password protection, API system which allows communication between application and license key system, creation and verification of registration keys using public keys encryption algorithms (RSA), ability to create trial keys and hardware dependent keys, keeping of the database and checkup of "stolen" (illegal) registration keys, ready to use samples of license key system in C/C++/Delphi, user-friendly interface, many option, which allow you the customize protection to your needs, entire thing written in assembler (win32asm), compatibility with all operating systems Windows 95/98/ME/NT/2K/XP/Vista/7/8
  
  System requirements: Pentium 200, 32 MB RAM
