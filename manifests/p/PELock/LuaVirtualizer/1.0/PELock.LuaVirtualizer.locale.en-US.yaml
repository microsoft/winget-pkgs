ShortDescription: "Virtualize and obfuscate Lua scripts with a VM or flattened flow"
Description: |-
  Lua Virtualizer virtualizes and obfuscates Lua scripts so the original logic is hard to follow. One mode runs at a time: a virtual machine, a finite-state machine (FSM), a weave tape, or flattened control flow. Virtualized functions are compiled to encrypted register bytecode and executed by a handler interpreter. The finite-state machine splits opcodes into states. The weave tape runs that bytecode on one mutable tape. Flattened flow turns dispatch into a schedule of numbered blocks. Opcode encoding and generated names vary with the seed, and the bytecode checksum is the integrity check. Dialect detection covers Lua 5.1, 5.2, 5.3, 5.4, 5.5, and Luau. LuaJIT is used only when selected. Decorators can mark a function or a region. Use the Windows GUI, the Windows or Linux command line, the online tool, or the Web API. The demo runs flat virtualization only and stops at 1000 bytes. A license raises the limit to 10 MB and unlocks the virtual machine, the finite-state machine, the weave tape, and the obfuscation passes, including string and numeric encryption, renaming, and integrity checks. A personal license is 149 USD and a company license is 499 USD, each for one year with unlimited virtualizations. It requires .NET Framework v2.0 or v3.5 on Windows, or Mono for the Linux command line, plus an Internet connection.
  
  System requirements: .NET Framework v2.0 or Mono, 512 MB RAM, Internet connection
