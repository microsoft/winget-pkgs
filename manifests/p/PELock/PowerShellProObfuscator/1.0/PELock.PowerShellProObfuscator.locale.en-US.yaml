Description: |-
  PowerShell Pro Obfuscator obfuscates, virtualizes, and protects PowerShell .ps1 scripts. Protection includes polymorphic string encryption, a VM engine, finite-state automata transforms, self-integrity checks, and anti-debugging checks. Use the Windows GUI, the Windows or Linux command line, the online tool, or the Web API. Licenses are sold as usage credits. The lowest personal pack is 50 credits for 5 USD. It requires .NET Framework v2.0 or v3.5 on Windows, or Mono for the Linux command line, plus an Internet connection.
  
  System requirements: .NET Framework v2.0 or Mono, 512 MB RAM, Internet connection
