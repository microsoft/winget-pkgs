ShortDescription: "Obfuscate Java source against reverse engineering"
Description: |-
  JObfuscator is a source code obfuscator for the Java language. It protects Java source code and algorithms from hacking, cracking, reverse engineering, decompilation, and technology theft. The Windows GUI and the Linux command line send source to the obfuscation service and save the protected result. Obfuscation runs in the background on Windows. Java files can be opened by drag and drop, and the command line accepts wildcards so many files can be processed at once. Use the Windows GUI, the command line, or the Web API. Licenses are sold as usage credits. The lowest personal pack is 50 credits for 9 USD. It requires .NET Framework v2.0 or v3.5 on Windows, or Mono for the Linux command line, plus an Internet connection.
  
  System requirements: .NET Framework v2.0 or Mono, 512 MB RAM, Internet connection
