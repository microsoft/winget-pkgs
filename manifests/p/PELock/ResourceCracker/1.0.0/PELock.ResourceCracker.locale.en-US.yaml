ShortDescription: "View and edit icons, dialogs, menus, and version info"
Description: |-
  Resource Cracker is a free Windows program for viewing and editing resources in executables and in standalone resource files. Open a file, pick a resource, and inspect it as a preview, a structured editor, or raw bytes. It opens PE32, PE64, NE (16-bit), .NET IL, ReadyToRun, Native AOT, C++/CLI, WinMD, netmodule, MUI, MUN, .res, and .rc files. Editors cover icons, cursors, bitmaps, dialogs, menus, string tables, accelerators, version information, and application manifests. You can add, replace, delete, rename, and change the language id of a resource, with copy, paste, undo, and redo. The first save of a session can keep a .bak copy of the original file. Export formats include PNG, BMP, JPEG, GIF, TIFF, WebP, .ico, .cur, and .rc. Command-line mode and script files support add, modify, delete, extract, changelanguage, and compile. The interface has System, Light, and Dark themes and is translated into English, Arabic, Bengali, German, Spanish, French, Hindi, Indonesian, Japanese, Marathi, Polish, Portuguese, Russian, Urdu, and Chinese (Simplified). It requires Windows 7 SP1 or later and .NET Framework 4.8.
  
  System requirements: Windows 7 SP1, .NET Framework 4.8, 512 MB RAM
