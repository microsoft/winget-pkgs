ShortDescription: "Obfuscate and virtualize Python scripts with encryption and checks"
Description: |-
  Python Obfuscator obfuscates, virtualizes, and protects Python .py scripts. Protection includes polymorphic string encryption, a VM engine, finite-state automata transforms, control-flow flattening, self-integrity checks, and anti-debugging checks. String literals are decrypted by helpers that change with the seed. Names of variables, parameters, and functions can be renamed, and calls can be routed through an indirect name table. A protection linker can insert decoy calls and stack tripwires tied to those helpers. An integrity probe poisons its keys if the script is patched. Use the Windows GUI, the Windows or Linux command line, the online tool, or the Web API. A personal license is 149 USD and a company license is 499 USD, each for one year with unlimited obfuscations. It requires .NET Framework v2.0 or v3.5 on Windows, or Mono for the Linux command line, plus an Internet connection.
  
  System requirements: .NET Framework v2.0 or Mono, 512 MB RAM, Internet connection
