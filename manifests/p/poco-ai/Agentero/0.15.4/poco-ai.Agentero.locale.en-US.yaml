ReleaseNotes: |-
  This release makes translation and chat easier to use while reading PDFs. Full-document translation shows cached results first, and selection tools now work in RSS, notes, and web pages. Paper imports can continue in the background, and you can delete individual Agent conversations from history.
  Features
  - Full-document translation cache: Overlay and side-by-side modes both show cached translations first and leave untranslated passages in the original language. In overlay mode, the partial translation control can fill in missing passages or retranslate the whole document. (#1035 by @ffy6511)
  - Shared selection actions: Translate, copy, or start a conversation from selected text in RSS, paper abstracts, Markdown notes, web pages, and other reading views. Add to Chat inserts the quote directly into the Agent composer. (#1037, direct quote insertion by @qychen2001 and @Phil-Fan)
  - Conversation history: Delete an individual conversation from history. If the agent has no delete endpoint, the conversation can still be removed from the local list. (commit by @qychen2001)
  - Custom translation parameters: OpenAI-compatible translation providers accept extra JSON parameters that override automatically selected sampling and reasoning settings. (commit by @qychen2001)
  - MCP binary writes: MCP file_write accepts Base64 for images and other binary attachments up to 2 MiB after decoding. (#993 by @Aschenbath)
  Improvements
  - Background imports: Magic Wand submissions go straight into the queue so you can add another batch. Track progress in Background Tasks at the bottom left, and pick a library folder before importing from Plaza. (#1027, folder picker by @fanrj3 and @Phil-Fan)
  - PDF Quick Chat: Drag the card by its title bar and keep its position while scrolling the PDF or expanding and restoring the card. Hide a draft with text and reopen it to continue writing. (card dragging, draft retention by @ffy6511)
  - PDF selection translation card: The card shows the full selection, grows with its content, and follows the source as the PDF scrolls or zooms. It is clipped at the edge of the reading area. (source anchoring, full source quote by @Phil-Fan)
  - First-time setup: Setup skips the Node.js step when Node.js and npm are already installed, defaults to free translation, and lets you choose how translations are displayed. (Node.js detection, translation setup by @Phil-Fan)
  Fixes
  - Highlights and annotations on translations: Highlighting and annotating selected translations works again. Selections that span sentences map back to the corresponding source text. (#987 by @ffy6511)
  - Markdown saves: Fixed an issue that inserted inline zero-width spaces into saved Markdown files. (#1016 by @ffy6511)
  - Update and CLI downloads: Startup update checks retry after a network timeout. App and CLI downloads start immediately and offer a link to network settings if a network error occurs. (#1003 by @qychen2001)
  Resolved Issues
  - PDF fit to width: The bottom toolbar has a fit-to-width button again, and the viewer adjusts zoom after the reading area is ready when opening a document. (#972 by @Phil-Fan)
  - Translator service migration: The desktop app uses the current official Translator endpoint, so an old URL saved in settings no longer affects lookups. (#926 by @Phil-Fan)
  Compare v0.15.3…v0.15.4
