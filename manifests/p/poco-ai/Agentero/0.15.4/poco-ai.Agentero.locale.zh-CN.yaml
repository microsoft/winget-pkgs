ReleaseNotes: |-
  这版让 PDF 阅读中的翻译和对话更连贯：全文翻译先显示已有译文，划词工具也延伸到 RSS、笔记和网页。入库可以在后台继续，Agent 历史支持删除单条会话。
  新功能
  - 全文翻译缓存：覆盖模式和双栏模式都会先显示缓存中的译文，未译段落保留原文。覆盖模式可从「部分译文」入口只补译缺失内容，或手动重新翻译全文。（#1035 by @ffy6511）
  - 通用划词动作：RSS、论文摘要、Markdown 笔记和网页等阅读界面可以从选区翻译、复制或发起对话。选择「加入对话」会直接把引用插入 Agent 输入框。（#1037、直接插入引用 by @qychen2001、@Phil-Fan）
  - 会话历史：可以从历史列表删除单条会话。即使 Agent 不提供删除接口，也可以把该会话从本机列表移除。（commit by @qychen2001）
  - 自定义翻译参数：OpenAI 兼容翻译服务可以通过额外 JSON 参数覆盖自动选择的采样和思考设置。（commit by @qychen2001）
  - MCP 二进制写入：MCP 的 file_write 支持 Base64，可保存图片和其他二进制附件，解码后最大 2 MiB。（#993 by @Aschenbath）
  改进
  - 后台入库：魔棒提交后立即入队，可以继续添加下一批论文；进度可在左下角的后台任务面板查看。广场入库前可以选择论文库中的目标文件夹。（#1027、文件夹选择 by @fanrj3、@Phil-Fan）
  - PDF 快速对话：可以拖动标题栏移动卡片，滚动 PDF 或放大、还原卡片时保留拖动后的位置。收起已输入内容的草稿后，重新打开可以继续编辑。（拖动卡片、保留草稿 by @ffy6511）
  - PDF 划词译文卡：卡片显示完整选区，随内容增高，并跟随原文滚动或缩放。滚出阅读区时，卡片会在阅读区边缘裁剪。（跟随原文、完整原文 by @Phil-Fan）
  - 首次设置：已安装 Node.js 和 npm 时会跳过对应步骤；翻译默认使用免费引擎，并可在引导中选择译文显示方式。（Node.js 检测、翻译设置 by @Phil-Fan）
  修复
  - 译文高亮与批注：恢复译文选区上的高亮和批注操作。跨句选区映射回原文时，标记会落在对应文字上。（#987 by @ffy6511）
  - Markdown 保存：修复编辑器保存文件时写入行内零宽空格的问题。（#1016 by @ffy6511）
  - 更新与 CLI 下载：启动时检查更新遇到网络超时会重试。应用和 CLI 会直接尝试下载，遇到网络错误时再提供打开网络设置的入口。（#1003 by @qychen2001）
  已解决问题
  - PDF 适应宽度：底部工具栏恢复适应宽度按钮，打开文档时也会在阅读区就绪后校正缩放。（#972 by @Phil-Fan）
  - Translator 服务迁移：桌面端统一使用当前官方服务地址，已有设置中的旧地址不再影响查询。（#926 by @Phil-Fan）
