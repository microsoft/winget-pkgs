ReleaseNotes: |-
  This release focuses on reading and translation: built-in offline dictionaries and automatic terminology, Zotero highlight import, copying rendered formulas as LaTeX, and new Windows ARM64 builds, along with fixes across PDF translation, MCP resource discovery, and workspace splits.
  Features
  - Offline dictionary and automatic terminology: Bundles pinned ECDICT and AI glossaries for configuration-free selection lookup, applies terminology constraints across LLM and MT channels, and adds dictionary mode, cache, and settings controls. (#1041, #1112 · 102d1a4 by @JiaheChen2002)
  - Zotero highlight import: Highlights and underlines from Zotero migration and sync now land in annotations.json and render on the page, while child notes stay in NOTES.md. (#986 · a178ab0 by @JiaheChen2002)
  - Copy rendered formulas as LaTeX: Clicking a formula in read-only notes, embeds, or Agent replies copies raw TeX without delimiters; Agent tables and fullscreen formulas expose the same action from the context menu, and Markdown table export preserves LaTeX. (#1100 · PR #1109 by @Aschenbath)
  - Windows ARM64: Adds a native Windows ARM64 desktop installer and CLI archive, with the in-app CLI installer resolving the matching host triple. (#1134 · 4dea62c by @qychen2001)
  - Translation progress: PDF views show per-page and per-paragraph translation status while keeping source text selectable and copyable. (#1128 · 933267b by @ffy6511)
  - DOI links: Papers identified only by DOI show a doi.org link and a copyable DOI instead of only an arXiv entry. (6a2540c by @Phil-Fan)
  - Hosted capabilities: The account pane lists hosted capabilities and keeps them behind the account flag. (87a45fc by @qychen2001)
  Improvements
  - Workspace splits: ⌘\ toggles between PDF and NOTES; every PDF pane keeps its own breadcrumb; splitting exits maximize and drops stale layout state, writing projects stay in the normal dock, and splits stay scoped to papers and TeX projects without resetting column widths. (#1125 · 73f36b5 by @Phil-Fan)
  - Windows paths: Notes and vault paths now normalize separators and canonical roots at join, file IO, and client boundaries, fixing os error 123 from mixed separators. (#1131 · 2fb6c6e by @JiaheChen2002)
  - Terminal detection: Adds Ghostty, shares one terminal preset list between Settings and the system-default fallback, and makes Agent buttons honor the terminal preference. (#1116 · a7d94b7 by @Phil-Fan)
  - Local plugin system removed: Removes the plugin host, settings pane, events, and persistence; existing plugins.json files are ignored. (5a2d3d4 by @qychen2001)
  Fixes
  - PDF translation stability: Terminology updates no longer invalidate saved full-document translations, and translation batches, IR backfills, and progress page numbers follow page and reading order. (#1137, #1126 · e1c07e6 by @ffy6511)
  - PDF translation layout: Preserves table-of-contents rows, anchors inline and tall-delimiter formulas correctly, caps preview bitmap memory, and rejects reflow caches with duplicate character ownership. (c739961, 20834d7 by @ffy6511)
  - Table source redaction: Updates the PDFium WASM to fix multi-region redaction, so regenerated translations no longer ghost English text under table cells. (#1127 · de62eb9 by @Phil-Fan)
  - MCP resource discovery: Adds the SEP-2549 ttlMs/cacheScope fields to resources/list and resources/read and stops repeating icon data for every resource. (#1130, #1139 · 852e23c by @Phil-Fan)
  - AppImage agents: Clears the AppImage loader variables inherited by ACP child processes, fixing Node-based agent startup. (#1115 · 19ef0a4 by @Phil-Fan)
  - Writing diagnostics: Hidden row actions no longer receive clicks, and the compile-problem action uses the add-to-chat icon and only appears on hover or focus. (897907d, a8e645c by @qychen2001)
  - Agent runtime discovery: Finds Windows desktop Codex and standalone runtimes correctly, and onboarding no longer installs Node separately. (b863165 by @JiaheChen2002)
  Full compare
