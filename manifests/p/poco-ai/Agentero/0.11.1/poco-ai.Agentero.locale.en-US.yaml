ReleaseNotes: |-
  This release centers on a major upgrade of the LaTeX editing experience: a new LaTeX language engine brings syntax-tree-accurate highlighting, completion and folding, stacked with live linting, chktex rules and an IDE-style diagnostics footer, while compilation is now controlled entirely by manual triggers. It also adds a WebDAV cloud sync backend and a ZCode agent template, lets you ask the Agent straight from a text selection, and fixes several paper import stability issues plus the flood of macOS permission prompts when first running an agent.
  Features
  - WebDAV cloud sync: Cloud sync gains a WebDAV backend alongside S3-compatible object storage, so Nutstore, Nextcloud or NAS accounts work out of the box, with the sync method selectable per vault in Settings; the sync protocol and conflict merging stay unchanged and existing configs keep working. (#567 by @qychen2001)
  - ZCode agent template: The agent catalog adds a ZCode template via the zcode-acp-server adapter, reusing catalog scanning, install onboarding and settings, with session resume and image input. (#572 by @ForeverHYX)
  - LaTeX editor engine upgrade: The legacy stex mode is replaced by codemirror-lang-latex (built on Overleaf's Lezer grammar), bringing accurate tree-based highlighting, environment auto-close and indent, preamble/section folding, and full command, environment and math-symbol completion. (commit by @Phil-Fan)
  - Live LaTeX linting: Unclosed environments and braces, duplicate labels and missing references show squiggles while typing, and hovering a command shows its documentation; chktex's typographic rules stack on top of the built-in linter (silently degrading when absent); an IDE-style lint footer under the editor counts diagnostics per severity and reveals a clickable problem list on hover. (commit, commit, commit by @Phil-Fan)
  - Ask the Agent from a selection: Selecting text in the text/code editor arms a Quick chat / Add to chat toolbar; selections pin into the Agent context (Cmd+L), and context chips and prompts carry the line span (e.g. "main.tex lines 75-77") so the agent can reference line numbers directly. (commit, commit by @Phil-Fan)
  - Editor font size toolbar: The text editor gains a font size toolbar with +/- buttons and a 12–20px dropdown, persisted per install and synced across tabs. (#568 by @byy-yby)
  - papers/ library entry: The file tree now recognizes and renders the papers/ folder as the library entry, tying the tree to the paper library view. (commit by @Phil-Fan)
  Improvements
  - Manual TeX compile control: Autosave writes to disk without triggering latexmk; compilation happens only on Cmd/Ctrl+S, the compile button or Cmd+, and every manual trigger forces a full latexmk run so retrying after a fixed error no longer replays the stale error summary; the compile menu gains a "clean intermediates" action to reset the latexmk fingerprint database. (commit, commit, commit by @Phil-Fan)
  - Vault starter layout: New vault scaffolds seed a data/ directory and a thesis/main.tex starter file. (commit by @Phil-Fan)
  Fixes
  - Paper import pipeline: Standalone PDF imports now validate the file bytes and actively close the metadata recognition loop, and fallback titles strip the .pdf suffix so .pdf.pdf nested files no longer appear; parse, citation and layout jobs are deferred while recognition renames the folder, removing the path race; NOTES.md H1 and aliases sync automatically after recognition or title edits without clobbering existing notes. (#578 by @bet4it)
  - macOS agent permission prompts: Local ACP agents now spawn with the vault as the process working directory, so the first agent run no longer walks down from / and triggers a cascade of TCC prompts for Music, Desktop, iCloud and more; the fallback directory is strictly scoped to a dedicated scratch directory. (#573 by @HuangYincan)
  - PDF zoom drift: Pages stay horizontally centered after Ctrl/Cmd + wheel zoom instead of drifting progressively left, the vertical reading position is preserved, and the behavior is stable even with the Agent sidebar squeezing the viewer width. (#565 by @longP-666)
  Resolved Issues
  - LaTeX file path completion: File path arguments of \input, \include, \includegraphics, \bibliography and similar commands now complete against the vault, offering directories first and drilling level by level, for both local and remote vaults. (#577, commit by @Phil-Fan)
  Full Changelog: https://github.com/poco-ai/Agentero/compare/v0.11.0...v0.11.1
