ReleaseNotes: |-
  本次补丁版本聚焦阅读与编辑体验：长 Markdown 笔记的编辑性能显著提升，ACS 论文的图表、公式与文内引用悬停预览完整可用，PDF 顶部工具栏改为阅读时自动隐藏；同时新增论文笔记自动打开开关与 MinerU 语言 / 强制 OCR 选项，并修复重复入库、标签页标题恢复、Windows 下 arXiv HTML 视图与安装包 CLI 占位文件等问题。
  新功能
  - 论文笔记自动打开开关：设置 → 通用 新增「打开论文时自动打开笔记」选项（默认开启）。关闭后打开论文只显示 PDF/HTML 正文，笔记仍可通过 ⌘\ 或文件树「打开笔记」随时唤出。（#409，c33272a0 by @Phil-Fan）
  - MinerU 语言与强制 OCR 选项：MinerU 服务商卡片新增「高级」折叠区，可指定识别语言（中英文 / 纯英文）并强制整页 OCR；两个选项同时作用于版面分析与 PAPER.md 正文解析，改善非中文论文的解析质量。（#402，4dbcc411 by @qychen2001）
  改进
  - 长笔记编辑性能：目录大纲只重扫描被编辑的块，块手柄菜单改为悬停时才挂载，全局拖拽状态不再触发所有块重渲染，块间距改为缓存读取——长文档的输入、悬停与拖拽开销显著下降。（b89c68bb / 31463c0a / 1bb9efb3 / 653bbe19 by @Phil-Fan）
  - 新手引导文案：逐句重写引导向导的标题与选项文案为直白表述，并在每个步骤标题下新增一句说明，降低「版面解析」「自有 API」等术语的理解门槛。（91a540b7 by @Phil-Fan）
  - PDF 顶部工具栏自动隐藏：阅读时两组悬浮工具栏自动淡出，滚动或指针靠近顶部时重新出现；打开面板、查找栏、框选或缩放输入框聚焦时保持固定。（#400，b84d52b9 by @Phil-Fan）
  - Windows CLI 安装体验：设置 → 关于 中的 CLI 安装 / 卸载失败提示改为展示真实错误原因并完成本地化；安装成功后给出可复制的验证命令，下载 404 时附带完整资产地址，方便自查架构与版本是否匹配。（4149a80e by @JiaheChen2002）
  - 标签栏与内容分界：工作区标签栏与下方内容之间新增分割线，避免同色系贴边。（#408，242d5c65 by @Phil-Fan）
  修复
  - 图表 / 公式悬停预览（ACS）: 修复 ACS 出版方 PDF 中 Figure / Table / Equation 悬停预览无法解析的问题：整页 /FitR 跳转目标冲突现按链接矩形与链接文本（Figure 1 / Table 1）消歧，并补充 /FitH 纵向锚点与无标题公式的顺序回退。（#407，61297c9e，1b22eb3a by @Phil-Fan）
  - 文内引用悬停（ACS）: 修复 ACS 文献引用上标悬停不弹出预览的问题；14-18 形式的区间引用现在会展开列出 14…18 全部条目，预览卡片支持多条叠放，逗号分隔的相邻引用保持原样。（ac988f5e / f9f61f7c by @Phil-Fan）
  - 分割线处回车：修复在分割线（hr）上按 Enter 无法在下方换行的问题，现在会在分割线下方插入新段落；同时收窄分割线的选择高亮，不再显示为高瘦空框。（#397，3a3c9e31 by @Phil-Fan）
  - 标题间距：H1–H3 / H4–H6 的上间距改为固定档位，不再随标题字号放大，修复大标题与分割线叠加产生的过大空白。（#397，c5825c9f by @Phil-Fan）
  - 目录侧栏：折叠态目录不再冒出悬停滚动条，行距与标记宽度收窄，观感更接近 Notion 的胶囊样式。（#395，1ef180f5 by @Phil-Fan）
  - Agent 会话回放：重新打开 Claude Code 会话时，不再把「No response requested.」这类合成占位消息显示为 Agent 的回复；混合内容的轮次保留真实部分。（#411，c298eb21 by @Phil-Fan）
  - 入库去重：本地 PDF 识别出的 DOI / arXiv / PMID / ISBN 命中目录已有条目时改为合并：原条目没有主 PDF 时补为正文，否则归入附件，不再重复创建条目；标识符入库也会在提交前交叉检查全部标识符列。（#406，e212940b by @Phil-Fan）
  - Windows arXiv HTML 视图：修复 Windows 下切换 arXiv HTML 视图报 ERR_CONNECTION_REFUSED 的问题（WebView2 下自定义协议源应为 http 而非 https）。（#412，e0a4ea4a by @Phil-Fan）
  - 标签页标题恢复：修复重启恢复工作区后，未激活的标签页只显示文件夹名、点进去才显示论文名的问题；恢复时直接使用持久化的标题。（#410，618a63b2 by @Phil-Fan）
  - 期刊名称补全：期刊 / 会议名优先采用 Semantic Scholar 的 publicationVenue（Crossref 会截断 ACL/NAACL 等名称，arXiv 常缺失），修复期刊标签获取不全。（#399，6a0fedea by @Phil-Fan）
  - 新手引导每次启动重弹：修复引导完成标记未被 Host 保存、每次启动应用都重新弹出新手引导与功能导览的问题。（#398，00557972 by @Phil-Fan）
  - Windows 安装包 CLI 占位文件：修复全新安装的 Windows 上弹出「不支持的 16 位应用程序」系统对话框的问题——安装包曾附带伪装的 agentero-cli.exe 占位脚本。安装包不再捆绑任何 CLI 文件，可在 设置 → 关于 中下载安装同版本 CLI。（9dee13f0 by @JiaheChen2002）
  已解决问题
  - 新手用户引导（#369）: 新手引导已在 v0.9.0 上线；本版本完成面向新手的文案重写与引导状态持久化修复后，该 Issue 关闭。
