ReleaseNotes: |-
  This release adds PDF annotation display options and private reading-record imports from AlphaXiv. It also fixes highlights and citation links in side-by-side reading.
  Features
  - PDF annotations: New annotation editors open beside the selection. Notes appear in cards on the right by default, and Appearance settings let you switch to page-margin icons for hover previews and click-to-edit. (0f45d1f1 by @ffy6511)
  - Sentence hover highlighting: Turn it off in Appearance settings to select a word on double-click and use a lighter tint for drag selection. (#1239 by @ffy6511)
  - Private AlphaXiv annotations and notes: Import private reading records for new or existing papers into a local desktop vault. Highlights that can be placed appear in the PDF, and other excerpts and standalone notes go into NOTES.md. (#1236 by @ffy6511)
  Improvements
  - Folder-scoped library imports: Right-click empty space in the library to import new papers from AlphaXiv or Zotero into the current folder, or run Zotero sync to update existing entries. (#1241 by @ffy6511)
  Fixes
  - Highlights in side-by-side reading: Source highlights mark the corresponding translated sentence. The toolbar for saved highlights stays clear of the marked text. (#1238 by @ffy6511)
  - Links and citations in translated PDFs: Hover and click work again, and numbered citations retain their original square brackets. The first time you open an existing translation after upgrading, the app rebuilds its PDF from cached translations. (#1237 by @ffy6511)
  - Zotero citation keys: Migration preserves native citation keys and reads pinned Better BibTeX keys from the Extra field in older Zotero libraries. (#1231 by @JiaheChen2002)
  - Degraded WebDAV sync: Devices with degraded sync enabled can sync with WebDAV servers that lack strong ETags. (724d87b0 by @qychen2001)
  - Backup mirrors: A mirror stops before uploading files when the remote index lacks the strong ETag needed to update it. (8585bf4e by @qychen2001)
  - Built-in agent diagnostics: Doctor reports the correct availability of the built-in Zhihu agent and clears stale probe failures. (#1233 by @Phil-Fan)
  - Pi project trust: For vaults under the user's home directory, Pi's project trust check stops at that directory. (5789acd7 by @JiaheChen2002)
