ReleaseNotes: |-
  这次更新增加了 PDF 批注的显示选项和 AlphaXiv 私人阅读记录导入，修复了对照阅读中的高亮和引用链接问题。
  新功能
  - PDF 批注：新批注的编辑框会在选区旁打开。批注默认显示为右侧卡片，也可在外观设置中改为页边图标，悬停预览，点击编辑。（0f45d1f1 by @ffy6511）
  - 句子悬停高亮：可在外观设置中关闭。关闭后，双击选中单词，拖选底色也会变浅。（#1239 by @ffy6511）
  - AlphaXiv 私人批注和笔记：桌面端的本地知识库可导入新论文和已入库论文的私人阅读记录。能定位的高亮落在 PDF 上，其余摘录和独立笔记存入 NOTES.md。（#1236 by @ffy6511）
  改进
  - 按文件夹导入论文：右键点击论文库空白处，可从 AlphaXiv 或 Zotero 导入新论文到当前文件夹，也可启动 Zotero 同步以更新已有条目。（#1241 by @ffy6511）
  修复
  - 对照阅读的高亮：原文高亮会标到对应译句。已保存高亮的工具栏会避开被标注文字。（#1238 by @ffy6511）
  - 译文引用和链接：恢复悬停和点击，编号引文保留原文方括号。升级后首次打开已有译文时，应用会用缓存译文重新生成 PDF。（#1237 by @ffy6511）
  - Zotero 引用键：迁移会保留原生引用键，并读取旧版 Zotero 的 Extra 字段中固定的 Better BibTeX 引用键。（#1231 by @JiaheChen2002）
  - WebDAV 降级同步：服务器缺少强 ETag 时，已开启降级同步的设备可以继续同步。（724d87b0 by @qychen2001）
  - 备份镜像：远端索引缺少更新所需的强 ETag 时，镜像会在上传文件前停止。（8585bf4e by @qychen2001）
  - 内建 Agent 诊断：问题诊断会正确报告内建知乎 Agent 的可用状态，并清除之前误记的探测失败。（#1233 by @Phil-Fan）
  - Pi 项目授权：知识库位于用户主目录下时，Pi 的项目授权检查会在主目录停止。（5789acd7 by @JiaheChen2002）
