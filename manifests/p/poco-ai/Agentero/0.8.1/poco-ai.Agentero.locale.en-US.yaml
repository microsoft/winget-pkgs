ReleaseNotes: |-
  v0.8.1 is a small patch release focused on stability and usability. It fixes Windows system-proxy fallback, MinerU cloud layout-analysis result parsing, and removes a dead annotation button from the PDF toolbar, plus two minor improvements for the Settings About pane and Agent history titles.
  Features
  - Open log folder from Settings About: Adds an "Open log folder" action in Settings → About, letting users locate the app log directory in the system file manager for easier troubleshooting and bug reports. (78b0084e by @qychen2001)
  - Live Agent session title sync: Forwards ACP session_info_update notifications as agent:session-info events so agent-pushed session titles update matching history rows by runtime id or providerSessionId, without overriding visual-trace titles. (bf6ac1f5 by @qychen2001)
  Fixes
  - MinerU cloud layout.json result parsing: Accepts the layout.json naming (no task-id prefix) used by MinerU Cloud v4 result ZIPs, fixing layout-analysis failures caused by the missing *middle.json entry, and adds regression tests for both naming conventions. (954bf4c5 by @qychen2001)
  - Remove dead annotations button from PDF toolbar: After the right-sidebar Annotations tab was removed in v0.8.0, the PDF toolbar button still targeted the missing panel and fell back to the Agent panel. The button and the entire onOpenAnnotations prop chain are now removed, closing #381. (4250b27b by @Phil-Fan)
  - Windows system proxy fallback: When the in-app proxy is off, Host requests now detect the Windows system proxy from the registry (supporting http= / https= / socks= forms) and use it as a fallback, fixing in-app pages such as Plaza and Feeds behind Clash/V2RayN-style "system proxy" modes. The General settings pane shows "system proxy detected" while the switch is off, closing #376. (b439b31c by @JiaheChen2002 and @qychen2001)
  Full changelog
