ReleaseNotes: |-
  0.12.0 把论文从单篇笔记扩展成可展开的多文档工作区：文件树显示论文根目录的额外笔记与 HTML，阅读布局可以最大化当前面板并固定左右两栏，侧栏宽度和主窗口状态也会跨重启保留。同步能力同时补齐了 Git 全库后端与无桌面环境的 agentero sync，并带来自建 MinerU，以及缩放性能、PDF 注释和 Agent 安装方面的改进与修复。
  新功能
  - 自建 MinerU: 设置中新增「自建 API」开关，默认仍走官方云；打开后自动识别 MinerU 4.0+ V1 与 3.x /tasks，支持局域网 http 与 Bearer 鉴权，版面分析和 PAPER.md 正文解析都走自建服务。（#763 by @exciton00）
  - Git 全库同步：设置 → 同步新增 Git 后端，Vault 根目录直接作为 work tree，可配置仓库地址和分支（默认 main），支持 GitHub / GitLab / 自建 Git / 本地裸仓库；使用系统 Git 凭据或 SSH，支持手动与自动同步，冲突时走 Git 原生三方合并并中止，不自动解决。（93ba55b9 by @qychen2001）
  改进
  - 缩放与长笔记性能：拖动面板分隔条、左右 rail 或缩放窗口时，编辑器不再逐帧重跑容器查询，PDF 视口指标与 Markdown 重排共用同一个手势信号；TOC 观察器改为长生命周期，数学公式只渲染视口附近并保留占位尺寸。复现用例中的文档 DOM 节点从 202,986 降到 13,424。（#777 by @Fengsuid）
  修复
  - 长笔记静默截断：正文含 LaTeX 大括号或 $\rho<1$ 等 MDX 易误判内容时，编辑器不再只渲染前一部分并丢弃后续内容；MDX 解析失败会回退为完整正文，状态栏字数也计入公式文本。（#777 by @Fengsuid）
  - PDF 注释删除与译文命中：删除高亮后立即持久化，删除请求不会再因提交锁被丢弃；已删除注解不再参与渲染、命中测试和编辑。全文翻译盖住原文时，点击译文中的高亮仍能打开注解菜单。（a745a446 by @qychen2001）
  - 启动后侧栏宽度：macOS 启动时窗口恢复或最大化完成后会重新应用侧栏比例，Agent 栏不再以窄宽度启动。（88283547 by @Phil-Fan）
  - Windows 触控板捏合缩放：Windows 精准触控板可以双指捏合缩放 PDF，无需按住 Ctrl；论文之外的捏合不会连带放大整个应用窗口。（dc3ea261 by @JiaheChen2002）
  已解决问题
  - 论文多文档：论文根目录有多个 .md / .html / .htm 文档时，文件树会列出额外笔记和快照，PAPER.md 不再作为重复子项；论文行右键可直接新建文件，阅读布局打开另一条笔记时复用现有 NOTES 面板，切换论文或笔记时文件树不再短暂空白。（#738 by @Phil-Fan）
  - 左论文右笔记布局：工作区恰好为左右两栏时，新打开的论文正文固定进入左栏、其 NOTES 固定进入右栏，不再跟随当前焦点；其他布局仍保持自由放置。（#749, #785 by @Phil-Fan）
  - 阅读布局：阅读模式会收起两侧栏并最大化当前面板，多标签或多栏工作区同样生效；再次切换可恢复之前的预设或自定义侧栏。（#764 by @Phil-Fan）
  - 侧栏折叠动画：折叠和展开改为一次性提交最终布局，不再用 200ms 动画逐帧重排，PDF fit-width 不会在折叠时来回缩放。（#757 by @Phil-Fan）
  - Agent 栏与窗口状态：Agent 栏宽度在布局预设和重启后保持一致，旧版按槽位保存的宽度会自动迁移；主窗口的尺寸、位置和最大化状态也会恢复。（#782 by @qychen2001）
  - 文件重命名：文件树按 Enter 直接进入重命名；把文件重命名为无扩展名时转换为同名文件夹，并把原文件保留原后缀移入其中。（#759 by @Phil-Fan）
  - Markdown 大纲标记：折叠大纲的标题标记固定在侧栏右缘，悬停展开时不再随标签缩进而移动。（#758 by @Phil-Fan）
  - Zotero 入口：Zotero 迁移与同步操作移入 Vault 切换器，更容易找到。（#750 by @Phil-Fan）
  - 论文代码仓库：论文元信息新增可手动维护的代码仓库链接，Paper Info 会显示 GitHub 徽标，并可在编辑元数据对话框中修改。（#753 by @qychen2001）
  - 回收站标题：回收站列表直接显示论文标题，不再只显示标识。（#754 by @qychen2001）
  - CLI 云同步：新增 agentero sync（S3/R2、WebDAV）供无桌面环境使用，与桌面端共用同一同步引擎和配置，支持 status / configure / test / now / disconnect；同一 Vault 的桌面端、CLI 与 cron 通过跨进程锁串行，忙时快速返回 sync_busy。（#778 by @qychen2001）
  - ACP 会话加载超时：历史会话加载使用独立的 60 秒预算，不再受交互请求 15 秒超时限制，Pi 等长会话恢复不再频繁超时。（#779 by @JiaheChen2002）
  - Agent 安装权限：Unix 上 Codex 及其他 Agent CLI 的 npm 安装、回退与卸载统一写入 ~/.local 前缀，避免官方 Node 安装下 /usr/local 只读导致的 EPERM；Windows 保持全局安装。（#791 by @Phil-Fan）
  - Windows Skill 导入控制台：Windows 安装推荐 Skill 时，gh 请求不再反复弹出命令行窗口。（#741 by @qychen2001）
  - 第三方开源声明：补充第三方开源组件的使用情况披露。（#736 by @Phil-Fan）
  已知限制
  - Git 同步为全量镜像：v1 尚未接入 Git LFS，也没有按论文按需拉取，PDF 与 TeX 会永久留在 Git 历史中，仓库体积由用户自行承担。（93ba55b9 by @qychen2001）
