ReleaseNotes: |-
  本次发布带来标题栏布局预设，可一键在 Agent、笔记、阅读三种工作区布局间切换；Plaza 来源管理移至文件树根节点菜单；Agent 安装过程支持随时取消。此外包含大量体验打磨：PDF 暗色模式配色柔化、紧凑输入框直接切换、视觉批注对话内嵌展示、面板分隔线与侧栏细节优化，以及跨页选区工具栏、数字前缀自然排序等多项修复。
  新功能
  - 布局预设：标题栏新增布局菜单，一键在 Agent、笔记、阅读三种工作区布局间切换，悬停即可打开。（ac7d2220、9ba0e6af、#447 by @Phil-Fan）
  - Plaza 来源开关：移除 Plaza 概览页，arXiv Daily / RSS 等来源改为在文件树根节点的右键菜单中直接开关。（dd33791c by @Phil-Fan）
  - 取消 Agent 安装：设置页与新手引导中的 Agent 安装/更新进度现在可以随时取消。（eaae98e2、#446 by @qychen2001）
  改进
  - PDF 暗色模式：降低反色与对比度，页面呈现柔和的深灰、文字不再刺眼。（a6085b6d、c42e4b19、#450 by @Phil-Fan）
  - 紧凑输入框：输入框高度低于阈值时直接切换为单行紧凑形态，不再平滑过渡；上下文 chips 单行排列不再遮挡输入区，配置条过长标签以省略号截断。（16576b59、68e23cfe、886c2858、994ce71d、#449 by @Phil-Fan）
  - 视觉批注对话：视觉批注绑定的 Agent 对话直接内嵌在右侧批注卡片中，默认截断、悬停展开；仅含对话的批注不再生成空卡片，改由装订线 pin 打开对话。（144a718c、68bf8a6a、4c99ba1c、#451 by @Phil-Fan）
  - 面板分隔线：工作区分隔条默认仅显示 1px 细线，悬停与拖拽时呈现半透明高亮。（3147c48f、3bccb7e3 by @Phil-Fan）
  - 侧栏细节：移除侧栏 header 分隔阴影；文件树图标槽位对齐；滚动条出现或消失时行布局不再跳动；论文行操作按钮与行右缘对齐。（ff3a8ca9、7eab618a、2442010a、47c8e679 by @Phil-Fan）
  - Library 表格：移除行分隔线；年份、期刊与标签列不再支持点击复制，避免误触。（e0b5ea17、7753d330 by @Phil-Fan）
  - 自定义 ACP Agent: 自定义 Agent 现在可以编辑；相对路径参数统一在 Vault 目录下解析；修复 Pi（pi-acp 适配器）不遵守会话 cwd 导致在系统目录下查找论文的问题。（719bfa1d、67e09083、bf22fefd、#441 by @Phil-Fan）
  - 窗口最小宽度：主窗口新增最小宽度限制，避免过度压缩导致布局错乱。（c8fe07ca by @Phil-Fan）
  修复
  - 数字前缀自然排序：文件树中数字开头的前缀按数值排序（如 “2” 排在 “10” 之前）。（a753db3e、#445 by @Phil-Fan）
  - 跨页选区工具栏：跨页选择文本时，工具栏锚定到光标结束页并限制在可视范围内，不再滚出视野。（0c94376c、#444 by @Phil-Fan）
  - 窄面板换页控件：小宽度面板下 PDF 换页控件自适应布局。（9dccca02、#448 by @Phil-Fan）
  - ACP 历史恢复：恢复历史会话时保留视觉批注与图片上下文，不再丢失裁切 chips。（8ad15643 by @Phil-Fan）
  - Zotero 迁移提示：zotero.sqlite 缺失时的错误信息已本地化，并提示选择上级目录。（fbfa9283 by @qychen2001）
  - Plaza 推荐卡片：arXiv 推荐卡片的标题与摘要过长时截断显示，避免溢出。（0baa64aa by @Phil-Fan）
