ReleaseNotes: |-
  This release is about writing and reading inside Agentero: in-place .tex compilation with PDF preview, lightweight viewers for plain text, PDFs and Excalidraw, selection tools for web papers, plus noticeably faster Agent connections and a smoother LaTeX experience.
  Features
  - In-place TeX compilation: Every .tex file gets a Compile button with a PDFLaTeX / XeLaTeX / LuaLaTeX engine picker (latexmk orchestrates dependencies and reruns), and the result opens as a PDF split beside the editor. (#561 by @byy-yby)
  - Background compile jobs: Compiles run as background jobs with live latexmk phase/progress and cancel in the tasks panel; saving a .tex recompiles automatically and refreshes the open PDF pane as soon as it lands. (commit by @Phil-Fan)
  - Plain-text editor: Files outside papers/ (txt/tex/bib/json/yaml/python, unknown extensions) now open in a CodeMirror 6 editor with per-extension highlighting, TeX/BibTeX completions, autosave and external-change reload. (commit by @Phil-Fan)
  - Excalidraw whiteboard: .excalidraw files open as an editable canvas that follows the app theme, with autosave and in-place external-change reload. (commit by @Phil-Fan)
  - Plain PDF reading mode: PDFs outside papers/ (such as build outputs) skip the paper pipeline — layout analysis, annotations and translation are gated off while paging, zoom, search, outline and text selection stay. (commit by @Phil-Fan)
  - Web paper selection tools: Web papers stream through the allowlisted agentero-web proxy, so you can copy on select, translate, and use ⌘K quick chat or ⌘L add-to-chat on the page. (commit · commit by @Phil-Fan)
  - Automatic conference PDF URLs: Adds deterministic PDF URL derivation for USENIX plus NeurIPS / CVF / ECVA / IJCAI / PMLR, so the body PDF is downloaded even when the landing page exposes no attachment. (#526 by @bet4it · commit by @Phil-Fan)
  - Agent connection reuse: ACP connections warmed up when Chat opens are kept resident instead of cold-starting each turn; before the first token the UI shows starting / waiting-model / reconnecting phases. (commit by @Phil-Fan)
  - CLI login guidance: On auth failure you can run the agent template's own login command in a confirm-to-run terminal, with the same entry in settings and Doctor. (commit by @Phil-Fan)
  - One-click Node.js install: Doctor's host runtime section offers an install button when Node.js/npm are missing (winget on Windows, Homebrew on macOS) and re-probes afterwards. (commit by @qychen2001)
  - Bundled Skills: Adds a research paper writing skill and an academic drawing skill, and auto-discovers skills bundled with the app. (commit · commit by @Phil-Fan)
  - Plaza PPT skill recommendations: Plaza now recommends PPT-related skills. (commit by @Phil-Fan)
  - ⌥A full-text translation: The toolbar Languages button is bound to ⌥A (matched by physical key on macOS) and works in dual-pane translation. (commit by @Phil-Fan)
  - Onboarding network proxy: The first-run onboarding gains a network proxy setup step. (commit by @Phil-Fan)
  Improvements
  - Tab context menu: The tab context menu now shows the close-tab shortcut. (commit by @Phil-Fan)
  - Windows Agent robustness: Better command discovery on Windows and clearer guidance when npm cache operations fail. (commit · commit by @JiaheChen2002)
  - Translate card anchoring: The translate card in web pages stays anchored below the selection instead of drifting. (commit by @Phil-Fan)
  Fixes
  - macOS fullscreen title bar: The traffic-light spacer collapses in native fullscreen, so the first control is no longer pushed to roughly 92px. (#555 by @HuangYincan)
  - Trackpad pinch zoom: The gesture only previews with a CSS transform and commits a single real zoom on release, so slow pinches respond and fast pinches no longer jump a step. (#556 by @HuangYincan)
  - ModelScope horizontal panning: Restores the site's 1280px layout and bridges wheel panning, without clipping the left edge. (#557 by @HuangYincan)
  - Editor paste: Fixes extra blank lines and duplicated wiki-link aliases when pasting inside the editor, and pasted text degrading to a paragraph in an empty heading block. (#558 by @bet4it)
  - Windows PDF page jumps: Fixes the viewport randomly jumping to the first or last page while scrolling on Windows. (#545 by @langbit)
  - Windows MCP tunnel console flash: The health probe child process now carries CREATE_NO_WINDOW, so no console window flashes every 10 seconds. (#544 by @Zhou1317fe5)
  - Agent directory detection: Adds OpenCode's ~/.opencode/bin and Grok's ~/.grok/bin and clarifies the missing layer on the onboarding page. (#554 by @HuangYincan)
  - Builtin embedding: No unusable default is written when no builtin embedding is available. (commit by @Phil-Fan)
  - Web proxy: Strips upstream CSP meta from proxied responses so embedded pages are not broken by their own policy. (commit by @Phil-Fan)
  - Agent message actions: User message actions now float beside the bubble. (commit by @Phil-Fan)
  - Dependency security: Overrides the affected nanoid and lodash-es versions pulled in through the mermaid chain. (commit by @qychen2001)
  Resolved Issues
  - Truncated note content: Fixes Markdown notes silently dropping everything after a prose < comparison (e.g. <0.5B). (#533 by @Phil-Fan)
  - Citation hover card: The citation hover card now dismisses after an internal link jump. (#528 by @Phil-Fan)
  - Import dedup: Fixes incomplete paper metadata and notes after sync dedup. (#507 by @Phil-Fan)
  - Markdown export: .md export now drops vault-internal frontmatter (aliases, tags, ...). (#551 by @Phil-Fan)
  - Visual annotation edges: Visual region frames now use the theme color for clearer dark mode. (#498 by @Phil-Fan)
  - Agent TTFT: Improves the first-token experience through connection reuse and phase feedback. (#536 by @Phil-Fan)
  Full changelog: https://github.com/poco-ai/Agentero/compare/v0.10.3...v0.11.0
