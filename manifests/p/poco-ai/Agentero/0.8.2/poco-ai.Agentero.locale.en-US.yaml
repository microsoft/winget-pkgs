ReleaseNotes: |-
  This release focuses on the usability of paper import and the sidebar workflow: configurable NOTES.md initialization for new papers, hiding Plaza sources and editing paper metadata directly from the file tree, new delete/reveal/add-to-chat actions on library rows, and a fix for the remote MinerU token probe misreporting valid tokens.
  Features
  - Configurable note initialization: Added a paperNoteMode setting (standard / title-only / blank / custom) controlling the NOTES.md shell written for newly imported papers across all import paths (wand, local PDF, Zotero migrate, Connector, remote, coolpapers). Custom mode renders .agentero/templates/NOTES.md with injected metadata variables, and every mode keeps the aliases frontmatter so wikilinks keep working. A settings command seeds a starter template without overwriting existing notes. (#386 by @qychen2001)
  - Hide Plaza sources & edit metadata: Added a plazaHiddenSources setting so you can right-click a Plaza source to hide it from the sidebar and Plaza home, and right-click the Plaza root to batch toggle visibility. The catalog metadata editor is now wired into the file-tree paper row context menu, matching the library row action. (#388 by @qychen2001)
  - Library row context menu: The library table row context menu reuses file-tree actions, letting you trash a paper, reveal it in the file manager, or attach it to the agent chat directly from the library. (commit by @qychen2001)
  Fixes
  - MinerU token probe: mineru.net now answers the empty-file-list probe with -10002 (instead of -500) and reports auth failures via msgCode on HTTP 401, which the old allowlist misreported as failed tokens. The probe now reads both code and msgCode, treating any non-auth business response as proof the token authenticated. (commit by @qychen2001)
