ReleaseNotes: |-
  0.19.1 smooths everyday use of the right sidebar and Agent window. The sidebar now slides open and closed and no longer flickers on Windows. Cmd+W leaves the Agent window from the new-session page, the title-bar entry follows the active theme, paper notes start collapsed, and sync settings no longer show account sign-in.
  Improvements
  - Sidebar motion: the right sidebar now slides open and closed, keeping its content stable while the embedded web view moves with the panel. (c05700680 by @Phil-Fan)
  - Paper notes start collapsed: new installations no longer open paper notes automatically; enable Open paper notes by default under Settings → General → Library. Existing saved choices stay as they are. (2c044e6a by @Phil-Fan)
  Fixes
  - Windows sidebar flicker: opening the right sidebar or dragging its divider on Windows no longer makes the panel flash. (723a0162 by @JiaheChen2002)
  - Agent window shortcut: from the new-session page, Cmd+W (Ctrl+W on Windows/Linux) now leaves the Agent window. Close Tab in the command palette follows the same path and no longer closes hidden document tabs. (1a977288 by @Phil-Fan)
  - Sync settings: current desktop builds no longer show account sign-in or usage, and new sync setups default to S3. The vault picker now sits next to the primary action. (06e48f67 by @qychen2001)
  - Agent window entry color: the title-bar entry uses the active theme's accent color instead of a fixed blue. (a9b2d56d by @qychen2001)
  Full changelog: v0.19.0...v0.19.1
