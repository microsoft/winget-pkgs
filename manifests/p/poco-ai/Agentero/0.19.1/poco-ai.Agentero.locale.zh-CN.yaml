ReleaseNotes: |-
  0.19.1 继续打磨右栏和 Agent 窗口的日常操作。右栏开合改为滑入滑出，Windows 上不再闪烁；新会话页可按 ⌘W 离开 Agent 窗口，顶栏入口跟随主题配色。论文笔记默认收起，同步设置也不再显示账号登录。
  改进
  - 右栏开合动画：收起或展开右栏时改为滑入滑出，动画过程中内容保持稳定，右栏里的网页视图跟着一起移动。（c05700680 by @Phil-Fan）
  - 论文笔记默认收起：新安装不再自动展开论文笔记，可在 设置 → 通用 → 论文库 打开「默认打开论文笔记」；已保存的设置保持不变。（2c044e6a by @Phil-Fan）
  修复
  - Windows 右栏闪烁：Windows 上打开右栏或拖动分栏时，面板不再反复闪烁。（723a0162 by @JiaheChen2002）
  - Agent 窗口快捷键：在新会话页按 ⌘W（Windows / Linux 为 Ctrl+W）会退出 Agent 窗口；命令面板的「关闭标签页」也走同一分支，不再关掉后台隐藏的文档标签。（1a977288 by @Phil-Fan）
  - 同步设置：当前桌面构建不再显示账号登录和额度，新建同步默认使用 S3；资料库下拉框移到主操作旁。（06e48f67 by @qychen2001）
  - Agent 窗口入口配色：顶栏入口改用当前主题的强调色，不再固定为蓝色。（a9b2d56d by @qychen2001）
