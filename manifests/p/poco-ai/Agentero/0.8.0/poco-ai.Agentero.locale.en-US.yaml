ReleaseNotes: |-
  v0.8.0 polishes the Agent workflow, PDF reader chrome, CLI efficiency, and sync experience. It adds ACP Terminal capability, floating figure/reference panels in the PDF viewer, sync scope controls, and refines file-tree expansion, Agent link handling, and onboarding details.
  Features
  - ACP Terminal capability: Agents can now execute local terminal commands through the ACP terminal capability; routing and permission quirks for agents like Kimi that do not natively expose terminal are documented. (#365 by @Phil-Fan)
  - Floating figures panel in PDF viewer: The PDF viewer gains a standalone floating Figures panel for inspecting paper figures outside the page, freeing the right sidebar. (461918cd by @Phil-Fan)
  - Floating references panel in PDF viewer: The references panel is also now floating, so you can check citations while reading without leaving the document. (3f1888c1 by @Phil-Fan)
  - Sync scope controls: A new sync scope lets you skip bulky paper assets and sync only metadata; the settings pane shows connection status, provider guide links, and the connect action. (#360 by @qychen2001, @Phil-Fan)
  - Global agent identity sharing: The currently selected agent identity is now shared across the app via a chrome store, and the title-bar toggle is replaced with the current agent's logo. (67eb212d by @Phil-Fan)
  - CLI reading marks: The CLI can write highlights, comments, and translation marks from a text quote, and resolve the quote to page rects via the PDFium text engine. (feb22dc9 by @Phil-Fan)
  - Missing PDF indicator and re-download: The library marks papers without a local PDF and offers a re-download entry point. (72c21749 by @qychen2001)
  Improvements
  - File-tree default expansion: Opening a vault now expands only the papers/ folder; first-level organization subfolders stay collapsed by default to reduce initial clutter. (#357 by @byy-yby)
  - Direct agent link navigation: Link clicks in agent message bodies and reasoning chains now open the system browser directly, dropping the safety modal and avoiding duplicate Tauri windows. (#356 by @byy-yby)
  - Slimmer CLI output: paper list --json now defaults to id/path/title, shrinking output to about 3% of its previous size; JSON output is compact by default, with --pretty, --fields, and --full opt-ins, cutting agent token cost significantly. (#367 by @Phil-Fan)
  - PDF annotation and sidebar refactor: Annotation comments are pinned in a persistent rail outside the page edge, and the right sidebar no longer hosts References/Figures/Annotations tabs, keeping the reading area focused. (e2f848c6 by @Phil-Fan)
  - Auto-titled agent history: ACP agents that do not return session titles now get a title derived from the first user turn, making the history drawer readable. (#359 by @Phil-Fan)
  - Onboarding and agent UI polish: The onboarding agent step shows installation progress and loses its scrollbars; the AgentComposer reasoning-effort dropdown is clickable; chat copy buttons show a copied feedback state. (449bbf2a by @Phil-Fan)
  - Simplified paper info panel: Equalized resource link widths and streamlined action buttons for a cleaner paper info sidebar. (c706da95 by @Phil-Fan)
  - Removed layout menu from title bar: Removed the layout menu from the title bar to simplify the top chrome. (32790949 by @Phil-Fan)
  - ACL Anthology PDF import: The magic-wand importer now derives the PDF URL from the ACL Anthology landing page when no pdf_url is present, fixing PDF downloads for that source. (#363 by @Phil-Fan)
  - Remove citation graph: Removes the rarely-used citation graph feature and its heavy dependency to reduce installer size. (433a9090 by @Phil-Fan)
  Fixes
  - Aliyun OSS sync failure: Backends that do not support If-Match/If-None-Match conditional writes (e.g., Aliyun OSS) now degrade gracefully to plain PUTs, with a note in the settings pane. (#362 by @qychen2001)
  - PDF right-edge controls visibility: Fixed PDF page right-edge controls being clipped or resized at narrower widths; they now keep a fixed size and stay visible. (ee71c738 by @Phil-Fan)
  - Source external link handling: External source links open in the system browser instead of spawning an empty in-app webview; action-only sources render as buttons rather than anchors. (f5e1af7b by @Phil-Fan)
  - Empty dockview groups on restore: Layout restore now compacts empty dockview groups and syncs membership, avoiding leftover empty panels. (8c40b385 by @Phil-Fan)
  - Terminal output reader ordering: Terminal output readers are awaited before reading captured output, preventing truncated ACP terminal command output. (2a45cdd5 by @qychen2001)
  - Sources block parsing: Recognizes plain-text Sources blocks and strips the [blocked] tag, making agent source citation parsing more reliable. (616527db by @Phil-Fan)
  Resolved Issues
  - Move sidebar tabs into the PDF page: References and Figures panels moved from the right sidebar into the PDF viewer as floating panels. (#373 by @Phil-Fan)
  - Adjust default agent position and order: The current agent identity stays consistent across the title bar and panels, and the toggle is replaced by the current agent logo for clearer default agent presentation. (#372 by @Phil-Fan)
  Full Changelog
