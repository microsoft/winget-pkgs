ReleaseNotes: |-
  This release focuses on reading and Agent interaction: arXiv Daily and RSS feeds in Plaza can now be previewed, cited, and asked about without downloading; Agent session controls and context chips move into a cleaner header toolbar; macOS Finder and Windows Explorer get "Open with Agentero" context-menu integration; and a batch of PDF, Settings, and Library polish fixes land.
  Features
  - Remote arXiv preview and import: arXiv Daily recommendations in Plaza now open as read-only PDF previews inside the app without downloading to the Vault; supports Copy, Ask, Add-to-chat, citation hover, and one-click import into the library. (#420, #429 by @Phil-Fan)
  - RSS feed Agent interaction: Feed item bodies in the RSS detail view support Copy, Ask, and Add-to-chat through an ephemeral Ask popover. (#421 by @Phil-Fan)
  - Agent composer redesign: Model, mode, effort, and Fast toggle move into a dedicated header toolbar; reference, selection, and skill chips sit above the prompt shell; the send button becomes an inline circular up-arrow. (#424 by @Phil-Fan)
  - OS "Open with Agentero" integration: A user-level macOS Finder Quick Action and a Windows Explorer folder context menu let you open any folder as a Vault; both pass the directory path directly to avoid URL-encoding issues. (#436 by @qychen2001)
  - Trash cancels paper background jobs: Deleting a paper now cancels its queued or running parse, download, layout, and metadata jobs, preventing in-flight downloads from recreating the trashed folder. (#432 by @qychen2001)
  Fixes
  - Agent ask-user surfaces no longer block global shortcuts: Docked ask/permission forms remain dismissible via Esc / ⌘W but are no longer modal, so sidebar toggles like Cmd+B / Opt+Cmd+S keep working. (#425 by @Phil-Fan, @qychen2001)
  - PDF visual annotations merge into the comment rail: Visual marks now live in the right-rail comment card column; crop drafts persist the note and open rail editing; Add-to-chat moves from floating cards to the comment rail. (#396 by @Phil-Fan)
  - PDF floating overlays are mutually exclusive and sticky: Citation/crossref previews and pin cards now suppress each other, stay open during pointer travel, and dismiss with a shorter delay to avoid stacked cards. (#430 by @Phil-Fan)
  - Windows PDF reading position no longer jumps back to page one: Reading-position restore is skipped once the user has scrolled past the first page, fixing the view snap-back caused by delayed WebView2 readiness callbacks on fractional DPR. (#427 by @Phil-Fan)
  - Layout backend settings UX improved: Clearing an API key persists immediately and falls back to the local backend; a single available backend shows plain text instead of a useless dropdown; disabled Select chrome keeps the row width stable. (#433 by @Phil-Fan)
  - Library empty-state centers correctly: The empty-state placeholder is rendered outside the 900px-min-width table so it fills and centers within the visible panel. (#431 by @Phil-Fan)
  - Title-search overflow and loading feedback: Long titles no longer burst past picker cards; the dialog shows a shimmer as soon as a title-like query is submitted and settles when Host results arrive. (#438 by @Phil-Fan)
  - Settings language switches immediately: Changing the language in the Settings window now calls i18n.changeLanguage, so the UI updates without a refresh. (#437 by @Phil-Fan)
  - Vault open refuses to scaffold moved or deleted folders: ensure_vault now errors on missing paths, and only create_vault scaffolds a new location, preventing an old Vault path from being silently rebuilt as an empty directory. (#439 by @qychen2001)
  - Background-task ring completes with animation: Finished tasks close the ring to 100% and play a brief success fill/check animation. (#435 by @Phil-Fan)
  - Citation import waits for the real background task: lookupSubmit now waits for the lookup background job to finish before returning, so the import indicator keeps spinning until the paper is actually ready. (#434 by @Phil-Fan)
  - Agent composer focus ring removed while typing: The prompt shell border stays unchanged on textarea focus, preventing a highlighted input frame from flashing while typing. (by @Phil-Fan)
  - Suggestion chips hidden after chat starts: Empty-state workflow suggestions remain in the transcript, but the same prompt chips stop appearing above the input once the conversation has messages. (by @Phil-Fan)
