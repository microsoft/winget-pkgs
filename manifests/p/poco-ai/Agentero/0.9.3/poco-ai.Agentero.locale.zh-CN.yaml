ReleaseNotes: |-
  本次发布聚焦阅读与 Agent 交互体验：Plaza 中的 arXiv Daily 与 RSS 订阅支持不下载即可预览、引用与 Agent 问答；Agent 对话区的模型、模式与引用上下文被收拢到更清晰的头部工具栏；同时补齐了 macOS Finder 与 Windows Explorer 的“用 Agentero 打开”右键集成，并修复了 PDF 滚动回跳、悬浮卡片堆叠、设置语言切换等细节问题。
  新功能
  - 远程 arXiv 预览与导入：Plaza 中的 arXiv Daily 推荐现在可直接在应用内以只读 PDF 预览打开，无需下载到 Vault；支持复制、Ask、加入对话、引用悬停预览，以及一键导入到论文库。 (#420, #429 by @Phil-Fan)
  - RSS 订阅的 Agent 交互：RSS 订阅详情页中的条目正文支持复制、Ask 与加入对话，通过临时的 Ask 浮层与 Agent 交互。 (#421 by @Phil-Fan)
  - Agent 对话区重新布局：模型、模式、Effort 与 Fast 开关被收入面板头部工具栏；引用、选区和 Skill 胶囊排列在提示框上方；发送按钮改为圆形上箭头并内联于输入区。 (#424 by @Phil-Fan)
  - 系统右键“用 Agentero 打开”：macOS Finder 用户级 Quick Action 与 Windows Explorer 文件夹右键菜单均可将任意文件夹作为 Vault 打开；两者都直接传递目录路径，避免 URL 编码丢失特殊字符。 (#436 by @qychen2001)
  - 删除论文时取消后台任务：删除论文会同时取消其排队或运行中的解析、下载、版面和元数据任务，防止进行中的下载重新创建已被移入废纸篓的文件夹。 (#432 by @qychen2001)
  修复
  - Agent ask-user 浮层不再阻塞全局快捷键：停靠式的 ask/permission 表单仍可通过 Esc / ⌘W 关闭，但不再标记为模态，因此 Cmd+B / Opt+Cmd+S 等侧边栏切换快捷键可继续使用。 (#425 by @Phil-Fan, @qychen2001)
  - PDF 视觉批注并入评论侧栏：视觉标记现在统一显示在右侧评论卡片列；裁剪草稿保存备注后打开侧栏编辑；“加入侧栏对话”从悬浮卡片移至评论轨道。 (#396 by @Phil-Fan)
  - PDF 悬浮卡片互斥与悬停驻留：引用/交叉引用预览与 Pin 卡片现在相互抑制，指针移动期间保持展开，移出后以更短的延迟收起，避免卡片堆叠。 (#430 by @Phil-Fan)
  - Windows PDF 阅读位置不再跳回首页：当用户已经滚动到后续页面时，跳过阅读位置恢复逻辑，修复 WebView2 在分数 DPR 下 readiness 回调滞后导致的视图回跳。 (#427 by @Phil-Fan)
  - 设置中的版面解析后端交互优化：API 密钥清空后立即持久化并回退到本地后端；只有一个可选后端时显示纯文本而非无效下拉框；禁用状态保持 Select 样式以稳定行宽。 (#433 by @Phil-Fan)
  - 论文库空状态正确居中：空状态提示移出最小宽度 900px 的表格，改为在可见面板区域内填充并居中。 (#431 by @Phil-Fan)
  - 标题搜索溢出与加载反馈：修复长标题撑破选择卡片的问题；提交标题类查询后立即显示 shimmer 加载，直到 Host 返回结果。 (#438 by @Phil-Fan)
  - 设置窗口语言切换即时生效：在设置窗口中切换语言后立即调用 i18n.changeLanguage，无需刷新页面即可看到新语言。 (#437 by @Phil-Fan)
  - Vault 打开时拒绝为已移动或删除的文件夹重建脚手架：ensure_vault 在路径缺失时直接报错，只有 create_vault 才会搭建新位置，避免恢复旧 Vault 时被静默重建为空目录。 (#439 by @qychen2001)
  - 后台任务圆环完成动画：任务完成后圆环从短弧闭合到 100%，并播放简短的成功填充与对勾动画。 (#435 by @Phil-Fan)
  - 引用导入等待真实后台任务结束：lookupSubmit 现在等待查找后台任务完成后才返回，导入图标会一直旋转到论文真正就绪。 (#434 by @Phil-Fan)
  - Agent 输入框打字时无聚焦光环：textarea 聚焦时保持提示框边框不变，避免打字过程中出现高亮输入框闪烁。 (by @Phil-Fan)
  - Agent 对话开始后隐藏顶部建议芯片：空状态工作流建议保留在对话记录中，但开始对话后不再在输入框上方重复显示相同提示。 (by @Phil-Fan)
