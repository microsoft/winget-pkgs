ReleaseNotes: |-
  This release centers on translation, PDF annotations, and Agent integration. The CNKI free translation engine returns with sentence chunking, retry-on-drop, and clearance-cookie handling, and the built-in translator now shows a live probe. PDF annotation cards moved their actions to an edge tab and render comments as Markdown, while annotated PDF export is markedly faster. On the Agent side, a missing npm now offers a one-click Node.js install and login resolves commands to absolute paths. Layout-analysis settings guidance, Nutstore WebDAV, Grok reconnect replay, and Excalidraw image paste are fixed as well.
  Features
  - CNKI free engine: The CNKI (dictionary) translator is back as a free engine with sentence chunking, AES-encrypted requests, and a cached token. Dropped connections retry and the clearance cookie is carried, so batch translations no longer fail partway. (#664, 44d84c14 by @Phil-Fan)
  - One-click Node.js install: Agent install/update runs npm-based chains. When npm is absent, the failure toast now offers an "Install Node.js" action that runs as a cancellable background task with progress, and Windows picks it up without an app restart. (67c4d7e1 by @Phil-Fan)
  - CLI local PDF import: agentero import pdf <file>... imports one or more local PDFs, running the LiteParse probe, the Zotero recognizer, and DOI/arXiv metadata resolution before filing under a canonical ID, with options for a target folder or to skip recognition. (#644 by @bet4it)
  - Low-frequency config reminders: On first entry, features that need configuration — such as local ONNX layout analysis (memory/CPU) and the network proxy — raise a top-right reminder with an actionable jump to settings and a "don't remind again" choice. (#658, b69578a8 by @Phil-Fan)
  - Pinned translation cards: Translation cards dismiss via Esc, an outside click, or the close button; keepable translations can be pinned beside the source and reopened from a margin mark, and unpinning discards only after closing. (#667, #680 by @qup1010)
  - Scholar BYOK: Semantic Scholar, PubMed, and OpenAlex accept optional credentials via environment variables, with the default free endpoint behavior unchanged. (#649, #651 by @dengfeng-0908)
  - Markdown annotation comments: Highlight and visual annotation comments render as Markdown in PDF comment cards and note embeds, and long comments stay scrollable. (#661, #662 by @Kokeip)
  Improvements
  - Layout-analysis settings guidance: OpenAI-compatible is collapsed under "Other providers" with a hint to prefer Paddle / MinerU, and analysis/parse failures offer a direct jump to the analysis settings. (#656, f736dc0a, acc8fb2a by @Phil-Fan)
  - Faster annotated PDF export: The byte-by-byte WASM heap copy in EmbedPDF's save path is replaced with a single slice copy, so multi-megabyte exports finish much faster and confirm with a success toast. (#595, 69efc507 by @Phil-Fan)
  - Annotation card edge tab: Comment card actions move to a vertical edge tab and out of the scroll container, no longer covering the body or being clipped while scrolling. (3812e96a, da760eae by @Phil-Fan)
  - Built-in translator probe: The built-in (agentero) translator now sends one real request to show a probe status in the default-service dropdown, surfacing a dead gateway as a failure. (#647, aa825196 by @Phil-Fan)
  Fixes
  - Nutstore WebDAV: Nutstore's account root https://dav.jianguoyun.com/dav/ is supported and probe writes are verified, so a passing connection test no longer precedes a 404 on the first sync. (#681, 973fce12 by @qychen2001)
  - Grok reconnect replay: If a warm connection dies before the prompt is delivered, the process is dropped and the same prompt is resent via session/load, so context is not lost. (#675, 1fba75fe by @ffy6511)
  - Empty annotation on blur: An empty visual annotation draft is cancelled on blur, outside click, or Esc instead of lingering with its selection. (#673, 0f36b304 by @ffy6511)
  - PDF citations with spaces: Percent-encoded vault hrefs are decoded so PDF citation links whose paths contain spaces open correctly. (#665, 5720c936 by @ffy6511)
  - Copy interaction: Copying from the selection toolbar shows a check and keeps the selection, no longer interrupting consecutive selections with a toast. (#648, e6ca1506 by @ffy6511)
  - Annotation editor shortcuts: Ctrl/Cmd+B and Ctrl/Cmd+I format text inside PDF annotation inputs instead of triggering the global file-tree shortcut. (#669 by @Kokeip)
  - Selection annotation composer: Pinned selections are shown by the annotation summary rather than as hidden chips overlapping the composer placeholder. (#660 by @Kokeip)
  - Library column drag: Dragging a Library column header is no longer mistaken for a file-path drag that split the workspace. (#646, 79045950 by @Phil-Fan)
  - Compact Figures panel: The bbox overlay toggle is reachable again in the compact panel, and reminder toasts stack their actions below long descriptions. (#653, 1e5a33aa, b331339e by @Phil-Fan)
  - Excalidraw image paste: Clipboard images can be pasted into Excalidraw and are persisted with the file, and file-tree clipboard shortcuts are scoped to the file tree. (#682, 598a88a9, ef292f1d by @Phil-Fan)
  - Agent login command: The login terminal resolves the executable to an absolute path against the merged PATH, fixing command-not-found from bash -lc skipping zsh config; the redundant bundled Claude/Codex ACP probe row was also removed. (#686, 3dcb669b, f57313b3 by @Phil-Fan)
  Full Changelog: https://github.com/poco-ai/Agentero/compare/v0.11.4...v0.11.5
