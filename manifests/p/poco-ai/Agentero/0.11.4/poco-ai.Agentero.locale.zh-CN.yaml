ReleaseNotes: |-
  本次发布围绕 PDF 阅读、Library 与 Agent 接入三块改进：/Rotate 旋转页面恢复按显示方向正立渲染，划词高亮更贴合文字并新增一键复制；Library 支持编辑标签颜色、拖动并记忆列宽、按加入日期排序，还能自动收纳 papers/ 下的自定义文件夹；Agent 侧新增 Antigravity 官方预设，修复 Windows 内置 ACP 与 OpenCode 2 自定义模型目录，并可用 @ 一次引用整份 arXiv 每日推荐。工作区布局持久化、Vault 侧栏稳定性与移动端构建也一并修好。
  新功能
  - PDF 划词复制：PDF 划词工具栏新增「复制」按钮（macOS 为 ⌘C），放在翻译之后；点击后复制选中文字、收起划词菜单并清除选区。（#640 by @bet4it）
  - Antigravity 官方预设：Agent catalog 新增 Google Antigravity ACP 预设，安装、更新、卸载沿用设置页既有流程；版本与平台压缩包直接读取官方 ACP Registry，不硬编码、无旧版本回退。（#629 by @Zhou-Ruichen）
  - 整份 arXiv 每日推荐：@ 菜单新增「今日推荐（N 篇）」条目，一次把当日推荐摘要目录交给 Agent；需要深读时模型可请求最多 3 篇全文，前端自动续轮给出最终报告。（#626 by @ForeverHYX）
  - Library 标签颜色：可以直接在 Library 修改已有标签的颜色，颜色随标签元数据保存，侧栏与论文信息面板同步显示。（#642, 84ccc2dd by @qychen2001）
  - Library 列宽记忆：Library 各列可拖动调整宽度，并随设置持久化，下次打开保持上次比例。（#612, b0178408 by @qychen2001）
  - Library 排序：支持按「加入日期」排序，可在表头切换。（#620, 8d1a207c by @qychen2001）
  - papers/ 自动收纳：放进 papers/ 下的自定义子文件夹会被自动识别并收纳为论文——主 PDF 改名为 {id}.pdf、附件归位、写入 NOTES 壳、登记 Catalog 并触发后台元信息识别；失败不会删除用户目录。设置里的 autoIngest 开关默认开启，应用关闭期间新建的文件夹在下次启动时补收纳。（#549, 424ef5f2, 4ac91fd6 by @Phil-Fan）
  - OpenCode 2 模型目录：当 OpenCode 2 同时返回不完整的 configOptions 与更完整的原始模型目录时，改用更完整的目录解析，自定义 provider 的模型重新出现在模型选择器；并升级到 OpenCode v2。（#638, a1665652, 88418fe4 by @Phil-Fan）
  改进
  - 布局持久化：手工调整的侧栏与分屏比例会按布局记住并在重启后恢复，修复切换布局、打开 Agent 或点击侧栏后宽度回退到默认的问题。（#624, 17416e9d, 9bb8c238, 55351c5a by @qychen2001）
  - PDF 与笔记分屏比例：打开或关闭笔记分屏后保持 PDF 与笔记的比例，不再被重置。（a6a46391 by @qychen2001）
  - Library 常驻首位：Library 标签固定显示在标签栏第一个，不再被其它标签顶到后面。（#631, 486c5fd3 by @qychen2001）
  - 论文路径面包屑：阅读 PDF 时在面板顶部显示可跳转的论文路径面包屑，悬停可预览候选、点击可返回 Library 对应位置。（#613, efe00580, 560d276c by @Phil-Fan）
  - OpenAI 兼容翻译：补充自定义 OpenAI 兼容翻译服务的配置说明，明确端点填写方式。（#621, 0c620050, 2c6d2f2e by @Phil-Fan）
  修复
  - PDF 旋转页面：修复 /Rotate 页面被按未旋转尺寸布局与切图、导致横向表格竖排错位并溢出重叠的问题，页面按显示方向正立渲染。（#604, 6d074dfd, 9a7dcaee by @Phil-Fan）
  - 划词高亮边界：高亮批注改用紧致字形边界，不再纵向溢出到相邻行或相互重叠。（#639 by @Immortal-Fates）
  - 删除翻译卡后重现：删除翻译卡后，迟到的 provider 回调或已开始的写盘不会再让结果重新出现；普通切换卡片不会取消后台完成。（#627 by @Zhou-Ruichen）
  - Windows 内置 ACP: 规范化带 \\?\ 前缀的适配器入口脚本路径，修复 Windows 安装版内置 Codex ACP 在初始化前退出、无法连接的问题。（#633 by @llamapw）
  - hermes 模型选择器：兼容旧的顶层 models 字段，并把重型 Agent 的 warm session/new 预算放宽到 30 秒，修复 hermes 模型列表为空、无法选模型的问题。（#628 by @Zhou1317fe5）
  - Vault 侧栏黑屏：去掉整条侧栏的合成层，修复打开论文、切换标签或导入后侧栏整片变黑、需要滚动才恢复的问题。（#607, d341fe27 by @Phil-Fan）
  - 划词浮层误触布局：划词工具栏与问答卡打开时冻结 Dockview 的标签/分组拖拽，避免在标签栏上的拖动把布局误分成多栏，标签点击不受影响。（#608, a3c80932 by @Phil-Fan）
  - 远程访问连接：更新中继（relay）端点，并让远程端发布的目录快照保持一致，修复移动端配对时 bridge 连接失败。（#619, 45871f8d, cf9b4730 by @Phil-Fan, @qychen2001）
  - 移动端构建：广场缓存论文的 PDF 解析在 iOS/Android 上被编译剔除后不再导致构建失败，修复 v0.11.3 的 Android 与 TestFlight 构建；已有缓存副本仍可复用。（83cb906e by @Phil-Fan）
  安全性
  - Markdown 依赖：升级 platejs 及 lockstep 的 @platejs/core 到 53.3.14，修复 HTML 反序列化安全公告（Dependabot #49）。（4f05d2c4 by @Phil-Fan）
