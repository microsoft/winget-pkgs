ReleaseNotes: |-
  This release centers on dual-pane PDF translation, a clearer Agent chat experience, and broader scholarly sources: layout translations can sit beside the original in a workspace split with bidirectional scroll sync; Agent replies fold reasoning, plans, and tools into a chain-of-thought, tables gain copy/download/fullscreen actions, and the built-in catalog moves from Gemini CLI to Antigravity. The library adds a citation-count column and PubMed / bioRxiv / medRxiv coverage. It also fixes missing NOTES after restart, incomplete layout translations, and updates that installed a stale release after long sessions.
  Features
  - Dual-pane PDF translation: With the setting on, open a workspace split that keeps the original PDF beside the layout translation with bidirectional scroll sync; a standalone translation window is also available, and the preference persists in Host settings. (92b903ca, 5550bbd5, 80ebab45, e76cef5a, #466 by @Phil-Fan)
  - Agent chain-of-thought UI: Reasoning, plans, and tool calls fold into one chain-of-thought with a compact streaming activity row and elapsed time; hover-to-expand, error badges, and reply thinking orbs make the transcript easier to scan. (357773af, 6c853e34, 644c04d4, #480 by @Phil-Fan)
  - Message table actions: Tables in Agent messages and reasoning render as PlainTable with copy, download, and fullscreen actions. (b6e268f6, 94677463 by @Phil-Fan)
  - Antigravity CLI: The built-in catalog replaces Gemini CLI with Antigravity (agy-acp), migrates legacy registrations, and routes install / update / uninstall through the npm adapter path, with docs updated to match. (d7d7f95d, 67e49716, #468 by @Phil-Fan)
  - Reasoning effort picker: Choose ACP thought_level / reasoning effort from the model-selector header, remember explicit picks per agent, and fall back to the highest available tier when unset. (e100f3b0, bd8bd6ca, #470 by @qychen2001)
  - Library citation counts: The papers library table gains a citation-count column for quick impact scanning and sorting. (2056aa02 by @Phil-Fan)
  - PubMed / bioRxiv sources: Scholarly search and import add PubMed and bioRxiv / medRxiv, with multi-source ApiPaper merge and scope-based title-search fusion. (d92cad0c, 9c010212 by @Phil-Fan)
  Improvements
  - Auto-discover Agents in the sidebar: Catalog scans now register Agents already on PATH but missing from the registry, and the sidebar probes them so the switcher fills without opening Settings first. (e598aa48, a48ffb0d, #482 by @Phil-Fan)
  - History and switcher polish: Empty sessions are dropped with an empty-state message; Agent options sort alphabetically; switching Agents no longer inserts a system notice, and reply bubbles no longer repeat the identity label. (cb0de6e9, 0c7612c6, 19904af3, aa17a9e4 by @Phil-Fan)
  - Unsupported Agent notes: Docs and Vault onboarding notes clarify that the Codex desktop app and WorkBuddy are not direct in-app ACP Agents today (Codex CLI via codex-acp remains supported). (700fba77, 09aa5cf5, #473 by @Phil-Fan)
  Fixes
  - Login-shell / relay ACP: Local ACP children inherit login-shell environment variables so tools that depend on user shell config (such as relay proxies) connect correctly; Agent tool install lifecycles also honor the configured proxy. (21b89633, 6e76b7ed, #478 by @Phil-Fan)
  - Missing NOTES after restart: When restored tab state drifts from the dock, or a placeholder tab’s first click only activates without opening notes, NOTES reopens with the reading layout. (#476 by @bet4it)
  - Complete, retryable layout translation: Preserve full source text, split oversized blocks, and retry failed units while keeping partial successes with an explicit partial state; incomplete OpenAI finish_reason values are rejected so smaller chunks can retry, avoiding clipped overlays and stale runs overwriting newer results. (#477 by @jiah0231)
  - Stale update installs: Re-check the signed remote manifest before installing so long-running sessions still get the latest release, falling back to the cached manifest when offline. (7b843c14, #481 by @qychen2001)
  - History scope and titles: Agent history is limited to the current Vault / directory; untitled items fall back to the first user prompt instead of a session-id prefix. (2664acf5, #483, #484 by @Phil-Fan)
  - Prompt display noise: User-prompt display and selection backfill strip harness reminder and context blocks so only readable body text remains. (e39fb00f by @Phil-Fan)
  - Dual-pane translation sync: Harden dual-pane initialization, PDF byte copies, and scroll sync; refresh the sidecar when the translation tab becomes active and reuse the source pane’s layout result. (b008df5b, aa42fda9, b4bf7440, 2a785db0 by @Phil-Fan)
  - pi-acp host sync: Keep the pi-acp adapter aligned when the pi host updates so ACP calls do not drift. (4909b0f7, #471 by @Phil-Fan)
  - Reasoning list indentation: Restore list indentation inside chain-of-thought reasoning content. (e856ec07 by @Phil-Fan)
