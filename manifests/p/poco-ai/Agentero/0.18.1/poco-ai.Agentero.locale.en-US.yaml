ReleaseNotes: |-
  The paper library now defaults to card view, with folder management and batch actions. Vaults can use one-way backup mirrors, and WebDAV adds a compatibility option for servers without conditional writes. Read bilingual update notes in the app and double-click translated sentences to select them in side-by-side view.
  Features
  - Paper library cards: The default card view offers PDF first-page previews, folder management, imports into the current folder, and batch actions. The app preserves saved table-view preferences and labels both view buttons. (d57db7b2f · 48f8caac8 · 162afe911 · c5ccba990 · 58078e773 by @ffy6511, @Phil-Fan)
  - WebDAV degraded sync: On servers without conditional writes, each device sharing the store can opt in to degraded sync. Conflict copies may still be created and deleted files may reappear. Manual overwrite works in either direction and previews affected file counts before confirmation. (#1221 by @Tippye)
  - In-app update notes: Open bilingual notes for an available update, or browse release history in Settings, including the restored entry for the previous release. (98b981725 · 0fe280f63 by @ffy6511)
  - Peking University WPN: The new institutional proxy preset reports whether the connection test reached a campus page or a publisher PDF. Full-text dissertations still require PKU unified authentication. (#1232 by @hanlife02)
  Improvements
  - Interface scale: Enter a value from 50% to 200% and apply it by pressing Enter or leaving the field. (0fbf9c921 by @ffy6511)
  - Loading behavior: The Agent sidebar prepares in the background so it appears sooner when opened. The library, reader, writing, and settings views show placeholders while loading. (90b59c005 · 6a73c2d2b by @ffy6511)
  Fixes
  - Side-by-side sentence selection: Double-click translated text or a gap within the sentence to select it in full and open the action menu, even when the source pane still has focus. (4d802054b by @ffy6511)
  - Git backup mirrors: A mirror can publish to its configured branch without switching the local branch. (8d7fef8dd by @JiaheChen2002)
  - CNKI proxy: Fixed hostname encoding when downloading from CNKI through a Wengine proxy. (03071f910 by @hanlife02)
  - Settings and metadata: Long author lists scroll inside the metadata editor instead of stretching the dialog. The OpenReview connection dot now precedes its label, matching AlphaXiv. (3649dc305 · 3c5317046 by @ffy6511)
  Resolved Issues
  - Vault backups across backends: Configure one primary backend and up to three one-way backup mirrors per vault. Changes made on mirrors never sync back. Settings show each mirror's publish status, and the CLI can target a specific backend. (#1048 · c84321358 · a1f0a005f · 714c49526 by @JiaheChen2002)
