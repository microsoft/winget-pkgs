ReleaseNotes: |-
  This release polishes the PDF dual-pane translation reading experience, adds a system setting to replace the current tab when opening a paper, and fixes several stability issues in the Agent inline composer and highlight annotation interactions.
  Features
  - Replace current tab when opening a paper: Added a system setting that closes the active tab before opening a new paper, supporting a single-paper-at-a-time workflow; covers the Host schema, frontend settings pane, i18n, and workspace behavior. (#503 by @Phil-Fan)
  Improvements
  - Dual-pane translation performance and sync: Lightened plugin loading in the translation companion pane to only core raster, scroll, and zoom capabilities, and coalesced paired scroll events into a single animation frame to reduce rendering overhead. (commit by @Phil-Fan)
  Fixes
  - Dual-pane translation scroll and zoom sync: Two independent EmbedPDF providers now synchronize scroll ratio and zoom bidirectionally via module peering, with wheel zoom/pan re-enabled on the translation pane so either side can drive the other. (commit by @Phil-Fan)
  - Translation rendering and paragraph fitting: Fixed mounting errors when the translation companion omits selection plugins; limited expansion logic to headings and captions so body prose no longer borrows neighboring whitespace; improved paragraph fitting and unified PDF translation layout. (commit by @Phil-Fan)
  - Highlight annotation UI stability: Kept highlight color-stack overlap order consistent with the text-selection toolbar and anchored the existing-highlight edit menu by its right edge so actions stay put when the stack fans out on hover. (commit by @Phil-Fan)
  - Inline composer and selection chips: Stabilized Agent inline composer cards; truncated selection chip titles while preserving page numbers; hid citation previews during text selection to reduce clutter. (commit by @Phil-Fan)
  - TypeScript target compatibility: Replaced toSorted with slice().sort to match the current TypeScript compilation target. (commit by @Phil-Fan)
  Resolved Issues
  - Source and translation pages stay in sync: The left and right panes now keep page navigation in sync, preventing misalignment while reading source and translated content. (#493 by @Phil-Fan)
  - Page jumps back after turning: Fixed the translation pane automatically jumping back to the previous position after a page turn. (#489 by @Phil-Fan)
  Full Changelog
