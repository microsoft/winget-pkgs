ReleaseNotes: |-
  本次发布主要围绕 PDF 双栏翻译阅读体验进行打磨，新增“打开新论文时替换当前标签页”的系统设置，同时修复了 Agent 行内 Composer 和高亮批注交互中的多项稳定性问题。
  新功能
  - 打开论文时替换当前标签页：新增系统设置，开启后点击新论文会先关闭当前标签页再打开，适合一次只聚焦一篇论文的工作流；覆盖 Host 配置、前端设置面板、i18n 及工作区行为。（#503 by @Phil-Fan）
  改进
  - 双栏翻译性能与同步：为翻译副面板精简插件加载，仅保留核心光栅、滚动和缩放能力，并将成对的滚动事件合并到同一动画帧，显著降低渲染开销。（commit by @Phil-Fan）
  修复
  - 双栏翻译滚动与缩放同步：两个独立的 EmbedPDF 提供器现在通过模块对等机制双向同步滚动比例和缩放，并重新启用翻译面板的滚轮缩放/平移，使左右两侧可互相驱动。（commit by @Phil-Fan）
  - 翻译渲染与段落适配：修复翻译副面板缺少选择插件时的挂载错误；限制标题和说明文字的扩展逻辑，避免正文占用相邻空白；优化段落适配并统一 PDF 翻译排版。（commit by @Phil-Fan）
  - 高亮批注 UI 稳定：保持高亮色卡重叠顺序与文本选择工具栏一致，并将已有高亮的编辑菜单按右边缘锚定，避免悬停展开时操作按钮移位。（commit by @Phil-Fan）
  - 行内 Composer 与选区卡片：稳定 Agent 行内 Composer 卡片状态；截断选区芯片标题并保留页码信息；文本选择期间隐藏引用预览，减少干扰。（commit by @Phil-Fan）
  - TypeScript 目标兼容：将 toSorted 替换为 slice().sort，以兼容当前 TypeScript 编译目标。（commit by @Phil-Fan）
  已解决问题
  - 原文及译文同步翻页：左右面板现在保持同步翻页，避免阅读原文和译文时页面错位。（#493 by @Phil-Fan）
  - 翻页会自动跳回：修复翻译面板翻页后自动跳回原位置的问题。（#489 by @Phil-Fan）
  Full Changelog
