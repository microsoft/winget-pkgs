ShortDescription: A focus timer and task manager that lives in your terminal.
Description: Void runs Pomodoro-style focus and break cycles, keeps a queue of tasks with priorities, tags, due dates and subtasks, and shows focus stats. It is keyboard-driven and works offline, with all data in a local SQLite file.
