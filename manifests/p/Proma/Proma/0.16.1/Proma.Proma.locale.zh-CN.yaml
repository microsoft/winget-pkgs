ReleaseNotes: |-
  Proma v0.16.1 更新
  新功能
  - 待办与日历工作区 — 可以在 Proma 中管理本地待办、日程、分组、标签和提醒，并在需要时让 Agent 直接协助处理。
  - 日历视图增强 — 周视图支持更顺畅地切换周次，定时任务会按实际执行计划显示在周历和月历中，悬浮即可查看详情。
  - 本地文件夹项目 — 可以直接选择已有本地文件夹作为项目根目录，让 Agent 在原有项目中读写文件，无需导入或复制。
  - 统一命令菜单 — 输入 / 可通过菜单调用 Skill、MCP 工具、会话和文件，也可添加文件或文件夹。
  - 引用计划项 — 通过 / 菜单搜索并引用待办和日程，让 Agent 结合具体事项提供帮助。
  - 从待办启动 Agent — 可以从待办直接发起 Agent 对话，让 Agent 帮你处理该事项。
  - 独立计划窗口 — 待办、日程和定时任务可在独立窗口中管理，并可用 Cmd/Ctrl + Shift + T 快速打开。
  - 快捷键地图 — 新增快捷键总览，方便查看和记忆常用操作。
  - 设置页焕新 — 设置从弹窗调整为独立工作区，浏览和修改配置更清晰。
  - 统一文件面板 — 项目文件和会话文件现在在同一处浏览；会话文件可移入项目，供其他会话继续使用。
  - 会话悬浮预览 — 可以在设置中开启会话悬浮预览；同时取消 Agent 修改文件后文件树自动跳转，减少操作打断。
  - 更清晰的模型与能力提示 — Pi 现在标为推荐内核，Claude 标示即将下线；更多模型可使用统一的推理强度设置，Claude Opus 5 支持 100 万上下文。
  - 思考内容默认收起 — Agent 的思考过程默认折叠显示，需要时再展开查看，对话阅读更专注。
  - 工具活动更易读 — Agent 读取 Skill 时会在工具活动中明确显示。
  Bug 修复
  - 长对话更稳定 — Pi 会更早整理过长上下文，并在整理后继续执行任务、保留进度显示。
  - 网络异常自动恢复 — Pi 遇到网络抖动或上游流式响应异常时会自动重试，减少回答中断或卡住的情况。
  - 运行中切换模型 — Agent 运行时可以预先切换模型，当前轮结束后会自动按新模型执行下一轮。
  - 命令与引用输入更可靠 — 连续调用 / 命令时，文件路径和旧草稿中的引用不会再被误识别为命令。
  - 协作会话状态同步 — 委派给子 Agent 的会话在创建、运行和结束时会正确更新界面状态，并沿用当前模型。
  - 随时停止 Agent — Agent 运行中即使已输入下一条消息，停止按钮仍会保留，可随时中止当前任务。
  - 内核与推理设置平稳切换 — 内核和推理强度的修改会在当前任务结束后生效，避免中途打断。
  - 自动处理明确计划项 — 自动模式下，Agent 可以直接删除已明确指定的待办和日程。
  - 待办数量更准确 — 待办和分组中的数量不再计入已完成的项目。
  - 侧栏固定会话不再受限 — 可以在侧栏固定任意数量的会话。
  - Excel 预览更多数据 — 每个 Excel 工作表的预览最多可显示 200 行数据。
  - 渠道与模型兼容性改进 — 修复飞书新机器人会话镜像，以及不同渠道下 Claude 模型识别的问题。
  - 其他体验修复 — 修复 Codex 会话标题偶发冲突、PDF Skill 识别和引用内容后焦点跳转等问题。
