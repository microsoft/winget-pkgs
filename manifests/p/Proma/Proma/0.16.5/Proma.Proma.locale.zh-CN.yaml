ReleaseNotes: |-
  Proma v0.16.5 更新
  新功能
  - 桌面灵动岛（Agent Island） — 常驻顶部的无边框胶囊窗口，实时展示 Agent 运行状态（空闲 / 运行中 / 等待交互 / 已完成 / 出错），并配有与状态一一对应的宠物动画。展开后可以看到 Agent 会话列表、今日 Todo 与日程，权限、提问、计划审批等需要你操作的环节会醒目提示并提供内联按钮；点击日程卡片可直接打开计划窗口。空闲时 Dashboard 保持可见，随时可唤醒。
  - 文件 / 文件夹拖拽引用 — 从右侧文件面板或系统（Finder / 资源管理器）直接把文件拖进 Agent 输入框，即自动插入 @文件 引用并跟随对话输入；拖入文件夹则会附加到会话（Agent 可访问）并在输入框显示引用图标。文件面板顶部新增拖拽提示，三点菜单也提供「引用到 Agent」入口。
  - 设置界面支持 ESC 退出 — 按 Esc 即可关闭设置窗口，并在界面展示键帽提示，交互更顺手。
  - 语音输入流式反馈 — 语音听写时在 Proma 中实时显示正在转写的文字，并在屏幕底部提供外部听写指示器（含音量反馈），转写完成后保留最终插入位置的光标。同时优化听写稳定性：过期启动会被拒绝、停止时保留缓冲音频不丢失、最终提交时机等待 ASR 确认后再触发。
  - 更新包空闲自动安装 — 更新下载完成后，会在系统空闲时自动安装，不再需要你停下手中的事手动点安装。
  Bug 修复
  - 提及菜单 Esc 行为修复 — 按 Esc 关闭后不再被同一触发片段再次弹出；修复 @ 文件弹窗并发竞态导致的「无匹配文件」，并对 /、#、&、~、～ 等全部提及触发符统一加固。
  - OpenCode Go 标题生成加固 — 修复推理模型（grok-4.5 / kimi-k3 / deepseek-v4 等）会话长期停在默认标题的问题：标题请求增加 30 秒超时、兼容内容块数组响应、所有失败路径（解密失败、请求异常、空标题）都会回退到本地标题生成。
  - Codex OAuth 标题并行生成 — OAuth 渠道的会话标题改为并行生成，避免逐个等待拖慢体验。
  - 经典视图 + 深色主题设置面板导航变白 — 修复经典视图下设置面板左侧导航在深色主题中被浅色硬编码覆盖的问题。
  - 灵动岛空闲 Dashboard 保持可见 — 修复空闲状态下 Dashboard 偶发消失的问题，并保留全天日程事件的展示。
