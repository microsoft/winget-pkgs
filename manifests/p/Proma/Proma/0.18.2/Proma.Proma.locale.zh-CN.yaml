ReleaseNotes: |-
  Proma v0.18.2 更新
  新功能
  - 统一 Agent 右侧工作区 — 文件、改动、预览、项目记忆、聊天与浏览器现在统一收进右侧标签栏；切换时保留浏览器页面状态，支持动态关闭标签与快捷键切换，任务上下文不再因查看不同内容而中断。
  - 可见的 Agent 终端 — Agent 可在右侧工作区打开专属终端标签；命令执行过程对用户可见、可中断，终端与每个 Agent 会话隔离。工作目录缺失时会安全回退，同时继续严格校验 Agent 可访问的路径。
  - 浏览器原子操作能力 — 内嵌浏览器新增点击并等待、固定 DOM 操作、区域文本提取、表单填写、选择与滚动等原子工具；Agent 能更可靠地完成站内交互，并对提取内容设置长度边界，降低动态页面操作失败和上下文膨胀的概率。
  - 探索会话标签 — 支持将对话中的历史片段作为独立探索会话打开，在不离开当前任务的前提下回看与追溯上下文；读取范围按需限制，避免长会话加载拖慢主界面。
  - 改动面板目录树 — 工作区改动以目录优先的层级树呈现，连续单层目录自动压缩；支持折叠、搜索时自动展开、未查看提示与键盘打开，复杂项目中的文件变化更易定位。
  - 归档会话按项目分组 — 侧边栏中的归档会话按所属项目归类，历史工作不再混杂，回到特定项目继续任务更直接。
  - 宽侧栏双文件来源 — 在更宽的侧栏布局中可同时查看工作区文件与 Agent 可访问文件来源，并可分别搜索，更快找到需要查看或引用的内容。
  - 精简 Worktree 操作流 — 右侧工作区内的 Worktree 选择与相关操作整合进统一标签工作流，切换项目上下文与查看改动更加连贯。
  - Windows 顶栏控件统一 — Windows 各主要页面统一使用系统化的窗口标题栏控制，视觉与交互保持一致，并减少标题栏的模糊渲染开销。
  - 输入工具栏与模型选择器优化 — 统一输入工具栏控件尺寸，重新梳理渠道与模型的栅格、图标、选中态与键盘焦点反馈，模型选择更清晰、操作更稳定。
  Bug 修复
  - 右侧工作区切换更稳定 — 修复关闭标签后无法回到上一标签、活动标签偶尔不可见、标签宽度跳动、空白标签残留，以及不同 Agent 会话间标签状态串扰的问题；浏览器、预览与文件面板在弹层打开、会话切换或重新打开后都能保持正确显示。
  - 会话状态与协作进度同步 — 恢复运行中会话的状态指示，避免陈旧快照覆盖新状态；委派子 Agent 的进度会及时同步到父会话，停止快捷键也只会中断当前聚焦的会话。
  - 浏览器与文件预览联动修复 — 从 Agent 消息打开链接会直接进入浏览器；历史链接不再额外生成空白标签。打开文件预览时可正确覆盖浏览器并恢复侧栏，无法预览的文件会展示元数据而非空白界面。
  - 规划与待办交互优化 — 调整待办页标题和响应式布局；单项完成采用增量更新，不再整页重载或闪现删除线；创建后自动关闭对话框，并压缩新建入口占用空间。
  - 记忆变更只显示有效内容 — 仅展示 Agent 实际捕获的记忆更新，并以 diff 形式呈现，减少无关或难以辨识的记忆提示。
  - 引用与中文 MCP 名称兼容 — 修复 mention 标签紧贴文字时的边界解析，并确保中文 MCP 名称可以正确被识别与引用。
  - 附件、模型选择与会话上下文可靠性 — 修复 Markdown 附件粘贴流程、嵌入式模型选择器状态互相影响、删除会话后 Agent 上下文丢失等问题；用户主动选定的前台会话与工作区标签也能持续保持焦点。
  - 开发态启动与跨平台项目指令修复 — Electron 开发态仅监听必要构建产物，并在首次 bundle 就绪后启动，避免重复重载、旧产物误用和签名受扩展属性阻断；Windows 下项目 AGENTS.md / 指令清单的大小写、软链接与缺失路径解析也更加可靠。
  - 启动页信息精简 — 移除静态与 React 兜底启动页重复的副标题，保留关键加载状态与本地优先标识，启动过程更简洁。
