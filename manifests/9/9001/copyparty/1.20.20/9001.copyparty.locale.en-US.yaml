  - hotkey F4 to reload/refresh the directory listing 2c6497b6
  🩹 bugfixes
  - #1581 ctrl-a in search results 28801172
  🔧 other changes
  - show an explanation in the web-UI if javascript is broken due to misconfigured hosting-stack (the "csp nonce" stuff) 6f924829
