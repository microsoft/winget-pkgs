ReleaseNotes: 'Bundles Node.js, so the only requirement is the Muse CLI with muse login (Muse for Windows natively, or inside WSL2). macOS builds are not Apple-notarized yet. On macOS 15 or later, first launch needs System Settings > Privacy & Security > Open Anyway (or run: xattr -dr com.apple.quarantine /Applications/Helicon.app). On macOS 14 or earlier, right-click the app, then Open.'
