  - fix(customize): give the logo border the new theme's color by @hainguyents13 in #154
  - feat(customize): say what a theme is at the top of the Themes tab by @hainguyents13 in #156
  - feat(soundpacks): draw a cover for packs without an icon by @hainguyents13 in #157
