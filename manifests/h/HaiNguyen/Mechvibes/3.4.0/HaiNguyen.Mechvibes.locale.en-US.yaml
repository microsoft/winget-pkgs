ShortDescription: Keyboard and mouse sounds for every keystroke and click.
Description: |-
  Mechvibes plays a sound for every key you press and every click, in any app. Pick one sound pack for your keyboard and one for your mouse, install more from the community library, or make your own in the browser-based sound pack editor. It also has ambient sounds to mix in, and themes to change how it looks.
  Installing it through winget replaces Mechvibes 2 (the old Electron app) and keeps its settings and sound packs.
