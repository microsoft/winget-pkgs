ShortDescription: Peer-to-peer remote desktop. Screen, sound and files flow directly between computers, end-to-end encrypted.
Description: |-
  HandyPeer connects two computers directly. Each device gets a 9-digit ID: enter the other side's ID, they accept the request and the session starts.
  The pairing server only introduces the two machines; screen, sound and files then travel peer-to-peer over an end-to-end encrypted QUIC channel instead of passing through a relay.
  Includes keyboard and mouse control, two-way audio, file transfer with a remote folder browser, 720p to 1440p quality and optional unattended access.
