ReleaseNotes: |-
  The main motivation behind this release is to get out a release built with Go 1.27.3 that blocked trust in a small set of intermediate certificates due to specific security concerns around their operation. See Emudhra Incident for more info.
  Bug fixes
  - hugolib: Fix template change detection when saving via temp file and rename 46e51f3 @bep #15484
  - markup/goldmark: Fix auto heading ID when link text starts with a bracket c22158c @chanellebingham #15472
  - urls: Fix JoinPath panic with empty slice ce5d232 @Ferdinand-MZ #15473
  - js: Fix js.Build with browser-disabled extensionless requires 2efee51 @bep #15481
  - Fix Site.Key used in e.g. partialCached b86e0ca @bep #15466
  - ci: Fix Windows running out of disk space and simplify test runs 77230eb @bep
  - hugolib: Fix build hang after too many page render errors 85fb23f @bep #15449
  - tpl/cast: Fix nil pointer panic in hugo gen docshelper 8df3180 @jmooring #15444

  Improvements
  - Redirect .Params.title etc. to .Title etc. and deprecate it 53e1fef @bep
  - ci: Revert to plain go install honnef.co/go/tools/cmd/staticcheck@latest 3e67572 @bep
  - navigation: Escape pre/post in front matter menu entries f63482b @bep
  - Upgrade to Go 1.27.3 7343fc9 @bep
  - resources: Make processed image key stable across builds ff4eab7 @bep #15467
  - tpl: Make StripHTML (plainify) more robust and faster 7ec3a36 @bep #15462
  - tpl/transform: Make emojify and plainify preserve template.HTML input type 895f583 @bep #15452
  - Make emojify return a string 87bf585 @bep #15452
  - Skip staticcheck in check.sh unless --full is set 9d50291 @bep #15453
  - Delete CLAUDE.md 683a877 @bep

