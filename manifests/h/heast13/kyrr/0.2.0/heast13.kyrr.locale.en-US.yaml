ShortDescription: Removes background noise from your microphone for every app, and types what you dictate. Free, local, no account.
Description: |-
  kyrr is a small, free Windows app for your microphone. It removes background noise in real time with a neural network that runs inside the Windows audio engine, so every app (Teams, Zoom, Discord, OBS, the browser) gets the clean signal. It can also shape your voice (sound, even volume, softer S sounds) and type what you say: hold F9, speak, release, in German or English, transcribed on your computer.
  The installer briefly restarts the Windows audio service and switches on the DisableProtectedAudioDG setting so that Windows loads kyrr's audio filter; uninstalling puts it back.
