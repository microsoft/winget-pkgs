ShortDescription: RGB lighting, fan curves and sensors for Windows PCs, in one app.
Description: Airglow controls the lighting, fans and sensors of a Windows PC from one window. It drives NZXT and ASUS lighting natively, most other RGB through OpenRGB, and fan curves, motherboard headers and cooler pumps through LibreHardwareMonitor. Studio effects can be built from layers or written in code, and profiles can be shared with the community.
