  > Running on macOS — the app isn't code-signed, so Gatekeeper quarantines it on first launch. After dragging Noctis into your Applications folder, clear the flag once in Terminal:
  >
  > xattr -dr com.apple.quarantine /Applications/Noctis.app
  >
  > Then open Noctis normally.
  What's Changed
  Fixed
  - Fixed Delete track jumping to artist page
  - Fixed drag-drop import silently losing files
  - Fixed lyrics scrolling at song end
  - Fixed Discord artwork showing placeholder
  - Fixed lyrics panel overlapping lines
  - Fixed external open tracks missing artwork
  - Fixed lyrics not following backward seeks
  - Fixed player bar pill shrinking on lyrics open
  - Fixed white accent making buttons unreadable
  - Fixed no fresh install showing Lossless badge
  - Fixed Bit-perfect badge never showing
  - Fixed ListenBrainz scrobbling toggle not enabling
  - Fixed Discord relay not republishing while paused
  Improved
  - Improved fresh-install defaults
  - Improved Reset to Defaults consistency
  - Improved Exclusive Mode explanation in settings
  - Improved signal path display accuracy
  - Other bug fixes and Improvements
