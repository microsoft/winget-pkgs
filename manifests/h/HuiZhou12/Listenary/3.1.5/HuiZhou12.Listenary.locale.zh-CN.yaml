ShortDescription: 以本地曲库为核心并提供可选在线功能的音乐播放器。
Description: Listenary 管理和播放本地音乐，并提供可选的在线搜索、在线播放、订阅歌单、在线历史和远程歌词。在线功能依赖第三方平台和用户自行配置的服务凭据，不使用这些功能时，本地曲库与本地播放仍可独立工作。
