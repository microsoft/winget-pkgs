ReleaseNotes: |-
  新增
  在线播放
  新增音质自动降权：所选档位不可用时按档位顺序逐级下降重试，直到能正常播放
  切歌时先回到用户所选档位，拿不到就保持当前可用档位继续播放，不中断、不弹错误
  新增列表循环档位，循环顺序为：顺序 → 单曲循环 → 列表循环 → 随机
  顶栏歌词
  新增顶栏歌词文字对齐（左/中/右），本地与在线顶栏同时生效
  在线音乐
  在线搜索结果支持「加载更多」分页，可继续加载后续结果；已加载结果按曲目去重，失败可重试
  歌单与排序
  「我的收藏」与「我的在线歌单」支持按加入时间排序
  订阅的在线歌单新增「默认」排序项（保持平台返回顺序）并作为默认
  设置
  在线音乐页签新增「默认音质」，并划分为「服务凭据」「播放音质」两个分块
  修复
  在线播放
  修复从在线队列或搜索结果切歌时，当前所选档位被设置里的默认音质顶掉的问题
  列表循环下播完最后一首自动回到第一首，不再结束在线会话、不恢复本地播放
  修复播放模式按钮点按后图标与提示不刷新（表现为「点了没反应」）
  顶栏歌词
  修复在线播放时顶栏歌词显示「暂无歌词」、残留上一首歌词、不随播放推进的问题
  修复本地顶栏歌词对齐设置不生效的问题
  修复本地顶栏歌词卡在旧歌词、不随播放推进的问题，本地与在线改用同一套切换实现
  播放页歌词
  修复多行并列歌词（原文/翻译/罗马音）从其他页面回到播放页时不聚焦当前行的问题
  修复在线歌词视图出现滚动条的问题
  修复进入或返回在线播放页时歌词先落错位再矫正的问题，现在直接定位到当前行
  修复在线普通歌词没有行内扫词高亮的问题，与本地歌词表现一致
  列表显示
  修复在线音乐列表的正在播放条目没有选中样式的问题，与本地列表一致（搜索、收藏、歌单均覆盖）
  歌单与排序
  修复切到其他页面后排序方式自己变化的问题（多个页面共用排序偏好时索引被越界写回）
  修复自定义排序时头部操作区与歌曲时长、悬浮按钮重叠
  修复自定义排序下拖动把手压住时长与悬浮按钮、点「完成」后排序方式跳回「添加时间」
  优化
  在线播放
  降权成功时提示一次「当前音源不支持所选音质，已降至 X」，回升不提示、不重复提示
  播放模式图标与本地播放统一，不再各写一套
  播放页
  在线播放进入和退出播放页恢复封面飞入/飞出动画，与本地播放一致
  顶栏歌词
  顶栏歌词换行过场改为框架托管实现，并按设置执行上划/下划/左划/右划/淡入淡出/吸收
  顶部歌词切换动画由「外观」页签移入「歌词」页签，歌词设置页重新分块为「顶栏歌词」与「歌词显示与写入」
  歌单与排序
  歌单详情页默认排序改为「添加时间」（加入歌单时间），升降序由排序方向开关控制
  在线歌单
  订阅在线歌单的「刷新」改为真正重新从平台同步快照，此前只读取本地缓存
