ShortDescription: A music player centered on a local library with optional online features.
Description: Listenary manages and plays local music. Optional features include online search and playback, subscribed playlists, online history, and remote lyrics. Online features depend on third-party platforms and user-configured service credentials, while the local library and playback work independently.
