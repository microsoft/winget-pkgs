ShortDescription: "撮った写真の、最初の行き先。SDカードから取り込んで、数万枚の写真を並べて見る無料の写真ブラウザ。RAW・JPEG・HEIC・動画に対応。Windows / macOS、MIT ライセンス。"
Description: |-
  pictkura がするのは2つだけです。カードから写真を取り込むことと、それを見渡すこと。
  写真を現像する場所ではなく、貯めておくための道具です。
  増やさなかった機能の分は、そのまま速さに回っています。
  Rust で書いています。どこにも送りません。登録も要りません。
  クラウド上にしかないファイルを、読むために黙ってダウンロードすることもしません。
