ShortDescription: "The first stop for your photos: import from a camera card and browse tens of thousands of files. Handles RAW, JPEG, HEIC and video. Free photo manager for Windows and macOS, MIT licensed."
Description: |-
  pictkura does two things: it gets photos off a camera card, and it lets you look
  through them. It is not a place to develop photos — it is a place to keep them.
  Everything it does not do went into speed instead.

  Written in Rust. Nothing is uploaded, no account is needed, and a file that lives
  only in the cloud is never quietly downloaded to be read.
