ShortDescription: Deploy PHP and JavaScript apps to your own Linux server over SSH, straight from your desktop.
Description: |-
  StackPilot App is a desktop app that sets up and deploys to the Linux servers you already own. Point it at any Ubuntu or Debian VPS, and it provisions the server and ships your code over a normal SSH connection, straight from your machine.

  StackPilot App is not a hosting company. You bring your own VPS from any provider, and connect DigitalOcean, AWS, Vultr or Hetzner if you want to create servers from inside the app.

  Your credentials stay with you. SSH keys, root passwords, .env values and database passwords are stored in Windows Credential Manager and on your disk. They are never sent to our servers.

  Deploys you can trust. Each deploy pulls your branch, runs your build steps, switches to the new release and checks it responds before going live. If anything fails, the previous release keeps serving.

  Works with what you ship: Laravel, Symfony, WordPress, Statamic, Node.js, AdonisJS, Next.js, Nuxt and more.

  Manage the whole server: PHP and Node versions, MySQL, MariaDB and PostgreSQL databases, free SSL certificates, cron jobs, background workers, logs, metrics and backups.

  AI access over MCP: let Claude, Cursor, Copilot or any MCP client inspect servers and ship releases through typed tools with read, deploy and admin scopes. Destructive actions need a second confirmation, and every call is logged locally.

  Start with a free 14-day trial, no card needed. Then buy a one-time lifetime licence.
