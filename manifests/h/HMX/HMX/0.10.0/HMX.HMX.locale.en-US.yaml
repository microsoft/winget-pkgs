# winget DEFAULT LOCALE manifest for HMX (en-US).
#
# This is the human-facing file: the name, the licence, the one-line pitch, the
# search tags. None of these belong in the version or installer manifests, and
# `winget validate` fails the PR if they are misplaced.
#
# ShortDescription is deliberately ASCII and under winget's 80-character cap;
# the em dash the README uses is legal here but buys nothing in a package
# listing, and non-ASCII in these fields is a recurring source of PR rejections.
#
# Publisher and PackageName need not equal the folder names — winget-pkgs
# matches the *folders* against PackageIdentifier, which here is HMX.HMX, so the
# tree is manifests/h/HMX/HMX/. A real package with a human-readable Publisher
# string and a mechanical identifier (hello-efficiency-inc.raven-reader) is
# exactly the same shape.
#
# ManifestVersion 1.12.0 is the version winget-pkgs currently accepts. See hmx.yaml.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json

PackageIdentifier: HMX.HMX
PackageVersion: 0.10.0
PackageLocale: en-US
Publisher: HMX
PublisherUrl: https://github.com/himanshu-2010/hmx-lang
PublisherSupportUrl: https://github.com/himanshu-2010/hmx-lang/issues
PackageName: HMX
PackageUrl: https://github.com/himanshu-2010/hmx-lang
License: MIT
LicenseUrl: https://github.com/himanshu-2010/hmx-lang/blob/main/LICENSE
ShortDescription: A small statically typed systems language that transpiles to C
Description: |-
  HMX is a small statically typed systems language that transpiles to C.

  A program is a single .hmx file. `hmx run prog.hmx` transpiles it, hands the C
  to the system compiler and runs the result, so there is no separate runtime to
  install and the generated C is readable and greppable.

  The language has functions, structs, enums, modules, pattern matching, error
  propagation and a refcounted text runtime with automatic memory management.
Moniker: hmx
Tags:
- compiler
- systems
- transpiler
ReleaseNotesUrl: https://github.com/himanshu-2010/hmx-lang/releases/tag/v0.10.0
ManifestType: defaultLocale
ManifestVersion: 1.12.0
