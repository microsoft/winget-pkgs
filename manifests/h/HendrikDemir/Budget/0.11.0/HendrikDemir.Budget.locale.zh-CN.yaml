PackageIdentifier: HendrikDemir.Budget
PackageVersion: 0.11.0
PackageLocale: zh-CN
ShortDescription: 一款沉稳、私密的预算记账应用，入门简单，并能随需求成长。
Description: |-
  Budget 是一款面向 Windows 与 macOS 的私密本地预算记账应用。它规划你的支出，一目了然地显示剩余金额，并告诉你储蓄能否支撑未来一年。所有数据都留在你的电脑上：无需账号、无需订阅、不使用云端。应用提供英文与荷兰文界面。

  从简单开始
  - Budget 以简易模式启动，只显示预算、支出与历史记录。银行账户余额、Outlook 前瞻规划、预算结转等功能会在变得有用时逐一提供。
  - 从收入开始规划：编辑预算时会显示各项预算是否与每月收入相匹配、还能剩下多少可储蓄，并给出常见预算建议，你只需填写金额。
  - 手动记账，或导入银行导出文件（自动略过重复项），并在保存前预览还剩多少。

  扩展模式
  - 预算结转、拆分一笔消费、提前付款，以及设置安全余量。
  - 输入银行显示的余额，即可核对所有交易是否都已登记。
  - 用 Outlook 前瞻未来，用历史记录回顾每一月和每一项预算。

  你的数据
  - Budget 把数据保存在 %APPDATA%\Budget，并为每一个使用日自动备份，保留最近 14 份。
  - 「创建备份」把全部数据写入一个文件，该文件在 Windows 与 macOS 上通用，可用于换机迁移。
  - Budget 每天向 GitHub 查询一次是否有新版本，只询问 GitHub，不会发送关于你或你数据的任何内容；此检查可在设置中关闭。
