ReleaseNotes: |-
  - Budget starts simple. New users see just their budgets, what they spend and History. When something more becomes useful, like keeping your bank balance, planning ahead in the Outlook or carrying a budget over, Budget offers it, one thing at a time. Choose Simple or Extended in Settings > Mode. If you already use Budget, you keep every feature (Extended).
  - Start from your income. Edit budgets shows whether your budgets fit what comes in each month, and what's left to save. A new Budget suggests a few common budgets to start from: just fill in the amounts.
  - Budget can now be used in more languages. Dutch and English are currently supported. Budget follows your computer's language, or the one you choose in Settings > Language.
  - Small ? buttons explain words like carry over, safety buffer and free to spend in plain language.
  - Safer: only Budget's own window can use your data, so other programs on your computer can't. Names from a bank export always show as plain text.
  - The chart in History and the Outlook shows a line at the month you point at, with its details beside it instead of on top of it.
  - Update Budget on all your computers: a backup made with this version needs Budget 0.11 or later to restore it.
