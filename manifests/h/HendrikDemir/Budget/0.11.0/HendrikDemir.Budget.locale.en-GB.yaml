ShortDescription: A calm, private budget app that starts simple and grows with you.
Description: |-
  Budget is a private, local budget app for Windows and macOS. It plans what you spend, shows what is left at a glance, and tells you whether your savings will hold up in the year ahead. Your data stays on your computer: no account, no subscription, no cloud. The app is available in English and Dutch.

  Start simple
  - Budget starts in Simple mode, showing only your budgets, what you spend, and History. Features such as keeping your bank balance, planning ahead in the Outlook, or carrying a budget over are offered when they become useful, one at a time.
  - Start from your income: Edit budgets shows whether your budgets fit what comes in each month and what is left to save, and suggests common budgets so you only fill in amounts.
  - Add what you spend by hand or import your bank export, with duplicates left out and a preview of what would be left before you save.

  Extended mode
  - Carry a budget over, split a purchase, pay a bill early, and keep safety buffers.
  - Keep your balances honest by entering what your bank shows, so you can see whether every transaction is registered.
  - Look ahead with the Outlook and look back on every month and budget in History.

  Your data
  - Budget keeps your data in %APPDATA%\Budget and makes an automatic backup of each day you use it, keeping the last 14.
  - Create backup saves everything in one file that works on both Windows and macOS, so you can move to another computer.
  - Once a day Budget asks GitHub whether a new version is available. Only GitHub is asked, and nothing about you or your data is sent. The check can be turned off in Settings.
