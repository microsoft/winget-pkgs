# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# The Setup from the public release. Velopack's Setup installs per user and takes --silent, and registers its
# uninstall entry under the pack ID, Overglance.Desktop, which is what winget matches as the product code.
PackageIdentifier: hazeliscoding.Overglance
PackageVersion: 1.0.0
InstallerType: exe
Scope: user
InstallModes:
  - interactive
  - silent
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
UpgradeBehavior: install
AppsAndFeaturesEntries:
  - DisplayName: Overglance
    Publisher: Hazel Granados
    ProductCode: Overglance.Desktop
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/hazeliscoding/overglance-releases/releases/download/v1.0.0/overglance-setup-win-x64.exe
    # The overglance-setup-win-x64.exe line of that release's SHA256SUMS.
    InstallerSha256: b2d7dbf76345bb661627aa2145cea9858b5b229159511f00f6d819b633bc856b
ManifestType: installer
ManifestVersion: 1.10.0
