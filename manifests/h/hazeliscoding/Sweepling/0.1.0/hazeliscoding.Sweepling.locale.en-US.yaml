ShortDescription: Notices the processes your Claude Code sessions left running on Windows, and closes them only after you confirm.
Description: |-
  Sweepling sits in the tray and counts the processes that ended Claude Code sessions left running, such as dev servers, file watchers and scripts.
  Its window says what each one is in words, with its folder, age, port and memory, and closes the groups you tick, checking each process again right before it closes it.
  It never closes anything you haven't confirmed, and it doesn't offer anything with an open connection or a window.
