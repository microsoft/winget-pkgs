ShortDescription: A tray app that stops other apps from stealing your keyboard focus.
Description: |-
  Windows lets apps pull focus to themselves: a chat popup, an installer, a browser an agent is driving. Your next keypress lands in the wrong window. Staypaw puts focus back where it belongs.
  It protects an app you pick, keeps focus where you're typing, and holds the keys you press during a steal, so they never reach the app that took focus. Its tray menu and log name the app that did it.
  Nothing is injected into other apps, there is no telemetry, and it never stores which keys you press.
