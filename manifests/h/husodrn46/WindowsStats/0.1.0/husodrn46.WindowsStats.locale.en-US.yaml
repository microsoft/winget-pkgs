ShortDescription: Lightweight system resource widgets for the Windows 10/11 taskbar.
Description: Windows Stats displays CPU, GPU, memory, disk, network, battery and sensor
  information in the Windows taskbar. No telemetry or automatic update checks. Advanced
  hardware sensors use an optional LibreHardwareMonitor helper and may require the
  separately installed PawnIO driver. Inspired by macOS Stats and based on mgvs/winstats.
