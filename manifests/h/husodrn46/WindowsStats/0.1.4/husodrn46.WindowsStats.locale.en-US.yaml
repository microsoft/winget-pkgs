ShortDescription: Lightweight, privacy-friendly system monitor for the Windows 10/11 taskbar.
Description: |-
  Windows Stats shows CPU, GPU, memory, disk, network, battery and sensor readings as small widgets in the Windows 10/11 taskbar, with detail panels on click. It is about 2 MB, needs no administrator rights, sends no telemetry and speaks 29 languages. Inspired by Stats for macOS and based on winstats.
