ShortDescription: Live Dock Pomodoro timer for the Command Palette.
Description: Pomodoro adds a focus timer to the PowerToys Command Palette Dock. The band shows a live countdown. Focus, short break, and long break lengths are configurable. When a session ends, the timer stops and reminds you to start the break or the next focus yourself.
