ShortDescription: Open-source Windows maintenance toolbox with background queues, fast downloads, audio and disk tools.
Description: |-
  System Toolbox is a free, open-source maintenance toolbox for Windows 10/11 that consolidates system cleaning and repair, winget software installation, fast multi-threaded downloads (fastdl), audio-to-MP3 conversion, and disk/image management into one console. It offers a background task queue with concurrency and priority control, SHA-256 verified updates, and is built with C++17/20 under the MIT license.
