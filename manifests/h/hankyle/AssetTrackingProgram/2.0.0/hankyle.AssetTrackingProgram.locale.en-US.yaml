ShortDescription: Asset & Portfolio Tracking System with dynamic depreciation, stock tracking, mobile sync, and custom themes.
Description: |-
  Asset Tracking Program is a desktop wealth and asset management application built with Tauri v2 and Rust.
  Features include:
  - Fixed Asset Tracking: Dynamic straight-line depreciation, QR tag generation, and audit logging.
  - Global Portfolio Management: Real-time stock prices (TW & US markets), ROI calculations, and dividend logs.
  - Mobile Wi-Fi Sync: 2-way merge synchronization with the companion Android APK over local LAN.
  - Wealth & Financial Lab: Compounding calculator, 4% retirement rule simulator, asset rebalancing, and warranty alerts.
  - Liquid Glass UI: 6 frosted glass theme palettes with custom blur intensity.
  - 100% Local Storage: All data is saved securely on your local disk (%APPDATA%\AssetTracking\).
