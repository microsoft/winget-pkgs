ShortDescription: 高效能實體固定資產、全球證券投資、被動現金流與財務目標追蹤管理系統。
Description: |-
  資產與證券追蹤系統 (Asset Tracking Program) 是一套採用 Tauri v2 + Rust 開發的高效能財務與資產管理軟體：
  - 實體固定資產智慧折舊：直線折舊即時推算設備現值、QR 盤點標籤卡產生列印與完整審計歷史日誌。
  - 全球證券投資組合追蹤：支援台股與美股即時行情、未實現損益、ROI 報酬率與股息被動收入帳本。
  - 手機 APK 區網雙向同步：離線建檔、外出查閱，連上區網一鍵雙向智慧合併。
  - 財富實驗室：定期定額複利試算機、4% 提領退休規劃、資產再平衡與保固到期預警。
  - Liquid Glass 磨砂玻璃工坊：6 款質感主題與自訂調色盤。
  - 100% 本地硬碟安全儲存，保護個人隱私不外洩。
