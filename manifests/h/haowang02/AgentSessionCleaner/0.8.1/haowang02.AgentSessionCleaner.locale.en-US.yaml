ShortDescription: A fast, keyboard-driven terminal UI for browsing, resuming, archiving, and cleaning up your Codex, Claude Code, OpenCode, and Pi sessions.
Description: agent-session-cleaner is a fast, keyboard-driven terminal UI that browses, resumes, archives, and cleans up session history from Codex, Claude Code, OpenCode, and Pi. It lists sessions with keyboard navigation, supports drag range selection, and lets you archive or delete sessions to keep your session directories tidy.
