PackageIdentifier: Hyact.WBSwitchPlus
PackageVersion: 0.1.3
PackageLocale: en-US
ShortDescription: Desktop app for switching accounts across WorkBuddy, CodeBuddy IDE/CLI, and VS Code / JetBrains CodeBuddy plugins, with credit and token usage monitoring.
Description: WB-Switch-Plus manages multiple WorkBuddy and CodeBuddy accounts in one desktop app, supporting both the China and International editions of every client, with one-click switching, session copy, and cross-account session sync. It monitors credit balances and expiry dates, tracks token usage with trends and heatmaps, and can rotate the CLI's startup account to the one with the most remaining credit. It also ships a local OpenAI/Anthropic-compatible reverse proxy with multi-key distribution built on an account pool.
