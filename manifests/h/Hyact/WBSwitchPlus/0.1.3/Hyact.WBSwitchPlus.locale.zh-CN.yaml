ShortDescription: WorkBuddy、CodeBuddy IDE、CodeBuddy CLI 与 VS Code / JetBrains CodeBuddy 插件的账号切换桌面应用，各端均支持国内版/国际版，附积分到期与 Token 用量监控。
Description: WB-Switch-Plus 在一个桌面应用中管理多个 WorkBuddy 与 CodeBuddy 账号，覆盖各客户端的国内版/国际版，支持一键切换、会话复制与跨账号会话同步。它提供积分余额与到期监控、Token 用量趋势与热力图统计，并可自动将 CLI 启动账号轮换为剩余积分最多的账号。应用还内置一个本地 OpenAI/Anthropic 兼容反代，基于账号池实现多 Key 分发。
ReleaseNotes: |-
  0.1.3
  网页端
  - 补齐五个页面：模型目录 / 审计日志 / 管理令牌 / 管理用户 / IP 安全
