ReleaseNotes: |-
  Pilo v0.5.2
  新功能
  - 会话归档：可在桌面侧边栏和移动端 WebUI 的抽屉中归档、查看和恢复会话。归档不会删除聊天记录。
  - WebUI 外观设置：可在每个浏览器中单独设置浅色 / 深色模式和文字大小。
  - 新增 Linux 安装包：除原有的 .tar.gz 外，还提供 .deb、.rpm 和 AppImage。
  优化与修复
  - 会话切换更可靠：未发送的草稿随会话保留，切换项目或断线重连后仍可返回临时会话；只在聊天可见时标记已读。
  - 移动端输入更稳定：修复软键盘弹出、选取图片或跳到最新消息时，输入框丢失焦点或聊天列表意外滚动的问题。
  - 页面和聊天更流畅：减少 WebUI 首次打开时需要加载的内容，降低长会话历史读取和流式回复的渲染开销。
  - 工作区体验改善：改进 SSH / WSL 连接配置、远程配对、文件预览和 Git 工作区导航；修复终端复制粘贴和切换标签时丢失画面的问题。
  完整变更：v0.5.1 → v0.5.2
