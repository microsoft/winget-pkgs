ReleaseNotes: |-
  v0.3.9
  新功能
  - 默认工作区：每个连接都可在侧栏开启自己的默认工作区，不必先添加项目就能开始聊天。桌面端和 WebUI 共享显示设置，隐藏入口不会删除历史会话。
  - Windows 只读屏幕共享：在主机的远程访问设置中开启后，已配对设备可通过 WebUI 查看屏幕，支持切换显示器和缩放画面，不提供远程控制。
  - WebUI 移动端滑动导航：可以滑动打开或关闭导航，拖动时会实时预览。
  - 快速打开：除了编辑器，还可使用文件管理器、终端等应用打开项目或文件所在目录，可用应用因平台而异。
  优化与修复
  - 修复聊天中用量更新可能覆盖时间戳的问题，让消息时间和回复耗时显示更准确。
  - Windows 端现在能识别在 Pilo 外部运行的 Pi 会话活动，并改善了终端的 UTF-8 输出兼容性。
  - 改善 Windows 项目路径的显示，并降低界面焦点描边的视觉干扰。
  完整变更：https://github.com/hsingjui/pilo/compare/v0.3.8...v0.3.9
