ReleaseNotes: |-
  v0.3.6
  新功能
  - 新增“关闭主窗口时退出程序”设置，可选择直接退出或保持原有后台运行行为。
  优化与修复
  - 改善桌面端与 WebUI 的流式回复自动滚动，减少内容增长及回复结束时的跳动。
  - 优化聊天输入框高度计算，避免输入时影响会话滚动位置。
  - 远程访问地址优先展示局域网地址，改善远程设置页面的滚动体验。
  - 修复 macOS 下 SSH 凭据无法持久保存的问题，使用系统钥匙串存储。
  - 修复手动停止回复后，可复用请求被清除、导致缓存保活无法继续的问题。
  开发体验
  - 修复 Windows 开发模式清理已退出进程时的报错。
