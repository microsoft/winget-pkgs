ReleaseNotes: |-
  新功能
  - 支持自定义主题，桌面端与 WebUI 同步主机外观设置
  - 新增开发者模式，启用后可按 F12 打开当前桌面窗口的开发者工具
  - 优化提示词建议采纳：焦点未落在其他控件时，也可按 Tab 填入建议并聚焦输入框，不会自动发送
  优化与修复
  - 改善图片缩放与拖动手势、移动端触控体验，并适配减少动态效果设置
  - 修复中断回复后立即发送消息时的状态切换问题
  - 修复切换会话后提示词建议状态丢失的问题
  - 支持恢复缺少会话头的历史记录，删除会话前先停止关联运行时
  - 改善 WebSocket 保活与上下文压缩提示
  - 精简更新日志弹窗，优化输入框引用标签对齐
  - 桌面日志改用本地时区
