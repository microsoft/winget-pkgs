ShortDescription: 一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
Description: |-
  星枢终端（Nexus Terminal）是一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
  功能特性
  - 多标签页管理 SSH 与 SFTP 连接
  - 支持 RDP/VNC 协议
  - 支持 PWA
  - 采用 Monaco Editor，支持在线编辑文件
  - 集成多重登录安全机制，包括人机验证（hCaptcha、Google reCAPTCHA）与双因素认证（2FA）
  - 高度可定制的界面主题与布局风格
  - 内置简易 Docker 容器管理面板，便于容器运维
  - 支持 IP 白名单与黑名单，异常访问自动封禁
  - 通知系统（如登录提醒、异常告警）
  - 审计日志，全面记录用户行为与系统变更
  - 基于 Node.js 的轻量级后端，资源占用低
  - 内置心跳保活机制，确保连接稳定
Tags:
- ftp
- rdp
- sftp
- ssh
- telnet
- vnc
- 服务器
- 远程
ReleaseNotes: |-
  Warning
  部署方式改变：4 个容器合并成 1 个
  升级前请重新下载下面两个文件
  - docker-compose.yml
  - .env
  旧的 heavrnl/nexus-terminal-frontend / -backend / -remote-gateway 三个镜像已停止更新，请改用 heavrnl/nexus-terminal。
  新增功能：
  - 远程桌面：RDP / VNC 改为浏览器直连，不再需要 guacd 与 remote-gateway
  - 远程桌面：并入会话标签，画面占满工作区；支持 Ctrl+Alt+Del、剪贴板、输入、全屏、重连
  - 新增 arm64 镜像（amd64 + arm64 多架构同时发布）
  - 文件管理器：搜索栏「固定」状态改为跨端同步
  修复：
  - 终端偶尔多出 / 重复行（TUI 重绘后会残留）
  优化：
  - 安全：跟随 2026-10 Node 安全公告，修掉匿名可达的 Brotli 解码器漏洞（CVE-2026-111497）
  - 容器基础镜像从已 EOL 的 node:20 升到 22.23.4
  - 终端分块输出切断中文 / emoji 时不再出现乱码
  Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.10...v0.9.11
