ShortDescription: 一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
Description: |-
  星枢终端（Nexus Terminal）是一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
  功能特性
  - 多标签页管理 SSH 与 SFTP 连接
  - 支持 RDP/VNC 协议
  - 支持 PWA
  - 采用 Monaco Editor，支持在线编辑文件
  - 集成多重登录安全机制，包括人机验证（hCaptcha、Google reCAPTCHA）与双因素认证（2FA）
  - 高度可定制的界面主题与布局风格
  - 内置简易 Docker 容器管理面板，便于容器运维
  - 支持 IP 白名单与黑名单，异常访问自动封禁
  - 通知系统（如登录提醒、异常告警）
  - 审计日志，全面记录用户行为与系统变更
  - 基于 Node.js 的轻量级后端，资源占用低
  - 内置心跳保活机制，确保连接稳定
Tags:
- ftp
- rdp
- sftp
- ssh
- telnet
- vnc
- 服务器
- 远程
ReleaseNotes: |-
  新增功能：
  - 文件管理器：桌面端可以直接用系统默认程序打开远程文件，本地改完保存后自动回传；有冲突会弹提示
  - 文件管理器：搜索栏支持「固定」，固定后常驻显示，不用每次点顶栏的搜索按钮（仅桌面端）
  - 文件管理器：打开 3MB 以上的文件前会先询问，可勾「记住（以后不再提示）」，设置里也能重新打开
  - 终端搜索：新增「全部 / 当前」双高亮、滚动条上的命中标记、结果计数
  - 终端搜索：点搜索按钮后自动聚焦到输入框
  - 移动端：虚拟键盘改成 QWERTY 布局，字母默认小写
  - 快捷指令：变量没填时先弹窗补填，填完再发送（桌面卡片和移动端抽屉都支持）
  - 设置：文件列表变动高亮可以关闭
  - 会话标签右键菜单新增「编辑连接」
  修复：
  - 打开大文件时正常下载却被超时截断
  - 移动端文件管理器跑出一个「错位的搜索框」
  - 文件管理器在刷新窗口内点击被吞掉、切换目录时旧响应把路径顶回去
  - 终端断线或分屏关闭后卡在 TUI 备用屏，滚动条消失且滚不上去
  - 终端搜索的高亮框遇到宽字符会累积偏移
  - SFTP「路径不存在」判定误报，导致移动/重命名前的目标探测误判
  - 侧栏文件管理器重开后丢缓存，一直转「正在加载」
  - 外观自定义窗口背后多余的黑遮罩
  - 终端搜索的三个筛选按钮不等边
  - 日语语言包重复键与缺失文案
  优化：
  - 终端大流量输出不再卡主线程（快照序列化 900ms → 3ms）
  - 终端搜索高亮改自研实现，5000 行搜索不再卡主线程
  - 工作区快照上传改走 gzip 压缩流，请求体降到约 1/8
  - 快照不再重复保存主终端内容，体积减半
  - 搜索命中标记改半透明，滑块提到最上层
  - 内部整理：布局 / 同步 / 快捷指令 / 设置项大量拆分与收敛（新增设置项从改 8 个文件降到 2 个）
