ShortDescription: 一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
Description: |-
  星枢终端（Nexus Terminal）是一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
  功能特性
  - 多标签页管理 SSH 与 SFTP 连接
  - 支持 RDP/VNC 协议
  - 支持 PWA
  - 采用 Monaco Editor，支持在线编辑文件
  - 集成多重登录安全机制，包括人机验证（hCaptcha、Google reCAPTCHA）与双因素认证（2FA）
  - 高度可定制的界面主题与布局风格
  - 内置简易 Docker 容器管理面板，便于容器运维
  - 支持 IP 白名单与黑名单，异常访问自动封禁
  - 通知系统（如登录提醒、异常告警）
  - 审计日志，全面记录用户行为与系统变更
  - 基于 Node.js 的轻量级后端，资源占用低
  - 内置心跳保活机制，确保连接稳定
Tags:
- ftp
- rdp
- sftp
- ssh
- telnet
- vnc
- 服务器
- 远程
ReleaseNotes: |-
  新增功能：
  - 连接编辑：新增「启动命令」，连上终端后自动执行。与布局里给窗格配置的「自启指令」互相独立，两边都配置就都执行
  - 文件管理器：新增 SFTP sudo 提权。用 sudo 启动 sftp-server，让文件通道以 root 权限运行，可以直接浏览、编辑 /root、/etc 这类只有 root 能碰的路径，不用把整个账号提成 root。默认开启，密码可不填（走服务器的免密 sudo）；提权不成功会自动退回普通权限，原来的读写不受影响
  What's Changed
  - build(deps)(deps): bump the production-dependencies group with 6 updates by @dependabot[bot] in https://github.com/Heavrnl/nexus-terminal/pull/152
