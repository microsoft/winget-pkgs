ShortDescription: 一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
Description: |-
  星枢终端（Nexus Terminal）是一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
  功能特性
  - 多标签页管理 SSH 与 SFTP 连接
  - 支持 RDP/VNC 协议
  - 支持 PWA
  - 采用 Monaco Editor，支持在线编辑文件
  - 集成多重登录安全机制，包括人机验证（hCaptcha、Google reCAPTCHA）与双因素认证（2FA）
  - 高度可定制的界面主题与布局风格
  - 内置简易 Docker 容器管理面板，便于容器运维
  - 支持 IP 白名单与黑名单，异常访问自动封禁
  - 通知系统（如登录提醒、异常告警）
  - 审计日志，全面记录用户行为与系统变更
  - 基于 Node.js 的轻量级后端，资源占用低
  - 内置心跳保活机制，确保连接稳定
Tags:
- ftp
- rdp
- sftp
- ssh
- telnet
- vnc
- 服务器
- 远程
ReleaseNotes: |-
  Warning
  自 v0.9.11 起部署方式改变：4 个容器合并成 1 个
  升级前请重新下载下面两个文件
  - docker-compose.yml
  - .env
  旧的 heavrnl/nexus-terminal-frontend / -backend / -remote-gateway 三个镜像已停止更新，请改用 heavrnl/nexus-terminal。
  新增功能：
  - 数据导入导出重做
  - 桌面端：首次启动自动建好 admin 账号，不再走建账号向导；没设置密码时打开软件就是登录状态
  - 文件权限：支持勾选权限位批量修改，并可改所有者 / 所属组
  - 文件管理器：新增隐藏文件快捷开关
  - 连接编辑器：文件夹搬进「基本信息」卡片，选密钥时就地新建并随连接自动保存
  - 脚本批量导入重做：粘贴即实时预检，语法错误折叠提示
  - 文件传输：进度卡片显示「源服务器 → 目标服务器」与两端路径
  - 新增 Gotify 通知渠道
  修复：
  - 文件传输：「发送到另一个服务器」把目录摊平成内容，不保留文件夹层级
  优化：
  - 文件传输进度弹窗重做视觉与信息结构，源/目标一眼能分清
  - 目标机缺 rsync 时自动安装，不再中断
  - 连接编辑器的分区卡片用底色区分，已有密钥改为下方下拉选择
  Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.12...v0.9.13
