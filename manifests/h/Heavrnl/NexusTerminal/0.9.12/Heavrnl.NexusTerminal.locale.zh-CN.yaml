ShortDescription: 一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
Description: |-
  星枢终端（Nexus Terminal）是一款现代化、功能丰富的 Web SSH / RDP / VNC 客户端，致力于提供高度可定制的远程连接体验。提供独立的本地桌面端。
  功能特性
  - 多标签页管理 SSH 与 SFTP 连接
  - 支持 RDP/VNC 协议
  - 支持 PWA
  - 采用 Monaco Editor，支持在线编辑文件
  - 集成多重登录安全机制，包括人机验证（hCaptcha、Google reCAPTCHA）与双因素认证（2FA）
  - 高度可定制的界面主题与布局风格
  - 内置简易 Docker 容器管理面板，便于容器运维
  - 支持 IP 白名单与黑名单，异常访问自动封禁
  - 通知系统（如登录提醒、异常告警）
  - 审计日志，全面记录用户行为与系统变更
  - 基于 Node.js 的轻量级后端，资源占用低
  - 内置心跳保活机制，确保连接稳定
Tags:
- ftp
- rdp
- sftp
- ssh
- telnet
- vnc
- 服务器
- 远程
ReleaseNotes: |-
  Warning
  自 v0.9.11 起部署方式改变：4 个容器合并成 1 个
  升级前请重新下载下面两个文件
  - docker-compose.yml
  - .env
  旧的 heavrnl/nexus-terminal-frontend / -backend / -remote-gateway 三个镜像已停止更新，请改用 heavrnl/nexus-terminal。
  新增功能：
  - 会话标签右键菜单新增「断开连接 / 重新连接」
  - 远程桌面：RDP / VNC 支持 SOCKS5 与 HTTP 代理
  - 文件管理器：路径收藏支持收藏文件，点击直接用编辑器打开
  - 桌面端：安装程序跟随系统语言（简繁中文 / 英 / 日 / 韩 / 德 / 法 / 西 / 俄）
  修复：
  - 导航栏底部的滑动下划线刷新后错位
  - 移动端：自定义工具栏长按卡片会往下跳一行
  优化：
  - Docker：进入容器时自动探测容器里的 shell
  - 下拉框统一成自绘组件，展开的选项列表也跟随深浅色主题
  - 内部整理：切屏静默刷新统一收口，有数据就不再翻加载态
  What's Changed
  - build(deps)(deps): bump @types/multer from 1.4.13 to 2.3.0 by @dependabot[bot] in https://github.com/Heavrnl/nexus-terminal/pull/141
  - build(deps)(deps): bump ipaddr.js from 1.9.1 to 2.5.0 by @dependabot[bot] in https://github.com/Heavrnl/nexus-terminal/pull/137
  - build(deps)(deps-dev): bump @vitejs/plugin-vue from 5.2.4 to 6.0.10 by @dependabot[bot] in https://github.com/Heavrnl/nexus-terminal/pull/140
  Full Changelog: https://github.com/Heavrnl/nexus-terminal/compare/v0.9.11...v0.9.12
