ReleaseNotes: "## Added\n• Vim-like command completion by pressing <kbd>Tab</kbd>\n• Support Vim-style numeric count prefixes for keybindings (e.g. `10j` moves\n  down 10 rows); the pending count is shown in the status bar\n• Add a `proxy` configuration option that routes all of ncspot's network\n  traffic (access point, Spotify APIs, OAuth and cover art downloads) through\n  a single proxy. Supports HTTP CONNECT proxies and SOCKS5 proxies with\n  remote DNS resolution (`socks5h://`), both with optional credentials.\n  Without this option, the `http_proxy` environment variable is still\n  honoured as before.\n• Replace already existing queue notifications instead of stacking new ones.\n\n## What's Changed\n• chore(deps)：bump log from 0.4.33 to 0.4.34 in the cargo group by @dependabot[bot] in https://github.com/hrkfdn/ncspot/pull/1865\n• chore(toolchain)：update by @hrkfdn in https://github.com/hrkfdn/ncspot/pull/1864\n• chore(toolchain)：update by @hrkfdn in https://github.com/hrkfdn/ncspot/pull/1869\n• chore(deps)：bump toml from 1.1.4+spec-1.1.0 to 1.1.5+spec-1.1.0 in the cargo group by @dependabot[bot] in https://github.com/hrkfdn/ncspot/pull/1868\n• chore(deps)：bump the cargo group across 1 directory with 5 updates by @dependabot[bot] in https://github.com/hrkfdn/ncspot/pull/1873\n• Add a unified proxy configuration option by @VIIII4 in https://github.com/hrkfdn/ncspot/pull/1876\n• chore(deps)：bump rand from 0.10.2 to 0.10.3 in the cargo group across 1 directory by @dependabot[bot] in https://github.com/hrkfdn/ncspot/pull/1877\n• feat：support Vim-style numeric count prefixes for keybindings by @aw-snap in https://github.com/hrkfdn/ncspot/pull/1872\n• chore：replace notifications instead of stack by @0xk1f0 in https://github.com/hrkfdn/ncspot/pull/1870\n• feat：vim-style command completion by @koloiyolo in https://github.com/hrkfdn/ncspot/pull/1863\n• chore：Prepare for 1.5.0 release by @hrkfdn in https://github.com/hrkfdn/ncspot/pull/1878\n\n## New Contributors\n• @VIIII4 made their first contribution in https://github.com/hrkfdn/ncspot/pull/1876\n• @aw-snap made their first contribution in https://github.com/hrkfdn/ncspot/pull/1872\n• @0xk1f0 made their first contribution in https://github.com/hrkfdn/ncspot/pull/1870\n• @koloiyolo made their first contribution in https://github.com/hrkfdn/ncspot/pull/1863\n\n**Full Changelog**：https://github.com/hrkfdn/ncspot/compare/v1.4.0...v1.5.0"
