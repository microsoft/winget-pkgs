PackageIdentifier: Hnode.MiniTerm
PackageVersion: 0.1.0-alpha.6
PackageLocale: ko-KR
Publisher: Hnode
PackageName: MiniTerm
ShortDescription: Windows 11용 지속되는 네이티브 Bash 미니 터미널.
Description: |-
  작은 데스크톱 터미널에서 Bash 세션과 CLI 에이전트를 계속 실행합니다.
  ANSI 스타일, 작업 요약, 명시된 계획의 진행률과 알림 연결을 제공합니다.
  테스터용 알파이며 Git Bash 크기 변경 직후 입력 누락과 성능상의 제약이 남아 있습니다.
