ShortDescription: "Windows desktop client for Málkelda: local source discovery, synchronization, observation packages and approved releases."
Description: |-
  Málkelda Brúgv is the Windows desktop client for Málkelda, a local-first system for approved terminology,
  UI texts and documentation. It scans a software repository with the project's own adapters, reports exactly
  what it found and what it did not, and writes one validated observation package. After explicit confirmation
  it sends that package to a Málkelda installation, and it can retrieve an approved release, verify it and apply
  it to the repository or to the static HTML pages the project records. It works with any Málkelda installation
  the operator names, whether Hugsa-hosted or self-hosted; access is authorized through the normal browser
  sign-in and the credential is kept in Windows Credential Manager rather than in a file. Documentation
  generation is optional, runs only when started, and requires the operator's own DeepSeek API key and explicit
  consent; no key is bundled. The installer is not code signed.
