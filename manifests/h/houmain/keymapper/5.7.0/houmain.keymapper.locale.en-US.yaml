ReleaseNotes: |-
  Added
  - Allowed to run alongside Karabiner-Elements (#376).
  - Allowed timeouts after key release in input expression. e.g.:
    # Turn A to C when B quickly follows release of A
    !A !250ms B >> Backspace C

  Changed
  - Updated Karabiner-DriverKit-VirtualHIDDevice to version v8.2.0 (#384, #389).
  - Disallowed opening modifier groups twice, as this has no effect. e.g. A{{B}}.

  Fixed
  - Improved mouse hooking efficiency on Windows (#383, #184).
  - Improved process spawning efficiency on Windows (#383).
  - Prevented handle leaking into child processes spawned by $(...) on Linux, which caused "Binding control port failed" errors after restart (#388).
