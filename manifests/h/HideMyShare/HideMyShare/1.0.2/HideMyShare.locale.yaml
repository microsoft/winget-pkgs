ShortDescription: Hide any app window from screen shares, recordings, and streams.
Description: |-
  HideMyShare hides selected application windows from all screen capture on Windows —
  live screen shares (Zoom, Microsoft Teams, Google Meet, Discord), screen recordings,
  screenshots, and streams (OBS) — while the windows stay fully visible and usable on
  your own monitor.

  Built on the Windows API SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE), enforced
  by the operating system itself: no meeting app can capture a hidden window, because
  the exclusion happens before capture. One click to hide, one click to restore.
  Also hides the IME candidate window (Chinese/Japanese/Korean input pop-ups) that
  can leak what you type. No account, no credit card for the 7-day trial.
