ShortDescription: Whole-disk file search for Windows, with a search bar on Alt+Shift+Space.
Description: |-
  Scry finds any file on your fixed drives by name in about a millisecond, forgives typos, and searches inside your text files with an index that it keeps current as files change.
  Press Alt+Shift+Space anywhere for a search bar. A tray icon shows the index status and lets you choose the folders whose contents are searched and the folders left out. The scry command searches from a terminal.
