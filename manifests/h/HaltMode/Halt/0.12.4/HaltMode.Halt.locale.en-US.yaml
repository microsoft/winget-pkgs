ShortDescription: Website and app blocker for Windows, with a lock you can't stop early.
Description: |-
  Halt blocks distracting websites in Chrome, Edge, Brave and Firefox through the browsers' own policy settings, so there's no extension to switch off, and closes blocked apps and games.
  With the Timer lock, Stop is refused, and restarting, changing the clock or uninstalling won't end a session early.
  Also: daily time limits for sites and apps, one switch for YouTube Shorts and Instagram and Facebook Reels, an adult content filter for the whole PC, schedules and Lock this PC.
