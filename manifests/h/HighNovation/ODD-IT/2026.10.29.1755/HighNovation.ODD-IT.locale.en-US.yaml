PackageLocale: en-US
Publisher: High-novation
PackageName: ODD-IT
ShortDescription: Accounting data audit tools, right inside Excel
Description: |-
  ODD-IT is an Excel add-in for accountants and auditors: import and checks
  of the French audit file (FEC), pivot-table trial balances, duplicates,
  sequence gaps, Benford's law, journal entry testing, materiality,
  statistical sampling and stratification, monetary unit sampling, sheet
  comparison, VAT rate per entry. Every result is a sheet linked to its
  source, formatted with the firm's template. French interface.
  Requires Microsoft Excel 2010 or later, 32- or 64-bit.
