ShortDescription: L'audit des données comptables, directement dans Excel
Description: |-
  ODD-IT est un complément Excel pour les experts-comptables, les commissaires
  aux comptes et les auditeurs : import et contrôle du FEC, balances en
  tableaux croisés, doublons, ruptures de séquences, loi de Benford, écritures
  à risque, seuil de signification, échantillonnage statistique et
  stratification, sondage sur les unités monétaires, comparaison de feuilles,
  taux de TVA par écriture. Chaque résultat est une feuille reliée à sa
  source, habillée au modèle du cabinet. Interface en français.
  Nécessite Microsoft Excel 2010 ou plus récent, 32 ou 64 bits.
