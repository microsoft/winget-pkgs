ShortDescription: Unzip huge ZIP files on a nearly full disk by freeing the space of each extracted part as it goes.
Description: |-
  Inplace-Unpack extracts a ZIP in the order the files sit inside it and hands the already extracted
  parts of the archive back to the file system (NTFS sparse files). You only need about as much free
  space as the ZIP itself, not double. Crash-safe and resumable, with a check before anything is
  touched. Supports split ZIPs (.zip.001, .002, ...). Warning: the ZIP is consumed while extracting.
Moniker: inplace-unpack
