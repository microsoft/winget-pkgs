ReleaseNotes: |-
  Highlights

  Project Trust Confirmation for Safe Workspaces
  Opening untrusted projects should never silently run unknown configurations. When opening a repository that defines custom agents, MCP servers, or project-local extensions through the UI, AiderDesk now presents a trust confirmation dialog. You can inspect the configured agents, tools, and extensions before granting permissions.
