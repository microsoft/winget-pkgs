ShortDescription: Turn PowerPoint or PDF decks into narrated training videos and SCORM 1.2 courses on your Windows PC.
Description: |-
  Insight Training Studio turns a PowerPoint or PDF deck into a narrated training video on your Windows PC. Speaker notes become the narration, captions are generated for you, and the result exports as an MP4 or as a SCORM 1.2 course for your LMS.
  - Narration and captions in 47 languages
  - Narration is generated on your PC by default (VOICEVOX for Japanese when installed, Windows voices for other languages); cloud voices are used only when you select and confirm them
  - Three narration sources: on-device text-to-speech, your own recorded voice, or imported audio
  - Reproduces PowerPoint entrance animations (requires PowerPoint installed)
  - SCORM 1.2 export with captions; completion is recorded when at least 95% of the video has been played
  - Screen recording and step capture for software walkthroughs
  A 30-day full-feature trial starts automatically when you install, with no registration or key. After that the app continues as a limited free version; continued full use requires an annual subscription license.
