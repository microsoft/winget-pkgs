ShortDescription: Run Python scripts on Windows with Python and the Excel, Word, PowerPoint, PDF and desktop-automation libraries built in.
Description: |-
  InsightPy is a Windows app with Python built in. Paste a script (for example one written by ChatGPT or Claude), press Run, and schedule it to run unattended. No Python install, pip or PATH setup is needed.
  - Bundled libraries include openpyxl and xlsxwriter (Excel), python-docx (Word), python-pptx (PowerPoint), pypdf (PDF), pandas, numpy, matplotlib, requests, BeautifulSoup, lxml, pywinauto, pyautogui, selenium and Pillow
  - Step-by-step execution with variable inspection, and syntax and common-mistake checks before you run
  - Schedules (daily, weekdays, weekly, monthly, every N minutes) and folder watching, run by Windows Task Scheduler while you are signed in
  - Run history with success rate, duration and consecutive failures, exportable to CSV
  - 28 bundled samples and 78 built-in lessons (English and Japanese)
  - Optional in-app AI features use your own API key from Anthropic, OpenAI or Google; requests go directly to that provider
  A 30-day full-feature trial starts automatically when you install, with no sign-up or license key. After that, personal learning and private use continue on the Free plan; use at work or in an organization, unattended runs and the in-app AI features require a license.
