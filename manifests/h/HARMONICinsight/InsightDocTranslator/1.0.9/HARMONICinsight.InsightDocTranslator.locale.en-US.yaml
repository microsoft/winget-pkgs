ShortDescription: Translate Word, Excel, PowerPoint and PDF files into 47 languages with the layout intact, using your own translation API key.
Description: |-
  Insight Doc Translator translates Word, Excel, PowerPoint, PDF, text and CSV files into 47 languages with the layout kept intact. Open a file, pick the languages, and get a translated copy you can distribute.
  - Supported formats: .docx, .xlsx, .xls, .pptx, .pdf, .txt, .csv (legacy .doc is not supported)
  - Review source and translation side by side and edit in place
  - Export translated PowerPoint decks as PDF for phones and tablets
  - An "untranslated: N" count after every job, per file for batch jobs
  - Glossaries and translation memory for consistent terminology
  - Batch-translate many files, or one file into several languages
  Bring your own API key: text is sent from your PC directly to the translation engine you choose and does not pass through the publisher's servers. Fees charged by that engine are separate.
  A 30-day full-feature trial starts automatically when you install, with no registration or key. After that the app continues as a limited free version; continued use requires an annual subscription license.
