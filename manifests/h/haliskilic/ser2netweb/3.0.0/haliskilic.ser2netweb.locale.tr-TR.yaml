ShortDescription: 'Web arayüzlü seri port - ağ köprüsü: raw TCP, telnet, RFC 2217, UDP, Modbus geçidi, MQTT'
Description: |-
  ser2netweb yerel seri portları (RS-232 / RS-485, USB dönüştürücüler) ağ üzerinden raw TCP, telnet, RFC 2217 ya da UDP olarak paylaşır, Modbus RTU/TCP geçidi çalıştırır, seri verileri ve Modbus noktalarını MQTT'ye ve Sparkplug B'ye yayınlar. Hepsi tarayıcıdan kurulur ve izlenir: hesaplar, roller, denetim kaydı, TLS, LDAP / OpenID Connect ile giriş. Konsol penceresinde ya da Windows servisi olarak çalışır.

  ser2netweb bağımsız bir projedir; Corey Minyard'ın ser2net'iyle bir bağlantısı yoktur.
InstallationNotes: 'Başlatmak için: ser2netweb (ilk çalıştırma web arayüzünün adresini sorar). Windows servisi olarak: yönetici olarak açılmış bir komut isteminde ''ser2netweb --install-service'' komutunu çalıştırın, her yükseltmeden sonra yeniden (servis kendi kopyasını, C:\Program Files\ser2netweb içindekini çalıştırır). Verisini nerede tuttuğu: https://github.com/haliskilic/ser2netweb/blob/main/docs/WINDOWS.md'
