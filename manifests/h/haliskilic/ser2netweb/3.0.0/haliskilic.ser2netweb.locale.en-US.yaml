ShortDescription: 'Serial-to-network bridge with a web UI: raw TCP, telnet, RFC 2217, UDP, Modbus gateway, MQTT'
Description: |-
  ser2netweb shares local serial ports (RS-232 / RS-485, USB adapters) over the network as raw TCP, telnet, RFC 2217 or UDP, runs a Modbus RTU/TCP gateway and publishes serial data and Modbus points to MQTT and Sparkplug B, all set up and watched in a browser, with accounts, roles, an audit log, TLS and LDAP / OpenID Connect sign-in. It runs in a console window or as a Windows service.

  ser2netweb is an independent project, unrelated to Corey Minyard's ser2net.
