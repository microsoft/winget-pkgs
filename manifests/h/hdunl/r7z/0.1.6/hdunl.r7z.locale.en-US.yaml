ShortDescription: A fast archiver for Windows, written in Rust. Opens what 7-Zip opens, writes 7z, zip and tar.
Description: |-
  r7z is a 7-Zip alternative with a command line tool that takes 7-Zip's commands and switches,
  and a desktop app with image and code previews, a space map, undo for extractions, safety
  checks before extracting, and an Explorer right-click menu (including Windows 11's main menu).
  Extraction is several times faster than 7-Zip on archives with many small files.
