ReleaseNotes: |-
  Highlights
  - Weekly 2026.37 release for web and desktop from the same source revision.
  Modeling, drawing and annotation
  - Update codec and kernel dependencies
  - Handle spatial division curve edge cases
  - Update cadkernel for spatial angle bisectors
  - Update cadkernel for spline editing
  - Update curve editing dependencies
  - Update drawing command dependencies
  Rendering, plotting and file fidelity
  - Render procedural checker materials correctly
  - Tell the user when the scene is drawn without a GPU
  - render shaped cursive glyphs for arabic and complex scripts
  - i18n(tr): shorten shaded render mode labels
  - translate render mode choices
  - render wide polyline segments as flat 2D rectangles instead of rounded pill shapes
  Interface, web and plugins
  - Translate Measure ribbon label
  - Show the exact build in About, Copy Info, REPORT and --version
  - introduce standardized 25-metric CAD and UI benchmark suite
  - Move parametric tools to their own ribbon tab
  - Simplify Modify ribbon extensions
  - Align and compact Draw popup with theme accent border
  Maintenance
  - Use a centered triangular ruler for measurement tools
  - Remove implicit sketch constraint inference
  - clean up mobile sponsor artwork
  - add mobile sponsor banner
  - Improve command workflow for undo, move, stretch and fillet
  - keep hidden-border content visible
