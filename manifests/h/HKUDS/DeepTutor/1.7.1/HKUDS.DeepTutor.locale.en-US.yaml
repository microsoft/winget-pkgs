ShortDescription: Desktop app that runs DeepTutor, an agent-native open-source personalized tutor, with a bundled runtime.
Description: |-
  Open DeepTutor is a double-clickable desktop app for DeepTutor, an agent-native, open-source personalized learning companion. On first launch it installs its bundled runtime, starts the Python and Node services on loopback, and opens the complete DeepTutor web UI in its window. Users need no terminal, Python, Node, npm, Git or source checkout.
  An open-source, agent-native learning companion: Home, Learning, and Resources organized by workspace, with Partners and Personalization shared across your workspaces. Chat, Calendar, Notebook, Learning and Resources follow your active workspace, while Partners and Personalization belong to your account, ready to support another subject without mixing its materials.
  Separate subjects and projects into workspaces and keep each one's conversations, learning, and resources together. Ask with context, pick a mode, and let one agent loop use your tools, skills, and sources. Turn sources into your own pages and discuss a passage with evidence from Favorites.
