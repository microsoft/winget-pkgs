ShortDescription: 在桌面端运行 DeepTutor 的应用，自带运行时，无需额外配置环境。
Description: |-
  Open DeepTutor 是 DeepTutor 的双击即可使用的桌面应用。DeepTutor 是一款 agent-native 的开源个性化学习伴侣。首次启动时它会自动安装内置运行时，在本机回环地址上启动 Python 与 Node 服务，并在应用窗口里打开完整的 DeepTutor 网页界面，用户不需要终端、Python、Node、npm、Git 或源码检出。
  开源、agent-native 的个性化学习伴侣：主页、学习、资料按工作区组织，伙伴与个性化跨工作区复用。对话、日历、笔记本、学习和资料跟随当前工作区；伙伴与个性化属于账户，切换科目时可以复用熟悉的助手，同时让各项目的材料保持清晰。
  把不同科目和项目分开成工作区，各自的对话、学习与资料互不混淆。带着上下文提问，选择模式，让一个 agent 循环使用你的工具、技能与资料。把资料变成你自己的页面，并结合收藏中的证据讨论文段。
