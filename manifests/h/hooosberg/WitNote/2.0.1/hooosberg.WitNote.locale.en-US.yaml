ReleaseNotes: |-
  WitNote v2.0.1 (Build 1)
  WitNote officially releases v2.0.1 (Build 1)! This release stays true to our core philosophy — "Smart Core, Simple Form" — bringing comprehensive security hardening, enhanced LaTeX math rendering, and multi-architecture binary distribution for Windows and Linux.

  🚀 Key Highlights & Improvements

  1. 🛡️ Comprehensive Security Hardening & Safe External Links
  - DOMPurify Sanitization: All Markdown preview and AI message rendering outputs are now thoroughly sanitized via DOMPurify.sanitize(), eliminating any risk of DOM-based XSS attacks attempting to exploit local IPC filesystem APIs.
  - Default Browser Link Handling: Fixed an issue where clicking links inside the Markdown preview navigated within the app window. All external http:// / https:// links are now safely opened in the user's default system browser.

  2. 🧮 Robust Multi-Line LaTeX Math Rendering (Issue #14)
  - Fully redesigned the Markdown + LaTeX pipeline with formula pre-extraction protection. Complex multi-line equations, alignment environments (\begin{aligned}), matrices, and special symbols (&, \\\\, _) are now rendered with 100% precision with KaTeX.

  3. 💬 Quick One-Click Chat Clear (Issue #18)
  - Added an instant "Clear Chat" button directly on the AI status bar, allowing users to start a clean session with one click and avoid context pollution across multiple topics.

  4. 🧹 Engine Streamlining
  - Streamlined experimental built-in engines to reduce package bloat, focusing deeply on Ollama (local powerful models) and Cloud API (DeepSeek, OpenAI, Gemini, etc.).

  🍎 Platform Architecture & Download Guide
  - 🍎 Apple Platforms (macOS / iOS / iPadOS):
    - WitNote for Apple devices has transitioned to a 100% pure native architecture written in Swift & SwiftUI, deeply leveraging Apple Silicon hardware acceleration and macOS energy-efficiency frameworks for instant cold-starts and smooth performance.
    - macOS users are strongly encouraged to download directly from the Mac App Store with automatic updates and sandbox security.
  - 🪟 Windows & 🐧 Linux Users:
    - Pre-built binary packages natively support both x86_64 and ARM64 architectures (see Assets below).

  📦 Binary Assets
  - Windows:
    - WitNote-2.0.1-setup-x64.exe (Standard x64 PCs)
    - WitNote-2.0.1-setup-arm64.exe (ARM64 Snapdragon / Surface PCs)
  - Linux:
    - WitNote-2.0.1-x86_64.AppImage (Universal AppImage)
    - WitNote-2.0.1-amd64.deb (Ubuntu / Debian x64)
