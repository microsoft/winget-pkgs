ShortDescription: The runtime your coding agents live on. It holds real terminals open on your laptop, your desktop or a box you rent, so the work survives the lid closing and you can attach again from anything with a keyboard.
Description: 'herdr is a background server; the terminals live inside it. Close the lid, drop the network, or restart the machine; agents keep working and sessions come back, and you can reattach from any terminal or over SSH. Every pane is marked working, blocked, or idle, so you never have to hunt for the stuck agent. Agents drive herdr through the CLI and a socket API: they can spawn panes, prompt each other, and wait until another agent is genuinely blocked. herdr runs what you already run: Claude Code, Codex, Cursor, OpenCode, Grok and the rest. It does not wrap or replace them; it owns their terminals. Keyboard and mouse are both first-class, and plugins extend panes and workflows. One Rust binary, no Electron.'
