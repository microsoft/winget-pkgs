ShortDescription: 智能体复用器，住在你的终端里。在笔记本电脑、台式机或租用的服务器上保持真实终端持续运行，合上盖子工作也不会中断，可用任何带键盘的设备重新连接。
Description: herdr 是一个后台服务器，终端都运行在它里面。合上盖子、断网或重启机器，智能体都会继续工作，会话可以恢复，你可以从任意终端或通过 SSH 重新连接。每个窗格都会标记为 working、blocked 或 idle，不用再寻找卡住的智能体。智能体通过 CLI 和 socket API 驱动 herdr：它们可以创建窗格、互相提示，并等待另一个智能体真正被阻塞。herdr 直接运行你已经在用的工具：Claude Code、Codex、Cursor、OpenCode、Grok 等。它不会包装或替换它们，而是接管它们的终端。键盘和鼠标都是一等公民，插件可以扩展窗格和工作流。单个 Rust 二进制，没有 Electron。
