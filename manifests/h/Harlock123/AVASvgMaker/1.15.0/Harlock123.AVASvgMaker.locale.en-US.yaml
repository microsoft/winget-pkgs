ShortDescription: A Visio-style diagram editor that reads Visio .vsdx and exports SVG, PNG, PDF and Mermaid.
Description: |-
  AVASvgMaker is a desktop diagram editor built with Avalonia UI and .NET 9. You drag shapes
  from a toolbox of 96 stencils onto a page, label them, and join them with connectors that
  route themselves around whatever is in the way.

  It reads Visio .vsdx drawings, and writes drawings out as SVG, PNG, BMP, PDF, Mermaid and
  .vsdx. Drawings are kept in its own .avadiag format, which holds everything an exported
  picture cannot.

  Pages behave like paper - several per document, each with its own size, margin, colour,
  watermark, header and footer. Shapes can be grouped, rotated, gradient-filled, given data
  fields, and arranged with smart guides, rulers, containers and swimlanes.

  The application follows the desktop's light and dark setting, or can be set to one of
  thirteen built-in themes for desktops that do not announce one.

  It ships as a single self-contained executable: the .NET runtime and everything else it
  needs are inside the one file, so there is nothing else to install.
