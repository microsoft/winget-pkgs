ReleaseNotes: |-
  First release.

  WinGet installs the two executables and puts them on PATH. It cannot register
  the watcher's logon task, so a cartridge will not open its launcher on insert
  until you run the installer once:

    powershell -ExecutionPolicy Bypass -File install.ps1 -Mode Watcher

  install.ps1 ships in the windows\ folder of the installed package. The wizard
  needs none of that and works immediately:

    pc-gamepak --create
