ShortDescription: A desktop UI for your coding agents.
Description: 'MonoCode is a desktop UI for your coding agents. It works with your subscriptions on Claude Code, Codex, Cursor, Grok Build, OpenCode, Antigravity, Pi, omp, fx, and Hermes Agent: if they are installed and logged in, MonoCode can run them. Tabs are sessions and the composer is the input. MonoCode does not sell tokens.'
