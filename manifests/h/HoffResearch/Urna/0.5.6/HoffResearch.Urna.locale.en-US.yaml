ShortDescription: Offline-first vector database in one file, with citations you can verify
Description: 'Urna keeps a whole knowledge base in one .urna file: the text, its embeddings, its HNSW and BM25 indexes and the hashes that prove nothing changed. You copy it like a SQLite file and search it with no server and no network. Every hit is reranked by exact cosine similarity and carries a urna:// citation that resolves back to the stored text. For example, urna ask quickstart.urna "how do citations work" -k 1 prints the closest passage with its citation, and urna cite turns that citation back into the exact text and the hashes it is bound to.'
