ShortDescription: 用于捕捉闪现进程、查找文件占用和探查 Windows UI 的原生小工具。
Description: >-
  Peek 是一个便携的 Windows 原生工具，包含三个专注功能：Ghost 捕获短生命周期进程和闪现窗口，
  Unlock 查找正在占用文件的进程，Focus 探查鼠标下方的 Win32 和 UI Automation 元素。
  Peek 可离线运行，不需要账户、遥测或额外运行时。
