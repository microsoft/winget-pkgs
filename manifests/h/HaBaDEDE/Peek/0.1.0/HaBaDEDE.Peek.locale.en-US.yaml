ShortDescription: A tiny native Windows utility for transient processes, file locks, and UI inspection.
Description: >-
  Peek is a portable native Windows utility with three focused tools: Ghost captures
  short-lived processes and flashing windows, Unlock identifies processes that hold
  a file open, and Focus inspects the Win32 and UI Automation element under the pointer.
  Peek runs offline without accounts, telemetry, or an additional runtime.
