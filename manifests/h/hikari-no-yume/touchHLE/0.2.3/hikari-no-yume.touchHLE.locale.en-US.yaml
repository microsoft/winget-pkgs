ReleaseNotes: |-
  Hello everyone! 

  The touchHLE team is proud to announce the new release!

  Compatibility has grown from dozens of games to [over 300 apps with 3+ stars support](https://appdb.touchhle.org/) :tada:

  Many thanks to all of the contributors who made this release possible :pray:

  ~ ciciplusplus and hikari_no_yume

