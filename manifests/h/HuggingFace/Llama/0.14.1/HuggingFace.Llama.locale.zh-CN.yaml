PackageIdentifier: HuggingFace.Llama
PackageVersion: 0.14.1
PackageLocale: zh-CN
ShortDescription: Windows Llama 应用伴侣
Description: |-
  Llama 是一款用于在本地运行 llama.cpp 模型的 Windows 11 托盘应用。它是 Llama for Mac 的 WinUI 3 移植版。

  亮点
  - 常驻托盘 —— 锚定于托盘图标的无边框、Mica 材质浮窗
  - 零配置 llama.cpp —— 直接使用现有的 llama.exe，或自动为您下载
  - 一键获取模型 —— 浏览并下载 Hugging Face Hub 上的推荐模型
  - 模型详情 —— 点击任意模型即可选择上下文长度，并查看各选项对应的内存预估（读取自 GGUF 标头），设置按模型分别保存，此外还提供对话、复制模型 ID、生成 curl 请求及访问 Hugging Face 等快捷操作
  - 标准存储 —— 模型保存在 Hugging Face 缓存目录中，与 llama.cpp 及其他工具共享
  - 类 Spotlight 浮层 —— 在任意应用中按下 Alt+Space 即可与已加载的模型对话
