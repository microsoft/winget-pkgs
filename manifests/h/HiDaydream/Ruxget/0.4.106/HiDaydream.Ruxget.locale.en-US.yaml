ShortDescription: A free, ad-free Windows downloader for videos and large files.
Description: |-
  Ruxget is a free, ad-free downloader for Windows. Paste a YouTube, Bilibili or other video link into the standalone desktop app, choose an available resolution, and save it as MP4 or MP3; a YouTube playlist can be read first so you pick the videos you want instead of taking the whole set.
  Large web files, cloud-drive links and torrents can be handed to it too, with pausing and resumable downloads. Torrents upload only while a download is running and stop seeding as soon as it finishes.
  The companion Chrome Web Store extension covers Bilibili, Douyin, Kuaishou and Xiaohongshu, reads the current page title and available resolutions, saves subtitles as SRT, and can pass bigger downloads to the desktop app; the extension does not parse or hand over YouTube. The software adds no usage or advertising tracking, installs for the current account only, and needs no administrator rights.
