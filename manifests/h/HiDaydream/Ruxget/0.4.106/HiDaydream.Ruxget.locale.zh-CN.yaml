ShortDescription: 免费、无广告的 Windows 视频与大文件下载器。
Description: |-
  Ruxget（拾影）是免费、无广告的 Windows 下载器。在独立的桌面版里粘贴 YouTube、B 站等视频链接，选择可用的清晰度，保存为 MP4 或 MP3；YouTube 播放列表可以先读取再勾选需要的视频，不会默认整套下载。
  网页上的大文件、网盘和 BT 也可以交给它，支持暂停和断点续传。BT 只在下载进行中上传，下载完成后立即停止做种。
  配套的 Chrome 商店插件覆盖 B 站、抖音、快手和小红书，可以直接读出当前页面的标题和清晰度，把字幕保存成 SRT，也能把较大的下载转交给桌面版；插件不解析也不转交 YouTube。软件不加入使用追踪和广告追踪，桌面版仅为当前账户安装，不需要管理员权限。
