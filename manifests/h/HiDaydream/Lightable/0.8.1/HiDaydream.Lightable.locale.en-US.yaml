ShortDescription: A fast, free photo viewer and culling tool for Windows 10 and 11.
Description: |-
  Lightable is a photo viewer and culling tool for Windows 10 and 11 with an installer of about 2.5 MB. Double-click a photo to open it and flip through the rest with almost no waiting.
  It reads JPG, PNG, HEIC, WebP, TIFF and other common formats, plus RAW and DNG from Canon, Nikon, Sony, Panasonic and Fujifilm cameras using the preview stored in the file. You can rate photos, flag rejects, and compare two side by side; marks are kept in an XMP file next to the photo so the original is never modified.
  It also offers full-screen slideshows, basic adjustments and filters, cropping and straightening, and batch export. The interface follows the Windows language and is available in simplified Chinese, traditional Chinese and English. It installs for the current account only, needs no administrator rights, and has no ads and no account requirement.
