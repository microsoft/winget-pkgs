ShortDescription: Windows 10 和 11 上快速、免费的看图与选片软件。
Description: |-
  Lightable 是 Windows 10 和 11 上的看图与选片软件，安装包约 2.5 MB，双击照片即可打开，翻页几乎不需要等待。
  它读取 JPG、PNG、HEIC、WebP、TIFF 等常用格式，也读取佳能、尼康、索尼、松下、富士等相机的 RAW 与 DNG，显示相机写在文件里的预览图。可以打星、标记不要的照片，并把两张并排比较；标记保存在照片旁边的 XMP 文件里，不改动原片。
  此外还有全屏幻灯片、基础调整与滤镜、裁剪与矫正，以及批量导出。界面跟随 Windows 语言，提供简体、繁体和英文。仅为当前账户安装，不需要管理员权限，也没有广告和注册要求。
