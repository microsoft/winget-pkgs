ReleaseNotes: |-
  Thank you @SunXin121 for the image fix, and @leo1oel and @Asianfleet for the reports!
  Fixed
  - Float captions keep their class's style. Floats compiled live now run their own \begin{figure}…\end{figure}, so Elsevier cas-sc captions, setspace's single spacing in floats and float.sty styles look the same live as in the PDF. Before, such a caption came back in the body font. (#49, #51)
  - Two-column documents. A paragraph that runs from one column into the next gets live updates again, drawn in the right column. (#47)
  - No more stray LuaLaTeX processes. Closing rtex while a document's preamble was still loading left a LuaLaTeX server running forever. A server that fails or times out at start is stopped too.
  - Images in the live preview. An \includegraphics image after cached pictures no longer shows another graphic of the document. (#41, #42)
  - Main file in a subfolder. \input{name} reads the file next to the main file, even when the project's top folder has one with the same name, as latexmk -cd does. (#40)
  - Bibliographies. biblatex with backend=bibtex works in background passes, and an entry whose note cites another entry is resolved in the same run.
  - C API: DisplayList::to_binary no longer drops the item after a save or restore, so scaled and rotated boxes are drawn transformed. rtex serve was not affected.
  Faster
  - Background passes write page lists in the binary format as each page ships: on a 300-page book they take 0.25 s of a pass instead of 0.98 s, and a layout after a one-character edit 1.6 s instead of 2.4 s. The pass directory now holds <jobname>.rtex-page<n>.bin; rtex dl2json prints one as JSON.
  - A missing citation no longer costs five passes per layout. While a \cite key is being typed, or Biber/BibTeX fails, a layout is one pass (about 2 s instead of 9–11 s on a 100-page book).
ReleaseNotesUrl: https://github.com/HenryXiaoYang/realtime-tex/releases/tag/v0.0.8
InstallationNotes: rtex needs a TeX Live installation that provides LuaLaTeX with a LaTeX kernel from 2021 or later; pdfLaTeX and XeLaTeX are not supported. Run `rtex doctor` to check that rtex finds its support files and your LuaLaTeX.
