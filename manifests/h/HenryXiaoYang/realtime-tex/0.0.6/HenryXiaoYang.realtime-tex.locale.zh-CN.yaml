PackageIdentifier: HenryXiaoYang.realtime-tex
PackageVersion: 0.0.6
PackageLocale: zh-CN
ShortDescription: 用未经修改的 LuaTeX，在约一毫秒内只重新排版你正在编辑的那个 LaTeX 段落。
Description: rtex 是面向编辑器的排版引擎。你打字时，它只重新排版当前正在编辑的段落——使用一个已经加载好导言区的 LuaLaTeX 进程，并把新的行交给编辑器绘制。后台的完整编译负责真正全局的内容：分页、浮动体、目录、交叉引用和参考文献。结果与 LuaLaTeX 的输出完全一致——相同的断行与字形，位置精确到 1/65536 pt——因为 rtex 使用 TeX Live 中未经修改的 LuaTeX，导出的 PDF 与正常 LuaLaTeX 构建的 PDF 相同。从按键到段落更新的耗时约为 1 毫秒，且不随文档长度变化。压缩包内含 `rtex` 命令、C 库与头文件，以及 rtex 的 TeX 支持文件。
Tags:
- latex
- lualatex
- luatex
- tex
- 实时预览
- 排版
InstallationNotes: rtex 需要已安装提供 LuaLaTeX 的 TeX Live（LaTeX 内核 2021 或更新版本），不支持 pdfLaTeX 与 XeLaTeX。可运行 `rtex doctor` 检查 rtex 能否找到自身支持文件与 LuaLaTeX。
