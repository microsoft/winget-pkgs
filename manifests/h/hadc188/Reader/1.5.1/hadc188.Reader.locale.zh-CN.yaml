ReleaseNotes: |-
  新增
  - 迷你模式：标题栏新增迷你按钮，一键把窗口缩到 320×240 并自动置顶，不会被其他窗口盖住。控件精简为「上一章 / 下一章 / 目录」，并提供字号与字重调节（与阅读设置共用同一份配置）。尺寸可拖拽调整且会被记住，下次启动直接以迷你尺寸打开。
  优化
  - 窗口最小尺寸从 880×600 放开到 420×320，可自由缩小。
  - 窗口尺寸与位置会被记住。
  - 迷你模式下目录面板压缩尺寸，列表可用高度提升约 36%，可见章节由 2 条增至 3 条。
  - 搜索结果支持分页加载；多源搜索可取消。
  - Cookie 校验改用书源自身的搜索关键词，避免原先固定用「测试」在多数站点搜不到而误报「校验失败」。
  - 提示信息不再拦截其下方按钮的点击，并支持点击关闭。
  修复
  - 备份恢复不再因单条脏数据整体失败（#3）：原先只要有一条无效数据就会拒绝整份备份。现改为跳过无效条目并汇报跳过数量。
  - 迷你模式相关：#4 提出的「窗口太大」问题已通过放开最小尺寸与新增迷你模式解决。
  其它
  - 版本号 1.5.0 → 1.5.1。

  完整变更：https://github.com/hadc188/reader/compare/v1.5.0...v1.5.1
