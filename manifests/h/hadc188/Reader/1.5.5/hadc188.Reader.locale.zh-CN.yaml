ReleaseNotes: |-
  新增
  - RSS 单 URL 源内嵌打开：源地址即「一篇文章」时直接在内嵌面板打开。
  - 发现页重构：补齐登录与按钮类控件。
  - 划词替换：划词菜单新增「替换」，支持正则与本书 / 书源 / 全部范围。
  - 预加载默认开启。
  - 远程书源同步：加进度动画。
  优化
  - 预载缓存 3 → 5 并按访问顺序淘汰，减少「开了预加载仍有加载动画」。
  - 左右分页跨多页改为瞬时定位，不再快速滑过整章。
  修复
  - 简繁转换不再套用台湾用词表（#12：序列 → 串行），并改为先转换后替换。
  - 横向分页图片过高把图后文字裁掉（#10）。
  - 搜索结果定位：自动重算不再把画面送回首屏，连续阅读序号不再错位。
  - 书源管理：列表操作与编辑面板保持同步，不再静默回退未保存编辑；
  - 发现页：恢复详情 / 目录 / 正文 / 切源显示；停用书源不再出现#11。
  - 书源登录：按 URL query 切状态的页面可切换。
  其它
  - 版本号 1.5.4 → 1.5.5。

  完整变更：https://github.com/hadc188/reader/compare/v1.5.4...v1.5.5
