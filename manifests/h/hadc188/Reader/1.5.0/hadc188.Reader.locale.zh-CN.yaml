ReleaseNotes: |-
  新增
  - 书源 JS 引擎大幅补强：新增 DES / 3DES 与 ECB 模式加密，jsLib 支持缓存复用，补齐 java 面板相关接口与日志，兼容更多书源写法。
  - 书源面板（java.showBrowser）：支持面板与宿主双向交互，面板内可直接调用书源规则同款的网络、缓存与加解密能力。
  - 正文图片支持 legado 的 ,{json} 参数协议（如 click 脚本、style、width），点击图片不再显示为破损图。
  优化
  - 正文规则支持 html → JS 链式处理与正则提取，规则组合更灵活。
  - 章节缓存调度改为边派发边收集，实时上报进度并支持取消；失败章节也计入进度，不再卡在 100% 以下。
  - 连续阅读与跳转章节时显示加载阶段提示（获取 / 解析正文），长耗时的段评解析也有反馈。
  - 书源调试面板会展示本次执行的 JS 日志。
  修复
  - 连续阅读原地刷新不再跳到上一章。
  - WebDAV 阅读进度同步：手机端作者字段形如「作者：辰东」、桌面端为「辰东」导致两端文件名不一致时，现在能互相识别并收敛，不再出现两端各写各的。
  - 修复正文图片地址带 ,{json} 后缀时被当作 URL 加载的问题。
  其它
  - 版本号 1.4.6 → 1.5.0（含各平台打包配置）。
