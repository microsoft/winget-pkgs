ReleaseNotes: |-
  新增
  窗口与书签
  - 支持应用窗口不透明度调节（#34）。
  - 增强书签管理，并支持纸间书摘同步（#36）。
  优化
  阅读体验
  - 优化本地书翻章体验。
  - 连续阅读增加窗口化裁剪，降低大量章节渲染带来的内存压力。
  - 自定义字体删除时释放 FontFace，避免字体资源长期驻留。
  - 阅读统计记录改为串行上报，长会话按小时分段，减少时长丢失和重复写入。
  修复
  点击区域与分页
  - 修复九宫格旧字段覆盖左右分页配置，导致重开后回到上下滚动配置的问题。
  - 修复阅读器快速翻页时误选文字（#37）。
  阅读统计
  - 修复统计页范围筛选与累计数据口径不一致的问题。
  - 修复删除分书记录后，按日累计时长未同步扣减的问题。
  - 修复同一书籍名在阅读排行中重复出现的问题。
  - 移除阅读字数统计，避免未采集实际字数却展示为 0。
  其它
  - 版本号 1.6.4 → 1.6.5。

  完整变更：https://github.com/hadc188/reader/compare/v1.6.4...v1.6.5
