ShortDescription: 「阅读3.0」（Legado）的跨平台桌面移植版。
Description: Reader 是一个面向桌面端的本地阅读器：管理自己的书源与书架，也能阅读本地书籍、订阅 RSS，并按喜欢的方式定制阅读界面。它是「阅读3.0」（Legado）的跨平台桌面移植版，支持 Windows、macOS 和 Linux，使用 Rust、Tauri v2 与 Vue 3 构建。
