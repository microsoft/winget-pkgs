ShortDescription: Free desktop chat app for communities and friend groups, with text and voice channels, DMs and calls.
Description: |-
  Hearth is a free desktop chat app for Windows built for communities, friend groups, gaming and study groups.
  Servers with text and voice channels, invite links and a Discover page; real-time chat with reactions, replies, threads, polls and link previews; direct messages and friend requests with one-to-one calls, camera and screen share; roles and permissions, AutoMod and an audit log; forum channels, reminders, scheduled messages and an in-app updater.
  Hearth is not code-signed yet, so Windows SmartScreen shows a warning the first time you run it (More info, Run anyway).
