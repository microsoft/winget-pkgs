ReleaseNotes: |-
  Hearth 1.13.0

  New
  - Unreads: one list of every channel and DM with new messages, mentions first. Jump straight in, mark one read, or mark everything read. Open it from the button on Home or press Alt+Shift+U.
  - Text chat in voice channels: every voice channel now has its own chat beside the call, for links, "brb" and game invites. You can hide it, and Hearth remembers.
  - Download my data: Settings > Privacy & safety gives you a file with your profile, settings, servers, friends and every message you've written.
