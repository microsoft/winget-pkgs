ReleaseNotes: |-
  1. 界面交互优化：产物卡片改为双列网格，新增查看全部入口，优化文件预览与长文件名展示；修复输入框标题、技能市场搜索框样式。
  2. 技能与移动端改进：更新深度研究技能，PPT 技能增加云端回退；修复手机端任务状态、通道加载、会话 ID 展示问题。
  3. 任务稳定性增强：统一主动停止任务状态展示；修复 WPS 进程残留、定时任务串台、权限切换中断任务、风控文案及附件审核问题。
  4. 安全合规升级：程序文件增加数字签名减少拦截，更新会员协议与隐私声明链接。
