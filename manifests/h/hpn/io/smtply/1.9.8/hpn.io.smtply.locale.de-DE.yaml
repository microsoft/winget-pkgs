ShortDescription: SMTP-Relay für Windows, das Mails von Druckern, Scannern und Altanwendungen über OAuth2 und Microsoft Graph an Microsoft 365 weiterleitet.
Description: SMTPly läuft als Windows-Dienst auf Ihrem eigenen Server und nimmt Mails von Geräten und Anwendungen an, die kein OAuth2 beherrschen (Drucker, Scanner, ERP- und Monitoringsysteme). Es leitet die Nachrichten unverändert über Microsoft Graph an Exchange Online weiter, SMTP AUTH mit Basic Authentication wird nicht mehr gebraucht. Die Mails verlassen Ihre Server nur auf dem Weg in Ihren eigenen Microsoft-365-Tenant. Eine 14-tägige Testphase mit vollem Funktionsumfang ist enthalten.
