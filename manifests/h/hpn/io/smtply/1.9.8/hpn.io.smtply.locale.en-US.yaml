ShortDescription: SMTP relay for Windows that forwards mail from printers, scanners and legacy applications to Microsoft 365 via OAuth2 and Microsoft Graph.
Description: SMTPly runs as a Windows service on your own server and accepts mail from devices and applications that cannot use OAuth2 (printers, scanners, ERP and monitoring systems). It forwards the messages unchanged to Exchange Online through Microsoft Graph, so SMTP AUTH with basic authentication is no longer needed. Mail never leaves your servers except for the delivery to your own Microsoft 365 tenant. A 14 day trial with the full feature set is included.
