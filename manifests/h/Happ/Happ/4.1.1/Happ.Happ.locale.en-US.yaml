ReleaseNotes: "• Improved：updated the VPN core, which restores Xray TUN mode on Linux and enables per-app split tunneling on macOS\r\n• Improved：profiles using ciphers the new core no longer supports are now caught before connecting, with a clear message instead of a failed connection\r\n• Added：a \"Use local DNS\" switch on the main screen that sends every DNS query through the tunnel, so lookups can't leak to your local network\r\n• Fixed：waking the computer from sleep no longer shows a false connection-crash error\r\n• Fixed：automatic reconnection after sleep now works on Happ TUN and tun2proxy instead of silently failing\r\n• Fixed：your own system proxy settings are no longer wiped when Happ clears a leftover proxy at startup\r\n• Fixed：connecting with a JSON config that already contains a TUN section no longer creates a duplicate adapter"
