ReleaseNotes: "• Improved Xray TUN is now the default tunnel provider and appears first in the provider pickers\r\n• Improved ping tests are more reliable and no longer leave stray helper processes running\r\n• Improved the Windows installer now ships fully signed binaries\r\n• \r\n• Added a Reset action that repairs the background service on Windows, macOS and Linux, with its health checks included in the diagnostic report\r\n• Added an editable system proxy exception list in Advanced settings\r\n• Added Per-App Proxy support when running Xray TUN\r\n• \r\n• Fixed encrypted subscriptions revealing their server details after the first refresh\r\n• Fixed subscriptions failing to decrypt when delivered through a fronting proxy\r\n• Fixed subscription links that redirect to a happ:// address not being added\r\n• Fixed server configs that use the vcn alias for certificate verification not importing\r\n• Fixed DNS going dead on Xray TUN\r\n• Fixed proxy ping showing n/a on Xray TUN\r\n• Fixed the buttons and AI Helper disappearing after deleting the last server from the list\r\n• Fixed LAN sharing showing a virtual machine adapter address instead of the real local network one\r\n• Fixed no error appearing when an invalid routing profile is imported in global routing settings\r\n• Fixed the HTTP inbound toggle and user agent fields staying greyed out after a subscription lost premium\r\n• Fixed the tunnel type from a subscription not being applied to free subscriptions"
