PackageLocale: zh-CN
ShortDescription: 适用于 Microsoft Windows 的免费开源电子邮件服务器。
Description: |-
  hMailServer 是一款适用于 Microsoft Windows 的免费开源电子邮件服务器。全球各地的互联网服务提供商、企业、政府、学校以及爱好者都在使用它。
  它支持常见的电子邮件协议（IMAP、SMTP 和 POP3），并能轻松与众多现有的 Web 邮件系统集成。它拥有基于评分机制的灵活反垃圾邮件保护功能，并可接入您的杀毒软件来扫描所有收发的电子邮件。
