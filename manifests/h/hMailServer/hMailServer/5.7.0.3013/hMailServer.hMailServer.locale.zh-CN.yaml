ShortDescription: 适用于 Microsoft Windows 的免费开源电子邮件服务器。
Description: hMailServer 是一款免费、开源的 Microsoft Windows 电子邮件服务器。它支持常见电子邮件协议（SMTP、IMAP 和 POP3），以 Windows 服务方式运行，内置垃圾邮件防护和病毒扫描功能；域名、账户和设置存储于 MySQL、PostgreSQL 或 Microsoft SQL Server，并可通过随附的 hMailAdmin 程序进行管理。
