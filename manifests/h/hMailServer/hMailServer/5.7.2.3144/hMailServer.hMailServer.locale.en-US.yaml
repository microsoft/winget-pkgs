ReleaseNotes: |-
  Bug fixes
  - This build makes hMailServer write SQL Compact database changes to disk once a second. It works around a bug in SQL Compact where changes are sometimes never written to disk, so that they are lost if the server stops without a normal shutdown, for example after a crash or power loss. Only installations that use the built-in SQL Compact database are affected.
