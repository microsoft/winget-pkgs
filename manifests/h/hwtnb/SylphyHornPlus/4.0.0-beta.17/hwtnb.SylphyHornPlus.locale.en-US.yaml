ReleaseNotes: |-
  - Added automatic app placement: new windows of registered apps are placed on a desktop specified by number or name.
    - Missing desktops can be created (up to 10 at a time).
    - Empty desktops can be closed after use.
    - Already open windows can be rearranged.
  - Added wallpapers for new desktops, set by desktop name or number.
  - Added `sylphyhorn-cli`, a command-line tool to operate the running SylphyHornPlus from scripts and AI agents.
    - WinGet installations provide it as the `sylphyhorn-cli` command.
    - An agent skill that teaches AI coding assistants how to use it is included in the `skills/sylphyhorn` folder of the application.
  - Fixed SylphyHornPlus stopping when the device switches to battery power while started by the scheduled (elevated) startup task (#57).
    - Existing tasks are not updated automatically. After updating, disable and re-enable "Automatically start as administrator at logon" to recreate the task.
