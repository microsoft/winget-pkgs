ReleaseNotes: |-
  - Migrated SylphyHornPlus to .NET 10.
  - Added native ARM64 support, alongside x86 and x64 packages. (#54)
  - Added WinGet-managed installation, updates, and release automation. (#28, #37)
  - Redesigned virtual desktop state synchronization to improve reliability when notifications are delayed, missing, or temporarily inconsistent.
  - Improved startup shortcut and Task Scheduler registration for .NET 10 builds.
  - Replaced the previous keyboard hook dependency with an internal low-level keyboard hook implementation.
  - Improved wallpaper update ordering and moved automatic wallpaper application off the UI thread.
  - Added extensive regression tests for settings, shortcuts, input handling, startup, virtual desktop interoperability, and release packaging.
