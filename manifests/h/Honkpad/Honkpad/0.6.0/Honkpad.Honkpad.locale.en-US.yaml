ShortDescription: Meme soundboard for streamers that plays sounds and GIFs on stream through one OBS browser source.
Description: |-
  Honkpad is a meme soundboard and OBS overlay app for streamers.
  It plays a sound together with its GIF or video and caption on stream.
  The overlay is a browser source, so OBS Studio, Streamlabs Desktop and other apps with browser sources work.
  Memes can be triggered by hotkeys, a Stream Deck plugin, a phone remote, a local HTTP API or Twitch chat commands.
  YouTube, Kick and TikTok chat can play memes through Social Stream Ninja.
  Pro features are free during early access.
