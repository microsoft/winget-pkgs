ShortDescription: Windows taskbar widget showing Claude Code usage, coloured by consumption pace.
Description: |-
  A fork of CodeZeno.ClaudeCodeUsageMonitor. It keeps the upstream taskbar widget
  and tray badges, and changes how the usage bars are read: instead of colouring
  by raw percentage, each bar is coloured by consumption pace, meaning the
  percentage spent relative to how much of the window has elapsed. A third bar
  tracks the per-model weekly limit that the usage API reports separately.
  Thresholds, band colours and both features are configurable from the settings
  file.
