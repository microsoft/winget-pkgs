Description: |-
  Bloom은 Windows용 가벼운 네이티브 런처예요. Win 키를 누르고 한 줄 치면 앱 실행, 계산과 단위 변환, 파일 찾기, 알림, 그리고 쓰던 Claude Code·Codex 로그인으로 AI 질문까지 돼요.
  화면 일부를 골라 묻고 번역하고 글자를 복사하는 Bloom Lens, 런처 옆에 붙여 쓰는 메모·타이머·계산기·클립보드 기록, 디스크 용량을 지도로 보여 주는 Space Cleaner도 있어요.
