ShortDescription: A Win-key launcher for apps, files, maths, AI chat and screen translation, all from one line.
Description: |-
  Bloom is a light native launcher for Windows. Press Win, type a line, and it opens apps, does sums and unit conversions, finds files, sets reminders and asks the AI you already use through your own Claude Code or Codex login.
  It also has Bloom Lens for asking about, translating or copying part of the screen, notes, timers, a calculator and clipboard history beside the launcher, and Space Cleaner for seeing where your disk space went.
