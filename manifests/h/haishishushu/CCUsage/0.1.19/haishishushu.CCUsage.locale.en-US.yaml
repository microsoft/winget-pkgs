PackageIdentifier: haishishushu.CCUsage
PackageVersion: 0.1.19
PackageLocale: en-US
ShortDescription: Keep AI coding usage visible at a glance from a desktop Dynamic Island.
Description: |-
  CC Usage is a desktop AI usage monitor for Windows, macOS, and Linux. The desktop island shows usage at a glance, while the dashboard provides statistics, request logs, and connection management. It supports Claude, Codex, Gemini, Grok, Zcode, Trae, Qoder, and Workbuddy. Each platform shows only data that can actually be obtained, and collected usage stays on your device.
  What it does
  - Keep quotas visible in a desktop island that snaps to any edge, expands on double-click, and docks as a slim strip.
  - Read each tool's real local session, usage, cache, or credit source incrementally and deduplicate records.
  - Explore today, this week, this month, all time, or a custom range using linked charts and paginated request logs.
  - Query supported coding-plan quotas from Zhipu GLM, Kimi, MiniMax, ZenMux, OpenCode Go, Volcengine Ark, and Grok.
  Technology
  The desktop app uses Tauri 2. Rust handles windows, the tray, session collection, and local SQLite storage. The interface uses React 19, TypeScript, Vite, and Tailwind CSS 4. Windows has a Chinese NSIS installer; other systems have their own packages.
