ShortDescription: 让 AI 用量，一眼看得见。
Description: |-
  CC Usage 是一款支持 Windows、macOS 和 Linux 的桌面 AI 用量监控工具：灵动岛显示当前用量，主面板用于查看统计、日志和连接。它支持 Claude、Codex、Gemini、Grok、Zcode、Trae、Qoder 与 Workbuddy；每个平台只展示实际取得的会话、Token、缓存、积分或额度字段。采集结果存放在本机。
  核心能力
  - 灵动岛常驻——四边吸附、双击展开、停靠条，额度水位不切窗即可见
  - 多平台本机来源——按各工具真实格式读取会话、用量、缓存或积分，增量采集并去重
  - 统计与请求日志——今日 / 本周 / 本月 / 累计口径，趋势图与分页日志联动筛选
  - 编程套餐额度直连——智谱 GLM、Kimi、MiniMax、ZenMux、OpenCode Go、火山方舟、Grok
  技术栈
  桌面端基于 Tauri 2 构建：Rust 负责窗口、托盘、会话采集与本机 SQLite 存储；前端使用 React 19、TypeScript、Vite 与 Tailwind CSS 4。Windows 提供中文 NSIS 安装向导，其他系统提供对应安装包。
