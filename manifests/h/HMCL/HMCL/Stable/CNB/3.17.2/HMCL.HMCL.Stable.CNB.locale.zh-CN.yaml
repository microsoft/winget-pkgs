PackageIdentifier: HMCL.HMCL.Stable.CNB
PackageVersion: 3.17.2
PackageLocale: zh-CN
PackageName: Hello Minecraft! Launcher 稳定版
ShortDescription: 一个多功能、跨平台且广受欢迎的 Minecraft 启动器
ReleaseNotes: |-
  在支持 AVX-512 指令集的平台上，部分版本的 OpenJDK 在进行 Base64 解码时可能触发安全漏洞 CVE-2026-114938。
  在此版本中，我们通过一些措施绕过了此安全漏洞。我们强烈建议所有在支持 AVX-512 指令集的平台上运行 HMCL 的用户升级至本版本。
  启动器
  - GP-7296: 将任务列表改为任务管理页面中的侧边栏标签页 (by Glavo)
  - GP-7290: 调整任务列表为空时的提示文案 (by 辞庐)
  - GP-7288: 在游戏启动任务标题中显示实例名 (by 辞庐)
  - GP-7308: 在新实例的安装任务标题中显示实例名称 (by Calboot)
  整合包
  - GP-7287: 在整合包下载任务标题中显示文件名 (by 辞庐)
  - GP-7285: 在整合包导出任务标题中显示整合包名称 (by 辞庐)
  错误修复
  - GP-7283: 修复生成启动脚本后任务列表中的任务无法结束的问题 (by Chen Meng)
  - GP-6860: 修复弹出菜单无法关闭的问题，并添加关闭动画 (by Wulian233)
  - GP-7284: 修复实例管理页面的“浏览”和“管理”菜单再次点击时无法收起的问题 (by Wulian233)
  - GP-7311: 修复账户列表展开后再次右键点击无法收起的问题 (by Wulian233)
  - GP-7318: 绕过受 CVE-2026-114938 影响的 Java Base64 优化 (by Glavo)
