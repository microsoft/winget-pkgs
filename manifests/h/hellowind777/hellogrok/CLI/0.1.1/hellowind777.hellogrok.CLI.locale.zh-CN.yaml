ShortDescription: hellogrok 的命令行版本——跨平台 Grok Build 本地代理，让自定义模型渠道兼容常见 API 格式、Build 原生 Web 工具、独立鉴权和自动配置恢复。
Description: Grok Build 可以接入自定义模型端点，但不同服务商实际提供的协议、响应格式、鉴权方式和 Web 搜索能力并不一致。hellogrok 为这些自定义渠道提供统一的本地兼容层：运行时准备 Grok 必需配置，让每个渠道固定使用自己的端点和凭据，支持 Grok Build 原生 Web 工作流，并在停止时恢复原始配置。本版本为纯命令行构建，不包含托盘程序；运行 `hellogrok help` 可查看完整的命令参考（start、version、routes、restore、autostart、log、logview）。
