ReleaseNotes: |-
  HC Player 1.6.1
  HC Player 1.6.1 is a maintenance release focused on fixes and refinements over 1.6.0. This update improves fullscreen opening, window restoration and playback recovery, with a small increase to saved playback positions.
  Fullscreen and window behavior
  - Fixed startup flashes when opening media with Start in fullscreen enabled, in both light and dark themes.
  - Prevented playback controls from briefly appearing during automatic fullscreen entry. This covers Full, Compact, Minimal and Floating controls, with or without window borders.
  - Extended these protections to opening media through Explorer, the Open menu, keyboard shortcuts, recent items, drag-and-drop, copied paths and supported web links.
  - Fixed fullscreen startup positioning when Remember window position is enabled.
  Other Fixes and Polish
  - Added an option to use the classic Windows menu.
  - Increased saved playback positions from 3 to 10 recent media items, keeping compatibility with existing records.
  - Fixed a startup failure that could occur with fresh or reset local settings while using Automatic (system) language.
  - Added recovery when both audio and video tracks are explicitly disabled. The player now stops playback, clears the playlist and returns to the ready screen, restoring automatic track selection for the next media.
  - Added the same recovery when disabling the audio track in audio-only media without a recognized cover-art or video track.
  - Disabling just one track in a video continues to work as before: audio can keep playing with video disabled, and video can keep playing with audio disabled.
