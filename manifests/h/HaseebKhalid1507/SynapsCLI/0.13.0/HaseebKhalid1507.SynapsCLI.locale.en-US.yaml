ShortDescription: Terminal-native AI agent runtime for parallel agent orchestration on any model.
Description: |-
  SynapsCLI is a terminal-native AI agent runtime written in Rust. Run a crew of AI agents in your terminal, on any model, from one small binary.

  - Sessions outlive the window: a background daemon owns every session, /sessions lists them, and pinned ones come back after a restart.
  - Every terminal is you: attach several clients to one session, and any of them can type, steer or take over.
  - Run a crew: named subagents work in parallel, and any one of them can be opened in its own view and steered mid-flight.
  - Any model: Claude, Codex, Grok, Copilot, Gemini, Kimi, Meta Muse, Azure, Bedrock, Vertex, any OpenAI-compatible endpoint, or Ollama.
  - Credentials stay in the broker: agents get short-lived, scoped tokens rather than your keys, with several accounts per provider.
  - Bounded turns when you want them: optional caps on rounds, tool calls, time, tokens and cost.
  - Long sessions stay cheap: the prompt cache lasts an hour on a Claude subscription, large tool output waits on disk behind a short preview, re-reads of unchanged files are deduplicated, and workers roll their context over instead of filling the window.
  - Memory that survives: project memory, /compact checkpoints, and sessions that chain across days.
  - Sees what you see: the model reads images, and /attach adds images, PDFs and text to a turn.
  - Build on it: extensions in any language, MCP servers, and the engine over JSON-RPC or the daemon socket.

  Run synaps login to sign in with a provider subscription, an API key, a cloud identity or a local endpoint, then run synaps to start the TUI. synaps chat exposes the same engine on stdin and stdout for pipes, scripts and CI, synaps rpc speaks JSON-RPC over stdio, and synaps daemon manages the shared sessions.

  The project treats agents as programs that happen to use language models rather than as chat products: the system prompt is a file on disk, the tool list is opt-out, and nothing phones home. Tools run as you, so SynapsCLI is not a sandbox.
