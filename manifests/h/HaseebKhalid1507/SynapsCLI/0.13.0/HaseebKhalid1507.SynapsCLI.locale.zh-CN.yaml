ShortDescription: 终端原生的 AI 智能体运行时，可在任意模型上并行编排智能体。
Description: |-
  SynapsCLI 是用 Rust 编写的终端原生 AI 智能体运行时。只需一个不大的可执行文件，就能在终端里同时运行一组 AI 智能体，并使用任意模型。

  - 会话比窗口更长寿：后台守护进程持有每个会话，/sessions 可列出它们，固定的会话在重启后仍会恢复。
  - 每个终端都是你：可以有多个客户端接入同一个会话，任意一个都能输入、引导或接管。
  - 组队运行：具名的子智能体并行工作，你可以把其中任意一个单独打开到一个视图，在它运行过程中随时引导。
  - 任意模型：Claude、Codex、Grok、Copilot、Gemini、Kimi、Meta Muse、Azure、Bedrock、Vertex、任何 OpenAI 兼容端点，或 Ollama。
  - 凭据留在代理层：智能体拿到的是短时效、限定范围的令牌，而不是你的密钥；每个提供商还可以配置多个账号。
  - 可选的回合上限：限制轮次、工具调用、时间、Token 与费用。
  - 长会话依旧省钱：使用 Claude 订阅时提示缓存可保持一小时，超大的工具输出先存放在磁盘上只留简短预览，未变化文件的重复读取会被去重，工作智能体会滚动换掉上下文而不是撑满窗口。
  - 记忆可以延续：项目记忆、/compact 检查点，以及可以跨天接续的会话。
  - 看得见你所见：模型可以理解图像，/attach 还能把图片、PDF 与文本加入某一轮。
  - 可在其上构建：支持任意语言的扩展、MCP 服务器，以及通过 JSON-RPC 或守护进程套接字使用引擎。

  先运行 synaps login 以提供商订阅、API 密钥、云身份或本地端点登录，再运行 synaps 启动 TUI。synaps chat 把同一套引擎接到标准输入输出上，便于管道、脚本与 CI 使用；synaps rpc 通过标准输入输出提供 JSON-RPC；synaps daemon 负责管理共享会话。

  该项目把智能体视为恰好使用语言模型的程序，而不是聊天产品：系统提示词是磁盘上的一个文件，工具列表采用可关闭方式，并且不会向厂商回传任何数据。工具以你的身份运行，因此 SynapsCLI 并不是沙箱。
