# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: Higangssh.hyperbutler
PackageVersion: 0.1.0-preview.1
MinimumOSVersion: 10.0.22000.0
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
# winget runs the MSI without its options page, where the Hyper-V Administrators box is
# ticked by default; ADDHYPERVADMIN=1 gives the person who runs `winget install` the same
# default (docs/install.md). Virtual Machine Platform is turned on if it is off.
InstallerSwitches:
  Custom: ADDHYPERVADMIN=1
UpgradeBehavior: install
ElevationRequirement: elevatesSelf
ExpectedReturnCodes:
  - InstallerReturnCode: 3010
    ReturnResponse: rebootRequiredToFinish
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/Higangssh/hyperbutler/releases/download/v0.1.0-preview.1/hyperbutler-v0.1.0-preview.1-windows-amd64.msi
    InstallerSha256: E6A7EFFA43DB1D4FB13332D813DCAEAA2648941BE971F758D05FFABE262C830E
    ProductCode: '{0EE16EE2-3DBF-4BBD-B691-F042233F8DA8}'
    AppsAndFeaturesEntries:
      - DisplayName: hyperbutler
        Publisher: hyperbutler
        DisplayVersion: 0.1.0
        ProductCode: '{0EE16EE2-3DBF-4BBD-B691-F042233F8DA8}'
        UpgradeCode: '{7280F4EA-D72B-40D2-A391-68035BD73997}'
        InstallerType: wix
ManifestType: installer
