ShortDescription: A lightweight, Docker-compatible engine for Windows that does not need WSL.
Description: |-
  hyperbutler runs Docker Engine in a small Hyper-V VM through the Windows Host Compute
  Service, without WSL, and works on Windows 11 Home. The stock docker CLI and Compose
  (bundled) talk to it through a "hyperbutler" docker context. Disk space is given back to
  the host automatically.

  The installer adds the installing user to Hyper-V Administrators and turns on Virtual
  Machine Platform if it is off; sign out and back in (or restart) once, then run
  "hyperbutler start". This is a preview release.
Moniker: hyperbutler
