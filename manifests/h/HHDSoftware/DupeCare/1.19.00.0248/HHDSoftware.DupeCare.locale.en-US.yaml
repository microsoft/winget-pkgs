ShortDescription: Automatically deduplicate data and compress files in your folders.
Description: DupeCare is a free and simple data deduplication and compression software for Windows. It allows you to create folders where redundant data is automatically deduplicated and compressed on the fly, while decompression happens in real time. The utility works at the file system level and provides a reliable and easy to use single-instance storage (SIS) solution for individual folders.
