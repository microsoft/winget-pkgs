Description: DupeCare 是一款适用于 Windows 的免费且简单的数据去重与压缩软件。它允许您创建一些文件夹，其中的冗余数据会被自动去重和压缩，而解压缩则实时完成。该实用程序在文件系统级别工作，可为单个文件夹提供可靠且易用的单实例存储（SIS）解决方案。
