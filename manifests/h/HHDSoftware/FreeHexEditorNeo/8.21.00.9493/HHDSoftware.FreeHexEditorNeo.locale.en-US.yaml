ReleaseNotes: |-
  New Features
  Wildcard pattern support
  This release adds support for string patterns with wildcard characters ? and * throughout the editor. Wildcard patterns are supported by Find, Find All, Replace, Replace All, Find in Files, Replace in Files, Pattern Statistics and Pattern Coloring functions.Alignment search in regular expression mode
  Regular expression mode now also supports searching with alignment.
  Alignment support in Find in Files
  Find in Files and Replace in Files now also support alignment.
  Updated Features
  Macros breaking change
  This release introduces new pattern interfaces in macros. New approach simplifies pattern creation and reduces the number of different APIs while retaining and even extending offered functionality. Old macros may need to be updated. See Macro API Breaking Changes in version 8.21 for more information.Improved macro recording
  Selecting data with mouse will now also add corresponding calls in a recorded macro.
  Updated language packs
  Added missing localizations for several components.
  Bug Fixes
  Several bug fixes
  This release fixes a number of reported and internally discovered bugs and improves performance and reliability.
