ReleaseNotes: |-
  ## 更新说明

  本次更新新增下载管理，支持逐项查看进度、停止任务与失败重试，批量下载时自动跳过已有文件，并修复听力资源下载和 PDF 书签处理等问题。

  ### 新增与优化

  • 新增 “下载管理” 窗口，逐项显示资源名称、状态、进度、文件大小与下载速度，支持搜索及按 “进行中 / 需处理 / 已完成” 筛选。
  • 下载与解析错误统一在任务列表中展示，支持查看、复制错误详情及打开保存文件夹，避免批量失败时弹出过长的错误提示（[#96](https://github.com/happycola233/tchMaterial-parser/issues/96)）。
  • 批量下载时自动跳过保存位置已有的同名文件，重新下载整套资源时只补齐缺失与上次失败的文件，避免重复生成带编号的副本（[#94](https://github.com/happycola233/tchMaterial-parser/pull/94)）。
  • 支持停止整批下载或选中的任务；已完成的文件保留，未完成任务会清理临时文件。
  • 当前下载结束后，可重新下载失败或已停止的任务，也可一键 “重试失败项”；解析失败的页面支持单独 “重新解析”。重新下载从头开始。
  • 下载管理保留本次运行的任务记录，关闭管理窗口后下载仍会继续；清除已完成记录不会删除文件。界面适配深浅色主题与高 DPI 显示。
  • 更新下载操作说明，补充发布版系统要求与友情链接。

  ### 问题修复

  • 修复部分英语听力课件返回 `400 InvalidArgument`、无法下载的问题；教材配套听力与听力课件统一按官网播放器顺序选择音频，优先使用转码后的播放文件（[#95](https://github.com/happycola233/tchMaterial-parser/issues/95)）。
  • 修复 PDF 书签写入失败后仍被标记为下载成功的问题，失败原因会记录在下载管理中，并保留原有目标文件。
  • 改进文件大小校验，避免服务器返回异常大小信息或压缩传输内容时，将下载结果误判为失败。
  • 完善停止下载与退出程序时的临时文件清理，并防止重试任务覆盖已有文件。
  • 优化下载进度刷新，减少频繁更新界面的开销，并加强任务详情与错误信息中的登录凭据隐藏处理。

  **Full Changelog**：[v4.3...v4.4](https://github.com/happycola233/tchMaterial-parser/compare/v4.3...v4.4)
