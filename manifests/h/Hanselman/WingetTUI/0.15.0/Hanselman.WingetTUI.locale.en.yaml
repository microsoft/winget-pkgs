ReleaseNotes: |-
  winget-tui v0.15.0
  A terminal UI for Windows Package Manager (winget).
  📦 Downloads
  ──────────────────────────────┬─────────────────────────────────────
  File                          │Platform
  ──────────────────────────────┼─────────────────────────────────────
  winget-tui-x64.exe            │Windows x64
  ──────────────────────────────┼─────────────────────────────────────
  winget-tui-arm64.exe          │Windows ARM64
  ──────────────────────────────┼─────────────────────────────────────
  winget-tui-<version>-x64.zip  │Windows x64 portable ZIP for winget
  ──────────────────────────────┼─────────────────────────────────────
  winget-tui-<version>-arm64.zip│Windows ARM64 portable ZIP for winget
  ──────────────────────────────┴─────────────────────────────────────
  Highlights
  - Batch uninstall from Installed: select packages with Space or a, then press x.
  - Publisher and estimated-size columns, sortable headers, startup defaults, and CSV exports.
  - Per-view caching restores selection, scrolling, filters and sorting when switching tabs.
  - User/Machine install scope is shown and preserved on upgrades when uniquely detected.
  - Signed x64 and ARM64 executables; portable ZIPs include the MIT license.
  Usage
  Download the executable for your platform and run it. No installation required.
  What's Changed
  - fix: remove unnecessary closure borrows by @shanselman in #475
  - ci: bump actions/setup-node from 7.0.0 to 7.1.0 by @dependabot[bot] in #453
  - deps: bump tokio from 1.53.1 to 1.54.1 by @dependabot[bot] in #470
  - [Repo Assist] docs: document theme config key in AGENTS.md by @shanselman in #476
  - feat: show installed package scope and retain it on upgrades by @shanselman in #477
  - ci: bump github/gh-aw-actions/setup from 0.89.20 to 0.93.3 by @dependabot[bot] in #469
  - Add batch uninstall and publisher/size sorting by @ansromanov in #458
  - deps: bump unicode-width from 0.2.2 to 0.2.3 by @dependabot[bot] in #482
  - [Repo Assist] test: cover multi-byte and wide-character fields in extract_field by @github-actions[bot] in #435
  - [Repo Assist] test: cover format_size KiB/MiB/GiB boundaries by @github-actions[bot] in #478
  - [Repo Assist] docs: add Unreleased changelog section for post-0.14.0 commits by @github-actions[bot] in #479
  New Contributors
  - @ansromanov made their first contribution in #458
  Full Changelog: v0.14.0...v0.15.0
