ShortDescription: A small GUI and tray front end for SSHFS-Win that mounts SSH servers as drive letters.
Description: |-
  SSHFS-Win Tray keeps a list of SSH connections and mounts each one as a Windows drive letter
  by starting sshfs-win.exe. It supports private key, saved password (DPAPI-encrypted) and
  ask-on-connect authentication, stays in the notification area, and is a single portable exe.
  Unofficial; not affiliated with the SSHFS-Win or WinFsp projects.
