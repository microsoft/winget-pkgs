ShortDescription: Converts mixed-script Korean text into hangul-only text
Description: Gukhanmun converts Korean text written in mixed script, with hanja characters interleaved with hangul, into hangul-only text. It provides a Rust library and command-line tool with support for plain text, HTML, and Markdown formats.
Tags:
- hangul
- hanja
- korean
- mixed-script
ReleaseNotes: "Released on October 24, 2026.\n\n### gukhanmun\n\n  • Added `Builder::hanja_variant_set()` for selecting the hanja spelling used in rendered output independently of the rendering mode.  A separately selected variant set remains in effect when the rendering mode changes, while complete `RenderOptions` replace both settings.  \\[[\\#11](https://github.com/dahlia/gukhanmun/issues/11), [\\#12](https://github.com/dahlia/gukhanmun/pull/12)\\]\n  • Added `Builder::punctuation()` with `preserve`, `modern`, `traditional`, and `traditional-vertical` output profiles and custom role styles. The default preserves punctuation across plain text, HTML, and Markdown. Technical guards include Unicode Latin letters, and contextual spaces do not detach combining marks or format controls.  HTML block, list, and table elements trim contextual spaces without changing annotation windows. \\[[\\#27](https://github.com/dahlia/gukhanmun/issues/27), [\\#28](https://github.com/dahlia/gukhanmun/pull/28)\\]\n  • Added automatic reading selection from a fully delimited following Korean particle, including `으로`/`로` and combinations such as `으로는`. Conversion keeps the source particle and falls back to the dictionary default when evidence is uncertain or no reading fits; explicit dictionary overrides stay authoritative.  \\[[\\#20](https://github.com/dahlia/gukhanmun/issues/20), [\\#25](https://github.com/dahlia/gukhanmun/pull/25)\\]\n  • Changed `Engine` streaming boundaries：a sole non-block root `Close` with pending text is emitted at the next token, `flush()`, or `finish()`. `finish()` supplies EOF evidence while `flush()` stays conservative; particle lookahead retains four extra source scalars beyond the dictionary tail allowance.  \\[[\\#20](https://github.com/dahlia/gukhanmun/issues/20), [\\#25](https://github.com/dahlia/gukhanmun/pull/25)\\]\n  • Added candidate-aware dictionary APIs and deterministic default reading selection while preserving existing bundled defaults. Higher-priority dictionaries replace all readings for a key.  \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n  • Dictionary-wide homophone marking now includes the selected candidate's suffix reading, including custom `MapDictionary` suffixes.  \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n  • Added competing readings to the bundled *Open Korean Dictionary* data, preserving existing default choices and dictionary priority. \\[[\\#21](https://github.com/dahlia/gukhanmun/issues/21), [\\#24](https://github.com/dahlia/gukhanmun/pull/24)\\]\n  • Added the `loanwords` feature, `loanwords` module and `Builder::bundled_loanwords()` to compose loanword examples after user dictionaries and before preset dictionaries. The `loanwords` feature is enabled by default; `ko-kr` includes the dictionary automatically, while `ko-kp` leaves it disabled. Use `Builder::no_bundled_loanwords()` to disable only this dictionary. Builds without default features must enable `loanwords` or call `Builder::no_bundled_loanwords()` for `ko-kr`; otherwise `build()` returns `Error::Config`. \\[[\\#18](https://github.com/dahlia/gukhanmun/issues/18), [\\#26](https://github.com/dahlia/gukhanmun/pull/26), [\\#31](https://github.com/dahlia/gukhanmun/pull/31)\\]\n  • Changed weekly data updates to target the maintenance branch of the newest stable release series that ships the dictionary, with a separate PR keeping *main* current. Before the dictionary's first stable release, updates target *main* only. \\[[\\#18](https://github.com/dahlia/gukhanmun/issues/18), [\\#26](https://github.com/dahlia/gukhanmun/pull/26)\\]\n  • Updated the bundled *Open Korean Dictionary* (우리말샘) snapshot to 2026-10-04.  \\[[\\#29](https://github.com/dahlia/gukhanmun/issues/29), [\\#30](https://github.com/dahlia/gukhanmun/pull/30)\\]\n  • Updated the bundled *Standard Korean Dictionary* (標準國語大辭典) snapshot to 2026-10-12.  \\[[\\#29](https://github.com/dahlia/gukhanmun/issues/29), [\\#30](https://github.com/dahlia/gukhanmun/pull/30)\\]\n\n### gukhanmun-cdb\n\n  • Added v2 candidate payloads and `lookup().candidates()`, preserving v1 loading and selected-default lookup methods.  \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n\n### gukhanmun-cli\n\n  • Added `--hanja-variant-set` for selecting `as-dictionary`, `shinjitai`, `kanxi`, `simplified`, or `asahimoji` whenever the selected rendering mode emits hanja.  \\[[\\#11](https://github.com/dahlia/gukhanmun/issues/11), [\\#12](https://github.com/dahlia/gukhanmun/pull/12)\\]\n  • Added `--punctuation` and `--punctuation-profile` to normalize punctuation with a built-in profile or custom JSON configuration.  Technical guards include Unicode Latin letters, and contextual spaces do not detach combining marks or format controls.  HTML block, list, and table elements trim contextual spaces without changing annotation windows.  \\[[\\#27](https://github.com/dahlia/gukhanmun/issues/27), [\\#28](https://github.com/dahlia/gukhanmun/pull/28)\\]\n  • Added automatic reading selection from a fully delimited following Korean particle, including `으로`/`로` and combinations such as `으로는`. Conversion keeps the source particle and falls back to the dictionary default when evidence is uncertain or no reading fits; explicit dictionary overrides stay authoritative.  \\[[\\#20](https://github.com/dahlia/gukhanmun/issues/20), [\\#25](https://github.com/dahlia/gukhanmun/pull/25)\\]\n  • Added competing readings to the bundled *Open Korean Dictionary* data, preserving existing default choices and dictionary priority. \\[[\\#21](https://github.com/dahlia/gukhanmun/issues/21), [\\#24](https://github.com/dahlia/gukhanmun/pull/24)\\]\n  • Enabled the bundled NIKL loanword examples by default for `ko-kr`, before the preset dictionary and after user dictionaries. Use `--no-loanwords` to disable them, or `--loanwords` to enable them for `ko-kp`. `--no-bundled-dictionaries` disables all bundled dictionaries. \\[[\\#18](https://github.com/dahlia/gukhanmun/issues/18), [\\#26](https://github.com/dahlia/gukhanmun/pull/26), [\\#31](https://github.com/dahlia/gukhanmun/pull/31)\\]\n  • Included *NOTICE.md* in CLI binary archives to retain attribution for bundled dictionary data, including the NIKL loanword examples. \\[[\\#18](https://github.com/dahlia/gukhanmun/issues/18), [\\#26](https://github.com/dahlia/gukhanmun/pull/26)\\]\n  • Changed weekly data updates to target the maintenance branch of the newest stable release series that ships the dictionary, with a separate PR keeping *main* current. Before the dictionary's first stable release, updates target *main* only. \\[[\\#18](https://github.com/dahlia/gukhanmun/issues/18), [\\#26](https://github.com/dahlia/gukhanmun/pull/26)\\]\n  • Load candidate-bearing FST/CDB v2 dictionaries through existing dictionary options, retaining bundled default readings and positional forms. \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n  • Dictionary-wide homophone marking includes selected suffix readings. \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n  • Updated the bundled *Open Korean Dictionary* (우리말샘) snapshot to 2026-10-04.  \\[[\\#29](https://github.com/dahlia/gukhanmun/issues/29), [\\#30](https://github.com/dahlia/gukhanmun/pull/30)\\]\n  • Updated the bundled *Standard Korean Dictionary* (標準國語大辭典) snapshot to 2026-10-12.  \\[[\\#29](https://github.com/dahlia/gukhanmun/issues/29), [\\#30](https://github.com/dahlia/gukhanmun/pull/30)\\]\n\n### gukhanmun-core\n\n  • Added `ReadingCandidate`, `ReadingCandidates`, candidate lookup/enumeration methods, and `MapDictionary::insert_candidates()`. Selection happens before segmentation; alternatives retain their own marks and positional forms. Existing custom dictionary implementations remain supported.  \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n  • Dictionary-wide homophone marking indexes only selected candidates and includes their suffix readings.  \\[[\\#19](https://github.com/dahlia/gukhanmun/issues/19), [\\#22](https://github.com/dahlia/gukhanmun/pull/22)\\]\n  • Added automatic reading selection from a fully delimited following Korean particle, including `으로`/`로` and combinations such as `으로는`. Conversion keeps the source particle and falls back to the dictionary default when evidence is uncertain or no reading fits; explicit dictionary overrides stay authoritative.  \\[[\\#20](https://github.com/dahlia/gukhanmun/issues/20), [\\#25](https://github.com/dahlia/gukhanmun/pull/25)\\]\n  • Changed `Engine` streaming boundaries：a sole non-block root `Close` with pending text is emitted at the next token, `flush()`, or `finish()`. `finish()` supplies EOF evidence while `flush()` stays conservative; particle lookahead retains four extra source scalars beyond the dictionary tail allowance.  \\[[\\#20](https://github.com/dahlia/gukhanmun/issues/20), [\\#25](https://github.com/dahlia/gukhanmun/pull/25)\\]\n  • Added dictionary-guided recognition of Unicode z-variants, traditional/simplified forms, CJK compatibility ideographs, Joyo kanji old/new forms, and Asahi variants.  Ambiguous variant relations are accepted only when the dictionary identifies one matching sense, while exact source matches remain authoritative.  Compatibility ideographs are folded before fallback reading and numeral lookup.  \\[[\\#11](https://github.com/dahlia/gukhanmun/issues/11), [\\#12](https://github.com/dahlia/gukhanmun/pull/12)\\]\n  • Added `HanjaVariantSet` with `AsDictionary`, `Shinjitai`, `Kanxi`, `Simplified`, and `Asahimoji` output profiles. `Annotation::canonical_hanja()` exposes the dictionary spelling for a dictionary match and the source hanja for a fallback annotation, so rendering and policy middlewares use the same lexical identity. \\[[\\#11](https://github.com/dahlia/gukhanmun/issues/11), [\\#12](h"
