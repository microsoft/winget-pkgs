PackageIdentifier: HugoHumbert.AstraViewer
PackageVersion: 0.1.1
PackageLocale: fr-FR
Publisher: Hugo Humbert
PackageName: AstraViewer
License: Gratuiciel
ShortDescription: Générateur de décors spatiaux piloté par prompts - planètes, étoiles, trous noirs, astéroïdes et skyboxes.
Description: |-
  Décrivez le décor spatial voulu (« une géante gazeuse violette aux fins anneaux de glace ») : une IA choisit les
  paramètres et des shaders procéduraux le dessinent sur votre carte graphique. Retouchez avec des curseurs, composez
  des vues, et exportez des images haute résolution ou des scènes 3D (GLB, HDR, cubemaps) pour Blender ou Unreal.
  Fonctionne avec une IA locale gratuite (Ollama, à installer à part) ou avec une clé d'API Claude ou ChatGPT.
