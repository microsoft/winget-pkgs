ReleaseNotes: "# Highlights\n• **A smarter Keep top.** Only the fastest proxies run and the others are parked. A kept proxy\n  that stops answering is replaced, and the parked ones are checked again every hour. Client\n  endpoints, WARP included, take part too.\n• **21 new languages.** Nine more translations are now complete.\n• **Lighter on CPU and battery.** Animations stop when nobody can see them. The connect button's\n  light costs much less to draw. The core uses only as many processors as its load needs and\n  paces the reads of busy connections.\n• **OpenVPN profiles.** The app reads `.ovpn` files and `ovpn://` links.\n• **Psiphon gets through more often.** As the first hop, Psiphon scans CDN edges with Chrome's\n  TLS handshake and connects through the ones that answer. You can change its country from the\n  home page.\n• **WARP keeps searching, and can search deeper.** WARP searches for up to 3 minutes and learns\n  which noise and tunnel work on each network. When a WARP or Psiphon search finds nothing, the\n  app offers a deep search.\n• **Proxies that are not secure are marked.** A proxy that anyone on the way can read gets a red\n  *Not secure* mark that explains why. The list shows each proxy's transport and security, such\n  as `VLESS · XHTTP · REALITY`.\n• **Subscriptions download on hard networks.** The core downloads them with Chrome's TLS\n  handshake. When a download fails, the app says why and what to try.\n• **The desktop core runs in a process of its own.** The app's core is a library in the app, and\n  only the proxies run in the engine. If the engine crashes, the app stays open, shows why it\n  crashed and recovers.\n• **VPN mode by default on desktop.** When VPN mode needs administrator permission, the app asks\n  with a clear choice. On Linux it works without pkexec, and it also works in the AppImage.\n• **Router mode on Linux.** A transparent proxy for a whole network.\n• **Linux arm64, RPM and one install script.** There are deb, rpm and AppImage builds for x64 and\n  arm64. A single `install.sh` for macOS and Linux verifies what it downloads.\n• **Report a problem from the app.** A report carries every log and the crash. It can first turn\n  on 10 minutes of detailed logging. The core encrypts the report, and you send it by Telegram\n  or email, or keep it on your device.\n• **A beta channel.** GitHub pre-releases go only to users who join the beta channel. The update\n  dialog shows the change log, and every download is checked against its SHA-256 before it is\n  installed.\n• **A newer core.** xray-core v26.11.9, a Chrome 155 fingerprint, and ECH that works with every\n  fingerprint. Fake IPs survive a restart of the core. Many crash and hang fixes for XHTTP, WARP,\n  Psiphon, AmneziaWG and WireGuard.\n• **Steadier on every platform.** When the core stops by itself, Android, iOS and macOS take the\n  VPN down cleanly and say why, and a desktop VPN service that hangs has its engine stopped.\n  Android gives the core a quarter of\n  the device's RAM, so connections no longer lag. The Quick toggle and always-on VPN start the\n  core properly.\n\n## Downloads\n\n**Download based on your OS:**\n\n**بر اساس سیستم عامل خود دانلود کنید:**\n\n<!-- ASSETS:BEGIN -->\n<table>\n<thead><tr><th>OS</th><th>Download</th><th>Downloads</th><th>VirusTotal</th></tr></thead>\n<tbody>\n<tr>\n  <td rowspan=\"3\">Windows</td>\n  <td><a href=\"https://github.com/hiddify/hiddify-app/releases/download/v5.9.15/Hiddify-Windows-Setup-x64.Msix\"><img src=\"https://img.shields.io/badge/MSIX-x64-0078d7?logo=windows\" alt=\"MSIX x64\"></a></td>\n  <td><a href=\"https://github.com/hiddify/hiddify-app/releases/download/v5.9.15/Hiddify-Windows-Setup-x64.Msix\"><img src=\"https://img.shields.io/github/downloads/hiddify/hiddify-app/v5.9.15/Hiddify-Windows-Setup-x64.Msix?displayAssetName=false&label=%20&color=green&v=17951779828099\" alt=\"downloads\"></a></td>\n  <td><a href=\"https://www.virustotal.com/gui/file/9a406fd860c1d491d6ea5