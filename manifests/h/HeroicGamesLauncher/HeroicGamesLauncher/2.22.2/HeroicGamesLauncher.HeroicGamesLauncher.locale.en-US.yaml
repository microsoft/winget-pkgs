ReleaseNotes: |-
  Hi!
  After the last hotfix we identified some new issues especially with Rockstar and Ubisoft games and this new release focus on fixing them but also fixes other stuff as you can see bellow!
  Thanks!
  What's Changed
  - fix: Search for a heroic executable on PATH if our executable is not called "heroic" by @CommandMC in #5818
  - chore: Remove remnants of our Snap support by @CommandMC in #5814
  - chore: Use CODEOWNERS to automatically request reviews on PRs by @CommandMC in #5815
  - feat: Use umu to provide the Steam Runtime, and automatically enable it for native GOG games by @CommandMC in #5832
  - fix: Set LEGENDARY_CONFIG_PATH again by @CommandMC in #5867
  - fix: add default path for crossover on macOS by @WangEdward in #3728
  - fix(macOS): quote generated shortcut launch URL by @marcodallagatta in #5811
  - Fix #4699: Read no more than the last 1 MB of log files to be shown by @thatguywiththekids in #5457
  - feat: Update Legendary to 0.21.1 by @CommandMC in #5877
  - [UX] Do not allow moving a game inside itself by @arielj in #5871
  - Fix sideload installer overwriting Wine prefix by @ocean-sudo in #5868
  - fix: Make sure to set Wine-related options when adding a sideloaded game by @CommandMC in #5827
  - fix: Stop calling updateStatus if there are no more gamepads by @CommandMC in #5879
  - FIX: Sign Windows binaries during build via SignPath by @flavioislima in #5841
  - [UI] fix: prevent play with logs popup from closing when moving mouse to it by @Vidi0 in #5589
  - [Fix] Wishlist filter on Deals screen leaves no way out (#5588) by @flavioislima in #5602
  - [Feat] Manage Steam shortcuts via SteamClient API when Steam is running by @flavioislima in #5804
  - [UX] Fix pausing/canceling a download from game details page by @arielj in #5858
  - [UX] Print wiki links in logs by @arielj in #5883
  - [FIX] Do not watch legendary file to refresh the lilbrary by @arielj in #5470
  - [UX] Download known fixes even before downloading a game by @arielj in #5409
  - fix: Use the current known-fixes helper during launch by @matte-schwartz in #5886
  - [UX] Don't show Wine Manager settings on Mac by @arielj in #5857
  - [i18n] Updated Translations by @weblate in #5817
  - fix(gog): fix steam wrapper crash by add galaxy registry key by @imLinguin in #5887
  - [UI/UX] Improve Environmental Table settings and a few others by @flavioislima in #5304
  - fix: use env to lookup the path variable by @imLinguin in #5479
  - fix(gog): keep library entries when GamesDB is unavailable by @xianjianlf2 in #5798
  - feat: Various changes to improve the final build size by @CommandMC in #5884

  New Contributors
  - @marcodallagatta made their first contribution in #5811
  - @thatguywiththekids made their first contribution in #5457
  - @ocean-sudo made their first contribution in #5868
