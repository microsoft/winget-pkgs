ReleaseNotes: |-
  Hi!
  This version gives several improvements and fixes for Heroic overall while we work on some other big features that are already in testing/review like the itch.io, humble bundle and Steam integration, besides a new "plugin" system that will make it easier for people to add new integrations like Emulators support and many more in the future.
  Even though this is mostly a Hotfix, this bring some new nice features like the possibility of installing Proton-CachyOS, navigating the Epic and GOG store with the controller, new Discounts tabs for our new affiliates for Humble Bundle and Green Man Gaming and we also moved the Plausible Analytics to our own Self-Hosted intance to maintain 100% control of our data.
  What's Changed
  - [Fix] "Add Game" dialog resetting the Wineprefix if SteamGridDB API is used by @CommandMC in #5599
  - [Tech] Make LibraryManagers and GameManagers actual classes by @CommandMC in #4889
  - [Tech] No longer use GameManagers as singletons by @CommandMC in #4894
  - [i18n] Updated Translations by @weblate in #5583
  - Re-add rehype-raw dependency by @CommandMC in #5688
  - [UX] Add proton-cachyos to the wine manager by @arielj in #5463
  - Update Flatpak manifest to fix build by @CommandMC in #5697
  - Add missing encodeURIComponent in log uploader by @CommandMC in #5701
  - Create compatibilitytools.d if it does not exist by @CommandMC in #5699
  - Make Proton-CachyOS the default Proton version by @CommandMC in #5705
  - Move "Disable umu" into the "Legacy" section by @CommandMC in #5689
  - Switch GOG user APIs by @CommandMC in #5718
  - [TECH] Remove Wine-GE from the wine manager options by @arielj in #5251
  - Update to latest v41 of Electron by @CommandMC in #5716
  - [Tech] Point Plausible analytics to the self-hosted instance by @flavioislima in #5736
  - Add Green Man Gaming deals to the Discounts screen by @flavioislima in #5740
  - update Spanish language code to es-ES for Epic API requests by @mglourido in #5717
  - tech: update nile to 1.2.0 by @imLinguin in #5645
  - Update to Electron 43 and re-add React Dev Tools extension by @CommandMC in #5755
  - Fix various typos by @upriver4 in #5761
  - [Feat] Add Humble Bundle deals to the Discounts screen by @flavioislima in #5748
  - [Tech] Don't minify main, and add source maps by @CommandMC in #5766
  - Make GE-Proton downloads deterministic by @CommandMC in #5708
  - Hide ProgressDialog's indeterminate progress bar if it does not make sense by @CommandMC in #5743
  - fix: unify webview session partitions so login credentials carry over to stores by @kairosci in #5752
  - Added new currencies from GOG. by @Moon-yungg in #5779
  - [Feat] Resolve GOG Deals region from the user's GOG account by @flavioislima in #5790
  - [Feat] Make the Store Pages controllable with Joystick by @flavioislima in #5707
  - [Tech] Add Zoom runner to Plausible analytics by @flavioislima in #5799
  - Fix: show Rosetta warning when Rosetta is not installed by @flavioislima in #5772
  - [Fix] Respect hidden games in Console mode by @adamcolwell in #5788
  - [Feat] Update legendary and gogdl by @CommandMC in #5809
  - [Fix] Description of "Game Arguments" option by @CommandMC in #5810
  - [Fix] Correct reversed A/B and X/Y buttons on Nintendo controllers by @flavioislima in #5747
  - [Input] Improved gamepad key repeat to make navigation snappier by @veryprofessionaldodo in #5059
  - [i18n] Updated Translations by @weblate in #5806

