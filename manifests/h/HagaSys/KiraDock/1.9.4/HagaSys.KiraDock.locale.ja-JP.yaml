ShortDescription: Windows 10/11 向けの Mac 風ドック。アイコンの拡大・クイック検索・便利な道具をドックから。
Description: |-
  KiraDock は Windows 10/11 向けの、無料・広告なし・アカウント不要の Mac 風ドックランチャーです。
  - アイコンの拡大、フォルダーの中身（アイコン／一覧・名前順／新しい順）、アプリのグループ
  - 1クリックで、いつものアプリをまとめて開いて画面に並べる
  - アプリやファイルのクイック検索（計算もその場で）
  - 画面を撮る・文字を読み取る（OCR）・クリップボード履歴・色を拾う
  - 付箋・集中タイマー・世界時計・定型文・ファイルシェルフ・ウィンドウの整列
  - 複数モニター・高 DPI 対応、日本語・英語
  - RocketDock の設定とスキンを引き継げます（RocketDock に着想を得たもので、公式の後継ではありません）
