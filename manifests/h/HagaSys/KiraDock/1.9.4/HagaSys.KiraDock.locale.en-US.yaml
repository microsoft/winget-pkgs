ShortDescription: A Mac-style dock for Windows 10/11 with magnifying icons, quick search and built-in tools.
Description: |-
  KiraDock is a free, ad-free Mac-style dock launcher for Windows 10/11. No account is required.
  - Magnifying icons, folder stacks (icons or list, sorted by name or newest first) and app groups
  - One-click workspaces: open a set of apps and arrange their windows on screen
  - Quick search for apps and files, with a built-in calculator
  - Screenshot, text recognition (OCR), clipboard history and a color picker, all from the dock
  - Sticky notes, focus timer, world clock, snippets, file shelf and window tiling
  - Multi-monitor and high-DPI support, Japanese and English UI
  - Import your RocketDock settings and skins (inspired by RocketDock; not an official successor)
