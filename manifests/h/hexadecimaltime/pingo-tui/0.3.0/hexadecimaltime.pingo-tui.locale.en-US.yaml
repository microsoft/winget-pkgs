ShortDescription: A Go TUI client for Pingo, an Audience Response Tool
Description: Pingo CLI is a TUI client for Pingo. It features a live countdown, WebSocket-based real-time updates, and interactive terminal inputs. It supports all poll types of the Pingo web app. Additionally, it can track the history of joined sessions with timestamps and optional session names. Data about the sessions is stored locally in a SQLite database.
