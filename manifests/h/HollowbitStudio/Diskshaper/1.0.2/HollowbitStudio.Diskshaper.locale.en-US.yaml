ShortDescription: 'Storage cleaner that shows what is eating your drive and only moves safe items to the Recycle Bin.'
Description: 'Diskshaper scans your drive in seconds and sorts what it finds into plain groups: shader caches, Steam and Epic leftovers, Premiere and DaVinci Resolve caches, old installers, duplicate photos and huge forgotten files. Each group is marked Safe or Check first, and everything you clean goes to the Recycle Bin so it can be undone. Free and open source; nothing about you or your files is sent.'
