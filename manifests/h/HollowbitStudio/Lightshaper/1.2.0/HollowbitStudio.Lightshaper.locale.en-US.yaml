ShortDescription: A free, offline photo editor for RAW and JPEG photos, with sliders, masks, looks and batch export.
Description: 'Lightshaper edits photos in JPEG, PNG, HEIC, TIFF (8 and 16-bit), WebP, AVIF, JPEG XL, PSD and camera RAW from Canon, Nikon, Sony, Fujifilm, Panasonic, Olympus and more. Open single photos or whole folders. Light and colour sliders, tone curve, colour mixer, colour grading, noise reduction, gradient and radial masks, crop and straighten. Apply looks, match the look of another photo, or open Lightroom presets (.xmp). Rate photos with stars, copy edits across a folder and export them all as JPEG, PNG or WebP. Originals are never changed. Free and open source; no account, no ads, no AI.'
