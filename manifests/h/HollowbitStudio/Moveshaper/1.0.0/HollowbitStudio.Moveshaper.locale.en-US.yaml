ShortDescription: 'Move files, apps, bookmarks, Wi-Fi networks and wallpaper to a new computer, between Windows and Mac.'
Description: 'Open Moveshaper on both computers and type the six-digit code. Files go straight across your own network, encrypted and never through the cloud. Apps reinstall from their official sources, and bookmarks, Wi-Fi networks and wallpaper come along. Nothing on the new computer is overwritten, and an interrupted move picks up where it stopped. Free and open source, with no account.'
