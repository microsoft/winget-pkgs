Description: |-
  Video Lab 是一款 Windows 平台的视频批量处理工具，内置 FFmpeg 引擎，提供批量拼接、视频复刻（去重）、竖版转横版画布合成等处理流程。
  支持任务队列串行执行、参数预设、可视化画布预览，以及统一的输出设置（输出到目录 / 覆盖原视频、备份与冲突处理）。
