ShortDescription: An HTTP client for Windows where the request is a text file, not a form.
Description: |-
  Sling is an API client that stores requests as standard .http files, the format Visual Studio, JetBrains Rider and the VS Code REST Client already read.
  A collection is a folder, sharing is git push, and a change to a request is a normal diff.
  It adds request chaining, environments with a separate gitignored secrets file, OAuth 2.0 (client credentials and authorization code with PKCE), Postman collection import, curl paste, and a response pane that is a real editor buffer.
  No account, no cloud sync and no telemetry.
