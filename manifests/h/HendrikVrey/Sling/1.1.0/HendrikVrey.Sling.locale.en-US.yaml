ReleaseNotes: |-
  Auth panel, environment editor, OAuth 2.0 authorization code with PKCE, encrypted token storage, refresh and retry on a 401, quick open (Ctrl+P), change-on-disk detection with a diff, session restore, syntax highlighting in the request pane, and a default User-Agent.
