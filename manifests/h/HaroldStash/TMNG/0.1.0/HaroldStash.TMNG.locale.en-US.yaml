ShortDescription: Free, open-source system monitor and Task Manager alternative for Windows.
Description: |-
  TMNG (Task Manager Next Generation) shows CPU and GPU temperatures, fan speeds, per-app network and disk usage,
  processes grouped by app, alerts on any sensor, and a flight recorder that replays what the PC was doing.
  Every reading says whether it was measured, so a missing sensor never shows as a plausible-looking zero.
