ShortDescription: A keyboard-first launcher for Windows. Press a global hotkey to find and launch applications, files, folders, and actions.
Description: |-
  Nex replaces the Start menu. Press the Win key and a floating panel opens under
  your cursor with your applications, files and folders already indexed.

  It indexes the whole drive by reading the NTFS master file table directly, so a
  full index is practical rather than a background job that never finishes. The
  index keeps itself current with file and application watchers.

  Beyond launching, Nex evaluates arithmetic inline, keeps clipboard history,
  plays and controls local media, runs custom actions and web searches, and has a
  built-in assistant that can read, write, move and delete files and run commands
  behind a confirmation card.

  The panel renders as a pane of glass, refracting the desktop behind it, or as a
  solid surface if you prefer. Everything is keyboard-driven and the panel opens
  instantly.
