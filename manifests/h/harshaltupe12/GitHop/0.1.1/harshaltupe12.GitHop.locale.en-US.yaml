ShortDescription: Use multiple GitHub accounts on one Windows PC without mixing up identities.
Description: |-
  GitHop gives each git identity (work, personal, clients, open source) its own name, email and SSH key,
  picks the right one for every repo, and blocks commits and pushes made with the wrong identity
  before they leave your machine. Local-only: no accounts, no telemetry, no network calls.
