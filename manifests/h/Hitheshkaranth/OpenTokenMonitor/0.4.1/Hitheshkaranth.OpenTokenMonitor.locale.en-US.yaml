ShortDescription: Usage limit and cost monitor for Claude Code, Codex and Antigravity.
Description: |-
  OpenTokenMonitor is a local-first tray app that watches the usage limits of your AI coding agents.
  It shows live quota windows with reset countdowns, forecasts when a window will fill before it resets,
  and computes exact costs per project and per session from the CLIs' own session logs.
  Everything is computed on your machine: no account, no telemetry, no proxy.
