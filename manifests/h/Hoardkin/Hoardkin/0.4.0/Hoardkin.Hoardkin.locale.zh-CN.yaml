ShortDescription: 基于 Rust 的轻量磁盘空间分析、快捷键秒搜文件、系统透视与桌面宠物工具。
Description: |-
  囤灵（Hoardkin）是一款基于 Rust 打造的轻量免费 Windows 效率工具，集成可视化磁盘空间分析（方块图/环形图、可选 NTFS MFT 快速模式、大文件与重复文件、扫描快照、云盘占用）、Alt+空格全局秒搜与空格预览、系统安全透视（开机启动项与签名、摄像头/麦克风占用、端口与网络连接、浏览器扩展），以及陪伴工作的桌面宠物「灵」。只展示，不替你自动删除文件。
Tags:
- 磁盘分析
- 磁盘空间
- 文件搜索
- 重复文件
- 桌面宠物
ReleaseNotes: |-
  最多 10 只灵同屏、4 档调大小、可拖到窗口顶上陪伴，Windows 拖放与界面全面顺滑。
  - 最多 10 只灵同时陪伴，拖到窗口上沿松手即可停驻；支持 4 档实时缩放与全新「灵」分栏
  - 重制牛牛走路动画，新增电脑发热/显卡高载时的忙碌状态与平时偶尔撒欢小跑
  - Windows 全新无边框标题栏、60+ fps 流畅拖放与防闪烁优化，并修复搜索右键菜单与选中高亮
