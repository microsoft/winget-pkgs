ShortDescription: Fast visual disk space analyzer, instant file search, system monitor, and desktop pet built in Rust.
Description: |-
  Hoardkin is a lightweight, free Windows utility built in Rust that combines visual disk space analysis (treemap blocks and sunburst rings, optional NTFS MFT fast mode, large and duplicate files, scan snapshots, cloud drive usage), instant Alt+Space file name and content search with Spacebar preview, system security visibility (startup items with signatures, camera/mic access, listening ports, network connections, browser extensions), and animated desktop companions (Lings) with break reminders and a focus timer. Hoardkin only shows what uses space and never auto-deletes files.
