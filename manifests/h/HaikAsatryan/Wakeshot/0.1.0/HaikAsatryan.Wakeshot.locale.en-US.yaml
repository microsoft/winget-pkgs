ShortDescription: Keeps the PC awake only while something needs it, such as an AI agent or a build, then lets it sleep as usual.
Description: |-
  Wakeshot is a small tray app for Windows 11. It keeps the PC awake while an AI coding agent such as Claude Code is
  working, while a command started with `wakeshot run` runs, or while Keep awake is on in the tray menu. When the work
  ends, the PC sleeps again under your own power settings. It can also keep a laptop working with the lid closed.
