# yaml-language-server: $schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json

# The version manifest. It carries nothing but the identity of the package and a pointer at the
# locale manifest that holds the words; the installer manifest beside it holds the facts.
#
# PackageIdentifier is permanent. winget-pkgs has no rename: changing it later means submitting a
# new package and asking a moderator to remove the old one, and anyone who ran
# `winget install HONCO.Termiyo` keeps a pin on the old identifier until they uninstall. So
# `HONCO` here is the legal entity from LICENSE clause 1 (HONCO PRIVATE LIMITED), shortened the
# way the repository's other corporate publishers are, and it is being chosen once.
#
# The three file names and the directory path must match this identifier character for character,
# case included — manifest validation compares them and fails with Manifest-Path-Error when they
# drift. The partition directory `h` is the lowercase first letter of the identifier, which is the
# one place the casing deliberately differs (doc/Authoring.md, "Understanding the directory
# structure").
PackageIdentifier: HONCO.Termiyo
PackageVersion: 0.4.27
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.12.0
