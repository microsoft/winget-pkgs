ShortDescription: A WhatsApp-style app for talking to your AI agents. OpenClaw, Hermes, Claude Code, Codex and any ACP agent are contacts with their own chats.
Description: |-
  littleguys is a small, free, open-source app for talking to your AI agents, WhatsApp-style.
  OpenClaw, Hermes, Claude Code, Codex and any Agent Client Protocol (ACP) agent, on every machine, are contacts with their own chats, and a little guy in the taskbar shows who needs you.
  - Follow and reply to every Claude Code and Codex session from one window.
  - Answer permission prompts and command approvals without going back to the terminal.
  - Chat with OpenClaw and Hermes agents running on this computer or on another one.
