ReleaseNotes: |-
  Read PDF text content with Script method

  The new app.readFilePdf(filename) method can be used in the Script method to read the text content of a PDF into a string. Only real text can be read; if the text is stored as an image, it cannot be extracted. The program now has native PDF support without the need for external tools, making PDF loading faster.

  An optional second parameter can be used to read only a specific page: app.readFilePdf(filename, page). If omitted, the text from all pages is returned.

  Place panels on the right

  Individual UI panels can now be configured to appear on the right side of the main window instead of the default left side. This setting is available in the Settings window, where each panel can be independently assigned to either the left or right side. You can keep all panels on the left (the default), move all of them to the right, or mix and match — placing only some panels on the left and others on the right — to suit your workflow.

  Hide left or right panel by clicking panel button

  You can collapse either the left or right panel by clicking its panel button, which gives you more room to work by exposing a larger area for the item list.

  Full list of changes in version 4.24
  - Metadata: Added native support for PDF files
  - Script Method: Added method app.readFilePdf(filename) to extract all content from PDF files as text
  - Improved reading metadata for Panasonic RAW files (.RW2)
  - Improved reading Exif metadata when file contains unknown fields or malformed data
  - Settings: Option to preserve file timestamps when copying files in batch mode
  - Settings: Export keyboard shortcuts to a CSV file
  - Timestamp method: Fixed created timestamp sometimes off by one hour on macOS
  - Timestamp method: Fixed issue when timestamp fields are blank when using relative date and time
  - Command palette: Now sorted alphabetically
  - Settings: Choose to show individual UI panels in the right instead of the left of the main window
  - UI: Methods panel can now be collapsed to show more of the item list
  - Settings: Menu Position value "Auto" is no longer available. New default is "Top of list"
