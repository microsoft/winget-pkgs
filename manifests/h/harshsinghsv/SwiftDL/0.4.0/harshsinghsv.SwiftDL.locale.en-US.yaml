ShortDescription: Free, open-source download manager with browser integration
Description: SwiftDL is a download manager for Windows, macOS and Linux that pulls every file at full speed. It splits one download across many parallel connections, resumes instantly, and shows IDM-style download windows. Browser integration for Chrome, Edge, Brave, Vivaldi, Chromium and Firefox is installed with the app through a native messaging host.
