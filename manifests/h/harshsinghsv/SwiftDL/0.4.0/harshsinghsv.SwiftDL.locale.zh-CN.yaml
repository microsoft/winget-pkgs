ShortDescription: 自带浏览器集成的免费下载管理器
Description: SwiftDL 是一款面向 Windows、macOS 与 Linux 的下载管理器，能够跑满每条连接的带宽。它将单个下载拆分到多条并行连接，支持即时断点续传，并提供类似 IDM 的下载窗口。应用通过原生消息主机自带 Chrome、Edge、Brave、Vivaldi、Chromium 与 Firefox 的浏览器集成。
