ReleaseNotes: |-
  Bisnor v5.5.0 💎

  People Search & Faster Playback
  نسخه 5.5.0 بیسنور با سه تمرکز منتشر شد: پیدا کردن بازیگرها و عوامل، رسیدن فیلم‌های تازه به بنر خانه، و سرعت بیشتر روی اینترنت کند. 💎

  🔍 People Search
  - اضافه شدن ردیف افراد بالای نتایج جست‌وجو، با عکس دایره‌ای و نام زیر آن
  - جست‌وجوی نام بازیگر و عوامل، فارسی و انگلیسی و حتی چندکلمه‌ای
  - تطبیق نام بدون حساسیت به «ی/ک» و اعراب
  - نمایش حداکثر ۱۰ نفر در ردیف و رفتن مستقیم به صفحه‌ی همان شخص
  - ردیف افراد از ایندکس محلی ساخته می‌شود، بدون درخواست شبکه‌ی اضافه

  🎭 Person Page
  - صفحه‌ی اختصاصی هر بازیگر و عامل با آواتار، نام و چیپ نقش
  - نمایش همه‌ی آثار آن شخص در گرید دو ستونه
  - فیلمی که از آن وارد صفحه شدیم همیشه اول لیست می‌آید

  🛠️ Fixes
  - رفع باگ «اثری ندارد» در صفحه‌ی بازیگر
  - حالا بازیگرها و عوامل هر فیلم از پاسخ جزئیات فیلم خوانده و در ایندکس محلی ذخیره می‌شوند
  - لینک پخش هر فیلم بعد از یک‌بار resolve شدن، ۱۰ دقیقه کش می‌شود
  - صفحه‌ی «سرورها در دسترس نیست» دیگر با کندی موقت سرور الکی نمی‌آید

  🎬 Home & Fresh Titles
  - بنر خانه دیگر فقط ۶ تای اول «محبوب‌ترین‌ها» نیست؛ جدیدترین و محبوب‌ترین یکی‌درمیان چیده می‌شوند
  - اسلاید اول بنر همیشه جدیدترین فیلم است
  - رفرش دستی، کش ۵ دقیقه‌ای حافظه را دور می‌زند
  - اگر برنامه مجبور شود کش قدیمی را نشان دهد، با یک پیام کوتاه اطلاع می‌دهد

  ⚡ Faster on Slow Networks
  - جست‌وجو در دو منبع حالا موازی انجام می‌شود، نه یکی‌یکی
  - نتایج محلی از همان حرف اول نمایش داده می‌شوند
  - کاهش زمان انتظار اتصال و خواندن به ۷، ۱۲ و ۱۵ ثانیه و سقف جدا برای هر مرحله‌ی گرفتن لینک پخش
  - درخواست‌های اولیه‌ی خانه از ۸ به ۶ کاهش یافت و بعد از اولین موفقیت فقط ۲ سرور با هم رقابت می‌کنند
  - نتیجه: باز شدن سرد خانه در شبکه‌ی شبیه‌سازی‌شده‌ی GSM از حدود ۲۸ ثانیه به حدود ۵ ثانیه رسید

  🇮🇷 Persian by Default
  - زبان پیش‌فرض در نصب تازه فارسی است
  - از تنظیمات می‌توانید به انگلیسی تغییر دهید
  - صفحه‌ی خوش‌آمد و انتخاب اولیه‌ی زبان و تم حذف شد و برنامه مستقیم وارد خانه می‌شود

  📱 Android
  - نسخه 5.5.0 با versionCode 47
  - اندروید ۷.۰ و بالاتر
  - امضای اپ همان امضای نسخه‌های قبلی است، پس بدون حذف روی نسخه‌ی نصب‌شده به‌روزرسانی می‌شود
  - فایل نصب: Bisnor-5.5.0.apk
  - SHA256SUMS.txt چک‌سام فایل این ریلیس را دارد

  یک نکته
  ایندکس افراد از فیلم‌هایی ساخته می‌شود که تا حالا باز کرده‌اید. در نصب کاملاً تازه، تا اولین فیلم را باز نکنید ردیف افراد خالی است؛ بعد از آن پایدار می‌ماند و کامل‌تر هم می‌شود.

