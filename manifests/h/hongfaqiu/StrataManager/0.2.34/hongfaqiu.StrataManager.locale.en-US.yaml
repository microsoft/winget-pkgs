ReleaseNotes: "- \"Out of VRAM while loading\" is now recognised, with a one-click fix: when the engine exited while loading the model because VRAM or Windows virtual memory ran out, the diagnosis only said the engine crashed or the cause was unknown. It now reads the end of this start's engine log (at most 64 KB, latest start only), recognises upstream VRAM shortages (cudaMalloc failed, out of memory, \"N MiB of M MiB VRAM free\", …) and Windows commit shortages (commit left, paging file is too small, WinError 1455), reports \"Out of VRAM\" or \"Windows ran out of virtual memory\", and shows the matching log lines as evidence. For a VRAM shortage the card adds \"Reserve 1536 MiB of VRAM and restart\" (2048 if the reserve is already 1536 or more), which writes --vram-reserve-mib and restarts; it also explains that the free-VRAM figure is read after the engine filled VRAM itself, not taken by other programs. For a commit shortage it suggests setting virtual memory to \"System managed size\" and restarting the PC."
