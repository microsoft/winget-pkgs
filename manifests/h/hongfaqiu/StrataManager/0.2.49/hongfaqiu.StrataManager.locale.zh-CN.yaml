PackageIdentifier: hongfaqiu.StrataManager
PackageVersion: 0.2.49
PackageLocale: zh-CN
ShortDescription: 面向 Strata 本地推理的桌面工作台。
Description: Strata Manager 是一款面向 Niko1221/Strata 本地大模型推理引擎的开源桌面管理工具，将运行环境准备、模型配置、服务控制、聊天、监控、调优与基准测试整合到同一工作台，降低使用门槛。已下载的模型权重不会被改动。
Tags:
- 人工智能
- 大模型
- 大语言模型
- 本地大模型
ReleaseNotes: |-
  - 并发对比允许安全切换同端口受管配置（#232）：修复同端口配置切换时，先检查目标端口绑定而直接触发 STARTUP_PORT_IN_USE 的问题。现在会先确认替换绑定兼容并校验当前进程树归属，安全排空、卸载并停止旧服务后再等待原受管监听退出并启动新配置（失败时自动回滚恢复原模型），仍会严格拦截外部监听进程。
  - 完整参数配置支持 --draft 等参数及自动补全（#229）：在完整引擎参数列表注册 --draft、--draft-model 和 --draft-conf（1 个参数值），合并引擎 --help 标志参与参数名称自动补全，并在已有 --draft 参数行中提供 dflash2 候选值补全。
