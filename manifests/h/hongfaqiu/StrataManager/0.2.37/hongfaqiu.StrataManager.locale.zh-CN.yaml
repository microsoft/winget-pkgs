PackageIdentifier: hongfaqiu.StrataManager
PackageVersion: 0.2.37
PackageLocale: zh-CN
ShortDescription: 面向 Strata 本地推理的桌面工作台。
Description: Strata Manager 是一款面向 Niko1221/Strata 本地大模型推理引擎的开源桌面管理工具，将运行环境准备、模型配置、服务控制、聊天、监控、调优与基准测试整合到同一工作台，降低使用门槛。已下载的模型权重不会被改动。
Tags:
- 人工智能
- 大模型
- 大语言模型
- 本地大模型
ReleaseNotes: |-
  - 适配 Strata 0.2.10（引擎 0.1.56）的 Linux 拆分引擎：允许安装包根目录下的 strata-split-<N> 可执行文件（可带后缀），其它新文件仍会被拦下。
  - 引擎 0.1.56 起可选 DFlash2 预测：「预测（投机解码）」多了 DFlash2；同时处理 2 个以上请求时会说明 DFlash2 一次只服务一个请求、将改用 MTP。0.2.9 的并发默认值不变。
  - 更新完成后提示 DeepSeek 引擎可更新：Strata 更新完成而本机 DeepSeek 引擎低于最新版本时，显示「DeepSeek 引擎可更新」和「去更新」，在模型页重新准备 DeepSeek-V4.1-Flash 即可更新。
  - CUDA 12 用户可改用 CUDA 13 的提示：NVIDIA 驱动 ≥580.65 而当前是 CUDA 12 包时，更新弹窗说明已支持 CUDA 13（首次启动约 1 分钟，CUDA 12 约 5 分钟）；更新仍保留 CUDA 12，不会自动切换。
  - 引擎崩溃时可回退到上一版引擎：启动失败卡片在引擎崩溃或异常退出时提供「回退到」本机已安装的上一版（如引擎 0.1.55），无需下载；本机没有旧版时可去选择其他引擎版本。
