PackageIdentifier: hongfaqiu.StrataManager
PackageVersion: 0.2.31
PackageLocale: zh-CN
ShortDescription: 面向 Strata 本地推理的桌面工作台。
Description: Strata Manager 是一款面向 Niko1221/Strata 本地大模型推理引擎的开源桌面管理工具，将运行环境准备、模型配置、服务控制、聊天、监控、调优与基准测试整合到同一工作台，降低使用门槛。已下载的模型权重不会被改动。
Tags:
- 人工智能
- 大模型
- 大语言模型
- 本地大模型
ReleaseNotes: |-
  - DeepSeek-V4.1-Flash 的图像开关按 --vision on|off 识别：上游 v0.2.8 起每个 DeepSeek 配置都写有 --vision on 或 --vision off，此前 Manager 只要看到 --vision 就当作开了图像，Arena 测速上传会把关着图像的 DeepSeek 跑分也标成「图像开」。现在 DeepSeek 只有明确写 on 才算开，off 或缺值都算关；Qwen 的不带值 --vision 不变。DeepSeek 留给其他应用的显存 --reserve-mib 也计入测速分组。
  - 「启用图像支持」对 DeepSeek 只显示一个开关：DeepSeek 引擎自带读图，不需要另选视觉引擎、模型和投影文件。此前点「启用图像」会给 DeepSeek 写 Qwen 式的 vision 段并追加不带值的 --vision，DeepSeek 引擎会把下一个参数当成它的值，或直接报「缺少参数值」。现在打开开关只写 --vision on，关闭写 --vision off，其他参数不动；Qwen 配置的对话框不变。
  - macOS 27 以下不再能启用图像输入，并直接说明原因：上游 Metal 引擎包里的读图组件 strata-vision 按 macOS 27 构建（Mach-O 最低系统 27.0），更早的系统无法启动它。现在「启用图像支持」窗口会读取读图组件的最低系统要求并与本机对比；不满足时显示「图像输入需要 macOS 27+」提示（本机版本 → 需要版本），保存按钮停用，保存前的文件检查也会拒绝。只读文件头，不会启动任何程序。文字对话不受影响；换用支持本机系统的读图组件后会自动恢复。DeepSeek 的图像开关也按其引擎做同样检查：系统不满足时不能打开，已打开的仍可关闭。提示覆盖全部 10 种界面语言。
  - Mac/Linux 上图像引擎的默认路径不再带 .exe：主引擎不是 .exe 时，默认填 strata-vision（与主引擎同一文件夹）；Windows 不变。
  - 按 Strata 0.2.8 收紧几处判断：
    - 加载等待上限取配置 engine_ready_s 与 30 分钟中较长者（DeepSeek 配置为 3600 秒），不再在大模型加载到一半时判超时。
    - AMD HIP 引擎每个批处理窗口 16 槽，并发上限与提示随之改为 16；CUDA、SYCL、Metal 仍为 8。
    - tool_call_recovery 只接受 true / false，与 Strata 一致，保存时即报错，不再等到启动失败。
    - Intel Arc（SYCL）运行时优先读 engine-sycl/BUILD.json 的引擎版本；BUILD.json 里不是版本号的值不再显示或参与比较。
    - 没有官方引擎包的平台不再误按 Windows x86_64 选包，改为提示此平台没有可安装的官方引擎包。
    - 没有合适 DeepSeek 引擎包时，提示写明 NVIDIA 需 Ampere sm_86 或更新的显卡。
  - 「应用更新」里也能选下载来源：此前 Manager 自身更新跟随的下载来源只能在「环境」页引擎区的「下载设置与测试」里改，不好找。现在「公共设置 → 应用更新」多了一个「下载来源」下拉框（官方 GitHub、gh-proxy.org、ghproxy.net、自定义），和引擎下载共用同一份设置，两边改一处即同步。自定义地址须为 HTTPS、包含 {url}、不含账号密码或 # 片段；只用 {version}/{asset} 的模板仅适用于引擎，界面会直接说明。引擎选了本地包时下拉框显示「本地包（仅引擎）」，应用更新照旧自动选来源。覆盖全部 10 种界面语言。
