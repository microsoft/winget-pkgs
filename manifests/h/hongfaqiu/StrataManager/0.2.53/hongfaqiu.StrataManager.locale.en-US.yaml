ReleaseNotes: '- Fix updating to upstream Strata v0.2.16 and later (#243): starting with v0.2.16, upstream splits its source into terminal/ (setup.py, serve/, requirements.txt, and so on) and engine/ (CMakeLists.txt, src/, and so on). Manager expected those files at the source root, so updating to v0.2.16 or later from the Versions page failed with the error "官方 ZIP 缺少必要程序文件，未修改当前安装" (official ZIP is missing required program files; current installation unchanged), and 0.2.16+ git clones or manually added folders were not recognized as runtimes. Manager now understands the new layout: the official source ZIP is installed from terminal/ and engine/ into the same directory structure as older versions, and a 0.2.16+ checkout runs from its terminal/ folder, matching the upstream launch scripts. The ≤0.2.15 layout is unchanged; a split-layout archive missing required files is still rejected without touching the current installation. The Mac engine pin remains 0.1.47.'
