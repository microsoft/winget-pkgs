ReleaseNotes: '- 修复更新到上游 Strata v0.2.16+ 失败（#243）：上游 v0.2.16 起把源码拆成 terminal/（setup.py、serve/、requirements.txt 等）和 engine/（CMakeLists.txt、src/ 等）两个目录。Manager 原先要求这些文件直接位于源码根目录，因此在「版本控制」页更新到 v0.2.16 及以后时报「官方 ZIP 缺少必要程序文件，未修改当前安装」，0.2.16+ 的 git 克隆或手动添加的目录也不会被识别为运行环境。现在会识别新目录结构：官方源码 ZIP 按 terminal/、engine/ 内容安装到与旧版本相同的目录结构；0.2.16+ 的检出目录使用其中的 terminal/ 作为运行目录，与上游启动脚本一致。≤0.2.15 的旧结构不受影响；新结构缺少必要文件时仍拒绝安装且不修改当前安装。Mac 引擎仍固定 0.1.47。'
