ReleaseNotes: '- 任务栏监控稳定性与整机 CPU 占用（#239）：UI Automation 检查超过 3 秒或首次遇到自动隐藏任务栏时，不再整进程退出。偏好仍开启时按 2/4/8/15/30 秒退避最多自动重挂 8 次，然后暂停并给出可见提示；设置中提供「重新挂载」。设置关闭、右键关闭、快捷键隐藏、切到桌面浮条或退出应用不会自动重启。意外关闭任务栏窗口不再把偏好写成关闭。设置开关跟随已保存偏好，失败后仍显示「已开启」。任务栏可选手动加入整机 CPU 占用（约 1 秒采样，不依赖官方服务、模型或 GPU）；第一帧无有效差分显示为未知，之后的 0% 为真实空闲；服务停止时桌面浮条也继续显示该 CPU。已保存的显示项和默认宽度不会被强行加入 CPU。Mac 引擎仍固定 0.1.47。'
