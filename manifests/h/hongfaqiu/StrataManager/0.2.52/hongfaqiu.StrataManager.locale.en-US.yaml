ReleaseNotes: '- More stable taskbar monitor and optional whole-machine CPU (#239): a UI Automation inspect that stalls for more than three seconds, or a first attach to a hidden auto-hide taskbar, no longer exits the host process. While the preference stays on, the monitor remounts with 2/4/8/15/30-second backoff up to eight times, then pauses with a visible notice and a Remount control in Settings. Turning it off in Settings, closing it from the menu, hiding it with the shortcut, switching to the desktop strip, or quitting the app does not remount. An unexpected close of the taskbar window no longer saves the preference as off. The Settings switch follows the saved preference and stays Enabled after a failure. The taskbar can optionally show whole-machine CPU (sampled about once a second, independent of the official service, a loaded model, or a GPU). The first frame without a valid interval is unknown; a later 0% is shown as 0. The desktop strip keeps the same CPU source when the service is stopped. Existing saved item lists and the default width are not changed to include CPU. The Mac engine pin remains 0.1.47.'
