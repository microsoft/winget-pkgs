ReleaseNotes: '- Upstream 0.2.13 adaptations (W4A / W8A / W1B): the --spec hint now states that DFlash2 defaults to 6 on most GPUs and to 8 on Strix Halo and RTX PRO (Blackwell) with 48 GB or more VRAM, and that the engine may clamp the window; on pure-Intel hosts with GPU type Automatic, setup passes --backend sycl and maps upstream "no NVIDIA GPU found" to a bilingual tip (Intel can still be chosen by hand); run configs that name a future component:strata-q4-* shape engine get a friendly explanation pointing at the upstream Strata app or official terminal tools, without resolving, installing, or claiming support or that upstream has shipped it.'
