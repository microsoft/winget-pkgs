ReleaseNotes: '- Fix the engine version showing as unknown for Strata desktop runtimes (#241, from PR #248): the Strata desktop app (0.2.x) installs a Control runtime folder that contains no engine; the engine lives in %LOCALAPPDATA%\Strata\components\engine\<version>-<platform>-<backend>\. Manager only looked for engine*/BUILD.json inside the runtime folder and treated the engine version as unknown when none was found, so NVFP4 models were blocked with "This model needs engine 0.1.44 or newer" even with engine 0.1.60 installed, and image support showed as unavailable. When the runtime folder has no engine, Manager now reads the version from the component engine folder using the upstream rules (the engine Manager installed beside it first, then the rollback pin, otherwise the newest package for this platform), and finds the image reader in the same place. An engine inside the runtime folder still takes precedence; without a component engine the version stays unknown. The Mac engine pin remains 0.1.47.'
