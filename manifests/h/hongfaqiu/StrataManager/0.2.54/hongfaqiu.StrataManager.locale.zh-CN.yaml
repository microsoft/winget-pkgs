PackageIdentifier: hongfaqiu.StrataManager
PackageVersion: 0.2.54
PackageLocale: zh-CN
ShortDescription: 面向 Strata 本地推理的桌面工作台。
Description: Strata Manager 是一款面向 Niko1221/Strata 本地大模型推理引擎的开源桌面管理工具，将运行环境准备、模型配置、服务控制、聊天、监控、调优与基准测试整合到同一工作台，降低使用门槛。已下载的模型权重不会被改动。
Tags:
- 人工智能
- 大模型
- 大语言模型
- 本地大模型
ReleaseNotes: '- 修复 Strata 桌面版运行环境的引擎版本显示为未知（#241，来自 PR #248）：Strata 桌面版（0.2.x）的 Control 运行目录里不含引擎，引擎装在 %LOCALAPPDATA%\Strata\components\engine\<版本>-<平台>-<后端>\ 下。Manager 原先只在运行目录里查找 engine*/BUILD.json，找不到就把引擎版本当成未知，因此即使本机引擎已是 0.1.60，NVFP4 模型也会被「此模型需要引擎 0.1.44 或更新」拦住，图像支持也显示不可用。现在运行目录里找不到引擎时，会按上游规则从组件引擎目录取版本（优先使用 Manager 装在旁边的引擎，其次是回滚固定的版本，否则取本平台最新的包），读图组件也从同一位置识别。运行目录里自带的引擎仍然优先；没有组件引擎时版本仍显示未知。Mac 引擎仍固定 0.1.47。'
