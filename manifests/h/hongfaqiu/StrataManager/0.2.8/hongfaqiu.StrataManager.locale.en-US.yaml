ReleaseNotes: "- Supports Strata 0.2.0: upstream 0.2.0 no longer publishes strata-windows-x64*.zip; it ships a signed feed (strata-feed.json) and per-GPU strata-engine-<version>-windows-x86_64-<type>.tar.gz engine packages. Manager now accepts pre-release versions such as v0.2.0-beta, verifies the feed's Ed25519 signature, channel, expiry and sequence (an older feed cannot be replayed), and offers only Windows packages whose size and SHA256 agree between the feed and the GitHub release assets: CUDA 13, CUDA 12, AMD HIP RX 9000 / R9700 and AMD HIP RX 7000 / Strix Halo. After download it checks the package SHA256, extracts the tar.gz safely (regular files only; links, path traversal and case collisions are refused) and then checks every file and its SHA256 against the signed engine-component.json manifest inside the package; one extra or missing file stops the install. The same-version source now keeps strata_control, which the 0.2.0 server needs; an update whose Python requirements only shrink (0.2.0 dropped cmake / ninja) is applied in place. 0.2.0 CUDA packages bundle cuBLAS, so new installs no longer download the CUDA runtime wheels. An older multi-GPU HIP engine asks you to choose the matching AMD package. Local files can be .tar.gz or legacy .zip; installing and updating from earlier ZIP releases is unchanged. A full install on real NVIDIA / AMD hardware has not been validated yet."
