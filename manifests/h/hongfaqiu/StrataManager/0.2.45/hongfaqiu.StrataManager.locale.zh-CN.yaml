PackageIdentifier: hongfaqiu.StrataManager
PackageVersion: 0.2.45
PackageLocale: zh-CN
ShortDescription: 面向 Strata 本地推理的桌面工作台。
Description: Strata Manager 是一款面向 Niko1221/Strata 本地大模型推理引擎的开源桌面管理工具，将运行环境准备、模型配置、服务控制、聊天、监控、调优与基准测试整合到同一工作台，降低使用门槛。已下载的模型权重不会被改动。
Tags:
- 人工智能
- 大模型
- 大语言模型
- 本地大模型
ReleaseNotes: |-
  - 解包官方 tar.gz 时读取全部 gzip 成员：上游 feed 在多线程打包时可能生成拼接的多成员 gzip（尚未默认）。原先只用 GzDecoder，只会读到第一个成员，后续文件会解包失败。现已改为 MultiGzDecoder，单成员包行为不变。
  - 引擎包没有 strata-vision 时不提供图像输入：如官方 0.1.59 SYCL 包（上游 #5716）不含读图组件。安装、模型准备和图像设置中不再默认开启或允许打开「图像输入」，并简短说明当前包只能处理文字。不拒收此类引擎包；带视觉二进制的包不受影响。
