ReleaseNotes: "- Download the official same-revision source archive with an idle timeout and source fallback (#237): first-time Windows runtime installation, and official-release installs or updates, previously fetched the same-commit source ZIP from GitHub only, with a 5-minute whole-request timeout. Slow or interrupted transfers failed, discarded the partial file, and ignored the saved download-source setting. Downloads now use a 60-second idle timeout instead of a total-duration cap, keep partial files, and retry; on failure they switch among gh-proxy.org, ghproxy.net, and official GitHub using the saved or automatic route. If a host ignores Range and returns HTTP 200, the file is downloaded from the start. The archive is still accepted only after the top-level directory matches this release. First installs also honor the Environment page's saved download source. The Mac engine pin remains 0.1.47."
