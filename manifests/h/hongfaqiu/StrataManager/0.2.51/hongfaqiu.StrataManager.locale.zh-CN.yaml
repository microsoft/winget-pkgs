ReleaseNotes: '- 官方同版本源码下载改为空闲超时并可换源（#237）：Windows 首次环境安装，以及走官方 Release 安装或更新时的同提交源码 ZIP，原先只直连 GitHub，整次请求 5 分钟超时，慢速或中途断流会失败且已下载部分不会保留；环境页的「下载来源」也不作用于这一步。现在按连续 60 秒无数据超时（不再按总时长掐断），保留部分文件并最多重试；失败后按已保存或自动测速的来源切换 gh-proxy.org、ghproxy.net 和官方 GitHub。服务端不支持断点续传而返回 200 时从头下载；下完后仍用 ZIP 顶层目录核验。首次安装会读取环境页已保存的下载来源。Mac 引擎仍固定 0.1.47。'
