ReleaseNotes: '- 当前运行环境已是最新时不再弹「确认更新 Strata」：电脑上同时有新旧两个运行环境（例如 Manager 安装的 v0.2.10 和旧的 D:\AI\Strata v0.2.2）时，自动检查会找到任意一个旧版本来提示更新，弹窗里的「本机」显示的是旧目录，而 Strata 页上选中的运行环境已显示「已是最新版本」。现在自动提示和 Strata 页都只看「运行环境」里选中的那一个：它已是最新就不再提示；切换到别的运行环境后，按新选中的那个判断。默认选中哪个也统一了：先用上次在 Strata 页手动选的（会保存，重启 Manager 后仍有效；目录已不存在就忽略），其次是「当前使用」的，再次是本机可用的里版本最新的，最后才是第一个可用的。因此重启后不会再因为列表里排在前面的旧目录弹出更新。'
