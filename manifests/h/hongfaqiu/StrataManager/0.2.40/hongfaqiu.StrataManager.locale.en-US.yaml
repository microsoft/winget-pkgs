ReleaseNotes: "- No more \"Confirm Strata update\" when the selected runtime is already current: with an older and a newer runtime on the same computer (for example Manager's v0.2.10 and an old D:\\AI\\Strata at v0.2.2), the automatic check picked whichever folder was older, so the dialog showed the old folder as Installed while the Strata page said the selected runtime was up to date. The automatic prompt and the Strata page now both follow the runtime selected under Runtime: once it is current nothing is offered, and choosing another runtime makes the check follow that one. The default choice is now the same everywhere: the runtime you last picked on the Strata page (saved, so it survives a restart; ignored if the folder is gone), then the one marked In use, then the newest ready runtime, then the first ready one. An old folder listed first no longer brings the prompt back after a restart."
