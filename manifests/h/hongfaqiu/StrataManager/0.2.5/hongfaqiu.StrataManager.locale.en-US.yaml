ReleaseNotes: '- Local packages after skipping the guide (#74): the Strata page now offers "Use downloaded packages". Without a runtime you can install from an already-downloaded Strata source ZIP and (on Windows) engine ZIP with the same validation and installation as the guide; this also works when the runtime needs repair. With a runtime installed, "Install from local package" updates or reinstalls the engine from an official engine ZIP, verified against the official SHA256 first.'
