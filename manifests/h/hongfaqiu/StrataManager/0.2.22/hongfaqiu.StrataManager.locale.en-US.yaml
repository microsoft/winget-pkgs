ReleaseNotes: "- Fixed \"Update to the new version\" and \"Switch to this version\" failing with \"the candidate has unfinished observer request records and cannot be maintained automatically\"; users no longer need to delete files or retry by hand: when the engine is killed (End task, power loss, crash), the usage journal keeps \"in-flight request\" rows that nothing clears once the service is stopped, so every update and switch was refused. Once the service is confirmed stopped, leftover rows older than 2 minutes are now cleared automatically (only that service's rows; usage statistics and history are untouched) and the task log says how many were cleared. If the leftovers are still younger than 2 minutes, the update or switch now waits for them to expire on its own (up to about 2.5 minutes; the task status says it is waiting automatically and nothing needs to be done, it can be cancelled at any time, and it does not block other operations). If the service is started during the wait the task aborts safely; only if new rows keep appearing after the full wait does it fail, with a plain-language message asking to close other programs that use Strata."
ReleaseNotesUrl: https://github.com/hongfaqiu/strata-manager/releases/tag/v0.2.22
