ReleaseNotes: '- 修复「更新到新版本」「切换到此版本」报「候选存在尚未结束的观察器请求记录，不能自动维护」，用户不用再手动删文件或重试：引擎被强制结束（任务管理器结束进程、断电、崩溃）时，使用情况记录里会遗留「进行中的请求」，服务停止后没有人清理，于是每次更新和切换都被拒绝。现在确认服务已停止后，会自动清理超过 2 分钟的残留记录（只清理该服务的记录，不动使用统计与历史），任务日志里写明清理了多少条；如果残留记录还不到 2 分钟，更新或切换会自动等待它过期（最多约 2.5 分钟，期间任务状态显示「正在自动等待，无需操作」，可随时取消），不占用其它操作。等待期间服务被重新启动会安全中止；等满仍有新记录才会失败，并用大白话提示关闭其它正在使用 Strata 的程序。'
