PackageIdentifier: hongfaqiu.StrataManager
PackageVersion: 0.2.39
PackageLocale: zh-CN
ShortDescription: 面向 Strata 本地推理的桌面工作台。
Description: Strata Manager 是一款面向 Niko1221/Strata 本地大模型推理引擎的开源桌面管理工具，将运行环境准备、模型配置、服务控制、聊天、监控、调优与基准测试整合到同一工作台，降低使用门槛。已下载的模型权重不会被改动。
Tags:
- 人工智能
- 大模型
- 大语言模型
- 本地大模型
ReleaseNotes: |-
  - 自动识别官方 0.2 桌面应用和 Terminal 已下载的模型：以前只扫描含 setup.py 的解压目录，用官方应用下载的模型显示「尚未发现本机模型」，有人删掉重下。现在每次扫描都会读取 %LOCALAPPDATA%\Strata\install 里的运行配置（顺着 cwd 找到 Control 目录）、%LOCALAPPDATA%\Programs\Strata\control、%ProgramFiles%\Strata\control、components\control\*、terminal\current，以及 app-settings.json 和 Terminal settings.json 记录的目录，不用再手动添加。「导入配置」改为先在所选 strata-*.json 所在文件夹里查找，不再只查当前运行环境，所以能导入官方应用的配置了。「尚未发现本机模型」和删除模型的确认框都会提示：已下载的模型不用删，在「下载模型 → 使用已有模型」选择模型所在文件夹（官方应用默认在 文档\Strata\Models）就能用。
  - 「发现 N 个已下载模型 · 一键加入」：自动扫描官方应用、Terminal 和 Manager 的模型文件夹（默认 文档\Strata\Models、~/.strata/models、设置里的数据目录），把还没配置的 GGUF 列成卡片，点一下就进入「使用已有模型」并填好文件夹，不用重新下载。下载页把「在线下载」和「使用已有模型」并排成两张卡片，不再藏在折叠区；目录里本机已有的量化版本标「本机已有」，按钮变成「直接使用」。「我的模型」为空时也会显示这张卡片。
