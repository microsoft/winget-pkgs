ShortDescription: Deine Ordner als Menü im Infobereich, mit Strg+Win geöffnet und beim Tippen durchsucht.
Description: |-
  SystemTrayMenu macht aus einem Ordner ein Menü, das in Millisekunden da ist. Ein Druck auf Strg+Win oder ein Klick auf das Symbol im Infobereich genügt: Unterordner klappen als eigene Spalten auf, und mit Enter oder einem Klick öffnest du jede Datei, jedes Programm und jeden Link.
  Jede Menüebene filtert beim Tippen, * dient als Platzhalter. Ordner stehen oben mit natürlicher Sortierung, Einträge lassen sich an ihren Platz ziehen, Links aus dem Browser bekommen einen sauberen Namen und ihr Website-Symbol, Verknüpfungen auf Ordner öffnen sich als Untermenü. Reihenfolge und Website-Symbole liegen im Menüordner und wandern so mit OneDrive oder Dropbox mit.
  Neu geschrieben in Rust: rund 20 MB Arbeitsspeicher, ohne Konto, ohne Werbung, ohne Statistiken über deine Nutzung. Das winget-Paket läuft ohne Installationsprogramm und ohne Administratorrechte und hält sich selbst aktuell (abschaltbar).
