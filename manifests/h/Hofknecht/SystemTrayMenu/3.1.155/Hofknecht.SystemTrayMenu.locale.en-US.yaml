ShortDescription: Your folders as a menu in the notification area, opened with Ctrl+Win and searchable by typing.
Description: |-
  SystemTrayMenu turns a folder into a menu that is there in milliseconds. Press Ctrl+Win or click the icon in the notification area: subfolders open as their own columns, and Enter or a click opens any file, program or link.
  Every menu level filters as you type, * works as a wildcard. Folders come first with natural sorting, entries can be dragged into place, links dragged in from the browser get a clean name and their website icon, and shortcuts to folders open as submenus. Order and website icons live in the menu folder, so they travel along with OneDrive or Dropbox.
  Rewritten in Rust: about 20 MB of memory, no account, no ads, no usage statistics. The winget package runs without an installer and without administrator rights and keeps itself up to date (can be switched off).
