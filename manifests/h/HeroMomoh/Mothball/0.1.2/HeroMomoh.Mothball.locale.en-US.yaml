ShortDescription: Put idle projects away, get your disk back.
Description: |-
  Mothball finds build output you can regenerate (node_modules, target, .venv, build and more across 22 stacks)
  in projects you have not touched in a while, and moves it to the Recycle Bin. It never touches files git tracks,
  skips projects with uncommitted work, and can restore any project with its stack's usual install command.
