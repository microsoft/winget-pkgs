ShortDescription: Capture a region of your screen, page by page, into images or a PDF.
Description: flip sends the page-turn key to a window you choose, captures a screen region after each redraw settles, and repeats - then hands you a folder of images or an assembled PDF. Windows, Go + Wails, no cgo.
