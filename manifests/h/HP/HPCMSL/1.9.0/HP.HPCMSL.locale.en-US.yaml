ShortDescription: A collection of powershell functions for managing HP BIOS, and streamlining the download and organization of Softpaq downloads.
ReleaseNotes: |-
  - [NEW] Adds HP.WorkforceExperience module with new command Set-HPWxpAgentVersionUpdates.
  - [NEW] Adds Get-HPPlatformCertificates command.
  - [NEW] Adds Get-HPDockFirmwareUpdate command.
  - [NEW] Adds Set-HPDock command.
  - [NEW] Adds Set-HPDockAdminPassword command.
  - [NEW] Adds new properties to Get-HPDock.
  - [NEW] Adds optional File parameter to Update-HPDockFirmware for offline and WAN protection scenarios. File parameter overrides AutoInstallWmiProvider parameter.
  - [NEW] Adds temporary Group Policy BitLocker suspension scripts to Get-HPSoftpaq if installing BIOS firmware update SoftPaqs.
  - [NEW] Adds LogPath value to Setting parameter of Get-HPRepositoryConfiguration and new LogValue parameter to Set-HPRepositoryConfiguration to allow for custom log location for the SoftPaq Repository module.
  - [NEW] Adds ARM support to the Displays module.
  - [UPDATED] Updates supported features check for Get-HPDisplay and Set-HPDisplay.
  - [UPDATED] Updates Update-HPDockFirmware data source.
  - [UPDATED] Updates Install-HPDockWmiProvider data source.
  - [UPDATED] Removes FTP fallback for Invoke-HPRepositorySync, Get-HPSoftpaqList, Get-HPImageAssistantUpdateInfo, Install-HPImageAssistant, and New-HPDriverPack.
  - [UPDATED] Adds WU and OptionalWU fields to Get-HPSoftpaqList to reflect Windows Updates correlated to each SoftPaq.
  - [UPDATED] Adds "sp" prefix to id field in Get-HPSoftpaqList when using default data source to align with HPIA reference files data source.
  - [FIX] Fixes Invoke-HPRepositorySync download of platformList.cab from https://hpia.hpcloud.hp.com/ref bug.
  - [FIX] Fixes Install-HPDockWMIProvider installing even if already installed without Force parameter.
