ShortDescription: 한/영 키 없이 치는 한영 자동 전환
Description: |-
  캐치타입(Catchtype)은 영어 상태로 친 한글(dkssud -> 안녕)도, 한글 상태로 친 영어도 치는 동안 바로 고쳐요. 한/영 상태도 알아서 바뀌어요. deploy했는데, for문처럼 영어 뒤에 붙은 한글은 그 부분만 바꾸고, v2나 build.sh 같은 코드는 영어 그대로 둬요. 잘못 바뀌면 바로 한/영 키를 눌러 되돌려요.
  판단은 모두 내 컴퓨터에서 해요. 키 입력을 서버로 보내지 않고, 계정도 필요 없어요. 새 판은 하루 한 번 확인하고(끌 수 있어요), 누를 때만 앱 안에서 바꿔요.
  Windows 10, 11(x64). 관리자 권한 없이 내 사용자 폴더에 깔려요. 아직 코드 서명 전이고, 키를 가로채는 앱이라 백신이 막을 수도 있어요. 관리자 권한으로 띄운 창에서는 동작하지 않아요.
