ReleaseNotes: |-
  - 한글 상태로 쓰다가 Catchtype을 끈 앱에 다녀오거나 창을 바꾸면 한글 상태가 영어로 바뀌어, ㅇㅅㅇ 같은 자모 이모티콘이 dtd로 남던 일을 고쳤어요.
  - 원격 데스크톱처럼 프로그램이 보낸 키를 받지 않는 창에서 Shift나 Ctrl이 눌린 채로 남던 일을 고쳤어요.
  - 빠르게 칠 때 드물게, 고친 글이 바로 앞 글자 하나를 지우던 일(API를 → APㄹ를)을 고쳤어요.
  - winget처럼 설치 파일을 조용히 돌려 올리면 Catchtype이 꺼진 채로 남던 일을 고쳤어요. 이제 끝난 뒤 다시 켜져요.
  - 영어 이름에 한국어 낱말을 붙여 쳐도 이름을 지켜요(figma시안이 랴흠시안, slack봇이 님차봇이 되던 일).
  - 한국어 낱말에 영어 약어나 낱말을 붙여 쳐도 나눠 읽어요(실GPU가 tlfGPU, 첫commit부터가 cjtcommit부터로 남던 일).
  - 영어 낱말 바로 뒤에 붙인 중·좀·각·끝과 했어ㅠㅠ를 한글로 둬요(deploy중 기다려가 deploywnd 기다려, push했어ㅠㅠ가 pushgoTdjbb로 남던 일).
  - 영어 이름·약어 뒤에 띄어 쓴 조사를 한글로 둬요(claude 는이 claude sms, slack 도가 slack eh가 되던 일). 한/영 키로 영어를 고른 뒤 띄어 친 도·는도 뒤에 한국어가 이어지면 한글로 둬요.
  - 영어 상태로 친 흔한 외래어(챌린지, 스낵, 숏컷)를 바르게 바꿔요. 한글 상태로 친 airbnb·tossbank는 영어로, ㅠ_ㅠ·ㅎ_ㅎ는 그대로 둬요.
  - 앱 아이콘을 새 Catchtype 로고로 바꿨어요(알림 영역의 가/A는 그대로예요). 피드백 보내기 창도 앱의 화면 언어를 따라요.
ReleaseNotesUrl: https://catchtype.com/changelog
InstallationNotes: |-
  'Windows의 PC 보호' 창이 뜨면 추가 정보 → 실행을 눌러요. 설치 파일이 아직 코드 서명 전이라 그래요. 시작 메뉴에서 Catchtype을 켜요. 알림 영역(시계 옆)에 칠한 네모 속 가나 A가 보이면 동작하는 중이에요. 브라우저 입력칸에서 영어 상태(A)로 dkssud를 쳐서 안녕으로 바뀌면 끝이에요.
