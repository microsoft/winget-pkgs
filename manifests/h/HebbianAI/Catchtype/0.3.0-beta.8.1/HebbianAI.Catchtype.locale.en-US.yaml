ShortDescription: Automatic Korean-English input switching without the Korean/English (한/영) key.
Description: |-
  For anyone who types both Korean and English. Catchtype fixes Korean typed in English mode (dkssud -> 안녕) and English typed in Korean mode while you type, and switches the input state for you. Korean endings after English words, like deploy했는데 and for문, are found and converted on their own, and code like v2 or build.sh stays as typed. Press 한/영 right after a change to undo it.
  Decisions are made on your computer. Keystrokes are never sent to a server, and there is no account. The app checks catchtype.com for a new version once a day (you can turn this off) and updates itself only when you click.
  Windows 10 and 11 (x64). Installs for the current user without administrator rights. It is not code-signed yet, and because it reads keystrokes, antivirus software may block it. It does not work in windows opened as administrator.
