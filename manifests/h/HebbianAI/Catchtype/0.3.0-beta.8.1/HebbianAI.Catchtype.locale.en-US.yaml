ReleaseNotes: |-
  - Coming back from an app where Catchtype is off, or switching windows, no longer turns the Korean state into English, so jamo emoticons such as ㅇㅅㅇ no longer come out as dtd.
  - In windows that ignore keys sent by other programs, such as Remote Desktop, Shift or Ctrl no longer stays held down.
  - Fixed a rare case where, when typing fast, a correction removed the letter just before it (API를 came out as APㄹ를).
  - After a silent upgrade with the installer, such as through winget, Catchtype now starts again instead of staying closed.
  - English names with a Korean word glued on now keep the name (figma시안 became 랴흠시안, and slack봇 became 님차봇).
  - A Korean word with an English abbreviation or word glued on is now split correctly (실GPU stayed tlfGPU, and 첫commit부터 became cjtcommit부터).
  - 중, 좀, 각, 끝 and 했어ㅠㅠ glued right after an English word now stay Korean (deploy중 기다려 stayed deploywnd 기다려, and push했어ㅠㅠ stayed pushgoTdjbb).
  - Particles typed with a space after English names and abbreviations now stay Korean (claude 는 became claude sms, and slack 도 became slack eh). After choosing English with the 한/영 key, a spaced 도 or 는 also turns Korean when Korean follows.
  - Common loanwords typed in the English state (챌린지, 스낵, 숏컷) now come out right. In the Korean state, airbnb and tossbank stay English, and ㅠ_ㅠ and ㅎ_ㅎ stay as typed.
  - The app icon now uses the new Catchtype logo (the 가/A in the notification area stays the same). The feedback window now follows the app's language.
ReleaseNotesUrl: https://catchtype.com/en/changelog
InstallationNotes: |-
  If Windows shows "Windows protected your PC", select More info, then Run anyway: the installer is not code-signed yet. Start Catchtype from the Start menu. A filled square with 가 or A appears in the notification area next to the clock. Then type dkssud with English selected (A) in a browser text field: if it turns into 안녕, it works.
