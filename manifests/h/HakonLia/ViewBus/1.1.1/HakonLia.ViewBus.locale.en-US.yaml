ShortDescription: The fastest way to debug Azure Service Bus. A native desktop app with a built-in MCP server.
Description: |-
  viewbus is a fast, native desktop app for exploring and managing Azure Service Bus.
  Sign in with Azure once and it indexes every namespace, queue, topic, and subscription you can see, locally.
  Peek active and dead-letter messages, search message bodies across every queue at once, edit and resend dead-lettered messages, run bulk operations, and get alerts when a dead-letter backlog builds.
  A built-in Model Context Protocol (MCP) server lets AI assistants like Claude, Cursor, and Codex read your Service Bus over local stdio.
  Free, no account, no telemetry.
