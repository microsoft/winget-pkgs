ShortDescription: Lightweight open-source replacement for HONOR PC Manager on the HONOR MagicBook Art 14.
Description: |-
  An unofficial tray app for the HONOR MagicBook Art 14 (2024, Intel Core Ultra): charge limit, keyboard backlight with
  auto brightness, Fn lock, touchpad vibration and gestures, refresh rate, calibrated sRGB / Display P3 / Adobe RGB color
  modes, keep awake, and BIOS and driver updates from HONOR's catalog. One native exe, no services, no telemetry.
  It runs with administrator rights (it talks to the BIOS) and starts at sign-in through a scheduled task.
  Not made or endorsed by HONOR.
