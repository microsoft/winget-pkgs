ShortDescription: A fast, native, bash-compatible shell for Windows (drop-in replacement for Git Bash)
Description: |-
  gash is a from-scratch bash-compatible shell for Windows, written in Rust. It runs the same
  scripts as Git Bash, with the same /c/Users/... paths and the same MSYS tools (ls, grep, sed,
  awk, ... from Git for Windows), but without Cygwin's fork() emulation, which is what makes
  Git Bash slow: command substitutions, subshells and pipelines run in-process, and startup
  takes about 10 ms.
  It needs Git for Windows for the external tools. If Microsoft's Coreutils for Windows is
  installed (winget install Microsoft.Coreutils), gash uses its native tools instead.
