ReleaseNotes: |-
  更新内容
  💡 新增功能
  - 支持粘贴网页内容时自动保存图片，离线图片仍可显示
  - 支持设置新增图片压缩质量及最大尺寸，节省存储空间
  - 文件链接支持相对路径及中文路径，便于引用外部文件
  🔧 问题修复
  - 修复分享图在英文较长时字幕溢出画面的问题
  - 修复部分情况下图片预览可能异常不显示的问题
  - 修复搜索关键字位于代码块内时高亮可能失效的问题
  - 修复登录界面「关于」弹窗在全局菜单栏下报错的问题
  - 修复阅读模式下全选范围过大、复制内容勾选状态丢失的问题
  - 修复在代码块内输入或粘贴表情时代码块损坏显示错位的问题
  - 修复深色模式下工具栏按钮提示及溢出菜单样式异常的问题
  ⚙ 改进优化
  - 应用自动锁定时长新增更多时间档位，可按需选择
  - 导入第三方 MiniDiary 数据时增加格式校验，避免错误数据被导入
  - 优化粘贴图片时以占位图即时插入并后台转存，大图处理更顺畅
