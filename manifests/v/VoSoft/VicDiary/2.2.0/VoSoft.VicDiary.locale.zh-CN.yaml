  更新内容
  💡 新增功能
  - 新增文档「查找替换」功能，可在日记中快速查找与替换文本
  - 工具栏按钮超长溢出，宽度不足时工具栏自动收起多余按钮
  🔧 问题修复
  - 修复全局搜索关键词偶发不高亮的问题
  - 修复切换编辑器模式时误更新文档修改时间的问题
  - 修复登录界面右上角按钮点击无响应的问题
  - 修复空文档上传图片过程中模板选择模块异常显示的问题
  - 修复插入图片时偶发报错的问题
  - 修复表格复制行列时内容不正确的问题
  ⚙ 改进优化
  - 「关于」页面统一改为非原生弹框，界面风格更一致
  - 全局搜索结果支持展示关键词所在的前后文内容，定位更直观
  - 点击全局搜索结果后自动跳转并滚动至高亮位置
