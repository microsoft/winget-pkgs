ShortDescription: SSH terminals, files, a host monitor and Kubernetes in one app.
Description: |-
  Wayfinder keeps every server an IT team looks after in one window: SSH terminals with tabs, splits and broadcast, files over SFTP, tunnels, remote desktops (RDP and VNC), Kubernetes clusters, S3, FTP and SMB storage, and a live monitor of each host.
  An assistant looks into a host beside you with read-only commands, and a debug session writes up what was wrong and the exact commands that fixed it.
  It imports sessions from MobaXterm, PuTTY, WinSCP and FileZilla. Free to try for 7 days.
