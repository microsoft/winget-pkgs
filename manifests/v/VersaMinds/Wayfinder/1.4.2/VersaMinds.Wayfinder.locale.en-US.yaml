ShortDescription: The terminal with AI built in, with SSH, files, remote desktops and Kubernetes in one app.
Description: |-
  Wayfinder keeps every server an IT team looks after in one window: SSH terminals with tabs, splits and broadcast, files over SFTP, tunnels, remote desktops (RDP and VNC), Kubernetes clusters, S3, FTP and SMB storage, and a live monitor of each host.
  An assistant looks into a host beside you with read-only commands, and every change it suggests waits for your Run. Say what you want in any terminal and it puts the command at the prompt.
  It imports sessions from MobaXterm, PuTTY, WinSCP and FileZilla. Free on Windows while in beta, until 31 January 2027.
