Description: |-
  Vovsoft Retail Barcode is a lightweight cashier application that can help users keep track of products sales. If you are looking for a barcode software for your retail store, you can rely on this easy to use tool.

  The tool allows one to define customers, as well as to link product credit sales to individual clients. The utility is valuable for anyone that is in the business of managing small shops. It is an ideal point of sale (POS) management software for small shops that are faced with a wide variety of products that have to be processed. Shops that do not stock items with barcodes can circumvent this issue by simply creating a customized store code (e.g. 1, 2, 3 and so on).

  The software features a highly intuitive interface that is streamlined for an improved user-experience. Navigation is performed exclusively through large and self-explanatory buttons (e.g. Products or Customers). The program features a host of built-in interface layout options, which can suit most needs. In order to record sales, one must first define products. This is performed manually, by inserting the product's barcode, name and price or by importing from CSV files. Once this is performed, the program is ready to record regular sales.

  All users have to do is to select the given item and specify the quantity of items sold. The utility then automatically computes total sales and stocks. Another method of operation is the "Sell by Credit" mode. This allows one to register product displacements that have not yet been paid for. Complementary to this method is the customer register. It allows store owners or cashiers to keep track of clients that purchase by credit. This module is a great method of keeping track of delayed transactions. Once a customer transfers the necessary sum, the balance is cleared. This means that all sales (by credit and by cash) can be processed with the same program. Sales totals for user-defined time intervals can also be generated.

  Different passwords can be defined for administrator and cashier users. While the administrator can access all the menus and settings in the program, the cashier only has limited authority to make sales. For example, the administrator has the ability to delete the sale(s) due to returned goods or incorrect sales.

  Key Features:
  * Supports barcode and QR code scanners
  * Import and export products using Excel
  * "Sell by cash" and "Sell by credit"
  * Add, edit, remove customers for credits
  * Receipt printing
  * Barcode label printing (Code 39)
  * Ability to apply discount at checkout
  * Embedded SQLite database
