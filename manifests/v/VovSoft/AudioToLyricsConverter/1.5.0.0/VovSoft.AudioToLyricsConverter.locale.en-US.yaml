ShortDescription: Vovsoft Audio to Lyrics Converter uses offline Whisper AI models to securely transcribe audio into synchronized lyrics and subtitles (LRC, SRT, VTT).
Description: |-
  Vovsoft Audio to Lyrics Converter is a user-friendly Windows utility designed to automatically generate text transcripts from audio files. Powered by offline AI models, this software "listens" to your tracks and accurately extracts the spoken or sung words, outputting them into perfectly timed lyric or subtitle files.

  Because the AI inference runs locally on your machine, you don't need an active internet connection or expensive cloud API subscriptions. Your audio files remain completely private, and processing is handled directly by your hardware.

  Key Features:
  * Wide Format Support: Works with popular audio formats, including MP3, WAV, OGG, and FLAC.
  * Multiple Output Formats: Export your transcriptions as standard LRC files for music players, SRT or VTT files for video subtitles, or plain TXT files for easy reading.
  * Offline AI Processing: Utilizes OpenAI Whisper models to process audio securely on your PC without an internet connection. Select from different local models (Base, Small, Medium, Large, Turbo) and leverage multi-thread CPU support to perfectly balance fast conversion speeds with high transcription accuracy.
  * Language Auto-Detection & Manual Selection: Let the software automatically detect the spoken language in your audio tracks, or manually choose the specific language from a list to ensure optimal transcription accuracy.
  * Batch Processing: Easily queue up individual tracks or add entire folders to convert multiple audio files in one seamless operation.
  * Synchronized Timestamps: Automatically generates precise timestamp tags (e.g., [00:26.00]) so your lyrics match the exact pacing of the song or audio track.
  * Customizable Line Lengths: Set a maximum character count per line to ensure your subtitles and lyrics display perfectly on any screen size or media player.
  * Drag and Drop Support: Quickly load your audio tracks by simply dragging and dropping files or folders directly into the software interface.
  * Creating LRC files for karaoke songs or digital music libraries.
  * Generating automatic subtitles (SRT/VTT) for YouTube videos, social media platforms, or video editing projects.
  * Transcribing podcasts, interviews, or lectures into plain text.
