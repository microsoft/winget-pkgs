ShortDescription: Heatmaps display information about a specific parameter value using color codes throughout a regular map. World Heatmap Creator creates a world map in HTML format and marks all the locations you choose.
Description: |-
  Heatmaps display information about a specific parameter value using color codes throughout a regular map. Aside from being visually appealing, these statistical instruments are capable of representing large data sets in a simple manner.

  Vovsoft World Heatmap Creator creates a world map in HTML format and marks all the locations you choose. The software displays a drop-down list of all the countries in the world, storing a specific location for each. You can select the desired locations and add them to your list alongside the corresponding latitude and longitude. If you decide to modify the two latter parameters, you will get a custom location on the map. You can load your location list from CSV file and save to CSV file.

  The generated HTML map is saved locally in a user-defined directory so it can be opened using any web browser. You will notice that all the locations you previously selected are marked with a colored circle similar to colors on a heat map. You can use it to generate a map of locations where a certain event has happened (for example, virus attack outbreaks, product sellouts, or other similar events). This software utilizes OpenStreetMap in order to export heatmaps.
