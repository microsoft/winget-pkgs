ShortDescription: Compare Two Lists is a list comparison tool that can perform set operations over lists of words or numbers. Copy and paste your lists into the program, then click the Compare button to get the differences between the two lists.
Description: |-
  Vovsoft Compare Two Lists is a list comparison tool that can perform set operations over text lists. Copy and paste your lists into the program, then click the "Compare" button to get the difference between the two lists. You can compare multiple lists without having to write Excel functions to do the task. Features: Set Intersections (AND), Set Unions (OR) and Set Differences. Options include case-sensitive, case-insensitive, ignore whitespaces.

  Effortlessly compare list items and identify differences with this table comparison app. With just a few clicks, you can compare large datasets:
  * Check for duplicates (Intersection)
  * Find missing items (Only #1 and Only #2)
  * Concatenate lists (Union)

  This program's purpose is to find the differences between two separate tables. The lists can contain words or numbers. The simple user interface is straightforward, as you don't need any advanced skills to operate it.

  Main window is split into two panels that contain "List 1" and "List 2". You can drag and drop or load two text files you want to compare or paste from clipboard or type their contents. Press the "Compare" button and receive a summary of the results.

  Make sure to indicate if you want the comparison to be case-sensitive or not. View the items found in both listings, or explore records from only one. At the bottom of each listing, you have a button that will remove all the duplicates in the list.

  Once you've finished analyzing the results, you can choose the type of result that you want to export. Save your results as a text file and select the encoding of your output file.

  This software is a list comparison tool that allows you to find differences between any two lists. It can handle millions of items. When dealing with huge lists, Excel has difficulties handling millions of cells. With this tool, you can quickly compare lists.

  It's simple and easy to use and lets you remove duplicates within each listing. Once you have analyzed the results, you can save the results as a text file and select the output file's encoding.

  There are a lot of online websites that can compare lists. However they have upload limitations. Vovsoft Compare Two Lists can compare millions of lines through a user-friendly interface. The best part of the program is that the comparison is done completely offline. You are the only controller of your private data. No list is sent to internet in any case.

  Key Features:
  * Supports offline use
  * Supports up to 100 million items per list
  * Supports case sensitive or case insensitive lists
  * Supports sorted lists for super fast comparison
