Description: |-
  If you're looking for a simple and efficient method of turning images into PDF documents, you can try Vovsoft Image to PDF Converter. It's a lightweight, fast and easy-to-use application capable of converting photos to PDFs.

  You can easily convert your images to PDF with this software. Images can be added to the task list by selecting multiple files using the built-in file browser or by dragging and dropping them via Windows Explorer. Just add image files (JPG, TIF, PNG, GIF, BMP) to the list and click the "Create PDF" button, this software will directly convert pictures to PDF documents.

  Image to PDF Converter is a standalone software, Adobe Acrobat Reader is not required. And this software doesn't depend on any printing device so it will not install any printer driver on your computer.

  Key Features:
  * JPEG, TIFF, PNG, GIF, BMP support
  * Resize by percentage
  * Scale (fit, reduce, none)
  * Orientation (auto, portrait, landscape)
  * Drag and drop support
  * Add image watermark
  * Add page margin
  * Create single PDF file or multiple PDF files
  * Unicode filename support
  * Auto open PDF file after creation
