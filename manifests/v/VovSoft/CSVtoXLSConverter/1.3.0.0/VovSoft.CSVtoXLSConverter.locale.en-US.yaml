Description: |-
  A comma-separated values (CSV) file is a delimited text file that uses a comma to separate values. Each line of the file is a data record. Each record consists of one or more fields, separated by commas. Designed with simplicity in mind, Vovsoft CSV to XLS Converter can only perform one task: that of extracting the contents from the input CSV container, then transfer it to a newly created XLS file. In other words, you just have to select the input CSV file and choose to export it to Microsoft Excel format, all with just a few clicks.

  The software supports commas, semicolons, tabs, spaces, or any custom character as CSV separator.

  The best part of the program is that the conversion is done completely offline. You are the only controller of your private data. No CSV information is sent to the internet in any case.

  Key Features:
  * CSV to Excel
  * CSV to XLS
  * CSV to XLSX (Excel 2007 or later)
  * Create AutoFilter
  * Freeze Header Row (First Pane)
  * Trim All Cells
