Description: |-
  A comma-separated values (CSV) file is a delimited text file that uses a comma to separate values. Each line of the file is a data record. Each record consists of one or more fields, separated by commas. CSV files are used by Microsoft Excel and other office products.

  Designed with simplicity in mind, Vovsoft CSV to SQL Converter can only perform one task: that of extracting the contents from the input CSV container, then transfer it to a newly created SQL file. In other words, you just have to select the input CSV file and choose to export it to database format, all with just a few clicks. The software will generate "CREATE TABLE" and "INSERT INTO" statements for you. You can select comma, semicolon, tab, space or any other separator before loading your CSV files.

  You can convert small files as well as large files bigger than 1 gigabyte. All this conversion is done completely offline. You are the only controller of your private data. No CSV or SQL file is sent to the internet in any case.

  * CSV to MySQL
  * CSV to MariaDB
  * CSV to Oracle
  * CSV to IBM Db2
  * CSV to Microsoft SQL Server
  * CSV to Microsoft Access
  * CSV to PostgreSQL
  * CSV to SQLite
