ShortDescription: Easy to use batch delete application. Easily remove several files and folders from your computer with minimum effort. Get rid of many unneeded files on your computer at once.
Description: |-
  Vovsoft Delete Multiple Files enables batch file/folder deletion with a simple graphical user interface (GUI). It permits you to get rid of multiple files or folders from your computer without the need to go through and manually delete them. It presents a simplified window without overly complex settings.

  When you want to get rid of old temporary files on your computer, you typically need to browse the location and manually erase the items. Alternatively, you can try "Delete Multiple Files", an application that does exactly what its title suggests. The overall look and feel of this software utility is minimalist, as its GUI is not cluttered with redundant menus and buttons. Instead, you get a simple window where you can add files or folders you want to remove, along with some additional features meant to simplify the whole process.

  This software tool is meant to allow you to efficiently add the items you want to delete and complete the job with minimal hassle. It supports drag'n'dropping of the selected items for removal. It can be used for individual files, folders, subfolders, or recursive subfolders. You can choose between "Send to Recycle Bin" and "Permanently Delete" options. You can also specify file mask when dealing with directories. It is the perfect addition to your toolset without wasting time when multiple files need to be deleted. It can come in handy when you want to save both time and energy when removing numerous files at the same time.

  Using file masks and wildcards allows flexible file group selection based on name and extension:
  * If you want to delete a file or folder itself, use empty file mask.
  * If you want to delete all files inside the folder (empty folder), use file mask: *
  * If you want to delete jpg files inside the folder, use file mask: *.jpg
