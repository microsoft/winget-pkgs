ShortDescription: Test your memorizing skill with this game that makes you match pairs of cards and remember their position. The game allows you to choose between playing either against another human player or the CPU.
Description: |-
  Test your memorizing skill with this neat game that makes you match pairs of cards and remember their position. Not everyone is a fan of epic swordplay, spell weaving, controlling armies or firing a gun, with some of us preferring to relax and play something more casual. When that time comes, a simple memory game like Vovsoft Match Pairs can keep you entertained for hours on end. While not as flashy as other game titles out there, one cannot deny the benefits of occasionally playing memory games, to keep their brain busy.

  When you start a new game, you will be prompted to enter your Player name, as well as choose your opponent for the match. The game allows you to choose between playing either against another human player or the CPU which can be set to one of the three available difficulty levels, either "Rookie", "Average", or "Expert".
