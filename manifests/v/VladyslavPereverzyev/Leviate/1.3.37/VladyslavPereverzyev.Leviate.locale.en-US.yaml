ShortDescription: Move 3D programs and the mouse with your hand, through the webcam or a phone.
Description: |-
  Leviate turns your hand into a controller. Raise your hand in front of the webcam and work without touching the mouse.
  The 3D module turns, pans and zooms the 3D view of the program under the cursor; the Mouse module moves the cursor, and one finger held still clicks.
  Ctrl+Alt+M turns the hand on and off from any program. A phone can be the camera too.
  The hand is tracked on your computer and the video is never recorded or sent anywhere.
