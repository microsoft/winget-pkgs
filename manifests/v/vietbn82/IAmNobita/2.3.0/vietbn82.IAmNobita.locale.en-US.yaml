ShortDescription: Tray app that keeps your PC active while you're away.
Description: |-
  Lives in the system tray with two modes. Work Mode does nothing. Nobita Mode nudges the mouse 1px and/or taps the invisible F15 key after a configurable idle time, and blocks sleep and screen-off.
  Toggle with a global hotkey (Ctrl+F12 by default), a one-shot timer, weekly schedules with days off, or the command line (iamnobita --nobita / --work / --toggle).
  Keeps a local SQLite history of mode switches. English and Vietnamese UI. Self-updates from GitHub Releases.
