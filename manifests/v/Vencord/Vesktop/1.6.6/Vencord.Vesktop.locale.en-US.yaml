ShortDescription: A cross platform electron-based desktop app aiming to give you a snappier Discord experience with Vencord pre-installed.
ReleaseNotes: |-
  What's Changed
  - Streamer Mode: fixed constantly re-enabling itself if OBS is open & fixed "Automatically enable Streamer Mode" toggle not showing in Discord appearance settings
  - Added a setting to work around Voice Chat not working when using VPNs like Tailscale
  - Fixed various issues related to screenshare with system audio on Linux
  - Upgraded to Electron43 which brings many fixes and improvements
  - Fixed an issue where the auto-start toggle would not accurately reflect its actual state on Windows
  - Added a --repair command line flag to quickly update Vencord to the latest version
  Notable Electron changes
  - On Linux, when using the custom Discord titlebar, Vesktop will now have rounded corners & shadow by default. You can disable this behaviour in Vesktop settings
  - On Linux, Vesktop will now show up as "Vesktop" instead of as "Chromium" in Audio mixers
  For Linux users: It is now recommended to run Vesktop in native Wayland over legacy X11 for the best experience. You may run into graphical glitches when running on X11
  Full Changelog: v1.6.5...v1.6.6
