ShortDescription: A clean, simple settings app for the Cherry Xtrfy MX 8.2 Pro TMR keyboard.
Description: Keystra replaces the official software for the Cherry Xtrfy MX 8.2 Pro TMR. It sets every built-in lighting effect, paints per-key colors, changes the polling rate and switches profiles from the tray. It only sends commands that have been decoded and tested, and never sends firmware updates.
