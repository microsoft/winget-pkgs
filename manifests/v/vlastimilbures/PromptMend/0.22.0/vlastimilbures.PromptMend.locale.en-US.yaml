ShortDescription: Rewrite a rough draft into a precise LLM prompt from an Espanso trigger.
Description: |-
  PromptMend is a command-line tool that Espanso text-expansion triggers call to rewrite a
  rough draft from the clipboard into a precise prompt, with a local model (Ollama, LM
  Studio) or a cloud one (OpenRouter, Anthropic). A data-protection gate blocks a draft that
  looks like it holds a secret before it can leave the machine. Its setup command walks
  through the settings and deploys the Espanso match files, and run without arguments it
  opens a full-screen interface. This build bundles its own Python.
