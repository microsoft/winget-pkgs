PackageName: Virtual Desktops 2.0
License: Proprietary
Copyright: Copyright (c) Vladon
ShortDescription: Virtual desktops for the PowerToys Command Palette — a desktop list and a compact dock band switcher.
Description: |-
  Virtual Desktops 2.0 adds virtual desktop management to the PowerToys Command Palette (CmdPal).

  It provides a top-level list of your virtual desktops (wallpaper thumbnail per item, details pane, "Current" tag) and a compact dock band — an icon-only desktop switcher with configurable icons for the active and inactive desktops.

  Commands: switch to a desktop, move the last non-tool window to a desktop, or move and switch in one step. The list updates live as desktops are created, removed, or activated.

  Everything runs locally — no data collection, no network access.
ReleaseNotesUrl: https://github.com/vladon/CmdPalVirtualDesktops/releases/tag/v2.0.21.0
ReleaseNotes: |-
  - The dock band restores itself across RDP/console session switches (the palette quietly restarts on arrival transitions — see microsoft/PowerToys#50367)
  - RDP sessions no longer break the band: desktop destruction and renames refresh it immediately
  - Switches and moves work reliably even right after session transitions (desktops resolved freshly by Id)
  - The dock band survives idle extension release (COM server lock)
  - Windows 10: custom desktop names are shown via a registry fallback when the COM API returns nothing
PackageUrl: https://github.com/vladon/CmdPalVirtualDesktops
