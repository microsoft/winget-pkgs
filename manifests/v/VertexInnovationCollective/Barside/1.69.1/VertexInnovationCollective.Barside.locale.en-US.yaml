ShortDescription: Your second brain on your desktop: notes, tasks, reading, meetings, recordings and AI in one free app.
Description: |-
  Barside puts a note-taking app, a to-do list, a read-later inbox, a screen recorder, video meetings, a password vault and an AI assistant into one free desktop app. Your library is saved on your computer, and notes work without an account.
  The AI features use the AI account you connect (Claude, ChatGPT, Gemini or OpenRouter), and every change the assistant makes can be reviewed and undone. Barside also works with Claude Desktop, Claude Code, Codex, Cursor, Gemini CLI and VS Code through MCP.
  Barside Plus is an optional subscription for cloud sync, cloud backup and agents that run while your computer is off.
