ShortDescription: Battery levels of your game controllers, mice, keyboards and headsets in the Windows taskbar.
Description: |-
  WattsLeft puts an icon for each wireless device in the Windows taskbar, with a battery bar that turns from green to red and a bolt while charging, and a panel listing them all.
  It reads Xbox controllers (including the correct level over Bluetooth), DualSense and DualShock 4, Bluetooth mice, keyboards and headsets, Logitech devices on their receivers, and many other makers' devices on their own dongles. It only ever reads from devices.
  It warns when a battery runs low, holds pop-ups during fullscreen games, and keeps a battery history with time left and a health estimate.
  After installing, run WattsLeft once (from the Run box or a terminal); turn on Start with Windows in its menu to have it start by itself.
