ReleaseNotes: |-
  - Make unread notification display the proper value when "Conversation grouping" flag is enabled in the Proton settings (#785). Earlier the counter could potentially display a larger value than expected since it always derived the value from the "ungrouped" messages. Currently, the fix is only applied to the case where the local store option is disabled for the account (unread counts are calculated differently when this mode is enabled).
  - Update packaged Proton Web Clients stack. This change is supposed to resolve Proton session/login-related glitches (#786) and recent "Something went wrong" error (#787).
  - Update project dependencies.
  The Apple Silicon/M1 ARM64 package requires xattr -d com.apple.quarantine /Applications/electron-mail.app command execution.
