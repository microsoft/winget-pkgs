Description: Unofficial native Windows ARM64 build of the qBittorrent BitTorrent client for Windows on Arm devices. It is compiled from the upstream qBittorrent source with MSVC on a native Windows ARM64 GitHub Actions runner, and distributed as a single self-contained executable with Qt statically linked, so there are no DLLs and no installer. Settings are stored in %APPDATA%. This is not an official qBittorrent release.
