ReleaseNotes: |-
  v9.2.0933
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - 9.2.0933: u_read_undo() leaks the file name when the undo file owner differs
  - 9.2.0932: NFA engine fallback can double free the compiled program
  - 9.2.0931: the GTK4 GUI is still experimental and untested by CI
  - 9.2.0930: floating point exception when displaying pum
  - runtime(colors): update colorschemes
  - runtime(vim): Update base syntax, contain more ex commands
  - runtime(strace): highlight stack trace as comment
  - 9.2.0929: incorrect completion for 'pumopt' and 'pumborder'
  - runtime(doc): Improve :help expr-number, mention unary +/-
  - 9.2.0928: MinGW: tests hang when Vim is built with coverage enabled
  This release includes signed files
