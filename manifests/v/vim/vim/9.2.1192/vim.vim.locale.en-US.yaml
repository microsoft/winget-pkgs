ReleaseNotes: |-
  v9.2.1192
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - 9.2.1192: Compile warning when FEAT_DIFF is disabled
  - 9.2.1191: crash with "//e" when only a substitute pattern exists
  - 9.2.1190: Vim9: crash when calling object method
  - AGENTS.md does not explain how to write garbage collection tests
  - 9.2.1189: CTRL-W command fails when CursorHold triggers
  - 9.2.1188: prop_type_get() does not return the "override" item
  - 9.2.1187: tuple type with many items reads past the end of an array
  - runtime(gnat): Use shellescape to prevent code injection via filename
  - runtime(compiler): escape paths for cppcheck compiler
