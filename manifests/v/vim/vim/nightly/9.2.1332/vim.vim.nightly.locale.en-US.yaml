ReleaseNotes: |-
  v9.2.1332
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - 9.2.1332: remove() of a range of List items may leak memory
  - 9.2.1331: system() does not handle a range() List as the command
  - 9.2.1330: "+=" on a null List makes it the same List as the other one
  - 9.2.1329: matchaddpos() does not handle a range() List as a position
  - 9.2.1328: join() of a List ignores an out-of-memory error
  - 9.2.1327: flatten() of a typed List can lose an item and leak a reference
  - 9.2.1326: flatten() on a locked list frees the list too early
  - 9.2.1325: Vim9: "+=" in a compiled function can change a locked list
  - 9.2.1324: Vim9: wrong error when adding an item to a locked List by index
  - CI: Update clang to v23
  - 9.2.1323: clang 23 warns for unused-but-set static variables
  - 9.2.1322: image placements wrong after inserting or deleting lines
  - 9.2.1321: Vim9: :pyx heredoc compilation is incorrect
