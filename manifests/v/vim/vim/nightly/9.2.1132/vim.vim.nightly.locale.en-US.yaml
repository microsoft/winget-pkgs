ReleaseNotes: |-
  v9.2.1132
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - runtime(doc): Update modeline help and reference 'modelinestrict'
  - CI: Bump github/codeql-action
  - 9.2.1132: skip condition not considered for certain commands
  - 9.2.1131: matching character ranges is slow with the bt re-engine
  - runtime(iar): Improve support for IAR compiler
  - runtime(doc): Tweak documentation style
  - runtime(doc): mention getcellwidths() in setcellwidths()
  - 9.2.1130: Vim9: assigning a Number to $VAR or @r is not an error
  - runtime(vim): Update base syntax, terminate :g/:s patterns at EOL
  - runtime(termdebug,json): unused variables are left in :def functions
  - runtime(vimcomplete): do not use wildoptions for completion
  - 9.2.1129: out of bounds read in the 'complete' F{func} callbacks
  - 9.2.1128: filetype: icalendar files are not recognized
  - runtime(syntax-tests): Apply "word" rather than "prefix" when filtering filetypes
  - 9.2.1127: filetype: Gentoo portage config files are not recognized
  - runtime(java): Make changes for JDK 27
  - 9.2.1126: virtual text breaks cursor movement when 've' is set
  - runtime(doc): rewrite section 2 of vim9.txt
