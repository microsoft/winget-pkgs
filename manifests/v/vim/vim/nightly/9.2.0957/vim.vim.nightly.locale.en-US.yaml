ReleaseNotes: |-
  v9.2.0957
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - runtime(sh): Selectively suppress matching syntax errors
  - 9.2.0957: filetype: ArgoCD config file is not recognized
  - runtime(vim): Update base syntax, match user-command args
  - runtime(doc): improve documentation for |v_gF|
  - runtime(doc): mark the GTK4 GUI as still experimental
  - runtime(doc): v:windowid is x11 only
  - 9.2.0956: GTK4: crash when the window is resized while redrawing
  - 9.2.0955: tests: terminal tests are flaky
  - 9.2.0954: u_read_undo() can be improved (after 9.2.0935)
  - 9.2.0953: insert completion code can be improved
  - 9.2.0952: locking a container while stringifying can be improved
  - 9.2.0951: GTK3: cursor does no longer blink
  - 9.2.0950: transstr() can be improved (after 9.2.0906)
  - 9.2.0949: GDK_KEY_VoidSymbol might be undefined
  - 9.2.0948: GTK4: mouse move starts Visual selection after a dialog
  - 9.2.0947: GTK4: screen is cleared when moving the mouse after startup
  - 9.2.0946: GTK2/3: mouse move starts Visual selection after a dialog
  - 9.2.0945: sort() with a numeric option can be improved
  - runtime(algol68): Update syntax, fix syncing
  - 9.2.0944: test: tests fail when checking for GTK4 feature
  - CI: Keep the GTK4 job from affecting the other jobs
  - 9.2.0943: test: test_hardcopy fails on GTK4 UI
  - 9.2.0942: test: test_mksession_winpos() fails on GTK4 UI
  - 9.2.0941: tests: clipboard tests fail in the GUI when the terminal has no clipboard
  - 9.2.0940: GTK4: columns are lost when a scrollbar appears
  - 9.2.0939: mbyte: wrong cell count for an overlong UTF-8 sequence
  - 9.2.0938: cursorbind: cursor in the other window is not updated after undo
  - 9.2.0937: sort() with a numeric option converts each item on every comparison
  - 9.2.0936: stringifying a list or dict can free the item being iterated
  - 9.2.0935: reading an undo file is slow with many undo headers
  - 9.2.0934: filetype: hlsl files are not recognized
  - runtime(doc): clarify diff_filler() function
