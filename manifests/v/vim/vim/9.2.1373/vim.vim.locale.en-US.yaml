ReleaseNotes: |-
  v9.2.1373
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - 9.2.1373: Python and Lua can free a variable while ":let" lists variables
  - 9.2.1372: if_python: popitem() can free a Dict item in use
  - runtime(vim): Update base syntax, fix builtins in help examples
  - 9.2.1371: Vim9: wrong type is stored in a typed dict using a variable of type any
  - 9.2.1370: remove() of a variable while listing cause use-after-free
  - 9.2.1369: unlockvar in a string() method allows changing a Dict
  - 9.2.1368: using :unlockvar in a map() callback allows changing the Dict
  - 9.2.1367: joining lines removes comment leader with the 'f' flag
  - 9.2.1366: OSC responses block input during startup timers
  - 9.2.1365: GTK4: startup overrides user-configured window size
  - runtime(filetype): Relocate more detection autocommands
  - runtime(doc): add a security section to remote.txt
  This release includes signed files
