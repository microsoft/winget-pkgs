ReleaseNotes: |-
  v9.2.1061
  Nightly Vim Windows build snapshots (more information).
  If you do not know what to use, use the 32bit installer (use the signed one, if available).
  Signed releases will occasionally be provided on a best effort approach.
  Changes:
  - 9.2.1061: computing the displayed width of a line is slower than necessary
  - 9.2.1060: always equalize windows when 'equalalways' is set
  - 9.2.1059: keys(), values() and items() are slower than necessary
  - 9.2.1058: string_reduce() leaves a stale funccall on error
  - 9.2.1057: backtracking engine stack push is slower than necessary
  - 9.2.1056: terminalprops() does not report a direct color terminal
  - 9.2.1055: Vim9: a lambda with a block body fails to compile after error
  This release includes signed files
