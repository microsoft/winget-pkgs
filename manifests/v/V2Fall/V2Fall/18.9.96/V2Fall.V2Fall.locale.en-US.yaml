ShortDescription: Free VPN and proxy client built on sing-box and Xray, with automatic reconnect.
Description: |-
  V2Fall is a free VPN and proxy client for Windows. It imports subscription links and share links
  (VLESS, VMess, Trojan, Shadowsocks, REALITY, XHTTP, Hysteria2, TUIC, WireGuard and more) and runs them
  with the sing-box and Xray cores, in system proxy, TUN (whole-system VPN) or local proxy mode.
  It reconnects automatically when the connection drops, tests real delay, and updates itself in the app.
  The app ships no servers of its own; users add their own configs.
