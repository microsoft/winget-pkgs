ShortDescription: Windows tray app that keeps Codex and Claude Code usage limits, reset countdowns and alerts in view.
Description: |-
  Agent Usage Monitor (AUM) is a small Windows tray app built with Rust and Slint. It shows the remaining 5-hour and weekly usage of Codex and Claude Code, with reset countdowns, and can warn with Windows notifications before a limit runs out.
  Codex data is read through the local Codex app-server. Claude Code data comes from an optional status-line bridge and an optional Claude CLI background refresh that the user enables explicitly. AUM does not store provider credentials and does not change agent settings.
  Includes Graphite, Bluish Dark and Light themes and a Ukrainian, English, Polish and Russian interface.
  AUM is an independent project and is not affiliated with or endorsed by OpenAI or Anthropic.
