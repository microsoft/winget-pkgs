ReleaseNotes: |-
  Changed
  - Re-prompt instead of exiting when the pasted desktop OAuth redirect URL is invalid or left over from an earlier login attempt, with a hint when an http(s) URL is pasted instead of the evernote:// link (#172)
  - Report a declined OAuth authorization as such instead of as a missing authorization code
  Fixed
  - Exit with "Aborted!" instead of an "Unknown exception" traceback when an interactive prompt is cancelled (Ctrl+C or end of input)
  - Cut export memory use from ~7x the size of the largest note to ~1x, so that notebooks with large attachments no longer exhaust memory (8743341, f41c161)
  Removed
  - Drop support for Python 3.10, which is past end of life (3a1ddbf)
