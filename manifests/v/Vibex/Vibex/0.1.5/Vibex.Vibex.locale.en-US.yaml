ShortDescription: Local-first AI coding workbench built on the Agent Client Protocol
Description: Vibex is a native, local-first AI coding workbench built on the Agent Client Protocol. Your agents run in your own workspace from prompt to commit, on desktop, in the terminal and on your phone. It works with Codex, Claude Code, OpenCode, Pi, Grok, DeepSeek Harness, Antigravity and other agents through ACP.
