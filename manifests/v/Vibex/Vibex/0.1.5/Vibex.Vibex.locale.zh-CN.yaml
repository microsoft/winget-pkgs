ShortDescription: 基于 Agent Client Protocol 的本地优先 AI 编程工作台
Description: Vibex 是一款基于 Agent Client Protocol 构建的原生、本地优先的 AI 编程工作台。智能体在你自己的工作区中运行，覆盖从提示词到提交的完整流程，支持桌面、终端与手机。它通过 ACP 兼容 Codex、Claude Code、OpenCode、Pi、Grok、DeepSeek Harness、Antigravity 等多种智能体。
