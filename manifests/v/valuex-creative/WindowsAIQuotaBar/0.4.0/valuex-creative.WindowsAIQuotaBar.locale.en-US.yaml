ShortDescription: See how much of your AI subscriptions is left, in the Windows taskbar.
Description: |-
  Windows AI Quota Bar shows the remaining usage of Claude, Codex / ChatGPT, Google Antigravity, OpenCode Go, GitHub Copilot, OpenRouter and more in the taskbar and the tray.
  It shows reset countdowns, pace, history charts and usage alerts, and includes a CLI (qb) and an MCP server for AI assistants.
  No telemetry and no server of its own: it only talks to each provider's own API.
