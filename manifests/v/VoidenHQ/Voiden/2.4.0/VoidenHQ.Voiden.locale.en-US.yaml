ReleaseNotes: |-
  Stable: .void Block Diffs, Multi-Repo Source Control & Shell Picker
  Stable release rolling up v2.4.0-beta.1 and beta.2 plus newer changes: .void diffs and merge conflicts as real Voiden blocks, Source Control across multiple repos, a terminal shell picker, plugin-provided variables, per-section Jump and Retry in the response panel, Electron 44, and fixes across requests, gRPC, Git and plugins.

  Added
  - Diffs of .void files show as native Voiden blocks instead of raw Markdown (#606) — contributed by @simranxdhindsa
  - Changed blocks are marked Added, Removed or Modified, with the changed words highlighted inside each block (#606) — contributed by @simranxdhindsa
  - Split and Unified views keep the old and new blocks aligned, with a Rendered/Source toggle for .void files (#606) — contributed by @simranxdhindsa
  - Block diffs work in Commit History, branch comparison, uncommitted changes and Open File at This Commit (#606) — contributed by @simranxdhindsa
  - File header changes, like version, are listed in a separate note instead of mixed into the blocks (#606) — contributed by @simranxdhindsa
  - Merge conflicts in .void files show as block cards with Keep Current, Keep Incoming and Keep Both (#607) — contributed by @simranxdhindsa
  - The conflict view checks the result is a valid .void file before saving, with All Current/All Incoming/Both bulk actions (#607) — contributed by @simranxdhindsa
  - Images and other binary files show as previews or file cards in diffs, file previews and conflicts (#614) — contributed by @simranxdhindsa
  - Source Control shows status letters (M, U, A, D, R) next to changed files (#607) — contributed by @simranxdhindsa
  - Commit History is resizable and has a toolbar for Go to current commit, Fetch, Pull, Push and Refresh (#607) — contributed by @simranxdhindsa
  - The CLI install command in Settings has a Copy button (#613) — contributed by @simranxdhindsa
  - The HTTP QUERY method has its own color (#599) — contributed by @muhammadlutf1
  - Newly released community plugins are announced in the new plugins toast
  - Source Control can switch between the Git repos inside a project
  - New terminals can open with any installed shell, picked from the new terminal button (#598)
  - A default terminal shell can be set in Settings, or left on automatic (#598)
  - Main-process plugins can provide their own {{namespace.*}} variables, like {{vault.api_token}}
  - Response panel section headers have Jump to request and Retry buttons for that section

  Improved
  - Response panel section headers show the request URL on hover instead of inline
  - Commit History animates open and closed, and expanding a commit no longer makes the panel jump (#607) — contributed by @simranxdhindsa
  - Upgraded to Electron 44 and resolved Dependabot alerts
  - Smaller app package by dropping unused terminal prebuilds

  Fixed
  - Source Control no longer freezes on repos with many untracked files (#607) — contributed by @simranxdhindsa
  - Large binary files no longer freeze the window in diffs (#614) — contributed by @simranxdhindsa
  - No loader flash when switching files in Commit History (#618) — contributed by @simranxdhindsa
  - Windows no longer open blank after using File > Open Recent, and already-broken windows are repaired on start (#611) — contributed by @simranxdhindsa
  - Installing the voiden terminal command works on Apple chip Macs (#613) — contributed by @simranxdhindsa
  - Cancelling the terminal command password prompt no longer brings it back on every startup
  - Methods typed in lowercase, like patch, are sent in uppercase instead of failing with 400 Bad Request
  - Connecting to a server-streaming gRPC method no longer fails with "object expected"
  - The file tree no longer jumps or collapses open folders when a request is sent
  - Prettify keeps unquoted {{variables}} intact in a JSON body (#624) — contributed by @RagedPanda
  - A plugin with a malformed command no longer breaks the command palette
  - Images and relative links in plugin READMEs now load in the Extensions view
  - A file with a single request no longer shows a default section name or section line in the response panel

  What's Changed
  - Main to beta merge by @phurpa-tsering in #615
  - Fix blank window after using File > Open Recent by @simranxdhindsa in #611
  - Diff viewer: show .void files as native Voiden blocks by @simranxdhindsa in #606
  - Resolve .void merge conflicts as blocks, plus Source Control enhancements by @simranxdhindsa in #607
  - Terminal command install on all Macs, with a copyable command by @simranxdhindsa in #613
  - Show images and other binary files properly in diffs, previews and conflicts by @simranxdhindsa in #614
  - feat(ui): add color support for HTTP QUERY method by @muhammadlutf1 in #599
  - Send the install code with update checks by @phurpa-tsering in #616
  - Main to beta merge by @phurpa-tsering in #617
  - Stop the loader flash when switching files in Commit History by @simranxdhindsa in #618
  - Feature/variable provider api by @phurpa-tsering in #621
  - fix: keep template variables intact when prettifying a JSON body by @RagedPanda in #624
  - Beta to main by @phurpa-tsering in #627

  New Contributors
  - @RagedPanda made their first contribution in #624
