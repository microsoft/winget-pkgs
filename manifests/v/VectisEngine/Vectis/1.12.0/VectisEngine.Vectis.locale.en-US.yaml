ShortDescription: The MCP connector for all of your computers: your AI works on projects across every machine, without copying files. Access by invitation.
Description: |-
  Vectis runs a local MCP server on each of your computers. Connect your AI assistant and it can see your AI sessions, the project folders you choose to expose and your linked machines, with a live Monitor of every call.
  Folders open remotely between your own computers over an end-to-end encrypted connection; nothing is copied to the cloud.
  You need an account approved by invitation to use it.
  The installer is not code-signed yet, so Windows may show a SmartScreen warning the first time.
