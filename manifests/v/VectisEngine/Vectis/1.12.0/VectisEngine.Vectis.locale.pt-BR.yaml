ShortDescription: App de desktop da Vectis Engine, que organiza as suas pastas de trabalho no seu computador. Acesso por convite.
Description: |-
  A Vectis Engine instala e roda o motor local da Vectis no seu computador: organiza as pastas de trabalho que você escolher, mantém os seus projetos na sua máquina e conversa com a API local da Vectis.
  Para usar, você precisa de uma conta (e-mail e senha) liberada por convite; sem a liberação o app abre, mas não destrava.
  O instalador ainda não tem assinatura de código, então o Windows pode mostrar um aviso do SmartScreen na primeira vez.
