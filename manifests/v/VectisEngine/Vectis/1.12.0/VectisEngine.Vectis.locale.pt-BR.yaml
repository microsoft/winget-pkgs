ShortDescription: O conector MCP de todos os seus computadores: a sua IA trabalha nos projetos de todas as máquinas, sem copiar arquivo. Acesso por convite.
Description: |-
  O Vectis roda um servidor MCP local em cada computador seu. Conecte o seu assistente de IA e ele passa a enxergar as suas sessões de IA, as pastas de projeto que você libera e as máquinas ligadas, com um Monitor ao vivo de cada chamada.
  As pastas abrem a distância entre os seus computadores, por conexão criptografada de ponta a ponta; nada é copiado para a nuvem.
  Para usar, você precisa de uma conta liberada por convite.
  O instalador ainda não tem assinatura de código, então o Windows pode mostrar um aviso do SmartScreen na primeira vez.
