ShortDescription: Fast, free download manager for Windows with resume, torrents and web video downloads.
Description: |-
  VELOCITY DM is a free download manager for Windows 10 and 11.
  It splits files across up to 32 connections, continues downloads after crashes, power cuts and Windows restarts, and checks every file before marking it complete.
  It catches downloads from Microsoft Edge, Chrome and Firefox through its browser add-on, opens magnet links and .torrent files, saves videos and HLS streams from websites as MP4, and downloads over FTP.
  Queues, a night scheduler, speed and data limits, proxy support and an English and Arabic interface are included. No ads, no account, no trial.
