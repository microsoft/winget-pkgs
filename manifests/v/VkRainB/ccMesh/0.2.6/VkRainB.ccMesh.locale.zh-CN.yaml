ShortDescription: 轻量级跨平台 AI 代理网关桌面应用。
Description: |-
  ccMesh 是基于 Tauri 2 + Rust + React 19 的桌面端 AI 代理网关：在本机统一接入 Claude / OpenAI / Codex 等多类上游，提供协议转换、模型映射、端点轮换与熔断、请求统计与配置管理等能力。支持 Windows、macOS、Linux。

  功能特性
  仪表盘
  - 本地代理服务启停与端口状态一览
  - 今日 Token 用量与请求概览
  - 实时请求监控：模型、耗时、首字延迟、Token 明细
  端点管理
  - 多端点 CRUD、拖拽排序、列表/网格视图
  - 支持 claude（直通）、openai（转换）、codex（Responses） 三类转换器
  - 模型清单维护、入站/出站模型映射、连通性测试
  - 按模型过滤的轮换与熔断，避免无关端点被误伤
  配置文件
  - 以「渠道」管理 Claude Code settings.json 与 Codex auth.json + config.toml
  - 端点写入 / 自定义写入双模式，表单与 JSON 双向联动
  - 保存渠道与应用覆写分离，应用前自动备份
  统计与同步
  - 按应用、端点、模型维度查看历史用量
  - 配置与数据备份、恢复、导出
  设置
  - 全局出站代理、Claude/Codex CLI User-Agent
  - 应用内自动更新（GitHub Releases）
ReleaseNotes: |-
  新增
  - 代理：支持 Images 文生图 / 改图入站。OpenAI Chat 或 Codex 端点直转发，不走协议转换；请求模型未在端点声明时直接拒绝，不回退到其他候选
  - 实时请求监控：Images 文生图 / 改图请求正确识别入站路径，不再显示为未知
  - 代理熔断：429 限流与 5xx / 网络故障分开冷却。限流优先遵循上游 Retry-After（缺省数秒），候选端点均因限流不可用时网关内退避重试，耗尽后回 429 而非 502
  - 代理熔断：跳闸时按入站协议固化冷却（Claude 入站阈值更宽），半开探测不会因切换协议而提前恢复
  - 端点管理：熔断中徽章展示恢复倒计时；冷却到期仍无探测流量时显示「待探测」。仪表盘队列悬停同步该状态
  - 用量统计：新增 ZCode 来源筛选，读取本机 ZCode 用量并入统一记录（按记录键去重），与 Claude Code、Codex 并列展示
  - 文档站点：首页改为产品落地页（能力、接入步骤、截图），指南 / 功能 / 架构同步更新，协议转换矩阵补充 Images 直转发
  修复
  - 流式转换：兼容 SenseNova / DeepSeek 进行中 chunk 的空串 finish_reason，避免被当成已结束而逐 token 关块

