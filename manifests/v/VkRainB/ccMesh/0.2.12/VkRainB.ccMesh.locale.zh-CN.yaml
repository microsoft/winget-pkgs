ShortDescription: 轻量级跨平台 AI 代理网关桌面应用。
Description: |-
  ccMesh 是基于 Tauri 2 + Rust + React 19 的桌面端 AI 代理网关：在本机统一接入 Claude / OpenAI / Codex 等多类上游，提供协议转换、模型映射、端点轮换与熔断、请求统计与配置管理等能力。支持 Windows、macOS、Linux。

  功能特性
  仪表盘
  - 本地代理服务启停与端口状态一览
  - 今日 Token 用量与请求概览
  - 实时请求监控：模型、耗时、首字延迟、Token 明细
  端点管理
  - 多端点 CRUD、拖拽排序、列表/网格视图
  - 支持 claude（直通）、openai（转换）、codex（Responses） 三类转换器
  - 模型清单维护、入站/出站模型映射、连通性测试
  - 按模型过滤的轮换与熔断，避免无关端点被误伤
  配置文件
  - 以「渠道」管理 Claude Code settings.json 与 Codex auth.json + config.toml
  - 端点写入 / 自定义写入双模式，表单与 JSON 双向联动
  - 保存渠道与应用覆写分离，应用前自动备份
  统计与同步
  - 按应用、端点、模型维度查看历史用量
  - 配置与数据备份、恢复、导出
  设置
  - 全局出站代理、Claude/Codex CLI User-Agent
  - 应用内自动更新（GitHub Releases）
ReleaseNotes: |-
  新增
  - 端点：可用模型可收缩搜索；可配置四项单价、时区和每周峰谷，并预览报价
  - 模型价格：复用可搜索的模型选择框，可从自动报价填入默认价；「DeepSeek 价格快捷设置」可为官方或第三方端点手动填入 Flash / Pro 峰谷价草稿
  - 请求成本：按出站模型冻结费用；未配价时用 models.dev 原厂价，没有原厂价则用多家渠道一致价
  - 请求记录：双击打开详情，Token 与成本合并查看；表格今天只显示时分秒，成本并入 Token，满 1000 用 k
  - 统计：概览增加总成本；端点按模型列出请求、错误、Token 和已计价成本；日期可看全部
  - 仪表盘：今日改为总成本，失败数放到请求数角落
  - 工具会话：正文按角色展示，连续工具调用折叠
  修复
  - 模型图标：Kimi 亮色不再白底；OpenAI 单色图标暗色为白色
  - 请求表格：隐藏列后宽度分给剩余列；未配置价格和用量不完整不显示成本；去掉重复的价格说明
  - 请求速率：tok/s 改为输出 token 除以总用时
  - 弹层与翻页：编辑弹层不再被顶栏挡住；请求列表翻页保持高度，页面不跳动
  - 金额展示：仪表盘、统计和请求明细的成本最多显示四位小数，计价和汇总精度不变
  - Cursor 用量：Windows 下可读取新版 Cursor 加密的登录凭证，不再把已登录误报为未登录；旧版明文存储仍可用
  - Cursor 用量：API 通道不再把套餐保底显示为通道额度；保留官方进度，两条通道按各自已用金额与进度显示预估额度
  - DeepSeek 用量：识别 OpenAI 兼容响应的缓存命中字段，避免把命中 Token 按未命中价计算
  - 模型价格：报价预览改用内嵌日历和时间输入，小窗口中可滚动选择，不遮挡保存按钮

