ShortDescription: 轻量级跨平台 AI 代理网关桌面应用。
Description: |-
  ccMesh 是基于 Tauri 2 + Rust + React 19 的桌面端 AI 代理网关：在本机统一接入 Claude / OpenAI / Codex 等多类上游，提供协议转换、模型映射、端点轮换与熔断、请求统计与配置管理等能力。支持 Windows、macOS、Linux。

  功能特性
  仪表盘
  - 本地代理服务启停与端口状态一览
  - 今日 Token 用量与请求概览
  - 实时请求监控：模型、耗时、首字延迟、Token 明细
  端点管理
  - 多端点 CRUD、拖拽排序、列表/网格视图
  - 支持 claude（直通）、openai（转换）、codex（Responses） 三类转换器
  - 模型清单维护、入站/出站模型映射、连通性测试
  - 按模型过滤的轮换与熔断，避免无关端点被误伤
  配置文件
  - 以「渠道」管理 Claude Code settings.json 与 Codex auth.json + config.toml
  - 端点写入 / 自定义写入双模式，表单与 JSON 双向联动
  - 保存渠道与应用覆写分离，应用前自动备份
  统计与同步
  - 按应用、端点、模型维度查看历史用量
  - 配置与数据备份、恢复、导出
  设置
  - 全局出站代理、Claude/Codex CLI User-Agent
  - 应用内自动更新（GitHub Releases）
ReleaseNotes: |-
  v0.2.3
  新增
  - 配置档案 / Claude Desktop：接管本机真实配置目录，三栏编辑 Profile、_meta 与桌面配置文件；Windows / macOS / Linux 均有路径解析（Windows 含 MSIX 探测，Mac/Linux 按约定 3P 目录，可用环境变量覆盖）
  - 配置档案 / Claude Desktop：支持独立开关 3P 模式，打开配置目录，应用配置并标识当前生效项
  - 配置档案 / Claude Desktop：支持模型发现与模型别名；开启发现时自动拉取模型，关闭后可配置界面别名
  - 对话：新增内置对话页，支持模型选择、消息列表与话题管理
  - 工具会话：新增工具会话页面与导航入口
  - 桌宠：新增宠物管理与精灵展示，接入侧栏导航与设置入口
  - 端点管理：模型映射增加总开关、快捷预设与卡片高亮
  - 同步：导出/导入与 WebDAV 同步覆盖模型映射及总开关
  - 模型图标：未匹配模型改用通用图标兜底，完善 codex 前缀识别
  修复
  - 代理熔断：未知入站路径返回 404 时不再误触发端点熔断
  桌宠 （宽屏下显示，填补你的左侧空白）
  会话管理
  Claude Desktop 配置
