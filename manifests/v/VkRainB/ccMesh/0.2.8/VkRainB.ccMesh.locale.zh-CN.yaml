ShortDescription: 轻量级跨平台 AI 代理网关桌面应用。
Description: |-
  ccMesh 是基于 Tauri 2 + Rust + React 19 的桌面端 AI 代理网关：在本机统一接入 Claude / OpenAI / Codex 等多类上游，提供协议转换、模型映射、端点轮换与熔断、请求统计与配置管理等能力。支持 Windows、macOS、Linux。

  功能特性
  仪表盘
  - 本地代理服务启停与端口状态一览
  - 今日 Token 用量与请求概览
  - 实时请求监控：模型、耗时、首字延迟、Token 明细
  端点管理
  - 多端点 CRUD、拖拽排序、列表/网格视图
  - 支持 claude（直通）、openai（转换）、codex（Responses） 三类转换器
  - 模型清单维护、入站/出站模型映射、连通性测试
  - 按模型过滤的轮换与熔断，避免无关端点被误伤
  配置文件
  - 以「渠道」管理 Claude Code settings.json 与 Codex auth.json + config.toml
  - 端点写入 / 自定义写入双模式，表单与 JSON 双向联动
  - 保存渠道与应用覆写分离，应用前自动备份
  统计与同步
  - 按应用、端点、模型维度查看历史用量
  - 配置与数据备份、恢复、导出
  设置
  - 全局出站代理、Claude/Codex CLI User-Agent
  - 应用内自动更新（GitHub Releases）
ReleaseNotes: |-
  新增
  - 用量统计：新增 Cursor 来源 Tab 与订阅制用量面板。展示账期额度、日预算、各通道已用进度、趋势图与最近请求金额；本地快照即显，过期后自动刷新。套餐卡总消耗下增加本周期总 Token（万/亿缩写）。刷新时清理 90 天前事件
  - 统计页：概览改为真实消耗 Tokens 与缓存命中率主卡，下挂请求数 / 输入 / 输出 / 创建缓存 / 命中缓存。命中率按 prompt 侧 token 加权：cache_read / (净输入 + cache_read + cache_write)。Token 统一万/亿格式化
  - 工具会话：支持扫描与查看本机 Pi / OMP 会话（路径解析、深色 logo）
  - 配置档案：Claude 渠道增加 Fable 模型行（Opus 与 Haiku 之间，含 1M 开关），读写 ANTHROPIC_DEFAULT_FABLE_MODEL；cc-switch 迁移纳入 Fable
  - 模型图标：包装名分段匹配（如 cursor-grok-… 按品牌段识别，不再被 Cursor 前缀抢走）
  修复
  - 端点管理：连通性测试、内置对话发送与压缩请求同样套用端点请求头覆写；官方域名会话头仍优先于账号级同名覆写
  - 端点管理：请求头覆写改为替换同名头（不再 append）。探测 UA 等会被配置覆盖，代理转发共用
  - 用量统计：ZCode 含缓存的总输入扣成净输入，与其它来源四桶对齐，命中率不再虚高
  - Cursor 用量：cursor-grok 归入 Auto + Composer 通道；去掉额度进度条上的建议用量竖线
  优化
  - 工具会话：Pi / OMP 列表扫描不再进入 sidecar 日志目录，头采样 64KB 后提前结束；详情默认只渲染最近 80 条，屏外用 content-visibility 跳过绘制

