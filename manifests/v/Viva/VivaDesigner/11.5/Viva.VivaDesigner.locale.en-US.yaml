ShortDescription: Design, layout, and publishing program for desktop and web.
Description: |-
  VivaDesigner is a design, layout, typesetting, and illustration program for books, brochures, magazines, catalogs, business cards, and social media graphics. The same program runs on the desktop (Windows, macOS, and Linux) and in a web browser.
  Features:
  - High-end typography for complex documents, including tables, footnotes, indexes, and barcodes.
  - Beginner, Advanced, and Expert working modes.
  - Adobe InDesign import support.
  - Multi-language documents with support for different writing directions.
  - AI-based features such as automatic translation and image clipping.
  - Team workflows through VivaCloud with access rights and editable web documents.
  The Windows version is a lifetime free version that can be unlocked with a purchased license for the time-limited full version (Commercial Edition).
