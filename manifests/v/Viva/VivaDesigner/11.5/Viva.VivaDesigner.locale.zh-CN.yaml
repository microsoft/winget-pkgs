PackageIdentifier: Viva.VivaDesigner
PackageVersion: "11.5"
PackageLocale: zh-CN
License: 专有软件
ShortDescription: 适用于桌面与网页的设计、排版与出版程序。
Description: |-
  VivaDesigner 是一款集设计、排版、图文编排与插画于一体的出版程序，适用于书籍、手册、杂志、产品目录、名片与社交媒体图形。同一程序既可在桌面（Windows、macOS 与 Linux）运行，也可在网页浏览器中运行。
  功能特性：
  - 面向复杂文档的高端排版，包括表格、脚注、索引与条形码。
  - 初学者、高级与专家三种工作模式。
  - 支持 Adobe InDesign 导入。
  - 多语言文档，支持不同的书写方向。
  - 基于 AI 的功能，例如自动翻译与图像抠图。
  - 通过 VivaCloud 进行团队协作，支持访问权限与可编辑的网页文档。
  Windows 版本为终身免费版本，可通过购买许可解锁限时完整版（商业版）。
