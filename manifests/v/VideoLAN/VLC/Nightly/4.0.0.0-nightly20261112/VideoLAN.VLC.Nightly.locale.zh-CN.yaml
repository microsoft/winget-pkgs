Description: |-
  VLC 是一款自由、开源的跨平台多媒体播放器及框架，可播放大多数多媒体文件，以及 DVD、音频 CD、VCD 及各类流媒体协议。

  简单、快速且强大
    播放一切 - 文件、光盘、摄像头、设备及流媒体。
    无需安装编解码器包即可播放大多数编解码格式 - MPEG-2、MPEG-4、H.264、MKV、WebM、WMV、MP3……
    完全免费 - 无间谍软件、无广告、无用户追踪。
