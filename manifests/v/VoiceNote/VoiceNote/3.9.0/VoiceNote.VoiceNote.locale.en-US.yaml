ShortDescription: Hold a hotkey to record voice notes, transcribed into an inbox. Built for language learners, with dictation, reminders, Pomodoro and drag-and-drop bookmarks on an overlay pill.
Description: |-
  Voice Notes is a hotkey-powered voice notes app for Windows, built for language learners. Hold a shortcut to record a thought, and the app transcribes it and keeps it in an inbox to review later.
  It also has dictation into any app, reminders, a calendar and a Pomodoro timer, so you can study, explain what you learned in a voice note, and come back to it later.
  Drag a link or some text onto the overlay pill to save it to the right page, or click the pill to type a quick note.
