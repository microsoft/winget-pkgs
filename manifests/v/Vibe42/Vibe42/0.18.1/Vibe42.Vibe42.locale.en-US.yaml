ShortDescription: Zero-config remote terminal and AI remote workspace.
Description: |-
  Vibe42 is a zero-config remote terminal and AI remote workspace. Install Vibe42 on your own computer, pair a phone, tablet, browser or another computer, and keep using the terminals, coding agents, files and screen on that computer from anywhere over an end-to-end encrypted connection.
  The Windows app runs coding agents such as Claude Code and Codex in terminals on your own PC, next to a web preview, files and a remote desktop. It installs for the current user under %LOCALAPPDATA%\Programs\Vibe42 and needs no administrator rights. It needs neither WSL nor tmux; its background service brings its own terminal multiplexer, and the v42 command line is on PATH in new terminals.
  Devices pair with a short-lived code. Native apps and the command line connect peer-to-peer when possible; otherwise traffic goes through the nearest Vibe42 relay. Every session is end-to-end encrypted with a Noise handshake, keys are generated on each device and never leave it, and relays forward ciphertext only.
