License: 专有软件
ShortDescription: 零配置的远程终端与 AI 远程工作台。
Description: |-
  Vibe42 是零配置的远程终端与 AI 远程工作台。在你自己的电脑上安装 Vibe42，配对手机、平板、浏览器或另一台电脑，就能在任何地方通过端到端加密连接继续使用那台电脑上的终端、编码智能体、文件和屏幕。
  Windows 应用在你自己的电脑上运行 Claude Code、Codex 等编码智能体，并把网页预览、文件和远程桌面放在同一个标签页里。它只为当前用户安装到 %LOCALAPPDATA%\Programs\Vibe42，不需要管理员权限，也不需要 WSL 或 tmux；它的后台服务自带终端复用器，新的终端里可以直接使用 v42 命令行。
  设备通过短期有效的配对码配对。原生应用和命令行在条件允许时直连，否则经由最近的 Vibe42 中转节点。每个会话都使用 Noise 握手端到端加密，密钥在各设备上生成且永不离开设备，中转节点只转发密文。
