ReleaseNotes: |-
  The following new features and changes are included:
  - The database dialog has been revised:
    - The “Series” column has been added.
    - Individual columns can be shown or hidden.
    - Old heat pumps (prior to 2024) can be hidden.
    - The settings (dialog box size, column settings) are saved.
  - The GEG verification has been updated to comply with the new Building Modernization Act (GModG). Additionally, the system indicates whether the fuel requirements under the “Biotreppe” guidelines are met.
  - The financial calculation has been revised:
    - The costs of the heat pump system are compared to the costs of a freely definable reference system.
    - The subsidies for heat pumps can be roughly calculated and are directly included into the cost comparison.
    - The break-even point is shown graphically.
    - A CO2 comparison shows the CO2 emissions and savings of the heat pump system compared to the reference system.
  - After being turned off, the heat pump is locked out for 10 minutes before it can be turned back on. This realistically simulates the behavior of heat pump controllers.
  - The bivalence point diagram has been revised.
  - Updated database.
  The following bugs have been fixed:
  - The program crashed when loading a project file with a user-defined manufacturer.
  - Sorting by date in the database dialog did not work.
  - For heat pump test points, COP values less than 1 can now also be entered.
  - Importing TCOMP files did not work.
  - Occasional crashes occurred when searching in the database dialog.
  - Filter settings in the system selection were not saved.
  - Calculations according to VDI 4650 are no longer possible for flow temperatures above 60 °C, as the standard does not cover this range.
  - Selecting a different boiler with the same output did not trigger a new simulation.
  - Different simulation results after resetting to the default storage tank.
  - Balance error when cycling heat pumps.
  - Full-load hours were missing from the project report.
  - The temperature spread in the high-temperature heating circuit had to be at least 10 K.
  - In some cases, the program could not be started because the database could not be accessed. The driver for Microsoft Access Database Engine 2016 has been removed.
  - MeteoSyn: Climate data for a new location could not be generated from measurement data in the form of monthly values.
