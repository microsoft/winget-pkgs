ShortDescription: A beginner-friendly programming language with English-like syntax
Description: |-
  VSS (Very Simple Syntax) is a beginner-friendly, dynamically typed scripting
  language with a clean, English-like syntax. Version 3.0.0 introduces native
  set literals, traits, compile-time constants, namespaces, async/await, multi-threading,
  and 15 core standard libraries (math, string, collections, filesystem, json, xml,
  yaml, csv, http, database, crypto, gui, ai, testing, web) wrapped in namespaces.
