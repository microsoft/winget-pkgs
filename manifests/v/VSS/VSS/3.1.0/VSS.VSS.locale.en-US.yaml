ShortDescription: A beginner-friendly programming language with English-like syntax and Python feature parity
Description: |-
  VSS (Very Simple Syntax) is a beginner-friendly, dynamically typed scripting
  language with a clean, English-like syntax. Version 3.1.0 introduces Python feature parity
  including range(), enumerate(), reversed(), sorted(), type_of(), extended string/map built-ins,
  and standard libraries for encoding (base64/hex), path, random, datetime, and regex.
