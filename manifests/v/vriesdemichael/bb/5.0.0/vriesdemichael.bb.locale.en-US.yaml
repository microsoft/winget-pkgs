ShortDescription: A CLI for Bitbucket Server / Bitbucket Data Center
Description: |-
  bb works with Bitbucket Data Center and Bitbucket Server from the command line, the way gh works with GitHub: pull requests, repositories, branches, tags, commits, build status and permissions.
  Every command can answer in JSON for scripts, and bb ai mcp serve exposes it to AI agents over the Model Context Protocol. It is not for Bitbucket Cloud.
