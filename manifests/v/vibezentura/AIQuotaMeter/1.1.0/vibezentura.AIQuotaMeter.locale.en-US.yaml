ShortDescription: Local-first dashboard for Claude and Codex subscription limits and DeepSeek API credits.
Description: |-
  AI Quota Meter brings AI subscription limits and API credits into one private dashboard that runs
  entirely on your own machine. Circular energy meters, reset countdowns, and plain-language statuses
  make current usage easy to scan.

  It tracks Claude five-hour and weekly subscription windows, Codex subscription rate-limit windows,
  and live DeepSeek API credits. Claude and Codex read from the local CLI login already on the machine;
  several accounts per provider can be kept side by side in isolated sign-in profiles.

  A refresh ledger derives usage between checks, measured burn rate, and estimated time to limit from
  consecutive readings, with usage-over-time charts, session history, and CSV export. Provider
  configuration is stored in an encrypted local vault (AES-256-GCM, PBKDF2-HMAC-SHA256 with 600,000
  iterations). There is no telemetry, no analytics, and no third-party JavaScript; nothing is uploaded.
