ReleaseNotes: |-
  Added
  - Run Pi tasks with --tier full and OpenCode v2 tasks with --tier read or --tier full. Both support follow-up messages, cancellation, and resuming the original session.
  - When you delegate from the Pi terminal, install the notification extension with pi install git:github.com/Victor-Quqi/Axiopera. Results and questions can then wake an idle Pi session. OpenCode v2 uses its native background shell for notifications.
  - Pi tracks background tasks from pi-subagents and @tintinweb/pi-subagents. OpenCode tracks its native subagents and background shell commands after the parent turn ends.
  Other notes
  - When upgrading from 0.4.x, let running tasks finish and run axiopera daemon stop before replacing the executable. Run axiopera skill install all to install the skill for all six supported agents. If an older copy is present, add --force to replace it.
