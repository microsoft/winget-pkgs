ReleaseNotes: |-
  Codex 可以看到子任务的实时进展，已取消的任务可以续接，agent 说明也更清楚了。
  新增
  - axiopera watch --status 跟踪正在执行和排队的任务，每 2 秒检查一次，输出状态和进度的变化，任务全部结束后退出。Codex 的 guide 会让它在后台终端运行，方便查看子任务进展。
  改进
  - guide 和子 agent 说明补充了几点：任务默认共用当前工作目录，--cwd 可另行指定，并行写入的任务应各用一个 git worktree；回答送入所属任务的主会话；Grok 的 read 档会限制 shell 命令。
  - 拒绝消息会写明原因：read 档不允许、审批通道已关闭，或后端没有提供单次批准选项。
  - daemon 版本持续不匹配时，报错会说明 axiopera daemon stop --force 会中断所有会话中正在运行的任务。
  - 发布归档只包含二进制和 LICENSE，不再套一层目录。
  修复
  - 已取消的任务可以用 send 或 reply 续接。取消时保留会话和未交付输入。续接父任务不会重启已取消的子任务，需要逐个续接。
  其它说明
  - 客户端与 daemon 的通信协议有变化，替换程序前先执行 axiopera daemon stop。
  - 降低父任务档位时，已取消的子任务也会参与检查，需要先降低它们的档位。
  - 更新 Codex 插件后可能需要重新信任插件。
