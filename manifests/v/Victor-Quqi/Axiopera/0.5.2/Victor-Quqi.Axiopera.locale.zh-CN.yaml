ReleaseNotes: |-
  本版修复了 Pi 和 OpenCode 派发时的模型选择，也让窄终端中的待审批操作更容易看清。
  修复
  - OpenCode 的 read 和 full 任务会等待项目默认主 agent 加载，并采用它的专属指令。模型和推理强度按项目设置和 TUI 保存的偏好选择，axiopera models opencode 显示相同的派发默认值。续接 0.5.1 创建的任务时，保留该任务记录的模型和强度。
  - Pi 可以列出并派发启动后才发现的模型，包括初始目录为空的 provider。axiopera models pi 会显示配置模型实际使用的思考强度，目录为空时也不再把 unknown/unknown 显示为默认模型。
  - axiopera top 在 40 列终端仍能完整显示任务状态。OpenCode 工具行会显示文件路径或 shell 命令，等待审批时就能看见操作对象。
