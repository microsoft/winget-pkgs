ReleaseNotes: |-
  Fixed
  - OpenCode read and full tasks now wait for the project's default primary agent and use its instructions. Model and reasoning effort selection follows the project's settings and saved TUI preferences. axiopera models opencode reports the same defaults. Resuming a task created with 0.5.1 preserves its recorded model and effort.
  - Pi can now list and use models that a provider discovers after startup, including providers with an empty initial catalog. axiopera models pi reports the effective thinking level for a configured model and omits the placeholder default when the catalog is empty.
  - axiopera top keeps the task status visible at 40 columns. OpenCode tool rows show the file path or shell command, including while an approval is pending.
