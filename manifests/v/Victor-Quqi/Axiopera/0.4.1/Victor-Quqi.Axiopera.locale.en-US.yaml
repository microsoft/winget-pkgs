ReleaseNotes: |-
  Fixed
  - When a Codex task delegates work to a native child, Axiopera waits for the parent’s final answer. A message sent after the child finishes still reaches the parent’s running turn. The result and token usage come from the parent, and file approvals show the requesting thread’s changes. #2
  - If the same caller starts two tasks with the same name at once, only one starts. The other receives a name conflict.
