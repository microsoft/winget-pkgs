ReleaseNotes: |-
  Significant changes relative to 3.3.1:
  1. Fixed an issue in the Windows TurboVNC Viewer that caused right Windows key press/release events to be transmitted incorrectly to the VNC server when server-side key mapping was enabled.
  2. The TurboVNC Viewer no longer attempts to resize the remote desktop in view-only mode, and the TurboVNC Server no longer allows remote desktop resizing if -viewonly was passed to Xvnc.
  3. The TurboVNC Server no longer allows extended input device events if -viewonly was passed to Xvnc or the viewer authenticated with view-only credentials.
  4. Fixed an issue in the TurboVNC Viewer whereby the saved options for listen mode were not applied unless the user opened the TurboVNC Viewer Options dialog and clicked "OK" prior to the first connection.
  5. Fixed an issue in the TurboVNC Server that caused Chrome/Chromium to misdetect the pointer device and thus ignore CSS rules gated by a @media (hover: hover) query.
  6. Fixed an issue in the Mac TurboVNC Viewer whereby it was necessary to specify the full path of a connection info file passed to /opt/TurboVNC/bin/vncviewer on the command line.
  7. Because ExtSSHCommand and ExtSSHTemplate can potentially be used to launch arbitrary applications, the TurboVNC Viewer now disallows those parameters in TurboVNC connection info (.turbovnc) files by default unless the file is passed to the TurboVNC Viewer using the command line. A new Java system property (turbovnc.advancedconninfo) can be used to override the default behavior.
  8. The TurboVNC Server now includes various security fixes (CVE-2023-5380, CVE-2026-33999, CVE-2026-34000, CVE-2026-34001, CVE-2026-34002, CVE-2026-34003, CVE-2026-88812, CVE-2026-93515, CVE-2026-93516, CVE-2026-93517, CVE-2026-93518, CVE-2026-93519, CVE-2026-93520, CVE-2026-93521, CVE-2026-93523, and CVE-2026-93524) from the xorg-server 21.1.x code base.
  9. The TurboVNC Server's in-tree version of zlib-ng has been upgraded to v2.3.3, which includes multiple bug fixes and performance enhancements.
  10. The TurboVNC Server's built-in WebSocket proxy now works on big-endian systems.
  11. The TurboVNC Viewer's built-in SSH client has been rebased on v2.27.9 of the JSch fork, which includes several minor bug fixes as well as support for the built-in OpenSSH Authentication Agent (ssh-agent) on Windows. A new parameter (Pageant) can be used to select Pageant or ssh-agent as the SSH authentication agent on Windows.
  12. Fixed an issue in the TurboVNC Viewer whereby the values of the HotkeyModifiers and Emulate3Modifiers parameters were saved in the per-host options when clicking OK in the TurboVNC Viewer Options dialog. If the parameters were not explicitly specified for subsequent connections to the same host, then the saved values effectively became the default values, which could have caused confusion.
