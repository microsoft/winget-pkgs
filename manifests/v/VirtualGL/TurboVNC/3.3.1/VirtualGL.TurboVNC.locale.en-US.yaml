  Current Support Category: Active
  Documentation
  User’s Guide for TurboVNC 3.3.1
  Release Notes
  Significant changes relative to 3.3:
  1. The simple web server for noVNC (part of the TurboVNC Server) now supports Python 3.12 and later when using TLS encryption.
  2. The TurboVNC Viewer now supports 3-button mouse emulation, which addresses a feature regression relative to the native Windows TurboVNC 2.2.x Viewer. New parameters (Emulate3, Emulate3Fuzz, Emulate3Timeout, and Emulate3Modifiers) and a new check box in the TurboVNC Viewer Options dialog can be used to enable and configure 3-button mouse emulation. Emulate3, Emulate3Fuzz, and Emulate3Timeout work identically to the corresponding command-line options in the native Windows TurboVNC 2.2.x Viewer, enabling middle mouse button emulation with a left and right mouse button chord. Emulate3Modifiers enables middle mouse button emulation with the left mouse button and a specified combination of modifier keys.
  3. The optional TurboVNC Server init.d script for Linux has been improved in the following ways:
     - The script has been reimplemented as a systemd service, which extends compatibility to Fedora 45 and later, SUSE 16 and later, and other Linux distributions that no longer translate SysV init scripts. (systemd-sysv-generator was removed in systemd v260.) This also fixes a dependency error when installing an official TurboVNC RPM package on SUSE 16.
     - To match the behavior of the official RPM packages, the official TurboVNC DEB packages now configure the TurboVNC Server service when the package is freshly installed and unconfigure it when the package is removed.
     - The official TurboVNC RPM and DEB packages now invoke systemctl preset tvncserver when the package is freshly installed, which allows system administrators to use a systemd preset file to specify that the TurboVNC Server service should be enabled by default. (Previously, the TurboVNC Server service was always enabled by default when an official TurboVNC RPM package was freshly installed.)
     - The TurboVNC Server service is no longer restarted when an official TurboVNC RPM package is upgraded. This allows system administrators to hot patch systems with active TurboVNC sessions.
  4. Fixed an issue whereby the TurboVNC Viewer became unresponsive if the TigerVNC Server intentionally disconnected a TLS-encrypted connection.
  5. Fixed an issue in the TurboVNC Viewer whereby hotkey sequences could be triggered with any superset of the modifier keys specified in the HotkeyModifiers parameter (for example, Ctrl-Alt-Meta if Ctrl-Meta was specified.)
