ShortDescription: Free portable video and movie downloader for Windows. Paste a link, pick quality, get the file.
Description: |-
  VGrab downloads videos and movies from YouTube, VK, Rutube, TikTok, Instagram, Vimeo, X and hundreds of other sites.
  Playlists and multiple links at once, sequential queue with progress, speed and ETA. Audio track selection and
  external .srt subtitles for movies, trim by time, MP4 / WebM / MKV containers, MP3 audio-only. Cabinet interface
  with home counters, downloads, library and settings. Fully local: no accounts, no telemetry, server binds 127.0.0.1.
  DRM-protected services are not supported.
