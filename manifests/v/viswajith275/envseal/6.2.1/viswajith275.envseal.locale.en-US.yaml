ReleaseNotes: |-
  New: opt-in environment isolation for run
  envseal run now accepts an optional --clear flag. When set, the child process starts with a completely clean environment before any vault secrets are injected.
  # Run with only the secrets from the vault (no inherited host env vars)
  envseal run --clear -- npm start
  # Works with the existing global-vault flags
  envseal run --clear --with-global -- ./deploy.sh
  This is useful when you want strict isolation — e.g. CI jobs, containers, or scripts that must not see ambient host variables.
  No breaking changes. Existing vaults and workflows continue to work unchanged.
