ShortDescription: A Windows tray launcher that runs several Claude Desktop accounts side by side, each with its own session.
Description: |-
  Facet runs multiple Claude Desktop accounts side by side on Windows. Each profile gets its
  own data directory, so you sign in once per account and switch between them from the tray.
  The account you are already signed into is adopted in place, with nothing copied.

  It also restores session export: the zip of a whole Claude Code session that the desktop app
  no longer writes, rebuilt from the local transcript. No network, no API key, no quota.

  Facet is not affiliated with, endorsed by, or sponsored by Anthropic.
