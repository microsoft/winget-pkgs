ShortDescription: Screen magnifier for low vision that follows the mouse, keyboard focus and the text you type.
Description: |-
  Lupa magnifies the screen in a dock on a monitor edge, full screen, or a lens at the pointer.
  The view follows the mouse, the focused element and the caret, including in browsers and WebView2 apps.
  It reads selected text with Windows voices and falls back to the OCR built into Windows when an app does not expose its text.
  The interface is in Polish.
