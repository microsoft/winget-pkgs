ShortDescription: Powiększenie ekranu dla osób słabowidzących, które idzie za myszą, fokusem i pisanym tekstem.
Description: |-
  Lupa powiększa ekran w doku na krawędzi monitora, na pełnym ekranie albo w soczewce przy kursorze.
  Widok idzie za myszą, elementem z fokusem i karetką, także w przeglądarkach i aplikacjach na WebView2.
  Czyta zaznaczony tekst głosami Windows, a gdy aplikacja nie udostępnia tekstu, używa wbudowanego w Windows OCR.
  Ma filtry kolorów, powiększony kursor ze znacznikiem, wyróżnienie fokusu i panel ustawień dostępny dla czytników ekranu.
