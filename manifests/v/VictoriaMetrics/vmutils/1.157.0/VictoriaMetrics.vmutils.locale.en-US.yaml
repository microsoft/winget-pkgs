ShortDescription: The VictoriaMetrics command-line tools vmagent, vmalert, vmalert-tool, vmauth, vmbackup, vmrestore and vmctl.
Description: |-
  vmutils bundles the VictoriaMetrics tools that run next to the database:
  vmagent collects and forwards metrics, vmalert evaluates alerting and recording rules, vmalert-tool unit-tests those rules,
  vmauth is an authenticating proxy and load balancer, vmbackup and vmrestore back up and restore data,
  and vmctl migrates data between time series databases.
