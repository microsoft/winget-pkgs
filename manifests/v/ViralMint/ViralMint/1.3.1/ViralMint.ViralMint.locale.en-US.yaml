ShortDescription: Open-source video pipeline (clipper, AI video & more) for content creators.
Description: |-
  ViralMint is an open-source desktop video pipeline. It runs a local server with its interface in your browser and covers the path from idea to finished video: trend scouting on YouTube, TikTok and Douyin with outlier scores, video downloads, local Whisper transcription, AI clip extraction from long videos, script-to-video with stock footage, voiceover and word-by-word captions, AI video and image generation, motion graphics, and single-purpose editing tools that mostly run locally on FFmpeg.
  Bring your own AI key (Anthropic, OpenAI, OpenRouter) or point it at any OpenAI-compatible server such as Ollama or LM Studio. Finished videos are saved locally; nothing is uploaded automatically.
