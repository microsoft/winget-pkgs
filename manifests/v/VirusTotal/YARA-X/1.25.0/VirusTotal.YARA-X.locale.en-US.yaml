ShortDescription: YARA-X is a re-incarnation of YARA, a pattern matching tool designed with malware researchers in mind. This new incarnation intends to be faster, safer and more user-friendly than its predecessor.
ReleaseNotes: |-
  - Replace bincode with postcard for compiled rule serialization; previously serialized rules must be recompiled (03d3724).
  - Add ELF section flag constants (SHF_WRITE, SHF_ALLOC, SHF_EXECINSTR, etc.) to the elf module (1e8f7f8).
  - Add missing pe.MACHINE_* constants (MACHINE_TARGET_HOST, MACHINE_SH3E, MACHINE_TRICORE, MACHINE_CEF, and MACHINE_CEE) to the pe module (#901).
  - Improve documentation for pe module functions and the C API (yrx_scanner_scan_block), and add a blog post on hunting Android malware with the dex module (#889, #890, #892).
  - BUGFIX: Follow symbolic links to regular files when scanning or walking directories in the CLI (#905).
  - BUGFIX: Fix memory corruption when a Scanner or Compiler instance is used sequentially across different OS threads, such as in Go goroutines or C thread pools (#907).
  - BUGFIX: Fix a Rust soundness issue where data borrowed by a console_log callback could be dropped before the Scanner (d61188a).
  - BUGFIX: Fix a panic when finishing a block scanner without scanning any blocks (5aa821a).
  - BUGFIX: Fix out-of-bounds matches and panics on truncated base64wide inputs (8d39a6f).
  - BUGFIX: Fix multiple regular expression matching bugs involving jumps at pattern boundaries, newline handling, match priority in alternations, and wide patterns (#902, 77721ae, 6ac620f, #906).
  - BUGFIX: Prevent excessive memory usage and panics when compiling rules with heavily masked patterns or very large numbers of atoms, returning error E049 (TooManyAtoms) when the limit is exceeded (acdd1f0, cea5fb8).
  - BUGFIX: Fix scan-time panics when aliasing certain module namespaces (such as cuckoo.network) in with statements (0502069).
  - BUGFIX: Prevent stack overflows when compiling deeply nested expressions by lowering the maximum nesting depth to 100 (1a31f25).
  - BUGFIX: Fix exponential backtracking in the parser on deeply nested calls and for expressions (cddc132).
  - BUGFIX: Fix validly signed PE and MSI files with empty CRL lists being reported as unsigned (043c30c).
  - BUGFIX: Fix panics when verifying DSA-signed Authenticode signatures (b24d24f).
  - BUGFIX: Harden Authenticode verification in PE and MSI files against excessive CPU usage on crafted signatures and countersignatures (15b9026, 1638d56).
  - BUGFIX: Limit decompressed ZIP entry sizes to 64 MiB in the vba module to prevent decompression bombs (ee84a73).
  Contributors: @dannyota, @debugactiveprocess
