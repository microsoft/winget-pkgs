ShortDescription: YARA-X is a re-incarnation of YARA, a pattern matching tool designed with malware researchers in mind. This new incarnation intends to be faster, safer and more user-friendly than its predecessor.
ReleaseNotes: |-
  - Add has_string, has_method, and has_class functions with YARA-compatible overloads to the dex module, keeping contains_string, contains_method, and contains_class as aliases (e55460d).
  - Support an optional alias argument in the #[module_export] macro for exporting module functions under alternate names (00a0f97).
  - Add Windows ARM64 release builds (CLI and C API) and Python wheels (#873).
  - Add generated man pages for yr and its subcommands under cli/man/ (a3d3f31).
  - Share compiled regular expressions and regexp sets across Scanner instances in Rules (#665).
  - Multiple performance and memory usage improvements in the scanner, FastVM, and dotnet and dex modules (0258378, 18d2d89, d75b776, ec3a736, 33c01a1, a35f733, 348fa69).
  - Increase the maximum WASM function instruction limit (MAX_FUNC_INSTRS) from 100,000 to 300,000 to support larger rule conditions (3533f81).
  - Highlight all YARA keywords and operators in the Playground editor (#856).
  - BUGFIX: Eliminate terminal flickering during yr scan by replacing indicatif with a lightweight synchronized terminal renderer (6b592e0).
  - BUGFIX: Restrict include directives to regular files inside configured include directories to prevent path traversal (aae52cc).
  - BUGFIX: Fix 0 of them and contiguous 0 of (...) expressions matching when some patterns match (#848).
  - BUGFIX: Fix wrong length and debug underflow in non_matching_rules() when non-matching private rules are present (#846).
  - BUGFIX: Prevent module functions and methods from leaking into the global symbol table or shadowing other modules (#872).
  - BUGFIX: Keep DEX string, type, and prototype indices aligned when entries are skipped, and read non-ASCII MUTF-8 strings in full (#885).
  - BUGFIX: Preserve includes_enabled across Compiler.build() calls in the Python API (8c7c2a3).
  - BUGFIX: Gracefully handle out-of-range timestamps in the Python API and YAML serializer (419f7e0).
  - BUGFIX: Fix build failures when enabling olecf-module, msi-module, or vba-module, or dex-module without crypto (#844, #880).
  - BUGFIX: Enable rsa's pkcs1v15 feature for compatibility with rsa 0.10.0 while continuing to accept RSA keys shorter than 1024 bits (#866).
  - BUGFIX: Fix compiler panics and overflows on method calls without a symbol table, nested field access hoisting, integer read header constraints, and non-UTF-8 include paths (bd52352, 92e236e, 0c940e8, 36c241a).
  - BUGFIX: Fix regular expression compilation and matching bugs involving empty repetitions, LineEnd start-of-buffer handling, and non-wide byte pairs in PikeVM lookarounds (5ed88d3, 15116ba, 69d5d60).
  - BUGFIX: Ensure replace_if_longer only extends existing matches and allows in-place updates at max_matches_per_pattern (8a9aa72, 1b9e3a0).
  - BUGFIX: Fix non-monotonic method_list and table truncation handling in the dotnet module parser (cfe605d).
  - BUGFIX: Harden crx, olecf, authenticode, pe, dotnet, elf, macho, and dex module parsers against excessive memory allocation, unbounded recursion, and algorithmic complexity attacks (0200269, d1c894e, e7d1c7d, afe7227, 693c228, 92e70f1, 19ad91d, 9990355).
