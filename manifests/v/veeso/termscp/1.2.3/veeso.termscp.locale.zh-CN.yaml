ShortDescription: 功能丰富的终端文件传输客户端与文件浏览器，带有 TUI 和双面板浏览，支持 SFTP、SCP、FTP、Kube、S3、GCS、SMB 和 WebDAV。
Description: |-
  termscp 是一款功能丰富的终端文件传输客户端与文件浏览器，支持 SFTP、SCP、FTP 和 FTPS、Kube、S3、Google Cloud Storage (GCS)、SMB 以及 WebDAV。它是一个带有 TUI 的终端工具，可以连接到远程服务器以上传和下载文件，并与本地文件系统进行交互。
  功能特性
  - 双面板浏览器，可同时浏览并操作远程和本地文件系统：创建、删除、重命名、搜索、查看和编辑文件。
  - 通过内置书签和最近连接记录，快速重新连接到常用的主机。
  - 使用你喜爱的编辑器查看和编辑文件。
  - SFTP 与 SCP 认证支持 SSH 密钥或用户名与密码。
  - 内置终端，可在你的系统上运行命令。
  - 个性化定制：主题、自定义文件浏览器格式、可自定义的文本编辑器以及可自定义的文件排序。
  - 大文件传输完成时弹出桌面通知。
  - 文件监视器，使你的更改与远程主机保持同步。
  - 将密码保存在操作系统的密钥保险库中。
