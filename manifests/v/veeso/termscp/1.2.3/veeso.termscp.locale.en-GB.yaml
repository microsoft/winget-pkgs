ShortDescription: A feature rich terminal file transfer client and explorer with a TUI, dual-pane browsing and support for SFTP, SCP, FTP, Kube, S3, GCS, SMB and WebDAV.
Description: |-
  termscp is a feature rich terminal file transfer client and explorer, with support for SFTP, SCP, FTP and FTPS, Kube, S3, Google Cloud Storage (GCS), SMB and WebDAV. It is a terminal utility with a TUI that connects to a remote server to retrieve and upload files and to interact with the local file system.
  Features
  - Explore and operate on the remote and on the local machine file system with a dual-pane UI: create, remove, rename, search, view and edit files.
  - Connect to your favourite hosts through built-in bookmarks and recent connections.
  - View and edit files with your favourite text editor.
  - Authenticate SFTP and SCP sessions with SSH keys or with a username and password.
  - Embedded terminal for executing commands on the system.
  - Customizable themes, file explorer format, text editor and file sorting.
  - Get notified through desktop notifications when a large file has been transferred.
  - Keep file changes synchronized with the remote host.
  - Save your password in your operating system key vault.
