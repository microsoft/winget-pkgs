ReleaseNotes: |-
  🚀 Escrcpy 3.2.0 — Smoother Embedded Mirroring, Stronger Cross-Platform Support
  Escrcpy 3.2.0 focuses on improving the embedded mirroring experience, device control, cross-platform support, and AI Copilot.
  This release brings smoother embedded mirroring interactions, new Always on Top and Fullscreen features, more reliable keyboard and mouse mapping, and official Linux ARM64 support. It also fixes several issues on Windows, including application launching and audio forwarding problems.

  ✨ Highlights
  🖥️ A Major Upgrade to Embedded Mirroring
  The embedded mirroring experience has been comprehensively optimized for better performance, responsiveness, and stability.
  📌 New Always on Top
  You can now keep the embedded mirroring window above other windows.
  This is especially useful for device monitoring, remote control, and multi-device workflows, eliminating the need to constantly switch between windows.
  🖥️ New Fullscreen Mode
  Embedded mirroring now supports quickly entering fullscreen mode, giving you a larger display area for the mirrored device.
  🎮 Smoother Gaming and Real-Time Control
  The underlying embedded mirroring architecture has been refactored and optimized to provide:
  - Lower input latency
  - Fewer frame drops and stutters
  - More efficient video stream processing
  - Improved stability during high-frequency interactions
  - A better experience for gaming and other real-time control scenarios
  ⌨️ More Reliable Keyboard & Mouse Mapping
  Keyboard and mouse mapping has been further improved:
  - Fixed certain key conflicts
  - Improved event handling caused by modifier keys
  - Increased stability for complex keyboard and mouse interactions
  - Improved handling of certain special keys on Windows
  Keyboard and mouse mapping is now more reliable for gaming, remote control, and complex interaction scenarios.
  🪟 Improved Window Behavior
  Window behavior has been further optimized across Windows, macOS, and other platforms, including:
  - Window resizing
  - Video aspect-ratio adaptation
  - Window scaling
  - Screen rotation
  - Embedded mirroring window behavior
  This provides a more natural and stable relationship between the mirrored device display and the application window.

  🐧 Official Linux ARM64 Support
  Escrcpy 3.2.0 officially adds support for the Linux ARM64 architecture.
  Escrcpy can now run on a wider range of ARM Linux devices and desktop environments, with further improvements to the Linux packaging and runtime environment.
  - 🚀 Official Linux ARM64 support
  - 🐧 Support for more Linux distributions
  - 📦 Improved Linux packaging and build configuration
  - 🔧 Fixed Linux sandboxing and packaging-related issues
  This makes Escrcpy better suited for ARM Linux computers, development boards, and other ARM64 environments.

  🔊 Fixed Windows Audio Forwarding
  Fixed an issue that caused audio forwarding to malfunction on Windows when using embedded mirroring.
  Audio forwarding should now provide a more stable experience when using embedded mirroring on Windows.

  🤖 A Smoother Copilot Experience
  This release includes multiple interaction and performance improvements to the Copilot module:
  - Improved conversational interaction
  - Improved AI response handling
  - Increased stability during conversations
  - Improved overall Copilot performance
  - Updated built-in AI models
  Copilot is now smoother when understanding requirements, handling continuous conversations, and performing device operations.

  ⚡ Improved Stability and Usability
  This release also fixes and improves a number of issues that may affect everyday usage:
  - 🐛 Fixed application launch issues when starting Escrcpy through shortcuts on Windows
  - 🐛 Fixed an issue where embedded mirroring could fail to start after changing preferences in certain situations
  - 🐛 Fixed abnormal application lists in embedded mirroring under multi-device control mode
  - 🐛 Fixed audio forwarding issues with embedded mirroring on Windows
  - 🐛 Fixed abnormal video dimensions and window aspect ratios in embedded mirroring on macOS
  - 🐛 Fixed an issue where the mouse could not be automatically released by certain camera control shortcuts
  - 🐛 Fixed issues with custom binary dependency configuration
  - ⚡ Improved the automatic update check experience
  - ⚡ Improved default save path initialization
  - ⚡ Improved dialog component layouts
  - ⚡ Improved recovery from video stream failures

  🏗️ Architecture and Performance Improvements
  In addition to user-facing improvements, this release includes extensive underlying architectural and performance optimizations:
  - Refactored the wscrcpy architecture to improve embedded mirroring performance
  - Unified embedded mirroring window behavior across different platforms
  - Optimized underlying mirroring dependencies
  - Optimized the keyboard and mouse mapping architecture
  - Improved MCP Server performance and stability
  - Refactored Electron packaging configuration
  - Improved the Linux build and release process
  - Optimized project development and build configuration

  ❤️ Escrcpy 3.2.0
  From device mirroring to device control, and from Windows / macOS to Linux ARM64, Escrcpy 3.2.0 takes another step forward in cross-platform support and overall user experience.
  Smoother mirroring, more reliable control, broader platform support, and more natural AI interaction.
  Thank you for your continued support of Escrcpy
