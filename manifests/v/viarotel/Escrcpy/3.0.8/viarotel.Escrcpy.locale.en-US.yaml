ReleaseNotes: |-
  🚀 Escrcpy 3.0.8 — Smarter Device Control & Automation
  Escrcpy 3.0.8 is the first official public release of the 3.0 series.
  This release focuses on three major directions: intelligence, automation, and efficient device management.
  It introduces the brand-new Shortcut module for faster device operations, enhances the file manager with Quick Access, adds visual recognition-based automation judgment, and introduces a new MCP (Model Context Protocol)-based AI automation architecture.
  In addition, this release brings significant improvements to keyboard and mouse mapping, preference management, AI Copilot experience, MCP stability, build infrastructure, and overall system reliability.
  With these upgrades, Escrcpy continues evolving from a traditional device control tool into a smarter, more efficient, and more extensible device automation platform.

  ✨ Major Highlights
  ⚡ New Shortcut Module — Instant Device Operations
  A brand-new Shortcut module is introduced to provide a faster and more convenient way to perform frequently used device operations.
  Key capabilities:
  - Execute common device actions instantly through keyboard shortcuts
  - Perform shortcut operations on specific devices
  - Quickly trigger actions including:
    - Start device mirroring
    - Start screen recording
    - Execute frequently used device commands
    - Run automation tasks
  The previous scheduled task system has also been redesigned and deeply integrated with the Shortcut module.
  By combining instant actions and scheduled automation into a unified workflow system, Escrcpy makes it easier to create, manage, and execute device automation tasks.
  From simple quick operations to complex automation workflows, Escrcpy now provides a more efficient device control experience.

  📁 Enhanced File Manager Experience — Quick Access & Smart Sorting
  The file manager has received a major usability upgrade with the introduction of Quick Access.
  New capabilities:
  - Quickly access frequently used files and folders
  - Support favorites:
    - Add frequently used files to favorites
    - Add frequently used folders to favorites
  - Support recent access history:
    - Quickly return to recently used locations
    - Reduce repeated navigation operations
  The default sorting behavior has also been redesigned to better match user expectations:
  - Folders are displayed before files
  - Items are sorted alphabetically
  - Provides a more natural and intuitive browsing experience
  These improvements make device file management faster and more efficient.

  👁️ Visual Recognition for Smarter Automation Scripts
  The automation script editor now supports image recognition-based conditional logic, enabling smarter and more flexible automation workflows.
  New capabilities:
  - Detect whether specific content appears on the screen
  - Execute different actions based on recognition results
  - Build more complex conditional automation processes
  Compared with traditional coordinate-based automation, visual recognition provides better adaptability across:
  - Different device resolutions
  - Different interface layouts
  - Dynamic application states
  Automation scripts are no longer limited to fixed step execution — they can now analyze device status and respond intelligently.

  🤖 MCP-Based AI Automation Architecture
  Escrcpy 3.0.8 introduces a new MCP (Model Context Protocol)-based AI automation architecture.
  Compared with traditional solutions built around a single AI model, the new architecture provides a more open and extensible AI integration framework.
  Key improvements:
  - Support more AI models with visual understanding capabilities
  - Remove dependency on a single AI model solution
  - Enable more flexible AI capability extensions
  - Improve compatibility with future AI ecosystems
  New AI management features:
  - AI conversation session management
  - Custom model configuration
  - Custom AI provider support
  This release also improves MCP communication and reliability:
  - Optimized MCP Client internal logic
  - Improved MCP service stability
  - Fixed MCP Server startup issues in packaged environments
  With MCP architecture, Escrcpy provides a stronger foundation for future intelligent device interaction.

  🎮 Complete Keyboard & Mouse Mapping Reconstruction
  The keyboard and mouse mapping system has been completely redesigned to provide a more stable and natural control experience.
  This release addresses several historical issues:
  - Fixed touch interruption during long-press mappings
  - Improved multi-touch support
  - Enhanced stability in complex input scenarios
  - Improved overall mapping experience
  The new mapping system provides more reliable control, especially for gaming and scenarios requiring complex interactions.

  ⚙️ Preference System Redesign
  The global and device-specific configuration system has been redesigned.
  Improvements include:
  - Reorganized configuration structure
  - Clearer separation between global settings and device settings
  - Improved configuration management logic
  - More intuitive settings experience
  This resolves previous issues where configuration relationships were difficult to understand and manage.
  Users can now easily find, modify, and manage Escrcpy settings.

  🧠 AI Copilot Experience Improvements
  The AI Copilot system has received continuous improvements:
  - Optimized Copilot interaction details
  - Improved AI conversation experience
  - Optimized system prompt logic
  - Reduced unnecessary reasoning loops caused by unclear context
  - Improved AI task execution stability
  These improvements help AI better understand user intentions and complete device operations more reliably.

  ⚡ Performance Improvements
  - Improved AI Copilot overall performance
  - Optimized MCP Client logic
  - Enhanced MCP service reliability
  - Optimized image recognition and matching algorithms
  - Improved automation script editor experience
  - Improved Shortcut module execution efficiency
  - Optimized automatic mirroring startup flow
  - Optimized sub-package build logic
  - Improved project build performance
  - Updated automatic release scripts
  - Optimized cumulative subscription recharge calculation logic
  - Removed redundant dependencies and improved maintainability

  🎨 UI / UX Improvements
  - Improved AI conversation interface
  - Optimized Shortcut module interaction experience
  - Improved scheduled task management experience
  - Enhanced file manager usability
  - Improved command execution and terminal presentation
  - Refined overall UI consistency

  🐛 Bug Fixes
  - Fixed keyboard mapping touch interruption issues
  - Fixed multi-touch mapping failures
  - Fixed Shortcut module configuration import issues
  - Fixed shortcut configuration saving issues
  - Fixed AI model default configuration initialization issues
  - Fixed AI response display problems
  - Fixed custom executable configuration not taking effect
  - Fixed batch mirroring startup window issues
  - Fixed screenshot orientation issues
  - Fixed casting scroll direction issues
  - Fixed MCP Server startup failures after packaging
  - Fixed GitHub Actions build issues
  - Fixed dependency build problems

  🏗 Architecture & Infrastructure
  - Introduced MCP foundations for AI-powered device control
  - Improved MCP module design and reusability
  - Enhanced mscrcpy stability
  - Optimized modular architecture
  - Improved build and release workflows
  - Increased code maintainability and long-term scalability
