ReleaseNotes: Initial release of paperq. Includes a repository-local Markdown queue, safe concurrent claiming, lifecycle commands, JSON output, optional AGENTS.md integration, and standalone Native AOT executables for Windows x64, Linux x64, and Linux ARM64.
ReleaseNotesUrl: https://github.com/Vathivis/paperq/releases/tag/v0.1.0
InstallationNotes: Run `paperq init` from a repository root to create its local papercut queue.
