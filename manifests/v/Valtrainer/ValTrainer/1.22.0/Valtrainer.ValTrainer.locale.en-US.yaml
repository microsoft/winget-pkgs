ReleaseNotes: |-
  Added
  - Your sens history, in the coach's Sensitivity panel: if you change your sensitivity between sessions, the new YOUR SENS HISTORY tab shows which sens you actually score best with. Each sens gets its runs, drills, score vs your average, accuracy and kill time. The comparison is fair: a drill is only compared with your own runs of the same drill, difficulty and gun, and sens within 2% of each other (or the same cm/360 after a DPI change) count as one. It names a best sens only once each sens has at least 10 runs over 3 drills and the difference is too big to be luck. Otherwise it says there's no clear difference yet, or how many more drills to play at a sens. If you've only played one sens so far, it points you to the Sens Finder (suggested on Discord).
  - Sens Finder: Compare 2 sens. Got two sensitivities you like and can't decide? Shoot COMPARE 2 SENS on the Sens Finder's start screen, enter both (shoot a value and type it, or use the − / + cards) and play 8 short blind rounds of flicks, micro-adjustments and tracking. You only see Setting A and Setting B, in a random order. The result tells you which sens you aimed better with, by how much and how sure that is, or that there was no clear difference. It splits it up into flicks, micro-adjustments and tracking, shows the eDPI and cm/360 of both, and gives you the midpoint between them: if both feel fine and neither wins clearly, that's a reasonable middle to settle on. ValTrainer remembers the two values for next time. The normal Sens Finder works exactly as before (suggested on Discord).
  Download: ValTrainer-1.22.0-Setup.exe (installer, recommended) or ValTrainer-1.22.0-Portable.zip (unzip and run, no install). Windows 10 (1607+) or 11, 64-bit.
  ValTrainer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC": click More info -> Run anyway. Check your download against SHA256SUMS.txt if you like.
