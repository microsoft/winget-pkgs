ReleaseNotes: |-
  Added
  - Mouse DPI and polling rate in the ESC menu, and setups in your sens history. The ESC menu now has your mouse DPI (type it or use the arrows) next to the sensitivity, plus your polling rate (125 to 8000 Hz, or not set), so you can change them mid-training without going to Settings. The polling rate is also in Settings, next to the DPI. ValTrainer can't read either from your mouse, so set them to what your mouse software uses. Every run now remembers both, and the coach's YOUR SENS HISTORY tab gets COMPARE BY: SENS, DPI, POLLING RATE or FULL SETUP (sens + DPI + polling rate together), with the same fair comparison as before. Runs played without a polling rate set are shown as unknown and never named best (suggested on Discord).
  - Strafe Jump, a new movement drill: cross an open gap that an enemy rifler is holding, from cover to cover, again and again. Get to full speed while you're still in cover, run (or jump at the edge) across at full speed and keep holding the key through the landing. Walk, crouch, stop or let go of the key in the air and you're slow in his sightline. Each crossing is graded on how long he saw you, the speed you kept and your landing, with a tip for what went wrong. The defender reacts and aims by the difficulty you pick: a slow crossing that a Rookie (Iron–Bronze) misses gets you killed by a Pro (Radiant). The results show which crossings you survived, jumping or running. Honest note: VALORANT has no Counter-Strike-style bunny hop, so jumping or strafing in the air never makes you faster than running; the drill teaches keeping your speed, not gaining it. With a minimap, and recorded for the coach and 3D Rewind like the other movement drills (suggested on Discord).
  - Room themes for the training rooms (the aim, Aim+ and movement drills): pick a look in Settings → Graphics → Room theme. DARK (dark grey walls, a night sky and a dim moon instead of the bright sun, so nothing burns your eyes) and DEFAULT (today's bright range) are free. Six more unlock as you level up by training: HIGH CONTRAST (level 3), MIDNIGHT (5), CONCRETE (8), SUNSET (11), DESERT (15) and NEON GRID (20). Click the setting to see every theme with a preview and the level it needs. Targets stay easy to see in every theme: in the dark rooms they get a light body with your enemy-colour outline. The maps keep their own look. Cosmetic only (suggested on Discord).
  Download: ValTrainer-1.23.0-Setup.exe (installer, recommended) or ValTrainer-1.23.0-Portable.zip (unzip and run, no install). Windows 10 (1607+) or 11, 64-bit.
  ValTrainer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC": click More info -> Run anyway. Check your download against SHA256SUMS.txt if you like.
