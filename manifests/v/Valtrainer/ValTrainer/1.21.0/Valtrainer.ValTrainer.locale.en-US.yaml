ReleaseNotes: |-
  Added
  - Summit, VALORANT's newest map (suggested on Discord): B Lobby → B Main → B Site at true scale, traced from the official minimap, in Site Clear, Deathmatch, Post-Plant, Retake, Site Anchor and the agent drills. Defenders hold Close box, Close left, Boxes, Corner, the pillar cubby, B Drop, Gym door, B Link and the B Tower high ground. Heights are estimates, the B Wall stays open (dropping the walls isn't in ValTrainer) and the rope up to B Tower isn't modelled.
  - A minimap in Jump Peek and Jiggle Peek (suggested on Discord), in the top-left corner like in VALORANT, so you get used to glancing at it while you peek. It shows the walls and boxes, you as an arrow with your field of view, and the Operator as a red dot only while you can see him or right after he fires or you hit him, then the dot fades where you last saw him. It turns with your view by default; pick FIXED (north up, whole area) in Settings → Gameplay → Minimap. Turn it off per drill in the drill preview (M). It's drawn from ValTrainer's own level shapes, not Riot's map art.
  - Two maps from the current competitive pool (suggested on Discord), in the map picker and every map drill (Site Clear, Deathmatch, Post-Plant, Retake, Site Anchor and the agent drills):
    - Lotus, A Main → A Site: up the roots out of A Lobby, past the Rubble in A Main, then onto A Site through Main or through the rotating A Door and the Tree room. Defenders hold the Stairs, Top, the Drop ledge, the Hut, Default, Back site and Tree. The rotating door stands still in its open position, and the breakable wall to A Link stays shut.
    - Corrode, B Main → B Site: down B Lobby, along B Main and out of the Main pocket onto B Site, with the salt machine, the raised platform, B Link, B Elbow and B Tower looking down on the site.
      Both are traced at true scale from the official minimaps, like the other maps. Heights and props are close approximations, not exact copies.
  - Two new maps from VALORANT's current map pool (suggested on Discord), for every map drill (Site Clear, Retake, Post-plant, Anchor, Deathmatch and the agent drills):
    - Abyss, B Main → B Site: push from B Lobby through B Main onto B Site, with B Tower above you, B Nest, and B Danger, the ledge across the gap. Abyss has no outer walls: if you fall off the edge, you die.
    - Sunset, A Main → A Site: walk up A Main from A Lobby and swing onto A Site past the Site box, Default, A Alley, A Link and Back site.
      Both are true to scale, traced from the official minimaps. The heights are estimates.
  Changed
  - Footsteps you can locate by ear (suggested on Discord). Enemy footsteps are new: a sharp, hard running step with a low thump, like on VALORANT's concrete and tile, alternating left and right foot, never twice exactly the same. They change with what the enemy runs on: concrete, tile, metal walkways and containers, wooden crates, snow and sand. Each step now comes from the enemy's feet with much clearer direction: a step on your left is clearly in your left ear, and a step behind you sounds duller than one in front. Distance is easier to read: near steps are crisp, far ones duller, a little roomier and quieter, and they fade out at about 40 m, like in VALORANT. Steps behind a wall sound muffled. Walking and crouching are still silent. This works everywhere enemies run: Deathmatch, Sound Lock, Site Anchor, Peek Mix and the other bot drills. Your own steps use the new sounds too. Headphones give the best direction.
  - Jump Peek now teaches the jump peek itself (suggested on Discord). Every jump from the corner is judged when you land: a clean jump peek means you saw the Operator (or already knew where he was), landed back behind the corner, and didn't shoot in the air. You get a banner telling you what went right or wrong (landed in the open, shot in the air, or saw nothing), a "Clean jump peeks" count on screen and on the results screen. The drill preview's demo now shows a proper jump peek: a running start, the jump right at the corner's edge, and the opposite key in the air. Jumping, landing inaccuracy and stopping already matched VALORANT's numbers and are unchanged; the details are in docs/research/minimap-jumppeek-1.21.md.
  Fixed
  - You could slip through walls and buildings, or drop into the floor, mostly on Breeze but on most maps. When you were already brushing a long wall, a frame could push you to the far end of it, right into the building behind. Fast moves (dashes, blasts, a stutter) could also skip through thin railings. Movement now pushes you out the shortest way and splits fast moves into small steps. Running, jumping and counter-strafing feel exactly the same as before. A new check drives bodies around every map for millions of frames, with random keys, jumps, frame spikes and dashes, and none of them ends up inside a wall.
  - Gaps between objects: closed 52 thin see-through slits on 9 maps, between crates and walls and between some buildings. They were too narrow to walk through, but you could see, and be seen, through them. On Breeze, these were the crate stack by the A Main exit, the Chop Shop door frame and the stairs.
  Download: ValTrainer-1.21.0-Setup.exe (installer, recommended) or ValTrainer-1.21.0-Portable.zip (unzip and run, no install). Windows 10 (1607+) or 11, 64-bit.
  ValTrainer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC": click More info -> Run anyway. Check your download against SHA256SUMS.txt if you like.
