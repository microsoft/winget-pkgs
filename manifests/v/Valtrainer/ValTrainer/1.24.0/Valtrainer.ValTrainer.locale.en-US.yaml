ReleaseNotes: |-
  Changed
  - Counter-strafing now stops you as fast as in VALORANT (suggested on Discord): tapping the opposite key stops you in about 0.10 s instead of 0.15 s, so you can shoot accurately about 25 ms sooner after a counter-strafe. Measured from real VALORANT footage; just letting go of the keys and getting up to speed were already a match and didn't change. Bots strafe by the same rules. The coach's stop-time targets moved down to match.
  - Recoil and spread now use the real per-gun curves (suggested on Discord). Every gun's spray pattern, bullet spread, recovery and tap efficiency now come from VALORANT's game files, as published by valorant.gs, instead of our estimates. The biggest change: sprays climb much harder and sooner. The Vandal now kicks up 7.6° by its 8th bullet and then bounces around 8°, drifting 2° to the side and wobbling left and right (before: 4.5°, reached later). The Phantom climbs to about 6.5–7°, the Spectre to 5.4°, and the Odin and Ares keep climbing over the whole magazine. Pistols and the Sheriff kick less but have no sideways recoil, and their spread grows faster when you spam (Sheriff: 0.25° → 1.1° → 2.75°). Aiming down sights now also cuts the Vandal, Phantom, Warden and Odin recoil by 30%, with the game's aimed spread. Shooting while walking is less accurate, like in VALORANT: 3° as soon as you leave the accurate speed, up to almost 5° at walking speed with a rifle. Running and crouching multipliers and jump inaccuracy follow the files too (Phantom and Bulldog 13° in the air). How we read the numbers and every gun's before and after are in docs/research/recoil-1.24.md. Chamber's guns aren't in the data and are unchanged. The Judge's kick was measured from real Range footage instead: each shot kicks about 2° and settles before the next, with no climb and no sideways drift, like in VALORANT.
  Fixed
  - Bots could shoot you the moment you swung, before you could see them. A bot standing back from a corner could see your shoulder while none of it was on your screen yet, and it started reacting right then, so by the time it appeared it had already reacted. Bots now only start reacting once you could see some of them too, in every drill with bots. Bots also no longer snap straight onto your head when they pre-aim your spot or you re-peek them: their crosshair is always a little off, so they need a small adjustment like a human, and no bot reacts faster than a human can (150 ms at Pro, more at the lower difficulties; a re-peek used to get as fast as 70 ms). Against a Pro (Radiant) bot, the time from it appearing on your screen to its first shot now always takes more than 150 ms and usually 210 to 310 ms (it could be as little as 20 to 70 ms before). Bots that already see you standing in the open kill you as fast as before (reported on Discord).
  Download: ValTrainer-1.24.0-Setup.exe (installer, recommended) or ValTrainer-1.24.0-Portable.zip (unzip and run, no install). Windows 10 (1607+) or 11, 64-bit.
  ValTrainer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC": click More info -> Run anyway. Check your download against SHA256SUMS.txt if you like.
