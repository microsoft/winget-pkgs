ReleaseNotes: |-
  Added
  - Microshot Dense (suggested on Discord): a new Aim drill with two small heads on screen at once, close together. Hit one and it reappears right next to the other, so every shot is a tiny, precise correction at speed. Higher tiers bring smaller gaps and farther heads. Accidental double-clicks are forgiven, like in Microshot and Gridshot.
  - Unlimited ammo (suggested on Discord): drills with real magazines (the bot drills, Sheriff One-Taps, the peek drills, Operator and more) get an AMMO row in their preview. Press U or click it to play without reloads; ValTrainer remembers it per drill. These runs still get a score and a coach review but don't count for your personal bests, because skipping reloads makes scores incomparable. The spray drills keep their real magazine: the magazine is the spray.
  - Settings → Graphics → Renderer: pick Vulkan, DirectX 12 or OpenGL (safe graphics), or leave it on Auto. It applies when you restart ValTrainer.
  - Sens Finder: aiming style and mousepad (suggested on Discord). Its start screen is now a set of cards you shoot to choose. HOW DO YOU AIM? shows Wrist, Hybrid and Arm, each with an animated drawing of what moves and where it pivots. YOUR MOUSEPAD shows Small, Medium, Large and Extended pads drawn to scale next to the same keyboard and mouse, so you can compare with your desk (or pick Not sure). The micro test, the short test and START are cards too. The test then only tries sensitivities that suit you: wrist aimers get a higher-sens range that fits a comfortable wrist turn, arm aimers a lower one, and a 180° turn always fits on your pad. The result says what was searched, e.g. "Wrist aimer · 32 cm pad: searched 15–40 cm/360". ValTrainer remembers your choices. If you leave them on Hybrid and Not sure, the test works exactly as before.
  - Hush, the new Duelist (suggested on Discord), on the Agents screen with two signature drills played with her own abilities on your VALORANT keybinds:
    - Mobility Entry (Hush): Flow (C) drops an anchor where you aim and pulls you to it, even up onto a ledge, for an off-angle entry. Displacement (E) drags defenders out of cover toward its blast and concusses anyone who slams into a wall or another player. LMB throws it, RMB sticks it to a wall, and the key again sends it toward your crosshair.
    - Flash & Peek (Hush): throw Flashbulb (Q) and redirect it toward your crosshair in flight (or stick it to a wall and launch it later), then swing while the defenders are blind.
    Riot has only published the inputs, Displacement's reset every two kills and the 8-point ultimate. Every distance, speed and time here (Flow's 15 m reach, 0.4 s delay and 18 m/s, the 7 m pull, the flash's 2 s blind and so on) is an estimate, and will be updated when real values are known. Her sounds and effects are ValTrainer's own. Suspension and Telekinesis are listed, but don't have a drill.
  Changed
  - Best badge per difficulty (suggested on Discord): the drill cards and the drill preview now show the best badge you earned at the difficulty you have selected, next to your best score at that difficulty. Before, they showed your best badge from any difficulty, so a badge from an easy tier also showed on Radiant.
  Fixed
  - ValTrainer closing by itself as soon as a bot appeared on some laptops with Intel graphics (reported on Discord). That was the graphics driver crashing on Vulkan. Now, if ValTrainer didn't close normally last time, it restarts on DirectX 12 and says so on the menu, and if DirectX 12 crashes too, it switches to OpenGL. You can change it back in Settings → Graphics → Renderer. If you're affected on 1.19.0, start ValTrainer with the "ValTrainer (safe graphics)" shortcut in the Start menu until you update.
  Download: ValTrainer-1.20.0-Setup.exe (installer, recommended) or ValTrainer-1.20.0-Portable.zip (unzip and run, no install). Windows 10 (1607+) or 11, 64-bit.
  ValTrainer isn't code-signed yet, so Windows SmartScreen may say "Windows protected your PC": click More info -> Run anyway. Check your download against SHA256SUMS.txt if you like.
