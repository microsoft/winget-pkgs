ShortDescription: Docker on Windows without Docker Desktop or WSL, a standalone container manager with its own tiny Linux machine.
Description: |-
  Solon is a standalone, open-source container manager for Windows. One installer provides a complete Docker engine
  (dockerd, containerd, Docker Compose) running inside a small Linux machine that Solon creates and manages itself
  through the Windows Host Compute Service, with no dependency on Docker Desktop or WSL.
  It offers container, image, volume and network management, Compose projects with a gallery of ready-made stacks,
  trusted local HTTPS addresses for every container (https://<name>.solon.local), fast sharing of Windows folders,
  wake-on-demand for idle containers, a debug shell that works even in images without a shell, and live CPU,
  memory and network charts. Solon sends no telemetry.
  Requires Windows 10 22H2 or Windows 11, any edition including Home, with hardware virtualization enabled.
