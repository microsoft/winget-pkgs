PackageIdentifier: ValereNeveux.Solon
PackageVersion: 0.1.13
PackageLocale: fr-FR
Publisher: Valère Neveux
PackageName: Solon
License: Apache-2.0
ShortDescription: Docker sur Windows sans Docker Desktop ni WSL, un gestionnaire de conteneurs autonome avec sa propre petite machine Linux.
Description: |-
  Solon est un gestionnaire de conteneurs autonome et open source pour Windows. Un installateur fournit un moteur
  Docker complet (dockerd, containerd, Docker Compose) qui tourne dans une petite machine Linux que Solon crée et
  gère lui-même via le service Windows Host Compute, sans Docker Desktop ni WSL.
  Gestion des conteneurs, images, volumes et réseaux, projets Compose avec une galerie de piles prêtes, adresses
  HTTPS locales de confiance pour chaque conteneur (https://<nom>.solon.local), partage rapide des dossiers
  Windows, mise en veille des conteneurs inactifs, shell de débogage même dans les images sans shell, courbes
  CPU, mémoire et réseau en direct. Aucune télémétrie.
  Nécessite Windows 10 22H2 ou Windows 11, toute édition, Famille comprise, avec la virtualisation matérielle activée.
Tags:
- conteneurs
- docker
- docker-compose
- hyper-v
- outils-de-developpement
