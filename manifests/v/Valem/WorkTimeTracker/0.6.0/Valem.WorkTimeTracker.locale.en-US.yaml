ShortDescription: Works out your working time per day and week from when you use your Windows laptop.
Description: |-
  Work Time Tracker notes when you use your Windows 11 laptop and works out each workday's start, end,
  lunch break and total, and each week's total, for your timesheet. Days before the install are rebuilt
  from what Windows keeps. A year planner books your holidays around your canton's public holidays. Your
  times stay on your laptop; the app's only request fetches public holidays from OpenHolidays. German
  screens, Swiss formats.
