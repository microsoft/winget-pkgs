ShortDescription: A small tray app that reminds you to switch between sitting and standing.
Description: |-
  StandMate lives in the system tray and shows a small popup with a sound when it's time to stand up or sit down. It has five schedule modes, custom "mates" (your own GIFs and sounds), pausing when you're away from the PC, and in-app updates. It only connects to the internet when you check for or install an update, and it doesn't collect any data.
