ShortDescription: ncdu-like disk cleanup TUI for Windows with safe rules, optional AI classification and Docker cleanup.
Description: |-
  wcm scans a drive in parallel, shows an ncdu-style tree and suggests what is safe to delete:
  stale node_modules and build outputs, package caches, temp files, Windows Update leftovers, crash dumps and unused Docker images.
  System folders, documents and .git folders are protected and re-checked right before deletion; deletion goes to the Recycle Bin by default.
  Large unknown folders can optionally be classified by the Jev model via OpenRouter, with a hard per-scan budget.
